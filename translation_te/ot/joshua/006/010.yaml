id: JOS.6.10
reference: Joshua 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ לֵ/אמֹ֗ר לֹ֤א תָרִ֨יעוּ֙ וְ/לֹֽא תַשְׁמִ֣יעוּ אֶת קוֹלְ/כֶ֔ם וְ/לֹא יֵצֵ֥א מִ/פִּי/כֶ֖ם דָּבָ֑ר עַ֠ד י֣וֹם אָמְרִ֧/י אֲלֵי/כֶ֛ם הָרִ֖יעוּ וַ/הֲרִיעֹתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: te
  text: 'యెహోషువ ప్రజలకు ఇలా ఆజ్ఞాపించాడు: “మీరు కేక వేయకూడదు[a]; మీ స్వరం వినిపించకూడదు; మీ నోటి నుంచి ఒక్క మాట కూడా బయటకు రాకూడదు[b]—‘కేక వేయండి!’ అని నేను మీకు చెప్పే రోజు వరకు. అప్పుడు మీరు కేక వేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి, “యుద్ధకేక వేయకూడదు” లేదా “జయధ్వని చేయకూడదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యరూపం: “మీ నోటి నుంచి ఒక మాట బయటకు రాకూడదు.”'
    reason: literal_form
lexical_decisions:
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: ఇది కేవలం సూచించడం కాక అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భం సైనికమైనప్పటికీ, హీబ్రూ పదం సాధారణంగా ‘ప్రజలు’ అనే అర్థాన్నే ఇస్తుంది; ‘సైన్యం’ అని నిర్దిష్టం చేయలేదు.
- source_word: לֹא תָרִיעוּ / הָרִיעוּ / וַהֲרִיעֹתֶם
  choice: కేక వేయకూడదు / కేక వేయండి / కేక వేయాలి
  rationale: ఒకే హీబ్రూ ధాతువు మూడు చోట్ల పునరావృతమైంది. తెలుగు పాఠ్యంలోనూ అదే పదబంధాన్ని పునరావృతం చేసి ఆ అనుసంధానాన్ని నిలిపాం; సందర్భంలో ఇది యుద్ధకేక లేదా జయధ్వని కావచ్చు.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: మీ స్వరం వినిపించకూడదు
  rationale: ‘మీ స్వరాన్ని వినబడేలా చేయకూడదు’ అనే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: మీ నోటి నుంచి ఒక్క మాట కూడా బయటకు రాకూడదు
  rationale: ‘నోటి నుంచి మాట బయటకు రావడం’ అనే మూలభాషా చిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: עַד יוֹם
  choice: రోజు వరకు
  rationale: హీబ్రూలోని స్పష్టమైన కాలసూచకమైన ‘రోజు వరకు’ అనే రూపాన్ని కాపాడుతుంది.
- source_word: אָמְרִי אֲלֵיכֶם
  choice: నేను మీకు చెప్పే
  rationale: ‘నేను మీతో/మీకు చెప్పే’ అనే కాలసంబంధ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
