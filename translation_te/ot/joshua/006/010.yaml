  terminology: “ఆజ్ఞాపించాడు” צִוָּה యొక్క అధికారపూర్వక బలాన్ని సరిగ్గా ఇస్తుంది. “కేక వేయు” పదబంధాన్ని మూడు సంబంధిత హీబ్రూ రూపాలకు నిలకడగా వాడటం మంచిది; యుద్ధకేక/జయధ్వని అనే సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదటిప్పణి తగిన విధంగా ఇస్తుంది.
