translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ఆజ్ఞాత్మక ధోరణిని, ‘కేక వేయు’ అనే పదపునరావృతాన్ని, ‘నోటి నుంచి మాట బయటకు రావడం’ అనే రూపకాన్ని నిలిపాం.
