base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: te
  text: ఏడవ రోజున వారు వేకువ వెలుగు పుట్టగానే లేచి, ఈ విధంగా పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు. ఆ రోజు మాత్రమే వారు పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: వేకువ బయలుదేరే వేళనే
  rationale: అక్షరార్థంగా ‘వేకువ పైకి వస్తుండగా’; తెలుగులో సహజంగా ఉదయం వెలుగు మొదలయ్యే సమయాన్ని తెలియజేస్తుంది.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: మునుపటి విధంగానే
  rationale: ఇక్కడ מִשְׁפָּט అనేది న్యాయతీర్పు కాక, ముందుగా నిర్దేశించిన లేదా అనుసరించిన పద్ధతిని సూచిస్తుంది; సందర్భానికి అనుగుణంగా ‘మునుపటి విధంగా’ అని అనువదించబడింది.
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: చుట్టూ ... తిరిగారు
  rationale: క్రియ నగరాన్ని ప్రదక్షిణగా చుట్టివచ్చడాన్ని సూచిస్తుంది. హెబ్రీ మూలంలో సైనిక నడకను ప్రత్యేకంగా సూచించే పదం లేనందున ‘కవాతు చేశారు’ కంటే విస్తృతమైన ఈ రూపం ఎంచుకోబడింది.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: ఆ రోజు మాత్రమే
  rationale: 'רַק ఇచ్చే ప్రత్యేక పరిమితిని స్పష్టంగా నిలుపుతుంది: ఏడు చుట్లు వేసింది ఆ రోజున మాత్రమే.'
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. హెబ్రీ వాక్యంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, ఏడవ రోజు ప్రత్యేకతను కాపాడాం. ‘పెందలకడనే’ అనే సుపరిచిత పదంతో వారు చాలా త్వరగా లేచిన భావాన్ని, ‘వేకువ బయలుదేరే వేళనే’తో సమయాన్ని విడివిడిగా వ్యక్తం చేశాం.
