revisions:
- from: ఏడవ రోజున వారు వేకువ బయలుదేరే వేళనే పెందలకడనే లేచి, మునుపటి విధంగానే పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు. ఆ రోజు మాత్రమే వారు పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు.
  to: ఏడవ రోజున వారు వేకువ వెలుగు పుట్టగానే లేచి, ఈ విధంగా పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు. ఆ రోజు మాత్రమే వారు పట్టణం చుట్టూ ఏడుసార్లు తిరిగారు.
  rationale: The revision removes the awkward duplication in the timing phrase, retains the source’s dawn setting and early rising, renders “in this manner” directly, and preserves the deliberate repetition and limitation to that day.
