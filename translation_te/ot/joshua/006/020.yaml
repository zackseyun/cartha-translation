source:
  edition: WLC
  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: te
  text: అప్పుడు ప్రజలు కేక వేశారు[a], బూరలు ఊదారు. ప్రజలు బూర శబ్దం వినగానే గొప్పగా కేక వేశారు. అప్పుడు ప్రాకారం ఉన్నచోటనే కూలిపోయింది[b]. ప్రతి మనిషి తన ఎదుట నేరుగా పట్టణంలోకి ఎక్కి వెళ్లాడు; ప్రజలు పట్టణాన్ని స్వాధీనం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బూర” హీబ్రూ షోఫార్‌ను అనువదిస్తుంది. ఇది సంకేతాల కోసం ఊదే కొమ్ము వాద్యం; “పొట్టేలు కొమ్ము” అనేది మరింత నిర్దిష్టమైన సాధ్యమైన అనువాదం.
    reason: cultural_note
  - marker: b
    text: హీబ్రూ మాటలను అక్షరాలా అనువదిస్తే, “ప్రాకారం దాని కిందనే పడిపోయింది.” ఇది అసాధారణమైన ప్రయోగం; ప్రాకారం తన స్థానంలో నేరుగా కూలిపోయిందని సూచించవచ్చు. “ప్రాకారం నేలమట్టమైంది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: కేక వేశారు / గొప్పగా కేక వేశారు
  rationale: ఈ మూలపదాలు యుద్ధ లేదా ఆరాధనా సందర్భాల్లో వినిపించే బిగ్గర శబ్దాన్ని సూచించగలవు. వచనం స్వయంగా ‘యుద్ధకేక’ అని నిర్దిష్టం చేయనందున సాధారణమైన ‘కేక’ను ఎంచుకున్నాం.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: బూరలు / బూర
  rationale: షోఫార్ సంకేతాల కోసం ఊదే కొమ్ము వాద్యం. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే ‘బూర’ దాని కథనపరమైన విధిని తెలియజేస్తుంది.
- source_word: קוֹל הַשּׁוֹפָר
  choice: బూర శబ్దం
  rationale: קוֹל అంటే ‘స్వరం/శబ్దం’; వాద్యంతో వాడినప్పుడు ‘శబ్దం’ సహజమైన తెలుగు అనువాదం.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: ప్రాకారం ఉన్నచోటనే కూలిపోయింది
  rationale: అక్షరార్థంగా అసాధారణమైన ‘దాని కిందనే పడింది’ అనే భావాన్ని, ప్రాకారం తన స్థానంలో నేరుగా కూలిందనే సహజ తెలుగులో అందించాం; మూలంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וַיַּעַל ... הָעִירָה
  choice: పట్టణంలోకి వెళ్లి
  rationale: עלה యొక్క ‘పైకి వెళ్లడం’ భావం మరియు పట్టణం వైపు కదలికను సందర్భానుసారంగా ‘పట్టణంలోకి వెళ్లి’ అని అందించాం; ‘దూసుకెళ్లారు’ వంటి అదనపు సైనిక తీవ్రతను చేర్చలేదు.
- source_word: אִישׁ נֶגְדּוֹ
  choice: తమతమ ఎదుటి నుంచి నేరుగా
  rationale: ఇది ఒక్కొక్క పురుషుడు తన ఎదుట ఉన్న మార్గంలో నేరుగా ముందుకు వెళ్లిన పంపిణీ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּלְכְּדוּ
  choice: స్వాధీనం చేసుకున్నారు
  rationale: సైనిక కథనంలో לכד పట్టణాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థం ఇస్తుంది.
theological_decisions:
- issue: אִישׁ נֶגְדּוֹ లోని పుంలింగ పంపిణీ ప్రయోగం
  choice: ప్రజలు తమతమ ఎదుటి నుంచి నేరుగా
  alternative: ప్రతి పురుషుడు తన ఎదుటి నుంచి నేరుగా
  rationale: మూలంలోని אִישׁ పుంలింగ ఏకవచనాన్ని పంపిణీ అర్థంలో ఉపయోగిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో ‘తమతమ’ ఆ ఒక్కొక్కరి కదలికను సహజంగా వ్యక్తం చేస్తుంది; ఎవరు ముందుకు వెళ్లారనే విషయాన్ని ‘ప్రజలు’ అనే సమీప కర్త స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘బూర’, ‘ప్రాకారం’, ‘స్వాధీనం చేసుకున్నారు’ వంటి పదాలు సహజతతో పాటు మూలార్థాన్ని నిలుపుతాయి.
