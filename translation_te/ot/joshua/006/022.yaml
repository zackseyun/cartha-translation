  to: 'దేశాన్ని వేగుచూసిన ఆ ఇద్దరు మనుషులతో యెహోషువ ఇలా అన్నాడు: “వేశ్య ఇంట్లోకి వెళ్లి, మీరు ఆమెకు ప్రమాణం చేసిన ప్రకారం ఆ స్త్రీని, ఆమెకు చెందినదంతటినీ అక్కడి నుంచి బయటకు తీసుకురండి.”'
