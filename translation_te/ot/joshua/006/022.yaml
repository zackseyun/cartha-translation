source:
  edition: WLC
  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: te
  text: 'దేశాన్ని వేగుచూసిన ఆ ఇద్దరు మనుషులతో యెహోషువ ఇలా అన్నాడు: “వేశ్య ఇంట్లోకి వెళ్లి, మీరు ఆమెకు ప్రమాణం చేసిన ప్రకారం ఆ స్త్రీని, ఆమెకు చెందినదంతటినీ అక్కడి నుంచి బయటకు తీసుకురండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: ఆ ఇద్దరు మనుషులతో
  rationale: లామెద్ సూచించే సంబోధిత పరోక్ష కర్మను తెలుగులో సహజంగా ‘తో’ ద్వారా వ్యక్తం చేసింది; వావ్‌ను కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: הַמְרַגְּלִים אֶת־הָאָרֶץ
  choice: దేశాన్ని వేగుచూసిన
  rationale: רגל ఇక్కడ రహస్యంగా పరిశీలించడం లేదా గూఢచర్యం చేయడం అనే భావం ఇస్తుంది. గతంలో పూర్తయిన కార్యాన్ని సందర్భానుసారంగా ‘వేగుచూసిన’ తెలియజేస్తుంది.
- source_word: בֹּאוּ בֵּית
  choice: ఇంట్లోకి వెళ్లి
  rationale: בוא అంటే మూలంగా రావడం/ప్రవేశించడం; ఆజ్ఞ ఇస్తున్న యెహోషువ దృష్టికోణం నుంచి ఆధునిక తెలుగులో ‘వెళ్లి’ సహజం. ‘ఇంట్లోకి’ భౌతిక నివాసాన్ని సూచిస్తుంది.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: వేశ్య
  rationale: זוֹנָהకు స్పష్టమైన ఆధునిక తెలుగు సమానం ‘వేశ్య’. హీబ్రూలోని ‘స్త్రీ, వేశ్య’ అనే ఉపపద నిర్మాణాన్ని తెలుగులో యథాతథంగా పెడితే అసహజ పునరుక్తి అవుతుంది.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: అక్కడి నుంచి బయటకు తీసుకురండి
  rationale: హిఫిల్ రూపం ‘బయటకు రప్పించండి/తీసుకురండి’ అనే కారణార్థాన్ని, מִשָּׁם ‘అక్కడి నుంచి’ అనే మూలస్థానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְאֶת־כָּל אֲשֶׁר־לָהּ
  choice: ఆమెకు చెందిన వారందరినీ
  rationale: ఈ సందర్భంలో రాహాబుతో బయటకు తేవలసినవారు ఆమె కుటుంబ సభ్యులు (6:23); కాబట్టి వ్యక్తులను సూచించే ‘వారందరినీ’ సందర్భానికి సహజం. పదబంధం స్వతహాగా ‘ఆమెకు ఉన్నదంతా’ అనే విస్తృత భావాన్ని కూడా కలిగి ఉంటుంది.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: మీరు ఆమెకు ప్రమాణం చేసిన ప్రకారం
  rationale: వారి ఆజ్ఞకు ఆధారం ఆమెకు చేసిన ప్రమాణమేనని తులనాత్మక ఉపవాక్యం నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాహాబును זוֹנָה అని పేర్కొనడం
  choice: వేశ్య
  alternative: వ్యభిచారిణి
  rationale: మూలపదం వృత్తిగా లైంగిక సేవలు అందించే స్త్రీని సూచిస్తుంది. ‘వ్యభిచారిణి’ వివాహేతర లైంగిక ప్రవర్తన అనే వేరే భావాన్ని కలిగించవచ్చు; అందువల్ల దాన్ని ఎంచుకోలేదు.
- issue: כָּל אֲשֶׁר־לָהּ యొక్క పరిధి
  choice: ఆమెకు చెందిన వారందరినీ
  alternative: ఆమెకు చెందినదంతటినీ
  rationale: తదుపరి వచనం కుటుంబ సభ్యులను బయటకు తెచ్చినట్లు వివరిస్తుంది. వ్యక్తులను సూచించే అనువాదం తక్షణ సందర్భానికి సరిపోతుంది; అయినా హీబ్రూ పదబంధం వ్యాకరణపరంగా విస్తృతంగా ఉండగలదనే విషయాన్ని గమనించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘వేగుచూసిన’ బైబిలు పాఠకులకు పరిచితమైనప్పటికీ ఇప్పటికీ అర్థమయ్యే పదం. సంభాషణలో బహువచన ఆజ్ఞారూపం స్పష్టంగా ఉంచబడింది.
