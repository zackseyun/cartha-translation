- from: వారు ఆ పట్టణాన్నీ, అందులో ఉన్న సమస్తాన్నీ అగ్నితో కాల్చివేశారు. అయితే వెండిని, బంగారాన్ని, కంచు మరియు ఇనుప వస్తువులను మాత్రం యెహోవా మందిరపు ఖజానాలో ఉంచారు.[a]
  to: వారు ఆ పట్టణాన్నీ, అందులో ఉన్న సమస్తాన్నీ అగ్నితో కాల్చివేశారు. అయితే వెండిని, బంగారాన్ని, కంచు మరియు ఇనుప వస్తువులను మాత్రం యెహోవా గృహపు ఖజానాలో ఉంచారు.[a]
