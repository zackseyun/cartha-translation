source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: te
  text: వారు ఆ పట్టణాన్నీ, అందులో ఉన్న సమస్తాన్నీ అగ్నితో కాల్చివేశారు. అయితే వెండిని, బంగారాన్ని, కంచు మరియు ఇనుప వస్తువులను మాత్రం యెహోవా గృహపు ఖజానాలో ఉంచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వస్తువులు’కు బదులుగా ‘పాత్రలు’ లేదా ‘పనిముట్లు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఉపకరణాలు, పాత్రలు, ఇతర వస్తువులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: అగ్నితో కాల్చివేశారు
  rationale: క్రియలోని బహువచన కర్తను సహజమైన తెలుగులో నిలిపి, בָאֵשׁ‌ను సాధనార్థకంగా ‘అగ్నితో’ అని అనువదించాం.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: అందులో ఉన్న సమస్తాన్నీ
  rationale: పట్టణంలో ఉన్నవన్నీ అనే సమగ్ర భావాన్ని సంక్షిప్తంగా, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: ముందు చెప్పిన సంపూర్ణ దహనానికి లోహాలు మినహాయింపని తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: వెండిని, బంగారాన్ని
  rationale: జాబితా స్వభావాన్ని సహజమైన తెలుగు ద్వితీయా విభక్తితో అందిస్తుంది.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: కంచు మరియు ఇనుప వస్తువులను
  rationale: כְּלֵי అనే విస్తృత పదాన్ని ‘వస్తువులు’గా ఉంచి, పాత్రలు లేదా పనిముట్లు అని అనవసరంగా పరిమితం చేయలేదు; נְחֹשֶׁת‌కు సందర్భానుకూలంగా ‘కంచు’ వాడాం.
- source_word: נָתְנוּ
  choice: ఉంచారు
  rationale: విలువైన లోహాలను ఖజానాలో జమచేసిన సందర్భంలో נתן‌కు సహజమైన తెలుగు సమానార్థకం.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: యెహోవా మందిరపు ఖజానా
  rationale: אוֹצַר‌ను విలువైన వస్తువుల నిల్వస్థలమైన ‘ఖజానా’గా, בֵּית יְהוָה‌ను ఈ ఆరాధనా సందర్భంలో సహజంగా ‘యెహోవా మందిరం’గా అందించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: లోహాల ఆరాధనా సంబంధిత గమ్యం
  choice: యెహోవా మందిరపు ఖజానాలో
  alternative: యెహోవా మందిరానికి చెందిన ఖజానాలో
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా నిలిపి, అవి పరిశుద్ధస్థలపు ఖజానాలో జమయ్యాయని మాత్రమే చెబుతుంది; అదనపు ఆచారవ్యాఖ్యను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘మందిరం’ అనేది ఇక్కడ తరువాతి కాలపు నిర్మిత దేవాలయాన్ని తప్పనిసరిగా సూచించకుండా, యెహోవా ఆరాధనా నివాసాన్ని సూచించే సాధారణ పదంగా ఉపయోగించబడింది.
