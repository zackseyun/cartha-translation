id: JOS.6.27
reference: Joshua 6:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: te
  text: యాహ్వే యెహోషువతో ఉన్నాడు. అతని ఖ్యాతి[a] దేశమంతటా వ్యాపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని గురించిన వార్త,’ ‘అతని నివేదిక,’ లేదా ‘అతని పేరు.’ హీబ్రూ పదం వార్తను, నివేదికను లేదా ఖ్యాతిని సూచించగలదు; ఇక్కడ యెహోషువకు పెరుగుతున్న ఖ్యాతి అనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וַיְהִי
  choice: ఉన్నాడు
  rationale: ఇక్కడ היה కథన క్రమంలో సాధారణ భూతకాల స్థితిని సూచిస్తుంది; తెలుగులో ‘ఉన్నాడు’ సహజంగా సరిపోతుంది.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: యెహోషువకు తోడుగా
  rationale: היה + אֶת + వ్యక్తి అనే నిర్మాణం సన్నిధి, సహవాసం, సహాయం అనే భావాన్ని ఇస్తుంది; ‘తోడుగా’ దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁמְעוֹ
  choice: అతని కీర్తి
  rationale: שֵׁמַע అనే పదం వదంతి, వార్త, పేరు లేదా ఖ్యాతిని సూచించగలదు. యెరికో విజయానంతర సందర్భంలో యెహోషువకు కలిగిన విస్తృత ఖ్యాతి ప్రధాన భావంగా కనిపిస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటా
  rationale: ఇక్కడ הָאָרֶץ సమస్త భూమిని కాక కథనంలో ప్రస్తావితమైన దేశాన్ని సూచిస్తుంది; ‘దేశమంతటా’ పరిధిని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: పేరును ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత దైవ నామంగా నిలిపాం. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రెండు וַיְהִי వాక్యాలను తెలుగులో సహజ ప్రవాహం కోసం రెండు వాక్యాలుగా ఇచ్చాం; రెండో దానిలోని స్థితి భావాన్ని ‘వ్యాపించింది’ ద్వారా సందర్భానుగుణంగా వ్యక్తపరిచాం.
