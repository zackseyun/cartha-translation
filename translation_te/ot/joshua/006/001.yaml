source:
  edition: WLC
  text: וִֽ/ירִיחוֹ֙ סֹגֶ֣רֶת וּ/מְסֻגֶּ֔רֶת מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ין יוֹצֵ֖א וְ/אֵ֥ין בָּֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: te
  text: యెరికో ఇశ్రాయేలు కుమారుల[a] కారణంగా గట్టిగా మూసివేయబడి ఉండింది[b]; ఎవరూ బయటికి వెళ్లలేదు, ఎవరూ లోపలికి రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయుల కారణంగా.” హీబ్రూలో “ఇశ్రాయేలు కుమారులు” అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సాధారణ సమూహపదం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఒకే ధాతువుకు చెందిన రెండు క్రియారూపాలను జతచేయడం ద్వారా తీవ్రత వ్యక్తమవుతుంది; యెరికో పూర్తిగా భద్రపరచబడి మూసివేయబడిందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: యెరికో
  rationale: వావ్ కథనాన్ని కొనసాగించే సంధిగా పనిచేస్తుంది; తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా స్థలనామంతో సహజంగా వాక్యాన్ని ప్రారంభించాం.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: గట్టిగా మూసివేయబడి ఉంది
  rationale: ఒకే ధాతువుకు చెందిన క్రియారూపాల జత నగరం పూర్తిగా భద్రపరచబడి మూసివేయబడిందనే తీవ్రతను తెలియజేస్తుంది; తెలుగులో సహజమైన తీవ్రతా వ్యక్తీకరణను ఎంచుకున్నాం.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: ఇక్కడ ఇశ్రాయేలు ప్రజల ఉనికిని బట్టి యెరికో మూసివేయబడటానికి కారణం లేదా సందర్భాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘భయంతో’ అనే భావాన్ని చేర్చలేదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన స్థిర సమూహపదాన్ని దగ్గరగా నిలుపుతుంది; ఇది కేవలం పురుషులను కాక ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: ఎవరూ బయటికి వెళ్లలేదు, ఎవరూ లోపలికి రాలేదు
  rationale: నగర ప్రవేశనిష్క్రమణలు పూర్తిగా నిలిచిపోయాయని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
