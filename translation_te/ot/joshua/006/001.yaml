translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమూహపదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం. తీవ్రతను పదేపదే అనుకరించకుండా తెలుగు నుడికారంలో వ్యక్తం చేశాం.
