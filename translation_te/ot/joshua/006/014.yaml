source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ אֶת הָ/עִ֜יר בַּ/יּ֤וֹם הַ/שֵּׁנִי֙ פַּ֣עַם אַחַ֔ת וַ/יָּשֻׁ֖בוּ הַֽ/מַּחֲנֶ֑ה כֹּ֥ה עָשׂ֖וּ שֵׁ֥שֶׁת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: te
  text: రెండవ రోజున వారు నగరం చుట్టూ ఒకసారి తిరిగి, శిబిరానికి తిరిగి వచ్చారు. ఇలాగే వారు ఆరు రోజులపాటు చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: చుట్టూ తిరిగారు
  rationale: סבב ఇక్కడ పట్టణం చుట్టూ వెళ్లడాన్ని సూచిస్తుంది. ‘చుట్టూ తిరిగారు’ సహజమైన ఆధునిక తెలుగు; మూలంలో స్పష్టంగా లేని అదనపు సైనిక భావాన్ని చేర్చదు.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: עִיר అనేది పట్టణం లేదా నగరాన్ని సూచిస్తుంది. యెరికో సందర్భంలో ‘పట్టణం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: రెండవ రోజున
  rationale: కాలాన్ని సూచించే ఈ పదబంధానికి మూలానికి దగ్గరగా ఉండే సహజ తెలుగు రూపం.
- source_word: פַּעַם אַחַת
  choice: ఒకసారి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఒక సారి’; తెలుగులో ‘ఒకసారి’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וַיָּשֻׁבוּ
  choice: తిరిగి వచ్చారు
  rationale: שוב అంటే తిరిగి రావడం లేదా వెళ్లడం. శిబిరాన్ని గమ్యంగా పేర్కొన్న ఈ సందర్భంలో ‘తిరిగి వచ్చారు’ సహజమైన కథన రూపం.
- source_word: הַמַּחֲנֶה
  choice: శిబిరానికి
  rationale: מַחֲנֶה అంటే శిబిరం. గమ్యార్థాన్ని తెలుగులో ‘-కు’ విభక్తితో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: כֹּה עָשׂוּ
  choice: ఈ విధంగా వారు ... చేశారు
  rationale: כֹּה క్రియ జరిగిన విధానాన్ని సూచిస్తుంది; עשה సాధారణంగా ‘చేయు’. ఈ కలయికను ‘ఈ విధంగా వారు చేశారు’ అని అనువదించడం సహజంగా ఉండి హీబ్రూ సారాంశ వాక్యాన్ని నిలుపుతుంది.
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులపాటు
  rationale: మూలంలో పదశః ‘ఆరు రోజులు’ ఉన్నా, సందర్భంలో కొనసాగిన కాలవ్యవధిని తెలుగులో ‘ఆరు రోజులపాటు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యల క్రమాన్ని, ‘ఒకసారి’ అనే పరిమితిని, ఆరు రోజుల పునరావృత నమూనాను నిలుపుకుంది.
