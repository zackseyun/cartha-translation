source:
  edition: WLC
  text: וְֽ/אֶת רָחָ֣ב הַ֠/זּוֹנָה וְ/אֶת בֵּ֨ית אָבִ֤י/הָ וְ/אֶת כָּל אֲשֶׁר לָ/הּ֙ הֶחֱיָ֣ה יְהוֹשֻׁ֔עַ וַ/תֵּ֨שֶׁב֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י הֶחְבִּ֨יאָה֙ אֶת הַ/מַּלְאָכִ֔ים אֲשֶׁר שָׁלַ֥ח יְהוֹשֻׁ֖עַ לְ/רַגֵּ֥ל אֶת יְרִיחֽוֹ־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: te
  text: అయితే యెహోషువ వేశ్యయైన రాహాబును[a], ఆమె తండ్రి ఇంటివారినీ, ఆమెకు చెందినదంతటినీ ప్రాణాలతో ఉంచాడు. ఆమె యెరికోపై గూఢచర్యం చేయడానికి యెహోషువ పంపిన సందేశకులను[b] దాచిపెట్టినందున, నేటివరకు ఇశ్రాయేలు ప్రజల మధ్య నివసిస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేశ్యావృత్తి చేసే స్త్రీ.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘సందేశకులు’; సందర్భంలో వీరే యెరికోపై గూఢచర్యం చేయడానికి పంపబడిన మనుషులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: వేశ్యయైన
  rationale: זוֹנָה అనే పదం వేశ్యావృత్తిలో ఉన్న స్త్రీని సూచిస్తుంది. ‘వేశ్య’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, ప్రత్యక్షమైన పదం.
- source_word: בֵּית אָבִיהָ
  choice: ఆమె తండ్రి ఇంటివారిని
  rationale: అక్షరార్థంగా ‘ఆమె తండ్రి ఇల్లు’ అయినా, ఇక్కడ భవనాన్ని కాక ఆమె తండ్రి కుటుంబం లేదా గృహ సమూహాన్ని సూచిస్తుంది.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: ఆమెకు చెందినదంతటినీ
  rationale: ఈ విస్తృత పదబంధం ఆమెకు చెందిన ప్రజలనూ ఆస్తినీ కలుపుకోగలదు; తెలుగు అనువాదం దానిని ఒక వర్గానికే పరిమితం చేయదు.
- source_word: הֶחֱיָה
  choice: ప్రాణాలతో ఉంచాడు
  rationale: חיה యొక్క హిఫీల్ రూపంలో ఉన్న ‘బతికేలా చేయడం/ప్రాణాలతో ఉంచడం’ అనే causative భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַתֵּשֶׁב
  choice: నివసిస్తోంది
  rationale: ‘నేటివరకు’ అనే కాలవ్యక్తీకరణతో కలిసి, గతంలో మొదలై కథకుని కాలం వరకు కొనసాగిన నివాసాన్ని వర్తమాన కొనసాగింపు రూపం తెలుపుతుంది.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల మధ్య
  rationale: ‘ఇశ్రాయేలు మధ్య’ అనే హీబ్రూ నుడికారాన్ని సాధారణ తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా వ్యక్తం చేస్తూ, సమాజంలో ఆమె నివాసాన్ని సూచిస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని వర్తమాన కాలం వరకు పరిస్థితి కొనసాగిందని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: הֶחְבִּיאָה
  choice: దాచిపెట్టింది
  rationale: హిఫీల్ రూపం ఇక్కడ రహస్యంగా దాచడం అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది.
- source_word: הַמַּלְאָכִים
  choice: సందేశకులను
  rationale: מַלְאָכִים యొక్క సాధారణ అర్థం ‘సందేశకులు.’ వీరి గూఢచర్య కార్యాన్ని తరువాతి పదబంధం స్పష్టం చేస్తుంది; కాబట్టి వారిని నేరుగా ‘వేగులు’ అని మార్చలేదు.
- source_word: לְרַגֵּל
  choice: వేగుచూడడానికి
  rationale: ఈ సందర్భంలో רגל నగరాన్ని రహస్యంగా పరిశీలించడం లేదా గూఢచర్యం చేయడాన్ని సూచిస్తుంది; ‘వేగుచూడు’ బైబిలు కథనానికి తగిన స్పష్టమైన తెలుగు క్రియ.
theological_decisions:
- issue: రాహాబు ఇశ్రాయేలు సమాజంలో నివసించడం
  choice: ఆమె నేటివరకు ఇశ్రాయేలు ప్రజల మధ్య నివసిస్తోంది
  alternative: ఆమె ఇశ్రాయేలీయుల మధ్య స్థిరపడింది
  rationale: ఎంచుకున్న రూపం ఆమె నివాసం కథకుని కాలం వరకు కొనసాగిందనే వచన ప్రకటనను నిలుపుతుంది; ఆమె సామాజిక లేదా నిబంధనాత్మక స్థితి గురించి వచనానికి మించిన తీర్మానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇంటివారు,’ ‘ప్రాణాలతో ఉంచాడు,’ ‘నేటివరకు’ వంటి పదప్రయోగాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండగా హీబ్రూ భావాన్ని దగ్గరగా నిలుపుతాయి. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
