revisions:
- from: అయితే యెహోషువ వేశ్యయైన రాహాబును[a], ఆమె తండ్రి ఇంటివారిని, ఆమెకు చెందినదంతటినీ ప్రాణాలతో ఉంచాడు. యెరికోను వేగుచూడడానికి యెహోషువ పంపిన సందేశకులను[b] ఆమె దాచిపెట్టింది కాబట్టి, ఆమె నేటివరకు ఇశ్రాయేలు ప్రజల మధ్య నివసిస్తోంది.
  to: అయితే యెహోషువ వేశ్యయైన రాహాబును[a], ఆమె తండ్రి ఇంటివారినీ, ఆమెకు చెందినదంతటినీ ప్రాణాలతో ఉంచాడు. ఆమె యెరికోపై గూఢచర్యం చేయడానికి యెహోషువ పంపిన సందేశకులను[b] దాచిపెట్టినందున, నేటివరకు ఇశ్రాయేలు ప్రజల మధ్య నివసిస్తూ ఉంది.
  rationale: 'మూలంలోని వాక్య-క్రమాన్ని పునరుద్ధరించాము: రాహాబు దాచిపెట్టిన సందేశకుల చర్య ఆమె ఇశ్రాయేలు మధ్య కొనసాగుతున్న నివాసానికి కారణంగా చివర వస్తుంది. ‘వేగుచూడడానికి’ స్థానంలో ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన ‘యెరికోపై గూఢచర్యం చేయడానికి’ వాడాము. పాదసూచిక bను ప్రధాన పాఠానికి అర్థవంతంగా అనుసంధానించి, మַלְאָכִים యొక్క పదార్థం మరియు సందర్భపాత్రను వివరించాము.'
