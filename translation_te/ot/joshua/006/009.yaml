  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: te
  text: బాకాలు[a] ఊదుతున్న యాజకుల ముందుగా సాయుధులు నడుస్తున్నారు; మందసం వెనుకగా వెనుక రక్షణ దళం నడుస్తూ బాకాలు ఊదుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో షోఫారోత్; కొమ్ముతో చేసిన వాయిద్యాలు, సాధారణంగా ‘పొట్టేళ్ల కొమ్ములు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: సాయుధులు
  rationale: యుద్ధానికి ఆయుధాలు ధరించి ఊరేగింపులో ముందుగా నడిచే దళాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో సూచిస్తుంది.
- source_word: הֹלֵךְ
  choice: నడుస్తున్నారు / నడుస్తుండగా
  rationale: హీబ్రూ కృదంతం సూచించే కొనసాగుతున్న కదలికను తెలుగు వర్తమాన కథన రూపాలతో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: ఊరేగింపు క్రమంలోని స్థలసంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలో כֹּהֵן‌కు ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: బాకాలు ఊదుతున్న
  rationale: మసొరెటిక్ పాఠంలోని అసాధారణ రూపం సందర్భానుసారంగా యాజకుల కొనసాగుతున్న చర్యగా గ్రహించబడింది; 'ఊదుతున్న' క్రియాత్మక భావాన్ని సహజంగా ఇస్తుంది.
- source_word: הַמְאַסֵּף
  choice: వెనుకటి దళం
  rationale: ఊరేగింపుకు వెనుకగా కదిలే రక్షణ దళాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי
  choice: వెనుక
  rationale: ఇక్కడ ప్రధానమైన స్థలార్థాన్ని కాపాడుతుంది.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: సందర్భంలో ఇప్పటికే గుర్తించబడిన పవిత్ర మందసాన్ని మూలంలోని సంక్షిప్త రూపానికి అనుగుణంగా సూచిస్తుంది; ఈ వచనంలో లేని 'నిబంధన' అనే పదాన్ని చేర్చదు.
- source_word: הָלוֹךְ וְתָקוֹעַ בַּשּׁוֹפָרוֹת
  choice: బాకాలు మోగుతూనే ఉన్నాయి
  rationale: నడుస్తూ నిరంతరంగా లేదా పదేపదే ఊదడాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సహజ తెలుగు కొనసాగింపు రూపంలో వ్యక్తం చేస్తుంది; కర్తను మూలం కంటే అధికంగా నిర్దిష్టం చేయదు.
- source_word: שׁוֹפָרוֹת
  choice: బాకాలు
  rationale: షోఫార్ అనే కొమ్ము వాయిద్యానికి చదవడానికి సహజమైన తెలుగు సమానార్థకం; దాని ప్రత్యేక స్వరూపం పాదటిప్పణిలో ఉంచబడింది.
