source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: te
  text: యెహోషువ ఉదయాన్నే లేచాడు; యాజకులు యాహ్వే మందసాన్ని మోశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: ఉదయాన్నే లేచాడు
  rationale: שׁכם యొక్క హిఫీల్ రూపం తెల్లవారగానే లేదా ఉదయాన్నే లేవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, కాలానికి ఉన్న ప్రాధాన్యాన్ని నిలుపుతూ ఇలా అనువదించాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన్నే
  rationale: అక్షరార్థంగా ‘ఉదయంలో.’ וַיַּשְׁכֵּםతో కలిపి ఇది ఉదయకాల చర్యను బలపరుస్తుంది; తెలుగులో అనవసర పునరుక్తి లేకుండా ఆ భావాన్ని ‘ఉదయాన్నే’ తెలియజేస్తుంది.
- source_word: וַיִּשְׂאוּ
  choice: మోశారు
  rationale: נשא అంటే ఎత్తడం, మోయడం, తీసుకువెళ్లడం కావచ్చు. మందసాన్ని యాజకులు రవాణా చేస్తున్న సందర్భంలో ‘మోశారు’ అత్యంత సహజమైన ఎంపిక.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సందర్భానుసారమైన సాధారణ తెలుగు రూపం.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: హీబ్రూ సంధి నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధ నిర్మాణంగా అనువదించాం. אֲרוֹןకు ఈ ఆరాధనా సందర్భంలో స్థిరంగా అర్థమయ్యే ‘మందసం’ వాడాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే నేరుగా ఉంది. అందువల్ల వ్యక్తినామాన్ని స్పష్టంగా నిలుపుతూ ‘యాహ్వే’ అని లిప్యంతరీకరించాం; ‘ప్రభువు’ అని అనువదిస్తే నామం బిరుదుగా మారుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని రెండు కాలసూచనల భావాన్ని ‘ఉదయాన్నే లేచాడు’లో సహజంగా సమీకరించాం. వాక్యంలోని వరుస చర్యలను స్పష్టంగా చూపేందుకు అర్ధవిరామ చిహ్నం వాడాం.
