source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: te
  text: అప్పుడు యాహ్వే మందసం పట్టణం చుట్టూ ఒకసారి తిరిగింది[a]. తరువాత వారు శిబిరంలోకి వచ్చి శిబిరంలో రాత్రి బస చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యంలో మందసమే చర్యకు కర్తగా ఉంది: ‘యాహ్వే మందసం పట్టణం చుట్టూ ఒకసారి తిరిగింది.’ అయితే దానిని యాజకులు మోశారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: చుట్టూ ... ప్రదక్షిణ చేసింది
  rationale: హిఫీల్ రూపం పట్టణం చుట్టూ కదలడాన్ని సూచిస్తుంది. మందసమే వ్యాకరణపరమైన కర్తగా ఉన్న హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా అనిపించేలా అనువదించబడింది.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: సంబంధార్థక నిర్మాణాన్ని సహజమైన తెలుగు సమాసంగా ఇచ్చింది; אֲרוֹן‌కు బైబిలు సందర్భంలో గౌరవప్రదమైన, స్థిరమైన పదంగా ‘మందసం’ ఎంచుకుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించింది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: సందర్భంలో యెరికోను సూచించే నిర్దిష్ట నామవాచకం; మూలంలోని సాధారణ పదాన్ని నిలుపుకుంది.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: ఒకసారి ప్రదక్షిణ చేసింది
  rationale: ముందున్న చుట్టూ తిరిగే చర్యను ఈ వ్యక్తీకరణ స్పష్టపరుస్తుంది; ‘ఒకసారి’ సంఖ్యాత్మక భావాన్ని, ‘ప్రదక్షిణ’ పూర్తి చుట్టును తెలియజేస్తాయి.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: వారు శిబిరంలోకి వచ్చి
  rationale: בוא యొక్క ప్రాథమిక ‘రావు/ప్రవేశించు’ భావాన్ని ఉంచింది; ‘తిరిగి వచ్చారు’ అనే సందర్భానుగత అర్థాన్ని అనవసరంగా చేర్చలేదు.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: ఆ రాత్రి శిబిరంలోనే గడిపారు
  rationale: לון యొక్క రాత్రి బసచేయు భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపింది; మూలంలోని ‘శిబిరం’ పునరుక్తిని నిలిపింది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చింది.
- issue: మందసాన్ని చర్యకు కర్తగా చూపడం
  choice: ‘యాహ్వే మందసం ... ప్రదక్షిణ చేసింది’ అని వ్యక్తీకరణను నిలుపుకోవడం
  alternative: యాజకులు యాహ్వే మందసాన్ని పట్టణం చుట్టూ మోశారు
  rationale: యాజకులు దాన్ని మోశారనేది సందర్భం ద్వారా తెలిసినా, ఈ వాక్యంలో హీబ్రూ మందసాన్నే వ్యాకరణపరమైన కర్తగా ఉంచుతుంది. ఆ సాహిత్య వ్యక్తీకరణను వ్యాఖ్యానంతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘శిబిరం’ అనే మూలపాఠ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలుపుకుంది; ‘మందసం’ బైబిలు సందర్భానికి తగిన పదం.
