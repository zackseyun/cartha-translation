source:
  edition: WLC
  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: te
  text: ఆ పట్టణమూ దానిలో ఉన్నదంతా యెహోవాకు నాశనార్థం పూర్తిగా అంకితం చేయబడాలి[a]. వేశ్యయైన రాహాబు మాత్రం, ఆమెతోపాటు ఇంట్లో ఉన్నవారందరూ బ్రతకాలి. ఎందుకంటే మనం పంపిన సందేశకులను ఆమె దాచిపెట్టింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిషేధానికి లోబరచబడాలి.’ హీబ్రూ పదం యెహోవాకు తిరుగులేని విధంగా అంకితం చేయబడినదాన్ని సూచిస్తుంది; ఇక్కడ అది నాశనం ద్వారా జరుగుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘సందేశకులు.’ సందర్భానుసారంగా వీరు దేశాన్ని వేగు చూడటానికి యెహోషువ పంపిన మనుషులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: నాశనం కోసం పూర్తిగా అంకితం చేయబడాలి
  rationale: ఈ విజయయాత్ర సందర్భంలో ఈ పదం యెహోవాకు తిరుగులేని విధంగా అప్పగించబడినదాన్ని, ఇక్కడ నాశనం ద్వారా అప్పగించబడినదాన్ని సూచిస్తుంది. ఈ అనువాదం అంకితభావాన్నీ నాశన భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ అంకితం ఎవరికి చెందుతుందో సూచిస్తుంది. దైవనామాన్ని మూలంలోని వ్యక్తిగత నామానికి అనుగుణంగా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: רַק
  choice: మాత్రం
  rationale: పట్టణమంతటికీ విధించిన నాశనం నుంచి రాహాబు ఒక్కరే ప్రధాన మినహాయింపు అని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הַזּוֹנָה
  choice: వేశ్యయైన
  rationale: రాహాబు యొక్క వృత్తి లేదా సామాజిక గుర్తింపును ఆధునిక, స్పష్టమైన తెలుగులో తెలుపుతుంది; పాతబడిన పదజాలాన్ని నివారిస్తుంది.
- source_word: תִּחְיֶה
  choice: బ్రతకాలి
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థమైన ‘జీవించి ఉండాలి’ అనే భావాన్ని ఉంచుతుంది. సందర్భంలో ప్రాణాలతో విడిచిపెట్టబడడాన్ని సూచించినా ఆ విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: אִתָּהּ בַּבַּיִת
  choice: ఆమెతోపాటు ఇంట్లో ఉన్నవారందరూ
  rationale: రాహాబుతో కలిసి ఆ ఇంట్లో భౌతికంగా ఉన్నవారిని సూచించే మూలపదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הֶחְבְּאַתָה
  choice: దాచిపెట్టింది
  rationale: హిఫిల్ రూపంలోని ‘దాచింది/కనిపించకుండా చేసింది’ అనే భావాన్ని సూటిగా తెలియజేస్తుంది; ‘ఆశ్రయమిచ్చింది’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: הַמַּלְאָכִים
  choice: దూతలను
  rationale: מַלְאָךְ యొక్క సాధారణ అర్థం ‘పంపబడిన దూత’. ఈ సందర్భంలో వారు మనుషులని పాఠ్యం స్పష్టం చేస్తుంది; ‘గూఢచారులు’ అనేది విస్తృత సందర్భం నుంచి వచ్చిన వ్యాఖ్యాత్మక పదం.
- source_word: שָׁלָחְנוּ
  choice: మనం పంపిన
  rationale: ముందుగా జరిగిన పంపడాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: ఆ పట్టణమూ దానిలో ఉన్నదంతా ... చేయబడాలి
  rationale: మూలంలోని ముందుంచిన ‘పట్టణం’ మరియు పునర్నిర్దేశక సర్వనామం ఇచ్చే ఉద్ఘాటనను అసహజమైన పదపునరుక్తి లేకుండా ‘పట్టణమూ దానిలో ఉన్నదంతా’ అనే సమగ్ర నిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: విజయయాత్ర సందర్భంలోని חֵרֶם పదం
  choice: నాశనం కోసం పూర్తిగా అంకితం చేయబడాలి
  alternative: నిషేధానికి లోబడాలి; శాపగ్రస్తం కావాలి; పూర్తిగా నాశనం చేయబడాలి
  rationale: ‘శాపగ్రస్తం’ అనే అనువాదం కేవలం శాపం అనే తప్పుదారి పట్టించే భావాన్ని ఇవ్వవచ్చు; ‘పూర్తిగా నాశనం’ మాత్రమే అంటే యెహోవాకు తిరుగులేని అంకితం అనే భావం పోతుంది. ఎంపిక చేసిన రూపం తీర్పు తీవ్రతనూ యెహోవాకు అప్పగించడాన్నీ రెండింటినీ నిలుపుతుంది.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది; సాధారణ బిరుదుతో దానిని భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. חֵרֶם యొక్క అంకితం-నాశనం అనే ద్వంద్వ భావాన్ని వివరణాత్మకమైన కానీ సంక్షిప్తమైన పదబంధంతో నిలిపాం. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదసూచిక గుర్తుకు సరిపోలే గమనిక ఇచ్చాం.
