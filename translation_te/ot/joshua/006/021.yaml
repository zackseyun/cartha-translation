source:
  edition: WLC
  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: te
  text: వారు పట్టణంలో ఉన్నదంతటినీ నాశనానికి అంకితం చేశారు[a]—పురుషుల నుండి స్త్రీల వరకు, చిన్నవారి నుండి వృద్ధుల వరకు, ఎద్దులను, గొర్రెలను, గాడిదలను కూడా కత్తి ధారతో చంపివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తిగా నాశనం చేశారు,’ లేదా ‘నిషేధానికి అప్పగించారు.’ ఇక్కడి హీబ్రూ క్రియ, దేనినైనా హేరెమ్‌ (ḥerem) కింద తిరుగులేని విధంగా నాశనానికి అంకితం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: నాశనానికి అంకితం చేశారు
  rationale: హిఫిల్ రూపంలోని חרם కేవలం ‘నాశనం చేయడం’నే కాక, తిరుగులేని విధంగా నాశనానికి విధించడం అనే ప్రత్యేక భావాన్ని కలిగి ఉంది. ‘నాశనానికి అంకితం చేశారు’ ఆ సాంకేతిక భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: పట్టణంలో ఉన్న సమస్తాన్నీ
  rationale: తరువాత పేర్కొన్న మనుషులు, పశువులన్నిటినీ కలుపుకొనే సంపూర్ణతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుని నుండి స్త్రీ వరకు
  rationale: హీబ్రూ ఏకవచన పంపిణీ నిర్మాణాన్ని, రెండు లింగాలనూ సమగ్రంగా సూచించే మేరిజాన్ని నిలుపుతుంది.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: చిన్నవారి నుండి వృద్ధుల వరకు
  rationale: వయస్సు పరిధి మొత్తాన్ని సూచించే హీబ్రూ మేరిజాన్ని సహజంగా అందిస్తుంది; נַעַר ను సందర్భంలో అతి సంకుచితంగా ‘బాలుడు’ అని నిర్దేశించదు.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: ఎద్దులను, గొర్రెలను, గాడిదలను కూడా
  rationale: మనుషుల నుండి పశువుల వరకు విస్తరించే సమగ్ర పరిధిని ‘కూడా’ ద్వారా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְפִי חָרֶב
  choice: కత్తివాత చంపారు
  rationale: ‘కత్తి నోరు/అంచు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ఆయుధంతో సంహరించారనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: యుద్ధ తీర్పు సందర్భంలోని חרם పదప్రయోగం
  choice: నాశనానికి అంకితం చేశారు
  alternative: పూర్తిగా నాశనం చేశారు; నిషేధం కింద ఉంచారు
  rationale: ఇది సాధారణ సంహార క్రియ మాత్రమే కాదు; తిరుగులేని నాశనానికి విధించబడినదనే ప్రత్యేక חרם భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన రూపం హింస తీవ్రతను మృదువుచేయకుండా ఆ ప్రత్యేక భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. חרם యొక్క ప్రత్యేక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. ‘చిన్నవారి నుండి వృద్ధుల వరకు’ వయస్సు మేరిజాన్ని లింగపరంగా అనవసరంగా సంకుచితం చేయదు.
