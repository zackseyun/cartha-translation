source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: te
  text: ఆ యువకులైన గూఢచారులు లోపలికి వెళ్లి రాహాబును, ఆమె తండ్రిని, తల్లిని, సహోదరులను, ఆమెకు చెందిన వారందరినీ[a] బయటకు తీసుకొచ్చారు. ఆమె కుటుంబ వర్గాలన్నిటినీ[b] బయటకు తీసుకొచ్చి, ఇశ్రాయేలు శిబిరం వెలుపల ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు చెందినదంతటినీ.” హీబ్రూ పదబంధం వ్యక్తులతోపాటు ఆమెకు చెందిన ఇతరవాటిని కూడా సూచించగలదు; అయితే ఈ సందర్భంలో ప్రధానంగా ఆమె ఇంటివారిని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె బంధువులందరినీ” లేదా “ఆమె వంశ సమూహాలన్నిటినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים הַמְרַגְּלִים
  choice: ఆ యువకులైన గూఢచారులు
  rationale: הַנְּעָרִיםను సందర్భానుసారంగా ‘యువకులు’ అని, దానిని నిర్దేశించే הַמְרַגְּלִיםను ‘గూఢచారులు’ అని నేరుగా అనువదించాం; మూలంలో లేని ‘దేశాన్ని’ చేర్చలేదు.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: బయటకు తీసుకొచ్చారు
  rationale: హిఫీల్ రూపంలోని ‘బయటకు రప్పించడం/తీసుకురావడం’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మూలంలోని పునరుక్తిని రెండు చోట్లా నిలిపాం.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: ఆమెకు చెందిన వారందరినీ
  rationale: పదబంధం విస్తృతంగా ‘ఆమెకు చెందినదంతా’ అని కూడా అర్థమివ్వగలదు; రక్షించబడుతున్న వ్యక్తుల జాబితా సందర్భంలో వ్యక్తులను సూచించే సహజ తెలుగు రూపాన్ని ప్రధాన పాఠ్యంలో వాడి, విస్తృత సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: ఆమె వంశాలన్నిటివారినీ
  rationale: מִשְׁפָּחָה ఇక్కడ తక్షణ కుటుంబం కంటే విస్తృతమైన వంశ/బంధు సమూహాన్ని సూచించవచ్చు. బహువచనాన్ని నిలుపుతూ వ్యక్తులనే బయటకు తెచ్చారనే సందర్భానికి సరిపోయేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיַּנִּיחוּם
  choice: వారిని ... ఉంచారు
  rationale: హిఫీల్ రూపం ‘ఉంచడం/నిలిపివేయడం’ అనే స్థానికరణ భావాన్ని ఇస్తుంది; కారణం లేదా వ్యవధిని అనువాదంలో చేర్చలేదు.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శిబిరం వెలుపల
  rationale: మూలంలోని స్థల సూచనను సరళంగా, సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
theological_decisions:
- issue: రాహాబు వారిని ఇశ్రాయేలు శిబిరం వెలుపల ఉంచడానికి కారణం
  choice: కారణాన్ని పేర్కొనకుండా మూలంలోని స్థలవివరణను మాత్రమే అనువదించడం
  alternative: ఆచారపరమైన వేరుచేయడం, రక్షణార్థక కాపలా, లేదా ఇశ్రాయేలులో చేర్చుకునే ముందు తాత్కాలిక నిరీక్షణగా వివరించడం
  rationale: హీబ్రూ వాక్యం వారిని శిబిరం వెలుపల ఉంచారని మాత్రమే చెబుతుంది; ఎందుకు ఉంచారో చెప్పదు. అందువల్ల ఏ ప్రత్యేక వ్యాఖ్యానాన్నీ ప్రధాన పాఠ్యంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలిని వాడాం. ‘గూఢచారులు,’ ‘వంశాలు,’ ‘శిబిరం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచినా వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
