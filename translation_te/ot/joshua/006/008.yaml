source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: te
  text: 'యెహోషువ ప్రజలతో చెప్పినప్పుడు, ఇలా జరిగింది: యాహ్వే ముందు[b] పొట్టేలు కొమ్ములతో చేసిన ఏడు బూరలను[a] మోస్తున్న ఏడుగురు యాజకులు ముందుకు సాగి ఆ బూరలను ఊదారు; యాహ్వే నిబంధన మందసం వారి వెనుక సాగింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “యోబేలు యొక్క ఏడు షోఫార్లు.” ఈ సందర్భంలో ఇది బహుశా పొట్టేలు కొమ్ములతో చేసిన బూరలను సూచిస్తుంది; “ఏడు జూబిలీ బూరలు” అని కూడా అనువదించే అవకాశం ఉంది, అయితే అది ఇక్కడ తక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే సన్నిధిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: యెహోషువ ప్రజలతో చెప్పినప్పుడు, ఇలా జరిగింది
  rationale: וַיְהִי అనే కథన సంధిని సహజమైన ఆధునిక తెలుగులో ఉంచుతూ, כֶּאֱמֹר యొక్క కాలసంబంధ భావాన్ని ‘చెప్పినప్పుడు’గా అనువదించాం; యెహోషువ మాట పూర్తయిందని మూలం కంటే బలంగా నిర్ధారించలేదు.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ ఉద్దేశించబడింది యెహోషువ సంబోధించిన ఇశ్రాయేలు ప్రజలు; కేవలం సైనికులు కాదు.
- source_word: שִׁבְעָה הַכֹּהֲנִים
  choice: ఏడుగురు యాజకులు
  rationale: వ్యక్తులను లెక్కించే సహజ తెలుగు రూపాన్ని వాడాం.
- source_word: נֹשְׂאִים
  choice: మోస్తున్న
  rationale: యాజకులు బూరలను తీసుకొని వెళ్తున్న కొనసాగుతున్న చర్యను తెలుపుతుంది.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: ఏడు పొట్టేలు కొమ్ము బూరలు
  rationale: שׁוֹפָר అనేది కొమ్ముతో చేసిన బూర; ఈ సందర్భంలో יוֹבֵל పొట్టేలు లేదా పొట్టేలు కొమ్మును సూచించే అవకాశం ఎక్కువ. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే ముందు
  rationale: స్థానసంబంధమైన ‘ముందు’ అనే మూలభావాన్ని నిలిపి, ‘సన్నిధిలో’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో మార్చకుండా ఆధునిక తెలుగులో ధ్వన్యనువాదం చేశాం.
- source_word: עָבְרוּ
  choice: ముందుకు సాగి
  rationale: ఇక్కడ సరిహద్దు దాటడం కాక ఊరేగింపులో ముందుకు కదలడమే భావం.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: ఆ బూరలను ఊదారు
  rationale: תקע + שׁוֹפָר కలయికకు సహజమైన తెలుగు ప్రయోగం.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలుగులో వ్యక్తం చేస్తుంది; ‘మందసం’ పవిత్ర పెట్టెను సూచించే స్థిరమైన బైబిలు పదం.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: వారి వెనుక సాగింది
  rationale: మందసం యాజకుల వెనుక కొనసాగుతూ కదిలిందనే స్థానిక, కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యనువాదం చేశాం.
- issue: לִפְנֵי יְהוָה యొక్క సంబంధం
  choice: యాహ్వే ముందు
  alternative: యాహ్వే సన్నిధిలో
  rationale: యాజకులు మందసం కంటే ముందుగా నడుస్తున్న ఊరేగింపు సందర్భంలో స్థానసంబంధ భావం బలంగా ఉన్నా, దైవసన్నిధి భావం కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం ద్విబిందువు, అర్ధవిరామంతో అమర్చినా చర్యల క్రమాన్ని మార్చలేదు. ప్రతి పాదటిప్పణి గుర్తును దానికి సంబంధించిన పదబంధం వద్ద ఉంచాం.
