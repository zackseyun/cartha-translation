id: JOS.6.2
reference: Joshua 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: te
  text: 'యహ్వే యెహోషువతో ఇలా అన్నాడు: “చూడు, యెరికోను, దాని రాజును, పరాక్రమవంతులైన యోధులను[a] నేను నీ చేతికి అప్పగించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలవంతులైన యోధులను,” లేదా “శూరులైన యోధులను.” హీబ్రూ పదబంధం బలం, యుద్ధ సామర్థ్యం, శౌర్యం అనే భావాలను కలిపి వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తుంది; వావ్-కన్సిక్యూటివ్‌కు అవసరానికి మించిన కాలార్థాన్ని జోడించదు.
- source_word: רְאֵה
  choice: చూడు
  rationale: దృష్టిని ఆకర్షించే ఏకవచన ఆజ్ఞార్థక బలాన్ని సూటిగా, సహజంగా నిలుపుతుంది.
- source_word: נָתַתִּי
  choice: నేను ... అప్పగించాను
  rationale: వక్త దృష్టిలో కార్యం నెరవేరినదిగా చెప్పే హీబ్రూ పర్ఫెక్ట్ రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది విజయ నిశ్చయాన్ని ప్రకటిస్తుంది.
- source_word: בְיָדְךָ
  choice: నీ చేతికి
  rationale: ఎవరినైనా మరొకరి అధికారంలోకి అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యే సమాన నుడికారంతో వ్యక్తం చేస్తుంది.
- source_word: יְרִיחוֹ
  choice: యెరికో
  rationale: స్థలనామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: מַלְכָּהּ
  choice: దాని రాజు
  rationale: స్త్రీలింగ ప్రత్యయం యెరికో పట్టణాన్ని సూచిస్తుంది; తెలుగులో పట్టణానికి అనవసర వ్యక్తీకరణ ఇవ్వకుండా ‘దాని’ అని సహజంగా అనువదించబడింది.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ రెండు పదాల సమాసంలో ఉన్న బలం, యుద్ధ సామర్థ్యం, శౌర్యం అనే భావాలను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యుద్ధానికి ముందే వచ్చిన נָתַתִּי అనే పర్ఫెక్ట్ రూపం యొక్క భావం
  choice: ‘నేను ... అప్పగించాను’ అనే పూర్తయిన కార్య ప్రకటన
  alternative: ‘నేను అప్పగిస్తున్నాను’ లేదా ‘నేను అప్పగిస్తాను’
  rationale: హీబ్రూ పర్ఫెక్ట్ దేవుని నిర్ణయంలో విజయం నిశ్చితమైనదని, కార్యం ఇప్పటికే నెరవేరినట్లుగా ప్రకటిస్తుంది. భవిష్యత్తు కాలంగా మార్చకుండా మూలంలోని కాలసంబంధ ఉద్వేగాన్ని ఈ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘నీ చేతికి అప్పగించాను’ అనే సహజ తెలుగు నుడికారం మూలంలోని ‘నీ చేతిలో ఇచ్చాను’ అనే అధికార బదిలీ భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘పరాక్రమవంతులైన యోధులను’ అనే పదబంధం వద్ద ఉంచబడింది.
