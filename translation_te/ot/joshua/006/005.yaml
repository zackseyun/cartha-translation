source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְשֹׁ֣ךְ בְּ/קֶ֣רֶן הַ/יּוֹבֵ֗ל ב/שמע/כם אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר יָרִ֥יעוּ כָל הָ/עָ֖ם תְּרוּעָ֣ה גְדוֹלָ֑ה וְ/נָ֨פְלָ֜ה חוֹמַ֤ת הָ/עִיר֙ תַּחְתֶּ֔י/הָ וְ/עָל֥וּ הָ/עָ֖ם אִ֥ישׁ נֶגְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: te
  text: పొట్టేలు కొమ్మును దీర్ఘంగా ఊదినప్పుడు[a], మీరు బూర ధ్వని వినగానే ప్రజలందరూ పెద్ద కేక వేయాలి. అప్పుడు పట్టణ ప్రాకారం తన కిందికే కూలిపోతుంది[b]; ప్రజలు ప్రతి ఒక్కరూ తమ ఎదుట నేరుగా పైకి వెళ్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొట్టేలు కొమ్ము ధ్వనిని చాలాసేపు సాగదీసినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: ‘పట్టణ ప్రాకారం తన కిందికే కూలిపోతుంది’; బహుశా అది ఉన్నచోటే నేరుగా కిందికి కూలిపోతుందని భావం.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఒక్కొక్కరు తమ ఎదుటికి నేరుగా వెళ్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ בְּקֶרֶן הַיּוֹבֵל
  choice: పొట్టేలు కొమ్మును దీర్ఘంగా ఊదినప్పుడు
  rationale: ఈ ప్రయోగంలో משׁך కొమ్ము ధ్వనిని సాగదీయడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో దీన్ని ‘దీర్ఘంగా ఊదినప్పుడు’ అని వ్యక్తం చేయడం మూల భావాన్ని స్పష్టంగా అందిస్తుంది; יוֹבֵל ఇక్కడ ‘సునిశ్చిత సంవత్సరం’ కాదు, పొట్టేలు కొమ్ము.
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: బూర ధ్వని
  rationale: שׁוֹפָר కొమ్ముతో చేసిన బూరను సూచిస్తుంది. ‘బూర ధ్వని’ అనేది קול అనే ‘ధ్వని’ భావాన్ని నిలుపుతూ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: గొప్పగా కేక వేయాలి
  rationale: క్రియ మరియు దానికి సంబంధించిన నామవాచకం కలిసి ప్రజలు పెద్ద కేక వేయడాన్ని సూచిస్తున్నాయి. ‘యుద్ధకేక’ అనేది సాధ్యమైనా, సందర్భంలో లేని నిర్దిష్ట సైనిక ఛాయను బలవంతంగా చేర్చకుండా ‘గొప్పగా కేక’ అని అనువదించబడింది.
- source_word: וְנָפְלָה חוֹמַת הָעִיר תַּחְתֶּיהָ
  choice: పట్టణ ప్రాకారం ఉన్నచోటే కిందికి కూలిపోతుంది
  rationale: תַּחְתֶּיהָ అక్షరార్థంగా ‘దాని కిందనే/తన కిందికే’ అనే అసాధారణ చిత్రాన్ని ఇస్తుంది. సహజ తెలుగులో గోడ నేరుగా కిందికి, ఉన్నచోటే కూలిపోవడాన్ని తెలిపే రూపం ఎంచుకొని, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְעָלוּ
  choice: పైకి వెళ్తారు
  rationale: עלה యొక్క ప్రాథమిక భావం ‘పైకి వెళ్లడం/ఎక్కడం.’ ముట్టడి సందర్భంలో ‘దాడి చేస్తారు’ అనే భావం ఉండవచ్చుగానీ, ఆ సైనిక వివరణను పాఠ్యంలో చేర్చకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- source_word: אִישׁ נֶגְדּוֹ
  choice: ప్రతి ఒక్కరూ తమకు ఎదురుగా నేరుగా
  rationale: אִישׁ ఇక్కడ విభజనాత్మకంగా ‘ఒక్కొక్కరు’ అనే భావంలో ఉంది; נֶגְדּוֹ ప్రతి వ్యక్తి తన ఎదుటనున్న దిశలో నేరుగా ముందుకు సాగడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సమూహంతో సహజ అన్వయం కోసం ‘ప్రతి ఒక్కరూ’ వాడబడింది.
