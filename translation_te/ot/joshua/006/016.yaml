id: JOS.6.16
reference: Joshua 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: te
  text: ఏడవసారి యాజకులు కొమ్ము బూరలు ఊదినప్పుడు, యెహోషువ ప్రజలతో, “కేక వేయండి! ఎందుకంటే యెహోవా ఆ పట్టణాన్ని మీకు ఇచ్చాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: ఏడవసారి ... ఊదినప్పుడు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; וַיְהִי కి విడిగా ‘జరిగింది’ అని చేర్చడం తెలుగులో భారంగా ఉంటుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఇశ్రాయేలు ఆరాధనా పరిసరంలోని כהנים కు ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: שׁוֹפָרוֹת
  choice: కొమ్ముబూరలు
  rationale: శోఫార్లు కొమ్ముతో చేసిన ఊదే వాద్యాలు; కేవలం ‘బాకాలు’ అనడం వల్ల మూలపదంలోని కొమ్ము లక్షణం కనుమరుగవుతుంది.
- source_word: הָרִיעוּ
  choice: కేక వేయండి
  rationale: యుద్ధ లేదా విజయ సందర్భంలోని బిగ్గర కేకను సూచిస్తుంది; ‘యుద్ధనాదం చేయండి’ అనేది మూలానికి మించిన వివరణాత్మకత.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంధానార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను నిలుపుతుంది; పట్టణ స్వాధీనం ఇంకా ప్రత్యక్షంగా జరగకపోయినా, దేవుని చర్య నిశ్చయమైనదిగా ప్రకటించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన దైవనామ రూపం; బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామాన్ని నిలుపుతుంది.
- source_word: הָעִיר
  choice: ఈ పట్టణాన్ని
  rationale: సందర్భంలో ఎదురుగా ఉన్న యెరికోను సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో ‘ఈ’ సందర్భసూచనను సహజంగా చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: పట్టణం ఇవ్వబడిన కాలదృష్టి
  choice: ఇచ్చాడు
  alternative: ఇస్తాడు
  rationale: נָתַן సంపూర్ణ రూపాన్ని భవిష్యత్తుగా మార్చకుండా, ఇంకా నెరవేరబోయే విజయాన్ని అప్పటికే నిశ్చయమైన దైవకార్యంగా చెప్పే ఉత్కంఠను నిలిపాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త ఆజ్ఞను, దైవ వాగ్దాన నిశ్చయాన్ని నిలిపింది.
