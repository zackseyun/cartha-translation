source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: te
  text: అయితే మీరు[a] నాశనానికి అంకితమైన దాని నుండి దూరంగా ఉండండి. లేకపోతే మీరు నాశనానికి అంకితమైనవారవుతారు[b], నాశనానికి అంకితమైన దానిలో కొంత తీసుకొని, ఇశ్రాయేలు శిబిరాన్ని నాశనానికి అంకితమైనదిగా చేసి, దానికి ఆపద తెస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ חֵרֶם (ఖేరెమ్) అనే పదం సంప్రదాయంగా ‘నిషేధం’ లేదా ‘శాపగ్రస్తమైనది’ అని అనువదించబడింది. ఇక్కడ అది దేవునికి తిరుగులేని విధంగా అంకితపరచబడి, నాశనం చేయవలసిన వ్యక్తులను లేదా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మిమ్మల్ని మీరు నాశనానికి అంకితం చేసుకుంటారు.”
    reason: alternative_reading
  - marker: c
    text: “ఆపద తెస్తారు” అనే మాట, తరువాత ఆకాను పాపం వల్ల ఇశ్రాయేలుకు కలిగిన పరిణామాల అంశాన్ని ప్రతిధ్వనిస్తుంది (యెహోషువ 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: అయితే మీరు
  rationale: וְרַק ఇచ్చే వ్యత్యాసాన్ని, నిర్బంధాత్మక హెచ్చరికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సందర్భం మోస్తుంది.
- source_word: שִׁמְרוּ מִן־הַחֵרֶם
  choice: నాశనానికి ప్రతిష్ఠించబడినదాని విషయంలో జాగ్రత్తగా ఉండండి
  rationale: שמר מן అనే నిర్మాణంలోని ‘దానికి దూరంగా జాగ్రత్తపడండి’ అనే హెచ్చరిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַחֵרֶם
  choice: నాశనానికి ప్రతిష్ఠించబడినది
  rationale: חֵרֶם ఇక్కడ దేవునికి తిరుగులేని విధంగా అప్పగించబడి నాశనం చేయవలసిన దానిని సూచిస్తుంది. సాంకేతికంగా అస్పష్టమైన పదానికి బదులు అర్థాన్ని బహిర్గతం చేస్తూ, హెబ్రీ ఏకవచన సమూహార్థాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: హెచ్చరికతో కూడిన ప్రతికూల పరిణామాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: תַּחֲרִימוּ
  choice: మీరే నాశనానికి ప్రతిష్ఠించబడతారు
  rationale: నిషిద్ధమైన దానిని తీసుకోవడం వల్ల వారు అదే తీర్పు స్థితిలోకి వస్తారనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది; ‘మీరే’ స్వతంత్ర సర్వనామ ఉద్ఘాటనను ప్రతిఫలిస్తుంది.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: నాశనానికి ప్రతిష్ఠించబడినదానిలో కొంత తీసుకొని
  rationale: ఒక సమగ్ర సమూహం నుండి కొంత తీసుకోవడాన్ని సహజంగా తెలుపుతూ, హెబ్రీ సమూహవాచక ఏకవచనాన్ని నిలుపుతుంది.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: ఇశ్రాయేలు శిబిరాన్ని నాశనానికి ప్రతిష్ఠించబడినదిగా చేసి
  rationale: שׂים + వస్తువు + పూరకపదం నిర్మాణంలోని కారణాత్మక ఫలితాన్ని ‘చేసి’ ద్వారా స్పష్టంగా చూపుతుంది.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: దానిమీదికి ఆపద తెస్తారు
  rationale: עכר లోని కలవరపరచడం, విపత్తు కలిగించడం అనే బలమైన నిబంధన-తీర్పు భావాన్ని తెలుపుతుంది; సర్వనామం ఇశ్రాయేలు శిబిరాన్ని సూచిస్తుంది.
theological_decisions:
- issue: పరిశుద్ధ యుద్ధం/తీర్పు సందర్భంలో חֵרֶם అనువాదం
  choice: నాశనానికి ప్రతిష్ఠించబడినది
  alternative: నిషేధానికి గురైనది; శాపగ్రస్తమైనది; ప్రతిష్ఠితమైనది
  rationale: ఈ సందర్భంలో పదం దేవునికి తిరుగులేని విధంగా అప్పగించబడి సాధారణంగా నాశనం చేయబడే దానిని సూచిస్తుంది. ఎంపిక చేసిన రూపం తీర్పు తీవ్రతను నిలుపుతూ, ‘శాపం’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- issue: תַּחֲרִימוּ యొక్క వ్యాకరణ-సందర్భార్థం
  choice: మీరే నాశనానికి ప్రతిష్ఠించబడతారు
  alternative: మిమ్మల్ని మీరు నాశనానికి ప్రతిష్ఠించుకుంటారు; మీరు నిషేధం కిందికి వస్తారు
  rationale: హిఫిల్ రూపం క్రియాత్మకంగా ‘ప్రతిష్ఠిస్తారు’ అని కూడా అర్థమయ్యే అవకాశం ఉన్నా, ఈ సందర్భంలో నిషిద్ధమైన దానిని తీసుకోవడం వల్ల అదే తీర్పు స్థితిని తమపైకి తెచ్చుకోవడం ప్రధాన భావం. పాదటిప్పణి ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
- issue: సంఘటిత అపరాధం వల్ల సమాజంపై వచ్చే పరిణామం
  choice: ఇశ్రాయేలు శిబిరాన్ని నాశనానికి ప్రతిష్ఠించబడినదిగా చేసి, దానిమీదికి ఆపద తెస్తారు
  alternative: ఇశ్రాయేలు శిబిరాన్ని నిషేధం కింద పెట్టి దాన్ని కలవరపరుస్తారు
  rationale: వ్యక్తిగత ఉల్లంఘన మొత్తం శిబిరంపై తీర్పు తెస్తుందనే వాక్యంలోని ఉద్రిక్తతను తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన హెచ్చరిక స్వరం నిలిచేలా రూపొందించబడింది. חֵרֶם కు ప్రతి చోట ఒకే మూల అనువాదాన్ని వాడి పదసంబంధాన్ని సంరక్షించాం. ప్రధాన పాఠ్యంలో అన్ని పాదటిప్పణి సూచికలు [a], [b], [c] చేర్చబడ్డాయి.
