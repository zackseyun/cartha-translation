  to: అయితే మీరు[a] నాశనానికి అంకితమైన దాని నుండి దూరంగా ఉండండి. లేకపోతే మీరు నాశనానికి అంకితమైనవారవుతారు[b], నాశనానికి అంకితమైన దానిలో కొంత తీసుకొని, ఇశ్రాయేలు శిబిరాన్ని నాశనానికి అంకితమైనదిగా చేసి, దానికి ఆపద తెస్తారు[c].
