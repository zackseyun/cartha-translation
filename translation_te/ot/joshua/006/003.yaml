id: JOS.6.3
reference: Joshua 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: te
  text: యుద్ధ పురుషులందరూ పట్టణం చుట్టూ తిరగాలి; పట్టణానికి ఒక చుట్టు తిరగాలి. ఆరు రోజులపాటు నీవు ఇలాగే చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: చుట్టూ తిరగాలి
  rationale: סבב అనే ధాతువు ఇక్కడ బహువచన సంబోధనలో ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది. సైనిక సందర్భాన్ని బట్టి పట్టణం చుట్టూ క్రమంగా కదలడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న עִירకు నేరమైన సమానార్థకం. సందర్భంలో ఇది యెరికో అయినప్పటికీ మూలపాఠంలోని సాధారణ నామవాచకాన్నే నిలుపుతుంది.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధానికి సిద్ధమైన పురుషులందరూ
  rationale: అక్షరార్థంగా ‘యుద్ధపు పురుషులందరూ.’ ఇది పురుష యోధులను సూచించే మూలభాషలోని లింగార్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַקֵּיף אֶת הָעִיר
  choice: పట్టణం చుట్టూ ... ప్రదక్షిణ చేయాలి
  rationale: మూలంలోని చుట్టుముట్టడం లేదా ఒక పూర్తి చుట్టు తిరగడం అనే పునరుక్త బలాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: פַּעַם אֶחָת
  choice: ఒక్కసారి
  rationale: ఒకే సందర్భం లేదా ఒక పూర్తి చుట్టును సూచించే సహజ తెలుగు రూపం.
- source_word: כֹּה תַעֲשֶׂה
  choice: నీవు ఇలాగే చేయాలి
  rationale: כֹּה సూచించే విధానాన్ని ‘ఇలాగే’ తెలియజేస్తుంది; ఏకవచన క్రియారూపాన్ని ‘నీవు’ ద్వారా స్పష్టంగా నిలుపుతుంది.
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులపాటు
  rationale: ఆ చర్యను ఆరు రోజులు పునరావృతం చేయాలనే వ్యవధిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אַנְשֵׁי הַמִּלְחָמָה లోని లింగ సూచన
  choice: యుద్ధానికి సిద్ధమైన పురుషులందరూ
  alternative: యోధులందరూ
  rationale: హీబ్రూ పదబంధం పురుష యుద్ధజనులను స్పష్టంగా సూచిస్తుంది. లింగనిరపేక్షంగా మార్చకుండా ఆ అర్థాన్ని ప్రధాన పాఠంలో నిలిపాం.
- issue: సంబోధితుల సంఖ్యలో మార్పు
  choice: మొదట బహువచన ఆదేశం, తరువాత ‘నీవు’ అనే ఏకవచన ఆదేశం
  alternative: రెండింటినీ బహువచనంగా లేదా ఏకవచనంగా సమతలీకరించడం
  rationale: మూలపాఠం మొదట 2వ పురుష బహువచనానికి, తరువాత 2వ పురుష ఏకవచనానికి మారుతుంది. చివరి ఏకవచనం బాధ్యత వహించే యెహోషువను ఉద్దేశించినదిగా ఉండవచ్చు; ఈ మార్పును అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన ఆదేశ శైలి. ‘ప్రదక్షిణ’ ఇక్కడ ఆరాధనా సాంకేతిక అర్థంలో కాకుండా ఒక పూర్తి చుట్టు తిరగడం అనే సాధారణ అర్థంలో వాడబడింది.
