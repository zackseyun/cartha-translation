source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: te
  text: ఏడుగురు యాజకులు యహ్వే మందసం ముందు ఏడు పొట్టేలు కొమ్ము బూరలను[a] మోస్తూ, నడుస్తూనే ఆ బూరలను ఊదుతూ ఉన్నారు. సాయుధ దళం వారికి ముందు నడిచింది; వెనుక దళం యహ్వే మందసం వెనుక నడిచింది. ఊరేగింపు కొనసాగుతుండగా బూరలు ఊదుతూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏడు జూబిలీ బూరలు”; లేదా “ఏడు పొట్టేలు కొమ్ములు.” హీబ్రూ పదబంధం పొట్టేలు కొమ్ములతో చేసిన లేదా వాటితో అనుసంధానమైన షోఫారులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: పొట్టేలు కొమ్ము బూరలు
  rationale: שׁוֹפָר కొమ్ముతో చేసిన బూరను సూచిస్తుంది; הַיֹּבְלִים దానిని పొట్టేళ్లతో అనుసంధానిస్తుంది. ఈ అనువాదం దాని మూల పదార్థాన్నీ వాద్యపు పనినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: הֹלְכִים הָלוֹךְ
  choice: నడుస్తూనే
  rationale: సమాపక క్రియతో కూడిన infinitive absolute చర్య కొనసాగుతుండడాన్ని బలపరుస్తుంది; ‘నడుస్తూనే’ ఆ నిరంతర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: ఆ బూరలను ఊదారు
  rationale: תקע అనే క్రియ שׁוֹפָרతో వచ్చినప్పుడు తెలుగులో సహజమైన ప్రయోగం ‘బూర ఊదడం’; సందర్భం కొనసాగుతున్న ఊదడాన్ని సూచిస్తుంది.
- source_word: הֶחָלוּץ
  choice: సాయుధ దళం
  rationale: యుద్ధానికి సన్నద్ధమై ఊరేగింపుకు ముందుగా వెళ్లే సమూహాన్ని సూచించే సామూహిక పదం; ‘సాయుధ దళం’ స్పష్టంగా, సంక్షిప్తంగా ఉంది.
- source_word: הַמְאַסֵּף
  choice: వెనుక దళం
  rationale: ఊరేగింపు లేదా సైనిక క్రమంలో చివరగా వచ్చే విభాగాన్ని సూచిస్తుంది; ‘వెనుక దళం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: ముందుకు సాగుతూ బూరలను ఊదుతూనే ఉన్నారు
  rationale: ఈ నిర్మాణం ప్రయాణమూ బూరలు ఊదడమూ కొనసాగినట్లు తెలియజేస్తుంది. మూలంలోని వ్యాకరణ సంఖ్య అసమతౌల్యం వల్ల కర్త కొంత అస్పష్టంగా ఉన్నందున, తెలుగు వాక్యం ఊరేగింపులోని సమూహాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది; ‘యహ్వే’ హీబ్రూ నామానికి సాధారణ పునర్నిర్మిత ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: చివరి הוֹלֵךְ וְתָקוֹעַ పదబంధానికి కర్త
  choice: ఊరేగింపులో ముందుకు సాగుతున్నవారు
  alternative: వెనుక దళం మాత్రమే
  rationale: హీబ్రూ పాఠంలో ముందు ‘వెనుక దళం’ ఏకవచన సామూహిక రూపంలో ఉన్నప్పటికీ, చివరి పదబంధం కొనసాగుతున్న ఊరేగింపును సంగ్రహించగలదు. కర్తను అతిగా నిర్దిష్టం చేయకుండా ‘వారు’ అని ఉంచడం నిజమైన అస్పష్టతను కొంతవరకు కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మందసం’ ద్వారా ఒడంబడిక మందసం సూచించబడింది; సైనిక-ఊరేగింపు క్రమం స్పష్టంగా ఉండేందుకు చిన్న వాక్యాలుగా విభజించబడింది.
