source:
  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: te
  text: బాషాను రాజైన ఓగు యొక్క ప్రాంతమూ; అతడు రెఫాయీయులలో మిగిలినవాడు, అష్టారోతులోను ఎద్రెయిలోను నివసించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రెఫాయీయులు’ అనే హీబ్రూ పదాన్ని కొందరు ‘దైత్యులు’ అని అనువదిస్తారు. ఇది అసాధారణమైన దేహాకారంతో గుర్తించబడిన ఒక ప్రాచీన ప్రజాసమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: ప్రాంతం
  rationale: గְּבוּל అనే పదం సరిహద్దును లేదా ఆ సరిహద్దులలోని ప్రాంతాన్ని సూచించగలదు. ఇక్కడ జయించిన రాజ్యాల భూభాగాల జాబితా ఉన్నందున ‘ప్రాంతం’ సహజంగా సరిపోతుంది. వావ్ ముందరి వాక్యంలోని జాబితాను కొనసాగిస్తుంది; తెలుగులో విరామచిహ్నం, వాక్య నిర్మాణం ద్వారా ఆ అనుసంధానం వ్యక్తమైంది.
- source_word: ע֚וֹג
  choice: ఓగు
  rationale: వ్యక్తి పేరును తెలుగులో సహజమైన లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: బాషాను రాజు
  rationale: ఓగు పాలించిన రాజ్యాన్ని తెలిపే సరళమైన సంబంధ నిర్మాణం; బాషాను స్థలపేరుగా లిప్యంతరీకరించబడింది.
- source_word: מִ/יֶּ֖תֶר
  choice: మిగిలినవారిలో ఒకడు
  rationale: యֶתֶר అంటే మిగిలిన భాగం లేదా శేషం. ఓగు ఆ ప్రజలలో మిగిలినవాడని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָ/רְפָאִ֑ים
  choice: రెఫాయీయులు
  rationale: ప్రధాన పాఠ్యంలో ‘దైత్యులు’ అని వ్యాఖ్యానించకుండా, ప్రాచీన ప్రజాసమూహపు పేరుగా నిలిపాం. వారి అసాధారణ దేహాకారానికి సంబంధించిన అర్థసూచనను పాదటిప్పణిలో ఇచ్చాం.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: అతడు ... నివసించాడు
  rationale: ఏకవచన కర్తృవాచక రూపం రెఫాయీయుల సమూహాన్ని కాక ఓగును సూచిస్తుంది. ישב యొక్క సాధారణ నివాసార్థాన్ని ఆధునిక తెలుగులో ‘నివసించాడు’గా ఇచ్చాం.
- source_word: בְּ/עַשְׁתָּר֖וֹת
  choice: అష్టారోతులో
  rationale: స్థలపేరును లిప్యంతరీకరించి, ב ఉపసర్గ సూచించే నివాసస్థానాన్ని ‘లో’తో తెలిపాం.
- source_word: וּ/בְ/אֶדְרֶֽעִי
  choice: ఎద్రెయీలోను
  rationale: స్థలపేరును లిప్యంతరీకరించి, సంధానాన్ని మరియు స్థానార్థాన్ని ‘లోను’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: רְפָאִים అనే పదాన్ని ప్రజాసమూహపు పేరుగా ఉంచాలా, ‘దైత్యులు’గా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘రెఫాయీయులు’
  alternative: ‘దైత్యులు’ లేదా ‘అసాధారణ ఎత్తుగలవారు’
  rationale: హీబ్రూ పదం ఒక ప్రాచీన ప్రజాసమూహాన్ని సూచిస్తుంది; వారి గొప్ప దేహాకారానికి సంబంధించిన సంప్రదాయం ఉన్నప్పటికీ, దానినే ప్రధాన పాఠ్యంలో నిర్బంధ అర్థంగా పెట్టడం మూలంలోని విస్తృతిని తగ్గిస్తుంది. అందువల్ల వివరణను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక-భౌగోళిక జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. ‘ఓగు’, ‘బాషాను’, ‘అష్టారోతు’, ‘ఎద్రెయీ’, ‘రెఫాయీయులు’ రూపాలు తెలుగు బైబిలు నామరూప సంప్రదాయానికి దగ్గరగా ఉండేలా, మూల ధ్వనులను గుర్తించగల విధంగా ఎంచుకున్నాం.
