source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: te
  text: అరాబా[a] కూడా—తూర్పున కిన్నెరెతు సముద్రం వరకు, అలాగే బేత్-యెషీమోతు వైపుగా తూర్పున అరాబా సముద్రమైన ఉప్పు సముద్రం[b] వరకు—మరియు దక్షిణం వైపున పిస్గా వాలుల దిగువన ఉన్న భాగం కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మైదానం.” ఇక్కడ ఈ పదం సాధారణ మైదానాన్ని కాక, యొర్దాను చీలిక లోయ ప్రాంతాన్ని సూచించే ప్రత్యేక భౌగోళిక పేరుగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అరాబా సముద్రం, ఉప్పు సముద్రం” అనేది తరువాత సాధారణంగా “మృత సముద్రం” అని పిలువబడే సముద్రాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: అరాబా
  rationale: సరిహద్దుల భౌగోళిక వర్ణనలో ఇది సాధారణ ‘మైదానం’ కంటే యొర్దాను చీలిక లోయ ప్రాంతానికి ప్రత్యేక నామంగా ఉండే అవకాశమున్నందున లిప్యంతరీకరించబడింది.
- source_word: יָם כִּנְרוֹת
  choice: కిన్నెరెతు సముద్రం
  rationale: హీబ్రూ స్థలనామాన్ని నిలుపుతూ సహజమైన తెలుగు నామపద క్రమంలో అనువదించబడింది.
- source_word: מִזְרָחָה
  choice: తూర్పున
  rationale: దిశను సూచించే హీబ్రూ రూపాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు భౌగోళిక ప్రయోగంతో తెలిపింది.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: అరాబా సముద్రమైన ఉప్పు సముద్రం
  rationale: రెండవ పేరు మొదటిదాన్ని గుర్తించే హీబ్రూ సమానాధికార నిర్మాణాన్ని స్పష్టంగా, కానీ ఆధునిక ‘మృత సముద్రం’ పేరును మూలపాఠ్యంలోకి చేర్చకుండా తెలిపింది.
- source_word: דֶּרֶךְ בֵּית הַיְשִׁמוֹת
  choice: బేత్-యెషీమోతు వైపుగా
  rationale: ఇక్కడ דֶּרֶךְ సరిహద్దు లేదా దిశను సూచిస్తుంది; ‘వైపుగా’ తెలుగు భౌగోళిక వర్ణనలో సహజంగా ఉంటుంది.
- source_word: וּמִתֵּימָן
  choice: దక్షిణాన
  rationale: ఈ పదబంధం దక్షిణ దిక్కున ఉన్న భూభాగాన్ని సూచిస్తుంది; హీబ్రూ מן రూపాన్ని యాంత్రికంగా ‘దక్షిణం నుండి’ అని చేయకుండా సందర్భానుసారంగా అనువదించబడింది.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: పిస్గా వాలులకు దిగువన
  rationale: స్థలాకృతిని సూచించే תַּחַת మరియు אַשְׁדּוֹת పదాలకు స్పష్టమైన ఆధునిక తెలుగు రూపం; పిస్గా స్థలనామంగా నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన భౌగోళిక జాబితా శైలి అనుసరించబడింది. స్థలనామాలు లిప్యంతరీకరించబడ్డాయి; హీబ్రూ వాక్య నిర్మాణంలోని సంక్షిప్తతను కాపాడుతూ తెలుగులో వాక్యం అసంపూర్ణంగా అనిపించకుండా చివర ‘ఉన్న ప్రాంతం’ చేర్చబడింది. ‘ఉప్పు సముద్రం’ అనే మూలపాఠ్య నామమే ప్రధాన పాఠ్యంలో ఉంచబడింది.
