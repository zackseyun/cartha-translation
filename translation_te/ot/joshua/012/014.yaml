lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ప్రతి పట్టణాన్ని పాలించిన రాజును సూచించే నిర్మాణ రూపం. తెలుగులో ‘హోర్మా రాజు’ అనే సహజమైన నిర్మాణం సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָרְמָה
  choice: హోర్మా
  rationale: స్థలనామాన్ని అనువదించకుండా, ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ఓడిపోయిన ప్రతి రాజును లెక్కించే పునరావృత జాబితా శైలిని నిలుపుతూ, వ్యక్తిని సూచించేందుకు తెలుగు పుంలింగ రూపాన్ని వాడాం.
- source_word: עֲרָד
  choice: అరాదు
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
