  to: యొర్దాను అవతల పడమటి వైపున, లెబానోను లోయలోని బయల్‌గాదు మొదలుకొని శేయీరు వైపునకు ఎగసే హాలాక్ పర్వతం వరకు, యెహోషువ మరియు ఇశ్రాయేలు కుమారులు ఓడించిన దేశపు రాజులు వీరే.[b] యెహోషువ ఆ దేశాన్ని ఇశ్రాయేలు గోత్రాలకు వారి వారి విభాగాల ప్రకారం స్వాస్థ్యంగా ఇచ్చాడు.
