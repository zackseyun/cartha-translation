source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: te
  text: యొర్దాను అవతల పడమటి వైపున, లెబానోను లోయలోని బయల్‌గాదు మొదలుకొని శేయీరు వైపునకు ఎగసే హాలాక్ పర్వతం వరకు, యెహోషువ మరియు ఇశ్రాయేలు కుమారులు ఓడించిన దేశపు రాజులు వీరే.[b] యెహోషువ ఆ దేశాన్ని ఇశ్రాయేలు గోత్రాలకు వారి వారి విభాగాల ప్రకారం స్వాస్థ్యంగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “శేయీరువైపు ఎక్కే హాలాక్ పర్వతం.”
    reason: హీబ్రూ הָעֹלֶה שֵׂעִירָהలోని ‘ఎగసే/ఎక్కే’ అనే భౌగోళిక వర్ణనకు సహజమైన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: తదుపరి జాబితాను పరిచయం చేస్తూ, ముందున్న సందర్భంతో సహజమైన తెలుగు అనుసంధానాన్ని ఉంచుతుంది.
- source_word: מַלְכֵי הָאָרֶץ
  choice: దేశపు రాజులు
  rationale: ఆధునిక జాతీయరాష్ట్ర భావాన్ని తప్పనిసరిగా సూచించకుండా, భూభాగ సంబంధమైన అర్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הִכָּה
  choice: ఓడించిన
  rationale: యుద్ధ సందర్భంలో נכה అనే క్రియకు ఉన్న జయించడం లేదా కూలదోయడం అనే భావాన్ని సహజంగా అందిస్తుంది; రాజులందరూ వ్యక్తిగతంగా చంపబడ్డారని అవసరానికి మించి నిర్ధారించదు.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: మరియు ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్ని, దాని సాంప్రదాయిక ప్రజాసమూహ సూచనతో సహా, సూటిగా నిలుపుతుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: యొర్దాను అవతల పడమటి వైపున
  rationale: నదికి అవతలి వైపు అనే సంబంధ భావాన్నీ, పడమటి దిశను సూచించే יָמָּה భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: מִבַּעַל גָּד
  choice: బయల్‌గాదు మొదలుకొని
  rationale: స్థల నామాన్ని లిప్యంతరీకరించి, పరిధి ఆరంభాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: లెబానోను లోయలోని
  rationale: בִּקְעָה సూచించే విశాల లోయ లేదా మైదాన లోయ భావానికి సందర్భోచితమైన తెలుగు.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: హాలాకు కొండ వరకు
  rationale: సందర్భంలో భౌగోళిక స్థలనామంగా తీసుకొని, వివరణాత్మకంగా 'నునుపైన కొండ' అని అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: శేయీరు వైపునకు ఎగసే
  rationale: పర్వతారోహణ లేదా దిశను సూచించే అస్పష్టతను నిలుపుతూ సహజమైన భౌగోళిక వర్ణన ఇస్తుంది.
- source_word: וַיִּתְּנָהּ
  choice: యెహోషువ ఆ దేశాన్ని ... ఇచ్చాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం తిరిగి 'దేశం/భూమి'ని సూచిస్తుందని తెలుగులో స్పష్టపరుస్తుంది.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలకు
  rationale: యెహోషువలో భూవిభజనకు సంబంధించిన ప్రామాణిక పదప్రయోగం.
- source_word: יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: వారి వారి విభాగాల ప్రకారం స్వాస్థ్యంగా
  rationale: వంశపారంపర్యంగా పొందిన భూస్వాధీన భావాన్నీ, గోత్ర విభాగాల ప్రకారమైన కేటాయింపునీ నిలుపుతుంది.
theological_decisions:
- issue: నכה క్రియ రాజులను చంపడాన్నా లేక యుద్ధంలో ఓడించడాన్నా సూచిస్తుంది
  choice: ఓడించిన
  alternative: హతమార్చిన
  rationale: విజయసందర్భంలో క్రియకు విస్తృతమైన యుద్ధపరమైన అర్థం ఉంది; మూలం నిర్బంధించని చోట ప్రతి రాజు మరణాన్ని అనువాదం ప్రత్యేకంగా నిర్ధారించదు.
- issue: בני ישראל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని రూపాన్ని నిలుపుతూ, దానిని కేవలం ఆధునిక సమానార్థ పదంగా మార్చలేదు; ఇది ఇశ్రాయేలు ప్రజలను సమూహంగా సూచించే సాంప్రదాయిక వ్యక్తీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ప్రదేశ నామాలు సాధారణ తెలుగు బైబిల్ ధ్వనిరూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని పొడవైన వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి, భావ సంబంధాన్ని కాపాడాం.
