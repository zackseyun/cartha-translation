source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: te
  text: హెష్బోనులో నివసిస్తూ, అర్నోను వాగులోయ ఒడ్డున ఉన్న అరోయేరు నుండి, ఆ వాగులోయ మధ్యభాగాన్నీ గిలాదులో సగభాగాన్నీ కలుపుకొని, అమ్మోనీయుల[b] సరిహద్దైన యబ్బోకు వాగులోయ[a] వరకు పరిపాలించిన అమోరీయుల రాజు సీహోను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వాగులోయ’గా అనువదించిన హీబ్రూ పదం వాగు ప్రవహించే లోయను, వాగును లేదా ప్రవాహపాత్రను సూచించవచ్చు. ఇక్కడ అర్నోను, యబ్బోకు భూసరిహద్దులుగా పేర్కొనబడ్డాయి.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘అమ్మోను కుమారులు’; అంటే అమ్మోనీయులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹשֵׁב
  choice: నివసిస్తూ
  rationale: ישב అనే కృదంతం ఇక్కడ ఒక చోట నివాసముండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసిస్తూ’ సహజంగా ఉండి, తరువాతి ‘పరిపాలించిన’ అనే కృదంతంతో వాక్యాన్ని సాఫీగా కలుపుతుంది.
- source_word: מֹשֵׁל
  choice: పరిపాలించిన
  rationale: משל ఇక్కడ పేర్కొన్న భూభాగంపై సీహోను నిర్వహించిన రాజాధికారాన్ని సూచిస్తుంది. ‘పరిపాలించిన’ రాజకీయ పాలన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵעֲרוֹעֵר
  choice: అరోయేరు నుండి
  rationale: מ అనే ఉపసర్గ భూభాగ విస్తృతి ప్రారంభమయ్యే స్థానాన్ని సూచిస్తుంది; ‘నుండి’ దానిని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: అర్నోను లోయ ఒడ్డున
  rationale: שפה అంటే అంచు లేదా ఒడ్డు; נחל లోయ, వాగు ప్రవహించే లోయ, లేదా ప్రవాహపాత్రను సూచించవచ్చు. ‘లోయ ఒడ్డున’ భౌగోళిక భావాన్ని కాపాడుతూ దానిని శాశ్వత నదిగా నిర్దిష్టం చేయదు.
- source_word: וְתוֹךְ הַנַּחַל
  choice: ఆ లోయ మధ్యభాగాన్ని
  rationale: תוך అంటే మధ్య లేదా నడిమి భాగం. భూభాగాల జాబితాలో ఇది సీహోను ఆధీనంలోని ప్రాంతంగా ఉండటంతో తెలుగులో కర్మవిభక్తిని ఉపయోగించడం సహజం; మూలంలోని సంక్షిప్త నిర్మాణాన్ని అతిగా వివరణాత్మకం చేయలేదు.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: గిలాదులో సగభాగాన్ని
  rationale: חצי ఒక ప్రాంతంలోని సగం వాటాను సూచిస్తుంది. ‘గిలాదులో సగభాగం’ ఆధునిక తెలుగులో స్పష్టమైన ప్రాదేశిక వ్యక్తీకరణ.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: యబ్బోకు లోయ వరకు
  rationale: עד భూభాగపు చివరి హద్దును సూచిస్తుంది. נחל లోని భౌగోళిక అస్పష్టతను ‘లోయ’తో నిలిపి, పాదసూచికలో ప్రత్యామ్నాయ భావాలను తెలిపాం.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల సరిహద్దు
  rationale: בני עמון అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అయినా, ఇది జాతిని సూచించే హీబ్రూ ప్రయోగం. సాధారణ తెలుగు పాఠకునికి ‘అమ్మోనీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో నమోదు చేశాం.
- source_word: הָאֱמֹרִי
  choice: అమోరీయుల
  rationale: రూపరీత్యా ఏకవచన విశేషణమైనా, ‘రాజు’తో కూడిన ఈ నిర్మాణం అమోరీయుల ప్రజాజాతిపై రాజ్యాధికారాన్ని సూచిస్తుంది. తెలుగులో ‘అమోరీయుల రాజు’ సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఇది రాజుల జాబితాలోని నామవాచక ఖండంగా ఉన్నందున, ‘సీహోను’ను ప్రధాన నామంగా ఉంచి నివాసం, పాలనా విస్తృతి తెలిపే కృదంత నిర్మాణాన్ని అనుసరించాం. మూలంలోని נחל పదానికి ఉన్న లోయ/వాగు/ప్రవాహపాత్ర అస్పష్టతను ప్రధాన పాఠ్యంలో ‘లోయ’తో, పాదసూచికలో విస్తృతంగా నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక [a] స్థానభ్రంశంగా కనిపించినందున, మూలభాష ఆధారంగా గుర్తులను తగిన పదాల వద్ద అమర్చాం.
