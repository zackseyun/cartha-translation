  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సంక్షిప్తమైన జాబితా శైలిని గౌరవప్రదంగా నిలుపుతూ అనువదించాం. డ్యాష్, అర్ధవిరామం ద్వారా ప్రతి రాజును విడిగా లెక్కించే నిర్మాణం స్పష్టమవుతుంది.
