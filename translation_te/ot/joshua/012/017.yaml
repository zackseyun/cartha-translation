lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ప్రతి పట్టణాన్ని పాలించిన రాజును సూచించే నిర్మాణ రూపం. తెలుగులో స్థలనామం తరువాత ‘రాజు’ అని ఉంచడం సహజంగా ఉంటుంది.
- source_word: תַּפּוּחַ
  choice: తప్పూయహు
  rationale: ఇది స్థలనామం; దాని హీబ్రూ ఉచ్చారణను సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జయించబడిన రాజులను ఒక్కొక్కరిగా లెక్కించే సంక్షిప్త జాబితా సూత్రాన్ని నిలుపుతుంది; వ్యక్తిని సూచిస్తున్నందున ‘ఒకడు’ సహజం.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: రెండవ అంశంలోనూ మొదటి అంశంలోని పునరావృత నిర్మాణాన్ని నిలిపాం.
- source_word: חֵפֶר
  choice: హెఫెరు
  rationale: ఇది స్థలనామం; హీబ్రూ పేరును తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: మొదటి అంశంలాగే, ఒక్కో ఓడిపోయిన రాజును విడివిడిగా లెక్కించే హీబ్రూ సూత్రాన్ని ప్రతిబింబిస్తుంది.
