  text: తానాకు రాజు ఒకడు; మెగిద్దో రాజు ఒకడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత వివరణాత్మకంగా, ‘తానాకు రాజు—ఒక రాజు; మెగిద్దో రాజు—ఒక రాజు’ అని అనువదించవచ్చు. హీబ్రూ జాబితాలో లెక్క సూచించడానికి ‘ఒకడు’ అనే పదమే పునరావృతమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ఇది ప్రతి నగర-రాజ్యపు పాలకుణ్ణి సూచించే నిర్మిత రూపం. తెలుగులో నగరనామం తరువాత ‘రాజు’ ఉంచడం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: תַּעְנַךְ
  choice: తానాకు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జాబితాలో లెక్కను తెలిపే పదం. రాజు వ్యక్తి కాబట్టి తెలుగులో సహజమైన పుంలింగ సంఖ్యారూపమైన ‘ఒకడు’ వాడి, హీబ్రూలోని సంక్షిప్త పునరుక్తిని నిలిపాం.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: రెండవ నమోదులోనూ అదే నిర్మిత రూపం ఉంది; మొదటి నమోదుతో ఏకరీతిగా అనువదించాం.
- source_word: מְגִדּוֹ
  choice: మెగిద్దో
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: విజయాల జాబితాలో పునరావృతమయ్యే లెక్కింపు సూత్రాన్ని ప్రతిబింబించేందుకు అదే రూపాన్ని ఉంచాం.
