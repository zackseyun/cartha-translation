  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సంక్షిప్త జాబితా శైలిని మరియు లెక్కింపు లయను నిలిపాం. స్థలనామాలను అనువదించకుండా లిప్యంతరీకరించాం; నిజమైన పాఠ్య సందిగ్ధతను పాదసూచికలో తెలిపాం.
