  text: the king of Shimron-meron[a], one; the king of Achshaph, one.
translation:
  language: te
  text: షిమ్రోను-మెరోను[a] రాజు ఒకడు; అక్షాపు రాజు ఒకడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇవి ‘షిమ్రోను,’ ‘మెరోను’ అనే రెండు వేర్వేరు స్థలనామాలు కావచ్చని కూడా భావించవచ్చు. అయితే హీబ్రూ పాఠాన్ని ఇక్కడ సాధారణంగా ‘షిమ్రోను-మెరోను’ అనే సంయుక్త పేరుగా తీసుకుంటారు; ఈ వచనంలో ఇద్దరు రాజులనే లెక్కించడం కూడా దీనికి సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: జయించిన రాజుల జాబితాలో ప్రతి పట్టణ-రాజ్య పాలకుణ్ణి సూచించే సూత్రప్రాయ పదం; తెలుగులో స్థలనామం తరువాత ‘రాజు’ అనడం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: షిమ్రోను-మెరోను
  rationale: మసోరా స్వరచిహ్నాలు, ఉచ్చారణ విభజన మరియు ఈ వచనంలోని ఇద్దరు రాజుల లెక్కకు అనుగుణంగా దీనిని సంయుక్త స్థలనామంగా లిప్యంతరీకరించాం; వేరువేరు పేర్లుగా ఉండే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: అధ్యాయమంతటా పునరావృతమయ్యే లెక్కింపు సూత్రంలో ఇది ‘ఒక రాజు’ అనే సంక్షిప్త భావాన్ని ఇస్తుంది. వ్యక్తిని లెక్కిస్తున్నందున తెలుగులో ‘ఒకడు’ సహజం.
- source_word: אַכְשָׁף
  choice: అక్షాపు
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
