  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ఈ జయించిన రాజుల జాబితాలో מֶלֶךְ ప్రతి నగర-రాజ్యపు పాలకుణ్ణి సూచిస్తుంది. తెలుగు పదక్రమంలో నగరనామం తరువాత ‘రాజు’ ఉంచడం సహజంగా ఉండి, హీబ్రూ లెక్కింపు సూత్రాన్ని నిలుపుతుంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ఇక్కడ אֶחָד జాబితాలోని లెక్కను తెలియజేస్తుంది. రాజు పురుషవాచక వ్యక్తి కాబట్టి ‘ఒకడు’ సహజమైన తెలుగు రూపం; ‘ఒక రాజు’ అని విస్తరించకుండా మూలంలోని సంక్షిప్త శైలిని కాపాడుతుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: రెండవ అంశంలోనూ అదే అర్థం, అదే వాక్యనిర్మాణ పాత్ర ఉన్నందున ఒకే విధంగా అనువదించాం.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: పునరావృతమైన లెక్కింపు పదాన్ని మొదటి అంశంతో సమానంగా అనువదించి జాబితా సూత్రాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే సంక్షిప్త జాబితా శైలి. హీబ్రూ మూలంలోని సమాంతర నిర్మాణం మరియు ప్రతి రాజుకు సంబంధించిన ‘ఒకడు’ అనే లెక్క యథాతథంగా నిలుపబడ్డాయి.
