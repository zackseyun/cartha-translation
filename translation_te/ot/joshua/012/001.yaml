  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని దీర్ఘ భౌగోళిక నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచేందుకు ప్రధాన సూచనను ముందుకు తెచ్చి, సంబంధ వాక్యాన్ని డాష్ తరువాత ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
