source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] ఓడించి, యొర్దాను అవతల సూర్యోదయ దిక్కున[b], అర్నోను వాగులోయ[c] నుండి హెర్మోను పర్వతం వరకు, తూర్పువైపుననున్న అరాబా[d] ప్రాంతమంతటితో కూడిన వారి దేశాన్ని స్వాధీనం చేసుకున్న దేశపు రాజులు వీరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు’; హెబ్రీలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘సూర్యుడు ఉదయించే దిశగా,’ అంటే తూర్పువైపు.
    reason: lexical_alternative
  - marker: c
    text: ‘వాగులోయ’ అంటే కాలానుగుణంగా ప్రవాహం పారే లోయ లేదా ప్రవాహపాత్ర; దీనిని ‘అర్నోను వాగు’ లేదా ‘అర్నోను లోయ’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: d
    text: లేదా ‘మైదానం’; ‘అరాబా’ అనేది యొర్దాను చీలికలోయ ప్రాంతానికి వాడే నిర్దిష్ట భౌగోళిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: కొత్త జాబితాను పరిచయం చేసే సూచనార్థక రూపం. హెబ్రీలో స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ లేకపోవడంతో దానిని చేర్చలేదు.
- source_word: מַלְכֵי הָאָרֶץ
  choice: దేశపు రాజులు
  rationale: నిర్దిష్ట భూభాగాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר הִכּוּ
  choice: వీరిని ఓడించి
  rationale: సైనిక సందర్భంలో נכה శత్రువును కొట్టి ఓడించడాన్ని సూచిస్తుంది; ప్రతి రాజు చంపబడ్డాడని అవసరానికి మించి నిర్ధారించదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీ నుడికారపు రూపాన్ని నిలుపుతూ, దాని సామూహిక అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וַיִּרְשׁוּ אֶת־אַרְצָם
  choice: వీరి దేశాన్ని స్వాధీనం చేసుకున్నారు
  rationale: ఆక్రమణ సందర్భంలో ירשׁ యొక్క ‘స్వాధీనపరచుకొని అధీనంలోకి తెచ్చుకోవడం’ అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: యొర్దాను అవతల
  rationale: భౌగోళికంగా ‘యొర్దానుకు ఆవలివైపు’ అనే భావాన్ని సంక్షిప్తంగా ఇస్తుంది; వెంట వచ్చే తూర్పు సూచన దిశను స్పష్టం చేస్తుంది.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ
  choice: సూర్యోదయ దిక్కున
  rationale: అక్షరార్థమైన ‘సూర్యుడు ఉదయించే దిశగా’ అనే చిత్రాత్మకతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִנַּחַל אַרְנוֹן
  choice: అర్నోను వాగులోయ మొదలుకొని
  rationale: נחל ఇక్కడ ప్రవాహం పారే లోయను సూచిస్తుంది; ‘వాగులోయ’ భౌగోళిక స్వరూపాన్ని తెలియజేస్తుంది.
- source_word: עַד הַר חֶרְמוֹן
  choice: హెర్మోను పర్వతం వరకు
  rationale: భూభాగపు విస్తృతి ముగిసే హద్దును సహజంగా సూచిస్తుంది.
- source_word: וְכָל־הָעֲרָבָה
  choice: అరాబా ప్రాంతమంతటిలోని
  rationale: עֲרָבָהను సాధారణ ‘మైదానం’గా చదును చేయకుండా, నిర్దిష్ట భౌగోళిక ప్రాంతనామంగా నిలుపుతుంది.
- source_word: מִזְרָחָה
  choice: తూర్పున ఉన్న
  rationale: ముగింపు భౌగోళిక దిశాసూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
