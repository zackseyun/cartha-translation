  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: te
  text: యాహ్వే సేవకుడైన మోషే, ఇశ్రాయేలు కుమారులు[a] వారిని ఓడించారు. యాహ్వే సేవకుడైన మోషే ఆ భూభాగాన్ని రూబేనీయులకు, గాదీయులకు, మనష్షే అర్ధగోత్రానికి స్వాస్థ్యంగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: మోషేకు గౌరవప్రదమైన బిరుదుగా, యాహ్వేకు అంకితమైన సేవను మరియు ఆయన అప్పగించిన బాధ్యతను సూచిస్తుంది; బానిసత్వాన్ని ప్రధానంగా సూచించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణానుసార రూపాన్ని నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని అక్షరార్థమైన, వ్యాకరణపరంగా పుంలింగ బహువచన కార్పొరేట్ వ్యక్తీకరణను ప్రతిబింబిస్తుంది; సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: הִכּוּם
  choice: వారిని హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టి పడగొట్టడం లేదా చంపడం అనే బలమైన భావాన్ని ఇక్కడ వ్యక్తపరుస్తుంది; రాజులపై సాధించిన ప్రాణాంతక విజయాల సారాంశానికి ఇది సరిపోతుంది.
- source_word: וַיִּתְּנָהּ
  choice: ఆ దేశాన్ని ... ఇచ్చాడు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలో అంతర్లీనంగా ఉన్న దేశాన్ని లేదా భూభాగాన్ని సూచిస్తుంది; తెలుగులో సూచ్యార్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: יְרֻשָּׁה
  choice: స్వాస్థ్యంగా
  rationale: వారసత్వంగా పొందిన శాశ్వత భూస్వాధీన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָרֻאוּבֵנִי
  choice: రూబేనీయులకు
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ సమూహార్థంలో రూబేను గోత్రస్థులను సూచిస్తుంది.
- source_word: לַגָּדִי
  choice: గాదీయులకు
  rationale: ఏకవచన జాతివాచక రూపం సందర్భంలో గాదు గోత్రస్థులను సమూహంగా సూచిస్తుంది.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రానికి
  rationale: యొర్దాను తూర్పున భూభాగం పొందిన మనష్షే గోత్రంలోని సగభాగాన్ని ఖచ్చితంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి బిరుదైన ‘ప్రభువు’తో మార్చకుండా, మూలానికి దగ్గరైన ‘యాహ్వే’ రూపాన్ని వాడింది.
- issue: בְנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సహజమైన సామూహిక అర్థాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘స్వాస్థ్యం,’ ‘గోత్రం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని పరిమితంగా ఉపయోగించి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది.
