revisions:
- from: యాహ్వే సేవకుడైన మోషే, ఇశ్రాయేలు కుమారులు[a] వారిని హతమార్చారు. యాహ్వే సేవకుడైన మోషే ఆ దేశాన్ని రూబేనీయులకు, గాదీయులకు, మనష్షే అర్ధగోత్రానికి స్వాస్థ్యంగా ఇచ్చాడు.
  to: యాహ్వే సేవకుడైన మోషే, ఇశ్రాయేలు కుమారులు[a] వారిని ఓడించారు. యాహ్వే సేవకుడైన మోషే ఆ భూభాగాన్ని రూబేనీయులకు, గాదీయులకు, మనష్షే అర్ధగోత్రానికి స్వాస్థ్యంగా ఇచ్చాడు.
  rationale: హీబ్రూ הִכּוּם యొక్క సైనిక సందర్భార్థాన్ని, అనవసరంగా మరణాన్ని నిర్దిష్టం చేయకుండా, ఓడించారు అని సవరించాం. వాక్యప్రవాహం కోసం ఆ దేశాన్ని స్థానంలో ఆ భూభాగాన్ని వాడాం; ఇది సందర్భంలో సూచితమైన భూమిని స్పష్టంగా తెలియజేస్తుంది. మిగిలిన పదజాలం మూలపాఠానికి, ఆధునిక ప్రామాణిక తెలుగు వినియోగానికి అనుగుణంగా ఉంది.
