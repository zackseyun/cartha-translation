  naturalness: The revised phrasing is more idiomatic and compact in modern standard Telugu. It also places the modifier directly before the place name it qualifies, avoiding the slightly cumbersome “కర్మెలు దగ్గర ఉన్న యొక్నెయాము.”
  terminology: The transliterated place names and “రాజు ... ఒకడు” appropriately retain the catalogue register. The footnote should explicitly identify Carmel as the possible regional association, not merely an unspecified association.
