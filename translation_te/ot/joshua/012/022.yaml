lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ఓడిపోయిన రాజుల ఈ జాబితాలో ప్రతి పట్టణ-రాజ్య పాలకుణ్ణి సూచించే సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: קֶדֶשׁ
  choice: కెదెషు
  rationale: స్థలనామాన్ని అనువదించకుండా, తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: యెహోషువ 12లో ప్రతి నమోదును లెక్కించే పునరుక్త శైలిని నిలుపుతుంది; వ్యక్తిని సూచిస్తున్నందున ‘ఒకడు’ సహజం.
- source_word: יָקְנֳעָם
  choice: యొక్నెయాము
  rationale: స్థలనామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לַכַּרְמֶל
  choice: కర్మెలు దగ్గర ఉన్న
  rationale: ל ఉపసర్గ ఇక్కడ స్థానం లేదా ప్రాంతీయ సంబంధాన్ని సూచించవచ్చు. ‘దగ్గర ఉన్న’ అనేది కర్మెలు పక్కన ఉన్న స్థానమనే సంభావ్య భావాన్ని సహజంగా తెలియజేస్తూ, సంబంధ స్వభావాన్ని అతిగా నిర్దిష్టం చేయదు.
