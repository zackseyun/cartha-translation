  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా యొక్క సంక్షిప్తతను మరియు ‘ఒకడు’ అనే లెక్కింపు పునరుక్తిని నిలిపాం. కర్మెలుతో యొక్నెయాముకు ఉన్న సంబంధంలోని మూలభాషా అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
