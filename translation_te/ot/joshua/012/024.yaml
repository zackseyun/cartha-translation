    issue: Redundant summative wording
    rationale: 'The phrase “రాజులందరూ మొత్తం” duplicates the summative sense: “అందరూ” already renders כָּל (‘all’), while “మొత్తం” has no direct lexical counterpart needed in the source.'
  - severity: low
    issue: Sentence punctuation weakens list continuity
    rationale: The Hebrew presents the final entry and total in one compact enumerative unit. A semicolon naturally retains that relationship in Telugu.
