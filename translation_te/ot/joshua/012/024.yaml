lexical_decisions:
- source_word: מֶלֶךְ תִּרְצָה
  choice: తిర్సా రాజు
  rationale: మֶלֶךְ అనేది తరువాతి స్థలనామంతో నిర్మాణ సంబంధంలో ఉంది. తెలుగు జాబితా శైలిలో సహజంగా ఉండేలా ‘తిర్సా రాజు’ అని అనువదించబడింది.
- source_word: תִּרְצָה
  choice: తిర్సా
  rationale: ఇది స్థలనామం; అర్థానువాదం చేయకుండా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జాబితాలో ఆ పట్టణానికి చెందిన ఒక రాజును లెక్కించే పుంలింగ సంఖ్యావాచకంగా ఇవ్వబడింది.
- source_word: כָּל מְלָכִים
  choice: రాజులందరూ మొత్తం
  rationale: כָּל జాబితా ముగింపులో సమగ్ర లెక్కను పరిచయం చేస్తుంది. తెలుగులో తుది మొత్తమని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘అందరూ మొత్తం’ అని ఇవ్వబడింది.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: ముప్పై ఒక్కరు
  rationale: హీబ్రూ సంయుక్త సంఖ్యకు సహజమైన తెలుగు రూపం; వ్యక్తులైన రాజులను సూచిస్తున్నందున ‘ఒక్కరు’ రూపం వాడబడింది.
