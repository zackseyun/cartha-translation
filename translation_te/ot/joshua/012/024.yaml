translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుల జాబితా ముగింపుకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హీబ్రూ పాఠంలోని విభజనను అనుసరించి మొదటి అంశం తరువాత పూర్తి విరామం ఉంచి, రెండవ వాక్యంలో తుది మొత్తాన్ని తెలిపాం.
