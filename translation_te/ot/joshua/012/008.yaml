  text: בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בָֽ/עֲרָבָה֙ וּ/בָ֣/אֲשֵׁד֔וֹת וּ/בַ/מִּדְבָּ֖ר וּ/בַ/נֶּ֑גֶב הַֽ/חִתִּי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: te
  text: కొండప్రాంతంలోను, దిగువ మైదానంలోను[a], అరాబాలోను[b], వాలుదారుల్లోను, అరణ్యంలోను, నెగెవులోను[c] ఉన్న హిత్తీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షెఫేలాలో”; ఇది పశ్చిమంలోని దిగువభూమి లేదా కొండపాద ప్రాంతం పేరు.
    reason: lexical_alternative
  - marker: b
    text: “అరాబా” చీలిక లోయలోని ఎడారి మైదాన ప్రాంతనామం; లేదా “ఎడారి మైదానంలో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “దక్షిణ ప్రాంతంలో”; హీబ్రూ ‘నెగెవ్’ ప్రత్యేక దక్షిణ ప్రాంతాన్నీ, సాధారణంగా ‘దక్షిణం’ అనీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: కొండప్రాంతంలో
  rationale: הַר ఇక్కడ ఒకే కొండను కాక భౌగోళిక కొండప్రాంతాన్ని సూచిస్తుంది.
- source_word: וּבַשְּׁפֵלָה
  choice: దిగువ మైదానంలో
  rationale: שְׁפֵלָה పశ్చిమ దిగువభూమి/కొండపాద ప్రాంతాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యే భౌగోళిక పదబంధాన్ని ఎంచుకున్నాం.
- source_word: וּבָעֲרָבָה
  choice: అరాబాలో
  rationale: עֲרָבָה ఇక్కడ చీలిక లోయలోని ఎడారి మైదాన ప్రాంతానికి భౌగోళిక నామంగా పనిచేస్తుంది; అందువల్ల ప్రాంతనామాన్ని నిలిపాం.
- source_word: וּבָאֲשֵׁדוֹת
  choice: వాలుభూముల్లో
  rationale: אֲשֵׁדוֹת కొండల దిగువకు వాలే భూములను సూచిస్తుంది; తెలుగు సహజత్వం కోసం ‘వాలుభూములు’ వాడాం.
- source_word: וּבַמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారిని కాక జనావాసం తక్కువైన బీడు/అరణ్య ప్రాంతాన్ని సూచించగలదు.
- source_word: וּבַנֶּגֶב
  choice: నెగెవులో
  rationale: נֶגֶב ‘దక్షిణం’ అనే సాధారణ అర్థంతో పాటు ప్రత్యేక దక్షిణ ప్రాంతనామం; ఈ భౌగోళిక జాబితాలో ప్రాంతనామమే తగినది.
- source_word: הַחִתִּי הָאֱמֹרִי וְהַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: హిత్తీయులు, అమోరీయులు, కనానీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్న ఈ జాతినామాలు సమూహార్థకాలు; తెలుగులో సహజమైన బహువచన జాతినామాలుగా అనువదించాం.
