translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భౌగోళిక జాబితా లయను నిలుపుతూ సరళమైనా గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సమూహార్థక జాతినామాలు తెలుగు బహువచనంలో ఇవ్వబడ్డాయి. ప్రాంతనామాల అర్థభేదాలు పాదసూచికల్లో నిలుపబడ్డాయి.
