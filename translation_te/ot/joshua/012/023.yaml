translation:
  language: te
  text: నాఫత్-దోరులోని దోరు రాజు[a]—ఒకడు; గిల్గాలులోని గోయీము రాజు[b]—ఒకడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాఫత్-దోరు’ను ‘దోరు ఎత్తైన ప్రదేశాలు’ లేదా ‘దోరు ప్రాంతం/జిల్లా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గోయీము’ అనే హీబ్రూ పదానికి సాధారణంగా ‘జనాలు’ లేదా ‘దేశాలు’ అని అర్థం. అయితే ఇక్కడ అది స్థలనామంగా లేదా ప్రాంతీయ పేరుగా వాడబడి ఉండవచ్చు. అందువల్ల ఈ పదబంధాన్ని ‘గిల్గాలులోని జనాల రాజు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ఓడిపోయిన రాజుల జాబితాలో ప్రతి అంశాన్ని పరిచయం చేసే నిర్మాణం. తెలుగులో సంబంధవాచక పదబంధంతో ‘... రాజు’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: דּוֹר
  choice: దోరు
  rationale: ఇది స్థలనామం; అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: לְנָפַת דּוֹר
  choice: దోరు ప్రాంతంలోని
  rationale: נָפָה ఇక్కడ దోరుకు సంబంధించిన భౌగోళిక ప్రాంతం లేదా జిల్లా అనే భావాన్ని ఇస్తుంది. ‘ప్రాంతంలోని’ అనేది మూలంలోని సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ఎత్తైన ప్రదేశం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ఈ అధ్యాయంలోని పునరావృత లెక్కింపు సూత్రాన్ని నిలుపుతుంది. లెక్కించబడుతున్నవారు రాజులు కనుక తెలుగులో వ్యక్తులకు తగిన ‘ఒకడు’ వాడబడింది.
- source_word: גּוֹיִם
  choice: గోయీము
  rationale: ఈ సందర్భంలో ఇది స్థలం లేదా జనసమూహానికి సంబంధించిన ప్రత్యేక నామంగా ఉండవచ్చు. ప్రధాన పాఠంలో ధ్వన్యంతరీకరణ చేయడం ద్వారా ‘జనాలు/దేశాలు’ అని ముందుగానే అర్థాన్ని నిర్ణయించకుండా మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: לְגִלְגָּל
  choice: గిల్గాలులోని
  rationale: לְ ఉపసర్గ ఇక్కడ రాజుకు గిల్గాలుతో ఉన్న స్థానిక సంబంధాన్ని సూచిస్తుంది. ‘గిల్గాలులోని’ అనేది తెలుగులో సహజమైన భౌగోళిక అనుసంధానం.
