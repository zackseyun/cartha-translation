- source_word: גֶּזֶר
  choice: గెజెరు
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: రెండవ రాజును కూడా అదే జాబితా-లెక్కింపు విధానంలో ‘ఒకడు’ అని అనువదించాం.
