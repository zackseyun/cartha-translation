  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సంక్షిప్త జాబితా శైలిని కాపాడుతూ గౌరవప్రదంగా అనువదించబడింది. రెండు అంశాల మధ్య విరామాన్ని స్పష్టంచేయడానికి దీర్ఘవిరామ చిహ్నం ఉపయోగించబడింది.
