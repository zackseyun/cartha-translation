translation:
  language: te
  text: దెబీరు రాజు—ఒకడు; గెదెరు రాజు—ఒకడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ఓడిపోయిన రాజుల జాబితాలో ప్రతి స్థలనామంతో సంబంధం కలిగిన పాలకుణ్ణి సూచిస్తుంది. తెలుగులో ‘దెబీరు రాజు’ అనే నిర్మాణం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: דְּבִר
  choice: దెబీరు
  rationale: ఇది స్థలనామం; మూల హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ప్రతి రాజును వ్యక్తిగా లెక్కించే జాబితా సందర్భంలో పుంలింగ వ్యక్తివాచక రూపమైన ‘ఒకడు’ సహజంగా ఉండి, హీబ్రూ వచనంలోని సంక్షిప్త లెక్కింపు శైలిని నిలుపుతుంది.
- source_word: גֶּדֶר
  choice: గెదెరు
  rationale: ఇది స్థలనామం; మూల హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
