  text: the king of Aphek[a], one; the king of Sharon, one.
translation:
  language: te
  text: అఫేకు రాజు, ఒకడు; షారోను రాజు, ఒకడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: జయించబడిన రాజుల జాబితాలో ప్రతి పాలకుణ్ణి సూచించే పదం. తెలుగు జాబితా శైలిలో స్థలనామం తరువాత ‘రాజు’ అనడం సహజంగా ఉండి, మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אֲפֵק
  choice: అఫేకు
  rationale: ఇది స్థలనామం; అనువదించకుండా ఆధునిక ప్రామాణిక తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ఈ విజయాల జాబితాలో ప్రతి ప్రాంతానికి సంబంధించిన ఒక రాజును లెక్కించే పదం. వ్యక్తిని సూచిస్తున్నందున తెలుగులో ‘ఒకడు’ సహజంగా ఉంటుంది; మూలంలోని సంక్షిప్త లెక్కింపు శైలినీ కాపాడుతుంది.
- source_word: לַ/שָּׁרוֹן
  choice: షారోను
  rationale: ల־ ఉపసర్గతో కూడిన నిర్దిష్ట ఉపపదం ఇక్కడ షారోను ప్రాంతాన్ని సూచిస్తుంది. తెలుగు స్థలనామ వాడుకలో ప్రత్యేక ఉపపదం అవసరం లేకుండా ‘షారోను’ సహజంగా ఉంటుంది; ‘షారోను మైదానం’ అనడం మూలంలో స్పష్టంగా లేని భౌగోళిక వివరణను చేర్చుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుల లెక్కింపు జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. రెండు భాగాల సమాంతర నిర్మాణం మరియు ప్రతి రాజుకు ‘ఒకడు’ అనే లెక్కింపు నిలుపబడ్డాయి.
