  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: పాలకుణ్ణి సూచించే సాధారణ పదం; ఓడిపోయిన రాజుల జాబితా శైలికి అనుగుణంగా సంక్షిప్తంగా ఉంచబడింది.
- source_word: יְרִיחוֹ
  choice: యెరికో
  rationale: ఈ స్థలపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జాబితాలో ప్రతి రాజును లెక్కించే ముగింపు సూత్రాన్ని నిలుపుతుంది; తెలుగులో వ్యక్తిని సూచిస్తున్నందున ‘ఒకడు’ సహజం.
- source_word: הָעַי
  choice: హాయి
  rationale: హీబ్రూ స్థలపేరుకు తెలుగులో సంప్రదాయంగా ప్రాచుర్యంలో ఉన్న రూపం; హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా వ్యక్తం చేయలేదు.
- source_word: אֲשֶׁר
  choice: ఉన్న
  rationale: హాయిని బేతేలుతో స్థానపరంగా అనుసంధానించే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִצַּד
  choice: పక్కన
  rationale: బేతేలుకు సమీపంలో లేదా దాని ప్రక్కన ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: ఈ స్థలపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
