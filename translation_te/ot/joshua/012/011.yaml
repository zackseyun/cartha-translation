  source_fidelity: హీబ్రూ వచనంలోని పునరావృత సంక్షిప్త లెక్కింపు నిర్మాణం—‘యర్మూతు రాజు …; లాకీషు రాజు …’—మరియు ప్రతి రాజుకు సంబంధించిన אֶחָד (‘ఒకడు’) సరిగ్గా ప్రతిఫలించబడ్డాయి. అర్థవిస్తరణ లేదా సిద్ధాంతపరమైన జోడింపు లేదు.
  naturalness: ‘యర్మూతు రాజు, ఒకడు; లాకీషు రాజు, ఒకడు’ అనే రూపం ఆధునిక ప్రామాణిక తెలుగులో జాబితా-లెక్కింపు సందర్భానికి సహజంగా ఉంది; మూలంలోని టెలిగ్రాఫిక్ శైలినీ నిలుపుతుంది.
  terminology: ‘రాజు’ מֶלֶךְకు తగినది. ‘యర్మూతు,’ ‘లాకీషు’ స్థలనామాల స్థిరమైన, చదవదగిన తెలుగు ధ్వన్యంతరీకరణలు. ‘ఒకడు’ అనేది సూచితమైన రాజును లెక్కించే אֶחָדకు సరైన అనువాదం.
