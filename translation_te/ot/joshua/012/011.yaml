  text: the king of Jarmuth[a], one; the king of Lachish, one.
translation:
  language: te
  text: యర్మూతు రాజు, ఒకడు; లాకీషు రాజు, ఒకడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: తరువాత వచ్చే పట్టణనామంతో సంబంధాన్ని తెలుగులో సహజంగా చూపే ‘యర్మూతు రాజు’ అనే నిర్మాణాన్ని వాడాం; జయించబడిన రాజుల జాబితాలోని సంక్షిప్త శైలిని ఇది నిలుపుతుంది.
- source_word: יַרְמוּת
  choice: యర్మూతు
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: ఇక్కడ ఇది రాజుల సంఖ్యను లెక్కించే పదం. వ్యక్తిని సూచిస్తున్నందున ‘ఒకడు’ సహజంగా ఉండి, హీబ్రూ సంక్షిప్త లెక్కింపు సూత్రాన్ని నిలుపుతుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: రెండవ పట్టణ-రాజ్య పాలకుని పరిచయం చేసే పునరుక్త నిర్మాణాన్ని మొదటి పదబంధంతో ఏకరీతిగా అనువదించాం.
- source_word: לָכִישׁ
  choice: లాకీషు
  rationale: హీబ్రూ స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జాబితాలో పునరావృతమయ్యే లెక్కింపు పదాన్ని మొదటి సందర్భంతో ఏకరీతిగా అనువదించాం.
