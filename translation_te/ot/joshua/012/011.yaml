translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగానూ గౌరవప్రదమైనదిగానూ ఉంచుతూ, హీబ్రూ మూలంలోని సంక్షిప్త జాబితా-లెక్కింపు రూపాన్ని విస్తరించకుండా నిలుపుకున్నాం.
