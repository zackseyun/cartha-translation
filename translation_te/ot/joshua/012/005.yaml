translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పొడవైన భౌగోళిక జాబితిని రెండు వాక్యాలుగా అమర్చి సంబంధాలను స్పష్టం చేశాం; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
