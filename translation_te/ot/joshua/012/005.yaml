- from: అతడు హెర్మోను పర్వతం, సల్కా, బాషాను ప్రాంతమంతటిని—గెషూరీయుల, మాయకాతీయుల సరిహద్దు వరకు—పాలించేవాడు[a]. గిలాదులో సగభాగం, హెష్బోను రాజైన సీహోను సరిహద్దు వరకు, అతని అధీనంలో ఉండేది.
  to: అతడు హెర్మోను పర్వతాన్ని, సల్కాను, బాషాను అంతటినీ గెషూరీయులకును మాకాతీయులకును సరిహద్దు వరకు, అలాగే గిలాదులో సగభాగాన్ని హెష్బోను రాజైన సీహోను సరిహద్దు వరకు పాలిస్తూ ఉన్నాడు[a].
  rationale: The revision preserves the Hebrew participle as a continuing description, keeps all territories under its scope in one coordinated sentence, and corrects the Maacathite ethnonym. The footnote remains anchored to the participial rendering and offers a finite-past alternative without asserting more than the Hebrew form warrants.
