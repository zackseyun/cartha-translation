source:
  edition: WLC
  text: וּ֠/מֹשֵׁל בְּ/הַ֨ר חֶרְמ֤וֹן וּ/בְ/סַלְכָה֙ וּ/בְ/כָל הַ/בָּשָׁ֔ן עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּעֲכָתִ֑י וַ/חֲצִי֙ הַ/גִּלְעָ֔ד גְּב֖וּל סִיח֥וֹן מֶֽלֶךְ חֶשְׁבּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: te
  text: అతడు హెర్మోను పర్వతాన్ని, సల్కాను, బాషాను అంతటినీ గెషూరీయులకును మాకాతీయులకును సరిహద్దు వరకు, అలాగే గిలాదులో సగభాగాన్ని హెష్బోను రాజైన సీహోను సరిహద్దు వరకు పాలిస్తూ ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు హెర్మోను పర్వతాన్ని, సల్కాను, బాషాను అంతటినీ పాలించాడు.” హీబ్రూలోని కృదంత రూపం మునుపటి వచనంలోని వర్ణనను కొనసాగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: అతడు ... పాలించేవాడు
  rationale: మునుపటి వచనంలోని ఓగు గురించిన వర్ణనను కొనసాగించే హీబ్రూ వర్తమాన కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిరంతర అధికారాన్ని సూచించేలా వ్యక్తం చేస్తుంది.
- source_word: בְּהַר חֶרְמוֹן
  choice: హెర్మోను పర్వతం
  rationale: משלతో వచ్చిన ב పరిపాలన పరిధిని సూచిస్తుంది; తెలుగులో ‘పాలించేవాడు’ అనే క్రియే ఆ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבְסַלְכָה
  choice: సల్కా
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: וּבְכָל הַבָּשָׁן
  choice: బాషాను ప్రాంతమంతటిని
  rationale: כָל సంపూర్ణ ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ చేర్చడం తెలుగులో భౌగోళిక భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: עַד גְּבוּל
  choice: సరిహద్దు వరకు
  rationale: ప్రాదేశిక విస్తృతి చేరే అంతిమ హద్దును నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הַגְּשׁוּרִי
  choice: గెషూరీయుల
  rationale: ఏకవచన జాతివాచక రూపం ఇక్కడ ఆ ప్రజల ప్రదేశాన్ని సూచిస్తుంది; తెలుగు బహువచన సంబంధరూపం సహజంగా ఉంటుంది.
- source_word: וְהַמַּעֲכָתִי
  choice: మాయకాతీయుల
  rationale: జాతివాచక పదాన్ని సంబంధిత ప్రజాసమూహపు సరిహద్దుగా సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: గిలాదులో సగభాగం
  rationale: ఓగు అధీనంలోని గిలాదు భూభాగపు సగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: హెష్బోను రాజైన సీహోను సరిహద్దు వరకు
  rationale: సరిహద్దు ఎవరిదో, సీహోను ఏ పట్టణానికి రాజో తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచుతుంది.
