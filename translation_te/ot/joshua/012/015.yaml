  source_fidelity: హీబ్రూ జాబితా-సూత్రం מֶלֶךְ ... אֶחָד ను ‘[స్థలం] రాజు, ఒకడు’గా సంక్షిప్తంగా, రెండుసార్లూ సమానంగా ప్రతిబింబించింది. ప్రతి నగరానికి చెందిన రాజును ఒక్కొక్కరిగా లెక్కించే భావం నిలిచింది.
  naturalness: ‘లిబ్నా రాజు, ఒకడు; అదుల్లాము రాజు, ఒకడు’ అనేది జయించిన రాజుల జాబితా సందర్భంలో ఆధునిక ప్రామాణిక తెలుగుకు సహజమైన సంక్షిప్త లెక్కింపు శైలి. కామాలు మూలంలోని విరామాత్మక గణనను సముచితంగా సూచిస్తున్నాయి.
  terminology: ‘రాజు’ మֶלֶךְకు సరైన సాధారణ సమానార్థకం. ‘లిబ్నా,’ ‘అదుల్లాము’ స్థలనామాల లిప్యంతరీకరణలు స్థిరంగా, తెలుగు బైబిలు వాడుకకు అనుకూలంగా ఉన్నాయి. ‘ఒకడు’ అֶחָד యొక్క వ్యక్తి-లెక్కింపు పాత్రను స్పష్టంగా ఉంచుతుంది.
