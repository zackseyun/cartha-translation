  text: the king of Libnah[a], one; the king of Adullam, one.
translation:
  language: te
  text: లిబ్నా రాజు, ఒకడు; అదుల్లాము రాజు, ఒకడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ప్రతి నగర-రాజ్య పాలకుణ్ణి సూచించే నిర్మాణ రూపం. తెలుగు జాబితా శైలిలో స్థలపేరు తరువాత ‘రాజు’ సహజంగా ఉంటుంది.
- source_word: לִבְנָה
  choice: లిబ్నా
  rationale: స్థలనామం కావడంతో అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జయించిన రాజులను లెక్కించే సూత్రప్రాయ పదం. వ్యక్తిని సూచిస్తున్నందున తెలుగులో ‘ఒకడు’ సహజంగా ఉండి, హీబ్రూ వచనంలోని సంక్షిప్త లెక్కింపు ధోరణిని నిలుపుతుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: రెండవ నమోదులోనూ అదే నిర్మాణ రూపం పునరావృతమైంది; మొదటి నమోదుతో ఏకరీతిగా అనువదించబడింది.
- source_word: עֲדֻלָּם
  choice: అదుల్లాము
  rationale: స్థలనామం కావడంతో అనువదించకుండా, హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జాబితా సూత్రంలో పునరావృతమైన సంఖ్యావాచకం; మూలంలోని లయను, లెక్కింపు నిర్మాణాన్ని కాపాడేందుకు అదే విధంగా అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని ఉపయోగించాం. హీబ్రూలోని ‘రాజు—ఒకడు’ అనే లెక్కింపు సూత్రాన్ని విస్తరించకుండా సహజంగా నిలిపాం.
