  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: te
  text: మక్కేదా రాజు, ఒకడు; బేతేలు రాజు, ఒకడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో జాబితా సంక్షిప్తంగా ఉంది: ‘మక్కేదా రాజు, ఒకడు; బేతేలు రాజు, ఒకడు.’ ఇక్కడ ‘ఒకడు’ అనేది ఓడించబడిన రాజులలో ఒక్కొక్కరిని లెక్కిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: ప్రతి నగర-రాజ్య పాలకుణ్ణి సూచించే నిర్మాణరూపం. తెలుగు జాబితా శైలిలో నగరనామం తరువాత ‘రాజు’ సహజంగా ఉంటుంది.
- source_word: מַקֵּדָה
  choice: మక్కేదా
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אֶחָד
  choice: ఒకడు
  rationale: జయించబడిన ప్రతి రాజును లెక్కించే సంఖ్యగా వాడబడింది. వ్యక్తిని సూచిస్తున్నందున తెలుగులో ‘ఒకడు’ సహజం; హీబ్రూ మూలంలోని సంక్షిప్త పునరుక్త జాబితా శైలిని నిలుపుతుంది.
- source_word: בֵּית אֵל
  choice: బేతేలు
  rationale: ఇక్కడ ‘దేవుని ఇల్లు’ అనే వ్యుత్పత్తి అర్థం కాకుండా స్థలనామమే ఉద్దేశించబడింది; అందువల్ల లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, మూలంలోని సంక్షిప్త పట్టిక శైలినీ పునరుక్తినీ కాపాడుతూ రూపొందించబడింది. స్థలనామాలు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇవ్వబడ్డాయి.
