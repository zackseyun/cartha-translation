source:
  edition: WLC
  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: te
  text: 'మనష్షే కుమారుడైన మాకీరు కుమారుడైన గిలాదు కుమారుడైన హెఫెరు కుమారుడైన సెలొపెహాదుకు కుమారులు లేరు; కుమార్తెలు మాత్రమే ఉన్నారు. అతని కుమార్తెల పేర్లు: మహలా, నోవా[a], హొగ్లా, మిల్కా, తిర్సా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ నోవా సెలొపెహాదు కుమార్తె; ఆదికాండంలో చెప్పబడిన పురుషుడైన నోవహు కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: సెలొపెహాదుకు
  rationale: లామెద్‌తో కూడిన ఈ రూపం సెలొపెహాదు పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో ‘సెలొపెహాదుకు కుమారులు లేరు’ అనే సహజ స్వాధీన నిర్మాణం మూలంలోని భావాన్ని స్పష్టంగా అందిస్తుంది; ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: కుమారుడైన ... కుమారుడు ... పుట్టిన ... కుమారుడైన
  rationale: మూలంలోని వంశావళి శ్రేణిని సంక్షిప్తంగా ‘వంశస్థుడు’ అని మార్చకుండా, ప్రతి తరాన్నీ కుమార సంబంధంగానే నిలిపి, తెలుగులో అర్థమయ్యే క్రమంలో అమర్చాం.
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: కుమారులు లేరు; కుమార్తెలు మాత్రమే ఉన్నారు
  rationale: కుమారులు–కుమార్తెలు అనే మూలంలోని లింగ నిర్దిష్ట వ్యత్యాసాన్ని, అలాగే כִּי אִם తెలిపే మినహాయింపు/ప్రత్యేకతను స్పష్టంగా నిలిపింది.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: అతని కుమార్తెల పేర్లు
  rationale: హీబ్రూ పేర్ల జాబితాను పరిచయం చేసే సూత్రప్రాయ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందించాం.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: మహలా, నోయా, హొగ్లా, మిల్కా, తిర్సా
  rationale: వ్యక్తి పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
