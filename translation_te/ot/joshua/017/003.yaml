  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనదిగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. వంశావళి సంబంధాలన్నిటినీ నిలిపి, తెలుగు వాక్య క్రమానికి అనుగుణంగా పూర్వీకుని నుంచి సెలొపెహాదు వరకు అమర్చాం.
