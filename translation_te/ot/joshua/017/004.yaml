  source_fidelity: 'మొత్తంగా హెబ్రీ మూలానికి నమ్మకంగా ఉంది: అధికారుల ఎదుట హాజరు కావడం, యెహోవా మోషేకు ఇచ్చిన ఆజ్ఞ, సహోదరుల మధ్య స్వాస్థ్యం, తండ్రి సహోదరుల మధ్య కేటాయింపు అన్నీ సరిగా ప్రతిఫలించాయి. అయితే రెండవ వాక్యారంభంలోని “కాబట్టి” మూలంలోని వరుస కథన క్రియ వַיִּתֵּן‌ను కారణ-ఫలిత సంబంధంగా మార్చుతుంది; దీనిని కాలక్రమ సూచకంగా సవరించాలి.'
