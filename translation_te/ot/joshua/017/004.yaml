  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: te
  text: 'వారు యాజకుడైన ఎలియాజరు ఎదుటికి, నూను కుమారుడైన యెహోషువ ఎదుటికి, నాయకుల ఎదుటికి వచ్చి ఇలా అన్నారు: “యెహోవా మా సహోదరుల మధ్య మాకు స్వాస్థ్యం ఇవ్వాలని మోషేకు ఆజ్ఞాపించాడు.” అప్పుడు అతడు యెహోవా ఆజ్ఞ ప్రకారం[a] వారి తండ్రి సహోదరుల మధ్య వారికి స్వాస్థ్యం ఇచ్చాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెహోవా నోటి ప్రకారం”; అంటే ఆయన ఆజ్ఞ ప్రకారం.
    reason: lexical_alternative
  - marker: b
    text: “వారి తండ్రి సహోదరుల మధ్య” అంటే వారి తండ్రి పక్షపు వంశానికి కేటాయించిన భూభాగంలో.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: వారు ... ఎదుటికి వచ్చి
  rationale: קרב అనే క్రియ యొక్క ‘దగ్గరకు వచ్చారు’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; స్త్రీలే కర్తలని సందర్భం స్పష్టం చేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుటికి / ఎదుట
  rationale: అధికారుల సమక్షంలో అధికారికంగా హాజరైన భావాన్ని నిలుపుతుంది; హెబ్రీలోని పునరుక్తిని కూడా ప్రధానంగా కాపాడుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: הַנְּשִׂיאִים
  choice: నాయకులు
  rationale: గోత్ర లేదా సమాజ అధికారులను సూచిస్తుంది; ‘రాజకుమారులు’ అనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో దైవనామాన్ని పేరుగానే నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: మాకు స్వాస్థ్యం ఇవ్వాలని
  rationale: నַחֲלָה ఇక్కడ వంశపారంపర్యంగా కేటాయించిన భూభాగాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ న్యాయపరమైన భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: మా సహోదరుల మధ్య
  rationale: మూలంలోని పురుష లింగ బంధుత్వ పదాన్ని, ఆస్తి కేటాయింపు సందర్భంలోని సామాజిక ప్రత్యేకతను నిలుపుతుంది.
- source_word: וַיִּתֵּן
  choice: అతడు ... ఇచ్చాడు
  rationale: హెబ్రీ ఏకవచన క్రియను అనుసరిస్తుంది; సమీప సందర్భంలో కార్యనిర్వాహకుడైన యెహోషువను సూచించే అవకాశాన్ని నిలుపుతుంది.
- source_word: אֶל־פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థమైన ‘యెహోవా నోటి ప్రకారం’ అనే హెబ్రీ నుడికారంలోని అధికారిక ఆజ్ఞ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲחֵי אֲבִיהֶן
  choice: వారి తండ్రి సహోదరుల మధ్య
  rationale: ‘తండ్రి సహోదరులు’ అనే నిర్దిష్ట పితృవంశ బంధుత్వాన్ని కాపాడుతుంది; సాధారణ ‘బంధువులు’గా విస్తరించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకుంది.
- issue: אַחֵינוּ లోని లింగసూచక బంధుత్వ భాష
  choice: మా సహోదరులు
  alternative: మా బంధువులు
  rationale: మూలంలోని పురుష బంధుత్వ సూచనను, సెలోఫెహాదు కుమార్తెల భూహక్కు వినతిలోని న్యాయపరమైన ప్రత్యేకతను నిలుపుతుంది.
- issue: אֲחֵי אֲבִיהֶן యొక్క పితృవంశ నిర్దిష్టత
  choice: వారి తండ్రి సహోదరులు
  alternative: వారి తండ్రి వంశస్థులు
  rationale: మూలపదబంధాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది; అదే సమయంలో ఇది విస్తృత పితృవంశ గోత్రాన్ని సూచించే సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: וַיִּתֵּן లో ఏకవచన కర్త
  choice: అతడు
  alternative: వారు
  rationale: హెబ్రీలో కర్త ఏకవచనంగా ఉన్నందున దాన్ని నిలుపుతుంది; యెహోషువనే ఉద్దేశించినట్లు సందర్భం సూచించినా, పేరును పాఠ్యంలో చేర్చి అస్పష్టతను పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. అధికారుల ఎదుట హాజరుకావడాన్ని తెలిపే హెబ్రీ పునరుక్తి, స్వాస్థ్యానికి సంబంధించిన న్యాయపరమైన భాష, పితృవంశ బంధుత్వ నిర్దిష్టత నిలుపబడ్డాయి. మూలంలో లేని పాదసూచికను ‘యాజకుడు’ వద్ద చేర్చలేదు; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
