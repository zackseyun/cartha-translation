id: JOS.17.1
reference: Joshua 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: te
  text: మనష్షే గోత్రానికి చీటి ద్వారా భాగం వచ్చింది, ఎందుకంటే అతడు యోసేపు మొదటి కుమారుడు. మనష్షే మొదటి కుమారుడూ గిలాదుకు తండ్రి[a] అయిన మాకీరు యుద్ధవీరుడు కాబట్టి, గిలాదూ బాషానూ అతనికి దక్కాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గిలాదు వంశానికి పూర్వికుడు’ లేదా ‘గిలాదు స్థాపకుడు.’ హీబ్రూలో ‘తండ్రి’ అనే మాట వెంటనే జన్మనిచ్చిన తండ్రినే కాకుండా పూర్వికుణ్ణి లేదా స్థాపకుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: చీటి ద్వారా భాగం వచ్చింది
  rationale: భూభాగాన్ని చీట్లు వేసి పంచిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘చీటి వచ్చింది’ అనడం కంటే వారసత్వ భాగం అనే భావం స్పష్టమవుతుంది.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: మనష్షే గోత్రానికి
  rationale: యెహోషువలో מַטֶּה ఇక్కడ చేతికర్రను కాక గోత్ర సమూహాన్ని సూచిస్తుంది.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: ఎందుకంటే అతడు యోసేపు మొదటి కుమారుడు
  rationale: సర్వనామం మనష్షేను సూచిస్తుంది; כִּי యొక్క కారణార్థాన్ని ‘ఎందుకంటే’ నిలుపుతుంది.
- source_word: לְמָכִיר
  choice: మాకీరు ... అతనికి
  rationale: לְ యొక్క పంపిణీ/కేటాయింపు భావాన్ని తెలుగులో వాక్యాంతంలోని ‘అతనికి దక్కాయి’తో సహజంగా వ్యక్తం చేసింది.
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: మనష్షే మొదటి కుమారుడు
  rationale: జనన క్రమాన్నీ, వారసత్వ ప్రాధాన్యాన్నీ నేరుగా నిలుపుతుంది.
- source_word: אֲבִי הַגִּלְעָד
  choice: గిలాదుకు తండ్రి
  rationale: హీబ్రూ కుటుంబసంబంధ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘పూర్వికుడు/స్థాపకుడు’ అనే విస్తృత సాధ్యతను పాదసూచికలో తెలిపింది.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరుడు
  rationale: యుద్ధంలో నైపుణ్యమున్న వ్యక్తి అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַיְהִי לוֹ
  choice: అతనికి దక్కాయి
  rationale: ఈ వారసత్వ కేటాయింపు సందర్భంలో స్వాధీనమయ్యాయి/భాగంగా వచ్చాయి అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: గిలాదు, బాషాను
  rationale: స్థిరపడిన స్థలనామాలను అనువదించకుండా తెలుగు లిప్యంతరీకరణలో ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని కారణ సంబంధాన్ని నిలిపి, తెలుగులో సహజంగా ఉండేందుకు మాకీరు సంబంధిత దీర్ఘ భాగాన్ని ఒక సమగ్ర వాక్యంగా అమర్చాం. మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున అలాంటి పదాన్ని చేర్చలేదు.
