  edition: WLC
  text: נֶ֣גְבָּ/ה לְ/אֶפְרַ֗יִם וְ/צָפ֨וֹנָ/ה֙ לִ/מְנַשֶּׁ֔ה וַ/יְהִ֥י הַ/יָּ֖ם גְּבוּל֑/וֹ וּ/בְ/אָשֵׁר֙ יִפְגְּע֣וּ/ן מִ/צָּפ֔וֹן וּ/בְ/יִשָּׂשכָ֖ר מִ/מִּזְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: te
  text: దక్షిణం వైపు అది ఎఫ్రాయిముకు, ఉత్తరం వైపు మనష్షేకు చెందింది; సముద్రం దాని సరిహద్దుగా ఉంది. ఉత్తరాన వారు ఆషేరు భూభాగాన్ని చేరుకున్నారు[a], తూర్పున ఇశ్శాఖారు భూభాగాన్ని చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉత్తరాన వారు ఆషేరు భూభాగాన్ని తాకారు” లేదా “ఆషేరు భూభాగంతో సరిహద్దుగా ఉన్నారు.” భూసరిహద్దుల వర్ణనలో హీబ్రూ క్రియకు “చేరడం,” “కలవడం,” “తాకడం,” లేదా “సరిహద్దుగా ఉండడం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: దక్షిణం వైపు అది ఎఫ్రాయిముకు
  rationale: దిశను సూచించే נֶגְבָּהను సహజమైన తెలుగు దిశాప్రయోగంతో అనువదించి, సందర్భంలోని భూభాగ కేటాయింపు భావాన్ని తెలియజేయడానికి హీబ్రూలో అంతర్లీనంగా ఉన్న ‘అది’ అనే భావాన్ని చేర్చాం.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: ఉత్తరం వైపు మనష్షేకు చెందింది
  rationale: ముందటి అర్ధవాక్యానికి సమాంతరంగా దిశను, గోత్రానికి చెందిన భూభాగాన్ని స్పష్టంగా తెలిపేలా క్రియను పూర్తిచేశాం.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: సముద్రం దాని సరిహద్దుగా ఉంది
  rationale: הַיָּםను సందర్భానుసారంగా ‘సముద్రం’గానే ఉంచి, גְּבוּל యొక్క భూసరిహద్దు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: వారు ఆషేరు భూభాగాన్ని చేరుకున్నారు
  rationale: సరిహద్దు వర్ణనల్లో פגעకు ‘చేరుట/తాకుట/సరిహద్దుగా ఉండుట’ అనే భావపరిధి ఉంది. ప్రధాన పాఠ్యంలో చదవడానికి సహజమైన ‘చేరుకున్నారు’ను ఎంచుకుని, ‘భూభాగం’ను స్పష్టత కోసం చేర్చాం.
- source_word: מִצָּפוֹן
  choice: ఉత్తరాన
  rationale: ఇక్కడ מִן దిశనుంచి కంటే ఆనుకుని ఉన్న వైపును సూచిస్తుంది; ‘ఉత్తరాన’ తెలుగు భౌగోళిక వర్ణనలో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: తూర్పున ఇశ్శాఖారు భూభాగాన్ని చేరుకున్నారు
  rationale: ముందటి క్రియను ఈ సమాంతర అర్ధవాక్యంలో పునరుద్ధరించి, מִמִּזְרָחను ఆనుకుని ఉన్న తూర్పు వైపుగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దుల జాబితా శైలిని సంక్షిప్తంగా ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనం. ఆషేరు, ఇశ్శాఖారు వంటి పేర్ల దగ్గర ‘భూభాగం’ను చేర్చి ప్రాదేశిక సంబంధాన్ని స్పష్టం చేశాం; פגעలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదటిప్పణిలో నిలిపాం.
