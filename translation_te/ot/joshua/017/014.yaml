id: JOS.17.14
reference: Joshua 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְדַבְּרוּ֙ בְּנֵ֣י יוֹסֵ֔ף אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר מַדּוּעַ֩ נָתַ֨תָּה לִּ֜/י נַחֲלָ֗ה גּוֹרָ֤ל אֶחָד֙ וְ/חֶ֣בֶל אֶחָ֔ד וַֽ/אֲנִ֣י עַם רָ֔ב עַ֥ד אֲשֶׁר עַד כֹּ֖ה בֵּֽרְכַ֥/נִי יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: te
  text: 'అప్పుడు యోసేపు వంశస్థులు యెహోషువతో ఇలా అన్నారు: “నేను సంఖ్యలో గొప్ప ప్రజను; యెహోవా ఇప్పటివరకు నన్ను ఆశీర్వదించాడు. అలాంటప్పుడు నీవు నాకు స్వాస్థ్యంగా చీటి ద్వారా వచ్చిన ఒకే వాటాను, ఒకే భూభాగాన్ని[a] ఎందుకు ఇచ్చావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకే కొలిచిన వాటాను.” హీబ్రూ పదం కొలిచి కేటాయించిన భూభాగాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: ఇక్కడ మనుష్యులుగా యోసేపు కుమారులను కాక, వారి నుండి వచ్చిన ఎఫ్రాయిము–మనష్షే గోత్ర సమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగాను స్పష్టంగాను ఉంటుంది.
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: నీవు నాకు స్వాస్థ్యంగా ... ఇచ్చావు
  rationale: నחלה ఇక్కడ గోత్రానికి కేటాయించబడిన వారసత్వ భూమిని సూచిస్తుంది. సమూహం తనను ఏకవచనంలో ‘నాకు/నేను’ అని పేర్కొనే హీబ్రూ రూపాన్ని నిలిపింది.
- source_word: גּוֹרָל אֶחָד
  choice: ఒకే చీటి భాగం
  rationale: גורל భూమి పంచడానికి వేసిన చీటినీ, దాని ద్వారా లభించిన కేటాయింపునూ సూచిస్తుంది; ‘చీటి భాగం’ ఈ సందర్భంలోని రెండు భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְחֶבֶל אֶחָד
  choice: ఒకే భూభాగం
  rationale: חבל కొలిచి కేటాయించిన భూభాగం లేదా వాటాను సూచించగలదు. ‘భూభాగం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, גורל తోనున్న సమాంతరతను కాపాడుతుంది.
- source_word: וַאֲנִי עַם רָב
  choice: నేను జనసంఖ్యలో పెద్ద ప్రజను
  rationale: רב ఇక్కడ హోదా లేదా గొప్పతనం కంటే సంఖ్యాబలాన్ని సూచిస్తుంది. సమూహవాచక ఏకవచనమైన ‘నేను’ను ఉద్దేశపూర్వకంగా నిలిపింది.
- source_word: עַד אֲשֶׁר עַד כֹּה
  choice: అందువల్ల ... ఇప్పటివరకు
  rationale: సంక్షిప్తమైన హీబ్రూ ప్రయోగం కారణ భావాన్నీ, ప్రస్తుతకాలం వరకూ జరిగిన ఆశీర్వాదాన్నీ వ్యక్తం చేస్తుంది. తెలుగులో వాక్య సంబంధం సహజంగా ఉండేందుకు కారణ ఉపవాక్యంగా అమర్చింది.
- source_word: בֵּרְכַנִי
  choice: నన్ను ఆశీర్వదిస్తూ వచ్చినందువల్ల
  rationale: దైవ ఆశీర్వాదం ఇప్పటివరకు కొనసాగిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు. ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: గోత్ర సమూహపు ఏకవచన స్వీయప్రస్తావన
  choice: నాకు / నేను / నన్ను
  alternative: మాకు / మేము / మమ్మల్ని
  rationale: హీబ్రూలో యోసేపు వంశస్థులు బహువచన కర్తగా మాట్లాడినా, తమ సమూహాన్ని ఒక ఏకకంగా ఏకవచనంలో పేర్కొంటారు. ఈ ఉద్రిక్తతను సరిచేసి బహువచనం చేయకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో గోత్ర సమూహం వాడిన అసాధారణ ఏకవచనాన్ని మూలానికి అనుగుణంగా నిలిపింది. ‘అలాంటప్పుడు’ అనే అనుసంధానం ఫిర్యాదులోని కారణ–వ్యతిరేక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
