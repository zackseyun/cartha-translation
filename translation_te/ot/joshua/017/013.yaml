  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: te
  text: 'అప్పుడు ఇలా జరిగింది: ఇశ్రాయేలు కుమారులు[a] బలపడినప్పుడు, వారు కనానీయులతో నిర్బంధ శ్రమ చేయించారు[b]; అయితే వారిని పూర్తిగా[c] వెళ్లగొట్టలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “బలవంతపు సేవకు లోబరచారు”; ఈ పదానికి “కప్పం” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూలో క్రియానామక సంపూర్ణరూపం మరియు పరిమిత క్రియ కలయిక చర్యను బలపరుస్తుంది: “పూర్తిగా” లేదా “బొత్తిగా వెళ్లగొట్టలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: బలపడినప్పుడు
  rationale: ఈ హీబ్రూ నిర్మాణం కథనంలో కొత్త పరిణామాన్ని, దానికి సంబంధించిన కాలపరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చకుండా ‘…బడినప్పుడు’ అనే నిర్మాణం అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: חָזְקוּ
  choice: బలపడినప్పుడు
  rationale: חזק ఇక్కడ స్థితిలోకి ప్రవేశించే భావంతో, ఇశ్రాయేలీయులు శక్తిమంతులవడాన్ని సూచిస్తుంది. ‘బలపడినప్పుడు’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని కుటుంబసంబంధ రూపాన్ని స్పష్టంగా నిలుపుతూ, ఇది ఇశ్రాయేలు ప్రజలకు వాడే సాంప్రదాయ జాతీయ నామమని పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: వారు కనానీయులను నిర్బంధ శ్రమకు పెట్టారు
  rationale: מַס ఇక్కడ కేవలం పన్నుకన్నా బలవంతంగా చేయించే సేవ లేదా శ్రమను సూచించే అవకాశం ఎక్కువ. ‘నిర్బంధ శ్రమ’ ఆ బలవంతపు సామాజిక వాస్తవాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. ఏకవచన సమూహవాచకమైన ‘కనానీయుడు’ తెలుగులో సహజంగా బహువచనంగా ఇవ్వబడింది.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: అయితే వారిని పూర్తిగా వెళ్లగొట్టలేదు
  rationale: క్రియానామక సంపూర్ణరూపం, పరిమిత క్రియ కలయిక చర్యను బలపరుస్తుంది; అందువల్ల ‘పూర్తిగా’ అని అనువదించబడింది. ఏకవచన ప్రత్యయం సమూహమైన కనానీయులను సూచిస్తున్నందున తెలుగులో ‘వారిని’ అని ఇచ్చాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగమైన కుటుంబసంబంధ పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అదే సమయంలో ఇది మొత్తం జాతిని సూచించే సాధారణ నామమనే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: מַס యొక్క భావం
  choice: నిర్బంధ శ్రమ
  alternative: కప్పం లేదా బలవంతపు సేవ
  rationale: ఈ సందర్భం మిగిలిన కనానీయులను లోబరచుకోవడం గురించి చెబుతుంది. ‘నిర్బంధ శ్రమ’ దాని బలవంతపు స్వభావాన్ని తగ్గించకుండా తెలియజేస్తుంది; అయితే ‘కప్పం’ అనే అర్థసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
- issue: הוֹרֵשׁ לֹא הוֹרִישׁוֹ లోని బలప్రయోగం
  choice: పూర్తిగా వెళ్లగొట్టలేదు
  alternative: ఎంతమాత్రమూ వెళ్లగొట్టలేదు లేదా స్వాధీనభ్రష్టులను చేయలేదు
  rationale: హీబ్రూ క్రియానామక సంపూర్ణరూపం క్రియను బలపరుస్తుంది. సందర్భంలో అది అసంపూర్ణ బహిష్కరణను సూచిస్తున్నందున ‘పూర్తిగా’ అని ఇచ్చాం; దానిని సంపూర్ణ నిరాకరణగా మాత్రమే కట్టిపడేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నిర్బంధ శ్రమ’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు מַס లోని బలవంతపు స్వభావాన్ని నిలుపుతుంది. మూలంలోని కుటుంబసంబంధ జాతీయ నామం ప్రధాన పాఠ్యంలో ఉంచి, మరింత సహజమైన జాతీయ నామాన్ని పాదటిప్పణిలో ఇచ్చాం.
