  source_fidelity: 'ప్రధాన భావం హీబ్రూ మూలానికి నమ్మకంగా ఉంది: ఇశ్రాయేలు బలపడడం, కనానీయులను మַס‌కు లోబరచడం, వారిని పూర్తిగా వెళ్లగొట్టకపోవడం అన్నీ సరియే ఉన్నాయి. అయితే וַיְהִי כִּי యొక్క కథనారంభ సూచనను ప్రధాన పాఠ్యంలో స్పష్టంగా ఇవ్వడం మంచిది. అలాగే מַס‌కు ‘నిర్బంధ శ్రమకు పెట్టారు’ కంటే ‘నిర్బంధ శ్రమ చేయించారు’ మరింత స్పష్టమైన, సహజమైన ప్రయోగం.'
  naturalness: ‘ఇశ్రాయేలు కుమారులు’ అనేది హీబ్రూ జాతీయ నామాన్ని పారదర్శకంగా నిలుపుతుంది; పాదటిప్పణి ద్వారా దాని సహజ ప్రత్యామ్నాయం ఇవ్వబడింది. ‘వారితో నిర్బంధ శ్రమ చేయించారు’ ఆధునిక ప్రామాణిక తెలుగులో మరింత స్పష్టంగా ఉంటుంది. ‘అప్పుడు ఇలా జరిగింది’ కథన ప్రవాహాన్ని సహజంగా ప్రతిబింబిస్తుంది.
