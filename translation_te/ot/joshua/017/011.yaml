source:
  edition: WLC
  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: te
  text: 'ఇశ్శాఖారు, ఆషేరు ప్రాంతాల్లో మనష్షేకు ఇవి ఉన్నాయి: బేత్-షెయాను మరియు దానికి చెందిన అనుబంధ గ్రామాలు[a], ఇబ్లెయాము మరియు దానికి చెందిన అనుబంధ గ్రామాలు, దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, ఏన్-దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, తానాకు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, మెగిద్దో నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు—మూడు ప్రాంతాలు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ఇది ఒక ప్రధాన పట్టణంపై ఆధారపడిన గ్రామాలు లేదా నివాసస్థలాలను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: ‘మూడు జిల్లాలు’ లేదా ‘మూడు ఎత్తైన ప్రాంతాలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం క్లిష్టమైనది; అది భౌగోళిక లేదా పరిపాలనా విభజనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: మనష్షేకు ... ఉన్నాయి
  rationale: ויהי ל అనే స్వామ్య/కేటాయింపు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఈ స్థలాలు మనష్షే వంతులో ఉన్నాయని సూచిస్తుంది.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: ఇశ్శాఖారు, ఆషేరు ప్రాంతాల్లో
  rationale: ב ఉపసర్గ సూచించే భౌగోళిక స్థానాన్ని స్పష్టం చేయడానికి ‘ప్రాంతాల్లో’ చేర్చబడింది.
- source_word: בֵּית שְׁאָן
  choice: బేత్-షెయాను
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בְנוֹתֶיהָ
  choice: దాని అనుబంధ గ్రామాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణంపై ఆధారపడిన గ్రామాలు లేదా నివాసస్థలాలను సూచించే హీబ్రూ నుడికారాన్ని సహజంగా తెలుపుతుంది.
- source_word: יִבְלְעָם
  choice: ఇబ్లెయాము
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אֶת יֹשְׁבֵי דֹאר
  choice: దోరు నివాసులు
  rationale: יֹשְׁבֵי అనే కృదంత రూపంలోని ‘నివసించేవారు/నివాసులు’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עֵין דֹּר
  choice: ఏన్-దోరు
  rationale: సంయుక్త హీబ్రూ స్థలనామాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: תַעְנַךְ
  choice: తానాకు
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: מְגִדּוֹ
  choice: మెగిద్దో
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: ఈ మూడు ప్రాంతాలు
  rationale: నפת ఇక్కడ భౌగోళిక లేదా పరిపాలనా విభాగాన్ని సూచించవచ్చు. ఖచ్చితమైన భావం వివాదాస్పదమైనందున సాధారణమైన ‘ప్రాంతాలు’ ఎంచుకుని ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
