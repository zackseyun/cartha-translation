translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. స్థలనామాలు మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; జాబితా నిర్మాణం మరియు చివరి పదబంధంలోని సందిగ్ధత నిలుపబడ్డాయి.
