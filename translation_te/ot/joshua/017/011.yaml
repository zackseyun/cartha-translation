- from: ఇశ్శాఖారు, ఆషేరు ప్రాంతాల్లో మనష్షేకు బేత్-షెయాను, దాని అనుబంధ గ్రామాలు[a], ఇబ్లెయాము, దాని అనుబంధ గ్రామాలు, దోరు నివాసులు, దాని అనుబంధ గ్రామాలు, ఏన్-దోరు నివాసులు, దాని అనుబంధ గ్రామాలు, తానాకు నివాసులు, దాని అనుబంధ గ్రామాలు, మెగిద్దో నివాసులు, దాని అనుబంధ గ్రామాలు ఉన్నాయి—ఈ మూడు ప్రాంతాలు[b].
  to: 'ఇశ్శాఖారు, ఆషేరు ప్రాంతాల్లో మనష్షేకు ఇవి ఉన్నాయి: బేత్-షెయాను మరియు దానికి చెందిన అనుబంధ గ్రామాలు[a], ఇబ్లెయాము మరియు దానికి చెందిన అనుబంధ గ్రామాలు, దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, ఏన్-దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, తానాకు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, మెగిద్దో నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు—మూడు ప్రాంతాలు[b].'
  rationale: సవరణలు అర్థాన్ని మార్చకుండా తెలుగు సర్వనామ-సూచనను స్పష్టం చేశాయి. మూలంలోని స్థలాల/నివాసుల జాబితా, అనుబంధ గ్రామాల పునరుక్తి, మరియు చివరి పదబంధంలోని భౌగోళిక లేదా పరిపాలనా సందిగ్ధత అన్నీ భద్రపరచబడ్డాయి.
