  revised_text: 'ఇశ్శాఖారు, ఆషేరు ప్రాంతాల్లో మనష్షేకు ఇవి ఉన్నాయి: బేత్-షెయాను మరియు దానికి చెందిన అనుబంధ గ్రామాలు[a], ఇబ్లెయాము మరియు దానికి చెందిన అనుబంధ గ్రామాలు, దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, ఏన్-దోరు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, తానాకు నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు, మెగిద్దో నివాసులు మరియు దానికి చెందిన అనుబంధ గ్రామాలు—మూడు ప్రాంతాలు[b].'
