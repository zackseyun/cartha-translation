source:
  edition: WLC
  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: te
  text: అయితే మనష్షే వంశస్థులు ఈ పట్టణాలను స్వాధీనం చేసుకోలేకపోయారు; కనానీయులు ఈ దేశంలో నివసించాలనే నిశ్చయంతో ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనానీయుడు ఈ దేశంలో నివసించాలని నిశ్చయించుకున్నాడు.” హీబ్రూ మూలంలో సమూహార్థక ఏకవచన నామవాచకం ఉంది; క్రియ సుముఖతను లేదా దృఢనిశ్చయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: లేకపోయారు
  rationale: సామర్థ్యం లేకపోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: మనష్షే వంశస్థులు
  rationale: అక్షరార్థమైన ‘మనష్షే కుమారులు’ కంటే గోత్రసమూహాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: לְהוֹרִישׁ
  choice: నివాసులను వెళ్లగొట్ట
  rationale: ఈ సందర్భంలో హిఫిల్ రూపం ముందున్న నివాసులను వారి పట్టణాల నుంచి తొలగించడం/స్వాధీనం కోల్పోయేలా చేయడం అనే భావం ఇస్తుంది; ‘వెళ్లగొట్టు’ సాధారణ పాఠకులకు సహజం.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాల
  rationale: పట్టణాలనే నేరుగా వెళ్లగొట్టడం తెలుగులో అసహజం కాబట్టి, సందర్భార్థమైన పట్టణ నివాసులను వాక్యంలో స్పష్టం చేశాం.
- source_word: וַיּוֹאֶל
  choice: పట్టుబట్టారు
  rationale: సుముఖత, సంకల్పం, దృఢంగా కొనసాగడం వంటి అర్థవిస్తృతిలో ఈ సందర్భానికి తగిన దృఢనిశ్చయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: హీబ్రూలో ఏకవచన రూపం సమూహార్థకంగా ఉంది; తెలుగులో బహువచనం జాతిసమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: לָשֶׁבֶת
  choice: నివసించాలని
  rationale: ఆ దేశంలో స్థిరంగా ఉండి నివసించాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: ఈ దేశంలోనే
  rationale: చర్చలో ఉన్న భూభాగాన్ని ‘దేశం’ సూచిస్తుంది; ‘నే’ కనానీయుల అక్కడే కొనసాగాలన్న పట్టుదలను తెలుగులో ప్రతిఫలిస్తుంది.
