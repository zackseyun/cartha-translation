translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ సమూహార్థక ఏకవచనాన్ని ప్రధాన పాఠ్యంలో సహజమైన బహువచనంగా ఇచ్చి, దాని రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
