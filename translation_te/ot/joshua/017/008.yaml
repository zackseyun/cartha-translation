source:
  edition: WLC
  text: לִ/מְנַשֶּׁ֕ה הָיְתָ֖ה אֶ֣רֶץ תַּפּ֑וּחַ וְ/תַפּ֛וּחַ אֶל גְּב֥וּל מְנַשֶּׁ֖ה לִ/בְנֵ֥י אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: te
  text: తప్పూయ ప్రాంతం మనష్షేకు చెందింది[a]. అయితే మనష్షే సరిహద్దున ఉన్న తప్పూయ ఎఫ్రాయిము కుమారులకు చెందింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మనష్షేకు తప్పూయ ప్రాంతం ఉండేది; అయితే మనష్షే సరిహద్దున ఉన్న తప్పూయ ఎఫ్రాయిము కుమారులకు చెందింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: మనష్షేకు చెందింది
  rationale: ల ఉపసర్గతో కూడిన היה ఇక్కడ భూభాగపు స్వాధీనత లేదా కేటాయింపును సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘చెందింది’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: తప్పూయ ప్రాంతం
  rationale: אֶרֶץ ఇక్కడ మొత్తం దేశాన్ని కాక, తప్పూయకు సంబంధించిన భూభాగాన్ని సూచిస్తుంది. తరువాతి תַּפּוּחַ పట్టణాన్ని సూచించే అవకాశమున్నందున, ‘ప్రాంతం’ అనే పదం వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: תַּפּוּחַ
  choice: తప్పూయ
  rationale: ఇది స్థలనామం; దాని హెబ్రీ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְתַפּוּחַ
  choice: అయితే ... తప్పూయ పట్టణం
  rationale: וְ సాధారణంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ మనష్షేకు చెందిన ప్రాంతానికీ ఎఫ్రాయిముకు చెందిన తప్పూయకూ మధ్య వ్యత్యాసాన్ని సూచిస్తుంది. మూలంలో ‘పట్టణం’ ప్రత్యక్షంగా లేకపోయినా, అదే పేరుగల ప్రాంతం నుంచి స్థలాన్ని వేరు చేయడానికి సందర్భం దానిని సూచిస్తుంది.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: మనష్షే సరిహద్దులో ఉన్న
  rationale: సరిహద్దు వర్ణనలో אֶל స్థానసంబంధమైన ‘వద్ద/మీద’ భావాన్ని ఇస్తుంది; తెలుగులో ‘సరిహద్దులో ఉన్న’ సహజంగా ఉంటుంది.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: ఎఫ్రాయిము కుమారులకు చెందింది
  rationale: ల ఉపసర్గ స్వాధీనతను సూచిస్తుంది; בְנֵי అనే బంధుత్వ పదాన్ని ‘కుమారులు’గా ఉంచడం మూలంలోని గోత్ర సంబంధ వ్యక్తీకరణను కాపాడుతుంది.
