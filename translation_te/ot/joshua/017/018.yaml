source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: te
  text: కొండప్రాంతం నీదవుతుంది[a]; అది అడవి కాబట్టి నీవు దానిని నరికివేస్తావు, దాని చివరి సరిహద్దులు కూడా నీకే చెందుతాయి[b]. కనానీయులకు ఇనుప రథాలు ఉన్నా, వారు బలవంతులైనా, నీవు వారిని వెళ్లగొడతావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పర్వతం నీదవుతుంది.’ హీబ్రూ הַר అనే పదం ‘పర్వతం’ లేదా ‘కొండప్రాంతం’ అని అర్థమివ్వగలదు; ఇక్కడ అది యోసేపు వంశానికి కేటాయించిన ఎత్తైన ప్రాంతాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని వెలుపలి అంచులు’; అంటే అడవితో నిండిన కొండప్రాంతపు చివరి హద్దులు లేదా సరిహద్దులు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘కనానీయుడు … అతనికి … అతడు బలవంతుడు’ అని ఏకవచన రూపాలు ఉన్నాయి; అవి కనానీయుల ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: కొండప్రాంతం
  rationale: భూభాగం పంచిపెట్టే ఈ సందర్భంలో ఈ పదం ఒకే కొండను కాకుండా ఎత్తైన కొండల ప్రాంతాన్ని సూచిస్తుంది.
- source_word: יִהְיֶה לָּךְ
  choice: నీదవుతుంది
  rationale: היה + ל అనే హీబ్రూ ప్రయోగం స్వాధీనాన్ని లేదా కేటాయింపును తెలియజేస్తుంది; తెలుగులో ఇది సహజమైన స్వామ్యవ్యక్తీకరణ.
- source_word: כִּי
  choice: మాత్రం / ఎందుకంటే / ఉన్నా … అయినా
  rationale: ఈ వచనంలో పదేపదే వచ్చే כִּי సందర్భానుసారం భిన్నమైన సంబంధాలను చూపుతుంది. మొదటిది ముందున్న మాటకు వ్యతిరేక బలాన్ని, తరువాతది కారణాన్ని, చివరివి ప్రతికూల పరిస్థితిని అధిగమించే భావాన్ని తెలియజేస్తాయి.
- source_word: יַעַר
  choice: అడవి
  rationale: చెట్లతో నిండిన భూభాగాన్ని సూచించే సూటి, సాధారణ తెలుగు పదం.
- source_word: וּבֵרֵאתוֹ
  choice: దాన్ని నరికి చదును చేస్తావు
  rationale: పీయేల్ రూపంలోని ברא ఇక్కడ అడవిని తొలగించి నివాసానికి లేదా సాగుకు అనువుగా చేయడాన్ని సూచిస్తుంది; కేవలం ‘సృష్టించు’ అనే సాధారణ అర్థం ఇక్కడ తగదు.
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: దాని చివరి అంచులవరకు అంతా నీదవుతుంది
  rationale: תֹּצְאוֹת ఈ భూభాగపు వెలుపలి అంచులు లేదా సరిహద్దులను సూచిస్తుంది; మొత్తం విస్తీర్ణం స్వాధీనమవుతుందనే భావాన్ని ఈ అనువాదం స్పష్టం చేస్తుంది.
- source_word: תוֹרִישׁ
  choice: అక్కడి నుంచి వెళ్లగొడతావు
  rationale: ירש హిఫీల్ రూపం ఆ ప్రజలను వారి అధీన భూమి నుంచి తొలగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వెళ్లగొడతావు’ సైనిక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులు
  rationale: మూలంలో ఏకవచన జాతినామం ఉన్నప్పటికీ అది సమూహార్థకంగా వాడబడింది; తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: רֶכֶב בַּרְזֶל
  choice: ఇనుప రథాలు
  rationale: ఇనుముతో బలపరచబడిన యుద్ధరథాలను సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: חָזָק הוּא
  choice: వారు బలవంతులు
  rationale: మూలంలోని ఏకవచనం కనానీయుల ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; తెలుగు బహువచనం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: కనానీయులను సూచించే సమూహార్థక ఏకవచనం
  choice: ‘కనానీయులు … వారికి … వారు’ అని బహువచన సమూహంగా అనువదించడం
  alternative: ‘కనానీయుడు … అతనికి … అతడు’ అని రూపపరంగా ఏకవచనాన్ని నిలుపుకోవడం
  rationale: హీబ్రూలో జాతినామం ఏకవచనంలో ఉండి మొత్తం ప్రజాసమూహాన్ని సూచించగలదు. ఆధునిక తెలుగులో బహువచనం ఉద్దేశిత అర్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- issue: కనానీయుల బలం మధ్య విజయ వాగ్దానం
  choice: ఇనుప రథాలు, బలం ఉన్నప్పటికీ వారిని వెళ్లగొడతావనే ఉద్విగ్నతను యథాతథంగా ఉంచడం
  alternative: దైవ సహాయం కారణంగా విజయం సులభమని వివరణను పాఠ్యంలో చేర్చడం
  rationale: మూలపాఠ్యం ప్రత్యర్థుల నిజమైన బలాన్నీ, వారిని తొలగిస్తారనే ప్రకటననూ పక్కపక్కనే ఉంచుతుంది; కారణాన్ని అదనంగా వివరించకుండా ఆ ఉద్విగ్నతను సంరక్షించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘నరికి చదును చేయడం’ అడవిని నివాసం లేదా సాగుకు అనువుగా మార్చే చర్యను సహజంగా వ్యక్తపరుస్తుంది. మూలంలోని పునరుక్త כִּי పదాన్ని యాంత్రికంగా ఒకే తెలుగు పదంతో అనువదించకుండా, ప్రతి సందర్భంలోని విరోధ, కారణ, అనుమతి భావాలను వాక్యనిర్మాణం ద్వారా తెలిపాం.
