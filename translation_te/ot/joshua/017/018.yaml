revisions:
- from: కొండప్రాంతం మాత్రం నీదవుతుంది[a]. ఎందుకంటే, అది అడవి; నువ్వు దాన్ని నరికి చదును చేస్తావు. దాని చివరి అంచులవరకు అంతా నీదవుతుంది[b]. కనానీయులకు ఇనుప రథాలు ఉన్నా, వారు బలవంతులైనా, నువ్వు వారిని అక్కడి నుంచి వెళ్లగొడతావు[c].
  to: కొండప్రాంతం నీదవుతుంది[a]; అది అడవి కాబట్టి నీవు దానిని నరికివేస్తావు, దాని చివరి సరిహద్దులు కూడా నీకే చెందుతాయి[b]. కనానీయులకు ఇనుప రథాలు ఉన్నా, వారు బలవంతులైనా, నీవు వారిని వెళ్లగొడతావు[c].
