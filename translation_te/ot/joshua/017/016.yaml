translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైనప్పటికీ సహజమైన శైలి వాడబడింది. భౌగోళిక వ్యత్యాసం కోసం ‘కొండప్రాంతం/లోయప్రాంతం’ జతను నిలిపాం. స్థలనామాలను తెలుగు బైబిలు పఠనానికి అనువైన లిప్యంతరీకరణలో ఇచ్చాం.
