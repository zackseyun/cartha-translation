id: JOS.17.16
reference: Joshua 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: te
  text: 'యోసేపు వంశస్థులు ఇలా అన్నారు: “కొండప్రాంతం మాకు సరిపోదు[a]. లోయప్రాంతంలో నివసించే కనానీయులందరికీ ఇనుప రథాలు[b] ఉన్నాయి—బేత్‌షెయానులో, దాని అనుబంధ పట్టణాల్లో[c] ఉన్నవారికీ, యిజ్రెయేలు లోయలో ఉన్నవారికీ ఉన్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కొండప్రాంతం మాకు దొరకదు.” సందర్భంలో అది తమకు సరిపోదని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఇనుముతో అమర్చిన రథాలు.” హీబ్రూలో అక్షరార్థంగా “ఇనుప రథాలు.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “దాని కుమార్తెలు”; ఇది ప్రధాన నగరానికి చెందిన లేదా దానిపై ఆధారపడిన చుట్టుపక్కల పట్టణాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: అక్షరార్థంగా ‘యోసేపు కుమారులు’; సందర్భంలో ఎఫ్రాయిము, మనష్షే గోత్రాలకు చెందిన వారిని సూచిస్తున్నందున సహజమైన సామూహిక రూపం ఎంచుకోబడింది.
- source_word: לֹא יִמָּצֵא לָנוּ הָהָר
  choice: కొండప్రాంతం మాకు సరిపోదు
  rationale: అక్షరార్థ రూపం ‘కొండప్రాంతం మాకు దొరకదు/కనబడదు.’ అయితే భూభాగం చాలదనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మూలంలోని అసాధారణ ప్రయోగాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: רֶכֶב בַּרְזֶל
  choice: ఇనుప రథాలు
  rationale: హీబ్రూ సమాసాన్ని దగ్గరగా అనుసరించే సహజ తెలుగు రూపం. రథాలు పూర్తిగా ఇనుముతో చేసినవని కాక, ఇనుప అమరికలున్న యుద్ధరథాలని భావించవచ్చు; మూలం మాత్రం వివరించదు.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: నివసించే కనానీయులందరికీ
  rationale: ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా ఉంది; తెలుగులో బహువచనం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֶרֶץ הָעֵמֶק
  choice: లోయప్రాంతం
  rationale: కొండప్రాంతానికి భౌగోళిక విరుద్ధంగా ఉన్న దిగువ నేలను సూచిస్తుంది; ‘లోయప్రాంతం’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וּבְנוֹתֶיהָ
  choice: దాని అనుబంధ పట్టణాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన నగరంపై ఆధారపడిన చుట్టుపక్కల చిన్న పట్టణాలు లేదా నివాసాలను సూచించే హీబ్రూ నుడికారాన్ని స్పష్టంగా అనువదించాం.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: యిజ్రెయేలు లోయ
  rationale: హీబ్రూ స్థలనామాన్ని, భౌగోళిక పదాన్ని నేరుగా మరియు సహజంగా అందించే రూపం.
