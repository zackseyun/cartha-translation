  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: te
  text: యొర్దాను అవతలనున్న గిలాదు, బాషాను ప్రాంతాలకు అదనంగా, మనష్షేకు పది భాగాల వాటా వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనష్షేకు పది భాగాలు పడ్డాయి,” లేదా “మనష్షేకు పది వాటాలు వచ్చాయి.” హీబ్రూలో భూకేటాయింపు సందర్భంలో అక్షరార్థంగా “పడ్డాయి” అనే నుడికారం ఉంది; ఇది చీటి ద్వారా కేటాయింపు భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: చీటి ద్వారా లభించాయి
  rationale: נפל అనే క్రియ భూవిభజన సందర్భంలో చీటి వేసి వాటా లభించడాన్ని సూచిస్తుంది. తెలుగులో ‘పడినవి’ అనడం అసహజంగా లేదా అస్పష్టంగా ఉండవచ్చు కాబట్టి, మూలంలోని చీటి-కేటాయింపు భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: חַבְלֵי
  choice: భాగాలు
  rationale: חבל కొలతతాడు, భూభాగం లేదా కేటాయించబడిన వాటా అనే అర్థాలను కలిగి ఉంటుంది. ఇక్కడ భూవిభజన ఫలితాన్ని సూచించడానికి ‘భాగాలు’ సహజమైన, విస్తృతమైన పదం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: వ్యక్తి/గోత్ర నామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֲשָׂרָה
  choice: పది
  rationale: భాగాల సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: לְבַד מֵאֶרֶץ
  choice: దేశాలు కాకుండా
  rationale: యొర్దాను అవతలి ప్రాంతాలకు అదనంగా వచ్చిన పది భాగాలను సూచించే לְבַד భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: గిలాదు, బాషాను
  rationale: ఈ ప్రాంత నామాలను ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతల ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యం గిలాదు, బాషాను దేశాల స్థానాన్ని సూచిస్తుంది; ‘అవతల’ మూలంలోని భౌగోళిక దృష్టికోణాన్ని నిలుపుతుంది.
