  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: te
  text: ఎందుకంటే మనష్షే కుమార్తెలు అతని కుమారుల మధ్య వారసత్వ భూమిని పొందారు; గిలాదు దేశం మనష్షేకు చెందిన మిగిలిన కుమారులకు దక్కింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: తెలుగులో ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఈ వాక్యం ముందున్న భూభాగాల పంపిణీకి వివరణ ఇస్తుంది. తెలుగులో ‘ఎందుకంటే’ అని పెడితే అసహజంగా లేదా అతిగా కారణార్థకంగా వినిపించే అవకాశం ఉన్నందున, వాక్యక్రమమే వివరణాత్మక సంబంధాన్ని తెలియజేసేలా ఉంచాం.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: మనష్షే కుమార్తెలు
  rationale: ఇది సహజమైన సంబంధబోధక నిర్మాణం. తరువాతి ‘కుమారులు’ అనే పదంతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడేందుకు ‘కుమార్తెలు’ను యథాతథంగా ఉంచాం.
- source_word: נָחֲלוּ נַחֲלָה
  choice: వారసత్వ భూమిని పొందారు
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన క్రియా-నామ పునరుక్తి వారసత్వంగా భూమి పొందడాన్ని నొక్కిచెబుతుంది. తెలుగులో సహజంగా ఉండేందుకు ‘వారసత్వ భూమిని పొందారు’ అని అనువదించాం.
- source_word: בְּתוֹךְ בָּנָיו
  choice: అతని కుమారుల మధ్య
  rationale: ‘అతని’ అనేది మనష్షేను సూచిస్తుంది. కుమార్తెలు-కుమారులు అనే న్యాయపరమైన వారసత్వ వ్యత్యాసాన్ని నిలుపుకోవడానికి లింగనిర్దిష్టమైన ‘కుమారులు’నే వాడాం.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: గిలాదు దేశం
  rationale: ఇక్కడ భూవారసత్వ ప్రాంతం ఉద్దేశించబడింది. ‘గిలాదు దేశం’ ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: మనష్షేకు చెందిన మిగిలిన కుమారులకు దక్కింది
  rationale: హీబ్రూ నిర్మాణం ఆ భూమి వారికి కేటాయించబడినదని లేదా వారి స్వాధీనమైందని తెలియజేస్తుంది. వారసత్వ పంపిణీ సందర్భంలో ‘దక్కింది’ సహజంగా ఆ ఫలితాన్ని వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే భూవారసత్వ సందర్భానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. కుమార్తెలు మరియు కుమారుల మధ్య మూలపాఠంలోని స్పష్టమైన వ్యత్యాసాన్ని నిలిపాం.
