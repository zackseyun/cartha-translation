  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: te
  text: మనష్షే సరిహద్దు ఆషేరు నుండి షెకెముకు ఎదురుగా ఉన్న మిక్మెతాత్[a] వరకు ఉండేది. ఆ సరిహద్దు కుడివైపునకు[b], ఏన్-తప్పూహు[c] నివాసుల వైపుకు సాగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెకెము ముందున్నది” లేదా “షెకెముకు ముఖంగా ఉన్నది.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “కుడివైపునకు”; సరిహద్దుల వర్ణనలో ఇది దక్షిణ దిశను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “ఏన్-తప్పూహు” అంటే “తప్పూహు ఊట.”
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: సరిహద్దు
  rationale: గోత్ర భూభాగాన్ని వేరుచేసే హద్దురేఖను సూచిస్తుంది; రెండు సందర్భాల్లోనూ సహజంగా సరిపోతుంది.
- source_word: מֵאָשֵׁר
  choice: ఆషేరు నుండి
  rationale: מִן సరిహద్దు వివరణలో ఆరంభ స్థానాన్ని సూచిస్తుంది; ఆషేరు గోత్రం లేదా దాని భౌగోళిక ప్రాంతమే సూచనబిందువు.
- source_word: הַמִּכְמְתָת
  choice: మిక్మెతాతు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: షెకెముకు ఎదురుగా ఉన్న
  rationale: ఈ పదబంధం ‘ముందున్నది,’ ‘ముఖాముఖిగా ఉన్నది,’ లేదా ‘ఎదురుగా ఉన్నది’ అనే స్థలసంబంధాన్ని తెలియజేస్తుంది; నిర్దిష్ట దిశను అనవసరంగా చేర్చకుండా ‘ఎదురుగా’ ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: అక్కడి నుండి ఆ సరిహద్దు ... సాగింది
  rationale: సరిహద్దు వెళ్లే మార్గాన్ని తెలిపే భౌగోళిక వాడుకను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל־הַיָּמִין
  choice: కుడివైపుకు
  rationale: హీబ్రూ పదబంధపు ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది. భౌగోళిక సందర్భంలో ఇది దక్షిణ దిశను సూచించవచ్చు గాని, ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించలేదు.
- source_word: יֹשְׁבֵי
  choice: నివాసుల వైపుగా
  rationale: ఆ ప్రదేశంలో నివసించే ప్రజలను సూచించే కృదంత రూపానికి సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: עֵין תַּפּוּחַ
  choice: ఏన్‌-తప్పూయ
  rationale: ఇది స్థలనామం కాబట్టి ధ్వన్యంతరీకరించబడింది; దాని పదార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, భూసరిహద్దు వర్ణనకు తగిన సరళమైన గౌరవప్రద శైలి వాడబడింది. స్థలనామాలు ధ్వన్యంతరీకరించబడ్డాయి; హీబ్రూలోని దిశాసంబంధ అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుకున్నాం.
