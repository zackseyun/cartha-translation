translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభమైన శైలి. గోత్ర సమూహాన్ని ఉద్దేశించినందున గౌరవ/సమూహ బహువచనమైన ‘మీరు, మీకు’ వాడబడింది. మూలంలోని అనిశ్చితులను పాదసూచికల్లో నిలిపాం.
