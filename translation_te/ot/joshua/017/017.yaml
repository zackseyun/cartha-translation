  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: te
  text: 'యెహోషువ యోసేపు వంశస్థులైన ఎఫ్రాయిము, మనష్షే వారితో ఇలా అన్నాడు: “మీరు ఎంతో మంది ప్రజలు[a]; మీకు గొప్ప బలం ఉంది. మీకు ఒక్కటే భూకేటాయింపు ఉండదు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు గొప్ప జనంగా ఉన్నారు.” హీబ్రూ పదబంధం సంఖ్యలో విస్తారతను లేదా గొప్పతనాన్ని సూచించగలదు; ఇక్కడ భూకేటాయింపు సందర్భం సంఖ్యాబలాన్ని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “చీటి.” యెహోషువ గ్రంథంలో ఇది తరచుగా చీటి ద్వారా కేటాయించిన వారసత్వ భూభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: అక్షరార్థమైన ‘యోసేపు ఇల్లు’ కంటే, ఎఫ్రాయిము మరియు మనష్షే గోత్రాలను సూచించే కుటుంబ-గోత్ర భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: ఎఫ్రాయిముతో, మనష్షేతో
  rationale: ‘యోసేపు వంశస్థులు’ ఎవరనేది ఈ రెండు గోత్రనామాలు స్పష్టం చేస్తున్నాయి; హీబ్రూ విభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన సంబోధనానుబంధ రూపంతో వ్యక్తం చేసింది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో అందిస్తుంది.
- source_word: עַם רַב
  choice: విస్తారమైన జనం
  rationale: రַב అనే పదానికి ‘అనేకమైన’ లేదా ‘గొప్ప’ అనే భావాలు సాధ్యమైనా, భూవిభజనకు సంబంధించిన సందర్భం సంఖ్యాబలాన్ని ముందుకు తెస్తుంది.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: మీకు గొప్ప బలం ఉంది
  rationale: లָךְ లోని స్వాధీన భావాన్ని నిలుపుతూ, సమూహాన్ని గౌరవబహువచనంతో సంబోధించే సహజ తెలుగు రూపం.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: మీకు ఒకే భూభాగం ఉండదు
  rationale: గּוֹרָל అక్షరార్థంగా ‘చీటి’ అయినా, యెహోషువ గ్రంథంలోని భూవిభజన సందర్భంలో చీటి ద్వారా కేటాయించిన వారసత్వ భూభాగాన్ని సూచిస్తుంది; ‘ఒకే’ సందర్భంలోని పరిమితి భావాన్ని తెలియజేస్తుంది.
