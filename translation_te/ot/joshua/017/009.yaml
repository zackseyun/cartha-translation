  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భౌగోళిక వర్ణనను ఉపయోగించాం. మూలంలోని సరిహద్దు క్రమాన్ని నిలిపి, నחל పదంలోని ‘వాగు/లోయ’ అర్థ విస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
