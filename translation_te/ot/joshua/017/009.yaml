  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: te
  text: అప్పుడు సరిహద్దు కానా వాగు[a] వరకు దిగిపోయి, ఆ వాగుకు దక్షిణంగా సాగింది. మనష్షే పట్టణాల మధ్య ఉన్న ఈ పట్టణాలు ఎఫ్రాయిముకు చెందినవి.[b] మనష్షే సరిహద్దు ఆ వాగుకు ఉత్తరంగా ఉంది; ఆ సరిహద్దు చివర సముద్రం[c] దగ్గర ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కానా లోయ.’ హెబ్రీ పదం נחל నీరు ప్రవహించే వాగుతో పాటు, కాలానుగుణంగా మాత్రమే నీరు పారే వాగుదారి లేదా లోయను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మనష్షేకు కేటాయించిన ప్రాంతంలో ఎఫ్రాయిముకు చెందిన పట్టణాలు కొన్ని ఉన్నాయి.
    reason: cultural_note
  - marker: c
    text: ఇక్కడ ‘సముద్రం’ అంటే మధ్యధరా సముద్రం.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: అప్పుడు సరిహద్దు ... దిగిపోయి
  rationale: సరిహద్దుల వర్ణనలో ירד భూభాగపు దిగువ దిశగా సరిహద్దు సాగడాన్ని సూచిస్తుంది. ‘దిగిపోయి’ మూలంలోని కదలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נַחַל קָנָה
  choice: కానా వాగు
  rationale: נחל శాశ్వత ప్రవాహాన్నే కాక కాలానుగుణంగా నీరు పారే వాగు లేదా లోయను కూడా సూచించవచ్చు. ‘వాగు’ సాధారణ పాఠకులకు సహజంగా ఉండి, పేరును ‘కానా’గా లిప్యంతరీకరిస్తుంది.
- source_word: נֶגְבָּה לַנַּחַל
  choice: ఆ వాగుకు దక్షిణంగా సాగింది
  rationale: నֶגְבָּה ఇక్కడ వాగుకు దక్షిణ వైపున ఉన్న సరిహద్దు స్థానాన్ని సూచిస్తుంది. ‘సాగింది’ సరిహద్దు రేఖ వర్ణనలో సహజంగా ఉన్నా, వాగు వెంబడి సాగిందని అనవసరంగా నిర్ధారించదు.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: ఈ పట్టణాలు ఎఫ్రాయిముకు చెందినవి
  rationale: క్రియలేని హెబ్రీ వాక్యం స్వాధీనత లేదా కేటాయింపును తెలియజేస్తుంది; ‘చెందినవి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: మనష్షే పట్టణాల మధ్య ఉన్న
  rationale: בְּתוֹךְ చుట్టూ ఉన్న ప్రాంతంలో కలిసివుండటం లేదా లోపల ఉండటాన్ని సూచిస్తుంది. ‘మధ్య ఉన్న’ ఎఫ్రాయిము పట్టణాలు మనష్షేకు కేటాయించిన ప్రాంతంలో ఉన్నాయనే భౌగోళిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: మనష్షే సరిహద్దు ఆ వాగుకు ఉత్తరంగా ఉంది
  rationale: מִצְּפוֹן వాగుకు ఉత్తర వైపున ఉన్న స్థానాన్ని సూచిస్తుంది. ఈ అనువాదం దిశను స్పష్టంగా, సంక్షిప్తంగా ఇస్తుంది.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: ఆ సరిహద్దు చివర సముద్రం దగ్గర ఉంది
  rationale: సరిహద్దు సూత్రాలలో תֹצְאוֹת దాని ముగింపు స్థానాన్ని సూచిస్తుంది. తెలుగు ఏకవచన రూపం సహజంగా ఉంటుంది; הַיָּמָּה సముద్రం వైపు లేదా సముద్రం వద్ద ముగింపును సూచిస్తుంది.
