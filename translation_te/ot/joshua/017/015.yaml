  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడింది. సమూహాన్ని ఉద్దేశించిన హీబ్రూ ఏకవచనాన్ని తెలుగులో సహజమైన బహువచన సంబోధనగా తెలిపింది. జాతి పేర్లను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలిపింది.
