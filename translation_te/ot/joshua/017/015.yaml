source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: te
  text: 'యెహోషువ వారితో ఇలా అన్నాడు: “మీరు సంఖ్యలో ఎక్కువైన ప్రజలైతే, అడవికి ఎక్కి వెళ్లి, అక్కడ పెరిజ్జీయుల, రెఫాయీయుల దేశంలో మీకోసం అడవిని నరికి భూమిని సిద్ధం చేసుకోండి.[a] ఎందుకంటే ఎఫ్రాయిము కొండప్రాంతం[b] మీకు చాలా ఇరుకుగా ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అక్కడ దానిని మీకోసం నరికి ఖాళీ చేసుకోండి.” హీబ్రూ క్రియ అడవితో నిండిన భూమిని నరికి ఖాళీ చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఎఫ్రాయిము పర్వతం” అని కూడా అనువదించవచ్చు. ఇక్కడ అది ఎఫ్రాయిముకు కేటాయించిన ఎత్తైన కొండల ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: జనసంఖ్య ఎక్కువగల ప్రజలు
  rationale: רַב ఇక్కడ ప్రజల గొప్పతనం కన్నా వారి సంఖ్య అధికంగా ఉండడాన్ని సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: అడవికి ఎక్కి వెళ్లి
  rationale: עֲלֵה లోని పైకి వెళ్లే దిశాభావాన్ని ‘ఎక్కి వెళ్లి’ నిలుపుతుంది; הַיַּעְרָה గమ్యమైన అడవి ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: మీ కోసం అక్కడ అడవిని నరికి స్థలం సిద్ధం చేసుకోండి
  rationale: Piel రూపంలోని ברא అడవితో నిండిన భూమిని నరికి శుభ్రం చేయడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు అంతర్లీన కర్మను ‘అడవిని’, ఉద్దేశించిన ఫలితాన్ని ‘స్థలం సిద్ధం’ అని వ్యక్తం చేసింది; לְךָ లోని స్వప్రయోజన భావాన్ని ‘మీ కోసం ... చేసుకోండి’ నిలుపుతుంది.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: పెరిజ్జీయుల, రెఫాయీయుల దేశంలో
  rationale: రెండు జనసమూహాల పేర్లనూ వ్యాఖ్యానించకుండా లిప్యంతరీకరించి, భౌగోళిక-జాతి సూచనను నిలిపింది.
- source_word: כִּי אָץ לְךָ
  choice: ఎందుకంటే ... మీకు మరీ ఇరుకుగా ఉంది
  rationale: אָץ ఇక్కడ స్థలం చాలక కుదించుకుపోయిన భావాన్ని ఇస్తుంది. ‘మరీ ఇరుకుగా’ సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: הַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతం
  rationale: యెహోషువ గ్రంథంలోని భూభాగ సందర్భంలో הַר ఒకే శిఖరాన్ని కాక ఎత్తైన కొండల ప్రాంతాన్ని సూచిస్తుంది.
