source:
  edition: WLC
  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: te
  text: 'మనష్షేకు మిగిలిన కుమారులకు వారి వంశాల ప్రకారం వాటా కేటాయించబడింది: అబీయెజెరు కుమారులకు, హేలెకు కుమారులకు, అశ్రీయేలు కుమారులకు, షెకెము కుమారులకు, హెపెరు కుమారులకు, షెమీదా కుమారులకు. వీరు యోసేపు కుమారుడైన మనష్షే యొక్క పురుష సంతానం[a], వారి వంశాల ప్రకారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడి సంతానాన్ని ప్రత్యేకంగా పురుష సంతానంగా పేర్కొంటుంది. చుట్టుపక్కల వచనాల్లో ప్రస్తావించబడిన సెలొఫెహాదు కుమార్తెలకు భిన్నంగా, ఇది మనష్షేకు చెందిన పురుష వంశశాఖలను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי
  choice: కుమారులకు ... వాటా లభించింది
  rationale: భూవిభజన సందర్భంలో לִ־ సూచించే కేటాయింపు సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంచేస్తుంది; וַיְהִי యొక్క కథన అనుసంధానం వాక్య ప్రవాహంలో వ్యక్తమవుతుంది.
- source_word: הַנּוֹתָרִים
  choice: మిగిలిన
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన ప్రత్యేక వంశశాఖకు భిన్నంగా మనష్షేకు చెందిన మిగతా శాఖలను సూచిస్తుంది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחָה ఇక్కడ గోత్రంలోని గుర్తింపబడిన బంధుత్వ విభాగాన్ని సూచిస్తుంది; తెలుగు బైబిలు-చారిత్రక సందర్భంలో ‘వంశం’ సహజంగా సరిపోతుంది.
- source_word: לִבְנֵי אֲבִיעֶזֶר ...
  choice: అబీయెజెరు కుమారులకు ...
  rationale: పేర్లతో కూడిన לִבְנֵי అనే పునరావృత పుత్రసంబంధ సూత్రాన్ని నిలుపుతూ, జాబితా యొక్క న్యాయపరమైన శైలిని కాపాడుతుంది.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: యోసేపు కుమారుడైన మనష్షేకు చెందిన ... సంతానం
  rationale: యోసేపు–మనష్షే వంశ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో అస్పష్టమైన వరుస ‘కుమారులు’ ప్రయోగాన్ని నివారిస్తుంది.
- source_word: הַזְּכָרִים
  choice: పురుష సంతానం
  rationale: సమీప సందర్భంలోని సెలొఫెహాదు కుమార్తెలతో ఉన్న వ్యత్యాసాన్ని వ్యక్తపరుస్తుంది; ‘మగ కుమారులు’ అనే అనవసర పునరుక్తికంటే సహజంగా ఉంటుంది.
theological_decisions:
- issue: హַזְּכָרִים ద్వారా సూచించబడే పురుష వంశశాఖల ప్రాధాన్యం
  choice: ‘పురుష సంతానం’ అని స్పష్టంగా అనువదించడం
  alternative: ‘కుమారులు’ మాత్రమే అని అనువదించడం
  rationale: మూలపాఠంలోని లింగ సూచనను తొలగించకుండా, చుట్టుపక్కల వచనాల్లోని సెలొఫెహాదు కుమార్తెల ప్రస్తావనతో ఉన్న ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-న్యాయ శైలి. పేర్ల జాబితాలో మూలంలోని పునరావృత నిర్మాణాన్ని నిలిపి, ప్రధాన వాక్యంలో భూవాటా భావాన్ని సహజంగా స్పష్టంచేశాం.
