revisions:
- from: 'మనష్షే మిగిలిన కుమారులకు వారి వంశాల ప్రకారం వాటా లభించింది: అబీయెజెరు కుమారులకు, హేలెకు కుమారులకు, అశ్రీయేలు కుమారులకు, షెకెము కుమారులకు, హెపెరు కుమారులకు, షెమీదా కుమారులకు. వీరు యోసేపు కుమారుడైన మనష్షేకు చెందిన పురుష సంతానం[a]; వారి వంశాల ప్రకారం వారికి వాటా లభించింది.'
  to: 'మనష్షేకు మిగిలిన కుమారులకు వారి వంశాల ప్రకారం వాటా కేటాయించబడింది: అబీయెజెరు కుమారులకు, హేలెకు కుమారులకు, అశ్రీయేలు కుమారులకు, షెకెము కుమారులకు, హెపెరు కుమారులకు, షెమీదా కుమారులకు. వీరు యోసేపు కుమారుడైన మనష్షే యొక్క పురుష సంతానం[a], వారి వంశాల ప్రకారం.'
  rationale: Opening allotment language is retained as a contextually warranted, natural rendering of the Hebrew distributive construction in this land-allotment passage. The unsupported repeated allotment assertion is removed from the concluding identification, which now follows the Hebrew’s scope and syntax. The footnote is made more grammatically precise about the Hebrew masculine designation.
