  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: te
  text: ఇది మీ మధ్య ఒక గుర్తుగా ఉండేలా, రాబోయే కాలంలో[c] మీ పిల్లలు[b], “ఈ రాళ్లు మీకు ఏమిటి?” అని అడిగినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో పదశః ‘మీ కుమారులు’; ఇక్కడ అది తరువాతి తరమైన మీ పిల్లలను ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘రాబోయే కాలంలో’ అనే మాటకు హీబ్రూలో పదశః ‘రేపు’; ఇక్కడ అది ‘తరువాత’ అనే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּהְיֶה
  choice: ఉండాలి
  rationale: לְמַעַן ఉద్దేశాన్ని సూచిస్తుంది; దాని తరువాతి అసంపూర్ణ క్రియతో కలిసి ఉద్దేశించిన ఫలితాన్ని తెలుగులో సహజంగా ‘ఉండాలి’ అని వ్యక్తపరుస్తుంది.
- source_word: זֹאת
  choice: ఇది
  rationale: రాళ్లతో ఏర్పాటుచేసిన జ్ఞాపకచిహ్నాన్ని ఏకవచనంగా సూచించే సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: אוֹת
  choice: సూచన
  rationale: אוֹת అనేది గుర్తుగా లేదా సంకేతంగా పనిచేసేదాన్ని సూచిస్తుంది; ‘సూచన’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּקִרְבְּכֶם
  choice: మీ మధ్య
  rationale: సమాజం మధ్యలో, వారిలో ఉన్నదనే స్థానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי יִשְׁאָלוּן
  choice: అడిగినప్పుడు
  rationale: ఈ సందర్భంలో כִּי ఎదురుచూసే కాలసంబంధ పరిస్థితిని పరిచయం చేస్తుంది; తెలుగు ఉపవాక్య రూపం దానిని స్పష్టంగా తెలుపుతుంది.
- source_word: בְּנֵיכֶם
  choice: మీ పిల్లలు
  rationale: పదశః ‘మీ కుమారులు’; అయితే ఇక్కడ తరువాతి తరాన్ని ప్రతినిధిగా సూచిస్తుంది కాబట్టి ‘మీ పిల్లలు’ ఉద్దేశిత పరిధిని సహజంగా అందిస్తుంది.
- source_word: מָחָר
  choice: రాబోయే కాలంలో
  rationale: పదశః ‘రేపు’; ఈ సందర్భంలో భవిష్యత్తులో లేదా తరువాత అనే సామెతాత్మక కాలార్థం ఉంది.
- source_word: לֵאמֹר
  choice: అని
  rationale: ప్రశ్నలోని మాటలను పరిచయం చేసే ఉల్లేఖన రూపాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: ఈ రాళ్లు మీకు ఏమిటి?
  rationale: హీబ్రూ ప్రశ్న యొక్క సంక్షిప్తతను, దాని అర్థసందిగ్ధతను నిలుపుతుంది; సందర్భంలో ఇది వాటి ప్రాముఖ్యతను అడిగే ప్రశ్నగా అర్థమవుతుంది.
theological_decisions:
- issue: בְּנֵיכֶם లో లింగసూచక పదప్రయోగం
  choice: మీ పిల్లలు
  alternative: మీ కుమారులు
  rationale: హీబ్రూ రూపం పురుష బహువచనమైనప్పటికీ, జ్ఞాపకచిహ్నం గురించి అడిగే తరువాతి తరాన్ని సమష్టిగా సూచిస్తుంది. ‘పిల్లలు’ అనే పదం పురుషులకు మాత్రమే పరిమితం చేయకుండా సందర్భ ఉద్దేశాన్ని అందిస్తుంది.
- issue: מָה ... לָכֶם ప్రశ్నలోని భావం
  choice: ఈ రాళ్లు మీకు ఏమిటి?
  alternative: ఈ రాళ్లు మీకు ఏమి సూచిస్తున్నాయి?
  rationale: ప్రత్యామ్నాయం అంతర్లీన భావాన్ని స్పష్టపరుస్తుంది; అయితే మూలంలోని ‘మీకు ఏమిటి?’ అనే తెరవబడిన ప్రశ్నను ప్రధాన పాఠంలో ఉంచడం ద్వారా దాని నిజమైన భావవిస్తృతిని ముందుగానే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగే నిర్మాణాన్ని చూపేందుకు చివర అల్పవిరామం ఉంచబడింది. మూలంలోని ప్రశ్నార్థక అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, వివరణాత్మక ప్రత్యామ్నాయాన్ని నిర్ణయంగా నమోదు చేశాం.
