  - severity: medium
    issue: Purposive verb force is weakened by “ఉండాలి.”
    rationale: The Hebrew לְמַעַן plus imperfect expresses purpose/intended result, not primarily obligation. “ఉండేలా” preserves that relation.
  - severity: medium
    issue: “సూచన” is not the best contextual equivalent for אוֹת.
    rationale: In this memorial context, “గుర్తు” naturally denotes the sign/marker constituted by the stones; “సూచన” can suggest an instruction or indication.
  - severity: low
    issue: The full stop closes a construction that continues into the next verse.
    rationale: The Hebrew verse ends with the children's question, while the response begins in verse 7. A continuing comma preserves the connected syntax.
