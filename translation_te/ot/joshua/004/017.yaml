  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: te
  text: 'అప్పుడు యెహోషువ యాజకులకు ఇలా ఆజ్ఞాపించాడు: “యొర్దాను నదిలోనుండి పైకి రండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను ఇవ్వడాన్ని సూచిస్తుంది. కథనంలోని వరుస చర్యను సహజమైన తెలుగు భూతకాలంతో వ్యక్తపరచి, וַ־ను సందర్భానుసారంగా ‘అప్పుడు’ అని అనువదించాం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: אֶת הַכֹּהֲנִים
  choice: యాజకులకు
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మగా ఉన్నప్పటికీ, తెలుగు వాడుకలో ‘ఒకరికి ఆజ్ఞాపించు’ అనే దత్తివిభక్తి నిర్మాణం సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా’తో వ్యక్తపరచాం; ‘అంటూ’ కూడా సాధ్యమే.
- source_word: עֲלוּ
  choice: పైకి రండి
  rationale: עלה పైకి కదలడాన్ని సూచిస్తుంది. యాజకులు నది మధ్య నుంచి ఒడ్డుకు రావలసిన సందర్భంలో గౌరవపూర్వక బహువచన ఆజ్ఞారూపమైన ‘పైకి రండి’ సహజంగా ఉంది.
- source_word: מִן הַיַּרְדֵּן
  choice: యొర్దాను నదిలోనుండి
  rationale: מן ఇక్కడ లోపలి స్థానం నుంచి బయటకు కదలడాన్ని సూచిస్తుంది. సందర్భ స్పష్టత కోసం భౌగోళిక నామానికి ‘నది’ని జోడించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆజ్ఞాధికారాన్ని నిలిపి, తెలుగు సహజ వాక్యనిర్మాణాన్ని అనుసరించాం.
