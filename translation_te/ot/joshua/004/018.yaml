reference: Joshua 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: te
  text: యాహ్వే నిబంధన మందసాన్ని మోస్తున్న యాజకులు యొర్దాను మధ్యనుండి పైకి వచ్చినప్పుడు, వారి అరికాళ్లు పొడి నేలపైకి చేరాయి. అప్పుడు యొర్దాను నీళ్లు తమ స్థానానికి తిరిగి వచ్చి, మునుపటిలాగే[a] దాని గట్లన్నిటి మీదుగా ప్రవహించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నానుడి అక్షరార్థం: ‘నిన్న, మొన్న ఉన్నట్లుగా’; భావం: ‘మునుపటిలాగా.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: హీబ్రూ కథనంలోని సంఘటనల కొనసాగింపును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; విడిగా ‘జరిగింది’ అని చేర్చడం వల్ల వచ్చే అసహజతను నివారిస్తుంది.
- source_word: בַעֲלוֹת
  choice: పైకి వచ్చినప్పుడు
  rationale: בְּ కలిగిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; నది మధ్యనుండి ఒడ్డుకు పైకి రావడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נֹשְׂאֵי
  choice: మోస్తున్న
  rationale: యాజకుల కొనసాగుతున్న కార్యాన్ని తెలిపే participle‌కు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ construct chain‌ను సంక్షిప్తంగా, పారదర్శకంగా అందిస్తుంది; אֲרוֹן‌కు బైబిలు సందర్భంలో స్థిరమైన ‘మందసం’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను మధ్యనుండి
  rationale: תּוֹךְ నది లోపలి భాగాన్ని లేదా మధ్యను సూచిస్తుంది; కేవలం ఒడ్డునుండి అని అర్థం రాకుండా కాపాడుతుంది.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: వారి అరికాళ్లు పొడి నేలపైకి చేరాయి
  rationale: నది అడుగునుండి పాదాలు విడివడి పొడి నేలపైకి వచ్చిన కదలికను తెలుగులో సహజంగా తెలియజేస్తుంది; ‘వేరుచేయబడ్డాయి’ వంటి యాంత్రిక పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: యొర్దాను నీళ్లు తమ స్థానానికి తిరిగి వచ్చి
  rationale: నీళ్లు మునుపటి స్థానానికి తిరిగివచ్చినట్లు చెప్పే హీబ్రూ చిత్రణను నిలుపుతుంది.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా ‘నిన్న, మొన్న ఉన్నట్లుగా’ అనే హీబ్రూ నానుడికి సహజమైన తెలుగు సమానార్థకం.
- source_word: וַיֵּלְכוּ ... עַל כָּל גְּדוֹתָיו
  choice: దాని గట్లన్నిటి మీదుగా ప్రవహించాయి
  rationale: הלך‌ను నది నీళ్ల సందర్భానికి తగిన ‘ప్రవహించాయి’గా, עַל‌ను ‘మీదుగా’గా అందించి నీళ్లు గట్లను మించి వెళ్లిన చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉన్నందున, దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: నిబంధన మందసం యొక్క సంబంధం
  choice: యాహ్వే నిబంధన మందసం
  alternative: యాహ్వే యొక్క నిబంధన మందసం
  rationale: హీబ్రూ construct chain‌లోని సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది; దేవునికి చెందిన నిబంధన మందసం అనే భావాన్ని అనవసరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన కథన ప్రవాహం, అయితే ‘నిబంధన మందసం,’ ‘యాజకులు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి సంఘటనల క్రమాన్ని స్పష్టం చేశాం.
