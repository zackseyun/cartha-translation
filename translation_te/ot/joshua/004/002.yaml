translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని ‘తీసుకోండి’ అనే ప్రత్యక్ష క్రియాబలాన్ని నిలిపి, విభజనార్థక పునరుక్తిని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి దాని అక్షర నిర్మాణాన్ని పాదటిప్పణిలో నమోదు చేశాం.
