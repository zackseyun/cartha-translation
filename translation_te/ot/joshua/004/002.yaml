translation:
  language: te
  text: “ప్రజల్లోనుండి మీ కోసం పన్నెండు మంది పురుషులను తీసుకోండి—ఒక్కో గోత్రం నుండి ఒక్కొక్కరిని.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో విభజనార్థక పదబంధం అక్షరార్థంగా “ఒక పురుషుడు, ఒక పురుషుడు—ఒక గోత్రం నుండి” అని పునరుక్తమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: తీసుకోండి
  rationale: לקח క్రియ యొక్క ఖాల్ ఆజ్ఞార్థక బహువచన రూపానికి ఉన్న ప్రాథమిక ‘తీసుకోండి’ అనే భావాన్ని నిలుపుతుంది; సందర్భంలో ఎంపిక లేదా నియామకం సూచితమైనా, దానిని పాఠ్యంలో అతిగా స్పష్టీకరించదు.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: לָכֶם లోని ప్రయోజనార్థక/ఆత్మనిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִן הָעָם
  choice: ప్రజల్లోనుండి
  rationale: ఇశ్రాయేలు ప్రజల సమూహంలోనుండి తీసుకోవాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: పన్నెండు మంది పురుషులను
  rationale: אֲנָשִׁים ఇక్కడ వయోజన పురుషులను సూచిస్తుంది; లింగసూచనను నిలుపుతూ తెలుగులో స్పష్టంగా అనువదించబడింది.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: ఒక్కొక్కరిని
  rationale: హీబ్రూ పునరుక్తి తెలిపే విభజనార్థక భావాన్ని సహజ తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: מִשָּׁבֶט
  choice: ఒక్కో గోత్రం నుండి
  rationale: שֵׁבֶט ఇక్కడ ఇశ్రాయేలు గోత్రాన్ని సూచిస్తుంది; విభజనార్థక నిర్మాణంతో కలిపి ‘ఒక్కో గోత్రం నుండి’ అని సహజంగా ఇవ్వబడింది.
