reference: Joshua 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: te
  text: ఆ రోజున యాహ్వే ఇశ్రాయేలీయులందరి దృష్టిలో యెహోషువను గొప్పవానిగా చేశాడు. వారు యెహోషువను భయభక్తులతో గౌరవించారు; మోషేను అతని జీవితకాలమంతా భయభక్తులతో గౌరవించినట్లే చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భయపడ్డారు” లేదా “విస్మయభరిత గౌరవంతో చూశారు”; హీబ్రూ క్రియ సందర్భానుసారం భయం, విస్మయం లేదా భక్తిపూర్వక గౌరవాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కథన సందర్భంలోని కాలసూచక పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: גִּדַּל
  choice: గొప్పవానిగా చేశాడు
  rationale: 'పియేల్ రూపంలోని కారణార్థాన్ని నిలుపుతుంది: యాహ్వే యెహోషువకు కేవలం ఘనత ఇచ్చాడని కాక, ప్రజల దృష్టిలో అతణ్ణి గొప్పవానిగా చేశాడని తెలుపుతుంది.'
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి దృష్టిలో
  rationale: ‘అందరి కళ్లలో’ అనే హీబ్రూ రూపకానికి సహజమైన తెలుగు సమానార్థకం; ప్రజల అంచనా, గౌరవంలో యెహోషువ గొప్పవాడయ్యాడనే భావాన్ని ఇస్తుంది.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: అతణ్ణి భయభక్తులతో చూశారు
  rationale: ירא లోని భయం, విస్మయం, గౌరవభావాల పరిధిని ‘భయభక్తులు’ ద్వారా నిలుపుతూ, నాయకత్వ సందర్భంలో కేవలం భీతిగా అపార్థం కాకుండా చేస్తుంది.
- source_word: כַּאֲשֶׁר יָרְאוּ אֶת־מֹשֶׁה
  choice: మోషేను ... భయభక్తులతో చూసినట్లే
  rationale: యెహోషువ పట్ల ప్రజల స్పందనను మోషే పట్ల వారి స్పందనతో దగ్గరగా పోల్చే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל־יְמֵי חַיָּיו
  choice: అతని జీవితకాలమంతా
  rationale: ‘అతని జీవితంలోని అన్ని రోజులు’ అనే హీబ్రూ నుడికారాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలో సర్వనామం మోషేను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తినామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించబడింది.
- issue: యెహోషువ పట్ల ירא యొక్క భావం
  choice: భయభక్తులతో చూశారు
  alternative: భయపడ్డారు / గౌరవించారు
  rationale: ఈ క్రియ భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే భావాలను మోయగలదు. మోషేతో పోలిక ఉన్న నాయకత్వ సందర్భంలో ‘భయభక్తులు’ ఈ ఉద్దేశపూర్వక భావవిస్తృతిని ఎక్కువగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘దృష్టిలో’ అనే సహజ తెలుగు నుడికారంతో హీబ్రూ రూపకం నిలుపబడింది; ירא యొక్క భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక కలిసి వ్యక్తం చేస్తాయి.
