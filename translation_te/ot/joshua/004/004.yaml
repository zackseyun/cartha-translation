translation:
  language: te
  text: అప్పుడు యెహోషువ తాను ఇశ్రాయేలు కుమారుల్లోనుండి[a] నియమించిన[b] పన్నెండు మంది పురుషులను—ప్రతి గోత్రం నుండి ఒక్కొక్కరిని—పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయుల్లోనుండి.’ హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారుల్లోనుండి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సిద్ధం చేసిన’ లేదా ‘ఎంపిక చేసిన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: పిలిచాడు
  rationale: קרא + אֶל ఇక్కడ ఎంపికైన పురుషులను తన దగ్గరకు పిలవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పిలిచాడు’ సహజంగా ఉంది; ‘రప్పించాడు’ మూలంలో ఉన్నదానికంటే కొంత బలంగా అనిపించవచ్చు.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: పన్నెండు మంది పురుషులను
  rationale: సందర్భంలో ముందే గుర్తించబడిన నిర్దిష్ట సమూహాన్ని ఇది సూచిస్తుంది. ‘మంది’ సహజ తెలుగు వ్యక్తి-గణనను, ‘పురుషులు’ אִישׁ యొక్క లింగసూచనను నిలుపుతుంది.
- source_word: אֲשֶׁר הֵכִין
  choice: తాను ... నియమించిన
  rationale: הכין అనే పదానికి ‘సిద్ధం చేయు, స్థిరపరచు, నియమించు’ అనే భావాలు ఉన్నాయి. ఈ సందర్భంలో ప్రతినిధులుగా ముందుగా ఏర్పరచడం లేదా నియమించడం ఉద్దేశం; ‘నియమించిన’ తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల్లోనుండి
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని నిలుపుతూ, వారిలోనుండి ఎంపిక చేశాడనే భావాన్ని ‘కుమారుల్లోనుండి’ తెలియజేస్తుంది. జాతిసూచకంగా ‘ఇశ్రాయేలీయుల్లోనుండి’ కూడా సాధ్యం.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: ప్రతి గోత్రం నుండి ఒక్కొక్కరిని
  rationale: హీబ్రూలోని పంపిణీ సూచించే పునరుక్తిని ఆధునిక తెలుగులో సహజమైన ‘ఒక్కొక్కరిని’తో వ్యక్తం చేసింది; ప్రతి గోత్రానికి ఒక పురుషుడు అనే ప్రతినిధి నిర్మాణం నిలిచింది.
