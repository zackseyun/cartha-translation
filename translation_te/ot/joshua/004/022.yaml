  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: te
  text: 'అప్పుడు మీరు మీ పిల్లలకు[a] ఇలా తెలియజేయాలి: ‘ఇశ్రాయేలు ఆరిన నేల మీదుగా ఈ యొర్దానును దాటింది.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ కుమారులకు.’ హీబ్రూ పదం ప్రత్యేకంగా మగపిల్లలను గానీ, సాధారణంగా పిల్లలను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: అప్పుడు మీరు ... తెలియజేయాలి
  rationale: ידע హిఫీల్ రూపం ‘తెలిసేలా చేయడం, తెలియజేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. ముందున్న וְ సందర్భానుసారంగా ఆదేశ క్రమాన్ని చూపే ‘అప్పుడు’గా అనువదించబడింది.
- source_word: בְּנֵיכֶם
  choice: మీ పిల్లలకు
  rationale: בנים అనేది ప్రత్యేకంగా కుమారులను లేదా విస్తృతంగా పిల్లలను సూచించగలదు. జ్ఞాపకార్థ బోధను తరువాతి తరానికి అందించే ఈ సందర్భంలో ‘పిల్లలు’ సహజంగా సరిపోతుంది; సంకుచిత అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: మాటల విషయాన్ని పరిచయం చేసే לֵאמֹרను ఆధునిక తెలుగులో సహజంగా ఉండే ‘ఇలా’తో వ్యక్తపరిచాం.
- source_word: בַּיַּבָּשָׁה
  choice: ఆరిన నేల మీదుగా
  rationale: יַבָּשָׁה నీరు లేని పొడి/ఆరిన నేలను సూచిస్తుంది. నదిని దాటే సందర్భంలో ‘ఆరిన నేల మీదుగా’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עָבַר
  choice: దాటింది
  rationale: עברకు ఇక్కడ ప్రత్యక్ష కర్మగా యొర్దాను ఉంది; అందువల్ల ‘దాటింది’ స్పష్టమైన సమకాలీన తెలుగు ప్రయోగం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజాసమూహానికి చెందిన నామం; తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను వాడాం.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: ఈ యొర్దానును
  rationale: నిర్దేశక సర్వనామం ఇచ్చే సమీపత్వాన్ని ‘ఈ’ నిలుపుతుంది. ‘యొర్దాను’ తెలుగులో స్థిరమైన నదిపేరు; వాక్యంలోని ప్రత్యక్ష కర్మను ‘ను’ సూచిస్తుంది.
