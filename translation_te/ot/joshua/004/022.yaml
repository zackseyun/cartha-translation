  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. మూలంలోని ఆదేశ భావం, తరువాతి తరానికి తెలియజేయాలనే ఉద్దేశం, ‘ఈ యొర్దాను’ అనే నిర్దేశక బలం నిలుపబడ్డాయి.
