  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: te
  text: మొదటి నెల పదవ రోజున ప్రజలు యొర్దాను నుండి పైకి వచ్చారు[a]; వారు యెరికోకు తూర్పు అంచున ఉన్న గిల్గాలులో మకాం వేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి వెళ్లారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యెరికోకు తూర్పున ఉన్న గిల్గాలులో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: పైకి వచ్చి
  rationale: עלה అనే క్రియకు ‘పైకి వెళ్లడం/రావడం’ అనే అర్థం ఉంది. యొర్దాను నదిలోనుండి పైకి వచ్చిన దిశాభావాన్ని ఈ ప్రయోగం సహజంగా నిలుపుతుంది.
- source_word: מִן הַיַּרְדֵּן
  choice: యొర్దాను నుండి
  rationale: ఈ పదబంధం యొర్దాను నదిలోనుండి బయటికి జరిగిన కదలికను సూచిస్తుంది; సందర్భంలో ‘యొర్దాను’ అన్నదే నదిని స్పష్టంగా సూచిస్తుంది.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల పదవ రోజున
  rationale: హీబ్రూ కాలదర్శక తేదీ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అంటే శిబిరం వేయడం లేదా తాత్కాలికంగా బస చేయడం. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజమైన కథన ప్రయోగం.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, అక్కడ మకాం వేసిన భావానికి తగిన విభక్తిని ఉపయోగించాం.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: యెరికోకు తూర్పున ఉన్న
  rationale: పదబంధం యెరికోకు తూర్పు వైపున ఉన్న ప్రాంతాన్ని సూచిస్తుంది. కృత్రిమమైన ‘తూర్పు అంచులో’ కంటే ఈ రూపం తెలుగులో సహజంగా ఉంది; קצה లోని అంచు/సరిహద్దు భావాన్ని పాదటిప్పణిలో నిలిపాం.
