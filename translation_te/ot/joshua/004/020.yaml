  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֩ שְׁתֵּ֨ים עֶשְׂרֵ֤ה הָֽ/אֲבָנִים֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר לָקְח֖וּ מִן הַ/יַּרְדֵּ֑ן הֵקִ֥ים יְהוֹשֻׁ֖עַ בַּ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/020.yaml
  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: te
  text: యొర్దాను నుండి వారు తీసుకున్న ఈ పన్నెండు రాళ్లను యెహోషువ గిల్గాలులో నిలబెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: —
  rationale: వావ్ కథనాన్ని ముందటి వాక్యంతో అనుసంధానిస్తుంది; అయితే స్వతంత్ర తెలుగు వచనంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం సహజంగా ఉండదు. אֵת కర్మ సూచికకు తెలుగులో వేరే పదం అవసరం లేదు; ‘రాళ్లను’లోని కర్మ విభక్తి దాని వ్యాకరణ కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: ఆ పన్నెండు రాళ్లను
  rationale: సంఖ్య, నామవాచకం, నిర్దేశక సర్వనామం అన్నింటినీ సహజమైన తెలుగు పదక్రమంలో ఉంచింది. ‘ఆ’ సందర్భంలో ఇప్పటికే ప్రస్తావించిన నిర్దిష్ట రాళ్లను సూచిస్తుంది.
- source_word: אֲשֶׁר לָקְחוּ
  choice: వారు తీసుకొచ్చిన
  rationale: సాపేక్ష ఉపవాక్యాన్ని సహజ తెలుగు కృదంత నిర్మాణంతో అనువదించింది. మూలంలోని לָקְחוּ ప్రాథమికంగా ‘తీసుకున్నారు’; గమ్యస్థానానికి తీసుకురావడం అనే సందర్భార్థాన్ని తెలుగులో ‘తీసుకొచ్చిన’ సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַיַּרְדֵּן
  choice: యొర్దాను నుండి
  rationale: מִן యొక్క మూలస్థాన భావాన్ని ‘నుండి’ స్పష్టంగా నిలుపుతుంది. ‘యొర్దాను’ అనే స్థిర నామం సందర్భంలో నదినే సూచిస్తుంది కాబట్టి ‘నది’ని చేర్చాల్సిన అవసరం లేదు.
- source_word: הֵקִים
  choice: నిలబెట్టించాడు
  rationale: స్మారక రాళ్లను ఒక చోట ప్రతిష్ఠించి నిలిపే చర్యను సహజంగా వ్యక్తం చేస్తుంది. హిఫిల్ రూపంలోని కారణార్థ ఛాయను కూడా నిలుపుతుంది; యెహోషువ స్వయంగా ప్రతి రాయిని ఎత్తాడని అనవసరంగా నిర్ధారించదు.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בַּגִּלְגָּל
  choice: గిల్గాలులో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను సహజ తెలుగు స్థానవిభక్తితో అందించింది.
