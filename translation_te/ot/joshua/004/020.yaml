revisions:
- from: యొర్దాను నుండి వారు తీసుకొచ్చిన ఆ పన్నెండు రాళ్లను యెహోషువ గిల్గాలులో నిలబెట్టించాడు.
  to: యొర్దాను నుండి వారు తీసుకున్న ఈ పన్నెండు రాళ్లను యెహోషువ గిల్గాలులో నిలబెట్టాడు.
  rationale: The revision removes added directional and delegated-action implications, renders the explicit demonstrative more directly, and otherwise preserves the source’s participants, location, and memorial-stone action. No footnote is needed.
  reviewer_model: gpt-5.6-terra
