translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమాచార క్రమాన్ని సాధ్యమైనంతవరకు కాపాడుతూ, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా సాపేక్ష ఉపవాక్యాన్ని కృదంత రూపంలో ఇచ్చాం. పాదటిప్పణులు అవసరం లేదు.
