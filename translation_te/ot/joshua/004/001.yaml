  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: te
  text: 'ప్రజలందరూ యొర్దాను దాటడం ముగించినప్పుడు, యెహోవా యెహోషువతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: …ముగించినప్పుడు
  rationale: వచనారంభంలోని וַיְהִי కథనాన్ని ముందుకు నడిపే సూత్రప్రయోగం; כַּאֲשֶׁר కాలసంబంధ ఉపవాక్యాన్ని ప్రారంభిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చకుండా ‘…ప్పుడు’ నిర్మాణం సహజంగా రెండింటి కథన కార్యాన్ని వ్యక్తపరుస్తుంది.
- source_word: תַּמּוּ
  choice: ముగించినప్పుడు
  rationale: תמם ఇక్కడ క్రియ పూర్తయినదాన్ని సూచిస్తుంది; ప్రధాన క్రియకు ముందే దాటడం పూర్తయిందనే క్రమాన్ని తెలుగు కాలవాచక నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: כָל הַגּוֹי
  choice: ప్రజలందరూ
  rationale: గּוֹי ఏకవచన సమూహపదంగా ఇశ్రాయేలీయ సమాజమంతటినీ సూచిస్తుంది. ‘ప్రజలందరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి సంపూర్ణ సమూహ భావాన్ని నిలుపుతుంది.
- source_word: לַעֲבוֹר אֶת הַיַּרְדֵּן
  choice: యొర్దాను దాటడం
  rationale: לతో కూడిన క్రియానామం పూర్తయిన దాటే చర్యను సూచిస్తుంది. నది అనే పదం మూలంలో లేకపోవడంతో ప్రామాణిక భౌగోళిక నామమైన ‘యొర్దాను’ మాత్రమే ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంతో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే అందిస్తుంది.
- source_word: וַיֹּאמֶר ... אֶל ... לֵאמֹר
  choice: 'యెహోషువతో ఇలా అన్నాడు:'
  rationale: సాధారణ హీబ్రూ వాక్యప్రవేశ సూత్రాన్ని సహజ తెలుగులో అందించి, తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యానికి ద్విబిందువు ద్వారా కొనసాగింపును సూచిస్తుంది.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో గుర్తించదగిన ప్రామాణిక రూపం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని చతురక్షర దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం. ఉచ్చారణపై చారిత్రక అనిశ్చితి ఉన్నప్పటికీ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: כָל הַגּוֹי యొక్క సమూహ భావం
  choice: ప్రజలందరూ
  alternative: జనమంతా
  rationale: ఇక్కడ పదం ఇశ్రాయేలు సమాజాన్ని ఏక సమూహంగా సూచిస్తుంది. ‘ప్రజలందరూ’ ప్రతి వ్యక్తి దాటడం పూర్తయిందనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ఏ ప్రత్యేక జాతిశాస్త్రీయ లేదా సంఘపరమైన భావాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలికి తగిన సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ వాక్యప్రవేశ సూత్రాన్ని పదేపదే అనుకరించకుండా తెలుగు కథన ప్రవాహంలో కలిపాం. తరువాతి వచనంలో ప్రసంగం కొనసాగుతుందని ద్విబిందువుతో సూచించాం.
