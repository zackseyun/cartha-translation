source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: te
  text: మందసాన్ని మోస్తున్న యాజకులు, మోషే యెహోషువకు ఆజ్ఞాపించినదంతటి ప్రకారం, యాహ్వే యెహోషువకు ప్రజలతో చెప్పమని ఆజ్ఞాపించిన విషయమంతా చెప్పడం పూర్తయ్యేవరకు[a] యొర్దాను నది మధ్యలో నిలబడి ఉన్నారు. ప్రజలు తొందరపడి దాటిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: ‘విషయమంతటి పూర్తి వరకు.’ ఇక్కడ యాహ్వే యెహోషువకు ప్రజలతో చెప్పమని ఆజ్ఞాపించిన సమస్తం పూర్తవడాన్ని ఇది సూచిస్తుంది.'
    reason: దָּבָר పదానికి ‘మాట,’ ‘విషయం,’ ‘కార్యం’ వంటి విస్తృత అర్థపరిధి ఉంది; సందర్భంలో చెప్పవలసిన ఆజ్ఞాపిత విషయసముదాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: మందసాన్ని మోస్తున్న
  rationale: హీబ్రూ భాగధాతువు యాజకులు కొనసాగిస్తూ చేసిన కార్యాన్ని సూచిస్తుంది. ‘మోస్తున్న’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను మధ్యలో నిలబడి ఉన్నారు
  rationale: భాగధాతువు సూచించే కొనసాగుతున్న స్థితిని ‘నిలబడి ఉన్నారు’ స్పష్టంగా వ్యక్తం చేస్తుంది; בְּתוֹךְ యొక్క మధ్యస్థాన భావం కూడా నిలుస్తుంది.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: విషయమంతా పూర్తయ్యే వరకు
  rationale: దీనికి అక్షరార్థంగా ‘మాట/విషయమంతటి పూర్తి వరకు’ అనే విస్తృత భావం ఉంది. సందర్భంలో ఆజ్ఞాపించిన మాటలన్నీ పూర్తిగా తెలియజేయబడడాన్ని సూచించేలా, అసలు పదంలోని విస్తృతతను అతిగా వివరించకుండా అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును సాధారణ తెలుగు బైబిలు రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించడం ద్వారా అది బిరుదుగా మారకుండా వ్యక్తినామంగా నిలుస్తుంది.
- source_word: לְדַבֵּר אֶל הָעָם
  choice: ప్రజలతో చెప్పమని
  rationale: דבר אל యొక్క ‘ప్రజలతో మాట్లాడడం/చెప్పడం’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: మోషే యెహోషువకు ఆజ్ఞాపించినదంతటి ప్రకారం
  rationale: כְּכֹל సూచించే సంపూర్ణ అనుగుణతను ‘అంతటి ప్రకారం’ నిలుపుతుంది; మోషే ఇచ్చిన పూర్వ ఆజ్ఞ కూడా స్పష్టంగా ఉంటుంది.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: ప్రజలు త్వరపడి దాటివెళ్లారు
  rationale: మొదటి క్రియలోని తొందరను, రెండవ క్రియలోని అవతలి వైపుకు దాటే కదలికను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; హీబ్రూ స్వరపునర్నిర్మాణానికి దగ్గరగా భావించే ‘యాహ్వే’ ప్రత్యామ్నాయం.
- issue: עַד תֹּם כָּל הַדָּבָר యొక్క పరిధి
  choice: ఆజ్ఞాపించిన విషయమంతా పూర్తయ్యే వరకు
  alternative: మాటంతా చెప్పడం పూర్తయ్యే వరకు
  rationale: דָּבָר పదం ‘మాట’, ‘విషయం’, ‘కార్యం’ అనే భావాలను కలిగి ఉండగలదు. సమీపంలోని ‘ప్రజలతో చెప్పమని’ అనే పదబంధం మాటల వైపు మొగ్గుచూపినా, విస్తృతమైన ‘విషయం’ అనే రూపం మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మందసం’, ‘యాజకులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ, పాతకాలపు క్రియారూపాలను నివారించాం. హీబ్రూ వాక్యంలోని పొడవైన నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు ప్రధాన వాక్యాలుగా విభజించాం.
