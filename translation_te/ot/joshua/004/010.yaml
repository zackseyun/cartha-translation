revisions:
- from: మందసాన్ని మోస్తున్న యాజకులు యొర్దాను మధ్యలో నిలబడి ఉన్నారు. మోషే యెహోషువకు ఆజ్ఞాపించినదంతటి ప్రకారం, యెహోవా ప్రజలతో చెప్పమని యెహోషువకు ఆజ్ఞాపించిన విషయమంతా పూర్తయ్యే వరకు[a] వారు అక్కడే నిలబడ్డారు. ప్రజలు త్వరపడి దాటివెళ్లారు.
  to: మందసాన్ని మోస్తున్న యాజకులు, మోషే యెహోషువకు ఆజ్ఞాపించినదంతటి ప్రకారం, యాహ్వే యెహోషువకు ప్రజలతో చెప్పమని ఆజ్ఞాపించిన విషయమంతా చెప్పడం పూర్తయ్యేవరకు[a] యొర్దాను నది మధ్యలో నిలబడి ఉన్నారు. ప్రజలు తొందరపడి దాటిపోయారు.
  rationale: సవరణ దైవనామాన్ని POB నిర్ణయానికి అనుగుణంగా చేసింది; పునరుక్తిని తొలగించింది; అలాగే ‘చెప్పడం పూర్తయ్యేవరకు’ అనే రూపంతో హీబ్రూలోని ‘యెహోషువ ప్రజలతో చెప్పవలసిన సమస్త విషయం పూర్తయ్యే వరకు’ అనే సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేసింది. పాదసూచిక గుర్తు సంబంధిత కాలవాక్యానికే జతచేయబడింది.
