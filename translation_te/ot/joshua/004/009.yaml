  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: te
  text: యెహోషువ యొర్దాను నది మధ్యలో పన్నెండు రాళ్లను నిలబెట్టాడు. నిబంధన మందసాన్ని మోస్తున్న యాజకులు తమ పాదాలు మోపి నిలిచిన చోటు కింద వాటిని నిలబెట్టాడు.[a] అవి నేటి వరకు అక్కడే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నిబంధన మందసాన్ని మోస్తున్న యాజకుల పాదాలు నిలిచిన స్థలం కింద.’ ఈ హీబ్రూ పదబంధం యాజకులు మందసాన్ని మోస్తూ నిలిచిన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: నిలబెట్టాడు
  rationale: హిఫీల్ రూపంలోని ఈ క్రియకు ఒక వస్తువును నిలపడం లేదా స్థాపించడం అనే భావం ఉంది. స్మారక రాళ్ల సందర్భంలో ‘నిలబెట్టాడు’ సహజంగాను స్పష్టంగాను ఉంది.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను నది మధ్యలో
  rationale: תּוֹךְ మధ్యభాగాన్ని లేదా అంతర్భాగాన్ని సూచిస్తుంది. ‘మధ్యలో’ మూలంలోని స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది; ‘నది’ అనే పదం తెలుగు పాఠకునికి స్థలాన్ని వెంటనే స్పష్టం చేస్తుంది.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: తమ పాదాలు మోపి నిలిచిన చోటనే
  rationale: మూలంలోని అత్యంత అక్షరార్థమైన ‘పాదాల నిలిచే స్థలం కింద’ అనే నిర్మాణం తెలుగులో అసహజంగా ఉంటుంది. ఈ ఎంపిక యాజకులు నిలిచిన ఖచ్చితమైన స్థలాన్ని తెలియజేస్తూ, תַּחַת యొక్క స్థానసూచక భావాన్ని ‘చోటనే’ ద్వారా నిలుపుతుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: నిబంధన మందసాన్ని మోస్తున్న
  rationale: నֹשְׂאֵי అనేది కొనసాగుతున్న కార్యాన్ని తెలిపే కృదంతం. ‘మోస్తున్న’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది. אֲרוֹן הַבְּרִיתకు ‘నిబంధన మందసం’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: וַיִּהְיוּ שָׁם
  choice: అవి ... అక్కడే ఉన్నాయి
  rationale: עַד הַיּוֹם הַזֶּהతో కలిసి ఈ రూపం కథకుని కాలం వరకు కొనసాగిన స్థితిని సూచిస్తుంది. ‘అక్కడే ఉన్నాయి’ ఆ కొనసాగింపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటి వరకు
  rationale: ఇది కథకుని కాలం వరకు కొనసాగిన పరిస్థితిని సూచించే హీబ్రూ నుడికారం. ‘నేటి వరకు’ దాని కాలసంబంధ భావాన్ని కాపాడుతుంది; ఇది ప్రస్తుత పాఠకుని కాలం వరకు అవి ఉన్నాయని చెప్పదు.
theological_decisions:
- issue: చుట్టుపక్కల వచనాల్లో గిల్గాలులో నిలబెట్టిన పన్నెండు రాళ్లకు, ఈ వచనంలో యొర్దానులో నిలబెట్టిన పన్నెండు రాళ్లకు మధ్య ఉన్న కథన ఉద్రిక్తత
  choice: యెహోషువ యొర్దాను నది మధ్యలోనే పన్నెండు రాళ్లను నిలబెట్టాడని మూలపాఠం చెప్పినట్లే అనువదించడం
  alternative: యొర్దాను నుండి తీసుకువచ్చి వేరే చోట నిలబెట్టిన రాళ్ల సారాంశంగా దీనిని భావించడం, లేదా రెండు స్మారకాలను ఒకటిగా సమన్వయపరచడం
  rationale: హీబ్రూ పాఠం రాళ్లను ‘యొర్దాను మధ్యలో’ నిలబెట్టాడని స్పష్టంగా చెబుతుంది. అనువాదం ఈ వాదనను సమన్వయం చేసి తొలగించకుండా, కథనంలోని ఉద్రిక్తతను అలాగే ఉంచాలి.
- issue: עַד הַיּוֹם הַזֶּה అనే స్మారక సూత్రవాక్యపు కాలబలం
  choice: కథకుని దృష్టికోణంలో కొనసాగుతున్న స్థితిగా ‘అవి నేటి వరకు అక్కడే ఉన్నాయి’ అని అనువదించడం
  alternative: ‘అవి నేటి వరకు అక్కడ ఉండేవి’ అని కేవలం భూతకాలంగా అనువదించడం
  rationale: ఈ ఎంపిక కథకుని కాలం వరకు ఉన్న కొనసాగింపును వ్యక్తం చేస్తుంది; అవి నేటి పాఠకుని కాలంలోనూ కనిపిస్తున్నాయని అనవసరంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యొర్దాను నది,’ ‘నిబంధన మందసం,’ ‘యాజకులు’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచబడ్డాయి. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి చదవడానికి సులభం చేశాం; భావక్రమం మరియు స్థలవివరాలు మాత్రం నిలుపబడ్డాయి.
