  text: וַ֠/יַּעַבְרוּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֨י שֵׁ֤בֶט הַֽ/מְנַשֶּׁה֙ חֲמֻשִׁ֔ים לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ם מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: te
  text: రూబేను కుమారులు[a], గాదు కుమారులు, మనష్షే అర్ధగోత్రం ఆయుధాలు ధరించి[c] ఇశ్రాయేలు కుమారులకు[b] ముందుగా దాటి వెళ్లారు, మోషే వారికి చెప్పినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రం.’ హీబ్రూలో అక్షరార్థంగా ‘రూబేను కుమారులు ... గాదు కుమారులు ...’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయులు.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయుధాలు ధరించి’ అని అనువదించిన హీబ్రూ పదం యుద్ధానికి సన్నద్ధంగా ఉండడాన్ని లేదా యుద్ధ పంక్తులుగా ఏర్పడి ఉండడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: యొర్దాను దాటారు
  rationale: עבר అనే క్రియ ఈ కథన సందర్భంలో యొర్దాను నదిని దాటడాన్ని సూచిస్తుంది. మూలంలో నది పేరు ఈ వాక్యంలో లేకపోయినా, తెలుగు వాక్యంలో సహజమైన స్పష్టత కోసం సందర్భసిద్ధమైన ‘యొర్దాను’ను చేర్చాం.
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: హీబ్రూ బంధుత్వ ప్రయోగమైన ‘రూబేను కుమారులు’ను పారదర్శకంగా నిలుపుతుంది; ‘రూబేనీయులు’ మరింత నుడికారమైన ప్రత్యామ్నాయం.
- source_word: וּבְנֵי גָד
  choice: గాదు కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ నిర్మాణాన్ని రూబేను ప్రయోగంతో సమాంతరంగా నిలుపుతుంది.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం
  rationale: గోత్రంలో సగభాగాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: חֲמֻשִׁים
  choice: ఆయుధాలు ధరించి
  rationale: ఈ సందర్భంలో యుద్ధానికి సన్నద్ధంగా, ఆయుధసజ్జులై ఉండడాన్ని సూచిస్తుంది. ‘యుద్ధ పంక్తులుగా ఏర్పడి’ అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: לִפְנֵי
  choice: ముందుగా
  rationale: మిగతా ఇశ్రాయేలీయులకు ముందుభాగంలో వారు దాటిన స్థానక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ మూలంలోని బంధుత్వ ప్రయోగాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’ నుడికార ప్రత్యామ్నాయం.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: మోషే వారికి చెప్పినట్లే వారు చేశారు
  rationale: వారు దాటిన విధానం మోషే ముందుగా చెప్పిన మాటకు అనుగుణమని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. ‘వారు చేశారు’ అనేది తెలుగులో వాక్యపూర్ణత కోసం సందర్భానుసారంగా చేర్చబడింది.
