id: JOS.4.23
reference: Joshua 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: te
  text: ఎందుకంటే, మీరు దాటి వెళ్లేవరకు మీ దేవుడైన యెహోవా మీ ఎదుట యొర్దాను జలాలను ఎండబెట్టాడు; మేము దాటి వెళ్లేవరకు మా ఎదుట రెల్లుల సముద్రాన్ని[a] ఎండబెట్టినట్లే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా “ఎర్ర సముద్రం” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: ఎండిపోయేలా చేశాడు
  rationale: יבש ధాతువు హిఫీల్ రూపం నీళ్లు తొలగిపోయి దాటడానికి వీలయ్యేలా దేవుడు వాటిని ఎండిపజేశాడనే కారణార్థక భావాన్ని ఇక్కడ వ్యక్తం చేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదబంధాన్ని ఉంచడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు / మీ దేవుడైన
  rationale: יהוהతో కలిసి ఏకవచనార్థంలో ఉన్న ఈ రూపం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘మీ దేవుడైన యెహోవా’ సహజంగా ఉంటుంది.
- source_word: מֵי הַיַּרְדֵּן
  choice: యొర్దాను నీళ్లు
  rationale: నది నీళ్లనే స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని స్పష్టమైన నీటి చిత్రణను నిలుపుతుంది.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: మీ ఎదుట / మా ఎదుట
  rationale: ముఖం లేదా సన్నిధి ఎదుట అనే హెబ్రీయ నుడికారంలోని స్థలార్థాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: మీరు దాటి వెళ్లేంతవరకు / మేము దాటి వెళ్లేంతవరకు
  rationale: దాటడం పూర్తయ్యే వరకు కొనసాగిన పరిస్థితిని తెలియజేస్తూ, రెండు సమాంతర భాగాల్లో עבר క్రియను ఒకే విధంగా అనువదిస్తుంది.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: అలాగే ... చేశాడు
  rationale: యొర్దాను సంఘటనకూ పూర్వ సముద్ర దాటుకూ మధ్య మూలంలో ఉన్న స్పష్టమైన పోలికను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יַם סוּף
  choice: రెల్లుల సముద్రం
  rationale: סוּף యొక్క ప్రత్యక్ష అర్థమైన ‘రెల్లు’ను అనుసరించి మూలభాషకు ప్రాధాన్యం ఇచ్చాం; సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించడం నామ స్వభావాన్ని కాపాడుతుంది.
- issue: יַם סוּף అనువాదం
  choice: రెల్లుల సముద్రం
  alternative: ఎర్ర సముద్రం
  rationale: హెబ్రీయ పదబంధం ప్రత్యక్షంగా ‘రెల్లుల సముద్రం’ అని సూచిస్తుంది. సంప్రదాయంగా ప్రసిద్ధమైన ‘ఎర్ర సముద్రం’ను పాఠకుల అవగాహన కోసం పాదటిప్పణిలో ఉంచాం.
- issue: మొదటి భాగంలోని ‘మీరు’ నుండి రెండో భాగంలోని ‘మేము’కు మార్పు
  choice: మూలంలోని వ్యక్తి మార్పును యథాతథంగా ఉంచడం
  alternative: రెండు చోట్లా ‘మీరు’ అని సమానీకరించడం
  rationale: మాట్లాడేవాడు తనను నిర్గమణ దాటుకతో అనుసంధానించుకునే మూలంలోని ‘మా ఎదుట/మేము’ అనే ఉద్దేశపూర్వక మార్పును పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర నిర్మాణం, ‘మీరు/మేము’ మార్పు, పునరుక్త క్రియలను నిలుపుకుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
