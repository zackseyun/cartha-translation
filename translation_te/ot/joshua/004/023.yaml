  to: ఎందుకంటే, మీరు దాటి వెళ్లేవరకు మీ దేవుడైన యెహోవా మీ ఎదుట యొర్దాను జలాలను ఎండబెట్టాడు; మేము దాటి వెళ్లేవరకు మా ఎదుట రెల్లుల సముద్రాన్ని[a] ఎండబెట్టినట్లే చేశాడు.
