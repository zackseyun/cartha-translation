lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో వాక్యక్రమం, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా అన్నాడు’ అనుకూలంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసి, సంబోధిత వ్యక్తిని తెలుగులో సహజంగా సూచించే విభక్తి ‘తో’.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే, తెలుగులో పరిచితమైన రూపాన్ని ఉపయోగించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ క్రియావిశేష రూపం తరువాతి వచనంలోని ప్రత్యక్ష మాటను పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా’ దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘అంటూ’ కూడా సాధ్యమే.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి వచనంలో కొనసాగే ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు ద్విబిందువు వాడబడింది.
