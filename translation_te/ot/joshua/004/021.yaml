reference: Joshua 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אֲשֶׁר֩ יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ אֶת אֲבוֹתָ֣/ם לֵ/אמֹ֔ר מָ֖ה הָ/אֲבָנִ֥ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: te
  text: 'అతడు ఇశ్రాయేలు కుమారులతో ఇలా అన్నాడు: “రాబోయే కాలంలో మీ కుమారులు[a] తమ తండ్రులను ఇలా అడిగినప్పుడు: ‘ఈ రాళ్లు ఏమిటి?’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “మీ కుమారులు.” సందర్భంలో ఈ మాట పిల్లలను లేదా తరువాతి సంతతిని సాధారణంగా సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'భావాన్ని మరింత స్పష్టంగా తెలిపితే: “ఈ రాళ్ల అర్థం ఏమిటి?” హీబ్రూలో అక్షరార్థంగా, “ఈ రాళ్లు ఏమిటి?” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ... అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు భూతకాల క్రియతో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే మూలంలోని కుటుంబసంబంధమైన, నిబంధనాత్మకమైన సంబోధనను నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: మొదటి לֵאמֹר ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇలా’ సహజంగా ఆ పని చేస్తుంది.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: అడిగినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచించే నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: בְּנֵיכֶם
  choice: మీ కుమారులు
  rationale: మూలంలోని పుంలింగ బహువచనమైన ‘మీ కుమారులు’ను ప్రధాన పాఠంలో పారదర్శకంగా నిలుపుతుంది; సందర్భంలో ఇది పిల్లలు లేదా సంతతిని విస్తృతంగా సూచించవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: מָחָר
  choice: రాబోయే కాలంలో
  rationale: ఇక్కడ ‘రేపు’ అనే అక్షరార్థం కంటే భావి కాలం లేదా తరువాతి తరాన్ని సూచించే నుడికారార్థం ఉద్దేశించబడింది.
- source_word: אֶת אֲבוֹתָם
  choice: తమ తండ్రులను
  rationale: పిల్లలు తమ తండ్రులను అడిగే కుటుంబ దృశ్యాన్ని, మూలంలోని ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: అని
  rationale: రెండవ మాటల పరిచాయకాన్ని తెలుగులో ఉద్ధరించిన ప్రశ్న తరువాత వచ్చే సహజమైన ‘అని’తో వ్యక్తపరుస్తుంది.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: ఈ రాళ్లు ఏమిటి?
  rationale: మూలంలోని గుర్తింపును అడిగే ప్రశ్నను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: స్మారక రాళ్ల ప్రశ్న యొక్క భావం
  choice: ‘ఈ రాళ్లు ఏమిటి?’ అనే అక్షరసన్నిహిత ప్రశ్న
  alternative: ‘ఈ రాళ్ల అర్థం ఏమిటి?’ లేదా ‘ఈ రాళ్లు దేనికి?’
  rationale: సందర్భం వాటి ప్రాముఖ్యతను అడగడమేనని సూచించినా, హీబ్రూ వాక్యం ఆ భావాన్ని స్పష్టంగా చేర్చదు; అందువల్ల ప్రధాన పాఠంలో ఉన్న నిజమైన సంక్షిప్తతను నిలిపి, భావవ్యాఖ్యను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలి వాడబడింది. ‘ఇశ్రాయేలు కుమారులు,’ ‘మీ కుమారులు,’ ‘తమ తండ్రులు’ అనే కుటుంబసంబంధ పదజాలం మూలానికి పారదర్శకతను కాపాడుతుంది. מָחָר యొక్క భావికాల నుడికారాన్ని ప్రధాన పాఠంలో సహజంగా ‘రాబోయే కాలంలో’ అని అందించినందున దానికి ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
