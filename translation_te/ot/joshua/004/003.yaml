  naturalness: The main Telugu text is clear, modern, and suitably formal. The em-dash construction reads naturally enough for the nested locational phrases. Footnote a, however, contains an awkward and misleading passive expression ('స్థిరపరచబడిన నిలిచే స్థలం').
  terminology: ‘యొర్దాను,’ ‘యాజకులు,’ ‘రాళ్లు,’ and ‘బసచేసే చోట’ are appropriate modern-standard Telugu choices. ‘బసచేసే చోట’ correctly avoids implying a permanent settlement.
