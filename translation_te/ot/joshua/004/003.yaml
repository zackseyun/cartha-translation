source:
  edition: WLC
  text: וְ/צַוּ֣וּ אוֹתָ/ם֮ לֵ/אמֹר֒ שְׂאֽוּ לָ/כֶ֨ם מִ/זֶּ֜ה מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן מִ/מַּצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים הָכִ֖ין שְׁתֵּים עֶשְׂרֵ֣ה אֲבָנִ֑ים וְ/הַעֲבַרְתֶּ֤ם אוֹתָ/ם֙ עִמָּ/כֶ֔ם וְ/הִנַּחְתֶּ֣ם אוֹתָ֔/ם בַּ/מָּל֕וֹן אֲשֶׁר תָּלִ֥ינוּ ב֖/וֹ הַ/לָּֽיְלָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: te
  text: 'వారికి ఇలా ఆజ్ఞాపించండి: “ఇక్కడి నుంచి—యొర్దాను మధ్యలో యాజకుల పాదాలు స్థిరంగా నిలిచిన చోటు నుంచి[a]—మీ కోసం పన్నెండు రాళ్లను ఎత్తుకోండి. వాటిని మీతోపాటు అవతలికి తీసుకెళ్లి, ఈ రాత్రి మీరు బసచేసే చోట[b] ఉంచండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యాజకుల పాదాల నిలిచిన స్థలం నుంచి, దృఢంగా స్థిరమైనది.”
    reason: lexical_alternative
  - marker: b
    text: “బసచేసే చోట” అంటే యొర్దాను దాటిన తర్వాత ఇశ్రాయేలీయులు ఆ రాత్రి ఉండే ప్రదేశం; అది శాశ్వత నివాసాన్ని తప్పనిసరిగా సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: ఆజ్ఞాపించండి
  rationale: పియేల్ ఆజ్ఞార్థక రూపంలోని బలాన్ని నిలుపుతుంది; ‘చెప్పండి’ లేదా ‘సూచించండి’ కంటే ప్రత్యక్ష ఆదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׂאוּ לָכֶם
  choice: మీ కోసం ... ఎత్తుకోండి
  rationale: రాళ్లను నదిగర్భం నుంచి పైకి ఎత్తే చర్యను, అలాగే לָכֶם సూచించే వారి ప్రత్యక్ష భాగస్వామ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వ్యక్తిగత సొంతం అనే భావాన్ని మోపదు.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: ఇక్కడి నుంచి—యొర్దాను మధ్యలో ... నుంచి
  rationale: హీబ్రూలోని ద్విగుణ స్థాన నిర్దేశాన్ని నిలుపుతూ, రాళ్లు యొర్దాను లోపలి నిర్దిష్ట స్థలం నుంచే తీసుకోవాలని స్పష్టం చేస్తుంది.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: యాజకుల పాదాలు స్థిరంగా నిలిచిన చోటు నుంచి
  rationale: מַצָּב సూచించే నిలిచిన స్థలాన్ని, הָכִין సూచించే దృఢత్వాన్ని సహజమైన తెలుగులో కలిపి అందిస్తుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: పన్నెండు రాళ్లు
  rationale: మూలంలోని సంఖ్య, నామవాచకాన్ని నేరుగా మరియు స్పష్టంగా అనువదిస్తుంది.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: వాటిని మీతోపాటు అవతలికి తీసుకెళ్లి
  rationale: עבר హిఫీల్ రూపంలోని దాటించడం లేదా అవతలికి తీసుకెళ్లడం అనే భావాన్ని, עִמָּכֶם లోని సహగమనాన్ని నిలుపుతుంది.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: ఉంచండి
  rationale: నదిలో నుంచి తీసిన రాళ్లను బస చేసే చోట పెట్టే స్పష్టమైన చర్యను సరళంగా తెలియజేస్తుంది.
- source_word: בַּמָּלוֹן אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: ఈ రాత్రి మీరు బసచేసే చోట
  rationale: מָלוֹן ను శాశ్వత నివాసంగా కాక రాత్రి బస చేసే ప్రదేశంగా గ్రహించి, తరువాతి సంబంధ వాక్యంతో సహజంగా కలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని స్థల నిర్దేశ క్రమాన్ని డాష్‌లతో చదవడానికి సహజంగా ఉంచాం. ‘యొర్దాను,’ ‘యాజకులు,’ ‘బసచేయడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
