  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: te
  text: భూమి[a] మీద ఉన్న ప్రజలందరూ యెహోవా హస్తం బలమైనదని తెలుసుకొనునట్లును, మీరు మీ దేవుడైన యెహోవాకు మీ జీవితకాలమంతా భయపడునట్లును.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలోని ప్రజలందరూ’; הָאָרֶץ అనే పదాన్ని ఇక్కడ విశ్వవ్యాప్తంగా కాక స్థానికంగా తీసుకుంటే ఈ అర్థం సాధ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: తెలుసుకోవడానికి
  rationale: లְמַעַן‌తో కూడిన infinitive construct ఉద్దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెలుసుకోవడానికి’ సహజంగా ఆ ప్రయోజన భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: భూమిమీద ఉన్న ప్రజలందరూ
  rationale: עַמֵּי అనే బహువచనాన్ని ‘ప్రజలు’గా, הָאָרֶץ‌ను ఈ సందర్భంలో విశ్వవ్యాప్త భావంతో ‘భూమి’గా అనువదిస్తుంది; స్థానిక ‘దేశం’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: יַד יְהוָה
  choice: యెహోవా హస్తం
  rationale: దేవుని శక్తిని సూచించే హెబ్రీయ మానవరూపకాన్ని ‘శక్తి’గా విప్పి చెప్పకుండా నిలుపుతుంది; ‘హస్తం’ గౌరవప్రదమైన, పరిచితమైన బైబిలు తెలుగు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపంలో సూచిస్తుంది.
- source_word: כִּי חֲזָקָה הִיא
  choice: బలమైనదని
  rationale: స్త్రీలింగ సర్వనామం ‘హస్తం’ను తిరిగి సూచిస్తుంది; חֲזָקָה యొక్క ప్రత్యక్ష భావాన్ని ‘బలమైనది’ కాపాడుతుంది.
- source_word: לְמַעַן יְרָאתֶם
  choice: భయపడడానికి
  rationale: రెండవ ఉద్దేశ వాక్యాన్ని నిలుపుతూ ירא యొక్క ‘భయపడు’ అనే ప్రత్యక్ష, ధార్మికంగా బరువైన భావాన్ని మృదువుపరచకుండా ఉంచుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యెహోవాను సూచించే ఒడంబడిక సందర్భంలో రూపపరంగా బహువచనమైన אֱלֹהִים ఏకవచన ‘దేవుడు’ అనే బిరుదుగా పనిచేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: మీ జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘దినాలన్నీ’; సందర్భంలో జీవితాంతం కొనసాగే భక్తిని సూచించే సహజ తెలుగు ప్రయోగం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా ఉంచుతుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘యెహోవా’ విస్తృతంగా గుర్తించదగిన రూపం.
- issue: ירא అనే క్రియలోని భావం
  choice: భయపడు
  alternative: భక్తిభయంతో మెలుగు; గౌరవించు
  rationale: ఈ పదంలో భయం, విస్మయం, భక్తిపూర్వక గౌరవం కలిసివుండగలవు. ప్రధాన పాఠంలో ప్రత్యక్ష పదాన్ని నిలిపి, దాని విస్తృత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- issue: దేవుని ‘హస్తం’ అనే రూపకం
  choice: హస్తం
  alternative: శక్తి
  rationale: దైవ కార్యసామర్థ్యాన్ని సూచించే మూలభాషా రూపకాన్ని వ్యాఖ్యాత్మకంగా ‘శక్తి’గా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘హస్తం’ మూలంలోని బైబిలు రూపకాన్ని నిలుపుతుంది. హెబ్రీ వాక్యం ముందరి కార్యాలను ఉద్దేశిస్తూ ప్రారంభమవుతున్నందున తెలుగులో సంపూర్ణత కోసం ‘ఆయన ఇలా చేశాడు’ చేర్చబడింది; ఇది కొత్త సంఘటనను జోడించదు, 4:23–24 సందర్భ సంబంధాన్ని స్పష్టం చేస్తుంది. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
