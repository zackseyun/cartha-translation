  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: te
  text: యుద్ధానికి సాయుధులైన దాదాపు నలభై వేలమంది యెహోవా సన్నిధిలో యుద్ధం కోసం యెరికో మైదానాలకు దాటి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: దాదాపు నలభై వేలమంది
  rationale: సంఖ్యకు ముందున్న כְּ సుమారు అనే భావాన్ని ఇస్తుంది; ‘దాదాపు’ ఆ అంచనా భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: యుద్ధానికి సన్నద్ధమైన
  rationale: ఈ పదబంధం ఆయుధాలు ధరించి పోరాటానికి సిద్ధమైనవారిని సూచిస్తుంది; ‘ముందరి దళం’ అని సందర్భానికి మించిన నిర్దిష్టతను చేర్చకుండా సైనిక సిద్ధతను తెలియజేస్తుంది.
- source_word: עָבְרוּ
  choice: దాటి వెళ్లారు
  rationale: యెహోషువ 3–4 అధ్యాయాల్లో యొర్దాను దాటడాన్ని సూచించే עבר క్రియతో ఉన్న కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’; ఇక్కడ దేవుని సమక్షంలో దాటివెళ్లారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా పేరుగానే ప్రతిలిపి చేస్తుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: לְ ఉపసర్గ తెలిపే ఉద్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ముందున్న సైనిక సిద్ధతతో ఉన్న పునరుక్తి మూలంలోనూ ఉంది కాబట్టి దానిని తొలగించలేదు.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: యెరికో మైదానాలకు
  rationale: עַרְבוֹת యొర్దాను లోయలోని మైదాన ప్రాంతాన్ని సూచిస్తుంది; ‘మైదానాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ‘స్టెప్పులు’ వంటి సాంకేతిక పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా పేరుగానే ఉంచి, విస్తృతంగా పరిచయమైన తెలుగు రూపమైన ‘యెహోవా’ను వాడాం.
- issue: לִפְנֵי יְהוָה లోని సంబంధ భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ముందు
  rationale: ‘సన్నిధిలో’ దేవుని సమక్షం అనే మూలార్థాన్ని నిలుపుతుంది; దేవుడే భౌగోళికంగా వారి ముందుగా నడిచాడని అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని సైనిక సిద్ధత–యుద్ధ ఉద్దేశం పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ఈ ముసాయిదాలో పాదటిప్పణులు లేవు; అందువల్ల ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు అవసరం లేదు.
