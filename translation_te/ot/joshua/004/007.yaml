source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: te
  text: 'అప్పుడు మీరు వారితో ఇలా చెప్పాలి: “యాహ్వే నిబంధన మందసం ఎదుట యొర్దాను జలాలు నిలిచిపోయాయి. అది యొర్దానును దాటుతున్నప్పుడు యొర్దాను జలాలు నిలిచిపోయాయి.” ఈ రాళ్లు ఇశ్రాయేలు కుమారులకు[a] శాశ్వత జ్ఞాపకచిహ్నంగా ఉంటాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు సంతానానికి,” లేదా “ఇశ్రాయేలీయులకు.” హీబ్రూ పాఠంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: నిలిచిపోయాయి
  rationale: నిఫాల్ రూపం ఇక్కడ నది జలాలు ఆపబడడాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘తెగిపోయాయి’ కంటే ‘నిలిచిపోయాయి’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని రెండుసార్లూ అలాగే ఉంచాం.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: యొర్దాను జలాలు
  rationale: హీబ్రూ బహువచన నిర్మాణాన్ని గౌరవిస్తూ, నది ప్రవాహాన్ని సూచించే సహజమైన, గంభీరమైన తెలుగు పదబంధాన్ని ఎంచుకున్నాం.
- source_word: מִפְּנֵי
  choice: ఎదుట
  rationale: మందసం సన్నిధిలో లేదా దాని ముందర జరిగిన కార్యాన్ని సూచించే స్థలార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: పవిత్ర మందసానికి సంబంధించిన పూర్తి ఒడంబడిక పేరును సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: בְּעָבְרוֹ
  choice: అది యొర్దానును దాటుతున్నప్పుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం మందసాన్నే సూచిస్తుంది. ‘అది’ ఆ సూచనను నిలుపుతుంది; కాలసంబంధ నిర్మాణం దాటే సమయంలో జరిగినదని తెలియజేస్తుంది.
- source_word: וְהָיוּ
  choice: ఉంటాయి
  rationale: సూచనలోని భవిష్యత్/ఫలిత భావాన్ని సహజమైన తెలుగు భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: ఈ రాళ్లు
  rationale: నిర్దేశక పదబంధానికి నేరుగా, సహజంగా సరిపోయే అనువాదం.
- source_word: לְזִכָּרוֹן
  choice: జ్ఞాపకచిహ్నంగా
  rationale: కేవలం మానసిక జ్ఞాపకాన్ని కాక, తరతరాలకు నిలిచే స్మారక వస్తువును సూచిస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని లింగసూచనతో సహా నిలుపుతుంది; అర్థపరంగా ‘ఇశ్రాయేలీయులు’ అనే సమూహపేరూ సాధ్యమే.
- source_word: עַד עוֹלָם
  choice: శాశ్వత
  rationale: నిరంతరమైన, తరతరాలపాటు కొనసాగే జ్ఞాపకార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
- issue: לִבְנֵי יִשְׂרָאֵל యొక్క లింగసూచక రూపం
  choice: ఇశ్రాయేలు కుమారులకు
  alternative: ఇశ్రాయేలు సంతానానికి; ఇశ్రాయేలీయులకు
  rationale: మూలంలోని ‘కుమారులు’ అనే స్పష్టమైన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సమూహార్థక సహజ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- issue: నిబంధన మందసం దాటడాన్ని సూచించే ఏకవచన సర్వనామం
  choice: అది
  alternative: మందసం
  rationale: వ్యాకరణపరంగా పురుష ఏకవచన ప్రత్యయం మందసాన్ని సూచిస్తుంది. తెలుగు భాషలో జడవస్తువుకు ‘అది’ సహజం; వ్యక్తిని సూచిస్తున్నట్టు అనవసరంగా భావించకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతతో పాటు గంభీరతను నిలిపాం. ‘మందసం,’ ‘జలాలు,’ ‘జ్ఞాపకచిహ్నం’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గౌరవభావాన్ని ఇస్తాయి; వాక్యనిర్మాణం మాత్రం ప్రస్తుత తెలుగు వాడుకకు అనుగుణంగా ఉంది. మూలంలోని ‘యొర్దాను జలాలు నిలిచిపోయాయి’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
