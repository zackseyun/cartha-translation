source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు యెహోషువ ఆజ్ఞాపించినట్లే చేశారు. యాహ్వే యెహోషువతో చెప్పిన ప్రకారం, ఇశ్రాయేలు కుమారుల గోత్రాల సంఖ్యకు అనుగుణంగా వారు యొర్దాను మధ్యనుండి పన్నెండు రాళ్లను తీసుకున్నారు. వాటిని తమతో పాటు దాటి బసచేసే స్థలానికి[a] తీసుకువెళ్లి అక్కడ ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిబిరానికి”; హీబ్రూ పదం ప్రత్యేకంగా రాత్రి బసచేసే స్థలం లేదా తాత్కాలిక మకాంను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ సంబంధ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; సాధారణంగా వాడే ‘ఇశ్రాయేలీయులు’ కంటే హీబ్రూ వ్యక్తీకరణకు సన్నిహితం.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ఆజ్ఞకు అనుగుణంగా చేసినట్లు సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: అధికారపూర్వకమైన ఆదేశం అనే క్రియార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׂאוּ
  choice: తీసుకొని
  rationale: రాళ్లను ఎత్తి మోసుకెళ్లడాన్ని సందర్భానుగుణంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను నది మధ్యలో నుండి
  rationale: תּוֹךְ యొక్క ప్రాదేశిక భావాన్ని కాపాడుతూ, తెలుగులో నది అని స్పష్టీకరించడం సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే పేరురూపంలో ఇస్తుంది.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాల సంఖ్యను బట్టి
  rationale: పన్నెండు రాళ్లు గోత్రాల సంఖ్యకు సరిపోలినవనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: వాటిని తమతో పాటు ... అవతలికి తీసుకెళ్లి
  rationale: עבר యొక్క దాటించడం/అవతలికి చేర్చడం అనే భావాన్నీ, עִמָּם యొక్క సహవాహక భావాన్నీ నిలుపుతుంది.
- source_word: הַמָּלוֹן
  choice: బసచేసే చోటు
  rationale: రాత్రి బస లేదా తాత్కాలిక మకాం అనే సందర్భార్థాన్ని ఆధునిక పాఠకుడికి సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ప్రత్యేక దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగా నిలిపి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; అసలు ఉచ్చారణను సూచించే ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబ సంబంధ పదబంధాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
