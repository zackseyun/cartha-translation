language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: te
  text: 'యెహోషువ వారితో ఇలా అన్నాడు: “మీ దేవుడైన యెహోవా మందసం ఎదుటగా యొర్దాను నది మధ్యలోకి దాటి వెళ్లండి. ఇశ్రాయేలు కుమారుల[a] గోత్రాల సంఖ్యకు అనుగుణంగా, మీలో ప్రతి పురుషుడు ఒక్క రాయిని తన భుజం మీద ఎత్తుకోవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇది ఇశ్రాయేలు ప్రజలను సూచించే సంప్రదాయ సమూహపేరు; దీనిని ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: עִבְרוּ לִפְנֵי
  choice: ముందుగా ... వెళ్లండి
  rationale: మందసానికి సాపేక్షంగా ముందుకు వెళ్లే ప్రాదేశిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా మందసం
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా తెలియజేస్తూ, దేవుని వ్యక్తిగత నామమైన יְהוָהను ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: యొర్దాను మధ్యలోకి
  rationale: תּוֹךְలోని లోపలి భాగం లేదా మధ్య అనే భావాన్ని కేవలం నదిలోకి ప్రవేశించడం అనే అర్థానికి కుదించదు.
- source_word: וְהָרִימוּ לָכֶם אִישׁ
  choice: మీలో ప్రతి పురుషుడూ ... ఎత్తుకోవాలి
  rationale: ఆజ్ఞ యొక్క పంపిణీ భావాన్ని, అలాగే సందర్భంలోని పురుష ప్రతినిధులను సూచించే אִישׁ యొక్క లింగసూచనను నిలుపుతుంది.
- source_word: אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: ఒక్కో రాయిని తన భుజం మీద
  rationale: ఒక్కొక్క వ్యక్తికి ఒక రాయి అనే పంపిణీ భావాన్ని, ఏకవచన సర్వనామ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గోత్రాల సంఖ్య ప్రకారం
  rationale: రాళ్ల సంఖ్య గోత్రాల సంఖ్యకు సరిపోవాలనే భావంతో పాటు ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషలోని సంపూర్ణ సమూహపేరును నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించబడింది.
- issue: אִישׁ మరియు בְנֵי יִשְׂרָאֵלలోని లింగసూచక భాష
  choice: ప్రతి పురుషుడూ ... ఇశ్రాయేలు కుమారులు
  alternative: ప్రతి ఒక్కరూ ... ఇశ్రాయేలీయులు
  rationale: తక్షణ సందర్భంలోని గోత్రాల పురుష ప్రతినిధులను, అలాగే మూలంలోని సంప్రదాయ సమూహపేరును అనవసరంగా లింగతటస్థం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి ఉపయోగించబడింది. ‘మందసం’ వంటి బైబిలు సందర్భానికి సుపరిచితమైన పదాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
