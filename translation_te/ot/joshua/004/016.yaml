source:
  edition: WLC
  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: te
  text: “సాక్ష్య మందసాన్ని[a] మోసే యాజకులు యొర్దాను నదిలోనుండి పైకి రావాలని ఆజ్ఞాపించు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సాక్షి మందసం.” హెబ్రీ పాఠంలో ఇక్కడ సాధారణంగా కనిపించే “నిబంధన” అనే పదం కాకుండా “సాక్ష్యం” అనే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: ఆజ్ఞాపించు
  rationale: రెండవ పురుష ఏకవచన ఆజ్ఞార్థక రూపంలోని ప్రత్యక్షమైన బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట యాజకులను సూచించే ప్రామాణిక తెలుగు పదం; వాక్య నిర్మాణంలో నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: נֹשְׂאֵי
  choice: మోసే
  rationale: యాజకులను విశేషించే కొనసాగుతున్న కార్యాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: אֲרוֹן הָעֵדוּת
  choice: సాక్ష్య మందసం
  rationale: మూలంలోని עֵדוּת అనే ‘సాక్ష్యం/సాక్షి’ భావాన్ని నిలుపుతూ, ఇతర చోట్ల సాధారణంగా కనిపించే ‘నిబంధన మందసం’ అనే పదబంధంతో సమన్వయపరచకుండా అనువదిస్తుంది.
- source_word: וְיַעֲלוּ
  choice: పైకి రావాలని
  rationale: నదిలోనుండి ఒడ్డుకు ఎక్కి రావడాన్ని సందర్భానుగుణంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִן הַיַּרְדֵּן
  choice: యొర్దాను నదిలోనుండి
  rationale: מן సూచించే బయలుదేరే కదలికను స్పష్టం చేస్తుంది; తెలుగు పాఠకులకు యొర్దాను ఒక నది అని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మందసం పేరులో ‘సాక్ష్యం’ మరియు ‘నిబంధన’ మధ్య భేదం
  choice: సాక్ష్య మందసం
  alternative: నిబంధన మందసం
  rationale: ఈ వచనంలోని హెబ్రీ పాఠం עֵדוּת (‘సాక్ష్యం’) అని ఉంది; పరిచితమైన వేరొక పదబంధానికి మార్చకుండా మూలపాఠంలోని ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞా శైలిని ఉపయోగించాం. ‘యొర్దాను’తో పాటు ‘నది’ని చేర్చడం తెలుగులో స్పష్టతను పెంచుతుంది.
