  terminology: “యెహోవా” is an established Telugu form of the divine name and preserves the fact that the Hebrew uses a personal name rather than a title. “మందసం” and “యాజకులు” are suitable established biblical terms. The revised wording preserves the source’s ambiguity in the footnote without adding interpretive content.
