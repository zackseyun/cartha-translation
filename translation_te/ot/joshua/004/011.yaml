source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: te
  text: ప్రజలందరూ దాటి వెళ్లడం ముగించినప్పుడు, యెహోవా మందసమూ యాజకులూ ప్రజల ముందుగా దాటి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజల సమక్షంలో.’ హెబ్రీ పదబంధం ముందున్న స్థానాన్ని లేదా ఎవరి సమక్షంలో ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: … ముగించినప్పుడు
  rationale: వాక్యారంభంలోని וַיְהִי కథనాన్ని ముందుకు నడిపే సంధిగా పనిచేస్తుంది; దాన్ని తెలుగులో విడిగా అనువదించడం కృత్రిమంగా ఉంటుంది. כַּאֲשֶׁר కాలసంబంధాన్ని సూచిస్తున్నందున ‘అప్పుడు’ భావంతో సహజంగా కలిపాం.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: ప్రజలందరూ దాటి వెళ్లడం ముగించినప్పుడు
  rationale: תמם క్రియ పూర్తి కావడాన్ని సూచిస్తుంది. ‘ప్రజలందరూ’ כָּל యొక్క సంపూర్ణతను నిలుపుతుంది; עבר యొక్క దాటే భావాన్ని ‘దాటి వెళ్లడం’గా ఇచ్చాం.
- source_word: וַיַּעֲבֹר
  choice: దాటి వెళ్లారు
  rationale: ముందటి לַעֲבוֹרతో ఒకే עבר మూలపదం ఉన్నందున పదసామ్యాన్ని నిలిపాం. మందసం, యాజకులు అనే సముచ్చయ కర్తకు తెలుగు బహువచన క్రియ సహజం.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: నిబంధనకు సంబంధించిన పవిత్ర పెట్టెను సూచించే אֲרוֹןకు తెలుగు బైబిలు వాడుకలో గౌరవప్రదమైన ‘మందసం’ను ఎంచుకున్నాం; నిర్మాణ సంబంధాన్ని ‘యెహోవా మందసం’గా ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהַכֹּהֲנִים
  choice: యాజకులు
  rationale: וְ సముచ్చయం మందసాన్ని, యాజకులను కలిసి దాటిన కర్తలుగా అనుసంధానిస్తుంది. తెలుగులో కామాతో సమన్వయం సహజంగా వ్యక్తమవుతుంది.
- source_word: לִפְנֵי הָעָם
  choice: ప్రజల ముందుగా
  rationale: לִפְנֵי ప్రధానంగా ముందున్న స్థానం లేదా ప్రజల సమక్షం అనే రెండింటినీ సూచించగలదు. సందర్భానుసారంగా స్థలార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరో సాధ్యార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే నిలిపి, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని వాడాం.
- issue: לִפְנֵי הָעָם యొక్క సంబంధార్థం
  choice: ప్రజల ముందుగా
  alternative: ప్రజల సమక్షంలో
  rationale: కథన సందర్భం స్థలపరమైన ‘ముందుగా’ అనే అర్థాన్ని సమర్థిస్తుంది; అయినా హెబ్రీ పదబంధంలోని సమక్షార్థాన్ని తొలగించకుండా పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. עבר మూలపదం పునరావృతిని ‘దాటి వెళ్లడం/దాటి వెళ్లారు’తో నిలిపాం; అసలు పాఠ్యంలోని לִפְנֵי అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
