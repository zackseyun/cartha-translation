reference: Leviticus 27:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: te
  text: యాహ్వేకు అర్పణగా సమర్పించదగిన జంతువు అయితే,[a] దానిలోనుండి యాహ్వేకు ఇచ్చేదంతా పరిశుద్ధమైనదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిలోనుండి యాహ్వేకు అర్పణను సమర్పించే జంతువు అయితే.” హీబ్రూ మాటలను అర్పణగా సమర్పించదగిన జంతువును సూచిస్తున్నట్లుగానీ, దానిలోనుండి అర్పణ వాస్తవంగా సమర్పించబడుతున్నట్లుగానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: న్యాయవిధుల వరుసలో షరతును పరిచయం చేస్తుంది; తెలుగులో సహజంగా వాక్యాంత షరతు నిర్మాణంతో అనువదించబడింది.
- source_word: בְּהֵמָה
  choice: జంతువు
  rationale: బలి సందర్భంలోని సాధారణ జంతు వర్గాన్ని సూచించే విస్తృతమైన, ఆధునిక పదం.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן לַיהוָה
  choice: యెహోవాకు అర్పణగా సమర్పించే జంతువు
  rationale: יַקְרִיבוּ యొక్క బలిసంబంధమైన ‘దగ్గరకు తేవడం/సమర్పించడం’ భావాన్ని నిలుపుతూ, מִמֶּנָּה వల్ల కలిగే నిజమైన నిర్మాణాత్మక సందిగ్ధతను పాదటిప్పణిలో చూపిస్తుంది.
- source_word: קָרְבָּן
  choice: అర్పణ
  rationale: ఆరాధనలో దేవునికి సమర్పించే కానుక లేదా బలిని సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను వ్యక్తిగత నామంగా లిప్యంతరీకరించి, దిశార్థక לַను ‘కు’తో తెలిపింది.
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: దానిలోనుండి యెహోవాకు ఇచ్చేదంతా
  rationale: ఏకవచన జంతువును సూచించే מִמֶּנּוּను ‘దానిలోనుండి’గా, సాధారణ కర్తగల יִתֵּןను తెలుగులో సహజమైన ‘ఇచ్చేది’ నిర్మాణంగా అందించింది.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: పవిత్రంగా ఉండాలి
  rationale: అది దేవునికి ప్రత్యేకింపబడిన స్థితిని సూచిస్తుంది; న్యాయవిధి సందర్భంలో ‘ఉండాలి’ భవిష్యత్ నిర్దేశక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలిపింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించింది.
- issue: జంతువు అర్పణకు తగినదా, లేక దానిలోనుండే అర్పణ వాస్తవంగా సమర్పించబడుతుందా
  choice: ప్రధాన పాఠంలో ‘అర్పణగా సమర్పించే జంతువు’
  alternative: ‘దానిలోనుండి యెహోవాకు అర్పణను సమర్పించే జంతువు’
  rationale: హీబ్రూ సంబంధవాక్యం రెండు విధాలుగా గ్రహించవచ్చు. ప్రధాన పాఠం సహజమైన వర్గార్థాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి సందిగ్ధతను సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘అర్పణ’, ‘పవిత్రం’ వంటి స్థిరమైన ఆరాధనా పదజాలం వాడబడింది; హీబ్రూ నిర్మాణంలోని సందిగ్ధత పాదటిప్పణిలో నిలుపబడింది.
