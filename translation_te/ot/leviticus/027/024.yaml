revisions:
- from: యూబిలీ సంవత్సరంలో ఆ పొలం, అది ఎవరి దగ్గర కొనబడిందో అతనికి, అంటే ఆ భూమి స్వాస్థ్యంగా ఎవరికి చెందుతుందో అతనికి, తిరిగి చేరాలి.[a]
  to: యూబిలీ సంవత్సరంలో ఆ పొలం, దానిని ఎవరి నుండి కొనుగోలు చేశారో ఆ వ్యక్తికి, అంటే భూస్వాస్థ్యం ఎవరిదో ఆ వ్యక్తికి, తిరిగి చేరాలి.[a]
  rationale: The revision retains the passive formulation, which avoids supplying an explicit purchaser as the subject, while replacing an awkward possession construction with “భూస్వాస్థ్యం,” a direct modern Telugu legal-landholding expression. The footnote preserves the contextual hereditary alternative but removes the unsupported lexical assertion that the holding itself is “permanent.”
