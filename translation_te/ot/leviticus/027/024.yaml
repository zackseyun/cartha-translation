source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת הַ/יּוֹבֵל֙ יָשׁ֣וּב הַ/שָּׂדֶ֔ה לַ/אֲשֶׁ֥ר קָנָ֖/הוּ מֵ/אִתּ֑/וֹ לַ/אֲשֶׁר ל֖/וֹ אֲחֻזַּ֥ת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: te
  text: యూబిలీ సంవత్సరంలో ఆ పొలం, దానిని ఎవరి నుండి కొనుగోలు చేశారో ఆ వ్యక్తికి, అంటే భూస్వాస్థ్యం ఎవరిదో ఆ వ్యక్తికి, తిరిగి చేరాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిలో ఎవరి వంశపారంపర్య స్వాస్థ్యమో వారికి.” ఇక్కడి హీబ్రూ పదం భూస్వాస్థ్యాన్ని లేదా భూమిలోని స్వాస్థ్యభాగాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది మొదట ఒక కుటుంబానికి కేటాయించబడిన భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: యూబిలీ సంవత్సరంలో
  rationale: యూబిలీ ధర్మశాస్త్రంలోని నిర్దిష్ట సంవత్సరాన్ని సూచించే יוֹבֵל పదాన్ని ఆధునిక తెలుగులో గుర్తించదగిన పేరుతో అందిస్తుంది.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: ఆ పొలం ... తిరిగి చేరాలి
  rationale: שׂדהకు సహజమైన ‘పొలం’ అనే అర్థాన్ని ఉంచి, న్యాయనియమ సందర్భంలోని imperfect క్రియకు విధిగా జరిగే ఫలితాన్ని ‘చేరాలి’తో వ్యక్తం చేసింది.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: అది ఎవరి దగ్గర కొనబడిందో అతనికి
  rationale: హీబ్రూ సర్వనామ సంబంధం తెలుగులో సందిగ్ధమైన కర్తను చేర్చకుండా, కొనుగోలు జరిగిన పూర్వ యజమానిని సహజమైన కర్మణి నిర్మాణంతో గుర్తిస్తుంది.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: ఆ భూమి స్వాస్థ్యంగా ఎవరికి చెందుతుందో అతనికి
  rationale: אֲחֻזָּה సూచించే స్థిర భూస్వాధీనాన్ని ‘స్వాస్థ్యం’తో అందించి, వంశపారంపర్యతను ప్రధాన పాఠ్యంలో అవసరానికి మించి స్పష్టీకరించదు.
theological_decisions:
- issue: యూబిలీ సందర్భంలో אֲחֻזַּת הָאָרֶץ స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆ భూమి స్వాస్థ్యంగా ఎవరికి చెందుతుందో’
  alternative: ‘ఆ భూమి ఎవరి వంశపారంపర్య స్వాస్థ్యమో’
  rationale: విస్తృత సందర్భంలో ఇది మొదటి కుటుంబ కేటాయింపును సూచించినా, ఈ వాక్యంలోని నామవాచకం నేరుగా ‘స్వాస్థ్యం/భూస్వాధీనం’ అని చెబుతుంది. కాబట్టి వంశపారంపర్య భావాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని పదార్థ పరిమితిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయనియమ శైలి వాడబడింది. ‘యూబిలీ’ అనే సందర్భనిర్దిష్ట పదాన్ని నిలిపి, వాక్యంలోని పునర్వ్యాఖ్యాన నిర్మాణాన్ని ‘అంటే’తో స్పష్టంగా చూపించింది.
