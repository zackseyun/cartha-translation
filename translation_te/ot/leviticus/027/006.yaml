id: LEV.27.6
reference: Leviticus 27:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: te
  text: ఒక నెల వయసు నుండి ఐదు సంవత్సరాల వయసు వరకు ఉన్నవారికి, మగవానికి నీ మదింపు ఐదు వెండి షెకెలులు, ఆడదానికి నీ మదింపు మూడు వెండి షెకెలులు ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן־חֹדֶשׁ
  choice: ఒక నెల వయసు నుండి
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, కనిష్ఠ వయోపరిమితిని స్పష్టంగా ఉంచుతుంది.
- source_word: וְעַד בֶּן־חָמֵשׁ שָׁנִים
  choice: ఐదు సంవత్సరాల వయసు వరకు
  rationale: వయోపరిమితి యొక్క న్యాయపరమైన ఖచ్చితత్వాన్ని నిలుపుతూ సహజమైన తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: עֶרְכְּךָ
  choice: నీవు నిర్ణయించే విలువ
  rationale: లేవీయకాండము 27లో మొక్కుబడికి సంబంధించిన నిర్ణీత మదింపును సూచిస్తుంది; ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీవు’ అని నిలుపుతుంది.
- source_word: הַזָּכָר
  choice: మగవానికి
  rationale: మూలపాఠం వయస్సుకు ప్రత్యేకమైన ‘బాలుడు’ వంటి పదాన్ని కాక లింగవర్గాన్ని సూచిస్తుంది.
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: ఐదు వెండి షెకెలులు
  rationale: సంఖ్యను, ద్రవ్య ప్రమాణాన్ని, వెండి అనే పదార్థాన్ని నేరుగా మరియు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלַנְּקֵבָה
  choice: ఆడదానికి
  rationale: మగ వర్గానికి సమాంతరంగా స్త్రీ లింగవర్గాన్ని సూచిస్తుంది; వయస్సుతో సంబంధం లేకుండా వర్తించే పదం.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: మూడు వెండి షెకెలులు
  rationale: మూలంలోని మొత్తాన్ని నేరుగా అనువదిస్తూ ముందటి ద్రవ్యవ్యక్తీకరణతో ఏకరీతిని కాపాడుతుంది.
- source_word: וְהָיָה
  choice: ఉంటుంది
  rationale: శాసన సందర్భంలోని నిర్దేశక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; పూర్తి వాక్యంలో ‘విలువ ... షెకెలులు’ అనే నిర్మాణం ఆ విధిని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-శాసన శైలిని వాడాం. ‘మగవాడు/ఆడది’ అనే పదాలు ఇక్కడ సామాజిక పాత్రలకన్నా మూలంలోని లింగవర్గీకరణను సూచిస్తాయి. ‘షెకెలు’ అనే ప్రాచీన బరువు-ద్రవ్య ప్రమాణాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
