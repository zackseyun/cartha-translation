lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దבר క్రియ యొక్క వావ్-అనుక్రమ రూపం ఇక్కడ సాధారణ కథనాత్మక దైవవాక్య సూత్రాన్ని ప్రారంభిస్తుంది. తెలుగులో తరువాతి לֵאמֹר భావాన్ని ‘ఇలా’ ద్వారా కలిపి చెప్పినప్పుడు ‘చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడబడిన వ్యక్తిని సూచించే אֶלను తెలుగు వాక్యనిర్మాణంలో సహజమైన ‘మోషేతో’గా వ్యక్తపరిచాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్య విషయాన్ని పరిచయం చేసే ఈ infinitive constructను తెలుగులో సహజమైన ‘ఇలా చెప్పాడు’ నిర్మాణంతో వ్యక్తపరిచాం; ‘అంటూ’ అని విడిగా ఉంచడం ఇక్కడ అసంపూర్ణంగా వినిపిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగా నిలిపాం. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా ప్రతిపాదించబడే ప్రత్యామ్నాయం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘మాట్లాడి, చెప్పడానికి’ అనే ద్వంద్వ నిర్మాణాన్ని పదేపదే అనుకరించకుండా, దాని కార్యాన్ని సహజమైన ‘ఇలా చెప్పాడు’గా అందించాం.
