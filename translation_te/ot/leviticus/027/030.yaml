id: LEV.27.30
reference: Leviticus 27:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: te
  text: భూమిలోని ప్రతి దశమభాగం—భూమి పంటల నుండి అయినా, చెట్టు ఫలాల నుండి అయినా—యహ్వేదే; అది యహ్వేకు పరిశుద్ధమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: దేశపు ప్రతి పదోవంతు
  rationale: ఏకవచన నిర్మాణంలో כָל పంపిణీ భావాన్ని ఇస్తుంది; మַעְשַׂר అంటే వ్యవసాయ దిగుబడిలో పదోవంతు. సందర్భంలో אֶרֶץ మొత్తం భూమండలాన్ని కాక సాగుభూమి లేదా దేశపు దిగుబడిని సూచిస్తుంది.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: భూమి విత్తనంలోనిదైనా
  rationale: హీబ్రూ పదచిత్రమైన ‘భూమి విత్తనం’ను సాధ్యమైనంతగా నిలుపుతూ, అది పదోవంతులో ఒక వర్గమని తెలుగులో స్పష్టమయ్యేలా ‘లోనిదైనా’ అని ఇచ్చాం.
- source_word: מִפְּרִי הָעֵץ
  choice: చెట్టు పండులోనిదైనా
  rationale: మూలంలోని ఏకవచన ‘చెట్టు’ సమూహార్థకంగా వాడబడింది; తెలుగులోనూ ఈ రూపం సహజంగా సమూహార్థాన్ని మోయగలదు.
- source_word: לַיהוָה הוּא
  choice: యహ్వేకే చెందుతుంది
  rationale: לְ ఇక్కడ స్వామ్యాన్ని లేదా అంకితభావాన్ని సూచిస్తుంది. ‘చెందుతుంది’ ప్రధాన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘కే’ ఆ ప్రత్యేక స్వామ్యాన్ని నొక్కిచెబుతుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యహ్వేకు పరిశుద్ధమైనది
  rationale: קֹדֶשׁ ఇక్కడ ఆ పదోవంతు యహ్వే కోసం ప్రత్యేకపరచబడినదని తెలిపే ఆరాధనా సంబంధ పదం. మూలంలో అత్యుత్తమ స్థాయి రూపం లేనందున ‘అతి పరిశుద్ధమైనది’ అని విస్తరించలేదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణను సూచించే ‘యహ్వే’గా ఇచ్చాం.
- issue: לַיהוָה లోని స్వామ్య–అంకిత భావం
  choice: యహ్వేకే చెందుతుంది
  alternative: యహ్వే కోసం ఉంది
  rationale: సందర్భంలో స్వామ్య భావం ప్రధానమైనప్పటికీ, హీబ్రూ לְ అంకిత భావాన్నీ మోయగలదు. ప్రధాన పాఠ్యంలో సహజమైన స్వామ్యార్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. వ్యవసాయ పదచిత్రాన్ని నిలుపుతూ, వాక్య సంబంధాలను డాష్‌లతో స్పష్టంచేశాం.
