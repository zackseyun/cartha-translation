translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలిని పాటించాం. ‘విలువను నిర్ణయించాలి’ అనే పదబంధాన్ని అధ్యాయంలోని సాంకేతిక ధనమూల్య భావానికి అనుగుణంగా స్థిరంగా వాడాం. మూలంలోని కర్తలేని ఆజ్ఞను ‘నిలబెట్టాలి’ అని ఉంచి, ఎవరు నిలబెట్టాలో అదనంగా నిర్ధారించలేదు.
