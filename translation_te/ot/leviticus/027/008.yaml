source:
  edition: WLC
  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: te
  text: అయితే అతడు నీవు నిర్ణయించిన విలువను చెల్లించలేనంత పేదవాడైతే[a], అతణ్ణి యాజకుని ఎదుట నిలబెట్టాలి. యాజకుడు అతని విలువను నిర్ణయించాలి; మొక్కుబడి చేసినవాని ఆర్థిక స్థోమతను బట్టి[b] యాజకుడు అతని విలువను నిర్ణయించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, “నీ విలువకంటే పేదవాడైతే.” ఇక్కడ భావం: నిర్ణయించిన విలువను చెల్లించే స్థోమత అతనికి లేకపోతే.'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మొక్కుబడి చేసినవాని చేయి ఎంతవరకు చేరుతుందో దానిని బట్టి.” ఇది అతని ఆర్థిక సామర్థ్యాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ
  choice: చెల్లించలేనంత పేదవాడు
  rationale: ఈ విశేషణం ఆర్థికంగా బలహీనుడైన వ్యక్తిని సూచిస్తుంది. తరువాతి מֵעֶרְכֶּךָతో కలిపి, నిర్ణయించిన మొత్తాన్ని భరించలేని స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעֶרְכֶּךָ
  choice: నీవు నిర్ణయించిన విలువను
  rationale: లేవీయకాండము 27లో עֵרֶךְ అనేది మొక్కుబడికి సంబంధించిన నిర్ణీత ధన విలువ. ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీవు’ అని నిలుపుతూ, తెలుగులో అర్థవంతంగా ‘నిర్ణయించిన విలువ’ అని అనువదించబడింది.
- source_word: וְהֶעֱמִידוֹ
  choice: అతణ్ణి ... నిలబెట్టాలి
  rationale: עמד హిఫీల్ రూపానికి అక్షరార్థం ‘నిలబడేలా చేయడం.’ కర్త ఎవరో మూలపాఠం పేర్కొననందున తెలుగులోనూ కర్తను నిర్దిష్టం చేయకుండా న్యాయపరమైన ప్రక్రియగా చెప్పబడింది.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: యాజకుని ఎదుట
  rationale: యాజక అధికార సమక్షంలో హాజరుపరచడాన్ని తెలిపే ప్రామాణిక ఆరాధనా-న్యాయ ప్రయోగం.
- source_word: וְהֶעֱרִיךְ אֹתוֹ / יַעֲרִיכֶנּוּ
  choice: యాజకుడు అతని విలువను నిర్ణయించాలి
  rationale: ఈ అధ్యాయంలో ערך ఒక వ్యక్తికి మొక్కుబడి సంబంధమైన ధన విలువను నిర్ణయించడాన్ని సూచిస్తుంది. పునరావృత్తిని మూలపాఠం ప్రకారమే రెండుసార్లు నిలిపాం.
- source_word: עַל פִּי
  choice: బట్టి
  rationale: విలువ నిర్ణయించడానికి ఆధారమైన ప్రమాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: ఆర్థిక స్థోమత
  rationale: ‘చేయి చేరగలిగినది’ అనే హీబ్రూ నుడికారం ఒకరి ఆర్థిక సామర్థ్యాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన తెలుగు వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַנֹּדֵר
  choice: మొక్కుబడి చేసినవాడు
  rationale: నדר చేసిన వ్యక్తిని సూచిస్తుంది. ‘మొక్కుబడి చేసినవాడు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
