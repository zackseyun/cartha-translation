  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם גָּאֹ֥ל יִגְאַ֛ל אִ֖ישׁ מִ/מַּֽעַשְׂר֑/וֹ חֲמִשִׁית֖/וֹ יֹסֵ֥ף עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/031.yaml
  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: te
  text: అయితే ఒకడు తన దశమభాగంలో కొంతను విడిపించుకుంటే, దానికి ఐదో వంతు అదనంగా చేర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘విడిపించడం, విడిపించుకుంటే’ అనే క్రియను ఉద్ఘాటించే నిర్మాణం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: అయితే … -ాలంటే
  rationale: చట్టపరమైన వరుసలో మరో షరతును ప్రవేశపెడుతూ, సందర్భంలోని స్వల్ప వ్యత్యాస భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גָּאֹל יִגְאַל
  choice: తప్పకుండా విడిపించుకోవాలంటే
  rationale: గאל ధాతువు యొక్క infinitive absolute + imperfect నిర్మాణం క్రియను బలపరుస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది; ‘విడిపించుకోవడం’ మూల్యం చెల్లించి ప్రతిష్ఠిత వస్తువును తిరిగి పొందే చట్టపరమైన భావాన్ని అందిస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ పదం పుంలింగ ఏకవచనంలో ఉండి చట్టపరమైన సాధారణ కర్తగా పనిచేస్తుంది; తెలుగు చట్టశైలిలో ‘ఒకడు’ దీనిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִ/מַּעַשְׂר/וֹ
  choice: తన దశమభాగంలో దేనినైనా
  rationale: מִן యొక్క భాగార్థాన్ని ‘దేనినైనా’ ద్వారా వ్యక్తం చేస్తూ, మొత్తం దశమభాగంలో ఏదైనా భాగాన్ని విడిపించుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֲמִשִׁית/וֹ
  choice: అయిదవ వంతు
  rationale: మూలపదం ఒక ఐదో భాగాన్ని సూచిస్తుంది; ‘అయిదవ వంతు’ స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు రూపం.
- source_word: יֹסֵף עָלָיו
  choice: దానికి … కలపాలి
  rationale: הוסיף యొక్క కారణార్థక రూపం ‘కలపడం/చేర్చడం’ అని అర్థం; עַל మూల మొత్తానికి అదనంగా కలపడాన్ని సూచిస్తుంది. తెలుగు న్యాయవిధి శైలిలో ‘కలపాలి’ కర్తవ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
