translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని చట్టపరమైన సందర్భానికి తగిన గౌరవప్రదమైన, సూటి శైలి. ‘విడిపించుకోవడం’ విమోచన మూల్యం చెల్లించి తిరిగి స్వాధీనం చేసుకునే భావాన్ని సూచిస్తుంది. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో ఉంచబడింది.
