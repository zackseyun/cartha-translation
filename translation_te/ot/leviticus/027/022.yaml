id: LEV.27.22
reference: Leviticus 27:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם֙ אֶת שְׂדֵ֣ה מִקְנָת֔/וֹ אֲשֶׁ֕ר לֹ֖א מִ/שְּׂדֵ֣ה אֲחֻזָּת֑/וֹ יַקְדִּ֖ישׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: te
  text: అయితే, ఒకడు తన వంశపారంపర్య భూమిలో భాగం కాని, తాను కొనుగోలు చేసిన పొలాన్ని[a] యాహ్వేకు ప్రతిష్ఠిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన కొనుగోలు పొలం”; అంటే పూర్వీకుల నుంచి సంక్రమించిన భూమికి భిన్నంగా, తాను కొనుగోలు చేసిన పొలం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి నియమానికి కొనసాగింపుగా, దానితో కొంత భిన్నమైన షరతును పరిచయం చేస్తుంది.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: తాను కొనుగోలు చేసిన పొలం
  rationale: కొనుగోలు ద్వారా పొందిన పొలమనే న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వంశపారంపర్య భూమికి ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: తన వంశపారంపర్య భూమిలో భాగం కాని
  rationale: אֲחֻזָּה ఇక్కడ పూర్వీకుల నుంచి సంక్రమించిన స్థిరాస్తిని సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ కొనుగోలు భూమితో వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: יַקְדִּישׁ
  choice: ప్రతిష్ఠిస్తే
  rationale: ఏదైనా వస్తువును యాహ్వేకు పవిత్రంగా ప్రత్యేకించే మొక్కుబడి-న్యాయ సంబంధ చర్యను సూచిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ల ఉపసర్గను ‘కు’గా, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా ప్రత్యక్షంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా న్యాయపరమైన మరియు ఆరాధన సంబంధ గంభీరతను నిలిపింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
