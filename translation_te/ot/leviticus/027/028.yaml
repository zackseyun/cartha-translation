  rationale: సవరణ కేవలం వ్యాకరణ, శైలి స్పష్టత కోసమే. మూలంలోని కర్మణి నిషేధాలను కర్మణి తెలుగు రూపాలతో అనువదించాం; అంకిత వస్తువు గురించిన సంబంధ ఉపవాక్యాన్ని సహజమైన పదక్రమంలో పెట్టాం. వారసత్వ ఆస్తి, తిరుగులేని అంకిత భావం, ఖేరెమ్‌కు సంబంధించిన పాదటిప్పణి, మరియు అత్యున్నత పవిత్రత భావాలు నిలిపి ఉంచబడ్డాయి.
