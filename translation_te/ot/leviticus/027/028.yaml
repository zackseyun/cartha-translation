id: LEV.27.28
reference: Leviticus 27:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: te
  text: అయితే, ఒక పురుషుడు తనకు చెందిన వాటన్నిటిలోనుండి—మనిషినైనా, జంతువునైనా, తన వారసత్వ ఆస్తిలోని పొలాన్నైనా—యెహోవాకు శాశ్వతంగా అంకితం చేసిన ఏదీ అమ్మబడకూడదు, విమోచింపబడకూడదు. శాశ్వతంగా అంకితం చేయబడిన ప్రతిదీ యెహోవాకు అత్యంత పవిత్రమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి విమోచన నియమాలకు భిన్నమైన, మినహాయింపు స్వభావమున్న నియమాన్ని సహజంగా సూచిస్తుంది.
- source_word: חֵרֶם / יַחֲרִם
  choice: శాశ్వతంగా అంకితం చేసినది / శాశ్వతంగా అంకితం చేయడం
  rationale: ఈ సాంకేతిక పదం యెహోవాకు తిరిగి తీసుకోలేని విధంగా ప్రత్యేకించిన దానిని సూచిస్తుంది. 'శాశ్వతంగా' అనే పదం అమ్మకానికీ విమోచనకీ వీలులేదనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది; నాశనానికి అప్పగించడం అనే ఇతర సందర్భాల భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: హీబ్రూ న్యాయశైలిలోని వ్యాకరణపరమైన పుంలింగ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన 'యెహోవా'గా లిప్యంతరీకరిస్తుంది.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: తనకు చెందిన వాటన్నిటిలోనుంచి
  rationale: అంకితం చేయబడే వస్తువు అతనికి చెందిన సమస్తంలోనుంచి వస్తుందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: మనిషినైనా, జంతువునైనా
  rationale: మనుష్యుడు-జంతువు అనే వర్గ భేదాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: తన వారసత్వ భూమిలోని పొలాన్నైనా
  rationale: אֲחֻזָּה ఇశ్రాయేలీయుల వంశపారంపర్య భూస్వామ్యాన్ని సూచించడాన్ని స్పష్టం చేస్తుంది.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: అమ్మకూడదు, విమోచించకూడదు
  rationale: న్యాయపరమైన రెండు నిషేధాలను నేరుగా వ్యక్తపరుస్తూ, ఈ అధ్యాయంలోని విమోచన సాంకేతిక పదజాలాన్ని నిలుపుతుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పవిత్రమైనది
  rationale: హీబ్రూ అత్యున్నత స్థాయి పవిత్రతను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఈ న్యాయ సందర్భంలో חֵרֶם పదం అర్థం
  choice: ప్రధాన పాఠ్యంలో 'శాశ్వతంగా అంకితం చేసినది'
  alternative: '''నాశనానికి అంకితం చేసినది'' లేదా ''నిషేధం కింద ఉంచినది'''
  rationale: ఈ వచనం ప్రధానంగా దానిని అమ్మలేమని, విమోచించలేమని, అది యెహోవాకు అత్యంత పవిత్రమని చెబుతోంది. అందువల్ల తిరుగులేని అంకిత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నాశనం/నిషేధం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: אִישׁ లోని పుంలింగ న్యాయ భాష
  choice: '''ఒక పురుషుడు''గా నిలుపడం'
  alternative: '''ఎవరైనా'' లేదా ''ఒక వ్యక్తి'''
  rationale: మూలంలోని పుంలింగ ఏకవచన న్యాయపదాన్ని చెరపకుండా, దాని ప్రతినిధి ప్రయోగాన్ని పాఠకుడు గ్రహించగలిగేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. 'విమోచించకూడదు' అనే పదం అధ్యాయంలోని సాంకేతిక న్యాయ-ఆధ్యాత్మిక పదజాలాన్ని కాపాడుతుంది.
