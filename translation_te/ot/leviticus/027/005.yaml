id: LEV.27.5
reference: Leviticus 27:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: te
  text: ఒకవేళ ఒకరి వయస్సు ఐదు సంవత్సరాల నుండి ఇరవై సంవత్సరాల వరకు ఉంటే, మగ వ్యక్తికి నీ మదింపు ఇరవై షెకెలులు, ఆడ వ్యక్తికి పది షెకెలులు ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: ఒకవేళ ... ఉంటే
  rationale: ముందున్న నియమాలకు అనుసంధానమైన షరతును సహజమైన ఆధునిక తెలుగు న్యాయశైలిలో వ్యక్తపరుస్తుంది.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: ఐదు సంవత్సరాల వయస్సు మొదలుకొని ఇరవై సంవత్సరాల వయస్సు వరకు
  rationale: బెన్‌తో కూడిన హెబ్రీ వయస్సు ప్రయోగాన్ని స్పష్టమైన తెలుగు వయోపరిమితిగా అందిస్తుంది; సరిహద్దుల విషయంలో మూలంలోని రూపాన్ని మార్చదు.
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: ఈ నియమాత్మక సందర్భంలోని విధినిర్దేశక బలాన్ని సహజమైన తెలుగు శాసనశైలిలో తెలియజేస్తుంది.
- source_word: עֶרְכְּךָ
  choice: నీవు నిర్ణయించే విలువ
  rationale: రెండవ పురుష ఏకవచన సంబంధాన్ని నిలుపుతూ, మొక్కుబడి సందర్భంలో నిర్ణయించిన మదింపు మొత్తాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַזָּכָר
  choice: మగ వ్యక్తికి
  rationale: ఏకవచన న్యాయవర్గాన్ని గౌరవప్రదంగా, లింగపరంగా ఖచ్చితంగా తెలుపుతుంది; వయస్సు ఐదు సంవత్సరాల నుంచే మొదలవుతున్నందున ‘పురుషుడు’ కంటే విస్తృతంగా వర్తిస్తుంది.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: ఇరవై షెకెలులు
  rationale: చారిత్రక బరువు/ధన ప్రమాణాన్ని ఆధునిక కరెన్సీగా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: וְלַנְּקֵבָה
  choice: ఆడ వ్యక్తికి
  rationale: ‘మగ వ్యక్తికి’ అనే సమాంతర న్యాయవర్గానికి సరిపడేలా ఏకవచన లింగవర్గాన్ని గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: పది షెకెలులు
  rationale: సంఖ్యను, చారిత్రక ప్రమాణాన్ని నేరుగా అనువదించి మగ వ్యక్తికి నిర్ణయించిన మొత్తంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా సంబంధ న్యాయపాఠంలో లింగాధారిత మదింపు వర్గాల అనువాదం
  choice: మగ వ్యక్తికి ... ఆడ వ్యక్తికి
  alternative: పురుషునికి ... స్త్రీకి
  rationale: హెబ్రీ పాఠం బహువచన సామాజిక సమూహాలను కాక, ఏకవచన లింగవర్గాలను పేర్కొంటుంది. వయోపరిమితిలో పిల్లలు కూడా ఉన్నందున ‘వ్యక్తి’ అనే పదం మూలంలోని వర్గీకరణను నిలుపుతూ అనవసరమైన విస్తృత సామాజిక లేదా సిద్ధాంతపరమైన భావాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన నియమాత్మక శైలి. ‘మదింపు’ వంటి పరిపాలనా పదం బదులు సాధారణ పాఠకునికి సులభమైన ‘నీవు నిర్ణయించే విలువ’ వాడబడింది; ‘షెకెలులు’ అనే చారిత్రక ప్రమాణం యథాతథంగా నిలుపబడింది.
