  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: te
  text: అది మంచిదా చెడ్డదా అని విచారించకూడదు[a]; దానిని మార్చకూడదు. ఒకవేళ నిజంగానే దానిని మార్చితే, అది మరియు దాని ప్రత్యామ్నాయం రెండూ పరిశుద్ధమైనవిగా ఉంటాయి[b]; దానిని విమోచించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మంచి మరియు చెడు మధ్య విచారించకూడదు.’ ఇక్కడ జంతువును దాని నాణ్యతను బట్టి వేరుగా పరిగణించకూడదనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో క్రియను బలపరిచే నిర్మాణం ఉంది: ‘ఒకవేళ దానిని తప్పకుండా మార్చితే’ లేదా ‘నిజంగానే మార్చితే.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: అది మంచిదో చెడ్డదో అని పరిశీలించి వేరుచేయకూడదు
  rationale: పియేల్ రూపంలోని క్రియ ఇక్కడ దశమభాగపు జంతువులను నాణ్యతనుబట్టి పరిశీలించి ఎంపిక చేయడాన్ని సూచిస్తుంది. ‘పరిశీలించి వేరుచేయడం’ అనే ప్రయోగం హీబ్రూ ‘మంచి మరియు చెడు మధ్య’ అనే న్యాయపరమైన నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: దానికి బదులుగా మరొకదాన్ని మార్చకూడదు / నిజంగానే దాన్ని మార్చితే
  rationale: מור అనే మూలం ఒక ప్రతిష్ఠిత లేదా దశమభాగపు జంతువు స్థానంలో మరొకదాన్ని పెట్టడాన్ని సూచించే సాంకేతిక పదం. అనంతక్రియతో కూడిన పునరుక్తి బలాన్ని ‘నిజంగానే’ తెలియజేస్తుంది.
- source_word: תְמוּרָתוֹ
  choice: దాని బదులుగా పెట్టినది
  rationale: మొదటి జంతువు స్థానంలో ఉంచిన ప్రత్యామ్నాయ జంతువును స్పష్టంగా, సాధారణ పాఠకునికి అర్థమయ్యేలా సూచిస్తుంది.
- source_word: קֹדֶשׁ
  choice: పరిశుద్ధమైనవిగా
  rationale: లేవీయకాండంలోని దేవునికి ప్రత్యేకింపబడిన ఆరాధనా స్థితిని ‘పరిశుద్ధం’ అనే పదం కాపాడుతుంది.
- source_word: לֹא יִגָּאֵל
  choice: వాటిని విమోచించకూడదు
  rationale: ప్రతిష్ఠిత స్థితి నుండి మూల్యం చెల్లించి తిరిగి పొందడాన్ని సూచించే ఆరాధనా-న్యాయపరమైన భావాన్ని ‘విమోచించు’ నిలుపుతుంది. ముందు పేర్కొన్న రెండు జంతువులనూ ఉద్దేశించి తెలుగులో బహువచనం వాడబడింది.
theological_decisions:
- issue: ప్రతిష్ఠ మరియు విమోచనకు సంబంధించిన ఆరాధనా-న్యాయపరమైన బలం
  choice: קֹדֶשׁ ను ‘పరిశుద్ధమైనవి’, גאל ను ‘విమోచించు’గా అనువదించడం
  alternative: ‘దేవునికి ప్రత్యేకమైనవి’, ‘వెల చెల్లించి తిరిగి తీసుకోవడం’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వచనం ఇశ్రాయేలు ఆరాధనా ధర్మశాస్త్రంలో దశమభాగపు జంతువుల గురించి చెబుతుంది. ఎలాంటి తరువాతి సిద్ధాంతార్థాన్ని జోడించకుండా మూలంలోని పవిత్ర-న్యాయపరమైన పదజాలాన్ని ఇవి నిలుపుతాయి.
- issue: చివరి ఏకవచన నిషేధం యొక్క పరిధి
  choice: ‘వాటిని విమోచించకూడదు’ అని రెండు జంతువులకూ వర్తింపజేయడం
  alternative: హీబ్రూ వ్యాకరణ ఏకవచనాన్ని అనుసరించి ‘దాన్ని విమోచించకూడదు’ అని అనువదించడం
  rationale: ముందటి వాక్యం అసలు జంతువూ దాని ప్రత్యామ్నాయమూ రెండూ పరిశుద్ధమని ప్రకటిస్తుంది; చివరి నిషేధం ఆ ఏర్పాటును సమగ్రంగా సూచిస్తుందని సందర్భం తెలియజేస్తుంది. తెలుగు బహువచనం ఆ సహజ పరిధిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. సాంకేతిక భావం స్పష్టంగా ఉండేందుకు ‘బదులుగా పెట్టినది’, ‘పరిశుద్ధమైనవి’, ‘విమోచించు’ అనే పదాలను ఎంచుకున్నాం; వాక్య నిర్మాణం సాధారణ పాఠకునికి సులభంగా ఉండేలా ఉంచబడింది.
