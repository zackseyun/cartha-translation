  text: and the priest shall assess it[a], whether good or bad; as the priest assesses it, so it shall be.
translation:
  language: te
  text: మంచిదా చెడ్డదా అని యాజకుడు దానికి విలువ నిర్ణయించాలి. యాజకుడా, నీవు నిర్ణయించే విలువ ప్రకారమే అది ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “యాజకుడా, నీ విలువ నిర్ణయం ప్రకారమే అది ఉంటుంది.” ఇక్కడ రెండవ పురుష ఏకవచన రూపం ఉంది; సందర్భంలో ఇది యాజకుని అధికారిక విలువ నిర్ణయాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: విలువ నిర్ణయించాలి
  rationale: హిఫిల్ రూపం ఇక్కడ అర్పిత జంతువుకు అధికారిక విలువ కట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు న్యాయశైలిలో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని כֹּהֵן పదానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం; నిర్దిష్టతను సందర్భం తెలియజేస్తుంది.
- source_word: אֹתָהּ
  choice: దానికి
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందటి వచనంలోని జంతువును సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘దానికి విలువ నిర్ణయించాలి’ సహజం.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: దాని నాణ్యత మంచిదో చెడ్డదో పరిశీలించి
  rationale: అక్షరార్థమైన ‘మంచి మధ్య, చెడు మధ్య’ కంటే, జంతువు నాణ్యతను అంచనా వేయడమే ఉద్దేశమని సహజ తెలుగులో తెలియజేస్తుంది; మంచి లేదా చెడు అనే రెండు అవకాశాలనూ నిలుపుతుంది.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: యాజకుడైన నీవు ఎంత విలువ నిర్ణయిస్తే
  rationale: כְּעֶרְכְּךָ లోని రెండవ పురుష ఏకవచన ‘నీ’ ప్రత్యయాన్ని తొలగించకుండా, తరువాతి ‘యాజకుడు’ అనే సంబోధ్య-స్పష్టీకరణతో కలిపి అనువదిస్తుంది. తద్వారా హెబ్రీయ నిర్మాణంలోని వ్యక్తి మార్పు నిలుస్తూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: כֵּן יִהְיֶה
  choice: అదే దాని విలువగా ఉంటుంది
  rationale: యాజకుడు నిర్ణయించిన విలువ అధికారికంగా అమలులో ఉంటుందనే న్యాయపరమైన భావాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
