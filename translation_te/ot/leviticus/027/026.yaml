  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: te
  text: అయితే, పశువుల్లో యెహోవాకు చెందిన తొలిపుట్టిన జంతువును ఎవరూ ప్రతిష్ఠించకూడదు. అది ఎద్దయినా, గొర్రె లేదా మేకయినా[a], యెహోవాదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שֶׂה అనే పదం మందలోని గొర్రెను లేదా మేకను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందున్న నియమాలకు మినహాయింపు లేదా పరిమితిని పరిచయం చేసే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכוֹר
  choice: తొలిచూలు జంతువు
  rationale: జంతువుల్లో మొదట పుట్టినదాన్ని సూచిస్తుంది; తెలుగు బైబిలు సందర్భంలో అర్థమయ్యే, గౌరవప్రదమైన పదబంధం.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: పశువుల్లో యెహోవాకు చెందాల్సిన తొలిచూలు జంతువు
  rationale: בכר యొక్క నిష్క్రియ రూపం మానవుడు చేసే చర్యను కాక, తొలిచూలుగా ఉన్న స్థితిని సూచిస్తుంది. లַיהוָה ఆ స్థితివల్ల యెహోవాకు ఇప్పటికే ఉన్న హక్కును తెలియజేస్తుంది.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: ఎవరూ ప్రతిష్ఠించకూడదు
  rationale: אִישׁ ఇక్కడ సాధారణార్థకంగా ఉంది; తెలుగులో ‘ఎవరూ’ సహజంగా అదే సమగ్ర నిషేధాన్ని తెలుపుతుంది. ‘ప్రతిష్ఠించు’ קדש హిఫిల్ రూపంలోని ఆరాధనాపరమైన అంకిత భావాన్ని నిలుపుతుంది.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: అది ఎద్దయినా, గొర్రె లేదా మేకయినా
  rationale: שׁוֹר గోవుల వర్గంలోని జంతువును, שֶׂה మందలోని గొర్రె లేదా మేకను సూచించగలదు. మూలంలోని విస్తృత పరిధిని సంకుచితం చేయకుండా రెండింటినీ స్పష్టంగా పేర్కొంది.
- source_word: לַיהוָה הוּא
  choice: అది యెహోవాదే
  rationale: మూలంలోని సంక్షిప్తమైన స్వామ్య లేదా హక్కు భావాన్ని సహజమైన, బలమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని పేరుగానే ప్రతిబింబించే ప్రాజెక్టు విధానానికి అనుగుణమైన ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: తొలిచూలు జంతువును ప్రత్యేకంగా ప్రతిష్ఠించకూడదనే కారణం
  choice: తొలిచూలుగా ఉన్నందువల్ల అది ఇప్పటికే యెహోవాకు చెందుతుంది; కాబట్టి మనిషి దానిని కొత్తగా ప్రతిష్ఠించలేడు.
  alternative: తొలిచూలు స్థితియే ఒక విధమైన పవిత్రీకరణ; స్వామ్య భావానికి ప్రత్యేక ప్రాధాన్యం అవసరం లేదు.
  rationale: చివరి మాట అయిన לַיהוָה הוּא (‘అది యెహోవాదే’) ముందస్తు దైవహక్కు లేదా స్వామ్యాన్ని స్పష్టంగా బలపరుస్తుంది; అయినా తొలిచూలు స్థితిలోని పవిత్రత భావాన్ని అనువాదం తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన నిషేధం స్పష్టంగా ఉండేలా, ఆరాధనాపరమైన ‘ప్రతిష్ఠించు’ అనే పదాన్ని నిలిపి, సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం ఉపయోగించబడింది.
