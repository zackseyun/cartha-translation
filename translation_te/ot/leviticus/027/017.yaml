source:
  edition: WLC
  text: אִם מִ/שְּׁנַ֥ת הַ/יֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑/הוּ כְּ/עֶרְכְּ/ךָ֖ יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: te
  text: అతడు యోబేలు సంవత్సరం నుండి తన పొలాన్ని పవిత్రంగా ప్రత్యేకపరిస్తే[a], నీ మదింపు ప్రకారం అది నిలుస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన పొలాన్ని అంకితం చేస్తే.’ హీబ్రూ క్రియ దేనినైనా పవిత్రమైనదిగా ప్రత్యేకపరచడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: అతడు ... చేస్తే
  rationale: షరతుతో కూడిన ధర్మనియమ సందర్భాన్ని సహజమైన ఆధునిక తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: సునాద సంవత్సరము మొదలుకొని
  rationale: מִן సూచించే ఆరంభ బిందువును స్పష్టంగా నిలుపుతుంది; ఇది తదుపరి సునాద సంవత్సరం వరకు మిగిలిన కాలంతో ముడిపడిన విలువ నిర్ణయ సందర్భానికి సరిపోతుంది.
- source_word: יַקְדִּישׁ
  choice: ప్రతిష్ఠిస్తే
  rationale: హిఫిల్ రూపంలోని ‘పవిత్రమైనదిగా ప్రత్యేకపరచడం’ అనే ఆరాధన సంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׂדֵהוּ
  choice: తన పొలాన్ని
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כְּעֶרְכְּךָ
  choice: నీవు నిర్ణయించిన విలువే
  rationale: రెండవ పురుష ఏకవచన సంబోధనను నిలుపుతూ, యాజకుడు నిర్ణయించే మదింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָקוּם
  choice: అమలులో ఉంటుంది
  rationale: న్యాయపరమైన సందర్భంలో ‘నిలుస్తుంది/చెల్లుబాటవుతుంది’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యెహోవాకు ఆస్తిని పవిత్రంగా ప్రత్యేకపరచడాన్ని సూచించే ఆరాధన సంబంధ క్రియ
  choice: ప్రతిష్ఠిస్తే
  alternative: అంకితం చేస్తే
  rationale: ‘ప్రతిష్ఠించు’ అనే పదం సాధారణ సమర్పణకన్నా పవిత్రమైనదిగా ప్రత్యేకపరచే హీబ్రూ భావాన్ని మెరుగ్గా నిలుపుతుంది; అదనపు మతశాఖాపరమైన అర్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘సునాద సంవత్సరము’ లేవీయకాండంలోని యోబేలు వ్యవస్థకు సాంప్రదాయికంగా అర్థమయ్యే పదం; ‘అమలులో ఉంటుంది’ అనే ప్రయోగం יָקוּם యొక్క న్యాయపరమైన చెల్లుబాటు భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
