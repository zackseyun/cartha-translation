    text: లేదా, ‘తన పొలాన్ని అంకితం చేస్తే.’ హీబ్రూ క్రియ దేనినైనా పవిత్రమైనదిగా ప్రత్యేకపరచడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
