source:
  edition: WLC
  text: וְ/אִ֨ם הַ/מַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת בֵּית֑/וֹ וְ֠/יָסַף חֲמִישִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/הָ֥יָה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: te
  text: తన ఇంటిని ప్రతిష్ఠించినవాడు[a] దాన్ని విమోచించుకుంటే, నీ మదింపు ప్రకారం నిర్ణయించిన వెండి మొత్తానికి ఐదవ వంతును అదనంగా చెల్లించాలి[b]. అప్పుడు ఆ ఇల్లు అతనిదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అంకితం చేసినవాడు,’ లేదా ‘పవిత్రంగా ప్రత్యేకించినవాడు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, యాజకుడు నిర్ణయించిన వెండి మొత్తానికి అదనంగా దాని ఐదవ వంతు చెల్లించాలి.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: ప్రతిష్ఠించినవాడు
  rationale: ఈ సందర్భంలో קדשׁ రూపం ఒక ఇంటిని యెహోవాకు పవిత్రమైనదిగా ప్రత్యేకించడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించినవాడు’ ఆధునిక తెలుగులో ఆ ఆరాధనా-న్యాయ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יִגְאַל
  choice: విమోచించుకోవాలనుకుంటే
  rationale: గృహాన్ని నిర్ణీత చెల్లింపుతో తిరిగి తన స్వాధీనంలోకి తెచ్చుకోవడం ఇక్కడ ఉద్దేశం. ‘విమోచించుకోవడం’ లేవీయకాండంలోని న్యాయ-ఆరాధనా పదప్రయోగాన్ని నిలుపుతుంది; హీబ్రూ అసంపూర్ణ క్రియకు షరతు వాక్యంలో సహజమైన తెలుగు రూపం వాడబడింది.
- source_word: בֵּיתוֹ
  choice: తన ఇంటిని
  rationale: ఇది అక్షరార్థంగా ‘అతని ఇల్లు.’ ఆస్తి మదింపు సందర్భం కావడంతో ‘గృహం/నివాసం’ కంటే ‘ఇల్లు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְיָסַף
  choice: అదనంగా చెల్లించాలి
  rationale: షరతు నెరవేరినప్పుడు తప్పనిసరిగా చేయవలసిన చర్యను ఈ రూపం తెలియజేస్తుంది. కేవలం ‘కలపాలి’ కంటే చెల్లింపు సందర్భంలో ‘అదనంగా చెల్లించాలి’ స్పష్టంగా ఉంటుంది.
- source_word: חֲמִישִׁית
  choice: ఐదవ వంతును
  rationale: మూలపదం ఖచ్చితంగా ఒక ఐదవ భాగాన్ని సూచిస్తుంది. ‘ఇరవై శాతం’ కంటే ‘ఐదవ వంతు’ మూలకాలపు న్యాయ శైలిని కాపాడుతుంది.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: నీ మదింపు ప్రకారం నిర్ణయించిన వెండి విలువ
  rationale: כֶּסֶף యొక్క నిర్దిష్టమైన ‘వెండి’ భావాన్నీ, రెండవ పురుష ఏకవచనంలోని యాజకుని మదింపునీ నిలుపుతూ తెలుగులో సంబంధాన్ని స్పష్టపరుస్తుంది.
- source_word: עָלָיו
  choice: దానికి అదనంగా
  rationale: ఇక్కడ עַל అంచనా మొత్తానికి పైగా కలపబడే మొత్తాన్ని సూచిస్తుంది. ‘దానికి అదనంగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיָה לוֹ
  choice: అప్పుడు ఆ ఇల్లు అతనిదవుతుంది
  rationale: అదనపు మొత్తం చెల్లించిన తరువాత కలిగే యాజమాన్య ఫలితాన్ని నేరుగా తెలియజేస్తుంది; ‘మళ్లీ’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
theological_decisions:
- issue: దేవునికి ప్రత్యేకించబడిన ఆస్తికి సంబంధించిన ఆరాధనా పదజాలం
  choice: ప్రతిష్ఠించినవాడు
  alternative: అంకితం చేసినవాడు; పవిత్రపరచినవాడు
  rationale: ఈ వచనం లేవీయకాండం 27లోని పవిత్ర ఆస్తి మదింపు వ్యవస్థకు చెందినది. ‘ప్రతిష్ఠించినవాడు’ పవిత్రంగా ప్రత్యేకించడమనే భావాన్ని నిలుపుతుంది; ‘అంకితం’ ఆరాధనా భావాన్ని కొంత బలహీనపరచవచ్చు, ‘పవిత్రపరచినవాడు’ అయితే ఇంటి స్వభావం మారిందనే అదనపు భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ-ఆరాధనా గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూలోని ‘వెండి,’ రెండవ పురుష ఏకవచన ‘నీ మదింపు,’ మరియు షరతు-ఫలిత నిర్మాణం సాధ్యమైనంత స్పష్టంగా కాపాడబడ్డాయి.
