revisions:
- from: అయితే అతడు తన పొలాన్ని సునాద సంవత్సరము గడిచిన తర్వాత ప్రతిష్ఠిస్తే,[a] తదుపరి సునాద సంవత్సరము వరకు మిగిలిన సంవత్సరాల ప్రకారం యాజకుడు అతనికి చెల్లించవలసిన మొత్తాన్ని లెక్కించాలి; ఆ మొత్తం నీ నిర్ణీత విలువలో నుండి తగ్గించాలి.[b]
  to: అయితే అతడు యోబేలు సంవత్సరం తర్వాత తన పొలాన్ని పవిత్రంగా అంకితం చేస్తే,[a] యాజకుడు యోబేలు సంవత్సరం వరకు మిగిలి ఉన్న సంవత్సరాల ప్రకారం అతని కొరకు ధన మొత్తాన్ని లెక్కించాలి; అది నీ నిర్ణయించిన విలువనుండి తగ్గించబడాలి.[b]
  rationale: యోబేలు అనే స్థిర నామాన్ని పునరుద్ధరించాం; మూలంలో లేని ‘చెల్లించవలసిన’ అనే నిర్దేశాన్ని తొలగించాం; చివరి క్రియను హీబ్రూ నిష్క్రియ రూపానికి దగ్గరగా మార్చాం. ‘యోబేలు సంవత్సరం వరకు’ అనే పాఠం సందర్భంలో తదుపరి యోబేలు సంవత్సరాన్నే సూచిస్తుంది; మూలంలో లేని ‘తదుపరి’ని చేర్చలేదు.
