source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: te
  text: అయితే అతడు యోబేలు సంవత్సరం తర్వాత తన పొలాన్ని పవిత్రంగా అంకితం చేస్తే,[a] యాజకుడు యోబేలు సంవత్సరం వరకు మిగిలి ఉన్న సంవత్సరాల ప్రకారం అతని కొరకు ధన మొత్తాన్ని లెక్కించాలి; అది నీ నిర్ణయించిన విలువనుండి తగ్గించబడాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోబేలు సంవత్సరానంతరం.”
    reason: אַחַר הַיֹּבֵל అనే కాలసూచక పదబంధానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: లేదా, “నీ అంచనా విలువనుండి తగ్గించబడాలి.”
    reason: עֶרְכֶּךָకు సందర్భానుగుణమైన ప్రత్యామ్నాయ పదప్రయోగం; హీబ్రూలోని రెండవ పురుష ఏకవచనాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: సునాద సంవత్సరము గడిచిన తర్వాత
  rationale: אַחַר కాలక్రమంలో ‘తర్వాత’ అని సూచిస్తుంది; הַיֹּבֵל ఇక్కడ సునాద సంవత్సరాన్ని సూచిస్తుంది. తెలుగులో కాలసూచన స్పష్టంగా ఉండేందుకు ‘గడిచిన తర్వాత’ వాడబడింది.
- source_word: יַקְדִּישׁ
  choice: ప్రతిష్ఠిస్తే
  rationale: קדשׁ ఇక్కడ పొలాన్ని యెహోవాకు పవిత్రమైనదిగా ప్రత్యేకించడం సూచిస్తుంది. ‘ప్రతిష్ఠించు’ ఆ ఆరాధనా-న్యాయ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׂדֵהוּ
  choice: తన పొలాన్ని
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయం సహజమైన తెలుగు ప్రతిబింబక సర్వనామమైన ‘తన’తో వ్యక్తమైంది.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: యాజకుడు అతనికి చెల్లించవలసిన మొత్తాన్ని లెక్కించాలి
  rationale: חשב న్యాయ-ఆర్థిక సందర్భంలో లెక్కించడం; הַכֶּסֶף అక్షరార్థంగా వెండి/ధనం, సందర్భంలో నిర్ణయించాల్సిన నగదు మొత్తం. ‘చెల్లించవలసిన’ అనేది לוֹ యొక్క ప్రయోజన సంబంధాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: మిగిలిన సంవత్సరాల ప్రకారం
  rationale: עַל־פִּי అంటే ‘ప్రకారం/ఆధారంగా’; మిగిలిన సంవత్సరాల నిష్పత్తిని బట్టి మొత్తం లెక్కించబడుతుందని నేరుగా తెలియజేస్తుంది.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: తదుపరి సునాద సంవత్సరము వరకు
  rationale: హీబ్రూలో ‘సునాద సంవత్సరము వరకు’ అని ఉన్నప్పటికీ, ప్రస్తుత సునాద సంవత్సరం తర్వాతి కాలాన్ని లెక్కిస్తున్నందున లక్ష్య సంవత్సరాన్ని తెలుగులో ‘తదుపరి’ అని సహజంగా స్పష్టం చేసింది.
- source_word: וְנִגְרַע מֵעֶרְכֶּךָ
  choice: ఆ మొత్తం నీ నిర్ణీత విలువలో నుండి తగ్గించాలి
  rationale: Niphal וְנִגְרַע తగ్గింపు/మినహాయింపును సూచిస్తుంది. מֵעֶרְכֶּךָ లోని రెండవ పురుష ఏకవచనాన్ని ‘నీ’గా నిలిపి, עֶרֶךְ ను న్యాయపరంగా నిర్ణయించిన విలువగా అనువదించింది.
theological_decisions:
- issue: מֵעֶרְכֶּךָ లోని రెండవ పురుష ఏకవచన ప్రత్యయం
  choice: నీ నిర్ణీత విలువలో నుండి
  alternative: ఆ నిర్ణీత విలువలో నుండి
  rationale: హీబ్రూ పాఠంలోని ప్రత్యక్ష ఏకవచన సంబోధనను నిలుపుతుంది; దానిని నిరపేక్ష వాక్యంగా మార్చదు.
- issue: יַקְדִּישׁ అనే ఆరాధనా పదం
  choice: ప్రతిష్ఠిస్తే
  alternative: అర్పిస్తే
  rationale: పొలాన్ని కేవలం కానుకగా ఇవ్వడం కంటే పవిత్ర ప్రయోజనానికి ప్రత్యేకించడం అనే భావాన్ని ‘ప్రతిష్ఠించు’ బాగా కాపాడుతుంది.
- issue: הַיֹּבֵל అనే సంస్థాగత కాలపదం
  choice: సునాద సంవత్సరము
  alternative: విడుదల సంవత్సరము
  rationale: יוֹבֵל యొక్క కొమ్ము/సునాద సంబంధిత పేరును నిలుపుతూ, ఇది ఒక నిర్దిష్ట సంవత్సరమని స్పష్టం చేస్తుంది; ‘విడుదల’ మాత్రమే వాడితే పదంలోని పేరుపరమైన చిత్రణ కనుమరుగవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి. ‘సునాద సంవత్సరము,’ ‘ప్రతిష్ఠించు,’ ‘యాజకుడు,’ ‘నిర్ణీత విలువ’ వంటి పదాలు సందర్భపు పవిత్రతను, ఆర్థిక లెక్కింపును రెండింటినీ నిలుపుతాయి. హీబ్రూలోని రెండవ పురుష ఏకవచనం ‘నీ’గా ఉంచబడింది.
