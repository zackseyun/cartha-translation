id: LEV.27.16
reference: Leviticus 27:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: te
  text: '“ఒకడు తన స్వాస్థ్యపు పొలంలో నుండి కొంత భాగాన్ని యెహోవాకు ప్రతిష్ఠిస్తే, నీవు నిర్ణయించే దాని అంచనా విలువ దానికి కావలసిన విత్తన పరిమాణాన్ని బట్టి ఉండాలి: ఒక హోమెరు యవ విత్తనానికి యాభై షెకెలుల వెండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హోమెరు” ధాన్యపు ప్రాచీన ఘనపరిమాణం; “షెకెలు” ప్రాచీన బరువు-వెండి ప్రమాణం. ఇక్కడ పొలాన్ని విత్తడానికి అవసరమైన యవవిత్తన పరిమాణాన్ని బట్టి విలువ నిర్ణయించబడుతుంది.
    reason: ప్రాచీన కొలమానాలను వివరించడానికి మరియు విత్తన పరిమాణం విలువ నిర్ణయానికి ప్రమాణమని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: తన వారసత్వపు పొలంలో కొంత భాగాన్ని
  rationale: మִן ఉపసర్గ పొలం మొత్తాన్ని కాక దానిలో కొంత భాగాన్ని సూచిస్తుంది; אֲחֻזָּה వంశపారంపర్యంగా కలిగిన భూస్వాస్థ్యాన్ని సూచిస్తుంది.
- source_word: יַקְדִּישׁ
  choice: ప్రతిష్ఠిస్తే
  rationale: లేవీయకాండము 27లో ఇది దేనినైనా యెహోవాకు పవిత్రంగా ప్రత్యేకించే ఆరాధనాపరమైన చర్యను సూచిస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ పదం పుంలింగ ఏకవచనంలో ఉండి ధర్మశాస్త్ర నియమంలో ప్రతినిధి భావంతో వాడబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలపాఠంలోని దేవుని ఒడంబడిక నామమైన יהוהను తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: עֶרְכְּךָ
  choice: నీవు దాని విలువను నిర్ణయించాలి
  rationale: ఈ సందర్భంలో పదం అధికారిక అంచనా విలువను సూచిస్తుంది; రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీవు’గా నిలిపాం.
- source_word: לְפִי זַרְעוֹ
  choice: దానికి అవసరమైన విత్తనం పరిమాణాన్ని బట్టి
  rationale: ఇది పొలాన్ని విత్తడానికి కావలసిన విత్తన పరిమాణం ఆధారంగా చేసే అంచనాను సూచిస్తుంది.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: ఒక హోమెరు యవల విత్తనం పట్టే భూమి
  rationale: ఒక హోమెరు పరిమాణం యవల విత్తనం అవసరమయ్యే భూవిస్తీర్ణమే విలువ నిర్ణయానికి ప్రమాణమని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: యాభై తులాల వెండిగా
  rationale: שֶׁקֶל ప్రాచీన బరువు మరియు ద్రవ్య ప్రమాణం; తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘తులము’ను వాడి, ఖచ్చిత సమానత్వం లేదని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలిపి, సాధారణ తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన రూపాన్ని ఎంచుకున్నాం.
- issue: ధర్మశాస్త్ర వాక్యంలో אִישׁ అనే పుంలింగ రూపం
  choice: ఒకడు
  alternative: ఎవరైనా
  rationale: మూలంలోని వ్యాకరణ పుంలింగ ఏకవచనాన్ని నిలిపాం; అది ఈ నియమంలో ప్రతినిధి వ్యక్తిని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ధర్మశాస్త్ర శైలిని పాటించాం. వ్యవసాయ ప్రమాణాన్ని పదానువాదంగా అస్పష్టంగా ఉంచకుండా, విత్తనం పట్టే భూమి అనే సహజ నిర్మాణంతో తెలిపాం; మూలంలోని ‘కొంత భాగం’ భావాన్ని స్పష్టంగా నిలిపాం.
