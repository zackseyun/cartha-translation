revisions:
- from: “ఒకడు తన వారసత్వపు పొలంలో కొంత భాగాన్ని యెహోవాకు ప్రతిష్ఠిస్తే, దానికి అవసరమైన విత్తనం పరిమాణాన్ని బట్టి నీవు దాని విలువను నిర్ణయించాలి. ఒక హోమెరు యవల విత్తనం పట్టే భూమి విలువ యాభై తులాల వెండిగా ఉండాలి.[a]”
  to: '“ఒకడు తన స్వాస్థ్యపు పొలంలో నుండి కొంత భాగాన్ని యెహోవాకు ప్రతిష్ఠిస్తే, నీవు నిర్ణయించే దాని అంచనా విలువ దానికి కావలసిన విత్తన పరిమాణాన్ని బట్టి ఉండాలి: ఒక హోమెరు యవ విత్తనానికి యాభై షెకెలుల వెండి.[a]”'
  rationale: సవరణ మూలంలోని చట్టపరమైన భూస్వాస్థ్య భావం, పొలంలో నుండి కొంత భాగం అనే సూచన, విత్తన-ఆధారిత విలువ నిర్ణయం, మరియు హోమెరు/షెకెలు అనే నిర్దిష్ట ప్రాచీన ప్రమాణాలను కాపాడుతుంది. దైవనామం మరియు ప్రతిష్ఠా సంబంధ పదజాలం నిలిపివేయబడ్డాయి.
  reviewer_model: gpt-5.6-terra
