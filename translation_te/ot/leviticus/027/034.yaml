  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: te
  text: సీనాయి పర్వతం వద్ద యాహ్వే మోషేకు ఇశ్రాయేలు కుమారులకు ఆజ్ఞాపించిన ఆజ్ఞలు ఇవే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు కుమారుల కోసం’; సందర్భార్థంగా, ‘ఇశ్రాయేలీయుల కోసం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: గ్రంథ విభాగాన్ని ముగించే సారాంశ సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఉద్ఘాటనను కూడా నిలుపుతుంది.
- source_word: הַמִּצְוֺת
  choice: ఆజ్ఞలు
  rationale: מִצְוָה యొక్క అధికారపూర్వకమైన విధి లేదా ఆదేశ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: సంబంధవాచక నిర్మాణాన్ని సహజంగా కలుపుతూ, నామవాచకమైన ‘ఆజ్ఞలు’తో మూలంలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష నామరూపంతో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూలో אֶת ప్రత్యక్ష కర్మ సూచిక అయినప్పటికీ, ‘ఆజ్ఞాపించు’ అనే తెలుగు క్రియ సహజంగా సంప్రదాన విభక్తిని కోరుతుంది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల కోసం
  rationale: אֶל యొక్క ‘వారికి/వారి నిమిత్తం’ అనే సంబంధాన్ని నిలుపుతూ, בְּנֵי యొక్క కుమారులు అనే రూపాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּהַר סִינָי
  choice: సీనాయి పర్వతం దగ్గర
  rationale: בְּ సూచించే స్థలసంబంధాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పర్వతం మీద’ అని నిర్బంధించి చెప్పకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ మరో సాధ్యమైన లిప్యంతరీకరణ.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క ప్రతినిధి పురుష బహువచనం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘కుమారులు’ అనే వ్యాకరణ రూపాన్ని నిలుపుతుంది. సందర్భంలో అది కేవలం పురుషులనే కాక ఇశ్రాయేలు సమాజాన్ని ప్రతినిధిగా సూచిస్తుంది.
- issue: אֶל యొక్క సంబంధార్థం
  choice: కోసం
  alternative: వారికి
  rationale: మోషేకు ఇచ్చిన ఆజ్ఞలు ఇశ్రాయేలు కుమారులకు తెలియజేయవలసినవని ‘కోసం’ సహజంగా సూచిస్తుంది; అయితే మూల ఉపసర్గకు ‘వారికి’ అనే దిశార్థం కూడా సాధ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండం ముగింపు సూత్రానికి తగిన గంభీరతతో, సాధారణ పాఠకుడికి అర్థమయ్యే సహజ వాక్యనిర్మాణం. ‘ఆజ్ఞలు—ఆజ్ఞాపించిన’ అనే మూల పదసంబంధం ఉద్దేశపూర్వకంగా నిలుపబడింది.
