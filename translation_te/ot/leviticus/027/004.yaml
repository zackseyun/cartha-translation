  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: te
  text: కాని ఆ వ్యక్తి స్త్రీ అయితే,[a] నీవు నిర్ణయించే విలువ ముప్పై షెకెలులు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని ఆమె స్త్రీ అయితే.”
    reason: హీబ్రూ הִוא స్త్రీలింగ ఏకవచన సర్వనామాన్ని మరింత అక్షరార్థంగా ‘ఆమె’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... అయితే
  rationale: మునుపటి వచనంలోని పురుషుని విలువకు భిన్నమైన సందర్భాన్ని ఇది పరిచయం చేస్తోంది; అందువల్ల సందర్భంలోని వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נְקֵבָה הִוא
  choice: ఆ వ్యక్తి స్త్రీ అయితే
  rationale: נְקֵבָה స్త్రీ లింగాన్ని సూచిస్తుంది; మానవుల విలువ నిర్ణయించే ఈ సందర్భంలో ‘ఆ వ్యక్తి స్త్రీ అయితే’ అనేది సహజంగా, స్పష్టంగా ఉంది. హీబ్రూ స్త్రీలింగ సర్వనామ భావాన్ని పాదటిప్పణిలో మరింత అక్షరార్థంగా చూపించాం.
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: న్యాయపరమైన నియమంలో ఫలితంగా వర్తించే నిర్ణీత విలువను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֶרְכְּךָ
  choice: నీవు నిర్ణయించే విలువ
  rationale: עֶרֶךְ ఇక్కడ మొక్కుబడికి సంబంధించిన అధికారిక విలువ నిర్ణయాన్ని సూచిస్తుంది; రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీవు’ అని నిలిపాం.
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: ముప్పై షెకెలులు
  rationale: సంఖ్యను యథాతథంగా ఇచ్చి, ప్రాచీన బరువు/ద్రవ్య ప్రమాణమైన ‘షెకెల్’ను అనువాద లిప్యంతరీకరణతో నిలిపాం; మూలంలో లేని ‘వెండి’ని చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘విలువ’ అనే పదాన్ని సందర్భానుసారంగా ‘నిర్ణయించే’తో స్పష్టం చేసి, షెకెల్ అనే ప్రాచీన ప్రమాణాన్ని నిలిపాం.
