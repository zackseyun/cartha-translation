source:
  edition: WLC
  text: וְ/כָל מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן כֹּ֥ל אֲשֶׁר יַעֲבֹ֖ר תַּ֣חַת הַ/שָּׁ֑בֶט הָֽ/עֲשִׂירִ֕י יִֽהְיֶה קֹּ֖דֶשׁ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: te
  text: పశువుల మందలోనూ గొర్రెమేకల మందలోనూ పదవ వంతు—అంటే కర్ర[a] కిందుగా వెళ్లే ప్రతి పదవ జంతువు[b]—యాహ్వేకు పవిత్రమైనదిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది కాపరి కర్ర. పశువులను ఒక్కొక్కటిగా దాని కిందుగా వెళ్లనిచ్చి లెక్కించేవారు.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘పదవది.’ లెక్కింపులో వచ్చే ప్రతి పదవ జంతువు ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעְשַׂר
  choice: ప్రతి పదోవంతు
  rationale: దేవునికి ప్రత్యేకంగా కేటాయించబడే పదవ భాగాన్ని సూచించే న్యాయపరమైన పదం. తరువాతి వాక్యభాగం ఇది లెక్కింపులో వచ్చే ప్రతి పదవ జంతువని వివరిస్తుంది.
- source_word: בָּקָר וָצֹאן
  choice: పశువులలోనూ గొర్రెమేకలలోనూ
  rationale: בָּקָר పెద్ద పశువులను, צֹאן గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల మందను సమష్టిగా సూచిస్తాయి. ఆధునిక తెలుగు పాఠకులకు రెండవ పదం పరిధి స్పష్టంగా ఉండేందుకు ‘గొర్రెమేకలు’ అని ఇచ్చాం.
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: కర్ర కిందుగా వెళ్లే
  rationale: కాపరి జంతువులను ఒక్కొక్కటిగా కర్ర కిందుగా వెళ్లనిచ్చి లెక్కించే ఆచారాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: הָעֲשִׂירִי
  choice: ప్రతి పదవ జంతువు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పదవది’; సందర్భంలో అంతర్భూతమైన ‘జంతువు’ అనే నామవాచకాన్ని తెలుగులో స్పష్టంగా చేర్చాం. పునరావృత లెక్కింపులో వచ్చే ప్రతి పదవ జంతువే ఉద్దేశం.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: పవిత్రమైనదిగా ఉండాలి
  rationale: దేవునికి ప్రత్యేకంగా చెందినదిగా లేదా కేటాయించబడినదిగా ఉండే పవిత్ర స్థితిని సూచించే మూల నిర్మాణాన్ని కాపాడుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించాం; לְ అంకితం లేదా చెందుటను సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని పేరుగానే నిలిపి, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- issue: קֹדֶשׁ యొక్క పవిత్రత భావం
  choice: పవిత్రమైనదిగా ఉండాలి
  alternative: ప్రతిష్ఠితమైనదిగా ఉండాలి
  rationale: ‘పవిత్రం’ మూలంలోని ధార్మిక వర్గాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో అది యాహ్వేకు ప్రత్యేకంగా కేటాయించబడటాన్ని సూచించినా, అనువాదంలో ఆ భావాన్ని ఒక్క అర్థానికే పరిమితం చేయలేదు.
- issue: הָעֲשִׂירִי లో అంతర్భూత నామవాచకాన్ని స్పష్టం చేయడం
  choice: ప్రతి పదవ జంతువు
  alternative: పదవది
  rationale: న్యాయవాక్యంలోని ఉద్దేశాన్ని ఆధునిక తెలుగులో సందిగ్ధత లేకుండా తెలియజేస్తూ, మూలంలో లేని కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదక్రమం వాడాం. ‘గొర్రెమేకలు’ צֹאן యొక్క సమష్టి పరిధిని సంక్షిప్తంగా తెలియజేస్తుంది; వివరణాత్మక మధ్యభాగాన్ని దీర్ఘ విరామచిహ్నాలతో గుర్తించాం.
