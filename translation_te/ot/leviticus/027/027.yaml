  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: te
  text: అది అపవిత్ర జంతువులలో ఒకటైతే[a], అతడు నీ నిర్ణయించిన విలువ ప్రకారం దానిని విడిపించుకొని, ఆ విలువకు ఐదవ వంతును అదనంగా చెల్లించాలి[b]; ఒకవేళ అది విడిపించబడకపోతే, నీ నిర్ణయించిన విలువకు అది అమ్మబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బలిగా అర్పించడానికి ఆచారపరంగా అపవిత్రమైన జంతువుల వర్గానికి చెందినది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దాని ఐదవ వంతును దానిపై జోడించాలి”; అంటే నిర్ణయించిన విలువకు ఇరవై శాతం అదనంగా చెల్లించాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: అపవిత్ర జంతువులలో ఒకటి
  rationale: 'ב prefixed construction is naturally understood partitively/classificatorily: the dedicated animal belongs to the category of animals ritually unclean for sacrifice. ‘అపవిత్ర’ here carries the ritual, not hygienic or moral, sense; the footnote makes that explicit.'
- source_word: וּפָדָה
  choice: విడిపించుకోవాలి
  rationale: פדה denotes ransoming or buying back a dedicated item. In this legal case formulation, Telugu ‘విడిపించుకోవాలి’ naturally expresses the stipulated redemption procedure while the following clause preserves the possibility that redemption does not occur.
- source_word: בְעֶרְכֶּךָ
  choice: నీ నిర్ణయించిన విలువ ప్రకారం
  rationale: עֵרֶךְ in Leviticus 27 is an official assessed value. This wording preserves the second-person singular address and clarifies that the value is assigned by the addressed authority, understood contextually as the priest.
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: ఆ విలువలో ఐదవ వంతును దానికి అదనంగా చెల్లించాలి
  rationale: The Hebrew idiom requires adding its fifth on top of the valuation. The Telugu wording is natural and makes the monetary addition clear without replacing the source fraction with only a percentage.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: ఒకవేళ అది విడిపించబడకపోతే
  rationale: The Niphal leaves the agent unstated. A Telugu passive preserves that ambiguity rather than specifying who failed to redeem it.
- source_word: וְנִמְכַּר
  choice: అది అమ్మబడాలి
  rationale: The Niphal is a legal passive prescribing the disposition of the animal when it is not redeemed.
theological_decisions:
- issue: ‘అపవిత్ర’ అనే పదం యొక్క భావం
  choice: బలికి అర్హం కాని ఆచారపరంగా అపవిత్రమైన జంతువుల వర్గం
  alternative: సాధారణంగా మురికిగా లేదా నైతికంగా చెడ్డ జంతువు
  rationale: లేవీయకాండపు సందర్భంలో טָמֵא ఆచారపరమైన వర్గీకరణను సూచిస్తుంది; నైతిక లేదా పరిశుభ్రత సంబంధిత భావాన్ని పాఠ్యంలోకి చేర్చకూడదు.
- issue: విమోచన క్రియ యొక్క విధి లేదా అవకాశం
  choice: విడిపించుకోవాలి
  alternative: విడిపించుకోవచ్చు
  rationale: וּפָדָה legal case syntax can be heard as the prescribed procedure, while the ensuing ‘if it is not redeemed’ shows that non-redemption remains an actual case. The main wording preserves the procedural force without erasing that tension.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలిని ఉపయోగించాం. ‘నీ’ అనే ఏకవచన సంబోధన మూలంలోని రెండవ పురుష ఏకవచనాన్ని నిలుపుతుంది. ‘ఐదవ వంతు’ మూలంలోని భిన్నాన్ని నేరుగా కాపాడుతూ, ‘అదనంగా చెల్లించాలి’ దాని ఆర్థిక భావాన్ని సహజంగా తెలియజేస్తుంది.
