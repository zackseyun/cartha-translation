    rationale: ‘ఆ విలువలో ఐదవ వంతును’ అని చెప్పడం ఆ విలువలో ఇప్పటికే ఉన్న భాగంగా అర్థమవవచ్చు. హీబ్రూ వాక్యనిర్మాణం అంచనా విలువపై దాని ఐదవ వంతును జోడించమని చెబుతుంది.
