- from: ఒకడు తన ఇంటిని యెహోవాకు ప్రతిష్ఠితమైనదిగా అర్పిస్తే, ఆ ఇల్లు మంచిదైనా చెడ్డదైనా[a] యాజకుడు దాని విలువను నిర్ణయించాలి. యాజకుడు దాని విలువను ఎంతగా నిర్ణయిస్తాడో[b], అంతే దాని విలువగా స్థిరపడాలి.
  to: ఒకడు తన ఇంటిని యెహోవాకు పరిశుద్ధమైనదిగా అంకితం చేస్తే, అది మంచిదైనా చెడ్డదైనా[a] యాజకుడు దాని విలువను నిర్ణయించాలి. యాజకుడు దానికి ఏ విలువ నిర్ణయిస్తాడో[b], అదే స్థిరంగా ఉంటుంది.
  rationale: పవిత్ర అంకితభావం, యాజకుని విలువ నిర్ణయం, మరియు ఆ నిర్ణయం అమలులో ఉండడం అనే మూలపాఠంలోని న్యాయపరమైన క్రమాన్ని నిలుపుతూ వాక్యనిర్మాణాన్ని సహజీకరించాం. చివరి ఉపవాక్యంలో యాజకుడు నిర్ణయించే ‘విలువ’నే సూచించేలా సవరించాం; అదనపు సిద్ధాంతపరమైన అర్థాన్ని చేర్చలేదు.
