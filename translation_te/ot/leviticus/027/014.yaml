id: LEV.27.14
reference: Leviticus 27:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: te
  text: ఒకడు తన ఇంటిని యెహోవాకు పరిశుద్ధమైనదిగా అంకితం చేస్తే, అది మంచిదైనా చెడ్డదైనా[a] యాజకుడు దాని విలువను నిర్ణయించాలి. యాజకుడు దానికి ఏ విలువ నిర్ణయిస్తాడో[b], అదే స్థిరంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మంచి మధ్య, చెడు మధ్య’; అంటే, ఇంటి స్థితి లేదా నాణ్యత ఏదైనా సరే.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘దానిని మదింపు చేస్తాడో.’ ఇక్కడ పునరావృతమైన హీబ్రూ క్రియ యాజకుడు చేసే అధికారిక విలువ నిర్ణయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ఒకడు ... అర్పిస్తే
  rationale: ఇది షరతుతో కూడిన ధర్మశాస్త్ర సందర్భాన్ని పరిచయం చేస్తుంది. אִישׁ యొక్క ఏకవచన పుంలింగ రూపాన్ని ‘ఒకడు’ నిలుపుతుంది; כִּי సందర్భానుసారంగా ‘అయితే/అర్పిస్తే’ అనే షరతుగా వ్యక్తమైంది.
- source_word: יַקְדִּשׁ
  choice: ప్రతిష్ఠితమైనదిగా అర్పిస్తే
  rationale: קדשׁ హిఫీల్ రూపం ఒక వస్తువును పవిత్రమైనదిగా ప్రత్యేకించి అర్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో క్రియార్థాన్ని సహజంగా తెలియజేయడానికి ఈ నిర్మాణం వాడబడింది.
- source_word: בֵּיתוֹ
  choice: తన ఇంటిని
  rationale: ఈ ఆస్తి-విలువ నిర్ణయ సందర్భంలో בַּיִת నివాస భవనాన్ని సూచిస్తుంది; ‘ఇల్లు’ స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యెహోవాకు ప్రతిష్ఠితమైనదిగా
  rationale: ఇల్లు యెహోవాకు పవిత్రంగా ప్రత్యేకించబడిన స్థితిని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: וְהֶעֱרִיכוֹ
  choice: యాజకుడు దాని విలువను నిర్ణయించాలి
  rationale: లేవీయకాండము 27లో ערך హిఫీల్ రూపం అధికారిక ఆస్తి విలువ నిర్ణయాన్ని సూచిస్తుంది. ‘విలువను నిర్ణయించాలి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: మంచిదైనా చెడ్డదైనా
  rationale: ఇది ఇంటి స్థితి లేదా నాణ్యత ఏ విధంగా ఉన్నా దానిని మదింపు చేయాలనే హీబ్రూ విస్తృతార్థ ప్రయోగం.
- source_word: כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן
  choice: యాజకుడు దాని విలువను ఎంతగా నిర్ణయిస్తాడో
  rationale: అదే ערך క్రియను పునరావృతంగా ‘విలువను నిర్ణయించు’ అని అనువదించడం మూలంలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: כֵּן יָקוּם
  choice: అంతే దాని విలువగా స్థిరపడాలి
  rationale: קום ఇక్కడ యాజకుడు నిర్ణయించిన విలువ అమలులో నిలిచి చెల్లుబాటు కావడాన్ని సూచిస్తుంది. తెలుగులో ఉద్దేశిత న్యాయార్థం స్పష్టంగా ఉండేందుకు ‘దాని విలువగా’ అనేది సందర్భానుగుణంగా చేర్చబడింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు సంప్రదాయ రూపమైన ‘యెహోవా’గా ప్రతిబింబించింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని ప్రధాన పాఠంలో వ్యక్తిగత నామంగానే నిలుపుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘ప్రభువు’ అని మార్చడం మూలంలోని నామం-బిరుదు భేదాన్ని మరుగుపరచవచ్చు.
- issue: כֵּן יָקוּם యొక్క న్యాయపరమైన బలం
  choice: అంతే దాని విలువగా స్థిరపడాలి
  alternative: అలాగే అది నిలుస్తుంది
  rationale: ఈ వాక్యం ఇంటి భౌతిక స్థితి గురించి కాక యాజకుని విలువ నిర్ణయం చెల్లుబాటు కావడం గురించి చెబుతుంది. అందువల్ల అంతర్లీన అంశాన్ని స్పష్టం చేస్తూనే నిర్ణయాత్మక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన ధర్మశాస్త్ర శైలి. ‘మదింపు’ కంటే సాధారణంగా అర్థమయ్యే ‘విలువను నిర్ణయించు’ ప్రధాన పాఠంలో వాడబడింది. మూలంలోని షరతు, పునరుక్తి, న్యాయపరమైన నిర్ణయాత్మకత నిలుపబడ్డాయి.
