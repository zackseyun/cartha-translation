source:
  edition: WLC
  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: te
  text: అరవై ఏళ్లు లేదా అంతకంటే ఎక్కువ వయసున్న వ్యక్తి పురుషుడైతే, నీ మదింపు విలువ పదిహేను షెకెలులు; స్త్రీ అయితే పది షెకెలులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: అరవై ఏళ్లు లేదా అంతకంటే ఎక్కువ వయసున్న వ్యక్తి
  rationale: ఈ హీబ్రూ వయస్సు నుడికారం అరవై ఏళ్లను కనిష్ఠ పరిమితిగా పెట్టి, దానికంటే ఎక్కువ వయస్సును కూడా కలుపుతుంది. తెలుగులో సహజంగా, అర్థం స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: זָכָר
  choice: పురుషుడు
  rationale: ఈ విలువ నిర్ణయించే సందర్భంలో పదం జీవశాస్త్రీయ లింగాన్ని సూచిస్తుంది; స్త్రీ అనే జతపదంతో సహజంగా సరిపడే తెలుగు రూపం.
- source_word: עֶרְכְּךָ
  choice: నీవు నిర్ణయించే విలువ
  rationale: లేవీయకాండం 27లో మొక్కుబడి సంబంధంగా నిర్ణయించబడే నిర్దిష్ట విలువను సూచించే సాంకేతిక పదం. రెండవ పురుష ఏకవచన భావాన్ని కూడా నిలుపుతుంది.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: పదిహేను షెకెలులు
  rationale: సంఖ్యను, ప్రాచీన బరువు/ధన ప్రమాణమైన షెకెలును నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לַנְּקֵבָה
  choice: స్త్రీ అయితే
  rationale: పురుషుని సందర్భానికి అనురూపంగా స్త్రీకి వర్తించే విలువను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: పది షెకెలులు
  rationale: మూలంలోని సంఖ్యను, ప్రమాణాన్ని నేరుగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, న్యాయవిధి సందర్భానికి తగిన గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని షెకెలు అనే ప్రమాణం మార్చకుండా ఉంచబడింది.
