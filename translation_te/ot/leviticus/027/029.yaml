source:
  edition: WLC
  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: te
  text: మనుష్యులలో సంపూర్ణంగా అంకితం చేయబడిన ఎవరినీ[a] వెల చెల్లించి విడిపించకూడదు[b]; ఆ వ్యక్తిని తప్పక చంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుష్యులలో నాశనానికి అంకితం చేయబడిన ఎవరినీ.” హీబ్రూ పదం దేవునికి తిరుగులేని విధంగా అంకితం చేయబడినదానిని లేదా నిషేధం కింద ఉంచబడినదానిని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అంటే, వెల చెల్లించి విడిపించకూడదు లేదా తిరిగి పొందకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: సంపూర్ణ అర్పణ
  rationale: ఈ పదం తిరిగి తీసుకోలేని విధంగా ప్రత్యేకపరచబడినదానిని, కొన్ని సందర్భాల్లో నాశనానికి అప్పగించబడినదానిని సూచిస్తుంది. ప్రధాన పాఠంలో దాని ఆరాధనా-న్యాయ సంబంధమైన సాంకేతిక భావాన్ని ఉంచుతూ, ‘నాశనానికి’ అని ముందుగానే అర్థాన్ని పరిమితం చేయలేదు.
- source_word: יָחֳרַם
  choice: అంకితం చేయబడిన
  rationale: חרם నామవాచకంతో ఉన్న పదసంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది; చివరి మరణవాక్యం దాని తీవ్రమైన పరిణామాన్ని స్పష్టం చేస్తుంది.
- source_word: מִן הָאָדָם
  choice: మనుష్యులలో నుండి
  rationale: ఇక్కడ אָדָם ఒక నిర్దిష్ట పురుషుణ్ణి కాక మానవజాతికి చెందిన వ్యక్తిని సూచిస్తుంది. ‘మనుష్యులలో నుండి’ అనే రూపం మూలంలోని వర్గ/సమూహ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִפָּדֶה
  choice: విమోచించకూడదు
  rationale: פדה అంటే వెల చెల్లించి విడిపించడం లేదా తిరిగి పొందడం. లేవీయకాండము 27లోని అర్పణలు, విలువ నిర్ణయం, తిరిగి పొందడం అనే న్యాయపరమైన సందర్భానికి ‘విమోచించు’ సరిపోతుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పక చంపాలి
  rationale: క్రియానామం మరియు పరిమిత క్రియ కలయిక మరణం అనివార్యమని బలంగా చెబుతుంది. ‘తప్పక’ ఆ తీవ్రతను, ‘చంపాలి’ మూలంలోని కారణార్థక నిష్క్రియ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మానవునికి వర్తించే חֵרֶם యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘సంపూర్ణ అర్పణగా అంకితం’ అనే ఆరాధనా-న్యాయ భాషను ఉంచి, మానవ వ్యక్తి అనే విషయాన్ని ‘ఎవరినీ’ ద్వారా స్పష్టం చేయడం.
  alternative: ‘మనుష్యులలో నాశనానికి అంకితం చేయబడిన ఎవరినీ’ అని అనువదించడం.
  rationale: ఈ వాక్యం חרם అనే అర్పణ/నిషేధ పదజాలాన్ని פדה అనే విమోచన పదంతోను, మరణ విధితోను కలుపుతుంది. ‘నాశనానికి’ అని ప్రధాన పాఠంలో చేర్చితే పదంలోని విస్తృత సాంకేతిక భావం ఒకే వివరణకు పరిమితమవుతుంది; అందువల్ల ఆ వివరణను పాదసూచికలో ఉంచాం.
- issue: אָדָם యొక్క సూచన మరియు సర్వనామ అన్వయం
  choice: ‘మనుష్యులలో నుండి ... ఎవరినీ’; తరువాత ‘ఆ వ్యక్తిని’.
  alternative: ‘మనిషి నుండి ... ఏ అర్పితమైనదీ; దానిని’.
  rationale: వ్యాకరణపరంగా חֵרֶם వస్తువు లేదా వ్యక్తిని సూచించగలిగినా, מִן הָאָדָם మరియు మరణ విధి ఇక్కడ మానవ వ్యక్తినే ఉద్దేశిస్తున్నాయని చూపుతాయి. తెలుగు ప్రధాన పాఠంలో అర్థరహితమైన వస్తు సర్వనామాన్ని నివారిస్తూ, నామవాచకంలోని సాంకేతిక అస్పష్టతను పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఆరాధనా శైలిని ఉపయోగించాం. ‘సంపూర్ణ అర్పణ’ సాంకేతిక భావాన్ని మోయగా, ‘ఎవరినీ’ మరియు ‘ఆ వ్యక్తిని’ ఈ సందర్భంలోని మానవ సూచనను సాధారణ పాఠకునికి స్పష్టం చేస్తాయి. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
