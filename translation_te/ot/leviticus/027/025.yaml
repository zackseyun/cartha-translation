id: LEV.27.25
reference: Leviticus 27:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל עֶרְכְּ/ךָ֔ יִהְיֶ֖ה בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה יִהְיֶ֥ה הַ/שָּֽׁקֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: te
  text: నీవు నిర్ణయించే ప్రతి విలువ పరిశుద్ధస్థలపు షెకెలు[a] ప్రకారం ఉండాలి; షెకెలు ఇరవై గేరాలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధ షెకెలు ప్రకారం.” హీబ్రూ పదబంధం పరిశుద్ధస్థలానికి సంబంధించిన విలువ నిర్ణయాలకు ఉపయోగించే ప్రామాణిక షెకెలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: నీ ప్రతి విలువ నిర్ణయం
  rationale: లేవీయకాండము 27లో ערך మొక్కుబడులకు సంబంధించిన వ్యక్తులు లేదా వస్తువులకు నిర్ణయించే విలువను సూచించే సాంకేతిక పదం. రెండవ పురుష ఏకవచన ప్రత్యయం ‘నీ’గా నిలుపబడింది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఈ పదబంధం పరిశుద్ధ స్థల సంబంధిత విలువ నిర్ణయాలకు ఉపయోగించే అధికారిక తూకపు ప్రమాణాన్ని సూచిస్తుంది; కేవలం నైతికంగా ‘పవిత్రమైన’ షెకెలు అనే భావం రాకుండా ‘ప్రమాణం ప్రకారం’ అని స్పష్టం చేయబడింది.
- source_word: גֵּרָה
  choice: గేరాలు
  rationale: గేరా చిన్న తూకపు లేదా ద్రవ్య ప్రమాణం. సహజమైన తెలుగు సమానార్థక ప్రమాణం లేకపోవడంతో లిప్యంతరీకరణ చేయబడింది.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: ఒక షెకెలు ఇరవై గేరాలు
  rationale: ఈ వాక్యభాగం షెకెలు ప్రమాణాన్ని నిర్వచిస్తుంది. తెలుగులో సహజంగా, సంక్షిప్తంగా ఉండేలా ‘ఒక’ చేర్చబడింది; పరిమాణ సమానత్వ భావం నిలుపబడింది.
- source_word: וְכָל
  choice: నీ ప్రతి
  rationale: כָל యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో సహజత్వం కోసం సంధి ప్రత్యేకంగా అనువదించబడలేదు; ముందున్న సందర్భంతో కొనసాగింపు విరగదు.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: ధర్మశాస్త్ర సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘ఉండాలి’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర వచనానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. ‘షెకెలు,’ ‘గేరా’ అనే ప్రాచీన ప్రమాణాల పేర్లను లిప్యంతరీకరించాం; సాంకేతిక భావాన్ని కాపాడేందుకు ‘విలువ నిర్ణయం,’ ‘ప్రమాణం ప్రకారం’ అనే పదబంధాలు వాడాం.
