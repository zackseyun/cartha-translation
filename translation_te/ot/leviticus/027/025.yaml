- from: నీ ప్రతి విలువ నిర్ణయం పరిశుద్ధ స్థలపు షెకెలు[a] ప్రమాణం ప్రకారం ఉండాలి; ఒక షెకెలు ఇరవై గేరాలు.
  to: నీవు నిర్ణయించే ప్రతి విలువ పరిశుద్ధస్థలపు షెకెలు[a] ప్రకారం ఉండాలి; షెకెలు ఇరవై గేరాలు ఉండాలి.
