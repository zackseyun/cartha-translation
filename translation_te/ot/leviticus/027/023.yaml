revisions:
- from: అప్పుడు యాజకుడు అతని కోసం సునాద సంవత్సరంవరకు నీ నిర్ధారిత విలువలో చెల్లించవలసిన భాగాన్ని లెక్కించాలి. అతడు ఆ రోజే ఆ నిర్ధారిత మొత్తాన్ని యెహోవాకు పవిత్రమైన అర్పణగా[a] ఇవ్వాలి.
  to: అప్పుడు యాజకుడు యోబేలు సంవత్సరం వరకు నీ అంచనా విలువకు తగిన మొత్తాన్ని లెక్కించాలి. ఆ వ్యక్తి ఆ రోజున ఆ అంచనా విలువను యెహోవాకు పవిత్రమైనదిగా[a] ఇవ్వాలి.
  rationale: The revision corrects the Jubilee term, renders the calculated amount without importing an unnecessary “payable portion” interpretation, and keeps the consecration formula close to the Hebrew. “ఆ వ్యక్తి” is supplied only to resolve the implicit-subject ambiguity in fluent Telugu, in line with the preceding context in which the priest calculates and the concerned person gives the amount.
