source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడు యోబేలు సంవత్సరం వరకు నీ అంచనా విలువకు తగిన మొత్తాన్ని లెక్కించాలి. ఆ వ్యక్తి ఆ రోజున ఆ అంచనా విలువను యెహోవాకు పవిత్రమైనదిగా[a] ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘యెహోవాకు పవిత్రమైనది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: అప్పుడు ... లెక్కించాలి
  rationale: פיעל రూపంలోని חשׁב ఇక్కడ మొత్తాన్ని గణించడం లేదా లెక్కకట్టడం సూచిస్తుంది; వావ్‌ను సందర్భానుగుణ క్రమసూచకమైన ‘అప్పుడు’గా సహజంగా వ్యక్తపరచింది.
- source_word: לּוֹ
  choice: అతని కోసం
  rationale: ఈ దత్తివ సర్వనామం యాజకుడు సంబంధిత వ్యక్తి కోసం మొత్తాన్ని లెక్కిస్తాడని సూచిస్తుంది.
- source_word: מִכְסַת
  choice: చెల్లించవలసిన భాగం
  rationale: מִכְסָה నిర్ణీత మొత్తం లేదా అనుపాత భాగాన్ని సూచిస్తుంది. సునాద సంవత్సరంవరకు మిగిలిన కాలానికి అనుగుణంగా విలువను లెక్కించే సందర్భంలో ‘భాగం’ భావాన్ని స్పష్టంగా అందిస్తుంది; ‘చెల్లించవలసిన’ది సందర్భం ద్వారా అంతర్భూతమైన ఆర్థిక బాధ్యతను తెలుపుతుంది.
- source_word: הָעֶרְכְּךָ
  choice: నీ నిర్ధారిత విలువ / ఆ నిర్ధారిత మొత్తం
  rationale: లేవీయకాండము 27లో עֵרֶךְ మొక్కుబడికి సంబంధించిన సాంకేతికంగా నిర్ణయించిన విలువ. మొదటి సందర్భంలో ఉన్న ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’గా నిలిపి, పునరుక్తిలో సహజ తెలుగు కోసం ‘ఆ నిర్ధారిత మొత్తం’ అని పేర్కొంది.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: సునాద సంవత్సరంవరకు
  rationale: ఈ పదబంధం అనుపాత లెక్కకు చివరి కాలపరిమితిని సూచిస్తుంది. ‘సునాద సంవత్సరం’ యోబేలు వ్యవస్థకు తెలుగు బైబిలు వాడుకలో అర్థవంతమైన సంస్థాగత పేరు.
- source_word: וְנָתַן
  choice: అతడు ... ఇవ్వాలి
  rationale: נתן యొక్క సాధారణ అర్థం ‘ఇవ్వడం’. మూలంలో కర్త స్పష్టంగా చెప్పబడనందున ‘అతడు’ అనే విస్తృత రూపాన్ని ఉంచి, చెల్లింపు అని మరీ నిర్దిష్టం చేయలేదు.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: కాలసూచక పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘ఏ’ అదే రోజున ఇవ్వాలనే తక్షణతను వ్యక్తపరుస్తుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యెహోవాకు పవిత్రమైన అర్పణగా
  rationale: అక్షరార్థం ‘యెహోవాకు పవిత్రమైనది’. ఇక్కడ ఇవ్వబడేది నిర్ధారిత మొత్తం కాబట్టి, దాని ఆరాధనాత్మక ప్రతిష్ఠను సహజ తెలుగులో తెలియజేయడానికి ‘అర్పణగా’ చేర్చింది; మరింత రూపానుగుణ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన నామరూపంలో అందించి, కేవలం బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: וְנָתַן అనే క్రియకు అంతర్భూత కర్త
  choice: పొలానికి సంబంధించిన వ్యక్తే ఇచ్చేవాడని సందర్భం సూచించినప్పటికీ, పాఠ్యంలో ‘అతడు’ అని మాత్రమే ఉంచడం
  alternative: యాజకుడే ఇస్తాడని అర్థం చేసుకోవడం
  rationale: యాజకుడు లెక్కిస్తాడు; మునుపటి సందర్భంలో పొలాన్ని ప్రతిష్ఠించిన లేదా విడిపించుకునే వ్యక్తి నిర్ధారిత మొత్తాన్ని ఇస్తాడు. అయినా హీబ్రూలో కర్త పేరుతో పునరుక్తి కాలేదు కాబట్టి అనువాదంలో దానిని మరీ స్పష్టీకరించకుండా ‘అతడు’ అని ఉంచింది.
- issue: קֹדֶשׁ לַיהוָה యొక్క ఆరాధనాత్మక భావం
  choice: ‘యెహోవాకు పవిత్రమైన అర్పణగా’
  alternative: ‘యెహోవాకు పవిత్రమైనదిగా’
  rationale: ఈ మాట మొత్తం యెహోవాకు ప్రతిష్ఠించబడిందని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజత కోసం ‘అర్పణ’ను ఉపయోగించి, మూలానికి మరింత రూపానుగుణమైన పఠనాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడింది. ‘నిర్ధారిత విలువ’ అనే పదబంధం ఈ అధ్యాయంలోని సాంకేతిక అంచనా భావాన్ని నిలుపుతుంది; రెండో వాక్యంలో సహజత కోసం దానిని ‘నిర్ధారిత మొత్తం’గా తెలిపింది. పాదటిప్పణి గుర్తు సంబంధిత קֹדֶשׁ לַיהוָה పదబంధం వద్దనే ఉంచబడింది.
