  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: te
  text: అయితే, ఆ పొలం యూబిలీ సంవత్సరంలో విడుదలైనప్పుడు, అది యెహోవాకు పరిశుద్ధమైనదిగా ఉంటుంది; తిరిగి తీసుకోలేని విధంగా అంకితమైన పొలంలా[a] అది యాజకుని భూస్వాస్థ్యమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తిరిగి తీసుకోలేని విధంగా అంకితమైన పొలం” అని అనువదించిన హీబ్రూ పదం, యెహోవాకు ఉపసంహరించలేని విధంగా అంకితం చేసి సాధారణ మానవ వినియోగం నుండి తొలగించిన దానిని సూచిస్తుంది. దీనిని “నిషేధానికి అప్పగించబడినది” అని కూడా అనువదించవచ్చు; కొన్ని సందర్భాల్లో దీనిలో నాశనం అనే భావం ఉంటుంది.
    reason: חֵרֶם పదంలోని ఉపసంహరించలేని అంకితం మరియు సాధారణ వినియోగం నుండి తొలగింపు అనే ప్రధాన భావాన్ని కాపాడుతూ, సందర్భానుసారమైన నిషేధం/నాశనం అర్థాలను పాదసూచికలో సూచించడానికి.
lexical_decisions:
- source_word: וְהָיָה
  choice: అయితే ... ఉండాలి
  rationale: మునుపటి వచనంలోని విమోచన పరిస్థితికి భిన్నమైన న్యాయపరమైన ఫలితాన్ని చూపుతూ, వావ్ యొక్క కొనసాగింపు మరియు పరిణామ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలం
  rationale: ముందుగా ప్రస్తావించిన నిర్దిష్ట పొలాన్నే సూచిస్తున్నందున తెలుగు సందర్భంలో ‘ఆ పొలం’ సహజంగా ఉంది.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: సునాద సంవత్సరంలో విడుదలైనప్పుడు
  rationale: అక్షరార్థంగా ‘అది బయటికి వెళ్లినప్పుడు’; సునాద సంవత్సరపు ఆస్తి చట్ట సందర్భంలో ఇది ఆస్తి విడుదలను సూచిస్తుంది. ‘విడుదలైనప్పుడు’ ఆ న్యాయార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యెహోవాకు ప్రతిష్ఠితమైనదిగా
  rationale: ఆ పొలం సాధారణ వినియోగం నుండి వేరుచేయబడి యెహోవాకు చెందిన పవిత్రమైనదవుతుందనే నిబంధనాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవనామాన్ని పేరుగా నిలుపుతూ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: శాశ్వతంగా అంకితం చేసిన పొలంలా
  rationale: חֵרֶם యొక్క తిరిగి తీసుకోలేని అంకిత భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో వచనం ప్రత్యక్షంగా విధ్వంసాన్ని చెప్పనందున ‘నాశనానికి అంకితం’ అనే విస్తరణను ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: అది యాజకుని స్వాస్థ్యమవుతుంది
  rationale: లామెద్ సూచించే కేటాయింపు/స్వామ్యాన్ని, అֲחֻזָּה యొక్క భూస్వాస్థ్య న్యాయార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חֵרֶם అనే పదాన్ని పరిశుద్ధతా చట్ట సందర్భంలో అనువదించడం
  choice: శాశ్వతంగా అంకితం చేసిన పొలం
  alternative: నాశనానికి అంకితం చేసిన పొలం; నిషేధానికి లోబడిన పొలం
  rationale: ఈ పదం యెహోవాకు తిరిగి తీసుకోలేని విధంగా అంకితం చేసి సాధారణ మానవ వినియోగం నుండి తొలగించినదాన్ని సూచిస్తుంది. కొన్ని సందర్భాల్లో నాశనం కూడా ఇందులో ఉండవచ్చు; అయితే ఈ ఆస్తి చట్ట సందర్భంలో శాశ్వత అంకితమే పోలికలో ప్రధానాంశం. అందువల్ల ప్రధాన పాఠ్యం అనవసరంగా నాశన భావాన్ని నిర్ధారించదు; పాదసూచిక పదంలోని విస్తృత భావాన్ని తెలియజేస్తుంది.
- issue: దైవనామం יהוה యొక్క ప్రతినిధిత్వం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠ్యంలో స్పష్టంగా నిలుపుతుంది; ఒక బిరుదుతో దానిని భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి. ‘సునాద సంవత్సరం,’ ‘ప్రతిష్ఠితం,’ ‘స్వాస్థ్యం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉపయోగించగా, వాక్య నిర్మాణం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది.
