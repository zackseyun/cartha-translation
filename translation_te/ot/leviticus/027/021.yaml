revisions:
- from: అయితే ఆ పొలం[a] సునాద సంవత్సరంలో విడుదలైనప్పుడు, అది యెహోవాకు ప్రతిష్ఠితమైనదిగా ఉండాలి; శాశ్వతంగా అంకితం చేసిన పొలంలా అది యాజకుని స్వాస్థ్యమవుతుంది.
  to: అయితే, ఆ పొలం యూబిలీ సంవత్సరంలో విడుదలైనప్పుడు, అది యెహోవాకు పరిశుద్ధమైనదిగా ఉంటుంది; తిరిగి తీసుకోలేని విధంగా అంకితమైన పొలంలా[a] అది యాజకుని భూస్వాస్థ్యమవుతుంది.
  rationale: యూబిలీకి స్పష్టమైన ప్రామాణిక పదాన్ని ఉపయోగించాం; కֹדֶשׁను “పరిశుద్ధమైనది”గా ప్రత్యక్షంగా అనువదించాం; אֲחֻזָּהలోని భూమి-హక్కు భావాన్ని “భూస్వాస్థ్యం”తో నిలిపాం. חֵרֶםను ప్రధాన పాఠ్యంలో ‘నాశనానికి అంకితం’గా అధికంగా నిర్దిష్టం చేయకుండా ఉపసంహరించలేని అంకితంగా అనువదించి, దాని విస్తృత భావపరిధిని పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తును సంబంధిత పదబంధానికి మార్చాం.
