id: LEV.27.2
reference: Leviticus 27:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: te
  text: '“ఇశ్రాయేలీయులతో ఇలా చెప్పు: ‘ఒక పురుషుడు యాహ్వేకు వ్యక్తుల విలువ నిర్ణయానికి సంబంధించిన ప్రత్యేక మొక్కుబడి చేస్తే,’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదబంధం క్లిష్టంగా ఉంది. మరో అనువాదం: “ఒక పురుషుడు వ్యక్తుల విషయంలో నీవు నిర్ణయించే విలువ ప్రకారం ప్రత్యేక మొక్కుబడి చేస్తే.” తరువాతి వచనాలు వ్యక్తుల కోసం నిర్ణయించే విలువలను వివరిస్తాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో ఇలా చెప్పు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరార్థ రూపం తెలుగులో సహజంగా లేకపోవడంతో, ఇశ్రాయేలు ప్రజలను సూచించే ప్రామాణికమైన ‘ఇశ్రాయేలీయులు’ వాడబడింది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: మూలంలోని ఏకవచన పుంలింగ న్యాయసూత్ర రూపాన్ని నిలుపుతుంది.
- source_word: יַפְלִא נֶדֶר
  choice: ప్రత్యేక మొక్కుబడి చేస్తే
  rationale: יַפְלִא ఇక్కడ సాధారణ మొక్కుబడికి భిన్నమైన, ప్రత్యేకంగా ప్రతిష్ఠించే మొక్కుబడిని సూచిస్తుంది; ‘మొక్కుబడి చేయడం’ సహజమైన తెలుగు న్యాయ-మత ప్రయోగం.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: వ్యక్తుల నిర్ణీత విలువకు సంబంధించిన
  rationale: ఈ క్లిష్టమైన పదబంధాన్ని తరువాతి వచనాల్లో నిర్దేశించబడే వ్యక్తుల విలువ అంచనాతో అనుసంధానిస్తూ, కృత్రిమమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని వ్యక్తినామంగానే నిలుపుతూ, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: אִישׁ అనే పుంలింగ న్యాయసూత్ర పదం
  choice: ఒక పురుషుడు
  alternative: ఎవరైనా / ఒక వ్యక్తి
  rationale: మూలంలోని వ్యాకరణ లింగాన్ని నిలుపుతుంది; దాని న్యాయసూత్ర ప్రాతినిధ్య పరిధిని అనవసరంగా విస్తరించదు లేదా కుదించదు.
- issue: בְּעֶרְכְּךָ נְפָשֹׁת యొక్క అస్పష్ట నిర్మాణం
  choice: వ్యక్తుల నిర్ణీత విలువకు సంబంధించిన
  alternative: నీవు వ్యక్తులకు నిర్ణయించే విలువ ప్రకారం
  rationale: మూలంలోని రెండవ పురుష ఏకవచన ప్రత్యయాన్ని తెలుగులో బలవంతంగా మోషే వ్యక్తిగత అంచనాగా చూపకుండా, తరువాతి నియమాల్లోని నిర్ణీత విలువల భావాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘మొక్కుబడి,’ ‘నిర్ణీత విలువ,’ ‘వ్యక్తులు’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని న్యాయపరమైన భావాన్ని నిలుపుతాయి.
