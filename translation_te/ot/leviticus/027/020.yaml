  source_fidelity: మూలంలోని గోఅల్ (גאל) న్యాయపరమైన ‘విమోచన/తిరిగి స్వాధీనం చేసుకోవడం’ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచాలి. అలాగే מָכַר యొక్క పూర్తయిన అమ్మకాన్ని ‘అమ్మివుంటే’ అని ఇవ్వడం సందర్భానికి మరింత దగ్గరగా ఉంటుంది.
