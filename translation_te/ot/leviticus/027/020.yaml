id: LEV.27.20
reference: Leviticus 27:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: te
  text: అయితే అతడు ఆ పొలాన్ని విమోచించకపోతే, లేదా దానిని వేరొక మనిషికి[a] అమ్మివుంటే, ఇక అది మళ్లీ విమోచించబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరొక వ్యక్తికి.’ హీబ్రూలో, ‘వేరొక మనిషికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … పోతే / లేదా … తే
  rationale: ఈ సంధిపదాలు ముందరి వచనంలోని నియమాన్ని షరతులతో కొనసాగిస్తున్నాయి. తెలుగులో ‘అయితే’ మరియు ‘లేదా’ ద్వారా ఆ కొనసాగింపు, ప్రత్యామ్నాయ షరతు సహజంగా వ్యక్తమవుతాయి.
- source_word: יִגְאַל / יִגָּאֵל
  choice: విడిపించుకోకపోతే / విడిపించబడదు
  rationale: గאל్ ఇక్కడ ప్రతిష్ఠించిన ఆస్తిని నిర్ణీత విధంగా తిరిగి పొందడాన్ని సూచించే న్యాయ-పవిత్రపరమైన పదం. కర్తరి రూపంలో ‘విడిపించుకో’ మరియు కర్మణి రూపంలో ‘విడిపించబడదు’ అని ఇవ్వడం మూలంలోని రూపభేదాన్ని నిలుపుతుంది.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలం
  rationale: ఇది ముందే ప్రస్తావించిన నిర్దిష్టమైన సాగుభూమిని సూచిస్తుంది; విస్తృతార్థకమైన ‘భూమి’ కంటే ‘పొలం’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: מָכַר
  choice: అమ్మితే
  rationale: షరతు వాక్యంలో జరిగిన అమ్మకం వల్ల కలిగే న్యాయపరమైన ఫలితాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְאִישׁ אַחֵר
  choice: వేరొక పురుషునికి
  rationale: אישׁ యొక్క మూల masculine singular రూపాన్ని నిలుపుతూ, న్యాయసందర్భంలో అది సాధారణంగా ‘వేరొక వ్యక్తి’ని కూడా సూచించవచ్చని పాదసూచికలో తెలియజేశాం.
- source_word: עוֹד
  choice: ఇక మరెప్పుడూ
  rationale: అమ్మకం తర్వాత మళ్లీ విమోచించే అవకాశం ఉండదనే శాశ్వత న్యాయపరమైన పరిమితిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయసూత్రంలోని పుంలింగ సాధారణ ప్రయోగం
  choice: వేరొక పురుషునికి
  alternative: వేరొక వ్యక్తికి
  rationale: మూలంలోని אישׁ పుంలింగ ఏకవచన నామవాచకం. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, న్యాయప్రయోగంలో ఉండగల సాధారణ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- issue: גאל్ పదంలోని న్యాయ-పవిత్రపరమైన భావం
  choice: విడిపించుకో / విడిపించబడదు
  alternative: తిరిగి కొనుక్కో / తిరిగి పొందు
  rationale: ఇది కేవలం సాధారణ కొనుగోలు కాదు; ప్రతిష్ఠించిన ఆస్తిని నియమిత మూల్యం చెల్లించి తిరిగి పొందే ప్రక్రియ. ‘విడిపించు’ ఆ సాంకేతిక భావాన్ని నిలుపుతూ అనవసరమైన సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన షరతు నిర్మాణాన్ని వాడుతూ, లేవీయకాండంలోని న్యాయ-పవిత్రపరమైన గంభీరతను నిలిపాం. క్రియ యొక్క కర్తరి, కర్మణి రూపభేదాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించాం.
