- from: కానీ దానిని ప్రతిష్ఠించినవాడే ఆ పొలాన్ని తప్పకుండా విడిపించుకోవాలనుకుంటే,[a] నీవు నిర్ణయించిన విలువకు ఐదవ వంతు సొమ్మును అదనంగా చెల్లించాలి; అప్పుడు అది అతనిదవుతుంది.[b]
  to: కానీ దానిని ప్రతిష్ఠించినవాడు[a] ఆ పొలాన్ని నిజంగా విమోచించుకుంటే, నీవు నిర్ణయించిన అంచనా విలువలో ఐదవ వంతు వెండిని దానికి అదనంగా చెల్లించాలి; అప్పుడు అది అతనికి చెందుతుంది.[b]
