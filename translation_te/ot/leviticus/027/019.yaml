source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: te
  text: కానీ దానిని ప్రతిష్ఠించినవాడు[a] ఆ పొలాన్ని నిజంగా విమోచించుకుంటే, నీవు నిర్ణయించిన అంచనా విలువలో ఐదవ వంతు వెండిని దానికి అదనంగా చెల్లించాలి; అప్పుడు అది అతనికి చెందుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రతిష్ఠించిన” అనే మాటకు “అంకితం చేసిన” లేదా “పవిత్రంగా ప్రత్యేకించిన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అది అతనికి స్థిరపడుతుంది”; అంటే, అది అతనికి చెందుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కానీ ... అయితే
  rationale: ముందటి నియమానికి షరతుతో కూడిన కొనసాగింపును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: גָּאֹל יִגְאַל
  choice: తప్పకుండా విడిపించుకోవాలనుకుంటే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని నిలుపుతూ, ఆస్తిని నిర్ణీత మొత్తం చెల్లించి తిరిగి పొందే న్యాయపరమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలాన్ని
  rationale: మునుపటి వచనాల్లో ప్రస్తావించిన నిర్దిష్టమైన సాగుభూమిని సూచిస్తుంది.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: దానిని ప్రతిష్ఠించినవాడే
  rationale: ఆ పొలాన్ని యెహోవాకు పవిత్రంగా ప్రత్యేకించిన వ్యక్తిని సూచించే ఆరాధనా సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: וְיָסַף חֲמִשִׁית כֶּסֶף עֶרְכְּךָ עָלָיו
  choice: నీవు నిర్ణయించిన విలువకు ఐదవ వంతు సొమ్మును అదనంగా చెల్లించాలి
  rationale: అక్షరార్థమైన ‘నీ విలువ నిర్ణయపు వెండిలో ఐదవ వంతు’ అనే న్యాయపరమైన మొత్తాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; రెండవ పురుష సంబోధనను నిలుపుతుంది.
- source_word: וְקָם לוֹ
  choice: అప్పుడు అది అతనిదవుతుంది
  rationale: ‘అది అతనికి స్థిరపడుతుంది’ అనే హీబ్రూ న్యాయపరమైన నుడికారాన్ని సహజమైన యాజమాన్య ఫలితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הקדישׁ అనే ఆరాధనా సంబంధ క్రియ
  choice: ప్రతిష్ఠించిన
  alternative: అంకితం చేసిన; పవిత్రపరచిన
  rationale: ఆస్తిని యెహోవాకు పవిత్రంగా ప్రత్యేకించే భావాన్ని నిలుపుతుంది; కేవలం లౌకిక విరాళంగా భావించేలా చేయదు.
- issue: న్యాయవాక్యంలోని క్రియల విధి/ఫలిత భావం
  choice: చెల్లించాలి; అతనిదవుతుంది
  alternative: చెల్లిస్తాడు; అతనికి నిలుస్తుంది
  rationale: లేవీయకాండము 27లోని శాసన సందర్భానికి అనుగుణంగా మొదటి క్రియలో విధిని, చివరి క్రియలో దాని న్యాయపరమైన ఫలితాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి. ‘విడిపించుకోవడం’ ఆస్తిని నిర్ణీత మొత్తం చెల్లించి తిరిగి పొందడాన్ని సూచిస్తుంది. మూలంలోని ‘నీవు నిర్ణయించిన విలువ’ అనే రెండవ పురుష రూపం నిలుపబడింది.
