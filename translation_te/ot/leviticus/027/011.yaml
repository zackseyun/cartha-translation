id: LEV.27.11
reference: Leviticus 27:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: te
  text: అయితే, దాని నుండి యాహ్వేకు అర్పణను అర్పించరాని అశుద్ధమైన జంతువు ఏదైనా అయితే, అతడు ఆ జంతువును యాజకుని ఎదుట నిలబెట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... అయితే
  rationale: ముందటి నియమానికి భిన్నమైన షరతును పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజమైన షరతు నిర్మాణాన్ని ఉపయోగించాం.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: ఏదైనా అపవిత్రమైన జంతువు
  rationale: כָּל కు ఇక్కడ అనిర్దిష్ట భావం ఉంది. טָמֵא ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; సాధారణ మురికిని కాదు.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: అర్పణగా అర్పించకూడని
  rationale: యַקְרִיבוּ సాధారణ/వ్యక్తిరహిత బహువచనం; తెలుగులో ‘అర్పించకూడని’ అని సహజంగా వ్యక్తమవుతుంది. מִמֶּנָּה యొక్క ‘దానిలోనుండి’ భావం సందర్భానుసారంగా అర్పణకు ఉపయోగించరాని జంతువు అనే అర్థంలో సమగ్రంగా ప్రతిబింబిస్తుంది.
- source_word: קָרְבָּן
  choice: అర్పణ
  rationale: దేవుని సన్నిధికి తీసుకువచ్చే బలి కానుకకు సాధారణంగా అర్థమయ్యే ఆరాధనా పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ వ్యక్తినామమైన יהוהను తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: וְהֶעֱמִיד
  choice: నిలబెట్టాలి
  rationale: עמד హిఫీల్ రూపం ‘నిలిచేలా చేయడం’ అని అర్థం; జంతువును యాజకుని ఎదుట ఉంచే న్యాయపరమైన చర్యను స్పష్టంగా తెలుపుతుంది.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: యాజకుని ఎదుట
  rationale: మూలంలోని స్థానిక/సన్నిధి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తుపట్టే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: טְמֵאָה యొక్క ఆచారపరమైన భావం
  choice: అపవిత్రమైన
  alternative: అశుద్ధమైన
  rationale: లేవీయకాండ సందర్భంలో ఇది భౌతిక మురికి కాక ఆచారపరమైన స్థితిని సూచిస్తుంది; ‘అపవిత్రమైన’ ఆ భేదాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. హీబ్రూ వ్యక్తిరహిత బహువచనాన్ని తెలుగులో సహజమైన ‘అర్పించకూడని’ నిర్మాణంతో వ్యక్తం చేశాం; అనవసరంగా కర్తను చేర్చలేదు.
