id: LEV.27.3
reference: Leviticus 27:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: te
  text: ఇరవై సంవత్సరాల వయసు నుండి అరవై సంవత్సరాల వయసు వరకు ఉన్న పురుషునికి నీ మదింపు పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం యాభై షెకెలుల వెండి ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: నీవు నిర్ణయించవలసిన విలువ
  rationale: עֵרֶךְ ఇక్కడ వ్యక్తి అంతర్గత విలువను కాక, మొక్కుబడి సందర్భంలో నియమించబడే ఆచార-న్యాయపరమైన మదింపును సూచిస్తుంది. రెండవ పురుష ఏకవచన ప్రత్యయాన్ని కూడా ఈ రూపం వ్యక్తపరుస్తుంది.
- source_word: הַזָּכָר
  choice: పురుషునికి
  rationale: హీబ్రూ పదం లింగాన్ని స్పష్టంగా సూచిస్తూ, వయస్సు-లింగం ఆధారిత మదింపు వర్గాన్ని నిర్వచిస్తుంది; దానిని లింగతటస్థంగా మార్చలేదు.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అరవై ఏళ్ల వయసు వరకు ఉన్న
  rationale: మూలంలోని వయోపరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: యాభై షెకెలుల వెండి
  rationale: ఇది లోహం మరియు తూకపు ప్రమాణాన్ని తెలిపే పదబంధం. ప్రాచీన ప్రమాణమైన ‘షెకెలు’ను లిప్యంతరీకరించి, ‘వెండి’ని స్పష్టంగా ఉంచింది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: בְּ ఇక్కడ కొలత ప్రమాణాన్ని సూచిస్తుంది; הַקֹּדֶשׁ ఆ ప్రమాణం పరిశుద్ధస్థలంతో అనుబంధించబడినదని తెలుపుతుంది.
- source_word: וְהָיָה ... וְהָיָה
  choice: ఉండాలి
  rationale: ఈ సందర్భంలోని న్యాయపరమైన నిర్దేశక భావాన్ని ఆధునిక తెలుగులో ‘ఉండాలి’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లింగాధారిత మదింపు వర్గం
  choice: పురుషునికి
  alternative: మనిషికి
  rationale: మూలపాఠం వయస్సుతోపాటు లింగం ఆధారంగా కూడా మదింపు వర్గాన్ని నిర్దేశిస్తుంది. అందువల్ల పురుషలింగ సూచనను తటస్థీకరించలేదు.
- issue: עֵרֶךְ యొక్క స్వభావం
  choice: నిర్ణయించవలసిన విలువ
  alternative: వ్యక్తిగత విలువ
  rationale: ఇది వ్యక్తి గౌరవం లేదా సహజ విలువపై తీర్పు కాదు; మొక్కుబడికి సంబంధించిన నిర్దిష్ట ఆచార-న్యాయపరమైన మదింపు.
- issue: పరిశుద్ధస్థలపు షెకెలు
  choice: కొలత ప్రమాణంగా వ్యక్తీకరణ
  alternative: పరిశుద్ధమైన షెకెలు
  rationale: ఈ పదబంధం షెకెలు యొక్క నైతిక లేదా స్వభావగత పరిశుద్ధతను కాక, పరిశుద్ధస్థలానికి సంబంధించిన అధికారిక తూకపు ప్రమాణాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయ-ఆచార శైలి. ‘షెకెలు’ అనే చారిత్రక తూకపు పదాన్ని నిలిపి, మూలంలోని రెండవ పురుష సూచనను మరియు నిర్దేశక బలాన్ని సహజంగా వ్యక్తపరిచింది.
