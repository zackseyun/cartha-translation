revisions:
- from: ఇరవై ఏళ్ల వయసు మొదలుకొని అరవై ఏళ్ల వయసు వరకు ఉన్న పురుషునికి నీవు నిర్ణయించవలసిన విలువ పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం యాభై షెకెలుల వెండి ఉండాలి.
  to: ఇరవై సంవత్సరాల వయసు నుండి అరవై సంవత్సరాల వయసు వరకు ఉన్న పురుషునికి నీ మదింపు పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం యాభై షెకెలుల వెండి ఉండాలి.
