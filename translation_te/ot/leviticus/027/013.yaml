id: LEV.27.13
reference: Leviticus 27:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם גָּאֹ֖ל יִגְאָלֶ֑/נָּה וְ/יָסַ֥ף חֲמִישִׁת֖/וֹ עַל עֶרְכֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: te
  text: అయితే అతడు దానిని తప్పక విడిపించుకుంటే[a], నీవు నిర్ణయించిన విలువకు ఆ విలువలో ఐదవ వంతును కలపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని విడిపించుకుంటే” / “దానిని నిశ్చయంగా విడిపించుకుంటే”; హీబ్రూలో ఒకే క్రియకు చెందిన క్రియానామం, సమాపక క్రియ కలిసి వచ్చి క్రియను ఉద్ఘాటిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... అనుకుంటే
  rationale: ముందటి వచనంలోని నియమానికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: దాన్ని తప్పక విడిపించుకోవాలనుకుంటే
  rationale: గאל క్రియలోని తిరిగి స్వాధీనం చేసుకునే భావాన్ని ‘విడిపించుకోవడం’ తెలియజేస్తుంది; infinitive absolute + finite verb ఇచ్చే నిశ్చయార్థక ఉద్ఘాటనను ‘తప్పక’ నిలుపుతుంది. న్యాయసందర్భంలో imperfect రూపం సంకల్పాన్ని కూడా సూచించగలదని షరతు వాక్యంలో ‘అనుకుంటే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיָסַף
  choice: కలపాలి
  rationale: షరతుకు అనుసరించే తప్పనిసరి న్యాయపరమైన ఫలితాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲמִישִׁתוֹ
  choice: దానిలో ఐదవ వంతును
  rationale: ‘ఐదవ వంతు’ అనే నిష్పత్తిని నిలుపుతూ, ప్రత్యయం సూచించే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל עֶרְכֶּךָ
  choice: నీవు నిర్ణయించిన విలువకు
  rationale: עֵרֶךְ ఇక్కడ అధికారికంగా నిర్ణయించిన విలువను సూచిస్తుంది; రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీవు’గా స్పష్టంగా ఉంచి, עַל యొక్క అదనంగా కలిపే భావాన్ని ‘-కు’ ద్వారా తెలియజేస్తుంది.
