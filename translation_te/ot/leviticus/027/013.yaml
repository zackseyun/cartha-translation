translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘విడిపించుకోవడం’ అనేది అంకితమైన జంతువును నిర్ణీత చెల్లింపుతో తిరిగి స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది.
