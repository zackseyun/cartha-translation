  terminology: ‘మార్చు’ and ‘బదులుగా పెట్టు’ appropriately preserve a workable distinction between the two related Hebrew verbs. ‘పవిత్రమైనవి’ accurately conveys the sacred status denoted by קֹדֶשׁ.
