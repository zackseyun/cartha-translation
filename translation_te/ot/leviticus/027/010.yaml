language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: te
  text: దానిని మార్చకూడదు, దానికి బదులుగా మరొకదాన్ని పెట్టకూడదు[a]—చెడ్డదానికి బదులుగా మంచిదానిని గానీ, మంచిదానికి బదులుగా చెడ్డదానిని గానీ పెట్టకూడదు. ఒకవేళ అతడు ఒక జంతువుకు బదులుగా మరొక జంతువును తప్పకుండా పెడితే[b], అదీ దానికి బదులుగా పెట్టినదీ—రెండూ పవిత్రమైనవిగా ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘మార్చడం’ లేదా ‘బదులుగా పెట్టడం’ అనే భావాలు గల, పరస్పరం సంబంధమున్న రెండు వేర్వేరు క్రియలు వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ మూలంలో క్రియను బలపరిచే నిర్మాణం ఉంది: ‘ఒకవేళ అతడు తప్పకుండా బదులుగా పెడితే’ లేదా ‘నిజంగానే బదులుగా పెడితే.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: దానిని మార్చకూడదు
  rationale: חלף హిఫీల్ రూపం అంకితం చేసిన జంతువును మరొకదానితో మార్చడాన్ని సూచిస్తుంది. తరువాతి מוּר క్రియతో ఉన్న సూక్ష్మ భేదాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుటకు ‘మార్చు’ అని అనువదించబడింది.
- source_word: יָמִיר אֹתוֹ
  choice: దానికి బదులుగా మరొకదాన్ని పెట్టకూడదు
  rationale: מוּר ఇక్కడ ఒక జంతువు స్థానంలో మరొకదాన్ని పెట్టడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: మంచిదానికి బదులుగా చెడ్డదానినైనా, చెడ్డదానికి బదులుగా మంచిదానినైనా
  rationale: విశేషణాలు జంతువులను సూచించే నామవాచకాలుగా పనిచేస్తున్నాయి; ב మార్పిడిలో స్థానాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో అర్థం స్పష్టంగా ఉండేందుకు ‘దానిని’ చేర్చబడింది.
- source_word: וְאִם הָמֵר יָמִיר
  choice: ఒకవేళ అతడు … తప్పకుండా పెడితే
  rationale: క్రియానామ సంపూర్ణ రూపం మరియు సమాపక క్రియ కలయిక చర్యను బలపరుస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది; ఇది అనుమతిని సూచించదు.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: ఒక జంతువుకు బదులుగా మరొక జంతువును
  rationale: హీబ్రూ పునరుక్తి సూచించే పరస్పర ప్రత్యామ్నాయ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: అదీ దానికి బదులుగా పెట్టినదీ—రెండూ
  rationale: הוּא మూల జంతువును, תְמוּרָתוֹ దాని స్థానంలో పెట్టిన జంతువును సూచిస్తాయి. ద్వంద్వ ఫలితాన్ని స్పష్టంగా చూపేందుకు ‘రెండూ’ చేర్చబడింది.
- source_word: קֹדֶשׁ
  choice: పవిత్రమైనవిగా
  rationale: కֹדֶשׁ దేవునికి ప్రత్యేకించబడిన పవిత్ర స్థితిని సూచిస్తుంది. ‘పవిత్రమైనవి’ నేరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: మార్పిడి చేయడానికి ప్రయత్నించిన తరువాత మూల జంతువు మరియు ప్రత్యామ్నాయ జంతువు స్థితి
  choice: మూల జంతువూ దానికి బదులుగా పెట్టిన జంతువూ రెండూ పవిత్రమైనవిగా ఉంటాయి.
  alternative: ప్రత్యామ్నాయ జంతువు మాత్రమే పవిత్రమవుతుంది; లేదా ఈ వాక్యం రెండింటికీ పవిత్ర స్థితిని ఇవ్వకుండా మార్పిడి చెల్లదని మాత్రమే చెబుతుంది.
  rationale: הוּא וּתְמוּרָתוֹ … קֹדֶשׁ అనే వాక్యభాగం మూల జంతువుకూ దాని ప్రత్యామ్నాయానికీ పవిత్ర స్థితిని స్పష్టంగా వర్తింపజేస్తుంది. అందువల్ల ‘రెండూ’ అని పేర్కొనబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. రెండు హీబ్రూ క్రియల భేదాన్ని ‘మార్చు’ మరియు ‘బదులుగా పెట్టు’ ద్వారా సాధ్యమైనంతవరకు నిలిపి, ఉద్ఘాటక క్రియా నిర్మాణాన్ని [b]లో వివరించాం. ప్రధాన వాక్యంలో ప్రతి పాదసూచిక గుర్తు పొందుపరచబడింది.
