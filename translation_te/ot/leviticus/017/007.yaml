id: LEV.17.7
reference: Leviticus 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: te
  text: వారు ఇకమీదట తమ బలులను మేక-దయ్యాలకు[a] అర్పించకూడదు; వాటి వెంటే వ్యభిచారం చేస్తున్నారు[b]. ఇది వారికి తరతరాలపాటు శాశ్వతమైన శాసనంగా ఉండాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేక విగ్రహాలకు’ లేదా ‘మేకరూప ఆత్మలకు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం మేకలాంటి ప్రాణులను సూచిస్తుంది; ఇక్కడ అది అక్రమ ఆరాధనతో సంబంధమున్న మేక-సంబంధిత ప్రాణులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘వాటి వెంటే వ్యభిచారం చేస్తున్నారు.’ ఇది దేవునిపట్ల ఆధ్యాత్మిక అవిశ్వాసానికి, అంటే విగ్రహారాధనకు, వాడిన రూపకం.
    reason: cultural_note
  - marker: c
    text: ‘నిరంతరమైన శాసనం’ లేదా ‘ఎల్లకాలిక శాసనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: తమ బలులను ... అర్పించకూడదు
  rationale: నిషేధార్థక న్యాయ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. హీబ్రూలోని ధాతు-నామ పునరుక్తిని తెలుగులో యథాతథంగా ఉంచితే కృత్రిమంగా ఉండేందున ‘బలులను అర్పించు’ అనే సహజ కలయికను వాడాం.
- source_word: עוֹד
  choice: ఇకమీదట
  rationale: ఇప్పటివరకు జరిగిన లేదా కొనసాగుతున్న ఆచారం ఇక కొనసాగకూడదనే భావాన్ని తెలియజేస్తుంది.
- source_word: לַשְּׂעִירִם
  choice: మేకరూప దయ్యాలకు
  rationale: శబ్దానికి అక్షరార్థంగా ‘వెంట్రుకలుగలవి/మేకలు’ అనే నేపథ్యం ఉన్నా, ఈ ఆరాధనా సందర్భంలో మేకతో సంబంధమున్న దుష్టాత్మీయ ప్రాణులను సూచించే అవకాశం బలంగా ఉంది. ‘మేకరూప దయ్యాలు’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: వాటి వెంట వ్యభిచారులవలె పోతున్నారు
  rationale: విగ్రహారాధనను లైంగిక అవిశ్వాస రూపకంతో చెప్పిన హీబ్రూ తీవ్రతను నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా ‘వ్యభిచారులవలె’ అని ఇచ్చాం. אַחֲרֵיהֶם లోని ‘వాటి వెంట’ భావాన్నీ నిలిపాం.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: దీర్ఘకాలం లేదా నిరంతరం అమలులో ఉండే నియమం అనే న్యాయసూత్ర భావాన్ని గౌరవప్రదమైన, సులభమైన తెలుగులో తెలుపుతుంది; కాలవ్యాప్తి విషయంలోని మూలపద విస్తృతిని పాదటిప్పణిలో సూచించాం.
- source_word: לְדֹרֹתָם
  choice: తరతరాలపాటు
  rationale: వరుస తరాలన్నిటికీ వర్తించే కొనసాగింపును సహజమైన తెలుగు నుడికారంలో తెలియజేస్తుంది.
theological_decisions:
- issue: שְּׂעִירִם పదానికి అక్రమ ఆరాధన సందర్భంలోని సూచన
  choice: మేకరూప దయ్యాలు
  alternative: మేక విగ్రహాలు; మేకలాంటి ఆత్మప్రాణులు; మేకలు
  rationale: బలి అర్పించడం మరియు వెంటనే వచ్చే ఆధ్యాత్మిక వ్యభిచార రూపకం సాధారణ మేకలకంటే అక్రమ ఆరాధనకు సంబంధించిన దుష్టాత్మీయ లేదా విగ్రహ సంబంధ సూచనను బలపరుస్తాయి. అయితే మూలపదపు చిత్రాత్మక అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- issue: זֹנִים అనే ఆధ్యాత్మిక అవిశ్వాస రూపకం
  choice: వ్యభిచారులవలె పోతున్నారు
  alternative: విశ్వాసఘాతకులవుతున్నారు; విగ్రహారాధన చేస్తున్నారు
  rationale: మూలంలోని లైంగిక అవిశ్వాస రూపకాన్ని ‘విగ్రహారాధన’ అనే వివరణాత్మక పదంతో సమతలపరచకుండా నిలిపాం; ఉపమాన సూచన తెలుగులో రూపకార్థాన్ని గ్రహించడానికి తోడ్పడుతుంది.
- issue: עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన
  alternative: శాశ్వతకాలికమైన; నిరంతరమైన; శాశ్వతంగా అమలయ్యే
  rationale: న్యాయసూత్రంలో నిలకడైన కాలవ్యాప్తిని వ్యక్తం చేస్తుంది. హీబ్రూ పదం సందర్భానుసారం ‘నిరంతరమైన/ఎల్లకాలికమైన’ అనే పరిధిని కలిగి ఉండటాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ రూపకంలోని తీవ్రతను నిలిపి, దాని భావాన్ని పాఠ్యంలో అతిగా వ్యాఖ్యానించకుండా పాదటిప్పణిలో వివరించాం.
