id: LEV.17.13
reference: Leviticus 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల్లో ఏ పురుషుడైనా, లేదా వారి మధ్య నివసించే పరదేశి[a] ఎవరైనా, తినదగిన అడవి జంతువునైనా పక్షినైనా వేటాడితే, అతడు దాని రక్తాన్ని ఒలికించి, దానిని మట్టితో కప్పాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే కేవలం ప్రయాణికుడు కాదు; ఇశ్రాయేలీయుల సమాజంలో నివసించే ఇశ్రాయేలేతరుడు.
    reason: lexical_alternative
  - marker: b
    text: ‘దానిని’ అనే సర్వనామం అత్యంత సహజంగా రక్తాన్ని సూచిస్తుంది; అక్షరార్థంగా, ‘దానిని మట్టి/ధూళితో కప్పాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ఏ పురుషుడైనా / ఎవరైనా
  rationale: రెట్టింపబడిన אִישׁ పంపిణీ భావాన్ని, అంటే ‘ఒక్కొక్క పురుషుడు’ లేదా ‘ఏ పురుషుడైనా’ అనే అర్థాన్ని ఇస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచుతూ మొదటి వర్గంలో ‘ఏ పురుషుడైనా’, రెండవ వర్గంలో ‘ఎవరైనా’ అని ఇచ్చాం.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల్లో
  rationale: בְּנֵי יִשְׂרָאֵל లోని కుటుంబసంబంధమైన, నిబంధనాత్మకమైన రూపాన్ని ‘ఇశ్రాయేలీయుల్లో’ అని సాధారణీకరించకుండా సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: వారి మధ్య నివసించే పరదేశి
  rationale: గేర్ అనేది సమాజంలో స్థిరంగా నివసించే ఇశ్రాయేలేతరుణ్ణి సూచిస్తుంది. మూలంలోని నామవాచక–క్రియా పునరుక్తిని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా దాని న్యాయపరమైన భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: יָצוּד צֵיד
  choice: వేటాడితే
  rationale: మూలంలోని సమానధాతు క్రియా–నామ నిర్మాణాన్ని తెలుగులో సహజమైన వేట క్రియతో తెలిపాం; తరువాత వచ్చే అడవి జంతువు లేదా పక్షి అనే కర్మలు సందర్భాన్ని స్పష్టం చేస్తాయి.
- source_word: חַיָּה אוֹ עוֹף
  choice: అడవి జంతువునైనా పక్షినైనా
  rationale: వేట సందర్భంలో חַיָּה సాధారణ జంతువుకన్నా అడవి జంతువును సూచిస్తుంది; עוֹף ను సహజంగా ‘పక్షి’ అని అనువదించాం.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: తినదగిన
  rationale: నిఫ్అల్ రూపం ఇక్కడ ఆహారంగా తినడానికి అనుమతించబడిన లేదా తగిన జంతువు/పక్షి అనే భావాన్ని ఇస్తుంది. ‘తినదగిన’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: అతడు దాని రక్తాన్ని ఒలికించి
  rationale: న్యాయనియమ సందర్భంలోని ఆజ్ఞాత్మక బలాన్ని చివరి ‘కప్పాలి’తో తెలుగులో వ్యక్తం చేశాం. ‘ఒలికించి’ అనేది రక్తాన్ని బయటకు పోయించే ఉద్దేశపూర్వక చర్యను తెలియజేస్తుంది.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: దానిని మట్టితో కప్పాలి
  rationale: עָפָר ఇక్కడ నేలలోని వదులైన మట్టి/ధూళిని సూచిస్తుంది; ఈ సందర్భంలో ‘మట్టి’ ఆధునిక తెలుగులో సహజం. ‘దానిని’ అనే సర్వనామం మూలంలోని ప్రత్యయాన్ని నిలుపుతుంది; దాని సహజ పూర్వపదం రక్తమే.
theological_decisions:
- issue: וְכִסָּהוּ లోని సర్వనామ ప్రత్యయం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘దానిని’ అని ఉంచి, అది సహజంగా రక్తాన్ని సూచించేలా చేయడం
  alternative: జంతువును లేదా పక్షిని కప్పడం/పాతిపెట్టడం
  rationale: అత్యంత సమీప పూర్వపదం ‘దాని రక్తం’; లేవీయకాండం 17లోని రక్త ప్రాధాన్యానికి కూడా ఇది సరిపోతుంది. అయితే మూలంలోని సర్వనామ రూపాన్ని స్పష్టీకరించి మార్చకుండా ఉంచడం ద్వారా స్వల్ప వ్యాకరణ సందిగ్ధతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయనియమానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి అర్థమయ్యే సహజ వాక్యనిర్మాణం. ‘ఇశ్రాయేలు కుమారులు’ అనే నిబంధనాత్మక కుటుంబ పదబంధాన్ని నిలిపి, ‘నివసించే పరదేశి’ని ఆధునిక రాజకీయ వలస పదజాలం లేకుండా వివరించాం.
