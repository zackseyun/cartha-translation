id: LEV.17.6
reference: Leviticus 17:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: te
  text: యాజకుడు సమాగమ గుడారం ప్రవేశద్వారం వద్ద ఉన్న యాహ్వే బలిపీఠం మీద ఆ రక్తాన్ని చిమ్మాలి[a]. ఆ కొవ్వును యాహ్వేకు ఇంపైన సువాసనగా కాల్చాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిమ్మాలి’ అనే హీబ్రూ క్రియను ‘చల్లాలి’ లేదా ‘ప్రోక్షించాలి’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది యాజకుడు రక్తాన్ని బలిపీఠం మీద ఆచారపూర్వకంగా చిమ్మడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘ఇంపైన సువాసన’; దీన్ని ‘శాంతిదాయకమైన సువాసన’ లేదా ‘మధురమైన సువాసన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: చిమ్మాలి
  rationale: బలుల సందర్భంలో ఈ క్రియ రక్తాన్ని బలిపీఠం మీదకు బలంగా చిమ్మే ఆచార చర్యను సూచిస్తుంది. ‘చల్లాలి’ కంటే ‘చిమ్మాలి’ ఆ కదలికను స్పష్టంగా చూపిస్తుంది; ‘ప్రోక్షించాలి’ కంటే సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: כֹּהֵן‌కు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం; నిర్దిష్ట ప్రత్యయం భావాన్ని సందర్భానుసారంగా ఉంచుతుంది.
- source_word: הַדָּם
  choice: ఆ రక్తాన్ని
  rationale: ముందటి సందర్భంలో పేర్కొన్న బలి జంతువు రక్తాన్ని సూచిస్తుంది; אֶת సూచించిన ప్రత్యక్ష కర్మను తెలుగులో ద్వితీయావిభక్తితో వ్యక్తం చేసింది.
- source_word: עַל מִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం మీద
  rationale: זָרַק‌తో కలిసిన עַל రక్తాన్ని బలిపీఠం మీదకు/దాని మీద చిమ్మడాన్ని సూచిస్తుంది. తెలుగులో ‘మీద’ సహజంగా ఉండి భౌతిక చర్యను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పాండిత్య ఆధారిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే ప్రవేశం లేదా ద్వారం; אֹהֶל מוֹעֵד దేవునితో సమావేశమయ్యే గుడారాన్ని సూచిస్తుంది. ఈ రూపం మూలార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִקְטִיר
  choice: బలిపీఠం మీద కాల్చాలి
  rationale: యాజక సంబంధ బలి భాషలో ఈ క్రియ బలిపదార్థాన్ని బలిపీఠం మీద కాల్చి పొగగా పైకి లేపడాన్ని సూచిస్తుంది. తెలుగులో ‘కాల్చాలి’ సహజమైనది; సందర్భ స్పష్టత కోసం ‘బలిపీఠం మీద’ను తెలిపింది.
- source_word: הַחֵלֶב
  choice: ఆ కొవ్వును
  rationale: లేవీయకాండ బలుల సందర్భంలో חֵלֶב బలిపీఠం మీద కాల్చడానికి ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది. ‘ఆ’ ముందటి బలి జంతువుతో సంబంధాన్ని చూపిస్తుంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: ఈ స్థిరమైన బలి పదబంధం దేవునికి ఆమోదకరమైన లేదా సంతోషకరమైన పరిమళాన్ని సూచిస్తుంది. ‘ఇంపైన సువాసన’ సహజంగా ఉండి ఆమోద భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ బలి చర్య యాహ్వేకు ఉద్దేశించబడిందని సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి దీన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచడం మూలంలోని నామాన్ని కాపాడుతుంది; ‘యాహ్వే’ రూపం יהוהకు సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను ‘యెహోవా’ కంటే దగ్గరగా ప్రతిబింబిస్తుంది.
- issue: רֵיחַ נִיחֹחַ యొక్క దేవునికి సంబంధించిన భావం
  choice: యాహ్వేకు ఇంపైన సువాసన
  alternative: యాహ్వేను శాంతింపజేసే సువాసన
  rationale: నִיחֹחַను దేవుని భావోద్వేగ మార్పుపై ఒక నిర్దిష్ట సిద్ధాంతంగా విస్తరించకుండా, బలి ఆమోదకరంగా ఉండే భావాన్ని తెలియజేసింది. మూల రూపకాన్ని ‘సువాసన’గా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణాన్ని వాడింది. ‘చిమ్మాలి’ ద్వారా బలమైన ఆచార చర్యను, ‘బలిపీఠం మీద కాల్చాలి’ ద్వారా బలి సందర్భాన్ని స్పష్టంగా ఉంచింది. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది. రెండు పాదాలుగా విభజించడం తెలుగులో పఠన సౌలభ్యాన్ని పెంచుతుంది; హీబ్రూ వాక్యంలోని వరుస చర్యలు యథాతథంగా నిలిచాయి.
