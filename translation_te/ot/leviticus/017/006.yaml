    rationale: וְהִקְטִיר הַחֵלֶב లొకేషన్‌ను మళ్లీ పేర్కొనదు; సందర్భం దానిని సూచించినప్పటికీ, అనువాదంలో అది అదనపు స్పష్టీకరణగా చేరుతుంది.
