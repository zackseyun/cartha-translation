revisions:
- from: యాజకుడు ఆ రక్తాన్ని యాహ్వే బలిపీఠం మీద, సమావేశపు గుడారం ప్రవేశద్వారం దగ్గర చిమ్మాలి[a]. ఆ కొవ్వును యాహ్వేకు ఇంపైన సువాసనగా[b] బలిపీఠం మీద కాల్చాలి.
  to: యాజకుడు సమాగమ గుడారం ప్రవేశద్వారం వద్ద ఉన్న యాహ్వే బలిపీఠం మీద ఆ రక్తాన్ని చిమ్మాలి[a]. ఆ కొవ్వును యాహ్వేకు ఇంపైన సువాసనగా కాల్చాలి[b].
  rationale: సవరించిన పాఠం זָרַק యొక్క బలమైన ఆచార చర్యను ‘చిమ్మాలి’తో నిలుపుతుంది; బలిపీఠం సమాగమ గుడారం ప్రవేశద్వారం వద్ద ఉన్నదనే మూల వాక్యసంబంధాన్ని స్పష్టంగా చెబుతుంది; మరియు కొవ్వును కాల్చడం గురించి మూలంలో లేని పునరుక్త స్థలవాచకాన్ని తొలగిస్తుంది. రెండు పాదాల వరుస చర్యలు, దైవనామం, మరియు ‘ఇంపైన సువాసన’ అనే రూపకం యథాతథంగా నిలిచాయి.
