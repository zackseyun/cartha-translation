  revision_rationale: ‘ప్రత్యక్ష గుడారం’ను ‘సమావేశపు గుడారం’గా సవరించి אֹהֶל מוֹעֵד యొక్క ప్రధాన అర్థాన్ని పునరుద్ధరించాం. ప్రవేశద్వారం మరియు నివాసమందిరం గురించిన పదబంధాలను మూలవాక్య సంబంధానికి అనుగుణంగా కూర్చాం. రక్తాపరాధపు న్యాయనుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఉంచి, అక్షరార్థాన్ని పాదసూచికలో కాపాడాం. ‘తొలగించబడును’ ద్వారా כרת యొక్క నిర్దిష్టంకాని శిక్షార్థాన్ని నిలిపాం.
