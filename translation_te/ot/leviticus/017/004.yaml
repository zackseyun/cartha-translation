id: LEV.17.4
reference: Leviticus 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: te
  text: యెహోవా నివాసమందిరం ఎదుట యెహోవాకు అర్పణగా సమర్పించడానికి దానిని సమావేశపు గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకురాకపోతే, ఆ మనిషిపై రక్తం చిందించిన దోషం మోపబడుతుంది[a]; అతడు రక్తం చిందించాడు. ఆ మనిషి తన ప్రజల మధ్య నుండి తొలగించబడును[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఆ మనిషికి రక్తం లెక్కించబడుతుంది.” ఇది రక్తం చిందించిన అపరాధం అతనిపై మోపబడుతుందని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “తొలగించబడును” అనే మాట ఇక్కడ మరణశిక్షనో, బహిష్కరణనో, లేక మరొక విధమైన నిబంధనాత్మక వేరుచేయడాన్నో స్పష్టంగా నిర్దేశించదు.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం
  rationale: పֶּתַח అంటే ప్రవేశం లేదా ద్వారం; אֹהֶל מוֹעֵדకు తెలుగులో స్థిరంగా, అర్థవంతంగా ఉన్న ఆరాధనా స్థలపదం ‘ప్రత్యక్ష గుడారం’.
- source_word: הֱבִיאוֹ
  choice: దానిని తీసుకొచ్చి
  rationale: హిఫీల్ రూపం ‘తీసుకురావడం’ అని అర్థం; కర్మప్రత్యయం ముందరి వచనంలో వధించిన జంతువును సూచిస్తుంది.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: అర్పణగా సమర్పించడానికి
  rationale: הקריבలో దగ్గరకు తీసుకురావడం/సమర్పించడం అనే బలిసంబంధ భావం ఉంది; קָרְבָּןను ‘అర్పణ’గా ఉంచి తెలుగులో అనవసర పునరుక్తిని తగ్గించింది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוהను మూలంలోని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: యెహోవా నివాసస్థలం ఎదుట
  rationale: מִשְׁכָּן యొక్క ప్రాథమిక భావం ‘నివాసస్థలం’; לִפְנֵי స్థలపరంగా ‘ఎదుట’.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: ఆ మనిషికి రక్తం చిందించిన దోషం మోపబడుతుంది
  rationale: అక్షరార్థంగా ‘ఆ మనిషికి రక్తం లెక్కించబడుతుంది.’ సందర్భంలోని న్యాయపరమైన రక్తాపరాధ భావాన్ని సహజ తెలుగులో తెలిపి, అక్షర రూపాన్ని పాదసూచికలో నిలిపింది.
- source_word: דָּם שָׁפָךְ
  choice: అతడు రక్తం చిందించాడు
  rationale: హీబ్రూ న్యాయ-నైతిక నుడికారాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: తన ప్రజల మధ్య నుండి తొలగించబడాలి
  rationale: ఖרת నిఫాల్ రూపం సమాజం నుండి వేరుచేయబడే శిక్షను సూచిస్తుంది; దాని ఖచ్చిత విధానాన్ని వచనం నిర్దేశించనందున సాధారణ పదప్రయోగం ఉంచబడింది.
theological_decisions:
- issue: דָּם יֵחָשֵׁב అనే న్యాయ నుడికారం
  choice: రక్తం చిందించిన దోషం మోపబడుతుంది
  alternative: రక్తం అతనికి లెక్కించబడుతుంది
  rationale: తదుపరి ‘అతడు రక్తం చిందించాడు’ అనే వాక్యం న్యాయపరమైన అపరాధాన్ని స్పష్టం చేస్తుంది. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా తెలిపి, మూలంలోని అక్షర నిర్మాణాన్ని పాదసూచికలో ఇచ్చింది.
- issue: ‘తొలగించబడాలి’ అనే శిక్ష యొక్క విధానం
  choice: తన ప్రజల మధ్య నుండి తొలగించబడాలి
  alternative: చంపబడాలి / సమాజం నుండి బహిష్కరించబడాలి
  rationale: ఈ వచనంలో శిక్ష మరణమా, బహిష్కరణా, లేక మరొక నిబంధనాత్మక వేరుచేయడమా అనేది ఖచ్చితంగా చెప్పబడలేదు; అందువల్ల అస్పష్టతను పరిష్కరించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించింది. వాక్యం 3వ వచనంపై ఆధారపడే షరతు వాక్యంగా కొనసాగుతుంది. ‘ప్రత్యక్ష గుడారం,’ ‘నివాసస్థలం,’ ‘అర్పణ’ వంటి పదాలు సాధారణ పాఠకులకు గ్రాహ్యంగా ఉండేలా, ఆరాధనా సందర్భాన్ని కాపాడేలా ఎంచుకున్నవి.
