  to: యెహోవా నివాసమందిరం ఎదుట యెహోవాకు అర్పణగా సమర్పించడానికి దానిని సమావేశపు గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకురాకపోతే, ఆ మనిషిపై రక్తం చిందించిన దోషం మోపబడుతుంది[a]; అతడు రక్తం చిందించాడు. ఆ మనిషి తన ప్రజల మధ్య నుండి తొలగించబడును[b].
  rationale: ‘ప్రత్యక్ష గుడారం’ను ‘సమావేశపు గుడారం’గా సవరించి אֹהֶל מוֹעֵד యొక్క ప్రధాన అర్థాన్ని పునరుద్ధరించాం. ప్రవేశద్వారం మరియు నివాసమందిరం గురించిన పదబంధాలను మూలవాక్య సంబంధానికి అనుగుణంగా కూర్చాం. రక్తాపరాధపు న్యాయనుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఉంచి, అక్షరార్థాన్ని పాదసూచికలో కాపాడాం. ‘తొలగించబడును’ ద్వారా כרת యొక్క నిర్దిష్టంకాని శిక్షార్థాన్ని నిలిపాం.
