  terminology: యెహోవా, అర్పణ, సమావేశపు గుడారం, నివాసమందిరం, రక్తం చిందించాడు అనే పదప్రయోగాలు స్థిరంగా మరియు అర్థవంతంగా ఉన్నాయి. ‘తొలగించబడును’ అనే పదం כרת శిక్ష యొక్క ఖచ్చిత విధానాన్ని నిర్ణయించకుండా ఉంచుతుంది.
