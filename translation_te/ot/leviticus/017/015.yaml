id: LEV.17.15
reference: Leviticus 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: te
  text: తనంతట తానే చనిపోయిన జంతువునైనా[a], మృగం చీల్చిన జంతువునైనా తినే ప్రతి వ్యక్తి—అతడు స్వదేశీయుడైనా, నివాస పరదేశియైనా[b]—తన బట్టలు ఉతుక్కొని, నీటిలో స్నానం చేయాలి. అతడు సాయంత్రం వరకు అశుద్ధుడిగా ఉంటాడు; ఆ తర్వాత శుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జంతు కళేబరాన్నైనా.” హీబ్రూ పదం సక్రమంగా వధించబడకుండా చనిపోయిన జంతువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిమధ్య నివసించే విదేశీయుడైనా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ప్రతి వ్యక్తి
  rationale: లేవీయకాండంలోని ఈ న్యాయ సందర్భంలో ఈ పదం అమూర్తమైన ‘ఆత్మ’ను కాక, ఒక్కో వ్యక్తిని సూచిస్తుంది.
- source_word: נְבֵלָה
  choice: తనంతట తానే చనిపోయిన జంతువు
  rationale: సక్రమంగా వధించబడకుండా చనిపోయిన జంతువు లేదా దాని కళేబరం అనే ఆచారపరమైన వర్గాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: טְרֵפָה
  choice: క్రూరమృగం చీల్చిన జంతువు
  rationale: మృగాల దాడిలో చీల్చబడిన జంతువును సూచించే హీబ్రూ భావాన్ని కారణంతో సహా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּאֶזְרָח
  choice: స్వదేశీయుడు
  rationale: ఇశ్రాయేలు సమాజంలో పుట్టి పెరిగిన స్థానిక సభ్యుణ్ణి సూచిస్తూ, నివాస పరదేశితో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בַגֵּר
  choice: నివాస పరదేశి
  rationale: కేవలం ప్రయాణికుడిని కాక, ఇశ్రాయేలు సమాజంలో నివసించే బయటి వ్యక్తిని సూచిస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: తన బట్టలు ఉతుకుకొని
  rationale: ఆచారపరమైన శుద్ధీకరణలో అవసరమైన చర్యను ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: ఇక్కడ క్రియ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది; ‘స్నానం చేయాలి’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וְטָמֵא עַד־הָעֶרֶב
  choice: సాయంత్రం వరకు అశుద్ధుడిగా ఉంటాడు
  rationale: నైతిక దోషాన్ని కాక, తాత్కాలిక ఆచారపరమైన అశుద్ధ స్థితిని సూచిస్తుంది.
- source_word: וְטָהֵר
  choice: ఆ తర్వాత శుద్ధుడవుతాడు
  rationale: కడుక్కోవడం మరియు నిర్దేశిత సమయం గడవడం తరువాత ఆచారపరమైన అశుద్ధ స్థితి ముగుస్తుందని క్రమాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి నియమాల్లో అశుద్ధత స్వభావం
  choice: טָמֵא/טָהֵר పదాలను ‘అశుద్ధుడు/శుద్ధుడు’గా అనువదించి, వాటిని ఆచారపరమైన స్థితిగా ఉంచడం
  alternative: ‘కలుషితుడు/పరిశుద్ధుడు’ లేదా నైతిక అపరాధాన్ని సూచించే పదజాలం
  rationale: ఈ వచనం నిషిద్ధమైన జంతు మాంసాన్ని తిన్న తరువాత కలిగే ఆచారపరమైన స్థితిని వివరిస్తుంది. నైతిక దోషం లేదా అంతర్గత పాపస్థితిని అనవసరంగా చేర్చకుండా మూలంలోని శుద్ధి వర్గాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. దీర్ఘమైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా, షరతు, చేయవలసిన చర్యలు, సాయంత్రం వరకు కొనసాగే అశుద్ధ స్థితి, తరువాతి శుద్ధ స్థితి అనే క్రమాన్ని యథాతథంగా నిలిపాం.
