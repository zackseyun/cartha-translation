review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the legal scope: anyone who eats an animal that died otherwise than by proper slaughter or was torn by an animal, whether native-born or a resident outsider, must wash, remains ritually unclean until evening, and is then clean. A small revision removes the added nuance in “క్రూరమృగం” (‘ferocious beast’) and renders the bodily washing more closely as bathing ‘in water.’'
  naturalness: The Telugu is clear and suitably formal for legal material. “నీటిలో స్నానం చేయాలి” is more idiomatic and closer to the Hebrew than “నీళ్లతో స్నానం చేయాలి.”
  terminology: “స్వదేశీయుడు” and “నివాస పరదేశి” appropriately preserve the native/resident-outsider contrast. “అశుద్ధుడు/శుద్ధుడు” correctly communicates ritual status without importing moral blame. “మృగం చీల్చిన” retains the source sense without adding ‘cruel.’
  issues:
  - severity: low
    issue: “క్రూరమృగం” adds a quality not explicit in טְרֵפָה.
    rationale: The Hebrew denotes an animal torn by a beast/predator; ‘ferocious’ is unnecessary interpretive coloring.
  - severity: low
    issue: “నీళ్లతో స్నానం” is slightly less exact than the source expression.
    rationale: בַּמַּיִם means bathing/washing in water; “నీటిలో స్నానం” expresses this directly.
