lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవిక ప్రసంగాన్ని ప్రారంభించే wayyiqtol రూపం. తెలుగులో తరువాత వచ్చే לֵאמֹר భావాన్ని ‘ఇలా’తో కలిపి ‘ఇలా చెప్పాడు’ అనడం సహజంగా, సూత్రబద్ధమైన హీబ్రూ వాక్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהకు ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన వ్యక్తినామ రూపం; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కూడిన పరోక్ష లక్ష్యాన్ని తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తపరుస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామం מֹשֶׁהకు ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రపదం. తెలుగులో ‘ఇలా చెప్పాడు:’ అనేది సహజమైన సమానార్థక నిర్మాణం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన నామరూపంలో ఉంచాం. ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే మరో సాధ్యమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సహజంగా ఉండే సంక్షిప్త దైవవాక్య పరిచయ సూత్రం. వచనం తరువాతి ప్రత్యక్ష ప్రసంగానికి దారితీస్తున్నందున చివర ద్విబిందువు వాడబడింది.
