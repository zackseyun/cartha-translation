  terminology: “ఇశ్రాయేలు కుమారులు,” “ప్రత్యక్ష గుడారం,” “యాజకుడు,” and “సమాధాన బలులు” are appropriate. The alternatives for the final sacrificial term are suitably retained in the footnote.
