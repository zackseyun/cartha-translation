id: LEV.17.5
reference: Leviticus 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] బహిరంగ పొలంలో తాము అర్పిస్తున్న తమ బలులను యెహోవా సన్నిధికి, ప్రత్యక్ష గుడారం ప్రవేశద్వారం వద్ద యాజకుని దగ్గరకు తీసుకువచ్చి, వాటిని యెహోవాకు సమాధాన బలులుగా[b] అర్పించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సహవాస బలులుగా”; లేదా, “క్షేమ బలులుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: అర్పించడానికి
  rationale: ముందటి ఆజ్ఞతో అనుసంధానమైన ఉద్దేశాన్ని తెలిపే నిర్మాణంగా అనువదించబడింది. తెలుగు వాక్యప్రవాహంలో చివర ఉద్దేశార్థక క్రియారూపం సహజంగా ఉంటుంది; ఇది స్వతంత్ర ఆజ్ఞగా మార్చకుండా మూలంలోని ఆధార వాక్య స్వభావాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ సంబంధ రూపకాన్ని యథాతథంగా నిలుపుతూ, ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: זִבְחֵיהֶם
  choice: తాము అర్పిస్తున్న బలులను
  rationale: זבח అనే బలిసంబంధ నామవాచకానికి ‘బలులు’ సహజమైన, సందర్భోచితమైన తెలుగు పదం. సర్వనామ సంబంధాన్ని తెలుగు వాక్యంలో ‘తాము’ ద్వారా స్పష్టం చేసింది.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: తాము అర్పిస్తున్న
  rationale: హీబ్రూ వర్తమాన క్రియావిశేషణ నిర్మాణంలోని కొనసాగుతున్న లేదా అలవాటైన చర్య భావాన్ని ‘అర్పిస్తున్న’ నిలుపుతుంది. ‘వధిస్తున్న’ సాధ్యమైనా, ఈ సందర్భంలో బలిగా అర్పించే చర్యను ‘అర్పిస్తున్న’ మరింత సహజంగా తెలియజేస్తుంది.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: బహిరంగ పొలంలో
  rationale: పవిత్రస్థలానికి వెలుపల బహిరంగ ప్రదేశంలో జరుగుతున్న చర్యను సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘పొలం ముఖంపై’ అనుచితం.
- source_word: וְהֱבִיאֻם
  choice: వాటిని ... తీసుకొచ్చి
  rationale: కర్మప్రత్యయం ముందున్న బలులను సూచిస్తుందని ‘వాటిని’తో స్పష్టం చేసి, ఉద్దేశ వాక్యంలోని క్రియాక్రమాన్ని నిలిపింది.
- source_word: לַיהוָה
  choice: యెహోవా దగ్గరకు / యెహోవాకు
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వినిపించే ‘యెహోవా’ రూపంలో ఇచ్చింది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం ప్రవేశద్వారం
  rationale: మోయేడ్ గుడారానికి తెలుగులో ప్రసిద్ధమైన ‘ప్రత్యక్ష గుడారం’ను, పֶתַחకు స్పష్టమైన ‘ప్రవేశద్వారం’ను ఉపయోగించింది.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని దగ్గరకు
  rationale: హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని ఏకవచన ‘యాజకుని’గా నిలిపి, గమ్యార్థాన్ని సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: זִבְחֵי שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: ఈ ప్రత్యేక బలి వర్గానికి పరిచితమైన తెలుగు పదబంధం. שְׁלָמִיםలోని శాంతి, సంపూర్ణత, క్షేమం సంబంధ భావాలను పూర్తిగా ఒకే పదంలో నిర్బంధించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ఉన్నందున ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకొని, మూలనామ స్వభావాన్ని నిలిపింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహ సూచన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పితృవంశీయ కుటుంబ వ్యక్తీకరణను నిలిపింది; అది నిబంధన సమాజాన్ని సమూహంగా సూచిస్తుందనే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: זִבְחֵי שְׁלָמִים బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు / క్షేమ బలులు
  rationale: హీబ్రూ పదంలోని భావ పరిధిని ఒకే సిద్ధాంతార్థానికి పరిమితం చేయకుండా, సంప్రదాయంగా అర్థమయ్యే ప్రధాన పదాన్ని పాఠ్యంలో ఉంచి ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందటి వచనంలోని ఆజ్ఞకు ఉద్దేశాన్ని తెలిపే ఆధార వాక్యంగా ఉన్నందున, తెలుగులోనూ ఉద్దేశార్థక ముగింపును ఉంచి ఆ అనుసంధానాన్ని కాపాడింది. డాష్‌ల మధ్య భాగం యెహోవా దగ్గరకు తీసుకురావడం అంటే ప్రత్యక్ష గుడారం వద్ద యాజకుని దగ్గరకు తీసుకురావడమని మూలంలోని సమాంతర గమ్యపదాలను స్పష్టంగా చూపుతుంది.
