- from: ఇశ్రాయేలు కుమారులు[a] బహిరంగ పొలంలో తాము అర్పిస్తున్న బలులను యెహోవా దగ్గరకు—ప్రత్యక్ష గుడారం ప్రవేశద్వారం వద్ద ఉన్న యాజకుని దగ్గరకు—తీసుకొచ్చి, వాటిని యెహోవాకు సమాధాన బలులుగా[b] అర్పించడానికి.
