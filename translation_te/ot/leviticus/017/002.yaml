id: LEV.17.2
reference: Leviticus 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: te
  text: 'అహరోనుతోను, అతని కుమారులతోను, ఇశ్రాయేలు ప్రజలందరితోను మాట్లాడి వారికి ఇలా చెప్పు: యాహ్వే ఆజ్ఞాపించిన విషయం ఇదే[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “విషయం” అనే పదాన్ని “మాట” లేదా “సంగతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: పియేల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: సందర్భంలో అహరోను కుమారులైన పురుష యాజకులనే నిర్దిష్టంగా సూచిస్తుంది.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరూ
  rationale: ఇది ఇశ్రాయేలు సమాజానికి వాడే సంప్రదాయ జాతివాచక వ్యక్తీకరణ; తెలుగులో ‘ప్రజలందరూ’ సహజంగా ఉండి సమాజమంతటినీ సూచిస్తుంది, కాగా అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: వరుసగా వచ్చిన ఆదేశాన్ని, తరువాతి ప్రత్యక్ష వాక్యానికి పరిచయంగా, సహజంగా అందిస్తుంది.
- source_word: זֶה הַדָּבָר
  choice: విషయం ఇదే
  rationale: דָּבָר కు ‘మాట’, ‘విషయం’, ‘సంగతి’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ రాబోయే ఆజ్ఞల విషయాన్ని పరిచయం చేస్తున్నందున ‘విషయం’ సహజంగా సరిపోతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన దైవిక ఆజ్ఞను, తరువాత చెప్పబోయే విషయంతో అనుసంధానిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: לֵאמֹר
  choice: —
  rationale: ఈ హీబ్రూ ఉక్తి-పరిచయ అవ్యయార్థాన్ని తెలుగులో ‘ఇలా చెప్పు’ మరియు చివరి డ్యాష్ ద్వారా సహజంగా వ్యక్తపరచాం; వేరుగా ‘అంటూ’ అని చేరిస్తే అసహజ పునరుక్తి కలుగుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయం.
- issue: בני ישראל అనే కుటుంబాధారిత జాతివాచకం
  choice: ఇశ్రాయేలు ప్రజలందరూ
  alternative: ఇశ్రాయేలు కుమారులందరూ
  rationale: ఈ పదబంధం ఇక్కడ కేవలం పురుషులను కాక ఒడంబడిక సమాజాన్ని సూచించే స్థిర జాతివాచకంగా పనిచేస్తుంది. అందువల్ల అర్థవ్యాప్తిని సహజ తెలుగులో ఇచ్చి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆజ్ఞా శైలిని ఉపయోగించాం. హీబ్రూలోని పునరుక్త ఉక్తి-సూత్రాన్ని పదేపదే అనువదించకుండా, ‘ఇలా చెప్పు’ మరియు డ్యాష్‌తో తెలుగులో సహజంగా కొనసాగించాం.
