source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: te
  text: 'అందుచేత నేను ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పాను: ‘మీలో ఎవ్వరూ రక్తాన్ని తినకూడదు; మీ మధ్య నివసించే పరదేశి[b] రక్తాన్ని తినకూడదు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు సంతానానికి” లేదా “ఇశ్రాయేలీయులకు.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “పరదేశి” అంటే ఇశ్రాయేలు సమాజంలో నివసిస్తూ దాని సామూహిక నియమాల కింద జీవించే ఇశ్రాయేలేతరుడు; “నివాస విదేశీయుడు” అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: మునుపటి వచనంలో రక్తంలో ప్రాణం ఉందని ఇచ్చిన కారణం నుంచి ఈ నిషేధం వస్తోందనే నిర్ధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָמַרְתִּי
  choice: నేను ... చెప్పాను
  rationale: మూలంలోని సాధారణ భూతకాల క్రియను న్యాయపరమైన సందర్భానికి తగిన సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే లింగసూచక సమూహ నామాన్ని యథాతథంగా నిలుపుతుంది; తెలుగు వాక్యనిర్మాణంలో ‘చెప్పాను’తో ‘తో’ సహజంగా సరిపోతుంది.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: మీలో ఏ వ్యక్తీ
  rationale: נֶפֶשׁ ఇక్కడ ‘ఆత్మ’ అని కాక ఒక వ్యక్తిని సూచించే వాడుక; నిషేధంలోని ప్రతి ఒక్కరికి వర్తించే బలాన్ని ‘ఏ వ్యక్తీ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תֹאכַל דָּם
  choice: రక్తాన్ని తినకూడదు
  rationale: చట్టపరమైన నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ‘రక్తాన్ని తినడం’ అనే మూల రూపకాన్ని మార్చకుండా ఉంచుతుంది.
- source_word: הַגֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసిస్తూ దాని సామూహిక నియమాల కింద ఉన్న ఇశ్రాయేలేతర నివాసిని సూచించడానికి గౌరవప్రదమైన, అర్థమయ్యే తెలుగు పదం.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: మీ మధ్య నివసించే
  rationale: గేర్ అనే నామవాచకంతో సంబంధమున్న ‘నివసించు’ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; కేవలం తాత్కాలిక సందర్శకుడు కాదనే భావాన్ని ఇస్తుంది.
- source_word: לֹא יֹאכַל דָּם
  choice: రక్తాన్ని తినకూడదు
  rationale: నివాస పరదేశికీ అదే నిషేధం వర్తిస్తుందని మొదటి ఆజ్ఞకు సమాంతరంగా స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל లోని లింగసూచక నిబంధన సమూహ నామం
  choice: ఇశ్రాయేలు కుమారులతో
  alternative: ఇశ్రాయేలు ప్రజలతో / ఇశ్రాయేలీయులతో
  rationale: ‘కుమారులు’ మూలంలోని בְנֵי అనే పురుషలింగ ప్రతినిధి రూపాన్ని నిలుపుతుంది. అయితే అది కేవలం మగవారికే ఆజ్ఞ వర్తిస్తుందనే అదనపు సిద్ధాంత నిర్ణయాన్ని స్వయంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలి. ‘తినకూడదు’ ద్వారా నిషేధ బలం సహజంగా వ్యక్తమైంది. మూలంలోని పునరుక్తిని తెలుగులో అర్థస్పష్టతతో నిలుపుతూ, రెండో వాక్యంలో ‘కూడా’ చేర్చి అదే నియమం పరదేశికీ వర్తిస్తుందని తెలియజేశారు.
