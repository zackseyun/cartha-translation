id: LEV.17.14
reference: Leviticus 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: te
  text: ఎందుకంటే ప్రతి జీవి ప్రాణం దాని రక్తమే; దాని ప్రాణంలో ఉన్నది దాని రక్తమే.[a] అందుకే నేను ఇశ్రాయేలు కుమారులతో[b], “ఏ జీవి రక్తాన్నీ మీరు తినకూడదు; ఎందుకంటే ప్రతి జీవి ప్రాణం దాని రక్తమే” అని చెప్పాను. దాన్ని తినే ప్రతి ఒక్కరూ తొలగించబడతారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇంకొక విధంగా: “దాని రక్తం దాని ప్రాణంలో ఉంది”; లేదా మరింత వ్యాఖ్యాత్మకంగా: “దాని రక్తమే దాని ప్రాణం.”'
    reason: בְנַפְשׁוֹ הוּא అనే హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ రీతుల్లో అర్థం చేసుకోవచ్చు.
  - marker: b
    text: అంటే, ఇశ్రాయేలీయులతో.
    reason: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
  - marker: c
    text: ‘తొలగించబడతారు’ అనే హీబ్రూ శిక్షాసూత్రం శిక్ష ఎలా అమలవుతుందో ఇక్కడ నిర్దిష్టంగా చెప్పదు.
    reason: మరణం, సమాజం నుండి వెలివేత, లేదా దేవుని తీర్పు అనే అవకాశాల్లో ఒకదాన్ని అనువాదమే నిర్ణయించకుండా అస్పష్టతను నిలుపుతుంది.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఈ ఆహార-బలి సందర్భంలో ఇది దేహానికి జీవం ఇచ్చే ప్రాణాన్ని సూచిస్తుంది; దేహానికి వేరైన అధిభౌతిక ‘ఆత్మ’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בָּשָׂר
  choice: శరీరమున్న ప్రతి ప్రాణి
  rationale: ‘శరీరం/మాంసం’ అనే మూలభావాన్ని నిలుపుతూ, సమస్త జీవులను ఉద్దేశించే హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: דָּם / דָּמוֹ
  choice: రక్తం / దాని రక్తం
  rationale: వచనంలోని నిషేధానికీ దాని కారణానికీ కేంద్ర పదం కావడంతో నేరుగా అనువదించబడింది.
- source_word: בְנַפְשׁוֹ הוּא
  choice: అది దాని ప్రాణంలో ఉంది
  rationale: సంక్షిప్తమైన, కొంత అస్పష్టమైన హీబ్రూ నిర్మాణాన్ని పూర్తిగా సున్నితీకరించకుండా నిలుపుతుంది; మరింత వ్యాఖ్యాత్మకమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
- source_word: וָאֹמַר
  choice: అందుకే నేను ... చెప్పాను
  rationale: ముందున్న ప్రాణం-రక్తం సూత్రం నుండి ఆజ్ఞకు వచ్చే కారణసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: హీబ్రూలోని లింగసూచక బహువచన నిర్మాణాన్ని నిలుపుతుంది; ఉద్దేశించిన సమూహాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: నిబంధనాత్మకమైన ప్రత్యక్ష నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹכְלָיו
  choice: దాన్ని తినే ప్రతి ఒక్కరూ
  rationale: పాల్గొనే ప్రతి వ్యక్తికీ వర్తించే విభాజక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִכָּרֵת
  choice: తొలగించబడతారు
  rationale: శిక్ష యొక్క విధానం మరణమా, సమాజం నుండి వెలివేతా, లేక దేవుని తీర్పా అని ముందుగానే నిర్ణయించకుండా హీబ్రూ నిబంధనాత్మక శిక్షాసూత్రం యొక్క విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: రక్తానికి נֶפֶשׁ‌తో ఉన్న సంబంధం
  choice: נֶפֶשׁ‌ను ‘ప్రాణం’గా అనువదించి, రక్తం జీవితో అంతర్భావంగా ముడిపడి ఉందనే వచన తర్కాన్ని నిలిపాము.
  alternative: ‘ఆత్మ’ అని అనువదించడం లేదా ‘రక్తమే జీవం’ అని మాత్రమే వ్యాఖ్యాత్మకంగా సున్నితీకరించడం.
  rationale: ఈ వచనం రక్తనిషేధాన్ని జీవం-రక్తం సంబంధంపై ఆధారపరుస్తుంది; తరువాతి కాలపు ఆత్మసంబంధ సిద్ధాంతాన్ని ఇందులోకి చేర్చకూడదు.
- issue: יִכָּרֵת అనే శిక్షాసూత్రం యొక్క స్వరూపం
  choice: ‘తొలగించబడతారు’ అని విస్తృతంగా ఉంచడం.
  alternative: ‘చంపబడతారు,’ ‘సమాజం నుండి వెలివేయబడతారు,’ లేదా ‘దేవునిచేత నిర్మూలించబడతారు.’
  rationale: హీబ్రూ పదబంధం ఇక్కడ శిక్ష అమలయ్యే నిర్దిష్ట విధానాన్ని చెప్పదు; అందువల్ల వివాదాస్పదమైన ఒకే అర్థాన్ని అనువాదంలో బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధర్మశాస్త్ర శైలి ఉపయోగించబడింది. ‘శరీరమున్న ప్రతి ప్రాణి’ అనే పదబంధం בָּשָׂר యొక్క దేహధారిత్వాన్ని, ‘ప్రతి ప్రాణి’ యొక్క సహజ తెలుగు భావాన్ని రెండింటినీ కలుపుతుంది. మూలంలోని పునరుక్తినీ ప్రాణం-రక్తం మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతనీ తొలగించలేదు.
