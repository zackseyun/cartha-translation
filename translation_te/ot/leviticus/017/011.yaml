id: LEV.17.11
reference: Leviticus 17:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: te
  text: ఎందుకంటే శరీరపు ప్రాణం రక్తంలో ఉంది; మీ ప్రాణాల కోసం ప్రాయశ్చిత్తం చేయడానికి దానిని బలిపీఠం మీద మీకు నేనే ఇచ్చాను. ఎందుకంటే ప్రాణం ద్వారా ప్రాయశ్చిత్తం చేసేది రక్తమే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిలోని ప్రాణం మూలంగానే రక్తం ప్రాయశ్చిత్తం చేస్తుంది.”
    reason: చివరి హీబ్రూ పదబంధమైన בַּנֶּפֶשׁను సాధనార్థకంగా లేదా కారణార్థకంగా అర్థం చేసుకోవచ్చు; ప్రత్యామ్నాయం ఆ అంతర్లీన సంబంధాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఈ బలి సందర్భంలో ఈ పదం శరీరానికి జీవం కలిగించే ప్రాణాన్ని సూచిస్తుంది; విడిగా ఉన్న అమూర్తమైన ‘ఆత్మ’ అనే భావాన్ని తప్పనిసరిగా సూచించదు. రెండు చోట్లా ‘ప్రాణం’ వాడటం రక్తం–ప్రాణం సంబంధాన్ని నిలుపుతుంది.
- source_word: הַבָּשָׂר
  choice: శరీరం
  rationale: ఇక్కడ జీవిగల దేహధర్మాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘శరీరం’ సహజంగా, గౌరవప్రదంగా ఉండి ‘మాంసం’ వల్ల కలగగల ఆహారార్థాన్ని నివారిస్తుంది.
- source_word: בַּדָּם
  choice: రక్తంలో
  rationale: 'ఉపసర్గ בְּ యొక్క స్థానార్థాన్ని నేరుగా నిలుపుతుంది: శరీరపు ప్రాణం రక్తంలో ఉంది.'
- source_word: נְתַתִּיו לָכֶם
  choice: దానిని ... మీకు నేనే ఇచ్చాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియను సహజమైన తెలుగులో గతకాలంగా అందిస్తూ, వాక్యంలోని దైవప్రదాన ఉద్ఘాటనను ‘నేనే’ ద్వారా నిలుపుతుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: ఆరాధనా-బలి సందర్భాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: లేవీయకాండంలోని బలి సంబంధిత כפר పదానికి స్థిరమైన, విస్తృతార్థక తెలుగు పదబంధం; ప్రాయశ్చిత్తం ఎలా కార్యసాధకం అవుతుందనే నిర్దిష్ట సిద్ధాంతాన్ని చొప్పించదు.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: మీ ప్రాణాల కోసం
  rationale: ఈ వచనంలో נֶפֶשׁ యొక్క పునరావృతాన్ని ‘ప్రాణం’ అనే ఒకే భావంతో నిలుపుతూ, శరీరం–ఆత్మ ద్వైతాన్ని అనవసరంగా సూచించదు.
- source_word: כִּי הַדָּם הוּא
  choice: ఎందుకంటే ... రక్తమే
  rationale: כִּי యొక్క వివరణాత్మక బలాన్ని, הוּא కలిగించే ఉద్ఘాటనను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: בַּנֶּפֶשׁ
  choice: ప్రాణం ద్వారా
  rationale: సంక్షిప్తమైన, చర్చనీయమైన హీబ్రూ పదబంధంలో בְּను సాధనార్థకంగా తీసుకుంటుంది; రక్తం తనతో ముడిపడిన ప్రాణం ద్వారా ప్రాయశ్చిత్తం చేస్తుందనే సంబంధాన్ని అతి వివరణ లేకుండా ఉంచుతుంది.
- source_word: יְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేసేది
  rationale: ముందున్న לְכַפֵּרతో పదసంబంధ స్థిరత్వాన్ని కాపాడి, ప్రస్తుత నియమాత్మక ప్రకటనను సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: బలి ధర్మశాస్త్ర సందర్భంలో נֶפֶשׁ యొక్క అర్థం
  choice: వచనం అంతటా ‘ప్రాణం’గా అనువదించబడింది.
  alternative: ఆత్మ; జీవం; వ్యక్తి/తానే
  rationale: రక్తంతో ముడిపడిన జీవప్రాణమే ఈ వచన తర్కానికి కేంద్రం. ‘ఆత్మ’ అని అనువదిస్తే హీబ్రూ పాఠం తప్పనిసరిగా బోధించని శరీర–ఆత్మ విభజనను సూచించే అవకాశం ఉంది.
- issue: చివరి భాగంలోని בַּנֶּפֶשׁ బలం
  choice: ‘ప్రాణం ద్వారా’ అని ప్రధాన పాఠంలో ఉంచబడింది.
  alternative: ప్రాణం కారణంగా; ప్రాణంలో; దానిలోని ప్రాణం ద్వారా
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా, వ్యాఖ్యానానికి తెరిచి ఉంది. ప్రధాన పాఠం దాని సాధనార్థక అవకాశాన్ని నిలుపుతుంది; పాదసూచిక మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది, కానీ ఒకే ప్రాయశ్చిత్త సిద్ధాంతాన్ని విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర-బలి సందర్భానికి తగిన గౌరవప్రద శైలి. ‘ప్రాణం,’ ‘రక్తం,’ ‘ప్రాయశ్చిత్తం’ పునరావృతాలు మూలంలోని భావసంబంధాన్ని ఉద్దేశపూర్వకంగా నిలుపుతాయి.
