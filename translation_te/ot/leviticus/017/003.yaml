  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: te
  text: ఇశ్రాయేలు ఇంటివాడైన ఎవడైనా ఎద్దునుగానీ, గొర్రెనుగానీ, మేకనుగానీ శిబిరంలో వధిస్తే, లేదా శిబిరం వెలుపల వధిస్తే—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ఎవడైనా
  rationale: 'ద్విరుక్త నామవాచకం పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది: ఇశ్రాయేలు సమాజంలోని ఏ వ్యక్తినైనా సూచించే సహజమైన తెలుగు న్యాయప్రయోగం.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారిలో
  rationale: ‘ఇశ్రాయేలు ఇల్లు/గృహం’ అనే నిబంధనాత్మక జాతీయ నుడికారాన్ని నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשְׁחַט
  choice: వధించినా
  rationale: జంతువును, ముఖ్యంగా బలి సందర్భంలో, చంపడాన్ని సూచించే שׁחט క్రియకు ‘వధించు’ గౌరవప్రదమైన మరియు సందర్భోచితమైన తెలుగు పదం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: బలిపశువుల జాబితాలోని ఏకవచన పశువును సూచించే సాధారణ తెలుగు సమానార్థకం; మూలంలో లేనంత లింగ/వయస్సు నిర్దిష్టతను చేర్చదు.
- source_word: כֶשֶׂב
  choice: గొర్రె
  rationale: ఈ పదం తప్పనిసరిగా చిన్న గొర్రెపిల్లనే కాక, గొర్రె జాతి పశువును విస్తృతంగా సూచించగలదు.
- source_word: עֵז
  choice: మేక
  rationale: బలి మరియు ఆహార సందర్భాల్లోని జంతుపదానికి ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలో
  rationale: స్థానార్థక పదబంధాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: వధ జరిగే స్థలం శిబిరానికి బయట అని మూలార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: వధించినా, లేదా ... వధించినా
  rationale: రెండు ప్రత్యామ్నాయ పరిస్థితుల సమాంతర న్యాయనిర్మాణాన్ని తెలుగులో నిలుపుతుంది.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: '[పునరుక్త క్రియలో కర్మను ప్రత్యేకంగా చేర్చలేదు]'
  rationale: తెలుగులో రెండవ ‘వధించినా’కు ముందు జాబితా చేసిన జంతువులే సహజంగా కర్మగా అర్థమవుతాయి; ‘దానిని’ చేర్చకుండానే వాక్యం స్పష్టంగా ఉంటుంది.
