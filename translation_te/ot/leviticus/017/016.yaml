reference: Leviticus 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: te
  text: కానీ అతడు తన బట్టలు ఉతుకుకోకపోతే, తన శరీరాన్ని[a] కడుక్కోకపోతే, తన దోషాన్ని భరించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన మాంసాన్ని.” ఇక్కడ అది తన శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన పాపాన్ని భరించాలి”; లేదా, “తన దోషానికి కలిగే శిక్షను భరించాలి.” ఈ హీబ్రూ న్యాయసూత్ర పదబంధంలో దోషం, దాని పరిణామం రెండూ ఇమిడి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: కానీ ... పోతే
  rationale: మునుపటి వచనంలో చెప్పిన శుద్ధీకరణ విధికి విరుద్ధమైన పరిస్థితిని ఈ షరతు పరిచయం చేస్తుంది; అందువల్ల సందర్భంలోని వ్యతిరేక భావాన్ని ‘కానీ’ సహజంగా తెలియజేస్తుంది.
- source_word: יְכַבֵּס
  choice: తన బట్టలు ఉతుకుకోకపోతే
  rationale: כּבס పియేల్ రూపం సాధారణంగా వస్త్రాలను ఉతకడాన్ని సూచిస్తుంది. హీబ్రూలో కర్మపదం ఇక్కడ లోపించినా, మునుపటి వచనం మరియు న్యాయసూత్ర సందర్భం వల్ల ‘తన బట్టలు’ అని స్పష్టంగా అర్థమవుతుంది.
- source_word: וּבְשָׂרוֹ
  choice: తన శరీరాన్ని
  rationale: בשר అక్షరార్థంగా ‘మాంసం’; అయితే ఆచారసంబంధ స్నాన సందర్భంలో వ్యక్తి శరీరమంతటినీ సూచిస్తుంది. ఆధునిక తెలుగులో ‘శరీరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יִרְחָץ
  choice: స్నానం చేయించుకోకపోతే
  rationale: רחץ ఇక్కడ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది. బట్టలు ఉతకడం నుంచి భేదాన్ని స్పష్టంచేయడానికి ‘స్నానం చేయించుకోవడం’ ఉపయోగించబడింది.
- source_word: וְנָשָׂא
  choice: తానే భరించాలి
  rationale: ఇక్కడ వావ్‌తో కూడిన క్రియ ముందున్న షరతును పాటించకపోవడం వల్ల కలిగే పరిణామాన్ని తెలియజేస్తుంది. ‘భరించాలి’ న్యాయసూత్ర ధోరణిని నిలుపుతుంది; ‘తానే’ బాధ్యత అతనిపైనే ఉండే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲוֹנוֹ
  choice: తన దోషాన్ని
  rationale: עון దోషం, దోషబాధ్యత, లేదా దాని పరిణామాన్ని సూచించగలదు. ‘తన దోషాన్ని ... భరించాలి’ అనే రూపం ఆ న్యాయపరమైన విస్తృతిని ఒక నిర్దిష్ట శిక్షగా పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘తన עוןను భరించడం’ అనే న్యాయసూత్ర పదబంధం అర్థం
  choice: ‘తన దోషాన్ని తానే భరించాలి’
  alternative: ‘తన పాపాన్ని భరించాలి’ లేదా ‘తన దోషానికి శిక్షను అనుభవించాలి’
  rationale: హీబ్రూ పదబంధం అపరాధం, దాని బాధ్యత, దాని పరిణామం—ఇవన్నీ కలిగిన భావాన్ని మోయగలదు. అనువాదం దాన్ని కేవలం నైతిక తప్పుగా గానీ, స్పష్టంగా శిక్షగా గానీ నిర్ణయించకుండా ఆ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయసూత్ర శైలి పాటించబడింది. ‘బట్టలు ఉతుకుకోవడం’ మరియు ‘శరీరాన్ని స్నానం చేయించుకోవడం’ మధ్య తేడా స్పష్టంగా ఉంచబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
