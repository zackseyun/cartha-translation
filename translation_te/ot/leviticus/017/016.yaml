review_pass:
  verdict: revise
  source_fidelity: The draft accurately supplies the ellipsed object ‘his clothes’ from the preceding verse and correctly renders the body-washing and the legal consequence. However, ‘స్నానం చేయించుకోవడం’ normally means having someone arrange or administer a bath, not washing one's own body; it therefore weakens the direct reflexive sense of Hebrew וּבְשָׂרוֹ לֹא יִרְחָץ.
  naturalness: ‘తన శరీరాన్ని కడుక్కోకపోతే’ is idiomatic modern standard Telugu and naturally contrasts with ‘తన బట్టలు ఉతుకుకోకపోతే.’ Removing ‘తానే’ avoids an unwarranted emphatic nuance.
  terminology: ‘దోషాన్ని భరించాలి’ appropriately preserves the breadth of עֲוֹנוֹ, which may include guilt and its consequent liability, without specifying a particular punishment. The lexical footnote correctly notes the literal sense ‘his flesh.’
  issues:
  - severity: medium
    issue: ‘తన శరీరాన్ని స్నానం చేయించుకోకపోతే’ is not an accurate or natural rendering of self-washing.
    rationale: The causative/reflexive expression ‘చేయించుకోవడం’ suggests having a bath performed or arranged by another. The Hebrew simply says that he does not wash his own flesh/body.
  - severity: low
    issue: ‘తానే’ adds emphasis absent from the Hebrew.
    rationale: The suffix in עֲוֹנוֹ means ‘his’; it does not expressly emphasize that he himself, rather than anyone else, bears it.
  - severity: low
    issue: Footnote marker [a] should be attached directly to ‘శరీరాన్ని.’
    rationale: The note explains the lexical alternative for בְשָׂרוֹ (‘his flesh’), rather than the whole conditional action.
  revised_text: కానీ అతడు తన బట్టలు ఉతుకుకోకపోతే, తన శరీరాన్ని[a] కడుక్కోకపోతే, తన దోషాన్ని భరించాలి.[b]
