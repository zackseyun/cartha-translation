revisions:
- from: కానీ అతడు తన బట్టలు ఉతుకుకోకపోతే, తన శరీరాన్ని స్నానం చేయించుకోకపోతే,[a] తన దోషాన్ని తానే భరించాలి.[b]
  to: కానీ అతడు తన బట్టలు ఉతుకుకోకపోతే, తన శరీరాన్ని[a] కడుక్కోకపోతే, తన దోషాన్ని భరించాలి.[b]
  rationale: The revision replaces an unnatural causative expression with the direct, source-faithful Telugu expression for washing one’s own body, removes added emphasis, and places the lexical footnote marker at its proper anchor. It retains the conditional contrast, the implied garments, and the deliberate ambiguity of the Hebrew legal expression.
