id: LEV.17.8
reference: Leviticus 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲלֵ/הֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִ/בֵּ֣ית יִשְׂרָאֵ֔ל וּ/מִן הַ/גֵּ֖ר אֲשֶׁר יָג֣וּר בְּ/תוֹכָ֑/ם אֲשֶׁר יַעֲלֶ֥ה עֹלָ֖ה אוֹ זָֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: te
  text: '“వారితో నీవు ఇలా చెప్పాలి: ఇశ్రాయేలు ఇంటివారిలో ఏ పురుషుడైనా[a], లేదా వారి మధ్య నివసించే పరదేశి[b] ఎవరైనా, దహనబలినిగాని బలినిగాని అర్పిస్తే—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పురుషుడు, పురుషుడు’ అని ఉంది; ఇది ఒక్కొక్క వ్యక్తిగత సందర్భాన్ని సూచించే న్యాయపదప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ‘నివాస పరదేశి’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం ఇశ్రాయేలీయుల మధ్య నివసించే ఇశ్రాయేలీయేతరుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: వారితో నీవు ఇలా చెప్పాలి
  rationale: సంయోజక భావాన్ని సందర్భానికి సహజంగా మోస్తూ, మోషేకు ఇవ్వబడిన ఆదేశ స్వరాన్ని నిలుపుతుంది.
- source_word: אִישׁ אִישׁ
  choice: ఏ పురుషుడైనా
  rationale: రెట్టింపుతో వచ్చిన పంపిణీ అర్థాన్ని ‘ఏ...అయినా’ తెలియజేస్తుంది; మూలంలోని పుంలింగ న్యాయపదప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారిలో
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సమూహ/నిబంధనాత్మక భావాన్ని సహజ తెలుగు రూపంలో కాపాడుతుంది.
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: లేదా వారి మధ్య నివసించే పరదేశి ఎవరైనా
  rationale: గేర్ అనేది ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసించే ఇశ్రాయేలీయేతరుణ్ణి సూచిస్తుంది; ‘నివసించే పరదేశి’ ఆ సామాజిక-న్యాయ స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: అర్పిస్తే
  rationale: బలుల సందర్భంలో హిఫీల్ రూపానికి తగిన బల్యర్పణ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేయబడే బలికి తెలుగులో స్థిరంగా అర్థమయ్యే పదం.
- source_word: אוֹ זָבַח
  choice: బలినిగాని
  rationale: దహనబలికి భిన్నమైన, వధించి అర్పించే బలిని విస్తృతంగా సూచించే మూలపదానికి సహజ సమానార్థకం.
theological_decisions:
- issue: אִישׁ אִישׁ అనే పుంలింగ పంపిణీ న్యాయపదప్రయోగం
  choice: ఏ పురుషుడైనా
  alternative: ఎవరైనా / ఏ వ్యక్తైనా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగాన్ని తొలగించకుండా, ప్రతి వ్యక్తిగత సందర్భానికి వర్తించే పంపిణీ బలాన్ని తెలియజేస్తుంది.
- issue: גֵּר యొక్క సామాజిక-నిబంధనాత్మక అర్థం
  choice: నివసించే పరదేశి
  alternative: వలసవాసి / పరాయి వ్యక్తి
  rationale: ఇది కేవలం అపరిచితుణ్ణి కాకుండా ఇశ్రాయేలు సమాజంలో నివసించే ఇశ్రాయేలీయేతరుణ్ణి సూచిస్తుంది; ఆధునిక వలస చట్టాల ప్రత్యేక భావాలను రుద్దకుండా ఈ స్థితిని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని చివర దీర్ఘ విరామచిహ్నంతో సూచించబడింది.
