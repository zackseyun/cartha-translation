revisions:
- from: “ఇశ్రాయేలు ఇంటివారిలో ఎవడైనా, లేదా వారి మధ్య నివసించే పరదేశులలో[a] ఎవడైనా, ఏ రక్తాన్నైనా తింటే, రక్తాన్ని తినే ఆ వ్యక్తికి[b] విరోధంగా నేను నా ముఖాన్ని నిలిపి, అతని ప్రజల మధ్య నుండి అతన్ని కొట్టివేస్తాను[c].”
  to: “ఇశ్రాయేలు ఇంటివారిలోనివాడైనా, లేదా వారి మధ్య నివసిస్తున్న పరదేశిలోనివాడైనా[a], ఏ రక్తమైనా తింటే, రక్తాన్ని తినే ఆ వ్యక్తికి[b] వ్యతిరేకంగా నేను నా ముఖాన్ని త్రిప్పి, అతని ప్రజల మధ్య నుండి అతన్ని కొట్టివేస్తాను[c].”
  rationale: సవరణలు మూలార్థాన్ని మార్చవు. అవి దేవుని ‘ముఖం’ నుడికారంలోని వ్యతిరేక దిశను స్పష్టపరుస్తాయి, ఏకవచన న్యాయవిషయాన్ని మెరుగ్గా ప్రతిబింబిస్తాయి, మరియు పాదసూచికలో నֶפֶשׁ అర్థాన్ని పాఠకునికి స్పష్టంగా తెలియజేస్తాయి. ‘కొట్టివేయడం’ యొక్క శిక్షావిధానాన్ని ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయలేదు.
