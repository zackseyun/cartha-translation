id: LEV.17.10
reference: Leviticus 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: te
  text: “ఇశ్రాయేలు ఇంటివారిలోనివాడైనా, లేదా వారి మధ్య నివసిస్తున్న పరదేశిలోనివాడైనా[a], ఏ రక్తమైనా తింటే, రక్తాన్ని తినే ఆ వ్యక్తికి[b] వ్యతిరేకంగా నేను నా ముఖాన్ని త్రిప్పి, అతని ప్రజల మధ్య నుండి అతన్ని కొట్టివేస్తాను[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే కేవలం దారిన పోయే విదేశీయుడు కాదు; వారి మధ్య నివసించే స్థానికేతరుడు లేదా నివాస విదేశీయుడు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తాన్ని తినే ప్రాణి/వ్యక్తి’; ఇక్కడ అది నేరం చేసిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘కొట్టివేయడం’ అనేది ఒడంబడికపరమైన శిక్షను తెలిపే నుడికారం. అది మరణాన్ని, బహిష్కరణను, లేక మరొక విధమైన దైవిక తీర్పును సూచిస్తుందో ఈ వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: ఎవడైనా
  rationale: అישׁ పదం రెండుసార్లు రావడం పంపిణీయ న్యాయసూత్ర ప్రయోగం; ‘ఎవడైనా’ దాని ‘ప్రతి ఒక్క పురుషుడు/ఎవరైనా సరే’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారిలో
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే ఒడంబడికపరమైన సమూహ భావాన్ని పూర్తిగా సరళీకరించకుండా, తెలుగులో అర్థమయ్యే ‘ఇంటివారు’ అనే రూపంతో నిలిపింది.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: వారి మధ్య నివసించే పరదేశులలో
  rationale: גֵּר కేవలం ప్రయాణికుడిని కాక, ఇశ్రాయేలీయుల సమాజంలో నివసించే స్థానికేతరుణ్ని సూచిస్తుంది. ‘నివసించే పరదేశి’ ఆ న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: ఏ రక్తాన్నైనా తింటే
  rationale: యֹאכַל సాధారణంగా ‘తిను’; כָּל דָּם నిషేధం అన్ని రకాల రక్తానికీ వర్తిస్తుందని సూచిస్తుంది.
- source_word: וְנָתַתִּי פָנַי
  choice: విరోధంగా నేను నా ముఖాన్ని నిలిపి
  rationale: దైవిక వ్యతిరేకత, తీర్పును తెలిపే హీబ్రూ నుడికారంలోని ముఖరూపకాన్ని వ్యాఖ్యానంగా కరిగించకుండా నిలిపింది.
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: రక్తాన్ని తినే ఆ వ్యక్తికి
  rationale: ఇక్కడ נֶפֶשׁ నేరం చేసిన వ్యక్తిని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే సందర్భంలో లేని అధిభౌతిక భావం కలగవచ్చు.
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: అతన్ని కొట్టివేస్తాను
  rationale: כרת అనే ఒడంబడికపరమైన శిక్షా నుడికారాన్ని మరణశిక్ష, బహిష్కరణ లేదా మరొక ప్రత్యేక విధంగా నిర్ణయించకుండా ‘కొట్టివేయడం’గా నిలిపింది.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: అతని ప్రజల మధ్య నుండి
  rationale: מִקֶּרֶב అంటే ‘మధ్య నుండి’; వ్యాకరణపరంగా נֶפֶשׁను అనుసరించే స్త్రీలింగ ప్రత్యయం ఉన్నా, తెలుగులో అది ముందున్న పురుష న్యాయవిషయాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘కొట్టివేస్తాను’ అనే శిక్షా సూత్రం యొక్క ఖచ్చితమైన అర్థం
  choice: శిక్ష విధానాన్ని నిర్దిష్టం చేయకుండా ‘అతని ప్రజల మధ్య నుండి అతన్ని కొట్టివేస్తాను’ అనే నుడికారాన్ని నిలపడం.
  alternative: ‘చంపివేస్తాను,’ ‘సమాజం నుండి బహిష్కరిస్తాను,’ లేదా ‘దైవిక తీర్పుతో తొలగిస్తాను’ అని స్పష్టీకరించడం.
  rationale: వాక్యం తీవ్రమైన ఒడంబడిక తీర్పును ప్రకటిస్తుంది; అయితే అది ఇక్కడ మరణమా, బహిష్కరణా, లేక మరొక దైవిక తీర్పా అని నిర్వచించదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని వాడాం. ‘నా ముఖాన్ని నిలిపి,’ ‘కొట్టివేస్తాను’ వంటి మూలంలోని ముఖ్య నుడికారాలను అర్థవంతంగా నిలిపి, అవసరమైన వివరణలను పాదసూచికలకు పరిమితం చేశాం.
