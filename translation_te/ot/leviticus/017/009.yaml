id: LEV.17.9
reference: Leviticus 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: te
  text: దానిని యెహోవాకు అర్పించడానికి సమావేశపు గుడారపు ప్రవేశద్వారం దగ్గరకు తీసుకురాకపోతే,[a] ఆ మనిషి తన ప్రజల మధ్యనుండి కొట్టివేయబడాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘దానిని యెహోవా కోసం చేయడానికి’; ఇక్కడి హీబ్రూ నుడికారం బలిని సమర్పించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కొట్టివేయబడాలి’ అనేది ఒక న్యాయపరమైన సూత్రవాక్యం. ఇక్కడ శిక్ష యొక్క ఖచ్చితమైన రూపం చెప్పబడలేదు; అది నిబంధన సమాజం నుండి తొలగించబడటాన్ని లేదా దేవుని ప్రత్యక్ష తీర్పును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: పరిశుద్ధస్థల సందర్భంలో ప్రవేశించే చోటును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: ఇశ్రాయేలీయుల అరణ్యకాల పరిశుద్ధ గుడారానికి వాడిన స్థిరమైన హీబ్రూ నామాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- source_word: יְבִיאֶנּוּ
  choice: దానిని ... తీసుకురాకపోతే
  rationale: సందర్భంలోని బలి జంతువును సూచించే ప్రత్యయాన్ని నిలుపుతూ, భౌతికంగా తీసుకురావడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: దానిని యెహోవాకు అర్పించడానికి
  rationale: అక్షరార్థంగా ‘యెహోవా కోసం దానిని చేయడానికి’ అయినప్పటికీ, బలి సందర్భంలో עשה బలిని సమర్పించడాన్ని సూచించే నుడికారంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וְנִכְרַת
  choice: కొట్టివేయబడాలి
  rationale: శిక్ష అమలు విధానాన్ని నిర్దిష్టంగా తేల్చకుండా, హీబ్రూ న్యాయసూత్రంలోని ‘cut off’ రూపకాన్ని నిలుపుతుంది.
- source_word: הָאִישׁ הַהוּא
  choice: ఆ మనిషి
  rationale: మూలంలోని పుంలింగ ఏకవచన న్యాయపరమైన సూచనను యథాతథంగా ప్రతిబింబిస్తుంది.
- source_word: מֵעַמָּיו
  choice: తన ప్రజల మధ్యనుండి
  rationale: నేరస్థుడు తన ప్రజాసమాజం నుండి వేరుచేయబడటాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘కొట్టివేయబడాలి’ అనే శిక్ష యొక్క అర్థం
  choice: శిక్ష మరణమా, సమాజ బహిష్కరణా, లేక దేవుని ప్రత్యక్ష తీర్పా అని నిర్దిష్టం చేయకుండా ‘కొట్టివేయబడాలి’ అనే రూపకాన్ని నిలుపడం.
  alternative: ‘చంపబడాలి’ లేదా ‘సమాజం నుండి బహిష్కరించబడాలి’
  rationale: ఈ వాక్యంలోని హీబ్రూ న్యాయసూత్రం శిక్ష అమలు విధానాన్ని స్పష్టంగా నిర్వచించదు; దానిని మరింత సంకుచితంగా అర్థం చేయడం మూలంలోని న్యాయపరమైన, ధార్మిక ఉద్రిక్తతను తొలగిస్తుంది.
- issue: הָאִישׁ యొక్క లింగ సూచన
  choice: ‘ఆ మనిషి’ అని అనువదించడం.
  alternative: ‘ఆ వ్యక్తి’ లేదా ‘అలా చేసినవారు’
  rationale: మూలపాఠం పుంలింగ ఏకవచన న్యాయపరమైన వ్యక్తీకరణను ఉపయోగిస్తుంది; సందర్భం దానిని లింగనిరపేక్షంగా మార్చాలని నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేవీయకాండంలోని న్యాయపరమైన గంభీరతను కాపాడుతూ అనువదించబడింది. మూలంలోని షరతు నిర్మాణం, దైవనామం, పుంలింగ ఏకవచనం, మరియు శిక్షలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
