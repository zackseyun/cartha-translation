id: LEV.15.12
reference: Leviticus 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: te
  text: స్రావం గలవాడు[b] తాకిన మట్టిపాత్రను[a] పగులగొట్టాలి; చెక్కతో చేసిన ప్రతి పాత్రను నీళ్లతో కడగాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మృణ్మయ పాత్ర,’ ‘కుండ పాత్ర.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘స్రావం గలవాడు’; ఇది శరీరస్రావం ఉన్న వ్యక్తిని సూచించే శుద్ధి నియమాలకు సంబంధించిన సాంకేతిక పదం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘నీళ్లలో కడగాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: మట్టిపాత్ర
  rationale: כְלִי חֶרֶשׂ కాల్చిన మట్టి లేదా మృణ్మయ పదార్థంతో చేసిన పాత్రను సూచిస్తుంది. శుద్ధి నియమంలో పదార్థాల మధ్య ఉన్న తేడాను ‘మట్టిపాత్ర’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: తాకిన
  rationale: נגע Qal రూపానికి ఇక్కడ నేరమైన అర్థం ‘తాకు.’ తెలుగు సంబంధవాచక నిర్మాణంలో ‘తాకిన’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: הַזָּב
  choice: స్రావం గలవాడు
  rationale: זָב అనేది శరీరస్రావం ఉన్న వ్యక్తిని సూచించే శుద్ధి నియమ సంబంధ సాంకేతిక పదం. హెబ్రీలోని పుంలింగ రూపాన్నీ, పరిస్థితి-కేంద్రీకృత భావాన్నీ ఈ ఎంపిక నిలుపుతుంది.
- source_word: יִשָּׁבֵר
  choice: పగులగొట్టాలి
  rationale: שבר Niphal ఇక్కడ న్యాయవిధిలోని కర్తవ్యాన్ని తెలిపే కర్మణి భావం కలిగి ఉంది. తెలుగులో ‘పగులగొట్టాలి’ ఆ ఆజ్ఞాత్మక న్యాయబలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָל כְּלִי עֵץ
  choice: చెక్కతో చేసిన ప్రతి పాత్ర
  rationale: ఈ పదబంధం చెక్క పదార్థంతో చేసిన ప్రతి పాత్రను సూచిస్తుంది. ‘చెక్కతో చేసిన’ పదార్థాన్ని స్పష్టం చేస్తూ మొదటి పాత్రతో సమాంతరతను నిలుపుతుంది.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: నీళ్లతో కడగాలి
  rationale: שטף ఇక్కడ నీటితో కడగడం లేదా జాడించడం అనే భావాన్ని ఇస్తుంది. పాత్రకు సంబంధించి ‘నీళ్లతో కడగాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సాధనార్థక లేదా స్థలార్థక అవకాశాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర విధి యొక్క గంభీరతను నిలుపుతూ అనువదించబడింది. ‘స్రావం గలవాడు’ సందర్భంలోని సాంకేతిక శుద్ధి-పదాన్ని సూటిగా ఉంచుతుంది; ‘పగులగొట్టాలి,’ ‘కడగాలి’ విధి యొక్క ఆజ్ఞాత్మక బలాన్ని సహజ తెలుగు రూపంలో తెలియజేస్తాయి.
