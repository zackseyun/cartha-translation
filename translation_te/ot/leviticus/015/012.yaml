  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew legal instruction: an earthenware vessel touched by the zav is to be broken, while every wooden vessel is to be washed/rinsed with water. The Telugu retains the masculine reference of הַזָּב and the obligatory force of the imperfects in context.'
  naturalness: 'The verse is clear and natural in modern standard Telugu. A minor revision is advisable in footnote c: “జాడించాలి” is not a clear or broadly natural modern Telugu alternative in this context.'
  terminology: “స్రావం గలవాడు” suitably conveys the technical purity-law designation when supported by the explanatory note. “మట్టిపాత్ర” and “చెక్కతో చేసిన ప్రతి పాత్ర” preserve the material distinction in the Hebrew. The cultural note should gloss the Hebrew as a person who has a bodily discharge, rather than the potentially less precise “స్రవించేవాడు.”
  issues:
  - severity: low
    issue: Footnote c includes “నీళ్లతో జాడించాలి.”
    rationale: This wording is unclear and less idiomatic than the main rendering. The valid alternative represented by the source and English audit trail is washing ‘in water.’
  - severity: low
    issue: Footnote b says Hebrew “స్రవించేవాడు.”
    rationale: The Hebrew substantive הַזָּב is a technical designation for the person affected by a bodily discharge. “శరీరస్రావం ఉన్నవాడు” is clearer and avoids suggesting merely an active verbal description.
