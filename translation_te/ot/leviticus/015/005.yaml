id: LEV.15.5
reference: Leviticus 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: te
  text: అతని పడకను[a] తాకిన మనిషి తన బట్టలు ఉతికి, నీటిలో స్నానం చేయాలి; సాయంత్రం వరకు అతడు అపవిత్రుడిగా[b] ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు పడుకున్న స్థలాన్ని.’ హీబ్రూ పదం నిర్మించిన పడకను మాత్రమే కాక, అతడు పడుకున్న స్థలాన్ని లేదా పరుపును కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, శుద్ధి నియమాల ప్రకారం ఆచారపరంగా అపవిత్రుడు; ఇది నైతిక దోషాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: తాకిన వ్యక్తి
  rationale: אִישׁ వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఈ నియమ వాక్యంలో సంబంధిత వ్యక్తిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘వ్యక్తి’ అని అనువదించి, తరువాతి పుంలింగ సూచనను ‘అతడు’లో నిలిపాం.
- source_word: יִגַּע
  choice: తాకిన
  rationale: נגע యొక్క సాధారణ అర్థమైన ప్రత్యక్ష స్పర్శను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּמִשְׁכָּבוֹ
  choice: అతని పడకను
  rationale: מִשְׁכָּב అనేది పడుకునే స్థలం లేదా పరుపును సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘పడక’ను వాడి, విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుకుకొని
  rationale: כִּבֵּס వస్త్రాలను ఉతకడాన్ని ప్రత్యేకంగా సూచిస్తుంది. ‘తన’ కర్తతో సహసూచనను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీటితో స్నానం చేయాలి
  rationale: רחץ ఇక్కడ శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది. בַּמַּיִם లోని సాధనార్థాన్ని ఆధునిక తెలుగులో ‘నీటితో’ సహజంగా తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: טָמֵא ఇక్కడ లేవీయ శుద్ధి నియమాల ప్రకారం అపవిత్ర స్థితిని సూచిస్తుంది; నైతిక దోషాన్ని కాదు.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: అపవిత్ర స్థితి కొనసాగే కాలపరిమితిని సరళంగా, కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయ శుద్ధి ధర్మశాస్త్రంలో ‘అపవిత్రుడు’ అనే స్థితి స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘అపవిత్రుడిగా’ అని ఉంచి, అది ఆచారపరమైన స్థితి అని పాదసూచికలో వివరించాం.
  alternative: ‘ఆచారపరంగా అపవిత్రుడిగా’ అని ప్రధాన పాఠ్యంలోనే విస్తరించడం.
  rationale: మూలంలోని טָמֵא అనే వర్గాన్ని నిలిపి, అది నైతిక అపరాధమనే భావాన్ని అనవసరంగా చేర్చకుండా సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిధి శైలిని వాడాం. ‘చేయాలి’ ఆజ్ఞాత్మక న్యాయబలాన్ని తెలియజేస్తుంది; ‘అపవిత్రుడు’ లేవీయ శుద్ధి పదజాలాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
