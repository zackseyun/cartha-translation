source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: te
  text: ఒక స్త్రీకి స్రావం కలిగి ఉంటే, ఆమె శరీరంలోని ఆ స్రావం రక్తమైతే,[a] ఆమె ఏడు రోజులు తన రుతుక్రమ అశుద్ధస్థితిలో ఉంటుంది.[b] ఆమెను తాకే ప్రతి ఒక్కరూ సాయంత్రం వరకు అశుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆమె మాంసంలో/శరీరంలో ఆమె స్రావం రక్తమైతే.”'
    reason: lexical_alternative
  - marker: b
    text: “రుతుక్రమ అశుద్ధస్థితి” అనేది లేవీయ ధర్మశాస్త్రంలోని ఆచారపరమైన అశుద్ధతను సూచిస్తుంది; అది తప్పనిసరిగా నైతిక తప్పును సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: స్రావం కలిగి / ఆ స్రావం
  rationale: זוּב శరీరం నుంచి జరిగే ప్రవాహం లేదా స్రావాన్ని సూచిస్తుంది. ‘స్రావం’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత అది రక్తమని చెప్పడానికి అనుకూలంగా ఉంది.
- source_word: דָּם
  choice: రక్తం
  rationale: మూలపదానికి నేరమైన, స్పష్టమైన సమానార్థకం.
- source_word: בִּבְשָׂרָהּ
  choice: ఆమె శరీరంలోని
  rationale: בשר అక్షరార్థంగా ‘మాంసం’ అయినా ఇక్కడ శరీరాన్ని సూచిస్తుంది; ב అనే ఉపసర్గలోని ‘లో’ భావాన్ని కాపాడుతూ సహజమైన తెలుగు వాడబడింది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: సంఖ్యా వ్యక్తీకరణను నేరుగా అనువదిస్తుంది.
- source_word: בְנִדָּתָהּ
  choice: తన రుతుక్రమ అశుద్ధస్థితిలో
  rationale: లేవీయకాండంలోని נִדָּה కేవలం జీవశాస్త్రీయ రుతుస్రావాన్ని కాక, దానికి సంబంధించిన ఆచారపరమైన అశుద్ధస్థితిని సూచిస్తుంది.
- source_word: כָל הַנֹּגֵעַ בָּהּ
  choice: ఆమెను తాకే ప్రతి ఒక్కరూ
  rationale: כל తో కూడిన కృదంతం సాధారణంగా వర్తించే ప్రతి వ్యక్తినీ సూచిస్తుంది.
- source_word: יִטְמָא
  choice: అశుద్ధులుగా ఉంటారు
  rationale: టుమా అనే ఆచారపరమైన స్థితిని తెలుపుతుంది; తెలుగు వాక్యంలోని బహువచన సాధారణ కర్తకు అనుగుణంగా రూపం మార్చబడింది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: తెలుగులో సహజమైన కాలపరిమితి వ్యక్తీకరణ; హెబ్రీ పదబంధ భావాన్ని పూర్తిగా అందిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన అశుద్ధతను నైతిక అపరాధంగా భావింపజేయకుండా అనువదించడం
  choice: ‘రుతుక్రమ అశుద్ధస్థితి,’ ‘అశుద్ధులు’ అనే ఆచారస్థితి పదాలు
  alternative: ‘మైల,’ ‘అపవిత్రత,’ లేదా నైతిక కలుషితతను సూచించే పదాలు
  rationale: లేవీయకాండం 15లోని పదాలు ప్రధానంగా ఆచారపరమైన స్థితిని తెలియజేస్తాయి; ఈ వచనం స్వయంగా నైతిక దోషాన్ని ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. న్యాయవిధి స్వరాన్ని నిలిపి, ‘మైల’ వంటి ప్రాంతీయంగా లేదా అవమానకరంగా వినిపించగల పదాన్ని నివారించింది.
