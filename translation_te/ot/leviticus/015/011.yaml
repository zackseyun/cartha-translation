source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: te
  text: స్రావం ఉన్న పురుషుడు నీళ్లతో తన చేతులు కడుక్కోకుండా ఎవరిని తాకినా[a], ఆ వ్యక్తి తన బట్టలు ఉతుకుకొని, నీళ్లతో స్నానం చేయాలి; ఆ వ్యక్తి సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నీళ్లతో తన చేతులు కడుక్కోకపోతే.” స్పర్శ అపవిత్రతను కలిగించే షరతును ఈ హెబ్రీ వాక్యభాగం ఇలా పేర్కొంటున్నదిగా కూడా చదవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: స్రావం ఉన్న పురుషుడు
  rationale: זוּב ధాతువు నుంచి వచ్చిన ఈ పదం, ఈ శుద్ధి నియమ సందర్భంలో శరీర స్రావం ఉన్న పురుషుణ్ణి సూచిస్తుంది. తెలుగు అనువాదం పురుష సూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: יִגַּע בּוֹ
  choice: ఎవరిని తాకినా
  rationale: נגע అనే క్రియ ב ఉపసర్గతో శారీరక స్పర్శను సూచిస్తుంది. పంపిణీ భావమున్న כֹל אֲשֶׁר తో కలిపి ‘ఎవరిని తాకినా’ సహజమైన తెలుగు.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: నీళ్లతో తన చేతులు కడుక్కోకుండా
  rationale: שטף కు కడగడం లేదా నీటితో శుభ్రపరచడం అనే భావం ఉంది. ఇది స్రావం ఉన్న పురుషుడు తాకకముందు చేతులు కడుక్కోని పరిస్థితిని సూచించే అనుబంధ వాక్యంగా అనువదించబడింది; హెబ్రీ నిర్మాణంలోని భావవ్యాప్తిని పాదసూచిక తెలియజేస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: తన బట్టలు ఉతుకుకొని
  rationale: כּבס సాధారణంగా వస్త్రాలను ఉతకడాన్ని సూచిస్తుంది. ‘బట్టలు ఉతుకుకొని’ ఆధునిక తెలుగులో సహజంగా ఉండి నిర్దిష్ట ఆచరణను తెలియజేస్తుంది.
- source_word: וְרָחַץ בַּמָּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: רחץ ఇక్కడ శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది. బట్టలు ఉతకడం నుంచి భేదం నిలిచేలా ‘స్నానం చేయాలి’ అని అనువదించబడింది.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు
  rationale: טמא ఇక్కడ నైతిక దోషాన్ని కాక ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ‘అపవిత్రుడు’ ఆ శుద్ధి-అశుద్ధి వర్గాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: లేవీయకాండంలోని శుద్ధి నియమంలో טמא స్వభావం
  choice: ఆచారపరమైన స్థితిని సూచించే ‘అపవిత్రుడు’
  alternative: కలుషితుడు
  rationale: ఈ వచనం శారీరక స్రావం వల్ల స్పర్శ ద్వారా కలిగే ఆచారపరమైన అపవిత్రతను, దానికి సంబంధించిన కడుక్కోవడం మరియు కాలపరిమితిని వివరిస్తుంది. నైతిక అపరాధ భావాన్ని చేర్చకుండా ‘అపవిత్రుడు’ మూలంలోని వర్గాన్ని నిలుపుతుంది.
- issue: చేతులు కడుక్కోని వ్యక్తి ఎవరు?
  choice: ప్రధాన పాఠ్యంలో స్రావం ఉన్న పురుషునికే చేతులను అన్వయించడం
  alternative: హెబ్రీ వాక్యభాగాన్ని ‘అతడు నీళ్లతో తన చేతులు కడుక్కోకపోతే’ అనే షరతుగా చదవడం
  rationale: వ్యాకరణం మరియు సందర్భం చేతులు స్రావం ఉన్న పురుషునివేనని బలంగా సూచిస్తాయి. అయితే హెబ్రీ వాక్య నిర్మాణంలోని షరతు భావాన్ని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘స్రావం’, ‘అపవిత్రుడు’ వంటి పదాలు ఈ శుద్ధి నియమ సందర్భంలోని సాంకేతిక భావాన్ని నిలుపుతాయి; ‘బట్టలు ఉతుకుకొని’ మరియు ‘స్నానం చేయాలి’ అనే పదబంధాలు వేర్వేరు హెబ్రీ క్రియల భేదాన్ని సహజంగా తెలియజేస్తాయి.
