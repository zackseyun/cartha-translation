  edition: WLC
  text: וְ/הַ/דָּוָה֙ בְּ/נִדָּתָ֔/הּ וְ/הַ/זָּב֙ אֶת זוֹב֔/וֹ לַ/זָּכָ֖ר וְ/לַ/נְּקֵבָ֑ה וּ/לְ/אִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם טְמֵאָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: te
  text: మరియు నెలసరి అపవిత్రతలో ఉన్న అస్వస్థురాలైన స్త్రీ[a] గురించినదీ, పురుషుడైనా స్త్రీయైనా స్రావం ఉన్న వ్యక్తి గురించినదీ, అపవిత్రురాలైన స్త్రీతో శయనించే పురుషుని గురించినదీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నెలసరి అపవిత్రత’ ఇక్కడ లేవీయ ధర్మశాస్త్రం ప్రకారం ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది; నైతిక అపవిత్రతను కాదు. ‘అస్వస్థురాలైన’ అనే అనువాదం హీబ్రూ పదంలోని బాధపడే లేదా అస్వస్థ స్థితి భావాన్ని ప్రతిబింబిస్తుంది; సందర్భం నెలసరి స్థితినే సూచిస్తుంది.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: הַדָּוָה בְּנִדָּתָהּ
  choice: నెలసరి అపవిత్రతలో ఉన్న స్త్రీ
  rationale: הַדָּוָה అనే పదం అస్వస్థత లేదా ప్రవాహ స్థితిలో ఉన్న స్త్రీని సూచించగలిగినా, దాని వెంట ఉన్న בְּנִדָּתָהּ ఇక్కడ నెలసరి స్థితినే స్పష్టం చేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు రెండింటినీ కలిపి అనువదించి, పదసంబంధమైన ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: הַזָּב אֶת זוֹבוֹ
  choice: స్రావం ఉన్న వ్యక్తి
  rationale: మూలంలోని సమానధాతు నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తీకరిస్తుంది. తరువాతి ‘పురుషుడైనా స్త్రీయైనా’ అనే పరిధికి అనుగుణంగా లింగనిరపేక్షమైన ‘వ్యక్తి’ వాడబడింది.
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: పురుషుడైనా స్త్రీయైనా
  rationale: ముందున్న స్రావం సంబంధిత నియమం రెండు లింగాలకూ వర్తిస్తుందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: తో శయనించే
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తిని స్పష్టత కోల్పోకుండా, గౌరవప్రదమైన బైబిలు శైలిలో నిలుపుతుంది.
- source_word: טְמֵאָה
  choice: అపవిత్రురాలైన స్త్రీ
  rationale: లేవీయకాండంలోని ఆచారపరమైన అపవిత్రత వర్గాన్ని సూచిస్తుంది; నైతిక దోషం లేదా మురికితనాన్ని సూచించే మాటలను నివారిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన పవిత్రత పదజాలం
  choice: ‘నెలసరి అపవిత్రత’, ‘అపవిత్రురాలు’ అని అనువదించడం
  alternative: ‘మలినత’, ‘నైతికంగా అపవిత్రురాలు’ అనే భావాన్ని కలిగించే అనువాదాలు
  rationale: ఈ వచనం లేవీయ ధర్మశాస్త్రంలోని ఆచారపరమైన స్థితులను వివరిస్తుంది; స్త్రీ నైతిక విలువపై తీర్పు ఇవ్వదు. అందువల్ల ఆచారపరమైన భావాన్ని పాదటీపులో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా రూపంలోని ఈ ముగింపు వాక్య నిర్మాణాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘శయనించే’ అనే సభ్యోక్తి మూలంలోని మృదువైన లైంగిక సూచనను కాపాడుతుంది.
