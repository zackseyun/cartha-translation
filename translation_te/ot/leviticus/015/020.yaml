id: LEV.15.20
reference: Leviticus 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: te
  text: ఆమె రుతుస్రావానికి సంబంధించిన ఆచారపరమైన అశుద్ధ స్థితిలో ఉన్నప్పుడు దేనిమీద పరుంటుందో, అది అశుద్ధమవుతుంది; ఆమె దేనిమీద కూర్చుంటుందో, అది అశుద్ధమవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె రుతుస్రావ సమయంలో.” హీబ్రూ పదం రుతుస్రావాన్ని మాత్రమే కాక, దానితో ముడిపడిన ఆచారపరమైన అశుద్ధ స్థితిని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: రుతుకాలపు అశుద్ధత
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం శారీరక రుతుస్రావాన్ని కాక, దానితో ముడిపడిన ఆచారపరమైన అశుద్ధ స్థితిని కూడా సూచిస్తుంది.
- source_word: תִּשְׁכַּב
  choice: పడుకుంటుందో
  rationale: שׁכב ఇక్కడ నిద్రపోవడాన్ని తప్పనిసరిగా సూచించదు; ఏదైనా వస్తువుమీద పరుండడం లేదా పడుకోవడం అనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תֵּשֵׁב
  choice: కూర్చుంటుందో
  rationale: ישׁב ఇక్కడ ఒక వస్తువుమీద కూర్చోవడం అనే ప్రత్యక్ష అర్థంలో ఉంది.
- source_word: עָלָיו
  choice: దేనిమీద
  rationale: స్త్రీ కింద ఉన్న వస్తువుతో గల ప్రాదేశిక సంబంధాన్ని సహజమైన తెలుగు సంబంధ వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: יִטְמָא
  choice: అశుద్ధమవుతుంది
  rationale: టుమా అనే ఆచారపరమైన అశుద్ధ స్థితిలోకి ఆ వస్తువు ప్రవేశిస్తుందని తెలియజేస్తుంది; నైతిక దోషాన్ని సూచించదు.
- source_word: וְכֹל אֲשֶׁר
  choice: దేనిమీద ... అది
  rationale: హీబ్రూలోని సమగ్ర సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: లేవీయకాండంలోని అశుద్ధత స్వభావం
  choice: టמא మరియు נִדָּה పదాలను ఆచారపరమైన శుద్ధి-అశుద్ధత పరిధిలో అనువదించడం
  alternative: రుతుస్రావం నైతిక అపరాధమో పాపమో అన్న భావం కలిగేలా అనువదించడం
  rationale: ఈ వచనం ఇశ్రాయేలు ఆచారపరమైన శుద్ధి నియమాలకు సంబంధించినది. రుతుస్రావాన్ని నైతిక తప్పుగా వచనం పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయవాక్య శైలి ఉపయోగించబడింది. ‘అశుద్ధత’ను నైతిక దోషంగా కాక ఆచారపరమైన స్థితిగా సందర్భం తెలియజేస్తుంది.
