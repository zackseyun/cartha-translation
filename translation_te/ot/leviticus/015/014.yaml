reference: Leviticus 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: te
  text: ఎనిమిదవ రోజున అతడు తన కోసం రెండు గువ్వలను లేదా రెండు పావురపు పిల్లలను తీసుకొని, సమావేశపు గుడారం ప్రవేశద్వారం దగ్గర యాహ్వే[a] సన్నిధికి వచ్చి, వాటిని యాజకునికి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అనే రూపమూ వాడుకలో ఉంది.'
    reason: దైవనామానికి సంబంధించిన సంప్రదాయ అనువాదం మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: న్యాయవిధుల వరుసలోని కాలసూచనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; వాక్యారంభంలోని וּ భావం సందర్భంలోని కొనసాగింపులో అంతర్లీనంగా ఉంది.
- source_word: יִקַּח לוֹ
  choice: అతడు తన కోసం ... తీసుకొని
  rationale: לוֹ అనే దత్తివ సర్వనామాన్ని ‘తన కోసం’ అని స్పష్టంగా నిలుపుతుంది; న్యాయవిధి క్రమాన్ని తెలుగులో ‘తీసుకొని ... వచ్చి ... ఇవ్వాలి’ అనే సహజ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: שְׁתֵּי תֹרִים
  choice: రెండు తెల్ల గువ్వలను
  rationale: תֹרִים బలుల సందర్భంలో తాబేలు గువ్వలు/టర్టిల్‌డవ్‌లను సూచిస్తుంది; ‘తెల్ల గువ్వలు’ తెలుగు బైబిలు వాడుకలో సుపరిచితమైన, సాధారణ పాఠకులకు అర్థమయ్యే పేరు.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: లేదా రెండు పావురపు పిల్లలను
  rationale: ‘పావురపు కుమారులు’ అనే హీబ్రూ నుడికారానికి సహజమైన అర్థం చిన్న/యువ పావురాలు; ‘పావురపు పిల్లలు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి వచ్చి
  rationale: לִפְנֵי యొక్క ‘ముందుకు/సన్నిధికి’ భావాన్ని కాపాడుతుంది; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ద్వారం దగ్గర
  rationale: పాఠ్యంలో సూచించిన స్థలాన్ని సహజ తెలుగులో తెలియజేస్తుంది. אֹהֶל מוֹעֵדకు తెలుగు బైబిలు సంప్రదాయంలో పారదర్శకమైన ‘ప్రత్యక్ష గుడారం’ వాడబడింది.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: వాటిని యాజకునికి ఇవ్వాలి
  rationale: נתן యొక్క ప్రత్యక్షంగా ఇవ్వడం/అప్పగించడం అనే భావాన్ని సులభంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా ఆధునికంగా లిప్యంతరీకరిస్తుంది; పాదసూచిక సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా చదవగల న్యాయవిధి శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని క్రమబద్ధమైన ఆజ్ఞార్థాన్ని ‘తీసుకొని ... వచ్చి ... ఇవ్వాలి’ నిర్మాణంలో నిలిపింది.
