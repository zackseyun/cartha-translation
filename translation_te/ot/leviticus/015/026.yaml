id: LEV.15.26
reference: Leviticus 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: te
  text: ఆమె స్రావం ఉన్న రోజులన్నిటిలో ఆమె పడుకునే ప్రతి పరుపు, ఆమె రుతుక్రమపు పరుపువలె ఆమెకు ఉంటుంది[a]. ఆమె కూర్చునే ప్రతి వస్తువు[b] ఆమె రుతుక్రమ అశుద్ధతవలె అశుద్ధంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె రుతుక్రమ అశుద్ధతలోని పరుపువలె.” ఇక్కడి హీబ్రూ పదం రుతుక్రమ స్థితినీ, దానితో సంబంధించిన ఆచారపరమైన వేరుపాటునీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “వస్తువు” అనేది పాత్రను మాత్రమే కాకుండా, ఆమె కూర్చునే ఏ సామాను లేదా వస్తువునైనా సూచించే విస్తృత పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: పరుపు
  rationale: పడుకునే స్థలాన్ని సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘పరుపు’; ‘మంచం’ కంటే ఇది వస్తువు లేదా పడుకునే ఉపరితలం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: ఆమె స్రావం ఉన్న రోజులన్నిటిలో
  rationale: זוֹב ఇక్కడ అసాధారణ శారీరక స్రావాన్ని సూచిస్తుంది. ‘స్రావం’ వైద్యపరంగా స్పష్టమైనది; కాలవ్యాప్తిని తెలుగు సహజంగా వ్యక్తం చేయడానికి ‘ఉన్న రోజులన్నిటిలో’ వాడబడింది.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: ఆమె రుతుక్రమ సమయంలోని పరుపువలె
  rationale: נִדָּה ఈ సందర్భంలో రుతుస్రావ స్థితిని, దానితో ముడిపడిన ఆచారపరమైన వేరుపాటును సూచించగలదు. ప్రధాన పాఠంలో స్పష్టమైన ‘రుతుక్రమం’ వాడి, విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִהְיֶה לָּהּ
  choice: ఉంటుంది
  rationale: హీబ్రూ నిర్మాణం ఆమెకు సంబంధించి అదే ఆచారపరమైన స్థితి కలుగుతుందని వర్గీకరిస్తుంది. తెలుగులో శబ్దానువాదమైన ‘ఆమెకు అవుతుంది’ కంటే ‘ఉంటుంది’ సహజంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: כְּלִי
  choice: వస్తువు
  rationale: כְּלִי పాత్రకే పరిమితం కాకుండా పనిముట్టు, సామాను లేదా వస్తువును సూచించే విస్తృత పదం. ఆమె కూర్చునే దానిని సూచించే ఈ సందర్భంలో ‘వస్తువు’ తప్పుదారి పట్టించకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: טָמֵא / טֻמְאָה
  choice: అపవిత్రంగా / అపవిత్రత
  rationale: లేవీయకాండపు శుద్ధి నియమాలలో ఇవి ఆచారపరమైన స్థితిని సూచిస్తాయి. ఒకే తెలుగు మూలపదాన్ని వాడటం హీబ్రూలోని పదసంబంధాన్ని కనిపించేలా చేస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు నియమాలలో అపవిత్రత స్వభావం
  choice: טָמֵא / טֻמְאָה పదాలను ‘అపవిత్రంగా / అపవిత్రత’గా అనువదించి, అవి ఆచారపరమైన స్థితిని సూచిస్తున్నట్లు గ్రహించడం.
  alternative: ‘అశుద్ధంగా / అశుద్ధత’ లేదా నైతిక కల్మషాన్ని సూచించే భాష.
  rationale: ఈ వాక్యం వ్యక్తిగత పాపదోషాన్ని ప్రకటించడం లేదు; ఇశ్రాయేలు ఆచార శుద్ధి వ్యవస్థలోని స్థితిని వివరిస్తోంది. సందర్భం ఆ అర్థాన్ని నియంత్రిస్తుంది.
- issue: נִדָּה పదం యొక్క భావపరిధి
  choice: ప్రధాన పాఠంలో ‘రుతుక్రమం’ అని స్పష్టంగా అనువదించడం.
  alternative: ‘రుతుక్రమ అపవిత్రత’ లేదా ‘రుతుక్రమ వేరుపాటు’.
  rationale: ఈ సందర్భంలో పోలిక రుతుస్రావ స్థితితోనే ఉంది. అయితే ఆ పదంలో ఆచారపరమైన అపవిత్రత లేదా వేరుపాటు భావం కూడా ఉండవచ్చు కాబట్టి దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటించాం. శారీరక స్రావాన్ని సూటిగా కానీ అసభ్యంగా కాకుండా పేర్కొన్నాం. ‘పరుపు’, ‘వస్తువు’ వంటి సహజ పదాలతో మూలంలోని విస్తృతిని నిలిపి, ఆచారపరమైన అపవిత్రతను నైతిక దోషంగా మార్చకుండా జాగ్రత్తపడ్డాం.
