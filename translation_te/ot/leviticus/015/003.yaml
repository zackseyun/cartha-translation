reference: Leviticus 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: te
  text: 'అతని స్రావం విషయంలో అతని అశుద్ధత ఇలా ఉంటుంది: అతని శరీరం నుంచి స్రావం కారుతున్నా[a], లేదా స్రావం వెలువడకుండా అతని శరీరం మూసుకుపోయినా, అదే అతని అశుద్ధత.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని మాంసం అతని స్రావాన్ని కారుస్తున్నా … స్రావం వెలువడకుండా అతని మాంసం మూసుకుపోయినా.’ హెబ్రీలో అక్షరార్థంగా ‘మాంసం’ ఉంది; ఇక్కడ అది స్రావంతో సంబంధమున్న శరీర భాగాన్ని లేదా శారీరక స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: అతని అశుద్ధత
  rationale: లేవీయకాండంలోని ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అశుద్ధత’ సహజంగా ఉండి, కేవలం శారీరక మలినతకే పరిమితం కాకుండా ధర్మశాస్త్ర సంబంధిత వర్గాన్ని నిలుపుతుంది.
- source_word: זוֹב
  choice: స్రావం
  rationale: ఈ సందర్భంలో అసాధారణమైన జననేంద్రియ స్రావాన్ని సూచిస్తుంది. ‘స్రావం’ స్పష్టమైన, గౌరవప్రదమైన, వైద్యపరంగా సహజమైన పదం.
- source_word: רָר
  choice: కారుతున్నా
  rationale: స్రావం శరీరం నుంచి వెలువడుతూ ఉండడాన్ని సూచిస్తుంది; ‘కారు’ అనే క్రియ తెలుగులో ద్రవస్రావానికి సహజమైనది.
- source_word: בְּשָׂרוֹ
  choice: అతని శరీరం
  rationale: అక్షరార్థంగా ‘అతని మాంసం’ అయినప్పటికీ, ఇక్కడ స్రావంతో సంబంధమున్న శరీర భాగం లేదా శారీరక స్థితిని సూచిస్తుంది. ‘శరీరం’ అపార్థాన్ని నివారించి సహజంగా ఉంటుంది.
- source_word: הֶחְתִּים
  choice: మూసుకుపోయినా
  rationale: స్రావం స్వేచ్ఛగా వెలువడకుండా శరీర భాగం మూసుకుపోవడం లేదా నిరోధించబడడాన్ని సూచిస్తుంది; ప్రవహించే స్థితికి ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: מִזּוֹבוֹ
  choice: స్రావం రాకుండా
  rationale: హెబ్రీ పదబంధంలోని విడిపోవడం/నిరోధం భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, స్రావం కారడం అనే మొదటి పరిస్థితితో వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: וְזֹאת תִּהְיֶה
  choice: ఇదే
  rationale: న్యాయనియమ పరిచయ సూత్రాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భంలో విధివాక్య బలం నిలుస్తుంది.
- source_word: אוֹ
  choice: …ఉన్నా, లేదా …ఉన్నా
  rationale: ఒకే అశుద్ధ స్థితికి దారితీసే రెండు ప్రత్యామ్నాయ పరిస్థితులను తెలుగులో స్పష్టంగా చూపిస్తుంది.
