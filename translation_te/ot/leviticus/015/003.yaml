translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్రపు గంభీరతను నిలుపుతూ, వైద్యపరంగా స్పష్టమైన మరియు గౌరవప్రదమైన పదజాలం వాడబడింది. హెబ్రీ వాక్యంలోని రెండు ప్రత్యామ్నాయ శారీరక పరిస్థితుల మధ్య ఉన్న ఉద్రిక్తతను వివరణతో తొలగించకుండా అనువదించబడింది.
