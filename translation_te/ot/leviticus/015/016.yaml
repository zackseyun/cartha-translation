source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: te
  text: ఒక పురుషుని నుండి వీర్యం స్రవిస్తే[a], అతడు తన శరీరమంతటినీ నీళ్లతో కడుక్కోవాలి; సాయంత్రం వరకు అపవిత్రుడై ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వీర్యస్ఖలనం జరిగితే’; మరింత అక్షరార్థంగా, ‘బీజస్రావం జరిగితే.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అపవిత్రుడు’ అనేది లేవీయ శుద్ధి నియమాల సందర్భంలో ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; అది తప్పనిసరిగా నైతిక అపరాధాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: ఈ నియమం పురుషుని శరీరం నుండి జరిగే వీర్యస్రావాన్ని ప్రత్యేకంగా ప్రస్తావిస్తున్నందున లింగనిర్దిష్టమైన పదాన్ని వాడాం.
- source_word: כִּי
  choice: …తే
  rationale: నియమవాక్య సందర్భంలో షరతును సహజమైన తెలుగు క్రియాంతంతో వ్యక్తం చేశాం.
- source_word: תֵצֵא מִמֶּנּוּ
  choice: అతని నుండి … స్రవిస్తే
  rationale: మూలంలోని ‘అతని నుండి బయటకు వస్తే’ అనే భావాన్ని సహజమైన ఆధునిక వైద్యసంబంధ తెలుగు వాడుకలో తెలిపాం.
- source_word: שִׁכְבַת זָרַע
  choice: వీర్యం
  rationale: ఈ సంయుక్త పదబంధం వీర్యస్రావాన్ని సూచిస్తుంది; స్పష్టత కోసం ప్రధాన వాక్యంలో ‘వీర్యం స్రవిస్తే’ అని, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటీకలో ఇచ్చాం.
- source_word: וְרָחַץ בַּמַּיִם אֶת כָּל בְּשָׂרוֹ
  choice: అతడు తన శరీరమంతటినీ నీళ్లతో కడుక్కోవాలి
  rationale: మొత్తం శరీరాన్ని నీటితో కడగాలనే ఆజ్ఞను సహజంగా, మూలానికి సమీపంగా వ్యక్తం చేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడై ఉంటాడు
  rationale: లేవీయకాండంలోని శుద్ధి నియమాలకు సాధారణంగా సరిపోయే పదాన్ని ఉంచి, ఇది నైతిక దోషాన్ని తప్పనిసరిగా సూచించదని పాదటీకలో స్పష్టం చేశాం.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా తెలిపాం.
theological_decisions:
- issue: శుద్ధి నియమాలలో טָמֵא స్వభావం
  choice: ప్రధాన వాక్యంలో ‘అపవిత్రుడై ఉంటాడు’; పాదటీకలో ఆచారపరమైన అపవిత్రత అని వివరణ
  alternative: నైతికంగా అపవిత్రుడు / ఆచారపరంగా అపవిత్రుడు అని ప్రధాన వాక్యంలోనే విస్తరించడం
  rationale: హీబ్రూ పదం సంక్షిప్తంగానే ఉంది. ప్రధాన వాక్యంలో దాని రూపాన్ని నిలిపి, ఈ సందర్భంలో అది లేవీయ శుద్ధి నియమాలకు సంబంధించిన స్థితి గాని తప్పనిసరిగా నైతిక అపరాధం కాదని పాదటీక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన శైలిని వాడాం. శరీర సంబంధ విషయాన్ని అస్పష్టమైన సభ్యోక్తితో కప్పిపుచ్చకుండా, అలాగే అనవసరంగా వైద్యపరిభాషాత్మకంగా కాకుండా చెప్పాం. మూలంలోని న్యాయవాక్య నిర్మాణాన్ని సహజమైన తెలుగు షరతు–ఆజ్ఞ–స్థితి క్రమంలో అందించాం.
