id: LEV.15.32
reference: Leviticus 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: te
  text: 'స్రావమున్న వ్యక్తికి, అలాగే వీర్యస్ఖలనం జరిగి దానివల్ల అపవిత్రుడయ్యే పురుషునికి సంబంధించిన నియమం ఇదే:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: ధర్మశాస్త్రం ఇదే
  rationale: ఇది ఆయా పరిస్థితులకు సంబంధించిన నియమాల సారాంశాన్ని పరిచయం చేసే లేవీయకాండ సూత్రవాక్యం. ఆధునిక తెలుగు బైబిలు శైలిలో ‘ధర్మశాస్త్రం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הַזָּב
  choice: స్రావం ఉన్న వ్యక్తి
  rationale: కర్తృవాచక రూపం శరీర స్రావం ఉన్న వ్యక్తిని సూచిస్తుంది. ‘వ్యక్తి’ అనే పదం మూలంలోని స్థితి-సూచక భావాన్ని నిలుపుతూ అనవసరంగా లింగాన్ని ముందే నిర్దిష్టం చేయదు.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: అలాగే వీర్యస్ఖలనం జరిగే పురుషుడు
  rationale: మూలంలో అక్షరార్థంగా ‘అతని నుండి శయన-వీర్యం బయటికి వచ్చేది’ అనే భావం ఉంది. తెలుగులో ‘వీర్యస్ఖలనం జరగడం’ స్పష్టమైన, ప్రస్తుత వాడుకలోని మర్యాదపూర్వక వ్యక్తీకరణ; పురుష సూచన సర్వనామం మరియు విషయసందర్భం నుండి స్పష్టమవుతుంది.
- source_word: לְטָמְאָה בָהּ
  choice: దానివల్ల అపవిత్రుడయ్యే
  rationale: లామెద్ రూపం ఇక్కడ ఫలితం లేదా ఉద్దేశాన్ని సూచించగలదు. ‘దానివల్ల’ స్రావమే అపవిత్రతకు సాధనమనే భావాన్ని, ‘అపవిత్రుడయ్యే’ ఆచారపరమైన స్థితిని సహజ తెలుగులో తెలియజేస్తాయి.
theological_decisions:
- issue: טמא అనే పదంలోని అపవిత్రత స్వభావం
  choice: అపవిత్రుడు
  alternative: అశుద్ధుడు
  rationale: లేవీయకాండ సందర్భంలో ఇది ప్రధానంగా ఆచారపరమైన స్థితిని సూచిస్తుంది; నైతిక దోషాన్ని సూచిస్తున్నట్లు విస్తరించకుండా సంప్రదాయపరంగా స్పష్టమైన ‘అపవిత్రుడు’ను ఎంచుకున్నాం.
- issue: לְטָמְאָה యొక్క ఉద్దేశం/ఫలితం మధ్య అస్పష్టత
  choice: దానివల్ల అపవిత్రుడయ్యే
  alternative: దానిచేత అపవిత్రుడవడానికి
  rationale: హీబ్రూ నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని అనుమతిస్తుంది. సందర్భంలో ఫలిత భావం సహజమైనప్పటికీ, తెలుగు కృదంత నిర్మాణం కారణ-ఫల సంబంధాన్ని తెలిపి అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; శరీర సంబంధ విషయాన్ని స్పష్టంగా, వైద్యపరంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో తెలిపింది. వాక్యాంతంలోని ద్విబిందువు తరువాతి సారాంశ వచనాలతో అనుసంధానాన్ని నిలుపుతుంది.
