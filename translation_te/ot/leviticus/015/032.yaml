revisions:
- from: 'స్రావం ఉన్న వ్యక్తిని గూర్చిన ధర్మశాస్త్రం ఇదే; అలాగే వీర్యస్ఖలనం జరిగి, దానివల్ల అపవిత్రుడయ్యే పురుషుని గూర్చిన ధర్మశాస్త్రం ఇదే:'
  to: 'స్రావమున్న వ్యక్తికి, అలాగే వీర్యస్ఖలనం జరిగి దానివల్ల అపవిత్రుడయ్యే పురుషునికి సంబంధించిన నియమం ఇదే:'
  rationale: The revision preserves the source’s single summary statement and its coordination of the two cases. It retains clear, medically intelligible terminology and renders טמא as ritual “అపవిత్రుడు.” No footnote is needed, since the Telugu wording does not introduce a disputed or obscured interpretation.
