source:
  edition: WLC
  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: te
  text: స్రావం ఉన్న పురుషుడు తన స్రావం నుండి శుద్ధి పొందినప్పుడు, అతడు తన శుద్ధీకరణ కోసం ఏడు రోజులు లెక్కించాలి. ఆ తరువాత తన బట్టలు ఉతుక్కొని, ప్రవహించే నీటితో[a] తన శరీరాన్ని కడుక్కోవాలి; అప్పుడు అతడు శుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “జీవజలంతో”; అంటే తాజా లేదా ప్రవహించే నీటితో.
    reason: హీబ్రూ నుడికారపు అక్షరార్థాన్ని భద్రపరుస్తూ, ఈ సందర్భంలోని ఆచరణాత్మక భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: הַזָּב
  choice: స్రావం ఉన్న వ్యక్తి
  rationale: ఈ అధ్యాయంలో చెప్పబడిన శారీరక స్రావం గల పురుషుణ్ణి సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘వ్యక్తి’ అని అనువదించగా, సమీప సందర్భం పురుషుని గురించినదని స్పష్టంగా ఉంటుంది.
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: తన స్రావం నుండి శుద్ధుడైనప్పుడు
  rationale: ఇది స్రావం ఆగిపోయిన తరువాత కలిగే ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది; నైతిక అపరాధం నుండి క్షమాపణను సూచించదు.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים לְטָהֳרָתוֹ
  choice: తన శుద్ధీకరణ కోసం ఏడు రోజులు లెక్కించాలి
  rationale: హీబ్రూ క్రమనిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగు న్యాయపరమైన శైలిలో తెలియజేస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: వస్త్రాలను కడగడాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: తన శరీరాన్ని కడుక్కోవాలి
  rationale: בשר అక్షరార్థంగా ‘మాంసం’ అయినా, ఇక్కడ మొత్తం శరీరాన్ని కడుక్కోవడమే భావం.
- source_word: בְּמַיִם חַיִּים
  choice: ప్రవహించే నీటితో
  rationale: అక్షరార్థం ‘జీవజలం/సజీవమైన నీరు’; ఈ శుద్ధి నియమ సందర్భంలో సహజంగా లభించే తాజా లేదా ప్రవహించే నీటిని సూచిస్తుంది. ‘ప్రవహించే నీరు’ ఆచరణాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְטָהֵר
  choice: అప్పుడు అతడు శుద్ధుడవుతాడు
  rationale: నిర్దేశించిన ప్రక్రియ ముగింపులో కలిగే ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధిని నైతిక నిర్దోషిత్వంగా చూపకుండా అనువదించడం
  choice: ‘శుద్ధుడైనప్పుడు/శుద్ధీకరణ/శుద్ధుడవుతాడు’ అనే ఆచారపరమైన పదజాలం
  alternative: ‘పరిశుద్ధుడైనప్పుడు/పవిత్రీకరణ/పవిత్రుడవుతాడు’
  rationale: లేవీయకాండము 15లోని విషయం శారీరక స్రావం వల్ల కలిగే ఆచారపరమైన అశుద్ధత. ‘పవిత్ర’ అనే పదజాలం నైతిక లేదా ఆధ్యాత్మిక భావాన్ని అనవసరంగా చేర్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నియమావళి శైలి. ఆచారపరమైన శుద్ధి భావాన్ని నిలుపుతూ నైతిక అపరాధ భావాన్ని చేర్చలేదు.
