revisions:
- from: కాబట్టి ఇశ్రాయేలు ప్రజలు తమ ఆచారపరమైన అపవిత్రత విషయంలో జాగ్రత్తగా ఉండాలని మీరు వారిని హెచ్చరించాలి; లేకపోతే, వారి మధ్య ఉన్న నా నివాసస్థలాన్ని అపవిత్రం చేయడం వల్ల వారు తమ అపవిత్రతలోనే చనిపోతారు.
  to: కాబట్టి, మీరు ఇశ్రాయేలు ప్రజలను వారి ఆచారపరమైన అపవిత్రత గురించి హెచ్చరించాలి; వారు తమ అపవిత్రతలో ఉండి వారి మధ్యనున్న నా నివాస గుడారాన్ని అపవిత్రం చేయడం వల్ల చనిపోకుండా ఉండేందుకు ఇలా చేయాలి.
