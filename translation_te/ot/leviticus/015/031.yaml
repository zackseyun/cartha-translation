id: LEV.15.31
reference: Leviticus 15:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: te
  text: కాబట్టి, మీరు ఇశ్రాయేలు ప్రజలను వారి ఆచారపరమైన అపవిత్రత గురించి హెచ్చరించాలి; వారు తమ అపవిత్రతలో ఉండి వారి మధ్యనున్న నా నివాస గుడారాన్ని అపవిత్రం చేయడం వల్ల చనిపోకుండా ఉండేందుకు ఇలా చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: జాగ్రత్తగా ఉండాలని మీరు వారిని హెచ్చరించాలి
  rationale: זהר హిఫిల్ రూపం ఇక్కడ ప్రమాదాన్ని నివారించేందుకు హెచ్చరించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో హెచ్చరిక యొక్క ఉద్దేశాన్ని సహజంగా తెలిపేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇది మొత్తం నిబంధన సమాజాన్ని సూచించే స్థిరపదబంధం. ఆధునిక తెలుగులో స్త్రీపురుషులందరినీ సహజంగా సూచించేందుకు ‘ఇశ్రాయేలు ప్రజలు’ అనువైనది.
- source_word: מִטֻּמְאָתָם / טֻמְאָה
  choice: తమ ఆచారపరమైన అపవిత్రత విషయంలో / తమ అపవిత్రతలోనే
  rationale: లేవీయకాండ సందర్భంలో טֻמְאָה ప్రధానంగా ఆచార సంబంధమైన అపవిత్ర స్థితిని సూచిస్తుంది; నైతిక పాపమని అపార్థం కాకుండా మొదటి ప్రస్తావనలో ‘ఆచారపరమైన’ అని స్పష్టం చేసి, తరువాత సంక్షిప్తంగా ‘అపవిత్రత’ అని ఉంచబడింది.
- source_word: וְלֹא יָמֻתוּ
  choice: లేకపోతే ... చనిపోతారు
  rationale: హెచ్చరికను పాటించకపోతే సంభవించే ప్రాణాపాయాన్ని తెలిపే హీబ్రూ ఉద్దేశ్య/నివారణ సంబంధాన్ని సహజమైన తెలుగు ప్రతికూల ఫలిత నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: בְּטַמְּאָם
  choice: అపవిత్రం చేయడం వల్ల
  rationale: బెత్‌తో కూడిన טמא క్రియానామం అపవిత్రం చేయడమే మరణానికి దారితీసే పరిస్థితి లేదా కారణమని సూచిస్తుంది.
- source_word: מִשְׁכָּנִי
  choice: నా నివాసస్థలం
  rationale: מִשְׁכָּן అంటే దేవుడు నివసించే స్థలం; ఈ సందర్భంలో ప్రత్యక్ష గుడారాన్ని సూచించినా, ‘నివాసస్థలం’ మూలపద భావాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: వారి మధ్య ఉన్న
  rationale: దేవుని నివాసం ఇశ్రాయేలు సమాజం మధ్య ఉందనే మూలంలోని స్థల మరియు సాన్నిధ్య భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: లేవీయకాండలో అపవిత్రత స్వభావం
  choice: మొదటి ప్రస్తావనలో ‘ఆచారపరమైన అపవిత్రత’ అని అనువదించడం
  alternative: ‘అపవిత్రత’ మాత్రమే; లేదా ‘అశుద్ధత’
  rationale: ఈ వచనం సాధారణ నైతిక దోషం గురించి కాక, దేవుని నివాసాన్ని కలుషితం చేయగల ఆచార సంబంధ స్థితి గురించి చెబుతుంది. ‘ఆచారపరమైన’ అనే వివరణ ఈ భేదాన్ని కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహపదం
  choice: ‘ఇశ్రాయేలు ప్రజలు’
  alternative: ‘ఇశ్రాయేలు కుమారులు’ లేదా ‘ఇశ్రాయేలీయులు’
  rationale: ఈ ఆజ్ఞ 15వ అధ్యాయంలో ప్రస్తావించిన స్త్రీపురుషులతో కూడిన సమాజానికంతటికీ వర్తిస్తుంది. కాబట్టి తెలుగు పాఠకులకు సహజంగా సమగ్ర సమూహాన్ని సూచించే రూపం ఎంచుకోబడింది.
- issue: అపవిత్రత, దేవుని నివాసం, మరణం మధ్య సంబంధం
  choice: నివాసస్థలాన్ని అపవిత్రం చేయడం వల్ల తమ అపవిత్రతలోనే చనిపోయే ప్రమాదమని ఉంచడం
  alternative: అపవిత్రతను సాధారణ పాపానికి శిక్షగా వివరించడం
  rationale: హీబ్రూ పాఠం ఆచారపరమైన అపవిత్రతలో ఉండి దేవుని నివాసాన్ని అపవిత్రం చేయడం వల్ల కలిగే ప్రమాదాన్ని చెబుతుంది; దానిని విస్తృత నైతిక సిద్ధాంతంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గౌరవప్రద శైలి. మూలంలోని హెచ్చరిక, ఆచారపరమైన అపవిత్రత, సమాజమధ్య దేవుని నివాసం అనే అంశాలు నిలుపబడ్డాయి.
