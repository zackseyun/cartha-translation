id: LEV.15.9
reference: Leviticus 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: te
  text: స్రావం ఉన్న పురుషుడు ఎక్కి స్వారీ చేసే ప్రతి వస్తువూ ఆచారపరంగా అపవిత్రం అవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి జీను’; హీబ్రూ పదం కేవలం జీనునే కాక, ఎక్కి స్వారీ చేసే వస్తువును మరింత విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: అంతా
  rationale: וְ ముందున్న నియమాలతో ఈ వాక్యాన్ని అనుసంధానిస్తుంది; తెలుగులో సందర్భానుసారంగా ప్రత్యేక ‘మరియు’ లేకుండానే అనుసంధానం సహజంగా తెలుస్తుంది. כָּל యొక్క సమగ్ర పరిధిని ‘అంతా’ తెలియజేస్తుంది.
- source_word: הַ/מֶּרְכָּב
  choice: స్వారీ సామగ్రి
  rationale: מֶרְכָּב అనేది కేవలం ఇరుకైన అర్థంలోని జీనును మాత్రమే కాక, ఎక్కి స్వారీ చేసే వస్తువు లేదా ఏర్పాటును విస్తృతంగా సూచించగలదు. ఈ సందర్భంలో ‘స్వారీ సామగ్రి’ సహజంగా ఉండి ఆ విస్తృతిని కాపాడుతుంది.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: దేనిమీద ఎక్కి ప్రయాణిస్తాడో
  rationale: ‘దేనిమీద ... ప్రయాణిస్తాడో’ అనే నిర్మాణం עַל యొక్క ‘మీద’ భావాన్ని నిలుపుతుంది; ‘ఎక్కి ప్రయాణించడం’ יִרְכַּב యొక్క స్వారీ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַ/זָּב
  choice: స్రావం ఉన్న పురుషుడు
  rationale: זָב ఇక్కడ శరీరస్రావం ఉన్న పురుషుణ్ణి సూచించే పుంలింగ కృదంత నామం. ఈ అనువాదం పురుష సూచననూ, వైద్య/ఆచార సందర్భాన్నీ నిరాడంబరంగా కాపాడుతుంది.
- source_word: יִטְמָא
  choice: అపవిత్రం అవుతుంది
  rationale: ఈ క్రియ ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ‘అపవిత్రం అవుతుంది’ ఫలిత స్థితిని సహజమైన న్యాయశైలి తెలుగులో తెలియజేస్తుంది; నైతిక దోషాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: లేవీయకాండంలోని అపవిత్రత భాష స్వభావం
  choice: טמא ను ఆచార/ధర్మశాస్త్ర సంబంధమైన అర్థంలో ‘అపవిత్రం’గా అనువదించడం
  alternative: కలుషితం; అశుద్ధం
  rationale: ఈ వచనం శరీరస్రావం వల్ల కలిగే ఆచారపరమైన స్థితి గురించి మాట్లాడుతుంది; వ్యక్తిగత పాపం లేదా నైతిక భ్రష్టతను తప్పనిసరిగా సూచించదు. ‘అపవిత్రం’ తెలుగు బైబిలు మరియు ధార్మిక వాడుకలో ఈ భేదాన్ని సహజంగా మోయగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘స్రావం’ వైద్యపరంగా స్పష్టంగా ఉండగా, ‘స్వారీ సామగ్రి’ మూలపదంలోని విస్తృతిని కాపాడుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
