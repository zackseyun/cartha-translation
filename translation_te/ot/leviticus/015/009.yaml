- from: స్రావం ఉన్న పురుషుడు దేనిమీద ఎక్కి ప్రయాణిస్తాడో, ఆ స్వారీ సామగ్రి అంతా అపవిత్రం అవుతుంది.[a]
  to: స్రావం ఉన్న పురుషుడు ఎక్కి స్వారీ చేసే ప్రతి వస్తువూ ఆచారపరంగా అపవిత్రం అవుతుంది.[a]
  rationale: The revision retains the source’s universal/distributive force (“ప్రతి”), the male referent, the riding-upon sense, and the ritual result. It replaces the potentially overbroad collective “స్వారీ సామగ్రి అంతా” with a natural expression that preserves the source word’s lexical breadth, while the footnote records the narrower contextual sense “saddle.”
