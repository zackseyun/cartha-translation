source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: te
  text: స్రావం ఉన్న పురుషుడు కూర్చున్న వస్తువు[a]పై కూర్చునే వ్యక్తి తన బట్టలు ఉతుక్కొని, నీటిలో స్నానం చేసి, సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాత్ర’ లేదా ‘ఉపకరణం’; హీబ్రూ పదం వస్తువు లేదా వాడుకసామాను వంటి విస్తృత అర్థాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: ఎవరు కూర్చున్నా
  rationale: ఆర్టికల్‌తో ఉన్న హీబ్రూ కృదంతం ‘కూర్చునే వ్యక్తి’ అనే సాధారణ నియమార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగు న్యాయనియమ శైలిలో ‘ఎవరు కూర్చున్నా’ సహజంగా ఉంది.
- source_word: הַכְּלִי
  choice: వస్తువు
  rationale: כְּלִי పాత్ర, ఉపకరణం, సామాను లేదా వస్తువు అనే విస్తృత అర్థపరిధి కలిగిన పదం. ఇక్కడ కూర్చునే దేనినైనా సూచించవచ్చు కాబట్టి ‘వస్తువు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: కూర్చున్న
  rationale: ఈ సంబంధవాక్యం ముందుగా స్రావం ఉన్న పురుషుడు ఆ వస్తువుపై కూర్చున్న విషయాన్ని గుర్తిస్తుంది; తెలుగులో భూతకాల కృదంత రూపం సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: הַזָּב
  choice: స్రావం ఉన్న పురుషుడు
  rationale: ఈ అధ్యాయ భాగంలో ఈ పదం శరీరస్రావం ఉన్న పురుషుణ్ని సూచించే పురుషలింగ ఏకవచన కృదంత నామం; లింగసూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తమ బట్టలు ఉతుక్కొని
  rationale: כִּבֵּס బట్టలను కడగడం/ఉతకడం సూచిస్తుంది. ‘బట్టలు ఉతుక్కొని’ ఆధునిక తెలుగులో సహజంగా ఉండి వ్యక్తి తన బట్టలనే ఉతకాలని తెలియజేస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: శుద్ధి నియమాల సందర్భంలో רָחַץ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది; ‘స్నానం చేయాలి’ కేవలం చేతులు లేదా వస్తువు కడగడం కాదని స్పష్టం చేస్తుంది.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రులుగా ఉంటారు
  rationale: టָמֵא ఇక్కడ ఆచారపరమైన అపవిత్ర స్థితిని తెలుపుతుంది; ‘సాయంత్రం వరకు’ దాని కాలపరిమితిని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ‘అపవిత్రులు’ అని మాత్రమే అనువదించి, నైతిక అపరాధాన్ని జోడించలేదు
  alternative: ‘ఆచారపరంగా అపవిత్రులు’ లేదా ‘కలుషితులు’
  rationale: సందర్భం లేవీయ శుద్ధి నియమాలకు సంబంధించినది. ‘ఆచారపరంగా’ అనడం వివరణను మూలపాఠ్యంలోకి చేర్చుతుంది; ‘కలుషితులు’ నైతిక లేదా భౌతిక మలినతను అతిగా సూచించవచ్చు.
- issue: הַזָּב యొక్క లింగ సూచన
  choice: ‘స్రావం ఉన్న పురుషుడు’ అని పురుష సూచనను స్పష్టంగా ఉంచడం
  alternative: ‘స్రావం ఉన్న వ్యక్తి’
  rationale: లేవీయకాండము 15:2–15 సందర్భమూ, హీబ్రూ పురుషలింగ ఏకవచన రూపమూ పురుషుణ్నే సూచిస్తున్నాయి.
- issue: సంపర్కం పొందిన వ్యక్తిని తెలుగులో సూచించే విధానం
  choice: ‘వారు/తమ’ అనే గౌరవ-లింగతటస్థ ఏకవచన ప్రయోగం
  alternative: ‘అతడు/అతని’
  rationale: హీబ్రూలో సంపర్కం పొందిన వ్యక్తి వ్యాకరణపరంగా పురుషలింగంలో ఉన్నప్పటికీ, నియమం సాధారణ వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎవరు... వారు/తమ’ సహజమైన అన్వయం; ఇది స్రావం ఉన్న వ్యక్తి పురుషుడనే స్పష్టతను మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన నియమశైలిని ఉపయోగించాం. ‘ఎవరు... వారు/తమ’ అన్వయం సహజ తెలుగు సాధారణ నియమరూపం. ప్రధాన పాఠ్యంలో [a] సూచికను చేర్చాం.
