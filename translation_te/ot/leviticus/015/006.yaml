  source_fidelity: మూల హీబ్రూలోని సాధారణ నియమార్థం, వస్తువుపై ముందుగా స్రావం ఉన్న పురుషుడు కూర్చున్నాడనే సంబంధవాక్యం, బట్టలు ఉతకడం, నీటిలో స్నానం చేయడం, సాయంత్రం వరకు అపవిత్ర స్థితి అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే ‘ఎవరు కూర్చున్నా, వారు ... అపవిత్రులుగా ఉంటారు’ అనే బహువచన/షరతు రూపం మూలంలోని ఏకవచన నియమరూపాన్ని కొద్దిగా సడలిస్తుంది. సవరించిన పాఠం ఏకవచన సాధారణ నియమార్థాన్ని మరింత స్పష్టంగా ఉంచుతుంది.
  naturalness: ‘వస్తువుపై కూర్చునే వ్యక్తి’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన నియమశైలి. ‘నీటిలో స్నానం చేసి’ అనేది శరీరాన్ని నీటితో కడుక్కోవాలనే భావాన్ని స్పష్టంగా ఇస్తుంది. ‘అపవిత్రుడిగా ఉంటాడు’ ఇక్కడి ఆచారస్థితిని సంక్షిప్తంగా, మూలానికి సన్నిహితంగా వ్యక్తపరుస్తుంది.
