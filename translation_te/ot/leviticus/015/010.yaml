  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: te
  text: అతని కింద ఉండిన దేనినైనా తాకే ప్రతి వ్యక్తి సాయంకాలం వరకు అపవిత్రుడవుతాడు.[a] వాటిని[b] మోసే వ్యక్తి తన బట్టలు ఉతుక్కొని నీటిలో స్నానం చేసి, సాయంకాలం వరకు అపవిత్రుడిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని కింద ఉన్న దేనినైనా’ అని కూడా అనువదించవచ్చు. హీబ్రూ రూపం అక్షరార్థంగా వర్తమాన భావాన్ని కలిగి ఉండవచ్చు; అయితే సందర్భం ముందుగా అతని కింద ఉండిన వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వాటిని’ అనే బహువచన సర్వనామం, అతని కింద ఉండి అపవిత్రమైన వస్తువులను సమష్టిగా సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: తాకే ప్రతి వ్యక్తి
  rationale: נגע అనే క్రియారూపం ఇక్కడ శారీరకంగా తాకడాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు ‘తాకే’ సహజంగా, నేరుగా అర్థమవుతుంది.
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: అతని కింద ఉన్న దేనినైనా
  rationale: హీబ్రూ రూపం కాలపరంగా సందర్భానుసారం ‘ఉన్న’ లేదా ‘ఉండిన’ అనే భావాన్ని అనుమతిస్తుంది. తెలుగు న్యాయనియమ శైలిలో ‘ఉన్న’ సహజంగా ఉండి, అతని కింద ఉండిన వస్తువులను సందర్భం ద్వారా కూడా సూచించగలదు.
- source_word: יִטְמָא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి సందర్భంలో טמא అనేది నైతిక దోషాన్ని కాక ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది; ‘అపవిత్రుడిగా ఉంటాడు’ ఆ స్థితిని స్పష్టంగా తెలుపుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: కాలపరిమితిని తెలిపే హీబ్రూ పదబంధానికి ఇది సహజమైన, స్థిరమైన తెలుగు రూపం.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: వాటిని మోసే వ్యక్తి
  rationale: נשא ఇక్కడ వస్తువులను ఎత్తి మోయడాన్ని సూచిస్తుంది. אֹתָם బహువచన సర్వనామాన్ని ‘వాటిని’గా నిలిపి, ముందుగా సూచించిన కలుషిత వస్తువులతో అనుసంధానించాం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: ‘బట్టలు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం; ‘తన’ ద్వారా హీబ్రూలోని స్వామ్య ప్రత్యయం వ్యక్తమవుతుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: רחץ ఈ శుద్ధీకరణ సూత్రంలో శరీరాన్ని కడుక్కోవడం లేదా స్నానం చేయడాన్ని సూచిస్తుంది; ‘స్నానం చేయాలి’ తెలుగు పాఠకులకు ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: అతడు సాయంకాలం వరకు అపవిత్రుడిగా ఉంటాడు
  rationale: కడుక్కోవడం జరిగిన వెంటనే ఆచారపరమైన అపవిత్రత ముగిసిపోదని, అది సాయంకాలం వరకు కొనసాగుతుందని వాక్యం స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘అపవిత్రత’ స్వభావం
  choice: ఆచారపరమైన స్థితిని సూచించే ‘అపవిత్రుడు’ అనే పదాన్ని నిలిపాం
  alternative: ‘అశుద్ధుడు’ లేదా నైతికంగా కలుషితుడని భావింపజేసే పదప్రయోగం
  rationale: లేవీయకాండం 15 సందర్భంలో ఈ పదం ప్రధానంగా ఆచారపరమైన శుద్ధి-అపవిత్రత వర్గాన్ని సూచిస్తుంది; నైతిక పాపారోపణను వచనంలోకి చేర్చకూడదు.
- issue: స్నానం చేసిన తరువాత కూడా అపవిత్రత కాలం
  choice: సాయంకాలం వరకు అపవిత్రుడిగా ఉంటాడనే చివరి నిబంధనను స్వతంత్రంగా స్పష్టం చేశాం
  alternative: స్నానం చేయగానే శుద్ధుడవుతాడనే భావన కలిగేలా సంక్షిప్తీకరించడం
  rationale: హీబ్రూ వచనం కడుక్కోవడం, స్నానం చేయడం, సాయంకాలం వరకు అపవిత్రంగా ఉండడం అనే మూడు అంశాలను వరుసగా పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలి ఉపయోగించబడింది. ‘నీళ్లతో’ సహజ తెలుగు; ‘అపవిత్రుడు’ లేవీయకాండపు ఆచారపరమైన సాంకేతిక భావాన్ని నిలుపుతుంది. హీబ్రూలోని కాలసంబంధ అస్పష్టతను [a]లో భద్రపరిచాం.
