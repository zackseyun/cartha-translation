id: LEV.15.8
reference: Leviticus 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: te
  text: స్రావం ఉన్నవాడు ఆచారపరంగా శుద్ధుడైన వ్యక్తి మీద ఉమ్మితే[a], ఆ వ్యక్తి తన బట్టలు ఉతుకుకొని, నీళ్లతో స్నానం చేయాలి; అతడు సాయంత్రం వరకు ఆచారపరంగా అపవిత్రుడిగా ఉంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘శుద్ధుడైనవాని మీద’ అని ఉంది; ఇక్కడ ఆచారపరంగా శుద్ధుడైన వ్యక్తి ఉద్దేశించబడ్డాడు.
    reason: lexical_alternative
  - marker: b
    text: ఇది ఆచారపరమైన అపవిత్ర స్థితి; తప్పనిసరిగా నైతిక అపవిత్రతను సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: అయితే / ...తే
  rationale: న్యాయనియమాల వరుసలో వచ్చే షరతును సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంతో తెలియజేస్తుంది; హీబ్రూ సంధాన భావం సందర్భంలో నిలిచివుంటుంది.
- source_word: יָרֹק
  choice: ఉమ్మితే
  rationale: క్రియకు ‘ఉమ్ము’ అనే ప్రత్యక్ష అర్థం ఉంది; בְ ఉపసర్గతో కలిపి వ్యక్తి ‘మీద’ ఉమ్మడం అని తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: הַזָּב
  choice: స్రావం ఉన్నవాడు
  rationale: ‘స్రవించేవాడు/స్రావం గలవాడు’ అనే అర్థాన్ని వైద్యపరమైన అతివివరణ లేకుండా, సందర్భంలోని పురుష ఏకవచనాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: בַּטָּהוֹר
  choice: ఆచారపరంగా శుద్ధుడైన వ్యక్తి మీద
  rationale: సుబంతంగా వాడిన ‘శుద్ధుడు’ అనే విశేషణం ఇక్కడ వ్యక్తిని సూచిస్తుంది. ‘ఆచారపరంగా’ అని చేర్చడం భౌతిక పరిశుభ్రతతో లేదా నైతిక పవిత్రతతో గందరగోళం రాకుండా చేస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: ఆ వ్యక్తి తన బట్టలు ఉతుకుకొని
  rationale: ఉమ్మివేయబడిన శుద్ధ వ్యక్తియే తరువాతి క్రియలకు కర్త అని తెలుగులో స్పష్టత కోసం ‘ఆ వ్యక్తి’ అని చెప్పబడింది; ‘బట్టలు ఉతుకుకోవడం’ ఆధునిక సహజ ప్రయోగం.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: ఈ ఆచార సందర్భంలో רָחַץ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది; ‘స్నానం చేయాలి’ సాధారణ పాఠకుడికి సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְטָמֵא
  choice: ఆచారపరంగా అపవిత్రుడిగా ఉంటాడు
  rationale: ఇది నైతిక దోషాన్ని కాక ఆచారస్థితిని సూచిస్తుందని స్పష్టం చేస్తూ, న్యాయవాక్యంలోని ఫలితాన్ని నిలుపుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: లేవీయకాండంలోని ఆచార అపవిత్రత వ్యవధిని తెలిపే స్థిరమైన కాలసూత్రానికి సహజ తెలుగు రూపం.
theological_decisions:
- issue: శుద్ధత–అపవిత్రత పదజాలం
  choice: ‘ఆచారపరంగా శుద్ధుడు / ఆచారపరంగా అపవిత్రుడు’ అని అనువదించడం
  alternative: ‘పవిత్రుడు / అపవిత్రుడు’ లేదా కేవలం ‘శుద్ధుడు / అశుద్ధుడు’
  rationale: లేవీయకాండం 15లో ఉద్దేశించబడినది ఇశ్రాయేలు ఆచార శుద్ధత స్థితి. ‘ఆచారపరంగా’ అనే వివరణ నైతిక పాపం లేదా సాధారణ శారీరక మురికి అనే భావాలను అనవసరంగా దిగుమతి చేయకుండా మూలార్థాన్ని స్పష్టం చేస్తుంది.
- issue: తరువాతి క్రియల కర్త
  choice: బట్టలు ఉతుకుకొని స్నానం చేయవలసినవాడు ఉమ్మివేయబడిన శుద్ధ వ్యక్తి అని స్పష్టీకరించడం
  alternative: హీబ్రూ పురుష ఏకవచన క్రియలను అస్పష్టంగానే ఉంచడం
  rationale: హీబ్రూ న్యాయసందర్భంలో ఫలితంగా అపవిత్రుడయ్యేది సంపర్కానికి గురైన వ్యక్తే; తెలుగులో వరుసగా ఇద్దరు పురుషులు ప్రస్తావించబడినందున కర్తను చెప్పకపోతే తప్పుగా అర్థం కావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయశైలిని వాడాం. మూలంలోని షరతు–ఫలిత నిర్మాణాన్ని నిలిపి, తెలుగు సర్వనామ అస్పష్టత వల్ల కర్త మారినట్లు అనిపించకుండా ‘ఆ వ్యక్తి’ అని స్పష్టం చేశాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
