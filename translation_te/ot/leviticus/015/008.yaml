  terminology: ‘ఆచారపరంగా శుద్ధుడు/అపవిత్రుడు’ అనే పదజాలం లేవీయకాండం సందర్భంలోని కర్మకాండ సంబంధిత స్థితిని సరిగ్గా తెలియజేస్తుంది; నైతిక దోషార్థాన్ని అనవసరంగా సూచించదు. ‘శుద్ధుడు’ అనే మూలపదానికి పాదటిప్పణి సరైన వివరణ ఇస్తుంది.
