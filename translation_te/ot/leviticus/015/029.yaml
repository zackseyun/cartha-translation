revisions:
- from: ఎనిమిదవ రోజున ఆమె తన కోసం రెండు తెల్లగువ్వలనైనా లేదా రెండు పావురపు పిల్లలనైనా తీసుకొని, వాటిని ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర యాజకుని వద్దకు తీసుకురావాలి.[a]
  to: ఎనిమిదవ రోజున ఆమె తనకొరకు రెండు గువ్వలనో లేదా రెండు పావురపు పిల్లలనో తీసుకొని, వాటిని సమాగమపు గుడారం ప్రవేశద్వారం వద్దనున్న యాజకుని దగ్గరకు తీసుకురావాలి.
