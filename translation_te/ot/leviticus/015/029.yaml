id: LEV.15.29
reference: Leviticus 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י תִּֽקַּֽח לָ/הּ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וְ/הֵבִיאָ֤ה אוֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: te
  text: ఎనిమిదవ రోజున ఆమె తనకొరకు రెండు గువ్వలనో లేదా రెండు పావురపు పిల్లలనో తీసుకొని, వాటిని సమాగమపు గుడారం ప్రవేశద్వారం వద్దనున్న యాజకుని దగ్గరకు తీసుకురావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: వావ్ సంధి ధర్మశాస్త్ర సూచనల వరుసను కొనసాగిస్తుంది; తెలుగులో వాక్యారంభంలో ‘మరియు’ చేర్చకుండా కూడా ఆ వరుస సహజంగా వ్యక్తమవుతుంది. בַיּוֹם కాలార్థకంగా ‘రోజున’ అని అనువదించబడింది.
- source_word: תִּקַּח לָהּ
  choice: ఆమె తన కోసం ... తీసుకొని
  rationale: לָהּ లోని ప్రయోజనార్థక/ఆత్మార్థక భావాన్ని ‘తన కోసం’ నిలుపుతుంది. తరువాతి క్రియతో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘తీసుకొని’ అని అనుసంధానించబడింది.
- source_word: שְׁתֵּי תֹרִים
  choice: రెండు తెల్లగువ్వలు
  rationale: תֹרִים బలుల సందర్భంలో చెప్పబడే turtledoves; ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే ‘తెల్లగువ్వలు’ ఎంపిక చేయబడింది.
- source_word: אוֹ
  choice: అయినా లేదా
  rationale: రెండు అనుమతించబడిన ప్రత్యామ్నాయాలను తెలుగులో స్పష్టంగా సూచించేందుకు మొదటి పదబంధానికి ‘అయినా’, మధ్యలో ‘లేదా’ వాడబడింది.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: రెండు పావురపు పిల్లలు
  rationale: ‘పావురపు కుమారులు’ అనే పదశః రూపం కాకుండా, చిన్న వయసు పావురాలను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: וְהֵבִיאָה אֹתָם
  choice: వాటిని ... తీసుకురావాలి
  rationale: ధర్మశాస్త్ర ఆదేశంలోని విధ్యర్థక బలాన్ని ‘తీసుకురావాలి’ తెలియజేస్తుంది; אֹתָם కు ‘వాటిని’ స్పష్టమైన బహువచన కర్మ.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని వద్దకు
  rationale: నిర్దిష్ట ఆచారాన్ని నిర్వహించే הכהן ను ‘యాజకుడు’గా, గమ్యాన్ని వద్దకు అనే సహజ రూపంతో అనువదించింది.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే ప్రవేశద్వారం; אֹהֶל מוֹעֵד కు స్థిరమైన, భావస్పష్టమైన ‘ప్రత్యక్ష గుడారం’ వాడబడింది. రెండవ אֶל ను స్థలార్థకంగా ‘దగ్గర’ అని సహజీకరించగా, పదశః ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి పాటించబడింది. ‘తన కోసం’ అనే ప్రయోజనార్థక భావం నిలుపబడింది; పక్షుల పేర్లు సాధారణ పాఠకులకు అర్థమయ్యే విధంగా ఇవ్వబడ్డాయి. వాక్యాంతంలోని [a] గుర్తు పాదసూచికతో నేరుగా సరిపోతుంది.
