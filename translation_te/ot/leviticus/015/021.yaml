  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: te
  text: ఆమె పడకను తాకే ప్రతి ఒక్కరూ తమ బట్టలు ఉతుకుకొని, నీళ్లతో స్నానం చేయాలి; వారు సాయంకాలం వరకు అపవిత్రులుగా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆమె పడుకునే స్థలాన్ని’ లేదా ‘ఆమె పరుపును.’ హీబ్రూ పదం ఆమె పడుకునే స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: తాకే ప్రతి ఒక్కరూ
  rationale: సంబంధిత కృదంతంతో కూడిన כָּל సాధారణంగా వర్తించే నియమాన్ని తెలియజేస్తుంది. లింగపరంగా సహజమైన తెలుగు బహువచన నిర్మాణం హీబ్రూ ఏకవచనంలోని సాధారణ వ్యక్తి భావాన్ని నిలుపుతుంది.
- source_word: בְּמִשְׁכָּבָהּ
  choice: ఆమె పడకను
  rationale: מִשְׁכָּב ఇక్కడ ఆమె పడుకునే స్థలాన్ని లేదా పరుపును సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘పడక’ సహజంగా, స్పష్టంగా ఉంది. విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తమ బట్టలు ఉతుకుకొని
  rationale: כבס ప్రత్యేకంగా వస్త్రాలను కడగడాన్ని సూచిస్తుంది. ‘బట్టలు ఉతుకుకొని’ ఆధునిక తెలుగులో సహజమైనది; బహువచన సాధారణ వ్యక్తికి అనుగుణంగా ‘తమ’ వాడబడింది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: רחץ ఈ సందర్భంలో శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది. బట్టలు ఉతకడం నుండి స్పష్టంగా వేరుచేయడానికి ‘స్నానం చేయాలి’ ఎంచుకున్నాం.
- source_word: וְטָמֵא
  choice: అపవిత్రులుగా ఉంటారు
  rationale: טמא ఇక్కడ ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది; నైతిక దోషాన్ని పాఠ్యంలో చేర్చకుండా సంప్రదాయ లేవీయ ధర్మశాస్త్ర పదజాలాన్ని నిలుపుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: అపవిత్ర స్థితి కొనసాగే కాలపరిమితిని సరళంగా, కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: טמא ను ‘అపవిత్రులు’గా అనువదించి, ఆచారపరమైన స్థితిగా సందర్భం ద్వారా అర్థమయ్యేలా ఉంచడం
  alternative: ‘ఆచారపరంగా అపవిత్రులు’ అని పాఠ్యంలో స్పష్టీకరించడం
  rationale: లేవీయకాండము 15 సందర్భం ఆచారశుద్ధికి సంబంధించినది. అయితే మూలంలో లేని వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చి భావాన్ని అతిగా పరిష్కరించకుండా, నైతిక అపరాధాన్ని కూడా సూచించకుండా ‘అపవిత్రులు’ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. హీబ్రూ సాధారణ పురుష ఏకవచనాన్ని తెలుగులో లింగనిరపేక్షమైన గౌరవ బహువచనంగా మార్చి, క్రియలు మరియు సర్వనామాల్లో అనుసరణ పాటించబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
