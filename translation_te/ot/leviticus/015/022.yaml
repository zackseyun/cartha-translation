  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֔עַ בְּ/כָל כְּלִ֖י אֲשֶׁר תֵּשֵׁ֣ב עָלָ֑י/ו יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: te
  text: ఆమె కూర్చునే ఏ వస్తువునైనా తాకిన ప్రతివాడు తన బట్టలు ఉతుక్కొని, నీటిలో స్నానం చేయాలి[a]; అతడు సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఏ పాత్రనైనా’ లేదా ‘ఏ సామానునైనా’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం כְּלִי వస్తువు, పాత్ర, పనిముట్టు లేదా సామానును సూచించగల విస్తృత పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: తాకిన ప్రతివాడు
  rationale: సంబంధిత కృదంత నిర్మాణంలోని సాధారణ, సమగ్ర పరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל כְּלִי
  choice: ఏ వస్తువునైనా
  rationale: כְּלִי పాత్ర, పనిముట్టు, సామాను లేదా వస్తువును సూచించగల విస్తృత పదం; కూర్చునే దానిని సూచించే ఈ సందర్భంలో ‘వస్తువు’ అనవసరంగా అర్థాన్ని కుదించదు.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: ఆమె కూర్చున్న
  rationale: మునుపటి సందర్భంలోని స్త్రీని సూచిస్తూ, వస్తువును విశేషించే ఉపవాక్యాన్ని తెలుగులో సహజంగా ముందుంచుతుంది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: כִּבֵּס బట్టలను ఉతకడాన్ని సూచిస్తుంది; ‘తన’ పురుష ఏకవచన ప్రత్యయాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: శుద్ధి నియమాల సందర్భంలో శరీరాన్ని నీటితో కడుక్కోవడాన్ని స్పష్టంగా, సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: ఇక్కడి טָמֵא నైతిక దోషాన్ని కాక ఆచారసంబంధ అపవిత్ర స్థితిని సూచిస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: అపవిత్ర స్థితి కొనసాగే కాలపరిమితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి నియమంలో అపవిత్రత స్వభావం
  choice: טָמֵא ను ఆచారసంబంధ స్థితిని సూచించే ‘అపవిత్రుడు’గా అనువదించడం
  alternative: మలినుడు / కలుషితుడు
  rationale: ఈ వాక్యం స్పర్శ వల్ల కలిగే ఆచారసంబంధ అపవిత్రత గురించి చెబుతుంది; వ్యక్తిగత పాపం లేదా నైతిక దోషాన్ని ప్రకటించడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఆదేశ స్వరాన్ని ‘చేయాలి’తో నిలిపి, సామాన్య పాఠకులకు అర్థమయ్యే ‘బట్టలు,’ ‘నీళ్లు,’ ‘స్నానం’ వంటి సహజ పదాలను వాడింది. ‘అపవిత్రుడు’ను ఆచారసంబంధ అర్థంలో ఉపయోగించింది.
