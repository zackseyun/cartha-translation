  terminology: నִדָּהకు ‘రుతుక్రమ అపవిత్రత,’ టְמֵאָהకు ‘అపవిత్రురాలు’ అనే ఎంపికలు లేవీయకాండపు ఆచారపరమైన పరిభాషను కాపాడుతున్నాయి; అవి నైతిక తప్పును సూచించవు. עַל నִדָּתָהּలోని విస్తరణ/అదనపు భావాన్ని ప్రధాన పాఠంలో ‘కాలానికి మించి’గా, పాదటిప్పణిలో ‘అదనంగా’గా నిలిపాం.
