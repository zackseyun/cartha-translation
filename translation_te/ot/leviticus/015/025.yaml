revisions:
- from: ఒక స్త్రీకి తన రుతుక్రమ అపవిత్రత కాలంలో కాకుండా అనేక రోజులపాటు రక్తస్రావం కలిగినా, లేదా ఆమె రక్తస్రావం తన రుతుక్రమ అపవిత్రత కాలాన్ని దాటి కొనసాగినా,[a] ఆమె అపవిత్ర రక్తస్రావం ఉన్న రోజులన్నిటిలో ఆమె రుతుక్రమ అపవిత్రత ఉన్న రోజులలోలాగే అపవిత్రురాలిగా ఉంటుంది.[b]
  to: ఒక స్త్రీకి తన రుతుక్రమ అపవిత్రత కాలంలో కాకుండా అనేక రోజులపాటు రక్తస్రావం కలిగితే[a], లేదా ఆమె రుతుక్రమ అపవిత్రత కాలానికి మించి రక్తస్రావం కొనసాగితే, ఆమె అపవిత్రతను కలిగించే రక్తస్రావం ఉన్న రోజులన్నిటిలో, తన రుతుక్రమ అపవిత్రత రోజులలో ఉన్నట్లే, ఆమె అపవిత్రురాలిగా ఉంటుంది.[b]
