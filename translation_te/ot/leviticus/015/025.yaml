id: LEV.15.25
reference: Leviticus 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: te
  text: ఒక స్త్రీకి తన రుతుక్రమ అపవిత్రత కాలంలో కాకుండా అనేక రోజులపాటు రక్తస్రావం కలిగితే[a], లేదా ఆమె రుతుక్రమ అపవిత్రత కాలానికి మించి రక్తస్రావం కొనసాగితే, ఆమె అపవిత్రతను కలిగించే రక్తస్రావం ఉన్న రోజులన్నిటిలో, తన రుతుక్రమ అపవిత్రత రోజులలో ఉన్నట్లే, ఆమె అపవిత్రురాలిగా ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన రుతుక్రమ సమయానికి వెలుపల.” హీబ్రూ పదం రుతుస్రావంతో సంబంధమున్న ఆచారపరమైన అపవిత్ర స్థితినీ సూచిస్తుంది; కేవలం రక్తస్రావాన్నే కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె రుతుక్రమ అపవిత్రతకు అదనంగా రక్తస్రావం కలిగితే,” అంటే సాధారణ రుతుక్రమ కాలానికి మించి స్రావం కొనసాగడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: రక్తస్రావం కలిగినా / రక్తస్రావం ... కొనసాగినా
  rationale: זוּב అనే క్రియా-నామ సమ్మేళనం అసాధారణమైన శరీర స్రావాన్ని సూచిస్తుంది. సందర్భంలో דָּמָהּ ఉన్నందున ‘రక్తస్రావం’ సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం; రెండవ వాక్యభాగంలో కొనసాగింపును తెలియజేస్తుంది.
- source_word: דָּמָהּ
  choice: రక్తస్రావం
  rationale: అక్షరార్థంగా ‘ఆమె రక్తం’; స్రావాన్ని సూచించే క్రియతో కలిపి తెలుగులో ‘రక్తస్రావం’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: יָמִים רַבִּים
  choice: అనేక రోజులపాటు
  rationale: కాలవ్యవధిని స్పష్టంగా, మూలానికి సమీపంగా తెలియజేస్తుంది.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: తన రుతుక్రమ అపవిత్రత కాలంలో కాకుండా
  rationale: עֵת అంటే కాలం; נִדָּה కేవలం రుతుస్రావాన్నే కాక దానితో ముడిపడిన ఆచారపరమైన అపవిత్ర స్థితిని కూడా సూచిస్తుంది.
- source_word: נִדָּה
  choice: రుతుక్రమ అపవిత్రత
  rationale: లేవీయకాండపు ధర్మశాస్త్ర సందర్భంలో జీవసంబంధమైన రుతుక్రమంతో పాటు ఆచారపరమైన అపవిత్ర స్థితిని కూడా నిలుపుతుంది.
- source_word: עַל נִדָּתָהּ
  choice: తన రుతుక్రమ అపవిత్రత కాలాన్ని దాటి కొనసాగినా
  rationale: עַל ఇక్కడ సాధారణ రుతుక్రమ కాలానికి అదనంగా లేదా దానిని దాటి స్రావం కొనసాగడాన్ని సూచించవచ్చు; ‘దాటి కొనసాగినా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: ఆమె అపవిత్ర రక్తస్రావం ఉన్న రోజులన్నిటిలో
  rationale: స్రావం మరియు దానివల్ల కలిగే ఆచారపరమైన అపవిత్ర స్థితి రెండింటినీ స్పష్టంగా కలుపుతుంది.
- source_word: טְמֵאָה
  choice: అపవిత్రురాలిగా
  rationale: ఇది నైతిక దోషం కాక ఆచారపరమైన స్థితిని సూచించే లేవీయకాండపు పరిభాష.
- source_word: כִּימֵי נִדָּתָהּ
  choice: ఆమె రుతుక్రమ అపవిత్రత ఉన్న రోజులలోలాగే
  rationale: అసాధారణ రక్తస్రావ కాలంలోని స్థితిని సాధారణ రుతుక్రమ అపవిత్రత కాలంతో పోల్చుతున్న మూలపాఠ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రతను నైతిక అపరాధంగా వినిపించకుండా అనువదించడం
  choice: ‘అపవిత్రత’, ‘అపవిత్రురాలు’ అనే పదాలను ఆచారపరమైన స్థితి సూచకాలుగా ఉపయోగించడం
  alternative: ‘అశుద్ధత’ అని వాడటం లేదా కేవలం ‘రుతుక్రమం’ అని చెప్పి ఆచారపరమైన భావాన్ని వదలడం
  rationale: ఈ వచనం వ్యక్తిగత పాపాన్ని నిర్ధారించడం కాదు; లేవీయ ధర్మశాస్త్రంలోని ఆచారపరమైన శుద్ధి-అపవిత్రత వర్గాన్ని వివరిస్తుంది.
- issue: עַל నిడ్డా అనే పదబంధంలోని భావవ్యాప్తి
  choice: రుతుక్రమ అపవిత్రత కాలాన్ని దాటి స్రావం కొనసాగడం
  alternative: రుతుక్రమ అపవిత్రతకు అదనంగా స్రావం కలగడం
  rationale: సందర్భం సాధారణ కాలానికి మించిన కొనసాగింపును బలంగా సూచించినా, ‘అదనంగా’ అనే భావసాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘రక్తస్రావం’ వైద్యపరంగా స్పష్టంగా ఉండగా, ‘రుతుక్రమ అపవిత్రత’ మూలంలోని జీవసంబంధమైన మరియు ఆచారపరమైన రెండు కోణాలను నిలుపుతుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
