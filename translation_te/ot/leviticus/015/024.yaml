source:
  edition: WLC
  text: וְ/אִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗/הּ וּ/תְהִ֤י נִדָּתָ/הּ֙ עָלָ֔י/ו וְ/טָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְ/כָל הַ/מִּשְׁכָּ֛ב אֲשֶׁר יִשְׁכַּ֥ב עָלָ֖י/ו יִטְמָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: te
  text: ఒక పురుషుడు నిజంగానే ఆమెతో శయనిస్తే[a], ఆమె రుతుకాలపు అపవిత్రత అతనికి కలిగితే, అతడు ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు. అతడు పడుకునే ప్రతి మంచమూ అపవిత్రమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “ఆమెతో లైంగిక సంబంధం పెట్టుకుంటే.” హీబ్రూ సభ్యోక్తి అక్షరార్థంగా, “ఒక పురుషుడు నిజంగానే ఆమెతో శయనిస్తే” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: నిజంగా ... శయనిస్తే
  rationale: క్రియకు ముందు వచ్చిన infinitive absolute దానిని బలపరుస్తుంది. ‘నిజంగా’ ఆ ఉద్ఘాటనను చూపుతుంది; ‘ఆమెతో శయనించడం’ లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తిని నిలుపుతుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: ఏకవచన పురుషలింగ నామవాచకాన్ని లింగార్థం స్పష్టంగా, సహజంగా అనువదిస్తుంది.
- source_word: אֹתָהּ
  choice: ఆమెతో
  rationale: హీబ్రూలో ఇది ‘ఆమెను’ అనే ప్రత్యక్ష కర్మ అయినప్పటికీ, శయనించే సభ్యోక్తితో సహజ తెలుగు ‘ఆమెతో’ అవుతుంది.
- source_word: נִדָּתָהּ
  choice: ఆమె రుతుస్రావ అపవిత్రత
  rationale: ఇది కేవలం శారీరక రుతుస్రావాన్ని కాక, లేవీయకాండంలోని ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది.
- source_word: וּתְהִי ... עָלָיו
  choice: అతనిపైకి వస్తుంది
  rationale: అక్షరార్థంగా ‘అది అతనిపై ఉంటుంది.’ అపవిత్రత అతనికి సంక్రమించే మూలచిత్రాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְטָמֵא
  choice: అతడు ... అపవిత్రుడిగా ఉంటాడు
  rationale: షరతుకు వచ్చే ఫలితాన్ని తెలిపే న్యాయపరమైన వాక్యంగా అనువదించబడింది; ‘అపవిత్రుడు’ ఇక్కడ ఆచారపరమైన స్థితి.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: సూటిగా, సహజంగా ఉన్న సంఖ్యా వ్యక్తీకరణ.
- source_word: הַמִּשְׁכָּב
  choice: మంచం
  rationale: పడుకునే స్థలాన్ని సూచించే నామవాచకానికి సాధారణ ఆధునిక తెలుగు పదం.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: అతడు పడుకునే
  rationale: ‘దేనిమీద అతడు పడుకుంటాడో’ అనే సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రమవుతుంది
  rationale: న్యాయపరమైన ఫలితాన్ని తెలుపుతుంది; మంచం ఆచారపరంగా అపవిత్ర స్థితిలోకి రావడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రతను నైతిక దోషంగా చూపకుండా అనువదించడం
  choice: ‘అపవిత్రత,’ ‘అపవిత్రుడు,’ ‘అపవిత్రమవుతుంది’ అనే ఆచారశుద్ధి సంబంధ పదాలను వాడటం
  alternative: ‘కలుషం,’ ‘దోషం,’ లేదా నైతికంగా చెడిపోయినట్లు సూచించే పదాలు
  rationale: లేవీయకాండం 15లో ప్రధానంగా ఆచారపరమైన శుద్ధి-అశుద్ధి స్థితి ఉద్దేశించబడింది. ఈ వచనం స్వయంగా చెప్పని నైతిక అపరాధ భావాన్ని అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. లైంగిక సంబంధానికి మూలంలోని సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, స్పష్టమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘అపవిత్రత’ను ఆచారపరమైన స్థితిగా పఠించాలి; నైతిక దోషార్థం చేర్చబడలేదు.
