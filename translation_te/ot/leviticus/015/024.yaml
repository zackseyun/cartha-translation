revisions:
- from: ఒక పురుషుడు నిజంగా ఆమెతో శయనిస్తే[a], ఆమె రుతుస్రావ అపవిత్రత అతనిపైకి వస్తుంది; అతడు ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు. అతడు పడుకునే ప్రతి మంచమూ అపవిత్రమవుతుంది.
  to: ఒక పురుషుడు నిజంగానే ఆమెతో శయనిస్తే[a], ఆమె రుతుకాలపు అపవిత్రత అతనికి కలిగితే, అతడు ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు. అతడు పడుకునే ప్రతి మంచమూ అపవిత్రమవుతుంది.
