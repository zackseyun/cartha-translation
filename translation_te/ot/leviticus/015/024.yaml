review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional sexual-relations idiom, the transfer/result of the woman’s menstrual ritual impurity, the seven-day duration, and the consequent impurity of every bed on which the man lies. However, ‘అతనిపైకి వస్తుంది’ introduces an upward/motional nuance that is not present in the Hebrew ‘be upon him’; a more idiomatic Telugu expression can convey the resulting ritual condition without that nuance.
  naturalness: The register is generally clear and appropriate. ‘రుతుకాలపు అపవిత్రత’ is a smoother modern Telugu formulation than the tightly compounded ‘రుతుస్రావ అపవిత్రత.’ The revised wording also improves the flow of the legal consequence.
  terminology: ‘అపవిత్రత,’ ‘అపవిత్రుడిగా,’ and ‘అపవిత్రమవుతుంది’ consistently preserve the ritual-purity category without implying moral guilt. ‘శయనిస్తే’ appropriately retains the source idiom in the main text, while the footnote supplies the explicit sense.
  issues:
  - severity: low
    issue: ‘అతనిపైకి వస్తుంది’ is overly directional.
    rationale: וּתְהִי ... עָלָיו means that her menstrual impurity is upon him, rather than that it moves ‘up onto’ him. ‘అతనికి కలిగితే’ naturally communicates the legal/ritual result without adding directional imagery.
  - severity: low
    issue: ‘రుతుస్రావ అపవిత్రత’ is somewhat compressed in modern Telugu.
    rationale: ‘రుతుకాలపు అపవిత్రత’ is more idiomatic while retaining the ritual-purity sense of נִדָּה.
  revised_text: ఒక పురుషుడు నిజంగానే ఆమెతో శయనిస్తే[a], ఆమె రుతుకాలపు అపవిత్రత అతనికి కలిగితే, అతడు ఏడు రోజులు అపవిత్రుడిగా ఉంటాడు. అతడు పడుకునే ప్రతి మంచమూ అపవిత్రమవుతుంది.
