source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֹתָ/ם֙ הַ/כֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן לִ/פְנֵ֥י יְהוָ֖ה מִ/זּוֹבֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: te
  text: యాజకుడు వాటిలో ఒకదానిని పాపపరిహార బలిగా[a], మరొకదానిని దహనబలిగా అర్పించాలి. అతని స్రావం కారణంగా యాజకుడు యహ్వే సన్నిధిలో అతని కోసం ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదం חַטָּאת నైతిక పాపం కోసం అర్పించే బలినే కాక, ఆచార అపవిత్రతను తొలగించేందుకు ఉపయోగించే బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: వాటిని అర్పించాలి
  rationale: బలుల సందర్భంలో עשה కేవలం ‘చేయడం’ కాక, ఆచారబద్ధంగా అర్పించడాన్ని సూచిస్తుంది; אֹתָם ముందు వచనంలోని రెండు పక్షులను సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆరాధనా నియమాల సందర్భంలో כהןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: אֶחָד חַטָּאת
  choice: ఒకదాన్ని పాపపరిహార బలిగా
  rationale: חַטָּאתకు సంప్రదాయపరంగా గుర్తించదగిన తెలుగు రూపం ‘పాపపరిహార బలి’; అయితే ఈ శుద్ధి సందర్భంలో అది ఆచార అపవిత్రతను తొలగించే ‘శుద్ధీకరణ బలి’ భావాన్ని కూడా కలిగి ఉంది, అందుకే ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: וְהָאֶחָד עֹלָה
  choice: మరొకదాన్ని దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచించే ప్రామాణిక బలి పదం; הָאֶחָד సందర్భానుసారంగా ‘మరొకదాన్ని’ అని సహజంగా అనువదించబడింది.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר యొక్క ఆచారపరమైన, దైవశాస్త్ర సంబంధమైన విస్తృతిని సంకుచితం చేయకుండా ‘ప్రాయశ్చిత్తం చేయాలి’ నిలుపుతుంది; עָלָיו ఇక్కడ ‘అతని కోసం’గా వ్యక్తమవుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవ సన్నిధిలో జరిగే యాజక క్రియను సహజంగా తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: מִזּוֹבוֹ
  choice: అతని స్రావం కారణంగా
  rationale: מן ఇక్కడ ప్రాయశ్చిత్తం అవసరమైన మూలం లేదా కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆచార శుద్ధి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ప్రధాన పాఠంలో విస్తృతంగా పరిచితమైన బలి పదాన్ని ఉంచాం. అయితే ఇక్కడ నైతిక పాపం కంటే స్రావం వల్ల కలిగిన ఆచార అపవిత్రత ప్రధాన సందర్భం కాబట్టి, సాంకేతిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: כפר అనువాదం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి; శుద్ధి కలిగించాలి
  rationale: ‘ప్రాయశ్చిత్తం’ ఆచార-దైవశాస్త్ర భావాన్ని నిలుపుతూ, దాని కార్యవిధానాన్ని ఏకైక సిద్ధాంతానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండపు ఆచార నియమాలకు తగిన గంభీరమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘స్రావం,’ ‘దహనబలి,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సందర్భ స్పష్టతతో ఉపయోగించాం.
