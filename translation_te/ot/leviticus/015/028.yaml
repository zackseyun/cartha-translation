source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: te
  text: అయితే ఆమె స్రావం ఆగిపోయినప్పుడు[a], ఆమె తనకోసం ఏడు రోజులు లెక్కించుకోవాలి; ఆ తర్వాత ఆమె శుద్ధురాలవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఆమె తన స్రావం నుంచి శుద్ధురాలైతే ... ఆ తర్వాత ఆమె శుద్ధురాలవుతుంది.” హీబ్రూలో రెండు చోట్లా ఒకే మూలపదం వాడబడింది: మొదట అది స్రావం ఆగిపోవడాన్ని, తర్వాత దాని ఫలితమైన కర్మకాండ సంబంధమైన శుద్ధస్థితిని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ...ప్పుడు
  rationale: ముందున్న సందర్భంతో సంబంధాన్ని, షరతుతో కూడిన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: ఆమె స్రావం ఆగిపోయినప్పుడు
  rationale: ఇక్కడ טהר అనే క్రియ స్రావం నుంచి బయటపడటాన్ని, అంటే స్రావం నిలిచిపోవడాన్ని సూచిస్తుంది. కర్మకాండ సంబంధమైన తుది శుద్ధస్థితితో దీనిని కలపకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְסָפְרָה לָּהּ
  choice: ఆమె తనకోసం ... లెక్కించుకోవాలి
  rationale: לָהּ లోని ‘తనకోసం’ అనే భావాన్ని నిలుపుతూ, విధి/నియమ సూచనను తెలుగులో ‘లెక్కించుకోవాలి’తో సహజంగా అందిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: మూలంలోని సంఖ్యా పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: וְאַחַר תִּטְהָר
  choice: ఆ తర్వాత ఆమె శుద్ధురాలవుతుంది
  rationale: ఏడు రోజుల గణన అనంతరం కలిగే కర్మకాండ సంబంధమైన శుద్ధస్థితిని తెలియజేస్తుంది; నైతిక పవిత్రతను సూచించదు.
theological_decisions:
- issue: కర్మకాండ సంబంధమైన శుద్ధత
  choice: శుద్ధురాలవుతుంది
  alternative: శుభ్రురాలవుతుంది / పవిత్రురాలవుతుంది
  rationale: లేవీయకాండము 15లోని טהר అనేది నైతిక నిర్దోషిత్వం కాదు, ఆరాధనా-కర్మకాండ సంబంధమైన స్థితి. ‘శుద్ధురాలు’ ఈ ప్రత్యేక భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- issue: ఒకే హీబ్రూ ధాతువు యొక్క సందర్భానుసార భావాలు
  choice: మొదటి సందర్భంలో ‘స్రావం ఆగిపోవడం,’ చివరలో ‘శుద్ధురాలవడం’
  alternative: రెండు చోట్లా ‘శుద్ధురాలవడం’
  rationale: మూలంలో ఒకే טהר ధాతువు ఉన్నప్పటికీ, మొదటిది స్రావం నుంచి బయటపడటాన్ని, రెండవది ఏడు రోజుల అనంతర కర్మకాండ స్థితిని సూచిస్తుంది. ఈ తేడాను ప్రధాన పాఠంలో సహజంగా చూపి, ధాతు పునరావృతిని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నియమపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. ‘స్రావం’ వైద్యపరంగా స్పష్టమైన పదం; ‘శుద్ధురాలు’ను కర్మకాండ స్థితికే పరిమితం చేశాం.
