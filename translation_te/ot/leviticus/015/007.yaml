id: LEV.15.7
reference: Leviticus 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: te
  text: స్రావం ఉన్న పురుషుని శరీరాన్ని[a] తాకినవాడు తన బట్టలు ఉతుక్కొని, నీటిలో స్నానం చేయాలి; సాయంకాలం వరకు అతడు అపవిత్రుడై ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీరాన్ని’—హీబ్రూ పదానికి అక్షరార్థం ‘మాంసాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: తాకినవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కర్తృవాచక రూపం సాధారణ నియమాన్ని సూచిస్తుంది; తెలుగులో ‘తాకినవాడు’ సహజంగా ఆ న్యాయబద్ధ భావాన్ని అందిస్తుంది.
- source_word: בִּבְשַׂר
  choice: శరీరాన్ని
  rationale: בָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా, ఇక్కడ వ్యక్తి యొక్క భౌతిక దేహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘శరీరం’ స్పష్టంగా, సహజంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַזָּב
  choice: స్రావం ఉన్న ఆ పురుషుని
  rationale: זוּב నుంచి వచ్చిన ఈ రూపం ఈ సందర్భంలో అసాధారణ శారీరక స్రావం ఉన్న పురుషుణ్ణి సూచిస్తుంది. పూర్వ వచనాల నిర్దిష్ట వ్యక్తిని సూచించే ఉపపదాన్ని ‘ఆ’ ద్వారా నిలిపాం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: כִּבֵּס వస్త్రాలను ఉతకడాన్ని సూచిస్తుంది. ‘తన బట్టలు’ స్వామ్యాన్ని స్పష్టపరుస్తుంది; ‘ఉతుక్కొని’ తరువాతి శారీరక స్నానంతో క్రమబద్ధంగా కలుస్తుంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: רָחַץ ఇక్కడ శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది. ‘నీళ్లతో స్నానం చేయాలి’ సహజమైన ఆధునిక తెలుగు మరియు విధి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అతడు అపవిత్రుడిగా ఉంటాడు
  rationale: టָמֵא ఇక్కడ ఆచారపరమైన అపవిత్రతను సూచిస్తుంది, నైతిక దోషాన్ని కాదు. లేవీయకాండపు శుద్ధి నియమాల్లో ‘అపవిత్రుడు’ స్థిరమైన, అర్థమయ్యే పదం.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: అపవిత్ర స్థితి కొనసాగే కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: టָמֵאను ఆచారపరమైన స్థితిని సూచించే ‘అపవిత్రుడు’గా అనువదించడం
  alternative: ‘మలినుడు’ లేదా నైతికంగా కలుషితుడని సూచించే పదప్రయోగం
  rationale: లేవీయకాండం 15లో శారీరక స్రావం వల్ల కలిగే ఆచారపరమైన అపవిత్రతే విషయం. ఈ స్పర్శను స్వతహాగా నైతిక పాపంగా చిత్రించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ/ఆచార శైలిని వాడాం. ‘చేయాలి’ విధిని సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠ్యంలో ‘శరీరం’ పఠన సౌలభ్యాన్ని ఇస్తుండగా, హీబ్రూ అక్షరార్థమైన ‘మాంసం’ పాదసూచికలో భద్రపరచబడింది.
