id: LEV.15.17
reference: Leviticus 15:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל בֶּ֣גֶד וְ/כָל ע֔וֹר אֲשֶׁר יִהְיֶ֥ה עָלָ֖י/ו שִׁכְבַת זָ֑רַע וְ/כֻבַּ֥ס בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: te
  text: వీర్యస్రావం ఉన్న ప్రతి వస్త్రాన్నీ, ప్రతి తోలు వస్తువునూ[a] నీళ్లతో కడగాలి; అవి సాయంత్రం వరకు అపవిత్రంగా ఉంటాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘తోలు’ లేదా ‘చర్మం’; ఇక్కడ జంతుచర్మంతో చేసిన వస్తువు ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అపవిత్రం’ అనేది ఆచారపరమైన స్థితిని సూచిస్తుంది; నైతిక దోషాన్ని కాదు.
    reason: theological_clarification
lexical_decisions:
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: దుస్తులు లేదా బట్ట అనే విస్తృత భావాన్ని తెలిపే పదం; ఇక్కడ ‘వస్త్రం’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עוֹר
  choice: తోలు వస్తువు
  rationale: మూలపదం చర్మం/తోలును సూచిస్తుంది; ఈ సందర్భంలో జంతుచర్మంతో చేసిన వస్తువు భావం సంభావ్యమైనందున ‘తోలు వస్తువు’ సహజమైన సందర్భానుగుణ రూపం, అయితే మూలంలోని విస్తృతిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: తగిలిన
  rationale: అక్షరార్థంగా ‘దానిమీద ఉన్న’ అనే స్థానార్థాన్ని, తెలుగులో సహజంగా పదార్థం వస్తువుపై ఉండడాన్ని సూచించే ‘తగిలిన’తో వ్యక్తం చేస్తుంది.
- source_word: שִׁכְבַת זָרַע
  choice: వీర్యస్రావం
  rationale: ఈ హీబ్రూ పదబంధం విడుదలైన వీర్యాన్ని సూచిస్తుంది; ‘వీర్యస్రావం’ స్పష్టంగా, సంక్షిప్తంగా, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְכֻבַּס בַּמַּיִם
  choice: నీళ్లతో కడగాలి
  rationale: న్యాయవిధిలోని కర్తవ్యాన్ని తెలుగులో సహజంగా తెలిపే రూపం; బַּמַּיִם లోని సాధనార్థం ‘నీళ్లతో’గా నిలుస్తుంది.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: అది సాయంత్రం వరకు అపవిత్రంగా ఉంటుంది
  rationale: కడిగిన తరువాత కూడా ఆ వస్తువుకు కొనసాగుతున్న ఆచారపరమైన స్థితిని స్పష్టంగా తెలియజేస్తుంది; ‘అపవిత్రం’ నైతిక దోషాన్ని తప్పనిసరిగా సూచించదు.
theological_decisions:
- issue: లేవీయకాండంలోని అపవిత్రత స్వభావం
  choice: טָמֵא ను ‘అపవిత్రం’గా అనువదించి, ఆచారపరమైన స్థితిగానే ఉంచడం
  alternative: అశుద్ధం; కలుషితం
  rationale: లేవీయకాండం 15లో ఇది ఆచారపరమైన అపవిత్రత; వ్యక్తిగత పాపం లేదా నైతిక దోషాన్ని వచనం ప్రకటించదు. అదనపు సిద్ధాంతార్థం చేర్చకుండా మూలంలోని వర్గాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా స్పష్టమైన శరీర సంబంధ పదజాలం, న్యాయవిధికి తగిన గౌరవప్రదమైన శైలి. సమాంతరమైన ‘ప్రతి వస్త్రాన్నీ, ప్రతి తోలు వస్తువునూ’ నిర్మాణం మూలంలోని כָל...כָל ను నిలుపుతుంది.
