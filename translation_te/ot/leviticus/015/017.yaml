  to: వీర్యస్రావం ఉన్న ప్రతి వస్త్రాన్నీ, ప్రతి తోలు వస్తువునూ[a] నీళ్లతో కడగాలి; అవి సాయంత్రం వరకు అపవిత్రంగా ఉంటాయి.[b]
