  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: te
  text: ఒక పురుషుడు స్త్రీతో శయనించి వీర్యస్ఖలనం జరిగితే,[a] వారిద్దరూ నీళ్లతో కడుక్కోవాలి; సాయంత్రం వరకు అపవిత్రులుగా ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీర్యపు ఉద్గారంతో.” హెబ్రీ పదబంధం ప్రత్యేకంగా వీర్యస్ఖలనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆచారపరంగా అపవిత్రులుగా ఉంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: ఒక ... స్త్రీతో ... జరిగితే
  rationale: న్యాయవిధి సందర్భంలోని షరతు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; హెబ్రీ వాక్యం స్త్రీతో ప్రారంభమైనా, మొత్తం పరిస్థితిని ‘జరిగితే’ అనే షరతు నిర్మాణంతో స్పష్టంగా అందిస్తుంది.
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: ఒక పురుషుడు స్త్రీతో శయనించి
  rationale: שׁכב అనే లైంగిక ప్రయోగాన్ని గౌరవప్రదమైన, బైబిలు న్యాయశైలికి తగిన ‘శయనించి’తో అందించింది; సందర్భంలో ఇది లైంగిక సంభోగాన్ని సూచిస్తుంది.
- source_word: שִׁכְבַת זָרַע
  choice: వీర్యస్ఖలనం జరిగితే
  rationale: ఈ పదబంధం వీర్య ఉద్గారాన్ని ప్రత్యేకంగా సూచిస్తుంది. తెలుగులో శరీర సంబంధిత అర్థాన్ని ఖచ్చితంగా, సహజంగా తెలియజేసే పదప్రయోగం ఇది.
- source_word: וְרָחֲצוּ
  choice: వారిద్దరూ ... కడుక్కోవాలి
  rationale: బహువచన క్రియ ఇద్దరినీ సూచిస్తున్నందున ‘వారిద్దరూ’ అని స్పష్టం చేసింది. విధి భావాన్ని ‘కడుక్కోవాలి’ సహజంగా అందిస్తుంది.
- source_word: בַמַּיִם
  choice: నీళ్లతో
  rationale: హెబ్రీలో అక్షరార్థంగా ‘నీళ్లలో’ ఉన్నప్పటికీ, శరీరాన్ని శుద్ధి చేసుకోవడాన్ని ఆధునిక తెలుగులో ‘నీళ్లతో కడుక్కోవాలి’ అనడం సహజం; విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְטָמְאוּ
  choice: అపవిత్రులుగా ఉంటారు
  rationale: లేవీయకాండపు సందర్భంలో తాత్కాలిక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. ప్రధాన పాఠంలో నైతిక అపరాధ భావాన్ని చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: హెబ్రీ కాలపరిమితిని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘సూర్యాస్తమయం వరకు’ అని మరింత వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి నియమంలో అపవిత్రత స్వభావం
  choice: ప్రధాన పాఠంలో ‘అపవిత్రులు’ అని మాత్రమే అనువదించి, అది ఆచారపరమైన స్థితి అని పాదటిప్పణిలో వివరించడం
  alternative: ‘ఆచారపరంగా అపవిత్రులు’ అని ప్రధాన పాఠంలోనే అనువదించడం
  rationale: మూలంలోని טמא పదం ‘అపవిత్రం’ అని మాత్రమే చెబుతుంది; ఈ సందర్భంలో అది నైతిక పాపాన్ని కాక తాత్కాలిక ఆచారపరమైన స్థితిని సూచిస్తుంది. పాదటిప్పణి ఈ తేడాను తెలియజేస్తూ ప్రధాన పాఠానికి అదనపు విశేషణాన్ని చేర్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయవిధి శైలిని ఉపయోగించింది. ‘లైంగిక సంభోగం’ అనే వైద్యపరమైన ప్రత్యక్ష పదానికి బదులు మూలంలోని మర్యాదోక్తిని నిలుపుతూ ‘శయనించి’ వాడింది. పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో వరుసగా [a], [b]గా ఉన్నాయి.
