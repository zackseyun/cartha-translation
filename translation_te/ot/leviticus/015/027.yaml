  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగానే ఉంది: בָּם యొక్క బహువచన సూచనను ప్రధాన పాఠ్యంలో అస్పష్టంగానే ఉంచారు; טמאను నైతిక దోషార్థం రాకుండా ఆచారపరమైన ‘అపవిత్ర’ స్థితిగా అనువదించారు. అయితే వాక్యంలోని తరువాతి రెండు క్రియలు విధి/నియమ స్వరాన్ని స్పష్టంగా వ్యక్తం చేయాలి.'
