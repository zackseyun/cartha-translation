  terminology: ‘అపవిత్రులు/అపవిత్రులుగా’ లేవీయకాండపు ఆచార-శుద్ధి సందర్భానికి తగిన పదప్రయోగం. ‘బట్టలు’ మరియు ‘స్నానం’ కూడా సహజమైనవి. పాదసూచికలో ‘ఆమె పడుకున్నది లేదా కూర్చున్నది’ కంటే, ఆమె పడుకునే లేదా కూర్చునే వస్తువులు అని చెప్పడం మూలంలోని వస్తువుల సూచనను స్పష్టంగా ఇస్తుంది.
