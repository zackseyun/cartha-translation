id: LEV.15.27
reference: Leviticus 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: te
  text: వాటిని తాకే ప్రతి ఒక్కరూ అపవిత్రులవుతారు.[a] వారు తమ బట్టలు ఉతుక్కోవాలి, నీటితో స్నానం చేయాలి; సాయంత్రం వరకు అపవిత్రులుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందటి సందర్భంలో ఆమె అపవిత్రతతో సంబంధమున్న వస్తువులు—ఆమె పడుకునే లేదా కూర్చునే వస్తువులు వంటివి.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָל הַנּוֹגֵעַ
  choice: వాటిని తాకే ప్రతి ఒక్కరూ
  rationale: כָּל తో కూడిన substantival participle సమగ్ర అనిర్దిష్ట భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరూ’ సహజంగా ఉండి ఆ సమగ్రతను నిలుపుతుంది.
- source_word: בָּם
  choice: వాటిని
  rationale: ఈ 3వ పురుష బహువచన ప్రత్యయం ముందటి సందర్భంలో స్త్రీ అపవిత్రతతో సంబంధమున్న వస్తువులను సూచిస్తుంది. మూలంలోని సూచనాత్మక అస్పష్టతను ప్రధాన వాక్యంలో అలాగే ఉంచి, వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: יִטְמָא
  choice: అపవిత్రులవుతారు
  rationale: లేవీయకాండంలోని ఈ సందర్భంలో טמא ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది; నైతిక పాపాన్ని కాదు.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: వారు తమ బట్టలు ఉతుక్కొని
  rationale: כבס బట్టలను ఉతకడాన్ని సూచిస్తుంది. ‘బట్టలు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְרָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: ఈ ఆచార సందర్భంలో רחץ శరీరాన్ని నీటితో కడుక్కోవడాన్ని సూచిస్తుంది. ‘స్నానం చేయాలి’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రులుగా ఉంటారు
  rationale: ఈ పదబంధం ఆచారపరమైన అపవిత్రత కొనసాగే కాలాన్ని తెలుపుతుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఉంటారు’ను స్పష్టంగా చేర్చడం సహజం.
theological_decisions:
- issue: లేవీయకాండంలో అపవిత్రత భాష స్వభావం
  choice: טמא ను ఆచారపరమైన స్థితిగా ‘అపవిత్రులు’ అని అనువదించడం
  alternative: ‘కలుషితులు’ లేదా నైతికంగా పాపులైనట్లు సూచించే పదప్రయోగం
  rationale: సందర్భం ఆచారపరమైన శుద్ధి-అపవిత్రత నియమాలకు సంబంధించినది. కేవలం తాకడాన్ని నైతిక అపరాధంగా చూపకుండా మూలంలోని వర్గీకరణను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూలో ఏకవచన పురుష రూపం సాధారణ వ్యక్తిని సూచిస్తున్నందున, తెలుగులో లింగనిరపేక్ష గౌరవ బహువచనం వాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
