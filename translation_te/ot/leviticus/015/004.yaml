source:
  edition: WLC
  text: כָּל הַ/מִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָ֑א וְ/כָֽל הַ/כְּלִ֛י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: te
  text: స్రావం ఉన్న పురుషుడు పడుకునే ప్రతి పడక అపవిత్రమవుతుంది; అతడు కూర్చునే ప్రతి వస్తువూ అపవిత్రమవుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: పడక
  rationale: מִשְׁכָּב పడుకునే స్థలాన్ని సూచిస్తుంది; ఈ సందర్భంలో సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం ‘పడక’.
- source_word: הַזָּב
  choice: స్రావం ఉన్న పురుషుడు
  rationale: זָב ఇక్కడ శరీర స్రావం ఉన్న పురుషుణ్ని సూచించే పుంలింగ ఏకవచన కృదంతం; సమీప సందర్భాన్నీ వ్యాకరణ లింగాన్నీ ఇది స్పష్టంగా నిలుపుతుంది.
- source_word: יִשְׁכַּב עָלָיו
  choice: పడుకునే
  rationale: ‘దానిమీద పడుకొను’ అనే సంబంధ వాక్యాన్ని సహజమైన తెలుగు న్యాయవాక్య శైలిలో ‘పడుకునే’ అని వ్యక్తం చేశాం.
- source_word: יִטְמָא
  choice: అపవిత్రమవుతుంది
  rationale: Qal రూపం ఆ వస్తువుకు కలిగే ఆచారపరమైన అపవిత్ర స్థితిని తెలియజేస్తుంది. ‘అపవిత్రమవుతుంది’ ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది; నైతిక దోషాన్ని చేర్చదు.
- source_word: הַכְּלִי
  choice: వస్తువు
  rationale: כְּלִי అంటే పాత్ర, ఉపకరణం, సామాను లేదా వస్తువు అనే విస్తృత అర్థం ఉంది. ఇక్కడ దానిమీద కూర్చోవచ్చని ఉన్నందున ‘పాత్ర’ కంటే ‘వస్తువు’ అర్థపరిధిని సహజంగా నిలుపుతుంది.
- source_word: יֵשֵׁב עָלָיו
  choice: కూర్చునే
  rationale: ישׁב עַל అంటే ‘దానిమీద కూర్చోవడం’; సాధారణంగా వర్తించే నియమాన్ని తెలుగులో ‘కూర్చునే’ అని సంక్షిప్తంగా, స్పష్టంగా తెలిపాం.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ‘అపవిత్రమవుతుంది’ అని ఆచారపరమైన శుద్ధి స్థితిని సూచించడం
  alternative: ‘ఆచారపరంగా అపవిత్రమవుతుంది’ లేదా ‘కలుషితమవుతుంది’
  rationale: హీబ్రూ పాఠంలో ప్రత్యేకంగా ‘ఆచారపరంగా’ అనే విశేషణం లేదు. లేవీయకాండ సందర్భంలో ‘అపవిత్రం’ శుద్ధి నియమాలకు సంబంధించిన స్థితిని సూచిస్తుంది; నైతిక అపరాధాన్ని సూచించే అదనపు భావాన్ని చేర్చలేదు.
- issue: స్రావం ఉన్న వ్యక్తి లింగం
  choice: ‘స్రావం ఉన్న పురుషుడు’ అని పుంలింగాన్ని స్పష్టంగా ఉంచడం
  alternative: ‘స్రావం ఉన్న వ్యక్తి’
  rationale: మూలంలోని הַזָּב మరియు సంబంధిత క్రియారూపాలు పుంలింగ ఏకవచనంలో ఉన్నాయి; చుట్టుపక్కల సందర్భమూ పురుషుని శరీర స్రావం గురించే చెబుతోంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయవాక్య శైలి. ‘ప్రతి వస్తువూ’ అనే రూపం כְּלִי యొక్క విస్తృత అర్థాన్ని నిలుపుతుంది. పాదసూచిక అవసరం లేకుండా మూలంలోని భావవ్యాప్తిని ప్రధాన పాఠంలోనే సహజంగా వ్యక్తం చేశాం.
