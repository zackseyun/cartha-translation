id: LEV.15.23
reference: Leviticus 15:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: te
  text: మరియు, అది మంచం మీద గానీ, ఆమె కూర్చునే వస్తువు[a] మీద గానీ ఉంటే, అతడు దానిని తాకినప్పుడు సాయంకాలం వరకు అపవిత్రుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వస్తువు’కు ‘పాత్ర’ లేదా ‘ఉపకరణం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం כְּלִי పాత్రను, ఉపకరణాన్ని లేదా ఇతర వస్తువును సూచించగల విస్తృత పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ఉంటే
  rationale: హీబ్రూ షరతును సహజమైన తెలుగు వాక్యాంత షరతురూపంలో వ్యక్తం చేస్తుంది; ముందున్న నియమంతో సంబంధం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
- source_word: עַל הַמִּשְׁכָּב
  choice: మంచం మీద
  rationale: מִשְׁכָּב అంటే పడుకునే స్థలం లేదా మంచం; ఈ సందర్భంలో ‘మంచం’ స్పష్టమైన, సహజమైన పదం.
- source_word: הוּא
  choice: అది ... ఉంటే
  rationale: పుంలింగ ఏకవచన సర్వనామం సందర్భంలో ఒక వస్తువునో దానిమీద ఉన్న అపవిత్రతనో సూచిస్తుంది. తెలుగు ‘అది’ మూలంలోని సూచనను మరింత నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: אוֹ
  choice: గానీ ... గానీ
  rationale: రెండు ప్రత్యామ్నాయ స్థలాలను సహజమైన తెలుగు సముచ్చయంతో చూపిస్తుంది.
- source_word: עַל הַכְּלִי
  choice: వస్తువు మీద
  rationale: כְּלִי అనేది పాత్ర, ఉపకరణం లేదా ఇతర వస్తువును సూచించగల విస్తృత పదం; ‘వస్తువు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: ఆమె కూర్చున్న
  rationale: హీబ్రూ సంబంధవాచక ఉపవాక్యాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: בְּנָגְעוֹ בוֹ
  choice: అతడు దానిని తాకినప్పుడు
  rationale: בְּ తో కూడిన క్రియానామ రూపం కాలసంబంధ అర్థాన్ని ఇస్తుంది; 3వ పురుష పుంలింగ ఏకవచన ప్రత్యయం ‘అతడు’గా నిలుపబడింది.
- source_word: יִטְמָא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: ఇక్కడ క్రియ ఆచారపరమైన అపవిత్ర స్థితిని తెలియజేస్తుంది; తెలుగు ధర్మశాస్త్ర వచనంలో ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: లేవీయకాండంలోని పునరావృత కాలసూత్రాన్ని స్పష్టంగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: లేవీయకాండ శుద్ధి నియమాలలో טָמֵא స్వభావం
  choice: అపవిత్రుడిగా
  alternative: ఆచారపరంగా అపవిత్రుడిగా; మలినుడిగా
  rationale: ఈ పదం ఇక్కడ నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా ఆచారపరమైన స్థితిని సూచిస్తుంది. మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా సాధారణ బైబిలు పదమైన ‘అపవిత్రుడు’ను ఉపయోగించాం.
- issue: הוּא సూచించే పూర్వపదం
  choice: అది
  alternative: ఆ అపవిత్రత; ఆ రక్తస్రావం
  rationale: హీబ్రూ సర్వనామ సూచన కొంత అస్పష్టంగా ఉంది. దాన్ని నిర్దిష్టంగా ‘రక్తస్రావం’ లేదా ‘అపవిత్రత’గా తీర్మానించకుండా ‘అది’గా ఉంచడం మూలంలోని అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి ఉపయోగించబడింది. ‘గానీ ... గానీ’ నిర్మాణం ప్రత్యామ్నాయాలను సహజంగా కలుపుతుంది; ‘అపవిత్రుడిగా ఉంటాడు’ ఆచారపరమైన స్థితిని అదనపు సిద్ధాంత వివరణ లేకుండా తెలియజేస్తుంది.
