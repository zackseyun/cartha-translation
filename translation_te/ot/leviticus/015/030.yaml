id: LEV.15.30
reference: Leviticus 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: te
  text: అప్పుడు యాజకుడు ఒకదానిని పాపపరిహార బలిగా[a], మరొకదానిని దహనబలిగా అర్పించాలి. ఆమె అపవిత్రమైన స్రావం నిమిత్తం యాజకుడు యహ్వే సన్నిధిలో ఆమె కొరకు ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’కి బదులు ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు. హీబ్రూ חַטָּאת అనే పదం లేవీయ ఆచారంలో ఈ బలి నిర్వహించే శుద్ధీకరణ కార్యాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: అర్పించాలి
  rationale: మూల క్రియకు సాధారణంగా ‘చేయు’ అనే అర్థం ఉన్నా, బలుల సందర్భంలో సహజమైన తెలుగు ప్రయోగం ‘అర్పించాలి’.
- source_word: הָאֶחָד חַטָּאת
  choice: ఒకదానిని పాపపరిహార బలిగా
  rationale: חַטָּאת ఇక్కడ ఒక బలి రకాన్ని సూచిస్తుంది. తెలుగు బైబిలు భాషలో అర్థమయ్యే ‘పాపపరిహార బలి’ని ప్రధాన పాఠంలో ఉంచి, శుద్ధీకరణ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: మరొకదానిని దహనబలిగా
  rationale: పునరుక్తమైన ‘ఒకటి’ ఇక్కడ జతలోని మరొకదాన్ని సూచిస్తుంది; עֹלָהకు ‘దహనబలి’ స్థిరమైన, స్పష్టమైన సమానం.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: ఆమె కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలోని כפר యొక్క ఆచారపరమైన, దైవశాస్త్ర సంబంధమైన భావాన్ని ‘ప్రాయశ్చిత్తం చేయాలి’ కాపాడుతుంది; עָלֶיהָను సహజంగా ‘ఆమె కోసం’ అని ఇచ్చాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: లిఖిత దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించి, לִפְנֵי యొక్క ఆరాధనా సందర్భాన్ని ‘సన్నిధిలో’ సహజంగా వ్యక్తం చేశాం.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: ఆమె అపవిత్ర స్రావం నిమిత్తం
  rationale: זוֹבను ‘స్రావం’గా, טֻמְאָהను దానిని విశేషించే ‘అపవిత్ర’గా అనువదించడం ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని కారణ/సంబంధ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి పేరును ఎలా అనువదించాలి
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమైన బలిని సూచించగలదే కాక లేవీయ ఆచారంలో శుద్ధీకరణ కార్యాన్ని కూడా ప్రధానంగా చూపగలదు. సుపరిచితమైన పదాన్ని ప్రధాన పాఠంలో ఉంచి నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: יהוה దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధనా నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- issue: స్త్రీ కోసం జరిగే ప్రాయశ్చిత్తం మరియు ఆచార అపవిత్రత మధ్య సంబంధం
  choice: ఆమె అపవిత్ర స్రావం నిమిత్తం ఆమె కోసం ప్రాయశ్చిత్తం
  alternative: ఆమెను అపవిత్రతనుండి శుద్ధి చేయడం
  rationale: మూలంలోని כפר పదాన్ని కేవలం ‘శుద్ధి’గా కుదించకుండా, ఆచార అపవిత్రతతో దాని సంబంధాన్ని అలాగే ఉంచాం; దీనివల్ల నైతిక అపరాధమని అతిగా నిర్ధారించడాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. ‘అర్పించాలి’, ‘దహనబలి’, ‘ప్రాయశ్చిత్తం’, ‘సన్నిధిలో’ వంటి సుపరిచితమైన పదాలను నిలిపి, అతిగా ప్రాచీనమైన వాక్యనిర్మాణాన్ని నివారించాం.
