  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: te
  text: 'తరువాత యాహ్వే[a] మోషేకూ అహరోనుకూ ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: తరువాత ... చెప్పాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘తరువాత’ దాని క్రమానుసార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. చెప్పబోయే మాటలను לֵאמֹר పరిచయం చేస్తున్నందున ‘చెప్పాడు’ సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షరి יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: హీబ్రూ వాక్యంలో ఇద్దరినీ విడివిడిగా సూచించే పూర్వప్రత్యయం పునరావృతమైంది; తెలుగులో ‘తో’ను రెండుసార్లు ఉంచడం ఆ నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పాడు
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రాయ ప్రయోగం; ఆధునిక తెలుగులో ‘ఇలా చెప్పాడు’ సహజమైన సమానార్థకం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా יהוה అనే దైవనామాన్నే ఉపయోగిస్తుంది. అందువల్ల దాని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ ‘యాహ్వే’గా ఇచ్చాం; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. కథన క్రమాన్ని ‘తరువాత’తో తెలియజేసి, ఇద్దరు సంబోధితులను ‘మోషేతో, అహరోనుతో’ అని స్పష్టంగా ఉంచాం.
