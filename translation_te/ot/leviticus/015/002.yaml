source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: te
  text: 'ఇశ్రాయేలీయులతో[a] మాట్లాడి, వారికి ఇలా చెప్పండి: ‘ఏ పురుషునికైనా తన శరీరం నుండి[b] స్రావం ఉన్నప్పుడు, అతని స్రావం అపవిత్రమైనది.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః ‘ఇశ్రాయేలు కుమారులతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన మాంసం నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: మాట్లాడి
  rationale: ఇది బహువచన ఆజ్ఞారూపం. దైవిక ఆదేశ సూత్రంలోని గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇక్కడ ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగు కోసం ‘ఇశ్రాయేలీయులు’ వాడి, పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: వారితో ఇలా చెప్పండి
  rationale: హీబ్రూ ధర్మశాస్త్ర ఆదేశాల్లో వచ్చే వరుస ఆజ్ఞా సూత్రాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אִישׁ
  choice: ఏ పురుషునికైనా
  rationale: పునరుక్తి పంపిణీ భావాన్ని, అంటే ‘ప్రతి పురుషుడు/ఏ పురుషుడైనా’ అనే అర్థాన్ని ఇస్తుంది. సందర్భం పురుషుని శారీరక స్రావం గురించి కావడంతో లింగనిర్దిష్ట పదాన్ని నిలిపాం.
- source_word: זָב
  choice: స్రావం కారుతున్నప్పుడు
  rationale: ఈ కృదంతం శరీరం నుండి ద్రవం కారే స్థితిని సూచిస్తుంది. తెలుగు వైద్య-న్యాయ సందర్భంలో అర్థమయ్యే సహజమైన వ్యక్తీకరణను వాడాం.
- source_word: מִבְּשָׂרוֹ
  choice: తన శరీరం నుండి
  rationale: בשר పదశః ‘మాంసం’; ఈ శుద్ధి నియమ సందర్భంలో వ్యక్తి శరీరాన్ని సూచిస్తుంది. ఆధునిక పాఠకునికి స్పష్టత కోసం ‘శరీరం’ వాడి, పదశః అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: זוֹבוֹ
  choice: అతని స్రావం
  rationale: זָב అనే మూలంతో ఉన్న నామవాచక సంబంధాన్ని ‘స్రావం’ అనే ఒకే పదంతో నిలిపాం.
- source_word: טָמֵא הוּא
  choice: అపవిత్రమైనది
  rationale: పురుషలింగ ఏకవచన సర్వనామం సమీపంలోని పురుషలింగ నామవాచకమైన ‘స్రావం’ను సూచించగలదు. అందువల్ల స్రావమే అపవిత్రమని తెలిపే వ్యాకరణ నిర్మాణాన్ని నిలిపాం.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రతను సూచించే טָמֵא పదం
  choice: అపవిత్రమైనది
  alternative: అశుద్ధమైనది
  rationale: లేవీయకాండంలోని ఈ పదం తప్పనిసరిగా నైతిక పాపాన్ని కాక, ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ‘అపవిత్రం’ తెలుగు బైబిలు-ధర్మశాస్త్ర సందర్భంలో స్పష్టమైన, స్థిరమైన పదం.
- issue: טָמֵא הוּא లో అపవిత్రమైనది ఎవరు లేదా ఏది?
  choice: అతని స్రావం అపవిత్రమైనది
  alternative: అతడు తన స్రావం వల్ల అపవిత్రుడు
  rationale: హీబ్రూ సర్వనామం వ్యాకరణపరంగా ‘స్రావం’ అనే పురుషలింగ నామవాచకంతో సరిపోతుంది; ఇచ్చిన వాక్య నిర్మాణం కూడా స్రావాన్ని ముందుంచుతుంది. వ్యక్తి అపవిత్రుడనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలోకి అదనంగా చేర్చి మూలంలోని నిర్మాణాన్ని పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిలో అనువదించాం. ‘ఇలా’ మరియు ఉద్ధరణ చిహ్నాలు తరువాతి ప్రత్యక్ష ఆదేశాన్ని స్పష్టంగా చూపుతాయి. మూలంలోని బహువచన ఆజ్ఞలను తెలుగు గౌరవ/బహువచన రూపాలతో నిలిపాం.
