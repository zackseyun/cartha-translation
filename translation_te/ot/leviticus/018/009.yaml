revisions:
- from: నీ సహోదరి మానాన్ని—ఆమె నీ తండ్రి కుమార్తె అయినా, నీ తల్లి కుమార్తె అయినా, ఇంటిలో పుట్టినదైనా బయట పుట్టినదైనా—బయటపెట్టకూడదు.[a]
  to: నీ సహోదరి నగ్నతను—ఆమె నీ తండ్రి కుమార్తె అయినా, నీ తల్లి కుమార్తె అయినా, ఇంటిలో పుట్టినదైనా బయట పుట్టినదైనా—బయలుపరచకూడదు.[a]
  rationale: The revision replaces an honor/reputation idiom with the conventional Telugu rendering of the Hebrew legal expression for sexual nakedness. It preserves the source’s classification of the sister, the household/outside contrast, and the legal-prohibitive register, while avoiding extra doctrinal or later legal distinctions. The footnote remains anchored and now offers a concise lexical explanation.
  reviewer_model: gpt-5.6-terra
