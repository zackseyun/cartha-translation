source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: te
  text: నీ సహోదరి నగ్నతను—ఆమె నీ తండ్రి కుమార్తె అయినా, నీ తల్లి కుమార్తె అయినా, ఇంటిలో పుట్టినదైనా బయట పుట్టినదైనా—బయలుపరచకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం ‘ఇంటిలో/గృహ పరిధిలో’ పుట్టినదానికీ ‘బయట’ పుట్టినదానికీ మధ్య వ్యత్యాసం చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: మానాన్ని ... బయటపెట్టడం
  rationale: లేవీయకాండము 18లో ఇది నిషిద్ధ లైంగిక సంబంధాన్ని సూచించే స్థిరమైన న్యాయపరమైన నానుడి. తెలుగు బైబిలు శైలిలో సహజంగా ఉండే ‘మానాన్ని బయటపెట్టడం’ అనే రూపం మూలంలోని ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే నానుడిని మర్యాదగా, స్పష్టంగా నిలుపుతుంది.
- source_word: אֲחוֹתְךָ
  choice: నీ సహోదరి
  rationale: ఇది నేరుగా సూచించే బంధుత్వ పదం. పురుషుణ్ణి ఏకవచనంలో సంబోధిస్తున్న మూల న్యాయశైలిని ‘నీ’ ద్వారా నిలిపాం.
- source_word: בַת אָבִיךָ
  choice: నీ తండ్రి కుమార్తె
  rationale: సహోదరి అనే వర్గాన్ని తండ్రి వైపు బంధంతో నిర్దిష్టం చేసే మూలంలోని కుటుంబ సంబంధ ఖచ్చితత్వాన్ని అలాగే ఉంచుతుంది.
- source_word: בַת אִמֶּךָ
  choice: నీ తల్లి కుమార్తె
  rationale: ముందటి పదబంధానికి సమాంతరంగా తల్లి వైపు బంధాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: מוֹלֶדֶת
  choice: పుట్టినది
  rationale: పేర్కొన్న కుటుంబ లేదా గృహ పరిధిలో జన్మించిన వ్యక్తిని సూచించే ఈ రూపానికి ఆధునిక తెలుగులో ‘పుట్టినది’ స్పష్టమైన సమానార్థకం.
- source_word: בַּיִת
  choice: ఇంటిలో
  rationale: ఇది కేవలం భవనాన్ని మాత్రమే కాక గృహ లేదా కుటుంబ పరిధిని సూచించవచ్చు. ‘ఇంటిలో’ సహజంగా ఉండి మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: חוּץ
  choice: బయట
  rationale: ‘ఇంటి’కి విరుద్ధంగా, ఆ గృహ పరిధికి వెలుపల పుట్టడాన్ని సూచిస్తుంది; మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: לֹא תְגַלֶּה
  choice: బయటపెట్టకూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని ఆధునిక, గంభీరమైన తెలుగులో తెలియజేస్తూ, עֶרְוָהతో కలిసిన మూల నానుడిని కాపాడుతుంది.
- source_word: אוֹ ... אוֹ
  choice: అయినా ... అయినా
  rationale: మూలంలోని ప్రత్యామ్నాయాల నిర్మాణాన్ని సహజమైన తెలుగు సమాంతర రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: నిషిద్ధ బంధం యొక్క పరిధి
  choice: తండ్రి కుమార్తె అయినా తల్లి కుమార్తె అయినా, ఇంటిలో పుట్టినా బయట పుట్టినా, సహోదరితో లైంగిక సంబంధాన్ని వచనం నిషేధిస్తుంది.
  alternative: చివరి విశేషణాలు ఇంటిలో లేదా వెలుపల పుట్టిన సహోదరీలను, లేదా వివిధ రకాల సహోదరీ బంధాలను వేరు చేస్తున్నాయని గ్రహించవచ్చు; అయినప్పటికీ మొత్తం నిషేధం మారదు.
  rationale: హీబ్రూ న్యాయసూత్రం ‘నీ సహోదరి’ అనే వర్గాన్ని కుదించకుండా విస్తరించి వివరిస్తుంది. మూలంలో స్పష్టంగా లేని తరువాతి న్యాయపరమైన వర్గీకరణలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘మానం బయటపెట్టడం’ అనే మర్యాదపూర్వక నానుడి లైంగిక సందర్భాన్ని కప్పిపుచ్చకుండా మూలంలోని సూత్రప్రాయ వ్యక్తీకరణను నిలుపుతుంది. పాఠంలోని [a] సూచికకు అనుగుణంగా పాదటిప్పణి చేర్చబడింది.
