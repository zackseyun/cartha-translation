review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the comprehensive classification of a sister as a father's daughter or a mother's daughter, born in the household or outside it. However, “మానాన్ని బయటపెట్టడం” normally concerns reputation, honor, or a confidential matter in modern Telugu and does not adequately convey the Hebrew legal idiom עֶרְוָה ... גלה, which concerns sexual nakedness in this chapter.
  naturalness: The kinship and birth-location clauses are natural, balanced modern Telugu. Replacing “మానం” with “నగ్నత” retains the established biblical/legal idiom without importing an interpretive paraphrase.
  terminology: “సహోదరి,” “తండ్రి కుమార్తె,” and “తల్లి కుమార్తె” are precise. “నగ్నతను బయలుపరచకూడదు” is the most source-faithful Telugu equivalent for the recurrent Leviticus idiom. The footnote is revised because its former wording said the already-translated phrase could “also” be understood that way, without supplying a genuine alternative.
  issues:
  - severity: medium
    issue: “మానాన్ని—...—బయటపెట్టకూడదు” is semantically misleading for עֶרְוָה ... גלה.
    rationale: In current Telugu, మానం primarily means honor/reputation. It can suggest public disgrace or disclosure of a secret rather than the sexual-prohibition idiom intended by the Hebrew legal formula.
  - severity: low
    issue: The footnote redundantly labels the translation’s own wording as an alternative interpretation.
    rationale: A note should explain the Hebrew household/outside contrast rather than state that the same phrase may ‘also’ be understood in the way it has already been translated.
  revised_text: నీ సహోదరి నగ్నతను—ఆమె నీ తండ్రి కుమార్తె అయినా, నీ తల్లి కుమార్తె అయినా, ఇంటిలో పుట్టినదైనా బయట పుట్టినదైనా—బయలుపరచకూడదు.[a]
