  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: te
  text: నీ తోటి వ్యక్తి భార్యతో లైంగిక సంబంధం పెట్టుకొని, ఆమెతో నిన్ను నీవు అపవిత్రం చేసుకోకూడదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ తోటి వ్యక్తి భార్యతో నీ వీర్యస్రావాన్ని విత్తనంగా ఇవ్వకూడదు.”
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: నీ తోటి వ్యక్తి భార్య
  rationale: עָמִית్ ఇక్కడ నిబంధన సమాజంలోని మరొక సభ్యుణ్ణి సూచిస్తుంది. ‘తోటి వ్యక్తి’ ఆధునిక తెలుగులో ఈ సామాజిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘పొరుగువాడు’ అని పెడితే కేవలం సమీపంలో నివసించే వ్యక్తి అనే అర్థానికి పరిమితమయ్యే అవకాశం ఉంది.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: లైంగిక సంబంధం పెట్టుకోకూడదు
  rationale: ఈ హీబ్రూ పదబంధం వీర్యాన్ని విత్తనంగా ఇవ్వడం అనే శరీర సంబంధిత రూపకంతో లైంగిక సంభోగాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో దాని ఉద్దేశిత అర్థాన్ని స్పష్టంగా, గౌరవప్రదంగా ఇచ్చి, మూలంలోని రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְטָמְאָה בָהּ
  choice: ఆమెతో నిన్ను నీవు అపవిత్రపరచుకోకూడదు
  rationale: לְטָמְאָה అపవిత్రతను సూచిస్తుంది; בָהּ ఆమెతో లేదా ఆమె ద్వారా అని అర్థమివ్వగలదు. ‘ఆమెతో’ మూలంలోని సంబంధ సూచనను కాపాడుతూ, క్రియ యొక్క ప్రతిఫల భావాన్ని ‘నిన్ను నీవు’ ద్వారా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: నిషేధ స్వభావం మరియు అపవిత్రత భావం
  choice: తోటి వ్యక్తి భార్యతో లైంగిక సంబంధాన్ని నిషేధించి, దానివల్ల వ్యక్తి తనను తాను అపవిత్రపరచుకుంటాడని చెప్పడం
  alternative: వీర్యస్ఖలనానికి సంబంధించిన మూల రూపకాన్ని ప్రధాన వాక్యంలోనే అక్షరార్థంగా ఉంచడం; లేదా అపవిత్రతను కేవలం ఆచారపరమైన అశుద్ధతగా నిర్వచించడం
  rationale: మూలంలోని శరీర సంబంధిత పదబంధం సంభోగాన్ని సూచించే నానుడి. దాని భావాన్ని ప్రధాన వాక్యంలో సహజంగా తెలియజేయడం ఉత్తమ సమతుల్యతను ఇస్తుంది. טמא అనే పదం ఇక్కడ అపవిత్రతను చెబుతున్నా, అది కేవలం ఆచారపరమైనదే అని వచనం స్పష్టంగా పరిమితం చేయదు; అందువల్ల ఆ భావాన్ని అనువాదంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన న్యాయవాక్య శైలిని ఉపయోగించాం. మూలంలోని లైంగిక నానుడిని ప్రధాన పాఠ్యంలో సహజంగా అనువదించి, దాని స్పష్టమైన శరీర రూపాన్ని పాదసూచికలో భద్రపరిచాం.
