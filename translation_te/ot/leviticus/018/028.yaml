  verdict: revise
  source_fidelity: ముసాయిదా ప్రధానంగా హీబ్రూ రూపకాన్ని, దేశాన్ని కర్తగా ఉంచడాన్ని, అలాగే పూర్వ నివాసుల సమూహార్థాన్ని సరిగ్గా ప్రతిబింబిస్తుంది. అయితే ‘...కక్కివేయకుండా చూసుకోండి’ అనే ప్రయోగం మూలంలోని హెచ్చరిక/ప్రయోజన భావాన్ని రెండవ పురుష ఆజ్ఞగా (‘చూసుకోండి’) మార్చి అదనపు భావాన్ని చేరుస్తోంది.
