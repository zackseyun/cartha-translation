  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: te
  text: మీరు దానిని అపవిత్రపరిస్తే, మీకు ముందు ఉన్న జనాన్ని దేశం కక్కివేసినట్లే, అది మిమ్మల్ని కూడా కక్కివేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వాంతి చేసి బయటికి తోసివేస్తుంది’ అని కూడా అనువదించవచ్చు. అపవిత్రత కారణంగా దేశం తన నివాసులను బహిష్కరిస్తున్నట్లుగా హీబ్రూ సజీవమైన రూపకాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: కక్కివేయు / కక్కివేసింది
  rationale: హీబ్రూ క్రియ దేశం తన నివాసులను వాంతి చేసుకున్నట్లు బయటికి వెళ్లగొట్టే బలమైన రూపకాన్ని వాడుతుంది. ‘కక్కివేయు’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో పదం భూమి మొత్తాన్ని కాక కనాను దేశాన్ని సూచిస్తుంది. అందువల్ల ‘దేశం’ సందర్భానుకూలం.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: మీరు దానిని అపవిత్రపరిచినప్పుడు
  rationale: בְּ తో కూడిన క్రియానామ రూపానికి కాలార్థం లేదా సాధనార్థం ఉండవచ్చు. హెచ్చరిక సందర్భంలో ‘అపవిత్రపరిచినప్పుడు’ సహజంగా ఉండి, దేశాన్ని అపవిత్రం చేయడమనే కారణభావాన్ని నిలుపుతుంది.
- source_word: הַגּוֹי
  choice: జనం
  rationale: ఏకవచన సమూహార్థక పదం పూర్వ నివాసులను ఒక ప్రజాసమూహంగా సూచిస్తుంది. తెలుగులో ‘జనం’ సహజంగా ఆ సమూహార్థాన్ని తెలియజేస్తుంది; మూలంలో లేని తరువాతి కాలపు ‘అన్యజనులు’ అనే భావాన్ని దిగుమతి చేయదు.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: మీకంటే ముందు ఉన్న
  rationale: ఇశ్రాయేలీయులకంటే ముందుగా ఆ దేశంలో నివసించిన జనాన్ని ఇది సూచిస్తుంది. ఈ అనువాదం కాలపరమైన పూర్వత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא
  choice: '...కక్కివేయకుండా చూసుకోండి'
  rationale: రూపపరంగా ‘మరియు కాదు’ అయినా, ముందు సందర్భంలోని ఆజ్ఞలు, హెచ్చరికల కొనసాగింపులో ఇది ప్రతికూల ఫలితాన్ని నివారించే హెచ్చరికగా పనిచేస్తుంది. తెలుగు వాక్యంలో ‘చూసుకోండి’ సందర్భసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తీర్పును అమలు చేసే కర్తగా దేశం వ్యక్తీకరించబడటం
  choice: నివాసులను ‘కక్కివేసే’ వ్యాకరణ కర్తగా దేశాన్నే నిలుపడం
  alternative: దేవుడు దేశం ద్వారా వారిని వెళ్లగొట్టాడని భావాన్ని నేరుగా చేర్చడం
  rationale: హీబ్రూ వాక్యం అపవిత్రతకు ప్రతిస్పందించే దేశాన్ని స్పష్టంగా వ్యక్తీకరిస్తుంది. ఈ రూపకాన్ని నిలుపడం ద్వారా అపవిత్రత దేశాన్ని కలుషితం చేసి బహిష్కరణకు దారితీస్తుందనే లేవీయకాండంలోని theological texture నిలుస్తుంది; అయితే మూలంలో ప్రత్యక్షంగా చెప్పని వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కక్కివేయు’ ఉద్దేశపూర్వకంగా బలమైన పదం; మూలంలోని స్పష్టమైన రూపకాన్ని మృదువుగా చేయలేదు. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
