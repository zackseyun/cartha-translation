  terminology: ‘భూమి’ కంటే ఈ సందర్భంలో ‘దేశం’ అనువైనది; ‘అపవిత్రపరచు,’ ‘జనం,’ ‘కక్కివేయు’ పదాలు సందర్భానుగుణంగా ఉన్నాయి. పాదటిప్పణిలో ప్రత్యామ్నాయం ప్రధాన పాఠంలోని పదానికే పునరుక్తి కాకుండా నిజమైన ప్రత్యామ్నాయాన్ని ఇవ్వాలి.
