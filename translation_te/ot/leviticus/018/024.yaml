source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: te
  text: ఈ విషయాలలో దేనివల్లనూ మిమ్మల్ని మీరు అపవిత్రం చేసుకోవద్దు[a]. ఎందుకంటే, నేను మీ ఎదుటనుండి తరిమివేస్తున్న ఆ జాతులు ఈ సంగతులన్నిటివల్ల అపవిత్రులయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విషయాలలో దేనివల్లనూ మిమ్మల్ని మీరు అశుద్ధం చేసుకోవద్దు ... ఆ జాతులు ... అశుద్ధులయ్యారు.’
    reason: טמא అనే హీబ్రూ పదాన్ని ‘అపవిత్రం’ లేదా ‘అశుద్ధం’ అని అనువదించవచ్చు; రెండూ ఇక్కడి ఆచారపరమైన-నైతిక కలుషిత భావాన్ని సూచిస్తాయి.
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు
  rationale: אַל తో కూడిన అసంపూర్ణ క్రియ నేరమైన నిషేధాన్ని తెలియజేస్తుంది; טמא హిత్పయేల్ రూపంలోని ఆత్మనిర్దేశక భావాన్ని ‘మిమ్మల్ని మీరు’ స్పష్టంగా నిలుపుతుంది.
- source_word: בְּכָל אֵלֶּה
  choice: వీటిలో దేనివల్లా
  rationale: నిషేధ వాక్యంలో כָל אֵלֶּה ‘వీటిలో ఏదీ’ అనే విస్తృత భావాన్ని ఇస్తుంది; ב ఇక్కడ సాధనార్థకంగా ఉండటంతో ‘దేనివల్లా’ సహజమైన తెలుగు రూపం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: נִטְמְאוּ
  choice: అపవిత్రులయ్యారు
  rationale: טמא నిఫాల్ రూపం ఫలితస్థితిని సూచిస్తుంది. ‘అపవిత్రులయ్యారు’ ఆ భావాన్ని, అలాగే మొదటి క్రియతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఇక్కడి גּוֹיִם దేశంలో నివసించిన ఇశ్రాయేలేతర ప్రజాసమూహాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘జనాలు’ సాధారణంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: నేను ... వెళ్లగొడుతున్న
  rationale: שׁלח ప్రాథమికంగా ‘పంపు’ అయినా, భూమి నుంచి ప్రజలను తొలగించే ఈ సందర్భంలో ‘వెళ్లగొట్టు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מִפְּנֵיכֶם
  choice: మీ ఎదుట నుంచి
  rationale: హీబ్రూ పదబంధంలోని ‘మీ సన్నిధి/ఎదుట నుంచి’ అనే స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: లేవీయకాండము 18లో ఆచారపరమైన-నైతిక అపవిత్రత పదజాలం
  choice: అపవిత్రపరచుకోవద్దు / అపవిత్రులయ్యారు
  alternative: అశుద్ధపరచుకోవద్దు / అశుద్ధులయ్యారు
  rationale: ఈ అధ్యాయంలో నిషేధిత లైంగిక ఆచారాలు నిజమైన అపవిత్రతకు దారితీస్తాయని טמא సూచిస్తుంది. ‘అపవిత్ర’ అనే పదం ఆచారపరమైనదీ నైతికమైనదీ అయిన విస్తృత లేవీయ భావాన్ని నిలుపుతుంది; దానిని కేవలం శారీరక మలినతగా లేదా కేవలం ఆచార అశుద్ధతగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరమైన, గౌరవప్రదమైన శైలి. ‘మీ ఎదుట నుంచి వెళ్లగొడుతున్న’ అనే రూపం మూలంలోని వర్తమాన కార్యభావాన్ని, స్థలసంబంధాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో [a] సూచిక చేర్చబడింది.
