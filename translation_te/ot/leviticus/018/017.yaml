source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: te
  text: ఒక స్త్రీ నగ్నత్వాన్ని, ఆమె కుమార్తె నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]. ఆమె నగ్నత్వాన్ని బయలుపరచడానికి ఆమె కుమారుని కుమార్తెనుగానీ, ఆమె కుమార్తె కుమార్తెనుగానీ నీవు తీసుకోకూడదు. వారు ఆమెకు సమీప బంధువులు[b]. అది హేయమైన దుష్కార్యం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనేది నిషేధిత లైంగిక సంబంధాలను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: మరింత శబ్దార్థంగా, ‘వారు ఆమె మాంసం’; లేదా ‘ఆమెకు సమీప బంధువులు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘దుర్మార్గమైన పని,’ ‘అశ్లీలమైన పని,’ ‘ఘోరమైన పని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: నగ్నత్వాన్ని ... బయలుపరచు
  rationale: లేవీయకాండంలోని స్థిరమైన హీబ్రూ న్యాయపరమైన జాతీయాన్ని నిలుపుతుంది; ఇది నిషేధిత లైంగిక సంబంధాలను సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: אִשָּׁה
  choice: ఒక స్త్రీ
  rationale: ఈ పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ వివాహబంధానికే పరిమితం చేయకుండా విస్తృతమైన ‘స్త్రీ’ని ఎంచుకున్నాం.
- source_word: וּבִתָּהּ
  choice: ఆమె కుమార్తె
  rationale: సర్వనామ ప్రత్యయం ముందు చెప్పిన స్త్రీని సూచిస్తుంది.
- source_word: תִקַּח
  choice: తీసుకో
  rationale: మూలంలోని విస్తృత క్రియను నిలుపుతుంది; ‘పెళ్లి చేసుకో’ అని మాత్రమే అనువదిస్తే నిషేధాన్ని వివాహానికే అనవసరంగా పరిమితం చేసినట్లవుతుంది.
- source_word: בַּת בְּנָהּ
  choice: ఆమె కుమారుని కుమార్తె
  rationale: హీబ్రూ బంధుత్వ నిర్మాణాన్ని స్పష్టంగా, నేరుగా నిలుపుతుంది.
- source_word: בַּת בִּתָּהּ
  choice: ఆమె కుమార్తె కుమార్తె
  rationale: మనవరాలు అని సాధారణీకరించకుండా, ఏ వంశశాఖలోని మనవరాలో మూలంలాగే స్పష్టం చేస్తుంది.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: ఆమె నగ్నత్వాన్ని బయలుపరచడానికి
  rationale: ఏకవచన స్త్రీలింగ ప్రత్యయాన్ని ‘ఆమె’గా విస్తరించకుండా నిలిపి, అది మొదట పేర్కొన్న స్త్రీని సూచించే సహజ పఠనాన్ని కాపాడుతుంది.
- source_word: שַׁאֲרָה הֵנָּה
  choice: వారు రక్తసంబంధులు
  rationale: శబ్దార్థమైన ‘ఆమె శరీరం/మాంసం’ కన్నా, ఇక్కడ ఉద్దేశించిన సమీప రక్తబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: זִמָּה
  choice: నీచమైన పని
  rationale: లైంగికంగా హేయమైన, తీవ్రమైన నైతిక అతిక్రమణ అనే భావాన్ని సాధారణ పాఠకునికి అర్థమయ్యే గంభీరమైన భాషలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆమె నగ్నత్వాన్ని బయలుపరచడానికి’లోని ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆమె’ అని మాత్రమే ఉంచి, మొదట పేర్కొన్న స్త్రీతోనున్న హీబ్రూ అనుసంధానాన్ని నిలుపడం.
  alternative: ప్రతి కుమార్తె లేదా మనవరాలిని విడివిడిగా సూచించే పంపిణీయ పఠనం.
  rationale: మూలపాఠం ఏకవచన స్త్రీలింగ ప్రత్యయాన్ని వాడుతుంది. దాని సూచనను వివరణతో ఖరారు చేయకుండా ‘ఆమె’గా నిలపడం మూలంలోని వ్యాకరణ సంబంధాన్నీ సాధ్యమైన ఉద్రిక్తతనూ కాపాడుతుంది.
- issue: ఈ నిషేధంలో תִקַּח క్రియ యొక్క పరిధి
  choice: ‘తీసుకో’ అనే విస్తృత క్రియను నిలుపడం.
  alternative: ‘పెళ్లి చేసుకో’ లేదా ‘లైంగికంగా స్వీకరించు.’
  rationale: ఇది కేవలం అధికారిక వివాహ ఒప్పందాన్ని మాత్రమే నిషేధిస్తున్నదని మూలం చెప్పదు; తరువాతి ఉద్దేశ్యవాక్యం లైంగిక నిషేధాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూ లైంగిక నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అపార్థం రాకుండా పాదసూచికలో వివరించాం. బంధుత్వ పదాలను సంక్షిప్తం చేయకుండా మూలంలోని నిర్దిష్ట నిర్మాణంలో ఇచ్చాం.
