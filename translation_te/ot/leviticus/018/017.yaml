revisions:
- from: ఒక స్త్రీ నగ్నత్వాన్ని, ఆమె కుమార్తె నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]. ఆమె నగ్నత్వాన్ని బయలుపరచడానికి ఆమె కుమారుని కుమార్తెనుగానీ, ఆమె కుమార్తె కుమార్తెనుగానీ నీవు తీసుకోకూడదు. వారు రక్తసంబంధులు[b]. అది నీచమైన పని[c].
  to: ఒక స్త్రీ నగ్నత్వాన్ని, ఆమె కుమార్తె నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]. ఆమె నగ్నత్వాన్ని బయలుపరచడానికి ఆమె కుమారుని కుమార్తెనుగానీ, ఆమె కుమార్తె కుమార్తెనుగానీ నీవు తీసుకోకూడదు. వారు ఆమెకు సమీప బంధువులు[b]. అది హేయమైన దుష్కార్యం[c].
  rationale: The revision restores the possessive kinship relationship expressed by שַׁאֲרָה, strengthens the rendering of זִמָּה to match its grave legal force, and makes the lexical footnote idiomatic in modern Telugu. It preserves the Hebrew ambiguity of the singular suffix in ‘ఆమె నగ్నత్వాన్ని బయలుపరచడానికి’ and retains the broader wording ‘తీసుకోకూడదు.’
