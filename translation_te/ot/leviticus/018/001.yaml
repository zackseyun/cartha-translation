lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר అనే క్రియకు ‘మాట్లాడాడు’ అనేది మరింత రూపసామ్యమైన అర్థమైనప్పటికీ, తరువాత వచ్చే לֵאמֹרతో కలిసిన సాధారణ హీబ్రూ వాక్యసూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా చెప్పాడు’ అని వ్యక్తపరచడం సముచితం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటాన్ని సూచించే క్రియతో אֶל సంబోధిత వ్యక్తిని గుర్తిస్తుంది; తెలుగులో ‘మోషేతో ... చెప్పాడు’ సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఈ infinitive construct‌ను తెలుగులో సహజంగా ‘ఇలా’ అని అనువదించాం; వచనాంతంలోని ద్విబిందువు దాని పరిచయకార్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం. స్వరాల పునర్నిర్మాణం నిశ్చితం కానందున, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ప్రత్యక్ష వాక్య పరిచయ శైలి. మూలంలోని וַיְדַבֵּר ... לֵאמֹר సూత్రాన్ని పదేపదే అనుకరించకుండా దాని భావకార్యాన్ని నిలిపింది.
