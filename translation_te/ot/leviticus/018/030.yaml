reference: Leviticus 18:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: te
  text: కాబట్టి, మీరు నా ఆజ్ఞను పాటించాలి; మీకు ముందు ఆచరించబడిన అసహ్యకరమైన ఆచారాలలో[a] దేనినీ ఆచరించకూడదు; వాటివల్ల మిమ్మల్ని మీరు అపవిత్రపరచుకోకూడదు. నేను యెహోవాను, మీ దేవుడను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అసహ్యకరమైన నియమాలలో’ లేదా ‘అసహ్యకరమైన ఆచారవ్యవహారాలలో.’ హీబ్రూ పదం స్థిరపరచబడిన నియమాలు లేదా ఆచారాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: మీరు ... పాటించాలి
  rationale: שׁמרకు ‘కాపాడుట, పాటించుట’ అనే అర్థాలున్నాయి. ఈ నియమసంబంధ సందర్భంలో ‘పాటించాలి’ ఆదేశ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִשְׁמַרְתִּי
  choice: నా ఆజ్ఞాబాధ్యతను
  rationale: מִשְׁמֶרֶת అప్పగించబడిన కర్తవ్యాన్ని లేదా పాటించవలసిన బాధ్యతను సూచిస్తుంది. ‘ఆజ్ఞాబాధ్యత’ దేవుడు అప్పగించిన విధిని కేవలం ఒక విడి ఆజ్ఞగా కుదించకుండా వ్యక్తపరుస్తుంది.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: ఆచరించకూడదు
  rationale: ఈ నిర్మాణం నివారణ లేదా ఉద్దేశాన్ని సూచిస్తుంది. పునరావృత సామాజిక ప్రవర్తనల సందర్భంలో ‘చేయకూడదు’ కంటే ‘ఆచరించకూడదు’ సహజంగా ఉంది.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: అసహ్యకరమైన ఆచారాల్లో దేనినీ
  rationale: חֻקּוֹתకు నియమాలు, స్థిరపడిన ఆచారాలు అనే భావాలు ఉండవచ్చు; ఇక్కడ గత ప్రజల ప్రవర్తనలను సూచిస్తున్నందున ‘ఆచారాలు’ సముచితం. מִן యొక్క భాగార్థాన్ని ‘దేనినీ’ తెలియజేస్తుంది; תּוֹעֵבֹת యొక్క తీవ్రమైన ప్రతికూల మూల్యాంకనాన్ని ‘అసహ్యకరమైన’ నిలుపుతుంది.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: మీకు ముందు ఆచరించబడిన
  rationale: నిష్క్రియ రూపాన్ని నిలుపుతూ, לִפְנֵיכֶםను ఈ సందర్భంలో కాలార్థకంగా—ఇశ్రాయేలీయులకు పూర్వం—వ్యక్తపరుస్తుంది.
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: వాటివల్ల మిమ్మల్ని మీరు అపవిత్రపరచుకోకూడదు
  rationale: క్రియలోని ఆత్మనిర్దేశక భావాన్ని ‘మిమ్మల్ని మీరు’ నిలుపుతుంది; בָּהֶם యొక్క సాధనార్థాన్ని ‘వాటివల్ల’ స్పష్టంగా తెలుపుతుంది.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: నేను యెహోవాను, మీ దేవుణ్ణి
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, నిబంధనాత్మక స్వపరిచయ సూత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’గా ఉంచబడింది.
- issue: תּוֹעֵבֹת యొక్క నైతిక-ఆరాధనా తీవ్రత
  choice: అసహ్యకరమైన
  alternative: హేయమైన / జుగుప్సాకరమైన
  rationale: మూలపదంలోని బలమైన తిరస్కార భావాన్ని నిలుపుతూ, సందర్భం చెప్పనిదాన్ని అదనంగా నిర్దిష్టం చేయని సహజమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన నియమసంబంధ స్వరం, కానీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘ఆజ్ఞాబాధ్యత’ మూలంలోని charge/duty భావాన్ని కాపాడేందుకు ఉపయోగించబడింది. పాదసూచికలు అవసరం లేకపోవడంతో ప్రధాన పాఠ్యంలో సూచికలు లేవు.
