source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: te
  text: మీరు నివసించిన ఐగుప్తు దేశపు ఆచారాల ప్రకారం మీరు చేయకూడదు; నేను మిమ్మల్ని తీసుకువెళ్తున్న కనాను దేశపు ఆచారాల ప్రకారం మీరు చేయకూడదు. వారి నియమాల ప్రకారం నడుచుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వారి నియమాల ప్రకారం నడుచుకోకూడదు” అనే మాటను “వారి ఆచారాలను గానీ విధులను గానీ అనుసరించకూడదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: దేశపు ఆచారాల ప్రకారం
  rationale: מַעֲשֶׂה అక్షరార్థంగా ‘చర్య/చేసిన పని’; ఇక్కడ ఒక దేశ ప్రజల స్థిరమైన ప్రవర్తనా పద్ధతులను సూచిస్తుంది. ‘ఆచారాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, భూమి స్వయంగా చేసే పనులన్న అపార్థాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: మీరు నివసించిన
  rationale: ఇశ్రాయేలీయులు గతంలో ఐగుప్తులో నివసించిన విషయాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు చేయకూడదు
  rationale: నిషేధార్థక న్యాయభాషను ఆధునిక, గంభీరమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: నేను మిమ్మల్ని తీసుకువెళ్తున్న
  rationale: מֵבִיא అనే కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: వారి కట్టడలను అనుసరించి
  rationale: חֻקּוֹת స్థిరపరచబడిన నియమాలు, విధులు లేదా ఆచారాలను సూచించగలదు. ‘కట్టడలు’ దాని నియమబద్ధమైన బలాన్ని నిలుపుతుంది; ‘అనుసరించి’ తరువాతి నడక రూపకంతో సహజంగా కలుస్తుంది.
- source_word: לֹא תֵלֵכוּ
  choice: నడుచుకోకూడదు
  rationale: הלך అనే ‘నడుచుట’ రూపకాన్ని కాపాడుతూ, ఇది జీవన ప్రవర్తనను సూచిస్తుందని తెలుగులో స్పష్టంగా వినిపిస్తుంది.
theological_decisions:
- issue: ‘ఐగుప్తు/కనాను దేశపు క్రియలు’ అనే హీబ్రూ ప్రయోగాన్ని ఎంత అక్షరార్థంగా ఉంచాలి
  choice: దేశపు ఆచారాల ప్రకారం
  alternative: ఆ దేశంలో వారు చేసినట్లుగా
  rationale: హీబ్రూ వాక్యం ఆచారాలను ‘దేశానికి’ ఆపాదిస్తుంది; ఉద్దేశం అక్కడి ప్రజల ప్రవర్తన. ‘దేశపు ఆచారాలు’ మూలంలోని నిర్మాణాన్ని కొంతవరకు నిలుపుతూ తెలుగులో అపార్థాన్ని తగ్గిస్తుంది.
- issue: חֻקֹּתֵיהֶם ను ‘ఆచారాలు’గా లేదా ‘కట్టడలు’గా అనువదించడం
  choice: కట్టడలు
  alternative: ఆచారాలు / నియమాలు
  rationale: చుట్టుపక్కల వచనాల్లో యెహోవా కట్టడలతో ఉన్న వ్యత్యాసాన్ని, అలాగే ఈ పదంలోని నియమబద్ధమైన భావాన్ని ‘కట్టడలు’ మెరుగ్గా నిలుపుతుంది. అయితే ఇది సామాజిక ఆచారాలను కూడా సూచించగలదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ‘నడుచుకోకూడదు’ ద్వారా మూలంలోని నడక రూపకం మరియు ప్రవర్తనా భావం రెండూ నిలుపబడ్డాయి.
