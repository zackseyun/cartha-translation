revisions:
- from: మీరు నివసించిన ఐగుప్తు దేశపు ఆచారాల ప్రకారం మీరు చేయకూడదు; నేను మిమ్మల్ని తీసుకువెళ్తున్న కనాను దేశపు ఆచారాల ప్రకారం కూడా మీరు చేయకూడదు. వారి కట్టడలను అనుసరించి నడుచుకోకూడదు.[a]
  to: మీరు నివసించిన ఐగుప్తు దేశపు ఆచారాల ప్రకారం మీరు చేయకూడదు; నేను మిమ్మల్ని తీసుకువెళ్తున్న కనాను దేశపు ఆచారాల ప్రకారం మీరు చేయకూడదు. వారి నియమాల ప్రకారం నడుచుకోకూడదు.[a]
