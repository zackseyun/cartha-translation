id: LEV.18.21
reference: Leviticus 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִֽ/זַּרְעֲ/ךָ֥ לֹא תִתֵּ֖ן לְ/הַעֲבִ֣יר לַ/מֹּ֑לֶךְ וְ/לֹ֧א תְחַלֵּ֛ל אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: te
  text: నీ సంతానంలో[a] ఎవరినీ మోలెకుకు అప్పగించి దాటేలా చేయకూడదు.[b] నీ దేవుని నామాన్ని అపవిత్రపరచకూడదు. నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పిల్లల్లో ఎవరినీ.’ హీబ్రూలో అక్షరార్థంగా ‘నీ విత్తనంలో నుంచి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మోలెకుతో సంబంధమున్న ఒక ఆచారానికి వారిని అప్పగించడం. దీనిని చాలామంది బాలబలిగా అర్థం చేసుకుంటారు; ఇతర చోట్ల అది పిల్లలను ‘అగ్నిలో గుండా దాటించడం’గా వర్ణించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: నీ సంతానంలో ఎవరినీ
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఈ న్యాయ సందర్భంలో సంతానం లేదా వారసులను సూచిస్తుంది. భాగార్థక מִן భావాన్ని ‘సంతానంలో ఎవరినీ’ సహజంగా నిలుపుతుంది.
- source_word: תִתֵּן
  choice: అప్పగించి ... కూడదు
  rationale: נתן సాధారణంగా ‘ఇవ్వు’ అని అర్థం. మోలెకు ఆచార సందర్భంలో ‘అప్పగించు’ అనేది సహజమైన తెలుగు; నిషేధార్థం ‘కూడదు’తో స్పష్టమవుతుంది.
- source_word: לְהַעֲבִיר
  choice: వారిని దాటించకూడదు
  rationale: עבר హిఫీల్ రూపానికి ‘దాటించు/దాటేలా చేయు’ అనే కారణార్థం ఉంది. అగ్ని లేదా బలి అని వచనంలో లేని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: לַמֹּלֶךְ
  choice: మోలెకుకు
  rationale: మసొరేటిక్ స్వరచిహ్నాలు మరియు సంప్రదాయ అవగాహన ప్రకారం మోలెకు ఒక ప్రత్యేక నామంగా తీసుకోబడింది.
- source_word: תְחַלֵּל
  choice: అపవిత్రపరచకూడదు
  rationale: חלל పియేల్ రూపం ‘అపవిత్రపరచు, పవిత్రతను భంగపరచు’ అని అర్థం; దేవుని నామంతో సహజంగా సరిపోతుంది.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: నీ దేవుని నామాన్ని
  rationale: మూలంలోని నిర్మాణాన్ని, దేవుని వెల్లడైన ఘనతను సూచించే ‘నామం’ యొక్క వేదాంత బరువును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: మోలెకు సంబంధమైన నిషేధిత క్రియ స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘అప్పగించి, వారిని దాటించకూడదు’ అని మూల ప్రయోగాన్ని నిలుపుట
  alternative: ‘మోలెకుకు నీ పిల్లలను అగ్నిబలిగా అర్పించకూడదు’
  rationale: ఈ వచనంలో అగ్ని లేదా బలి అని ప్రత్యక్షంగా లేదు. ఇతర వచనాలు అలాంటి ఆచారంతో దీనిని అనుసంధానించినా, ఇక్కడి అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదటిప్పణిలో వివరిస్తుంది.
- issue: זֶרַע పదానికి ఇక్కడి సూచన
  choice: సంతానం
  alternative: పిల్లలు; విత్తనం
  rationale: ‘సంతానం’ మూలపద విస్తృతిని కాపాడుతూ, ఈ కుటుంబ-న్యాయ సందర్భంలో సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో కూడిన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దాటించు’ అనే మూలప్రయోగం ఉద్దేశపూర్వకంగా నిలుపబడి, అవసరమైన వివరణ పాదటిప్పణిలో ఇవ్వబడింది.
