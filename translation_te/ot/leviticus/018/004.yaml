  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת מִשְׁפָּטַ֧/י תַּעֲשׂ֛וּ וְ/אֶת חֻקֹּתַ֥/י תִּשְׁמְר֖וּ לָ/לֶ֣כֶת בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: te
  text: మీరు నా న్యాయవిధులను పాటించాలి; నా కట్టడలను గైకొని, వాటి ప్రకారం నడుచుకోవాలి.[a] నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వాటిలో నడుచుకోవాలి”; అంటే దేవుని ఆజ్ఞలకు అనుగుణంగా జీవితాన్ని క్రమపరచుకోవాలి. “వాటి ప్రకారం జీవించాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: ఈ పదంలోని న్యాయపరమైన భావాన్ని నిలుపుతూ, חֻקֹּתַיతో ఉన్న భేదాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: תַּעֲשׂוּ
  choice: పాటించాలి
  rationale: అక్షరార్థంగా ‘చేయాలి’; ధర్మశాస్త్ర సందర్భంలో ఆ విధులను ఆచరణలో అమలు చేయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలను
  rationale: నిర్దేశించబడిన శాసనాలు లేదా నియమాలు అనే భావాన్ని ఇస్తూ, ‘న్యాయవిధులు’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: תִּשְׁמְרוּ
  choice: గైకొని
  rationale: ‘కాపాడు/గమనించి పాటించు’ అనే నిబంధనాత్మక భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: לָלֶכֶת בָּהֶם
  choice: వాటి ప్రకారం నడుచుకోవాలి
  rationale: హీబ్రూ ‘వాటిలో నడుచుట’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, జీవన ప్రవర్తనను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా స్థిరపడిన రూపంలో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచన స్వామ్యప్రత్యయాన్ని నేరుగా వ్యక్తపరచి నిబంధన సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: לָלֶכֶת בָּהֶם యొక్క భావబలం
  choice: వాటి ప్రకారం నడుచుకోవాలి
  alternative: వాటి వల్ల జీవించాలి
  rationale: ఈ సందర్భంలో ప్రధానంగా దేవుని ఆజ్ఞలకు అనుగుణమైన జీవన ప్రవర్తనే సూచితం. ‘నడుచుకోవాలి’ రూపకాన్ని కాపాడి, ‘వాటి వల్ల జీవించాలి’ అనే బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘న్యాయవిధులు’ మరియు ‘కట్టడలు’ అనే వేర్వేరు పదాలతో మూలంలోని న్యాయపదాల భేదం నిలుపబడింది; హీబ్రూ నడక రూపకాన్ని సహజంగా వ్యక్తపరచి పాదటిప్పణిలో అక్షరార్థం ఇచ్చారు.
