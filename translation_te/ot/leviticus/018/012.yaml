id: LEV.18.12
reference: Leviticus 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: te
  text: నీ తండ్రి సహోదరి నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]; ఆమె నీ తండ్రి రక్తసంబంధి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నగ్నత్వాన్ని బయలుపరచడం” అనేది లేవీయకాండము 18లో నిషేధిత లైంగిక బహిర్గతత లేదా సంబంధాన్ని సూచించే న్యాయపరమైన ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆమె నీ తండ్రి మాంసం”; అంటే, అతని దగ్గరి రక్తసంబంధి.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: నగ్నత్వాన్ని నీవు బయలుపరచకూడదు
  rationale: లేవీయకాండము 18లో పునరావృతమయ్యే న్యాయపరమైన మూలభాషా ప్రయోగాన్ని నిలుపుతుంది. సందర్భంలో ఇది నిషేధిత లైంగిక సంబంధాన్ని సూచిస్తుంది; దానిని ప్రధాన పాఠ్యంలో విస్తృత వ్యాఖ్యానంగా మార్చలేదు.
- source_word: אֲחוֹת אָבִיךָ
  choice: నీ తండ్రి సహోదరి
  rationale: మూలంలోని బంధుత్వ నిర్మాణాన్ని నేరుగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאֵר אָבִיךָ
  choice: నీ తండ్రి రక్తసంబంధి
  rationale: שְׁאֵר సూచించే సన్నిహిత శారీరక/రక్త బంధుత్వ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; మరింత అక్షరార్థమైన ‘మాంసం’ అనే రూపాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: הִוא
  choice: ఆమె
  rationale: నిషేధిత బంధుత్వ పరిధిలో ఉన్న స్త్రీని సరళంగా గుర్తిస్తుంది.
theological_decisions:
- issue: వ్యభిచార సంబంధ నిషేధ సూత్రప్రయోగాన్ని అనువదించడం
  choice: ‘నగ్నత్వాన్ని బయలుపరచకూడదు’ అనే మూలరూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘లైంగిక సంబంధం పెట్టుకోకూడదు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ న్యాయసూత్రంలోని రూపాన్ని, అధ్యాయాంతర అనుసంధానాన్ని కాపాడుతూ, మూలంలో ఉన్నదానికంటే ఎక్కువగా వ్యాఖ్యానించకుండా ఉంటుంది.
- issue: שְׁאֵר అనే బంధుత్వ పదం
  choice: ‘రక్తసంబంధి’
  alternative: ‘మాంసం’ లేదా ‘దగ్గరి బంధువు’
  rationale: ఇక్కడ ఉద్దేశించిన సన్నిహిత వంశబంధాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘మాంసం’ అనే అక్షరార్థాన్ని పాదటిప్పణి ద్వారా భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. మూలంలోని స్థిరమైన సూత్రప్రయోగాన్ని నిలుపుతూ, שְׁאֵר యొక్క అక్షరార్థం మరియు బంధుత్వ భావం మధ్య తేడాను పాదటిప్పణితో చూపించాం.
