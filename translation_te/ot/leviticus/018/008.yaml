  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: te
  text: నీ తండ్రి భార్య నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]; అది నీ తండ్రి నగ్నత్వం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: ‘నీ తండ్రి భార్యతో లైంగిక సంబంధం పెట్టుకోకూడదు.’ హీబ్రూలో అక్షరార్థంగా, ‘నగ్నత్వాన్ని బయలుపరచకూడదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: నగ్నత్వాన్ని / నగ్నత్వం
  rationale: లేవీయకాండము 18లో ఇది ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే స్థిరమైన న్యాయపరమైన మర్యాదోక్తిలో భాగం; నిషేధిత లైంగిక సంబంధాన్ని సూచిస్తుంది. మూలంలోని పునరావృత సూత్రాన్ని నిలుపుటకు మర్యాదోక్తినే ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: אֵשֶׁת אָבִיךָ
  choice: నీ తండ్రి భార్య
  rationale: నిర్మాణ సంబంధంలో אֵשֶׁת ఇక్కడ వివాహ బంధాన్ని స్పష్టంగా సూచిస్తుంది; కాబట్టి ‘స్త్రీ’ కంటే ‘భార్య’ సరైనది.
- source_word: לֹא תְגַלֵּה
  choice: నీవు బయలుపరచకూడదు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగు న్యాయ/ఆజ్ఞా శైలిలో సహజంగా వ్యక్తపరుస్తూ, ‘బయలుపరచు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: స్వామ్యార్థాన్ని నేరుగా అందిస్తుంది; వచనంలోని రెండుసార్ల పునరుక్తినీ స్పష్టత కోసం నిలిపాం.
- source_word: הִוא
  choice: అది
  rationale: స్త్రీలింగ సర్వనామం ఇక్కడ స్త్రీని కాక, స్త్రీలింగ నామవాచకమైన ‘నగ్నత్వం’ను తిరిగి సూచిస్తుంది; తెలుగులో ‘అది’ సహజం.
theological_decisions:
- issue: హీబ్రూ మర్యాదోక్తిని లైంగిక సంబంధం అని ప్రధాన పాఠ్యంలో స్పష్టీకరించాలా?
  choice: ‘నగ్నత్వాన్ని బయలుపరచు’ అనే మూల మర్యాదోక్తిని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘నీ తండ్రి భార్యతో లైంగిక సంబంధం పెట్టుకోకూడదు’
  rationale: ఈ అధ్యాయమంతటా పునరావృతమయ్యే నిబంధనాత్మక న్యాయ సూత్రాన్ని, దాని మర్యాదోక్తి శైలిని ఇది కాపాడుతుంది. స్పష్టమైన భావాన్ని పాదటిప్పణిలో ఇవ్వడం ద్వారా మూలంలోని రూపకాన్ని మౌనంగా పరిష్కరించకుండా అర్థాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘నగ్నత్వం’ మరియు ‘బయలుపరచు’ పదాలతో హీబ్రూ మర్యాదోక్తినీ అధ్యాయంలోని సూత్రబద్ధ పునరావృతినీ నిలిపాం; పాదటిప్పణి సాధారణ పాఠకునికి ఉద్దేశించిన లైంగిక అర్థాన్ని స్పష్టం చేస్తుంది.
