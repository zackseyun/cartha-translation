review_pass:
  verdict: revise
  source_fidelity: The draft preserves all principal Hebrew relationships and the legal prohibition. However, మానం ('honor/reputation') does not adequately carry the fixed sexual-legal idiom עֶרְוָה ('nakedness') in this context and may imply public disgrace rather than the prohibited sexual exposure/relationship.
  naturalness: The kinship description is understandable in modern standard Telugu. Recasting the sentence so that 'her nakedness' is the direct object of the prohibition is clearer and more natural.
  terminology: Replace మానం with నగ్నత్వం, retaining the chapter's concrete legal idiom without anatomically over-paraphrasing. Keep సహోదరి in the main text; do not add 'half-' there.
  issues:
