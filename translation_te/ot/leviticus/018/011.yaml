id: LEV.18.11
reference: Leviticus 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: te
  text: నీ తండ్రి భార్యకు పుట్టిన కుమార్తె నగ్నత్వాన్ని—ఆమె నీ తండ్రికి పుట్టినది, ఆమె నీ సహోదరి—నీవు బయలుపరచకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భార్థంగా: “ఆమె నీ అర్థసహోదరి.” హీబ్రూలో అక్షరార్థంగా “ఆమె నీ సహోదరి” అని ఉంది; ముందున్న వివరణ ఆ బంధాన్ని నిర్దిష్టం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: మానం / ఆమె మానం
  rationale: లేవీయకాండము 18లోని లైంగిక నిషేధ సూత్రంలో עֶרְוָה శరీర నగ్నతను, లైంగిక గోప్యతను సూచించే స్థిర ప్రయోగం. తెలుగులో ‘మానం బయలుపరచడం’ అనే గౌరవప్రదమైన న్యాయ-లైంగిక ప్రయోగం భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నగ్నత్వం’ కంటే తక్కువ యాంత్రికంగా ఉంటుంది.
- source_word: בַּת אֵשֶׁת אָבִיךָ
  choice: నీ తండ్రి భార్యకు పుట్టిన కుమార్తె
  rationale: మూలంలోని సంబంధపూర్వక నిర్మాణాన్ని నిలుపుతూ, ఆమెను ముందుగానే ‘సవతి సహోదరి’గా వ్యాఖ్యానించకుండా ఉంటుంది.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: నీ తండ్రికి పుట్టిన
  rationale: పితృవంశ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది. ‘నీ తండ్రిచేత కనబడిన’ వంటి పదశః రూపం అసహజంగా ఉంటుంది.
- source_word: אֲחוֹתְךָ הִוא
  choice: ఆమె నీ సహోదరి
  rationale: హీబ్రూ వాక్యం చెప్పిన విస్తృత బంధుత్వ పదాన్నే ఉంచుతుంది; ‘సవతి సహోదరి’ లేదా ‘అర్ధ సహోదరి’ అని ప్రధాన పాఠ్యంలో అదనంగా నిర్దిష్టం చేయదు.
- source_word: לֹא תְגַלֶּה
  choice: నీవు బయలుపరచకూడదు
  rationale: అధ్యాయంలోని న్యాయపరమైన నిషేధ సూత్రానికి సరిపోయే సహజ తెలుగు రూపం.
theological_decisions:
- issue: ప్రధాన పాఠ్యంలో బంధాన్ని ‘అర్ధ సహోదరి’గా పేర్కొనాలా
  choice: ‘ఆమె నీ సహోదరి’ అనే మూలస్థాయి పదప్రయోగాన్ని నిలుపుట
  alternative: ‘ఆమె నీ అర్ధ సహోదరి’
  rationale: ముందున్న వంశవివరణ బంధాన్ని నిర్దిష్టం చేస్తుంది; హీబ్రూ ముగింపు మాత్రం ‘ఆమె నీ సహోదరి’ అని మాత్రమే అంటుంది. అందువల్ల వివరణను ప్రధాన పాఠ్యంలో చేర్చి మూలంలోని విస్తృత పదాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి. ‘మానం బయలుపరచు’ అనే ప్రయోగం అధ్యాయమంతటా ఏకరీతిగా వాడదగినది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
