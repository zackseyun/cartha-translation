revisions:
- from: నీ తండ్రి భార్యకు పుట్టిన కుమార్తె—నీ తండ్రికి పుట్టిన ఆమె—నీ సహోదరి; ఆమె మానాన్ని నీవు బయలుపరచకూడదు.[a]
  to: నీ తండ్రి భార్యకు పుట్టిన కుమార్తె నగ్నత్వాన్ని—ఆమె నీ తండ్రికి పుట్టినది, ఆమె నీ సహోదరి—నీవు బయలుపరచకూడదు.[a]
  rationale: The revision replaces the potentially misleading euphemism మానం with నగ్నత్వం, a direct and appropriately formal equivalent for the Hebrew legal idiom. It also places the prohibition with its object in a clear Telugu structure while preserving the Hebrew's qualification that she is born to the father and its unqualified conclusion, 'she is your sister.'
