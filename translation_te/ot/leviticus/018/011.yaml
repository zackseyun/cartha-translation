    issue: మానం / ఆమె మానం for עֶרְוָה / עֶרְוָתָהּ
    rationale: In modern Telugu, మానం primarily denotes honor, dignity, or reputation. Although older biblical usage may employ it euphemistically, it does not reliably communicate the Hebrew's established sexual-prohibition idiom. నగ్నత్వం preserves the source wording and legal force more faithfully.
  revised_text: నీ తండ్రి భార్యకు పుట్టిన కుమార్తె నగ్నత్వాన్ని—ఆమె నీ తండ్రికి పుట్టినది, ఆమె నీ సహోదరి—నీవు బయలుపరచకూడదు.[a]
