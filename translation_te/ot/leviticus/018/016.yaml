  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: te
  text: నీ సహోదరుని భార్య నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]; అది నీ సహోదరుని నగ్నత్వం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “నీ సహోదరుని భార్యతో లైంగిక సంబంధం పెట్టుకోకూడదు.” హీబ్రూలో “నగ్నత్వాన్ని బయలుపరచడం” అనే సభ్యోక్తి ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: నగ్నత్వాన్ని
  rationale: లేవీయకాండము 18లో גלה ערוה అనే న్యాయపరమైన సభ్యోక్తి నిషిద్ధ లైంగిక సంబంధాన్ని సూచిస్తుంది. ‘నగ్నత్వాన్ని బయలుపరచడం’ అని అనువదించడం మూలంలోని సభ్యోక్తిని, పదపునరుక్తిని కాపాడుతుంది.
- source_word: אֵשֶׁת אָחִיךָ
  choice: నీ సహోదరుని భార్య
  rationale: אֵשֶׁת అనేది אָחִיךָతో నిర్మాణబంధంలో ఉండి, సాధారణంగా ‘స్త్రీ’ అని కాకుండా ప్రత్యేకంగా ‘నీ సహోదరుని భార్య’ అని అర్థమిస్తుంది.
- source_word: לֹא תְגַלֵּה
  choice: నీవు బయలుపరచకూడదు
  rationale: לֹאతో కూడిన అసంపూర్ణ క్రియారూపం ఇక్కడ న్యాయపరమైన నిషేధాన్ని వ్యక్తపరుస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: అది నీ సహోదరుని నగ్నత్వం
  rationale: మూలంలోని పదపునరుక్తిని, నిషేధానికి ఇవ్వబడిన న్యాయపరమైన కారణాన్ని అలాగే ఉంచుతుంది; భార్య యొక్క లైంగిక నగ్నత్వాన్ని సహోదరునిదిగా గుర్తించే వాక్యంలోని భావతీవ్రతను పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ సభ్యోక్తిని నేరుగా ‘లైంగిక సంబంధం పెట్టుకోవడం’ అని స్పష్టం చేయాలా?
  choice: ప్రధాన పాఠ్యంలో ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే హీబ్రూ సభ్యోక్తిని నిలుపుకోవడం
  alternative: నీ సహోదరుని భార్యతో లైంగిక సంబంధం పెట్టుకోకూడదు
  rationale: మూలం నేరుగా లైంగిక సంబంధం అని చెప్పకుండా స్థిరమైన న్యాయపరమైన సభ్యోక్తిని వాడుతుంది. దానిని ప్రధాన పాఠ్యంలో కాపాడటం లేవీయకాండము 18 అంతటా పదసామ్యాన్ని, మూలంలోని శైలిని నిలుపుతుంది; పాదటిప్పణి భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరత కోసం ‘కూడదు’ వాడబడింది. ‘సహోదరుడు’ అనే పదం గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. మూలంలోని ‘నగ్నత్వం’ పదపునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
