    text: హీబ్రూలో దేవుని నామం יהוה (YHWH); దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరించారు. సంప్రదాయ అనువాదాల్లో దీనికి బదులుగా ‘ప్రభువు’ అని వాడుతారు.
    reason: alternative_reading
  revision_rationale: The revision restores both imperative speech verbs, corrects the Telugu grammatical case in the divine identification statement, and aligns the rendering of יהוה with the POB’s adopted “Yahweh” policy. The footnote remains anchored to the divine name and notes the traditional title substitution without treating it as the main-text rendering.
