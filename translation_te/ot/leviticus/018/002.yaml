id: LEV.18.2
reference: Leviticus 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులతో మాట్లాడు; వారితో ఇలా చెప్పు: ‘నేనే మీ దేవుడైన యాహ్వేను.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని నామం יהוה (YHWH); దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరించారు. సంప్రదాయ అనువాదాల్లో దీనికి బదులుగా ‘ప్రభువు’ అని వాడుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  choice: '...తో ఇలా చెప్పు'
  rationale: రెండు హీబ్రూ వాక్కు క్రియలు ఒకే ఆజ్ఞా నిర్మాణంలో ఉన్నాయి. తెలుగులో సహజంగా, పునరుక్తి భారంగా లేకుండా ‘...తో ఇలా చెప్పు’ అని అనువదిస్తే ప్రత్యక్ష దైవాజ్ఞ యొక్క భావం నిలుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే కుటుంబ-నిబంధన సంబంధమైన పదబంధం; మూలంలోని పురుష బహువచన రూపాన్ని నిలిపింది.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన గుర్తింపు సూత్రాన్ని తెలుగులో సహజమైన నామవాచక విధేయ రూపంతో అందించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది; సంభావ్య ఉచ్చారణ ‘యాహ్వే’ను పాదసూచికలో తెలిపింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: ఇక్కడ אֱלֹהִים రూపం ఏకవచన దైవాన్ని సూచిస్తుంది; రెండవ పురుష బహువచన ప్రత్యయం ‘మీ’గా ప్రతిఫలించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; సంప్రదాయంగా ‘ప్రభువు’
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే నిలిపి, ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదసూచికలో స్పష్టంచేసింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమష్టి పరిధి
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతానం; ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ సంబంధమైన, వ్యాకరణపరంగా పురుష బహువచన రూపాన్ని కాపాడుతూ, అది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుందని అర్థం చేసుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సూటి శైలి. మోషేకు ఉద్దేశించిన ఏకవచన ఆజ్ఞను ‘చెప్పు’తో, ప్రజలను ఉద్దేశించిన బహువచన స్వామ్యాన్ని ‘మీ’తో నిలిపింది. ప్రధాన పాఠంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
