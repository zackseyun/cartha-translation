source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחֽוֹת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי שְׁאֵ֥ר אִמְּ/ךָ֖ הִֽוא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: te
  text: నీ తల్లి సహోదరి నగ్నత్వాన్ని నీవు బయలుపరచకూడదు[a]; ఎందుకంటే ఆమె నీ తల్లికి సమీప బంధువు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'భావానువాదం: “నీ తల్లి సహోదరితో నీవు లైంగిక సంబంధం పెట్టుకోకూడదు.” హీబ్రూ మూలంలో అక్షరార్థంగా, “నీ తల్లి సహోదరి నగ్నత్వాన్ని నీవు బయలుపరచకూడదు” అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: “సమీప బంధువు” అని అనువదించిన హీబ్రూ పదం שְׁאֵר (షెేర్); ఇది దగ్గరి మాంససంబంధిని సూచించే బంధుత్వ పదం.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת
  choice: నగ్నత్వాన్ని
  rationale: లేవీయకాండము 18లోని స్థిరమైన న్యాయపరమైన సౌమ్యోక్తి ‘నగ్నత్వాన్ని బయలుపరచడం’లోని మూలపదాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది నిషిద్ధ లైంగిక సంబంధాన్ని సూచిస్తుంది.
- source_word: תְגַלֵּה
  choice: నీవు బయలుపరచకూడదు
  rationale: గלה పియేల్ రూపం עֶרְוָהతో కలిసి ఏర్పరచే నిషేధ సూత్రాన్ని, దాని అధికారిక న్యాయశైలిని నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲחוֹת אִמְּךָ
  choice: నీ తల్లి సహోదరి
  rationale: మూలంలోని బంధుత్వ నిర్మాణాన్ని స్పష్టంగా కాపాడుతుంది; ‘మేనత్త’ అనే సంక్షిప్త పదం కంటే సంబంధాన్ని సందేహం లేకుండా తెలియజేస్తుంది.
- source_word: שְׁאֵר
  choice: సమీప బంధువు
  rationale: ఈ బంధుత్వ-న్యాయ సందర్భంలో సమీప రక్తసంబంధిని సూచించే שְׁאֵר భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది; అక్షరార్థమైన ‘మాంసం’ తెలుగులో ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే మూలపద కార్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִוא
  choice: ఆమె
  rationale: కారణ వాక్యంలోని స్త్రీలింగ కర్తను మూలానికి అనుగుణంగా నిలుపుతుంది.
theological_decisions:
- issue: నిషిద్ధ లైంగిక సంబంధాన్ని సూచించే న్యాయపరమైన సౌమ్యోక్తిని ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘నగ్నత్వాన్ని ... బయలుపరచకూడదు’ అనే మూలరూప సౌమ్యోక్తిని నిలుపడం
  alternative: ‘లైంగిక సంబంధం పెట్టుకోకూడదు’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠ్యం లేవీయకాండము 18 అంతటా పునరావృతమయ్యే న్యాయపరమైన సౌమ్యోక్తిని ఉపయోగిస్తుంది. దానిని నిలపడం సాహిత్య ఏకరూపతను, న్యాయశైలిని కాపాడుతుంది; భావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని పునరావృత సౌమ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, దాని లైంగిక భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. ‘నీ తల్లి సహోదరి’ అనే రూపం బంధుత్వ సంబంధాన్ని ‘మేనత్త’ కంటే నిర్మాణాత్మకంగా స్పష్టంగా చూపుతుంది.
