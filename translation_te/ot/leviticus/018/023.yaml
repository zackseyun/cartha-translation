  to: ఏ జంతువుతోనూ లైంగిక సంబంధం పెట్టుకొని, దానితో మిమ్మల్ని మీరు అపవిత్రపరచుకోకూడదు.[a] అలాగే ఒక స్త్రీ, జంతువు తనతో సంభోగించేలా దాని ఎదుట తనను తాను ఉంచుకోకూడదు.[b] అది ఒక క్రమభంగం.[c]
