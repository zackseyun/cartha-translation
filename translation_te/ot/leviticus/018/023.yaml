source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: te
  text: ఏ జంతువుతోనూ లైంగిక సంబంధం పెట్టుకొని, దానితో మిమ్మల్ని మీరు అపవిత్రపరచుకోకూడదు.[a] అలాగే ఒక స్త్రీ, జంతువు తనతో సంభోగించేలా దాని ఎదుట తనను తాను ఉంచుకోకూడదు.[b] అది ఒక క్రమభంగం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ శయనాన్ని ఇవ్వకూడదు”; ఇది జంతువుతో లైంగిక సంబంధాన్ని సూచించే హెబ్రీయ నుడికారం. చివరి భాగాన్ని “దానితో అపవిత్రుడు కావడానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పదం జంతువు ఎక్కడాన్ని సూచిస్తుంది; ఇక్కడ భావం, ఒక స్త్రీతో జంతువు లైంగికంగా కలిసేలా ఆమె తనను దాని ఎదుట ఉంచుకోవడం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “అది వికృతి,” “అది గందరగోళం.” హెబ్రీ పదం, ముఖ్యంగా లైంగిక సందర్భంలో, సముచిత క్రమాన్ని ఉల్లంఘించే కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: ఏ జంతువుతోనూ
  rationale: בְּהֵמָה ఇక్కడ విస్తృతంగా జంతువును సూచిస్తుంది; כָל మరియు నిషేధంతో కలసి ‘ఏ జంతువుతోనూ’ అనే సమగ్ర భావం వస్తుంది.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: లైంగికంగా కలవకూడదు
  rationale: అక్షరార్థంగా ‘నీ పడకను/శయనాన్ని ఇవ్వకూడదు’ అనే హెబ్రీయ నుడికారం తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది. సందర్భంలోని లైంగిక భావాన్ని సహజంగా తెలియజేసే రూపం ఎంచుకున్నాం.
- source_word: לְטָמְאָה בָהּ
  choice: అలా దానితో మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు
  rationale: טמא లోని అపవిత్రత భావాన్ని కేవలం ఆచారపరమైన అశుద్ధతకు పరిమితం చేయకుండా నిలుపుతుంది; ప్రయోజన/ఫలిత సంబంధాన్ని ‘అలా’ తెలియజేస్తుంది.
- source_word: וְאִשָּׁה
  choice: అలాగే ఒక స్త్రీ
  rationale: אִשָּׁה ఇక్కడ ‘భార్య’ అని కాక సాధారణంగా ‘స్త్రీ’ అని అర్థం.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: జంతువు ఎదుట తనను తాను ఉంచుకోకూడదు
  rationale: ‘నిలబడకూడదు’ అనే అక్షరానువాదం తెలుగులో ఉద్దేశాన్ని మరుగుపరచవచ్చు. లైంగిక ప్రయోజనం కోసం తనను జంతువు ఎదుట ఉంచుకోవడాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרִבְעָהּ
  choice: దానితో సంభోగించడానికి
  rationale: רבע ఈ సందర్భంలో జంతువు ఎక్కడాన్ని, అంటే లైంగిక సంభోగాన్ని సూచిస్తుంది. స్త్రీ ఆ క్రియకు గురయ్యే వ్యక్తి అనే భావాన్ని వాక్య నిర్మాణం, పాదసూచిక నిలుపుతాయి.
- source_word: תֶּבֶל
  choice: ప్రకృతి క్రమాన్ని తారుమారు చేసే కార్యం
  rationale: ఈ పదం సరైన క్రమాన్ని, ముఖ్యంగా లైంగిక క్రమాన్ని, ఉల్లంఘించే కార్యాన్ని సూచిస్తుంది. ‘వికృతి’ కంటే వివరణాత్మకమైన ఈ రూపం ఆధునిక తెలుగులో నైతిక-క్రమభంగ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הוּא
  choice: అది
  rationale: ముందు నిషేధించిన కార్యాన్ని తిరిగి సూచించే సరళమైన విధేయ సర్వనామం.
theological_decisions:
- issue: అపవిత్రత భాషను కేవలం ఆచార అశుద్ధతగా లేదా తరువాతి సిద్ధాంత వర్గంగా పరిమితం చేయడం
  choice: మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు
  alternative: దానివల్ల అపవిత్రులు కావద్దు
  rationale: ఈ వాక్యం కార్యాన్ని అపవిత్రపరచేదిగా చూపుతుంది. ఎంచుకున్న రూపం నైతిక, ఆచార పరిమాణాలను ముందుగానే విడదీయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: תֶּבֶל యొక్క అర్థం
  choice: ప్రకృతి క్రమాన్ని తారుమారు చేసే కార్యం
  alternative: వికృతి; గందరగోళం; ఘోరమైన కార్యం
  rationale: ‘గందరగోళం’ ఆధునిక తెలుగులో మానసిక అయోమయంలా వినిపిస్తుంది; ‘వికృతి’ నేరుగా ఉన్నప్పటికీ అదనపు ఆధునిక అనుబంధాలు కలిగించవచ్చు. ఎంచుకున్న వివరణ మూలంలోని క్రమభంగ భావాన్ని తెలియజేస్తుంది, ప్రత్యేక సృష్టి సిద్ధాంతాన్ని వచనంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూలంలోని లైంగిక నిషేధాన్ని సభ్యంగా కానీ సందిగ్ధత లేకుండా తెలిపింది. రెండవ పురుష ఏకవచన పుంలింగ హెబ్రీ రూపాన్ని తెలుగు గౌరవ/సాధారణ బహువచనమైన ‘మీరు’తో సహజీకరించింది.
