id: LEV.18.26
reference: Leviticus 18:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: te
  text: అయితే మీరు నా నియమాలను, నా న్యాయవిధులను పాటించాలి. ఈ హేయకార్యాల్లో దేనినీ మీలోని స్వదేశీయుడైనా, మీ మధ్య నివసించే పరదేశియైనా చేయకూడదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్థానికుడైనా, మీ మధ్య నివసించే నివాస పరదేశియైనా.”
    reason: אֶזְרָח కు ‘స్థానికుడు,’ גֵּר కు సమాజంలో నివసించే స్థానికేతరుడనే అర్థాన్ని స్పష్టపరచే ‘నివాస పరదేశి’ ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: అయితే మీరే ... పాటించాలి
  rationale: שׁמר యొక్క నిబంధనాత్మక భావాన్ని ‘పాటించాలి’ సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేక సర్వనామమైన אַתֶּם ఇచ్చే ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది. ముందు సందర్భంతో ఉన్న వ్యత్యాసాన్ని וּ సందర్భానుసారంగా ‘అయితే’గా తెలిపాం.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలను
  rationale: חֻקִּים స్థిరంగా విధించబడిన ఆజ్ఞలు లేదా నియమాలను సూచిస్తుంది. ‘కట్టడలు’ తోరా న్యాయ సందర్భానికి తగిన గంభీరమైన, స్థిరమైన పదం.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: מִשְׁפָּטִים న్యాయ నిర్ణయాలు, విధులు లేదా నియమాలను సూచిస్తుంది. ‘న్యాయవిధులు’ చట్టపరమైన భావాన్ని కాపాడుతూ ‘కట్టడలు’తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל
  choice: దేనినీ చేయకూడదు
  rationale: నిరాకరణతో מן + כל కలిసినప్పుడు ‘ఏదీ కాదు’ అనే సమగ్ర నిషేధార్థం వస్తుంది. ‘దేనినీ చేయకూడదు’ తెలుగులో సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: ఈ హేయకార్యాల్లో
  rationale: תּוֹעֵבָה బలమైన నైతిక లేదా ఆరాధనాపరమైన అసహ్యతను సూచిస్తుంది. సందర్భంలో ఇవి ముందుగా పేర్కొన్న క్రియలు కాబట్టి ‘హేయకార్యాలు’ బలాన్ని, సూచనను రెండింటినీ నిలుపుతుంది.
- source_word: הָאֶזְרָח
  choice: స్వదేశీయుడు
  rationale: אֶזְרָח సమాజం లేదా దేశానికి చెందిన స్థానికుడిని సూచిస్తుంది. ‘స్వదేశీయుడు’ పరదేశితో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר తాత్కాలిక సందర్శకుడికంటే సమాజంలో నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది; అనుబంధ కృదంతం అతడు వారి మధ్య నివసిస్తున్నాడని స్పష్టం చేస్తుంది. ‘మీ మధ్య నివసించే పరదేశి’ ఈ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నిషేధం స్వదేశీయుడికీ, వారి మధ్య నివసించే పరదేశికీ వర్తించే పరిధి
  choice: చివరి రెండు నామపదబంధాలను నిషేధానికి సమానంగా లోబడే రెండు వర్గాలుగా అనువదించాం.
  alternative: వాటిని ఆజ్ఞకు లోబడినవారిని కేవలం వివరిస్తున్న సమానాధికరణ పదబంధాలుగా చదవవచ్చు; సమాన వర్తింపుపై ప్రత్యేక ఉద్ఘాటనగా తీసుకోనవసరం లేదు.
  rationale: హీబ్రూ వాక్యనిర్మాణంలో הָאֶזְרָח మరియు הַגֵּר రెండూ నిషేధానికి సంబంధించిన వర్గాలుగా నిలుస్తాయి. ‘అయినా ... అయినా’ నిర్మాణం ఇద్దరినీ చేర్చుతుంది; మూలంలో లేని అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో రూపొందించాం. ‘మీరే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘కట్టడలు/న్యాయవిధులు’ ద్వారా రెండు న్యాయపదాల భేదాన్ని, ‘హేయకార్యాలు’ ద్వారా תּוֹעֵבָה యొక్క బలమైన విలువనిర్ణయాన్ని నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
