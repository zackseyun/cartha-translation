revisions:
- from: అయితే మీరే నా కట్టడలను, నా న్యాయవిధులను పాటించాలి. ఈ హేయకార్యాల్లో దేనినీ చేయకూడదు—మీలో స్వదేశీయుడైనా, మీ మధ్య నివసించే పరదేశియైనా[a].
  to: అయితే మీరు నా నియమాలను, నా న్యాయవిధులను పాటించాలి. ఈ హేయకార్యాల్లో దేనినీ మీలోని స్వదేశీయుడైనా, మీ మధ్య నివసించే పరదేశియైనా చేయకూడదు[a].
  rationale: ప్రధాన సవరణ חֻקֹּתַי కు ‘కట్టడలు’ స్థానంలో న్యాయసందర్భంలో స్పష్టమైన ‘నియమాలు’ వాడడం. మిగతా వాక్యనిర్మాణం మూలంలోని ఆజ్ఞ, సమగ్ర నిషేధం, మరియు స్వదేశీయుడు–నివాస పరదేశి అనే రెండు వర్గాల పరిధిని కాపాడుతుంది. పాదసూచికలోని ప్రత్యామ్నాయాన్ని గెర్ యొక్క నివాస-స్థితిని సూచించేలా సవరించాం.
