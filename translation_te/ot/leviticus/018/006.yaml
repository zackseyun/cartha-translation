  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: te
  text: మీలో ఎవరూ తమ దగ్గరి రక్తబంధువులలో ఎవరినీ నగ్నత్వాన్ని బయలుపరచడానికి సమీపించకూడదు.[a] నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనేది ఈ అధ్యాయంలో ఉపయోగించిన న్యాయపరమైన నానుడి; ఇది దగ్గరి బంధువుతో నిషిద్ధమైన లైంగిక బహిర్గతం లేదా లైంగిక సంబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: మీలో ఎవడూ
  rationale: ద్విరుక్త ఏకవచన నామవాచకం ప్రతి వ్యక్తినీ విడివిడిగా ఉద్దేశించే పంపిణీ ప్రయోగం. నిషేధ వాక్యంలో ‘మీలో ఎవడూ’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: తన రక్తసంబంధమైన దగ్గరి బంధువు
  rationale: ఈ పదబంధం శరీర/రక్త సంబంధం వల్ల ఏర్పడిన సన్నిహిత బంధుత్వాన్ని సూచిస్తుంది. మూలంలోని ‘మాంసం’ చిత్రాన్ని అక్షరార్థంగా ఉంచడం తెలుగులో అసహజంగా ఉండేందున అర్థాన్ని స్పష్టంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: לֹא תִקְרְבוּ
  choice: సమీపించి ... బయలుపరచకూడదు
  rationale: קָרַב ‘సమీపించు’ అనే ఉద్దేశపూర్వక చేరికను సూచిస్తుంది; నిషేధార్థక అసంపూర్ణ క్రియను తెలుగులో ‘కూడదు’తో సహజంగా తెలిపాం.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: నగ్నత్వాన్ని బయలుపరచడం
  rationale: అధ్యాయం అంతటా పునరావృతమయ్యే హీబ్రూ న్యాయపరమైన లైంగిక నానుడి చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని పరిధిని పాదసూచికలో వివరించాం.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం; సూత్రవాక్యంలోని దైవ స్వీయ గుర్తింపును నిలిపాం.
theological_decisions:
- issue: יהוה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠ్యంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’గా మార్చకుండా పేరుగానే ఉంచాం; సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: లైంగిక నానుడిని ప్రధాన పాఠ్యంలో స్పష్టార్థంగా మార్చాలా
  choice: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే మూల నానుడిని నిలిపివేయడం
  alternative: లైంగిక సంబంధం పెట్టుకోవడం
  rationale: ఈ నానుడి లేవీయకాండము 18లో నిర్మాణాత్మకంగా పునరావృతమవుతుంది; దానిని ఒకే నిర్దిష్ట చర్యగా పరిమితం చేస్తే మూలంలోని ఉద్దేశపూర్వక పరిధి, ఉద్రిక్తత తగ్గిపోవచ్చు. అందువల్ల వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలిపినా అతిగా పురాతనమైన క్రియారూపాలను నివారించాం. ‘ఎవడూ’ మూలంలోని పురుష ఏకవచన పంపిణీ రూపాన్ని ప్రతిబింబిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
