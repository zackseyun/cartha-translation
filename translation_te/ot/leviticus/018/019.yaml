source:
  edition: WLC
  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: te
  text: ఒక స్త్రీ తన రుతుస్రావపు అపవిత్రతలో ఉన్నప్పుడు, ఆమె నగ్నత్వాన్ని బయలుపరచడానికి ఆమెను సమీపించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె రుతుస్రావంతో కలిగిన ఆచారపరమైన అపవిత్రతలో ఉన్నప్పుడు.” హీబ్రూ పాఠం ఆచారపరమైన శుద్ధి–అపవిత్రత భాషను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה
  choice: స్త్రీని
  rationale: אִשָּׁה ఇక్కడ స్వామ్యసూచకంగా గుర్తించబడలేదు; అందువల్ల ‘భార్య’ కంటే సాధారణార్థంలోని ‘స్త్రీ’ సరైనది. אֶל యొక్క దిశార్థం קָרַב క్రియతో కలిసి ‘సమీపించు’ అనే ప్రయోగంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: ఆమె రుతుస్రావ అపవిత్రతలో ఉన్నప్పుడు
  rationale: נִדָּה రుతుస్రావంతో సంబంధమైన స్థితిని, טֻמְאָה లేవీయకాండంలోని ఆచారపరమైన అపవిత్రతను సూచిస్తాయి. ఈ అనువాదం దానిని కేవలం వైద్య పరిస్థితిగా మార్చకుండా మూలంలోని శుద్ధి–అపవిత్రత భాషను నిలుపుతుంది.
- source_word: לֹא תִקְרַב
  choice: సమీపించకూడదు
  rationale: చట్టపరమైన సందర్భంలోని לֹא + అసంపూర్ణ క్రియను ఆధునిక తెలుగు నిషేధ విధానంగా ‘కూడదు’తో వ్యక్తం చేశాం; ‘సమీపించు’ మూలంలోని మర్యాదాపూర్వక లైంగిక సూచనను అతిగా విప్పకుండా కాపాడుతుంది.
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: ఆమె నగ్నత్వాన్ని బయలుపరచడానికి
  rationale: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే పదబంధం లేవీయకాండం 18లోని గౌరవోచిత లైంగిక న్యాయప్రయోగాన్ని కాపాడుతుంది; మరింత స్పష్టమైన శరీర లేదా సంభోగ పదజాలం మూలంలోని మర్యాదోక్తిని అతిగా వ్యాఖ్యానిస్తుంది.
theological_decisions:
- issue: అపవిత్రత భాషను ఆచారపరమైనదిగా అనువదించాలా, కేవలం వైద్య లేదా పరిశుభ్రత స్థితిగా అనువదించాలా
  choice: రుతుస్రావ అపవిత్రత
  alternative: రుతుకాలం
  rationale: טֻמְאָה లేవీయకాండంలో ఆచారపరమైన శుద్ధి–అపవిత్రత వర్గానికి చెందిన పదం. ‘రుతుకాలం’ మాత్రమే అంటే ఆ మూలభావం కనుమరుగవుతుంది; ‘అపవిత్రత’ అనడం నైతిక దోషాన్ని అదనంగా మోపకుండా గ్రంథంలోని ఆచారపరమైన వర్గాన్ని నిలుపుతుంది.
- issue: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే మర్యాదోక్తిని ప్రధాన పాఠ్యంలో స్పష్టంగా ‘లైంగిక సంబంధం పెట్టుకోవడం’గా విప్పాలా
  choice: మూలంలోని మర్యాదోక్తిని నిలుపడం
  alternative: ఆమెతో లైంగిక సంబంధం పెట్టుకోవడం
  rationale: לְגַלּוֹת עֶרְוָה లేవీయకాండం 18లో ఉద్దేశపూర్వక న్యాయ మర్యాదోక్తి. దాని లైంగిక భావం సందర్భంలో స్పష్టమైనప్పటికీ, ప్రధాన పాఠ్యంలో దానిని పూర్తిగా విప్పడం మూలంలోని రూపాన్ని మరియు కొంత భావవిస్తృతిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. ‘సమీపించకూడదు,’ ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే పదాలు మూలంలోని నిషేధ స్వరాన్నీ మర్యాదోక్తినీ నిలుపుతాయి. ‘రుతుస్రావ అపవిత్రత’లోని అపవిత్రతను నైతిక అపరాధంగా కాక, లేవీయకాండపు ఆచారపరమైన వర్గంగా గ్రహించాలి.
