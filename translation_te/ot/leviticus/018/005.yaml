source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛/ם הָ/אָדָ֖ם וָ/חַ֣י בָּ/הֶ֑ם אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: te
  text: కాబట్టి మీరు నా నియమాలను, నా న్యాయవిధులను పాటించాలి. వాటిని ఆచరించే మనిషి[a] వాటివలన జీవిస్తాడు.[b] నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని ఆచరించే ఎవరైనా.” ఇక్కడ “మనిషి” అనే హీబ్రూ ఏకవచన పదం ప్రతినిధి ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాటిలో జీవిస్తాడు.” హీబ్రూ పూర్వప్రత్యయాన్ని సాధనార్థకంగా (“వాటివలన”) లేదా పరిధిని సూచించేదిగా (“వాటిలో”) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: కాబట్టి మీరు … పాటించాలి
  rationale: న్యాయసంబంధ ఆదేశంలో ఈ క్రియకు విధ్యర్థక భావం ఉంది. ‘పాటించాలి’ అనేది ఆజ్ఞలను జాగ్రత్తగా గైకొనే ఒడంబడిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కాబట్టి’ ముందున్న సందర్భంతో అనుసంధానిస్తుంది.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలను
  rationale: దేవుడు నిర్దేశించిన స్థిరమైన శాసనాలు లేదా నియమాలు అనే న్యాయపరమైన భావాన్ని ‘కట్టడలు’ నిలుపుతుంది.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: న్యాయనిర్ణయాలు లేదా అధికారిక విధులు అనే భావాన్ని తెలియజేస్తూ, חֻקֹּתַי అనే పదంతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: వాటిని ఆచరించే
  rationale: עשה ఇక్కడ కేవలం తెలుసుకోవడం కాక వాటి ప్రకారం చేయడాన్ని సూచిస్తుంది. ‘ఆచరించే’ అనే రూపం హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: హీబ్రూలోని ఏకవచన ప్రతినిధి ప్రయోగాన్ని నిలుపుతుంది. ఇక్కడ ‘మనిషి’ ఒక నిర్దిష్ట పురుషునికే కాక వాటిని ఆచరించే ఎవరినైనా సూచించగలదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וָחַי
  choice: జీవిస్తాడు
  rationale: విధేయతతో సంబంధమున్న జీవితం అనే ఫలితాన్ని నేరుగా తెలియజేస్తుంది; అది భౌతిక జీవమా, ఒడంబడిక జీవమా, నిత్యజీవమా అని అనవసరంగా నిర్ణయించదు.
- source_word: בָּהֶם
  choice: వాటి ద్వారా
  rationale: בְּ అనే విభక్తికి ఇక్కడ సాధనార్థక భావం ఉండవచ్చు. ‘వాటి ద్వారా’ సహజమైన తెలుగు; ‘వాటిలో’ అనే పరిధి భావం కూడా సాధ్యమని పాదసూచికలో నిలుపబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘వాటి ద్వారా జీవిస్తాడు’ అనే మాటలో ‘జీవితం’ పరిధి
  choice: జీవితం ఏ విధమైనదో నిర్దిష్టంగా చెప్పకుండా విస్తృతమైన ఒడంబడిక వ్యక్తీకరణను నిలుపడం
  alternative: వాటిని ఆచరించడం ద్వారా నిత్యజీవాన్ని పొందుతాడు
  rationale: మూలవాక్యం జీవితం యొక్క ఖచ్చితమైన పరిధిని—దేశంలో జీవితం, ఒడంబడిక జీవితం, లేదా నిత్యజీవం—స్పష్టంగా పరిమితం చేయదు. అందువల్ల తరువాతి వ్యాఖ్యాన సంప్రదాయాల నిర్ణయాన్ని అనువాదంలోకి తీసుకురాలేదు.
- issue: הָאָדָם యొక్క ప్రతినిధి ఏకవచనం
  choice: మనిషి
  alternative: ఎవరైనా
  rationale: మూలంలోని ఏకవచన రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది సమస్త మానవులకు వర్తించగల ప్రతినిధి ప్రయోగమని పాదసూచికలో వివరిస్తుంది.
- issue: בָּהֶם లో సాధనార్థక లేదా పరిధి భావం
  choice: వాటి ద్వారా
  alternative: వాటిలో
  rationale: హీబ్రూ పూర్వప్రత్యయం రెండు భావాలకు అవకాశమిస్తుంది. ప్రధాన పాఠంలో సహజమైన సాధనార్థక రూపాన్ని ఉంచి, పరిధి భావాన్ని పాదసూచికలో ఇచ్చి అసలు సందిగ్ధతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే న్యాయపరమైన శైలిని ఉపయోగించాం. ‘కట్టడలు’ మరియు ‘న్యాయవిధులు’ అనే జంట మూలంలోని రెండు వేర్వేరు న్యాయపదాలను నిలుపుతుంది. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, మూలంలోని ఆజ్ఞ–ఆచరణ–జీవితం సంబంధాన్ని యథాతథంగా కాపాడాం.
