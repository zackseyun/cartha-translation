  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: te
  text: నీవు స్త్రీతో శయనించినట్లుగా పురుషునితో శయనించకూడదు[a]; అది అసహ్యమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘స్త్రీ యొక్క శయనాలు’; ఇది స్త్రీతో లైంగిక సంభోగాన్ని సూచించే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: పురుషునితో
  rationale: זָכָר లింగపరంగా మగ వ్యక్తిని సూచిస్తుంది. సందర్భంలో తెలుగు విభక్తితో సహజంగా ఉండేందుకు ‘పురుషునితో’ అని అనువదించబడింది; ఇది వయస్సు లేదా ప్రత్యేక పరిస్థితిని మూలంలో లేనంతగా పరిమితం చేయదు.
- source_word: תִשְׁכַּב
  choice: శయనించకూడదు
  rationale: שׁכב ఇక్కడ లైంగిక అర్థంతో వాడిన సౌమ్యోక్తి. ‘శయనించు’ మూలంలోని రూపకాన్ని నిలుపుతూ గౌరవప్రదమైన ఆధునిక బైబిలు శైలిలో సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: స్త్రీతో శయనించినట్లు
  rationale: అక్షరార్థంగా ‘స్త్రీ యొక్క శయనాలు’ అనే బహువచన నిర్మాణం స్త్రీతో లైంగిక సంభోగాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగులో సహజంగా పోలికను నిలుపుతూ ‘స్త్రీతో శయనించినట్లు’ అని ఇచ్చాం.
- source_word: תּוֹעֵבָה
  choice: హేయమైనది
  rationale: תּוֹעֵבָה బలమైన అసహ్యకరత లేదా నైతిక/ఆచారపరమైన ఘృణను వ్యక్తం చేస్తుంది. ‘హేయమైనది’ ఆ తీవ్రతను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న నిషేధిత క్రియను సూచిస్తుంది. తెలుగులో సహజమైన నిర్దేశక సర్వనామం ‘అది’.
theological_decisions:
- issue: పరిశుద్ధత నియమావళి సందర్భంలో నిషేధ స్వరూపం
  choice: మూలవాక్యం చెప్పినట్లుగా, స్త్రీతో శయనించిన విధంగా పురుషునితో శయనించడాన్ని నేరుగా నిషేధించే వాక్యంగా అనువదించబడింది.
  alternative: మూలంలో చెప్పని ఆరాధనా సంబంధమైన లేదా దోపిడీ స్వభావమున్న ప్రత్యేక సందర్భాలకు మాత్రమే నిషేధాన్ని పరిమితం చేయడం; లేదా విస్తృత సిద్ధాంతపరమైన పదజాలంతో పునర్వ్యాఖ్యానించడం.
  rationale: హీబ్రూ వచనం ఎలాంటి పరిమిత విశేషణాలు లేకుండా ‘పురుషునితో—స్త్రీ శయనాలవలె’ అని నిషేధించి, ఆ క్రియను תּוֹעֵבָה అని పేర్కొంటుంది. కాబట్టి మూలంలో లేని పరిమితులనో విస్తరణలనో చేర్చకుండా దాని ప్రత్యక్ష వాక్యరూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవాక్య శైలి. ‘శయనించు’ అనే సౌమ్యోక్తి హీబ్రూ రూపకాన్ని కాపాడుతుంది; పాదటిప్పణి దాని లైంగిక సందర్భార్థాన్ని స్పష్టం చేస్తుంది. ‘హేయమైనది’ బలమైన మూలపదాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
