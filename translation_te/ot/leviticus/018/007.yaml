id: LEV.18.7
reference: Leviticus 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: te
  text: నీ తండ్రి నగ్నత్వాన్ని, అంటే నీ తల్లి నగ్నత్వాన్ని, బయటపెట్టకూడదు.[a] ఆమె నీ తల్లి; ఆమె నగ్నత్వాన్ని బయటపెట్టకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా అక్షరార్థంగా, “నీ తండ్రి నగ్నత్వాన్ని మరియు నీ తల్లి నగ్నత్వాన్ని బయటపెట్టకూడదు.” తరువాతి మాట దీనిని తల్లిని సూచించేదిగా వివరిస్తుంది: “ఆమె నీ తల్లి.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: మానాన్ని
  rationale: లేవీయకాండము 18లో ‘మానాన్ని బయటపెట్టు’ అనేది నిషిద్ధ లైంగిక సంబంధాన్ని సూచించే స్థిరమైన సభ్యోక్తి. ‘నగ్నత్వం’ కంటే ‘మానం’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండి, మూలంలోని సభ్యోక్తిని నిలుపుతుంది.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: బయటపెట్టకూడదు
  rationale: גלה + ערוה అనే న్యాయపరమైన నిషేధ సూత్రాన్ని ప్రత్యక్ష లైంగిక వివరణగా మార్చకుండా, పదబంధంలోని రూపకాన్ని మరియు పునరుక్తిని నిలుపుతుంది.
- source_word: אָבִיךָ
  choice: నీ తండ్రి
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బంధుత్వ పదానికి ప్రత్యక్ష అనువాదం.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: అంటే నీ తల్లి మానాన్ని
  rationale: హీబ్రూలో ‘మరియు’ అని అక్షరార్థంగా ఉన్నప్పటికీ, వెంట వచ్చే ‘ఆమె నీ తల్లి’ అనే వివరణ ఆధారంగా ఇక్కడ సమన్వయ పదబంధానికి వివరణాత్మక భావాన్ని చూపిస్తుంది. అసలు నిర్మాణంలోని సందిగ్ధతను పాదసూచికలో నిలుపుతున్నాం.
- source_word: הִוא
  choice: ఆమె
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం తల్లిని సూచిస్తుంది; మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אִמְּךָ
  choice: నీ తల్లి
  rationale: మూలంలోని బంధుత్వ పదాన్ని, దాని న్యాయపరమైన స్పష్టత కోసం వచ్చిన పునరుక్తిని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీ తండ్రి మానం’ అనే పదబంధానికి అర్థం
  choice: ‘నీ తండ్రి మానాన్ని, అంటే నీ తల్లి మానాన్ని’ అనే వివరణాత్మక సంబంధంగా ప్రధాన పాఠ్యంలో చూపించాం.
  alternative: ‘నీ తండ్రి మానాన్ని, నీ తల్లి మానాన్ని’ అని సమన్వయ పదబంధంగా అక్షరార్థంగా అనువదించడం.
  rationale: ‘ఆమె నీ తల్లి’ అనే తరువాతి వాక్యం, తల్లి మానాన్ని బయటపెట్టడమే తండ్రి మానాన్ని బయటపెట్టడంగా పరిగణించబడుతున్న కుటుంబ-గౌరవ తర్కాన్ని సూచిస్తుంది. అయితే హీబ్రూ וְ సాధారణంగా ‘మరియు’ అని కూడా అర్థమవుతుంది కాబట్టి ఆ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘మానాన్ని బయటపెట్టు’ అనే సభ్యోక్తి మూలంలోని లైంగిక భావాన్ని పరోక్షంగా ఉంచుతుంది; ‘కూడదు’ నిషేధ ఆజ్ఞను సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
