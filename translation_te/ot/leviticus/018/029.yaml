revisions:
- from: ఎందుకంటే, ఈ హేయకార్యాలన్నిటిలో దేనినైనా చేసే ప్రతి వ్యక్తి—వాటిని చేసేవారు తమ ప్రజల మధ్య నుండి తొలగించబడతారు.[a]
  to: ఎందుకంటే, ఈ హేయకార్యాలన్నిటిలో దేనినైనా చేసే వారందరూ తమ ప్రజల మధ్య నుండి కొట్టివేయబడతారు.[a]
  rationale: The revision retains the source’s universal legal warning and the ambiguity of the penalty formula, while making the Telugu syntax idiomatic and aligning the footnote more closely with the Hebrew wording and the English audit trail.
