id: LEV.18.29
reference: Leviticus 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: te
  text: ఎందుకంటే, ఈ హేయకార్యాలన్నిటిలో దేనినైనా చేసే వారందరూ తమ ప్రజల మధ్య నుండి కొట్టివేయబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణశిక్ష పొందుతారు”; లేదా, “సమాజం నుండి బహిష్కరించబడతారు.” హీబ్రూలో “కొట్టివేయబడతారు” అనే పదబంధం ఉంది; తీర్పు అమలయ్యే ఖచ్చితమైన విధానాన్ని అది పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధాలకు కారణం లేదా వివరణను పరిచయం చేస్తుంది; సందర్భంలో సహజమైన కారణార్థక అనుసంధానం.
- source_word: כָּל אֲשֶׁר
  choice: ప్రతి వ్యక్తి
  rationale: అనిర్దిష్టమైనా సార్వత్రికమైన ‘ఎవరైతే/ప్రతి ఒక్కరూ’ అనే పరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה
  choice: చేసే
  rationale: హీబ్రూ క్రియ యొక్క విస్తృతమైన ‘చేయు’ అర్థాన్ని కాపాడుతుంది; ‘ఆచరించు’ లేదా ‘అపరాధం చేయు’ అని అనవసరంగా సంకుచితం చేయదు.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: ఈ హేయకార్యాలన్నిటిలో దేనినైనా
  rationale: מִן యొక్క విభాగార్థాన్ని, כֹּל యొక్క సమగ్రతను రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תּוֹעֵבוֹת
  choice: హేయకార్యాలు
  rationale: ఈ పరిశుద్ధతా ధర్మశాస్త్ర సందర్భంలో నైతికంగా, ఆచారపరంగా అసహ్యకరమైన క్రియలను గంభీరంగా తెలియజేస్తుంది; కేవలం భావోద్వేగపూరిత ‘అసహ్యాలు’ కంటే స్పష్టంగా ఉంటుంది.
- source_word: וְנִכְרְתוּ
  choice: తొలగించబడతారు
  rationale: నిఫ్అల్ రూపంలోని శిక్షా సూత్రాన్ని కర్మణి రూపంలో ఉంచుతుంది. ఖచ్చితమైన విధానాన్ని ప్రధాన వచనంలో నిర్ణయించకుండా, సమాజం మధ్యనుండి ‘cut off’ కావడాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: הַנְּפָשׁוֹת
  choice: వ్యక్తి … చేసేవారు
  rationale: נֶפֶשׁ ఇక్కడ శరీరానికి భిన్నమైన ‘ఆత్మలు’ అని కాక, వ్యక్తులను సూచిస్తుంది. ఏకవచన సార్వత్రిక వాక్యం నుండి బహువచన శిక్షా వాక్యానికి హీబ్రూలోని మార్పును తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: הָעֹשֹׂת
  choice: వాటిని చేసేవారు
  rationale: ముందు పేర్కొన్న హేయకార్యాలను చేసేవారినే భాగధేయ క్రియారూపం గుర్తిస్తుంది; పునరుక్తిని హీబ్రూ వాక్య నిర్మాణానికి అనుగుణంగా ఉంచుతుంది.
- source_word: מִקֶּרֶב עַמָּם
  choice: తమ ప్రజల మధ్య నుండి
  rationale: ఒడంబడిక సమాజపు మధ్యనుండి తొలగింపబడే భావాన్ని, ‘వారి బంధువులు’ అని సంకుచితం చేయకుండా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם అనే శిక్షా సూత్రం యొక్క అర్థం
  choice: తమ ప్రజల మధ్య నుండి తొలగించబడతారు
  alternative: మరణశిక్ష పొందుతారు; లేదా సమాజం నుండి బహిష్కరించబడతారు
  rationale: హీబ్రూ సూత్రం శిక్ష యొక్క ఖచ్చిత విధానాన్ని ఈ వచనంలో తెలుపదు. అది దేవుని ప్రత్యక్ష తీర్పా, మానవులచే అమలు చేయబడే మరణశిక్షా, లేక సమాజ బహిష్కరణా అన్నది నిర్ణయించకుండా ప్రధాన వచనం విస్తృత పదప్రయోగాన్ని నిలుపుతుంది; పాదటిప్పణి సాధ్యమైన అర్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, ధర్మశాస్త్ర వచనానికి తగిన గంభీరతను నిలిపింది. మూలంలోని ఏకవచన సార్వత్రిక సంబంధ వాక్యం నుంచి బహువచన వ్యక్తుల ప్రస్తావనకు జరిగే మార్పును డాష్ ద్వారా పఠనయోగ్యంగా ఉంచింది.
