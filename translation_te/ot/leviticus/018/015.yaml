  text: עֶרְוַ֥ת כַּלָּֽתְ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְ/ךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: te
  text: నీ కోడలి నగ్నతను వెలికితీయకూడదు[a]. ఆమె నీ కుమారుని భార్య; ఆమె నగ్నతను వెలికితీయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “నగ్నతను వెలికితీయడం.” లేవీయకాండంలో ఇది నిషిద్ధ లైంగిక సంబంధాలను సూచించే పునరావృత న్యాయపరమైన సభ్యోక్తి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: నగ్నత్వాన్ని
  rationale: లేవీయకాండము 18లో עֶרְוָה అనే పదం גלהతో కలిసి నిషిద్ధ లైంగిక సంబంధాలను సూచించే స్థిరమైన న్యాయపరమైన సభ్యోక్తిగా వస్తుంది. ‘నగ్నత్వం’ అని అనువదించడం మూలంలోని రూపకాన్ని, అధ్యాయం అంతటా ఉన్న పదసామ్యాన్ని కాపాడుతుంది.
- source_word: כַּלָּתְךָ
  choice: నీ కోడలి
  rationale: ఈ పదం రెండవ పురుష ఏకవచన ప్రత్యయంతో సంబోధితుని కోడలిని నేరుగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘నీ కోడలి’ సహజమైన బంధుత్వ ప్రయోగం.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: బయలుపరచకూడదు
  rationale: גלה పియేల్ రూపం עֶרְוָהతో కలిసి ఈ అధ్యాయంలో పునరావృతమయ్యే నిషేధ సూత్రం. ‘బయలుపరచకూడదు’ న్యాయపరమైన నిషేధాన్నీ మూలంలోని సభ్యోక్తినీ నిలుపుతుంది.
- source_word: אֵשֶׁת בִּנְךָ
  choice: నీ కుమారుని భార్య
  rationale: కోడలు ఎందుకు నిషిద్ధ బంధుత్వ పరిధిలో ఉందో వివరించే సమానాధికార వాక్యభాగం. ‘నీ కుమారుని భార్య’ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הִוא
  choice: ఆమె
  rationale: ముందు పేర్కొన్న స్త్రీని గుర్తించి వివరించే సర్వనామం. తెలుగులో ‘ఆమె నీ కుమారుని భార్య’ అనే నిర్మాణం దాని వివరణాత్మక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: עֶרְוָתָהּ
  choice: ఆమె నగ్నత్వాన్ని
  rationale: హీబ్రూలోని పునరుక్తిని, పరిశుద్ధత నియమావళి న్యాయశైలిని కాపాడేందుకు మొదటి పదబంధాన్నే పునరావృతం చేసింది.
theological_decisions:
- issue: లైంగిక నిషేధ సందర్భంలో ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే సభ్యోక్తి అనువాదం
  choice: ‘లైంగిక సంబంధం పెట్టుకోకూడదు’ అని విపులీకరించకుండా ‘నగ్నత్వాన్ని బయలుపరచకూడదు’ అనే మూల సభ్యోక్తిని నిలుపడం
  alternative: ఆమెతో లైంగిక సంబంధం పెట్టుకోకూడదు
  rationale: హీబ్రూ వచనం లేవీయకాండము 18 అంతటా స్థిరంగా కనిపించే న్యాయపరమైన సభ్యోక్తిని ఉపయోగిస్తుంది. దానిని నిలుపడం మూలభాషకు ప్రాధాన్యాన్నీ కీలక పదాల ఏకరూపతనూ కాపాడుతుంది; దాని లైంగిక భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని అనుసరించింది. ‘నీ’ అనే ఏకవచన సంబోధన మూలంలోని 2ms రూపాన్ని ప్రతిబింబిస్తుంది. మూలంలోని రెండు నిషేధ వాక్యాల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపింది.
