source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: te
  text: ఎందుకంటే, మీకు ముందు ఆ దేశంలో నివసించిన మనుషులు ఈ హేయకార్యాలన్నిటినీ చేశారు; దాంతో ఆ దేశం అపవిత్రమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ దేశం కలుషితమైంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: ఈ హేయకార్యాలన్నిటినీ
  rationale: תּוֹעֵבָה లోని తీవ్రమైన నైతిక, ఒడంబడిక సంబంధమైన అసహ్యతను ‘హేయకార్యాలు’ తెలియజేస్తుంది; ‘ఈ’ మరియు ‘అన్నిటినీ’ హీబ్రూ నిర్దేశక, సమగ్ర భావాలను నిలుపుతాయి.
- source_word: עָשׂוּ
  choice: చేశారు
  rationale: సాధారణ క్రియ అయిన עשה ను ప్రత్యేక న్యాయపరమైన అర్థం జోడించకుండా నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: ఆ దేశపు మనుషులు
  rationale: అక్షరార్థమైన ‘దేశపు మనుషులు’ అనే సమూహ సూచనను నిలుపుతూ, ముందటి నివాసులను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: మీకు ముందు ఉన్న
  rationale: వారు ఇశ్రాయేలీయులకు ముందుగా ఆ దేశంలో ఉన్నారనే కాలసంబంధ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַתִּטְמָא
  choice: దాంతో ... అపవిత్రమైంది
  rationale: చర్యల ఫలితంగా దేశం అపవిత్ర స్థితికి వచ్చిందనే భావాన్ని వ్యక్తం చేస్తుంది; అపవిత్రతను కేవలం ఆచారపరమైనదిగానో రూపకాలంకారంగానో పరిమితం చేయదు.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: సందర్భంలో ఇది భూమండలాన్ని కాక, ఇశ్రాయేలీయులకు ముందుగా ఇతరులు నివసించిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దేశపు అపవిత్రత స్వభావం
  choice: ఆ దేశం అపవిత్రమైంది
  alternative: ఆ దేశం కలుషితమైంది
  rationale: మనుషుల హేయకార్యాల వల్ల దేశం అపవిత్ర స్థితికి వచ్చిందనే హీబ్రూ భావాన్ని నిలుపుతుంది; ఈ అపవిత్రత ఆచారపరమైనదా, నైతికమైనదా, రూపకాలంకారమైనదా అనే ఉద్వేగాన్ని అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. హీబ్రూ కారణ–ఫలిత సంబంధాన్ని ‘ఎందుకంటే’ మరియు ‘దాంతో’ ద్వారా స్పష్టంగా నిలిపాం.
