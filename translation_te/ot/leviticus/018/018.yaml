review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the prohibition as taking a living wife's sister as an additional wife in a rivalry-producing arrangement. However, ‘మానం’ means honor/reputation rather than the Hebrew euphemism ‘nakedness,’ and the repeated pronouns make the referent of the woman whose nakedness is uncovered unclear.
  naturalness: The legal register is generally suitable, but ‘ఆమెకు తోడుగా’ can suggest companionship rather than addition, and the sequence ‘ఆమె సహోదరిని ... ఆమెను పెళ్లి’ is syntactically and referentially awkward. Repeating ‘ఆ సహోదరి’ resolves this naturally.
  terminology: ‘సహోదరి’ and ‘పెళ్లి చేసుకోకూడదు’ are appropriate modern-standard Telugu. ‘నగ్నతను బయలుపరచడానికి’ preserves the established Levitical euphemism more faithfully than ‘మానాన్ని బయలుపరచడానికి.’ ‘అదనంగా’ accurately conveys the relational force here.
  issues:
  - severity: medium
    issue: ‘ఆమె మానాన్ని బయలుపరచడానికి’ does not render ‘to uncover her nakedness’ accurately.
    rationale: మానం denotes honor, dignity, or reputation. The Hebrew עֶרְוָה is ‘nakedness’ and functions as a sexual euphemism in this legal context; Telugu should retain that imagery.
  - severity: medium
    issue: Pronoun references are unclear in the main text.
    rationale: The final ‘ఆమెను’ can be read as referring either to the first woman or her sister, and ‘ఆమె మానాన్ని’ has the same ambiguity. The source distinguishes the first sister, who must be living, from the second sister, whose nakedness is uncovered.
  - severity: low
    issue: ‘ఆమెకు తోడుగా’ is less precise than ‘ఆమెకు అదనంగా.’
    rationale: The Hebrew construction concerns taking the sister in addition to the first woman; ‘తోడుగా’ may merely imply accompaniment.
  revised_text: ఒక స్త్రీ జీవించి ఉండగా, ఆమె సహోదరిని ఆమెకు అదనంగా ప్రత్యర్థి భార్యగా చేసుకోవడానికి, ఆ సహోదరి నగ్నతను బయలుపరచడానికి నీవు పెళ్లి చేసుకోకూడదు.[a]
