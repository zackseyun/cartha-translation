revisions:
- from: ఒక స్త్రీ బతికుండగా, ఆమెకు తోడుగా ఆమె సహోదరిని ప్రత్యర్థి భార్యగా చేసుకోవడానికి, ఆమె మానాన్ని బయలుపరచడానికి నీవు ఆమెను పెళ్లి చేసుకోకూడదు.[a]
  to: ఒక స్త్రీ జీవించి ఉండగా, ఆమె సహోదరిని ఆమెకు అదనంగా ప్రత్యర్థి భార్యగా చేసుకోవడానికి, ఆ సహోదరి నగ్నతను బయలుపరచడానికి నీవు పెళ్లి చేసుకోకూడదు.[a]
  rationale: The revision preserves the source’s limited temporal scope—during the first sister’s lifetime—and its rivalry element, while clarifying the two women’s distinct referents. It also replaces ‘మానం’ with ‘నగ్నత,’ retaining the Hebrew legal euphemism without substituting a different concept. The footnote remains an anchored lexical/syntactic alternative and now matches the corrected terminology.
