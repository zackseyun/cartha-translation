source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: te
  text: ఒక స్త్రీ జీవించి ఉండగా, ఆమె సహోదరిని ఆమెకు అదనంగా ప్రత్యర్థి భార్యగా చేసుకోవడానికి, ఆ సహోదరి నగ్నతను బయలుపరచడానికి నీవు పెళ్లి చేసుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక స్త్రీ జీవించి ఉండగా, ఆమె సహోదరిని ఆమెకు అదనంగా తీసుకొని ఆమెకు ప్రత్యర్థిగా చేయడానికి, ఆ సహోదరి నగ్నతను బయలుపరచకూడదు.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; భావం, ఒక స్త్రీ జీవించి ఉండగా ఆమె సహోదరిని అదనపు భార్యగా తీసుకొని ఆమెకు ప్రత్యర్థిగా చేయడాన్ని నిషేధించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה ... לֹא תִקָּח
  choice: ఒక స్త్రీని ... నీవు పెళ్లి చేసుకోకూడదు
  rationale: אִשָּׁה ‘స్త్రీ’ లేదా ‘భార్య’ అని అర్థమవుతుంది; ఈ వివాహనియమ సందర్భంలో תִקָּח అనే ‘తీసుకొను’ క్రియకు సహజమైన తెలుగు భావం ‘పెళ్లి చేసుకొను.’
- source_word: אֶל אֲחֹתָהּ
  choice: ఆమెకు తోడుగా ఆమె సహోదరిని
  rationale: అక్షరార్థంగా ‘ఆమె సహోదరి వద్దకు/తోడు’; ఇక్కడ మొదటి స్త్రీకి అదనంగా ఆమె సహోదరిని భార్యగా తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: לִצְרֹר
  choice: ప్రత్యర్థి భార్యగా చేసుకోవడానికి
  rationale: צרר రూపం ఇక్కడ ఇద్దరు సహోదరీలను వైవాహిక ప్రత్యర్థులుగా నిలిపే ఫలితాన్ని సూచిస్తుంది; ‘ప్రత్యర్థి భార్య’ వివాహ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: ఆమె మానాన్ని బయలుపరచడానికి
  rationale: లేవీయకాండంలో లైంగిక సంబంధాన్ని సూచించే స్థిరమైన సభ్యోక్తిని, మూలరూపానికి దగ్గరగా మరియు తెలుగులో గౌరవప్రదంగా నిలుపుతుంది.
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: ఒక స్త్రీ బతికుండగా, ఆమెకు తోడుగా
  rationale: ‘ఆమె జీవితకాలంలో, ఆమెపై/ఆమెకు తోడుగా’ అనే సంక్షిప్త హీబ్రూ నిర్మాణం; నిషేధం మొదటి సహోదరి జీవించి ఉన్న కాలానికి సంబంధించినదని తెలుగులో స్పష్టం చేయబడింది.
theological_decisions:
- issue: బహుభార్యత్వం మరియు సహోదరీ వివాహానికి సంబంధించి నిషేధపు పరిధి
  choice: ఒక స్త్రీ జీవించి ఉండగా ఆమె సహోదరిని అదనపు, ప్రత్యర్థి భార్యగా చేసుకోవడాన్ని నిషేధిస్తుంది.
  alternative: మొదటి సహోదరి మరణించిన తర్వాత కూడా సహోదరిని వివాహం చేసుకోవడాన్ని ఈ వాక్యం నిషేధిస్తుందని విస్తరించి చదవడం.
  rationale: לִצְרֹר మరియు בְּחַיֶּיהָ కలిపి, మొదటి సహోదరి జీవించి ఉన్నప్పుడే ఏర్పడే ప్రత్యర్థిత్వంతో కూడిన అదనపు వివాహాన్ని సహజంగా సూచిస్తాయి; వాక్యం చెప్పిన దానికంటే నిషేధాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో సహజమైన ‘పెళ్లి చేసుకోకూడదు’ వాడబడింది. ‘మానాన్ని బయలుపరచడం’ అనే సభ్యోక్తి మూలంలోని భావచిత్రాన్ని నిలుపుతుంది; సహోదరి అనే పదం సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
