id: LEV.18.10
reference: Leviticus 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: te
  text: నీ కుమారుని కుమార్తె నగ్నత్వాన్నిగానీ, నీ కుమార్తె కుమార్తె నగ్నత్వాన్నిగానీ నీవు బయలుపరచకూడదు.[a] ఎందుకంటే వారు నీ నగ్నత్వమే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత భావానువాదంగా: ‘నీ కుమారుని కుమార్తెతోగానీ, నీ కుమార్తె కుమార్తెతోగానీ నీవు లైంగిక సంబంధం పెట్టుకోకూడదు.’ హీబ్రూ సభ్యోక్తి అక్షరార్థంగా ‘నగ్నత్వాన్ని బయలుపరచడం.’'
    reason: lexical_alternative
  - marker: b
    text: ‘వారు నీ నగ్నత్వమే’ అనే మాట, ఈ దగ్గరి సంతానం ఒక వ్యక్తి సొంత కుటుంబ శరీరానికి విస్తరణగా పరిగణించబడుతుందని, అందువల్ల వారితో లైంగిక సంబంధం నిషిద్ధమని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: నగ్నత్వం
  rationale: లేవీయకాండము 18లోని స్థిరమైన న్యాయపరమైన సభ్యోక్తిని, అలాగే చివరి కారణవాక్యంలోని కుటుంబ-ఏకత్వ భావాన్ని ఒకే పదంతో నిలుపుతుంది.
- source_word: בַּת בִּנְךָ
  choice: నీ కుమారుని కుమార్తె
  rationale: హీబ్రూ బంధుత్వ నిర్మాణాన్నీ, కుమారుని వంశమార్గాన్ని సూచించే న్యాయపరమైన కచ్చితత్వాన్నీ కాపాడుతుంది.
- source_word: בַת בִּתְּךָ
  choice: నీ కుమార్తె కుమార్తె
  rationale: హీబ్రూ నిర్మాణాన్ని సన్నిహితంగా అనుసరిస్తూ కుమార్తె వంశమార్గాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא תְגַלֶּה
  choice: నీవు బయలుపరచకూడదు
  rationale: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే అధ్యాయం అంతటా పునరావృతమయ్యే న్యాయపరమైన సభ్యోక్తిని కాపాడుతుంది; భావం నిషేధిత లైంగిక సంబంధమే అయినా దానిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా మార్చదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: హీబ్రూ సంధానపదంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵנָּה
  choice: వారు
  rationale: స్త్రీలింగ బహువచన సర్వనామం ముందున్న ఇద్దరు మనుమరాళ్లను సూచిస్తుంది; తెలుగులో సహజమైన బహువచన సూచన.
theological_decisions:
- issue: כִּי עֶרְוָתְךָ הֵנָּה అనే చివరి కారణవాక్య భావం
  choice: ఎందుకంటే వారు నీ నగ్నత్వమే
  alternative: ఎందుకంటే వారి నగ్నత్వం నీ సొంత నగ్నత్వం వంటిది
  rationale: హీబ్రూలో ఉన్న ‘వారు నీ నగ్నత్వం’ అనే ప్రత్యక్ష విధేయ నిర్మాణాన్ని నిలుపుతూ, దగ్గరి సంతానం తన కుటుంబ అస్తిత్వానికి విస్తరణగా పరిగణించబడే భావాన్ని వ్యాఖ్యానంతో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే మూలభాషా సభ్యోక్తిని నిలిపి, దాని లైంగిక భావాన్ని పాదసూచికలో స్పష్టం చేసింది. రెండు బంధుత్వ మార్గాలూ సమాంతరంగా, కచ్చితంగా ఇవ్వబడ్డాయి.
