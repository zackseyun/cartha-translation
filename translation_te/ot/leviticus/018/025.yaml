  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: te
  text: అప్పుడు దేశం అపవిత్రమైంది[a]. దాని దోషానికి నేను దానిని శిక్షించాను[b]; దేశం తన నివాసులను కక్కివేసింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కలుషితమైంది.’ హీబ్రూ క్రియను ‘అపవిత్రమైంది’ లేదా ‘కలుషితమైంది’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దాని దోషాన్ని దానిమీద సందర్శించాను.’ ఇది దోషాన్ని తీర్పులో లెక్కకు తీసుకొని దానిపై శిక్షను అమలు చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘కక్కివేసింది’ హీబ్రూలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది; అపవిత్రత కారణంగా దేశం తన నివాసులను బలంగా వెలివేసినట్లు ఇది చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: అపవిత్రమైంది
  rationale: טמא ఇక్కడ ఆ దేశం ఆచారపరంగా, నైతికంగా అపవిత్ర స్థితికి చేరిన ఫలితాన్ని సూచిస్తుంది. ‘అపవిత్రమైంది’ ఆధునిక తెలుగులో సహజంగా ఉండి, క్రియలోని ఫలితార్థాన్ని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో אֶרֶץ భూమి మొత్తాన్ని కాక కనాను దేశాన్ని సూచిస్తుంది. అందువల్ల ‘దేశం’ సందర్భానికి తగినది.
- source_word: וָאֶפְקֹד
  choice: శిక్షించాను
  rationale: פקד అనే క్రియకు ‘పరిశీలించు, లెక్క అడుగు, శిక్షించు’ వంటి విస్తృత అర్థాలున్నాయి. עוןతో కలిసి ఇక్కడ దోషాన్ని తీర్పులో లెక్కకు తీసుకొని శిక్షించడాన్ని సూచిస్తుంది.
- source_word: עֲוֺנָהּ
  choice: దాని దోషం
  rationale: עון పాపకార్యం, దోషం, అపరాధభారం లేదా దాని పరిణామాన్ని సూచించగలదు. ‘దోషం’ ఈ అర్థవిస్తృతిలోని నైతిక భారాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עָלֶיהָ
  choice: దాన్ని
  rationale: פקד עון על అనే హీబ్రూ ప్రయోగాన్ని పదక్షరంగా అనుసరిస్తే తెలుగులో అసహజంగా ఉంటుంది. ‘దాని దోషాన్నిబట్టి దాన్ని శిక్షించాను’ అనడం దోషం దేశంపైనే విచారణకు వచ్చిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתָּקִא
  choice: కక్కివేసింది
  rationale: קיא అంటే అక్షరార్థంగా ‘వాంతి చేయడం/కక్కివేయడం.’ దేశం తన నివాసులను బలంగా వెలివేసినట్లు చూపే సజీవ రూపకాన్ని ‘కక్కివేసింది’ నిలుపుతుంది.
- source_word: יֹשְׁבֶיהָ
  choice: తన నివాసులు
  rationale: ישב నుంచి వచ్చిన ఈ రూపం దేశంలో నివసించేవారిని సమూహంగా సూచిస్తుంది. ‘తన నివాసులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: దేశం అపవిత్రతకు స్పందిస్తున్నట్లుగా వ్యక్తీకరించడం
  choice: దేశం తన నివాసులను ‘కక్కివేసింది’ అనే స్పష్టమైన రూపకాన్ని నిలుపడం.
  alternative: దేశం తన నివాసులను వెలివేసింది.
  rationale: మూల హీబ్రూ దేశాన్ని వ్యక్తీకరిస్తూ పాపం, అపవిత్రత, దేవుని తీర్పు, దేశం నుంచి వెలివేత మధ్యనున్న సంబంధాన్ని సజీవంగా చూపుతుంది. దాన్ని మృదువైన సాధారణ పదంతో మార్చడం ఆ ఉద్దేశపూర్వక చిత్రాన్ని బలహీనపరుస్తుంది.
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָలో దేవుని తీర్పు
  choice: ‘నేను దాని దోషాన్నిబట్టి దాన్ని శిక్షించాను’ అని దేవుని ప్రత్యక్ష చర్యగా అనువదించడం.
  alternative: నేను దాని దోషాన్ని దానిమీద విచారించాను.
  rationale: ఈ హీబ్రూ ప్రయోగం దోషాన్ని తీర్పులో లెక్కకు తీసుకోవడాన్ని సూచిస్తుంది. ‘శిక్షించాను’ దేవుని చర్యను, తీర్పు తీవ్రతను స్పష్టం చేస్తుంది; పాదటిప్పణి పదక్షర రూపాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. ‘అపవిత్రమైంది,’ ‘దోషం,’ ‘శిక్షించాను’ వంటి పదాలు ధార్మిక-నైతిక సందర్భాన్ని నిలుపుతాయి. ‘కక్కివేసింది’ కొద్దిగా కఠినంగా వినిపించినా, మూలంలోని ఉద్దేశపూర్వకమైన సజీవ రూపకాన్ని కాపాడేందుకు ఉంచబడింది.
