  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: te
  text: నీ తండ్రి సోదరుని నగ్నత్వాన్ని బయటపెట్టకూడదు; అతని భార్యను సమీపించకూడదు.[a] ఆమె నీ తండ్రి సోదరుని భార్య.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “సమీపించు”; సన్నిహిత బంధుత్వాలకు సంబంధించిన ఈ నిషేధ సూత్రంలో ఈ క్రియకు లైంగిక భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: నగ్నత్వాన్ని
  rationale: లేవీయకాండము 18లో ఇది నిషిద్ధ లైంగిక సంబంధాన్ని సూచించే స్థిర న్యాయపరమైన ప్రయోగంలో భాగం. దాని భావాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా, మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: אֲחִי אָבִיךָ
  choice: నీ తండ్రి సోదరుని
  rationale: మూలంలోని బంధుత్వ నిర్మాణాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మేనమామ’ అనే పదంలో ఉండగల ప్రాంతీయ లేదా బంధుత్వ అస్పష్టతను నివారిస్తుంది.
- source_word: תְגַלֶּה
  choice: బయటపెట్టకూడదు
  rationale: గלה పియేల్ రూపం ఇక్కడ ‘నగ్నత్వాన్ని బయటపెట్టు’ అనే అధ్యాయమంతటా కనిపించే న్యాయపరమైన ప్రయోగం. నిషేధ స్వరాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: అతని భార్యను సమీపించకూడదు
  rationale: קרב అనే నియంత్రిత, సభ్యోక్తిపూర్వక క్రియను ‘సమీపించు’గా నిలిపి, ఈ సందర్భంలో దానికి ఉన్న లైంగిక భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: דֹּדָתְךָ
  choice: నీ మేనత్త
  rationale: ఇక్కడ పదం తండ్రి సోదరుని భార్యను, అంటే వివాహబంధం ద్వారా ఏర్పడిన aunt సంబంధాన్ని సూచిస్తుంది. ముందు వాక్యభాగం ఖచ్చితమైన బంధుత్వాన్ని ఇప్పటికే వివరిస్తుంది.
- source_word: הִוא
  choice: ఆమె
  rationale: హీబ్రూలోని సరళ విధేయ వాక్యాన్ని ‘ఆమె నీ మేనత్త’గా నేరుగా అందిస్తుంది; మూలంలో లేని ‘ఎందుకంటే’ వంటి కారణార్థక అనుసంధానాన్ని చేర్చదు.
theological_decisions:
- issue: ‘నగ్నత్వాన్ని బయటపెట్టు’ అనే రక్తసంబంధ నిషేధ సూత్రాన్ని అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘నగ్నత్వాన్ని బయటపెట్టకూడదు’ అనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘లైంగిక సంబంధం పెట్టుకోకూడదు’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: అధ్యాయంలో పునరావృతమయ్యే స్థిర న్యాయ సూత్రం కనిపించేలా ఉంచుతూ, దాని లైంగిక భావాన్ని సందర్భం తెలియజేయనిస్తుంది.
- issue: చివరి బంధుత్వ గుర్తింపు
  choice: ‘ఆమె నీ మేనత్త’
  alternative: ‘ఆమె నీ తండ్రి సోదరుని భార్య’ అని మళ్లీ పూర్తిగా చెప్పడం
  rationale: మూలం చివర సాధారణ బంధుత్వ పదాన్నే ఉపయోగిస్తుంది; ముందటి వాక్యభాగం సంబంధాన్ని ఖచ్చితంగా తెలిపినందున సంక్షిప్త రూపమే తగినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయపరమైన శైలి. ‘నీ’ ఏకవచన సంబోధన మూలంలోని రెండవ పురుష ఏకవచనాన్ని ప్రతిబింబిస్తుంది. మూలంలోని సభ్యోక్తులను ప్రధాన పాఠ్యంలో నిలిపి, అవసరమైన భావస్పష్టతను పాదసూచికలో ఇచ్చాం.
