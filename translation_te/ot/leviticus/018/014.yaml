review_pass:
  verdict: revise
  source_fidelity: The two prohibitions and their sequence are represented faithfully, and the restrained sexual euphemism in ‘సమీపించకూడదు’ appropriately reflects Hebrew תִקְרָב. However, ‘మేనత్త’ normally denotes a maternal aunt in standard Telugu and does not identify the wife of one’s father’s brother, the referent specified by the Hebrew context.
  naturalness: The legal register is clear and modern. ‘నీ తండ్రి సోదరుని భార్య’ is somewhat more explicit than the final Hebrew kinship term, but is the safest natural Telugu wording because Telugu does not have one unambiguous everyday kinship term for this relationship across older/younger paternal uncles.
  terminology: ‘నగ్నత్వాన్ని బయటపెట్టకూడదు’ retains the chapter’s legal idiom, and ‘సమీపించకూడదు’ retains the source’s euphemistic verb. The footnote should not call this solely a ‘రక్తసంబంధ’ prohibition, since the expressly named woman is related by marriage; ‘సన్నిహిత బంధుత్వ’ is accurate and broader.
  issues:
  - severity: medium
    issue: ‘మేనత్త’ is an inaccurate kinship term here.
    rationale: In modern standard Telugu, మేనత్త commonly means one’s mother’s sister. Hebrew דֹּדָתְךָ in this verse denotes the wife of the father’s brother, as the immediately preceding clause establishes.
  - severity: low
    issue: The footnote’s phrase ‘రక్తసంబంధ నిషేధ’ is too narrow.
    rationale: The verse concerns the wife of a paternal uncle, an affinal relationship. The note should describe the wider close-kin/incest-law setting without misclassifying the relationship.
