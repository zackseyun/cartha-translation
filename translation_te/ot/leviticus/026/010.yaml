translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘పంట’ అనేది సందర్భం సూచించే నిల్వ ఉత్పత్తిని తెలియజేస్తుంది; ‘ధాన్యం’ అని అతిగా నిర్దిష్టం చేయలేదు. ప్రధాన పాఠంలో ఉద్దేశార్థక సహజీకరణను ఇచ్చి, హెబ్రీ మూలంలోని సంక్షిప్త కారణ/స్థానచలన నిర్మాణాన్ని పాదటిప్పణిలో నిలిపాం.
