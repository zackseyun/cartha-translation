source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְ/יָשָׁ֕ן מִ/פְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: te
  text: మీరు ఎంతోకాలంగా నిల్వ ఉంచిన పాత పంటను తింటారు; కొత్త పంటకు చోటు కల్పించడానికి పాతదాన్ని బయటికి తీస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదబద్ధంగా: “మీరు ఎంతోకాలంగా నిల్వ ఉన్న పాతదాన్ని తింటారు; కొత్తదాని కారణంగా పాతదాన్ని బయటికి తీస్తారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: మీరు ... తింటారు
  rationale: ఒడంబడిక ఆశీర్వాదాల వరుసలో వావ్‌తో కూడిన సంపూర్ణ క్రియ భవిష్యత్తు వాగ్దానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సాధారణ భవిష్యత్ రూపం సహజంగా ఉంది.
- source_word: יָשָׁן נוֹשָׁן
  choice: ఎంతోకాలంగా నిల్వ ఉంచిన పాత పంటను
  rationale: יָשָׁן ఇక్కడ నామవాచకార్థంలో గత పంటకాలపు నిల్వ ఆహారాన్ని సూచిస్తుంది; נוֹשָׁן దాని దీర్ఘకాల నిల్వను బలపరుస్తుంది. ‘పంట’ సందర్భాన్ని స్పష్టం చేస్తుంది, కాని ధాన్యానికే పరిమితం చేయదు.
- source_word: וְיָשָׁן
  choice: పాతదాన్ని
  rationale: ముందు ప్రస్తావించిన పాత నిల్వ పంటను సంక్షిప్తంగా తిరిగి సూచించే నామవాచకార్థ విశేషణంగా అనువదించబడింది.
- source_word: מִפְּנֵי חָדָשׁ
  choice: కొత్త పంటకు చోటు కల్పించడానికి
  rationale: పదబద్ధంగా ‘కొత్తదాని కారణంగా/సమక్షం నుండి’ అనే భావం ఉన్నప్పటికీ, సందర్భంలో కొత్త పంట రావడంతో పాత నిల్వను తొలగించే స్థానచలన భావం ఉంది. సహజ తెలుగులో దాని ఆచరణాత్మక ఉద్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: תּוֹצִיאוּ
  choice: బయటికి తీస్తారు
  rationale: יצא హిఫీల్ రూపపు ప్రాథమిక భావమైన ‘బయటికి రప్పించడం/తీయడం’ను నేరుగా నిలుపుతుంది; పాత నిల్వను తొలగించే సందర్భార్థం వాక్యంలో స్పష్టమవుతుంది.
