id: LEV.26.4
reference: Leviticus 26:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: te
  text: అప్పుడు నేను మీకు తగిన కాలంలో వర్షాలు కురిపిస్తాను[a]; భూమి తన దిగుబడిని ఇస్తుంది, పొలంలోని చెట్లు తమ ఫలాలను ఇస్తాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటి సరైన సమయంలో’ లేదా ‘కాలానుగుణంగా.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘పొలంలోని చెట్టు’ ఏకవచనంలో ఉన్నా, అది పొలాల్లోని చెట్లన్నిటినీ సమూహార్థంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: నేను ... కురిపిస్తాను
  rationale: మూలంలోని נתן సాధారణంగా ‘ఇవ్వడం’ అని అర్థం. అయితే వర్షం విషయంలో ఆధునిక తెలుగులో ‘వర్షాలు కురిపిస్తాను’ అనేది సహజమైన ప్రయోగం; దేవుడే వాటిని అనుగ్రహిస్తున్నాడనే భావం నిలిచివుంటుంది.
- source_word: גִשְׁמֵיכֶם
  choice: మీకు ... వర్షాలు
  rationale: బహువచనమైన ‘వర్షాలు’ను నిలిపి, ద్వితీయ పురుష బహువచన ప్రత్యయాన్ని తెలుగులో సహజంగా ‘మీకు’ అని వ్యక్తం చేసింది; ఇవి ఇశ్రాయేలు ప్రయోజనార్థం ఇచ్చే కాలానుగుణ వర్షాలు.
- source_word: בְּעִתָּם
  choice: తగిన కాలంలో
  rationale: ఈ పదబంధం వర్షాలు రావలసిన సరైన సమయాన్ని సూచిస్తుంది. ‘తగిన కాలంలో’ సహజమైన ఆధునిక తెలుగు; సమయోచితతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: భూమి ... ఇస్తుంది
  rationale: మూలంలోని ‘ఇస్తుంది’ అనే క్రియను నిలిపి, వ్యవసాయ సందర్భంలో భూమి దిగుబడిని ప్రసాదిస్తుందనే చిత్రాన్ని కాపాడింది.
- source_word: יְבוּלָהּ
  choice: తన పంటను
  rationale: יְבוּל అనేది భూమి ఇచ్చే పంట లేదా దిగుబడిని సూచిస్తుంది. ‘పంట’ సాధారణ పాఠకులకు స్పష్టమైన, వ్యవసాయ సందర్భానికి తగిన పదం.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: పొలంలోని చెట్టు
  rationale: హీబ్రూలో ఉన్న ఏకవచన సమూహార్థక రూపాన్ని తెలుగులోనూ సాధారణ జాతిని సూచించే ఏకవచనంగా నిలిపింది.
- source_word: יִתֵּן פִּרְיוֹ
  choice: తన ఫలాన్ని ఇస్తుంది
  rationale: נתן క్రియ పునరావృతాన్ని ‘ఇస్తుంది’తో నిలిపి, ఏకవచన ‘చెట్టు’తో ‘తన ఫలాన్ని’ అనుసంధానించింది.
theological_decisions:
- issue: విధేయతతో ముడిపడిన నిబంధన ఆశీర్వాదంగా వర్షం మరియు వ్యవసాయ సమృద్ధి
  choice: వర్షం, పంట, ఫలం గురించిన దైవిక వాగ్దానాన్ని దాని ప్రత్యక్ష వ్యవసాయార్థంలో అనువదించడం
  alternative: దీనిని సర్వకాలిక భౌతిక ఐశ్వర్య వాగ్దానంగా విస్తరించడం లేదా పూర్తిగా ఆధ్యాత్మిక రూపకంగా మార్చడం
  rationale: లేవీయకాండం 26 సందర్భంలో ఇది నిబంధన ఆశీర్వాదంగా చెప్పబడిన స్పష్టమైన వ్యవసాయ సమృద్ధి. అనువాదం ఆ నిర్దిష్ట భావాన్ని నిలిపి, తరువాతి సిద్ధాంతపరమైన అన్వయాలను వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వర్షం విషయంలో అక్షరార్థమైన ‘ఇస్తాను’కు బదులుగా సహజ తెలుగు ప్రయోగమైన ‘కురిపిస్తాను’ వాడబడింది; భూమి, చెట్టు విషయంలో మూలంలోని ‘ఇవ్వడం’ అనే క్రియ పునరావృతం నిలిపబడింది. హీబ్రూ ఏకవచన సమూహార్థక రూపం ప్రధాన పాఠ్యంలో కాపాడబడి, పాదటిప్పణిలో వివరించబడింది.
