id: LEV.26.27
reference: Leviticus 26:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: te
  text: అయితే, ఇవన్నీ జరిగినప్పటికీ మీరు నా మాట వినక, నాకు విరోధంగా నడుచుకుంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే, … చేస్తే
  rationale: ముందటి నిబంధన హెచ్చరికల కొనసాగింపులో మరొక షరతును, అలాగే భావంలోని వ్యతిరేక మలుపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּזֹאת
  choice: ఇంత జరిగినా
  rationale: ఇది ముందుగా జరిగిన శిక్షణాత్మక చర్యలను వెనక్కి సూచిస్తూ ‘ఇవన్నీ జరిగినప్పటికీ’ అనే concessive భావాన్ని ఇస్తుంది; కేవలం ‘ఇందులో’ అనే అర్థం కాదు.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: మీరు నా మాట వినకుండా
  rationale: שׁמע అనే క్రియలో వినడంతోపాటు దానికి లోబడే స్పందన కూడా సూచితం. ‘నా మాట వినడం’ అనే తెలుగు ప్రయోగం శ్రవణ రూపకాన్ని, విధేయత భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וַהֲלַכְתֶּם
  choice: ప్రవర్తిస్తే
  rationale: הלך ఇక్కడ అక్షరార్థంగా నడవడాన్ని కాక జీవనవిధానాన్ని లేదా ప్రవర్తనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రవర్తించడం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עִמִּי
  choice: నాకు
  rationale: అక్షరార్థం ‘నాతో’; అయితే הלך మరియు בְּקֶרִי కలిసిన మొత్తం ప్రయోగంలో దేవునిపట్ల సంబంధాత్మక వ్యతిరేకతను సూచిస్తుంది. అందువల్ల తెలుగులో ‘నాకు విరోధంగా’ అని సమగ్రంగా అనువదించబడింది.
- source_word: בְּקֶרִי
  choice: విరోధంగా
  rationale: קֶרִי అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. లేవీయకాండము 26లో ఇది ప్రతికూలత, విరోధం లేదా శత్రుత్వపూరిత వైఖరిని సూచిస్తుంది; ‘విరోధంగా’ అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: లేవీయకాండము 26లోని నిబంధన హెచ్చరిక ప్రయోగం
  choice: ‘నాకు విరోధంగా ప్రవర్తిస్తే’ అనే సంబంధాత్మక విరోధ భావాన్ని నిలుపుకోవడం
  alternative: ‘నాకు విధేయులుగా ఉండకపోతే’
  rationale: వాక్యం కేవలం ఆజ్ఞాపాలన లోపాన్ని మాత్రమే కాక, దేవునితో నిబంధన సంబంధంలో ఒక వ్యతిరేక వైఖరిని కూడా వివరిస్తుంది. ‘విరోధంగా’ అనే పదం ఆ ఉద్రిక్తతను సరళమైన అవిధేయతగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే నిబంధన హెచ్చరికకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ‘నడవడం’ అనే ప్రయోగాన్ని ప్రధాన వాక్యంలో సహజమైన ‘ప్రవర్తించడం’గా ఇచ్చి, అక్షర రూపాన్ని పాదటిప్పణిలో నిలిపాం.
