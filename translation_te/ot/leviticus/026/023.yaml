source:
  edition: WLC
  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: te
  text: ఈ శిక్షల ద్వారా కూడా మీరు నా దిద్దుబాటును అంగీకరించకుండా, నాకు విరోధంగా నడుచుకుంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: ఈ శిక్షల ద్వారా
  rationale: בְּ ఇక్కడ సాధనార్థకంగా ఉండి, ముందుగా వివరించిన తీర్పులు లేదా శిక్షలను సూచిస్తుంది. సందర్భాన్ని స్పష్టంగా కలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: תִוָּסְרוּ
  choice: దిద్దుబాటును అంగీకరించకుండా
  rationale: יסר నిఫాల్ రూపం శిక్ష లేదా క్రమశిక్షణ ద్వారా దిద్దబడటాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘దిద్దబడకపోతే’ అనడం చర్య జరగలేదనే భావాన్ని ఇవ్వవచ్చు; ఇక్కడ జరిగిన శిక్షకు వారు లొంగకపోవడమే ఉద్దేశం.
- source_word: לִי
  choice: నా దిద్దుబాటును
  rationale: ఈ దాతువు దేవునితో సంబంధించి లేదా ఆయనచేత కలిగిన దిద్దుబాటును సూచిస్తుంది. సహజమైన తెలుగులో దానిని ‘నా దిద్దుబాటు’గా క్రియతో కలిపి వ్యక్తం చేశాం.
- source_word: וַהֲלַכְתֶּם
  choice: నడుచుకుంటే
  rationale: ఇది షరతును కొనసాగిస్తూ వారి ప్రవర్తనను తెలియజేస్తుంది. తెలుగు షరతు వాక్య నిర్మాణంలో ‘నడుచుకుంటే’ సహజంగా ఉంటుంది.
- source_word: עִמִּי קֶרִי
  choice: నాకు విరోధంగా
  rationale: ‘నాతో’ అనే ఉపసర్గతో కֶרִי అనే విరోధం/ప్రతికూలతను సూచించే నామవాచకం కలిసిన హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు రూపం; దేవునితో సంబంధంలో ప్రతిఘటనను నిలుపుతుంది.
theological_decisions:
- issue: ఒడంబడిక సంబంధంలోని עִמִּי קֶרִי నుడికారం
  choice: నాకు విరోధంగా నడుచుకుంటే
  alternative: నాతో విరోధభావంతో నడుచుకుంటే
  rationale: ఎంచుకున్న రూపం హీబ్రూ నుడికారంలోని దేవునిపట్ల ప్రతికూల వైఖరిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ప్రత్యామ్నాయం ‘నాతో’ అనే రూపాన్ని మరింత అక్షరార్థంగా నిలుపుతుంది గాని తెలుగులో కొంచెం బరువుగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగే షరతు ఉపవాక్యంగా ఉంచబడింది.
