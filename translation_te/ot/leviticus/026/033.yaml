source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: te
  text: నేను మిమ్మల్ని దేశాల మధ్య చెదరగొట్టి, మీ వెనుక కత్తిని ఒరనుండి తీస్తాను; మీ దేశం పాడైపోతుంది, మీ పట్టణాలు శిథిలాలవుతాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱזָרֶה
  choice: చెదరగొట్టి
  rationale: హిఫిల్ రూపంలోని זרה ఇక్కడ ప్రజలను వివిధ జనాల మధ్యకు చెదరగొట్టడం లేదా విస్తరింపజేయడం అనే భావాన్ని ఇస్తుంది. ‘చెదరగొట్టు’ ఆధునిక తెలుగులో సహజంగా ఉండి తీర్పు సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בַגּוֹיִם
  choice: జనాల మధ్య
  rationale: גּוֹיִם అంటే జనాలు లేదా దేశజనాలు. ఇక్కడ విదేశీ ప్రజల మధ్య చెదరిపోవడమే భావం; ‘అన్యజనులు’ అనడం అవసరం లేని తరువాతి మతపరమైన ఛాయను తెచ్చే అవకాశం ఉంది.
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: కత్తిని దూస్తాను
  rationale: ריק + חֶרֶב అనే ప్రయోగం కత్తిని ఒరనుండి తీయడం, దాడికి సిద్ధం చేయడం అనే అర్థాన్ని ఇస్తుంది. ‘కత్తిని దూస్తాను’ తెలుగులో సజీవమైన యుద్ధచిత్రాన్ని అందిస్తూ వెంబడించే దాడి భావాన్ని తెలియజేస్తుంది.
- source_word: אַחֲרֵיכֶם
  choice: మీ వెనుక
  rationale: అక్షరార్థంగా ‘మీ తరువాత/వెనుక’. సందర్భంలో వెంబడింపు భావం ఉన్నప్పటికీ, ‘మీ వెనుక’ మూలంలోని స్థలసంబంధ భాషను నిలుపుతుంది.
- source_word: שְׁמָמָה
  choice: పాడైపోతుంది
  rationale: ఈ నామవాచకం నిర్జనత, విధ్వంసం అనే స్థితిని సూచిస్తుంది. తెలుగులో ‘పాడైపోతుంది’ ఆ ఫలితస్థితిని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָרְבָּה
  choice: శిథిలాలవుతాయి
  rationale: ఈ పదం ధ్వంసమైన లేదా పాడైన స్థితిని సూచిస్తుంది. పట్టణాలకు సంబంధించి ‘శిథిలాలవుతాయి’ సహజమైన, గంభీరమైన సమానార్థకం.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: పాడైపోతుంది ... శిథిలాలవుతాయి
  rationale: היה రూపాలు ఇక్కడ ఒక కొత్త విధ్వంస స్థితిలోకి మారడాన్ని సూచిస్తాయి. తెలుగు క్రియారూపాలు ఆ పరిణామాత్మక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: నిబంధనాత్మక తీర్పులో చెదరగొట్టడం మరియు సైనిక వెంబడింపుకు దేవుని ప్రత్యక్ష కర్తృత్వం
  choice: ‘నేను ... చెదరగొట్టి ... కత్తిని దూస్తాను’ అని ప్రత్యక్ష ప్రథమ పురుష కర్తృత్వాన్ని నిలుపడం
  alternative: దేవుని కర్తృత్వాన్ని మృదువుచేసే కర్మణి లేదా పరోక్ష నిర్మాణం
  rationale: హీబ్రూ వాక్యం ఈ చర్యలను దేవునికే ప్రత్యక్షంగా ఆపాదిస్తుంది. ఆ ధార్మిక ఉద్వేగాన్ని తగ్గించకుండా అనువాదంలో నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన నిబంధన-తీర్పు స్వరం. మూలంలోని వరుస దైవిక చర్యలను సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపి, దేశం మరియు పట్టణాల విధ్వంసాన్ని స్పష్టంగా వ్యక్తం చేసింది.
