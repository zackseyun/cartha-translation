  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: te
  text: నేను మీ వైపు తిరిగి[a], మిమ్మల్ని ఫలవంతులుగా చేసి, మీ సంఖ్యను పెంచుతాను; నా నిబంధనను మీతో స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని అనుగ్రహంతో చూస్తాను.’ హెబ్రీలో అక్షరార్థంగా ‘మీ వైపు తిరుగుతాను’ అని ఉంది; ఈ సందర్భంలో అది దేవుని అనుకూల దృష్టిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: నేను మీవైపు తిరిగి
  rationale: פנה యొక్క ‘తిరుగు’ అనే స్పష్టమైన దృశ్యభావాన్ని నిలుపుతుంది; ఆశీర్వాద సందర్భం దేవుని అనుకూల దృష్టిని సూచించినా, దానిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా విస్తరించదు.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: మిమ్మల్ని ఫలవంతులుగా చేసి
  rationale: פרה హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఫలవంతతకు సంబంధించిన నిబంధనా ఆశీర్వాద భాషను కాపాడుతుంది.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: మిమ్మల్ని విస్తరింపజేస్తాను
  rationale: רבה హిఫీల్‌లో ప్రజలను అధికం చేయడం లేదా విస్తరింపజేయడం అనే భావం ఉంది; ఇది కేవలం వ్యక్తిగత సంతానోత్పత్తికే పరిమితం కాకుండా జనసంఖ్య పెరుగుదలను తెలియజేస్తుంది.
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי
  choice: నా నిబంధనను స్థిరపరుస్తాను
  rationale: నిబంధనతో కూడిన קום హిఫీల్ రూపం స్థాపించడం, ధృవపరచడం లేదా నిలబెట్టడం అనే భావాన్ని కలిగి ఉంది; ‘స్థిరపరుస్తాను’ ముందే ఉన్న నిబంధనను అమలులో నిలిపే సాధ్యమైన భావాన్నీ కాపాడుతుంది.
- source_word: אִתְּכֶם
  choice: మీతో
  rationale: నిబంధనా సంబంధాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: దేవుడు ప్రజలవైపు తిరగడం అనుకూల దృష్టి అని ప్రధాన పాఠ్యంలో స్పష్టీకరించాలా
  choice: ‘నేను మీవైపు తిరిగి’ అనే మూల దృశ్యాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నేను మిమ్మల్ని అనుగ్రహంతో చూస్తాను’
  rationale: సందర్భంలో అనుగ్రహ భావం స్పష్టంగా ఉన్నప్పటికీ, హెబ్రీ పదం సాధారణంగా ‘తిరుగు’ అని చెబుతుంది. మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ, సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: ఫలవంతత మరియు విస్తరణ అనే నిబంధనా ఆశీర్వాద సూత్రాన్ని ఎలా అందించాలి
  choice: ‘మిమ్మల్ని ఫలవంతులుగా చేసి, మిమ్మల్ని విస్తరింపజేస్తాను’
  alternative: ‘మీకు విస్తారమైన సంతానాన్ని కలిగించి, మీ సంఖ్యను పెంచుతాను’
  rationale: ఎంచుకున్న రూపం పంచగ్రంథంలోని పునరావృత ఆశీర్వాద భాషను కాపాడుతుంది; ప్రత్యామ్నాయం భావాన్ని స్పష్టీకరించినా మూలంలోని జతపదాల విస్తృతిని కుదిస్తుంది.
- issue: నిబంధనతో వַהֲקִימֹתִי యొక్క భావం
  choice: ‘నా నిబంధనను స్థిరపరుస్తాను’
  alternative: ‘నా నిబంధనను స్థాపిస్తాను’
  rationale: ఈ సందర్భంలో దేవుడు ఇశ్రాయేలుతో ఇప్పటికే చేసిన నిబంధనను ఆశీర్వాదాల ద్వారా నిలబెట్టడం లేదా ధృవపరచడం అనే భావం సాధ్యమైనది. ‘స్థిరపరుస్తాను’ స్థాపన, ధృవీకరణ మధ్య ఉన్న అర్థవిస్తృతిని బాగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఫలవంతులు,’ ‘నిబంధన’ వంటి కీలక బైబిలు పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
