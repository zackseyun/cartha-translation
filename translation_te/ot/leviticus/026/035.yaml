- from: అది పాడుగా ఉన్న రోజులన్నిటిలో విశ్రమిస్తుంది—మీరు దానిమీద నివసించినప్పుడు, మీ విశ్రాంతి సంవత్సరాల్లో[a] అది పొందని విశ్రాంతిని అప్పుడు పొందుతుంది.[b]
