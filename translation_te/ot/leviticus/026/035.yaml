review_pass:
  verdict: revise
  source_fidelity: The draft conveys the land’s desolate period, its rest, and Israel’s prior residence on it. However, “విశ్రాంతి సంవత్సరాల్లో” narrows the Hebrew “your Sabbaths” in the main text. The surrounding context strongly points to land-sabbath rests, but the Hebrew wording itself should remain visible in the translation and the contextual specification should be retained in a note.
  naturalness: “అది పాడుగా ఉన్న రోజులన్నిటిలో” is understandable but less idiomatic than “అది పాడుబడి ఉన్న రోజులన్నిటిలో.” The present clause order also makes “అప్పుడు” appear to add an explicit temporal element not present in the Hebrew. A semicolon cleanly reflects the Hebrew’s progression while preserving Telugu readability.
  terminology: Use “సబ్బతులు” in the text for שַׁבְּתֹתֵיכֶם, with a footnote explaining that these are the land’s sabbath rests, especially sabbatical years in context. “విశ్రాంతి” appropriately renders the repeated שׁבת idea without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The main text renders “your Sabbaths” as “your rest years.”
    rationale: This is contextually plausible, but it replaces the Hebrew cultic term with an interpretation. The footnote already provides the needed contextual clarification.
  - severity: low
    issue: “పాడుగా ఉన్న” is not the most natural modern Telugu expression for the land’s desolation.
    rationale: “పాడుబడి ఉన్న” is idiomatic and accurately conveys the state of desolation.
  - severity: low
    issue: “అప్పుడు పొందుతుంది” is an unnecessary explicit temporal addition and yields a somewhat repetitive construction.
    rationale: The Hebrew states that the land will rest for the rest it had not enjoyed; Telugu can express this directly without adding “then.”
  revised_text: అది పాడుబడి ఉన్న రోజులన్నిటిలో విశ్రమిస్తుంది; మీరు దానిపై నివసించినప్పుడు మీ సబ్బతులలో[a] అది పొందని విశ్రాంతిని పొందుతుంది.[b]
