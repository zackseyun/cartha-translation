  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: te
  text: అది పాడుబడి ఉన్న రోజులన్నిటిలో విశ్రమిస్తుంది; మీరు దానిపై నివసించినప్పుడు మీ సబ్బతులలో[a] అది పొందని విశ్రాంతిని పొందుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “మీ సబ్బతులలో.” సందర్భంలో ఇది దేశానికి రావలసిన సబ్బతు విశ్రాంతులను, ముఖ్యంగా ప్రతి ఏడవ సంవత్సరపు విశ్రాంతిని సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: మరింత అక్షరార్థంగా, “మీ సబ్బతులలో అది విశ్రమించనిదానికి అది విశ్రమిస్తుంది.” హీబ్రూలో ‘విశ్రమించు’ అనే క్రియ పునరావృతమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: అది పాడుగా ఉన్న రోజులన్నిటిలో
  rationale: కాలవ్యాప్తిని సూచించే כָּל יְמֵי భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, స్త్రీలింగ ప్రత్యయం సూచించే దేశాన్ని ‘అది’తో వ్యక్తం చేసింది.
- source_word: תִּשְׁבֹּת
  choice: విశ్రమిస్తుంది
  rationale: שׁבת క్రియలోని ‘విశ్రమించు/పనిని నిలిపివేయు’ భావాన్ని, భూమికి రావలసిన వ్యవసాయ విశ్రాంతి సందర్భానికి తగినట్లు నేరుగా అందిస్తుంది.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: అది పొందని విశ్రాంతిని అప్పుడు పొందుతుంది
  rationale: హీబ్రూలో పునరావృతమైన שׁבת మూలభావాన్ని తెలుగులో ‘విశ్రాంతి’గా స్పష్టం చేస్తుంది; אֵת אֲשֶׁר యొక్క కర్మసంబంధాన్ని సహజ వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: మీ విశ్రాంతి సంవత్సరాల్లో
  rationale: లేవీయకాండము 26:34 సందర్భంలో ఇవి దేశానికి రావలసిన సబ్బతు విశ్రాంతులు, ముఖ్యంగా ప్రతి ఏడవ సంవత్సరపు విశ్రాంతులు; సాధారణ పాఠకుడికి అర్థమయ్యేలా సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో తెలిపింది.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: మీరు దానిమీద నివసించినప్పుడు
  rationale: ישׁב క్రియారూపంలోని నివాస భావాన్నీ, עָלֶיהָ దేశాన్ని సూచిస్తున్నదన్న అంశాన్నీ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: בְּשַׁבְּתֹתֵיכֶם యొక్క పరిధి
  choice: దేశానికి సంబంధించిన విశ్రాంతి సంవత్సరాలు
  alternative: ‘మీ సబ్బతు దినాల్లో’ లేదా సాధారణంగా ‘మీ విశ్రాంతి కాలాల్లో’
  rationale: ముందరి వచనంలో దేశం తన సబ్బతులను అనుభవిస్తుందని చెప్పబడటం వల్ల ఇక్కడ వారపు సబ్బతులకన్నా దేశానికి నియమించబడిన సబ్బతు సంవత్సరాలే ప్రధాన సూచన. అయినా మూలంలోని బహువచన ‘సబ్బతులు’ రూపాన్ని పాదసూచికలో తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన శైలి. దేశాన్ని సూచించే స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని ‘అది/దానిమీద’గా ఉంచి, వ్యవసాయ సబ్బతు సందర్భాన్ని ‘విశ్రాంతి సంవత్సరాలు’ అని స్పష్టం చేసింది. మూలంలోని అసాధారణ కర్మ నిర్మాణం మరియు ‘విశ్రమించు’ క్రియా పునరుక్తిని పాదసూచికలో సంరక్షించింది.
