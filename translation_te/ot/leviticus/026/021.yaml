reference: Leviticus 26:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם תֵּֽלְכ֤וּ עִמִּ/י֙ קֶ֔רִי וְ/לֹ֥א תֹאב֖וּ לִ/שְׁמֹ֣עַֽ לִ֑/י וְ/יָסַפְתִּ֤י עֲלֵי/כֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּ/חַטֹּאתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: te
  text: మీరు నాకు విరోధంగా నడుచుకొని[a], నా మాట వినడానికి ఇష్టపడకపోతే, నేను మీ పాపాలకు తగినట్లుగా మిమ్మల్ని ఏడింతలు మరింతగా దెబ్బతీస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పట్ల శత్రుత్వంతో’ లేదా ‘నాకు ఎదిరిగా.’ ‘నాతో కెరీగా నడుచుకోవడం’ అనే హెబ్రీయ నుడికారం అర్థనిర్ణయానికి కష్టమైనది; ఈ అధ్యాయంలో అది కేవలం యాదృచ్ఛికతను కాక విరోధ వైఖరిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ పాపాలకు తగినట్లుగా మీపై ఏడింతల దెబ్బను ఇంకా కలుపుతాను.’
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: విరోధంగా
  rationale: ఈ అధ్యాయంలోని కֶרִי అనేది యాదృచ్ఛికతకన్నా దేవునికి ఎదురుగా నిలిచే వైఖరిని సూచిస్తుంది. ‘విరోధంగా’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: మీరు నాకు విరోధంగా నడుచుకుంటూ
  rationale: ‘నడుచుకొను’ అనే రూపం హెబ్రీయ భాషలోని ప్రవర్తనకు సంబంధించిన రూపకాన్ని నిలుపుతుంది; ‘నాకు విరోధంగా’ దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: תֹאבוּ
  choice: ఇష్టపడకపోతే
  rationale: ఈ క్రియ కేవలం వినకపోవడాన్ని కాక సంకల్పపూర్వకమైన అయిష్టతను వ్యక్తం చేస్తుంది.
- source_word: לִשְׁמֹעַ לִי
  choice: నా మాట వినడానికి
  rationale: ‘వినడం’ అనే మూలార్థాన్ని నిలుపుతూ, ఒడంబడిక సందర్భంలో అంతర్లీనంగా ఉన్న విధేయత భావానికి కూడా చోటిస్తుంది.
- source_word: וְיָסַפְתִּי
  choice: దెబ్బతీస్తాను
  rationale: క్రియకు అక్షరార్థంగా ‘ఇంకా కలుపుతాను’ అనే భావం ఉంది; అయితే ఏడింతల తీవ్రతను తెలిపే నిర్మాణంలో తెలుగులో సహజంగా ఉండేందుకు ప్రధాన శిక్షాక్రియతో కలిపి అనువదించబడింది. ‘ఇంకా’ అనే భావం ప్రత్యామ్నాయ పఠనంగా పాదసూచికలో ఇవ్వబడింది.
- source_word: מַכָּה
  choice: దెబ్బతీస్తాను
  rationale: మַכָּה దెబ్బ, విపత్తు లేదా తెగులు వంటి విస్తృత శిక్షను సూచించగలదు. ‘దెబ్బతీస్తాను’ దానిని ఒక నిర్దిష్ట శిక్షారూపానికి పరిమితం చేయదు.
- source_word: שֶׁבַע
  choice: ఏడింతలు
  rationale: ఈ శిక్షా సూత్రంలో שֶׁבַע తీవ్రతను సూచించే క్రియావిశేషణ భావంలో ఉంది; ‘ఏడింతలు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: మీ పాపాలకు తగినట్లుగా
  rationale: כְּ ఉపసర్గ ఇక్కడ శిక్ష పాపాలకు అనుగుణంగా లేదా వాటికి తగినట్లుగా ఉంటుందనే సంబంధాన్ని సూచిస్తుంది; కేవలం కారణార్థకమైన ‘మీ పాపాలవల్ల’ కంటే ఈ రూపం మూలంలోని భావాన్ని మెరుగ్గా కాపాడుతుంది.
theological_decisions:
- issue: ఒడంబడిక శిక్ష స్వభావం
  choice: ఇశ్రాయేలు పాపాలకు తగినట్లుగా తీవ్రత పెరిగే దేవుని శిక్షగా అనువదించడం, దాని నిర్దిష్ట రూపాన్ని నిర్ణయించకపోవడం
  alternative: מַכָּהను ప్రత్యేకంగా ‘తెగులు’ అని అనువదించడం లేదా כְּחַטֹּאתֵיכֶםను కేవలం ‘మీ పాపాలవల్ల’ అని కారణార్థంలో అనువదించడం
  rationale: లేవీయకాండము 26లో ఇది క్రమంగా తీవ్రమయ్యే ఒడంబడిక శాపాల సందర్భం. మూలపాఠం చెప్పని నిర్దిష్ట శిక్షా విధానాన్ని చేర్చకుండా, శిక్ష తీవ్రతను మరియు పాపాలతో దాని అనుగుణ సంబంధాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. హెబ్రీయ ‘నడుచుకొను’ రూపకాన్ని నిలుపుతూ, కֶרִי యొక్క నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
