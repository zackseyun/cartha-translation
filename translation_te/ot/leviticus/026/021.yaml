review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the opposition expressed by the difficult qeri idiom, the volitional force of ‘are not willing,’ and the proportional sense of ‘according to your sins.’ However, its main text omits the explicit escalating force of וְיָסַפְתִּי (‘I will add/further increase’). A footnote cannot replace that element in the translated text.
  naturalness: The Telugu is generally clear and uses an appropriate modern, serious register. ‘ఏడింతలు మరింతగా దెబ్బతీస్తాను’ naturally expresses both the sevenfold punishment and its further escalation.
  terminology: ‘నాకు విరోధంగా నడుచుకొను’ suitably preserves the conduct metaphor and contextual sense of qeri. ‘నా మాట వినడానికి ఇష్టపడకపోతే’ retains the source’s volitional wording without overtranslating it as obedience. ‘పాపాలకు తగినట్లుగా’ appropriately retains proportionality.
