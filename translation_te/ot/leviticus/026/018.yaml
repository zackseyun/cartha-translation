id: LEV.26.18
reference: Leviticus 26:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: te
  text: “ఇవన్నీ జరిగినా[a] మీరు నా మాట వినకపోతే, మీ పాపాలనుబట్టి నేను మిమ్మల్ని ఇంకా ఏడురెట్లు శిక్షిస్తాను.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంత జరిగినా’ లేదా ‘ఇవన్నీ అయిన తరువాత కూడా.’ ముందుగా వచ్చిన తీర్పులు సంభవించినప్పటికీ అనే భావాన్ని హీబ్రూ నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏడు సార్లు.’ హీబ్రూ పదం ఖచ్చితమైన సంఖ్యను కాకుండా శిక్ష మరింత తీవ్రమవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందున్న నిబంధన హెచ్చరికలకు అనుసంధానమయ్యే షరతును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַד אֵלֶּה
  choice: ఇవన్నీ జరిగినా
  rationale: ఇది కేవలం కాలపరమైన ‘ఇంతవరకు’ అనే భావం కాకుండా, ముందటి తీర్పులు సంభవించినప్పటికీ అవిధేయత కొనసాగడాన్ని సూచించే హీబ్రూ నుడికారాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: మీరు నా మాట వినకపోతే
  rationale: శ్రవణ రూపకాన్ని నిలుపుతూ, సందర్భంలో అంతర్లీనంగా ఉన్న విధేయత భావాన్ని కూడా సహజంగా సూచిస్తుంది.
- source_word: וְיָסַפְתִּי
  choice: ఇంకా
  rationale: శిక్ష కొనసాగి మరింత తీవ్రమవుతుందనే יסף పదంలోని పునరావృత్తి లేదా వృద్ధి భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: మిమ్మల్ని ... శిక్షిస్తాను
  rationale: నిబంధన శాపాల సందర్భంలో దిద్దుబాటు మరియు దండన రెండూ కలిసిన יסר పదబలాన్ని ‘శిక్షిస్తాను’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దిద్దుబాటు కోణాన్ని సందర్భం తెరిచి ఉంచుతుంది.
- source_word: שֶׁבַע
  choice: ఏడంతలుగా
  rationale: తీర్పు తీవ్రత లేదా పరిమాణం పెరగడాన్ని సూచించే క్రియావిశేషణ బలాన్ని తెలియజేస్తుంది; ఖచ్చితంగా ఏడు సార్లు అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: మీ పాపాలనుబట్టి
  rationale: శిక్షకు పాపాలే ఆధారమని తెలిపే עַל యొక్క కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధన శాపాల సందర్భంలో יָסַר స్వభావం
  choice: శిక్షిస్తాను
  alternative: క్రమశిక్షణ చేస్తాను; దండిస్తాను; సరిదిద్దుతాను
  rationale: ఈ సందర్భంలో చర్యకు శిక్షాత్మక బలం స్పష్టంగా ఉంది; అయినా יסר లోని దిద్దుబాటు ఉద్దేశాన్ని పూర్తిగా నిరాకరించకుండా ‘శిక్షిస్తాను’ అనే సాధారణ పదాన్ని ఎంచుకున్నాం. కేవలం ప్రతీకారం లేదా కేవలం మృదువైన సవరణగా భావాన్ని పరిమితం చేయలేదు.
- issue: שֶׁבַע యొక్క పరిమాణార్థమా, తీవ్రతార్థమా
  choice: ఏడంతలుగా
  alternative: ఏడు సార్లు
  rationale: హీబ్రూ తీర్పు సూత్రంలో ఇది తీవ్రత పెరుగుదలను సూచించవచ్చు; అయితే ఖచ్చిత సంఖ్యాత్మక అర్థం కూడా సాధ్యమే కాబట్టి పాదసూచికలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ‘నా మాట వినడం’ ద్వారా హీబ్రూలోని వినికిడి రూపకాన్ని నిలిపి, విధేయత భావాన్ని సందర్భానికి వదిలింది. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
