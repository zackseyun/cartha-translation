source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: te
  text: నేను దేశంలో శాంతిని అనుగ్రహిస్తాను; మీరు పడుకుంటారు, మిమ్మల్ని భయపెట్టేదేదీ ఉండదు. హానికరమైన క్రూరమృగాలను దేశం నుండి తొలగిస్తాను[a]; ఖడ్గం[b] మీ దేశం గుండా సాగదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రమాదకరమైన అడవి జంతువులు.’ హీబ్రూ పదబంధం దేశంలో హాని కలిగించే జంతువులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఖడ్గం’ యుద్ధాన్ని లేదా సాయుధ దండయాత్రను సూచించే హీబ్రూ అలంకార ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: నేను ... శాంతిని అనుగ్రహిస్తాను
  rationale: נתן యొక్క ప్రాథమిక భావం ‘ఇవ్వడం’; ఆశీర్వాదాన్ని ప్రసాదించే సందర్భంలో ‘అనుగ్రహిస్తాను’ సహజంగా, గౌరవప్రదంగా ఉంది. שָׁלוֹם ఇక్కడ క్షేమంతో కూడిన సామాజిక, భౌతిక భద్రతను సూచించే ‘శాంతి’గా అనువదించబడింది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ఇక్కడ ఇశ్రాయేలుకు సంబంధించిన నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశంలో’ సహజంగా ఆ ప్రాదేశిక భావాన్ని అందిస్తుంది.
- source_word: וּשְׁכַבְתֶּם וְאֵין מַחֲרִיד
  choice: మీరు నిర్భయంగా పడుకుంటారు, మిమ్మల్ని భయపెట్టేవారెవరూ ఉండరు
  rationale: שׁכב లోని ‘పడుకోవడం’ అనే చిత్రాన్ని నిలిపి, מחריד లోని భయపెట్టే కార్యార్థాన్ని స్పష్టంగా తెలిపింది. ‘నిర్భయంగా’ సందర్భంలోని సురక్షిత విశ్రాంతిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁבַּתִּי חַיָּה רָעָה מִן־הָאָרֶץ
  choice: దేశంలో హానికరమైన క్రూరమృగాలు లేకుండా చేస్తాను
  rationale: שׁבת హిఫీల్ రూపం ‘నిలిచిపోయేలా చేయడం’ అనే భావమిస్తుంది. חַיָּה רָעָה జంతువుల నైతిక చెడును కాక వాటి ప్రమాదకర, హానికర స్వభావాన్ని సూచిస్తుంది.
- source_word: וְחֶרֶב לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: ఖడ్గం మీ దేశం గుండా సాగదు
  rationale: ‘ఖడ్గం’ అనే హీబ్రూ చిత్రాన్ని నిలిపి, యుద్ధం లేదా సాయుధ దండయాత్ర దేశంలో ప్రవేశించకపోవడాన్ని సూచిస్తుంది. עבר కు ‘గుండా సాగడం’ నేరుగా సరిపోతుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన శాంతి పరిధి
  choice: దేశంలో భయం, ప్రమాదకర జంతువులు, సాయుధ దండయాత్ర లేకపోవడంతో కూడిన నిబంధనాత్మక భద్రత
  alternative: కేవలం అంతరంగిక ఆధ్యాత్మిక శాంతి లేదా కేవలం రాజకీయ శాంతి
  rationale: పడుకోవడం, భయపెట్టేవారు లేకపోవడం, హానికర జంతువులు, ఖడ్గం వంటి స్పష్టమైన అంశాలు ఈ ఆశీర్వాదం సమగ్రంగానూ భౌతిక జీవితంలో ఆధారపడినదిగానూ ఉందని చూపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ సమాంతర నిర్మాణం మరియు ‘పడుకోవడం/ఖడ్గం’ అనే చిత్రాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
