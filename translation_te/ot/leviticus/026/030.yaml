source:
  edition: WLC
  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: te
  text: నేను మీ ఎత్తైన పూజాస్థలాలను నాశనం చేస్తాను; మీ ధూపపీఠాలను[a] నరికివేస్తాను. మీ శవాలను మీ విగ్రహాల శవాల మీద వేస్తాను[b]. నా ప్రాణం మిమ్మల్ని అసహ్యించుకుంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సూర్యస్తంభాలను.” ఈ హీబ్రూ పదం నిషిద్ధ ఆరాధనకు సంబంధించిన వస్తువులను సూచిస్తుంది; వాటి కచ్చితమైన రూపం ఏమిటో నిర్ధారణ లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో మనుషుల మృతదేహాలకు, వారి విగ్రహాలకు ఒకే ‘శవాలు’ అనే పదం రెండుసార్లు వాడబడింది. ఇది విగ్రహాల నిర్జీవతను, వాటికి కలిగే అవమానాన్ని నొక్కిచెబుతుంది.
    reason: wordplay
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: నాశనం చేస్తాను
  rationale: హిఫీల్ రూపంలోని సంపూర్ణ విధ్వంస భావాన్ని బలంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּמֹתֵיכֶם
  choice: మీ ఎత్తైన పూజాస్థలాలను
  rationale: במות అనేవి ఆరాధనకు ఉపయోగించిన ఉన్నత స్థలాలు; కేవలం భౌగోళిక ఎత్తు కాక ఆరాధనా స్థలమనే భావం స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: חַמָּנֵיכֶם
  choice: మీ ధూపపీఠాలను
  rationale: ఈ పదం అక్రమ ఆరాధనతో సంబంధమున్న ఆరాధనా నిర్మాణాలను సూచిస్తుంది; అవి ధూపపీఠాలా, సూర్యస్తంభాలా అన్నది వివాదాస్పదం కాబట్టి చదవదగిన ప్రధాన అనువాదంతో పాటు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִכְרַתִּי
  choice: నరికివేస్తాను
  rationale: כרת లోని ‘నరికి తొలగించడం’ అనే దృశ్యాత్మక భావాన్ని నిలుపుతుంది.
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: మీ శవాలను ... మీ విగ్రహాల శవాల మీద
  rationale: పిగ్రే అనే పదం మనుషులకు, విగ్రహాలకు రెండింటికీ పునరుక్తమై వాటి నిర్జీవతను, అవమానాన్ని బలపరుస్తుంది; తెలుగులోనూ ‘శవాలు’ అనే పునరుక్తిని నిలిపాం.
- source_word: גִּלּוּלֵיכֶם
  choice: మీ విగ్రహాలు
  rationale: మూలపదంలో తృణీకార ఛాయ ఉన్నా, ‘విగ్రహాలు’ సాధారణ పాఠకులకు స్పష్టమైన ప్రాథమిక సమానార్థకం; చుట్టూ ఉన్న శవాల చిత్రణ దాని అవమానకర బలాన్ని తెలియజేస్తుంది.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: నా ప్రాణం మిమ్మల్ని అసహ్యించుకుంటుంది
  rationale: ‘నా ప్రాణం’ అనే మూలంలోని ప్రత్యక్ష వ్యక్తీకరణను తొలగించకుండా, తీవ్రమైన తిరస్కారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవిక అసహ్యాన్ని మానవానుభూతి భాషలో వ్యక్తం చేయడం
  choice: నా ప్రాణం మిమ్మల్ని అసహ్యించుకుంటుంది
  alternative: నేను మిమ్మల్ని అసహ్యించుకుంటాను
  rationale: నַפְשִׁי (‘నా ప్రాణం’) అనే స్పష్టమైన పదాన్ని నిలుపడం ద్వారా మూలంలోని దైవిక తిరస్కార తీవ్రతను, దాని వేదాంతపరమైన ఉద్వేగాన్ని సరళీకరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన తీర్పు ధోరణి ఉంచబడింది. ‘ఎత్తైన పూజాస్థలాలు’ సాధారణ పాఠకునికి ఆరాధనా సందర్భాన్ని స్పష్టం చేస్తుంది; ‘నా ప్రాణం’ మూలంలోని ఉద్దేశపూర్వక మానవరూప వ్యక్తీకరణను నిలుపుతుంది.
