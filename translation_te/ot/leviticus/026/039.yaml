source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: te
  text: మీలో మిగిలినవారు మీ శత్రువుల దేశాల్లో తమ దోషం వల్ల క్షీణించిపోతారు[a]; తమ పితరుల దోషాలతోపాటు కూడా వారు క్షీణించిపోతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుళ్లిపోతారు,’ ‘వాడిపోతారు.’ ఇక్కడి హీబ్రూ క్రియ తీర్పు కింద క్షీణించడం లేదా కుళ్లిపోవడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ పితరుల దోషాలతోపాటు’ అనే పదబంధంలో ‘వారితో’ అనేది పితరుల దోషాలు వారితోనే కొనసాగుతున్నాయని సూచించవచ్చు; లేదా ఆ పూర్వీకుల దోషాల ప్రభావంతోపాటు వారు క్షీణిస్తున్నారని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: మీలో మిగిలినవారు
  rationale: శిక్ష తరువాత మిగిలి ఉన్నవారిని సూచించే שׁאר భావాన్నీ, בכםలోని ప్రత్యక్ష సంబోధననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִמַּקּוּ
  choice: క్షీణించిపోతారు
  rationale: מקק నిఫాల్ రూపం తీర్పు కింద క్రమంగా క్షీణించడం లేదా కుళ్లిపోవడం అనే భావాన్ని ఇస్తుంది. రెండు సందర్భాల్లోనూ ఒకే పదబంధాన్ని వాడటం మూలపాఠంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: בַּעֲוֺנָם
  choice: తమ దోషం వల్ల
  rationale: עָוֹן పాపదోషం, అపరాధభారం, కొన్నిసార్లు దాని ఫలితం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ בְּను కారణార్థకంగా తీసుకున్నప్పటికీ, ‘దోషం’ అనే పదం ఆ భావవ్యాప్తిని కొంతవరకు నిలుపుతుంది.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: మీ శత్రువుల దేశాల్లో
  rationale: אַרְצֹתలోని బహువచనాన్ని ‘దేశాల్లో’ అని నిలిపి, నిర్బంధ జీవితం అనేక శత్రుదేశాల్లో సాగుతుందనే మూలభావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאַף
  choice: కూడా
  rationale: ముందు చెప్పిన కారణానికి మరొకదాన్ని జోడించే బలవర్ధక భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: తమ పితరుల దోషాల వల్ల
  rationale: ‘దోషాలు’ అనే బహువచనాన్ని నిలుపుతూ, אֲבוֹתָםను గౌరవప్రదమైన గ్రంథశైలిలో ‘పితరులు’గా అనువదిస్తుంది.
- source_word: אִתָּם
  choice: అవి వారితో ఉండగా
  rationale: ఈ సంక్షిప్త హీబ్రూ పదబంధం పితరుల దోషాలు వారితోనే ఉన్నాయని సూచించవచ్చు; అయితే దాని సంబంధం మరియు భావం పూర్తిగా స్పష్టం కాదు. ప్రధాన పాఠం ఈ అస్పష్టతను పూర్తిగా తొలగించకుండా, పాదటిప్పణి ద్వారా ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: తరతరాల దోషం మరియు తీర్పు
  choice: మిగిలినవారు తమ స్వదోషం వల్లనే కాక తమ పితరుల దోషాల వల్ల కూడా క్షీణిస్తారని పాఠం చెప్పే ఉద్రిక్తతను యథాతథంగా ఉంచడం.
  alternative: ఇది కేవలం పూర్వీకుల పాపాల పరిణామాల గురించేనని లేదా వారు పితరుల పాపాల్లో పాలుపంచుకున్నందువల్లనేనని స్పష్టీకరించడం.
  rationale: మూలపాఠం ‘తమ దోషం’నూ ‘తమ పితరుల దోషాలు’నూ వేరుగా ప్రస్తావిస్తుంది. వ్యక్తిగత బాధ్యతకూ తరతరాల ప్రభావానికీ మధ్యనున్న సంబంధాన్ని అనువాదం సిద్ధాంతపరంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘పితరులు,’ ‘దోషం,’ ‘క్షీణించిపోతారు’ వంటి పదాలు లేవీయకాండంలోని నిబంధన-తీర్పు సందర్భానికి తగిన గౌరవభావాన్ని కలిగిస్తాయి. ద్వితీయ పురుష సంబోధన (‘మీలో,’ ‘మీ శత్రువుల’) మరియు తృతీయ పురుష సూచన (‘తమ,’ ‘వారు’) మూలపాఠం ప్రకారం నిలుపబడ్డాయి.
