  source_fidelity: 'మొదటి భాగం హీబ్రూ మూలానికి విశ్వసనీయంగా ఉంది: మిగిలినవారు శత్రువుల దేశాలలో తమ దోషం కారణంగా క్షీణిస్తారు. రెండవ భాగంలో אִתָּם (''వారితో/వారితోపాటు'')కు ముసాయిదా ఇచ్చిన ‘అవి వారితో ఉండగా’ అనే కాలసంబంధ అర్థం మూలపాఠంలో లేదు మరియు అస్పష్టమైన సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేస్తుంది.'
  naturalness: ‘మీలో మిగిలినవారు,’ ‘మీ శత్రువుల దేశాల్లో,’ ‘క్షీణించిపోతారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగాను సందర్భోచితమైన గంభీరతతోనూ ఉన్నాయి. ‘తమ పితరుల దోషాలతోపాటు’ అనేది మూలంలోని సంక్షిప్త, కొంత అస్పష్టమైన అనుబంధాన్ని ‘అవి వారితో ఉండగా’ కంటే సహజంగా వ్యక్తం చేస్తుంది.
