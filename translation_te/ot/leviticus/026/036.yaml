- from: మీలో మిగిలినవారి విషయానికొస్తే, వారి శత్రువుల దేశాల్లో వారి హృదయాల్లో పిరికితనాన్ని కలిగిస్తాను. గాలికి కొట్టుకుపోయే ఆకు శబ్దమే[a] వారిని తరుముతుంది. వారు ఖడ్గానికి భయపడి పారిపోయినట్లు పారిపోతారు; ఎవరూ తరమకపోయినా పడిపోతారు.
  to: మీలో మిగిలినవారి విషయానికొస్తే, వారి శత్రువుల దేశాల్లో వారి హృదయాల్లో ధైర్యహీనతను కలిగిస్తాను. కొట్టుకుపోతున్న ఆకు శబ్దమే[a] వారిని తరుముతుంది. వారు ఖడ్గం నుండి పారిపోతున్నట్లుగా పారిపోతారు; ఎవరూ తరమకపోయినా పడిపోతారు.
  rationale: 'సవరణలు మూలంలోని భావవ్యాప్తిని కాపాడుతూ మూడు చోట్ల అనవసర నిర్దిష్టతను తగ్గిస్తాయి: ధైర్యం కుంగిపోవడాన్ని వ్యక్తిత్వ పిరికితనంగా చేయవు; గాలిని ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చవు; ఖడ్గం-నుండి-పరుగెత్తే పోలికకు అదనపు వివరణను జోడించవు. పాదటీపు గుర్తు సరైన స్థానంలో ఉంచబడింది.'
