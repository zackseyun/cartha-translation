reference: Leviticus 26:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: te
  text: మీలో మిగిలినవారి విషయానికొస్తే, వారి శత్రువుల దేశాల్లో వారి హృదయాల్లో ధైర్యహీనతను కలిగిస్తాను. కొట్టుకుపోతున్న ఆకు శబ్దమే[a] వారిని తరుముతుంది. వారు ఖడ్గం నుండి పారిపోతున్నట్లుగా పారిపోతారు; ఎవరూ తరమకపోయినా పడిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గాలికి కొట్టుకుపోతున్న ఆకు శబ్దం.’ హీబ్రూ పాఠ్యంలో గాలి ప్రత్యక్షంగా ప్రస్తావించబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: మీలో మిగిలినవారు
  rationale: తీర్పు తర్వాత ఇశ్రాయేలు ప్రజల్లో మిగిలి ఉన్నవారిని సూచించే కృదంత భావాన్నీ, בכם లోని ‘మీలో’ అనే ప్రత్యక్ష సంబోధననూ నిలుపుతుంది.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: వారి హృదయాల్లో పిరికితనాన్ని కలిగిస్తాను
  rationale: హిఫిల్ క్రియలోని దైవిక కారణత్వాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. מֹרֶךְ సాధారణ భయం కంటే ధైర్యం కుంగిపోయే స్థితిని సూచిస్తుంది; ‘పిరికితనం’ ఆ అంతరంగిక బలహీనతను సులభంగా తెలియజేస్తుంది.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: వారి శత్రువుల దేశాల్లో
  rationale: హీబ్రూ బహువచనమైన ‘దేశాలు’ను నిలిపి, శత్రువుల మధ్య చెదరిపోవడాన్ని సూచిస్తుంది.
- source_word: קוֹל עָלֶה נִדָּף
  choice: గాలికి కొట్టుకుపోయే ఆకు శబ్దం
  rationale: קוֹל ‘శబ్దం,’ עָלֶה ‘ఆకు,’ נִדָּף ‘కొట్టుకుపోయే/తరిమివేయబడే’ అనే భావాలను సహజ తెలుగులో అందిస్తుంది. గాలి హీబ్రూలో ప్రత్యక్షంగా లేకపోవడం వల్ల మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
- source_word: וְרָדַף אֹתָם
  choice: వారిని తరుముతుంది
  rationale: అల్పమైన ఆకు శబ్దమే భయంతో ఉన్నవారికి తరుముతున్న శత్రువులా అనిపించే వ్యంగ్యాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: వారు ఖడ్గానికి భయపడి పారిపోయినట్లు పారిపోతారు
  rationale: నిర్మాణం సూచించే విధానాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, ఖడ్గం నుండి ప్రాణభయంతో పారిపోయే దృశ్యాన్ని అందిస్తుంది.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: ఎవరూ తరమకపోయినా పడిపోతారు
  rationale: నిజమైన తరుమువాడు లేనప్పటికీ వారు పడిపోతారనే విరుద్ధతను సంక్షిప్తంగా నిలుపుతుంది; ‘పడిపోతారు’ మరణం, కూలిపోవడం లేదా తడబడడం మధ్య ఉన్న మూలపాఠ్య విస్తృతిని పరిష్కరించదు.
theological_decisions:
- issue: తీర్పు స్వభావం
  choice: శత్రుదేశాల్లో దేవుడు కలిగించే అంతరంగిక ధైర్యహీనత మరియు దాని వల్ల పుట్టే భయాందోళన
  alternative: కేవలం బాహ్య సైనిక తరుముడు లేదా సాధారణ రూపకాల అసౌకర్యం
  rationale: దేవుని కారణత్వాన్ని వాక్యం స్పష్టంగా చెబుతుంది; చిన్న ఆకు శబ్దానికే పారిపోవడం అంతరంగిక భయాన్ని చూపుతుంది. అనువాదం ఈ రెండింటినీ నిలిపి, తర్వాతి సిద్ధాంతపరమైన వర్గీకరణలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే తీర్పు సందర్భానికి తగిన గంభీరతతో రచించబడింది. ‘ఖడ్గం’ వంటి బైబిలు సందర్భంలో సుపరిచితమైన పదాన్ని ఉంచి, వాక్యంలోని భయానక లయను కాపాడాం.
