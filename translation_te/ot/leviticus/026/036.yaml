    rationale: מְנֻסַת חֶרֶב ఖడ్గం నుండి పారిపోయే విధానాన్ని సూచిస్తుంది. ‘ఖడ్గం నుండి పారిపోతున్నట్లుగా’ మూలంలోని పోలికను సూటిగా నిలుపుతుంది.
  revised_text: మీలో మిగిలినవారి విషయానికొస్తే, వారి శత్రువుల దేశాల్లో వారి హృదయాల్లో ధైర్యహీనతను కలిగిస్తాను. కొట్టుకుపోతున్న ఆకు శబ్దమే[a] వారిని తరుముతుంది. వారు ఖడ్గం నుండి పారిపోతున్నట్లుగా పారిపోతారు; ఎవరూ తరమకపోయినా పడిపోతారు.
  revised_footnotes:
