reference: Leviticus 26:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: te
  text: కానీ వారి కోసం, వారికి దేవుడిగా ఉండటానికి జాతుల కళ్ల ఎదుట ఐగుప్తు దేశం నుండి నేను బయటకు తీసుకొచ్చిన వారి పూర్వీకులతో చేసిన నిబంధనను జ్ఞాపకం చేసుకుంటాను. నేనే యెహోవాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: కానీ ... జ్ఞాపకం చేసుకుంటాను
  rationale: וְ సందర్భంలో తీర్పు నుండి కృపాపూర్వక జ్ఞాపకానికి వచ్చే వ్యతిరేక మలుపును సూచిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘కానీ’ అనువైనది.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: ל ఉపసర్గను నిలుపుతూ, ఈ జ్ఞాపకం వారి మేలుకోసం లేదా వారి పక్షంగా ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּרִית רִאשֹׁנִים
  choice: పూర్వీకులతో చేసిన నిబంధనను
  rationale: רִאשֹׁנִים అక్షరార్థంగా ‘మునుపటివారు’; తరువాతి సంబంధవాచక వాక్యం ఐగుప్తు నుండి తీసుకొచ్చిన వ్యక్తులను సూచిస్తుంది. ‘చేసిన’ అనేది తెలుగులో సంబంధాన్ని స్పష్టంగా చెప్పే అవసరమైన పూరణ.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: నేను ... ఆ పూర్వీకులను బయటకు తీసుకొచ్చాను
  rationale: సంబంధవాచక భాగం నిబంధనను కాక వ్యక్తులను సూచిస్తుందని తెలుగులో స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: నిర్గమ సంప్రదాయంలోని స్థిరమైన భాషను, אֶרֶץ అనే ‘దేశం’ భావాన్ని నిలుపుతుంది.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: జనాల కళ్ల ఎదుట
  rationale: హీబ్రూ దృశ్యరూపాన్ని దగ్గరగా నిలుపుతూ, నిర్గమం ఇతర జనాల సమక్షంలో బహిరంగంగా జరిగిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: לִהְיֹת לָהֶם לֵאלֹהִים
  choice: వారికి దేవుడిగా ఉండడానికి
  rationale: ప్రామాణిక నిబంధన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
theological_decisions:
- issue: בְּרִית רִאשֹׁנִים లోని רִאשֹׁנִים యొక్క సూచన
  choice: పూర్వీకులతో చేసిన నిబంధన
  alternative: మునుపటివారితో చేసిన నిబంధన / పూర్వ తరాలతో చేసిన నిబంధన
  rationale: ‘వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను’ అనే తరువాతి మాట వ్యక్తులనే సూచిస్తుంది. అయితే ‘పూర్వీకులు’ అనేది భావవ్యాఖ్యాత్మకమైన సహజ తెలుగు కావడంతో అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: జ్ఞాపకం చేసుకోవడం యొక్క నిబంధనాత్మక భావం
  choice: జ్ఞాపకం చేసుకుంటాను
  alternative: గుర్తుచేసుకుంటాను / వారి పక్షంగా జ్ఞాపకం ఉంచుకుంటాను
  rationale: దేవుడు మరచిపోయాడనే తాత్త్విక నిర్ణయాన్ని చొప్పించకుండా, మూలంలోని זכר క్రియను నేరుగా నిలుపుతుంది; సందర్భం దాని కార్యోన్ముఖ నిబంధనాత్మక బరువును తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం. ‘జనాలు’ అనేది הַגּוֹיִם కు మతపరమైన అదనపు భావం రాకుండా వాడబడింది; దైవనామం ‘యెహోవా’గా ఉంచబడింది.
