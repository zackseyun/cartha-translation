source:
  edition: WLC
  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: te
  text: ఖడ్గం ఎదుటనుండి పారిపోతున్నట్లుగా, తరుమేవాడు ఎవడూ లేకపోయినా, వారు ఒకరిమీద ఒకరు తొట్రుపడతారు[a]. మీ శత్రువుల ఎదుట నిలబడే శక్తి మీకు ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒకడు తన సోదరునిలో/సోదరునికి ఎదురుగా’; ఇక్కడ భయాందోళనలో ఒకరినొకరు ఢీకొని తొట్రుపడటం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: తడబడి పడతారు
  rationale: כשל అనే క్రియలో తడబడటం, తొట్రుపడటం, దాని ఫలితంగా పడిపోవడం అనే భావాలు ఉన్నాయి. భయంతో కలిగే గందరగోళాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ఈ సంయుక్త ప్రయోగం సరిపోతుంది.
- source_word: אִישׁ בְּאָחִיו
  choice: ఒకరిమీద ఒకరు
  rationale: అక్షరార్థంగా ‘ఒకడు తన సహోదరునిలో/మీద’ అనే పంపిణీ ప్రయోగం. ఇక్కడ భయాందోళనలో పరస్పరం ఢీకొని తొట్రుపడటాన్ని ‘ఒకరిమీద ఒకరు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: ఖడ్గం ఎదుట ఉన్నట్టుగా
  rationale: כְּ మరియు מִפְּנֵי కలయిక ‘ఖడ్గం ఎదుటనుంచి ఉన్నట్టుగా’ అనే పోలికను ఇస్తుంది. మూలంలో స్పష్టంగా లేని ‘పారిపోవడం’ అనే క్రియను చేర్చకుండా భయకరమైన ఖడ్గసాన్నిధ్యాన్ని నిలుపుతుంది.
- source_word: וְרֹדֵף אָיִן
  choice: తరుమేవాడు ఎవడూ లేకపోయినా
  rationale: అక్షరార్థంగా ‘తరుమేవాడు లేడు.’ సందర్భంలోని విరుద్ధతను తెలుగులో సహజంగా చూపడానికి ‘లేకపోయినా’ వాడబడింది.
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: నిలబడే శక్తి మీకు ఉండదు
  rationale: תְּקוּמָה అంటే లేవడం, నిలవడం, నిలదొక్కుకోవడం లేదా ఎదిరించి నిలబడగల సామర్థ్యం. శత్రువుల సందర్భంలో ‘నిలబడే శక్తి’ శారీరకంగా లేవడానికన్నా ప్రతిఘటించలేని స్థితిని తెలియజేస్తుంది.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: మీ శత్రువుల ఎదుట
  rationale: లִפְנֵי యొక్క సాధారణ భావాన్ని శత్రువులతో ముఖాముఖి నిలిచే సందర్భానికి తగిన విధంగా అనువదించింది.
