base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: te
  text: నేను నా ముఖాన్ని మీకు విరోధంగా మళ్లిస్తాను[a]. మీ శత్రువుల ఎదుట మీరు ఓడిపోతారు[b]. మిమ్మల్ని ద్వేషించేవారు మిమ్మల్ని ఏలుతారు. ఎవరూ మిమ్మల్ని తరుమకపోయినా[c] మీరు పారిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా ముఖాన్ని మీకు విరోధంగా మళ్లిస్తాను’ అనేది తీర్పులో దృఢంగా ఎదిరించడాన్ని తెలిపే హెబ్రీ జాతీయం.
    reason: cultural_note
  - marker: b
    text: లేదా, “మీరు దెబ్బతిని కూలిపోతారు.” ఈ సందర్భంలో అది యుద్ధంలో ఓడిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఎవరూ మిమ్మల్ని తరుమని సమయంలో మీరు పారిపోతారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: నేను నా ముఖాన్ని మీకు విరోధంగా ఉంచుతాను
  rationale: దేవుడు తీర్పులో దృఢంగా విరోధించే తన వ్యక్తిగత వైఖరిని తెలిపే హెబ్రీ జాతీయాన్ని సాధ్యమైనంతగా నిలుపుతుంది; దానిని కేవలం ‘నేను మిమ్మల్ని ఎదిరిస్తాను’ అని సరళీకరించలేదు.
- source_word: וְנִגַּפְתֶּם
  choice: మీరు ఓడిపోతారు
  rationale: נגף క్రియ యొక్క నిఫాల్ రూపం ఈ యుద్ధ సందర్భంలో శత్రువుల చేతిలో దెబ్బతిని ఓడిపోవడాన్ని సూచిస్తుంది. ‘ఓడిపోతారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: మీ శత్రువుల ఎదుట
  rationale: లִפְנֵי యొక్క స్థలసంబంధమైన భావాన్ని, అలాగే శత్రువుల సమక్షంలో కలిగే సైనిక పరాజయాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְרָדוּ בָכֶם
  choice: మిమ్మల్ని ఏలుతారు
  rationale: רדה ఇక్కడ అధికారాన్ని చెలాయించి లోబరచుకోవడాన్ని సూచిస్తుంది. ‘ఏలుతారు’ ఆ అధీనస్థితిని తెలియజేస్తుంది గాని మూలపాఠంలో స్పష్టంగా లేని అదనపు క్రూరత్వాన్ని చేర్చదు.
- source_word: שֹׂנְאֵיכֶם
  choice: మిమ్మల్ని ద్వేషించేవారు
  rationale: ఇది ‘శత్రువులు’ అనే ముందటి పదానికి పునరుక్తి కాదు; ద్వేషిస్తున్నవారిని సూచించే కృదంత రూపం. అందువల్ల ఆ పదభేదాన్ని అనువాదంలో నిలిపాం.
- source_word: וְנַסְתֶּם
  choice: మీరు పారిపోతారు
  rationale: נוס భయంతో లేదా ప్రమాదం వల్ల పారిపోవడానికి వాడే సాధారణ క్రియ; ఈ తీర్పు, యుద్ధ సందర్భంలో ‘పారిపోతారు’ సహజమైన సమానార్థకం.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: ఎవరూ మిమ్మల్ని తరుమకపోయినా
  rationale: నిజంగా తరుమేవారు లేకున్నా భయంతో పారిపోయే విరోధాభాసాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. హెబ్రీ వాక్యనిర్మాణం కాలసంబంధ భావాన్నీ అనుమతించేందున దాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: తీర్పులో దేవునికి మానవాకార భాషను ఉపయోగించడం
  choice: ‘నా ముఖాన్ని మీకు విరోధంగా ఉంచుతాను’ అనే జాతీయాన్ని నిలుపడం
  alternative: ‘నేను మిమ్మల్ని ఎదిరిస్తాను’
  rationale: మూలపాఠం దేవుని తీర్పును కేవలం అమూర్తమైన వ్యతిరేకతగా కాక, తన ప్రజల పట్ల ఆయన తీసుకునే వ్యక్తిగతమైన ఒడంబడిక వైఖరిగా చిత్రిస్తుంది. అందువల్ల ‘ముఖం’ అనే రూపకాన్ని తొలగించలేదు.
- issue: ద్వేషించేవారి ఆధిపత్య స్వభావం
  choice: רדה ను ‘ఏలుతారు’ అని అనువదించడం
  alternative: ‘అణచివేస్తారు’
  rationale: ఈ శాపవాక్యం శత్రువుల ఆధీనంలోకి వెళ్లడాన్ని స్పష్టంగా చెబుతుంది; అయితే ఈ ఉపవాక్యంలో క్రూరత్వపు స్థాయిని ప్రత్యేకంగా నిర్వచించదు. కాబట్టి మరింత బలమైన వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘ముఖాన్ని విరోధంగా ఉంచడం’ సాధారణ సంభాషణలో అరుదైనప్పటికీ, హెబ్రీలోని వ్యక్తిగతమైన తీర్పు రూపకాన్ని నిలుపడానికి ప్రధాన పాఠంలో ఉంచి పాదసూచికలో వివరించాం. ‘శత్రువులు’ మరియు ‘ద్వేషించేవారు’ మధ్య మూలపాఠంలోని పదభేదాన్ని కాపాడాం.
