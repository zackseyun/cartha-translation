source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: te
  text: మీలో ఐదుగురు వందమందిని తరుముతారు[a], మీలో వందమంది పదివేలమందిని తరుముతారు[b]; మీ శత్రువులు మీ ఎదుట ఖడ్గం చేత పడిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెంటాడుతారు’; రెండవ వాక్యంలోనూ ఇదే ప్రత్యామ్నాయం వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ‘పదివేలు’ లేదా ‘మిరియడ్’ (పదివేల సమూహం) అని అర్థమివ్వవచ్చు; ఇక్కడ సంఖ్యల సమాంతరతకు ‘పదివేలు’ సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: తరుముతారు
  rationale: רדף అనే క్రియకు ‘వెంటాడుట, తరుముట’ అనే అర్థం ఉంది. యుద్ధ సందర్భంలో ‘తరుముతారు’ సహజంగా ఉండి, రెండు సమాంతర వాక్యాలలోని క్రియను ఒకే విధంగా నిలుపుతుంది.
- source_word: מִכֶּם
  choice: మీలో
  rationale: מן ఇక్కడ భాగార్థకంగా వాడబడింది; అందువల్ల ‘మీలో ఐదుగురు’, ‘మీలో వందమంది’ అని అనువదించడం సహజమైన తెలుగు.
- source_word: חֲמִשָּׁה מֵאָה
  choice: మీలో ఐదుగురు వందమందిని
  rationale: హీబ్రూ సంఖ్యా నిష్పత్తిని నేరుగా, స్పష్టమైన తెలుగు కర్మరూపంతో అందిస్తుంది.
- source_word: רְבָבָה
  choice: పదివేలమందిని
  rationale: רְבָבָה కు ‘పదివేలు’ లేదా ‘అసంఖ్యాక సమూహం’ అనే భావాలు ఉండవచ్చు; ఇక్కడ ఐదు–వంద, వంద–పదివేలు అనే సంఖ్యాత్మక సమాంతరత వల్ల నిర్దిష్ట సంఖ్య ‘పదివేలు’ సరిపోతుంది.
- source_word: וְנָפְלוּ
  choice: కూలిపోతారు
  rationale: נפל యొక్క ‘పడిపోవుట’ అనే దృశ్యాన్ని యుద్ధ సందర్భానికి తగిన సహజ తెలుగులో నిలుపుతుంది; ‘చంపబడతారు’ అని భావాన్ని మరీ స్పష్టీకరించదు.
- source_word: אֹיְבֵיכֶם לִפְנֵיכֶם
  choice: మీ శత్రువులు మీ ఎదుట
  rationale: శత్రువులు వారి సమక్షంలో ఓడిపోయి పడిపోవడం అనే హీబ్రూ సైనిక ప్రయోగాన్ని సమీపంగా నిలుపుతుంది.
- source_word: לֶחָרֶב
  choice: కత్తిచేత
  rationale: యుద్ధంలో కత్తి ద్వారా సంభవించే పతనాన్ని సూచిస్తుంది; హీబ్రూ ఆయుధ దృశ్యాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: నిబంధన ఆశీర్వాదంలోని అసమాన సంఖ్యాబలంపై సైనిక విజయం అక్షరార్థ వాగ్దానమా, అతిశయోక్తియా
  choice: నిర్దిష్ట సంఖ్యలు, సైనిక దృశ్యంతో కూడిన ప్రత్యక్ష వాగ్దానాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని సాధారణ ధైర్యవచనంగా లేదా రూపకాలంకారంగా విప్పి చెప్పడం
  rationale: మూలవచనం నిబంధన ఆశీర్వాదంలో అసమాన బలంపై విజయాన్ని స్పష్టంగా చెబుతుంది. అది అక్షరార్థమా, అలంకారాత్మకమా అనే వ్యాఖ్యానాన్ని అనువాదం నిర్ణయించకుండా, దాని సంఖ్యాత్మక మరియు సైనిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తరుముతారు’, ‘కూలిపోతారు’ పదాలు సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తాయి. ప్రతి పాదంలో వ్యక్తులను లెక్కిస్తున్నందున సంఖ్యలకు ‘మంది’ చేర్చబడింది.
