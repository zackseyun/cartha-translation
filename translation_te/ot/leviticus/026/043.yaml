  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: te
  text: అయితే ఆ దేశం వారిచేత విడిచిపెట్టబడుతుంది; వారు లేక అది పాడుగా ఉన్న కాలంలో, అది తన విశ్రాంతి సంవత్సరాలను అనుభవిస్తుంది. వారు తమ దోషానికి శిక్షను అంగీకరిస్తారు[a]. ఎందుకంటే—అవును, ఎందుకంటే—వారు నా న్యాయవిధులను తిరస్కరించారు; వారి మనస్సు నా శాసనాలను అసహ్యించుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు తమ దోషాన్ని అంగీకరిస్తారు’; లేదా ‘వారు తమ దోషానికి పరిహారం చెల్లిస్తారు.’ ఈ హెబ్రీ ప్రయోగాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు. ఇక్కడ ఒడంబడిక శిక్ష సందర్భాన్ని బట్టి న్యాయపరమైన అర్థంలో అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב
  choice: వారిచేత విడిచిపెట్టబడుతుంది
  rationale: నిఫాల్ క్రియలోని కర్మణి భావాన్ని, దేశమే వాక్యవిషయమనే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: అది తన విశ్రాంతి సంవత్సరాలను అనుభవిస్తుంది
  rationale: ఇక్కడ భూమికి సంబంధించిన శబ్బతు విశ్రాంతి సంవత్సరాలే ఉద్దేశం; ఆధునిక తెలుగు పాఠకునికి ఆ వ్యవసాయ-నిబంధన భావం స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: వారు లేక అది పాడుగా ఉన్న కాలంలో
  rationale: ప్రజలు లేని సమయంలో దేశం పాడుగా ఉండే స్థితి అనే రెండు అంశాలనూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: తమ దోషానికి తగిన శిక్షను అంగీకరిస్తారు
  rationale: నిబంధనాత్మక తీర్పు సందర్భంలో עון దోషంతోపాటు దాని శిక్షాఫలాన్ని సూచించగలదు; רצה తో కలిసిన ప్రయోగానికి న్యాయపరమైన భావాన్ని ఇస్తూ, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
- source_word: יַעַן וּבְיַעַן
  choice: ఎందుకంటే—అవును, ఎందుకంటే—
  rationale: పునరుక్త కారణసూచక పదబంధంలోని ఉద్ఘాటనను తెలుగులో నిలుపుతుంది.
- source_word: בְּמִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: ఒడంబడికలోని న్యాయ నిర్ణయాలు లేదా విధులను సూచిస్తూ, חֻקֹּתַי కి వాడిన పదం నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: חֻקֹּתַי
  choice: నా శాసనాలను
  rationale: స్థిరంగా విధించబడిన ఆజ్ఞలు లేదా శాసనాలు అనే న్యాయపరమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: వారి మనస్సు ... అసహ్యించుకుంది
  rationale: נפשׁ యొక్క అంతరంగ వ్యక్తిత్వ భావాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘మనస్సు’ వాడబడింది; ఏకవచన సమూహ నిర్మాణం కూడా నిలుపబడింది.
theological_decisions:
- issue: יִרְצוּ אֶת עֲוֺנָם లో עון అర్థం
  choice: తమ దోషానికి తగిన శిక్షను అంగీకరిస్తారు
  alternative: తమ దోషాన్ని అంగీకరిస్తారు; తమ దోషానికి పరిహారం చెల్లిస్తారు
  rationale: నిర్వాసం, ఒడంబడిక శాపం, దేశం పొందే విశ్రాంతి అనే సమీప సందర్భం శిక్షాఫల భావానికి మద్దతిస్తుంది. అయినా హెబ్రీ ప్రయోగంలో ఉన్న నిజమైన బహుఅర్థతను పాదసూచికలో కాపాడాం; స్వయంకృత ప్రాయశ్చిత్తం అనే సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని ఒడంబడిక-న్యాయ గాంభీర్యం నిలిచే విధంగా రూపొందించబడింది. ‘శబ్బతులు’ అనే అస్పష్ట రూపానికి బదులుగా భూమికి సంబంధించిన ‘విశ్రాంతి సంవత్సరాలు’ వాడబడింది.
