  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: te
  text: అప్పుడు నేను కూడా మీకు విరోధంగా[a] నడుస్తాను; నేనే మీ పాపాలనుబట్టి మిమ్మల్ని ఏడింతలు[b] దెబ్బతీస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రుత్వంతో’ లేదా ‘ప్రతికూలంగా.’ ఇక్కడ ‘విరోధంగా’ అని అనువదించిన హీబ్రూ పదం లేవీయకాండం 26లో పదేపదే వస్తూ, ఇశ్రాయేలీయులకూ యెహోవాకూ మధ్య ఉన్న పరస్పర విరోధ వైఖరిని వివరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ పాపాలనుబట్టి ఏడు సార్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: అప్పుడు నేను ... నడుచుకొని
  rationale: הלך అనే పదానికి మౌలికంగా ‘నడుచు/వెళ్లు’ అనే అర్థం ఉంది. ఈ అధ్యాయంలో పునరావృతమయ్యే నిబంధనా సంబంధమైన రూపకాన్ని నిలుపుతూ, వాక్యంలోని హెచ్చరికల క్రమాన్ని וְ సందర్భానుసారంగా ‘అప్పుడు’ అని వ్యక్తం చేశాం.
- source_word: אַף אֲנִי
  choice: నేను కూడా
  rationale: దేవుడు వారి వైఖరికి ప్రతిగా తాను కూడా చర్య తీసుకుంటాడనే పరస్పర భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: మీకు విరోధంగా
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, בקריతో కలిసి ఇక్కడ ప్రతికూల వైఖరిని సూచిస్తుంది. ‘మీకు విరోధంగా’ అనేది సహజంగా ఉండి, మూలంలోని పరస్పర విరోధ భావాన్ని నిలుపుతుంది.
- source_word: וְהִכֵּיתִי
  choice: దెబ్బతీస్తాను
  rationale: נכה శిక్షాత్మకంగా కొట్టడం లేదా దెబ్బతీయడం సూచిస్తుంది. ‘దెబ్బతీస్తాను’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, చర్య తీవ్రతను నిలుపుతుంది.
- source_word: גַּם אָנִי
  choice: నేను ... దెబ్బతీస్తాను
  rationale: హీబ్రూలోని రెండవ స్వీయ ఉద్ఘాటన దేవుడే నేరుగా చర్య తీసుకుంటాడని బలపరుస్తుంది. తెలుగులో కర్తను స్పష్టంగా ఉంచడం ద్వారా ఆ ఉద్ఘాటన సహజంగా వ్యక్తమవుతుంది; ‘నేనే’ అని పెంచడం సందర్భంలో అవసరానికి మించిన విరుద్ధార్థ ఛాయను కలిగించవచ్చు.
- source_word: שֶׁבַע
  choice: ఏడింతలు
  rationale: ఈ శిక్షా సూత్రంలో ఇది తీవ్రతను ఏడు రెట్లు పెంచడాన్ని సూచించే సంక్షిప్త, సహజ తెలుగు రూపం; కేవలం ఏడు వేర్వేరు సందర్భాలుగా అర్థాన్ని నిర్బంధించదు.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: మీ పాపాలనుబట్టి
  rationale: עַל ఇక్కడ శిక్షకు కారణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘మీ పాపాలనుబట్టి’ ఆ సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుడు మరియు ఇశ్రాయేలు మధ్య పరస్పర వైఖరిని తెలిపే בקרי అనే నిబంధనా-తీర్పు పదబంధం
  choice: విరోధంగా
  alternative: శత్రుత్వంతో / ప్రతికూలంగా
  rationale: ‘విరోధంగా’ అనేది ఈ అధ్యాయమంతటా కనిపించే పరస్పర ప్రతిఘటనను నిలుపుతుంది; దానిని కేవలం భావోద్వేగ శత్రుత్వంగా పరిమితం చేయదు.
- issue: שֶׁבַע అనే శిక్షా సూత్రంలోని సంఖ్యాత్మకత మరియు తీవ్రత
  choice: ఏడింతలు
  alternative: ఏడు సార్లు
  rationale: ‘ఏడింతలు’ మూలంలోని సంఖ్యా రూపాన్ని, శిక్ష తీవ్రతను రెండింటినీ నిలుపుతుంది; తప్పనిసరిగా ఏడు విడివిడి దెబ్బలుగా అర్థాన్ని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘నడుచుకొని’ అనే రూపకం అధ్యాయంలోని పునరావృత పదబంధాన్ని నిలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
