    text: అక్షరార్థంగా, “తినివేస్తుంది.” హీబ్రూ క్రియకు “తిను” అని అర్థం.
    reason: lexical_alternative
  revision_rationale: The revision strengthens lexical precision for ‘among the nations’ and ‘the land of your enemies’ while retaining the original’s metaphorical force and the draft’s clear, modern Telugu style. No theological interpretation has been added.
