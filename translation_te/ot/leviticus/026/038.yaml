  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: te
  text: మీరు దేశాల మధ్య నశించిపోతారు; మీ శత్రువుల భూమి మిమ్మల్ని మింగివేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తినివేస్తుంది.” హీబ్రూ క్రియకు “తిను” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: మీరు నశించిపోతారు
  rationale: Qal రూపంలోని אבד ఇక్కడ నిబంధన-శాపాల క్రమంలో కలిగే పరిణామాన్ని సూచిస్తుంది. ‘నశించిపోతారు’ అనేది హింసాత్మక వధను అవసరానికి మించి నిర్దిష్టం చేయకుండా వినాశం, అంతరించిపోవడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּגּוֹיִם
  choice: జనాల మధ్య
  rationale: גּוֹיִם అంటే జనాలు లేదా దేశాలు. చెదరగొట్టబడిన ప్రజలు ఇతర జనసమూహాల మధ్య ఉండే సందర్భానికి ‘జనాల మధ్య’ సహజంగా సరిపోతుంది; తరువాతి మతపరమైన ప్రత్యేకార్థాలను రుద్దదు.
- source_word: וְאָכְלָה
  choice: మింగివేస్తుంది
  rationale: אכל యొక్క అక్షరార్థం ‘తినడం.’ దేశం కర్తగా ఉన్న ఈ రూపకంలో ‘మింగివేస్తుంది’ అనే పదం నిర్మూలించే తీవ్రతను, దేశం వారిని తనలో కలిపేసే సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ప్రత్యక్ష కర్మ సూచికకు జతైన ద్వితీయ పురుష బహువచన ప్రత్యయాన్ని తెలుగులో సహజమైన కర్మరూపంగా ఇచ్చాం.
- source_word: אֶרֶץ
  choice: దేశం
  rationale: אֶרֶץ అంటే భూమి, దేశం లేదా ప్రదేశం కావచ్చు. ప్రవాసం మరియు శత్రువుల అధీనంలోని ప్రాంతం అనే సందర్భంలో ‘మీ శత్రువుల దేశం’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: אֹיְבֵיכֶם
  choice: మీ శత్రువుల
  rationale: ‘దేశం’ను విశేషించే నిర్మాణ సంబంధాన్ని తెలుగులో ‘మీ శత్రువుల దేశం’గా నేరుగా వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘దేశం మిమ్మల్ని తింటుంది’ అనే రూపకపు బలం
  choice: శత్రువుల దేశం ప్రవాసులను ‘మింగివేస్తుంది’ అనే నిబంధన-శాప రూపకాన్ని నిలుపడం
  alternative: ‘మీ శత్రువుల దేశం మిమ్మల్ని నాశనం చేస్తుంది’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠంలో సాధారణంగా ‘తిను’ అనే అర్థమిచ్చే క్రియను దేశమే కర్తగా తీసుకుంది. ‘మింగివేస్తుంది’ అని అనువదించడం శాపపు తీవ్రతను, సాహిత్య చిత్రాన్ని నిలుపుతుంది; దాని విధానాన్ని సిద్ధాంతపరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గంభీరంగా ఉండే శైలి. ‘జనాల మధ్య’ ప్రవాస సందర్భాన్ని సహజంగా తెలియజేస్తుంది. ‘మింగివేస్తుంది’ మూలంలోని సజీవ రూపకాన్ని కాపాడుతుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
