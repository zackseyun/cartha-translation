- from: మీరు జనాల మధ్య నశించిపోతారు; మీ శత్రువుల దేశం మిమ్మల్ని మింగివేస్తుంది.[a]
  to: మీరు దేశాల మధ్య నశించిపోతారు; మీ శత్రువుల భూమి మిమ్మల్ని మింగివేస్తుంది.[a]
