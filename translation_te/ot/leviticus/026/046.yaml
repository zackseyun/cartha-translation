reference: Leviticus 26:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: te
  text: యాహ్వే తనకూ ఇశ్రాయేలు కుమారులకూ మధ్య సీనాయి పర్వతంలో మోషే ద్వారా ఇచ్చిన శాసనాలు, న్యాయవిధులు, ధర్మనియమాలు ఇవే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “మోషే చేతి ద్వారా”; అంటే “మోషే ద్వారా.”
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవే
  rationale: సారాంశ ప్రకటనను ముగింపుగా సూచించే హీబ్రూ నిర్దేశక పదానికి సహజమైన తెలుగు రూపం.
- source_word: הַחֻקִּים
  choice: శాసనాలు
  rationale: స్థిరంగా విధించబడిన నియమాలు అనే న్యాయ-నిబంధన భావాన్ని కాపాడుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: న్యాయ తీర్పులు, చట్టబద్ధమైన నియమాలు అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַתּוֹרֹת
  choice: ధర్మశాస్త్రాలు
  rationale: బోధలు లేదా ఆదేశాలనే విస్తృత భావం ఉన్నప్పటికీ, ఈ న్యాయపదాల త్రయంలో అధికారిక ధర్మనియమాల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נָתַן
  choice: ఇచ్చిన
  rationale: נָתַן అనే క్రియకు నేరమైన అర్థాన్ని కాపాడి, మూలంలోని నిబంధన సంబంధ నిర్మాణాన్ని అనవసరంగా వివరణాత్మకం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠనంలో విస్తృతంగా గుర్తించబడే రూపంలో దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: తనకూ ఇశ్రాయేలు కుమారులకూ మధ్య
  rationale: నిబంధనలోని రెండు పక్షాల మధ్య సంబంధాన్ని, అలాగే హీబ్రూ ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని కాపాడుతుంది.
- source_word: בְּהַר סִינַי
  choice: సీనాయి పర్వతం మీద
  rationale: స్థల సూచనను మూలానికి సన్నిహితంగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే చేత
  rationale: మోషే మధ్యవర్తిత్వాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని తెలుగు ‘చేత’ ద్వారా సహజంగా అందిస్తుంది; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: יְהוָה అనే నిబంధన నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: בְּנֵי יִשְׂרָאֵל రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వంశ-నిబంధన వ్యక్తీకరణను ప్రధాన పాఠంలో కాపాడి, సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: త్రివిధ న్యాయపదాల భేదం
  choice: శాసనాలు, న్యాయవిధులు, ధర్మశాస్త్రాలు
  alternative: నియమాలు, తీర్పులు, బోధలు
  rationale: మూడు సమీపార్థక పదాలను ఒక్కటిగా కలపకుండా వాటి న్యాయ మరియు బోధనా ఛాయలను సాధ్యమైనంతవరకు వేరు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన నిబంధన-న్యాయ శైలిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదక్రమం వాడబడింది. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
