id: LEV.26.16
reference: Leviticus 26:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: te
  text: '“నేను కూడా మీకు ఇలా చేస్తాను: మీ మీదికి ఆకస్మిక భయాన్ని[a], క్షయింపజేసే వ్యాధిని[b], జ్వరాన్ని రప్పిస్తాను; అవి కళ్లను క్షీణింపజేసి ప్రాణాన్ని నీరసింపజేస్తాయి[c]. మీరు మీ విత్తనాన్ని వ్యర్థంగా విత్తుతారు; మీ శత్రువులు దానిని తింటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీ మీదికి భీతిని రప్పిస్తాను.” హీబ్రూ పదం భయాన్ని, కలవరాన్ని లేదా దిగ్భ్రాంతిని సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ఏ నిర్దిష్ట వ్యాధి ఉద్దేశించబడిందో అనిశ్చితం; శరీరాన్ని క్రమంగా క్షీణింపజేసే వ్యాధి అని భావం కావచ్చు.
    reason: lexical_uncertainty
  - marker: c
    text: 'అక్షరార్థానికి దగ్గరగా: “కళ్లను క్షయింపజేస్తూ, ప్రాణాన్ని నీరసింపజేస్తూ.” ఈ రెండు పదబంధాల ఖచ్చితమైన భావ ఛాయ అనిశ్చితం.'
    reason: textual_semantic_ambiguity
lexical_decisions:
- source_word: אַף אֲנִי
  choice: నేను కూడా
  rationale: אַף తో కూడిన స్వతంత్ర సర్వనామం కొనసాగింపుతోపాటు ఉద్ఘాటనను ఇస్తుంది. ‘నేను కూడా’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని ప్రతిచర్య భావాన్ని నిలుపుతుంది.
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: మీకు ఇలా చేస్తాను
  rationale: చర్య శ్రోతలపైకి మళ్లించబడుతున్న తీర్పు సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: మీ మీదికి ... రప్పిస్తాను
  rationale: פקד హిఫీల్ రూపం ఇక్కడ తీర్పును విధించడం లేదా మీదికి తేవడం అనే భావాన్ని ఇస్తుంది. ‘రప్పిస్తాను’ తెలుగులో స్పష్టంగా ఉండి, వ్యాధులను అధికారులుగా ‘నియమించడం’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: בֶּהָלָה
  choice: ఆకస్మిక భయం
  rationale: ఈ నామవాచకం భయం, భీతావహమైన కలవరం లేదా హఠాత్తుగా కలిగే దిగ్భ్రాంతిని సూచిస్తుంది. ‘ఆకస్మిక భయం’ ఆ రెండు కోణాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: הַשַּׁחֶפֶת
  choice: క్షయింపజేసే వ్యాధి
  rationale: నిర్దిష్ట ప్రాచీన వ్యాధి ఏదో అనిశ్చితం. ‘క్షయవ్యాధి’ అని అంటే క్షయరోగం/టిబిగా అతిగా నిర్దిష్టీకరించే ప్రమాదం ఉంది; అందువల్ల శరీరాన్ని క్రమంగా క్షీణింపజేసే అనారోగ్యంగా అనువదించబడింది.
- source_word: הַקַּדַּחַת
  choice: జ్వరం
  rationale: ఈ పదం జ్వరపు వేడిని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘జ్వరం’ స్పష్టమైన సమానార్థకం.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: కళ్లను క్షీణింపజేసి
  rationale: כלה రూపం ముగించివేయడం, క్షయింపజేయడం అనే భావాన్ని కలిగి ఉంది. వ్యాధివల్ల కళ్లు బలహీనపడే చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: ప్రాణాన్ని నీరసింపజేస్తాయి
  rationale: ఇది క్లిష్టమైన పదబంధం; נפש ఇక్కడ అమూర్తమైన ‘ఆత్మ’కన్నా జీవం లేదా జీవశక్తిని సూచిస్తుంది. ఈ అనువాదం శారీరక జీవశక్తి క్షీణతను తెలియజేస్తుంది.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: మీ విత్తనాన్ని వ్యర్థంగా విత్తుతారు
  rationale: לריק ఫలితం లేకుండా, వృథాగా అనే భావాన్ని ఇస్తుంది. మూలంలోని ‘విత్తనం/విత్తడం’ పదప్రయోగాన్ని తెలుగు నిలుపుతుంది.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: మీ శత్రువులు దానిని తింటారు
  rationale: హీబ్రూ సంధానాన్ని ‘మరియు’ అనే భావంతో విరామచిహ్నం ద్వారా నేరుగా కొనసాగిస్తూ, స్పష్టంగా లేని కారణార్థాన్ని చేర్చలేదు. క్రియలోని ప్రత్యయం విత్తనాన్ని లేదా దాని పంటను సూచిస్తుంది.
theological_decisions:
- issue: శాప సందర్భంలో נָפֶשׁ అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం; స్వయం
  rationale: ఇక్కడి శారీరక క్షీణత సందర్భంలో נֶפֶשׁ జీవం లేదా జీవశక్తిని సూచిస్తుంది. ‘ప్రాణం’ అని అనువదించడం అమూర్త ఆత్మ గురించి తరువాతి సిద్ధాంత భావనలను పాఠ్యంలోకి దిగుమతి చేయకుండా హీబ్రూ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభమైన శైలి. ప్రాచీన వ్యాధిని ఆధునిక వైద్య నిర్ధారణతో సమానీకరించలేదు. ‘నియమిస్తాను’ అనే అత్యంత రూపసామ్యమైన పదానికి బదులుగా సందర్భోచితమైన ‘రప్పిస్తాను’ వాడబడింది; కవితాత్మక శరీర-క్షీణత చిత్రాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
