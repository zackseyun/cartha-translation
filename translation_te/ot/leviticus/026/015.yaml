id: LEV.26.15
reference: Leviticus 26:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: te
  text: మీరు నా శాసనాలను తిరస్కరిస్తే, మీ అంతరంగం[a] నా న్యాయవిధులను[b] అసహ్యించుకుంటే, నా ఆజ్ఞలన్నిటినీ పాటించకుండా, నా నిబంధనను భంగపరుస్తే[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ ప్రాణం అసహ్యించుకుంటే”; అంటే, “మీ సర్వస్వం అసహ్యించుకుంటే.”
    reason: lexical_alternative
  - marker: b
    text: “నా న్యాయవిధులు” అనే మాటను “నా నియమాలు” లేదా “నా శాసనవిధులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నా నిబంధనను ఉల్లంఘిస్తే.” హెబ్రీయ నిర్మాణం ఉద్దేశాన్ని లేదా పరిణామాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: నా శాసనాలను
  rationale: חֻקִּים నిర్దేశించబడిన చట్టాలు లేదా శాసనాలను సూచిస్తుంది. ‘శాసనాలు’ నిబంధనాత్మక-చట్టపరమైన ధోరణిని నిలుపుతూ, తరువాత వచ్చే מִשְׁפָּטִים నుండి దీనిని వేరుచేస్తుంది.
- source_word: תִּמְאָסוּ
  choice: తిరస్కరిస్తే
  rationale: מאס తృణీకారంతో కూడిన నిరాకరణను సూచిస్తుంది. ‘తిరస్కరిస్తే’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, నిబంధన హెచ్చరిక సందర్భానికి సరిపోతుంది.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: מִשְׁפָּטִים న్యాయనిర్ణయాలు లేదా చట్టపరమైన విధులను సూచిస్తుంది. ‘న్యాయవిధులు’ మూలంలోని న్యాయపరమైన భావాన్ని నిలుపుతూ ‘శాసనాలు’ నుండి భేదాన్ని కాపాడుతుంది.
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: మీ అంతరంగం అసహ్యించుకుంటే
  rationale: געל తీవ్రంగా అసహ్యించుకోవడం లేదా ఏవగించుకోవడం అనే భావాన్ని ఇస్తుంది; נֶפֶשׁ వ్యాకరణపరంగా కర్త. ‘మీ అంతరంగం’ అనే రూపం హెబ్రీయ వ్యక్తీకరణలోని తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: దాని ఫలితంగా ... పాటించకుండా
  rationale: ఈ నిర్మాణం ఫలితం లేదా ఉద్దేశాన్ని తెలియజేయగలదు. సందర్భంలో అసహ్యం అవిధేయతకు దారితీసే భావాన్ని ‘దాని ఫలితంగా ... పాటించకుండా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל מִצְוֺתַי
  choice: నా ఆజ్ఞలన్నిటినీ
  rationale: מִצְוֹת ఆజ్ఞలను సూచిస్తుంది. ‘ఆజ్ఞలు’ స్పష్టమైన ఆధునిక తెలుగు పదం; ‘శాసనాలు,’ ‘న్యాయవిధులు’ అనే ఇతర నిబంధన-చట్ట పదాల నుండి భేదాన్ని నిలుపుతుంది.
- source_word: לְהַפְרְכֶם
  choice: భంగం చేస్తే
  rationale: פרר యొక్క హిఫీల్ రూపం నిబంధనను రద్దుచేయడం, ఉల్లంఘించడం లేదా భంగపరచడం అనే భావాన్ని ఇస్తుంది. ‘భంగం చేయడం’ నిబంధన బంధాన్ని చెరపడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית స్థిరమైన నిబంధనాత్మక పదం. ‘నిబంధన’ తెలుగు బైబిలు పరిభాషలో చట్టపరమైన, సంబంధపరమైన ఒడంబడిక భావాన్ని మోస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ అనే మానవ స్వరూప పదాన్ని నుడికారంలో నిలుపడం
  choice: మీ అంతరంగం అసహ్యించుకుంటే
  alternative: మీ ప్రాణం అసహ్యించుకుంటే / మీరు మీ సర్వస్వంతో అసహ్యించుకుంటే
  rationale: మూలంలో נֶפֶשׁ స్పష్టంగా కర్తగా ఉంది. తెలుగులో ‘మీ ప్రాణం అసహ్యించుకుంటే’ అసహజంగా వినిపించవచ్చు; ‘మీ అంతరంగం’ మూలంలోని అంతర్గత, సంపూర్ణ విరక్తిని నిలుపుతుంది. ఇది ‘ఆత్మ’ గురించి ప్రత్యేక సిద్ధాంతాన్ని వాక్యంలోకి దిగుమతి చేయదు.
- issue: నిబంధన ధర్మశాస్త్రానికి సంబంధించిన పదాల మధ్య భేదం
  choice: శాసనాలు / న్యాయవిధులు / ఆజ్ఞలు / నిబంధన
  alternative: కట్టడలు / తీర్పులు / ఆదేశాలు / ఒడంబడిక
  rationale: వచనం అనేక భిన్నమైన చట్టపరమైన-నిబంధనాత్మక పదాలను వరుసగా ఉపయోగిస్తుంది. వాటిని ఒకే సాధారణ పదంలో కలపకుండా తెలుగులో సాధ్యమైనంతవరకు వేరు చేయడం మూలపాఠపు నిర్మాణాన్ని కాపాడుతుంది.
- issue: לְבִלְתִּי మరియు לְהַפְרְכֶם మధ్య ఉద్దేశం-ఫలితం సంబంధం
  choice: దాని ఫలితంగా ... పాటించకుండా ... భంగం చేస్తే
  alternative: పాటించకూడదనే ఉద్దేశంతో ... భంగం చేస్తే
  rationale: హెబ్రీయ నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటినీ అనుమతిస్తుంది. సందర్భంలో తిరస్కారం, అసహ్యం అవిధేయత మరియు నిబంధన భంగానికి దారితీసే వరుసను ప్రధాన పాఠం చూపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచిక గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిబంధన-చట్ట శైలిని ఉపయోగించాం. ఈ వాక్యం ముందున్న షరతుల కొనసాగింపుగా ఉండటంతో చివర దీర్ఘవిరామ చిహ్నం ఉంచాం. ‘పాటించు’ సాధారణ పాఠకునికి సహజంగా ఉండగా, ఆజ్ఞలకు విధేయత చూపే భావాన్ని స్పష్టంగా అందిస్తుంది.
