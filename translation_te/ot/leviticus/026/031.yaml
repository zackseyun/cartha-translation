source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: te
  text: మీ పట్టణాలను శిథిలాలుగా చేస్తాను; మీ పవిత్రస్థలాలను నిర్జనంగా చేస్తాను; మీ అర్పణల ఆహ్లాదకరమైన సువాసనను నేను వాసన చూడను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “మీ ఆహ్లాదకరమైన సువాసనను నేను వాసన చూడను.” ఇది దేవుడు అర్పణలను అంగీకరించడాన్ని సూచించే స్థిరమైన బలి-సంబంధ భావప్రయోగం; స్పష్టత కోసం “అర్పణల” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־עָרֵיכֶם חָרְבָּה
  choice: మీ పట్టణాలను శిథిలాలుగా చేస్తాను
  rationale: נתן ఇక్కడ חָרְבָּה అనే ఫలితస్థితితో కలిసి కారణార్థకంగా ‘శిథిలాలుగా చేయడం’ అనే భావాన్ని ఇస్తుంది. עָרִיםకు ‘పట్టణాలు’ సహజమైన విస్తృత తెలుగు పదం.
- source_word: וַהֲשִׁמּוֹתִי
  choice: పాడుచేస్తాను
  rationale: שׁמם హిఫిల్ రూపం ఏదినైనా నిర్జనంగా, పాడుగా చేయడాన్ని సూచిస్తుంది; ‘పాడుచేస్తాను’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని కారణార్థక బలాన్ని నిలుపుతుంది.
- source_word: מִקְדְּשֵׁיכֶם
  choice: మీ పవిత్రస్థలాలను
  rationale: מִקְדָּשׁ బహువచనం పవిత్రమైన ఆరాధనా స్థలాలను సూచిస్తుంది. ‘పవిత్రస్థలాలు’ బహువచనాన్ని, ఆరాధనా సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְלֹא אָרִיחַ
  choice: నేను పీల్చను
  rationale: ריח క్రియలోని ప్రత్యక్ష ఘ్రాణచిత్రాన్ని ‘పీల్చను’ నిలుపుతుంది; దానిని కేవలం ‘అంగీకరించను’గా వ్యాఖ్యానించి మార్చలేదు.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: మీ అర్పణల సువాసనను
  rationale: רֵיחַ נִיחֹחַ బలి ఆరాధనలో స్థిరంగా వాడే ‘ఆహ్లాదకరమైన/సువాసన’ భావప్రయోగం. ‘మీ సువాసన’ అని మాత్రమే అంటే ప్రజల శరీరసువాసనగా అపార్థం కావచ్చు కాబట్టి సందర్భంలో అంతర్లీనంగా ఉన్న అర్పణలను స్పష్టం చేశాం.
theological_decisions:
- issue: చివరి ఉపవాక్యంలోని ఘ్రాణ సంబంధ మానవరూప భాషను యథాతథంగా ఉంచాలా, లేక ‘అంగీకరించను’ అని అర్థాన్ని మాత్రమే చెప్పాలా
  choice: ‘మీ అర్పణల సువాసనను నేను పీల్చను’ అని ఘ్రాణచిత్రాన్ని నిలుపడం
  alternative: ‘మీ అర్పణలను నేను అంగీకరించను’
  rationale: హీబ్రూ పాఠం ‘వాసన చూడడం/పీల్చడం’ అనే క్రియను, బలులకు సంబంధించిన స్థిరమైన ‘సువాసన’ ప్రయోగాన్ని స్పష్టంగా వాడుతుంది. ఈ రూపకాన్ని నిలపడం పాఠంలోని ఆరాధనా, దైవశాస్త్ర సంబంధ ఉద్వేగాన్ని సంరక్షిస్తుంది; అర్పణలను దేవుడు తిరస్కరిస్తాడనే అంతర్భావాన్ని అనువాదంలో పూర్తిగా ప్రత్యామ్నాయంగా పెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. సమాంతర హెచ్చరిక వాక్యాల బలాన్ని నిలుపుతూ, ‘పవిత్రస్థలాలు’ అనే బహువచనాన్ని సంరక్షించాం. ప్రధాన పాఠంలో [a] సూచికను సంబంధిత చివరి ఉపవాక్యం తరువాత ఉంచాం.
