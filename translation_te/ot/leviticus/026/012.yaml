id: LEV.26.12
reference: Leviticus 26:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: te
  text: నేను మీ మధ్య సంచరిస్తాను; మీకు దేవుడిగా ఉంటాను, మీరు నాకు ప్రజలుగా ఉంటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: సంచరిస్తాను
  rationale: హిత్పయేల్ రూపం ప్రజల మధ్య దేవుని కదలికతో కూడిన సన్నిధిని సూచిస్తుంది. ‘సంచరిస్తాను’ అనే పదం ఆ స్పష్టమైన రూపకాన్ని నిలుపుతుంది; ‘నివసిస్తాను’ అనడం మూల క్రియ భావాన్ని మించి వ్యాఖ్యానించినట్లవుతుంది.
- source_word: בְּתוֹכְכֶם
  choice: మీ మధ్య
  rationale: ఈ పదబంధానికి ‘మీ నడుమ/మీ మధ్య’ అనే సామూహిక అర్థం ఉంది. ‘మీ మధ్య’ సహజమైన ఆధునిక తెలుగు; ‘మీలో’ అంటే వ్యక్తుల అంతరంగంలో నివాసం అనే భావం కలగవచ్చు.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉంటాను
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని ‘మీకు దేవుడిగా ఉంటాను’ అనే నిబంధన సంబంధ భావాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: לֵאלֹהִים
  choice: దేవుడు
  rationale: ఇశ్రాయేలుతో నిబంధన సందర్భంలో אֱלֹהִים ఏదో ఒక దేవతను కాక, నిబంధనలోనున్న ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: మీరు నాకు ప్రజలుగా ఉంటారు
  rationale: మూలంలోని పరస్పర నిబంధన సూత్రాన్ని, దాని ‘నాకు ప్రజలుగా’ అనే సంబంధ నిర్మాణంతో సహా, సహజంగా మరియు నిష్ఠగా తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధన సూత్రం యొక్క అనువాదం
  choice: ‘మీకు దేవుడిగా ఉంటాను, మీరు నాకు ప్రజలుగా ఉంటారు’ అని పరస్పర నిబంధన సంబంధాన్ని వ్యక్తం చేయడం.
  alternative: ‘నేను మీ దేవుణ్ణి అవుతాను, మీరు నా ప్రజలవుతారు.’
  rationale: ఎంచుకున్న రూపం హీబ్రూలోని לְ (‘కు/కొరకు’) నిర్మాణాన్ని, సంబంధంలోని పరస్పరతను స్పష్టంగా నిలుపుతుంది; అదనపు సిద్ధాంత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘సంచరిస్తాను’ దేవుని సన్నిధికి సంబంధించిన మూర్తమైన నడక/కదలిక రూపకాన్ని కాపాడుతుంది. మూలపాఠంలో ప్రత్యేక పాఠాంతర సందిగ్ధత లేనందున పాదటిప్పణి అవసరం లేదు.
