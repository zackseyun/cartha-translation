  terminology: Use “సబ్బాతులను” for the sacred Sabbaths rather than the generic “విశ్రాంతి దినాలను.” “పరిశుద్ధస్థలం,” “భయభక్తి,” and “యహ్వే” are suitable and maintain an appropriately reverent register.
