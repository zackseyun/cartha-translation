id: LEV.26.2
reference: Leviticus 26:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: te
  text: మీరు నా సబ్బాతులను ఆచరించాలి; నా పరిశుద్ధస్థలం పట్ల భయభక్తి కలిగి ఉండాలి.[a] నేను యహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పరిశుద్ధస్థలానికి భయపడాలి,’ లేదా ‘నా పరిశుద్ధస్థలం పట్ల విస్మయంతో గౌరవం చూపాలి.’ హీబ్రూ క్రియ సందర్భానుసారం భయం, భక్తిపూర్వక గౌరవం, లేదా విస్మయాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: నా విశ్రాంతి దినాలను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన రూపాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, యహ్వేకు చెందిన సమస్త విశ్రాంతి కాలాల విస్తృతిని నిలుపుతుంది.
- source_word: תִּשְׁמֹרוּ
  choice: ఆచరించాలి
  rationale: ఆజ్ఞలు లేదా పవిత్ర కాలాల సందర్భంలో שׁמרకు జాగ్రత్తగా పాటించడం, ఆచరించడం అనే భావం ఉంది; ‘ఆచరించాలి’ తెలుగులో సహజంగా ఆ విధేయతను తెలియజేస్తుంది.
- source_word: וּמִקְדָּשִׁי
  choice: నా పరిశుద్ధస్థలం
  rationale: מִקְדָּשׁ దేవునికి ప్రత్యేకించబడిన పవిత్ర నివాసస్థలాన్ని సూచిస్తుంది; ‘పరిశుద్ధస్థలం’ స్పష్టమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: תִּירָאוּ
  choice: భయభక్తులు కలిగి ఉండాలి
  rationale: ירא ఇక్కడ భయం, భక్తి, విస్మయపూర్వక గౌరవం అనే భావవిస్తృతిని కలిగి ఉంది; ‘భయభక్తులు’ కేవలం భీతిని సూచించకుండా పవిత్ర గౌరవాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేను యహ్వేను
  rationale: హీబ్రూ స్వీయ-గుర్తింపు సూత్రంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యిరా (ירא) క్రియకు పరిశుద్ధస్థల సందర్భంలో ఉన్న భావం
  choice: భయభక్తులు కలిగి ఉండాలి
  alternative: భయపడాలి; విస్మయంతో గౌరవించాలి
  rationale: హీబ్రూ పదంలోని భయం, భక్తిపూర్వక గౌరవం, విస్మయం అనే భావసంభావ్యతలను ప్రధాన పాఠంలో సహజంగా కలిపి ఉంచుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఆజ్ఞాత్మకమైన మరియు గౌరవప్రదమైన శైలిని పాటించింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత వాక్యభాగం వెంట ఉంచబడింది.
