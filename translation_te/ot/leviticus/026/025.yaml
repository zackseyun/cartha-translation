reference: Leviticus 26:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: te
  text: నేను మీ మీదికి నిబంధనకు సంబంధించిన ప్రతీకారాన్ని తీర్చే ఖడ్గాన్ని రప్పిస్తాను[a]. మీరు మీ పట్టణాల్లోకి కూడగట్టబడతారు. అప్పుడు నేను మీ మధ్య మహమ్మారిని పంపుతాను; మీరు శత్రువు చేతికి అప్పగించబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా, “నిబంధన ప్రతీకారానికి ప్రతీకారం తీర్చే ఖడ్గం” అనే బలమైన పదప్రయోగం ఉంది. దీనిని “నిబంధన తరఫున ప్రతీకారం తీర్చే,” “నిబంధన యొక్క ప్రతీకారాన్ని అమలు చేసే,” లేదా మరింత సులభంగా “నిబంధనకు ప్రతీకారం తీర్చే” అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ నిర్మాణం నిబంధనకూ ప్రతీకారానికీ మధ్య ఉన్న సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది; అదే మూలానికి చెందిన క్రియా-నామ పదజోడు ప్రతీకార చర్యను బలపరుస్తుంది.
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם חֶרֶב
  choice: నేను మీ మీదికి ఖడ్గాన్ని రప్పిస్తాను
  rationale: హిఫీల్ రూపంలోని בוא కారణార్థాన్ని సూచిస్తుంది. తీర్పు సందర్భంలో עַל‌కు ‘మీ మీదికి’ సహజమైన ప్రతికూల భావాన్ని ఇస్తుంది; ‘రప్పిస్తాను’ దేవుడే ఖడ్గాన్ని వచ్చేలా చేస్తాడనే భావాన్ని నిలుపుతుంది.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: అది నిబంధనకు సంబంధించిన ప్రతీకారాన్ని తీర్చే ఖడ్గం
  rationale: క్రియావిశేషణ రూపం మరియు అదే మూలానికి చెందిన నామవాచకం కలిపి ప్రతీకార చర్యను బలపరుస్తాయి. తెలుగులో అసహజమైన పదపునరుక్తిని చేయకుండా ‘ప్రతీకారాన్ని తీర్చే’ అని ఇచ్చి, בְּרִית‌తోనున్న సంబంధంలోని నిజమైన విస్తృతిని ‘నిబంధనకు సంబంధించిన’ అని నిలుపుకుంది.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: మీరు మీ పట్టణాల్లోకి సమకూర్చబడతారు
  rationale: నిఫాల్ రూపంలోని క్రియకు ఉన్న కర్మణి భావాన్ని నిలుపుతూ, ముట్టడి సమయంలో ప్రజలు పట్టణాల్లోకి చేరవేయబడే సందర్భాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: అప్పుడు నేను మీ మధ్యకు అంటువ్యాధిని పంపుతాను
  rationale: דֶבֶר నిబంధన శాపాల సందర్భంలో వ్యాపించే తీవ్రమైన మహమ్మారి లేదా అంటువ్యాధిని సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘అంటువ్యాధి’ ఎంచుకుంది; వావ్ సందర్భానుసార క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: మీరు శత్రువు చేతికి అప్పగించబడతారు
  rationale: నిఫాల్ కర్మణి రూపాన్ని ‘అప్పగించబడతారు’ నిలుపుతుంది. ‘చేతికి’ అనే ప్రయోగం శత్రువు అధికారానికి లోబడటాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: ‘నిబంధన ప్రతీకారం’ యొక్క భావం
  choice: నిబంధనకు సంబంధించిన ప్రతీకారం
  alternative: నిబంధన తరఫున ప్రతీకారం; నిబంధనను ఉల్లంఘించినందుకు ప్రతీకారం; నిబంధనలో నిర్దేశించిన శిక్ష
  rationale: హీబ్రూ నిర్మాణం నిబంధనను ఈ దైవిక ప్రతీకారానికి ఆధారంగా లేదా సంబంధిత అంశంగా చూపుతుంది; కానీ ఆ సంబంధాన్ని ఒక్క విధంగా మాత్రమే నిర్ధారించదు. అందువల్ల ప్రధాన పాఠం ఆ భావవిస్తృతిని నిలుపుతుంది; పాదసూచిక సాధ్యమైన అర్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన తీర్పు స్వరాన్ని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడింది. ‘ఖడ్గం,’ ‘నిబంధన,’ ‘ప్రతీకారం’ వంటి బైబిలు-న్యాయపర పదాలను నిలుపగా, ‘అంటువ్యాధి’ ద్వారా דֶבֶר యొక్క సందర్భార్థాన్ని స్పష్టంచేసింది.
