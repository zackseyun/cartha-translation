revisions:
- from: అయినా, వారు తమ శత్రువుల దేశంలో ఉన్నప్పుడు కూడా, వారిని పూర్తిగా నాశనం చేయడానికిగానీ, వారితో నేను చేసిన నిబంధనను భంగం చేయడానికిగానీ నేను వారిని తిరస్కరించను, వారిని అసహ్యించుకోను; ఎందుకంటే నేనే వారి దేవుడైన యెహోవాను.[a]
  to: అయినా, వారు తమ శత్రువుల దేశంలో ఉన్నప్పుడు కూడా, వారిని పూర్తిగా నాశనం చేయడానికి, వారితో నా నిబంధనను రద్దు చేయడానికి నేను వారిని తిరస్కరించను, అసహ్యించుకోను; ఎందుకంటే నేను యాహ్వేను; నేను వారి దేవుడను.
  rationale: The revision retains the Hebrew’s concessive force and the future-oriented covenant assurance, while correcting the final divine self-identification. It also renders the covenant verb with a more precise modern Telugu expression. No footnote is necessary because the revised text directly renders the divine name as supplied in the English POB audit trail.
