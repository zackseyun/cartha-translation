id: LEV.26.44
reference: Leviticus 26:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: te
  text: అయినా, వారు తమ శత్రువుల దేశంలో ఉన్నప్పుడు కూడా, వారిని పూర్తిగా నాశనం చేయడానికి, వారితో నా నిబంధనను రద్దు చేయడానికి నేను వారిని తిరస్కరించను, అసహ్యించుకోను; ఎందుకంటే నేను యాహ్వేను; నేను వారి దేవుడను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: అయినా... కూడా
  rationale: ముందు చెప్పిన తీర్పులకు విరుద్ధంగా నిలిచే బలమైన concessive భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: వారు తమ శత్రువుల దేశంలో ఉన్నప్పుడు
  rationale: ב + infinitive construct యొక్క కాలసంబంధ భావాన్ని, construct chain సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא מְאַסְתִּים
  choice: నేను వారిని తిరస్కరించను
  rationale: מָאַס ఇక్కడ నిబంధనాత్మక సంబంధంలో తోసివేయడం లేదా నిరాకరించడం అనే భావం ఇస్తుంది; ‘తిరస్కరించను’ సాధారణ పాఠకులకు స్పష్టం.
- source_word: וְלֹא גְעַלְתִּים
  choice: వారిని అసహ్యించుకోను
  rationale: גָּעַל యొక్క బలమైన విరక్తి/ఏవగింపు భావాన్ని సహజమైన గౌరవప్రద తెలుగులో తెలియజేస్తుంది.
- source_word: לְכַלֹּתָם
  choice: వారిని పూర్తిగా నాశనం చేయడానికి
  rationale: כָּלָה యొక్క అంతం చేయడం, పూర్తిగా నిర్మూలించడం అనే భావాన్ని నిలుపుతుంది; లామెడ్‌ను ఉద్దేశం/ఫలితంగా వ్యక్తం చేస్తుంది.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: వారితో నేను చేసిన నిబంధనను భంగం చేయడానికి
  rationale: הֵפֵר + בְּרִית్ యొక్క నిబంధనను రద్దు చేయడం లేదా చెరపడం అనే భావాన్ని ‘భంగం చేయడం’ సంక్షిప్తంగా అందిస్తుంది; ‘నేను చేసిన’ అనేది తెలుగులో సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: ఎందుకంటే నేనే వారి దేవుడైన యెహోవాను
  rationale: כִּי యొక్క కారణార్థాన్ని నిలిపి, నిబంధనకు ఆధారమైన దైవ స్వపరిచయాన్ని ముందుకు తెస్తుంది; יהוהను పేరుగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచింది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; మరింత ప్రత్యక్ష పండిత లిప్యంతరీకరణను పాదసూచికలో తెలిపింది.
- issue: מְאַסְתִּים / גְעַלְתִּים అనే qatal క్రియల కాలదృష్టి
  choice: వర్తమాన-భవిష్య నిబద్ధతను తెలిపే ‘తిరస్కరించను... అసహ్యించుకోను’
  alternative: ‘తిరస్కరించలేదు... అసహ్యించుకోలేదు’
  rationale: రూపపరంగా qatal అయినప్పటికీ, సందర్భం ముందుగా ఊహించిన శత్రుదేశ స్థితిలో దేవుని నిలకడైన నిబంధన నిబద్ధతను చెబుతుంది. తెలుగు non-past రూపం ఈ వాగ్దాన/నిరంతర భావాన్ని కఠినమైన కాలనిర్ణయం చేయకుండా అందిస్తుంది.
- issue: לְכַלֹּתָם మరియు לְהָפֵר మధ్య సంబంధం
  choice: రెండు సమాంతర ఉద్దేశ/ఫలిత పదబంధాలుగా ‘...చేయడానికిగానీ ...చేయడానికిగానీ’
  alternative: మొదటిదాన్ని మాత్రమే అసహ్యించుకోవడంతో, రెండవదాన్ని నాశనంతో అనుసంధానించడం
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని వరుస infinitive పదబంధాల అనుసంధానంలో కొంత పరిధి అస్పష్టత ఉంది. తెలుగు రూపం రెండింటినీ దేవుని తిరస్కారం/అసహ్యానికి నిరాకరించబడిన పరిణామాలుగా చదవడానికి వీలు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే నిబంధనాత్మక గంభీరతను కాపాడే శైలి. ‘నిబంధన’, ‘భంగం’ వంటి స్థిరమైన ధార్మిక పదాలను ఉపయోగించి, వాక్యాన్ని అతిగా సంస్కృతీకరించలేదు.
