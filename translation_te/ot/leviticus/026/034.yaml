  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: te
  text: అప్పుడు, మీరు మీ శత్రువుల దేశంలో ఉన్న కాలంలో, ఆ దేశం పాడై ఉన్న రోజులన్నిటిలో తన సబ్బాతు విశ్రాంతులను తిరిగి పొందుతుంది[a]. అప్పుడు ఆ దేశం విశ్రమించి, తన సబ్బాతు విశ్రాంతులను తిరిగి పొందుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సబ్బాతు విశ్రాంతులను అనుభవిస్తుంది.’ ఇక్కడ హీబ్రూ క్రియకు, నిర్లక్ష్యం చేయబడిన విశ్రాంతులు భూమికి తిరిగి దక్కడం, అంటే దానికి రావలసినవి పొందడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందు చెప్పిన తీర్పు ఫలితంగా సంభవించేదాన్ని సూచించే సహజమైన కాలవాచక పదం.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: పరిహారం పొందుతుంది
  rationale: ఈ సందర్భంలో నిరాకరించబడిన విశ్రాంతి కాలాలు భూమికి తిరిగి లభించడం, అంటే దానికి రావలసినది చెల్లించబడడం అనే భావాన్ని తెలియజేస్తుంది. రెండు చోట్లా ఒకే మూలపదాన్ని ఒకే విధంగా అనువదించాం.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: ఇక్కడ మొత్తం భూమండలం కాక, ఇశ్రాయేలీయులకు సంబంధించిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది.
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: తన విశ్రాంతి సంవత్సరాలకు
  rationale: సందర్భంలో ప్రధానంగా దేశానికి నియమించబడిన సబ్బాతు సంవత్సరాలను సూచిస్తుంది; సాధారణ పాఠకునికి అర్థమయ్యేలా భావాన్ని స్పష్టం చేశాం.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: పాడుగా ఉన్న రోజులన్నిటిలో
  rationale: దేశం జనావాసం, సాగు లేక పాడుగా ఉండే పూర్తి కాలవ్యవధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: మీరు మీ శత్రువుల దేశంలో ఉన్నంతకాలం
  rationale: ఈ వాక్యభాగం దేశం పాడుగా ఉండే కాలానికి సమాంతరమైన పరిస్థితిని సూచిస్తుంది; ‘ఉన్నంతకాలం’ ఆ కాలసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: תִּשְׁבַּת
  choice: విశ్రమిస్తుంది
  rationale: సాగు నిలిచిపోవడం ద్వారా దేశం విశ్రాంతి పొందుతుందనే సబ్బాతు భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రవాస తీర్పులో దేశానికి దాని విశ్రాంతి కాలాలతో ఉన్న సంబంధం
  choice: నిర్లక్ష్యం చేయబడిన విశ్రాంతి సంవత్సరాలకు దేశం పరిహారం పొందుతుంది
  alternative: దేశం తన విశ్రాంతి సంవత్సరాలను అనుభవిస్తుంది / వాటిలో సంతోషిస్తుంది
  rationale: సందర్భం ఒడంబడిక తీర్పు మరియు పాటించని భూమి విశ్రాంతుల గురించి ఉంది. ‘పరిహారం పొందుతుంది’ అనేది దేశానికి రావలసిన విశ్రాంతి తిరిగి లభిస్తుందనే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది; భావోద్వేగపూరితమైన ‘సంతోషిస్తుంది’ అనే అర్థాన్ని బలవంతంగా రుద్దదు. ప్రత్యామ్నాయ భావాన్ని పాదటీపులో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘సబ్బాతులు’ అనే అస్పష్టమైన రూపానికి బదులుగా సందర్భానుసారంగా ‘విశ్రాంతి సంవత్సరాలు’ వాడాం. హీబ్రూ పునరుక్తిని, దేశం వ్యక్తిలా విశ్రమించి పరిహారం పొందుతుందనే రూపకాన్ని నిలిపాం.
