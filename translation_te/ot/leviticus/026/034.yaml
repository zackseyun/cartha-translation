  naturalness: ‘పాడై ఉన్న రోజులన్నిటిలో’ మరియు ‘మీ శత్రువుల దేశంలో ఉన్న కాలంలో’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. పునరావృతమైన క్రియను రెండు చోట్లా ఒకే విధంగా ఉంచడం హీబ్రూ సమాంతరతను ప్రతిబింబిస్తుంది.
