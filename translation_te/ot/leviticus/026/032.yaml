id: LEV.26.32
reference: Leviticus 26:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: te
  text: నేనే ఆ దేశాన్ని పాడుబడేలా చేస్తాను; దానిలో నివసించే మీ శత్రువులు దాన్ని చూసి దిగ్భ్రాంతి చెందుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విస్తుపోతారు,’ లేదా ‘భయభ్రాంతులవుతారు.’ విధ్వంసమైన స్థితికి ప్రతిస్పందనగా కలిగే దిగ్భ్రాంతితో కూడిన విస్తుపోవడాన్ని హెబ్రీ క్రియ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: పాడుబడేలా చేస్తాను
  rationale: שׁמם ధాతువు causative రూపంలో దేశాన్ని నిర్జనంగా లేదా ధ్వంసమైన స్థితికి తీసుకురావడాన్ని సూచిస్తుంది. ‘పాడుబడేలా చేస్తాను’ ఆధునిక తెలుగులో సహజంగా ఉండి causative భావాన్ని నిలుపుతుంది.
- source_word: אֲנִי
  choice: నేనే
  rationale: క్రియలో ఇప్పటికే కర్త సూచించబడినప్పటికీ స్వతంత్ర సర్వనామం రావడం ఉద్ఘాటనను ఇస్తుంది. ‘నేనే’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: ఈ నిబంధన-శిక్ష సందర్భంలో ఇది భూమి మొత్తాన్ని కాక ఇశ్రాయేలీయులకు సంబంధించిన దేశాన్ని సూచిస్తుంది. ‘ఆ దేశం’ సందర్భోచితమైన నిర్దిష్టతను ఇస్తుంది.
- source_word: וְשָׁמְמוּ
  choice: దిగ్భ్రాంతి చెందుతారు
  rationale: simple stem లో שׁמם పాడైపోవడం అనే భావంతో పాటు విధ్వంసాన్ని చూసి విస్తుపోవడం లేదా భయభ్రాంతి చెందడం అనే ప్రతిస్పందనను కూడా సూచించగలదు. ఇక్కడ కర్తలు దేశంలో నివసించే శత్రువులు కాబట్టి వారి దిగ్భ్రాంతికర ప్రతిస్పందనే సందర్భానికి సరిపోతుంది.
- source_word: עָלֶיהָ
  choice: దాన్ని చూసి
  rationale: שׁמם తో వచ్చిన עַל దిగ్భ్రాంతికి కారణమైన దానిని సూచిస్తుంది. తెలుగులో ‘దాన్ని చూసి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ఇది చూడటం అనే వివరాన్ని ప్రధాన అంశంగా చేయకుండా విధ్వంసమైన దేశమే వారి ప్రతిస్పందనకు కారణమని తెలుపుతుంది.
- source_word: אֹיְבֵיכֶם
  choice: మీ శత్రువులు
  rationale: రెండవ పురుష బహువచన స్వామ్యంతో ఉన్న నామవాచకానికి సూటి, సహజ అనువాదం.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: దానిలో నివసించే
  rationale: ישׁב participle అక్కడ స్థిరంగా ఉండడం లేదా నివసించడాన్ని సూచిస్తుంది. ‘నివసించే’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైనది.
theological_decisions:
- issue: నిబంధన-శిక్ష సందర్భంలో הָאָרֶץ దేనిని సూచిస్తుంది
  choice: ఆ దేశం—సందర్భంలో ఇశ్రాయేలు/కనాను దేశం
  alternative: భూమి
  rationale: సమీప సందర్భం ఇశ్రాయేలు దేశంపై వచ్చే నిబంధన శాపాల గురించి మాట్లాడుతుంది. ‘దేశం’ అని అనువదించడం మూలపాఠం ఉద్దేశించని విశ్వవ్యాప్త తీర్పు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘నేనే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. రెండు వాక్యభాగాలను semicolon తో సమన్వయంగా ఉంచడం వల్ల హెబ్రీ וְ యొక్క సాధారణ సంధాన భావం నిలిచి, మూలంలో స్పష్టంగా లేని ఉద్దేశం లేదా ఫలిత సంబంధం చేర్చబడలేదు.
