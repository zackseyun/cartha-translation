source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: te
  text: మీరు మీ కుమారుల మాంసాన్ని తింటారు; మీ కుమార్తెల మాంసాన్ని కూడా తింటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: మీరు ... తింటారు
  rationale: אכל అనే ధాతువు యొక్క ఖల్ రూపం, రెండవ పురుష బహువచనం. నిబంధన శాపాల సందర్భంలో భవిష్యత్ ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּשַׂר
  choice: మాంసాన్ని
  rationale: בָּשָׂר ఇక్కడ శరీర మాంసాన్ని సూచిస్తుంది. ‘మాంసం’ అనే నేరుగా ఉన్న పదం నరమాంస భక్షణపు ఘోరతను తగ్గించకుండా నిలుపుతుంది.
- source_word: בְּנֵיכֶם
  choice: మీ కుమారుల
  rationale: ‘కుమారులు’ అనే పుంలింగ బహువచనాన్ని, తరువాత ప్రత్యేకంగా ప్రస్తావించిన కుమార్తెలతో ఉన్న జతను కాపాడుతూ నిర్దిష్టంగా అనువదించింది.
- source_word: וּבְשַׂר
  choice: మాంసాన్ని కూడా
  rationale: హీబ్రూలో పునరుక్తమైన నామవాచకాన్ని తెలుగులోనూ ఉంచి సమాంతర నిర్మాణాన్ని, తీవ్రతను కాపాడింది; וּ అనుసంధానాన్ని సహజంగా ‘కూడా’తో తెలిపింది.
- source_word: בְּנֹתֵיכֶם
  choice: మీ కుమార్తెల
  rationale: మూలంలోని స్త్రీలింగ బహువచనాన్ని నేరుగా అనువదించి కుమారులు–కుమార్తెల జతను నిలిపింది.
- source_word: תֹּאכֵלוּ
  choice: తింటారు
  rationale: మూలంలో రెండవసారి వచ్చిన క్రియను తొలగించకుండా పునరావృతం చేసి హెచ్చరికలోని సమాంతరతను, ఉద్ఘాటనను నిలిపింది.
theological_decisions:
- issue: నరమాంస భక్షణను తెలిపే నిబంధన-శాప వాక్య అనువాదం
  choice: ‘మీరు మీ కుమారుల మాంసాన్ని తింటారు; మీ కుమార్తెల మాంసాన్ని కూడా తింటారు’ అనే నేరుగా ఉన్న భవిష్యత్ హెచ్చరిక
  alternative: అర్థాన్ని మృదువుచేసే పరోక్ష లేదా సభ్యోక్తి అనువాదం
  rationale: ఇది నిబంధన శాపంలో వచ్చే స్పష్టమైన హెచ్చరిక. అదనపు సిద్ధాంత వివరణను చేర్చకుండా, దాని ఘోరతను సభ్యోక్తితో తగ్గించకుండా మూలార్థాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. హీబ్రూ వాక్యంలోని కుమారులు–కుమార్తెల సమాంతరతను, ‘మాంసం’ మరియు ‘తింటారు’ అనే పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది. సెమికోలన్ రెండు సమాంతర భాగాలను స్పష్టంగా కలుపుతుంది.
