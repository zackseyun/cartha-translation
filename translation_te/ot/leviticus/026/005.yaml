id: LEV.26.5
reference: Leviticus 26:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: te
  text: మీ ధాన్యం నూర్పు ద్రాక్ష కోతకాలం వరకు కొనసాగుతుంది; ద్రాక్ష కోత విత్తే కాలం వరకు కొనసాగుతుంది. మీరు మీ రొట్టెను తృప్తిగా తిని, మీ దేశంలో భద్రంగా నివసిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: ధాన్యం నూర్పు
  rationale: ధాన్యాన్ని కంకుల నుంచి వేరు చేసే threshing ప్రక్రియను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּצִיר
  choice: ద్రాక్షపండ్ల కోతకాలం
  rationale: ఇది సాధారణ పంటకోత కాక ప్రత్యేకంగా ద్రాక్షపండ్ల కోతను సూచిస్తుంది; మొదటి సందర్భంలో ‘కాలం’ చేర్చడం కాలవ్యాప్తిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זָרַע
  choice: విత్తే కాలం
  rationale: నామరూపంలోని ‘విత్తడం’ భావాన్ని తెలుగు కాలక్రమ వాక్యంలో సహజంగా అందిస్తుంది.
- source_word: לָשֹׂבַע
  choice: కడుపు నిండా
  rationale: తృప్తి కలిగేంతగా తినడమనే హీబ్రూ భావాన్ని సామాన్యులకు స్పష్టమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: భయం లేదా ముప్పు లేకుండా నిశ్చింతగా నివసించే భావాన్ని సూటిగా అందిస్తుంది.
theological_decisions:
- issue: సమృద్ధికి సంబంధించిన కాలక్రమ వాగ్దానం
  choice: ‘వరకు కొనసాగుతుంది’ అని రెండు వ్యవసాయ పనులూ తదుపరి కాలాన్ని చేరేలా అనువదించడం
  alternative: ‘చేరుతుంది’ అని అక్షరార్థంగా అనువదించడం
  rationale: הִשִּׂיג / יַשִּׂיג యొక్క ‘చేరుకోవడం’ రూపకాన్ని నిలుపుకుంటూనే, ఇక్కడ ఉద్దేశించిన పంటల సమృద్ధి వల్ల పనులు ఒకదానితో మరొకటి కలిసిపోయే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వ్యవసాయ దృశ్యాన్ని స్పష్టంగా ఉంచుతూ గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూలోని రెండుసార్ల ‘చేరుతుంది’ భావాన్ని తెలుగు సహజత్వం కోసం ‘కొనసాగుతుంది’గా వ్యక్తపరిచాం.
