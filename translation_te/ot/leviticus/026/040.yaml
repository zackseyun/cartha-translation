source:
  edition: WLC
  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: te
  text: అయితే వారు తమ దోషాన్నీ తమ పితరుల దోషాన్నీ, వారు నాపట్ల చేసిన తమ విశ్వాసభంగాన్నీ[a], అంతేకాక వారు నాపట్ల విరోధంగా నడుచుకున్న సంగతినీ[b] ఒప్పుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ ద్రోహాన్ని.’ హీబ్రూలో ఒకే మూలానికి చెందిన నామవాచకం, క్రియ వాడబడి దేవునిపట్ల జరిగిన ఒడంబడిక విశ్వాసభంగం బలంగా చెప్పబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నాపట్ల శత్రుత్వంతో నడుచుకున్న సంగతిని.’ ఇక్కడి హీబ్రూ పదం క్లిష్టమైనది; ఈ అధ్యాయంలో అది విరోధపూర్వక లేదా శత్రుత్వపూర్వక ప్రవర్తనను సూచిస్తూ పలుమార్లు వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: అయితే వారు ... ఒప్పుకోవాలి
  rationale: ידה యొక్క హిత్పయేల్ రూపం ‘ఒప్పుకొను/అంగీకరించు’ అనే అర్థం ఇస్తుంది. ముందరి వచనంతో ఉన్న షరతు ప్రవాహాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘అయితే’ వాడి, వాక్యాంతంలో ‘ఒప్పుకోవాలి’ని పునరుద్ఘాటించాం.
- source_word: עֲוֺנָם
  choice: తమ దోషాన్ని
  rationale: עָוֹן అపరాధం, దోషం, దోషభారం అనే అర్థాలను కలిగి ఉంటుంది. ఇక్కడ ఒప్పుకోవలసిన నైతిక అపరాధాన్ని ‘దోషం’ సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: עֲוֺן אֲבֹתָם
  choice: తమ పితరుల దోషాన్ని
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా నిలుపుతూ, వ్యక్తిగత దోషంతోపాటు పూర్వతరాల దోషాన్ని ఒప్పుకునే సమూహ పరిమాణాన్ని కాపాడుతుంది.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: వారు నాకు ద్రోహం చేసిన తమ ద్రోహాన్ని
  rationale: మూలంలో నామవాచక–క్రియ సజాతి పునరుక్తి ఒడంబడిక విశ్వాసభంగాన్ని బలపరుస్తుంది. ‘ద్రోహం చేసిన తమ ద్రోహం’ ఆ పునరుక్తిని తెలుగులో సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: וְאַף
  choice: అంతేకాక
  rationale: ఒప్పుకోవలసిన మరో అంశాన్ని జోడించే బలాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: నాకు విరోధంగా నడుచుకున్నారు
  rationale: הלך యొక్క ప్రవర్తనా రూపకాన్ని ‘నడుచుకున్నారు’ నిలుపుతుంది; క్లిష్టమైన קֶרִי ఇక్కడ ప్రతికూలమైన, విరోధపూర్వక ప్రవర్తనను సూచిస్తుంది.
theological_decisions:
- issue: పితరుల దోషంతో కూడిన సమూహ ఒప్పుకోలు
  choice: ‘తమ పితరుల దోషాన్ని’ అని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: ‘తమ పూర్వీకుల పాపాలను’ లేదా ‘తాము పాలుపంచుకున్న పితరుల దోషాన్ని’
  rationale: మూల హీబ్రూ వారి సొంత దోషంతోపాటు వారి పితరుల దోషాన్ని స్పష్టంగా పేర్కొంటుంది. దానికి అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ సమూహ, ఒడంబడిక పరిమాణాన్ని నిలుపాలి.
- issue: קֶרִי అనే క్లిష్ట పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘విరోధంగా’
  alternative: ‘శత్రుత్వంతో’ లేదా ‘ఎదురుగా’
  rationale: ఈ అధ్యాయంలో పునరావృతమయ్యే పదం ప్రతికూలత, విరోధం లేదా శత్రుత్వాన్ని సూచించినా దాని ఖచ్చిత ఛాయ అనిశ్చితం. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘విరోధంగా’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ‘పితరులు’ బైబిలు సందర్భానికి తగిన గౌరవభరిత పదం; ‘ద్రోహం’ ఒడంబడిక విశ్వాసభంగాన్ని స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు రెండూ చేర్చబడ్డాయి.
