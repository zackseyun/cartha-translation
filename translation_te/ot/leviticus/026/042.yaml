id: LEV.26.42
reference: Leviticus 26:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֖י אֶת בְּרִיתִ֣/י יַעֲק֑וֹב וְ/אַף֩ אֶת בְּרִיתִ֨/י יִצְחָ֜ק וְ/אַ֨ף אֶת בְּרִיתִ֧/י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְ/הָ/אָ֥רֶץ אֶזְכֹּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: te
  text: అప్పుడు[a] యాకోబుతో చేసిన నా నిబంధనను జ్ఞాపకం చేసుకుంటాను; అలాగే ఇస్సాకుతో చేసిన నా నిబంధనను, అలాగే అబ్రాహాముతో చేసిన నా నిబంధనను జ్ఞాపకం చేసుకుంటాను; ఆ దేశాన్నీ జ్ఞాపకం చేసుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు.” హెబ్రీ సంయోజక పదాన్ని కేవలం “మరియు” అని కూడా అనువదించవచ్చు; “అప్పుడు” అనేది ఈ వాక్యానికి ముందున్న సందర్భంతో గల సంబంధాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: అప్పుడు … జ్ఞాపకం చేసుకుంటాను
  rationale: זכר అనే క్రియను దాని మూలార్థమైన ‘జ్ఞాపకం చేసుకోవడం’గానే ఉంచాం; నిబంధన సందర్భంలో చర్యకు సంకేతం ఉన్నప్పటికీ దానిని వాక్యంలో విస్తరించలేదు. ముందున్న సందర్భంతో సంబంధాన్ని చూపేందుకు וְ ను ప్రధాన పాఠ్యంలో ‘అప్పుడు’గా అనువదించి, ‘మరియు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּרִיתִי
  choice: నా నిబంధన
  rationale: బైబిలు సందర్భంలో בְּרִית సూచించే దేవుని బంధక సంబంధానికి ‘నిబంధన’ సహజమైన, స్థిరపడిన తెలుగు సమానం.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: తెలుగులో సాధారణంగా స్థిరపడిన వ్యక్తినామ రూపం; వాక్యంలో సంబంధార్థకంగా ‘యాకోబుతో’ అని వాడాం.
- source_word: וְאַף
  choice: అలాగే
  rationale: ఈ సందర్భంలోని సంయోజక, అదనపు ఉద్ఘాటన భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִצְחָק
  choice: ఇస్సాకు
  rationale: తెలుగులో సాధారణంగా స్థిరపడిన వ్యక్తినామ రూపం; వాక్యంలో ‘ఇస్సాకుతో’ అని వాడాం.
- source_word: אַבְרָהָם
  choice: అబ్రాహాము
  rationale: తెలుగులో సాధారణంగా స్థిరపడిన వ్యక్తినామ రూపం; వాక్యంలో ‘అబ్రాహాముతో’ అని వాడాం.
- source_word: אֶזְכֹּר
  choice: జ్ఞాపకం చేసుకుంటాను
  rationale: హెబ్రీ పాఠ్యంలోని క్రియా పునరుక్తిని తొలగించకుండా నిలిపాం; ఇది అబ్రాహాము నిబంధనకు, తరువాత దేశానికి ఇచ్చిన వాక్చాతుర్యపూర్వక ప్రాధాన్యాన్ని కాపాడుతుంది.
- source_word: וְהָאָרֶץ
  choice: దేశాన్ని కూడా
  rationale: ఈ నిబంధన సందర్భంలో אֶרֶץ వాగ్దాన దేశాన్ని సూచిస్తుంది. అందువల్ల సాధారణ ‘భూమి’ కంటే ‘దేశం’ సందర్భోచితం; וְ యొక్క సంయోజక భావాన్ని తెలుగులో సహజంగా ‘కూడా’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: పితరులతో చేసిన నిబంధనల క్రమం, పునరుక్తి
  choice: యాకోబు, ఇస్సాకు, అబ్రాహాము అనే హెబ్రీ క్రమాన్ని, ప్రతి ఒక్కరితో ‘నా నిబంధన’ అనే పునరుక్తిని నిలిపాం.
  alternative: కాలక్రమానుసారం అబ్రాహాము, ఇస్సాకు, యాకోబు అని మార్చడం; లేదా ముగ్గురినీ ఒకే సంక్షిప్త పదబంధంలో చేర్చడం.
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా ఇచ్చిన వ్యతిరేక కాలక్రమాన్ని, ప్రతి నిబంధనపై ఉన్న ఉద్ఘాటనను అనువాదం మార్చకూడదు.
- issue: దేవుడు ‘జ్ఞాపకం చేసుకోవడం’ అనే భావం
  choice: జ్ఞాపకం చేసుకుంటాను
  alternative: దానిని జ్ఞాపకం చేసుకొని చర్య తీసుకుంటాను; పునరుద్ధరిస్తాను
  rationale: నిబంధన సందర్భంలో దేవుని జ్ఞాపకం చర్యను సూచించవచ్చు; అయినా మూలపాఠం స్పష్టంగా ‘జ్ఞాపకం చేసుకుంటాను’ అనే క్రియనే వాడుతుంది. దానిని విస్తరించకుండా భావసాంద్రతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘చేసిన నా నిబంధన’ అనేది హెబ్రీలోని సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని పితరుల క్రమం, ‘నా నిబంధన’ మరియు ‘జ్ఞాపకం చేసుకుంటాను’ అనే పునరుక్తులు నిలిపాం.
