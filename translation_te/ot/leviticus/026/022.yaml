  to: నేను మీ మీదికి అడవి జంతువులను[a] పంపుతాను. అవి మిమ్మల్ని సంతానవియోగులుగా చేస్తాయి[b], మీ పశుసంపదను నిర్మూలిస్తాయి, మీ సంఖ్యను తగ్గిస్తాయి; మీ దారులు నిర్మానుష్యమవుతాయి[c].
