id: LEV.26.22
reference: Leviticus 26:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: te
  text: నేను మీ మీదికి అడవి జంతువులను[a] పంపుతాను. అవి మిమ్మల్ని సంతానవియోగులుగా చేస్తాయి[b], మీ పశుసంపదను నిర్మూలిస్తాయి, మీ సంఖ్యను తగ్గిస్తాయి; మీ దారులు నిర్మానుష్యమవుతాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “బయలులోని జంతువులు”; ఇక్కడ అడవి జంతువులు అనే భావం.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ క్రియ సాధారణంగా పిల్లలను కోల్పోవడం వల్ల కలిగే సంతానవియోగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మీ మార్గాలు నిర్మానుష్యమవుతాయి.” ఇక్కడ జనసంచారం లేని దారులు అనే భావమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: నేను మీ మీదికి ... పంపుతాను
  rationale: שלח హిఫీల్ రూపం ‘పంపుతాను’ అని సహజంగా అర్థమిస్తుంది; శిక్షాత్మక సందర్భంలో בָכֶםకు ‘మీ మీదికి’ అనేది విరోధ దిశను స్పష్టంగా చూపుతుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: అడవి జంతువులను
  rationale: ఈ సమాసం మానవ నివాసానికి వెలుపల తిరిగే క్రూరమైన భూజంతువుల వర్గాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అడవి జంతువులు’ సహజంగా, విస్తృతంగా అర్థమవుతుంది.
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: అవి మిమ్మల్ని సంతానహీనులను చేస్తాయి
  rationale: שׁכל పియేల్ సాధారణంగా పిల్లలను కోల్పోయేలా చేయడం, సంతానహీనులను చేయడం అనే భావం కలిగి ఉంటుంది. తెలుగు వాక్యంలో ఆ అంతర్నిహిత భావాన్ని స్పష్టంగా చెప్పడం మూలపాఠ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: మీ పశుసంపదను నిర్మూలిస్తాయి
  rationale: הכרית ఇక్కడ పూర్తిగా తొలగించడం లేదా నాశనం చేయడం అనే తీర్పు భావాన్ని ఇస్తుంది. ‘నిర్మూలిస్తాయి’ ఆ తీవ్రతను సహజ తెలుగులో నిలుపుతుంది; בְּהֵמָהకు ‘పశుసంపద’ పెంపుడు జంతువుల సమూహార్థాన్ని అందిస్తుంది.
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: మీ సంఖ్యను తగ్గిస్తాయి
  rationale: מעט హిఫీల్ ‘కొద్దిమందిగా చేయడం’ అనే భావాన్ని ఇస్తుంది; జనాభా తగ్గుదలను ‘మీ సంఖ్యను తగ్గిస్తాయి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: మీ దారులు నిర్మానుష్యమవుతాయి
  rationale: נשׁם నిర్జనమవడం లేదా పాడవడం సూచిస్తుంది. ఈ సామాజిక విధ్వంస సందర్భంలో דְּרָכִים ప్రయాణ దారులను సూచించే అవకాశం ఎక్కువ; ‘నిర్మానుష్యమవుతాయి’ వాటిపై రాకపోకలు లేకపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: שׁכל క్రియలో అంతర్నిహితంగా ఉన్న నష్టం
  choice: ‘సంతానహీనులను చేస్తాయి’ అని ప్రధాన పాఠంలో స్పష్టం చేయడం
  alternative: ‘మిమ్మల్ని దుఃఖితులను చేస్తాయి’ లేదా అంతర్నిహిత కర్మను పేర్కొనకుండా అనువదించడం
  rationale: ఈ హీబ్రూ క్రియ ప్రత్యేకంగా పిల్లలను కోల్పోవడం వల్ల కలిగే సంతానహీనతను సాధారణంగా సూచిస్తుంది. తెలుగులో కేవలం సాధారణ దుఃఖంగా అనువదిస్తే భావం బలహీనమవుతుంది; అందువల్ల సంప్రదాయ సిద్ధాంతాన్ని దిగుమతి చేయకుండా నిఘంటు భావాన్ని స్పష్టం చేశాం.
- issue: דַּרְכֵיכֶם యొక్క అర్థపరిధి
  choice: ప్రధాన పాఠంలో ‘మీ దారులు’
  alternative: ‘మీ మార్గాలు,’ అంటే జీవన ప్రవర్తన లేదా విధానాలు
  rationale: జనాభా, పశుసంపద నాశనమయ్యే సందర్భంలో ప్రయాణ దారులు నిర్మానుష్యమవడం అత్యంత సహజమైన భావం. అయినా పదానికి రూపకాలంకార అర్థం కూడా ఉండగలదని పాదటీపులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. దైవ తీర్పు తీవ్రతను నిలుపుతూ, పాతకాలపు లేదా మతశాఖకు ప్రత్యేకమైన పరిభాషను నివారించాం.
