id: LEV.26.28
reference: Leviticus 26:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָלַכְתִּ֥י עִמָּ/כֶ֖ם בַּ/חֲמַת קֶ֑רִי וְ/יִסַּרְתִּ֤י אֶתְ/כֶם֙ אַף אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: te
  text: అప్పుడు నేను కూడా ఉగ్ర కోపంతో మీకు విరోధంగా నడుచుకుంటాను[a]; మీ పాపాలనుబట్టి నేనే మిమ్మల్ని ఏడింతలు శిక్షిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విరోధపు ఉగ్రతతో మీతో నడుచుకుంటాను.” ఇక్కడి హీబ్రూ పదబంధం అర్థనిర్ణయం కష్టమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ పాపాలనుబట్టి మిమ్మల్ని ఏడుసార్లు క్రమశిక్షణకు లోను చేస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: నడుచుకుంటాను
  rationale: הלך అనే పదంలోని ‘నడుచు’ భావాన్ని నిలుపుతూ, ఈ అధ్యాయమంతటా పునరావృతమయ్యే ఒడంబడిక సంబంధమైన నడవడి రూపకాన్ని సంరక్షిస్తుంది.
- source_word: עִמָּכֶם
  choice: మీకు విరోధంగా
  rationale: עם అక్షరార్థంగా ‘మీతో’ అయినప్పటికీ, קֶרִיతో కలిసిన ఈ సందర్భంలో ప్రతికూల సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మీకు విరోధంగా’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּחֲמַת
  choice: ఉగ్ర కోపంతో
  rationale: חֵמָהలోని వేడి, తీవ్ర ఆగ్రహం అనే బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: קֶרִי
  choice: విరోధంగా
  rationale: అర్థనిర్ణయం కష్టమైన קֶרִי ఈ అధ్యాయంలో ప్రతికూలత లేదా విరోధాన్ని సూచిస్తుంది. ‘విరోధంగా’ పాఠకులకు సహజంగా ఉండి, ప్రత్యర్థి వైఖరిని నిలుపుతుంది; పదబద్ధమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְיִסַּרְתִּי
  choice: శిక్షిస్తాను
  rationale: יסרలో దండనతో పాటు క్రమశిక్షణ లేదా సరిదిద్దే భావం ఉండవచ్చు. తెలుగులో ‘శిక్షిస్తాను’ ఈ హెచ్చరిక సందర్భంలో సహజంగా ఉంది; విస్తృత ప్రత్యామ్నాయ భావం పాదసూచికలో సూచించబడింది.
- source_word: אַף אֲנִי
  choice: కూడా … నేనే
  rationale: אַף మరియు אֲנִי కలిగించే అనుసంధాన బలాన్నీ, కర్తపై ఉన్న నొక్కిచెప్పడాన్నీ రెండింటినీ తెలుగులో నిలుపుతుంది.
- source_word: שֶׁבַע
  choice: ఏడింతలు
  rationale: తీర్పు తీవ్రత పెరగడాన్ని సూచించే ఈ సందర్భంలోని ప్రయోగాన్ని సంక్షిప్తంగా అందిస్తుంది; ‘ఏడుసార్లు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: మీ పాపాలనుబట్టి
  rationale: עַל ఇక్కడ శిక్షకు ఆధారం లేదా కారణాన్ని సూచిస్తుంది; ‘మీ పాపాలనుబట్టి’ సహజంగా ఆ కారణ సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఒడంబడిక శాపంలో దేవుని ప్రతిస్పందన స్వభావం
  choice: దేవుడు ‘విరోధంగా నడుచుకోవడం’ మరియు ‘శిక్షించడం’ అనే రెండు భావాలనూ నిలుపడం.
  alternative: వాక్యమంతటినీ కేవలం ప్రతీకార దండనగా అనువదించడం, లేదా విరోధ భావాన్ని సాధారణ అసంతృప్తిగా మృదువుచేయడం.
  rationale: హీబ్రూ పాఠం సంబంధపరమైన ప్రతిఘటనను (הלך + עם + קֶרִי), దండన/క్రమశిక్షణను (יסר) కలిపి ఉంచుతుంది. రెండింటినీ నిలుపడం వల్ల పాఠంలోని వేదాంతపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా నివారించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, స్పష్టమైన శైలిని అనుసరించాం. ‘నడుచుకుంటాను’ అనే రూపకాన్ని అధ్యాయంలోని పునరావృత సూత్రభాష కోసం నిలిపాం. ‘ఉగ్ర కోపం,’ ‘విరోధం,’ ‘శిక్ష’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా మూలంలోని తీవ్రతను తగ్గించవు.
