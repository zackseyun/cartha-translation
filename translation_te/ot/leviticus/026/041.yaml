id: LEV.26.41
reference: Leviticus 26:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: te
  text: నేను కూడా[a] వారితో విరోధంగా నడుస్తాను[b], వారి శత్రువుల దేశంలోకి వారిని తీసుకువెళ్తాను. లేదా అప్పుడు[c] వారి సున్నతి లేని హృదయం[d] వినయపడుతుంది; అప్పుడు వారు తమ దోషానికి తగిన శిక్షను అంగీకరిస్తారు.[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేను కూడా’ అని ఉన్న హీబ్రూ మాట దేవుని ప్రతిస్పందనను ప్రత్యేకంగా నొక్కిచెబుతుంది; ‘నేనే సైతం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారితో విరోధంగా నడుస్తాను.’ ఈ మాట ఈ అధ్యాయంలోని నిబంధన-శాప వాక్యరీతిని మళ్లీ వినిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘లేదా అప్పుడు.’ ఈ పదబంధం క్లిష్టమైనది; వారి హృదయం వినయపడే సమయాన్ని ఇది పరిచయం చేస్తూ ఉండవచ్చు.
    reason: alternative_reading
  - marker: d
    text: అక్షరార్థంగా, ‘వారి సున్నతి లేని హృదయం.’ ఇది అంతరంగ మొండితనాన్ని, అపవిత్రతను సూచించే నిబంధన సంబంధమైన రూపకం.
    reason: cultural_note
  - marker: e
    text: ‘తమ దోషఫలాన్ని భరిస్తారు,’ ‘తమ దోషానికి పరిహారం చేస్తారు,’ లేదా ‘వారి దోషానికి వెల చెల్లించబడుతుంది’ అని కూడా అర్థం కావచ్చు. ఈ హీబ్రూ పదబంధం దోషానికి తగిన ఫలితాన్ని అంగీకరించడం లేదా భరించడం గురించి చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: నేను కూడా
  rationale: אַף అనే పదం స్వతంత్ర సర్వనామంతో కలిసి దేవుని ప్రతిస్పందనను నొక్కిచెబుతుంది. ‘నేను కూడా’ అనే అనువాదం ఆ పరస్పరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: వారికి విరోధంగా నడుచుకొని
  rationale: ఈ అధ్యాయంలో పునరావృతమయ్యే నిబంధన-శాప వాక్యరీతిని ఇది ప్రతిధ్వనిస్తుంది. קֶרִי ఇక్కడ యాదృచ్ఛికతకన్నా విరోధం లేదా ప్రతికూలతను సూచిస్తుంది; ‘నడుచుకొని’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: వారి శత్రువుల దేశంలోకి వారిని తీసుకువెళ్తాను
  rationale: בוא అనే క్రియ యొక్క హిఫీల్ రూపానికి ‘తీసుకువెళ్తాను’ సరిపోతుంది; ఈ వాక్యం ప్రవాస పరిస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוֹ אָז
  choice: లేదా అప్పుడు
  rationale: హీబ్రూ పదబంధం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. దాని విభాజక భావాన్ని సరిచేసి తొలగించకుండా, ‘లేదా అప్పుడు’ అని ఉద్దేశపూర్వకంగా నిలిపాం.
- source_word: יִכָּנַע
  choice: అణగిపోతుంది
  rationale: כנע యొక్క నిఫాల్ రూపం ‘అణగడం’ లేదా ‘లోబడడం’ అనే భావం ఇస్తుంది. హృదయం కర్తగా ఉన్నందున, అంతరంగ వినయాన్ని సూచించే ‘అణగిపోతుంది’ సహజంగా ఉంటుంది.
- source_word: לְבָבָם הֶעָרֵל
  choice: వారి సున్నతి పొందని హృదయం
  rationale: మూలంలో అక్షరార్థంగా ‘వారి సున్నతి లేని హృదయం’ ఉంది. ఇది నిబంధన సంబంధమైన ప్రాముఖ్యమున్న రూపకం కాబట్టి ‘మొండి హృదయం’ అని పూర్తిగా వివరణాత్మకంగా మార్చలేదు.
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: అప్పుడు వారు తమ దోషానికి తగిన శిక్షను అంగీకరిస్తారు
  rationale: ఈ సందర్భంలో רצה + עון అనే పదబంధం దోషానికి సంబంధించిన శిక్షను అంగీకరించడం లేదా భరించడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ‘అంగీకరిస్తారు’ మూలంలోని కర్తృవాచక నిర్మాణాన్ని కాపాడుతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: హృదయానికి הֶעָרֵל (‘సున్నతి లేని’) అనే రూపకాన్ని వర్తింపజేయడం
  choice: ‘సున్నతి పొందని హృదయం’ అనే నిబంధన సంబంధమైన రూపకాన్ని నిలుపడం
  alternative: ‘మొండి హృదయం’ లేదా ‘పశ్చాత్తాపపడని హృదయం’
  rationale: ఇది సాధారణ మొండితనాన్ని మాత్రమే సూచించే వర్ణన కాదు; తోరాలోను తరువాతి ప్రవచన గ్రంథాల్లోను సంబంధాలు కలిగిన నిబంధన రూపకం. దాన్ని నిలపడం ద్వారా పాఠంలోని ధార్మిక బరువు కాపాడబడుతుంది.
- issue: יִרְצוּ אֶת עֲוֺנָם యొక్క అర్థం
  choice: తమ దోషానికి తగిన శిక్షను అంగీకరించడం
  alternative: తమ దోషానికి పరిహారం చేయడం; తమ దోషఫలాన్ని భరించడం; వారి దోషానికి వెల చెల్లించబడడం
  rationale: ఈ పదబంధం నిబంధన ఉల్లంఘనకు తగిన ఫలితాన్ని అంగీకరించడం లేదా భరించడం గురించి చెబుతుంది. ‘పరిహారం చేయడం’ అని మాత్రమే అనువదిస్తే స్వయంగా ప్రాయశ్చిత్తం సంపాదించుకున్నారనే అదనపు భావం రావచ్చు; అందువల్ల న్యాయపరమైన భావాన్ని కాపాడుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: Modern standard Telugu with a dignified biblical register. The syntax is kept readable while retaining the Hebrew’s difficult ‘లేదా అప్పుడు,’ the repeated walking metaphor, and the covenantal expression ‘సున్నతి పొందని హృదయం.’ No denominationally specific interpretation has been introduced.
