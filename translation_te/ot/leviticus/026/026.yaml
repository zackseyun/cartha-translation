  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/שִׁבְרִ֣/י לָ/כֶם֮ מַטֵּה לֶחֶם֒ וְ֠/אָפוּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְ/כֶם֙ בְּ/תַנּ֣וּר אֶחָ֔ד וְ/הֵשִׁ֥יבוּ לַחְמְ/כֶ֖ם בַּ/מִּשְׁקָ֑ל וַ/אֲכַלְתֶּ֖ם וְ/לֹ֥א תִשְׂבָּֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: te
  text: నేను మీ రొట్టె సరఫరాను నిలిపివేసినప్పుడు[a], పదిమంది స్త్రీలు మీ రొట్టెను ఒకే పొయ్యిలో కాల్చి, బరువు ప్రకారం మీకు తిరిగి ఇస్తారు. మీరు తింటారు, అయినా మీకు కడుపు నిండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రొట్టె కర్రను విరగగొట్టినప్పుడు.” ఇది జీవనాధారమైన రొట్టె సరఫరాను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: నేను ... నిలిపివేసినప్పుడు
  rationale: בְּ + infinitive construct కాలసూచక ఉపవాక్యాన్ని ఇస్తుంది. שׁבר అక్షరార్థంగా ‘విరగగొట్టు’ అయినా, ఇక్కడ జీవనాధార సరఫరాను భంగపరచడం లేదా నిలిపివేయడం అనే రూపకాలంకార భావం; సహజమైన ఆధునిక తెలుగులో ‘నిలిపివేసినప్పుడు’ ఆ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַטֵּה לֶחֶם
  choice: ఆహారాధారమైన రొట్టె సరఫరా
  rationale: అక్షరార్థం ‘రొట్టె కర్ర/ఆధారం.’ ఇది జీవనాన్ని నిలబెట్టే రొట్టె సరఫరాకు వాడిన నుడికారం. ‘ఆహారాధారమైన రొట్టె సరఫరా’ జీవనాధార భావాన్నీ, రొట్టెకు సంబంధించిన ప్రత్యేక చిత్రాన్నీ నిలుపుతుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఉంది.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: పదిమంది స్త్రీలు ... కాల్చి
  rationale: హీబ్రూలో స్త్రీలు అని స్పష్టంగా ఉన్నందున దాన్ని సాధారణీకరించలేదు. పొయ్యిలో రొట్టె తయారీకి సహజమైన తెలుగు క్రియగా ‘కాల్చి’ వాడబడింది.
- source_word: לַחְמְכֶם
  choice: మీ రొట్టెలను
  rationale: సందర్భంలో అనేక స్త్రీలు కాల్చి తిరిగి ఇచ్చే రొట్టె పరిమాణాలను సూచిస్తున్నందున తెలుగు సహజ వచనంలో బహువచనం వాడబడింది; మూలంలోని సమూహార్థక ‘రొట్టె’ భావం మారదు.
- source_word: בְּתַנּוּר אֶחָד
  choice: ఒకే పొయ్యిలో
  rationale: 'אֶחָד ఇక్కడ కొరతను నొక్కిచెబుతుంది: పదిమంది స్త్రీల రొట్టెలన్నీ ఒకే పొయ్యికి సరిపోతాయి. ‘ఒకే’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.'
- source_word: וְהֵשִׁיבוּ
  choice: మీకు తిరిగి ఇస్తారు
  rationale: שוב హిఫిల్ రూపానికి ‘తిరిగి తీసుకురావడం/ఇవ్వడం’ అనే భావం. కాల్చిన రొట్టెను యజమానులకు తిరిగి అప్పగించే సందర్భంలో ‘తిరిగి ఇస్తారు’ స్పష్టంగా ఉంటుంది.
- source_word: בַּמִּשְׁקָל
  choice: తూచి
  rationale: కొరత కారణంగా రొట్టెను బరువు ప్రకారం రేషన్‌గా ఇవ్వడాన్ని సూచిస్తుంది. ‘తూచి’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: మీరు తింటారు, అయినా మీకు కడుపు నిండదు
  rationale: שׂבע ఆహారం తిని తృప్తి చెందడం లేదా కడుపు నిండడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘కడుపు నిండదు’ శారీరక ఆకలి తీరకపోవడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
