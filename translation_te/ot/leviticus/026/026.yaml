  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర శైలి. కరవు తీవ్రతను తెలిపే ‘పదిమంది స్త్రీలు,’ ‘ఒకే పొయ్యి,’ ‘తూచి’ అనే మూల చిత్రాలు నిలుపబడ్డాయి.
