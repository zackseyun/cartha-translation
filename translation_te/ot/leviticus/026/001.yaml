source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: te
  text: “మీ కోసం విగ్రహాలను చేసుకోవద్దు; చెక్కిన ప్రతిమనుగానీ నిలువురాయినిగానీ మీ కోసం నిలబెట్టవద్దు. దానికి సాగిలపడేందుకు చిత్రాలతో కూడిన రాయిని[a] మీ దేశంలో పెట్టవద్దు. ఎందుకంటే నేను మీ దేవుడైన యాహ్వేను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిత్రాలతో కూడిన రాయి’ అని అనువదించిన హీబ్రూ పదబంధాన్ని ‘చెక్కిన రాయి’ లేదా ‘రాతి ప్రతిమ’ అని కూడా అనువదించవచ్చు. ఖచ్చితమైన భావఛాయపై భిన్నాభిప్రాయాలు ఉన్నాయి; నిషిద్ధ ఆరాధనతో సంబంధమున్న రాతి వస్తువును ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో య్హ్వ్హ్ (YHWH) అనే దైవనామం ఉంది; దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరించారు. సంప్రదాయంగా దీనిని ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: విగ్రహాలు
  rationale: ఈ పదానికి పనికిరానివి లేదా అబద్ధ దేవతలు అనే హేళనభావం ఉండవచ్చు; అయితే నిషేధాజ్ఞ సందర్భంలో ‘విగ్రహాలు’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: פֶסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: చెక్కడం ద్వారా రూపొందించిన రూపాన్ని సూచించే నిర్దిష్ట భావాన్ని నిలుపుతుంది; సాధారణమైన ‘విగ్రహం’తో దీనిని కలిపివేయదు.
- source_word: מַצֵּבָה
  choice: నిలువురాయి
  rationale: నిలబెట్టిన రాతి స్తంభం లేదా స్మారక రాయి అనే దృశ్యార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; మూలపదంలో ప్రత్యక్షంగా లేని ‘పవిత్ర’ అనే వివరణను జోడించదు.
- source_word: אֶבֶן מַשְׂכִּית
  choice: చిత్రాలు చెక్కిన రాయి
  rationale: రాతిపై రూపం లేదా అలంకారం చెక్కబడి ఉండే భావాన్ని తెలియజేస్తూ פֶסֶל నుండి పదభేదాన్ని కాపాడుతుంది; ఖచ్చితమైన రూపం వివాదాస్పదం కాబట్టి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: תַעֲשׂוּ לָכֶם
  choice: మీ కోసం ... చేసుకోవద్దు
  rationale: లָכֶם లోని స్వప్రయోజన లేదా స్వసంబంధ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: תָקִימוּ לָכֶם
  choice: మీ కోసం నిలబెట్టుకోవద్దు
  rationale: హిఫీల్ రూపంలోని ‘నిలబెట్టు/ప్రతిష్ఠించు’ భావాన్ని, అలాగే לָכֶם భావాన్ని నిలుపుతుంది.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: మీ దేశంలో పెట్టుకోవద్దు
  rationale: స్థలంలో ఉంచడం అనే נתן భావాన్నీ, ఒడంబడిక దేశపు పరిధినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: దానికి సాగిలపడేందుకు
  rationale: ఉద్దేశాన్ని తెలిపే అవ్యయరూపాన్నీ, ఆ వస్తువుకు వంగి నమస్కరించే భావాన్నీ నేరుగా వ్యక్తపరుస్తుంది; ‘దానిమీద ఆరాధించేందుకు’ అనే తక్కువ సంభావ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకోదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే విధంగా దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే లిప్యంతరీకరించింది; మూల హీబ్రూ రూపాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ఎందుకంటే మీ దేవుడైన యెహోవాను నేనే
  rationale: כִּי ఇచ్చే కారణసంబంధాన్ని, అలాగే ఒడంబడిక ప్రకటనలోని బలమైన ‘నేనే’ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ‘యెహోవా’ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; హీబ్రూ నాలుగు అక్షరాల నామాన్ని పాదటిప్పణిలో తెలిపి, ఉచ్చారణ సంప్రదాయంలోని అంశాన్ని పారదర్శకంగా ఉంచాం.
- issue: ఆరాధన సంబంధిత వస్తువుల పదభేదం
  choice: ‘విగ్రహాలు,’ ‘చెక్కిన ప్రతిమ,’ ‘నిలువురాయి,’ ‘చిత్రాలు చెక్కిన రాయి’ అని వేర్వేరు పదాలతో అనువదించడం
  alternative: అన్నిటినీ ‘విగ్రహాలు’ లేదా ‘ప్రతిమలు’గా కలిపి అనువదించడం
  rationale: మూలంలో వరుసగా వచ్చిన భిన్న పదాలను ఒకే పదంలో కలపకుండా వాటి న్యాయపరమైన ప్రత్యేకతను కాపాడుతుంది; ఏ వస్తువుకూ మూలంలో లేని అదనపు మతపరమైన విశేషణం జోడించదు.
- issue: עָלֶיהָ యొక్క సంబంధార్థం
  choice: దానికి సాగిలపడేందుకు
  alternative: దానిమీద ఆరాధించేందుకు
  rationale: ఈ సందర్భంలో రాయినే నమస్కార లక్ష్యంగా చూపడం అత్యంత సహజమైన పఠనం. అయినా ఉపసర్గకు ‘దానిమీద’ అనే స్థలార్థం సాధ్యమనే భాషాత్మక అవకాశాన్ని నిర్ణయాత్మకంగా సిద్ధాంతీకరించలేదు.
translation_notes:
  register: ఆజ్ఞారూపాన్ని స్పష్టంగా, గంభీరంగా, ఆధునిక ప్రామాణిక తెలుగులో అందించాం. వరుస నిషేధాల లయను నిలుపుతూ, పాతబడిన ‘ప్రణమిల్లుట’కు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే ‘సాగిలపడడం’ వాడాం. మూలంలోని బహువచన సంబోధనను ‘మీ’ రూపంతో కొనసాగించాం.
