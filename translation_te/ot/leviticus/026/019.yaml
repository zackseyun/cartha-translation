source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: te
  text: మీ బలం గురించిన గర్వాన్ని నేను విరగగొడతాను. మీ ఆకాశాన్ని[a] ఇనుములా, మీ నేలను కంచులా[b] చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మీ ఆకాశాలు’ అనే బహువచన రూపం ఉంది; అది తరచుగా పైనున్న ఆకాశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాగిలా.’ హీబ్రూ పదం రాగిని లేదా కంచును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: నేను విరగగొడతాను
  rationale: שׁבר అనే క్రియకు ‘విరగగొట్టు/పగులగొట్టు’ అనే ప్రాథమిక భావం ఉంది. ఇక్కడ గర్వాన్ని అణచివేయడాన్ని బలమైన రూపకంగా చూపుతున్నందున ‘విరగగొడతాను’ మూలంలోని చిత్రాన్ని నిలుపుతుంది.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: మీ బలాన్ని బట్టి మీకున్న గర్వం
  rationale: గְּאוֹן ‘గర్వం, ఔన్నత్యం, మహిమ’ అనే భావాలను, עֹז ‘బలం’ అనే భావాన్ని ఇస్తాయి. సందర్భంలో స్వబలంపై ఆధారపడే గర్వమే ఉద్దేశం; తెలుగులో మూలంలోని సంబంధాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: וְנָתַתִּי
  choice: చేస్తాను
  rationale: נתן అక్షరార్థంగా ‘ఇచ్చు/ఉంచు’ అయినా, వస్తువు + పోలికతో ఉన్న ఈ నిర్మాణంలో ‘అలా చేస్తాను’ అనే ఫలితార్థం సహజం.
- source_word: שְׁמֵיכֶם
  choice: మీ ఆకాశం
  rationale: హీబ్రూలో బహువచన రూపం ఉన్నప్పటికీ, అది సాధారణంగా పైనున్న ఆకాశాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆకాశం’ సహజమైన ఏకవచన రూపం; మూలరూపం గురించి పాదసూచికలో తెలియజేయబడింది.
- source_word: כַּבַּרְזֶל
  choice: ఇనుములా
  rationale: כ పోలికను సూచిస్తుంది; ‘ఇనుములా’ ఆకాశం గట్టిగా, వర్షం ఇవ్వకుండా ఉండే రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: אַרְצְכֶם
  choice: మీ నేల
  rationale: אֶרֶץ కు ‘దేశం, భూమి, నేల’ అనే అర్థాలు ఉన్నాయి. కరువు మరియు వ్యవసాయ సందర్భంలో ‘నేల’ గట్టిపడి ఫలించకపోవడాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: כַּנְּחֻשָׁה
  choice: కంచులా
  rationale: נְחֻשָׁה రాగి లేదా కంచును సూచించగలదు. గట్టిపడిన నేల రూపకంలో సంప్రదాయబద్ధమైన ‘కంచు’ సరిపోతుంది; ‘రాగి’ సాధ్యమైన ప్రత్యామ్నాయంగా పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: శాపరూపకంలోని భావం
  choice: ఆకాశం ఇనుములా, నేల కంచులా అవుతాయని చెప్పే కరువు మరియు వ్యవసాయ నిష్ఫలత రూపకాన్ని ప్రధాన వచనంలో అలాగే ఉంచడం
  alternative: తీవ్రమైన కష్టాన్ని సాధారణంగా సూచించే రూపకంగా మాత్రమే వివరించడం
  rationale: నిబంధనాశాపాల సందర్భంలో ఈ చిత్రాలు వర్షాభావం, గట్టిపడిన నేల, పంటల నిష్ఫలతను సూచిస్తాయి. అయినప్పటికీ మూలం వాటిని వివరణాత్మక గద్యంగా విప్పదు కాబట్టి అనువాదం కూడా రూపకాన్ని స్పష్టీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ రూపకాల బలాన్ని నిలుపుతూ, అసహజమైన ‘మీ బలపు గర్వం’ బదులు ‘మీ బలాన్ని బట్టి మీకున్న గర్వం’ అని సహజీకరించబడింది.
