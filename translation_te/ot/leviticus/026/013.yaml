revisions:
- from: మీ దేవుడైన యహ్వేను నేనే. మీరు ఐగుప్తీయులకు బానిసలుగా ఉండకుండా మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చింది నేనే. మీ కాడి కమ్ములను విరగగొట్టి, మీరు తలెత్తుకొని నడిచేలా చేసింది నేనే.[a]
  to: నేను మీ దేవుడైన యహ్వేను. మీరు ఐగుప్తీయులకు బానిసలుగా ఉండే స్థితి నుండి మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. మీ కాడి కమ్ములను విరగగొట్టి, మిమ్మల్ని నిటారుగా నడిచేలా చేశాను.[a]
  rationale: ప్రథమపురుష పుంలింగ క్రియారూపాలతో యహ్వే వాక్యాన్ని వ్యాకరణపరంగా సరిచేశాను; మొదటి వాక్యంలో విభక్తి దోషాన్ని తొలగించాను. మూలంలోని నిటారైన భంగిమను ప్రధాన పాఠంలో ఉంచి, గౌరవాన్ని సూచించే విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణికి మార్చాను. బానిసత్వం, కాడి బింబం, మరియు విమోచనార్థం మారలేదు.
