id: LEV.26.13
reference: Leviticus 26:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: te
  text: నేను మీ దేవుడైన యహ్వేను. మీరు ఐగుప్తీయులకు బానిసలుగా ఉండే స్థితి నుండి మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. మీ కాడి కమ్ములను విరగగొట్టి, మిమ్మల్ని నిటారుగా నడిచేలా చేశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని తలెత్తుకొని నడిచేలా చేశాను.”
    reason: קוֹמְמִיּוּת నిటారైన భంగిమను సూచిస్తుంది; విమోచనతో పునరుద్ధరించబడిన గౌరవ భావాన్ని దృష్టిలో ఉంచి “తలెత్తుకొని” అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: నిబంధన సూత్రంలో యహ్వేను ఏకవచనంగా సూచిస్తున్నందున ‘దేవుడు’ అని అనువదించింది.
- source_word: הוֹצֵאתִי ... מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చింది
  rationale: హిఫీల్ క్రియలోని ‘బయటకు తీసుకురావడం’ అనే కారణార్థాన్ని, నిర్గమ కార్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: ఐగుప్తీయులకు బానిసలుగా ఉండకుండా
  rationale: עֲבָדִים ఇక్కడ సాధారణ సేవకత్వం కాక అణచివేతతో కూడిన బానిస స్థితిని సూచిస్తుంది; לָהֶם లోని ‘వారికి’ అనే సూచనను సందర్భానుసారంగా ‘ఐగుప్తీయులకు’ అని స్పష్టం చేసింది.
- source_word: מֹטֹת עֻלְּכֶם
  choice: మీ కాడి కమ్ములు
  rationale: మోసే కాడిలోని దండాలు లేదా కమ్ముల concrete బింబాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת
  choice: మీరు తలెత్తుకొని నడిచేలా చేసింది
  rationale: హిఫీల్ కారణార్థాన్నీ, קוֹמְמִיּוּת సూచించే నిటారైన భంగిమ మరియు తిరిగి పొందిన గౌరవాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఐగుప్తులో ఇశ్రాయేలీయుల స్థితి
  choice: బానిసలు
  alternative: సేవకులు
  rationale: వాక్యం అణచివేతతో కూడిన బంధనం నుండి విమోచనాన్ని ప్రాధాన్యంగా చూపుతుంది; ‘సేవకులు’ అనడం ఆ తీవ్రతను తగ్గించవచ్చు.
- issue: చివరి విమోచన బింబం
  choice: తలెత్తుకొని నడిచేలా చేసింది
  alternative: నిటారుగా నడిపించింది
  rationale: మూలంలోని కారణార్థక నడకను, వంగిపోయిన బానిస స్థితికి విరుద్ధమైన గౌరవభరిత భంగిమను కాపాడుతుంది; ‘తలెత్తుకొని’ అనేది భావాన్ని స్పష్టం చేసినా, ‘నిటారుగా’ అనే మరింత రూపపరమైన పఠనం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిబంధనాత్మక శైలి. దైవ కార్యాలపై ఉన్న పునరుక్త ప్రథమ పురుష బలాన్ని తెలుగులో ‘నేనే’ పునరావృతితో నిలిపింది.
