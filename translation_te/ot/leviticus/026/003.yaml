source:
  edition: WLC
  text: אִם בְּ/חֻקֹּתַ֖/י תֵּלֵ֑כוּ וְ/אֶת מִצְוֺתַ֣/י תִּשְׁמְר֔וּ וַ/עֲשִׂיתֶ֖ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: te
  text: మీరు నా కట్టడాల ప్రకారం నడుచుకొని, నా ఆజ్ఞలను పాటించి, వాటిని ఆచరిస్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా కట్టడాలను అనుసరించి నడుచుకుంటే.’ హీబ్రూలో అక్షరార్థంగా ‘నా కట్టడాలలో నడిస్తే’ అని ఉంది; అంటే వాటికి అనుగుణంగా తమ జీవితాన్ని నడిపించుకోవడం అనే నిబంధనపరమైన నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఆచరిస్తే
  rationale: హీబ్రూ షరతును తెలుగులో సహజంగా క్రియకు జోడించే ‘-తే’ రూపంతో వ్యక్తం చేశాం. ఇది ‘ఎప్పుడు’ అనే కాలార్థం కాకుండా స్పష్టమైన షరతును నిలుపుతుంది.
- source_word: בְּחֻקֹּתַי
  choice: నా కట్టడాల ప్రకారం
  rationale: חֻקּוֹת అనేది నియమించబడిన కట్టడాలు లేదా శాసనాలను సూచిస్తుంది. ‘కట్టడాలు’ న్యాయపరమైన, నిబంధనపరమైన భావాన్ని నిలుపుతుంది; בְּ అనే సంబంధాన్ని సహజ తెలుగులో ‘ప్రకారం’గా తెలిపాం.
- source_word: תֵּלֵכוּ
  choice: నడుచుకొని
  rationale: הלך యొక్క ప్రాథమిక ‘నడుచు’ రూపకాన్ని నిలుపుతూ, జీవన ప్రవర్తన అనే నిబంధనపరమైన భావం తెలుగులో గ్రహించగలిగేలా ఉంది.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: מִצְוָה కు ‘ఆజ్ఞ’ సహజమైన, గౌరవప్రదమైన సమానం; ఇది వాక్యంలోని న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: תִּשְׁמְרוּ
  choice: పాటించి
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే వాటిని కాపాడటం మాత్రమే కాక వాటికి విధేయంగా ఉండటం. ‘పాటించు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరిస్తే
  rationale: עשה ఇక్కడ ఆజ్ఞలను కార్యరూపంలో చేయడాన్ని సూచిస్తుంది. ‘ఆచరించు’ విధేయతను అమలులో పెట్టే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కట్టడాలలో నడవడం అనే నిబంధనపరమైన రూపకం
  choice: ‘నా కట్టడాల ప్రకారం నడుచుకొని’ అని రూపకాన్ని నిలుపుతూ సహజ తెలుగు సంబంధాన్ని వాడటం
  alternative: ‘నా కట్టడాలను అనుసరించి జీవిస్తే’ లేదా అక్షరార్థంగా ‘నా కట్టడాలలో నడిస్తే’
  rationale: ‘నడుచు’ అనే హీబ్రూ రూపకాన్ని పూర్తిగా తొలగించకుండా, ‘ప్రకారం’ ద్వారా అది శారీరక నడక కాక జీవన ప్రవర్తన అని స్పష్టం చేశాం. దీనివల్ల విధేయత అనే భావాన్ని అతిగా సిద్ధాంతీకరించకుండా మూలంలోని నిబంధనపరమైన భాష నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘కట్టడాలు,’ ‘ఆజ్ఞలు,’ ‘పాటించు,’ ‘ఆచరించు’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని న్యాయ-నిబంధన స్వరాన్ని నిలుపుతాయి. ఇది తరువాతి వచనాల్లో పూర్తయ్యే షరతు వాక్యభాగం కాబట్టి చివర కామాను ఉంచాం.
