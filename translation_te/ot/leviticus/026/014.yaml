  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: te
  text: అయితే మీరు నా మాట వినక, ఈ ఆజ్ఞలన్నిటినీ పాటించకపోతే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు విధేయత చూపకపోతే.” హీబ్రూ క్రియకు విధేయతతో వినడం అనే భావం కూడా ఉండవచ్చు; అయితే ప్రధాన పాఠం ‘నా మాట వినడం’ అనే మరింత అక్షరార్థమైన రూపాన్ని నిలుపుతుంది.
