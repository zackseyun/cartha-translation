lexical_decisions:
- source_word: וְאִם
  choice: అయితే …కపోతే
  rationale: ముందున్న ఆశీర్వాదాల విభాగానికి భిన్నమైన షరతును పరిచయం చేస్తుంది. తెలుగులో ‘అయితే’ వ్యత్యాసాన్ని, ‘కపోతే’ షరతును సహజంగా తెలియజేస్తాయి.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: మీరు నా మాట వినకుండా
  rationale: שׁמע ל అనేది వినడాన్ని, సందర్భానుసారంగా విధేయత చూపడాన్ని సూచించగలదు. ‘నా మాట వినడం’ అనే తెలుగు ప్రయోగం మూలంలోని వినికిడి భావాన్ని నిలుపుతూ విధేయత అంతర్భావాన్నీ సహజంగా కలిగి ఉంటుంది.
- source_word: וְלֹא תַעֲשׂוּ
  choice: పాటించకపోతే
  rationale: ఆజ్ఞలకు సంబంధించి עשה అంటే వాటిని కార్యరూపంలో చేయడం. తెలుగులో ‘ఆజ్ఞలను పాటించడం’ అనేది సహజమైన న్యాయ-నిబంధన ప్రయోగం.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ఈ ఆజ్ఞలన్నిటినీ
  rationale: כָּל యొక్క సమగ్రతను ‘అన్నిటినీ,’ הָאֵלֶּה అనే సూచనను ‘ఈ,’ מִצְוֺת అనే నిబంధనాత్మక పదాన్ని ‘ఆజ్ఞలు’ స్పష్టంగా తెలియజేస్తాయి.
theological_decisions:
- issue: שׁמע ל ను కేవలం ‘విధేయత చూపడం’గా అనువదించాలా, లేక వినడం అనే మూల రూపకాన్ని నిలుపుకోవాలా
  choice: నా మాట వినకుండా
  alternative: నాకు విధేయత చూపకుండా
  rationale: మూలపాఠం యెహోవా మాట వినడాన్నీ, ఆజ్ఞలను చేయడాన్నీ రెండు సమన్వితమైనా వేరువేరు వాక్యభాగాలుగా ఉంచుతుంది. ‘నా మాట వినడం’ ఆ భేదాన్ని నిలుపుతుంది; దాని విధేయత భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన నిబంధనాత్మక శైలి. ‘నా మాట వినడం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ మూలంలోని శ్రవణ-విధేయత భావసాంద్రతను కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
