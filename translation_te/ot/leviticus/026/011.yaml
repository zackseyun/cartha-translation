  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: te
  text: నేను నా నివాసాన్ని మీ మధ్య నెలకొల్పుతాను; నా మనస్సు మిమ్మల్ని అసహ్యించుకోదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: నా నివాసస్థలాన్ని
  rationale: ‘నా నివాసం/నివాసస్థలం’ అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని దేవుని సన్నిధిని సూచిస్తూ, అవసరం లేని సాంకేతిక పదాన్ని జోడించదు.
- source_word: בְּתוֹכְכֶם
  choice: మీ మధ్య
  rationale: సమాజం నడుమ దేవుని నివాసాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: హీబ్రూ వాక్యంలో స్పష్టంగా ఉన్న ‘నా నెఫెష్’ను తొలగించకుండా ఉంచి, దేవుని స్వయాన్ని బలంగా వ్యక్తం చేసే మూలభాషా రూపాన్ని సంరక్షిస్తుంది.
- source_word: תִגְעַל
  choice: అసహ్యించుకోదు
  rationale: తీవ్రమైన తిరస్కారం లేదా ఏవగింపును సూచించే క్రియకు నేరుగా, అర్థవంతంగా సరిపోతుంది.
theological_decisions:
- issue: దేవునికి ‘ప్రాణం’ అనే భాషను నిలుపుకోవడం
  choice: నా ప్రాణం మిమ్మల్ని అసహ్యించుకోదు
  alternative: నేను మిమ్మల్ని అసహ్యించుకోను
  rationale: మూలంలో ఉన్న נַפְשִׁי (‘నా ప్రాణం/నా స్వయం’) అనే పదాన్ని అనువాదంలో నిలిపి, దాని మానవరూపక మరియు ధార్మిక ఉద్రిక్తతను నిశ్శబ్దంగా సరళీకరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గంభీరమైన వాక్యనిర్మాణం. మూలంలోని రెండు సమాంతర ప్రకటనలను అర్ధవిరామంతో కలిపి, ‘నా ప్రాణం’ అనే ఉద్దేశపూర్వక మూలభాషా వ్యక్తీకరణను నిలిపాం.
