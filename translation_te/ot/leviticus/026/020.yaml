review_pass:
  verdict: revise
  source_fidelity: 'The main rendering accurately represents the Hebrew: strength is exhausted futilely, the land does not give its yield, and the collectively expressed tree(s) of the land do not give fruit. Rendering the collective singular עֵץ as plural ‘చెట్లు’ is natural Telugu and preserves the sense.'
  naturalness: The verse is clear and natural in modern standard Telugu. The footnote’s phrase ‘శూన్యత కోసం’ is an overly literal calque and can imply purpose (‘for emptiness’) rather than futile result; it should be recast in idiomatic Telugu.
  terminology: ‘బలం,’ ‘భూమి,’ ‘పంట,’ and ‘పండ్లు’ are appropriate, accessible agricultural terms. No doctrinally loaded terminology is involved.
  issues:
