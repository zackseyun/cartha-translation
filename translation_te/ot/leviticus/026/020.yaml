    rationale: ‘శూన్యత కోసం పూర్తిగా తరిగిపోతుంది’ calques the Hebrew lariq too closely. In Telugu, ‘ఫలితం లేకుండా’ naturally expresses the intended futility without suggesting that emptiness is the purpose of the expenditure.
  revised_text: మీ బలం వ్యర్థంగా ఖర్చైపోతుంది[a]. మీ భూమి తన పంటను ఇవ్వదు; భూమిలోని చెట్లు తమ పండ్లను ఇవ్వవు.
