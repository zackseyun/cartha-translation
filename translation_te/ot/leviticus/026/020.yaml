source:
  edition: WLC
  text: וְ/תַ֥ם לָ/רִ֖יק כֹּחֲ/כֶ֑ם וְ/לֹֽא תִתֵּ֤ן אַרְצְ/כֶם֙ אֶת יְבוּלָ֔/הּ וְ/עֵ֣ץ הָ/אָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: te
  text: మీ బలం వ్యర్థంగా ఖర్చైపోతుంది[a]. మీ భూమి తన పంటను ఇవ్వదు; భూమిలోని చెట్లు తమ పండ్లను ఇవ్వవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మీ బలం పూర్తిగా క్షీణించి ఫలితం లేకుండా పోతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: ఖర్చైపోతుంది
  rationale: תמם ఇక్కడ బలం పూర్తిగా వినియోగమై తరిగిపోవడాన్ని సూచిస్తుంది. వ్యవసాయ శ్రమ సందర్భంలో ‘ఖర్చైపోతుంది’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לָרִיק
  choice: వ్యర్థంగా
  rationale: ఈ పదబంధం ఫలితం లేని శ్రమను, నిష్ప్రయోజకతను సూచిస్తుంది; ‘వ్యర్థంగా’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: כֹּחֲכֶם
  choice: మీ బలం
  rationale: כח అంటే బలం లేదా శక్తి. ఇక్కడ శ్రమ చేయడానికి వినియోగించే సామర్థ్యాన్ని సూచిస్తున్నందున ‘మీ బలం’ సరిపోతుంది.
- source_word: תִתֵּן
  choice: ఇవ్వదు
  rationale: హీబ్రూ క్రియకు ప్రాథమిక అర్థం ‘ఇవ్వడం’. భూమి, చెట్లు పంటను లేదా పండ్లను ఇవ్వడం తెలుగులోనూ సహజంగా ఉంటుంది; మూల రూపకాన్ని నిలుపుతుంది.
- source_word: אַרְצְכֶם
  choice: మీ భూమి
  rationale: ఈ సందర్భంలో ארץ సాగుచేసే ఇశ్రాయేలీయుల భూభాగాన్ని సూచిస్తుంది; ‘మీ భూమి’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: יְבוּלָהּ
  choice: తన పంటను
  rationale: יבול భూమి ఇచ్చే దిగుబడి లేదా ఉత్పత్తిని సూచిస్తుంది. సాధారణ పాఠకులకు ‘పంట’ సహజంగా ఉండి వ్యవసాయ ఫలాన్ని విస్తృతంగా తెలియజేస్తుంది.
- source_word: וְעֵץ הָאָרֶץ
  choice: భూమిలోని చెట్లు
  rationale: עץ ఏకవచన రూపంలో ఉన్నప్పటికీ ఇక్కడ సమూహార్థకంగా వాడబడింది. తెలుగులో బహువచనమైన ‘చెట్లు’ సహజంగా ఆ సమూహార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: פִּרְיוֹ
  choice: తమ పండ్లను
  rationale: హీబ్రూలో ప్రత్యయం ఏకవచన సమూహనామమైన עץతో సరిపోతుంది. తెలుగులో ‘చెట్లు’ అని బహువచనంగా అనువదించినందున ‘తమ పండ్లను’ వ్యాకరణపరంగా సహజం.
