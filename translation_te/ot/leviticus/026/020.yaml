translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని వ్యవసాయ దృశ్యాన్ని, శ్రమ నిష్ఫలమయ్యే భావాన్ని నిలుపుతూ సహజమైన వాక్యనిర్మాణం ఉపయోగించబడింది.
