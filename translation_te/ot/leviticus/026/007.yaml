  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: te
  text: మీరు మీ శత్రువులను తరుముతారు; వారు మీ ఎదుట ఖడ్గం చేత[a] పడిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖడ్గానికి పడిపోతారు.” హీబ్రూ ప్రయోగాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: మీరు ... తరుముతారు
  rationale: רדף అంటే సాధారణంగా ‘వెంబడించు, తరుము.’ యుద్ధ సందర్భంలో ‘తరుముతారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אֶת אֹיְבֵיכֶם
  choice: మీ శత్రువులను
  rationale: אֹיֵב అనేది ‘శత్రువు’కు సాధారణ పదం; రెండవ పురుష బహువచన స్వామ్య ప్రత్యయం ‘మీ’గా నేరుగా వ్యక్తమైంది.
- source_word: וְנָפְלוּ
  choice: వారు ... కూలిపోతారు
  rationale: נפל యొక్క ప్రాథమిక దృశ్యం ‘పడిపోవడం.’ యుద్ధ సందర్భంలో ఓటమి లేదా మరణాన్ని సూచించగలిగినా, ‘కూలిపోతారు’ ఆ దృశ్యాన్ని నిలుపుతుంది.
- source_word: לִפְנֵיכֶם
  choice: మీ ఎదుట
  rationale: לפני ఇక్కడ ‘మీ ముందు/మీ ఎదుట’ అనే అర్థం ఇస్తుంది; ‘మీ ఎదుట’ యుద్ధ సందర్భంలో సహజంగా ఉంది.
- source_word: לֶחָרֶב
  choice: ఖడ్గానికి
  rationale: ל + חרב నిర్మాణం ఖడ్గం ద్వారా కలిగే యుద్ధ మరణం లేదా పతనాన్ని సూచిస్తుంది. ‘ఖడ్గానికి కూలిపోతారు’ హీబ్రూ నిర్మాణంలోని దిశాత్మక/ఫలిత భావాన్ని నిలుపుతూ తెలుగులో గ్రాహ్యంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ‘ఖడ్గానికి కూలిపోతారు’ అనే రూపం మూలంలోని לֶחָרֶב భావాన్ని అనవసరంగా కేవలం సాధనార్థకంగా పరిమితం చేయకుండా నిలుపుతుంది.
