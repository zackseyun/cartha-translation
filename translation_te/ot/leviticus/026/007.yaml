review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and principal senses of the Hebrew: pursuit of enemies, their falling before the Israelites, and the sword-related outcome. However, the Telugu dative phrase “ఖడ్గానికి కూలిపోతారు” is less idiomatic and can suggest falling toward a sword rather than falling by it. “ఖడ్గం చేత పడిపోతారు” preserves the literal battle imagery and the instrumental/resultative force without narrowing it to death alone.'
  naturalness: “తరుముతారు” and “మీ ఎదుట” are natural modern-standard Telugu in this elevated military context. Replacing “కూలిపోతారు” with “పడిపోతారు” better reflects the Hebrew image and avoids the somewhat over-specific sense of collapse. “ఖడ్గం చేత” is a clear formal-register biblical expression.
  terminology: “శత్రువులు” and “ఖడ్గం” are appropriate, recognizable terms for this register. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The phrase “ఖడ్గానికి కూలిపోతారు” is not the most natural Telugu expression for the Hebrew battle idiom.
    rationale: The dative construction can be understood, but it is awkward and may imply direction toward the sword. “ఖడ్గం చేత పడిపోతారు” more naturally conveys falling in battle by the sword while retaining the source’s imagery.
  - severity: low
    issue: The source/audit-trail ambiguity of לֶחָרֶב is not retained in a footnote.
    rationale: A brief footnote records the viable more literal dative rendering without burdening the main text or making an interpretive claim.
