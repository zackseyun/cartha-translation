source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: te
  text: న్యాయమైన త్రాసులు[a], న్యాయమైన తూకపు రాళ్లు, న్యాయమైన ఏఫా కొలమానం[b], న్యాయమైన హీను కొలమానం[c] మీకు ఉండాలి. మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన మీ దేవుడైన యహ్వేను నేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘న్యాయమైన’ అనే పదాన్ని ‘నిజాయితీగల’ లేదా ‘సరైన’ అని కూడా అనువదించవచ్చు. ఇక్కడ పునరావృతమైన హెబ్రీ పదం צֶדֶק సాధారణంగా ‘నీతి’ లేదా ‘న్యాయం’ అని అర్థం; ఈ వచనంలో అది వ్యాపార త్రాసులు, తూకాలు, కొలతలకు వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఏఫా అనేది పొడి పదార్థాలను కొలిచే ప్రాచీన కొలమానం.
    reason: cultural_note
  - marker: c
    text: హీను అనేది ద్రవాలను కొలిచే ప్రాచీన కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: న్యాయమైన త్రాసులు
  rationale: מֹאזְנַיִם వ్యాపారంలో బరువు తూచే త్రాసులను సూచిస్తుంది. צֶדֶק యొక్క న్యాయం, నిజాయితీ అనే నైతిక భావాన్ని ‘న్యాయమైన’ సహజమైన వాణిజ్య సందర్భంలో తెలియజేస్తుంది.
- source_word: אַבְנֵי צֶדֶק
  choice: న్యాయమైన తూకపు రాళ్లు
  rationale: אַבְנֵי అక్షరార్థంగా ‘రాళ్లు’; ఇక్కడ అవి త్రాసులో ఉపయోగించే ప్రమాణ తూకపు రాళ్లు. మూల సంస్కృతిలోని స్పష్టమైన రూపాన్ని నిలుపుతూ వాటి పనిని కూడా తెలియజేయడానికి ‘తూకపు రాళ్లు’ అని అనువదించాం.
- source_word: אֵיפַת צֶדֶק
  choice: న్యాయమైన ఏఫా
  rationale: אֵיפָה పొడి పదార్థాలను కొలిచే ప్రాచీన ప్రమాణం. తప్పుదారి పట్టించే ఆధునిక సమాన పరిమాణాన్ని ఇవ్వకుండా మూల ప్రమాణ నామాన్ని లిప్యంతరీకరించాం.
- source_word: וְהִין צֶדֶק
  choice: న్యాయమైన హీను
  rationale: הִין ద్రవాలను కొలిచే ప్రాచీన ప్రమాణం. ఏఫా మాదిరిగానే మూల సంస్కృతి ప్రత్యేకతను కాపాడేందుకు దాని పేరును లిప్యంతరీకరించాం.
- source_word: יִהְיֶה לָכֶם
  choice: మీ దగ్గర ... ఉండాలి
  rationale: అక్షరార్థంగా ‘మీకు ఉండాలి/మీ కోసం ఉండాలి.’ ఆజ్ఞార్థక బాధ్యతను ఆధునిక తెలుగులో సహజంగా చెప్పేందుకు ‘మీ దగ్గర ... ఉండాలి’ అని ఇచ్చాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా ‘యహ్వే’ అని ఇచ్చాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యహ్వేతో కూడిన నిబంధన సూత్రవాక్యంలో ఇది ఏకవచనార్థకంగా ‘మీ దేవుడు’ అని అర్థం.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన
  rationale: నిర్గమనాన్ని జ్ఞాపకం చేసే నిబంధన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో, కారణాత్మక క్రియ భావాన్ని కాపాడుతూ అనువదించాం.
theological_decisions:
- issue: వాణిజ్య కొలతలను విశేషించే צֶדֶק పదాన్ని నాలుగుసార్లు అనువదించడం
  choice: న్యాయమైన
  alternative: నిజాయితీగల / సరైన / కచ్చితమైన
  rationale: צֶדֶקకు నీతి, న్యాయం అనే విస్తృత భావక్షేత్రం ఉంది. ఇక్కడ అది త్రాసులు, తూకాలు, కొలతలకు వర్తిస్తుంది. ‘న్యాయమైన’ మూలపద పునరావృతాన్ని, వాణిజ్య నైతిక బలాన్ని రెండింటినీ నిలుపుతుంది; పాదసూచిక సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- issue: ప్రాచీన కొలమానాల పేర్లను నిలుపుకోవడం
  choice: ఏఫా, హీను
  alternative: పొడి కొలమానం, ద్రవ కొలమానం లేదా ఆధునిక అంచనా పరిమాణాలు
  rationale: నిర్దిష్టమైన ప్రాచీన ప్రమాణాలను అస్పష్టమైన సాధారణ పదాలతో లేదా వివాదాస్పద ఆధునిక మార్పిడులతో భర్తీ చేయకుండా మూల సంస్కృతి సమాచారాన్ని నిలిపాం; పాదసూచికలు వాటి రకాన్ని వివరిస్తాయి.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారించలేనప్పటికీ ‘యహ్వే’ విస్తృతంగా అంగీకరించబడిన పునర్నిర్మాణం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. చట్టసంబంధ ఆజ్ఞ యొక్క బలాన్ని ‘ఉండాలి’ నిలుపుతుంది. మూలంలోని צֶדֶק పునరావృతాన్ని నాలుగుసార్లు ‘న్యాయమైన’గా ప్రతిబింబించాం. ‘తూకపు రాళ్లు’ మూలంలోని సాంస్కృతిక రూపాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంచుతుంది.
