  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: te
  text: మీరు నా పేరుతో అబద్ధంగా ప్రమాణం చేయకూడదు; అలా మీ దేవుని పేరును అపవిత్రం చేయకూడదు.[a] నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మీరు నా పేరుతో అబద్ధం కోసం ప్రమాణం చేయకూడదు; మీ దేవుని పేరును అపవిత్రం చేయకూడదు.”'
    reason: లַשָּׁקֶר పదబంధంలోని “అబద్ధం కోసం/అబద్ధానికి” అనే అక్షరార్థాన్ని, అలాగే రెండు క్రియల సమన్వయాన్ని సూచించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: ప్రమాణం చేయకూడదు
  rationale: నిఫల్ రూపంలోని שׁבע న్యాయనైతిక సందర్భంలో ప్రమాణం చేయడం అనే అర్థమిస్తుంది; తెలుగు నిషేధ వాక్యానికి ‘చేయకూడదు’ సహజమైన, స్పష్టమైన రూపం.
- source_word: בִשְׁמִי
  choice: నా పేరుతో
  rationale: ప్రమాణ సందర్భంలో בִּ అనే ఉపసర్గ, ఆ పేరును ప్రమాణానికి ఆధారంగా పిలుచుకోవడాన్ని సూచిస్తుంది; తెలుగులో ‘పేరుతో’ సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: לַשָּׁקֶר
  choice: అబద్ధ ప్రమాణం
  rationale: అక్షరార్థంగా ‘అబద్ధం కోసం/అబద్ధానికి’ అయినా, ప్రమాణ సందర్భంలో ఇది ప్రమాణం అబద్ధమైనదని సూచిస్తుంది; ‘అబద్ధ ప్రమాణం చేయడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וְחִלַּלְתָּ
  choice: అపవిత్రపరచకూడదు
  rationale: పియేల్ రూపంలోని חלל పవిత్రతను భంగపరచడం లేదా అపవిత్రం చేయడం అని అర్థం. సమన్వయించిన నిషేధంగా అనువదించడం మూలంలోని కార్య-ఫలిత సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֵׁם
  choice: పేరు
  rationale: దేవుని వెల్లడైన గుర్తింపూ ఘనతా ఇందులో ఇమిడి ఉన్నందున ‘పేరు’ అనే మూల రూపకాన్ని నిలుపుకున్నాం.
- source_word: אֱלֹהֶיךָ
  choice: మీ దేవుని
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా ఇక్కడ ఏకవచన సూచనతో ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది. సంబోధన సమూహానికి సంబంధించినందున ఆధునిక గౌరవ/బహువచన తెలుగు ‘మీ’ వాడాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరణ ద్వారా నిలుపుకున్నాం.
- issue: రెండవ క్రియకు మొదటి నిషేధంతో ఉన్న సంబంధం
  choice: ఒకే సమన్వయ నిషేధంగా ‘చేసి ... అపవిత్రపరచకూడదు’
  alternative: ఫలితాన్ని స్పష్టంచేస్తూ ‘తద్వారా ... అపవిత్రపరచకూడదు’
  rationale: హీబ్రూ וְ సాధారణ సమన్వయాన్నీ సందర్భానుసార ఫలితాన్నీ సూచించగలదు. తెలుగు నిర్మాణం అబద్ధ ప్రమాణం దేవుని పేరును అపవిత్రం చేస్తుందనే సంబంధాన్ని చూపుతుంది; అయితే మూలంలో లేని కారణసూచక పదాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయనైతిక శైలిని వాడాం. సమూహాన్ని ఉద్దేశించిన హీబ్రూ బహువచనానికి ‘మీరు/మీ’ వాడాం. ‘యాహ్వే’ అనే దైవ నామాన్ని ప్రత్యక్షంగా నిలుపుకున్నాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
