id: LEV.19.16
reference: Leviticus 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: te
  text: నీ ప్రజల మధ్య అపవాదాలు చెబుతూ తిరగకూడదు. నీ పొరుగువాని రక్తానికి వ్యతిరేకంగా నిలబడకూడదు.[a] నేనే యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పొరుగువాని రక్తం చిందించబడుతున్నప్పుడు చూస్తూ నిలబడకూడదు.”
    reason: హీబ్రూ పదబంధం, పొరుగువాని ప్రాణం ప్రమాదంలో ఉన్నప్పుడు ఏమీ చేయకుండా నిలబడటాన్ని నిషేధిస్తున్నదని కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: అపవాదాలు మోసేవాడిగా తిరగకూడదు
  rationale: הלך (‘వెళ్లు/తిరుగు’) మరియు רכיל (‘హానికరమైన వార్తలు లేదా అపవాదాలు వ్యాప్తి చేసేవాడు’) కలిసిన ప్రయోగం సమాజంలో తిరుగుతూ అపవాదాలు మోసే ప్రవర్తనను సూచిస్తుంది. ‘తిరగడం’ అనే హీబ్రూ దృశ్యాన్ని నిలుపుతూ, దాని నైతిక తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעַמֶּיךָ
  choice: నీ ప్రజల మధ్య
  rationale: בְּ ఉపసర్గతో కూడిన ‘నీ ప్రజలు’ అనే పదబంధం, ఈ ప్రవర్తన సమాజం మధ్య జరుగుతుందని సూచిస్తుంది; ‘మధ్య’ తెలుగులో సహజమైన సమానార్థకం.
- source_word: תַעֲמֹד עַל
  choice: విరోధంగా నిలబడకూడదు
  rationale: עמד యొక్క ప్రాథమిక ‘నిలబడు’ భావాన్ని ఉంచి, על కు ఇక్కడ సాధ్యమైన ప్రతికూల లేదా విరోధ భావాన్ని ‘విరోధంగా’ ద్వారా వ్యక్తం చేసింది. ఈ కఠినమైన హీబ్రూ ప్రయోగానికి ఉన్న మరో ముఖ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: דַּם
  choice: రక్తం
  rationale: דם అక్షరార్థంగా ‘రక్తం’; సందర్భంలో అది జీవం లేదా రక్తపాతాన్ని సూచించవచ్చు. ‘రక్తం’ అనే నిర్దిష్టమైన హీబ్రూ రూపకాన్ని అనువాదం నిలుపుతుంది.
- source_word: רֵעֶךָ
  choice: నీ పొరుగువాని
  rationale: రֵעַ ఇక్కడ తోటి సమాజ సభ్యుణ్ణి సూచిస్తుంది. ‘పొరుగువాడు’ ఆధునిక తెలుగులో స్థిరపడిన, సహజమైన బైబిలు పదప్రయోగం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ అనే పదబంధం యొక్క భావం
  choice: పొరుగువాని రక్తానికి విరోధంగా నిలబడడాన్ని నిషేధించే వాక్యంగా ప్రధాన పాఠంలో ఉంచడం
  alternative: పొరుగువాని రక్తం చిందించబడుతున్నప్పుడు ఏమీ చేయకుండా చూస్తూ నిలబడవద్దనే నిషేధం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి, על ఇక్కడ విరోధ చర్యనో, ప్రాణాపాయంలో ఉన్నవానికి సహాయం చేయకుండా నిలబడటాన్నో సూచించవచ్చు. ప్రధాన పాఠం ‘రక్తం’ మరియు ‘నిలబడు’ అనే మూల దృశ్యాలను నిలుపుతూ ప్రతికూల భావాన్ని అందిస్తుంది; నిష్క్రియ ఉదాసీనత అనే విస్తృతంగా అంగీకరించబడిన భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించింది. మూలంలోని ఆజ్ఞాత్మక నిషేధ నిర్మాణం, ‘రక్తం’ మరియు ‘నిలబడు’ అనే స్పష్టమైన దృశ్యాలు నిలుపబడ్డాయి. [a] సూచిక సంబంధిత రెండవ వాక్యం వద్ద ఉంచబడింది.
