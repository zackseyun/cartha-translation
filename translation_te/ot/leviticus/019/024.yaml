source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: te
  text: కాని నాలుగో సంవత్సరంలో దాని పండ్లన్నీ యెహోవాకు స్తుతులు చెల్లించడానికి పవిత్రమైనవిగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “యెహోవాకు స్తుతులుగా పవిత్రమైనవి” లేదా “యెహోవాకు స్తుతి చెల్లించడానికి పవిత్రమైనవి.” ఈ హీబ్రూ పదబంధం అరుదైనది; పండ్లతో అనుబంధమైన ఉత్సవపూర్వక స్తుతిని ఇది నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: కాని నాలుగో సంవత్సరంలో
  rationale: ו అనేది ముందటి మూడు సంవత్సరాలతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుండగా, ב కాలాన్ని సూచిస్తుంది; ordinal הָרְבִיעִת‌ను సహజమైన తెలుగులో ‘నాలుగో’గా అనువదించాం.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: న్యాయనియమ సందర్భంలోని భవిష్యత్ ఆజ్ఞాత్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל פִּרְיוֹ
  choice: దాని పండ్లన్నీ
  rationale: చెట్టుకు కలిగే మొత్తం ఫలసంపదను సూచించే כָּל మరియు ఏకవచన సమూహార్థక פְּרִי భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קֹדֶשׁ
  choice: ప్రతిష్ఠితంగా
  rationale: ఫలం పవిత్ర వినియోగం కోసం ప్రత్యేకించబడిందనే విధేయార్థాన్ని తెలియజేస్తుంది; ‘పవిత్రంగా’ కూడా సాధ్యమే అయినా ఇక్కడ అర్పణకు వేరుచేయబడిన స్థితి ప్రధానంగా ఉంది.
- source_word: הִלּוּלִים
  choice: స్తుతులు చెల్లించడానికి
  rationale: అరుదైన బహువచన నామవాచకం స్తుతి లేదా ఉత్సవపూర్వక ప్రశంసను సూచిస్తుంది. మూలంలో లేని నిర్దిష్ట ‘అర్పణ’ పదాన్ని చేర్చకుండా దాని కార్యార్థాన్ని తెలుగులో అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל సమర్పణ లేదా దిశను సూచిస్తుంది; יהוה అనే దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: קֹדֶשׁ הִלּוּלִים అనే అరుదైన ఆరాధనా పదబంధం
  choice: ప్రతిష్ఠితంగా ఉండాలి—యెహోవాకు స్తుతులు చెల్లించడానికి
  alternative: యెహోవాకు స్తుతులుగా పవిత్రంగా ఉండాలి
  rationale: పదబంధం యొక్క వ్యాకరణ సంబంధం అరుదైనదీ కొంత సందిగ్ధమైనదీ. ప్రధాన పాఠం స్తుతి కోసం ఫలం ప్రత్యేకించబడిందనే భావాన్ని సహజంగా ఇస్తుంది; పాదసూచిక మరింత రూపానుసారమైన ప్రత్యామ్నాయాలను నిలుపుతుంది.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. న్యాయవిధి భావానికి ‘ఉండాలి’ వాడబడింది. అరుదైన హీబ్రూ పదబంధంలోని సందిగ్ధతను ప్రధాన పాఠంలో అతిగా వివరణ చేయకుండా, పాదసూచికలో ప్రత్యామ్నాయాలతో భద్రపరిచాం.
