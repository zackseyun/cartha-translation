id: LEV.19.19
reference: Leviticus 19:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: te
  text: మీరు నా కట్టడలను పాటించాలి. మీ పశువులను వేర్వేరు రకాలతో జతకట్టించకూడదు. మీ పొలంలో రెండు రకాల విత్తనాలను కలిపి విత్తకూడదు. కలగలిసిన పదార్థాలతో చేసిన వస్త్రం—షాట్నేజ్[a]—మీ మీద ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘షాట్నేజ్’ అనేది నిషేధించబడిన మిశ్రమ వస్త్రానికి సంబంధించిన ప్రత్యేక పదం. సాంప్రదాయంగా దీనిని ఉన్ని, నార కలిపిన వస్త్రంగా అర్థం చేసుకుంటారు; ద్వితీయోపదేశకాండము 22:11 చూడండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: నా కట్టడలను
  rationale: חֻקָּה స్థిరంగా నిర్దేశించిన ఆజ్ఞలు లేదా చట్టనియమాలను సూచిస్తుంది. ‘కట్టడలు’ న్యాయపరమైన బలాన్ని నిలుపుతూ తెలుగు బైబిలు శైలిలో సహజంగా ఉంటుంది.
- source_word: תִּשְׁמֹרוּ
  choice: పాటించాలి
  rationale: నిబంధన లేదా ధర్మశాస్త్ర సందర్భంలో שׁמר కేవలం కాపాడడం కాక ఆచరించడం, పాటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּהֶמְתְּךָ
  choice: మీ పశువులలో
  rationale: בְּהֵמָה ఇక్కడ పెంపుడు పశువులను విస్తృతంగా సూచిస్తుంది; ఒకే జంతువుల వర్గానికి పరిమితం చేయదు.
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: వేర్వేరు జాతులను జతకట్టించకూడదు
  rationale: רבע హిఫీల్ రూపం జంతువులను జతకట్టించడాన్ని సూచిస్తుంది; כִּלְאַיִם భిన్న రకాల కలయికను సూచిస్తుంది. ‘జాతులు’ వ్యవసాయ సందర్భంలో సహజమైనదైనా ఆధునిక జీవశాస్త్ర వర్గీకరణను ఖచ్చితంగా నిర్దేశించదు.
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: మీ పొలంలో రెండు రకాల విత్తనాలను కలిపి విత్తకూడదు
  rationale: זרעకు ‘విత్తు’ సరియైన వ్యవసాయ పదం. כִּלְאָיִם పునరావృతాన్ని ‘రెండు రకాల... కలిపి’ అని స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
- source_word: בֶגֶד כִּלְאַיִם
  choice: కలగలిపిన నూలుతో చేసిన వస్త్రం
  rationale: בֶּגֶד వస్త్రాన్ని, כִּלְאַיִם భిన్న పదార్థాల కలయికను సూచిస్తాయి. ‘నూలు’ అని చెప్పడం వస్త్ర సందర్భాన్ని స్పష్టం చేస్తుంది; ప్రధాన పాఠంలో ఉన్ని-నార అని ముందుగానే నిర్దేశించదు.
- source_word: שַׁעַטְנֵז
  choice: షాట్నేజ్
  rationale: ఇది అరుదైన సాంకేతిక పదం. దాని ఖచ్చిత స్వభావాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా లిప్యంతరీకరించి, వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: మీ మీదికి రాకూడదు
  rationale: ‘మీ మీదికి ఎక్కకూడదు/రాకూడదు’ అనే హెబ్రీ రూపకాన్ని సమీపంగా నిలుపుతుంది. ‘ధరించకూడదు’ అనేది సాధ్యమైన భావార్థమైనా మరింత వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: కలగలిపిన వస్త్రం యొక్క ఖచ్చిత పదార్థాలు
  choice: ప్రధాన పాఠంలో సాంకేతిక పదాన్ని నిలిపి, ఉన్ని-నార అనే సాంప్రదాయ అవగాహనను పాదసూచికలో పేర్కొనడం
  alternative: ప్రధాన పాఠంలోనే ‘ఉన్ని, నార కలిపిన వస్త్రం’ అని అనువదించడం
  rationale: లేవీయకాండంలోని שַׁעַטְנֵז స్వయంగా పదార్థాలను వివరించదు; ద్వితీయోపదేశకాండము 22:11 దానిని ఉన్ని-నార కలయికగా వివరిస్తుంది. అందువల్ల మూలంలోని ప్రత్యేక పదం, కొంత అస్పష్టత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి ఉపయోగించబడింది. ఆజ్ఞల వరుసను చిన్న వాక్యాలతో స్పష్టం చేశాం. అరుదైన హెబ్రీ సాంకేతిక పదాన్ని తెలుగులో లిప్యంతరీకరించి, దాని వివరణను పాదసూచికలో ఉంచాం.
