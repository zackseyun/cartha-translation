    rationale: ‘మీ పశువులలో వేర్వేరు జాతులను జతకట్టించకూడదు’ అనగా జతకట్టించబడేవి ‘జాతులు’ అన్నట్లుగా వినిపించవచ్చు. హెబ్రీలో మీ పశువులను భిన్న రకాలతో జతకట్టించరాదని అర్థం.
