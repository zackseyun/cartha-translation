- from: మీరు నా కట్టడలను పాటించాలి. మీ పశువులలో వేర్వేరు జాతులను జతకట్టించకూడదు. మీ పొలంలో రెండు రకాల విత్తనాలను కలిపి విత్తకూడదు. కలగలిపిన నూలుతో చేసిన వస్త్రం—షాట్నేజ్[a]—మీ మీదికి రాకూడదు.
  to: మీరు నా కట్టడలను పాటించాలి. మీ పశువులను వేర్వేరు రకాలతో జతకట్టించకూడదు. మీ పొలంలో రెండు రకాల విత్తనాలను కలిపి విత్తకూడదు. కలగలిసిన పదార్థాలతో చేసిన వస్త్రం—షాట్నేజ్[a]—మీ మీద ఉండకూడదు.
  rationale: 'సవరణలు మూలార్థాన్ని మార్చకుండా మూడు విషయాలను మెరుగుపరుస్తాయి: పశువుల జతకట్టింపు యొక్క కర్తవ్యాన్ని స్పష్టం చేస్తాయి, వస్త్రం గురించి మూలంలో లేని ‘నూలు’ అనే నిర్దిష్టతను తొలగిస్తాయి, మరియు చివరి హెబ్రీ నుడికారానికి సహజమైన తెలుగు రూపాన్ని ఇస్తాయి. షాట్నేజ్‌కు సంబంధించిన అస్పష్టతను పాదసూచికలోనే నిలిపాము.'
