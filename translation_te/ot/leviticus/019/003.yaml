id: LEV.19.3
reference: Leviticus 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: te
  text: మీలో ప్రతి ఒక్కరూ తన తల్లికి, తన తండ్రికి భయపడాలి[a]. మీరు నా సబ్బాతులను పాటించాలి[b]. నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రతి ఒక్కరూ’ అని అనువదించిన హీబ్రూ పదం అక్షరార్థంగా ‘ప్రతి పురుషుడు.’ ‘భయపడాలి’ అనే క్రియకు ఇక్కడ ‘గౌరవభయంతో చూడాలి’ లేదా ‘భయభక్తులతో ఉండాలి’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘సబ్బాతులు’ బహువచనంలో ఉంది; దీనిని ‘నా విశ్రాంతిదినాలను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: మీలో ప్రతి ఒక్కరూ
  rationale: ఇక్కడ ఏకవచన పుంలింగ నామవాచకం సమాజంలోని ఒక్కొక్కరినీ ఉద్దేశిస్తూ విభాజకార్థంలో వాడబడింది. తెలుగు సహజ ప్రయోగంలో ‘ప్రతి ఒక్కరూ’ ఆ సమూహవ్యాప్త ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పుంలింగ రూపాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: אִמּוֹ וְאָבִיו
  choice: తన తల్లికి, తన తండ్రికి
  rationale: మూలంలో తల్లి ముందుగా, తండ్రి తరువాత ప్రత్యేకంగా పేర్కొనబడ్డారు. ఆ క్రమాన్నీ, రెండు బంధుత్వ పదాలనూ అలాగే నిలిపాం.
- source_word: תִּירָאוּ
  choice: భయపడాలి
  rationale: ירא అనే క్రియ భయం, గౌరవంతో కూడిన భయం, భయభక్తి అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో నేరుగా ఉన్న బలమైన పదాన్ని ఉంచి, సందర్భానుగుణ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: שַׁבְּתֹתַי
  choice: నా విశ్రాంతిదినాలను
  rationale: హీబ్రూలోని బహువచనాన్నీ దైవసంబంధ సర్వనామాన్నీ నిలిపి, సాధారణ తెలుగు పాఠకుడికి అర్థమయ్యే రీతిలో అనువదించాం.
- source_word: תִּשְׁמֹרוּ
  choice: పాటించాలి
  rationale: שׁמר అంటే కాపాడడం, జాగ్రత్తగా గమనించడం, ఆచరించడం అనే అర్థాలు ఉన్నాయి. విశ్రాంతిదినాల సందర్భంలో ‘పాటించాలి’ సహజమైన తెలుగు మరియు విధేయతతో ఆచరించాలనే భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: యాహ్వేను సూచించే ఒడంబడిక సూత్రవాక్యంలో ఈ రూపం ఏకవచన భావంలో ఉంది; అందువల్ల ‘మీ దేవుడు’ అని అనువదించాం.
theological_decisions:
- issue: తల్లిదండ్రుల పట్ల ఆజ్ఞలోని భావోద్వేగ బలం
  choice: భయపడాలి
  alternative: భయభక్తులతో ఉండాలి / గౌరవించాలి
  rationale: మూలక్రియ నిజమైన భయం మరియు గౌరవభరిత విస్మయం మధ్య భావపరిధిని కలిగి ఉంది. ప్రధాన పాఠంలో బలమైన ప్రత్యక్ష సమానార్థకాన్ని ఉంచి, అది కేవలం భీతిని మాత్రమే సూచిస్తుందని తేల్చకుండా పాదటిప్పణిలో ప్రత్యామ్నాయ భావాన్ని తెలిపాం.
- issue: ప్రారంభంలోని విభాజక ఏకవచనానికి లింగ ప్రతినిధిత్వం
  choice: మీలో ప్రతి ఒక్కరూ
  alternative: ప్రతి పురుషుడూ
  rationale: אִישׁ రూపపరంగా పుంలింగ ఏకవచనమైనా, తరువాతి క్రియలు బహువచనంలో ఉండి మొత్తం సమాజంలోని ఒక్కొక్కరిని ఉద్దేశిస్తాయి. ఆధునిక తెలుగులో సహజమైన సమూహవ్యాప్త అర్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో సాధారణ బిరుదు కాక వ్యక్తిగత దైవనామం יְהוָה ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపాన్ని వాడాం. ఏకవచన ‘తన’తో ప్రారంభమైన విభాజక నిర్మాణం తరువాత ‘మీరు’ అనే బహువచన సమాజసంబోధనకు మారడాన్ని మూలపాఠం ప్రకారమే నిలిపాం. తల్లి-తండ్రి క్రమాన్ని మార్చలేదు.
