revisions:
- from: నీ ద్రాక్షతోటలో మిగిలినవాటిని మళ్లీ కోయకూడదు[a]; నీ ద్రాక్షతోటలో రాలిన ద్రాక్షపండ్లను ఏరుకోకూడదు. వాటిని పేదవాడి కోసం, మీ మధ్య నివసించే పరదేశి కోసం విడిచిపెట్టాలి[b]. నేను మీ దేవుడైన యాహ్వేను.
  to: నీ ద్రాక్షతోటలో మిగిలిన ద్రాక్షను మళ్లీ కోయకూడదు[a]; నీ ద్రాక్షతోటలో రాలిన ద్రాక్షపండ్లను ఏరుకోకూడదు[b]. వాటిని పేదవారికీ, మీ మధ్య నివసిస్తున్న పరదేశికీ విడిచిపెట్టాలి[c]. నేను మీ దేవుడైన యాహ్వేను.
  rationale: పాఠ్యార్థాన్ని మార్చకుండా పేదవారి వర్గార్థాన్ని సహజ తెలుగు బహువచనంతో తెలిపాం. ఆంగ్ల ఆడిట్‌లో ఉన్న פֶּרֶטకు సంబంధించిన లెక్సికల్ గమనికను కొత్త [b] ఆంకర్‌తో చేర్చాం; గֵּר వివరణను [c]గా ఉంచాం. ఈ ఆంకర్లు సంబంధిత పదాల వెంటనే ఉన్నాయి.
