id: LEV.19.10
reference: Leviticus 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כַרְמְ/ךָ֙ לֹ֣א תְעוֹלֵ֔ל וּ/פֶ֥רֶט כַּרְמְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: te
  text: నీ ద్రాక్షతోటలో మిగిలిన ద్రాక్షను మళ్లీ కోయకూడదు[a]; నీ ద్రాక్షతోటలో రాలిన ద్రాక్షపండ్లను ఏరుకోకూడదు[b]. వాటిని పేదవారికీ, మీ మధ్య నివసిస్తున్న పరదేశికీ విడిచిపెట్టాలి[c]. నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీ ద్రాక్షతోటను పూర్తిగా కోయకూడదు.” హీబ్రూ క్రియ ప్రధాన కోత తర్వాత తీగలను మళ్లీ పరిశీలించి మిగిలిన ద్రాక్షను తీసుకోవడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నీ ద్రాక్షతోటలో మిగిలిన ద్రాక్షను.” హీబ్రూ పదం కోత సమయంలో మిగిలిపోయిన లేదా రాలిన ద్రాక్షను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: “నివాస విదేశీయుడు.” “పరదేశి” అంటే ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతర వ్యక్తి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: నీ ద్రాక్షతోట
  rationale: כֶּרֶם అంటే ద్రాక్షతోట; ఆధునిక తెలుగులో ఇది సహజమైన, నిర్దిష్టమైన వ్యవసాయ పదం.
- source_word: תְעוֹלֵל
  choice: మిగిలినవాటిని మళ్లీ కోయకూడదు
  rationale: ప్రధాన కోత తర్వాత తీగలను మరోసారి పరిశీలించి మిగిలిన ద్రాక్షను కోయడాన్ని ఈ సందర్భంలోని క్రియ సూచిస్తుంది; తెలుగులో చర్యను స్పష్టంగా చెప్పడం సాంకేతిక పదం కంటే సహజం.
- source_word: פֶּרֶט
  choice: రాలిన ద్రాక్షపండ్లు
  rationale: కోత సమయంలో విడిపోయి రాలిన లేదా చెల్లాచెదురైన ద్రాక్షను సూచించే సందర్భోచిత అర్థం.
- source_word: תְלַקֵּט
  choice: ఏరుకోకూడదు
  rationale: לקט అంటే విడివిడిగా ఉన్నవాటిని ఏరడం; నేలపై రాలిన పండ్ల సందర్భంలో ‘ఏరుకోవడం’ సహజమైన తెలుగు.
- source_word: לֶעָנִי
  choice: పేదవాడి కోసం
  rationale: עָנִי ఇక్కడ ఆర్థికంగా పేద లేదా అవసరంలో ఉన్న వ్యక్తిని సూచిస్తుంది; ఏకవచన మూలరూపాన్ని నిలుపుతుంది.
- source_word: וְלַגֵּר
  choice: మీ మధ్య నివసించే పరదేశి కోసం
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది; ‘పరదేశి’తో పాటు వివరణాత్మక పదబంధం దాని నివాస సంబంధాన్ని తెలియజేస్తుంది.
- source_word: תַּעֲזֹב אֹתָם
  choice: వాటిని ... విడిచిపెట్టాలి
  rationale: ఇతరులు తీసుకునేలా పంటలో మిగిల్చివేయాలనే న్యాయపరమైన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: బహువచన సంబోధనతో కూడిన నిబంధనాత్మక సూత్రాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: גֵּר యొక్క సామాజిక స్థితి
  choice: మీ మధ్య నివసించే పరదేశి
  alternative: విదేశీయుడు; వలసవాసి
  rationale: ఈ పదం కేవలం బయటి దేశస్థుణ్ణి కాక, ఇశ్రాయేలు మధ్య స్థిరంగా నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది; అనువాదం ఆ న్యాయ-సామాజిక సూక్ష్మతను ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయశైలిని వాడాం. హీబ్రూలోని ఏకవచన ఆజ్ఞ ‘నీ’గా, చివరి నిబంధనాత్మక ప్రకటనలోని సమూహ బహువచనం ‘మీ’గా నిలుపబడింది. పంటను పూర్తిగా ఏరివేయకూడదనే భావం స్పష్టమయ్యేలా תְעוֹלֵלను వివరణాత్మకంగా అనువదించాం.
