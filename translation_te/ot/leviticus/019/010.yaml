    rationale: హీబ్రూ ఏకవచనం వర్గాన్ని సూచిస్తుంది; తెలుగులో «పేదవారికీ» ఆ వర్గార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది; అర్థంలో మార్పు లేదు.
  revised_text: నీ ద్రాక్షతోటలో మిగిలిన ద్రాక్షను మళ్లీ కోయకూడదు[a]; నీ ద్రాక్షతోటలో రాలిన ద్రాక్షపండ్లను ఏరుకోకూడదు[b]. వాటిని పేదవారికీ, మీ మధ్య నివసిస్తున్న పరదేశికీ విడిచిపెట్టాలి[c]. నేను మీ దేవుడైన యాహ్వేను.
