id: LEV.19.20
reference: Leviticus 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: te
  text: ఒక పురుషుడు ఒక స్త్రీతో వీర్యస్ఖలనంతో కూడిన లైంగిక సంబంధం కలిగి ఉంటే, ఆమె ఒక పురుషునికి నియమించబడిన[a] బానిస స్త్రీ అయి, ఇంకా విమోచించబడకపోయినా లేదా ఆమెకు స్వేచ్ఛ ఇవ్వబడకపోయినా, విచారణ జరగాలి[b]. ఆమెకు ఇంకా స్వేచ్ఛ ఇవ్వబడలేదు కాబట్టి వారిద్దరికీ మరణశిక్ష విధించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక పురుషునితో నిశ్చితార్థం చేయబడిన’ లేదా ‘ఒక పురుషునికి వాగ్దానం చేయబడిన.’ బానిస స్త్రీ ఒక పురుషునికి కేటాయించబడిందని లేదా వాగ్దానం చేయబడిందని హీబ్రూ పదం బహుశా సూచిస్తుంది; అయితే ఆమె న్యాయస్థితి పూర్తిగా స్వతంత్రురాలైన భార్య స్థితితో సమానం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘విచారణ’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం. దానికి ‘శిక్ష’ లేదా ‘పరిహారం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: న్యాయవిధి సందర్భంలో లింగాన్ని స్పష్టంగా తెలిపే ఏకవచన పురుషుడే సూటి అర్థం.
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: ఒక స్త్రీతో వీర్యస్ఖలనంతో కూడిన లైంగిక సంబంధం పెట్టుకుంటే
  rationale: హీబ్రూ నుడికారం లైంగిక క్రియతో పాటు వీర్యస్ఖలనాన్ని కూడా స్పష్టంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంటూనే ఆ న్యాయపరమైన నిర్దిష్టతను నిలుపుతుంది.
- source_word: שִׁפְחָה
  choice: బానిస స్త్రీ
  rationale: ఈ నియమంలో ఆమె బానిస స్థితి కీలకం; ‘సేవకురాలు’ కంటే ‘బానిస స్త్రీ’ మూలంలోని బంధిత స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: ఒక పురుషునికి నియమించబడిన
  rationale: అరుదైన ఈ రూపం ఆమె ఒక పురుషునికి కేటాయించబడిన లేదా వాగ్దానం చేయబడిన సంబంధాన్ని సూచిస్తుంది; పూర్తి న్యాయబద్ధ నిశ్చితార్థమని అతిగా నిర్ధారించకుండా ఉంటుంది.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: ఇంకా విమోచించబడకపోయినా
  rationale: విమోచన క్రయధనంతో బానిసత్వం నుంచి విడుదల కాలేదనే న్యాయ-ఆర్థిక భావాన్ని వ్యక్తం చేస్తుంది; హీబ్రూలోని బలమైన నిరాకరణను ‘ఇంకా’ సహజంగా తెలియజేస్తుంది.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: ఆమెకు స్వేచ్ఛ ఇవ్వబడకపోయినా
  rationale: బానిస స్థితి నుంచి అధికారికంగా విడుదల చేయబడలేదనే భావాన్ని సూటిగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בִּקֹּרֶת
  choice: విచారణ
  rationale: ఈ అరుదైన పదం అర్థం వివాదాస్పదం. ‘విచారణ’ అధికారిక పరిశీలన భావాన్ని ఇస్తుంది; నిర్దిష్ట శిక్షను మూలంలో లేనంతగా చేర్చదు.
- source_word: לֹא יוּמְתוּ
  choice: వారిద్దరికీ మరణశిక్ష విధించకూడదు
  rationale: హీబ్రూ బహువచన న్యాయపరమైన మరణదండనను సూచిస్తుంది; ‘వారిద్దరికీ’ అనేది దాని పరిధిని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: ఆమెకు ఇంకా స్వేచ్ఛ ఇవ్వబడలేదు కాబట్టి
  rationale: మరణశిక్ష విధించకపోవడానికి కారణం ఆమె ఇంకా స్వతంత్రురాలు కాకపోవడమేనని ముందరి వాక్యభాగంతో స్పష్టంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ అనే పదబంధంలో స్త్రీ న్యాయస్థితి
  choice: ఒక పురుషునికి నియమించబడిన
  alternative: ఒక పురుషునితో నిశ్చితార్థం చేయబడిన; ఒక పురుషునికి వాగ్దానం చేయబడిన
  rationale: ఆమెకు ఒక పురుషునితో ఉన్న బంధాన్ని నిలుపుతూ, స్వతంత్ర స్త్రీకి ఉండే పూర్తి న్యాయబద్ధ నిశ్చితార్థ స్థితిని పాఠ్యంలోకి బలవంతంగా చేర్చకుండా ఈ అనువాదం ఉంటుంది.
- issue: בִּקֹּרֶת యొక్క అర్థం
  choice: విచారణ జరగాలి
  alternative: శిక్ష విధించాలి; పరిహారం చెల్లించాలి
  rationale: పదం అరుదైనదీ అర్థం అనిశ్చితమైనదీ కావడంతో, ఒక నిర్దిష్ట శిక్షావిధానాన్ని నిర్ణయించకుండా ప్రధాన పాఠ్యంలో సాధారణ అధికారిక విచారణ భావాన్ని ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలి పాటించబడింది. ‘బానిస స్త్రీ’ మూలంలోని సామాజిక-న్యాయ స్థితిని మృదువుపరచకుండా తెలియజేస్తుంది. లైంగిక చర్యను అసభ్యంగా కాకుండా, మూలంలోని వీర్యస్ఖలన నిర్దిష్టతను నిలుపుతూ స్పష్టంగా చెప్పబడింది. అరుదైన పదాల నిజమైన అనిశ్చితి పాదసూచికల్లో భద్రపరచబడింది.
