  revised_text: ఒక పురుషుడు ఒక స్త్రీతో వీర్యస్ఖలనంతో కూడిన లైంగిక సంబంధం కలిగి ఉంటే, ఆమె ఒక పురుషునికి నియమించబడిన[a] బానిస స్త్రీ అయి, ఇంకా విమోచించబడకపోయినా లేదా ఆమెకు స్వేచ్ఛ ఇవ్వబడకపోయినా, విచారణ జరగాలి[b]. ఆమెకు ఇంకా స్వేచ్ఛ ఇవ్వబడలేదు కాబట్టి వారిద్దరికీ మరణశిక్ష విధించకూడదు.
