  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן בְּ/אֵ֤יל הָֽ/אָשָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/נִסְלַ֣ח ל֔/וֹ מֵ/חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: te
  text: యాజకుడు అతడు చేసిన పాపం నిమిత్తం అపరాధబలి పొట్టేలుతో యహ్వే సన్నిధిలో అతని కోసం ప్రాయశ్చిత్తం చేస్తాడు; అప్పుడు అతడు చేసిన పాపం అతనికి క్షమించబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో כפר ఒకరి తరఫున యాజకుడు చేసే బలిసంబంధమైన ప్రాయశ్చిత్త కార్యాన్ని సూచిస్తుంది. తెలుగు బైబిలు పరిభాషలో ‘ప్రాయశ్చిత్తం చేయాలి’ స్పష్టమైనదీ స్థిరమైనదీ.
- source_word: עָלָיו
  choice: అతని కోసం
  rationale: כפר తో వచ్చిన על ఇక్కడ ప్రాయశ్చిత్తం ఎవరికి ప్రయోజనకరంగా చేయబడుతుందో సూచిస్తుంది; ‘అతని కోసం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్ట ఉపాసనాధికారిని సూచించే సాధారణ, గౌరవప్రదమైన తెలుగు పదం.
- source_word: בְּאֵיל הָאָשָׁם
  choice: అపరాధ బలి పొట్టేలుతో
  rationale: איל ప్రత్యేకంగా మగ గొర్రెను, అంటే పొట్టేలును సూచిస్తుంది. אָשָׁם అపరాధాన్ని మరియు దానికి సంబంధించిన పరిహార స్వభావాన్ని రెండింటినీ సూచించగలదు; ప్రధాన పాఠంలో సుపరిచితమైన ‘అపరాధ బలి’ని ఉంచి ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: లేవీయకాండంలోని ఆరాధనా సందర్భానికి తగిన స్థల/సాన్నిధ్య భావాన్ని సహజ తెలుగులో నిలుపుతుంది; దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తుంది.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపం నిమిత్తం
  rationale: హీబ్రూలోని ఒకే మూలపద పునరుక్తిని తెలుగులో సహజంగా మలుస్తూ, ప్రాయశ్చిత్తం ఏ పాపానికి సంబంధించినదో స్పష్టంగా తెలుపుతుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమించబడుతుంది
  rationale: నిఫాల్ కర్మణి రూపాన్ని నిలుపుతూ, క్షమించే దైవిక కర్తను హీబ్రూ పాఠంలాగే ప్రత్యక్షంగా పేర్కొనదు.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపం
  rationale: מן తో కూడిన క్షమాపణ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పాపం గురించిన మూలపాఠపు పునరుక్తిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- issue: క్షమాపణకు కర్త ఎవరు
  choice: కర్తను ప్రత్యక్షంగా పేర్కొనని కర్మణి నిర్మాణం
  alternative: యహ్వే అతన్ని క్షమిస్తాడు
  rationale: హీబ్రూ וְנִסְלַח לוֹ క్షమించే కర్తను వ్యాకరణపరంగా ప్రకటించదు. దైవిక కర్త సందర్భంలో సూచితమైనా, అనువాదంలో దానిని స్పష్టంగా చేర్చకుండా మూలంలోని సంయమనాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. మూలంలోని ‘అతడు చేసిన పాపం’ అనే పునరుక్తిని భావపరమైన ఉద్దేశంతో నిలిపాం; వాక్య ప్రవాహం కోసం రెండవ భాగానికి ‘అప్పుడు’ చేర్చాం.
