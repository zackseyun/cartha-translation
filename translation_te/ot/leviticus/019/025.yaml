id: LEV.19.25
reference: Leviticus 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: te
  text: ఐదవ సంవత్సరంలో మీరు దాని పండ్లను తినవచ్చు, దాని దిగుబడి మీకు పెరగడానికి. నేనే మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: ఐదవ సంవత్సరంలో
  rationale: ముందటి సంవత్సరాల నిషేధం తరువాత వచ్చే న్యాయబోధన క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; హీబ్రూ וּ ఇక్కడ తప్పనిసరిగా ప్రత్యేక సంధిపదంతో అనువదించాల్సిన అవసరం లేదు.
- source_word: תֹּאכְלוּ
  choice: మీరు ... తినవచ్చు
  rationale: ముందటి నిషేధం ముగిసిన తరువాత అనుమతిని తెలిపే ఈ న్యాయసందర్భంలో, ‘తినవచ్చు’ అనే రూపం క్రియ యొక్క భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת־פִּרְיוֹ
  choice: దాని పండ్లు
  rationale: פְּרִי ఇక్కడ చెట్టు ఇచ్చే ఫలాన్ని సూచిస్తుంది. తెలుగు వాడుకలో సమూహార్థకంగా ‘పండ్లు’ సహజంగా ఉంటుంది; సర్వనామం సందర్భంలోని చెట్టును సూచిస్తుంది.
- source_word: לְהוֹסִיף
  choice: అప్పుడు ... పెంచుతుంది
  rationale: לְ తో కూడిన infinitive construct ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగు వాక్యంలో ‘అప్పుడు’ ద్వారా ఈ సంబంధాన్ని సహజంగా ఉంచుతూ, ఉద్దేశం-ఫలితం మధ్య ఉన్న స్వల్ప అనిశ్చితిని అతిగా నిర్ణయించలేదు.
- source_word: תְּבוּאָתוֹ
  choice: తన దిగుబడిని
  rationale: תְּבוּאָה ఉత్పత్తి లేదా దిగుబడిని సూచిస్తుంది. వ్యవసాయ సందర్భంలో ‘దిగుబడి’ స్పష్టంగా, సహజంగా ఉంటుంది; ప్రత్యయాన్ని ‘తన’గా వ్యక్తం చేయడం అదే చెట్టును తిరిగి సూచిస్తుంది.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: నేను మీ దేవుడైన యెహోవాను
  rationale: లేవీయకాండంలోని గంభీరమైన నిబంధనాత్మక స్వపరిచయ సూత్రాన్ని నిలుపుతూ, יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత దైవనామంగా ఉంచింది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: לְהוֹסִיף లోని ఉద్దేశం లేదా ఫలిత సంబంధం
  choice: అప్పుడు అది ... పెంచుతుంది
  alternative: అది ... పెంచేలా; మీకు ... పెంచడానికి
  rationale: హీబ్రూ నిర్మాణం ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచించగలదు. దేవుని వాగ్దానం, వ్యవసాయ నియమం, లేదా మానవ చర్యకు యాంత్రిక కారణత్వం అనే ఏ ఒక్క వ్యాఖ్యానాన్నీ అతిగా స్థిరపరచకుండా సంబంధాన్ని సహజంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయినా న్యాయబోధనకు తగిన గంభీరతతో రూపొందించబడింది. అనుమతి భావాన్ని ‘తినవచ్చు’తో, వ్యవసాయ పదాన్ని ‘దిగుబడి’తో వ్యక్తం చేసింది.
