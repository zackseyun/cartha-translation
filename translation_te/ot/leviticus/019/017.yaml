review_pass:
  verdict: revise
  source_fidelity: The first two clauses faithfully represent the prohibitions and the emphatic infinitive-absolute construction. The final Hebrew clause is itself a direct negative command (“and you shall not bear/incur sin on account of him”), rather than explicitly phrased as a future consequence. The draft’s “లేకపోతే ... మోయవలసి వస్తుంది” turns this into an inferred conditional consequence and should be adjusted.
  naturalness: The Telugu is clear and appropriately formal. “మందలించాలి” is a more natural and less unnecessarily harsh rendering of הוֹכֵחַ than “గద్దించాలి,” while retaining the sense of direct moral reproof. A direct negative command in the final clause is also smoother and closer to the source.
  terminology: “హృదయం,” “సోదరుడు,” and “పొరుగువాడు” suitably retain the source’s relational and inward-language imagery. “పాపభారం” communicates culpability, but “పాపాన్ని మోసుకోకూడదు” more directly reflects נשא חטא and allows the footnote to preserve the idiom’s interpretive range.
  issues:
  - severity: medium
    issue: The final clause is rendered as an explicit ‘otherwise’ consequence.
    rationale: 'Hebrew has וְלֹא תִשָּׂא, a direct prohibition: “and you shall not bear/incur sin on account of him.” Although culpability through failure to reprove is a plausible contextual implication, “లేకపోతే ... మోయవలసి వస్తుంది” makes that implication part of the main text and changes the command’s form.'
  - severity: low
    issue: “గద్దించాలి” can suggest harsh scolding.
    rationale: The Hebrew calls for earnest reproof/correction. “తప్పక మందలించాలి” is idiomatic modern Telugu and better preserves the term’s range without weakening the required confrontation.
  revised_text: నీ హృదయంలో నీ సోదరుణ్ణి ద్వేషించకూడదు. నీ పొరుగువాణ్ణి తప్పక మందలించాలి; అతని కారణంగా పాపాన్ని మోసుకోకూడదు.[a]
