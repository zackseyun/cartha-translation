- from: నీ హృదయంలో నీ సోదరుణ్ణి ద్వేషించకూడదు. నీ పొరుగువాణ్ణి తప్పక గద్దించాలి; లేకపోతే అతని కారణంగా పాపభారం మోయవలసి వస్తుంది.[a]
  to: నీ హృదయంలో నీ సోదరుణ్ణి ద్వేషించకూడదు. నీ పొరుగువాణ్ణి తప్పక మందలించాలి; అతని కారణంగా పాపాన్ని మోసుకోకూడదు.[a]
