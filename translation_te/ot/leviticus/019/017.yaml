  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: te
  text: నీ హృదయంలో నీ సోదరుణ్ణి ద్వేషించకూడదు. నీ పొరుగువాణ్ణి తప్పక మందలించాలి; అతని కారణంగా పాపాన్ని మోసుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని నిమిత్తం అపరాధిగా కాకూడదు,’ లేదా ‘అతని పాపంలో పాలుపంచుకోకూడదు.’ హీబ్రూ నుడికారం పలు విధాలుగా అర్థం కావచ్చు; తప్పును ఎదుర్కొని మందలించకపోవడం వల్ల అపరాధ బాధ్యత కలగడాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: ద్వేషించు
  rationale: שׂנא అనే క్రియ ద్వేషాన్ని నేరుగా సూచిస్తుంది; నిషేధంలోని నైతిక తీవ్రతను ఈ పదం నిలుపుతుంది.
- source_word: אָחִיךָ
  choice: నీ సోదరుడు
  rationale: אָח సొంత సోదరుణ్ణి లేదా నిబంధన సమాజంలోని సహోదరుణ్ణి సూచించవచ్చు. ‘సోదరుడు’ మూలంలోని కుటుంబ, సమాజ అనుబంధాలను నిలుపుతుంది.
- source_word: בִּלְבָבֶךָ
  choice: నీ హృదయంలో
  rationale: לֵבָב ఆలోచన, ఉద్దేశం సహా అంతరంగాన్ని సూచిస్తుంది. ‘హృదయంలో’ మూలానికి సన్నిహితంగాను తెలుగులో సహజంగాను ఉంది.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: తప్పక గద్దించాలి
  rationale: క్రియారూపానికి ముందు అదే ధాతువు యొక్క infinitive absolute రావడం ఆజ్ఞను బలపరుస్తుంది. ‘తప్పక’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది; ‘గద్దించాలి’ తప్పును స్పష్టంగా ఎదుర్కొని మందలించే భావాన్ని ఇస్తుంది.
- source_word: עֲמִיתֶךָ
  choice: నీ పొరుగువాడు
  rationale: עָמִית ఒకరి సమాజంలోని తోటి సభ్యుణ్ణి సూచిస్తుంది. లేవీయకాండము 19 నైతిక సందర్భంలో ‘పొరుగువాడు’ సహజమైన, సుపరిచితమైన సమానార్థకం.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: అతని కారణంగా పాపభారం మోయవలసి వస్తుంది
  rationale: נשא חטא అనేది పాపాన్ని లేదా అపరాధ బాధ్యతను మోయడాన్ని సూచించే నుడికారం. עליו తో కలిసి, అతని తప్పును గద్దించకపోవడం వల్ల తానే బాధ్యుడవుతాడనే సాధ్యమైన భావాన్ని ఈ అనువాదం తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన సమాజ నైతికతలో బంధుత్వ పదాల పరిధి
  choice: ‘నీ సోదరుడు,’ ‘నీ పొరుగువాడు’ అనే పుంలింగ ఏకవచన సంబంధ పదాలను నిలుపడం
  alternative: ‘నీ తోటి వ్యక్తి’ లేదా ‘తోటి ఇశ్రాయేలీయుడు’
  rationale: హీబ్రూలో వ్యాకరణపరంగా పుంలింగ ఏకవచన రూపాలు ఉన్నప్పటికీ అవి సమాజ సభ్యుణ్ణి ప్రతినిధిగా సూచించగలవు. మూలపదాల కుటుంబ, నిబంధన ప్రతిధ్వనిని సమతలీకరించకుండా నిలుపుతున్నాం.
- issue: וְלֹא תִשָּׂא עָלָיו חֵטְא లో బాధ్యత యొక్క స్వరూపం
  choice: తప్పును గద్దించకపోవడం వల్ల అతని కారణంగా పాపభారం మోయడం
  alternative: అతని మీద పాపాన్ని మోపకపోవడం; అతని పాపంలో పాలుపంచుకోకపోవడం
  rationale: ఈ హీబ్రూ నుడికారం అపరాధాన్ని భరించడం లేదా దోషిగా కావడం అనే భావాన్ని కలిగి ఉంది. ముందున్న గద్దింపు ఆజ్ఞతో సంబంధం వల్ల, గద్దించడంలో విఫలమైతే బాధ్యత కలుగుతుందనే పఠనం సందర్భోచితం; అయినా నుడికారపు నిజమైన అర్థవిస్తృతిని పాదసూచికలో భద్రపరుస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ఆజ్ఞల తీవ్రత కోసం ‘కూడదు,’ ‘తప్పక ... చేయాలి’ వాడబడ్డాయి. ‘సోదరుడు,’ ‘పొరుగువాడు,’ ‘హృదయం,’ ‘పాపభారం’ మూలంలోని సంబంధాత్మక, అంతరంగ, నైతిక చిత్రణలను నిలుపుతాయి.
