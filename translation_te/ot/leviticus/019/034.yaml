revisions:
- from: మీ మధ్య నివసించే పరదేశి[a] మీకు మీలో పుట్టినవానిలా ఉండాలి. అతన్ని నిన్నువలె ప్రేమించాలి; ఎందుకంటే మీరు ఐగుప్తు దేశంలో పరదేశులుగా ఉన్నారు. నేను మీ దేవుడైన యాహ్వేను.
