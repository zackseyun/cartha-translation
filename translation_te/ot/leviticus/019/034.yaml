  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: te
  text: మీ మధ్య నివసించే పరదేశి[a] మీకు మీలో పుట్టినవానిలా ఉండాలి. నీవు అతనిని నిన్నువలె ప్రేమించాలి; ఎందుకంటే మీరు ఐగుప్తు దేశంలో పరదేశులుగా ఉన్నారు. నేను యాహ్వేను, మీ దేవుడను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అని అనువదించిన హీబ్రూ పదం ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. దీనిని ‘వలసవాసి,’ ‘నివాస పరదేశి,’ లేదా ‘అన్యుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח
  choice: మీలో పుట్టినవానిలా
  rationale: אֶזְרָח సమాజంలోని స్థానికంగా పుట్టిన వ్యక్తిని సూచిస్తుంది. ‘మీలో పుట్టినవానిలా’ అనే రూపం כְּ సూచించే పోలికను నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הַגֵּר / גֵרִים
  choice: పరదేశి / పరదేశులు
  rationale: גֵּר ఇక్కడ కేవలం ప్రయాణికుణ్ణి కాకుండా ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. ‘పరదేశి’ విస్తృతంగా అర్థమయ్యే పదం; అదే పదాన్ని తరువాతి వాక్యంలోనూ వాడటం మూలంలోని పదసంబంధాన్ని కాపాడుతుంది.
- source_word: הַגָּר אִתְּכֶם
  choice: మీ మధ్య నివసించే
  rationale: గేర్ అనే నామవాచకానికి సంబంధించిన גָּר అనే క్రియారూపం స్థిరంగా నివసించడాన్ని తెలియజేస్తుంది. తెలుగులో సహజత్వం కోసం పదబంధాన్ని ‘మీ మధ్య నివసించే’ అని ఇచ్చాం.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: ఆ పరదేశిని సమాజం ఏ విధంగా పరిగణించాలో తెలిపే నియమబద్ధ భావాన్ని ‘ఉండాలి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָהַבְתָּ לוֹ
  choice: అతన్ని ... ప్రేమించాలి
  rationale: ఈ క్రియ ఆజ్ఞాత్మక నిబంధనా భావాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘ప్రేమించాలి’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּמוֹךָ
  choice: నిన్నువలె
  rationale: సంక్షిప్తమైన పోలికను అలాగే ఉంచి, లేవీయకాండము 19:18తో ఉన్న పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: ‘దేశం’ అనే మూలపదాన్ని నిలుపుతూ సుపరిచితమైన బైబిలు భౌగోళిక నామరూపాన్ని ఉపయోగిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: దైవనామంతో కూడిన నిబంధనా సూత్రవాక్యాన్ని తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయ-నైతిక సందర్భంలో גֵּר పదానికి అనువాదం
  choice: పరదేశి
  alternative: వలసవాసి; నివాస పరదేశి; అన్యుడు
  rationale: ఈ పదం ఇశ్రాయేలు మధ్య నివసిస్తూ సామాజిక రక్షణ పొందవలసిన స్థానికేతరుణ్ణి సూచిస్తుంది. ‘పరదేశి’ ఆధునిక వలస చట్టాల ప్రత్యేక వర్గాలను మూలంలోకి దిగుమతి చేయకుండా భావాన్ని అందిస్తుంది; మరింత వివరణను పాదసూచికలో ఇచ్చాం.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నిబంధనా నామాన్ని నిలుపుతుంది.
- issue: ఏకవచన ఆజ్ఞ మరియు బహువచన సమాజ సంబోధన మధ్య మార్పు
  choice: ‘మీ’ అనే బహువచన సమాజ సంబోధనతో పాటు ‘నిన్నువలె’ అనే ఏకవచన పోలికను నిలుపడం
  alternative: 'అంతటినీ బహువచనంగా సమన్వయించడం: ‘మిమ్మల్ని మీరువలె’'
  rationale: హీబ్రూ వాక్యంలో సమాజానికి బహువచన సంబోధన ఉన్నప్పటికీ ప్రేమించాలనే ఆజ్ఞ, ‘నీవలె’ అనే పోలిక ఏకవచనంలో ఉన్నాయి. ఈ మార్పును నిశ్శబ్దంగా సమతలపరచకుండా తెలుగులో సాధ్యమైనంతవరకు నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవభరితమైన శైలిని ఉపయోగించాం. ‘ఉండాలి,’ ‘ప్రేమించాలి’ అనే రూపాలు ధర్మశాస్త్ర ఆజ్ఞ యొక్క బలాన్ని సహజంగా తెలియజేస్తాయి. ‘నిన్నువలె’ మూలంలోని సంక్షిప్తతను, 19:18తో ఉన్న అంతర్పాఠ్య సంబంధాన్ని నిలుపుతుంది.
