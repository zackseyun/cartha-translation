id: LEV.19.14
reference: Leviticus 19:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: te
  text: చెవిటివానిని శపించవద్దు[a]; గుడ్డివాని ముందు తడబడే అడ్డంకిని పెట్టవద్దు. నీ దేవునికి భయపడు. నేను యహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెవిటివారు,’ ‘గుడ్డివారు.’ హీబ్రూలో పుంలింగ ఏకవచన రూపాలు ధర్మశాస్త్రంలోని ప్రతినిధి ఉదాహరణలుగా వాడబడ్డాయి.
    reason: మూలంలోని పుంలింగ ఏకవచన రూపాలను, వాటి సాధారణ న్యాయపరమైన వినియోగాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: תְקַלֵּל
  choice: శపించకూడదు
  rationale: పీయేల్ రూపంలోని קלל ఇక్కడ శపించడం లేదా అవమానకరంగా దూషించడం అనే బలమైన వాచిక అర్థాన్ని ఇస్తుంది; ‘శపించు’ దాని ప్రత్యక్ష బలాన్ని నిలుపుతుంది.
- source_word: חֵרֵשׁ
  choice: చెవిటివాణ్ణి
  rationale: హీబ్రూలో పుంలింగ ఏకవచన రూపం ఉంది; తెలుగు న్యాయవాక్య శైలిలో ఇది ఒక ప్రతినిధి ఉదాహరణగా సహజంగా ఉంటుంది.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: స్థానార్థాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: עִוֵּר
  choice: గుడ్డివాని
  rationale: మూలంలోని పుంలింగ ఏకవచన ప్రతినిధి ఉదాహరణను నిలుపుతూ ఆధునిక సాధారణ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: תִתֵּן
  choice: పెట్టకూడదు
  rationale: נתן అక్షరార్థంగా ‘ఇవ్వు’ అయినా, అడ్డంకితో తెలుగు ప్రయోగంలో ‘పెట్టు’ సహజమైన సమానార్థకం.
- source_word: מִכְשֹׁל
  choice: తడికెను
  rationale: కాలికి తగిలి తడబడేలా చేసే వస్తువు అనే ప్రత్యక్ష దృశ్యాన్ని తెలుగులో సంక్షిప్తంగా నిలుపుతుంది; విస్తృత నైతిక అన్వయాన్ని ముందుగానే నిర్ధారించదు.
- source_word: וְיָרֵאתָ
  choice: నీ దేవునికి భయపడాలి
  rationale: వావ్‌తో వచ్చిన ఆజ్ఞను తెలుగు ప్రవాహంలో స్వతంత్ర ప్రేరణ వాక్యంగా అందిస్తుంది; మానవులకు కనిపించకపోయినా దేవుని ఎదుట జవాబుదారీతనాన్ని సూచిస్తుంది.
- source_word: מֵאֱלֹהֶיךָ
  choice: నీ దేవునికి
  rationale: ירא తో מן భయానికి గురియైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘దేవునికి భయపడు’ సహజ ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: న్యాయవాక్యంలో ప్రతినిధి పుంలింగ ఏకవచనాలు
  choice: ‘చెవిటివాడు,’ ‘గుడ్డివాడు’ అనే పుంలింగ ఏకవచన ఉదాహరణలను నిలుపడం
  alternative: ‘చెవిటివారు,’ ‘చూపులేనివారు’ వంటి లింగతటస్థ లేదా సమూహ రూపాలు
  rationale: హీబ్రూ రూపాలను ఖచ్చితంగా ప్రతిబింబిస్తూ, ఇవి ధర్మశాస్త్రంలోని ప్రతినిధి సందర్భాలని పాదసూచికలో స్పష్టం చేస్తుంది.
- issue: చివరి ప్రేరణ వాక్యపు సంబంధం
  choice: దేవునికి భయపడాలనే స్వతంత్ర ఆజ్ఞగా, ముందటి నిషేధాలకు నైతిక ఆధారంగా ఇవ్వడం
  alternative: ‘కాని నీ దేవునికి భయపడాలి’ అని స్పష్టమైన వ్యతిరేక సంధితో అనువదించడం
  rationale: హీబ్రూ వావ్ సాధారణ సంధిగా ఉంది; సందర్భంలోని నైతిక వ్యత్యాసం గ్రహించదగినదే అయినా, ‘కాని’ అని తప్పనిసరిగా నిర్ణయించకుండా మూలంలోని సంబంధాన్ని విపులంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సూటి న్యాయవాక్య శైలి. ‘కూడదు’ నిషేధాన్ని సహజంగా వ్యక్తపరుస్తుంది. దైవనామానికి తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపం వాడబడింది.
