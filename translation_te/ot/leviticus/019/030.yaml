review_pass:
  verdict: revise
  source_fidelity: 'The Hebrew has two coordinated plural commands: keep/observe Yahweh''s Sabbaths and fear/revere his sanctuary, followed by the self-identification, “I am Yahweh.” The draft conveys the structure and divine name correctly. However, “విశ్రాంతిదినాలు” can denote ordinary days of rest and does not adequately retain the established covenantal/Sabbath designation of שַׁבְּתֹתַי.'
  naturalness: The imperative forms and concise legal register are natural modern standard Telugu. “నా సబ్బాతు దినాలను” is clear, idiomatic enough in biblical/religious Telugu, and more precise than the generic “విశ్రాంతిదినాలను.” “భయభక్తులతో గౌరవించండి” naturally conveys reverential awe without reducing ירא to either terror or mere social respect.
  terminology: Render the explicit plural Sabbaths with “సబ్బాతు దినాలను.” Retain “పరిశుద్ధస్థలం” for מִקְדָּשׁ and “యాహ్వే” for יהוה. The footnote should preserve the viable literal alternative “భయపడండి” while explaining that the contextual sense is reverential awe.
  issues:
  - severity: medium
    issue: “విశ్రాంతిదినాలను” is too generic for שַׁבְּתֹתַי.
    rationale: Although Sabbath entails rest, the Hebrew term explicitly identifies Yahweh's Sabbath observances. A generic expression for rest days can obscure this covenantal/cultic designation.
  - severity: low
    issue: “గౌరవించండి” alone may understate the awe/fear component of תִּירָאוּ.
    rationale: The context supports reverence rather than fright, but ירא carries holy awe beyond ordinary respect. “భయభక్తులతో గౌరవించండి” expresses that force naturally; the literal alternative remains footnoted.
  revised_text: మీరు నా సబ్బాతు దినాలను పాటించండి; నా పరిశుద్ధస్థలాన్ని భయభక్తులతో గౌరవించండి[a]. నేను యాహ్వేను.
