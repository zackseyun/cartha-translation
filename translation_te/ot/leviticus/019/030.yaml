lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: నా విశ్రాంతిదినాలను
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, యాహ్వే నియమించిన సబ్బాతు ఆచరణలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּשְׁמֹרוּ
  choice: పాటించండి
  rationale: שׁמר అనే పదంలోని ‘కాపాడడం/ఆచరించడం’ భావాల్లో, నియమిత విశ్రాంతిదినాల సందర్భానికి ‘పాటించండి’ సహజమైన ఆజ్ఞారూపం.
- source_word: מִקְדָּשִׁי
  choice: నా పరిశుద్ధస్థలాన్ని
  rationale: מִקְדָּשׁ సూచించే దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించబడిన పవిత్ర స్థల భావాన్ని నిలుపుతుంది; గుడారం లేదా దేవాలయం అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: תִּירָאוּ
  choice: గౌరవించండి
  rationale: ירא కు ‘భయపడడం’ మరియు ‘భక్తిపూర్వకంగా గౌరవించడం’ అనే భావాలు ఉన్నాయి. పరిశుద్ధస్థల సందర్భంలో ‘గౌరవించండి’ పవిత్రమైన ఆదరభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో సాధారణ లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేను యాహ్వేను
  rationale: ఒడంబడిక సంబంధిత దైవ స్వీయపరిచయ సూత్రాన్ని సంక్షిప్తంగా, సహజంగా, దాని ఉద్ఘాటనతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: పరిశుద్ధస్థలానికి సంబంధించి ירא పదబలం
  choice: నా పరిశుద్ధస్థలాన్ని గౌరవించండి
  alternative: నా పరిశుద్ధస్థలానికి భయపడండి
  rationale: ఈ ఆరాధనా సందర్భంలో ఆజ్ఞ దేవుని పవిత్రస్థలం పట్ల భక్తిపూర్వకమైన ఆదరాన్ని కోరుతుంది. ‘గౌరవించండి’ ఆ భావాన్ని ఆధునిక తెలుగులో సహజంగా ఇస్తుంది; ‘భయపడండి’ అనే నిజమైన పదార్థ అవకాశాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలను వాడాం. వాక్యం సంక్షిప్తమైన ధర్మశాస్త్ర శైలిని, హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
