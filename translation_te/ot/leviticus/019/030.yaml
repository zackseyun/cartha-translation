  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: te
  text: మీరు నా సబ్బాతు దినాలను పాటించండి; నా పరిశుద్ధస్థలాన్ని భయభక్తులతో గౌరవించండి[a]. నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
