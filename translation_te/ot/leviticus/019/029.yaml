  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: te
  text: నీ కుమార్తెను వేశ్యావృత్తిలోకి దింపి ఆమెను అపవిత్రపరచవద్దు[a]. లేకపోతే దేశం వేశ్యావృత్తిలో పడిపోయి[b], దేశమంతా నీచమైన దురాచారంతో నిండిపోతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను వేశ్యగా చేయడం ద్వారా” లేదా “ఆమెను వేశ్యావృత్తిలోకి దింపడం ద్వారా.” హీబ్రూ క్రియారూపం ఆమె ఆ స్థితిలోకి వెళ్లేలా చేయడం అనే కారణార్థక భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దేశం వ్యభిచారం చేయకుండునట్లు.” ఈ మాట సమాజమంతా నైతికంగా కలుషితం కావడాన్ని రూపకంగా చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అకృత్యంతో,” “దుష్టత్వంతో.” హీబ్రూ పదం ఘోరమైన నైతిక దుర్మార్గాన్ని, తరచుగా లైంగిక సందర్భంలో, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: అపవిత్రపరచవద్దు
  rationale: పీయేల్ రూపంలోని חלל ఇక్కడ పవిత్రమైనదాన్ని సామాన్యమైనదిగా లేదా అపవిత్రమైనదిగా చేయడాన్ని సూచిస్తుంది. లేవీయకాండంలోని పవిత్రత–అపవిత్రత భావప్రపంచాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: בִּתְּךָ
  choice: నీ కుమార్తెను
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నేరుగా సూచించే బంధుత్వ పదం; మూలంలోని ఏకవచనాన్ని నిలిపాం.
- source_word: לְהַזְנוֹתָהּ
  choice: వ్యభిచారానికి దింపి
  rationale: זנה ధాతువు హిఫీల్ క్రియార్థక రూపంలో ఉండి, కుమార్తెను వ్యభిచారంలోకి దింపడం లేదా ఆమెతో వ్యభిచారం చేయించడం అనే కారణార్థక భావాన్ని ఇస్తుంది. తెలుగు ప్రయోగంలో ఆ బలవంతపరిచే లేదా కారణమయ్యే భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: תִזְנֶה הָאָרֶץ
  choice: దేశం వ్యభిచారానికి దిగిపోయి
  rationale: దేశం లేదా సమాజం మొత్తాన్ని వ్యక్తిలా చిత్రిస్తూ వాడిన వ్యభిచార రూపకాన్ని సాధారణ నైతిక పతనంగా మార్చకుండా నిలిపాం. ‘దిగిపోయి’ అనే రూపం పరిణామం మరియు పతనం రెండింటినీ సూచిస్తుంది.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: దేశమంతా ... నిండిపోతుంది
  rationale: హెచ్చరికలో చెప్పిన ఫలితాన్ని సహజమైన ఆధునిక తెలుగు భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది. మూలంలోని הָאָרֶץ పునరుక్తిని ‘దేశం/దేశమంతా’ ద్వారా కొంతవరకు నిలిపాం.
- source_word: זִמָּה
  choice: నీచమైన దురాచారం
  rationale: ఈ పదం, ముఖ్యంగా లేవీయకాండంలో, లైంగిక సందర్భం కలిగిన ఘోరమైన నైతిక అకృత్యాన్ని సూచించగలదు. ‘దురాచారం’ విస్తృత నైతిక భావాన్ని, ‘నీచమైన’ దాని తీవ్రతను తెలియజేస్తాయి; అర్థాన్ని కేవలం లైంగిక అనైతికతకే పరిమితం చేయవు.
theological_decisions:
- issue: దేశం ‘వ్యభిచారం చేయడం’ అనే రూపకాన్ని ఎలా అనువదించాలి
  choice: ‘దేశం వ్యభిచారానికి దిగిపోయి’ అంటూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘దేశం నైతికంగా పతనమై’ లేదా ‘దేశంలో వ్యభిచారం వ్యాపించి’ అని రూపకాన్ని వివరణాత్మకంగా మార్చడం.
  rationale: మూలపాఠం ఒక వ్యక్తి చేసే కార్యాన్ని దేశానికి ఆపాదించి సమాజమంతటి కలుషితతను బలంగా చిత్రిస్తుంది. ఆ ఉద్వేగాన్ని, ఉద్దేశపూర్వక అసౌకర్యాన్ని నిలుపడం సముచితం.
- issue: חלל పదాన్ని పవిత్రతకు సంబంధించిన పదజాలంతో అనువదించాలా
  choice: ‘అపవిత్రపరచవద్దు’ అని అనువదించాం.
  alternative: ‘అవమానించవద్దు’ లేదా ‘చెడగొట్టవద్దు’.
  rationale: లేవీయకాండంలోని పవిత్రం–అపవిత్రం అనే ప్రధాన భావజాలంతో సంబంధాన్ని ‘అపవిత్రపరచు’ స్పష్టంగా నిలుపుతుంది; ‘అవమానించు’ ఆ సంబంధాన్ని బలహీనపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర శైలిని వాడాం. ‘అపవిత్రపరచు’ ద్వారా లేవీయకాండపు పవిత్రత పదజాలాన్ని, ‘దేశం వ్యభిచారానికి దిగిపోవడం’ ద్వారా మూలంలోని బలమైన సామూహిక రూపకాన్ని నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
