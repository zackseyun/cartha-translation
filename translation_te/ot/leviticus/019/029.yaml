  to: నీ కుమార్తెను వేశ్యావృత్తిలోకి దింపి ఆమెను అపవిత్రపరచవద్దు[a]. లేకపోతే దేశం వేశ్యావృత్తిలో పడిపోయి[b], దేశమంతా నీచమైన దురాచారంతో నిండిపోతుంది[c].
  rationale: సురక్షితమైన అర్థస్పష్టత కోసం זנה హిఫీల్‌ను కుమార్తెను ‘వేశ్యావృత్తిలోకి దింపడం’గా సవరించాం; ఇది బలవంతాన్ని అనవసరంగా నిర్దేశించకుండా కారణార్థక భావాన్ని నిలుపుతుంది. దేశం గురించిన రూపకంలోనూ అదే పదజాలాన్ని ఉంచాం. పాదసూచిక aలోని భిన్నార్థక ప్రత్యామ్నాయాన్ని తొలగించి, bలో ‘lest’ భావాన్ని సహజంగా స్పష్టం చేశాం.
