id: LEV.19.18
reference: Leviticus 19:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תִקֹּ֤ם וְ/לֹֽא תִטֹּר֙ אֶת בְּנֵ֣י עַמֶּ֔/ךָ וְ/אָֽהַבְתָּ֥ לְ/רֵעֲ/ךָ֖ כָּמ֑וֹ/ךָ אֲנִ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: te
  text: నీ ప్రజల కుమారులపై[a] ప్రతీకారం తీర్చుకోకూడదు; వారిమీద కక్ష పెట్టుకోకూడదు. నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి. నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సొంత ప్రజలపై.’ అక్షరార్థంగా, ‘నీ ప్రజల కుమారులపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: పగ తీర్చుకోకూడదు
  rationale: נקם ప్రతీకారం చేయడం లేదా పగ తీర్చుకోవడం అనే క్రియాశీల భావాన్ని ఇస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పగ తీర్చుకోవడం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תִטֹּר
  choice: పగ పట్టకూడదు
  rationale: נטר ఇక్కడ కోపాన్ని లేదా కక్షను మనసులో కొనసాగించడం అనే భావాన్ని సూచిస్తుంది. ‘పగ పట్టడం’ ఆ నిలకడైన మనోవైఖరిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי עַמֶּךָ
  choice: నీ ప్రజలవారిపై
  rationale: అక్షరార్థంగా ‘నీ ప్రజల కుమారులు.’ సందర్భంలో ఇది తన ప్రజాసమాజానికి చెందినవారిని సూచిస్తుంది; తెలుగులో ‘నీ ప్రజలవారు’ ప్రతినిధి సమూహార్థాన్ని సహజంగా ఇస్తుంది. అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: וְאָהַבְתָּ
  choice: ప్రేమించాలి
  rationale: న్యాయసంబంధ సందర్భంలో waw + perfect ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది. ‘ప్రేమించాలి’ ఆధునిక తెలుగులో స్పష్టమైన విధి లేదా ఆజ్ఞను తెలియజేస్తుంది.
- source_word: לְרֵעֲךָ
  choice: నీ పొరుగువాణ్ణి
  rationale: רֵעַకు తోటి వ్యక్తి, సహచరుడు, పొరుగువాడు అనే అర్థాలు ఉండవచ్చు. ఈ నైతిక ఆజ్ఞలో స్థిరపడినదీ, సహజమైనదీ అయిన ‘పొరుగువాడు’ను ఎంచుకున్నాం; తక్షణ సందర్భంలో అది సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది.
- source_word: כָּמוֹךָ
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: హీబ్రూ రూపం సంక్షిప్తంగా ‘నీలాగే/నీ వలె’ అని ఉంటుంది. తెలుగులో పోలిక ఏ విషయానికి వర్తిస్తుందో సహజంగా స్పష్టంచేయడానికి ‘నిన్ను నీవు ప్రేమించుకున్నట్లే’ అని అనువదించబడింది; కొత్త ప్రమాణాన్ని చేర్చకుండా ప్రేమనే పోలికగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: ఆజ్ఞ వర్తించే వ్యక్తుల పరిధి
  choice: మొదటి భాగంలో ఒడంబడిక ప్రజాసమాజ సూచనను ‘నీ ప్రజలవారు’గా నిలిపి, רֵעַను ‘నీ పొరుగువాడు’గా అనువదించడం
  alternative: రెండు పదబంధాలనూ ప్రధాన పాఠ్యంలో విస్తృతమైన సార్వత్రిక భాషగా మార్చడం
  rationale: వచనం ‘నీ ప్రజల కుమారులు’ అనే నిర్దిష్ట సమాజపరమైన పదబంధాన్ని, తరువాత ‘నీ పొరుగువాడు’ అనే పదాన్ని ఉపయోగిస్తుంది. తరువాతి వ్యాఖ్యానాల ఆధారంగా పరిధిని విస్తరించకుండా లేదా కుదించకుండా ఈ భేదాన్ని అనువాదం నిలుపుతుంది.
- issue: దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హెబ్రీలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. మొదటి రెండు నిషేధాల్లో సహజమైన తెలుగు సమాంతర నిర్మాణాన్ని నిలిపాం; పునరుక్తిని తగ్గించేందుకు రెండవ వాక్యభాగంలో ‘వారిమీద’ను ఉపయోగించాం.
