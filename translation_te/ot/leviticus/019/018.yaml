    text: లేదా, ‘నీ సొంత ప్రజలపై.’ అక్షరార్థంగా, ‘నీ ప్రజల కుమారులపై.’
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew's explicit “sons of your people” in the main text, preserving the textual distinction between that expression and “your neighbor.” It also differentiates vengeance from holding a grudge with natural Telugu vocabulary. No doctrinal expansion of the command's scope is introduced.
