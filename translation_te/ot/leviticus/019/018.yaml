revisions:
- from: నీ ప్రజలవారిపై[a] పగ తీర్చుకోకూడదు; వారిమీద పగ పట్టకూడదు. నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువాణ్ణి ప్రేమించాలి. నేను యాహ్వేను.
  to: నీ ప్రజల కుమారులపై[a] ప్రతీకారం తీర్చుకోకూడదు; వారిమీద కక్ష పెట్టుకోకూడదు. నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి. నేను యాహ్వేను.
