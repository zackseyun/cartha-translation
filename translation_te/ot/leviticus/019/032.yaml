id: LEV.19.32
reference: Leviticus 19:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/פְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְ/הָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: te
  text: నెరిసిన తలగలవారి ఎదుట నీవు లేచి నిలబడాలి[a]; వృద్ధుని గౌరవించాలి[b]; నీ దేవునికి భయపడాలి. నేను యహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నెరిసిన జుట్టు సమక్షంలో.” హీబ్రూ పాఠ్యం వృద్ధాప్యాన్ని సూచించడానికి ‘నెరిసిన జుట్టు’ అనే స్పష్టమైన రూపకాన్ని వాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యంలో పదక్షరంగా, “వృద్ధుని ముఖాన్ని గౌరవించాలి”; భావం, వృద్ధునికి గౌరవం చూపాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: తల నెరిసినవారి ఎదుట
  rationale: శֵׂיבָה అనే పదంలోని ‘నెరిసిన జుట్టు’ అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని నిలుపుతూ, గౌరవార్థంగా ఒకరి ఎదుట లేవడం అనే מִפְּנֵי ... תָּקוּם ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תָּקוּם
  choice: నీవు లేచి నిలబడాలి
  rationale: קום క్రియ ఇక్కడ గౌరవ సూచకంగా లేచి నిలబడాలనే ఆజ్ఞను ఇస్తుంది. ‘లేచి నిలబడాలి’ అనేది ఆధునిక తెలుగులో చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָדַרְתָּ פְּנֵי זָקֵן
  choice: వృద్ధుని గౌరవించాలి
  rationale: הדר పియేల్ రూపం గౌరవించడం లేదా మర్యాద చూపడం అని అర్థం. ‘వృద్ధుని ముఖాన్ని గౌరవించాలి’ అనే పదక్షర రూపం తెలుగులో అసహజంగా ఉండడం వల్ల, వ్యక్తిని గౌరవించాలనే హీబ్రూ నుడికార భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, పదక్షర రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: నీ దేవునికి భయపడాలి
  rationale: ירא లోని భయం, భక్తిపూర్వక విస్మయం అనే బలమైన నైతిక-దైవిక భావాన్ని మృదువుగా మార్చకుండా ‘భయపడాలి’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను ఒక బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో ‘యహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: זָקֵן లోని లింగ సూచన
  choice: వృద్ధుడు
  alternative: వృద్ధ వ్యక్తి / పెద్దవారు
  rationale: హీబ్రూ పదం పుంలింగ ఏకవచనంలో ఉన్నందున ‘వృద్ధుడు’ అనే లింగ సూచనను పాఠ్యంలో నిలిపాం; ఆజ్ఞ విస్తృత నైతిక వర్తింపును కలిగి ఉండవచ్చన్న విషయాన్ని అనువాదంలో అదనంగా చేర్చలేదు.
- issue: దేవునికి భయపడడం
  choice: నీ దేవునికి భయపడాలి
  alternative: నీ దేవుణ్ణి భక్తితో గౌరవించాలి
  rationale: ‘గౌరవించాలి’ మాత్రమే అని చెప్పడం వల్ల ירא లోని భయం, విస్మయం, భక్తి మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగం తగ్గిపోతుంది; అందుకే బలమైన ‘భయపడాలి’ రూపాన్ని నిలిపాం.
- issue: יהוה దైవనామం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూల పాఠ్యంలో వ్యక్తిగత దైవనామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలను వాడాం. ఏకవచన సంబోధనను ‘నీవు/నీ’తో నిలిపాం. మొదటి భాగంలోని నెరిసిన జుట్టు అనే హీబ్రూ చిత్రాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రెండో భాగంలోని ‘ముఖం’ అనే నుడికారాన్ని సహజమైన తెలుగులో భావానువాదం చేశాం.
