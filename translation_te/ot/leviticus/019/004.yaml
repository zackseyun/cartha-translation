- from: విగ్రహాలవైపు తిరగకండి[a]. పోతపోసిన లోహంతో దేవుళ్లను మీ కోసం చేసుకోవద్దు[b]. నేను మీ దేవుడైన యెహోవాను.
  to: విగ్రహాలవైపు తిరగకండి[a]. లోహంతో పోతపోసిన దేవుళ్లను మీ కోసం చేసుకోవద్దు[b]. నేను మీ దేవుడైన యాహ్వేను.
  rationale: The revision preserves the Hebrew’s broad prohibition against turning toward idols rather than paraphrasing it as worship. It retains the plural ‘gods’ and communicates that they are metal castings. ‘యాహ్వే’ replaces ‘యెహోవా’ to conform to the supplied POB decision for יהוה. Footnote b is adjusted so its alternatives are natural Telugu and correspond to the possible senses ‘molten gods’ and ‘metal idols.’
