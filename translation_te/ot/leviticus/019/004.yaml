id: LEV.19.4
reference: Leviticus 19:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: te
  text: విగ్రహాలవైపు తిరగకండి[a]. లోహంతో పోతపోసిన దేవుళ్లను మీ కోసం చేసుకోవద్దు[b]. నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పనికిరాని విగ్రహాలవైపు’; విగ్రహాలకు వాడిన హీబ్రూ పదంలో వ్యర్థతను సూచించే అవమానార్థ ఛాయ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కరిగించిన దేవుళ్లను’ లేదా ‘లోహ విగ్రహాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: వైపు తిరగకండి
  rationale: פנה అనే క్రియకు ప్రాథమికంగా ‘తిరుగు’ అనే అర్థం ఉంది. אֶל‌తో కలిసి ఇది విగ్రహాలవైపు దృష్టి, విధేయత లేదా ఆరాధన కోసం మళ్లడాన్ని సూచించగలదు; అయితే ‘ఆరాధించకండి’ అని అర్థాన్ని సంకుచితం చేయకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: אֱלִילִים
  choice: విగ్రహాలు
  rationale: ఇది విగ్రహాలకు వాడే సాధారణ పదం; పనికిరానితనం లేదా వ్యర్థత అనే అవమానార్థ ఛాయ ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ‘విగ్రహాలు’ను ఉంచి, ఆ ఛాయను పాదటిప్పణిలో తెలిపాం.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: పోతపోసిన లోహంతో దేవుళ్లు
  rationale: మַסֵּכָה లోహాన్ని కరిగించి అచ్చులో పోసి తయారుచేసే ప్రక్రియను సూచిస్తుంది; אֱלֹהֵי యొక్క బహువచనాన్ని ‘దేవుళ్లు’గా నిలిపాం.
- source_word: תַעֲשׂוּ לָכֶם
  choice: మీ కోసం చేసుకోవద్దు
  rationale: לָכֶם వల్ల వ్యక్తమయ్యే స్వప్రయోజన లేదా స్వాధీన భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీ కోసం చేసుకోవద్దు’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చారిత్రక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే దైవనామ రూపం; దీనిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నప్పటికీ, ఇక్కడ నిబంధన సంబంధిత సూత్రవాక్యంలో ఇశ్రాయేలు యొక్క ఏకవచన దేవుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చలేదు. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయం.
- issue: విగ్రహాలవైపు తిరగడం అంటే ఆరాధన అని స్పష్టంగా చెప్పాలా
  choice: విగ్రహాలవైపు తిరగకండి
  alternative: విగ్రహాలను ఆరాధించకండి
  rationale: פנה స్వయంగా ‘ఆరాధించు’ అని మాత్రమే చెప్పదు. దృష్టి, ఆశ్రయం, విధేయత లేదా ఆరాధన వైపు మళ్లడాన్ని కలిగి ఉండగల మూలంలోని విస్తృతతను నిలిపాం.
- issue: אֱלֹהֵי מַסֵּכָה లోని బహువచనాన్ని నిలపాలా
  choice: దేవుళ్లను
  alternative: లోహ విగ్రహాలను
  rationale: ‘దేవుళ్లు’ మూలంలోని אֱלֹהֵי బహువచనాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ‘విగ్రహాలు’ అని మార్చితే వస్తువుల స్వరూపం స్పష్టమైనా మూల పదప్రయోగం కొంత సమతలమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘వైపు తిరగకండి’ మూలంలోని రూపక విస్తృతతను కాపాడుతుంది. తయారీ విధానాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేయడానికి ‘పోతపోసిన లోహంతో’ అని ఇచ్చాం.
