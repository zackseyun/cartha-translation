id: LEV.19.11
reference: Leviticus 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֖א תִּגְנֹ֑בוּ וְ/לֹא תְכַחֲשׁ֥וּ וְ/לֹֽא תְשַׁקְּר֖וּ אִ֥ישׁ בַּ/עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: te
  text: మీరు దొంగతనం చేయకూడదు; మోసం చేయకూడదు; ఒకరితో ఒకరు అబద్ధం చెప్పకూడదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదక్షరంగా, “ప్రతి వ్యక్తి తన సహచరునితో” లేదా “ఒక్కొకరు తమ పొరుగువారితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: మీరు దొంగతనం చేయకూడదు
  rationale: לֹא తో కూడిన Qal అపూర్ణ క్రియారూపం ఇక్కడ నిషేధాన్ని తెలియజేస్తుంది. גנב యొక్క సూటి అర్థాన్ని ఆధునిక తెలుగులో సహజంగా ‘దొంగతనం చేయడం’ అని ఇచ్చాం.
- source_word: תְכַחֲשׁוּ
  choice: మోసం చేయకూడదు
  rationale: כחש యొక్క Piel రూపం మోసపూరితంగా ప్రవర్తించడం, అబద్ధంగా నిరాకరించడం, లేదా కపటంగా వ్యవహరించడం అనే అర్థాలను కలిగి ఉండగలదు. ఈ మూడు సామాజిక నిషేధాల సందర్భంలో ‘మోసం చేయడం’ దాని విస్తృత భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: תְשַׁקְּרוּ
  choice: అబద్ధమాడకూడదు
  rationale: שקר యొక్క Piel రూపం సాధారణంగా అబద్ధం చెప్పడం లేదా అసత్యంగా ప్రవర్తించడం సూచిస్తుంది. తరువాతి వ్యక్తుల మధ్య సంబంధాన్ని సూచించే పదబంధంతో ‘అబద్ధమాడడం’ సహజంగా సరిపోతుంది.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: ఒకరితో ఒకరు
  rationale: పదక్షరంగా ఇది ‘ఒక వ్యక్తి తన సహచరునితో/సహచరునికి’ అనే పంపిణీ భావం గల నిర్మాణం. సందర్భంలో పరస్పర సంబంధాన్ని సూచిస్తున్నందున ‘ఒకరితో ఒకరు’ సహజమైన, లింగపరంగా సముచితమైన అనువాదం.
- source_word: עֲמִית
  choice: ఒకరు
  rationale: עמית సమాజంలోని తోటి వ్యక్తి, సహచరుడు లేదా పొరుగువాడిని సూచిస్తుంది. మొత్తం హీబ్రూ పదబంధాన్ని పరస్పర నిర్మాణంగా అనువదించినందున దీనిని విడిగా ‘పొరుగువాడు’ అని పునరావృతం చేయలేదు.
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹ లోని వ్యాకరణపరంగా పుంలింగ పంపిణీ వ్యక్తీకరణ
  choice: ప్రధాన పాఠ్యంలో ‘ఒకరితో ఒకరు’ అని సమగ్రంగా అనువదించడం
  alternative: ‘ప్రతి మనిషి తన పొరుగువానితో’ లేదా ‘ఒక మనిషి తన సహచరునితో’
  rationale: హీబ్రూ పుంలింగ ఏకవచనం ఇక్కడ పురుషులకు మాత్రమే వర్తించే పరిమితి కాదు; ప్రతినిధి, పంపిణీ ప్రయోగం. అందువల్ల మూల ఉద్దేశాన్ని నిలుపుతూ సహజ తెలుగులో లింగసమగ్ర పరస్పర నిర్మాణాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యే నిషేధ వాక్యాలుగా రూపొందించాం. మూడు సమాంతర ఆజ్ఞలను అర్ధవిరామాలతో వేరు చేసి హీబ్రూ త్రిసభ్య నిర్మాణాన్ని నిలిపాం.
