source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: te
  text: '“ఇశ్రాయేలీయుల సమాజమంతటితో[a] మాట్లాడు. వారితో ఇలా చెప్పు: ‘మీరు పరిశుద్ధులుగా ఉండాలి[b], ఎందుకంటే మీ దేవుడైన యహ్వే అయిన నేను పరిశుద్ధుణ్ణి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “ఇశ్రాయేలు కుమారుల సమాజమంతటితో”; లేదా: “ఇశ్రాయేలీయుల మొత్తం సమాజంతో.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “పరిశుద్ధులుగా ఉండండి” లేదా “మీరు పరిశుద్ధులై ఉండాలి.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: పీయేల్ ఆజ్ఞార్థక రూపంలోని నేరమైన ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతటితో
  rationale: עֵדָה సూచించే సమష్టి సమాజ భావాన్ని నిలుపుతూ, בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారాన్ని తెలుగులో అందరినీ కలుపుకొనే సహజ రూపంగా అందిస్తుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: న్యాయశాసన వాక్యాల్లో కనిపించే ఆజ్ఞా క్రమాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: మీరు పరిశుద్ధులుగా ఉండాలి
  rationale: విశేషణం మరియు అసంపూర్ణ క్రియ కలయికలోని ఆజ్ఞాత్మక బాధ్యతను తెలుగులో సహజంగా తెలియజేస్తుంది; ప్రత్యక్ష ఆజ్ఞ రూపం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: קָדוֹשׁ
  choice: పరిశుద్ధుణ్ణి
  rationale: దేవుని స్వభావానికి సంబంధించిన קדוש పదంలోని పవిత్రత, ప్రత్యేకత అనే విస్తృత భావాన్ని స్థిరమైన తెలుగు ధార్మిక పదంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వేను
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది; వాక్యనిర్మాణానికి అనుగుణంగా ద్వితీయా విభక్తి చేర్చబడింది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: సంబోధించబడుతున్న సమాజంతో దేవునికి ఉన్న నిబంధనా సంబంధాన్ని, రెండవ పురుష బహువచన ప్రత్యయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే నిబంధనా సమాజ సూచన
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలో పదశః ‘ఇశ్రాయేలు కుమారులు’ అని ఉన్నా, ఈ సందర్భంలో అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే స్థిర నుడికారం. తెలుగు ప్రధాన పాఠంలో ఉద్దేశిత సమూహాన్ని సహజంగా తెలిపి, పదశః రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: పరిశుద్ధతకు సంబంధించిన ఆదేశం
  choice: మీరు పరిశుద్ధులుగా ఉండాలి
  alternative: పరిశుద్ధులుగా ఉండండి
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ బాధ్యత లేదా ఆజ్ఞ భావాన్ని కలిగి ఉంది. ‘ఉండాలి’ ఆ శాసనబద్ధ బలాన్ని నిలుపుతుంది; నేర ఆజ్ఞ రూపం కూడా వ్యాకరణపరంగా సాధ్యమైనందున పాదసూచికలో ఇచ్చాం.
- issue: יְהוָה దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఇవ్వడం మూల పాఠ్య భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాసన శైలిని, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతో సమతుల్యం చేశాం. ‘పరిశుద్ధులు’ అనే స్థిర ధార్మిక పదాన్ని ఉంచి, దైవనామాన్ని ‘యహ్వే’గా ప్రతిలిపి చేశాం.
