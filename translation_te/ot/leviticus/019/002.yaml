revisions:
- from: '“ఇశ్రాయేలు ప్రజల సమాజమంతటితో[a] మాట్లాడు. వారితో ఇలా చెప్పు: ‘మీరు పరిశుద్ధులుగా ఉండాలి[b]. ఎందుకంటే మీ దేవుడైన యహ్వేను నేను పరిశుద్ధుణ్ణి.’”'
  to: '“ఇశ్రాయేలీయుల సమాజమంతటితో[a] మాట్లాడు. వారితో ఇలా చెప్పు: ‘మీరు పరిశుద్ధులుగా ఉండాలి[b], ఎందుకంటే మీ దేవుడైన యహ్వే అయిన నేను పరిశుద్ధుణ్ణి.’”'
  rationale: The revision corrects the grammatical case error in the divine self-identification while retaining the Hebrew’s emphatic apposition, “I, Yahweh your God.” It also uses an idiomatic corporate Telugu expression for the addressed community, with the literal Hebrew filial wording preserved in the footnote. The command’s formal obligatory force and the established theological term “పరిశుద్ధ” are retained.
