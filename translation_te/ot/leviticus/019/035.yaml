- from: తీర్పు విషయంలో[a], పొడవు కొలవడంలో, బరువు తూచడంలో, పరిమాణం కొలవడంలో మీరు అన్యాయం చేయకూడదు.
  to: న్యాయవిషయాల్లో[a], పొడవు కొలతల్లో, తూకంలో, సామర్థ్య కొలతల్లో మీరు అన్యాయం చేయకూడదు.
  rationale: The revision keeps the source’s legal prohibition and its three distinct commercial standards while improving Telugu concision. It avoids reducing the final term to generic measuring and preserves the lexical breadth of מִשְׁפָּט through the main text and footnote.
