id: LEV.19.35
reference: Leviticus 19:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֖וֶל בַּ/מִּשְׁפָּ֑ט בַּ/מִּדָּ֕ה בַּ/מִּשְׁקָ֖ל וּ/בַ/מְּשׂוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: te
  text: న్యాయవిషయాల్లో[a], పొడవు కొలతల్లో, తూకంలో, సామర్థ్య కొలతల్లో మీరు అన్యాయం చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీర్పు విషయంలో.’
    reason: మִשְׁפָּטకు ‘న్యాయవిషయాలు/న్యాయం’ అనే విస్తృత అర్థంతో పాటు ‘తీర్పు’ అనే అర్థం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు ... చేయకూడదు
  rationale: ఇది బహువచన సంబోధనలో ఉన్న నిషేధం. ఆధునిక తెలుగు న్యాయశైలి ప్రకారం ‘చేయకూడదు’ సహజంగా, స్పష్టంగా నిషేధార్థాన్ని తెలియజేస్తుంది.
- source_word: עָוֶל
  choice: అన్యాయం
  rationale: ఈ పదం తప్పు, అన్యాయం, మోసం అనే భావాలను సూచించగలదు. తీర్పులు, కొలతలు, తూకాలకు సంబంధించిన సందర్భంలో ‘అన్యాయం’ విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది.
- source_word: בַּמִּשְׁפָּט
  choice: తీర్పు విషయంలో
  rationale: מִשְׁפָּט అనే పదానికి తీర్పు, న్యాయం, న్యాయ నిర్ణయం అనే అర్థాలు ఉన్నాయి. ‘తీర్పు విషయంలో’ మూలపాఠానికి సమీపంగా ఉండి, దాని విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בַּמִּדָּה
  choice: పొడవు కొలవడంలో
  rationale: מִדָּה సాధారణంగా కొలత లేదా పరిమాణాన్ని సూచిస్తుంది. తరువాత బరువు, సామర్థ్యపు కొలత వేరుగా రావడం వల్ల ఇక్కడ పొడవు కొలతగా వ్యక్తీకరించడం మూడు వర్గాల మధ్య తేడాను స్పష్టం చేస్తుంది.
- source_word: בַּמִּשְׁקָל
  choice: బరువు తూచడంలో
  rationale: מִשְׁקָל బరువు లేదా తూకాన్ని సూచిస్తుంది. ‘బరువు తూచడంలో’ తెలుగు వాడుకలో సహజంగా ఉండి వ్యాపార సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבַמְּשׂוּרָה
  choice: పరిమాణం కొలవడంలో
  rationale: מְשׂוּרָה ముఖ్యంగా ఒక పాత్ర ఎంత పట్టగలదో తెలిపే సామర్థ్యపు కొలతను సూచిస్తుంది. ‘పరిమాణం కొలవడంలో’ ద్రవ లేదా పొడి కొలతకే పరిమితం చేయకుండా ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ నిషేధ శైలి వాడబడింది. సాంకేతికంగా వినిపించే ‘సామర్థ్య కొలత’ను ప్రధాన వాక్యంలో నివారించి, అవసరమైన అర్థభేదాన్ని పాదసూచికలో ఉంచాం.
