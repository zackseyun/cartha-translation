revisions:
- from: అయితే మూడవ రోజున దాన్ని తిననే తింటే, అది అపవిత్రమైనది[a]; అది అంగీకరించబడదు.
  to: అయితే మూడవ రోజున దానిని తిననే తింటే, అది అసహ్యమైనది[a]; అది అంగీకరించబడదు.
  rationale: The revision replaces a potentially misleading impurity term with a natural Telugu expression for the cultically offensive, unacceptable status denoted by פִּגּוּל. It retains the source's emphatic conditional, the third-day reference, and the statement of nonacceptance.
