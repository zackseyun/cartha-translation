id: LEV.19.7
reference: Leviticus 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: te
  text: అయితే మూడవ రోజున దానిని తిననే తింటే, అది అసహ్యమైనది[a]; అది అంగీకరించబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కలుషితమైనది.” అనుమతించబడిన కాలం దాటిన తర్వాత తినబడటం వల్ల బలిమాంసం అంగీకారయోగ్యం కాకుండా పోయిన స్థితిని ఈ హెబ్రీ పదం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … తింటే
  rationale: ముందటి ఆజ్ఞకు విరుద్ధమైన షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: దాన్ని తిననే తింటే
  rationale: క్రియకు ముందు వచ్చిన infinitive absolute ఇచ్చే ఉద్ఘాటనను ‘తిననే తింటే’ అనే సహజమైన హెచ్చరిక రూపంలో నిలుపుతుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలసూచనను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: פִּגּוּל
  choice: అపవిత్రమైనది
  rationale: అనుమతించిన కాలం దాటినందువల్ల బలిమాంసం ఆచారపరంగా అనంగీకారమైన స్థితికి చేరిందనే భావాన్ని తెలియజేస్తుంది; ‘అసహ్యం’ వంటి మరింత విస్తృతమైన నైతిక అర్థాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: הוּא
  choice: అది
  rationale: హెబ్రీలోని స్పష్టమైన కర్తను నిలుపుతూ ముందున్న బలిమాంసాన్ని సూచిస్తుంది.
- source_word: לֹא יֵרָצֶה
  choice: అది అంగీకరించబడదు
  rationale: బలి సందర్భంలో רצה నిఫ్అల్ రూపం దేవుని ఎదుట ఆమోదయోగ్యతను సూచిస్తుంది; తెలుగు నిష్క్రియ రూపం మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: మూడవ రోజున తిన్న బలిమాంసం యొక్క స్థితి
  choice: ఆ మాంసం ఆచారపరంగా అపవిత్రమై, బలిగా అంగీకరించబడదని వాక్యం ప్రకటిస్తుంది.
  alternative: అది కేవలం భౌతికంగా పాడైందని లేదా ఇతర తీవ్రమైన నిషిద్ధ విషయాల మాదిరిగానే సంపూర్ణ ‘హేయవస్తువు’ అని అర్థం చేసుకోవడం.
  rationale: తక్షణ సందర్భం బలుల ఆమోదయోగ్యతను గురించినది; చివరి మాట కూడా అది అంగీకరించబడదని చెబుతుంది. అందువల్ల అనువాదం భౌతిక కుళ్లుదలకో విస్తృత నైతిక వర్గీకరణకో భావాన్ని పరిమితం చేయకుండా బలి-ఆచార సంబంధ అర్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. ‘తిననే తింటే’ మూలంలోని ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది; సాంకేతిక ఆచారపదజాలాన్ని అతిగా ఉపయోగించలేదు.
