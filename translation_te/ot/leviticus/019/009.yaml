id: LEV.19.9
reference: Leviticus 19:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: te
  text: మీరు మీ భూమి పంటను కోసేటప్పుడు, మీ పొలం అంచును పూర్తిగా కోయకూడదు[a]; మీ పంటలో మిగిలిన వాటిని ఏరుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ పొలం మూలను.’ హీబ్రూ పదం అంచు, పక్క లేదా మూలను సూచించగలదు; ఇక్కడ కోయకుండా విడిచిపెట్టవలసిన పొలం వెలుపలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: మీరు ... కోసేటప్పుడు
  rationale: వావ్ సంధి, בְּ ఉపసర్గతో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: קְצִיר אַרְצְכֶם
  choice: మీ భూమి పంటను
  rationale: קְצִיר ఇక్కడ పంట/కోతను, אֶרֶץ వ్యవసాయ భూమిని సూచిస్తున్నాయి; సందర్భానికి ‘మీ భూమి పంట’ స్పష్టమైన తెలుగు.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: పూర్తిగా కోయకూడదు
  rationale: Piel రూపంలోని כלה ‘ముగించు, పూర్తిచేయు’ అనే భావాన్ని ఇస్తుంది; לִקְצֹר కోత చర్యను స్పష్టం చేస్తుంది.
- source_word: פְּאַת שָׂדְךָ
  choice: మీ పొలం అంచును
  rationale: פֵּאָה అంచు, పక్క లేదా మూల అనే అర్థాలు కలిగి ఉంది; ఈ వ్యవసాయ సందర్భంలో ‘అంచు’ సహజమైన ప్రధాన ఎంపిక.
- source_word: לֶקֶט קְצִירְךָ
  choice: మీ కోతలో రాలిపడిన వాటిని
  rationale: לֶקֶט ప్రధాన కోతలో చెల్లాచెదురుగా రాలిన లేదా మిగిలిన పంటను సూచిస్తుంది; సాంకేతికంగా అసహజమైన పదం కంటే ఈ వివరణ సాధారణ పాఠకునికి స్పష్టం.
- source_word: לֹא תְלַקֵּט
  choice: ఏరుకోకూడదు
  rationale: לקט అంటే నేలపై మిగిలిన వాటిని ఏరడం లేదా సేకరించడం; ‘ఏరుకోకూడదు’ ఈ సందర్భంలో సంక్షిప్తంగా, సహజంగా ఉంది.
