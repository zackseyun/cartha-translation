review_pass:
  verdict: revise
  source_fidelity: The first clause accurately represents the temporal construction and the prohibition against fully reaping the field's edge. However, 'రాలిపడిన వాటిని' (“things that have fallen”) narrows לֶקֶט to fallen produce. In this context לֶקֶט more broadly denotes produce left over/scattered from the harvest and then gathered.
  naturalness: The Telugu is clear, modern, and suitably formal for legal instruction. 'మీ పంటలో మిగిలిన వాటిని ఏరుకోకూడదు' is equally natural and avoids the unwarranted restriction introduced by 'రాలిపడిన.'
  terminology: '''భూమి పంట,'' ''పొలం అంచు,'' ''పూర్తిగా కోయకూడదు,'' and ''ఏరుకోకూడదు'' are appropriate. The footnote responsibly preserves the lexical range of פֵּאָה without treating one disputed spatial sense as exclusive.'
  issues:
  - severity: medium
    issue: లֶקֶט is rendered as only produce that has fallen.
    rationale: The wording 'మీ కోతలో రాలిపడిన వాటిని' limits the Hebrew gleanings to fallen items, whereas the term can include leftover or scattered produce gathered after harvesting. Rendering it as what remains in the harvest preserves the broader sense.
  revised_text: మీరు మీ భూమి పంటను కోసేటప్పుడు, మీ పొలం అంచును పూర్తిగా కోయకూడదు[a]; మీ పంటలో మిగిలిన వాటిని ఏరుకోకూడదు.
  revised_footnotes:
  - marker: a
    text: లేదా ‘మీ పొలం మూలను.’ హీబ్రూ పదం అంచు, పక్క లేదా మూలను సూచించగలదు; ఇక్కడ కోయకుండా విడిచిపెట్టవలసిన పొలం వెలుపలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
