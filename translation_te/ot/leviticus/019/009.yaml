- from: మీరు మీ భూమి పంటను కోసేటప్పుడు, మీ పొలం అంచును పూర్తిగా కోయకూడదు[a]; మీ కోతలో రాలిపడిన వాటిని ఏరుకోకూడదు.
  to: మీరు మీ భూమి పంటను కోసేటప్పుడు, మీ పొలం అంచును పూర్తిగా కోయకూడదు[a]; మీ పంటలో మిగిలిన వాటిని ఏరుకోకూడదు.
