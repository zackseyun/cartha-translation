translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాసన శైలి వాడబడింది. ‘కోయకూడదు/ఏరుకోకూడదు’ రూపాలు ఆజ్ఞాత్మక నిషేధాన్ని సహజంగా తెలియజేస్తాయి; అరుదైన వ్యవసాయ పారిభాషిక పదాలకు బదులుగా సాధారణ పాఠకునికి అర్థమయ్యే పదబంధాలు ఎంచుకోబడ్డాయి.
