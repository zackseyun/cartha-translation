source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: te
  text: మీరు రక్తం మీద భోజనం చేయకూడదు.[a] మీరు సోదె చెప్పకూడదు; శకునాలను బట్టి అర్థాలు చెప్పకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్తంతో.’ హీబ్రూ పదబంధం అర్థం కఠినమైనది; ఇది రక్తం ఇంకా ఉన్న మాంసాన్ని తినడాన్నో, రక్తానికి సంబంధించిన ఆచార భోజనంలో పాల్గొనడాన్నో సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఈ రెండు హీబ్రూ క్రియల మధ్య ఖచ్చితమైన అర్థభేదం అనిశ్చితం. రెండవ దానిని ‘సోదె చెప్పకూడదు’ లేదా సంప్రదాయంగా ‘కాలములను చూడకూడదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: మీరు ... తినకూడదు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగు ధర్మశాసన శైలిలో సహజమైన ‘తినకూడదు’గా అనువదించాం.
- source_word: עַל הַדָּם
  choice: రక్తం మీద
  rationale: హీబ్రూ పదబంధం అర్థం వివాదాస్పదం. ‘రక్తంతో’ లేదా ‘రక్తం ఉన్న మాంసాన్ని’ అని నిర్దిష్టం చేయకుండా, על అనే విభక్తి సూచించే రూపాన్ని పారదర్శకంగా ఉంచి అస్పష్టతను కాపాడాం.
- source_word: תְנַחֲשׁוּ
  choice: శకునం చూసి భవిష్యత్తు చెప్పకూడదు
  rationale: נחשׁ పియేల్ రూపం శకునాల ఆధారంగా దివ్యజ్ఞానం లేదా భవిష్యజ్ఞానం చెప్పే ఆచారాన్ని సూచిస్తుంది; సాధారణ ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా క్రియాత్మకంగా వ్యక్తం చేశాం.
- source_word: תְעוֹנֵנוּ
  choice: శుభాశుభ సూచనలను వ్యాఖ్యానించకూడదు
  rationale: ענן ఈ రూపానికి శకునాలు లేదా సూచనలను పరిశీలించి అర్థం చెప్పడం అనే సంభావ్య భావం ఉంది. పాత అనువాదాల్లోని ‘కాలములను చూడడం’ ఆధునిక తెలుగులో అస్పష్టంగా ఉండటంతో, ప్రధాన సంభావ్య అర్థాన్ని వాడి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: עַל הַדָּם అనే అస్పష్ట నిషేధాన్ని ఎంత నిర్దిష్టంగా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘రక్తం మీద’ అనే సాపేక్షంగా అక్షరార్థ రూపాన్ని ఉంచడం
  alternative: ‘రక్తంతో’, ‘రక్తం ఇంకా దానిలో ఉండగా’, లేదా ‘రక్తసంబంధ ఆచార భోజనంలో’
  rationale: ఈ నిషేధం రక్తంతో కూడిన మాంసం తినడాన్నా, రక్తసంబంధ ఆచార భోజనాన్నా, లేక మరేదైనా ఆచారాన్నా సూచిస్తుందో నిశ్చితం కాదు. కాబట్టి సందిగ్ధతను సిద్ధాంతపరంగా పరిష్కరించకుండా ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదసూచికలో ఇచ్చాం.
- issue: תְנַחֲשׁוּ మరియు תְעוֹנֵנוּ మధ్య అర్థభేదాన్ని నిలుపుకోవడం
  choice: మొదటిదాన్ని శకునం ద్వారా భవిష్యత్తు చెప్పడం, రెండోదాన్ని శుభాశుభ సూచనలను వ్యాఖ్యానించడం అని వేరు చేయడం
  alternative: రెండింటినీ సాధారణంగా ‘శకునాలు చూడడం’ లేదా ‘సోదె చెప్పడం’ అని అనువదించడం
  rationale: రెండు హీబ్రూ క్రియలూ సమీపార్థాలు కలిగి ఉన్నప్పటికీ, సమాంతర నిషేధాల్లోని పదభేదాన్ని తెలుగులో సాధ్యమైనంత వరకు నిలుపుకున్నాం; ఖచ్చితమైన సరిహద్దు అనిశ్చితమని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ధర్మశాసన శైలి. అస్పష్టమైన హీబ్రూ పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉద్దేశపూర్వకంగా సాపేక్ష అక్షరార్థంతో నిలిపాం.
