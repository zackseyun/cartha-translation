  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֶׂ֣רֶט לָ/נֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּ/בְשַׂרְ/כֶ֔ם וּ/כְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּ/כֶ֑ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: te
  text: చనిపోయినవారి కోసం మీ దేహంపై కోతలు పెట్టుకోకూడదు[a]; మీపై పచ్చబొట్టు గుర్తు వేయించుకోకూడదు[b]. నేనే యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చనిపోయిన వ్యక్తి కోసం.’ హీబ్రూ పదబంధం ఒక నుడికార ప్రయోగం; సాధారణంగా మృతుల కోసం పాటించే శోకాచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చెక్కిన గుర్తు.’ ఈ హీబ్రూ పదబంధం అరుదైనది; బహుశా దేహంపై శాశ్వతంగా వేసే గుర్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: కోతలు
  rationale: ఈ నామవాచకం దేహంపై చేసే కోతను సూచిస్తుంది. సాధనం లేదా తీవ్రతను అనవసరంగా నిర్దిష్టం చేయకుండా, నిషేధంలోని సమూహార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָנֶפֶשׁ
  choice: చనిపోయినవారి కోసం
  rationale: ఈ ధర్మశాస్త్ర సందర్భంలో נֶפֶשׁ అనే పదం మృతవ్యక్తిని, ముఖ్యంగా శోకాచారానికి సంబంధించిన సందర్భంలో, సూచించే జాతీయ ప్రయోగం. ఈ అర్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בִּבְשַׂרְכֶם
  choice: మీ దేహంపై
  rationale: పదశః 'మీ మాంసంలో' అయినా, కోతలు శరీరంపై పెట్టుకోవడాన్ని ఆధునిక తెలుగులో 'మీ దేహంపై' అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כְתֹבֶת קַעֲקַע
  choice: పచ్చబొట్టు గుర్తు
  rationale: అత్యంత అరుదైన ఈ సంయుక్త పదబంధం దేహంపై చెక్కిన లేదా శాశ్వతంగా వేసిన గుర్తును సూచించే అవకాశముంది. 'పచ్చబొట్టు గుర్తు' ఆధునిక పాఠకునికి భావాన్ని తెలియజేస్తూనే, పాదసూచికలో విస్తృత ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: మీపై ... వేయించుకోకూడదు
  rationale: נתן + ב ఇక్కడ శరీరంపై గుర్తును ఉంచడం లేదా వేయడం అనే భావం ఇస్తుంది. తెలుగులో వ్యక్తి తనపై అలాంటి గుర్తు వేయించుకోవడాన్ని సహజంగా వ్యక్తం చేయడానికి ఆత్మనేపద రూపం వాడబడింది.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, మూలపాఠంలోని ఒడంబడిక నామాన్ని తెలుగులో సుపరిచితమైన 'యెహోవా' రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: శరీర గుర్తులకు సంబంధించిన నిషేధాన్ని ఆధునిక పచ్చబొట్లపై తరువాతి సిద్ధాంత చర్చలతో విస్తరించకుండా అనువదించడం
  choice: మృతుల కోసం కోతలు పెట్టుకోవడాన్ని, అలాగే పచ్చబొట్టు గుర్తు వేయించుకోవడాన్ని మూలపాఠం చెప్పినట్టే రెండు నిషేధాలుగా ఉంచడం
  alternative: రెండింటినీ కేవలం అన్యమత శోకాచారాలకే పరిమితం చేయడం; లేదా ప్రతి సంస్కృతిలోని అన్ని పచ్చబొట్లపై సర్వకాలిక నిషేధమని అనువాదంలోనే స్పష్టం చేయడం
  rationale: మొదటి నిషేధానికి మాత్రమే 'చనిపోయినవారి కోసం' అని స్పష్టంగా అనుసంధానం ఉంది; రెండవ నిషేధంలో ఆ మాట పునరావృతం కాలేదు. అందువల్ల అనువాదం దాని పరిధిని కుదించకూడదు లేదా విస్తరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. 'పెట్టుకోకూడదు/వేయించుకోకూడదు' అనే రూపాలు నేరుగా నిషేధాన్ని తెలియజేస్తాయి. మూలంలోని రెండు వాక్యభాగాల భేదం, చివరి దైవ స్వపరిచయ సూత్రం నిలుపబడ్డాయి.
