    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే ఈ సూత్రబద్ధ సందర్భంలో דבר ను ఆధునిక సహజ తెలుగులో ‘చెప్పాడు’ అని అనువదించడం సముచితం; ‘మాట్లాడాడు’ మరింత రూపసామ్యమైన ప్రత్యామ్నాయం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יְהוָה ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో వచ్చిన אֶל ను తెలుగు సహజ వాక్యనిర్మాణంలో సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తపరచాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: మֹשֶׁה అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం ‘మోషే’.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹר ను తెలుగు ప్రయోగంలో సహజంగా ‘ఇలా’ అని వ్యక్తపరచి, కోలన్‌తో ప్రసంగారంభాన్ని సూచించాం.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామాన్ని లిప్యంతరీకరించాం. తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే సంక్షిప్త దైవిక ప్రసంగ-పరిచయ సూత్రం. మూలంలోని ‘చెప్పుటకు’ అనే హెబ్రీయ సూత్రాన్ని యాంత్రికంగా నిలుపకుండా ‘ఇలా ...:’ అనే సహజ తెలుగు నిర్మాణాన్ని వాడాం.
