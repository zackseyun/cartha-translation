id: LEV.19.6
reference: Leviticus 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/י֧וֹם זִבְחֲ/כֶ֛ם יֵאָכֵ֖ל וּ/מִֽ/מָּחֳרָ֑ת וְ/הַ/נּוֹתָר֙ עַד י֣וֹם הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: te
  text: మీరు బలి అర్పించిన రోజున, మరుసటి రోజున అది తినాలి; మూడవ రోజు వరకు మిగిలినదాన్ని అగ్నిలో కాల్చివేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם זִבְחֲכֶם
  choice: మీరు బలి అర్పించిన రోజున
  rationale: కాలాన్ని సూచించే בְּיוֹםను సహజమైన తెలుగులో ‘రోజున’గా, זִבְחֲכֶםను సందర్భానుసారంగా ‘మీరు బలి అర్పించిన’గా అనువదించాం.
- source_word: יֵאָכֵל
  choice: అది తినాలి
  rationale: నిఫాల్ అసంపూర్ణ క్రియ యొక్క కర్మణి భావాన్ని తెలుగు నియమవాక్యానికి సహజమైన ‘తినాలి’ అనే రూపంలో వ్యక్తం చేశాం; ‘అది’ సందర్భం నుంచి పూరించబడింది.
- source_word: וּמִמָּחֳרָת
  choice: మరుసటి రోజున
  rationale: మָחֳרָת అంటే తరువాతి రోజు; కాలక్రమాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: וְהַנּוֹתָר
  choice: మిగిలినదాన్ని
  rationale: נותר క్రియారూపం తినకుండా మిగిలిపోయిన భాగాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్మరూపం వాడాం.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజు వరకు
  rationale: עַד సూచించే కాలపరిమితిని నేరుగా, సహజంగా నిలిపాం.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: అగ్నిలో కాల్చివేయాలి
  rationale: కర్మణి న్యాయనిర్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, בָּאֵשׁలోని అగ్ని అనే స్పష్టమైన చిత్రణను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ధర్మశాసన శైలి. మూలంలోని కాలక్రమం, ఆజ్ఞాత్మక బలం నిలిపివేయబడ్డాయి.
