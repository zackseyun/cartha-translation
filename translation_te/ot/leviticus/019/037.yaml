    rationale: హీబ్రూలో ‘కాపాడండి/పాటించండి’ మరియు ‘చేయండి’ అనే రెండు సమన్వయ క్రియలు ఉన్నాయి. వాటిని రెండు ఆజ్ఞలుగా ఉంచడం నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
