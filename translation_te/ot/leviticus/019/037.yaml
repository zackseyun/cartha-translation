id: LEV.19.37
reference: Leviticus 19:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: te
  text: కాబట్టి మీరు నా శాసనాలన్నిటినీ, నా న్యాయవిధులన్నిటినీ[a] పాటించాలి; వాటిని ఆచరించాలి. నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శాసనాలు’ అనే చోట ‘కట్టడలు’ లేదా ‘ఆజ్ఞలు’ అనీ, ‘న్యాయవిధులు’ అనే చోట ‘నియమాలు’ లేదా ‘న్యాయనిర్ణయాలు’ అనీ అనువదించవచ్చు. హీబ్రూ మూలంలో రెండు వేర్వేరు న్యాయపదాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: కాబట్టి మీరు ... పాటించి
  rationale: שׁמר అనే పదం ధర్మశాస్త్ర సందర్భంలో కాపాడడం, పాటించడం, అనుసరించడం అనే భావాన్ని ఇస్తుంది. అధ్యాయ ముగింపులోని సారాంశ భావాన్ని וּ conjunctionతో కలిపి ‘కాబట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל
  choice: అన్నిటినీ / అన్నిటినీ
  rationale: హీబ్రూలో రెండుసార్లు ఉన్న సమగ్రతను తెలుగులోనూ రెండు న్యాయపదబంధాల్లో స్పష్టంగా నిలుపుతుంది.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలన్నిటినీ
  rationale: חֻקִּים నిర్దేశించబడిన శాసనాలు లేదా కట్టడలను సూచిస్తుంది. ‘కట్టడలు’ తరువాతి מִשְׁפָּטִיםతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులన్నిటినీ
  rationale: מִשְׁפָּטִים న్యాయనిర్ణయాలు, నియమాలు, విధులను సూచిస్తుంది. ‘న్యాయవిధులు’ న్యాయ సంబంధ భావాన్ని, חֻקִּיםతో పదభేదాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరించాలి
  rationale: עשה ధర్మశాస్త్ర సంబంధ కర్మలతో వాడినప్పుడు చేయడం లేదా అమలు చేయడం అని అర్థం. ‘ఆచరించాలి’ ఆధునిక తెలుగులో ఆజ్ఞలను క్రియలో పెట్టే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయ-నిబంధన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సమగ్రత, రెండు వేర్వేరు న్యాయపదాలు, చివరి దైవనామ ప్రకటన నిలుపబడ్డాయి.
