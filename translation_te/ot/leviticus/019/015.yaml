id: LEV.19.15
reference: Leviticus 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: te
  text: న్యాయవిచారణలో అన్యాయం చేయకూడదు. పేదవాని పట్ల పక్షపాతం చూపకూడదు; గొప్పవాని పట్ల ప్రత్యేక గౌరవం చూపకూడదు. నీ తోటి మనిషికి నీతిగా[a] తీర్పు తీర్చాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయంగా.”
    reason: lexical_alternative
  - marker: b
    text: “పక్షపాతం చూపడం,” “ప్రత్యేక గౌరవం చూపడం” అనే భావాల వెనుక ఉన్న హీబ్రూ నుడికారాలు అక్షరార్థంగా “పేదవాడి ముఖాన్ని ఎత్తడం,” “గొప్పవాడి ముఖాన్ని ఘనపరచడం” అని ఉంటాయి. న్యాయవిచారణలో అభిమానంతో లేదా హోదాకు తలొగ్గి పక్షపాతం చూపడమే వాటి భావం.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: తీర్పు తీర్చేటప్పుడు అన్యాయం
  rationale: న్యాయవిచారణ సందర్భంలో עָוֶל న్యాయాన్ని వక్రీకరించే అన్యాయాన్ని సూచిస్తుంది; בַּמִּשְׁפָּט ఆ చర్య జరిగే న్యాయనిర్ణయ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: תִשָּׂא פְנֵי דָל
  choice: పేదవాడని పక్షపాతం చూపు
  rationale: ముఖాన్ని ఎత్తడం అనే హీబ్రూ నుడికారం అనుకూల పక్షపాతాన్ని సూచిస్తుంది. דָל ఇక్కడ పేద లేదా సామాజికంగా బలహీనుడైన వ్యక్తి.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: గొప్పవాడని ప్రత్యేక గౌరవం చూపు
  rationale: హోదా లేదా ప్రాముఖ్యత కారణంగా ఒకరికి గౌరవప్రదమైన ప్రాధాన్యం ఇచ్చి న్యాయాన్ని ప్రభావితం చేయడాన్ని ఈ నుడికారం నిషేధిస్తుంది. 'గొప్పవాడు' గౌరవస్థానం గల వ్యక్తి అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּצֶדֶק
  choice: నీతిగా
  rationale: צֶדֶק నైతిక నీతి మరియు న్యాయసమ్మతత అనే రెండు పరిమాణాలను కలిగి ఉంది. ప్రధాన పాఠంలో 'నీతిగా' ఉంచి, న్యాయపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: תִּשְׁפֹּט עֲמִיתֶךָ
  choice: నీ తోటి మనిషికి తీర్పు తీర్చాలి
  rationale: שׁפט న్యాయనిర్ణయం చేయడాన్ని సూచిస్తుంది; עָמִית్ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది. 'తోటి మనిషి' భౌగోళిక పొరుగువాడికే అర్థాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: న్యాయ-నైతిక సందర్భంలో צֶדֶק అనువాదం
  choice: నీతిగా
  alternative: న్యాయంగా
  rationale: హీబ్రూ పదంలో నైతిక సదాచారం మరియు న్యాయసమ్మత తీర్పు రెండూ ఇమిడి ఉన్నాయి. ప్రధాన పాఠం నైతిక విస్తృతిని నిలుపుతుండగా, పాదటిప్పణి న్యాయస్థాన సందర్భానికి సరిపోయే ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన శైలి వాడబడింది. ప్రత్యక్ష నిషేధాత్మక ధోరణి నిలుపబడింది; హీబ్రూ ముఖ-నుడికారాల అక్షరరూపం ప్రధాన పాఠాన్ని అసహజం చేయకుండా పాదటిప్పణిలో భద్రపరచబడింది.
