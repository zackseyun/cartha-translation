source:
  edition: WLC
  text: וְ/כִֽי יָג֧וּר אִתְּ/ךָ֛ גֵּ֖ר בְּ/אַרְצְ/כֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/033.yaml
  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: te
  text: మీ దేశంలో ఒక విదేశీయుడు[a] మీ మధ్య నివసిస్తే, మీరు అతనికి అన్యాయం చేయకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విదేశీయుడు’ అని అనువదించిన హీబ్రూ పదం గేర్. ఇది ఇశ్రాయేలీయుల మధ్య నివసించే స్థానికేతర నివాసిని సూచిస్తుంది; దీనిని ‘పరదేశి’ లేదా ‘నివాస పరదేశి’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘అతన్ని అణచివేయకూడదు’ లేదా ‘అతనితో దుర్వ్యవహరించకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: నివసిస్తే
  rationale: ఈ నిర్మాణం నియమంలో ఎదురయ్యే పరిస్థితిని షరతుగా పరిచయం చేస్తుంది; తెలుగులో ‘-తే’ సహజంగా దానిని వ్యక్తం చేస్తుంది.
- source_word: יָגוּר
  choice: నివసిస్తే
  rationale: גור ఇక్కడ తాత్కాలికంగా ప్రయాణించడం కంటే, స్థానికేతర నివాసిగా ఉండడాన్ని సూచిస్తుంది.
- source_word: אִתְּךָ
  choice: మీతో
  rationale: మూలంలోని ‘నీతో’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, తరువాతి బహువచన సముదాయ సంబోధనకు అనుగుణంగా గౌరవ/బహువచన రూపం వాడబడింది.
- source_word: גֵּר
  choice: విదేశీయుడు
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచించే సులభమైన ఆధునిక పదం; అతని నివాసి స్థితిని క్రియ స్పష్టం చేస్తుంది.
- source_word: בְּאַרְצְכֶם
  choice: మీ దేశంలో
  rationale: אֶרֶץ ఇక్కడ సముదాయానికి చెందిన భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా అర్థమవుతుంది, బహువచన ప్రత్యయం ‘మీ’లో ప్రతిఫలిస్తుంది.
- source_word: לֹא תוֹנוּ
  choice: మీరు అతనికి అన్యాయం చేయకూడదు
  rationale: Hiphil ינה తప్పుచేయడం, అణచివేయడం లేదా దుర్వ్యవహరించడం అనే విస్తృత భావాన్ని కలిగి ఉంది; ‘అన్యాయం చేయడం’ ఆ నైతిక-న్యాయ పరిధిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: אֹתוֹ
  choice: అతనికి
  rationale: పుంలింగ ఏకవచన సర్వనామం గేర్‌ను తిరిగి సూచిస్తుంది; తెలుగు క్రియాప్రయోగానికి అనుగుణంగా దత్తివిభక్తి రూపం సహజంగా ఉంది.
theological_decisions:
- issue: పరిశుద్ధతా ధర్మశాస్త్రంలో גֵּר పదం
  choice: విదేశీయుడు
  alternative: పరదేశి; వలస నివాసి
  rationale: ఈ పదం కేవలం దారినపోయే అపరిచితుణ్ణి కాక, ఇశ్రాయేలు దేశంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘విదేశీయుడు’ ఆధునికంగా స్పష్టంగా ఉండగా, నివాస భావాన్ని ‘నివసిస్తే’ తెలియజేస్తుంది.
- issue: ינה క్రియ యొక్క నైతిక-న్యాయ విస్తృతి
  choice: అన్యాయం చేయకూడదు
  alternative: అణచివేయకూడదు; బాధించకూడదు
  rationale: మూలక్రియ సాధారణంగా తప్పుచేయడం నుంచి బలవంతంగా అణచివేయడం వరకు భావించవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన పదాన్ని ఉంచి, బలమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవాక్య శైలి వాడబడింది. ‘పరదేశి’ కంటే ‘విదేశీయుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడింది; మూలంలోని ఏకవచన/బహువచన మార్పును తెలుగులో సహజమైన ‘మీ/మీరు’ సముదాయ సంబోధనతో వ్యక్తం చేశాం.
