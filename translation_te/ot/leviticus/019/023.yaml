id: LEV.19.23
reference: Leviticus 19:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: te
  text: మీరు ఆ దేశంలోకి వచ్చి, తినదగిన ఫలాలిచ్చే ఏ చెట్టునైనా నాటినప్పుడు, దాని పండ్లను సున్నతిలేనివిగా[a] పరిగణించాలి. మూడు సంవత్సరాలు అవి మీకు సున్నతిలేనివిగా ఉండాలి; వాటిని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సున్నతిలేనివి.’ ఇక్కడ ఈ పదం రూపకంగా వాడబడింది; మొదటి మూడు సంవత్సరాల్లో ఆ పండ్లను తినడానికి అనుమతి లేదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי תָבֹאוּ אֶל הָאָרֶץ
  choice: మీరు ఆ దేశంలోకి వచ్చి… నాటినప్పుడు
  rationale: న్యాయబోధ సందర్భంలో וְכִי భవిష్యత్ పరిస్థితిని సూచిస్తుంది. אֶל הָאָרֶץ లోని నిర్దిష్టతను ‘ఆ దేశం’గా నిలిపి, మూలంలో లేని ‘కనాను’ను చేర్చలేదు.
- source_word: וּנְטַעְתֶּם כָּל עֵץ מַאֲכָל
  choice: ఆహారం కోసం ఏదైనా చెట్టును నాటినప్పుడు
  rationale: ఈ పదబంధం తినదగిన ఫలాన్నిచ్చే ఏ చెట్టునైనా సూచిస్తుంది; తెలుగు వాడుకలో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת פִּרְיוֹ
  choice: దాని పండును సున్నతి పొందనిదిగా పరిగణించాలి
  rationale: ערל/ערלה రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, క్రియలోని చట్టపరమైన ‘అలా ఎంచాలి/పరిగణించాలి’ అనే భావాన్ని తెలిపింది.
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: మూడు సంవత్సరాలపాటు అది మీకు నిషిద్ధంగా ఉంటుంది
  rationale: ఫలంపై ఇశ్రాయేలీయులకు వర్తించే ఆహార నిషేధాన్ని సహజమైన తెలుగులో తెలిపింది. మొదటి వాక్యంలో రూపకాన్ని నిలిపినందున ఇక్కడ దాని ఆచరణాత్మక భావాన్ని స్పష్టం చేసింది.
- source_word: לֹא יֵאָכֵל
  choice: దాన్ని తినకూడదు
  rationale: హీబ్రూ నిఫాల్ నిషేధార్థక నిష్క్రియ నిర్మాణాన్ని తెలుగులో సహజమైన సాధారణ నిషేధంగా అందించింది.
theological_decisions:
- issue: పండుకు వాడిన ערל/ערלה రూపకాన్ని నిలపాలా, లేక పూర్తిగా ‘నిషిద్ధం’ అని అనువదించాలా
  choice: మొదటి ప్రస్తావనలో ‘సున్నతి పొందనిది’ అనే రూపకాన్ని నిలిపి, తరువాత దాని నిషేధ స్థితిని స్పష్టం చేయడం
  alternative: రెండు చోట్లా ‘నిషిద్ధం’ అని మాత్రమే అనువదించడం
  rationale: మూల హీబ్రూలోని ఒడంబడిక/ఆచార సంబంధ రూపకాన్ని చెరపకుండా ఉంచుతూ, పండు నిజంగా శారీరక సున్నతికి లోనవుతుందనే అపార్థాన్ని పాదసూచిక ద్వారా నివారిస్తుంది. తరువాతి వాక్యంలో ఆ రూపకపు చట్టపరమైన ఫలితాన్ని సహజంగా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయబోధ శైలి. హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించింది.
