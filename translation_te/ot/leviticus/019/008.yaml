id: LEV.19.8
reference: Leviticus 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: te
  text: దానిని తినేవాడు తన దోషాన్ని భరించాలి[a], ఎందుకంటే అతడు యాహ్వేకు ప్రతిష్ఠితమైన పవిత్రమైన దానిని అపవిత్రపరిచాడు[b]. ఆ వ్యక్తి తన ప్రజలలోనుండి కొట్టివేయబడాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన అపరాధ బాధ్యతను మోయాలి.’ హెబ్రీయ ఇడియమ్ దోషాన్ని, దాని పరిణామాలను భరించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘యాహ్వేకు ప్రతిష్ఠితమైన పవిత్రమైనది’ అంటే యాహ్వేకు అంకితం చేయబడినది; ఇక్కడ సందర్భానుసారం అది బలి మాంసం.
    reason: cultural_note
  - marker: c
    text: ‘కొట్టివేయబడాలి’ అనేది నిబంధన సంబంధమైన శిక్షా సూత్రం. ఇక్కడ అది మరణమా, సమాజం నుండి బహిష్కరణా, లేక దేవుని ప్రత్యక్ష తీర్పా అనేది పాఠ్యం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: దానిని తినేవాడు
  rationale: ముందటి వచనంలో పేర్కొన్న బలి మాంసాన్ని నిషిద్ధ సమయంలో తినే ఏ వ్యక్తినైనా సూచించే సాధారణ ఏకవచన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: తన దోషాన్ని భరించాలి
  rationale: ఈ హెబ్రీయ ఇడియమ్ అపరాధ బాధ్యతను, దాని పరిణామాలను మోయడాన్ని సూచించగలదు. ‘దోషాన్ని భరించాలి’ అనే రూపం ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విధించబడిన శిక్షకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: קֹדֶשׁ יְהוָה
  choice: యెహోవాకు ప్రతిష్ఠితమైనది
  rationale: హెబ్రీయ పదబంధం యెహోవాకు ప్రత్యేకంగా అంకితం చేయబడిన పవిత్రమైన దానిని సూచిస్తుంది. సందర్భంలో అది బలి మాంసమైనప్పటికీ, మూల వాక్యంలో లేని ‘అర్పణ’ అనే నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: חִלֵּל
  choice: అపవిత్రపరిచాడు
  rationale: పవిత్రమైనదాన్ని సామాన్యమైనదిగా లేదా అపవిత్రమైనదిగా చూడటం అనే పియేల్ క్రియ భావాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנִכְרְתָה
  choice: తొలగించబడాలి
  rationale: నిబంధన సంబంధమైన శిక్షా సూత్రాన్ని దాని విధానం—మరణం, సమాజ బహిష్కరణ, లేదా దేవుని ప్రత్యక్ష తీర్పు—ఏదో నిర్ణయించకుండా నిలుపుతుంది.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి
  rationale: నֶפֶשׁ అక్షరార్థంగా ‘ప్రాణం/ఆత్మ’ అయినప్పటికీ, ఈ న్యాయ సందర్భంలో సంపూర్ణ వ్యక్తిని సూచిస్తుంది.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజలలో నుండి
  rationale: వ్యాకరణపరమైన స్త్రీలింగ ప్రత్యయాన్ని అనుసరించకుండా, దోషిగా ఉన్న సాధారణ వ్యక్తిని సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: ‘తొలగించబడాలి’ అనే నిబంధన సంబంధమైన శిక్షా సూత్రం అర్థం
  choice: శిక్ష అమలయ్యే విధానాన్ని పేర్కొనకుండా ‘తన ప్రజలలో నుండి తొలగించబడాలి’ అని నిలుపడం.
  alternative: ‘చంపబడాలి,’ ‘సమాజం నుండి బహిష్కరించబడాలి,’ లేదా ‘దేవుని తీర్పుచేత నిర్మూలించబడాలి.’
  rationale: ఈ వచనంలోని హెబ్రీయ సూత్రం శిక్ష యొక్క ఖచ్చితమైన విధానాన్ని స్పష్టం చేయదు. ఒక వివాదాస్పద వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచకుండా మూలంలోని ధార్మిక, న్యాయపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయపరమైన, ఆరాధనా సంబంధమైన గాంభీర్యాన్ని నిలిపే శైలి. ‘ప్రతిష్ఠితమైనది,’ ‘అపవిత్రపరిచాడు,’ ‘తొలగించబడాలి’ వంటి పదాలు మూలంలోని పవిత్రత మరియు నిబంధన-శిక్ష భావాలను అతిగా వ్యాఖ్యానించకుండా అందిస్తాయి.
