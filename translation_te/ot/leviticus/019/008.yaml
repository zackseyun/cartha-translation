revisions:
- from: దానిని తినేవాడు తన దోషాన్ని భరించాలి[a]. ఎందుకంటే అతడు యెహోవాకు ప్రతిష్ఠితమైనదాన్ని అపవిత్రపరిచాడు[b]. ఆ వ్యక్తి తన ప్రజలలో నుండి తొలగించబడాలి[c].
  to: దానిని తినేవాడు తన దోషాన్ని భరించాలి[a], ఎందుకంటే అతడు యాహ్వేకు ప్రతిష్ఠితమైన పవిత్రమైన దానిని అపవిత్రపరిచాడు[b]. ఆ వ్యక్తి తన ప్రజలలోనుండి కొట్టివేయబడాలి[c].
  rationale: The revision retains the source’s generic offender, liability idiom, consecrated object, and unexplained covenantal penalty. It strengthens the formal correspondence of the ‘cut off’ formula while preserving its ambiguity in a footnote, and aligns the rendering of יהוה with the POB’s Yahweh convention.
