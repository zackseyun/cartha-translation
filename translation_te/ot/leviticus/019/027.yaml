source:
  edition: WLC
  text: לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁ/כֶ֑ם וְ/לֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: te
  text: మీ తలల అంచుల వెంట్రుకలను[a] గుండ్రంగా కత్తిరించకూడదు; మీ గడ్డం అంచును[b] వికృతపరచకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ తలల పక్కలు” లేదా “మీ తలల మూలలు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం అంచు, పక్క, లేదా మూలను సూచిస్తుంది. ఈ ఆజ్ఞ తల పక్కల వెంట్రుకలను గుండ్రంగా కత్తిరించడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_and_cultural_note
  - marker: b
    text: “పాడుచేయకూడదు,” “చెడగొట్టకూడదు,” లేదా “నాశనం చేయకూడదు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ గడ్డం అంచును దెబ్బతీయడం లేదా వికృతపరచడం అనే విస్తృత భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: గుండ్రంగా కత్తిరించకూడదు
  rationale: נקף ధాతువు హిఫీల్ రూపం ఇక్కడ తల అంచుల వెంట్రుకలను గుండ్రని ఆకారంలో కత్తిరించడాన్ని సూచిస్తుంది. ఈ అనువాదం చర్యను స్పష్టంగా చెబుతూ, కేవలం ‘గీయడం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: פְּאַת רֹאשְׁכֶם
  choice: మీ తలల పక్కల వెంట్రుకలు
  rationale: פֵּאָה అంటే అంచు, పక్క లేదా మూల. సందర్భానుసారంగా ఇది తల పక్కల వెంట్రుకలను సూచిస్తుంది; రֹאשְׁכֶם లోని బహువచన రూపాన్ని ‘మీ తలల’గా నిలిపాం.
- source_word: תַשְׁחִית
  choice: పాడుచేయకూడదు
  rationale: שׁחת హిఫీల్ రూపానికి నాశనం చేయడం, చెడగొట్టడం, పాడుచేయడం అనే భావాలున్నాయి. గడ్డం అలంకరణ సందర్భంలో ‘పాడుచేయడం’ మూలపద బలాన్ని నిలుపుతూ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: פְּאַת זְקָנֶךָ
  choice: మీ గడ్డం అంచు
  rationale: פֵּאָה యొక్క ‘అంచు/చివర’ భావాన్ని, זָקָן యొక్క సాధారణ అర్థమైన ‘గడ్డం’ను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לֹא ... וְלֹא
  choice: చేయకూడదు ... చేయకూడదు
  rationale: తెలుగులో న్యాయసంబంధ నిషేధ ఆజ్ఞకు సహజమైన, గంభీరమైన రూపం; రెండు నిషేధాల సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిషేధ స్వభావం
  choice: తల వెంట్రుకలు, గడ్డం కత్తిరించే నిర్దిష్ట పద్ధతులపై ప్రత్యక్ష నిషేధంగా అనువదించడం
  alternative: ఇది అన్యమత శోకాచారానికే సంబంధించిన నిషేధమని లేదా పొరుగు జనాల అలంకరణ పద్ధతులన్నిటినీ నిషేధిస్తుందని ప్రధాన వాక్యంలో వివరించడం
  rationale: హీబ్రూ వాక్యం నిషేధిత చర్యలను మాత్రమే పేర్కొంటుంది; వాటి ఉద్దేశాన్ని ఈ వచనంలో వెల్లడించదు. అందువల్ల వ్యాఖ్యానాత్మక కారణాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయాజ్ఞ శైలి. ‘మీ తలల’ అనే బహువచనం హీబ్రూ రూపాన్ని నిలుపుతుంది; రెండో భాగంలోని ఏకవచన సంబోధనను తెలుగులో గౌరవ/సామూహిక ‘మీ’తో సహజంగా వ్యక్తం చేశాం. మూలంలో లేని ఆచారపరమైన కారణాన్ని పాఠ్యంలో చేర్చలేదు.
