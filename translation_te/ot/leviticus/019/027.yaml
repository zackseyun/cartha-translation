  source_fidelity: మొదటి నిషేధం తల యొక్క పֵאָה (‘అంచు/పక్క’)ను గుండ్రంగా కత్తిరించడాన్ని, రెండవది గడ్డం యొక్క పֵאָהను శחת (‘పాడుచేయడం/వికృతపరచడం’) చేయడాన్ని సూచిస్తుంది. ముసాయిదా ఈ రెండు చర్యలను మొత్తంగా సరిగ్గానే అందిస్తుంది. అయితే ఒకే పాదటిప్పణి రెండవ ఉపవాక్యానికే జతచేయబడినా, అది రెండు ఉపవాక్యాల పదార్థాలను వివరిస్తోంది; సంబంధిత చోట్ల విడివిడిగా సూచికలు అవసరం.
  naturalness: ‘మీ తలల పక్కల వెంట్రుకలు’ అర్థవంతమే, కానీ ‘మీ తలల అంచుల వెంట్రుకలు’ మూలంలోని ‘అంచు’ భావాన్ని మరింత నేరుగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఇస్తుంది. గడ్డం సందర్భంలో ‘వికృతపరచకూడదు’ అనేది ‘mar/disfigure’కు స్పష్టమైన, విధానాన్ని అతిగా నిర్దిష్టపరచని రూపం.
