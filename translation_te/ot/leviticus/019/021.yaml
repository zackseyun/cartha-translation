id: LEV.19.21
reference: Leviticus 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: te
  text: అతడు తన అపరాధ పరిహార బలిని యాహ్వేకు[a], సమావేశ గుడారం ప్రవేశద్వారం వద్దకు తీసుకురావాలి—అపరాధ పరిహార బలిగా ఒక పొట్టేలును.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పరిహార బలిని.” హీబ్రూ אָשָׁם పదం అపరాధాన్ని, దానికి పరిహారంగా అర్పించే బలిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయనియమ సందర్భంలో ఈ క్రియ ఆదేశాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘తీసుకురావాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲשָׁמוֹ
  choice: తన అపరాధ పరిహార బలిని
  rationale: אָשָׁם అపరాధాన్నీ, దానికి పరిహారంగా అర్పించే బలినీ సూచించగలదు. ఇక్కడ బలి సందర్భం కావడంతో ‘అపరాధ పరిహార బలి’ రెండు భావాల సంబంధాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా దగ్గరకు
  rationale: ל దిశను లేదా సమర్పణను సూచిస్తుంది. ‘దగ్గరకు’ బలిని యెహోవా సన్నిధికి తీసుకురావడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל־פֶּתַח
  choice: ప్రవేశద్వారం వద్దకు
  rationale: פֶּתַח ప్రవేశస్థలాన్ని సూచిస్తుంది; గుడారపు సందర్భంలో ‘ప్రవేశద్వారం’ స్పష్టమైన ఆధునిక పదం.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇది దేవుడు తన ప్రజలను కలుసుకునే పరిశుద్ధ గుడారానికి స్థిరమైన తెలుగు బైబిలు పదబంధం; సాధారణ పాఠకులకు కూడా పరిచితమైనది.
- source_word: אֵיל
  choice: ఒక పొట్టేలు
  rationale: אֵיל ప్రత్యేకంగా మగ గొర్రెను సూచిస్తుంది; ‘పొట్టేలు’ ఖచ్చితమైన, సహజమైన తెలుగు పదం.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార బలిగా
  rationale: చివరి పదబంధం పొట్టేలు ఏ విధమైన బలిగా ఉండాలో నిర్దేశిస్తుంది; ‘అపరాధ పరిహార బలిగా’ ఆ ఆచారపరమైన వర్గాన్ని, పరిహార భావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపంగా ‘యెహోవా’ను వాడి, ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో ఇచ్చాం.
- issue: אָשָׁם లోని అపరాధం–పరిహారం అర్థవిస్తృతి
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి
  rationale: ఈ పదం అపరాధాన్ని మాత్రమే కాక దానికి పరిహారంగా సమర్పించే బలినీ సూచిస్తుంది. సంయుక్త రూపం ఆ ధార్మిక ఉద్రిక్తతను అతిగా సరళీకరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నియమవాక్యానికి తగిన గంభీరమైన కాని సులభమైన శైలిని ఉపయోగించాం. ‘అపరాధ పరిహార బలి’ అనే పదబంధం మూలంలోని אָשָׁם పదానికి ఉన్న అపరాధం మరియు పరిహార అర్పణ అనే రెండు అనుసంధాన భావాలను కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
