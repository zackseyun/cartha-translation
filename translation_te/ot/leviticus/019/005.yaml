id: LEV.19.5
reference: Leviticus 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: te
  text: మీరు యాహ్వేకు సమాధాన బలి అర్పించినప్పుడు, అంగీకరించబడేలా దానిని అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మీ అంగీకారం కొరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: మీరు ... అర్పించినప్పుడు
  rationale: న్యాయవిధుల సందర్భంలో כִּי షరతు లేదా కాలసూచక భావాన్ని ఇవ్వగలదు. ఇక్కడ సహజమైన ఆధునిక తెలుగులో సందర్భానుకూల ఆజ్ఞను తెలియజేయడానికి ‘అర్పించినప్పుడు’ ఎంచుకున్నాం.
- source_word: תִזְבְּחוּ / תִּזְבָּחֻהוּ
  choice: అర్పించినప్పుడు / దానిని అర్పించాలి
  rationale: זבח బలిగా వధించి అర్పించడాన్ని సూచిస్తుంది. తెలుగులో ‘బలి అర్పించు’ సహజమైన ఆరాధనా ప్రయోగం; రెండవ క్రియను కూడా ఉంచడం ద్వారా హెబ్రీ పునరుక్తి, ఆజ్ఞాబలం నిలిచాయి.
- source_word: זֶבַח שְׁלָמִים
  choice: సమాధాన బలి
  rationale: ఇది నిర్దిష్ట బలి రకానికి వాడే సాంప్రదాయ పదబంధం. ‘సమాధాన బలి’ హెబ్రీ పదానికి పారదర్శకంగా ఉండి, ‘సహవాస బలి’ అనే మరింత వ్యాఖ్యానాత్మక అర్థాన్ని రుద్దదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ అర్పణ యొక్క దిశ లేదా అంకితాన్ని సూచిస్తుంది. יהוה అనే నిబంధన నామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לִרְצֹנְכֶם
  choice: మీరు అంగీకరించబడేలా
  rationale: బలుల సందర్భంలో רָצוֹן దైవిక అంగీకారం లేదా ఆమోదయోగ్యతను సూచిస్తుంది. ఈ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపేలా అనువదించాం; మూలంలోని నామవాచక నిర్మాణాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: לִרְצֹנְכֶם యొక్క బలిసంబంధ భావం
  choice: మీరు అంగీకరించబడేలా
  alternative: మీ అంగీకారం కొరకు
  rationale: ఈ పదబంధం అర్పించేవారి ఇష్టప్రకారం అనే భావం కంటే దేవుని సమక్షంలో అంగీకారం పొందడాన్ని సూచిస్తుంది. అయితే అంగీకారం వ్యక్తికా లేక బలికా అనే వ్యాకరణ సంబంధాన్ని అతిగా నిర్ధారించకుండా, మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధార్మిక శైలి. ‘అర్పించు’ అనే సహజ క్రియను వాడుతూ మూలంలోని పునరుక్తిని నిలిపాం.
