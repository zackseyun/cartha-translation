review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the three prohibitions and the requirement not to retain a hired worker’s wages until morning. However, “బలవంతంగా” adds an explicit element of force that is not required by גָּזַל, which can denote wrongful seizure more broadly. The second prohibition also has the neighbor as its direct object in Hebrew.
  naturalness: The first sentence is clear, but “కూలికి పెట్టుకున్న పనివాని కూలి” is repetitive and less idiomatic than “కూలికి నియమించుకున్నవాని వేతనం.” The revised wording is natural modern standard Telugu while retaining the legal-command register.
  terminology: “అణచివేయకూడదు” suitably represents the broad ethical force of עשק. “దోచుకోకూడదు” expresses wrongful taking without adding force. “వేతనం” is an appropriate general term for the wages of a hired worker; “కూలికి నియమించుకున్నవాడు” preserves the employment sense of שכיר.
  issues:
  - severity: medium
    issue: “బలవంతంగా” is added to the rendering of תִגְזֹל.
    rationale: Although robbery may involve force in some contexts, גָּזַל does not itself require an explicit assertion of force here. The addition narrows the prohibition beyond the Hebrew wording.
  - severity: low
    issue: The hired-worker phrase is stylistically repetitive.
    rationale: “కూలికి పెట్టుకున్న పనివాని కూలి” repeats the same wage concept and is less smooth in modern Telugu. A wording with “నియమించుకున్నవాని వేతనం” is clearer.
  revised_text: నీ పొరుగువానిని అణచివేయకూడదు, దోచుకోకూడదు. కూలికి నియమించుకున్నవాని వేతనం ఉదయం వరకు నీ దగ్గర ఉండకూడదు.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported specification of force, retains the shared object implied by the Hebrew parallel prohibitions, and improves the naturalness of the wage clause without changing its meaning or temporal limit.
