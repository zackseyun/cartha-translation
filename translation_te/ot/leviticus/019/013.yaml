  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో అనువదించబడింది. మూలంలోని మూడు నిషేధాల నిర్మాణం నిలుపబడింది.
