id: LEV.19.13
reference: Leviticus 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תַעֲשֹׁ֥ק אֶת רֵֽעֲ/ךָ֖ וְ/לֹ֣א תִגְזֹ֑ל לֹֽא תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּ/ךָ֖ עַד בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: te
  text: నీ పొరుగువానిని అణచివేయకూడదు, దోచుకోకూడదు. కూలికి నియమించుకున్నవాని వేతనం ఉదయం వరకు నీ దగ్గర ఉండకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: అణచివేయకూడదు
  rationale: עָשַׁק అనేది అధికారాన్ని దుర్వినియోగం చేసి ఇతరునికి దక్కవలసినదాన్ని దక్కనివ్వకపోవడం సహా విస్తృతమైన పీడనను సూచిస్తుంది; ‘అణచివేయు’ ఆ నైతిక విస్తృతిని నిలుపుతుంది.
- source_word: רֵעֲךָ
  choice: నీ పొరుగువాణ్ణి
  rationale: ధర్మశాస్త్రపు సామాజిక సందర్భంలో רֵעַ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది; ‘పొరుగువాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సామాజిక భావాన్ని కాపాడుతుంది.
- source_word: תִגְזֹל
  choice: అతని సొమ్మును బలవంతంగా లాక్కోకూడదు
  rationale: גָּזַל బలప్రయోగంతో లేదా అన్యాయంగా ఇతరునిదాన్ని స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది; ఈ పదబంధం సాధారణ దొంగతనం కంటే దాని బలమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: תָלִין
  choice: ఉదయం వరకు ... ఉంచుకోకూడదు
  rationale: ఈ క్రియ స్త్రీలింగమైన ‘కూలి’తో ఏకీభవించి, అది రాత్రంతా యజమాని దగ్గర నిలిచి ఉండకూడదని చెబుతుంది; తెలుగులో కర్తను ఉద్దేశించి చెప్పే ఈ నిర్మాణం సహజంగా ఉంది.
- source_word: פְּעֻלַּת
  choice: కూలి
  rationale: ఈ సందర్భంలో פְּעֻלָּה పని ఫలితంగా చెల్లించవలసిన ప్రతిఫలాన్ని సూచిస్తుంది; ‘కూలి’ స్పష్టమైన, సామాన్యులకు సులభమైన తెలుగు పదం.
- source_word: שָׂכִיר
  choice: కూలికి పెట్టుకున్న పనివాని
  rationale: שָׂכִיר వేతనానికి నియమించుకున్న వ్యక్తిని సూచిస్తుంది; ఈ పదబంధం ఉద్యోగ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אִתְּךָ
  choice: నీ దగ్గర
  rationale: చెల్లించవలసిన కూలి యజమాని అధీనంలో ఉండడాన్ని ఈ సందర్భంలో ‘నీ దగ్గర’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: మూలంలోని నిర్దిష్ట కాలపరిమితిని వ్యాఖ్యానించకుండా నేరుగా నిలుపుతుంది.
