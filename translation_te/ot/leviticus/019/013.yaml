revisions:
- from: నీ పొరుగువాణ్ణి అణచివేయకూడదు; అతని సొమ్మును బలవంతంగా లాక్కోకూడదు. కూలికి పెట్టుకున్న పనివాని కూలి ఉదయం వరకు నీ దగ్గర ఉంచుకోకూడదు.
  to: నీ పొరుగువానిని అణచివేయకూడదు, దోచుకోకూడదు. కూలికి నియమించుకున్నవాని వేతనం ఉదయం వరకు నీ దగ్గర ఉండకూడదు.
  rationale: The revision removes the unsupported specification of force, retains the shared object implied by the Hebrew parallel prohibitions, and improves the naturalness of the wage clause without changing its meaning or temporal limit.
