id: LEV.19.31
reference: Leviticus 19:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: te
  text: ఆత్మలతో సంప్రదింపులు జరిపే వారివైపు గానీ, ఆత్మవిద్యలు తెలిసినవారివైపు గానీ తిరగవద్దు;[a] వారి వలన అపవిత్రులు కావడానికి వారిని వెదకవద్దు. నేను యెహోవాను, మీ దేవుణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ఈ రెండు పదాలను ‘మృతాత్మలను పిలిచేవారు,’ ‘పరిచిత ఆత్మలు కలిగినవారు,’ లేదా ‘మాంత్రికులు’ అని కూడా అనువదిస్తారు. ఇవి ఆత్మలను లేదా మృతులను సంప్రదించడంతో సంబంధం ఉన్న నిషిద్ధ వ్యక్తులను సూచిస్తాయి; కొన్ని సందర్భాల్లో వాటితో సంబంధమైన ఆత్మసత్త్వాల భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: వైపు తిరగవద్దు
  rationale: పנה అనే క్రియకు ఉన్న ‘తిరుగు/వైపు మళ్ళు’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, నిషిద్ధ వ్యక్తుల సహాయం కోరడాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: הָאֹבֹת
  choice: చనిపోయినవారి ఆత్మలను సంప్రదించే మాధ్యమాలు
  rationale: ఈ ధర్మశాస్త్ర సందర్భంలో אוֹב చనిపోయినవారి ఆత్మలతో సంప్రదింపుకు సంబంధించిన వ్యక్తిని లేదా మాధ్యమాన్ని సూచించవచ్చు. కేవలం లిప్యంతరీకరణకంటే ఈ వివరణ ఆధునిక పాఠకులకు అర్థవంతంగా ఉంటుంది.
- source_word: הַיִּדְּעֹנִים
  choice: ఆత్మలతో సంబంధం పెట్టుకునేవారు
  rationale: יִדְּעֹנִי నిషిద్ధమైన ఆత్మసంబంధ జ్ఞానం లేదా సంప్రదింపుతో ముడిపడిన వ్యక్తిని సూచిస్తుంది. ‘మాంత్రికులు’ అని అనువదిస్తే ఆధునిక కల్పితార్థం రావచ్చు; ఈ ఎంపిక మూలపదపు పరిధిని విస్తృతంగా ఉంచుతుంది.
- source_word: תְּבַקְשׁוּ
  choice: వారిని వెదకవద్దు
  rationale: בקש యొక్క సాధారణ అర్థమైన ‘వెదకు/కోరు’ను నేరుగా నిలుపుతుంది; సంప్రదించడం ఉద్దేశంలో ఉన్నప్పటికీ దాన్ని మూలంలో లేనంత స్పష్టంగా చేర్చదు.
- source_word: לְטָמְאָה בָהֶם
  choice: వారి ద్వారా అపవిత్రులు కావడానికి
  rationale: టמא యొక్క అపవిత్రత భావాన్ని, అలాగే בָהֶם ద్వారా కలిగే ఫలితం లేదా ఉద్దేశాన్ని నిలుపుతుంది. ఆ అపవిత్రతను కేవలం ఆచారపరమైనదిగా లేదా కేవలం నైతికమైనదిగా పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రెండవ పురుష బహువచనంలోని నిబంధన సంబంధాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ నిషేధంలో అపవిత్రత స్వభావం
  choice: ‘అపవిత్రులు కావడానికి’ అని మాత్రమే అనువదించి, దాన్ని ఆచారపరమైనది లేదా నైతికమైనది అని ప్రత్యేకంగా నిర్ధారించలేదు.
  alternative: ‘ఆచారపరంగా అపవిత్రులు కావడానికి’ లేదా ‘నైతికంగా కలుషితులు కావడానికి’
  rationale: లేవీయకాండంలో טמא ఆచారపరమైన, నైతిక పరిమాణాలు రెండింటితో సంబంధం కలిగి ఉండగలదు. మూలంలోని విస్తృతతను, theological tensionను అనువాదం నిలుపుతుంది.
- issue: אוֹב మరియు יִדְּעֹנִי సూచించే ఖచ్చితమైన వ్యక్తులు లేదా ఆత్మలు
  choice: ప్రధాన పాఠ్యంలో నిషిద్ధ ఆత్మసంప్రదింపు చేసే వ్యక్తులుగా అనువదించి, పదాల ఖచ్చిత పరిధిపై ఉన్న అనిశ్చితిని పాదసూచికలో తెలిపింది.
  alternative: ‘మృతాత్మలు’ మరియు ‘తెలిసిన ఆత్మలు’ వంటి ఆత్మసత్త్వాలుగా నేరుగా అనువదించడం
  rationale: ఈ పదాలు కొన్ని సందర్భాల్లో ఆత్మలను, మరికొన్ని సందర్భాల్లో వాటిని సంప్రదించే అభ్యాసకులను సూచించవచ్చు. సమాంతర నిర్మాణం మరియు ‘వారిని వెదకడం’ ఇక్కడ వ్యక్తుల భావానికి అనుకూలమైనప్పటికీ, ప్రత్యామ్నాయాన్ని పూర్తిగా మూసివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మాధ్యమాలు’ అనే పదానికి వెంటనే వివరణ ఇచ్చి అస్పష్టత తగ్గించాం; రెండు హీబ్రూ పదాల మధ్య ఉన్న భేదాన్ని పూర్తిగా చెరపకుండా సమాంతర వాక్య నిర్మాణాన్ని నిలిపాం.
