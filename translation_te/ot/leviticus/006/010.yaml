source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: te
  text: దాన్ని పులియబెట్టి కాల్చకూడదు. నా అగ్ని అర్పణల్లోనుంచి దాన్ని వారికి భాగంగా ఇచ్చాను[a]. పాప బలిలాగే, అపరాధ బలిలాగే[b] అది అతి పరిశుద్ధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఆహార అర్పణల్లోనుంచి.”
    reason: lexical_alternative
  - marker: b
    text: “అపరాధ బలి”ని “నష్టపరిహార బలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה חָמֵץ
  choice: పులియబెట్టి కాల్చకూడదు
  rationale: నిఫాల్ క్రియలోని కర్మణి భావాన్ని తెలుగులో సహజమైన విధి-నిషేధ రూపంతో తెలిపింది; חָמֵץ దాన్ని పులియబెట్టడాన్ని సూచిస్తుంది.
- source_word: חֶלְקָם
  choice: వారికి భాగంగా
  rationale: యాజకులకు కేటాయించబడిన వాటాను సూచించే חלק భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָתַתִּי אֹתָהּ
  choice: దాన్ని ... ఇచ్చాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియలోని స్థిరంగా చేసిన అనుగ్రహాన్ని భూతకాల రూపంలో నేరుగా నిలుపుతుంది.
- source_word: מֵאִשָּׁי
  choice: నా అగ్ని అర్పణల్లోనుంచి
  rationale: אִשֶּׁה అనే బలిసంబంధ సాంకేతిక పదంలోని అగ్ని ద్వారా అర్పించే భావాన్ని స్పష్టంగా ఉంచుతుంది; ‘నా’ అనే ప్రత్యయార్థాన్నీ నిలుపుతుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హీబ్రూ అత్యుత్తమతా నిర్మాణాన్ని స్థలాన్ని సూచించే ‘పరిశుద్ధాతిపరిశుద్ధ స్థలం’తో కలపకుండా, బలి యొక్క అత్యున్నత పరిశుద్ధ స్థితిగా తెలుపుతుంది.
- source_word: כַּחַטָּאת
  choice: పాప బలిలాగే
  rationale: כ ఉపసర్గలోని పోలిక లేదా ఒకే వర్గానికి చెందిన స్థితిని నిలుపుతూ חַטָּאת‌ను బలిసంబంధ సాంకేతిక పదంగా అనువదిస్తుంది.
- source_word: וְכָאָשָׁם
  choice: అపరాధ బలిలాగే
  rationale: אָשָׁם‌ను దోషం లేదా అపరాధంతో సంబంధమున్న ప్రత్యేక బలి వర్గంగా, అదనపు సిద్ధాంత వివరణ లేకుండా తెలుపుతుంది.
theological_decisions:
- issue: אָשָׁם అనే బలిసంబంధ పదం
  choice: అపరాధ బలి
  alternative: నష్టపరిహార బలి
  rationale: ‘అపరాధ బలి’ మూలపదంలోని దోషం/అపరాధ భావాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమవుతుంది. ‘నష్టపరిహార బలి’ ఆ బలిలోని పరిహార కోణాన్ని ముందుకు తెచ్చే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: אִשֶּׁה అనే బలిసంబంధ పదం
  choice: అగ్ని అర్పణలు
  alternative: ఆహార అర్పణలు
  rationale: ఈ సాంకేతిక పదానికి అగ్నిలో అర్పించేది, దేవునికి ఆహార కానుకగా సమర్పించేది అనే రెండు వివరణాత్మక దిశలు ఉన్నాయి. ప్రధాన పాఠం సంప్రదాయంగా స్పష్టమైన అగ్ని భావాన్ని ఉంచుతుంది; మరో సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో కూడిన సహజ వాక్యనిర్మాణం వాడబడింది. బలులకు సంబంధించిన సాంకేతిక పదాలు సంక్షిప్తంగా, సిద్ధాంతపరమైన అదనపు వివరణ లేకుండా ఉంచబడ్డాయి; పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలోనే ఉన్నాయి.
