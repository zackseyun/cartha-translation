source:
  edition: WLC
  text: וּ/פָשַׁט֙ אֶת בְּגָדָ֔י/ו וְ/לָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְ/הוֹצִ֤יא אֶת הַ/דֶּ֨שֶׁן֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה אֶל מָק֖וֹם טָהֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: te
  text: తర్వాత అతడు తన వస్త్రాలను తీసివేసి, వేరే వస్త్రాలు ధరించి, బూడిదను శిబిరం వెలుపల శుద్ధమైన స్థలానికి తీసుకెళ్లాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “శుద్ధమైన” అనేది లేవీయ ధర్మశాస్త్రంలోని ఆచారపరమైన శుద్ధతను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: తర్వాత ... తీసివేసి
  rationale: వస్త్రాల సందర్భంలో פשט అంటే ధరించిన వాటిని తీసివేయడం. ఆచారక్రమంలోని వరుస చర్యను తెలుగులో సహజంగా చూపేందుకు వావ్‌ను ‘తర్వాత’గా వ్యక్తం చేశాం.
- source_word: בְּגָדָיו
  choice: తన వస్త్రాలను
  rationale: בגדకు ‘వస్త్రాలు’ అనే పదం యాజక ఆచార సందర్భానికి తగిన గౌరవప్రదమైన, సహజమైన తెలుగు.
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: వేరే వస్త్రాలు ధరించి
  rationale: לבש అంటే వస్త్రాలు ధరించడం; אחרים మొదటి వస్త్రాలకు భిన్నమైన వస్త్రాలను సూచిస్తుంది. మూలంలో ‘శుభ్రమైనవి’ అని లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וְהוֹצִיא אֶת־הַדֶּשֶׁן
  choice: బూడిదను ... తీసుకెళ్లాలి
  rationale: హిఫీల్ రూపంలోని יצא ఇక్కడ బూడిదను ఒక స్థలం నుంచి బయటకు తీసుకుపోవడాన్ని సూచిస్తుంది. ‘తీసుకెళ్లాలి’ గమ్యస్థానానికి తరలించే చర్యను సహజంగా తెలియజేస్తుంది; דשןను సందర్భానుసారంగా ‘బూడిద’గా అనువదించాం.
- source_word: אֶל־מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: ఈ పదబంధం శిబిరపు హద్దులకు అవతలికి కదలికను సూచిస్తుంది.
- source_word: אֶל־מָקוֹם טָהוֹר
  choice: శుద్ధమైన స్థలానికి
  rationale: టహోర్ లేవీయ ఆచార సందర్భంలో ఆచారపరమైన శుద్ధతను సూచిస్తుంది. ‘శుద్ధమైన’ అనే పదం ఆ వర్గాన్ని నిలుపుతూ తెలుగులో గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: טָהוֹר అనే పదంలోని ఆచారపరమైన శుద్ధత భావం
  choice: శుద్ధమైన స్థలం
  alternative: ఆచారపరంగా శుద్ధమైన స్థలం; పరిశుభ్రమైన స్థలం
  rationale: ఇది కేవలం భౌతిక పరిశుభ్రతకన్నా లేవీయ ఆచారపరమైన శుద్ధతను సూచిస్తుంది. ప్రధాన పాఠ్యంలో అదనపు వివరణను చేర్చకుండా ‘శుద్ధమైన’ అని ఉంచి, ఆ భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యాజక ఆచారానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. చర్యల క్రమం స్పష్టంగా ఉండేలా అసమాపక క్రియలతో వాక్యాన్ని సహజంగా నిర్మించాం. ప్రధాన పాఠ్యంలో మూలంలో లేని ‘శుభ్రమైన వస్త్రాలు’ వంటి భావాన్ని చేర్చలేదు.
