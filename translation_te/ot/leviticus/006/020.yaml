source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: te
  text: దాని మాంసాన్ని తాకేది ఏదైనా పవిత్రమవుతుంది. దాని రక్తం కొంత ఒక వస్త్రంపై చిందితే,[a] రక్తం చిందిన ఆ వస్త్రాన్ని పవిత్ర స్థలంలో ఉతకాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిలకరించబడితే.” హీబ్రూ క్రియ ఆచారపూర్వకంగా చిలకరించడాన్ని కూడా సూచించగలదు; ఇక్కడ రక్తం వస్త్రంపై పడి, దానిని ఉతకాల్సిన సందర్భం కావడంతో “చిందితే” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: తాకేది ఏదైనా
  rationale: ఈ సమగ్ర అనిర్దిష్ట ప్రయోగం వస్తువులనైనా వ్యక్తులనైనా చేర్చగలదు; తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: దాని మాంసాన్ని తాకేది
  rationale: בָּשָׂר బలి అర్పణలోని మాంసాన్ని సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం పాపపరిహార బలిని తిరిగి సూచిస్తోంది.
- source_word: יִקְדָּשׁ
  choice: పవిత్రమవుతుంది
  rationale: స్పర్శ ఫలితంగా పవిత్ర స్థితిలోకి రావడాన్ని సూచిస్తుంది; ప్రత్యేక ప్రతిష్ఠాపన కర్మ జరిగినట్టు అదనంగా చెప్పదు.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: దాని రక్తంలో కొంత ... మీద చిందితే
  rationale: נזה ఇక్కడ రక్తం వస్త్రంపై పడడాన్ని సూచిస్తుంది. 'చిందితే' సందర్భానికి సహజం; క్రియకు ఉన్న ఆచారపూర్వక 'చిలకరించు' అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: עַל הַבֶּגֶד
  choice: వస్త్రం మీద
  rationale: నియమవాక్యంలోని సాధారణ సందర్భానికి తెలుగులో అనిర్దిష్టమైన 'వస్త్రం' సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: అది చిందిన వస్త్రాన్ని
  rationale: స్త్రీలింగ ప్రత్యయం వస్త్రాన్ని సూచిస్తుందని స్పష్టంగా వ్యక్తపరుస్తూ, మూలంలోని సంబంధవాక్య భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: תְּכַבֵּס
  choice: ఉతకాలి
  rationale: כבס వస్త్రాన్ని ఉతకడాన్ని సూచిస్తుంది. రెండవ పురుష ఆజ్ఞను తెలుగు నియమశైలిలో సహజమైన విధ్యర్థక రూపంతో అందిస్తుంది.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పవిత్ర స్థలంలో
  rationale: మూలంలో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల అంతర్గర్భాలయాన్ని ప్రత్యేకంగా సూచించకుండా, పవిత్రమైన ప్రదేశమనే భావాన్ని ఉంచుతుంది.
theological_decisions:
- issue: పాపపరిహార బలి మాంసాన్ని తాకడం వల్ల కలిగే పవిత్రత
  choice: తాకేది పవిత్రమవుతుందని నేరుగా అనువదించడం
  alternative: అది పవిత్ర వినియోగానికే పరిమితమవుతుంది
  rationale: సందర్భం నైతిక అంతరంగ మార్పుకన్నా ఆచార సంబంధ పవిత్ర స్థితిని సూచిస్తుంది. అయినా మూలంలోని భావాన్ని వివరణతో భర్తీ చేయకుండా 'పవిత్రమవుతుంది' అని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. 'పవిత్రమవుతుంది' అనే రూపం మూలంలోని ఆచార సంబంధ భావాన్నీ దాని ఉద్దేశపూర్వక సంక్షిప్తతనూ కాపాడుతుంది.
