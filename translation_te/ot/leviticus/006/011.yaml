source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: te
  text: అహరోను కుమారులలో ప్రతి మగవాడు దానిని తినవచ్చు. యాహ్వేకు అర్పించే అగ్నియర్పణలలోనుండి ఇది మీ తరతరాలకు శాశ్వతమైన నియమం. వాటిని తాకేది ఏదైనా పవిత్రమవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని తాకేది ఏదైనా ప్రతిష్ఠితమవుతుంది.” హెబ్రీ వాక్యం స్పర్శవల్ల పవిత్ర స్థితిలోకి రావడాన్ని సూచించవచ్చు; మరికొందరు, ఇప్పటికే పవిత్రమైనదే వాటిని తాకవచ్చనే మరింత పరిమిత అర్థంలో దీనిని గ్రహిస్తారు.
    reason: చివరి క్రియకు ఫలిత పవిత్రత, ప్రతిష్ఠ లేదా పవిత్రమైన వాటికే స్పర్శ అనుమతి అనే భిన్న అవగాహనలు సాధ్యమవుతాయి.
lexical_decisions:
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాడు
  rationale: యాజక కుటుంబంలో తినడానికి అర్హతగల పురుషులను సూచించే పంపిణీ అర్థాన్ని, ‘మనిషి’ అని విస్తరించకుండా లింగపరంగా స్పష్టంగా తెలుపుతుంది.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: అహరోను కుమారులలో
  rationale: హెబ్రీలోని కుటుంబపరమైన యాజక వర్గ designationను అక్షరార్థానికి దగ్గరగా నిలుపుతుంది; ఆధారం లేకుండా ‘వంశస్థులు’ అని విస్తరించదు.
- source_word: יֹאכֲלֶנָּה
  choice: దానిలోనిది తినవచ్చు
  rationale: ముందటి సందర్భంలోని అర్పణ భాగాన్ని సూచిస్తూ, యాజకులకు కలిగిన అనుమతి లేదా హక్కును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָק עוֹלָם
  choice: శాశ్వతమైన నియమం
  rationale: నిరంతరంగా అమలులో ఉండే ధార్మిక-న్యాయ విధిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: వరుస తరాలన్నిటికీ వర్తించే నిబంధనాత్మక సూత్రాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యాహ్వేకు అర్పించే అగ్ని అర్పణలలో
  rationale: אִשֶּׁה అనే బలిసంబంధ పదంలోని అగ్నితో అర్పించే భావాన్ని నిలుపుతూ, ఇది యాహ్వేకు సమర్పించిన అర్పణలలోని నిర్ణీత భాగమని సందర్భానుసారంగా తెలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామంలోని నాలుగు హెబ్రీ అక్షరాలకు ప్రాచుర్యంలో ఉన్న పండితపరమైన ఉచ్చారణను తెలుగు లిపిలో నేరుగా అందిస్తుంది.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: వాటిని తాకేది ఏదైనా
  rationale: తాకేది వ్యక్తా వస్తువా అని హెబ్రీ నిర్దిష్టంగా చెప్పదు; ఈ రూపం ఆ విస్తృతతను కాపాడుతుంది.
- source_word: יִקְדָּשׁ
  choice: పవిత్రమవుతుంది
  rationale: స్పర్శ ఫలితంగా పవిత్ర స్థితిలోకి రావడం అనే క్రియార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘పవిత్రంగా ఉంటుంది’ అని స్థిరస్థితికి పరిమితం చేయదు.
theological_decisions:
- issue: చివరి వాక్యంలో పవిత్రత సంక్రమణ అర్థం
  choice: పవిత్ర అర్పణలను తాకేది వాటితో స్పర్శవల్ల పవిత్రమవుతుందని ప్రధాన పాఠం చెబుతుంది.
  alternative: ఇప్పటికే పవిత్రమైనదే వాటిని తాకవచ్చని నియంత్రణాత్మకంగా చదవవచ్చు; లేదా తాకినది ప్రతిష్ఠిత స్థితికి సంబంధించిన బాధ్యతలకు లోబడుతుందని అర్థం చేసుకోవచ్చు.
  rationale: יִקְדָּשׁ అనే క్రియ, ‘తాకేది ఏదైనా’ అనే కర్త తరువాత, సహజంగా ఫలిత స్థితిని సూచిస్తుంది. అయితే ఆ పవిత్రతకు సంబంధించిన ఆచరణాత్మక పరిణామాలను పాఠంలో అదనంగా నిర్ధారించకుండా ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయ-ఆరాధనా శైలి ఉపయోగించబడింది. అరుదైన సంస్కృతభరిత పదాలకు బదులు ‘శాశ్వతమైన నియమం’, ‘పవిత్రమవుతుంది’ వంటి సాధారణంగా అర్థమయ్యే రూపాలు ఎంచుకోబడ్డాయి; బలిసంబంధ సాంకేతిక భావం కోసం ‘అగ్ని అర్పణలు’ నిలుపబడింది.
