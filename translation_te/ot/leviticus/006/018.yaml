source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הַֽ/חַטָּ֑את בִּ/מְק֡וֹם אֲשֶׁר֩ תִּשָּׁחֵ֨ט הָ/עֹלָ֜ה תִּשָּׁחֵ֤ט הַֽ/חַטָּאת֙ לִ/פְנֵ֣י יְהוָ֔ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: te
  text: '“అహరోనుతో, అతని కుమారులతో ఇలా చెప్పు: ‘పాపబలి[a] గురించిన నియమం ఇదే: దహనబలిని వధించే స్థలంలోనే పాపబలిని యహ్వే సన్నిధిలో వధించాలి. అది అతి పరిశుద్ధమైనది.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుద్ధీకరణ బలి”; హీబ్రూ పదం חַטָּאת ఇక్కడ ఒక బలి పేరును సూచిస్తుంది. ఈ బలి పాపంతో సంబంధమున్నదిగా, లేదా ఆచార శుద్ధీకరణతో సంబంధమున్నదిగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: అహరోనుతో, అతని కుమారులతో ఇలా చెప్పు
  rationale: ఏకవచన ఆజ్ఞను, రెండు సార్లు వచ్చిన אֶל భావాన్ని, శాసనాత్మక పరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: זֹאת תּוֹרַת
  choice: గురించిన నియమం ఇదే
  rationale: యాజక బలి సందర్భంలో תּוֹרָה సాధారణ ధర్మశాస్త్రమంతటిని కాక, నిర్దిష్టమైన ఆచార విధిని లేదా నియమాన్ని సూచిస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חַטָּאת ఇక్కడ పాపమనే భావనను కాక బలి రకాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తూ, ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה అనే సాంకేతిక బలి పదానికి తెలుగులో స్పష్టమైన, స్థిరమైన సమానార్థకం.
- source_word: תִּשָּׁחֵט
  choice: వధించే / వధించాలి
  rationale: שׁחט బలి సందర్భంలో జంతువును విధిగా వధించడాన్ని సూచిస్తుంది; రెండవ అసంపూర్ణ క్రియకు న్యాయనియమాత్మక ఆదేశ బలాన్ని ‘వధించాలి’ తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: లִפְנֵי యొక్క ఆరాధనా-సంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, יהוה అనే దైవనామాన్ని పేరుగా ప్రతిబింబిస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హెబ్రీయ విస్తృతార్థక నిర్మాణం అత్యున్నత పరిశుద్ధతను సూచిస్తుంది; బలికి వర్తించే వర్గీకరణగా ఇది సహజమైన తెలుగు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా పేరుగా నిలుపుతుంది.
- issue: חַטָּאת యొక్క బలి సంబంధ భావం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమున్న బలిని, అలాగే ఆచార శుద్ధీకరణ కార్యాన్ని సూచించగలదు. ప్రధాన పాఠంలో సంప్రదాయంగా సులభంగా గ్రహించగల రూపాన్ని ఉంచి, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటీకలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యాజక శాసనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. సాంకేతిక బలి పదాల్లో ‘దహనబలి’, ‘పాపపరిహార బలి’లను స్థిరంగా వాడాం.
