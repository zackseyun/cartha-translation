id: LEV.6.5
reference: Leviticus 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: te
  text: బలిపీఠం మీదున్న అగ్ని దాని మీద మండుతూనే ఉండాలి; అది ఆరిపోకూడదు. యాజకుడు ప్రతి ఉదయం[a] దాని మీద కట్టెలు వేసి మండించాలి. దాని మీద దహనబలిని క్రమంగా అమర్చి, సమాధానబలుల[b] కొవ్వు భాగాలను దహించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఉదయం ఉదయం’; హీబ్రూలోని పునరుక్తి ‘ప్రతి ఉదయం’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్షేమబలులు’ లేదా ‘సహవాసబలులు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: మండుతూనే ఉండాలి
  rationale: హోఫాల్ రూపం అగ్ని మండే స్థితిలో నిరంతరం ఉంచబడాలని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘మండుతూనే ఉండాలి’ ఈ కొనసాగింపు ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בּוֹ
  choice: దాని మీద
  rationale: ఇది బలిపీఠాన్ని సూచిస్తుంది; బలి సందర్భంలో అగ్ని బలిపీఠం ఉపరితలంపై ఉండడం వల్ల ‘దాని మీద’ సహజమైనది.
- source_word: לֹא תִכְבֶּה
  choice: అది ఆరిపోకూడదు
  rationale: బలిపీఠపు అగ్ని నిరంతరం మండాలనే ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבִעֵר ... עֵצִים
  choice: కట్టెలు వేసి మండించాలి
  rationale: యాజకుడు కొత్త అగ్ని ప్రారంభించడం కాక, కట్టెలు చేర్చి ఉన్న అగ్నిని కొనసాగించడమే సందర్భం. ఈ తెలుగు ప్రయోగం ఆ చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ప్రతి ఉదయం
  rationale: ‘ఉదయం’ అనే పదపు పునరుక్తి పంపిణీ భావాన్ని, అంటే రోజూ ఉదయాన్నే చేయాల్సిన చర్యను సూచిస్తుంది.
- source_word: וְעָרַךְ
  choice: క్రమంగా అమర్చి
  rationale: బలిని బలిపీఠంపై తగిన క్రమంలో ఉంచే ఆచారపరమైన చర్యను ప్రతిబింబిస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా బలిపీఠంపై దహించబడే ఈ నిర్దిష్ట బలి రకానికి తెలుగులో స్థిరమైన, సులభంగా గుర్తించగల పదం.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠంపై బలి భాగాలను పొగగా పైకి వెళ్లేలా కాల్చే ఆచారపరమైన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חֶלְבֵי
  choice: కొవ్వు భాగాలు
  rationale: ఇది సాధారణంగా ‘శ్రేష్ఠ భాగాలు’ అనే రూపకాలంకార భావం కాక, బలిలో దహించడానికి నిర్దేశించిన కొవ్వును సూచిస్తుంది.
- source_word: הַשְּׁלָמִים
  choice: సమాధానబలులు
  rationale: ఈ బలి వర్గానికి తెలుగులో గుర్తించదగిన సంప్రదాయ పదాన్ని ఉపయోగిస్తుంది; పదంలో ఉన్న క్షేమం, శాంతి, సహవాసం వంటి భావాలన్నిటినీ ఒకే అర్థానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: బలుల పరిభాషను అనువదించడం
  choice: ‘దహనబలి’, ‘సమాధానబలులు’ అనే స్థిరపడిన బలి పదాలను ఉపయోగించడం
  alternative: ‘పైకి ఎక్కే బలి’, ‘క్షేమబలులు’ లేదా ‘సహవాసబలులు’ వంటి వ్యుత్పత్తి లేదా భావాధారిత పదాలు
  rationale: ఇది ఆచార సంబంధమైన ధర్మశాస్త్ర ఆదేశం. అందువల్ల నిర్దిష్ట బలి వర్గాలు పాఠకునికి గుర్తుపట్టేలా ఉండాలి; అదే సమయంలో שְׁלָמִים పదంలోని విస్తృత భావాన్ని పాదసూచిక ద్వారా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని నిరంతర ఆజ్ఞ, రోజువారీ పునరావృతం, ఆచారపరమైన క్రమం స్పష్టంగా ఉంచబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
