  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’ (יהוה); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపాన్ని మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר అనే మాట క్రియను సహజమైన ఆధునిక తెలుగులో ‘చెప్పాడు’ అని అనువదించాం. హీబ్రూ కథన ప్రవాహంలోని וַ־ను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, వాక్యక్రమం ద్వారా తదుపరి మాటగా తెలియజేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే సందర్భంలో אֶל సూచించే సంబోధిత వ్యక్తిని సహజమైన తెలుగు ప్రయోగమైన ‘మోషేతో’ ద్వారా వ్యక్తపరిచాం.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘ఇలా’తో పాటు కోలన్ వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఉచ్చారణ పూర్తిగా నిర్ధారితం కానందున, తెలుగులో స్థిరపడి విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మూల హీబ్రూ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యానికి కొనసాగింపును కోలన్ ద్వారా స్పష్టంచేశాం.
