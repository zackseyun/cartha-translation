source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: te
  text: అది ఉడికించబడిన మట్టిపాత్రను పగులగొట్టాలి. అయితే అది కంచు పాత్రలో[a] ఉడికించబడితే, దానిని బాగా రుద్ది నీటితో కడగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాగి పాత్రలో.’ హీబ్రూ נְחֹשֶׁת సందర్భానుసారం రాగిని లేదా కంచును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: మట్టిపాత్ర
  rationale: כְלִי חֶרֶשׂ కాల్చిన మట్టితో చేసిన పాత్రను సూచిస్తుంది. ‘మట్టిపాత్ర’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత చెప్పబడే లోహపాత్రతో ఉన్న భౌతిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: ఉడికించబడుతుంది / ఉడికించబడితే
  rationale: בשׁל ఇక్కడ బలి మాంసాన్ని పాత్రలో ఉడికించడాన్ని సూచిస్తుంది. హీబ్రూ క్రియలోని కర్మణి భావాన్ని తెలుగు రూపాలు నిలుపుతున్నాయి.
- source_word: בּוֹ
  choice: దేనిలో
  rationale: ఈ ప్రత్యయసహిత విభక్తి ముందున్న పాత్రను తిరిగి సూచిస్తూ, దానిలో ఉడికించబడినదనే స్థాన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יִשָּׁבֵר
  choice: పగులగొట్టాలి
  rationale: న్యాయవిధి సందర్భంలో ఈ నిఫాల్ అసంపూర్ణ క్రియ ఆజ్ఞాత్మక బాధ్యతను వ్యక్తం చేస్తుంది. ‘పగులగొట్టాలి’ ఆధునిక తెలుగులో దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְלִי נְחֹשֶׁת
  choice: కంచు పాత్ర
  rationale: נְחֹשֶׁת సందర్భానుసారం రాగి లేదా కంచును సూచించగలదు. ప్రాచీన పాత్రల సందర్భంలో ‘కంచు’ సరైన ప్రధాన ఎంపిక; ‘రాగి’ సాధ్యమైన ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచబడింది.
- source_word: וּמֹרַק
  choice: బాగా తోమి
  rationale: מרק రుద్ది పూర్తిగా శుభ్రం చేయడాన్ని సూచిస్తుంది. ‘బాగా తోమి’ లోహపాత్రకు చేసే గట్టి శుభ్రపరిచే చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: నీళ్లతో కడగాలి
  rationale: שטף నీటితో కడగడం లేదా ప్రవహించే నీటితో శుభ్రం చేయడాన్ని సూచిస్తుంది. ‘నీళ్లతో కడగాలి’ ముందున్న తోమడానంతర రెండవ శుభ్రపరిచే చర్యను స్పష్టంగా తెలుపుతుంది.
