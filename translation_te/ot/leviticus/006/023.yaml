  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִ/דָּמָ֜/הּ אֶל אֹ֧הֶל מוֹעֵ֛ד לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: te
  text: ఏ పాపపరిహార బలి రక్తంలోనుండి కొంత పరిశుద్ధ స్థలంలో ప్రాయశ్చిత్తం చేయడానికి సమావేశపు గుడారంలోకి తీసుకురాబడుతుందో, ఆ బలిని తినకూడదు[a]; దానిని అగ్నితో కాల్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’కి బదులుగా ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు. లేవీయకాండంలో హెబ్రీ పదం חַטָּאת అపవిత్రతను, పాపాన్ని పరిష్కరించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: ఏ ... బలి ... ఆ బలిని
  rationale: וְכָל ఈ నియమాన్ని ముందున్న ఆదేశాలతో అనుసంధానిస్తూ, ఈ వర్గంలోకి వచ్చే ప్రతి బలికీ వర్తించే సమగ్ర భావాన్ని ఇస్తుంది. తెలుగులో సహజమైన సంబంధవాచక నిర్మాణం ద్వారా ఆ వ్యాప్తిని తెలిపాం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలి సందర్భంలో ఈ పదం నైరూప్యమైన ‘పాపం’ను కాక, పాపం మరియు అపవిత్రతతో వ్యవహరించే బలిని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండే సాంప్రదాయిక పదాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: రక్తంలో కొంత ... తీసుకురాబడుతుందో
  rationale: מִן ఉపసర్గలోని భాగసూచక భావాన్ని స్పష్టంగా ఉంచి, మొత్తం రక్తం కాదు దానిలో కొంత తీసుకురాబడుతుందని తెలియజేస్తుంది. హెబ్రీ నిష్క్రియ నిర్మాణాన్ని కూడా నిలిపాం.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం లోపలికి
  rationale: ఇది పరిశుద్ధ మందిర నిర్మాణానికి స్థిరమైన పేరు. אֶל సందర్భానుసారంగా లోపలికి తీసుకెళ్లడాన్ని సూచిస్తున్నందున ‘లోపలికి’ అని అనువదించాం.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక బలి సందర్భంలోని כפר పదానికి గల ఆచారపరమైన, దైవశాస్త్రపరమైన బలాన్ని నిలుపుతూ, ప్రాయశ్చిత్త సిద్ధాంతంలోని ఏ ఒక్క ప్రత్యేక వివరణనూ అనువాదంలోకి రానీయదు.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: నైరూప్య పరిశుద్ధతను కాక, మందిరంలోని పవిత్ర ప్రాంతాన్ని సూచించే స్థలార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לֹא תֵאָכֵל
  choice: తినకూడదు
  rationale: నిష్క్రియ రూపంలోని నిషేధాన్ని సహజమైన ఆధునిక తెలుగు న్యాయ/ఆదేశ శైలిలో తెలిపింది.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: దానిని అగ్నితో కాల్చివేయాలి
  rationale: ‘అగ్నితో కాల్చాలి’ అనే హెబ్రీ నుడికారంలోని అగ్ని ప్రాధాన్యాన్ని నిలుపుతూ, తెలుగులో సహజమైన ఆదేశ రూపాన్ని వాడాం.
theological_decisions:
- issue: యాజక బలి నియమాల్లో חַטָּאת అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఇక్కడ సూచించబడేది పాపం అనే భావం కాదు, ఒక నిర్దిష్ట బలి. ‘శుద్ధీకరణ బలి’ ఆచారపరమైన శుద్ధి కోణాన్ని బలంగా చూపగలిగినా, ‘పాపపరిహార బలి’ సాధారణ పాఠకులకు గుర్తుపట్టదగినది; శుద్ధీకరణ కోణాన్ని నిరాకరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: పరిశుద్ధ స్థలంలోకి తీసుకురాబడే రక్త పరిమాణం
  choice: రక్తంలో కొంత
  alternative: దాని రక్తం
  rationale: מִדָּמָהּ లోని מִן భాగసూచకంగా ఉండి, బలి రక్తంలో కొంత తీసుకురాబడుతుందని సూచిస్తుంది. ఈ సూక్ష్మతను తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- issue: לְכַפֵּר యొక్క దైవశాస్త్రపరమైన పరిధి
  choice: ప్రాయశ్చిత్తం చేయడానికి
  alternative: శుద్ధి చేయడానికి
  rationale: మూలపదం పాపం, అపవిత్రత, పరిశుద్ధ స్థల ఆచారంతో ముడిపడిన విస్తృత కార్యాన్ని సూచించగలదు. ‘ప్రాయశ్చిత్తం’ ఆ ఉద్వేగాన్ని నిలుపుతుంది; ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి దాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనా గౌరవప్రదమైన శైలి. బలి నియమానికి తగిన ఆదేశ స్వరం, మూలంలోని నిష్క్రియత మరియు భాగసూచక రక్త భావం నిలుపబడ్డాయి.
