source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑/הּ קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: te
  text: యాజకులలో ప్రతి పురుషుడు దానిని తినవచ్చు; అది అతి పరిశుద్ధమైనది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పరిశుద్ధతల పరిశుద్ధత”; ఇది “అతి పరిశుద్ధమైనది” అనే అర్థమిచ్చే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: ప్రతి పురుషుడు
  rationale: ఏకవచనమైన זָכָר‌తో కూడిన כָּל ఇక్కడ సమూహార్థం కంటే విభజనార్థాన్ని ఇస్తుంది; అందువల్ల ‘ప్రతి పురుషుడు’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: בַּכֹּהֲנִים
  choice: యాజకులలో
  rationale: ב ఉపసర్గ యాజకుల సమూహంలో సభ్యత్వాన్ని సూచిస్తుంది; ‘యాజకులలో’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יֹאכַל
  choice: తినవచ్చు
  rationale: ధర్మశాస్త్ర సందర్భంలో ఈ అసంపూర్ణ క్రియ అనుమతించబడిన లేదా నియమిత చర్యను సూచిస్తుంది; ప్రతి వ్యక్తికీ ఆజ్ఞ విధిస్తున్నట్టు కాకుండా అధికారాన్ని తెలియజేయడానికి ‘తినవచ్చు’ అనుకూలం.
- source_word: אֹתָהּ
  choice: దానిని
  rationale: స్త్రీలింగ సర్వనామం ముందుగా ప్రస్తావించిన అర్పణను సూచిస్తుంది; మూలంలో లేని నామవాచకాన్ని చేర్చకుండా ‘దానిని’ అని అనువదించబడింది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: ‘పరిశుద్ధతల పరిశుద్ధత’ అనే హెబ్రీయ సమాసం అత్యున్నత పరిశుద్ధతను తెలిపే అతిశయోక్తి ప్రయోగం; ఆధునిక తెలుగులో ‘అతి పరిశుద్ధమైనది’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: హెబ్రీయ స్త్రీలింగ సర్వనామం తన పూర్వపదంతో వ్యాకరణ సమ్మతి కలిగి ఉంది; తెలుగులో వస్తువును సూచించేందుకు సహజమైన ‘అది’ వాడబడింది.
