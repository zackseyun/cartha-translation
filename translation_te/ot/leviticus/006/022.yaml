translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి ఉపయోగించబడింది. ‘పురుషుడు’ లింగార్హతను స్పష్టంగా ఉంచుతుంది; ‘తినవచ్చు’ అనుమతి భావాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
