  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: te
  text: పెనంపై నూనెతో దానిని తయారుచేయాలి[a]; బాగా కలిపిన దానిని తీసుకురావాలి. కాల్చిన ధాన్యార్పణను ముక్కలుగా చేసి[b] యాహ్వేకు ఇంపైన సువాసనగా అర్పించాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నూనెలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘కాల్చిన’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; అది పెనం మీద కాల్చి సిద్ధం చేసిన భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఇంపైన సువాసన’ అనేది అర్పణ యాహ్వేకు ఆమోదయోగ్యమని తెలిపే సాధారణ బలిసంబంధ వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: పెనం
  rationale: ఇది ధాన్యార్పణను వండడానికి ఉపయోగించే చదునైన వంటపాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పెనం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַּשֶּׁמֶן
  choice: నూనెతో
  rationale: בְּ ఉపసర్గ ఇక్కడ ‘నూనెలో’ లేదా ‘నూనెతో’ అని అర్థమివ్వగలదు. తయారీ విధానాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘నూనెతో’ ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: תֵּעָשֶׂה
  choice: తయారుచేయాలి
  rationale: עשה నిఫాల్ రూపం అర్పణను సిద్ధం చేయడాన్ని తెలిపే కర్మణి భావాన్ని కలిగి ఉంది. తెలుగు ఆదేశ శైలిలో ‘తయారుచేయాలి’ స్పష్టంగా ఉంటుంది.
- source_word: מֻרְבֶּכֶת
  choice: నూనెతో బాగా కలిపి
  rationale: ఈ పదం నూనెతో కలపబడిన లేదా మిశ్రమం చేయబడిన తయారీని సూచిస్తుంది. ‘బాగా కలిపి’ భావాన్ని తెలియజేస్తుంది; ‘నూనెతో’ సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: תְּבִיאֶנָּה
  choice: దాన్ని తీసుకురావాలి
  rationale: స్త్రీలింగ ప్రత్యయం ధాన్యార్పణను సూచిస్తుంది. בוא హిఫీల్ యొక్క ప్రాథమిక ‘తీసుకురా’ భావాన్ని నిలిపాం.
- source_word: תֻּפִינֵי
  choice: కాల్చిన ముక్కలుగా
  rationale: ఇది అరుదైన వంట సంబంధ పదం; కాల్చిన భాగాలు లేదా కాల్చి సిద్ధం చేసిన ముక్కలను సూచించే అవకాశం ఉంది. అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: מִנְחַת
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని పిండి లేదా ధాన్యంతో చేసే ప్రత్యేక అర్పణకు ఇది స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: פִּתִּים
  choice: ముక్కలుగా చేసిన
  rationale: ఈ పదం విభజించిన లేదా విరిచిన భాగాలను సూచిస్తుంది. తెలుగులో దాని చర్యాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַּקְרִיב
  choice: అర్పించాలి
  rationale: קרב హిఫీల్ బలిసంబంధ సందర్భంలో దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావం ఇస్తుంది. ‘అర్పించాలి’ ఆచార సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: ఇది బలి దేవునికి ఆమోదయోగ్యమని తెలిపే స్థిరమైన బలిసంబంధ పదబంధం. ‘ఇంపైన సువాసన’ రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలో ఉన్న దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- issue: רֵיחַ נִיחֹחַ అనే బలిసంబంధ వ్యక్తీకరణ
  choice: ఇంపైన సువాసన
  alternative: శాంతికరమైన సువాసన / సుగంధం
  rationale: మూలంలోని సువాసన రూపకాన్ని నిలుపుతూ, అర్పణ యాహ్వేకు ఆమోదయోగ్యమనే ఆచారపరమైన భావాన్ని సూచిస్తుంది; ఆ భావాన్ని ప్రధాన పాఠంలో వివరణగా చేర్చి మూలంలోని రూపకాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించాం. అరుదైన תֻּפִינֵי పదానికి అతిగా నిర్దిష్టమైన వంటవిధానాన్ని నిర్ధారించకుండా పాదసూచికలో అనిశ్చితిని తెలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో వరుసగా ఉంచాం.
