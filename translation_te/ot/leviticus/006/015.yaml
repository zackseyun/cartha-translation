    rationale: హీబ్రూలో הַמָּשִׁיחַ అనేది అభిషేకం పొందిన యాజకుని స్థితిని తెలిపే విశేషణం. “అభిషిక్త యాజకుడు” ఆ రూపాన్ని, సాంకేతిక యాజకార్థాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
