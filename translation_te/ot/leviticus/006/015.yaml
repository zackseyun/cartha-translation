  terminology: “అభిషిక్త యాజకుడు” ఇక్కడ మెస్సీయ బిరుదు కాక యాజక పదవికి అభిషేకం పొందిన వ్యక్తిని సూచిస్తుంది. יהוהకు ముసాయిదాలో ఉన్న ప్రాజెక్టు-ఎంచుకున్న రూపమైన “యెహోవా”ను నిలిపాము. חָק עוֹלָםకు “శాశ్వతమైన నియమం” వాడాము.
