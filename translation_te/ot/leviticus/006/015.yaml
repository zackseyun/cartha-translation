source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: te
  text: అతని స్థానంలో, అతని కుమారులలో ఒకడైన అభిషిక్త యాజకుడు దానిని సిద్ధం చేయాలి. ఇది యెహోవాకు శాశ్వతమైన నియమం; దానిని పూర్తిగా పొగగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అది పూర్తిగా పొగగా చేయబడాలి”; అంటే, అర్పణ మొత్తాన్ని పొగగా అర్పించాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: అభిషేకించబడే యాజకుడు
  rationale: ఇక్కడ ‘అభిషిక్తుడు’ అనేది మెస్సీయ బిరుదు కాదు; యాజక పదవికి అభిషేకం పొందిన వారసుణ్ణి సూచిస్తుంది. తెలుగు వాక్యంలో వారసత్వ సందర్భానికి సహజంగా ఉండేందుకు క్రియాత్మక రూపం వాడబడింది.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: అతని కుమారులలో అతని స్థానంలో
  rationale: תַּחְתָּיו యొక్క సందర్భార్థమైన ‘అతని స్థానంలో’ను, מִבָּנָיוలోని పురుష వంశ సంబంధాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: దానిని సిద్ధం చేయాలి
  rationale: עָשָׂה విస్తృతార్థకమైన ‘చేయు’; బలి ఆచార సందర్భంలో ‘సిద్ధం చేయాలి’ అనేది అర్పణకు సంబంధించిన చర్యను తెలిపినా, ‘అర్పించాలి’ అని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: חָק עוֹלָם
  choice: శాశ్వతమైన కట్టడ
  rationale: నిరంతరంగా అమలులో ఉండే నియమం అనే భావాన్ని గౌరవప్రదమైన, బైబిలు సందర్భానికి సుపరిచితమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను పేరుగా స్పష్టంగా ప్రతిబింబిస్తుంది; לְ యొక్క సమర్పణ/సంబంధ భావాన్ని ‘కు’ తెలియజేస్తుంది.
- source_word: כָּלִיל תָּקְטָר
  choice: దానినంతటినీ పొగగా పైకి లేపాలి
  rationale: כָּלִילలోని సంపూర్ణతను, קטר హిఫిల్‌లోని బలిని బలిపీఠంపై పొగగా పైకి లేపే ప్రత్యేక ఆచార భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అభిషేకించబడే యాజకుడు’ ఎవరు?
  choice: తన పూర్వికుని స్థానంలో పదవి స్వీకరించే, అతని కుమారులలోని అభిషిక్త యాజకుడు
  alternative: సాధారణంగా అభిషేకించబడిన ఏ యాజకుడైనా; లేదా మెస్సీయ సంబంధమైన వ్యక్తి
  rationale: యాజక ఆచార సందర్భం, ‘అతని కుమారులలో’, ‘అతని స్థానంలో’ అనే పదాలు వంశపారంపర్యంగా సంక్రమించే యాజక పదవిని సూచిస్తున్నాయి; మెస్సీయార్థాన్ని ఇక్కడ చేర్చడం సముచితం కాదు.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని అనువాదంలో పేరుగా ప్రత్యక్షంగా ఉంచుతుంది; పాఠ్యంలో లేని బిరుదుతో దానిని భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకునికి అర్థమయ్యే నిర్మాణం. ‘కట్టడ’ను ధర్మశాసన సంబంధ నియమార్థంలో వాడాం. ప్రధాన పాఠ్యంలోని [a] సూచిక పాదసూచికతో సరిపోతుంది.
