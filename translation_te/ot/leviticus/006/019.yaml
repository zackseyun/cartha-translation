  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/כֹּהֵ֛ן הַֽ/מְחַטֵּ֥א אֹתָ֖/הּ יֹאכֲלֶ֑/נָּה בְּ/מָק֤וֹם קָדֹשׁ֙ תֵּֽאָכֵ֔ל בַּ/חֲצַ֖ר אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: te
  text: పాపబలిగా దానిని అర్పించే యాజకుడు దానిని తినాలి.[a] అది పరిశుద్ధ స్థలంలో, ప్రత్యక్ష గుడారపు ప్రాంగణంలో తినబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానితో పాపపరిహారం చేసే యాజకుడు దానిని తినాలి”; హీబ్రూ కృదంతం పాపబలి ఆచారాన్ని నిర్వహించడాన్ని, లేదా దాని ద్వారా శుద్ధి చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: כֹּהֵןకు ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: పాపపరిహార బలిగా దానిని అర్పించే
  rationale: పీయేల్ కృదంతం ఈ బలి సంబంధమైన ఆచారాన్ని నిర్వహించడాన్ని సూచిస్తుంది. ఈ అనువాదం పాపబలి సందర్భాన్ని స్పష్టంగా తెలియజేస్తూ, క్రియలోని శుద్ధీకరణ/పాపపరిహార భావసంభావ్యతను పాదసూచికలో నిలుపుతుంది.
- source_word: יֹאכֲלֶנָּה
  choice: దానిని తినాలి
  rationale: ఈ ధర్మశాస్త్ర సందర్భంలో అసంపూర్ణ క్రియ విధిగా చేయవలసిన దానిని సూచిస్తుంది; ‘తినాలి’ సహజమైన ఆధునిక తెలుగు.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: ‘స్థలం’కు హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోయినా, తెలుగులో ‘పరిశుద్ధ స్థలంలో’ అనేది అనిర్దిష్టతను అనవసరంగా తొలగించకుండా సహజంగా ఉంటుంది.
- source_word: תֵּאָכֵל
  choice: దానిని తినాలి
  rationale: హీబ్రూ నిఫాల్ రూపం కర్మణి విధిని వ్యక్తం చేస్తుంది. తెలుగులో అక్షరానువాద కర్మణి రూపం భారంగా ఉండేందున సహజమైన విధిరూపం వాడబడింది; బలిపైనే దృష్టి నిలిచేలా ‘దానిని’ పునరుక్తం చేయబడింది.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రాంగణంలో
  rationale: אֹהֶל מוֹעֵדకు తెలుగులో స్థిరపడిన ‘ప్రత్యక్ష గుడారం,’ חָצֵרకు సహజమైన ‘ప్రాంగణం’ ఉపయోగించబడ్డాయి.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో חטא క్రియకు ఉన్న బలి సంబంధమైన భావం
  choice: పాపపరిహార బలిగా దానిని అర్పించే
  alternative: దానితో పాపపరిహారం చేసే; దానితో శుద్ధి చేసే
  rationale: క్రియ పాపబలి ఆచారాన్ని నిర్వహించడాన్ని సూచించగలదు. ప్రధాన పాఠం సందర్భాన్ని సాధారణ పాఠకుడికి స్పష్టం చేస్తుంది; శుద్ధీకరణ లేదా పాపపరిహారం అనే నిజమైన భావసంభావ్యతను పాదసూచికలో ఇస్తుంది, తద్వారా ఒకే సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించదు.
- issue: స్త్రీలింగ సర్వనామాల సూచ్యం
  choice: దానిని
  alternative: ఆమెను
  rationale: హీబ్రూలో వ్యాకరణపరంగా స్త్రీలింగమైనా, సూచ్యం బలి/బలిపశువు. తెలుగు బలి నియమ భాషలో ‘దానిని’ సహజంగా మూల ఉద్దేశాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర విధికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ప్రత్యక్ష గుడారం,’ ‘యాజకుడు,’ ‘పరిశుద్ధ స్థలం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, భారమైన కర్మణి నిర్మాణాన్ని సహజ తెలుగు విధిరూపంగా మార్చాం.
