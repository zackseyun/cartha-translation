source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: te
  text: 'ధాన్యార్పణకు సంబంధించిన విధి[a] ఇదే: అహరోను కుమారులు దానిని యాహ్వే సన్నిధిలో, బలిపీఠం ఎదుట సమర్పించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధాన్యార్పణకు సంబంధించిన ఉపదేశం’ లేదా ‘ధాన్యార్పణ నియమం’.
    reason: תּוֹרָה అనే పదం ఇక్కడ విధి, ఉపదేశం, లేదా నియమం అనే సమీప భావాలను కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: וְזֹאת
  choice: ఇదే
  rationale: కొత్త ఆచారవిధి విభాగాన్ని పరిచయం చేసే సహజమైన తెలుగు నిర్మాణం; సందర్భంలోని అనుసంధానం తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చెప్పకపోయినా స్పష్టంగా ఉంటుంది.
- source_word: תּוֹרַת
  choice: సంబంధించిన విధి
  rationale: ఇక్కడ תּוֹרָה సాధారణ ధర్మశాస్త్రాన్ని కాక, ధాన్యార్పణకు నిర్దేశించిన ఆచార నియమాన్ని సూచిస్తుంది. ‘విధి’ ఆధునిక తెలుగులో సహజంగా, న్యాయ-ఆచార భావంతో వినిపిస్తుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండపు బలి సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణను ప్రత్యేకంగా సూచిస్తుంది; సాధారణ ‘అర్పణ’కన్నా ఇది స్పష్టమైన పదం.
- source_word: הַקְרֵב אֹתָהּ
  choice: దానిని … సమర్పించాలి
  rationale: קרב యొక్క హిఫీల్ రూపం అర్పణను ఆచారపూర్వకంగా దగ్గరకు తెచ్చి సమర్పించడాన్ని ఆదేశిస్తుంది. ‘సమర్పించాలి’ ఆ విధానపరమైన ఆజ్ఞను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: యాజక కుటుంబ గుర్తింపును మూలానికి సన్నిహితంగా కాపాడుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఆచారపూర్వకంగా సమర్పించడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; యెహోవా అనే రూపం కన్నా యాహ్వే మూల దైవనామానికి దగ్గరగా ఉంటుంది.
- source_word: אֶל־פְּנֵי הַמִּזְבֵּחַ
  choice: బలిపీఠం ఎదుట
  rationale: బలిపీఠానికి సంబంధించి సమర్పణ జరిగే నిర్దిష్ట స్థలాన్ని తెలియజేస్తుంది; ముందున్న ‘సన్నిధిలో’ అనే దైవసమక్ష భావంతో దీనిని కలిపివేయదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఉంచాం.
- issue: బలుల నియమావళిలో תּוֹרָה భావం
  choice: విధి
  alternative: ధర్మశాస్త్రం / ఉపదేశం / నియమం
  rationale: ఈ సందర్భంలో పదం ధాన్యార్పణకు సంబంధించిన నిర్దేశిత ఆచార పద్ధతిని సూచిస్తుంది. ‘విధి’ దాని శాసనాత్మక భావాన్ని ఉంచుతూ, మొత్తం ధర్మశాస్త్రాన్ని సూచిస్తున్నట్టు అపార్థం రానివ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆచార-శాసన శైలి ఉపయోగించబడింది. ‘యాహ్వే సన్నిధిలో’ మరియు ‘బలిపీఠం ఎదుట’ అనే రెండు స్థానసూచక పదబంధాల భేదం కాపాడబడింది.
