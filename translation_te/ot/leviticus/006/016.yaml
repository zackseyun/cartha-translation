source:
  edition: WLC
  text: וְ/כָל מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/016.yaml
  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: te
  text: యాజకుని ప్రతి ధాన్యార్పణను పూర్తిగా దహించాలి[a]; దానిని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంపూర్ణ అర్పణగా ఉండాలి.” హెబ్రీ విశేషణం అర్పణ మొత్తాన్ని లేదా సంపూర్ణతను సూచించవచ్చు; ఈ సందర్భంలో దానిని తినకుండా పూర్తిగా బలిపీఠంపై అర్పించాలనే ఆచరణాత్మక భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ప్రతి
  rationale: כָּל ఏకవచన నిర్మాణ నామంతో పంపిణీ భావంలో ‘ప్రతి’ అని అర్థమిస్తుంది. ప్రారంభంలోని וְ ముందున్న నియమంతో అనుసంధానిస్తుంది; తెలుగులో సందర్భప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
- source_word: מִנְחַת
  choice: ధాన్యార్పణను
  rationale: లేవీయకాండంలో מִנְחָה సాధారణ కానుకకన్నా ధాన్యంతో చేసే బలికి వాడే సాంకేతిక పదం. ‘ధాన్యార్పణ’ ఆధునిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా ఉంది.
- source_word: כֹּהֵן
  choice: యాజకుని
  rationale: מִנְחַת כֹּהֵן అనే నిర్మాణ శ్రేణి ‘యాజకుని ధాన్యార్పణ’ అని సూచిస్తుంది. నిర్దిష్ట యాజకుడిని సూచించని ఏకవచనానికి తెలుగు సందర్భంలో ఈ రూపం సహజం.
- source_word: כָּלִיל
  choice: పూర్తిగా దహించాలి
  rationale: כָּלִיל ప్రాథమికంగా సంపూర్ణమైనదాన్ని సూచించి, బలి సందర్భంలో ఏ భాగమూ తినకుండా అంతటినీ బలిపీఠంపై అర్పించడాన్ని సూచిస్తుంది. హెబ్రీలో దహనక్రియ స్పష్టంగా లేకున్నా, తరువాతి నిషేధంతో కలిపి దాని ఆచరణాత్మక భావాన్ని ఈ అనువాదం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶה
  choice: చేయాలి
  rationale: న్యాయపరమైన సందర్భంలో ఈ అసంపూర్ణ క్రియకు విధినిర్దేశక బలం ఉంది. తెలుగులో ‘చేయాలి’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא תֵאָכֵל
  choice: దానిని తినకూడదు
  rationale: నిఫాల్ రూపం మూలంలో నిష్క్రియార్థకంగా ‘తినబడకూడదు.’ అయితే ఆధునిక తెలుగులో ‘దానిని తినకూడదు’ అదే నిషేధాన్ని మరింత సహజంగా తెలియజేస్తుంది; దానిలో ఏ భాగాన్ని ఎవరు తినరాదో అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: כָּלִיל యొక్క బలి సంబంధ భావం
  choice: పూర్తిగా దహించాలి
  alternative: సంపూర్ణ అర్పణగా ఉండాలి
  rationale: మూలపదంలోని ‘సంపూర్ణం’ అనే భావాన్ని నిలుపుకుంటూనే, తరువాత వచ్చే ‘తినకూడదు’ అనే వాక్యం సూచించే బలిపీఠ వినియోగాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం. పదరూపంలోని స్వల్ప అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలిని ఉపయోగించాం. ‘ధాన్యార్పణ’ను లేవీయకాండ బలి పరిభాషకు స్థిర పదంగా ఎంచుకున్నాం.
