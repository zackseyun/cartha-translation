  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, దైవిక ప్రసంగ సూత్రానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ప్రత్యక్ష వాక్యం కొనసాగుతుందని చూపడానికి ద్విబిందువు ఉపయోగించబడింది.
