    text: 'హీబ్రూ: ‘YHWH’ (יהוה). దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు; సంప్రదాయ అనువాదాల్లో తరచుగా ‘ప్రభువు’ అని ఉంచుతారు.'
    reason: దైవనామపు లిప్యంతరీకరణ మరియు సంప్రదాయ ప్రత్యామ్నాయాన్ని తెలియజేయడం
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: וַיְדַבֵּר దైవిక ప్రసంగాన్ని ప్రారంభించే కథన సూత్రం. ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘పలికాడు’ సహజంగా ఉండి, తరువాత వచ్చే మాటలకు పరిచయంగా పనిచేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: אֶל
  choice: తో
  rationale: דבר־אל నిర్మాణంలో ప్రసంగం ఎవరిని ఉద్దేశించిందో తెలుగులో సహజంగా తెలియజేయడానికి ‘మోషేతో’ అని అనువదించబడింది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: లֵאמֹר తరువాత ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా పలికాడు:’ అనే నిర్మాణం దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అంటూ’ అని యాంత్రికంగా చేర్చడం అవసరం లేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా יהוה అనే దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం. ఉచ్చారణ పునర్నిర్మాణం అనిశ్చితమైనందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో తెలిపాం.
