  text: וְ/הַ/נּוֹתֶ֣רֶת מִמֶּ֔/נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּ/בָנָ֑י/ו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּ/מָק֣וֹם קָדֹ֔שׁ בַּ/חֲצַ֥ר אֹֽהֶל מוֹעֵ֖ד יֹאכְלֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: te
  text: దానిలో మిగిలిన భాగాన్ని[a] అహరోనూ అతని కుమారులూ తినాలి. దాన్ని పులియనిదిగా[c] పవిత్రమైన స్థలంలో[b] తినాలి; సమావేశ గుడారపు ప్రాంగణంలో వారు దాన్ని తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానిలో మిగిలినదాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘పవిత్రమైన స్థలంలో’ అని ఉంది; ‘స్థలం’కు నిర్దిష్ట ఉపపదం లేదు. తరువాతి భాగం ఆ స్థలాన్ని సమావేశ గుడారపు ప్రాంగణంగా నిర్దేశిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పులియని రొట్టెలుగా.’ హీబ్రూ పదం దాన్ని పులియని రూపంలో తినడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: దానిలో మిగిలినదాన్ని
  rationale: స్త్రీలింగ ఏకవచన కృదంతం నామవాచకంగా పనిచేసి నైవేద్యంలో మిగిలిన భాగాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉంటుంది.
- source_word: יֹאכְלוּ
  choice: తినాలి
  rationale: ధర్మశాస్త్ర సందర్భంలో అసంపూర్ణ క్రియ ఆదేశాత్మక నియమాన్ని తెలుపుతుంది; ‘తినాలి’ ఆ నిర్దేశక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַהֲרֹן וּבָנָיו
  choice: అహరోనూ అతని కుమారులూ
  rationale: ఇక్కడ בנים యాజక సేవలో ఉన్న అహరోను పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: దాన్ని పులియనిదిగా తినాలి
  rationale: మూలంలోని מַצּוֹת నైవేద్యాన్ని పులియని రూపంలో తినాలని సూచిస్తుంది. ‘రొట్టె’ లేదా నిర్దిష్ట ఆకారాన్ని చేర్చకుండా ఆ భావాన్ని కాపాడుతుంది; నిఫాల్ క్రియలోని కర్మణి రూపం తెలుగులో సహజమైన ఆదేశ వాక్యంగా ఇవ్వబడింది.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పవిత్రమైన ఒక స్థలంలో
  rationale: మూలంలో ‘స్థలం’కు నిర్దిష్ట ఉపపదం లేదు. ‘ఒక’ అనేది అనిర్దిష్టతను స్పష్టం చేస్తుంది; తరువాతి భాగం ఆ స్థలాన్ని ప్రత్యక్ష గుడారపు ప్రాంగణంగా నిర్దేశిస్తుంది.
- source_word: בַּחֲצַר
  choice: ప్రాంగణంలో
  rationale: חצר ప్రత్యక్ష గుడారం చుట్టూ ఉన్న ఆవృత బాహ్య ప్రదేశాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఈ స్థిర పదబంధానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాన్ని ఎంచుకొని, సమావేశం/సన్నిధి భావాన్ని మరియు గుడారపు రూపకాన్ని నిలిపింది.
- source_word: יֹאכְלוּהָ
  choice: వారు దాన్ని తినాలి
  rationale: చివరి క్రియ మొదటి ఆదేశాన్ని పునరుద్ఘాటిస్తూ కర్మప్రత్యయాన్ని కలిగి ఉంది; మూలంలోని పునరుక్తిని తొలగించకుండా ఉంచింది.
theological_decisions:
- issue: పవిత్ర స్థలపు నిర్దిష్టత
  choice: పవిత్రమైన ఒక స్థలంలో
  alternative: పవిత్ర స్థలంలో
  rationale: హీబ్రూలో מקוםకు నిర్దిష్ట ఉపపదం లేదు; తరువాతి ఉపవాక్యమే స్థలాన్ని ప్రాంగణంగా స్పష్టం చేస్తుంది. కాబట్టి అది ఏకైక సాంకేతిక నామమని ముందుగానే నిర్ణయించలేదు.
- issue: מַצּוֹת యొక్క రూపం
  choice: పులియనిదిగా
  alternative: పులియని రొట్టెలుగా
  rationale: మూలం పులియని ఆహార రూపాన్ని నిర్దేశిస్తుంది గాని ఇక్కడ ఆకారం లేదా ప్రత్యేక రొట్టె రకాన్ని తప్పనిసరిగా నిర్ణయించదు; అందువల్ల అతివ్యాఖ్యానం నివారించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఆదేశ స్వరానికి ‘తినాలి’ వాడబడింది. వాక్యం గంభీరంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా నిర్మించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
