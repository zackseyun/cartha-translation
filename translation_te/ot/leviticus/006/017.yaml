  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: וַיְדַבֵּר ... לֵאמֹר అనే సూత్రబద్ధమైన వాక్యారంభాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా అన్నాడు’ అని అందించాం. వావ్ కథన అనుసంధానాన్ని తెలుగులో తప్పనిసరిగా ‘మరియు’ లేదా ‘అప్పుడు’ అని వ్యక్తపరచలేదు; అలా చేస్తే మూలంలో లేని కాలక్రమ బలం చేరవచ్చు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే వ్యక్తి మరియు సంబోధితుని సంబంధాన్ని తెలుగులో సహజంగా ‘మోషేతో అన్నాడు’ అనే నిర్మాణం వ్యక్తపరుస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామం מֹשֶׁהకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపం ‘మోషే’ ఉపయోగించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹרను తెలుగులో సహజమైన ‘ఇలా’తో వ్యక్తపరచాం; ద్వంద్వంగా ‘మాట్లాడుతూ అన్నాడు’ అనకుండా మూల సూత్రార్థాన్ని నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించాం; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్య పరిచయ శైలిని వాడాం. మూలంలోని సూత్రబద్ధమైన וַיְדַבֵּר ... לֵאמֹר నిర్మాణాన్ని పదేపదే అనుకరించి అసహజత కలిగించకుండా ‘ఇలా అన్నాడు’గా సమానార్థకంగా అందించాం.
