id: LEV.6.8
reference: Leviticus 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: te
  text: అతడు ధాన్యార్పణలోనుండి సన్నని పిండిని తన పిడికెడు నిండా, దాని నూనెలో కొంతను తీసుకోవాలి[a]. ధాన్యార్పణపై ఉన్న సాంబ్రాణి అంతటితో కలిపి, దాని జ్ఞాపకార్థ భాగాన్ని[b] యాహ్వేకు ఇంపైన సువాసనగా బలిపీఠం మీద దహించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దానిలోనుంచి తన పిడికెడుతో పైకెత్తి తీసుకోవాలి.” హీబ్రూలోని క్రియ, నామవాచకం కలిసి అర్పణలోని నిర్ణీత పిడికెడు భాగాన్ని తీసే చర్యను నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: “జ్ఞాపకార్థ భాగం” అనేది ధాన్యార్పణకు ప్రాతినిధ్యంగా బలిపీఠంపై దహించే భాగాన్ని సూచించే ప్రత్యేక బలి సంబంధ పదం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים ... בְּקֻמְצוֹ
  choice: తన పిడికెడు నిండా ... తీసుకోవాలి
  rationale: హిఫిల్ క్రియలోని పైకెత్తి వేరుచేసే భావాన్ని సందర్భానుసారంగా ‘తీసుకోవాలి’ అని సహజంగా వ్యక్తం చేసి, בְּקֻמְצוֹ సూచించే నిర్ణీత పిడికెడు పరిమాణాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: ఇది సాధారణ పిండి కాకుండా బలిలో ఉపయోగించే మెత్తగా చేసిన శ్రేష్ఠమైన పిండిని సూచించే ఆరాధనాపరమైన పదం.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని ఈ సందర్భంలో మిన్హా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: וּמִשַּׁמְנָהּ
  choice: దాని నూనెలో కొంతను
  rationale: మִן విభక్తి నూనె అంతటినీ కాక దానిలో కొంత భాగాన్ని తీసుకోవాలని సూచిస్తుంది.
- source_word: כָּל הַלְּבֹנָה
  choice: సాంబ్రాణి అంతటిని
  rationale: לְבֹנָה సాధారణ ధూపం కాదు, ప్రత్యేకంగా frankincense; ‘సాంబ్రాణి’ దానికి సాధారణంగా అర్థమయ్యే తెలుగు పేరు. כָּל వల్ల దానినంతటినీ చేర్చాలి.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద దహించాలి
  rationale: బలి సందర్భంలో ఈ క్రియ అర్పణను బలిపీఠంపై కాల్చి పొగగా పైకి పోనివ్వడాన్ని సూచిస్తుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: దేవునికి అంగీకారమైన అర్పణ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, మూలంలోని స్థిరమైన బలి సంబంధ పదబంధాన్ని నిలుపుతుంది.
- source_word: אַזְכָּרָתָהּ
  choice: దాని జ్ఞాపకార్థ భాగం
  rationale: మొత్తం ధాన్యార్పణకు ప్రాతినిధ్యం వహిస్తూ బలిపీఠంపై దహించే ప్రత్యేక భాగాన్ని సూచించే సాంకేతిక పదం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దేవుని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణ చేసింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా అందిస్తుంది.
- issue: רֵיחַ נִיחֹחַ అనే బలి సంబంధ పదబంధం
  choice: ఇంపైన సువాసన
  alternative: శాంతికరమైన సువాసన
  rationale: అర్పణ దేవునికి అంగీకారమైందనే భావాన్ని తెలియజేస్తుంది; దేవుని శారీరక వాసనానుభూతి గురించి అనవసరమైన సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: אַזְכָּרָה యొక్క ఆరాధనాపరమైన భావం
  choice: జ్ఞాపకార్థ భాగం
  alternative: జ్ఞాపకార్పణ
  rationale: ఇది మొత్తం అర్పణ కాదు, దానిలో బలిపీఠంపై దహించే ప్రాతినిధ్య భాగం అని స్పష్టం చేస్తుంది; ‘జ్ఞాపకం’ ఎవరికి కలుగుతుందనే అంశాన్ని పాఠం తేల్చనందున దానిని విపులీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర సూచనా శైలిని వాడింది. ‘ధాన్యార్పణ,’ ‘బలిపీఠం,’ ‘జ్ఞాపకార్థ భాగం’ వంటి ఆరాధనాపరమైన పదాలను ఖచ్చితత్వం కోసం నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉండేలా రెండు వాక్యాలుగా విభజించింది.
