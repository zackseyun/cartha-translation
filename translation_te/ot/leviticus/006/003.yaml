source:
  edition: WLC
  text: וְ/לָבַ֨שׁ הַ/כֹּהֵ֜ן מִדּ֣/וֹ בַ֗ד וּ/מִֽכְנְסֵי בַד֮ יִלְבַּ֣שׁ עַל בְּשָׂר/וֹ֒ וְ/הֵרִ֣ים אֶת הַ/דֶּ֗שֶׁן אֲשֶׁ֨ר תֹּאכַ֥ל הָ/אֵ֛שׁ אֶת הָ/עֹלָ֖ה עַל הַ/מִּזְבֵּ֑חַ וְ/שָׂמ֕/וֹ אֵ֖צֶל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: te
  text: యాజకుడు తన నార వస్త్రాన్ని ధరించాలి; తన శరీరంపై[a] నార లోదుస్తులను వేసుకోవాలి. బలిపీఠం మీద దహనబలిని అగ్ని దహించగా మిగిలిన బూడిదను[b] తీసి, బలిపీఠం పక్కన ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన మాంసంపై.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది: అక్షరార్థానికి దగ్గరగా, “బలిపీఠంపై అగ్ని దహనబలిని దహించిన బూడిద” అని చెప్పవచ్చు. బూడిదకు, దహనబలికి మధ్య సంబంధాన్ని సందర్భం తెలియజేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: తన నార వస్త్రం
  rationale: యాజక వస్త్ర సందర్భంలో מִדּוֹ ఒక అధికారిక వస్త్రాన్ని సూచిస్తుంది; בַד దాని పదార్థం నార అని తెలియజేస్తుంది. వస్త్రం అనే విస్తృత పదం దాని నిర్దిష్ట ఆకృతిని అనవసరంగా నిర్ణయించదు.
- source_word: מִכְנְסֵי בַד
  choice: నార లోదుస్తులు
  rationale: ఇది శరీరపు దిగువ భాగాన్ని కప్పుతూ చర్మానికి ఆనుకొని ధరించే యాజక వస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో లోదుస్తులు సహజంగా దాని పనిని తెలియజేస్తుంది.
- source_word: עַל בְּשָׂרוֹ
  choice: తన శరీరంపై
  rationale: అక్షరార్థంగా ‘తన మాంసంపై’; ప్రత్యక్షంగా శరీరానికి ఆనుకొని ధరించడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְהֵרִים
  choice: తీసి
  rationale: మూల క్రియకు ‘పైకెత్తు’ అనే అర్థం ఉన్నా, ఇక్కడ బలిపీఠం నుంచి బూడిదను తీసివేసే ఆచార చర్యను సూచిస్తుంది.
- source_word: הַדֶּשֶׁן
  choice: బూడిద
  rationale: బలి అగ్నిలో దహించబడిన తరువాత మిగిలే అవశేషాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: దహనబలిని అగ్ని దహించగా మిగిలిన
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ఈ రూపం అగ్ని దహనబలిని భక్షించడం/దహించడం వల్ల ఏర్పడిన బూడిద అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహించబడే ఈ బలికి తెలుగులో స్థిరమైన, స్పష్టమైన ఆచారపదం.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కన
  rationale: సమీపంలో, ఒక వైపున అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
