  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన ఆచార భాషను వాడాం. విధి సూచనకు ‘ధరించాలి/వేసుకోవాలి/ఉంచాలి’ రూపాలను ఉపయోగించాం; మూలంలోని బూడిద-దహనబలి సంబంధ అస్పష్టతను పాదసూచికలో నిలిపాం.
