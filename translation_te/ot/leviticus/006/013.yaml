id: LEV.6.13
reference: Leviticus 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: te
  text: 'అహరోను మరియు అతని కుమారులు యెహోవాకు సమర్పించవలసిన అర్పణ ఇదే: అతణ్ణి[a] అభిషేకించే రోజున ఏఫాలో పదోవంతు సన్నని పిండితో చేసే క్రమబద్ధమైన ధాన్యార్పణ—దానిలో సగం ఉదయం, సగం సాయంత్రం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ ‘అతణ్ణి’ అనే ఏకవచన సర్వనామం ఉంది; అయితే వాక్యంలో అహరోను, అతని కుమారులు ఇద్దరూ ప్రస్తావించబడ్డారు. సందర్భానుసారంగా, ‘వారి అభిషేక దినాన’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: మూలపాఠంలోని ఏకవచన సర్వనామానికి, బహువచన కర్తకు మధ్య ఉన్న అస్పష్టతను సంరక్షించడం.
lexical_decisions:
- source_word: קָרְבַּן
  choice: అర్పణ
  rationale: బలులు, కానుకలు రెండింటినీ సూచించగల విస్తృత ఆరాధనా పదానికి సహజమైన తెలుగు సమానం.
- source_word: יַקְרִיבוּ
  choice: సమర్పించవలసిన / సమర్పించాలి
  rationale: హిఫీల్ రూపం బలిని దేవుని సన్నిధికి తీసుకువచ్చి విధిగా అర్పించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సమర్పించు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామాన్ని పేరుగా గుర్తించదగిన, తెలుగులో స్థిరపడిన రూపంలో ఉంచుతుంది.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: అతణ్ణి అభిషేకించే రోజున
  rationale: కాలార్థాన్ని, అలాగే మసొరా పాఠంలోని ఏకవచన కర్మ సర్వనామాన్ని పరిష్కరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ఏఫాలో పదోవంతు
  rationale: మూలంలోని కొలమానాన్ని అలాగే ఉంచి, దాని భాగాన్ని సహజమైన తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ధాన్యార్పణకు ఉపయోగించే బాగా శుద్ధిచేసిన పిండిని సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని ఈ ఆరాధనా సందర్భంలో ధాన్యంతో చేసే ప్రత్యేక అర్పణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: תָּמִיד
  choice: క్రమంగా అర్పించే
  rationale: అంతరాయం లేకుండా ఎప్పుడూ మండుతూనే ఉండడం అనే భావం కాకుండా, నిర్దిష్ట సమయాల్లో కొనసాగుతూ జరిగే క్రమబద్ధతను తెలియజేస్తుంది.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: దానిలో సగం ... సగం
  rationale: అర్పణను రెండు సమాన భాగాలుగా విభజించడాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: ఉదయం ... సాయంత్రం
  rationale: హీబ్రూ కాలవాచక పదబంధాలకు సహజమైన ఆధునిక తెలుగు రూపాలు.
theological_decisions:
- issue: ‘అహరోను, అతని కుమారులు’ అనే బహువచన కర్తతో పాటు అభిషేకింపబడే వ్యక్తిని ఏకవచనంలో సూచించడం
  choice: మూలంలోని ఏకవచనాన్ని ‘అతణ్ణి’ అని నిలుపుతూ, దాని అస్పష్టతను పాదటిప్పణిలో తెలియజేయడం
  alternative: భావానుసారంగా ‘వారిని అభిషేకించే రోజున’ అని బహువచనంగా మార్చడం
  rationale: మసొరా పాఠంలో కర్మ సర్వనామం ఏకవచనంలో ఉంది. అది అహరోనును నేరుగా సూచించవచ్చు లేదా అభిషిక్త యాజకుని ప్రతినిధిగా సూచించవచ్చు; అనువాదం ఈ ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఏఫా,’ ‘అభిషేకం,’ ‘ధాన్యార్పణ’ వంటి అవసరమైన బైబిలు పదాలను ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉండేలా తీర్చిదిద్దాం.
