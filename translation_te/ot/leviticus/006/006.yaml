  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: te
  text: బలిపీఠం మీద నిత్యం అగ్ని మండుతూ ఉండాలి[a]; అది ఆరిపోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిపీఠం మీద ఎల్లప్పుడూ అగ్ని మండాలి; అది ఆరిపోకూడదు.”
    reason: תָּמִיד కు “ఎల్లప్పుడూ” అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని చూపుతుంది; תִכְבֶּה యొక్క అకర్మక ‘ఆరిపోవడం’ భావాన్ని మార్పు లేకుండా నిలుపుతుంది.
lexical_decisions:
- source_word: אֵשׁ
  choice: అగ్ని
  rationale: ఇక్కడ బలిపీఠంపై ఉన్న నిజమైన అగ్నినే సూచిస్తుంది. ‘అగ్ని’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్థిరపడిన పదం.
- source_word: תָּמִיד
  choice: నిత్యం
  rationale: నిరంతరంగా కొనసాగవలసిన భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలో కేవలం క్రమం తప్పకుండా అనే బలహీన భావం కాదు.
- source_word: תּוּקַד
  choice: మండుతూ ఉండాలి
  rationale: יקד ధాతువు హోఫాల్ రూపంలోని కొనసాగించే విధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ఎవరో దాన్ని మండేలా ఉంచాలనే బాధ్యత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: స్థానార్థక ఉపసర్గను, నిర్దిష్టమైన బలిపీఠాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: לֹא תִכְבֶּה
  choice: అది ఆరిపోకూడదు
  rationale: నిషేధార్థాన్ని స్పష్టంగా నిలుపుతూ, అగ్ని తనంతట ఆరిపోవడం/ఆర్పబడడం రెండింటినీ సందర్భానుసారంగా తెరిచి ఉంచే సహజ తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘మండుతూ ఉండాలి’ కొనసాగింపును, ‘ఆరిపోకూడదు’ నిషేధాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తాయి.
