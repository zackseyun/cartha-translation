id: LEV.6.2
reference: Leviticus 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: te
  text: '“అహరోనుకు, అతని కుమారులకు ఇలా ఆజ్ఞాపించు: ‘దహనబలి గురించిన నియమం[a] ఇదే: దహనబలి బలిపీఠం మీదనున్న అగ్నిస్థలంపై రాత్రంతా ఉదయం వరకు ఉండాలి. బలిపీఠం మీద అగ్ని మండుతూనే ఉండేలా ఉంచాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దహనబలి గురించిన ఉపదేశం ఇదే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించు
  rationale: ఇది צוה ధాతువు యొక్క ఆజ్ఞార్థక రూపం. మూలంలోని ప్రత్యక్షమైన ఆజ్ఞాబలాన్ని ‘ఆజ్ఞాపించు’ స్పష్టంగా నిలుపుతుంది.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: ఆహారోనుకు, అతని కుమారులకు
  rationale: యాజక సేవ సందర్భంలో בנים పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సందర్భోచితం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తెలుగులో ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా ఆజ్ఞాపించు’ అని అనువదించబడింది.
- source_word: זֹאת תּוֹרַת
  choice: గురించిన నియమం ఇదే
  rationale: ఈ బలి సంబంధ శాసన సందర్భంలో תּוֹרָה నిర్దేశించిన నియమాన్ని సూచిస్తుంది. ‘నియమం’ ఆధునిక తెలుగులో సహజంగా ఉండి, న్యాయపరమైన ధోరణిని నిలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా అగ్నికి అర్పించే ఈ బలికి తెలుగులో స్థిరపడిన, సులభంగా అర్థమయ్యే పదం.
- source_word: הִוא הָעֹלָה
  choice: దహనబలి
  rationale: హీబ్రూలో సర్వనామంతో నామవాచకాన్ని మళ్లీ చెప్పడం విషయాన్ని ముందుకు తెస్తుంది. తెలుగులో వాక్యారంభంలో ‘దహనబలి’ని ఉంచడం ద్వారా ఆ ప్రాధాన్యం సహజంగా వ్యక్తమవుతుంది.
- source_word: עַל מוֹקְדָה
  choice: అగ్నిస్థలంలో
  rationale: מוֹקְדָה బలిపీఠంలోని మండే స్థలం లేదా అగ్నికుండాన్ని సూచిస్తుంది. ‘అగ్నిస్థలం’ మూలంలోని స్థల భావాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమవుతుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీదున్న
  rationale: అగ్నిస్థలం బలిపీఠం మీద ఉందనే స్థాన సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: రాత్రంతా ఉదయం వరకు
  rationale: హీబ్రూ కాలవ్యాప్తిని, ముగింపు బిందువును క్రమంగా నిలుపుతుంది.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: బలిపీఠపు అగ్ని దానిమీద మండుతూనే ఉండేలా చూడాలి
  rationale: יקד యొక్క హోఫల్ రూపం అగ్నిని కొనసాగిస్తూ ఉంచాలనే విధిని సూచిస్తుంది. ‘మండుతూనే ఉండేలా చూడాలి’ ఆ నిరంతర నిర్వహణ భావాన్ని అందిస్తుంది; ‘దానిమీద’ בוֹ యొక్క సంక్షిప్త సూచనను అనవసరంగా నిర్ధారించకుండా నిలుపుతుంది.
theological_decisions:
- issue: బలి శాసనంలో תּוֹרָה అనువాదం
  choice: నియమం
  alternative: ఉపదేశం / ధర్మశాసనం
  rationale: ఇక్కడ పదం మొత్తం మోషే ధర్మశాస్త్రానికి శీర్షికగా కాక, దహనబలి నిర్వహణకు సంబంధించిన నిర్దేశిత నియమంగా పనిచేస్తుంది. ‘నియమం’ ఈ పరిమిత సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: బలిపీఠపు అగ్ని గురించిన ఆజ్ఞ స్వభావం
  choice: మండుతూనే ఉండేలా చూడాలి
  alternative: మండాలి
  rationale: మూల క్రియారూపం అగ్ని కేవలం మండుతున్నదని వర్ణించదు; దాన్ని మండేలా కొనసాగించాలనే బాధ్యతను సూచిస్తుంది.
- issue: בוֹ సర్వనామ సూచన
  choice: దానిమీద
  alternative: బలిపీఠం మీద / దహనబలి మీద
  rationale: హీబ్రూ సంక్షిప్త సూచనకు సంబంధించి ముందున్న బలిపీఠం, అగ్నిస్థలం లేదా బలి సందర్భం పరిగణనలోకి రావచ్చు. అనువాదం ఒక సూచనను సిద్ధాంతపరంగా బలవంతంగా నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార శాసనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకునికి అర్థమయ్యే పదజాలంతోనూ రూపొందించబడింది. ప్రత్యక్ష ఆజ్ఞ యొక్క బలాన్ని నిలుపుతూ, హీబ్రూ మూలంలోని అగ్నిస్థలం మరియు సర్వనామ సూచనకు సంబంధించిన స్వల్ప అస్పష్టతను పాదసూచిక మరియు సంక్షిప్త రూపం ద్వారా కాపాడింది.
