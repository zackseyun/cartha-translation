  to: '“అహరోనుకు, అతని కుమారులకు ఇలా ఆజ్ఞాపించు: ‘దహనబలి గురించిన నియమం[a] ఇదే: దహనబలి బలిపీఠం మీదనున్న అగ్నిస్థలంపై రాత్రంతా ఉదయం వరకు ఉండాలి. బలిపీఠం మీద అగ్ని మండుతూనే ఉండేలా ఉంచాలి.’”'
  rationale: చివరి నిర్దేశంలో ఉన్న అస్పష్టమైన తెలుగు సర్వనామాన్ని తొలగించి, బలిపీఠంపై అగ్ని నిరంతరం మండేలా నిర్వహించాలనే హోఫల్ క్రియారూపపు భావాన్ని స్పష్టంగా అనువదించాము. అలాగే, బలి అగ్నిస్థలంపై ఉండే స్థానసంబంధాన్ని ‘అగ్నిస్థలంపై’ ద్వారా కచ్చితంగా చేశాము. పాదసూచికలలోని ప్రత్యామ్నాయ పదార్థం మరియు గుర్తులు భద్రపరచబడ్డాయి.
