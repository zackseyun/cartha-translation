id: LEV.20.14
reference: Leviticus 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: te
  text: ఒక పురుషుడు ఒక స్త్రీని, ఆమె తల్లిని తీసుకుంటే[a], అది నీచకార్యం[b]. అతనినీ వారిద్దరినీ అగ్నిలో కాల్చాలి[c], మీ మధ్య నీచకార్యం ఉండకుండేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక స్త్రీని, ఆమె తల్లిని పెళ్లి చేసుకుంటే.” ‘తీసుకుంటే’ అని అనువదించిన హీబ్రూ క్రియ న్యాయపరమైన సందర్భాల్లో వివాహాన్ని సూచించవచ్చు; అయితే ఇక్కడ వివాహం స్పష్టంగా పేర్కొనబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దుష్టకార్యం,” “అశ్లీలకార్యం,” లేదా “ఘోరమైన అపరాధం.” హీబ్రూ పదం తీవ్రమైన లైంగిక దుష్కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “వారిద్దరినీ” అంటే ఆ స్త్రీని, ఆమె తల్లిని.
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; ఈ నియమంలో తప్పు చేసిన పురుషుణ్ణి సూచిస్తుంది.
- source_word: יִקַּח
  choice: తీసుకుంటే
  rationale: לקח యొక్క ప్రాథమిక అర్థం ‘తీసుకోవడం.’ ఈ న్యాయపరమైన లైంగిక సందర్భంలో వివాహం లేదా భార్యగా స్వీకరించడం సూచించవచ్చు; అయితే మూలపాఠం వివాహాన్ని స్పష్టంగా పేర్కొననందున విస్తృతమైన పదప్రయోగాన్ని నిలిపాం.
- source_word: אִשָּׁה
  choice: ఒక స్త్రీని
  rationale: אִשָּׁה అంటే ‘స్త్రీ’ లేదా ‘భార్య’ కావచ్చు. వైవాహిక స్థితిని మూలపాఠం స్పష్టంగా నిర్దేశించనందున ‘స్త్రీ’ అని అనువదించాం.
- source_word: אִמָּהּ
  choice: ఆమె తల్లిని
  rationale: ఇది ముందు పేర్కొన్న స్త్రీకి సంబంధించిన తల్లిని సూచించే స్పష్టమైన స్వామ్య నిర్మాణం.
- source_word: זִמָּה
  choice: నీచకార్యం
  rationale: లేవీయకాండంలోని లైంగిక నియమాల్లో זִמָּה తీవ్రమైన నైతిక దుష్కార్యాన్ని లేదా ఘోరమైన లైంగిక అతిక్రమాన్ని సూచిస్తుంది. ‘నీచకార్యం’ ఆధునిక తెలుగులో దాని తీవ్రమైన నైతిక స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּאֵשׁ
  choice: అగ్నితో
  rationale: ఇక్కడ בְּ సాధనార్థకంగా ఉంది; శిక్ష అగ్ని ద్వారా అమలవుతుందని తెలియజేస్తుంది.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: అతణ్ణీ వారిద్దరినీ అగ్నితో కాల్చాలి
  rationale: హీబ్రూలో క్రియ తృతీయ పురుష బహువచన కర్తరి రూపంలో ఉండి, పురుషుణ్ణి మరియు ఇద్దరు స్త్రీలను కర్మలుగా పేర్కొంటుంది. తెలుగులో ‘కాల్చాలి’ న్యాయవిధిని సహజంగా వ్యక్తం చేస్తుంది; ‘వారిద్దరినీ’ స్త్రీ మరియు ఆమె తల్లి ఇద్దరినీ స్పష్టం చేస్తుంది.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: అప్పుడు మీ మధ్య అలాంటి నీచకార్యం ఉండదు
  rationale: ఈ వాక్యం శిక్ష యొక్క ఉద్దేశిత ఫలితాన్ని సూచిస్తుంది. ‘మీ మధ్య’ בְּתוֹכְכֶםకు సహజమైన తెలుగు; ‘అలాంటి’ పదం ముందున్న కార్యాన్ని తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: ‘ఒక స్త్రీని, ఆమె తల్లిని తీసుకోవడం’ అనే మాట సూచించే సంబంధ స్వభావం
  choice: వివాహమని నిర్దిష్టంగా చెప్పకుండా ‘తీసుకుంటే’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ఒక స్త్రీని, ఆమె తల్లిని పెళ్లి చేసుకుంటే’
  rationale: לקח న్యాయపరమైన సందర్భాల్లో వివాహాన్ని సూచించగలదు; అయినా మూలపాఠంలో ప్రత్యేకమైన వివాహ పదం లేదు. అందువల్ల మూలంలోని అస్పష్టతను నిలిపాం.
- issue: శిక్షా వాక్య నిర్మాణం
  choice: ‘అతణ్ణీ వారిద్దరినీ అగ్నితో కాల్చాలి’ అనే కర్తరి భావంగల న్యాయవిధి
  alternative: ‘అతడూ వారిద్దరూ అగ్నిలో కాల్చబడాలి’
  rationale: హీబ్రూ క్రియ కర్తరి బహువచన రూపంలో ఉంది. తెలుగులో తెలియని కర్తను పేర్కొనకుండా ‘కాల్చాలి’ అనడం కర్తరి న్యాయవిధి భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని వాడాం. ‘పురుషుడు,’ ‘స్త్రీ,’ ‘నీచకార్యం,’ ‘అగ్నితో కాల్చాలి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని తీవ్రతను తగ్గించవు. వివాహార్థం మరియు זִמָּה పదంలోని భావవ్యాప్తిని పాదటిప్పణుల్లో నిలిపాం.
