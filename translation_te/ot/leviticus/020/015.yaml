id: LEV.20.15
reference: Leviticus 20:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: te
  text: ఒక పురుషుడు జంతువుతో లైంగిక సంభోగం చేస్తే,[a] అతనికి తప్పక మరణశిక్ష విధించాలి; ఆ జంతువును మీరు చంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “జంతువుతో తన శయనాన్ని ఇస్తే”; ఇది లైంగిక సంభోగాన్ని సూచించే హీబ్రూ జాతీయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: ఇది పురుషలింగ ఏకవచన నామవాచకం; తరువాతి వచనం స్త్రీ చేసిన కార్యాన్ని వేరుగా ప్రస్తావిస్తుంది కాబట్టి ఇక్కడ పురుషుని నిర్దిష్టంగా సూచించడం సముచితం.
- source_word: אֲשֶׁר
  choice: పెట్టుకుంటే
  rationale: పదశః సంబంధసూచక అవ్యయమైనప్పటికీ, న్యాయనియమ శైలిలో షరతును తెలుగులో సహజంగా తెలియజేయడానికి ‘-తే’ రూపం వాడబడింది.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: లైంగిక సంబంధం పెట్టుకుంటే
  rationale: పదశః ‘తన శయనాన్ని ఇస్తే’ అనే హీబ్రూ జాతీయాన్ని, కార్య స్వభావం ఆధునిక పాఠకునికి స్పష్టంగా ఉండేలా సహజ తెలుగులో అనువదించాం.
- source_word: בִּבְהֵמָה
  choice: జంతువుతో
  rationale: בְּהֵמָה ఇక్కడ జంతువును సూచిస్తుంది; ‘మృగం’ కంటే ‘జంతువు’ విస్తృతమైనదీ ఆధునిక తెలుగులో స్పష్టమైనదీ.
- source_word: מוֹת יוּמָת
  choice: అతనికి తప్పక మరణశిక్ష విధించాలి
  rationale: క్రియార్థక నామరూపం మరియు పరిమిత క్రియ కలయికలోని ఉద్ఘాటనను ‘తప్పక’ నిలుపుతుంది; న్యాయపరమైన మరణదండన భావాన్ని ‘మరణశిక్ష విధించాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: ఆ జంతువును కూడా మీరు చంపాలి
  rationale: బహువచన ద్వితీయ పురుష క్రియను ‘మీరు’గా నిలిపాం. ‘కూడా’ అనేది మనిషితో పాటు జంతువుపైనా ఆజ్ఞ వర్తిస్తుందని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపరాధి లింగ నిర్దిష్టత
  choice: పురుషుని నిర్దిష్టంగా సూచించే ‘ఒక పురుషుడు’
  alternative: లింగసామాన్యమైన ‘ఒక వ్యక్తి’
  rationale: మూలంలో אִישׁ పురుషుని సూచిస్తుంది; తరువాతి వచనం స్త్రీ విషయాన్ని విడిగా పేర్కొనడం వల్ల ఈ వచన నిర్మాణంలోని లింగ నిర్దిష్టతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన న్యాయశైలి వాడబడింది. లైంగిక కార్యాన్ని అస్పష్టంగా చేయకుండా, అనవసరంగా గ్రాఫిక్‌గా కాకుండా వ్యక్తపరిచాం; మూలంలోని ఉద్ఘాటిత మరణదండన మరియు సమాజాన్ని ఉద్దేశించిన బహువచన ఆజ్ఞ రెండూ నిలుపబడ్డాయి.
