  verdict: revise
  source_fidelity: The draft correctly preserves the male-specific offender, the conditional legal formulation, the emphatic death penalty, and the second-person-plural command to kill the animal. The proposed wording renders the sexual idiom more precisely as a discrete act rather than potentially suggesting an ongoing ‘relationship.’
