source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: te
  text: కాబట్టి మీరు శుద్ధమైన జంతువుకూ అశుద్ధమైన జంతువుకూ మధ్య, అశుద్ధమైన పక్షికీ శుద్ధమైన పక్షికీ మధ్య భేదం చేయాలి. జంతువువల్లగాని, పక్షివల్లగాని, నేలపై పాకే దేనివల్లగాని మిమ్మల్ని మీరు[b] అసహ్యకరులుగా[a] చేసుకోకూడదు. వీటిని నేను మీ కొరకు అశుద్ధమైనవిగా వేరుచేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు హేయులుగా చేసుకోకూడదు.’ ఇక్కడి హీబ్రూ క్రియ ‘అసహ్యమైనది’ లేదా ‘హేయమైనది’ అనే భావవర్గానికి చెందుతుంది; ఇది సాధారణంగా ‘అశుద్ధం కావడం’ కోసం వాడే పదం కాదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాచ్యంగా, ‘మీ ప్రాణాలను’ లేదా ‘మీ వ్యక్తులను’; ఈ నుడికారం ‘మిమ్మల్ని మీరు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: కాబట్టి మీరు ... భేదం చూపాలి
  rationale: בדל హిఫీల్ రూపం వర్గాల మధ్య భేదాన్ని గుర్తించి పాటించడాన్ని సూచిస్తుంది. సందర్భ సంబంధాన్ని ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది.
- source_word: הַבְּהֵמָה
  choice: జంతువు
  rationale: ఈ సందర్భంలో భూజంతువుల విస్తృత వర్గాన్ని సూచించే ఆధునిక, సాధారణ పదం.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: శుద్ధమైన / అశుద్ధమైన
  rationale: లేవీయకాండంలోని ఆహార, ఆచార సంబంధ వర్గాలను నైతికీకరించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: הָעוֹף
  choice: పక్షి
  rationale: עוֹף పదానికి విస్తృత భావం ఉండగలిగినా, ఈ ఆహార నియమ సందర్భంలో ‘పక్షి’ సహజమైన ఎంపిక.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: అసహ్యులుగా చేసుకోకూడదు
  rationale: שׁקץ పదమూలంలోని అసహ్యం/హేయత భావాన్ని నిలుపుతుంది; దాన్ని טמא అనే ‘అశుద్ధం’ పదంతో కలిపివేయదు.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు
  rationale: ఇక్కడ נפשׁ మొత్తం వ్యక్తిని సూచించే హీబ్రూ ప్రయోగం; ‘మీ ఆత్మలను’ అనడం అనవసరమైన శరీర–ఆత్మ విభజనను సూచించవచ్చు.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: నేలపై పాకే దేనివల్లగాని
  rationale: רמשׂ నేలకు దగ్గరగా కదలడం లేదా పాకడాన్ని సూచిస్తుంది; ‘పాకే’ అనేది సహజంగా, విస్తృతంగా ఉంది.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: నేను మీ కోసం అశుద్ధమైనవిగా వేరుచేసిన
  rationale: దేవుడు ఇశ్రాయేలు కోసం చేసిన వర్గీకరణను తెలియజేస్తూ בדל పదమూలాన్ని ‘వేరుచేసిన’ రూపంలో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఆచార సంబంధ వర్గీకరణను నైతిక అపవిత్రతగా మార్చే అవకాశం
  choice: శుద్ధమైన / అశుద్ధమైన
  alternative: పవిత్రమైన / అపవిత్రమైన
  rationale: వాక్యం ఇశ్రాయేలుకు నిర్దేశించిన ఆహార, ఆచార పరిశుద్ధత వర్గాల గురించి మాట్లాడుతుంది; అనవసరమైన నైతిక లేదా ఆరోగ్యపరమైన వ్యాఖ్యానాన్ని చేర్చదు.
- issue: אֶת נַפְשֹׁתֵיכֶם లో נפשׁ అర్థం
  choice: మిమ్మల్ని మీరు
  alternative: మీ ప్రాణాలను / మీ ఆత్మలను
  rationale: ఈ హీబ్రూ ప్రయోగంలో נפשׁ వ్యక్తులనే సూచిస్తుంది; ప్రత్యేకమైన ద్వైత మానవశాస్త్రాన్ని వాక్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘శుద్ధమైన/అశుద్ధమైన’ అనే లేవీయకాండ ఆచార వర్గీకరణను స్థిరంగా ఉంచి, שׁקץ యొక్క ‘అసహ్యం’ భావాన్ని దానితో కలపలేదు. మూలార్థానికి అనుగుణంగా పాదసూచికలు సంబంధిత పదబంధం వెంట ఉంచబడ్డాయి.
