source:
  edition: WLC
  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: te
  text: ఎవరైనా తన తండ్రినైనా తన తల్లినైనా శపిస్తే, అతనికి తప్పకుండా మరణశిక్ష విధించాలి. అతడు తన తండ్రినైనా తన తల్లినైనా శపించాడు; తన మరణానికి తానే బాధ్యుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “అతని రక్తం అతనిమీదే.” ఇది అతని మరణానికి బాధ్యత అతనిదేనని తెలిపే న్యాయపరమైన నుడికారం. రెండవ వాక్యంలో మూలభాషలో “తన తండ్రిని మరియు తన తల్లిని” అని ఉంది; ఇక్కడ “తండ్రినైనా తల్లినైనా” అనేది ఎవరిని శపించినా ఈ న్యాయశిక్ష వర్తిస్తుందనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִישׁ אִישׁ
  choice: ఎవరైనా
  rationale: ద్విరుక్తమైన אִישׁ אִישׁ ఇక్కడ పంపిణీ భావంతో ‘ఎవరైనా’ అని అర్థం; సహజమైన ఆధునిక తెలుగులో న్యాయనియమపు సాధారణ వర్తింపును ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְקַלֵּל / קִלֵּל
  choice: శపిస్తే / శపించాడు
  rationale: పీయేల్ రూపంలోని קלל ఈ సందర్భంలో కేవలం అగౌరవపరచడం కాక, తల్లిదండ్రులపై శాపవాక్యం పలకడాన్ని సూచిస్తుంది.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: తన తండ్రినిగాని తన తల్లినిగాని
  rationale: హీబ్రూలో ‘మరియు’ ఉన్నప్పటికీ, శిక్ష తల్లిదండ్రుల్లో ఎవరిని శపించినా వర్తిస్తుందనే పంపిణీ న్యాయభావాన్ని తెలుగు ‘గాని…గాని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מוֹת יוּמָת
  choice: అతనికి తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియానామం మరియు పరిమిత క్రియ కలయికలోని నిశ్చయాత్మక బలాన్నీ, హోఫాల్ రూపంలోని న్యాయపరమైన కర్మణి భావాన్నీ ఈ అనువాదం నిలుపుతుంది.
- source_word: דָּמָיו בּוֹ
  choice: తన మరణానికి తానే బాధ్యుడు
  rationale: అక్షరార్థమైన ‘అతని రక్తాలు అతనిమీద’ అనే న్యాయపరమైన నుడికారం, అతనికి విధించబడే మరణానికి బాధ్యత అతనిదేనని సూచిస్తుంది; ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేందుకు అర్థానువాదం చేశాం.
theological_decisions:
- issue: אִישׁ אִישׁ లోని లింగసూచక పంపిణీ ప్రయోగం
  choice: ఎవరైనా
  alternative: ఏ పురుషుడైనా
  rationale: ఈ న్యాయసూత్రంలో పురుషలింగ ఏకవచనం సాధారణ వ్యక్తిని సూచించే పంపిణీ ప్రయోగం. ‘ఎవరైనా’ దాని వర్తింపును సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా పురుషులకు మాత్రమే పరిమితం చేస్తుందని పాఠం చెప్పదు.
- issue: דָּמָיו בּוֹ అనే బాధ్యతా సూత్రం
  choice: తన మరణానికి తానే బాధ్యుడు
  alternative: అతని రక్తం అతనిమీదే ఉంటుంది
  rationale: ఇది మరణశిక్షకు దారితీసిన అపరాధ బాధ్యత అపరాధిదేనని తెలిపే న్యాయసూత్రం. పాఠంలో లేని ప్రాయశ్చిత్త లేదా అధిభౌతిక భావాలను ఇందులో చేర్చలేదు.
- issue: రెండవ אָבִיו וְאִמּוֹ లో సంధి భావం
  choice: తన తండ్రిని లేదా తన తల్లిని
  alternative: తన తండ్రిని, తన తల్లిని
  rationale: మసొరేటిక్ పాఠంలో ‘మరియు’ ఉన్నా, ముందటి న్యాయనిబంధనను కారణంగా పునరుద్ఘాటించే ఈ వాక్యంలో అపరాధం తల్లిదండ్రుల్లో ఎవరి మీద జరిగినా శిక్ష వర్తిస్తుంది. అందువల్ల తెలుగులో ‘లేదా’ న్యాయభావాన్ని స్పష్టం చేస్తుంది; మూలంలోని రూపాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన న్యాయశైలి. ‘మరణశిక్ష విధించాలి’ అనేది న్యాయపరమైన కర్మణి భావాన్ని సహజంగా అందిస్తుంది. మూలంలోని నుడికారాన్ని ప్రధాన పాఠంలో అర్థవంతంగా అనువదించి, అక్షరరూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
