  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: te
  text: నేను మీ ఎదుటనుండి వెళ్లగొడుతున్న[a] ఆ జనాంగపు ఆచారాల[b] ప్రకారం మీరు నడుచుకోకూడదు. వారు ఇవన్నీ చేశారు కాబట్టి నేను వారిని అసహ్యించుకున్నాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘మీ ఎదుటనుండి పంపివేస్తున్న’; ఇక్కడ దేశం నుండి వెళ్లగొట్టడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నియమాల’; హీబ్రూ పదం స్థిరపరచబడిన ఆచారాలను లేదా విధులను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారిపట్ల విసుగుచెందాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: నడుచుకోకూడదు
  rationale: הלך అనే పదానికి ప్రాథమికంగా ‘నడుచు/వెళ్లు’ అనే అర్థం ఉంది; ఇక్కడ అది ప్రవర్తనను సూచించే నైతిక రూపకం. ‘ప్రకారం నడుచుకోవడం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: בְּחֻקֹּת
  choice: ఆచారాల ప్రకారం
  rationale: חֻקּוֹת స్థిరపరచబడిన నియమాలు, విధులు లేదా ఆచరణలను సూచించగలదు. ఈ సందర్భంలో ఆ జనాంగం పాటించిన స్థిరమైన ఆచరణలే ఉద్దేశం; అందువల్ల ‘ఆచారాలు’ సహజంగా ఉంది, కాగా పాదసూచికలో ‘నియమాలు’ అనే ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: הַגּוֹי
  choice: ఆ జనాంగపు
  rationale: గోయ్ ఇక్కడ ఏకవచనంలో, దేశం నుండి తొలగించబడబోయే ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది. ‘జనాంగం’ ఈ సామూహిక భావాన్ని తెలియజేస్తూ తరువాతి కాలపు ‘అన్యజనులు’ అనే మతపరమైన ఛాయను దిగుమతి చేయదు.
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: మీ ఎదుటనుండి వెళ్లగొడుతున్న
  rationale: శబ్దార్థంగా ‘మీ సన్నిధి నుండి పంపివేస్తున్న’ అయినా, భూమి నుండి బహిష్కరించే సందర్భంలో ‘వెళ్లగొడుతున్న’ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: వారు ఇవన్నీ చేశారు కాబట్టి
  rationale: כִּי ఇక్కడ కారణాన్ని తెలియజేస్తుంది. ‘ఇవన్నీ’ ముందటి వచనాల్లో పేర్కొన్న నిషిద్ధ కార్యాలను తిరిగి సూచిస్తుంది.
- source_word: וָאָקֻץ בָּם
  choice: నేను వారిని అసహ్యించుకున్నాను
  rationale: קוץ బలమైన విరక్తి లేదా అసహ్యాన్ని వ్యక్తం చేస్తుంది; בָּם ఆ విరక్తికి గురైన వారిని సూచిస్తుంది. ఈ అనువాదం భావబలాన్ని తగ్గించకుండా ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: దేవుని నైతిక విరక్తిని ఎంత బలంగా వ్యక్తం చేయాలి
  choice: నేను వారిని అసహ్యించుకున్నాను
  alternative: నేను వారిపట్ల విసుగుచెందాను
  rationale: హీబ్రూ క్రియ బలమైన విరక్తిని వ్యక్తం చేస్తుంది. దానిని కేవలం ‘ఇష్టపడలేదు’ అని మృదువుచేయకుండా, అలాగే మూలపాఠాన్ని మించి సిద్ధాంతపరంగా విస్తరించకుండా ‘అసహ్యించుకున్నాను’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘ప్రకారం నడుచుకోవడం’ అనే ప్రయోగం హీబ్రూ నడక-ప్రవర్తన రూపకాన్ని సహజంగా నిలుపుతుంది. ‘జనాంగం’ ఏకవచన సామూహిక సూచనను కాపాడుతుంది; ‘అన్యజనులు’ వంటి తరువాతి మతపరమైన పదప్రయోగాన్ని నివారిస్తుంది.
