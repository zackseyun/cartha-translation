id: LEV.20.11
reference: Leviticus 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: te
  text: ఒక పురుషుడు తన తండ్రి భార్యతో లైంగిక సంబంధం కలిగితే, అతడు తన తండ్రి నగ్నతను వెలికితీశాడు[a]. వారిద్దరికీ తప్పక మరణశిక్ష విధించబడాలి; వారి రక్తం వారిమీదే ఉంటుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు తన తండ్రి నగ్నతను వెలికితీశాడు.” లేవీయకాండంలో ఇది నిషేధిత లైంగిక ఉల్లంఘనను సూచించే స్థిరమైన జాతీయం; భావానువాదంగా, “అతడు తన తండ్రిని లైంగికంగా అవమానించాడు” అని చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారి రక్తం వారిమీదే ఉంటుంది” అనేది వారి మరణానికి బాధ్యత వారిపైనే ఉందని తెలిపే హీబ్రూ న్యాయసూత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు ... కలిస్తే
  rationale: న్యాయసూత్రంలోని షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, పురుష లింగంలోని నిర్దిష్ట న్యాయవిషయాన్ని నిలుపుతుంది.
- source_word: יִשְׁכַּב אֶת
  choice: లైంగికంగా కలిస్తే
  rationale: ఈ సందర్భంలో శయనించడం లైంగిక సంభోగాన్ని సూచిస్తుంది. తెలుగు 'పడుకుంటే' అస్పష్టంగా ఉండవచ్చు కాబట్టి అర్థాన్ని స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేసింది.
- source_word: אֵשֶׁת אָבִיו
  choice: తన తండ్రి భార్యతో
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా అనుసరిస్తుంది; 'సవతి తల్లి' అని అనువదించి మూలంలో లేని మరింత సంకుచిత బంధుత్వపదాన్ని చేర్చదు.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: తన తండ్రి మానాన్ని విప్పినవాడవుతాడు
  rationale: లేవీయకాండంలోని స్థిరమైన 'నగ్నతను విప్పడం' అనే లైంగిక నిషేధ జాతీయాన్ని తెలుగులో సహజంగా వినిపించే 'మానం'తో నిలుపుతుంది; ఇది తండ్రికి సంబంధించిన లైంగిక హద్దు ఉల్లంఘనను సూచిస్తుంది.
- source_word: מוֹת יוּמְתוּ
  choice: తప్పక మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో బలపరచబడిన మరణదండన ఆజ్ఞను స్పష్టమైన ఆధునిక న్యాయభాషలో వ్యక్తం చేస్తుంది; శిక్ష అమలు విధానాన్ని అదనంగా నిర్దేశించదు.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరికీ
  rationale: శిక్ష ఇద్దరికీ వర్తిస్తుందని మూలంలోని స్పష్టమైన ద్వివచన భావాన్ని నిలుపుతుంది.
- source_word: דְּמֵיהֶם בָּם
  choice: వారి రక్తం వారిమీదే ఉంటుంది
  rationale: వారి మరణానికి బాధ్యత వారిపైనే ఉందని తెలిపే హీబ్రూ న్యాయసూత్రాన్ని రూపకంతో సహా నిలుపుతుంది.
theological_decisions:
- issue: లైంగిక నిషేధ జాతీయాన్ని అనువదించడం
  choice: తన తండ్రి మానాన్ని విప్పినవాడవుతాడు
  alternative: తన తండ్రిని లైంగికంగా అవమానించినవాడవుతాడు
  rationale: వివరణాత్మక ప్రత్యామ్నాయం అర్థాన్ని సులభతరం చేసినా, మూలంలోని స్థిర రూపకాన్ని మరియు లేవీయకాండం 18–20 అధ్యాయాలతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని తగ్గిస్తుంది. ప్రధాన పాఠం రూపకాన్ని నిలిపి, పాదటిప్పణి దాని అర్థాన్ని వివరిస్తుంది.
- issue: న్యాయవిషయపు లింగ నిర్దిష్టత
  choice: ఒక పురుషుడు
  alternative: ఎవరైనా
  rationale: హీబ్రూ పాఠం పురుష నేరస్థుణ్ణి నిర్దిష్టంగా ఉద్దేశిస్తుంది; లింగతటస్థీకరణ మూలంలోని న్యాయ నిర్మాణాన్ని మార్చుతుంది.
- issue: మరణదండన బాధ్యతను సూచించే సూత్రం
  choice: వారి రక్తం వారిమీదే ఉంటుంది
  alternative: తమ మరణానికి వారే బాధ్యులు
  rationale: మూలంలోని న్యాయరూపకాన్ని నిలుపుతూ దాని కఠిన నైతిక-న్యాయ భావాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. 'లైంగికంగా కలిస్తే' సామాన్య పాఠకునికి స్పష్టంగా ఉండగా అసభ్యతను నివారిస్తుంది. 'మానం విప్పడం' మూల రూపకాన్ని కొంత సహజీకరించి నిలుపుతుంది; అక్షరార్థాన్ని పాదటిప్పణి అందిస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
