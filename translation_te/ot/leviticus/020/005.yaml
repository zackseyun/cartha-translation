source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: te
  text: అప్పుడు నేనే ఆ మనిషికీ అతని కుటుంబానికీ విరోధంగా నా ముఖాన్ని నిలిపి, అతణ్ణీ, అతని వెంబడి వ్యభిచారం చేస్తూ మోలెకు వెంబడి వ్యభిచారం చేసేవారందరినీ వారి ప్రజల మధ్యనుండి తొలగిస్తాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యభిచారం చేసేవారు’ అని అనువదించిన హీబ్రూ పదం లైంగిక అవిశ్వాసాన్ని సూచిస్తుంది; ఇక్కడ అది విగ్రహారాధన ద్వారా దేవునికి అవిశ్వాసంగా ఉండటానికి రూపకం.
    reason: lexical_alternative
  - marker: b
    text: ‘తొలగిస్తాను’ అనేది ఒడంబడిక తీర్పును సూచించే మాట. అది మరణం ద్వారానా, సమాజం నుండి బహిష్కరణ ద్వారానా, లేక మరొక విధమైన దైవిక తొలగింపు ద్వారానా జరుగుతుందో ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: అప్పుడు నేనే ... విరోధంగా నా ముఖాన్ని తిప్పి
  rationale: దేవుడు ఉద్దేశపూర్వకంగా ఒకరికి విరోధంగా నిలబడటాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; אֲנִי లోని ఉద్ఘాటనను ‘నేనే’ తెలియజేస్తుంది.
- source_word: בָּאִישׁ הַהוּא וּבְמִשְׁפַּחְתּוֹ
  choice: ఆ మనిషికీ అతని కుటుంబానికీ
  rationale: אִישׁ యొక్క పుంలింగ ఏకవచన భావాన్ని ‘మనిషి’ నిలుపుతుంది; מִשְׁפָּחָה కుటుంబం లేదా విస్తృత బంధువర్గాన్ని సూచించగలిగినా, ‘కుటుంబం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: అతణ్ణి ... తొలగిస్తాను
  rationale: כרת హిఫిల్ రూపంలోని నిబంధనాత్మక తీర్పు భావాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తూ, అది మరణమా, బహిష్కరణమా, లేక మరొక దైవిక తొలగింపా అన్నది నిర్దిష్టం చేయదు.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: అతని వెంట వ్యభిచరించేవారందరినీ—మోలెకు వెంట వ్యభిచరించేవారిని—
  rationale: זנה లోని లైంగిక అవిశ్వాస రూపకాన్ని ‘వ్యభిచరించు’తో నిలుపుతుంది. אַחֲרָיו ను ‘అతని వెంట’గా అనువదించడం అతని మాదిరిని అనుసరించే భావాన్ని కాపాడుతుంది; పునరుక్తి హీబ్రూ వాక్యంలోని వాక్చాతుర్యాన్ని ప్రతిబింబిస్తుంది.
- source_word: הַמֹּלֶךְ
  choice: మోలెకు
  rationale: ఈ సందర్భంలో ఇది బలులతో సంబంధమున్న దేవతా నామంగా గ్రహించబడుతుంది; తెలుగులో ప్రాచుర్యమైన లిప్యంతరీకరణను వాడింది.
- source_word: מִקֶּרֶב עַמָּם
  choice: వారి ప్రజల మధ్య నుండి
  rationale: עַמָּם లోని బహువచన ప్రత్యయాన్ని ‘వారి’గా నిలుపుతూ, సమాజం మధ్యనుండి తొలగింపబడే భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు లైంగిక అవిశ్వాస రూపకం
  choice: ‘వ్యభిచరించేవారు’ అనే రూపకభాషను ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘విశ్వాసద్రోహం చేసేవారు’ లేదా ‘విగ్రహారాధన చేసేవారు’
  rationale: హీబ్రూ ఉద్దేశపూర్వకంగా విగ్రహారాధనను ఒడంబడిక సంబంధమైన లైంగిక అవిశ్వాసంగా చిత్రిస్తుంది. సాధారణ వివరణగా మార్చకుండా ఆ తీవ్రతను నిలుపాలి.
- issue: ‘తొలగిస్తాను’ అనే నిబంధనాత్మక తీర్పు యొక్క విధానం
  choice: తీర్పు విధానాన్ని నిర్దిష్టం చేయకుండా ‘తొలగిస్తాను’ అని అనువదించుట
  alternative: ‘చంపుతాను’, ‘సమాజం నుండి బహిష్కరిస్తాను’, లేదా ‘నాశనం చేస్తాను’
  rationale: ఈ వచనం దైవిక తొలగింపును ప్రకటిస్తుంది గాని అది ఎలా అమలవుతుందో ఇక్కడ స్పష్టంగా చెప్పదు. అనువాదం ఆ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన శాసన-తీర్పు స్వరం. హీబ్రూ నుడికారాన్ని పూర్తిగా అక్షరానువాదం చేయకుండా సహజంగా ఉంచినా, ముఖం తిప్పడం, వ్యభిచారం, సమాజం మధ్యనుండి తొలగింపు అనే ప్రధాన రూపకాలు మరియు ధార్మిక ఉద్వేగం నిలుపబడ్డాయి.
