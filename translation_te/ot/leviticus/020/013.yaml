id: LEV.20.13
reference: Leviticus 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: te
  text: ఒక పురుషుడు స్త్రీతో శయనించినట్లుగా ఒక మగవానితో శయనిస్తే[a], వారిద్దరూ హేయమైన పని చేశారు. వారికి తప్పకుండా మరణశిక్ష విధించాలి; వారి రక్తం వారిమీదే ఉంటుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “స్త్రీ యొక్క శయనములు”; ఇది స్త్రీతో లైంగిక సంభోగాన్ని సూచించే నానుడి.'
    reason: lexical_alternative
  - marker: b
    text: అంటే, తమ మరణానికి వారే బాధ్యులు; లేదా, “వారి రక్తాపరాధం వారిమీదే ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు ... శయనిస్తే
  rationale: హీబ్రూ న్యాయసూత్రంలోని షరతును సహజమైన ఆధునిక తెలుగు ‘-తే’ నిర్మాణంతో వ్యక్తపరుస్తుంది; אִישׁ‌ను ‘పురుషుడు’గా అనువదించి, తరువాతి זָכָר‌తో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: יִשְׁכַּב אֶת
  choice: తో శయనిస్తే
  rationale: ఈ సందర్భంలో שׁכב లైంగిక సంభోగాన్ని సూచించే నానుడి. ‘శయనించు’ మూలంలోని రూపకాన్ని కాపాడుతూ గౌరవప్రదమైన బైబిలు-న్యాయ శైలిని ఇస్తుంది.
- source_word: זָכָר
  choice: ఒక మగవానితో
  rationale: זָכָר అనేది אִישׁ కంటే భిన్నంగా జీవలింగాన్ని సూచించే ‘male’; అందువల్ల ‘పురుషుడు/మగవాడు’ అనే మూలపద భేదాన్ని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: స్త్రీతో శయనించినట్లుగా
  rationale: అక్షరార్థంగా ‘స్త్రీ శయనములు’ అనే బహువచన నిర్మాణం తెలుగులో అసహజం. దాని లైంగిక నానుడి భావాన్ని సహజంగా వ్యక్తపరుస్తూ పాదటిప్పణిలో మూలరూపాన్ని తెలియజేస్తుంది.
- source_word: תּוֹעֵבָה
  choice: హేయమైన పని
  rationale: תּוֹעֵבָה యొక్క తీవ్రమైన నైతిక-ఒడంబడిక నిరసనను సాధారణ ఆధునిక పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది; ‘అసహ్యకార్యం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: వారిద్దరూ ... చేశారు
  rationale: క్రియకు ఇద్దరూ కర్తలని హీబ్రూ స్పష్టంగా నొక్కిచెప్పడాన్ని నిలుపుతుంది.
- source_word: מוֹת יוּמָתוּ
  choice: వారికి తప్పకుండా మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్ + హోఫల్ రూపంలోని నిశ్చయార్థక బలాన్ని ‘తప్పకుండా’ ద్వారా, కర్మణి శిక్షార్థాన్ని ‘మరణశిక్ష విధించాలి’ ద్వారా సహజమైన తెలుగు న్యాయభాషలో తెలియజేస్తుంది.
- source_word: דְּמֵיהֶם בָּם
  choice: వారి రక్తం వారిమీదే ఉంటుంది
  rationale: మరణానికి బాధ్యత వారిదేనని తెలిపే హీబ్రూ న్యాయనానుడిని పదచిత్రంతో సహా నిలుపుతుంది; దాని భావాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: నైతికంగా, సాంస్కృతికంగా వివాదాస్పదమైన న్యాయనిషేధాన్ని అనువదించడం
  choice: హీబ్రూ పేర్కొనే నిర్దిష్ట క్రియను, దానికి చెప్పబడిన శిక్షను తగ్గించకుండా లేదా విస్తరించకుండా నేరుగా అనువదించాం.
  alternative: ‘సమలైంగిక చర్యలు’ వంటి విస్తృత ఆధునిక వర్గీకరణను లేదా ఆధునిక లైంగిక గుర్తింపు పదజాలాన్ని ఉపయోగించడం.
  rationale: మూలవాక్యం ఆధునిక గుర్తింపు వర్గాన్ని నిర్వచించదు; అది నిర్దిష్ట క్రియను న్యాయభాషలో పేర్కొంటుంది. అందువల్ల అనువాదం మూలంలోని క్రియ-కేంద్రీకృత రూపాన్నే ఉంచుతుంది.
- issue: אִישׁ మరియు זָכָר మధ్య లింగపద భేదం
  choice: אִישׁ‌కు ‘పురుషుడు’, זָכָר‌కు ‘మగవాడు’ ఉపయోగించాం.
  alternative: రెండింటికీ ‘పురుషుడు’ లేదా ‘మనిషి’ ఉపయోగించడం.
  rationale: హీబ్రూ వేర్వేరు పదాలను ఉపయోగిస్తుంది. తెలుగు శైలికి అనుకూలంగా సాధ్యమైనంతవరకు ఆ భేదాన్ని నిలుపడం మూలానికి నిబద్ధమైనది.
- issue: דְּמֵיהֶם בָּם యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘వారి రక్తం వారిమీదే ఉంటుంది’ అనే హీబ్రూ నానుడిని నిలిపి, బాధ్యత/రక్తాపరాధ భావాన్ని పాదటిప్పణిలో తెలిపాం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘తమ మరణానికి వారే బాధ్యులు’ లేదా ‘వారి రక్తాపరాధం వారిమీదే’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: నానుడి యొక్క బలమైన రక్త-చిత్రాన్ని, అలాగే ‘రక్తం’ మరియు ‘రక్తాపరాధం’ మధ్య ఉన్న భావసాంద్రతను పూర్తిగా ఒక్క అర్థానికి కుదించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయ-బైబిలు శైలిని ఉపయోగించాం. ‘శయనించు’ మూలంలోని లైంగిక నానుడిని నిలుపుతుంది; ‘మరణశిక్ష విధించాలి’ ఆధునిక పాఠకుడికి కర్మణి శిక్షార్థాన్ని స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
