source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: te
  text: 'అయితే నేను మీతో ఇలా చెప్పాను: “మీరు వారి భూమిని స్వాధీనం చేసుకుంటారు; నేనే దానిని మీకు స్వాధీనం చేసుకోవడానికి ఇస్తాను—పాలూ తేనె ప్రవహించే దేశాన్ని.”[a][b] మిమ్మల్ని ఆ ప్రజల నుండి వేరుచేసిన మీ దేవుడైన యాహ్వేను నేనే.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు వారి భూమిని స్వాస్థ్యంగా పొందుతారు; దానిని స్వాస్థ్యంగా పొందడానికి నేనే దానిని మీకు ఇస్తాను.” హీబ్రూ క్రియ ירשׁకు ‘వారసత్వంగా పొందడం,’ ‘స్వాధీనం చేసుకోవడం’ అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పాలూ తేనె ప్రవహించే దేశం” అనేది సమృద్ధిని, సారవంతతను సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: c
    text: 'హీబ్రూ: YHWH; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
  - marker: d
    text: లేదా, “మిమ్మల్ని ఆ ప్రజల నుండి ప్రత్యేకపరచిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: అయితే నేను … చెప్పాను
  rationale: వావ్ సంధిని సందర్భంలోని వ్యత్యాసంతో సహా సహజమైన తెలుగులో తెలియజేస్తుంది; సాధారణ ‘మరియు’ కంటే ఇక్కడ ‘అయితే’ సందర్భానికి అనుకూలం.
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: స్వాధీనం చేసుకుంటారు / స్వాధీనం చేసుకునేలా
  rationale: ירשׁ భూమిని వారసత్వంగా పొందడం, స్వాధీనం చేసుకోవడం అనే రెండు భావాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో క్రియాశీల స్వాధీన భావాన్ని ఉంచి, వారసత్వ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אַדְמָתָם
  choice: వారి నేల
  rationale: אדמה యొక్క నేల/భూమి భావాన్ని నిలుపుతూ, తరువాతి אֶרֶץ‌కు వాడిన ‘దేశం’తో ఉన్న పదభేదాన్ని కూడా సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: וַאֲנִי אֶתְּנֶנָּה
  choice: నేనే దానిని మీకు ఇస్తాను
  rationale: స్వతంత్ర సర్వనామమైన אֲנִי ఇచ్చే ఉద్ఘాటనను ‘నేనే’ స్పష్టంగా తెలియజేస్తుంది; భూమి దేవుని కానుకగా ఇవ్వబడుతుందనే భావమూ నిలుస్తుంది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలుతేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధి, సారవంతతను సూచించే హీబ్రూ నానుడిని తెలుగులో పరిచితమైన, గౌరవప్రదమైన రూపంలో ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: הִבְדַּלְתִּי
  choice: వేరుచేసిన
  rationale: בדל యొక్క ప్రత్యక్షమైన వేరుచేయడం అనే భావాన్ని, అధ్యాయంలోని విభజన/పరిశుద్ధత అంశాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: הָעַמִּים
  choice: ఇతర జనాలు
  rationale: ఇక్కడ עמים రాజకీయ ‘దేశాలు’ కంటే ప్రజాసమూహాలను సూచిస్తుంది. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘ఇతర జనాలు’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలరూపాన్ని కాపాడుతుంది.
- issue: ఇశ్రాయేలును ఇతర జనాల నుంచి వేరుచేయడం
  choice: వేరుచేసిన
  alternative: ప్రత్యేకపరచిన
  rationale: మూలంలోని విభజన భావాన్ని నేరుగా తెలియజేస్తుంది; ‘ప్రత్యేకపరచిన’ కూడా సాధ్యమే గాని కొద్దిగా వ్యాఖ్యానాత్మకమైన పవిత్రార్పణ భావాన్ని సూచించవచ్చు.
- issue: ירשׁలోని స్వాధీనం–వారసత్వ భావసమ్మేళనం
  choice: ప్రధాన పాఠంలో ‘స్వాధీనం చేసుకోవడం’
  alternative: స్వాస్థ్యంగా పొందడం
  rationale: భూమిని పొందడం, దానిపై అధికారం కలిగి ఉండడం అనే క్రియాశీల భావాన్ని ప్రధాన పాఠం తెలియజేస్తుంది; నిజమైన వారసత్వ ప్రత్యామ్నాయాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నేనే’ ద్వారా హీబ్రూ సర్వనామ ఉద్ఘాటనను నిలిపాం. אדמה/ארץ పదభేదాన్ని ‘నేల/దేశం’తో ప్రతిబింబించాం; దైవనామాన్ని ‘యాహ్వే’గా ఉంచాం.
