lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దבר యొక్క పియేల్ రూపం వావ్-క్రమంతో వచ్చి కొత్త దైవవాక్య విభాగాన్ని ప్రారంభిస్తోంది. ఈ సూత్రబద్ధ సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘అన్నాడు’ స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సంబోధితుడిని సూచిస్తుంది. ‘మోషేతో’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వాక్యంలోని ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే లֵאמֹרను తెలుగులో సహజంగా ‘ఇలా’తో వ్యక్తం చేశాం; చివరి ద్విబిందువు సందేశం కొనసాగుతుందని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపాన్నే నిలిపాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. హీబ్రూ సూత్రబద్ధమైన ‘మాట్లాడుతూ చెప్పాడు’ నిర్మాణాన్ని పదేపదే అనుసరించకుండా, దాని సంభాషణారంభ విధిని ‘ఇలా అన్నాడు:’గా సహజీకరించాం.
