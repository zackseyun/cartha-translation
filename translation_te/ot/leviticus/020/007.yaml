  edition: WLC
  text: וְ/הִ֨תְקַדִּשְׁתֶּ֔ם וִ/הְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: te
  text: మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి[a], పవిత్రులుగా ఉండండి; ఎందుకంటే నేను మీ దేవుడైన యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు పవిత్రపరచుకోండి,’ ‘మిమ్మల్ని మీరు పవిత్రులుగా చేసుకోండి.’ హీబ్రూ క్రియ ఆత్మనిర్దేశక భావంలో ఉంది; ఇశ్రాయేలీయులు తమను తాము దేవునికి ప్రతిష్ఠించుకోవాలని క్రియాశీలకంగా పిలుస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని
  rationale: קדשׁ ధాతువు హిత్పయేల్ రూపంలో క్రియాశీలకమైన ఆత్మనిర్దేశక భావాన్ని ఇస్తుంది. ‘మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని’ అనే అనువాదం ఇశ్రాయేలీయులు తమను తాము దేవునికి ప్రత్యేకించుకోవాలనే పిలుపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి ‘పవిత్రులుగా ఉండండి’తో అనవసర పునరుక్తిని కూడా తగ్గిస్తుంది.
- source_word: וִהְיִיתֶם
  choice: ఉండండి
  rationale: ముందున్న ఆజ్ఞను అనుసరించే היה రూపం ఇక్కడ రెండవ ఆజ్ఞవలె పనిచేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఉండండి’ ఆ సమన్వయ ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: קְדֹשִׁים
  choice: పవిత్రులుగా
  rationale: లేవీయకాండంలోని నిబంధనా, నైతిక సందర్భంలో קָדוֹשׁకు ‘పవిత్రుడు’ అనే పదమే దాని దేవసంబంధమైన మరియు నైతికమైన బరువును సముచితంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది ఆజ్ఞకు ఆధారమైన కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ కారణార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించడం మూలంలోని నిబంధనా నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నప్పటికీ, ఈ సందర్భంలో אֱלֹהִים ఇశ్రాయేలీయుల ఏకవచన దేవుణ్ణి సూచిస్తుంది. అందువల్ల ‘మీ దేవుడు’ సందర్భానుసారమైన అనువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా వాడుతోంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమని భావించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలను వాడాం. ‘ప్రతిష్ఠించుకొని’ ఆత్మనిర్దేశక చర్యను, ‘పవిత్రులుగా ఉండండి’ తదనంతర స్థితి/జీవన పిలుపును వేరుచేస్తాయి. కారణవాక్యాన్ని సహజమైన తెలుగు క్రమంలో ఉంచుతూ, హీబ్రూ వాక్యంలోని దైవనామ ప్రాధాన్యాన్ని ‘మీ దేవుడైన యెహోవాను నేనే’ ద్వారా నిలిపాం.
