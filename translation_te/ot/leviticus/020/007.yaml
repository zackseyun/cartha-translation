review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes the reflexive self-consecration command from the following command to be holy and retains the causal clause and divine name. However, “ప్రతిష్ఠించుకొని” is a conjunctive participial form (“having consecrated [yourselves]”), not the imperative required by the Hebrew וְהִתְקַדִּשְׁתֶּם. The main text therefore needs a finite imperative.
  naturalness: “మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి, పవిత్రులుగా ఉండండి” is clear, idiomatic modern standard Telugu. Putting “నేను” before the predicate, “ఎందుకంటే నేను మీ దేవుడైన యెహోవాను,” gives the closing identification a more natural Telugu order while preserving its meaning.
  terminology: “ప్రతిష్ఠించుకోండి” appropriately conveys active reflexive consecration; “పవిత్రులుగా ఉండండి” accurately renders the distinct holiness clause. “యెహోవా” consistently renders the divine name as selected in the draft’s terminology policy. The footnote alternatives should likewise use imperative forms.
  issues:
  - severity: high
    issue: The first command is rendered with a participial form.
    rationale: “మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని” means “having consecrated yourselves,” whereas the Hebrew Hitpael form is an imperative addressed to the people. “మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి” preserves both command force and reflexive sense.
  - severity: low
    issue: Word order in the final identification is less natural than necessary.
    rationale: “మీ దేవుడైన యెహోవాను నేనే” is understandable, but “నేను మీ దేవుడైన యెహోవాను” is smoother modern Telugu and accurately expresses “I am Yahweh your God.”
  revised_text: మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి[a], పవిత్రులుగా ఉండండి; ఎందుకంటే నేను మీ దేవుడైన యెహోవాను.
