  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: te
  text: మీరు నాకు పరిశుద్ధులుగా ఉండాలి; ఎందుకంటే నేను, యాహ్వేను, పరిశుద్ధుణ్ణి; మీరు నాకు చెందినవారిగా ఉండటానికి మిమ్మల్ని ప్రజల నుండి వేరుచేశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాతుల నుండి.” హీబ్రూ עַמִּים అనే పదం సందర్భాన్ని బట్టి “ప్రజలు” లేదా “జాతులు” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם לִי קְדֹשִׁים
  choice: మీరు నాకు పరిశుద్ధులుగా ఉండాలి
  rationale: చట్టపరమైన, ఉపదేశాత్మక సందర్భంలో ఈ రూపం బాధ్యతతో కూడిన భావి/ఫలిత బలాన్ని కలిగిస్తుంది. ‘నాకు పరిశుద్ధులుగా’ అనేది לִי యొక్క సంబంధ భావాన్నీ קְדֹשִׁים యొక్క నైతిక, ఆరాధనాసంబంధ విస్తృతినీ నిలుపుతుంది.
- source_word: כִּי קָדוֹשׁ אֲנִי יְהוָה
  choice: ఎందుకంటే యెహోవానైన నేను పరిశుద్ధుణ్ణి
  rationale: כִּי ఇశ్రాయేలు పరిశుద్ధతకు కారణాన్ని సూచిస్తుంది. దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించి, కర్తకు ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలిపింది.
- source_word: וָאַבְדִּל אֶתְכֶם
  choice: మిమ్మల్ని వేరుచేశాను
  rationale: בדל అనే క్రియ విభజించడం లేదా వేరుచేయడం అనే భావం ఇస్తుంది. קדשకు వాడిన ‘పరిశుద్ధ’ పదంతో కలిపివేయకుండా మూలంలోని పదభేదాన్ని నిలుపుతుంది.
- source_word: מִן הָעַמִּים
  choice: ప్రజలలో నుండి
  rationale: עַמִּים అనేది ప్రజాసమూహాలు లేదా జనాలు అనే విస్తృత భావం కలిగిన బహువచనం. ‘ప్రజలలో నుండి’ సహజమైన తెలుగు; ‘ఇతర’ అనే మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: לִהְיוֹת לִי
  choice: నాకు చెందినవారిగా ఉండేందుకు
  rationale: లామెద్‌తో కూడిన క్రియారూపం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; చివరి לִי సంబంధం/చెందికను తెలియజేస్తుంది. ఈ అనువాదం నిబంధనాత్మక స్వకీయతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు పరిశుద్ధతను కేవలం నైతిక పవిత్రతగా గానీ, కేవలం ఆచారపరమైన ప్రత్యేకతగా గానీ పరిమితం చేయకుండా అనువదించడం
  choice: קדשకు ‘పరిశుద్ధ’, בדלకు ‘వేరుచేయు’ అని వేర్వేరు పదాలు వాడటం
  alternative: రెండింటినీ ‘ప్రత్యేకపరచు’ అనే ఒకే భావంతో అనువదించడం
  rationale: వచనం ఇశ్రాయేలు పరిశుద్ధతను యెహోవా పరిశుద్ధతలో ఆధారపరుస్తూ, ప్రజల నుండి వేరుచేసిన కార్యానికి వేరే క్రియను ఉపయోగిస్తుంది. రెండు తెలుగు పదాలు ఈ భావపరమైన ఉద్రిక్తతను, మూల పదభేదాన్ని కాపాడుతాయి.
- issue: יהוה అనే దైవ నామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత నిబంధన నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘పరిశుద్ధులు,’ ‘వేరుచేశాను,’ ‘చెందినవారు’ అనే పదాలు మూలంలోని పరిశుద్ధత, విభజన, నిబంధనాత్మక చెందిక అనే వేర్వేరు భావాలను నిలుపుతున్నాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా చేర్చబడింది.
