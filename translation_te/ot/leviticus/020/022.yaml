- from: కాబట్టి మీరు నా కట్టడలన్నిటినీ, నా న్యాయవిధులన్నిటినీ పాటించి, వాటిని ఆచరించాలి[b]. అప్పుడు మీరు అక్కడ నివసించడానికి నేను మిమ్మల్ని తీసుకువెళ్తున్న దేశం మిమ్మల్ని కక్కివేయదు[a].
  to: కాబట్టి మీరు నా శాసనాలన్నిటినీ, నా న్యాయవిధులన్నిటినీ[b] పాటించి, వాటిని ఆచరించాలి. అప్పుడు మీరు అక్కడ నివసించడానికి నేను మిమ్మల్ని తీసుకువెళ్తున్న దేశం మిమ్మల్ని కక్కివేయదు[a].
  rationale: చట్టపర సందర్భంలో అస్పష్టత కలిగించే ‘కట్టడలు’ స్థానంలో ‘శాసనాలు’ వాడబడింది. దీనివల్ల חֻקּוֹת మరియు מִשְׁפָּטִים మధ్య మూలపాఠంలోని పదభేదం ‘శాసనాలు’ మరియు ‘న్యాయవిధులు’ ద్వారా స్పష్టంగా నిలుస్తుంది. పాదటిప్పణి గుర్తులు సంబంధిత పదాలకు తరలించబడ్డాయి; రూపకానికి సంబంధించిన పాదటిప్పణి మాటతీరు సహజంగా సవరించబడింది. వాక్యార్థం, రూపకం, లేదా ఫలిత సంబంధం మార్చబడలేదు.
