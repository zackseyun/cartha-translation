id: LEV.20.22
reference: Leviticus 20:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: te
  text: కాబట్టి మీరు నా శాసనాలన్నిటినీ, నా న్యాయవిధులన్నిటినీ[b] పాటించి, వాటిని ఆచరించాలి. అప్పుడు మీరు అక్కడ నివసించడానికి నేను మిమ్మల్ని తీసుకువెళ్తున్న దేశం మిమ్మల్ని కక్కివేయదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘కక్కివేయదు’ అనేది హెబ్రీలో అక్షరార్థంగా ‘వాంతి చేయడం’ అనే రూపకం. భావం: అపవిత్రులైన నివాసులను దేశం తనలోనుంచి బయటకు విసిరివేస్తుంది. ‘వాంతి చేసి బయటకు నెట్టివేయదు’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: '‘శాసనాలు, న్యాయవిధులు’ అని అనువదించిన చోట హెబ్రీలో రెండు వేరు చట్టపరమైన పదాలు ఉన్నాయి: חֻקּוֹת, מִשְׁפָּטִים. వీటిని ‘కట్టడలు, విధులు’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: కాబట్టి మీరు … పాటించి
  rationale: శׁמר అనే క్రియ నిబంధనాత్మక-చట్టపరమైన సందర్భంలో ‘పాటించు/కాపాడు’ అనే భావాన్ని ఇస్తుంది. ముందున్న హెచ్చరికతో సంబంధాన్ని చూపడానికి וּ־ను ‘కాబట్టి’గా అనువదించాం.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలు
  rationale: חֻקָּה నిర్దేశించబడిన శాసనం లేదా కట్టడను సూచిస్తుంది. מִשְׁפָּטִיםతో ఉన్న పదభేదాన్ని నిలుపుకోవడానికి ‘కట్టడలు’ ఎంచుకున్నాం.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులు
  rationale: מִשְׁפָּט చట్టపరమైన తీర్పు, న్యాయనిర్ణయం లేదా విధిని సూచించగలదు. ‘న్యాయవిధులు’ అనే పదం చట్టపరమైన స్వరాన్ని, חֻקּוֹתతో భేదాన్ని నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరించాలి
  rationale: చట్టపరమైన ఆదేశాలను కర్మలో పెట్టడం అనే עשה భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆచరించాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: మిమ్మల్ని కక్కివేయదు
  rationale: קיא అక్షరార్థంగా ‘వాంతి చేయు/కక్కు’. దేశం అపవిత్రులైన నివాసులను బయటకు విసిరివేస్తుందనే సజీవ రూపకాన్ని మృదువుపరచకుండా ‘కక్కివేయదు’గా ఉంచాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఈ సందర్భంలో אֶרֶץ సాధారణ భూమిని కాక, ఇశ్రాయేలీయులు నివసించబోయే నిర్దిష్ట దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా ఉంది.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: నేను మిమ్మల్ని తీసుకువెళ్తున్న దేశం
  rationale: దేవుడు వారిని ఒక గమ్యస్థానానికి తీసుకువెళ్తున్న కొనసాగుతున్న చర్యను ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָשֶׁבֶת בָּהּ
  choice: మీరు అక్కడ నివసించడానికి
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ‘నివసించడానికి’ గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: దేశం తన నివాసులను కక్కివేయడం అనే నిబంధనాత్మక హెచ్చరిక
  choice: దేశాన్ని మిమ్మల్ని ‘కక్కివేయగలదిగా’ వ్యక్తీకరించే మూల రూపకాన్ని నిలుపుకున్నాం.
  alternative: దేశం మిమ్మల్ని తిరస్కరించదు / బయటకు వెళ్లగొట్టదు.
  rationale: హెబ్రీ పాఠంలోని ఉద్దేశపూర్వకమైన ఘాటైన వ్యక్తీకరణ పవిత్రత, అపవిత్రత, దేశనిష్కాసనం మధ్య ఉన్న సంబంధాన్ని తెలియజేస్తుంది; దాన్ని సాధారణ ‘తిరస్కరణ’గా మార్చడం మూలపాఠ బలాన్ని తగ్గిస్తుంది.
- issue: חֻקּוֹת మరియు מִשְׁפָּטִים మధ్య చట్టపరమైన పదభేదం
  choice: ‘కట్టడలు’ మరియు ‘న్యాయవిధులు’ అనే రెండు వేరు పదాలను వాడాం.
  alternative: ‘ఆజ్ఞలు’ మరియు ‘నియమాలు’ లేదా రెండింటికీ ఒకే సాధారణ పదం.
  rationale: మూలంలో రెండు భిన్నమైన చట్టపరమైన పదాలు ఉన్నాయి. వాటిని వేరుగా ఉంచడం పాఠంలోని న్యాయపరమైన నిర్మాణాన్ని కాపాడుతుంది.
- issue: וְלֹא תָקִיא యొక్క సంబంధం
  choice: ‘అప్పుడు … కక్కివేయదు’ అని ఆజ్ఞపాలనతో వచ్చే ఫలితం/నివారణగా అనువదించాం.
  alternative: ‘కక్కివేయకుండా ఉండేందుకు’ అనే స్పష్టమైన ఉద్దేశార్థ నిర్మాణం.
  rationale: హెబ్రీ సంధి ఫలితం లేదా ఉద్దేశం రెండింటికీ చోటివ్వగలదు. ‘అప్పుడు’ సందర్భ సంబంధాన్ని సహజంగా చూపుతూ అతిగా ఒకే వ్యాకరణార్థాన్ని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చట్టపరమైన శైలిని వాడాం. వాక్య నిర్మాణం సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా చేసినప్పటికీ, మూలంలోని రెండు చట్టపరమైన పదాల భేదాన్ని మరియు ‘దేశం కక్కివేయడం’ అనే ఘాటైన రూపకాన్ని నిలుపుకున్నాం.
