base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: te
  text: నేనే ఆ మనిషికి విరోధంగా నా ముఖాన్ని నిలిపి, అతని ప్రజల మధ్యనుండి అతన్ని తొలగిస్తాను. ఎందుకంటే అతడు తన సంతానంలో కొందరిని మోలెకుకు ఇచ్చాడు[a], నా పరిశుద్ధస్థలాన్ని కలుషపరచడానికి, నా పరిశుద్ధ నామాన్ని అపవిత్రం చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని బట్టి, ‘తన పిల్లల్లో కొందరిని మోలెకుకు బలిగా అర్పించాడు.’ హీబ్రూలో అక్షరార్థంగా ‘తన సంతానంలో కొందరిని మోలెకుకు ఇచ్చాడు’ అని ఉంది; బలి అనే భావం విస్తృత సందర్భం నుంచి ఊహించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: ఆ మనిషికి విరోధంగా నా ముఖాన్ని ఉంచి
  rationale: దేవుని ఉద్దేశపూర్వక విరోధాన్ని తెలిపే హీబ్రూ ముఖసంబంధ న్యాయతీర్పు నుడికారాన్ని వీలైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: అతని ప్రజల మధ్యనుండి అతన్ని తొలగిస్తాను
  rationale: సమాజం నుంచి పూర్తిగా తీసివేసే న్యాయతీర్పును తెలియజేస్తూ, అది మరణమా బహిష్కరణమా అన్న విషయాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מִזַּרְעוֹ
  choice: తన సంతానంలో కొందరిని
  rationale: מִן లోని భాగార్థాన్ని, זֶרַע యొక్క సంతానం అనే అర్థాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: נָתַן לַמֹּלֶךְ
  choice: మోలెకుకు ఇచ్చాడు
  rationale: నָתַן అనే సాధారణ ‘ఇచ్చాడు’ అర్థాన్ని నిలుపుతూ, ప్రధాన వాక్యంలో ‘బలి ఇచ్చాడు’ అని సందర్భార్థాన్ని ముందుగానే చేర్చదు.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: నా పరిశుద్ధస్థలాన్ని అపవిత్రపరచి
  rationale: యాజక సంబంధ సందర్భంలోని ఆచారపరమైన అపవిత్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: నా పరిశుద్ధ నామాన్ని అపవిత్రం చేశాడు
  rationale: దేవుని నామాన్ని పవిత్రమైనదిగా గౌరవించకుండా కలుషితం చేయడంలోని గంభీరతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోలెకుకు సంతానాన్ని ఇవ్వడం అనే అపరాధ స్వభావం
  choice: ప్రధాన వాక్యంలో ‘తన సంతానంలో కొందరిని మోలెకుకు ఇచ్చాడు’ అని ఉంచడం
  alternative: ‘తన పిల్లల్లో కొందరిని మోలెకుకు బలిగా అర్పించాడు’
  rationale: విస్తృత సందర్భం పిల్లల బలిని సూచించినా, ఈ వచనంలోని క్రియ నేరుగా ‘ఇచ్చాడు’ అని మాత్రమే చెబుతుంది. అందువల్ల మూలంలోని పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: దేవుని వ్యక్తిగత ప్రమేయం మరియు తీర్పు
  choice: ‘నేనే’ అనే ఉద్ఘాటనతో పాటు ‘విరోధంగా నా ముఖాన్ని ఉంచి’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘నేను ఆ మనిషిని ఎదిరించి’
  rationale: దేవుడే స్వయంగా తీర్పు అమలు చేస్తున్నాడనే ఉద్ఘాటనను, హీబ్రూ న్యాయతీర్పు నుడికారంలోని గంభీరతను కాపాడుతుంది.
- issue: לְמַעַן లోని ఉద్దేశం లేదా ఫలితం
  choice: ‘అలా ... అపవిత్రపరచి ... అపవిత్రం చేశాడు’
  alternative: ‘... అపవిత్రపరచడానికి, ... అపవిత్రం చేయడానికి’
  rationale: ఈ సందర్భంలో ఉద్దేశం మరియు ఫలితం మధ్యనున్న భావసంభావ్యతను కఠినంగా ఒక వైపుకు పరిమితం చేయకుండా సహజ తెలుగులో అనుసంధానిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఉద్ఘాటన, తీర్పు నుడికారం, మరియు బలి సంబంధ సూచనలోని పదార్థ–సందర్భార్థ భేదాన్ని కాపాడింది.
