source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: te
  text: నీ తల్లి సోదరి నగ్నత్వాన్నిగానీ, నీ తండ్రి సోదరి నగ్నత్వాన్నిగానీ నీవు బహిర్గతం చేయకూడదు. ఎందుకంటే అతడు తన దగ్గరి రక్తసంబంధి నగ్నత్వాన్ని బహిర్గతం చేశాడు[a]. వారు తమ దోషాన్ని భరిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన దగ్గరి రక్తసంబంధి’ అనే మాటను అక్షరార్థంగా ‘తన మాంసం’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ఇది దగ్గరి బంధుత్వాన్ని సూచించే పదం.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ దోషాన్ని భరిస్తారు’ అనే మాటకు ‘తమ అపరాధభారాన్ని మోస్తారు’ లేదా ‘తమ దోషానికి తగిన శిక్షను అనుభవిస్తారు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: నగ్నత్వాన్ని ... బయలుపరచకూడదు
  rationale: లేవీయకాండంలోని లైంగిక నిషేధాలకు ప్రత్యేకమైన ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే హీబ్రూ న్యాయపరమైన నానుడిని నిలుపుతుంది; దానిని నేరుగా ‘లైంగిక సంబంధం పెట్టుకోవడం’ అని విప్పి చెప్పి మూలంలోని రూపకాన్ని తొలగించదు.
- source_word: אֲחוֹת אִמְּךָ / אֲחוֹת אָבִיךָ
  choice: నీ తల్లి సహోదరి / నీ తండ్రి సహోదరి
  rationale: హీబ్రూ బంధుత్వ పదబంధాలను నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మేనత్త’ వంటి ప్రాంతానుసారంగా అర్థభేదం కలిగే పదాలను నివారిస్తుంది.
- source_word: שְׁאֵרוֹ
  choice: తన సొంత రక్తమాంసం
  rationale: దగ్గరి రక్తసంబంధిని సూచించే హీబ్రూ ‘మాంసం’ రూపకాన్ని తెలుగులో సహజంగా సాధ్యమైనంత వరకు నిలుపుతుంది. సందర్భంలో ఇది అతని దగ్గరి రక్తసంబంధిని సూచిస్తుంది.
- source_word: הֶעֱרָה
  choice: నగ్నపరిచాడు
  rationale: ‘బట్టబయలు చేయడం/నగ్నం చేయడం’ అనే మూల క్రియ యొక్క భావాన్ని కాపాడుతూ, ముందున్న ‘బయలుపరచడం’తో అనవసర పదపునరుక్తిని తగ్గిస్తుంది.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: వారు తమ దోషాన్ని భరిస్తారు
  rationale: దోషం, అపరాధభారం, దాని పర్యవసానం అనే భావాలను కలిగి ఉండగల హీబ్రూ నానుడి సంక్షిప్తతను నిలుపుతుంది; శిక్ష స్వరూపాన్ని మూలం కంటే స్పష్టంగా నిర్ధారించదు.
theological_decisions:
- issue: వివరణ భాగంలోని ఏకవచనం నుంచి తీర్పు భాగంలోని బహువచనానికి మార్పు
  choice: ‘అతడు ... నగ్నపరిచాడు; వారు ... భరిస్తారు’ అని సంఖ్యామార్పును నిలుపడం
  alternative: వాక్యమంతటినీ బహువచనంగా సవరించి ‘వారు తమ సొంత రక్తమాంసాన్ని నగ్నపరిచారు’ అని అనువదించడం
  rationale: మూల హీబ్రూలో שְׁאֵרוֹ / הֶעֱרָה ఏకవచనంలో ఉండగా עֲוֺנָם יִשָּׂאוּ బహువచనంలో ఉంది. ఈ ఉద్రిక్తతను సవరించకుండా నిలపడం మూలానికి పారదర్శకంగా ఉంటుంది.
- issue: లైంగిక నానుడిని ప్రధాన పాఠంలో స్పష్టార్థంగా మార్చాలా అన్నది
  choice: ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే నానుడిని నిలుపడం
  alternative: ‘లైంగిక సంబంధం పెట్టుకోకూడదు’ అని స్పష్టంగా అనువదించడం
  rationale: పరిసర న్యాయవాక్యాల్లోని శైలి, పరస్పర సంబంధం, మూలంలోని సౌమ్యోక్తి కాపాడబడతాయి; స్పష్టార్థ అనువాదం మూల రూపకాన్ని సమతలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘సహోదరి’ అనే పదం బంధుత్వాన్ని స్పష్టంగా ఉంచుతుంది. మూలంలోని లైంగిక సౌమ్యోక్తి, రక్తసంబంధ రూపకం, ఏకవచన-బహువచన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
