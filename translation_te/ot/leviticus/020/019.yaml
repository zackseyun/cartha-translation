review_pass:
  verdict: revise
  source_fidelity: The prohibitions and the singular-to-plural shift are retained, but ‘తన సొంత రక్తమాంసం’ can denote one’s physical flesh and blood rather than the Hebrew kinship term שְׁאֵרוֹ. Rendering it as a close blood relative better conveys the source sense; the literal ‘flesh’ sense can be documented in a footnote.
  naturalness: The opening legal formula is understandable, but ‘నగ్నపరిచాడు’ with ‘రక్తమాంసం’ is unnatural and semantically misleading in Telugu. ‘నగ్నత్వాన్ని బహిర్గతం చేశాడు’ is clearer and preserves the source’s exposure idiom.
  terminology: ‘సోదరి’ is appropriate in a formal modern legal register. ‘దగ్గరి రక్తసంబంధి’ accurately expresses the kinship sense without introducing an interpretive doctrinal claim. ‘దోషాన్ని భరిస్తారు’ suitably preserves the ambiguity of עָוֹן with נשׂא.
  issues:
  - severity: medium
    issue: ‘తన సొంత రక్తమాంసం’ is not a natural Telugu equivalent for a close blood relative.
    rationale: In Telugu it normally evokes one’s own physical flesh and blood. The Hebrew שְׁאֵרוֹ is a kinship expression here, referring to a close relative.
  - severity: medium
    issue: ‘నగ్నపరిచాడు’ is awkward and makes the rationale sound as though the offender physically stripped ‘his own flesh.’
    rationale: The Hebrew uses an exposure idiom in a sexual-legal context. Referring to the close relative’s nakedness makes the Telugu clause coherent while retaining the idiomatic expression.
  - severity: low
    issue: Footnote a is anchored after the explanatory clause rather than the kinship term it explains.
    rationale: Moving the anchor to ‘దగ్గరి రక్తసంబంధి’ makes its lexical purpose transparent.
