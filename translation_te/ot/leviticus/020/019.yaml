revisions:
- from: నీ తల్లి సహోదరి నగ్నత్వాన్నిగానీ, నీ తండ్రి సహోదరి నగ్నత్వాన్నిగానీ నీవు బయలుపరచకూడదు. ఎందుకంటే అతడు తన సొంత రక్తమాంసాన్నే నగ్నపరిచాడు[a]. వారు తమ దోషాన్ని భరిస్తారు[b].
  to: నీ తల్లి సోదరి నగ్నత్వాన్నిగానీ, నీ తండ్రి సోదరి నగ్నత్వాన్నిగానీ నీవు బహిర్గతం చేయకూడదు. ఎందుకంటే అతడు తన దగ్గరి రక్తసంబంధి నగ్నత్వాన్ని బహిర్గతం చేశాడు[a]. వారు తమ దోషాన్ని భరిస్తారు[b].
  rationale: The revision replaces a misleadingly literal Telugu expression for kinship with a natural semantic equivalent, clarifies the exposure idiom by supplying its implied object, and relocates the lexical footnote to the term it explains. It preserves the Hebrew’s legal euphemism, the singular male offender in the rationale, and the plural liability clause.
