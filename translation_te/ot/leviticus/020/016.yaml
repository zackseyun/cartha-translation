source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: te
  text: ఒక స్త్రీ ఏ జంతువుతోనైనా సంభోగించడానికి దానిని సమీపిస్తే[a], మీరు ఆ స్త్రీనీ, ఆ జంతువునీ చంపాలి. ఆ రెండింటికీ తప్పకుండా మరణశిక్ష విధించాలి[b]; ఆ స్త్రీ రక్తమూ ఆ జంతువు రక్తమూ వాటిమీదే ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానితో పడుకోవడానికి.’ ఇక్కడి హెబ్రీ క్రియ ప్రత్యేకంగా లైంగిక సంభోగాన్ని సూచిస్తుంది; దాని అక్షరార్థంలో ఎక్కి సంభోగించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వాటి రక్తదోషం వాటిమీదే ఉంది.’ ఈ జాతీయం వాటి మరణానికి బాధ్యత వాటికే చెందుతుందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: దాని దగ్గరకు వెళితే
  rationale: קרב అనే క్రియకు ‘దగ్గరకు రావడం/వెళ్లడం’ అనే భౌతిక అర్థం ఉంది. తరువాతి పదబంధమే లైంగిక ఉద్దేశాన్ని తెలియజేస్తుంది కాబట్టి, క్రియలో అదనపు భావాన్ని చేర్చలేదు.
- source_word: בְּהֵמָה
  choice: జంతువు
  rationale: בְּהֵמָה ఇక్కడ విస్తృతంగా జంతువును సూచిస్తుంది. ‘మృగం’ కంటే ‘జంతువు’ ఆధునిక తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; כָּל తో కలిసి ‘ఏ జంతువుతోనైనా’ అని సాధారణ పరిధిని వ్యక్తం చేస్తుంది.
- source_word: לְרִבְעָה אֹתָהּ
  choice: దానితో సంభోగించడానికి
  rationale: רבע క్రియ ఈ సందర్భంలో జంతువుతో జరిగే లైంగిక సంభోగాన్ని, మూలార్థంలో ఎక్కి సంభోగించడాన్ని సూచిస్తుంది. ‘సంభోగించడానికి’ అనే పదం అనవసర విస్తరణ లేకుండా చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָרַגְתָּ
  choice: మీరు … చంపాలి
  rationale: న్యాయవిధి సందర్భంలో ఈ క్రియ ఆజ్ఞాత్మక బాధ్యతను తెలియజేస్తుంది. తెలుగు న్యాయశైలిలో ‘చంపాలి’ ఆ నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מוֹת יוּמָתוּ
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియకు ముందు వచ్చిన infinitive absolute మరణదండన సూత్రాన్ని బలపరుస్తుంది. ‘తప్పకుండా’ ఆ బలాన్ని నిలుపుతుంది; ‘మరణశిక్ష విధించాలి’ న్యాయపరమైన నిష్క్రియ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: דְּמֵיהֶם בָּם
  choice: వాటి రక్తం వాటిమీదే ఉంటుంది
  rationale: హెబ్రీ జాతీయాన్ని వ్యాఖ్యానంగా మార్చకుండా దాని రక్త-బాధ్యత రూపకాన్ని నిలిపాం. స్త్రీ, జంతువు అనే మిశ్రమ సమూహాన్ని సూచించడానికి తెలుగు వ్యాకరణానికి అనుగుణంగా ‘వాటి’ వాడబడింది; భావాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: జంతువుతో సంభోగానికి సంబంధించిన తీవ్రమైన న్యాయనిషేధం, దాని శిక్షను అనువదించడం
  choice: లైంగిక చర్యను స్పష్టంగా పేర్కొని, మరణశిక్షను తగ్గించకుండా నేరుగా అనువదించడం
  alternative: ‘దానితో పడుకోవడానికి’ వంటి సౌమ్యోక్తిని వాడడం, లేదా ‘అది ఆమెను ఎక్కడానికి’ వంటి మరింత అక్షరార్థమైన కానీ అసహజమైన రూపాన్ని వాడడం
  rationale: మూలవాక్యం న్యాయపరమైనది, శిక్షాత్మకమైనది. అందువల్ల దాని తీవ్రతను గానీ స్పష్టతను గానీ తగ్గించకుండా, పాఠ్యంలో లేని అదనపు నైతిక లేదా సిద్ధాంత వ్యాఖ్యను చేర్చకుండా అనువదించాం.
- issue: דְּמֵיהֶם בָּם అనే రక్త-బాధ్యత జాతీయం
  choice: ‘వాటి రక్తం వాటిమీదే ఉంటుంది’ అని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘వాటి మరణానికి అవే బాధ్యులు’ అని భావాన్ని మాత్రమే స్పష్టీకరించడం
  rationale: రక్తం అనే మూలరూపకం న్యాయపరమైన, నైతిక బాధ్యత రెండింటినీ మోస్తుంది. దానిని ప్రధాన పాఠ్యంలో సంరక్షించి, అర్థాన్ని పాదటిప్పణిలో వివరించడం మూలంలోని భావసాంద్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘సంభోగించడానికి’ చర్యను సౌమ్యోక్తితో మరుగుపరచదు; ‘తప్పకుండా’ హెబ్రీ బలప్రయోగాన్ని నిలుపుతుంది. ‘వాటి’ అనేది స్త్రీ, జంతువు కలిసిన సమూహానికి తెలుగు వ్యాకరణపరంగా ఉపయోగించిన రూపం; అది స్త్రీని తక్కువచేసే ఉద్దేశంతో కాదు.
