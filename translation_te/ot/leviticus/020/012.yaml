id: LEV.20.12
reference: Leviticus 20:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: te
  text: ఒక పురుషుడు తన కోడలితో లైంగిక సంబంధం కలిగి ఉంటే, వారిద్దరికీ తప్పక మరణశిక్ష విధించాలి. వారు వికృతమైన కార్యం చేశారు[a]; వారి రక్తం వారిమీదే ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీచమైన పని,” “అవమానకరమైన పని,” లేదా “ఘోరమైన పని.” హీబ్రూ పదం תֶּבֶל ఈ న్యాయ సందర్భంలో నైతిక క్రమాన్ని భంగపరిచే చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారి రక్తదోషం వారిమీదే ఉంది.” ఈ హీబ్రూ నుడికారం వారి మరణానికి బాధ్యత వారిదేనని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు ... పెట్టుకుంటే
  rationale: న్యాయవిధిలోని షరతును ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; אִישׁ యొక్క పురుషలింగ నిర్దిష్టతను కూడా నిలుపుతుంది.
- source_word: יִשְׁכַּב אֶת
  choice: లైంగిక సంబంధం పెట్టుకుంటే
  rationale: ఈ సందర్భంలో שׁכב אֶת లైంగిక సంభోగాన్ని సూచించే స్థిర ప్రయోగం. పదశః అస్పష్టతకు బదులుగా అర్థాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: כַּלָּתוֹ
  choice: తన కోడలితో
  rationale: כַּלָּה ఇక్కడ కుమారుని భార్యను, అంటే కోడలిని, సూచిస్తుంది.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: వారిద్దరికీ తప్పక మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని నిశ్చయార్థక బలాన్ని ‘తప్పక’ నిలుపుతుంది; שְׁנֵיהֶם ఇద్దరినీ స్పష్టంగా చేర్చుతుంది.
- source_word: תֶּבֶל עָשׂוּ
  choice: వారు నీచమైన పని చేశారు
  rationale: תֶּבֶל సూచించే నైతికంగా వికృతమైన, అవమానకరమైన చర్యను సహజ తెలుగులో తెలియజేస్తూ, దాని ఖచ్చిత భావవ్యాప్తికి పాదటిప్పణి ఇస్తుంది.
- source_word: דְּמֵיהֶם בָּם
  choice: వారి రక్తం వారిమీదే ఉంటుంది
  rationale: వారి మరణానికి బాధ్యత వారిదేనని సూచించే హీబ్రూ న్యాయపరమైన నుడికారాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
theological_decisions:
- issue: చట్టంలోని లింగనిర్దిష్ట కర్త
  choice: ‘ఒక పురుషుడు’ అని అనువదించడం
  alternative: ‘ఒక వ్యక్తి’ లేదా ‘ఎవరైనా’
  rationale: אִישׁ పురుషుణ్ణి సూచిస్తుంది; ఈ నిషేధంలోని సంబంధ నిర్మాణం కూడా పురుష కర్తను కోరుతుంది.
- issue: תֶּבֶל యొక్క నైతిక స్వభావం
  choice: ‘నీచమైన పని’
  alternative: ‘వికృతమైన పని,’ ‘అవమానకరమైన పని,’ లేదా ‘గందరగోళం’
  rationale: మూలపాఠమే ఈ చర్యను తీవ్రంగా నైతికంగా ఖండిస్తుంది. ‘నీచమైన పని’ ఆ ఖండనను తెలియజేస్తుంది; ఒక్క వివరణాత్మక అర్థాన్ని అతిగా ఖరారు చేయకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచుతుంది.
- issue: రక్తం వారిమీద ఉండటం అనే నుడికారం
  choice: నుడికారాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘తమ మరణానికి వారే బాధ్యులు’ లేదా ‘వారి రక్తదోషం వారిమీదే ఉంది’
  rationale: హీబ్రూ రూపకాన్ని కాపాడుతూ, అది శిక్షకు వారి బాధ్యతను సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. లైంగిక చర్యను అస్పష్టమైన శయన నుడికారంతో కాకుండా గౌరవప్రదమైన స్పష్టతతో తెలిపింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంచబడింది.
