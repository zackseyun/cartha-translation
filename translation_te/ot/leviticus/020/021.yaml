  source_fidelity: The conditional legal formulation, the brother’s wife, the impurity characterization of the union, and the childlessness judgment are conveyed accurately. However, “మానం” means honor/reputation, not nakedness; it does not preserve the Hebrew legal idiom עֶרְוַת ... גִּלָּה.
