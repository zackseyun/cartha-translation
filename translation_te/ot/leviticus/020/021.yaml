    rationale: In Telugu, “మానం” denotes honor, dignity, or reputation. The Hebrew idiom literally concerns nakedness and functions as a legal sexual idiom. “నగ్నత్వాన్ని వెలికితీశాడు” retains both the literal image and the legal-register wording.
