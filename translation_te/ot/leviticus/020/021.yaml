id: LEV.20.21
reference: Leviticus 20:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: te
  text: ఒక పురుషుడు తన సోదరుని భార్యను తీసుకుంటే, అది అపవిత్రమైన సంబంధం; అతడు తన సోదరుని నగ్నత్వాన్ని వెలికితీశాడు. వారిద్దరూ సంతానం లేనివారిగా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు సంతానం లేకుండానే చనిపోతారు.” హీబ్రూ మూలంలో అక్షరార్థంగా “వారు సంతానం లేనివారిగా ఉంటారు” అని ఉంది; ఈ తీర్పు ఎలా అమలవుతుందో అది పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు ... తీసుకుంటే
  rationale: చుట్టుపక్కలనున్న న్యాయనియమాల శైలికి తగిన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יִקַּח
  choice: తీసుకుంటే
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; వివాహం జరిగిందని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టపరచదు.
- source_word: אֵשֶׁת אָחִיו
  choice: తన సోదరుని భార్యను
  rationale: హీబ్రూ సమాసబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: נִדָּה הִוא
  choice: అది అపవిత్రమైన సంబంధం
  rationale: נִדָּה ఇక్కడ స్త్రీని వ్యక్తిగతంగా అపవిత్రురాలని పేర్కొనకుండా, ఆ కలయిక యొక్క అపవిత్ర స్వభావాన్ని సూచిస్తుంది. తెలుగులో సందర్భాన్ని స్పష్టంచేయడానికి ‘సంబంధం’ చేర్చబడింది.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: అతడు తన సోదరుని మానాన్ని బయలుపరచాడు
  rationale: లేవీయకాండంలోని నిషిద్ధ లైంగిక సంబంధాలకు సంబంధించిన స్థిరమైన హీబ్రూ సభ్యోక్తిని గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲרִירִים יִהְיוּ
  choice: వారిద్దరూ సంతానం లేనివారిగా ఉంటారు
  rationale: బహువచన రూపం ఇద్దరినీ సూచిస్తుంది; శిక్ష ఎలా అమలవుతుందో చేర్చకుండా సంతానరాహిత్యాన్ని మాత్రమే తెలుపుతుంది.
theological_decisions:
- issue: עֲרִירִים יִהְיוּ అనే తీర్పు వాక్యభాగం యొక్క భావం
  choice: వారిద్దరూ సంతానం లేనివారిగా ఉంటారు
  alternative: వారు సంతానం లేకుండానే చనిపోతారు
  rationale: హీబ్రూ పదబంధం సంతానరాహిత్యాన్ని చెబుతుంది గాని మరణాన్ని లేదా తీర్పు అమలయ్యే విధానాన్ని స్పష్టంగా చెప్పదు; అందువల్ల మూలంలోని అనిశ్చితి నిలుపబడింది.
- issue: נִדָּה ఎవరిని లేదా దేనిని వర్ణిస్తుంది
  choice: ఆ సంబంధాన్ని అపవిత్రమైనదిగా పేర్కొనడం
  alternative: ఆ స్త్రీని అపవిత్రురాలిగా పేర్కొనడం
  rationale: నపుంసక భావంతో ఉన్న ‘అది’ ఈ కలయికను లేదా చర్యను సూచిస్తుందని సందర్భం అనుమతిస్తుంది; స్త్రీపై వ్యక్తిగత ముద్ర వేయకుండా నైతిక-ఆచార అపవిత్రతను వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయవాక్య శైలి వాడబడింది. ‘మానాన్ని బయలుపరచాడు’ అనే గౌరవప్రదమైన సభ్యోక్తి మూలంలోని లైంగిక న్యాయపదబంధాన్ని నిలుపుతుంది. ఏ మతశాఖకు ప్రత్యేకమైన వ్యాఖ్యానాన్నీ చేర్చలేదు.
