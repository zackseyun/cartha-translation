id: LEV.20.4
reference: Leviticus 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: te
  text: అయితే దేశ ప్రజలు ఆ మనిషి తన సంతానంలో కొందరిని మోలెకుకు[a] ఇచ్చినప్పుడు, అతనిని చంపకుండా ఉండేందుకు ఉద్దేశపూర్వకంగా అతని విషయంలో కళ్లు మూసుకుంటే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘మోలెకు’ అనేది ఒక దేవతను లేదా పిల్లలను బలిగా అర్పించే ఒక విధమైన ఆచారాన్ని సూచించవచ్చు. మరొక పఠనం: ‘రాజుకు.’'
    reason: alternative_reading
  - marker: b
    text: 'హెబ్రీ నుడికారం అక్షరార్థంగా ‘ఆ మనిషి నుండి తమ కళ్లను దాచుకుంటే’; భావం: అతన్ని ఉద్దేశపూర్వకంగా చూసీచూడనట్లు వదిలేస్తే.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: ఉద్దేశపూర్వకంగా ... కళ్లు మూసుకుంటే
  rationale: క్రియావిశేషణాత్మక మూలరూపంతో కూడిన క్రియ హెబ్రీలో చర్యను బలపరుస్తుంది. ‘కళ్లు మూసుకోవడం’ అనే సహజ తెలుగు నుడికారం ఉద్దేశపూర్వకంగా పట్టించుకోకపోవడాన్ని తెలియజేస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ఈ న్యాయ సందర్భంలో ఇది ఏదైనా ప్రత్యేక సామాజిక వర్గాన్ని కాక, ఆ దేశంలోని ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: అతని విషయంలో కళ్లు మూసుకుంటే
  rationale: మూలంలో అక్షరార్థంగా ‘ఆ మనిషి నుండి తమ కళ్లను దాచుకుంటే’ అని ఉన్నా, అతన్ని చూసీచూడనట్లు వదిలేయడం అనే భావాన్ని ఈ తెలుగు నుడికారం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: తన సంతానంలో కొందరిని ... ఇచ్చినప్పుడు
  rationale: מִן ఇక్కడ విభాగార్థకంగా ఉండి, అతని సంతానమంతటినీ కాదు వారిలో కొందరిని సూచిస్తుంది. זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఇక్కడ పిల్లలు లేదా సంతానం అనే అర్థం.
- source_word: לַמֹּלֶךְ
  choice: మోలెకుకు
  rationale: ఈ ఆరాధనా సందర్భంలో స్థిరపడిన పేరును లిప్యంతరీకరించడం ద్వారా సూచిత వ్యక్తి లేదా ఆచారం గురించి అదనపు వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంటుంది.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: అతనికి మరణశిక్ష విధించకుండా ఉండేందుకు
  rationale: ఈ నిర్మాణం ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలియజేస్తుంది. న్యాయ సందర్భంలో ‘మరణశిక్ష విధించడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: לַמֹּלֶךְ అనే ఆరాధనా గ్రహీతను ఎలా అనువదించాలి
  choice: మోలెకు
  alternative: రాజుకు
  rationale: హల్లుల పాఠాన్ని సిద్ధాంతపరంగా ‘రాజు’ అని చదవగలిగినా, లేవీయకాండము 18:21; 20:2–5 సందర్భం నిషేధించబడిన ఆరాధనా గ్రహీత పేరు లేదా బిరుదైన ‘మోలెకు’ను బలంగా సమర్థిస్తుంది. లిప్యంతరీకరణ పాఠంలోని గుర్తింపును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. హెబ్రీ నుడికారాన్ని సహజమైన ‘కళ్లు మూసుకోవడం’గా ఇచ్చి, దాని అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
