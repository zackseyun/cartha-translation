source:
  edition: WLC
  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: te
  text: మృతాత్మల మాధ్యమాలనూ[a], ఆత్మసంప్రదింపుల సాధకులనూ ఆశ్రయించి, వారి వెంట వ్యభిచారం చేసే[b] వ్యక్తికి విరోధంగా నేను నా ముఖాన్ని తిప్పి, అతణ్ణి తన ప్రజలలోనుండి తొలగిస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతాత్మలను లేదా ఆత్మలను సంప్రదించే వారిని.’ హెబ్రీ పదం మృతులతో లేదా ఆత్మలతో సంప్రదింపులు జరిపే మాధ్యమాలను/సాధకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి వెంట వ్యభిచారానికి పాల్పడే.’ నిషిద్ధమైన ఆత్మసంబంధ ఆచారాలను అనుసరించడం ద్వారా నిబంధనకు అవిశ్వాసంగా ఉండడాన్ని తెలిపే రూపకం ఇది.
    reason: lexical_alternative
  - marker: c
    text: ‘తొలగిస్తాను’ అనేది ప్రామాణిక న్యాయపరమైన సూత్రం; తీర్పు ఏ విధంగా అమలవుతుందో ఈ వాక్యం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: న్యాయసంబంధ సందర్భంలో נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాకుండా వ్యక్తినే సూచిస్తుంది.
- source_word: תִּפְנֶה
  choice: ఆశ్రయించి
  rationale: పదశః ‘తిరగడం’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ సహాయం లేదా సమాచారం కోసం అటువంటి సాధకులను వెదకడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֹבֹת
  choice: చనిపోయినవారి ఆత్మలను సంప్రదించే మాధ్యమాలు
  rationale: אוֹב మృతులతో లేదా ఆత్మలతో సంప్రదింపులు జరిపే మాధ్యమం/సాధకుణ్ణి సూచిస్తుంది; వివరణాత్మక రూపం ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా ఉంటుంది.
- source_word: הַיִּדְּעֹנִים
  choice: క్షుద్రాత్మలను సంప్రదించేవారు
  rationale: יִדְּעֹנִי గూఢజ్ఞానం లేదా ఆత్మసంప్రదింపులతో సంబంధమున్న సాధకుణ్ణి సూచిస్తుంది; జతగా ఉన్న మొదటి పదం నుంచి భేదాన్ని కొంత నిలుపుతుంది.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: వారి వెంట వ్యభిచారిలా తిరిగే
  rationale: זנה లోని లైంగిక అవిశ్వాస రూపకాన్ని తొలగించకుండా, సహజమైన మరియు గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తికి విరోధంగా నా ముఖం నిలిపి
  rationale: దైవిక ప్రతిఘటన, తీర్పును తెలిపే హెబ్రీయ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: అతణ్ణి తొలగిస్తాను
  rationale: כרת అనే న్యాయసూత్రం తెలిపే తీవ్రమైన వేరుచేయడాన్ని వ్యక్తం చేస్తూ, దాని ఖచ్చితమైన విధానాన్ని నిర్దేశించదు.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: తన ప్రజల మధ్య నుండి
  rationale: సమాజం మధ్య నుంచి వేరుచేయబడే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధనపరమైన అవిశ్వాసానికి వ్యభిచార రూపకాన్ని నిలుపడం
  choice: వారి వెంట వ్యభిచారిలా తిరిగే
  alternative: వారిని అనుసరించి అవిశ్వాసంగా ప్రవర్తించే
  rationale: హెబ్రీ మూలం זנה అనే స్పష్టమైన లైంగిక అవిశ్వాస రూపకాన్ని వాడుతుంది; దాన్ని నిలపడం అపరాధంలోని నిబంధనపరమైన, ఆధ్యాత్మిక తీవ్రతను కాపాడుతుంది.
- issue: ‘తొలగించడం’ అనే శిక్ష యొక్క అర్థం
  choice: తన ప్రజల మధ్య నుండి తొలగిస్తాను
  alternative: నాశనం చేస్తాను / వెలివేస్తాను
  rationale: כרת యొక్క అమలు విధానం ఈ వాక్యంలో స్పష్టంగా లేదు. అనువాదం మరణం, వెలివేత లేదా ప్రత్యక్ష దైవిక తీర్పు అని నిర్ణయించకుండా మూలంలోని తీవ్రతతోపాటు సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకుడికి అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-ధార్మిక శైలి. మూలంలోని ‘ముఖం నిలపడం’ మరియు వ్యభిచార రూపకాలను సాధ్యమైనంత సహజంగా నిలిపింది; సాంకేతికంగా అస్పష్టమైన ఆత్మసంప్రదింపుల పదాలకు సంక్షిప్త వివరణాత్మక పదబంధాలు వాడింది.
