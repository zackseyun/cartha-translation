  to: మృతాత్మల మాధ్యమాలనూ[a], ఆత్మసంప్రదింపుల సాధకులనూ ఆశ్రయించి, వారి వెంట వ్యభిచారం చేసే[b] వ్యక్తికి విరోధంగా నేను నా ముఖాన్ని తిప్పి, అతణ్ణి తన ప్రజలలోనుండి తొలగిస్తాను[c].
  rationale: The revision removes the unwarranted ‘evil spirits’ implication, makes the covenant-infidelity metaphor explicit in Telugu, and improves the divine-opposition idiom. It preserves the source text’s ambiguity concerning the exact means of being ‘cut off’ and retains all required footnote anchors in sequence.
