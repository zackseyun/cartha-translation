review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the legal subject, the turning/consulting action, the covenant-infidelity metaphor, divine opposition, and the deliberately unspecified sanction. However, ‘క్షుద్రాత్మలను’ adds a pejorative specification (‘evil/low spirits’) not present in יִדְּעֹנִים. The wording for the prostitution metaphor should more directly retain the verbal metaphor rather than describe someone as wandering ‘like an adulterer.’
  naturalness: The sentence is generally readable, but ‘నా ముఖం నిలిపి’ and ‘వ్యభిచారిలా తిరిగే’ are less natural in modern standard Telugu. ‘నా ముఖాన్ని ... తిప్పి’ and ‘వ్యభిచారం చేసే’ are clearer while retaining the Hebrew imagery.
  terminology: Use neutral terminology for the paired occult practitioners. ‘మృతాత్మల మాధ్యమాలు’ and ‘ఆత్మసంప్రదింపుల సాధకులు’ distinguish the terms without asserting that the latter consult evil spirits. Retain ‘తొలగిస్తాను’ as an appropriately noncommittal rendering of the legal formula ‘cut off.’
  issues:
  - severity: medium
    issue: ‘క్షుద్రాత్మలను సంప్రదించేవారు’ for יִדְּעֹנִים
    rationale: The Hebrew term denotes a practitioner associated with occult/supernatural knowledge and is paired with אוֹב, but it does not specify ‘క్షుద్రాత్మలు’ (evil or inferior spirits). This addition narrows and prejudges the source term.
  - severity: medium
    issue: ‘వారి వెంట వ్యభిచారిలా తిరిగే’ for לִזְנוֹת אַחֲרֵיהֶם
    rationale: This Telugu wording means to roam about like an adulterer and does not directly express the Hebrew infinitive ‘to commit prostitution/be unfaithful after them.’ A direct verbal metaphor is both more faithful and more natural.
  - severity: low
    issue: ‘నా ముఖం నిలిపి’
    rationale: Although understandable, this is not the most idiomatic modern Telugu expression of the Hebrew judgment idiom. Turning one’s face against someone more naturally conveys directed opposition.
  revised_text: మృతాత్మల మాధ్యమాలనూ[a], ఆత్మసంప్రదింపుల సాధకులనూ ఆశ్రయించి, వారి వెంట వ్యభిచారం చేసే[b] వ్యక్తికి విరోధంగా నేను నా ముఖాన్ని తిప్పి, అతణ్ణి తన ప్రజలలోనుండి తొలగిస్తాను[c].
