  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: te
  text: మీరు నా కట్టడలను పాటించాలి, వాటిని ఆచరించాలి. నేను మిమ్మల్ని పవిత్రపరచే యాహ్వేను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని పవిత్రులుగా చేసేవాడను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: పాటించి
  rationale: שׁמר అనే పదానికి ‘కాపాడడం, పాటించడం, గమనించడం’ అనే భావాలు ఉన్నాయి. నియమాల సందర్భంలో ‘పాటించడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: חֻקֹּתַי
  choice: నా నియమాలను
  rationale: חֻקָּה నిర్దేశించబడిన శాసనం లేదా కట్టడను సూచిస్తుంది. ‘నియమాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరించాలి
  rationale: עשה ఇక్కడ నియమాలను కార్యరూపంలో అమలు చేయడాన్ని సూచిస్తుంది. ‘ఆచరించాలి’ కేవలం అంగీకరించడం కాక వాటి ప్రకారం నడుచుకోవాలనే భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
- source_word: מְקַדִּשְׁכֶם
  choice: మిమ్మల్ని పవిత్రపరచే
  rationale: קדשׁ పదంలోని హిఫీల్ కృదంతం దేవుడు వారిని పవిత్రులుగా చేసే నిరంతర లేదా లక్షణాత్మక కార్యాన్ని తెలియజేస్తుంది. ‘పవిత్రపరచే’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రతిలిపి ‘యెహోవా’ను వాడి, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: מְקַדִּשְׁכֶם లోని పవిత్రత భావం
  choice: మిమ్మల్ని పవిత్రపరచే
  alternative: మిమ్మల్ని పవిత్రులుగా చేసే
  rationale: ‘పవిత్రపరచే’ మూలంలోని קדשׁ పదసంబంధాన్ని, దేవుని క్రియాశీల కార్యాన్ని సంక్షిప్తంగా నిలుపుతుంది; ప్రత్యామ్నాయం అదే భావాన్ని మరింత వివరణాత్మకంగా చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి. బహువచన సంబోధనను నిలిపి, ఆజ్ఞను సహజమైన ‘ఆచరించాలి’ రూపంలో వ్యక్తం చేశాం.
