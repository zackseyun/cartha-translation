id: LEV.20.27
reference: Leviticus 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: te
  text: ఒక పురుషుడు గాని స్త్రీ గాని ఆత్మల మాధ్యమం[a] లేదా ఆత్మలను సంప్రదించేవాడు[b] అయితే, వారు తప్పక మరణశిక్ష పొందాలి. వారిని రాళ్లతో కొట్టి చంపాలి. వారి రక్తం వారిమీదే ఉంటుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మల మాధ్యమం’గా అనువదించిన హీబ్రూ పదం మృతులతో సంప్రదింపులకు సంబంధించిన ఆత్మను లేదా ఆ ఆత్మను సంప్రదించే మాధ్యమాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆత్మసంబంధ జ్ఞానం గల వ్యక్తి’; ఈ పదాన్ని సంప్రదాయంగా ‘మాంత్రికుడు’ అని కూడా అనువదిస్తారు, కాని ఆధునిక కల్పితకథల భావం రాకుండా ఇక్కడ వివరణాత్మక పదబంధం వాడబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘వారి రక్తం వారిమీదే ఉంటుంది’ అనేది తమ మరణశిక్షకు దోషులే బాధ్యులని తెలిపే న్యాయపరమైన సూత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֽוֹ אִשָּׁה
  choice: ఒక పురుషుడు గాని స్త్రీ గాని
  rationale: హీబ్రూ మూలంలోని పురుషుడు–స్త్రీ అనే స్పష్టమైన జతను నిలుపుతూ, ఆధునిక తెలుగు న్యాయవాక్యానికి సహజమైన ‘గాని…గాని’ నిర్మాణాన్ని వాడింది.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: …గా ఉంటే
  rationale: మూలంలో ఏకవచన క్రియతో బహువచన సర్వనామ సంబంధం ఉన్నప్పటికీ, భావం ఆ పురుషుడు లేదా స్త్రీలో ఈ ఆత్మసంబంధ స్థితి లేదా ఆచారం ఉండటమే. తెలుగులో అసహజమైన అక్షరానువాదాన్ని నివారించి ఆ భావాన్ని నేరుగా తెలిపింది.
- source_word: אוֹב
  choice: మృతాత్మల మాధ్యమం
  rationale: సందర్భంలో ఇది మృతాత్మలను సంప్రదించే మాధ్యమాన్ని లేదా దానితో అనుబంధమైన ఆత్మను సూచించవచ్చు. ప్రధాన పాఠంలో ఆచరణకర్త భావాన్ని స్పష్టంగా ఉంచి, మూలంలోని పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
- source_word: יִדְּעֹנִי
  choice: ఆత్మలను సంప్రదించే వ్యక్తి
  rationale: ఆత్మసంబంధ జ్ఞానం లేదా సంప్రదింపులతో ముడిపడిన ఆచరణకర్తను సూచిస్తుంది. పాతకాలపు లేదా కల్పితకథల భావం కలిగించే పదాల బదులు సాధారణ పాఠకులకు స్పష్టమైన వివరణాత్మక పదబంధాన్ని ఎంచుకుంది.
- source_word: מוֹת יוּמָתוּ
  choice: తప్పక మరణశిక్ష పొందాలి
  rationale: క్రియను బలపరచే హీబ్రూ infinitive absolute నిర్మాణాన్ని ‘తప్పక’తో వ్యక్తపరుస్తూ, ఇది న్యాయశిక్ష అని స్పష్టం చేసింది.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: ప్రజలు అలాంటి వారిని రాళ్లతో కొట్టి చంపాలి
  rationale: మూలంలోని రాళ్లతో కొట్టే శిక్షను, దాని ప్రాణాంతక న్యాయసందర్భంతో సహా సహజమైన ఆధునిక తెలుగులో తెలిపింది. హీబ్రూలోని అనిర్దిష్ట బహువచన కర్తను ‘ప్రజలు’గా వ్యక్తం చేసింది.
- source_word: דְּמֵיהֶם בָּם
  choice: వారి రక్తం వారిమీదే ఉంటుంది
  rationale: మరణానికి బాధ్యత దోషులదేనని తెలిపే హీబ్రూ న్యాయసూత్రాన్ని వివరణలో కలిపివేయకుండా రూపకభాషతోనే నిలిపింది.
theological_decisions:
- issue: ఆత్మసంబంధ ఆచారాలకు వాడిన אוֹב, יִדְּעֹנִי పదాల అర్థం
  choice: ‘మృతాత్మల మాధ్యమం’ మరియు ‘ఆత్మలను సంప్రదించే వ్యక్తి’
  alternative: ‘పరిచితాత్మ’ మరియు ‘మాంత్రికుడు’; లేదా ‘ప్రేతాత్మ’ మరియు ‘శకునగాడు’
  rationale: వచనం నిషేధిస్తున్న ఆత్మసంబంధ ఆచారాన్ని స్పష్టంగా తెలియజేస్తూనే, ప్రాచీన పదాల ఖచ్చిత వర్గీకరణను లేదా ఆత్మల స్వరూపంపై అదనపు సిద్ధాంతాన్ని అనువాదం నిర్ణయించదు.
- issue: పురుషుడు–స్త్రీ అనే స్పష్టమైన రూపం
  choice: ‘ఒక పురుషుడు గాని స్త్రీ గాని’ అని నిలుపుట
  alternative: ‘ఎవరైనా’ అని లింగనిరపేక్షంగా సాధారణీకరించుట
  rationale: మూలపాఠం రెండు లింగాలనూ స్పష్టంగా పేర్కొంటుంది; అందువల్ల ఆ రూపాన్ని ప్రధాన పాఠంలో నిలిపింది.
- issue: ‘వారి రక్తం వారిమీదే’ అనే న్యాయసూత్రం
  choice: రూపకాన్ని ప్రధాన పాఠంలో యథాతథంగా నిలుపుట
  alternative: ‘తమ మరణానికి వారే బాధ్యులు’ అని వివరణాత్మకంగా అనువదించుట
  rationale: మూలంలోని న్యాయపరమైన రూపకభాషను కాపాడి, దాని ఉద్దేశాన్ని పాదటిప్పణిలో వివరించింది; తద్వారా భావాన్ని అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన న్యాయశైలిని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచింది. పాతకాలపు ‘కర్ణపిశాచము’ వంటి అస్పష్ట పదాలను నివారించింది; మూలంలోని లింగజత, శిక్ష తీవ్రత, రక్తరూపకాన్ని నిలిపింది.
