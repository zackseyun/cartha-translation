  source_fidelity: హీబ్రూ వచనంలోని పురుషుడు–స్త్రీ జత, మరణదండనను బలపరిచే నిర్మాణం, రాళ్లతో కొట్టి చంపే విధానం, అలాగే ‘వారి రక్తం వారిమీదే’ అనే న్యాయసూత్రం ముసాయిదాలో సాధారణంగా నిలిచాయి. అయితే אוֹב ను ‘మృతాత్మల’తో పరిమితం చేయడం మూలపదంలోని విస్తృత/వివాదాస్పద సూచనను కొంత నిర్దిష్టం చేస్తోంది. יִדְּעֹנִיకి ఉన్న ఆత్మసంబంధ-ఆచరణకర్త అర్థాన్ని వివరణాత్మకంగా ఉంచవచ్చు, కానీ తెలుగు వాక్యంలో రెండు వ్యక్తిపదాల సమాంతరత మరింత స్పష్టంగా ఉండాలి.
  naturalness: ప్రస్తుత తెలుగు స్పష్టంగాను ఆధునికంగాను ఉంది. అయినా ‘మృతాత్మల మాధ్యమంగా లేదా ఆత్మలను సంప్రదించే వ్యక్తిగా ఉంటే’ అనే నిర్మాణం కొద్దిగా అసమాంతరంగా ఉంది; రెండు పదాలనూ వ్యక్తిని సూచించే సమాంతర పదబంధాలుగా చేయడం సహజం. ‘ప్రజలు’ అనేది మూలంలో లేని నిర్దిష్ట కర్త కాబట్టి దానిని తొలగించి నిష్పాక్షిక న్యాయవాక్యశైలిని ఉంచడం మంచిది.
  terminology: ‘మాధ్యమం’ అనేది אוֹבకు ఆధునికంగా అర్థమయ్యే ఎంపిక. ప్రధాన పాఠంలో ‘మృతాత్మల’ అనే పరిమితిని తొలగించి, పాదటిప్పణిలో మృతులతో సంప్రదింపుల సంబంధాన్ని పేర్కొనడం మూలంలోని సందిగ్ధతను కాపాడుతుంది. יִדְּעֹנִיకి ‘ఆత్మలను సంప్రదించేవాడు’ అనే పదబంధం స్పష్టమైన, సిద్ధాంతరహిత ఎంపికగా నిలుస్తుంది.
