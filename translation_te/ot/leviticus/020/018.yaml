id: LEV.20.18
reference: Leviticus 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: te
  text: ఒక పురుషుడు నెలసరి అశుద్ధతలో ఉన్న స్త్రీతో శయనించి, ఆమె నగ్నతను బయలుపరిస్తే, అతడు ఆమె రక్తప్రవాహ మూలాన్ని బహిర్గతం చేశాడు,[b] ఆమె తన రక్తపు మూలాన్ని బయలుపరిచింది; వారిద్దరూ తమ ప్రజల మధ్య నుండి వేరుచేయబడుదురు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా, “అతడు ఆమె మూలాన్ని బహిర్గతం చేశాడు; ఆమె తన రక్తాల మూలాన్ని బయలుపరిచింది.” “మూలం” అనేది ఇక్కడ శరీరంలోని రక్తప్రవాహాన్ని సూచించే మర్యాదోక్తి.
    reason: lexical_alternative
  - marker: c
    text: “వేరుచేయబడుదురు” అనేది తోరాలో కనిపించే స్థిర న్యాయ సూత్రం. ఆ తొలగింపు ఏ విధంగా జరుగుతుందో ఈ వచనం పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: పురుష ఏకవచన న్యాయ సూత్రాన్ని, లైంగిక సందర్భాన్ని లింగస్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: స్త్రీతో శయనించి
  rationale: లైంగిక సంభోగాన్ని సూచించే హీబ్రూ న్యాయపరమైన నానుడిని గౌరవప్రదంగా, అతిగా వైద్యపరంగా కాకుండా నిలుపుతుంది.
- source_word: דָּוָה
  choice: నెలసరి అశుద్ధతలో ఉన్న
  rationale: ఈ పదం నెలసరి స్థితినీ, లేవీయకాండంలోని ఆచారపరమైన అశుద్ధత భావాన్నీ సూచిస్తుంది.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: ఆమె మానాన్ని బయలుపరిస్తే
  rationale: లేవీయకాండంలో అక్రమ లైంగిక సంబంధాన్ని సూచించే స్థిర నానుడి యొక్క శరీర-బహిర్గత రూపకాన్ని నిలుపుతుంది.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: ఆమె రక్తస్రావపు మూలాన్ని బహిర్గతం చేశాడు
  rationale: מָקוֹר అనే ‘మూలం/ఊట’ రూపకాన్ని నిలుపుతూ, సందర్భానుసారంగా అది రక్తస్రావానికి సంబంధించినదని స్పష్టం చేస్తుంది.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: ఆమె కూడా తన రక్తస్రావపు మూలాన్ని బయలుపరిచింది
  rationale: మహిళ భాగస్వామ్యాన్ని తెలిపే సమాంతర వాక్యనిర్మాణాన్ని, ‘మూలం’ అనే హీబ్రూ రూపకాన్ని కాపాడుతుంది.
- source_word: וְנִכְרְתוּ
  choice: తొలగించబడాలి
  rationale: ప్రజల మధ్య నుంచి వేరుచేయబడటాన్ని తెలిపే నిబంధనాత్మక భావాన్ని సహజ తెలుగులో ఇస్తుంది; అది ఎలా అమలవుతుందో నిర్దేశించదు.
- source_word: מִקֶּרֶב עַמָּם
  choice: తమ ప్రజల మధ్య నుండి
  rationale: సమాజ-నిబంధన సందర్భాన్ని సహజంగా, మూలానికి సమీపంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: דָּוָהలో స్త్రీ స్థితి స్వభావం
  choice: నెలసరి అశుద్ధత
  alternative: నెలసరిలో ఉన్నప్పుడు; రోగస్థితి/అశుద్ధత
  rationale: లేవీయకాండ సందర్భంలో ఇది సాధారణ వ్యాధి కాదు; నెలసరితో ముడిపడిన ఆచారపరమైన అశుద్ధత. ప్రధాన పాఠ్యం ఈ రెండు కోణాలనూ సంక్షిప్తంగా తెలియజేస్తుంది.
- issue: וְנִכְרְתוּ శిక్ష యొక్క స్వరూపం
  choice: తమ ప్రజల మధ్య నుండి తొలగించబడాలి
  alternative: మరణశిక్ష విధించాలి; సమాజం నుంచి బహిష్కరించాలి; సంతానం లేకుండా మరణించాలి
  rationale: ఇక్కడ హీబ్రూ సూత్రం అమలు విధానాన్ని స్పష్టంగా చెప్పదు. అందువల్ల వివాదాస్పదమైన నిర్దిష్ట శిక్షను అనువాదంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ధార్మిక శైలి. ‘శయనించి,’ ‘మానం,’ ‘మూలం’ వంటి పదాలు హీబ్రూ నానుడి మరియు రూపకాన్ని నిలుపుతాయి; పాదసూచికలు అవసరమైన స్పష్టతను ఇస్తాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
