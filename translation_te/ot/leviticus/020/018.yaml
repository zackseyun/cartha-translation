  to: ఒక పురుషుడు నెలసరి అశుద్ధతలో ఉన్న స్త్రీతో శయనించి, ఆమె నగ్నతను బయలుపరిస్తే, అతడు ఆమె రక్తప్రవాహ మూలాన్ని బహిర్గతం చేశాడు,[b] ఆమె తన రక్తపు మూలాన్ని బయలుపరిచింది; వారిద్దరూ తమ ప్రజల మధ్య నుండి వేరుచేయబడుదురు.[c]
  rationale: ‘మానం’ స్థానంలో ‘నగ్నత’ను పెట్టడం ద్వారా లేవీయకాండపు స్థిరమైన ‘నగ్నతను బయలుపరచు’ నానుడిని, అలాగే మూలపాఠంలోని శరీరార్థాన్ని పునరుద్ధరించాం. ‘మూలం’కు సంబంధించిన రెండు సమాంతర వాక్యాల్లో హీబ్రూ పదప్రయోగ భేదాన్ని నిలిపి, ప్రధాన పాఠ్యంలో అర్థవంతమైన ‘రక్తప్రవాహ’ పదాన్ని వాడాం. పాదసూచిక గుర్తులను వాటి సంబంధిత పదబంధాల వద్ద ఉంచాం. Note a is retained as a valid lexical alternative, but its anchor should be placed after ‘అశుద్ధతలో’ in typesetting; it is not embedded in the revised_text because the requested text string currently only displays the notes requiring direct lexical and legal anchors.
