id: LEV.20.17
reference: Leviticus 20:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: te
  text: ఎవరైనా పురుషుడు తన సహోదరిని—ఆమె తన తండ్రి కుమార్తె అయినా, తన తల్లి కుమార్తె అయినా—తీసుకొని, ఆమె నగ్నత్వాన్ని చూసి, ఆమె అతని నగ్నత్వాన్ని చూసినట్లయితే, అది అవమానకరమైన పని[a]. వారి ప్రజల సమక్షంలో వారిద్దరూ తొలగించబడాలి[b]. అతడు తన సహోదరి నగ్నత్వాన్ని బయలుపరిచాడు; అతడు తన దోషాన్ని భరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం חֶסֶד సాధారణంగా ‘కృప’ లేదా ‘నిబద్ధ ప్రేమ’ అని అర్థమిస్తుంది; అయితే ఈ అరుదైన ప్రతికూల వాడుకలో ‘అవమానకరమైన పని,’ ‘సిగ్గుచేటైన పని,’ లేదా ‘నిందార్హమైన పని’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తొలగించబడాలి’ అనే హీబ్రూ న్యాయసూత్రం మరణశిక్షను, బహిష్కరణను, లేదా మరొక విధమైన తొలగింపును సూచిస్తుందో ఈ వచనం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: హీబ్రూ న్యాయవాక్యంలోని పుంలింగ ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִקַּח
  choice: తీసుకొని
  rationale: మూల క్రియ యొక్క ‘తీసుకొను’ అనే విస్తృత భావాన్ని నిలుపుతూ, వివాహమా లేక లైంగిక సంబంధమా అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: తన సహోదరిని—ఆమె తన తండ్రి కుమార్తె అయినా, తన తల్లి కుమార్తె అయినా—
  rationale: తండ్రివైపు లేదా తల్లివైపు సహోదరి అనే రెండింటినీ చేర్చే మూలంలోని వివరణను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: ఆమె నగ్నత్వాన్ని చూస్తే, ఆమె కూడా అతని నగ్నత్వాన్ని చూస్తే
  rationale: లైంగిక భావం గల హీబ్రూ న్యాయనుడికారాన్ని వ్యాఖ్యానించి మార్చకుండా, దాని చిత్రణను నిలుపుతుంది.
- source_word: חֶסֶד
  choice: అవమానకరమైన పని
  rationale: ఇక్కడ సాధారణ సానుకూల అర్థమైన ‘కృప/నిబద్ధ ప్రేమ’ సరిపోదు; అరుదైన ప్రతికూల అర్థాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: וְנִכְרְתוּ
  choice: వారిద్దరూ తొలగించబడాలి
  rationale: כרת న్యాయసూత్రంలోని శిక్షను సూచిస్తూ, అది మరణశిక్షా, బహిష్కరణా, మరొక విధమైన తొలగింపా అనే అంశాన్ని నిర్దిష్టం చేయదు.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: వారి ప్రజల కళ్ల ఎదుట
  rationale: మూలంలోని దృశ్యరూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גִּלָּה
  choice: బయలుపరిచాడు
  rationale: లేవీయకాండంలోని అక్రమ లైంగిక సంబంధాల నుడికారాన్ని నిలుపుతుంది.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: తన దోషాన్ని భరించాలి
  rationale: దోషాన్నీ దాని పరిణామాన్నీ సూచించగల హీబ్రూ న్యాయసూత్రం యొక్క ఉద్వేగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలో חֶסֶד అర్థం
  choice: ప్రతికూల భావంలో ‘అవమానకరమైన పని’
  alternative: సాధారణ సానుకూల భావంలో ‘కృప’ లేదా ‘నిబద్ధ ప్రేమ’
  rationale: నిషేధం మరియు శిక్ష సందర్భం ప్రతికూల అర్థాన్నే కోరుతుంది; సానుకూల అర్థం ఇక్కడ భావాన్ని వక్రీకరిస్తుంది.
- issue: ‘తొలగించబడాలి’ అనే శిక్ష యొక్క స్వరూపం
  choice: శిక్ష విధానాన్ని నిర్దిష్టం చేయకుండా న్యాయసూత్రాన్ని నిలుపడం
  alternative: మరణశిక్ష లేదా సమాజం నుంచి బహిష్కరణ అని స్పష్టీకరించడం
  rationale: మూలంలోని כרת సూత్రం ఈ వచనంలో అమలు పద్ధతిని స్వయంగా నిర్దేశించదు; అందువల్ల అసలైన సందిగ్ధతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండ న్యాయభాషకు తగిన గంభీరతతో. ‘నగ్నత్వాన్ని చూడడం/బయలుపరచడం’ అనే మూల నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపి, లైంగిక సంబంధం అని వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
