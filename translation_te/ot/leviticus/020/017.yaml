  to: ఎవరైనా పురుషుడు తన సహోదరిని—ఆమె తన తండ్రి కుమార్తె అయినా, తన తల్లి కుమార్తె అయినా—తీసుకొని, ఆమె నగ్నత్వాన్ని చూసి, ఆమె అతని నగ్నత్వాన్ని చూసినట్లయితే, అది అవమానకరమైన పని[a]. వారి ప్రజల సమక్షంలో వారిద్దరూ తొలగించబడాలి[b]. అతడు తన సహోదరి నగ్నత్వాన్ని బయలుపరిచాడు; అతడు తన దోషాన్ని భరించాలి.
