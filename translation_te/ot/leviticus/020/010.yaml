source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: te
  text: ఒక పురుషుడు మరొక పురుషుని భార్యతో వ్యభిచారం చేస్తే—అంటే, తన పొరుగువాని భార్యతో వ్యభిచారం చేస్తే—వ్యభిచారం చేసిన పురుషుడికీ వ్యభిచారం చేసిన స్త్రీకీ తప్పకుండా మరణశిక్ష విధించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక పురుషుని భార్యతో ... తన పొరుగువాని భార్యతో.” న్యాయశైలిలోని ఈ పునరుక్తి అపరాధాన్ని బలంగా నొక్కిచెప్పి స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు ... చేస్తే
  rationale: సంధికారకంతో కూడిన నామవాచకం, సంబంధవాచక కణం ఇక్కడ నియమంలోని షరతును పరిచయం చేస్తున్నాయి. ఆధునిక తెలుగు న్యాయశైలిలో ‘చేస్తే’ సహజంగా ఆ షరతును తెలియజేస్తుంది; మూలంలోని పురుష ఏకవచనాన్ని కూడా నిలుపుతుంది.
- source_word: יִנְאַף
  choice: వ్యభిచారం చేస్తే
  rationale: נאף సాధారణ లైంగిక అనైతికతను కాకుండా ప్రత్యేకంగా వివాహేతర సంబంధమైన వ్యభిచారాన్ని సూచిస్తుంది.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: మరొక పురుషుని భార్యతో
  rationale: అక్షరార్థంగా ‘ఒక పురుషుని భార్యతో.’ సందర్భంలో ఆమె అపరాధి కాని మరొక పురుషుని భార్య అని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִנְאַף אֶת אֵשֶׁת רֵעֵהוּ
  choice: అంటే, తన పొరుగువాని భార్యతో వ్యభిచారం చేస్తే
  rationale: మూలంలోని పునరుక్తి అపరాధాన్ని న్యాయపరంగా స్పష్టం చేసి బలపరుస్తుంది. ‘అంటే’ దాని వివరణాత్మక సంబంధాన్ని తెలుపుతుంది; ‘పొరుగువాడు’ అనేది కేవలం పక్కింటివాడిని మాత్రమే కాక తోటి సమాజ సభ్యునినీ సూచించగల సంప్రదాయ, గ్రాహ్య సమానం.
- source_word: מוֹת יוּמַת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియానామం మరియు పరిమిత క్రియ కలయిక మరణదండనను బలంగా నిర్దేశిస్తుంది. ఈ తెలుగు రూపం ఆ ఉద్ఘాటనను, న్యాయశైలిని కాపాడుతూ శిక్ష అమలు పద్ధతిని చేర్చదు.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: వ్యభిచారం చేసిన పురుషుడికీ వ్యభిచారం చేసిన స్త్రీకీ
  rationale: పురుష, స్త్రీ కర్తృవాచక రూపాలను సమాంతరంగా, స్పష్టంగా చూపుతుంది. ‘వ్యభిచారి/వ్యభిచారిణి’ కంటే ఈ విస్తృత రూపం సాధారణ ఆధునిక పాఠకులకు మరింత నేరుగా అర్థమవుతుంది.
theological_decisions:
- issue: లింగాన్ని స్పష్టంగా తెలిపే న్యాయభాష
  choice: ‘పురుషుడు’ అని ఉంచి, శిక్షకు లోబడే పురుషుడు మరియు స్త్రీ ఇద్దరినీ విడివిడిగా పేర్కొనడం
  alternative: ‘ఎవరైనా వ్యభిచారం చేస్తే ... ఇద్దరికీ’ అని లింగతటస్థంగా చెప్పడం
  rationale: హీబ్రూ కేసు వివరణలోనూ శిక్ష విధానంలోనూ లింగాన్ని స్పష్టంగా పేర్కొంటుంది; అనువాదం ఆ రూపాన్ని చెరపదు.
- issue: మరణదండన సూత్రం
  choice: ‘తప్పకుండా మరణశిక్ష విధించాలి’
  alternative: ‘వారిని చంపాలి’ లేదా నిర్దిష్ట మరణశిక్ష పద్ధతిని పేర్కొనడం
  rationale: మూలం మరణదండనను ఉద్ఘాటిస్తుంది, కానీ ఈ వచనంలో దాని అమలు పద్ధతిని చెప్పదు. అందువల్ల అదనపు సంప్రదాయ వివరాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలి. మూలంలోని షరతు, పునరుక్తి, లింగభేద సూచన, ఉద్ఘాటిత మరణదండన అన్నీ నిలుపబడ్డాయి. ‘వ్యభిచారి/వ్యభిచారిణి’ వంటి కొంత గ్రాంథిక నామరూపాల బదులు సులభంగా అర్థమయ్యే వివరణాత్మక పదబంధాలు వాడబడ్డాయి.
