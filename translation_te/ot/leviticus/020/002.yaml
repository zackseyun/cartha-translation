source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: te
  text: '“నీవు ఇశ్రాయేలు ప్రజలతో ఇలా చెప్పాలి: ఇశ్రాయేలీయుల్లో గాని, ఇశ్రాయేలులో నివసిస్తున్న పరదేశుల్లో[a] గాని ఎవడైనా తన సంతానంలో ఎవరినైనా[b] మోలెకుకు[c] ఇస్తే, అతనికి తప్పకుండా మరణశిక్ష విధించాలి. దేశ ప్రజలు అతన్ని రాళ్లతో కొట్టి చంపాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నివసిస్తున్న పరదేశి’ అంటే ఇశ్రాయేలు మధ్య స్థిరంగా నివసించే విదేశీయుడు. హీబ్రూలో ‘పరదేశి/నివాసి’ అనే నామవాచకంతో దానికి సమాన మూలంగల ‘నివసించు’ అనే క్రియ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘సంతానం’ అని అనువదించిన హీబ్రూ పదానికి పదశః అర్థం ‘విత్తనం’; ఇక్కడ అది ఒకరి పిల్లలను లేదా వారసులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: మోలెక్ అనేది సాధారణంగా పిల్లల బలితో సంబంధమున్న దేవత లేదా బిరుదు పేరుగా అర్థం చేసుకుంటారు. అయితే కొందరు ఈ పదం ఒక ప్రత్యేక అర్పణ రకాన్ని సూచిస్తుందని భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం. ‘ఇశ్రాయేలు కుమారులు’ అనే పదశః రూపం తెలుగులో ఇక్కడ అనవసరంగా కేవలం పురుషులనే సూచించేలా వినిపించవచ్చు.
- source_word: אִישׁ אִישׁ
  choice: ఎవడైనా
  rationale: పునరుక్త నామవాచకం ప్రతి వ్యక్తికీ వర్తించే పంపిణీ భావాన్ని ఇస్తుంది. ‘ఎవడైనా’ ఆ భావాన్నీ, మూలంలోని ఏకవచన పుంలింగ రూపాన్నీ సహజంగా నిలుపుతుంది.
- source_word: הַגֵּר הַגָּר
  choice: నివసించే పరదేశి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే విదేశీయుణ్ణి సూచిస్తుంది. నామవాచకం, దానికి సమాన మూలంగల క్రియ అనే హీబ్రూ నిర్మాణాన్ని తెలుగు సహజత్వంతో సాధ్యమైనంతవరకు ప్రతిబింబిస్తుంది.
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: తన సంతానంలో ఒకరిని మోలెకుకు ఇస్తే
  rationale: זֶרַע పదశః ‘విత్తనం’; ఇక్కడ అది సంతానం లేదా పిల్లలను సూచిస్తుంది. מִן రూపం సంతానంలో కొంతమందిని లేదా ఒకరిని సూచించగలదు; తెలుగులో ‘ఒకరిని’ సందర్భానికి సహజంగా ఉంది.
- source_word: לַמֹּלֶךְ
  choice: మోలెకుకు
  rationale: ప్రధాన పఠనం ప్రకారం దీనిని దేవత లేదా బిరుదు పేరుగా లిప్యంతరీకరించాం; అర్పణ రకాన్ని సూచించే అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియావిశేష బలాన్ని ఇచ్చే infinitive absolute మరియు passive finite verb కలయిక నిశ్చితమైన న్యాయశిక్షను సూచిస్తుంది. ఈ తెలుగు రూపం ఉద్ఘాటననూ న్యాయపరమైన భావాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: పదబంధాన్ని సాధారణ సామూహిక అర్థంలో అనువదించాం; తరువాతి కాలపు ప్రత్యేక సామాజిక వర్గార్థాన్ని ఇక్కడ చేర్చలేదు.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: అతన్ని రాళ్లతో కొట్టి చంపాలి
  rationale: రాళ్లతో కొట్టే శిక్షను సహజమైన తెలుగులో స్పష్టంగా తెలిపింది. ముందున్న మరణశిక్ష సందర్భం వల్ల ‘చంపాలి’ అనేది చర్య యొక్క న్యాయపరమైన ఫలితాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోలెకుకు సంతానాన్ని ఇవ్వడం అనే ఆచారం యొక్క స్వరూపం
  choice: ప్రధాన పాఠ్యంలో ‘మోలెకుకు ఇస్తే’ అని మాత్రమే ఉంచడం
  alternative: ‘మోలెక్ అనే దేవునికి బలిగా అర్పిస్తే’ లేదా ‘మోలెక్ అర్పణగా ఇస్తే’
  rationale: ఈ వాక్యం స్వయంగా అగ్ని, బలి విధానం వంటి వివరాలను చెప్పదు. అందువల్ల విస్తృత బైబిలు నేపథ్యంలోని వివరాలను ప్రధాన పాఠ్యంలో చేర్చకుండా, మోలెక్ దేవత/బిరుదు అనే సాధారణ అవగాహనను అనుసరించాం; అర్పణ రకం అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రజలకు సులభంగా అర్థమయ్యే గంభీరమైన న్యాయశాసన శైలిని అనుసరించాం. మూలంలోని ఉద్ఘాటనను ‘తప్పకుండా’తో నిలిపి, హీబ్రూ నుడికారాలను తెలుగు సహజత్వానికి అనుగుణంగా మార్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
