  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: te
  text: ఒక పురుషుడు తన తండ్రి సోదరుని భార్యతో శయనిస్తే, అతడు తన తండ్రి సోదరుని నగ్నత్వాన్ని బయలుపరచాడు.[a] వారిద్దరూ తమ పాపాన్ని భరిస్తారు;[b] సంతానం లేనివారిగా చనిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు తన తండ్రి సోదరుని నగ్నత్వాన్ని బయలుపరచాడు.” ఇది అతని భార్యతో శయనించడం ద్వారా నిషిద్ధ బంధాన్ని ఉల్లంఘించడాన్ని సూచించే లేవీయకాండపు నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారిద్దరూ తమ అపరాధభారాన్ని భరిస్తారు.” హీబ్రూ నుడికారం పాపాన్నిగానీ, దాని వల్ల కలిగే అపరాధబాధ్యతనుగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: ఒక పురుషుడు … చేస్తే
  rationale: ఈ న్యాయవాక్యంలోని షరతును సహజమైన ఆధునిక తెలుగులో చూపుతుంది; אִישׁ యొక్క పురుష ఏకవచన భావాన్ని కూడా నిలుపుతుంది.
- source_word: יִשְׁכַּב אֶת
  choice: తో శయనిస్తే
  rationale: ఇక్కడ שׁכב లైంగిక సంభోగానికి వాడిన మర్యాదపూర్వక నుడికారం. ‘శయనిస్తే’ మూలంలోని రూపకాన్ని నిలుపుతూ గౌరవప్రదమైన శైలిని ఇస్తుంది.
- source_word: דֹּדָתוֹ
  choice: తన బాబాయి భార్య
  rationale: ఈ పదం మామూలుగా ఒక పురుషుని తండ్రి సోదరుని భార్యను సూచిస్తుంది. తెలుగు ‘అత్త’ అనేక బంధాలకు వర్తించగలదు కాబట్టి, బంధాన్ని స్పష్టంగా చెప్పడం అపార్థాన్ని తగ్గిస్తుంది.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: తన బాబాయి నగ్నత్వాన్ని బయలుపరచినవాడవుతాడు
  rationale: నిషిద్ధ లైంగిక బంధాన్ని సూచించే లేవీయకాండపు స్థిర నుడికారాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: వారిద్దరూ తమ పాపాన్ని భరిస్తారు
  rationale: బహువచనం ఇద్దరి బాధ్యతను సూచిస్తుంది. חטא పాపాన్ని లేదా దాని అపరాధబాధ్యతను సూచించగలదు; ప్రధాన పాఠం మొదటి భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: עֲרִירִים יָמֻתוּ
  choice: సంతానం లేనివారిగా చనిపోతారు
  rationale: శిక్ష అమలయ్యే విధానాన్ని మూలం వివరించదు; సంతానరాహిత్య స్థితి మరియు మరణం అనే రెండు అంశాలను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ అనే శిక్ష యొక్క ఖచ్చిత భావం
  choice: సంతానం లేనివారిగా చనిపోతారు
  alternative: సంతానం లేకుండానే చనిపోతారు; లేదా జీవించి ఉండే సంతానం లేకుండా చనిపోతారు
  rationale: హీబ్రూ వాక్యం శిక్ష యొక్క యంత్రాంగాన్ని గానీ, అప్పటికే ఉన్న పిల్లలకు ఏమవుతుందో గానీ స్పష్టంగా చెప్పదు. అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా సంక్షిప్త న్యాయసూత్రాన్ని అలాగే ఉంచాం.
- issue: חֶטְאָם యొక్క భావం
  choice: తమ పాపాన్ని భరిస్తారు
  alternative: తమ అపరాధభారాన్ని భరిస్తారు
  rationale: ఈ పదం చేసిన పాపాన్నీ, దాని వల్ల కలిగే అపరాధబాధ్యతనూ సూచించవచ్చు. ప్రధాన పాఠంలో మూలానికి దగ్గరైన ‘పాపం’ ఉంచి, రెండవ భావాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘శయనిస్తే’ లైంగిక చర్యను మర్యాదపూర్వకంగా తెలియజేస్తుంది. ‘బాబాయి భార్య’ బంధాన్ని స్పష్టపరుస్తుంది; ‘నగ్నత్వాన్ని బయలుపరచడం’ అనే మూల నుడికారం పాదటిప్పణి సహాయంతో యథాతథంగా నిలుపబడింది.
