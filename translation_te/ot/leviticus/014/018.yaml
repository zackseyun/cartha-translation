id: LEV.14.18
reference: Leviticus 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: te
  text: యాజకుని అరచేతి మీద మిగిలిన నూనెను యాజకుడు శుద్ధి పొందుతున్న వ్యక్తి[a] తల మీద వేయాలి. యాహ్వే సన్నిధిలో యాజకుడు అతని కొరకు ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధి చేసుకుంటున్న వ్యక్తి.’
    reason: హీబ్రూ హిత్‌పయేల్ కృదంతం ఆచారపరమైన శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది; సందర్భానుసారం దాని మధ్య/ప్రతిబింబ భావాన్ని కూడా ఇలా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: నూనెలో మిగిలినదాన్ని
  rationale: נותר అనే పదం మిగిలి ఉన్న దానిని సూచిస్తుంది. בַּשֶּׁמֶן‌కు ఈ సందర్భంలో భాగార్థక భావం ఉంది; తెలుగులో ‘నూనెలో మిగిలినది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: యాజకుని అరచేతి మీద ఉన్న
  rationale: כַּף చేతి అరను ప్రత్యేకంగా సూచిస్తుంది; עַל అనే పదంలోని ‘మీద’ భావాన్ని నిలుపుకున్నాం.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: తల మీద అతడు వేయాలి
  rationale: נתן‌కు పెట్టు, ఉంచు, వేయు అనే విస్తృత అర్థాలు ఉన్నాయి. నూనెను తలపై ఉంచే ఈ ఆచార సందర్భంలో ‘వేయాలి’ సహజంగా ఉండి, మూలంలోని సాధారణ క్రియార్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్నవాని
  rationale: Hitpael వర్తమాన కృదంతం ఆచారపరమైన శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది. ఈ అనువాదం పూర్తయిన స్థితిగా కాక కొనసాగుతున్న ప్రక్రియగా చూపుతుంది.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ఆచార సందర్భంలో כפר యొక్క స్థిరమైన ధార్మిక భావాన్ని ‘ప్రాయశ్చిత్తం చేయు’ నిలుపుతుంది; עָלָיו ఇక్కడ అతని పక్షంగా లేదా అతని కోసం అనే భావాన్ని ఇస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో.’ יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ హీబ్రూ నామానికి దగ్గరైన లిప్యంతరీకరణ; ‘ప్రభువు’ దానిని బిరుదుగా మార్చుతుంది, ‘యెహోవా’ వేరొక సంప్రదాయ ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: యాజక ఆచారంలో כפר భావం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి; శుద్ధి కలిగించాలి
  rationale: ‘ప్రాయశ్చిత్తం చేయాలి’ ఆచారపరమైన ధార్మిక విస్తృతిని నిలుపుతుంది; అది ప్రాయశ్చిత్తం ఎలా పనిచేస్తుందనే ఏ ప్రత్యేక సిద్ధాంతాన్నీ వాక్యంలోకి చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆచారపరమైన ‘శుద్ధి,’ ‘ప్రాయశ్చిత్తం’ అనే పదాలను సందర్భానికి అవసరమైన ధార్మిక ఖచ్చితత్వం కోసం నిలిపాం.
