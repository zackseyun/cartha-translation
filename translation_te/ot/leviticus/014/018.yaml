revisions:
- from: యాజకుని అరచేతి మీద ఉన్న నూనెలో మిగిలినదాన్ని శుద్ధి పొందుతున్నవాని[a] తల మీద అతడు వేయాలి. యాహ్వే సన్నిధిలో యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి.
  to: యాజకుని అరచేతి మీద మిగిలిన నూనెను యాజకుడు శుద్ధి పొందుతున్న వ్యక్తి[a] తల మీద వేయాలి. యాహ్వే సన్నిధిలో యాజకుడు అతని కొరకు ప్రాయశ్చిత్తం చేయాలి.
