revisions:
- from: ఎనిమిదవ రోజున అతడు తన శుద్ధీకరణ[a] కోసం వాటిని యాజకుని దగ్గరికి—ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర యాహ్వే సన్నిధికి—తీసుకురావాలి.
  to: ఎనిమిదవ రోజున అతడు తన శుద్ధి[a] కొరకు వాటిని యాహ్వే సన్నిధిలో, సమాగమ గుడారపు ప్రవేశద్వారం వద్ద, యాజకుని దగ్గరకు తీసుకురావాలి.
  rationale: The revision replaces an inaccurate rendering of ‘tent of meeting’ with ‘సమాగమ గుడారం’ and recasts the phrase order so that the items are brought to the priest at the entrance, before Yahweh. It retains the source’s ritual-purity sense and the divine name without adding interpretive content.
