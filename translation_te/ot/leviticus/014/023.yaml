id: LEV.14.23
reference: Leviticus 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: te
  text: ఎనిమిదవ రోజున అతడు తన శుద్ధి[a] కొరకు వాటిని యాహ్వే సన్నిధిలో, సమాగమ గుడారపు ప్రవేశద్వారం వద్ద, యాజకుని దగ్గరకు తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను శుద్ధుడవడం కోసం.” ఇక్కడి హీబ్రూ పదం ఈ సందర్భంలో ఆచారపరమైన శుద్ధి ప్రక్రియను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయవిధాన సందర్భంలో ఈ క్రియకు ఆదేశాత్మక భావం ఉంది; ఆధునిక తెలుగులో ‘తీసుకురావాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ముందటి వచనంలో పేర్కొన్న బలి వస్తువులను సూచించే పుంలింగ బహువచన కర్మసర్వనామం; తెలుగులో జడవస్తువులకు ‘వాటిని’ సహజం.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: לְטָהֳרָתוֹ
  choice: తన శుద్ధీకరణ కోసం
  rationale: చర్మవ్యాధి అనంతరం జరిగే ఆచారపరమైన శుద్ధి ప్రక్రియను సూచిస్తుంది; ‘శుద్ధీకరణ’ ఆ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని దగ్గరికి
  rationale: దిశను సూచించే పదబంధాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: אֹהֶל מוֹעֵדకు స్థిరమైన భావమైన ‘ప్రత్యక్ష గుడారం’ను నిలుపుతూ, స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి
  rationale: ఆరాధనా సందర్భంలోని ‘యాహ్వే ఎదుట/సన్నిధిలో’ అనే భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని వ్యక్తిగత నామంగా నిలుపుతుంది; ‘యాహ్వే’ హీబ్రూ రూపానికి దగ్గరైన ఆధునిక ధ్వన్యంతరీకరణ.
- issue: ఆచారపరమైన לְטָהֳרָתוֹ పదం
  choice: తన శుద్ధీకరణ కోసం
  alternative: తాను శుద్ధుడవడం కోసం
  rationale: ఇక్కడ నైతిక లేదా అంతరంగ శుద్ధిని కాక, నియమిత ఆచారపరమైన శుద్ధి ప్రక్రియను సూచిస్తుందని స్పష్టపరుస్తూ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. న్యాయవిధాన స్వరాన్ని ‘తీసుకురావాలి’తో నిలిపి, ఆచారపరమైన పదాన్ని అవసరానికి మించి సిద్ధాంతీకరించకుండా అనువదించాం.
