  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָא֙ אֲשֶׁר ל֣/וֹ הַ/בַּ֔יִת וְ/הִגִּ֥יד לַ/כֹּהֵ֖ן לֵ/אמֹ֑ר כְּ/נֶ֕גַע נִרְאָ֥ה לִ֖/י בַּ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/035.yaml
  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: te
  text: 'అప్పుడు ఆ ఇంటి యజమాని వచ్చి యాజకునికి ఇలా తెలియజేయాలి: “ఇంట్లో నాకు తెగులు వంటిది కనిపించింది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “తెగులు వంటిది.” ఇంటి యజమాని కనిపించిన పరిస్థితిని మాత్రమే తెలియజేస్తున్నాడు; అది తెగులేనని ఖచ్చితంగా నిర్ధారించడం లేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: అప్పుడు ... వచ్చి
  rationale: న్యాయవిధాన క్రమంలో సంధితో కూడిన క్రియ తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: ఆ ఇల్లు ఎవరిదో అతడు
  rationale: అక్షరార్థంగా ‘ఇల్లు ఎవరికైతే ఉందో/ఎవరికి చెందుతుందో’; ఇది యజమానిని సూచిస్తూ, మూలంలోని సంబంధవాచక నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְהִגִּיד
  choice: తెలియజేయాలి
  rationale: హిఫీల్ రూపం ‘తెలియజేయడం, నివేదించడం’ అనే భావం ఇస్తుంది; యాజకునికి చేసే అధికారిక సమాచార నివేదికకు ‘తెలియజేయాలి’ తగినది.
- source_word: לַכֹּהֵן
  choice: యాజకునికి
  rationale: ల ఉపసర్గ సూచించే పరోక్ష కర్మను తెలుగులో చతుర్థీ విభక్తితో సహజంగా వ్యక్తం చేసింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష ఉక్తిని పరిచయం చేసే హెబ్రీయ సాధారణ సూత్రాన్ని తెలుగులో సహజమైన ఉక్తి పరిచయంగా అనువదించింది.
- source_word: כְּנֶגַע
  choice: ఏదో తెగులు వంటిది
  rationale: כְּ ఉపసర్గ పోలికను, అనిశ్చితిని సూచిస్తుంది; נֶגַע లేవీయకాండంలోని కలుషిత మచ్చ/తెగులు భావాన్ని కలిగి ఉంది. ‘ఏదో ... వంటిది’ యజమాని నిర్ధారణ చేయడం లేదనే అంశాన్ని కాపాడుతుంది.
- source_word: נִרְאָה לִי
  choice: నాకు కనిపించింది
  rationale: నిఫాల్ రూపంలోని ‘కనిపించింది/ప్రత్యక్షమైంది’ అనే పరిశీలనాత్మక భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; ఇది ఖచ్చిత నిర్ధారణ కాదు.
- source_word: בַּבָּיִת
  choice: ఇంట్లో
  rationale: ב ఉపసర్గ ఇక్కడ ఆ ఇంటి నిర్మాణంలో లేదా లోపల ఉన్న స్థితిని విస్తృతంగా సూచిస్తుంది; ‘ఇంట్లో’ సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ఇంటి యజమాని చెప్పేది నిర్ధారిత తెగులా లేక కనిపించిన పోలిక మాత్రమేనా
  choice: ‘ఏదో తెగులు వంటిది’ అని అనిశ్చిత పరిశీలనగా ఉంచడం
  alternative: ‘ఇంట్లో తెగులు కనిపించింది’ అని నిర్ధారితంగా చెప్పడం
  rationale: כְּנֶגַע లోని כְּ పోలికను సూచిస్తుంది; పరిస్థితిని అధికారికంగా నిర్ధారించేది యాజకుడు కాబట్టి యజమాని మాటను ఖచ్చిత నిర్ధారణగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విధానశైలిని ఉపయోగించాం. ‘తెగులు’ అనే పదం נֶגַע యొక్క లేవీయకాండ సంబంధిత విస్తృత భావాన్ని నిలుపుతుంది; ఆధునిక వైద్య ‘సంక్రమణ’గా అతిగా నిర్దిష్టం చేయలేదు. పాదసూచిక గుర్తు సంబంధిత వాక్యం చివర ఉంచబడింది.
