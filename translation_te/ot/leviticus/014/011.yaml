revisions:
- from: శుద్ధీకరణ ఆచారాన్ని నిర్వహించే యాజకుడు, శుద్ధీకరించబడుతున్న ఆ మనిషిని, ఆ వస్తువులతోపాటు, యెహోవా సన్నిధిలో ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర నిలబెట్టాలి.
  to: శుద్ధీకరణ ఆచారాన్ని నిర్వహించే యాజకుడు శుద్ధీకరించబడుతున్న ఆ మనిషిని, ఆ వస్తువులతోపాటు, ప్రత్యక్షపు గుడారం ప్రవేశద్వారం వద్ద యెహోవా సన్నిధిలో నిలబెట్టాలి.
