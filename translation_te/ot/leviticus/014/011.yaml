id: LEV.14.11
reference: Leviticus 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: te
  text: శుద్ధీకరణ ఆచారాన్ని నిర్వహించే యాజకుడు శుద్ధీకరించబడుతున్న ఆ మనిషిని, ఆ వస్తువులతోపాటు, ప్రత్యక్షపు గుడారం ప్రవేశద్వారం వద్ద యెహోవా సన్నిధిలో నిలబెట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: నిలబెట్టాలి
  rationale: עמד హిఫీల్ రూపం ఇక్కడ ఒకరిని లేదా వస్తువులను ఆచారపరంగా యెహోవా ఎదుట నిలబడేలా చేయడాన్ని సూచిస్తుంది. ‘నిలబెట్టాలి’ మూలంలోని causative భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: శుద్ధీకరణ ఆచారాన్ని నిర్వహించే యాజకుడు
  rationale: טהר కృదంతం యాజకుని ఆచారపరమైన పాత్రను సూచిస్తుంది. ఈ రూపం అతడు నైతిక పవిత్రతను కలిగిస్తాడనే భావం రాకుండా, శుద్ధీకరణ ప్రక్రియలో అధికారిగా వ్యవహరిస్తాడని తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషిని
  rationale: హీబ్రూ పాఠంలో స్పష్టంగా పురుష ఏకవచన నామవాచకం ఉంది; అందువల్ల లింగాన్ని తటస్థీకరించకుండా ‘మనిషి’ అని అనువదించబడింది.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధీకరించబడుతున్న
  rationale: ఈ రూపం ఆ మనిషి ఆచారపరమైన శుద్ధీకరణ ప్రక్రియకు లోనవుతున్నాడనే మధ్యమ/నిష్క్రియ భావాన్ని తెలియజేస్తుంది.
- source_word: וְאֹתָם
  choice: ఆ వస్తువులతోపాటు
  rationale: బహువచన సర్వనామం ముందటి వచనంలో పేర్కొన్న వస్తువులను సూచిస్తుంది. తెలుగులో సూచ్యార్థం స్పష్టంగా ఉండేందుకు ‘వస్తువులు’ అని వ్యక్తీకరించబడింది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఇది దేవుని సమక్షంలో ఆచారపరంగా హాజరుపరచడాన్ని సూచించే స్థిరమైన నిబంధనాత్మక పదబంధం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: ఇది పరిశుద్ధ స్థలపు నిర్దిష్ట ప్రదేశాన్ని సూచిస్తుంది. ‘ప్రత్యక్ష గుడారం’ אֹהֶל מוֹעֵדకు తెలుగులో స్థిరపడిన, సహజమైన ఆచారపరమైన పదప్రయోగం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని నాలుగు అక్షరాల దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించడానికి దగ్గరైన ప్రత్యామ్నాయం.
- issue: యాజకుడు ‘శుద్ధి చేయడం’ అనే భావం
  choice: శుద్ధీకరణ ఆచారాన్ని నిర్వహించే
  alternative: శుద్ధి చేసే
  rationale: ఇక్కడి మాట నైతిక పాపశుద్ధిని తప్పనిసరిగా సూచించకుండా, లేవీయ ఆచార ప్రక్రియలో యాజకుని అధికారిక పాత్రను సూచిస్తుంది. అందువల్ల ఆచారపరమైన పరిధిని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే ఆచారపరమైన శైలి. మూలంలోని పురుష ఏకవచనం, ప్రక్రియలో ఉన్న శుద్ధీకరణ భావం, యాజకుని causative చర్య, ముందటి వచనంలోని వస్తువులకు సర్వనామ సూచన అన్నీ నిలుపబడ్డాయి.
