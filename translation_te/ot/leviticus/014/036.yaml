    rationale: మూలంలోని ‘ఇంటిని ఖాళీ చేయడం’ సందర్భానుసారం ఇంటిలోని వస్తువులను తొలగించడాన్ని సూచిస్తుంది; దానిని తెలుగులో స్పష్టపరచడం సహజం.
