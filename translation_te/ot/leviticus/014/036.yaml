source:
  edition: WLC
  text: וְ/צִוָּ֨ה הַ/כֹּהֵ֜ן וּ/פִנּ֣וּ אֶת הַ/בַּ֗יִת בְּ/טֶ֨רֶם יָבֹ֤א הַ/כֹּהֵן֙ לִ/רְא֣וֹת אֶת הַ/נֶּ֔גַע וְ/לֹ֥א יִטְמָ֖א כָּל אֲשֶׁ֣ר בַּ/בָּ֑יִת וְ/אַ֥חַר כֵּ֛ן יָבֹ֥א הַ/כֹּהֵ֖ן לִ/רְא֥וֹת אֶת הַ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: te
  text: అప్పుడు యాజకుడు ఆ ప్రభావితమైన చోటును[a] పరిశీలించడానికి ఇంట్లోకి వెళ్లకముందే, ఇంట్లో ఉన్నదంతా ఆచారపరంగా అపవిత్రం కాకుండా ఇంట్లోని వస్తువులన్నీ బయటకు తీయమని ఆజ్ఞాపించాలి. ఆ తర్వాత యాజకుడు ఇంటిని పరిశీలించడానికి లోపలికి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మచ్చను,’ ‘సంక్రమణను’; సంప్రదాయంగా ‘తెగులును.’ హీబ్రూ నెగాʿ అనే పదం యాజకుడు పరిశీలించే ప్రభావిత మచ్చను లేదా స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: అప్పుడు ... ఆజ్ఞాపించాలి
  rationale: క్రమానుసారమైన విధిని తెలిపే వావ్‌తో కూడిన సంపూర్ణ క్రియను ఆధునిక తెలుగు న్యాయవిధి శైలిలో ‘అప్పుడు ... ఆజ్ఞాపించాలి’ అని అందించాం.
- source_word: וּפִנּוּ אֶת־הַבַּיִת
  choice: ఆ ఇంటిని ఖాళీ చేయించమని
  rationale: బహువచన క్రియలో కర్త నిర్దిష్టంగా చెప్పబడలేదు; యాజకుడు ఇతరులతో ఇంటి వస్తువులను బయటకు తీయించాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִרְאוֹת
  choice: పరిశీలించడానికి
  rationale: మూలార్థం ‘చూడడం’ అయినా, ఇక్కడ యాజకుని అధికారిక నిర్ధారణ సందర్భం ఉన్నందున ‘పరిశీలించడం’ తగినది.
- source_word: הַנֶּגַע
  choice: వ్యాధిగ్రస్తమైన చోటు
  rationale: נֶגַע ఇక్కడ ఆధునిక వైద్యార్థంలోని నిర్దిష్ట వ్యాధిని తప్పనిసరిగా సూచించదు; పరిశీలనకు లోనైన ప్రభావిత మచ్చ లేదా ప్రాంతాన్ని సూచిస్తుంది.
- source_word: וְלֹא יִטְמָא
  choice: అపవిత్రం కాకుండా
  rationale: ఇల్లు ముందుగా ఖాళీ చేయడంలోని నివారణ ఉద్దేశాన్ని తెలుపుతుంది; טמא యొక్క ఆచారసంబంధ అపవిత్రత భావాన్ని నిలుపుతుంది.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: ఇంట్లో ఉన్నదంతా
  rationale: ఇంటిలోని సమస్త వస్తువులను సంక్షిప్తంగా, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וְאַחַר כֵּן
  choice: ఆ తర్వాత
  rationale: విధానంలోని తదుపరి దశను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఆచారసంబంధ అపవిత్రత పదజాలం
  choice: అపవిత్రం కావడం
  alternative: అశుద్ధం కావడం; కలుషితం కావడం
  rationale: లేవీయకాండ సందర్భంలో טמא నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా ఆచారపరమైన స్థితిని సూచిస్తుంది. ‘అపవిత్రం’ తెలుగు బైబిల్ భాషలో పరిచితమైనదిగా ఉండి ఈ భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన విధి శైలిని ఉపయోగించాం. యాజక సంబంధ పరిశీలన, ఆచారపరమైన అపవిత్రత అనే భావాలను నైతిక లేదా ఆధునిక వైద్య నిర్ధారణగా అతివ్యాఖ్యానించలేదు.
