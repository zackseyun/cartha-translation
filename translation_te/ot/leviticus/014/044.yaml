translation:
  language: te
  text: అప్పుడు యాజకుడు వచ్చి పరిశీలించాలి. ఆ మచ్చ ఇంట్లో వ్యాపించిందని తేలితే, అది ఇంటిలో వినాశకరమైన కుష్ఠదోషం; ఆ ఇల్లు అపవిత్రమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: అప్పుడు ... వచ్చి ... చేయాలి
  rationale: యాజక నియమావళిలోని వరుస కార్యవిధిని ఆధునిక తెలుగు విధిరూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సంబంధిత అధికారికి ప్రామాణిక తెలుగు పదం; నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: అక్షరార్థమైన ‘చూడాలి’ కంటే, ఈ నిర్ధారణ ప్రక్రియలో ఉద్దేశించిన జాగ్రత్తైన తనిఖీని తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: '...అని తేలితే'
  rationale: పరిశీలనలో బయటపడిన షరతును సహజమైన తెలుగు న్యాయ-ప్రక్రియా శైలిలో వ్యక్తం చేస్తుంది.
- source_word: פָּשָׂה
  choice: వ్యాపించింది
  rationale: దోషం విస్తరించడాన్ని ఖచ్చితంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּגַע
  choice: ఆ మచ్చ
  rationale: ఇంటి ఉపరితలంపై కనిపించే బాధిత గుర్తును సూచిస్తుంది; ‘వ్యాధి’ వంటి వైద్య అతినిర్దిష్టతను నివారిస్తుంది.
- source_word: צָרַעַת
  choice: కుష్ఠదోషం
  rationale: వ్యక్తులు, వస్త్రాలు, ఇళ్లకు వర్తించే లేవీయకాండపు విస్తృత ఆచార అపవిత్రత వర్గాన్ని సూచించేందుకు ‘దోషం’తో కూడిన సంప్రదాయ పదాన్ని ఉపయోగించింది; ఆధునిక హాన్సెన్ వ్యాధిగా పరిమితం చేయదు.
- source_word: מַמְאֶרֶת
  choice: వినాశకరమైన
  rationale: తీవ్రమైన, పాడుచేసే స్వభావాన్ని తెలియజేస్తూ ఆధునిక వైద్యార్థాలను మోపదు.
- source_word: טָמֵא הוּא
  choice: ఆ ఇల్లు అపవిత్రమైనది
  rationale: లేవీయకాండంలోని ఆచారస్థితిని సూచించే טמאకు స్పష్టమైన తెలుగు సమానం; సర్వనామం సూచించే ఇంటిని తెలుగులో వెల్లడించింది.
theological_decisions:
- issue: ఇంటికి వర్తించిన צָרַעַת పదం
  choice: ‘కుష్ఠదోషం’ అని అనువదించి, పాదసూచికలో దాని విస్తృత ఆచారార్థాన్ని వివరించడం
  alternative: బూజు / కుష్ఠవ్యాధి
  rationale: ‘బూజు’ మూలపదాన్ని ఒక నిర్దిష్ట భౌతిక కారణంగా కుదిస్తుంది; ‘కుష్ఠవ్యాధి’ ఆధునిక వైద్య నిర్ధారణను సూచించవచ్చు. ‘కుష్ఠదోషం’ మూలంలోని అసాధారణ వర్గీకరణను నిలుపుతుంది.
- issue: క్రియల ప్రక్రియాత్మక బలం
  choice: ‘వచ్చి పరిశీలించాలి ... తేలితే’ అనే విధి-షరతు నిర్మాణం
  alternative: సాధారణ భూతకాల కథనం
  rationale: ఇది జరిగిన సంఘటన కథనం కాక యాజకుడు అనుసరించాల్సిన నియమ ప్రక్రియ.
- issue: טָמֵא యొక్క భావం
  choice: ఆచారస్థితిగా ‘అపవిత్రమైనది’
  alternative: మురికిగా ఉంది / కలుషితమైంది
  rationale: ఈ పదం సాధారణ పరిశుభ్రతను కాక ధర్మశాస్త్రంలోని ఆచార అపవిత్ర స్థితిని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ధర్మశాస్త్ర-ప్రక్రియా శైలి. మూలంలోని అసాధారణంగా ఇంటికి వర్తించిన צָרַעַת భావాన్ని చెరపకుండా, వైద్య నిర్ధారణగా తప్పుగా అర్థం కాకుండా పాదసూచికతో స్పష్టం చేసింది.
