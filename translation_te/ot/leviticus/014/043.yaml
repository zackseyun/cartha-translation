source:
  edition: WLC
  text: וְ/אִם יָשׁ֤וּב הַ/נֶּ֨גַע֙ וּ/פָרַ֣ח בַּ/בַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת הָ/אֲבָנִ֑ים וְ/אַחֲרֵ֛י הִקְצ֥וֹת אֶת הַ/בַּ֖יִת וְ/אַחֲרֵ֥י הִטּֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: te
  text: అయితే, రాళ్లను తీసివేసి, ఇంటిని గీకి, దానికి ప్లాస్టర్ పూసిన తర్వాత ఆ తెగులు[a] మళ్లీ వచ్చి ఇంట్లో చెలరేగితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెగులు’కు బదులుగా ‘వ్యాధి’, ‘ప్రభావిత స్థితి’ లేదా ‘పీడ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం నెగా (נֶגַע) లేవీయకాండంలో మనుషులు, వస్త్రాలు లేదా ఇళ్లలో కనిపించే హానికరమైన స్థితిని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: మునుపటి శుద్ధీకరణ చర్యల తర్వాత ఎదురయ్యే భిన్న పరిస్థితిని తెలిపే షరతుగా సహజమైన తెలుగు రూపం.
- source_word: יָשׁוּב הַנֶּגַע
  choice: ఆ తెగులు మళ్లీ వచ్చి
  rationale: שוב పునరావృతిని సూచిస్తుంది. נגע వ్యక్తులు, వస్త్రాలు, ఇళ్లను ప్రభావితం చేసే గుర్తించదగిన హానికర స్థితికి లేవీయకాండంలో వాడే సాంకేతిక పదం; ‘తెగులు’ దాని విస్తృతిని నిలుపుతుంది.
- source_word: וּפָרַח בַּבַּיִת
  choice: ఇంట్లో చెలరేగితే
  rationale: פרח అక్షరార్థంగా మొలకెత్తడం లేదా వికసించడం; ఇక్కడ తెగులు మళ్లీ బయటపడి వ్యాపించడాన్ని సూచించే రూపకం. ‘చెలరేగితే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  choice: రాళ్లను తీసివేసి … తర్వాత
  rationale: మునుపు ఆదేశించిన దెబ్బతిన్న రాళ్ల తొలగింపును స్పష్టంగా, విధానపరమైన క్రమంలో తెలియజేస్తుంది.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  choice: ఇంటిని గీకి
  rationale: קצה ఇక్కడ ఇంటి ఉపరితలాలను గీకి తొలగించే భౌతిక చర్యను సూచిస్తుంది; సాధారణ ‘శుభ్రం చేయడం’ కంటే ‘గీకడం’ నిర్దిష్టమైనది.
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: దానికి సున్నం పూసిన తర్వాత
  rationale: טוח ఇంటికి పూత లేదా ప్లాస్టర్ వేయడాన్ని సూచిస్తుంది. ప్రాచీన నిర్మాణ సందర్భంలో ‘సున్నం పూయడం’ సాధారణ పాఠకునికి సహజంగా అర్థమవుతుంది; హీబ్రూలో కర్తను నిర్దిష్టంగా చెప్పనందున తెలుగు నిర్మాణమూ కర్తను పేర్కొనదు.
