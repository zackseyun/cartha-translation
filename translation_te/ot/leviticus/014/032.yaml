  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: te
  text: చర్మవ్యాధి మచ్చ[a] ఉండి, తన శుద్ధీకరణకు కావలసినవాటిని సమకూర్చుకునే స్థోమత లేని వ్యక్తికి[b] సంబంధించిన నియమం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదమైన צָרָעַת ను సంప్రదాయంగా ‘కుష్ఠురోగం’ అని అనువదించారు. అయితే లేవీయకాండంలో అది వివిధ చర్మస్థితులను, వాటితో ముడిపడిన ఆచార అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన శుద్ధీకరణలో అతని చెయ్యి అందదు’; అంటే శుద్ధీకరణ అర్పణకు అవసరమైనవాటిని సమకూర్చే స్థోమత అతనికి లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: నియమం
  rationale: యాజక నియమావళిలో תּוֹרָה ఒక నిర్దేశిత న్యాయపరమైన లేదా ఆచారపరమైన విధానాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నియమం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בּוֹ
  choice: ఉండి
  rationale: వ్యాధి మచ్చ ఆ వ్యక్తిలో ఉందనే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధక్రియతో తెలియజేస్తుంది.
- source_word: נֶגַע צָרָעַת
  choice: తీవ్రమైన చర్మవ్యాధి మచ్చ
  rationale: נֶגַע ను ‘మచ్చ’గా వ్యక్తపరుస్తూ, צָרָעַת ను ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం చేయకుండా లేవీయకాండంలోని విస్తృత చర్మవ్యాధుల వర్గంగా అందిస్తుంది. ‘తీవ్రమైన’ అనే పదం సాధారణ చిన్న చర్మమచ్చతో దీనిని కలపకుండా సహాయపడుతుంది.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: సమకూర్చుకునే స్థోమత లేని
  rationale: అక్షరార్థంగా ‘అతని చెయ్యి అందదు’ అనే హెబ్రీ నుడికారం, అవసరమైన అర్పణలను సమకూర్చే ఆర్థిక సామర్థ్యం లేకపోవడాన్ని సూచిస్తుంది. తెలుగు నుడిలో అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּטָהֳרָתוֹ
  choice: తన శుద్ధీకరణకు కావలసినవాటిని
  rationale: ముందటి వచనాల్లో నిర్దేశించిన శుద్ధీకరణ ప్రక్రియకు అవసరమైన అర్పణలను సందర్భానుసారంగా సూచిస్తుంది; ‘శుద్ధీకరణ’ ఆచార సంబంధమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: צָרָעַת ను నిర్దిష్ట ఆధునిక వ్యాధిగా గుర్తించడం
  choice: తీవ్రమైన చర్మవ్యాధి
  alternative: కుష్ఠురోగం
  rationale: ఈ హెబ్రీ పదం లేవీయకాండంలో హాన్సెన్ వ్యాధి ఒక్కదానికన్నా విస్తృతమైన చర్మస్థితులను, అలాగే ఆచార అపవిత్రతను సూచిస్తుంది; కాబట్టి నిర్దిష్ట వైద్య నిర్ధారణను అనవసరంగా పాఠ్యంలోకి తేవలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా యాజక నియమావళికి తగిన గంభీరతతో రచించబడింది. హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగులో అందించి, దాని అక్షర రూపాన్ని పాదటిప్పణిలో నిలిపింది.
