    rationale: The adjective ‘తీవ్రమైన’ adds a specific severity judgment absent from the Hebrew. The term denotes a ritually significant skin affliction/lesion in this context, without requiring that every instance be characterized as severe.
  - severity: low
    issue: Footnote a describes the referent as ‘తీవ్రమైన చర్మస్థితులను.’
    rationale: For consistency with the source and main-text revision, the explanatory note should describe a range of skin conditions without the added severity qualifier.
