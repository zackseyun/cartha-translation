    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: వావ్-కన్సిక్యూటివ్‌తో ఉన్న דבר రూపం కొత్త మాటల సంఘటనను పరిచయం చేస్తుంది. తెలుగులో తరువాత వచ్చే ప్రత్యక్ష వాక్యానికి సహజమైన పరిచయంగా ‘చెప్పాడు’ సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాటల గ్రహీతను సూచించే אֶל‌ను తెలుగులో సహజంగా ‘తో’ విభక్తితో వ్యక్తం చేశాం; מֹשֶׁהకు ప్రామాణిక తెలుగు రూపం ‘మోషే’.
- source_word: וְאֶל אַהֲרֹן
  choice: అహరోనుతో
  rationale: సంయోజకాన్ని కామా ద్వారా సహజంగా కలిపి, రెండవ ప్రత్యక్ష గ్రహీతను కూడా ‘తో’ విభక్తితో స్పష్టంగా ఉంచాం; אַהֲרֹןకు ‘అహరోను’ అనే ప్రామాణిక తెలుగు రూపాన్ని వాడాం.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పాడు
  rationale: ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హెబ్రీ సంప్రదాయ సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పాడు:’ అని వ్యక్తం చేశాం. דברతో కలిపి అనవసరమైన ‘మాట్లాడి, చెబుతూ’ పునరుక్తిని నివారించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ మరో సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సామాన్య పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ప్రసంగారంభ సూత్రాన్ని పదేపదే పునరుక్తి చేయకుండా భావసమానంగా అందించాం.
