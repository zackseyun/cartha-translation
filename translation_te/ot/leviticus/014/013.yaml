id: LEV.14.13
reference: Leviticus 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: te
  text: పరిశుద్ధ స్థలంలో పాపపరిహార బలిని[a], దహనబలిని వధించే స్థలంలో ఆ గొర్రెపిల్లను అతడు వధించాలి. ఎందుకంటే పాపపరిహార బలిలాగే అపరాధపరిహార బలి[b] కూడా యాజకునికి చెందుతుంది; అది అతి పరిశుద్ధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’కి బదులుగా ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం חַטָּאת యాజక బలివిధానంలో ఆచారపరమైన శుద్ధీకరణ కార్యాన్ని కూడా నొక్కిచెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అపరాధపరిహార బలి’కి బదులుగా ‘నష్టపరిహార బలి’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం אָשָׁם బలితో ముడిపడిన పరిహారం లేదా పునఃచెల్లింపు అంశాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: అతడు వధించాలి
  rationale: שׁחט బలి సందర్భంలో ఆచారబద్ధంగా జంతువును వధించడాన్ని సూచిస్తుంది; ‘వధించాలి’ ఆధునిక తెలుగులో ఆ బలిసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַכֶּבֶשׂ
  choice: ఆ గొర్రెపిల్లను
  rationale: כֶּבֶשׂ సాధారణంగా బలికి అర్పించే గొర్రెపిల్లను సూచిస్తుంది; నిర్దిష్ట ప్రత్యయం కారణంగా ‘ఆ’ వాడబడింది.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: వధించే స్థలంలో
  rationale: ఏకవచన క్రియ ఇక్కడ సాధారణ/అనిర్దిష్ట కర్తతో న్యాయవిధాన ప్రయోగం; తెలుగులో కర్తను పేర్కొనని ‘వధించే’ రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חַטָּאת బలివిధానంలోని సంప్రదాయ వర్గపదం. ‘పాపపరిహార బలి’ పాపంతో దాని సంబంధాన్ని తెలియజేస్తుంది; శుద్ధీకరణ కార్యాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలికి స్థిరమైన పదం; ‘దహనబలి’ సంక్షిప్తంగా, సుపరిచితంగా ఉంది.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: నిర్దిష్టమైన ఆరాధనా ప్రదేశాన్ని సూచించే ఈ పదబంధాన్ని సహజమైన తెలుగు బైబిలు పరిభాషలో అందిస్తుంది.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: ఎందుకంటే పాపపరిహార బలిలాగే అపరాధపరిహార బలి కూడా యాజకునికి చెందుతుంది
  rationale: ఈ నిర్మాణం రెండు బలుల మధ్య సాదృశ్యాన్ని, అపరాధపరిహార బలిపై యాజకుని హక్కును వ్యక్తం చేస్తుంది. ‘చెందుతుంది’ לַכֹּהֵן భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: అది అతి పరిశుద్ధమైనది
  rationale: హెబ్రీయ superlative నిర్మాణాన్ని బలుల పరిశుద్ధతా వర్గీకరణగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాజక బలివిధానంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపాన్నీ ఆచారపరమైన శుద్ధీకరణనూ సూచించే పరిధి కలిగి ఉంది. ప్రధాన పాఠ్యంలో సుపరిచితమైన బలి వర్గపదాన్ని ఉంచి, శుద్ధీకరణ కార్యాన్ని నొక్కిచెప్పే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: אָשָׁם అనువాదం
  choice: అపరాధపరిహార బలి
  alternative: నష్టపరిహార బలి
  rationale: ఈ సందర్భంలో ఇది నిర్దిష్టమైన బలి వర్గం. ‘అపరాధపరిహార బలి’ అపరాధ సంబంధాన్ని తెలియజేస్తుంది; ‘నష్టపరిహార బలి’ పరిహారం లేదా పునఃచెల్లింపు అంశాన్ని ఎక్కువగా నొక్కిచెప్పే సముచిత ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-బలివిధాన శైలి. సాంకేతిక బలిపదాలు స్థిరంగా ఉంచబడ్డాయి; హెబ్రీ వాక్యంలోని స్థల వివరణను ‘అంటే’తో సహజంగా అనుసంధానించాం. నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికల్లో భద్రపరచాం.
