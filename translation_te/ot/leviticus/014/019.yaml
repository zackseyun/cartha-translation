id: LEV.14.19
reference: Leviticus 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: te
  text: అప్పుడు యాజకుడు పాపపరిహార బలిని[a] అర్పించి, తన అపవిత్రతనుండి శుద్ధి పొందుతున్నవాని కొరకు ప్రాయశ్చిత్తం చేయాలి. ఆ తరువాత అతడు దహనబలిని వధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ పదం חַטָּאת లేవీయ ఆచార సందర్భాల్లో శుద్ధీకరణ కోసం ఉపయోగించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: అర్పించి
  rationale: మూలార్థం ‘చేయడం’ అయినా, బలికి సంబంధించిన ఈ సందర్భంలో బలిని అర్పించడం అనే ఆచారార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆచార సందర్భానికి సరిపోయే ప్రామాణిక తెలుగు పదం.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఇక్కడ ఇది ‘పాపం’ను కాక బలిని సూచించే సాంకేతిక పదం. తెలుగు పాఠకులకు పరిచితమైన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, శుద్ధీకరణ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְכִפֶּר עַל
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר యొక్క ఆచార-దైవశాస్త్ర బలాన్ని ఏదైనా ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా నిలుపుతుంది; עַל ఇక్కడ ఎవరి కోసం ప్రాయశ్చిత్తం చేయబడుతుందో సూచిస్తుంది.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్నవాని
  rationale: హిత్పయేల్ వర్తమాన కృదంతంలోని ప్రక్రియాత్మక, మధ్యమ/కర్మణి ఛాయను ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: מִטֻּמְאָתוֹ
  choice: అపవిత్రత నుండి
  rationale: లేవీయ ఆచార సందర్భంలోని కర్మకాండ సంబంధ అపవిత్రతను సూచిస్తుంది; ‘అతని’ అనే ఏకవచన పుంలింగ సూచనను తరువాతి పదబంధంలో స్పష్టంగా నిలిపాం.
- source_word: וְאַחַר
  choice: ఆ తరువాత
  rationale: ఆచార క్రమంలోని తదుపరి దశను స్పష్టంగా సూచిస్తుంది.
- source_word: יִשְׁחַט
  choice: వధించాలి
  rationale: బలిపశువును ఆచారరీతిగా చంపడాన్ని సూచించే గంభీరమైన, సంక్షిప్త తెలుగు సమానం.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలికి స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు ఆచారపదం.
theological_decisions:
- issue: లేవీయ బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: חַטָּאת ఈ సందర్భంలో అపవిత్రత నుండి శుద్ధీకరణకు సంబంధించిన బలిని సూచించగలదు. అయినా విస్తృతంగా గుర్తించబడే సంప్రదాయ బలి పేరును ప్రధాన పాఠ్యంలో ఉంచి, సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
- issue: מִטֻּמְאָתוֹ లోని లింగ-వచన సూచన
  choice: ఏకవచన పుంలింగ సూచనను ‘అతని’గా నిలుపడం
  alternative: లింగనిరపేక్ష బహువచనం
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనం; దాన్ని సాధారణీకరించకుండా మూలంలోని సూచనను నిలిపాం.
- issue: כפר యొక్క దైవశాస్త్ర పరిధి
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: శుద్ధి కలిగించాలి
  rationale: ఈ క్రియకు ఆచారపరమైన శుద్ధీకరణ ఛాయ ఉన్నప్పటికీ, మూలంలోని విస్తృత ప్రాయశ్చిత్త భావాన్ని ఒకే వివరణకు కుదించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆచార భాషను ఉపయోగించాం. ‘యాజకుడు,’ ‘ప్రాయశ్చిత్తం,’ ‘దహనబలి’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్యక్రమాన్ని సహజ తెలుగుకు అనుగుణంగా అమర్చాం.
