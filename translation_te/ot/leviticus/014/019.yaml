- from: అప్పుడు యాజకుడు పాపపరిహార బలిని[a] అర్పించి, శుద్ధి పొందుతున్నవాని అపవిత్రత నుండి అతని కోసం ప్రాయశ్చిత్తం చేయాలి. ఆ తరువాత అతడు దహనబలిని వధించాలి.
  to: అప్పుడు యాజకుడు పాపపరిహార బలిని[a] అర్పించి, తన అపవిత్రతనుండి శుద్ధి పొందుతున్నవాని కొరకు ప్రాయశ్చిత్తం చేయాలి. ఆ తరువాత అతడు దహనబలిని వధించాలి.
