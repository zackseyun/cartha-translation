translation:
  language: te
  text: వస్త్రానికి గానీ ఇంటికి గానీ కలిగే త్సారాʼఅత్ గురించి కూడా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְ
  choice: గురించి కూడా
  rationale: ముందటి వచనాల్లోని జాబితాను కొనసాగించే సంధి, సంబంధార్థక విభక్తిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צָרַעַת
  choice: చారల తెగులు
  rationale: ఈ హెబ్రీ పదం మనుషుల చర్మానికే పరిమితం కాకుండా వస్త్రాలు, ఇళ్లపై కనిపించే హానికరమైన మార్పులను కూడా సూచిస్తుంది. అందువల్ల ‘కుష్ఠు’ అనే సన్నని వైద్యార్థాన్ని నివారిస్తూ, వస్తువులకూ వర్తించే విస్తృత భావాన్ని ఈ పదబంధం అందిస్తుంది.
- source_word: הַבֶּגֶד
  choice: వస్త్రానికి
  rationale: నిర్దిష్ట ఉపదేశ పరిధిలో వస్త్రంపై కలిగే స్థితిని సూచిస్తుంది; తెలుగు జాబితా నిర్మాణంలో ఏకవచన ‘వస్త్రం’ సహజంగా ఉంటుంది.
- source_word: וְלַבָּיִת
  choice: లేదా ఇంటికి
  rationale: అదే తెగులు సంభవించగల మరో వర్గాన్ని పంపిణీ భావంతో సూచించడానికి ‘లేదా’ సహజం; హెబ్రీలోని సంబంధార్థక לְ భావాన్ని ‘ఇంటికి కలిగే’ నిర్మాణం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: צָרַעַת పదాన్ని ‘కుష్ఠు’గా అనువదించాలా
  choice: చారల తెగులు
  alternative: కుష్ఠు తెగులు
  rationale: ఈ వచనంలో అది వస్త్రానికీ ఇంటికీ వర్తిస్తుంది కాబట్టి, ఒక నిర్దిష్ట మానవ చర్మవ్యాధిగా అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృత వర్గాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా అనువదించబడింది. ఇది 14:54లో మొదలైన జాబితాను కొనసాగించే వాక్యఖండం కావడంతో తెలుగు పాఠ్యంలోనూ ఆ నిర్మాణం నిలుపబడింది.
