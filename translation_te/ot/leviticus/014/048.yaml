  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: te
  text: అయితే యాజకుడు లోపలికి వచ్చి పరిశీలించినప్పుడు, ఇదిగో, ఇంటికి పూత పూసిన తర్వాత ఆ తెగులు[a] ఇంట్లో వ్యాపించకపోతే, ఆ తెగులు నయమైంది కాబట్టి యాజకుడు ఆ ఇంటిని శుద్ధమైనదిగా ప్రకటించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెగులు’ అని అనువదించిన హెబ్రీయ పదాన్ని ‘బాధ,’ ‘మచ్చ’ లేదా సంప్రదాయంగా ‘ఉపద్రవం’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది ఇంటిని ప్రభావితం చేసిన హానికర స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ ఇంటిని శుద్ధపరచాలి.’ ఈ సందర్భంలో హెబ్రీయ క్రియ ఆచారపరంగా శుద్ధమని ప్రకటించడాన్ని లేదా శుద్ధపరచడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … వ్యాపించకపోతే
  rationale: ఈ షరతు ముందటి సందర్భానికి భిన్నమైన ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన షరతు నిర్మాణం కోసం ‘అయితే … -కపోతే’ వాడబడింది.
- source_word: בֹּא יָבֹא
  choice: లోపలికి వచ్చి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ రాకను బలపరుస్తుంది; ఇక్కడ విధానపరమైన భావం యాజకుడు తనిఖీ కోసం ఇంట్లోకి రావడం. తెలుగులో కృత్రిమమైన ద్విరుక్తిని నివారించి సందర్భార్థాన్ని స్పష్టంగా ఇచ్చింది.
- source_word: וְרָאָה
  choice: పరిశీలించినప్పుడు
  rationale: మూల క్రియ సాధారణంగా ‘చూడు’ అని అర్థమైనా, ఈ సందర్భంలో యాజకుడు అధికారికంగా తనిఖీ చేస్తున్నాడు. ‘పరిశీలించు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తనిఖీ ఫలితంపై శ్రద్ధ నిలిపే హెబ్రీయ దృష్ట్యాకర్షక అవ్యయాన్ని నిలుపుతుంది.
- source_word: לֹא פָשָׂה
  choice: వ్యాపించకపోతే
  rationale: లేవీయకాండం 13–14లో ఈ క్రియ తెగులు మరింత విస్తరించడాన్ని సూచిస్తుంది.
- source_word: הַנֶּגַע
  choice: తెగులు
  rationale: ఈ పదం ఇంటిని ప్రభావితం చేసిన హానికరమైన స్థితి లేదా మచ్చను సూచిస్తుంది; ఆధునిక వైద్య నిర్ధారణను అనవసరంగా సూచించకుండా, ‘వ్యాధి’ కంటే ఇంటి సందర్భానికి ‘తెగులు’ విస్తృతంగా సరిపోతుంది.
- source_word: בַּבַּיִת
  choice: ఇంట్లో
  rationale: హెబ్రీయ ఉపసర్గకు నేరమైన అర్థం ‘లో’; తెలుగులోనూ ఇదే సహజం.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: ఇంటికి పూత పూసిన తర్వాత
  rationale: טוח ఇంటికి పూత లేదా సున్నపు పూత వేయడాన్ని సూచిస్తుంది. కర్త ప్రాధాన్యం లేనందున తెలుగు భావకర్మక నిర్మాణం సహజంగా ఉంది.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: యాజకుడు ఆ ఇంటిని శుద్ధమైనదిగా ప్రకటించాలి
  rationale: యాజక సంబంధ శుద్ధత సందర్భంలో טהר భౌతికంగా శుభ్రం చేయడం మాత్రమే కాక, శుద్ధమని అధికారికంగా నిర్ణయించి ప్రకటించడాన్ని సూచించగలదు.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: ఆ తెగులు నయమైంది కాబట్టి
  rationale: רפא యొక్క స్వస్థత/నయం రూపకాన్ని నిలుపుతూ, తెగులు ఇక వ్యాపించడం లేదనే కారణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: וְטִהַר లో ఆచారపరమైన ప్రకటననా, భౌతిక శుద్ధీకరణనా
  choice: యాజకుడు ఆ ఇంటిని శుద్ధమైనదిగా ప్రకటించాలి
  alternative: యాజకుడు ఆ ఇంటిని శుద్ధపరచాలి
  rationale: ఈ న్యాయ-ఆచార సందర్భంలో యాజకుడు శుద్ధస్థితిని నిర్ధారించే పాత్రలో ఉన్నాడు. ‘ప్రకటించాలి’ అనడం యాజకుడే భౌతిక మరమ్మతులన్నీ చేస్తాడనే భావాన్ని నివారిస్తుంది; అయినా హెబ్రీయ క్రియలో ఉన్న శుద్ధీకరణ భావాన్ని పాదసూచికలో నిలుపుతుంది.
