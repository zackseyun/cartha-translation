translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. విధి నిర్దేశక భావానికి ‘పెట్టాలి/పూయాలి’ వాడాం. మూలంలోని బహువచనం నుంచి ఏకవచనానికి మార్పును ‘వారు… అతడు’గా ఉద్దేశపూర్వకంగా నిలిపాం.
