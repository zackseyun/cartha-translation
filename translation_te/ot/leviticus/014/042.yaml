source:
  edition: WLC
  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: te
  text: అప్పుడు వారు వేరే రాళ్లను తీసుకొని, తీసివేసిన రాళ్ల స్థానంలో వాటిని అమర్చాలి[b]. అతడు వేరే మట్టిని[a] తీసుకొని ఇంటికి పూత పూయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వేరే గారు’; మరింత అక్షరార్థంగా ‘వేరే మట్టి/ధూళి.’ రాళ్లను మార్చిన తరువాత ఇంటికి మళ్లీ పూత పూయడానికి ఉపయోగించే పదార్థాన్ని హీబ్రూ పదం ఇక్కడ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘రాళ్ల కింద.’ ఇక్కడ అది తీసివేసిన రాళ్లకు బదులుగా, వాటి స్థానంలో కొత్త రాళ్లను అమర్చడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: అప్పుడు వారు తీసుకొని
  rationale: కర్మకాండ సంబంధమైన ఆదేశాల వరుసలో వావ్‌కు ఉన్న క్రమానుసార భావాన్ని ‘అప్పుడు’ తెలియజేస్తుంది; బహువచన కర్తను ‘వారు’గా నిలిపింది.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: వేరే రాళ్లు
  rationale: తీసివేసిన రాళ్లకు బదులుగా ఉపయోగించే ఇతర రాళ్లను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: తీసివేసిన రాళ్ల స్థానంలో వాటిని పెట్టాలి
  rationale: ఇక్కడ תַּחַת భౌతికంగా ‘కింద’ అనే అర్థంలో కాక, ప్రతిక్షేపణను సూచించే ‘స్థానంలో’ అనే అర్థంలో ఉంది. సందర్భం స్పష్టత కోసం తీసివేసిన రాళ్లు అని పేర్కొనబడింది.
- source_word: וְעָפָר אַחֵר
  choice: వేరే మట్టిగారు
  rationale: עָפָר సాధారణంగా దుమ్ము లేదా మట్టిని సూచించినా, ఇక్కడ ఇంటికి మళ్లీ పూత పూయడానికి ఉపయోగించే మట్టి ఆధారిత గారను సూచిస్తుంది. ‘మట్టిగారు’ మూలపదార్థ భావాన్నీ నిర్మాణ సందర్భాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: יִקַּח
  choice: అతడు తీసుకొని
  rationale: హీబ్రూ క్రియ మూడవ పురుష ఏకవచనంలో ఉంది; ముందున్న బహువచనం నుంచి ఏకవచనానికి మార్పును సమన్వయం చేయకుండా నిలిపింది.
- source_word: וְטָח אֶת הַבָּיִת
  choice: ఇంటికి పూత పూయాలి
  rationale: טוח ఇక్కడ ఇంటి ఉపరితలానికి గారతో పూత వేయడాన్ని సూచిస్తుంది; ‘పూత పూయాలి’ సహజమైన, సందర్భోచిత తెలుగు.
