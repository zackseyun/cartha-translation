    text: పదబద్ధంగా, “యాజకుని అరచేతి మీద—ఎడమది.”
    reason: హీబ్రూ వాక్యనిర్మాణాన్ని చూపించి, ప్రధాన పాఠంలోని సహజమైన తెలుగు రూపానికి ఆధారాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וּמִן
  choice: తర్వాత ...లో కొంత
  rationale: וְ ఆచారక్రమంలోని తదుపరి చర్యను కొనసాగిస్తుంది; מִן నూనెలోనుంచి ఒక భాగాన్ని తీసుకోవడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో దీనిని ‘తర్వాత ...లో కొంత’ అని వ్యక్తం చేశాం.
- source_word: הַשֶּׁמֶן
  choice: ఆ నూనె
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న שֶׁמֶן, ముందుగా పేర్కొన్న నూనెనే సూచిస్తుంది.
- source_word: יִצֹק
  choice: పోయాలి
  rationale: ఈ ఆచారవిధి సందర్భంలో yiqtol ఆదేశాత్మక విధిని కలిగి ఉంది; ఆధునిక తెలుగు నియమభాషలో ‘పోయాలి’ సహజంగా ఉంటుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆరాధనా సందర్భంలో כֹּהֵן‌కు ప్రామాణికమైన తెలుగు పదం.
- source_word: עַל כַּף
  choice: అరచేతిలో
  rationale: כַּף చేతి అరను లేదా దాని పల్లాన్ని సూచిస్తుంది. నూనెను పోసే సందర్భంలో తెలుగు ‘అరచేతిలో’ గమ్యస్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן הַשְּׂמָאלִית
  choice: తన ఎడమ అరచేతి
  rationale: హీబ్రూ పదబద్ధంగా ‘యాజకుని అరచేతి, ఎడమది’ అని ఉంది. ఒకే యాజకుడిని సూచిస్తున్నందున ‘తన’ పునరుక్తిని నివారిస్తూ భావాన్ని స్పష్టంగా ఉంచుతుంది.
