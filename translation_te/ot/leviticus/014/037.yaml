  to: అతడు ఆ తెగులును పరిశీలించాలి. ఇంటి గోడలలోని తెగులు లోపలికి దిగిన ఆకుపచ్చటి లేదా ఎర్రటి మచ్చలుగా[a] ఉండి, వాటి రూపం గోడ ఉపరితలం కంటే లోతుగా కనిపిస్తే[b],
  rationale: The revision replaces the unnatural and overly broad “పల్లపు ప్రాంతాలు” with “లోపలికి దిగిన ... మచ్చలు,” which accurately represents recessed wall spots in natural modern Telugu. It preserves the source’s conditional syntax, plural color descriptions, and the trailing comma required by the continuation of the sentence.
