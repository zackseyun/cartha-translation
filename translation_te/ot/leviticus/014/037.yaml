translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నియమపరమైన శైలి వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగే షరతు కావడంతో చివర కామా నిలుపబడింది. ‘అతడు’ అనే కర్త సమీప సందర్భంలోని యాజకుణ్ణి సూచిస్తుంది; ఈ వచనంలో లేని నామవాచకాన్ని నేరుగా చేర్చలేదు.
