id: LEV.14.37
reference: Leviticus 14:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאָ֣ה אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ בְּ/קִירֹ֣ת הַ/בַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּ/מַרְאֵי/הֶ֥ן שָׁפָ֖ל מִן הַ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/037.yaml
  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: te
  text: అతడు ఆ తెగులును పరిశీలించాలి. ఇంటి గోడలలోని తెగులు లోపలికి దిగిన ఆకుపచ్చటి లేదా ఎర్రటి మచ్చలుగా[a] ఉండి, వాటి రూపం గోడ ఉపరితలం కంటే లోతుగా కనిపిస్తే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పల్లపు మచ్చలుగా.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘గోడ కంటే దిగువగా’; అంటే అవి గోడ ఉపరితలంలోకి దిగిపోయినట్లు కనిపిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు నిర్ధారణ కోసం చూసే నియమపరమైన సందర్భంలో, కేవలం ‘చూడాలి’ కంటే ‘పరిశీలించాలి’ అనే పదం ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּגַע
  choice: తెగులు
  rationale: లేవీయకాండము 13–14లో נגע అనేది మనుషులపై, వస్త్రాలపై, ఇళ్లపై కనిపించే అసాధారణంగా ప్రభావితమైన భాగాన్ని సూచిస్తుంది. ‘తెగులు’ ఈ విస్తృత భావాన్ని నిలుపుతుంది; ఆధునిక వైద్యార్థంలోని ‘సంక్రమణ’ అని అతిగా నిర్ధారించదు.
- source_word: וְהִנֵּה
  choice: ఉండి … కనిపిస్తే
  rationale: నియమపరమైన వాక్యంలో పరిశీలనలో కనబడే పరిస్థితిని ఇది పరిచయం చేస్తుంది. తెలుగులో షరతు నిర్మాణం దాని సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּקִירֹת הַבַּיִת
  choice: ఇంటి గోడలలో
  rationale: గోడ ఉపరితలంలోకి దిగిపోయిన భాగాల గురించి వర్ణన కొనసాగుతున్నందున ‘గోడలలో’ మూలంలోని בְּ ఉపసర్గకు తగినది.
- source_word: שְׁקַעֲרוּרֹת
  choice: పల్లపు ప్రాంతాలు
  rationale: అరుదైన ఈ పదం దిగిపోయిన, లోతుగా ఏర్పడిన భాగాలను సూచిస్తుంది. ‘పల్లపు ప్రాంతాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి తరువాతి ‘లోతుగా కనిపించడం’ అనే లక్షణంతో సరిపోతుంది.
- source_word: יְרַקְרַקֹּת
  choice: ఆకుపచ్చని
  rationale: పునరుక్త రూపం ఆకుపచ్చ ఛాయను సూచిస్తుంది. తెలుగులో ‘ఆకుపచ్చని’ సహజంగా ఆ రంగు లక్షణాన్ని తెలియజేస్తుంది; ఖచ్చితమైన పసుపు-ఆకుపచ్చ ఛాయను వచనం నిర్బంధించదు.
- source_word: אֲדַמְדַּמֹּת
  choice: ఎర్రని
  rationale: పునరుక్త రూపం ఎర్రటి ఛాయను సూచిస్తుంది. ‘ఎర్రని’ సహజమైన తెలుగు రంగు వర్ణన; రంగు తీవ్రతను అనవసరంగా ఖచ్చితం చేయదు.
- source_word: וּמַרְאֵיהֶן
  choice: అవి … కనిపిస్తే
  rationale: మూలంలోని ‘వాటి రూపం/కనిపించే తీరు’ అనే భావాన్ని తెలుగులో సహజమైన దృశ్య వర్ణనగా వ్యక్తం చేస్తుంది.
- source_word: שָׁפָל מִן הַקִּיר
  choice: గోడ ఉపరితలం కంటే లోతుగా
  rationale: అక్షరార్థంగా ‘గోడ కంటే దిగువగా’ ఉన్నదనే భావం. ఇక్కడ పల్లపు భాగాలు గోడ ఉపరితలంలోకి దిగినట్లు కనిపించడం ఉద్దేశం కాబట్టి ‘ఉపరితలం కంటే లోతుగా’ స్పష్టంగా ఉంటుంది.
