revisions:
- from: ఆ ఇల్లు నిర్బంధంలో ఉన్న రోజులన్నిటిలో దానిలో ప్రవేశించే ప్రతి వ్యక్తి సాయంత్రం వరకు అపవిత్రుడై ఉంటాడు.[a]
  to: ఆ ఇంటిని వేరుగా ఉంచిన రోజులన్నిటిలో దానిలోకి ప్రవేశించే ఎవరైనా సాయంత్రం వరకు అపవిత్రమవుతారు.[a]
  rationale: The revision replaces a potentially misleading custodial expression with wording that reflects the priestly isolation procedure, clarifies movement into the house, and renders the legal consequence in idiomatic gender-neutral Telugu. The footnote preserves the lexical alternatives ‘shut up’ and ‘confined’ while explaining the historical-ritual context only as needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the generic entrant, the full period of the house's isolation, the resulting ritual impurity, and its duration until evening. However, ‘నిర్బంధంలో’ can suggest detention or custody rather than the priestly isolation of a house, and ‘అపవిత్రుడై ఉంటాడు’ somewhat weakens the Hebrew imperfect’s resulting-state force.
  naturalness: The sentence is understandable, but ‘ఆ ఇల్లు నిర్బంధంలో ఉన్న రోజులన్నిటిలో’ is less idiomatic and less precise than phrasing the restriction as an action done to the house. ‘దానిలోకి’ more clearly conveys entry into the house.
  terminology: ‘అపవిత్ర’ is the established and appropriate rendering for ritual uncleanness. ‘వేరుగా ఉంచిన’ is a natural, non-anachronistic rendering of the house being shut up/isolated for priestly inspection; the alternatives are retained in the footnote.
  issues:
  - severity: medium
    issue: ‘నిర్బంధంలో ఉన్న’ for הִסְגִּיר אֹתוֹ
    rationale: In modern Telugu, ‘నిర్బంధం’ commonly evokes detention or confinement of a person. The Hebrew refers specifically to a house being shut up or isolated under a priestly procedure. ‘ఆ ఇంటిని వేరుగా ఉంచిన’ better preserves that sense without importing custodial implications.
  - severity: low
    issue: ‘అపవిత్రుడై ఉంటాడు’ for יִטְמָא
    rationale: The Hebrew legal imperfect states the consequence of entry—he becomes/is rendered unclean. ‘అపవిత్రమవుతారు’ gives this resultant force naturally and avoids unnecessary gender marking in a generic legal statement.
  revised_text: ఆ ఇంటిని వేరుగా ఉంచిన రోజులన్నిటిలో దానిలోకి ప్రవేశించే ఎవరైనా సాయంత్రం వరకు అపవిత్రమవుతారు.[a]
