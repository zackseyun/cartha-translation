  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి యొక్క గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘అపవిత్రుడు’ ఇక్కడ ఆచారపరమైన స్థితిని సూచిస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
