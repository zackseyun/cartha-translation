source:
  edition: WLC
  text: וְ/הַ/בָּא֙ אֶל הַ/בַּ֔יִת כָּל יְמֵ֖י הִסְגִּ֣יר אֹת֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/046.yaml
  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: te
  text: ఆ ఇంటిని వేరుగా ఉంచిన రోజులన్నిటిలో దానిలోకి ప్రవేశించే ఎవరైనా సాయంత్రం వరకు అపవిత్రమవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ఇంటిని మూసి ఉంచిన” లేదా “ఆ ఇంటిని నిర్బంధించి ఉంచిన.” హీబ్రూ పదం, పరిశీలన కోసం యాజకుని ఆదేశం మేరకు ఆ ఇంటిని వేరుగా ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: ప్రవేశించే ప్రతి వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం ఇక్కడ సాధారణంగా వర్తించే న్యాయ నియమాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఎవరైనా ప్రవేశిస్తే అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל הַ/בַּיִת
  choice: ఆ ఇల్లు … దానిలో
  rationale: בוא తో אֶל కదలికను, అంటే ఇంటిలోకి ప్రవేశించడాన్ని సూచిస్తుంది; తెలుగులో ‘దానిలో ప్రవేశించే’ సహజమైన వ్యక్తీకరణ.
- source_word: כָּל יְמֵי
  choice: ఉన్న రోజులన్నిటిలో
  rationale: ఇల్లు నిర్బంధంలో ఉంచబడిన పూర్తి కాలవ్యవధిని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: הִסְגִּיר אֹתוֹ
  choice: ఆ ఇల్లు నిర్బంధంలో ఉన్న
  rationale: లేవీయకాండము 13–14లో סגר యాజకుని పర్యవేక్షణలో పరీక్ష కోసం వేరుగా ఉంచడాన్ని సూచిస్తుంది. ‘నిర్బంధంలో’ అనే పదం ఆధునిక వైద్యార్థాన్ని అతిగా రుద్దకుండా ఆ న్యాయ-ఆచార సంబంధ స్థితిని తెలియజేస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడై ఉంటాడు
  rationale: ఈ క్రియ ఆచారపరమైన అపవిత్ర స్థితిలోకి రావడం లేదా ఆ స్థితిలో ఉండడాన్ని సూచిస్తుంది; సందర్భంలో ఫలిత స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד הָ/עָרֶב
  choice: సాయంత్రం వరకు
  rationale: తాత్కాలిక ఆచార అపవిత్రత కొనసాగే పరిమితిని తెలిపే ప్రామాణిక కాలవ్యక్తీకరణ.
