source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/חִלְּצוּ֙ אֶת הָ֣/אֲבָנִ֔ים אֲשֶׁ֥ר בָּ/הֵ֖ן הַ/נָּ֑גַע וְ/הִשְׁלִ֤יכוּ אֶתְ/הֶן֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: te
  text: అప్పుడు యాజకుడు, ఆ తెగులు ఉన్న రాళ్లను[a] తీసివేసి, పట్టణం వెలుపల ఉన్న అపవిత్రమైన చోట పారవేయాలని ఆజ్ఞాపించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తెగులు వాటిలో ఉన్న రాళ్లను.” హీబ్రూ పదబంధం అక్షరార్థంగా ఇలాగే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: అప్పుడు ... ఆజ్ఞాపించాలి
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ కర్మకాండలోని తదుపరి దశను సూచిస్తుంది. ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆజ్ఞాపించాలి’ ఆదేశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆచార సందర్భంలో כֹּהֵןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וְחִלְּצוּ
  choice: తీసివేసి
  rationale: గోడలోని రాళ్లను బయటకు లాగి తొలగించే చర్యను సహజంగా వ్యక్తపరుస్తుంది; చర్య జరిగే ఖచ్చిత పద్ధతిని అనవసరంగా నిర్దేశించదు.
- source_word: הָאֲבָנִים
  choice: రాళ్లను
  rationale: భవన నిర్మాణ రాళ్లను సూచించే నేరమైన, సహజమైన అనువాదం.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: ఆ తెగులు ఉన్న రాళ్లను
  rationale: בָּהֵן యొక్క ‘వాటిలో’ భావాన్ని తెలుగులో సహజమైన సంబంధ వాక్యంగా అందిస్తుంది. נֶגַעను నిర్దిష్ట ఆధునిక వైద్య లేదా శాస్త్రీయ నిర్ధారణగా మార్చకుండా ‘తెగులు’గా అనువదించింది.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: పారవేయాలని
  rationale: רాళ్లను నిర్ణీత అపవిత్ర స్థలానికి విసిరి తొలగించాలనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֶל מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల ఉన్న
  rationale: నగర లేదా నివాస ప్రాంతపు హద్దుల బయటకు తీసుకెళ్లే దిశను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל מָקוֹם טָמֵא
  choice: అపవిత్రమైన చోట
  rationale: టָמֵא అనే లేవీయ పరిశుద్ధత-అపవిత్రత వర్గానికి ‘అపవిత్రమైన’ అనేది స్పష్టమైన, గౌరవప్రదమైన తెలుగు సమానం.
theological_decisions:
- issue: లేవీయకాండంలోని נֶגַע అనే పదం యొక్క స్వభావం
  choice: తెగులు
  alternative: మచ్చ; బూజు; వ్యాధిగ్రస్త భాగం
  rationale: మూలపదం చర్మం, వస్త్రం, ఇల్లు మొదలైన వాటిలో కనిపించే దెబ్బ లేదా వ్యాప్తిని సూచించగలదు. ఇక్కడ ‘తెగులు’ ఆచారపరంగా కలుషితం చేసే స్థితిని తెలియజేస్తూనే దానిని బూజు లేదా ఆధునిక వైద్య వ్యాధిగా ఖచ్చితంగా నిర్ణయించదు.
- issue: టָמֵא అనే ఆచారపరమైన పదం
  choice: అపవిత్రమైన
  alternative: అశుద్ధమైన; కలుషితమైన
  rationale: ఇది సాధారణ మురికిని మాత్రమే కాక ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ‘అపవిత్రమైన’ ఆ భావాన్ని స్పష్టంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండపు ఆచారపరమైన గంభీరత నిలిచేలా అనువదించబడింది. ఆజ్ఞ యొక్క క్రమబద్ధ నిర్మాణం సహజ తెలుగు వాక్యనిర్మాణంలో ఇవ్వబడింది.
