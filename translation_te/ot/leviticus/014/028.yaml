source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: te
  text: యాజకుడు తన అరచేతిమీద ఉన్న నూనెలో కొంతను శుద్ధి పొందుతున్న వ్యక్తి కుడి చెవి తమ్మె మీద, అతని కుడిచేతి బొటనవేలు మీద, అతని కుడికాలి బొటనవేలు మీద—అపరాధ బలి రక్తం పూసిన చోట్లనే—వేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపరాధ బలి రక్తం ఉన్న స్థలంలో.”
    reason: హెబ్రీలోని సంక్షిప్తమైన ‘అపరాధ బలి రక్తం యొక్క స్థలం’ అనే పదబంధం, ముందటి ఆచారంలో రక్తం పూసిన స్థలాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וְנָתַן
  choice: వేయాలి
  rationale: נתן అనే పదానికి ‘ఇవ్వడం/పెట్టడం/వేయడం’ అనే విస్తృత అర్థాలున్నాయి. ఈ ఆచార సందర్భంలో శరీర భాగాలపై నూనె ఉంచడాన్ని సహజంగా తెలిపేందుకు ‘వేయాలి’ అని అనువదించాం.
- source_word: מִן הַשֶּׁמֶן
  choice: నూనెలో కొంత
  rationale: מן ఇక్కడ భాగార్థకంగా ఉంది; అందువల్ల తెలుగులో సహజంగా ‘నూనెలో కొంత’ అని వ్యక్తపరచాం.
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: తన అరచేతిలో ఉన్న
  rationale: כף ఇక్కడ యాజకుని అరచేతిని సూచిస్తుంది. హెబ్రీలో ‘మీద’ అనే ఉపసర్గ ఉన్నప్పటికీ, నూనెను చేతిలో ఉంచే సందర్భాన్ని సహజ తెలుగులో ‘అరచేతిలో ఉన్న’ అని తెలిపాం.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: యాజక ఆచార సందర్భంలో תנוך చెవి దిగువన ఉన్న మృదువైన భాగాన్ని, అంటే చెవి తమ్మెను సూచిస్తుంది.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: హిత్పయేల్ వర్తమాన కృదంతం ఆచారపరమైన శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది; పూర్తయిన స్థితిగా కాక ప్రక్రియగా అనువదించాం.
- source_word: בֹּהֶן יָדוֹ
  choice: అతని కుడిచేతి బొటనవేలు
  rationale: చేతికి సంబంధించి בֹּהֶן ప్రత్యేకంగా బొటనవేలును సూచిస్తుంది.
- source_word: בֹּהֶן רַגְלוֹ
  choice: అతని కుడికాలి బొటనవేలు
  rationale: కాలికి సంబంధించి בֹּהֶן పెద్ద బొటనవేలును సూచిస్తుంది; తెలుగులో ‘కాలి బొటనవేలు’ అనేది సహజమైన ప్రయోగం.
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: అపరాధ బలి రక్తం ఉన్న చోట
  rationale: מקום అంటే ‘స్థలం/చోటు.’ ముందటి ఆచారంలో అపరాధ బలి రక్తం పెట్టిన అదే ప్రదేశాన్ని ఈ మాటలు సూచిస్తాయి; మూలంలోని సంక్షిప్త నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం
  choice: అపరాధ బలి
  alternative: పరిహార బలి
  rationale: אָשָׁם అపరాధాన్ని, దానికి సంబంధించిన పరిహార బాధ్యతను రెండింటినీ సూచించగలదు. లేవీయకాండంలోని బలి సందర్భంలో గుర్తించదగిన సంప్రదాయ పదంగా ‘అపరాధ బలి’ని వాడాం; పరిహార భావాన్ని పాఠ్యంలో అదనంగా నిర్దేశించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆచారపరమైన ‘శుద్ధి’ మరియు బలి సంబంధ పదజాలాన్ని నిలిపి, హెబ్రీలో అంతర్లీనంగా ఉన్న చర్యను ప్రధాన పాఠ్యంలో అతిగా విప్పకుండా పాదసూచికలో ఇచ్చాం.
