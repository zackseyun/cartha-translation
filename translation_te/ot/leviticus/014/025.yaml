id: LEV.14.25
reference: Leviticus 14:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: te
  text: తరువాత అతడు దోషపరిహార బలికి[a] ఉద్దేశించిన గొర్రెపిల్లను వధించాలి. యాజకుడు ఆ దోషపరిహార బలి రక్తంలో కొంత తీసుకొని, శుద్ధి పొందుతున్న వ్యక్తి కుడి చెవి లోబుపై[b], అతని కుడిచేతి బొటనవేలిపై, అతని కుడికాలి బొటనవేలిపై పూయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా ‘అపరాధ బలి’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కుడి చెవి కొనపై.’ హెబ్రీ పదం చెవి వెలుపలి చివరి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: వధించాలి
  rationale: బలికి సంబంధించిన ఆచార సందర్భంలో సాధారణమైన ‘చంపాలి’ కంటే ‘వధించాలి’ అనే పదం సాంకేతిక భావాన్ని, విధానపరమైన ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: దోషపరిహార బలికి ఉద్దేశించిన గొర్రెపిల్ల
  rationale: ఇది దోషపరిహార బలిగా నియమించబడిన గొర్రెపిల్ల అని నిర్మాణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָשָׁם
  choice: దోషపరిహార బలి
  rationale: ఇక్కడ పదం కేవలం అంతరంగ దోషాన్ని కాక, లేవీయ బలివిధానంలోని ప్రత్యేక బలిని సూచిస్తుంది. ‘దోషపరిహార బలి’ దోషం మరియు పరిహారం రెండింటి సంబంధాన్ని తెలిపే స్పష్టమైన పదబంధం.
- source_word: מִדַּם הָאָשָׁם
  choice: దోషపరిహార బలి రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; మొత్తం రక్తం కాక దానిలో కొంత మాత్రమే తీసుకుంటారని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: చెవి వెలుపలి చివర లేదా పొడుచుకొచ్చిన భాగాన్ని సూచించే పదానికి ‘చెవి తమ్మె’ సహజమైన శరీర నిర్మాణ పదం; ప్రత్యామ్నాయమైన ‘చెవి కొన’ను పాదసూచికలో ఉంచాం.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: హిత్పయేల్ కృదంతం శుద్ధీకరణ ప్రక్రియకు లోనవుతున్న వ్యక్తిని సూచిస్తుంది; కొనసాగుతున్న ఆచార ప్రక్రియ భావాన్ని ఇది నిలుపుతుంది.
- source_word: בֹּהֶן יָדוֹ
  choice: అతని కుడిచేతి బొటనవేలు
  rationale: చేతితో ఉన్నప్పుడు בֹּהֶן బొటనవేలును సూచిస్తుంది; తెలుగులో ఇదే సహజమైన నిర్దిష్ట శరీర భాగ పదం.
- source_word: בֹּהֶן רַגְלוֹ
  choice: అతని కుడికాలి బొటనవేలు
  rationale: కాలితో ఉన్నప్పుడు בֹּהֶן పెద్ద కాలివేలును సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాలి బొటనవేలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְ
  choice: తరువాత / మరియు వాక్యక్రమం
  rationale: మొదటి వావ్ ఆచార చర్యల వరుసను సూచిస్తుండగా ‘తరువాత’ అని అనువదించాం; మిగతా అనుసంధానాలను తెలుగు వాక్య నిర్మాణంలో సహజమైన విరామాలతో కొనసాగించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: బలివిధిని నిర్వహించే అధికారిక పరిచారకునికి ప్రామాణికమైన తెలుగు పదం.
theological_decisions:
- issue: אָשָׁם అనే బలిపదానికి అనువాదం
  choice: దోషపరిహార బలి
  alternative: అపరాధ బలి
  rationale: వచనం లేవీయ వ్యవస్థలోని ఒక ప్రత్యేక బలిని సూచిస్తుంది. ‘దోషపరిహార బలి’ దాని ఆచార స్వభావాన్ని తెలియజేస్తూ, తరువాతి సిద్ధాంతపరమైన అర్థాలను అనవసరంగా చేర్చదు; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆచారపరమైన శైలి వాడబడింది. విధాన క్రమాన్ని ‘తరువాత’ మరియు ‘పూయాలి’ వంటి సహజ రూపాలతో తెలిపాం. మూలంలోని శుద్ధీకరణ ప్రక్రియ భావం, రక్తంలో కొంత మాత్రమే తీసుకునే భాగార్థం, కుడి చెవి–చేయి–కాలి సమాంతర నిర్మాణం నిలుపబడ్డాయి.
