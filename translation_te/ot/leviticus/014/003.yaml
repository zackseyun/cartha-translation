id: LEV.14.3
reference: Leviticus 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: te
  text: యాజకుడు శిబిరం వెలుపలికి వెళ్లాలి; యాజకుడు అతణ్ణి పరిశీలించాలి. ఇదిగో, ఆ చర్మవ్యాధిగల వ్యక్తి నుండి చర్మవ్యాధి మచ్చ[a] నయమై ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాలు సంప్రదాయంగా “కుష్ఠు” అని అనువదించబడతాయి. అయితే అవి ఆధునిక హాన్సెన్ వ్యాధినే కాక, విస్తృతమైన చర్మవ్యాధి లేదా చర్మంపై కనిపించే స్థితిని సూచించవచ్చు.
    reason: The Hebrew terms צָרַעַת and צָרוּעַ have a broader and disputed medical reference; the note preserves this ambiguity without importing a modern diagnosis.
lexical_decisions:
- source_word: וְיָצָא
  choice: వెళ్లాలి
  rationale: విధి-నియమ సందర్భంలోని క్రియను నిర్దేశిత చర్యగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనాపరమైన న్యాయ సందర్భంలో כֹּהֵןకు ప్రామాణికమైన తెలుగు పదం; హీబ్రూలోని పునరుక్తిని కూడా నిలిపింది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: אֶל సూచించే గమనదిశను, מִחוּץ సూచించే వెలుపలి ప్రదేశాన్ని సంక్షిప్తంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: మూల అర్థం ‘చూడడం’ అయినా, ఈ తనిఖీ నియమ సందర్భంలో యాజకుడు స్థితిని పరిశీలించి నిర్ధారించడమే ఉద్దేశం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ దృష్టి-ఆహ్వాన పదాన్ని షరతుగా మార్చకుండా నిలిపి, పరిశీలనలో వెల్లడైన విషయాన్ని పరిచయం చేస్తుంది.
- source_word: נִרְפָּא
  choice: నయమై ఉంటే
  rationale: నిఫాల్ రూపంలోని నిష్క్రియాత్మక, ఫలిత స్థితిని తెలుగులో వ్యక్తం చేస్తుంది; వాక్యం తరువాతి ఆజ్ఞకు షరతుగా కొనసాగుతున్నందున ‘ఉంటే’ సహజం.
- source_word: נֶגַע הַצָּרַעַת
  choice: చర్మవ్యాధి పుండు
  rationale: נֶגַע యొక్క కనిపించే పుండు/దెబ్బ భావాన్ని, צָרַעַת యొక్క విస్తృత చర్మరోగ భావాన్ని తెలియజేస్తూ ఆధునిక హాన్సెన్ వ్యాధితో అనవసరంగా సమానం చేయదు.
- source_word: מִן הַצָּרוּעַ
  choice: ఆ చర్మవ్యాధిగల వ్యక్తి నుండి
  rationale: מִן‌లోని వేరుపాటు భావాన్ని స్పష్టంగా నిలిపి, వ్యాధి పుండు బాధితుని నుండి తొలగిపోయిందనే హీబ్రూ నిర్మాణాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: צָרַעַת / צָרוּעַ పదాల అర్థవ్యాప్తి
  choice: చర్మవ్యాధి / చర్మవ్యాధిగల వ్యక్తి
  alternative: కుష్ఠు / కుష్ఠురోగి
  rationale: ఈ హీబ్రూ పదాలు ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం కావు; చర్మంపై కనిపించే వివిధ అపవిత్రత సంబంధిత స్థితులను సూచించగలవు. అందువల్ల అనవసరమైన వైద్య నిర్ధారణను అనువాదంలో చేర్చలేదు.
- issue: וְהִנֵּה యొక్క వాక్యపాత్ర
  choice: ఇదిగో
  alternative: ఒకవేళ
  rationale: మూలంలోని ప్రత్యక్ష దృష్టి-ఆహ్వానాన్ని నిలిపింది. అయితే తరువాతి నియమానికి ఇది కార్యరీత్యా షరతును ఏర్పరుస్తున్నందున క్రియ వద్ద ‘ఉంటే’ ఉపయోగించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగాను సాధారణ పాఠకులకు స్పష్టమైనదిగాను ఉంచబడింది. మూలంలోని యాజకుడు అనే పునరుక్తి, ‘ఇదిగో’ అనే సూచన, మరియు ‘నుండి’ అనే వేరుపాటు భావం నిలిపివేయబడ్డాయి. ఈ వచనం తరువాతి వచనంలో కొనసాగే నియమ వాక్యం కాబట్టి చివర కామా ఉంచబడింది.
