revisions:
- from: యాజకుడు శిబిరం వెలుపలికి వెళ్లాలి. యాజకుడు అతణ్ణి పరిశీలించాలి. ఇదిగో, చర్మవ్యాధి పుండు ఆ చర్మవ్యాధిగల వ్యక్తి నుండి నయమై ఉంటే,
  to: యాజకుడు శిబిరం వెలుపలికి వెళ్లాలి; యాజకుడు అతణ్ణి పరిశీలించాలి. ఇదిగో, ఆ చర్మవ్యాధిగల వ్యక్తి నుండి చర్మవ్యాధి మచ్చ[a] నయమై ఉంటే,
  rationale: The revision changes only the overly narrow “పుండు” to “మచ్చ,” retains the Hebrew’s repeated “priest,” demonstrative “ఇదిగో,” and separation sense “నుండి,” and adds an anchored explanatory footnote for the non-specific skin-disease terminology. The final comma is retained because the legal condition continues into the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:46:18Z'
review_pass:
  verdict: revise
  source_fidelity: The procedural force of the verbs, the repeated reference to the priest, the outward movement beyond the camp, and the resultative healing are conveyed well. However, “పుండు” specifically denotes a sore/wound and is narrower than נֶגַע, which can denote an affliction, lesion, or mark. “మచ్చ” is a more suitable contextual rendering here without identifying the condition as modern leprosy.
  naturalness: The Telugu is clear and appropriately formal. Retaining the two short clauses is acceptable, though a semicolon gives the continuing legal sentence a smoother connection. “ఆ చర్మవ్యాధిగల వ్యక్తి నుండి” is understandable and preserves the Hebrew separation construction.
  terminology: “యాజకుడు,” “శిబిరం,” and “చర్మవ్యాధి” are suitable modern-standard Telugu terms. Replacing “చర్మవ్యాధి పుండు” with “చర్మవ్యాధి మచ్చ” avoids an unwarranted restriction to an open sore. A footnote is supplied and anchored at the disease term to preserve the wider semantic range of צָרַעַת/צָרוּעַ.
  issues:
  - severity: medium
    issue: “చర్మవ్యాధి పుండు” is overly specific for נֶגַע הַצָּרַעַת.
    rationale: “పుండు” normally means a sore or wound, whereas the Hebrew term can refer more broadly to an affliction/lesion/mark associated with צָרַעַת. “చర్మవ్యాధి మచ్చ” fits the inspection context while avoiding a specific medical diagnosis.
  - severity: low
    issue: The explanatory note on the broader sense of the Hebrew disease terminology is absent and unanchored.
    rationale: The English audit trail preserves this ambiguity in a footnote. Adding an anchored Telugu note helps prevent readers from equating the term automatically with modern Hansen’s disease.
  revised_text: యాజకుడు శిబిరం వెలుపలికి వెళ్లాలి; యాజకుడు అతణ్ణి పరిశీలించాలి. ఇదిగో, ఆ చర్మవ్యాధిగల వ్యక్తి నుండి చర్మవ్యాధి మచ్చ[a] నయమై ఉంటే,
  revised_footnotes:
  - marker: a
    text: హీబ్రూ పదాలు సంప్రదాయంగా “కుష్ఠు” అని అనువదించబడతాయి. అయితే అవి ఆధునిక హాన్సెన్ వ్యాధినే కాక, విస్తృతమైన చర్మవ్యాధి లేదా చర్మంపై కనిపించే స్థితిని సూచించవచ్చు.
    reason: The Hebrew terms צָרַעַת and צָרוּעַ have a broader and disputed medical reference; the note preserves this ambiguity without importing a modern diagnosis.
  revision_rationale: The revision changes only the overly narrow “పుండు” to “మచ్చ,” retains the Hebrew’s repeated “priest,” demonstrative “ఇదిగో,” and separation sense “నుండి,” and adds an anchored explanatory footnote for the non-specific skin-disease terminology. The final comma is retained because the legal condition continues into the following verse.
