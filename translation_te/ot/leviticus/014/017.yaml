source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: te
  text: యాజకుడు తన అరచేతి మీద ఉన్న మిగిలిన నూనెలో కొంత తీసుకొని, శుద్ధి పొందుతున్న వ్యక్తి కుడి చెవితమ్మెపై[a], అతని కుడిచేతి బొటనవేలిపై, అతని కుడికాలి బొటనవేలిపై అపరాధ పరిహార బలి రక్తం మీద[b] వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుడి చెవి కొనపై.’ హీబ్రూ పదం చెవి వెలుపలి చివరి భాగాన్ని సూచిస్తుంది; ఈ ఆచార సందర్భంలో ‘చెవితమ్మె’ అనేది స్పష్టమైన ఆధునిక పదం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అపరాధ పరిహార బలి రక్తం మీద.’ అంటే, ముందుగా రక్తం పెట్టిన అవే చోట్ల దాని మీద నూనె వేయాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: మిగిలిన నూనెలో కొంత
  rationale: יֶתֶר మిగిలి ఉన్నదాన్ని సూచిస్తుంది; מִן పాక్షిక భావాన్ని ఇస్తుంది. కాబట్టి నూనె అంతటినీ కాక దానిలో కొంత వాడుతున్నట్లు సహజమైన తెలుగులో వ్యక్తమవుతుంది.
- source_word: עַל כַּפּוֹ
  choice: తన అరచేతి మీద ఉన్న
  rationale: כַּף ఇక్కడ అరచేతిని సూచిస్తుంది; עַל యొక్క సాధారణ స్థలార్థాన్ని ‘మీద’ నిలుపుతుంది. సందర్భంలో ‘తన’ అనేది యాజకుడిని సూచిస్తుంది.
- source_word: יִתֵּן
  choice: వేయాలి
  rationale: נתן కు పెట్టు/వేయు అనే విస్తృత అర్థం ఉంది. ఈ ఆచార సందర్భంలో నూనెను నిర్దిష్ట భాగాలపై ఉంచడాన్ని ‘వేయాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: תְּנוּךְ చెవి వెలుపలి అంచు లేదా చివరి భాగాన్ని సూచించే అరుదైన పదం. ఈ ఆచార సందర్భంలో ఆధునిక తెలుగులో ‘చెవి తమ్మె’ స్పష్టమైన శరీర భాగ సూచన; ‘చెవి కొన’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: హిత్పయేల్ వర్తమాన కృదంతం ఆచారపరమైన శుద్ధీకరణ ప్రక్రియకు లోనవుతున్న వ్యక్తిని సూచిస్తుంది. ‘శుద్ధి పొందుతున్న’ అనే రూపం ఆ ప్రక్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: בֹּהֶן יָדוֹ
  choice: అతని కుడిచేతి బొటనవేలు
  rationale: చేతి సందర్భంలో בֹּהֶן బొటనవేలును సూచిస్తుంది; తెలుగు శరీర భాగ పదప్రయోగానికి అనుగుణంగా ఇచ్చాం.
- source_word: בֹּהֶן רַגְלוֹ
  choice: అతని కుడికాలి బొటనవేలు
  rationale: కాలి సందర్భంలో అదే పదం పెద్ద బొటనవేలును సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాలి బొటనవేలు’ సహజమైన రూపం.
- source_word: עַל דַּם הָאָשָׁם
  choice: అపరాధ పరిహార బలి రక్తం మీదనే
  rationale: చివరి עַל, ముందే రక్తం పెట్టిన అదే ప్రదేశాలపై నూనె వేయడాన్ని సూచిస్తుంది. ‘మీదనే’ ఆ సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది; పాదసూచికలో మరింత అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
theological_decisions:
- issue: ఆశామ్ (אָשָׁם) బలి సాంకేతిక పదం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి
  rationale: లేవీయకాండంలోని אָשָׁם అపరాధం లేదా బాధ్యతకు సంబంధించిన నిర్దిష్ట బలిని సూచిస్తుంది. ‘అపరాధ పరిహార బలి’ దాని బలిపద్ధతి సంబంధిత ప్రత్యేకతను తెలియజేస్తుంది; తరువాతి మతసిద్ధాంత భావాలను అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార నియమానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. శరీర భాగాల పునరుక్తిని హీబ్రూ ఆచార సూత్రానికి అనుగుణంగా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
