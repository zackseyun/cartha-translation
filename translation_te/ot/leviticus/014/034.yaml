revisions:
- from: “నేను మీకు స్వాస్థ్యంగా ఇస్తున్న కనాను దేశంలోకి మీరు ప్రవేశించినప్పుడు, మీ స్వాస్థ్య దేశంలోని ఒక ఇంటిలో నేను కుష్ఠు మచ్చను[a] కలిగిస్తే,”
  to: “నేను మీకు స్వాధీనంగా ఇస్తున్న కనాను దేశంలోకి మీరు ప్రవేశించినప్పుడు, నేను మీ స్వాధీనమైన దేశంలోని ఒక ఇంటిలో కుష్ఠు మచ్చను[a] కలిగించినప్పుడు,”
  rationale: The revision replaces an unwarranted explicit conditional with a temporal rendering corresponding to the Hebrew coordination, while preserving God’s direct agency. It also uses more current Telugu for possession and refines the lexical note to describe the breadth of the Hebrew term without imposing a modern medical diagnosis.
  reviewer_model: gpt-5.6-terra
