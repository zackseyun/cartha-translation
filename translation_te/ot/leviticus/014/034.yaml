  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: te
  text: “నేను మీకు స్వాధీనంగా ఇస్తున్న కనాను దేశంలోకి మీరు ప్రవేశించినప్పుడు, నేను మీ స్వాధీనమైన దేశంలోని ఒక ఇంటిలో కుష్ఠు మచ్చను[a] కలిగించినప్పుడు,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం ఆధునిక అర్థంలోని కుష్ఠువ్యాధిని మాత్రమే సూచించదు. ఇది మనుషులలో, వస్త్రాల్లో, ఇళ్లలో కనిపించే వివిధ రకాల మచ్చలు లేదా వ్యాప్తులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: మీరు ప్రవేశించినప్పుడు
  rationale: ఇక్కడ כִּי భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేస్తుంది; ‘ప్రవేశించినప్పుడు’ న్యాయవిధి సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אֶרֶץ כְּנַעַן
  choice: కనాను దేశం
  rationale: భౌగోళిక ప్రాంతాన్ని స్పష్టంగా, ప్రామాణికంగా సూచిస్తుంది.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם לַאֲחֻזָּה
  choice: నేను మీకు స్వాస్థ్యంగా ఇస్తున్న
  rationale: నֹתֵן అనే కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు భావాన్ని ‘ఇస్తున్న’ నిలుపుతుంది; אֲחֻזָּה భూస్వామ్య హక్కుగల ఆస్తిని సూచించేందున ‘స్వాస్థ్యం’ అనుకూలం.
- source_word: וְנָתַתִּי
  choice: నేను ... కలిగిస్తే
  rationale: హీబ్రూ పాఠంలో దేవుని ప్రత్యక్ష కర్తృత్వం ఉంది. తెలుగు షరతు వాక్య నిర్మాణంలో ‘కలిగిస్తే’ సహజంగా ఉండి ఆ కర్తృత్వాన్ని నిలుపుతుంది.
- source_word: נֶגַע צָרַעַת
  choice: కుష్ఠు మచ్చను
  rationale: ఇంటి సందర్భంలో ఇది ఆధునిక అర్థంలోని చర్మవ్యాధి కాదు; కనిపించే హానికరమైన మచ్చ లేదా వ్యాప్తిని సూచిస్తుంది. సంప్రదాయ పదమైన ‘కుష్ఠు’ను ఉంచి, ‘మచ్చ’తో గృహ సందర్భాన్ని స్పష్టం చేశాం.
- source_word: בְּבֵית
  choice: ఒక ఇంటిలో
  rationale: בְּ ఉపసర్గకు ఇక్కడ సహజమైన స్థలార్థం ‘ఇంటిలో’.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: మీ స్వాస్థ్య దేశం
  rationale: ముందున్న אֲחֻזָּהతో పదసంబంధాన్ని నిలుపుతూ భూస్వామ్య భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇంటి కుష్ఠు మచ్చకు దేవుని కర్తృత్వం
  choice: ‘నేను ... కలిగిస్తే’ అని దేవుని ప్రత్యక్ష కర్తృత్వాన్ని నిలుపడం
  alternative: ‘మచ్చ ఏర్పడితే’ వంటి కర్తలేని ప్రయోగం
  rationale: וְנָתַתִּי మొదటి పురుష ఏకవచనంలో దేవుడే ఈ పరిస్థితిని కలిగిస్తున్నట్లు స్పష్టంగా చెబుతుంది. దానివల్ల ఏర్పడే theological tension‌ను అనువాదం తగ్గించకూడదు.
- issue: צָרַעַת యొక్క స్వభావం
  choice: ముఖ్య పాఠంలో ‘కుష్ఠు మచ్చ’, పాదటిప్పణిలో విస్తృత అర్థ వివరణ
  alternative: ‘చర్మవ్యాధి వ్యాప్తి’
  rationale: ఇది ఇంటికి వర్తిస్తున్నందున ‘చర్మవ్యాధి’ సందర్భానుకూలం కాదు. అదే సమయంలో ‘కుష్ఠు’ను ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం చేయకుండా పాదటిప్పణి ద్వారా అసలు పద విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలి. ‘స్వాస్థ్యం’ ద్వారా భూహక్కు భావం, ‘కలిగిస్తే’ ద్వారా దేవుని కర్తృత్వం నిలుపబడ్డాయి. వాక్యం తరువాతి వచనాలకు అనుసంధానమయ్యే ఉపవాక్యం కాబట్టి చివర కామా ఉంచబడింది.
