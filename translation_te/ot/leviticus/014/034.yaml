    text: హీబ్రూ పదబంధం ఆధునిక అర్థంలోని కుష్ఠువ్యాధిని మాత్రమే సూచించదు. ఇది మనుషులలో, వస్త్రాల్లో, ఇళ్లలో కనిపించే వివిధ రకాల మచ్చలు లేదా వ్యాప్తులను సూచించగలదు.
    reason: lexical_alternative
