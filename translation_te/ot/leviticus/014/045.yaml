  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: te
  text: అప్పుడు అతడు ఆ ఇంటిని—దాని రాళ్లతో, దాని కలప భాగాలతో, ఇంటి పూతనంతటితో[a]—పడగొట్టి, వాటిని పట్టణం వెలుపల ఉన్న అపవిత్రమైన చోటికి తీసుకెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇంటి దుమ్ము/మట్టినంతటిని’ లేదా ‘ఇంటి గారనంతటిని.’ హీబ్రూలో అక్షరార్థం ‘ఇంటి దుమ్ము/మట్టి అంతా’; అయితే ఈ నిర్మాణ సందర్భంలో అది గోడల నుంచి గోకి తీసిన పూత లేదా గారను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: అప్పుడు అతడు … పడగొట్టి
  rationale: נתץ ఇక్కడ కలుషితమైన ఇంటిని కూల్చివేయడాన్ని సూచిస్తుంది. సందర్భంలోని వరుస చర్యను וְ సూచిస్తున్నందున ‘అప్పుడు’ అని, భౌతిక కూల్చివేత భావాన్ని సహజంగా తెలియజేయడానికి ‘పడగొట్టి’ అని అనువదించాం.
- source_word: הַבַּיִת
  choice: ఆ ఇంటిని
  rationale: בית ఇక్కడ నివాస భావం కంటే పరిశీలనకు లోనైన భౌతిక కట్టడాన్ని సూచిస్తుంది; అందువల్ల ‘ఇల్లు’ సరైన సాధారణ పదం.
- source_word: אֲבָנָיו
  choice: దాని రాళ్లను
  rationale: మూలంలోని బహువచన రూపాన్ని, ఇంటి నిర్మాణంలోని స్పష్టమైన పదార్థాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: עֵצָיו
  choice: దాని కలప భాగాలను
  rationale: పదశః ‘దాని కలప’ అయినా, కూల్చే ఇంటి నిర్మాణ సందర్భంలో దూలాలు, కడ్డీలు మొదలైన కలప నిర్మాణ భాగాలన్నిటినీ సహజంగా సూచిస్తుంది.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: ఇంటి సున్నపు పూతనంతటినీ[a]
  rationale: עפר పదశః ‘దుమ్ము/మట్టి.’ అయితే ముందటి వచనాల్లో గోడలను గోకించి తీసిన పదార్థం ప్రస్తావించబడినందున ఇక్కడ గోడపూతను సూచించే అవకాశం ఎక్కువ. ఆధునిక పాఠకునికి స్పష్టంగా ఉండేందుకు ‘సున్నపు పూత’ను వాడి, మూలంలోని విస్తృతమైన లేదా పదశః అర్థాలను పాదసూచికలో నిలిపాం.
- source_word: וְהוֹצִיא
  choice: వాటిని … తీసుకెళ్లాలి
  rationale: దీని ప్రాథమిక భావం ‘బయటికి తీసుకుపోవడం.’ కూల్చిన పదార్థాల సమాహారాన్ని సూచిస్తున్నందున ‘వాటిని తీసుకెళ్లాలి’ సహజమైన తెలుగు.
- source_word: אֶל מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల ఉన్న
  rationale: నివాస ప్రాంతపు సరిహద్దులకు అవతలికి తీసుకెళ్లాలనే దిశా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל מָקוֹם טָמֵא
  choice: అపవిత్రమైన చోటికి
  rationale: טמא లేవీయకాండంలోని ఆచారపరమైన పవిత్రత–అపవిత్రత పదజాలానికి చెందినది. ‘అపవిత్రమైన’ ఆ ప్రత్యేక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రత పదజాలం
  choice: అపవిత్రమైన
  alternative: అశుద్ధమైన
  rationale: లేవీయకాండంలో טמא సాధారణ మురికిని కాక ఆచారపరమైన స్థితిని సూచిస్తుంది. ‘అపవిత్రమైన’ అనే పదం ఆ భావాన్ని స్పష్టంగా నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయవిధి శైలిని వాడాం. మూలంలోని చర్యల క్రమాన్ని, నిర్మాణ పదార్థాల జాబితాను, ఆచారపరమైన ‘అపవిత్రత’ భావాన్ని నిలిపాం; עפר లోని నిజమైన పదార్థార్థ సందిగ్ధతను పాదసూచికలో ఇచ్చాం.
