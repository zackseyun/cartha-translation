  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు తిరిగి వచ్చి పరిశీలించాలి. ఇంటి గోడలలో ఆ మచ్చ వ్యాపించి ఉన్నట్లు కనిపిస్తే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: తిరిగి వచ్చి
  rationale: యాజకుడు ఏడవ రోజున మళ్లీ ఇంటికి రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: ఇక్కడ కేవలం చూడటం కాక, ఇంటి స్థితిని అధికారికంగా తనిఖీ చేయడం ఉద్దేశం; అందువల్ల సందర్భానుకూలంగా 'పరిశీలించాలి' అని ఇచ్చాం.
- source_word: הַנֶּגַע
  choice: ఆ తెగులు
  rationale: లేవీయకాండం 14లో ఇంటిని ప్రభావితం చేసే అసాధారణ మచ్చ లేదా వ్యాధిసదృశ దెబ్బను సూచించే విస్తృత పదం. నిర్దిష్ట ఆధునిక వ్యాధి పేరును రుద్దకుండా 'తెగులు' అని అనువదించాం.
- source_word: פָשָׂה
  choice: వ్యాపించి ఉంటే
  rationale: ఆ ప్రభావం గోడల మీద విస్తరించిందనే భావాన్ని తెలియజేస్తుంది; హీబ్రూ నిర్మాణంలోని పరిశీలన అనంతర పరిస్థితిని తెలుగులో సహజమైన షరతు వాక్యంగా ఉంచుతుంది.
- source_word: בְּקִירֹת הַבָּיִת
  choice: ఇంటి గోడల మీద
  rationale: స్థలసూచక భావాన్ని సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְהִנֵּה యొక్క అనువాదం
  choice: ప్రత్యేకంగా అనువదించకుండా పరిశీలనలో కనిపించిన పరిస్థితిని 'వ్యాపించి ఉంటే' అనే నిర్మాణంలో వ్యక్తం చేశాం
  alternative: '''ఇదిగో'' లేదా ''చూడగా'' అని స్పష్టంగా చేర్చడం'
  rationale: ఇక్కడ וְהִנֵּה కథనంలోని గమనింపును ముందుకు తెస్తుంది. తెలుగులో 'ఇదిగో' అనడం కృత్రిమంగా ఉండవచ్చు; షరతు నిర్మాణం మూలంలోని ఉద్దేశాన్ని సహజంగా అందిస్తుంది, అయితే నిర్ధారణను ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారపరమైన తనిఖీ సందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. తరువాతి వచనంతో కొనసాగుతున్న షరతు వాక్యం కావడంతో చివర కామా ఉంచబడింది.
