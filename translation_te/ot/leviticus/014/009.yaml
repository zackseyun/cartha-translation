source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: te
  text: 'ఏడవ రోజున అతడు తన వెంట్రుకలన్నిటినీ గీయాలి: తన తల వెంట్రుకలను, గడ్డాన్ని, కనుబొమలను. అతడు తన వెంట్రుకలన్నిటినీ గీయాలి; తన బట్టలు ఉతుక్కొని, తన శరీరాన్ని నీటితో కడుక్కోవాలి; అప్పుడు అతడు శుద్ధుడవుతాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: ఆచార క్రమంలో తదుపరి దశను సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో కాలార్థంతో అందిస్తుంది.
- source_word: יְגַלַּח
  choice: గీయించుకోవాలి
  rationale: పియేల్ రూపం వెంట్రుకలను పూర్తిగా తొలగించడాన్ని సూచిస్తుంది; తెలుగులో ఈ సందర్భానికి ‘గీయించుకోవాలి’ సహజంగా ఉంటుంది.
- source_word: כָּל שְׂעָרוֹ
  choice: తన ఒంటిమీద ఉన్న వెంట్రుకలన్నిటినీ
  rationale: తల, గడ్డం, కనుబొమల జాబితాను మించి శరీరంలోని వెంట్రుకలన్నీ ఉద్దేశించబడ్డాయనే సమగ్రతను స్పష్టం చేస్తుంది.
- source_word: רֹאשׁוֹ
  choice: తన తల వెంట్రుకలను
  rationale: మూలంలో అక్షరార్థంగా ‘తన తలను’ ఉన్నా, గీయవలసింది తల వెంట్రుకలే కాబట్టి తెలుగులో సహజంగా స్పష్టం చేయబడింది.
- source_word: זְקָנוֹ
  choice: గడ్డాన్ని
  rationale: זָקָן అనే పదానికి ఈ సందర్భంలో సాధారణ అర్థం ‘గడ్డం’.
- source_word: גַּבֹּת עֵינָיו
  choice: కనుబొమలను
  rationale: ‘కళ్ల పైభాగాలు/వంపులు’ అనే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: తన వెంట్రుకలన్నిటినీ గీయించుకొని
  rationale: ప్రత్యేక భాగాల జాబితా తర్వాత మూలంలో ఉన్న సంపూర్ణతను నొక్కిచెప్పే పునరుక్తిని నిలుపుతుంది.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: వస్త్రాలను కడగడాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి
  rationale: בָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినప్పటికీ, ఇక్కడ వ్యక్తి శరీరాన్ని సూచించే హీబ్రూ ప్రయోగం; ‘శరీరం’ తెలుగులో సహజంగా అర్థాన్ని కాపాడుతుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అతడు శుద్ధుడవుతాడు
  rationale: చర్యల అనంతరం కలిగే ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది; ‘అప్పుడు’ క్రమఫలితాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధత పదజాలం
  choice: శుద్ధుడవుతాడు
  alternative: పవిత్రుడవుతాడు; శుద్ధి చేయబడతాడు
  rationale: טהר ఇక్కడ నైతిక నిర్దోషిత్వం లేదా పవిత్రీకరణ కంటే లేవీయ ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది. ‘శుద్ధుడవుతాడు’ ఆ స్థితిని తెలియజేస్తూ ఇతర సిద్ధాంతార్థాలను రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని జాబితా మరియు దాని తర్వాతి సంపూర్ణతను నొక్కిచెప్పే పునరుక్తి రెండూ నిలుపబడ్డాయి. మూలభాషలో లేని పాదసూచికను జోడించలేదు; అందించిన ఆంగ్ల పాఠంలోని [a] గుర్తు దాని పాదసూచిక విషయంతో సరిపోలకపోవడం వల్ల అనుసరించలేదు.
