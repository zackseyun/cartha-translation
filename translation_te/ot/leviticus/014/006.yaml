source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: te
  text: సజీవమైన పక్షిని దేవదారు చెక్కతో, ఎర్రని నూలుతో, హిస్సోపు మొక్కతో పాటు తీసుకోవాలి. వాటినీ సజీవమైన పక్షినీ ప్రవహించే నీటి[a] మీద వధించిన పక్షి రక్తంలో ముంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “జీవజలం”; “తాజా నీరు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: సజీవమైన పక్షి
  rationale: వధించిన పక్షికి విరుద్ధంగా ఇంకా జీవించి ఉన్న పక్షిని సూచిస్తుంది; ‘సజీవమైన’ అనే పదం ఆ ఆచార సంబంధ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִקַּח
  choice: తీసుకోవాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియ ఆచార నియమాన్ని నిర్దేశిస్తోంది; ఆధునిక తెలుగులో ‘తీసుకోవాలి’ సహజంగా ఆ విధిని తెలియజేస్తుంది.
- source_word: עֵץ הָאֶרֶז
  choice: దేవదారు చెక్క
  rationale: ఆచారంలో ఉపయోగించే దేవదారు కలప ముక్కను సూచించే సహజమైన తెలుగు రూపం.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: ఎర్రని నూలు
  rationale: కీటక మూలమైన గాఢ ఎరుపు రంగుతో రంగించిన దారపు పదార్థాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి ‘ఎర్రని నూలు’ స్పష్టంగా ఉంటుంది.
- source_word: הָאֵזֹב
  choice: హిస్సోపు మొక్క
  rationale: మొక్క యొక్క ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు వివాదాస్పదమైనందున సంప్రదాయ పారదర్శక నామమైన ‘హిస్సోపు’ను ఉంచి, అది మొక్క అని స్పష్టం చేయబడింది.
- source_word: וְטָבַל
  choice: ముంచాలి
  rationale: ద్రవంలో ముంచే ఆచార చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה
  choice: వాటినీ సజీవమైన పక్షినీ
  rationale: ‘వాటిని’ అన్న బహువచన సర్వనామం ఇప్పుడే పేర్కొన్న ఆచార వస్తువులను సూచిస్తుంది; పక్షి అదనపు ప్రత్యక్ష కర్మగా మళ్లీ స్పష్టంగా పేర్కొనబడింది.
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: వధించిన పక్షి
  rationale: שׁחט సాధారణంగా ఆచారపూర్వకంగా గొంతుకోసి చంపడాన్ని సూచిస్తుంది; ‘వధించిన’ ఆ భావాన్ని ‘చంపిన’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: ప్రవహించే నీటి మీద
  rationale: అక్షరార్థంగా ‘జీవజలం’ అయిన ఈ పదబంధం సందర్భంలో నిలకడగా లేని తాజా లేదా ప్రవహించే నీటిని సూచిస్తుంది; ప్రధాన పాఠంలో అర్థాన్ని సహజంగా అందిస్తూ అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ఆచార శుద్ధి సందర్భంలో מַיִם חַיִּים అనువాదం
  choice: ప్రవహించే నీరు
  alternative: జీవజలం; తాజా నీరు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘జీవజలం’; ఇక్కడ అది సహజంగా ప్రవహించే లేదా తాజాగా తీసిన నీటిని సూచిస్తుంది. తరువాతి కాలపు ప్రత్యేక ధార్మిక భావాన్ని ఈ వచనంలోకి చొప్పించకుండా సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూలరూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నియమాత్మక శైలి ఉపయోగించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, చర్యల క్రమం మరియు సంబంధాలు యథాతథంగా ఉంచబడ్డాయి.
