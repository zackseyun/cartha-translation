id: LEV.14.24
reference: Leviticus 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడు అపరాధ పరిహార బలి గొర్రెపిల్లను[a], ఆ లోగు నూనెను[b] తీసుకొని, వాటిని యాహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అపరాధ బలికి అర్పించే గొర్రెపిల్లను’; సంప్రదాయంగా, ‘అపరాధ బలి గొర్రెపిల్లను.’
    reason: lexical_alternative
  - marker: b
    text: ‘లోగు’ అనేది ఇశ్రాయేలీయుల ఆచారవ్యవస్థలో ఉపయోగించిన చిన్న ద్రవ కొలత.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: అప్పుడు ... తీసుకొని
  rationale: వావ్‌తో కూడిన క్రియ ఆచారక్రమంలోని తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా, బలుల సందర్భంలో כֹּהֵןకు ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: అపరాధ పరిహార బలి గొర్రెపిల్లను
  rationale: אָשָׁםను ప్రత్యేక బలి వర్గంగా నిలుపుతూ, దోషం వల్ల ఏర్పడిన బాధ్యతకు పరిహారం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹג הַשָּׁמֶן
  choice: ఒక లోగు నూనెను
  rationale: לֹג నిర్దిష్టమైన చిన్న ద్రవ కొలత; సాధారణ ‘కొలత’ అని మార్చకుండా సాంకేతిక పదాన్ని లిప్యంతరీకరించి నిలిపాము.
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: కదిలించే అర్పణగా కదిలించాలి
  rationale: נוּף క్రియను, దాని సహజాత నామవాచకమైన תְּנוּפָהను రెండింటినీ ప్రతిబింబిస్తూ, ఆచారపరమైన కదిలింపు/సమర్పణను తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: గొర్రెపిల్లను, నూనె కొలతను కలిపి సూచించే హీబ్రూ బహువచన సర్వనామాన్ని స్పష్టంగా నిలిపింది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఆచారపరంగా దేవుని సమక్షంలో సమర్పించడాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, దైవనామాన్ని పేరుగానే అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన పేరురూపంలో నిలిపాము.
- issue: אָשָׁם అనే బలి వర్గం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి; దోష బలి
  rationale: ఇది సాధారణ పాపభావన మాత్రమే కాక, అపరాధం వల్ల కలిగిన బాధ్యత/పరిహారంతో సంబంధమున్న ప్రత్యేక బలి వర్గమని స్పష్టపరుస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆచార-న్యాయ శైలి. సాంకేతిక బలి పదజాలాన్ని స్పష్టంగా ఉంచి, తెలియని కొలతకు పాదటిప్పణి ఇచ్చాం. హీబ్రూలో యాజకుడు రెండుసార్లు ప్రస్తావించబడినా, సహజ తెలుగు వాక్యనిర్మాణంలో ఒకే కర్తతో రెండు చర్యలను అనుసంధానించాం.
