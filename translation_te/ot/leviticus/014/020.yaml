  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: te
  text: అప్పుడు యాజకుడు దహనబలిని, ధాన్యార్పణను బలిపీఠం మీద అర్పించాలి. యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతడు శుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: అర్పించాలి
  rationale: עלה హిఫీల్ రూపం బలి సందర్భంలో కేవలం తీసుకురావడం కాక, బలిపీఠం మీద అర్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు ధార్మిక శైలిలో ‘అర్పించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עלה అనే బలిసంబంధ నామపదానికి స్థిరమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం ‘దహనబలి’.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండపు బలి నియమాల సందర్భంలో מִנְחָה సాధారణ కానుకను కాక ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశను సూచించే ה స్థానార్థక ప్రయోగం ఇక్కడ బలిపీఠంపై బలిని అర్పించడాన్ని సూచిస్తుంది.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలో כפרకు ‘ప్రాయశ్చిత్తం చేయడం’ సరైన సమానం; עָלָיו ఇక్కడ ఆ వ్యక్తి పక్షంగా లేదా అతని కోసం జరిగే చర్యను సూచిస్తుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అతడు శుద్ధుడవుతాడు
  rationale: Qal రూపం కర్మకాండ ఫలితంగా ఏర్పడే శుద్ధస్థితిని తెలియజేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘శుద్ధుడవుతాడు’ ఆ ఫలితస్థితిని తెలియజేస్తుంది; నైతిక పరివర్తనను అదనంగా చేర్చదు.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో శుద్ధత స్వభావం
  choice: కర్మకాండ సంబంధమైన శుద్ధస్థితిని సూచించే ‘శుద్ధుడు’
  alternative: నైతిక పవిత్రత లేదా అంతరంగ పరిశుద్ధత
  rationale: లేవీయకాండం 14 సందర్భం చర్మవ్యాధి మూలంగా కలిగిన అపవిత్ర స్థితి అనంతరం సమాజ, ఆరాధన జీవితంలో పునఃప్రవేశానికి సంబంధించినది. కాబట్టి మూలపాఠంలోని సాధారణ శుద్ధత పదాన్ని ఉంచి, నైతిక మార్పు అనే భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండపు నియమ శైలికి తగిన గౌరవప్రదమైన భాష వాడబడింది. మూలంలోని వరుస waw నిర్మాణాలను తెలుగులో సహజంగా ‘అప్పుడు’ అనే ఫలిత సంబంధంతో వ్యక్తం చేశాం. వివరణ అవసరం లేనందున పాదసూచిక చేర్చలేదు.
