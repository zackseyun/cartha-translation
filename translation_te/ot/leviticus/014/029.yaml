  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: te
  text: యాజకుని అరచేతిలో ఉన్న నూనెలో మిగిలినదాన్ని[a] అతడు శుద్ధి పొందుతున్న వ్యక్తి తలపై ఉంచి, యెహోవా సన్నిధిలో ఆ వ్యక్తి కొరకు ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాజకుని అరచేతిపై ఉన్న మిగిలిన నూనెను.”
    reason: హీబ్రూలో ‘యాజకుని అరచేతిపై’ అని అక్షరార్థంగా ఉన్నప్పటికీ, అరచేతిలో ధరించిన ద్రవానికి తెలుగులో ‘అరచేతిలో’ సహజం. ప్రత్యామ్నాయం మూలంలోని ఉపరితల-సంబంధ భాషను చూపుతుంది.
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: నూనెలో మిగిలినదాన్ని
  rationale: נוֹתָר అనేది మిగిలి ఉన్న భాగాన్ని సూచిస్తుంది; מִן ఇక్కడ భాగార్థాన్ని తెలియజేస్తుంది. ఈ తెలుగు రూపం మూలంలోని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: యాజకుని అరచేతిలో ఉన్న
  rationale: כַּף చేతి అరను సూచిస్తుంది. עַל అక్షరార్థంగా ‘మీద’ అయినా, చేతిలో ఉంచిన ద్రవాన్ని తెలుగులో ‘అరచేతిలో’ అనడం సహజం.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: తలపై వేసి
  rationale: נתן విస్తృతంగా ‘ఇవ్వు, ఉంచు, వేయు’ అనే అర్థాలు కలిగి ఉంది. నూనెను తలపై వర్తింపజేసే ఈ సందర్భంలో ‘వేయి’ సహజంగా ఉండి, చర్య విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: Hitpael participle శుద్ధీకరణ ఆచారంలో ఉన్న వ్యక్తిని సూచిస్తుంది. ప్రక్రియ కొనసాగుతున్న భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: לְכַפֵּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר బలులు, శుద్ధీకరణ ఆచారాలకు సంబంధించిన ప్రధాన పదం. עליו ప్రాయశ్చిత్తం ఎవరి నిమిత్తమో సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי దేవుని సమక్షాన్ని సూచిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది; అందువల్ల దానిని పేరుగా నిలుపుతూ తెలుగులో ప్రాచుర్యం పొందిన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: כפר అనే ఆచార సంబంధ పదం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి
  rationale: ఈ శుద్ధీకరణ ఆచార సందర్భంలో כפר యొక్క బలి సంబంధమైన ధార్మిక బరువును ‘ప్రాయశ్చిత్తం’ స్పష్టంగా నిలుపుతుంది; అది ఎలా కార్యసాధకం అవుతుందో వచనానికి మించి వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శుద్ధి పొందుతున్న వ్యక్తి’ ప్రక్రియ భావాన్ని, ‘ప్రాయశ్చిత్తం’ మూలంలోని ఆచార-ధార్మిక పదబరువును నిలుపుతాయి.
