translation:
  language: te
  text: చర్మవ్యాధి యొక్క ప్రతి మచ్చకూ, తలలోగాని గడ్డంలోగాని వచ్చే ప్రత్యేక చర్మవ్యాధికీ[a] సంబంధించిన నియమం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొలుసులతో కూడిన చర్మవ్యాధి.’ ఈ హెబ్రీ పదం ముఖ్యంగా తలలో లేదా గడ్డంలో వచ్చే ఒక ప్రత్యేక చర్మస్థితిని సూచిస్తుంది; దానికి సమానమైన ఖచ్చితమైన ఆధునిక వైద్యపదం ఏమిటో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: నియమం ఇదే
  rationale: ఇది ముందుగా వివరించిన నిర్ధారణ, శుద్ధీకరణ విధానాలను సంగ్రహించే న్యాయసూత్రం. ఆధునిక తెలుగులో ‘నియమం ఇదే’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: చర్మవ్యాధికి సంబంధించిన ప్రతి మచ్చకూ
  rationale: נֶגַע అనేది పరిశీలించాల్సిన మచ్చ లేదా వ్యాధి సూచనను తెలియజేస్తుంది. צָרַעַתను నేరుగా ‘కుష్ఠు’ అని అనువదిస్తే ఆధునిక హాన్సెన్ వ్యాధితో తప్పుగా సమానం చేసే ప్రమాదం ఉంది; అందువల్ల ఇక్కడ విస్తృతమైన ‘చర్మవ్యాధి’ వాడబడింది.
- source_word: וְלַנָּתֶק
  choice: తలలో లేదా గడ్డంలో వచ్చే ప్రత్యేక చర్మవ్యాధికీ
  rationale: נֶתֶק లేవీయకాండము 13లో తల లేదా గడ్డం ప్రాంతంలో కనిపించే ప్రత్యేక వ్యాధిస్థితిని సూచిస్తుంది. దాని ఖచ్చితమైన ఆధునిక వైద్య సమానం తెలియనందున సాధారణమైనప్పటికీ సందర్భానుకూలమైన పదబంధం ఎంచుకోబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర సంగ్రహవాక్యానికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘కుష్ఠు’ అనే సంప్రదాయ పదం కలిగించే వైద్యపరమైన అపార్థాన్ని నివారిస్తూ మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపింది.
