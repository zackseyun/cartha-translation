base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: te
  text: అప్పుడు యాజకుడు శుద్ధి పొందుతున్న వ్యక్తి కోసం రెండు సజీవమైన శుద్ధ పక్షులను, దేవదారు చెక్కను, స్కార్లెట్ రంగు నూలును[a], హిస్సోపును[b] తీసుకోవాలని ఆజ్ఞాపించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్కార్లెట్ రంగు దారం.’ שְׁנִי תוֹלַעַת అనే హీబ్రూ పదబంధం స్కార్లెట్ రంగు అద్దిన పదార్థాన్ని సూచిస్తుంది; ఆ పదార్థం ఖచ్చితంగా ఏ రూపంలో ఉన్నదో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ‘హిస్సోపు’ అని అనువదించిన మొక్క ఖచ్చితంగా ఏదో తెలియదు; సంప్రదాయ పేరును ఇక్కడ నిలిపాం.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: అప్పుడు యాజకుడు ... ఆజ్ఞాపించాలి
  rationale: కర్మకాండ సంబంధమైన వరుస ఆదేశాల్లో వావ్‌తో కూడిన క్రియ తదుపరి దశను సూచిస్తుంది. అందువల్ల ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది; ఆజ్ఞ ఇచ్చేది యాజకుడే అనే విషయాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְלָקַח
  choice: తీసుకురావాలని
  rationale: రూపరీత్యా ఇది తృతీయ పురుష ఏకవచన క్రియ అయినప్పటికీ, యాజకుడు ఆ వస్తువులను స్వయంగా తీసుకోవాలని కాక వాటిని సమకూర్చాలని ఆజ్ఞాపించే భావం సందర్భంలో ఉంది. తెలుగులో ‘తీసుకురావాలని ఆజ్ఞాపించాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి కోసం
  rationale: హిత్పయేల్ వర్తమాన కృదంతం కర్మకాండపరమైన శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘శుద్ధి పొందుతున్న’ అనే రూపం ఆ కొనసాగుతున్న ప్రక్రియను నిలుపుతుంది.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: పక్షులు రెండింటిని
  rationale: צִפּוֹר సాధారణంగా పక్షిని సూచిస్తుంది; ‘పిచ్చుకలు’ వంటి నిర్దిష్ట జాతిని మూలపాఠం చెప్పదు.
- source_word: חַיּוֹת טְהֹרוֹת
  choice: సజీవమైన శుద్ధ పక్షులు
  rationale: ఈ విశేషణాలు పక్షులు బతికివున్నవనీ, లేవీయ కర్మకాండ ప్రమాణాల ప్రకారం శుద్ధమైనవనీ తెలియజేస్తాయి. ‘శుద్ధ’ అనే పదం సందర్భానుసారంగా ఆచారపరమైన అర్థాన్ని మోస్తుంది.
- source_word: עֵץ אֶרֶז
  choice: దేవదారు చెక్క
  rationale: ఈ సంయుక్త పదబంధం కర్మకాండలో ఉపయోగించే దేవదారు కలపను సూచిస్తుంది; ‘దేవదారు చెక్క’ ఆధునిక తెలుగులో సహజమైన పదప్రయోగం.
- source_word: שְׁנִי תוֹלַעַת
  choice: ఎర్రని నూలు
  rationale: ఈ హీబ్రూ పదబంధం పురుగు మూలమైన రంగుతో అద్దిన ముదురు ఎరుపు పదార్థాన్ని సూచిస్తుంది. దాని ఖచ్చిత రూపం స్పష్టం కానప్పటికీ, ‘ఎర్రని నూలు’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: אֵזֹב
  choice: హిస్సోపు
  rationale: మొక్క యొక్క ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు అనిశ్చితమైనందున ఊహాత్మకమైన నిర్దిష్టీకరణకు బదులు సంప్రదాయ బైబిలు పేరైన ‘హిస్సోపు’ను నిలిపాం.
