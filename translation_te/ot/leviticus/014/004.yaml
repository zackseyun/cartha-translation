translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని కర్మకాండపరమైన ‘శుద్ధి’ భావాన్ని వివరణతో భారంగా చేయకుండా ప్రధాన పాఠ్యంలో నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు జాబితా పదాలకు పొరపాటుగా అమర్చబడినట్లు కనిపించినందున, వాటి అసలు విషయాలకు అనుగుణంగా [a]ను ‘ఎర్రని నూలు’ వద్ద, [b]ను ‘హిస్సోపు’ వద్ద ఉంచాం.
