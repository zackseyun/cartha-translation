id: LEV.14.12
reference: Leviticus 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: te
  text: తర్వాత యాజకుడు ఆ ఒక్క మగ గొర్రెపిల్లను తీసుకొని, దాన్ని అపరాధ పరిహార బలిగా[a], నూనె లోగుతో[b] పాటు సమర్పించాలి. వాటిని యాహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దోష బలిగా.’ ఇక్కడి హీబ్రూ పదం అపరాధానికి సంబంధించిన పరిహారం లేదా నష్టపరిహార భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘లోగు’ అనేది ఇశ్రాయేలు ఆచార వ్యవస్థలో వాడిన చిన్న ద్రవ కొలత.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత ... తీసుకొని
  rationale: కర్మకాండలో వరుసగా జరిగే తదుపరి చర్యను వావ్ సూచిస్తోంది; ‘తర్వాత’ ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా, బలుల సందర్భంలో כֹּהֵןకు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: ఆ ఒక్క మగ గొర్రెపిల్లను
  rationale: నిర్దేశక పదం మరియు ‘ఒకటి’ అనే సంఖ్య ఈ జంతువును ఇతర జంతువులనుంచి ప్రత్యేకంగా చూపిస్తాయి; כֶּבֶשׂ బలి సందర్భంలో మగ గొర్రెపిల్లను సూచిస్తుంది.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: దాన్ని ... సమర్పించాలి
  rationale: హిఫీల్ הקריב బలి కోసం దగ్గరకు తీసుకురావడం లేదా సమర్పించడాన్ని సూచిస్తుంది; బలి ప్రక్రియలో తరువాతి చర్యను అనవసరంగా ముందే నిర్దిష్టం చేయకుండా ‘సమర్పించాలి’ అర్థాన్ని అందిస్తుంది.
- source_word: לְאָשָׁם
  choice: అపరాధ పరిహార బలిగా
  rationale: אָשָׁם లేవీయకాండంలో అపరాధానికి సంబంధించిన పరిహారాత్మక బలికి సాంకేతిక పదం; తెలుగు పాఠకునికి దాని రెండు భావాంశాలూ స్పష్టమయ్యేలా ఈ పదబంధం వాడబడింది.
- source_word: לֹג הַשָּׁמֶן
  choice: నూనె లోగుతో
  rationale: לֹג ఇశ్రాయేలు ఆచార వ్యవస్థలోని నిర్దిష్ట ద్రవ కొలత. అంచనా ఆధునిక కొలతతో భర్తీ చేయకుండా సాంకేతిక పేరును లిప్యంతరీకరించి, పాదసూచికలో వివరించబడింది.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: వాటిని ... కదలిక అర్పణగా కదిలించాలి
  rationale: క్రియ הניף మరియు సంబంధిత నామవాచకం תְּנוּפָה రెండింటినీ నిలుపుతూ, ఆచారపరమైన కదిలింపు/ప్రదర్శన చర్యను తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లִפְנֵי ఆచార సందర్భంలో దేవుని సమక్షాన్ని సూచిస్తుంది; יְהוָה అనే ఒడంబడిక నామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: אָשָׁם అనే బలి పదంలోని అపరాధం మరియు పరిహారం భావాలు
  choice: అపరాధ పరిహార బలి
  alternative: దోష బలి
  rationale: మూలపదం అపరాధంతో పాటు దానికి సంబంధించిన నష్టపరిహారం లేదా పరిహార చర్య భావాన్ని కూడా కలిగి ఉండగలదు. ప్రధాన పాఠం రెండింటినీ సూచిస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా, ఉచ్చారణకు సాధారణంగా అంగీకరించబడిన రూపంలో లిప్యంతరీకరించడం మూలంలోని ఒడంబడిక నామాన్ని నిలుపుతుంది.
- issue: תְּנוּפָה ఆచార చర్య స్వరూపం
  choice: కదలిక అర్పణ
  alternative: ఊపే అర్పణ; ప్రదర్శన అర్పణ
  rationale: మూలపదం ఆచారపరంగా కదిలించడం లేదా దేవుని ఎదుట ప్రదర్శించడం అనే భావాన్ని కలిగి ఉంటుంది; కదలిక దిశను మూలం నిర్దిష్టం చేయనందున అనువాదం కూడా దానిని నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. బలి సంబంధ సాంకేతిక పదాలను సాధ్యమైనంత స్పష్టంగా ఉంచి, తెలియని కొలతను పాదసూచికలో వివరించాం. మూలంలోని కర్మకాండ క్రమం, బహువచన కర్మ (‘వాటిని’), దైవనామం, మరియు కదలిక చర్యలోని అనిర్దిష్టత నిలుపబడ్డాయి.
