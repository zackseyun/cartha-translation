id: LEV.14.21
reference: Leviticus 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם דַּ֣ל ה֗וּא וְ/אֵ֣ין יָד/וֹ֮ מַשֶּׂגֶת֒ וְ֠/לָקַח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִ/תְנוּפָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו וְ/עִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּ/שֶּׁ֛מֶן לְ/מִנְחָ֖ה וְ/לֹ֥ג שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: te
  text: “అయితే అతడు పేదవాడై, అతని స్థోమత సరిపోకపోతే[a], అతనికోసం ప్రాయశ్చిత్తం చేయడానికి ఊపి సమర్పించవలసిన అపరాధ పరిహారబలిగా ఒక మగ గొర్రెపిల్లను, ధాన్యార్పణగా నూనె కలిపిన ఏఫాలోని పదోవంతు సన్నని పిండిని, ఒక లోగు[b] నూనెను తీసుకోవాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, “అతని చెయ్యి అందకపోతే”; అంటే, అవసరమైన వాటిని సమకూర్చగల స్థోమత అతనికి లేకపోతే.
    reason: lexical_alternative
  - marker: b
    text: ‘లోగు’ అనేది ఇశ్రాయేలీయుల ఆచార నియమాలలో ఉపయోగించిన చిన్న ద్రవ కొలత.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: పేదవాడు
  rationale: ఆర్థికంగా తక్కువ స్థోమతగల వ్యక్తిని సూచించే ఈ పదానికి ఆధునిక తెలుగులో సహజమైన, నేరుగా అర్థమయ్యే సమానం.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: అతని స్థోమత సరిపోకపోతే
  rationale: ‘అతని చెయ్యి అందకపోతే’ అనే హీబ్రూ నుడికారానికి ఇక్కడ ఆర్థిక సామర్థ్యం చాలకపోవడం అనే భావం ఉంది; ప్రధాన పాఠంలో ఆ భావాన్ని సహజంగా తెలిపి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כֶּבֶשׂ אֶחָד
  choice: ఒక మగ గొర్రెపిల్ల
  rationale: כֶּבֶשׂ మగ గొర్రెపిల్లను సూచిస్తుంది; బలుల నియమంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: אָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: ఈ యాజక ధర్మశాస్త్ర సందర్భంలోని ప్రత్యేక బలి వర్గాన్ని, అపరాధం మరియు దాని పరిహారం రెండింటి భావాన్ని తెలియజేసేలా అనువదిస్తుంది.
- source_word: לִתְנוּפָה
  choice: ఊపి అర్పించాల్సిన
  rationale: ఇది మరో ప్రత్యేక బలిని కాక, ఆ మగ గొర్రెపిల్లను ఆచారపూర్వకంగా ఊపి సమర్పించడాన్ని సూచిస్తుంది.
- source_word: לְכַפֵּר עָלָיו
  choice: తన కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక బలి సందర్భంలోని כפר క్రియకు ఉన్న ఆచారపరమైన, ధార్మికమైన బలాన్ని నిలుపుతూ, ప్రాయశ్చిత్తం ఎలా సిద్ధాంతపరంగా పనిచేస్తుందో అదనంగా నిర్వచించదు.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: ఏఫాలో పదోవంతు మెత్తని పిండి
  rationale: עִשָּׂרוֹן బలి నియమాల్లో ఏఫాలో పదోవంతు కొలతను సూచిస్తుంది; ‘మెత్తని పిండి’ סֹלֶת యొక్క నాణ్యతను తెలియజేస్తుంది.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: పిండిని నూనెతో కలపడాన్ని సరళమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִנְחָה
  choice: ధాన్యార్పణగా
  rationale: లేవీయకాండంలోని ప్రత్యేక ధాన్య బలి వర్గాన్ని సంక్షిప్తంగా, స్పష్టంగా గుర్తిస్తుంది.
- source_word: לֹג שָׁמֶן
  choice: ఒక లోగు నూనె
  rationale: లోగు అనేది నిర్దిష్ట ప్రాచీన ద్రవ కొలత; అనిశ్చితమైన ఆధునిక పరిమాణంతో భర్తీ చేయకుండా సాంకేతిక పదాన్ని నిలిపాం.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలోని బలి పదజాలం
  choice: ‘అపరాధ పరిహార బలి,’ ‘ఊపి అర్పించాల్సిన,’ ‘ప్రాయశ్చిత్తం చేయడానికి,’ ‘ధాన్యార్పణ’ అనే ప్రత్యేక ఆచార పదాలను నిలుపడం
  alternative: సాధారణంగా ‘అర్పణ,’ ‘సమర్పించడం,’ లేదా వివరణాత్మకమైన విస్తృత పదాలను ఉపయోగించడం
  rationale: మూలంలోని వేర్వేరు బలి వర్గాలు, ఆచార చర్యలు స్పష్టంగా ఉండాలి. అదే సమయంలో ‘ప్రాయశ్చిత్తం’ యొక్క కార్యవిధానంపై ఏదైనా ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయ-ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో అమర్చినా, బలి సామగ్రి జాబితా మరియు దాని సంబంధాలు యథాతథంగా ఉంచబడ్డాయి. పాదసూచిక [b]ను అది వివరించే ‘లోగు’ పదానికే జోడించాం.
