id: LEV.14.7
reference: Leviticus 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: te
  text: చర్మవ్యాధి నుండి శుద్ధి పొందుతున్న వ్యక్తి మీద అతడు దానిని ఏడుసార్లు చిలకరించి, ఆ వ్యక్తిని శుద్ధుడిగా ప్రకటించాలి[a]. తరువాత సజీవ పక్షిని బయలులోకి విడిచిపెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ వ్యక్తిని శుద్ధి చేయాలి.’ ఇక్కడ యాజకుని చర్య ఆచారపరంగాను, న్యాయపరంగాను ఆ వ్యక్తి శుద్ధుడని నిర్ధారించడం లేదా ప్రకటించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: అతడు దానిని ... చిలకరించి
  rationale: హిఫీల్ రూపంలోని נזה ఆచార సందర్భంలో ద్రవాన్ని చిలకరించడాన్ని సూచిస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, ముందటి వచనంలోని ఆచార మిశ్రమాన్ని సూచిస్తూ సహజమైన తెలుగుకోసం ‘దానిని’ చేర్చబడింది.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: טהר హిత్పయేల్ కృదంతం శుద్ధీకరణ ప్రక్రియకు లోనవుతున్న వ్యక్తిని సూచిస్తుంది; ప్రక్రియాత్మక భావాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: מִן הַצָּרַעַת
  choice: చర్మవ్యాధి నుండి
  rationale: צָרַעַת ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం కాదు; లేవీయకాండంలో ఇది విస్తృతమైన చర్మ సంబంధిత స్థితులను సూచించగలదు. అందువల్ల ‘చర్మవ్యాధి’ అనవసరమైన వైద్య నిర్దిష్టతను నివారిస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యను క్రియావిశేషణంగా తెలిపే పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: וְטִהֲרוֹ
  choice: ఆ వ్యక్తిని శుద్ధుడిగా ప్రకటించాలి
  rationale: యాజక ఆచార-న్యాయ సందర్భంలో ఇది కేవలం శారీరకంగా శుభ్రపరచడం కాక, శుద్ధస్థితిని అధికారికంగా నిర్ధారించడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది.
- source_word: וְשִׁלַּח
  choice: విడిచిపెట్టాలి
  rationale: שׁלח పంపడం లేదా విడుదల చేయడం అని అర్థం; సజీవ పక్షిని ఆచారంలో స్వేచ్ఛగా విడిచే చర్యను ‘విడిచిపెట్టాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: సజీవంగా ఉన్న పక్షి
  rationale: ముందు వధించబడిన పక్షికి భిన్నంగా, ఇంకా జీవించి ఉన్న పక్షిని ఈ విశేషణం గుర్తిస్తుంది.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: పొలాల వైపుగా
  rationale: עַל־פְּנֵי הַשָּׂדֶה బహిరంగ మైదానం లేదా పొలాల మీదికి/వైపుకు విడుదల చేయడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘పొలాల వైపుగా’ సహజంగా గమనదిశను వ్యక్తపరుస్తూ మూలంలోని స్థలభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: צָרַעַת పదానికి అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠరోగం
  rationale: లేవీయకాండంలోని צָרַעַת ఆధునిక కుష్ఠరోగం లేదా హాన్సెన్ వ్యాధికంటే విస్తృతమైన ఆచార అపవిత్రత వర్గాన్ని సూచిస్తుంది. ‘చర్మవ్యాధి’ కాలవిరుద్ధమైన వైద్య నిర్ధారణను రుద్దకుండా ఉంటుంది.
- issue: וְטִהֲרוֹ లోని యాజక చర్య
  choice: శుద్ధుడిగా ప్రకటించాలి
  alternative: శుద్ధి చేయాలి
  rationale: ఈ సందర్భంలో యాజకుని చర్య ఆచార-న్యాయపరమైన నిర్ధారణను కలిగి ఉంది. అయితే మూల క్రియలో శుద్ధి చేయడం అనే కార్యసాధక ఛాయ కూడా ఉండగలదు; ప్రధాన పాఠంలో ప్రకటన భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కుష్ఠరోగం’ అనే సంప్రదాయ పదం కలిగించే తప్పుదారి పట్టించే ఆధునిక వైద్య నిర్దిష్టతను నివారించాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
