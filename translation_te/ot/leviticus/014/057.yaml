  yaml_path: translation/ot/leviticus/014/057.yaml
  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: te
  text: ఎప్పుడు అపవిత్రమో, ఎప్పుడు శుద్ధమో బోధించడానికి. అపవిత్రత కలిగించే స్థితి[a] గురించిన ధర్మశాస్త్రం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా ‘కుష్ఠరోగం’ అని అనువదించారు. అయితే ఈ హెబ్రీ పదం మనుషులకు మాత్రమే కాక వస్త్రాలకు, ఇళ్లకు సంబంధించిన అపవిత్రత కలిగించే పరిస్థితులను కూడా సూచించగలదు; ఇది ఆధునిక హాన్సెన్స్ వ్యాధికే పరిమితం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: బోధించడానికి
  rationale: హిఫీల్ రూపం అధికారపూర్వకంగా వివేచించి తెలియజేయడం లేదా బోధించడం అనే భావాన్ని ఇస్తుంది; ఈ వచనం ముందున్న నియమాల ఉద్దేశాన్ని ముగింపుగా చెబుతోంది.
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: ఏది అపవిత్రమో, ఏది పవిత్రమో ఎప్పుడు నిర్ధారించాలో
  rationale: בְּיוֹם అనే కాలసూచక ప్రయోగాన్ని అక్షరార్థంగా ‘రోజున’ అని కాకుండా, అపవిత్ర లేదా పవిత్ర స్థితి ఎప్పుడు వర్తిస్తుందో అనే ఆచరణాత్మక భావంలో సహజమైన తెలుగులో అందించింది.
- source_word: תּוֹרַת
  choice: ధర్మశాస్త్రం
  rationale: లేవీయకాండంలోని నియమబద్ధమైన దైవోపదేశాన్ని సూచించే תּוֹרָהకు గౌరవప్రదమైన, పరిచితమైన తెలుగు పదం; ఇక్కడ ‘గురించిన’తో నిర్మాణ సంబంధం స్పష్టమవుతుంది.
- source_word: הַצָּרָעַת
  choice: అపవిత్రత కలిగించే తెగులు
  rationale: ఈ హెబ్రీ పదం మనుషుల శరీరానికే కాక వస్త్రాలకు, ఇళ్లకు కూడా వర్తించే విస్తృత ఆచారపరమైన వర్గం. ‘తెగులు’ ఆ విస్తృతిని ఉంచగా, ‘అపవిత్రత కలిగించే’ దాని లేవీయకాండ సంబంధిత ప్రభావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: צָרַעַת అనే ఆచారపరమైన వర్గాన్ని అనువదించడం
  choice: అపవిత్రత కలిగించే తెగులు
  alternative: కుష్ఠరోగం
  rationale: దీనిని ఆధునిక హాన్సెన్స్ వ్యాధితో సమానం చేయకుండా, మనుషులు, వస్త్రాలు, ఇళ్లు అన్నిటికీ వర్తించే మూలపాఠ విస్తృతిని కాపాడింది. సంప్రదాయ అనువాదాన్ని పాదసూచికలో మాత్రమే పేర్కొంది.
- issue: טָמֵא మరియు טָהוֹר మధ్య వ్యత్యాసం
  choice: అపవిత్రం / పవిత్రం
  alternative: అశుద్ధం / శుద్ధం
  rationale: ఇక్కడి పదాలు సాధారణ పరిశుభ్రతకన్నా ఆచారపరమైన స్థితిని సూచిస్తాయి. ‘అపవిత్రం/పవిత్రం’ ఆ ధార్మిక-ఆచారపరమైన ఉద్రిక్తతను నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-బోధనా శైలి. ‘రోజు’ అనే అతి అక్షరార్థ అనువాదాన్ని నివారించి కాలసంబంధ ప్రయోగాన్ని సందర్భానుసారంగా తెలిపింది; కీలకమైన ఆచారపరమైన భేదాన్ని మాత్రం నిలిపింది.
