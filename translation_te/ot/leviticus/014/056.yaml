  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన న్యాయ-జాబితా శైలి. మూలంలోని మూడు చర్మలక్షణాల మధ్య భేదాన్ని నిలిపి, అనిశ్చిత వైద్య పదార్థాలను పాదసూచికల్లో సూచించాం.
