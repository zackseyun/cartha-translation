  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: te
  text: వాపు[a] గురించి, చర్మపు పొక్కు[b] గురించి, మెరిసే మచ్చ[c] గురించి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చర్మంపై పైకి లేచిన భాగం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దద్దురు’ లేదా ‘పొలుసు’; סַפַּחַת అనే పదం సూచించే ఖచ్చితమైన చర్మస్థితి అనిశ్చితం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ప్రకాశవంతమైన మచ్చ’; ఈ సందర్భంలో ‘తెల్లని మచ్చ’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: వాపు
  rationale: లేవీయకాండము 13–14 అధ్యాయాల సందర్భంలో ఇది చర్మంపై పైకి లేచిన వాపు లేదా ఉబ్బిన భాగాన్ని సూచిస్తుంది. ‘వాపు’ సంక్షిప్తంగా, సహజంగా ఉండి, నిర్దిష్ట వ్యాధిని అనవసరంగా నిర్ణయించదు.
- source_word: סַפַּחַת
  choice: చర్మపు పొక్కు
  rationale: ఈ పదం చర్మంపై ఏర్పడే పొక్కు, దద్దురు లేదా పొలుసులాంటి ద్వితీయ చర్మస్థితిని సూచించవచ్చు. ఖచ్చితమైన చర్మవైద్య భావం అనిశ్చితంగా ఉన్నందున సాధారణులకు అర్థమయ్యే ‘చర్మపు పొక్కు’ను ఎంచుకుని ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: בֶּהֶרֶת
  choice: మెరిసే మచ్చ
  rationale: ఈ నామవాచకం చర్మంపై ప్రకాశంగా లేదా తెల్లగా కనిపించే మచ్చను సూచిస్తుంది. మూలపదం ప్రధానంగా ప్రకాశాన్ని తెలియజేస్తుంది కాబట్టి రంగును అతిగా నిర్దిష్టం చేయకుండా ‘మెరిసే మచ్చ’గా అనువదించాం.
- source_word: וְ/לַ
  choice: గురించి
  rationale: పునరావృతమయ్యే సంయోజక అవ్యయం-ఉపసర్గ ముందున్న నియమాల సంగ్రహంలోని చివరి అంశాలను పరిచయం చేస్తుంది. తెలుగులో జాబితా ధోరణిని సహజంగా నిలుపడానికి ప్రతి అంశంతో ‘గురించి’ వాడాం.
