  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: te
  text: తర్వాత అతడు బతికివున్న పక్షిని పట్టణం వెలుపల బయటి పొలంలోకి విడిచిపెట్టాలి. ఈ విధంగా అతడు ఆ ఇంటి నిమిత్తం ప్రాయశ్చిత్తం చేయాలి[a]; అప్పుడు అది శుద్ధమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు ఆ ఇంటిని శుద్ధిపరచాలి,’ లేదా, ‘అతడు ఆ ఇంటి నిమిత్తం పరిహార కర్మ చేయాలి.’ ఇక్కడ హీబ్రూలో ఆచార శుద్ధి సందర్భంలో యాజక ప్రాయశ్చిత్తానికి వాడే పదమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: తర్వాత అతడు ... విడిచిపెట్టాలి
  rationale: పియేల్ రూపం ఇక్కడ పక్షిని ఆచారబద్ధంగా స్వేచ్ఛగా వదలడాన్ని సూచిస్తుంది. క్రమాన్ని తెలిపే וְ ను సహజమైన తెలుగులో ‘తర్వాత’గా వ్యక్తం చేశాం.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: సజీవమైన పక్షిని
  rationale: ఇది ముందుగా చంపబడిన పక్షికి వ్యతిరేకంగా ఇంకా బతికివున్న పక్షిని స్పష్టంగా సూచిస్తుంది.
- source_word: אֶל מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల
  rationale: పట్టణ సరిహద్దులకు అవతలికి జరిగే గమనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: బహిరంగ పొలంలోకి
  rationale: అక్షరార్థంగా ‘పొలం ముఖానికి’ అనే హీబ్రూ నుడికారం బహిరంగ పొలప్రాంతంలోకి అనే భావాన్ని ఇస్తుంది.
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: ఆ ఇంటి నిమిత్తం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ఆచార భాషలోని כפר పదాన్ని దాని వేదాంతపరమైన ఉద్రిక్తతతో సహా నిలుపుతూ, కేవలం శుభ్రపరచడంగా పరిమితం చేయలేదు. עַל ను ఈ సందర్భంలో ‘నిమిత్తం’గా అందించాం.
- source_word: וְטָהֵר
  choice: అప్పుడు అది శుద్ధమవుతుంది
  rationale: క్రియ సూచించే ఫలిత స్థితిని తెలియజేస్తూ, ‘అది’ ఇంటినే సూచిస్తుందని స్పష్టం చేశాం. ‘శుద్ధమవుతుంది’ ఆచార శుద్ధి సందర్భానికి తగినది.
theological_decisions:
- issue: ఇంటికి సంబంధించి ఆచార శుద్ధి సందర్భంలో כפר పదం
  choice: ఇంటి నిమిత్తం ప్రాయశ్చిత్తం చేయాలి
  alternative: ఇంటిని శుద్ధిపరచాలి; ఇంటి నిమిత్తం పరిహారం చేయాలి
  rationale: ఒక ఇంటి విషయమై కూడా మూలపాఠం యాజక ప్రాయశ్చిత్త భాషనే వాడుతోంది. అందువల్ల దానిని సాధారణ శుభ్రపరచడంగా మార్చకుండా, అదే సమయంలో ఏదైనా తరువాతి నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని ఇందులోకి చొప్పించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, లేవీయకాండ ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిలోనూ ఉంచాం. ‘ప్రాయశ్చిత్తం’ అనే సాంకేతిక-ఆధ్యాత్మిక పదాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని భావపరిధిని పాదసూచికలో తెలిపాం.
