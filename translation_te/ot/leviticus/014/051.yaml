id: LEV.14.51
reference: Leviticus 14:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: te
  text: తర్వాత అతడు దేవదారు చెక్కను, హిస్సోపు మొక్కను, ఎర్రని నూలును[a], సజీవ పక్షిని తీసుకొని, వాటిని వధించబడిన పక్షి రక్తంలోను తాజా నీటిలోను[b] ముంచి, ఆ ఇంటిమీద ఏడుసార్లు చిలకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థం ‘పురుగు యొక్క ఎరుపు రంగు’; సాధారణంగా ఎరుపు రంగు వేసిన దారం లేదా నూలు అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘జీవ జలాలు’; అంటే తాజా లేదా ప్రవహించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత అతడు ... తీసుకొని
  rationale: ఆచార విధానాన్ని వరుసగా తెలిపే సందర్భంలో ఈ క్రియకు క్రమానుసారమైన ఆదేశ భావం ఉంది; తెలుగులో ‘తర్వాత ... తీసుకొని’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: עֵץ הָאֶרֶז
  choice: దేవదారు కట్టెను
  rationale: ఆచారంలో ఉపయోగించే దేవదారు చెక్క ముక్కను సూచిస్తుంది; ‘కట్టె’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: הָאֵזֹב
  choice: హిస్సోపు మొక్కను
  rationale: మొక్క పేరును లిప్యంతరీకరించి, అది ఒక మొక్క అని స్పష్టత కోసం ‘మొక్కను’ చేర్చాం.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: ఎర్రని దారాన్ని
  rationale: ఈ హీబ్రూ పదబంధం పురుగునుంచి పొందిన రంగుతో ఎర్రగా రంగు వేసిన దారం లేదా నూలును సూచిస్తుంది; సహజమైన తెలుగులో ‘ఎర్రని దారం’ సరిపోతుంది, అక్షరార్థం పాదసూచికలో ఉంది.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: సజీవంగా ఉన్న పక్షిని
  rationale: వధించబడిన మరొక పక్షికి భిన్నంగా ఇది బతికివున్న పక్షి అని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטָבַל אֹתָם
  choice: వాటిని ... ముంచి
  rationale: טבל అంటే ద్రవంలో ముంచడం; ఆచార సందర్భంలో ‘ముంచి’ సహజమైన, ఖచ్చితమైన పదం.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: వధించిన పక్షి రక్తంలో
  rationale: שׁחט ఆచార సంబంధమైన వధను సూచిస్తుంది; ‘చంపిన’ కంటే ‘వధించిన’ ఆ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: జీవజలంలోను
  rationale: హీబ్రూ అక్షరార్థమైన ‘జీవజలం’ను నిలుపుతూ, అది తాజా లేదా ప్రవహించే నీటిని సూచిస్తుందని పాదసూచికలో వివరిస్తుంది; మూలంలోని భావసంభావ్యతను ముందుగానే ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: ఆ ఇంటి మీద ... చిలకరించాలి
  rationale: נזה హిఫిల్ రూపం ఆచారపూర్వకంగా చిలకరించడాన్ని సూచిస్తుంది; אֶל యొక్క దిశాత్మక భావాన్ని ‘ఇంటి మీద’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యాత్మక క్రియావిశేషణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: ఆచార ధర్మశాస్త్రంలో מַיִם חַיִּים అనువాదం
  choice: జీవజలం
  alternative: తాజా నీరు; ప్రవహించే నీరు
  rationale: మూల హీబ్రూ పదబంధంలోని ‘జీవ’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆ సందర్భంలో దాని సాధారణ అర్థమైన తాజా లేదా ప్రవహించే నీటిని పాదసూచికలో తెలుపుతుంది. దీనివల్ల తరువాతి వేదాంత అన్వయాలను బలవంతంగా చొప్పించకుండా మూలంలోని భాషాత్మక ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆచార-ధర్మశాస్త్ర శైలి వాడబడింది. ప్రధాన వాక్యంలో వరుస చర్యలను సహజమైన సంయుక్త నిర్మాణంతో చూపించి, చివరలో ‘చిలకరించాలి’ ద్వారా ఆదేశ భావాన్ని వ్యక్తపరచాం.
