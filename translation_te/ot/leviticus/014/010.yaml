id: LEV.14.10
reference: Leviticus 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: te
  text: ఎనిమిదవ రోజున అతడు లోపంలేని రెండు మగ గొర్రెపిల్లలను, ఒక సంవత్సరం వయసున్న లోపంలేని ఒక ఆడ గొర్రెపిల్లను, ధాన్యార్పణగా నూనె కలిపిన సన్నని పిండి ఏఫాలో మూడు పదోవంతులను, ఒక లోగు[a] నూనెను తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోగు’ అనేది ఇశ్రాయేలీయుల ఆచారాల్లో ఉపయోగించిన చిన్న ద్రవ కొలత.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: కర్మకాండ సూచనల వరుసను సందర్భమే స్పష్టం చేస్తుంది; ఆధునిక తెలుగులో అనవసరమైన సంధానపదం లేకుండా సహజంగా ఉంది.
- source_word: יִקַּח
  choice: తీసుకోవాలి
  rationale: న్యాయపరమైన సూచనలోని విధ్యర్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שְׁנֵי כְבָשִׂים תְּמִימִים
  choice: లోపంలేని రెండు మగ గొర్రెపిల్లలను
  rationale: తరువాత వచ్చే ఆడ గొర్రెపిల్లతో ఉన్న లింగభేదాన్ని నిలుపుతూ, బలికి పనికిరాకుండా చేసే దోషం లేనివని స్పష్టం చేస్తుంది.
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ תְּמִימָה
  choice: ఒక సంవత్సరం వయసున్న లోపంలేని ఒక ఆడ గొర్రెపిల్లను
  rationale: జంతువు లింగం, వయస్సు, లోపరాహిత్యం అనే మూడు నిర్దేశాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: ఏఫాలో మూడు పదోవంతులను
  rationale: హీబ్రూ పదం సూచించే పదోవంతు కొలతను, సందర్భంలో అంతర్భూతమైన ఏఫా ప్రమాణంతో స్పష్టంగా తెలుపుతుంది.
- source_word: סֹלֶת מִנְחָה בְּלוּלָה בַשֶּׁמֶן
  choice: ధాన్యార్పణగా నూనె కలిపిన సన్నని పిండి
  rationale: సన్నగా మిల్లుచేసిన పిండి, ధాన్యార్పణ అనే ఆచారపరమైన ఉపయోగం, నూనెతో కలిపిన స్థితి—మూడింటినీ సహజ క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: ఒక లోగు నూనెను
  rationale: లోగు ఒక నిర్దిష్ట ప్రాచీన ద్రవ కొలత; సమానమైన సాధారణ తెలుగు ప్రమాణం లేనందున లిప్యంతరీకరించి పాదసూచికలో వివరణ ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండంలోని ఆచారపరమైన నిర్దేశాలకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొలతల ప్రత్యేకతను నిలుపుతూ వాక్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా నిర్మించాం; పాదసూచిక గుర్తును అది వివరిస్తున్న ‘లోగు’ పదం వద్ద ఉంచాం.
