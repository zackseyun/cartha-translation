  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: te
  text: అప్పుడు యాజకుడు, ఒక పక్షిని మట్టిపాత్రలోని ప్రవహించే నీటి మీద వధించమని ఆజ్ఞాపించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జీవజలం”; అంటే సహజమైన తాజా లేదా ప్రవహించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: అప్పుడు ... ఆజ్ఞాపించాలి
  rationale: కర్మకాండ సంబంధమైన వరుస ఆదేశాలలో వావ్‌తో కూడిన సంపూర్ణ క్రియకు విధ్యర్థక భావం ఉంది; ‘అప్పుడు’ క్రమాన్ని, ‘ఆజ్ఞాపించాలి’ యాజకుని అధికారపూర్వక ఆదేశాన్ని తెలియజేస్తాయి.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా, ధర్మశాస్త్ర సందర్భంలో כֹּהֵן‌కు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וְשָׁחַט
  choice: వధించమని
  rationale: రూపపరంగా క్రియ కర్తరిలో ఉన్నా, ‘ఆజ్ఞాపించాలి’కి అనుసంధానమైన ఆదేశిత చర్యగా తెలుగులో ఈ నిర్మాణం సహజం. ‘చంపడం’కంటే ‘వధించడం’ కర్మకాండ సంబంధమైన జంతు సంహారాన్ని మరింత కచ్చితంగా సూచిస్తుంది.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: ఒక పక్షిని
  rationale: ముందటి సందర్భంలో పేర్కొన్న జతలో ఒక పక్షిని ఇది గుర్తిస్తుంది; తెలుగు వాక్యంలో ‘ఒక పక్షిని’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: మట్టిపాత్రపై
  rationale: వధించేటప్పుడు రక్తం మట్టిపాత్రలోకి పడేలా దాని మీద చేయబడుతుందనే సంబంధాన్ని ‘పై’ సహజంగా తెలియజేస్తుంది; పాత్రను మట్టి/కుండ పదార్థంతో చేసినదిగా కూడా స్పష్టపరుస్తుంది.
- source_word: עַל מַיִם חַיִּים
  choice: మంచినీరు ఉన్న
  rationale: పాత్రలో తాజా, నిల్వచేసి చెడిపోని నీరు ఉందనే ఆచార సంబంధ భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘జీవజలం’ను పాదటిప్పణిలో ఉంచి మూలంలోని రూపక సంభావ్యతను కాపాడింది.
theological_decisions:
- issue: מַיִם חַיִּים అనే పదబంధాన్ని శుద్ధీకరణ ఆచార సందర్భంలో అనువదించడం
  choice: మంచినీరు
  alternative: జీవజలం; ప్రవహించే నీరు
  rationale: ఈ సందర్భంలో పదబంధం నిల్వనీటికి భిన్నమైన తాజా లేదా సహజంగా ప్రవహించే నీటిని సూచిస్తుంది; తరువాతి కాలపు ధార్మిక ప్రతీకార్థాన్ని నేరుగా ఇక్కడికి దిగుమతి చేయకుండా, అక్షరార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర-కర్మకాండ శైలి. ‘ఆజ్ఞాపించాలి’ విధ్యర్థక భావాన్ని, ‘వధించమని’ ఆదేశిత కర్మను సహజంగా వ్యక్తపరుస్తాయి. పాదటిప్పణి సూచిక [a] ప్రధాన వచనంలో చేర్చబడింది.
