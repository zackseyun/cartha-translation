source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: te
  text: శుద్ధి పొందుతున్న వ్యక్తి తన బట్టలు ఉతకాలి, తన వెంట్రుకలన్నిటినీ గొరగాలి, నీళ్లలో స్నానం చేయాలి; అప్పుడు అతడు శుద్ధుడవుతాడు. ఆ తర్వాత అతడు శిబిరంలోకి రావచ్చు[a]. అయితే అతడు ఏడు రోజులపాటు తన గుడారం వెలుపలే ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు శిబిరంలోకి వస్తాడు” లేదా “రావాలి.” హీబ్రూ క్రియారూపం సాధారణ భవిష్యత్తు లేదా విధిని సూచించవచ్చు; సందర్భంలో అది పరిమితులతో కూడిన పునఃప్రవేశానికి అనుమతిగా కూడా అర్థమవుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: శుద్ధీకరణ పొందుతున్న వ్యక్తి
  rationale: హిత్పయేల్ వర్తమాన కృదంతం నిర్దేశిత ఆచారపరమైన శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది. ఈ రూపం అతడు తనను తానే శుద్ధి చేసుకుంటున్నాడని కాక, శుద్ధీకరణ పొందుతున్నాడనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: כִבֵּס సాధారణంగా వస్త్రాలను ఉతకడాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘బట్టలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: తన వెంట్రుకలన్నిటినీ గొరిగించుకొని
  rationale: כָּל సంపూర్ణతను తెలియజేస్తుంది. ‘వెంట్రుకలన్నిటినీ’ శరీరంలోని మొత్తం వెంట్రుకలను సూచిస్తుంది; తెలుగు వాడుకలో ‘గొరిగించుకొని’ పూర్తి తొలగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָחַץ בַּמַּיִם
  choice: నీళ్లతో స్నానం చేయాలి
  rationale: ఇక్కడ רָחַץ శరీరాన్ని కడుక్కోవడాన్ని సూచిస్తుంది. ముందు బట్టలు ఉతకడం చెప్పబడినందున, ‘స్నానం చేయాలి’ అనే అనువాదం ఆ రెండు చర్యలను స్పష్టంగా వేరు చేస్తుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అతడు శుద్ధుడవుతాడు
  rationale: ముందు చెప్పిన చర్యల ఫలితంగా ఏర్పడే ఆచారపరమైన స్థితిని సూచిస్తుంది. ‘అప్పుడు’ క్రమాన్నీ ఫలితాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: శుద్ధీకరణ క్రమంలోని తదుపరి దశను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: అతడు శిబిరంలోకి రావచ్చు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం ‘వస్తాడు/రావాలి’ అని కూడా అనువదించవచ్చు. అయితే వెంటనే అతడు తన గుడారం వెలుపల ఉండాలనే పరిమితి రావడం వల్ల, శిబిరంలోకి తిరిగి ప్రవేశించడానికి అనుమతి లభించిందనే భావం సందర్భానికి సరిపోతుంది; నిజమైన రూపభేదాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: అయితే ... తన గుడారం వెలుపలే ఉండాలి
  rationale: יָשַׁב ఇక్కడ తాత్కాలికంగా నివసించడం లేదా ఉండిపోవడం అనే భావం ఇస్తుంది. హీబ్రూలో సాధారణ సంధి ఉన్నప్పటికీ, శిబిర ప్రవేశానికి అనుమతి మరియు గుడార ప్రవేశంపై కొనసాగుతున్న ఆంక్ష మధ్య వ్యత్యాసాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలిపే రూపం.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధత స్వభావం
  choice: טהר/מטהר పదాలను ‘శుద్ధీకరణ పొందుతున్న’ మరియు ‘శుద్ధుడవుతాడు’గా అనువదించడం
  alternative: ‘పరిశుద్ధీకరణ పొందుతున్న’ / ‘పరిశుద్ధుడవుతాడు’ లేదా కేవలం ‘శుభ్రపడుతున్న’ / ‘శుభ్రుడవుతాడు’
  rationale: ఈ సందర్భం చర్మవ్యాధి అనంతరం లేవీయ ఆచారం ప్రకారం సమాజంలోకి పునఃప్రవేశించే స్థితికి సంబంధించినది; ప్రధానంగా నైతిక పరిశుద్ధతకు కాదు. ‘శుద్ధి’ ఆచారపరమైన భావాన్ని నిలుపుతూ, ‘పరిశుద్ధ’ వల్ల కలగగల నైతిక లేదా ఆధ్యాత్మిక అర్థాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: శిబిరంలో ప్రవేశించే క్రియారూపం
  choice: అనుమతిని సూచించే ‘రావచ్చు’
  alternative: విధి లేదా సాధారణ భవిష్యత్తును సూచించే ‘రావాలి’ / ‘వస్తాడు’
  rationale: మూలంలోని יָבֹא రూపం స్వయంగా అనుమతి భావానికి మాత్రమే పరిమితం కాదు. తరువాతి గుడార-బహిష్కరణ ఆంక్ష వల్ల అనుమతించబడిన పరిమిత పునఃప్రవేశం సందర్భానుకూలంగా కనిపిస్తుంది; అయినా మూలంలోని వ్యాకరణ అస్పష్టతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆచారపరమైన శుద్ధతను నైతిక పరిశుద్ధతగా మార్చలేదు. మూలంలోని వరుస చర్యలను తెలుగు సంయుక్త క్రియలతో సహజంగా కూర్చి, శిబిర ప్రవేశం మరియు గుడారం వెలుపల ఉండడం మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
