id: LEV.14.30
reference: Leviticus 14:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה אֶת הָֽ/אֶחָד֙ מִן הַ/תֹּרִ֔ים א֖וֹ מִן בְּנֵ֣י הַ/יּוֹנָ֑ה מֵ/אֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: te
  text: అతడు గువ్వలలో ఒకదానినో, పావురపు పిల్లలలో ఒకదానినో తన స్థోమతకు తగినట్లుగా అర్పించాలి—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה
  choice: అతడు అర్పించాలి
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘చేయాలి’ అనే భావం ఉన్నా, బలుల సందర్భంలో బలిని సమర్పించడం అనే అర్థం వస్తుంది; ‘అర్పించాలి’ తెలుగులో సహజంగా ఆ ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: אֶת הָאֶחָד
  choice: ఒకదానిని
  rationale: తరువాత పేర్కొన్న పక్షులలో ఒకదానిని ఎంచుకోవడం అనే పంపిణీ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִן הַתֹּרִים
  choice: గువ్వల్లో
  rationale: תֹּרִים బలుల నియమాలలో ప్రత్యేకంగా turtledoves‌ను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘గువ్వలు’ సులభంగా అర్థమయ్యే సమీప పదం.
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: లేదా పావురపు పిల్లల్లో ఒకదానిని
  rationale: בְּנֵי הַיּוֹנָה అనేది చిన్న పావురాలను సూచించే స్థిర ప్రయోగం; ‘పావురపు పిల్లలు’ ఆ అర్థాన్ని సహజంగా ఇస్తుంది.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: తన స్థోమతకు తగినట్లుగా
  rationale: అక్షరార్థం ‘అతని చెయ్యి అందుకోగల దాని నుండి’; ఇది ఆర్థిక సామర్థ్యాన్ని సూచించే హీబ్రూ నుడికారం. ‘స్థోమతకు తగినట్లుగా’ దాని భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
