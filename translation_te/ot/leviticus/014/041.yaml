id: LEV.14.41
reference: Leviticus 14:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: te
  text: అతడు ఇంటి లోపలి భాగమంతా గీకించాలి. వారు గీకి తీసిన దుమ్మును పట్టణం వెలుపల ఉన్న అశుద్ధమైన స్థలంలో పారవేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: గీయించాలి
  rationale: 'హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో చూపిస్తుంది: అతడు స్వయంగా గీయడం కంటే ఆ పని చేయిస్తాడు.'
- source_word: מִבַּיִת סָבִיב
  choice: ఇంటి లోపలి గోడలను చుట్టూ
  rationale: ఇంటి అంతర్భాగపు ఉపరితలాన్ని చుట్టూ గీయాలనే సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘గోడలను’ అనేది సందర్భం ద్వారా సూచితమైన వివరణ.
- source_word: וְשָׁפְכוּ
  choice: వారు ... పారవేయాలి
  rationale: తీసివేసిన పదార్థాన్ని నిర్దేశిత స్థలంలో వేయడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֶעָפָר
  choice: మట్టిని
  rationale: మూలపదానికి అక్షరార్థంగా ‘దుమ్ము/మట్టి’ అనే పరిధి ఉంది. ఇక్కడ గోడలపై నుంచి గీకి తీసిన పదార్థాన్ని సూచించేందుకు ‘మట్టి’ సహజంగా ఉంది; పూత అని ప్రత్యేకీకరించలేదు.
- source_word: אֲשֶׁר הִקְצוּ
  choice: గీకి తీసిన
  rationale: గోడల ఉపరితలం నుంచి పదార్థాన్ని గీయడం ద్వారా తొలగించిన చర్యను సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: אֶל מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల
  rationale: పట్టణ సరిహద్దులకు అవతలికి తరలించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל מָקוֹם טָמֵא
  choice: అపవిత్రమైన చోట
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి-అశుద్ధి వర్గాన్ని సూచిస్తుంది; నైతిక దోషార్థాన్ని జోడించదు.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి సందర్భంలో טָמֵא అనువాదం
  choice: అపవిత్రమైన
  alternative: అశుద్ధమైన
  rationale: ఇది నైతిక పాపాన్ని కాక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు శైలిలో ‘అపవిత్రమైన’ ఆ సాంకేతిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండపు ఆచారపరమైన పదజాల గౌరవాన్ని నిలుపుతూ రూపొందించబడింది.
