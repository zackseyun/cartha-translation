id: LEV.14.15
reference: Leviticus 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֥ח הַ/כֹּהֵ֖ן מִ/לֹּ֣ג הַ/שָּׁ֑מֶן וְ/יָצַ֛ק עַל כַּ֥ף הַ/כֹּהֵ֖ן הַ/שְּׂמָאלִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: te
  text: తర్వాత యాజకుడు ఆ నూనె లోగు కొలతలో నుండి కొంత తీసుకొని, తన ఎడమ అరచేతిలో పోయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోగు’ అనేది ప్రాచీన కాలంలోని ఒక ద్రవ కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత ... తీసుకొని
  rationale: వావ్‌తో కూడిన రూపం ఆచార క్రమంలోని తదుపరి చర్యను సూచిస్తుంది; తెలుగులో ‘తర్వాత ... తీసుకొని’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సందర్భంలోని כֹּהֵן‌కు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: ఆ నూనె లోగులోనుంచి కొంత
  rationale: מִן మూలం లేదా భాగాన్ని సూచిస్తుంది; మొత్తం కొలతను కాకుండా అందులోని కొంత నూనెను తీసుకోవడమే భావం.
- source_word: לֹג
  choice: లోగు
  rationale: ఇది ప్రాచీన ద్రవ కొలమానం; అనిశ్చితమైన ఆధునిక పరిమాణంతో భర్తీ చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: וְיָצַק
  choice: పోయాలి
  rationale: ఆచార విధిలో నిర్దేశాత్మక భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל כַּף
  choice: అరచేతిలో
  rationale: అక్షరార్థంగా ‘అరచేతిమీద’ అయినా, నూనెను గుంటలా ఉంచిన అరచేతిలో పోయే చర్యకు ‘అరచేతిలో’ సహజమైన తెలుగు.
- source_word: הַשְּׂמָאלִית
  choice: తన ఎడమ అరచేతి
  rationale: పునరుక్తమైన ‘యాజకుడు’ అనే మూలపాఠ సూచనను తెలుగులో అస్పష్టత లేకుండా ‘తన’తో వ్యక్తపరుస్తుంది.
