translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆచార-నిర్దేశ శైలి వాడబడింది. ప్రాచీన కొలమానం ‘లోగు’ను నిలుపుకొని పాదసూచికలో వివరించాం.
