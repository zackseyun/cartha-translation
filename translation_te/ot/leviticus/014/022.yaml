id: LEV.14.22
reference: Leviticus 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: te
  text: తనకు చేతనైనంత మేరకు రెండు గువ్వలనైనా లేదా రెండు పావురపు పిల్లలనైనా; వాటిలో ఒకటి పాపపరిహార బలిగా[a], మరొకటి దహనబలిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి.” హీబ్రూ పదం ఆచారపరమైన శుద్ధీకరణ కోసం అర్పించే బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: రెండు తెల్లగువ్వలను
  rationale: תֹרִים ఒక నిర్దిష్టమైన బలి పక్షి జాతిని, అంటే turtledoves‌ను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెల్లగువ్వలు’ సాధారణ పాఠకులకు అర్థమయ్యే, ప్రాచుర్యంలో ఉన్న సమానార్థక పదం.
- source_word: אוֹ
  choice: అయినా
  rationale: అనుమతించబడిన రెండు ప్రత్యామ్నాయ పక్షి రకాల మధ్య భేదాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: రెండు పావురపు పిల్లలను
  rationale: అక్షరార్థంగా ‘పావురపు కుమారులు’ అనే హీబ్రూ నుడికారం చిన్న పావురాలను సూచిస్తుంది; ‘పావురపు పిల్లలు’ వయస్సు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: అతని ఆర్థిక స్థోమతకు తగినట్లుగా
  rationale: ‘అతని చెయ్యి అందుకోగలిగినంత’ అనే హీబ్రూ నుడికారం వ్యక్తి భరించగల ఆర్థిక సామర్థ్యాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיָה אֶחָד
  choice: వాటిలో ఒకటి ... ఉండాలి
  rationale: జతలోని ఒక్కో పక్షికి వేర్వేరు బలి పాత్రలను కేటాయించే పంపిణీ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: లేవీయకాండంలోని ఈ బలికి తెలుగులో గుర్తుపట్టదగిన సంప్రదాయ పదం. అయితే హీబ్రూ పదంలో శుద్ధీకరణ భావం కూడా ఉండగలదు; దాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְהָאֶחָד
  choice: మరొకటి
  rationale: మొదటి పక్షికి విరుద్ధంగా మిగిలిన పక్షిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలిమొత్తం దహించబడే ఈ అర్పణకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన బైబిలు పదం.
theological_decisions:
- issue: లేవీయకాండపు బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: חַטָּאת పాపానికీ, ఆచారపరమైన శుద్ధీకరణ కోసం అర్పించే బలికీ సంబంధించిన పదం. ప్రధాన పాఠ్యంలో పరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, ఈ శుద్ధీకరణ ఆచార సందర్భంలో ఉన్న ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా పదజాలాన్ని ఉపయోగించాం. వచనం మునుపటి వాక్యంలోని జాబితాను కొనసాగిస్తున్నప్పటికీ, స్వతంత్రంగా చదివినప్పుడు సహజంగా ఉండేందుకు ‘తీసుకురావాలి’ని సందర్భానుసారంగా పూరించాం.
