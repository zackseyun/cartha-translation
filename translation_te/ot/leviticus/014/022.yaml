  to: తనకు చేతనైనంత మేరకు రెండు గువ్వలనైనా లేదా రెండు పావురపు పిల్లలనైనా; వాటిలో ఒకటి పాపపరిహార బలిగా[a], మరొకటి దహనబలిగా ఉండాలి.
