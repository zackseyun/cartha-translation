id: LEV.14.49
reference: Leviticus 14:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: te
  text: అతడు ఆ ఇంటిని శుద్ధి చేయడానికి[b] రెండు పక్షులను, దేవదారు కట్టెను, ఎర్రని నూలును[a], హిస్సోపు మొక్కను తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎర్రని దారాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ ఇంటిని శుభ్రపరచడానికి.” హీబ్రూ క్రియ ఇక్కడ ఆచారపరమైన శుద్ధీకరణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: అతడు ... తీసుకోవాలి
  rationale: కర్మకాండ సంబంధమైన ఆదేశాల వరుసలో ఈ క్రియకు విధ్యర్థక భావం ఉంది; ఆధునిక తెలుగులో ‘తీసుకోవాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: ఆ ఇంటిని పాపమలినం నుండి శుద్ధిచేయడానికి
  rationale: పియేల్ రూపంలోని חטא ఇక్కడ ఇంటికి నైతిక పాపం ఉందని కాదు, ఆచారపరమైన కలుషాన్ని తొలగించి శుద్ధిచేయడాన్ని సూచిస్తుంది. ‘పాపమలినం’ అనే పదం మూలంలోని పాపం/అపవిత్రత సంబంధిత భావాన్ని నిలుపుతుంది.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: రెండు పక్షులను
  rationale: మూలవచనం కేవలం రెండు పక్షులు అని చెబుతుంది; ఈ వచనంలో లేని ‘సజీవమైన’ అనే విశేషణాన్ని చేర్చలేదు.
- source_word: וְעֵץ אֶרֶז
  choice: దేవదారు కట్టెను
  rationale: ఆచారంలో ఉపయోగించే దేవదారు చెక్క ముక్కను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: ఎర్రని నూలును
  rationale: ఈ పదబంధం ఆచారంలో వాడే ప్రకాశవంతమైన ఎరుపు రంగు నూలు లేదా దారాన్ని సూచిస్తుంది; ‘ఎర్రని నూలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וְאֵזֹב
  choice: హిస్సోపు మొక్కను
  rationale: మొక్క యొక్క ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు అనిశ్చితమైనందున సంప్రదాయ లిప్యంతరీకరణను ఉంచి, అది మొక్క అని స్పష్టం చేశాం.
theological_decisions:
- issue: ఇంటిని ఉద్దేశించిన לְחַטֵּא అనే క్రియలోని ఆచారపరమైన భావం
  choice: పాపమలినం నుండి శుద్ధిచేయడానికి
  alternative: ఆ ఇంటిని శుద్ధిచేయడానికి
  rationale: ఇది ఇంటికి నైతిక అపరాధాన్ని ఆపాదించదు; కలుషితమైన ఇంటిపై జరిగే యాజక కర్మలో పాపం/అపవిత్రత సంబంధిత మలినాన్ని తొలగించే భావాన్ని వ్యక్తం చేస్తుంది. అదే సమయంలో ‘ప్రాయశ్చిత్తం చేయడానికి’ అని అనువదించి వచనం స్పష్టంగా చెప్పని విధానాన్ని దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితాను సహజమైన తెలుగు క్రమంలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
