  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/שֹּׁכֵ֣ב בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָ֑י/ו וְ/הָ/אֹכֵ֣ל בַּ/בַּ֔יִת יְכַבֵּ֖ס אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: te
  text: ఆ ఇంట్లో పడుకునేవాడు తన బట్టలు ఉతుక్కోవాలి[a]; ఆ ఇంట్లో తినేవాడు తన బట్టలు ఉతుక్కోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ ఇంట్లో నిద్రించేవాడు.’ హీబ్రూ క్రియకు ‘పడుకోవడం’ లేదా ‘నిద్రించడం’ అనే అర్థాలు ఉండవచ్చు; న్యాయ సందర్భానికి సరిపోయే విస్తృత అర్థం కావడంతో ‘పడుకునేవాడు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: పడుకునేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం సాధారణ న్యాయపరమైన వ్యక్తిని సూచిస్తుంది. שׁכב అనే క్రియకు ‘పడుకోవడం’ లేదా సందర్భానుసారం ‘నిద్రించడం’ అనే అర్థాలు ఉండవచ్చు; విస్తృతమైన అర్థాన్ని నిలుపుకోవడానికి ‘పడుకునేవాడు’ ఎంచుకున్నాం.
- source_word: בַּבַּיִת
  choice: ఆ ఇంట్లో
  rationale: ఇది నేరుగా స్థలాన్ని సూచించే పదబంధం. ముందున్న సందర్భంలోని నిర్దిష్ట ఇంటిని సూచించే హీబ్రూ ఆర్టికల్‌ను తెలుగులో ‘ఆ’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: יְכַבֵּס
  choice: ఉతుక్కోవాలి
  rationale: యాజక నియమ సందర్భంలో ఈ అసంపూర్ణ క్రియ విధిని లేదా తప్పనిసరి చర్యను తెలియజేస్తుంది. బట్టల సందర్భంలో ‘ఉతుక్కోవాలి’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶת־בְּגָדָיו
  choice: తన బట్టలు
  rationale: בֶּגֶד అంటే బట్ట లేదా వస్త్రం. ప్రతిబింబ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తన బట్టలు’ వాడాం; ఇది హీబ్రూ ఏకవచన పురుష ప్రత్యయాన్ని లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సందర్భానుగుణంగా ప్రతిబింబిస్తుంది.
- source_word: וְהָאֹכֵל
  choice: భోజనం చేసేవాడు
  rationale: ఇది కూడా సాధారణ వ్యక్తిని సూచించే నామవాచక ప్రయోగంలోని కృదంతం. ఇంట్లో కేవలం ఏదో తినడంకన్నా అక్కడ భోజనం చేయడాన్ని న్యాయ సందర్భం సూచించవచ్చు; ‘భోజనం చేసేవాడు’ తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: న్యాయ నియమంలోని సాధారణ పురుష ఏకవచన రూపం
  choice: ‘పడుకునేవాడు … తన బట్టలు’; ‘భోజనం చేసేవాడు … తన బట్టలు’
  alternative: ‘ఎవరైనా … వారి బట్టలు’
  rationale: హీబ్రూలో పురుష ఏకవచన కృదంతాలు, ప్రత్యయాలు సాధారణ ప్రతినిధి అర్థంలో ఉన్నాయి. తెలుగులో ‘-వాడు’ రూపం మూలంలోని వ్యాకరణ ఏకవచనాన్ని నిలుపుతుంది; ‘తన’ సహజమైన అన్వయాన్ని ఇస్తుంది. ఇది నియమం పురుషులకు మాత్రమే వర్తిస్తుందని తప్పనిసరిగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండంలోని న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే రీతిని వాడాం. రెండు సమాంతర ఉపవాక్యాల నిర్మాణాన్ని కాపాడాం; సెమికోలన్ వాటి సమాంతరతను స్పష్టం చేస్తుంది.
