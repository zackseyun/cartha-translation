  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: te
  text: అప్పుడు యాజకుడు ఇంటి నుంచి బయటికి వచ్చి, ఇంటి ప్రవేశద్వారం వరకు వెళ్లి, ఆ ఇంటిని ఏడు రోజులపాటు మూసి ఉంచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ఇంటికి ప్రవేశం లేకుండా ఏడు రోజులపాటు మూసివేయాలి.’ హీబ్రూ క్రియ తనిఖీ కోసం నిర్ణయించిన కాలంలో ప్రవేశాన్ని నిలిపివేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: అప్పుడు ... బయటికి వచ్చి
  rationale: క్రమబద్ధమైన విధానంలో తరువాతి చర్యను సూచించే waw + qatal భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’ ద్వారా వ్యక్తం చేశాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆచారసంబంధ న్యాయ సందర్భంలో כֹּהֵן‌కు ప్రామాణికమైన తెలుగు పదం.
- source_word: מִן הַבַּיִת
  choice: ఇంటి నుంచి బయటికి
  rationale: יָצָאతో కలిసి ఉన్న ‘ఇంటి నుండి బయటకు’ అనే దిశాభావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: ఇంటి ద్వారం దగ్గరికి
  rationale: פֶּתַח అనేది ప్రవేశద్వారం లేదా తెరువు; ఇక్కడ తలుపు పలకను అతిగా నిర్దిష్టం చేయకుండా స్థలాన్ని సహజంగా సూచిస్తుంది.
- source_word: וְהִסְגִּיר
  choice: మూసి ఉంచాలి
  rationale: సגר హిఫీల్ ఇక్కడ నిర్ణీత కాలం పాటు ప్రవేశాన్ని నిలిపివేయడం లేదా ఇంటిని మూసివేయడం సూచిస్తుంది. ‘నిర్బంధించాలి’ కంటే ఇది తక్కువ వ్యాఖ్యాత్మకంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֶת הַבַּיִת
  choice: ఆ ఇంటిని
  rationale: నిర్దిష్ట ప్రత్యక్ష కర్మను తెలుగులో సహజంగా తిరిగి సూచించేందుకు ‘ఆ ఇంటిని’ వాడాం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తం చేసే రూపం.
