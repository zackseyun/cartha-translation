source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: te
  text: ఈ విధంగా అతడు పక్షి రక్తంతో, జీవజలంతో[a], సజీవమైన పక్షితో, దేవదారు చెక్కతో, హిస్సోపుతో, ఎర్రని నూలుతో[b] ఆ ఇంటిని శుద్ధి చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తాజా నీరు’ లేదా ‘ప్రవహించే నీరు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘జీవజలం’; ఇది తాజా, ప్రవహించే మూలం నుంచి వచ్చిన నీటికి వాడే సాధారణ అభివ్యక్తి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎర్రని దారం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ఈ శుద్ధీకరణ ఆచారంలో ఉపయోగించిన ఎర్రని రంగు అద్దిన పదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: ఈ విధంగా ... శుద్ధి చేయాలి
  rationale: חטא క్రియ యొక్క పియేల్ రూపం ఇక్కడ పాపం చేయించడం కాదు; ఆచారపరంగా అపవిత్రతను తొలగించి శుద్ధి చేయడాన్ని సూచిస్తుంది. వాక్యారంభంలోని וְ సందర్భానుసంధానాన్ని ‘ఈ విధంగా’ తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: ఆ ఇంటిని
  rationale: ఇక్కడ בַּיִת అనేది తెగులు సోకిన భౌతిక గృహాన్ని సూచిస్తుంది; ‘ఇల్లు’ సహజమైన, స్పష్టమైన పదం.
- source_word: בְּדַם הַצִּפּוֹר
  choice: పక్షి రక్తంతో
  rationale: בְ సాధనార్థాన్ని సూచిస్తుంది; ‘తో’ శుద్ధీకరణలో ఉపయోగించిన పదార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: జీవజలంతో
  rationale: మూలంలోని ‘జీవమున్న నీరు’ అనే ఆచారపరమైన అభివ్యక్తిని నిలుపుతుంది; ఇది తాజా లేదా ప్రవహించే మూలం నుంచి వచ్చిన నీటిని సూచిస్తుంది. ప్రత్యామ్నాయ అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: సజీవమైన పక్షితో
  rationale: ఇది చంపబడిన పక్షికి భిన్నంగా ఇంకా బతికున్న పక్షిని స్పష్టంగా సూచిస్తుంది.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: దేవదారు కర్రతో
  rationale: עֵץ ఇక్కడ ఆచారంలో ఉపయోగించే దేవదారు చెక్క ముక్కను సూచిస్తుంది; ‘కర్ర’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וּבָאֵזֹב
  choice: హిస్సోపుతో
  rationale: ఈ మొక్క యొక్క ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు వివాదాస్పదమైనందున, సంప్రదాయ బైబిలు పేరైన ‘హిస్సోపు’ను లిప్యంతరీకరించి నిలిపాం.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: ఎర్రని నూలుతో
  rationale: ఈ హీబ్రూ పదబంధం ఎర్రని రంగు అద్దిన నూలు లేదా దారాన్ని సూచిస్తుంది; ‘ఎర్రని నూలు’ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
theological_decisions:
- issue: וְחִטֵּא యొక్క ఆచారపరమైన భావం
  choice: శుద్ధి చేయాలి
  alternative: ప్రాయశ్చిత్తం చేయాలి / పాపపరిహారం చేయాలి
  rationale: ఈ సందర్భంలో క్రియ ఇంటిపై ఉన్న ఆచారపరమైన కలుషాన్ని తొలగించడాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్తం’ అని అనువదిస్తే ఇంటికి నైతిక అపరాధం ఉందనే అనుచిత భావం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆచారపరమైన ప్రత్యేక పదాలైన ‘జీవజలం’, ‘హిస్సోపు’లను నిలిపి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం.
