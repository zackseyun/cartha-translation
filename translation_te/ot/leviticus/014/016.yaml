revisions:
- from: యాజకుడు తన ఎడమ అరచేతిలో ఉన్న నూనెలో తన కుడిచేతి వేలును ముంచి, తన వేలితో ఆ నూనెలో కొంత యెహోవా సన్నిధిలో ఏడుసార్లు చిలకరించాలి.
  to: యాజకుడు తన ఎడమ అరచేతిపై ఉన్న నూనెలో తన కుడిచేతి వేలిని ముంచి, తన వేలితో ఆ నూనెలో కొంతను యాహ్వే ఎదుట ఏడుసార్లు చిలకరించాలి.
  rationale: The revision corrects the Telugu case marking so that some oil, rather than an action directed into oil, is clearly sprinkled. It also restores ‘on the left palm’ and aligns the divine-name form with the supplied project policy. No footnote is needed, since no textual variant or unresolved ambiguity requires one.
