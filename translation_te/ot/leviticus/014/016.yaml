id: LEV.14.16
reference: Leviticus 14:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: te
  text: యాజకుడు తన ఎడమ అరచేతిపై ఉన్న నూనెలో తన కుడిచేతి వేలిని ముంచి, తన వేలితో ఆ నూనెలో కొంతను యాహ్వే ఎదుట ఏడుసార్లు చిలకరించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: ముంచి
  rationale: ద్రవంలో వేలును ముంచే ఆచారక్రియను సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: తన కుడిచేతి వేలును
  rationale: హీబ్రూ పదబంధంలోని కుడివైపు శరీర సూచనను తెలుగులో సహజంగా స్పష్టం చేస్తుంది; ఏ ప్రత్యేక వేలు అనేది మూలంలో చెప్పలేదు.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: తన ఎడమ అరచేతిలో ఉన్న నూనెలో
  rationale: כַּף ను నిర్దిష్టంగా ‘అరచేయి’గా అందిస్తూ, טבל తరువాత מן సూచించే ద్రవంలో ముంచే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִזָּה
  choice: చిలకరించాలి
  rationale: యాజక ఆచార సందర్భంలో ద్రవాన్ని నియమితంగా చిలకరించడాన్ని సూచించే ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְּ ఇక్కడ సాధనార్థకంగా ఉన్నందున చర్యకు ఉపయోగించిన అవయవాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: ఆచారపరంగా ముఖ్యమైన సంఖ్యను యథాతథంగా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే ఆచారక్రియ అనే భావాన్ని సహజమైన గౌరవప్రద తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపంగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత నామాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో స్థిరంగా పరిచయమైన రూపాన్ని ఉపయోగించాం; ‘ప్రభువు’ అనే బిరుదు మూలంలోని నామాన్ని మరుగుపరచవచ్చు.
- issue: לִפְנֵי יְהוָה యొక్క స్థల/సన్నిధి భావం
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: రెండూ సాధ్యమైనప్పటికీ, ఆరాధనా సందర్భంలోని ‘దైవ సమక్షం’ భావాన్ని ‘సన్నిధిలో’ సహజంగా వ్యక్తం చేస్తుంది; చర్య యొక్క ఖచ్చిత దిశను మూలం నిర్దేశించదు.
translation_notes:
  register: ఆచారనియమానికి తగిన గౌరవప్రదమైన, స్పష్టమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని చర్యల క్రమం, ఎడమ అరచేయి–కుడిచేతి వేలు అనే శరీర వివరాలు, ఏడు సార్ల సంఖ్య అన్నీ నిలుపబడ్డాయి.
