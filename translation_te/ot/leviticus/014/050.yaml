source:
  edition: WLC
  text: וְ/שָׁחַ֖ט אֶת הַ/צִּפֹּ֣ר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: te
  text: తరువాత అతడు ఆ పక్షుల్లో ఒకదానిని మట్టిపాత్రలోని పారే నీటి మీద వధించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “జీవజలాలు”; అంటే తాజా లేదా ప్రవహించే నీరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: తరువాత అతడు ... వధించాలి
  rationale: క్రమంగా జరిగే ఆచార విధిలో ఈ రూపం తదుపరి ఆదేశాన్ని సూచిస్తుంది. ‘తరువాత’ క్రమాన్ని తెలియజేస్తుంది; ‘వధించాలి’ ఆచారపరమైన చంపడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: ఒక పక్షిని
  rationale: ముందు పేర్కొన్న రెండు పక్షుల్లో ఒకదానిని మరొకదాని నుంచి వేరు చేస్తుంది; హెబ్రీలో లేని ‘మొదటి’ అనే క్రమసూచక భావాన్ని చేర్చదు.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: మట్టిపాత్రలో
  rationale: పక్షిని వధించినప్పుడు రక్తం పాత్రలో పడేలా చేయడమే ఈ నిర్మాణ భావం. ‘మట్టిపాత్ర’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి పాత్ర పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: పై
  rationale: పాత్రలో ఉన్న నీళ్లపై వధించే ఆచార విధానాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַיִם חַיִּים
  choice: పారే నీళ్లు
  rationale: అక్షరార్థంగా ‘జీవజలాలు’; ఈ ఆచార సందర్భంలో నిల్వ లేదా నిలకడ నీటికి భిన్నమైన తాజా, ప్రవహించే నీటిని సూచించే హెబ్రీ నుడికారం. ‘పారే నీళ్లు’ ఉద్దేశించిన భౌతిక లక్షణాన్ని ఆధునిక పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శుద్ధీకరణ ఆచార సందర్భంలో מַיִם חַיִּים అనువాదం
  choice: పారే నీళ్లు
  alternative: జీవజలాలు / తాజా నీళ్లు
  rationale: ఇక్కడ ఈ పదబంధం ప్రధానంగా రూపకం కాక ఆచారానికి అవసరమైన నీటి స్వభావాన్ని నిర్దేశిస్తుంది. ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఇచ్చి, దాని అక్షరార్థాన్ని పాదసూచికలో ఉంచడం మూలంలోని విస్తృత బైబిలు ప్రతిధ్వనిని కోల్పోకుండా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆచారపరమైన శైలి. ‘చంపాలి’ కంటే ‘వధించాలి’ మూలంలోని ఆచార భావానికి మరింత తగినది.
