id: LEV.14.27
reference: Leviticus 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడు తన ఎడమ అరచేతిలో ఉన్న నూనెలో కొంతను తన కుడి చేతి వేలితో తీసుకుని, యాహ్వే సన్నిధిలో ఏడుసార్లు చిలకరించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: అప్పుడు ... చిలకరించాలి
  rationale: హిఫీల్ రూపంలోని נזה ఆచార సందర్భంలో ‘చిలకరించు’ అని అర్థం. וְ అనే అనుసంధానాన్ని విధిక్రమాన్ని సహజంగా చూపేందుకు ‘అప్పుడు’గా అనువదించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధన సంబంధమైన లేవీయ సందర్భంలో כֹּהֵן‌కు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: తన కుడిచేతి వేలితో
  rationale: హీబ్రూ వాక్యం కుడివైపు వేలిని ఏకవచనంలో సూచిస్తుంది; తెలుగులో ‘కుడిచేతి వేలితో’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מִן הַשֶּׁמֶן
  choice: నూనెలో కొంత
  rationale: 'מִן ఇక్కడ భాగార్థకంగా ఉంది: నూనె మొత్తాన్ని కాక దానిలో కొంత తీసుకొని చిలకరించడాన్ని సూచిస్తుంది.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: తన ఎడమ అరచేతిలో ఉన్న
  rationale: כַּף ఇక్కడ సాధారణంగా ‘చేయి’ కాక నూనె ఉంచిన అరచేతిని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యను, చర్య పునరావృతిని నేరుగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי ఆరాధన సందర్భంలో దేవుని సమక్షంలో జరిగే చర్యను సూచిస్తుంది; ‘సన్నిధిలో’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం. మూల హీబ్రూ ఉచ్చారణను సూచించే ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచార విధానానికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘ఎడమ అరచేతి’, ‘కుడిచేతి వేలు’ అనే శరీర భాగాల వ్యత్యాసాన్ని మూలానికి అనుగుణంగా నిలిపాం.
