id: LEV.14.14
reference: Leviticus 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: te
  text: అప్పుడు యాజకుడు అపరాధ పరిహారబలి రక్తంలో కొంత తీసుకొని, శుద్ధి చేయబడుతున్న వ్యక్తి కుడి చెవితమ్మెపై[a], అతని కుడిచేతి బొటనవేలి మీద, అతని కుడికాలి బొటనవేలి మీద వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుడి చెవి చివరపై.’
    reason: תְּנוּךְ అనే అరుదైన పదం చెవితమ్మెను లేదా చెవి చివరను సూచించవచ్చు.
lexical_decisions:
- source_word: מִדַּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది. యాజకుడు రక్తమంతా కాక దానిలో కొంత తీసుకుంటాడనే భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הָאָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: లేవీయకాండంలోని ప్రత్యేక బలి రకాన్ని సూచించే אָשָׁםకు ‘అపరాధ పరిహార బలి’ దాని అపరాధం మరియు పరిహారం అనే భావాలను కలిపి తెలియజేస్తుంది.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: తొలి చెవి భాగం లేదా చివరను సూచించే అరుదైన శరీరావయవ పదానికి ఆధునిక తెలుగులో సహజమైన నిర్దిష్ట సమానం.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి చేయబడుతున్న వ్యక్తి
  rationale: హిత్పయేల్ కృదంతం ఈ ఆచార ప్రక్రియకు లోనవుతున్న వ్యక్తిని సూచిస్తుంది; పూర్తయిన స్థితిగా గానీ స్వయంగా శుద్ధి చేసుకుంటున్నట్టుగా గానీ అనవసరంగా నిర్ధారించదు.
- source_word: בֹּהֶן יָדוֹ
  choice: అతని కుడిచేతి బొటనవేలు
  rationale: చేతితో వచ్చినప్పుడు בֹּהֶן బొటనవేలును సూచిస్తుంది.
- source_word: בֹּהֶן רַגְלוֹ
  choice: అతని కుడికాలి బొటనవేలు
  rationale: కాలితో వచ్చినప్పుడు בֹּהֶן పెద్ద కాలి బొటనవేలును సూచిస్తుంది; తెలుగులో ‘కాలి బొటనవేలు’ సహజంగా అర్థమవుతుంది.
- source_word: וְלָקַח ... וְנָתַן
  choice: తీసుకొని ... పూయాలి
  rationale: విధి నియమ సందర్భంలోని క్రియలు ఆదేశాత్మక భావాన్ని కలిగిస్తాయి. రక్తాన్ని శరీర భాగాలపై ఉంచడాన్ని తెలుగులో ‘పూయాలి’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఆచార శుద్ధికి లోనవుతున్న వ్యక్తి పాత్ర
  choice: శుద్ధి చేయబడుతున్న వ్యక్తి
  alternative: తన్నుతాను శుద్ధి చేసుకుంటున్న వ్యక్తి; శుద్ధుడైన వ్యక్తి
  rationale: సందర్భంలో ఆ వ్యక్తి యాజకుడు నిర్వహించే శుద్ధీకరణ ఆచారానికి లోనవుతున్నాడు. ఈ రూపం స్వీయశుద్ధిని సూచించకుండా, ప్రక్రియ ఇంకా కొనసాగుతోందనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర సంబంధమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ఆదేశ భావానికి ‘పూయాలి’ వాడబడింది.
