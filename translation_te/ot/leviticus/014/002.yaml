source:
  edition: WLC
  text: זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַ/מְּצֹרָ֔ע בְּ/י֖וֹם טָהֳרָת֑/וֹ וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: te
  text: '“చర్మవ్యాధిగల వ్యక్తి శుద్ధీకరణ దినమున అతని విషయంలో పాటించవలసిన నియమం ఇదే: అతన్ని యాజకుని వద్దకు తీసుకురావాలి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చర్మవ్యాధిగల వ్యక్తి’ అని అనువదించిన హీబ్రూ పదం צָרַעַת అనే స్థితి ప్రభావానికి లోనైన వ్యక్తిని సూచిస్తుంది. దీనిని సంప్రదాయంగా ‘కుష్ఠురోగి’ అని అనువదించినా, ఇది తప్పనిసరిగా ఆధునిక హాన్సెన్ వ్యాధినే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: ఇదే
  rationale: హీబ్రూ న్యాయసూత్ర పరిచయ వాక్యాన్ని సహజమైన ఆధునిక తెలుగు విధానంలో తెలియజేస్తుంది; నిర్దేశాత్మక భావం తరువాతి ‘పాటించవలసిన’లో వ్యక్తమవుతుంది.
- source_word: תּוֹרַת
  choice: పాటించవలసిన నియమం
  rationale: ఇక్కడ תּוֹרָה అనేది సాధారణ సిద్ధాంతం కాక, నిర్దేశించిన ఆచారపద్ధతి. ‘నియమం’ స్పష్టంగా ఉండగా ‘పాటించవలసిన’ దాని విధానాత్మక బలాన్ని తెలియజేస్తుంది.
- source_word: הַמְּצֹרָע
  choice: చర్మవ్యాధిగల వ్యక్తి
  rationale: מְצֹרָע అనేది צָרַעַת వల్ల ప్రభావితుడైన వ్యక్తిని సూచిస్తుంది; అది ఆధునిక వైద్యార్థంలోని కుష్ఠువ్యాధికే పరిమితం కాదు. ఈ ఎంపిక వ్యక్తిని వ్యాధితో సమానీకరించకుండా, పరిస్థితిని విస్తృతంగా సూచిస్తుంది.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: శుద్ధి పొందే రోజున
  rationale: טהר ఇక్కడ ఆచారపరమైన శుద్ధస్థితిలోకి రావడాన్ని సూచిస్తుంది. ‘శుద్ధి పొందే’ అనేది ఆ భావాన్ని సరళంగా, సందర్భోచితంగా అందిస్తుంది.
- source_word: וְהוּבָא
  choice: అతన్ని ... తీసుకురావాలి
  rationale: హొఫాల్ రూపంలోని కర్మణి భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్తతో కూడిన విధాన వాక్యంగా అందిస్తుంది; వ్యక్తి స్వయంగా వెళ్లడం కాక తీసుకురాబడటం నిలిచి ఉంటుంది.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని దగ్గరకు
  rationale: హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని గౌరవిస్తూ, సందర్భంలోని ఆచారాన్ని నిర్వహించే యాజకుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: מְצֹרָע అనే పదాన్ని చారిత్రక ‘కుష్ఠు’ పదజాలంతో అనుసంధానించి అనువదించడం
  choice: చర్మవ్యాధిగల వ్యక్తి
  alternative: కుష్ఠురోగి
  rationale: צָרַעַת ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం కాదు. అందువల్ల ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణను పాఠ్యంలోకి చేర్చకుండా, ఆచార అపవిత్రతకు సంబంధించిన చర్మస్థితిని సూచించే విస్తృత పదబంధం వాడబడింది.
- issue: טָהֳרָתוֹ యొక్క శుద్ధి స్వభావం
  choice: శుద్ధి పొందే
  alternative: స్వస్థత పొందే
  rationale: ఈ సందర్భం కేవలం వైద్య స్వస్థతను కాక, ఆచారపరమైన శుద్ధస్థితిలోకి పునరాగమనాన్ని సూచిస్తుంది; అందువల్ల ‘శుద్ధి’ మూలపాఠ భావాన్ని మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని ఆచార-న్యాయ గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘అతని విషయంలో’ అనే పదబంధం תּוֹרַת הַמְּצֹרָע లోని సంబంధాన్ని సహజంగా చూపిస్తుంది.
