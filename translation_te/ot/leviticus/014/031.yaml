  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: te
  text: తన స్థోమతకు తగిన మేరకు[a] ఒకటి పాపపరిహార బలిగా[b], మరొకటి దహనబలిగా, ధాన్యార్పణతో పాటు అర్పించాలి. అప్పుడు యాజకుడు శుద్ధి పొందుతున్న వ్యక్తి కొరకు యెహోవా సమక్షంలో ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని చెయ్యి దేనిని అందుకోగలదో”; అంటే, అతని స్థోమతకు తగిన మేరకు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శుద్ధీకరణ బలిగా.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: అతని స్థోమతకు అందుబాటులో ఉన్నవాటిలో
  rationale: ‘అతని చెయ్యి దేనిని అందుకోగలదో’ అనే హీబ్రూ నుడికారం అతని ఆర్థిక స్థోమతకు అందుబాటులో ఉన్నదాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో తరువాత వచ్చే ‘ఒకదాన్ని… మరొకదాన్ని’ అనే నిర్మాణంతో సహజంగా కలిసేలా బహువచన భావంతో అనువదించబడింది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: లేవీయకాండంలోని బలి సందర్భంలో ఇది పాపానికి సంబంధించిన ప్రాయశ్చిత్తం మరియు ఆచారపరమైన శుద్ధీకరణ రెండింటితో ముడిపడిన బలి. సుపరిచితమైన ‘పాపపరిహార బలి’ని ప్రధాన పాఠంలో ఉంచి, ‘శుద్ధీకరణ బలి’ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా అగ్నిలో దహించబడే బలిని సూచించే ప్రామాణిక బలి పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: עַל הַמִּנְחָה
  choice: ధాన్యార్పణతో పాటు
  rationale: ఇక్కడ עַל స్థలార్థకమైన ‘మీద’ అనే భావం కంటే, బలి ప్రక్రియలో తోడుగా లేదా అదనంగా అర్పించడాన్ని సూచిస్తుంది.
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజకుడు నిర్వహించే బలి క్రియ యొక్క ఆచారపరమైన, ధార్మిక బలాన్ని నిలుపుతూ, ప్రాయశ్చిత్తం ఏ విధంగా పనిచేస్తుందనే ఒక నిర్దిష్ట సిద్ధాంతాన్ని వాక్యంలోకి చేర్చదు.
- source_word: הַמִּטַּהֵר
  choice: శుద్ధి పొందుతున్న వ్యక్తి
  rationale: హిత్పయేల్ వర్తమాన కృదంతం శుద్ధీకరణ ప్రక్రియలో ఉన్న వ్యక్తిని సూచిస్తుంది; తెలుగు రూపం ఆ కొనసాగుతున్న ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజమైన గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: బలి పదజాలంలో పాపపరిహారం మరియు శుద్ధీకరణ మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో ‘పాపపరిహార బలి’; పాదటిప్పణిలో ‘శుద్ధీకరణ బలి’
  alternative: ప్రధాన పాఠంలో ‘శుద్ధీకరణ బలి’
  rationale: חַטָּאת అనే పదం ఈ సందర్భంలో పాపానికి సంబంధించిన బలినీ, ఆచారపరమైన శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. సుపరిచితమైన పదాన్ని ప్రధాన పాఠంలో ఉంచినా, ప్రత్యామ్నాయాన్ని తెలిపి అసలు పదంలోని భావ విస్తృతిని నిలిపాం.
- issue: כפר యొక్క ప్రాయశ్చిత్త భావం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి / శుద్ధి చేయాలి
  rationale: ఈ వచనం యాజకుని బలి క్రియను తెలియజేస్తుంది గాని ప్రాయశ్చిత్తం పనిచేసే విధానాన్ని వివరించదు. అందువల్ల సంప్రదాయ ఆచారపరమైన పదాన్ని ఉపయోగించి, అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: హీబ్రూ వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వచనం ముందరి వాక్యానికి వ్యాకరణపరంగా కొనసాగింపైనా, స్వతంత్రంగా చదివినప్పుడు స్పష్టంగా ఉండేందుకు ‘అర్పించాలి’ అనే క్రియను సందర్భానుసారంగా వ్యక్తం చేశాం. పాదటిప్పణి [b] అది వివరిస్తున్న חַטָּאת పదం వెంట ఉంచబడింది.
