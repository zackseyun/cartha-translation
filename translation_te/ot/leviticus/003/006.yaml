    rationale: The draft begins directly with “అతని అర్పణ ... మందలోనిదైతే,” which has conditional morphology but its compressed construction can obscure the clause structure and does not clearly represent the source’s opening conditional. A clear “... అయితే” construction restores the conditional sense.
