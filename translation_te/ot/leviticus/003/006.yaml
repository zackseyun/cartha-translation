id: LEV.3.6
reference: Leviticus 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: te
  text: అతని అర్పణ యెహోవాకు సమాధాన బలిగా[a] మందలోనిది అయితే, అతడు మగదైనను ఆడదైనను లోపంలేనిదాన్ని అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహవాస బలిగా.” హీబ్రూ שְׁלָמִים అనే పదం సమాధానం, క్షేమం, సంపూర్ణతను సూచించగలదు; బలి భోజనంలో పంచుకునే సహవాస భావాన్ని కూడా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి బలి నియమాలతో అనుసంధానాన్ని, షరతు భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: מִן הַצֹּאן
  choice: మందలోనిది
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచిస్తుంది; ఏకైక జాతిని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని సమష్టి భావాన్ని కాపాడుతుంది.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: קָרְבָּן బలిగా దేవుని సన్నిధికి తీసుకువచ్చే అర్పణను సూచించే సాంకేతిక పదం; ‘అర్పణ’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: לְזֶבַח שְׁלָמִים
  choice: సమాధాన బలిగా
  rationale: זֶבַח యొక్క బలి భావాన్ని, שְׁלָמִים యొక్క సంప్రదాయ సమాధాన/క్షేమ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; సహవాస బలి అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוהను వ్యక్తిగత నామంగా లిప్యంతరీకరించి, לְ యొక్క సమర్పణ/దిశ భావాన్ని ‘కు’తో వ్యక్తపరుస్తుంది.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: మగదైనా ఆడదైనా
  rationale: బలి పశువు మగది లేదా ఆడది కావచ్చనే మూలంలోని జీవశాస్త్రీయ భేదాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: תָּמִים
  choice: లోపంలేనిదాన్ని
  rationale: బలి సందర్భంలో శారీరక దోషం లేదా కళంకం లేని పశువును సూచిస్తుంది; ‘లోపంలేని’ ఆధునిక పాఠకులకు సూటిగా అర్థమవుతుంది.
- source_word: יַקְרִיבֶנּוּ
  choice: అతడు అర్పించాలి
  rationale: קרב హిఫిల్ రూపం బలి సందర్భంలో సమర్పించడం/అర్పించడం అనే కర్మకాండ చర్యను సూచిస్తుంది; విధి భావాన్ని ‘అర్పించాలి’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలుపుతుంది. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: שְׁלָמִים బలి పదార్థం
  choice: సమాధాన బలి
  alternative: సహవాస బలి
  rationale: ఈ సాంకేతిక బలి పదంలో సమాధానం, క్షేమం, సంపూర్ణత, పంచుకున్న బలి భోజనంలోని సహవాసం వంటి పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠంలో సంప్రదాయ ‘సమాధాన బలి’ని ఉంచి, భావ విస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. లేవీయకాండంలోని కర్మకాండ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుకరించకుండా తెలుగు వాక్య ప్రవాహానికి అనుగుణంగా రూపొందించబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
