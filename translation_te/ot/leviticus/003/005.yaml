reference: Leviticus 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అహరోను కుమారులు దానిని బలిపీఠంపై, నిప్పుపై ఉన్న కట్టెలమీద ఉన్న దహనబలిమీద కాల్చాలి. ఇది యహ్వేకు అగ్ని అర్పణ, ఇంపైన సువాసన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార అర్పణ.”
    reason: אִשֶּׁה అనే బలి సంబంధ సాంకేతిక పదానికి ‘అగ్నితో అర్పించే అర్పణ’ అనే ప్రధాన అర్థంతోపాటు, యహ్వేకు చెందిన ఆహార భాగం అనే వ్యాఖ్యానాత్మక అర్థసాధ్యత కూడా ఉంది.
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: కాల్చాలి
  rationale: బలియర్పణ సందర్భంలో קטר హిఫీల్ రూపం బలిని బలిపీఠంపై కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. ‘కాల్చాలి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, ఆచార విధానానికి తగిన ఆజ్ఞార్థక భావాన్ని ఇస్తుంది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: ముందటి వచనంలో పేర్కొన్న సమాధానబలిలోని భాగాన్ని సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: בְנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: హీబ్రూ సమాస పదబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; కుటుంబ సంబంధాన్నీ యాజకుల గుర్తింపునూ నిలుపుతుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: బలి అర్పించే పీఠాన్ని సూచిస్తుంది. దిశను సూచించే చివరి అక్షరరూపం ఇక్కడ కార్యం జరిగే గమ్యస్థానాన్ని తెలియజేస్తుంది.
- source_word: עַל הָעֹלָה
  choice: దహనబలి పైన
  rationale: עַל అనే పూర్వప్రత్యయం ఇక్కడ దహనబలి మీద ఉంచడాన్ని సహజంగా సూచిస్తుంది. עֹלָהకు లేవీయకాండంలో స్థిరమైన పదంగా ‘దహనబలి’ వాడబడింది.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: నిప్పు మీద ఉన్న కట్టెలపై ఉన్న
  rationale: బలిపీఠంపై ఉన్న నిప్పు, దాని మీద కట్టెలు, వాటి మీద దహనబలి అనే అమరికను మూలంలోని పునరుక్త నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: אִשֵּׁה
  choice: ఆహార అర్పణ[a]
  rationale: ఇది బలి సంబంధమైన సాంకేతిక పదం. లేవీయకాండపు ఆరాధనా సందర్భంలో యహ్వేకు అర్పించే ఆహార భాగాన్ని సూచించే భావాన్ని ‘ఆహార అర్పణ’ తెలియజేస్తుంది. ‘అగ్నిలో అర్పించే అర్పణ’ అనే సంప్రదాయ అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: ఈ స్థిరమైన బలి సంబంధ పదబంధం అర్పణ దేవునికి ఆమోదయోగ్యంగా ఉండటాన్ని సూచిస్తుంది. ‘ఇంపైన సువాసన’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: ל అనే పూర్వప్రత్యయం అర్పణ ఎవరికి సమర్పించబడుతుందో సూచిస్తుంది; దేవుని ఒడంబడిక నామమైన יהוהను ‘యహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా గుర్తించబడే ‘యహ్వే’ రూపంలో నిలిపాం.
- issue: אִשֵּׁה అనే బలి సంబంధ సాంకేతిక పదం
  choice: ఆహార అర్పణ
  alternative: అగ్నిలో అర్పించే అర్పణ; అగ్ని అర్పణ
  rationale: ఈ పదాన్ని యహ్వేకు చెందిన బలి-ఆహార భాగంగా అర్థం చేసుకోవచ్చు; మరోవైపు, అగ్నితో అర్పించే బలిగా కూడా సంప్రదాయంగా అనువదిస్తారు. ప్రధాన పాఠంలో మొదటి భావాన్ని ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆచార భాష వాడబడింది. మూలంలోని బలిపీఠపు అమరికను తెలిపే వరుస సంబంధ వాక్యాలను స్పష్టంగా నిలిపాం; అసహజమైన పదబద్ధతను మాత్రం నివారించాం.
