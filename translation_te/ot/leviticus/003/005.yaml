revisions:
- from: అహరోను కుమారులు దానిని బలిపీఠం మీద, నిప్పు మీద ఉన్న కట్టెలపై ఉన్న దహనబలి పైన కాల్చాలి. అది యహ్వేకు ఇంపైన సువాసన కలిగించే ఆహార అర్పణ[a].
  to: అహరోను కుమారులు దానిని బలిపీఠంపై, నిప్పుపై ఉన్న కట్టెలమీద ఉన్న దహనబలిమీద కాల్చాలి. ఇది యహ్వేకు అగ్ని అర్పణ, ఇంపైన సువాసన[a].
  rationale: The revision retains the procedural force of the verse and its repeated ‘on’ relationships, while restoring the Hebrew’s final apposition. It gives the technical sacrificial term a direct Telugu rendering and preserves the alternate interpretation in a clearly anchored footnote.
