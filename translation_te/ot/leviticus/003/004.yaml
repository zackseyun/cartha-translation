id: LEV.3.4
reference: Leviticus 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: te
  text: రెండు మూత్రపిండాలను, వాటిమీద, నడుము భాగంలో ఉన్న కొవ్వును, కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని[a] మూత్రపిండాలతో పాటు అతడు తొలగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలేయపు లోబును.’ ఈ శరీర భాగానికి వాడిన హీబ్రూ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; ప్రధాన పాఠంలో ‘అనుబంధ భాగం’ అని ఇవ్వడం ద్వారా లేని ఖచ్చితత్వాన్ని ఆపాదించకుండా ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలను
  rationale: ఈ పదబంధం బలిపశువు యొక్క రెండు మూత్రపిండాలను స్పష్టంగా సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన శరీర నిర్మాణ పదం.
- source_word: הַחֵלֶב
  choice: కొవ్వును
  rationale: లేవీయకాండంలోని బలి సందర్భంలో అర్పణ కోసం ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది; ‘కొవ్వు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: వాటి మీద—నడుము భాగంలో—ఉన్న
  rationale: కొవ్వు మూత్రపిండాల మీద ఉండడాన్నీ, దాని స్థానం నడుము/పార్శ్వ ప్రాంతంలో ఉండడాన్నీ రెండు సంబంధ వాక్యాల ప్రకారం నిలుపుతుంది.
- source_word: הַיֹּתֶרֶת
  choice: అనుబంధ భాగాన్ని
  rationale: ఇది కాలేయంతో సంబంధమున్న ఏ శరీర భాగమో ఖచ్చితంగా తెలియదు. ‘అనుబంధ భాగం’ నిర్దిష్టంగా ‘లోబు’ అని తేల్చకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న
  rationale: עַל యొక్క ప్రాథమిక స్థానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘అంటుకొని ఉన్న’ అని అనువదించడం కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: עַל הַכְּלָיוֹת
  choice: మూత్రపిండాలతో పాటు
  rationale: బలి విధాన సూత్రంలో ఈ భాగాన్ని మూత్రపిండాలతో కలిపి తొలగించాలనే కార్యవిధి భావాన్ని సహజంగా తెలియజేస్తుంది; పదబంధపు స్థానార్థం కూడా సాధ్యమే.
- source_word: יְסִירֶנָּה
  choice: అతడు తొలగించాలి
  rationale: హిఫిల్ క్రియలోని తొలగించే భావాన్నీ, ఆచార నియమంలోని విధి బలాన్నీ ఆధునిక తెలుగు న్యాయ/నిర్దేశక శైలిలో అందిస్తుంది.
