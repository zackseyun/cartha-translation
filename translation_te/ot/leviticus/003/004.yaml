translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బలి-విధి శైలి పాటించబడింది. శరీర నిర్మాణ పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడ్డాయి; మూలంలోని క్రమం సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో స్పష్టత కోసం డాష్‌లతో స్థాన సూచన వేరుచేయబడింది.
