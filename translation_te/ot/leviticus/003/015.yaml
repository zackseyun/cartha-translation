source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: te
  text: రెండు మూత్రపిండాలను, వాటిమీద ఉన్న నడుము భాగపు కొవ్వును, కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని[a] మూత్రపిండాలతో పాటు[b] అతడు తీసివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాలేయపు లోబును’ అని కూడా అనువదించవచ్చు. ఈ శరీర భాగానికి వాడిన హీబ్రూ పదం (יֹתֶרֶת) యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; అందుకే ప్రధాన పాఠంలో ‘అనుబంధ భాగం’ అని ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మూత్రపిండాల మీద.’ ఇక్కడ ఆ భాగాన్ని మూత్రపిండాలతో కలిపి తీసివేయాలని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలను
  rationale: బలి జంతువు శరీర నిర్మాణాన్ని సూచించే ఈ పదబంధంలో כְּלָיָה స్పష్టంగా ‘మూత్రపిండం’ అనే అర్థాన్నిస్తుంది; ద్వివచన భావాన్ని ‘రెండు’తో సహజంగా తెలిపాం.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: వాటిమీద ... ఉన్న కొవ్వును
  rationale: లేవీయకాండంలోని బలి సందర్భంలో חֵלֶב అర్పణ కోసం వేరుచేసే కొవ్వును సూచిస్తుంది; సంబంధవాచక వాక్యం అది మూత్రపిండాలపై ఉన్నదని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: నడుము భాగంలో ఉన్న
  rationale: כְּסָלִים ఇక్కడ జంతువు నడుము లేదా పార్శ్వ ప్రాంతాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకుడికి అర్థమయ్యేలా ‘నడుము భాగం’ అని ఇచ్చాం.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని
  rationale: יֹתֶרֶת అనే శరీర నిర్మాణ పదానికి ఖచ్చితమైన ఆధునిక అవయవ సమానార్థకం అనిశ్చితం. అందువల్ల ‘తమ్మె’ లేదా నిర్దిష్ట ‘లోబు’ అని అతిగా నిర్ణయించకుండా ‘అనుబంధ భాగం’ అని అనువదించాం.
- source_word: עַל הַכְּלָיֹת
  choice: మూత్రపిండాలతో పాటు
  rationale: עַל ప్రాథమికంగా ‘మీద’ అని అర్థమవగలిగినా, ఈ బలి విధి సూత్రంలో ఆ భాగాన్ని మూత్రపిండాలతో కలిపి తొలగించాలనే కార్యవిధి భావం సంభవిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ‘తో పాటు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְסִירֶנָּה
  choice: అతడు తీసివేయాలి
  rationale: סור హిఫిల్ రూపం ఇక్కడ ఆ భాగాలను తొలగించాలనే విధి ఆజ్ఞను తెలుపుతుంది. ‘తీసివేయాలి’ ఆధునిక తెలుగులో సహజమైన శాసనాత్మక ప్రయోగం.
