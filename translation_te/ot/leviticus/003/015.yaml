translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధికి తగిన గౌరవప్రదమైన శాసన శైలిని ఉపయోగించాం. శరీర నిర్మాణానికి సంబంధించిన అనిశ్చితిని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా పాదసూచికలో ప్రత్యామ్నాయాన్ని తెలిపాం.
