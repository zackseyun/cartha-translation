source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: te
  text: 'అతడు సమాధాన బలిలో[a] నుండి యాహ్వేకు అగ్న్యర్పణగా దాని కొవ్వును అర్పించాలి: మొత్తం కొవ్వుతో నిండిన తోకను[b] వెన్నెముక దగ్గర[c] తొలగించాలి; అలాగే పేగులను కప్పే కొవ్వును, పేగుల మీద ఉన్న కొవ్వంతటినీ అర్పించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలి,’ లేదా ‘క్షేమ బలి.’
    reason: lexical_alternative
  - marker: b
    text: ఇది బలిగా అర్పించే గొర్రెకు ఉండే వెడల్పైన, కొవ్వుతో నిండిన తోకను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా ‘వెన్నెముకకు ఎదురుగా’; బహుశా ‘వెన్నెముక చివర భాగంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి
  rationale: שְׁלָמִים అనే ఆచార సంబంధ పదంలో శాంతి, క్షేమం, సహవాసం అనే భావ పరిధి ఉంది. తెలుగు బైబిలు వాడుకతో కొనసాగింపును ఉంచుతూ, ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలిపేందుకు ‘సమాధాన బలి’ ఎంచుకున్నాం.
- source_word: אִשֶּׁה
  choice: అగ్న్యర్పణ
  rationale: బలిపీఠం మీద అగ్ని ద్వారా అర్పించే ఆచార అర్పణను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది; సాధారణ ఆహారం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దేవుని ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించాం.
- source_word: חֶלְבּוֹ
  choice: దాని కొవ్వును
  rationale: బలిగా అర్పించడానికి నిర్దేశించిన జంతువు కొవ్వు భాగాలను సూచించే సహజమైన స్వామ్య రూపం.
- source_word: הָאַלְיָה תְמִימָה
  choice: మొత్తం కొవ్వుతో నిండిన తోకను
  rationale: אַלְיָה గొర్రెలలో కనిపించే వెడల్పైన కొవ్వు తోకను సూచిస్తుంది; תְמִימָה అది మొత్తంగా, చెక్కుచెదరకుండా ఉండాలని తెలియజేస్తుంది.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: వెన్నెముక దగ్గర
  rationale: తోకను వెన్నెముక లేదా వెన్నెముక చివరి భాగానికి సంబంధించిన చోట వేరు చేయాలని తెలిపే ఆచరణాత్మక శరీర నిర్మాణ భావాన్ని ఇస్తుంది; హీబ్రూ సంబంధసూచక పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: יְסִירֶנָּה
  choice: కోసి తీయాలి
  rationale: హిఫీల్ రూపం ‘తొలగించాలి/వేరు చేయాలి’ అని అర్థం. ఈ శరీర భాగాన్ని బలి కోసం వేరు చేసే సందర్భంలో ‘కోసి తీయాలి’ సహజంగా ఉంది.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: పేగులను కప్పే కొవ్వును
  rationale: కֶרֶב ఇక్కడ అంతర్భాగాలను సూచిస్తుంది. సాధారణ పాఠకునికి స్పష్టంగా ఉండేందుకు ‘పేగులు’ వాడాం.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: పేగుల మీద ఉన్న కొవ్వంతటినీ
  rationale: పేగులను కప్పే కొవ్వుకు, వాటి మీద ఉండే కొవ్వంతటికీ మూలపాఠం చేసే సమాంతర ప్రస్తావనను నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం ఒడంబడిక నామాన్ని ప్రత్యక్షంగా వాడుతుంది. దాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా ఆమోదించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: שְׁלָמִים బలి పేరు
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదానికి శాంతి, సంపూర్ణ క్షేమం, సహవాసం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ఒకే సిద్ధాంతార్థానికి పరిమితం చేయకుండా ప్రధాన పాఠంలో సంప్రదాయంగా అర్థమయ్యే పదాన్ని ఉంచి, ఇతర సాధ్యమైన భావాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ఆచారపరమైన ఖచ్చితత్వం కోసం ‘అగ్న్యర్పణ,’ ‘అర్పించాలి’ అనే పదాలను ఉంచాం. మూలంలోని జాబితా నిర్మాణాన్ని ద్విబిందువు, అర్ధవిరామంతో స్పష్టంగా చూపించాం; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
