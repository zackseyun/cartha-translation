source:
  edition: WLC
  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: te
  text: 'దానిలోనుండి అతడు యాహ్వేకు ఆహార అర్పణగా[a] తన అర్పణను సమర్పించాలి: అంతర్భాగాలను కప్పి ఉన్న కొవ్వును, అంతర్భాగాల మీదనున్న కొవ్వంతటినీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్నిచే అర్పించే అర్పణ.” హీబ్రూ אִשֶּׁהను బలి సందర్భాల్లో సంప్రదాయంగా ఈ విధంగా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב מִמֶּנּוּ קָרְבָּנוֹ
  choice: దానిలోనుండి అతడు తన అర్పణను సమర్పించాలి
  rationale: הקריב అనే హిఫీల్ క్రియకు బలిసంబంధ సందర్భంలో ‘సమర్పించు’ సహజమైన అర్థం. מִמֶּנּוּ ముందున్న బలి జంతువును సూచిస్తుంది; קָרְבָּנוֹ సాంకేతిక బలి పదంగా ‘తన అర్పణ’గా అనువదించబడింది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణగా
  rationale: ఈ యాజక సంబంధ పదం అగ్నికి సంబంధించిన అర్పణను సూచిస్తుంది. ‘అగ్నితో అర్పించే అర్పణ’ అనే రూపం సాంప్రదాయ అర్థాన్ని కాపాడుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: లామెద్ ఉపసర్గ సమర్పణను స్వీకరించేవారిని సూచిస్తుంది; దైవనామం יהוה ను వ్యక్తిగత నామంగా ‘యెహోవా’ అని ఇచ్చాం.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: అంతర్భాగాలను కప్పి ఉన్న కొవ్వును
  rationale: חֵלֶב బలిలో ప్రత్యేకంగా తీసే కొవ్వును, קֶרֶב ఉదరంలోని అంతర్భాగాలను సూచిస్తాయి. సంబంధక కృదంతాన్ని సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చాం.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: అంతర్భాగాల మీద ఉన్న కొవ్వంతటినీ
  rationale: עַל యొక్క స్థానార్థాన్ని ‘మీద’గా నిలిపి, כָּל యొక్క సమగ్రతను ‘కొవ్వంతటినీ’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం. ఆధునిక తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אִשֶּׁה యొక్క భావం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదం అగ్నికి సంబంధించిన బలి అర్పణను సూచించినప్పటికీ దాని వ్యుత్పత్తి, ఖచ్చిత సూక్ష్మార్థం చర్చనీయమైనవి. ఈ సందర్భంలో బలిభాగాలు దహించబడుతున్నందున అగ్ని సంబంధ భావాన్ని ప్రధాన పాఠంలో ఉంచి, ‘ఆహార అర్పణ’ అనే వివరణాత్మక అర్థాన్ని బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యాజక ధర్మశాస్త్రపు గంభీరతను నిలిపే స్పష్టమైన శైలి. శరీర నిర్మాణాన్ని సూచించే קֶרֶב కు అతిగా రూఢిగా వినిపించే పదాల బదులు ‘అంతర్భాగాలు’ వాడాం. మూలంలోని జాబితా నిర్మాణాన్ని తెలుగులో పూర్తి వాక్యంగా స్పష్టపరచడానికి చివర ‘సమర్పించాలి’ని పునరుక్తం చేశాం.
