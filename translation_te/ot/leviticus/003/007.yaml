  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: te
  text: అతడు తన అర్పణగా గొర్రెను[a] అర్పిస్తున్నట్లయితే, దానిని యాహ్వే సన్నిధిలో అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొర్రెపిల్లను’.
    reason: כֶּשֶׂב అనే పదం సందర్భానుసారం గొర్రె లేదా గొర్రెపిల్లను సూచించగల పదార్థ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: אִם
  choice: అర్పిస్తున్నట్లయితే
  rationale: బలి సూచనల్లోని షరతుతో కూడిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֶּשֶׂב
  choice: గొర్రె
  rationale: ఈ పదం గొర్రెను, సందర్భానుసారం గొర్రెపిల్లను కూడా సూచించగలదు. వయస్సును అనవసరంగా నిర్దిష్టం చేయకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: מַקְרִיב
  choice: అర్పిస్తున్న
  rationale: హిఫీల్ కృదంతంలోని సమర్పించడం లేదా దగ్గరకు తీసుకురావడం అనే భావాన్ని, సందర్భాన్ని నెలకొల్పే కొనసాగుతున్న క్రియగా సహజంగా తెలుపుతుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణగా
  rationale: దేవుని సమక్షానికి తీసుకువచ్చే కానుక అనే సాధారణ బలిసంబంధ అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִקְרִיב
  choice: అర్పించాలి
  rationale: న్యాయసంబంధ సూచనలోని ఆజ్ఞాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో యాహ్వే ఎదుట లేదా ఆయన సమక్షంలో సమర్పించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా ప్రతిలిపి చేయడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ధార్మిక శైలి. ‘అర్పణ’ పదాన్ని קָרְבָּן మరియు קרב పదకుటుంబ సంబంధాన్ని వీలైనంత వరకు ప్రతిబింబించేలా పునరావృతం చేశాం; ‘సన్నిధిలో’ ఆరాధనా సందర్భానికి సహజమైన రూపం.
