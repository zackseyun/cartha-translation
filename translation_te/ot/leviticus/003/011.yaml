  - severity: low
    issue: Footnote’s literal phrase is syntactically awkward in Telugu
    rationale: “అగ్న్యర్పణ యొక్క రొట్టె” is understandable, but “అగ్న్యర్పణకు సంబంధించిన రొట్టె” more naturally conveys the Hebrew construct relationship while still identifying ‘bread’ as the literal lexical term.
