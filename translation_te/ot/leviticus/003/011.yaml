source:
  edition: WLC
  text: וְ/הִקְטִיר֥/וֹ הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֥חֶם אִשֶּׁ֖ה לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: te
  text: యాజకుడు దానిని బలిపీఠం మీద దహించి పొగగా అర్పించాలి. అది యెహోవాకు అగ్ని ద్వారా అర్పించే ఆహారం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యెహోవాకు అగ్న్యర్పణకు సంబంధించిన రొట్టె.” ఇక్కడ “రొట్టె” అనే పదం బలియర్పణ వ్యవస్థలో నుడికారంగా “ఆహారం” అనే అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: దానిని పొగగా పైకి లేచేలా దహించాలి
  rationale: קטר హిఫీల్ రూపం బలిపీఠం మీద అర్పణను కాల్చి పొగగా పైకి లేపడాన్ని సూచిస్తుంది. ఈ అనువాదం దహనక్రియతో పాటు మూలంలోని పొగ భావాన్ని కూడా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనాపరమైన సందర్భంలో כֹּהֵןకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశార్థక ה మరియు బలియర్పణ ప్రక్రియను బట్టి, అర్పణను బలిపీఠం మీద దహించడమే ఉద్దేశం.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: లֶחֶם సాధారణంగా ‘రొట్టె’ అని అర్థమైనా, ఇక్కడ బలియర్పణ సంబంధమైన నుడికారంలో బలిపీఠంపై దేవునికి అర్పించే భాగాన్ని ‘ఆహారం’గా సూచిస్తుంది; ఇది నిజమైన రొట్టె అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్ని ద్వారా అర్పించే
  rationale: ఇది అగ్ని ద్వారా సమర్పించే బలియర్పణను సూచించే సాంకేతిక ఆరాధనా పదం. తెలుగు వాక్యంలో విశేషణ పదబంధంగా ఇవ్వడం సహజంగా ఉండి ఆచారార్థాన్ని కాపాడుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, ל ఉపసర్గంలోని సమర్పణార్థాన్ని ‘కు’తో వ్యక్తం చేసింది.
theological_decisions:
- issue: לֶחֶם אִשֶּׁה అనే బలియర్పణ నుడికారం
  choice: అది యెహోవాకు అగ్ని ద్వారా అర్పించే ఆహారం
  alternative: అది యెహోవాకు అగ్న్యర్పణకు చెందిన రొట్టె
  rationale: ‘ఆహారం’ అనే పదం బలిపీఠంపై దేవునికి చెందే భాగాన్ని రూపకాలంకారంగా సూచిస్తుంది; దేవునికి భౌతిక పోషణ అవసరమనే భావాన్ని కలిగించదు. అదే సమయంలో ‘అగ్ని ద్వారా అర్పించే’ అనే మాట אִשֶּׁה యొక్క ఆచార సంబంధ అర్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే బలియర్పణ సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని పొగగా పైకి లేపే భావాన్ని ప్రధాన వాక్యంలో స్పష్టంగా ఉంచి, ‘రొట్టె’ అనే అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచింది.
