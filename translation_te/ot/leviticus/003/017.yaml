revisions:
- from: ఇది మీ తరతరాలకు, మీరు నివసించే ప్రతి చోటా శాశ్వతమైన శాసనంగా ఉండాలి:[a] మీరు ఏ కొవ్వునూ, ఏ రక్తాన్నీ తినకూడదు.
  to: ఇది మీ తరతరాలన్నిటికీ, మీరు నివసించే ప్రతి చోటా శాశ్వతమైన శాసనం:[a] మీరు కొవ్వునుగానీ రక్తాన్నిగానీ తినకూడదు.
  rationale: The revision changes the legal formula from a potentially prospective “should be a statute” construction to a direct declaration that matches the Hebrew. It also makes the paired prohibition more idiomatic while retaining its comprehensive scope. The footnote anchor remains attached to the rendering of עוֹלָם, and its content preserves the lexical ambiguity.
