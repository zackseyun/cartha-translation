id: LEV.3.17
reference: Leviticus 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: te
  text: ఇది మీ తరతరాలన్నిటికీ, మీరు నివసించే ప్రతి చోటా శాశ్వతమైన శాసనం:[a] మీరు కొవ్వునుగానీ రక్తాన్నిగానీ తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎల్లకాలం నిలిచే శాసనం” లేదా “నిరంతరం అమలులో ఉండే శాసనం.” న్యాయసంబంధ సందర్భాల్లో హెబ్రీ עוֹלָם అనే పదం దీర్ఘకాలం కొనసాగుతూ ఉండే చెల్లుబాటును తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: శాసనం
  rationale: స్థిరంగా నిర్దేశించబడిన నియమం అనే న్యాయపరమైన, నిబంధనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עוֹלָם
  choice: శాశ్వతమైన
  rationale: ఈ న్యాయసూత్రంలో తరతరాలుగా కొనసాగవలసిన స్థిరమైన చెల్లుబాటును తెలియజేస్తుంది; పదానికి ఉండగల కాలవ్యాప్తి భేదాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: వరుసగా వచ్చే తరాలన్నిటికీ ఈ శాసనం వర్తిస్తుందనే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రతి చోటా
  rationale: అన్ని నివాస స్థలాల్లో అనే పరిధిని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל חֵלֶב
  choice: ఏ కొవ్వునూ
  rationale: నిషేధ వాక్యంలో כָּל యొక్క సమగ్ర భావాన్ని తెలుగు వ్యతిరేక సర్వనామ నిర్మాణంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְכָל דָּם
  choice: ఏ రక్తాన్నీ
  rationale: ముందటి పదబంధానికి సమాంతరంగా, రక్తం మొత్తంపై ఉన్న నిషేధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: తినకూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అధికారపూర్వకంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עוֹלָם సూచించే ఆజ్ఞ కాలవ్యాప్తి
  choice: శాశ్వతమైన శాసనం
  alternative: ఎల్లకాలం నిలిచే శాసనం; నిరంతరం అమలులో ఉండే శాసనం
  rationale: హెబ్రీ న్యాయసూత్రం తరతరాలుగా కొనసాగే స్థిర చెల్లుబాటును నొక్కిచెబుతుంది. ‘శాశ్వతమైన’ ఆ బలాన్ని నిలుపుతుంది; అది తప్పనిసరిగా తాత్త్వికమైన అనంతకాలాన్ని మాత్రమే సూచిస్తుందని తేల్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. మూలంలోని న్యాయసూత్ర ధోరణి, తరతరాల పరిధి, అన్ని నివాస స్థలాలకు వర్తింపు, కొవ్వు మరియు రక్తంపై సమగ్ర నిషేధం నిలుపబడ్డాయి.
