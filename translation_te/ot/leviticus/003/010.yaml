translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధికి తగిన గంభీరమైన నిర్దేశక శైలిని ఉపయోగించాం. శరీర నిర్మాణ పదాల విషయంలో సాధారణ పాఠకులకు అర్థమయ్యే భాషను ఎంచుకొని, יֹתֶרֶתలోని నిజమైన అనిశ్చితిని పాదసూచికతో నిలిపాం.
