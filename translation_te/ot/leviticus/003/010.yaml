id: LEV.3.10
reference: Leviticus 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: te
  text: రెండు మూత్రపిండాలను, వాటిపైను నడుము భాగంపైను ఉన్న కొవ్వును, కాలేయంపై ఉన్న అనుబంధ భాగాన్ని[a] అతడు మూత్రపిండాలతో పాటు తీసివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాలేయంపై ఉన్న లోబును.” ఈ శరీర భాగానికి వాడిన హీబ్రూ పదం (יֹתֶרֶת) యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; అందువల్ల ప్రధాన పాఠంలో “అనుబంధ భాగం” అని ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలను
  rationale: బలి జంతువు అంతర్గత అవయవాల సందర్భంలో כְּלָיֹת స్పష్టంగా మూత్రపిండాలను సూచిస్తుంది.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: వాటి మీద ... ఉన్న కొవ్వును
  rationale: లేవీయకాండంలోని బలి సందర్భంలో חֵלֶב అర్పణకు ప్రత్యేకించిన అంతర్గత కొవ్వును సూచిస్తుంది; సరళమైన ‘కొవ్వు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: నడుము కండరాల దగ్గర
  rationale: כְּסָלִים నడుము/పార్శ్వ భాగాన్ని సూచిస్తుంది. తెలుగు శరీర నిర్మాణ వర్ణనలో ‘నడుము కండరాల దగ్గర’ సహజంగా ఉండి స్థల సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని
  rationale: יֹתֶרֶת యొక్క ఖచ్చితమైన శరీర నిర్మాణ సూచన అనిశ్చితం. ‘అనుబంధ భాగం’ దానిని నిర్దిష్టంగా ‘లోబు’ అని నిర్ణయించకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: అతడు మూత్రపిండాలతో పాటు తీసివేయాలి
  rationale: ఈ బలి విధి సూత్రంలో עַל అనుబంధంగా/కలిపి తీసివేయడాన్ని సూచిస్తుంది; Hiphil יְסִירֶנָּהకు ‘తీసివేయాలి’ విధి నిర్దేశక భావాన్ని సహజంగా అందిస్తుంది.
