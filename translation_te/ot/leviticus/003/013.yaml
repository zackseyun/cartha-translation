  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: te
  text: అతడు దాని తలపై తన చేయి ఉంచి, సమావేశపు గుడారం ఎదుట దాన్ని వధించాలి. అప్పుడు అహరోను కుమారులు దాని రక్తాన్ని బలిపీఠం చుట్టూ విసరాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని రక్తాన్ని బలిపీఠం చుట్టూ చిమ్మాలి.” ఇక్కడి హీబ్రూ క్రియ బలి ఆచార సందర్భంలో రక్తాన్ని బలిపీఠంపైకి విసరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ עַל־רֹאשׁוֹ
  choice: దాని తలపై తన చెయ్యి ఉంచి
  rationale: బలి అర్పించే వ్యక్తి జంతువు తలపై తన ఒక్క చెయ్యి ఉంచే ఆచారక్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూలోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: וְשָׁחַט אֹתוֹ
  choice: దాన్ని వధించాలి
  rationale: שׁחט సాధారణంగా చంపడం మాత్రమే కాక, బలికి సంబంధించిన విధిపూర్వక వధను సూచిస్తుంది; ‘వధించాలి’ ఆ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ఎదుట
  rationale: స్థలసూచకమైన לִפְנֵי భావాన్ని ‘ఎదుట’ స్పష్టంగా అందిస్తుంది. אֹהֶל מוֹעֵד అనే ఆరాధనా స్థలపేరును దాని ప్రాథమిక అర్థానికి దగ్గరగా ‘సమావేశ గుడారం’గా అనువదిస్తుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని అధికారిక యాజక వంశసూచనను నేరుగా నిలుపుతుంది.
- source_word: וְזָרְקוּ אֶת־דָּמוֹ עַל־הַמִּזְבֵּחַ סָבִיב
  choice: దాని రక్తాన్ని బలిపీఠం అన్ని వైపులా చిమ్మాలి
  rationale: זרק ఇక్కడ రక్తాన్ని బలిపీఠంపైకి విసిరి పూయించే బలి ఆచారాన్ని సూచిస్తుంది. తెలుగులో ‘చిమ్మాలి’ సహజంగా ఆ చలనాన్ని తెలియజేస్తుంది; ‘అన్ని వైపులా’ అనే మాట סביב యొక్క విస్తార భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విధిశైలిని ఉపయోగించాం. బలి ఆచారానికి సంబంధించిన సాంకేతిక భావాన్ని కాపాడుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం.
