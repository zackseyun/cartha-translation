    reason: lexical_alternative
  revision_rationale: The revision corrects the principal lexical rendering of זרק, improves the natural Telugu form of ‘tent of meeting,’ and retains the draft’s source-faithful singular hand, animal pronouns, priestly designation, and ritual register. The footnote now presents ‘చిమ్మాలి’ as an alternative rather than making it the primary rendering.
