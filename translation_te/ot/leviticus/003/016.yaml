  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: te
  text: యాజకుడు వాటిని బలిపీఠం మీద దహించాలి; అవి అగ్నిబలి ఆహారం, యాహ్వేకు ఇంపైన సువాసన.[a] కొవ్వంతా యాహ్వేదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అగ్ని-అర్పణకు ఆహారం; శాంతికరమైన సువాసన కొరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: వాటిని ... దహించి పొగగా పైకి లేపాలి
  rationale: హిఫీల్ రూపంలోని קטר బలుల సందర్భంలో బలిపీఠం మీద దహించి పొగగా పైకి లేపడాన్ని సూచిస్తుంది. 3 పురుష బహువచన ప్రత్యయాన్ని ‘వాటిని’గా నిలిపి, ముందటి వచనాల్లో పేర్కొన్న బలి భాగాలతో అనుసంధానించాం.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశ/స్థల సూచక ה ఇక్కడ దహనం జరిగే స్థలాన్ని సూచిస్తుంది; తెలుగులో ‘మీద’ సహజమైనది.
- source_word: לֶחֶם אִשֶּׁה
  choice: ఆహారంగా, ... అగ్నిబలి
  rationale: לֶחֶם ఇక్కడ రొట్టె అనే సంకుచిత అర్థం కాకుండా ఆహారాన్ని సూచిస్తుంది; אִשֶּׁה అగ్ని ద్వారా అర్పించే బలి. మూలంలోని సన్నిహిత సంబంధాన్ని ప్రధాన పాఠంలో ఉంచి, అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: స్థిరమైన బలి సూత్రంలోని రూపకాన్ని అలాగే ఉంచుతూ, దేవునికి ఆమోదకరమైనదనే భావాన్ని అతిగా వివరణ చేయకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל חֵלֶב
  choice: కొవ్వంతా
  rationale: כָּל యొక్క సమగ్ర బలాన్ని నిలిపి, సందర్భంలోని బలికి సంబంధించిన కొవ్వు భాగాలన్నిటినీ సూచిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకే చెందుతుంది
  rationale: ל అంకితం/స్వామ్య భావాన్ని సూచిస్తుంది. ‘-కే చెందుతుంది’ సహజ తెలుగులో ప్రత్యేకంగా యెహోవాకు కేటాయించబడినదనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉన్నందున బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలిపాం. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: לְרֵיחַ נִיחֹחַ అనే బలి సూత్రం
  choice: ఇంపైన సువాసన కలిగించే
  alternative: శాంతినిచ్చే సువాసనగా; మధురమైన సువాసనగా
  rationale: దేవుని ఆమోదాన్ని సూచించే బలి రూపకాన్ని ప్రధాన పాఠంలో వివరించి పరిష్కరించకుండా, దాని సహజ చిత్రణను నిలిపాం.
- issue: כָּל חֵלֶב לַיהוָה యొక్క స్వామ్య/అంకిత భావం
  choice: కొవ్వంతా యెహోవాకే చెందుతుంది
  alternative: కొవ్వంతా యెహోవా కొరకు
  rationale: లామెద్‌లోని అంకితం మరియు స్వామ్య భావాలలో ఒకదానిని పూర్తిగా తొలగించకుండా, సందర్భానుసారంగా యెహోవాకు ప్రత్యేకంగా కేటాయించబడినదనే భావాన్ని స్పష్టమైన తెలుగులో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే బలుల ఆచారానికి తగిన గంభీరతతో రూపొందించబడింది. ‘దహించి పొగగా పైకి లేపాలి’ మూల క్రియలోని బలి సంబంధిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
