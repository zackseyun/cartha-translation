id: LEV.3.3
reference: Leviticus 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: te
  text: సమాధాన బలి నుండి అతడు యాహ్వేకు అగ్న్యర్పణగా[a] అంతర్భాగాలను కప్పివున్న కొవ్వును, అంతర్భాగాల మీద ఉన్న కొవ్వంతటినీ అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆహార అర్పణ.’ ‘అగ్నిచేత అర్పించే అర్పణ’ అని కూడా అనువదించవచ్చు.
    reason: אִשֶּׁה అనే బలిసంబంధ పదానికి అగ్నితో అర్పించే బలి అనే సంప్రదాయ భావంతో పాటు దేవునికి సమర్పించే ఆహార కానుక అనే ఆచారపరమైన భావవ్యాప్తి కూడా ఉంది.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: అతడు అర్పించాలి
  rationale: హిఫిల్ రూపం బలిసంబంధ సందర్భంలో ఆచారపూర్వకంగా సమర్పించడం లేదా అర్పించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: సమాధాన బలి నుండి
  rationale: זֶבַח వధించి అర్పించే బలిని సూచిస్తుంది; שְׁלָמִים సంప్రదాయంగా సమాధాన బలి అనే బలివర్గాన్ని సూచిస్తుంది. ఈ పదబంధం మూలంలోని ‘నుండి’ భావాన్నీ నిలుపుతుంది.
- source_word: אִשֶּׁה
  choice: అగ్నిలో అర్పించే అర్పణగా
  rationale: ఈ పదం అగ్ని ద్వారా పొగగా పైకి వెళ్లే బల్యర్పణను సూచిస్తుంది. ‘అగ్నిలో అర్పించే అర్పణ’ మూలంలోని అగ్ని అంశాన్ని స్పష్టంగా ఉంచి, తెలుగులో అపార్థం రాకుండా చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం; బిరుదుగా మార్చలేదు.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: అంతర్భాగాలను కప్పివున్న కొవ్వును
  rationale: חֵלֶב ఇక్కడ బలికి ప్రత్యేకించిన కొవ్వును, קֶרֶב జంతువు లోపలి అవయవాలు లేదా అంతర్భాగాలను సూచిస్తాయి. క్రియావిశేషణ రూపంలోని ‘కప్పివున్న’ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: అంతర్భాగాల మీద ఉన్న కొవ్వంతటినీ
  rationale: మూలంలోని כָּל అనే సమగ్రతను ‘కొవ్వంతటినీ’ స్పష్టంగా తెలియజేస్తుంది; עַל అనే స్థానసంబంధాన్ని ‘మీద ఉన్న’గా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను మరింత సమీపంగా ప్రతిబింబించే ప్రత్యామ్నాయం.
- issue: אִשֶּׁה అనే బలిసంబంధ పదం
  choice: అగ్నిలో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదం అగ్నితో సంబంధమున్న బల్యర్పణను సూచించినా, దాని ఖచ్చిత వ్యుత్పత్తి మరియు భావవ్యాప్తిపై చర్చ ఉంది. ప్రధాన పాఠంలో అగ్ని అంశాన్ని నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: שְׁלָמִים బలివర్గం
  choice: సమాధాన బలి
  alternative: సహవాస బలి / క్షేమ బలి
  rationale: ఈ పదం సమాధానం, సంపూర్ణ క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. స్థిరపడిన తెలుగు బలివర్గ నామంగా ‘సమాధాన బలి’ని ఉంచి, దాని భావాన్ని ఒక్క సిద్ధాంత వ్యాఖ్యానానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలివిధికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. శరీర నిర్మాణానికి సంబంధించి అతిగా సాంకేతికమైన ‘ఆంత్రములు’ కంటే విస్తృతార్థకమైన ‘అంతర్భాగాలు’ ఎంచుకున్నాం. పాదటిప్పణి సూచిక [a] ప్రధాన వాక్యంలో ఉంచబడింది.
