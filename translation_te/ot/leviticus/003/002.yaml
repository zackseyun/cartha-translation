  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: te
  text: అతడు తన బలి జంతువు తలపై తన చెయ్యి ఉంచి, ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం వద్ద దాన్ని వధించాలి.[a] అహరోను కుమారులైన యాజకులు ఆ రక్తాన్ని బలిపీఠం మీద, దాని చుట్టూ అన్ని వైపులా విసరాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రత్యక్షపు గుడారపు ద్వారం వద్ద.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ రక్తాన్ని బలిపీఠం మీద, దాని చుట్టూ అన్ని వైపులా చిమ్మాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: చెయ్యి ఉంచి
  rationale: బలి సందర్భంలో סמך జంతువు తలపై చెయ్యి ఉంచడాన్ని, కొంత ఒత్తిడి పెట్టడాన్ని సూచించవచ్చు. తెలుగు ప్రధాన పాఠ్యంలో సహజమైన విస్తృత అర్థం గల ‘చెయ్యి ఉంచి’ సరిపోతుంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: ఏకవచన నామానికి మూడవ పురుష ఏకవచన ప్రత్యయం ఉంది; అర్పించేవాని ఒక్క చెయ్యిని యథార్థంగా తెలియజేస్తుంది.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: తన అర్పణ జంతువు తలమీద
  rationale: קָרְבָּן సాధారణంగా దేవుని దగ్గరకు తీసుకొచ్చే అర్పణ. ఇక్కడ తరువాత ‘దాన్ని వధించాలి’ అని ఉండటం వల్ల అది జంతువని తెలుగులో స్పష్టం చేయడం సహజం; ‘అర్పణ’ అనే విస్తృత భావమూ నిలుస్తుంది.
- source_word: וּשְׁחָטוֹ
  choice: దాన్ని వధించాలి
  rationale: שׁחט బలిగా అర్పించే జంతువును విధిపూర్వకంగా వధించడాన్ని సూచిస్తుంది; సాధారణ ‘చంపాలి’ కంటే ‘వధించాలి’ సందర్భోచితం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అనేది తెరువు, ద్వారం లేదా ప్రవేశస్థలాన్ని సూచిస్తుంది. אֹהֶל מוֹעֵדకు తెలుగు బైబిలు వాడుకలో స్థిరమైన ‘ప్రత్యక్ష గుడారం’ను తీసుకుని, స్థలార్థాన్ని సహజంగా తెలిపేందుకు ‘ప్రవేశద్వారం దగ్గర’ అని అనువదించాం.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులు
  rationale: హీబ్రూ అనుబంధ పదబంధం అహరోను కుమారులను యాజకులుగా గుర్తిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘యాజకులైన’ సహజంగా అదే సంబంధాన్ని నిలుపుతుంది.
- source_word: וְזָרְקוּ
  choice: చల్లాలి
  rationale: זרק ఇక్కడ రక్తాన్ని బలిపీఠం వైపు విసిరి దానిమీద పడేలా చేసే ఆచార చర్య. తెలుగు ‘చల్లాలి’ ఆ చర్యను సహజంగా తెలియజేస్తుంది; ఇది సన్నని బిందువులుగా ‘ప్రోక్షించడం’ అనే ప్రత్యేక భావానికే పరిమితం కాదు.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠం చుట్టూ దాని మీద
  rationale: עַל లక్ష్య ఉపరితలాన్ని, סָבִיב బలిపీఠం చుట్టుపక్కలన్నిటినీ సూచిస్తాయి. తెలుగు పదక్రమం రక్తం బలిపీఠం చుట్టూ దాని మీద పడే చర్యను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలి రక్తాన్ని బలిపీఠానికి వర్తింపజేసే ఆచార చర్య
  choice: ఆ రక్తాన్ని బలిపీఠం చుట్టూ దాని మీద చల్లాలి
  alternative: ఆ రక్తాన్ని బలిపీఠం చుట్టూ దానిపై విసరాలి
  rationale: זרק యొక్క ప్రాథమిక విసరడం/చల్లడం భావాన్ని నిలుపుతూ, వేరొక సాంకేతిక ఆచారాన్ని సూచించేలా ‘ప్రోక్షించాలి’ అని అనువదించలేదు. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు కోసం ‘చల్లాలి’ను ఉంచి, మరింత పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: చెయ్యి ఉంచే చర్యలో ఒత్తిడి భావం
  choice: తన చెయ్యి ఉంచి
  alternative: తన చెయ్యి ఆనించి/నొక్కి
  rationale: సందర్భంలో ఒత్తిడి ఉండవచ్చుగాని, క్రియ ఎంత ఒత్తిడిని నిర్దేశిస్తుందో పాఠ్యం స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞార్థక విధిని ‘చేయాలి’ రూపాలతో తెలిపాం. ‘ప్రత్యక్ష గుడారం,’ ‘యాజకులు,’ ‘బలిపీఠం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అసహజమైన అతిసంస్కృత నిర్మాణాలను నివారించాం.
