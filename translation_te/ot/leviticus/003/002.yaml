revisions:
- from: అతడు తన అర్పణ జంతువు తలమీద తన చెయ్యి ఉంచి, ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర దాన్ని వధించాలి.[a] అప్పుడు యాజకులైన అహరోను కుమారులు ఆ రక్తాన్ని బలిపీఠం చుట్టూ దాని మీద చల్లాలి.[b]
  to: అతడు తన బలి జంతువు తలపై తన చెయ్యి ఉంచి, ప్రత్యక్షపు గుడారపు ప్రవేశద్వారం వద్ద దాన్ని వధించాలి.[a] అహరోను కుమారులైన యాజకులు ఆ రక్తాన్ని బలిపీఠం మీద, దాని చుట్టూ అన్ని వైపులా విసరాలి.[b]
