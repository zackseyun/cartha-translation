- from: అతడు తన అర్పణ జంతువు తలమీద తన చెయ్యి ఉంచి, ప్రత్యక్ష గుడారం ఎదుట దానిని వధించాలి. అప్పుడు అహరోను కుమారులు దాని రక్తాన్ని బలిపీఠం చుట్టూ దాని మీదికి చిమ్మాలి.[a]
  to: అతడు తన అర్పణ జంతువు తలపై తన చేతిని ఉంచి, సమావేశ గుడారం ఎదుట దానిని వధించాలి. అప్పుడు అహరోను కుమారులు దాని రక్తాన్ని బలిపీఠం చుట్టూ అన్ని వైపులా విసరాలి.[a]
  rationale: రక్తాన్ని బలంగా విసిరే క్రియను మూలానికి మరింత సమీపంగా చేయడానికి ‘విసరాలి’గా మార్చాను; బలిపీఠం చుట్టూ అన్నివైపులా జరిగే చర్యను స్పష్టం చేశాను. సమావేశ స్థలానికి సంబంధించిన హీబ్రూ పేరులోని ప్రాథమిక అర్థాన్ని చూపేందుకు ‘సమావేశ గుడారం’ను వాడాను. చేతి ఉంచే చర్యకు లేదా బలికి ఏ వేదాంత వివరణనూ చేర్చలేదు.
