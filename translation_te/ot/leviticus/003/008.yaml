source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: te
  text: అతడు తన అర్పణ జంతువు తలపై తన చేతిని ఉంచి, సమావేశ గుడారం ఎదుట దానిని వధించాలి. అప్పుడు అహరోను కుమారులు దాని రక్తాన్ని బలిపీఠం చుట్టూ అన్ని వైపులా విసరాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విసరాలి’ అనే హీబ్రూ క్రియ రక్తాన్ని బలంగా విసిరి బలిపీఠానికి తగిలించే ఆచార చర్యను సూచిస్తుంది; అది మెల్లగా చల్లడాన్ని మాత్రమే సూచించదు. ‘చిమ్మాలి’ లేదా ‘చల్లాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: చెయ్యి ఉంచి
  rationale: బలి సందర్భంలో జంతువు తలమీద చెయ్యి ఉంచే ఆచార చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఎంత ఒత్తిడి పెట్టారో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, కర్తకే చెందిన చెయ్యి అని తెలుగులో స్పష్టంగా చెబుతుంది.
- source_word: רֹאשׁ
  choice: తలమీద
  rationale: బలి జంతువు శరీర భాగానికి సంబంధించిన సాధారణ అర్థం.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణ జంతువు
  rationale: קָרְבָּן అంటే దేవునికి సమర్పించడానికి తీసుకొచ్చిన అర్పణ. ఈ వాక్యంలో దానిని వధించడం, దాని రక్తం ప్రస్తావించబడడం వల్ల అది జంతువు అని తెలుగులో స్పష్టం చేయడం సహజం.
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: బలి జంతువును ఆచారబద్ధంగా చంపడాన్ని సూచించే సాంకేతిక భావాన్ని కేవలం 'చంపాలి' కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: స్థల సంబంధమైన 'ముందు/సన్నిధిలో' అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నిర్దిష్ట పవిత్ర గుడారానికి తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పేరు.
- source_word: וְזָרְקוּ
  choice: చిమ్మాలి
  rationale: రక్తాన్ని బలిపీఠం మీదికి బలంగా విసిరే ఆచార చర్యను తెలుగులో సహజంగా సూచిస్తుంది; ఇది సున్నితంగా చల్లడమనే భావానికి మాత్రమే పరిమితం కాదు. ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: హీబ్రూలోని పురుష కుటుంబ సంబంధాన్ని విస్తరించకుండా లేదా తటస్థీకరించకుండా నేరుగా నిలుపుతుంది.
- source_word: דָּמוֹ
  choice: దాని రక్తాన్ని
  rationale: సర్వనామ ప్రత్యయం బలి జంతువునే సూచిస్తుంది; తెలుగులో జంతువుకు 'దాని' సహజం.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం ... దాని మీదికి
  rationale: זרקతో కలిసి రక్తాన్ని బలిపీఠానికి తగిలేలా విసరడాన్ని సూచిస్తుంది; కేవలం పైభాగంలో ఉంచడమనే భావాన్ని ఇవ్వదు.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: రక్తాన్ని బలిపీఠం అన్ని వైపులా వర్తింపజేసే పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బలి సందర్భంలో చెయ్యి ఉంచే ఆచారం
  choice: ‘తలమీద తన చెయ్యి ఉంచి’ అని చర్యను మాత్రమే అనువదించడం
  alternative: అపరాధ బదిలీ, ప్రతినిధిత్వం లేదా గుర్తింపును సూచించే వివరణాత్మక అనువాదం
  rationale: ఈ వాక్యం ఆచార చర్యను చెబుతుంది గాని దాని వేదాంత అర్థాన్ని వివరించదు. అందుచేత మూలంలోని వేదాంత విస్తృతిని నిలుపుతూ వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
- issue: בְּנֵי אַהֲרֹן అనే లింగ-కుటుంబ పదబంధం
  choice: అహరోను కుమారులు
  alternative: అహరోను సంతానం; అహరోను యాజకులు
  rationale: హీబ్రూ ప్రత్యేకంగా ‘కుమారులు’ అని చెబుతుంది. విస్తృతమైన లేదా వృత్తిపరమైన పదంతో మార్చితే మూలంలోని కుటుంబ సంబంధం మరుగుపడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆచార భాష. ‘ప్రత్యక్ష గుడారం’, ‘బలిపీఠం’, ‘వధించాలి’ వంటి బైబిలు సందర్భానికి తగిన పదాలను వాడుతూ, వ్యాఖ్యానాత్మక వేదాంతాన్ని పాఠ్యంలో చేర్చలేదు.
