id: LEV.3.12
reference: Leviticus 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֥ם עֵ֖ז קָרְבָּנ֑/וֹ וְ/הִקְרִיב֖/וֹ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: te
  text: అతని అర్పణ మేకయైతే, అతడు దానిని యాహ్వే[a] సన్నిధిలో సమర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: YHWH అనే దైవనామం; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామాన్ని స్పష్టీకరించి, సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ఈ సంధి-షరతు పదబంధం బలి సూచనల వరుసలో తదుపరి సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అయితే’ సహజంగా ఆ షరతును తెలియజేస్తుంది.
- source_word: עֵז
  choice: మేక
  rationale: ఈ ఏకవచన నామవాచకం మేకను సూచిస్తుంది; తెలుగు సందర్భంలో అదనపు అనిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: קָרְבָּן అనేది దేవుని ఎదుటకు తీసుకువచ్చే అర్పణకు వాడే విస్తృత పదం. ‘బలి’ కంటే ‘అర్పణ’ మూలపదపు విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְהִקְרִיבוֹ
  choice: అతడు దానిని ... సమర్పించాలి
  rationale: קרב హిఫీల్ రూపం దగ్గరకు తీసుకురావడం లేదా అర్పణగా సమర్పించడం అనే భావాన్ని ఇస్తుంది. ధర్మశాస్త్ర సూచనలోని ఆదేశార్థక బలాన్ని ‘సమర్పించాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో దేవుని ఎదుట లేదా సమక్షంలో సమర్పించడాన్ని ‘సన్నిధిలో’ సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం; అది బిరుదుతో భర్తీ చేయబడలేదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉంచాం; ‘యాహ్వే’ అనే ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘అర్పణ’, ‘సన్నిధిలో’, ‘సమర్పించాలి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి ఆరాధనా సందర్భాన్ని నిలుపుతాయి.
