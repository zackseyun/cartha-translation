id: LEV.3.1
reference: Leviticus 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: te
  text: “అతని అర్పణ సమాధాన బలి అయితే, అతడు గోవుల మందనుండి అర్పించినప్పుడు, అది మగదైనా ఆడదైనా, లోపంలేనిదాన్ని యాహ్వే సన్నిధిలో అర్పించాలి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: సమాధాన బలి
  rationale: זֶבַח అంటే ‘బలి’; שְׁלָמִים అనేది శాంతి, క్షేమం, సంపూర్ణత, సహవాసం వంటి భావాలతో సంబంధమున్న ప్రత్యేక బలి రకం. ‘సమాధాన బలి’ తెలుగు బైబిలు వాడుకలో గుర్తించదగినదిగా ఉండి, హెబ్రీ పదబంధంలోని బలి భావాన్ని నిలుపుతుంది; ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: קָרְבָּן అనేది దేవుని సన్నిధికి తీసుకొచ్చే అర్పణకు సాధారణ పదం. ‘అర్పణ’ బలి సందర్భానికి సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: מִן הַבָּקָר
  choice: గోవుల మందలోనుంచి
  rationale: בָּקָר ఇక్కడ గొర్రెలు లేదా మేకలకు భిన్నంగా గోవుల జాతికి చెందిన మందను సూచిస్తుంది. ‘గోవుల మందలోనుంచి’ ఈ వర్గభేదాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: అర్పిస్తే / అర్పించాలి
  rationale: קרב హిఫీల్ రూపం బలి సంబంధ సందర్భంలో దగ్గరకు తీసుకురావడం, సమర్పించడం అనే భావంతో ‘అర్పించడం’ అని సహజంగా అనువదించబడింది.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: మగదైనా ఆడదైనా
  rationale: జతగా వచ్చిన אִם ... אִם నిర్మాణం రెండింటిలో ఏదైనా అనుమతించబడుతుందని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘మగదైనా ఆడదైనా’ ఆ భావాన్ని కచ్చితంగా అందిస్తుంది.
- source_word: תָּמִים
  choice: లోపం లేనిదాన్ని
  rationale: బలి జంతువు సందర్భంలో תָּמִים శారీరక దోషం లేదా కళంకం లేనిదాన్ని సూచిస్తుంది. ‘లోపం లేనిది’ ఆధునిక పాఠకులకు నేరుగా అర్థమయ్యే రూపం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో’; יְהוָה దేవుని ప్రత్యేక నామం. అందువల్ల ‘యాహ్వే సన్నిధిలో’ మూలార్థాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడాం.
- issue: שְׁלָמִים బలి రకానికి పేరు
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ పదం శాంతి, క్షేమం, సంపూర్ణత, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో స్థిరమైన ‘సమాధాన బలి’ని ఉంచి, భావపరిధిని ఒక్క వ్యాఖ్యానానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. హెబ్రీ వాక్యంలోని షరతు నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతూ, బలి రకానికి సంబంధించిన నిజమైన పదార్థ విస్తృతిని పాదటిప్పణిలో భద్రపరిచాం.
