revisions:
- from: “ఒకవేళ అతని అర్పణ సమాధాన బలి[a] అయితే, అతడు దానిని గోవుల మందలోనుంచి అర్పిస్తే, అది మగదైనా ఆడదైనా, లోపం లేనిదాన్ని యాహ్వే సన్నిధిలో అర్పించాలి.”
  to: “అతని అర్పణ సమాధాన బలి అయితే, అతడు గోవుల మందనుండి అర్పించినప్పుడు, అది మగదైనా ఆడదైనా, లోపంలేనిదాన్ని యాహ్వే సన్నిధిలో అర్పించాలి.”
