translation:
  language: te
  text: అది అపరాధ పరిహార బలి[a]; అతడు యెహోవా పట్ల నిజంగానే అపరాధిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది అపరాధ పరిహార బలి; అతడు యెహోవా పట్ల నిశ్చయంగా అపరాధిగా అయ్యాడు.” హీబ్రూలో ‘అపరాధ పరిహార బలి/అపరాధిగా ఉండు’ అనే ఒకే మూలపదం పునరావృతమై భావాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: బలుల సందర్భంలో ఈ నామవాచకం అపరాధం వల్ల కలిగిన బాధ్యతకు పరిహారంగా అర్పించే ప్రత్యేక బలిని సూచిస్తుంది. ‘అపరాధ పరిహార బలి’ అపరాధం, పరిహారం అనే రెండు భావాలనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: అది
  rationale: ఇది ముందుగా పేర్కొన్న బలిని నిర్దేశిస్తూ ‘అది ... బలి’ అనే విధేయ నిర్మాణంలో ఉంది.
- source_word: אָשֹׁם אָשַׁם
  choice: నిజంగా అపరాధం చేశాడు
  rationale: అదే ధాతువుతో వచ్చిన క్రియావిశేష రూపం, సమాపక క్రియ కలయిక క్రియాభావాన్ని బలపరుస్తుంది. ‘నిజంగా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా పట్ల
  rationale: אשם తో కూడిన ל ఇక్కడ యెహోవాకు సంబంధించి వ్యక్తిపై ఉన్న అపరాధ బాధ్యతను సూచించగలదు. ‘పట్ల’ అనేది ‘విరోధంగా’ అని అతిగా నిర్ధారించకుండా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించడం మూలపాఠంలోని వ్యక్తిగత నామాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: אָשָׁם అనే పదంలో బలి మరియు అపరాధం అనే అనుబంధ భావాలు
  choice: మొదటి ప్రయోగాన్ని ‘అపరాధ పరిహార బలి’గా, క్రియారూపాన్ని ‘అపరాధం చేశాడు’గా అనువదించడం
  alternative: మొదటి ప్రయోగాన్నీ కేవలం ‘అపరాధం’గా తీసుకోవడం
  rationale: బలుల నియమాల సందర్భం మొదటి ప్రయోగాన్ని బలి పేరుగా బలపరుస్తుంది; వెంటనే వచ్చే అదే ధాతువు అపరాధ వాస్తవాన్ని ఉద్ఘాటిస్తుంది.
- issue: לַיהוָה యొక్క సంబంధార్థం
  choice: ‘యెహోవా పట్ల’ అని అనువదించి, అపరాధ బాధ్యతను యెహోవాకు సంబంధించినదిగా చూపించడం
  alternative: ‘యెహోవాకు అర్పించే అపరాధ పరిహార బలి’ లేదా ‘యెహోవాకు విరోధంగా అపరాధం చేశాడు’
  rationale: ఈ పదబంధం వ్యాకరణపరంగా చివరి క్రియతో సహజంగా అనుసంధానమవుతుంది. ‘పట్ల’ సంబంధం లేదా బాధ్యతను తెలియజేస్తూ, ప్రత్యక్ష విరోధాన్ని అవసరానికి మించి నొక్కిచెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘అపరాధ పరిహార బలి’ అనే పదబంధం ఆ బలి యొక్క న్యాయ-పరిహార స్వభావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; మూలంలోని ధాతుపునరుక్తిని పాదసూచిక వివరిస్తుంది.
