source:
  edition: WLC
  text: וְ/הָיָה֮ כִּֽי יֶחֱטָ֣א וְ/אָשֵׁם֒ וְ/הֵשִׁ֨יב אֶת הַ/גְּזֵלָ֜ה אֲשֶׁ֣ר גָּזָ֗ל א֤וֹ אֶת הָ/עֹ֨שֶׁק֙ אֲשֶׁ֣ר עָשָׁ֔ק א֚וֹ אֶת הַ/פִּקָּד֔וֹן אֲשֶׁ֥ר הָפְקַ֖ד אִתּ֑/וֹ א֥וֹ אֶת הָ/אֲבֵדָ֖ה אֲשֶׁ֥ר מָצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: te
  text: అతడు పాపం చేసి అపరాధి అయినప్పుడు[a], తాను దోచుకున్నదానినైనా, అణచివేత ద్వారా తీసుకున్నదానినైనా[b], తనకు అప్పగించబడిన ఆస్తినైనా, తాను కనుగొన్న పోయిన వస్తువునైనా[c] తిరిగి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు పాపం చేసి అపరాధం కలిగినట్లయితే.” హీబ్రూ న్యాయసూత్రంలో దీనిని “ఎప్పుడు” లేదా “ఒకవేళ” అని అనువదించవచ్చు; “అపరాధి అయ్యాడు” అనే మాటకు “అపరాధం కలిగింది” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బలవంతంగా వసూలు చేసుకున్నదానిని,” “అణచివేత ద్వారా సంపాదించినదానిని,” లేదా “మోసంతో తీసుకున్నదానిని.” హీబ్రూ పదం మరొకరి ఆస్తిని అణచివేతతో లేదా మోసంతో స్వాధీనం చేసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తాను కనుగొన్న తప్పిపోయిన ఆస్తిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు
  rationale: హీబ్రూ న్యాయసూత్రంలోని సందర్భారంభాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; כִּי లోని ‘ఎప్పుడు/ఒకవేళ’ భావభేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: יֶחֱטָא וְאָשֵׁם
  choice: పాపం చేసి అపరాధి అయినప్పుడు
  rationale: חטא లోని పాపభావాన్ని, אשם లోని అపరాధస్థితి లేదా బాధ్యతను రెండింటినీ స్పష్టంగా నిలుపుతుంది; కేవలం అపరాధాన్ని గ్రహించాడనే భావాన్ని చేర్చదు.
- source_word: וְהֵשִׁיב
  choice: తిరిగి ఇవ్వాలి
  rationale: ఆస్తి సంబంధ న్యాయపరిహార సందర్భంలో తిరిగి చెల్లించాల్సిన విధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: తాను దోచుకున్నదానిని
  rationale: ఒకే మూలానికి చెందిన నామవాచక-క్రియ పునరుక్తిని అసహజంగా అనుకరించకుండా, అన్యాయంగా స్వాధీనం చేసుకున్న వస్తువును సూచిస్తుంది.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: బలవంతంగా లాక్కున్నదానిని
  rationale: עשק పదజాలంలోని అణచివేత, దోపిడీ, మోసపూరిత స్వాధీనతల పరిధిలో ఈ ఆస్తి సందర్భానికి సరిపోయే స్పష్టమైన భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయ విస్తృత భావాలు పాదసూచికలో ఉన్నాయి.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: తనకు అప్పగించబడిన సొమ్మును
  rationale: మరొకరి సంరక్షణకు ఉంచిన ఆస్తిని సూచిస్తుంది. ‘సొమ్ము’ ఇక్కడ డబ్బుకే పరిమితం కాకుండా అప్పగించిన ఆస్తి అనే సాధారణ తెలుగు భావంలో వాడబడింది.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: తాను కనుగొన్న పోయిన వస్తువును
  rationale: కనుగొన్న తప్పిపోయిన ఆస్తిని అర్థవంతంగా, జాబితా నిర్మాణాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: וְאָשֵׁם యొక్క భావం
  choice: అపరాధి అయినప్పుడు
  alternative: తన అపరాధాన్ని గ్రహించినప్పుడు
  rationale: క్రియ ప్రధానంగా అపరాధం లేదా బాధ్యత కలగడాన్ని సూచిస్తుంది. సందర్భం అవగాహనను సూచించవచ్చుగాని, దానిని మూలపదానికి ఏకైక అర్థంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. హీబ్రూ వాక్యంలోని వరుస ఆస్తి వర్గాలను ‘-నైనా’ నిర్మాణంతో నిలిపి, చివర విధిని ‘తిరిగి ఇవ్వాలి’గా స్పష్టంగా ఉంచాం. మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
