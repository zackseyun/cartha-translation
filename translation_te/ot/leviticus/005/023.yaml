review_pass:
  verdict: revise
  source_fidelity: The legal conditional and the four categories of property are retained. However, ‘సొమ్ము’ normally denotes money or wealth and can improperly narrow פִּקָּדוֹן, which denotes entrusted property generally. ‘బలవంతంగా లాక్కున్నది’ is somewhat narrower than עֹשֶׁק, whose range includes oppressive or fraudulent wrongful acquisition.
  naturalness: The sentence is fluent modern Telugu. ‘తనకు అప్పగించబడిన ఆస్తి’ is both more idiomatic in this legal context and semantically broader than ‘సొమ్ము.’
  terminology: ‘పాపం’ and ‘అపరాధి’ appropriately retain the sin/guilt wording without importing an awareness-of-guilt interpretation. ‘ఆస్తి’ accurately covers property entrusted for safekeeping. The revised rendering for עֹשֶׁק preserves its broader oppressive-expropriation sense, with alternatives retained in the note.
  issues:
  - severity: medium
    issue: ‘సొమ్ము’ narrows the meaning of הַפִּקָּדוֹן.
    rationale: The Hebrew refers to a deposit or property entrusted to the person, not specifically money. ‘ఆస్తి’ avoids this restriction.
  - severity: medium
    issue: ‘బలవంతంగా లాక్కున్నది’ is overly specific for הָעֹשֶׁק.
    rationale: The term can cover oppressive, exploitative, or fraudulent seizure/withholding. ‘అణచివేత ద్వారా తీసుకున్నది’ better preserves the semantic range; the footnote supplies further alternatives.
  - severity: low
    issue: Footnote a’s explanation of the conditional formula is unclear in Telugu.
    rationale: It should distinguish the legal-case alternatives ‘ఎప్పుడు’ and ‘ఒకవేళ’ and express אָשֵׁם as becoming guilty/incurring guilt, rather than use the awkward ‘అపరాధం మోపుకున్నాడు.’
