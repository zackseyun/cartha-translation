id: LEV.5.6
reference: Leviticus 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: te
  text: 'తాను చేసిన పాపం నిమిత్తం అతడు యాహ్వేకు తన అపరాధబలిని[a] తీసుకురావాలి: మందలోనుంచి ఒక ఆడ జంతువును—ఆడ గొర్రెనైనా ఆడ మేకనైనా—పాపబలిగా తీసుకురావాలి. అప్పుడు యాజకుడు అతని పాపం విషయంలో[b] అతని కోసం ప్రాయశ్చిత్తం చేయాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనిని ‘తన అపరాధం కోసం అర్పణ’ లేదా ‘తన పరిహార అర్పణ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం אָשָׁם అపరాధం లేదా పరిహారంతో సంబంధమున్నది; అయితే వాక్యం తరువాత ఈ జంతువును ‘పాపబలి’గా పేర్కొంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని పాపం నుంచి.’ ప్రాయశ్చిత్తం ఫలితంగా పాపం నుంచి విడుదల లేదా పాప తొలగింపు అనే భావఛాయను ఈ మాట సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయవిధి సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగు విధిరూపంతో వ్యక్తం చేస్తుంది.
- source_word: אֲשָׁמוֹ
  choice: తన అపరాధ బలి
  rationale: אָשָׁם పదంలోని అపరాధం/పరిహారం సంబంధిత బలి భావాన్ని నిలుపుతూ, ఇదే వాక్యంలో వచ్చే חַטָּאת అనే వేరొక బలి పదంతో ఉన్న భేదాన్ని చెరపదు.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: తాను చేసిన పాపం నిమిత్తం
  rationale: బలికి కారణమైన పాపాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తూ మూలంలోని חטא పదపునరుక్తిని కృత్రిమంగా అనుకరించదు.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: మందలోనుంచి ఒక ఆడ జంతువును
  rationale: צֹאן సూచించే గొర్రెలు-మేకల మందను, נְקֵבָה సూచించే లింగాన్ని రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: כִשְׂבָּה אֽוֹ שְׂעִירַת עִזִּים
  choice: ఆడ గొర్రెపిల్లనైనా ఆడ మేకనైనా
  rationale: అనుమతించబడిన రెండు ప్రత్యామ్నాయాలనూ, వాటి ఆడ లింగ నిర్దేశాన్నీ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְחַטָּאת
  choice: పాప బలిగా
  rationale: బలుల సందర్భంలో חַטָּאתకు ఉన్న సాంకేతిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది; ముందున్న అపరాధ బలి పదంతో దానిని కలిపివేయదు.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలోని כפר భావాన్ని ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా సంప్రదాయబద్ధంగా, అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: מֵחַטָּאתוֹ
  choice: అతని పాపం విషయంలో
  rationale: מן ఉపసర్గకు ఇక్కడ ఉన్న సంబంధార్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; ‘పాపం నుంచి’ అనే తొలగింపు ఛాయను పాదసూచికలో సంరక్షిస్తుంది.
theological_decisions:
- issue: ఒకే వాక్యంలో אָשָׁם మరియు חַטָּאת బలి పదాల వాడుక
  choice: ‘అపరాధ బలి’ మరియు ‘పాప బలి’ అనే రెండు వేరు పదాలను అలాగే నిలుపుట
  alternative: మొదటి పదాన్ని సాధారణంగా ‘అపరాధం కోసం అర్పణ’ అని అనువదించడం లేదా రెండవదాన్ని ‘శుద్ధీకరణ బలి’ అని అనువదించడం
  rationale: మూలపాఠమే ఈ రెండు పదాలను పక్కపక్కన వాడుతుంది. వాటిని ఒకే పదంగా సవరించడం మూలంలోని నిజమైన పదప్రయోగ ఉద్రిక్తతను దాచివేస్తుంది.
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందిస్తుంది.
- issue: כפר యొక్క సిద్ధాంతపరమైన పరిధి
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పాపాన్ని తొలగించాలి లేదా పరిహారం చెల్లించాలి
  rationale: బలి ద్వారా జరిగే కార్యాన్ని తెలియజేస్తూనే, అది ఏకైక తరువాతి కాలపు ప్రాయశ్చిత్త సిద్ధాంతాన్ని తప్పనిసరిగా బోధిస్తున్నట్లు నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే విధిశైలిని వాడాం. బలి సంబంధిత సాంకేతిక పదాలకు ‘అపరాధ బలి,’ ‘పాప బలి,’ ‘ప్రాయశ్చిత్తం’ అనే పారదర్శక పదాలను ఎంచుకుని, మూలంలోని పదభేదం మరియు సందిగ్ధతను పాదసూచికలతో నిలిపాం.
