  to: 'తాను చేసిన పాపం నిమిత్తం అతడు యాహ్వేకు తన అపరాధబలిని[a] తీసుకురావాలి: మందలోనుంచి ఒక ఆడ జంతువును—ఆడ గొర్రెనైనా ఆడ మేకనైనా—పాపబలిగా తీసుకురావాలి. అప్పుడు యాజకుడు అతని పాపం విషయంలో[b] అతని కోసం ప్రాయశ్చిత్తం చేయాలి.'
