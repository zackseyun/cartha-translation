  to: ఒక వ్యక్తి పాపం చేసి, యాహ్వే ఆజ్ఞల్లో చేయకూడదని చెప్పబడిన వాటిలో ఏదో ఒకటి తెలియక చేస్తే, అతడు దోషి అవుతాడు[a]; తన అపరాధాన్ని మోయవలసి ఉంటుంది[b].
  rationale: సవరణ నిషేధిత కార్యాలకూ యాహ్వే ఆజ్ఞలకూ ఉన్న వ్యాకరణ సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది; అలాగే ‘ఒకటి’ అనే మూలపాఠ భావాన్ని నిలుపుతుంది. చివరి న్యాయప్రయోగంలో మూలానికి లేని ‘భారం’ పదాన్ని తొలగించి, బాధ్యత లేదా పర్యవసానమనే విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచింది. ‘తెలియక’ అనే రూపం అతనికి ఖచ్చితంగా ఏ విషయం తెలియలేదో చెప్పని మూల అస్పష్టతను కాపాడుతుంది.
