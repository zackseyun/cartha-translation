id: LEV.5.17
reference: Leviticus 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: te
  text: ఒక వ్యక్తి పాపం చేసి, యాహ్వే ఆజ్ఞల్లో చేయకూడదని చెప్పబడిన వాటిలో ఏదో ఒకటి తెలియక చేస్తే, అతడు దోషి అవుతాడు[a]; తన అపరాధాన్ని మోయవలసి ఉంటుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దోషబాధ్యతకు లోనవుతాడు.” హీబ్రూ పదం చేసిన అపరాధం వల్ల దోషబాధ్యత ఏర్పడడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన దోషాన్ని మోయవలసి ఉంటుంది.” “అపరాధాన్ని మోయడం” అనే హీబ్రూ ప్రయోగం తప్పు వల్ల కలిగే బాధ్యతను లేదా పర్యవసానాన్ని మోయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఒక వ్యక్తి
  rationale: ఇక్కడ ఈ పదం అమూర్తమైన ‘ఆత్మ’ను కాక, ధర్మశాస్త్రానికి లోబడిన వ్యక్తిని సూచించే హీబ్రూ ప్రయోగం.
- source_word: תֶחֱטָא
  choice: పాపం చేసి
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో חטא అనే క్రియను సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: వాటిలో దేనినైనా ... చేస్తే
  rationale: నిషేధించబడిన కార్యాల సమూహంలో ఏ ఒక్కదానినైనా చేయడం అనే విభజనార్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: యాహ్వే ఆజ్ఞల ప్రకారం చేయకూడని వాటిలో
  rationale: నిషేధపు చట్టబలాన్ని స్పష్టంగా తెలియజేస్తూ, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: וְלֹא יָדַע
  choice: తెలియకుండానే
  rationale: అతడు చేసిన కార్యం నిషిద్ధమని లేదా తాను దాన్ని చేశానని తెలియని స్థితిని మూలపాఠం నిర్దిష్టంగా వేరు చేయదు; తెలుగు రూపం ఆ అస్పష్టతను నిలుపుతుంది.
- source_word: וְאָשֵׁם
  choice: దోషిగా నిలుస్తాడు
  rationale: అపరాధం వల్ల దోషబాధ్యతకు లోనవడం అనే אָשֵׁם భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: తన దోషభారాన్ని మోయాలి
  rationale: ‘తన దోషాన్ని మోయడం’ అనే హీబ్రూ న్యాయపరమైన రూపకాన్ని తెలుగులో గంభీరంగా, అర్థవంతంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా, సాధారణ తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
- issue: తెలియక చేసిన పాపానికి దోషబాధ్యత
  choice: తెలియకుండానే చేసినప్పటికీ వ్యక్తి దోషిగా నిలుస్తాడనే వాక్యబలాన్ని నిలుపడం
  alternative: అజ్ఞానం వల్ల దోషం తొలగిపోయినట్లు భావానువాదం చేయడం
  rationale: మూలపాఠం అజ్ఞానాన్ని ప్రస్తావించినప్పటికీ దోషబాధ్యతను స్పష్టంగా కొనసాగిస్తుంది; ఆ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాలి.
- issue: וְלֹא יָדַע యొక్క పరిధి
  choice: తెలియకుండానే
  alternative: అది నిషిద్ధమని అతనికి తెలియకపోయినా / తాను దాన్ని చేసినట్లు తెలియకపోయినా
  rationale: హీబ్రూ వాక్యం తెలియనిది ఖచ్చితంగా ఏమిటో చెప్పదు; ప్రధాన పాఠంలో ఆ నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘యాహ్వే’ అనే దైవనామం నిలుపబడింది. ‘తెలియకుండానే’ అనే రూపం మూలంలోని సూచనాపరిధి అస్పష్టతను కాపాడుతుంది; ‘దోషభారం’ హీబ్రూ న్యాయరూపకపు గంభీరతను నిలుపుతుంది.
