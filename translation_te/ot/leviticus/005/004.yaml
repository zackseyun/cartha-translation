  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: te
  text: లేదా, ఒక వ్యక్తి తన పెదవులతో తొందరపాటుగా[a] పలుకుతూ కీడు చేయడానికో మేలు చేయడానికో ప్రమాణం చేస్తే—అంటే, ఒక మనిషి ప్రమాణంలో పలికే ఏ విషయమైనా—అది అతనికి తెలియకుండా ఉండి[b], తరువాత అతడు దాన్ని తెలుసుకొని, వీటిలో ఒకదాని విషయంలో అపరాధిగా మారితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొందరపాటుగా’ అని అనువదించిన హెబ్రీ క్రియకు ‘పలుకు’ లేదా ‘పెదవులతో ఉచ్చరించు’ అనే అర్థం కూడా ఉంది; ఈ సందర్భం ఆలోచించకుండా చేసిన ప్రమాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అది అతనికి మరుగై ఉండి.’ అతనికి తెలియకుండా ఉన్నది ప్రమాణమా, దాని పరిణామమా, లేక దానివల్ల కలిగిన దోషస్థితినా అన్నది హెబ్రీ పాఠం స్పష్టంగా చెప్పదు.
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఒక వ్యక్తి
  rationale: లేవీయకాండంలోని న్యాయపరమైన సందర్భంలో ఈ పదం అమూర్తమైన ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: תִשָּׁבַע
  choice: ప్రమాణం చేసి
  rationale: ఇక్కడ నిఫాల్ రూపం ప్రమాణం చేయడాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన న్యాయపరమైన ప్రయోగం.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: తొందరపాటుగా ... తన పెదవులతో పలికితే
  rationale: ‘పెదవులతో పలకడం’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, సందర్భం సూచించే ఆలోచించని లేదా తొందరపాటు ఉచ్చారణను ప్రధాన పాఠంలో వ్యక్తం చేసింది; పదానికి ఉన్న విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: కీడు చేయడానికో మేలు చేయడానికో
  rationale: ప్రమాణపు విషయాన్ని రెండు విరుద్ధ ధ్రువాలతో తెలిపే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: ఒక మనిషి ప్రమాణంలో పలికే ఏ విషయమైనా
  rationale: ముందున్న ఉదాహరణలను విస్తరించే సాధారణ న్యాయసూత్రాన్ని, הָאָדָם యొక్క ప్రతినిధి ఏకవచన రూపాన్ని నిలుపుతూ అనువదించింది.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: అది అతనికి తెలియకుండా ఉండి
  rationale: అక్షరార్థమైన ‘అతనికి మరుగై’ అనే నిష్క్రియ భావాన్ని సహజ తెలుగులో తెలియకపోవడంగా తెలిపింది; ‘అది’ దేనిని సూచిస్తుందో మూలంలోని స్వల్ప అస్పష్టతను పాదటిప్పణి వివరిస్తుంది.
- source_word: וְהוּא יָדַע
  choice: తరువాత అతడు దాన్ని తెలుసుకొని
  rationale: ముందటి తెలియకపోవడం తరువాత అవగాహనకు రావడం అనే కాలక్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: וְאָשֵׁם
  choice: అపరాధి అయితే
  rationale: ఈ క్రియ సూచించే దోషబాధ్యతను న్యాయపరమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: వీటిలో ఒకదాని విషయంలో
  rationale: ఈ విభాగంలో ముందుగా పేర్కొన్న సందర్భాలలో ఒకదానిని వెనక్కి సూచించే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: న్యాయసూత్రంలోని ప్రతినిధి పురుష ఏకవచనం
  choice: נֶפֶשׁ ను ‘ఒక వ్యక్తి’గా, הָאָדָם ను ‘ఒక మనిషి’గా అనువదించడం
  alternative: రెండింటినీ ‘ఒక వ్యక్తి’గా అనువదించడం
  rationale: మూలపాఠంలో ఉన్న పదభేదాన్ని నిలుపుతుంది. ‘ఒక మనిషి’ ఇక్కడ స్త్రీలను మినహాయించే పదం కాదు; సాధారణ మానవ వ్యక్తిని సూచించే ప్రతినిధి ఏకవచనం.
- issue: తెలియకుండా ఉన్న విషయం ఏమిటనే అస్పష్టత
  choice: ‘అది అతనికి తెలియకుండా ఉండి’ అని సాధారణ సూచనను నిలుపడం
  alternative: అతడు చేసిన ప్రమాణాన్ని మరచిపోయి లేదా దాన్ని ఉల్లంఘించిన సంగతి తెలియకుండా ఉండి
  rationale: మూలపాఠం ప్రమాణమేనా, దాని పరిణామమా, లేక దాని ఉల్లంఘన/దోషస్థితినా అని పూర్తిగా నిర్దిష్టం చేయదు. అందువల్ల ప్రధాన పాఠం ఆ అస్పష్టతను సిద్ధాంతపరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించింది. ‘కీడు/మేలు,’ ‘ప్రమాణం,’ ‘అపరాధి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని విధివాక్య స్వరాన్ని నిలుపుతాయి. వాక్యం తదుపరి వచనంతో కొనసాగుతుందనే కారణంగా చివర కామా ఉంచబడింది.
