  to: లేదా, ఒక వ్యక్తి తన పెదవులతో తొందరపాటుగా[a] పలుకుతూ కీడు చేయడానికో మేలు చేయడానికో ప్రమాణం చేస్తే—అంటే, ఒక మనిషి ప్రమాణంలో పలికే ఏ విషయమైనా—అది అతనికి తెలియకుండా ఉండి[b], తరువాత అతడు దాన్ని తెలుసుకొని, వీటిలో ఒకదాని విషయంలో అపరాధిగా మారితే,
  rationale: మౌఖిక ఉచ్చారణ మరియు తొందరపాటు ప్రమాణం మధ్య ఉన్న మూలభాషా సంబంధాన్ని తెలుగులో సజావుగా చేయడానికి వాక్యనిర్మాణాన్ని సవరించాను. వְאָשֵׁם యొక్క దోషబాధ్యతలోకి రావడం అనే భావాన్ని ‘అపరాధిగా మారితే’ ద్వారా స్పష్టీకరించాను. మూలంలోని అస్పష్టత, ప్రతినిధి ఏకవచనం, పాదటిప్పణి సూచికలు, మరియు తదుపరి వచనానికి కొనసాగింపు అన్నీ నిలుపబడ్డాయి.
