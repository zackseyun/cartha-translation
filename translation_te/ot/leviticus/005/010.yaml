  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: te
  text: రెండవ పక్షిని యాజకుడు నిర్దేశించిన విధానం ప్రకారం[a] దహనబలిగా అర్పించాలి. అతడు చేసిన పాపం నిమిత్తం యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతనికి క్షమాపణ లభిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నియమం ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతనికి అది క్షమించబడుతుంది’; క్షమించేవారు ఎవరో ప్రత్యక్షంగా చెప్పని నిష్క్రియాత్మక వాక్యరూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: రెండవ పక్షిని
  rationale: ముందటి సందర్భంలో చెప్పిన రెండు పక్షులలో రెండవదాన్ని సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘పక్షిని’ అని పూరించబడింది.
- source_word: יַעֲשֶׂה עֹלָה
  choice: దహనబలిగా అర్పించాలి
  rationale: עשה అనే విస్తృత క్రియకు బలిపద్ధతి సందర్భంలో సహజమైన తెలుగు క్రియ ‘అర్పించాలి’; עֹלָהకు ప్రామాణికమైన బలిపదం ‘దహనబలి’.
- source_word: כַּמִּשְׁפָּט
  choice: నిర్దేశించిన విధానం ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט న్యాయతీర్పును కాక, బలి అర్పణకు స్థిరపరచిన నియమిత పద్ధతిని సూచిస్తుంది.
- source_word: וְכִפֶּר עָלָיו
  choice: యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలోని כפר పదానికి సంబంధించిన ఆచార-దైవశాస్త్ర భావాన్ని నిలుపుతూ, దానిని తరువాతి సిద్ధాంతపరమైన ఒకే వివరణకు పరిమితం చేయదు.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపం నిమిత్తం
  rationale: హీబ్రూ నిర్మాణం ప్రాయశ్చిత్తానికి కారణమైన అపరాధాన్ని సూచిస్తుంది; ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమాపణ లభిస్తుంది
  rationale: క్షమించేవారిని హీబ్రూ వాక్యం ప్రత్యక్షంగా పేర్కొనదు. తెలుగు సహజత్వాన్ని కాపాడుతూ ఆ దైవిక కర్తను అంతర్లీనంగానే ఉంచుతుంది.
theological_decisions:
- issue: యాజక ప్రాయశ్చిత్త భాషను తరువాతి సిద్ధాంతపరమైన ప్రత్యేక అర్థాలతో పరిమితం చేయకుండా అనువదించడం
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  alternative: అతన్ని శుద్ధి చేయాలి / అతనికి క్షమాపణ సంపాదించాలి
  rationale: כפר అనే యాజక బలిపదంలోని విస్తృత ఆచార-దైవశాస్త్ర భావాన్ని ‘ప్రాయశ్చిత్తం’ నిలుపుతుంది; శుద్ధి లేదా క్షమాపణ అనే ఒక్క ఫలితానికే దాన్ని కుదించదు.
- issue: క్షమాపణ వాక్యంలో దైవిక కర్తను అంతర్లీనంగా ఉంచడం
  choice: అతనికి క్షమాపణ లభిస్తుంది
  alternative: యెహోవా అతన్ని క్షమిస్తాడు / అతనికి అది క్షమించబడుతుంది
  rationale: హీబ్రూలోని నిష్క్రియాత్మక సూత్రవాక్యం క్షమించే దైవిక కర్తను గౌరవపూర్వకంగా పేర్కొనకుండా ఉంచుతుంది. ప్రధాన పాఠం అదే నియంత్రణను సహజమైన తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బలిపద్ధతి పదజాలం వాడబడింది. ‘దహనబలి’, ‘యాజకుడు’, ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
