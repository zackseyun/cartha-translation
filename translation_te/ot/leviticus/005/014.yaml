lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే సాధారణ కథన సూత్రం. ఆధునిక తెలుగులో ‘మాట్లాడాడు’ కంటే ‘అన్నాడు’ సహజంగా ఉండి, తరువాత వచ్చే ప్రత్యక్ష వాక్యంతో స్పష్టంగా అనుసంధానమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడటానికి సంబంధించిన אֶל అనే సంబంధసూచక అవ్యయాన్ని తెలుగులో సహజమైన ‘తో’ విభక్తితో వ్యక్తం చేశాం; מֹשֶׁהను ప్రామాణిక తెలుగు రూపమైన ‘మోషే’గా ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే ఈ హీబ్రూ క్రియారూపానికి ఆధునిక తెలుగులో ‘ఇలా’ సహజమైన సమానార్థకం; ముగింపులో ద్విబిందువు అదే పరిచయ విధిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం. హీబ్రూ ఉచ్చారణ పునర్నిర్మాణంలో అనిశ్చితి ఉన్నందున, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే సంక్షిప్త దైవవాక్య పరిచయ సూత్రం. ఈ వచనంలో పాదటిప్పణి అవసరం లేదు.
