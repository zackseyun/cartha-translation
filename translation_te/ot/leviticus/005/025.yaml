  to: 'అతడు తన అపరాధ పరిహార బలిని[a] యెహోవాకు తీసుకురావాలి: మందలోనుంచి లోపంలేని[b] ఒక పొట్టేలును, నీవు నిర్ణయించిన విలువ ప్రకారం, అపరాధ పరిహార బలిగా యాజకుని వద్దకు తీసుకురావాలి.'
