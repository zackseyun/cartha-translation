id: LEV.5.25
reference: Leviticus 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: te
  text: 'అతడు తన అపరాధ పరిహార బలిని[a] యెహోవాకు తీసుకురావాలి: మందలోనుంచి లోపంలేని[b] ఒక పొట్టేలును, నీవు నిర్ణయించిన విలువ ప్రకారం, అపరాధ పరిహార బలిగా యాజకుని వద్దకు తీసుకురావాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం אָשָׁם అపరాధం, దానికి చేయవలసిన పరిహారం, లేదా ఈ ప్రత్యేక బలిని సూచించగలదు. ‘తన అపరాధ బలిని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: ‘మచ్చలేనిది.’ ఇక్కడ భావం బలికి అనర్హత కలిగించే లోపం లేనిది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: తన అపరాధ పరిహార అర్పణను
  rationale: אָשָׁם అనే పదంలో అపరాధం, దానికి చేయవలసిన పరిహారం, అలాగే ఆ పరిహారానికి సంబంధించిన ప్రత్యేక బలి అనే భావాలు కలిసివున్నాయి. ఇక్కడ మొదటి ప్రయోగాన్ని విస్తృతమైన పరిహార అర్థంతో అనువదించడం, తరువాతి לְאָשָׁם అనే బలి-వర్గ సూచనతో ఉన్న స్వల్ప భేదాన్ని నిలుపుతుంది.
- source_word: יָבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయపరమైన ఆజ్ఞలో ఉన్న హిఫీల్ అసంపూర్ణ క్రియ యొక్క విధిపూర్వక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా దగ్గరికి
  rationale: దిశను సూచించే לְ ఉపసర్గను సహజంగా తెలుపుతూ, ఒడంబడిక నామమైన יהוהను పేరుగానే ఉంచుతుంది.
- source_word: אַיִל תָּמִים מִן־הַצֹּאן
  choice: మందలోనుంచి లోపంలేని ఒక పొట్టేలును
  rationale: אַיִל మగ గొర్రెను సూచిస్తుంది; תָּמִים బలికి అనర్హత కలిగించే లోపం లేనిదని సూచిస్తుంది; צֹאן చిన్న పశువుల మందను సూచించినా, אַיִל వల్ల జంతువు పొట్టేలుగా స్పష్టమవుతుంది.
- source_word: בְּעֶרְכְּךָ
  choice: నీవు నిర్ణయించిన విలువ ప్రకారం
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని, అలాగే అధికారిక విలువ నిర్ణయ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְאָשָׁם
  choice: అపరాధ పరిహార బలిగా
  rationale: ఈ బలి సూత్రంలో אָשָׁם ప్రత్యేక బలి-వర్గాన్ని సూచిస్తుంది; ‘బలిగా’ అనే రూపం పొట్టేలు ఏ ప్రయోజనం కోసం సమర్పించబడుతుందో స్పష్టం చేస్తుంది.
- source_word: אֶל־הַכֹּהֵן
  choice: యాజకుని దగ్గరికి
  rationale: బలిని నిర్వహించే యాజకుని వద్దకు తీసుకురావాలనే దిశార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపం ‘యెహోవా’ను ఉపయోగించడం మూలంలోని వ్యక్తినామ స్వభావాన్ని నిలుపుతుంది.
- issue: ఒకే వాక్యంలో రెండుసార్లు వచ్చే אָשָׁם యొక్క పరస్పర సంబంధిత అర్థాలు
  choice: మొదట ‘అపరాధ పరిహార అర్పణ’; తరువాత ‘అపరాధ పరిహార బలి’
  alternative: రెండుచోట్లా ‘అపరాధ పరిహార బలి’
  rationale: మొదటి ప్రయోగం అపరాధానికి సంబంధించిన పరిహార అర్పణను విస్తృతంగా సూచించగలదు; రెండవది పొట్టేలు చెందిన నిర్దిష్ట బలి-వర్గాన్ని సూచిస్తుంది. భిన్నమైనప్పటికీ సంబంధిత పదాలతో అనువదించడం మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తీసుకురావాలి’ విధిపూర్వక బలాన్ని సహజంగా అందిస్తుంది. ద్వంద్వార్థమున్న אָשָׁם పదాన్ని ఒకే అర్థానికి కుదించకుండా ప్రధాన పాఠం మరియు పాదటిప్పణిలో దాని పరిహార, బలి భావాలను నిలిపాం.
