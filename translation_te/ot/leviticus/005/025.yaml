    rationale: אֲשָׁמוֹను ‘అపరాధ పరిహార అర్పణ’గా, לְאָשָׁםను ‘అపరాధ పరిహార బలి’గా చేయడం, మూలంలోని ఒకే పదం పునరావృత్తికి మించిన భావభేదాన్ని సూచిస్తుంది. ఈ సందర్భంలో రెండూ నిర్దిష్ట ఆషామ్ బలినే సూచిస్తాయి.
