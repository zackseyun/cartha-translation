id: LEV.5.2
reference: Leviticus 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: te
  text: లేదా ఎవరైనా ఏదైనా అశుద్ధమైన దానిని తాకితే—అశుద్ధమైన అడవి జంతువు శవమైనా, అశుద్ధమైన పెంపుడు జంతువు శవమైనా, అశుద్ధమైన పాకే జీవి శవమైనా—అది అతనికి తెలియకపోయి[a], అతడు అశుద్ధుడై దోషానికి పాత్రుడవుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “అది అతనికి మరుగై ఉండి.” అంటే, అతనికి ఆ విషయం తెలియకపోవడం.'
    reason: lexical_alternative
  - marker: b
    text: “దోషానికి పాత్రుడవుతాడు” అనేది ఈ అశుద్ధత విషయంలో అతనికి న్యాయపరమైన బాధ్యత ఏర్పడడాన్ని సూచిస్తుంది; జంతు శవాన్ని తాకడమే తప్పనిసరిగా ఉద్దేశపూర్వక నైతిక పాపమని దీని అర్థం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఎవరైనా
  rationale: న్యాయపరమైన సందర్భంలో ఇది అమూర్తమైన ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎవరైనా’ సహజంగా సాధారణ వ్యక్తిని తెలియజేస్తుంది.
- source_word: תִּגַּע בְּ
  choice: తాకితే
  rationale: ב తో కూడిన נגע భౌతిక స్పర్శను సూచిస్తుంది; ‘తాకితే’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: כָל דָּבָר טָמֵא
  choice: అపవిత్రమైన దేనినైనా
  rationale: דָּבָר విస్తృతార్థక పదం; తరువాతి ఉదాహరణలను సమగ్రంగా పరిచయం చేసే సాధారణ వర్గాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: נִבְלַת
  choice: కళేబరం
  rationale: లేవీయకాండపు శుద్ధి నియమాల్లో ఈ పదం చనిపోయిన జంతువు శరీరాన్ని సూచిస్తుంది; ‘కళేబరం’ ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: חַיָּה טְמֵאָה
  choice: అపవిత్రమైన అడవి జంతువు
  rationale: חַיָּה ఇక్కడ בְּהֵמָהకు భిన్నంగా అడవి జంతువును సూచిస్తుంది; ఆ భేదాన్ని స్పష్టంగా ఉంచింది.
- source_word: בְּהֵמָה טְמֵאָה
  choice: అపవిత్రమైన పశువు
  rationale: ఇది మచ్చికచేసిన నాలుగు కాళ్ల జంతువుల వర్గాన్ని సూచిస్తుంది; ‘పశువు’ అడవి జంతువుతో ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁרֶץ טָמֵא
  choice: అపవిత్రమైన పాకే ప్రాణి
  rationale: שֶׁרֶץ చిన్నగా పాకే లేదా గుంపులుగా కదిలే జీవుల వర్గాన్ని సూచిస్తుంది; ‘పాకే ప్రాణి’ సాధారణ పాఠకులకు అర్థమయ్యే సమీప తెలుగు రూపం.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: ఆ విషయం అతనికి తెలియకుండా ఉండి
  rationale: హీబ్రూ నుడికారానికి అక్షరార్థం ‘అది అతని నుండి దాచబడింది’; ఉద్దేశం అతనికి ఆ విషయం తెలియకపోవడం. ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהוּא טָמֵא
  choice: అతడు అపవిత్రుడై
  rationale: ఈ వాక్యభాగం కలిగిన ఆచారపరమైన స్థితిని తెలియజేస్తుంది; నైతిక పాపాన్ని సూచించే పదాలను చేర్చలేదు.
- source_word: וְאָשֵׁם
  choice: దోషభారాన్ని మోస్తాడు
  rationale: אָשֵׁם ఈ న్యాయసందర్భంలో దోషం లేదా బాధ్యతకు లోనవడాన్ని సూచిస్తుంది; కేవలం అంతర్గత నైతిక భావనగా కాక బాధ్యతను మోయడంగా ఈ రూపం తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: טָמֵא/טְמֵאָהను ‘అపవిత్రమైన/అపవిత్రుడు’గా అనువదించడం
  alternative: ‘కలుషితమైన’ లేదా ‘పాపభరితమైన’
  rationale: ఇక్కడ జంతు కళేబరాన్ని తాకడం వల్ల కలిగే ఆచారపరమైన అపవిత్రత ఉద్దేశించబడింది; దానిని స్వతహాగా ఉద్దేశపూర్వక నైతిక పాపంగా మార్చకూడదు.
- issue: וְאָשֵׁםలోని దోషార్థం
  choice: ‘దోషభారాన్ని మోస్తాడు’
  alternative: ‘పాపి అవుతాడు’ లేదా ‘దోషి అవుతాడు’
  rationale: మూలపాఠం దోషం/బాధ్యత ఏర్పడటాన్ని చెబుతుంది; ఆచార అపవిత్రతను ఉద్దేశపూర్వక నైతిక దుష్టత్వంతో సమానంగా చూపకుండా న్యాయపరమైన బాధ్యతను నిలుపుతుంది.
- issue: వ్యక్తిని సూచించే వ్యాకరణ లింగం
  choice: ప్రారంభంలో ‘ఎవరైనా’; తరువాత మూలంలోని పుంలింగ ఏకవచనాన్ని అనుసరించి ‘అతనికి/అతడు’
  alternative: అంతటా లింగనిరపేక్ష బహువచన రూపం
  rationale: נֶפֶשׁ యొక్క సాధారణ వ్యక్తి భావాన్ని సహజంగా తెలియజేస్తూనే, తరువాతి హీబ్రూ పుంలింగ ఏకవచన సర్వనామాలతో రూపసామ్యాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-ఆచార శైలిని వాడాం. ‘కళేబరం’ ఖచ్చితత్వం కోసం, ‘పాకే ప్రాణి’ అందుబాటు కోసం ఎంచుకున్నాం. మూలంలోని వరుస ప్రత్యామ్నాయ నిర్మాణాన్ని దీర్ఘ డాష్‌లతో స్పష్టంగా ఉంచాం.
