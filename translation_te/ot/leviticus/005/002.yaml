revisions:
- from: లేదా ఎవరైనా అపవిత్రమైన దేనినైనా తాకితే—అది అపవిత్రమైన అడవి జంతువు కళేబరమైనా, అపవిత్రమైన పశువు కళేబరమైనా, అపవిత్రమైన పాకే ప్రాణి కళేబరమైనా—ఆ విషయం అతనికి తెలియకుండా ఉండి[a], అతడు అపవిత్రుడై దోషభారాన్ని మోస్తాడు[b].
  to: లేదా ఎవరైనా ఏదైనా అశుద్ధమైన దానిని తాకితే—అశుద్ధమైన అడవి జంతువు శవమైనా, అశుద్ధమైన పెంపుడు జంతువు శవమైనా, అశుద్ధమైన పాకే జీవి శవమైనా—అది అతనికి తెలియకపోయి[a], అతడు అశుద్ధుడై దోషానికి పాత్రుడవుతాడు[b].
  rationale: మూలంలోని ఆచారపరమైన వర్గాలు, మూడు జంతు-శవాల ప్రత్యామ్నాయాలు, తెలియకపోవడం, అశుద్ధ స్థితి, మరియు దోషబాధ్యత అనే క్రమాన్ని నిలుపుతూ పదజాలాన్ని ఆధునిక ప్రామాణిక తెలుగుకు సరిచేశాం. పాదసూచిక a నిప్హాల్ రూపంలోని ‘మరుగై ఉండడం’ అనే అక్షరార్థాన్ని ఇస్తుంది; పాదసూచిక b దోషార్థాన్ని ఉద్దేశపూర్వక నైతిక పాపంతో సమానం చేయకుండా వివరిస్తుంది.
