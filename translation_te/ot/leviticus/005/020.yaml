  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా పలికాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవవాక్య పరిచయ సూత్రంలో דברను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; తరువాతి לֵאמֹרతో కలిపి ఉన్న హెబ్రీ నిర్మాణాన్ని అనవసరంగా పునరుక్తి చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే విధంగా దైవనామాన్ని శీర్షికతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించింది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో సహజమైన ఆధునిక తెలుగు విభక్తి ప్రయోగం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హెబ్రీ సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలిపింది. ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ సాధ్యమైనప్పటికీ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన దైవవాక్య పరిచయం. ‘మాట్లాడి ఇలా అన్నాడు’ అనే కృత్రిమ పునరుక్తిని నివారించి, తదుపరి ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు ద్విబిందువు వాడబడింది.
