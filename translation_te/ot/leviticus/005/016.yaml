  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: te
  text: అతడు పరిశుద్ధమైన దాని విషయంలో చేసిన అపరాధానికి నష్టపరిహారం చెల్లించి[a], దానికి అయిదవ వంతు అదనంగా చేర్చి యాజకునికి ఇవ్వాలి. అప్పుడు యాజకుడు అపరాధ పరిహార బలికి చెందిన పొట్టేలుతో[b] అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అతనికి క్షమాపణ కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధమైన దాని నుండి అన్యాయంగా నిలిపివేసినదానికి నష్టపరిహారం చెల్లించి.” హెబ్రీ వాక్యం పరిశుద్ధమైన వస్తువు లేదా దేవునికి చెందవలసిన దానితో సంబంధమున్న అపరాధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అపరాధ బలిగా అర్పించే పొట్టేలుతో.” ఇక్కడి హెబ్రీ పదం అపరాధంతో పాటు దానికి చేయవలసిన పరిహారాన్ని కూడా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: పరిశుద్ధమైన దాని విషయంలో చేసిన అపరాధానికి
  rationale: ఈ హెబ్రీ నిర్మాణం పరిశుద్ధమైన వస్తువు లేదా దేవునికి చెందవలసిన దానితో ముడిపడిన అపరాధాన్ని సూచిస్తుంది. మూలంలో లేని ‘పరిశుద్ధస్థలం’ అనే భావాన్ని చేర్చకుండా, తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: יְשַׁלֵּם
  choice: నష్టపరిహారం చెల్లించి
  rationale: ఈ న్యాయపరమైన బలి సందర్భంలో ఈ క్రియ కేవలం చెల్లింపును కాక, జరిగిన నష్టాన్ని పూడ్చే తిరిగి చెల్లింపును సూచిస్తుంది.
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: దానికి అయిదవ వంతు అదనంగా చేర్చి
  rationale: అసలు మొత్తానికి ఇరవై శాతం అదనంగా కలపాలనే హెబ్రీ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַכֹּהֵן
  choice: యాజకునికి
  rationale: గ్రహీతను నేరుగా, ప్రామాణిక బైబిలు పదజాలంతో సూచిస్తుంది.
- source_word: יְכַפֵּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: బలి సందర్భంలోని כפר పదానికి విస్తృతంగా అర్థమయ్యే సంప్రదాయ తెలుగు సమానార్థకం; అపరాధి పక్షంగా జరిగే క్రియను నిలుపుతుంది.
- source_word: בְּאֵיל הָאָשָׁם
  choice: అపరాధ పరిహార బలికి చెందిన పొట్టేలుతో
  rationale: אָשָׁםలోని అపరాధం మరియు పరిహారం అనే రెండు పార్శ్వాలను తెలుగులో నిలుపుతూ, ఇది ఒక నిర్దిష్ట బలి అని స్పష్టం చేస్తుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమాపణ కలుగుతుంది
  rationale: హెబ్రీ నిష్క్రియ రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, క్షమించే కర్తను మూలంలాగే ప్రత్యక్షంగా పేర్కొనదు.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం అనువాదం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి
  rationale: ఈ సందర్భంలో అపరాధంతో పాటు నష్టపరిహారం కూడా ప్రధానంగా ఉంది. ‘అపరాధ పరిహార బలి’ అనే రూపం ఏకపక్ష సిద్ధాంత నిర్ణయం చేయకుండా పదంలోని రెండు భావ ఛాయలను నిలుపుతుంది.
- issue: క్షమాపణకు కర్త
  choice: అతనికి క్షమాపణ కలుగుతుంది
  alternative: దేవుడు అతన్ని క్షమిస్తాడు
  rationale: మూల హెబ్రీ వాక్యం క్షమించే కర్తను స్పష్టంగా పేర్కొనదు. అందువల్ల సందర్భానుసారంగా దేవుడే కర్త అని అర్థమైనా, అనువాదంలో ఆ పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన ఆజ్ఞకు తగిన గంభీరతను ఉంచి, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘పరిశుద్ధమైనది,’ ‘యాజకుడు,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన బైబిలు పదజాలం నిలుపబడింది.
