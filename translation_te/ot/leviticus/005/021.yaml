source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: te
  text: ఎవరైనా పాపం చేసి యెహోవాపట్ల నమ్మకద్రోహంగా ప్రవర్తిస్తూ, తన తోటి వ్యక్తి విషయంలో భద్రపరచడానికి అప్పగించిన వస్తువు గురించైనా, తాకట్టు గురించైనా[a], దోపిడీ గురించైనా మోసంగా ప్రవర్తిస్తే, లేదా తన తోటి వ్యక్తిని అణచివేస్తే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన చేతిలో ఉంచబడిన దాని గురించి.’ ఈ హీబ్రూ పదబంధం యొక్క ఖచ్చితమైన న్యాయార్థం అనిశ్చితం; ఇది తాకట్టును లేదా ఒకరి చేతికి అప్పగించిన వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఎవరైనా
  rationale: న్యాయసంబంధ సందర్భంలో ఇది ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది; షరతుతో కూడిన తెలుగు వాక్యంలో ‘ఎవరైనా’ సహజంగా ఉంటుంది.
- source_word: כִּי תֶחֱטָא
  choice: పాపం చేస్తే
  rationale: כִּי మరియు అసంపూర్ణ క్రియ ఇక్కడ నియమావళికి సాధారణమైన షరతును ప్రవేశపెడుతున్నాయి.
- source_word: וּמָעֲלָה מַעַל
  choice: నమ్మకద్రోహం చేస్తే
  rationale: ఒకే మూలానికి చెందిన నామవాచకం-క్రియా నిర్మాణం విశ్వాసఘాతక చర్యను బలంగా వ్యక్తం చేస్తుంది; ‘నమ్మకద్రోహం’ దాని సంబంధాత్మక, నిబంధనాత్మక భావాన్ని అందిస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, ఈ సామాజిక తప్పు దేవునికి చేసిన నమ్మకద్రోహమని మూలపాఠం చెప్పే భావాన్ని నిలుపుతుంది.
- source_word: וְכִחֵשׁ
  choice: మోసం చేస్తే
  rationale: ఈ క్రియ అబద్ధంగా నిరాకరించడం లేదా వంచించడం అనే భావాలు కలిగి ఉంది; ఆస్తి సంబంధ న్యాయసందర్భంలో ‘మోసం’ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּעֲמִיתוֹ
  choice: తన తోటి వ్యక్తి
  rationale: עָמִית సమాజంలోని సహసభ్యుణ్ణి సూచిస్తుంది; ‘తోటి వ్యక్తి’ లింగపరంగా అనవసర పరిమితి విధించకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּפִקָּדוֹן
  choice: భద్రపరచమని అప్పగించిన దాని విషయంలో
  rationale: ఈ పదం కాపాడటానికి ఒకరి దగ్గర ఉంచిన ఆస్తిని సూచిస్తుంది; వివరణాత్మక తెలుగు దాని న్యాయార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִתְשׂוּמֶת יָד
  choice: తాకట్టు పెట్టిన దాని విషయంలో[a]
  rationale: అక్షరార్థంగా ‘చేతిలో ఉంచబడినది’ అనే అసాధారణ ప్రయోగం; లావాదేవీలో అప్పగించిన హామీ వస్తువు లేదా తాకట్టు అనే సంభావ్య భావాన్ని ప్రధాన పాఠంలో సహజంగా ఇస్తూ, అస్పష్టతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: בְגָזֵל
  choice: దోపిడీ విషయంలో
  rationale: ఈ నామవాచకం బలవంతంగా తీసుకోవడం లేదా అలా తీసుకున్న దానిని సూచించగలదు; ‘దోపిడీ’ ఆ రెండు భావాలకు తగినంత విస్తృతంగా ఉంది.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: తన తోటి వ్యక్తిని అణచివేస్తే
  rationale: ఈ క్రియ దోపిడీ చేయడం, రావలసినది నిలిపివేయడం, బలహీనుణ్ణి పీడించడం వంటి విస్తృత ఆర్థిక-సామాజిక అన్యాయాన్ని సూచిస్తుంది; ‘అణచివేయడం’ ఆ విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: తోటి వ్యక్తికి చేసిన ఆర్థిక లేదా సామాజిక అన్యాయాన్ని దేవునికి చేసిన నమ్మకద్రోహంగా వ్యక్తం చేయడం
  choice: యెహోవాకు నమ్మకద్రోహం చేస్తే
  alternative: యెహోవా విషయంలో నమ్మకద్రోహంగా ప్రవర్తిస్తే
  rationale: హీబ్రూ పాఠం తోటి వ్యక్తిపై చేసిన మోసాన్ని యెహోవాకు వ్యతిరేకమైన విశ్వాసఘాతక చర్యగా స్పష్టంగా చూపుతుంది; అనువాదం ఈ ఉద్రిక్తతను వివరణతో తగ్గించకుండా నిలుపుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయసంబంధ గంభీరతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. మూలంలోని దీర్ఘ షరతు వాక్యం కొనసాగుతున్నదని చివరి దీర్ఘగీత సూచిస్తుంది; లింగాన్ని మూలపాఠం అవసరానికి మించి ముందుకు తేవకుండా ‘ఎవరైనా’, ‘తోటి వ్యక్తి’ అనే రూపాలు ఎంచుకోబడ్డాయి.
