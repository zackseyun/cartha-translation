    issue: తాకట్టు పెట్టిన దాని విషయంలోనైనా
    rationale: This may suggest that the person under accusation was the one who put up the pledge. The Hebrew בִתְשׂוּמֶת יָד is debated and can refer to a pledge or something placed in one’s hand; “తాకట్టు విషయంలో” is less interpretively restrictive.
  - severity: low
    issue: దోపిడీ విషయంలోనైనా అతణ్ణి మోసం చేస్తే
    rationale: The placement can make “మోసం చేస్తే” sound especially attached to the robbery phrase rather than to the full preceding list. A single governing expression after the coordinated items better reflects the Hebrew legal list.
