  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: te
  text: అయితే రెండు తాబేలు పావురాలనుగానీ రెండు పావురపు పిల్లలనుగానీ అర్పించడానికి అతని స్తోమత చాలకపోతే[a], తాను చేసిన పాపం కోసం తన అర్పణగా ఏఫాలో పదోవంతు మెత్తని పిండిని పాపార్పణగా తీసుకురావాలి. దానిపై నూనె పోయకూడదు; దానిపై సాంబ్రాణి వేయకూడదు. ఎందుకంటే అది పాపార్పణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని చెయ్యి అందకపోతే”—అంటే, వాటిని సమకూర్చడానికి అతనికి తగిన స్తోమత లేకపోతే.
    reason: హీబ్రూ జాతీయం యొక్క అక్షరరూపాన్ని మరియు సందర్భార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: అతని స్తోమత చాలకపోతే
  rationale: హీబ్రూ జాతీయం అక్షరార్థంగా ‘అతని చెయ్యి అందకపోతే’ అని ఉన్నా, ఇక్కడ బలికి కావలసిన వాటిని సమకూర్చగల ఆర్థిక స్థోమత లేకపోవడాన్ని సూచిస్తుంది.
- source_word: תֹרִים
  choice: గువ్వలు
  rationale: బలి సందర్భంలో తాబేలు గువ్వల జాతిని సూచించే పదం; సాధారణ తెలుగు పాఠకులకు సహజమైన ‘గువ్వలు’ను ఎంచుకున్నాం.
- source_word: בְנֵי יוֹנָה
  choice: పావురపు పిల్లలు
  rationale: అక్షరార్థంగా ‘పావురపు కుమారులు’; చిన్న పావురాలను సూచించే హీబ్రూ ప్రయోగాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణగా
  rationale: దేవుని దగ్గరకు తీసుకొచ్చే కానుక లేదా బలిని సూచించే విస్తృత ఆచారపదం; ఇక్కడ పిండి కూడా కావడంతో ‘బలి’కన్నా ‘అర్పణ’ సముచితం.
- source_word: אֲשֶׁר חָטָא
  choice: తాను చేసిన పాపం కోసం
  rationale: అర్పణకు కారణమైన అపరాధంతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ఏఫాలో పదోవంతు
  rationale: ప్రాచీన పొడి కొలమానమైన ఏఫాను అంచనా ఆధునిక కొలతగా మార్చకుండా మూలంలోని ప్రమాణాన్ని నిలుపుతుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణలకు ఉపయోగించే సన్నగా రుబ్బిన నాణ్యమైన పిండిని సూచిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార అర్పణగా
  rationale: ఈ ఆచార సందర్భంలో חַטָּאת పాపాన్ని కాక, పాపానికి సంబంధించిన అర్పణను సూచిస్తుంది; తెలుగులో స్థిరమైన ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: దానిపై నూనె పోయకూడదు
  rationale: పిండి అర్పణ సిద్ధీకరణకు సంబంధించిన నిషేధాన్ని సహజమైన తెలుగు శాసన శైలిలో అందిస్తుంది.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: సాంబ్రాణి వేయకూడదు
  rationale: לְבֹנָה అర్పణల్లో వాడే సుగంధ గంధరసాన్ని సూచిస్తుంది; ‘సాంబ్రాణి’ ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే సమానపదం.
- source_word: כִּי חַטָּאת הִיא
  choice: ఎందుకంటే అది పాపపరిహార అర్పణ
  rationale: నూనె, సాంబ్రాణి చేర్చకూడదనే నియమానికి మూలపాఠం ఇచ్చే కారణాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת అర్థం
  choice: పాపపరిహార అర్పణ
  alternative: పాపం
  rationale: పదానికి ‘పాపం’ లేదా ‘పాపానికి సంబంధించిన అర్పణ’ అనే రెండు అర్థాలు సాధ్యమైనా, ఇక్కడ తీసుకురాబడే పదార్థం మరియు దాని సిద్ధీకరణపై ఆదేశాలు ఉన్నందున ఆచారపరమైన అర్పణార్థమే సందర్భానికి సరిపోతుంది.
- issue: పేదరికాన్ని తెలిపే హీబ్రూ జాతీయాన్ని అనువదించడం
  choice: అతని స్తోమత చాలకపోతే
  alternative: అతని చెయ్యి అందకపోతే
  rationale: మూలంలోని రూపకాన్ని పాదటిప్పణిలో భద్రపరుస్తూ, ప్రధాన పాఠంలో బలిని సమకూర్చలేని ఆర్థిక పరిస్థితిని స్పష్టంగా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర ఆదేశానికి తగిన గౌరవప్రదమైన శైలితో. ప్రాచీన కొలమానం ‘ఏఫా’ను నిలిపి, ఆచారపదం חַטָּאתను సందర్భానుసారం ‘పాపపరిహార అర్పణ’గా అనువదించాం.
