  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: te
  text: ఈ విషయాల్లో ఏదో ఒకదాని విషయంలో అతడు దోషిగా అయినప్పుడు[a], తాను దాని విషయంలో చేసిన పాపాన్ని ఒప్పుకోవాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దోషానికి బాధ్యుడైనప్పుడు” లేదా “దోషిగా ఉన్నప్పుడు.” హీబ్రూ క్రియ కేవలం తాను తప్పు చేశాననే అంతరంగ అవగాహనకన్నా న్యాయపరమైన దోషస్థితిని లేదా బాధ్యతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తాను దాని విషయంలో పాపం చేసినది”; ఇది ఇంతకు ముందు పేర్కొన్న సందర్భాల్లో ఒకదానిని తిరిగి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు / జరిగినప్పుడు
  rationale: న్యాయవిధిలో ఒక పరిస్థితి ఏర్పడిన తరువాత చేయవలసినదాన్ని పరిచయం చేసే సూత్రప్రాయ నిర్మాణం. తెలుగులో ప్రత్యేకంగా ‘అది జరుగును’ అని ఉంచడం కృత్రిమంగా ఉండేందున ‘...నప్పుడు’ నిర్మాణంలో సహజంగా వ్యక్తపరచబడింది.
- source_word: יֶאְשַׁם
  choice: దోషిగా నిలిచినప్పుడు
  rationale: אשם క్రియ ఇక్కడ కేవలం అంతరంగ దోషజ్ఞానాన్ని కాక, అపరాధం వల్ల కలిగే న్యాయపరమైన దోషస్థితి లేదా బాధ్యతను సూచిస్తుంది.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: ఈ విషయాల్లో దేనిలోనైనా ఒకదాని విషయంలో
  rationale: ముందు పేర్కొన్న సందర్భాల్లో ఒకదానిని సూచిస్తుంది; ‘విషయంలో’ సంబంధార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְהִתְוַדָּה
  choice: ఒప్పుకోవాలి
  rationale: ידה యొక్క హిత్పయేల్ రూపం ఇక్కడ పాపాన్ని అంగీకరించి ఒప్పుకోవడాన్ని సూచిస్తుంది; విధి స్వభావాన్ని తెలుగులో ‘ఒప్పుకోవాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: తాను దాని విషయంలో చేసిన పాపాన్ని
  rationale: సాపేక్ష వాక్యాన్నీ, עָלֶיהָలోని ముందటి సందర్భాన్ని తిరిగి సూచించే సంబంధాన్నీ నిలుపుతూ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יֶאְשַׁם దోషజ్ఞానమా లేక న్యాయపరమైన దోషస్థితియా
  choice: దోషిగా నిలిచినప్పుడు
  alternative: తాను దోషినని గ్రహించినప్పుడు
  rationale: మూల క్రియ న్యాయపరమైన దోషం లేదా బాధ్యతను ప్రధానంగా సూచిస్తుంది; ‘గ్రహించినప్పుడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని అంతరంగ అవగాహనను చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని న్యాయవిధి ధోరణిని గౌరవిస్తూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. పుంలింగ ఏకవచనం మూలంలోని వ్యాకరణ రూపాన్ని అనుసరిస్తుంది.
