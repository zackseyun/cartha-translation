base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: te
  text: యాజకుడు యాహ్వే సన్నిధిలో అతని కొరకు ప్రాయశ్చిత్తం చేస్తాడు; అప్పుడు, అతడు దోషిగా నిలిచేలా చేసిన పనులన్నిటిలో ఏదైనా ఒక దానిని బట్టి అతనికి క్షమాపణ లభిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: ‘అతడు చేసి, దానివల్ల దోషిగా కావడానికి కారణమయ్యే వాటన్నిటిలో ఒక దానిని బట్టి.’'
    reason: మూలంలోని אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ నిర్మాణానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: బలుల సందర్భంలో כפר పీయేల్ రూపం ప్రాయశ్చిత్తాన్ని జరిగించడాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్తం చేయాలి’ అనే పదబంధం ఆ ఆరాధనాపరమైన భావాన్ని ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: అతని నిమిత్తం
  rationale: כפר తో వచ్చిన על, ఎవరి తరఫున ప్రాయశ్చిత్తం చేయబడుతుందో సూచిస్తుంది. ‘అతని నిమిత్తం’ సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనాపరమైన సందర్భంలోని నిర్దిష్ట నామవాచకానికి నేరమైన తెలుగు రూపం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי దేవుని సమక్షాన్ని సూచిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְנִסְלַח לוֹ
  choice: అతడు క్షమించబడతాడు
  rationale: סלח నిఫాల్ రూపం దోషికి లభించే క్షమాపణను కర్మణి భావంలో వ్యక్తం చేస్తుంది. దేవుడే క్షమించేవాడని సందర్భంలో సూచితమై ఉన్నప్పటికీ, వచనం చెప్పనిదాన్ని స్పష్టంగా చేర్చలేదు.
- source_word: עַל אַחַת מִכֹּל
  choice: పనులన్నిటిలో ఏ ఒక్కదాని విషయమైనా
  rationale: మొత్తం అపరాధాల వర్గంలో ఏ ఒక్క సందర్భానికైనా ఇది వర్తిస్తుందనే విభాజక భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: అతడు దోషిగా నిలవడానికి కారణమైన పనులు
  rationale: ‘అతడు చేసి, దానివల్ల దోషిగా అయ్యే’ అనే హెబ్రీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ఇక్కడ אַשְׁמָה అంటే అపరాధపరిహార బలి కాదు, ఆ పనివల్ల కలిగే దోషస్థితి.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ఒడంబడిక నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: క్షమించేవారి కర్తృత్వం
  choice: కర్మణి రూపమైన ‘అతడు క్షమించబడతాడు’ను నిలుపడం
  alternative: ‘యాహ్వే అతన్ని క్షమిస్తాడు’
  rationale: దేవుడే క్షమించేవాడని సందర్భం సూచించినా, హెబ్రీ వాక్యం కర్తను ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అసలు పాఠంలోని పరోక్షతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ఆరాధనాపరమైన కీలక పదంగా ‘ప్రాయశ్చిత్తం’ను నిలిపి, మిగతా వాక్యాన్ని సహజంగా రూపొందించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న చివరి అపరాధ-వాక్యభాగం తరువాత ఉంచాం.
