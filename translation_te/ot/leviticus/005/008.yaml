  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: te
  text: వాటిని యాజకుని దగ్గరికి తీసుకురావాలి. యాజకుడు పాపపరిహార బలి[a] కోసం ఉద్దేశించిన పక్షిని మొదట అర్పించి, దాని తలను దాని మెడ ముందువైపు దగ్గర నులిమాలి[b]; అయితే దానిని పూర్తిగా వేరు చేయకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి.” లేవీయకాండంలోని బలుల సందర్భంలో חַטָּאת అనే హీబ్రూ పదాన్ని ఈ విధంగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియ పక్షిబలిలో యాజకుడు తల, మెడ భాగంపై చేతితో చేసే ప్రత్యేక ఆచారక్రియను సూచిస్తుంది. సాంప్రదాయ అనువాదాలు దీనిని తరచుగా “తలను మెలిపెట్టి వేరు చేయడం” అని అనువదిస్తాయి; అయితే ఇక్కడ అది పూర్తిగా విడిపోకూడదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, తలను శరీరం నుంచి పూర్తిగా విడదీయకూడదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: వాటిని యాజకుని దగ్గరికి తీసుకురావాలి
  rationale: ముందటి వచనంలోని రెండు పక్షులను సూచించే బహువచనాన్ని నిలుపుతూ, ధర్మశాస్త్ర ఆదేశానికి సహజమైన ఆధునిక తెలుగు రూపాన్ని వాడింది.
- source_word: וְהִקְרִיב
  choice: యాజకుడు ... అర్పించి
  rationale: హిఫిల్ రూపం బలిగా సమర్పించే ఆచారక్రియను సూచిస్తుంది. మొదటి క్రియలో వ్యక్తి పక్షులను యాజకుని దగ్గరకు తీసుకురావడం, తరువాత యాజకుడు ఆచారక్రియ చేయడం అనే సందర్భానుసార కర్త మార్పును తెలుగులో స్పష్టం చేసింది.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: పాపపరిహార బలి కోసం ఉద్దేశించిన పక్షిని మొదట
  rationale: ఎంపికైన పక్షి ఉద్దేశాన్ని, అలాగే רִאשׁוֹנָה తెలిపే క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: లేవీయకాండంలోని బలుల సందర్భంలో ఇది పాపానికి సంబంధించిన బలిని సూచించే సుపరిచిత తెలుగు పదబంధం; ‘శుద్ధీకరణ బలి’ అనే భావసంభావ్యతను పాదటిప్పణిలో నిలిపింది.
- source_word: וּמָלַק
  choice: గిల్లి తెంపాలి
  rationale: పక్షిబలిలో యాజకుడు చేతితో చేసే ప్రత్యేక చర్యను సూచించే సాంకేతిక క్రియకు సహజంగా అర్థమయ్యే తెలుగు రూపం. ఇది సాధారణంగా కత్తిరించడాన్ని సూచించదు.
- source_word: מִמּוּל עָרְפּוֹ
  choice: దాని మెడ ముందువైపు నుంచి
  rationale: మూల పదబంధం స్థానం విషయంలో క్లిష్టమైనదైనా, מוּל మరియు עֹרֶף కలయికను ఆచార సందర్భంలో సహజంగా వ్యక్తపరుస్తూ అతిగా శరీర నిర్మాణ వివరాన్ని జోడించదు.
- source_word: וְלֹא יַבְדִּיל
  choice: అయితే దానిని పూర్తిగా వేరు చేయకూడదు
  rationale: בדל యొక్క ‘వేరు చేయడం’ భావాన్ని నిలుపుతూ, సందర్భంలో తల శరీరం నుంచి పూర్తిగా విడిపోకూడదనే ఆచార పరిమితిని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి పేరు
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలిని, ఆచార శుద్ధీకరణను రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచిత పదాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి మూలంలోని భావవ్యాప్తిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడింది. ధర్మశాస్త్ర ఆదేశాన్ని ‘చేయాలి/చేయకూడదు’ రూపంలో తెలిపింది. మూలంలో వరుస క్రియలకు ఒకే వ్యాకరణ కర్త కనిపించినా, బలి ఆచార సందర్భం వల్ల రెండవ క్రియ నుంచి యాజకుడే కర్త అని పాఠ్యంలో స్పష్టం చేసింది.
