id: LEV.5.12
reference: Leviticus 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: te
  text: అతడు దానిని యాజకుని దగ్గరికి తీసుకురావాలి. యాజకుడు దానిలోనుంచి తన పిడికెడు నిండా దాని జ్ఞాపక భాగాన్ని తీసుకొని, బలిపీఠంపై యాహ్వేకు అగ్నితో అర్పించే అర్పణల[b] మీద దానిని దహించాలి. అది పాపబలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది శుద్ధీకరణ బలి.” హీబ్రూ పదం పాపంతో వ్యవహరించే బలి యొక్క శుద్ధీకరణ కార్యాన్ని కూడా సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “యాహ్వేకు అగ్నిచేత అర్పించే అర్పణలు.” ఇది బలిపీఠంపై అగ్నితో అర్పించే బలులను సూచించే ఆచారపరమైన పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: అతడు దానిని ... తీసుకురావాలి
  rationale: హిఫిల్ రూపం ముందరి సందర్భంలోని పిండి అర్పణను యాజకుని దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది. తెలుగు న్యాయవిధి శైలిలో ‘తీసుకురావాలి’ సహజంగా ఉంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని బలి ఆచార సందర్భంలో כֹּהֵן‌కు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: తన పిడికెడు నిండా తీసుకొని
  rationale: ఇది ధాన్యార్పణలో యాజకుడు చేతితో ఒక నిర్దిష్ట భాగాన్ని తీసే సాంకేతిక ఆచార చర్య. మూలంలోని ‘అతని పిడికెడు నిండా’ అనే కొలతను నిలుపుతుంది.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: దాని జ్ఞాపక భాగంగా
  rationale: బలిపీఠంపై దహించే ప్రతినిధి భాగాన్ని సూచించే ఆచారపరమైన పదం; ‘భాగం’ అని చేర్చడం ఆధునిక పాఠకునికి అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: బలిపీఠంపై దాన్ని దహించాలి
  rationale: కטר హిఫిల్ బలి సందర్భంలో అర్పణను బలిపీఠంపై దహించి పొగగా పైకి లేపడాన్ని సూచిస్తుంది. ‘దహించాలి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: యాహ్వేకు అగ్నితో అర్పించే అర్పణల మీద
  rationale: עַל యొక్క స్థలార్థమైన ‘మీద’ను, אִשִּׁים అనే అగ్ని-అర్పణల సాంకేతిక భావాన్ని సాధ్యమైనంత ప్రత్యక్షంగా నిలుపుతుంది; ‘ఆహార అర్పణలు’ అనే వివరణాత్మక నిర్ణయాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: חַטָּאת הִוא
  choice: అది పాపపరిహార బలి
  rationale: ఈ బలి వర్గాన్ని సాధారణ పాఠకునికి గుర్తించదగిన రీతిలో తెలియజేస్తుంది. హీబ్రూ పదంలోని శుద్ధీకరణ భావసాధ్యతను పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: యాజక బలి ధర్మశాస్త్రంలో חַטָּאת అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో పదం బలి వర్గాన్ని సూచిస్తుంది. అది పాపంతో వ్యవహరించే బలి అనే సంప్రదాయ భావాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది; ఆచార శుద్ధీకరణపై దృష్టి పెట్టే సముచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి భావ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
- issue: עַל אִשֵּׁי יְהוָהలో עַל సంబంధం
  choice: అర్పణల మీద
  alternative: అర్పణలకు అదనంగా / వాటితో పాటు
  rationale: మూలంలోని సాధారణ స్థలార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. సందర్భానుసారంగా ‘వాటితో పాటు’ అనే అనుబంధ భావం సాధ్యమైనప్పటికీ, దాన్ని నిర్బంధంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. ‘యాజకుడు,’ ‘బలిపీఠం,’ ‘బలి’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలం నిలుపబడింది. ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
