reference: Leviticus 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: te
  text: అతడు పాపపరిహార బలి రక్తంలో కొంత బలిపీఠం పక్క భాగం మీద చిలకరించాలి[a]; రక్తంలో మిగిలినదాన్ని బలిపీఠం అడుగు భాగం వద్ద పిండాలి. అది పాపపరిహార బలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో రెండుసార్లు వచ్చిన “పాపపరిహార బలి”కి “శుద్ధీకరణ బలి” అని కూడా అనువదించవచ్చు. హెబ్రీ పదం חַטָּאת పాపానికి సంబంధించిన బలిని సూచిస్తూ, దాని శుద్ధీకరణ కార్యాన్ని కూడా నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: చిలకరించాలి
  rationale: నזה అనే ధాతువు హిఫీల్ రూపంలో బలికి సంబంధించిన సందర్భంలో రక్తాన్ని ఆచారపూర్వకంగా చిలకరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: מִדַּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; ఈ దశలో రక్తమంతటినీ కాక దానిలో కొంతను ఉపయోగిస్తున్నారనే భావాన్ని తెలియజేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חַטָּאת ఇక్కడ పాపానికే కాక పాపానికి సంబంధించిన బలిని సూచిస్తుంది. 'పాపపరిహార బలి' సాధారణ పాఠకుడికి బలి వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది; శుద్ధీకరణ కార్యంపై గల ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్క భాగం మీద
  rationale: קִיר అక్షరార్థంగా గోడ అయినా, బలిపీఠానికి సంబంధించి తెలుగులో 'పక్క భాగం' సహజంగా ఉండి ఉద్దేశించిన నిలువు ఉపరితలాన్ని సూచిస్తుంది.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: రక్తంలో మిగిలినదాన్ని
  rationale: నిఫాల్ కృదంతం రక్తంలో మిగిలి ఉన్న భాగాన్ని సూచిస్తుంది; ఈ రూపం మూలంలోని నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יִמָּצֶה
  choice: పూర్తిగా కార్చాలి
  rationale: מצה నిఫాల్ రూపం మిగిలిన రక్తాన్ని పిండి లేదా కార్చి పూర్తిగా వెలికి తీయడాన్ని సూచిస్తుంది. 'పూర్తిగా కార్చాలి' అనేది కేవలం పోయడం కంటే ఈ భావాన్ని మెరుగ్గా అందిస్తుంది.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠం అడుగు భాగం దగ్గర
  rationale: יְסוֹד అనేది పునాది లేదా అడుగు భాగాన్ని సూచిస్తుంది; אֶל యొక్క దిశాత్మక భావాన్ని 'దగ్గర' సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חַטָּאת הוּא
  choice: అది పాపపరిహార బలి
  rationale: ఈ వాక్యం సమర్పణను దాని బలి వర్గం ప్రకారం గుర్తిస్తుంది; ముందు వాడిన పదంతో ఏకరూపతను కాపాడాం.
theological_decisions:
- issue: బలి నియమాల్లో חַטָּאת పదానికి అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ హెబ్రీ పదం పాపంతో బలికి ఉన్న సంబంధాన్నీ, ఆచారపరమైన శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన బలి వర్గాన్ని స్పష్టంగా ఉంచి, ముఖ్యమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకుడికి అర్థమయ్యేలా, అయితే బలివిధి యొక్క గంభీరతను నిలుపుతూ అనువదించాం. 'చిలకరించాలి,' 'పక్క భాగం,' 'అడుగు భాగం' వంటి సహజ పదాలను ఎంచుకున్నాం.
