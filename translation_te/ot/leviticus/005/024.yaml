  variant: modern standard Telugu
source:
  edition: WLC
  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: te
  text: లేదా తాను దేని గురించి అబద్ధంగా ప్రమాణం చేశాడో, దానిని పూర్తిగా చెల్లించాలి; దానికి ఐదవ వంతు అదనంగా చేర్చాలి. అది ఎవరికి చెందుతుందో వారికి, తన అపరాధ పరిహార బలి దినాన దానిని ఇవ్వాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన అపరాధ దినాన.” ఇక్కడి హెబ్రీ పదం అపరాధాన్నిగానీ, అపరాధ పరిహార బలినిగానీ సూచించవచ్చు; ప్రధాన పాఠం బలుల సందర్భాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּ֞ל אֲשֶׁר
  choice: లేదా తాను దేని గురించి
  rationale: మునుపటి వచనంలోని జాబితాను ‘లేదా’ కొనసాగిస్తుంది; విస్తృతార్థకమైన హెబ్రీ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘దేని గురించి’ అని వ్యక్తపరచింది.
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: అబద్ధ ప్రమాణం చేశాడో
  rationale: ఒక వస్తువు లేదా విషయం గురించి అసత్యంగా ప్రమాణం చేయడమనే న్యాయపరమైన భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: దానిని పూర్తిగా తిరిగి చెల్లించి
  rationale: అక్షరార్థంగా ‘దాని మూలంతో/తలతో’ అనే న్యాయపరమైన నుడికారం అసలు మొత్తాన్ని పూర్తిగా తిరిగి చెల్లించడాన్ని సూచిస్తుంది.
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: దానికి ఐదవ వంతు అదనంగా చేర్చాలి
  rationale: అసలు విలువకు మరో ఇరవై శాతం కలపాలనే పరిహార సూత్రాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: అది ఎవరికి చెందుతుందో వారికి
  rationale: అక్షరార్థ హెబ్రీ నిర్మాణంలోని న్యాయమైన యాజమాన్య భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִתְּנֶ֖/נּוּ
  choice: దానిని ఇవ్వాలి
  rationale: נתן అనే సాధారణ ‘ఇవ్వు’ క్రియను ఇక్కడ హక్కుదారునికి పరిహారం అందజేయడమనే సందర్భానుసార అర్థంతో అనువదించింది.
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: తన అపరాధ పరిహార బలి అర్పించే రోజున
  rationale: אַשְׁמָה/אָשָׁם అపరాధ స్థితినీ, దానికి సంబంధించిన బలినీ సూచించగలదు. సమీప బలిసంబంధ సందర్భాన్ని అనుసరించి ప్రధాన పాఠంలో బలి భావాన్ని ఎంచుకుంది; ‘అర్పించే’ అనేది తెలుగులో కాలసంబంధాన్ని స్పష్టం చేసే సందర్భోచిత పూరకం.
theological_decisions:
- issue: בְּיוֹם אַשְׁמָתוֹ లోని אַשְׁמָתוֹ భావం
  choice: తన అపరాధ పరిహార బలి అర్పించే రోజున
  alternative: తన అపరాధ దినాన / తాను అపరాధిగా నిలిచిన రోజున
  rationale: ఈ పదం అపరాధాన్నీ అపరాధ పరిహార బలినీ సూచించగలదు. లేవీయకాండంలోని తక్షణ బలిసంబంధ సందర్భం కారణంగా ప్రధాన పాఠం బలి భావాన్ని అనుసరిస్తుంది; అయితే మూలంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిర్మాణం. ‘అపరాధ పరిహార బలి’ అనే పదబంధం లేవీయకాండంలోని ఆచారసంబంధ భావాన్ని తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
