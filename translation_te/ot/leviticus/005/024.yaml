revisions:
- from: లేదా తాను దేని గురించి అబద్ధ ప్రమాణం చేశాడో దానిని పూర్తిగా తిరిగి చెల్లించి, దానికి ఐదవ వంతు అదనంగా చేర్చాలి. అది ఎవరికి చెందుతుందో వారికి, తన అపరాధ పరిహార బలి అర్పించే రోజున దానిని ఇవ్వాలి.[a]
