id: LEV.5.22
reference: Leviticus 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: te
  text: లేదా పోయిన వస్తువు దొరికితే, దాని విషయంలో అబద్ధం చెప్పి, అబద్ధంగా ప్రమాణం చేసి—మనిషి వాటి ద్వారా పాపం చేయడానికి చేసే వాటన్నిటిలో ఏదైనా ఒకటి చేసినా—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָא אֲבֵדָה
  choice: పోయిన వస్తువు తనకు దొరికినప్పుడు
  rationale: אֲבֵדָה అనేది పోగొట్టుకున్న లేదా తప్పిపోయిన ఆస్తి/వస్తువును సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, దొరికిన వ్యక్తి దృష్టికోణాన్ని స్పష్టం చేస్తూ అనువదించబడింది.
- source_word: וְכִחֶשׁ בָּהּ
  choice: దాని గురించి అబద్ధమాడి
  rationale: כחשׁ ఇక్కడ దొరికిన వస్తువు విషయంలో అబద్ధంగా నిరాకరించడం లేదా మోసంగా మాట్లాడడం అనే భావం కలిగిస్తుంది; మూలంలోని విస్తృతతను కాపాడేందుకు సాధారణ రూపం వాడబడింది.
- source_word: וְנִשְׁבַּע עַל שָׁקֶר
  choice: అబద్ధ ప్రమాణం చేసినా
  rationale: ఈ పదబంధం అసత్యమైన ప్రమాణాన్ని సూచిస్తుంది. సంక్షిప్తమైన, సహజమైన తెలుగు న్యాయ-మతపరమైన వాడుకను ఎంచుకున్నాం.
- source_word: הָאָדָם
  choice: మనిషి
  rationale: మూలంలోని సాధారణ మానవ సూచనను పదరూపానికి సమీపంగా ఉంచుతూ ‘మనిషి’గా అనువదించబడింది; సందర్భంలో ఇది మానవజాతికి సాధారణంగా వర్తిస్తుంది.
- source_word: לַחֲטֹא בָהֵנָּה
  choice: పాపం చేయడానికి పాల్పడే
  rationale: బְּ ప్రాతిపదికతో ఉన్న అస్పష్ట సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా, ఈ క్రియల ద్వారా పాపంలో చిక్కుకోవడం/పాల్పడడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הָאָדָם యొక్క సాధారణ పరిధి
  choice: మనిషి
  alternative: ఒక వ్యక్తి
  rationale: ‘మనిషి’ మూలపదానికి మరింత రూపసామ్యంగా ఉంది; ఇక్కడ లింగాన్ని పరిమితం చేసే సిద్ధాంతార్థాన్ని ఉద్దేశించకుండా సాధారణ మానవ సూచనగా చదవాలి.
- issue: పాపం మరియు పేర్కొన్న క్రియల మధ్య సంబంధం
  choice: పాపం చేయడానికి పాల్పడే ఇలాంటి వాటన్నిటిలో
  alternative: వాటి ద్వారా పాపం చేసే
  rationale: לַחֲטֹא בָהֵנָּה లోని సంబంధాన్ని మూలం పూర్తిగా విశదీకరించదు. తెలుగు వాక్యం అర్థవంతంగా ఉండేంత స్పష్టత ఇస్తూనే కారణం, సాధనం, లేదా పరిధి అనే ఒక్క భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ఈ వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
