  text: וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַל חַטָּאת֧/וֹ אֲשֶׁר חָטָ֛א מֵֽ/אַחַ֥ת מֵ/אֵ֖לֶּה וְ/נִסְלַ֣ח ל֑/וֹ וְ/הָיְתָ֥ה לַ/כֹּהֵ֖ן כַּ/מִּנְחָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: te
  text: ఈ వాటిలో దేని విషయంలోనైనా అతడు చేసిన పాపం కోసం యాజకుడు అతని నిమిత్తం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతడు క్షమించబడతాడు.[a] అది ధాన్యార్పణలాగే యాజకునికి చెందుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి అది క్షమించబడుతుంది.” హీబ్రూ వాక్యం కర్మణి రూపంలో ఉంది; క్షమించేవారు ఎవరో స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక సంబంధ బలి ఆచార సందర్భంలో כפר పాపానికి ప్రాయశ్చిత్తం కలిగించే ఆచారక్రియను సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు భాషలో ‘ప్రాయశ్చిత్తం చేయడం’ స్పష్టంగా, స్థిరంగా ఉన్న పదబంధం; ప్రాయశ్చిత్త సిద్ధాంతంలోని ఏ ఒక్క ప్రత్యేక వివరణనూ ఇది రుద్దదు.
- source_word: עָלָיו
  choice: అతని నిమిత్తం
  rationale: כפרతో కూడిన עַל అపరాధి తరఫున లేదా అతని కొరకు జరిగే ప్రాయశ్చిత్త కార్యాన్ని సూచిస్తుంది. ‘అతని నిమిత్తం’ గౌరవప్రదమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆరాధనా నియమాల సందర్భంలో כֹּהֵןకు ప్రామాణికమైన తెలుగు పదం.
- source_word: עַל חַטָּאתוֹ
  choice: అతడు చేసిన పాపం కోసం
  rationale: חַטָּאת అనేది ‘పాపం’ లేదా ‘పాపపరిహార బలి’ అని అర్థమివ్వగలదు. అయితే వెంటనే వచ్చే אֲשֶׁר חָטָא (‘అతడు చేసిన’) అనే సంబంధ వాక్యం ఇక్కడ బలికన్నా అపరాధాన్నే సూచిస్తుంది.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: ఈ వాటిలో దేని విషయంలోనైనా
  rationale: ఈ భాగం ముందుగా పేర్కొన్న అపరాధ సందర్భాల్లో ఏ ఒక్కదానినైనా సూచిస్తుంది. ఎంపిక చేసిన రూపం విభాజక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అప్పుడు అతడు క్షమించబడతాడు
  rationale: నిఫాల్ క్రియ క్షమాపణ పొందిన ఫలితాన్ని తెలియజేస్తుంది. క్షమించేవారు ఎవరో మూలపాఠం స్పష్టంగా పేర్కొనదు; తెలుగు కర్మణి రూపం కూడా ఆ మౌనాన్ని కాపాడుతుంది.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: అది యాజకునికి చెందుతుంది
  rationale: స్త్రీలింగ క్రియ సందర్భంలోని అర్పణను తిరిగి సూచిస్తుంది. ‘చెందుతుంది’ యాజకుని హక్కు లేదా స్వాధీనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּמִּנְחָה
  choice: ధాన్యార్పణలాగే
  rationale: లేవీయకాండ ఆరాధనా సందర్భంలో מִנְחָה సాధారణంగా ధాన్యార్పణను సూచిస్తుంది. ‘ధాన్యార్పణ’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: బలి ఆచారం తరువాత వచ్చే క్షమాపణ సూత్రవాక్యం
  choice: అతడు క్షమించబడతాడు
  alternative: అతనికి అది క్షమించబడుతుంది
  rationale: హీబ్రూ కర్మణి రూపం క్షమించేవారిని పేరుపెట్టి చెప్పకుండా, ప్రాయశ్చిత్తం తరువాత కలిగే క్షమాపణ ఫలితాన్ని ముందుకు తెస్తుంది. ప్రధాన అనువాదం సహజమైన తెలుగులో ఇదే నియంత్రణను నిలుపుతుంది; ప్రత్యామ్నాయం హీబ్రూ వాక్యనిర్మాణంలోని వ్యక్తిరహిత భావానికి మరింత దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ప్రాయశ్చిత్తం’, ‘యాజకుడు’, ‘ధాన్యార్పణ’ వంటి ఆరాధనా పదాలను సందర్భ స్పష్టత కోసం నిలుపుకున్నాం; వాక్యాన్ని అతిగా పురాతనీకరించలేదు.
