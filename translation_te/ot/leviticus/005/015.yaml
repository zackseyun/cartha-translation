id: LEV.5.15
reference: Leviticus 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: te
  text: ఎవరైనా యెహోవా పవిత్రమైన వాటి పట్ల నమ్మకద్రోహం చేసి, అనుకోకుండా పాపం చేస్తే, అతడు యెహోవాకు తన పరిహార అర్పణగా[a] మందలోనుండి లోపంలేని ఒక పొట్టేలును తీసుకురావాలి; అది పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం[b] నీవు నిర్ణయించిన వెండి షెకెలుల విలువగలదై ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరిహార అర్పణ’కు ‘అపరాధ అర్పణ’ లేదా ‘దోష పరిహార అర్పణ’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం אָשָׁם అపరాధ బాధ్యతను, అలాగే దానికి పరిహారం చేసే బలిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘పవిత్రస్థలపు షెకెలు’ అంటే పవిత్ర సంబంధమైన మూల్యాంకనాలకు ఉపయోగించిన ప్రామాణిక బరువు.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఎవరైనా
  rationale: న్యాయపరమైన సందర్భంలో ఇది ఒక వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎవరైనా’ సహజంగా ఉండి సాధారణ వర్తింపును నిలుపుతుంది.
- source_word: תִמְעֹל מַעַל
  choice: నమ్మకద్రోహం చేసి
  rationale: క్రియ-నామ రూపాల కలయిక పవిత్ర బాధ్యతను విశ్వాసఘాతకంగా ఉల్లంఘించడాన్ని బలంగా వ్యక్తం చేస్తుంది.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: అనుకోకుండా పాపం చేస్తే
  rationale: בִשְׁגָגָה ఉద్దేశపూర్వక తిరుగుబాటును కాక, తెలియక లేదా పొరపాటున జరిగిన క్రియను సూచిస్తుంది.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: యెహోవా పవిత్రమైన వాటి విషయంలో
  rationale: పవిత్రపరచబడిన వస్తువులు, అర్పణలు లేదా దేవునికి చెందవలసిన వాటికి సంబంధించిన అపరాధమనే విస్తృత భావాన్ని సంకుచితం చేయకుండా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: పరిహార అర్పణ / అపరాధ పరిహార అర్పణ
  rationale: אָשָׁם అపరాధ బాధ్యతను, దానికి సంబంధించిన బలిని లేదా నష్టపరిహార పరిష్కారాన్ని సూచించగలదు. ఈ సందర్భంలోని వెండి మూల్యాంకనం వల్ల పరిహార భావం ముఖ్యమైనది; ముగింపులో అపరాధం-పరిహారం రెండింటినీ స్పష్టంగా ఉంచింది.
- source_word: אַיִל תָּמִים
  choice: లోపంలేని ఒక పొట్టేలు
  rationale: బలి సందర్భంలో תָּמִים శారీరక లోపం లేనిదని సూచిస్తుంది.
- source_word: מִן הַצֹּאן
  choice: మందలోనుండి
  rationale: צֹאן చిన్న పశువుల మందను సూచిస్తుంది; אַיִל ఇప్పటికే మగ గొర్రెను నిర్దిష్టం చేస్తుంది.
- source_word: בְּעֶרְכְּךָ כֶּסֶף שְׁקָלִים
  choice: వెండి షెకెలలో నీవు నిర్ణయించే విలువకు
  rationale: ద్వితీయ పురుష ఏకవచన మూల్యాంకన సూత్రాన్ని నిలుపుతూ, విలువ వెండి షెకెలల్లో నిర్ణయించబడుతుందని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది పవిత్ర వ్యవహారాల్లో వాడే ప్రామాణిక బరువు ప్రమాణమని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం
  choice: పరిహార అర్పణ / అపరాధ పరిహార అర్పణ
  alternative: అపరాధ అర్పణ; దోష పరిహార అర్పణ
  rationale: ఈ వచనంలో యెహోవాకు చెందిన పవిత్ర వస్తువుల నష్టం మరియు వెండి మూల్యాంకనం ప్రస్తావించబడటంతో పరిహార స్వభావం ముందుకు వస్తుంది. అయితే పదంలోని అపరాధ బాధ్యత భావాన్ని పూర్తిగా తొలగించకుండా ముగింపులో ‘అపరాధ పరిహార అర్పణ’గా ఉంచింది.
- issue: న్యాయ సూత్రంలోని లింగ ఏకవచనం
  choice: ఎవరైనా ... అతడు
  alternative: ఒక వ్యక్తి ... వారు
  rationale: נֶפֶשׁ సాధారణ వ్యక్తిని సూచించినా, తరువాతి హెబ్రీ క్రియ పురుష ఏకవచనంలో ఉంది; తెలుగులో ప్రతినిధి ఏకవచనాన్ని నిలిపింది.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయ-ఆరాధనా శైలి. ‘షెకెలు’ అనే చారిత్రక కొలమానాన్ని లిప్యంతరీకరించి, దాని అర్థాన్ని పాదసూచికలో వివరించింది. పాదసూచిక గుర్తులను సంబంధిత పదబంధాల దగ్గర ఉంచడం కోసం తుది పాఠంలో [a]ను ‘పరిహార అర్పణ’ తరువాత, [b]ను ‘పవిత్రస్థలపు షెకెలు’ తరువాత ఉంచాలి.
