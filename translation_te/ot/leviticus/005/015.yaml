revisions:
- from: 'ఎవరైనా యెహోవా పవిత్రమైన వాటి విషయంలో నమ్మకద్రోహం చేసి, అనుకోకుండా పాపం చేస్తే, అతడు తన పరిహార అర్పణను యెహోవా దగ్గరికి తీసుకురావాలి: మందలోనుండి లోపంలేని ఒక పొట్టేలును, పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం వెండి షెకెలలో నీవు నిర్ణయించే విలువకు, అపరాధ పరిహార అర్పణగా తీసుకురావాలి.[a][b]'
  to: ఎవరైనా యెహోవా పవిత్రమైన వాటి పట్ల నమ్మకద్రోహం చేసి, అనుకోకుండా పాపం చేస్తే, అతడు యెహోవాకు తన పరిహార అర్పణగా[a] మందలోనుండి లోపంలేని ఒక పొట్టేలును తీసుకురావాలి; అది పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం[b] నీవు నిర్ణయించిన వెండి షెకెలుల విలువగలదై ఉండాలి.
  rationale: వాక్యాన్ని మూలంలోని ఒకే ప్రధాన క్రియకు అనుగుణంగా పునర్నిర్మించాను. అర్పణ పదానికి ఒకే అనువాదాన్ని నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాను. రెండు పాదసూచిక గుర్తులనూ అవి వివరించే పదబంధాల వెంటనే అమర్చాను. ‘నీవు నిర్ణయించిన’ అనే రెండవ పురుష ఏకవచనాన్ని మూల న్యాయసూత్రంలోని సంబోధనగా కాపాడాను.
