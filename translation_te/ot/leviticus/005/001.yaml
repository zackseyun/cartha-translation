source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: te
  text: '“ఎవరైనా పాపం చేస్తే: అతడు శాపంతో కూడిన ప్రమాణ పిలుపు[a] విని, సాక్షి అయి ఉండి, తాను చూసినా లేక తనకు తెలిసినా, దానిని తెలియజేయకపోతే, తన దోషభారాన్ని మోయాలి.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రమాణం యొక్క స్వరం” లేదా “శాపవాక్యపు స్వరం”; ఇక్కడ ఇది సాక్ష్యం చెప్పాలని చేసే గంభీరమైన ప్రమాణపూర్వక పిలుపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన దోషాన్ని భరించాలి.” ఈ హీబ్రూ నుడికారం సాక్ష్యాన్ని వెల్లడించకుండా దాచిన అపరాధానికి ఆ వ్యక్తి బాధ్యుడిగా ఉంటాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఎవరైనా / ఆ వ్యక్తి
  rationale: లేవీయకాండంలోని న్యాయ సందర్భంలో נֶפֶשׁ అంటే అధిభౌతిక భావంలోని ‘ఆత్మ’ కాదు, ఒక వ్యక్తి. ఆధునిక తెలుగులో ‘ఎవరైనా’ సహజంగా న్యాయనియమాన్ని పరిచయం చేస్తుంది; ‘ఆ వ్యక్తి’ ఏకవచన సూచనను నిలుపుతుంది.
- source_word: תֶחֱטָא
  choice: పాపం చేసి
  rationale: חטא ఇక్కడ నైతిక, న్యాయపరమైన అపరాధాన్ని సూచిస్తుంది. ‘పాపం చేసి’ ఈ రెండు పార్శ్వాలనూ నిలుపుతుంది.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: శాపపూర్వక ప్రమాణ పిలుపు విని
  rationale: קוֹל אָלָה అక్షరార్థంగా ‘ప్రమాణం/శాపం యొక్క స్వరం’; ఈ న్యాయ సందర్భంలో సాక్ష్యం చెప్పాలని ప్రమాణపూర్వకంగా పిలిచే ప్రకటనను సూచిస్తుంది. ‘శాపపూర్వక ప్రమాణ పిలుపు’ ఆ గంభీరతను, న్యాయ సందర్భాన్ని తెలియజేస్తూ మూలంలోని ప్రమాణం-శాపం భావాన్ని కాపాడుతుంది.
- source_word: וְהוּא עֵד
  choice: సాక్షిగా ఉండి
  rationale: వ్యక్తికి ఆ విషయంపై సాక్షి హోదా ఉందని సరళంగా, న్యాయపరమైన బలంతో తెలుపుతుంది.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: తాను చూసినదాని గురించైనా తెలిసినదాని గురించైనా
  rationale: ప్రత్యక్షంగా చూసిన జ్ఞానాన్నీ, ఇతర విధంగా తెలిసిన విషయాన్నీ ఈ జత కలుపుతుంది; మూలంలోని రెండు ప్రత్యామ్నాయాలను విడిగా నిలుపుతుంది.
- source_word: אִם לֹא יַגִּיד
  choice: దానిని తెలియజేయకపోతే
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం, ప్రకటించడం’ అనే విస్తృత అర్థం కలిగి ఉంది. ‘సాక్ష్యం చెప్పకపోతే’ అని న్యాయస్థాన ప్రక్రియకు మాత్రమే పరిమితం చేయకుండా ‘తెలియజేయకపోతే’ మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: తన దోషాన్ని భరించాలి
  rationale: ఈ హీబ్రూ నుడికారం తప్పిదానికి బాధ్యత వహించడాన్నీ దాని పరిణామాలకు లోబడడాన్నీ సూచిస్తుంది. ‘దోషాన్ని భరించాలి’ ఆ న్యాయ-నైతిక ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: న్యాయనియమంలో వ్యక్తి లింగ సూచన
  choice: ‘ఎవరైనా’ అనే ఏకవచన వ్యక్తి సూచనను వాడి, తరువాత ‘ఆ వ్యక్తి’ అని పేర్కొనడం
  alternative: వ్యాకరణపరంగా పుంలింగమైన ‘అతడు’ వాడడం
  rationale: హీబ్రూ נֶפֶשׁ ఒక వ్యక్తిని సూచిస్తుంది; తరువాతి రూపాలు ఏకవచనంలో ఉన్నాయి. తెలుగు వాక్యంలో ఏకవచనాన్ని నిలుపుతూ అనవసరంగా పురుషులకు మాత్రమే వర్తిస్తుందనే భావం రాకుండా సహజమైన వ్యక్తి సూచన వాడబడింది.
- issue: וְ శ్రేణిలో కారణ సంబంధం
  choice: ‘పాపం చేసి … విని’ అని సందర్భాలను వరుసగా ఉంచడం
  alternative: ‘ప్రమాణ పిలుపు విన్నందువల్ల పాపం చేస్తే’ అని స్పష్టమైన కారణ సంబంధం చూపడం
  rationale: మూలంలోని וְ రూపాలు సంఘటనలను కలుపుతాయి గాని ‘విన్నందువల్లనే’ అనే కారణ సంబంధాన్ని తప్పనిసరిగా నిర్ధారించవు. అందువల్ల మూలంలోని వాక్యనిర్మాణ ఉద్వేగాన్ని నిలిపి, కారణాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయశైలి వాడబడింది. ‘శాపపూర్వక ప్రమాణ పిలుపు’ కొంత గంభీరమైన పదబంధమైనప్పటికీ మూలంలోని אָלָה పదానికి ఉన్న ప్రమాణం-శాపం ద్వంద్వ ఛాయను నిలుపుతుంది. వాక్యం ఏకవచన న్యాయ ఉదాహరణగానే ఉంచబడింది.
