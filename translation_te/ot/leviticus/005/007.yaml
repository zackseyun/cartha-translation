  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: te
  text: అయితే ఒక గొర్రెను సమర్పించే స్థోమత అతనికి లేకపోతే, తాను చేసిన పాపానికి అపరాధ పరిహారార్పణగా రెండు గువ్వలనైనా లేదా రెండు పావురపు పిల్లలనైనా యెహోవాకు తీసుకురావాలి. వాటిలో ఒకటి పాపపరిహార బలిగా[a], మరొకటి దహనబలిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ חַטָּאת అనే పదం ‘పాపం’ను లేదా బలుల సందర్భంలో పాపం/అపవిత్రతను తొలగించడానికి సంబంధించిన బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: ఒక గొర్రెను సమర్పించే స్థోమత అతనికి లేకపోతే
  rationale: ‘అతని చెయ్యి గొర్రెకు సరిపడేంత చేరకపోతే’ అనే హీబ్రూ ఆర్థిక సామర్థ్యాన్ని సూచించే నుడికారం. దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲשָׁמוֹ
  choice: అపరాధ పరిహారార్పణగా
  rationale: אָשָׁם అపరాధాన్ని మాత్రమే కాక దానికి సంబంధించి తీసుకురావలసిన పరిహార అర్పణను కూడా సూచించగలదు. ఇక్కడ వెంటనే రెండు పక్షులు నిర్దేశించబడుతున్నందున అర్పణ భావాన్ని స్పష్టంగా ఉంచాం.
- source_word: אֲשֶׁר חָטָא
  choice: తాను చేసిన పాపానికి
  rationale: ఈ అర్పణకు కారణమైన పాపాన్ని సూచించే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁתֵּי תֹרִים
  choice: రెండు గువ్వలు
  rationale: תֹּר బలుల సందర్భంలో టర్టిల్‌డవ్ జాతి గువ్వను సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పేరు ‘గువ్వ’.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: రెండు పావురపు పిల్లలు
  rationale: అక్షరార్థంగా ‘పావురపు కుమారులు’ అనే హీబ్రూ నుడికారాన్ని జాతి, వయస్సు రెండూ స్పష్టమయ్యే సహజ తెలుగులో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నేరుగా సూచిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאת పాపంతో సంబంధమున్న బలిని సూచిస్తుంది. సంప్రదాయ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘శుద్ధీకరణ బలి’ అనే సాధ్యమైన కార్యపరమైన అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది; ‘దహనబలి’ తెలుగులో స్థిరపడిన, స్పష్టమైన పదం.
theological_decisions:
- issue: חַטָּאת అనే బలి పదం యొక్క భావం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమున్న బలిని గానీ, అపవిత్రతను తొలగించే శుద్ధీకరణ కార్యాన్ని ప్రధానంగా చూపే బలిని గానీ సూచించవచ్చు. עֹלָהతో జతగా ఉన్న ఈ బలుల సందర్భంలో సంప్రదాయ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన అర్థసంభావ్యతను పాదసూచికలో తెలిపాం.
- issue: אָשָׁםను సాంకేతిక బలి వర్గంగా అర్థం చేసుకోవాలా, చెల్లించవలసిన పరిహార అర్పణగా అర్థం చేసుకోవాలా
  choice: అపరాధ పరిహారార్పణ
  alternative: అపరాధ బలి
  rationale: ఈ వచనంలో తీసుకువచ్చే రెండు పక్షుల్లో ఒకటి חַטָּאתగా, మరొకటి עֹלָהగా పేర్కొనబడుతున్నాయి. అందువల్ల אָשָׁםను మరో ప్రత్యేక బలి వర్గంగా నిర్బంధించకుండా, అపరాధం కారణంగా చెల్లించవలసిన అర్పణ అనే విస్తృత భావంతో అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా లేవీయకాండంలోని బలుల పారిభాషిక గంభీరత నిలిచేలా పదాలు ఎంచుకున్నాం. హీబ్రూ ఆర్థిక నుడికారాన్ని అక్షరానువాదం చేయకుండా దాని భావాన్ని తెలిపాం. పాదసూచిక గుర్తు [a] సంబంధిత ‘పాపపరిహార బలి’ పదానికే జతచేయబడింది.
