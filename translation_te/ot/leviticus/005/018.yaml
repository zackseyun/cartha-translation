  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: te
  text: అతడు అపరాధ పరిహార బలిగా మందలోనుండి లోపంలేని పొట్టేలును, నీవు నిర్ణయించిన విలువ ప్రకారం, యాజకుని వద్దకు తీసుకురావాలి.[a] అతడు అనుకోకుండా చేసిన, తనకు తెలియని తప్పు విషయమై యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతనికి క్షమాపణ కలుగుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపరాధ పరిహార బలిగా’ అనే పదబంధాన్ని ‘అపరాధ బలి కోసం’ అని కూడా అనువదించవచ్చు. హీబ్రూ אָשָׁם ఒక ప్రత్యేక బలి వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అతడు అనుకోకుండా చేసిన, తనకు తెలియని తప్పు’ అనే మాటను ‘అతడు తెలియక చేసిన పొరపాటు’ అని కూడా అనువదించవచ్చు. హీబ్రూ అనుకోకుండా జరిగిన తప్పును, దాని గురించి అతనికి తెలియకపోవడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయవిధిలో ఈ క్రియ ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘తీసుకురావాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַיִל תָּמִים מִן הַצֹּאן
  choice: మందలోనుండి లోపంలేని పొట్టేలు
  rationale: אַיִל వయోజన మగ గొర్రెను సూచిస్తుంది; బలి సందర్భంలో תָּמִים శారీరక లోపం లేనిదని సూచిస్తుంది. צֹאן అనే సమూహపదానికి ‘మంద’ సహజమైన సమానార్థకం.
- source_word: בְּעֶרְכְּךָ
  choice: నీవు నిర్ణయించిన విలువ ప్రకారం
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, ఆచార సంబంధమైన విలువ నిర్ణయాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: לְאָשָׁם
  choice: అపరాధ పరిహార బలిగా
  rationale: אָשָׁם ఒక నిర్దిష్ట బలి వర్గం. ‘అపరాధ బలి’కన్నా ‘అపరాధ పరిహార బలి’ దాని పరిహార సంబంధమైన ఛాయను కూడా తెలియజేస్తుంది; అయితే మూలంలోని సంపూర్ణ భావపరిధి ఒక్క తెలుగు పదబంధంలో పూర్తిగా ఇమడదు.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజకుడు బలి ద్వారా వ్యక్తి తరఫున చేసే కర్మను తెలుగులో స్థిరమైన, అర్థవంతమైన పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג וְהוּא לֹא יָדַע
  choice: అతడు తెలియక చేసిన పొరపాటు విషయమై
  rationale: שׁגגה మరియు దాని సహజాత క్రియ అనుద్దేశపూర్వకమైన తప్పును నొక్కిచెబుతాయి. ‘తెలియక చేసిన పొరపాటు’ మూలంలోని పునరుక్తిని సహజ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమాపణ కలుగుతుంది
  rationale: నిఫల్ రూపంలోని దైవకర్తను ప్రత్యక్షంగా పేర్కొనని భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఫలితాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి
  rationale: ఇది లేవీయకాండంలోని నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది. ఎంచుకున్న రూపం అపరాధం మరియు పరిహారం అనే రెండు భావఛాయలను అందిస్తుంది; ఏ ప్రత్యేక సిద్ధాంత వివరణనూ చేర్చదు.
- issue: כפר అనే యాజక సంబంధ క్రియ
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: పరిహారం చేయడం
  rationale: బలి సందర్భంలోని గంభీరమైన ఆచార-దైవశాస్త్ర భావాన్ని నిలుపుతూ, తెలుగు బైబిలు పాఠకులకు అర్థమయ్యే సాధారణ పదప్రయోగం.
- issue: తెలియక చేసిన తప్పు మరియు క్షమాపణ మధ్య సంబంధం
  choice: మూలంలోని క్రమాన్ని మాత్రమే తెలపడం
  alternative: అది పాపమని వివరణాత్మకంగా చేర్చడం
  rationale: మూలం שׁגגה అనే అనుద్దేశపూర్వక పొరపాటును ప్రస్తావించి ప్రాయశ్చిత్తం, క్షమాపణను పేర్కొంటుంది. అనువాదం అదనపు నైతిక లేదా సిద్ధాంత వర్గీకరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయ-ఆచార శైలి. వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది. ‘ప్రాయశ్చిత్తం’ వంటి కీలక ఆచార పదాన్ని నిలిపి, దాని చుట్టూ సహజమైన ఆధునిక వాక్యప్రయోగం వాడబడింది.
