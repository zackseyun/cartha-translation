id: LEV.5.3
reference: Leviticus 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: te
  text: లేదా ఒకడు మానవ అపవిత్రతను[a]—దానివల్ల ఒకడు అపవిత్రుడయ్యే ఏ అపవిత్రతనైనా—తాకి, అది అతనికి మరుగై ఉండి[b], తరువాత అతడు దానిని తెలుసుకుంటే, అతడు దోషి అవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనిషి అపవిత్రత’ అని కూడా అనువదించవచ్చు. ఈ న్యాయ సందర్భంలో హెబ్రీ పదం ఆచారపరమైన అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అది అతనికి మరుగై ఉండి’; అంటే, ఆ సమయంలో అతనికి అది తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: తాకి
  rationale: ב తో కూడిన נגע శారీరక స్పర్శను సూచిస్తుంది; ‘తాకి’ అనేది తెలుగులో నేరుగా, సహజంగా ఉంటుంది.
- source_word: טֻמְאַת אָדָם
  choice: మనిషికి సంబంధించిన అపవిత్రతను
  rationale: లేవీయకాండపు న్యాయ సందర్భంలో טֻמְאָה ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. אָדָם ఇక్కడ లింగపరంగా పురుషునికే పరిమితం కాకుండా మానవ మూలాన్ని సాధారణంగా సూచిస్తుంది.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: ఏ అపవిత్రతనైనా
  rationale: ఈ పదబంధం మనిషికి సంబంధించిన అన్ని రకాల అపవిత్రతలను చేర్చే సాధారణ పరిధిని తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: దాని వల్ల అతడు అపవిత్రుడయ్యే
  rationale: ఈ సంబంధవాచక ఉపవాక్యం ఆ అపవిత్రత వల్ల కలిగే ఫలితాన్ని వివరిస్తుంది; కారణార్థక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: ఆ విషయం అతనికి మరుగై ఉండి
  rationale: עלם నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని నిలుపుతూ, ఆ సమయంలో అతనికి ఆ విషయం తెలియలేదనే అర్థాన్ని అందిస్తుంది.
- source_word: וְהוּא יָדַע
  choice: తరువాత అతడు దాన్ని తెలుసుకుంటే
  rationale: ముందటి అజ్ఞానం తరువాత కలిగిన అవగాహనను సందర్భం సూచిస్తుంది; ‘తరువాత’ ఆ క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: וְאָשֵׁם
  choice: అతడు అపరాధి అవుతాడు
  rationale: బలి-న్యాయ సందర్భంలో אשם అపరాధం లేదా దానికి సంబంధించిన బాధ్యతను సూచిస్తుంది; ఈ రూపం న్యాయపరమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: లేవీయ ధర్మశాస్త్రంలో טֻמְאָה స్వభావం
  choice: ‘అపవిత్రత’గా అనువదించడం
  alternative: ‘పాపస్థితి’ లేదా ‘అశుచిత్వం’
  rationale: ఈ వచనం స్పర్శ వల్ల కలిగే ఆచారపరమైన అపవిత్రత గురించి మాట్లాడుతుంది; దాన్ని స్వతహాగా నైతిక పాపంగా మార్చకుండా మూలంలోని ఆరాధనా-న్యాయ వర్గాన్ని నిలుపుతుంది.
- issue: אָדָם పదం యొక్క పరిధి
  choice: ‘మనిషికి సంబంధించిన’ అని సాధారణ మానవార్థంలో అనువదించడం
  alternative: ‘పురుషునికి సంబంధించిన’ లేదా ‘మానవ అపవిత్రత’
  rationale: ఇక్కడ אָדָם ప్రత్యేకంగా పురుష లింగాన్ని కాకుండా మానవ మూలాన్ని సూచిస్తుంది. ఎంచుకున్న రూపం అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- issue: తెలియకపోవడం మరియు తరువాత తెలుసుకోవడం మధ్య సంబంధం
  choice: మరుగై ఉండి, తరువాత తెలుసుకోవడం అనే క్రమాన్ని నిలుపడం
  alternative: ‘అతనికి తెలియకుండా జరిగి, గ్రహించినప్పుడు’
  rationale: మూలంలోని నిష్క్రియ రూపాన్నీ, తరువాత కలిగిన జ్ఞానాన్నీ నిలుపుతూ, అపరాధ బాధ్యత ఎలా వర్తిస్తుందనే ఉద్రిక్తతను అదనపు వివరణతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన న్యాయశైలిని కాపాడుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదాలను వాడాం. మూలంలోని ఏకవచన న్యాయప్రతినిధిని ‘ఒకడు/అతడు’తో నిలిపాం; ‘అపవిత్రత’ను నైతిక పాపార్థంగా విస్తరించలేదు.
