id: LEV.10.9
reference: Leviticus 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: te
  text: నీవూ, నీతో ఉన్న నీ కుమారులూ సమావేశపు గుడారంలోకి ప్రవేశించేటప్పుడు ద్రాక్షారసాన్నిగాని మత్తుపానీయాన్నిగాని తాగకూడదు; లేకపోతే మీరు చనిపోతారు. ఇది మీ తరతరాలకు శాశ్వతమైన శాసనం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: పులియబెట్టిన ద్రాక్ష పానీయాన్ని సూచించే సాధారణ హీబ్రూ పదానికి స్పష్టమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: שֵׁכָר
  choice: మత్తుపానీయం
  rationale: ద్రాక్షారసం కాకుండా ఇతర మద్యం రకాలను విస్తృతంగా సూచిస్తుంది; ‘బీరు’ అనడం అనవసరంగా అర్థాన్ని కుదిస్తుంది.
- source_word: אַל תֵּשְׁתְּ
  choice: తాగకూడదు
  rationale: אַל‌తో కూడిన క్రియారూపం నిషేధాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగు ధర్మశాసన శైలిలో ఇది సహజంగా, బలంగా ఉంటుంది.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: నీవుగాని నీతో ఉన్న నీ కుమారులుగాని
  rationale: ఆహారోను మరియు అతనితో ఉన్న కుమారులు ఇద్దరూ నిషేధంలో చేరారని స్పష్టంచేస్తూ אִתָּךְ అనే అంశాన్ని నిలుపుతుంది.
- source_word: בְּבֹאֲכֶם
  choice: ప్రవేశించేటప్పుడు
  rationale: בְּ ఉపసర్గతో ఉన్న క్రియానామం ప్రవేశించే సమయాన్ని లేదా సందర్భాన్ని సూచిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరు.
- source_word: וְלֹא תָמֻתוּ
  choice: లేకపోతే మీరు చనిపోతారు
  rationale: నిషేధాన్ని అతిక్రమిస్తే సంభవించే ప్రాణాంతక ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో హెచ్చరికగా వ్యక్తం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: నిలకడగా కొనసాగవలసిన న్యాయవిధిని సూచించే సూత్రప్రాయ పదబంధం.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: వరుస తరాలన్నిటిలోనూ వర్తించే కొనసాగింపును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మరణ హెచ్చరిక యొక్క భావబలం
  choice: ‘లేకపోతే మీరు చనిపోతారు’ అని షరతుతో కూడిన హెచ్చరికగా అనువదించడం
  alternative: ‘మీరు చనిపోకుండా ఉండేందుకు’ లేదా ‘మీరు చనిపోకూడదు’
  rationale: హీబ్రూ వాక్యక్రమం నిషేధాన్ని అతిక్రమించడానికున్న ప్రాణాంతక పరిణామాన్ని తెలియజేస్తుంది. ఈ రూపం కారణాన్ని యాంత్రికంగా నిర్వచించకుండా హెచ్చరిక బలాన్ని కాపాడుతుంది.
- issue: నిషేధం వర్తించే పరిధి
  choice: ప్రత్యక్ష గుడారంలోకి ప్రవేశించే సందర్భానికే నిషేధాన్ని అనుసంధానించడం
  alternative: యాజకులు అన్ని సమయాల్లో పూర్తిగా మద్యపానం మానాలనే ఆజ్ఞగా విస్తరించడం
  rationale: ‘ప్రవేశించేటప్పుడు’ అనే కాలసూచక పదబంధమే సందర్భాన్ని పరిమితం చేస్తుంది; మూలంలో లేని విశాలమైన సిద్ధాంతాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాసన శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగిస్తూ, నిషేధం యొక్క సందర్భపరిమితి మరియు హెచ్చరిక బలం కాపాడబడ్డాయి.
