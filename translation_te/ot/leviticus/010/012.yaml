id: LEV.10.12
reference: Leviticus 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: te
  text: 'తర్వాత మోషే అహరోనుతో, అతని మిగిలిన కుమారులైన ఎలియాజరు, ఈతామారులతో ఇలా అన్నాడు: “యాహ్వేకు అగ్ని అర్పణలలో[a] మిగిలిన ధాన్యార్పణను తీసుకుని, దాన్ని పులియని రొట్టెలుగా బలిపీఠం పక్కన తినండి. ఎందుకంటే అది అతి పరిశుద్ధమైనది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అధికారికంగా, “యాహ్వేకు అగ్ని ద్వారా అర్పించే అర్పణలలో.”
    reason: హీబ్రూ מֵאִשֵּׁי יְהוָה అనే సాంకేతిక బలి-పదబంధంలోని అగ్ని సంబంధాన్ని మరింత స్పష్టంగా చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: తర్వాత మోషే ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘తర్వాత’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַנּוֹתָרִים
  choice: మిగిలిన కుమారులు
  rationale: నాదాబు, అబీహూల మరణం తర్వాత అహరోనుకు మిగిలిన కుమారులను సూచిస్తుంది; ‘బతికి మిగిలిన’ అని అర్థాన్ని మరీ స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని బలి పరిభాషలో ఇది సాధారణ అర్పణను కాక ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యాహ్వేకు అగ్నిలో అర్పించిన అర్పణలలో
  rationale: אִשֶּׁה లోని అగ్ని సంబంధిత బలి భావాన్ని నేరుగా నిలుపుతూ, తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: దాన్ని పులియని రొట్టెలుగా ... తినండి
  rationale: מַצּוֹת అర్పణను పులియని రూపంలో తినాలని సూచిస్తుంది; తెలుగులో ‘పులియని రొట్టెలుగా’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కన
  rationale: אֵצֶל సూచించే సమీపతను ‘పక్కన’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హీబ్రూ అత్యుత్తమ స్థాయి సూచక నిర్మాణాన్ని తెలుగులో సహజమైన అతిశయ రూపంతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ ఉచ్చారణకు అనుగుణంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. బలి సంబంధిత సాంకేతిక పదాలకు ‘ధాన్యార్పణ’, ‘బలిపీఠం’, ‘అతి పరిశుద్ధమైనది’ వంటి స్థిరమైన పదాలను వాడాం. మూలంలోని అగ్ని-అర్పణ భావాన్ని వ్యాఖ్యాత్మకంగా ‘ఆహార అర్పణలు’గా మార్చకుండా నేరుగా నిలిపాం.
