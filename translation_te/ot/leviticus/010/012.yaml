  - severity: low
    issue: The rendering of מֵאִשֵּׁי יְהוָה is overly paraphrastic.
    rationale: “యాహ్వేకు అగ్నిలో అర్పించిన అర్పణలలో” introduces a passive descriptive construction. “యాహ్వేకు అగ్ని అర్పణలలో” preserves the conventional sacrificial designation more directly and naturally.
  - severity: low
    issue: The lexical-alternative footnote for the fire-offering expression is absent.
    rationale: The English POB audit trail records a meaningful formal alternative. Adding an anchored Telugu footnote preserves that translation transparency without altering the verse’s meaning.
