id: LEV.10.10
reference: Leviticus 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הַ/קֹּ֖דֶשׁ וּ/בֵ֣ין הַ/חֹ֑ל וּ/בֵ֥ין הַ/טָּמֵ֖א וּ/בֵ֥ין הַ/טָּהֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/010.yaml
  text: to distinguish between the holy and the common[a], and between the unclean and the clean[b],
translation:
  language: te
  text: పవిత్రమైనదానికీ సాధారణమైనదానికీ మధ్య[a], అశుద్ధమైనదానికీ శుద్ధమైనదానికీ మధ్య[b] తేడాను గుర్తించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రమైనదానికీ పవిత్రం కానిదానికీ మధ్య.’ హీబ్రూ పదం ఇక్కడ దేవునికోసం ప్రత్యేకంగా ఉంచబడనిదాన్ని సూచిస్తుంది; అది తప్పనిసరిగా అగౌరవకరమైనదని కాదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆచారపరంగా అశుద్ధమైనదానికీ ఆచారపరంగా శుద్ధమైనదానికీ మధ్య.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: తేడాను గుర్తించడానికి
  rationale: ఈ క్రియారూపం ముందరి వాక్యానికి కొనసాగింపుగా ఉద్దేశాన్ని తెలియజేస్తుంది. ‘తేడాను గుర్తించడం’ అనే ప్రయోగం కేవలం భౌతికంగా వేరుచేయడం కాక, యాజకులు ఈ వర్గాలను వివేచించాల్సిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּין
  choice: మధ్య
  rationale: పునరావృతమయ్యే ఈ ఉపసర్గ జతజతగా ఉన్న వర్గాల మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; తెలుగులో ‘మధ్య’ దానికి సహజమైన సమానార్థకం.
- source_word: הַקֹּדֶשׁ
  choice: పవిత్రమైనది
  rationale: ఇది ఏదైనా ఒక నిర్దిష్ట వస్తువును కాక, దేవునికోసం ప్రత్యేకంగా ఉంచబడిన వాటి వర్గాన్ని సూచిస్తుంది.
- source_word: הַחֹל
  choice: సాధారణమైనది
  rationale: ఇది పవిత్రంగా ప్రత్యేకించబడని వర్గాన్ని సూచిస్తుంది; తప్పనిసరిగా దుష్టమైనది లేదా అగౌరవకరమైనది అనే భావం లేదు. ‘సాధారణమైనది’ ఆ వ్యత్యాసాన్ని అతిశయోక్తి లేకుండా కాపాడుతుంది.
- source_word: הַטָּמֵא
  choice: అశుద్ధమైనది
  rationale: లేవీయకాండంలోని సందర్భంలో ఇది ప్రధానంగా ఆచారపరమైన అశుద్ధ స్థితిని సూచిస్తుంది; ప్రతి సందర్భంలోనూ నైతిక దోషాన్ని సూచించదు.
- source_word: הַטָּהוֹר
  choice: శుద్ధమైనది
  rationale: ఇది ‘అశుద్ధమైనది’కి జతగా ఆచారపరంగా శుద్ధమైన స్థితిని సూచించే సహజమైన తెలుగు పదం.
theological_decisions:
- issue: קֹדֶשׁ మరియు חֹל మధ్య యాజక సంబంధమైన వ్యత్యాసం
  choice: పవిత్రమైనది మరియు సాధారణమైనది
  alternative: పవిత్రమైనది మరియు అపవిత్రమైనది
  rationale: חֹל అంటే ఇక్కడ పవిత్రంగా ప్రత్యేకించబడనిది; అది తప్పనిసరిగా కలుషితమైనదో దైవదూషణకరమైనదో కాదు. అంతేకాక, దాన్ని ‘అపవిత్రమైనది’గా అనువదిస్తే తరువాతి טָמֵא అనే వేరొక వర్గంతో తేడా మసకబారుతుంది.
- issue: טָמֵא / טָהוֹר అనే వర్గాల స్వభావం
  choice: అశుద్ధమైనది / శుద్ధమైనది—ఆచారపరమైన వర్గాలుగా
  alternative: అపవిత్రమైనది / పవిత్రమైనది
  rationale: లేవీయకాండంలోని యాజక సందర్భం ఆచారపరమైన స్థితిని ప్రధానంగా సూచిస్తుంది. ఈ అనువాదం అశుద్ధతను ప్రతిసారీ నైతిక అపరాధంతో సమానం చేయకుండా మూలపాఠంలోని వర్గభేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ఉద్దేశార్థక క్రియారూపాన్ని నిలుపుతూ ఈ వచనం ముందరి వచనంతో వ్యాకరణపరంగా కొనసాగుతుందనే స్వభావాన్ని కాపాడాం. ‘పవిత్రమైనది/సాధారణమైనది’ మరియు ‘అశుద్ధమైనది/శుద్ధమైనది’ అనే రెండు వేర్వేరు జతలను స్పష్టంగా ఉంచాం.
