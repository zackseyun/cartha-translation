id: LEV.10.14
reference: Leviticus 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: te
  text: ఊపే అర్పణ రొమ్ముభాగాన్ని[a], ఎత్తే అర్పణ తొడభాగాన్ని[b] శుద్ధమైన స్థలంలో నీవు, నీ కుమారులూ నీ కుమార్తెలూ నీతోపాటు తినాలి. ఎందుకంటే అవి ఇశ్రాయేలు కుమారుల సమాధాన బలుల నుండి నీకూ నీ కుమారులకూ నియమించబడిన వాటాలుగా ఇవ్వబడ్డాయి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఊపి సమర్పించిన రొమ్ముభాగం.” హీబ్రూ పదం ఆచారపూర్వకంగా ఊపి సమర్పించే బలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎత్తి సమర్పించిన తొడభాగం.” ఈ హీబ్రూ పదం ఎత్తి సమర్పించిన లేదా యాజకులకు వాటాగా ప్రత్యేకపరచిన దానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “సమాధాన బలులు” అనే పదాన్ని “సహవాస బలులు” అని కూడా అనువదించవచ్చు; హీబ్రూ పదంలో సమాధానం, సంపూర్ణత, క్షేమం అనే విస్తృత భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ఊపే అర్పణగా సమర్పించిన రొమ్ముభాగం
  rationale: חֲזֶה బలి జంతువు రొమ్ము భాగాన్ని సూచిస్తుంది; תְּנוּפָה యెహోవా సన్నిధిలో ఆచారపూర్వకంగా ఊపి సమర్పించడాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి ఆ క్రియ స్పష్టమయ్యేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ప్రతిష్ఠిత అర్పణగా సమర్పించిన తొడభాగం
  rationale: שׁוֹק కాలు/తొడ భాగం; תְּרוּמָה ఎత్తి సమర్పించిన లేదా ప్రత్యేకంగా కేటాయించిన యాజక భాగం. సహజమైన తెలుగులో దాని ప్రతిష్ఠిత స్వభావాన్ని తెలియజేసే రూపం వాడబడింది.
- source_word: תֹּאכְלוּ
  choice: తినాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియ ధర్మశాస్త్ర సంబంధమైన ఆదేశాన్ని వ్యక్తం చేస్తుంది; ‘తినాలి’ ఆ నిర్దేశక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמָקוֹם טָהוֹר
  choice: పవిత్రమైన స్థలంలో
  rationale: లేవీయకాండ సందర్భంలో טָהוֹר ఆచారపరంగా అపవిత్రం కాని స్థలాన్ని సూచిస్తుంది. ‘పవిత్రమైన’ అనే పదం ఆధునిక తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది; కేవలం నైతిక పవిత్రతగా చదవకుండా వ్యాఖ్యాన గమనిక అవసరం లేదు, ఎందుకంటే సందర్భం ఆచారపరమైన అర్థాన్ని ఇస్తుంది.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: నువ్వూ, నీతోపాటు నీ కుమారులూ నీ కుమార్తెలూ
  rationale: మూలంలో కుమారులు, కుమార్తెలు ఇద్దరూ స్పష్టంగా పేర్కొనబడ్డారు; ‘నీతోపాటు’ అనే భావమూ నిలుపబడింది.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: నీకూ నీ కుమారులకూ నియమించబడిన వాటాలు
  rationale: חֹק ఇక్కడ శాసనం కంటే నియమిత యాజక వాటాను సూచిస్తుంది. ‘నియమించబడిన వాటాలు’ ఆ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִתְּנוּ
  choice: ఇవ్వబడ్డాయి
  rationale: నిష్క్రియ సంపూర్ణ క్రియ స్థిరంగా అనుగ్రహించబడిన వాటాను సూచిస్తుంది; నిష్క్రియ రూపాన్ని తెలుగులో నిలుపుతుంది.
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: సమాధాన బలుల నుండి
  rationale: שְׁלָמִים లో సమాధానం, సంపూర్ణత, క్షేమం వంటి విస్తృత భావక్షేత్రం ఉంది. సంప్రదాయబద్ధమైన ‘సమాధాన బలులు’ ఆ విస్తృతిని ‘సహవాస బలులు’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ప్రామాణిక పుత్రసంబంధ సమూహపదాన్ని యథాశక్తి నిలుపుతూ, అది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే హీబ్రూ ప్రయోగమని అర్థం చేసుకోవాలి.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పేరును ఎలా అనువదించాలి
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: ‘సహవాస’ అనేది సాధ్యమైన ఫలితం లేదా కోణాన్ని ముందుకు తెస్తుంది; హీబ్రూ పదంలోని సమాధానం, సంపూర్ణత, క్షేమం అనే విస్తృతిని కుదించకుండా ‘సమాధాన బలులు’ ఎంచుకోబడింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతి-నిబంధన సంబంధ పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది పురుషులకు మాత్రమే పరిమితం కాకుండా ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే స్థిర హీబ్రూ ప్రయోగం.
- issue: טָהוֹר యొక్క పవిత్రత స్వభావం
  choice: పవిత్రమైన స్థలం
  alternative: ఆచారపరంగా శుద్ధమైన స్థలం
  rationale: మూలం ఒక్క విశేషణమే ఉపయోగిస్తుంది. ప్రధాన పాఠ్యంలో వివరణాత్మక పదాన్ని చేర్చి అర్థాన్ని అతిగా నిర్ణయించకుండా, లేవీయకాండ సందర్భం ఆచారపరమైన శుద్ధిని తెలియజేయనివ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. ‘తినాలి’ ఆదేశ బలాన్ని సహజంగా తెలియజేస్తుంది. బలి సంబంధ సాంకేతిక పదాలకు పాఠ్యంలో అర్థవంతమైన రూపాలు, ప్రత్యామ్నాయాలకు సంక్షిప్త పాదటిప్పణులు ఇచ్చబడ్డాయి. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
