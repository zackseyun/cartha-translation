revisions:
- from: ఊపే అర్పణగా సమర్పించిన రొమ్ముభాగాన్ని[a], ప్రతిష్ఠిత అర్పణగా సమర్పించిన తొడభాగాన్ని[b] పవిత్రమైన స్థలంలో నువ్వూ, నీతోపాటు నీ కుమారులూ నీ కుమార్తెలూ తినాలి. ఎందుకంటే ఇశ్రాయేలు కుమారుల సమాధాన బలుల[c] నుండి అవి నీకూ నీ కుమారులకూ నియమించబడిన వాటాలుగా ఇవ్వబడ్డాయి.
  to: ఊపే అర్పణ రొమ్ముభాగాన్ని[a], ఎత్తే అర్పణ తొడభాగాన్ని[b] శుద్ధమైన స్థలంలో నీవు, నీ కుమారులూ నీ కుమార్తెలూ నీతోపాటు తినాలి. ఎందుకంటే అవి ఇశ్రాయేలు కుమారుల సమాధాన బలుల నుండి నీకూ నీ కుమారులకూ నియమించబడిన వాటాలుగా ఇవ్వబడ్డాయి.[c]
  rationale: '''పవిత్రమైన'' స్థానంలో ''శుద్ధమైన'' ఉంచి טָהוֹר యొక్క ఆచారపరమైన శుద్ధి భావాన్ని కాపాడాం. బలి భాగాల పేర్లలోని పునరుక్తిని తొలగించి, ఊపడం మరియు ఎత్తడం అనే రెండు విభిన్న ఆచారపదాలను స్పష్టంగా నిలిపాం. సమాధాన బలులపై ఉన్న పాదటిప్పణి గుర్తును సంబంధిత పదబంధం చివరికి మార్చాం; అన్ని పాదటిప్పణి గుర్తులు ఇప్పుడు వాటి సంబంధిత పాఠ్య అంశాలకు జతచేయబడ్డాయి.'
