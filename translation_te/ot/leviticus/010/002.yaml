  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: te
  text: యాహ్వే సన్నిధి నుండి అగ్ని వెలువడి వారిని దహించివేసింది[a]; వారు యాహ్వే సన్నిధిలో చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: “యాహ్వే ఎదుటి నుండి”; మరో విధంగా, “యాహ్వే సన్నిధి నుండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: బయలుదేరి వచ్చింది
  rationale: יצא అనే క్రియలోని బయటికి వచ్చే దిశాభావాన్ని, వరుసగా సాగుతున్న కథనంలోని సాధారణ భూతకాల సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵשׁ
  choice: అగ్ని
  rationale: ఇక్కడ ఈ నామవాచకం తీర్పును అమలు చేసిన నిజమైన అగ్నిని నేరుగా సూచిస్తుంది; గంభీరమైన వచన శైలికి ‘అగ్ని’ సరిపోతుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘యాహ్వే ముఖము/సన్నిధి ఎదుటి నుండి.’ ఆధునిక తెలుగులో సహజంగా ఉండడంతోపాటు దైవసన్నిధి నుండి అగ్ని వచ్చిన భావాన్ని కాపాడుతుంది.
- source_word: וַתֹּאכַל
  choice: దహించివేసింది
  rationale: אכל ప్రాథమికంగా ‘తిను’ అని అర్థమైనా, అగ్ని కర్తగా ఉన్నప్పుడు అది పూర్తిగా కాల్చి నాశనం చేయడాన్ని సూచిస్తుంది; ‘దహించివేసింది’ తెలుగు వాడుకలో సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: సమీప సందర్భంలోని నాదాబు, అబీహులను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: וַיָּמֻתוּ
  choice: వారు ... చనిపోయారు
  rationale: מות క్రియలో ఉన్న క్రియాశీల అకర్మక రూపాన్ని నిలుపుతుంది. ముందు వాక్యభాగమే కారణాన్ని తెలిపినందున ‘చంపబడ్డారు’ అనే కారణార్థక విస్తరణను చేర్చదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: వారు యాహ్వే సమక్షంలోనే చనిపోయారనే స్థల-దైవసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ మూలంలోని గంభీరమైన పునరుక్తిని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: וַיָּמֻתוּ ను సాధారణ ఫలితంగా చూపాలా, కర్మణి కారణార్థకంగా చూపాలా
  choice: చనిపోయారు
  alternative: చంపబడ్డారు
  rationale: హీబ్రూ క్రియ క్రియాశీల అకర్మక రూపంలో ‘వారు చనిపోయారు’ అని చెబుతుంది. అగ్ని కారణమని ముందు భాగంలో స్పష్టమే కాబట్టి కర్మణి రూపాన్ని చేర్చకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన వాక్యనిర్మాణం. ‘సన్నిధి’ అనే పదం రెండు హీబ్రూ పదబంధాల స్థల-దైవసంబంధ భావాన్ని నిలుపుతుంది; మొదటి చోట ‘నుండి,’ రెండవ చోట ‘లో’ వాడి వాటి వ్యాకరణ పాత్రలను స్పష్టం చేసింది.
