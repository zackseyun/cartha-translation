id: LEV.10.18
reference: Leviticus 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: te
  text: ఇదిగో, దాని రక్తం పరిశుద్ధస్థలం లోపలికి తీసుకురాబడలేదు.[a] నేను ఆజ్ఞాపించిన ప్రకారం మీరు దాన్ని పరిశుద్ధస్థలంలో తప్పక తిని ఉండాల్సింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్ర ప్రదేశం లోపలికి.” హీబ్రూలో పవిత్ర ప్రాంతాన్ని సూచించే పదంతో పాటు “లోపలికి” అనే దిశార్థక పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో ఒకే ‘తినడం’ క్రియను రెండు రూపాల్లో కలిపి వాడటం ఆజ్ఞను ఉద్ఘాటిస్తుంది; భావం: “మీరు దాన్ని నిశ్చయంగా తిని ఉండాల్సింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: వక్త చెప్పబోయే ముఖ్య విషయంపై బలంగా దృష్టి నిలిపే హీబ్రూ అవ్యయానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: הוּבָא
  choice: తీసుకురాబడలేదు
  rationale: בוא ధాతువు హోఫల్ రూపంలోని కర్మణి భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: דָּמָהּ
  choice: దాని రక్తం
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం పాపపరిహారబలి జంతువును సూచిస్తుంది; తెలుగులో జంతువు లేదా బలిని సూచించడానికి ‘దాని’ సహజం.
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: పరిశుద్ధస్థలం లోపలికి
  rationale: אֶל మరియు దిశార్థకమైన פְּנִימָה కలిసి పవిత్ర ప్రదేశపు అంతర్భాగంలోకి కదలికను సూచిస్తాయి; మూలంలోని స్థలసంబంధ బలాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: తప్పక తిని ఉండాల్సింది
  rationale: క్రియార్థక నామరూపం–అసంపూర్ణ క్రియా నిర్మాణంలోని ఉద్ఘాటనను ‘తప్పక’తో, గతంలో నెరవేర్చని బాధ్యతను ‘తిని ఉండాల్సింది’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹתָהּ
  choice: దాన్ని
  rationale: స్త్రీలింగ ఏకవచన కర్మప్రత్యయం సందర్భంలోని పాపపరిహారబలిని సూచిస్తుంది.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధస్థలంలో
  rationale: యాజకులు బలిని తినవలసిన పవిత్ర ప్రదేశాన్ని సూచించే ఆరాధనా పదజాలాన్ని నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: నేను ఆజ్ఞాపించిన ప్రకారం
  rationale: మోషే ఇంతకుముందు ఇచ్చిన ఆజ్ఞను సూచించే పోలిక వాక్యాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఆరాధనా స్థలానికి సంబంధించిన పదజాలం
  choice: మొదటి పదబంధాన్ని ‘పరిశుద్ధస్థలం లోపలికి’ అని, బలి తినే ప్రదేశాన్ని ‘పరిశుద్ధస్థలంలో’ అని అనువదించడం.
  alternative: మొదటిదాన్ని ‘అంతరాలయంలోకి’ లేదా ‘తెర లోపలికి’ అని మరింత నిర్దిష్టంగా అనువదించడం.
  rationale: మొదటి హీబ్రూ పదబంధంలో లోపలికి వెళ్లే దిశ స్పష్టంగా ఉంది; అయితే ‘తెర లోపలికి’ అని మూలంలో లేని వివరాన్ని చేర్చకూడదు. రెండవ పదబంధం తినవలసిన పవిత్ర ప్రదేశాన్ని మాత్రమే సూచిస్తుంది.
- issue: ఉద్ఘాటిత క్రియ యొక్క కాలం మరియు విధి
  choice: ‘తప్పక తిని ఉండాల్సింది’ అని గతంలో నెరవేర్చని బాధ్యతగా అనువదించడం.
  alternative: ‘తప్పక తినాలి’ లేదా ‘నిశ్చయంగా తినండి’ అని సాధారణ ఆజ్ఞగా అనువదించడం.
  rationale: మూల క్రియా నిర్మాణం స్వతహాగా ఉద్ఘాటన ఇస్తుంది; సందర్భంలో మోషే ఇప్పటికే జరిగిన వైఫల్యాన్ని గద్దిస్తున్నందున తెలుగులో గత బాధ్యతను వ్యక్తం చేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిశుద్ధస్థలం’ అనే ఆరాధనా పదాన్ని రెండు చోట్ల నిలిపి, మొదటి చోట ‘లోపలికి’ ద్వారా మూలంలోని దిశార్థక భేదాన్ని కాపాడాం. ప్రతి పాదటిప్పణి సూచికను ప్రధాన పాఠ్యంలో ఉంచాం.
