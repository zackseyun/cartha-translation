id: LEV.10.15
reference: Leviticus 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: te
  text: కొవ్వు భాగాల అగ్న్యర్పణలతో పాటు, ప్రత్యేక సమర్పణపు తొడభాగాన్నీ[a], ఊపే అర్పణపు రొమ్ముభాగాన్నీ[b] తీసుకువచ్చి, యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. యహ్వే ఆజ్ఞాపించిన ప్రకారం, అది నీకూ నీతో ఉన్న నీ కుమారులకూ శాశ్వతమైన శాసనంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొడభాగం’ను ‘కాలి భాగం’ అని కూడా అనువదించవచ్చు. ‘ప్రత్యేక సమర్పణం’ అంటే యహ్వేకు వేరుచేసి సమర్పించిన భాగం; సంప్రదాయంగా దీనిని ‘పైకెత్తే అర్పణం’ అని కూడా అంటారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఊపే అర్పణం’ యహ్వే సన్నిధిలో ఆచారరీతిగా చూపించి సమర్పించే అర్పణాన్ని సూచిస్తుంది; దీనిని మరింత సాధారణంగా ‘ప్రదర్శన అర్పణం’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ప్రతిష్ఠార్పణమైన తొడభాగం
  rationale: שׁוֹק బలి జంతువు వెనుక కాలి పైభాగాన్ని సూచిస్తుంది; ‘తొడభాగం’ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది. תְּרוּמָה ప్రత్యేకంగా వేరుచేసి సమర్పించిన యాజక భాగం కాబట్టి ‘ప్రతిష్ఠార్పణం’ అని ఇచ్చాం.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ఊపే అర్పణమైన ఛాతీభాగం
  rationale: חָזֶהకు బలి జంతువు ‘ఛాతీభాగం’ సహజమైన శరీరనిర్దేశం. תְּנוּפָהను దాని సంబంధిత క్రియతో ఉన్న పదసంబంధం నిలిచేలా ‘ఊపే అర్పణం’గా అనువదించాం.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: కొవ్వు భాగాల అగ్న్యర్పణలతో పాటు
  rationale: עַל ఇక్కడ తోడుగా తీసుకురావడాన్ని సూచిస్తుంది. אִשִּׁים అగ్నిపై సమర్పించే బలి భాగాలను, הַחֲלָבִים ప్రత్యేక కొవ్వు ముక్కలను సూచిస్తాయి.
- source_word: לְהָנִיף תְּנוּפָה
  choice: ఊపే అర్పణగా ఊపాలి
  rationale: ఒకే మూలానికి చెందిన క్రియ-నామ జంటను ఉద్దేశపూర్వక పునరుక్తితో నిలిపి, ఆచార చర్యను స్పష్టంచేశాం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵיకు ఆరాధనా సందర్భంలో సహజమైన ‘సన్నిధిలో’ వాడాం; יהוה అనే దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לְחָק עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֹק నిర్దేశించబడిన కట్టడను, עוֹלָם దాని నిరంతర వర్తనను తెలియజేస్తాయి; గంభీరమైనప్పటికీ ఆధునికంగా అర్థమయ్యే రూపం ఎంచుకున్నాం.
theological_decisions:
- issue: יהוה దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా లిప్యంతరీకరించాం.
- issue: תְּנוּפָה ఆచారపదం
  choice: ఊపే అర్పణం
  alternative: సమర్పణ అర్పణం / నైవేద్యం
  rationale: ఇది యహ్వే సన్నిధిలో జరిగే ప్రత్యేక ఆచార సమర్పణ; మూలంలోని ఊపడం అనే చర్యను తొలగించకుండా ఉంచాం.
- issue: లְחָק עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన శాసనం
  alternative: నిరంతర నియమం
  rationale: మూలంలోని దీర్ఘకాలిక, స్థిరమైన బద్ధతను నిలిపాం; అది ఎలా అమలవుతుందనే తరువాతి ధార్మిక ప్రశ్నను అనువాదంలో ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకుడికి అర్థమయ్యే గంభీర శైలిని వాడాం. బలుల సంబంధిత సాంకేతిక పదాలకు సంక్షిప్త వివరణలను పాదటిప్పణుల్లో ఇచ్చాం. హెబ్రీ క్రియ-నామ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
