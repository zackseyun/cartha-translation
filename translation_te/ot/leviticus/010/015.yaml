revisions:
- from: ప్రతిష్ఠార్పణమైన తొడభాగాన్ని[a], ఊపే అర్పణమైన ఛాతీభాగాన్ని[b], కొవ్వు భాగాల అగ్న్యర్పణలతో పాటు తీసుకురావాలి. వాటిని యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. యహ్వే ఆజ్ఞాపించిన ప్రకారం, ఇది నీకూ నీతో ఉన్న నీ కుమారులకూ శాశ్వతమైన శాసనంగా ఉంటుంది.
  to: కొవ్వు భాగాల అగ్న్యర్పణలతో పాటు, ప్రత్యేక సమర్పణపు తొడభాగాన్నీ[a], ఊపే అర్పణపు రొమ్ముభాగాన్నీ[b] తీసుకువచ్చి, యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. యహ్వే ఆజ్ఞాపించిన ప్రకారం, అది నీకూ నీతో ఉన్న నీ కుమారులకూ శాశ్వతమైన శాసనంగా ఉంటుంది.
  rationale: The revision improves the rendering of תְּרוּמָה, makes the sacrificial-portion syntax natural in modern standard Telugu, and retains the Hebrew’s cognate ritual expression ‘to wave a wave offering.’ The association with the fire offerings of the fat portions is preserved without over-specifying the debated force of עַל.
