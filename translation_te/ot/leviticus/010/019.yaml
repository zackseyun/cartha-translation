id: LEV.10.19
reference: Leviticus 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: te
  text: 'అప్పుడు అహరోను మోషేతో ఇలా అన్నాడు: “చూడు, ఈ రోజు వారు తమ పాపపరిహార బలిని[a], తమ దహనబలిని యహ్వే సన్నిధిలో అర్పించారు. ఇలాంటివి నాకు సంభవించాయి[b]. ఈ రోజు నేను పాపపరిహార బలిని తిని ఉంటే, అది యహ్వే దృష్టిలో మంచిదై ఉండేదా?[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలి.’ ఈ వచనంలో రెండుసార్లు వచ్చే חַטָּאת అనే హెబ్రీ పదం పాపం లేదా అపవిత్రతనుంచి శుద్ధీకరణకు సంబంధించిన బలిని సూచించగలదు; లేవీయకాండంలో ‘పాపపరిహార బలి’ సంప్రదాయ అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఇటువంటివి నాకు సంభవించాయి.’ అహరోను ఆ రోజు జరిగిన విపత్తులను, ముఖ్యంగా తన కుమారుల మరణాన్ని, సూచిస్తున్నాడు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘అది యహ్వేకు ఇష్టమై ఉండేదా?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చూడు
  rationale: అహరోను తన వివరణవైపు మోషే దృష్టిని మళ్లించే అవధాన సూచకం. ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: הִקְרִיבוּ
  choice: అర్పించారు
  rationale: హిఫీల్ రూపంలో బలిని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించే ఆచార సంబంధమైన అర్థం ఉంది.
- source_word: חַטָּאתָם / חַטָּאת
  choice: తమ పాపపరిహార బలి / పాపపరిహార బలి
  rationale: లేవీయకాండంలోని బలి సందర్భంలో ఈ పదం అమూర్తమైన ‘పాపం’ను కాక, పాపం లేదా అపవిత్రతకు పరిహారంగా అర్పించే బలిని సూచిస్తుంది. ‘శుద్ధీకరణ బలి’ కూడా సాధ్యమైన అనువాదం.
- source_word: עֹלָתָם
  choice: తమ దహనబలి
  rationale: బలి పూర్తిగా దహించబడే ఆచారాన్ని సూచించే ప్రామాణిక, స్పష్టమైన తెలుగు పదం.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: బలిని యహ్వే సమక్షంలో అర్పించడాన్ని తెలిపే ఆచార సంబంధమైన పదబంధం.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: ఇలాంటివి నాకు సంభవించాయి
  rationale: ఆ రోజు అహరోనుకు ఎదురైన విపత్తులను, ముఖ్యంగా అతని కుమారుల మరణాన్ని, సూచించే సహజమైన తెలుగు వ్యక్తీకరణ; మూలం వాటి స్వరూపాన్ని పూర్తిగా నిర్దిష్టం చేయదు.
- source_word: וְאָכַלְתִּי
  choice: నేను ... తిని ఉంటే
  rationale: రూపపరంగా waw + qatal అయినా, తరువాతి అలంకారప్రశ్నతో కలిసి సందర్భంలో జరగని పరిస్థితిని ఊహించే షరతు భావాన్ని ఇస్తుంది.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: అది యహ్వే దృష్టిలో మంచిదై ఉండేదా?
  rationale: దైవ ఆమోదాన్ని ప్రశ్నించే హెబ్రీయ నుడికారాన్ని అర్థవంతమైన తెలుగులో నిలుపుతుంది; ‘యహ్వేకు ఇష్టమై ఉండేదా?’ అనేది మరింత భావానువాద ప్రత్యామ్నాయం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: బలిని తినకపోవడానికి అహరోను ఇచ్చిన సమర్థన స్వభావం
  choice: ఆ రోజు తనకు సంభవించిన విపత్తుల దృష్ట్యా పాపపరిహార బలిని తినడం యహ్వే దృష్టిలో ఆమోదయోగ్యమై ఉండేదా అని అహరోను ప్రశ్నిస్తున్నాడు.
  alternative: అహరోను కేవలం తన వ్యక్తిగత దుఃఖాన్ని వ్యక్తం చేస్తున్నాడని, లేదా తన ప్రస్తుత స్థితిలో ఆ బలిని తినడం ఆచారపరంగా సముచితమా అని ప్రత్యేకంగా ప్రశ్నిస్తున్నాడని అర్థం చేసుకోవచ్చు.
  rationale: మూల హెబ్రీ ఆ రోజు జరిగిన విషాదాన్ని అలంకారప్రశ్నతో అనుసంధానిస్తుంది; అయితే సమస్య దుఃఖమా, ఆచారపరమైన స్థితియా, లేక విస్తృతమైన సముచితతా అనే విషయాన్ని నిర్దిష్టం చేయదు. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చూడు’ సంభాషణలోని అవధాన సూచక బలాన్ని నిలుపుతుంది. బలి సంబంధమైన పదాలకు సాధారణంగా అర్థమయ్యే స్థిర పదజాలాన్ని వాడాం; దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
