    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: וַיְדַבֵּר కథనాన్ని ముందుకు నడిపిస్తూ దైవవాక్య పరిచయ సూత్రంలో ‘మాట్లాడాడు’ అనే భావాన్ని ఇస్తుంది. తరువాత לֵאמֹר ఉన్నందున ‘చెప్పాడు’ కంటే ‘మాట్లాడాడు’ మూలంలోని పునరుక్త నిర్మాణాన్ని సహజమైన తెలుగులో మెరుగ్గా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో సూచించాం.
- source_word: אֶל
  choice: అహరోనుతో
  rationale: మాట్లాడే క్రియతో వచ్చిన אֶל సంభాషణ ఎవరిని ఉద్దేశించిందో తెలియజేస్తుంది. తెలుగులో ‘అహరోనుతో మాట్లాడాడు’ సహజమైన ప్రయోగం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘అహరోను’గా లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: లֵאמֹר తరువాత వచ్చే మాటలను పరిచయం చేస్తుంది. ‘ఇలా మాట్లాడాడు:’ అనే తెలుగు నిర్మాణం మూలంలోని ఉక్తి-పరిచయ కార్యాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘అంటూ’ అనే మరింత రూపానుసారమైన అనువాదం కూడా సాధ్యమే.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఈ వచనం יהוה అనే వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి, పండితలోకంలో సాధారణమైన ‘యాహ్వే’ ఉచ్చారణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దైవవాక్య పరిచయ శైలి. తరువాత వచ్చే ప్రత్యక్ష వాక్యానికి అనుగుణంగా చివర ద్విబిందువు వాడబడింది.
