id: LEV.10.1
reference: Leviticus 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: te
  text: అప్పుడు అహరోను కుమారులైన నాదాబు, అబీహు ఒక్కొక్కరు తమ అగ్నిపాత్రను తీసుకొని, దానిలో అగ్ని వేసి, దానిపై ధూపద్రవ్యం ఉంచారు. వారు యాహ్వే సన్నిధిలో, ఆయన తమకు ఆజ్ఞాపించని అనధికార అగ్నిని[a] అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వింత అగ్ని,’ ‘పరాయి అగ్ని.’ హీబ్రూ పదబంధం పవిత్ర సేవకు అనధికారమైన అగ్నిని సూచిస్తుంది; తరువాతి ఉపవాక్యం యాహ్వే దానిని వారికి ఆజ్ఞాపించలేదని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియను సహజమైన తెలుగు క్రమంలో ‘తీసుకొని’ అని అనువదించాం.
- source_word: בְנֵי אַהֲרֹן
  choice: అహరోను కుమారులైన
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో కుటుంబ సంబంధం స్పష్టంగా ఉండేలా ఇచ్చాం.
- source_word: נָדָב וַאֲבִיהוּא
  choice: నాదాబు, అబీహు
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: ఒక్కొక్కరు తమ నిప్పుల పాత్రను
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు’ అని సూచిస్తుంది; מַחְתָּה నిప్పులు లేదా బొగ్గులు ఉంచే పాత్రను సూచిస్తుంది. ‘ధూపపాత్ర’ కంటే ‘నిప్పుల పాత్ర’ మూలపదపు సాధనార్థాన్ని నేరుగా చూపుతుంది.
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: దానిలో నిప్పు వేసి
  rationale: ఒక్కొక్కరి పాత్రను ఉద్దేశించే విభజనాత్మక ఏకవచనాన్ని తెలుగులో సహజంగా కొనసాగించాం.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: దానిపై ధూపద్రవ్యం ఉంచారు
  rationale: ఏకవచన స్త్రీలింగ ప్రత్యయాన్ని పాత్రకు అన్వయించి, קְטֹרֶת ను సాధారణ పాఠకునికి స్పష్టంగా ‘ధూపద్రవ్యం’గా ఇచ్చాం.
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో అర్పించారు
  rationale: קרב హిఫీల్ రూపానికి యాజకసంబంధ సందర్భంలో ‘అర్పించారు’ సరిపోతుంది; לִפְנֵי భావాన్ని సహజమైన ‘సన్నిధిలో’గా వ్యక్తం చేశాం.
- source_word: אֵשׁ זָרָה
  choice: అనుమతిలేని అగ్ని
  rationale: זָרָה ఇక్కడ కేవలం విచిత్రమైనది అని కాక, పవిత్ర సేవలో అధికారం లేదా అనుమతి లేనిదని తరువాతి ఉపవాక్యం వివరిస్తుంది. ప్రత్యామ్నాయ పదార్థాలను పాదటిప్పణిలో నిలిపాం.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: తమకు ఆజ్ఞాపించని
  rationale: హీబ్రూలోని బహువచన కర్మప్రత్యయాన్ని ‘తమకు’ ద్వారా నిలిపి, ఆ అగ్ని దైవాజ్ఞకు విరుద్ధమని మాత్రమే తెలిపాం; అపరాధ స్వరూపంపై అదనపు ఊహను చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ శాస్త్రీయ లిప్యంతరీకరణను ఉపయోగించాం.
- issue: אֵשׁ זָרָה యొక్క అర్థం
  choice: అనుమతిలేని అగ్ని
  alternative: వింత అగ్ని; పరాయి అగ్ని
  rationale: తరువాతి ‘తమకు ఆజ్ఞాపించని’ అనే ఉపవాక్యం దాని యాజక-న్యాయ సంబంధమైన అనధికార స్వభావాన్ని వివరిస్తుంది. అయితే మూలపదంలోని ‘వింత/పరాయి’ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా రెండు తెలుగు వాక్యాలుగా విభజించాం. ‘ఒక్కొక్కరు తమ... దానిలో... దానిపై’ అనే నిర్మాణంతో హీబ్రూ విభజనాత్మక ఏకవచనాన్ని సహజంగా నిలిపాం.
