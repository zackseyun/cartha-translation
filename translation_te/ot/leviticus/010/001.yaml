  source_fidelity: 'ప్రధాన భావం మూలానికి నమ్మకంగా ఉంది: నాదాబు, అబీహు తమ తమ అగ్నిపాత్రలను తీసుకొని, వాటిలో అగ్ని వేసి ధూపద్రవ్యం ఉంచి, యాహ్వే ఆజ్ఞాపించని అగ్నిని ఆయన సన్నిధిలో అర్పించారు. అయితే ప్రస్తుత పదక్రమంలో ‘యాహ్వే తమకు ఆజ్ఞాపించని’ అనేది వెంటనే ‘యాహ్వే’తో కలిసిపోయి అర్థస్పష్టతను తగ్గిస్తుంది.'
