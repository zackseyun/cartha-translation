id: LEV.10.3
reference: Leviticus 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: te
  text: 'అప్పుడు మోషే అహరోనుతో ఇలా అన్నాడు: “యెహోవా చెప్పింది ఇదే: ‘నా దగ్గరకు వచ్చేవారిలో నేను పరిశుద్ధుడిగా కనబడతాను[a]; ప్రజలందరి ఎదుట నేను మహిమపరచబడతాను[b].’” అహరోను మౌనంగా ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దగ్గరకు వచ్చేవారి ద్వారా నేను పరిశుద్ధుడిగా గౌరవింపబడతాను.” దేవుని పరిశుద్ధత ప్రత్యక్షమవడం లేదా ఆయనను సమీపించేవారు పరిశుద్ధుడిగా గౌరవించడం—ఈ రెండు భావాలనూ హెబ్రీ వ్యక్తీకరణ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నేను ఘనపరచబడతాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా చెప్పింది ఇదే
  rationale: హెబ్రీ గుర్తింపువాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: בִּקְרֹבַי
  choice: నా దగ్గరకు వచ్చేవారిలో
  rationale: ‘నా సమీపస్థులలో’ అనే అక్షరార్థంతో పాటు, ఆరాధన లేదా సేవలో దేవుని సమీపించే యాజక సంబంధ భావాన్ని తెలియజేస్తుంది; అయితే ‘యాజకులు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֶקָּדֵשׁ
  choice: నేను పరిశుద్ధుడిగా కనబడతాను
  rationale: నిఫాల్ రూపంలోని దేవుని పరిశుద్ధత ప్రత్యక్షమవడం లేదా గుర్తింపబడడం అనే భావాన్ని సహజ తెలుగులో ఉంచుతుంది. దేవుడు పరిశుద్ధుడిగా గౌరవింపబడతాడనే మరో సాధ్య భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: ప్రజలందరి ఎదుట
  rationale: బహిరంగతను తెలిపే హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: אֶכָּבֵד
  choice: నేను మహిమపరచబడతాను
  rationale: כבד నిఫాల్ రూపంలోని బహిరంగ మహిమ లేదా ఘనత పొందే భావాన్ని, దేవునికి సంబంధించిన వేదాంతపరమైన బరువుతో నిలుపుతుంది.
- source_word: וַיִּדֹּם
  choice: మౌనంగా ఉన్నాడు
  rationale: అహరోను స్పందనలోని నిశ్శబ్దం, నిశ్చలత, గంభీరతను సంక్షిప్తంగా మరియు సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని సమీపించేవారికి సంబంధించి ఆయన పరిశుద్ధత ప్రకటన
  choice: నా దగ్గరకు వచ్చేవారిలో నేను పరిశుద్ధుడిగా కనబడతాను
  alternative: నా దగ్గరకు వచ్చేవారి ద్వారా నేను పరిశుద్ధుడిగా గౌరవింపబడతాను
  rationale: హెబ్రీ వాక్యం దేవుని పరిశుద్ధత ప్రత్యక్షమవడం, గుర్తింపబడడం, లేదా సమీపించేవారు ఆయనను పరిశుద్ధుడిగా గౌరవించడం అనే పరస్పర సంబంధిత భావాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠం దైవ పరిశుద్ధత వ్యక్తమవడాన్ని ఉంచగా, పాదటిప్పణి మానవ స్పందన భావాన్ని నిలుపుతుంది.
- issue: אֶכָּבֵד లోని బహిరంగ ఘనత భావం
  choice: నేను మహిమపరచబడతాను
  alternative: నేను ఘనపరచబడతాను
  rationale: రెండూ సాధ్యమే. ‘మహిమపరచబడతాను’ దేవునికి సంబంధించిన כבד పదంలోని వేదాంతపరమైన గంభీరతను ఉంచుతుంది; ‘ఘనపరచబడతాను’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘పరిశుద్ధుడిగా కనబడతాను’ అనే రూపం అస్పష్టతను పూర్తిగా తొలగించకుండా సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది; ప్రత్యామ్నాయ భావం పాదటిప్పణిలో ఇవ్వబడింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంచబడింది.
