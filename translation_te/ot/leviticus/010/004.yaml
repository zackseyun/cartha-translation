source:
  edition: WLC
  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל מִֽישָׁאֵל֙ וְ/אֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם קִ֠רְב֞וּ שְׂא֤וּ אֶת אֲחֵי/כֶם֙ מֵ/אֵ֣ת פְּנֵי הַ/קֹּ֔דֶשׁ אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: te
  text: అప్పుడు మోషే అహరోను తండ్రి సోదరుడైన ఉజ్జీయేలు కుమారులైన మీషాయేలు, ఎల్సాఫానులను పిలిచి వారితో, “దగ్గరికి రండి; మీ బంధువులను[a] పరిశుద్ధ స్థలం ఎదుటి నుంచి శిబిరం వెలుపలికి మోసుకెళ్లండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మీ సోదరులను.’ హీబ్రూ పదం దగ్గరి పురుష బంధువులను కూడా సూచించగలదు; ఇక్కడ నాదాబు, అబీహూలు వారికి బంధువరుసలో సోదరులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కרא అనే క్రియ ఈ కథన సందర్భంలో ఒకరిని పిలవడం లేదా రమ్మని పిలిపించడం అనే అర్థాన్ని ఇస్తుంది; ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు.
- source_word: בְּנֵי עֻזִּיאֵל
  choice: ఉజ్జీయేలు కుమారులు
  rationale: ఈ నిర్మాణం మీషాయేలు, ఎల్సాఫానులను ఉజ్జీయేలు ప్రత్యక్ష కుమారులుగా గుర్తిస్తుంది; ‘వంశస్థులు’ అనడం అవసరానికి మించిన విస్తృతార్థం.
- source_word: דֹּד אַהֲרֹן
  choice: అహరోను తండ్రి సోదరుడైన
  rationale: דּוֹד ఇక్కడ అహరోను మామను, సందర్భానుసారం అతని తండ్రి సోదరుడిని సూచిస్తుంది. తెలుగు ‘మామ’ మాతృసంబంధిగా అపార్థమయ్యే అవకాశం ఉన్నందున సంబంధాన్ని స్పష్టంగా, కానీ పెద్ద/చిన్న అన్న అదనపు భేదం లేకుండా చెప్పబడింది.
- source_word: קִרְבוּ
  choice: దగ్గరికి రండి
  rationale: קרב ఆజ్ఞారూపం దగ్గరికి రావడం లేదా సమీపించడం అనే స్థలార్థాన్ని కలిగి ఉంది; ఈ రూపం గంభీర సందర్భంలోనూ సహజంగా ఉంటుంది.
- source_word: שְׂאוּ
  choice: మోసుకెళ్లండి
  rationale: נשא యొక్క ప్రాథమిక భావం ఎత్తడం, మోయడం. ఇక్కడ మృతదేహాలను అక్కడి నుంచి బయటకు తీసుకెళ్లాలనే ఆజ్ఞ కాబట్టి ‘మోసుకెళ్లండి’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲחֵיכֶם
  choice: మీ సోదరులను
  rationale: ఆ referents నిజానికి వారి దగ్గరి పురుష బంధువులు, అంటే బంధువరుసలో సోదరులు (cousins), అయినప్పటికీ אָח అనే మూలపదంలోని బంధుత్వ భాషను ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత ప్రయోగాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం ఎదుటి నుంచి
  rationale: פְּנֵי అనే పదానికి ముఖం, ఎదుట, సన్నిధి అనే భావాలు ఉన్నాయి. ఈ స్థలసంబంధ సందర్భంలో ‘ఎదుటి నుంచి’ స్పష్టంగా ఉంటుంది; ప్రత్యామ్నాయమైన ‘సన్నిధి నుంచి’ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: ఇక్కడ ఈ నామవాచకం అమూర్తమైన పరిశుద్ధతను కాక పవిత్ర ప్రదేశాన్ని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ గుడార సందర్భానికి తగిన, సాధారణ పాఠకులకు అర్థమయ్యే పదబంధం.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: ఈ పదబంధం శిబిరానికి బయట ఉన్న ప్రదేశం వైపు కదలికను సూచిస్తుంది; ‘వెలుపలికి’ దిశార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: אֲחֵיכֶם లోని బంధుత్వ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘మీ సోదరులను’
  alternative: ‘మీ దగ్గరి బంధువులను’
  rationale: హీబ్రూ אָח దగ్గరి పురుష బంధువులను కూడా సూచించగలదు. ఇక్కడ నాదాబు, అబీహూలు మీషాయేలు, ఎల్సాఫానులకు సూటిగా అన్నదమ్ములు కాక బంధువరుసలో సోదరులు. మూలంలోని ఉద్దేశపూర్వక బంధుత్వ భాషను మార్చకుండా పాదటిప్పణి ద్వారా పరిధిని స్పష్టం చేశాం.
- issue: מֵאֵת פְּנֵי הַקֹּדֶשׁ యొక్క స్థలసంబంధ భావం
  choice: ‘పరిశుద్ధ స్థలం ఎదుటి నుంచి’
  alternative: ‘పరిశుద్ధ స్థలం సన్నిధి నుంచి’
  rationale: ‘ఎదుట’ భౌతిక స్థానాన్ని స్పష్టంగా తెలుపుతుంది; ‘సన్నిధి’ మూలంలోని presence భావాన్ని ప్రతిబింబించినా తెలుగులో అదనపు ఆధ్యాత్మిక ఛాయను కలిగించవచ్చు. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘స్థలము,’ ‘వెలుపలికి కొనిపోండి’ వంటి ప్రాచీన రూపాలను నివారించాం. వ్యక్తిపేర్లకు సాధారణ తెలుగు బైబిలు రూపాలను అనుసరించాం; మూలంలో లేని పెద్ద/చిన్న మామ భేదాన్ని చేర్చకుండా ‘తండ్రి సోదరుడు’ అని స్పష్టం చేశాం.
