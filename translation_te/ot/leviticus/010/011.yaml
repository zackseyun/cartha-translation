id: LEV.10.11
reference: Leviticus 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: te
  text: మరియు యాహ్వే మోషే ద్వారా[a] వారికి చెప్పిన నియమాలన్నిటినీ ఇశ్రాయేలు కుమారులకు బోధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మోషే చేతి ద్వారా.”'
    reason: బְּיַד מֹשֶׁה అనే హెబ్రీ నుడికారం యొక్క అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: మరియు ... బోధించాలి
  rationale: ఈ హిఫిల్ క్రియారూపం ముందరి వచనంలోని యాజకుల బాధ్యతల పరంపరను కొనసాగిస్తుంది. ఆధునిక తెలుగులో ‘బోధించాలి’ సహజంగా ఉండి, అధికారికంగా నేర్పించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ ఇది ఒడంబడిక సమాజమంతటినీ సూచించే సామూహిక ప్రయోగం. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, భావపరంగా సమగ్రంగా ఉంటుంది.
- source_word: כָּל הַחֻקִּים
  choice: నియమాలన్నిటినీ
  rationale: חֻקִּים దేవుడు నిర్దేశించిన స్థిరమైన శాసనాలను సూచిస్తుంది. ‘నియమాలు’ సామాన్య పాఠకులకు స్పష్టంగా ఉండి న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా ... చెప్పిన
  rationale: సాపేక్ష వాక్యం నియమాలను విశేషిస్తుంది. తెలుగులో ‘చెప్పిన’ పూర్తయిన దైవ ప్రకటనను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: אֲלֵיהֶם
  choice: వారికి
  rationale: אֶל ఉపసర్గతో కూడిన సర్వనామం దైవ వాక్యాన్ని అందుకున్న ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘వారికి’ దాని దిశార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అనే హెబ్రీ నుడికారానికి తెలుగులో సహజ సమానార్థకం ‘మోషే ద్వారా’; ఇది మోషే మధ్యవర్తిత్వాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా అనే ఒడంబడిక నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా నామరూపంలో ఉంచడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక పదబంధం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పదబంధం కేవలం పురుష సంతానాన్ని కాక ఒడంబడిక సమాజాన్ని సామూహికంగా సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘ప్రజలు’ సందర్భార్థాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది.
- issue: మోషే మధ్యవర్తిత్వాన్ని సూచించే בְּיַד నుడికారం
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: ‘ద్వారా’ అనే రూపం దైవ శాసనాలు మోషే మధ్యవర్తిత్వంలో అందినట్లు తెలియజేస్తూ, తెలుగులో అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందరి ఆజ్ఞతో వ్యాకరణపరంగా కొనసాగుతున్నందున ‘మరియు’తో మొదలుపెట్టి, విధిబాధ్యతను ‘బోధించాలి’తో తెలిపింది.
