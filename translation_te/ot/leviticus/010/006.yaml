source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: te
  text: 'మోషే అహరోనుతో, అతని కుమారులైన ఎలియాజరు, ఈతామారులతో ఇలా అన్నాడు: “మీ తల వెంట్రుకలను విరబోసుకోకండి[a]; మీ వస్త్రాలను చింపుకోకండి; లేకపోతే మీరు చనిపోతారు, సమాజమంతటి మీద ఆయన కోపపడతాడు. అయితే మీ సహోదరులు, అంటే ఇశ్రాయేలు ఇంటివారందరూ, యాహ్వే రగిలించిన ఆ దహనం కోసం ఏడుస్తారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ తలలను కప్పులేకుండా ఉంచకండి,” లేదా “మీ జుట్టును అస్తవ్యస్తంగా వదిలేయకండి.” హీబ్రూ పదబంధం తల లేదా జుట్టుతో సంబంధమైన ఒక శోకచిహ్నాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యాహ్వే కాల్చిన దహనం.” సహజమైన తెలుగు కోసం “యాహ్వే రగిలించిన ఆ దహనం” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: మీ తలవెంట్రుకలను విరబోసుకోకండి
  rationale: פרע ఇక్కడ శోకసూచకంగా జుట్టును అదుపులేకుండా వదిలేయడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘తలవెంట్రుకలను విరబోసుకోవడం’ అని అనువదించాం; తల కప్పును తీసివేయడం అనే మరింత నిర్దిష్ట ఆచారాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: మీ వస్త్రాలను చింపుకోకండి
  rationale: פרם శోకసూచకంగా వస్త్రాలను చింపడాన్ని సూచిస్తుంది; ఈ ప్రత్యక్ష భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలిపింది.
- source_word: וְלֹא תָמֻתוּ
  choice: అలా చేస్తే మీరు చనిపోతారు
  rationale: నిషేధాల తరువాత వచ్చే ఈ హెచ్చరిక వాటిని ఉల్లంఘించిన ఫలితాన్ని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు షరతు-ఫలిత రూపం ఉపయోగించబడింది.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: సమాజమంతటి మీద ఆయన కోపపడతాడు
  rationale: יִקְצֹף ఏకవచన క్రియ; కర్త పాఠ్యంలో స్పష్టంగా చెప్పకపోయినా సందర్భంలో దేవుడే సూచితుడు. ‘ఆయన’ అని ఉంచడం వ్యక్తిగత కర్తను నిలిపి, పేరును అనవసరంగా చేర్చకుండా ఉంటుంది.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: మీ సహోదరులు, అంటే ఇశ్రాయేలు ఇంటివారందరూ
  rationale: ‘మీ సహోదరులు’ అనే పురుష బహువచన రూపాన్ని నిలిపి, తరువాతి సమానార్థక వివరణ ద్వారా మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తున్నదని స్పష్టం చేసింది.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: దహనం గురించి ఏడుస్తారు
  rationale: שְׂרֵפָה దైవాగ్నివల్ల జరిగిన కాల్చివేతను సూచిస్తుంది. ‘దహనం’ అనే concrete image‌ను నిలిపి, ‘విపత్తు’ లేదా ‘తీర్పు’ వంటి వ్యాఖ్యానాత్మక పదాలను నివారించింది.
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: యెహోవా రగిలించిన
  rationale: హీబ్రూలో ‘కాల్చిన దహనం’ అనే cognate expression ఉంది. తెలుగులో అసహజ పునరుక్తిని నివారిస్తూ దైవ కార్యసాధకత్వాన్ని నేరుగా నిలిపేందుకు ‘రగిలించిన’ ఉపయోగించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించింది; బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: יִקְצֹף అనే క్రియకు స్పష్టంగా చెప్పని కర్త
  choice: ఆయన కోపపడతాడు
  alternative: సమాజమంతటి మీద కోపం వస్తుంది
  rationale: మూలంలో కర్త నామంగా లేదు, కాని క్రియ ఏకవచనంలో ఉంది; సందర్భం దేవుణ్ణి సూచిస్తుంది. ‘ఆయన’ మూలంలోని సూచిత వ్యక్తిగత కర్తను నిలుపుతూ, ‘యెహోవా’ను ఈ ఉపవాక్యంలో అదనంగా చేర్చదు.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది బిరుదు కాదు, వ్యక్తినామం. ఆధునిక తెలుగు సాధారణ బైబిల్ పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; పాండిత్య వర్గాల్లో వినిపించే ‘యాహ్వే’ ప్రత్యామ్నాయం.
- issue: యాజకులు శోకచిహ్నాలు పాటించకూడదనే ఆజ్ఞ యొక్క భావం
  choice: శోకసూచక చర్యలను నేరుగా పేర్కొనడం
  alternative: ‘శోకించకండి’ అని సాధారణీకరించడం
  rationale: పాఠ్యం అంతరంగ శోకాన్ని పూర్తిగా నిషేధిస్తున్నదని చెప్పకుండా, జుట్టు విరబోసుకోవడం మరియు వస్త్రాలు చింపుకోవడం అనే నిర్దిష్ట బాహ్య చర్యలనే పేర్కొంటుంది; ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. శోకాచారాలకు సంబంధించిన నిర్దిష్ట చిత్రాలను నిలిపి, కర్త స్పష్టంగా లేని చోట మూలంలోని సూచనాత్మకతను సాధ్యమైనంతవరకు కాపాడింది. ‘సమాజం,’ ‘ఇశ్రాయేలు ఇంటివారు,’ ‘దహనం’ వంటి పదాలు లేవీయకాండపు ఆచార-సమాజ సందర్భానికి తగిన గంభీరతను ఇస్తాయి.
