id: LEV.10.16
reference: Leviticus 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: te
  text: 'మోషే పాపపరిహార బలికి చెందిన మేకపోతును ఎంతో శ్రద్ధగా వెదికాడు[a]. ఇదిగో, అది కాల్చివేయబడి ఉంది[b]. అప్పుడు అతడు అహరోను మిగిలిన కుమారులైన ఎలియాజరు, ఈతామారుల మీద కోపపడి వారితో ఇలా అన్నాడు[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపపరిహార బలికి చెందిన మేకపోతును వెదికి వెదికి చూశాడు.” చర్యను నొక్కిచెప్పడానికి హీబ్రూలో క్రియారూపం పునరుక్తమైంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది పూర్తిగా కాల్చివేయబడి ఉంది.” మేక కాల్చబడిన స్థితిలో కనిపించిందని హీబ్రూ రూపం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “అహరోను మిగిలిన కుమారులు” అంటే నాదాబు, అబీహులు చనిపోయిన తరువాత మిగిలిన ఎలియాజరు, ఈతామారు (లేవీయకాండము 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: పాపపరిహార బలికి చెందిన మేకపోతు
  rationale: שְׂעִיר మగ మేకను సూచిస్తుంది; הַחַטָּאת బలి వర్గాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, బలి సంబంధాన్ని స్పష్టంగా నిలిపే అనువాదం.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: ఎంతో శ్రద్ధగా వెదికాడు
  rationale: క్రియతో కూడిన infinitive absolute చర్యకు గాఢతను ఇస్తుంది. హీబ్రూ పునరుక్తిని కృత్రిమంగా అనుకరించకుండా ఆ ఉద్ఘాటనను తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అనూహ్యంగా కనుగొన్న విషయంపై దృష్టి నిలిపే కథన సంకేతాన్ని, గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే తెలుగులో కాపాడుతుంది.
- source_word: שֹׂרָף
  choice: అది కాల్చివేయబడి ఉంది
  rationale: నిష్క్రియాత్మక కృదంతం, మేక కనబడినప్పుడు అది కాల్చబడిన స్థితిలో ఉందని తెలియజేస్తుంది. పూర్తిగా దహనమైందనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ణయించలేదు.
- source_word: וַיִּקְצֹף
  choice: అతడు ... మీద కోపపడి
  rationale: క్రోధాన్ని తగిన తీవ్రతతో తెలియజేస్తూ, మూలంలో నిర్బంధించని ‘మండిపడ్డాడు’ వంటి అధిక తీవ్రతను చేర్చదు.
- source_word: הַנּוֹתָרִם
  choice: మిగిలిన
  rationale: నాదాబు, అబీహుల మరణం తరువాత అహరోనుకు మిగిలిన కుమారులను సంక్షిప్తంగా, సందర్భానుగుణంగా సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: 'వారితో ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష మాటకు సహజమైన తెలుగు ప్రవేశాన్ని ఇస్తుంది; హీబ్రూ speech introducer యొక్క కార్యాన్ని కాపాడుతుంది.
