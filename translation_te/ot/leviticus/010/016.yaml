translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పాపపరిహార బలి’ అనే సాధారణ బైబిలు బలి పదజాలాన్ని ఉంచి, ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి ఆకర్షణను నిలిపింది. ప్రధాన పాఠ్యంలో హీబ్రూ ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేసి, మరింత పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
