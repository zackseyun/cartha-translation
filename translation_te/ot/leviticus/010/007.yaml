id: LEV.10.7
reference: Leviticus 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: te
  text: “మీరు సమాగమ గుడారపు ప్రవేశద్వారం నుండి బయటికి వెళ్లకూడదు; లేకపోతే మీరు చనిపోతారు. ఎందుకంటే యాహ్వే అభిషేక తైలం మీ మీద ఉంది.” వారు మోషే మాట ప్రకారం చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం నుండి
  rationale: פֶּתַחను సహజమైన ఆధునిక తెలుగులో ‘ప్రవేశద్వారం’గా, אֹהֶל מוֹעֵד అనే స్థిరమైన ఆరాధనా స్థలపేరును ‘ప్రత్యక్ష గుడారం’గా అనువదించాం.
- source_word: לֹא תֵצְאוּ
  choice: మీరు ... బయటికి వెళ్లకూడదు
  rationale: నిషేధార్థక రూపాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן תָּמֻתוּ
  choice: వెళ్తే మీరు చనిపోతారు
  rationale: פֶּן ఇక్కడ హెచ్చరికతో కూడిన పరిణామాన్ని సూచిస్తుంది; తెలుగులో ‘వెళ్తే’ అని పూర్వక్రియను సహజంగా పునరుద్ఘాటించడం ద్వారా సంబంధం స్పష్టమవుతుంది.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: యెహోవా అభిషేక తైలం
  rationale: పవిత్ర ప్రతిష్ఠాపనకు ఉపయోగించిన తైలాన్ని సూచించే construct chainను సంక్షిప్తంగా, సాంప్రదాయిక బైబిలు పదజాలంతో అందిస్తుంది.
- source_word: עֲלֵיכֶם
  choice: మీ మీద ఉంది
  rationale: తైలం వారిమీద ఉండటాన్ని, దానితో సూచితమైన యాజక ప్రతిష్ఠను అదనపు వివరణ లేకుండా యథాతథంగా ఉంచుతుంది.
- source_word: וַיַּעֲשׂוּ כִּדְבַר מֹשֶׁה
  choice: వారు మోషే మాట ప్రకారం చేశారు
  rationale: కథన పురోగతిని మరియు మోషే ఆజ్ఞకు వారి విధేయతను మూలభాషకు దగ్గరగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
- issue: అభిషేక తైలం ‘మీ మీద ఉంది’ అనే వాక్యంలోని భావం
  choice: మూలంలోని ప్రత్యక్ష వాక్యాన్నే ఉంచడం
  alternative: మీరు యెహోవాకు ప్రతిష్ఠించబడ్డారు అని వివరణాత్మకంగా అనువదించడం
  rationale: యాజక ప్రతిష్ఠ అనే అంతర్భావం ఉన్నప్పటికీ, మూలపాఠంలోని తైలం-రూపకాన్ని తొలగించకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆజ్ఞ యొక్క గంభీరతను నిలిపే శైలి. ‘ప్రత్యక్ష గుడారం,’ ‘అభిషేక తైలం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించాం; అనవసరమైన మతశాఖాపరమైన వివరణలను చేర్చలేదు.
