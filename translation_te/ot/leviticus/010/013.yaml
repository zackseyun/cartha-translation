id: LEV.10.13
reference: Leviticus 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: te
  text: మీరు దానిని పవిత్ర స్థలంలో తినాలి. ఎందుకంటే అది యాహ్వేకు అర్పించే అగ్ని అర్పణలలోనుండి[a] నీకూ నీ కుమారులకూ నియమించబడిన భాగం. నాకు ఇలాగే ఆజ్ఞ ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆహార అర్పణలలోనుండి.”
    reason: אִשֶּׁה అనే బలిసంబంధ పదానికి ‘అగ్ని అర్పణ’ మరియు ‘ఆహార అర్పణ’ అనే రెండు అనువాద సంప్రదాయాలు ఉన్నాయి.
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: మీరు ... తినాలి
  rationale: పురుష బహువచన సంబోధనలోని ఆదేశ భావాన్ని ఆధునిక సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; వావ్‌ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగు వాక్యప్రవాహానికి అవసరం లేదు.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పవిత్ర స్థలంలో
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోవడాన్ని గౌరవిస్తూ, ఒక నిర్దిష్ట గదిని సూచించకుండా ఆరాధన సంబంధమైన పవిత్రతను తెలియజేస్తుంది.
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: నీకూ నీ కుమారులకూ నియమించబడిన భాగం
  rationale: యాజక సందర్భంలో חֹק అమూర్తమైన శాసనం కంటే నియమిత వాటా లేదా హక్కుభాగాన్ని సూచిస్తుంది. ‘కుమారులు’ మూలంలోని లింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలలోనుండి
  rationale: אִשֶּׁה అనే బలిసంబంధ పదానికి సాంప్రదాయికంగా ఉన్న అగ్ని-అర్పణ భావాన్ని నేరుగా, కానీ సహజ తెలుగులో అందిస్తుంది; ‘ఆహార అర్పణలు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: నాకు ఇలాగే ఆజ్ఞ ఇవ్వబడింది
  rationale: మోషే దేవుని నుండి ఆజ్ఞ పొందాడనే నిష్క్రియ రూపాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: యాజక సందర్భంలో חֹק యొక్క అర్థం
  choice: నియమించబడిన భాగం
  alternative: హక్కు; వాటా; శాసనం
  rationale: ఈ సందర్భం బలిలో యాజకులకు కేటాయించిన భాగాన్ని గురించి ఉంది; కాబట్టి అమూర్తమైన ‘శాసనం’ కంటే concrete allotted share అనే భావమే సరిపోతుంది.
- issue: אִשֵּׁי יְהוָה పదబంధం
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలు
  alternative: యెహోవా ఆహార అర్పణలు
  rationale: మూలపదంలోని అగ్ని-అర్పణ సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, బలి దేవునికి సమర్పించే ‘ఆహారం’గా భావించబడే ప్రత్యామ్నాయ పదప్రయోగాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: బహువచన ఆదేశం నుండి ఏకవచన స్వామ్యసూచనకు మార్పు
  choice: ‘మీరు’ ... ‘నీకు, నీ కుమారులకు’
  alternative: అంతటా బహువచన సంబోధన
  rationale: וַאֲכַלְתֶּם బహువచనం అయినా חָקְךָ మరియు בָּנֶיךָ ఏకవచన పురుష సంబోధనలో ఉన్నాయి. ఈ మార్పు అహరోనును మరియు అతని కుమారులను కలిపి ఉద్దేశిస్తూ, వాటాను అహరోనుతో సంబంధింపజేసే మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలి వాడబడింది. మూలంలోని బహువచన ‘మీరు’ నుండి అహరోనును ఉద్దేశించిన ఏకవచన ‘నీకు’ అనే మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదటిప్పణి గుర్తు సంబంధిత బలిసంబంధ పదబంధం వెంటనే ఉంచబడింది.
