  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּיטַ֖ב בְּ/עֵינָֽי/ו׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: te
  text: మోషే అది విన్నాడు; అది అతని దృష్టికి మంచిదిగా అనిపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అది అతనికి నచ్చింది’ / ‘అతడు దానిని సమ్మతించాడు.’ హీబ్రూ నుడికారం అక్షరార్థంగా, ‘అది అతని కళ్లలో మంచిగా ఉంది’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: שׁמע అనే క్రియకు ఇక్కడ సహజమైన ప్రాథమిక అర్థం ‘వినడం.’ మునుపటి వచనంలో అహరోను చెప్పిన వివరణను మోషే విన్నాడనే కథన క్రమాన్ని ఇది కాపాడుతుంది; ‘అర్థం చేసుకున్నాడు’ లేదా ‘అంగీకరించాడు’ అని అదనంగా నిర్ధారించదు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיִּיטַב
  choice: మంచిదిగా అనిపించింది
  rationale: יטב యొక్క ‘మంచిగా ఉండు, నచ్చదగినదిగా ఉండు’ అనే భావాన్ని, తరువాతి ‘అతని దృష్టికి’ అనే నుడికారంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మోషే దానిని ఆమోదించాడనే భావాన్ని అతిగా స్పష్టీకరించదు.
- source_word: בְּעֵינָיו
  choice: అతని దృష్టికి
  rationale: అక్షరార్థమైన ‘అతని కళ్లలో’ అనే హీబ్రూ నుడికారంలోని మూల్యాంకన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని పదేపదే అనుకరించకుండా దాని భావచిత్రానికి దగ్గరగా ఉండే ‘అతని దృష్టికి’ వాడబడింది; వాక్యంలోని మూల్యాంకన భావం మరియు దాని స్వల్ప అస్పష్టత నిలుపబడ్డాయి.
