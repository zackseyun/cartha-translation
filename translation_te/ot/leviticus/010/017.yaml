id: LEV.10.17
reference: Leviticus 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: te
  text: “పాపపరిహార బలిని[a] పరిశుద్ధ స్థలంలో మీరు ఎందుకు తినలేదు? అది అతి పరిశుద్ధమైనది. సమాజపు దోషాన్ని మోయడానికి, యెహోవా సన్నిధిలో వారి కోసం ప్రాయశ్చిత్తం చేయడానికి ఆయన దానిని మీకు ఇచ్చాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి.” హీబ్రూ పదం חַטָּאת పాపాన్ని పరిష్కరించడానికి సంబంధించిన బలినే కాక, అపవిత్రతను తొలగించే బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: మీరు ఎందుకు తినలేదు?
  rationale: గద్దింపు సందర్భంలోని కారణార్థక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఇక్కడ ఈ పదం పాపం అనే భావాన్ని కాక బలిని సూచిస్తోంది. ‘పాపపరిహార బలి’ తెలుగు పాఠకులకు సుపరిచితమైనది; శుద్ధీకరణ సంబంధమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: యాజకులు బలిని భుజించవలసిన నియమిత పవిత్ర ప్రదేశాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హీబ్రూ అతిశయార్థక నిర్మాణాన్ని సహజంగా అందిస్తుంది; అంతరాలయమైన ‘అతి పరిశుద్ధ స్థలం’తో గందరగోళం కలగకుండా విశేషణ రూపం వాడాం.
- source_word: נָתַן לָכֶם
  choice: ఆయన దానిని మీకు ఇచ్చాడు
  rationale: హీబ్రూలో కర్త స్పష్టంగా లేకపోయినా సందర్భంలో దేవుడే సూచింపబడుతున్నాడు; ‘ఆయన’ ఆ అంతర్భావిత కర్తను నిలుపుతుంది.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: సమాజపు దోషాన్ని మోసి
  rationale: נשא עון లోని ప్రతినిధిత్వంతో కూడిన ‘దోషాన్ని మోయడం’ అనే భావాన్ని యాంత్రికంగా వివరించకుండా నిలుపుతుంది.
- source_word: הָעֵדָה
  choice: సమాజం
  rationale: ఒడంబడిక ప్రజల సముదాయాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: వారి కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: బలి సంబంధ సందర్భంలోని כפר పదానికి స్థిరమైన ధార్మిక భావాన్ని నిలుపుతూ, దాని విధానాన్ని మించి వివరించదు.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, దేవుని సమక్షంలో జరిగే ఆచార సంబంధ చర్యను సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: חַטָּאת అనే బలి పేరు
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో ఇది బలిని సూచించడంలో సందేహం లేదు; అయితే ఆ బలి పాపాన్ని పరిష్కరించడమా, అపవిత్రతను తొలగించడమా అనే పదార్థ విస్తృతిని ఒకే అర్థానికి కుదించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: נָתַן అనే క్రియకు అంతర్భావిత కర్త
  choice: ‘ఆయన’ అని వ్యక్తపరచి దేవుణ్ణి సూచించడం
  alternative: ‘అది మీకు ఇవ్వబడింది’ అనే కర్మణి నిర్మాణం
  rationale: సందర్భంలో యాజకులకు ఈ బలిని ఇచ్చినవాడు దేవుడే. అయినప్పటికీ మూలంలో దేవుని నామం ఈ క్రియకు ప్రత్యక్ష కర్తగా లేదు; తెలుగు వాక్యస్పష్టత కోసం ‘ఆయన’ వాడాం.
- issue: עָוֹן యొక్క భావం
  choice: దోషం
  alternative: అక్రమం
  rationale: ఈ యాజక-బలి సందర్భంలో ‘దోషం’ బాధ్యత లేదా అపరాధభారం అనే ఉద్వేగాన్ని నిలుపుతుంది; ‘శిక్ష’ అని అనువదిస్తే మూలంలోని అర్థాన్ని అతిగా నిర్దిష్టం చేసినట్టవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మోషే గద్దింపులోని నేరుతనాన్ని ప్రశ్న రూపంలో నిలిపి, బలి సంబంధ సాంకేతిక పదాలకు సుపరిచితమైన తెలుగు పదాలను వాడాం.
