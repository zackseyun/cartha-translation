  verdict: revise
  source_fidelity: The verse’s sequence and directional sense are retained, but the main-text phrase “వారి అంగీలతోనే” naturally foregrounds instrumentality and does not adequately represent the Hebrew’s primary/most direct sense, “in their tunics.”
  naturalness: The proposed revision is fluent modern standard Telugu. “అంగీలలోనే” naturally conveys that the bodies were carried in/wrapped in the tunics, while the note preserves the plausible instrumental alternative.
  terminology: “అంగీలు,” “శిబిరం,” and “మోషే” are suitable and consistent. The revision avoids implying merely that the men were wearing tunics while carrying the bodies.
  issues:
  - severity: medium
    issue: The main text renders בְּכֻתֳּנֹתָם as “వారి అంగీలతోనే.”
    rationale: This wording primarily means “with/by their tunics,” whereas the Hebrew wording directly permits—and in this context is commonly understood as—carrying the bodies in/wrapped in their tunics. The existing lexical rationale also introduces an unsupported “while wearing the tunics” reading. The main text should retain the direct locative/circumstantial wording, with instrumentality in the footnote.
  revised_text: వారు దగ్గరకు వెళ్లి, మోషే చెప్పినట్లే, వారిని వారి అంగీలలోనే శిబిరం వెలుపలికి మోసుకెళ్లారు.[a]
