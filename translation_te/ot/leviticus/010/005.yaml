  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: te
  text: వారు దగ్గరకు వెళ్లి, మోషే చెప్పినట్లే, వారిని వారి అంగీలలోనే శిబిరం వెలుపలికి మోసుకెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి అంగీల ద్వారా” లేదా “వారి అంగీలను పట్టుకొని.” హీబ్రూ ఉపసర్గ సాధనాన్ని కూడా సూచించవచ్చు; కాబట్టి వారు మృతదేహాలను అంగీల సహాయంతో మోశారని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: వారు దగ్గరకు వచ్చి
  rationale: קרב అనే క్రియలోని సమీపానికి కదలివచ్చే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అనవసరమైన ఆచార సంబంధ భావాన్ని చేర్చదు.
- source_word: וַיִּשָּׂאֻם
  choice: వారిని ... మోసుకెళ్లారు
  rationale: נשׂא ఇక్కడ నాదాబు, అబీహుల మృతదేహాలను ఆ ప్రదేశం నుంచి తీసుకెళ్లడాన్ని సూచిస్తుంది. సందర్భంలో ‘మోసుకెళ్లారు’ అనేది కేవలం పైకెత్తడం కంటే స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּכֻתֳּנֹתָם
  choice: వారి అంగీలతోనే
  rationale: כֻּתֹּנֶת శరీరంపై ధరించే పొడవైన వస్త్రాన్ని సూచిస్తుంది; ‘అంగీలు’ సాధారణ పాఠకులకు అర్థమయ్యే సమీప తెలుగు పదం. בְּ ఉపసర్గ ఇక్కడ వారు ఆ అంగీలు ధరించి ఉండగా మోశారనే భావాన్నీ, అంగీలను పట్టుకొని లేదా వాటి సహాయంతో మోశారనే సాధనార్థాన్నీ అనుమతిస్తుంది; ప్రధాన పాఠం మొదటి భావాన్ని సహజంగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: אֶל తో కూడిన దిశా భావాన్ని తెలుగు ‘వెలుపలికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: మోషే చెప్పినట్లే
  rationale: మునుపటి వచనంలో మోషే ఇచ్చిన ఆదేశానికి అనుగుణంగా వారు చేసినట్లు כַּאֲשֶׁר భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
