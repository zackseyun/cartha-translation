id: LEV.16.17
reference: Leviticus 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: te
  text: అతడు పరిశుద్ధ స్థలంలో ప్రాయశ్చిత్తం చేయడానికి సమావేశపు గుడారంలోకి ప్రవేశించినప్పటి నుండి అతడు బయటికి వచ్చేవరకు, ఏ వ్యక్తీ సమావేశపు గుడారంలో ఉండకూడదు. అతడు తన కోసం, తన ఇంటివారి కోసం, ఇశ్రాయేలు సమాజమంతటి కోసం ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל אָדָם
  choice: ఏ మనిషీ
  rationale: אָדָם ఇక్కడ ప్రత్యక్ష గుడారంలో ఉండరాదనే సాధారణ మానవ నిషేధాన్ని సూచిస్తుంది; మూలంలోని ఏకవచన మానవ పదాన్ని సహజమైన తెలుగు నిషేధ నిర్మాణంతో నిలిపింది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనలో దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదబంధం.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయడానికి / ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר అనే ఆచార సంబంధ క్రియ యొక్క పాపపరిహార భావాన్ని ఒకే విధంగా నిలుపుతుంది; క్రియ ఎలా పనిచేస్తుందనే సిద్ధాంత వివరణను వాక్యంలో చేర్చదు.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: నామవాచక రూపంలోని పవిత్ర ప్రదేశ సూచనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; దీనిని మరింత నిర్దిష్టమైన 'అతి పరిశుద్ధ స్థలం'గా మార్చి మూలంలోని పరిధిని ముందుగానే నిర్ణయించదు.
- source_word: בֵיתוֹ
  choice: తన ఇంటివారి
  rationale: సందర్భంలో భవనం కంటే యాజకుని గృహస్థులను సూచించడం సహజం; తెలుగులో 'ఇంటివారు' ఆ సామూహిక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כָל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి
  rationale: קהל యొక్క కూడిన సమాజ భావాన్నీ כָל యొక్క సంపూర్ణతనూ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రాయశ్చిత్తం జరిగే ప్రదేశం యొక్క నిర్దిష్టత
  choice: పరిశుద్ధ స్థలం
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: בַּקֹּדֶשׁ అక్షరార్థంగా 'పరిశుద్ధ స్థలంలో/పవిత్ర ప్రదేశంలో' అని ఉంటుంది. అధ్యాయ సందర్భం లోపలి పరిశుద్ధ ప్రాంతాన్ని సూచించినప్పటికీ, అనువాదంలో మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చలేదు.
- issue: ప్రాయశ్చిత్తం యొక్క పరిధి
  choice: తన కోసం, తన ఇంటివారి కోసం, ఇశ్రాయేలు సమాజమంతటి కోసం
  alternative: తన పాపాల కోసం, తన కుటుంబపు పాపాల కోసం, ఇశ్రాయేలు పాపాలన్నిటి కోసం
  rationale: మూలం בַּעַד అనే 'కొరకు/తరఫున' భావాన్ని మాత్రమే ఇక్కడ వ్యక్తపరుస్తుంది; 'పాపాలు' అనే పదాన్ని ఈ వాక్యంలో స్వయంగా చేర్చకుండా దాని ఆచార-ధార్మిక విస్తృతిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది. మొదటి వాక్యంలో కాల పరిమితిని సహజంగా స్పష్టపరచి, రెండవ వాక్యంలో మూలంలోని మూడు 'కొరకు' అంశాల సమాంతర క్రమాన్ని నిలిపాం.
