revisions:
- from: అతడు పరిశుద్ధ స్థలంలో ప్రాయశ్చిత్తం చేయడానికి ప్రత్యక్ష గుడారంలోకి ప్రవేశించినప్పటి నుంచి బయటికి వచ్చేవరకు, ఏ మనిషీ ప్రత్యక్ష గుడారంలో ఉండకూడదు. అతడు తన కోసం, తన ఇంటివారి కోసం, ఇశ్రాయేలు సమాజమంతటి కోసం ప్రాయశ్చిత్తం చేయాలి.
