id: LEV.16.15
reference: Leviticus 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: te
  text: తర్వాత అతడు ప్రజల కోసం ఉన్న పాపపరిహార బలి మేకపోతును వధించి, దాని రక్తాన్ని తెర లోపలికి తీసుకురావాలి. ఎద్దు రక్తంతో చేసినట్లే దాని రక్తంతోనూ చేసి, దాన్ని ప్రాయశ్చిత్తపు మూత[a] మీద, ఆ మూత ఎదుట చిలకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సంప్రదాయ అనువాదం: “కరుణాపీఠం.”'
    reason: כַּפֹּרֶתకు ఉన్న చారిత్రకంగా ప్రసిద్ధమైన ప్రత్యామ్నాయ అనువాదాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: וְשָׁחַט
  choice: తర్వాత అతడు ... వధించి
  rationale: కర్మకాండ సంబంధమైన జంతువధను ‘వధించు’ స్పష్టంగా తెలియజేస్తుంది; ‘తర్వాత’ అనేది వావ్‌తో అనుసంధానమైన కార్యక్రమ వరుసను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׂעִיר הַחַטָּאת
  choice: పాపపరిహార బలి మేకపోతు
  rationale: שְׂעִיר మగమేకను సూచిస్తుంది; חַטָּאתకు సాధారణ పాఠకులకు సుపరిచితమైన బలిపదంగా ‘పాపపరిహార బలి’ వాడబడింది.
- source_word: אֲשֶׁר לָעָם
  choice: ప్రజల కోసం ఉన్న
  rationale: ఇది అహరోను కోసం అర్పించిన ఎద్దు నుండి ఈ మేకపోతును వేరు చేస్తూ, బలి ప్రజల నిమిత్తమైనదని తెలుపుతుంది.
- source_word: וְהֵבִיא אֶת דָּמוֹ
  choice: దాని రక్తాన్ని ... తీసుకురావాలి
  rationale: హిఫిల్ రూపం రక్తాన్ని లోపలి పవిత్ర స్థలానికి తీసుకురావడాన్ని సూచిస్తుంది; విధినిర్దేశ సందర్భానికి ‘తీసుకురావాలి’ సహజంగా సరిపోతుంది.
- source_word: אֶל מִבֵּית לַפָּרֹכֶת
  choice: తెర లోపలికి
  rationale: ఈ హెబ్రీయ ప్రయోగం తెరకు అవతల ఉన్న అంతర్గత స్థలాన్ని సూచిస్తుంది; ‘తెర లోపలికి’ సంక్షిప్తంగా, సహజంగా ఆ స్థలదిశను నిలుపుతుంది.
- source_word: וְעָשָׂה אֶת דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: ఎద్దు రక్తంతో చేసినట్లే దాని రక్తంతోనూ చేసి
  rationale: హెబ్రీయ వాక్యం ఉద్దేశపూర్వకంగా కొంత సంక్షిప్తంగా ఉంది; మునుపు ఎద్దు రక్తంతో చేసిన అదే కర్మను ఈ రక్తంతో చేయాలని చెప్పే భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: וְהִזָּה אֹתוֹ
  choice: దాన్ని ... చిలకరించాలి
  rationale: బలిసంబంధ సందర్భంలో נזה రక్తాన్ని చిలకరించే కర్మను సూచిస్తుంది; సర్వనామం రక్తానికే తిరిగి సూచిస్తుంది.
- source_word: עַל הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత మీద
  rationale: כַּפֹּרֶת మందసపు బంగారు మూతను సూచిస్తుంది. ‘ప్రాయశ్చిత్తపు మూత’ దాని భౌతిక స్వరూపాన్నీ kpr మూలంతో ఉన్న సంబంధాన్నీ తెలియజేస్తుంది.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: ఆ మూత ఎదుట
  rationale: לִפְנֵי స్థలపరంగా ‘ఎదుట/ముందు’ అనే అర్థం ఇస్తుంది; ‘మీద’ జరిగే చిలకరింపుకు భిన్నమైన స్థానాన్ని ఇది స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: כַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాపీఠం
  rationale: ఈ పదం మందసపు మూతను సూచిస్తుంది; ‘ప్రాయశ్చిత్తపు మూత’ ఆధునిక పాఠకుడికి వస్తువునూ దాని కర్మకాండ సంబంధాన్నీ పారదర్శకంగా తెలియజేస్తుంది. సంప్రదాయ ‘కరుణాపీఠం’ను పాదసూచికలో ఉంచడం ద్వారా చారిత్రక పదప్రయోగం కూడా సంరక్షించబడింది.
- issue: ఒకే వాక్యంలో రెండుసార్లు వచ్చిన כַּפֹּרֶת
  choice: మొదట ‘ప్రాయశ్చిత్తపు మూత’, తరువాత ‘ఆ మూత’
  alternative: మొదట ‘ప్రాయశ్చిత్తపు మూత’, తరువాత ‘కరుణాపీఠం’
  rationale: మూలంలో రెండుచోట్లా ఒకే పదం ఒకే వస్తువును సూచిస్తుంది. తెలుగులో సహజత్వం కోసం రెండోసారి ‘ఆ మూత’ అన్నప్పటికీ సూచనను మార్చలేదు; వేర్వేరు పదాలతో రెండు వేర్వేరు వస్తువులు లేదా భావాలు అన్న అపోహను నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన విధినిర్దేశ శైలి వాడబడింది. దీర్ఘమైన హెబ్రీయ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు తెలుగు వాక్యాలుగా విభజించగా, కార్యాల క్రమం మరియు కర్మకాండ సంబంధాలు యథాతథంగా ఉంచబడ్డాయి.
