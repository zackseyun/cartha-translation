  terminology: ‘ప్రాయశ్చిత్తం చేయాలి’, ‘బలిపీఠం’, ‘యాజకులు’ సముచితమైన ఆచారపర పదాలు. ‘పరిశుద్ధ స్థలం’ మִקְדַּשׁ הַקֹּדֶשׁ యొక్క పవిత్ర-స్థల భావాన్ని కాపాడి, ‘అతి పరిశుద్ధ స్థలం’ అని అతిగా నిర్దిష్టపరచదు. ‘సమావేశపు గుడారం’ אֹהֶל מוֹעֵד లోని సమావేశం/నిర్ణీత కలయిక భావాన్ని నిలుపుతుంది.
