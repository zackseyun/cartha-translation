id: LEV.16.33
reference: Leviticus 16:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: te
  text: అతడు పరిశుద్ధ స్థలానికోసం[a], సమావేశపు గుడారానికోసం, బలిపీఠానికోసం ప్రాయశ్చిత్తం చేయాలి; అలాగే యాజకులకోసం, సమాజానికి చెందిన ప్రజలందరికోసం[b] ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాయశ్చిత్తం కలుగజేయాలి’ అని కూడా అనువదించవచ్చు. ఈ ఆచార సంబంధ సందర్భంలో హీబ్రూ క్రియ అపవిత్రతను తొలగించడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమాజానికి చెందిన ప్రజలు’ అనే మాటలను ‘సమాజ ప్రజలు’ లేదా ‘సమూహానికి చెందిన ప్రజలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: లేవీయకాండంలోని ఆచార సంబంధ సందర్భంలో כפר అనేది సాంకేతిక పదం. ‘ప్రాయశ్చిత్తం చేయాలి’ అనేది దాని ఆచారపరమైన, దైవశాస్త్రపరమైన విస్తృతిని నిలుపుతుంది; అపవిత్రత తొలగింపును మాత్రమే సూచించే మరింత సంకుచిత పదాన్ని ఉపయోగించదు. మూలంలోని పునరుక్తిని కూడా సాధ్యమైనంతవరకు నిలిపింది.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: పరిశుద్ధ మందిరం
  rationale: ఈ పదబంధం పవిత్రమైన ఆలయస్థలాన్ని సూచిస్తుంది. హీబ్రూ ఇక్కడ తప్పనిసరిగా ‘అతి పరిశుద్ధ స్థలం’ అని నిర్దిష్టంగా చెప్పనందున, అలా అతిగా ప్రత్యేకీకరించకుండా ‘పరిశుద్ధ మందిరం’ అని అనువదించబడింది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలీయులు దేవుని సన్నిధిలో కూడే గుడారానికి తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పేరు; గుడారం అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: ఆరాధనా సందర్భంలో సహజంగా, స్పష్టంగా ఉండే ప్రామాణిక తెలుగు పదం.
- source_word: עַל
  choice: కోసం
  rationale: כפר క్రియతో వచ్చినప్పుడు సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే ప్రయోగం. ఇది వస్తువులు, వ్యక్తులు రెండింటికీ ఒకే ప్రాయశ్చిత్త క్రియ వర్తిస్తున్నదని చూపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: హీబ్రూ బహువచన నామానికి సాధారణమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: כָּל עַם הַקָּהָל
  choice: సమాజానికి చెందిన ప్రజలందరు
  rationale: కేవలం ‘ప్రజలందరు’ అని కుదించకుండా, వారు కూడిన సమాజానికి చెందిన ప్రజలని హీబ్రూ స్పష్టంగా తెలిపే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పవిత్ర స్థలాలు, వస్తువులు, వ్యక్తులు—అందరికీ כפר అనే ఒకే క్రియ వర్తించడం
  choice: అన్నిటికీ ‘ప్రాయశ్చిత్తం చేయాలి’ అనే ఒకే వ్యక్తీకరణను వాడటం
  alternative: పవిత్ర స్థలాలు, వస్తువుల విషయంలో ‘శుద్ధి చేయాలి’ అని, వ్యక్తుల విషయంలో ‘ప్రాయశ్చిత్తం చేయాలి’ అని వేర్వేరు క్రియలు వాడటం
  rationale: మూల హీబ్రూ ఉద్దేశపూర్వకంగా ఒకే כפר క్రియను పునరావృతం చేస్తుంది. ఒకే పదబంధాన్ని కొనసాగించడం వాక్యంలోని ఆచారపరమైన ఏకత్వాన్ని కాపాడుతుంది; శుద్ధీకరణ ఈ క్రియలో ఒక అంశమైనప్పటికీ, అనువాదంలో దానినే సంపూర్ణ అర్థంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆరాధనా శైలిని ఉపయోగించాం. మూలంలోని כפר పునరుక్తిని, పవిత్ర వస్తువులు మరియు వ్యక్తుల మధ్య ఉన్న ఉద్దేశపూర్వక సమాంతరతను నిలిపాం.
