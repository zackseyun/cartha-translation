source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: te
  text: 'అహరోను ఆ రెండు మేకల మీద చీట్లు వేయాలి: ఒక చీటి యెహోవా కోసం, మరొక చీటి అజాజేలు కోసం[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడిచిపెట్టే మేక కోసం.” ‘అజాజేలు’ అనే హీబ్రూ పదం అర్థం వివాదాస్పదం; అది ఒక పేరుగా, మేక నిర్వర్తించే పాత్రగా, లేదా తొలగింపుతో సంబంధమున్న పదంగా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: చీట్లు వేయాలి
  rationale: క్రియకు అక్షరార్థంగా ‘ఇవ్వడం/పెట్టడం’ అనే భావం ఉన్నా, గּוֹרָלוֹת (‘చీట్లు’) మరియు עַל (‘మీద’)తో కలిసినప్పుడు చీట్లు వేసి కేటాయించే ఆచారాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చీట్లు వేయాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל
  choice: మీద
  rationale: హీబ్రూ విభక్తి యొక్క ‘మీద/పై’ అనే స్థలసంబంధ చిత్రాన్ని నిలుపుతూ, రెండు మేకలకు సంబంధించిన చీట్ల ఆచారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: ఆ రెండు మేకలు
  rationale: పదం సాధారణంగా మగ మేకలను సూచించగలదు; అయితే ఈ ఆచార సందర్భంలో ‘రెండు మేకలు’ సరిపోతుంది, సహజమైన తెలుగును ఇస్తుంది.
- source_word: גּוֹרָלוֹת
  choice: చీట్లు
  rationale: ఆచారపూర్వకంగా ఎంపిక లేదా కేటాయింపు చేయడానికి ఉపయోగించే చీట్లను సూచించే సాధారణ తెలుగు పదం.
- source_word: גּוֹרָל אֶחָד
  choice: ఒక చీటి
  rationale: మూలంలోని ఏకవచన పునరుక్తిని సూటిగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ యొక్క కేటాయింపు భావాన్ని ‘కోసం’తో వ్యక్తం చేసింది.
- source_word: לַעֲזָאזֵל
  choice: అజాజేలు కోసం
  rationale: עֲזָאזֵל అర్థం వివాదాస్పదం. దానిని ప్రధాన వాక్యంలో పేరుగా లిప్యంతరీకరించడం ద్వారా ‘విడిచిపెట్టే మేక’, తొలగింపు, గమ్యస్థానం లేదా వ్యక్తిగత సత్తా అనే వ్యాఖ్యానాల్లో దేనినీ అనవసరంగా ఖరారు చేయకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త దిన ఆచారంలో עֲזָאזֵל అర్థం
  choice: ప్రధాన వాక్యంలో అనువదించకుండా ‘అజాజేలు’ అనే పేరుగా లిప్యంతరీకరణ
  alternative: ‘విడిచిపెట్టే మేక’; ‘పూర్తిగా తొలగించడం’; అరణ్యంతో లేదా మేకతో సంబంధమున్న వ్యక్తిగత/ఆత్మిక సత్తా
  rationale: ఈ పదం మేక యొక్క పాత్రనో, దాని గమ్యస్థానాన్నో, లేక ఒక వ్యక్తిగత సత్తానో సూచిస్తుందా అనేది ఈ వచనం స్పష్టంగా నిర్ణయించదు. లిప్యంతరీకరణ ఈ వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది; చారిత్రకంగా ప్రభావవంతమైన ‘విడిచిపెట్టే మేక’ పఠనాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆచారపరమైన ‘చీట్లు వేయడం’ అనే సాధారణ ప్రయోగాన్ని ఉపయోగించి, వివాదాస్పదమైన ‘అజాజేలు’ను ప్రధాన వాక్యంలో లిప్యంతరీకరించి అస్పష్టతను నిలిపింది.
