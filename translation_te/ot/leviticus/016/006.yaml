id: LEV.16.6
reference: Leviticus 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: te
  text: “అహరోను తన కొరకు ఉన్న పాపపరిహార బలి కోడెను సమర్పించాలి[a]; తన కొరకు, తన ఇంటివారి కొరకు ప్రాయశ్చిత్తం చేయాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి కోడెను.” హెబ్రీ పదం חַטָּאת ‘పాపపరిహార బలి’ని సూచించగలదు; కొన్ని సందర్భాల్లో అది ఆచారపరమైన శుద్ధీకరణను ప్రత్యేకంగా నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: సమర్పించి
  rationale: బలుల సందర్భంలో הקריב అనేది యెహోవా సన్నిధికి బలిని తీసుకొచ్చి సమర్పించడాన్ని సూచిస్తుంది. బలి ప్రక్రియ అంతా అప్పుడే పూర్తయిందని సూచించకుండా ‘సమర్పించి’ సహజంగా ఆ ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: פַּר
  choice: కోడెను
  rationale: פַּר బలిగా అర్పించే మగ పశువును సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు శైలిలో ‘కోడె’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలికి చెందిన
  rationale: బలి నియమాల సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ను కాక, పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సుపరిచితమైన తెలుగు ప్రయోగం; శుద్ధీకరణ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר לוֹ
  choice: తన కొరకు ఉన్న
  rationale: ఈ కోడె ప్రజల బలి కాక అహరోను తన కోసం నియమించుకున్న బలి అని ఈ పదబంధం వేరుచూపుతుంది. ‘తన కొరకు ఉన్న’ అనే రూపం దాని ప్రయోజనాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలో כפר యొక్క ఆచారపరమైన, ధార్మిక బలాన్ని ‘ప్రాయశ్చిత్తం చేయాలి’ నిలుపుతుంది; దాని క్రియావిధానాన్ని హెబ్రీ పాఠం కంటే సంకుచితం చేయదు.
- source_word: בַּעֲדוֹ
  choice: తన కొరకు
  rationale: בְּעַד ఇక్కడ ఒకరి పక్షంగా లేదా ప్రయోజనార్థంగా చేయడాన్ని సూచిస్తుంది. ‘తన కొరకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וּבְעַד בֵּיתוֹ
  choice: తన ఇంటివారి కొరకు
  rationale: בַּיִת ఇక్కడ భవనాన్ని కాక కుటుంబాన్ని లేదా గృహసముదాయాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘ఇంటివారు’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: బలి నియమాలలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: తక్షణ సందర్భం బలి విధానాన్ని వివరిస్తున్నందున ఈ నామవాచకం పాపాన్ని కాక బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సుపరిచితమైన ప్రధాన అనువాదం; ఆచారపరమైన శుద్ధీకరణపై దృష్టిపెట్టే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: בֵּיתוֹ యొక్క పరిధి
  choice: తన ఇంటివారు
  alternative: తన ఇల్లు
  rationale: ఇక్కడ హెబ్రీ పదం భౌతిక గృహం కంటే అహరోను కుటుంబం లేదా గృహసముదాయాన్ని సూచించే అవకాశం బలంగా ఉంది. ‘ఇంటివారు’ ఆ భావాన్ని తరువాతి సిద్ధాంత నిర్ణయాలు చేర్చకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. హెబ్రీ వాక్యంలోని క్రమాన్ని వీలైనంత నిలుపుతూ, విధినిర్దేశక భావాన్ని ‘చేయాలి’తో తెలిపాం. ‘ఇంటివారు’ కుటుంబ/గృహసముదాయ భావాన్ని సహజంగా అందిస్తుంది.
