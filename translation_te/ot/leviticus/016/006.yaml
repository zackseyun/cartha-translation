revisions:
- from: “అహరోను తన కొరకు ఉన్న పాపపరిహార బలికి చెందిన కోడెను సమర్పించి,[a] తన కొరకు, తన ఇంటివారి కొరకు ప్రాయశ్చిత్తం చేయాలి.”
  to: “అహరోను తన కొరకు ఉన్న పాపపరిహార బలి కోడెను సమర్పించాలి[a]; తన కొరకు, తన ఇంటివారి కొరకు ప్రాయశ్చిత్తం చేయాలి.”
  rationale: The revision removes an unnatural possessive-style construction and directly identifies the bull as Aaron’s sin offering. It also renders the two coordinated Hebrew procedural verbs as coordinated Telugu obligations. The lexical alternative and its anchor are retained and placed directly after the sacrificial designation.
  reviewer_model: gpt-5.6-terra
