source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: te
  text: అప్పుడు అహరోను సమావేశ గుడారంలోకి వచ్చి, తాను పరిశుద్ధ స్థలంలోకి[a] ప్రవేశించినప్పుడు ధరించిన నారవస్త్రాలను తీసివేసి, వాటిని అక్కడే ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధ మందిరంలోకి’; ప్రాయశ్చిత్త దినపు విస్తృత సందర్భాన్ని బట్టి కొందరు దీన్ని మరింత నిర్దిష్టంగా ‘అతి పరిశుద్ధ స్థలంలోకి’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: అప్పుడు ... వచ్చి
  rationale: కర్మకాండ సంబంధమైన వరుస ఆదేశాల్లో వావ్‌తో కూడిన కతల్ రూపం తదుపరి చర్యను సూచిస్తుంది. అందువల్ల సహజమైన తెలుగు క్రమాన్ని తెలిపేలా ‘అప్పుడు ... వచ్చి’ అని అనువదించాం.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇది ఇశ్రాయేలు ఆరాధనా గుడారానికి స్థిరమైన బైబిలీయ తెలుగు పదబంధం; మూలంలోని ‘సమావేశ గుడారం’ భావాన్ని గౌరవప్రదంగా, పాఠకులకు పరిచితంగా తెలియజేస్తుంది.
- source_word: וּפָשַׁט
  choice: తీసివేసి
  rationale: వస్త్రాలను విప్పడం లేదా తొలగించడం అనే చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בִּגְדֵי הַבָּד
  choice: నార వస్త్రాలు
  rationale: בגד అంటే వస్త్రం; בד ఇక్కడ నార బట్టను సూచిస్తుంది. ఆచారంలో వస్త్రపు పదార్థానికి ఉన్న ప్రాముఖ్యతను ఈ అనువాదం నిలుపుతుంది.
- source_word: אֲשֶׁר לָבַשׁ
  choice: తాను ధరించిన
  rationale: לבש యొక్క ‘ధరించు/వేసుకొను’ భావాన్ని సంబంధ వాక్యంలో సహజమైన తెలుగుతో తెలియజేస్తుంది.
- source_word: בְּבֹאוֹ
  choice: వెళ్లినప్పుడు
  rationale: בְּతో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. పరిశుద్ధ స్థలంలోకి ప్రవేశించిన సందర్భాన్ని తెలుగులో ‘వెళ్లినప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘పరిశుద్ధమైన [స్థలం]’ అని ఉంది. అంతరాలయంలోని అతి పరిశుద్ధ స్థలమని ప్రధాన పాఠంలో మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: וְהִנִּיחָם שָׁם
  choice: వాటిని అక్కడే ఉంచాలి
  rationale: הניח యొక్క ‘ఉంచు/వదిలివేయు’ భావాన్ని, చర్య ఎలా చేయబడిందో అనవసరంగా నిర్దిష్టం చేయకుండా, స్పష్టమైన ఆదేశ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: הַקֹּדֶשׁ సూచించే స్థలం
  choice: పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ మందిరం; అతి పరిశుద్ధ స్థలం
  rationale: ఈ వచనంలోని హీబ్రూ పదం కేవలం ‘పరిశుద్ధమైన [స్థలం]’ అని చెబుతుంది; అంతరాలయానికి వాడే మరింత సంపూర్ణమైన పదబంధం ఇక్కడ లేదు. కాబట్టి ప్రధాన పాఠం మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపుతుంది; ప్రాయశ్చిత్త దినపు విస్తృత సందర్భం ఆధారంగా మరింత నిర్దిష్టంగా అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కర్మకాండ ఆదేశ శైలిని ఉపయోగించాం. వరుస హీబ్రూ క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘వచ్చి ... తీసివేసి ... ఉంచాలి’ అనే నిర్మాణంలో ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
