  rationale: మూలంలోని אֹהֶל מוֹעֵדను మరింత నేరుగా ప్రతిబింబించేందుకు ‘ప్రత్యక్ష గుడారం’ స్థానంలో ‘సమావేశ గుడారం’ వాడబడింది. సంబంధ వాక్యాన్ని ‘తాను పరిశుద్ధ స్థలంలోకి ప్రవేశించినప్పుడు ధరించిన’గా స్పష్టపరచి, పాదసూచిక గుర్తును సంబంధిత పదం వద్దకు మార్చాం. హీబ్రూలో ఉన్న הַקֹּדֶשׁ యొక్క విస్తృతతను ప్రధాన పాఠంలో అలాగే ఉంచాం.
