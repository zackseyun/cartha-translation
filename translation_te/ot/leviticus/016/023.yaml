    rationale: ‘ప్రత్యక్ష’ అనేది మూల పదబంధంలోని ‘సమావేశం/నియమిత కలయిక’ భావాన్ని నేరుగా తెలియజేయదు మరియు వ్యాఖ్యాత్మక సంప్రదాయ పదప్రయోగాన్ని కలుపుతుంది. ‘సమావేశ గుడారం’ మూలానికి మరింత సమీపంగా, ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
