- from: అప్పుడు అహరోను ప్రత్యక్ష గుడారంలోకి వచ్చి, పరిశుద్ధ స్థలంలోకి వెళ్లినప్పుడు తాను ధరించిన నార వస్త్రాలను తీసివేసి, వాటిని అక్కడే ఉంచాలి.[a]
