source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: te
  text: అహరోను తనకోసం ఉన్న పాపపరిహార బలికి సంబంధించిన ఎద్దును[a] సమర్పించాలి. అతడు తనకోసం, తన ఇంటివారికోసం ప్రాయశ్చిత్తం చేయాలి[b]. తరువాత తనకోసం ఉన్న పాపపరిహార బలికి సంబంధించిన ఎద్దును వధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపపరిహార బలి కోసం ఉన్న ఎద్దును.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘తనకోసం, తన ఇంటికోసం’; ఇక్కడ ‘ఇల్లు’ అంటే అతని ఇంటివారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: సమర్పించి
  rationale: హిఫీల్ రూపంలోని קרב బలిసంబంధ సందర్భంలో దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అని సూచిస్తుంది. తరువాత వధించే చర్య వేరుగా ఉన్నందున, పూర్తి బలి అర్పణను ముందుగానే సూచించకుండా ‘సమర్పించి’ అని అనువదించాం.
- source_word: פַּר הַחַטָּאת
  choice: పాపపరిహార బలికి చెందిన కోడెను
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఇది పాపపరిహార బలిగా నియమించబడిన కోడె అని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר לוֹ
  choice: తన కోసం ఉన్న
  rationale: ఈ ఆచార సందర్భంలో ఇది కేవలం అహరోను సొంతమైన జంతువును కాక, అతని తరఫున లేదా అతని ప్రయోజనం కోసం నియమించబడినదాన్ని సూచిస్తుంది.
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భాల్లో כפר యొక్క స్థిరమైన భావాన్ని తెలియజేస్తుంది; ప్రాయశ్చిత్తం ఎలా కార్యసాధకం అవుతుందనే ప్రత్యేక సిద్ధాంతాన్ని ఇందులో చేర్చదు.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: తన కోసం, తన ఇంటివారి కోసం
  rationale: בעד యొక్క ‘తరఫున/కోసం’ భావాన్నీ, ביתו యొక్క కుటుంబ లేదా గృహసభ్యుల భావాన్నీ ఆధునిక సహజ తెలుగులో అందిస్తుంది.
- source_word: וְשָׁחַט
  choice: తరువాత ... వధించాలి
  rationale: שׁחט బలిపశువును విధిపూర్వకంగా వధించడాన్ని సూచించే సాధారణ పదం. ‘తరువాత’ వాక్యంలోని క్రమాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలిసంబంధ כפר పదప్రయోగం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి; శుద్ధి చేయాలి
  rationale: ‘ప్రాయశ్చిత్తం చేయాలి’ యాజక బలి సందర్భంలోని విస్తృత భావాన్ని నిలుపుతుంది; దానిని కేవలం శుద్ధీకరణకు పరిమితం చేయదు, అలాగే తరువాతి కాలపు ఏ ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్నీ వాక్యంలోకి తీసుకురాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ పాఠంలోని పునరుక్తిని నిలిపి, ఆచార క్రమాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరిచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
