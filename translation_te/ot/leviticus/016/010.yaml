source:
  edition: WLC
  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: te
  text: అయితే అజాజేలు కొరకు చీటి పడిన మేకను సజీవంగా యెహోవా సన్నిధిలో నిలబెట్టాలి; దానిమీద ప్రాయశ్చిత్తం చేసి,[a] దానిని అజాజేలు కొరకు అరణ్యంలోకి పంపివేయాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని కోసం ప్రాయశ్చిత్తం చేసి.”
    reason: lexical_alternative
  - marker: b
    text: “అజాజేలు” అనే హీబ్రూ పదం అర్థం వివాదాస్పదం. అది ఒక పేరు, అరణ్యానికి సంబంధించిన స్థలం లేదా వ్యక్తి, లేక తొలగింపుతో సంబంధమున్న పదం కావచ్చు; సంప్రదాయంగా దీనిని “విడిచిపెట్టే మేక” అని కూడా అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: అయితే ... మేకను
  rationale: ముందటి వచనంలోని మరొక మేకతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది. శָׂעִיר మగ మేకను సూచించగలిగినా, ఆచార సందర్భంలో సహజమైన ‘మేక’ సరిపోతుంది.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: దానిమీద ... చీటి పడిన
  rationale: ఎంపిక కోసం వేసిన చీటి ఆ మేకకు పడిందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲזָאזֵל
  choice: అజాజేలు కోసం
  rationale: עֲזָאזֵל అర్థం వివాదాస్పదం కాబట్టి దానిని వ్యాఖ్యానాత్మకంగా ‘విడిచే మేక’ అని మార్చకుండా లిప్యంతరీకరించి అస్పష్టతను నిలుపుతుంది.
- source_word: יָעֳמַד חַי לִפְנֵי יְהוָה
  choice: సజీవంగా యెహోవా సన్నిధిలో నిలబెట్టాలి
  rationale: హొఫల్ రూపంలోని causative/passive భావాన్ని ‘నిలబెట్టాలి’ నిలుపుతుంది; חַי ఆ మేక బలిగా చంపబడకుండా సజీవంగా ఉండడాన్ని స్పష్టం చేస్తుంది.
- source_word: לְכַפֵּר עָלָיו
  choice: దానిమీద ప్రాయశ్చిత్తం చేసి
  rationale: עַל యొక్క ‘మీద’ భావాన్ని నిలిపి, ప్రాయశ్చిత్తం మేక కోసమా లేక దానిమీద జరిగే ఆచారమా అనే ప్రశ్నను అనవసరంగా పరిష్కరించదు.
- source_word: לְשַׁלַּח אֹתוֹ ... הַמִּדְבָּרָה
  choice: దానిని ... అరణ్యంలోకి పంపివేయాలి
  rationale: పంపివేత భావాన్నీ, దిశను సూచించే הַמִּדְבָּרָה రూపాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עֲזָאזֵל యొక్క అర్థం
  choice: అజాజేలు అని లిప్యంతరీకరణ
  alternative: విడిచిపెట్టే మేక; సంపూర్ణ తొలగింపు; అరణ్య సంబంధ వ్యక్తి లేదా స్థలం
  rationale: పదార్థంపై ఏకాభిప్రాయం లేదు. ప్రధాన పాఠంలో లిప్యంతరీకరణ మూలంలోని ఉద్దేశపూర్వక/చారిత్రక అస్పష్టతను కాపాడుతుంది; సాధ్యమైన భావాలను పాదటిప్పణిలో సూచిస్తుంది.
- issue: לְכַפֵּר עָלָיו యొక్క సంబంధం
  choice: దానిమీద ప్రాయశ్చిత్తం చేసి
  alternative: దాని కోసం ప్రాయశ్చిత్తం చేసి
  rationale: ‘మీద’ అనేది עַל‌కు సమీపమైన రూపం; మేక ప్రాయశ్చిత్తం పొందేదా లేక ఆచారానికి సంబంధించిన సాధనమా అనే దానిని ప్రధాన పాఠం నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆచారభాష వాడబడింది. ‘యెహోవా’ మూలంలోని దైవనామాన్ని ప్రత్యక్షంగా సూచిస్తుంది. అజాజేలు మరియు ప్రాయశ్చిత్త సంబంధమైన నిజమైన అస్పష్టతలు ప్రధాన పాఠం, పాదటిప్పణుల ద్వారా కాపాడబడ్డాయి.
