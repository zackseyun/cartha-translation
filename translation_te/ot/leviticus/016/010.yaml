- from: అయితే అజాజేలు కోసం చీటి పడిన మేకను సజీవంగా యెహోవా సన్నిధిలో నిలబెట్టాలి; దానిమీద ప్రాయశ్చిత్తం చేసి,[a] దానిని అజాజేలు వద్దకు అరణ్యంలోకి పంపివేయాలి.[b]
