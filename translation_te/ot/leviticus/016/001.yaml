id: LEV.16.1
reference: Leviticus 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: te
  text: యాహ్వే సన్నిధికి సమీపించి చనిపోయిన అహరోను ఇద్దరు కుమారుల మరణం తరువాత, యాహ్వే మోషేతో మాట్లాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో మరింత పదశః: “వారు యాహ్వే సన్నిధికి సమీపించడంలో.” దీనిని “వారు యాహ్వే సన్నిధికి సమీపించినప్పుడు” అని కూడా అనువదించవచ్చు.'
    reason: బְּ + క్రియానామ రూపం కాలసంబంధమైన భావాన్ని కలిగి ఉంది; పదశః నిర్మాణంతో పాటు సహజ తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: దైవవాక్య పరిచయ సూత్రంలో דבר అనే క్రియకు సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యనుకరణను తెలుగులో నిలుపుతుంది.
- source_word: אַחֲרֵי מוֹת
  choice: చనిపోయిన తరువాత
  rationale: ‘మరణం తరువాత’ అనే భావాన్ని తెలుగులో సహజమైన క్రియారూపంతో వ్యక్తం చేస్తూ, ఇద్దరి మరణాన్ని ఒకే సంఘటనగా చూపుతుంది.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: అహరోను ఇద్దరు కుమారులు
  rationale: సంఖ్యను, కుటుంబ సంబంధాన్ని స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּקָרְבָתָם
  choice: సమీపించి
  rationale: בְּ + క్రియానామ రూపంలోని కాలసంబంధ భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తూ, ఆరాధనా సన్నిధికి దగ్గరవడమనే భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి
  rationale: దేవుని ఎదుట లేదా ఆయన సన్నిధిలోకి రావడమనే స్థలపరమైన, ఆరాధనాపరమైన రెండు ఛాయలనూ సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיָּמֻתוּ
  choice: చనిపోయిన
  rationale: వారు సమీపించడం తరువాత సంభవించిన మరణాన్ని నేరుగా తెలుపుతుంది; తెలుగు వాక్యనిర్మాణం కోసం తరువాతి ‘తరువాత’తో అనుసంధానించిన క్రియారూపం వాడబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించబడిన ‘యాహ్వే’ ధ్వన్యనుకరణతో ఇచ్చాం.
- issue: కుమారులు సమీపించడం మరియు మరణించడం మధ్య సంబంధం
  choice: సమీపించి చనిపోయిన
  alternative: సమీపించినప్పుడు చనిపోయిన
  rationale: హీబ్రూ పాఠం రెండు చర్యలను వరుసగా ఉంచుతుంది గాని కారణాన్ని స్పష్టంగా చెప్పదు. ‘సమీపించి’ అనే రూపం కారణార్థాన్ని జోడించకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘సన్నిధి’ అనే పదం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని స్థలపరమైన మరియు ఆరాధనాపరమైన భావాలను రెండింటినీ నిలుపుతుంది.
