  source_fidelity: ముసాయిదా మూలంలోని ప్రధాన భావాలను—యాహ్వే మాట్లాడటం, అహరోను ఇద్దరు కుమారుల మరణం, యాహ్వే సన్నిధికి వారి సమీపింపు—నిలుపుతుంది. అయితే ప్రస్తుత పదక్రమంలో ‘చనిపోయిన తరువాత’ అనేది వాక్యసంబంధంలో కొద్దిగా భారంగా ఉంది. ‘కుమారుల మరణం తరువాత’ అని మూలంలోని אַחֲרֵי מוֹת నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబించడం ఉత్తమం.
