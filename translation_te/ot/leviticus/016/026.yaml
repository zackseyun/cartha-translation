revisions:
- from: అజాజేలు[a] దగ్గరకు మేకను పంపివేసే వ్యక్తి తన బట్టలు ఉతుకుకొని, తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి. ఆ తర్వాత అతడు శిబిరంలోకి రావచ్చు.
  to: మేకను అజాజేలుకు[a] పంపివేసే వ్యక్తి తన బట్టలు ఉతుక్కోవాలి, నీటిలో తన శరీరాన్ని కడుక్కోవాలి. ఆ తర్వాత అతడు శిబిరంలోకి రావచ్చు.
  rationale: The revision avoids making a disputed designation into an unambiguous personal destination and more closely reflects the Hebrew requirement of washing in water. It preserves the source’s ritual sequence, the permissive sense of re-entry, and the ambiguity surrounding Azazel.
