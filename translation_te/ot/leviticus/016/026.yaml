id: LEV.16.26
reference: Leviticus 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: te
  text: మేకను అజాజేలుకు[a] పంపివేసే వ్యక్తి తన బట్టలు ఉతుక్కోవాలి, నీటిలో తన శరీరాన్ని కడుక్కోవాలి. ఆ తర్వాత అతడు శిబిరంలోకి రావచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అజాజేలు కొరకు.’ ఈ హీబ్రూ పదం అర్థం వివాదాస్పదం. దీనిని ఒక పేరు లేదా పేరువంటి నిర్దేశంగా అర్థం చేసుకోవచ్చు; లేదా ‘తొలగింపు’ అని, లేక సాధారణంగా ‘విడిచిపెట్టబడే మేక’తో సంబంధం ఉన్న భావంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: పంపివేసే వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హీబ్రూ కృదంతం ఈ బాధ్యత నిర్వర్తించే వ్యక్తిని సూచిస్తుంది. ‘పంపివేసే వ్యక్తి’ పాత్రాధారిత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַשָּׂעִיר
  choice: మేక
  rationale: బలి సందర్భంలో ఇది మగ మేకను సూచించగలిగినా, ముందే తెలిసిన ఆచార సంబంధిత మేకను ఇక్కడ సాధారణంగా ‘మేక’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַעֲזָאזֵל
  choice: అజాజేలు దగ్గరకు
  rationale: ఈ హీబ్రూ పదం అర్థం వివాదాస్పదం. దానిని వివరణాత్మకంగా అనువదించి ఒక అర్థానికే పరిమితం చేయకుండా, పేరులాంటి నిర్దేశంగా లిప్యంతరీకరించాం; దిశను తెలపడానికి ‘దగ్గరకు’ వాడాం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుకుకొని
  rationale: ఇది ఆచారపరమైన శుద్ధిలో సాధారణంగా కనిపించే బట్టలు ఉతికే వ్యక్తీకరణ. తరువాతి చర్యతో సహజంగా అనుసంధానించేందుకు ‘ఉతుకుకొని’ అని ఇచ్చాం.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి
  rationale: בָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా, ఇక్కడ వ్యక్తి శరీరాన్ని సూచిస్తుంది. ‘నీళ్లతో’ అనే మూలపాఠంలోని అంశాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా అనువదించాం.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: కార్యాల కాలక్రమాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేసే సహజమైన తెలుగు రూపం.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: అతడు శిబిరంలోకి రావచ్చు
  rationale: కడుక్కున్న తరువాతే తిరిగి ప్రవేశించడానికి అనుమతి ఉందనే ఆచారపరమైన భావాన్ని ‘రావచ్చు’ తెలియజేస్తుంది; దీనిని మరో ఆజ్ఞగా మార్చదు.
theological_decisions:
- issue: ప్రాయశ్చిత్త దిన ఆచారంలో לַעֲזָאזֵל అనే పదం అర్థం
  choice: పేరులాంటి నిర్దేశంగా ‘అజాజేలు’ అని లిప్యంతరీకరించడం
  alternative: ‘తొలగింపు కోసం,’ ‘విడిచిపెట్టే మేక కోసం,’ లేదా అరణ్య/దుష్టాత్మ సంబంధిత వ్యక్తి దగ్గరకు అని అర్థం చేయడం
  rationale: ఈ పదం పదార్థం, చారిత్రక నేపథ్యం వివాదాస్పదమైనవి. లిప్యంతరీకరణ మూలంలోని అనిశ్చితిని కాపాడి, ఒక ప్రత్యేక మతశాస్త్రీయ వ్యాఖ్యానాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర భాగానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ఆచారపరమైన వరుసను స్పష్టంగా ఉంచుతూ, వివాదాస్పదమైన ‘అజాజేలు’ పదాన్ని ప్రధాన పాఠంలో వివరణతో పరిమితం చేయలేదు.
