  source_fidelity: హీబ్రూ వాక్యంలోని కర్త (‘వాటిని కాల్చేవాడు’), వస్త్రాలు ఉతకడం, నీటితో శరీరాన్ని కడుక్కోవడం, ఆ తరువాత శిబిరంలోకి ప్రవేశం అనే క్రమం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘రావచ్చు’ అనేది సందర్భానుగుణమైన అనుమతి/పునఃప్రవేశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ సాధారణ భవిష్యత్ పఠనాన్ని పాదటిప్పణి సరిగా తెలియజేస్తుంది.
