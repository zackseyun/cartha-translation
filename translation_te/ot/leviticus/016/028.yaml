  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/ם יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: te
  text: వాటిని కాల్చేవాడు తన బట్టలు ఉతుక్కొని, తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి. ఆ తర్వాత అతడు శిబిరంలోకి రావచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు శిబిరంలోకి వస్తాడు.” హీబ్రూ క్రియను సాధారణ భవిష్యత్తుగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ శుద్ధీకరణ తర్వాత తిరిగి ప్రవేశించడానికి అనుమతి అనే భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף אֹתָם
  choice: వాటిని కాల్చేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం, ముందటి వచనంలో పేర్కొన్న ఎద్దు మరియు మేక అవశేషాలను కాల్చే వ్యక్తిని సూచిస్తుంది. ఈ రూపం ఆ వ్యక్తి పాత్రను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కొని
  rationale: కర్మకాండ సంబంధమైన ఆదేశ భావాన్ని తెలుగులో సహజమైన వరుస క్రియారూపంతో వ్యక్తం చేస్తుంది. ‘బట్టలు’ ఆధునిక సాధారణ తెలుగు; ‘వస్త్రాలు’ కంటే సులభంగా అర్థమవుతుంది.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: తన శరీరాన్ని నీళ్లతో కడుక్కోవాలి
  rationale: בשר అక్షరార్థంగా ‘మాంసం’ అయినా, ఈ శుద్ధీకరణ స్నాన ప్రయోగంలో మొత్తం శరీరాన్ని సూచిస్తుంది. בַּמַּיִםను సహజ తెలుగు ప్రయోగానికి అనుగుణంగా ‘నీళ్లతో’ అని అనువదించాం.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: శుద్ధీకరణ చర్యలు పూర్తయిన తరువాత జరిగే క్రమాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: అతడు శిబిరంలోకి రావచ్చు
  rationale: ఈ సందర్భంలో శుద్ధీకరణ అనంతరం తిరిగి ప్రవేశించడానికి లభించే అనుమతిని సూచిస్తుంది. ‘శిబిరంలోకి’ అనేది రావడం యొక్క గమ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని కర్మకాండ శుద్ధి భావం
  choice: 'శుద్ధీకరణ తర్వాత శిబిరంలోకి తిరిగి రావడానికి అనుమతి: ‘రావచ్చు’'
  alternative: 'సాధారణ భవిష్యత్తు లేదా విధ్యర్థకం: ‘వస్తాడు’ / ‘రావాలి’'
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం సాధారణ భవిష్యత్తుగా కూడా గ్రహించవచ్చు. అయితే సందర్భంలోని కర్మకాండ క్రమం, అవసరమైన కడుగుదల తర్వాతే శిబిర ప్రవేశం అనుమతించబడుతుందని సూచిస్తుంది; అందువల్ల అనుమతి భావాన్ని ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శరీరం’ ద్వారా హీబ్రూ ‘మాంసం’ అనే పదంలోని సందర్భానుగుణ భావాన్ని తెలిపాం; దీనికి ప్రత్యేక పాదటిప్పణి అవసరం లేదని నిర్ణయించాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
