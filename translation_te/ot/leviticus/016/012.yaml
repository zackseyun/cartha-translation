id: LEV.16.12
reference: Leviticus 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: te
  text: అతడు యాహ్వే సన్నిధిలో ఉన్న బలిపీఠం మీద నుంచి ధూపపాత్ర నిండా మండుతున్న బొగ్గులను, రెండు దోసిళ్ల నిండా సన్నగా నూరిన సుగంధ ధూపద్రవ్యాన్ని తీసుకొని, వాటిని తెర లోపలికి[a] తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తెర వెనుకకు.’ ఈ హీబ్రూ ప్రయోగం తెర వెనుకనున్న అంతర్గత పరిశుద్ధ స్థలంలోకి తీసుకురావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తీసుకొని … తీసుకురావాలి
  rationale: ఆచార విధానాన్ని నిర్దేశించే సందర్భంలో ఈ క్రియకు విధ్యర్థక భావం ఉంది; తెలుగులో సహజమైన క్రమబద్ధ వాక్యంగా వ్యక్తీకరించబడింది.
- source_word: מְלֹא הַמַּחְתָּה
  choice: ధూపపాత్ర నిండా
  rationale: ‘పాత్ర యొక్క నిండుదనం’ అనే హీబ్రూ పరిమాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גַּחֲלֵי אֵשׁ
  choice: మండుతున్న నిప్పుకణికలు
  rationale: అగ్నితో మండే బొగ్గులు లేదా నిప్పుకణికలు అనే ఆచార సంబంధ అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో ఉన్న బలిపీఠం మీద నుంచి
  rationale: నిప్పుకణికలు బలిపీఠం మీద నుంచి తీసుకోవాలనే స్థల వివరాన్నీ, ఆ బలిపీఠం యాహ్వే సన్నిధిలో ఉందనే సంబంధాన్నీ కాపాడుతుంది.
- source_word: וּמְלֹא חָפְנָיו
  choice: రెండు దోసిళ్ల నిండా
  rationale: ద్వివచన రూపం సూచించే రెండు చేతుల పరిమాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: మెత్తగా పొడి చేసిన సుగంధ ధూపద్రవ్యం
  rationale: సుగంధ పదార్థాలతో చేసిన ధూపాన్నీ, అది సన్నగా నూరబడినదనే ఆచార వివరాన్నీ రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: తెర లోపలికి
  rationale: ఈ సంక్షిప్త హీబ్రూ ప్రయోగం తెర వెనుకనున్న అంతర్గత పరిశుద్ధ స్థలంలోకి వెళ్లడాన్ని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతూ, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: తెరకు సంబంధించిన దిశార్థం
  choice: తెర లోపలికి
  alternative: తెర అవతలికి; తెర వెనుకకు
  rationale: సందర్భం అంతరాలయంలోకి ప్రవేశాన్ని సూచిస్తుంది; అయితే హీబ్రూ ప్రయోగంలోని సంక్షిప్తతను పూర్తిగా విస్తరించకుండా ప్రధాన పాఠంలో సహజంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆచార-నిర్దేశక శైలిని ఉపయోగించాం. ‘రెండు దోసిళ్ల నిండా’ అనే ప్రయోగం హీబ్రూ ద్వివచన పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
