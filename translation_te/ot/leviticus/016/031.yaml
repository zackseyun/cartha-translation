revisions:
- from: అది మీకు సంపూర్ణ విశ్రాంతి గల విశ్రాంతిదినం. మీరు మిమ్మల్ని మీరు తగ్గించుకోవాలి[a]. ఇది శాశ్వతమైన శాసనం.
  to: ఇది మీకు సంపూర్ణ విశ్రాంతి సబ్బాతు; మీరు మిమ్మల్ని మీరు దీనపరచుకోవాలి[a]. ఇది శాశ్వత నియమం.
  rationale: The revision retains the Hebrew’s intensified ‘Sabbath of complete rest,’ preserves Sabbath as a technical designation, and replaces an inaccurate Telugu expression for ritual humbling with one that conveys self-denial without imposing fasting as the sole meaning. The footnote preserves the more literal alternative and the traditional association with fasting.
  reviewer_model: gpt-5.6-terra
