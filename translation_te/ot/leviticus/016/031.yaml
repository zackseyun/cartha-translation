id: LEV.16.31
reference: Leviticus 16:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: te
  text: ఇది మీకు సంపూర్ణ విశ్రాంతి సబ్బాతు; మీరు మిమ్మల్ని మీరు దీనపరచుకోవాలి[a]. ఇది శాశ్వత నియమం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు బాధపరచుకోవాలి’; ఇది సంప్రదాయంగా ఉపవాసం ఉండడం, స్వీయనిగ్రహం పాటించడం కూడా సూచిస్తుందని అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: విశ్రాంతిదినం
  rationale: తోరాలో ఇది స్థిరమైన ఆరాధనా-ధార్మిక పదం; కేవలం సాధారణ విశ్రాంతిని సూచించదు. ఆధునిక తెలుగు పాఠకుడికి అర్థమయ్యేలా ‘విశ్రాంతిదినం’ అని అనువదించాం.
- source_word: שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి
  rationale: שַׁבַּת שַׁבָּתוֹן అనే బలవర్థక పదబంధంలోని సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִיא לָכֶם
  choice: అది మీకు
  rationale: సమాజాన్ని ఉద్దేశించిన హెబ్రీయ సమాస వాక్యాన్ని సహజమైన తెలుగు విధేయ వాక్యంగా నిలిపింది.
- source_word: וְעִנִּיתֶם
  choice: మీరు మిమ్మల్ని మీరు తగ్గించుకోవాలి
  rationale: ప్రాయశ్చిత్త దిన సందర్భంలో ఈ పీయేల్ రూపం స్వీయనిగ్రహం, దీనత్వం అనే విస్తృత భావాన్ని ఇస్తుంది; శారీరక హింసను సూచించే అపార్థాన్ని నివారిస్తూ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు
  rationale: ఇక్కడ נֶפֶשׁ ప్రతిబింబార్థక నుడికారంలో ఉంది. ‘మీ ఆత్మలను’ అనే అతి అక్షరార్థ అనువాదం కలిగించే అపార్థాన్ని నివారించేందుకు సహజమైన తెలుగు రూపం వాడాం.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: నిరంతరంగా అమలులో ఉండే న్యాయవిధిని సూచించే హెబ్రీయ శాసన సూత్రాన్ని గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త దినాన స్వీయనిగ్రహ ఆజ్ఞ యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘మీరు మిమ్మల్ని మీరు తగ్గించుకోవాలి’ అనే విస్తృత పదప్రయోగం
  alternative: ‘మిమ్మల్ని మీరు బాధించుకోవాలి’ లేదా ‘ఉపవాసం ఉండాలి’
  rationale: హెబ్రీ మూలం ענה + נפשׁ అనే విస్తృత నుడికారాన్ని ఉపయోగిస్తుంది; అది సంప్రదాయంగా ఉపవాసం, స్వీయనిగ్రహంతో సంబంధం ఉన్నప్పటికీ నేరుగా ‘ఉపవాసం ఉండడం’ అనే క్రియను ఉపయోగించదు. అందువల్ల ప్రధాన పాఠ్యంలో భావాన్ని అనవసరంగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘విశ్రాంతిదినం’ తోరా సంబంధిత స్థిర పదాన్ని నిలుపుతుంది; ‘సంపూర్ణ విశ్రాంతి’ హెబ్రీయ బలవర్థక పునరుక్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
