review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal clauses, but ‘విశ్రాంతిదినం’ loses the fixed cultic designation ‘Sabbath,’ and ‘మిమ్మల్ని మీరు తగ్గించుకోవాలి’ normally means reducing oneself rather than the Hebrew ritual idiom of humbling/self-denial.
  naturalness: The revised wording is idiomatic modern standard Telugu while retaining a suitably formal biblical register. ‘దీనపరచుకోవాలి’ clearly expresses voluntary humbling/self-denial without narrowing the command to fasting.
  terminology: ‘సబ్బాతు’ preserves the Torah’s established technical term. ‘శాశ్వత నియమం’ is a natural and faithful rendering of the enduring statutory formula חֻקַּת עוֹלָם.
  issues:
  - severity: medium
    issue: The cultic term Sabbath is rendered only as ‘విశ్రాంతిదినం.’
    rationale: שַׁבַּת is not merely a generic rest day in this context; retaining ‘సబ్బాతు’ preserves its fixed Torah designation and its relationship to the intensified following term.
  - severity: high
    issue: ‘మిమ్మల్ని మీరు తగ్గించుకోవాలి’ does not adequately render the self-affliction/humbling idiom.
    rationale: In modern Telugu it commonly suggests making oneself smaller or reducing oneself, rather than ritual self-denial or humbling. ‘మిమ్మల్ని మీరు దీనపరచుకోవాలి’ better retains the Hebrew idiom’s breadth.
  - severity: low
    issue: ‘శాసనం’ is less idiomatic here than ‘నియమం.’
    rationale: The Hebrew is a fixed legal-ritual formula; ‘శాశ్వత నియమం’ is clear modern Telugu and preserves its statutory force.
  revised_text: ఇది మీకు సంపూర్ణ విశ్రాంతి సబ్బాతు; మీరు మిమ్మల్ని మీరు దీనపరచుకోవాలి[a]. ఇది శాశ్వత నియమం.
