id: LEV.16.24
reference: Leviticus 16:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: te
  text: అతడు పవిత్రమైన స్థలంలో[a] తన శరీరాన్ని[b] నీళ్లతో కడుగుకొని, తన వస్త్రాలు ధరించాలి. తరువాత బయటికి వచ్చి, తన దహనబలిని, ప్రజల దహనబలిని అర్పించి, తన కోసం, ప్రజల కోసం ప్రాయశ్చిత్తం చేయాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఒక పవిత్రమైన స్థలంలో’; ఇది తప్పనిసరిగా గుడారంలోని ‘పరిశుద్ధ స్థలం’ అనే ప్రత్యేక గదిని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన మాంసాన్ని.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పాపపరిహారం చేయాలి’; కొన్ని ఆచార సందర్భాల్లో ‘శుద్ధి చేయాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: కడుగుకొని
  rationale: న్యాయవిధుల క్రమంలో ఉన్న ఈ క్రియ ఆచరించవలసిన తదుపరి చర్యను సూచిస్తుంది; తెలుగులో సంయుక్త క్రియారూపం చర్యల వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: בְּשָׂרוֹ
  choice: తన శరీరాన్ని
  rationale: మూలంలో అక్షరార్థంగా ‘తన మాంసాన్ని’ ఉన్నా, ఆచారసంబంధ స్నానం సందర్భంలో ‘శరీరం’ ఆధునిక తెలుగులో సహజంగా భౌతిక దేహాన్ని సూచిస్తుంది.
- source_word: בַּמַּיִם
  choice: నీళ్లతో
  rationale: רחץతో వచ్చినప్పుడు సాధనార్థక భావాన్ని ఆధునిక తెలుగులో ‘నీళ్లతో కడుగు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: పవిత్రమైన స్థలంలో
  rationale: מקוםకు నిర్దిష్ట ఉపపదం లేదు; కాబట్టి ప్రత్యేకంగా పరిశుద్ధస్థలంలోని గదిని సూచించేలా కాక, ‘ఒక పవిత్రమైన స్థలం’ అనే అనిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: తన వస్త్రాలు ధరించాలి
  rationale: ‘వస్త్రాలు’ ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְיָצָא
  choice: బయటికి వచ్చి
  rationale: పవిత్రమైన స్థలం నుంచి వెలుపలికి కదలికను సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעָשָׂה
  choice: అర్పించి
  rationale: దహనబలులు కర్మవస్తువులుగా ఉన్నందున, అక్షరార్థమైన ‘చేసి’ కంటే బలిసంబంధ తెలుగులో ‘అర్పించి’ సహజమైనది.
- source_word: עֹלָתוֹ / עֹלַת הָעָם
  choice: తన దహనబలిని, ప్రజల దహనబలిని
  rationale: עלהకు ఆచారసంబంధంగా స్థిరమైన ‘దహనబలి’ వాడి, రెండు పదబంధాల సమాంతర నిర్మాణాన్ని కాపాడింది.
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలిక్రియ సందర్భంలో విస్తృతమైన సమాధానపరచే భావాన్ని నిలుపుతుంది; ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి పదాన్ని పరిమితం చేయదు.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: తన కోసం, ప్రజల కోసం
  rationale: ప్రతినిధిగా వారి పక్షాన జరిగే క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: లేవీయ బలివిధానంలో כפר అర్థం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పాపపరిహారం చేయాలి; శుద్ధి చేయాలి
  rationale: ఈ వచనంలో వ్యక్తుల కోసం జరిగే యాజక బలిక్రియ ప్రధానంగా ఉంది. ‘ప్రాయశ్చిత్తం’ పదం స్థిరమైన, విస్తృతమైన అర్థాన్ని ఇస్తుంది; ‘శుద్ధి’ అనే అనువాదం కొన్ని ఆచార సందర్భాల్లో సాధ్యమైనా, ఇక్కడ భావాన్ని అనవసరంగా కుదించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆచారపరమైన శైలి వాడబడింది. ‘కడుగుకొని… ధరించాలి; తరువాత… అర్పించి… చేయాలి’ అనే నిర్మాణం హెబ్రీ న్యాయవిధి క్రమాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
