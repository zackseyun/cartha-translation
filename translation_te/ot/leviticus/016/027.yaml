source:
  edition: WLC
  text: וְ/אֵת֩ פַּ֨ר הַֽ/חַטָּ֜את וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת דָּמָ/ם֙ לְ/כַפֵּ֣ר בַּ/קֹּ֔דֶשׁ יוֹצִ֖יא אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֑ה וְ/שָׂרְפ֣וּ בָ/אֵ֔שׁ אֶת עֹרֹתָ֥/ם וְ/אֶת בְּשָׂרָ֖/ם וְ/אֶת פִּרְשָֽׁ/ם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: te
  text: పరిశుద్ధ స్థలంలో ప్రాయశ్చిత్తం చేయడానికి పాపపరిహార బలి ఎద్దు రక్తాన్నీ, పాపపరిహార బలి మేకపోతు రక్తాన్నీ లోపలికి తీసుకువచ్చారో, ఆ ఎద్దును, మేకపోతును అతడు శిబిరం వెలుపలికి తీసుకెళ్లాలి; వాటి చర్మాలను, మాంసాన్ని, పేడను వారు[a] అగ్నిలో కాల్చివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘అతడు తీసుకెళ్లాలి’ అనే ఏకవచనం నుంచి ‘వారు కాల్చివేయాలి’ అనే బహువచనానికి మార్పు ఉంది.
    reason: మూలంలోని సంఖ్య మార్పును పాఠకుడికి స్పష్టం చేయడం
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: పాపపరిహార బలి కోడె
  rationale: חַטָּאת అనే బలి వర్గాన్ని సాధారణ పాఠకులకు పరిచితమైన ‘పాపపరిహార బలి’గా, פַּרను ‘కోడె’గా సహజమైన తెలుగు పదక్రమంలో అందించింది.
- source_word: שְׂעִיר הַחַטָּאת
  choice: పాపపరిహార బలి మేక
  rationale: ముందున్న బలి పదబంధానికి సమాంతరంగా ఉంది; שְׂעִירను సందర్భానుసారంగా ‘మేక’గా అనువదించింది.
- source_word: הוּבָא אֶת־דָּמָם
  choice: రక్తాన్నీ ... లోపలికి తీసుకువచ్చారో
  rationale: בוא హోఫాల్ రూపంలోని నిష్క్రియ భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త రూపంతో వ్యక్తం చేసింది; సందర్భంలోని దిశను ‘లోపలికి’ తెలియజేస్తుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: బలి ఆచార సందర్భంలో כפר యొక్క పరిహార కార్యాన్ని స్థిరమైన, అర్థమయ్యే తెలుగు ఆచార పదంతో తెలియజేస్తుంది; దాని విధానాన్ని మరింత సంకుచితంగా నిర్వచించదు.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: ఇక్కడ קֹדֶשׁ ఒక పవిత్ర ప్రదేశాన్ని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ మూలంలోని స్థలార్థాన్ని కాపాడుతుంది.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: అతడు శిబిరం బయటికి తీసుకెళ్లాలి
  rationale: יצא హిఫీల్ యొక్క కారణార్థాన్ని, అֶל־מִחוּץ యొక్క దిశార్థాన్ని సహజ తెలుగు ప్రయోగంలో కలిపి అందిస్తుంది.
- source_word: עֹרֹתָם
  choice: వాటి చర్మాలను
  rationale: జంతువుల బయటి చర్మాలకు తెలుగు పాఠకులకు స్పష్టమైన సాధారణ పదం.
- source_word: בְּשָׂרָם
  choice: మాంసాన్ని
  rationale: జంతు దేహంలోని మాంస భాగాన్ని ఈ సందర్భంలో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: פִּרְשָׁם
  choice: పేడను
  rationale: ఈ పదం జంతువుల విసర్జిత పదార్థాన్ని సూచిస్తుంది; ‘పేడ’ నేరుగా, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: వారు అగ్నిలో కాల్చివేయాలి
  rationale: బహువచన క్రియను నిలుపుతూ, בָאֵשׁను సహజ తెలుగులో ‘అగ్నిలో’గా అందించింది.
theological_decisions:
- issue: חַטָּאת అనే బలి పదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదానికి శుద్ధీకరణ భావం ఉండవచ్చన్న చర్చ ఉన్నప్పటికీ, పాపంతో సంబంధం కలిగిన ఈ స్థిరమైన బలి వర్గాన్ని సాధారణ పాఠకులకు గుర్తుపట్టదగిన రీతిలో అందిస్తుంది; ప్రత్యేక సిద్ధాంత వివరణను వాక్యంలోకి చేర్చదు.
- issue: כפר యొక్క ఆచారార్థం
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: శుద్ధి చేయడం
  rationale: పరిహారం, శుద్ధీకరణ వంటి భావాల మధ్య ఉన్న విస్తృతిని పూర్తిగా ఒకే వివరణకు పరిమితం చేయకుండా, తెలుగు బైబిలు-ఆచార భాషలో స్థిరమైన పదాన్ని ఉపయోగిస్తుంది.
- issue: יוֹצִיא అనే ఏకవచనం తరువాత וְשָׂרְפוּ అనే బహువచనం
  choice: ‘అతడు ... తీసుకెళ్లాలి; ... వారు కాల్చివేయాలి’ అని సంఖ్య మార్పును నిలుపడం
  alternative: రెండు క్రియలకూ ఒకే కర్తను పెట్టడం
  rationale: మూలంలోని ఏకవచన-బహువచన మార్పును సరిచేయకుండా నిలుపుతుంది; ఇది ప్రధాన నిర్వాహకుడు మరియు సహాయకుల మధ్య భేదాన్ని సూచించవచ్చు, కాని వచనం దాన్ని స్పష్టంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడింది. దీర్ఘమైన హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధ వాక్యంగా మార్చినా, రక్తం లోపలికి తీసుకురావడం, శిబిరం బయటికి తీసుకెళ్లడం, అనంతరం దహనం చేయడం అనే క్రమాన్ని అలాగే ఉంచింది.
