  to: పరిశుద్ధ స్థలంలో ప్రాయశ్చిత్తం చేయడానికి పాపపరిహార బలి ఎద్దు రక్తాన్నీ, పాపపరిహార బలి మేకపోతు రక్తాన్నీ లోపలికి తీసుకువచ్చారో, ఆ ఎద్దును, మేకపోతును అతడు శిబిరం వెలుపలికి తీసుకెళ్లాలి; వాటి చర్మాలను, మాంసాన్ని, పేడను వారు[a] అగ్నిలో కాల్చివేయాలి.
