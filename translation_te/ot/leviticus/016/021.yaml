source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: te
  text: అహరోను సజీవంగా ఉన్న ఆ మేక తలపై తన రెండు చేతులూ ఉంచి, ఆ మేకపై ఇశ్రాయేలు కుమారుల[a] దోషాలన్నిటినీ, వారి అతిక్రమాలన్నిటినీ, వారి పాపాలన్నిటినీ ఒప్పుకొని, వాటిని ఆ మేక తలపై ఉంచి, ఆ పని కోసం నియమించబడిన ఒక వ్యక్తి[b] చేత దానిని అరణ్యంలోకి పంపించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఈ మాట ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ పని కోసం సిద్ధంగా ఉన్న వ్యక్తి,’ ‘ఆ సందర్భానికి తగిన వ్యక్తి.’ ఈ హీబ్రూ పదం క్లిష్టమైనది; అది సిద్ధతను, నియామకాన్ని లేదా సందర్భానికి తగిన యోగ్యతను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ఉంచి
  rationale: బలి ఆచార సందర్భంలో סמך చేతులను అర్పణపై ఉంచే ఆచార చర్యను సూచిస్తుంది; తెలుగులో ‘ఉంచి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁתֵּי יָדוֹ
  choice: తన రెండు చేతులూ
  rationale: ద్వివచన భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַשָּׂעִיר הַחַי
  choice: సజీవంగా ఉన్న మేక
  rationale: ప్రాయశ్చిత్త దినపు ఆచారంలో బతికివున్న మేకను గుర్తిస్తుంది; ‘సజీవంగా ఉన్న’ అనే రూపం సహజంగా ఉంది.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: దాని మీద ఒప్పుకోవాలి
  rationale: వ్యక్తీకరించిన పాపాలను ఆ మేక మీద ఆచారపూర్వకంగా ఒప్పుకోవడాన్ని మూలంలోని עַל సంబంధంతో సహా నిలుపుతుంది.
- source_word: עֲוֺנֹת
  choice: దోషాలు
  rationale: నైతిక వక్రత, అపరాధభారం అనే భావాలను మోసే పదంగా, మిగతా రెండు పాపపదాల నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పుత్రసంబంధ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదటీపులో వివరిస్తుంది.
- source_word: פִּשְׁעֵיהֶם
  choice: వారి అతిక్రమాలు
  rationale: హద్దుమీరడం, తిరుగుబాటు అనే פֶּשַׁע భావాన్ని తెలిపి, ‘దోషాలు,’ ‘పాపాలు’ నుంచి పదభేదాన్ని కాపాడుతుంది.
- source_word: לְכָל חַטֹּאתָם
  choice: వారి పాపాలన్నీ
  rationale: సందర్భంలో మూడు పాపవర్గాల సమగ్ర జాబితాను సహజమైన తెలుగులో అందిస్తుంది; לְ యొక్క ఖచ్చిత సంబంధంలో ఉన్న అస్పష్టతను కృత్రిమంగా సిద్ధాంతీకరించదు.
- source_word: וְנָתַן אֹתָם
  choice: వాటిని ... ఉంచి
  rationale: ఒప్పుకున్న దోషాలు, అతిక్రమాలు, పాపాలను మేక తలపై ఆచారపూర్వకంగా ఉంచడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְשִׁלַּח
  choice: పంపించాలి
  rationale: బయటకు పంపివేయడం అనే చర్యను ‘విడిచిపెట్టాలి’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: ఆ పని కోసం నియమించబడిన ఒక వ్యక్తి చేత
  rationale: בְּיַד అనే కర్తృత్వ ప్రయోగాన్ని ‘చేత’తో తెలియజేస్తుంది; క్లిష్టమైన עִתִּי పదాన్ని సందర్భానుసారం నియమించబడిన వ్యక్తిగా ప్రధాన పాఠ్యంలో ఇస్తూ ప్రత్యామ్నాయ భావాలను పాదటీపులో ఉంచుతుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యంలోకి
  rationale: దిశను సూచించే ప్రత్యయాన్ని ‘లోకి’తో నిలుపుతుంది; అరణ్యప్రాంతాన్ని అనవసరంగా ఇసుక ఎడారికి పరిమితం చేయదు.
theological_decisions:
- issue: మూడు పాపసంబంధ పదాలను వేర్వేరుగా అనువదించడం
  choice: దోషాలు / అతిక్రమాలు / పాపాలు
  alternative: అపరాధాలు / తిరుగుబాట్లు / పాపాలు
  rationale: עֲוֺנֹת, פִּשְׁעִים, חַטֹּאות అనే సమీపార్థక పదాల వరుస ఇశ్రాయేలు పాపం యొక్క సంపూర్ణతను నొక్కిచెబుతుంది. వాటన్నిటినీ ఒకే పదంగా చేయకుండా భేదాన్ని నిలిపింది.
- issue: בְּנֵי יִשְׂרָאֵל లోని పుత్రసంబంధ రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడింది; అయితే ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే విషయాన్ని పాదటీపు స్పష్టం చేస్తుంది.
- issue: עִתִּי అనే క్లిష్ట విశేషణం యొక్క భావం
  choice: ఆ పని కోసం నియమించబడిన
  alternative: ఆ పని కోసం సిద్ధంగా ఉన్న / ఆ సందర్భానికి తగిన
  rationale: సందర్భానికి తగిన కార్యనియామక భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా తెలియజేస్తూ, మూలపదంలోని సిద్ధత, నియామకం, అనుకూలత అనే అవకాశాలను పాదటీపులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూప శైలిని ఉపయోగించింది. బలి ఆచారపు స్పష్టతను కాపాడుతూ అతిగా సంస్కృతీకృత పదజాలాన్ని నివారించింది. పాదటీపు గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
