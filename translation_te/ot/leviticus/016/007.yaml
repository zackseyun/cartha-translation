revisions:
- from: తర్వాత అతడు ఆ రెండు మేకపోతులను తీసుకొని, సమావేశ గుడారం ప్రవేశద్వారం దగ్గర యహ్వే సన్నిధిలో వాటిని నిలబెట్టాలి.
  to: అతడు ఆ రెండు మేకపోతులను తీసుకొని, సమాగమపు గుడారం ప్రవేశద్వారం వద్ద యహ్వే సన్నిధిలో వాటిని నిలబెట్టాలి.
