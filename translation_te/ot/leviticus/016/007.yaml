id: LEV.16.7
reference: Leviticus 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: te
  text: అతడు ఆ రెండు మేకపోతులను తీసుకొని, సమాగమపు గుడారం ప్రవేశద్వారం వద్ద యహ్వే సన్నిధిలో వాటిని నిలబెట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత అతడు ... తీసుకొని
  rationale: ఆచార విధానాన్ని వరుసగా తెలిపే సందర్భంలో సంయోజకంతో వచ్చిన క్రియ తదుపరి చర్యను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో దానిని ‘తర్వాత ... తీసుకొని’ అని వ్యక్తం చేశాం.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: ఆ రెండు మేకపోతులను
  rationale: שָׂעִיר ఇక్కడ మగ మేకను సూచిస్తుంది. ‘మేకపోతులు’ మూలంలోని లింగవిశిష్టతను సహజంగా నిలుపుతుంది; నిర్దిష్ట సూచనను ‘ఆ’ తెలియజేస్తుంది.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: వాటిని నిలబెట్టాలి
  rationale: עמד హిఫీల్ రూపానికి ‘నిలబడేలా చేయడం, నిలబెట్టడం’ అనే భౌతిక భావం ఉంది. ‘సమర్పించాలి’ అనే మరింత వ్యాఖ్యానాత్మక పదం కన్నా ఇది ఆ క్రియను నేరుగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనేది ‘ఎదుట, సన్నిధిలో’ అనే స్థలసంబంధ భావాన్ని ఇస్తుంది. ఇక్కడ దేవుని నామం יְהוָהను ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే ప్రవేశస్థలం లేదా ద్వారం; אֹהֶל מוֹעֵד అంటే కలుసుకోవడానికి నియమించబడిన గుడారం. ‘సమావేశ గుడారం’ మూలపదబంధాన్ని ఆలయ సంబంధమైన తరువాతి పదజాలంతో భర్తీ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సన్నిహితమైన ‘యహ్వే’గా ఇచ్చాం.
- issue: לִפְנֵי అనే పదబంధంలోని స్థలసంబంధ మరియు ఆరాధనా భావం
  choice: యహ్వే సన్నిధిలో
  alternative: యహ్వే ఎదుట
  rationale: ‘సన్నిధిలో’ అనే పదం మేకపోతులను దేవుని సమక్షంలో నిలబెట్టే స్థలసంబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దీనిని బలి అర్పణ పూర్తయినట్లు అధికంగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆచార విధానానికి తగిన గంభీరతను ఉంచుతూ, సాధారణ ఆధునిక తెలుగు వాక్యనిర్మాణాన్ని వాడాం. ‘మేకపోతులు,’ ‘నిలబెట్టాలి,’ ‘ప్రవేశద్వారం’ వంటి స్పష్టమైన పదాలు మూలంలోని భౌతిక చర్యను నిలుపుతాయి.
