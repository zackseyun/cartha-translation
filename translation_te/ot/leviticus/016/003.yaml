id: LEV.16.3
reference: Leviticus 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: te
  text: '“ఈ విధంగా అహరోను పరిశుద్ధ స్థలంలోకి ప్రవేశించాలి: పాపపరిహార బలిగా మందలోని ఒక ఎద్దుతోను, దహనబలిగా ఒక పొట్టేలుతోను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: ఈ విధంగా
  rationale: בְּזֹאת ఇక్కడ సాధనం లేదా విధానాన్ని సూచిస్తుంది. తరువాత పేర్కొన్న బలులతో అహరోను ఎలా ప్రవేశించాలో తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: יָבֹא
  choice: ప్రవేశించాలి
  rationale: ధర్మశాస్త్ర ఆదేశ సందర్భంలో imperfect రూపం నియమాత్మక భావాన్ని కలిగిస్తుంది; ‘ప్రవేశించాలి’ ఆ నిర్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలోకి
  rationale: ప్రాయశ్చిత్త దిన సందర్భంలో הַקֹּדֶשׁ అహరోను ప్రవేశించే పవిత్ర అంతర్గత స్థలాన్ని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ విస్తృతమైన ‘పరిశుద్ధస్థలం/ఆలయం’ కంటే ఈ స్థలసూచనను కాపాడుతుంది.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: మందలోని ఒక కోడెను
  rationale: ‘ఎద్దు, పశువుల కుమారుడు’ అనే హెబ్రీ నుడికారానికి సహజమైన తెలుగు రూపం. פַר ఇక్కడ బలికి తెచ్చే మగ పశువును సూచిస్తుంది; ‘కోడె’ ఆధునిక తెలుగులో తగిన ఎంపిక.
- source_word: לְ/חַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: బలుల సందర్భంలో חַטָּאתకు స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు సమానం. ఆచారపరమైన శుద్ధీకరణ భావాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: וְ/אַיִל
  choice: ఒక పొట్టేలును
  rationale: אַיִל అంటే మగ గొర్రె; ‘పొట్టేలు’ సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: לְ/עֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహించబడే బలికి వాడే ప్రామాణిక బలిపదం; ‘దహనబలి’ దాని భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలుల ధర్మశాస్త్రంలో חַטָּאת పదార్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధాన్ని, ఆచారపరమైన శుద్ధీకరణ కార్యాన్ని రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో పరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చి ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని సాధనం/విధాన భావాన్ని ‘ఈ విధంగా’తో, ఆదేశ భావాన్ని ‘ప్రవేశించాలి’తో వ్యక్తం చేశాం. తెలుగులో సహజమైన వాక్యక్రమం కోసం ‘తీసుకొని రావాలి’ని చివర చేర్చాం; ఇది בְּ (‘తో’) సూచించే సహచర బలి సామగ్రిని స్పష్టం చేస్తుంది.
