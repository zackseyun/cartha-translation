source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: te
  text: అతడు పరిశుద్ధస్థలానికి[a], ప్రత్యక్షపు గుడారానికి, బలిపీఠానికి ప్రాయశ్చిత్తం[c] చేయడం ముగించినప్పుడు, సజీవ మేకను సమర్పించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధ స్థలానికి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి అక్షరార్థం “దగ్గరకు తీసుకురావాలి”; అంటే, తరువాతి ఆచార చర్య కోసం దానిని ముందుకు తీసుకురావాలి.
    reason: lexical_alternative
  - marker: c
    text: ఈ సందర్భంలో “ప్రాయశ్చిత్తం చేయడం” అనే మాటను ఆచారరీతిగా శుద్ధి చేయడం లేదా అపవిత్రతను తొలగించడం అనే భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: ప్రాయశ్చిత్తం చేయడం ముగించినప్పుడు
  rationale: כלה చర్యను పూర్తిచేయడాన్ని, מן‌తో కూడిన כפר ఆ చర్య ముగిసిన తరువాతి క్రమాన్ని సూచిస్తాయి. తెలుగు కాలవాచక ఉపవాక్యం ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలం
  rationale: ఈ సందర్భంలో ఇది అమూర్తమైన పరిశుద్ధతను కాక పవిత్రమైన ఆరాధనా స్థలాన్ని సూచిస్తుంది; ‘పరిశుద్ధస్థలం’ మూలపదానికి సమీపంగా ఉండి సహజమైన తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే గుడారాన్ని సూచించే స్థిరమైన బైబిలు పదబంధంగా ఇది అర్థాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే వేదికను సూచించే సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: וְהִקְרִיב
  choice: సమర్పించాలి
  rationale: హిఫీల్ రూపానికి అక్షరార్థంగా ‘దగ్గరకు తీసుకురావాలి’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ తదుపరి ఆచార చర్యకోసం మేకను ముందుకు తీసుకువచ్చి నిలపడం ఉద్దేశం; ‘సమర్పించాలి’ ఆ ఆచార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַשָּׂעִיר הֶחָי
  choice: సజీవంగా ఉన్న మేక
  rationale: ఇప్పటికే వధించబడిన మేకకు భిన్నంగా ఇంకా జీవించి ఉన్న మేకను חי గుర్తిస్తుంది; ఈ వ్యత్యాసాన్ని తెలుగు పదబంధం స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: బలి-ఆచార సందర్భంలో כפר అనువాదం
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: శుద్ధి చేయడం / అపవిత్రతను తొలగించడం
  rationale: כפר లేవీయకాండంలో ప్రాయశ్చిత్తం, ఆచార శుద్ధి వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో ‘ప్రాయశ్చిత్తం’ విస్తృతమైన బలి-ఆచార భావాన్ని నిలుపుతుంది; శుద్ధీకరణ భావాన్ని పాదటిప్పణి ద్వారా సంరక్షించడం ఏకైక సిద్ధాంతాత్మక వివరణను రుద్దకుండా ఉంటుంది.
- issue: הַקֹּדֶשׁ సూచించే స్థలం
  choice: పరిశుద్ధస్థలం
  alternative: పవిత్ర మందిరం / పరిశుద్ధ స్థానం
  rationale: మూలపదం పవిత్రమైన ఆరాధనా ప్రదేశాన్ని సూచిస్తుంది. ‘పరిశుద్ధస్థలం’ దాని స్థలార్థాన్ని కాపాడుతూ, అది ప్రత్యేకంగా ఏ ఉపవిభాగాన్ని సూచిస్తుందో అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆచార సంబంధ పదాలకు స్థిరమైన తెలుగు బైబిలు పదజాలాన్ని వాడుతూ, כפר లోని భావ విస్తృతిని పాదటిప్పణిలో నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
