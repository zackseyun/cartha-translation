id: LEV.16.5
reference: Leviticus 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: te
  text: ఇశ్రాయేలీయుల సమాజం నుండి అతడు పాపపరిహార బలిగా రెండు మగ మేకలను, దహనబలిగా ఒక పొట్టేలును తీసుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’ అని అనువదించిన హీబ్రూ పదాన్ని ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు. ‘ఇశ్రాయేలీయులు’ అనే మాటకు హీబ్రూ పదశః రూపం ‘ఇశ్రాయేలు కుమారులు.’
    reason: హీబ్రూ חַטָּאת యొక్క బలి సంబంధమైన అర్థవ్యాప్తినీ, בְּנֵי יִשְׂרָאֵל యొక్క పదశః రూపాన్నీ తెలియజేయడం.
lexical_decisions:
- source_word: וּמֵאֵת
  choice: నుండి
  rationale: సమాజమే జంతువులను సమకూర్చే మూలమని సూచించే מן భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వాక్యారంభంలోని וְ మునుపటి ఆదేశంతో కొనసాగింపును సూచిస్తున్నా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజం
  rationale: ‘ఇశ్రాయేలు కుమారుల సమాజం’ అనే పదశః రూపం కంటే, మొత్తం నిబంధన సమాజాన్ని సూచించే హీబ్రూ నానుడి భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יִקַּח
  choice: అతడు ... తీసుకోవాలి
  rationale: కర్మకాండ సంబంధమైన ఆదేశంలో ఈ అసంపూర్ణ క్రియకు ఉన్న విధ్యర్థక బలాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: రెండు మగ మేకలను
  rationale: జంతువుల సంఖ్యనూ, లింగనిర్దేశాన్నీ కాపాడే సరళమైన ఆధునిక తెలుగు రూపం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: లేవీయకాండంలోని חַטָּאת పాపంతోపాటు ఆచార అపవిత్రతను పరిహరించే బలిని సూచిస్తుంది. తెలుగు బైబిలు పాఠకులకు అర్థమయ్యే సంప్రదాయ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచింది.
- source_word: וְאַיִל אֶחָד
  choice: ఒక పొట్టేలును
  rationale: אַיִל ప్రత్యేకంగా మగ గొర్రెను సూచిస్తుంది; ‘పొట్టేలు’ దానికి సహజమైన తెలుగు సమానం, ‘ఒక’ సంఖ్యను నిలుపుతుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: పూర్తిగా దహనం చేసే עֹלָה బలికి స్థిరమైన, సంక్షిప్తమైన తెలుగు పదం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ హీబ్రూ పదబంధం ఇక్కడ పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. అందువల్ల సహజమైన సమూహార్థాన్ని ఎంచుకొని, పదశః రూపాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: חַטָּאת అనే బలి పేరు
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపం మరియు ఆచార అపవిత్రతను తొలగించే బలిని సూచించగలదు. ప్రధాన పాఠ్యంలో పరిచితమైన పదాన్ని ఉంచి, దాని శుద్ధీకరణ కోణాన్ని పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలిని పాటించింది. ‘తీసుకోవాలి’ ఆదేశ బలాన్ని సహజంగా వ్యక్తపరుస్తుంది. ‘మగ మేకలు,’ ‘పొట్టేలు,’ ‘దహనబలి’ వంటి పదాలు సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకున్నవి.
