  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజల అపవిత్రతల వల్లను, వారి తిరుగుబాట్ల వల్లను, వారి పాపాలన్నిటి నిమిత్తమును అతడు పరిశుద్ధ స్థలానికి ప్రాయశ్చిత్తం చేయాలి.[a] అలాగే, వారి అపవిత్రతల మధ్య వారితో నివసించే సమాగమపు గుడారానికీ అతడు ప్రాయశ్చిత్తం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాయశ్చిత్తం చేయాలి’ అనే మాటను ఈ సందర్భంలో ‘శుద్ధి చేయాలి’ లేదా ‘అపవిత్రతను తొలగించాలి’ అని కూడా వ్యక్తపరచవచ్చు. ఈ ఆచారం అపవిత్రతతో పాటు పాపం, తిరుగుబాటును కూడా పరిష్కరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: లేవీయకాండంలోని ఆచార సందర్భంలో כפר పాపం, అపవిత్రత వలన కలిగిన సమస్యను ఆచారక్రియ ద్వారా పరిష్కరించడాన్ని సూచిస్తుంది. స్థిరమైన తెలుగు బైబిలు పదమైన ‘ప్రాయశ్చిత్తం చేయాలి’ దాని ఆచారపరమైన, దైవశాస్త్రపరమైన విస్తృతిని నిలుపుతుంది.
- source_word: עַל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలానికి
  rationale: הַקֹּדֶשׁ ఇక్కడ అమూర్తమైన పరిశుద్ధతను కాక పవిత్ర ఆలయ ప్రదేశాన్ని సూచిస్తుంది. సందర్భంలో ఇది అంతర్గత పరిశుద్ధ స్థలాన్ని సూచించే అవకాశం ఉన్నందున ‘పరిశుద్ధ స్థలం’ మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: מִטֻּמְאֹת
  choice: అపవిత్రతల వల్ల
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ఆచారపరమైన అపవిత్రతలను సూచిస్తుంది. מן ఇక్కడ ప్రాయశ్చిత్త చర్యకు కారణమైన దానిని తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ ఒడంబడిక సమాజమంతటినీ సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, ఖచ్చితంగా ఆ సమష్టి భావాన్ని అందిస్తుంది.
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: వారి తిరుగుబాటుల వల్ల
  rationale: פשע సాధారణ తప్పిదం కంటే సంకల్పపూర్వక అతిక్రమణ లేదా తిరుగుబాటు భావాన్ని కలిగి ఉంటుంది. ‘తిరుగుబాటులు’ ఆ నైతిక తీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: לְכָל חַטֹּאתָם
  choice: వారి పాపాలన్నిటి నిమిత్తం
  rationale: సమాంతర పదాలైన అపవిత్రతలు, తిరుగుబాటులతో కలిసి חטאות ఇక్కడ ‘పాపాలు’ అనే అర్థంలో సహజంగా గ్రహించబడుతుంది; ‘పాపపరిహార బలులు’ అని తీసుకోవడం సందర్భానికి తక్కువ అనుకూలం.
- source_word: וְכֵן יַעֲשֶׂה
  choice: అలాగే ... కూడా అతడు చేయాలి
  rationale: ముందు చెప్పిన ప్రాయశ్చిత్త ఆచారాన్ని తదుపరి పవిత్ర వస్తువుకు కూడా వర్తింపజేయాలని సూచించే విధానపరమైన సంక్షిప్త వాక్యం.
- source_word: לְאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారానికి
  rationale: తెలుగు బైబిలు వాడుకలో אֹהֶל מוֹעֵד కు సుపరిచితమైన సమానార్థకం. ఇది దేవునితో సమావేశమయ్యే గుడారాన్ని సూచిస్తుంది; కేవలం సాధారణ ‘సమావేశ గుడారం’ కంటే ఆచార సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַשֹּׁכֵן אִתָּם
  choice: వారితో నివసించే
  rationale: שׁכן అనే వర్తమాన కృదంతం గుడారం వారి మధ్య నిరంతరం నెలకొని ఉండటాన్ని సూచిస్తుంది. ‘వారితో నివసించే’ మూలంలోని సంబంధాత్మక, స్థానిక భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: వారి అపవిత్రతల మధ్య
  rationale: పవిత్ర గుడారం అపవిత్రతలతో కూడిన ప్రజల మధ్య ఉన్నదనే బలమైన స్థానిక రూపకాన్ని, అలాగే హీబ్రూ బహువచనాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త దిన సందర్భంలో כפר యొక్క భావం
  choice: ‘ప్రాయశ్చిత్తం చేయాలి’ అని అనువదించడం
  alternative: ‘శుద్ధి చేయాలి’ లేదా ‘అపవిత్రతను తొలగించాలి’
  rationale: ఈ ఆచారం పవిత్ర స్థలానికి అంటుకున్న అపవిత్రతను శుద్ధి చేయడమే కాక పాపం, తిరుగుబాటుతో ఏర్పడిన సంబంధభంగాన్ని కూడా పరిష్కరిస్తుంది. ‘ప్రాయశ్చిత్తం’ ఈ విస్తృత ఆచార-దైవశాస్త్ర భావాన్ని కుదించకుండా ఉంచుతుంది; [a]లో శుద్ధీకరణ పార్శ్వాన్ని సూచించబడింది.
- issue: పవిత్ర స్థలమే ప్రాయశ్చిత్తానికి గురికావడం
  choice: ‘పరిశుద్ధ స్థలానికి ప్రాయశ్చిత్తం’ అనే మూల నిర్మాణాన్ని నిలుపడం
  alternative: ప్రజల కోసమే ప్రాయశ్చిత్తం చేసినట్లు వాక్యాన్ని మార్చడం
  rationale: వచనం ఉద్దేశపూర్వకంగా పవిత్ర స్థలాన్ని ఆచార చర్యకు అంశంగా చూపుతుంది. ప్రజల అపవిత్రతలు, తిరుగుబాటులు దానిని ప్రభావితం చేస్తాయనే లేవీయకాండపు ఉద్రిక్తతను అనువాదం మృదువుపరచదు.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమష్టి సూచన
  choice: ‘ఇశ్రాయేలు ప్రజలు’
  alternative: ‘ఇశ్రాయేలు కుమారులు’
  rationale: ఇక్కడ పురుష సంతానాన్ని మాత్రమే కాక ఇశ్రాయేలు సమాజమంతటినీ సూచిస్తుంది. ఆధునిక తెలుగులో అక్షరానువాదం అనవసరంగా పరిమితార్థాన్ని కలిగించవచ్చు; ‘ప్రజలు’ మూలంలోని సమష్టి సూచనను స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆచార భాషను ఉపయోగించాం. ‘ప్రాయశ్చిత్తం’, ‘పరిశుద్ధ స్థలం’, ‘ప్రత్యక్ష గుడారం’ వంటి సుపరిచిత బైబిలు పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేశాం. హీబ్రూ బహువచనాలైన ‘అపవిత్రతలు’, ‘తిరుగుబాటులు’, ‘పాపాలు’ నిలుపబడ్డాయి.
