id: LEV.16.32
reference: Leviticus 16:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: te
  text: తన తండ్రి స్థానంలో యాజకునిగా సేవ చేయడానికి అభిషేకించబడి, ప్రతిష్ఠించబడిన[a] యాజకుడు ప్రాయశ్చిత్తం చేయాలి. అతడు పవిత్ర వస్త్రాలైన నార వస్త్రాలను ధరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని చేతిని నింపడం.” ఇది యాజక సేవకు ఒకరిని నియమించడం లేదా ప్రతిష్ఠించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక కర్మకాండ సందర్భంలో כפר నిర్దేశించిన ఆచారం ద్వారా ప్రాయశ్చిత్తం కలిగించడాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘ప్రాయశ్చిత్తం చేయాలి’ సహజంగాను, మూలంలోని ఆచార సంబంధ భావాన్ని అతిగా వివరించకుండాను వ్యక్తపరుస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: మూలపదం కేవలం ‘యాజకుడు’ అని ఉంది. సందర్భం ప్రధాన యాజకుని వారసుని గురించి అయినప్పటికీ, మూలంలో లేని ‘ప్రధాన’ అనే బిరుదును చేర్చలేదు.
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: అభిషేకించబడి
  rationale: ఈ సంబంధ వాక్యం యాజకుని అభిషేకం ద్వారా గుర్తిస్తుంది. కర్తను మూలవాక్యం స్పష్టంగా పేర్కొననందున తెలుగు కర్మణి ప్రయోగం ఆ అస్పష్టతను కాపాడుతూ సహజంగా ఉంటుంది.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: ప్రతిష్ఠించబడిన
  rationale: ‘అతని చేతిని నింపడం’ అనేది యాజక సేవలో నియమించడం లేదా పదవిలో ప్రతిష్ఠించడం అనే హీబ్రూ నుడికారం. ‘ప్రతిష్ఠించబడిన’ ఆధునిక పాఠకులకు అర్థవంతంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְכַהֵן
  choice: యాజకునిగా సేవచేయడానికి
  rationale: ఈ క్రియారూపం యాజక బాధ్యతను నిర్వహించడాన్ని సూచిస్తుంది. ‘యాజకునిగా సేవచేయడానికి’ అధికారిక పాత్రను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּחַת אָבִיו
  choice: తన తండ్రి స్థానంలో
  rationale: תחת ఇక్కడ తండ్రి తరువాత అతని పదవిని స్వీకరించే వారసత్వం లేదా స్థానభర్తృత్వాన్ని సూచిస్తుంది.
- source_word: וְלָבַשׁ
  choice: ధరించాలి
  rationale: వస్త్రాలను వేసుకోవడం లేదా ధరించడం అనే కర్మకాండ చర్యను సహజ తెలుగు ఆజ్ఞార్థక భావంలో తెలియజేస్తుంది.
- source_word: בִּגְדֵי הַבָּד בִּגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాలైన నార వస్త్రాలు
  rationale: రెండవ పదబంధం నార వస్త్రాలను పవిత్ర వస్త్రాలుగా మరింత గుర్తిస్తుంది. ‘-అయిన’ నిర్మాణం ఈ సమానాధికరణ సంబంధాన్ని సహజ తెలుగులో స్పష్టపరుస్తుంది.
theological_decisions:
- issue: הַכֹּהֵן ను ‘యాజకుడు’గా అనువదించాలా, సందర్భానుసారంగా ‘ప్రధాన యాజకుడు’గా విస్తరించాలా
  choice: యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: సందర్భం ప్రధాన యాజకుని వారసుని సూచించినా, హీబ్రూ పాఠం ‘యాజకుడు’ అని చెప్పి అభిషేకం, ప్రతిష్ఠ, తండ్రి స్థానాన్ని స్వీకరించడం ద్వారా అతన్ని వివరిస్తుంది. అందువల్ల మూలంలోని వ్యక్తీకరణనే ఉంచాం.
- issue: ‘అతని చేతిని నింపడం’ అనే ప్రతిష్ఠాపన నుడికారాన్ని ఎలా అందించాలి
  choice: ప్రతిష్ఠించబడిన
  alternative: అతని చెయ్యి నింపబడినవాడు
  rationale: అక్షరార్థ రూపం సాధారణ ఆధునిక తెలుగు పాఠకునికి అస్పష్టంగా ఉంటుంది. ‘ప్రతిష్ఠించబడిన’ సంస్థాగత భావాన్ని తెలియజేస్తుంది; మూల నుడికారాన్ని పాదసూచిక నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. కర్మకాండ పదజాలంలో ‘యాజకుడు,’ ‘అభిషేకించబడి,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన పదాలను నిలిపి, హీబ్రూ నుడికారాన్ని పాదసూచికతో వివరించాం.
