id: LEV.16.30
reference: Leviticus 16:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: te
  text: ఎందుకంటే ఈ రోజున మిమ్మల్ని శుద్ధి చేయడానికి మీ కోసం ప్రాయశ్చిత్తం చేయబడుతుంది[a]. యాహ్వే[b] సన్నిధిలో మీ పాపాలన్నిటి నుంచి మీరు శుద్ధులవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మీ కోసం ప్రాయశ్చిత్తం చేస్తాడు.” హీబ్రూ క్రియ ఏకవచనంలో ఉంది, కానీ ఈ ఉపవాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: YHWH; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בַיּוֹם הַזֶּה
  choice: ఈ రోజున
  rationale: హీబ్రూ నిర్దేశక పదంలోని సమీపత్వాన్ని, ఆచార సందర్భాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: మీ కోసం ప్రాయశ్చిత్తం చేయబడుతుంది
  rationale: כפר అనే బల్యారాధన సంబంధిత పదానికి ‘ప్రాయశ్చిత్తం’ తగినది. క్రియ ఏకవచనంలో ఉన్నా ఈ ఉపవాక్యంలో కర్త స్పష్టంగా చెప్పబడలేదు; అందువల్ల కర్తను ఊహించి చేర్చకుండా కర్మణి నిర్మాణం వాడబడింది.
- source_word: לְטַהֵר אֶתְכֶם
  choice: మిమ్మల్ని శుద్ధి చేయడానికి
  rationale: ప్రాయశ్చిత్తం యొక్క ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది; ‘శుద్ధి చేయడం’ ఆచారపరమైన పవిత్రీకరణను గౌరవప్రదంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: మీ పాపాలన్నిటి నుంచి
  rationale: ఈ సందర్భంలో חטאת బలులను కాక ప్రజల పాపాలను సూచిస్తుంది; శుద్ధితో సహజంగా అనుసంధానమవుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; יהוה అనే దైవనామాన్ని వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: תִּטְהָרוּ
  choice: మీరు శుద్ధులవుతారు
  rationale: ముందటి పీయేల్ రూపం తెలిపే శుద్ధి చేసే క్రియకు భిన్నంగా, ఖాల్ రూపం ఫలితంగా కలిగే శుద్ధస్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది. మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: כפר అనే ఆచారపరమైన పదం
  choice: ప్రాయశ్చిత్తం చేయబడుతుంది
  alternative: అతడు ప్రాయశ్చిత్తం చేస్తాడు
  rationale: వచనం చెప్పే బల్యారాధన భావాన్ని నిలుపుతూ, ప్రాయశ్చిత్తాన్ని ఒక నిర్దిష్టమైన తరువాతి సిద్ధాంత నమూనాగా వివరించలేదు. కర్త చెప్పబడకపోవడాన్ని కూడా సంరక్షించింది.
- issue: శుద్ధి చేసే చర్య మరియు శుద్ధస్థితి మధ్య భేదం
  choice: శుద్ధి చేయడానికి … శుద్ధులవుతారు
  alternative: పవిత్రపరచడానికి … పవిత్రులవుతారు
  rationale: לְטַהֵר లోని చర్యను, תִּטְהָרוּ లోని ఫలితస్థితిని తెలుగులో వేర్వేరుగా వ్యక్తం చేస్తుంది; నైతిక లేదా సిద్ధాంతపరమైన అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆచారపరమైన ‘ప్రాయశ్చిత్తం’, ‘శుద్ధి’ పదాలను నిలుపుతూ, అస్పష్టమైన కర్తను ప్రధాన పాఠంలో నిర్దిష్టం చేయలేదు. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
