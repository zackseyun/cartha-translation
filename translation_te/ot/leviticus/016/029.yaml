  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: te
  text: 'ఇది మీకు శాశ్వతమైన నియమంగా ఉండాలి: ఏడవ నెలలో, ఆ నెల పదవ రోజున, మిమ్మల్ని మీరు దీనపరచుకోవాలి[a]. దేశస్థుడైనా, మీ మధ్య నివసించే పరదేశియైనా ఏ పనీ చేయకూడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘మీ ప్రాణాలను మీరు బాధించుకోవాలి.’ ఈ మాటలో ఉపవాసం కూడా భాగమని సంప్రదాయంగా అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: ఇది ... ఉండాలి
  rationale: ఈ న్యాయసూత్రంలో היה ముందున్న ఆదేశాన్ని కొనసాగిస్తూ ఒక నియమాన్ని స్థాపిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు సూచనార్థకమైన ‘ఇది’ చేర్చబడింది.
- source_word: לְחֻקַּת עוֹלָם
  choice: శాశ్వతమైన నియమంగా
  rationale: חֻקָּה నిర్దేశిత నియమాన్ని, עוֹלָם నిరంతరంగా అమలులో ఉండే కాలవ్యాప్తిని సూచిస్తాయి. ఈ పదబంధం ఆ ఆదేశపు స్థిరమైన బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: కాలగణన సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; అందువల్ల నేరుగా, స్పష్టంగా అనువదించబడింది.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ఆ నెల పదవ రోజున
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నెలలో పదవ తేదీన’ అని ఉంటుంది; తెలుగులో తేదీ స్పష్టత కోసం ‘పదవ రోజున’ అని ఇవ్వబడింది.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు దీనపరచుకోవాలి
  rationale: ענה యొక్క పియేల్ రూపం נֶפֶשׁ తో కలిసి స్వీయ-దీనత్వం లేదా స్వీయ-నిరాకరణను సూచిస్తుంది. ‘దీనపరచుకోవాలి’ అనే పదం దాని విస్తృత భావాన్ని నిలుపుతూ, దానిని కేవలం ఉపవాసానికే పరిమితం చేయదు; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంది.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: ఏ పనీ చేయకూడదు
  rationale: מְלָאכָה సాధారణ పని లేదా శ్రమను సూచిస్తుంది. ఈ రూపం నిషేధాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֶזְרָח
  choice: దేశస్థుడు
  rationale: אֶזְרָח సమాజంలో స్వదేశీయ సభ్యుణ్ని సూచిస్తుంది; ‘దేశస్థుడు’ పరదేశితో ఉన్న న్యాయపరమైన వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో స్థిరంగా నివసించే బయటి వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ ఆ వ్యక్తి బయటి మూలాన్ని, ‘మీ మధ్య నివసించే’ అతని నివాస స్థితిని తెలియజేస్తాయి; హీబ్రూలోని సమానధాతు పునరుక్తి తెలుగులో సహజమైన ఉపవాక్యంగా వ్యక్తమైంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త దినపు స్వీయ-దీనత్వ ఆజ్ఞ యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘మిమ్మల్ని మీరు దీనపరచుకోవాలి’ అని విస్తృతంగా అనువదించడం
  alternative: ‘మీ ప్రాణాలను మీరు బాధించుకోవాలి’ లేదా ‘ఉపవాసం ఉండాలి’
  rationale: హీబ్రూ నుడికారం ఒకే ఆచారానికంటే విస్తృతమైన స్వీయ-దీనత్వం లేదా స్వీయ-నిరాకరణ భావాన్ని కలిగి ఉంది. ఉపవాసం దాని సంప్రదాయ అన్వయమైనప్పటికీ, ప్రధాన పాఠ్యంలో దానినే నిర్దిష్టంగా పేర్కొనడం మూలపాఠపు భావపరిధిని అనవసరంగా కుదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ఆజ్ఞ యొక్క శాశ్వత స్వభావం, తేదీ, స్వీయ-దీనత్వం, పని నిషేధం, దేశస్థుడు–నివాస పరదేశి అనే వ్యాప్తి అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
