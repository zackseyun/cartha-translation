id: LEV.16.22
reference: Leviticus 16:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: te
  text: ఆ మేక వారి దోషాలన్నిటినీ తనపై మోసుకొని జనావాసానికి దూరమైన ప్రదేశానికి[a] వెళ్తుంది. అతడు ఆ మేకను అరణ్యంలోకి పంపివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరుచేయబడిన ప్రదేశానికి,’ ‘ఏకాంత ప్రదేశానికి,’ ‘చేరరాని ప్రదేశానికి,’ లేదా ‘నిర్జన ప్రదేశానికి.’ హీబ్రూ పదబంధం బహుశా జనావాసం నుండి వేరైన ప్రదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: మోసుకొని ... వెళ్లాలి
  rationale: נשא అంటే ‘మోయడం, భరించడం.’ మేక దోషాలను తన మీద ఉంచుకొని తీసుకువెళ్తున్న స్పష్టమైన ఆచార చిత్రాన్ని ఈ ప్రయోగం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַשָּׂעִיר
  choice: ఆ మేక
  rationale: שָׂעִיר ప్రత్యేకంగా మగ మేకను సూచించగలదు. అయితే సందర్భంలో ఇప్పటికే నిర్దిష్టమైన మేక ఉద్దేశించబడింది; తెలుగులో ‘ఆ మేక’ సహజంగా ఉండి భావానికి అవసరమైన నిర్దిష్టతను ఇస్తుంది.
- source_word: עָלָיו
  choice: తన మీద
  rationale: ఉపసర్గతో కూడిన సర్వనామం దోషాలు మేక మీద మోయబడుతున్నాయని సూచిస్తుంది. ‘తన మీద’ ప్రతిఫలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל עֲוֺנֹתָם
  choice: వారి దోషాలన్నిటినీ
  rationale: עָוֹן అపరాధం, దోషం, దాని బాధ్యత వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. ‘దోషాలు’ నైతిక, ఆచారపరమైన బరువును నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: జనావాసానికి దూరమైన దేశానికి
  rationale: గְּזֵרָה అర్థం నిశ్చితంగా లేదు; వేరుచేయబడిన, చేరరాని, ఏకాంతమైన ప్రదేశ భావం ఉండవచ్చు. పదక్షరంగా అసహజమైన ‘కత్తిరించబడిన దేశం’ బదులు, వేరుపాటు భావాన్ని సహజంగా తెలిపే ఈ రూపాన్ని ప్రధాన పాఠ్యంలో వాడి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: וְשִׁלַּח
  choice: పంపివేయాలి
  rationale: שׁלח ఇక్కడ మేకను సమాజం నుండి దూరంగా పంపడాన్ని సూచిస్తుంది. ‘పంపివేయాలి’ ఆ దిశాత్మకమైన తొలగింపు భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోకి
  rationale: מִדְבָּר జనావాసం లేని అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ బైబిలు సందర్భానికి తగిన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions:
- issue: మేక ప్రజల దోషాలను మోసే ఆచార చిత్రం
  choice: మేక వారి దోషాలన్నిటినీ ‘తన మీద మోసుకొని’ వెళ్తుందని సాక్షాత్తు చిత్రాన్ని నిలిపాం.
  alternative: ‘వారి పాపాలను తొలగిస్తుంది’ అని భావానువాదం చేయడం.
  rationale: హీబ్రూ పాఠ్యం దోషాలను మేక మీద ఉంచి దూరంగా తీసుకెళ్లే స్పష్టమైన ఆచార చిత్రాన్ని ఇస్తుంది. దానిని నిలపడం తరువాతి సిద్ధాంతార్థాలను పాఠ్యంలోకి ముందుగానే చేర్చకుండా ఉంటుంది.
- issue: אֶרֶץ גְּזֵרָה అనే అనిశ్చిత పదబంధం
  choice: ప్రధాన పాఠ్యంలో ‘జనావాసానికి దూరమైన దేశం’ అని ఇచ్చి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
  alternative: ‘వేరుచేయబడిన దేశం,’ ‘ఏకాంత ప్రదేశం,’ ‘చేరరాని ప్రదేశం,’ లేదా ‘నిర్జన ప్రదేశం.’
  rationale: ఈ అరుదైన పదం యొక్క ఖచ్చిత భావంపై అనిశ్చితి ఉంది. ప్రధాన పాఠ్యం వేరుపాటు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, పాదటిప్పణి నిజమైన పదార్థ వైవిధ్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనదిగానూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేదిగానూ రూపొందించాం. ‘మోసుకొని’ అనే రూపం ఆచారంలోని సజీవ చిత్రాన్ని నిలుపుతుంది; అరుదైన భూభాగ పదబంధపు అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా కాపాడాం.
