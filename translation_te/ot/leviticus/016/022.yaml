revisions:
- from: ఆ మేక వారి దోషాలన్నిటినీ తన మీద మోసుకొని, జనావాసానికి దూరమైన దేశానికి[a] వెళ్లాలి. అతడు ఆ మేకను అరణ్యంలోకి పంపివేయాలి.
  to: ఆ మేక వారి దోషాలన్నిటినీ తనపై మోసుకొని జనావాసానికి దూరమైన ప్రదేశానికి[a] వెళ్తుంది. అతడు ఆ మేకను అరణ్యంలోకి పంపివేస్తాడు.
