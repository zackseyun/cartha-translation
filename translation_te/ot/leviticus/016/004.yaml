id: LEV.16.4
reference: Leviticus 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: te
  text: అతడు పవిత్రమైన నార అంగీని ధరించాలి; నారతో చేసిన లోదుస్తులు అతని శరీరంపై ఉండాలి. అతడు నార నడికట్టును తన చుట్టూ కట్టుకొని, నార తలపాగాను చుట్టుకోవాలి. ఇవి పవిత్ర వస్త్రాలు. అతడు తన శరీరాన్ని నీటితో కడుక్కొని, వాటిని ధరించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: పవిత్రమైన నార అంగీ
  rationale: כְּתֹנֶת అనేది శరీరంపై ధరించే పొడవైన వస్త్రం; ఆధునిక తెలుగులో ‘అంగీ’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది. בַּד ను యాజక వస్త్రాల సందర్భంలో ‘నార’గా, קֹדֶשׁ ను ‘పవిత్రమైన’గా అనువదించాం.
- source_word: מִכְנְסֵי בַד
  choice: నార లోదుస్తులు
  rationale: ఇది దిగువ శరీర భాగాన్ని కప్పే, చర్మానికి నేరుగా తగిలే యాజక వస్త్రాన్ని సూచిస్తుంది. ‘లోదుస్తులు’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: עַל בְּשָׂרוֹ
  choice: అతని శరీరంపై
  rationale: అక్షరార్థంగా ‘అతని మాంసంపై’; వస్త్రధారణ సందర్భంలో ‘శరీరంపై’ సహజమైన తెలుగు, అలాగే ప్రత్యక్ష శారీరక భావాన్ని నిలుపుతుంది.
- source_word: אַבְנֵט בַּד יַחְגֹּר
  choice: నార నడికట్టును తన చుట్టూ కట్టుకొని
  rationale: אַבְנֵט చుట్టి కట్టుకునే యాజక నడికట్టు. יַחְגֹּר లోని తనకు తానే చుట్టుకొని కట్టుకునే భావాన్ని ఈ రూపం వ్యక్తం చేస్తుంది.
- source_word: מִצְנֶפֶת בַּד יִצְנֹף
  choice: నార తలపాగాను తన తల చుట్టూ చుట్టుకోవాలి
  rationale: מִצְנֶפֶת యాజకుని చుట్టుకునే శిరోవస్త్రం; సంబంధిత క్రియ יִצְנֹף లోని చుట్టే భావాన్ని ‘తల చుట్టూ చుట్టుకోవాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּגְדֵי קֹדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: ఆరాధనా సేవ కోసం ప్రత్యేకించబడిన వస్త్రాలనే మూలపాఠం పేర్కొంటుంది; అదనపు ప్రతీకాత్మక అర్థాన్ని చేర్చకుండా నేరుగా అనువదించాం.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ וּלְבֵשָׁם
  choice: అతడు తన శరీరాన్ని నీళ్లతో కడుక్కొని, వాటిని ధరించాలి
  rationale: ‘తన మాంసాన్ని నీళ్లతో కడిగి వాటిని ధరించాలి’ అనే మూల భావాన్ని సహజ తెలుగులో అందిస్తుంది. సంయుక్త క్రియారూపం కడుక్కోవడం తరువాత ధరించే క్రమాన్ని అధిక వివరణ లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: వస్త్రాల పవిత్రత స్వభావం
  choice: ఆరాధనా సేవ కోసం ప్రత్యేకించబడినవిగా ‘పవిత్ర వస్త్రాలు’ అని అనువదించడం
  alternative: ‘పరిశుద్ధ వస్త్రాలు’ లేదా ‘ప్రతిష్ఠిత వస్త్రాలు’
  rationale: קֹדֶשׁ ఇక్కడ ఆరాధనా/కర్మకాండ సందర్భంలో ప్రత్యేకించబడినదనే భావం కలిగిస్తుంది. మూలపాఠంలో లేని తరువాతి ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన అర్థాన్ని జోడించలేదు.
- issue: בְּשָׂרוֹ పదాన్ని ఆచార సందర్భంలో అనువదించడం
  choice: శరీరం
  alternative: మాంసం లేదా ఒంటి చర్మం
  rationale: ‘మాంసం’ అక్షరార్థానికి దగ్గరైనా తెలుగులో అనవసరమైన వేరొక భావాన్ని కలిగించవచ్చు. వస్త్రం నేరుగా శరీరంపై ఉండటం, శరీరాన్ని కడుక్కోవటం అనే స్పష్టమైన ఆచార ఆదేశాన్ని ‘శరీరం’ సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆదేశ శైలిని ఉపయోగించాం. యాజక వస్త్రాలకు సాధారణ పాఠకుడు అర్థం చేసుకోగల పదాలను ఎంచుకున్నాం; మూలంలోని పునరుక్తి మరియు క్రమాన్ని సాధ్యమైనంతవరకు నిలిపాం.
