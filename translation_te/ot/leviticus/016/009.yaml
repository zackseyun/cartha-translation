  revision_rationale: Revised the wording to distinguish the presentation of the goat (וְהִקְרִיב) from its ritual designation and handling as a sin offering (וְעָשָׂהוּ חַטָּאת). The lot idiom, the divine name, and the sacrificial term are retained without adding interpretive detail.
