id: LEV.16.9
reference: Leviticus 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: te
  text: యాహ్వే కోసం చీటి ఏ మేక మీద పడిందో[a], ఆ మేకను అహరోను తన ముందుకు తీసుకువచ్చి, దానిని పాపపరిహార బలిగా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే కోసం చీటి పైకి వచ్చిన మేక.”
    reason: హీబ్రూ నుడికారమైన עָלָה ... הַגּוֹרָל (‘చీటి పైకి వచ్చింది’)ను మరింత అక్షరార్థంగా ప్రతిబింబించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: సమర్పించి
  rationale: బలుల సందర్భంలో הקריב అనేది బలి క్రియను పూర్తిగా చెప్పకముందే జంతువును ఆచారపూర్వకంగా ముందుకు తెచ్చి సమర్పించడాన్ని సూచిస్తుంది. ‘సమర్పించి’ సహజమైన తెలుగులో ఈ ఆచార భావాన్ని నిలుపుతుంది.
- source_word: הַשָּׂעִיר
  choice: ఆ మేకను
  rationale: שׂעיר సాధారణంగా మగ మేకను సూచించగలిగినా, ఈ ఆచార సందర్భంలో ‘మేక’ స్పష్టంగా, సహజంగా ఉంది; అవసరం లేని భారాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: చీటి ఏ మేక మీద పడిందో
  rationale: עלה ... הגורל అనే హీబ్రూ నుడికారానికి తెలుగులో ‘చీటి ... మీద పడింది’ సహజమైన సమానార్థక వ్యక్తీకరణ. వాక్య నిర్మాణాన్ని తెలుగుకు అనుగుణంగా మార్చినా కేటాయింపు భావం నిలుస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వే కోసం
  rationale: ל ఉపసర్గ కేటాయింపు లేదా ఉద్దేశాన్ని సూచిస్తుంది; అందువల్ల ‘యాహ్వే కోసం’ అని అనువదించాం. יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: దానిని పాపపరిహార బలిగా అర్పించాలి
  rationale: యాజక ధర్మశాస్త్రంలోని బలి సందర్భంలో חטאת ఒక ప్రత్యేక బలి రకాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ అనేది ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే స్థిరమైన ఆచార పదబంధం; עשה యొక్క కార్యార్థాన్ని ‘అర్పించాలి’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, మూల ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: חטאת అనే బలి పేరు
  choice: పాపపరిహార బలి
  alternative: పాపశుద్ధి బలి
  rationale: חטאתను ‘పాపం’ అని మాత్రమే అనువదిస్తే ఇక్కడి బలి సంబంధమైన అర్థం కనుమరుగవుతుంది. ‘పాపపరిహార బలి’ సాంప్రదాయంగా అర్థమయ్యే పదం; అయితే ‘పాపశుద్ధి బలి’ అనే ప్రత్యామ్నాయం ఈ బలి శుద్ధీకరణ కార్యాన్ని మరింత ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సమర్పించి’ మరియు ‘అర్పించాలి’ ద్వారా జంతువును ఆచారపూర్వకంగా ముందుకు తేవడం, ఆ తరువాత దానిని నిర్దిష్ట బలిగా నిర్వహించడం అనే రెండు దశలను వేరుగా ఉంచాం.
