revisions:
- from: యాహ్వే కోసం చీటి ఏ మేక మీద పడిందో[a], ఆ మేకను అహరోను సమర్పించి, దానిని పాపపరిహార బలిగా అర్పించాలి.
  to: యాహ్వే కోసం చీటి ఏ మేక మీద పడిందో[a], ఆ మేకను అహరోను తన ముందుకు తీసుకువచ్చి, దానిని పాపపరిహార బలిగా చేయాలి.
  rationale: Revised the wording to distinguish the presentation of the goat (וְהִקְרִיב) from its ritual designation and handling as a sin offering (וְעָשָׂהוּ חַטָּאת). The lot idiom, the divine name, and the sacrificial term are retained without adding interpretive detail.
