source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: te
  text: అతడు రక్తంలో కొంతను తన వేలితో దానిమీద ఏడుసార్లు చల్లాలి; ఇశ్రాయేలు కుమారుల[c] అపవిత్రతల నుండి దానిని శుద్ధిచేసి[a] పవిత్రపరచాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానిని ఆచారపరంగా శుద్ధి చేసి.’ హీబ్రూ క్రియ యాజక ఆచారంలో దేనినైనా అపవిత్రత నుండి శుద్ధి చేయడాన్ని సూచించే సాధారణ పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దానిని పరిశుద్ధమైనదిగా చేసి’ లేదా ‘పవిత్ర ఉపయోగానికి ప్రత్యేకపరచాలి.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఈ పదబంధం ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అనే సమూహార్థంలో వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: చల్లాలి
  rationale: హిఫీల్ రూపంలోని נזה యాజక ఆచార సందర్భంలో రక్తాన్ని చల్లడాన్ని సూచిస్తుంది. ‘చల్లాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆచార సంబంధమైన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: ఈ సర్వనామం ముందటి వచనంలో పేర్కొన్న బలిపీఠాన్ని సూచిస్తుంది. ‘దానిమీద’ సందర్భానికి సహజమైన రూపం.
- source_word: מִן־הַדָּם
  choice: ఆ రక్తంలో కొంత తీసుకుని
  rationale: מִן ఇక్కడ భాగార్థాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘రక్తంలో కొంత’ మాత్రమే అనడం కంటే ‘కొంత తీసుకుని’ అని చెప్పడం చల్లే చర్యతో దాని సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: సాధనార్థక בְּ ను ‘తో’ ద్వారా నేరుగా, సహజంగా వ్యక్తం చేసింది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: ఆచారంలోని ఖచ్చితమైన సంఖ్యను యథాతథంగా నిలుపుతుంది.
- source_word: וְטִהֲרוֹ
  choice: దానిని శుద్ధిచేసి
  rationale: טהר యాజక ఆచార భాషలో ఆచారపరంగా శుభ్రం లేదా పవిత్రయోగ్యం చేయడాన్ని సూచిస్తుంది. ‘శుద్ధిచేయు’ ఈ భావాన్ని గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: וְקִדְּשׁוֹ
  choice: పవిత్రపరచాలి
  rationale: קדש ఇక్కడ పవిత్రమైనదిగా చేయడం లేదా పవిత్ర ఉపయోగానికి ప్రత్యేకపరచడం అనే భావాన్ని కలిగి ఉంది. ‘పవిత్రపరచాలి’ మూలపదంతో పారదర్శక సంబంధాన్ని నిలుపుతుంది.
- source_word: מִטֻּמְאֹת
  choice: అపవిత్రతల నుండి
  rationale: హీబ్రూలోని బహువచనాన్ని ‘అపవిత్రతలు’ అనే బహువచనంతో నిలిపి, నైతిక దోషం మాత్రమే కాక ఆచారపరమైన అపవిత్రత అనే భావానికి చోటిచ్చింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని రూపకల్పనను దగ్గరగా ప్రతిబింబిస్తూ, ఇది ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ సమూహపదబంధమని పాదటిప్పణి ద్వారా స్పష్టం చేసింది.
theological_decisions:
- issue: బలిపీఠానికి వర్తించే ఆచారపరమైన శుద్ధి భాష
  choice: ఇశ్రాయేలు కుమారుల అపవిత్రతల నుండి బలిపీఠాన్ని శుద్ధిచేసి పవిత్రపరచడం
  alternative: ‘కడిగి శుభ్రం చేయడం’ లేదా నైతిక మార్పును సూచించే భాష
  rationale: ఈ వచనం పరిశుద్ధస్థల వస్తువుపై జరిగే యాజక ఆచారాన్ని వివరిస్తుంది; వ్యక్తిగత నైతిక పరివర్తనను కాదు. అందువల్ల ఆచారపరమైన భావాన్ని నిలిపే ‘శుద్ధిచేయు’, ‘పవిత్రపరచు’ అనే పదాలు ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు లేదా ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ పదబంధంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించగలదనే భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. యాజక ఆచారానికి ప్రత్యేకమైన భావాన్ని నిలుపుతూ అతిగా సాంకేతికమైన లేదా ఏదైనా సంప్రదాయానికి మాత్రమే చెందిన పదజాలాన్ని నివారించాం. అర్థస్పష్టత కోసం భాగార్థక מִן ను ‘రక్తంలో కొంత తీసుకుని’ అని సహజీకరించాం.
