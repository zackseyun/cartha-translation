id: LEV.16.34
reference: Leviticus 16:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజల[a] పాపాలన్నిటి నిమిత్తం[b] సంవత్సరానికి ఒకసారి వారి కోసం ప్రాయశ్చిత్తం చేయడం మీకు శాశ్వత నియమంగా ఉండాలి. యెహోవా మోషేకు ఆజ్ఞాపించిన ప్రకారం అతడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల.” ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే స్థిర పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి పాపాలన్నిటి నుండి”; ఈ రూపం ప్రాయశ్చిత్తంలోని శుద్ధీకరణ భావాన్ని ముందుకు తెస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: ఇది మీకు శాశ్వత నియమంగా ఉండాలి
  rationale: హీబ్రూ న్యాయశైలి బలాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే విధంగా అనువదించబడింది. עוֹלָם ఇక్కడ నిరంతరంగా అమలులో ఉండే నిబంధనను సూచిస్తుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడం
  rationale: లేవీయకాండంలోని బలి-ఆచార సందర్భంలో כפר పదానికి ఉన్న పాపపరిహార, శుద్ధీకరణ సంబంధిత భావాన్ని సూచించే స్థిరమైన తెలుగు పదప్రయోగం.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల కోసం
  rationale: בְּנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇది మొత్తం ఒడంబడిక సమాజాన్ని సూచించే జాతీయ నామం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, సమగ్రంగా అర్థమవుతుంది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִכָּל חַטֹּאתָם
  choice: వారి పాపాలన్నిటి నిమిత్తం
  rationale: מִן ఇక్కడ పాపాలను ప్రాయశ్చిత్తానికి కారణం లేదా దాని నుండి శుద్ధి పొందవలసిన అంశంగా సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన కారణార్థక రూపం వాడి, శుద్ధీకరణ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אַחַת בַּשָּׁנָה
  choice: సంవత్సరానికి ఒకసారి
  rationale: వార్షికంగా ఒక్కసారి జరిగే ఆచారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: హీబ్రూలో కర్త పేరు స్పష్టంగా చెప్పబడలేదు. అందువల్ల ‘అతడు’ అని ఉంచి మూలంలోని సూచనాత్మక అస్పష్టతను కాపాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యంతరీకరణతో అందించాం.
theological_decisions:
- issue: כפר పదంలోని ప్రాయశ్చిత్తం మరియు శుద్ధీకరణ భావాలు
  choice: ప్రధాన పాఠంలో ‘ప్రాయశ్చిత్తం చేయడం’
  alternative: ‘పాపాలన్నిటి నుండి శుద్ధి చేయడం’ అనే భావఛాయ
  rationale: బలి-ఆచార సంబంధిత సాంకేతిక భావాన్ని ‘ప్రాయశ్చిత్తం’ నిలుపుతుంది; מִן వల్ల వినిపించే శుద్ధీకరణ భావాన్ని పాదసూచికలో ఇచ్చి భావసంక్లిష్టతను తొలగించలేదు.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక జాతీయ పదబంధం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇది కేవలం పురుష సంతానాన్ని కాక మొత్తం ప్రజాసమూహాన్ని సూచించే స్థిర హీబ్రూ పదబంధం. సహజమైన సామూహిక అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, రూపపరమైన అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: וַיַּעַשׂ లో అంతర్లీన కర్త
  choice: అతడు చేశాడు
  alternative: అహరోను చేశాడు
  rationale: సందర్భం అహరోనును సూచించగలిగినా, ఈ వచనంలో అతని పేరు లేదు. కాబట్టి పేరును చేర్చకుండా మూలంలోని అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయ-ఆచార శైలి వాడబడింది. వాక్య నిర్మాణం హీబ్రూ ఉద్దేశ్య సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా మార్చబడింది; కర్త పేరు మూలంలో లేనందున చేర్చబడలేదు.
