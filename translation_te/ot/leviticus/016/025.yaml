  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: te
  text: పాపబలి[a] కొవ్వును అతడు బలిపీఠం మీద కాల్చి అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి.” ఈ హీబ్రూ పదం పాపం లేదా అపవిత్రత నుండి శుద్ధీకరణ కోసం అర్పించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: —
  rationale: וְ ఈ క్రియను ముందున్న ఆచారక్రమంతో కలుపుతుంది; అయితే స్వతంత్ర వచనంగా సహజమైన తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేదు. אֵת ప్రత్యక్ష కర్మ సూచిక కాబట్టి విడిగా అనువదించబడదు.
- source_word: חֵלֶב
  choice: కొవ్వును
  rationale: ఇది బలిగా అర్పించడానికి నిర్దేశించిన కొవ్వును సూచిస్తుంది. మూలంలో లేని అదనపు నిర్దిష్టతను చేర్చకుండా నేరుగా అనువదించబడింది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల సందర్భంలో חַטָּאת పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘పాపపరిహార బలి’ స్పష్టంగా ఉండి, ఆచార సంబంధమైన అర్థాన్ని నిలుపుతుంది; ‘శుద్ధీకరణ బలి’ అనే ముఖ్య ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: יַקְטִיר
  choice: దహించాలి
  rationale: కטר హిఫీల్ రూపం బలిపీఠం మీద బలిపదార్థాన్ని కాల్చి పొగగా పైకి లేపే ఆచారక్రియను సూచిస్తుంది. ‘దహించాలి’ సంక్షిప్తంగా, గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశార్థక రూపాన్ని ఈ బలిదహన సందర్భంలో సహజమైన స్థానార్థక తెలుగుగా అందించింది.
theological_decisions:
- issue: బలి నియమాలలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ హీబ్రూ పదం పాపంతో సంబంధమున్న బలిని, అలాగే పాపం లేదా అపవిత్రత నుంచి శుద్ధీకరణకు ఉపయోగించే బలిని సూచించగలదు. ప్రధాన పాఠంలో సుపరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, ఆచార విధిని ముందుకు తెచ్చే ప్రత్యామ్నాయాన్ని పాదసూచికలో పరిరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆచారభాష వాడబడింది. ‘అతడు’ అనే కర్త మూలంలోని మూడవ పురుష ఏకవచన క్రియలో అంతర్లీనంగా ఉన్నందున స్పష్టత కోసం వ్యక్తీకరించబడింది; పదక్రమం సహజమైన తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మార్చబడింది.
