  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: te
  text: అతడు యాహ్వే సన్నిధిలో నిప్పుమీద ధూపం వేయాలి; అతడు చనిపోకుండా ఉండేందుకు ధూపపు మేఘం సాక్ష్యంపై ఉన్న ప్రాయశ్చిత్త మూతను[a] కప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కరుణాసనం.’ హీబ్రూ పదం మందసం మీదనున్న మూతను, ముఖ్యంగా ప్రాయశ్చిత్త ఆచారాల్లో దాని పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: వేయాలి
  rationale: ఆచార విధిని నిర్దేశించే సందర్భంలో ఈ క్రియకు ఆదేశాత్మక భావం ఉంది. ఆధునిక తెలుగులో ‘వేయాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַקְּטֹרֶת
  choice: ధూపం
  rationale: పరిశుద్ధ స్థల ఆచారంలో ఉపయోగించే సుగంధ ధూపాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: עַל הָאֵשׁ
  choice: నిప్పుమీద
  rationale: ధూపాన్ని మండుతున్న నిప్పు లేదా నిప్పుకణాల మీద ఉంచడాన్ని మూలానికి దగ్గరగా తెలియజేస్తుంది; ‘నిప్పుకణాలు’ అని ప్రత్యేకీకరించలేదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో దేవుని సమక్షాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וְכִסָּה עֲנַן הַקְּטֹרֶת
  choice: ధూపపు మేఘం ... కప్పేలా
  rationale: ధూపం వేయడం వల్ల ఉద్దేశించిన ఫలితాన్ని తెలుగులో స్పష్టంగా చూపుతూ, ధూపమేఘం అనే మూల చిత్రాన్ని నిలుపుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసం మీదనున్న మూతను, ముఖ్యంగా ప్రాయశ్చిత్త ఆచారంలో దాని పాత్రను సూచిస్తుంది. సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: సాక్ష్యం మీదనున్న
  rationale: మూలంలోని ‘సాక్ష్యం’ అనే పదాన్ని విస్తరించి ‘పలకలు’ లేదా ‘మందసం’ అని నిర్ణయించకుండా ఉంచి, దాని స్థానం సంబంధాన్ని కాపాడుతుంది.
- source_word: וְלֹא יָמוּת
  choice: అప్పుడు అతడు చనిపోడు
  rationale: ముందటి ఆచారాన్ని సరిగా చేయడం వల్ల కలిగే ప్రాణరక్షక ఫలితాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హַכַּפֹּרֶת అనే పరిశుద్ధస్థల సంబంధ పదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాసనం
  rationale: ఈ పదం మందసం మూతను, ప్రాయశ్చిత్త ఆచారంలో దాని ప్రత్యేక పాత్రను సూచిస్తుంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువును, దాని ఆచార సంబంధాన్ని పారదర్శకంగా తెలియజేస్తుంది; సంప్రదాయ ‘కరుణాసనం’ను పాదసూచికలో నిలిపింది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: וְכִסָּה మరియు וְלֹא יָמוּת మధ్య భావసంబంధం
  choice: ఉద్దేశించిన ఫలితం మరియు దాని ప్రాణరక్షక పరిణామం
  alternative: రెండు సాధారణ భవిష్యత్ ప్రకటనలు
  rationale: ఆచార విధి సందర్భంలో ధూపమేఘం మూతను కప్పడం, యాజకుడు చనిపోకపోవడానికి అవసరమైన ఫలితంగా కనిపిస్తుంది; అయితే కారణాన్ని అదనపు సిద్ధాంత భాషతో వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆచార-నిర్దేశ శైలి. మూలంలోని ‘సాక్ష్యం’ అనే సంక్షిప్త పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా విస్తరించలేదు; వాక్యాన్ని సహజంగా చేయడానికి రెండు వాక్యాలుగా అమర్చింది.
