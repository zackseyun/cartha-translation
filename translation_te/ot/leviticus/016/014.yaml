revisions:
- from: అతడు ఎద్దు రక్తంలో కొంత తీసుకొని, తన వేలితో ప్రాయశ్చిత్తపు మూత[a] తూర్పువైపు పైభాగం మీద చల్లాలి. ప్రాయశ్చిత్తపు మూత ఎదుట తన వేలితో ఆ రక్తంలో కొంత ఏడు సార్లు చల్లాలి.
