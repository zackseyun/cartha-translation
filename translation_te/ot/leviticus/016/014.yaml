id: LEV.16.14
reference: Leviticus 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: te
  text: అతడు ఎద్దు రక్తంలో కొంత తీసుకొని, తన వేలితో ప్రాయశ్చిత్తపు మూతపై, తూర్పు వైపున చల్లాలి. ఆ మూత ఎదుట తన వేలితో రక్తంలో కొంతను ఏడు సార్లు చల్లాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח מִדַּם הַפָּר
  choice: ఎద్దు రక్తంలో కొంత తీసుకొని
  rationale: మִן‌ను భాగార్థకంగా గ్రహించి, మొత్తం రక్తం కాక దానిలో కొంత తీసుకోవడాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది. ఆచార నియమ సందర్భంలో క్రియను విధ్యర్థకంగా అనువదించింది.
- source_word: וְהִזָּה
  choice: చల్లాలి
  rationale: యాజక ఆచార సందర్భంలో נזה రక్తాన్ని చల్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చల్లాలి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְ సాధనార్థాన్ని సూచిస్తోంది; ఆచారం నిర్వహించే సాధనాన్ని నేరుగా తెలిపింది.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: ప్రాయశ్చిత్తపు మూత తూర్పువైపు పైభాగం మీద
  rationale: פְּנֵי ఇక్కడ వస్తువు యొక్క ముఖం లేదా ఉపరితలాన్ని సూచిస్తుంది; קֵדְמָה తూర్పు దిశను సూచిస్తుంది. ‘తూర్పువైపు పైభాగం’ ఈ స్థల సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత
  rationale: כַּפֹּרֶת మందసంపై ఉన్న ప్రత్యేక మూతను సూచిస్తుంది; ‘ప్రాయశ్చిత్తపు మూత’ దాని భౌతిక స్వరూపాన్నీ ప్రాయశ్చిత్త సంబంధాన్నీ కాపాడుతుంది.
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత ఎదుట
  rationale: לִפְנֵי స్థానార్థంగా ‘ఎదుట/ముందు’ అని అర్థం. మొదటి చల్లడం మూత మీద, రెండవది దాని ఎదుట జరిగిన భేదాన్ని నిలుపుతుంది.
- source_word: יַזֶּה שֶׁבַע פְּעָמִים מִן הַדָּם
  choice: ఆ రక్తంలో కొంత ఏడు సార్లు చల్లాలి
  rationale: క్రియలోని ఆచార విధ్యర్థాన్ని, ఏడు సార్ల స్పష్ట సంఖ్యను, מִן యొక్క భాగార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הַכַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాసనం
  rationale: హీబ్రూ పదం మందసం యొక్క మూతను సూచించడంతో పాటు ప్రాయశ్చిత్త ఆచారంతో ముడిపడి ఉంది. ‘ప్రాయశ్చిత్తపు మూత’ భౌతిక సూచనను స్పష్టంగా ఉంచుతుంది; సంప్రదాయపరమైన ‘కరుణాసనం’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి భావపరమైన పరిధిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార నియమానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘చల్లాలి’ అనే విధ్యర్థక రూపం హెబ్రీ ఆచార నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
