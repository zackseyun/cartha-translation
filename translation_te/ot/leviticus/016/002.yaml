source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: te
  text: 'యహ్వే మోషేతో ఇలా అన్నాడు: “నీ సోదరుడైన అహరోనుతో ఇలా చెప్పు: అతడు ఎప్పుడంటే అప్పుడు తెర లోపల ఉన్న పరిశుద్ధ స్థలంలోకి, మందసం మీద ఉన్న ప్రాయశ్చిత్తపు మూత[a] ఎదుటికి రాకూడదు; అతడు చనిపోకుండా ఉండేందుకు. ఎందుకంటే నేను మేఘంలో ఆ ప్రాయశ్చిత్తపు మూత మీద కనిపిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కృపాపీఠం’; ఇది ‘ప్రాయశ్చిత్తపు మూత’కు సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: నీ సహోదరుడు అహరోనుతో ఇలా చెప్పు
  rationale: ఆజ్ఞ యొక్క ప్రత్యక్ష బలాన్ని, అహరోనుతో మోషేకు ఉన్న సహోదర సంబంధాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: అతడు ఎప్పుడంటే అప్పుడు … రాకూడదు
  rationale: ఇది నిరంతరంగా రావడం గురించిన మాట కాదు; తన ఇష్టానుసారం లేదా నియమం లేకుండా ప్రవేశించడాన్ని నిషేధిస్తుంది. ‘ఎప్పుడంటే అప్పుడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: ఇక్కడ ఇది తెర లోపల ఉన్న పవిత్ర అంతర్భాగాన్ని సూచిస్తుంది; సందర్భానికి తగిన పరిచితమైన ఆరాధనా పదాన్ని వాడాం.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: తెర లోపల
  rationale: తెరకు అవతల ఉన్న అంతర్గత ప్రదేశాన్ని స్పష్టంగా, అనవసరమైన స్థలదృష్టి వ్యాఖ్యానం లేకుండా సూచిస్తుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత
  rationale: ఇది మందసం మీదున్న నిజమైన మూతను, ప్రాయశ్చిత్త ఆచారంతో దానికి ఉన్న సంబంధాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: హీబ్రూలో ఉన్న సంక్షిప్త రూపాన్నే అనుసరించి, ‘నిబంధన మందసం’ అని విస్తరించకుండా తెలుగులో స్థిరపడిన పదాన్ని వాడాం.
- source_word: וְלֹא יָמוּת
  choice: లేకపోతే అతడు చనిపోతాడు
  rationale: నిషేధాన్ని అతిక్రమించడం వల్ల కలిగే ప్రాణాంతక పరిణామాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי בֶעָנָן אֵרָאֶה עַל הַכַּפֹּרֶת
  choice: ఎందుకంటే నేను మేఘంలో ఆ ప్రాయశ్చిత్తపు మూత మీద కనిపిస్తాను
  rationale: నిషేధానికి కారణాన్ని తెలిపే כִּיను స్పష్టంగా ఉంచి, దేవుని ప్రత్యక్షత మేఘంలోనూ మూత మీదనూ ఉంటుందనే మూలవాక్య నిర్మాణాన్ని సాధ్యమైనంతగా నిలిపాం.
theological_decisions:
- issue: כַּפֹּרֶת అనే ఆరాధనా పదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కృపాసనం
  rationale: మూలపదం మందసం మీదున్న వస్తువును సూచించడమే కాక ప్రాయశ్చిత్త ఆచారంతో సంబంధం కలిగి ఉంది. ‘ప్రాయశ్చిత్తపు మూత’ ఈ రెండు అంశాలను సాధారణ పాఠకునికి వెల్లడిస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: בְּכָל עֵת యొక్క సందర్భార్థం
  choice: నియంత్రణలేని ప్రవేశాన్ని నిషేధించడం
  alternative: అన్ని సమయాల్లో
  rationale: ఈ సందర్భం అహరోను ఎప్పుడూ నిరంతరంగా లోపలికి వస్తున్నాడని చెప్పదు; నియమించబడిన విధిని పక్కనబెట్టి ఏ సమయానైనా ప్రవేశించడాన్ని నిషేధిస్తుంది. అందుకే ‘ఎప్పుడంటే అప్పుడు’ అని అనువదించాం.
- issue: אֵרָאֶה లోని కాలం మరియు దేవుని ప్రత్యక్షత
  choice: నేను … కనిపిస్తాను
  alternative: నేను … ప్రత్యక్షమవుతాను
  rationale: హీబ్రూ నిఫాల్ రూపం ‘కనిపించడం/ప్రత్యక్షమవడం’ అనే అర్థాన్ని ఇస్తుంది. ‘కనిపిస్తాను’ దేవుడు తనను వెల్లడించుకుంటాడనే భావాన్ని ఉంచుతూ, ప్రత్యక్షత యొక్క విధానాన్ని మరింతగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలిని వాడాం. గుడార ఆరాధనకు సంబంధించిన ‘పరిశుద్ధ స్థలం,’ ‘మందసం,’ ‘ప్రాయశ్చిత్తం’ వంటి పరిచిత పదాలను నిలిపి, వాక్య సంబంధాలను సాధారణ పాఠకునికి స్పష్టంగా చేశాం.
