  to: 'యహ్వే మోషేతో ఇలా అన్నాడు: “నీ సోదరుడైన అహరోనుతో ఇలా చెప్పు: అతడు ఎప్పుడంటే అప్పుడు తెర లోపల ఉన్న పరిశుద్ధ స్థలంలోకి, మందసం మీద ఉన్న ప్రాయశ్చిత్తపు మూత[a] ఎదుటికి రాకూడదు; అతడు చనిపోకుండా ఉండేందుకు. ఎందుకంటే నేను మేఘంలో ఆ ప్రాయశ్చిత్తపు మూత మీద కనిపిస్తాను.”'
