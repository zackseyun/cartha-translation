id: LEV.16.18
reference: Leviticus 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: te
  text: తర్వాత అతడు బయటికి వెళ్లి, యెహోవా ఎదుటనున్న బలిపీఠం దగ్గరకు వెళ్లి, దానికి ప్రాయశ్చిత్తం చేయాలి[a]. అతడు కోడె రక్తంలో కొంత, మగ మేక రక్తంలో కొంత తీసుకుని, బలిపీఠపు కొమ్ములపై నలువైపులా పూయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని శుద్ధిచేయాలి”; యాజక ఆచార సందర్భాల్లో హీబ్రూ క్రియకు శుద్ధీకరణ భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: తర్వాత అతడు ... బయటకు వచ్చి
  rationale: ఆచార విధానంలోని వరుస చర్యను ‘తర్వాత’ సహజంగా తెలియజేస్తుంది; ‘బయటకు వచ్చి’ అంతరాలయం నుంచి వెలుపలికి కదలడాన్ని నిలుపుతుంది.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో ఉన్న బలిపీఠం
  rationale: לִפְנֵי అనే పదబంధానికి ‘సన్నిధిలో’ సహజమైన తెలుగు రూపం; ఇది బలిపీఠపు పరిశుద్ధస్థల స్థానాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలుపుతుంది.
- source_word: וְכִפֶּר עָלָיו
  choice: దాని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ఆచార సందర్భంలో כפר యొక్క విస్తృత బలి-ఆచార భావాన్ని నిలుపుతుంది; శుద్ధిచేయడం అనే భావఛాయను పాదసూచికలో ఇస్తుంది.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: కోడె రక్తంలో కొంత, మేక రక్తంలో కొంత తీసుకుని
  rationale: పునరుక్త מִן యొక్క భాగార్థాన్ని ‘కొంత’ ద్వారా స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַפָּר
  choice: కోడె
  rationale: బలికి ఉపయోగించే మగ పశువును సూచించే సహజమైన తెలుగు పదం.
- source_word: הַשָּׂעִיר
  choice: మేక
  rationale: సందర్భంలో జంతువు ముందే గుర్తించబడినందున, అవసరానికి మించి ‘మగ మేక’ అని నిర్దిష్టం చేయకుండా మూలంలోని సందర్భార్థాన్ని అనుసరిస్తుంది.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠపు కొమ్ములన్నిటి మీద చుట్టూ పూయాలి
  rationale: రక్తాన్ని ఆచారబద్ధంగా ఉంచడాన్ని తెలుగులో ‘పూయాలి’ సహజంగా తెలియజేస్తుంది; ‘కొమ్ములన్నిటి మీద చుట్టూ’ סָבִיב భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజక బలి సందర్భంలో כפר అనువాదం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: దాన్ని శుద్ధిచేయాలి
  rationale: ‘ప్రాయశ్చిత్తం’ స్థిరమైన బలి-ఆచార పదం; అది ఏ ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్నీ చొప్పించకుండా మూలంలోని వేదాంతపరమైన బరువును నిలుపుతుంది. ఈ సందర్భంలో ఉన్న శుద్ధీకరణ భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆచారపరమైన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. విధినిర్దేశానికి ‘చేయాలి’ రూపం వాడబడింది.
