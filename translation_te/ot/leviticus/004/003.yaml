revisions:
- from: అభిషిక్తుడైన యాజకుడు పాపం చేసి, ప్రజల మీద అపరాధం మోపితే, తాను చేసిన పాపం నిమిత్తం మందలోని నిర్దోషమైన కోడెదూడను పాపపరిహార బలిగా యెహోవాకు అర్పించాలి.[a]
  to: అభిషిక్తుడైన యాజకుడు పాపం చేసి, దానివల్ల ప్రజలకు అపరాధం కలిగితే, అతడు తాను చేసిన పాపం నిమిత్తం మందలోని ఏ లోపమూ లేని కోడెదూడను యెహోవాకు పాపబలిగా అర్పించాలి.[a]
  rationale: The revision preserves the Hebrew legal condition and its compressed statement of corporate guilt, while avoiding the implication that the priest separately or deliberately ‘places’ guilt on the people. It also uses more precise modern Telugu for an unblemished sacrificial animal and renders the offering designation without added theological specification. The footnote is moved to the phrase it explains and retains the source ambiguity.
