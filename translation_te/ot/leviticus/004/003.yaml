  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: te
  text: అభిషిక్తుడైన యాజకుడు పాపం చేసి, దానివల్ల ప్రజలకు అపరాధం కలిగితే, అతడు తాను చేసిన పాపం నిమిత్తం మందలోని ఏ లోపమూ లేని కోడెదూడను యెహోవాకు పాపబలిగా అర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రజలకు అపరాధం కలిగితే” అనే హీబ్రూ పదబంధాన్ని అక్షరానువాదంగా “ప్రజల అపరాధానికి” అని కూడా అనువదించవచ్చు. యాజకుని పాపం వల్ల ప్రజలకు అపరాధ బాధ్యత కలుగుతుందనే భావాన్ని ఇది సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: అభిషిక్తుడైన యాజకుడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అభిషిక్తుడైన యాజకుడు’ అని చెబుతుంది; ‘ప్రధాన యాజకుడు’ అని విస్తరించడం సందర్భానుగత వ్యాఖ్యానం అవుతుంది.
- source_word: יֶחֱטָא
  choice: పాపం చేసి
  rationale: אִם తో కూడిన న్యాయపరమైన షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאַשְׁמַת הָעָם
  choice: ప్రజల మీద అపరాధం మోపితే
  rationale: యాజకుని పాపం ప్రజలకు అపరాధ బాధ్యతను కలిగించే సంక్షిప్త హీబ్రూ భావాన్ని, దాని విధానాన్ని అతిగా నిర్వచించకుండా వ్యక్తం చేస్తుంది.
- source_word: וְהִקְרִיב
  choice: అర్పించాలి
  rationale: బలుల సందర్భంలో సమర్పించడానికి తీసుకురావడం అనే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: తాను చేసిన పాపం నిమిత్తం
  rationale: మూలంలోని పునరుక్తిని తెలుగులో భారంగా చేయకుండా, బలి ఏ పాపం కోసం అర్పించబడుతుందో స్పష్టపరుస్తుంది.
- source_word: פַּר בֶּן בָּקָר
  choice: మందలోని కోడెదూడను
  rationale: పశువుల మందకు చెందిన మగ దూడ అనే భావాన్ని సహజంగా అందిస్తుంది; వయస్సును అవసరానికి మించి ఖచ్చితపరచదు.
- source_word: תָּמִים
  choice: నిర్దోషమైన
  rationale: బలికి తగిన జంతువులో లోపం ఉండకూడదనే ఆచారపరమైన అర్థాన్ని తెలుగులో స్థిరమైన పదంతో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా పేరుగానే ప్రతిబింబిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: ఇక్కడ חַטָּאת పాపాన్ని మాత్రమే కాక దాని కోసం అర్పించే బలిని సూచిస్తుంది; ‘పాపపరిహార బలి’ ఆ ఆచారపరమైన విధిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ ను ‘అభిషిక్తుడైన యాజకుడు’గా లేదా ‘ప్రధాన యాజకుడు’గా అనువదించడం
  choice: అభిషిక్తుడైన యాజకుడు
  alternative: అభిషిక్తుడైన ప్రధాన యాజకుడు
  rationale: మూలపాఠంలో ‘ప్రధాన’ అనే ప్రత్యేక పదం లేదు. సందర్భం ఆ పదవిని సూచించినప్పటికీ, అనువాదం మూలంలోని రూపాన్ని కాపాడుతుంది.
- issue: לְאַשְׁמַת הָעָם లోని సామూహిక పరిణామాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ప్రజల మీద అపరాధం మోపితే
  alternative: ప్రజలు అపరాధులయ్యేలా చేస్తే
  rationale: యాజకుని పాపం ప్రజలపై అపరాధ ప్రభావాన్ని కలిగిస్తుందని చూపుతుంది; అయితే ఆ ప్రభావం పనిచేసే విధానాన్ని మూలం చెప్పిన దానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆచార శైలి వాడబడింది. ‘అభిషిక్తుడైన యాజకుడు’ ద్వారా మూలంలోని పదబంధం వ్యాఖ్యాన విస్తరణ లేకుండా నిలుపబడింది.
