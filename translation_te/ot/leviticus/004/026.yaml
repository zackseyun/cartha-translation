source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבּ/וֹ֙ יַקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה כְּ/חֵ֖לֶב זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֖/וֹ וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: te
  text: అతడు దాని కొవ్వంతటినీ సమాధానబలి[a] కొవ్వువలె బలిపీఠం మీద కాల్చాలి. యాజకుడు అతని పాపం[b] నిమిత్తం అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతనికి క్షమాపణ లభిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాధానబలి’ని ‘సహవాస బలి’ లేదా ‘క్షేమ బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయు חַטָּאת అనే పదానికి ‘పాపం’ లేదా ‘పాపపరిహార బలి’ అనే అర్థం ఉండవచ్చు; ఇక్కడ అది ఎక్కువగా ఆ వ్యక్తి చేసిన పాపాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: దాని కొవ్వంతటినీ
  rationale: חֵלֶב ఇక్కడ బలిలో బలిపీఠం మీద కాల్చవలసిన జంతువు కొవ్వు భాగాలను సూచిస్తుంది. כָּל కలిపి ఉన్నందున ‘కొవ్వంతటినీ’ అని అనువదించడం మూలపాఠానికి తగినది.
- source_word: יַקְטִיר
  choice: కాల్చాలి
  rationale: బలుల సందర్భంలో קטר హిఫీల్ రూపం బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. సందర్భం ఆ ఆచారార్థాన్ని స్పష్టం చేస్తున్నందున సహజమైన ఆధునిక తెలుగు పదమైన ‘కాల్చాలి’ వాడబడింది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశను సూచించే రూపం ఉన్నప్పటికీ, బలి కొవ్వును కాల్చే చర్యకు తెలుగులో ‘బలిపీఠం మీద’ అనడం సహజంగా ఉంటుంది.
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి కొవ్వును కాల్చినట్లే
  rationale: ఈ కొవ్వును שְׁלָמִים బలిలోని కొవ్వు మాదిరిగా నిర్వహించాలని పోలిక చెబుతోంది. ‘సమాధాన బలి’ గుర్తించదగిన బలి వర్గపదంగా ఉంచబడింది; దాని విస్తృత భావపరిధి పాదసూచికలో ఇవ్వబడింది.
- source_word: וְכִפֶּר עָלָיו
  choice: యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలో כפר చేసే ఆచారపరమైన పరిహార కార్యాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్తం చేయాలి’ అనేది దాని భావాన్ని ఏ ఒక్క ప్రత్యేక సిద్ధాంతానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: מֵחַטָּאתוֹ
  choice: అతని పాపం నిమిత్తం
  rationale: חַטָּאת అనే పదానికి ‘పాపం’, ‘పాపపరిహార బలి’ అనే రెండు అర్థాలు సాధ్యమైనా, ఇక్కడ తరువాత వచ్చే క్షమాపణ వాక్యం ఆ వ్యక్తి చేసిన పాపాన్నే ప్రధానంగా సూచిస్తుంది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమాపణ లభిస్తుంది
  rationale: సלח నిఫాల్ రూపం, ל ఉపసర్గతో కలిసి, క్షమాపణ పొందే వ్యక్తిని సూచిస్తుంది. ‘అతనికి క్షమాపణ లభిస్తుంది’ అనే రూపం కర్తను పేర్కొనని హెబ్రీయు దైవకర్మణి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదం అనువాదం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ఈ హెబ్రీయు పదంలో సంపూర్ణత, క్షేమం, శాంతి, సహవాసం వంటి భావాలు ఉన్నాయి. ప్రధాన పాఠంలో పరిచితమైన ‘సమాధాన బలి’ ఉంచి, భావపరిధిని పాదసూచికలో తెలిపాం.
- issue: מֵחַטָּאתוֹ లో חַטָּאת అర్థం
  choice: అతని పాపం
  alternative: అతని పాపపరిహార బలి
  rationale: లేవీయకాండంలో חַטָּאת రెండు అర్థాల్లో వాడబడుతుంది. అయితే ఇక్కడ ‘అతని కోసం’ ప్రాయశ్చిత్తం చేయడం, తరువాత అతనికి క్షమాపణ లభించడం అనే క్రమం ‘అతని పాపం’ అనే అర్థానికే ఎక్కువ మద్దతు ఇస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. లేవీయకాండ బలి పరిభాషలో స్థిరత్వం కోసం ‘బలిపీఠం’, ‘సమాధాన బలి’, ‘ప్రాయశ్చిత్తం’ వంటి పదాలు నిలుపబడ్డాయి. హెబ్రీయు వాక్యంలోని కర్తను పేర్కొనని క్షమాపణ భావం సహజ తెలుగులో ‘అతనికి క్షమాపణ లభిస్తుంది’గా వ్యక్తమైంది.
