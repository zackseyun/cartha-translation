source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: te
  text: అతడు పాపపరిహార బలి తలపై తన చెయ్యి ఉంచాలి; దహనబలిని వధించే స్థలంలో పాపపరిహార బలిని వధించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ఉంచి
  rationale: బలి ఆచార సందర్భంలో סמך అనేది బలిపశువు మీద చెయ్యి ఉంచడం లేదా ఆనించడం సూచిస్తుంది. ఆధునిక తెలుగులో ‘చెయ్యి ఉంచి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: హీబ్రూ పదం ఏకవచనంలో 3వ పురుష ఏకవచన ప్రత్యయంతో ఉంది; అందువల్ల బహువచనం కాకుండా ఏకవచనాన్ని నిలిపాం.
- source_word: עַל רֹאשׁ
  choice: తలపై
  rationale: స్థానాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חטאת ఇక్కడ పాపంతో సంబంధమున్న నిర్దిష్ట బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ తెలుగు పాఠకులకు సుపరిచితంగా ఉండి, బలి సంబంధ సాంకేతిక భావాన్ని తెలియజేస్తుంది; శుద్ధీకరణ భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో నిలిపాం.
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: שחט అనేది బలిపశువును ఆచారరీతిగా వధించడాన్ని సూచించే సాంకేతిక క్రియ. ‘వధించాలి’ ఆ బలి సందర్భాన్ని, విధి నిర్దేశక భావాన్ని కాపాడుతుంది.
- source_word: בִּמְקוֹם
  choice: వధించే స్థలంలోనే
  rationale: ఈ పదబంధం క్రియ జరగవలసిన నిర్ణీత స్థలాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘స్థలంలోనే’ అనడం అదే స్థలమనే నిర్దిష్టతను స్పష్టం చేస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עלה అనే బలి సంబంధ పదానికి ‘దహనబలి’ స్థిరమైన, సులభంగా గుర్తించదగిన తెలుగు సమానార్థకం; బలి పూర్తిగా అర్పించబడే స్వభావాన్ని సూచిస్తుంది.
theological_decisions:
- issue: బలి సంబంధ సందర్భంలో חטאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో ఈ నామవాచకం ఒక నిర్దిష్ట బలిపశువును, దాని బలి విధానాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ పాపంతో దాని సంబంధాన్ని సుపరిచితంగా తెలియజేస్తుంది; అయితే పదంలో శుద్ధీకరణ సంబంధ భావం కూడా ఉండవచ్చు కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ఆచార నియమంలో హీబ్రూ వరుస క్రియారూపాల తెలుగు వ్యక్తీకరణ
  choice: ఉంచి ... వధించాలి
  alternative: ఉంచాడు ... వధించాడు
  rationale: రూపపరంగా వరుస గతకాల కథనంలా కనిపించినా, ఈ సందర్భం ఆచరించవలసిన బలి విధిని నిర్దేశిస్తోంది. అందువల్ల తెలుగులో విధ్యర్థక ‘వధించాలి’ సహజంగా ఆ నియమబలాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఆచార నియమ స్వభావాన్ని ‘వధించాలి’తో వ్యక్తం చేసి, మూలంలోని ఏకవచన ‘చెయ్యి’ని నిలిపాం.
