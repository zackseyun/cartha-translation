    issue: The phrase “ప్రత్యక్ష గుడారం” lacks the natural Telugu connective/genitive form.
    rationale: “ప్రత్యక్షపు గుడారం” is idiomatic Telugu biblical usage and more clearly forms the established title for the tent of meeting.
  - severity: low
    issue: Footnote b calls the Hebrew expression “ప్రత్యక్ష గుడారం వద్దకు.”
    rationale: The Hebrew אֶל expresses direction “to”; “వద్దకు” is less exact, and the Telugu title should match the corrected main-text form.
