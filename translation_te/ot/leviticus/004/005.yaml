  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: te
  text: అభిషేకించబడిన యాజకుడు ఎద్దు రక్తంలో కొంతను తీసుకొని, దానిని ప్రత్యక్షపు గుడారం లోపలికి తీసుకురావాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఎద్దు రక్తం నుండి.” ఇక్కడ హీబ్రూ ప్రయోగం రక్తంలో ఒక భాగాన్ని తీసుకోవడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ప్రత్యక్షపు గుడారానికి.” తరువాతి క్రతుకార్యాలు పరిశుద్ధ స్థలం లోపల జరుగుతాయి కాబట్టి ప్రధాన పాఠంలో “లోపలికి” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తీసుకొని ... తీసుకురావాలి
  rationale: బలి అర్పణ విధానంలోని వరుస ఆదేశాన్ని సహజమైన ఆధునిక తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది; వావ్‌తో కూడిన క్రియల క్రమసంబంధం నిలుస్తుంది.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: అభిషేకించబడిన యాజకుడు
  rationale: మָשִׁיחַ అనే పదంలోని ‘అభిషేకించబడిన’ భావాన్ని నేరుగా నిలుపుతుంది; ‘ప్రధాన యాజకుడు’ అనే సందర్భానుగత హోదాను మూలపదానికి బదులుగా పెట్టదు.
- source_word: מִדַּם הַפָּר
  choice: ఎద్దు రక్తంలో కొంత
  rationale: מִן ఇక్కడ రక్తమంతటినీ కాక దానిలో ఒక భాగాన్ని తీసుకోవడాన్ని సూచించే భాగార్థక ప్రయోగం; ఈ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהֵבִיא אֹתוֹ
  choice: దానిని ... తీసుకురావాలి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందున్న రక్తాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ‘దానిని’ ఆ సూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం లోపలికి
  rationale: אֶל ప్రాథమికంగా ‘వైపు/కు’ అని అర్థమివ్వగలిగినా, తరువాతి క్రతుకార్యాలు పరిశుద్ధ స్థలంలో జరుగుతాయి కాబట్టి ప్రవేశార్థాన్ని ప్రధాన పాఠంలో చూపిస్తుంది; ‘ప్రత్యక్ష గుడారం’ తెలుగు బైబిలు వాడుకలో స్థిరమైన, అర్థవంతమైన పదబంధం.
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ అనే లేవీయ హోదా అనువాదం
  choice: అభిషేకించబడిన యాజకుడు
  alternative: ప్రధాన యాజకుడు; ప్రతిష్ఠించబడిన యాజకుడు
  rationale: మూలంలోని ‘అభిషేకించబడిన’ అనే పదార్థాన్ని కాపాడుతూ, ఈ లేవీయ హోదాలో తరువాతి మెస్సీయ సంబంధ భావాన్ని అనవసరంగా చొప్పించదు; అలాగే సందర్భం ఆధారంగా మాత్రమే తెలిసే ‘ప్రధాన’ అనే పదాన్ని మూలానికి బదులుగా పెట్టదు.
- issue: אֶל లో ప్రవేశార్థం ఎంత స్పష్టంగా చూపాలి
  choice: లోపలికి
  alternative: వద్దకు; గుడారానికి
  rationale: మూల ఉపసర్గలో దిశార్థం ఉన్నప్పటికీ తరువాతి వచనాల్లోని క్రతువు గుడారం లోపల జరుగుతుంది. ప్రధాన పాఠంలో సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆచారవిధి శైలి ఉపయోగించబడింది. మూలంలోని క్రమబద్ధమైన ఆదేశ స్వరాన్ని ‘తీసుకురావాలి’ నిలుపుతుంది. ‘ప్రత్యక్ష గుడారం’ అనే పరిచిత బైబిలు పదబంధం కొనసాగించబడింది; నిజమైన పదార్థ ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
