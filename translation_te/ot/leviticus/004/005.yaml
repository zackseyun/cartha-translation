  terminology: “అభిషేకించబడిన యాజకుడు” faithfully retains the lexical sense of הַכֹּהֵן הַמָּשִׁיחַ without importing the interpretive title “high priest.” “ప్రత్యక్షపు గుడారం” is the familiar Telugu biblical equivalent for the tent of meeting.
  issues:
