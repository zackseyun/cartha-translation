  verdict: revise
  source_fidelity: The draft correctly preserves the procedural force, the partitive sense of מִדַּם, the anointed-priest designation, and the contextual sense of bringing the blood inside the tent. The established Telugu designation needs a genitive form for idiomatic accuracy.
