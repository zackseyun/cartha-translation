translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. బలి ఆచారానికి చెందిన సాంకేతిక భావాన్ని ప్రధాన పాఠంలో భారంగా చేయకుండా పాదసూచికలో స్పష్టం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
