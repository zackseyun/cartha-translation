source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יָרִ֣ים מִמֶּ֑/נּוּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: te
  text: అతడు దానిలోని కొవ్వంతటినీ తీసి, బలిపీఠం మీద దహించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ క్రియ బలి అర్పణను బలిపీఠంపై పొగగా పైకి వెళ్లేలా దహించడాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: అతడు... తీసి
  rationale: וְ అనే సంధి ముందటి ఆచారక్రమంతో ఈ చర్యను కలుపుతుంది; אֵת అనే ప్రత్యక్ష కర్మ సూచిక తెలుగులో ప్రత్యేక పదంగా అనువదించాల్సిన అవసరం లేదు. తెలుగు వాక్యప్రవాహంలో క్రియల అనుసంధానం ద్వారా ‘మరియు’ భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: כָּל
  choice: అంతటినీ
  rationale: నిర్దేశించిన కొవ్వులో కొంత మాత్రమే కాక, మొత్తం తీసివేయాలని సంపూర్ణతను సూచిస్తుంది.
- source_word: חֶלְבּוֹ
  choice: దాని కొవ్వు
  rationale: పుంలింగ ఏకవచన ప్రత్యయం బలి జంతువును సూచిస్తుంది; తెలుగులో వ్యక్తేతర సూచనగా ‘దాని’ సహజం. חֵלֶב లేవీయకాండపు బలి సందర్భంలో దహనార్థంగా ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది.
- source_word: יָרִים
  choice: తీసి
  rationale: רוּם హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకెత్తు’ అనే భావం ఉన్నా, ఇక్కడ జంతువు నుండి కొవ్వును వేరుచేసి తీసే ఆచారక్రియ ఉద్దేశం. ‘తీసి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుండి
  rationale: బలి జంతువు నుండి కొవ్వును వేరుచేయడాన్ని సూచిస్తుంది; వ్యక్తేతర నిర్దేశానికి ‘దానిలోనుండి’ సరైన రూపం.
- source_word: וְהִקְטִיר
  choice: దహింపజేయాలి
  rationale: הקטיר సాధారణంగా కాల్చడమే కాక, బలిని బలిపీఠంపై పొగగా పైకి వెళ్లేలా దహింపజేయడాన్ని సూచించే యాజక సంబంధ పదం. ‘దహింపజేయాలి’ గౌరవప్రదంగా, సహజంగా ఉండి ఆ బలి సందర్భాన్ని నిలుపుతుంది; ప్రత్యేక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశాసూచక అంత్యం బలిపీఠం వైపు కదలికను సూచించగలిగినా, הקטיר తో కలిసి దహనం జరిగే స్థలాన్ని తెలుగులో సహజంగా ‘బలిపీఠం మీద’ అని వ్యక్తపరుస్తుంది.
