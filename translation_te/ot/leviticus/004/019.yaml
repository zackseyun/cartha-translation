revisions:
- from: అతడు దాని కొవ్వంతటినీ దానిలోనుండి తీసి, బలిపీఠం మీద దహింపజేయాలి[a].
  to: అతడు దానిలోని కొవ్వంతటినీ తీసి, బలిపీఠం మీద దహించాలి[a].
  rationale: The revision retains every explicit source element while using direct, natural Telugu for the priest’s ritual action. It also smooths the repeated pronoun construction. The footnote continues to identify the sacrificial sense of the Hebrew verb.
  reviewer_model: gpt-5.6-terra
