source:
  edition: WLC
  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: te
  text: పాపపరిహార బలికి చెందిన ఎద్దుకు చేసినట్లే ఈ ఎద్దుకూ చేయాలి; దానికి కూడా అలాగే చేయాలి. యాజకుడు వారి కోసం ప్రాయశ్చిత్తం చేయాలి; వారికి క్షమాపణ కలుగుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: ఈ ఎద్దుకు కూడా చేయాలి
  rationale: עשה + ל ఇక్కడ బలి జంతువుపై నిర్వహించే ఆచార చర్యను సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘ఎద్దుకు చేయాలి’ సహజంగా ఉండి విధివాచక బలాన్ని నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עָשָׂה לְפַר הַחַטָּאת
  choice: పాపపరిహార బలి కోసం అర్పించిన ఎద్దుకు చేసినట్లే
  rationale: כַּאֲשֶׁר పోలికను స్పష్టంగా తెలియజేస్తుంది. ‘చేసినట్లే’ ముందుగా వివరించిన బలి విధానంతో ఖచ్చితమైన సారూప్యాన్ని నిలుపుతుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల సందర్భంలో חטאת పాపాన్ని పరిష్కరించే లేదా శుద్ధి కలిగించే అర్పణను సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉండగా, శుద్ధీకరణ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: దానికి అదే విధంగా చేయాలి
  rationale: כֵּן ముందటి విధానానికి అనుగుణతను సూచిస్తుంది. మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా ‘అదే విధంగా’ అని అనువదించాం.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: యాజకుడు వారి కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר అనే ప్రధాన ఆరాధనా పదానికి ‘ప్రాయశ్చిత్తం చేయాలి’ అనేది స్థిరమైన, పారదర్శకమైన అనువాదం; על అనేది ఆ చర్య ఎవరి పక్షంగా జరుగుతుందో తెలియజేస్తుంది.
- source_word: וְנִסְלַח לָהֶם
  choice: అప్పుడు వారికి క్షమాపణ కలుగుతుంది
  rationale: סלח యొక్క నిఫల్ రూపం క్షమించబడే ఫలితాన్ని వ్యక్తం చేస్తుంది. ‘క్షమాపణ కలుగుతుంది’ తెలుగు భాషలో సహజంగా ఉండి, క్షమాపణను ఎవరు ఇస్తారో మూలం చెప్పని చోట దానిని చేర్చదు.
theological_decisions:
- issue: బలి సందర్భంలో חטאת పదానికి అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపాన్ని పరిష్కరించే అర్పణను, దాని ద్వారా కలిగే శుద్ధీకరణను రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సంరక్షించాం.
- issue: וְנִסְלַח לָהֶם లో క్షమాపణ ఫలితం
  choice: వారికి క్షమాపణ కలుగుతుంది
  alternative: వారు క్షమించబడతారు
  rationale: రెండు రూపాలూ నిఫల్ భావాన్ని అందిస్తాయి. ఎవరిని క్షమిస్తారనే వ్యక్తిగత కర్మణి నిర్మాణం కంటే, హెబ్రీయ భాషలోని ఫలిత స్థితికి దగ్గరగా ఉండే సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి విధానానికి సంబంధించిన మూల పునరుక్తిని నిలిపి, విధివాచక భావానికి ‘చేయాలి’ వాడాం. ‘ప్రాయశ్చిత్తం’ వంటి కీలక ఆరాధనా పదాన్ని సాంకేతిక ఖచ్చితత్వం కోసం నిలిపాం.
