id: LEV.4.22
reference: Leviticus 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: te
  text: ఒక నాయకుడు పాపం చేసి, తన దేవుడైన యాహ్వే చేయకూడదని ఆజ్ఞాపించిన వాటిలో ఏదైనా ఒకటి అనుకోకుండా చేసి[a], దోషి అయినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పొరపాటున చేసి”; హీబ్రూ పదం ఉద్దేశపూర్వకం కాని అపరాధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అపరాధస్థితిలో పడినప్పుడు”; హీబ్రూ పదం చేసిన తప్పు వల్ల కలిగే దోషస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: నాయకుడు
  rationale: ఈ పదం గుర్తింపు పొందిన సమాజ, గోత్ర నాయకుణ్ణి లేదా అధిపతిని సూచిస్తుంది; తప్పనిసరిగా రాజకుమారుణ్ణి సూచించదు. ఆధునిక తెలుగులో ‘నాయకుడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יֶחֱטָא
  choice: పాపం చేసి
  rationale: חטא పాపం చేయడాన్ని నేరుగా తెలిపే సాధారణ క్రియ; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా అసమాపక క్రియారూపం వాడబడింది.
- source_word: וְעָשָׂה אַחַת מִכָּל
  choice: వాటిలో ఏదో ఒకదాన్ని ... చేసి
  rationale: ఆజ్ఞల పరిధిలోని నిషిద్ధ కార్యాలలో ఏదో ఒక కార్యం చేయడమనే భాగార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִצְוֺת יְהוָה אֱלֹהָיו אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: తన దేవుడైన యెహోవా చేయకూడదని ఆజ్ఞాపించిన వాటిలో
  rationale: ‘ఆజ్ఞలు’ అనే భావాన్నీ, ‘చేయబడకూడనివి’ అనే నిషేధార్థాన్నీ కలిపి సహజంగా వ్యక్తపరుస్తూ, אֱלֹהָיו లోని ‘అతని దేవుడు’ భావాన్ని ‘తన దేవుడైన’గా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בִּשְׁגָגָה
  choice: అనుకోకుండా
  rationale: లేవీయకాండపు బలి నియమాల సందర్భంలో ఇది ఉద్దేశపూర్వకం కాని, పొరపాటున జరిగిన అపరాధాన్ని సూచిస్తుంది.
- source_word: וְאָשֵׁם
  choice: అపరాధి అయినప్పుడు
  rationale: చేసిన కార్యం వల్ల కలిగే అపరాధస్థితిని వ్యక్తపరుస్తుంది. హీబ్రూ వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున తెలుగు షరతు నిర్మాణాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తినామంగానే నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
- issue: וְאָשֵׁם లోని అపరాధ భావం
  choice: అపరాధి అయినప్పుడు
  alternative: అపరాధభారం మోసినప్పుడు
  rationale: ఈ క్రియను కేవలం అంతర్గత అపరాధభావంగా కాక, నిషిద్ధ కార్యం వల్ల ఏర్పడిన వాస్తవ అపరాధస్థితిగా చూపుతుంది; అదే సమయంలో దాని న్యాయపరమైన అన్ని వివరాలను ఈ పదంలోకి అతిగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూల హీబ్రూలోని కాలవాక్య నిర్మాణం తరువాతి వచనానికి కొనసాగుతుంది కాబట్టి చివర కామా ఉంచబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
