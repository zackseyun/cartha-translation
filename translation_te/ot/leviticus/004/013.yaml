id: LEV.4.13
reference: Leviticus 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: te
  text: “ఇశ్రాయేలు సమాజమంతా అనుకోకుండా పాపం చేసి[a], ఆ విషయం సభ దృష్టికి రాకుండా ఉండి[b], యాహ్వే చేయకూడదని ఆజ్ఞాపించిన పనుల్లో ఏదో ఒకటి చేసి దోషులైతే,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ క్రియ ఉద్దేశపూర్వకంగా చేసిన తిరుగుబాటును కాక, తెలియక లేదా పొరపాటున చేసిన పాపాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: 'అక్షరార్థం: “ఆ విషయం సభ కళ్లకు మరుగై ఉండి”; అంటే అది సమాజం గమనానికి రాకపోవడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతా
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు ప్రజాసముదాయాన్ని సూచిస్తుంది. తరువాతి הַקָּהָל‌కు ‘సభ’ అని వేరుగా అనువదించేందుకు ఇక్కడ ‘సమాజం’ ఉపయోగించబడింది.
- source_word: יִשְׁגּוּ
  choice: అనుకోకుండా పాపం చేసి
  rationale: שׁגה ఈ బలుల నియమాల సందర్భంలో ఉద్దేశపూర్వక తిరుగుబాటును కాక, పొరపాటున లేదా తెలియక చేసిన పాపాన్ని సూచిస్తుంది.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: ఆ విషయం సభవారి దృష్టికి రాకుండా ఉండి
  rationale: ‘సభ కళ్లకు మరుగై ఉండడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో, విషయం వారి గమనానికి రాలేదనే అర్థంతో వ్యక్తం చేస్తుంది.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: యాహ్వే చేయకూడదని ఆజ్ఞాపించిన వాటిలో ఏదో ఒకటి చేసి
  rationale: నిషేధించబడిన కార్యాలలో ఒకదాన్ని చేయడమే ఈ నిర్మాణ భావం. ‘ఏదో ఒకటి’ అనేది אַחַת భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇస్తుంది.
- source_word: וְאָשֵׁמוּ
  choice: అపరాధులైతే
  rationale: ఆ కార్యం ఫలితంగా వారు దోషస్థితికి లేదా బాధ్యతకు లోనవుతారనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శׁגה సూచించే పాప స్వభావం
  choice: అనుకోకుండా చేసిన పాపం
  alternative: తప్పిపోవడం లేదా పొరబడడం
  rationale: లేవీయకాండము 4లోని బలి నియమాల సందర్భం ఉద్దేశపూర్వక ధిక్కారానికి భిన్నమైన, తెలియక లేదా పొరపాటున జరిగిన అపరాధాన్ని సూచిస్తుంది.
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో అందించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయ-ఆరాధనా శైలి ఉపయోగించబడింది. עֵדָה మరియు קָהָל మధ్య ఉన్న పదభేదాన్ని వరుసగా ‘సమాజం’, ‘సభ’తో నిలిపి, వాక్యాంతంలోని షరతు నిర్మాణాన్ని తరువాతి వచనంతో కలిసేలా ‘అపరాధులైతే’ అని ఉంచాం.
