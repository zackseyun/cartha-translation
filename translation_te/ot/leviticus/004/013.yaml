- from: “ఇశ్రాయేలు సమాజమంతా అనుకోకుండా పాపం చేసి[a], ఆ విషయం సభవారి దృష్టికి రాకుండా ఉండి[b], యాహ్వే చేయకూడదని ఆజ్ఞాపించిన వాటిలో ఏదో ఒకటి చేసి అపరాధులైతే,”
  to: “ఇశ్రాయేలు సమాజమంతా అనుకోకుండా పాపం చేసి[a], ఆ విషయం సభ దృష్టికి రాకుండా ఉండి[b], యాహ్వే చేయకూడదని ఆజ్ఞాపించిన పనుల్లో ఏదో ఒకటి చేసి దోషులైతే,”
