id: LEV.4.2
reference: Leviticus 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: ఎవరైనా అనుకోకుండా[b] యెహోవా ఆజ్ఞల ప్రకారం చేయకూడని వాటిలో ఏదో ఒకటి చేసి పాపం చేస్తే,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; సందర్భంలో ‘ఇశ్రాయేలు ప్రజలు’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: ‘పొరపాటున’ లేదా ‘తెలియక’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఉద్దేశపూర్వక ధిక్కారంగా కాక అనవధానంగా చేసిన పాపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: దైవిక ఆదేశాన్ని పరిచయం చేసే ఏకవచన ఆజ్ఞార్థకం; ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష రూపం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణను యథాశక్తి నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: נֶפֶשׁ
  choice: ఎవరైనా
  rationale: ఈ న్యాయసందర్భంలో ఇది అమూర్తమైన ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది; షరతు వాక్యంలో ‘ఎవరైనా’ సహజం.
- source_word: תֶחֱטָא
  choice: అతిక్రమించి
  rationale: నిషేధాత్మక ఆజ్ఞకు విరుద్ధంగా పాపం చేయడాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: בִשְׁגָגָה
  choice: అనుకోకుండా
  rationale: ఉద్దేశపూర్వక ధిక్కారం కాక పొరపాటున లేదా తెలియక చేసిన పాపాన్ని సూచిస్తుంది.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: యెహోవా ఆజ్ఞల్లో దేనినైనా
  rationale: מן నిర్మాణాన్ని ఆజ్ఞలలో ఏదో ఒకదానికి సంబంధించిన ఉల్లంఘనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: చేయకూడని వాటిలో
  rationale: చేయరాని క్రియలను నిర్దేశించే ఆజ్ఞలనే ఉద్దేశిస్తున్న సంబంధవాక్య భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: వాటిలో ఒకదాన్ని చేస్తే
  rationale: ముందు పేర్కొన్న నిషిద్ధ కార్యాల్లో ఒకదాన్ని నిజంగా చేయడాన్ని షరతు వాక్యంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
- issue: בִשְׁגָגָה సూచించే పాప స్వభావం
  choice: అనుకోకుండా
  alternative: పొరపాటున
  rationale: ఈ బలి నియమం ఉద్దేశపూర్వక తిరుగుబాటుతో కాక అనవధానంగా జరిగిన ఉల్లంఘనతో వ్యవహరిస్తుందని చూపుతుంది; నైతిక బాధ్యతను తొలగించేలా అదనంగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలి. మూలంలోని దీర్ఘ షరతు నిర్మాణాన్ని, తదుపరి వచనంతో కొనసాగుతుందనే భావాన్ని చివరి కామాతో నిలిపాం. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపానికి పాఠ్యంలో గుర్తు జోడించి, దాని సమష్టి అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
