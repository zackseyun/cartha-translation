id: LEV.4.11
reference: Leviticus 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: te
  text: కాని కోడె[b] తోలును[a], దాని మాంసమంతటినీ—దాని తల, కాళ్లు, అంతర్భాగాలు[c], పేడతో సహా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చర్మం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎద్దు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘లోపలి భాగాలు’; సందర్భాన్ని బట్టి ‘పేగులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: తోలు
  rationale: బలి అర్పణ సందర్భంలో వధించిన జంతువు చర్మాన్ని సూచించడానికి ‘తోలు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: הַפָּר
  choice: కోడె
  rationale: פַּר సాధారణంగా మగ పశువును, తరచుగా యౌవనంలోని ఎద్దును సూచిస్తుంది. ‘కోడె’ ఈ భావాన్ని సంక్షిప్తంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: כָּל בְּשָׂרוֹ
  choice: దాని మాంసమంతటినీ
  rationale: בָּשָׂר అనే పదంలోని స్పష్టమైన శరీరార్థాన్ని ‘మాంసం’ నిలుపుతుంది; ‘శరీరం’ కంటే ఇది బలి సందర్భానికి మరింత నిర్దిష్టం.
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: దాని తల, కాళ్లు ... సహా
  rationale: ఈ జాబితాలో עַל భాగాలన్నీ మాంసంతో కలిపి ఉన్నాయని సూచిస్తుంది. తెలుగులో ‘సహా’ అని ఒకసారి చెప్పడం సహజంగా ఉండి మూలంలోని సమ్మిళిత భావాన్ని నిలుపుతుంది.
- source_word: וְקִרְבּוֹ
  choice: అంతర్భాగాలు
  rationale: קֶרֶב ఇక్కడ జంతువు లోపలి అవయవాలు లేదా అంతర్గత భాగాలను సూచిస్తుంది. ‘అంతర్భాగాలు’ మూలపదంలోని విస్తృతతను అనవసరంగా ‘పేగులు’కే పరిమితం చేయదు.
- source_word: וּפִרְשׁוֹ
  choice: పేడ
  rationale: פֶּרֶשׁ ఇక్కడ జంతువు విసర్జిత పదార్థాన్ని నిర్దిష్టంగా సూచిస్తుంది. ‘పేడ’ నేరుగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
