translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన బలి సంబంధిత పదజాలం వాడబడింది. ఈ వచనం తరువాతి వచనంలో కొనసాగే అసంపూర్ణ వాక్యభాగం కాబట్టి చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. మూలంలోని ప్రారంభ וְ ను ముందటి వచనంతో ఉన్న వ్యత్యాసాన్ని బట్టి ‘కాని’గా అనువదించాం.
