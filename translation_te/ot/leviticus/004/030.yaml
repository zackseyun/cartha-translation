  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: te
  text: యాజకుడు దాని రక్తంలో కొంతను[a] తన వేలితో తీసుకొని, దహనబలి అర్పించే బలిపీఠపు కొమ్ముల మీద[b] పూయాలి. తరువాత దాని రక్తమంతటినీ[c] బలిపీఠపు అడుగు భాగంలో పోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని రక్తంలోనుండి.” హీబ్రూ పదబంధం అక్షరార్థంగా ఇలా ఉంది; ఇక్కడ బలిపీఠం మీద పూయడానికి రక్తంలో ఒక భాగాన్ని తీసుకోవడం ఉద్దేశంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “దహనబలి బలిపీఠపు కొమ్ములు.” ఇవి బలిపీఠపు మూలల్లో కొమ్ముల ఆకారంలో పైకి పొడుచుకొచ్చిన భాగాలు.
    reason: cultural_note
  - marker: c
    text: పాఠ్యం “దాని రక్తమంతటినీ” అని చెబుతున్నా, ముందుగా కొంత రక్తాన్ని బలిపీఠపు కొమ్ముల మీద పూసిన తరువాత మిగిలిన రక్తమంతా పోయాలని చర్యల క్రమం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తీసుకొని
  rationale: ఇది బలి ఆచారానికి సంబంధించిన విధి నియమం. అందువల్ల సాధారణ భూతకాలంగా కాక, తరువాతి ‘పూయాలి’ అనే విధ్యర్థక క్రియతో కలిసి ఆదేశాత్మక క్రమాన్ని తెలియజేసేలా అనువదించబడింది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్టంగా ఆచారాన్ని నిర్వహించే వ్యక్తిని సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: מִדָּמָהּ
  choice: దాని రక్తంలో కొంతను
  rationale: 'מִן ఇక్కడ భాగార్థకంగా ఉంది: మొత్తం రక్తాన్ని కాక, బలిపీఠపు కొమ్ముల మీద పూయడానికి దానిలో కొంత భాగాన్ని యాజకుడు తీసుకుంటాడు.'
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְּ సాధనార్థకంగా ఉంది; రక్తాన్ని తీసుకొని పూయడానికి ఉపయోగించే సాధనం యాజకుని వేలు.
- source_word: וְנָתַן
  choice: పూయాలి
  rationale: נתן ప్రాథమికంగా ‘పెట్టు/ఉంచు’ అని అర్థం. ద్రవమైన రక్తాన్ని బలిపీఠపు కొమ్ముల మీద వేలితో ఉంచే ఈ ఆచార సందర్భంలో ‘పూయాలి’ సహజంగా చర్యను తెలియజేస్తుంది.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: దహనబలి అర్పించే బలిపీఠపు కొమ్ముల మీద
  rationale: קַרְנוֹת అనే ప్రత్యేక ఆరాధనాపరమైన రూపకాన్ని ‘కొమ్ములు’ అని యథాతథంగా నిలిపి, מִזְבַּח הָעֹלָהను ఆధునిక తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: దాని రక్తమంతటినీ
  rationale: כָּל అనే సమగ్ర పదాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. ముందుగా కొంత రక్తం పూయబడినందున మిగిలిన రక్తమంతా ఉద్దేశమని సందర్భం సూచించినా, దాన్ని ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా మార్చలేదు.
- source_word: יִשְׁפֹּךְ
  choice: పోయాలి
  rationale: שׁפך బలి ఆచార సందర్భంలో ద్రవాన్ని పోయడాన్ని సూచిస్తుంది; ‘పోయాలి’ సహజమైన విధ్యర్థక తెలుగు రూపం.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠపు అడుగు భాగంలో
  rationale: יְסוֹד అంటే పునాది లేదా అడుగు భాగం. బలిపీఠ సందర్భంలో ‘అడుగు భాగం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: బలి ఆచార సూచనలో క్రియారూపాల కాలం/విధి
  choice: ‘పూయాలి … పోయాలి’ అని విధ్యర్థక ఆదేశంగా అనువదించడం
  alternative: ‘తీసుకున్నాడు … పూశాడు … పోశాడు’ అని భూతకాల కథనంగా అనువదించడం
  rationale: హీబ్రూ క్రియారూపాలను విడిగా చూస్తే భూతకాల భావం సాధ్యమైనా, ఈ వాక్యం నియమాత్మక బలి విధానంలో భాగం. విధ్యర్థక తెలుగు రూపాలు ప్రకరణ స్వభావాన్ని నిలుపుతాయి.
- issue: బలిపీఠపు అనుబంధాల ఆరాధనాపరమైన పదజాలం
  choice: קַרְנוֹתను ‘కొమ్ములు’ అని అనువదించడం
  alternative: ‘మూలలలోని పొడుచుకువచ్చిన భాగాలు’ లేదా కేవలం ‘మూలలు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ‘కొమ్ములు’ హీబ్రూ పాఠ్యంలోని నిర్దిష్ట రూపకాన్ని, ఆరాధనాపరమైన పదజాలాన్ని నిలుపుతుంది; వాటి రూపాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన విధి-నియమ శైలిని ఉపయోగించాం. ‘బలిపీఠం,’ ‘దహనబలి,’ ‘యాజకుడు,’ ‘కొమ్ములు’ వంటి ప్రధాన ఆరాధనాపరమైన పదాలను నిలిపి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం.
