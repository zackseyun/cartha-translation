lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దైవిక ప్రసంగాన్ని ప్రారంభించే ఈ సాధారణ హీబ్రూ సూత్రంలో דבר కు గౌరవప్రదమైన, సహజమైన తెలుగు సమానార్థకంగా ‘పలికాడు’ను ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమున్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
