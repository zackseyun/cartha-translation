  rationale: మాట్లాడే క్రియతో కూడిన אֶל సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ infinitive construct ను తెలుగులో సహజమైన ‘ఇలా’తో తెలిపి, ద్వంద్వ ప్రసంగక్రియను నివారించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చలేదు. ఉచ్చారణ పూర్తిగా నిర్ధారితం కానందున, తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వవచ్చు; అయితే ఈ చిన్న వాక్యంలో అవసరంలేని పాదసూచికను జోడించలేదు.
