id: LEV.4.8
reference: Leviticus 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: te
  text: 'పాపపరిహార బలికి చెందిన కోడెదూడలోనుండి అతడు దాని కొవ్వంతటినీ తీసివేయాలి: లోపలి అవయవాలను కప్పే కొవ్వును, లోపలి అవయవాల మీదనున్న కొవ్వంతటినీ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలికి చెందిన కోడెదూడ.” హీబ్రూ పదం חַטָּאת ‘పాపం’నూ, పాపం లేదా అపవిత్రతను తొలగించడానికి సంబంధించిన బలినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: అంతటినీ
  rationale: నిర్దేశించిన కొవ్వు మొత్తాన్ని తీసివేయాలనే హీబ్రూ పదంలోని సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలి జంతువులో ప్రత్యేకంగా వేరు చేయాల్సిన కొవ్వు భాగాలను సూచించే నేరుగా, సహజంగా అర్థమయ్యే పదం.
- source_word: פַּר הַחַטָּאת
  choice: పాపపరిహార బలికి చెందిన కోడెదూడ
  rationale: ఆ కోడెదూడ ఈ బలికి నిర్దేశించబడిందనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; חַטָּאת లోని ప్రత్యామ్నాయ ఆచారార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יָרִים
  choice: తీసివేయాలి
  rationale: మూలార్థం ‘పైకెత్తాలి’ అయినా, ఇక్కడ బలి జంతువు నుంచి నిర్దేశిత భాగాలను వేరు చేయడమే సందర్భోచిత భావం.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుంచి
  rationale: సూచన కోడెదూడను ఉద్దేశిస్తుంది; ఆచార ప్రక్రియలో సహజమైన నపుంసక సూచనను వాడింది.
- source_word: הַמְכַסֶּה
  choice: కప్పే
  rationale: కొవ్వు ఉన్న స్థానం, దాని కప్పే స్వభావం రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קֶרֶב
  choice: లోపలి అవయవాలు
  rationale: ఈ బలి-శరీర నిర్మాణ సందర్భంలో అంతర్గత భాగాలను సూచిస్తుంది; ‘పేగులు’ అని పరిమితం చేయకుండా మూలపదపు కొంత విస్తృత పరిధిని కాపాడుతుంది.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: వాటి మీద ఉన్న
  rationale: עַל అనే స్థానసూచక భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, కప్పే కొవ్వు మరియు అవయవాల మీద ఉన్న కొవ్వు అనే వర్ణనలను కొనసాగిస్తుంది.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమున్న బలిని సూచించడంతో పాటు శుద్ధీకరణ కార్యాన్ని కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో తెలుగు పాఠకులకు సుపరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార విధానానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే శైలిలోనూ అనువదించబడింది. మూలంలోని పునరుక్త ఆజ్ఞను తెలుగులో స్పష్టత కోసం కొనసాగించింది.
