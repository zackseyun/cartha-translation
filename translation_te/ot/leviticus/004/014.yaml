source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: te
  text: వారు చేసిన పాపం తెలిసినప్పుడు[a], సమాజం పాపపరిహార బలిగా మందలోని ఒక ఎద్దును సమర్పించి, దానిని సమాగమపు గుడారం ఎదుటికి తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో חַטָּאת (ఖట్టాత్) అనే ఒకే పదం ఈ వచనంలో రెండుసార్లు ఉంది: మొదట ‘పాపం’ అనే అర్థంలో, తరువాత ‘పాపపరిహార బలి’ అనే అర్థంలో.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: తెలిసినప్పుడు
  rationale: ידע నిఫాల్ రూపం పాపం వారి అవగాహనలోకి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘తెలిసినప్పుడు’ సహజంగా ఉండి, దాన్ని తెలియజేసిన వ్యక్తిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַחַטָּאת
  choice: పాపం
  rationale: ‘వారు చేసిన’ అనే సంబంధ వాక్యం ఇక్కడ חַטָּאת అనే పదానికి అపరాధం/పాపం అనే అర్థాన్ని నిర్ధారిస్తుంది.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: వారు చేసిన
  rationale: ‘పాపం చేశారు’ అనే సహజ తెలుగు ప్రయోగానికి అనుగుణంగా సంబంధ వాక్యాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; על అనే ఉపసర్గను కృత్రిమంగా అనువదించదు.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: ఆరాధనా-న్యాయ సందర్భంలోని సమష్టి ప్రజాసమూహాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది; సంఘం అనే పదానికి కలగగల ప్రత్యేక సంఘపరమైన భావాన్ని నివారిస్తుంది.
- source_word: וְהִקְרִיבוּ
  choice: సమర్పించి
  rationale: קרב హిఫీల్ బలిసంబంధ సందర్భంలో సమర్పించడాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘తీసుకురావాలి’తో అనవసర పునరుక్తి లేకుండా బలిసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: פַּר בֶּן בָּקָר
  choice: మందలోని ఒక కోడెదూడను
  rationale: ఈ పదబంధం పశువుల మందకు చెందిన మగ దూడను సూచిస్తుంది. ‘కోడెదూడ’ లింగాన్ని, వయోభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘మందలోని’ בֶּן בָּקָר యొక్క వర్గ/మూల భావాన్ని అందిస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: ఇక్కడ חַטָּאת బలి వర్గాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకునికి స్పష్టమైన, స్థిరమైన బలిసంబంధ పదప్రయోగం.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: దానిని ... తీసుకురావాలి
  rationale: బలిగా సమర్పించే కోడెదూడనే సూచించే కర్మ సర్వనామాన్ని నిలుపుతూ, בוא హిఫీల్ యొక్క ‘తీసుకురావడం’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం ఎదుటికి
  rationale: లేవీయకాండంలోని నిర్దిష్ట ఆరాధనా స్థలాన్ని సూచించే సంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు రూపం; לִפְנֵי యొక్క స్థానదిశను ‘ఎదుటికి’ తెలియజేస్తుంది.
theological_decisions:
- issue: ఒకే వచనంలో חַטָּאת పదానికి ఉన్న రెండు సందర్భార్థాలు
  choice: మొదటి చోట ‘పాపం’, రెండవ చోట ‘పాపపరిహార బలి’
  alternative: రెండు చోట్ల ఒకే పదబంధాన్ని వాడడం, లేదా రెండవ దానిని ‘శుద్ధీకరణ బలి’గా అనువదించడం
  rationale: మొదటి ప్రయోగాన్ని ‘వారు చేసిన’ అనే వాక్యం పాపకార్యంగా నిర్ధారిస్తుంది; לְחַטָּאתలో అదే నామవాచకం నిర్దేశిత బలి వర్గాన్ని సూచిస్తుంది. ఈ సందర్భభేదం పాఠాన్ని స్పష్టంగా ఉంచి, ఏ ప్రత్యేక సిద్ధాంతవ్యాఖ్యానాన్నీ బలవంతంగా చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ఆరాధనా సందర్భానికి తగిన ‘సమర్పించు’, ‘పాపపరిహార బలి’, ‘ప్రత్యక్షపు గుడారం’ పదాలను ఉపయోగించాం. వచనం ముందరి షరతు వాక్యానికి కొనసాగింపుగా ఉన్నప్పటికీ తెలుగులో సహజంగా చదవడానికి ‘తెలిసినప్పుడు’ అని నిర్మించాం.
