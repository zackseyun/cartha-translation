id: LEV.4.6
reference: Leviticus 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: te
  text: యాజకుడు తన వేలిని రక్తంలో ముంచి, దానిలోని కొంత రక్తాన్ని యెహోవా సన్నిధిలో, పవిత్రస్థలపు తెర ఎదుట[a] ఏడుసార్లు చిలకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధస్థలపు పరదా ఎదుట.”
    reason: פָּרֹכֶת הַקֹּדֶשׁకు ‘పవిత్రస్థలపు తెర’ అనే ప్రధాన అనువాదానికి ప్రత్యామ్నాయంగా, సాంప్రదాయ ఆచార-పదజాలంలో వాడే ‘పరిశుద్ధస్థలపు పరదా’ను సూచిస్తుంది; గుర్తును సంబంధిత పదబంధం వద్ద ఉంచబడింది.
lexical_decisions:
- source_word: וְטָבַל
  choice: ముంచి
  rationale: టבל యొక్క సాధారణ అర్థమైన ‘ముంచడం’ను సహజమైన తెలుగు క్రమబద్ధ క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆచారాన్ని నిర్వహించే నిర్దిష్ట యాజకుణ్ణి సూచించే ఏకవచన నామవాచకం.
- source_word: אֶצְבָּעוֹ בַּדָּם
  choice: తన వేలిని రక్తంలో
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజంగా ‘తన’తో చూపించి, בְּను ముంచబడే పదార్థాన్ని సూచించే ‘లో’గా అనువదించింది.
- source_word: וְהִזָּה
  choice: చిలకరించాలి
  rationale: యాజక ఆచార సందర్భంలో נזה హిఫీల్ ఉద్దేశపూర్వకంగా రక్తాన్ని చిలకరించడాన్ని సూచిస్తుంది; విధి సూచన భావాన్ని ‘ఆలి’ రూపం తెలియజేస్తుంది.
- source_word: מִן־הַדָּם
  choice: ఆ రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకం; మొత్తం రక్తాన్ని కాదు, దానిలో కొంతను చిలకరించడాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యాత్మక క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లִפְנֵי యొక్క స్థలాత్మక-ఆరాధనా భావాన్ని ‘సన్నిధిలో’ తెలియజేస్తుంది; దైవనామాన్ని యెహోవాగా లిప్యంతరీకరించింది.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: పవిత్రస్థలపు తెర ఎదుట
  rationale: פָּרֹכֶתను సాధారణ పాఠకులకు స్పష్టమైన ‘తెర’గా, הַקֹּדֶשׁను ఆ పవిత్ర ప్రదేశంగా, פניని దాని ముందుభాగాన్ని సూచించే ‘ఎదుట’గా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: לִפְנֵי יְהוָה మరియు אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ మధ్య సంబంధం
  choice: ‘యెహోవా సన్నిధిలో’ మరియు ‘పవిత్రస్థలపు తెర ఎదుట’ అనే రెండూ కలిసిన స్థలవివరణ
  alternative: ‘పవిత్రస్థలపు తెర ఎదుట’ అనేదే ‘యెహోవా సన్నిధిలో’ అనే భావానికి వివరణ
  rationale: హీబ్రూ వాక్యనిర్మాణం రెండు పదబంధాలనూ పక్కపక్కన ఉంచుతుంది. ప్రధాన పాఠం రెండింటినీ నిలుపుతుంది; వాటి పరస్పర సంబంధంలోని అస్పష్టతను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆచార భాషను ఉపయోగించింది. ‘చిలకరించాలి’ విధి స్వరాన్ని, ‘పవిత్రస్థలం’ ఆరాధనా ప్రదేశాన్ని సాంకేతిక భారంలేకుండా తెలియజేస్తాయి.
