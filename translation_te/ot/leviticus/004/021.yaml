- from: అతడు ఆ ఎద్దును శిబిరం వెలుపలికి తీసుకువెళ్లి, మొదటి ఎద్దును కాల్చినట్లే దానిని కూడా కాల్చాలి. అది సమాజం కోసం అర్పించే పాపపరిహార బలి[a].
  to: అతడు ఆ ఎద్దును శిబిరం వెలుపలకు తీసుకువెళ్లి, ముందటి ఎద్దును కాల్చినట్లే దానిని కాల్చాలి. అది సమాజానికి చెందిన పాపబలి[a].
