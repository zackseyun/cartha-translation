  text: וְ/הוֹצִ֣יא אֶת הַ/פָּ֗ר אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/שָׂרַ֣ף אֹת֔/וֹ כַּ/אֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַ/פָּ֣ר הָ/רִאשׁ֑וֹן חַטַּ֥את הַ/קָּהָ֖ל הֽוּא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: te
  text: అతడు ఆ ఎద్దును శిబిరం వెలుపలకు తీసుకువెళ్లి, ముందటి ఎద్దును కాల్చినట్లే దానిని కాల్చాలి. అది సమాజానికి చెందిన పాపబలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ పదం పాపంతో సంబంధాన్ని సూచించడమే కాక, అపవిత్రతను తొలగించడంలో ఈ బలి పాత్రను కూడా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: వెలుపలికి తీసుకువెళ్లి
  rationale: יצא హిఫీల్ రూపం ఒక వస్తువును బయటికి తీసుకుపోవడాన్ని సూచిస్తుంది; సందర్భంలోని గమనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַפָּר
  choice: ఆ ఎద్దును
  rationale: פַּר అంటే ఎద్దు లేదా కోడె; ముందు పేర్కొన్న బలి ఎద్దునే సూచిస్తున్నందున నిర్దిష్టత కోసం ‘ఆ ఎద్దును’ వాడబడింది.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: శిబిరపు హద్దుకు అవతల ఉన్న స్థలానికి తీసుకువెళ్లే గమనాన్ని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: וְשָׂרַף אֹתוֹ
  choice: దానిని కూడా కాల్చాలి
  rationale: שׂרף సాధారణంగా ‘కాల్చు’ అని అర్థం; పోలికలోని సమాంతర చర్య తెలుగులో స్పష్టంగా ఉండేందుకు ‘కూడా’ చేర్చబడింది.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: కాల్చినట్లే
  rationale: כַּאֲשֶׁר ఇక్కడ ముందటి చర్యతో సరిసమానమైన విధానాన్ని సూచిస్తుంది.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: మొదటి ఎద్దును
  rationale: רִאשׁוֹן ముందుగా వివరించిన ఎద్దును సూచిస్తుంది; ‘మొదటి ఎద్దు’ మూలానికి నేరుగా సరిపోతుంది.
- source_word: חַטַּאת
  choice: పాపపరిహార బలి
  rationale: బలుల సందర్భంలో חַטָּאת పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ తెలుగు పాఠకునికి అర్థవంతంగా ఉండి, ప్రత్యామ్నాయమైన శుద్ధీకరణ భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: קָהָל ఇక్కడ ఇశ్రాయేలు ప్రజాసమూహాన్ని సమష్టిగా సూచిస్తుంది; ‘సమాజం’ ఆధునిక, సహజ తెలుగు.
- source_word: הוּא
  choice: అది
  rationale: ఈ సర్వనామం ఎద్దును సమాజం కోసం అర్పించే బలిగా గుర్తిస్తుంది.
theological_decisions:
- issue: బలి నియమాల్లో חַטַּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలిని సూచించడంతో పాటు అపవిత్రతను తొలగించే శుద్ధీకరణ కార్యాన్ని కూడా ఉద్దేశించగలదు. ప్రధాన పాఠంలో సాధారణంగా అర్థమయ్యే ‘పాపపరిహార బలి’ ఉంచి, నిజమైన భావ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బలి సంబంధిత సాంకేతిక భావం సామాన్య పాఠకునికి స్పష్టంగా ఉండేలా ‘పాపపరిహార బలి’ వాడబడింది; మూలంలోని ప్రత్యామ్నాయ శుద్ధీకరణ భావం పాదటిప్పణిలో భద్రపరచబడింది.
