  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధి నిర్దేశానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. అనిశ్చిత శరీర నిర్మాణ పదానికి పాదసూచికను సంబంధిత పదం వద్దనే ఉంచాం.
