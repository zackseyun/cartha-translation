source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: te
  text: రెండు మూత్రపిండాలను, నడుము భాగంలో ఉన్న ఆ మూత్రపిండాలపైని కొవ్వును, అలాగే మూత్రపిండాలతో కలిపి కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని[a] అతడు తీసివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలేయపు లోబు.’ ఈ శరీర భాగాన్ని సూచించే హీబ్రూ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; అందుకే ‘అనుబంధ భాగం’ అని జాగ్రత్తగా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలను
  rationale: హీబ్రూ లెక్కింపు నిర్మాణంలోని నిర్దిష్టతను సహజమైన ఆధునిక తెలుగు శరీర నిర్మాణ పదంతో నిలుపుతుంది.
- source_word: הַחֵלֶב
  choice: కొవ్వును
  rationale: బలుల సందర్భంలో అర్పణకు ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: אֲשֶׁר עֲלֵיהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: వాటిమీద—అంటే నడుము భాగంలో—ఉన్న
  rationale: మొదటి సంబంధవాచక వాక్యం మూత్రపిండాల మీదున్న కొవ్వును సూచిస్తుంది; כְּסָלִיםను అతిగా నిర్దిష్టం చేయకుండా నడుము/పార్శ్వ ప్రాంతంగా అందిస్తుంది.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని
  rationale: יוֹתֶרֶת యొక్క ఖచ్చితమైన శరీర నిర్మాణ గుర్తింపు అనిశ్చితమైనందున ‘తమ్మె’ అని ఖచ్చితీకరించకుండా జాగ్రత్తగా అనువదిస్తుంది; עַל‌ను ‘మీద’గా ప్రతిబింబిస్తుంది.
- source_word: עַל הַכְּלָיוֹת
  choice: మూత్రపిండాలతో పాటు
  rationale: పదశః ‘మూత్రపిండాల మీద’ అయినా, పునరావృతమయ్యే బలి సూత్రంలో ఈ భాగాన్ని మూత్రపిండాలతో కలిపి తొలగించడాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: יְסִירֶנָּה
  choice: అతడు తీసివేయాలి
  rationale: హిఫిల్ క్రియలోని తొలగించే చర్యను, విధి నిర్దేశక శైలిని నిలుపుతుంది; ఏకవచన ప్రత్యయం జాబితాలోని భాగాలను సమష్టిగా సూచించగలదు.
