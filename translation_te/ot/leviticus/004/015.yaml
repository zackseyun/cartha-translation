id: LEV.4.15
reference: Leviticus 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: te
  text: సమాజపు పెద్దలు యాహ్వే సన్నిధిలో ఆ ఎద్దు తలపై తమ చేతులు ఉంచాలి; మరియు అతడు[a] యాహ్వే సన్నిధిలో ఆ ఎద్దును వధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“అతడు” ఎవరో హీబ్రూ పాఠం స్పష్టంగా చెప్పదు. ముందున్న “పెద్దలు” అనే బహువచనం తర్వాత ఇక్కడ ఏకవచన క్రియ వస్తుంది. మరో విధంగా అనువదించవచ్చు: “ఆ ఎద్దు యాహ్వే సన్నిధిలో వధించబడాలి.”'
    reason: మూలపాఠంలో బహువచన కర్త తర్వాత వచ్చే ఏకవచన క్రియ వల్ల ఏర్పడే అస్పష్టతను తెలియజేయడానికి.
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: ఉంచాలి
  rationale: బలి ఆచారంలో סמך చేతులను బలిపశువు తలపై ఉంచి ఆనించే క్రియను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చేతులు ఉంచాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: זִקְנֵי הָעֵדָה
  choice: సమాజపు పెద్దలు
  rationale: עֵדָה నిబంధన సమాజాన్ని సూచిస్తుంది; ‘సమాజం’ సాధారణ ఆధునిక పాఠకులకు సహజంగా ఉండి సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులు
  rationale: హీబ్రూలోని బహువచన రూపాన్ని నిలుపుతూ, తెలుగు ప్రతిబింబ సర్వనామం ‘తమ’ కర్తతో సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל רֹאשׁ הַפָּר
  choice: ఆ ఎద్దు తలపై
  rationale: బలి ఆచారంలోని స్థల సంబంధాన్ని నేరుగా తెలుపుతుంది; פַּר కు ‘ఎద్దు’ సరళమైన సమానార్థకం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’; ఆచార సందర్భంలో ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: וְשָׁחַט
  choice: తరువాత అతడు ... వధించాలి
  rationale: ముందున్న బహువచన కర్త తర్వాత మూలపాఠంలో వచ్చిన మూడవ పురుష ఏకవచన క్రియను నిలుపుతుంది. ‘వధించాలి’ బలి సందర్భానికి తగిన స్పష్టమైన పదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: వְשָׁחַט లోని ఏకవచన కర్తను ఎలా చూపాలి
  choice: అతడు వధించాలి
  alternative: ఎద్దు వధించబడాలి
  rationale: ‘పెద్దలు’ అనే బహువచనం నుంచి ఏకవచన క్రియకు హీబ్రూలో ఉన్న మార్పును నిలిపి, వధించేవాడు ప్రతినిధి వ్యక్తి కావచ్చనే అవకాశాన్ని తెరిచి ఉంచుతుంది; అయితే అతడు ఎవరో మూలపాఠం స్పష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; శాసనాత్మక ధోరణిని ‘చేయాలి’ రూపాలతో నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదజాలం ఉపయోగించబడింది. ప్రధాన పాఠంలో [a] సూచిక చేర్చబడింది.
