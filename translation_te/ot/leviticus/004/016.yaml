  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: te
  text: అప్పుడు అభిషిక్తుడైన యాజకుడు ఎద్దు రక్తంలో కొంత భాగాన్ని సమాగమపు గుడారంలోకి తీసుకురావాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఎద్దు రక్తం నుండి.” హెబ్రీలో ఇది భాగార్థక భావం కలిగివుంది; రక్తమంతా కాదు, కొంత మాత్రమే తీసుకురాబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “సమాగమపు గుడారం”కు సంప్రదాయ అనువాదం “గుడారము” లేదా “సన్నిధి గుడారం” అని కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: అప్పుడు ... తీసుకురావాలి
  rationale: సంయోజకాక్షరంతో వచ్చిన హిఫీల్ క్రియ ముందున్న కర్మకాండ క్రమాన్ని కొనసాగిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు ... తీసుకురావాలి’ క్రమాన్నీ విధినీ సహజంగా తెలియజేస్తుంది.
- source_word: הַ/כֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సందర్భంలోని כֹּהֵן‌కు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַ/מָּשִׁיחַ
  choice: అభిషేకించబడిన
  rationale: ఇక్కడ ఈ పదం పదవికోసం అభిషేకం పొందిన యాజకుణ్ణి సూచిస్తుంది; ‘మెస్సీయ’ అనే బిరుదును కాదు.
- source_word: מִ/דַּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; ఎద్దు రక్తమంతా కాక కొంత మాత్రమే లోపలికి తీసుకెళ్లబడుతుంది.
- source_word: הַ/פָּר
  choice: ఎద్దు
  rationale: బలి సందర్భంలో פַּר‌కు సహజమైన అర్థం ‘ఎద్దు’; ఈ వచనం మాత్రమే ‘కోడెదూడ’ అనే వయోసూచనను తప్పనిసరి చేయదు.
- source_word: אֶל
  choice: లోకి
  rationale: రక్తాన్ని తీసుకురావడం మరియు గమ్యస్థానంగా గుడారం ఉండడం అనే సందర్భంలో ప్రవేశ భావాన్ని ‘లోకి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: ఇశ్రాయేలీయుల పవిత్ర గుడారానికి తెలుగులో సుపరిచితమైన పేరు; ‘గుడారం’ మూలంలోని אֹהֶל భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజక సందర్భంలో הַמָּשִׁיחַ అనువాదం
  choice: అభిషేకించబడిన
  alternative: ప్రతిష్ఠించబడిన; మెస్సీయ
  rationale: ఈ పదం ఇక్కడ అభిషేకం ద్వారా పదవిలో నియమించబడిన యాజకుణ్ణి వర్ణిస్తోంది. ‘ప్రతిష్ఠించబడిన’ అనేది వ్యాఖ్యానాత్మకం; ‘మెస్సీయ’ ఈ కర్మకాండ సందర్భంలో తప్పుదారి పట్టిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కర్మకాండ నియమానికి తగిన గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. ‘తీసుకొని ... తీసుకురావాలి’ అనే పునరుక్తి తెలుగులో సహజంగా ఉన్నప్పటికీ, మూలంలోని తీసుకురావడం అనే చర్యను స్పష్టంగా నిలుపుతుంది.
