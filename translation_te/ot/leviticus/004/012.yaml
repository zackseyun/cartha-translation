id: LEV.4.12
reference: Leviticus 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הוֹצִ֣יא אֶת כָּל הַ֠/פָּר אֶל מִ/ח֨וּץ לַֽ/מַּחֲנֶ֜ה אֶל מָק֤וֹם טָהוֹר֙ אֶל שֶׁ֣פֶךְ הַ/דֶּ֔שֶׁן וְ/שָׂרַ֥ף אֹת֛/וֹ עַל עֵצִ֖ים בָּ/אֵ֑שׁ עַל שֶׁ֥פֶךְ הַ/דֶּ֖שֶׁן יִשָּׂרֵֽף־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: te
  text: అతడు ఆ ఎద్దు మొత్తాన్ని శిబిరం వెలుపల ఉన్న శుద్ధమైన స్థలానికి[a], అంటే బూడిదను పోసే చోటుకు[b], తీసుకెళ్లాలి. అక్కడ కట్టెలపై నిప్పుతో దాన్ని కాల్చాలి; బూడిదను పోసే చోటే అది కాల్చబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఆచారపరంగా శుద్ధమైన స్థలం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘బూడిదను పోసే స్థలం’; అంటే బలిపీఠపు బూడిదను పారవేయడానికి నియమించిన స్థలం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: తీసుకెళ్లాలి
  rationale: יצא యొక్క హిఫిల్ రూపం ‘బయటకు తీసుకెళ్లు’ అనే కారణార్థక, దిశాత్మక భావాన్ని ఇస్తుంది. ‘శిబిరం వెలుపల’ అనే గమ్యపదబంధంతో కలిసి ‘తీసుకెళ్లాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל הַפָּר
  choice: ఆ ఎద్దు మొత్తాన్ని
  rationale: כָּל అనే పదం జంతువు మొత్తాన్ని సూచిస్తుంది. మూలంలో లేని ‘కళేబరం’ వంటి వివరణను చేర్చకుండా సంపూర్ణతను నిలుపుతుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల ఉన్న
  rationale: శిబిరపు సరిహద్దులకు అవతల ఉన్న స్థలాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: מָקוֹם טָהוֹר
  choice: శుద్ధమైన స్థలం
  rationale: טָהוֹרకు శుభ్రతతో పాటు ఆచారపరమైన శుద్ధత భావం ఉండవచ్చు. ‘శుద్ధమైన’ అనే పదం ఆ లేవీయ సందర్భాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా నిలుపుతుంది; దాని ప్రత్యేక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: బూడిదను పోసే చోటు
  rationale: שֶׁפֶךְ పోయడం లేదా పారబోయడం జరిగే నిర్దిష్ట స్థలాన్ని సూచిస్తుంది; דֶּשֶׁן ఇక్కడ బలిపీఠపు బూడిదను సూచిస్తుంది. పదబంధాన్ని క్రియాత్మకంగా అనువదించడం ‘బూడిద కుప్ప’ కంటే మూలార్థాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: וְשָׂרַף אֹתוֹ
  choice: దాన్ని కాల్చాలి
  rationale: שׂרף యొక్క సాధారణ అర్థమైన ‘కాల్చు’ను నియమాత్మక శైలిలో అందిస్తుంది.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: కట్టెలపై నిప్పుతో
  rationale: עֵצִיםను ఇంధనమైన కట్టెలుగా, אֵשׁను కాల్చే అగ్నిగా విడివిడిగా నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: బూడిదను పోసే చోటే అది కాల్చబడాలి
  rationale: మూలంలోని నిష్క్రియ రూపాన్నీ, నిర్దిష్ట స్థలంపై ఉన్న చివరి పునరుద్ఘాటననూ ‘చోటే’ ద్వారా కాపాడుతుంది.
theological_decisions:
- issue: טָהוֹרలోని ఆచారపరమైన శుద్ధత భావం
  choice: శుద్ధమైన స్థలం
  alternative: ఆచారపరంగా శుద్ధమైన స్థలం
  rationale: లేవీయ సందర్భంలో ఆచారపరమైన శుద్ధత ఉద్దేశించబడే అవకాశం బలంగా ఉంది. అయితే మూలపదంలో లేని వివరణను ప్రధాన పాఠ్యంలో నేరుగా చేర్చకుండా, ఆ భావాన్ని పాదసూచికలో స్పష్టం చేయడం మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- issue: שֶׁפֶךְ הַדֶּשֶׁן సూచించే బలి సంబంధిత విసర్జన స్థలం
  choice: బూడిదను పోసే చోటు
  alternative: బూడిద కుప్ప
  rationale: ఇది ఏదో ఒక బూడిద కుప్పను కాకుండా, బలిపీఠపు బూడిదను తీసుకెళ్లి పోసే నియమిత స్థలాన్ని సూచిస్తుంది. అందువల్ల క్రియాత్మక పదబంధం మరింత నిర్దిష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నియమాత్మక శైలి ఉపయోగించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినప్పటికీ, చివరి స్థల-పునరుద్ఘాటనను అలాగే నిలిపాం.
