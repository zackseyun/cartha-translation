source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: te
  text: తర్వాత యాజకుడు రక్తంలో తన వేలిని ముంచి, యాహ్వే సన్నిధిలో తెర[a] ఎదుట ఏడుసార్లు చిలకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముసుగు తెర.” హీబ్రూ పదం పవిత్రస్థలంలోని భాగాలను వేరు చేసే ఆలయ తెరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: తర్వాత ... ముంచి
  rationale: టבל అంటే ‘ముంచడం.’ వావ్-క్రమం సూచించే తదుపరి ఆచార చర్యను ‘తర్వాత’ సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: బలుల సంబంధమైన ధర్మశాస్త్ర సందర్భంలో כֹּהֵן‌కు సహజమైన ప్రామాణిక తెలుగు పదం; నిర్దిష్టతను సందర్భం తెలియజేస్తుంది.
- source_word: אֶצְבָּעוֹ
  choice: తన వేలిని
  rationale: ఏకవచనాన్ని నిలుపుతూ, కర్తకే చెందిన వేలని తెలుగులో సహజంగా ‘తన’తో వ్యక్తం చేస్తుంది.
- source_word: מִן הַדָּם
  choice: ఆ రక్తంలో ... ఆ రక్తంలో కొంత
  rationale: ముంచే క్రియతో తెలుగులో ‘రక్తంలో’ సహజం; מן‌లోని భాగార్థాన్ని చిలకరించే పదబంధంలో ‘ఆ రక్తంలో కొంత’ అని స్పష్టంగా నిలిపింది.
- source_word: וְהִזָּה
  choice: చిలకరించాలి
  rationale: యాజక ఆచార సందర్భంలో הזה ద్రవాన్ని, ఇక్కడ రక్తాన్ని, చిలకరించడాన్ని సూచిస్తుంది. విధి నిర్దేశక భావాన్ని ‘చిలకరించాలి’ తెలియజేస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: సంఖ్యను, పునరావృత చర్యను నేరుగా మరియు సహజంగా అనువదిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ భావాన్ని ఆరాధనా సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: తెర ఎదుట
  rationale: ‘తెర ముఖభాగం/ఎదుట’ అనే స్థల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; פָּרֹכֶת పరిశుద్ధ స్థలాన్ని వేరు చేసే తెర.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: פָּרֹכֶת పదం అనువాదం
  choice: తెర
  alternative: ముసుగు తెర
  rationale: ‘తెర’ సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; ఇది పరిశుద్ధ స్థలంలోని విభజన తెర అని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచార విధి స్వరాన్ని గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచింది. పాదసూచిక గుర్తును దాని అసలు పదమైన ‘తెర’ వద్ద ఉంచింది.
