source:
  edition: WLC
  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: te
  text: లేదా, తాను చేసిన పాపం అతనికి తెలియవస్తే[a], తాను చేసిన ఆ పాపం నిమిత్తం లోపంలేని ఆడ మేకను తన అర్పణగా తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి తెలియజేయబడితే.” హీబ్రూ నిష్క్రియ క్రియారూపం ఆ పాపం అతనికి స్వయంగా తెలిసివచ్చిన భావాన్నీ, మరొకరు దాన్ని అతనికి తెలియజేసిన భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: లేదా
  rationale: ముందటి నియమానికి ప్రత్యామ్నాయ పరిస్థితిని పరిచయం చేస్తుంది; షరతు భావం తరువాతి క్రియారూపం ద్వారా స్పష్టమవుతుంది.
- source_word: הוֹדַע אֵלָיו
  choice: అతనికి తెలియవస్తే
  rationale: హొఫాల్ రూపంలోని నిష్క్రియ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వ్యక్తి తానే గ్రహించడం లేదా మరొకరు తెలియజేయడం అనే రెండు సాధ్యార్థాలనూ తెరిచి ఉంచుతుంది.
- source_word: חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: తాను చేసిన పాపం
  rationale: ఇక్కడ חַטָּאתוֹ బలి అర్పణను కాక, అతడు చేసిన పాపకార్యాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చేసిన పాపం’ సహజంగా ఉంది.
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: ధర్మశాస్త్ర ఆదేశంలోని నిర్దేశక బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణగా
  rationale: క్రియతో సహజంగా కలుస్తూ, దేవుని సన్నిధికి తీసుకొచ్చే కానుక లేదా బలి అనే సాధారణ అర్పణ భావాన్ని నిలుపుతుంది.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: ఆడ మేకను
  rationale: జంతువు ఆడదని మూలపాఠం స్పష్టంగా చెప్పిన విషయాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְּמִימָה
  choice: లోపంలేని
  rationale: బలికి తగిన జంతువుకు శారీరక దోషం ఉండకూడదనే ఆచారపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: తాను చేసిన ఆ పాపం నిమిత్తం
  rationale: అర్పణకు ఆ పాపంతో ఉన్న సంబంధాన్ని తెలియజేస్తుంది; కారణం, ప్రయోజనం మధ్య అవసరానికి మించిన వివరణను జోడించదు.
theological_decisions:
- issue: ఆచారపరమైన సందర్భంలో חַטָּאת పదానికి అర్థం
  choice: ఈ వచనంలోని రెండు సందర్భాల్లోనూ ‘పాపం’ అని అనువదించడం
  alternative: రెండవ సందర్భాన్ని ‘పాపపరిహారార్థ బలి’ అని అనువదించడం
  rationale: అర్పణను వేరుగా קָרְבָּנוֹ అని పేర్కొని, అది ఆడ మేక అని వివరించారు. అందువల్ల పునరుక్తమైన חַטָּאתוֹ ఇక్కడ అర్పణను కాక, దాని నిమిత్తం అర్పణ తీసుకురావలసిన పాపాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని అనుసరించాం. మూలంలోని పాపం గురించిన పునరుక్తిని భావస్పష్టత కోసం నిలిపి, రెండవసారి ‘ఆ పాపం’ అని సహజీకరించాం. ‘తెలియవస్తే’ ద్వారా మూలంలోని నిజమైన నిష్క్రియాత్మక అస్పష్టతను కాపాడాం.
