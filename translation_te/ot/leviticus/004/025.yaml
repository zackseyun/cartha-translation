id: LEV.4.25
reference: Leviticus 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: te
  text: తర్వాత యాజకుడు పాపబలి[a] రక్తంలో కొంత తన వేలితో తీసుకుని, దహనబలి బలిపీఠపు కొమ్ముల మీద పూయాలి. మిగిలిన రక్తాన్ని దహనబలి బలిపీఠపు అడుగు భాగం దగ్గర కుమ్మరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ పదం పాపంతో సంబంధమున్న బలిని, అలాగే అపవిత్రతను తొలగించడానికి సంబంధించిన బలిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: తర్వాత ... తీసుకుని
  rationale: వావ్‌తో కూడిన క్రియ బలి ప్రక్రియలో తదుపరి దశను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తర్వాత’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִדַּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; మొత్తం రక్తం కాక దానిలో కొంత మాత్రమే వేలితో తీసుకుంటారని స్పష్టం చేస్తుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఇక్కడ పదం పాపాన్ని కాక, పాపం లేదా అపవిత్రత తొలగింపుతో సంబంధమున్న బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ తెలుగు పాఠకులకు స్పష్టమైన సంప్రదాయపరమైన పదబంధం.
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְּ ఇక్కడ సాధనార్థకంగా ఉంది; యాజకుడు తన వేలిని ఉపయోగిస్తాడని తెలియజేస్తుంది.
- source_word: וְנָתַן עַל
  choice: మీద పూయాలి
  rationale: రక్తాన్ని బలిపీఠపు కొమ్ములపై ఉంచే ఆచారక్రియను తెలుగులో ‘పూయాలి’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קַרְנוֹת
  choice: కొమ్ములు
  rationale: బలిపీఠపు మూలల వద్ద ఉన్న కొమ్ములవంటి పొడుచులను సూచించే స్థిరమైన ఆచారపదం.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: దహనబలులతో సంబంధమున్న బయటి బలిపీఠాన్ని సంక్షిప్తంగా, సహజంగా గుర్తిస్తుంది.
- source_word: וְאֶת־דָּמוֹ יִשְׁפֹּךְ
  choice: మిగిలిన రక్తాన్ని ... కుమ్మరించాలి
  rationale: ముందు రక్తంలో కొంత తీసుకున్నందున తరువాతి క్రియ మిగిలిన రక్తానికి సంబంధించినదని సందర్భం సూచిస్తుంది; ‘కుమ్మరించాలి’ שׁפך యొక్క ప్రత్యక్ష చర్యను అందిస్తుంది.
- source_word: אֶל יְסוֹד
  choice: అడుగు భాగం దగ్గర
  rationale: יְסוֹד బలిపీఠపు పునాది లేదా అడుగు ప్రాంతాన్ని సూచిస్తుంది; ‘దగ్గర’ గమ్యస్థాన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: బలి నియమాలలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో పదం ఒక బలి జంతువు లేదా బలి ఆచారాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ పాపంతో సంబంధాన్ని నిలుపుతూ ఏ ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్నీ బలవంతంగా రుద్దదు; అపవిత్రత తొలగింపు భావాన్ని సూచించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. విధి వాక్యాలకు ‘చేయాలి’ రూపం ఉపయోగించబడింది; మూలంలోని క్రమం మరియు భాగార్థం స్పష్టంగా నిలుపబడ్డాయి.
