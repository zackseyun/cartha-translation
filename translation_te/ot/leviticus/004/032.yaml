  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: te
  text: ఎవరైనా పాపబలిగా[a] గొర్రెపిల్లను తన అర్పణగా తీసుకువస్తే, లోపంలేని ఆడ గొర్రెపిల్లనే తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ పదం חַטָּאת పాపంతోనూ ఆచార అపవిత్రతతోనూ వ్యవహరించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: తీసుకొస్తే
  rationale: ప్రత్యామ్నాయ అర్పణ సందర్భాన్ని పరిచయం చేసే షరతును సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది; ముందున్న సందర్భంతో అనుసంధానం కొనసాగుతుంది.
- source_word: כֶּבֶשׂ
  choice: గొర్రెపిల్లను
  rationale: బలి నియమాల సందర్భంలో గొర్రెల మందకు చెందిన చిన్న జంతువును సూచించే సహజమైన, సాంప్రదాయిక తెలుగు పదం; తరువాతి స్త్రీలింగ నిర్దేశంతో సరిపోతుంది.
- source_word: יָבִיא
  choice: తీసుకొస్తే
  rationale: בוא ధాతువు హిఫిల్ రూపంలోని ‘తీసుకురావడం’ అనే స్పష్టమైన చర్యను నిలుపుతూ షరతు వాక్యంలో సహజంగా ఉంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణగా
  rationale: దేవుని సన్నిధికి తీసుకొచ్చే కానుక అనే భావాన్ని, స్వామ్యార్థక ప్రత్యయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: లేవీయకాండంలోని ప్రత్యేక బలి వర్గాన్ని సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది; ‘శుద్ధీకరణ బలి’ అనే నిజమైన భావసాధ్యతను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: נְקֵבָה
  choice: ఆడ గొర్రెపిల్లను
  rationale: అర్పించవలసిన జంతువు లింగాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תְמִימָה
  choice: లోపంలేని
  rationale: బలి జంతువుకు శారీరక దోషం లేదా కళంకం ఉండకూడదనే ఆచార సంబంధమైన భావాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: יְבִיאֶנָּה
  choice: తీసుకురావాలి
  rationale: స్త్రీలింగ ప్రత్యయం సూచించే ఆడ జంతువును తెలుగులో స్పష్టంగా పునరుద్ధరిస్తూ నియమాత్మక బలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: బలి నియమాలలో חַטָּאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో వ్యవహరించే బలిని సూచించగలదు; లేవీయకాండంలో ఆచార అపవిత్రత నుంచి శుద్ధీకరణ భావాన్ని కూడా కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సులభంగా గుర్తించగల సంప్రదాయ వర్గపేరును ఉంచి, భావపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. బలి నియమంలోని పునరుక్తిని కొంతవరకు నిలుపుతూ సహజమైన షరతు నిర్మాణాన్ని ఉపయోగించాం; పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
