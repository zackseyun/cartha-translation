revisions:
- from: సామాన్య ప్రజల్లో ఒక వ్యక్తి, చేయకూడదని యెహోవా ఆజ్ఞాపించిన వాటిలో ఒకదాన్ని చేసి, అనుకోకుండా పాపం చేసి అపరాధి అయితే,[a][b]
  to: సామాన్య ప్రజల్లోని ఒక వ్యక్తి అనుకోకుండా పాపం చేసి, యెహోవా చేయకూడదని ఆజ్ఞాపించిన వాటిలో ఒకదాన్ని చేయడం ద్వారా అపరాధిగా మారితే,[a][b]
