source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: te
  text: సామాన్య ప్రజల్లోని ఒక వ్యక్తి అనుకోకుండా పాపం చేసి, యెహోవా చేయకూడదని ఆజ్ఞాపించిన వాటిలో ఒకదాన్ని చేయడం ద్వారా అపరాధిగా మారితే,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేశపు ప్రజలలో నుండి.” ఇక్కడ ఈ మాట యాజకుడు లేదా నాయకుడికి భిన్నంగా సమాజంలోని ఒక సాధారణ సభ్యుణ్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “అపరాధాన్ని మోస్తే” లేదా “అపరాధిగా ఉంటే” అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ అపరాధస్థితిలోకి రావడం లేదా అపరాధాన్ని భరించడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: ఒక వ్యక్తి
  rationale: న్యాయపరమైన ఈ సందర్భంలో נֶפֶשׁ ఒక వ్యక్తిని సూచిస్తుంది; ‘ఒక వ్యక్తి’ ఏకవచనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵעַם הָאָרֶץ
  choice: సామాన్య ప్రజల్లో
  rationale: చుట్టుపక్కల నియమాల్లో యాజకుడు, సమాజమంతా, నాయకుడు అనే వర్గాలకు భిన్నంగా సాధారణ సమాజ సభ్యుణ్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: అనుకోకుండా పాపం చేసి
  rationale: בִשְׁגָגָה బలుల నియమాల సందర్భంలో ఉద్దేశపూర్వకం కాని తప్పును సూచిస్తుంది; ఈ అనువాదం ఆ న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּעֲשֹׂתָהּ אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: చేయకూడదని యెహోవా ఆజ్ఞాపించిన వాటిలో ఒకదాన్ని చేసి
  rationale: హీబ్రూ వాక్యభాగం యెహోవా ఆజ్ఞల్లో నిషేధించబడిన కార్యాల్లో ఒకదాన్ని చేయడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు భావసంబంధాన్ని స్పష్టంగా అమర్చింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: וְאָשֵׁם
  choice: అపరాధి అయితే
  rationale: ఈ క్రియ పాపకార్య ఫలితంగా అపరాధస్థితిలోకి రావడం లేదా అపరాధాన్ని మోయడం అనే భావాలను కలిగి ఉంటుంది; ‘అపరాధి అయితే’ ఆ న్యాయపరమైన స్థితిని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: מֵעַם הָאָרֶץ అనే సామాజిక-న్యాయ వర్గం
  choice: సామాన్య ప్రజల్లో
  alternative: దేశ ప్రజల్లో
  rationale: ఇక్కడ ఇది భూభాగ నివాసులను సాధారణంగా సూచించడం కంటే, యాజకుడు లేదా నాయకుడికి భిన్నమైన సాధారణ సమాజ సభ్యుణ్ని సూచిస్తుంది. ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- issue: וְאָשֵׁם యొక్క భావబలం
  choice: అపరాధి అయితే
  alternative: అపరాధాన్ని మోస్తే / అపరాధిగా ఉన్నట్లయితే
  rationale: హీబ్రూ రూపం అపరాధస్థితిలోకి రావడం లేదా అపరాధాన్ని భరించడం రెండింటికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం సందర్భానుసారంగా సహజమైన రూపాన్ని వాడి, భావవిస్తృతిని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి. వాక్యం తదుపరి వచనంతో కొనసాగుతుందనే అసంపూర్ణ షరతు నిర్మాణాన్ని నిలిపేందుకు చివరలో కామా ఉంచబడింది.
