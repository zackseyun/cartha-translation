id: LEV.4.18
reference: Leviticus 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: te
  text: ఆ రక్తంలో కొంతను అతడు సమావేశ గుడారంలో యాహ్వే ఎదుట ఉన్న బలిపీఠపు కొమ్ముల మీద వేయాలి. ఆ రక్తమంతటినీ సమావేశ గుడారం ప్రవేశద్వారం వద్ద ఉన్న దహనబలి బలిపీఠపు అడుగు భాగం వద్ద పోయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: ఆ రక్తంలో కొంత
  rationale: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా ‘రక్తంలోనుండి’ అని మొదలవుతుంది. తరువాత వచ్చే ‘రక్తమంతటినీ’ అనే మాటతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచేందుకు తెలుగులో అంతర్లీనమైన భాగార్థాన్ని ‘కొంత’తో వ్యక్తం చేశాం.
- source_word: יִתֵּן
  choice: వేయాలి
  rationale: נתן అనే సాధారణ క్రియకు ‘ఇవ్వడం/పెట్టడం’ అనే అర్థాలున్నాయి. ద్రవరూప రక్తాన్ని బలిపీఠపు కొమ్ముల మీద ఉంచే సందర్భంలో ‘వేయాలి’ సహజంగా ఉండి, ‘పూయాలి’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములు
  rationale: ‘కొమ్ములు’ అనేది మూలపదపు ప్రత్యక్ష రూపకం; బలిపీఠ నిర్మాణానికి సంబంధించిన ఈ ఆచారపరమైన పదాన్ని సరళీకరించకుండా నిలిపాం.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: యాహ్వే ఎదుట ఉన్న
  rationale: לִפְנֵי లోని స్థలార్థమైన ‘ఎదుట’ను ప్రధానంగా ఉంచుతూ, దేవుని సన్నిధి అనే భావసూచనను కూడా పూర్తిగా మూసివేయని రూపాన్ని ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణను ఉపయోగించాం.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: ‘కలుసుకునే/సమావేశపు గుడారం’ అనే మూలార్థాన్ని పారదర్శకంగా తెలియజేసే ఆధునిక తెలుగు రూపం; ‘ప్రత్యక్షపు గుడారం’ వంటి సంప్రదాయమైనా తక్కువ పారదర్శకమైన పదబంధాన్ని నివారించాం.
- source_word: וְאֵת כָּל הַדָּם
  choice: ఆ రక్తమంతటినీ
  rationale: సందర్భంలో మిగిలిన రక్తం ఉద్దేశించబడినప్పటికీ, హీబ్రూ నేరుగా ‘రక్తమంతటినీ’ అంటుంది. మూలంలోని వ్యక్తీకరణను, దానివల్ల కలిగే స్వల్ప ఉద్రిక్తతను అలాగే ఉంచాం.
- source_word: יִשְׁפֹּךְ
  choice: పోయాలి
  rationale: రక్తాన్ని బలిపీఠపు అడుగు భాగం వద్ద కుమ్మరించే చర్యకు సహజమైన ఆధునిక తెలుగు క్రియ.
- source_word: אֶל יְסוֹד
  choice: అడుగు భాగం వద్ద
  rationale: יְסוֹד కు ‘పునాది/అడుగు భాగం’ అనే అర్థం ఉంది. బలిపీఠ సందర్భంలో ‘అడుగు భాగం’ స్పష్టంగా, సహజంగా ఉంటుంది; אֶל సూచించే గమ్యస్థానాన్ని ‘వద్ద’ తెలియజేస్తుంది.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: עֹלָה అనే సంపూర్ణంగా దహించబడే బలి పేరును ‘దహనబలి’గా, దానికి సంబంధించిన బలిపీఠాన్ని సంక్షిప్తమైన సహజ పదబంధంతో అనువదించాం.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గర ఉన్న
  rationale: פֶּתַח లోని ‘ప్రవేశం/తెరువు’ భావాన్ని ‘ప్రవేశద్వారం’ స్పష్టంగా అందిస్తుంది; స్థల సంబంధాన్ని సహజ తెలుగులో ‘దగ్గర ఉన్న’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, ఆధునిక పరిశోధనలో విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
- issue: לִפְנֵי లోని స్థలార్థం మరియు సన్నిధి భావం
  choice: యాహ్వే ఎదుట
  alternative: యాహ్వే సన్నిధిలో
  rationale: ఈ సందర్భంలో బలిపీఠపు స్థానం ప్రధానమైనందున ‘ఎదుట’ను ఎంచుకున్నాం. ‘సన్నిధిలో’ అనేది సాధ్యమైన భావవిస్తరణ అయినా, అది స్థలవివరణను మరింత ఆధ్యాత్మికంగా వ్యాఖ్యానించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. విధినిర్దేశక భావానికి ‘వేయాలి/పోయాలి’ రూపాలను ఉపయోగించాం; సంప్రదాయ పదజాలంలో అస్పష్టంగా మారే చోట ‘సమావేశ గుడారం’, ‘ప్రవేశద్వారం’, ‘అడుగు భాగం’ వంటి పారదర్శక రూపాలను ఎంచుకున్నాం.
