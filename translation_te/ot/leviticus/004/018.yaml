  terminology: ‘యాహ్వే,’ ‘సమావేశ గుడారం,’ ‘బలిపీఠపు కొమ్ములు,’ ‘దహనబలి బలిపీఠం,’ మరియు ‘అడుగు భాగం’ పదాలు మూలపాఠానికి నమ్మకంగా ఉండి, ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉన్నాయి. పాదసూచికలో భాగార్థ వివరణ సముచితమైనది.
