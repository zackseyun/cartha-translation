source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: te
  text: అతడు పాపపరిహార బలి తల మీద తన చేయి ఉంచి, దహనబలిని వధించే స్థలంలో దానిని పాపపరిహార బలిగా వధించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపపరిహార బలి’ అని వచ్చిన రెండు చోట్లా ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం పాపంతోను ఆచారపరమైన అపవిత్రతతోను వ్యవహరించే బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ
  choice: తల మీద తన చెయ్యి ఉంచి
  rationale: సంస్కార సందర్భంలో סמך అనేది బలి జంతువు తలపై చెయ్యి ఉంచడం లేదా ఆనించడం సూచిస్తుంది. హెబ్రీలో ‘చెయ్యి’ ఏకవచనంలో ఉన్నందున తెలుగులోనూ ఏకవచనమే నిలుపబడింది.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: పాపపరిహార బలి / పాపపరిహార బలిగా
  rationale: חטאת పాపంతో వ్యవహరించే బలిని సూచిస్తుంది; శుద్ధీకరణ భావం కూడా దీనిలో ఉండవచ్చు. ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే స్థిరమైన పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉపయోగించి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: שׁחט బలి జంతువును ఆచారబద్ధంగా వధించడానికి వాడే సాంకేతిక క్రియ. ‘చంపాలి’ కంటే ‘వధించాలి’ బలి సందర్భానికి తగిన గౌరవప్రదమైన పదం.
- source_word: אֹתָהּ
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న బలి జంతువును సూచిస్తుంది; తెలుగులో సహజంగా ‘దానిని’ అని అనువదించబడింది.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: దహనబలి జంతువును వధించే స్థలంలోనే
  rationale: ఈ పదబంధం నిర్ణీత వధస్థలాన్ని సూచిస్తుంది. హెబ్రీ క్రియ రూపాన్ని తెలుగు విధినియమ శైలిలో సహజమైన సాధారణ కర్తృవాచక నిర్మాణంతో ఇచ్చాం; ‘జంతువు’ను చేర్చడం వధించబడేది బలి రకం అనే అమూర్త భావం కాదని స్పష్టం చేస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עלה పూర్తిగా దహించబడే బలికి ప్రామాణిక నామం. ‘ఆరోహణ బలి’ వ్యుత్పత్తిని చూపినా సాధారణ తెలుగు పాఠకులకు తక్కువ సహజం.
theological_decisions:
- issue: బలి సంబంధ సందర్భంలో חטאת పదానికి అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో వ్యవహరించే బలినీ, ఆచార అపవిత్రతను తొలగించే శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘పాపపరిహార బలి’ని ఉంచి, నిజమైన శుద్ధీకరణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండంలోని విధినియమ శైలికి తగిన గంభీరమైనా సులభంగా అర్థమయ్యే భాష వాడబడింది. హెబ్రీలోని ఏకవచన ‘చెయ్యి’ నిలుపబడింది; చట్టపరమైన ఆజ్ఞను తెలుగులో సహజంగా ‘వధించాలి’తో వ్యక్తం చేశాం.
