source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: te
  text: అతడు దాని కొవ్వంతటినీ తీసివేయాలి. సమాధానబలి కోసం అర్పించిన గొర్రెపిల్ల కొవ్వును ఎలా తీసివేస్తారో అలాగే దానిని తీసివేయాలి. యాజకుడు ఆ కొవ్వు భాగాలను బలిపీఠం మీద యెహోవాకు అగ్నితో అర్పించే అర్పణలపై దహించాలి.[a] అతడు చేసిన పాపం విషయంలో యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు అతనికి క్షమాపణ లభిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు అగ్నితో అర్పించే అర్పణల మీద.” హీబ్రూ పదబంధం బలి ఆచారానికి సంబంధించిన సాంకేతిక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: కొవ్వు / కొవ్వు భాగాలు
  rationale: బలి జంతువు నుండి వేరుచేసి బలిపీఠంపై దహించే నిర్దిష్ట కొవ్వును సూచిస్తుంది. మొదట ఏకవచన సమష్టి భావానికి ‘కొవ్వంతటినీ’, తరువాత אֹתָם అనే బహువచన సర్వనామాన్ని ప్రతిబింబించేందుకు ‘కొవ్వు భాగాలను’ వాడాం.
- source_word: יָסִיר / יוּסַר
  choice: తీసివేయాలి / తీసివేస్తారో
  rationale: హిఫిల్ రూపం బలి ప్రక్రియలో కొవ్వును జంతువు నుండి వేరుచేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తీసివేయడం’ సహజంగా ఉంది.
- source_word: הַכֶּשֶׂב
  choice: గొర్రెపిల్ల
  rationale: ఈ బలి సందర్భంలో כֶּשֶׂב సాధారణంగా చిన్న గొర్రెను సూచిస్తుంది; విస్తృతమైన ‘గొర్రె’ కంటే ‘గొర్రెపిల్ల’ సందర్భానికి సరిగ్గా సరిపోతుంది.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి అర్పణ
  rationale: ఇది ఒక సాంకేతిక బలి వర్గం. ‘సమాధాన బలి’ సంప్రదాయ భావాన్ని నిలుపుతూ, ‘అర్పణ’ అనే పదం זֶבַח యొక్క బలి చర్యను స్పష్టం చేస్తుంది.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠంపై అర్పణను కాల్చి పొగగా పైకి లేపే ఆచారాన్ని సూచిస్తుంది; ‘దహించాలి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֹתָם
  choice: ఆ కొవ్వు భాగాలను
  rationale: హీబ్రూలో సర్వనామం పురుషలింగ బహువచనం. తెలుగులో అస్పష్టమైన ‘వాటిని’ బదులు దాని సూచ్యార్థాన్ని వెల్లడిస్తూ బహువచనాన్ని నిలిపాం.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలపై
  rationale: אִשֵּׁי అనే సాంకేతిక బలి పదబంధంలో అగ్నితో అర్పించే అర్పణలు ఉద్దేశించబడ్డాయి. עַל ను ‘పై’గా ఉంచి, ఆచార సంబంధాన్ని అనవసరంగా పరిష్కరించలేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా ఇచ్చాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: וְכִפֶּר עָלָיו
  choice: అతని కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి సందర్భంలోని כפר యొక్క విస్తృత ఆచార-దైవశాస్త్ర భావాన్ని ‘ప్రాయశ్చిత్తం చేయడం’ నిలుపుతుంది; ఒక ప్రత్యేక సిద్ధాంతంగా సంకుచితం చేయదు.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపం విషయంలో
  rationale: హీబ్రూ పదబంధంలోని సంబంధాన్ని సహజ తెలుగులో చూపుతుంది; మూలంలోని పునరుక్తిని అర్థం మారకుండా సునిశితం చేసింది.
- source_word: וְנִסְלַח לוֹ
  choice: అతనికి క్షమాపణ లభిస్తుంది
  rationale: నిఫాల్ రూపం క్షమించబడే ఫలితాన్ని తెలుపుతుంది. తెలుగు కర్మణి నిర్మాణం కంటే ఇది సహజంగా ఉండి, క్షమను ఎవరు ప్రసాదిస్తారో మూలంలాగే ప్రత్యక్షంగా చెప్పకుండా ఉంచుతుంది.
theological_decisions:
- issue: బలి సంబంధమైన כפר పదం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పాపపరిహారం చేయాలి
  rationale: ‘ప్రాయశ్చిత్తం’ బైబిలు బలి సందర్భంలోని విస్తృత భావాన్ని నిలుపుతుంది; దాని కార్యవిధానాన్ని ఒక నిర్దిష్ట సిద్ధాంతానికి పరిమితం చేయదు.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చలేదు. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: עַל אִשֵּׁי יְהוָה యొక్క సంబంధం
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలపై
  alternative: యెహోవాకు అగ్ని అర్పణగా
  rationale: עַל యొక్క సాధారణ స్థానార్థమైన ‘పై’ను ప్రధాన పాఠంలో నిలిపి, అది ముందున్న అర్పణల మీద ఉంచడమా లేక అగ్ని అర్పణ వర్గాన్ని సూచించడమా అన్న స్వల్ప అస్పష్టతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. బలి సంబంధిత సాంకేతిక పదాలకు అవసరమైనంత సంప్రదాయ పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
