translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆచారభాషను వాడాం. ముందటి వచనంలోని బహువచన కొవ్వు భాగాలనే ‘వాటిని’ సూచిస్తుంది. మూలంలో మొదటి క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ దాని భావసూచన ఆ భాగాల సముదాయానికి వర్తిస్తుంది; తెలుగులో సహజత్వం కోసం బహువచన సూచన వాడబడింది.
