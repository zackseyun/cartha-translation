source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יוּרַ֔ם מִ/שּׁ֖וֹר זֶ֣בַח הַ/שְּׁלָמִ֑ים וְ/הִקְטִירָ/ם֙ הַ/כֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: te
  text: సమాధానబలి ఎద్దు నుండి తీసినట్లే, యాజకుడు వాటిని దహనబలి బలిపీఠం మీద దహింపజేయాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సమాధానబలి ఎద్దు నుండి పైకెత్తబడినట్లే.” హీబ్రూ క్రియ అర్పించవలసిన భాగాలను తీసివేయడం, పైకెత్తడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఎలా ... అలాగే
  rationale: మునుపటి సమాధానబలి విధానంతో ఉన్న ప్రక్రియాత్మక పోలికను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוּרַם
  choice: తీయాలి
  rationale: రום అనే ధాతువు ప్రాథమికంగా పైకెత్తడాన్ని సూచించినా, ఇక్కడ బలిపశువులోని కొవ్వు భాగాలను వేరు చేసి తీయడమే సందర్భార్థం. మూలంలోని పైకెత్తడం అనే భావఛాయను పాదటిప్పణిలో నిలిపాం.
- source_word: מִשּׁוֹר
  choice: ఎద్దులోనుండి
  rationale: שׁוֹר గోవర్గపు మగ పశువును సూచిస్తుంది; ఈ బలి సందర్భంలో ‘ఎద్దు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి
  rationale: שְׁלָמִיםతో ఉన్న శాంతి/సంపూర్ణత సంబంధాన్ని నిలిపే ప్రామాణిక బలిపదం; ‘సహవాస బలి’ వంటి వివరణాత్మక అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: וְהִקְטִירָם
  choice: వాటిని ... దహింపజేయాలి
  rationale: קטר హిఫీల్ బలిపీఠంపై అర్పణ భాగాలను కాల్చి పొగగా పైకి లేపే ఆచారక్రియను సూచిస్తుంది. ‘దహింపజేయాలి’ ఆ బలిసంబంధ చర్యను గౌరవప్రదంగా తెలుపుతుంది; ‘వాటిని’ మునుపటి వచనంలోని కొవ్వు భాగాలను సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సేవ నిర్వహించే הכהןకు ప్రామాణిక తెలుగు అనువాదం.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం మీద
  rationale: עֹלָהకు ‘దహనబలి’ అనే స్థిరమైన పదాన్ని వాడి, ఆ బలికి సంబంధించిన బలిపీఠాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
