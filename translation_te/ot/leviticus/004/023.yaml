  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: te
  text: లేదా, అతడు చేసిన పాపం అతనికి తెలియజేయబడితే,[a] అతడు మచ్చలేని మగ మేకను తన అర్పణగా తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “అతడు చేసిన తన పాపం అతనికి తెలియజేయబడితే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ
  choice: లేదా
  rationale: మునుపటి వచనంలోని ధర్మనియమ సందర్భాన్ని కొనసాగించే సాధారణ ప్రత్యామ్నాయ సంధాన పదం.
- source_word: הוֹדַע אֵלָיו
  choice: అతనికి తెలియజేయబడితే
  rationale: ידע యొక్క హొఫాల్ రూపం కర్మణి/కారణార్థక కర్మణి భావాన్ని ఇస్తుంది; అతడు తానే గ్రహించాడని కాక, ఆ పాపం గురించిన సమాచారం అతనికి చేరిందని ఇది తెలియజేస్తుంది.
- source_word: חַטָּאתוֹ
  choice: అతడు చేసిన పాపం
  rationale: తరువాత వచ్చే ‘అతడు చేసిన’ అనే సంబంధ వాక్యం కారణంగా ఇక్కడ חטאת అర్పణను కాక అపరాధమైన పాపాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: అతడు చేసిన
  rationale: ఈ సంబంధ వాక్యం ఏ పాపమో నిర్దిష్టం చేస్తుంది. בָּהּ అనే విభక్తి חטאతో హీబ్రూలో నుడికారంగా వాడబడింది; సహజమైన తెలుగులో దాని భావం ‘చేసిన’లో ఇమిడిపోతుంది.
- source_word: וְהֵבִיא
  choice: తీసుకురావాలి
  rationale: ధర్మనియమ సందర్భంలో వావ్‌తో కూడిన సంపూర్ణ క్రియ prescribed consequenceను సూచిస్తుంది; తెలుగు విధ్యర్థక రూపం ఆ బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణగా
  rationale: దేవుని సన్నిధికి తీసుకువచ్చే కానుక/అర్పణ అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన బలిసంబంధ పదజాలంతో వ్యక్తం చేస్తుంది.
- source_word: שְׂעִיר עִזִּים
  choice: మేకను
  rationale: ఈ పదబంధం మేక జాతికి చెందిన జంతువును సూచిస్తుంది; వెంటనే వచ్చే זָכָר దాని లింగాన్ని స్పష్టపరుస్తుంది.
- source_word: זָכָר
  choice: మగ
  rationale: మూలపాఠం జంతువు లింగాన్ని స్పష్టంగా పేర్కొంటుంది; అందువల్ల అనువాదంలో దాన్ని నిలుపుకున్నాం.
- source_word: תָּמִים
  choice: మచ్చలేని
  rationale: బలి జంతువులో లోపం లేకపోవడాన్ని సూచించే ప్రామాణిక బలిసంబంధ భావం; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఈ వచనంలో חַטָּאת అర్థం
  choice: పాపం/అపరాధం; పాపపరిహారార్థ బలి కాదు
  alternative: పాపపరిహారార్థ బలి
  rationale: లేవీయకాండ సందర్భాల్లో חטאת రెండు అర్థాలనూ కలిగి ఉండగలిగినా, ‘అతడు చేసిన’ అనే సంబంధ వాక్యం ఇక్కడ దాని సూచ్యం అపరాధమేనని తెలియజేస్తుంది. అర్పణను తరువాత קרבנו అనే వేరే పదంతో పేర్కొన్నారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మనియమ శైలి. మూలంలోని కర్మణి భావాన్ని ‘తెలియజేయబడితే’తో నిలిపి, బలి జంతువు లింగం మరియు లోపరహితత్వాన్ని స్పష్టంగా పరిరక్షించాం.
