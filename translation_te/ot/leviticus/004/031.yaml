id: LEV.4.31
reference: Leviticus 4:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: te
  text: అతడు దాని కొవ్వంతటినీ తీసివేయాలి—సమాధాన బలి[a] నుండి కొవ్వును తీసివేసినట్టే. యాజకుడు దానిని బలిపీఠం మీద యెహోవాకు ఇంపైన సువాసనగా[b] దహించాలి. యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేస్తాడు; అతడు క్షమించబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలి.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఇంపైన సువాసన’ అనేది యెహోవా అంగీకరించిన అర్పణను సూచించే స్థిరమైన బలి పదప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: దాని కొవ్వంతటినీ / కొవ్వు
  rationale: ఇది బలిలో వేరు చేసి అర్పించాల్సిన కొవ్వును సూచిస్తుంది. మూలంలో లేని అదనపు నిర్దిష్టతను చేర్చకుండా సాధారణ పదమైన ‘కొవ్వు’ను నిలుపుకుంది.
- source_word: יָסִיר
  choice: తీసివేయాలి
  rationale: హిఫిల్ రూపంలోని తొలగించే చర్యను, ధర్మశాస్త్ర సంబంధమైన విధి భావాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: తీసివేసినట్టే
  rationale: సమాధాన బలికి ఇప్పటికే నిర్దేశించిన విధానంతో పోలికను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలి
  rationale: హీబ్రూ బలి వర్గానికి సాంప్రదాయికమైన, అర్థమయ్యే సమానార్థకం. ‘సహవాస బలి’ అనే భావానువాదాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠం మీద బలి పదార్థాన్ని కాల్చడాన్ని సూచించే యాజక సంబంధ పదప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: దేవునికి అంగీకారమైన అర్పణను సూచించే స్థిరమైన బలి రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తూ, అర్పణ దిశను తెలిపే לְ విభక్తిని ‘కు’తో వ్యక్తం చేస్తుంది.
- source_word: וְכִפֶּר עָלָיו
  choice: యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేస్తాడు
  rationale: యాజక బలి సందర్భంలోని כפר పదానికి స్థిరమైన ‘ప్రాయశ్చిత్తం చేయడం’ అనే పదబంధాన్ని వాడి, దాని విధానాన్ని మించి సిద్ధాంత వివరణను చేర్చదు.
- source_word: וְנִסְלַח לוֹ
  choice: అతడు క్షమించబడతాడు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నేరుగా నిలుపుతూ, ఫలితంగా ఆ వ్యక్తి క్షమను పొందుతాడని తెలియజేస్తుంది.
theological_decisions:
- issue: וְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ అనే బలి సూత్రవాక్యపు అనువాదం
  choice: యాజకుడు అతని కోసం ప్రాయశ్చిత్తం చేస్తాడు; అతడు క్షమించబడతాడు.
  alternative: యాజకుడు అతని పక్షంగా పరిహారం చేస్తాడు; అతనికి క్షమాపణ లభిస్తుంది.
  rationale: హీబ్రూ వాక్యం యాజకుడు చేసే ప్రాయశ్చిత్తాన్ని, దాని ఫలితమైన క్షమను కలిపి చెబుతుంది; అయితే ఆ సంబంధానికి తరువాతి సిద్ధాంతపరమైన యంత్రాంగాన్ని వివరించదు. అనువాదం అదే ఉద్రిక్తతను నిలుపుతుంది.
- issue: రֵיחַ נִיחֹחַ అనే బలి రూపకం
  choice: ఇంపైన సువాసనగా
  alternative: అంగీకారమైన అర్పణగా
  rationale: మూలంలోని వాసన రూపకాన్ని వ్యాఖ్యానాత్మక అర్థంతో భర్తీ చేయకుండా ఉంచి, దాని ఆచార సంబంధ అంగీకార భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘తీసివేయాలి,’ ‘దహించాలి’ అనే రూపాలు విధి భావాన్ని సహజంగా తెలియజేస్తాయి. మూలంలోని వరుస సంధానాన్ని అనవసరమైన కారణార్థక పదాలతో విస్తరించలేదు; చివరి రెండు ఉపవాక్యాల సంబంధాన్ని విరామచిహ్నంతో స్పష్టంగా ఉంచాం.
