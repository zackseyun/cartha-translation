  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: te
  text: యాజకుడు రక్తంలో కొంతను సమావేశపు గుడారంలో, యెహోవా సన్నిధిలో ఉన్న సుగంధ ధూపవేదిక[b] కొమ్ములపై పూయాలి. ఎద్దు రక్తమంతటినీ[a] సమావేశపు గుడారపు ప్రవేశద్వారం దగ్గర ఉన్న దహనబలి వేదిక పునాది వద్ద కుమ్మరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఎద్దు రక్తమంతా’ అని ఉంది; ముందుగా కొంత రక్తాన్ని వేదిక కొమ్ములకు పూసినందున, సందర్భంలో ఇది మిగిలిన రక్తమంతటినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధూపవేదిక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: పూయాలి
  rationale: ‘ఇవ్వు/ఉంచు/వేయు’ అనే విస్తృత అర్థమున్న క్రియ. వేదిక కొమ్ముల మీద రక్తాన్ని ఆచారరీతిగా పెట్టే చర్యను తెలుగులో సహజంగా తెలిపేందుకు ‘పూయాలి’ ఎంచుకున్నాం.
- source_word: מִן הַדָּם
  choice: రక్తంలో కొంత
  rationale: מן ఇక్కడ భాగార్థకంగా ఉంది; మొత్తం రక్తంలో కొంత భాగాన్ని సూచిస్తుంది.
- source_word: קַרְנוֹת
  choice: కొమ్ములు
  rationale: వేదిక మూలల వద్ద పైకి పొడుచుకొచ్చిన భాగాలకు మూలపాఠంలోని రూపకపదాన్నే నిలుపుతుంది.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపవేదిక
  rationale: కట్టుబాటు పదబంధం సుగంధ ద్రవ్యాలతో చేసిన ధూపం అర్పించే వేదికను సూచిస్తుంది; సంక్షిప్తంగా, సహజంగా ఈ రూపం వాడాం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: స్థలపరమైనదీ ఆరాధనాపరమైనదీ అయిన ‘ముందు/సన్నిధిలో’ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే మూలపదానికి పారదర్శకమైన అనువాదం.
- source_word: כָּל דַּם הַפָּר
  choice: ఎద్దు రక్తమంతటినీ
  rationale: హీబ్రూ పాఠంలోని ‘ఎద్దు రక్తమంతా’ అనే ప్రత్యక్ష రూపాన్ని నిలుపుతూ, ముందుగా కొంత రక్తం వాడబడిందనే సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: יִשְׁפֹּךְ
  choice: కుమ్మరించాలి
  rationale: రక్తాన్ని వేదిక పునాది వద్ద పూర్తిగా పోసే భౌతిక చర్యను గంభీరమైన, సహజ తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: אֶל יְסוֹד
  choice: పునాది వద్ద
  rationale: יְסוֹד వేదిక అడుగుభాగం లేదా పునాదిని సూచిస్తుంది; గమ్యస్థాన భావాన్ని తెలుగులో ‘వద్ద’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి వేదిక
  rationale: పూర్తిగా దహనం చేసే బలికి ఉపయోగించే బయటి వేదికకు స్థిరమైన, అర్థవంతమైన తెలుగు పదబంధం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం బిరుదును కాక వ్యక్తిగత దైవనామాన్ని వాడుతుంది. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా గుర్తుండే నామరూపంగా ‘యెహోవా’ను ఉంచాం; ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న భేదాన్ని సిద్ధాంతపరంగా పరిష్కరించలేదు.
- issue: ముందుగా కొంత రక్తం వాడిన తరువాత כָּל דַּם הַפָּרను అర్థం చేయడం
  choice: ఎద్దు రక్తమంతటినీ అని మూలరూపాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ఎద్దు రక్తంలో మిగిలినదంతా
  rationale: హీబ్రూ ప్రత్యక్షంగా ‘ఎద్దు రక్తమంతా’ అంటుంది. సందర్భంలో అది కొమ్ములకు పూసిన తరువాత మిగిలిన రక్తమని అర్థమైనా, ఆ వివరణను ప్రధాన పాఠంలో చేర్చి మూలంలోని రూపాన్ని మార్చకుండా పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారనిర్దేశానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యేలా కూడా అనువదించాం. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించాం; సంబంధవాచక నిర్మాణాలను సహజమైన స్థానవివరణలుగా మార్చాం. ప్రతి పాదటిప్పణి గుర్తును అది వివరిస్తున్న పదబంధానికే జతచేశాం.
