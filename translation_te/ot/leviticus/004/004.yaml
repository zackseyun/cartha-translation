id: LEV.4.4
reference: Leviticus 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: te
  text: అతడు ఆ ఎద్దును యాహ్వే సన్నిధిలో ఉన్న సమాగమ గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకువచ్చి, ఆ ఎద్దు తలపై తన చేయి ఉంచి, యాహ్వే సన్నిధిలో ఆ ఎద్దును వధించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: తీసుకొచ్చి
  rationale: హిఫిల్ రూపం అర్పించేవాడు జంతువును తీసుకురావాలని సూచిస్తుంది. వరుసగా జరిగే ఆచారక్రియలను సహజమైన తెలుగులో అనుసంధానించడానికి అసమాపక క్రియారూపం వాడబడింది; చివరి ‘వధించాలి’ మొత్తం ఆదేశ శ్రేణికి విధ్యర్థక బలాన్ని ఇస్తుంది.
- source_word: הַפָּר
  choice: ఆ ఎద్దు
  rationale: פַּר అంటే బలి సందర్భంలో ఎద్దు. ఈ వచనంలో ‘యవ్వనమైన’ అనే భావం స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చలేదు; ముందుగా పేర్కొన్న ఎద్దునే సూచిస్తున్నందున ‘ఆ’ వాడబడింది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గరికి
  rationale: פֶּתַח అంటే ప్రవేశం లేదా ద్వారం. אֹהֶל מוֹעֵדకు సాధారణ తెలుగు బైబిలు పరిభాషలో సహజంగా అర్థమయ్యే ‘ప్రత్యక్ష గుడారం’ ఎంచుకోబడింది. గమ్యాన్ని తెలుపడానికి ‘దగ్గరికి’ సహజంగా ఉంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే పదానికి ‘ముందు/సన్నిధిలో’ అనే భావాలున్నాయి. ఆరాధనా సందర్భంలో దేవుని సమక్షాన్ని సహజంగా తెలిపే ‘సన్నిధిలో’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: ఆ ఎద్దు తల మీద తన చెయ్యి ఉంచి
  rationale: סמך ఇక్కడ జంతువు తలపై చెయ్యి ఉంచే ఆచారక్రియను సూచిస్తుంది. అపరాధ బదిలీ లేదా ఏకీకరణ వంటి వివరణను మూలపాఠం ఈ వచనంలో ఇవ్వనందున భౌతిక చర్య మాత్రమే అనువదించబడింది.
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: שׁחט బలి జంతువును ఆచారపూర్వకంగా వధించడాన్ని తెలిపే సాంకేతిక క్రియ. ‘చంపాలి’కంటే ‘వధించాలి’ బలి సందర్భాన్ని మరింత ఖచ్చితంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడి విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉంచాం.
- issue: చెయ్యి ఉంచే ఆచారానికి అర్థం
  choice: భౌతిక చర్యను మాత్రమే అనువదించడం
  alternative: గుర్తింపును లేదా అపరాధ బదిలీని స్పష్టంగా పేర్కొనడం
  rationale: ఈ వచనం చర్యను చెబుతుంది గాని దాని సంపూర్ణ ధార్మిక అర్థాన్ని వివరించదు. అందువల్ల ఒక ప్రత్యేక వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ క్రియల వరుసను తెలుగులో సహజమైన ‘తీసుకొచ్చి… ఉంచి… వధించాలి’ నిర్మాణంగా ఇచ్చాం. ‘ప్రత్యక్ష గుడారం’ మరియు ‘వధించాలి’ అనే పదాలు ఆరాధనా సందర్భాన్ని నిలుపుతాయి.
