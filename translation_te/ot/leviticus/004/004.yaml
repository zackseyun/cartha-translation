- from: అతడు ఆ ఎద్దును యెహోవా సన్నిధిలో, ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకొచ్చి, ఆ ఎద్దు తల మీద తన చెయ్యి ఉంచి, యెహోవా సన్నిధిలో దాన్ని వధించాలి.
  to: అతడు ఆ ఎద్దును యాహ్వే సన్నిధిలో ఉన్న సమాగమ గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకువచ్చి, ఆ ఎద్దు తలపై తన చేయి ఉంచి, యాహ్వే సన్నిధిలో ఆ ఎద్దును వధించాలి.
