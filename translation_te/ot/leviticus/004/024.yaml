  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שָׁחַ֣ט אֹת֔/וֹ בִּ/מְק֛וֹם אֲשֶׁר יִשְׁחַ֥ט אֶת הָ/עֹלָ֖ה לִ/פְנֵ֣י יְהוָ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: te
  text: అతడు ఆ మగ మేక తలపై తన చేతిని ఉంచి, యెహోవా సన్నిధిలో దహనబలిని వధించే స్థలంలో దానిని వధించాలి. అది పాపబలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది శుద్ధీకరణ బలి.” హీబ్రూ పదం חַטָּאת పాపాన్ని, అలాగే పాపం లేదా అపవిత్రతను తొలగించడానికి సంబంధించిన బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: తన చెయ్యి ఉంచి
  rationale: బలి ఆచారంలో జంతువు తలపై చెయ్యి ఉంచే క్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూలోని ఏకవచనమైన ‘చెయ్యి’ను నిలుపుతుంది.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: ఆ మేక తలపై
  rationale: శָׂעִיר ఇక్కడ బలికి సంబంధించిన మగ మేకను సూచిస్తుంది; సందర్భంలో ‘మేక’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְשָׁחַט אֹתוֹ
  choice: దానిని వధించాలి
  rationale: שׁחט అనే ఆచారబలి క్రియకు ‘వధించు’ గంభీరమైన, స్పష్టమైన సమానార్థకం; సాధారణ ‘చంపు’ కంటే బలి సందర్భాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט אֶת הָעֹלָה
  choice: దహనబలిని వధించే స్థలంలోనే
  rationale: హీబ్రూ సకర్మక నిర్మాణంలోని నిర్దిష్టం కాని కర్తను తెలుగులో సహజంగా విడిచిపెట్టి, నిర్ణయించబడిన బలిస్థలాన్ని స్పష్టపరుస్తుంది; ‘లోనే’ అదే స్థలమనే భావాన్ని తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, לִפְנֵי యొక్క సమక్షత భావాన్ని సహజమైన తెలుగు ఆరాధనా భాషలో అందిస్తుంది.
- source_word: חַטָּאת הוּא
  choice: అది పాపపరిహార బలి
  rationale: ఇక్కడ חַטָּאת ఒక నిర్దిష్ట బలిరకాన్ని గుర్తిస్తుంది. ‘పాపపరిహార బలి’ తెలుగులో స్థిరమైన అర్థాన్ని ఇస్తుంది; శుద్ధీకరణకు సంబంధించిన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- issue: חַטָּאת యొక్క బలి సంబంధమైన అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ వాక్యంలో ఈ పదం బలిరకాన్ని వర్గీకరిస్తుంది. ప్రధాన పాఠ్యంలో సాధారణంగా అర్థమయ్యే ‘పాపపరిహార బలి’ని ఉంచి, పదంలోని శుద్ధీకరణ కోణాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ధర్మశాస్త్ర బలి విధానానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించింది. ఆజ్ఞాత్మక భావానికి ‘వధించాలి’ను, ఆచారపరమైన పదజాలానికి ‘దహనబలి’, ‘పాపపరిహార బలి’లను ఉపయోగించింది.
