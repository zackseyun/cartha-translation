id: LEV.4.34
reference: Leviticus 4:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: te
  text: అప్పుడు యాజకుడు పాపపరిహార బలి[a] రక్తంలో కొంతను తన వేలితో తీసుకొని, దహనబలి బలిపీఠపు కొమ్ముల మీద పూయాలి. దాని రక్తమంతటినీ బలిపీఠపు అడుగున కుమ్మరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుద్ధీకరణ బలి.” హీబ్రూ పదం పాపానికి సంబంధించిన బలినీ, ఆచార శుద్ధీకరణకు సంబంధించిన బలినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: అప్పుడు ... తీసుకొని
  rationale: వావ్‌తో కూడిన క్రియ కర్మకాండలో తరువాతి చర్యను సూచిస్తుంది; తెలుగులో ‘అప్పుడు ... తీసుకొని’ ప్రక్రియాక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్టంగా ఆచారాన్ని నిర్వహించే priest‌ను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: מִדַּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; వేలితో ఉపయోగించేది మొత్తం రక్తం కాదు, దానిలో కొంత.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఈ బలియాచార సందర్భంలో పదం పాపాన్ని కాక, పాపం/శుద్ధీకరణకు సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకులకు గుర్తుపట్టదగినది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּאֶצְבָּעוֹ
  choice: తన వేలితో
  rationale: בְּ సాధనార్థకంగా ఉంది; యాజకుడు తన వేలిని ఉపయోగిస్తాడని తెలుపుతుంది.
- source_word: וְנָתַן
  choice: పూయాలి
  rationale: נתן మౌలికంగా ‘పెట్టు/ఉంచు’; బలిపీఠపు కొమ్ములపై రక్తాన్ని వేలితో పెట్టే ఈ సందర్భంలో ‘పూయాలి’ సహజంగా చర్యను తెలియజేస్తుంది.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠపు కొమ్ముల మీద
  rationale: బలిపీఠపు పైకి పొడుచుకొచ్చిన భాగాలైన ‘కొమ్ములు’ అనే ఆచార చిత్రాన్ని నిలుపుతూ, అది దహనబలి బలిపీఠమని స్పష్టపరుస్తుంది.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: దాని రక్తమంతటినీ
  rationale: כָּל యొక్క సంపూర్ణతను యథాతథంగా ఉంచాం. సందర్భంలో మిగిలిన రక్తమని అర్థమైనా, మూలంలో ‘మిగిలిన’ అనే పదం లేనందున చేర్చలేదు.
- source_word: יִשְׁפֹּךְ
  choice: పోయాలి
  rationale: שפך ఉద్దేశపూర్వకంగా ద్రవాన్ని కుమ్మరించడాన్ని సూచిస్తుంది; కర్మకాండ సందర్భంలో ‘పోయాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠపు అడుగున
  rationale: יְסוֹד అంటే పునాది లేదా అడుగు భాగం; ఆధునిక తెలుగులో ‘అడుగున’ స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలియాచార నియమంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భంలో పదం ఒక బలిని సూచిస్తుందనేది స్పష్టం; అయితే దాని భావపరిధిలో పాపానికి సంబంధించిన పరిహారం, ఆచార శుద్ధీకరణ రెండూ ఉన్నాయి. ప్రధాన పాఠ్యంలో పరిచితమైన పదాన్ని వాడి, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. కర్మకాండ క్రమాన్ని ‘అప్పుడు’ మరియు విధ్యర్థక ‘-ాలి’ రూపాలతో స్పష్టపరిచాం; ‘కొమ్ములు’ వంటి మూలపాఠ్య ఆచార రూపకాన్ని నిలిపాం.
