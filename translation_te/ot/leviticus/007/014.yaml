  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: te
  text: దానిలోనుంచి ప్రతి అర్పణలో నుండి ఒక్కదాన్ని యెహోవాకు ప్రత్యేక కానుకగా సమర్పించాలి.[a] సమాధాన బలుల రక్తాన్ని చల్లే యాజకునికి అది చెందుతుంది.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రత్యేక కానుక’ అని అనువదించిన హీబ్రూ పదం, దేవునికోసం వేరుచేసి యాజకునికి కేటాయించిన భాగాన్ని సూచిస్తుంది. దీనిని ‘ఎత్తి అర్పించే అర్పణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘చల్లే’ అనే మాటకు బదులుగా ‘విసిరే’ లేదా ‘చిమ్మే’ అని కూడా అనువదించవచ్చు. ఇక్కడ బలి రక్తాన్ని ఆచారబద్ధంగా ప్రయోగించే క్రియ ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘సమాధాన బలులు’ అనే పదాన్ని ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: సమర్పించాలి
  rationale: קרב హిఫిల్ రూపం బలిగా దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సమర్పించాలి’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుంచి
  rationale: ఏకవచన ప్రత్యయం ముందు వచనంలో చెప్పిన కృతజ్ఞతా బలి సముదాయాన్ని ఒక మొత్తంగా సూచిస్తుంది.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: ప్రతి అర్పణ రకంలో ఒక్కదాన్ని
  rationale: ‘ప్రతి అర్పణలోనుంచి ఒకటి’ అనే విభజనాత్మక భావాన్ని, ముందు వచనంలోని వివిధ రొట్టె రకాలకు సంబంధించి, తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּרוּמָה
  choice: ప్రతిష్ఠించిన భాగం
  rationale: దేవునికోసం వేరుచేసి చివరకు యాజకునికి కేటాయించే భాగాన్ని సూచిస్తుంది; అస్పష్టమైన సాంకేతిక పదం కన్నా ఈ రూపం అర్థవంతంగా ఉంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించి, మూలపాఠంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: הַזֹּרֵק
  choice: బలిపీఠం మీద చల్లే
  rationale: זרק అనేది బలి రక్తాన్ని బలిపీఠంపై విసరడం/చల్లడం అనే ఆచారక్రియను సూచిస్తుంది. ‘చల్లే’ సహజ తెలుగు; ‘బలిపీఠం మీద’ అనేది ఆచార సందర్భంలో అంతర్లీనమైన లక్ష్యాన్ని స్పష్టం చేస్తుంది.
- source_word: דַּם הַשְּׁלָמִים
  choice: సమాధాన బలుల రక్తం
  rationale: שְׁלָמִים అనే స్థిర బలి వర్గానికి సంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు రూపం; ఇతర సాధ్యమైన భావఛాయలను పాదసూచికలో ఉంచాం.
- source_word: לוֹ יִהְיֶה
  choice: యాజకునికి అది చెందుతుంది
  rationale: ఈ హీబ్రూ ప్రయోగం కేటాయింపు లేదా హక్కును సూచిస్తుంది; తెలుగులో స్వామ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని పారదర్శకంగా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాన్ని ఉపయోగించాం.
- issue: שְׁלָמִים బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు / క్షేమ బలులు
  rationale: మూలపదంలోని శాంతి, సంపూర్ణ క్షేమం, సహవాసం వంటి భావాలను ఒక్క తెలుగు పదం పూర్తిగా ఆవరించదు. ప్రధాన పాఠంలో స్థిరమైన సంప్రదాయ పదాన్ని ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- issue: זרק ఆచారక్రియ
  choice: బలిపీఠం మీద చల్లే
  alternative: బలిపీఠం మీద విసిరే / చిమ్మే
  rationale: రక్తాన్ని బలిపీఠంపై ప్రయోగించే క్రియను సహజంగా తెలియజేస్తూ, అది సాధారణంగా సున్నితంగా చిలకరించడం మాత్రమే అన్న భావానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బలికి సంబంధించిన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. హీబ్రూ వాక్యంలోని మొదటి ఆజ్ఞాత్మక భావం మరియు రెండో భాగంలోని యాజకుని హక్కు స్పష్టంగా వేరు చేశాం. పాదసూచిక సూచికలన్నీ ప్రధాన పాఠంలో ఉన్నాయి.
