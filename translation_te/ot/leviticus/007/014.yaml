revisions:
- from: దానిలోనుంచి ప్రతి అర్పణ రకంలో ఒక్కదాన్ని యెహోవాకు ప్రతిష్ఠించిన భాగంగా సమర్పించాలి.[a] సమాధాన బలుల రక్తాన్ని బలిపీఠం మీద చల్లే యాజకునికి అది చెందుతుంది.[b][c]
