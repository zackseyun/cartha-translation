source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: te
  text: అహరోను కుమారులలో సమాధాన బలుల[a] రక్తాన్నీ కొవ్వునూ అర్పించే వానికి కుడి తొడ వాటాగా చెందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలుల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: అర్పించే వానికి
  rationale: קרב హిఫీల్ కృదంతం బలిని సమర్పించే కార్యాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కృదంత భావాన్ని సహజంగా నిలుపుతూ ‘అర్పించే ... వానికి’ అని అనువదించాం.
- source_word: דַּם
  choice: రక్తాన్ని
  rationale: బలుల నియమావళిలోని సాధారణ, ప్రత్యక్ష అర్థం.
- source_word: הַשְּׁלָמִים
  choice: సమాధాన బలుల
  rationale: శాంతి/సంపూర్ణతతో సంబంధమున్న ఈ ప్రత్యేక బలి వర్గానికి ‘సమాధాన బలులు’ మూలపద సంబంధాన్ని కాపాడే సహజమైన తెలుగు పదబంధం. ‘సహవాస బలులు’ అనే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: הַחֵלֶב
  choice: కొవ్వును
  rationale: బలి నియమాలలో దేవునికి అర్పించవలసిన నిర్దిష్ట కొవ్వు భాగాలను సూచించే ప్రత్యక్ష అనువాదం.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులలోని
  rationale: యాజక వర్గమైన అహరోను కుమారులలో ఒకరిని ఎంపికచేసే מן భావాన్ని, అలాగే మూలంలోని పురుష బహువచన కుటుంబపదాన్ని నిలుపుతుంది.
- source_word: לוֹ תִהְיֶה
  choice: వానికే ... చెందాలి
  rationale: చట్టబద్ధమైన హక్కు లేదా కేటాయింపును తెలుపుతుంది; ‘-కే’ ఆ వ్యక్తికే చెందే హక్కును స్పష్టం చేస్తుంది.
- source_word: שׁוֹק הַיָּמִין
  choice: కుడి తొడ
  rationale: שׁוֹק ఇక్కడ బలి జంతువు పైకాలి/తొడ భాగాన్ని సూచిస్తుంది; విస్తృతమైన ‘కాలు’ కంటే ‘తొడ’ నిర్దిష్టం.
- source_word: לְמָנָה
  choice: అతని భాగంగా
  rationale: కేటాయించబడిన వాటా లేదా భాగం అనే న్యాయపరమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యాజక నియమావళిలో בְּנֵי אַהֲרֹן అనువాదం
  choice: అహరోను కుమారులు
  alternative: అహరోను వంశస్థులు / అహరోను కుటుంబం
  rationale: హీబ్రూ పదబంధం స్పష్టంగా పురుష బహువచనంలో ఉండి, బలి సేవ చేసే యాజక పురుషులను సూచిస్తుంది. అందువల్ల లింగాన్ని తటస్థీకరించకుండా మూలంలోని కుటుంబపదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి నియమావళికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. చట్టబద్ధ కేటాయింపు భావాన్ని ‘వానికే ... అతని భాగంగా చెందాలి’ అనే నిర్మాణంతో స్పష్టం చేశాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచాం.
