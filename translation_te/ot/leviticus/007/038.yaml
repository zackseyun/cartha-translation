source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: te
  text: వీటిని యాహ్వే సీనాయి పర్వతంపై మోషేకు ఆజ్ఞాపించాడు—సీనాయి అరణ్యంలో ఇశ్రాయేలు కుమారులు[a] తమ అర్పణలను యాహ్వేకు సమర్పించమని ఆయన వారికి ఆజ్ఞాపించిన రోజున.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు” లేదా “ఇశ్రాయేలు ప్రజలు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వీటిని
  rationale: ముందటి వచనంలో పేర్కొన్న బలుల నియమాలను సూచించే సంబంధవాచకాన్ని తెలుగులో సహజమైన వాక్యానుసంధానంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: ధర్మశాస్త్ర, ఆరాధన సందర్భంలో క్రియకున్న అధికారపూర్వక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: בְּהַר סִינָי
  choice: సీనాయి పర్వతం మీద
  rationale: స్థలార్థాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּיוֹם צַוֹּתוֹ
  choice: ఆయన వారికి ఆజ్ఞాపించిన రోజున
  rationale: హీబ్రూ క్రియానామ నిర్మాణాన్ని కాలసూచనను నిలుపుతూ తెలుగులో సహజమైన ఉపవాక్యంగా మారుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని కుటుంబసంబంధమైన, పుంలింగ బహువచన రూపాన్ని ప్రత్యక్షంగా నిలుపుతుంది; సాధారణార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְהַקְרִיב
  choice: సమర్పించాలని
  rationale: బలిని దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే ఆరాధనాపరమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָרְבְּנֵיהֶם
  choice: తమ అర్పణలను
  rationale: ఈ సందర్భంలో సంగ్రహించబడిన వివిధ రకాల బలులు, కానుకలు అన్నిటినీ కలుపుకునే విస్తృత పదం.
- source_word: בְּמִדְבַּר סִינָי
  choice: సీనాయి అరణ్యంలో
  rationale: מִדְבָּר సూచించే జనావాసం తక్కువైన అరణ్యప్రాంతాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని కుటుంబసంబంధ రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని సహజ సామూహిక ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందటి వచనంతో ఉన్న వ్యాకరణ సంబంధాన్ని ‘వీటిని’ ద్వారా నిలిపి, దీర్ఘమైన హీబ్రూ వాక్యాన్ని డాష్‌తో సహజంగా అనుసంధానించాం.
