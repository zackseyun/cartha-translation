id: LEV.7.21
reference: Leviticus 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: te
  text: ఒక వ్యక్తి అపవిత్రమైన దేనినైనా—మనిషికి సంబంధించిన అపవిత్రతనైనా, అపవిత్రమైన జంతువునైనా, అపవిత్రమైన ఏ అసహ్యమైన దానినైనా—తాకి, యెహోవాకు చెందిన సమాధానబలి[a] మాంసం కొంత తింటే, ఆ వ్యక్తి తన ప్రజల మధ్య నుండి కొట్టివేయబడాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాధానబలి’ అనే పదాన్ని ‘సహవాస బలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కొట్టివేయబడాలి’ అనేది ఒడంబడిక శిక్షను తెలిపే సూత్రప్రయోగం. ఇది బహిష్కరణనో దేవుని తీర్పునో సూచించవచ్చు; ఇక్కడ దాని ఖచ్చితమైన విధానాన్ని హెబ్రీ పాఠం పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: వ్యక్తి
  rationale: ఈ న్యాయసంబంధ సందర్భంలో נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: תִגַּע
  choice: తాకి
  rationale: నגע అనే క్రియలోని ప్రత్యక్ష సంపర్క భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל טָמֵא
  choice: అపవిత్రమైన దేనినైనా
  rationale: విస్తృతమైన, అనిర్దిష్టమైన హెబ్రీ ప్రయోగాన్ని అలాగే ఉంచుతూ ఆచారపరమైన అపవిత్రతను సూచిస్తుంది.
- source_word: טֻמְאַת אָדָם
  choice: మనిషికి సంబంధించిన అపవిత్రత
  rationale: ఇది పురుషులకు మాత్రమే పరిమితమైనది కాదు; మానవునికి సంబంధించిన ఆచారపరమైన అపవిత్రత అనే భావాన్ని ఇస్తుంది.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: అపవిత్రమైన జంతువు
  rationale: בְּהֵמָהను ఈ సందర్భంలో విస్తృతమైన ‘జంతువు’గా అనువదించడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שֶׁקֶץ טָמֵא
  choice: అపవిత్రమైన హేయమైనది
  rationale: שֶׁקֶץలోని అసహ్యకరమైన లేదా నిషిద్ధమైనదనే భావాన్ని ‘హేయమైనది’ నిలుపుతుంది; దానిని ఒక ప్రత్యేక జంతువుల వర్గానికి పరిమితం చేయదు.
- source_word: וְאָכַל מִבְּשַׂר
  choice: మాంసంలో కొంత తింటే
  rationale: మִן యొక్క భాగార్థాన్ని ‘కొంత’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధానబలి
  rationale: ఇది లేవీయకాండంలోని బలి వర్గానికి గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదం; మూలంలోని שְׁלָמִיםతో సంబంధాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לַיהוָה
  choice: యెహోవాకు చెందిన
  rationale: బలి యెహోవాకు ప్రత్యేకపరచబడినదని లేదా ఆయనకు చెందినదని తెలిపే సంబంధాన్ని కాపాడుతుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: హెబ్రీ పాఠంలోని దైవనామాన్ని తెలుగులో వ్యక్తినామంగా పారదర్శకంగా అందిస్తుంది.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: తన ప్రజల మధ్య నుండి కొట్టివేయబడాలి
  rationale: ఒడంబడిక శిక్షాసూత్రంలోని బలమైన రూపకాన్ని నిలుపుతూ, అది బహిష్కరణనా, మరణమా, లేక దేవుని తీర్పా అని అనువాదంలో నిర్ణయించదు.
theological_decisions:
- issue: וְנִכְרְתָה అనే ఒడంబడిక శిక్ష యొక్క ఖచ్చిత స్వరూపం
  choice: ‘తన ప్రజల మధ్య నుండి కొట్టివేయబడాలి’ అనే ఉద్దేశపూర్వకంగా విస్తృతమైన రూపాన్ని నిలుపడం
  alternative: ‘తన ప్రజల నుండి బహిష్కరించబడాలి’ లేదా ‘చంపబడాలి’ అని నిర్దిష్టీకరించడం
  rationale: ఈ వచనంలో శిక్ష అమలు విధానాన్ని హెబ్రీ పాఠం స్పష్టంగా చెప్పదు. మరింత నిర్దిష్టమైన అనువాదం మూలంలోని నిజమైన అనిశ్చితిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అపవిత్రత’, ‘సమాధానబలి’ వంటి లేవీయకాండపు ఆచారపరమైన పదజాలాన్ని స్థిరంగా ఉంచాం; పొడవైన హెబ్రీ వాక్య నిర్మాణాన్ని డాష్‌లతో స్పష్టపరిచాం.
