id: LEV.7.7
reference: Leviticus 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: te
  text: పాపపరిహార బలి ఎలాంటిదో, అపరాధపరిహార బలి కూడా అలాంటిదే; ఆ రెండింటికీ ఒకే నియమం[a]. దానితో ప్రాయశ్చిత్తం చేసే యాజకునికే అది చెందుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమం’ అనే చోట హీబ్రూలో తోరా; దీనికి ‘ఉపదేశం’ లేదా ‘విధి’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: పాపపరిహార బలి ఎలాంటిదో, అపరాధపరిహార బలి కూడా అలాంటిదే
  rationale: రెండు పదాలకూ ఉన్న כ ఉపసర్గలు పోలికను సూచిస్తున్నాయి. బలుల సందర్భంలో חַטָּאת, אָשָׁם అనే పదాలను వరుసగా పాపపరిహార బలి, అపరాధపరిహార బలి అని అనువదించడం వాటి ఆచారపరమైన అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: ఆ రెండింటికీ ఒకే నియమం
  rationale: תּוֹרָה ఇక్కడ బలి సంబంధమైన విధి లేదా నియమాన్ని సూచిస్తుంది; אַחַת రెండు బలులకూ ఒకటే నియమం వర్తిస్తుందని నొక్కిచెబుతుంది. לָהֶם లోని బహువచన సూచనను తెలుగులో స్పష్టత కోసం ‘ఆ రెండింటికీ’ అని వ్యక్తపరిచాం.
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: దానితో ప్రాయశ్చిత్తం చేసే యాజకుడు
  rationale: כפר అనే యాజక సంబంధమైన క్రియకు ఉన్న ఆచారపరమైన, ధార్మికమైన బలాన్ని ‘ప్రాయశ్చిత్తం చేయు’ నిలుపుతుంది. בּוֹ బలిని సాధనంగా సూచిస్తున్నందున ‘దానితో’ అని అనువదించాం; హీబ్రూలో లేని కర్మను చేర్చలేదు.
- source_word: לוֹ יִהְיֶה
  choice: యాజకునికే అది చెందుతుంది
  rationale: ఈ హీబ్రూ ప్రయోగం నిర్వహించిన యాజకునికి ఆ బలి భాగం హక్కుగా చెందడాన్ని సూచిస్తుంది. ‘చెందుతుంది’ సహజమైన ఆధునిక తెలుగు; ‘కే’ నిర్వహించిన యాజకుడనే నొక్కును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యాజక బలి సందర్భంలో כפר అనువాదం
  choice: ప్రాయశ్చిత్తం చేసే
  alternative: పరిహారం చేసే; శుద్ధి కలిగించే
  rationale: כפר యొక్క బలి సంబంధమైన ధార్మిక పరిధిని ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయకుండా ‘ప్రాయశ్చిత్తం’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ధార్మిక శైలిని ఉపయోగించాం. పోలిక నిర్మాణాన్ని సహజమైన ‘ఎలాంటిదో... అలాంటిదే’ రూపంలో నిలిపి, బలి పదాల మధ్య భేదాన్ని స్పష్టంగా ఉంచాం.
