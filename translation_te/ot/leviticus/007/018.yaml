id: LEV.7.18
reference: Leviticus 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: te
  text: అయితే అతని సమాధాన బలి[a] మాంసంలో కొంతైనా మూడవ రోజున తినబడితే, ఆ బలి అంగీకరించబడదు; దానిని అర్పించినవానికి అది లెక్కలోకి రాదు. అది అసహ్యమైనదిగా[b] ఉంటుంది; దానిలోనుండి తినే వ్యక్తి తన దోషాన్ని భరిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమాధాన బలి”ని “సహవాస బలి” లేదా “క్షేమ బలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం, నియమభంగం వల్ల అంగీకారయోగ్యత కోల్పోయి ఆచారపరంగా జుగుప్సాకరమైనదైన బలిని సూచించే సాంకేతిక పదం; “కలుషితమైన బలి మాంసం” లేదా “జుగుప్సాకరమైనది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... తినబడితే
  rationale: ముందున్న నియమానికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֵאָכֹל יֵאָכֵל
  choice: తినబడితే
  rationale: హీబ్రూ infinitive absolute + imperfect నిర్మాణంలోని నిశ్చయాత్మక బలాన్ని సందర్భమే తెలియజేస్తుంది; తెలుగులో ద్విరుక్తి చేయకుండా సహజమైన కర్మణి షరతు వాడబడింది.
- source_word: מִבְּשַׂר
  choice: మాంసంలో ఏదైనా
  rationale: מִן యొక్క అంశార్థాన్ని ‘ఏదైనా’ ద్వారా నిలుపుతూ, బలి సందర్భంలో בשר ను సహజంగా ‘మాంసం’ అని అనువదిస్తుంది.
- source_word: זֶבַח שְׁלָמָיו
  choice: అతని సమాధాన బలి
  rationale: ఇది నిర్దిష్ట బలి వర్గం. ‘సమాధాన బలి’ שׁלם పదకుటుంబంలోని శాంతి/సంపూర్ణత భావాన్ని నిలుపుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలసూచనను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: לֹא יֵרָצֶה
  choice: ఆ బలి అంగీకరించబడదు
  rationale: బలి సంబంధ సందర్భంలో రצה నిఫాల్ దేవుని సమక్షంలో బలి అంగీకారయోగ్యతను సూచిస్తుంది. తెలుగులో సూచ్యవిషయాన్ని స్పష్టం చేయడానికి ‘ఆ బలి’ చేర్చబడింది.
- source_word: הַמַּקְרִיב אֹתוֹ
  choice: దాన్ని అర్పించినవానికి
  rationale: అర్పణను సమర్పించే వ్యక్తిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: అది లెక్కించబడదు
  rationale: חשב + ל లోని లెక్కింపు/జమచేయడం భావాన్ని సిద్ధాంతపరంగా అతివ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: פִּגּוּל
  choice: అసహ్యమైనదిగా
  rationale: అంగీకారయోగ్యత కోల్పోయి ఆచారపరంగా జుగుప్సాకరమైనదైన బలిని సూచించే సాంకేతిక పదం; దాని ప్రత్యేకతను పాదసూచిక వివరిస్తుంది.
- source_word: וְהַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: ఇక్కడ נפש శరీరానికి భిన్నమైన ‘ఆత్మ’ను కాదు, న్యాయవాక్యంలో ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: הָאֹכֶלֶת מִמֶּנּוּ
  choice: దానిలోనుండి తినే
  rationale: מִמֶּנּוּ లోని విభక్తి భావాన్ని నిలుపుతూ సహజమైన తెలుగు సంబంధ వాక్యభాగంగా అందిస్తుంది.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: తన దోషాన్ని భరించాలి
  rationale: నేరబాధ్యతను, దానికి సంబంధించిన పరిణామాన్ని రెండింటినీ సూచించగల హీబ్రూ న్యాయప్రయోగంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: זֶבַח שְׁלָמָיו అనే బలి పేరును అనువదించడం
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: ప్రధాన పాఠంలో సంప్రదాయపరంగా గుర్తించదగిన, שׁלם యొక్క శాంతి భావాన్ని ప్రతిబింబించే పేరు ఉంచి, సహవాసం లేదా క్షేమాన్ని ముందుకు తెచ్చే సాధ్యమైన అనువాదాలను పాదసూచికలో భద్రపరుస్తుంది.
- issue: פִּגּוּל అనే సాంకేతిక బలి పదం
  choice: అసహ్యమైనదిగా
  alternative: కలుషితమైన బలి మాంసంగా; జుగుప్సాకరమైనదిగా
  rationale: ఈ పదం కేవలం భావోద్వేగ అసహ్యాన్ని కాక, నియమభంగం వల్ల అంగీకారయోగ్యత కోల్పోయిన బలిని సూచిస్తుంది. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, సాంకేతిక సూక్ష్మతను పాదసూచికలో తెలిపింది.
- issue: עֲוֺנָהּ תִּשָּׂא లో దోషం మరియు శిక్ష మధ్య భావవిస్తృతి
  choice: తన దోషాన్ని భరించాలి
  alternative: తన దోషానికి శిక్షను భరించాలి
  rationale: హీబ్రూ ప్రయోగం దోషబాధ్యతతో పాటు దాని పరిణామాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో ‘శిక్ష’ను స్పష్టంగా చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని న్యాయ-బలి సందర్భానికి తగిన గంభీరతతో రచించబడింది. కర్మణి నిర్మాణాలు మూలంలోని బలి అంగీకారంపై ఉన్న దృష్టిని నిలుపుతాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
