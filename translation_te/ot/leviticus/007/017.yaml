id: LEV.7.17
reference: Leviticus 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֖ר מִ/בְּשַׂ֣ר הַ/זָּ֑בַח בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: te
  text: బలి మాంసంలో మిగిలినదాన్ని మూడవ రోజున అగ్నిలో కాల్చివేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: మిగిలినది
  rationale: సంబంధిత క్రియార్థక రూపాన్ని తెలుగులో సహజమైన నామవాచక భావంతో వ్యక్తపరుస్తుంది; ముందు వచనంలోని ఆదేశానికి కొనసాగింపును వాక్య నిర్మాణమే స్పష్టం చేస్తుంది.
- source_word: מִבְּשַׂר
  choice: మాంసంలో
  rationale: బలి ఆహార సందర్భంలో בָּשָׂר‌కు ‘మాంసం’ అనేది ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదం; מן ఇక్కడ సమష్టిలో మిగిలిన భాగాన్ని సూచిస్తుంది.
- source_word: הַזָּבַח
  choice: బలిలోని
  rationale: זֶבַח సూచించే బలిగా అర్పించిన జంతువు/బలిని సంక్షిప్తంగా, ఆచార సంబంధ సందర్భానికి తగినట్లు అందిస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజు వరకు
  rationale: హీబ్రూ పదబద్ధంగా ‘మూడవ రోజున’ అయినప్పటికీ, మిగిలి ఉండడాన్ని సూచించే సందర్భంలో గడువు భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; కాల్చే చర్య మూడవ రోజున జరగాలనే మూల భావాన్ని మార్చదు.
- source_word: בָּאֵשׁ
  choice: అగ్నిలో
  rationale: ב + אֵשׁ‌ను నేరుగా ప్రతిబింబిస్తూ, దహనం ద్వారా తొలగించడాన్ని గౌరవప్రదమైన ఆధునిక శైలిలో తెలియజేస్తుంది.
- source_word: יִשָּׂרֵף
  choice: కాల్చివేయాలి
  rationale: నిఫాల్ అపూర్ణ క్రియ యొక్క విధి/నియమ భావాన్ని తెలుగులో సహజమైన ఆదేశ రూపంతో అందిస్తుంది; ‘వేయాలి’ పూర్తిగా దహనం చేసి తొలగించే భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన న్యాయవిధి శైలి. ‘శరీరం’ కంటే ఆహార/బలి సందర్భానికి సహజమైన ‘మాంసం’ వాడబడింది. ప్రత్యేక సంప్రదాయపరమైన వ్యాఖ్యానం చేర్చలేదు.
