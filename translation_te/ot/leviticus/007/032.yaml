  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: te
  text: మీ సమాధానబలులలోనుండి కుడి తొడను యాజకునికి ప్రత్యేక కానుకగా ఇవ్వాలి.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తొడ’కు బదులుగా ‘కాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రత్యేక కానుకగా’ అనే చోట ‘అర్పణగా’ అని కూడా అనువదించవచ్చు; సంప్రదాయ అనువాదంలో ‘ఎత్తి అర్పించే అర్పణగా.’
    reason: lexical_alternative
  - marker: c
    text: ‘సమాధానబలులు’ అనే చోట ‘సహవాసబలులు’ లేదా ‘క్షేమబలులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: తొడ
  rationale: ఈ పదం జంతువు కాలి పైభాగాన్ని సూచిస్తుంది; బలి సందర్భంలో ‘తొడ’ అనేది ‘కాలు’ కంటే నిర్దిష్టమైన పదం.
- source_word: הַיָּמִין
  choice: కుడి
  rationale: బలిలో ప్రత్యేకంగా కేటాయించిన కుడివైపు భాగాన్ని మూలపాఠం స్పష్టంగా పేర్కొంటుంది.
- source_word: תִּתְּנוּ
  choice: ఇవ్వాలి
  rationale: రెండవ పురుష బహువచన న్యాయనిర్దేశంలోని ఆజ్ఞాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תְרוּמָה
  choice: ప్రతిష్ఠిత భాగంగా
  rationale: వేరుచేసి యాజకునికి సమర్పించే నియమిత భాగం అనే భావాన్ని తెలియజేస్తుంది; సంప్రదాయ ‘ఎత్తి అర్పించే అర్పణ’ అనే పదబంధం ఆధునిక పాఠకునికి అస్పష్టంగా ఉండవచ్చు.
- source_word: לַכֹּהֵן
  choice: యాజకునికి
  rationale: గ్రహీతను సూచించే ఏకవచన రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: מִזִּבְחֵי שַׁלְמֵיכֶם
  choice: మీ సమాధానబలి అర్పణలలోనుంచి
  rationale: מִן మూలం లేదా భాగాన్ని సూచిస్తుంది; బహువచన బలులు మరియు రెండవ పురుష బహువచన స్వామ్యార్థం రెండింటినీ నిలుపుతుంది.
- source_word: שַׁלְמֵיכֶם
  choice: సమాధానబలి అర్పణలు
  rationale: שְׁלָמִים అనే బలి పదానికి గుర్తించదగిన ‘సమాధానబలి’ రూపాన్ని ఉపయోగిస్తూ, సహవాసం లేదా క్షేమం అనే ఇతర సాధ్యమైన భావాలను పాదటీపులో ఉంచుతుంది.
- source_word: וְאֵת
  choice: —
  rationale: וְ ముందున్న వాక్యంతో అనుసంధానిస్తుంది; తెలుగులో ఈ చిన్న న్యాయవాక్యం సహజంగా ఉండేందుకు ప్రత్యేక ‘మరియు’ లేకుండానే క్రమసంబంధం వ్యక్తమవుతుంది. אֵת‌కు ప్రత్యక్ష తెలుగు సమానం లేదు.
theological_decisions:
- issue: שְׁלָמִים బలి పేరులోని భావపరిధి
  choice: సమాధానబలి అర్పణలు
  alternative: సహవాసబలి అర్పణలు; క్షేమబలి అర్పణలు
  rationale: మూలపదం సమాధానం, సంపూర్ణ క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ప్రధాన పాఠంలో గుర్తించదగిన పదాన్ని ఎంచుకుని, ఇతర సాధ్యార్థాలను పాదటీపులో ఉంచడం ద్వారా భావాన్ని ఒకే దిశలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయనిర్దేశానికి తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘తొడ,’ ‘కుడి,’ ‘యాజకుడు’ వంటి స్పష్టమైన పదాలను వాడి, సాంకేతిక బలి పదాల్లోని నిజమైన భావవిస్తృతిని పాదటీపుల్లో నిలిపాం.
