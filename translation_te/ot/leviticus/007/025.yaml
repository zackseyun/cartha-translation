id: LEV.7.25
reference: Leviticus 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: te
  text: ఎందుకంటే, యెహోవాకు అగ్న్యర్పణగా అర్పించదగిన జంతువు కొవ్వును ఎవరైనా తింటే, ఆ వ్యక్తి తన ప్రజలలో నుండి తెగదెంపబడును.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అగ్న్యర్పణ”కు ప్రత్యామ్నాయంగా “అగ్నిలో దహింపబడే అర్పణ” అని అనువదించవచ్చు. హెబ్రీ పదం బలిపీఠం మీద అగ్ని ద్వారా యెహోవాకు సమర్పించబడే అర్పణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తెగదెంపబడును” అనేది హెబ్రీ న్యాయ సూత్రాన్ని యథాతథంగా నిలుపుతుంది. అది సమాజం నుండి వెలివేతను, మరణాన్ని, లేదా దేవుని తీర్పును సూచిస్తుందా అనేది స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని తెలియజేసే అనుసంధాన పదంగా సహజంగా ఉంది.
- source_word: כָּל אֹכֵל
  choice: ఎవరు తిన్నా
  rationale: ఎవరైనా అనే సార్వత్రిక, అనిర్దిష్ట న్యాయ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలుల ధర్మశాస్త్రంలో ప్రత్యేకంగా దేవునికి కేటాయించిన జంతు కొవ్వు భాగాలను సూచించే సరళమైన పదం.
- source_word: מִן הַבְּהֵמָה
  choice: జంతువులోని
  rationale: బలి అర్పించదగిన పశువును విస్తృతంగా సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో మూల సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה אִשֶּׁה
  choice: దహనార్పణగా అర్పించే
  rationale: అనిర్దిష్ట కర్తతో ఉన్న హెబ్రీ క్రియను సహజమైన సంబంధ వాక్యంగా అందిస్తూ, అగ్నిలో బలిపీఠం మీద దహింపబడే అర్పణ భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను పేరుగా ప్రతిబింబిస్తూ, అర్పణ ఎవరికి సమర్పించబడుతుందో తెలియజేస్తుంది.
- source_word: וְנִכְרְתָה
  choice: తెగగొట్టబడాలి
  rationale: హెబ్రీ నిబంధనాత్మక శిక్షా సూత్రంలోని రూపకాన్ని, దాని ఖచ్చిత అమలు విధానాన్ని నిర్ణయించకుండా, సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: తిన్న ఆ వ్యక్తి
  rationale: న్యాయ సందర్భంలో נֶפֶשׁ అంటే వ్యక్తి; కొవ్వును తిన్నవారే శిక్షకు గురవుతారని స్పష్టంగా చెబుతుంది.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజలలో నుండి
  rationale: వ్యాకరణపరమైన స్త్రీలింగ ప్రత్యయం נֶפֶשׁతో ఏకీభవించినా, ఉద్దేశం ఏ అపరాధినైనా సూచించేది; ‘తన’ తెలుగు భాషలో లింగాన్ని అనవసరంగా నిర్దేశించదు.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ అనే నిబంధనాత్మక శిక్షా సూత్రం
  choice: తన ప్రజలలో నుండి తెగగొట్టబడాలి
  alternative: తన ప్రజలలో నుండి వెలివేయబడాలి; మరణశిక్ష పొందాలి
  rationale: ఈ శిక్ష వెలివేతనా, అకాల మరణమా, దేవుని తీర్పా అనే విషయం వివాదాస్పదం. అనువాదం ఒకే వివరణను నిర్ణయించకుండా మూలంలోని న్యాయ రూపకాన్ని నిలుపుతుంది.
- issue: అపరాధిని సూచించే సాధారణ న్యాయ భాషలో లింగం
  choice: ఆ వ్యక్తి ... తన ప్రజలలో నుండి
  alternative: ఆమె ప్రజలలో నుండి; అతని ప్రజలలో నుండి
  rationale: హెబ్రీ స్త్రీలింగ ప్రత్యయం נֶפֶשׁ అనే వ్యాకరణ స్త్రీలింగ నామవాచకంతో ఏకీభవిస్తుంది; అపరాధి తప్పనిసరిగా స్త్రీ అని సూచించదు. తెలుగు ‘వ్యక్తి/తన’ నిర్మాణం సాధారణ ఏకవచన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర సంబంధమైన గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘తెగగొట్టబడాలి’ అనే అసాధారణమైనా ఉద్దేశపూర్వకమైన రూపకం మూలంలోని అర్థ అనిశ్చితిని కాపాడుతుంది.
