  revised_text: ఎందుకంటే, యెహోవాకు అగ్న్యర్పణగా అర్పించదగిన జంతువు కొవ్వును ఎవరైనా తింటే, ఆ వ్యక్తి తన ప్రజలలో నుండి తెగదెంపబడును.[a][b]
