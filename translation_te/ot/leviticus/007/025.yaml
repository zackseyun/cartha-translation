- from: ఎందుకంటే, యెహోవాకు దహనార్పణగా అర్పించే జంతువులోని కొవ్వును ఎవరు తిన్నా, తిన్న ఆ వ్యక్తి తన ప్రజలలో నుండి తెగగొట్టబడాలి.[a][b]
  to: ఎందుకంటే, యెహోవాకు అగ్న్యర్పణగా అర్పించదగిన జంతువు కొవ్వును ఎవరైనా తింటే, ఆ వ్యక్తి తన ప్రజలలో నుండి తెగదెంపబడును.[a][b]
  rationale: సవరణ మూలంలోని బలి-సాంకేతిక పదాన్ని అతిగా సంకుచితం చేయకుండా, వాక్య నిర్మాణాన్ని సహజంగా చేసి, ‘cut off’ అనే వివాదాస్పద న్యాయ సూత్రానికి వివరణాత్మక ప్రత్యామ్నాయాన్ని ప్రధాన పాఠంలో రుద్దకుండా ఉంచుతుంది. రెండు పాదటిప్పణుల గుర్తులు పాఠాంతంలో సరైన క్రమంలో నిలిపాం.
