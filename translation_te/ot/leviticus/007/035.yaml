  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: te
  text: ఇది యెహోవా అగ్ని అర్పణలలోనుండి అహరోను యొక్క అభిషేకపు వాటా, అతని కుమారుల అభిషేకపు వాటా; వారిని యెహోవాకు యాజకులుగా సేవ చేయడానికి ఆయన సమర్పించిన రోజున ఇది ఇవ్వబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అభిషేకపు వాటా” అని అనువదించిన హీబ్రూ పదం అభిషేకంతో వ్యుత్పత్తి సంబంధం కలిగి ఉంది. ఈ సందర్భంలో అది యాజకుల ప్రతిష్ఠాపనతో సంబంధమున్న వారికి కేటాయించిన భాగాన్ని సూచించవచ్చు. “అభిషేక వాటా” లేదా “కేటాయించిన వాటా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: అహరోనుకు, అతని కుమారులకు అభిషేకంతో సంబంధించిన వాటా
  rationale: מִשְׁחַת అనే పదానికి అభిషేకంతో వ్యుత్పత్తి సంబంధం ఉంది; ఈ యాజక నియమ సందర్భంలో అది వారి ప్రతిష్ఠాపనతో ముడిపడిన నియమిత భాగాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం పునరుక్తిని కొంత కుదించినా, ఇద్దరికీ వాటా వర్తిస్తుందని స్పష్టంగా ఉంచబడింది.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యెహోవాకు అర్పించిన అగ్ని అర్పణలలోనుండి
  rationale: אִשֶּׁה అగ్నితో అర్పించే అర్పణను సూచిస్తుంది. సంప్రదాయ భావాన్ని నేరుగా నిలుపుతూ, 'లోనుండి' అనే మూల సంబంధాన్ని కూడా కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న 'యెహోవా' రూపంలో ఇచ్చాం.
- source_word: בְּיוֹם הִקְרִיב אֹתָם
  choice: అహరోనును, అతని కుమారులను ఆయన సమర్పించిన రోజున
  rationale: קרב హిఫీల్ రూపం ఇక్కడ వారిని దగ్గరకు తీసుకురావడం లేదా అధికారికంగా సమర్పించడం అనే భావం ఇస్తుంది. బలిగా అర్పించారనే అపార్థం రాకుండా 'సమర్పించిన' అని అనువదించాం; సర్వనామ సూచనను స్పష్టంచేయడానికి పేర్లను పునరుద్ధరించాం.
- source_word: לְכַהֵן לַיהוָה
  choice: యెహోవాకు యాజకులుగా సేవచేయడానికి
  rationale: כהן క్రియ యాజక బాధ్యతను నిర్వర్తించడాన్ని సూచిస్తుంది; ఈ ప్రయోజనార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యాజక నియమంలో מִשְׁחַת భావం
  choice: అభిషేకంతో సంబంధించిన నియమిత వాటా
  alternative: అభిషేకం; అభిషేక వాటా; కేవలం వాటా
  rationale: ఈ పదం అభిషేకంతో సంబంధాన్ని నిలుపుకున్నప్పటికీ, ముందున్న అర్పణల భాగాల సందర్భంలో యాజకులకు నియమించిన వాటాను సూచిస్తుంది. కేవలం 'అభిషేకం' అంటే నూనెతో చేసే క్రియగా అపార్థమవుతుంది; కేవలం 'వాటా' అంటే మూలపదంలోని అభిషేక సంబంధం కనుమరుగవుతుంది.
- issue: הִקְרִיב లో కర్త ఎవరు
  choice: ఆయన
  alternative: మోషే
  rationale: హీబ్రూ పాఠంలో కర్త నామం స్పష్టంగా లేదు. సందర్భం మోషేను సూచించవచ్చుగానీ, మూలంలోని వ్యాకరణ అస్పష్టతను తొలగించకుండా 'ఆయన' అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. 'అగ్ని అర్పణలు', 'యాజకులుగా సేవచేయడం' వంటి పదబంధాలు మూలంలోని ఆరాధనా పదజాలాన్ని స్పష్టంగా నిలుపుతాయి.
