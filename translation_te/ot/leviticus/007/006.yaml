id: LEV.7.6
reference: Leviticus 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל זָכָ֥ר בַּ/כֹּהֲנִ֖ים יֹאכְלֶ֑/נּוּ בְּ/מָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: te
  text: యాజకులలో ప్రతి పురుషుడు దానిని తినవచ్చు[a]. అది పవిత్ర స్థలంలో తినబడాలి. అది అతి పవిత్రమైనది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాజకులలో ప్రతి పురుషుడు దానిని తినాలి.” హెబ్రీ క్రియను విధిగా కూడా అర్థం చేసుకోవచ్చు; ఈ సందర్భంలో అది అర్హులైన యాజక పురుషులకు తినే అనుమతి ఉందనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “పవిత్రతలలో పవిత్రమైనది”; అంటే అత్యున్నత స్థాయిలో పవిత్రమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: యాజకులలో ప్రతి పురుషుడు
  rationale: כָּל‌ను విభాజక భావంలో ‘ప్రతి’ అని, זָכָר‌ను వయోజన స్థితికన్నా లింగాన్ని సూచించే ‘పురుషుడు’ అని అనువదించాం; בַּכֹּהֲנִים యాజక సమూహంలో సభ్యత్వాన్ని సూచిస్తుంది.
- source_word: יֹאכְלֶנּוּ
  choice: దానిని తినవచ్చు
  rationale: ఈ బలి నియమ సందర్భంలో అసంపూర్ణ క్రియ అనుమతించబడిన హక్కును సూచిస్తుంది; ‘తినవచ్చు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: పవిత్ర స్థలంలో
  rationale: మూలంలో ‘స్థలం’ నిర్దిష్ట ఉపపదం లేకుండా ఉంది; తెలుగు సందర్భంలో ‘పవిత్ర స్థలంలో’ అనేది నిర్దిష్ట అంతర్గర్భాలయాన్ని అనవసరంగా సూచించకుండా సహజంగా ఉంటుంది.
- source_word: יֵאָכֵל
  choice: తినబడాలి
  rationale: నిఫాల్ రూపంలోని కర్మణి న్యాయనిర్దేశాన్ని తెలుగు ‘తినబడాలి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పవిత్రమైనది
  rationale: అక్షరార్థంగా ‘పవిత్రతలలో పవిత్రమైనది’ అనే హెబ్రీ అత్యుత్తమతా ప్రయోగం; బలి పదార్థపు అత్యున్నత పవిత్ర స్థాయిని ‘అతి పవిత్రమైనది’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: అది
  rationale: ఈ సర్వనామం ముందుగా ప్రస్తావించిన బలి భాగాన్ని తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: యాజక వర్గంలో భుజించడానికి పురుషులకు విధించిన పరిమితి
  choice: యాజకులలో ప్రతి పురుషుడు దానిని తినవచ్చు
  alternative: ప్రతి యాజకుడు దానిని తినవచ్చు
  rationale: మూల హెబ్రీలో כָּל (‘ప్రతి’) మరియు זָכָר (‘పురుషుడు/మగవాడు’) రెండూ స్పష్టంగా ఉన్నాయి. లింగ పరిమితిని సాధారణీకరించకుండా ఆరాధనా నియమాన్ని ఉన్నట్లే నిలుపుతుంది.
- issue: భుజించడం హక్కా లేక ఆజ్ఞా
  choice: తినవచ్చు
  alternative: తినాలి
  rationale: יֹאכְלֶנּוּ రూపం ఒంటరిగా భవిష్యత్తు లేదా విధిని సూచించగలిగినా, ఈ సందర్భంలో అర్హులైన యాజక పురుషులకు అనుమతించబడిన భాగస్వామ్యాన్ని సూచిస్తుంది; ప్రత్యామ్నాయ విధి భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయనిర్దేశ శైలి వాడబడింది. ‘పురుషుడు’ మూలంలోని లింగ నిర్దిష్టతను కాపాడుతుంది; ‘పవిత్ర స్థలం’ అంతర్గర్భాలయం అనే అనవసర ప్రత్యేకీకరణను నివారిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
