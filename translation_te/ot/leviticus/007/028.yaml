  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: ‘YHWH’; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు హెబ్రీ మూలరూపాన్ని, సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: ఈ క్రియ తదుపరి దైవవాక్య భాగాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘మోషేతో ఇలా అన్నాడు’ అనేది וַיְדַבֵּר ... לֵאמֹר అనే మొత్తం సూత్రప్రయోగానికి సహజమైన, స్పష్టమైన సమానార్థక రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తిని సూచించే אֶל అనే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగాన్ని తెలుగులో సహజమైన ‘ఇలా అన్నాడు:’ రూపంతో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, హెబ్రీ రూపాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సహజంగా వినిపించే సంక్షిప్త దైవవాక్య పరిచయ సూత్రాన్ని వాడాం. మూలంలోని דבר మరియు אמר మధ్య రూపభేదాన్ని విడివిడిగా కృత్రిమంగా నిలబెట్టకుండా, తెలుగు ప్రయోగంలో రెండింటి సమిష్టి కార్యాన్ని ‘ఇలా అన్నాడు’ ద్వారా అందించాం.
