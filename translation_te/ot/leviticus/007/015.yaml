id: LEV.7.15
reference: Leviticus 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: te
  text: కృతజ్ఞతగా అర్పించే అతని సమాధాన బలి[a][b] మాంసాన్ని, అతడు దానిని అర్పించే రోజునే తినాలి; దానిలో ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని కృతజ్ఞతా సహవాస బలి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని సమాధాన బలులలో కృతజ్ఞతార్పణ బలి.’
    reason: construction_alternative
lexical_decisions:
- source_word: וּבְשַׂר
  choice: మాంసాన్ని
  rationale: בשר అంటే ‘శరీరం/మాంసం’; బలి సందర్భంలో ఆధునిక తెలుగులో ‘మాంసం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: זֶבַח
  choice: బలి
  rationale: זבח జంతువును వధించి అర్పించే బలిని సూచిస్తుంది; ‘బలి’ ఈ ఆచార సంబంధ అర్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תּוֹדַת
  choice: కృతజ్ఞతగా అర్పించే
  rationale: תודה కృతజ్ఞతను లేదా కృతజ్ఞతార్పణాన్ని సూచిస్తుంది. ఇక్కడ సమాధాన బలి యొక్క ఉద్దేశాన్ని తెలిపేలా క్రియాత్మకంగా అనువదించడం సహజమైన తెలుగు.
- source_word: שְׁלָמָיו
  choice: అతని సమాధాన బలి
  rationale: שלמים ఒక నిర్దిష్ట బలి వర్గం. ‘సమాధాన బలి’ అనే పదబంధం మూలపదంతో సన్నిహిత సంబంధాన్ని, లేవీయకాండమంతటా పదసామ్యాన్ని కాపాడుతుంది.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: అతడు దానిని అర్పించే రోజునే
  rationale: అక్షరార్థంగా ‘అతని అర్పణ రోజున.’ తెలుగులో కర్తను, సూచిత బలిని స్పష్టంగా చూపుతూ అదే రోజు అనే నియమాన్ని ‘రోజునే’ తెలియజేస్తుంది.
- source_word: יֵאָכֵל
  choice: తినాలి
  rationale: నిఫల్ రూపం అక్షరార్థంగా ‘తినబడాలి.’ అయితే తెలుగులో విధిని సహజంగా తెలిపేందుకు కర్మణి నిర్మాణం బదులు ‘తినాలి’ వాడబడింది; ఆజ్ఞాత్మక బలం నిలిచింది.
- source_word: לֹא יַנִּיחַ
  choice: మిగలనివ్వకూడదు
  rationale: హిఫిల్ రూపం ‘వదిలిపెట్టు/మిగిలి ఉండనివ్వు’ అని సూచిస్తుంది. ఆహారంలో కొంత భాగం మిగిల్చకూడదనే భావాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో ఏదీ
  rationale: అక్షరార్థంగా ‘దానిలోనుండి’; నిషేధ సందర్భంలో ఏ భాగమూ మిగలకూడదని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాల పరిమితిని మూలానికి నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి వర్గం అనువాదం
  choice: సమాధాన బలి
  alternative: సహవాస బలి
  rationale: హీబ్రూ పదం ఒక నిర్దిష్ట బలి వర్గానికి పేరు. ‘సమాధాన బలి’ మూలపదానికి దగ్గరగా ఉండి, ఆ బలి ఉద్దేశం కేవలం సహవాసమే అని ముందుగానే వ్యాఖ్యానించదు.
- issue: זֶבַח תּוֹדַת שְׁלָמָיו నిర్మాణ సంబంధం
  choice: కృతజ్ఞతగా అర్పించే అతని సమాధాన బలి
  alternative: అతని సమాధాన బలులలో కృతజ్ఞతార్పణ బలి
  rationale: ఈ సాంద్రమైన హీబ్రూ నిర్మాణం కృతజ్ఞత కోసం అర్పించే సమాధాన బలిని సూచిస్తుంది. ప్రధాన పాఠం సహజంగా ఉండేలా ఉపవర్గ భావాన్ని చూపింది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటీపులో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సంబంధ గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘తినబడాలి’ వంటి భారమైన కర్మణి రూపం బదులు సహజమైన ‘తినాలి’ ఎంచుకోబడింది; ‘సమాధాన బలి’ని కీలక ఆచార పదంగా స్థిరంగా ఉంచారు.
