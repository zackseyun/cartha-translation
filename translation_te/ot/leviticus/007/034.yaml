source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: te
  text: ఎందుకంటే, ఇశ్రాయేలు కుమారుల[a] సమాధాన బలుల[d]లోనుండి ఊపే అర్పణ రొమ్ము భాగాన్ని[b], ఎత్తి అర్పించే కానుక తొడ భాగాన్ని[c] నేను తీసుకొని, వాటిని యాజకుడైన అహరోనుకూ అతని కుమారులకూ ఇశ్రాయేలు కుమారుల నుండి శాశ్వత నియమంగా ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలకు వాడే ప్రామాణిక ఒడంబడిక సంబోధన.
    reason: lexical_alternative
  - marker: b
    text: “ఊపే అర్పణ” అనేది దేవుని ఎదుట ఊపి సమర్పించే ప్రత్యేక ఆచారాన్ని సూచిస్తుంది.
    reason: cultural_clarification
  - marker: c
    text: లేదా, “పైకెత్తే అర్పణ తొడ భాగం.” హీబ్రూ పదం దేవునికి ప్రత్యేకంగా వేరుచేసి సమర్పించే భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “సహవాస బలులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ఊపార్పణ ఛాతి భాగం
  rationale: חֲזֵה బలి జంతువు ఛాతి/రొమ్ము భాగాన్ని సూచిస్తుంది; תְּנוּפָה ప్రత్యేకంగా ఊపి సమర్పించే ఆచారాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ప్రతిష్ఠార్పణ తొడ భాగం
  rationale: שׁוֹק ఇక్కడ కాలు పైభాగమైన తొడను సూచిస్తుంది. תְּרוּמָה దేవునికి ప్రత్యేకించి సమర్పించిన భాగం; ‘ప్రతిష్ఠార్పణ’ దానిని సాధారణ విరాళంగా అపార్థం చేసుకోకుండా కాపాడుతుంది.
- source_word: לָקַחְתִּי
  choice: నేను తీసుకొని
  rationale: దైవిక నియామకానికి కారణం చెబుతున్న సంపూర్ణ క్రియ. తరువాతి וָאֶתֵּןతో సహజమైన తెలుగు సంయుక్త వాక్యంగా అనుసంధానించబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ ఒడంబడిక సంబంధమైన ప్రామాణిక సంబోధనను రూపపరంగా నిలుపుతుంది; సహజమైన సమూహార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: వారి సమాధానబలులు
  rationale: שְׁלָמִים అనే ప్రత్యేక బలి వర్గాన్ని ‘సమాధానబలులు’గా నిలుపుతుంది. זִבְחֵי యొక్క బలి భావం తెలుగులోని సమాసంలో అంతర్భూతంగా ఉంది.
- source_word: וָאֶתֵּן אֹתָם
  choice: ఇచ్చాను
  rationale: స్థాపించబడిన దైవిక కేటాయింపును సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְחָק עוֹלָם
  choice: శాశ్వత నియమిత భాగం
  rationale: חֹק యొక్క చట్టబద్ధమైన నియామక భావాన్నీ, ఈ సందర్భంలోని యాజకులకు రావలసిన వాటా భావాన్నీ కలిపి తెలుపుతుంది; עוֹלָם యొక్క నిరంతరతను ‘శాశ్వత’ నిలుపుతుంది.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల నుండి వారికి రావలసిన
  rationale: చివరి מֵאֵת కేవలం స్థల మూలాన్ని కాక, ఇశ్రాయేలీయుల నుండి యాజకులకు క్రమంగా చెల్లవలసిన నియమిత వాటాను సూచిస్తున్న సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక సమూహనామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని రూపాన్ని, ఒడంబడిక సంబంధమైన భాషను ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక సమూహార్థాన్ని పాదసూచికలో అందిస్తుంది.
- issue: שְׁלָמִים అనే బలి వర్గం
  choice: సమాధానబలులు
  alternative: సహవాస బలులు
  rationale: హీబ్రూ పదంలోని శాంతి/సంపూర్ణత సంబంధాన్ని నిలుపుతుంది; ‘సహవాసం’ అనే ఒక్క వ్యాఖ్యాన కోణానికి అర్థాన్ని పరిమితం చేయదు.
- issue: לְחָק עוֹלָם యొక్క కాలబద్ధత మరియు చట్టబద్ధత
  choice: శాశ్వత నియమిత భాగం
  alternative: నిత్య శాసనం
  rationale: ఇది యాజకులకు కేటాయించిన వాటా అని సందర్భం చెబుతుంది. ‘శాశ్వత’ మూలంలోని కొనసాగింపు బలాన్ని నిలుపుతుంది; దాని అన్వయ పరిధిని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యే గంభీరమైన శైలి. బలి ఆచారాలకు సంబంధించిన సాంకేతిక పదాలను సంక్షిప్త సమాసాలుగా ఉంచి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం. హీబ్రూ వాక్యంలోని కారణార్థక నిర్మాణం, రెండు ప్రత్యేక అర్పణ భాగాలు, యాజకులకు వాటి శాశ్వత కేటాయింపు అన్నీ నిలుపబడ్డాయి.
