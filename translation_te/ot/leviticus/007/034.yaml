review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the two designated sacrificial portions, their source in Israel's peace offerings, and their assignment to Aaron and his sons. However, its final independent sentence recasts the divine action ('I gave them') as a generalized statement about what is due, weakening the explicit first-person verbal structure and shifting 'as a permanent statute' toward 'a permanent allotted portion.'
  naturalness: The Telugu is generally clear, but 'ఊపార్పణ ఛాతి భాగం' and 'ప్రతిష్ఠార్పణ తొడ భాగం' are compressed compounds that sound less natural than transparent sacrificial phrases. A single sentence better follows the Hebrew legal declaration and reads naturally in modern standard Telugu.
  terminology: Use 'రొమ్ము భాగం' for the sacrificial breast and 'ఎత్తి అర్పించే కానుక' for תְּרוּמָה, with a footnote preserving the traditional 'పైకెత్తే అర్పణ' alternative. 'శాశ్వత నియమంగా' directly represents לְחָק עוֹלָם without importing the more specific concept of a priestly due into the main text.
  issues:
  - severity: medium
    issue: The final clause is recast as 'అది ... వారికి రావలసిన శాశ్వత నియమిత భాగం.'
    rationale: The Hebrew says that God took the portions and gave them to Aaron and his sons 'as a permanent statute from the sons of Israel.' The recast omits the explicit 'I gave them' from that clause and renders חֹק chiefly as an allotted share rather than a statute/regulation.
  - severity: low
    issue: The sacrificial terms are overly compressed in Telugu.
    rationale: '''ఊపార్పణ ఛాతి భాగం'' and especially ''ప్రతిష్ఠార్పణ తొడ భాగం'' are intelligible but not the most natural modern standard Telugu. More transparent phrasing retains the ritual distinction without obscuring the anatomy or action.'
  revised_text: ఎందుకంటే, ఇశ్రాయేలు కుమారుల[a] సమాధాన బలుల[d]లోనుండి ఊపే అర్పణ రొమ్ము భాగాన్ని[b], ఎత్తి అర్పించే కానుక తొడ భాగాన్ని[c] నేను తీసుకొని, వాటిని యాజకుడైన అహరోనుకూ అతని కుమారులకూ ఇశ్రాయేలు కుమారుల నుండి శాశ్వత నియమంగా ఇచ్చాను.
