translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి సంబంధ పదజాలంలో ‘అర్పించు’, ‘కృతజ్ఞతా బలి’ వాడబడ్డాయి. మూడు రకాల రొట్టెల మధ్య తేడాను సాధ్యమైనంత స్పష్టంగా ఉంచుతూ, מֻרְבֶּכֶת యొక్క వంటపద్ధతి విషయంలో మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
