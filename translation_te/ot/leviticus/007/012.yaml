id: LEV.7.12
reference: Leviticus 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: te
  text: అతడు దానిని కృతజ్ఞతా బలిగా అర్పిస్తే,[a] ఆ కృతజ్ఞతా బలితోపాటు నూనె కలిపిన పులియని రొట్టెలను, నూనె పూసిన పులియని పలుచని రొట్టెలను, నూనెతో బాగా కలిపి చేసిన సన్నని పిండి రొట్టెలను[b] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృతజ్ఞతార్పణగా.” హీబ్రూ పదం కృతజ్ఞత తెలుపుతూ తీసుకువచ్చే బలిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ వంటపదం సూచించే ఖచ్చితమైన తయారీ విధానం అనిశ్చితం; సన్నని పిండిని నూనెతో బాగా కలిపి లేదా ప్రత్యేకంగా తయారుచేసిన రొట్టెలను ఇది సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: కృతజ్ఞతా బలి
  rationale: ఈ బలి సందర్భంలో ఈ పదం కృతజ్ఞత తెలుపుతూ అర్పించే సమాధాన బలి రకాన్ని సూచిస్తుంది. ‘కృతజ్ఞతా బలి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: יַקְרִיבֶנּוּ
  choice: దానిని ... అర్పిస్తే
  rationale: קרב హిఫీల్ రూపం బలి సందర్భంలో సమర్పించడం లేదా అర్పించడం అనే భావాన్ని ఇస్తుంది; ‘అర్పించు’ తెలుగులో సహజమైన బలి సంబంధ పదం.
- source_word: זֶבַח הַתּוֹדָה
  choice: ఆ కృతజ్ఞతా బలి
  rationale: זֶבַח మరియు תּוֹדָה కలయిక కృతజ్ఞతకు సంబంధించిన బలిని సూచిస్తుంది. తెలుగులో అనవసర పునరుక్తి లేకుండా ఇదే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חַלּוֹת מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: חַלּוֹת రొట్టెలను లేదా రొట్టె ఆకారపు వంటకాలను, מַצּוֹת పులియనివని సూచిస్తాయి. ‘పులియని రొట్టెలు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: בלל పదం పదార్థాలను కలపడాన్ని సూచిస్తుంది; ‘నూనె కలిపిన’ సహజమైన ఆధునిక తెలుగు.
- source_word: רְקִיקֵי מַצּוֹת
  choice: పులియని పలుచని రొట్టెలు
  rationale: רְקִיקִים పలుచని రొట్టెలు లేదా అప్పడాలవంటి వంటకాలను సూచిస్తుంది. ‘పలుచని రొట్టెలు’ రూపాన్ని తెలియజేస్తూ అతిగా నిర్దిష్టమైన ఆధునిక వంటపదాన్ని నివారిస్తుంది.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: నూనె పూసిన
  rationale: משׁח మూలపదం పూయడం లేదా అభిషేకించడం అనే భావం కలిగి ఉంది. ఇక్కడ ఆహార తయారీ సందర్భం కాబట్టి ‘నూనె పూసిన’ చర్యను స్పష్టంగా తెలియజేస్తుంది; ఆచారపరమైన అభిషేక భావాన్ని అనవసరంగా రప్పించదు.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: సాధారణ బలి పదార్థమైన సన్నగా లేదా మెత్తగా చేసిన ఉత్తమ పిండిని సూచిస్తుంది; ‘మెత్తని పిండి’ ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: מֻרְבֶּכֶת
  choice: బాగా కలిపి చేసిన
  rationale: ఈ అరుదైన వంటపదం యొక్క ఖచ్చితమైన తయారీ విధానం అనిశ్చితం. ‘బాగా కలిపి చేసిన’ సందర్భానికి సరిపోతూ అతిగా నిర్దిష్టతను నివారిస్తుంది.
- source_word: חַלֹּת
  choice: రొట్టెలు
  rationale: పిండితో చేసిన విడివిడి రొట్టె వంటకాలను సూచిస్తుంది; తెలుగులో ‘రొట్టెలు’ విస్తృతమైన, సహజమైన పదం.
