base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/022.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH), సాధారణంగా ‘యాహ్వే’గా పునర్నిర్మించబడిన దైవనామం; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר అనే క్రియ ఇక్కడ కొత్త దైవవాక్య విభాగాన్ని ప్రారంభిస్తుంది. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘చెప్పాడు’ అనే రూపం తరువాత వచ్చే పలుకును సహజంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే వ్యక్తికి సంబంధించిన אֶלను ఆధునిక తెలుగులో సహజమైన ‘మోషేతో’ నిర్మాణంగా వ్యక్తం చేశాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష పలుకును పరిచయం చేసే לֵאמֹר సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పాడు’ అని వ్యక్తం చేశాం; దాని పనిని నిలుపుతూ హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించలేదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా నాలుగు అక్షరాల దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా ఉంచాం. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ; అసలు ఉచ్చారణ సాధారణంగా ‘యాహ్వే’గా పునర్నిర్మించబడుతుందని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ వాక్యప్రారంభ సంధిని ప్రత్యేకంగా అనువదించకుండా, కొత్త దైవవాక్య విభాగం మొదలవుతున్నదనే దాని ప్రసంగపరమైన పనిని నిలిపాం.
