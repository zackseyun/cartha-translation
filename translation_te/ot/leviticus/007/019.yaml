source:
  edition: WLC
  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: te
  text: అయితే, అపవిత్రమైన దేనినైనా తాకిన మాంసాన్ని తినకూడదు; దాన్ని అగ్నిలో కాల్చివేయాలి. మాంసం విషయానికి వస్తే, ఆచారపరంగా పవిత్రంగా ఉన్న ఎవరైనా మాంసాన్ని తినవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆచారపరంగా పవిత్రంగా’—హీబ్రూ పదం ఇక్కడ నైతిక పరిపూర్ణతను కాక, బలి మాంసం తినడానికి తగిన ఆచారపరమైన స్థితిని సూచిస్తుంది.
    reason: theological_clarification
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: అయితే ... మాంసాన్ని
  rationale: ఇక్కడ בָּשָׂר బలి అర్పణలోని తినదగిన మాంసాన్ని సూచిస్తుంది. ప్రారంభ సంధిని సందర్భంలోని వ్యత్యాసాన్ని తెలియజేయడానికి ‘అయితే’గా అనువదించాం.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: అపవిత్రమైన దేనినైనా తాకిన
  rationale: יִגַּע ప్రత్యక్ష సంపర్కాన్ని సూచిస్తుంది; כָּל טָמֵא విస్తృతమైన ఆచారపరమైన అపవిత్ర వస్తువు లేదా పదార్థాన్ని సూచిస్తున్నందున దాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: לֹא יֵאָכֵל
  choice: తినకూడదు
  rationale: నిఫాల్ రూపంలోని నిషేధాత్మక న్యాయబలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: దాన్ని అగ్నిలో కాల్చివేయాలి
  rationale: అపవిత్రమైన బలి మాంసాన్ని అగ్ని ద్వారా పూర్తిగా తొలగించాలనే నిర్దేశాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: וְהַבָּשָׂר
  choice: మిగిలిన మాంసాన్ని
  rationale: రెండవ ప్రస్తావన అపవిత్రమైన మాంసానికి భిన్నంగా తినడానికి అనుమతించబడిన మాంసం వైపు విషయమార్పును సూచిస్తుంది. తెలుగులో అనవసర పునరుక్తిని తగ్గిస్తూ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל טָהוֹר
  choice: ఆచారపరంగా పవిత్రంగా ఉన్న ఎవరైనా
  rationale: విశేషణం వ్యక్తులను సూచించే నామవాచకార్థంలో ఉంది. ఇది నైతిక నిర్దోషిత్వం కాక ఆచారపరమైన స్థితి అని స్పష్టం చేయడానికి ‘ఆచారపరంగా’ చేర్చాం.
- source_word: יֹאכַל בָּשָׂר
  choice: తినవచ్చు
  rationale: ఈ రూపం ఆజ్ఞకన్నా అనుమతిని తెలియజేస్తుంది. ఇప్పటికే పేర్కొన్న మాంసమే కర్మగా కొనసాగుతున్నందున తెలుగులో మళ్లీ పునరుక్తి చేయలేదు.
theological_decisions:
- issue: טָמֵא / טָהוֹר పదాల స్వభావం
  choice: ‘అపవిత్రమైన’ / ‘ఆచారపరంగా పవిత్రంగా ఉన్న’
  alternative: ‘మైలపడిన’ / ‘శుద్ధిగా ఉన్న’
  rationale: లేవీయకాండంలోని బలి నియమాల సందర్భంలో ఇవి ప్రధానంగా ఆచారపరమైన స్థితిని సూచిస్తాయి; నైతిక పాపం లేదా అంతరంగ పవిత్రతను తప్పనిసరిగా సూచించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘అగ్నిలో కాల్చివేయాలి’ అనే రూపం నిర్దేశిత నిర్మూలనను స్పష్టంగా తెలియజేస్తుంది.
