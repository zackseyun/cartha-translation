  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל דָּם֙ לֹ֣א תֹאכְל֔וּ בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶ֑ם לָ/ע֖וֹף וְ/לַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: te
  text: మీరు నివసించే ప్రదేశాలన్నిటిలో పక్షులదైనా జంతువులదైనా ఏ రక్తాన్నీ తినకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: ఏ రక్తాన్నీ
  rationale: నిషేధ వాక్యంలో כָּל దָּם అంటే సహజమైన తెలుగులో ‘ఏ రక్తాన్నీ’ అని పంపిణీయ భావంతో చెప్పడం సముచితం. ఆరంభంలోని וְ సందర్భానుసంధానాన్ని సూచించినా, తెలుగులో ప్రతి వాక్యాన్నీ ‘మరియు’తో మొదలుపెట్టడం అసహజం కాబట్టి ప్రత్యక్షంగా వ్యక్తపరచలేదు.
- source_word: לֹא תֹאכְלוּ
  choice: తినకూడదు
  rationale: న్యాయనియమంలోని రెండవ పురుష బహువచన నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: మీరు నివసించే ప్రదేశాలన్నిటిలో
  rationale: מוֹשָׁב నివాసస్థలం లేదా స్థావరం అనే భావాన్ని కలిగి ఉంది. ఈ రూపం ‘మీ నివాసాలన్నిటిలో’ అనే అక్షరార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: పక్షిదైనా జంతువుదైనా
  rationale: లామెద్ ఉపసర్గ ఇక్కడ రక్తం ఏ జీవివర్గానికి చెందినదో సూచిస్తుంది. హెబ్రీలోని ‘పక్షికి మరియు జంతువుకు’ అనే నిర్మాణాన్ని తెలుగులో మూలం/చెందుదల భావం స్పష్టమయ్యేలా ‘పక్షిదైనా జంతువుదైనా’గా అందించాం.
theological_decisions:
- issue: రక్త నిషేధపు పరిధి
  choice: ఇశ్రాయేలీయులు నివసించే ప్రదేశాలన్నిటిలో పక్షులకు లేదా జంతువులకు చెందిన ఏ రక్తాన్నీ తినకూడదనే నిషేధం
  alternative: చివరి మాటలను మరింత అక్షరార్థంగా ‘పక్షికి మరియు జంతువుకు’ అని అనువదించడం
  rationale: హెబ్రీ వాక్యనిర్మాణం నిషేధించబడిన రక్తం చెందిన జీవివర్గాలను పేర్కొంటుంది. తరువాతి కాలపు ధార్మిక వివరణలను చేర్చకుండా న్యాయనియమాన్ని మాత్రమే స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన న్యాయనియమ శైలి. మూలంలోని అర్థాన్ని నిలుపుతూ అనవసరమైన అక్షరానువాద కఠినతను నివారించాం.
