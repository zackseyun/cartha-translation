  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: యెహోవాకు సమాధాన బలిని[b] అర్పించేవాడు, తన సమాధాన బలిలోనుండి యెహోవాకు తన అర్పణను తీసుకురావాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలు ప్రజలతో’ లేదా ‘ఇశ్రాయేలీయులతో.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులతో.’
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయంగా ‘సమాధాన అర్పణ’; మరికొన్ని అనువాదాల్లో ‘సహవాస బలి.’ ఇక్కడి హీబ్రూ పదబంధం అక్షరార్థంగా ‘తన సమాధాన అర్పణల బలి’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: దైవ ఆజ్ఞను పరిచయం చేసే ఏకవచన ఆజ్ఞార్థకం. ఆధునిక తెలుగులో ‘మాట్లాడు’ కంటే ‘చెప్పు’ సహజంగా, నేరుగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచనాన్ని నిలుపుతూ, దాని సామూహిక నిబంధనార్థాన్ని కూడా సూచిస్తుంది.
- source_word: הַמַּקְרִיב
  choice: అర్పించేవాడు
  rationale: קרב హిఫీల్ రూపం బలిని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించే ఆచారక్రియను సూచిస్తుంది; తెలుగులో ‘అర్పించు’ సహజమైన బలిసంబంధ పదం.
- source_word: זֶבַח שְׁלָמָיו
  choice: తన సమాధాన బలి
  rationale: זֶבַח యొక్క ‘బలి’ భావాన్ని, שְׁלָמִיםకు సంబంధించిన శాంతి/క్షేమ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: నాలుగు అక్షరాల దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, మూలపాఠంలోని వ్యక్తినామ స్వభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יָבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయపరమైన సందర్భంలో అపూర్ణక్రియకు ఉన్న విధి/బాధ్యత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణ
  rationale: దేవుని దగ్గరకు తీసుకువచ్చే సాధారణ సమర్పణను సూచించే קרבןకు స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: తన సమాధాన బలిలోనుండి
  rationale: מִן సూచించే మూలం లేదా భాగసంబంధాన్ని ‘లోనుండి’ స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఇది సాధారణ బిరుదు కాక నిబంధన దైవనామం; తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ దాని వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: שְׁלָמִים బలి పరిభాష
  choice: సమాధాన బలి
  alternative: సహవాస బలి
  rationale: శాంతి/క్షేమానికి సంబంధించిన మూలపద అనుబంధాన్ని నిలుపుతూ, ‘సహవాసం’ అనే వ్యాఖ్యాత్మక భావాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయదు.
- issue: בְּנֵי יִשְׂרָאֵלలో లింగసూచన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ రూపాన్ని ప్రధాన పాఠంలో కాపాడి, సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. ‘చెప్పు,’ ‘అర్పించేవాడు,’ ‘తీసుకురావాలి’ వంటి సహజ రూపాలతో మూలంలోని ఆజ్ఞాత్మకతను నిలిపింది.
