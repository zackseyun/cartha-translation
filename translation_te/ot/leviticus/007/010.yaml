id: LEV.7.10
reference: Leviticus 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: te
  text: నూనెతో కలిపినదైనా, పొడిగా ఉన్నదైనా, ప్రతి ధాన్యార్పణ అహరోను కుమారులందరికీ చెందాలి; ఒక్కొక్కరికి తన సహోదరునితో సమానంగా రావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని బలి సందర్భంలో ఇది సాధారణ కానుకను కాకుండా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెతో కలపబడిన అర్పణ తయారీ విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חֲרֵבָה
  choice: పొడిగా ఉన్నది
  rationale: నూనెతో కలిపిన అర్పణకు వ్యతిరేకంగా ఉన్న ‘పొడి’ అనే మూలార్థాన్ని నిలుపుతుంది; ‘నూనె లేనిది’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: అహరోను కుమారులందరికీ చెందాలి
  rationale: లామెద్‌తో కూడిన היה ఇక్కడ స్వామ్యాన్ని లేదా కేటాయింపును సూచిస్తుంది; ఈ ఎంపిక న్యాయపరమైన పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: యాజకత్వానికి సంబంధించిన ఈ నియమంలో హెబ్రీ మూలం పురుష బంధుత్వ పదాన్ని స్పష్టంగా వాడుతుంది; దానిని లింగతటస్థంగా మార్చకుండా నిలిపింది.
- source_word: אִישׁ כְּאָחִיו
  choice: ఒక్కొక్కరికి తన సహోదరునితో సమానంగా
  rationale: పదబంధంలోని వ్యక్తిగత పంపిణీ భావాన్నీ, సహోదరునితో పోలికనూ నిలుపుతూ, అందరికీ సమాన వాటా రావాలనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యాజకులకు సంబంధించిన లింగసూచక భాష
  choice: అహరోను కుమారులు ... తన సహోదరునితో
  alternative: అహరోను సంతతి ... ఒక్కొక్కరికి సమానంగా
  rationale: మూల హెబ్రీ వచనం యాజక నియమ సందర్భంలో పురుష బంధుత్వ పదాలను ఉపయోగిస్తుంది. అందువల్ల లింగతటస్థ పదాలతో మార్చకుండా మూలంలోని రూపాన్ని నిలిపాం.
- issue: అర్పణ పంపిణీ విధానం
  choice: ఒక్కొక్కరికి తన సహోదరునితో సమానంగా రావాలి
  alternative: ఒక్కొక్కరు తన సహోదరునివలె పొందాలి
  rationale: אִישׁ כְּאָחִיו అనే హెబ్రీ నుడికారం సమాన పంపిణీని సూచిస్తుంది. పోలికను నిలుపుతూనే న్యాయపరమైన సమాన వాటా భావాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయపర/ఆరాధనా శైలిని ఉపయోగించాం. ‘ధాన్యార్పణ’ను సాంకేతిక బలి పదంగా నిలిపి, వాక్యాంతంలో సమాన పంపిణీ భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
