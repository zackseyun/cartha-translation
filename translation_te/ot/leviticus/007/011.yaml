id: LEV.7.11
reference: Leviticus 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת זֶ֣בַח הַ/שְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: te
  text: 'యహ్వేకు అర్పించే సమాధాన బలి[a] గురించిన నియమం ఇదే:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్షేమ బలి.’
    reason: שְׁלָמִים అనే పదం సమాధానంతో పాటు సంపూర్ణత, క్షేమం అనే భావాలను కూడా కలిగి ఉంది.
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ఇదే
  rationale: వావ్ ఇక్కడ కొత్త ఉపవిభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో కృత్రిమంగా ‘మరియు’ అని ప్రారంభించకుండా, ‘ఇదే’ ద్వారా సూచనకు తగిన ఉద్ఘాటనను సహజంగా వ్యక్తం చేశాం.
- source_word: תּוֹרַת
  choice: గురించిన నియమం
  rationale: యాజక సంబంధ సందర్భంలో תּוֹרָה నిర్దేశిత ఆచార నియమాన్ని సూచిస్తుంది. ‘నియమం’ దాని న్యాయపరమైన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: זֶבַח
  choice: బలి
  rationale: זֶבַח వధతో కూడిన బలిని సూచించే ఆరాధనా పదం. తెలుగులో ‘బలి’ సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: הַ/שְּׁלָמִים
  choice: సమాధాన బలి
  rationale: שְׁלָמִים ఒక సాంకేతిక బలి పదం. సంప్రదాయంగా అర్థమయ్యే ‘సమాధాన బలి’ని ప్రధాన పాఠంలో ఉంచి, సంపూర్ణ క్షేమం అనే భావపరిధిని ‘క్షేమ బలి’ రూపంలో పాదసూచికలో భద్రపరిచాం.
- source_word: אֲשֶׁר יַקְרִיב
  choice: అర్పించే
  rationale: קרב హిఫిల్ రూపం బలిని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది. మూడవ పురుష ఏకవచనం ఇక్కడ సాధారణ న్యాయపరమైన కర్తను సూచిస్తున్నందున, తెలుగులో లింగనిరపేక్షంగా సహజమైన ‘అర్పించే’ అని అనువదించాం.
- source_word: לַ/יהוָה
  choice: యహ్వేకు
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం; ל ఉపసర్గను ‘కు’ ద్వారా తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక లిప్యంతరీకరణతో నిలిపాం.
- issue: שְׁלָמִים అనే బలి పదంలోని భావపరిధి
  choice: సమాధాన బలి
  alternative: క్షేమ బలి
  rationale: ఈ పదంలో సమాధానం, సంపూర్ణత, క్షేమం వంటి పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠంలో సంప్రదాయ సాంకేతిక పదాన్ని ఉంచి, మరొక సముచిత భావాన్ని పాదసూచికలో ఇచ్చాం; ఏకైక వ్యాఖ్యానంతో పదాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. వాక్యాన్ని అధిక సంస్కృతీకరణ లేకుండా సాధారణ పాఠకులకు సులభంగా ఉంచాం; చివరి ద్విబిందువు తరువాత వచ్చే నియమాల జాబితాను సూచిస్తుంది.
