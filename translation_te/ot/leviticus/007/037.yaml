  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: te
  text: ఇది దహనబలి, ధాన్యార్పణ, పాపపరిహార బలి[a], అపరాధపరిహార బలి[b], యాజక ప్రతిష్ఠా విధులు[c], సమాధాన బలుల యజ్ఞం[d] గురించిన నియమం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శుద్ధీకరణ బలి’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం పాపంతో వ్యవహరించడాన్ని మాత్రమే కాక అపవిత్రతను తొలగించడాన్ని కూడా నొక్కి చెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నష్టపరిహార బలి’ లేదా ‘దోషబలి’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం అపరాధ బాధ్యతను, చేయవలసిన పరిహారాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో ఇది బహువచనంలో ఉంది; అక్షరార్థంగా ‘నింపే కార్యాలు.’ ఇక్కడ యాజకులను పదవిలో నియమించి ప్రతిష్ఠించే విధులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: ‘సహవాస బలుల యజ్ఞం’ లేదా ‘క్షేమ బలుల యజ్ఞం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: ఇది ... గురించి ఇచ్చిన ధర్మశాస్త్రం
  rationale: స్త్రీలింగ ఏకవచన నిర్దేశకంతో మొదలయ్యే సంగ్రహ వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ఈ బలులను నియంత్రించే నిర్దిష్ట ధర్మవిధి అనే భావాన్ని ‘ధర్మశాస్త్రం’ నిలుపుతుంది.
- source_word: לָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలిని సూచిస్తుంది; ‘దహనబలి’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: לַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని మִנְחָה సాధారణంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణ’ ఆధునిక పాఠకునికి సహజంగా అర్థమవుతుంది.
- source_word: וְלַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: חַטָּאת పాపంతో వ్యవహరించే బలిని సూచించగలదు; దానికి శుద్ధీకరణ భావం కూడా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְלָאָשָׁם
  choice: అపరాధపరిహార బలి
  rationale: אָשָׁם అపరాధం, బాధ్యత, దానికి సంబంధించిన పరిహారం అనే భావాలను కలిగి ఉంది. ఈ తెలుగు రూపం కేవలం అంతర్గత దోషభావం కాక బాధ్యతను కూడా తెలియజేస్తుంది.
- source_word: וְלַמִּלּוּאִים
  choice: యాజక ప్రతిష్ఠా విధులు
  rationale: מִלּוּאִים బహువచన రూపంలో ఉండి యాజకులను నియమించి ప్రతిష్ఠించే ప్రక్రియలను సూచిస్తుంది; ఒకే ‘బలి’గా పరిమితం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలుల అర్పణ
  rationale: זֶבַח అనే ‘బలి/బలి అర్పణ’ భావాన్ని, שְׁלָמִים అనే సంప్రదాయ ‘సమాధాన బలులు’ వర్గనామాన్ని రెండింటినీ ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: חַטָּאת యొక్క పాపం–శుద్ధీకరణ భావపరిధి
  choice: ప్రధాన పాఠ్యంలో ‘పాపపరిహార బలి’
  alternative: ‘శుద్ధీకరణ బలి’
  rationale: సంప్రదాయంగా గుర్తించదగిన పాప సంబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచుతూ, ఆచార అపవిత్రత తొలగింపు భావాన్ని పాదసూచికలో కాపాడాం.
- issue: אָשָׁם యొక్క అపరాధం–పరిహారం భావపరిధి
  choice: ‘అపరాధపరిహార బలి’
  alternative: ‘నష్టపరిహార బలి’ లేదా ‘దోషబలి’
  rationale: మూలపదంలోని అపరాధ బాధ్యతను, అవసరమైన పరిహారాన్ని ఒకే పేరులో సాధ్యమైనంతవరకు వ్యక్తం చేశాం.
- issue: שְׁלָמִים యొక్క అర్థవ్యాప్తి
  choice: ‘సమాధాన బలులు’
  alternative: ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు’
  rationale: ఏకైక సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించకుండా సంప్రదాయ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి ఇతర నిజమైన భావఛాయలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. జాబితా సహజంగా వినిపించేందుకు విభక్తిని చివరి ‘గురించి’తో సమన్వయించాం. మూలంలోని బహువచన מִלּוּאִיםను ‘విధులు’గా స్పష్టంగా నిలిపాం; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉన్నాయి.
