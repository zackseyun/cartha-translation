id: LEV.7.16
reference: Leviticus 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: te
  text: అయితే అతని అర్పణబలి మొక్కుబడికి సంబంధించినదైనా లేదా స్వచ్ఛంద అర్పణమైనా[a], అతడు తన బలిని అర్పించిన రోజున దానిని తినాలి; మరుసటి రోజున దానిలో మిగిలినదాన్ని తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొక్కుబడి అర్పణ’ అని కూడా అనువదించవచ్చు. హెబ్రీ మూలపాఠం మొక్కుబడికి సంబంధించిన బలికి, ఇష్టపూర్వకంగా ఇచ్చే స్వచ్ఛంద అర్పణకు మధ్య తేడా చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: మొక్కుబడిగా
  rationale: ఈ సందర్భంలో ఈ పదం మొక్కుకున్న దానికి సంబంధించిన బలిని సూచిస్తుంది. ‘మొక్కుబడిగా’ అనేది అర్పణ వెనుకనున్న బద్ధతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద అర్పణగా
  rationale: బాధ్యత వల్ల కాకుండా ఇష్టపూర్వకంగా ఇచ్చే అర్పణను ఇది సూచిస్తుంది; ‘స్వచ్ఛంద అర్పణ’ ఈ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: అతని అర్పణ బలి
  rationale: זֶבַח అనే ‘బలి’ భావాన్నీ, קָרְבָּן అనే ‘అర్పణ’ భావాన్నీ కుదించకుండా రెండింటినీ నిలుపుతుంది.
- source_word: בְּיוֹם הַקְרִיבוֹ אֶת זִבְחוֹ
  choice: అతడు తన బలిని అర్పించిన రోజున
  rationale: קרב హిఫీల్ రూపంలోని బలిని సమర్పించడం/దగ్గరకు తీసుకురావడం అనే ఆచార సంబంధ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יֵאָכֵל
  choice: తినాలి
  rationale: మొదటి సందర్భంలో నిఫాల్ అసంపూర్ణ క్రియ యొక్క నియమాత్మక భావాన్ని తెలుగులో చట్టపరమైన ఆదేశంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִמָּחֳרָת
  choice: మరుసటి రోజున కూడా
  rationale: తరువాతి రోజును సూచించే కాలభావాన్ని స్పష్టంగా తెలుపుతుంది; ‘కూడా’ రెండవ రోజు అనుమతిని సహజంగా కలుపుతుంది.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: దానిలో మిగిలినదాన్ని
  rationale: బలిలో తినకుండా మిగిలిన భాగాన్ని సరళంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: יֵאָכֵל
  choice: తినవచ్చు
  rationale: అదే హెబ్రీ రూపం రెండోసారి వచ్చినా, ఇక్కడ మిగిలిన భాగాన్ని రెండో రోజున తినడానికి ఉన్న అనుమతిని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార నియమానికి తగిన గంభీరతతో కూడిన సరళమైన శైలి. ‘మొక్కుబడి’ సాధారణ పాఠకులకు పరిచితమైన పదం; ‘స్వచ్ఛంద అర్పణ’ దానికి భిన్నమైన ఇష్టపూర్వక అర్పణను స్పష్టంగా చూపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
