revisions:
- from: అయితే అతని అర్పణ బలిని మొక్కుబడిగా గానీ స్వచ్ఛంద అర్పణగా గానీ అర్పిస్తే[a], అతడు తన బలిని అర్పించిన రోజున దాన్ని తినాలి. దానిలో మిగిలినదాన్ని మరుసటి రోజున కూడా తినవచ్చు.
  to: అయితే అతని అర్పణబలి మొక్కుబడికి సంబంధించినదైనా లేదా స్వచ్ఛంద అర్పణమైనా[a], అతడు తన బలిని అర్పించిన రోజున దానిని తినాలి; మరుసటి రోజున దానిలో మిగిలినదాన్ని తినవచ్చు.
  rationale: The revision preserves the Hebrew distinction between a sacrifice associated with a vow and a voluntary offering, while expressing the category relationship idiomatically in modern standard Telugu. It also avoids making the first passive eating provision more restrictive than the source.
