id: LEV.7.27
reference: Leviticus 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל נֶ֖פֶשׁ אֲשֶׁר תֹּאכַ֣ל כָּל דָּ֑ם וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּֽי/הָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: te
  text: ఏ వ్యక్తి ఏ రక్తాన్నైనా తింటాడో, ఆ వ్యక్తి తన ప్రజల మధ్యనుండి నిర్మూలింపబడును[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మ.’ ఇక్కడ హీబ్రూ నెఫెష్ అనే పదం ఒక వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నిర్మూలింపబడును’ అనేది నిబంధనలో కనిపించే ప్రామాణిక శిక్షా సూత్రం. ఇది సమాజం నుండి తొలగింపును లేదా దేవుని తీర్పును సూచించవచ్చు; అయితే అది ఏ విధంగా జరుగుతుందో హీబ్రూ పాఠం ఇక్కడ స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: వ్యక్తి
  rationale: ధర్మశాస్త్ర సందర్భంలో ఇది శరీరానికి వేరైన ‘ఆత్మ’ను కాకుండా ఒక వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యక్తి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תֹּאכַל
  choice: తింటాడో
  rationale: అసంపూర్ణ క్రియ ఇక్కడ సాధారణంగా వర్తించే నియమాన్ని తెలియజేస్తుంది; ‘ఎవరు ... తింటారో’ అనే తెలుగు నిర్మాణం ఆ న్యాయపరమైన సాధారణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּל דָּם
  choice: ఏ రక్తాన్నైనా
  rationale: లెక్కించలేని నామవాచకంతో כָּל ఇక్కడ పంపిణీ భావంలో ఉండి, ‘ఏ విధమైన రక్తమైనా’ అనే అర్థాన్ని ఇస్తుంది; మొత్తం రక్తమంతా అనే భావం కాదు.
- source_word: וְנִכְרְתָה
  choice: తొలగించబడాలి
  rationale: నిఫ్అల్ రూపంలోని כרת నిబంధనాపరమైన శిక్షా సూత్రం. తెలుగు వాక్యం శిక్ష యొక్క నిర్దిష్ట విధానాన్ని నిర్ణయించకుండా, సమాజం నుండి వేరుచేయబడే భావాన్ని నిలుపుతుంది.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి
  rationale: మొదటి ఉపవాక్యంలో పేర్కొన్న అపరాధిని నామవాచకం, సూచకపదంతో మళ్లీ బలంగా గుర్తిస్తుంది; ‘ఆ వ్యక్తి’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజలలో నుండి
  rationale: హీబ్రూ స్త్రీలింగ ప్రత్యయం נֶפֶשׁ యొక్క వ్యాకరణ లింగం వల్ల వచ్చింది; నియమం స్త్రీలకు మాత్రమే పరిమితం కాదు. ‘తన’ లింగనిరపేక్షంగా వ్యక్తి చెందిన ప్రజాసమూహాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ‘తొలగించబడాలి’ అనే నిబంధనాపరమైన శిక్ష యొక్క అర్థం
  choice: మరణం, సమాజబహిష్కరణ, లేదా దేవుని ప్రత్యక్ష తీర్పు అని నిర్దిష్టంగా చెప్పకుండా సాధారణ శిక్షా సూత్రాన్ని నిలుపడం.
  alternative: ‘చంపబడాలి,’ ‘సమాజం నుండి బహిష్కరించబడాలి,’ లేదా ‘దేవునిచేత నాశనం చేయబడాలి.’
  rationale: హీబ్రూ సూత్రం సంక్షిప్తంగా ఉండి శిక్ష అమలయ్యే ఖచ్చిత విధానాన్ని ఇక్కడ పేర్కొనదు. అందువల్ల వివాదాస్పదమైన ఒకే వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా మూలంలోని సందిగ్ధతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘తన’ ద్వారా వ్యాకరణ లింగాన్ని జీవలింగంగా అపార్థం చేసుకోకుండా నివారించాం; మూలంలోని శిక్షా సూత్రపు సందిగ్ధతను పాదటిప్పణిలో వివరించాం.
