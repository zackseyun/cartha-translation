id: LEV.7.8
reference: Leviticus 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: te
  text: ఒక పురుషుని దహనబలిని అర్పించే యాజకునికి, తాను అర్పించిన ఆ దహనబలి చర్మం చెందుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తోలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: బలి ఆచారాల సందర్భంలో כֹּהֵןకు ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: అర్పించే / అర్పించిన
  rationale: హిఫీల్ రూపంలోని ఆచారపరమైన ‘సమర్పించడం, అర్పించడం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֹלַת אִישׁ
  choice: ఒక పురుషుని దహనబలి
  rationale: עֹלָהను లేవీయకాండంలోని బలి వర్గంగా ‘దహనబలి’ అని అనువదించి, אִישׁలోని ఏకవచన పుంలింగ సూచనను నిలుపుతుంది.
- source_word: עֹור
  choice: చర్మం
  rationale: బలిపశువు చర్మాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: యాజకునికి ... చెందుతుంది
  rationale: అక్షరార్థంగా ‘యాజకునికి, అతనికే అది ఉంటుంది’; చర్మం బలి అర్పించిన యాజకుని భాగమవుతుందనే భావాన్ని తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אִישׁ యొక్క లింగ సూచన
  choice: ఒక పురుషుని దహనబలి
  alternative: ఒక వ్యక్తి అర్పించిన దహనబలి
  rationale: మూలంలోని ఏకవచన పుంలింగ నామవాచకాన్ని సాధారణీకరించకుండా నిలిపింది.
- issue: עֹלָה అనే బలి పదం
  choice: దహనబలి
  alternative: ఆరోహణ బలి
  rationale: మూలపదానికి ‘పైకి ఎక్కడం’తో వ్యుత్పత్తి సంబంధం ఉన్నప్పటికీ, ఇక్కడ అది పూర్తిగా దహించబడే నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది; ‘దహనబలి’ ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన ఆచారపరమైన పదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి ధర్మశాస్త్రానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి. మూలంలోని పుంలింగ ఏకవచనం నిలుపబడింది; వాక్యక్రమం సహజమైన తెలుగుకు అనుగుణంగా మార్చబడింది.
