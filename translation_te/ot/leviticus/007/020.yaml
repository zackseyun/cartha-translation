id: LEV.7.20
reference: Leviticus 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: te
  text: అయితే, యెహోవాకు చెందిన సమాధానబలిలోని మాంసాన్ని తన అపవిత్రత తన మీద ఉండగానే తినే వ్యక్తి తన ప్రజల మధ్యనుండి తొలగించబడాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన ప్రజల సమాజం నుండి వెలివేయబడాలి.’ ఇక్కడి హీబ్రూ పదబంధం వెలివేతను లేదా మరణాన్ని సూచించవచ్చు; అయితే అది ఏ విధంగా అమలు అవుతుందో ఈ వచనం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: ధర్మశాస్త్ర సందర్భంలో נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాకుండా ఒక వ్యక్తిని సూచిస్తుంది; ‘వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: תֹּאכַל
  choice: తినే
  rationale: ఇక్కడ అసంపూర్ణ క్రియ సాధారణ న్యాయపరమైన సందర్భాన్ని తెలియజేస్తుంది; సంబంధార్థక రూపమైన ‘తినే’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: బలి ఆహార సందర్భంలో ‘మాంసం’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: సమాధానబలి మాంసాన్ని
  rationale: שְׁלָמִים అనే నిర్దిష్ట బలి వర్గానికి సంప్రదాయపరంగా గుర్తించదగిన ‘సమాధానబలి’ని వాడుతూ, מן భావాన్ని ‘మాంసాన్ని’ అనే సందర్భంలో సహజంగా వ్యక్తం చేసింది.
- source_word: אֲשֶׁר לַיהוָה
  choice: యెహోవాకు చెందిన
  rationale: ఈ పదబంధం బలి యెహోవాకు ప్రతిష్ఠించబడి ఆయనకు చెందిందని సూచిస్తుంది; ‘చెందిన’ పవిత్ర స్వామ్య భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: తన అపవిత్రత తన మీద ఉండగానే
  rationale: వ్యక్తి అపవిత్రత అతని ‘మీద’ ఉందనే హీబ్రూ రూపకాన్ని, దాని ఆచారపరమైన న్యాయబలాన్ని కాపాడుతూ తెలుగులో చదవదగిన విధంగా ఉంచింది.
- source_word: וְנִכְרְתָה
  choice: తొలగించబడాలి
  rationale: כרת నిఫల్ రూపం సమాజం నుండి తీవ్రమైన తొలగింపును సూచిస్తుంది. తెలుగు ‘నరికివేయబడాలి’ ఇక్కడ అనవసరంగా శారీరక హింసను సూచించవచ్చు; ‘తొలగించబడాలి’ మూలంలోని విధాన-అస్పష్టతను కాపాడుతుంది.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజలలో నుండి
  rationale: נֶפֶשׁ వ్యాకరణపరంగా స్త్రీలింగమైనా నియమం సాధారణ వ్యక్తిని ఉద్దేశిస్తుంది. ‘తన’ లింగనిరపేక్షంగా ఉండి వ్యక్తి చెందిన సమాజాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ అనే శిక్షా సూత్రం యొక్క అర్థం
  choice: తన ప్రజలలో నుండి తొలగించబడాలి
  alternative: తన ప్రజల సమాజం నుండి వెలివేయబడాలి; లేదా మరణించాలి/మరణశిక్ష పొందాలి
  rationale: హీబ్రూ సూత్రం ఒడంబడిక సమాజం నుండి తీవ్రమైన తొలగింపును సూచించినా, అది వెలివేతనా, దైవిక మరణశిక్షనా, మరేదైనా విధానమా అన్నది ఈ వచనం నిర్దిష్టంగా చెప్పదు. ప్రధాన పాఠం ఆ అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ధర్మశాస్త్ర శైలి. దైవనామానికి ‘యెహోవా’, బలి వర్గానికి ‘సమాధానబలి’ వాడబడ్డాయి. హీబ్రూ రూపకమైన అపవిత్రత ‘మీద ఉండడం’ నిలుపబడింది; శిక్ష విధానం ఉద్దేశపూర్వకంగా అతివ్యాఖ్యానం చేయలేదు.
