revisions:
- from: అయితే యెహోవాకు చెందిన సమాధానబలి మాంసాన్ని తన అపవిత్రత తన మీద ఉండగానే తినే వ్యక్తి తన ప్రజలలో నుండి తొలగించబడాలి[a].
  to: అయితే, యెహోవాకు చెందిన సమాధానబలిలోని మాంసాన్ని తన అపవిత్రత తన మీద ఉండగానే తినే వ్యక్తి తన ప్రజల మధ్యనుండి తొలగించబడాలి[a].
  rationale: The revision only clarifies that ‘belonging to Yahweh’ modifies the peace-offering sacrifice, as in the Hebrew, and uses a more idiomatic Telugu equivalent for removal from among one’s people. It retains the source text’s ambiguity concerning the precise means of the penalty.
  reviewer_model: gpt-5.6-terra
