id: LEV.7.9
reference: Leviticus 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: te
  text: పొయ్యిలో కాల్చబడిన ప్రతి ధాన్యార్పణమూ, లోతైన పెనంలో తయారుచేసిన ప్రతి ధాన్యార్పణమూ, చదునైన పెనం మీద తయారుచేసిన ప్రతి ధాన్యార్పణమూ[a], దానిని అర్పించే యాజకునికే చెందుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ఉన్న రెండు హెబ్రీ పదాలు వేర్వేరు వంట పాత్రలను సూచిస్తాయి; అవి ఖచ్చితంగా ఏ ఆకారంలో ఉండేవో తెలియదు. బహుశా ఒకటి లోతైన పెనం, మరొకటి చదునైన పెనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: ధాన్యార్పణం
  rationale: లేవీయకాండంలోని బలి సంబంధ సందర్భంలో ఇది సాధారణ కానుకను కాక ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; ‘ధాన్యార్పణం’ ఆధునిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా ఉంది.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: పొయ్యిలో కాల్చిన
  rationale: אפה క్రియ యొక్క నిఫాల్ రూపం కాల్చబడడాన్ని సూచిస్తుంది. తన్నూర్ అనేది కాల్చే పొయ్యి; సహజమైన తెలుగు వాక్య నిర్మాణం కోసం సంబంధ విశేషణ రూపాన్ని వాడాం.
- source_word: נַעֲשָׂה
  choice: తయారుచేసిన
  rationale: עשה అనే విస్తృతార్థక క్రియకు ఈ ఆహార తయారీ సందర్భంలో ‘తయారుచేసిన’ సహజంగా ఉంటుంది; నిర్దిష్టమైన వంట పద్ధతిని అనవసరంగా చేర్చదు.
- source_word: מַרְחֶשֶׁת
  choice: లోతైన పెనం
  rationale: ఈ పదం వంట పాత్రను సూచిస్తుంది; తరువాతి מַחֲבַת కంటే లోతైన పాత్ర అయి ఉండవచ్చనే సాధారణ భావాన్ని తెలుగులో సులభంగా తెలియజేస్తుంది, అయితే అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מַחֲבַת
  choice: చదునైన పెనం
  rationale: ఇది మునుపటి పాత్రకంటే చదునైన వంట ఉపరితలాన్ని సూచించే అవకాశం ఉంది. రెండు హెబ్రీ పదాల మధ్య ఉన్న సంభావ్య భేదాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: הַמַּקְרִיב
  choice: అర్పించే
  rationale: קרב హిఫిల్ రూపం బలి సందర్భంలో దానిని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది; ‘అర్పించే’ సహజమైన ఆచార సంబంధ పదం.
- source_word: לוֹ תִהְיֶה
  choice: యాజకునికే చెందుతుంది
  rationale: ఈ నిర్మాణం హక్కు లేదా కేటాయింపును తెలియజేస్తుంది. ‘చెందుతుంది’ దాని న్యాయపరమైన స్వాధీన భావాన్ని స్పష్టంగా ఇస్తుంది; ‘కే’ ఆ అర్పణను సమర్పించే నిర్దిష్ట యాజకునికే అది చెందుతుందని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా వాక్యాన్ని రూపొందించాం. బలి ఆచారానికి తగిన గంభీరత కోసం ‘ధాన్యార్పణం’, ‘అర్పించే యాజకుడు’ అనే పదాలను వాడాం; హెబ్రీ వంట పాత్రల ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
