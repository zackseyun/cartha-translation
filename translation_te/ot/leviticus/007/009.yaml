  terminology: ‘ధాన్యార్పణం,’ ‘యాజకుడు,’ and ‘అర్పించే’ are appropriate for this Levitical context. The vessel identifications remain uncertain; the main text retains a cautious functional distinction, and the footnote explicitly preserves the lexical uncertainty.
