translation:
  language: te
  text: 'అపరాధ పరిహార బలి[a] గురించిన నియమం ఇదే: అది అతి పరిశుద్ధమైనది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనిని ‘అపరాధ బలి’ లేదా ‘నష్టపరిహార బలి’ అని కూడా అనువదించవచ్చు. హెబ్రీయ పదమైన ‘ఆషామ్’ అపరాధంతోనూ దానికి సంబంధించిన పరిహారం లేదా నష్టపూరణతోనూ ముడిపడిన బలిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ఇదే
  rationale: וְ־ ఇక్కడ కొత్త నియమ విభాగాన్ని పరిచయం చేస్తుంది; తెలుగులో అనవసరమైన కాలార్థక పదాన్ని చేర్చకుండా, זֹאת యొక్క సూచనను సహజంగా వ్యక్తం చేయడానికి ‘ఇదే’ వాడబడింది.
- source_word: תּוֹרַת
  choice: గురించిన నియమం
  rationale: ఈ సందర్భంలో תּוֹרָה బలికి నిర్దేశించిన ఆచార నియమాన్ని సూచిస్తుంది. ‘గురించిన నియమం’ ఆధునిక తెలుగులో సహజంగా ఉండి నిర్మాణార్థాన్ని నిలుపుతుంది.
- source_word: הָ/אָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: אָשָׁם అపరాధంతో పాటు దానికి సంబంధించిన పరిహారం లేదా నష్టపూరణ భావాన్నీ కలిగిన నిర్దిష్ట బలివర్గం. ‘అపరాధ పరిహార బలి’ ఈ రెండు భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హెబ్రీయ భాషలోని ఈ గాఢతాసూచక నిర్మాణం అత్యున్నత పరిశుద్ధత వర్గాన్ని తెలుపుతుంది; ‘అతి పరిశుద్ధమైనది’ తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: הוּא
  choice: అది ... అయినది
  rationale: ఈ సర్వనామం ముందున్న బలిని పరిశుద్ధత వర్గంలో ఉంచే విధేయ నిర్మాణంలో ఉంది; తెలుగులో ‘అది ... అయినది’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం అనువాదం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి; నష్టపరిహార బలి
  rationale: ముఖ్య పాఠంలోని ఎంపిక అపరాధ భావాన్నీ, దానితో ముడిపడిన పరిహార అంశాన్నీ రెండింటినీ నిలుపుతుంది. ఒకే భావాన్ని మాత్రమే ప్రధానంగా చూపే ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచడం ద్వారా పదంలోని అర్థవిస్తృతిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. బలివిధానానికి సంబంధించిన ప్రత్యేక పదాన్ని స్పష్టంగా ఉంచి, దాని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
