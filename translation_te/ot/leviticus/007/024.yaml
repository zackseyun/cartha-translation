  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: te
  text: సహజంగా చనిపోయిన జంతువు యొక్క కొవ్వును[a], క్రూరమృగాలు చీల్చిన జంతువు యొక్క కొవ్వును[b] ఏ పనికైనా వాడవచ్చు; అయితే దాన్ని అసలు తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సక్రమంగా వధించబడకుండా చనిపోయిన జంతువును సూచిస్తుంది; “చనిపోయి కనిపించిన జంతువు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అడవి జంతువులు చీల్చిన జంతువు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలి మరియు ఆహార నియమాల సందర్భంలో జంతువులోని కొవ్వును సూచించే సహజమైన, సాధారణ తెలుగు పదం.
- source_word: נְבֵלָה
  choice: సహజంగా చనిపోయిన జంతువు
  rationale: సక్రమంగా వధించబడకుండా చనిపోయిన జంతువును సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగును ఉపయోగించి, విస్తృతమైన మూలార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: טְרֵפָה
  choice: క్రూరమృగాలు చీల్చిన జంతువు
  rationale: వేటాడే మృగాల చేత చీల్చబడిన జంతువు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֵעָשֶׂה לְכָל מְלָאכָה
  choice: ఏ పనికైనా ఉపయోగించవచ్చు
  rationale: ఈ సందర్భంలో తినడం కాకుండా ఇతర ప్రయోజనాలకు వాడేందుకు అనుమతి ఉందనే న్యాయపరమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: అయితే దాన్ని అసలు తినకూడదు
  rationale: క్రియానామం మరియు సమాపక క్రియ కలయిక నిషేధాన్ని బలపరుస్తుంది; ‘అసలు’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
