id: LEV.7.30
reference: Leviticus 7:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: te
  text: యెహోవాకు అగ్నితో అర్పించే అర్పణలను అతడు తన స్వంత చేతులతో తీసుకురావాలి. ఛాతిభాగాన్ని యెహోవా సన్నిధిలో కదలించే అర్పణగా కదలించడానికి, కొవ్వును ఛాతిభాగంతో పాటు తీసుకురావాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: తన సొంత చేతులతో
  rationale: అర్పించే వ్యక్తి స్వయంగా తీసుకురావాలనే హెబ్రీయ వ్యక్తీకరణలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలను
  rationale: אִשֶּׁה అనే పదం అగ్నితో అర్పించబడే బలిభాగాన్ని సూచిస్తుంది; దానిని సాధారణమైన ‘ఆహార అర్పణలు’గా పరిమితం చేయకుండా మూలార్థాన్ని వెల్లడిస్తుంది.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: కొవ్వుతో పాటు ఛాతిభాగాన్ని
  rationale: עַל ఇక్కడ వస్తువులను కలిపి తీసుకురావడాన్ని సూచించే సందర్భార్థంలో ఉంది; తెలుగు వాక్యప్రవాహానికి ‘తో పాటు’ సహజంగా ఉంటుంది.
- source_word: לְהָנִיף אֹתוֹ תְּנוּפָה
  choice: కదలించే అర్పణగా కదలించడానికి
  rationale: הניף/תנופה పదబంధంలోని క్రియ-నామ పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ ఆచార చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘యెహోవా ఎదుట’ అనే స్థల/ఆరాధనా భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హెబ్రీయ మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచింది.
- issue: אִשֵּׁי ను ‘food offerings’గా అర్థం చేయాలా
  choice: అగ్నితో అర్పించే అర్పణలు
  alternative: ఆహార అర్పణలు
  rationale: ఈ పదం బలిపీఠపు అగ్నికి సమర్పించే అర్పణలను సూచిస్తుంది; ‘ఆహార’ అని మాత్రమే అనడం మూలంలోని అగ్ని-అర్పణ భావాన్ని తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. సాంకేతిక బలి పదజాలాన్ని అతిగా క్లిష్టం చేయకుండా, ‘కదలించే అర్పణ’ అనే పాఠకులకు అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
