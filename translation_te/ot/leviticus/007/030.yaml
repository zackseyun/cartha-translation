revisions:
- from: యెహోవాకు అగ్నితో అర్పించే అర్పణలను అతడు తన సొంత చేతులతో తీసుకురావాలి. ఛాతిభాగాన్ని యెహోవా సన్నిధిలో కదలించే అర్పణగా కదలించడానికి, కొవ్వుతో పాటు ఛాతిభాగాన్ని తీసుకురావాలి.
