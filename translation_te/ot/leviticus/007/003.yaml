id: LEV.7.3
reference: Leviticus 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: te
  text: 'దాని నుండి దాని కొవ్వు అంతటినీ అతడు సమర్పించాలి[a]: కొవ్వుగల తోకను[b], పేగులను కప్పే కొవ్వును.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అర్పించాలి.’ హీబ్రూ క్రియ బలి భాగాన్ని సమర్పించడం లేదా అర్పించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, గొర్రెకు ఉండే ప్రత్యేకమైన కొవ్వుగల తోక; ఇది బలిగా సమర్పించే కొవ్వు భాగాల్లో ఒకటి.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: దాని కొవ్వు / కొవ్వు
  rationale: బలి సందర్భంలో חֵלֶב దేవునికి అర్పించడానికి నిర్దేశించిన కొవ్వు భాగాలను సూచిస్తుంది. తెలుగులో ‘కొవ్వు’ సహజంగా, నేరుగా ఈ భావాన్ని అందిస్తుంది.
- source_word: יַקְרִיב
  choice: సమర్పించాలి
  rationale: קרב ధాతువు హిఫీల్ రూపం బలి భాగాన్ని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది. ‘సమర్పించాలి’ ఆచారపరమైన భావాన్ని నిలుపుతూ, క్రియలోని దశను అతిగా నిర్దిష్టం చేయదు.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుండి
  rationale: ప్రత్యయం సందర్భంలో బలి జంతువునే సూచిస్తుంది; ‘దానిలోనుండి’ అని అనువదించడం ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הָאַלְיָה
  choice: కొవ్వుతో నిండిన తోక
  rationale: אַלְיָה గొర్రెకు చెందిన ప్రత్యేకమైన కొవ్వు తోకను సూచిస్తుంది. ‘కొవ్వుతో నిండిన తోక’ సాధారణ పాఠకునికి శరీర నిర్మాణ సంబంధమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: ఆంతర్యాంగాలను కప్పే
  rationale: కֶרֶב ఇక్కడ జంతువు లోపలి అవయవాలను సూచిస్తుంది. ‘ఆంతర్యాంగాలు’ ఆధునిక, గౌరవప్రదమైన తెలుగులో తగినంత నిర్దిష్టంగా ఉంది.
- source_word: כָּל
  choice: అంతటినీ
  rationale: నిర్దేశించిన కొవ్వు భాగాల సంపూర్ణతను כָּל నొక్కిచెబుతుంది; ‘అంతటినీ’ ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
