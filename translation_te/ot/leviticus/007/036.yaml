base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: te
  text: యాహ్వే వారిని అభిషేకించిన రోజున, ఇశ్రాయేలీయుల నుండి[a] వాటిని వారికి ఇవ్వాలని ఆజ్ఞాపించాడు. ఇది వారి తరతరాలకు శాశ్వతమైన నియమం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారుల నుండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిరంతరమైన నియమం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వాటిని
  rationale: ఈ సంబంధవాచక పదం ముందరి వచనంలో చెప్పిన యాజకులకు కేటాయించిన భాగాలను సూచిస్తుంది. తెలుగులో సహజమైన అనుసంధానం కోసం దాని సూచ్యార్థాన్ని ‘వాటిని’ అని వ్యక్తం చేశాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: దైవిక ఆజ్ఞలోని అధికారపూర్వకమైన, న్యాయపరమైన బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לָתֵת לָהֶם
  choice: వాటిని వారికి ఇప్పించాలని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వారికి ఇవ్వడానికి’ ఉన్నా, ఈ నిర్మాణంలో ఆ భాగాలను వారికి అందజేయాలని ఆజ్ఞాపించిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: వారిని అభిషేకించిన రోజున
  rationale: మָשַׁח అనే నిర్దిష్ట క్రియను ‘అభిషేకించు’గా నిలిపి, కాలసూచక నిర్మాణాన్ని దగ్గరగా అనువదించాం. సందర్భంలో అభిషేకించినవాడు యాహ్వే అని గ్రహించవచ్చు; తెలుగులోనూ కర్తను మళ్లీ చేర్చకుండా మూలంలోని అనుసంధానాన్ని నిలిపాం.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల నుండి
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారుల నుండి’ అనే covenantal వ్యక్తీకరణకు ఆధునిక తెలుగులో సహజమైన సమూహవాచక రూపం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన నియమం
  rationale: యాజకసంబంధమైన న్యాయ సందర్భంలో חֻקָּה యొక్క స్థిర ఆదేశ భావాన్ని ‘నియమం’ తెలియజేస్తుంది; עוֹלָם యొక్క కొనసాగుదల బలాన్ని ‘శాశ్వతమైన’ నిలుపుతుంది.
- source_word: לְדֹרֹתָם
  choice: వారి తరతరాలకు
  rationale: తరాల మీదుగా కొనసాగుతున్న అన్వయాన్ని సహజమైన ఆధునిక తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- issue: עולם పదానికి యాజక ధర్మశాసన సందర్భంలో ఉన్న బలం
  choice: శాశ్వతమైన నియమం
  alternative: నిరంతరమైన నియమం
  rationale: ఇశ్రాయేలు తరతరాలకు వర్తించే స్థిరమైన ఆదేశమనే పాఠ్య బలాన్ని నిలుపుతూ, దాని పరిధి గురించి పాఠ్యానికి మించిన తరువాతి సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ముందు వచనంతో ఉన్న సంబంధాన్ని ‘వాటిని’ ద్వారా నిలిపి, పొడవైన హీబ్రూ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. యాజక, ధర్మశాసన పదజాలానికి సాధారణ పాఠకులకు అర్థమయ్యే రూపాలను ఎంచుకున్నాం.
