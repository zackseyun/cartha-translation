translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని ఆజ్ఞాత్మక న్యాయశైలిని గంభీరంగా ఉంచుతూ, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. మూలంలోని జాతి-జాబితా ఏకవచన రూపాలను నిలిపాం.
