id: LEV.7.23
reference: Leviticus 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులకు ఇలా చెప్పు: ‘ఎద్దు, గొర్రె, మేకల కొవ్వులో దేనినీ మీరు తినకూడదు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: דבר పియేల్ ఆజ్ఞార్థక ఏకవచనం; మోషేకు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: హీబ్రూ వాక్యప్రవేశ సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పు’ అని అందిస్తుంది.
- source_word: כָּל חֵלֶב
  choice: దేని కొవ్వునూ
  rationale: నిషేధ వాక్యంలో כָּל యొక్క సమగ్ర పరిధిని, జంతువుల జాబితాతో సహజంగా అనుసంధానించి వ్యక్తం చేస్తుంది.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలి నియమాల సందర్భంలో జంతువుల కొవ్వు భాగాలను సూచించే సాధారణ, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: గోవర్గ జంతువును సూచించే ఈ ఏకవచన న్యాయపరమైన జాబితాకు సాధారణ తెలుగు సమానం; ‘ఆబోతు’ అని లింగాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: כֶשֶׂב
  choice: గొర్రె
  rationale: మందలోని sheep అనే సాధారణ జాతి వర్గాన్ని సూచిస్తుంది; ‘గొర్రెపిల్ల’ లేదా ‘పొట్టేలు’ అని వయస్సు లేదా లింగాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: עֵז
  choice: మేక
  rationale: పశువుల జాబితాలో సాధారణ జాతి పేరుగా సహజమైన తెలుగు రూపం.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
