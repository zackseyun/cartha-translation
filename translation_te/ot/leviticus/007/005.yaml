  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: te
  text: యాజకుడు వాటిని బలిపీఠంపై యాహ్వేకు అగ్న్యర్పణగా కాల్చాలి.[a] అది అపరాధ బలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వేకు అగ్నిచేత సమర్పించే అర్పణ.’ హీబ్రూ పదం అగ్నిచేత సమర్పించే అర్పణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పరిహార బలి’; సంప్రదాయంగా, ‘అతిక్రమ బలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: קטר హిఫీల్ రూపం బలుల సందర్భంలో బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. సందర్భం బలిపీఠం మీద జరిగే అర్పణ అని స్పష్టం చేస్తున్నందున, ఆధునిక తెలుగులో సహజమైన ‘దహించాలి’ని ఎంచుకున్నాం.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ముందరి వచనంలో పేర్కొన్న బలి భాగాలను సూచించే పుంలింగ బహువచన కర్మ సర్వనామం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: నిర్దిష్ట ఏకవచన నామవాచకం; లేవీయకాండంలోని ఆరాధనా నియమాలకు సహజమైన తెలుగు పదం.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశను సూచించే అంత్యప్రత్యయంతో అక్షరార్థంగా ‘బలిపీఠం వైపుకు’ అని ఉన్నా, బలి భాగాలను అక్కడ దహించే చర్యను తెలుగులో ‘బలిపీఠం మీద’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఇది లేవీయకాండంలో అగ్ని ద్వారా సమర్పించే అర్పణకు వాడే సాంకేతిక పదం. ‘ఆహార అర్పణ’ అనే వివరణాత్మక భావాన్ని మూలపదం తప్పనిసరిగా నిర్ధారించదు; అందువల్ల అగ్ని అంశాన్ని ప్రత్యక్షంగా నిలిపాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל ఉపసర్గం సమర్పణ ఎవరికి అంకితం చేయబడిందో సూచిస్తుంది; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אָשָׁם
  choice: అపరాధ బలి
  rationale: లేవీయకాండంలో ఇది నిర్దిష్ట బలి వర్గానికి సాంకేతిక నామం. ‘అపరాధ బలి’ సంక్షిప్తంగా, అర్థమయ్యేలా ఉండి, పరిహార భావాన్ని ఏకైక నిర్వచనంగా రుద్దదు.
- source_word: הוּא
  choice: అది
  rationale: 'ఈ సర్వనామం ముందున్న అర్పణను ఒక నిర్దిష్ట బలి వర్గంగా గుర్తిస్తుంది: ‘అది అపరాధ బలి.’'
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో నాలుగు హల్లుల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: אָשָׁם అనే బలి సంబంధ సాంకేతిక పదం
  choice: అపరాధ బలి
  alternative: పరిహార బలి / అతిక్రమ బలి
  rationale: ఈ పదం అపరాధంతో సంబంధమున్న నిర్దిష్ట బలిని సూచిస్తుంది; కొన్ని సందర్భాల్లో పరిహారం కూడా ప్రధానమైనప్పటికీ, ఇక్కడ ఆ భావాన్ని మాత్రమే ముందుకు తెచ్చి మూలంలోని విస్తృతిని తగ్గించలేదు.
- issue: אִשֶּׁה యొక్క అర్థం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ సాంకేతిక పదం అగ్నితో సమర్పించే బలిని స్పష్టంగా సూచిస్తుంది. ‘ఆహార అర్పణ’ అనేది సాధ్యమైన ఆరాధనా రూపకం అయినా, పదం యొక్క ప్రత్యక్ష అగ్ని సంబంధాన్ని మరుగుపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. బలి సంబంధ సాంకేతిక పదాలను అర్థమయ్యేలా ఉంచుతూ, మూలంలోని ఆరాధనా వర్గీకరణను మరియు సాధ్యమైన అర్థ వైవిధ్యాన్ని పాదసూచికల్లో నిలిపాం.
