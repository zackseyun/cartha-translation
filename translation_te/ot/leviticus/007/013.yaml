id: LEV.7.13
reference: Leviticus 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: te
  text: పులియబెట్టిన రొట్టె ముద్దలతో పాటు, తన సమాధానబలులలో కృతజ్ఞతార్థమైన బలితో అతడు తన అర్పణను సమర్పించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాధానబలులు’ అనే పదాన్ని ‘సహవాసబలులు’ లేదా ‘క్షేమబలులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: తో పాటు
  rationale: ఇక్కడ עַל స్థానం కంటే సహవర్తిత్వాన్ని సూచిస్తుంది; ముందటి వచనాల్లో చెప్పిన వాటికి అదనంగా పులియబెట్టిన రొట్టె ముద్దలను సమర్పించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חַלֹּת לֶחֶם
  choice: రొట్టె ముద్దలు
  rationale: חַלּוֹת బలి ఆహార సందర్భంలో ముద్దలు లేదా రొట్టెలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘రొట్టె ముద్దలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: חָמֵץ
  choice: పులియబెట్టిన
  rationale: పులియని పదార్థాలకు భిన్నంగా పులిసే పదార్థంతో తయారైన రొట్టెను సూచించే ఆచార సంబంధ పదం.
- source_word: יַקְרִיב
  choice: సమర్పించాలి
  rationale: హిఫిల్ రూపమైన קרב బలి సందర్భంలో దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది.
- source_word: קָרְבָּנוֹ
  choice: తన అర్పణను
  rationale: קָרְבָּן దేవునికి తీసుకువచ్చే సాధారణ అర్పణ; ‘అర్పణ’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: זֶבַח
  choice: బలి
  rationale: వధించి అర్పించే బలిని సూచించే ఆచార సంబంధ పదానికి ‘బలి’ సంక్షిప్తమైన, స్థిరమైన తెలుగు రూపం.
- source_word: תּוֹדַת
  choice: కృతజ్ఞతా
  rationale: ఇది బలి యొక్క కృతజ్ఞత స్వభావాన్ని తెలియజేసే సంధాన రూపం; సమాస విశేషణంగా ఇవ్వడం తెలుగులో సహజం.
- source_word: שְׁלָמָיו
  choice: తన సమాధానబలి
  rationale: שְׁלָמִים అనే సాంకేతిక బలి పదంలోని శాంతి, సంపూర్ణత భావాలను నిలుపుతూ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘సమాధానబలి’ ఎంచుకోబడింది.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పదం అనువాదం
  choice: సమాధానబలి
  alternative: సహవాసబలి; క్షేమబలి
  rationale: ఈ హెబ్రీ పదం శాంతి, సంపూర్ణ క్షేమం, దేవునితోను ఇతరులతోను పంచుకునే సహవాసం వంటి అనుసంధాన భావాలను కలిగి ఉంది. ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘సమాధానబలి’ ఉంచి, ఇతర సాధ్యమైన భావాలను పాదసూచికలో కాపాడాం.
- issue: זֶבַח תּוֹדַת שְׁלָמָיו యొక్క సంబంధం
  choice: తన కృతజ్ఞతా సమాధానబలి అర్పణతో
  alternative: తన సమాధానబలులలోని కృతజ్ఞతాబలితో
  rationale: హెబ్రీ సంధాన నిర్మాణం కృతజ్ఞతాబలిని సమాధానబలుల వర్గంతో అనుసంధానిస్తుంది. తెలుగు ప్రధాన పాఠ్యం ఈ సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది; వర్గీకరణను అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండపు ఆచార సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. సాంకేతిక బలి పదాలను అవసరమైనంత స్థిరంగా ఉంచి, ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చాం.
