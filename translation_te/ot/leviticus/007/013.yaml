revisions:
- from: పులియబెట్టిన రొట్టె ముద్దలతో పాటు, అతడు తన కృతజ్ఞతా సమాధానబలి అర్పణతో తన అర్పణను సమర్పించాలి.[a]
  to: పులియబెట్టిన రొట్టె ముద్దలతో పాటు, తన సమాధానబలులలో కృతజ్ఞతార్థమైన బలితో అతడు తన అర్పణను సమర్పించాలి.[a]
