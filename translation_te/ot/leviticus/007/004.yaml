translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస జాబితాను నిలుపుతూ, తెలుగులో క్రియను చివర ఉంచాం. స్పష్టత కోసం אֲשֶׁר עַל הַכְּסָלִים ను డాష్‌ల మధ్య వివరణగా ఇచ్చాం. పాదసూచిక గుర్తును అది నిజంగా వివరిస్తున్న הַיֹּתֶרֶת (‘అనుబంధ భాగం’) వద్ద ఉంచాం.
