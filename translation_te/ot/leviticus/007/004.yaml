id: LEV.7.4
reference: Leviticus 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: te
  text: రెండు మూత్రపిండాలను, వాటి మీద—అంటే నడుము భాగంలో—ఉన్న కొవ్వును, కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని[a] అతడు మూత్రపిండాలతో పాటు తీసివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాలేయం మీద ఉన్న లోబును.’ ఈ శరీర భాగానికి వాడిన హీబ్రూ పదం సాంకేతికమైనది; అది ఖచ్చితంగా ఏ భాగాన్ని సూచిస్తుందో వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలను
  rationale: బలి జంతువు శరీర నిర్మాణ సందర్భంలో כְּלָיוֹת స్పష్టంగా రెండు మూత్రపిండాలను సూచిస్తుంది; ఆధునిక పాఠకులకు ఇదే సహజమైన, ఖచ్చితమైన పదం.
- source_word: הַחֵלֶב
  choice: కొవ్వును
  rationale: లేవీయకాండంలోని బలి సందర్భంలో חֵלֶב అర్పణ కోసం ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది; ‘కొవ్వు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: వాటి మీద ఉన్న
  rationale: עַל యొక్క ప్రాథమిక స్థలార్థమైన ‘మీద’ను నిలుపుతూ, ‘కప్పి ఉన్న’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: הַכְּסָלִים
  choice: నడుము భాగంలో
  rationale: ఈ పదం మూత్రపిండాల సమీపంలోని నడుము లేదా పార్శ్వ ప్రాంతాన్ని సూచిస్తుంది; ‘నడుము భాగం’ సాధారణ ఆధునిక తెలుగులో సహజంగా, శరీర నిర్మాణ సూచనకు తగినట్లు ఉంది.
- source_word: הַיֹּתֶרֶת
  choice: అనుబంధ భాగాన్ని
  rationale: ఇది కాలేయానికి సంబంధించిన సాంకేతిక శరీర నిర్మాణ పదం; దాని ఖచ్చితమైన అవయవ సూచన వివాదాస్పదం కనుక ‘లోబు’ అని అతినిర్దిష్టం చేయకుండా ‘అనుబంధ భాగం’గా అనువదించబడింది.
- source_word: עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న
  rationale: עַל యొక్క సరళమైన ‘మీద’ అనే అర్థాన్ని నిలిపి, ‘అంటుకొని ఉన్న’ అనే వివరణాత్మక భావాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: עַל הַכְּלָיֹת
  choice: మూత్రపిండాలతో పాటు
  rationale: ఈ బలి విధి సూత్రంలో కాలేయ అనుబంధ భాగాన్ని మూత్రపిండాలతో కలిపి తొలగించడాన్ని ఈ పదబంధం సూచిస్తుంది; తెలుగులో ‘తో పాటు’ ఆ విధాన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְסִירֶנָּה
  choice: అతడు ... తీసివేయాలి
  rationale: హిఫీల్ క్రియ ఇక్కడ బలి విధిలో చేయవలసిన చర్యను సూచిస్తుంది; ‘తీసివేయాలి’ ఆధునిక తెలుగులో ఆ నియమాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
