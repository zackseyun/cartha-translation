translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని బలి సంబంధిత సాంకేతిక భావాన్ని కాపాడేందుకు ‘పొగగా పైకి లేవేలాగా దహించాలి’ అని స్పష్టీకరించబడింది. పాఠ్యంలో పాదటిప్పణులు లేవు కాబట్టి గుర్తులు అవసరం లేదు.
