  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: te
  text: యాజకుడు కొవ్వును బలిపీఠం మీద పొగగా అర్పించాలి; రొమ్ముభాగం అహరోనుకు, అతని కుమారులకు చెందాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: పొగగా పైకి లేవేలాగా దహించాలి
  rationale: బలుల సందర్భంలో קטר హిఫీల్ రూపం బలిపీఠం మీద దహించి పొగగా పైకి లేవజేయడాన్ని సూచిస్తుంది. ఈ తెలుగు పదబంధం దహనక్రియనూ, మూలంలోని పొగగా పైకి లేచే భావాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఇశ్రాయేలు ఆరాధనా సందర్భంలోని כֹּהֵןకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం; ఏకవచనాన్ని నిలుపుతుంది.
- source_word: הַחֵלֶב
  choice: కొవ్వును
  rationale: లేవీయకాండంలోని బలి నియమాలలో חֵלֶב సాధారణ రూపకాలంకార భావం కాకుండా, బలిపీఠంపై దహించడానికి ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశార్థక ప్రత్యయం అక్షరార్థంగా ‘బలిపీఠం వైపుకు’ అనే ఛాయ కలిగివున్నా, הִקְטִירతో కూడిన బలి సందర్భంలో దహనం జరిగే స్థలాన్ని ‘బలిపీఠం మీద’ అని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיָה
  choice: చెందాలి
  rationale: అక్షరార్థమైన ‘ఉండాలి’ కంటే, ఇక్కడ నియమబద్ధంగా ఒక భాగాన్ని కేటాయించే స్వామ్యార్థాన్ని ‘చెందాలి’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הֶחָזֶה
  choice: రొమ్ముభాగం
  rationale: బలి జంతువులో యాజకులకు కేటాయించిన חָזֶה అనే నిర్దిష్ట భాగాన్ని సూచిస్తుంది; ‘రొమ్ముభాగం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి శరీరభాగపు అర్థాన్ని కాపాడుతుంది.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: לְ ఇక్కడ కేటాయింపు లేదా స్వామ్యాన్ని సూచిస్తుంది. ఈ రూపం అహరోనుకూ అతని కుమారులకూ ఉన్న హక్కును సహజ తెలుగులో తెలియజేస్తుంది.
