id: LEV.7.2
reference: Leviticus 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: te
  text: దహనబలిని వధించే స్థలంలో వారు అపరాధ పరిహార బలిని[a] వధించాలి; అతడు దాని రక్తాన్ని బలిపీఠం మీద అన్ని వైపులా చిమ్మాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అపరాధ బలి,’ ‘నష్టపరిహార బలి.’ హెబ్రీ పదం అపరాధంతోపాటు దానికి చేయవలసిన పరిహారం లేదా నష్టపూరణ భావాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: వధించే స్థలంలోనే
  rationale: స్థలాన్ని సూచించే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, రెండు బలులూ ఒకే చోట వధించాలనే విధాన సంబంధాన్ని ‘లోనే’ స్పష్టం చేస్తుంది.
- source_word: יִשְׁחֲטוּ
  choice: వధించాలి
  rationale: బలి సందర్భంలో שׁחט జంతువును ఆచారపూర్వకంగా వధించడాన్ని సూచిస్తుంది; ‘వధించాలి’ గౌరవప్రదమైన, స్పష్టమైన ఆధునిక తెలుగు.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలిని సూచించే עֹלָהకు తెలుగులో స్థిరపడిన, సంక్షిప్తమైన బలి పదం.
- source_word: הָאָשָׁם
  choice: అపరాధ పరిహార బలి
  rationale: אָשָׁםలోని అపరాధం మరియు దానికి సంబంధించిన పరిహారం/నష్టపూరణ అనే రెండు భావాలను సాధ్యమైనంతవరకు కలిపి వ్యక్తం చేస్తుంది.
- source_word: דָּמוֹ
  choice: దాని రక్తాన్ని
  rationale: ఏకవచన ప్రత్యయం అపరాధ పరిహార బలిగా అర్పించే జంతువును సూచిస్తుంది.
- source_word: יִזְרֹק
  choice: చిమ్మాలి
  rationale: బలిపీఠంపై రక్తాన్ని విసిరి పడేలా చేసే యాజక ఆచారాన్ని సూచిస్తుంది; ‘చల్లాలి’కన్నా చర్యను స్పష్టంగా తెలియజేస్తుంది, ‘ప్రోక్షించాలి’కన్నా సాధారణ పాఠకులకు సులభం.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠం చుట్టూ అన్ని వైపులా
  rationale: עַלతో సూచితమైన బలిపీఠంపై/దానికి తగిలే రక్త ప్రయోగాన్ని, סָבִיב సూచించే పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אָשָׁם అనే బలి పదం
  choice: అపరాధ పరిహార బలి
  alternative: అపరాధ బలి; నష్టపరిహార బలి
  rationale: ఈ పదం అపరాధ స్థితినీ దానికి సంబంధించిన పరిహారం లేదా నష్టపూరణనూ సూచించగలదు. ప్రధాన పాఠంలో రెండింటినీ ప్రతిబింబించే పదబంధాన్ని ఉంచి, ఇతర సాధ్యమైన పేర్లను పాదటిప్పణిలో ఇచ్చాం; ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ బలవంతంగా చేర్చలేదు.
- issue: బహువచన వధకులు, ఏకవచన రక్తాన్ని చిమ్మేవాడు
  choice: తెలుగు విధ్యర్థక రూపంలో కర్తను వ్యక్తపరచకుండా ఉంచడం
  alternative: వారు వధించాలి; అతడు చిమ్మాలి
  rationale: హెబ్రీ పాఠంలో יִשְׁחֲטוּ బహువచనం, יִזְרֹק ఏకవచనం. సందర్భం లేకుండా ఏకవచన కర్తను ‘యాజకుడు’ అని చేర్చకుండా, సహజ తెలుగు ఆజ్ఞారూపం ద్వారా మూలంలోని కార్యభేదాన్ని సిద్ధాంతాత్మకంగా అధికంగా నిర్దిష్టం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దహనబలి,’ ‘బలిపీఠం’ వంటి పరిచిత బైబిలు పదాలను నిలిపి, అత్యంత సాంకేతికమైన ‘ప్రోక్షించాలి’కు బదులు ‘చిమ్మాలి’ వాడబడింది.
