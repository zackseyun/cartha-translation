id: LEV.23.22
reference: Leviticus 23:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: te
  text: మీ భూమిలోని పంటను కోసేటప్పుడు, మీ పొలం అంచున ఉన్న పంటను పూర్తిగా కోయకూడదు; మీ కోతలో రాలిన వాటిని ఏరుకోకూడదు. వాటిని పేదవారికీ, మీ మధ్య నివసించే పరదేశికీ విడిచిపెట్టాలి. నేను మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: మీరు మీ దేశపు పంటను కోసేటప్పుడు
  rationale: ఇన్ఫినిటివ్ నిర్మాణంలోని కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘మీ’ అనే బహువచన సంబోధనను నిలుపుతుంది.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: కోస్తూ మీ పొలం అంచును పూర్తిగా కోయకూడదు
  rationale: כלה పియేల్‌లోని ‘పూర్తిచేయడం’ అనే భావాన్ని ‘పూర్తిగా కోయకూడదు’ అని స్పష్టపరుస్తుంది; పునరుక్తమైన కోత పరిస్థితిని ‘కోస్తూ’ ద్వారా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: פְּאַת שָׂדְךָ
  choice: మీ పొలం అంచు
  rationale: פאה అంచు, పక్క లేదా మూలను సూచించగలదు. ఇక్కడ కోయకుండా విడిచిపెట్టవలసిన పొలం చివరి భాగాన్ని ‘అంచు’ విస్తృతంగా, సహజంగా సూచిస్తుంది.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: మీ కోతలో రాలిన పరిగెను ఏరుకోకూడదు
  rationale: לקט ప్రధాన కోతలో రాలిపోయిన లేదా మిగిలిన కంకులు వంటి ఏరుకోదగిన అవశేషాలను సూచిస్తుంది. ‘పరిగె’ వ్యవసాయ సందర్భానికి సరిపోయే తెలుగు పదం; ‘రాలిన’ దాని భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לֶעָנִי
  choice: పేదవాని కోసం
  rationale: עני ఇక్కడ ఆర్థికంగా బలహీనుడైన వ్యక్తిని సూచిస్తుంది; ఏకవచన హీబ్రూ రూపాన్ని నిలుపుతుంది.
- source_word: וְלַגֵּר
  choice: మీ మధ్య నివసించే పరదేశి కోసం
  rationale: גר కేవలం అపరిచితుడు కాక, ఇశ్రాయేలు సమాజంలో నివసించే పరదేశిని సూచిస్తుంది. వివరణాత్మక తెలుగు ఎంపిక దాని సామాజిక-చట్టపరమైన భావాన్ని అందిస్తుంది.
- source_word: תַּעֲזֹב אֹתָם
  choice: వాటిని ... విడిచిపెట్టాలి
  rationale: עזב ఇక్కడ ఇతరులు సేకరించేందుకు వెనుక విడిచి ఉంచడాన్ని సూచిస్తుంది; ‘విడిచిపెట్టాలి’ ఆ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: నేను మీ దేవుడైన యెహోవాను
  rationale: దైవనామాన్ని పేరుగా నిలుపుతూ, నిబంధనాత్మక స్వీయప్రకటనకు తెలుగు బైబిల్ శైలిలో గంభీరతను ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచింది. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన రూపం.
- issue: ఇశ్రాయేలు ధర్మశాస్త్రంలో גֵּר గుర్తింపు
  choice: మీ మధ్య నివసించే పరదేశి
  alternative: పరదేశి / విదేశీయ నివాసి
  rationale: ఈ పదం తాత్కాలిక ప్రయాణికుడిని లేదా సాధారణ అపరిచితుణ్ణి మాత్రమే కాక, సమాజంలో నివసిస్తూ దాని రక్షణల కింద ఉన్న అన్యజాతి వ్యక్తిని సూచిస్తుంది. ఆధునిక వలస చట్టాల భావాలను అనవసరంగా రుద్దకుండా ఈ సూక్ష్మతను వివరణాత్మకంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చట్టవాక్యానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే వ్యవసాయ పదజాలం ఉపయోగించబడింది. హీబ్రూలో మొదటి ‘మీరు/మీ దేశం’ బహువచనం నుంచి ‘మీ పొలం/మీ కోత’ ఏకవచనానికి మార్పు ఉంది; తెలుగులో సంఖ్యాపరంగా సహజంగా కనిపించినా ‘మీ’ రెండింటికీ ఒకే రూపం కావడం వల్ల ఆ మార్పు బహిర్గతం కాదు. ప్రచురణ పాఠంలో పాదటిప్పణులు అవసరం లేదని నిర్ణయించబడింది.
