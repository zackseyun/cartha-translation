source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు: ‘ఈ ఏడవ నెల పదిహేనవ రోజున యహ్వేకు ఏడు రోజుల పర్ణశాలల పండుగ ఉంటుంది.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “గుడారాల పండుగ” అని కూడా అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు
  rationale: ఆజ్ఞారూపమైన ‘మాట్లాడు/చెప్పు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, సూత్రప్రాయమైన ‘ఇశ్రాయేలు కుమారులు’ అనే మూల వ్యక్తీకరణను నిలుపుతుంది.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ఈ ఏడవ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంతో అందించి, మూలంలోని ‘ఈ’ అనే సూచనను కూడా నిలుపుతుంది.
- source_word: חַג הַסֻּכּוֹת
  choice: పర్ణశాలల పండుగ
  rationale: סֻכּוֹת అనేది తాత్కాలికంగా నిర్మించే ఆశ్రయాలను సూచిస్తుంది. ‘పర్ణశాలలు’ మూలార్థాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: పండుగ వ్యవధిని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గలోని అంకితం లేదా దిశ భావాన్ని ‘-కు’ ద్వారా నిలుపుతూ, దేవుని ఒడంబడిక నామాన్ని లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా ఉంచింది.
- issue: סֻכּוֹת పండుగ పేరు
  choice: పర్ణశాలల పండుగ
  alternative: గుడారాల పండుగ
  rationale: ప్రధాన పాఠంలో తాత్కాలిక ఆశ్రయాల మూలార్థాన్ని పారదర్శకంగా ఉంచి, సంప్రదాయ పేరును పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర ఆజ్ఞా శైలిని పాటించింది. ప్రత్యక్ష వాక్యానికి తెలుగు ఉద్ధరణ చిహ్నాలు వాడబడ్డాయి; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుకుంది.
