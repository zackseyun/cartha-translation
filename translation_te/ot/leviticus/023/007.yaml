revisions:
- from: మొదటి రోజున మీకు పవిత్ర సమాహారం[a] ఉండాలి; మీరు ఏ సాధారణ శ్రమపనినీ[b] చేయకూడదు.
  to: మొదటి రోజున మీకు పవిత్ర సభ[a] ఉండాలి; మీరు ఏ సాధారణ పనినీ[b] చేయకూడదు.
  rationale: The revision adopts more idiomatic modern Telugu for the sacred assembly and uses a broader expression for the prohibited work, matching the Hebrew phrase’s ordinary/service-work nuance. The footnotes retain legitimate lexical alternatives while removing an alternative that can denote a community rather than an assembly.
