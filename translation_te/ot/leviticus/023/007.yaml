id: LEV.23.7
reference: Leviticus 23:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: te
  text: మొదటి రోజున మీకు పవిత్ర సభ[a] ఉండాలి; మీరు ఏ సాధారణ పనినీ[b] చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర సమాహారం’ లేదా ‘పవిత్ర కూడిక.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, ‘సేవకు సంబంధించిన పని’; అంటే సాధారణ పని లేదా ఉపాధికి సంబంధించిన పని. సాంప్రదాయ అనువాదాల్లో ‘దాస్యపు పని’ అని కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: בְּ ఉపసర్గ, నిర్దిష్ట దినవాచకం, క్రమసంఖ్య కలిసి ఆజ్ఞ వర్తించే సమయాన్ని సూచిస్తున్నాయి; ఆధునిక తెలుగులో ఇది సహజమైన కాలప్రయోగం.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమాహారం
  rationale: ఆరాధనా సందర్భంలో מִקְרָא పిలిచి కూడబెట్టిన సమూహాన్ని లేదా సభను సూచిస్తుంది; קֹדֶשׁ దాని పవిత్ర స్వభావాన్ని తెలుపుతుంది. ‘సమాహారం’ సభ భావాన్నీ, కూడబెట్టబడే భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: ప్రజలకు ఆ దినం ఎలా ఉండాలో చెప్పే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు విధ్యర్థక శైలిలో వ్యక్తం చేస్తుంది.
- source_word: כָּל ... לֹא
  choice: ఏ ... నీ ... చేయకూడదు
  rationale: నిషేధంతో కూడిన כָּל యొక్క సమగ్ర బలాన్ని తెలుగులో ‘ఏ...నీ చేయకూడదు’ సహజంగా తెలియజేస్తుంది.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: సాధారణ శ్రమపని
  rationale: ‘పని/సేవకు సంబంధించిన పని’ అనే పదబంధం పండుగ దినాల్లో చేసే సాధారణ ఉపాధి లేదా శ్రమపనిని సూచిస్తుంది; ప్రతి విధమైన చర్యను నిషేధించినట్లు అతిశయింపకుండా ఈ ఎంపిక ఆ పరిమితిని నిలుపుతుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: చేయకూడదు
  rationale: ధర్మశాస్త్ర నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేసే రూపం.
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה లోని పండుగదిన నిషేధం యొక్క పరిధి
  choice: సాధారణ ఉపాధి లేదా శ్రమపనిని నిషేధించడం
  alternative: ఎలాంటి భేదం లేకుండా ప్రతి పనినీ నిషేధించడం
  rationale: ఇక్కడ సాధారణ מְלָאכָה మాత్రమే కాకుండా מְלֶאכֶת עֲבֹדָה అనే ప్రత్యేక పదబంధం ఉంది. పండుగ ధర్మశాసన సందర్భంలో ఇది ప్రతి చర్యకన్నా సాధారణ శ్రమ లేదా సేవాపనిని సూచిస్తుంది; అనువాదం ఆ సూక్ష్మతను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని ఆరాధనా-ధర్మశాస్త్ర గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రధాన వాక్యంలో పాదసూచికల క్రమం [a], [b]గా ఉంచబడింది.
