  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: יהוה (YHWH); దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: మూల హీబ్రూ దైవనామాన్ని మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనే క్రియ ఇక్కడ కొత్త దైవిక ప్రసంగాన్ని పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యప్రయోగంలో లֵאמֹרతో కూడిన సూత్రబద్ధ నిర్మాణాన్ని పునరుక్తి లేకుండా తెలియజేయడానికి ‘ఇలా అన్నాడు’ సముచితం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తిని సూచించే אֶל‌ను ఆధునిక సహజ తెలుగులో ‘మోషేతో’గా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగం. తెలుగులో ద్విబిందువుతో కూడిన ‘ఇలా అన్నాడు’ సహజంగా అదే పనిని చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలిపాం; ఉచ్చారణ పూర్తిగా నిర్ధారించలేనందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సహజంగా రూపొందించాం. హీబ్రూ ‘మాట్లాడి, ఇలా చెప్పాడు’ అనే సూత్రబద్ధ నిర్మాణాన్ని అసహజ పునరుక్తి లేకుండా ‘ఇలా అన్నాడు’గా సమన్వయించాం.
