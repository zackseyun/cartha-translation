    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: కొత్త దైవిక ప్రసంగాన్ని పరిచయం చేసే సాధారణ హెబ్రీ సూత్రప్రయోగం. తెలుగులో తరువాతి మాటలను సహజంగా ప్రవేశపెట్టడానికి ‘ఇలా అన్నాడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం (YHWH)ను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడిన వ్యక్తిని సూచించే ఈ సంబంధాన్ని తెలుగులో ‘మోషేతో’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో ‘ఇలా అన్నాడు:’ అని సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాని ధ్వన్యనుకరణను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ బిరుదు అనువాదాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
