id: LEV.23.17
reference: Leviticus 23:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: te
  text: మీ నివాస స్థలాల నుండి ఊపార్పణగా రెండు రొట్టెలను తీసుకురావాలి. అవి ఏఫాలో రెండు పదోవంతుల మెత్తని పిండితో ఉండాలి[a]; వాటిని పులియబెట్టి కాల్చాలి[b]. అవి యాహ్వేకు ప్రథమఫలాలుగా ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘రెండు పదోవంతులు’ అని ఉంది; యాజక సంబంధ కొలమానంలో ఇది ఏఫాలో రెండు పదోవంతులు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘పులిసిన రొట్టెలుగా కాల్చాలి.’ ఈ ప్రథమఫలాల రొట్టెలు పులియబెట్టినవని హీబ్రూ మూలం స్పష్టంగా పేర్కొంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: మీ నివాస స్థలాల నుండి
  rationale: מוֹשָׁב ప్రజలు నివసించే స్థలాన్ని లేదా జనావాసాన్ని సూచిస్తుంది; మూలంలోని బహువచన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֶחֶם תְּנוּפָה שְׁתַּיִם
  choice: ఊపి అర్పించే నైవేద్యంగా రెండు రొట్టెలను
  rationale: לֶחֶם రూపంలో ఏకవచనమైనా שְׁתַּיִם వల్ల ఇక్కడ రెండు రొట్టెలు ఉద్దేశించబడ్డాయి. תְּנוּפָה ప్రత్యేక ఆచారరీతిలో ఊపి సమర్పించే అర్పణను సూచిస్తుంది.
- source_word: שְׁנֵי עֶשְׂרֹנִים סֹלֶת
  choice: రెండు పదోవంతుల ఏఫా మెత్తని పిండి
  rationale: עִשָּׂרוֹן యాజక సంబంధ కొలతలో ఏఫాలో పదోవంతు; రెండు పదోవంతులు అని స్పష్టీకరించడం కొలతను అర్థమయ్యేలా చేస్తుంది. סֹלֶת అర్పణలకు వాడే మెత్తని పిండి.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: పులియబెట్టి కాల్చాలి
  rationale: חָמֵץ పులిసిన స్థితిని, תֵּאָפֶינָה కాల్చబడటాన్ని సూచిస్తాయి; ఈ రొట్టెలు పులియబెట్టినవని మూలం ప్రత్యేకంగా చెబుతుంది.
- source_word: בִּכּוּרִים לַיהוָה
  choice: యెహోవాకు ప్రథమఫలాల అర్పణ
  rationale: בִּכּוּרִים మొదటి పంటఫలాలను సూచిస్తుంది; వాక్యంలోని విధేయ సంబంధాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘అర్పణ’ను చేర్చాం. יהוהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక ఒడంబడిక దైవనామమైన יהוה నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచితమైన ‘యెహోవా’గా అందించాం.
- issue: תְּנוּפָה అనే ఆరాధనా సాంకేతిక పదం
  choice: ఊపి అర్పించే నైవేద్యం
  alternative: ఊపార్పణ
  rationale: ఇది ఇశ్రాయేలు బల్యారాధనలోని నిర్దిష్ట సమర్పణ చర్యను సూచిస్తుంది. సాధారణ పాఠకునికి చర్య స్పష్టమయ్యే వివరణాత్మక రూపాన్ని ఎంచుకున్నాం; ఆచారార్థానికి అదనపు వ్యాఖ్యానం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర ఆదేశ శైలిని ఉపయోగించాం. ‘ఊపి అర్పించే నైవేద్యం’ అనే రూపం సాంకేతిక ఆచారాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా చేస్తుంది; కొలతకు పాదసూచిక ఇచ్చాం.
