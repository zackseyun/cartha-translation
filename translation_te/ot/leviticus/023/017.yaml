revisions:
- from: మీ నివాస స్థలాల నుండి, ఊపి అర్పించే నైవేద్యంగా రెండు రొట్టెలను తీసుకురావాలి. అవి రెండు పదోవంతుల ఏఫా[a] మెత్తని పిండితో చేసి, పులియబెట్టి కాల్చాలి[b]. అవి యెహోవాకు ప్రథమఫలాల అర్పణ.
  to: మీ నివాస స్థలాల నుండి ఊపార్పణగా రెండు రొట్టెలను తీసుకురావాలి. అవి ఏఫాలో రెండు పదోవంతుల మెత్తని పిండితో ఉండాలి[a]; వాటిని పులియబెట్టి కాల్చాలి[b]. అవి యాహ్వేకు ప్రథమఫలాలుగా ఉంటాయి.
