source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: te
  text: ఆ రొట్టెలతో పాటు[a] ఒక సంవత్సరం వయసున్న, లోపంలేని ఏడు మగ గొర్రెపిల్లలను, పశువుల మందలోనుండి ఒక ఎద్దును, రెండు పొట్టేళ్లను అర్పించాలి. అవి వాటి ధాన్యార్పణలతోను పానార్పణలతోను కూడిన, యాహ్వేకు ఇంపైన సువాసనగల అగ్నియర్పణగా దహనబలిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ రొట్టెల పక్కన,” లేక “ఆ రొట్టెలకు అదనంగా”; హీబ్రూ విభక్తి పదం భౌతికంగా వాటి పైన అని కాక, వాటితో కూడిన సమర్పణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: అర్పించాలి
  rationale: హిఫిల్ రూపమైన קרב బలుల సందర్భంలో సమర్పించడం లేదా దగ్గరకు తీసుకురావడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘అర్పించాలి’ సహజమైన బలిపరిభాష.
- source_word: עַל הַלֶּחֶם
  choice: ఆ రొట్టెలతో పాటు
  rationale: עַל ఇక్కడ భౌతికంగా రొట్టెలపై ఉంచడాన్ని కాక, ముందుగా చెప్పిన రొట్టెలకు తోడుగా జంతుబలులను సమర్పించడాన్ని సూచిస్తుంది; అసలు విభక్తి పదంలోని పరిధిని పాదటిప్పణిలో నిలిపాం.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: ఒక సంవత్సరం వయసుగల, లోపంలేని ఏడు మగ గొర్రెపిల్లలు
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది; పుంలింగ రూపాన్ని ‘మగ’గా వ్యక్తం చేశాం. תָּמִים బలిపశువుకు దోషం లేదా లోపం లేకపోవడాన్ని సూచిస్తుంది.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: మందలోనుండి ఒక ఎద్దు
  rationale: పదబంధం పశువుల మందకు చెందిన ఎద్దును సూచిస్తుంది; నిర్ధిష్టంగా చెప్పని వయస్సును ‘దూడ’ అని పరిమితం చేయలేదు.
- source_word: וְאֵילִם שְׁנָיִם
  choice: రెండు పొట్టేళ్లు
  rationale: אַיִל అనేది మగ గొర్రెను, అంటే పొట్టేలును, నిర్దిష్టంగా సూచిస్తుంది.
- source_word: יִהְיוּ עֹלָה לַיהוָה
  choice: యెహోవాకు దహనబలిగా ఉండాలి
  rationale: עֹלָה పూర్తిగా దహించబడే బలికి సాంకేతిక పదం; ఏకవచనం ఇక్కడ పేర్కొన్న జంతువులన్నిటినీ సమష్టిగా సూచిస్తుంది.
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: వాటికి సంబంధించిన ధాన్యార్పణతో, పానార్పణలతో కూడి
  rationale: מִנְחָה ఈ యాజ్ఞిక సందర్భంలో ధాన్యార్పణ; נֶסֶךְ పోసే పానార్పణ. హీబ్రూ ప్రత్యయాలు జంతుబలులకు సంబంధించిన సహ అర్పణలను సూచిస్తాయి.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఈ పదం అగ్ని ద్వారా సమర్పించబడే అర్పణను సూచిస్తుంది. ‘ఆహారార్పణ’ కంటే అగ్ని అంశాన్ని నేరుగా నిలిపే అనువాదం మూలానికి దగ్గరగా ఉంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: యెహోవాకు ఆమోదకరమైన లేదా ప్రసన్నత కలిగించే వాసన అనే యాజ్ఞిక సూత్రపదాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలిపి, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని నాలుగు అక్షరాల దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిశ్చితం కానందున, సాధారణ తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: אִשֵּׁה యొక్క అర్థం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహారార్పణ
  rationale: మూలపదంలో అగ్ని ద్వారా అర్పణ అనే యాజ్ఞిక భావం ప్రధానంగా కనిపిస్తుంది. దేవునికి ఆహారం అవసరమనే భావాన్ని అనవసరంగా ముందుకు తేవకుండా, అగ్ని అంశాన్ని స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన యాజ్ఞిక శైలిని పాటించాం. ‘ధాన్యార్పణ’, ‘పానార్పణ’, ‘దహనబలి’ వంటి సందర్భానుకూల పదాలను వాడుతూ, వాక్యాన్ని సాధారణ పాఠకుడికి స్పష్టంగా ఉంచాం.
