id: LEV.23.40
reference: Leviticus 23:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: te
  text: మొదటి రోజున మీరు మీ కోసం శోభగల చెట్ల పండ్లను[a], ఖర్జూరపు మట్టలను, దట్టమైన ఆకులుగల చెట్ల కొమ్మలను, వాగులోని విల్లో చెట్ల కొమ్మలను తీసుకోవాలి. మీ దేవుడైన యాహ్వే సన్నిధిలో ఏడు రోజులు ఆనందించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, తరువాతి యూదు సంప్రదాయం ప్రకారం, “మాదీఫలం” (ఎత్రోగ్) కావచ్చు. హీబ్రూలో అక్షరార్థంగా “శోభగల చెట్ల పండ్లు” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: మీ కోసం తీసుకోవాలి
  rationale: న్యాయబోధ సందర్భంలోని క్రియ ఆదేశ భావాన్ని ఇస్తుంది; לָכֶםను ‘మీ కోసం’గా స్పష్టంగా నిలిపింది.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: పండుగ అనే సందర్భపదాన్ని చేర్చకుండా హీబ్రూ కాలవాచకాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: פְּרִי עֵץ הָדָר
  choice: శోభగల చెట్ల పండ్లు
  rationale: הָדָרలోని శోభ, సౌందర్యం, వైభవం అనే భావపరిధిని నిలిపి, తరువాతి సంప్రదాయంలోని నిర్దిష్ట ఫల గుర్తింపును ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: כַּפֹּת תְּמָרִים
  choice: ఖర్జూరపు మట్టలు
  rationale: כַּפֹּת ఇక్కడ ఖర్జూర చెట్టు ఆకులతో కూడిన మట్టలను సూచిస్తుంది; ఇది సాధారణ తెలుగులో సహజమైన వృక్షపదం.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: దట్టమైన ఆకులుగల చెట్ల కొమ్మలు
  rationale: עָבֹת సూచించే దట్టతను ఆకుల సాంద్రతగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעַרְבֵי נָחַל
  choice: వాగు ఒడ్డున పెరిగే నిరవంజి కొమ్మలు
  rationale: עֲרָבָהను విల్లో జాతికి తెలుగు వృక్షనామమైన ‘నిరవంజి’తో, נַחַלను వాగుగా అందించింది; తీసుకోవలసినవి కొమ్మలని సందర్భానుసారంగా స్పష్టం చేసింది.
- source_word: וּשְׂמַחְתֶּם
  choice: ఆనందించాలి
  rationale: క్రియలోని సంతోషించడం అనే ప్రత్యక్ష భావాన్నీ ఆదేశ బలాన్నీ సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా సన్నిధిలో
  rationale: לִפְנֵיను ‘సన్నిధిలో’గా, దైవనామం יְהוָהను పేరుగా ‘యెహోవా’గా అందించింది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, అదనపు పదం లేకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న నిబంధన నామాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన పేరురూపంలో ఉంచింది.
- issue: פְּרִי עֵץ הָדָר యొక్క గుర్తింపు
  choice: సాధారణార్థంలో ‘శోభగల చెట్ల పండ్లు’
  alternative: మాదీఫలం/ఎత్రోగ్
  rationale: హీబ్రూ పదబంధం నిర్దిష్ట వృక్షజాతిని స్పష్టంగా పేర్కొనదు. తరువాతి యూదు సంప్రదాయ గుర్తింపును పాదసూచికలో ఉంచి మూలంలోని అనిశ్చితిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ఆదేశ శైలి. వృక్షపదాల్లో సాధ్యమైనంత సాధారణ అవగాహనను లక్ష్యంగా పెట్టుకొని, మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపింది.
