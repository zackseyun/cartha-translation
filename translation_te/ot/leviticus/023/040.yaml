revisions:
- from: మొదటి రోజున మీరు శోభగల చెట్ల పండ్లను[a], ఖర్జూరపు మట్టలను, దట్టమైన ఆకులుగల చెట్ల కొమ్మలను, వాగు ఒడ్డున పెరిగే నిరవంజి కొమ్మలను మీ కోసం తీసుకోవాలి. మీ దేవుడైన యెహోవా సన్నిధిలో ఏడు రోజులు ఆనందించాలి.
  to: మొదటి రోజున మీరు మీ కోసం శోభగల చెట్ల పండ్లను[a], ఖర్జూరపు మట్టలను, దట్టమైన ఆకులుగల చెట్ల కొమ్మలను, వాగులోని విల్లో చెట్ల కొమ్మలను తీసుకోవాలి. మీ దేవుడైన యాహ్వే సన్నిధిలో ఏడు రోజులు ఆనందించాలి.
  rationale: The revision changes only the divine-name form required by project policy and clarifies the willow/stream phrase without adding a bank-side detail. The main text remains deliberately generic for פְּרִי עֵץ הָדָר, and the traditional etrog identification remains confined to the footnote.
