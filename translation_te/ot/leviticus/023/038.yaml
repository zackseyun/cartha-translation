base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: te
  text: యెహోవా విశ్రాంతి దినాలకు అదనంగా, మీ కానుకలకు అదనంగా, మీ మొక్కుబడులన్నిటికి అదనంగా, యెహోవాకు మీరు ఇచ్చే మీ స్వచ్ఛంద అర్పణలన్నిటికి అదనంగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: సందర్భంలో ముందుగా ఆదేశించిన పండుగ అర్పణలు, క్రమమైన విశ్రాంతి దినాల అర్పణలు మరియు వ్యక్తిగత కానుకలకు అదనమైనవని సూచిస్తుంది. హెబ్రీలో పదం పునరావృతమైనా, సహజమైన తెలుగులో జాబితాను ఒకే ‘అదనంగా’ కింద సమీకరించడం భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שַׁבְּתֹת יְהוָה
  choice: యెహోవా విశ్రాంతి దినాలు
  rationale: హెబ్రీ బహువచనాన్ని నిలుపుతూ, construct సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: מַתְּנוֹתֵיכֶם
  choice: మీ కానుకలు
  rationale: దేవునికి ఇచ్చే బహుమతులు లేదా కానుకలు అనే విస్తృత భావాన్ని అనవసరంగా బలులకే పరిమితం చేయదు.
- source_word: כָּל נִדְרֵיכֶם
  choice: మీ మొక్కుబడులన్నీ
  rationale: నֶדֶר అనే పదంలోని దేవునికి చేసిన ప్రతిజ్ఞ లేదా దాని ప్రకారం సమర్పించేది అనే భావాన్ని తెలుగు ఆధ్యాత్మిక వాడుకలో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: మీ స్వచ్ఛంద అర్పణలన్నీ
  rationale: బలిసంబంధ సందర్భంలో ఎటువంటి బలవంతం లేకుండా ఇష్టపూర్వకంగా సమర్పించే అర్పణలను స్పష్టంగా సూచిస్తుంది.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: మీరు యెహోవాకు అర్పించే
  rationale: נתן యొక్క ప్రాథమిక ‘ఇవ్వు’ భావాన్ని ఆరాధనా సందర్భానికి తగిన సహజ తెలుగు ‘అర్పించే’తో వ్యక్తపరుస్తుంది; సంబంధ వాక్యం జాబితాలోని కానుకలు, మొక్కుబడులు, స్వచ్ఛంద అర్పణలకు వర్తించేలా ఉంచబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
- issue: מִלְּבַד యొక్క సంబంధం
  choice: ఇంతకుముందు ఆదేశించిన పండుగ అర్పణలకు ఇవన్నీ అదనమని తెలిపే నిర్మాణం
  alternative: ఇవి అన్నిటిని మినహాయించి అనే వేరుచేసే భావం
  rationale: లేవీయకాండము 23 సందర్భంలో నిర్ణీత పండుగ అర్పణలు సాధారణ విశ్రాంతి దినాల మరియు వ్యక్తిగత అర్పణల స్థానాన్ని తీసుకోవని భావం ప్రధానంగా కనిపిస్తుంది; అయినా ‘apart from’ అనే వేరుచేసే ఛాయను గమనికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని జాబితా భావాన్ని నిలుపుతూ, తెలుగు సహజ వాక్యక్రమం కోసం పునరావృతమైన מִלְּבַד ను ఒకే ముగింపు పదబంధంలో సమీకరించాం. ‘అర్పించవలసినవి’ సందర్భం నుంచి సరఫరా చేయబడింది; ఈ వచనం ముందటి ఆజ్ఞను కొనసాగించే వాక్యఖండం కావడంతో తెలుగులో సంపూర్ణంగా చదవడానికి ఇది అవసరం.
