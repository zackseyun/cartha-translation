revisions:
- from: ఇవి యెహోవా విశ్రాంతి దినాలకు[a], మీ కానుకలకు, మీ మొక్కుబడులన్నిటికి, మీరు యెహోవాకు అర్పించే మీ స్వచ్ఛంద అర్పణలన్నిటికి అదనంగా అర్పించవలసినవి.
  to: యెహోవా విశ్రాంతి దినాలకు అదనంగా, మీ కానుకలకు అదనంగా, మీ మొక్కుబడులన్నిటికి అదనంగా, యెహోవాకు మీరు ఇచ్చే మీ స్వచ్ఛంద అర్పణలన్నిటికి అదనంగా.
  rationale: The revision removes the unsupported supplied predicate and preserves the Hebrew verse as a continuation. It also restores the repeated additive expression while retaining the draft’s sound terminology and the divine-name rendering.
