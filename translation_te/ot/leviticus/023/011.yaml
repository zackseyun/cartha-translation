source:
  edition: WLC
  text: וְ/הֵנִ֧יף אֶת הָ/עֹ֛מֶר לִ/פְנֵ֥י יְהוָ֖ה לִֽ/רְצֹנְ/כֶ֑ם מִֽ/מָּחֳרַת֙ הַ/שַּׁבָּ֔ת יְנִיפֶ֖/נּוּ הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: te
  text: అతడు ఆ ధాన్యపు కట్టను యాహ్వే సన్నిధిలో, మీరు అంగీకరించబడేలా[a] ఊపాలి. ఆ విశ్రాంతిదినం మరుసటి రోజున యాజకుడు దానిని ఊపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు అంగీకరించబడుటకై.’ ఈ హెబ్రీ పదబంధం అర్పణ ద్వారా ఆరాధకులు యాహ్వే ఎదుట అంగీకరించబడటాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: ఊపాలి
  rationale: נוּף హిఫీల్ రూపం ఇక్కడ అర్పణను ఆచారరీతిగా ఊపి సమర్పించడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ‘ఊపాలి’ ఆ క్రియను నేరుగా నిలుపుతుంది.
- source_word: הָעֹמֶר
  choice: ఆ పనను
  rationale: ఈ సందర్భంలో עֹמֶר ధాన్యపు కొలతకన్నా ప్రథమఫలంగా తెచ్చిన పనను సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఆచారపూర్వకంగా సమర్పించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దైవనామం యాహ్వేగా లిప్యంతరీకరించబడింది.
- source_word: לִרְצֹנְכֶם
  choice: మీరు అంగీకరించబడేలా
  rationale: ఈ పదబంధం అర్పణ ద్వారా ఆరాధకులు దేవుని ఎదుట అంగీకారం పొందే భావాన్ని వ్యక్తం చేయగలదు; సంబంధిత అస్పష్టతను పాదసూచికలో నిలుపుతున్నాం.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: విశ్రాంతిదినం మరుసటి రోజున
  rationale: నిర్దిష్టమైన విశ్రాంతిదినం తరువాతి రోజును స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְנִיפֶנּוּ הַכֹּהֵן
  choice: యాజకుడు దానిని ఊపాలి
  rationale: కర్త అయిన యాజకుని, పనను సూచించే కర్మప్రత్యయాన్ని స్పష్టంగా వ్యక్తం చేస్తూ మొదటి ఆచారక్రియనే పునరావృతం చేస్తుంది.
theological_decisions:
- issue: లִרְצֹנְכֶם అనే బలిసంబంధ పదబంధం
  choice: మీరు అంగీకరించబడేలా
  alternative: మీ అంగీకారం కోసం
  rationale: హెబ్రీ పదబంధం అర్పణ యొక్క అంగీకారయోగ్యతను గానీ, దాని ద్వారా ఆరాధకులు అంగీకరించబడటాన్ని గానీ సూచించగలదు. ప్రధాన పాఠ్యం వ్యక్తుల అంగీకార భావాన్ని సహజంగా ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హెబ్రీ పాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ఆచారపదాన్ని అతిగా వివరిచకుండా ‘ఊపాలి’గా ఉంచి, పాఠకునికి తెలిసేలా ‘పన’ అనే సాధారణ ధాన్యకట్ట పదాన్ని వాడాం.
