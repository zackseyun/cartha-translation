id: LEV.23.28
reference: Leviticus 23:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: te
  text: ఈ రోజునే మీరు ఏ పనీ చేయకూడదు; ఎందుకంటే ఇది ప్రాయశ్చిత్తాల దినం[a], మీ దేవుడైన యాహ్వే సన్నిధిలో మీ కోసం ప్రాయశ్చిత్తం చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ప్రాయశ్చిత్తాల దినం.’ ఈ పండుగను తెలుగులో సాధారణంగా ‘ప్రాయశ్చిత్త దినం’ అని కూడా అంటారు.
    reason: మూలంలోని బహువచన రూపాన్ని మరియు స్థిరపడిన ఏకవచన పండుగపేరును రెండింటినీ తెలియజేయడం.
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: మీరు ఏ పనీ చేయకూడదు
  rationale: מְלָאכָה పండుగ, విశ్రాంతిదిన నిషేధాల్లో పని లేదా వృత్తిపరమైన శ్రమను సూచిస్తుంది. నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగు ధర్మశాసన శైలిలో ‘చేయకూడదు’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: בְּ/עֶצֶם הַ/יּוֹם הַ/זֶּה
  choice: ఈ రోజునే
  rationale: ఈ హీబ్రూ నుడికారం అదే నిర్దిష్ట దినాన్ని బలంగా నొక్కి చెబుతుంది; ‘ఈ రోజునే’ ఆ ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי పని చేయకూడదనే ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יּוֹם כִּפֻּרִים
  choice: ప్రాయశ్చిత్తాల దినం
  rationale: כִּפֻּרִים రూపం బహువచనంగా ఉంది. స్థిరమైన పండుగపేరును గుర్తించగలిగేలా ఉంచుతూ, మూలంలోని నిజమైన సంఖ్యారూపాన్ని ‘ప్రాయశ్చిత్తాల’గా కాపాడాం.
- source_word: לְ/כַפֵּר עֲלֵי/כֶם
  choice: మీ కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: పీయేల్ క్రియ כפר యాజక ఆరాధనా సందర్భంలో ప్రాయశ్చిత్తం చేయడాన్ని సూచిస్తుంది; עַל ఈ క్రియతో ప్రాయశ్చిత్తం ఎవరి కోసం చేయబడుతుందో తెలియజేస్తుంది.
- source_word: לִ/פְנֵי
  choice: సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో దేవుని సమక్షాన్ని సూచించే ఈ సంబంధపదాన్ని తెలుగులో గౌరవప్రదంగా, సహజంగా ‘సన్నిధిలో’ అని అందించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי/כֶם
  choice: మీ దేవుడు
  rationale: యెహోవాతో కూడిన నిబంధన సూత్రంలో אֱלֹהִים ఏకవచన భావంలో ఉంది; ద్వితీయ పురుష బహువచన ప్రత్యయాన్ని ‘మీ’గా తెలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడి, సాధారణ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం; ఖచ్చిత ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ఏ సిద్ధాంతపరమైన వాదనతోనూ పరిష్కరించలేదు.
- issue: כפר / כִּפֻּרִים అనే ఆరాధనా పదజాలం
  choice: ప్రాయశ్చిత్తం / ప్రాయశ్చిత్తాల దినం
  alternative: పాపపరిహారం / ప్రాయశ్చిత్త దినం
  rationale: ‘ప్రాయశ్చిత్తం’ యాజక ఆరాధనా, సమాధానపరచే భావభారాన్ని మోస్తుంది; అయితే అది ఎలా కార్యసాధకం అవుతుందనే తరువాతి సిద్ధాంతాన్ని వాక్యంలోకి చేర్చదు. బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పండుగకు సాధారణంగా వాడే ఏకవచన పేరును పాదసూచికలో తెలిపాం.
- issue: לְכַפֵּר యొక్క ఉద్దేశార్థం
  choice: ప్రాయశ్చిత్తం చేయడానికి
  alternative: ప్రాయశ్చిత్తం జరిగేలా
  rationale: లామెద్‌తో కూడిన క్రియానామం ఉద్దేశాన్ని తెలియజేస్తుంది. కర్తను వచనం స్పష్టంగా పేర్కొననందున తెలుగులో కూడా ఎవరు ప్రాయశ్చిత్తం చేస్తారో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాసనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా అనువదించాం. ‘నియమించిన’ అనే పదం హీబ్రూలో ప్రత్యక్షంగా లేకపోయినా, ఉద్దేశ సంబంధాన్ని సహజ తెలుగులో కలపడానికి వాడబడింది; అయితే మరింత రూపనిష్ఠ పాఠ్యంలో దాన్ని విడిచిపెట్టవచ్చు.
