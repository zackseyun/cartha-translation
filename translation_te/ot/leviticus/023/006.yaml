revisions:
- from: ఈ నెల పదిహేనవ రోజున యెహోవాకు[a] పులియని రొట్టెల పండుగ జరగాలి; ఏడు రోజులపాటు మీరు పులియని రొట్టెలు తినాలి.
  to: ఈ నెల పదిహేనవ రోజున యాహ్వేకు[a] పులియని రొట్టెల పండుగ ఉంటుంది; ఏడు రోజులపాటు మీరు పులియని రొట్టెలు తినాలి.
  rationale: The revision removes the added obligation in the first clause, preserves the Hebrew nominal festival declaration, retains the legal instruction in the final clause, and aligns the Telugu divine-name rendering and its footnote with the English POB audit trail. The footnote remains anchored directly to «యాహ్వేకు» and expresses the two legitimate relational nuances of לְ without choosing one exclusively.
