id: LEV.23.6
reference: Leviticus 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: te
  text: ఈ నెల పదిహేనవ రోజున యాహ్వేకు[a] పులియని రొట్టెల పండుగ ఉంటుంది; ఏడు రోజులపాటు మీరు పులియని రొట్టెలు తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే కోసం.” ఇక్కడి హీబ్రూ ఉపసర్గ ఈ పండుగ యాహ్వేకు అంకితమైనదనే లేదా ఆయనకు చెందినదనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: חַג అనే ఆరాధనా పండుగ భావాన్నీ, מַצּוֹת అనే పులియబెట్టని రొట్టెలను సూచించే పండుగ పేరునూ సహజంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను వ్యక్తినామంగా ప్రతిలిపి చేసి, ל ఉపసర్గ సూచించే సమర్పణ లేదా చెందిన సంబంధాన్ని దత్తివిభక్తితో దగ్గరగా నిలుపుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: హీబ్రూలోని కాలవ్యవధిని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַצּוֹת תֹּאכֵלוּ
  choice: మీరు పులియని రొట్టెలు తినాలి
  rationale: చట్టపరమైన సందర్భంలో imperfect క్రియకు ఉన్న ఆదేశాత్మక బలాన్ని ఆధునిక తెలుగులో సహజమైన ‘తినాలి’తో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచుతుంది; తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన రూపం ‘యెహోవా’.
- issue: לַיהוָהలో ל ఉపసర్గ సంబంధం
  choice: యెహోవాకు
  alternative: యెహోవా కోసం
  rationale: ఈ పండుగ దేవునికి అంకితమైనది లేదా ఆయనకు చెందినది అనే రెండు సమీప భావాలను ‘-కు’ కొంతవరకు తెరిచి ఉంచుతుంది; ఒకే భావానికి పరిమితం చేయకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘జరగాలి’ను తెలుగులో పూర్తి వాక్యంగా సహజత్వం కోసం చేర్చాం; హీబ్రూలో నామవాక్య నిర్మాణం ఉంది. ఆదేశాత్మక భావానికి అతి ప్రాచీనమైన ‘తినవలెను’ బదులు ప్రస్తుత వాడుకలోని ‘తినాలి’ను ఎంచుకున్నాం.
