id: LEV.23.15
reference: Leviticus 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: te
  text: “మీరు విశ్రాంతిదినం మరుసటి రోజు నుండి, కదిలించి అర్పించే ధాన్యపు కట్టను మీరు తీసుకువచ్చే రోజు నుండి, మీ కొరకు లెక్కించాలి. ఏడు సంపూర్ణ విశ్రాంతిదినాలు[a] ఉండాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడు సంపూర్ణ వారాలు.” హీబ్రూలో అక్షరార్థంగా “ఏడు సంపూర్ణ విశ్రాంతిదినాలు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: లెక్కించాలి
  rationale: న్యాయవిధి సందర్భంలో ఈ క్రియ ఆజ్ఞార్థక భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘లెక్కించాలి’ ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: దాతృక సర్వనామంలోని వ్యక్తిగత/ప్రతిబింబ భావాన్ని నిలుపుతుంది; లెక్కింపును వారు తామే పాటించాల్సిన బాధ్యతగా సూచిస్తుంది.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: విశ్రాంతిదినం మరుసటి రోజు నుంచి
  rationale: מָחֳרַת తెలిపే ‘తరువాతి రోజు’ అనే కాలసంబంధాన్ని స్పష్టంగా ఉంచి, שַׁבָּת అనే ఆరాధనా పదాన్ని ‘విశ్రాంతిదినం’గా నిలుపుతుంది.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: మీరు తీసుకువచ్చే రోజు నుంచి
  rationale: లెక్కింపు మొదలయ్యే రోజును తెలుగులో సహజమైన క్రియారూపంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹמֶר
  choice: ధాన్యపు పన
  rationale: ఈ సందర్భంలో ఇది కొలమానం కంటే ఆచారంలో సమర్పించే కోసిన ధాన్యపు కట్టను సూచిస్తుంది. ‘ధాన్యపు పన’ సాధారణ పాఠకునికి ఆ వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַתְּנוּפָה
  choice: కదిలించి అర్పించే
  rationale: యెహోవా సన్నిధిలో ఆ అర్పణను ఆచారబద్ధంగా కదిలించి సమర్పించే ప్రత్యేక చర్యను తెలియజేస్తుంది; కేవలం సాధారణ ‘అర్పణ’గా మార్చదు.
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: ఏడు విశ్రాంతిదినాలు
  rationale: మూలపాఠం సాధారణ ‘వారాలు’ అనే పదానికి బదులు שַׁבָּתוֹת అని చెబుతుంది. అందువల్ల ప్రధాన పాఠంలో దాని ప్రత్యక్ష అర్థాన్ని నిలిపి, ‘ఏడు వారాలు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: תְּמִימֹת
  choice: సంపూర్ణ
  rationale: కాలగణనలో ఈ పదం లోపరాహిత్యాన్ని కాకుండా పూర్తి కాలచక్రాలను సూచిస్తుంది; ‘సంపూర్ణ’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תִּהְיֶינָה
  choice: ఉండాలి
  rationale: హీబ్రూ వాక్యంలోని అస్తిత్వ/విధి భావాన్ని ఆధునిక తెలుగు న్యాయనిర్దేశ శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కాలగణన ఆదేశంలో שַׁבָּת / שַׁבָּתוֹת అర్థం
  choice: ప్రధాన పాఠంలో ‘విశ్రాంతిదినం/విశ్రాంతిదినాలు’ అని ఉంచడం
  alternative: ‘వారం/వారాలు’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం విశ్రాంతిదినాన్ని సూచించే పదాన్నే ఉపయోగిస్తుంది. లెక్కింపు ఏ రోజున మొదలవుతుందనే మరియు బహువచనం ఇక్కడ ‘వారాలు’ అనే కాలవ్యవధిని సూచిస్తుందా అనే వ్యాఖ్యాన భేదాలను ప్రధాన పాఠంలో పరిష్కరించకుండా, మూలంలోని ఉద్రిక్తతను నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విధి-నిర్దేశ శైలిని ఉపయోగించాం. ‘అంటే’ రెండవ కాలవాచక పదబంధం మొదటిదాన్ని మరింత నిర్దిష్టంగా వివరిస్తుందని తెలుగులో స్పష్టం చేస్తుంది. ఆచారపరమైన ‘wave offering’ భావాన్ని అపరిచిత పారిభాషిక పదంతో కాకుండా ‘కదిలించి అర్పించే’ అని పారదర్శకంగా వ్యక్తం చేశాం.
