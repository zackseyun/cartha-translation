  to: “మీరు విశ్రాంతిదినం మరుసటి రోజు నుండి, కదిలించి అర్పించే ధాన్యపు కట్టను మీరు తీసుకువచ్చే రోజు నుండి, మీ కొరకు లెక్కించాలి. ఏడు సంపూర్ణ విశ్రాంతిదినాలు[a] ఉండాలి.”
