id: LEV.23.4
reference: Leviticus 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: te
  text: ఇవి యాహ్వే నియమిత సమయాలు[a]—వాటిని వాటి నియమిత సమయాల్లో ప్రకటించవలసిన పవిత్ర సమావేశాలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నియమిత పండుగలు’ లేదా ‘నిర్ణయించిన కాలాలు.’ హీబ్రూ מוֹעֲדֵי కేవలం విందు భోజనాలనే కాదు, యాహ్వే నిర్ణయించిన సమయాలను విస్తృతంగా సూచిస్తుంది.
    reason: మూల పదమైన מוֹעֲדֵיకి ఉన్న కాలసంబంధ ప్రధానార్థాన్ని, అలాగే దాని సహజ ప్రత్యామ్నాయాలను సూచిస్తుంది.
  - marker: b
    text: లేదా, ‘పవిత్ర సభలు.’
    reason: మִקְרָאֵי קֹדֶשׁకు సహజమైన ప్రత్యామ్నాయ అనువాదాన్ని అందిస్తుంది.
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: తరువాత వచ్చే జాబితాను సూచించే బహువచన నిర్దేశక పదం; తెలుగులో సహజంగా ‘ఇవి’ సరిపోతుంది.
- source_word: מוֹעֲדֵי
  choice: నియమించిన సమయాలు
  rationale: מוֹעֵד కేవలం విందులను కాక, నిర్ణయించబడిన సమయాలు లేదా సమావేశ సందర్భాలను సూచిస్తుంది; ఈ అధ్యాయంలో విశ్రాంతిదినం సహా పవిత్ర కాలాలను కలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: పవిత్ర సమావేశాలు
  rationale: సమకూడమని పిలువబడిన పవిత్ర సభలను సూచించే నిర్మాణం; ‘సమావేశాలు’ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: మీరు ... ప్రకటించవలసిన
  rationale: קרא ఇక్కడ కేవలం పేరు పెట్టడం కాక, ఈ పవిత్ర ఆచరణలను బహిరంగంగా ప్రకటించడం లేదా పిలుపునివ్వడం అనే భావాన్ని కలిగి ఉంది.
- source_word: בְּמוֹעֲדָם
  choice: వాటి నియమిత సమయాల్లో
  rationale: ప్రతి ఆచరణకు చెందిన నిర్ణీత సందర్భాన్ని సూచిస్తుంది; మొదటి מוֹעֲדֵיతో ఉన్న పదపునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగానే ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నియమించిన సమయాలు’ ద్వారా కాలసంబంధ భావం, ‘పవిత్ర సమావేశాలు’ ద్వారా సామూహిక సభ భావం నిలుపబడ్డాయి. మూలంలోని రెండు מוֹעֵד రూపాల పునరుక్తిని తెలుగులోనూ ప్రతిబింబించాం.
