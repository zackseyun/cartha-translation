review_pass:
  verdict: revise
  source_fidelity: The rendering accurately preserves the command to reside in booths for seven days and the repeated habitation verb. However, “ఇశ్రాయేలులో పుట్టిన” can be read geographically as born within the land of Israel, whereas כָּל־הָאֶזְרָח בְּיִשְׂרָאֵל denotes every native-born member of the Israelite community, in contrast to a resident foreigner.
  naturalness: The Telugu is clear, modern, and appropriately formal. “పర్ణశాలలు” is a well-established biblical Telugu term, and “నివసించాలి” naturally conveys the required temporary residence.
  terminology: “పర్ణశాలలు” suitably renders סֻכּוֹת while retaining the traditional festival image; the footnote helpfully supplies a contemporary explanation. “స్వదేశీయుడైన ప్రతి వ్యక్తి” better communicates אֶזְרָח without imposing a male-only scope or a strictly geographical birthplace.
  issues:
  - severity: medium
    issue: “ఇశ్రాయేలులో పుట్టిన ప్రతి వ్యక్తి” may imply birth in the territory of Israel.
    rationale: The Hebrew expression identifies native-born Israelites/community members rather than specifically those born within a geographic land. Revising it to “ఇశ్రాయేలీయులలో స్వదేశీయుడైన ప్రతి వ్యక్తి” retains the native-born/community contrast more faithfully.
  revised_text: మీరు ఏడు రోజులపాటు పర్ణశాలల్లో[a] నివసించాలి; ఇశ్రాయేలీయులలో స్వదేశీయుడైన ప్రతి వ్యక్తి పర్ణశాలల్లో నివసించాలి.
  revised_footnotes:
