    reason: lexical_alternative
  revision_rationale: The sole textual revision prevents a potentially misleading geographic reading of “born in Israel” and more closely represents the communal sense of הָאֶזְרָח בְּיִשְׂרָאֵל. The footnote is broadened to include both natural Telugu alternatives for the temporary festival structures while retaining “పర్ణశాలలు” in the main text.
