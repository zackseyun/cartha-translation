- from: మీరు ఏడు రోజులపాటు పర్ణశాలల్లో[a] నివసించాలి; ఇశ్రాయేలులో పుట్టిన ప్రతి వ్యక్తి పర్ణశాలల్లో నివసించాలి.
  to: మీరు ఏడు రోజులపాటు పర్ణశాలల్లో[a] నివసించాలి; ఇశ్రాయేలీయులలో స్వదేశీయుడైన ప్రతి వ్యక్తి పర్ణశాలల్లో నివసించాలి.
  rationale: The sole textual revision prevents a potentially misleading geographic reading of “born in Israel” and more closely represents the communal sense of הָאֶזְרָח בְּיִשְׂרָאֵל. The footnote is broadened to include both natural Telugu alternatives for the temporary festival structures while retaining “పర్ణశాలలు” in the main text.
