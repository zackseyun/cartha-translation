id: LEV.23.42
reference: Leviticus 23:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: te
  text: మీరు ఏడు రోజులపాటు పర్ణశాలల్లో[a] నివసించాలి; ఇశ్రాయేలీయులలో స్వదేశీయుడైన ప్రతి వ్యక్తి పర్ణశాలల్లో నివసించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తాత్కాలిక ఆశ్రయాల్లో’ లేదా ‘తాత్కాలిక గుడారాల్లో’; హెబ్రీ పదం పండుగ కోసం ఏర్పాటు చేసే తాత్కాలిక నివాసాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: పర్ణశాలల్లో
  rationale: סֻכּוֹת పండుగ కోసం నిర్మించే తాత్కాలిక నివాసాలను సూచిస్తుంది. ‘పర్ణశాలలు’ తెలుగు బైబిలు సందర్భంలో పరిచితమైనదిగా ఉండి, వాటి స్పష్టమైన నిర్మాణరూపాన్ని నిలుపుతుంది; అర్థాన్ని వివరించేందుకు పాదసూచిక ఇవ్వబడింది.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: నివసించాలి
  rationale: ישׁב మూలార్థంగా ‘కూర్చోవడం’ అని ఉన్నా, నివాస సందర్భంలో ‘నివసించడం’ అని అర్థం. ఇక్కడ పండుగకాలంలో పర్ణశాలల్లో ఉండాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా, స్పష్టంగా తెలిపే రూపం.
- source_word: כָּל הָאֶזְרָח
  choice: పుట్టిన ప్రతి వ్యక్తి
  rationale: אֶזְרָח అక్కడ స్వదేశీయుడిగా పుట్టిన సమాజ సభ్యుణ్ణి సూచిస్తుంది. ‘వ్యక్తి’ అనే రూపం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన హెబ్రీ పదం యొక్క ప్రతినిధి, సాధారణ పరిధిని అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఆజ్ఞ వర్తించే సమాజాన్ని నేరుగా సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: הָאֶזְרָח యొక్క వ్యాకరణ పుంలింగాన్ని తెలుగులో ఎలా ప్రతిబింబించాలి
  choice: ఇశ్రాయేలులో పుట్టిన ప్రతి వ్యక్తి
  alternative: ఇశ్రాయేలులో పుట్టిన ప్రతి పురుషుడు / ప్రతి స్వదేశీయుడు
  rationale: ఈ పుంలింగ ఏకవచన నామవాచకానికి ఇక్కడ ప్రతినిధి భావం ఉంది. ‘ప్రతి వ్యక్తి’ మూలంలోని సాధారణ పరిధిని కాపాడుతుంది; ‘ప్రతి పురుషుడు’ అనవసరమైన లింగ పరిమితిని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే ఆజ్ఞారూపం వాడబడింది. ‘పర్ణశాలలు’ అనే సాంప్రదాయిక పదానికి పాదసూచిక ద్వారా స్పష్టత ఇచ్చాం; రెండు ఉపవాక్యాల్లోనూ పునరుక్తమైన హెబ్రీ క్రియను ‘నివసించాలి’గా ఏకరీతిగా అనువదించాం.
