  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: te
  text: మీ తరాలు, నేను ఇశ్రాయేలీయులను[a] ఈజిప్టు దేశం నుండి బయటకు తీసుకువచ్చినప్పుడు వారిని పర్ణశాలల్లో[b] నివసింపజేశానని తెలుసుకునేలా. నేనే మీ దేవుడైన యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; లేదా ‘ఇశ్రాయేలు ప్రజలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తాత్కాలిక ఆశ్రయాల్లో’ లేదా ‘గుడిసెల్లో.’ హీబ్రూ పదం సుక్కోత్ తాత్కాలికంగా నిర్మించిన నివాసాలను సూచిస్తుంది; సంప్రదాయంగా ‘పర్ణశాలలు’ అని కూడా అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: తెలుసుకునేలా
  rationale: లְמַעַן తరువాతి అసంపూర్ణ క్రియ ఉద్దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెలుసుకునేలా’ ఆ ప్రయోజన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֹרֹתֵיכֶם
  choice: మీ తరాలవారు
  rationale: తరతరాల ఒడంబడిక భావాన్ని నిలుపుతూ, తెలుగులో వ్యక్తులను సూచించే సహజ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: తెలుసుకోవలసిన విషయాన్ని పరిచయం చేసే content markerగా ఇక్కడ ‘అని’ సరిపోతుంది.
- source_word: בַסֻּכּוֹת
  choice: పర్ణశాలల్లో
  rationale: సుక్కోత్ సందర్భంలోని తాత్కాలిక గుడిసెలను సూచించే, పండుగ పేరుతోనూ సంబంధం నిలిపే గౌరవప్రదమైన తెలుగు పదం; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: הוֹשַׁבְתִּי
  choice: నివసింపజేశాను
  rationale: ישׁב హిఫీల్ రూపంలోని కారణార్థక భావాన్ని—వారు నివసించేలా చేశాను—స్పష్టంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ఒడంబడిక ప్రజలను సూచిస్తున్నందున ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, సమగ్రంగా ఉంటుంది; అక్షరార్థం పాదసూచికలో ఉంది.
- source_word: בְּהוֹצִיאִי
  choice: బయటకు తీసుకువచ్చినప్పుడు
  rationale: בְּ + infinitive construct ఇక్కడ కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది; ఈ రూపం ఆ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఈజిప్టు దేశం నుండి
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘దేశం’ అనే నామవాచకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే సంప్రదాయ లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: ఒడంబడిక సూత్రవాక్యాన్ని నేరుగా, విస్తరణ లేకుండా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. తెలుగులో ‘యెహోవా’ విస్తృతంగా గుర్తించబడుతుంది; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా పరిగణించబడే ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సామూహిక సూచన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ పదబంధం అక్షరార్థంగా పురుష బహువచనమైనా, సందర్భంలో ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సామూహిక రూపాన్ని, పాదసూచికలో అక్షరార్థాన్ని నిలిపాం.
- issue: సుక్కోత్‌లో నివాస స్వరూపం
  choice: పర్ణశాలల్లో నివసింపజేశాను
  alternative: తాత్కాలిక ఆశ్రయాల్లో నివసింపజేశాను
  rationale: మూలపదం తాత్కాలిక గుడిసెలు లేదా ఆశ్రయాలను సూచిస్తుంది. పండుగ-పద సంబంధాన్ని నిలిపే ‘పర్ణశాలలు’ ఎంచుకొని, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కారణార్థక క్రియను నిలిపి, హీబ్రూ వాక్యంలోని ఉద్దేశ భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో అందించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
