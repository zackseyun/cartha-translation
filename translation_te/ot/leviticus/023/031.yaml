  text: כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹֽשְׁבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: te
  text: మీరు ఏ పనీ చేయకూడదు. మీ తరతరాలన్నిటిలో, మీ నివాసస్థలాలన్నిటిలో ఇది శాశ్వతమైన శాసనం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎల్లకాలం ఉండే శాసనం” లేదా “నిరంతరమైన శాసనం.” ఇక్కడి హీబ్రూ పదం దీర్ఘకాలం కొనసాగేదాన్ని లేదా శాశ్వతమైనదాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: మీరు ఏ పనీ చేయకూడదు
  rationale: כָּל మְלָאכָה అనే సమగ్ర పదబంధం, నిషేధార్థక לֹא תַעֲשׂוּతో కలిసి, ఎలాంటి పనినీ చేయరాదనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఏ పనీ చేయకూడదు’ సహజంగా, స్పష్టంగా న్యాయపరమైన నిషేధాన్ని వ్యక్తం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: חֻקָּה స్థిరంగా నిర్దేశించిన శాసనాన్ని సూచిస్తుంది; עוֹלָם దీర్ఘకాలికమైన లేదా నిరంతరమైన వ్యవధిని సూచించగలదు. ‘శాశ్వతమైన శాసనం’ మూలంలోని బలాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే రూపం.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: ఈ పదం వరుసగా వచ్చే తరాలన్నిటికీ వర్తించే కొనసాగింపును సూచిస్తుంది. ‘మీ తరతరాలకు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రదేశాలన్నిటిలో
  rationale: מוֹשָׁב నివాసస్థలాన్ని లేదా స్థిరనివాస ప్రాంతాన్ని సూచిస్తుంది. ‘మీరు నివసించే ప్రదేశాలన్నిటిలో’ అనే రూపం స్థలపరమైన సమగ్రతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరాధనాసంబంధమైన ధర్మశాసనంలో עוֹלָם సూచించే వ్యవధి
  choice: శాశ్వతమైన శాసనం
  alternative: ఎల్లకాలం ఉండే శాసనం / నిరంతరం పాటించవలసిన శాసనం
  rationale: עוֹלָם కొనసాగుతూ ఉండే లేదా శాశ్వతమైన కాలాన్ని సూచించగలదు. ‘శాశ్వతమైన’ అనే పదం వాక్యంలోని న్యాయపరమైన గంభీరతను కాపాడుతుంది; అయితే దాని కాలవ్యాప్తిని తాత్త్వికంగా అతిగా నిర్వచించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, నిషేధం మరియు దాని శాశ్వత నియమస్థితి సహజంగా వినిపించేలా అమర్చబడ్డాయి.
