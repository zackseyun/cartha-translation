    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: וַיְדַבֵּר కొత్త దైవిక ప్రసంగాన్ని కథనక్రమంలో పరిచయం చేస్తుంది. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘మోషేతో ఇలా చెప్పాడు’ అనే ప్రయోగం సహజంగా ఉండి, తరువాత వచ్చే మాటలకు స్పష్టమైన పరిచయంగా పనిచేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే వ్యక్తి ఎవరిని ఉద్దేశించాడో తెలిపే אֶלను ఆధునిక తెలుగులో సహజమైన ‘తో’తో అనువదించాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: మֹשֶׁה అనే వ్యక్తినామానికి ఆధునిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం ‘మోషే’.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత ప్రత్యక్షంగా చెప్పబోయే విషయాన్ని పరిచయం చేసే לֵאמֹר భావాన్ని తెలుగులో సహజమైన ‘ఇలా’ ద్వారా వ్యక్తం చేశాం; వాక్యాంతంలోని ద్విబిందువు ఆ మాటలు తరువాతి వచనంలో కొనసాగుతాయని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం. హీబ్రూ నామం యొక్క ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే దైవిక ప్రసంగ పరిచయ సూత్రం. మూలంలోని వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని కార్యాన్ని నిలుపుకున్నాం.
