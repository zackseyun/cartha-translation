- from: ఎందుకంటే, ఈ రోజున తనను తాను తగ్గించుకోని ప్రతి వ్యక్తీ తన ప్రజల్లోనుండి కొట్టివేయబడతాడు.[a]
  to: ఎందుకంటే, ఈ రోజుననే తన్ను తాను దీనపరచుకోని ప్రతి వ్యక్తి తన ప్రజలలోనుండి కొట్టివేయబడతాడు.[a]
  rationale: The revision adds 'ఈ రోజుననే' to retain the emphasis of בְּעֶצֶם and replaces the potentially vague 'తగ్గించుకోని' with 'దీనపరచుకోని,' which better expresses the Hebrew self-humbling/self-affliction idiom while leaving the more formal literal alternative in the footnote. The legal formula 'కొట్టివేయబడతాడు' is retained so that the nature of the sanction remains unresolved, as in the source.
