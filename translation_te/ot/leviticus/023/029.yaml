id: LEV.23.29
reference: Leviticus 23:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: te
  text: ఎందుకంటే, ఈ రోజుననే తన్ను తాను దీనపరచుకోని ప్రతి వ్యక్తి తన ప్రజలలోనుండి కొట్టివేయబడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన్ను తాను బాధించుకోని.” ఈ హీబ్రూ పదబంధం స్వీయనిగ్రహాన్ని లేదా తనను తాను దీనపరచుకోవడాన్ని సూచిస్తుంది; సంప్రదాయంగా ఇది ఉపవాసంతో అనుసంధానించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు న్యాయవాక్య ప్రవాహంలో సహజంగా ఉంటుంది.
- source_word: כָל הַנֶּפֶשׁ
  choice: ప్రతి వ్యక్తీ
  rationale: נֶפֶשׁ ఇక్కడ సాంకేతిక అర్థంలో ‘ఆత్మ’ను కాక, ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: తనను తాను తగ్గించుకోని
  rationale: ప్రాయశ్చిత్త దిన సందర్భంలో ఈ రూపం స్వీయనిగ్రహం, ఉపవాసం, పశ్చాత్తాపపూర్వక వినయాన్ని సూచించగలదు. ‘తగ్గించుకోని’ అనేది శారీరక బాధకు మాత్రమే పరిమితం చేయకుండా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ఈ రోజున
  rationale: ఈ సందర్భంలో ‘ఈ రోజునే’ అనే బలాన్ని కూడా వ్యక్తపరచవచ్చు; అయితే తెలుగు వాక్యంలో ‘ఈ రోజున’ సందర్భసహజంగా ఉంది.
- source_word: וְנִכְרְתָה
  choice: కొట్టివేయబడతాడు
  rationale: నిబంధన సంబంధమైన న్యాయపదబంధం యొక్క తీవ్రతను నిలుపుతూ, శిక్ష అమలు విధానాన్ని నిర్దిష్టంగా నిర్ణయించదు.
- source_word: מֵעַמֶּיהָ
  choice: తన ప్రజల్లోనుండి
  rationale: స్త్రీలింగ ప్రత్యయం వ్యాకరణపరంగా נֶפֶשׁతో ఏకీభవిస్తుంది; సూచన మాత్రం సాధారణ వ్యక్తికే. ‘తన’ లింగనిరపేక్షంగా సహజంగా ఉంది.
theological_decisions:
- issue: ప్రాయశ్చిత్త దినాన ‘తన్ను బాధించుకోవడం/తగ్గించుకోవడం’ అనే ఆజ్ఞ భావం
  choice: ప్రధాన పాఠ్యంలో ‘తనను తాను తగ్గించుకోని’
  alternative: తనను తాను బాధించుకోని; స్వీయనిగ్రహం పాటించని
  rationale: హీబ్రూ పదబంధం పశ్చాత్తాపం, ఉపవాసం, స్వీయనిగ్రహంతో సంబంధమున్న స్వీయదీనతను సూచిస్తుంది. ప్రధాన పాఠ్యం ఆ భంగిమను తెలియజేస్తుంది; మరింత శాబ్దిక ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- issue: ‘కొట్టివేయబడటం’ అనే శిక్ష స్వభావం
  choice: శిక్ష విధానాన్ని వివరించకుండా న్యాయసూత్రాన్ని అలాగే ఉంచడం
  alternative: బహిష్కరించబడతాడు; తొలగించబడతాడు
  rationale: ఇక్కడ హీబ్రూ పదం మరణం, సమాజం నుండి బహిష్కరణ, లేక దేవుని ప్రత్యక్ష తీర్పు—వీటిలో ఏదో ఒకదాన్ని స్పష్టంగా నిర్దేశించదు. అందువల్ల అసలు పాఠ్యంలోని ఉద్వేగం, అనిశ్చితి నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర సంబంధమైన గంభీరతను నిలుపుతూ అనువదించబడింది. లింగనిరపేక్ష ‘తన’ వాడబడింది.
