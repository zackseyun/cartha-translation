id: LEV.23.12
reference: Leviticus 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: te
  text: మీరు ఆ ధాన్యపు కట్టను[a] ఊపే రోజున, యాహ్వేకు దహనబలిగా లోపంలేని, ఒక సంవత్సరం వయసున్న మగ గొర్రెపిల్లను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓమెరును”; ఇక్కడ ఈ పదం కేవలం ధాన్యం కొలిచే కొలతను కాకుండా అర్పణ ఆచారంలో సమర్పించే ధాన్యపు కట్టను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: అర్పించాలి
  rationale: עשה అనే క్రియకు సాధారణంగా ‘చేయడం’ అనే అర్థం ఉన్నా, బలి సందర్భంలో బలిని సిద్ధం చేసి అర్పించడాన్ని సూచిస్తుంది.
- source_word: בְּיוֹם הֲנִיפְכֶם
  choice: మీరు ... ఊపే రోజున
  rationale: נוף హిఫిల్ రూపం యెహోవా సన్నిధిలో చేసే ఆచారపరమైన ఊపే చర్యను సూచిస్తుంది; తెలుగు వాక్యంలో సహజమైన కాలసూచనగా అనువదించబడింది.
- source_word: הָעֹמֶר
  choice: ఆ పనను
  rationale: ఈ కోత సందర్భంలో עֹמֶר పొడి కొలతకన్నా అర్పణ ఆచారంలో సమర్పించే ధాన్యపు పనను సూచించే అవకాశం ఎక్కువ.
- source_word: כֶּבֶשׂ
  choice: మగ గొర్రెపిల్లను
  rationale: כֶּבֶשׂ గొర్రెపిల్లను సూచిస్తుంది; బలి సందర్భంలో హెబ్రీ పదం సూచించే లింగాన్ని ‘మగ’ అని స్పష్టం చేయడం సముచితం.
- source_word: תָּמִים
  choice: లోపంలేని
  rationale: బలి నియమాలలో תמים శారీరక దోషం లేదా లోపం లేనిదని సూచిస్తుంది.
- source_word: בֶּן שְׁנָתוֹ
  choice: ఒక సంవత్సరం వయసున్న
  rationale: హెబ్రీ వయస్సు ప్రయోగాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే ప్రత్యేక బలి రకానికి సాంకేతిక పదం; ‘దహనబలి’ దాని ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: יהוה అనే దైవనామాన్ని పేరుగానే నిలుపుతూ, לְ ఉపసర్గ సూచించే బలి గ్రహీతను ‘కు’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’.
- issue: עֹמֶר యొక్క సందర్భార్థం
  choice: పన
  alternative: ఓమెరు అనే కొలత
  rationale: ఈ పంట అర్పణ ఆచారంలో ఊపబడేది ధాన్యపు పనగా అర్థమవుతుంది; అయితే అదే పదం కొలతకు కూడా వాడబడే కారణంగా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. బలి సంబంధ సాంకేతికత కోసం ‘దహనబలి’, ఆచార చర్య కోసం ‘ఊపడం’ అనే పదాలను నిలిపాం.
