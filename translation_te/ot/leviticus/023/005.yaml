source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: te
  text: మొదటి నెలలో, ఆ నెల పద్నాలుగవ రోజున, సంధ్యవేళలో[a], యాహ్వేకు పస్కా[b] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రెండు సాయంకాలాల మధ్య’; ఇది సూర్యాస్తమయం చుట్టూ ఉన్న సంధ్యాకాలాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పస్కా అర్పణ’ / ‘పస్కా బలి.’
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: ఆరాధనా పంచాంగ సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; הָרִאשׁוֹן దానిని మొదటి నెలగా నిర్దిష్టం చేస్తుంది.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: ఆ నెల పద్నాలుగవ రోజున
  rationale: హీబ్రూ తేదీ చెప్పే విధానాన్ని సహజమైన తెలుగులో స్పష్టంగా అందించడానికి ‘రోజు’ను వ్యక్తం చేశాం.
- source_word: בֵּין הָעַרְבָּיִם
  choice: సంధ్యవేళలో
  rationale: అక్షరార్థంగా ‘రెండు సాయంకాలాల మధ్య’ అనే ఈ హీబ్రూ నుడికారం సూర్యాస్తమయం చుట్టూ ఉన్న సంధ్యాకాలాన్ని సూచిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: פֶּסַח
  choice: పస్కా
  rationale: ఈ పదం పస్కా ఆచరణను గానీ, దాని బలిని గానీ సూచించగలదు. ప్రధాన పాఠంలో విస్తృతార్థమున్న సంప్రదాయ పదం ‘పస్కా’ను ఉంచి, బలి భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ సమర్పణ లేదా ఉద్దేశాన్ని సూచిస్తుంది; దేవుని ఒడంబడిక నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, విభక్తిని సహజమైన తెలుగులో జోడించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా అందించాం.
- issue: ఆరాధనా సందర్భంలో פֶּסַח భావం
  choice: పస్కా
  alternative: పస్కా అర్పణ; పస్కా బలి
  rationale: ఈ పదం పండుగ/ఆచరణతో పాటు బలి లేదా బలిపశువును కూడా సూచించగలదు. ప్రధాన పాఠం ఆ సందిగ్ధతను సంకుచితం చేయకుండా విస్తృతమైన ‘పస్కా’ను ఉంచుతుంది; బలి భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- issue: క్రియలేని హీబ్రూ వాక్యాన్ని తెలుగులో వ్యక్తీకరించడం
  choice: ఉంటుంది
  alternative: యాహ్వేకు పస్కా
  rationale: హీబ్రూలో క్రియ లేకపోయినా వాక్యార్థం ఉనికి/నిర్ణీత సందర్భాన్ని తెలియజేస్తుంది. తెలుగులో సంపూర్ణంగా, సహజంగా ఉండేందుకు ‘ఉంటుంది’ను చేర్చాం; ‘ఆచరించాలి’ వంటి ఆజ్ఞార్థాన్ని మాత్రం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. తేదీ నిర్మాణాన్ని స్పష్టంగా ఉంచి, సంధ్యా సమయ నుడికారాన్నీ פֶּסַח పదంలోని ఆచరణ/బలి ద్వంద్వార్థాన్నీ పాదటిప్పణుల్లో సంరక్షించాం.
