  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: te
  text: అది మీకు సంపూర్ణ విశ్రాంతి కలిగిన సబ్బాతు. మీరు మిమ్మల్ని మీరు అణచుకోవాలి[a]. నెల తొమ్మిదో రోజు సాయంత్రం మొదలుకొని, ఒక సాయంత్రం నుండి మరుసటి సాయంత్రం వరకు[b] మీరు మీ సబ్బాతును ఆచరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని మీరు బాధపరచుకోవాలి,’ ‘మిమ్మల్ని మీరు తగ్గించుకోవాలి.’ ఈ హీబ్రూ నుడికారం పశ్చాత్తాపపూర్వక ఆచరణలో తనను తాను అణచుకోవడాన్ని సూచిస్తుంది; సంప్రదాయంగా దీనికి ఉపవాసంతో సంబంధం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సాయంత్రం నుండి సాయంత్రం వరకు.’ ఇది ఇశ్రాయేలీయుల దినగణన ప్రకారం ఆచరణ కాలాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి సబ్బాతు
  rationale: జతగా వచ్చిన నామవాచకాలు పని మానడం, పూర్తిగా విశ్రమించడం అనే భావాన్ని బలపరుస్తాయి. ఈ రూపం ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు బాధించుకోవాలి
  rationale: ప్రాయశ్చిత్త దిన ఆచార సందర్భంలో ఈ హీబ్రూ పదబంధం ఉపవాసంతో సంబంధమున్న స్వీయ బాధను లేదా తనను తాను తగ్గించుకోవడాన్ని సూచించవచ్చు. అయితే మూలపాఠం ఉపవాసం అని నేరుగా చెప్పనందున విస్తృత భావాన్నే ప్రధాన పాఠంలో ఉంచాం.
- source_word: נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు
  rationale: ఇక్కడ נֶפֶשׁ ఒక ప్రత్యేకమైన దేహరహిత ‘ఆత్మ’ను సూచించడం కంటే ఆత్మవాచకంగా మొత్తం వ్యక్తిని సూచిస్తుంది.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: నెల తొమ్మిదో రోజు సాయంత్రం మొదలుకొని
  rationale: ఆచరణ తొమ్మిదో రోజు సాయంత్రం ప్రారంభమై ఇశ్రాయేలీయుల దినగణన ప్రకారం పదో రోజులో కొనసాగుతుందని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: ఒక సాయంత్రం నుండి మరుసటి సాయంత్రం వరకు
  rationale: మూలంలోని ‘సాయంత్రం నుండి సాయంత్రం వరకు’ అనే కాలపరిమితిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘సూర్యాస్తమయం’ అని మూలంలో లేని ప్రత్యేకీకరణ చేయదు.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: మీరు మీ సబ్బాతును ఆచరించాలి
  rationale: క్రియకు పని మానడం లేదా విశ్రమించడం అనే మూలార్థం ఉన్నా, ‘మీ సబ్బాతు’తో కలిసినప్పుడు సబ్బాతు విశ్రాంతిని పాటించడం అనే సహజ భావం వస్తుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో స్వీయ బాధ యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘మిమ్మల్ని మీరు బాధించుకోవాలి’ అనే విస్తృత ఆజ్ఞను నిలుపడం
  alternative: ‘మీరు ఉపవాసం ఉండాలి’ లేదా ‘మిమ్మల్ని మీరు తగ్గించుకోవాలి’
  rationale: ఈ సందర్భంలో ఉపవాసం భావంలో ఉండవచ్చు, కాని హీబ్రూ వాక్యం దానిని నేరుగా పేర్కొనదు. అందువల్ల ఆజ్ఞను ఉపవాసానికే పరిమితం చేయకుండా మూలంలోని భావ విస్తృతిని, సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘సబ్బాతు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, దాని తీవ్ర విశ్రాంతి భావాన్ని ‘సంపూర్ణ విశ్రాంతి’తో స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
