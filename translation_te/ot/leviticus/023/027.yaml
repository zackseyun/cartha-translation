revisions:
- from: అయితే ఈ ఏడవ నెల పదో రోజున ప్రాయశ్చిత్తాల దినం[a]. అది మీకు పవిత్ర సభగా ఉండాలి. మీరు మిమ్మల్ని మీరు బాధించుకొని[b], యెహోవాకు అగ్ని అర్పణను అర్పించాలి[c].
  to: అయితే ఈ ఏడవ నెల పదో రోజున ప్రాయశ్చిత్తాల దినం[a] ఉంటుంది. అది మీకు పవిత్ర సభగా ఉండాలి. మీరు మిమ్మల్ని మీరు శ్రమపరచుకోవాలి[b], యెహోవాకు అగ్ని అర్పణ సమర్పించాలి[c].
