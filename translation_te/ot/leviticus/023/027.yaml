source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: te
  text: అయితే ఈ ఏడవ నెల పదో రోజున ప్రాయశ్చిత్తాల దినం[a] ఉంటుంది. అది మీకు పవిత్ర సభగా ఉండాలి. మీరు మిమ్మల్ని మీరు శ్రమపరచుకోవాలి[b], యెహోవాకు అగ్ని అర్పణ సమర్పించాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ప్రాయశ్చిత్తాల దినం’; సాధారణంగా ‘ప్రాయశ్చిత్త దినం’ అని అంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మిమ్మల్ని మీరు అణచుకోవాలి’; ‘స్వీయనిరాకరణ పాటించాలి.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, అగ్నిచేత సమర్పించే అర్పణ; దీన్ని ‘ఆహార అర్పణ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందున్న పండుగ ఆదేశాల నుంచి ప్రత్యేకమైన, ఉద్ఘాటనతో కూడిన మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ఈ ఏడవ నెల పదో రోజున
  rationale: హీబ్రూ కాలసూచనను, అందులోని ‘ఈ’ అనే నిర్దేశక పదంతో సహా, సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: יוֹם הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్తాల దినం
  rationale: כִּפֻּרִים రూపపరంగా బహువచనం; మూలంలోని ఈ లక్షణాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: అధికారికంగా పిలిచిన ఆరాధనా సమాజాన్ని సూచించే యాజక సంబంధ సాంకేతిక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: మీరు మిమ్మల్ని మీరు బాధించుకొని
  rationale: ఉపవాసం అనే ఒక్క ఆచారానికే భావాన్ని పరిమితం చేయకుండా, స్వీయ నిరాకరణ మరియు వినయపూర్వకమైన దుఃఖం కలిగిన హీబ్రూ ప్రయోగ విస్తృతిని నిలుపుతుంది.
- source_word: וְהִקְרַבְתֶּם
  choice: అర్పించాలి
  rationale: బలి సందర్భంలో సమర్పించడం అనే హిఫీల్ క్రియ భావాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: అగ్నిపై సమర్పించి పొగగా పైకి లేపే అర్పణను సూచించే పదానికి మూలరూపానికి దగ్గరగా ఉన్న అనువాదం; ‘ఆహార అర్పణ’ అనే వివరణాత్మక అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוהను దాని పేరుస్వరూపాన్ని నిలిపే సాధారణ తెలుగు రూపంతో అందిస్తుంది.
theological_decisions:
- issue: పండుగ పేరులోని హీబ్రూ బహువచనం
  choice: ప్రాయశ్చిత్తాల దినం
  alternative: ప్రాయశ్చిత్త దినం
  rationale: సంప్రదాయ ఏకవచన పేరు తెలుగులో సహజమైనదైనా, హీబ్రూ כִּפֻּרִים బహువచనాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది; పరిచితమైన రూపాన్ని పాదటిప్పణి ఇస్తుంది.
- issue: ఆ దినాన స్వీయ బాధకు సంబంధించిన ఆజ్ఞ అర్థం
  choice: మీరు మిమ్మల్ని మీరు బాధించుకొని
  alternative: మిమ్మల్ని మీరు తగ్గించుకొని / మిమ్మల్ని మీరు నిరాకరించుకొని
  rationale: ఈ ఆజ్ఞను కేవలం ఉపవాసానికి గానీ, కేవలం అంతరంగ వినయానికి గానీ పరిమితం చేయకుండా హీబ్రూ ప్రయోగంలోని ఆచారపరమైన, పశ్చాత్తాప సంబంధమైన విస్తృతిని కాపాడుతుంది.
- issue: אִשֶּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదం అగ్నితో పొగగా మార్చబడే అర్పణను సూచిస్తుంది; ‘ఆహార అర్పణ’ యాజక సంబంధ రూపకాన్ని వివరించినా, ప్రధాన పాఠ్యంలో అగ్ని సంబంధాన్ని బహిర్గతంగా ఉంచడం తక్కువ వ్యాఖ్యాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలి. ‘పవిత్ర సభ’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి ఆరాధనా సాంకేతిక భావాన్ని నిలుపుతుంది. పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
