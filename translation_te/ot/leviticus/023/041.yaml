id: LEV.23.41
reference: Leviticus 23:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: te
  text: మీరు దానిని ప్రతి సంవత్సరం ఏడు రోజులపాటు యాహ్వేకు పండుగగా జరుపుకోవాలి. ఇది మీ తరతరాలంతటికీ శాశ్వతమైన నియమం[a]. ఏడవ నెలలో మీరు దానిని జరుపుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎల్లకాలం ఉండే నియమం’ లేదా ‘నిత్యమైన నియమం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: జరుపుకోవాలి
  rationale: חגג అనే క్రియ పండుగను ఆచరించడం లేదా ఉత్సవంగా జరుపుకోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘జరుపుకోవాలి’ సహజంగా ఉండి, వచనంలోని క్రియ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: ఈ సర్వనామం సందర్భంలో ముందుగా చెప్పబడిన పండుగను సూచిస్తుంది; మూలంలో లేని నామవాచకాన్ని మళ్లీ చేర్చకుండా సర్వనామ రూపాన్ని నిలిపింది.
- source_word: חַג
  choice: పండుగ
  rationale: חַג అనేది, చాలాసార్లు యాత్రతో సంబంధమున్న, మతపరమైన ఉత్సవాన్ని సూచిస్తుంది. ‘పండుగ’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל ఉపసర్గ సమర్పణ లేదా గౌరవార్థక దిశను సూచిస్తుంది. ‘యాహ్వేకు’ అనే రూపం పండుగ ఆయన గౌరవార్థం జరుపబడుతుందని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: పండుగ కొనసాగే కాలవ్యవధిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׁנָה
  choice: సంవత్సరంలో
  rationale: హీబ్రూ పదబంధంలోని ‘సంవత్సరంలో’ అనే రూపాన్ని దగ్గరగా నిలుపుతూ, ఇది ఏటా జరిగే ఆచారమని సందర్భం తెలియజేయనిస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: חֻקָּה నిర్దేశిత శాసనాన్ని, עוֹלָם నిరంతరంగా కొనసాగే స్థిరత్వాన్ని సూచిస్తాయి. ‘శాశ్వతమైన శాసనం’ మూలంలోని బలమైన కాలవ్యాప్తిని నిలుపుతుంది; దాని ఖచ్చిత పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: తదుపరి తరాలన్నిటికీ వర్తించే కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: పండుగ జరపవలసిన సమయాన్ని తెలిపే మూలంలోని సరళ కాలపదబంధానికి నేరమైన అనువాదం.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: ఆరాధనా శాసనంలో עוֹלָם పదం యొక్క కాలబలం
  choice: శాశ్వతమైన శాసనం
  alternative: నిత్యమైన శాసనం; ఎల్లకాలం ఉండే శాసనం
  rationale: ఈ పదం దీర్ఘకాలికమైన, తరతరాలకు కొనసాగే బంధక స్వభావాన్ని సూచిస్తుంది; అయితే తాత్త్వికంగా అంతులేని కాలం గురించిన నిర్ణయాన్ని తప్పనిసరిగా విధించదు. ప్రధాన పాఠం బలమైన మూలభావాన్ని ఉంచి, పాదసూచిక సాధ్యమైన భావపరిధిని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. ఆజ్ఞార్థక భావానికి ‘జరుపుకోవాలి’ రూపాన్ని ఎంచుకుని, హీబ్రూ వచనంలోని పునరుక్తిని నిలిపాం. దైవనామాన్ని ‘యాహ్వే’గా ఉంచాం.
