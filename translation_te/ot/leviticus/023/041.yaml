    rationale: Although it reflects the Hebrew wording closely, in this festival context בַּשָּׁנָה denotes annual observance. ‘ప్రతి సంవత్సరం’ communicates this intended temporal sense naturally.
  - severity: low
    issue: The generational phrase can be made more idiomatic.
    rationale: ‘మీ తరతరాలంతటికీ’ clearly conveys continuing applicability across successive generations and fits the legal register.
  revised_text: మీరు దానిని ప్రతి సంవత్సరం ఏడు రోజులపాటు యాహ్వేకు పండుగగా జరుపుకోవాలి. ఇది మీ తరతరాలంతటికీ శాశ్వతమైన నియమం[a]. ఏడవ నెలలో మీరు దానిని జరుపుకోవాలి.
