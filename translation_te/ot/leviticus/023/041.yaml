  terminology: యాహ్వే appropriately represents יהוה. ‘నియమం’ is a natural modern Telugu equivalent for the prescribed legal force of חֻקָּה; ‘శాశ్వతమైన’ retains the source’s enduring-force language, while the footnote preserves viable alternatives.
  issues:
