  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: דבר అనే క్రియ ఇక్కడ దైవవాక్యాన్ని పరిచయం చేసే సూత్రప్రాయ కథన రూపంలో ఉంది. తెలుగులో ‘మాట్లాడాడు’ కంటే ‘చెప్పాడు’ తరువాత వచ్చే సందేశానికి సహజమైన పరిచయంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే వ్యక్తిని సూచించే אֶל‌కు తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ సరిపోతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిల్ రూపమైన ‘మోషే’గా ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత ప్రత్యక్ష వాక్యం వస్తుందని సూచించే హీబ్రూ సూత్రపదాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పాడు:’ అనే నిర్మాణంలో వ్యక్తపరిచాం; ‘అంటూ’ అని పదేపదే అనువదించడం ఇక్కడ అసహజంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన దైవవాక్య పరిచయ సూత్రం. తదుపరి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు ద్విబిందువు వాడబడింది.
