id: LEV.23.2
reference: Leviticus 23:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[c] మాట్లాడి, వారితో చెప్పు: యాహ్వే నియమిత కాలాలను[a] మీరు పవిత్ర సమావేశాలుగా[b] ప్రకటించాలి; ఇవే నా నియమిత కాలాలు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నియమిత పండుగలు” లేదా “ఉత్సవాలు” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం విందులకు మాత్రమే కాకుండా నిర్ణయించబడిన పవిత్ర సందర్భాలన్నిటినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “పవిత్ర సమాహారాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “ఇశ్రాయేలు కుమారులు” అనేది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సాంప్రదాయ ఒడంబడిక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: మాట్లాడు
  rationale: పీయేల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరార్థమైన, ఒడంబడిక ప్రజలను సమష్టిగా సూచించే హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్ని నిలుపుతుంది.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: హీబ్రూలోని వరుస ఆజ్ఞల లయను, తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: నియమిత కాలాలు / నా నియమిత కాలాలు
  rationale: מוֹעֵד అనే పదం విందులకే పరిమితం కాకుండా నిర్ణయించబడిన పవిత్ర సందర్భాలను సూచిస్తుంది; తరువాతి వచనంలోని విశ్రాంతిదినాన్నీ చేర్చగల విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో విస్తృతంగా స్థిరపడిన విధంగా దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: మీరు ... ప్రకటించవలసిన
  rationale: ఇక్కడ קרא బహిరంగంగా ప్రకటించడం లేదా నిర్ణీతంగా తెలియజేయడం అనే ఆరాధనా సందర్భార్థాన్ని కలిగి ఉంది.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: పవిత్ర సమావేశాలు
  rationale: పవిత్ర ఉద్దేశంతో పిలువబడిన ప్రజా సమాహారాలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלֶּה הֵם
  choice: ఇవే
  rationale: సూచక సర్వనామం మరియు సర్వనామంతో కూడిన హీబ్రూ నొక్కిచెప్పే నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా అనే ఒడంబడిక నామం యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవ నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని ఉపయోగిస్తుంది; హీబ్రూ స్వరనిర్ణయం పూర్తిగా నిశ్చితం కాదనే అంశాన్ని గమనికలో తెలియజేస్తుంది.
- issue: מוֹעֵד పదాన్ని ‘పండుగలు’గా పరిమితం చేయాలా
  choice: నియమిత కాలాలు
  alternative: నియమిత పండుగలు
  rationale: ఈ అధ్యాయం విశ్రాంతిదినాన్నీ చేర్చుతుంది కాబట్టి, విస్తృతమైన కాలసూచక అర్థం మూలపాఠ పరిధిని మెరుగ్గా కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని పుంలింగ రూపాన్ని నిలుపాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ రూపాన్ని నిలుపుతూ, అది ఇశ్రాయేలు ఒడంబడిక ప్రజలను సమష్టిగా సూచించే సాంప్రదాయ వ్యక్తీకరణ అని గమనిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గంభీరతతో. మూలపాఠ క్రమం, చివరి నొక్కిచెప్పడం, విస్తృతమైన מוֹעֵד అర్థం నిలుపబడ్డాయి. అన్ని గమనిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
