id: LEV.23.13
reference: Leviticus 23:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: te
  text: దాని ధాన్యార్పణం నూనెతో కలిపిన మెత్తని పిండి—ఏఫాలో రెండు పదోవంతులు—ఉండాలి; అది యెహోవాకు అగ్నియాగం, ఇంపైన సువాసన. దాని పానార్పణం పావు హీను ద్రాక్షామద్యం ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: దానికి అర్పించే ధాన్యార్పణం
  rationale: బలి సందర్భంలో מִנְחָה ధాన్యార్పణాన్ని సూచిస్తుంది; 3ms ప్రత్యయం ముందటి వచనంలోని గొర్రెపిల్లను సూచిస్తున్నందున సహజమైన తెలుగులో ‘దానికి అర్పించే’ అని ఇచ్చాం.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతుల ఏఫా
  rationale: మూలంలో ‘రెండు పదోవంతులు’ అని ఉంది; యాజక ధర్మశాస్త్రంలో ఇది ఏఫాలో పదోవంతుల కొలత. అంతర్లీన కొలమానాన్ని స్పష్టం చేశాం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: అర్పణలకు ఉపయోగించే శుద్ధమైన, సన్నగా చేసిన పిండిని సూచించే ఆచారపదానికి సహజమైన తెలుగు సమానం.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నూనెతో పిండి కలపబడిన స్థితిని మూలంలోని కర్మణి భావానికి అనుగుణంగా తెలిపింది.
- source_word: אִשֶּׁה לַיהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణం
  rationale: אִשֶּׁה అగ్నిద్వారా సమర్పించే ఆచార అర్పణాన్ని సూచిస్తుంది. ‘ఆహారార్పణం’ కంటే మూలంలోని అగ్ని భావాన్ని ప్రత్యక్షంగా నిలిపాం.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: దేవునికి ఆమోదకరమైన బలి సువాసనను తెలిపే స్థిర ఆచారవ్యక్తీకరణ; రూపకాన్ని పరిష్కరించకుండా సహజమైన తెలుగులో నిలిపింది.
- source_word: וְנִסְכֹּה
  choice: దానితో అర్పించే పానార్పణం
  rationale: נֶסֶךְ తోడుగా పోసే ద్రవార్పణం; ప్రత్యయం బలిపశువును సూచిస్తుంది. ‘పానార్పణం’ సంక్షిప్తమైన, పారదర్శకమైన ఆచారపదం.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: יַיִן ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు శైలిలో ‘ద్రాక్షారసం’ సహజంగా అర్థమవుతుంది.
- source_word: רְבִיעִת הַהִין
  choice: పావు హీను
  rationale: ప్రాచీన ద్రవ కొలమానం ‘హీను’ను నిలిపి, నాలుగో వంతును సహజంగా ‘పావు’ అని తెలిపాం.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: אִשֶּׁה యొక్క ఆచారార్థం
  choice: అగ్నితో అర్పించే అర్పణం
  alternative: ఆహారార్పణం
  rationale: ఈ పదం అగ్నిపై సమర్పించే అర్పణానికి సాంకేతిక ఆచారపదం. ‘ఆహారార్పణం’ సాధ్యమైన సందర్భార్థమైనప్పటికీ, అగ్ని అంశాన్ని స్పష్టంగా ఉంచడం మూలానికి దగ్గరగా ఉంది.
- issue: רֵיחַ נִיחֹחַ లోని దేవునికి ఇంపైన సువాసన రూపకం
  choice: ఇంపైన సువాసన
  alternative: ఆమోదకరమైన అర్పణం
  rationale: మూలంలోని ఇంద్రియాత్మక, ఆచార రూపకాన్ని ధార్మిక వివరణగా మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన ఆచారశైలి. ప్రాచీన కొలమానాలైన ఏఫా, హీను పేర్లను నిలిపాం. వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడు సులభంగా అనుసరించేలా రెండు వాక్యాలుగా ఇచ్చాం.
