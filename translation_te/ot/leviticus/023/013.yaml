revisions:
- from: దానికి అర్పించే ధాన్యార్పణం నూనెతో కలిపిన మెత్తని పిండిలో రెండు పదోవంతుల ఏఫా ఉండాలి. అది యెహోవాకు అగ్నితో అర్పించే అర్పణం, ఇంపైన సువాసన. దానితో అర్పించే పానార్పణం పావు హీను ద్రాక్షారసం ఉండాలి.
  to: దాని ధాన్యార్పణం నూనెతో కలిపిన మెత్తని పిండి—ఏఫాలో రెండు పదోవంతులు—ఉండాలి; అది యెహోవాకు అగ్నియాగం, ఇంపైన సువాసన. దాని పానార్పణం పావు హీను ద్రాక్షామద్యం ఉండాలి.
  rationale: The revision restores the Hebrew word order and measure relationship, renders יַיִן unambiguously as wine, and improves the naturalness of the technical sacrificial expression without adding theological interpretation. No footnote is necessary because the Telugu rendering does not depend on an unresolved textual or lexical ambiguity.
