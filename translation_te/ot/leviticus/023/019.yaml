id: LEV.23.19
reference: Leviticus 23:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: te
  text: మీరు పాపబలిగా[a] ఒక మగ మేకను, సమాధాన బలుల కోసం[b] ఒక సంవత్సరం వయసున్న రెండు మగ గొర్రెపిల్లలను అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలిగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సహవాస బలుల కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: మీరు ... అర్పించాలి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చేయాలి’ అని ఉన్నా, నిర్దిష్ట జంతువులు మరియు బలి రకాల సందర్భంలో ‘అర్పించాలి’ అనేది సహజంగా ఆ ఆచారార్థాన్ని తెలియజేస్తుంది.
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: ఒక మగ మేకను
  rationale: మేక మగదని తెలిపే మూలపదబంధాన్నీ, ‘ఒకటి’ అనే సంఖ్యనూ స్పష్టంగా నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: లేవీయకాండంలోని బలి సందర్భంలో חטאת సూచించే స్థిరమైన బలి వర్గాన్ని సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; ‘శుద్ధీకరణ బలి’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: రెండు మగ గొర్రెపిల్లలను
  rationale: సంఖ్యను నిలుపుతూ, ఈ బలి సందర్భంలో జంతువుల లింగ సూచనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי שָׁנָה
  choice: ఏడాది వయసున్న
  rationale: ఒక సంవత్సరం వయసుగల జంతువులను సూచించే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְזֶבַח שְׁלָמִים
  choice: సమాధాన బలుల కోసం
  rationale: שְׁלָמִים అనే బలి వర్గాన్ని మూలానికి దగ్గరగా ‘సమాధాన బలులు’గా ఇస్తూ, బహువచనాన్ని నిలుపుతుంది; ‘సహవాస బలులు’ అనే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: బలి ధర్మశాస్త్రంలో חטאת పదం అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమున్న బలినీ, శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచితమైన రూపాన్ని వాడి, ఆ భావపరిధిని సంకుచితం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: שְׁלָמִים పదం అనువాదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: ‘సమాధాన బలులు’ మూలపదంతో ఉన్న శాంతి/సంపూర్ణత సంబంధాన్ని నిలుపుతుంది; ‘సహవాస బలులు’ బలిలో భాగస్వామ్యాన్ని ముందుకు తెచ్చే వ్యాఖ్యానాత్మక అనువాదం కాబట్టి పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఆచార సంబంధ పదాలకు స్థిరత్వం కల్పిస్తూ, మూలంలోని బహువచనాన్నీ జంతువుల వివరాలనూ నిలిపాం. పాదసూచిక సూచికలు సంబంధిత పదబంధాల వెంటనే ఉంచాం.
