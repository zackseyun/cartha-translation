lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనే క్రియ ఇక్కడ కొత్త దైవిక ప్రసంగాన్ని ప్రారంభించే సూత్రప్రాయ నిర్మాణంలో ఉంది. తరువాత לֵאמֹר కూడా ఉన్నందున, తెలుగులో సహజంగా పునరుక్తి లేకుండా ‘ఇలా అన్నాడు’ అని అనువదించడం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడటానికి సంబంధించిన వ్యక్తిని సూచించే אֶלను ఆధునిక తెలుగులో సహజమైన ‘తో’ విభక్తి ద్వారా వ్యక్తపరిచాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: משה అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ‘మోషే’ను వాడాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹרను తెలుగులో సహజమైన ‘ఇలా’గా వ్యక్తపరిచాం; ‘చెప్పుతూ’ అని వాడితే ముందున్న మాటల క్రియతో అనవసర పునరుక్తి కలుగుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించాం. ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ సూత్రప్రాయమైన ‘మాట్లాడి, చెప్పాడు’ నిర్మాణాన్ని పదేపదే అనుకరించకుండా, భావాన్ని ‘ఇలా అన్నాడు’గా స్పష్టంగా అందించాం.
