source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: te
  text: ఏడు రోజులపాటు మీరు యాహ్వేకు అగ్ని అర్పణను సమర్పించాలి.[a] ఏడవ రోజున పవిత్ర సమావేశం జరగాలి; మీరు ఏ సాధారణ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార అర్పణ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: మీరు ... సమర్పించాలి
  rationale: బలి సంబంధ సందర్భంలో קרב యొక్క హిఫీల్ రూపం అర్పణను దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘సమర్పించాలి’ సహజంగా, కర్మకాండ భావాన్ని నిలుపుతుంది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: యాజక సంబంధ వాడుకలో ఈ పదం అగ్ని ద్వారా అర్పించబడే అర్పణను సూచిస్తుంది. ‘అగ్ని అర్పణ’ కంటే ఈ రూపం తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది; పదానికి ‘ఆహార అర్పణ’ అనే సాధ్యమైన అవగాహనను పాదటీపులో ఉంచాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ అర్పణ దిశను లేదా అంకితభావాన్ని సూచిస్తుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: అర్పణలు జరిగే వ్యవధిని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: మూలంలోని కాల సూచనకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమావేశం
  rationale: అధికారికంగా పిలిచిన పవిత్ర సమూహాన్ని సూచించే పండుగ సంబంధ స్థిరపదబంధం; ‘పవిత్ర సమావేశం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: ఏ విధమైన సాధారణ పనీ
  rationale: ఈ పదబంధం ప్రతి చిన్న చర్యను కాక, జీవనోపాధి లేదా నిత్య సేవకు సంబంధించిన సాధారణ పనిని సూచిస్తుంది. ‘సాధారణ పని’ అతివ్యాప్తిని నివారిస్తూ నిషేధ భావాన్ని తెలియజేస్తుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: చేయకూడదు
  rationale: సమూహాన్ని ఉద్దేశించిన నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాక చతురక్షర దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’గా మార్చకుండా వ్యక్తిగత నామంగా నిలిపి, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אִשֶּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదవ్యుత్పత్తి, యాజక సంబంధ వాడుకపై భిన్న అవగాహనలు ఉన్నందున ప్రధాన పాఠంలో అగ్ని ద్వారా అర్పించే విధానాన్ని తెలిపి, ప్రత్యామ్నాయాన్ని పాదటీపులో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కర్మకాండ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘పవిత్ర సమావేశం,’ ‘సమర్పించాలి’ వంటి స్పష్టమైన పదాలను ఉపయోగించి, ప్రాచీన లేదా అసహజ పదబంధాలను నివారించాం.
