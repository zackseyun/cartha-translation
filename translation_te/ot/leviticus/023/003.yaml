source:
  edition: WLC
  text: שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽ/יהוָ֔ה בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: te
  text: ఆరు రోజులు పని చేయవచ్చు. అయితే ఏడవ రోజు సంపూర్ణ విశ్రాంతి దినమైన సబ్బాతు[a], పరిశుద్ధ సమావేశం. మీరు ఏ పనీ చేయకూడదు; మీ నివాసస్థలాలన్నిటిలోనూ[b] అది యాహ్వేకు సబ్బాతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సబ్బాతు-విశ్రాంతి’ లేదా ‘గంభీర విశ్రాంతి గల సబ్బాతు.’ హెబ్రీ పదబంధం సబ్బాతు విశ్రాంతి భావాన్ని బలంగా నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ స్థిర నివాస సముదాయాలన్నిటిలోనూ.’ హెబ్రీ పదం నివాస స్థలాలను లేదా స్థిరపడిన సముదాయాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: పని చేయవచ్చు
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ భావాన్ని తెలుగులో అక్షరార్థంగా పలికిస్తే అసహజంగా ఉంటుంది. సందర్భంలోని అనుమతి/సాధారణ నియమ భావాన్ని సహజంగా తెలియజేయడానికి ‘పని చేయవచ్చు’ అని అనువదించాం.
- source_word: מְלָאכָה
  choice: పని
  rationale: సబ్బాతు నియమాల్లో ఇది సాధారణంగా వృత్తి లేదా శ్రమతో కూడిన పనిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పని’ స్పష్టమైన, సహజమైన పదం.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి దినమైన సబ్బాతు
  rationale: ఈ హెబ్రీ పదబంధం సబ్బాతు విశ్రాంతిని బలంగా నొక్కి చెబుతుంది. ‘సంపూర్ణ విశ్రాంతి’ ఆ తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పరిశుద్ధ సమావేశ దినం
  rationale: ఇది ఆహ్వానించి సమకూర్చే పవిత్ర సభను సూచించే ఆరాధనా పదబంధం. ‘పరిశుద్ధ సమావేశం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సమూహంగా కూడే భావాన్ని నిలుపుతుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు ఏ పనీ చేయకూడదు
  rationale: రెండవ పురుష బహువచనంలోని ప్రత్యక్ష నిషేధాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: అది యాహ్వేకు సబ్బాతు
  rationale: లַ అనే విభక్తి సూచించే ‘యాహ్వేకు అంకితమైన/ఆయన వైపు ఉద్దేశించిన’ భావాన్ని స్వాధీనార్థంగా మార్చకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదం చేశాం.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రదేశాలన్నిటిలోనూ
  rationale: מוֹשָׁב నివాస స్థలాలను లేదా స్థిర నివాస సముదాయాలను సూచించగలదు. ప్రధాన పాఠంలో సహజమైన విస్తృత అర్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: అయితే ఏడవ రోజు
  rationale: వావ్‌ను ‘అయితే’ అని అనువదించడం ఆరు పని దినాలకు ఏడవ విశ్రాంతి దినానికి మధ్య ఉన్న సందర్భోచిత వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల బిరుదును లేదా వేరొక సంప్రదాయ ఉచ్చారణను పెట్టకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగులో ధ్వన్యనువాదం చేశాం.
- issue: שַׁבַּת שַׁבָּתוֹן పదబంధపు బలం
  choice: సంపూర్ణ విశ్రాంతి దినమైన సబ్బాతు
  alternative: గంభీర విశ్రాంతి గల సబ్బాతు
  rationale: ఈ పదబంధం సాధారణ విశ్రాంతికన్నా పూర్తి విరమణను నొక్కి చెబుతుంది. తరువాతి సిద్ధాంత వివరణలను చేర్చకుండా ఆ బలాన్ని ‘సంపూర్ణ విశ్రాంతి’గా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘సబ్బాతు’ అనే స్థిర బైబిలు పదాన్ని నిలిపి, అరుదైన ‘సమాహ్వానం’ బదులు సాధారణ పాఠకులకు అర్థమయ్యే ‘పరిశుద్ధ సమావేశం’ వాడాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
