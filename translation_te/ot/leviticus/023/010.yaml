id: LEV.23.10
reference: Leviticus 23:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] మాట్లాడి వారికి ఇలా చెప్పు: ‘మీరు నేను మీకు ఇస్తున్న దేశంలోకి వచ్చి, దాని పంటను కోసినప్పుడు, మీ కోతలోని ప్రథమఫలాల పనను[b] యాజకుని వద్దకు తీసుకురావాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ కోతలోని ప్రథమఫలాల ఓమెరును.” ఇక్కడ హీబ్రూ పదం ధాన్యపు పనను సూచించవచ్చు; అది “ఓమెరు” అనే సాంకేతిక పదంగానూ వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ సంధిబంధంలోని పురుష బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది ఇశ్రాయేలు సమాజాన్ని ఉద్దేశించిన సాంప్రదాయిక సంబోధన.
- source_word: כִּי תָבֹאוּ
  choice: మీరు వచ్చినప్పుడు
  rationale: כִּי ఇక్కడ ఆజ్ఞ వర్తించే సమయాన్ని లేదా పరిస్థితిని పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘వచ్చినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇశ్రాయేలీయులు ప్రవేశించబోయే భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజమైన భౌగోళిక పదం.
- source_word: נֹתֵן
  choice: ఇస్తున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా సమీప కార్య భావాన్ని నిలుపుతుంది.
- source_word: וּקְצַרְתֶּם אֶת־קְצִירָהּ
  choice: దాని పంటను కోసినప్పుడు
  rationale: భూమికి చెందిన పంటను కోయడాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַהֲבֵאתֶם
  choice: తీసుకురావాలి
  rationale: ఈ నియమ సందర్భంలోని ఆజ్ఞాత్మక బాధ్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֹמֶר
  choice: పన
  rationale: ఈ వ్యవసాయ-ఆరాధనా సందర్భంలో కోసి కట్టిన ధాన్యపు పనను సూచిస్తుంది; సాంకేతిక లిప్యంతరీకరణ ‘ఓమెరు’ను పాదటీపులో ఉంచాం.
- source_word: רֵאשִׁית
  choice: ప్రథమఫలాలు
  rationale: కోతలో మొదట దేవునికి సమర్పించే భాగమనే కాలక్రమ మరియు ఆరాధనా భావాలను రెండింటినీ తెలియజేస్తుంది.
- source_word: קְצִירְכֶם
  choice: మీ కోత
  rationale: ముందున్న కోయడం అనే పదభావంతో అనుసంధానాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా నియమాలలో כֹּהֵןకు ప్రామాణికమైన తెలుగు అనువాదం.
theological_decisions:
- issue: నిబంధన సమాజాన్ని లింగసూచకంగా సంబోధించడం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని בְּנֵי అనే స్పష్టమైన పురుష బహువచన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది మొత్తం ఇశ్రాయేలు సమాజానికి వాడే సంబోధన కావచ్చనే సహజ ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
- issue: ఆరాధనా పదం עֹמֶר యొక్క అర్థం
  choice: పన
  alternative: ఓమెరు
  rationale: యాజకుని దగ్గరికి తీసుకువచ్చే కోత వస్తువును ఈ వచనం వర్ణిస్తున్నందున ప్రధాన పాఠంలో స్పష్టమైన వ్యవసాయార్థాన్ని ఎంచుకున్నాం; సాంకేతిక పదంగా ఉండే అవకాశాన్ని పాదటీపులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. మూలంలోని ప్రత్యక్ష సంభాషణను సహజమైన తెలుగు వాక్యక్రమంలో ఉంచి, వ్యవసాయ మరియు ఆరాధనా పదాల మధ్య ఉన్న ఉద్వేగాన్ని పాదటీపులతో సంరక్షించాం.
