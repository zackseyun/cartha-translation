  naturalness: ‘కుమారులతో ఇలా చెప్పు’ అర్థవంతమైనదే అయినా, ‘కుమారులతో మాట్లాడి వారికి ఇలా చెప్పు’ అనేది మూలంలోని రెండు క్రియలను స్పష్టపరుస్తూ ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజంగా ఉంటుంది. ‘యాజకుని వద్దకు’ ఈ ధర్మశాస్త్ర సందర్భానికి కొద్దిగా మెరుగైన రిజిస్టర్.
