source:
  edition: WLC
  text: וְ/הֵנִ֣יף הַ/כֹּהֵ֣ן אֹתָ֡/ם עַל֩ לֶ֨חֶם הַ/בִּכּוּרִ֤ים תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה עַל שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַ/יהוָ֖ה לַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: te
  text: యాజకుడు వాటిని ప్రథమఫలాల రొట్టెతోను ఆ రెండు గొర్రెపిల్లలతోను యాహ్వే సన్నిధిలో ఊపే అర్పణగా సమర్పించాలి.[a] అవి యాహ్వేకు పవిత్రమైనవిగా ఉంటాయి; అవి యాజకునికి చెందుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రథమఫలాల రొట్టె మీద … ఆ రెండు గొర్రెపిల్లల మీద.” ఇక్కడి హెబ్రీ ఉపసర్గను అక్షరార్థంగా “మీద/పైన” అని అనువదించవచ్చు; అయితే ఈ సందర్భంలో అది వాటితో సంబంధం ఉన్న ఆచారబద్ధ సమర్పణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: కదిలించే అర్పణగా కదిలించాలి
  rationale: נוּף హిఫిల్ రూపం మరియు תְּנוּפָה బలుల సందర్భంలో దేవుని సన్నిధిలో చేసే ఆచారబద్ధమైన కదిలింపు/సమర్పణను సూచిస్తాయి. సాంకేతిక భావాన్ని స్పష్టంగా ఉంచేందుకు క్రియను, అర్పణ పేరును రెండింటినీ నిలిపాం.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ముందటి వచనంలో పేర్కొన్న అర్పణ వస్తువులను సూచించే బహువచన సర్వనామాన్ని హెబ్రీ వచనంలాగే నిర్దిష్టీకరించకుండా ఉంచుతుంది.
- source_word: עַל לֶחֶם הַבִּכּוּרִים ... עַל שְׁנֵי כְּבָשִׂים
  choice: ప్రథమఫలాల రొట్టెతో, ఆ రెండు గొర్రెపిల్లలతో కలిపి
  rationale: עַל అక్షరార్థంగా ‘మీద/పైన’ కావచ్చు; ఈ ఆచార సందర్భంలో వస్తువుల సంయుక్త సమర్పణను సూచించే ‘తో కలిపి’ సహజంగా ఉంది. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: לֶחֶם הַבִּכּוּרִים
  choice: ప్రథమఫలాల రొట్టె
  rationale: రొట్టెకు ప్రథమఫలాలతో ఉన్న సంబంధాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే ఆరాధనా క్రియ అనే హెబ్రీ నుడికార భావాన్ని సహజంగా అందిస్తుంది; దైవనామాన్ని వ్యక్తినామంగా నిలిపింది.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: ప్రతిష్ఠితమైనవి
  rationale: ఇవి పవిత్ర పరిధికి వేరుచేయబడి దేవునికి చెందినవనే స్థితిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה לַכֹּהֵן
  choice: యెహోవాకు ... యాజకునికి చెందుతాయి
  rationale: అర్పణలు యెహోవాకు ప్రతిష్ఠితమైనవైనా యాజకునికి కేటాయించబడతాయనే రెండు సంబంధాలను స్పష్టంగా, కానీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపమైన ‘యెహోవా’ను వాడి, సాధారణ బిరుదుతో దైవనామాన్ని భర్తీ చేయలేదు.
- issue: యెహోవాకు పవిత్రమైనవి, యాజకునికి కేటాయించబడినవి అనే సంబంధం
  choice: యెహోవాకు ప్రతిష్ఠితమైనవి; అవి యాజకునికి చెందుతాయి
  alternative: యెహోవాకు పవిత్రమైనవి, యాజకునికోసం ఉంటాయి
  rationale: దైవానికి అంకితం కావడం మరియు యాజకుని హక్కుగా కేటాయించబడడం పరస్పర విరోధాలు కావని వచనంలోని ఉద్రిక్తతను వివరణతో తొలగించకుండా రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా సందర్భానికి తగిన గౌరవభరితమైన శైలి. సాంకేతిక బలి పదాన్ని అర్థమయ్యే విధంగా ‘కదిలించే అర్పణ’గా ఉంచి, עַל లోని స్థలార్థ/సహచర్యార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
