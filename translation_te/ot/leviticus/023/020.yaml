    issue: The draft uses “యెహోవా” for the Tetragrammaton.
    rationale: The supplied POB theological decision specifies “Yahweh.” “యాహ్వే” is the corresponding Telugu transliteration and maintains consistency with that audit trail.
  - severity: medium
    issue: “కదిలించే అర్పణగా కదిలించాలి” is repetitive and semantically imprecise in Telugu.
    rationale: The Hebrew combines a verb of ritual waving with the technical offering designation. Telugu can naturally convey this as “ఊపే అర్పణగా … సమర్పించాలి,” without losing the ritual sense.
