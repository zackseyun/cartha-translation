id: LEV.23.24
reference: Leviticus 23:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు: ‘ఏడవ నెలలో, ఆ నెల మొదటి రోజున, మీకు విశేష విశ్రాంతి దినం, బూరధ్వనుల జ్ఞాపకార్థ దినం, పవిత్ర సమావేశం ఉండాలి.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన బహువచనాన్ని యథాశక్తి నిలుపుతూ, ఒడంబడిక సమాజాన్ని సమష్టిగా సూచించే వాడుకను కాపాడుతుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: కాలసూచక హీబ్రూ పదబంధానికి సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ఆ నెల మొదటి రోజున
  rationale: అక్షరార్థంగా ‘నెలలో ఒకటవ రోజున’ అనే హీబ్రూ కాలపద్ధతిని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీరు … పాటించాలి
  rationale: ‘మీకు ఉండాలి’ అనే మూల నిర్మాణాన్ని తెలుగు ఆజ్ఞాపూర్వక ధర్మశాస్త్ర సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שַׁבָּתוֹן
  choice: గంభీరంగా విశ్రాంతి
  rationale: సాధారణ విశ్రాంతికంటే ప్రత్యేకంగా ఆచరించే పనివిరమణ భావాన్ని తెలియజేస్తుంది; ‘సబ్బాతు’ అనే లిప్యంతరీకరణతో అనవసరంగా సమానీకరించదు.
- source_word: זִכְרוֹן
  choice: జ్ఞాపకం చేసే రోజు
  rationale: జ్ఞాపకార్థ ఆచరణ అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; ‘రోజు’ సందర్భం నుంచి స్పష్టమైనా, క్రియాపద సంబంధాన్ని అతిగా నిర్ణయించదు.
- source_word: תְּרוּעָה
  choice: బూరధ్వనులు
  rationale: పండుగ-ఆరాధనా సందర్భంలో సంకేత వాద్యధ్వనులు సంభావ్యమైన అర్థం; పదానికి కేకలు లేదా ఇతర పెద్ద సంకేతధ్వనులు అనే విస్తృత అర్థం కూడా ఉన్నందున పాదసూచికలో అది నిలుపబడింది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమావేశం
  rationale: పవిత్రంగా పిలిచి కూడబెట్టిన సభను సూచించే ఆరాధనా పదబంధానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: תְּרוּעָה అనే పదం సూచించే ధ్వని స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘బూరధ్వనులు’
  alternative: పెద్ద కేకలు లేదా ఇతర బలమైన సంకేతధ్వనులు
  rationale: ఈ పండుగ సందర్భంలో కొమ్ముబూర/బూర సంకేతధ్వనులు బలమైన సంప్రదాయ మరియు సందర్భోచిత అర్థం. అయితే హీబ్రూ పదం వాద్యధ్వనికే పరిమితం కాదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి నిజమైన పదార్థ అనిశ్చితిని కాపాడాం.
- issue: זִכְרוֹן תְּרוּעָה పదబంధంలోని సంబంధం
  choice: ‘బూరధ్వనులతో జ్ఞాపకం చేసే రోజు’
  alternative: ‘బూరధ్వనుల జ్ఞాపకార్థ ఆచరణ’
  rationale: హీబ్రూ సమాసం ధ్వనులు జ్ఞాపకాన్ని కలిగిస్తాయా, లేక వాటినే జ్ఞాపకార్థంగా ఆచరిస్తారా అన్న సంబంధాన్ని పూర్తిగా నిర్దేశించదు. తెలుగు పాఠ్యం ఆచరణాత్మక భావాన్ని అందిస్తూ అతిగా సిద్ధాంతీకరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర-ఆరాధనా శైలి. వాక్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా నిర్మించబడింది; మూలంలోని పండుగ పదజాలం మరియు תְּרוּעָה యొక్క అర్థవిస్తృతి కాపాడబడ్డాయి.
