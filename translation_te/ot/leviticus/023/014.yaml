  text: וְ/לֶחֶם֩ וְ/קָלִ֨י וְ/כַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה עַ֚ד הֲבִ֣יאֲ/כֶ֔ם אֶת קָרְבַּ֖ן אֱלֹהֵי/כֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: te
  text: మీరు రొట్టెనుగానీ, కాల్చిన ధాన్యాన్నిగానీ[a], తాజాగా పండిన ధాన్యాన్నిగానీ[b] ఈ రోజునే, మీ దేవునికి అర్పణను తీసుకువచ్చే వరకు తినకూడదు. ఇది మీ తరతరాలకు, మీరు నివసించే ప్రదేశాలన్నిటిలో శాశ్వత నియమం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేపిన ధాన్యం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కొత్త ధాన్యం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఎల్లకాలపు నియమం’; ‘నిరంతర నియమం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: ఈ పంటసంబంధ సందర్భంలో సాధారణ ‘ఆహారం’ కంటే కాల్చి తయారుచేసిన ధాన్యాహారాన్ని సూచించే నిర్దిష్ట పదం తగినది.
- source_word: קָלִי
  choice: వేయించిన ధాన్యం
  rationale: వేడి మీద వేయించి లేదా కాల్చి సిద్ధం చేసిన ధాన్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַרְמֶל
  choice: పచ్చి ధాన్యం
  rationale: ఇక్కడ స్థలనామం కాదు; తాజాగా పండిన ధాన్యం లేదా తాజా కంకులను సూచిస్తుంది. ‘పచ్చి ధాన్యం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది.
- source_word: לֹא תֹאכְלוּ
  choice: మీరు ... తినకూడదు
  rationale: న్యాయపరమైన నిషేధ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: అంటే ఆ రోజే వచ్చే వరకు
  rationale: עֶצֶם ఇచ్చే కాలవాచక ఉద్ఘాటనను ‘ఆ రోజే’ ద్వారా చూపిస్తుంది; సందర్భంలో నిర్దేశిత అర్పణ దినాన్ని సూచిస్తుంది.
- source_word: עַד הֲבִיאֲכֶם
  choice: మీరు ... తీసుకొచ్చే వరకు
  rationale: అర్పణను తీసుకురావడం పూర్తవడమే నిషేధానికి ముగింపు షరతని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: మీ దేవునికి అర్పణ
  rationale: కָרְבָּן అనే సాధారణ అర్పణ పదాన్ని ఒక నిర్దిష్ట బలి రకంగా అతిగా పరిమితం చేయకుండా, దేవునికి సమర్పించేదిగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనం
  rationale: నిరంతరంగా అమలులో ఉండే న్యాయనియమ భావాన్ని గంభీరంగా, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: తదుపరి తరాలన్నిటిలో కొనసాగుదలను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రదేశాలన్నిటిలో
  rationale: ‘నివాసస్థలాలన్నిటిలో’ కంటే ఆధునిక పాఠకునికి సహజంగా ఉండి, ఇశ్రాయేలీయులు నివసించే అన్ని ప్రాంతాల భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మోషే ధర్మశాస్త్రంలో חֻקַּת עוֹלָם యొక్క బలం
  choice: శాశ్వతమైన శాసనం
  alternative: ఎల్లకాలపు శాసనం; నిరంతర శాసనం
  rationale: హీబ్రూ పదబంధంలోని కొనసాగుతున్న ఒడంబడికపరమైన న్యాయబలాన్ని నిలుపుతూ, మోషే ఆచార ధర్మశాస్త్రం తరువాత కూడా ఎలా వర్తిస్తుందనే వేదాంత వివాదాన్ని అనువాదంలో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యేలా న్యాయవిధి గంభీరతను నిలిపిన అనువాదం. హీబ్రూ వాక్యంలో అర్పణను తీసుకురావడం మరియు నిర్దేశిత దినం ఒకే కాలపరిమితిని వివరిస్తున్నందున తెలుగులో ‘అంటే’తో సంబంధం స్పష్టం చేయబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
