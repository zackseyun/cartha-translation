id: LEV.23.36
reference: Leviticus 23:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: te
  text: ఏడు రోజుల పాటు మీరు యాహ్వేకు అగ్ని అర్పణను సమర్పించాలి. ఎనిమిదవ రోజున మీకు పవిత్ర సభ ఉండాలి; మీరు యాహ్వేకు అగ్ని అర్పణను సమర్పించాలి. అది విశేష సభ[a]; మీరు సాధారణ పని ఏదీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గంభీర సభ.” హెబ్రీ עֲצֶרֶת ప్రత్యేకంగా నియమించబడిన పండుగ సభను సూచిస్తుంది; ఈ సందర్భంలో అది ఎనిమిదవ రోజు కూడిక.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: సమర్పించాలి
  rationale: קרב హిఫిల్ రూపానికి బలిసంబంధ సందర్భంలో ‘దగ్గరకు తేవడం, అర్పించడం’ అనే భావం ఉంది. ఆధునిక తెలుగులో ‘సమర్పించాలి’ సహజంగా ఉండి ఆరాధనాపరమైన భావాన్ని నిలుపుతుంది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఇది యాజక ధర్మశాస్త్రంలో అగ్ని ద్వారా సమర్పించే బలికి వాడే సాంకేతిక పదం. ‘అగ్నితో అర్పించే అర్పణ’ దాని విధానాన్ని స్పష్టంగా తెలుపుతుంది; దీనిని కేవలం ‘ఆహార అర్పణ’గా పరిమితం చేయదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అర్పణ యొక్క గ్రహీతను లేదా అంకిత దిశను సూచిస్తుంది. יהוה అనే ఒడంబడిక నామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సమావేశం
  rationale: ఈ స్థిరమైన పండుగ పదబంధం అధికారికంగా పిలువబడిన పవిత్ర సమాజ కూడికను సూచిస్తుంది. ‘పవిత్ర సమావేశం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: עֲצֶרֶת
  choice: ముగింపు మహాసభ
  rationale: ఈ సందర్భంలో పదం పండుగ చివర జరిగే ప్రత్యేకంగా నిర్దేశిత కూడికను సూచిస్తుంది. ‘ముగింపు మహాసభ’ ముగింపు స్వభావాన్ని తెలియజేస్తూనే, పదంలో అంతర్లీనంగా ఉండగల నిరోధం/నిలుపుదల భావంపై ఒకే నిర్ణయాన్ని బలవంతంగా రుద్దదు.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: సాధారణమైన ఏ పనీ
  rationale: పండుగ నియమాల్లో ఈ పదబంధం ప్రతి చర్యను కాక, దైనందిన ఉపాధి లేదా సాధారణ శ్రమను నిషేధిస్తుంది. ‘సాధారణమైన ఏ పనీ’ ఆ తేడాను సహజమైన తెలుగులో చూపుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: మూలంలోని సూటి కాలసూచనను సహజమైన తెలుగు విభక్తితో అందిస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... జరగాలి
  rationale: היה + ל నిర్మాణంలోని ‘మీ కొరకు/మీ మధ్య ఉండాలి’ అనే నిర్దేశాత్మక భావాన్ని సమావేశానికి తగిన సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపి, ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
- issue: עֲצֶרֶת యొక్క సందర్భార్థం
  choice: ముగింపు మహాసభ
  alternative: గంభీర సమావేశం; నిరోధ దినం
  rationale: ఇది ఏడు రోజుల పండుగకు అనంతరమైన ఎనిమిదవ రోజు కూడిక కాబట్టి ముగింపు భావం సందర్భం ద్వారా బలపడుతుంది. అయితే పదవ్యుత్పత్తిలోని ‘నిలిపివేయడం/నిరోధించడం’ భావాన్ని పూర్తిగా సమానార్థకంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గౌరవప్రదమైన మరియు స్పష్టమైన శైలిని వాడాం. బలిసంబంధ సాంకేతిక పదాలను అతిగా సరళీకరించకుండా అర్థమయ్యే రీతిలో ఇచ్చాం; ‘పవిత్ర సమావేశం’ మరియు ‘ముగింపు మహాసభ’ మధ్య మూలంలోని పదభేదాన్ని నిలిపాం.
