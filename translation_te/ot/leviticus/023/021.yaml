id: LEV.23.21
reference: Leviticus 23:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: te
  text: 'ఆ రోజునే మీరు ప్రకటించాలి: మీకు పవిత్ర సభ ఉండాలి[a]. సాధారణ శ్రమపని ఏదీ చేయకూడదు[b]. మీ నివాసస్థలాలన్నిటిలో, మీ తరతరాలకు ఇది శాశ్వత నియమం[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర సమావేశం’; మూలభాషలో ఇది పవిత్ర ఉద్దేశంతో అధికారికంగా పిలువబడిన కూడికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘సేవ/శ్రమకు సంబంధించిన ఏ పనీ’; అంటే సాధారణ సేవా లేదా శ్రమపని.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఎల్లకాలం నిలిచే నియమం’ లేదా ‘నిరంతర నియమం’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: మీరు ఇలా ప్రకటించాలి
  rationale: קרא అనే క్రియ ఇక్కడ బహిరంగంగా, అధికారికంగా ప్రకటించడాన్ని సూచిస్తుంది. తరువాతి వాక్యభాగమే ప్రకటించాల్సిన విషయమని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ఆ రోజునే
  rationale: עֶצֶם కాలసూచనను బలపరచి అదే నిర్దిష్టమైన రోజును నొక్కిచెబుతుంది; ‘ఆ రోజునే’ ఈ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: ఈ స్థిర ఆరాధనా పదబంధం పవిత్ర ఉద్దేశంతో అధికారికంగా పిలిచిన సమాజ కూడికను సూచిస్తుంది. ‘పవిత్ర సభ’ సాంకేతిక భావాన్ని గౌరవప్రదంగా, సులభంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: ఈ సభ ఇశ్రాయేలు సమాజానికి నిర్ణయించబడినదని తెలిపే స్వతంత్ర విధేయ వాక్యాన్ని నిలుపుతుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: సాధారణ శ్రమపని ఏదీ
  rationale: ఈ న్యాయపరమైన పదబంధం ప్రతి చర్యనూ కాక, సాధారణ సేవా లేదా జీవనోపాధి శ్రమను సూచిస్తుంది. ‘సాధారణ శ్రమపని’ ఆ పరిమితిని నిలుపుతుంది.
- source_word: לֹא תַעֲשׂוּ
  choice: చేయకూడదు
  rationale: న్యాయశైలిలోని స్పష్టమైన నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వత నియమం
  rationale: తరతరాలుగా కొనసాగవలసిన స్థిరమైన నిబంధన అనే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది; దాని కాలవ్యాప్తి గురించి ఉన్న భావసూక్ష్మతను పాదసూచికలో ఉంచాం.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే అన్ని ప్రాంతాల్లో
  rationale: ఇశ్రాయేలీయులు నివసించే ప్రతి స్థలానికీ ఈ నియమం వర్తిస్తుందని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు
  rationale: వరుసగా వచ్చే తరాలన్నిటికీ నియమం వర్తిస్తుందనే న్యాయసూత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: పండుగ దినాన పని నిషేధపు పరిధి
  choice: ‘సాధారణ శ్రమపని ఏదీ చేయకూడదు’
  alternative: ‘ఏ పనీ చేయకూడదు’
  rationale: כָּל מְלֶאכֶת עֲבֹדָה సాధారణ శ్రమ లేదా సేవాపనిని సూచిస్తుంది; ప్రతి రకమైన చర్యనూ పూర్తిగా నిషేధించినట్లు విస్తరించి చెప్పకుండా మూలపాఠపు పరిధిని కాపాడాం.
- issue: עוֹלָם అనే పదం యొక్క కాలవ్యాప్తి
  choice: ‘శాశ్వత నియమం’ అని అనువదించి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సూచించడం
  alternative: ‘నిరంతరం పాటించాల్సిన నియమం’ లేదా ‘తరతరాల నియమం’
  rationale: న్యాయసూత్రంలో עוֹלָם దీర్ఘకాలికంగా, తరతరాలుగా కొనసాగడాన్ని సూచించగలదు. మూలంలోని బలమైన పదాన్ని ప్రధాన పాఠంలో నిలిపి, దానిని తాత్త్వికంగా మరింత నిర్దిష్టం చేయకుండా ప్రత్యామ్నాయాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. మూలంలోని మూడు వాక్యభాగాల క్రమాన్ని నిలుపుతూ, ప్రకటించాల్సిన విషయాన్ని తెలుగులో స్పష్టంచేయడానికి ద్విబిందువు వాడాం. ఆరాధనా పదజాలం సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంచబడింది.
