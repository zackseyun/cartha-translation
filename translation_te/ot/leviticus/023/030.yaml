source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: te
  text: ఈ రోజునే ఏ పనైనా చేసే ప్రతి వ్యక్తిని నేను అతని ప్రజల మధ్యనుండి నాశనం చేస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ వ్యక్తిని అతని ప్రజల మధ్యనుండి తొలగిస్తాను.” ఇక్కడి హీబ్రూ క్రియకు “నాశనం చేయడం/నశింపజేయడం” అనే అర్థం ఉంది; సాధారణంగా “తెగనరికడం” అని అనువదించే క్రియను ఇక్కడ ఉపయోగించలేదు. అయినా, తీర్పుగా సమాజం నుండి తీసివేయడం అనే భావం దీనికి సన్నిహితంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: వ్యక్తి
  rationale: న్యాయపరమైన ఈ సందర్భంలో נֶפֶשׁ శరీరానికి వేరైన ‘ఆత్మ’ను కాకుండా ఒక వ్యక్తిని సూచిస్తుంది; రెండు చోట్లా ‘వ్యక్తి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: ఏ పనైనా చేసే
  rationale: עשה + מְלָאכָה అంటే పని చేయడం; כָּל యొక్క సమగ్ర భావాన్ని ‘ఏ పనైనా’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ఈ రోజునే
  rationale: עֶצֶם הַיּוֹם కాలసూచనకు ఇచ్చే ఉద్ఘాటనను ‘-నే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַאֲבַדְתִּי
  choice: నేను ... నాశనం చేస్తాను
  rationale: אבד యొక్క హిఫీల్ రూపం ‘నశింపజేయడం/నాశనం చేయడం’ అనే బలమైన భావం కలిగిస్తుంది; మూలంలో సాధారణంగా ‘తొలగించు’ అని అనువదించే כרת లేదు.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: అతని ప్రజల మధ్యనుండి
  rationale: ఇది సమాజం మధ్యనుండి తీర్పుగా తొలగింపును సూచిస్తుంది. עַמָּהּలోని స్త్రీలింగ ప్రత్యయం వ్యాకరణపరంగా נֶפֶשׁతో ఏకీభవించినది; భావపరంగా వ్యక్తిని సూచించేందుకే తెలుగులో ‘అతని’ వాడబడింది.
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ తెలిపే శిక్ష స్వభావం
  choice: అతని ప్రజల మధ్యనుండి నాశనం చేస్తాను
  alternative: అతని ప్రజల మధ్యనుండి తొలగిస్తాను
  rationale: మూలంలోని אבד హిఫీల్ రూపం ‘నాశనం చేయడం/నశింపజేయడం’ అని నేరుగా సూచిస్తుంది; సాంప్రదాయిక ఒడంబడిక శిక్షా పదమైన כרת ఇక్కడ లేదు. అయినా సమాజం నుండి తీర్పుగా తొలగించే సందర్భార్థం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయవాక్య శైలి. ‘ఈ రోజునే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘వ్యక్తి’ లింగసమావేషక భావాన్ని ఇస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
