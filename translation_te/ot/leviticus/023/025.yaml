source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: te
  text: మీరు ఎలాంటి సాధారణ పనీ చేయకూడదు; యాహ్వేకు ఆహార అర్పణను[a] సమర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్నిలో అర్పించే అర్పణ” లేదా “అగ్ని అర్పణ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: ఏ ... చేయకూడదు
  rationale: హీబ్రూ నిషేధంలోని సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: శ్రమతో కూడిన పని
  rationale: ఇది ప్రతి చిన్న చర్యను కాకుండా సాధారణ శ్రమ లేదా సేవకు సంబంధించిన పనిని సూచిస్తుంది; పురాతనంగా లేదా అతిగా సంకుచితంగా వినిపించే పదాలను నివారిస్తుంది.
- source_word: וְהִקְרַבְתֶּם
  choice: సమర్పించాలి
  rationale: קרב అనే క్రియ యొక్క హిఫీల్ రూపం బలి సందర్భంలో అర్పణగా దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావాన్ని ఇస్తుంది.
- source_word: אִשֶּׁה
  choice: ఆహార అర్పణ
  rationale: యాజక ధర్మశాస్త్రంలోని ఈ బలి వర్గాన్ని చదవడానికి సహజంగా తెలియజేస్తుంది. ‘అగ్నిలో అర్పించే అర్పణ’ అనే సాంప్రదాయిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి మూలపదంలోని అనిశ్చితిని కాపాడాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దేవుని నిబంధన నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తున్నందున, దాని ప్రత్యేకతను నిలుపుతూ ‘యాహ్వే’ అని ఇచ్చాం.
- issue: אִשֶּׁה అనే బలి సంబంధ పదం
  choice: ఆహార అర్పణ
  alternative: అగ్నిలో అర్పించే అర్పణ; అగ్ని అర్పణ
  rationale: ఈ పదానికి ‘ఆహార అర్పణ’ మరియు అగ్నితో సంబంధం చూపే అనువాదాలు రెండూ ప్రాచుర్యంలో ఉన్నాయి. ప్రధాన పాఠంలో చదవడానికి సహజమైన రూపాన్ని ఇచ్చి, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. రెండవ పురుష బహువచనాన్ని ‘మీరు’ ద్వారా నిలిపాం; రెండు ఆజ్ఞలను సెమీకోలన్‌తో అనుసంధానించి హీబ్రూ వాక్య నిర్మాణాన్ని సహజంగా ప్రతిబింబించాం.
