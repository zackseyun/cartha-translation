id: LEV.23.16
reference: Leviticus 23:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: te
  text: ఏడవ విశ్రాంతిదినం తరువాతి రోజు వరకు మీరు యాభై రోజులు[a] లెక్కించాలి; అప్పుడు యాహ్వేకు కొత్త ధాన్యార్పణను సమర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడవ వారం తరువాతి రోజు వరకు.” హీబ్రూ పాఠంలో “ఏడవ విశ్రాంతిదినం తరువాతి రోజు” అని ఉంది; పండుగకు సంబంధించిన ఈ లెక్కను పంచాంగరీత్యా ఎలా అర్థం చేసుకోవాలనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: తరువాతి రోజు వరకు
  rationale: లెక్కింపు కొనసాగే కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ఏడవ విశ్రాంతిదినం
  rationale: మూలంలోని שַׁבָּת అనే పదాన్ని ‘వారం’గా వివరణాత్మకంగా మార్చకుండా, దాని స్పష్టమైన అర్థాన్ని నిలుపుతుంది.
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: మీరు యాభై రోజులు లెక్కించాలి
  rationale: న్యాయనియమ సంబంధమైన ఆదేశాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִקְרַבְתֶּם
  choice: అప్పుడు ... సమర్పించాలి
  rationale: బల్యర్పణ సందర్భంలో ‘దగ్గరకు తీసుకురావడం’ అనే క్రియకు ‘సమర్పించడం’ సహజమైన అర్థం; ‘అప్పుడు’ కార్యాల క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: מִנְחָה חֲדָשָׁה
  choice: కొత్త ధాన్యార్పణను
  rationale: లేవీయకాండంలోని ఆచార సందర్భంలో מִנְחָהను సాధారణ అర్పణగా కాక ధాన్యార్పణగా నిర్దిష్టంగా అనువదిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను వ్యక్తినామంగా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచి, ל ఉపసర్గను ‘కు’గా అనువదిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది; ‘యెహోవా’ సాధారణ తెలుగు బైబిలు వాడుకలో సుపరిచితం.
- issue: ‘ఏడవ విశ్రాంతిదినం’ను ‘ఏడవ వారం’గా మార్చాలా
  choice: ఏడవ విశ్రాంతిదినం
  alternative: ఏడవ వారం
  rationale: హీబ్రూ పాఠంలో సాధారణ ‘వారం’ అనే పదం కాక שַׁבָּת ఉంది. అందువల్ల పంచాంగ సంబంధమైన వివాదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా మూలంలోని పదప్రయోగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా నియమానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని కాలగణన అస్పష్టతను పాదటిప్పణిలో నిలుపుకుంది.
