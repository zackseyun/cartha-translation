id: LEV.23.37
reference: Leviticus 23:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: te
  text: 'యెహోవా నియమించిన సమయాలు ఇవే. మీరు వాటిని పవిత్ర సమావేశాలుగా ప్రకటించాలి: యెహోవాకు అగ్నితో అర్పించే అర్పణను—దహనబలిని, ధాన్యార్పణను, బలిని, పానార్పణలను—ప్రతి దినానికి నియమితమైనది ఆ దినాన అర్పించాలి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: నియమించిన సమయాలు
  rationale: ఈ పదం నిర్ణయించబడిన లేదా నియమించబడిన సందర్భాలను సూచిస్తుంది; సందర్భం పండుగలకు సంబంధించినదైనా, మూలపదంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: పవిత్ర సమావేశాలు
  rationale: ప్రజలను పిలిచి కూడబెట్టే పవిత్ర సందర్భాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఇది బలిపీఠపు అగ్నిలో అర్పించే అర్పణకు వాడే ఆరాధనా పదం; ‘ఆహార అర్పణ’ అని నిర్ధారించడం కంటే మూలంలోని అగ్ని సంబంధాన్ని నిలుపుతుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా బలిపీఠంపై దహించబడే బలి అనే సాంకేతిక భావాన్ని తెలుగులో స్థిరంగా తెలియజేస్తుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండ సందర్భంలో ఇది సాధారణ కానుకకన్నా ధాన్యంతో చేసే ఆరాధనా అర్పణను సూచిస్తుంది.
- source_word: נְסָכִים
  choice: పానార్పణలు
  rationale: పోసి అర్పించే ద్రవ అర్పణలను సూచించే బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: דְּבַר יֹום בְּיוֹמוֹ
  choice: ప్రతి రోజుకు నియమించినదాన్ని ఆ రోజున
  rationale: ప్రతి దినానికి సంబంధించిన అర్పణను దాని నిర్ణీత రోజున అర్పించాలనే హీబ్రూ నుడికార భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ తెలుగు పాఠకులకు పరిచితమైన రూపంలో ప్రత్యక్షంగా నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
- issue: אִשֶּׁה యొక్క అర్థం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదం యొక్క ఖచ్చితమైన వ్యుత్పత్తిపై చర్చ ఉన్నందున ‘ఆహారం’ అనే వివరణను ప్రధాన పాఠంలో స్థిరపరచకుండా, యాజక సంబంధ సందర్భంలో స్పష్టమైన అగ్ని సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని అర్పణల జాబితాను దీర్ఘ విరామచిహ్నాలతో స్పష్టపరచి, చివరి నుడికారాన్ని సహజ తెలుగు వాక్యక్రమంలో అమర్చాం.
