revisions:
- from: యెహోవా నియమించిన సమయాలు ఇవే. మీరు వాటిని పవిత్ర సమావేశాలుగా ప్రకటించాలి. యెహోవాకు అగ్నితో అర్పించే అర్పణను—దహనబలిని, ధాన్యార్పణను, బలిని, పానార్పణలను—ప్రతి రోజుకు నియమించినదాన్ని ఆ రోజున అర్పించాలి.
  to: 'యెహోవా నియమించిన సమయాలు ఇవే. మీరు వాటిని పవిత్ర సమావేశాలుగా ప్రకటించాలి: యెహోవాకు అగ్నితో అర్పించే అర్పణను—దహనబలిని, ధాన్యార్పణను, బలిని, పానార్పణలను—ప్రతి దినానికి నియమితమైనది ఆ దినాన అర్పించాలి.'
  rationale: The revision retains the draft’s source-sensitive rendering of אִשֶּׁה and all cultic terms, while making the concluding idiom closer to the Hebrew’s ‘each day’s requirement on its day.’ A colon more clearly links the proclamation of holy convocations with the purpose of presenting the offerings.
