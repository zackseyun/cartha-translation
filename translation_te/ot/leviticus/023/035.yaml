  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: te
  text: మొదటి రోజున పవిత్ర సభ జరగాలి.[a] మీరు ఏ సాధారణ పనీ చేయకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిలిపించబడిన పవిత్ర సమావేశం.” హీబ్రూ పదబంధం అధికారికంగా సమకూర్చిన పవిత్ర సభను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శ్రమతో కూడిన పనేదీ.” హీబ్రూ పదబంధం సాధారణంగా సేవ, వృత్తి లేదా దైనందిన ఉపాధికి సంబంధించిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: మొదటి రోజున
  rationale: בְּ అనే కాలసూచక ఉపసర్గను, יוֹם הָרִאשׁוֹן అనే క్రమసంఖ్యా పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ఇలా వ్యక్తం చేశాం.
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: ఈ స్థిరమైన ఆరాధనా పదబంధం అధికారికంగా పిలిచి సమకూర్చిన పవిత్ర సమావేశాన్ని సూచిస్తుంది. తెలుగులో ‘పవిత్ర సభ’ సహజంగా ఉండి ఆ ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: ఏ సాధారణ పనీ
  rationale: ఈ పదబంధం ప్రతి చిన్న చర్యనూ కాకుండా వృత్తి, సేవ లేదా దైనందిన ఉపాధికి సంబంధించిన సాధారణ పనిని సూచిస్తుంది. ‘శ్రమతో కూడిన పని’ కూడా సాధ్యమే గాని, అది కేవలం కఠిన శారీరక శ్రమకే పరిమితమని అపార్థం కలిగించవచ్చు.
- source_word: לֹא תַעֲשׂוּ
  choice: మీరు ... చేయకూడదు
  rationale: రెండవ పురుష బహువచన న్యాయ ఆదేశాన్ని ఆధునిక తెలుగులో స్పష్టమైన నిషేధంగా వ్యక్తం చేస్తుంది.
