- from: అయితే, ఏడవ నెల పదిహేనవ రోజున, మీరు భూమి దిగుబడిని సమకూర్చుకున్న తర్వాత, ఏడు రోజులపాటు యహ్వే పండుగను[a] ఆచరించాలి. మొదటి రోజున విశ్రాంతి పాటించాలి[b]; ఎనిమిదవ రోజున కూడా విశ్రాంతి పాటించాలి.
  to: అయితే, ఏడవ నెల పదిహేనవ రోజున, మీరు భూమి పంట దిగుబడిని సేకరించినప్పుడు, యహ్వే పండుగను[a] ఏడు రోజులపాటు ఆచరించాలి. మొదటి రోజున ప్రత్యేక విశ్రాంతి దినం ఉండాలి[b]; ఎనిమిదవ రోజున కూడా ప్రత్యేక విశ్రాంతి దినం ఉండాలి.
