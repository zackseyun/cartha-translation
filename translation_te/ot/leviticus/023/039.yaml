source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: te
  text: అయితే, ఏడవ నెల పదిహేనవ రోజున, మీరు భూమి పంట దిగుబడిని సేకరించినప్పుడు, యహ్వే పండుగను[a] ఏడు రోజులపాటు ఆచరించాలి. మొదటి రోజున ప్రత్యేక విశ్రాంతి దినం ఉండాలి[b]; ఎనిమిదవ రోజున కూడా ప్రత్యేక విశ్రాంతి దినం ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే ఉత్సవం’ లేదా ‘యహ్వే యాత్రాపండుగ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పండుగ వేడుకను సూచిస్తుంది; ఇది తరచుగా యాత్ర చేసి ఆచరించే పండుగను కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సబ్బాతు వంటి విశ్రాంతి’ లేదా ‘సంపూర్ణ విశ్రాంతి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పవిత్ర ఆచరణతో సంబంధమున్న ప్రత్యేక పని విరమణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ఇక్కడ ఈ పదం ముందున్న ఆదేశాల నుంచి ప్రత్యేక సమయనిర్ణయానికి మార్పును లేదా వివరణాత్మక పరిమితిని సూచిస్తుంది. ‘అయితే’ ఆ సంభాషణాత్మక మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ కాలనిర్ణయాన్ని స్పష్టమైన, సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ
  choice: మీరు భూమి దిగుబడిని సమకూర్చుకున్న తర్వాత
  rationale: בְּ ఉపసర్గతో ఉన్న క్రియారూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ‘సమకూర్చుకున్న తర్వాత’ పంటను లోపలికి చేర్చడం పూర్తయిన సందర్భాన్ని తెలియజేస్తుంది. תְּבוּאָהను ధాన్యానికి మాత్రమే పరిమితం చేయకుండా ‘దిగుబడి’గా అనువదించాం.
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: యహ్వే పండుగను ఆచరించాలి
  rationale: חגג పండుగను జరపడం లేదా ఆచరించడం అనే భావాన్ని ఇస్తుంది. ‘ఆచరించాలి’ ధార్మిక పండుగ సందర్భానికి సహజంగా సరిపోతుంది; יְהוָה అనే వ్యక్తినామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: పండుగ ఆచరణ వ్యవధిని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שַׁבָּתוֹן
  choice: విశ్రాంతి పాటించాలి
  rationale: ఈ పదం సాధారణ పనుల నుంచి ప్రత్యేకంగా విరమించడాన్ని సూచిస్తుంది. వారపు విశ్రాంతి దినంతో తప్పనిసరిగా సమానీకరించకుండా, పండుగకు సంబంధించిన విశ్రాంతి ఆచరణను ఈ రూపం తెలియజేస్తుంది.
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున కూడా
  rationale: ఏడు రోజుల పండుగతో పాటు ఎనిమిదవ రోజున ఉన్న ప్రత్యేక విశ్రాంతిని స్పష్టంగా వేరు చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- issue: పండుగ నియమాల్లో שַׁבָּתוֹן భావం
  choice: విశ్రాంతి పాటించాలి
  alternative: విశ్రాంతి దినాన్ని పాటించాలి; సంపూర్ణ విశ్రాంతి ఉండాలి
  rationale: ఇది పవిత్ర ఆచరణతో ముడిపడిన పని విరమణను సూచిస్తుంది. కేవలం ‘సబ్బాతు’ అని అనడం వారపు సబ్బాతుతో అతిగా సమానీకరించవచ్చు; ‘విశ్రాంతి పాటించాలి’ ఆ అనిశ్చితిని నిలుపుతూ భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. కాలనిర్ణయం, పంట సమకూర్చడం, పండుగ వ్యవధి, మొదటి మరియు ఎనిమిదవ రోజుల విశ్రాంతి అనే మూలపాఠ నిర్మాణాన్ని నిలిపాం. ‘పండుగ’ మరియు ‘విశ్రాంతి’ పదాల్లో ఉన్న భావవిస్తృతిని పాదసూచికల్లో చూపించాం.
