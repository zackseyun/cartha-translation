    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ప్రకటించాడు
  rationale: פיעל రూపంలోని דבר సాధారణంగా ‘మాట్లాడు’ అని అర్థమిచ్చినా, పండుగల పట్టిక ముగింపులో వాటిని ప్రజలకు తెలియజేసిన భావాన్ని ‘ప్రకటించాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹעֲדֵי
  choice: నియమించిన సమయాలను
  rationale: מוֹעֵד నిర్ణయించబడిన సమయం లేదా సమావేశాన్ని సూచిస్తుంది. ఈ అధ్యాయంలో విశ్రాంతి దినం సహా పవిత్ర పంచాంగమంతా ఉద్దేశించబడినందున ‘పండుగలు’ కంటే ఈ విస్తృత పదబంధం సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: కు
  rationale: మోషే ప్రకటించిన విషయాలకు శ్రోతలను ఈ విభక్తి సహజంగా సూచిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: హీబ్రూ పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పుంలింగ ప్రతినిధి వ్యక్తీకరణను పారదర్శకంగా నిలిపి, ఆధునిక తెలుగులో సహజమైన విభక్తితో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే నిబంధన నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది; అందువల్ల దానిని ఒక బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త సమాప్తి వాక్య నిర్మాణాన్ని నిలిపి, ప్రారంభ וַ־ యొక్క సందర్భానుసార సమాపక భావాన్ని ‘అలా’తో వ్యక్తం చేశాం.
