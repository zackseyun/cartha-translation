id: LEV.8.4
reference: Leviticus 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే మోషే చేశాడు. సమాజం సమావేశ గుడారం ప్రవేశద్వారం దగ్గర కూడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు/నిర్వర్తించు’ అనే విస్తృత అర్థం ఉంది; ఆజ్ఞకు విధేయత చూపిన ఈ సందర్భంలో ‘చేశాడు’ సహజంగా, నేరుగా ఉంటుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: దైవ ఆజ్ఞకు అనుగుణంగా మోషే చేసినట్లు తెలిపే పోలికను, అనుసరణను ‘...ట్లే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను సూచిస్తుంది; ‘ఆజ్ఞాపించిన’ ఆ బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֹתוֹ
  choice: తనకు
  rationale: ఈ సర్వనామం మోషేను సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘యెహోవా తనకు ఆజ్ఞాపించినట్లే’ సహజంగా ఉంటుంది.
- source_word: וַתִּקָּהֵל
  choice: సమావేశమైంది
  rationale: నిఫాల్ రూపం సమాజం ఒకచోట చేరడాన్ని సూచిస్తుంది. తెలుగు ఏకవచన సమూహనామంతో ‘సమావేశమైంది’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇశ్రాయేలు ఒడంబడిక సమాజాన్ని సూచిస్తుంది. సందర్భంలోని సమూహ సమగ్రతను తెలుగులో ‘సమాజమంతా’ సహజంగా తెలియజేస్తుంది.
- source_word: אֶל פֶּתַח
  choice: ప్రవేశద్వారం దగ్గర
  rationale: అక్షరార్థంగా ‘ప్రవేశద్వారం వైపు/వద్ద’ అనే భావం; సమూహం చేరిన గమ్యస్థానాన్ని తెలుగులో ‘దగ్గర’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇది ఇశ్రాయేలు ఆరాధనా గుడారానికి స్థిరమైన తెలుగు బైబిలు పదబంధం; దేవుడు తన ప్రజలను కలుసుకునే గుడారమనే భావాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אֹהֶל מוֹעֵד పదబంధం
  choice: ప్రత్యక్ష గుడారం
  alternative: సమావేశ గుడారం
  rationale: מוֹעֵדకు ‘నియమిత సమయం/స్థలం, సమావేశం’ అనే భావపరిధి ఉంది. తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘ప్రత్యక్ష గుడారం’ దేవుడు అక్కడ ప్రత్యక్షమై కలుసుకునే కార్యాన్ని తెలియజేస్తుంది; ‘సమావేశ గుడారం’ మరింత రూపసామ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు వరుస కార్యాలను రెండు చిన్న వాక్యాలుగా ఇచ్చి పఠన సౌలభ్యాన్ని పెంచాం. మూలంలోని וַתִּקָּהֵל క్రియకు తెలుగులో సహజమైన అకర్మక సమూహార్థక రూపాన్ని వాడాం.
