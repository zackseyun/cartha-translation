  source_fidelity: మూల హీబ్రూలోని యెహోవా మోషేకు ఆజ్ఞాపించిన విధేయతా భావం, అలాగే עֵדָה కూడివచ్చిన భావం ముసాయిదాలో ప్రధానంగా ఉన్నాయి. అయితే אֹהֶל מוֹעֵד అక్షర/ప్రయోగార్థంగా ‘సమావేశ గుడారం’; ‘ప్రత్యక్ష గుడారం’ అనేది సంప్రదాయ వివరణాత్మక పదబంధం కావడంతో మూల పదబంధంలోని ‘meeting’ భావాన్ని ప్రత్యక్షంగా చూపదు. הָעֵדָהకు ‘సమాజమంతా’ అనవసరమైన ‘మొత్తం’ నొక్కుదలను జోడిస్తుంది.
