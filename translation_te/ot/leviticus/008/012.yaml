id: LEV.8.12
reference: Leviticus 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצֹק֙ מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַ/יִּמְשַׁ֥ח אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: te
  text: తర్వాత అతడు కొంత అభిషేక తైలాన్ని అహరోను తలపై పోసి, అతణ్ణి ప్రతిష్ఠించడానికి అభిషేకం చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: పోసి
  rationale: יצק ద్రవాన్ని పోయడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో తదుపరి క్రియతో సహజంగా కలిసేలా ‘పోసి’ అని అనువదించాం.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థాన్ని సూచిస్తుంది; మొత్తం తైలాన్ని కాక దానిలో కొంత పోశాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘అభిషేక తైలం’ యాజక ప్రతిష్ఠాపన సందర్భానికి తగిన స్థిరమైన పదబంధం.
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: అహరోను తలపై
  rationale: స్థానార్థకమైన עַל‌ను ఆధునిక తెలుగులో సహజమైన ‘పై’తో నేరుగా అనువదించాం.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకం చేశాడు
  rationale: משׁחకు యాజక సంబంధమైన ఆచార సందర్భంలో ‘అభిషేకం చేయడం’ ప్రామాణికంగా, అర్థవంతంగా ఉంటుంది.
- source_word: לְקַדְּשׁוֹ
  choice: అతణ్ణి ప్రతిష్ఠించడానికి
  rationale: קדשׁ ఇక్కడ అహరోనును పవిత్ర సేవ కోసం ప్రత్యేకంగా నియమించడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించడం’ ఆ ఆచారపరమైన, సేవాపరమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וַ
  choice: తర్వాత
  rationale: వావ్-కన్సెక్యూటివ్ కథనంలోని తదుపరి కార్యాన్ని ముందుకు నడిపిస్తుంది; ‘తర్వాత’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యాజక ప్రతిష్ఠాపన సందర్భంలో קדשׁ అనువాదం
  choice: అతణ్ణి ప్రతిష్ఠించడానికి
  alternative: అతణ్ణి పవిత్రపరచడానికి
  rationale: ఈ సందర్భంలో పదం అహరోనును యాజక సేవ కోసం ఆచారపూర్వకంగా ప్రత్యేకించడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించడం’ ఈ సేవా-ఆచార భావాన్ని కాపాడుతూ, పదాన్ని కేవలం నైతిక పవిత్రతగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే యాజక ఆచారానికి చెందిన ‘అభిషేక తైలం’, ‘ప్రతిష్ఠించడం’ వంటి గౌరవప్రదమైన పదజాలం నిలుపబడింది.
