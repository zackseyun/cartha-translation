  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: te
  text: తరువాత మోషే వాటిని వారి అరచేతుల మీద నుండి తీసుకొని, బలిపీఠం మీద దహనబలిపై వాటిని కాల్చాడు. అవి ఇంపైన సువాసనగా ఉండే ప్రతిష్ఠాపన అర్పణలు[a]; అది యెహోవాకు అగ్న్యర్పణ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నియామక బలి.” హెబ్రీ మִלֻּאִים అనేది యాజకులను వారి సేవలో ప్రతిష్ఠించే ఆచారంలో ఉపయోగించే బలికి సంబంధించిన సాంకేతిక పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆహార అర్పణ.” హెబ్రీ పదం అగ్నిపై అర్పించే బలిని లేదా దేవునికి సమర్పించే ఆహార కానుకను సూచించవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ క్రియను కథన క్రమానికి సహజంగా ‘తీసుకొని’ అని అనువదించాం.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: వారి అరచేతుల మీద నుంచి
  rationale: כַּפִּים ఇక్కడ చేతుల అరలను సూచిస్తుంది; ‘అరచేతుల మీద నుంచి’ అనేది మూలంలోని מֵעַל భావాన్నీ ఆచార సంబంధమైన చర్యనూ స్పష్టంగా ఉంచుతుంది.
- source_word: וַיַּקְטֵר
  choice: కాల్చాడు
  rationale: బలి సందర్భంలో హిఫిల్ రూపం బలిని బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘కాల్చాడు’ సహజంగా ఉండి సందర్భం ద్వారా బలి భావం స్పష్టమవుతుంది.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: దహనబలి పైన బలిపీఠం మీద
  rationale: దిశాసూచక రూపం బలిపీఠాన్ని చర్య జరిగే స్థలంగా చూపుతుంది; עַל ను దాని సహజమైన ‘పైన’ అనే అర్థంతో ఉంచాం.
- source_word: מִלֻּאִים
  choice: ప్రతిష్ఠాపన బలి
  rationale: యాజకులను వారి సేవలో నియమించి ప్రతిష్ఠించే ఆచారానికి సంబంధించిన సాంకేతిక పదం ఇది. ‘ప్రతిష్ఠాపన బలి’ ఆధునిక తెలుగు పాఠకులకు ఆ ఆచార విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: ఇది బలి దేవునికి ఆమోదకరంగా ఉండటాన్ని తెలిపే స్థిరమైన యాజక సంబంధిత నుడికారం. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘ఇంపైన సువాసన కలిగించే’ అని ఇచ్చాం.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఈ యాజక సంబంధిత సాంకేతిక పదం అగ్నిపై అర్పించబడే బలిని సూచిస్తుంది. మూలంలోని అగ్ని సంబంధాన్ని స్పష్టంగా ఉంచుతూ, పదం విషయంలో ఉన్న ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో నమోదు చేశాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామం יהוה ను తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
theological_decisions:
- issue: మִלֻּאִים అనే యాజక ప్రతిష్ఠాపన సాంకేతిక పదం
  choice: ప్రతిష్ఠాపన బలి
  alternative: నియామక బలి
  rationale: సందర్భం అహరోను, అతని కుమారుల యాజక ప్రతిష్ఠాపన ఆచారం. ‘ప్రతిష్ఠాపన’ ఆ నిర్దిష్ట ఆచారాన్ని తెలుపుతుంది; తరువాతి సంఘ వ్యవస్థలను అనవసరంగా ఇందులోకి తీసుకురాదు.
- issue: אִשֶּׁה అనే బలి పదం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదానికి అగ్నిపై అర్పించే బలి అనే సాంప్రదాయ అవగాహన ఉంది; కొందరు దాన్ని దేవునికి సమర్పించే ఆహార కానుకగా గ్రహిస్తారు. ప్రధాన పాఠం ఆచార చర్యను స్పష్టంగా చెబుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి నిజమైన పదార్థ అనిశ్చితిని కాపాడాం.
- issue: బహువచన הֵם నుంచి ఏకవచన הוּא కు మార్పు
  choice: ‘అవి …; అది …’ అని వ్యాకరణ మార్పును నిలిపివేయడం
  alternative: రెండు భాగాలనూ బహువచనంగా సవరించడం
  rationale: మూలపాఠం మొదట అర్పించిన భాగాలను బహువచనంలో పేర్కొని, తరువాత మొత్తం అర్పణను ఏకవచనంలో వర్ణిస్తుంది. ఆ ఉద్రిక్తతను సాఫీ చేయకుండా తెలుగులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. యాజక ఆచారానికి చెందిన సాంకేతిక పదాలను అవసరమైనంత స్పష్టంగా ఉంచి, మూలంలోని బహువచన–ఏకవచన మార్పును అలాగే నిలిపాం.
