revisions:
- from: తర్వాత మోషే వాటిని వారి అరచేతుల మీద నుంచి తీసుకొని, దహనబలి పైన బలిపీఠం మీద వాటిని కాల్చాడు. అవి ఇంపైన సువాసన కలిగించే ప్రతిష్ఠాపన బలి[a]; అది యెహోవాకు అగ్నితో అర్పించే అర్పణ[b].
