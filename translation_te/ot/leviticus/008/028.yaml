  rationale: 'స్థానసూచక పదబంధాలను హీబ్రూ అర్థానికి అనుగుణంగా స్పష్టపరిచాం: కాల్చడం బలిపీఠం మీద జరుగుతుంది, కాల్చబడిన భాగాలు దహనబలిపై ఉంటాయి. బలి-సువాసన సూత్రాన్ని సహజ తెలుగు శైలిలో సవరించాం. మూలంలో ఉన్న ‘అవి’ (బహువచనం) నుంచి ‘అది’ (ఏకవచనం) మార్పును అలాగే నిలిపాం; పాదసూచికల గుర్తులు, ప్రత్యామ్నాయాలు కూడా కాపాడాం.'
