  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: te
  text: అతడు దానిని వధించాడు. మోషే దాని రక్తంలోనుండి కొంత తీసుకొని, అహరోను కుడి చెవి లోబుపై[a], అతని కుడిచేతి బొటనవేలిపై, అతని కుడికాలి పెద్ద బొటనవేలిపై ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోను కుడి చెవికొనపై.’
    reason: תְּנוּךְ అనే అరుదైన శరీరనిర్మాణ పదం చెవి లోబును లేదా చెవి చివరి భాగాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: అతడు దానిని వధించాడు
  rationale: బలి అర్పణ సందర్భంలో ఈ క్రియ ఆచారబద్ధమైన వధను సూచిస్తుంది; కాబట్టి సాధారణమైన ‘చంపాడు’ కంటే ‘వధించాడు’ ఖచ్చితమైనది. కర్మను సందర్భం నుంచి సహజంగా చేర్చాం.
- source_word: מִדָּמוֹ
  choice: దాని రక్తంలో కొంత
  rationale: מִן ఇక్కడ మొత్తం రక్తం కాక దానిలో కొంత తీసుకున్నాడనే భావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: యాజక ప్రతిష్ఠా ఆచారంలో ఈ పదబంధం చెవి వెలుపలి చివరి భాగాన్ని సూచిస్తుంది. ‘చెవి తమ్మె’ సాధారణ పాఠకునికి స్పష్టమైన తెలుగు పదం; ‘చెవి కొన’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַיְמָנִית
  choice: కుడి
  rationale: ఈ విశేషణం శరీరంలోని కుడివైపు అవయవాన్ని నిర్దిష్టంగా సూచిస్తుంది; ‘కుడి చెవి/చెయ్యి/కాలు’ తెలుగు వాడుకకు సహజం.
- source_word: בֹּהֶן יָדוֹ
  choice: అతని కుడిచేతి బొటనవేలు
  rationale: చేతికి సంబంధించినప్పుడు בֹּהֶן బొటనవేలును నిర్దిష్టంగా సూచిస్తుంది.
- source_word: בֹּהֶן רַגְלוֹ
  choice: అతని కుడికాలి బొటనవేలు
  rationale: కాలికి సంబంధించినప్పుడు בֹּהֶן పెద్దవేలును సూచిస్తుంది; తెలుగులో ‘కాలి బొటనవేలు’ సహజంగా ఆ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: וַיִּתֵּן עַל
  choice: పై పూశాడు
  rationale: రక్తాన్ని శరీర భాగాలపై ఉంచే ఈ ఆచార సందర్భంలో ‘పూశాడు’ సహజంగా చర్యను తెలియజేస్తుంది; మూలంలోని సాధారణ చర్యను అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: బలి రక్తాన్ని అహరోను శరీరపు చివరి భాగాలపై పూయడం
  choice: ఆచార చర్యను ఉన్నదున్నట్లుగా వర్ణించడం; దాని ప్రతీకాత్మక అర్థాన్ని ప్రధాన వాక్యంలో చేర్చకపోవడం
  alternative: ఈ చర్య యాజక ప్రతిష్ఠను లేదా వినికిడి, సేవ, నడకల సమర్పణను సూచిస్తుందని వాక్యంలోనే వివరించడం
  rationale: హీబ్రూ వాక్యం చర్యను మాత్రమే వర్ణిస్తుంది. సందర్భంలో దానికి ధార్మిక ప్రాముఖ్యత ఉన్నా, అనువాదం వచనం చెప్పని ప్రతీకాత్మక వివరణను జోడించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. బలి సందర్భానికి ‘వధించాడు’ను, రక్తాన్ని శరీర భాగాలపై ఉంచడాన్ని సహజంగా చెప్పడానికి ‘పూశాడు’ను ఎంచుకున్నాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
