source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: te
  text: అతని తలపై తలపాగాను పెట్టాడు. ఆ తలపాగా ముందు భాగంలో పవిత్ర కిరీటమైన బంగారు పలకను అమర్చాడు, యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: తలపాగా
  rationale: యాజకుడు ధరించే ప్రత్యేక శిరోవస్త్రాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తలపాగా’ స్పష్టంగా, సహజంగా ఉండి మూలపద భావాన్ని నిలుపుతుంది.
- source_word: אֶל מוּל פָּנָיו
  choice: ముందు భాగంలో
  rationale: ఇది అహరోను ముఖానికి ఎదురుగా విడిగా ఉంచడాన్ని కాక, తలపాగా ముందువైపున పలకను అమర్చడాన్ని సూచిస్తుంది.
- source_word: צִיץ
  choice: పలక
  rationale: ఈ యాజక వస్త్ర సందర్భంలో బంగారంతో చేసిన, తలపాగాకు అమర్చే వస్తువును సూచిస్తుంది; పదానికి ఇతర సందర్భాల్లో ‘పువ్వు’ లేదా ‘అలంకారం’ అనే భావాలు ఉన్నా ఇక్కడ ‘పలక’ సందర్భోచితం.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: పవిత్ర కిరీటం
  rationale: బంగారు పలకను మరింతగా గుర్తించే సమానాధికరణ పదబంధం. ‘పవిత్ర కిరీటం’ మూలానికి దగ్గరగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; ‘పవిత్ర శిరోభూషణం’ కూడా సాధ్యమే.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదం చేసింది.
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: పెట్టాడు ... అమర్చాడు
  rationale: మూలంలో ఒకే క్రియ రెండుసార్లు ఉంది. మొదట తలపాగాను ధరింపజేయడం, తరువాత దానిపై పలకను బిగించడం అనే సందర్భానుసార చర్యలను సహజ తెలుగులో వేర్వేరు క్రియలతో తెలిపింది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే
  rationale: దైవ ఆజ్ఞకు చర్య సరిగ్గా అనుగుణంగా జరిగిందనే పోలిక, నెరవేర్పు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని ధ్వన్యనువాదం చేయడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: נֵזֶר הַקֹּדֶשׁ యొక్క గుర్తింపు
  choice: బంగారు పలకను వివరించే ‘పవిత్ర కిరీటం’
  alternative: పవిత్ర శిరోభూషణం
  rationale: హీబ్రూ వాక్యంలో ఇది బంగారు పలకకు సమానాధికరణంగా ఉంది. దాన్ని వేరొక వస్తువుగా చూపకుండా అదే వస్తువుకు పవిత్ర స్థితి లేదా గౌరవాన్ని తెలిపే పేరుగా అనువదించింది; పదంలోని ‘కిరీటం/శిరోభూషణం’ అవకాశాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడింది. మూలంలోని ‘అతని/అతడు’ అనే సర్వనామాలను ఉంచి, ఈ ఒక్క వచనంలో లేని ‘అహరోను’ పేరును చేర్చలేదు. చివరి వాక్యంలో సహజ తెలుగు కోసం అంతర్భూత క్రియను స్పష్టంగా ‘అతడు చేశాడు’ అని వ్యక్తం చేసింది.
