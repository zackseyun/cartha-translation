id: LEV.8.33
reference: Leviticus 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: te
  text: మీ ప్రతిష్ఠాపన దినాలు పూర్తయ్యే రోజు వరకు, ఏడు రోజులపాటు మీరు సమావేశ గుడారపు ప్రవేశద్వారం నుండి బయటికి వెళ్లకూడదు. ఎందుకంటే ఏడు రోజులపాటు ఆయన మిమ్మల్ని ప్రతిష్ఠిస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ చేతిని నింపుతాడు.” ఇది ఒకరిని యాజక సేవకు నియమించడం లేదా ప్రతిష్ఠించడం అనే అర్థమిచ్చే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారపు ప్రవేశద్వారం నుండి
  rationale: פֶּתַח యొక్క స్థలార్థాన్ని ‘ప్రవేశద్వారం’గా, אֹהֶל מוֹעֵד అనే పరిశుద్ధస్థల నామాన్ని దాని మూలార్థానికి దగ్గరగా ‘సమావేశ గుడారం’గా అందించింది.
- source_word: לֹא תֵצְאוּ שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు ... బయటికి వెళ్లకూడదు
  rationale: నిషేధాత్మక ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కాలవ్యవధిని స్పష్టంగా నిలిపింది.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: మీ ప్రతిష్ఠాపన దినాలు పూర్తయ్యే రోజు వరకు
  rationale: מִלֻּאִים యొక్క యాజక సేవలో నియామకార్థాన్ని ‘ప్రతిష్ఠాపన’గా వ్యక్తం చేసి, హెబ్రీ కాలపరిమితి నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా మార్చింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఏడు రోజుల నిషేధానికి కారణాన్ని పరిచయం చేసే సంధానార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: అతడు మీ చేతులను నింపుతాడు
  rationale: ‘చేతిని నింపడం’ అనే యాజక ప్రతిష్ఠాపనకు సంబంధించిన హెబ్రీ సాంకేతిక నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటీపులో వివరించింది. ఏకవచన కర్తను ‘అతడు’గా ఉంచి మూలంలోని సూచనను అనవసరంగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: מלא את־יד అనే యాజక ప్రతిష్ఠాపన నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘మీ చేతులను నింపుతాడు’ అని నిలిపి, పాదటీపులో దాని భావాన్ని వివరించడం
  alternative: ‘మిమ్మల్ని యాజకులుగా ప్రతిష్ఠిస్తాడు’ లేదా ‘మిమ్మల్ని నియమిస్తాడు’
  rationale: మూలపాఠంలోని ఆచారపరమైన రూపకాన్ని తొలగించకుండా కాపాడుతుంది; అదే సమయంలో పాదటీపు సాధారణ పాఠకునికి దాని సాంకేతిక భావాన్ని తెలియజేస్తుంది.
- issue: יְמַלֵּא క్రియకు ఉన్న అవ్యక్త ఏకవచన కర్త
  choice: ‘అతడు’ అని మాత్రమే అనువదించడం
  alternative: సందర్భం ఆధారంగా ‘మోషే’ అని స్పష్టీకరించడం
  rationale: హెబ్రీ వాక్యం కర్త పేరును ఈ వచనంలో చెప్పదు; అందువల్ల మూలంలోని సూచనాత్మక స్వభావాన్ని నిలిపి, వ్యాఖ్యానాత్మక స్పష్టీకరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా సహజమైన ఆజ్ఞారూపాన్ని ఉపయోగిస్తూ, పరిశుద్ధస్థల మరియు యాజక ప్రతిష్ఠాపన పదజాలంలో గౌరవప్రదమైన శైలిని నిలిపింది. మూలంలోని సాంకేతిక నుడికారాన్ని పాదటీపు సహాయంతో సంరక్షించింది.
