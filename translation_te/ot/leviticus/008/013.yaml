  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: తరువాత మోషే అహరోను కుమారులను దగ్గరకు తీసుకువచ్చి[a], వారికి అంగీలు తొడిగించి, నడికట్లు కట్టి[b], వారి తలలకు తలకప్పులు బిగించాడు; యాహ్వే[c] మోషేకు ఆజ్ఞాపించినట్టే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోను కుమారులను సమర్పించి.’ హీబ్రూ క్రియకు ‘దగ్గరకు తీసుకురావడం’ అనే అర్థంతో పాటు, ఆచార సందర్భంలో ‘సమర్పించడం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యంలో ‘నడికట్టు’ ఏకవచనంలో ఉంది; భావం ఒక్కొక్క కుమారునికి ఒక్క నడికట్టు కట్టాడని.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ మూలంలో YHWH అనే దైవనామం ఉంది; దానిని సంప్రదాయంగా ‘ప్రభువు’ అని కూడా అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరికి తీసుకొచ్చి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరికి తీసుకురావడం’ లేదా ఆచార సందర్భంలో ‘సమర్పించడం’ అని అర్థమివ్వగలదు. ప్రధాన పాఠం మూలంలోని స్థానిక-ఆచార భావాన్ని అతిగా సాంకేతికీకరించకుండా నిలుపుతుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులను
  rationale: హీబ్రూ సమాసబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: వారికి అంగీలు తొడిగించి
  rationale: לבשׁ హిఫీల్ ఇతరులకు వస్త్రాలు తొడిగించడాన్ని సూచిస్తుంది; כֻּתֹּנֶת పొడవైన చొక్కా వంటి ప్రాథమిక యాజక వస్త్రం. ‘అంగీలు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: నడికట్లు కట్టి
  rationale: חגר నడుము చుట్టూ కట్టడాన్ని, אַבְנֵט వస్త్రంతో చేసిన యాజక నడికట్టును సూచిస్తాయి. హీబ్రూలో నామవాచకం ఏకవచనంలో ఉన్నా, బహువచన కర్మతో పంపిణీ భావం—ఒక్కొక్కరికి ఒక్క నడికట్టు—ఉంది.
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: వారి తలలపై టోపీలు బిగించాడు
  rationale: חבשׁ కేవలం పెట్టడం కంటే కట్టి లేదా బిగించి అమర్చడాన్ని సూచిస్తుంది. מִגְבָּעוֹת సాధారణ యాజకుల ప్రత్యేక శిరోవస్త్రాలు; ఇవి ప్రధాన యాజకుని తలపాగాకు భిన్నమైనవి.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టే అతడు చేశాడు
  rationale: ఆజ్ఞకు మోషే సరిగ్గా లోబడినట్లు తెలిపే పునరావృత విధేయత సూత్రాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అతడు చేశాడు’ అనేది హీబ్రూలో సందర్భానుసారంగా గ్రహించబడే ప్రధాన క్రియను తెలుగులో పూరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ‘యాహ్వే’ అనే పునర్నిర్మిత ఉచ్చారణకు బదులు ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: యాజకుల సమర్పణకు సంబంధించిన וַיַּקְרֵב భావం
  choice: దగ్గరికి తీసుకొచ్చి
  alternative: సమర్పించి
  rationale: ఆచార సందర్భాన్ని గుర్తించినప్పటికీ, హీబ్రూ క్రియలోని ‘దగ్గరికి తీసుకురావడం’ మరియు ‘సమర్పించడం’ అనే సాధ్యార్థాలలో ఒక్కదానిని మాత్రమే బలవంతంగా నిర్ణయించకుండా ప్రధాన పాఠంలో ప్రాథమిక భావాన్ని, పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. యాజక వస్త్రాల కోసం సాధారణ పాఠకులకు అర్థమయ్యే ‘అంగీలు’, ‘నడికట్లు’, ‘టోపీలు’ వాడి, క్రియల్లో ఆచారపూర్వక వస్త్రధారణ భావాన్ని నిలిపాం. హీబ్రూ సంధాన శ్రేణిని తెలుగులో అతిగా పునరావృతం చేయకుండా, చివరి విధేయత సూత్రాన్ని పూర్తి వాక్యంగా తీర్చిదిద్దాం.
