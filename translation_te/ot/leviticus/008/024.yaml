source:
  edition: WLC
  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: te
  text: తర్వాత మోషే అహరోను కుమారులను దగ్గరకు తీసుకొచ్చాడు. వారి కుడి చెవి తమ్మెపై, కుడిచేతి బొటనవేలిపై, కుడికాలి బొటనవేలిపై కొంత రక్తాన్ని పూశాడు. ఆ తర్వాత మోషే బలిపీఠం మీద చుట్టూ రక్తాన్ని చల్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు తీసుకొచ్చాడు
  rationale: హిఫీల్ రూపంలోని ‘సమీపింపజేయడం/దగ్గరకు తీసుకురావడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תְּנוּךְ אָזְנָם הַיְמָנִית
  choice: వారి కుడి చెవి తమ్మెపై
  rationale: తְּנוּךְ అనే అరుదైన శరీర భాగ పదాన్ని సందర్భానుసారంగా చెవి తమ్మెగా అనువదించడం తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בֹּהֶן יָדָם הַיְמָנִית
  choice: కుడిచేతి బొటనవేలిపై
  rationale: בֹּהֶן చేతికి సంబంధించినప్పుడు బొటనవేలును సూచిస్తుంది.
- source_word: בֹּהֶן רַגְלָם הַיְמָנִית
  choice: కుడికాలి బొటనవేలిపై
  rationale: అదే పదం కాలికి సంబంధించినప్పుడు కాలి బొటనవేలును సూచిస్తుంది.
- source_word: וַיִּזְרֹק
  choice: చిలకరించాడు
  rationale: బలిపీఠంపై రక్తాన్ని ఆచారబద్ధంగా విసరడం లేదా చల్లడం అనే క్రియను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘విసిరాడు’ అనడం ద్రవాన్ని ప్రయోగించే భావాన్ని అస్పష్టంగా చేయవచ్చు.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: బలిపీఠపు అన్ని వైపులా రక్తం ప్రయోగించబడిందనే ప్రాదేశిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రక్తాన్ని శరీర భాగాలపై పెట్టే ప్రతిష్ఠాపన ఆచారానికి ప్రతీకాత్మక అర్థం
  choice: పాఠ్యంలో ఉన్న చర్యను మాత్రమే అనువదించడం
  alternative: చెవి, చేయి, కాలు వరుసగా వినడం, సేవ చేయడం, నడవడం అని వివరణను చేర్చడం
  rationale: మూల వచనం ఆ ప్రతీకాత్మక వివరణను ప్రత్యక్షంగా ఇవ్వదు; అందువల్ల ఏ ప్రత్యేక వ్యాఖ్యాన సంప్రదాయాన్నీ పాఠ్యంలోకి చేర్చలేదు.
- issue: రక్త పరిమాణం
  choice: శరీర భాగాలకు ‘కొంత రక్తాన్ని’; తరువాత ‘మిగిలిన రక్తాన్ని’
  alternative: రెండు చోట్లా కేవలం ‘రక్తాన్ని’
  rationale: מִן־הַדָּם మొదటి చర్యలో రక్తంలో కొంత అనే భావాన్ని ఇస్తుంది. చివరి אֶת־הַדָּם సందర్భంలో మిగిలిన రక్తాన్ని సూచిస్తుందని సహజంగా వ్యక్తం చేశాం, అయితే ‘మిగిలిన’ అనేది సందర్భస్పష్టీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది. అహరోను కుమారులందరికీ వర్తించే బహువచన స్వామ్యాన్ని ‘వారి’ ద్వారా స్పష్టంగా ఉంచాం. మూలంలోని వరుస చర్యలను రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యం కల్పించాం.
