source:
  edition: WLC
  text: וַ/יִּקַּ֗ח אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וַ/יַּקְטֵ֥ר מֹשֶׁ֖ה הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: te
  text: మోషే లోపలి అవయవాలపై ఉన్న కొవ్వంతటినీ, కాలేయానికి అంటివున్న భాగాన్ని[a], రెండు మూత్రపిండాలనూ వాటి కొవ్వునూ తీసుకొని, వాటిని బలిపీఠం మీద దహనం చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలేయపు లోబును.’ హీబ్రూ పదం బలి సిద్ధం చేసేటప్పుడు కాలేయం నుండి వేరు చేసే ఒక నిర్దిష్ట భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: బలి సందర్భంలో ఈ క్రియకు మరింత నిర్దిష్టంగా ‘పొగగా పైకి లేచేలా కాల్చాడు’ లేదా ‘పొగగా అర్పించాడు’ అనే అర్థం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח క్రియ ఇక్కడ కథన క్రమంలో ‘తీసుకున్నాడు’ అనే అర్థాన్ని ఇస్తుంది. తరువాతి క్రియతో సహజమైన తెలుగు వాక్యంగా కలపడానికి ‘తీసుకొని’ అని అనువదించబడింది; కర్త మోషే అని తరువాతి హీబ్రూ భాగం స్పష్టం చేస్తుంది.
- source_word: כָּל הַחֵלֶב
  choice: కొవ్వంతటినీ
  rationale: బలి సందర్భంలో חֵלֶב అర్పణకు కేటాయించిన కొవ్వు భాగాలను సూచిస్తుంది; ‘కొవ్వంతటినీ’ మూలంలోని כָּל భావాన్ని కూడా సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: లోపలి అవయవాలపై ఉన్న
  rationale: קֶרֶב ఇక్కడ జంతువు లోపలి భాగాలు లేదా అంతరావయవాలను సూచిస్తుంది. ‘లోపలి అవయవాలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, కేవలం పేగులకే అర్థాన్ని పరిమితం చేయదు.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: కాలేయపు తమ్మెను
  rationale: ఈ బలి సంబంధ పదబంధం కాలేయం నుండి వేరు చేసే ఒక నిర్దిష్ట భాగాన్ని, సాధారణంగా దాని తమ్మె లేదా అనుబంధ భాగాన్ని, సూచిస్తుంది. ‘తమ్మె’ సంక్షిప్తమైన శరీర నిర్మాణ పదం; అసలు పదంలోని స్వల్ప అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలనూ
  rationale: హీబ్రూలోని ద్వివచన శరీర నిర్మాణ సూచనను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: חֶלְבְּהֶן
  choice: వాటి కొవ్వునూ
  rationale: స్త్రీలింగ బహువచన ప్రత్యయం ముందు పేర్కొన్న మూత్రపిండాలను సూచిస్తుంది; ‘వాటి కొవ్వు’ ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיַּקְטֵר
  choice: దహనం చేశాడు
  rationale: קטר బలి సందర్భంలో బలిపీఠంపై కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. ‘దహనం చేశాడు’ గంభీరమైన, సహజమైన ప్రధాన అనువాదం; ప్రత్యేక బలి భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశ లేదా స్థలాన్ని సూచించే రూపం ఇక్కడ కాల్చిన స్థలాన్ని తెలియజేస్తుంది; ‘బలిపీఠం మీద’ ఆధునిక తెలుగులో సహజం.
