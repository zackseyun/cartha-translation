translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా మరియు ఆచార సంబంధ గంభీరత నిలిచేలా రూపొందించబడింది. హీబ్రూ కథనంలోని రెండు వరుస క్రియలను సహజ తెలుగు వాక్య నిర్మాణంలో ‘తీసుకొని … దహనం చేశాడు’గా కలిపాం. ఆంగ్ల సంప్రదింపు పాఠంలోని పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, కాలేయ భాగానికి [a], దహన క్రియకు [b] ఉంచి వాటి అసలు శాబ్దిక అంశాలకు సరిపోల్చాం.
