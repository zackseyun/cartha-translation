source:
  edition: WLC
  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: te
  text: అతడు దానిని వధించాడు. మోషే రక్తాన్ని తీసుకుని, తన వేలితో బలిపీఠపు కొమ్ములపై చుట్టూరా పూసి, బలిపీఠాన్ని శుద్ధి చేశాడు.[a] ఆ రక్తాన్ని బలిపీఠపు అడుగుభాగం దగ్గర కుమ్మరించి, బలిపీఠం కోసం ప్రాయశ్చిత్తం చేయడానికి దానిని ప్రతిష్ఠించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలిపీఠాన్ని శుభ్రపరిచాడు.’ ఇక్కడి హెబ్రీ క్రియ పాపం చేయించడాన్ని కాదు, ఆచారపరమైన అపవిత్రతను తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానిపై ప్రాయశ్చిత్త క్రియ చేయడానికి,’ లేదా ‘దానిని శుద్ధి చేయడానికి.’ హెబ్రీ పదబంధం బలి ద్వారా జరిగే ప్రాయశ్చిత్తం లేదా శుద్ధీకరణ భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: అతడు దానిని వధించాడు
  rationale: బలి అర్పణ సందర్భంలో שׁחט సాధారణంగా చంపడాన్ని కాక ఆచారబద్ధమైన వధను సూచిస్తుంది. కర్మను ముందరి సందర్భం నుంచి సహజంగా సరఫరా చేశాం.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములు
  rationale: బలిపీఠం మూలల వద్ద ఉన్న కొమ్మువంటి పొడవులను సూచించే యాజక సంబంధిత స్థిర పదబంధాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: סָבִיב בְּאֶצְבָּעוֹ
  choice: తన వేలితో ... చుట్టూ
  rationale: ఏకవచనమైన אֶצְבָּעను ‘వేలు’గా, రక్తాన్ని అన్ని వైపులా పూసిన భావాన్ని ‘చుట్టూ’గా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: బలిపీఠాన్ని శుద్ధి చేశాడు
  rationale: యాజక ఆచార సందర్భంలోని חטא పియేల్ రూపం పాపం చేయించడాన్ని కాదు, అపవిత్రతను తొలగించి ఆచారపరంగా శుద్ధి చేయడాన్ని సూచిస్తుంది.
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠపు అడుగు భాగం దగ్గర కుమ్మరించాడు
  rationale: יְסוֹד ఇక్కడ బలిపీఠపు పునాది లేదా అడుగు భాగాన్ని సూచిస్తుంది; יָצַקకు ‘కుమ్మరించాడు’ సహజమైన క్రియ.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: దాన్ని ప్రతిష్ఠించాడు
  rationale: קדשׁ ఇక్కడ బలిపీఠాన్ని పవిత్ర వినియోగం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించాడు’ ఆచార సందర్భంలో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: לְכַפֵּר עָלָיו
  choice: దాని కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: כפר యొక్క బలి-ఆచార సంబంధిత గంభీరతను ‘ప్రాయశ్చిత్తం చేయడం’ నిలుపుతుంది. עַל వల్ల బలిపీఠమే ఈ క్రియకు సంబంధించిన వస్తువని ‘దాని కోసం’ స్పష్టం చేస్తుంది; దాని ఖచ్చిత సంబంధంపై ఉన్న సూక్ష్మతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యాజక శుద్ధీకరణ సందర్భంలో חטא అర్థం
  choice: బలిపీఠాన్ని శుద్ధి చేశాడు
  alternative: బలిపీఠాన్ని పవిత్రంగా శుభ్రపరిచాడు
  rationale: ఈ రూపం బలిపీఠం పాపం చేసిందని సూచించదు; రక్తక్రియ ద్వారా అది ఆచారపరంగా శుద్ధి చేయబడిందనే భావాన్ని కాపాడుతుంది.
- issue: బలి సందర్భంలో כפר మరియు עַל సంబంధం
  choice: దాని కోసం ప్రాయశ్చిత్తం చేయడానికి
  alternative: దానిపై ప్రాయశ్చిత్త క్రియ చేయడానికి; దాన్ని పరిహార శుద్ధి చేయడానికి
  rationale: ‘ప్రాయశ్చిత్తం’ హెబ్రీ క్రియ యొక్క ఆచార, ధార్మిక బరువును నిలుపుతుంది. עַלను కేవలం స్థలార్థకమైన ‘మీద’గా తేల్చకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండడంతో పాటు లేవీయకాండంలోని ఆచార గాంభీర్యాన్ని నిలిపే పదజాలం. ‘బలిపీఠం,’ ‘శుద్ధి,’ ‘ప్రతిష్ఠ,’ ‘ప్రాయశ్చిత్తం’ వంటి స్థిరమైన బైబిలు పదాలను వాడి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా విభజించాం.
