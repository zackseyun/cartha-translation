id: LEV.8.21
reference: Leviticus 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: te
  text: అతడు లోపలి భాగాలను, కాళ్లను నీళ్లతో కడిగాడు. మోషే ఆ పొట్టేలును మొత్తంగా బలిపీఠం మీద దహించాడు. అది యహ్వేకు ఇంపైన సువాసనగా ఉండే దహనబలి, అగ్న్యర్పణం[a]. యహ్వే మోషేకు ఆజ్ఞాపించినట్టే అతడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వేకు ఆహార అర్పణం.”
    reason: అִשֶּׁה ప్రధానంగా అగ్ని ద్వారా అర్పించే బలిని సూచిస్తుంది; యాజక సందర్భంలో బలిపీఠంపై దేవునికి సమర్పించే ఆహార అర్పణం అనే సందర్భార్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: లోపలి భాగాలు
  rationale: బలి జంతువు అంతర్గత అవయవాలను సూచించే విస్తృత పదం; ‘పేగులు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: הַכְּרָעַיִם
  choice: కాళ్లు
  rationale: బలి జంతువు కాళ్లను, ముఖ్యంగా కింది భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన స్పష్టమైన రూపం.
- source_word: רָחַץ בַּמָּיִם
  choice: నీళ్లతో కడిగాడు
  rationale: మూలంలో నీటిని స్పష్టంగా పేర్కొన్నందున ఆ ఆచార సంబంధమైన వివరాన్ని నిలిపింది.
- source_word: וַיַּקְטֵר
  choice: దహించాడు
  rationale: బలిపీఠం మీద బలిని కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచించే యాజక సంబంధమైన క్రియ; తెలుగులో సహజంగా ఉండే ‘దహించాడు’ సందర్భార్థాన్ని అందిస్తుంది.
- source_word: כָּל הָאַיִל
  choice: ఆ పొట్టేలంతటినీ
  rationale: మొత్తం జంతువునే అర్పించినట్లు כָּל ఇచ్చే సంపూర్ణతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలిపీఠం మీద పూర్తిగా దహింపబడే ఈ బలి వర్గానికి తెలుగులో స్థిరమైన, అర్థవంతమైన పదం.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: దేవునికి ఆమోదకరమైన బలిని సూచించే ఇంద్రియ రూపకాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: אִשֶּׁה
  choice: అగ్న్యర్పణం
  rationale: అగ్ని ద్వారా అర్పించే బలి అనే ప్రధాన భావాన్ని నేరుగా అందిస్తుంది; ‘ఆహార అర్పణ’ అనే సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యహ్వే మోషేకు ఆజ్ఞాపించినట్టే
  rationale: మోషే చేసిన కార్యం దైవాజ్ఞకు సరిగ్గా అనుగుణంగా ఉందనే మూలంలోని అనుసరణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నిబంధన సంబంధమైన వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా ఆమోదితమైన లిప్యంతరీకరణతో అందించింది.
- issue: לְרֵיחַ נִיחֹחַ అనే బలి సంబంధమైన పదబంధం
  choice: యహ్వేకు ఇంపైన సువాసన కలిగించే
  alternative: యహ్వేకు ఆమోదకరమైన
  rationale: ‘ఆమోదకరమైన’ అని భావాన్ని మాత్రమే చెప్పకుండా, మూలంలోని సువాసన రూపకాన్నీ దాని దైవశాస్త్రీయ ఉద్వేగాన్నీ నిలుపుతుంది.
- issue: אִשֶּׁה యొక్క అర్థం
  choice: అగ్న్యర్పణం
  alternative: యహ్వేకు ఆహార అర్పణ
  rationale: పదం అగ్నితో అర్పించే బలిని సూచిస్తుంది; యాజక సాహిత్యంలో కనిపించే ‘బలిపీఠపు ఆహారం’ భావం సాధ్యమైనందున దాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. బలి సంబంధమైన సాంకేతిక పదాలకు ‘దహనబలి’, ‘అగ్న్యర్పణం’ వాడి, అరుదైన శరీర నిర్మాణ పదానికి బదులుగా ‘లోపలి భాగాలు’ ఎంచుకున్నాం.
