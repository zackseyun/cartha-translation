revisions:
- from: అతడు లోపలి భాగాలను, కాళ్లను నీళ్లతో కడిగాడు. మోషే ఆ పొట్టేలంతటినీ బలిపీఠం మీద దహించాడు. అది యహ్వేకు ఇంపైన సువాసన కలిగించే దహనబలి, అగ్న్యర్పణం[a]—యహ్వే మోషేకు ఆజ్ఞాపించినట్టే.
  to: అతడు లోపలి భాగాలను, కాళ్లను నీళ్లతో కడిగాడు. మోషే ఆ పొట్టేలును మొత్తంగా బలిపీఠం మీద దహించాడు. అది యహ్వేకు ఇంపైన సువాసనగా ఉండే దహనబలి, అగ్న్యర్పణం[a]. యహ్వే మోషేకు ఆజ్ఞాపించినట్టే అతడు చేశాడు.
  rationale: The revision clarifies that Moses acted in accordance with Yahweh’s command, while retaining every principal element of the Hebrew. It also smooths the Telugu expression for the stock sacrificial phrase “a pleasing aroma” without reducing it to an abstract statement of acceptance.
