  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: te
  text: తరువాత అతడు దహనబలికి ఉద్దేశించిన పొట్టేలును సమీపానికి తీసుకొచ్చాడు[a]. అహరోను, అతని కుమారులు ఆ పొట్టేలు తలపై తమ చేతులు ఉంచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమర్పించాడు,’ ‘ముందుకు తీసుకొచ్చాడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ క్రియను ‘చేతులు ఆనించారు’ లేదా ‘చేతులు మోపారు’ అని కూడా అనువదించవచ్చు; ఇది బలిపశువు మీద నిర్వహించిన ఆచారక్రియను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు తీసుకొచ్చాడు
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం, సమర్పించడం’ అనే ఆచారసంబంధ భావాన్ని కలిగి ఉంది. ‘దగ్గరకు తీసుకొచ్చాడు’ మూలంలోని దిశాభావాన్ని నిలుపుతుంది; కర్త మునుపటి సందర్భంలోని మోషే.
- source_word: אֵיל הָעֹלָה
  choice: దహనబలి కోసం పొట్టేలును
  rationale: אֵיל అంటే మగ గొర్రె, అంటే ‘పొట్టేలు’; עֹלָה బలిపరిభాషలో ‘దహనబలి.’ తెలుగు సహజత్వం కోసం ఆ పొట్టేలు దహనబలికి ఉద్దేశించబడిందని ‘కోసం’తో వ్యక్తం చేశాం.
- source_word: וַיִּסְמְכוּ
  choice: ఉంచారు
  rationale: స్మך అనే క్రియ ఇక్కడ బలిపశువు మీద చేతులు ఉంచే ఆచారక్రియను సూచిస్తుంది. ‘ఉంచారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో స్పష్టంగా చెప్పని అపరాధ బదిలీ వంటి వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: יְדֵיהֶם
  choice: తమ చేతులు
  rationale: హీబ్రూలోని బహువచనాన్ని నిలిపి, చేతులు అహరోను మరియు అతని కుమారులవేనని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ఆ పొట్టేలు తలమీద
  rationale: ఉపసర్గ పదబంధాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: బలిసందర్భంలోని చేతులు ఉంచే ఆచారం
  choice: తమ చేతులు ఉంచారు
  alternative: తమ చేతులు ఆనించారు / మోపారు
  rationale: వచనం ఆచారక్రియను మాత్రమే వివరిస్తుంది; దాని ద్వారా అపరాధ బదిలీ లేదా ఐక్యత తప్పనిసరిగా సూచించబడిందని వచనంలో లేని సిద్ధాంత వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘దహనబలి,’ ‘పొట్టేలు’ వంటి స్థిరమైన బలిపరిభాషను నిలిపి, ఆచారానికి మూలవచనం చెప్పని సిద్ధాంతార్థాన్ని జోడించలేదు.
