translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బలి సంబంధమైన קטר భావాన్ని కేవలం ‘కాల్చాడు’గా కాక, దహించి పొగగా పైకి లేపడంగా తెలిపాం. మూలంలోని వాక్యకర్త మార్పును—మొదటి క్రియలో సూచిత ‘అతడు,’ తరువాత స్పష్టమైన ‘మోషే’—నిలిపాం.
