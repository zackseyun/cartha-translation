  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: te
  text: పొట్టేలును దాని ముక్కలుగా నరికారు. మోషే తలను, ముక్కలను, కొవ్వును[a] పొగగా దహించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గట్టి కొవ్వును.” హీబ్రూ పదం బలిపశువులోని కొవ్వుతో కూడిన భాగాన్ని సూచిస్తుంది; కొందరు దీనిని పొట్టేలు కొవ్వు తోకగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ఆ పొట్టేలు
  rationale: బలి సందర్భంలో אַיִל వయోజన మగ గొర్రెను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పొట్టేలు’ సహజమైన నిర్దిష్ట పదం.
- source_word: נִתַּח לִנְתָחָיו
  choice: ముక్కలుగా నరికాడు
  rationale: נתח ధాతువు జంతువును భాగాలుగా కోయడం లేదా ఖండించడం సూచిస్తుంది; తెలుగు వాడుకలో ‘ముక్కలుగా నరికాడు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּקְטֵר
  choice: బలిపీఠం మీద దహించి పొగగా పైకి లేపాడు
  rationale: కర్మకాండ సందర్భంలోని קטר హిఫిల్ రూపం బలిని దహించి దాని పొగ పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. సమీప వచనాల సందర్భం ఆధారంగా బలిపీఠం స్పష్టీకరించబడింది.
- source_word: הָרֹאשׁ
  choice: దాని తలను
  rationale: సూటిగా శరీరంలోని తలను సూచించే పదం; తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టం చేయడానికి ‘దాని’ చేర్చబడింది.
- source_word: הַנְּתָחִים
  choice: ముక్కలను
  rationale: ముందటి נתּח/נתח పదబంధంతో ఒకే మూలానికి చెందిన ఈ నామవాచకం, నరికిన భాగాలను సూచిస్తుంది; పునరుక్తిని నిలుపుతూ ‘ముక్కలు’ వాడబడింది.
- source_word: הַפָּדֶר
  choice: కొవ్వును
  rationale: పదం బలిపశువులోని కొవ్వుతో కూడిన భాగాన్ని సూచిస్తుంది. అది ప్రత్యేకంగా కొవ్వు తోకేనని మూలపాఠం నిర్ధారించనందున సాధారణమైన ‘కొవ్వు’ను ప్రధాన పాఠంలో ఉంచాం.
