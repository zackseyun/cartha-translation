    issue: ‘వక్షస్థల పటకం’ is less idiomatic than necessary for a modern-standard Telugu main text.
    rationale: ‘ఛాతీ పటకం’ communicates a chest-worn priestly item more directly, while the footnote can retain the traditional alternative and clarify that it is not armor.
