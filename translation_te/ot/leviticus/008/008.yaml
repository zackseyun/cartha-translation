id: LEV.8.8
reference: Leviticus 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: te
  text: అతడు అతనిపై ఛాతీ పటకాన్ని[a] అమర్చాడు; ఆ ఛాతీ పటకంలో ఊరీము, తుమ్మీము[b] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రొమ్ము పటకం.’ హీబ్రూ חֹשֶׁן ప్రధాన యాజకుడు ఛాతీపై ధరించే ప్రత్యేక వస్తువును సూచిస్తుంది; ఇది యుద్ధ కవచం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఊరీము,’ ‘తుమ్మీము’ అనేవి హీబ్రూ ఆరాధనా సంబంధిత పదాల లిప్యంతరీకరణలు. అవి ఏ రూపంలో ఉండేవో, వాటిని ఖచ్చితంగా ఎలా ఉపయోగించేవారో తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: అమర్చాడు
  rationale: שׂוּם అంటే ఉంచడం లేదా అమర్చడం. యాజక వస్త్రధారణ సందర్భంలో ‘అమర్చాడు’ సహజంగా ఉండి, తరువాతి נָתַן క్రియతో స్వల్ప శైలీభేదాన్ని నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతనికి
  rationale: ఇక్కడ עַל అహరోనుపై వస్త్రభాగాన్ని ధరింపజేయడాన్ని సూచిస్తుంది. తెలుగులో ‘అతనికి ... అమర్చాడు’ సహజంగా ఆ భౌతిక భావాన్ని తెలియజేస్తుంది.
- source_word: הַחֹשֶׁן
  choice: వక్షస్థల పటకం
  rationale: חֹשֶׁן ప్రధాన యాజకుని ఛాతీపై ధరించే ప్రత్యేక వస్త్రభాగం లేదా సంచి. ‘వక్షస్థల పటకం’ దానిని కవచమని అపార్థం చేసుకోకుండా చేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడాం.
- source_word: וַיִּתֵּן
  choice: ఉంచాడు
  rationale: נָתַן కు ఇవ్వడం, పెట్టడం, ఉంచడం అనే విస్తృత అర్థాలున్నాయి. ఈ సందర్భంలో వస్తువులను పటకంలో పెట్టడం ఉద్దేశం కాబట్టి ‘ఉంచాడు’ సముచితం.
- source_word: אֶל הַחֹשֶׁן
  choice: వక్షస్థల పటకంలో
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని అర్థమైనా, ఇక్కడ ఊరీము తుమ్మీములను పటకం లోపల పెట్టడాన్ని సందర్భం సూచిస్తుంది. అందువల్ల తెలుగులో ‘పటకంలో’ సహజంగా ఉంది.
- source_word: הָאוּרִים
  choice: ఊరీము
  rationale: אוּרִים ఒక ప్రత్యేక ఆరాధనా సంబంధిత సాంకేతిక పదం. దాని ఖచ్చిత రూపం, వినియోగ విధానం అనిశ్చితమైనందున అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: הַתֻּמִּים
  choice: తుమ్మీము
  rationale: תֻּמִּים అనేది ఊరీముతో జతగా వచ్చే ప్రత్యేక ఆరాధనా సంబంధిత పదం. ఊహాత్మక అర్థాన్ని రుద్దకుండా హీబ్రూ పేరును లిప్యంతరీకరించాం.
theological_decisions:
- issue: אוּרִים וְתֻּמִּים అనే యాజక సంబంధిత వస్తువుల అనువాదం
  choice: ‘ఊరీము, తుమ్మీము’ అని లిప్యంతరీకరించడం
  alternative: ‘వెలుగులు, సంపూర్ణతలు’ లేదా ‘పవిత్ర చీట్లు’ అని అర్థానువాదం చేయడం
  rationale: ఇవి దేవుని నిర్ణయాన్ని తెలుసుకోవడానికి సంబంధించినవని ఇతర సందర్భాలు సూచించినా, వాటి ఖచ్చిత రూపం మరియు వినియోగ విధానం స్పష్టంగా లేవు. లిప్యంతరీకరణ మూలపాఠంలోని ప్రత్యేకతను, అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘వక్షస్థల పటకం’ అనే పదబంధం యాజక వస్త్రభాగాన్ని కవచంతో గందరగోళం చేయకుండా వివరిస్తుంది; అరుదైన హీబ్రూ పదాలకు పాదటిప్పణి ద్వారా సంక్షిప్త సాంస్కృతిక వివరణ ఇచ్చాం.
