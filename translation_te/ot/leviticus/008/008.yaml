    issue: The first action is rendered ‘అతనికి ... అమర్చాడు.’
    rationale: The Hebrew explicitly says עָלָיו, ‘on him.’ Although Telugu dative phrasing can be idiomatic for clothing someone, ‘అతనిపై’ safely preserves the source’s spatial wording in this ceremonial-vesting context.
