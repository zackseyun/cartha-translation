  text: וַ/יַּ֥עַשׂ אַהֲרֹ֖ן וּ/בָנָ֑י/ו אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: te
  text: యెహోవా మోషే ద్వారా ఆజ్ఞాపించిన వాటన్నిటినీ అహరోను, అతని కుమారులు చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; ఇది ‘మోషే ద్వారా’ లేదా ‘మోషేను సాధనంగా చేసుకొని’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశారు
  rationale: עשה అనే క్రియ ఇక్కడ ఆజ్ఞలన్నిటినీ విధేయతతో నెరవేర్చడాన్ని సాధారణ కథన శైలిలో సంగ్రహిస్తుంది; ఆధునిక తెలుగులో ‘చేశారు’ సహజంగా, మూలానికి సమీపంగా ఉంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: ఈ యాజక సందర్భంలో בנים అహరోను యొక్క మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సందర్భోచితంగా ఖచ్చితమైనది.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: వాటన్నిటినీ
  rationale: דברים కు ‘మాటలు,’ ‘విషయాలు,’ ‘కార్యాలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఆజ్ఞాపించబడిన అన్ని విషయాలను ఆచరించడమే భావం; ‘వాటన్నిటినీ’ సహజంగా ఉండి ఆ విస్తృతతను నిలుపుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: యెహోవా ముందుగా ఇచ్చిన ఆజ్ఞలను సూచించే సంబంధవాచక నిర్మాణానికి ‘ఆజ్ఞాపించిన’ సహజమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘మోషే ద్వారా’ దాని భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపాం; ఆధునిక ప్రామాణిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: בְּיַד מֹשֶׁה లో మోషే పాత్ర
  choice: మోషే ద్వారా
  alternative: మోషే చేతి ద్వారా
  rationale: ఇది దేవుని ఆజ్ఞ మోషే ద్వారా అందించబడిందనే సాధనత్వాన్ని తెలియజేసే నుడికారం. ‘మోషే ద్వారా’ అని అనువదించడం మధ్యవర్తిత్వ భావాన్ని తెలియజేస్తుంది; దానికంటే అధికమైన సిద్ధాంతార్థాన్ని పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంపూర్ణ విధేయత భావాన్ని ‘వాటన్నిటినీ’ ద్వారా నిలిపి, בְּיַד అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా అనువదించి అక్షరార్థాన్ని పాదటీపులో ఇచ్చాం.
