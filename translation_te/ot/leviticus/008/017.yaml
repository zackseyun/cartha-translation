  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: కానీ ఆ ఎద్దును, దాని చర్మాన్ని[a], మాంసాన్ని, పేడను[b] అతడు శిబిరం వెలుపల అగ్నితో కాల్చాడు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని తోలును.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని విసర్జిత మలాన్ని.’ హీబ్రూ פֶּרֶשׁ సాధారణ వ్యర్థాన్ని కాక ప్రత్యేకంగా పేడను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּר
  choice: ఆ కోడెదూడను
  rationale: פַּר అనేది ఎద్దును లేదా కోడెదూడను సూచిస్తుంది. బలి సందర్భంలో సహజంగా, స్పష్టంగా ఉండే ‘కోడెదూడ’ను ఎంచుకున్నాం; ఈ వచనంలో లేని ‘పాపపరిహార బలి’ అనే వివరణను చేర్చలేదు.
- source_word: עֹרוֹ
  choice: దాని చర్మాన్ని
  rationale: עוֹר అంటే జంతువు చర్మం. ఆధునిక ప్రామాణిక తెలుగులో ‘చర్మం’ ఖచ్చితమైన, సహజమైన పదం.
- source_word: בְּשָׂרוֹ
  choice: మాంసాన్ని
  rationale: בָּשָׂר ఇక్కడ జంతువు మాంసాన్ని సూచిస్తుంది. ‘మాంసం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి బలి సందర్భానికీ సరిపోతుంది.
- source_word: פִּרְשׁוֹ
  choice: పేడను
  rationale: פֶּרֶשׁ సాధారణ వ్యర్థాన్ని కాక ప్రత్యేకంగా విసర్జిత మలాన్ని సూచిస్తుంది. ‘పేడ’ ఈ జంతు సందర్భంలో నేరుగా, సహజంగా ఆ అర్థాన్ని తెలియజేస్తుంది.
- source_word: שָׂרַף בָּאֵשׁ
  choice: అగ్నితో కాల్చాడు
  rationale: שׂרף అంటే కాల్చడం; בָּאֵשׁ అగ్నిని స్పష్టంగా పేర్కొంటుంది. ‘అగ్నితో కాల్చాడు’ మూలంలోని బలాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: ఈ పదబంధం శిబిరపు సరిహద్దులకు బయట ఉన్న స్థలాన్ని సూచిస్తుంది. ‘శిబిరం వెలుపల’ సంక్షిప్తమైన, ఖచ్చితమైన అనువాదం.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר ఇక్కడ జరిగిన కార్యం ఆజ్ఞకు సరిగ్గా అనుగుణంగా ఉందని తెలియజేస్తుంది. ‘ఆజ్ఞాపించినట్టే’ ఆ సరిపోలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో దేవుని ప్రత్యేక నామమైన చతురక్షర నామం ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ఆ కోడెదూడను, దాని చర్మాన్ని, మాంసాన్ని, పేడను
  rationale: హీబ్రూ పునరుక్త సంధులు, కర్మసూచకాలు కోడెదూడతో పాటు దాని భాగాలను వరుసగా పేర్కొంటాయి. తెలుగు జాబితా నిర్మాణం ఆ సమగ్ర భావాన్ని సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనం బిరుదును కాక దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దైవనామాన్ని దాచకుండా, మూలానికి సమీపమైన ‘యాహ్వే’ రూపాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని ‘అతడు’ అనే ఏకవచన కర్తను నిలిపి, సందర్భం ఆధారంగా పేరును చేర్చి సందిగ్ధతను తొలగించలేదు. రెండో వాక్యంలో ‘అతడు చేశాడు’ అని చేర్చడం ద్వారా ఆజ్ఞకు అనుగుణంగా చేసిన కార్యం తెలుగులో పూర్తిగా, సహజంగా వినిపించేలా చేశాం.
