id: LEV.8.10
reference: Leviticus 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: te
  text: తరువాత మోషే అభిషేక తైలాన్ని తీసుకొని, నివాసగుడారాన్నీ దానిలో ఉన్న సమస్తాన్నీ అభిషేకం చేసి, వాటిని ప్రతిష్ఠించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిని పవిత్రపరచాడు.’
    reason: קדשׁ అనే క్రియ ఆరాధనా సందర్భంలో ప్రతిష్ఠించడం లేదా పవిత్రమైనవిగా చేయడం అనే భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తరువాత మోషే ... తీసుకొని
  rationale: వయ్యిక్తోల్ రూపం కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘తరువాత’ ఆ క్రమబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: అభిషేకానికి ఉపయోగించే నూనె అనే నిర్మాణార్థాన్ని, ఆచార సంబంధిత గంభీరతను ఈ పదబంధం స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకం చేసి
  rationale: నూనెను పూయడం మాత్రమే కాక, ఆరాధనా సేవ కోసం ప్రత్యేకపరచే ఆచార చర్యను కూడా వ్యక్తం చేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: పవిత్ర నివాసం
  rationale: మִשְׁכָּן యొక్క మూలభావమైన దేవుని నివాసస్థలాన్ని తెలియజేస్తూ, నిర్గమకాండము–లేవీయకాండము సందర్భంలోని ప్రత్యేక ఆరాధనా నిర్మాణాన్ని సూచిస్తుంది.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: దానిలో ఉన్న సమస్తం
  rationale: నివాసంలోని వస్తువులు, ఉపకరణాలన్నిటినీ సమగ్రంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: వాటిని ప్రతిష్ఠించాడు
  rationale: ఆరాధనా సందర్భంలో పవిత్రమైనవిగా ప్రత్యేకపరచడం అనే קדשׁ భావాన్ని ‘ప్రతిష్ఠించాడు’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; బహువచనం నివాసాన్నీ దానిలోని సమస్తాన్నీ కలిపి సూచిస్తుంది.
theological_decisions:
- issue: యాజక ఆచార సందర్భంలో קדשׁ పదానికి అనువాదం
  choice: ప్రతిష్ఠించాడు
  alternative: పవిత్రపరచాడు
  rationale: ఇక్కడ ఆరాధనా సేవ కోసం ప్రత్యేకపరచే ఆచార చర్య ప్రధానంగా ఉంది. ‘ప్రతిష్ఠించాడు’ ఆ భావాన్ని తెలియజేస్తుంది; ‘పవిత్రపరచాడు’ అనే సమీప ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలపదంలోని భావ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని ఆరాధనా సందర్భానికి తగిన గౌరవభరిత శైలి. పాదసూచిక సూచిక [a] ప్రధాన వచనంలో ఉంచబడింది.
