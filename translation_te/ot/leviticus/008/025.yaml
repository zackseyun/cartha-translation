source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: te
  text: తర్వాత అతడు కొవ్వును, కొవ్వుతో నిండిన తోకను, పేగుల మీద ఉన్న కొవ్వంతటినీ, కాలేయపు లోబును[a], రెండు మూత్రపిండాలను వాటి కొవ్వుతో సహా, కుడి తొడను తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాలేయపు అనుబంధ భాగాన్ని.” బలి ప్రక్రియలో తొలగించే ఒక నిర్దిష్ట భాగాన్ని హెబ్రీ పదం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తర్వాత అతడు ... తీసుకున్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగులో ‘తర్వాత’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: הַחֵלֶב
  choice: కొవ్వు
  rationale: బలుల సందర్భంలో ప్రత్యేకంగా వేరు చేసి అర్పించే కొవ్వు భాగాలకు సాధారణమైన, సూటియైన తెలుగు పదం.
- source_word: הָאַלְיָה
  choice: కొవ్వుతో నిండిన తోక
  rationale: ఇది గొర్రె యొక్క కొవ్వైన, వెడల్పైన తోకను సూచిస్తుంది; కేవలం ‘తోక’ అనడం దాని బలిసంబంధ శరీర నిర్మాణ విశిష్టతను చూపదు.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: పేగుల మీద ఉన్న కొవ్వంతా
  rationale: קֶרֶב ఇక్కడ అంతర్భాగాలు లేదా విసెరాను సూచిస్తుంది; సాధారణ పాఠకుడికి ‘పేగులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: కాలేయపు పొర
  rationale: బలి ప్రక్రియలో కాలేయంతో సంబంధమున్న ప్రత్యేక భాగాన్ని సూచించే అస్పష్ట శరీర నిర్మాణ పదబంధం; ‘పొర’ సహజ తెలుగు రూపం, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలు
  rationale: మూలంలోని ద్వివచన భావాన్ని నేరుగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: חֶלְבְּהֶן
  choice: వాటి కొవ్వుతో సహా
  rationale: మూత్రపిండాలకు అంటివున్న కొవ్వుతో వాటి సంబంధాన్ని సహజ తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: שׁוֹק הַיָּמִין
  choice: కుడి తొడ
  rationale: బలి కోసం కోసిన జంతువు పైకాలి లేదా తొడ భాగాన్ని సూచించడానికి ‘తొడ’ మరింత నిర్దిష్టమైన పదం.
