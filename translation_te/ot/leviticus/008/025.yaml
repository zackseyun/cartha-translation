translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధానానికి తగిన గంభీరతతోనూ సాధారణ పాఠకునికి అర్థమయ్యే శరీర నిర్మాణ పదాలతోనూ అనువదించబడింది. మూలంలోని జాబితా నిర్మాణం, కథన క్రమం నిలుపబడ్డాయి.
