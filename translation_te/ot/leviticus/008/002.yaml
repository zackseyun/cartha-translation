reference: Leviticus 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: te
  text: అహరోనును, అతనితోపాటు అతని కుమారులను, వస్త్రాలను, అభిషేక తైలాన్ని, పాపబలి కోసం కోడెను[a], రెండు పొట్టేళ్లను, పులియని రొట్టెల బుట్టను తీసుకురా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలి కోసం కోడెను.” ఇక్కడి హీబ్రూ పదం పాపంతోనూ ఆచారపరమైన శుద్ధీకరణతోనూ సంబంధమున్న బలిని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: తీసుకురా
  rationale: లָקַח్ క్రియ యొక్క ఏకవచన పురుష సంబోధన ఆజ్ఞారూపం. ఇక్కడ వ్యక్తులను, ఆచార సామగ్రిని సమకూర్చి తీసుకురావాలనే సందర్భంలో ‘తీసుకురా’ సహజమైన తెలుగు ఆజ్ఞ.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: בָּנָיו אִתּוֹ
  choice: అతనితోపాటు అతని కుమారులను
  rationale: ‘అతని కుమారులు’తోపాటు אִתּוֹలోని ‘అతనితో’ అనే భావాన్నీ స్పష్టంగా నిలుపుతుంది; సర్వనామం అహరోనును సూచిస్తుంది.
- source_word: הַבְּגָדִים
  choice: వస్త్రాలను
  rationale: בגד అనే సాధారణ పదానికి దగ్గరగా ఉంటుంది. యాజక సంబంధ సందర్భం ఉన్నప్పటికీ మూలంలో లేని అదనపు సాంకేతిక భావాన్ని చేర్చదు.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలాన్ని
  rationale: ‘అభిషేకపు నూనె’ అనే నిర్మాణ భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פַּר הַחַטָּאת
  choice: పాపపరిహార బలికి ఉద్దేశించిన కోడెను
  rationale: פַּרను ‘కోడె’గా, חַטָּאתను ఈ బలి సందర్భంలో ‘పాపపరిహార బలి’గా అనువదించాం. తెలుగు వాక్యంలో ఆ కోడె ఆ బలి కోసం అన్న సంబంధాన్ని ‘ఉద్దేశించిన’ స్పష్టం చేస్తుంది.
- source_word: שְׁנֵי הָאֵילִים
  choice: రెండు పొట్టేళ్లను
  rationale: אֵילִיםకు బలి సందర్భంలో సహజమైన తెలుగు సమానార్థకం ‘పొట్టేళ్లు’; సంఖ్యను యథాతథంగా ఉంచాం.
- source_word: סַל הַמַּצּוֹת
  choice: పులియని రొట్టెల బుట్టను
  rationale: מַצּוֹת పులియబెట్టని రొట్టెలను సూచిస్తుంది; వాటి నిర్దిష్ట ఆకారం ఈ వచనంలో చెప్పబడనందున సాధారణ సమూహార్థక రూపాన్ని వాడాం.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో సంబంధమున్న బలినీ, ఆచారపరమైన శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో విస్తృతంగా గుర్తించదగిన ‘పాపపరిహార బలి’ని ఉంచి, శుద్ధీకరణ కోణాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా విభక్తి సమన్వయం చేశాం. పాదసూచిక సూచికను అది వివరిస్తున్న ‘పాపపరిహార బలి’ పదబంధం వద్ద ఉంచాం.
