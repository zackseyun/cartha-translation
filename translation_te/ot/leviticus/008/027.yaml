id: LEV.8.27
reference: Leviticus 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: te
  text: అతడు వాటన్నిటినీ అహరోను అరచేతులపై, అతని కుమారుల అరచేతులపై ఉంచి[a], వాటిని యహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భ భావాన్ని బట్టి ‘అహరోను చేతుల్లో, అతని కుమారుల చేతుల్లో ఉంచి’ అని కూడా అనువదించవచ్చు. హెబ్రీలో అక్షరార్థంగా ‘అరచేతులపై’ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఉంచి
  rationale: נתן అనే క్రియకు ‘ఇచ్చాడు, పెట్టాడు, ఉంచాడు’ అనే అర్థాలున్నాయి. ఇక్కడ బలి భాగాలను అరచేతులపై ఉంచే భౌతిక చర్యను ‘ఉంచి’ సహజంగా తెలియజేస్తుంది.
- source_word: אֶת הַכֹּל
  choice: వాటన్నిటినీ
  rationale: ముందటి వచనంలో పేర్కొన్న బలి భాగాలన్నిటినీ ఇది సూచిస్తుంది; తెలుగు బహువచన రూపం ఆ పూర్వాపర సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַל כַּפֵּי
  choice: అరచేతులపై
  rationale: כַּף ఇక్కడ అరచేతిని సూచిస్తుంది; עַל యొక్క ప్రాథమిక భావమైన ‘పై’ని సహజమైన తెలుగులో నిలిపింది.
- source_word: בָנָיו
  choice: అతని కుమారుల
  rationale: ఆచార్య నియామక సందర్భంలో అహరోను మగ సంతానాన్నే హెబ్రీ పదం నిర్దిష్టంగా సూచిస్తుంది.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: ఊపే అర్పణగా ఊపాడు
  rationale: క్రియకూ ఆచార సంబంధ నామవాచకానికీ ఉన్న ఒకే మూలపద సంబంధాన్ని తెలుగులో పునరావృతితో నిలిపి, ఆచార చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలిపింది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ఈ సర్వనామం అహరోనును, అతని కుమారులను కాకుండా వారి అరచేతులపై ఉంచిన వస్తువులను సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: లిఖిత దైవనామాన్ని ‘యహ్వే’గా ప్రతిలిపి చేసి, לִפְנֵי యొక్క ఆచార సందర్భ భావాన్ని ‘సన్నిధిలో’గా సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా ప్రతిలిపి చేసింది.
- issue: בָנָיו లోని లింగ నిర్దిష్టత
  choice: అతని కుమారుల
  alternative: అతని పిల్లల
  rationale: ఈ యాజక నియామక సందర్భంలో మూలపాఠం పురుష సంతానాన్ని నిర్దిష్టంగా పేర్కొంటుంది; ‘పిల్లలు’ అంటే ఆ వివరము పోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఊపే అర్పణగా ఊపాడు’ అనే పదబంధం హెబ్రీ క్రియా–నామవాచక పదప్రయోగాన్ని నిలిపి, ఆచార సాంకేతికతను అర్థమయ్యేలా చేస్తుంది.
