id: LEV.8.30
reference: Leviticus 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: te
  text: అప్పుడు మోషే అభిషేక తైలంలో కొంత, బలిపీఠం మీద ఉన్న రక్తంలో కొంత తీసుకొని, అహరోను మీద, అతని వస్త్రాల మీద, అతని కుమారుల మీద, అహరోనుతో ఉన్న అతని కుమారుల వస్త్రాల మీద చిలకరించాడు. ఆ విధంగా అతడు అహరోనును, అతని వస్త్రాలను, అతని కుమారులను, అహరోనుతో ఉన్న అతని కుమారుల వస్త్రాలను ప్రతిష్ఠించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహరోనును, అతని వస్త్రాలను, అతని కుమారులను, అహరోనుతో ఉన్న అతని కుమారుల వస్త్రాలను పవిత్రపరిచాడు.”
    reason: קדשׁ అనే మూలపదానికి ‘ప్రతిష్ఠించు’తో పాటు ‘పవిత్రపరచు’ అనే ప్రత్యక్ష అర్థం కూడా ఉంది.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: కొంత తీసుకొని
  rationale: క్రియకు ‘తీసుకున్నాడు’ అనే అర్థం ఉంది; తరువాత రెండుసార్లు వచ్చిన מִן ఆయా పదార్థాల్లో కొంత తీసుకున్నాడని సూచిస్తుంది.
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలంలో కొంత
  rationale: שֶׁמֶן ‘నూనె/తైలం,’ מִשְׁחָה ‘అభిషేకం.’ ఆచార సందర్భానికి ‘అభిషేక తైలం’ సహజమైన, గౌరవప్రదమైన పదబంధం.
- source_word: וּמִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద ఉన్న రక్తంలో కొంత
  rationale: పునరావృతమైన מִן కొంత భాగాన్ని సూచిస్తుంది; אֲשֶׁר עַל సహజ తెలుగు సంబంధ వాక్యంగా అనువదించబడింది.
- source_word: וַיַּז
  choice: చిలకరించాడు
  rationale: నזה హిఫీల్ రూపం యాజక ఆచారాల్లో ద్రవాన్ని చిలకరించడాన్ని సూచిస్తుంది. తెలుగు బైబిలు ఆచార సందర్భంలో ‘చిలకరించాడు’ స్పష్టంగా ఉంటుంది.
- source_word: בְּגָדָיו
  choice: అతని వస్త్రాలు
  rationale: בֶּגֶד అంటే వస్త్రం లేదా దుస్తులు. ఆచార సందర్భపు గంభీరతను నిలుపుతూ ‘వస్త్రాలు’ సహజంగా ఉంది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం పురుష బహువచనం; ఇక్కడ అహరోను యాజక కుమారులనే ప్రత్యేకంగా సూచిస్తుంది.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: అతనితో ఉన్న అతని కుమారుల వస్త్రాలు
  rationale: אִתּוֹ సహజంగా కుమారులు అతనితో ఉన్నారని సూచిస్తుంది. తెలుగు పదక్రమం ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְקַדֵּשׁ
  choice: ప్రతిష్ఠించాడు
  rationale: קדשׁ ఇక్కడ పవిత్ర సేవ కోసం వేరుచేసే ఆచార చర్యను సూచిస్తుంది. ‘ప్రతిష్ఠించాడు’ ఆ సందర్భాన్ని సహజంగా తెలుపుతుంది; ‘పవిత్రపరిచాడు’ అనే విస్తృత అర్థాన్ని పాదటీపులో నిలిపాం.
theological_decisions:
- issue: యాజక నియామక సందర్భంలో קדשׁ అనువాదం
  choice: ప్రతిష్ఠించాడు
  alternative: పవిత్రపరిచాడు
  rationale: ఈ సందర్భం అహరోను, అతని కుమారులు, వారి వస్త్రాలను పవిత్ర సేవ కోసం వేరుచేయడాన్ని వివరిస్తుంది. ‘ప్రతిష్ఠించాడు’ ఆచార నియామక భావాన్ని ఇస్తుంది; అయితే మూలపదంలోని సాధారణ ‘పవిత్రపరచు’ భావాన్ని పాదటీపులో ఉంచడం ద్వారా అర్థ విస్తృతిని కాపాడాం.
- issue: అహరోను సంతానానికి లింగ నిర్దిష్ట సూచన
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: మూలంలోని בָּנָיו పురుష బహువచనం మరియు ఈ ఆచారంలో పాల్గొన్న యాజక కుమారులను సూచిస్తుంది; అందువల్ల లింగ నిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆచార సందర్భానికి తగిన గౌరవప్రద శైలిని ఉపయోగించాం. హీబ్రూలోని జాబితా పునరుక్తిని భావపరంగా నిలిపాం. పాదటీపు సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత క్రియ తరువాత ఉంచబడింది.
