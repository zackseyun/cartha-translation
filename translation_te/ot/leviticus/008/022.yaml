id: LEV.8.22
reference: Leviticus 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת הָ/אַ֣יִל הַ/שֵּׁנִ֔י אֵ֖יל הַ/מִּלֻּאִ֑ים וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: te
  text: తర్వాత అతడు రెండవ పొట్టేలును, ప్రతిష్ఠాపన పొట్టేలును[a], ముందుకు తీసుకువచ్చాడు. అహరోను మరియు అతని కుమారులు ఆ పొట్టేలు తలపై తమ చేతులను ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిష్ఠీకరణ పొట్టేలు.” ఇక్కడి హీబ్రూ పదబంధం యాజకులను సేవలో ప్రతిష్ఠించే ఆచారానికి సంబంధించిన సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: తర్వాత అతడు ... దగ్గరకు తీసుకొచ్చాడు
  rationale: קרב హిఫిల్ రూపం బలి ఆచార సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సమర్పించడానికి ముందుకు తేవడం’ అని సూచిస్తుంది. ‘దగ్గరకు తీసుకొచ్చాడు’ అనే రూపం ఆచార సంబంధ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది; ‘తర్వాత’ కథన క్రమాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: రెండవ పొట్టేలును
  rationale: אַיִל అంటే మగ గొర్రె లేదా పొట్టేలు; הַשֵּׁנִי స్పష్టంగా ‘రెండవ’ అనే క్రమసంఖ్య. ‘పొట్టేలు’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: אֵיל הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపన పొట్టేలును
  rationale: מִלֻּאִים అక్షరార్థంగా ‘నింపుటలు’ అనే భావానికి సంబంధించినప్పటికీ, యాజక సందర్భంలో పదవిలో నియమించి ప్రతిష్ఠించే ఆచారాన్ని సూచించే సాంకేతిక పదం. ‘ప్రతిష్ఠాపన’ యాజక సేవలో స్థాపించడమనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיִּסְמְכוּ
  choice: ఉంచారు
  rationale: סמך బలి ఆచారంలో చేతులను బలిపశువు మీద ఉంచడం లేదా ఆనించడం అనే భావం. ‘చేతులు ఉంచారు’ తెలుగులో స్పష్టమైన, సహజమైన ఆచార వర్ణన.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులు
  rationale: హీబ్రూ బహువచనాన్ని నిలుపుతూ, కర్తలైన అహరోను మరియు అతని కుమారులనే తిరిగి సూచించేందుకు ‘తమ’ ఉపయోగించబడింది.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ఆ పొట్టేలు తలపై
  rationale: మూలంలోని సంబంధాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: אַהֲרֹן וּבָנָיו
  choice: అహరోను, అతని కుమారులు
  rationale: בָנָיו ఈ యాజక ప్రతిష్ఠాపన సందర్భంలో అహరోను కుమారులనే నిర్దిష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: యాజక ఆచార సాంకేతిక పదమైన מִלֻּאִים అనువాదం
  choice: ప్రతిష్ఠాపన
  alternative: అభిషేక ప్రతిష్ఠ / సమర్పణ
  rationale: ఈ అధ్యాయం అహరోను, అతని కుమారులను యాజక సేవలో అధికారికంగా స్థాపించే ఆచారాన్ని వర్ణిస్తుంది. ‘ప్రతిష్ఠాపన’ ఆ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది. అయితే ఈ హీబ్రూ పదం ప్రతిష్ఠించడం లేదా అంకితం చేయడం అనే సమీప భావాలను కూడా కలిగి ఉండటం వల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని ఆచార క్రమం, ‘రెండవ’ అనే సంఖ్య, బహువచనమైన ‘చేతులు’ నిలుపబడ్డాయి. సాంకేతిక పదానికి ప్రధాన పాఠ్యంలో అర్థవంతమైన రూపం ఇచ్చి, దాని భావ పరిధిని పాదసూచికలో సూచించాం.
