revisions:
- from: తర్వాత అతడు రెండవ పొట్టేలును, ప్రతిష్ఠాపన పొట్టేలును[a], దగ్గరకు తీసుకొచ్చాడు. అహరోను, అతని కుమారులు ఆ పొట్టేలు తలపై తమ చేతులు ఉంచారు.
  to: తర్వాత అతడు రెండవ పొట్టేలును, ప్రతిష్ఠాపన పొట్టేలును[a], ముందుకు తీసుకువచ్చాడు. అహరోను మరియు అతని కుమారులు ఆ పొట్టేలు తలపై తమ చేతులను ఉంచారు.
