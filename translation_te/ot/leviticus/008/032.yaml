source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֥ר בַּ/בָּשָׂ֖ר וּ/בַ/לָּ֑חֶם בָּ/אֵ֖שׁ תִּשְׂרֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: te
  text: మాంసంలోను రొట్టెలోను మిగిలిన దానిని అగ్నిలో కాల్చివేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మాంసం’కు బదులుగా ‘దేహమాంసం’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదానికి అక్షరార్థం ‘దేహమాంసం’; అయితే ఇక్కడ అది బలిగా అర్పించిన జంతువు మాంసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: మిగిలినదాన్ని
  rationale: נותר యొక్క నిఫాల్ కృదంతం ‘మిగిలి ఉన్నది’ అనే నామవాచక భావాన్ని ఇస్తుంది; తెలుగులో ‘మిగిలినదాన్ని’ సహజంగా, సంక్షిప్తంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: בַּבָּשָׂר
  choice: మాంసంలోను
  rationale: בָּשָׂר అక్షరార్థంగా ‘శరీర మాంసం’ అయినా, ఇక్కడ బలిగా అర్పించిన జంతువు యొక్క ఆహారయోగ్యమైన మాంసాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘మాంసం’ సహజమైన తెలుగు పదం.
- source_word: וּבַלָּחֶם
  choice: రొట్టెలోను
  rationale: לֶחֶם సాధారణంగా ‘రొట్టె’; ముందున్న సమాంతర నిర్మాణాన్ని నిలుపుతూ ‘మాంసంలోను రొట్టెలోను’ అని అనువదించబడింది.
- source_word: בָּאֵשׁ
  choice: అగ్నిలో
  rationale: ב ఉపసర్గ ఇక్కడ కాల్చే పరిధిని లేదా సాధనాన్ని సూచించగలదు. ‘అగ్నిలో’ హెబ్రీ నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తూ తెలుగులో సహజంగా ఉంది.
- source_word: תִּשְׂרֹפוּ
  choice: కాల్చివేయాలి
  rationale: ద్వితీయ పురుష బహువచన అసంపూర్ణ క్రియ ధర్మశాస్త్ర ఆదేశాన్ని వ్యక్తం చేస్తుంది. ‘కాల్చివేయాలి’ సాధారణ ఆధునిక తెలుగులో ఆదేశబలాన్ని, పూర్తిగా దహనం చేయాలనే సందర్భార్థాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర ఆదేశ శైలి. తెలుగు వాక్యంలో కర్త సందర్భం ద్వారా స్పష్టంగా ఉండటంతో ‘మీరు’ అనేది విడిగా చేర్చలేదు; ‘కాల్చివేయాలి’ బహువచన సమూహానికి ఇచ్చిన ఆదేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
