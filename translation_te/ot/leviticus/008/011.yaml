id: LEV.8.11
reference: Leviticus 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: te
  text: అతడు దానిలో కొంతను బలిపీఠం మీద ఏడుసార్లు చిలకరించాడు.[a] తరువాత అతడు బలిపీఠానికీ, దాని సామగ్రి అంతటికీ, కడుగుకొనే తొట్టికీ, దాని ఆధారానికీ అభిషేకం చేసి, వాటిని పవిత్రపరచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానినుండి”; ఇక్కడ “దాని” అనేది సందర్భంలో పేర్కొన్న అభిషేక తైలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తొట్టి మరియు దాని పునాది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: చిలకరించాడు
  rationale: హిఫిల్ రూపంలోని נזה ఆచారపరమైన సందర్భంలో ద్రవాన్ని చిలకరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చిలకరించాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో కొంత తీసుకుని
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దానినుండి’ అని ఉన్నా, ముందటి వచనంలోని అభిషేక తైలాన్ని సూచిస్తూ చిలకరించిన ద్రవంలో కొంత తీసుకున్న భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలుల సందర్భంలో מִזְבֵּחַకు ప్రామాణికమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: ఆచార చర్య ఎన్నిసార్లు పునరావృతమైందో నేరుగా తెలియజేసే సంఖ్యావ్యక్తీకరణ.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకించి
  rationale: משׁח ఆరాధనా సందర్భంలో తైలంతో అభిషేకించడాన్ని సూచిస్తుంది; ఈ పదం ఆచారపరమైన భావాన్ని కాపాడుతుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రినంతటినీ
  rationale: כְּלִי ఇక్కడ బలిపీఠానికి సంబంధించిన పరికరాలు, పాత్రలు మొదలైన వాటన్నిటినీ సమగ్రంగా సూచిస్తుంది; ‘సామగ్రి’ సహజమైన విస్తృత పదం.
- source_word: הַכִּיֹּר
  choice: కడుగుకునే తొట్టి
  rationale: כִּיּוֹר ప్రత్యక్ష గుడార ప్రాంగణంలోని కడుగుకునే నీటి పాత్రను సూచిస్తుంది; కేవలం ‘తొట్టి’ కంటే దీని ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּנּוֹ
  choice: దాని పీఠం
  rationale: כֵּן తొట్టిని మోసే ఆధార నిర్మాణాన్ని సూచిస్తుంది; ‘పీఠం’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: לְקַדְּשָׁם
  choice: వాటిని ప్రతిష్ఠించాడు
  rationale: קדשׁ ఇక్కడ పవిత్ర సేవ కోసం వస్తువులను ప్రత్యేకపరచడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించాడు’ ఆచారపరమైన అర్థాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పవిత్ర వస్తువులు, ఆచార చర్యలకు సంబంధించిన పదజాలం
  choice: ‘అభిషేకించి’, ‘ప్రతిష్ఠించాడు’ వంటి స్థిరమైనప్పటికీ సులభంగా అర్థమయ్యే ఆచారపరమైన పదాలను వాడడం
  alternative: ‘నూనె పూసి’, ‘పవిత్రపరచాడు’ వంటి మరింత వివరణాత్మక పదాలను వాడడం
  rationale: వచనం ప్రత్యక్ష గుడారపు వస్తువులను పవిత్ర సేవ కోసం ప్రత్యేకపరిచే ఆచారాన్ని వర్ణిస్తుంది. ఎటువంటి తరువాతి సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని పవిత్రత, ఆచార గంభీరతలను ఈ పదాలు కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని ఆచారపరమైన గంభీరతను నిలుపుతూ అనువదించబడింది. హీబ్రూ వాక్యంలోని వరుస ‘మరియు’ నిర్మాణాన్ని తెలుగులో సహజ కథన ప్రవాహం కోసం రెండు వాక్యాలుగా మలిచాం.
