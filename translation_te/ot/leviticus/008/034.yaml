  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: te
  text: ఈ రోజు చేసినట్లుగానే[a], మీ కోసం ప్రాయశ్చిత్తం చేయడానికి అలాగే చేయాలని యెహోవా ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజు చేసినట్లే, మీ కోసం ప్రాయశ్చిత్తం చేయడానికి అలా చేయాలని యెహోవా ఆజ్ఞాపించాడు.”
    reason: పోలిక వాక్యభాగం మరియు ప్రధాన ఆజ్ఞ మధ్య సంబంధాన్ని తెలుగులో మరో సహజ క్రమంలో చూపించే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: చేసినట్లుగానే
  rationale: ముందు నిర్వహించిన ఆచారక్రియలతో పోలికను స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: రూపపరంగా తృతీయ పురుష ఏకవచనమైనా, ఇక్కడ కర్తను నిర్దిష్టంగా చెప్పకుండా ఇప్పుడే నిర్వహించిన ఆచారాన్ని సూచిస్తుంది; తెలుగు అసమాపక రూపం అనవసరంగా కర్తను చేర్చదు.
- source_word: בַּיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: ప్రస్తుత ఆచార దినాన్ని సూచించే కాలవాచక పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియను, అమలులో ఉన్న దైవాజ్ఞగా సందర్భానుగుణంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: לַעֲשֹׂת
  choice: అలాగే చేయాలని
  rationale: మునుపటి עשה క్రియను ప్రతిధ్వనింపజేస్తూ, ఆ కార్యాలనే నిర్వహించాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజక సంబంధ బలి సందర్భంలో כפר యొక్క స్థిరమైన ఆచార-వేదాంత భావాన్ని నిలుపుతూ, దాని విధానాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: עֲלֵיכֶם
  choice: మీ కోసం
  rationale: כפר తో కూడిన על ఇక్కడ ‘మీ నిమిత్తం/మీ పక్షంగా’ అనే భావాన్ని ఇస్తుంది; ‘మీ కోసం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: బలి సందర్భంలో כפר పదం అనువాదం
  choice: మీ కోసం ప్రాయశ్చిత్తం చేయడానికి
  alternative: మీ నిమిత్తం పరిహారం చేయడానికి
  rationale: ‘ప్రాయశ్చిత్తం’ యాజక సంబంధ ఆచారార్థాన్ని నిలుపుతుంది. ‘పరిహారం’ కొంత సులభమైనదైనా భావాన్ని సాధారణ నష్టపరిహారంగా సంకుచితం చేసే అవకాశం ఉంది; ‘దేవుని కోపాన్ని శాంతింపజేయడం’ వంటి మరింత నిర్దిష్ట సిద్ధాంతార్థాన్ని మూలపాఠం ఇక్కడ బలవంతం చేయదు.
- issue: మొదటి עשה క్రియ యొక్క కర్త
  choice: కర్తను పేర్కొనకుండా ‘చేసినట్లుగానే’
  alternative: ‘అతడు చేసినట్లుగానే’
  rationale: హీబ్రూలో క్రియ రూపం 3ms అయినప్పటికీ, సందర్భంలో ఇప్పుడే జరిగిన ఆచారక్రియలనే ప్రధానంగా సూచిస్తుంది. ‘అతడు’ అని చేర్చడం ద్వారా మోషేను స్పష్ట కర్తగా నిర్ణయించకుండా మూలంలోని సహజ అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యాజక ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. ‘ప్రాయశ్చిత్తం’ అనే స్థిర బైబిలు పదాన్ని నిలిపి, మిగతా వాక్యాన్ని సరళంగా నిర్మించాం.
