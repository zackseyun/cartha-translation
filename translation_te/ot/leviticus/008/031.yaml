source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: te
  text: 'మోషే అహరోనుతో, అతని కుమారులతో ఇలా అన్నాడు: “సమాగమపు గుడారం ప్రవేశద్వారం దగ్గర మాంసాన్ని ఉడికించండి; అక్కడే దానినీ, యాజక ప్రతిష్ఠాపన అర్పణల గంపలో[a] ఉన్న రొట్టెనూ తినండి. ‘అహరోను, అతని కుమారులు దానిని తినాలి’ అని నేను ఆజ్ఞాపించినట్లే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాజక అంకిత అర్పణల గంపలో.” హీబ్రూ పదం యాజకులను సేవలో ప్రతిష్ఠించే ఆచారానికి సంబంధించిన అర్పణలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: ఉడికించండి
  rationale: బలి సంబంధమైన ఈ వంట సందర్భంలో క్రియకు ‘ఉడికించు’ అనే నిర్దిష్ట అర్థం సరిపోతుంది; సాధారణమైన ‘వండండి’ కంటే మూలంలోని భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבָּשָׂר
  choice: మాంసాన్ని
  rationale: ఇక్కడ తినదగిన బలి జంతువు మాంసం ఉద్దేశించబడింది. ఆధునిక తెలుగులో ‘మాంసం’ సహజంగానూ స్పష్టంగానూ ఉంటుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమాగమపు గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח సూచించే ప్రవేశస్థలాన్ని, אֹהֶל מוֹעֵד అనే ఆరాధనా స్థలపు పేరును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: అక్కడే దానిని తినండి
  rationale: שָׁם పై ఉన్న స్థాన ప్రాధాన్యాన్ని ‘అక్కడే’ తెలియజేస్తుంది; ఆజ్ఞార్థక భావాన్ని ‘తినండి’ సహజంగా మోస్తుంది.
- source_word: הַלֶּחֶם
  choice: రొట్టెను
  rationale: ప్రతిష్ఠాపన ఆచారంతో కూడిన నిర్దిష్ట రొట్టెను సూచిస్తుంది; ‘రొట్టె’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: סַל הַמִּלֻּאִים
  choice: యాజక ప్రతిష్ఠాపన అర్పణల గంప
  rationale: מִלֻּאִים అహరోను, అతని కుమారుల యాజక స్థాపన ఆచారాన్ని సూచిస్తుంది. ‘యాజక ప్రతిష్ఠాపన’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘అర్పణలు’ గంపలోని ఆచార సంబంధమైన పదార్థాల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: అని నేను ఆజ్ఞాపించిన ప్రకారం
  rationale: లֵאמֹר పరిచయం చేసే ప్రత్యక్ష ఉల్లేఖనాన్ని ‘అని’తో సహజంగా కలిపి, ఆజ్ఞకు అనుగుణంగా చేయాలనే భావాన్ని నిలుపుతుంది.
- source_word: יֹאכְלֻהוּ
  choice: దాన్ని తినాలి
  rationale: ఈ క్రియారూపంలోని ఆదేశాత్మక బాధ్యతను ‘తినాలి’ తెలియజేస్తుంది; కేవలం భవిష్యత్తుగా మార్చదు.
theological_decisions:
- issue: యాజక స్థాపన సందర్భంలో מִלֻּאִים పదానికి అనువాదం
  choice: యాజక ప్రతిష్ఠాపన అర్పణలు
  alternative: యాజక అంకిత అర్పణలు
  rationale: ఈ పదం అహరోను, అతని కుమారులను యాజక సేవలో నియమించే ఆచారానికి సంబంధించినది. ‘యాజక ప్రతిష్ఠాపన’ ఆ ప్రత్యేక సందర్భాన్ని తెలియజేస్తుంది; తరువాతి కాలపు ఏ సంఘ వ్యవస్థనూ ఇందులోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఆచార సంబంధమైన ఖచ్చితత్వం కోసం ‘సమాగమపు గుడారం,’ ‘యాజక ప్రతిష్ఠాపన అర్పణలు’ అనే పదబంధాలు తీసుకోబడ్డాయి; వాక్య నిర్మాణం సహజంగా ఉండేలా ప్రత్యక్ష ఆజ్ఞను రెండు వాక్యాలుగా అమర్చాం.
