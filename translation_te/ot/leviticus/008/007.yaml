id: LEV.8.7
reference: Leviticus 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: te
  text: అతనికి అంగీ తొడిగి, నడికట్టుతో అతని నడుము కట్టి, పైవస్త్రం తొడిగాడు. తరువాత అతనికి ఏఫోదు వేసి, ఏఫోదుకు చెందిన నైపుణ్యంగా నేసిన పట్టీతో[a] దాన్ని అతనికి బిగించి, ఆ పట్టీతో ఏఫోదును అతనికి కట్టాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏఫోదు యొక్క అలంకరించిన పట్టీ’ లేదా ‘ఏఫోదు నడుముపట్టీ.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ క్రియ అరుదైనది; ఏఫోదును దాని నేసిన పట్టీతో అహరోనుకు బిగించాడనే భావం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: అంగీ
  rationale: శరీరానికి దగ్గరగా ధరించే ప్రాథమిక యాజక వస్త్రాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అంగీ’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: אַבְנֵט
  choice: నడికట్టు
  rationale: నడుము చుట్టూ కట్టే వస్త్రపు కట్టును సూచిస్తుంది; ‘నడికట్టు’ దాని రూపాన్ని, పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְעִיל
  choice: పైవస్త్రం
  rationale: అంగీపై ధరించే వస్త్రం. ‘పైవస్త్రం’ వస్త్రాల క్రమాన్ని సాధారణ పాఠకునికి స్పష్టంగా చూపుతుంది.
- source_word: אֵפֹד
  choice: ఏఫోదు
  rationale: దీనికి సరిగ్గా సరిపోయే సాధారణ తెలుగు పదం లేని ప్రత్యేక యాజక వస్త్రం కాబట్టి సాంకేతిక పదాన్ని లిప్యంతరీకరించాం.
- source_word: חֵשֶׁב
  choice: నైపుణ్యంగా నేసిన పట్టీ
  rationale: ఏఫోదుతో అనుసంధానమైన నేసిన నడుముపట్టీని సూచిస్తుంది. ఈ అనువాదం దాని పనితనాన్ని, వస్త్రంతో ఉన్న సంబంధాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: నడికట్టుతో అతని నడుము కట్టి
  rationale: חגר అనే క్రియ నడుము చుట్టూ కట్టడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు శరీర భాగాన్ని స్పష్టంగా పేర్కొన్నాం.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: ఆ పట్టీతో ఏఫోదును అతనికి కట్టాడు
  rationale: అరుదైన ఈ క్రియ ఏఫోదును దాని పట్టీ ద్వారా ధరించినవానికి బిగించడాన్ని సూచించే అవకాశముంది. అస్పష్ట సర్వనామాల బదులు సంబంధిత వస్త్రాన్ని స్పష్టంగా చెప్పడం తెలుగులో సహజం.
- source_word: וַיִּתֵּן עָלָיו
  choice: అతనికి ... వేసి
  rationale: ఒక వస్త్రాన్ని ఎవరికైనా ధరింపజేయడాన్ని తెలిపే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: యాజక వస్త్రాల సాంకేతిక పదాల అనువాదం
  choice: సాధారణ వస్త్రపదాలను తెలుగులో అనువదించి, ‘ఏఫోదు’ అనే ప్రత్యేక ఆరాధనా సంబంధ పదాన్ని లిప్యంతరీకరించడం
  alternative: ‘ఏఫోదు’ను ‘ముందువైపు ధరించే యాజక వస్త్రం’ వంటి వివరణాత్మక పదబంధంతో అనువదించడం
  rationale: వాక్యం వస్త్రధారణ క్రమాన్ని వివరిస్తుంది. ‘ఏఫోదు’ను అలాగే ఉంచడం ఆ వస్త్రపు ప్రత్యేక ఆరాధనా గుర్తింపును కాపాడుతుంది; మిగిలిన వస్త్రాలను సహజ తెలుగులో చెప్పడం పాఠ్యాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది.
- issue: చివరి క్రియలో ఏఫోదు–పట్టీ సంబంధం
  choice: పట్టీతో ఏఫోదును అతనికి కట్టాడని స్పష్టీకరించడం
  alternative: ‘దానితో అతనికి కట్టాడు’ అని సర్వనామాలతోనే అనువదించడం
  rationale: హీబ్రూ రూపం సంక్షిప్తంగా, కొంత అరుదుగా ఉన్నప్పటికీ, చివరి בּוֹ ముందున్న పట్టీని సూచించే అవకాశం బలంగా ఉంది. ఈ అర్థాన్ని పాఠ్యంలో స్పష్టం చేశాం; అయితే క్రియ యొక్క అరుదైన స్వభావాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని వరుస వస్త్రధారణ చర్యలను నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా వాక్యాన్ని రెండు భాగాలుగా అమర్చాం. సందర్భంలో కర్త మోషే, కర్మ అహరోను అయినప్పటికీ, మూలవాక్యంలోని సర్వనామ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
