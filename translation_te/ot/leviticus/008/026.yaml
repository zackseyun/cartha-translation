id: LEV.8.26
reference: Leviticus 8:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: te
  text: యహ్వే సన్నిధిలో ఉన్న పులియని రొట్టెల బుట్టలోనుంచి అతడు ఒక పులియని రొట్టెను, నూనెతో చేసిన ఒక రొట్టెను[a], ఒక పలుచని రొట్టెను తీసుకొని, వాటిని కొవ్వు భాగాల మీద, కుడి తొడ మీద ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నూనె కలిపిన ఒక రొట్టెను.” హీబ్రూ పదబంధం రొట్టెను నూనెతో సిద్ధం చేశారని సూచించవచ్చు; అయితే దాన్ని సిద్ధం చేసిన ఖచ్చితమైన విధానం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: పులియని రొట్టెల బుట్టలోనుంచి
  rationale: מִן మూలాన్ని సూచిస్తుంది; מַצּוֹת ఇక్కడ ఆచార సంబంధమైన పులియని రొట్టెలను సూచిస్తుంది. ఈ రూపం స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: లిఖిత దైవనామాన్ని ‘యహ్వే’గా ఉంచుతూ, לִפְנֵי అనే ఆరాధనా సందర్భపు భావాన్ని సహజమైన తెలుగులో ‘సన్నిధిలో’గా వ్యక్తపరుస్తుంది.
- source_word: חַלַּת מַצָּה אַחַת
  choice: ఒక పులియని రొట్టెను
  rationale: חַלָּה రొట్టె లేదా రొట్టెముద్ద ఆకారంలో కాల్చిన పదార్థాన్ని సూచిస్తుంది; מַצָּה దానికి పులియనిది అనే లక్షణాన్ని ఇస్తుంది.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: నూనెతో చేసిన ఒక రొట్టెను
  rationale: హీబ్రూ పదబంధం రొట్టెకు నూనె సంబంధాన్ని తెలుపుతుంది, కానీ నూనెను కలిపారా లేక పూశారా అనేది స్పష్టంగా చెప్పదు. ‘నూనెతో చేసిన’ ఆ అస్పష్టతను ఎక్కువగా కాపాడుతుంది.
- source_word: רָקִיק אֶחָד
  choice: ఒక పలుచని రొట్టెను
  rationale: רָקִיק బలి అర్పణల్లో వాడే పలుచని రొట్టెను సూచిస్తుంది; సాధారణ పాఠకులకు ‘పలుచని రొట్టె’ స్పష్టంగా ఉంటుంది.
- source_word: וַיָּשֶׂם
  choice: వాటిని ... ఉంచాడు
  rationale: క్రియ వ్యాకరణపరంగా ఏకవచన రూపంలో ఉన్నా, ముందు పేర్కొన్న మూడు రొట్టె పదార్థాలే ఉంచబడినవి; తెలుగులో బహువచన సర్వనామం సహజం.
- source_word: הַחֲלָבִים
  choice: కొవ్వు భాగాలు
  rationale: ఇది సాధారణ కొవ్వును కాక, బలిలో ప్రత్యేకంగా వేరు చేసిన కొవ్వు భాగాలను సూచిస్తుంది.
- source_word: שׁוֹק הַיָּמִין
  choice: కుడి తొడ
  rationale: שׁוֹק జంతువు కాలు లేదా తొడ భాగాన్ని సూచిస్తుంది; బలి సందర్భంలో ‘కుడి తొడ’ సుపరిచితమైన, నిర్దిష్టమైన అనువాదం.
theological_decisions:
- issue: యְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఆచార సంబంధ పదాలకు అతిగా సాంకేతికమైన రూపాలను నివారించాం. సందర్భంలో కర్త మోషే అయినప్పటికీ ఈ వచనంలోని హీబ్రూ పాఠం పేరును పునరుక్తి చేయనందున ‘అతడు’ అని ఉంచాం. పాదసూచిక గుర్తును దాని విషయమైన నూనెతో చేసిన రొట్టె పదబంధం వద్ద ఉంచాం.
