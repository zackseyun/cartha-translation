source:
  edition: WLC
  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: te
  text: అప్పుడు అతడు పాపం కోసం అర్పించే ఎద్దును దగ్గరకు తీసుకొచ్చాడు[a]. అహరోను మరియు అతని కుమారులు పాపం కోసం అర్పించే ఆ ఎద్దు తలపై తమ చేతులు ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమర్పణకు ముందుకు తెచ్చాడు’ లేదా ‘దగ్గరకు చేర్చాడు.’
    reason: וַיַּגֵּשׁ అనే హిఫిల్ క్రియ ఆచారసందర్భంలో ‘దగ్గరకు తీసుకురావడం,’ ‘ముందుకు తేవడం,’ లేదా ‘సమర్పించడం’ అనే సమీపార్థాలను కలిగి ఉంటుంది.
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: దగ్గరకు తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని נגשׁ ఇక్కడ బలిపశువును ఆచారపూర్వకంగా దగ్గరకు తీసుకురావడం లేదా సమర్పణకు ముందుకు తేవడం సూచిస్తుంది. ఈ ఎంపిక మూలంలోని సమీపింపజేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: פַּר
  choice: ఎద్దు
  rationale: బలుల సందర్భంలో פַּר మగ పశువైన ఎద్దును సూచిస్తుంది. ఈ వచనం మాత్రమే దాని వయస్సును నిర్దిష్టంగా చెప్పనందున ‘ఎద్దు’ సరైనది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల నియమావళిలో חַטָּאת పాపాన్ని కాక పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆధునిక తెలుగు పాఠకులకు దాని ఆచారపరమైన అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే పరిహారం జరిగే విధానాన్ని ఇది అదనంగా నిర్వచించదు.
- source_word: וַיִּסְמֹךְ
  choice: ఉంచారు
  rationale: סמך బలిసంబంధ సందర్భంలో చేతిని జంతువు తలపై ఉంచే ఆచారక్రియను సూచిస్తుంది. ‘ఉంచారు’ సహజంగా ఉండి, ఎంత ఒత్తిడి పెట్టారో మూలం కంటే ఎక్కువగా నిర్దేశించదు.
- source_word: יְדֵיהֶם
  choice: తమ చేతులు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, కర్తలతో సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తమ చేతులు’ వాడబడింది.
- source_word: עַל רֹאשׁ
  choice: తలపై
  rationale: స్థాన సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: బలిపశువుపై చేతులు ఉంచడంలోని అర్థం
  choice: ఆ చర్యను మాత్రమే వర్ణించి, దాని ఆధ్యాత్మిక యాంత్రికతను అనువాదంలో వివరించలేదు.
  alternative: ఈ చర్యను పాపబాధ్యత బదిలీగా, బలితో ఐక్యతగా, లేదా బలిపశువు నియామకం/ప్రతిష్ఠగా స్పష్టీకరించడం.
  rationale: ఈ వచనం చేతులు ఉంచిన చర్యను చెబుతుంది గాని దాని ఖచ్చితమైన వేదాంతార్థాన్ని వివరించదు. అందువల్ల మూలంలోని వేదాంతపరమైన విస్తృతిని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే బలుల సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘అతడు’ అనే కర్త మునుపటి సందర్భం నుంచి వస్తున్నందున మూలంలాగే పేరును చేర్చలేదు. పునరుక్తమైన ‘పాపపరిహార బలి ఎద్దు’ను మూలానికి అనుగుణంగా నిలిపాం.
