  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: te
  text: అతడు దానిని వధించాడు; మోషే రక్తాన్ని బలిపీఠం చుట్టూ చిమ్మాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రక్తాన్ని బలిపీఠం అన్ని వైపులపై బలంగా చిమ్మాడు.” ఇక్కడి హెబ్రీ క్రియ బలి రక్తాన్ని బలంగా ప్రయోగించడాన్ని సూచిస్తుంది; తేలికగా చల్లడాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: అతడు దానిని వధించాడు
  rationale: שׁחט బలిసంబంధ సందర్భంలో జంతువును ఆచారపూర్వకంగా వధించడాన్ని సూచిస్తుంది. హెబ్రీలో వ్యక్తంగా లేని కర్మను ముందరి వచనంలోని బలి జంతువు ఆధారంగా తెలుగులో ‘దానిని’ అని చేర్చాం.
- source_word: וַיִּזְרֹק
  choice: చిమ్మాడు
  rationale: זרק ఇక్కడ బలి రక్తాన్ని బలిపీఠం మీదికి బలంగా ప్రయోగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చిమ్మాడు’ సహజంగా ఉండి, కేవలం తేలికగా చల్లడం అనే భావాన్ని తప్పిస్తుంది; బలప్రయోగపు సూక్ష్మతను పాదసూచికలో స్పష్టం చేశాం.
- source_word: הַדָּם
  choice: ఆ రక్తాన్ని
  rationale: నిర్దిష్ట పదాన్ని సందర్భానుసారంగా ‘ఆ రక్తాన్ని’ అని అనువదించాం.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: מזבח కు బలుల సందర్భంలో సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: סָבִיב
  choice: బలిపీఠం చుట్టూ
  rationale: బలిపీఠపు అన్ని వైపులా రక్తాన్ని ప్రయోగించిన పంపిణీ భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. క్రియల వరుసను రెండు వాక్యాలుగా ఇచ్చి స్పష్టతను పెంచాం; బలి ఆచారంలోని బలప్రయోగ భావాన్ని పాదసూచికతో కాపాడాం.
