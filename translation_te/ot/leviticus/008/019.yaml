revisions:
- from: అతడు దానిని వధించాడు. మోషే ఆ రక్తాన్ని బలిపీఠం చుట్టూ దాని మీదికి చిమ్మాడు.[a]
  to: అతడు దానిని వధించాడు; మోషే రక్తాన్ని బలిపీఠం చుట్టూ చిమ్మాడు.[a]
  rationale: 'The revision removes the unclear phrase “దాని మీదికి” while retaining every element of the Hebrew: slaughter of the contextual animal, Moses’s application of the blood, the altar, and the all-around sense. The semicolon keeps the close sequence of the Hebrew clauses in fluent Telugu. The revised footnote gives a natural explicit alternative for the distributive, forceful sense of the Hebrew verb.'
