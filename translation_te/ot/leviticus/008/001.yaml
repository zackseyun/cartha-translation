    reason: దైవనామాన్ని ప్రధాన పాఠంలో ‘యాహ్వే’గా ఉంచి, సంప్రదాయ బిరుదు-అనువాదం మరియు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; అందువల్ల ‘అప్పుడు’ సహజమైన క్రమసూచకం. דִּבֵּר అనే మాటను, తరువాతి לֵאמֹרతో కలిసి, ఆధునిక తెలుగులో సహజంగా ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామం YHWHను తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తి ఎవరిని ఉద్దేశించాడో తెలిపే אֶלను తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సూత్రప్రాయ రూపం. తెలుగులో ‘ఇలా అన్నాడు:’ అనేది దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఉచ్చారణ పునర్నిర్మాణంలో అనిశ్చితి ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సహజంగా రూపొందించాం. తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని సూచించేందుకు చివర ద్విబిందువు వాడాం.
