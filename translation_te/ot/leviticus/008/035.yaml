id: LEV.8.35
reference: Leviticus 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: te
  text: మీరు సమావేశ గుడారం ద్వారం వద్ద ఏడు రోజులపాటు పగలూ రాత్రీ ఉండాలి; యహ్వే విధిని పాటించాలి, మీరు చనిపోకుండా ఉండేందుకు. ఎందుకంటే నాకు ఇలాగే ఆజ్ఞాపించబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు మీరు చనిపోరు”; మరో విధంగా, “మీరు చనిపోకుండా ఉండేందుకు.”
    reason: వְלֹא תָמֻתוּ అనే పదబంధాన్ని సమన్వయ ప్రకటనగా లేదా హెచ్చరిక/ఉద్దేశ భావంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶתַח అనేది ప్రవేశం లేదా ద్వారాన్ని సూచిస్తుంది; స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో చూపేందుకు ‘ప్రవేశద్వారం దగ్గర’ అని అనువదించాం. אֹהֶל מוֹעֵדకు స్థిరమైన పవిత్రస్థల నామంగా ‘సమావేశపు గుడారం’ వాడాం.
- source_word: תֵּשְׁבוּ
  choice: ఉండాలి
  rationale: ישבకు కూర్చోవడం, నివసించడం, నిలిచి ఉండడం అనే అర్థాలు ఉన్నాయి. ఈ ఆచార సందర్భంలో నిర్దేశిత స్థలంలో కొనసాగి ఉండడమే భావం; అందువల్ల ‘ఉండాలి’ సహజంగా ఉంటుంది.
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు పగలూ రాత్రీ
  rationale: ఈ జంట నిరంతర కాలాన్ని సూచిస్తుంది. తెలుగులో వ్యవధిని స్పష్టంగా, సహజంగా తెలిపేందుకు ‘ఏడు రోజులపాటు పగలూ రాత్రీ’ అని ఇచ్చాం.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: యెహోవా అప్పగించిన విధిని పాటించాలి
  rationale: שמר + משמרת అనేది నిర్దేశించిన బాధ్యతను జాగ్రత్తగా నిర్వర్తించడాన్ని సూచిస్తుంది. ‘విధిని పాటించాలి’ ఆచారపరమైన బాధ్యతను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘అప్పగించిన’ అనేది సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְלֹא תָמֻתוּ
  choice: అప్పుడు మీరు చనిపోరు
  rationale: వావ్‌తో కూడిన నిషేధ రూపం ముందున్న విధిపాలనతో సంబంధమున్న ఫలితం లేదా హెచ్చరికగా అర్థమవుతుంది. ‘అప్పుడు మీరు చనిపోరు’ ఆ సంబంధాన్ని చూపుతుంది; అయితే సమన్వయ వాక్యం లేదా ‘చనిపోకుండా’ అనే హెచ్చరిక భావం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచాం.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: ఎందుకంటే నాకు ఆజ్ఞాపించబడింది ఇదే
  rationale: నిష్క్రియారూపం మోషే తాను పొందిన ఆజ్ఞను నివేదిస్తున్నాడని చూపుతుంది. ‘ఇదే’ כֵן యొక్క నిర్దేశక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: మరణ హెచ్చరిక యొక్క వాక్యబలం
  choice: విధిని పాటించడం వల్ల తప్పించుకునే ఫలితంగా ‘అప్పుడు మీరు చనిపోరు’
  alternative: ‘మరియు మీరు చనిపోరు’ లేదా ‘మీరు చనిపోకుండా’
  rationale: ముందున్న ఆజ్ఞతో మరణం తప్పించుకోవడాన్ని అనుసంధానించడం సందర్భానికి సరిపోతుంది. అయినా హీబ్రూ సంధి సమన్వయ ప్రకటనగానూ హెచ్చరికగానూ చదవవచ్చు; ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ఆచారపరమైన భావాన్ని నిలుపుతూ అతిగా సాంకేతికమైన పదజాలాన్ని నివారించాం.
