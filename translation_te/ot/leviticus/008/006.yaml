  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: te
  text: అప్పుడు మోషే అహరోనును, అతని కుమారులనూ దగ్గరకు తీసుకువచ్చి, వారిని నీటితో కడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: దగ్గరకు తీసుకువచ్చి
  rationale: קרב యొక్క హిఫిల్ రూపం ‘దగ్గరకు తీసుకురావడం’ అనే అర్థాన్ని ఇస్తుంది. యాజక ప్రతిష్ఠాపన సందర్భంలోని స్పష్టమైన కదలికను ఇది సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; విభక్తి కోసం ‘అహరోనును’గా వాక్యంలో ఉపయోగించబడింది.
- source_word: בָּנָיו
  choice: అతని కుమారులను
  rationale: ఇక్కడ బנים అనేది యాజకులుగా ప్రతిష్ఠించబడుతున్న అహరోను మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సందర్భానుగుణంగా ఖచ్చితమైనది.
- source_word: וַיִּרְחַץ
  choice: కడిగాడు
  rationale: רחץ అంటే కడగడం లేదా స్నానం చేయించడం. మూలం శరీరంలోని ఏ భాగమో పరిమితి విధించనందున, సాధారణమైన ‘కడిగాడు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: అహరోను మరియు అతని కుమారులందరినీ కలిపి సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: בַּמָּיִם
  choice: నీళ్లతో
  rationale: ב ఉపసర్గ ఇక్కడ కడగడానికి ఉపయోగించిన సాధనాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘నీళ్లతో కడిగాడు’ సహజమైన ప్రయోగం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
