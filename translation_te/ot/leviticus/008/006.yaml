  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ఆచారాన్ని ‘ప్రతిష్ఠాపన’ లేదా ‘శుద్ధీకరణ’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా, మూలంలోని చర్యలను మాత్రమే అనువదించాం.
