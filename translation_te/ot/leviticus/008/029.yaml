id: LEV.8.29
reference: Leviticus 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: te
  text: అప్పుడు మోషే రొమ్ము భాగాన్ని తీసుకొని, యాహ్వే సన్నిధిలో దానిని ఊపే అర్పణగా ఊపాడు. ప్రతిష్ఠాపన పొట్టేలు[a] నుండి అది మోషేకు కేటాయించిన భాగం అయింది. యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే అతడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతిష్ఠీకరణ పొట్టేలు.’
    reason: మִלֻּאִים అనే ఆచారపరమైన పదానికి ‘ప్రతిష్ఠాపన,’ ‘ప్రతిష్ఠీకరణ’ రెండూ సందర్భానుకూల తెలుగు రూపాలు.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తర్వాత మోషే ... తీసుకొని
  rationale: వయ్యిక్టోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘తర్వాత’ సహజమైన తెలుగు కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: הֶחָזֶה
  choice: బోరను
  rationale: బలి సందర్భంలో חָזֶה జంతువు బోర భాగాన్ని సూచిస్తుంది; ‘బోర’ ఆధునిక తెలుగులో ఆ శరీర భాగానికి సహజమైన పదం.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: దాన్ని ఊపార్పణగా ఊపాడు
  rationale: נוּף క్రియతో దాని సమానమూల నామవాచకం תְּנוּפָה కలసి ఆచారపరమైన ఊపడం/సమర్పణను సూచిస్తాయి; క్రియ, సాంకేతిక బలి పదం రెండింటినీ అనువాదం నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో ఆచారపరంగా సమర్పించడాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపన పొట్టేలు నుండి
  rationale: אֵיל అంటే ‘పొట్టేలు’; యాజకులను అధికారికంగా నియమించి ప్రత్యేకించే ఈ సందర్భంలో מִלֻּאִיםను ‘ప్రతిష్ఠాపన’గా అందించడం సహజం. ‘ప్రతిష్ఠీకరణ’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: అది మోషేకు రావలసిన భాగం
  rationale: מָנָה కేటాయించబడిన వాటా లేదా భాగాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భాగం మోషేకు చెందినదని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే జరిగింది
  rationale: మోషే చేసిన కార్యం ముందుగా ఇచ్చిన దైవాజ్ఞకు సరిగ్గా అనుగుణంగా ఉందని తెలిపే సూత్రబద్ధ ముగింపును నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: యాజక ప్రతిష్ఠాపన సందర్భంలోని מִלֻּאִים
  choice: ప్రతిష్ఠాపన
  alternative: ప్రతిష్ఠీకరణ
  rationale: ఈ పదం అక్షరార్థంగా ‘నింపుటలు’ అనే భావంతో సంబంధమున్నా, లేవీయకాండము 8లో యాజక సేవలో అధికారికంగా నియమించే ఆచారాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠాపన’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి సంబంధ సాంకేతిక పదమైన ‘ఊపార్పణ’ను క్రియతో కలిపి హీబ్రూ పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
