id: LEV.8.5
reference: Leviticus 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: te
  text: 'మోషే సమాజానికి ఇలా అన్నాడు: “ఇదే యాహ్వే చేయమని ఆజ్ఞాపించిన కార్యం.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-క్రమకథన రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సందర్భానుసారంగా ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶל־הָעֵדָה
  choice: సమాజంతో
  rationale: עֵדָה ఇక్కడ కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా, సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זֶה הַדָּבָר
  choice: ఇది ... కార్యం
  rationale: దైవాజ్ఞ ప్రకారం ఇప్పుడు నిర్వహించబోయే విషయాన్ని సూచిస్తుంది; ‘కార్యం’ సందర్భంలోని ఆచరణాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు ప్రస్తుత సందర్భంలో కొనసాగుతున్న ప్రాముఖ్యత ఉందని సహజ తెలుగు సంబంధక్రియ రూపంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడిన వ్యక్తినామ రూపంతో అందిస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: చేయమని
  rationale: హీబ్రూ క్రియార్థకం రూపపరంగా కర్తరి (‘చేయుటకు’) అయినందున తెలుగు ప్రత్యక్ష ఆజ్ఞార్థ నిర్మాణం సహజంగా ఉంటుంది; ఎవరు చేయాలనే కర్తను వాక్యం స్పష్టంగా పేర్కొనకపోవడాన్ని ఇది అలాగే ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: לַעֲשׂוֹת లో కర్తరి లేదా కర్మణి భావం
  choice: చేయమని
  alternative: చేయబడాలని
  rationale: హీబ్రూ infinitive రూపపరంగా కర్తరిలో ఉంది; సందర్భంలో అవ్యక్త కర్త భావం సాధ్యమైనప్పటికీ, దానిని తప్పనిసరిగా కర్మణిగా నిర్ణయించకుండా మూలంలోని తెరచిన భావాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంక్షిప్త కథన శైలి. మూలంలోని క్రియార్థక అనిశ్చితిని ‘చేయమని’ ద్వారా అనవసరంగా కర్మణిగా మార్చకుండా ఉంచాం.
