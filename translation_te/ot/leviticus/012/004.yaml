id: LEV.12.4
reference: Leviticus 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: te
  text: ఆ తర్వాత ఆమె ముప్పైమూడు రోజులు శుద్ధీకరణకు సంబంధించిన రక్తస్రావ స్థితిలో ఉండాలి.[a] ఆమె పవిత్రమైన దేనినీ ముట్టుకోకూడదు; ఆమె శుద్ధీకరణ దినాలు పూర్తయ్యే వరకు పవిత్రస్థలంలోకి ప్రవేశించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శుద్ధీకరణ రక్తంలో” లేదా “శుద్ధీకరణ రక్తాలలో.” ఈ హీబ్రూ పదబంధం ప్రసవానంతర రక్తస్రావంతో ముడిపడిన ఆచారసంబంధ శుద్ధీకరణ కాలాన్ని సూచిస్తుంది.
    reason: హీబ్రూ పదబంధంలోని అసాధారణ బహువచన రూపాన్ని, దాని అక్షరార్థాన్ని మరియు సందర్భార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וּשְׁלֹשִׁים יוֹם וּשְׁלֹשֶׁת יָמִים
  choice: ముప్పైమూడు రోజులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ముప్పై రోజులు, మూడు రోజులు’ అని ఉన్నా, ఆధునిక తెలుగులో మొత్తం సంఖ్యను ‘ముప్పైమూడు రోజులు’ అని చెప్పడం సహజం.
- source_word: תֵּשֵׁב
  choice: ఉండాలి
  rationale: יָשַׁב అనే క్రియకు ‘కూర్చోవడం, నివసించడం, ఉండడం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ నిర్దిష్ట కాలం ఒక ఆచారసంబంధ స్థితిలో కొనసాగడాన్ని ‘ఉండాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: בִּדְמֵי טָהֳרָה
  choice: శుద్ధీకరణకు సంబంధించిన రక్తస్రావ స్థితిలో
  rationale: క్లిష్టమైన హీబ్రూ పదబంధం అక్షరార్థంగా ‘శుద్ధీకరణ రక్తం/రక్తాలు’ అని ఉంటుంది. ప్రసవానంతర రక్తస్రావంతో ముడిపడిన ఆచారసంబంధ శుద్ధీకరణ కాలాన్ని తెలుగులో స్పష్టంగా తెలిపేందుకు ఈ రూపం ఎంచుకోబడింది; అక్షరార్థ రూపం పాదసూచికలో నిలుపబడింది.
- source_word: בְּכָל־קֹדֶשׁ
  choice: పవిత్రమైన దేనినీ
  rationale: ఈ పదబంధం పవిత్ర వస్తువులు లేదా పవిత్రంగా ప్రత్యేకించబడిన వాటన్నిటినీ విస్తృతంగా సూచిస్తుంది. ‘పవిత్రమైన దేనినీ’ ఆ విస్తృతిని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֹא תִגָּע
  choice: ముట్టుకోకూడదు
  rationale: న్యాయనియమ సందర్భంలోని నిషేధాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶל־הַמִּקְדָּשׁ לֹא תָבֹא
  choice: పవిత్రస్థలంలోకి ప్రవేశించకూడదు
  rationale: מִקְדָּשׁ ఆరాధనకు ప్రత్యేకించబడిన పవిత్రస్థలాన్ని సూచిస్తుంది. ‘ప్రవేశించకూడదు’ హీబ్రూ ‘లోనికి రాకూడదు’ అనే స్థలసంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַד־מְלֹאת יְמֵי טָהֳרָהּ
  choice: ఆమె శుద్ధీకరణ దినాలు పూర్తయ్యే వరకు
  rationale: కాలపరిమితిని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అనువదిస్తూ, ఆచారసంబంధ శుద్ధీకరణ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ప్రసవానంతర శుద్ధీకరణ భాషను నైతిక అపరాధంగా చూపకుండా అనువదించడం
  choice: శుద్ధీకరణ
  alternative: శుభ్రపరచడం
  rationale: ఈ వచనం ప్రసవానంతర ఆచారసంబంధ స్థితి గురించి మాట్లాడుతుంది; వ్యక్తిగత నైతిక పాపాన్ని ప్రకటించదు. ‘శుద్ధీకరణ’ ఆ ఆరాధనా-న్యాయ సందర్భాన్ని కాపాడుతుంది.
- issue: בִּדְמֵי טָהֳרָה అనే అస్పష్ట పదబంధాన్ని వివరించడం
  choice: ప్రధాన పాఠ్యంలో ప్రసవానంతర రక్తస్రావ స్థితిని స్పష్టం చేసి, అక్షరార్థాన్ని పాదసూచికలో ఇవ్వడం
  alternative: ‘శుద్ధీకరణ రక్తంలో’ అని మాత్రమే అక్షరార్థంగా అనువదించడం
  rationale: అక్షరార్థ రూపం తెలుగులో అపార్థానికి దారితీయవచ్చు. ప్రధాన పాఠ్యం సందర్భార్థాన్ని అందిస్తుంది; పాదసూచిక హీబ్రూ రూపంలోని కఠినతను, అనిశ్చితిని దాచకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయనియమ శైలి. ‘ఉండాలి,’ ‘ముట్టుకోకూడదు,’ ‘ప్రవేశించకూడదు’ వంటి రూపాలు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. ఆచారసంబంధ శుద్ధతను నైతిక అపరాధంతో కలపలేదు.
