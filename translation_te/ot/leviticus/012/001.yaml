lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే וַיְדַבֵּר అనే కథన క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; ‘మాట్లాడాడు’ కూడా సాధ్యమే, కాని ‘మోషేతో ఇలా అన్నాడు’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సూటిగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל ఇక్కడ సంభాషణ లక్ష్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో’ సహజంగా ఉంటుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హెబ్రీయ సంప్రదాయ సూత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ద్విరుక్తిగా వినిపించే ‘అంటూ అన్నాడు’ను నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడినా, ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదు; తెలుగులో సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో వాడి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీయ వాక్యారంభంలోని సంధికారక ‘మరియు’ను తెలుగులో అవసరం లేనందున విడిచిపెట్టి, לֵאמֹרను తరువాతి ప్రత్యక్ష ప్రసంగానికి తగిన ద్విబిందువుతో వ్యక్తీకరించాం.
