  terminology: “ఇశ్రాయేలీయులు” is a natural national designation for בְּנֵי יִשְׂרָאֵל in Telugu. “అపవిత్రంగా” appropriately retains the source term without adding an interpretive qualifier in the text. “రుతుస్రావపు అపవిత్రత” clearly represents the ritual-purity expression.
