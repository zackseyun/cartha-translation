id: LEV.12.2
reference: Leviticus 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: te
  text: '“ఇశ్రాయేలీయులతో ఇలా చెప్పు: ‘ఒక స్త్రీ గర్భం దాల్చి మగబిడ్డకు జన్మనిస్తే, ఆమె ఏడు రోజులపాటు అపవిత్రంగా ఉంటుంది; తన రుతుస్రావపు అపవిత్రత దినాల్లో ఉన్నట్లే ఆమె అపవిత్రంగా ఉంటుంది.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “అపవిత్రం” అనేది నైతిక దోషాన్ని కాదు, రుతుస్రావంతో సంబంధమున్న ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది.
    reason: లేవీయకాండంలోని శుద్ధి నియమాల సాంస్కృతిక-ఆచారపరమైన భావాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇది మొత్తం నిబంధన సమాజాన్ని సూచించే జాతీయ నామం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אִשָּׁה כִּי תַזְרִיעַ
  choice: ఒక స్త్రీ గర్భం దాల్చి
  rationale: תַזְרִיעַ పదానికి అక్షరార్థంగా విత్తనం ఉత్పత్తి చేయడం అనే నేపథ్యం ఉన్నా, ప్రసవ సందర్భంలో గర్భధారణను సూచిస్తుంది. כִּי ఇక్కడ న్యాయనియమంలోని సందర్భాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘గర్భం దాల్చి’ అనే నిర్మాణం ‘ఒకవేళ/ఎప్పుడు’ అనే కఠిన ఎంపిక లేకుండానే సహజంగా షరతు-సందర్భ భావాన్ని నిలుపుతుంది.
- source_word: וְיָלְדָה זָכָר
  choice: మగబిడ్డను కంటే
  rationale: זָכָר సంతానం యొక్క పురుష లింగాన్ని స్పష్టంగా సూచిస్తుంది. ‘కుమారుణ్ణి కంటే’ కంటే ‘మగబిడ్డను కంటే’ మూలంలోని లింగ వర్గీకరణను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וְטָמְאָה שִׁבְעַת יָמִים
  choice: ఆమె ఏడు రోజులపాటు అపవిత్రంగా ఉంటుంది
  rationale: టుమ్అా అనే ఆచారపరమైన స్థితిని ‘అపవిత్రం’ అనే ప్రామాణిక తెలుగు పదంతో తెలిపి, మూలంలో లేని ‘ఆచారపరంగా’ అనే వివరణను ప్రధాన వచనంలో చేర్చలేదు.
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: తన రుతుస్రావం కారణంగా అపవిత్రంగా ఉండే రోజులలో ఉన్నట్లే
  rationale: נִדָּה మరియు דְּוֺתָהּ కలిపి రుతుస్రావంతో సంబంధమున్న అపవిత్రత కాలాన్ని సూచిస్తాయి. తెలుగు పాఠకునికి సహజంగా అర్థమయ్యేలా సంబంధాన్ని స్పష్టం చేస్తూనే, ఇది నైతిక దోషమనే భావాన్ని కలపకుండా అనువదించబడింది.
- source_word: תִּטְמָא
  choice: అపవిత్రంగా ఉంటుంది
  rationale: వాక్యాంతంలో హీబ్రూ అపవిత్ర స్థితిని మళ్లీ స్పష్టంగా చెబుతుంది; ఆ పునరుక్తిని తెలుగులోనూ నిలిపాం.
theological_decisions:
- issue: טמא సూచించే అపవిత్రత స్వభావం
  choice: ప్రధాన వచనంలో ‘అపవిత్రంగా’
  alternative: ‘ఆచారపరంగా అపవిత్రంగా’
  rationale: ఈ నియమం ఆచారపరమైన శుద్ధి-అశుద్ధి పరిధిలో ఉన్నప్పటికీ, హీబ్రూ క్రియ స్వయంగా కేవలం అపవిత్ర స్థితినే పేర్కొంటుంది. అందువల్ల వివరణాత్మక విశేషణాన్ని ప్రధాన వచనంలో చేర్చకుండా, పాదసూచికలో సందర్భాన్ని వివరించాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహ సూచన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇది కేవలం పురుషులను కాక నిబంధన సమాజాన్ని ఉద్దేశించే స్థిర జాతీయ designation. ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో విస్తృత సమూహ సూచనను సహజంగా అందిస్తుంది.
- issue: כִּי యొక్క షరతు/కాల భావం
  choice: 'తెలుగు క్రియాసంబంధ నిర్మాణం: ‘గర్భం దాల్చి ... కంటే’'
  alternative: ‘ఒకవేళ ... అయితే’ లేదా ‘ఎప్పుడు ... అప్పుడు’
  rationale: న్యాయనియమ సందర్భంలో హీబ్రూ כִּי ‘ఒకవేళ’ లేదా ‘ఎప్పుడు’ అనే రెండు విధాలుగా గ్రహించవచ్చు. తెలుగు నిర్మాణం ఈ నిజమైన భావసందిగ్ధతను బలవంతంగా పరిష్కరించకుండా సహజంగా సందర్భాన్ని పరిచయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయవిధి శైలి. ‘రుతుస్రావం’ వంటి నేటి పాఠకులకు స్పష్టమైన పదాన్ని వాడి, పాతకాలపు లేదా అవమానార్థం కలిగించే పదాలను నివారించాం. మూలంలోని అపవిత్రత పునరుక్తిని నిలిపి, כִּי యొక్క ‘ఒకవేళ/ఎప్పుడు’ భావసందిగ్ధతను సహజ తెలుగు వాక్యనిర్మాణంలో పరిరక్షించాం.
