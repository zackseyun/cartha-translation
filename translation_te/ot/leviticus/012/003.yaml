lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: రోజున
  rationale: సంయోజక అవ్యయంతో కూడిన కాలసూచక పదబంధాన్ని తెలుగులో సహజంగా ‘రోజున’ అని అనువదించాం; వచనాల క్రమాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’తో చూపడం అవసరం లేదు.
- source_word: הַ/שְּׁמִינִי
  choice: ఎనిమిదవ
  rationale: ‘రోజు’ను విశేషించే సాధారణ క్రమసంఖ్యకు నేరమైన సమానార్థకం.
- source_word: יִמּוֹל
  choice: సున్నతి చేయబడాలి
  rationale: నిఫ్అల్ క్రియారూపంలోని కర్మణి భావాన్ని నిలిపి, ధర్మశాస్త్ర ఆజ్ఞార్థక బలాన్ని ఆధునిక తెలుగులో సహజమైన ‘చేయబడాలి’తో వ్యక్తం చేశాం.
- source_word: בְּשַׂר
  choice: మాంసం
  rationale: ఈ నామవాచకానికి నేరమైన అర్థం ‘మాంసం’; తరువాతి పదంతో ఉన్న సంబంధాన్ని తెలుగులో సమాససదృశ పదబంధంగా ఉంచాం.
- source_word: עָרְלָת/וֹ
  choice: అతని ముందోలి
  rationale: మూలపదంలోని పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని ‘అతని’తో, foreskin అనే శరీరభాగాన్ని ఆధునికంగా అర్థమయ్యే ‘ముందోలి’తో అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. కర్మణి రూపాన్నీ, ‘మాంసం’ అనే మూలంలోని స్పష్టమైన శరీరపదాన్నీ నిలిపాం; పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చాం.
