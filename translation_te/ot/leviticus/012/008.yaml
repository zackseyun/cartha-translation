id: LEV.12.8
reference: Leviticus 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: te
  text: అయితే గొర్రెపిల్లను కొనడానికి ఆమెకు స్తోమత లేకపోతే, ఆమె రెండు గువ్వలనైనా రెండు పావురపు పిల్లలనైనా తీసుకురావాలి—ఒకటి దహనబలిగా, మరొకటి పాపపరిహార బలిగా[a]. యాజకుడు ఆమె కోసం ప్రాయశ్చిత్తం చేయాలి; అప్పుడు ఆమె శుద్ధురాలవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధీకరణ బలిగా.” ఈ సందర్భంలో ఇది ప్రసవానంతర ఆచార అపవిత్రతకు సంబంధించిన బలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: గొర్రెపిల్లను అర్పించే స్తోమత ఆమెకు లేకపోతే
  rationale: ‘ఆమె చెయ్యి గొర్రెపిల్లకు సరిపడేదాన్ని కనుగొనకపోతే’ అనే హీబ్రూ నుడికారం ఆర్థిక సామర్థ్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘స్తోమత లేకపోతే’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది; ‘అర్పించే’ అనే పదం బలి సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: שֶׂה
  choice: గొర్రెపిల్ల
  rationale: ముందటి వచనంలోని బలి జంతువు సందర్భంలో ఇది సహజమైన, నిర్దిష్టమైన తెలుగు సమానం.
- source_word: שְׁתֵּי תֹרִים
  choice: రెండు గువ్వలు
  rationale: תֹרִים తాబేలు గువ్వలు/టర్టిల్‌డవ్‌లను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘గువ్వలు’ స్పష్టమైన పక్షిపేరు.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: రెండు పావురపు పిల్లలు
  rationale: అక్షరార్థంగా ‘పావురం పిల్లలు’; ‘పావురపు పిల్లలు’ హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో కచ్చితంగా అందిస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా అగ్నికి అర్పించే బలిని సూచించే స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: హీబ్రూ బలి పదానికి సంప్రదాయంగా ‘పాపపరిహార బలి’ సరిపోతుంది. అయితే ప్రసవానంతర ఆచార శుద్ధి సందర్భంలో ‘శుద్ధీకరణ బలి’ అనే భావసాధ్యతను పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: యాజకుడు ఆమె కోసం ప్రాయశ్చిత్తం చేయాలి
  rationale: כפר యొక్క యాజక-బలి సంబంధిత ధార్మిక బలాన్ని ‘ప్రాయశ్చిత్తం చేయాలి’ నిలుపుతుంది; עָלֶיהָను సహజ తెలుగులో ‘ఆమె కోసం’గా అందించాం.
- source_word: וְטָהֵרָה
  choice: ఆమె శుద్ధురాలవుతుంది
  rationale: ఇది నైతిక నిర్దోషిత్వం కంటే ఆచారపరమైన శుద్ధస్థితికి పునరుద్ధరణను సూచిస్తుంది. ‘శుద్ధురాలవుతుంది’ ఆ ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రసవానంతర శుద్ధీకరణ సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ప్రధాన పాఠంలో కీలకమైన బలి పదానికి స్థిరత్వం కోసం ‘పాపపరిహార బలి’ ఉంచబడింది. అయితే ఈ అధ్యాయం వ్యక్తిగత నైతిక అపరాధం కంటే ప్రసవానంతర ఆచార అపవిత్రతను చర్చిస్తున్నందున, సందర్భానుకూలమైన ‘శుద్ధీకరణ బలి’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి హీబ్రూ పదంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధార్మిక శైలిని వాడాం. ‘స్తోమత’, ‘దహనబలి’, ‘ప్రాయశ్చిత్తం’, ‘శుద్ధురాలు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని ఆర్థిక, బలిసంబంధ, ఆచారపరమైన భావాలను నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
