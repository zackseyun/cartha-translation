source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: te
  text: కుమారుని గానీ కుమార్తెను గానీ కనిన తరువాత ఆమె శుద్ధీకరణ దినాలు పూర్తయినప్పుడు, దహనబలిగా ఏడాది వయసున్న గొర్రెపిల్లను, పాపబలిగా[a] పావురపు పిల్లను లేదా తాబేలు పావురాన్ని, సమాగమ గుడారం ప్రవేశద్వారం వద్ద యాజకుని దగ్గరకు ఆమె తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలిగా.’ ఇక్కడి హెబ్రీ పదం కేవలం నైతిక అపరాధానికి అర్పించే బలినే కాకుండా, ఆచార అపవిత్రతను తొలగించడానికి అర్పించే బలిని కూడా సూచించగలదు.
    reason: חַטָּאת పదానికి ఈ సందర్భంలో ఉన్న ఆచార శుద్ధీకరణ భావాన్ని కాపాడే పదప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וּבִמְלֹאת
  choice: పూర్తయినప్పుడు
  rationale: ב־ తో కూడిన מלא infinitive construct ఒక కాలవ్యవధి పూర్తయ్యే సమయాన్ని సూచిస్తుంది; ‘పూర్తయినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఆ కాలార్థాన్ని నిలుపుతుంది.
- source_word: יְמֵי טָהֳרָהּ
  choice: ఆమె శుద్ధీకరణ దినాలు
  rationale: טָהֳרָה ఇక్కడ ఆచారసంబంధమైన శుద్ధస్థితిని సూచిస్తుంది. ‘శుద్ధీకరణ’ నైతిక అపరాధాన్ని సూచించకుండా లేవీయకాండపు ఆచారపరమైన భావాన్ని కాపాడుతుంది.
- source_word: לְבֵן אוֹ לְבַת
  choice: కుమారుని కనిన సందర్భంలోనైనా, కుమార్తెను కనిన సందర్భంలోనైనా
  rationale: ఈ నియమం రెండు ప్రసవ సందర్భాలకూ వర్తిస్తుందని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תָּבִיא
  choice: ఆమె తీసుకురావాలి
  rationale: హిఫిల్ imperfect ధర్మశాస్త్ర సందర్భంలో విధిని తెలుపుతుంది; ‘తీసుకురావాలి’ అనేది అతిశయ తీవ్రత లేకుండా ఆ నిర్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: ఏడాది వయసున్న గొర్రెపిల్ల
  rationale: ఈ హెబ్రీ నానుడి మొదటి సంవత్సరంలోని లేదా ఏడాది వయసుగల గొర్రెపిల్లను సూచిస్తుంది; ఎంపిక చేసిన రూపం సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే స్థిరమైన యాజక సంబంధ పదం; ‘దహనబలి’ దాని ఆచారపరమైన ప్రత్యేకతను నిలుపుతుంది.
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: పావురపు పిల్లను లేదా తెల్లగువ్వను
  rationale: בֶּן יוֹנָה చిన్న పావురాన్ని, תֹר turtledove జాతిని సూచిస్తాయి. ‘పావురపు పిల్ల’ మొదటి పదంలోని వయోభేదాన్ని నిలుపుతుంది; ‘తెల్లగువ్వ’ రెండవ బలిపక్షికి తెలుగులో స్థిరపడిన బైబిలు పదం.
- source_word: לְחַטָּאת
  choice: పాపబలిగా
  rationale: חַטָּאת కు యాజక సంబంధ గ్రంథాల్లో సంప్రదాయ సాంకేతిక పదం ‘పాపబలి’; అయితే ఈ సందర్భంలో ఆచార అపవిత్రత తొలగింపే ప్రధానమైనందున ‘శుద్ధీకరణ బలి’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: ప్రత్యక్ష గుడారపు ప్రవేశద్వారం దగ్గర యాజకుని వద్దకు
  rationale: మొదటి אֶל సమర్పణ స్థలాన్ని, రెండవది స్వీకర్తను సూచిస్తుంది. ఈ క్రమం బలులను ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గర ఉన్న యాజకుని వద్దకు తీసుకురావడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రసవానంతర శుద్ధీకరణ సందర్భంలో חַטָּאת పదం అనువాదం
  choice: పాపబలి
  alternative: శుద్ధీకరణ బలి
  rationale: లేవీయకాండపు బలి పరిభాషలో ‘పాపబలి’ గుర్తించదగిన సాంకేతిక పదం. అయినా ఇక్కడ ప్రసవం నైతిక పాపమని వాక్యం చెప్పడం లేదు; ఆచార అపవిత్రత నుంచి పునరుద్ధరణే సందర్భం. అందువల్ల ప్రధాన పాఠంలో సంప్రదాయ పదాన్ని ఉంచి, సందర్భార్థాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. బలి సంబంధ సాంకేతిక పదాలను నిలుపుతూ, పొడవైన హెబ్రీ వాక్యాన్ని విరామచిహ్నాలతో సులభంగా చదవగలిగేలా చేశాం.
