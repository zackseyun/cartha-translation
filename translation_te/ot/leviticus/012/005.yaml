language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: te
  text: అయితే ఆమె ఆడబిడ్డను కనితే, తన రుతుస్రావ అపవిత్రత వలె[a] రెండు వారాలు అపవిత్రురాలిగా ఉంటుంది. ఆ తరువాత అరవై ఆరు రోజులు శుద్ధీకరణ రక్తకాలంలో ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “ఆమె రుతుస్రావ అపవిత్రత వలె.” హీబ్రూ పదం రుతుస్రావంతో సంబంధమున్న ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “శుద్ధీకరణ రక్తకాలం” అనేది ప్రసవం తరువాత నియమించబడిన శుద్ధీకరణ కాలాన్ని సూచిస్తుంది; ఇది నైతిక దోషాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … కనితే
  rationale: మునుపటి వచనంలోని మగబిడ్డ సందర్భానికి భిన్నమైన పరిస్థితిని పరిచయం చేస్తుంది; తెలుగులో ‘అయితే’ ఆ సందర్భభేదాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נְקֵבָה תֵלֵד
  choice: ఆడబిడ్డను కనితే
  rationale: נְקֵבָה అంటే ‘ఆడది/స్త్రీలింగానికి చెందినది’; ప్రసవ సందర్భంలో ‘ఆడబిడ్డ’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు.
- source_word: וְטָמְאָה
  choice: అపవిత్రురాలిగా ఉంటుంది
  rationale: ఇది నైతిక దోషాన్ని కాక ఆచారపరమైన స్థితిని సూచిస్తుంది. మూలంలోని ప్రధాన పదాన్ని నిలుపుతూ తెలుగులో న్యాయనియమ శైలికి తగిన రూపం వాడబడింది.
- source_word: שְׁבֻעַיִם
  choice: రెండు వారాలు
  rationale: ద్వివచన రూపం ఈ సందర్భంలో రెండు వారాలను సూచిస్తుంది; ఇది తెలుగులో స్పష్టమైన కాలవ్యవధి.
- source_word: כְּנִדָּתָהּ
  choice: తన రుతుస్రావ అపవిత్రత కాలంలో ఉన్నట్లే
  rationale: נִדָּה రుతుస్రావంతో ముడిపడిన కాలాన్ని, ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ఈ అనువాదం పోలికను స్పష్టంగా ఉంచి నైతిక అపవిత్రత భావాన్ని కలిగించదు.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: అరవై ఆరు రోజులు
  rationale: హీబ్రూ సంఖ్యా నిర్మాణంలోని మొత్తం పరిమాణాన్ని సహజమైన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
- source_word: תֵּשֵׁב
  choice: ఉంటుంది
  rationale: పదశః ‘కూర్చుంటుంది/నివసిస్తుంది’ అయినా, ఈ న్యాయ సందర్భంలో ఒక నిర్దిష్ట స్థితిలో లేదా కాలంలో కొనసాగడమే భావం.
- source_word: דְּמֵי טָהֳרָה
  choice: శుద్ధీకరణ రక్తస్రావ స్థితి
  rationale: హీబ్రూలో పదశః ‘శుద్ధీకరణ రక్తాలు’ అనే బహువచన నుడికారం ఉంది. తెలుగులో అర్థమయ్యేలా ప్రసవానంతర రక్తస్రావంతో కూడిన శుద్ధీకరణ స్థితిగా అనువదించబడింది; ఇది నైతిక దోషానికి ప్రాయశ్చిత్తమని చెప్పదు.
theological_decisions:
- issue: లేవీయకాండంలోని అపవిత్రత స్వభావం
  choice: ‘అపవిత్రురాలు’ అనే మూలపదానికి సమీపమైన పదాన్ని ఉంచి, సందర్భం ద్వారా అది ఆచారపరమైన స్థితి అని తెలియజేయడం
  alternative: ‘ఆచారపరంగా అపవిత్రురాలు’ అని ప్రధాన పాఠంలోనే స్పష్టీకరించడం
  rationale: טמא ఇక్కడ ప్రసవం తరువాతి ఆరాధనా/ఆచార సంబంధ స్థితిని సూచిస్తుంది; వ్యక్తిగత పాపం లేదా నైతిక కల్మషాన్ని కాదు. ‘ఆచారపరంగా’ అని చేర్చడం సరైన వివరణ అయినా మూలంలో ప్రత్యక్షంగా లేని విశేషణాన్ని ప్రధాన పాఠంలో చేర్చుతుంది.
- issue: דְּמֵי טָהֳרָה భావం
  choice: ప్రసవానంతర శుద్ధీకరణకు సంబంధించిన రక్తస్రావ స్థితిగా అనువదించడం
  alternative: పదశః ‘శుద్ధీకరణ రక్తాలు’ అని అనువదించడం
  rationale: హీబ్రూ నుడికారంలోని ఆచారపరమైన భావాన్ని నిలుపుతూ, తెలుగులో అపార్థం కలిగించే పదశః బహువచనాన్ని నివారిస్తుంది; ఇది నైతిక అపరాధం నుంచి శుద్ధి అని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండ న్యాయశైలికి తగిన గౌరవప్రదమైన భాష. మూలంలోని ఆచారపరమైన పదజాలం నిలుపబడింది. అందించిన ఆంగ్ల పాఠంలో పాదసూచిక గుర్తులు వాటి వివరణలకు సరిపోని స్థానాల్లో ఉన్నందున, తెలుగు పాఠంలో [a]ను రుతుస్రావ పోలిక తరువాత, [b]ను శుద్ధీకరణ రక్తస్రావ వాక్యభాగం తరువాత ఉంచాం.
