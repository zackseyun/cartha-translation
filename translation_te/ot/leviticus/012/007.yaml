source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: te
  text: అతడు దానిని యెహోవా సన్నిధిలో అర్పించి, ఆమె కొరకు ప్రాయశ్చిత్తం చేస్తాడు; అప్పుడు ఆమె తన రక్తపు మూలం నుండి శుద్ధురాలవుతుంది.[a] మగబిడ్డకైనా ఆడబిడ్డకైనా జన్మనిచ్చిన స్త్రీకి వర్తించే నియమం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, ‘ఆమె రక్తపు మూలం నుండి’; ‘ఆమె రక్తప్రవాహం నుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: అతడు దానిని ... అర్పించి
  rationale: קרב హిఫీల్ రూపం, ముందు వచనంలో చెప్పిన అర్పణను యాజకుడు యెహోవా సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది. ‘అర్పించి’ ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఈ ఆరాధనా ప్రయోగం ‘యెహోవా ఎదుట/సన్నిధిలో’ అనే భావాన్ని ఇస్తుంది; దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా ఉంచింది.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: ఆమె నిమిత్తం ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ధర్మశాస్త్రంలోని బలి సందర్భంలో כפרకు ‘ప్రాయశ్చిత్తం చేయడం’ సరైన, సుపరిచితమైన సమానార్థకం; ప్రాయశ్చిత్త సిద్ధాంతాన్ని మరింత సంకుచితంగా నిర్వచించదు.
- source_word: וְטָהֲרָה
  choice: అప్పుడు ఆమె ... శుద్ధురాలవుతుంది
  rationale: వావ్ అనుక్రమంతో వచ్చిన Qal perfect, యాజకుని చర్య ఫలితంగా ఆమె ఆచారపరంగా శుద్ధస్థితికి చేరడాన్ని సూచిస్తుంది. తెలుగులో ‘శుద్ధురాలవుతుంది’ సహజంగా ఆ ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: తన రక్తస్రావ మూలం నుండి
  rationale: מָקוֹר అనే పదంలోని ‘మూలం/ఊట’ రూపకాన్ని ‘మూలం’తో నిలుపుతూ, ప్రసవానంతర రక్తప్రవాహ సందర్భాన్ని ‘రక్తస్రావం’తో స్పష్టం చేసింది.
- source_word: זֹאת תּוֹרַת
  choice: ధర్మశాస్త్రం ఇదే
  rationale: ఇక్కడ תּוֹרָה నిర్దేశిత ఆచార నియమాన్ని సూచిస్తుంది. లేవీయకాండ సందర్భంలో ‘ధర్మశాస్త్రం’ గౌరవప్రదమైన, సుపరిచితమైన ప్రయోగం.
- source_word: הַיֹּלֶדֶת
  choice: కనే స్త్రీ
  rationale: ఈ కృదంతం ప్రసవించే స్త్రీని నేరుగా సూచిస్తుంది; ‘తల్లి’ అనడం కంటే మూలానికి దగ్గరగా ఉంది.
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: మగబిడ్డనైనా ఆడబిడ్డనైనా
  rationale: హీబ్రూలోని ‘మగ/ఆడ’ లింగ పదభేదాన్ని నిలుపుతూ, మానవ ప్రసవ సందర్భంలో తెలుగులో సహజంగా ఉండేందుకు ‘బిడ్డ’ను చేర్చింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచింది. తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: וְכִפֶּר עָלֶיהָ యొక్క ఆచార-దైవశాస్త్ర భావం
  choice: ఆమె నిమిత్తం ప్రాయశ్చిత్తం చేయాలి
  alternative: ఆమెను శుద్ధి చేయాలి
  rationale: כפרను కేవలం శుద్ధీకరణగా కుదించకుండా, బలి సంబంధ ప్రాయశ్చిత్త భావాన్ని నిలుపుతుంది; వెంటనే వచ్చే ‘శుద్ధురాలవుతుంది’ అనే ఫలితంతో రెండింటి సంబంధమూ నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటించింది. ఆచారపరమైన శుద్ధి భావాన్ని తెలియజేయడానికి ‘శుద్ధురాలు’, బలి సంబంధ పదానికి ‘ప్రాయశ్చిత్తం’ వాడింది. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
