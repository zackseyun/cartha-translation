  rationale: హీబ్రూ మָקוֹר (‘మూలం, ఊట’) యొక్క రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, సందర్భానుగుణమైన ‘రక్తప్రవాహం’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం. అలాగే, תּוֹרָה యొక్క ఈ సందర్భోచిత ఆచార-నియమ భావాన్ని స్పష్టపరచడానికి ‘ధర్మశాస్త్రం’ను ‘వర్తించే నియమం’గా సవరించాం. ఇతర ముఖ్య పదాలు, దైవనామం, ఆచారపరమైన ప్రాయశ్చిత్తం మరియు శుద్ధి భావాలు నిలుపబడ్డాయి.
