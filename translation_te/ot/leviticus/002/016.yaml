  terminology: ‘యాజకుడు,’ ‘జ్ఞాపకార్థ భాగం,’ ‘దంచిన ధాన్యం,’ and ‘సాంబ్రాణి’ are suitable. The divine name is revised to ‘యాహ్వే’ to align with the supplied English POB audit trail and project decision.
