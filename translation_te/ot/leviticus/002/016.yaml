    rationale: Although understandable, the phrase repeats the idea of offering. ‘అగ్న్యర్పణ’ naturally expresses the technical sacrificial designation אִשֶּׁה.
  revised_text: యాజకుడు దాని దంచిన ధాన్యంలోనుండి, దాని నూనెలోనుండి జ్ఞాపకార్థ భాగాన్ని తీసుకొని, దాని సాంబ్రాణి అంతటితో కలిపి దహించాలి; అది యాహ్వేకు అగ్న్యర్పణ.[a]
