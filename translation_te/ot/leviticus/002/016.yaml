source:
  edition: WLC
  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: te
  text: యాజకుడు దాని దంచిన ధాన్యంలోనుండి, దాని నూనెలోనుండి జ్ఞాపకార్థ భాగాన్ని తీసుకొని, దాని సాంబ్రాణి అంతటితో కలిపి దహించాలి; అది యాహ్వేకు అగ్న్యర్పణ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దంచిన ధాన్యం’ అనే హెబ్రీ పదాన్ని ‘ముతకగా నూరిన ధాన్యం’ లేదా ‘దంచిన గింజలు’ అని కూడా అనువదించవచ్చు; ఇది ధాన్యార్పణ కోసం సిద్ధం చేసిన పగులగొట్టిన గింజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠంపై అర్పణను కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచించే హిఫిల్ క్రియ. ఆధునిక తెలుగు పాఠకులకు ‘దహించాలి’ సహజంగా ఉండి ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సేవలోని כהן పదానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: אַזְכָּרָתָהּ
  choice: జ్ఞాపకార్థ భాగం
  rationale: ధాన్యార్పణలో బలిపీఠంపై దహించే ప్రతినిధి భాగాన్ని సూచించే సాంకేతిక పదం. ‘భాగం’ అని చెప్పడం మొత్తం అర్పణ కాదనే విషయాన్ని స్పష్టం చేస్తుంది.
- source_word: מִגִּרְשָׂהּ
  choice: దాని దంచిన ధాన్యంలోనుండి
  rationale: גרש దంచిన లేదా ముతకగా నూరిన ధాన్యపు గింజలను సూచిస్తుంది. ‘దంచిన ధాన్యం’ సాంకేతికతను తగ్గించకుండా సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּמִשַּׁמְנָהּ
  choice: దాని నూనెలోనుండి
  rationale: מן ఉపసర్గ జ్ఞాపకార్థ భాగం ధాన్యం నుండీ నూనె నుండీ తీసుకోబడుతుందని సూచిస్తుంది; మూల వాక్య నిర్మాణాన్ని నిలుపుతుంది.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: దాని సాంబ్రాణి అంతటితో కలిపి
  rationale: ఈ బలి సందర్భంలో על సహచర్యాన్ని సూచిస్తుంది. సాంబ్రాణి మొత్తాన్నీ జ్ఞాపకార్థ భాగంతో పాటు కాల్చాలని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: అగ్ని ద్వారా సమర్పించే బలికి సంబంధించిన స్థిర ఆచారపదం. ‘ఆహార అర్పణ’ అనే అనవసర అపార్థాన్ని నివారిస్తూ అగ్ని అంశాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: లామెద్ అర్పణ యొక్క అంకిత దిశను సూచిస్తుంది. దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אַזְכָּרָה యొక్క ఆచారపరమైన భావం
  choice: జ్ఞాపకార్థ భాగం
  alternative: జ్ఞాపకార్పణ
  rationale: ఇది ధాన్యార్పణ మొత్తం కాకుండా దానిలో బలిపీఠంపై దహించే ప్రతినిధి భాగం. ‘భాగం’ ఈ భేదాన్ని కాపాడుతుంది; జ్ఞాపకం ఎవరికి లేదా ఏ విధంగా పనిచేస్తుందనే ధర్మశాస్త్ర వివరణను వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని ఆచార శాసనానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని ‘నుండి…నుండి’ నిర్మాణం నిలిపి, తెలుగులో చర్య స్పష్టంగా ఉండేందుకు ‘తీసుకొని’ చేర్చబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
