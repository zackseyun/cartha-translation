id: LEV.2.7
reference: Leviticus 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם מִנְחַ֥ת מַרְחֶ֖שֶׁת קָרְבָּנֶ֑/ךָ סֹ֥לֶת בַּ/שֶּׁ֖מֶן תֵּעָשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/007.yaml
  text: And if your offering is a grain offering from a pan[a], it shall be made of fine flour with oil.
translation:
  language: te
  text: నీ అర్పణ పెనంలో[a] తయారుచేసిన ధాన్యార్పణ అయితే, అది నూనెతో కూడిన మెత్తని పిండితో చేయబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తవా,’ ‘లోతైన పెనం,’ లేదా ‘వంట పాత్ర’; ఈ హీబ్రూ పదం సూచించే పాత్ర ఖచ్చితంగా ఎలాంటిదో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: సందర్భంలోని వరుస నియమాలలో మరో సందర్భాన్ని షరతుగా పరిచయం చేస్తుంది; తెలుగులో సహజమైన నియమవాక్య నిర్మాణం కోసం ‘అయితే’ వాడబడింది.
- source_word: מִנְחַת
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండము 2లో ఇది సాధారణ కానుకను కాక ధాన్యంతో చేసే నిర్దిష్ట అర్పణను సూచిస్తుంది.
- source_word: מַרְחֶשֶׁת
  choice: పెనం
  rationale: వంటకు ఉపయోగించే పాత్రను సూచిస్తుంది; దాని ఖచ్చితమైన ఆకారం తెలియనందున సాధారణమైన తెలుగు పదాన్ని ఎంచుకొని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: קָרְבָּנְךָ
  choice: నీ అర్పణ
  rationale: దేవుని దగ్గరకు తీసుకువచ్చే అర్పణ అనే సాధారణ భావాన్నీ, ద్వితీయ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ధాన్యార్పణలకు ఉపయోగించే సన్నగా చేసిన నాణ్యమైన పిండిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: בַּשֶּׁמֶן
  choice: నూనెతో
  rationale: తయారీలో నూనె తోడుగా లేదా పదార్థంగా ఉండడాన్ని తెలియజేస్తుంది; ‘కలిపి’ అని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: תֵּעָשֶׂה
  choice: చేయాలి
  rationale: నిఫాల్ క్రియలోని తయారు చేయబడే భావాన్ని తెలుగు నియమవాక్యానికి సహజమైన విధి రూపంలో అందిస్తుంది; అర్పణను ఎలా సిద్ధం చేయాలో నిర్దేశిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా నియమానికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. ‘ధాన్యార్పణ’ అనే పదం సందర్భంలోని బలివిధి అర్థాన్ని స్పష్టంగా ఉంచుతుంది; పాత్రకు సంబంధించిన మూలభాషా అనిశ్చితి పాదసూచికలో భద్రపరచబడింది.
