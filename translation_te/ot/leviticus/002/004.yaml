id: LEV.2.4
reference: Leviticus 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: te
  text: నీవు ధాన్య నైవేద్యంగా పొయ్యిలో కాల్చిన అర్పణను సమర్పిస్తే, అది సన్నగా నూరిన పిండితో చేసిన నూనె కలిపిన పులియని రొట్టెలుగానో లేదా[a] నూనె పూసిన పులియని పలుచని రొట్టెలుగానో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరియు నూనె పూసిన పులియని పలుచని రొట్టెలు.’ హీబ్రూలోని అనుసంధాన పదం ‘మరియు’; అయితే ఇక్కడ అది పొయ్యిలో కాల్చిన ధాన్య నైవేద్యానికి మరో రూపాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: నీవు … అర్పిస్తే
  rationale: బలుల నియమావళిలో తదుపరి షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అయితే’ అనే అదనపు అనుసంధానం లేకుండానే ‘అర్పిస్తే’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תַקְרִב קָרְבַּן
  choice: అర్పిస్తే
  rationale: హిఫిల్ రూపంలోని క్రియకు ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావం ఉంది. ‘అర్పిస్తే’ బలిని దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించే చర్యను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִנְחָה
  choice: ధాన్య నైవేద్యం
  rationale: లేవీయకాండము 2లో ఇది పిండి, నూనెతో సిద్ధం చేసే ప్రత్యేక బలి రకాన్ని సూచిస్తుంది; సాధారణ కానుక అనే విస్తృత అర్థం కాకుండా ఆ ఆచారపరమైన ప్రత్యేకతను నిలుపుతుంది.
- source_word: מַאֲפֵה תַנּוּר
  choice: పొయ్యిలో కాల్చిన
  rationale: తన్నూర్‌లో కాల్చి సిద్ధం చేసే విధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలికి ఉపయోగించే సన్నగా శుద్ధి చేసిన నాణ్యమైన పిండిని సూచిస్తుంది.
- source_word: חַלּוֹת מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టకుండా చేసిన రొట్టె లేదా కేకు వంటి భాగాలను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: నూనెను పిండిలో లేదా రొట్టెల మిశ్రమంలో కలిపిన స్థితిని సూటిగా తెలుపుతుంది.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: లేదా[a] … పులియని పలుచని రొట్టెలు
  rationale: רְקִיקִים పలుచని రొట్టెలను సూచిస్తుంది. వావ్ అక్షరార్థంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ పొయ్యిలో కాల్చే నైవేద్యపు రెండో అనుమతించబడిన రూపాన్ని జాబితా చేస్తున్నందున ప్రధాన పాఠ్యంలో ‘లేదా’ అని ఇచ్చి, మూలంలోని అనుసంధానాన్ని పాదసూచికలో నిలిపాం.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: నూనె పూసిన
  rationale: ఈ ఆహార సిద్ధీకరణ సందర్భంలో משׁח నూనెను ఉపరితలంపై పూయడాన్ని సూచిస్తుంది; ‘అభిషేకించిన’ కంటే ‘పూసిన’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో מִנְחָה అనువాదం
  choice: ధాన్య నైవేద్యం
  alternative: కానుక / అర్పణ
  rationale: ఈ అధ్యాయంలో పిండి, నూనెతో సిద్ధం చేసే నిర్దిష్ట బలి విభాగమే ఉద్దేశం. ‘ధాన్య నైవేద్యం’ ఆ ప్రత్యేకతను నిలుపుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: וּרְקִיקֵי ముందు ఉన్న וְ సంబంధం
  choice: లేదా
  alternative: మరియు
  rationale: హీబ్రూ అనుసంధానం అక్షరార్థంగా ‘మరియు’; అయితే ఈ నియమంలో రెండు తయారీ రూపాలను ప్రత్యామ్నాయాలుగా పేర్కొన్నట్లు సందర్భం సూచిస్తుంది. అసలు రూపంలోని నిజమైన అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘నైవేద్యం’ను ఈ అధ్యాయంలోని ప్రత్యేక ధాన్యబలి వర్గానికి ఉపయోగించాం; ‘నూనె పూసిన’ అనే రూపం ఆహార సిద్ధీకరణ చర్యను అనవసరమైన అభిషేకార్థం లేకుండా తెలియజేస్తుంది.
