  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: te
  text: నీ ధాన్యార్పణలోని ప్రతి అర్పణకు ఉప్పు వేయాలి.[a] నీ ధాన్యార్పణలో నీ దేవుని నిబంధన ఉప్పు లోపించనివ్వకూడదు.[b] నీ అర్పణలన్నిటితో పాటు ఉప్పును అర్పించాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “ఉప్పుతో ఉప్పు వేయాలి.”'
    reason: lexical_alternative
  - marker: b
    text: “నీ దేవుని నిబంధన ఉప్పు” అనేది బలుల సందర్భంలో నిబంధనతో ముడిపడిన హీబ్రూ పదబంధం; దాని ప్రతీకాత్మక భావాన్ని ఈ వచనం వివరించదు.
    reason: cultural_note
  - marker: c
    text: 'లేదా: “నీ అర్పణలన్నిటి మీద ఉప్పును అర్పించాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: అర్పణ
  rationale: బలిగా దేవునికి సమర్పించేదాన్ని సూచించే విస్తృత పదం; ఆధునిక తెలుగు ఆరాధనా సందర్భంలో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండము 2లో ఇది ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణమైన ‘అర్పణ’ కంటే ఆచారపరమైన నిర్దిష్టతను కాపాడుతుంది.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: ఉప్పు వేసి సిద్ధం చేయాలి
  rationale: మూలంలో ‘ఉప్పుతో ఉప్పు వేయాలి’ అనే పదబంధం ఉంది. తెలుగు సహజత్వం కోసం ‘ఉప్పు వేసి సిద్ధం చేయాలి’ అని ఇచ్చి, పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תַשְׁבִּית
  choice: లేకుండా చేయకూడదు
  rationale: హిఫిల్ రూపం ఇక్కడ తొలగించడం లేదా లోపింపజేయడం అనే భావాన్ని ఇస్తుంది; నిషేధాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: నీ దేవుని నిబంధన ఉప్పు
  rationale: హీబ్రూ సంబంధపదబంధంలోని నిబంధనాత్మక ప్రతీకను వివరణాత్మకంగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: מֵעַל
  choice: నీ ధాన్యార్పణలో
  rationale: పదశఃగా ‘నీ ధాన్యార్పణ మీదనుండి’ అయినా, ‘లేకుండా చేయకూడదు’తో తెలుగు వాక్యనిర్మాణంలో స్థలార్థక ‘లో’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: నీ అర్పణలన్నిటితో పాటు
  rationale: עַל యొక్క మూలార్థం ‘మీద’ కావచ్చు; ఇక్కడ ప్రతి అర్పణకు ఉప్పు తోడుగా ఉండాలనే భావాన్ని సహజంగా తెలియజేస్తుంది. మరింత పదశః ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: תַּקְרִיב
  choice: అర్పించాలి
  rationale: קרב హిఫిల్ బలుల సందర్భంలో దగ్గరకు తీసుకురావడం, సమర్పించడం అనే భావం; తెలుగులో ‘అర్పించాలి’ ఆచారపరమైన చర్యను స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘నీ దేవుని నిబంధన ఉప్పు’ అనే నిబంధనాత్మక పదబంధాన్ని ప్రతీకాత్మక అర్థంతో వివరిస్తామా లేదా యథాతథంగా ఉంచాలా
  choice: ‘నీ దేవుని నిబంధన ఉప్పు’ అని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ‘నీ దేవుని నిబంధనకు సూచనగా ఉండే ఉప్పు’
  rationale: వచనం ఈ ప్రతీక యొక్క భావాన్ని స్వయంగా వివరించదు. అందువల్ల శాశ్వతత్వం, విశ్వాస్యత వంటి సాధ్యమైన భావాల్లో ఒక్కదానిని అనువాదంలో బలవంతంగా నిర్ణయించకుండా మూలంలోని ధార్మిక ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ధార్మిక శైలిని అనుసరించాం. ‘ధాన్యార్పణ’, ‘నిబంధన ఉప్పు’ వంటి మూలపాఠ్యానికి ముఖ్యమైన ఆచారపరమైన పదాలను నిలిపి, హీబ్రూ పదశః నిర్మాణం తెలుగులో అసహజంగా ఉన్న చోట పరిమిత సహజీకరణ చేశాం.
