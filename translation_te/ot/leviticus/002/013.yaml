revisions:
- from: నీ ధాన్యార్పణలోని ప్రతి అర్పణకు ఉప్పు వేసి సిద్ధం చేయాలి.[a] నీ దేవుని నిబంధన ఉప్పు నీ ధాన్యార్పణలో లేకుండా చేయకూడదు.[b] నీ అర్పణలన్నిటితో పాటు ఉప్పును అర్పించాలి.[c]
  to: నీ ధాన్యార్పణలోని ప్రతి అర్పణకు ఉప్పు వేయాలి.[a] నీ ధాన్యార్పణలో నీ దేవుని నిబంధన ఉప్పు లోపించనివ్వకూడదు.[b] నీ అర్పణలన్నిటితో పాటు ఉప్పును అర్పించాలి.[c]
