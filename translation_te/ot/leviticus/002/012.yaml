id: LEV.2.12
reference: Leviticus 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: te
  text: ప్రథమఫలాల అర్పణగా మీరు వాటిని యాహ్వేకు సమర్పించవచ్చు; అయితే ఇంపైన సువాసన కోసం అవి బలిపీఠం మీదికి ఎక్కకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇంపైన సువాసన కోసం అవి బలిపీఠం మీదికి ఎక్కకూడదు.” ఇది బలిపీఠంపై దేవునికి ఆమోదకరమైన అర్పణగా వాటిని అర్పించకూడదనే బలి సంబంధిత ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: ప్రథమఫలాల అర్పణగా
  rationale: ఈ పదబంధం ‘మొదటి పంటఫలాల అర్పణ’ను సూచిస్తుంది. సంక్షిప్తంగా, సహజంగా ఉండటంతో పాటు హీబ్రూ పదబంధంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: תַּקְרִיבוּ
  choice: మీరు … సమర్పించవచ్చు
  rationale: బలుల సందర్భంలో హిఫిల్ రూపం దేవునికి అర్పణగా తీసుకురావడం లేదా సమర్పించడం అని అర్థం. ముందరి వచనంతో ఉన్న వ్యత్యాసం దృష్ట్యా, ఇవి యెహోవాకు సమర్పించడానికి అనుమతి ఉందని ‘సమర్పించవచ్చు’ తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని / అవి
  rationale: పుంలింగ బహువచన సర్వనామం ముందరి వచనంలోని పులిసిన పదార్థం, తేనెను తిరిగి సూచిస్తుంది; తెలుగులో నిర్జీవ పదార్థాలకు ‘వాటిని/అవి’ సహజం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచి, ל ఉపసర్గను ‘కు’తో వ్యక్తం చేశాం.
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: అయితే … బలిపీఠం మీదికి ఎక్కకూడదు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘ఎక్కడం/పైకి వెళ్లడం’ అనే భావం ఉంది. బలిపీఠంపై దహనార్పణగా అర్పించడాన్ని సూచించే ఆచార సంబంధిత భావాన్ని నిలుపుతూ, మూలంలోని రూపకాన్ని తెలుగులో కాపాడాం.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: సువాసనగా
  rationale: ఇది దేవునికి ఆమోదకరమైన బలి గురించి వాడే స్థిరమైన బలిసంబంధ పదబంధం. ‘సువాసనగా’ మూలంలోని వాసన రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది సాధారణ బిరుదు కాదు, నిబంధన దైవనామం. దానిని పేరుగానే ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ‘బలిపీఠం మీదికి ఎక్కడం’ అనే బలి సంబంధిత భాష
  choice: మూలంలోని ‘ఎక్కు’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: బలిపీఠంపై దహనార్పణగా అర్పించకూడదు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా అవి బలిపీఠం మీదికి ‘ఎక్కకూడదు’ అంటుంది; దాని ఆచార సంబంధిత భావాన్ని పాదటిప్పణిలో వివరించడం ద్వారా మూల రూపకాన్నీ భావాన్నీ రెండింటినీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఆరాధనా సందర్భానికి తగిన గౌరవప్రద శైలి. మూలంలోని అనుమతి–నిషేధ వ్యత్యాసం మరియు ‘ఎక్కు’ అనే బలి రూపకం నిలుపబడ్డాయి.
