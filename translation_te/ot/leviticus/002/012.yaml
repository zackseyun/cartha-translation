    text: అక్షరార్థంగా, “ఇంపైన సువాసన కోసం అవి బలిపీఠం మీదికి ఎక్కకూడదు.” ఇది బలిపీఠంపై దేవునికి ఆమోదకరమైన అర్పణగా వాటిని అర్పించకూడదనే బలి సంబంధిత ప్రయోగం.
