- from: ప్రథమఫలాల అర్పణగా మీరు వాటిని యెహోవాకు సమర్పించవచ్చు; అయితే సువాసనగా అవి బలిపీఠం మీదికి ఎక్కకూడదు.[a]
  to: ప్రథమఫలాల అర్పణగా మీరు వాటిని యాహ్వేకు సమర్పించవచ్చు; అయితే ఇంపైన సువాసన కోసం అవి బలిపీఠం మీదికి ఎక్కకూడదు.[a]
