revisions:
- from: ధాన్యార్పణలో మిగిలినది అహరోనుకు, అతని కుమారులకు చెందుతుంది. అది యెహోవాకు అగ్నితో అర్పించే అర్పణలలో అత్యంత పవిత్రమైన భాగం.[a]
  to: ధాన్యార్పణలో మిగిలినది అహరోనుకు, అతని కుమారులకు చెందుతుంది. అది యెహోవాకు అగ్నితో అర్పించే అర్పణలలోని అత్యంత పవిత్రమైన భాగం.[a]
