id: LEV.2.3
reference: Leviticus 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: te
  text: ధాన్యార్పణలో మిగిలినది అహరోనుకు, అతని కుమారులకు చెందుతుంది. అది యెహోవాకు అగ్నితో అర్పించే అర్పణలలోని అత్యంత పవిత్రమైన భాగం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా ఆహారార్పణలలోని అత్యంత పవిత్రమైన భాగం.”
    reason: אִשֶּׁה అనే హెబ్రీ ఆరాధనా పదాన్ని ‘అగ్నితో అర్పించే అర్పణ’గానూ, ‘ఆహారార్పణ’గానూ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִן הַמִּנְחָה
  choice: ధాన్యార్పణలో మిగిలినది
  rationale: సందర్భంలో מִנְחָה ధాన్యార్పణను సూచిస్తుంది; substantival participle అయిన הַנּוֹתֶרֶתను సహజమైన ఆధునిక తెలుగులో ‘మిగిలినది’గా వ్యక్తం చేశాం.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు చెందుతుంది
  rationale: לְ ఇక్కడ కేటాయింపు లేదా స్వామ్యాన్ని సూచిస్తుంది; ‘చెందుతుంది’ అనే రూపం ఆ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పవిత్రమైన భాగం
  rationale: ఈ హెబ్రీయ సమాసం అత్యున్నత పవిత్రతా వర్గాన్ని సూచిస్తుంది. స్థలమైన ‘అతి పరిశుద్ధ స్థలం’తో గందరగోళం రాకుండా, ఇక్కడ ఉద్దేశించిన అర్పణ భాగాన్ని స్పష్టంగా పేర్కొన్నాం.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలలో
  rationale: אִשֶּׁה అగ్నితో సమర్పించే బలులు లేదా అర్పణలకు సంబంధించిన సాంకేతిక ఆరాధనా పదం. מִן ఇక్కడ ఆ వర్గంలో భాగమనే భావాన్ని ఇస్తుంది; అగ్ని సంబంధిత మూలభావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ వ్యక్తినామమైన יהוהను తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; దానిని బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים అనే ఆరాధనా వర్గీకరణ
  choice: అత్యంత పవిత్రమైన భాగం
  alternative: అతి పవిత్రమైనది; పవిత్రాతిపవిత్రమైనది
  rationale: ఈ మాట మిగిలిన అర్పణ భాగం యొక్క పవిత్రతా స్థాయిని సూచిస్తుంది. పరిశుద్ధ మందిరంలోని ఒక స్థలాన్ని సూచిస్తున్నట్టు అపార్థం కలగకుండా ‘భాగం’ను స్పష్టం చేశాం.
- issue: אִשֵּׁי יְהוָה యొక్క భావం
  choice: యెహోవాకు అగ్నితో అర్పించే అర్పణలు
  alternative: యెహోవా ఆహారార్పణలు; యెహోవా అగ్న్యర్పణలు
  rationale: ఈ సాంకేతిక పదానికి అగ్నిలో అర్పించబడే అర్పణలు అనే వ్యుత్పత్తి భావమూ, దేవునికి సమర్పించే ఆహారార్పణలు అనే ఆరాధనా భావమూ ఉన్నాయి. ప్రధాన పాఠ్యం అగ్ని సంబంధాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక సంబంధమైన గౌరవప్రదమైన శైలిని నిలిపాం. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యం చివర ఉంచబడింది.
