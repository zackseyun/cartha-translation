id: LEV.2.2
reference: Leviticus 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అతడు దానిని అహరోను కుమారులైన యాజకుల దగ్గరకు తీసుకురావాలి. యాజకుడు అక్కడి నుంచి దాని మెత్తని పిండిలో నుంచి తన గుప్పెడు నిండా, దాని నూనెలో నుంచి కొంత, దానిలోని సాంబ్రాణి అంతటితో కలిపి తీసుకోవాలి. యాజకుడు దాని జ్ఞాపకార్థ భాగాన్ని బలిపీఠం మీద దహించాలి; అది యాహ్వేకు ఇంపైన సువాసన కలిగించే అగ్నియర్పణ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్నితో అర్పించే అర్పణ”; లేదా, “ఆహార అర్పణ.”
    reason: אִשֶּׁה అనే యాజక సంబంధ సాంకేతిక పదాన్ని సాధారణంగా అగ్నితో అర్పించే అర్పణగా అర్థం చేసుకుంటారు; దానికి ‘ఆహార అర్పణ’ అనే ప్రత్యామ్నాయ అనువాదం కూడా ఉంది.
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: అతడు దానిని ... తీసుకురావాలి
  rationale: హిఫిల్ రూపంలోని ‘తీసుకురావడం’ అనే భావాన్ని, లేవీయకాండంలోని విధినిర్దేశ శైలికి తగిన ‘తీసుకురావాలి’తో వ్యక్తం చేసింది.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులు
  rationale: అహరోను కుమారుల కుటుంబ గుర్తింపునూ, యాజకులుగా వారి పాత్రనూ సహజమైన తెలుగు విశేషణ నిర్మాణంలో స్పష్టంగా ఉంచింది.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: తన గుప్పెడు నిండా తీసుకొని
  rationale: చేతిని మూసి పట్టగలిగినంత తీసుకోవడం అనే క్రియనూ, ‘అతని గుప్పెడు నిండా’ అనే పరిమాణాన్నీ కలిపి సహజంగా తెలిపింది.
- source_word: מִסָּלְתָּהּ
  choice: దాని మెత్తని పిండి
  rationale: సֹלֶת సాధారణ పిండి కాకుండా అర్పణలకు వాడే సన్నగా చేసిన మెత్తని పిండిని సూచిస్తుంది.
- source_word: וּמִשַּׁמְנָהּ
  choice: దాని నూనెలోనూ
  rationale: మూలంలోని מִן విభక్తి భావాన్ని నిలుపుతూ, పిండితో పాటు నూనె నుంచీ తీసుకోవడాన్ని తెలియజేస్తుంది; ‘కొంత’ అని స్పష్టీకరించి మూలంలో లేని పరిమాణాన్ని జోడించలేదు.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: దాని సాంబ్రాణి అంతటితో కలిపి
  rationale: లెబోనా అనే సుగంధ ద్రవ్యానికి సాధారణంగా అర్థమయ్యే ‘సాంబ్రాణి’ని వాడి, అది మొత్తం జ్ఞాపక భాగంతో అర్పించబడుతుందని తెలిపింది.
- source_word: אַזְכָּרָתָהּ
  choice: దాని జ్ఞాపక భాగం
  rationale: మొత్తం ధాన్యార్పణకు ప్రతినిధిగా బలిపీఠంపై దహించే సాంకేతిక బలి భాగాన్ని పదార్థానికి దగ్గరగా అనువదించింది.
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద దహించాలి
  rationale: బలి సందర్భంలో పొగగా పైకి వెళ్లేలా కాల్చడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపి, దిశార్థక రూపాన్ని స్థలార్థంగా సహజీకరించింది.
- source_word: אִשֵּׁה
  choice: అగ్ని అర్పణ
  rationale: ఈ యాజక సంబంధ సాంకేతిక పదంలోని అగ్నితో అర్పించే భావాన్ని సంక్షిప్తంగా తెలిపింది; ‘ఆహార అర్పణ’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: దైవ అంగీకారాన్ని సూచించే బలి సంబంధ రూపకాన్ని, పాతబడని గౌరవప్రదమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిల్ వాడుకలో విస్తృతంగా గుర్తుపట్టే దైవనామ రూపమైన ‘యెహోవా’ను ఉపయోగించి, దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపింది.
- issue: אִשֵּׁה అనే బలి సాంకేతిక పదం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: మూలపదపు వ్యుత్పత్తి, యాజక సంబంధ వాడుకపై ఉన్న అనిశ్చితిని ఏకపక్షంగా పరిష్కరించకుండా, ప్రధాన పాఠంలో సంప్రదాయ అగ్ని భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: וְקָמַץ క్రియకు కర్త ఎవరు
  choice: మూలంలోని వరుసను అనుసరించి ‘అతడు’ అనే కర్తను స్పష్టంగా పునరావృతం చేయలేదు
  alternative: ‘యాజకుడు అక్కడి నుంచి ... తీసుకొని’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠంలో ఈ క్రియకు పేరు ద్వారా కర్తను చెప్పకుండా, తరువాతి క్రియ వద్ద మాత్రమే ‘యాజకుడు’ అని ఉంది. అందువల్ల సాధ్యమైన సూచనను అనువాదంలో నిశ్శబ్దంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; విధినిర్దేశానికి ‘-ాలి’ రూపం, బలి సందర్భానికి గౌరవప్రదమైన కాని సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని సంబంధిత పదం వద్ద ఉంచబడింది.
