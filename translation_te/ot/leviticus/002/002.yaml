- from: అతడు దానిని యాజకులైన అహరోను కుమారుల దగ్గరకు తీసుకురావాలి. అక్కడి నుంచి దాని మెత్తని పిండిలోనూ దాని నూనెలోనూ తన గుప్పెడు నిండా తీసుకొని, దాని సాంబ్రాణి అంతటితో కలిపి, యాజకుడు దాని జ్ఞాపక భాగాన్ని బలిపీఠం మీద దహించాలి. అది యెహోవాకు ఇంపైన సువాసన కలిగించే అగ్ని అర్పణ[a].
