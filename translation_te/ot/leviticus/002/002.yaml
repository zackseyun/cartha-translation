  terminology: అహరోను, యాజకుడు, మెత్తని పిండి, బలిపీఠం, సాంబ్రాణి వంటి పదాలు అనుకూలంగా ఉన్నాయి. אִשֶּׁהకు ప్రధాన పాఠంలో 'అగ్నియర్పణ'ను ఉంచి, 'ఆహార అర్పణ' ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం మూలపదానికి సంబంధించిన చర్చనీయాంశమైన సూక్ష్మతను కాపాడుతుంది.
