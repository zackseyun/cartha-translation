  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అప్పుడు యాజకుడు ధాన్యార్పణలోనుండి దాని జ్ఞాపక భాగాన్ని తీసి బలిపీఠం మీద దహించాలి; అది యెహోవాకు ఇంపైన సువాసనగా ఉండే అగ్న్యర్పణ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు ఇంపైన సువాసనగా ఉండే ఆహార అర్పణ.”
    reason: అִשֵּׁה పదాన్ని సాధారణంగా ‘అగ్న్యర్పణ’గా అర్థం చేసుకుంటారు; దాని అర్థవ్యాప్తి లేదా వ్యుత్పత్తి విషయమై ‘ఆహార అర్పణ’ అనే ప్రత్యామ్నాయ అవగాహన కూడా ఉంది.
lexical_decisions:
- source_word: וְהֵרִים
  choice: తీసి
  rationale: హిఫిల్ రూపం అర్పణలోని ఒక భాగాన్ని పైకెత్తి వేరుచేసే యాజకుని క్రియను సూచిస్తుంది. తెలుగులో ‘తీసి’ సహజంగా ఉండి, సందర్భంలోని వేరుచేయడాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సందర్భంలోని כֹּהֵן కు ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: מִן הַמִּנְחָה
  choice: ధాన్యార్పణలోనుంచి
  rationale: లేవీయకాండము 2లో מִנְחָה ప్రత్యేకంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: אַזְכָּרָתָהּ
  choice: దాని జ్ఞాపక భాగాన్ని
  rationale: బలిపీఠంపై దహించే ప్రతినిధి భాగమే ఉద్దేశమని ‘భాగం’ స్పష్టం చేస్తుంది; ‘జ్ఞాపక’ అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిపీఠంపై అర్పణను కాల్చి పొగగా పైకి వెళ్లేలా చేసే బలిసంబంధ క్రియను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశాసూచక రూపాన్ని ఈ ఆచార సందర్భంలో సహజంగా స్థలార్థంలో అనువదిస్తుంది.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఈ పదం అగ్ని ద్వారా చేసే అర్పణను సూచిస్తుంది. ‘ఆహార అర్పణ’ అనే సాధ్యమైన భావవ్యాఖ్యను ప్రధాన పాఠ్యంలో నిర్బంధించకుండా, పదంలోని అగ్ని సంబంధాన్ని నిలుపుతుంది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన కలిగించే
  rationale: స్థిరమైన బలిసంబంధ పదబంధంలోని సువాసన చిత్రణను, దేవునికి ఆమోదకరమైనదనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ వ్యక్తినామమైన יהוה ను తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా అందిస్తుంది.
theological_decisions:
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ అనే బలిసంబంధ సూత్రవాక్యం
  choice: యెహోవాకు ఇంపైన సువాసన కలిగించే అగ్నితో అర్పించే అర్పణ
  alternative: యెహోవాకు ఇంపైన సువాసన కలిగించే ఆహార అర్పణ
  rationale: אִשֵּׁה యొక్క వ్యుత్పత్తి, వినియోగంపై ఉన్న అనిశ్చితిని ‘ఆహార అర్పణ’గా మాత్రమే తీర్మానించకుండా అగ్ని సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. רֵיחַ נִיחֹחַ లోని మానవరూపక సువాసన చిత్రణను కూడా తొలగించలేదు.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచి, ‘జ్ఞాపక భాగం’, ‘బలిపీఠం’ వంటి అవసరమైన బలిసంబంధ పదాలను నిలిపాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
