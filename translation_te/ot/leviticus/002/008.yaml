source:
  edition: WLC
  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: te
  text: వీటితో తయారుచేసిన ధాన్యార్పణను నీవు యాహ్వేకు[a] తీసుకురావాలి. దానిని యాజకునికి సమర్పించాలి; దానిని బలిపీఠం దగ్గరకు తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే కొరకు.’ హీబ్రూ ఉపసర్గ దిశను మాత్రమే కాక అంకితభావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: నీవు … తీసుకురావాలి
  rationale: బוא హిఫీల్ రూపంలోని ద్వితీయ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగు ధర్మశాసన శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణను
  rationale: లేవీయకాండము 2లో מִנְחָה సాధారణ కానుకను కాక ధాన్యంతో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: వీటితో తయారుచేసిన
  rationale: עשה నిఫల్ రూపంలోని కర్మణి భావాన్ని, ముందటి వచనాల్లో చెప్పిన విధానాలు లేదా పదార్థాలకు సూచించే אֵלֶּהను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: దైవనామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, ל యొక్క దిశ/సమర్పణ భావానికి ‘కు’ వాడబడింది; అంకిత భావమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: దానిని యాజకుని దగ్గరకు తీసుకురావాలి
  rationale: קרב హిఫీల్ యొక్క ‘దగ్గరకు తేవడం’ అనే భావాన్ని, אֶל యొక్క దిశను నిలుపుతుంది. కర్తను తెలుగు వాక్యంలో వ్యక్తం చేయకుండా ఉంచడం ద్వారా హీబ్రూ సందర్భంలోని కర్త మార్పు స్పష్టతలేమిని అతిగా పరిష్కరించదు.
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: యాజకుడు దానిని బలిపీఠం దగ్గరకు తీసుకురావాలి
  rationale: נגשׁ హిఫీల్ బలిపీఠం దగ్గరకు చేర్చే తదుపరి కర్మను సూచిస్తుంది; సమీపంలోని ‘యాజకుడు’ను సహజ కర్తగా స్పష్టం చేయడం తెలుగులో కర్మక్రమాన్ని గ్రాహ్యంగా చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో సూచిస్తుంది.
- issue: לַיהוָה లోని ל భావం
  choice: యాహ్వేకు
  alternative: యాహ్వే కొరకు
  rationale: ‘కు’ తీసుకురావడంలోని దిశను, సమర్పణను రెండింటినీ సహజంగా అనుమతిస్తుంది; ‘కొరకు’ అనే అంకిత భావాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని భావ విస్తృతిని కాపాడింది.
- issue: וְהִקְרִיבָהּ మరియు וְהִגִּישָׁהּ కర్తలు
  choice: మొదటి క్రియలో కర్తను వ్యక్తం చేయకుండా, రెండవ క్రియకు యాజకుడిని కర్తగా పేర్కొనడం
  alternative: రెండు క్రియలకూ ‘అతడు’ అని ఉంచడం
  rationale: మూల హీబ్రూలో మొదటి క్రియకు స్పష్ట నామకర్త లేదు; రెండవ క్రియకు సమీపంలోని ‘యాజకుడు’ సహజ కర్త. తెలుగు పాఠం అనవసరంగా ఒకే కర్తను రెండింటికీ నిర్బంధించకుండా కర్మక్రమాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాసన శైలి వాడబడింది. ‘ధాన్యార్పణ’, ‘యాజకుడు’, ‘బలిపీఠం’ వంటి స్థిరమైన ఆరాధనా పదాలు నిలుపబడ్డాయి; ఒకే వాక్యంలో పునరావృతమైన కర్మదశలు స్పష్టంగా కనిపించేలా రెండు వాక్యాలుగా అమర్చబడ్డాయి.
