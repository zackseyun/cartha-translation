id: LEV.2.1
reference: Leviticus 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: te
  text: ఎవరైనా యెహోవాకు ధాన్యార్పణ సమర్పిస్తే, ఆ అర్పణ మెత్తని పిండితో ఉండాలి.[a] దానిపై నూనె పోసి, దానిపై సాంబ్రాణి ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధాన్యార్పణ’ హీబ్రూ మిన్హా పదానికి అనువాదం; ఈ వచనంలో అది మెత్తని పిండితో చేసే అర్పణను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ఎవరైనా
  rationale: ఇక్కడ נֶפֶשׁ అనే పదం ‘ప్రాణం/ఆత్మ’ అనే అక్షరార్థంలో కాక, ధర్మశాస్త్ర సందర్భంలో ఒక వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎవరైనా’ సహజంగా ఉండి, సాధారణ వర్తనను తెలియజేస్తుంది.
- source_word: תַקְרִיב קָרְבַּן
  choice: అర్పణను సమర్పించినప్పుడు
  rationale: קרב హిఫిల్ రూపం దేవుని సన్నిధికి కానుకను తీసుకురావడం లేదా సమర్పించడం అనే ఆరాధనా భావాన్ని ఇస్తుంది; ‘సమర్పించు’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని బలి సందర్భంలో מִנְחָה సాధారణ కానుకకన్నా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది. ‘ధాన్యార్పణ’ సంక్షిప్తంగా, సందర్భోచితంగా ఉంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ל ఉపసర్గను ‘కు’తో నిలిపాం.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: ఇది అర్పణలకు ఉపయోగించే సన్నగా దంచిన, నాణ్యమైన పిండిని సూచిస్తుంది. ‘మెత్తని పిండి’ సాధారణ ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: వారి అర్పణ ... ఉండాలి
  rationale: ఈ వాక్యభాగం అర్పణ ఏ పదార్థంతో ఉండాలో నిర్దేశిస్తుంది. తెలుగులో ‘ఉండాలి’ ధర్మశాస్త్ర నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది; ‘వారి’ ప్రతినిధి ఏకవచనంలోని వ్యక్తిని లింగనిరపేక్షంగా సూచిస్తుంది.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: దానిపై నూనె పోసి
  rationale: స్త్రీలింగ ప్రత్యయం מִנְחָהను సూచిస్తుంది. ‘దానిపై నూనె పోసి’ చర్యల క్రమాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: సాంబ్రాణి ఉంచాలి
  rationale: לְבֹנָה ఆరాధనలో ఉపయోగించే సుగంధ గుగ్గిలమైన frankincense. తెలుగులో విస్తృతంగా అర్థమయ్యే ‘సాంబ్రాణి’ని ఎంచుకున్నాం; అది అర్పణపై ఉంచబడుతుందనే సంబంధం సందర్భంలో స్పష్టంగా ఉంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత ఒడంబడిక నామాన్ని ఉపయోగిస్తుంది. ఆ నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సంప్రదాయంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉంచడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: ప్రతినిధి ఏకవచనంలోని లింగ సూచన
  choice: ఎవరైనా ... వారి
  alternative: ఒక వ్యక్తి ... అతని
  rationale: హీబ్రూలో נֶפֶשׁ వ్యాకరణపరంగా స్త్రీలింగమైనప్పటికీ, కర్తకు సంబంధించిన తరువాతి రూపాలు పుంలింగ ఏకవచనంలో ఉన్నాయి; ఇది సాధారణ న్యాయశైలి. తెలుగులో ‘ఎవరైనా ... వారి’ అదే సాధారణ వర్తనను సహజంగా తెలియజేస్తుంది; కేవలం పురుషులకే వర్తిస్తుందనే అనవసర భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. ‘సమర్పించు’, ‘అర్పణ’, ‘ఉండాలి’ వంటి పదాలు ఆరాధనా సందర్భాన్నీ ఆజ్ఞాత్మక స్వరాన్నీ కాపాడుతాయి.
