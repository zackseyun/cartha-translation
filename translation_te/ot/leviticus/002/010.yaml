id: LEV.2.10
reference: Leviticus 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: te
  text: ధాన్యార్పణలో మిగిలిన భాగం అహరోనుకూ అతని కుమారులకూ చెందుతుంది; అది యాహ్వేకు అర్పించే అగ్ని అర్పణలలో పరమ పరిశుద్ధమైనది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆహారార్పణలలో పరమ పరిశుద్ధమైనది.”
    reason: אִשֶּׁה అనే బలి సంబంధ పదాన్ని ‘అగ్ని అర్పణ’గా లేదా సందర్భానుసారంగా ‘ఆహారార్పణ’గా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: మిగిలినది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం నామవాచకంగా పనిచేసి, అర్పణలో మిగిలిన భాగాన్ని సూచిస్తుంది.
- source_word: מִן הַמִּנְחָה
  choice: ధాన్యార్పణలో
  rationale: లేవీయకాండము 2లో מִנְחָה సాధారణ కానుకను కాక ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు ‘ధాన్యార్పణలో’ అని అనువదించాం.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు చెందుతుంది
  rationale: לְ ఇక్కడ కేటాయింపు లేదా స్వాధీనతను సూచిస్తుంది. హీబ్రూలో వ్యక్తంగా లేని క్రియను తెలుగులో భావస్పష్టత కోసం ‘చెందుతుంది’గా అందించాం.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పవిత్రమైనది
  rationale: ఈ హీబ్రూ నిర్మాణం అత్యున్నత స్థాయి పవిత్రతను తెలిపే అతిశయోక్తి ప్రయోగం. ‘పవిత్రాతిపవిత్రం’ అనే స్థలార్థం కలిగే పదబంధాన్ని నివారించి, మిగిలిన భాగాన్నే వర్ణిస్తున్నట్లు స్పష్టం చేశాం.
- source_word: מֵאִשֵּׁי
  choice: అగ్నిపై అర్పించే అర్పణల్లో
  rationale: אִשֶּׁה అగ్ని ద్వారా దేవునికి సమర్పించే బలులను సూచిస్తుంది. మూలపదంలోని అగ్ని సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘ఆహార అర్పణలు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions:
- issue: אִשֵּׁי יְהוָה అనే బలి సంబంధ పదబంధం
  choice: యాహ్వేకు అగ్నిపై అర్పించే అర్పణల్లో
  alternative: యాహ్వే ఆహార అర్పణల్లో
  rationale: ప్రధాన అనువాదం אִשֶּׁהలోని అగ్ని సంబంధాన్ని కాపాడుతుంది. అయితే యాజక సంప్రదాయంలో ఈ పదం దేవునికి సమర్పించే ‘ఆహారం’ అనే బలి రూపకాన్ని కూడా సూచించవచ్చు; ఆ నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- issue: קֹדֶשׁ קָדָשִׁים ఎవరిని లేదా దేనిని వర్ణిస్తుంది
  choice: మిగిలిన భాగం అత్యంత పవిత్రమైనదని స్పష్టం చేయడం
  alternative: ‘పవిత్రాతిపవిత్రం’ అని పదశః అనువదించడం
  rationale: హీబ్రూ వ్యాకరణంలో ఈ పదబంధం మిగిలిన ధాన్యార్పణ భాగాన్ని వర్ణిస్తుంది. స్థలమైన ‘అతి పరిశుద్ధ స్థలం’తో గందరగోళం రాకుండా, దాని అతిశయార్థాన్ని సహజ తెలుగులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ నామవాచక వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించడం ద్వారా సంబంధాలు స్పష్టంగా చేశాం; దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం.
