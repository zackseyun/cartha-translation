source:
  edition: WLC
  text: וְ/אִם מִנְחָ֥ה עַל הַֽ/מַּחֲבַ֖ת קָרְבָּנֶ֑/ךָ סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן מַצָּ֥ה תִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: te
  text: నీ అర్పణ పెనము[a] మీద తయారుచేసిన ధాన్యార్పణ అయితే, అది నూనెతో కలిపిన సన్నని పిండితో చేసిన పులియనిదై ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమతలమైన వంట పెనము.” ఈ హీబ్రూ పదం ధాన్యార్పణను తయారుచేయడానికి ఉపయోగించే వంట ఉపరితలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండము 2లో ఇది ధాన్యం లేదా పిండితో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ‘ధాన్యార్పణ’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הַמַּחֲבַת
  choice: పెనము మీద కాల్చిన
  rationale: מַחֲבַת అనేది అర్పణను తయారుచేసే సమతల వంట ఉపరితలం లేదా పెనాన్ని సూచిస్తుంది. తెలుగులో ‘పెనము’ సహజమైన పదం; మూలంలోని עַל (‘మీద’) భావాన్ని కూడా నిలుపుతుంది.
- source_word: קָרְבָּנְךָ
  choice: నీ అర్పణ
  rationale: ప్రత్యక్ష ఏకవచన సంబోధనను నిలుపుతూ, מִנְחָהతో ఉన్న సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బాగా విసిరిన, ఉత్తమ నాణ్యతగల సన్నని పిండిని సూచించే ఆరాధనా పదం; ‘మెత్తని పిండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: నూనెతో కలిపిన
  rationale: పిండిని నూనెతో కలపడాన్ని సూచిస్తుంది; కలిపే నిర్దిష్ట పద్ధతిని మూలం చెప్పనందున ‘కలిపిన’ ఆ అస్పష్టతను కాపాడుతుంది.
- source_word: מַצָּה
  choice: పులియనిది
  rationale: ఇక్కడ పదం అర్పణ యొక్క పులియని స్థితిని విశేషణాత్మకంగా సూచిస్తుంది; ప్రత్యేకంగా ‘రొట్టె’ అని చేర్చదు.
- source_word: תִהְיֶה
  choice: ఉండాలి
  rationale: ఈ సందర్భంలోని విధిపూర్వక భావాన్ని ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
