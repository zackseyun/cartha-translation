reference: Leviticus 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: te
  text: మీరు యహ్వేకు సమర్పించే ఏ ధాన్య నైవేద్యాన్నీ పులియబెట్టి తయారుచేయకూడదు. ఎందుకంటే పులియబెట్టే ఏ పదార్థాన్నిగానీ తేనెనుగానీ[b] వాటిలో దేనినీ యహ్వేకు అగ్ని అర్పణగా[a] దహించి సమర్పించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అగ్ని అర్పణ” అంటే బలిపీఠంపై కాల్చి సమర్పించే అర్పణ.
    reason: lexical_alternative
  - marker: b
    text: ప్రాచీన వాడుకలో “తేనె” అనే పదం తేనెటీగల తేనెతోపాటు ఖర్జూరం వంటి పండ్లతో చేసిన చిక్కని తీపి రసాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: ధాన్య నైవేద్యం
  rationale: లేవీయకాండము 2లో ఇది ధాన్యం లేదా పిండితో చేసే ప్రత్యేక అర్పణను సూచిస్తుంది; సాధారణ ‘అర్పణ’ కంటే ‘ధాన్య నైవేద్యం’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּקְרִיבוּ
  choice: సమర్పించే
  rationale: బలుల సందర్భంలో హిఫిల్ రూపం దేవుని సన్నిధికి తీసుకొచ్చి సమర్పించడాన్ని సూచిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామాన్ని వ్యక్తినామంగా ఉంచి, לְ ఉపసర్గలోని దిశాత్మక భావాన్ని ‘-కు’తో తెలిపింది.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: పులియబెట్టినదిగా చేయకూడదు
  rationale: నైవేద్యాన్ని పులిసిన స్థితిలో సిద్ధం చేయరాదనే నిషేధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׂאֹר
  choice: పులిసిన పిండి
  rationale: ఇది పిండిని పులియబెట్టే పదార్థాన్ని, ముఖ్యంగా ముందుగా పులిసిన పిండిముద్దను సూచిస్తుంది; ఆధునిక వాణిజ్య ‘ఈస్ట్’కు మాత్రమే పరిమితం చేయదు.
- source_word: דְּבַשׁ
  choice: తేనె
  rationale: ప్రధాన సాధారణ అర్థాన్ని పాఠ్యంలో ఉంచింది; ప్రాచీన వాడుకలో పండ్ల చిక్కని రసం కూడా ఇందులో చేరవచ్చని పాదటిప్పణిలో తెలిపింది.
- source_word: לֹא תַקְטִירוּ
  choice: దహించకూడదు
  rationale: బలిపీఠంపై కాల్చి పొగ పైకి వెళ్లేలా చేసే ఆరాధనా క్రియను సంక్షిప్తంగా, సరిగ్గా వ్యక్తం చేస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: అగ్నితో బలిపీఠంపై సమర్పించే సాంకేతిక బలి వర్గాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది; దీనిని దేవుని అక్షరార్థ ఆహారంగా నిర్ధారించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది.
- issue: אִשֶּׁה అనే బలి పదం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదం బలిపీఠంపై అగ్నితో సమర్పించే అర్పణను సూచిస్తుంది. ‘అగ్ని అర్పణ’ ఆ క్రియను స్పష్టంగా ఉంచుతూ, ‘ఆహారం’ అనే వివాదాస్పద వ్యుత్పత్తి లేదా భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా స్థిరపరచదు.
- issue: מִמֶּנּוּ యొక్క సూచన
  choice: తెలుగు ప్రధాన పాఠ్యంలో విడిగా అనువదించకుండా నిషేధాన్ని నేరుగా చెప్పడం
  alternative: దానిలోనుండి
  rationale: హీబ్రూ ఏకవచన సర్వనామం ధాన్య నైవేద్యాన్ని సూచించవచ్చు; కానీ తెలుగులో ‘దానిలోనుండి పులిసిన పిండిని లేదా తేనెను’ అనడం గందరగోళంగా ఉంటుంది. భావాన్ని మార్చకుండా సహజమైన నిషేధ వాక్యంగా ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ధార్మిక సందర్భానికి స్థిరంగా వినిపించే ‘ధాన్య నైవేద్యం’, ‘అగ్ని అర్పణ’ పదాలను ఉపయోగించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
