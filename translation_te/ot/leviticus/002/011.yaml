revisions:
- from: మీరు యెహోవాకు సమర్పించే ఏ ధాన్య నైవేద్యాన్నీ పులియబెట్టినదిగా చేయకూడదు. ఎందుకంటే పులిసిన పిండినిగానీ తేనెనుగానీ యెహోవాకు అగ్ని అర్పణగా[a] దహించకూడదు.[b]
