id: LEV.2.14
reference: Leviticus 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: te
  text: “మీరు యెహోవాకు ప్రథమఫలాల అర్పణను సమర్పిస్తే, నిప్పులో కాల్చిన లేత ధాన్యపు వెన్నులను, కొత్త ధాన్యం నుంచి నలగగొట్టిన గింజలను మీ ప్రథమఫలాల అర్పణగా సమర్పించాలి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నిప్పులో కాల్చిన పచ్చి వెన్నులను, కొత్త పంటలోని ముతకగా నలిపిన ధాన్యాన్ని.”'
    reason: אָבִיב, גֶּרֶשׂ, כַּרְמֶל అనే వ్యవసాయ పదాల ఖచ్చితమైన కలయికకు ప్రత్యామ్నాయ అనువాదం సాధ్యమవుతుంది.
lexical_decisions:
- source_word: מִנְחַת
  choice: అర్పణ
  rationale: లేవీయకాండము 2లో ఇది ధాన్యంతో చేసే ఆచార సంబంధమైన అర్పణను సూచిస్తుంది. ఈ వాక్యంలో దాని పదార్థం తరువాత స్పష్టమవుతున్నందున సహజమైన ‘అర్పణ’ను ఎంచుకున్నాం.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: ప్రథమఫలాలు / ప్రథమఫలాల
  rationale: పంటలో మొదట పండిన భాగాన్ని దేవునికి అర్పించే ఆచార భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ పాఠంలోని దేవుని వ్యక్తిగత నామమైన יהוהను తెలుగులో స్థిరంగా, గుర్తించదగిన రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אָבִיב
  choice: లేత ధాన్యపు వెన్నులు
  rationale: ఇంకా పూర్తిగా ఎండని, తాజా దశలో వెన్నులో ఉన్న ధాన్యాన్ని సూచించే వ్యవసాయ చిత్రాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: קָלוּי בָּאֵשׁ
  choice: నిప్పులో కాల్చిన
  rationale: ధాన్యాన్ని అగ్నిలో కాల్చి సిద్ధం చేసే విధానాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: גֶּרֶשׂ
  choice: నలగగొట్టిన గింజలు
  rationale: విరగగొట్టిన లేదా ముతకగా నలిపిన ధాన్యాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి స్పష్టమైన రూపం.
- source_word: כַּרְמֶל
  choice: కొత్త ధాన్యం నుంచి
  rationale: ఈ సందర్భంలో స్థలనామం కాకుండా తాజా లేదా కొత్త పంట ధాన్యాన్ని సూచిస్తుంది.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: సమర్పిస్తే ... సమర్పించాలి
  rationale: קרב హిఫీల్ రూపంలోని ఆచార సంబంధమైన ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ భావాన్ని, మూలంలోని పునరుక్తిని కూడా నిలుపుతూ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పండితుల పునర్నిర్మాణం.
- issue: מִנְחָה యొక్క ఆచారార్థం
  choice: అర్పణ
  alternative: ధాన్యార్పణ
  rationale: ఈ అధ్యాయంలో ధాన్యార్పణ భావం స్పష్టమైనప్పటికీ, ఈ వాక్యంలో ‘ప్రథమఫలాలు’ మరియు ధాన్య వివరణలే పదార్థాన్ని నిర్దేశిస్తాయి. అందువల్ల మూలంలోని విస్తృత పదాన్ని సంకుచితం చేయకుండా ‘అర్పణ’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆచార భాష. మూలంలోని షరతు వాక్యాన్ని, ‘సమర్పించు’ అనే పునరుక్తిని నిలుపుకున్నాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
