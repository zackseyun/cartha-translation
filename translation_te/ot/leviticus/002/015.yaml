id: LEV.2.15
reference: Leviticus 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֤ עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/שַׂמְתָּ֥ עָלֶ֖י/הָ לְבֹנָ֑ה מִנְחָ֖ה הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/015.yaml
  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: te
  text: దానిమీద నూనె పోయాలి,[a] దానిమీద సాంబ్రాణి ఉంచాలి; అది ధాన్యార్పణం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిమీద నూనె ఉంచాలి.” ఇక్కడి హీబ్రూ క్రియ నూనెను అర్పణపై వేయడం లేదా ఉంచడం అనే విస్తృత భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: పోసి
  rationale: נתן అనే క్రియకు ‘ఇవ్వు, పెట్టు, ఉంచు’ అనే విస్తృత అర్థాలున్నాయి. నూనెను అర్పణమీద వేయడాన్ని సహజమైన ఆధునిక తెలుగులో ‘పోయడం’ అంటారు; ఇది ఆచార సంబంధమైన ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: עָלֶיהָ
  choice: దానిమీద
  rationale: על + 3 స్త్రీలింగ ఏకవచన ప్రత్యయం, ముందు చెప్పిన అర్పణ పదార్థం మీద ఉంచడం లేదా పోయడాన్ని సూచిస్తుంది.
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: మూలంలో సాధారణంగా ‘నూనె’ అని మాత్రమే ఉంది. బలుల సందర్భంలో అది ఒలీవ నూనె అయి ఉండవచ్చుగానీ, మూలంలో లేని ‘ఒలీవ’ను చేర్చలేదు.
- source_word: וְשַׂמְתָּ
  choice: ఉంచాలి
  rationale: שׂים అంటే ‘పెట్టు, ఉంచు, స్థాపించు.’ సాంబ్రాణిని ఉద్దేశపూర్వకంగా అర్పణమీద ఉంచడాన్ని ‘ఉంచాలి’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבֹנָה
  choice: సాంబ్రాణి
  rationale: לבנה సాధారణ ధూపం కాక, ప్రత్యేకంగా frankincense అనే సుగంధ గుగ్గిలాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగు పాఠకులకు ‘సాంబ్రాణి’ సహజమైన సమానార్థకం.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని బలి ఆచార సందర్భంలో מנחה సాధారణ కానుకకన్నా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది. ‘ధాన్యార్పణ’ సంక్షిప్తంగా, స్పష్టంగా ఆ అర్థాన్ని ఇస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ఇప్పుడే వివరించిన అర్పణను తిరిగి సూచిస్తుంది; సరళమైన నిర్ధారణను అలాగే ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆచార-న్యాయ శైలిని ఉపయోగించాం. వరుస హీబ్రూ క్రియల ఆదేశ భావాన్ని తెలుగులో ‘పోసి ... ఉంచాలి’ అనే సహజ నిర్మాణంతో వ్యక్తం చేశాం; మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
