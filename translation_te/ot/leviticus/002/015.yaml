    issue: The two Hebrew instructional verbs are not expressed in parallel Telugu directive forms.
    rationale: The first clause, ‘నూనె పోసి,’ functions as a participial subordinate action, while the second ends in ‘ఉంచాలి.’ Rendering both as directives better reflects the coordinated Hebrew instructions and improves clarity.
