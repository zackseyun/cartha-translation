lexical_decisions:
- source_word: פָּת֤וֹת
  choice: విరిచి
  rationale: פתת క్రియ ఇక్కడ ఆజ్ఞార్థకంగా పనిచేస్తూ, కాల్చిన అర్పణను చిన్న భాగాలుగా విరిచే చర్యను సూచిస్తుంది.
- source_word: אֹתָ/הּ
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న అర్పణ పదార్థాన్ని సూచిస్తుంది; తెలుగులో జడవస్తువుకు ‘దానిని’ సహజం.
- source_word: פִּתִּים
  choice: ముక్కలుగా
  rationale: బద్దలైన చిన్న భాగాలను సూచించే బహువచన నామవాచకానికి ఇది సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: וְ/יָצַקְתָּ
  choice: పోయాలి
  rationale: క్రమబద్ధమైన బలుల సూచనలో ఈ క్రియకు నిర్దేశాత్మక భావం ఉంది; ‘పోయాలి’ ఆ విధి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָלֶ֖י/הָ
  choice: దానిపై
  rationale: על అనే విభక్తి సంబంధం నూనెను అర్పణ మీద పోయడాన్ని సూచిస్తుంది.
- source_word: שָׁמֶן
  choice: నూనె
  rationale: హీబ్రూ మూలంలో సాధారణంగా ‘నూనె’ అని మాత్రమే ఉంది; ‘ఒలీవ నూనె’ అని ప్రత్యేకీకరించడం మూలానికి అదనం అవుతుంది.
- source_word: מִנְחָה
  choice: ధాన్య నైవేద్యం
  rationale: లేవీయకాండము 2లో ఈ ఆరాధనా పదం ధాన్యంతో చేసే అర్పణను ప్రత్యేకంగా సూచిస్తుంది; ‘ధాన్య నైవేద్యం’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: స్వతంత్ర సర్వనామం ఇప్పుడే వివరించిన వస్తువును ధాన్య నైవేద్యంగా గుర్తిస్తుంది.
