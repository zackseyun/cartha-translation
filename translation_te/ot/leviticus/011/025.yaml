id: LEV.11.25
reference: Leviticus 11:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּשֵׂ֖א מִ/נִּבְלָתָ֑/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: te
  text: వాటి కళేబరాల్లో దేనినైనా మోసేవాడు తన బట్టలు ఉతుకుకోవాలి; అతడు సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటి కళేబరాల నుండి దేనినైనా మోసేవాడు.’ హీబ్రూ నిర్మాణాన్ని మరింత రూపానుసారంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: మోసేవాడు
  rationale: כָּל తో కూడిన కృదంతం సాధారణంగా వర్తించే నియమాన్ని సూచిస్తుంది. తెలుగు ఏకవచన సంబంధకృదంత రూపం విశ్వవ్యాప్త పరిధిని సహజంగా వ్యక్తం చేస్తుంది; וְ సందర్భానుసంధానాన్ని కలిగించినా, తెలుగు వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: מִ/נִּבְלָתָ/ם
  choice: వాటి కళేబరాల్లో దేనినైనా
  rationale: נְבֵלָה ఇక్కడ జంతువు చనిపోయిన దేహాన్ని సూచిస్తుంది. ‘కళేబరం’ శవం అనే భావాన్ని గౌరవప్రదమైన శాసన శైలిలో స్పష్టంగా ఇస్తుంది. מן నిర్మాణంలోని విభాగాత్మక భావాన్ని ‘దేనినైనా’ సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: తన బట్టలు ఉతుకుకోవాలి
  rationale: ఈ అసంపూర్ణ క్రియారూపం శాసనబద్ధ కర్తవ్యాన్ని సూచిస్తుంది; ‘ఉతుకుకోవాలి’ ఆ ఆజ్ఞాత్మక బాధ్యతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. ‘తన’ అనే ప్రతిబింబక సర్వనామం ఏకవచన కర్తతో అన్వయిస్తుంది.
- source_word: וְ/טָמֵא
  choice: అతడు ... అపవిత్రుడిగా ఉంటాడు
  rationale: טָמֵא ఇక్కడ నైతిక దుష్టత్వం కాక ఆచారసంబంధ అపవిత్రతను సూచిస్తుంది. రెండో స్వతంత్ర విధేయాన్ని స్పష్టంగా చేయడానికి తెలుగులో కర్తను పునరుక్తం చేశాం.
- source_word: עַד הָ/עָרֶב
  choice: సాయంత్రం వరకు
  rationale: అపవిత్రత కొనసాగే కాలపరిమితిని ఈ సాధారణ తెలుగు పదబంధం ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సాధారణ శాసన వాక్యంలో పుంలింగ ఏకవచన రూపాలు
  choice: ‘మోసేవాడు’, ‘తన’, ‘అతడు’, ‘అపవిత్రుడిగా’ అనే ఏకవచన పుంలింగ రూపాలను నిలుపుకోవడం
  alternative: లింగనిరపేక్ష బహువచన రూపాలు వాడడం
  rationale: హీబ్రూ పాఠం ప్రతినిధి వ్యక్తిని పుంలింగ ఏకవచనంలో ఉంచుతుంది. తెలుగు అనువాదం ఆ వ్యాకరణ రూపాన్ని కాపాడుతూనే, ఇది నియమానికి లోబడే ఎవరినైనా సూచిస్తుందని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండంలోని శాసన ధోరణికి తగిన గంభీరమైన కాని సులభగ్రాహ్యమైన శైలి. ‘అపవిత్రుడు’ ఆచారసంబంధ స్థితిని సూచిస్తుంది; నైతిక నిందను కాదు.
