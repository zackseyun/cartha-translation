id: LEV.11.29
reference: Leviticus 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: te
  text: 'నేలపై పాకే చిన్న జీవుల్లో మీకు అపవిత్రమైనవి ఇవి: మోల్-ఎలుక[a], ఎలుక, పెద్ద బల్లి—దాని జాతి ప్రకారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹלֶד, צָב అనే హీబ్రూ పదాలు సూచించే జంతువులు ఖచ్చితంగా ఏవో తెలియదు. חֹלֶדకు సంప్రదాయంగా ‘ముంగిసలాంటి జంతువు’ లేదా ‘మోల్’ అని, צָבకు ‘తాబేలు’ లేదా సాధారణంగా ‘బల్లి’ అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: ఇవి
  rationale: హీబ్రూలో నిర్దేశక సర్వనామం ఏకవచన రూపంలో ఉన్నప్పటికీ, తరువాత అనేక జీవుల జాబితాను పరిచయం చేస్తోంది; తెలుగులో సహజంగా బహువచనమైన ‘ఇవి’ వాడటం సముచితం.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఇశ్రాయేలీయులకు సంబంధించి ఈ జీవుల ఆచారపరమైన స్థితిని సూచించే సంబంధార్థక ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַטָּמֵא
  choice: అపవిత్రమైనవి
  rationale: లేవీయకాండంలోని ఆచారశుద్ధి సందర్భంలో טָמֵאకు ‘అపవిత్రం’ స్పష్టమైన, స్థిరమైన తెలుగు పదం.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: పాకే చిన్న జీవుల్లో
  rationale: שֶׁרֶץ అనే పదం నేలమీద పాకే లేదా గుంపులుగా విస్తరించే చిన్న జీవులను సూచిస్తుంది. మూలంలోని నామవాచక–క్రియాపద పునరుక్తి తెలుగులో యథాతథంగా పెడితే అసహజంగా ఉండేందున భావాన్ని సంక్షిప్తంగా తెలిపింది.
- source_word: עַל הָאָרֶץ
  choice: నేలపై
  rationale: ఈ సందర్భంలో אָרֶץ జీవులు సంచరించే భూమి ఉపరితలాన్ని సూచిస్తుంది; ‘నేలపై’ సహజమైన తెలుగు.
- source_word: הַחֹלֶד
  choice: మోల్-ఎలుక
  rationale: జంతువు ఖచ్చితమైన గుర్తింపు అనిశ్చితం. భూమిలో నివసించే చిన్న క్షీరదాన్ని సూచించే సాధ్యమైన ఆధునిక పేరును ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సంప్రదాయ అర్థాలను పాదసూచికలో తెలిపింది.
- source_word: הָעַכְבָּר
  choice: ఎలుక
  rationale: עַכְבָּר సాధారణంగా ఎలుకను లేదా ఎలుకజాతి చిన్న కృంతకాన్ని సూచిస్తుంది.
- source_word: הַצָּב
  choice: పెద్ద బల్లి
  rationale: ఖచ్చితమైన జాతి అనిశ్చితమైనప్పటికీ, ఈ జాబితాలో బల్లి తరహా సరీసృపం ఉద్దేశించబడే అవకాశం ఉంది; అనిశ్చితిని పాదసూచికలో నిలిపింది.
- source_word: לְמִינֵהוּ
  choice: దాని జాతుల ప్రకారం
  rationale: מין ఆధారంగా వర్గీకరణను తెలిపే సూత్రప్రాయ పదబంధం. ఏకవచన సమూహనామానికి చెందిన వివిధ జాతులను తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచారపరమైన న్యాయవిధి ధోరణిని గౌరవిస్తూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. జంతు గుర్తింపుల అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా పాదసూచికలో స్పష్టంగా నిలిపాం.
