- from: 'నేలపై పాకే చిన్న జీవుల్లో మీకు అపవిత్రమైనవి ఇవి: మోల్-ఎలుక[a], ఎలుక, పెద్ద బల్లి—దాని జాతుల ప్రకారం.'
  to: 'నేలపై పాకే చిన్న జీవుల్లో మీకు అపవిత్రమైనవి ఇవి: మోల్-ఎలుక[a], ఎలుక, పెద్ద బల్లి—దాని జాతి ప్రకారం.'
  rationale: 'Only the singular classification phrase has been corrected: ‘దాని జాతుల ప్రకారం’ has been changed to ‘దాని జాతి ప్రకారం’ to reflect לְמִינֵהוּ. The uncertain zoological identifications and their explanatory footnote are retained without overresolving the Hebrew.'
