id: LEV.11.34
reference: Leviticus 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/כָּל הָ/אֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛י/ו מַ֖יִם יִטְמָ֑א וְ/כָל מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּ/כָל כְּלִ֖י יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: te
  text: తినదగిన ఏ ఆహారంపైనైనా నీరు పడితే అది అపవిత్రమవుతుంది; ఏ పాత్రలోనైనా ఉన్న తాగదగిన ఏ పానీయమైనా అపవిత్రమవుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: తినదగిన ఏ ఆహారంపైనైనా
  rationale: מִכָּל ఇక్కడ సాధారణ వర్గంలోని దేనినైనా సూచిస్తుంది; הָאֹכֶל ఆహారాన్ని సూచిస్తుంది. సహజమైన తెలుగు న్యాయశైలిలో రెండింటినీ కలిపి ఇలా అనువదించాం.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: తినదగిన
  rationale: నిఫాల్ అసంపూర్ణ క్రియ తినబడే లేదా తినడానికి ఉద్దేశించబడిన దానిని వర్గీకరిస్తుంది. ‘తినదగిన’ అనే పదం ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: పైనైనా నీళ్లు పడితే
  rationale: అక్షరార్థంగా ‘దానిపై నీళ్లు వస్తే.’ తెలుగులో ‘నీళ్లు పడితే’ సహజంగా ఉండి, నీటిని ఎవరు పోశారనే విషయాన్ని మూలంలో లేనట్లే పేర్కొనదు.
- source_word: יִטְמָא
  choice: అపవిత్రమవుతుంది
  rationale: טמא ఈ ఆచారసంబంధ సందర్భంలో అపవిత్ర స్థితిలోకి రావడాన్ని సూచిస్తుంది. ‘అపవిత్రమవుతుంది’ స్థితి మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: తాగదగిన పానీయం
  rationale: מַשְׁקֶה తాగే పదార్థాన్ని, సంబంధ వాక్యం తాగబడే లేదా తాగడానికి తగిన దానిని సూచిస్తుంది. ‘తాగదగిన పానీయం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בְּכָל כְּלִי
  choice: ఏ పాత్రలోనైనా ఉన్న
  rationale: כְּלִי సాధారణంగా పాత్ర లేదా సాధనాన్ని సూచిస్తుంది; ఇక్కడ పానీయం ఉండే పాత్ర భావం సందర్భానుసారం స్పష్టం. ‘ఏ పాత్రలోనైనా’ పంపిణీ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: טמא యొక్క ఆచారసంబంధ భావం
  choice: అపవిత్రమవుతుంది
  alternative: అశుద్ధమవుతుంది
  rationale: ఈ వాక్యం నైతిక దోషాన్ని కాక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. ‘అపవిత్రం’ లేవీయకాండ న్యాయ సందర్భానికి సుపరిచితమైన పదం; అదనంగా ‘ఆచారపరంగా’ అని మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన న్యాయవాక్య నిర్మాణం వాడబడింది. మూలంలోని రెండు సమాంతర వర్గాలు—ఆహారం, పానీయం—మరియు రెండింటికీ వర్తించే అపవిత్రత ఫలితం నిలుపబడ్డాయి.
