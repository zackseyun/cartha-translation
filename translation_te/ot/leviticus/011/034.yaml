revisions:
- from: తినదగిన ఏ ఆహారంపైనైనా నీళ్లు పడితే అది అపవిత్రమవుతుంది; అలాగే ఏ పాత్రలోనైనా ఉన్న తాగదగిన పానీయం అపవిత్రమవుతుంది.
  to: తినదగిన ఏ ఆహారంపైనైనా నీరు పడితే అది అపవిత్రమవుతుంది; ఏ పాత్రలోనైనా ఉన్న తాగదగిన ఏ పానీయమైనా అపవిత్రమవుతుంది.
  rationale: The revision preserves the draft’s faithful rendering of the first clause and ritual terminology. It makes the distributive force of “every drink” explicit and clarifies that the drink is the item situated in any vessel, without adding an agent or altering the legal condition.
