  yaml_path: translation/ot/leviticus/011/019.yaml
  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: te
  text: కొంగను, దాని జాతుల ప్రకారం[c] నారాయణపక్షిని[a], హూపూ పక్షిని[b], గబ్బిలాన్ని;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీయ పక్షిపేరు ఖచ్చితంగా ఏ పక్షిని సూచిస్తుందో తెలియదు; ‘ఐబిస్’ లేదా మరో పొడవుకాళ్ల నీటిపక్షి కూడా కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పాత అనువాదాల్లో ‘ల్యాప్‌వింగ్ పక్షి’ అని ఉంది; అయితే హెబ్రీయ పదం ‘హూపూ పక్షి’ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: c
    text: ‘దాని జాతుల ప్రకారం’ అనే పదబంధం ఆ సాధారణ పక్షి రకానికి చెందిన సంబంధిత ఉపరకాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: חֲסִידָה
  choice: కొంగ
  rationale: ఈ పక్షికి సాధారణంగా అంగీకరించబడిన గుర్తింపు ‘stork’. ఆధునిక ప్రామాణిక తెలుగులో ‘కొంగ’ సహజమైన సమానార్థకం; అయితే ఇది కొన్ని ఇతర పొడవుకాళ్ల నీటిపక్షులకు కూడా వాడబడవచ్చు.
- source_word: אֲנָפָה
  choice: నారాయణపక్షి
  rationale: ఖచ్చితమైన పక్షిజాతి గుర్తింపు అనిశ్చితం. సంప్రదాయంగా, సందర్భానుకూలంగా ‘heron’గా తీసుకొని తెలుగులో ‘నారాయణపక్షి’ అని అనువదించాం; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: לְמִינָהּ
  choice: దాని జాతుల ప్రకారం
  rationale: ఒక సాధారణ పక్షి వర్గానికి చెందిన వివిధ రకాలను సూచించే హెబ్రీయ వర్గీకరణ సూత్రాన్ని సహజమైన తెలుగులో బహువచన భావంతో వ్యక్తం చేస్తుంది.
- source_word: דּוּכִיפַת
  choice: హూపూ పక్షి
  rationale: పాత అనువాదాల్లో కనిపించే ‘lapwing’ కంటే ఆధునిక నిఘంటు, పక్షిశాస్త్ర పరిశీలన ‘hoopoe’ గుర్తింపుకు బలంగా మద్దతిస్తుంది. సాధారణ పాఠకునికి ఇది పక్షిపేరు అని స్పష్టమయ్యేందుకు ‘పక్షి’ చేర్చాం.
- source_word: עֲטַלֵּף
  choice: గబ్బిలం
  rationale: ఈ గుర్తింపు స్థిరమైనది. ఆధునిక జీవవర్గీకరణలో ఇది క్షీరదమైనప్పటికీ, మూలపాఠం ఎగిరే జీవుల దృశ్యాధారిత వర్గంలో పేర్కొంటుంది; కాబట్టి నేరుగా ‘గబ్బిలం’ అని అనువదించాం.
- source_word: וְאֵת / וְאֶת
  choice: జాబితా అనుసంధానం
  rationale: ప్రత్యక్ష కర్మ సూచకానికి తెలుగులో ప్రత్యేక పదం అవసరం లేదు. వాక్యం ముందరి వచనంలోని జాబితాను కొనసాగిస్తున్నందున విరామచిహ్నాలు, కర్మవిభక్తి ద్వారా నిర్మాణాన్ని సహజంగా ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆహార నియమాల జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ఇది ముందరి వచనాల నుంచి కొనసాగే జాబితా కావడంతో చివర అర్ధవిరామం ఉంచాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
