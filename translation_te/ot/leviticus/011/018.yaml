lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת
  choice: గుడ్లగూబ
  rationale: ఈ పక్షి ఖచ్చితమైన జాతి నిర్ధారణ వివాదాస్పదమైనప్పటికీ, సందర్భంలో అపవిత్ర పక్షుల జాబితాకు సరిపోయే విస్తృతమైన, సాధారణ తెలుగు పేరు; ఆంగ్ల సంప్రదింపుల పాఠంతోనూ అనుగుణం.
- source_word: הַקָּאָת
  choice: గూడబాతు
  rationale: సాధారణంగా pelicanగా గుర్తించే పక్షికి ఆధునిక తెలుగులో అర్థమయ్యే పేరు.
- source_word: הָרָחָם
  choice: రాబందు
  rationale: మృతదేహాలను తినే vulture రకాన్ని సూచించే హీబ్రూ పదానికి సహజమైన తెలుగు సమానార్థకం; ఖచ్చిత ఉపజాతిని అనవసరంగా నిర్ధారించదు.
