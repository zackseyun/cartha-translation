translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుతూ ప్రతి నామవాచకానికి ద్వితీయా విభక్తి వాడబడింది. మూలంలోని వరుస וְאֶת నిర్మాణాన్ని సహజమైన తెలుగు జాబితాగా అందించాం; వచనం తరువాతి జాబితాతో కొనసాగే కారణంగా చివర అర్ధవిరామం ఉంచాం.
