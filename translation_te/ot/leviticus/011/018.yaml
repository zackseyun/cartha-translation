  terminology: పక్షి-పేర్లు అతి నిర్దిష్టతను నివారిస్తూ మూలం మరియు ఆంగ్ల POB audit trail (“owl, pelican, carrion vulture”)తో అనుగుణంగా ఉన్నాయి. ప్రత్యేక మతపరమైన పదజాల సమస్య లేదు.
