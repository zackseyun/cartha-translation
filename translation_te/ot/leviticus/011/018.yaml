  source_fidelity: హీబ్రూ పాఠంలోని మూడు నిర్దిష్ట నామవాచకాలు—הַתִּנְשֶׁמֶת, הַקָּאָת, הָרָחָם—అదే క్రమంలో ఉన్నాయి. మొదటి పక్షి యొక్క ఖచ్చిత గుర్తింపు అనిశ్చితమైనందున విస్తృతమైన “గుడ్లగూబ” అనువాదం సముచితం; రెండవది pelicanకు “గూడబాతు,” మూడవది మృతభక్షక పక్షికి విస్తృతమైన “రాబందు” సరిపోతాయి. ద్వితీయా విభక్తి మూలంలోని אֶת నిర్మాణాన్ని సముచితంగా ప్రతిబింబిస్తుంది.
