lexical_decisions:
- source_word: הַדָּאָה
  choice: గద్ద
  rationale: ఇది ఒక వేటపక్షి పేరు; దాని ఖచ్చితమైన జాతి నిర్ధారణ అనిశ్చితం. ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే ‘గద్ద’ను ప్రధాన పాఠంలో ఎంచుకుని, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: הָאַיָּה
  choice: డేగ
