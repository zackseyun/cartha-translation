- source_word: לְמִינָהּ
  choice: దాని దాని జాతి ప్రకారం
  rationale: హీబ్రూ ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న వర్గీకరణ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఆ పక్షికి చెందిన అన్ని జాతులను సూచిస్తుంది.
- source_word: וְאֶת ... וְאֶת
  choice: …ను, …ను
  rationale: אֵת అనే ప్రత్యక్ష కర్మ సూచికకు తెలుగులోని ‘ను’ విభక్తిని వాడి, וְ సంధిని కొనసాగుతున్న జాబితికి తగిన విరామచిహ్నంతో సహజంగా ప్రతిబింబించాం.
