id: LEV.11.31
reference: Leviticus 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֛לֶּה הַ/טְּמֵאִ֥ים לָ/כֶ֖ם בְּ/כָל הַ/שָּׁ֑רֶץ כָּל הַ/נֹּגֵ֧עַ בָּ/הֶ֛ם בְּ/מֹתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: te
  text: పాకే జీవులన్నిటిలో[a] ఇవి మీకు అపవిత్రమైనవి. అవి చనిపోయిన స్థితిలో ఉన్నప్పుడు[b] వాటిని తాకే ప్రతి ఒక్కరూ సాయంత్రం వరకు అపవిత్రులుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కదలాడే చిన్న జీవులన్నిటిలో.” హీబ్రూ పదం పాకే లేదా గుంపులుగా కదిలే చిన్న జీవులను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వాటి మరణంలో”; భావం వాటి మృతస్థితిలో వాటిని తాకడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ఇవి
  rationale: ఇంతకుముందు పేర్కొన్న జీవులను సూచించే బహువచన నిర్దేశక పదాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הַטְּמֵאִים
  choice: అపవిత్రమైనవి
  rationale: లేవీయకాండంలోని ఆచారపరమైన అపవిత్రత స్థితిని స్పష్టంగా తెలియజేస్తుంది; సాధారణ మురికిని సూచించే పదాన్ని నివారిస్తుంది.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఇశ్రాయేలీయులకు వర్తించే నిబంధన సంబంధమైన అపవిత్రత వర్గీకరణను దత్తివాచక భావంతో నిలుపుతుంది.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: పాకే జీవులన్నిటిలో
  rationale: שֶׁרֶץ అనే విస్తృత వర్గపదానికి తెలుగులో సహజమైన సమీప సమానం; పదం సూచించే పరిధి పూర్తిగా పాకే జీవులకే పరిమితం కాకపోవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: כָּל הַנֹּגֵעַ
  choice: తాకే ప్రతి ఒక్కరూ
  rationale: హీబ్రూ నిర్మాణంలోని సార్వత్రిక, పంపిణీ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּהֶם
  choice: వాటిని
  rationale: ముందు పేర్కొన్న జీవులను సూచించే బహువచన సర్వనామాన్ని నేరుగా అందిస్తుంది.
- source_word: בְּמֹתָם
  choice: అవి చనిపోయిన స్థితిలో ఉన్నప్పుడు
  rationale: కేవలం చనిపోయే క్షణాన్ని కాక, వాటి మృతస్థితిలో వాటితో కలిగే స్పర్శను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రులుగా ఉంటారు
  rationale: స్పర్శ ఫలితంగా ఏర్పడే ఆచారపరమైన స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: అపవిత్రత కొనసాగే కాలపరిమితిని సరళంగా, కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ‘అపవిత్రమైనవి/అపవిత్రులుగా’ అనే ఆచారపరమైన పదజాలం
  alternative: నైతికంగా చెడ్డవి లేదా పాపులుగా
  rationale: ఈ సందర్భం ఆచారపరమైన శుద్ధి-అపవిత్రత నియమానికి సంబంధించినది; నైతిక దోషాన్ని వాక్యంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయశైలి అయినా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఆచారపరమైన అపవిత్రతను నైతిక దోషంగా మార్చకుండా మూలభావం నిలుపబడింది.
