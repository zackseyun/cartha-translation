id: LEV.11.32
reference: Leviticus 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: te
  text: వాటిలో ఏదైనా చనిపోయిన తర్వాత ఏ వస్తువుమీద పడితే, ఆ వస్తువు అపవిత్రమవుతుంది—చెక్కతో చేసిన పాత్రైనా, వస్త్రమైనా, తోలైనా, గోనెపట్టైనా, అంటే పనికి ఉపయోగించే ఏ వస్తువైనా సరే. దానిని నీటిలో ఉంచాలి[a]. అది సాయంత్రం వరకు అపవిత్రంగా ఉంటుంది; ఆ తర్వాత శుద్ధమవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని నీటిలో ముంచాలి.” హీబ్రూలో అక్షరార్థంగా, “దానిని నీటిలోకి తీసుకురావాలి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: వాటిలో ఏదైనా చనిపోయినప్పుడు దాని మీద పడితే
  rationale: మునుపటి వచనంలోని ప్రాణుల మృతదేహాలను సూచిస్తూ, షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఏ వస్తువుపై పడుతుందో దానిని ఏకవచనంగా ఉంచుతుంది.
- source_word: יִטְמָא
  choice: అది అపవిత్రమవుతుంది
  rationale: సంపర్కం వల్ల కలిగే ఆచారపరమైన స్థితిమార్పును సూచిస్తుంది; నైతిక దోషాన్ని దిగుమతి చేయదు.
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: చెక్క పాత్రైనా, వస్త్రమైనా, తోలైనా, గోనెపట్టైనా
  rationale: పదార్థాలు లేదా వస్తువుల జాబితాను స్పష్టంగా అందిస్తుంది. שָׂקకు ఆధునిక పాఠకులకు అర్థమయ్యే ముతక నారబట్ట భావంలో ‘గోనెపట్టు’ ఎంచుకుంది.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: అంటే ఏ పనికైనా ఉపయోగించే ఏ వస్తువైనా సరే
  rationale: జాబితాలోని పదార్థాలతో చేసిన పనిముట్టు లేదా ఉపయోగ వస్తువును సూచించే సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּמַּיִם יוּבָא
  choice: దానిని నీటిలో వేయాలి
  rationale: హోఫాల్ రూపంలోని ‘నీటిలోకి తీసుకురాబడాలి’ అనే అక్షరార్థాన్ని శుద్ధీకరణ సందర్భంలో సహజమైన తెలుగుగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: అది సాయంత్రం వరకు అపవిత్రంగా ఉంటుంది; ఆ తర్వాత పవిత్రమవుతుంది
  rationale: అపవిత్ర స్థితి కొనసాగు కాలాన్ని, తదనంతర స్థితిమార్పును స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: טמא/טהר పదజంట యొక్క స్వభావం
  choice: అపవిత్రం/పవిత్రం
  alternative: అశుద్ధం/శుద్ధం
  rationale: లేవీయకాండంలోని ఆచార-న్యాయ సందర్భాన్ని ప్రతిబింబించే స్థిరమైన తెలుగు పదజంట; నైతిక పాపం లేదా దోషం అనే భావాన్ని అదనంగా చేర్చదు.
- issue: చివరి וְטָהֵר యొక్క కాలక్రమ భావం
  choice: ఆ తర్వాత పవిత్రమవుతుంది
  alternative: మరియు పవిత్రమవుతుంది
  rationale: నీటిలో వేయడం మరియు సాయంత్రం వరకు అపవిత్రంగా ఉండడం తరువాత కలిగే స్థితిని సహజ తెలుగులో స్పష్టం చేస్తుంది; వచనంలో లేని అదనపు ఆచారాన్ని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయశైలి మరియు సాధారణ పాఠకులకు స్పష్టత మధ్య సమతుల్యత పాటించబడింది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
