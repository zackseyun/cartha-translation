review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies ritual contamination through contact with the dead creatures and preserves the required washing and evening time limit. However, its opening Telugu syntax can make “దాని” appear to refer to the creature rather than to the affected object. “వేయాలి” can imply throwing and is less suitable for the Hebrew passive ‘be brought into the water.’ The final “పవిత్రమవుతుంది” may suggest becoming holy, whereas וטהר means becoming ritually clean.
  naturalness: The material list and overall legal register are understandable, but the opening requires a clearer antecedent. “నీటిలో ఉంచాలి” is natural, restrained, and appropriate in this legal context.
  terminology: “అపవిత్రం” suitably conveys ritual uncleanness here. “శుద్ధమవుతుంది” is a more precise Telugu rendering for restoration to ritual cleanness than “పవిత్రమవుతుంది.” “గోనెపట్టు” adequately represents sackcloth/coarse sack material.
  issues:
  - severity: medium
    issue: Opening relative clause has an unclear antecedent.
    rationale: In “వాటిలో ఏదైనా చనిపోయినప్పుడు దాని మీద పడితే,” the singular “దాని” can be read as referring to the dead creature. The Hebrew says that every object on which one of the creatures falls becomes unclean.
  - severity: medium
    issue: “నీటిలో వేయాలి” is overly forceful.
    rationale: The Hebrew יוּבָא literally means ‘shall be brought into’; in context it requires placing the item in water, not throwing it.
  - severity: medium
    issue: “పవిత్రమవుతుంది” overstates וטהר.
    rationale: The verb denotes becoming clean in the ritual-legal sense, not becoming holy. “శుద్ధమవుతుంది” preserves this distinction.
  revised_text: వాటిలో ఏదైనా చనిపోయిన తర్వాత ఏ వస్తువుమీద పడితే, ఆ వస్తువు అపవిత్రమవుతుంది—చెక్కతో చేసిన పాత్రైనా, వస్త్రమైనా, తోలైనా, గోనెపట్టైనా, అంటే పనికి ఉపయోగించే ఏ వస్తువైనా సరే. దానిని నీటిలో ఉంచాలి[a]. అది సాయంత్రం వరకు అపవిత్రంగా ఉంటుంది; ఆ తర్వాత శుద్ధమవుతుంది.
  revised_footnotes:
  - marker: a
    text: లేదా, “దానిని నీటిలో ముంచాలి.” హీబ్రూలో అక్షరార్థంగా, “దానిని నీటిలోకి తీసుకురావాలి” అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision makes explicit that the object receiving the carcass is what becomes unclean, uses a nonviolent and source-appropriate expression for placing it in water, and distinguishes ritual cleanness from holiness. The footnote retains the possible immersion sense while accurately stating the literal Hebrew wording.
