- from: వాటిలో ఏదైనా చనిపోయినప్పుడు దాని మీద పడితే, అది అపవిత్రమవుతుంది—చెక్క పాత్రైనా, వస్త్రమైనా, తోలైనా, గోనెపట్టైనా, అంటే ఏ పనికైనా ఉపయోగించే ఏ వస్తువైనా సరే. దానిని నీటిలో వేయాలి[a]. అది సాయంత్రం వరకు అపవిత్రంగా ఉంటుంది; ఆ తర్వాత పవిత్రమవుతుంది.
