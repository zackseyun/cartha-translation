reference: Leviticus 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת אֵ֤לֶּה מֵ/הֶם֙ תֹּאכֵ֔לוּ אֶת הָֽ/אַרְבֶּ֣ה לְ/מִינ֔/וֹ וְ/אֶת הַ/סָּלְעָ֖ם לְ/מִינֵ֑/הוּ וְ/אֶת הַ/חַרְגֹּ֣ל לְ/מִינֵ֔/הוּ וְ/אֶת הֶ/חָגָ֖ב לְ/מִינֵֽ/הוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: te
  text: 'వాటిలో మీరు తినవచ్చేవి ఇవి: మిడతను దాని జాతి ప్రకారం[a], సలాము పురుగును దాని జాతి ప్రకారం, హర్గోలు పురుగును దాని జాతి ప్రకారం, గొల్లభామను దాని జాతి ప్రకారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సలాము’ (סָלְעָם), ‘హర్గోలు’ (חַרְגֹּל), ‘గొల్లభామ’ (חָגָב) అనే హెబ్రీ పురుగుపేర్ల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. సాంప్రదాయ అనువాదాల్లో వీటిని వరుసగా ‘బట్టతల మిడత,’ ‘క్రికెట్ పురుగు,’ ‘గొల్లభామ’ అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: వాటిలో మీరు వీటిని
  rationale: ముందటి వచనంలో చెప్పిన రెక్కలుగల గుంపు పురుగులలో అనుమతించబడిన కొన్నింటిని ఈ పదబంధం ప్రత్యేకిస్తుంది.
- source_word: תֹּאכֵלוּ
  choice: తినవచ్చు
  rationale: ఆహార నియమ సందర్భంలో ఈ అసంపూర్ణ క్రియ అనుమతిని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘తినవచ్చు’ సహజంగా ఉంది.
- source_word: הָאַרְבֶּה
  choice: మిడత
  rationale: אַרְבֶּהకు సాధారణంగా, స్థిరంగా గుర్తించబడిన అర్థం locust; తెలుగులో ‘మిడత’ సహజమైన సమానార్థకం.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: దాని దాని జాతుల ప్రకారం
  rationale: ఇక్కడ ఏకవచన నామం ఒక పురుగుల వర్గాన్ని సూచిస్తుంది. ఆ వర్గంలోని రకాలను సూచించే హెబ్రీ వర్గీకరణ సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַסָּלְעָם
  choice: సాలెయాము పురుగు
  rationale: ఈ పురుగు యొక్క ఖచ్చితమైన జీవశాస్త్రీయ గుర్తింపు అనిశ్చితం. ఊహాత్మక తెలుగు జాతిపేరును పెట్టకుండా హెబ్రీ పేరును లిప్యంతరీకరించి ‘పురుగు’ అని స్పష్టం చేశాం.
- source_word: הַחַרְגֹּל
  choice: హర్గోలు పురుగు
  rationale: ఖచ్చితమైన గుర్తింపు అనిశ్చితమైనందున ‘క్రికెట్’ వంటి వివాదాస్పద నిర్దిష్ట గుర్తింపును ప్రధాన పాఠ్యంలో విధించకుండా హెబ్రీ పేరును లిప్యంతరీకరించాం.
- source_word: הֶחָגָב
  choice: చిన్న మిడత
  rationale: חָגָב సాధారణంగా grasshopper తరహా దూకే పురుగును సూచిస్తుంది; אַרְבֶּהతో భేదాన్ని ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే తెలుగు పదబంధం ఎంచుకున్నాం.
