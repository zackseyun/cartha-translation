translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆహార నియమానికి తగిన గౌరవప్రదమైన మరియు సులభంగా అర్థమయ్యే శైలి వాడబడింది. నిర్ధారించలేని పురుగుల పేర్ల విషయంలో అనవసరమైన జీవశాస్త్రీయ ఖచ్చితత్వాన్ని నివారించి, మూలభాషలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
