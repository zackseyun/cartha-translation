revisions:
- from: 'వాటిలో మీరు వీటిని తినవచ్చు: మిడతను దాని దాని జాతుల ప్రకారం[a], సాలెయాము పురుగును దాని దాని జాతుల ప్రకారం, హర్గోలు పురుగును దాని దాని జాతుల ప్రకారం, చిన్న మిడతను దాని దాని జాతుల ప్రకారం.'
  to: 'వాటిలో మీరు తినవచ్చేవి ఇవి: మిడతను దాని జాతి ప్రకారం[a], సలాము పురుగును దాని జాతి ప్రకారం, హర్గోలు పురుగును దాని జాతి ప్రకారం, గొల్లభామను దాని జాతి ప్రకారం.'
  rationale: The revision removes the unsupported ‘small’ from the final insect name, uses a natural singular rendering of the repeated Hebrew kind formula, and improves the introductory Telugu while preserving the permissive legal sense. The uncertain insect identifications remain explicitly qualified in the footnote; transliterations are retained for the two especially uncertain terms.
  reviewer_model: gpt-5.6-terra
