id: LEV.11.41
reference: Leviticus 11:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: te
  text: నేలమీద పాకుతూ కదిలే ప్రతి చిన్న ప్రాణి అసహ్యమైనదే[a]; దానిని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హేయమైనది.’ ఇక్కడ ఈ పదం ఆ జీవి ఆహారంగా ఆచారపరంగా అసహ్యమైనదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: ప్రతి
  rationale: כָּל యొక్క సమగ్ర భావాన్ని సహజమైన తెలుగులో ‘ప్రతి’ తెలియజేస్తుంది. וְ సందర్భంలోని వరుస నియమాలతో అనుసంధానిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా ఆ అనుసంధానం సహజంగా నిలుస్తుంది.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: పాకుతూ కదిలే ప్రతి చిన్న ప్రాణి
  rationale: שֶׁרֶץ మరియు שׁרץ భూమికి దగ్గరగా పాకే లేదా గుంపులుగా కదిలే చిన్న జీవులను విస్తృతంగా సూచిస్తాయి. హెబ్రీలోని నామవాచక–క్రియ పదప్రయోగాన్ని తెలుగులో యథాతథంగా పునరావృతం చేస్తే అసహజంగా ఉంటుంది; ‘పాకుతూ కదిలే ... చిన్న ప్రాణి’ వర్గాన్నీ కదలికనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הָ/אָ֑רֶץ
  choice: నేలమీద
  rationale: ఈ సందర్భంలో אָרֶץ జలచరాలు, ఎగిరే జీవులకు భిన్నంగా భూమిపై లేదా నేలకు దగ్గరగా కదిలే జీవుల పరిధిని సూచిస్తుంది; ‘నేలమీద’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: שֶׁ֥קֶץ ה֖וּא
  choice: అసహ్యమైనదే
  rationale: שֶׁקֶץ ఇక్కడ ఆహారంగా ఆచారపరంగా అసహ్యమైనదని సూచిస్తుంది. ‘అసహ్యమైనదే’ అనే రూపం הוּא ఇచ్చే ఉద్ఘాటనను కూడా ప్రతిబింబిస్తుంది.
- source_word: לֹ֥א יֵאָכֵֽל
  choice: దానిని తినకూడదు
  rationale: నిఫాల్ అసంపూర్ణ క్రియ ఇక్కడ నిషేధార్థక కర్మణి ప్రయోగం. తెలుగు న్యాయ/నియమ శైలిలో ‘దానిని తినకూడదు’ సహజంగా అదే నిషేధ బలాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: שֶׁקֶץ యొక్క భావ పరిధి
  choice: అసహ్యమైనది
  alternative: హేయమైనది / ఆచారపరంగా అసహ్యమైనది
  rationale: మూలపాఠం జీవిని ఆహారంగా నిషిద్ధమైన, అసహ్యమైన వర్గంలో ఉంచుతుంది. ప్రధాన పాఠంలో ‘ఆచారపరంగా’ అని జోడించడం మూలంలో స్పష్టంగా లేని వివరణను ముందుకు తెస్తుంది; ఆ సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర నియమానికి తగిన గంభీరతతో అనువదించబడింది. హెబ్రీలోని cognate repetition‌ను అసహజమైన పదపునరుక్తిగా కాకుండా ‘పాకుతూ కదిలే’ అని వ్యక్తపరచింది.
