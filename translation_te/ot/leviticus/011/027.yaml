source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: te
  text: పంజాలపై నడిచే ప్రతి జంతువూ, నాలుగు కాళ్లతో నడిచే జంతువులన్నిటిలో, మీకు అపవిత్రమైనది. వాటి మృతదేహాన్ని తాకే ప్రతి వ్యక్తి సాయంత్రం వరకు అపవిత్రుడవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: అరికాళ్లపై నడిచే ప్రతి జంతువూ
  rationale: כַּף అనేది అరచేయి లేదా అరికాలి లోపలి భాగాన్ని సూచిస్తుంది. ఇక్కడ జంతువుల సందర్భంలో ‘అరికాళ్లు’ మూలపద భావాన్ని సహజంగా తెలియజేస్తుంది; ‘జంతువు’ అనేది సందర్భం నుంచి స్పష్టపరచబడింది.
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: నాలుగు కాళ్లతో నడిచే జంతువులన్నిటిలో
  rationale: חַיָּה ఇక్కడ భూజంతువులను సూచిస్తుంది. ‘నాలుగు కాళ్లతో నడిచే’ అనే రూపం హెబ్రీ సమష్టి ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: మీకు అపవిత్రం
  rationale: טמא ఇక్కడ నైతిక దోషాన్ని కాక ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. ‘అపవిత్రం’ లేవీయకాండపు సందర్భానికి తగిన స్థిరమైన పదం.
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: వాటి కళేబరాన్ని తాకే ప్రతి వ్యక్తి
  rationale: נְבֵלָה చనిపోయిన జంతువు శరీరాన్ని సూచిస్తుంది; ‘కళేబరం’ గౌరవప్రదమైన ఆధునిక తెలుగు పదం. హెబ్రీలో నామవాచకం ఏకవచనంలోను ప్రత్యయం బహువచనంలోను ఉండి సమష్టి భావాన్ని ఇస్తుంది; తెలుగులో ‘వాటి కళేబరం’ దానిని నిలుపుతుంది.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు
  rationale: న్యాయవిధి సందర్భంలోని imperfect ను ఫలిత స్థితిగా సహజ తెలుగులో తెలిపింది. వ్యక్తిని సూచిస్తున్నందున ‘అపవిత్రుడిగా’ వాడబడింది.
theological_decisions:
- issue: ఆచారపరమైన పవిత్రత పరిభాష
  choice: అపవిత్రం / అపవిత్రుడిగా
  alternative: అశుద్ధం / మైలపడినవాడు
  rationale: ఈ వచనం ప్రధానంగా ఆచారపరమైన స్థితిని నియంత్రిస్తుంది, నైతిక అపరాధాన్ని కాదు. ‘అపవిత్రం’ ఆ భేదాన్ని తగిన విధంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరతతో రూపొందించబడింది. హెబ్రీ వాక్యంలోని బహువచన-ఏకవచన మార్పును తెలుగులో సహజంగా మలిచింది; అవసరం లేని వివరణాత్మక పదాలను చేర్చలేదు.
