    issue: Explicitly masculine generic wording
    rationale: The Hebrew כָּל הַנֹּגֵעַ is grammatically masculine singular but generically includes any person. Modern Telugu can preserve this scope more naturally with “ప్రతి ఒక్కరూ” and the non-gendered predicate “అపవిత్రంగా ఉంటారు.”
