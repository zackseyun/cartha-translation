source:
  edition: WLC
  text: וּ/לְ/אֵ֖לֶּה תִּטַּמָּ֑אוּ כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: te
  text: వీటివల్ల మీరు అపవిత్రులవుతారు:[a] వాటి కళేబరాన్ని తాకే ప్రతి ఒక్కరూ సాయంకాలం వరకు అపవిత్రంగా ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటి విషయంలో మీరు అపవిత్రులవుతారు.” ప్రారంభ పదబంధం అపవిత్రతకు కారణాన్ని మాత్రమే కాక, తరువాత చెప్పబోయే వర్గాన్ని సాధారణంగా పరిచయం చేస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “వాటి కళేబరం” అని, బహువచన ప్రత్యయంతో కూడిన ఏకవచన నామవాచకం ఉంది; “వాటి కళేబరాలను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: వీటివల్ల
  rationale: וְ + לְ + demonstrative ఇక్కడ అపవిత్రత కలిగే సాధనాన్ని లేదా సంబంధిత వర్గాన్ని సూచించగలదు. సందర్భంలో ‘వీటివల్ల’ సహజంగా ఉన్నప్పటికీ, ‘వీటి విషయంలో’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: תִּטַּמָּאוּ
  choice: మీరు అపవిత్రులవుతారు
  rationale: טמא యొక్క ద్వితీయ పురుష బహువచన రూపం ఫలితంగా కలిగే ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; నైతిక దోషాన్ని సూచించదు.
- source_word: כָּל הַנֹּגֵעַ
  choice: తాకే ప్రతివాడూ
  rationale: כָּל తరువాతి ఏకవచన కృదంతానికి సాధారణ, సార్వత్రిక భావం ఉంది. ఈ తెలుగు రూపం ఆ పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנִבְלָתָם
  choice: వాటి కళేబరాన్ని
  rationale: נְבֵלָה చనిపోయిన జంతువు కళేబరాన్ని సూచిస్తుంది. మూలంలో నామవాచకం ఏకవచనంలో, ప్రత్యయం బహువచనంలో ఉంది; దాన్ని ప్రధాన పాఠంలో ఏకవచన సమాహార భావంతో ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: יִטְמָא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: సాధారణ ఏకవచన కర్తకు అనుగుణంగా, ఆ వ్యక్తి నిర్దిష్ట కాలం వరకు ఆచారపరంగా అపవిత్ర స్థితిలో ఉంటాడనే భావాన్ని తెలుపుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంకాలం వరకు
  rationale: ఆచారపరమైన అపవిత్రత కొనసాగే కాలపరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పరిశుద్ధతా నియమాలలో טמא అనే పదం సూచించే అపవిత్రత స్వభావం
  choice: ఆచారపరమైన అపవిత్రతగా అనువదించడం
  alternative: నైతిక కలుషత లేదా పాపదోషంగా అర్థం చేయడం
  rationale: ఈ వచనం జంతు కళేబరాన్ని తాకడం వల్ల కలిగే ఆచారపరమైన స్థితిని వివరిస్తుంది; ఇది స్వయంగా నైతిక దోషాన్ని ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. ‘కళేబరం’ జంతువు మృతదేహాన్ని ఖచ్చితంగా సూచిస్తుంది; ‘అపవిత్రుడు’ ఆచారపరమైన స్థితిని నిలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
