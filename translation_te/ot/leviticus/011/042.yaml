revisions:
- from: నేలమీద పాకే జీవులన్నిటిలో[b] పొట్టమీద కదిలేదేదైనా[a], నాలుగు కాళ్లమీద నడిచేదేదైనా, అలాగే అనేక కాళ్లు కలిగినదేదైనా మీరు తినకూడదు; ఎందుకంటే అవి అసహ్యమైనవి[c].
  to: నేలమీద ప్రాకే జీవులన్నిటిలో[b] పొట్టమీద కదిలేదంతా, నాలుగు కాళ్లమీద నడిచేదంతా, అనేక కాళ్లు కలిగినదంతా కూడా మీరు తినకూడదు; ఎందుకంటే అవి అసహ్యమైనవి[c].
  rationale: The text is adjusted only for closer representation of the Hebrew's inclusive third category and its broad swarming-creature classification. Footnote a is retained as a valid lexical alternative but is not anchored in the revised main text because the primary wording now uses the alternative-neutral 'కదిలేదంతా'; marker b remains anchored to the umbrella classification, and marker c remains anchored to 'అసహ్యమైనవి.'
