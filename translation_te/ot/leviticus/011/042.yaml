id: LEV.11.42
reference: Leviticus 11:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: te
  text: నేలమీద ప్రాకే జీవులన్నిటిలో[b] పొట్టమీద కదిలేదంతా, నాలుగు కాళ్లమీద నడిచేదంతా, అనేక కాళ్లు కలిగినదంతా కూడా మీరు తినకూడదు; ఎందుకంటే అవి అసహ్యమైనవి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ప్రాకే జీవి ప్రాకేది”; ఒకే మూలపదాన్ని పునరావృతం చేసి ఈ చిన్న జీవుల వర్గాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “హేయమైనవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ఏదైనా / అన్నిటిలో
  rationale: వివిధ జీవుల వర్గాలను సమగ్రంగా సూచించే హీబ్రూ పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוֹלֵךְ עַל גָּח
  choice: పొట్టమీద కదిలేది
  rationale: కదలిక విధానాన్ని నేరుగా తెలియజేస్తుంది; ‘పాకేది’ కూడా సాధ్యమే గాని అది కొంత వివరణాత్మకం.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: నాలుగు కాళ్లమీద నడిచేది
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన శరీర చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: అలాగే అనేక కాళ్లు కలిగినదేదైనా
  rationale: ముందు చెప్పిన వర్గాలకు అనేక కాళ్లుగల జీవులను కూడా చేర్చే విస్తరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: పాకే జీవులన్నిటిలో
  rationale: నామవాచకం–క్రియారూపం పునరుక్తిని తెలుగులో భారంగా చేయకుండా జీవుల వర్గీకరణ భావాన్ని అందిస్తుంది; మూలంలోని పునరుక్తిని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: నేలమీద
  rationale: ఈ సందర్భంలో భూమి ఉపరితలంపై కదిలే చిన్న జీవులను సూచించడానికి ‘నేలమీద’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לֹא תֹאכְלֻם
  choice: మీరు తినకూడదు
  rationale: ధర్మశాస్త్ర సంబంధమైన నిషేధాన్ని ఆధునిక తెలుగులో నేరుగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనవి
  rationale: ఆహార నియమాల సందర్భంలోని బలమైన ఏవగింపు భావాన్ని తెలిపి, వచనంలో లేని తరువాతి సిద్ధాంతార్థాలను చేర్చదు.
theological_decisions:
- issue: పవిత్రతా ధర్మశాస్త్రంలో ఈ నిషేధ స్వభావం
  choice: వచనాన్ని ఆహార సంబంధమైన ప్రత్యక్ష నిషేధంగా అనువదించడం
  alternative: దీనిని అన్ని కాలాలకు వర్తించే నైతిక ఆజ్ఞగా వ్యాఖ్యానించడం లేదా కేవలం సాంస్కృతిక ఆచారంగా సడలించడం
  rationale: హీబ్రూ పాఠం లేవీయకాండంలోని శుద్ధి–ఆహార నియమాల మధ్య ప్రత్యక్ష నిషేధాన్ని ఇస్తుంది. దాని విస్తృత కాలానుగుణ లేదా సిద్ధాంతపర వర్తింపును ఈ వచనం తానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయ ధర్మశాస్త్రానికి తగిన గంభీరతతో రూపొందించబడింది. ‘పొట్ట’, ‘కాళ్లు’, ‘నేల’ వంటి స్పష్టమైన పదాలు మూలంలోని దృశ్యాత్మక వర్గీకరణను నిలుపుతాయి.
