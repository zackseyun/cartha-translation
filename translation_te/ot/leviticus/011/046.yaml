  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: te
  text: పశువులు, పక్షులు, నీళ్లలో సంచరించే ప్రతి జీవి[b], నేలపై[c] గుంపులుగా కదలాడే ప్రతి ప్రాణి గురించి ఉన్న నియమం[a] ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమం’కు బదులుగా ‘ఉపదేశం’ లేదా ‘ధర్మశాస్త్రం’ అని కూడా అనువదించవచ్చు; హీబ్రూ תּוֹרָה అధికారపూర్వకమైన బోధనను, నియమాన్ని రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రతి జీవి’కు బదులుగా ‘ప్రతి సజీవ ప్రాణి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ఇక్కడ అమూర్తమైన ‘ఆత్మ’ను కాకుండా సజీవ ప్రాణిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘నేలపై’కు బదులుగా ‘భూమిపై’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: గురించిన ధర్మశాస్త్రం
  rationale: ఇక్కడ תּוֹרָה ముందున్న శుద్ధ–అశుద్ధ జీవుల నియమాలను సమగ్రంగా సూచిస్తుంది. ‘ధర్మశాస్త్రం’ అధికారపూర్వకమైన బోధన/నియమం అనే భావాన్ని ఇస్తుంది; ‘గురించిన’ అనే ప్రయోగం తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులను
  rationale: בְּהֵמָה భూమిమీద నివసించే పెద్ద జంతువులను, తరచుగా మచ్చిక జంతువులను సూచిస్తుంది. ఈ వర్గీకరణ సందర్భంలో ‘పశువులు’ సంక్షిప్తమైన, సాధారణ తెలుగు పదం; ఇది కేవలం గోవులకు మాత్రమే పరిమితం కావాల్సిన అవసరం లేదు.
- source_word: הָעוֹף
  choice: పక్షులను
  rationale: עוֹף విస్తృతంగా ఎగిరే జీవులను సూచించగలిగినా, ఈ సందర్భంలో ‘పక్షులు’ సహజమైన వర్గనామం.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: ప్రతి జీవిని
  rationale: נֶפֶשׁ הַחַיָּה అనేది సజీవ ప్రాణిని సూచించే హీబ్రూ పదబంధం. ఆధునిక తెలుగులో ‘ప్రతి జీవి’ సహజంగా ఉండి, దేహానికి వేరైన ఆత్మ అనే అనవసర భావాన్ని కలిగించదు.
- source_word: הָרֹמֶשֶׂת
  choice: సంచరించే
  rationale: רמש ఇక్కడ నీటిలో కదలడాన్ని సూచిస్తుంది. ‘పాకే’ అనడం జలజీవులకు అసహజంగా, మరీ సంకుచితంగా ఉంటుంది; ‘సంచరించే’ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּמָּיִם
  choice: నీళ్లలో
  rationale: హీబ్రూలో రూపం బహువచనమైనా, ఆధునిక తెలుగులో ‘నీళ్లలో’ సహజంగా ఉండి మూలంలోని జలప్రాంత భావాన్ని నిలుపుతుంది.
- source_word: וּלְכָל נֶפֶשׁ
  choice: ప్రతి ప్రాణిని
  rationale: రెండవ נֶפֶשׁ‌కు ‘ప్రాణి’ వాడటం జీవమున్న సృష్టిని సూచిస్తూ, తెలుగులో ‘ప్రతి జీవిని’ అనే పదబంధాన్ని వెంటనే పునరావృతం చేయకుండా సహజమైన వైవిధ్యాన్ని ఇస్తుంది.
- source_word: הַשֹּׁרֶצֶת
  choice: గుంపులుగా కదలాడే
  rationale: שׁרץ చిన్న జీవులు విస్తరించి, గుంపులుగా కదలడాన్ని సూచిస్తుంది. ‘గుంపులుగా కదలాడే’ అనే అనువాదం ‘సంచరించే’ అనే ముందటి పదంతో ఉన్న హీబ్రూ భేదాన్ని నిలుపుతుంది; ‘పాకే’ కంటే ఇది విస్తృతమైనది.
- source_word: עַל הָאָרֶץ
  choice: నేలపై
  rationale: ఇక్కడ אֶרֶץ నీళ్లకు వ్యతిరేకంగా భూభాగాన్ని సూచిస్తుంది. తెలుగులో ‘నేలపై’ ఈ సందర్భానుసార భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ‌ను ‘ఆత్మ’గా అనువదించాలా?
  choice: జీవి / ప్రాణి
  alternative: సజీవ ఆత్మ
  rationale: ఈ వచనంలో נֶפֶשׁ జంతుజీవాన్ని సూచిస్తుంది; దేహానికి వేరైన అమూర్త ఆత్మను బోధించడం లేదు. అందువల్ల సందర్భానుసారంగా ‘జీవి/ప్రాణి’ సరైనవి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వచనపు నియమసారాంశ ధోరణిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన భాషను ఉపయోగించాం. హీబ్రూలోని רמש, שׁרץ మధ్య భేదాన్ని ‘సంచరించే’, ‘గుంపులుగా కదలాడే’ అనే వేర్వేరు ప్రయోగాలతో ప్రతిబింబించాం.
