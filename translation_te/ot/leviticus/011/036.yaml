id: LEV.11.36
reference: Leviticus 11:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: te
  text: అయితే, నీటి ఊటగానీ నీటిని నిల్వచేసే గుంటగానీ[a] శుద్ధంగానే ఉంటుంది. కానీ ఆ జంతువుల కళేబరాన్ని తాకేవాడు అపవిత్రుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీరు పోగైన స్థలం.’ హీబ్రూ పదబంధం నీరు ఒకచోట పోగై ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి వచనంలోని అపవిత్రత నియమానికి ఇక్కడ మినహాయింపు లేదా వ్యత్యాసం సూచించబడుతోంది; ఆధునిక తెలుగులో ‘అయితే’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: מַעְיָן
  choice: నీటి ఊట
  rationale: ఇది సహజంగా ఉబికి వచ్చే నీటి వనరును సూచిస్తుంది; ‘నీటి ఊట’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בּוֹר
  choice: గుంట
  rationale: నీటిని పోగుచేసే లేదా నిల్వచేసే తవ్విన ప్రదేశాన్ని సూచిస్తుంది. ‘గుంట’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని నీటి నిల్వ భావాన్ని తరువాతి పదబంధంతో కలిపి తెలియజేస్తుంది.
- source_word: מִקְוֵה מַיִם
  choice: నీరు చేరే
  rationale: అక్షరార్థంగా ‘నీటి సమాహారం’; తెలుగులో ఊట లేదా గుంటలో నీరు పోగయ్యే భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘నీరు చేరే’ అని అనువదించబడింది.
- source_word: יִהְיֶה טָהוֹר
  choice: శుద్ధంగానే ఉంటుంది
  rationale: నీటి వనరు కళేబరం కారణంగా అపవిత్రం కాదనే సందర్భార్థాన్ని ‘-గానే’ స్పష్టం చేస్తుంది; ‘శుద్ధం’ ఇక్కడ ఆచారపరమైన స్థితిని సూచిస్తుంది.
- source_word: נֹגֵעַ
  choice: తాకేవాడు
  rationale: హీబ్రూ కృదంతం సాధారణంగా ఆ క్రియ చేసే వ్యక్తిని సూచిస్తుంది; ‘తాకేవాడు’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: נִבְלָתָם
  choice: వాటి కళేబరం
  rationale: నְבֵלָה చనిపోయిన జంతువు శరీరాన్ని సూచిస్తుంది. ఏకవచన సమూహార్థాన్ని, ముందుగా ప్రస్తావించిన జీవులకు చెందినదనే భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడవుతాడు
  rationale: తాకిన వ్యక్తి పొందే ఆచారపరమైన అపవిత్ర స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధి పదజాలం
  choice: శుద్ధం / అపవిత్రం
  alternative: పవిత్రం / అపవిత్రం; శుభ్రం / అశుభ్రం
  rationale: లేవీయకాండము 11లో ఇవి నైతిక తీర్పు కంటే ఆచారపరమైన స్థితులను సూచిస్తాయి. ‘శుద్ధం / అపవిత్రం’ ఆ భేదాన్ని గౌరవప్రదంగా, సులభంగా తెలియజేస్తాయి.
- issue: יִהְיֶה טָהוֹר లో స్థితి కొనసాగింపు
  choice: శుద్ధంగానే ఉంటుంది
  alternative: శుద్ధంగా ఉంటుంది
  rationale: హీబ్రూ రూపం సూటిగా ‘శుద్ధంగా ఉంటుంది’ అని ఉన్నప్పటికీ, ముందటి వచనంలోని కళేబరం పడటం వల్ల కలిగే అపవిత్రతకు ఇది మినహాయింపుగా ఉంది. ‘శుద్ధంగానే’ ఆ సందర్భసూచిత కొనసాగింపును అనవసర సిద్ధాంతార్థం లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాక్యంలోని మొదటి భాగానికి ‘అయితే’, రెండవ వ్యత్యాసానికి ‘కానీ’ వాడి హీబ్రూ తార్కిక నిర్మాణాన్ని సహజంగా నిలిపాం.
