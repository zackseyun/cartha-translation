  to: ఉష్ట్రపక్షిని[a], గద్దను, సముద్ర కాకిని, దాని జాతి ప్రకారం డేగను,
  rationale: The revision retains the ordered list and the lexical-uncertainty anchor, removes a contextually inferable but unexpressed prohibition, and renders the singular classificatory phrase לְמִינֵהוּ accurately as “దాని జాతి ప్రకారం.”
