id: LEV.11.16
reference: Leviticus 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ בַּ֣ת הַֽ/יַּעֲנָ֔ה וְ/אֶת הַ/תַּחְמָ֖ס וְ/אֶת הַ/שָּׁ֑חַף וְ/אֶת הַ/נֵּ֖ץ לְ/מִינֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/016.yaml
  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: te
  text: ఉష్ట్రపక్షిని[a], గద్దను, సముద్ర కాకిని, దాని జాతి ప్రకారం డేగను,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని అనేక హీబ్రూ పక్షి పేర్ల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. సంప్రదాయ ప్రత్యామ్నాయాల్లో ‘ఉష్ట్రపక్షి’కి ‘గుడ్లగూబ,’ ‘గద్ద’కు ‘గుడ్లగూబ’ లేదా ‘రాత్రి డేగ,’ ‘సముద్ర కాకి’కి ‘కోకిల,’ ‘డేగ’కు ‘గద్ద’ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: ఉష్ట్రపక్షి
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థంగా ‘యానా కుమార్తె’ అయినా, పక్షుల జాబితాలో ఒక పక్షి పేరుగా పనిచేస్తుంది. ఆధునిక నిఘంటు ఆధారాల ప్రకారం ‘ఉష్ట్రపక్షి’ సంభావ్య గుర్తింపు; ఖచ్చితత్వం లేనందున పాదటిప్పణి ఇచ్చాం.
- source_word: הַתַּחְמָס
  choice: గద్ద
  rationale: ఖచ్చితమైన జాతి తెలియదు. వేటపక్షిని సూచించే విస్తృతమైన, సహజమైన తెలుగు పదంగా ‘గద్ద’ను ఎంచుకున్నాం.
- source_word: הַשָּׁחַף
  choice: సముద్రపు కాకి
  rationale: ఈ పక్షి గుర్తింపు అనిశ్చితం; ఆధునిక నిఘంటువుల్లో సాధారణంగా gull అని గుర్తిస్తారు. సాధారణ పాఠకులకు అర్థమయ్యే ‘సముద్రపు కాకి’ అనే పేరును వాడాం.
- source_word: הַנֵּץ
  choice: డేగ
  rationale: ఈ పదం గద్ద లేదా డేగ వర్గానికి చెందిన వేటపక్షిని సూచిస్తుంది. ముందున్న תַּחְמָס నుంచి భేదం నిలుపుతూ ‘డేగ’ను ఎంచుకున్నాం.
- source_word: לְמִינֵהוּ
  choice: జాతిజాతుల
  rationale: వివిధ ఉపజాతులు లేదా రకాలను సమగ్రంగా సూచించే వర్గీకరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאֵת / וְאֶת
  choice: ను
  rationale: וְ అనే సంధి కొనసాగుతున్న జాబితాను కలుపుతుంది; אֵת ప్రత్యక్ష కర్మ సూచకం. తెలుగులో ప్రతి పేరుకు కర్మవిభక్తి చేర్చి, చివర క్రియతో జాబితా సంబంధాన్ని సహజంగా చూపించాం.
theological_decisions:
- issue: ఈ వచనంలోని నిషేధ క్రియ మునుపటి వాక్యంనుంచి కొనసాగడం
  choice: ‘తినకూడదు’ అనే క్రియను స్పష్టంగా చేర్చడం
  alternative: కేవలం పక్షుల పేర్ల జాబితాగా అనువదించడం
  rationale: హీబ్రూలో ఇది 11:13లోని నిషేధానికి కొనసాగింపైన కర్మల జాబితా. విడిగా చదివే వచనంగా తెలుగులో అర్థవంతంగా ఉండేందుకు అంతర్నిహిత క్రియను చేర్చాం; కొత్త ధార్మిక భావాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే పక్షి పేర్లు వాడుతూ, హీబ్రూ జాబితా స్వరూపాన్ని నిలిపాం. మూలంలో పక్షుల గుర్తింపుపై ఉన్న అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
