- from: 'నీళ్లలో ఉండే వాటన్నిటిలో వీటిని మీరు తినవచ్చు: నీళ్లలో, సముద్రాల్లో, వాగుల్లో[a] రెక్కలు, పొలుసులు ఉన్నవాటిని మీరు తినవచ్చు.'
  to: 'నీళ్లలో ఉన్నవాటన్నిటిలో వీటిని మీరు తినవచ్చు: నీళ్లలో, సముద్రాల్లోను వాగుల్లోను రెక్కలూ పొలుసులూ ఉన్నవాటిని మీరు తినవచ్చు.'
