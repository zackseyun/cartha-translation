id: LEV.11.9
reference: Leviticus 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּ֖ל אֲשֶׁ֣ר בַּ/מָּ֑יִם כֹּ֣ל אֲשֶׁר ל/וֹ֩ סְנַפִּ֨יר וְ/קַשְׂקֶ֜שֶׂת בַּ/מַּ֗יִם בַּ/יַּמִּ֛ים וּ/בַ/נְּחָלִ֖ים אֹתָ֥/ם תֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: te
  text: 'నీళ్లలో ఉన్నవాటన్నిటిలో వీటిని మీరు తినవచ్చు: నీళ్లలో, సముద్రాల్లోను వాగుల్లోను రెక్కలూ పొలుసులూ ఉన్నవాటిని మీరు తినవచ్చు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת זֶה
  choice: వీటిని
  rationale: హీబ్రూలో ఏకవచన సూచకరూపం ఉన్నప్పటికీ, ఆహారానికి అనుమతించబడిన జీవుల వర్గాన్ని సూచించే తెలుగు సందర్భంలో బహువచనమైన ‘వీటిని’ సహజంగా ఉంటుంది.
- source_word: תֹּאכְלוּ / תֹּאכֵלוּ
  choice: మీరు తినవచ్చు
  rationale: న్యాయనియమ సందర్భంలోని ఈ అసంపూర్ణ క్రియారూపం ఇక్కడ ఆజ్ఞకన్నా అనుమతిని తెలియజేస్తుంది; ‘తినవచ్చు’ దానిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: నీళ్లలో ఉండే వాటన్నిటిలో
  rationale: מִן యొక్క విభాగార్థాన్ని ‘వాటన్నిటిలో’ ద్వారా నిలుపుతూ, מַיִם అనే రూపాన్ని సహజమైన ఆధునిక తెలుగు ‘నీళ్లు’గా అందిస్తుంది.
- source_word: כֹּל אֲשֶׁר לוֹ
  choice: ఉన్నవాటిని
  rationale: לוֹ ద్వారా వ్యక్తమయ్యే కలిగియుండటాన్ని, తెలుగు జీవవర్గీకరణ వాక్యంలో సహజంగా ‘ఉన్నవాటిని’ అని తెలిపింది.
- source_word: סְנַפִּיר
  choice: రెక్కలు
  rationale: చేపలు నీటిలో కదలడానికి ఉపయోగించే fins‌కు సాధారణ ఆధునిక తెలుగు పదం ‘రెక్కలు’; హీబ్రూ ఏకవచనం వర్గనామంగా ఉన్నందున తెలుగులో బహువచనం సహజం.
- source_word: קַשְׂקֶשֶׂת
  choice: పొలుసులు
  rationale: చేపల scales‌కు ప్రామాణికమైన, సాధారణ తెలుగు పదం ‘పొలుసులు’; హీబ్రూ వర్గనామాన్ని తెలుగు usage ప్రకారం బహువచనంగా ఇచ్చింది.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: సముద్రాల్లో, వాగుల్లో
  rationale: יַמִּיםను ‘సముద్రాలు’గా, ప్రవహించే అంతర్భూభాగ జలమార్గాలను సూచించగల נְחָלִיםను సందర్భానుకూలంగా ‘వాగులు’గా అనువదించింది.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: ఉన్నవాటిని మీరు తినవచ్చు
  rationale: అనుమతించబడిన జీవులను చివర మళ్లీ నొక్కిచెప్పే హీబ్రూ పునరుక్తిని తెలుగులో కూడా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయనియమ శైలిని ఉపయోగించాం. మూలంలోని ప్రారంభ, ముగింపు అనుమతి వాక్యాల పునరుక్తిని నిలిపాం.
