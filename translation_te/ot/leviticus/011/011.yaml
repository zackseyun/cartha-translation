id: LEV.11.11
reference: Leviticus 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: te
  text: అవి మీకు అసహ్యమైనవిగా ఉండాలి; వాటి మాంసంలో దేనినీ మీరు తినకూడదు; వాటి కళేబరాలను అసహ్యమైనవిగా పరిగణించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హేయమైనవిగా’ అని కూడా అనువదించవచ్చు; ఇక్కడి హెబ్రీ పదం ఆహార నియమాల సందర్భంలో ఆచారపరంగా అసహ్యకరమైనదిగా, తిరస్కరించదగినదిగా భావించబడేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనవి
  rationale: ఆహార నియమాల సందర్భంలో ఈ పదం ఆచారపరంగా జుగుప్సాకరమైనదిగా, తిరస్కరించవలసినదిగా భావించబడేదాన్ని సూచిస్తుంది. ‘అపవిత్రమైనవి’ అనేది వేరే హెబ్రీ అపవిత్రత పదాలతో కలిసిపోవచ్చు; ‘హేయమైనవి’ కంటే ‘అసహ్యమైనవి’ సాధారణ పాఠకులకు సహజంగా ఉండి బలమైన ప్రతికూల విలువను నిలుపుతుంది.
- source_word: יִהְיוּ לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: లָכֶםలోని సంబంధార్థాన్ని ‘మీకు’తో నిలిపి, ఇది ఇశ్రాయేలీయులు వాటిని ఎలా పరిగణించాలో నిర్దేశించే న్యాయవాక్యమని తెలుపుతుంది.
- source_word: מִבְּשָׂרָם
  choice: వాటి మాంసంలో దేనినీ
  rationale: నిషేధార్థక తినడం అనే క్రియ తరువాత వచ్చిన מִן భాగసూచకంగా ఉంది. అందువల్ల వాటి మాంసంలో ఏ భాగాన్నీ తినకూడదనే భావం సహజమైన తెలుగులో స్పష్టమవుతుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: న్యాయసంబంధ సందర్భంలోని నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, నిర్దేశాత్మక బలంతో వ్యక్తం చేస్తుంది.
- source_word: נִבְלָתָם
  choice: వాటి కళేబరాలను
  rationale: ఈ పదం జంతువుల మృతదేహాలను సూచిస్తుంది. ‘కళేబరాలు’ జంతు-ఆహార నియమాల సందర్భంలో ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: תְּשַׁקֵּצוּ
  choice: అసహ్యమైనవిగా పరిగణించాలి
  rationale: שֶׁקֶץకు సమానమూలమైన ఈ పియేల్ క్రియ కేవలం భావోద్వేగంగా అసహ్యించుకోవడం మాత్రమే కాక, వాటిని అసహ్యమైనవిగా గుర్తించి చూడడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆచార-మూల్యాంకన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆహార నియమంలోని అసహ్యత భాష స్వభావం
  choice: ‘అసహ్యమైనవి’ అనే ఆచారపరమైన తీవ్ర తిరస్కార భాషను ఉపయోగించడం
  alternative: ‘హేయమైనవి’ లేదా ‘అపవిత్రమైనవి’ అని అనువదించడం
  rationale: ఈ వచనం ఇశ్రాయేలు నిబంధన సంబంధమైన ఆహార భేదాల గురించి మాట్లాడుతుంది. ‘అసహ్యమైనవి’ బలమైన ప్రతికూల వర్గీకరణను నిలుపుతూ, పాఠ్యంలో స్పష్టంగా లేని విస్తృత నైతిక తీర్పును చొప్పించదు. ‘అపవిత్రమైనవి’ అనడం ఇతర హెబ్రీ అపవిత్రత పదాలతో ఉన్న భేదాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. హెబ్రీ సంధానాన్ని ప్రతిబింబించే అనుసంధాన నిర్మాణం, సమాంతర నిషేధాలు సెమీకోలన్లతో నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
