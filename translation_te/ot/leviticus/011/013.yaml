id: LEV.11.13
reference: Leviticus 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אֵ֨לֶּה֙ תְּשַׁקְּצ֣וּ מִן הָ/ע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת הַ/נֶּ֨שֶׁר֙ וְ/אֶת הַ/פֶּ֔רֶס וְ/אֵ֖ת הָ/עָזְנִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: te
  text: 'పక్షులలో వీటిని మీరు అసహ్యమైనవిగా పరిగణించాలి; వీటిని తినకూడదు; అవి అసహ్యమైనవి: గద్ద[a], రాబందు[b], నల్ల రాబందు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ జాబితాలోని హీబ్రూ పక్షిపేర్లను ఎల్లప్పుడూ ఖచ్చితంగా గుర్తించడం సాధ్యం కాదు. ఇక్కడ ‘గద్ద’ అనే పదం పెద్ద వేటపక్షిని లేదా రాబందును కూడా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గడ్డం రాబందు’ (లామర్‌గైర్). పాత అనువాదాల్లో తరచుగా ‘ఎముకలు పగలగొట్టే పక్షి’ అనే అర్థమున్న పేరు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఈ పక్షి గుర్తింపు అనిశ్చితం. కొందరు దీన్ని ఒక విధమైన గద్ద లేదా రాబందుగా గుర్తిస్తారు; పాత అనువాదాల్లో కొందరు దీనిని చేపల గద్దగా పేర్కొంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: అసహ్యమైనవిగా ఎంచాలి
  rationale: పీయేల్ రూపం కేవలం భావోద్వేగ ద్వేషాన్ని కాక, ఆహార నియమాల సందర్భంలో వాటిని నిషిద్ధమైనవిగా పరిగణించి వ్యవహరించడాన్ని సూచిస్తుంది.
- source_word: מִן הָעוֹף
  choice: పక్షుల్లో
  rationale: מן యొక్క విభాగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఈ ఆహార జాబితా సందర్భంలో עוף కు ‘పక్షులు’ సరైన పదం.
- source_word: לֹא יֵאָכְלוּ
  choice: వీటిని తినకూడదు
  rationale: హీబ్రూ నిఫాల్ అపూర్ణరూపంలోని కర్మణి నిషేధాన్ని తెలుగులో సహజమైన నిషేధ వాక్యంగా అందిస్తుంది.
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనవి
  rationale: ఆచారపరంగా జుగుప్సాకరమైన లేదా నిషిద్ధమైన వాటి భావాన్ని నిలుపుతుంది; దానిని కేవలం ‘అపవిత్రమైనవి’గా కుదించదు.
- source_word: הַנֶּשֶׁר
  choice: గద్ద
  rationale: సంప్రదాయ గుర్తింపును అనుసరిస్తుంది; అయితే ఈ హీబ్రూ పేరు పెద్ద వేటపక్షి లేదా రాబందును విస్తృతంగా సూచించే అవకాశం ఉన్నందున సందేహాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: הַפֶּרֶס
  choice: గడ్డం గద్ద
  rationale: పక్షిని ఖచ్చితంగా గుర్తించడం పూర్తిగా నిర్ధారితం కాకపోయినా, సాధారణంగా bearded vulture/lammergeier తో అనుసంధానించే గుర్తింపును తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הָעָזְנִיָּה
  choice: నల్ల రాబందు
  rationale: సంభావ్య ఆధునిక గుర్తింపును ఉపయోగిస్తుంది; ఖచ్చితమైన జాతి అనిశ్చితిని పాదసూచికలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: שֶׁקֶץ ను సాధారణ అపవిత్రతగా చూపాలా, అసహ్యమైన/నిషిద్ధమైనదిగా చూపాలా
  choice: అసహ్యమైనవి
  alternative: అపవిత్రమైనవి
  rationale: మూలపదంలోని బలమైన జుగుప్సా మరియు ఆహార నిషేధ భావాన్ని నిలుపుతూ, దీనిని טמא అనే సాధారణ ‘అపవిత్రం’ పదంతో కలపకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించబడింది. జంతుశాస్త్రీయ అనిశ్చితులను ప్రధాన వాక్యంలో అతిగా భారం చేయకుండా పాదసూచికల్లో భద్రపరిచింది.
