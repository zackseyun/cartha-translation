id: LEV.11.6
reference: Leviticus 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: te
  text: కుందేలు[a] నెమరు వేస్తుంది గాని దాని డెక్క చీలలేదు కాబట్టి, అది మీకు అపవిత్రం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హేర్.’ హెబ్రీ పదమైన אַרְנֶבֶתను సంప్రదాయంగా హేర్‌గా అర్థం చేసుకుంటారు; కొందరు దీన్ని కుందేలు అనే విస్తృత అర్థంలో తీసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: కుందేలు
  rationale: ఈ హెబ్రీ పదం సంప్రదాయంగా ‘హేర్’ జాతి జంతువును సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘కుందేలు’ సహజంగా అర్థమవుతుంది; ఖచ్చిత జంతుశాస్త్రీయ గుర్తింపులో ఉన్న స్వల్ప అనిశ్చితిని పాదసూచికలో నిలుపుకున్నాం.
- source_word: כִּי
  choice: —
  rationale: హెబ్రీలో ఇది కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో జంతువు పేరును ముందుంచి, రెండు లక్షణాలను చెప్పి వర్గీకరణను ముగించే నిర్మాణంలో కారణ సంబంధం సహజంగానే వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘ఎందుకంటే’ చేర్చడం భారంగా ఉంటుంది.
- source_word: מַעֲלַת גֵּרָה
  choice: నెమరు వేస్తుంది
  rationale: అక్షరార్థంగా ‘నెమరును పైకి తెస్తుంది’ అనే భావం. జంతువు మళ్లీ ఆహారాన్ని నమలడాన్ని తెలిపే సహజమైన ప్రామాణిక తెలుగు పదబంధం ‘నెమరు వేయడం’.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: దాని డెక్క చీలి ఉండదు
  rationale: డెక్క విభజింపబడలేదనే రెండవ గుర్తింపును స్పష్టంగా తెలియజేస్తుంది. ‘గాని’ రెండు లక్షణాల మధ్య వ్యతిరేకతను సహజంగా చూపుతుంది.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: అది మీకు అపవిత్రం
  rationale: ఆహార నియమాల సందర్భంలోని ఆచారపరమైన అపవిత్రతను సూచిస్తూ, לָכֶם లోని ‘మీకు’ అనే నిబంధనాత్మక సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: లేవీయకాండపు ఆహార నియమంలో అపవిత్రత స్వభావం
  choice: ‘అపవిత్రం’ అనే విస్తృత బైబిలు పదాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘ఆచారపరంగా అపవిత్రం’ అని వివరణాత్మకంగా అనువదించడం; లేదా నైతికంగా చెడ్డదని భావించడం
  rationale: ఈ సందర్భం ఇశ్రాయేలు ఆహార వర్గీకరణకు సంబంధించినది; జంతువు నైతికంగా చెడ్డదని చెప్పడం కాదు. అయితే మూలంలోని సంక్షిప్త పదాన్ని విస్తరించకుండా ‘అపవిత్రం’గా ఉంచడం సందర్భంలోని ధార్మిక-ఆచార భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘నెమరు వేస్తుంది,’ ‘డెక్క చీలి ఉండదు’ అనే సహజ పదబంధాలతో మూలంలోని రెండు ఆహార-వర్గీకరణ ప్రమాణాలను స్పష్టంగా నిలుపుకున్నాం.
