id: LEV.11.39
reference: Leviticus 11:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: te
  text: మీరు తినదగిన పశువుల్లో ఏదైనా చనిపోతే, దాని కళేబరాన్ని తాకే వ్యక్తి సాయంత్రం వరకు అపవిత్రమవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: చనిపోతే
  rationale: וְ యొక్క అనుసంధాన భావం తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చెప్పకుండానే సందర్భబద్ధమైన షరతు వాక్యంతో సహజంగా వ్యక్తమవుతుంది; כִי యొక్క షరతు భావాన్ని ‘-తే’ నిలుపుతుంది.
- source_word: יָמוּת
  choice: చనిపోతే
  rationale: షరతు వాక్యంలో ఉన్న Qal అసంపూర్ణ క్రియను ఆధునిక తెలుగులో సహజమైన షరతు రూపంతో అనువదించాం.
- source_word: מִן הַבְּהֵמָה
  choice: పశువుల్లో ఏదైనా
  rationale: מִן ఇక్కడ భాగార్థకం; בְּהֵמָה ఈ సందర్భంలో పెంపుడు పశువుల వర్గాన్ని సూచిస్తుంది. ‘పశువుల్లో ఏదైనా’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: మీరు ఆహారంగా ఉపయోగించుకోదగిన
  rationale: ఈ పదబంధం తినడానికి అనుమతించబడిన పశువుల వర్గాన్ని గుర్తిస్తుంది. ‘ఉపయోగించుకోదగిన’ అనేది అనుమతి/యోగ్యత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַנֹּגֵעַ
  choice: తాకే వ్యక్తి
  rationale: నామవాచకంగా పనిచేసే participle‌ను లింగాన్ని అవసరం లేకుండా సూచించే సహజ తెలుగు రూపంలో అందించాం.
- source_word: בְּנִבְלָתָהּ
  choice: దాని కళేబరాన్ని
  rationale: נְבֵלָה సహజంగా చనిపోయిన జంతువు శరీరాన్ని సూచిస్తుంది; ‘కళేబరం’ శుద్ధి నియమాల సందర్భంలో సంక్షిప్తమైన, గౌరవప్రదమైన పదం.
- source_word: יִטְמָא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: క్రియ ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. తెలుగు న్యాయవాక్య శైలిలో ‘ఉంటాడు’ నిర్దేశిత ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: హీబ్రూ న్యాయసూత్రంలోని కాలపరిమితిని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יִטְמָא సూచించే అపవిత్రత స్వభావం
  choice: ‘అపవిత్రుడిగా’ అని అనువదించి ఆచారపరమైన శుద్ధి సందర్భాన్ని పదప్రయోగంలో నిలిపాం.
  alternative: ‘అశుద్ధుడిగా’ లేదా ‘మైలపడినవాడిగా’
  rationale: ఇది నైతిక దోషాన్ని ప్రకటించడం కాక లేవీయ శుద్ధి నియమాల్లోని ఆచారపరమైన స్థితి. ‘అపవిత్రుడు’ తెలుగు బైబిలు పరిభాషలో ఈ భేదాన్ని తగినంతగా మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, లేవీయ న్యాయవాక్యానికి తగిన గంభీరతను నిలిపాం. మూలంలోని అర్థాన్ని ప్రధాన పాఠ్యంలోనే సహజంగా వ్యక్తం చేయగలిగినందున పాదటిప్పణి అవసరం కాలేదు.
