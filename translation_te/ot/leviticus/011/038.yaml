id: LEV.11.38
reference: Leviticus 11:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: te
  text: కాని విత్తనంపై నీరు పోయబడితే, వాటి కళేబరాల్లో ఏదైనా[a] దానిమీద పడితే, ఆ విత్తనం మీకు అపవిత్రమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి మృతదేహాల్లో ఏదైనా.” హీబ్రూ నְבֵלָה జంతువు కళేబరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: కాని … పడితే
  rationale: ముందటి వచనంలోని పరిస్థితికి భిన్నమైన షరతును పరిచయం చేస్తుంది; ‘కాని’ సందర్భంలోని వ్యత్యాసాన్ని, ‘పడితే’ షరతును సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: విత్తనం మీద నీళ్లు పోసినప్పుడు
  rationale: హీబ్రూ క్రియ కర్మణి రూపంలో ‘నీరు ఉంచబడడం/పోయబడడం’ అని ఉన్నా, తెలుగులో ఈ సందర్భానికి ‘నీళ్లు పోసినప్పుడు’ సహజంగా ఉండి విత్తనం తడిసిన స్థితిని తెలియజేస్తుంది.
- source_word: מִנִּבְלָתָם
  choice: వాటి కళేబరంలో కొంత
  rationale: מִן‌ను భాగార్థకంగా తీసుకొని, జంతు కళేబరంలోని ఏదో భాగం పడడాన్ని వ్యక్తం చేస్తుంది. ‘కళేబరం’ జంతువుల మృతదేహాన్ని సూచించే గౌరవప్రదమైన, శుద్ధి ధర్మశాస్త్ర సందర్భానికి తగిన పదం.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన זֶרַע (‘విత్తనం’) వైపు తిరిగి సూచిస్తుంది.
- source_word: טָמֵא הוּא לָכֶם
  choice: అది మీకు అపవిత్రం
  rationale: ఇది నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా ఆచారపరమైన అపవిత్ర స్థితిని ప్రకటించే సూత్రబద్ధమైన వాక్యం; לָכֶםను ‘మీకు’గా నిలుపుతుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ఆచారపరమైన అపవిత్రతను సూచించే ‘అపవిత్రం’
  alternative: మలినం / కలుషితం
  rationale: లేవీయకాండంలోని ఈ నియమం నైతిక అపరాధం కంటే శుద్ధి-అశుద్ధి స్థితిని వివరిస్తుంది; ‘అపవిత్రం’ ఆ ధర్మశాస్త్ర వర్గాన్ని స్పష్టంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే న్యాయవాక్య శైలిని ఉపయోగించాం. ‘నీళ్లు’ సహజ వాడుకను, ‘కళేబరం’ మరియు ‘అపవిత్రం’ గంభీరమైన ధర్మశాస్త్ర పదజాలాన్ని సమతుల్యం చేస్తాయి.
