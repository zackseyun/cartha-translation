id: LEV.11.33
reference: Leviticus 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: te
  text: వాటిలో ఏదైనా ఒకటి ఏ మట్టి పాత్రలో పడినా, దానిలో ఉన్నదంతా అపవిత్రమవుతుంది; ఆ పాత్రను మీరు పగులగొట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: మట్టి పాత్ర
  rationale: כְּלִי అనేది వస్తువు లేదా పాత్రను సూచిస్తుంది; חֶרֶשׂ కాల్చిన మట్టి/కుమ్మరి మట్టితో చేసినదని నిర్దిష్టం చేస్తుంది. ఆధునిక తెలుగులో ‘మట్టి పాత్ర’ సహజంగా ఉండి, ఆచారపరంగా ముఖ్యమైన పాత్ర పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִפֹּל מֵהֶם
  choice: వాటిలో ఏదైనా ఒకటి ... పడితే
  rationale: బహువచన సర్వనామం ముందరి సందర్భంలో చెప్పిన ప్రాణుల మృతదేహాలను సూచిస్తుంది. ‘ఏదైనా ఒకటి’ అనే ప్రయోగం వాటిలో ఒక్కటి పడినా ఈ నియమం వర్తిస్తుందనే విభజనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל תּוֹכוֹ
  choice: మట్టి పాత్రలో
  rationale: תּוֹךְ పాత్ర లోపలి భాగాన్ని సూచిస్తుంది. తెలుగులో ‘పాత్రలో పడితే’ అనడం లోపలికి ప్రవేశించే భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: దానిలో ఉన్నదంతా
  rationale: כֹּל యొక్క సమగ్ర భావాన్ని ‘అంతా’ నిలుపుతుంది; పాత్రలోని సమస్త విషయాలను ఇది స్పష్టంగా సూచిస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రమవుతుంది
  rationale: లేవీయకాండంలోని ఆచార శుద్ధి సందర్భంలో טמא ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. క్రియారూపం కలిగే ఫలితస్థితిని తెలియజేస్తున్నందున ‘అపవిత్రమవుతుంది’ సరైనది.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: ఆ పాత్రను మీరు పగులగొట్టాలి
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మను ముందుంచి పాత్రపైనే దృష్టి పెడుతుంది. ‘ఆ పాత్రను’ అని స్పష్టీకరించడం ఆ ఉద్ఘాటనను నిలుపుతుంది; ‘పగులగొట్టాలి’ ఆజ్ఞార్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర వచనానికి తగిన గంభీరతతో అనువదించబడింది. ‘అపవిత్రం’ అనే పదం నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా, ఈ సందర్భంలోని ఆచారపరమైన అశుద్ధ స్థితిని నిలుపుతుంది.
