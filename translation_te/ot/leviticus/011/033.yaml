review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional contamination of the vessel’s contents and the command to break the vessel. However, it does not explicitly represent the distributive force of וְכָל (“every”), which governs the earthenware vessel construction.
  naturalness: The Telugu is clear, modern, and suitably formal. Using “ఏ మట్టి పాత్రలో” naturally expresses the Hebrew generic/distributive condition without making the sentence cumbersome.
  terminology: “మట్టి పాత్ర” appropriately renders כְּלִי חֶרֶשׂ, and “అపవిత్రమవుతుంది” suitably conveys ritual impurity in this Levitical context. “పగులగొట్టాలి” is a natural rendering of the required action.
  issues:
  - severity: medium
    issue: The distributive “every earthenware vessel” is not explicit.
    rationale: “మట్టి పాత్రలో” can be read generically, but the Hebrew begins with וְכָל כְּלִי חֶרֶשׂ, specifying that the rule applies to any/every such vessel. Adding “ఏ” makes this scope clear in idiomatic Telugu.
  revised_text: వాటిలో ఏదైనా ఒకటి ఏ మట్టి పాత్రలో పడినా, దానిలో ఉన్నదంతా అపవిత్రమవుతుంది; ఆ పాత్రను మీరు పగులగొట్టాలి.
  revised_footnotes: []
  revision_rationale: The revision adds “ఏ” before “మట్టి పాత్రలో” to preserve the Hebrew distributive scope (“every earthenware vessel”) while retaining natural modern Telugu. No footnote is needed, since “మట్టి పాత్ర” is clear and the English lexical-alternative note is not required for source fidelity in this Telugu rendering.
