  to: వాటిలో ఏదైనా ఒకటి ఏ మట్టి పాత్రలో పడినా, దానిలో ఉన్నదంతా అపవిత్రమవుతుంది; ఆ పాత్రను మీరు పగులగొట్టాలి.
