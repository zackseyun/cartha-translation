review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the divine name, the reflexive commands, the repeated holiness terminology, and the prohibition against self-defilement. However, “పవిత్రపరచుకొని” can suggest making oneself holy rather than the reflexive consecration/set-apart sense, and “గుంపుజీవి” is an opaque, nonstandard compound for שֶׁרֶץ.
  naturalness: The overall register is modern and clear. “గుంపుజీవి” is not idiomatic modern standard Telugu; a descriptive relative expression is clearer. “తోనూ,” rather than “వల్లా,” more directly reflects defilement in connection with the creature.
  terminology: “యాహ్వే,” “దేవుడు,” “పవిత్ర,” and “అపవిత్రం” are appropriate and consistent. “పవిత్రులుగా ప్రత్యేకించుకోండి” better carries the reflexive consecration sense without weakening the consistent use of “పవిత్ర.”
  issues:
  - severity: medium
    issue: “మిమ్మల్ని మీరు పవిత్రపరచుకొని” does not precisely express the reflexive consecration command.
    rationale: The Hitpael of קדשׁ calls the people to set/consecrate themselves apart. The draft wording can be read as a completed act of self-purification before the following command.
  - severity: medium
    issue: “గుంపుజీవి” is an unnatural and potentially unclear coined term.
    rationale: Although it seeks to preserve the swarming nuance of שֶׁרֶץ, it is not normal Telugu usage. A descriptive phrase communicates both the swarming and creeping/moving senses more naturally.
  - severity: low
    issue: “వల్లా” is less direct than an associative instrumental expression in the final prohibition.
    rationale: The Hebrew prohibits defiling oneself with/by any such creature. “జీవితోనూ” is more natural Telugu and avoids implying merely an indirect cause.
  revised_text: ఎందుకంటే నేను మీ దేవుడైన యాహ్వేను. కాబట్టి మిమ్మల్ని మీరు పవిత్రులుగా ప్రత్యేకించుకొని[a] పవిత్రులుగా ఉండండి; ఎందుకంటే నేను పవిత్రుణ్ణి. భూమిమీద గుంపులుగా విస్తరించి ప్రాకే ఏ జీవితోనూ మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు[b].
