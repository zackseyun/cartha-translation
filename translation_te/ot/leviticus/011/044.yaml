source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: te
  text: ఎందుకంటే నేను మీ దేవుడైన యాహ్వేను. కాబట్టి మిమ్మల్ని మీరు పవిత్రులుగా ప్రత్యేకించుకొని[a] పవిత్రులుగా ఉండండి; ఎందుకంటే నేను పవిత్రుణ్ణి. భూమిమీద గుంపులుగా విస్తరించి ప్రాకే ఏ జీవితోనూ మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని మీరు పవిత్రపరచుకోండి.” హీబ్రూ క్రియ ఆత్మార్థక రూపంలో ఉంది; తమను తాము పవిత్రత కోసం ప్రత్యేకించుకోవడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమిమీద కదిలే ఏ ప్రాకే జీవితోనూ మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు.” హీబ్రూ పదం గుంపులుగా విస్తరించే లేదా కదిలే చిన్న జీవులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: మిమ్మల్ని మీరు పవిత్రపరచుకొని
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని స్పష్టంగా ఉంచుతూ, తమను తాము పవిత్రత కోసం ప్రత్యేకించుకోవాలనే ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: పవిత్రులుగా ఉండండి
  rationale: ప్రజలకు ఉద్దేశించిన ఆజ్ఞాత్మక బలాన్ని నిలుపుతూ, తదుపరి వాక్యంలోని దేవుని పవిత్రతతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: קָדוֹשׁ
  choice: పవిత్రుడు / పవిత్రులు
  rationale: దేవుని స్వభావానికీ ప్రజల బాధ్యతకీ మధ్య ఉన్న ఒకే קדשׁ పదకుటుంబ సంబంధాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు
  rationale: נפשׁותיכםను ఇక్కడ ‘ఆత్మలను’ అని విడిగా అనువదించడం వల్ల కలిగే అనవసర శరీర–ఆత్మ ద్వైతార్థాన్ని నివారించి, మొత్తం వ్యక్తిని సూచించే ఆత్మార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַשֶּׁרֶץ הָרֹמֵשׂ
  choice: కదలాడే గుంపుజీవి
  rationale: שׁרץలోని గుంపులుగా విస్తరించే లేదా కదిలే జీవుల భావాన్నీ, רמשׂలోని నేలపై కదలికనూ సాధ్యమైనంత సంక్షిప్తంగా వేరు చేసి చూపుతుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: భూమి లేదా నేలపై కదిలే భూచర జీవులను సూచించే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: దేవుని పవిత్రతకు ప్రజల పవిత్రతకు ఉన్న సంబంధం
  choice: రెండు చోట్లా ‘పవిత్ర’ పదాన్నే నిలుపడం
  alternative: ప్రజల విషయంలో ‘ప్రత్యేకించబడినవారు’ అని అనువదించడం
  rationale: ఇశ్రాయేలు పవిత్రంగా ఉండాలనే ఆజ్ఞకు దేవుని స్వీయ పవిత్రతే ఆధారం. ఒకే పదకుటుంబాన్ని నిలపడం ఈ ఉద్దేశపూర్వక theological సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: נַפְשֹׁתֵיכֶם యొక్క మానవశాస్త్రీయ భావం
  choice: ‘మిమ్మల్ని మీరు’
  alternative: ‘మీ ఆత్మలను’ లేదా ‘మీ ప్రాణాలను’
  rationale: ఈ సందర్భంలో నెఫెష్ మొత్తం వ్యక్తిని సూచిస్తుంది; శరీరానికి వేరైన ఆత్మ గురించి వాక్యం ప్రత్యేక సిద్ధాంత ప్రకటన చేయడం లేదు.
- issue: నిషేధ ఆజ్ఞ యొక్క బలం
  choice: ‘అపవిత్రం చేసుకోకూడదు’
  alternative: ‘అపవిత్రం చేసుకోవద్దు’
  rationale: హీబ్రూ లో + అసంపూర్ణ క్రియలోని స్థిరమైన నిషేధ బలాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు శైలిలో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘యాహ్వే’ అనే వ్యక్తిగత నామాన్ని నిలిపాం. ‘పవిత్ర’ అనే కీలక పదాన్ని దేవునికీ ప్రజలకీ ఒకే విధంగా వాడి మూలంలోని పదబంధ సంబంధాన్ని కాపాడాం; ‘గుంపుజీవి’ అరుదైనప్పటికీ שׁרץ యొక్క ప్రత్యేక భావాన్ని సంక్షిప్తంగా మోస్తుంది, అందుకే సాధారణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
