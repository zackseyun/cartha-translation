revisions:
- from: ఎందుకంటే నేనే మీ దేవుడైన యాహ్వేను. కాబట్టి మిమ్మల్ని మీరు పవిత్రపరచుకొని[a] పవిత్రులుగా ఉండండి; ఎందుకంటే నేను పవిత్రుణ్ణి. భూమిమీద కదలాడే ఏ గుంపుజీవి వల్లా మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు[b].
  to: ఎందుకంటే నేను మీ దేవుడైన యాహ్వేను. కాబట్టి మిమ్మల్ని మీరు పవిత్రులుగా ప్రత్యేకించుకొని[a] పవిత్రులుగా ఉండండి; ఎందుకంటే నేను పవిత్రుణ్ణి. భూమిమీద గుంపులుగా విస్తరించి ప్రాకే ఏ జీవితోనూ మిమ్మల్ని మీరు అపవిత్రం చేసుకోకూడదు[b].
  rationale: 'The revision retains the source’s syntax and theological linkage: Yahweh is Israel’s God; the people must consecrate themselves and be holy because he is holy; and they must not defile themselves in relation to any swarming, ground-moving creature. It replaces an ambiguous consecration expression and an unnatural creature term with clearer modern Telugu while preserving the Hebrew’s twofold description through the main text and note.'
  reviewer_model: gpt-5.6-terra
