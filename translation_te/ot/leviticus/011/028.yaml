  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: te
  text: వాటి కళేబరాన్ని మోసే వ్యక్తి తన బట్టలు ఉతుక్కోవాలి; ఆ వ్యక్తి సాయంత్రం వరకు అపవిత్రంగా ఉంటాడు.[a] అవి మీకు అపవిత్రమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి కళేబరాలను.” ఇక్కడ హీబ్రూ పదబంధాన్ని ప్రస్తావనలోని జంతువుల ఒక్కొక్క కళేబరాన్ని సూచిస్తున్నట్లుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: మోసేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం సాధారణ న్యాయనియమాన్ని సూచిస్తుంది; ‘మోసేవాడు’ ఆధునిక తెలుగులో సహజంగా ఆ సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: נִבְלָתָם
  choice: వాటి కళేబరాన్ని
  rationale: נְבֵלָה జంతువు మృతదేహాన్ని సూచిస్తుంది. ‘కళేబరం’ సాధారణ ‘మృతదేహం’ కంటే ఈ సందర్భంలో నిర్దిష్టంగా, గౌరవప్రదంగా ఉంటుంది; బహువచన ప్రత్యయం ‘వాటి’గా నిలుపబడింది.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కోవాలి
  rationale: న్యాయసందర్భంలోని అసంపూర్ణ క్రియ విధిని సూచిస్తుంది. ‘ఉతుక్కోవాలి’ ఆ ఆజ్ఞాత్మక బాధ్యతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: ఇది ఆచారపరమైన స్థితిని తెలియజేస్తుంది; పురుష ఏకవచన కర్తకు అనుగుణంగా ‘అపవిత్రుడిగా ఉంటాడు’ అని అనువదించబడింది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని తెలుగులో సహజంగా, మూలార్థానికి దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: అవి మీకు అపవిత్రమైనవి
  rationale: ముందు ప్రస్తావించిన జంతువుల ఆచారపరమైన స్థితిని సంగ్రహిస్తుంది; לָכֶם యొక్క సంబంధార్థం ‘మీకు’గా నిలుపబడింది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రత పదజాలం
  choice: అపవిత్రుడు / అపవిత్రమైనవి
  alternative: అశుద్ధుడు / అశుద్ధమైనవి
  rationale: లేవీయకాండంలోని טמא నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా ఆచారపరమైన స్థితిని తెలియజేస్తుంది. ‘అపవిత్ర’ అనే పదం ఆ సాంకేతిక వర్గాన్ని స్థిరంగా నిలుపుతుంది.
- issue: נִבְלָתָם లో ఏకవచన నామవాచకం, బహువచన ప్రత్యయం
  choice: వాటి కళేబరాన్ని
  alternative: వాటి కళేబరాలను
  rationale: హీబ్రూ రూపంలోని ఏకవచన ‘కళేబరం’ మరియు బహువచన ‘వాటి’ మధ్య ఉన్న నిజమైన నిర్మాణాత్మక ఉద్రిక్తతను ప్రధాన పాఠంలో నిలిపి, విభజనాత్మక బహువచన అవగాహనను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ ఉంది. ‘బట్టలు ఉతుక్కోవాలి’ సహజ వాడుకను, ‘అపవిత్ర’ లేవీయకాండపు కీలక ఆచారపరమైన పదజాల స్థిరత్వాన్ని కాపాడుతుంది.
