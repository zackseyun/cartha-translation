  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: te
  text: చీలిన గిట్టలు ఉండి, ఆ గిట్టలు పూర్తిగా రెండుగా విడిపోయి[a], నెమరు వేసే[b] ఏ జంతువునైనా మీరు తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గిట్టను చీల్చేది, గిట్టలలో చీలికను చీల్చేది.” నిజంగా పూర్తిగా విడిపోయిన గిట్టను సూచించడానికి హెబ్రీలో ఒకే మూలానికి చెందిన రెండు ప్రయోగాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నెమరును పైకి తెచ్చేది”; అంటే, నెమరు వేసేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ఏ ... అయినా
  rationale: తరువాత పేర్కొన్న లక్షణాలన్నీ గల జంతువుల వర్గాన్ని సమగ్రంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: చీలిన గిట్టలు ఉండి
  rationale: గిట్ట చీలి ఉండడమనే శరీర లక్షణాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: ఆ గిట్టలు పూర్తిగా రెండుగా విడిపోయి
  rationale: ముందటి గిట్టల ప్రస్తావనను మరింత నిర్దిష్టం చేసే హెబ్రీ సమానమూల పదాల బలాన్ని నిలుపుతూ, గిట్ట పూర్తిగా రెండు భాగాలుగా విడిపోవాలని స్పష్టం చేస్తుంది.
- source_word: מַעֲלַת גֵּרָה
  choice: నెమరు వేసే
  rationale: అక్షరార్థంగా ‘నెమరును పైకి తెచ్చే’ అనే హెబ్రీ జాతీయాన్ని, సాధారణ పాఠకులకు తెలిసిన సహజ తెలుగు సమానార్థకంతో వ్యక్తం చేస్తుంది.
- source_word: בַּבְּהֵמָה
  choice: జంతువు
  rationale: ఆహార నియమాల సందర్భంలో భూజంతువుల వర్గాన్ని సూచిస్తుంది; ‘పశువు’ అనడం పెంపుడు జంతువులకే పరిమితమయ్యే అవకాశం ఉంది.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: మీరు తినవచ్చు
  rationale: ఇక్కడ క్రియ తినమనే ఆజ్ఞకన్నా ఆహారంగా అనుమతించబడినదాన్ని సూచిస్తుంది; అందువల్ల న్యాయపరమైన అనుమతి భావాన్ని సహజంగా తెలియజేస్తుంది.
