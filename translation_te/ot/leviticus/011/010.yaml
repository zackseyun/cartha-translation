  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: te
  text: అయితే సముద్రాల్లోను నదుల్లోను[b] రెక్కలు మరియు పొలుసులు లేనివన్నీ—నీటిలో గుంపులుగా కదిలే జీవులన్నిటిలోనూ, నీటిలో ఉండే ప్రాణులన్నిటిలోనూ—మీకు అసహ్యమైనవి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీకు హేయమైనవి.’ ఇక్కడి హెబ్రీ నామవాచకం ఆహార నియమాల సందర్భంలో ఆచారపరంగా అసహ్యమైనదాన్ని లేదా వర్జ్యమైనదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నదులు’ అనే పదాన్ని సందర్భానుసారం ‘వాగులు’ లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగుమార్గాలు అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: అయితే ... అన్నీ
  rationale: ముందటి వచనంలోని తినదగిన జలచరాలకు విరుద్ధమైన వర్గాన్ని పరిచయం చేస్తుంది; ‘అయితే’ సందర్భంలోని వ్యతిరేక భావాన్ని, ‘అన్నీ’ సమగ్రతను తెలియజేస్తాయి.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: లేనివన్నీ
  rationale: అవసరమైన లక్షణాలు వాటికి లేవనే సంబంధవాక్య భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: రెక్కలు, పొలుసులు
  rationale: అనుమతించబడిన జలచరాలకు అవసరమైన రెండు శరీర లక్షణాలను సూచిస్తుంది; హెబ్రీలోని సంయుక్త భావాన్ని నిలుపుతుంది.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: సముద్రాల్లోను ప్రవాహాల్లోను
  rationale: יַמִּים కు ‘సముద్రాలు’ సరిపోతుంది; נְחָלִים ప్రవహించే నీటిమార్గాలను విస్తృతంగా సూచించగలదని ‘ప్రవాహాలు’ సహజంగా తెలియజేస్తుంది.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: నీటిలో గుంపులుగా కదిలే జీవులన్నిటిలోనూ
  rationale: שֶׁרֶץ లోని గుంపులుగా కదలడం లేదా విస్తరించి ఉండడం అనే భావాన్ని నిలుపుతూ, ‘వస్తువులు’ అనే అసహజ పదానికి బదులు జీవులనే సందర్భోచితంగా స్పష్టం చేస్తుంది.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: నీటిలో ఉండే ప్రాణులన్నిటిలోనూ
  rationale: נֶפֶשׁ הַחַיָּה అనే విస్తృత జీవవాచకాన్ని సహజ తెలుగులో ‘ప్రాణులు’గా అందిస్తుంది; ‘ఆత్మ’ అని అనువదించి అనవసరమైన తాత్త్విక భావాన్ని రప్పించదు.
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: మీకు అసహ్యమైనవి
  rationale: ఇది ఇశ్రాయేలీయుల ఆహార నియమాల్లో ఆచారపరంగా జుగుప్సాకరమైన లేదా వర్జ్యమైన స్థితిని సూచిస్తుంది. ‘అసహ్యమైనవి’ బలమైన భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది; నామవాక్యంలోని వర్తమాన స్థితిని కాపాడుతుంది.
theological_decisions:
- issue: ఆహార నియమంలో שֶׁקֶץ అనే ఆచారపరమైన స్థితి
  choice: అసహ్యమైనవి
  alternative: హేయమైనవి; మీకు అసహ్యం
  rationale: ఈ పదం ఇక్కడ సాధారణ నైతిక తీర్పుకన్నా నిబంధనాత్మక ఆహార వర్గీకరణను సూచిస్తుంది. ‘అసహ్యమైనవి’ దాని బలాన్ని నిలుపుతుంది; అయితే ఆచారపరమైన సందర్భాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని సమగ్ర వర్గీకరణను, రెండు సమాంతర భాగాలను డాష్‌లతో స్పష్టం చేశాం. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
