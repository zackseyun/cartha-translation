- from: అయితే సముద్రాల్లోను ప్రవాహాల్లోను రెక్కలు, పొలుసులు లేనివన్నీ—నీటిలో గుంపులుగా కదిలే జీవులన్నిటిలోనూ, నీటిలో ఉండే ప్రాణులన్నిటిలోనూ—మీకు అసహ్యమైనవి[a].[b]
