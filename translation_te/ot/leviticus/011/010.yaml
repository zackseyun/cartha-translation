  terminology: ‘రెక్కలు మరియు పొలుసులు’ is retained as standard Telugu wording for fins and scales in this context. ‘అసహ్యమైనవి’ suitably conveys the dietary/ritual classification of שֶׁקֶץ; its contextual sense is clarified in the footnote without imposing a doctrinal interpretation.
  issues:
