revisions:
- from: రెక్కలుగల గుంపులుగా కదిలే జీవులన్నిటిలో నాలుగు కాళ్లతో నడిచేవి మీకు అసహ్యమైనవి[a][b][c].
  to: నాలుగు కాళ్లతో నడిచే రెక్కలుగల, గుంపులుగా కదిలే జీవులన్నీ మీకు అసహ్యమైనవి[a][b][c].
  rationale: The revision restores a direct, comprehensive legal assertion corresponding to the Hebrew syntax, while keeping the intended broad reference to winged swarming creatures. It also corrects the cultural footnote’s description of the subsequent exception from flight to hopping.
