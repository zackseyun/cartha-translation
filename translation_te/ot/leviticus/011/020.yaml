  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: te
  text: నాలుగు కాళ్లతో నడిచే రెక్కలుగల, గుంపులుగా కదిలే జీవులన్నీ మీకు అసహ్యమైనవి[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గుంపులుగా కదిలే ఎగిరే జీవులు.’ ఇక్కడి హీబ్రూ పదం పక్షులనే కాకుండా ఎగిరే జీవులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నాలుగింటిపై నడిచేవి.’ ఇది నాలుగు కాళ్ల ఆధారంగా కదలడాన్ని సూచిస్తుంది; అయితే తరువాతి వచనాలు దూకడానికి ప్రత్యేకంగా ఏర్పడిన కాళ్లుగల కొన్ని పురుగులను మినహాయిస్తాయి.
    reason: cultural_note
  - marker: c
    text: లేదా ‘మీకు హేయమైనవి.’ ఇక్కడి పదం ఆహార నియమాల్లో ఆచారపరంగా అసహ్యమైనవిగా పరిగణించబడే వాటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: అన్నిటిలో
  rationale: ఈ న్యాయవాక్యం సూచించే జీవుల వర్గమంతటినీ సమగ్రంగా చేర్చుతుంది; తెలుగు వాక్య నిర్మాణంలో ‘జీవులన్నిటిలో’ సహజంగా ఉంటుంది.
- source_word: שֶׁרֶץ
  choice: గుంపులుగా కదిలే జీవులు
  rationale: ఈ పదం చిన్నగా ఉండి గుంపులుగా కదిలే లేదా విస్తరించే జీవులను సూచిస్తుంది. కేవలం ‘పాకే జీవులు’ అని అనడం ఎగిరే పురుగుల సందర్భంలో తప్పుదారి పట్టించవచ్చు.
- source_word: הָעוֹף
  choice: రెక్కలుగల
  rationale: ఈ సందర్భంలో עוֹף పక్షులకు మాత్రమే పరిమితం కాకుండా ఎగిరే పురుగులను కూడా కలుపుతుంది. ‘రెక్కలుగల’ అనే విశేషణం ఆ విస్తృతిని నిలుపుతుంది.
- source_word: הַהֹלֵךְ
  choice: నడిచేవి
  rationale: కర్తరి వర్తమాన కృదంతం ఈ జీవుల సాధారణ సంచార విధానాన్ని తెలియజేస్తుంది.
- source_word: עַל אַרְבַּע
  choice: నాలుగు కాళ్లతో
  rationale: హీబ్రూ అక్షరార్థంగా ‘నాలుగింటిపై’ అని ఉంది; సందర్భంలో అది నాలుగు కాళ్ల ఆధారంగా కదలడాన్ని సూచిస్తుంది.
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనవి
  rationale: ఆహార శుద్ధి నియమాల సందర్భంలో ఈ పదం ఆచారపరంగా అసహ్యంగా, నిషిద్ధంగా పరిగణించేదాన్ని సూచిస్తుంది; సాధారణ అపవిత్రతకు వాడే పదంతో దీనిని కలపదు.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఇశ్రాయేలీయులు ఈ జీవులను ఎలా పరిగణించాలో తెలిపే సంబంధార్థక దత్తివాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: שֶׁקֶץ పదంలోని ఆచారపరమైన భావం
  choice: అసహ్యమైనవి
  alternative: హేయమైనవి / నిషిద్ధమైనవి
  rationale: మూలపదంలోని బలమైన విరక్తి భావాన్ని నిలుపుతూ, దానిని స్వతహాగా నైతిక దుష్టత్వంగా మార్చకుండా ఆహార నియమాల సందర్భంలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘రెక్కలుగల’ అని వాడటం ద్వారా పక్షులకే పరిమితం కాని మూలపద విస్తృతిని కాపాడాం.
