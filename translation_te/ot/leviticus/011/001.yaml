id: LEV.11.1
reference: Leviticus 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֥ר אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేకు, అహరోనుకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సాధారణంగా ‘యాహ్వే’గా లిప్యంతరీకరిస్తారు; సంప్రదాయ అనువాదాల్లో ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని, దాని లిప్యంతరీకరణను, సంప్రదాయ బిరుదు-అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: దైవిక సంభాషణను పరిచయం చేసే సాధారణ కథన క్రియ; ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని అధికారిక శైలిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరూ సంబోధితులని స్పష్టంగా చూపుతూ, పునరుక్త సంబంధ సూచనను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- source_word: לֵאמֹר אֲלֵהֶם
  choice: ఇలా మాట్లాడాడు
  rationale: ‘చెప్పడానికి/వారితో చెప్పుతూ’ అనే మూల సూత్రప్రయోగాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది; తరువాతి మాటలు ఇద్దరికీ ఉద్దేశించినవనే భావం సందర్భంలో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపాన్ని నిలిపాం; తెలుగులో పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించి, మూల అక్షరరూపం మరియు సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యాంతంలోని ద్విబిందువు తరువాత వచ్చే దైవిక ఆదేశానికి సహజ పరిచయంగా పనిచేస్తుంది.
