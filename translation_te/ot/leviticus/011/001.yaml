revisions:
- from: 'యెహోవా[a] మోషేతో, అహరోనుతో ఇలా మాట్లాడాడు:'
  to: 'యాహ్వే[a] మోషేకు, అహరోనుకు ఇలా చెప్పాడు:'
  rationale: The revision aligns the divine name with the POB source decision (‘Yahweh’), replaces an ambiguous associative postposition with clear dative addressee marking, and retains the concise formulaic introduction and colon that introduce the following speech. ‘ఇలా చెప్పాడు’ naturally represents the Hebrew speech formula לֵאמֹר אֲלֵהֶם without adding content.
