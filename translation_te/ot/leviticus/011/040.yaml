source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: te
  text: దాని కళేబరంలోని కొంత భాగాన్ని తినేవాడు తన బట్టలు ఉతుక్కోవాలి; అతడు సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.[a][b] దాని కళేబరాన్ని మోసేవాడు తన బట్టలు ఉతుక్కోవాలి; అతడు సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని కళేబరం నుండి’ లేదా ‘దాని కళేబరంలోని కొంత భాగం’; హీబ్రూ పదబంధం భాగార్థకంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఇశ్రాయేలు ఆచారశుద్ధి నియమాల ప్రకారం అపవిత్రుడు.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: తినే వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం ఏ వ్యక్తికైనా వర్తించే న్యాయపరమైన కర్తను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తినే వ్యక్తి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִנִּבְלָתָהּ
  choice: దాని కళేబరంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది—కళేబరం నుండి లేదా దానిలో కొంత తినడాన్ని సూచిస్తుంది. ‘కొంత’ ఆ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִבְלָתָהּ
  choice: దాని కళేబరం
  rationale: ఈ సందర్భంలో נְבֵלָה మానవ శవాన్ని కాక చనిపోయిన జంతువు కళేబరాన్ని సూచిస్తుంది; ‘కళేబరం’ గౌరవప్రదమైన, ఖచ్చితమైన పదం.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: తన బట్టలు ఉతుక్కోవాలి
  rationale: ధర్మశాస్త్ర సందర్భంలోని అసంపూర్ణ క్రియ ఆదేశాత్మక బాధ్యతను తెలియజేస్తుంది. ‘ఉతుక్కోవాలి’ ఆధునిక తెలుగులో సహజమైన విధి ప్రకటన.
- source_word: וְטָמֵא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: ఈ వాక్యం ఆ చర్య వల్ల కలిగే శుద్ధి-అశుద్ధి స్థితిని తెలుపుతుంది. మూలంలో లేని ‘ఆచారపరంగా’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: హీబ్రూ కాలపరిమితిని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הַנֹּשֵׂא
  choice: మోసే వ్యక్తి
  rationale: ఇది కూడా సాధారణంగా వర్తించే నామవాచక కృదంతం; మొదటి భాగంలోని ‘తినే వ్యక్తి’తో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: אֶת נִבְלָתָהּ
  choice: దాని కళేబరాన్ని
  rationale: ప్రత్యక్ష కర్మతో కూడిన స్వామ్యప్రత్యయాన్ని తెలుగులో సరళంగా, ఖచ్చితంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘అపవిత్రుడిగా’ అని మాత్రమే అనువదించడం
  alternative: ‘ఆచారపరంగా అపవిత్రుడిగా’
  rationale: సందర్భం ఇశ్రాయేలు ఆచారశుద్ధి నియమాలకు సంబంధించినదైనా, טָמֵאలో లేని వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో కలపకుండా మూలపాఠ్య సంక్షిప్తతను నిలిపి, సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
- issue: న్యాయవాక్యంలోని వ్యాకరణ లింగం
  choice: హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని అనుసరించి ‘వ్యక్తి… అతడు… తన’ అని ఉంచడం
  alternative: బహువచన లేదా లింగనిరపేక్ష పునర్నిర్మాణం
  rationale: హీబ్రూలోని ఏకవచన న్యాయసూత్ర రూపాన్ని, రెండు భాగాల సమాంతరతను నిలిపాం; ఇది నియమం వర్తించే వ్యక్తిని సాధారణంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కానీ గంభీరమైన ధర్మశాస్త్ర శైలిని వాడాం. ‘కళేబరం’ సందర్భానికి ఖచ్చితమైన పదం; ‘బట్టలు ఉతుక్కోవాలి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ఆదేశాత్మక భావాన్ని నిలుపుతుంది. పాదటిప్పణి గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత మొదటి వాక్యం తరువాత ఉంచబడ్డాయి.
