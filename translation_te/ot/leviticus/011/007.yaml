- from: పంది విషయానికి వస్తే, దాని డెక్క చీలి, పూర్తిగా రెండు భాగాలుగా విడిపోయి ఉంటుంది; అయితే అది నెమరు వేయదు. అది మీకు అపవిత్రం.
  to: పంది డెక్క చీలి పూర్తిగా రెండు భాగాలుగా విడిపోయి ఉన్నా, అది నెమరు వేయదు కాబట్టి అది మీకు అపవిత్రమైనది.
