review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the pig, the split hoof, cud-chewing, and the ritual/dietary force of ‘unclean.’ However, ‘పంది విషయానికి వస్తే’ replaces the source’s explanatory/contrastive construction with a mere topic shift. The Hebrew presents the animal as having a fully split hoof yet not chewing cud; the revision retains that contrast explicitly.
  naturalness: ‘డెక్క’ and ‘నెమరు వేయదు’ are natural modern standard Telugu. A concessive clause (‘ఉన్నా’) gives the sentence a clear and idiomatic Telugu flow while preserving the source contrast.
  terminology: ‘పంది’ is the appropriate common term for הַחֲזִיר. ‘అపవిత్రమైనది’ suitably conveys טָמֵא in this dietary-law context without moralizing it. ‘నెమరు వేయదు’ accurately expresses the idiomatic sense of גֵּרָה לֹא יִגָּר.
  issues:
  - severity: medium
    issue: The causal/contrastive syntax is weakened.
    rationale: ‘పంది విషయానికి వస్తే’ only introduces a topic, whereas the Hebrew explains that although the pig has the split-hoof characteristic, it does not chew cud and is therefore unclean. A concessive Telugu construction preserves this relationship.
  revised_text: పంది డెక్క చీలి పూర్తిగా రెండు భాగాలుగా విడిపోయి ఉన్నా, అది నెమరు వేయదు కాబట్టి అది మీకు అపవిత్రమైనది.
  revised_footnotes: []
