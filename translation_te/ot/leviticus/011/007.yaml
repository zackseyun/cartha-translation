id: LEV.11.7
reference: Leviticus 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְ/שֹׁסַ֥ע שֶׁ֨סַע֙ פַּרְסָ֔ה וְ/ה֖וּא גֵּרָ֣ה לֹֽא יִגָּ֑ר טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: te
  text: పంది డెక్క చీలి పూర్తిగా రెండు భాగాలుగా విడిపోయి ఉన్నా, అది నెమరు వేయదు కాబట్టి అది మీకు అపవిత్రమైనది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲזִיר
  choice: పంది
  rationale: హీబ్రూ పదం ఈ జంతుజాతిని సాధారణంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన, అందరికీ అర్థమయ్యే పదం.
- source_word: כִּי
  choice: విషయానికి వస్తే
  rationale: ఇక్కడ జాబితాలోని తదుపరి జంతువును పరిచయం చేసి, దాని లక్షణాల ఆధారంగా వర్గీకరణను వివరిస్తుంది; తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: מַפְרִיס פַּרְסָה וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: దాని డెక్క చీలి, పూర్తిగా రెండు భాగాలుగా విడిపోయి ఉంటుంది
  rationale: హీబ్రూలోని రెండు సమన్విత వర్ణనలు చీలిన డెక్కను బలంగా, నిర్దిష్టంగా పేర్కొంటాయి. వాటిని పూర్తిగా కుదించకుండా సహజమైన తెలుగులో నిలిపింది.
- source_word: גֵּרָה לֹא יִגָּר
  choice: అది నెమరు వేయదు
  rationale: అక్షరార్థంగా ‘నెమరును పైకి తీసుకురాదు’; జంతువు మళ్లీ నమలడాన్ని తెలిపే సహజమైన ప్రామాణిక తెలుగు ప్రయోగం ‘నెమరు వేయడం’.
- source_word: טָמֵא הוּא לָכֶם
  choice: అది మీకు అపవిత్రం
  rationale: ఆహార నియమాల సందర్భంలోని ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; నైతిక దుష్టత్వాన్ని అనవసరంగా సూచించదు, అలాగే לָכֶם లోని ‘మీకు’ అనే సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఆహార ధర్మశాస్త్రంలో טָמֵא స్వభావం
  choice: ఆచారపరమైన/ఆహార నియమాలకు సంబంధించిన ‘అపవిత్రం’
  alternative: అశుద్ధం; కలుషితం
  rationale: లేవీయకాండము 11లో ఈ పదం ఇశ్రాయేలీయుల ఆహార మరియు పరిశుద్ధతా విభజనకు సంబంధించినది. ‘అపవిత్రం’ ఈ ధార్మిక-ఆచార వర్గాన్ని నిలుపుతూ, దాన్ని నైతిక చెడుగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ధర్మశాస్త్ర సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని చీలిన డెక్కకు సంబంధించిన పునరుక్తి భావాన్ని ‘చీలి, పూర్తిగా రెండు భాగాలుగా’ అని నిలిపాం.
