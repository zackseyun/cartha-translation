  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: te
  text: చిన్న గుడ్లగూబను,[a] నీటికాకిని, మరియు పెద్ద గుడ్లగూబను;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పక్షులు ఖచ్చితంగా ఏ జాతులకు చెందినవో తెలియదు. ‘చిన్న గుడ్లగూబ,’ ‘నీటికాకి,’ ‘పెద్ద గుడ్లగూబ’ అనేవి సంప్రదాయంలో లేదా పండితులు సూచించిన సాధ్యమైన గుర్తింపులు. כּוֹס అనే పదానికి ‘గుడ్లగూబ’ లేదా ‘కీచుగుడ్లగూబ,’ שָׁלָךְ అనే పదానికి ‘పెలికాన్,’ యַנְשׁוּף అనే పదానికి ‘కొమ్ముల గుడ్లగూబ’ లేదా ‘డేగ గుడ్లగూబ’ అనే గుర్తింపులు కూడా ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: చిన్న గుడ్లగూబ
  rationale: ఇది అపవిత్ర పక్షుల జాబితాలోని ఒక నిర్దిష్ట పక్షి పేరు; ఖచ్చితమైన జాతి తెలియకపోయినా, ‘చిన్న గుడ్లగూబ’ అనేది సాధ్యమైన ఆధునిక గుర్తింపు.
- source_word: הַשָּׁלָךְ
  choice: నీటికాకి
  rationale: ఈ పక్షి ఖచ్చితంగా ఏదో అనేది వివాదాస్పదం. నీటిలో మునిగి చేపలు పట్టే కర్మోరంట్ పక్షికి ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే పేరు ‘నీటికాకి’.
- source_word: הַיַּנְשׁוּף
  choice: పెద్ద గుడ్లగూబ
  rationale: ఇది రాత్రివేళ సంచరించే పెద్ద గుడ్లగూబ జాతిని సూచించే అవకాశం ఉంది; ఖచ్చితమైన ఆధునిక జాతిని నిర్ధారించకుండా దాని ప్రత్యేకతను ఈ పదబంధం తెలియజేస్తుంది.
- source_word: וְאֶת
  choice: ను … ను … ను
  rationale: పునరుక్త సంధి మరియు కర్మసూచకాన్ని తెలుగు జాబితా నిర్మాణానికి సహజంగా సరిపోయేలా ప్రతి పేరుకు ద్వితీయా విభక్తి ప్రత్యయం జోడించి, విరామచిహ్నాలతో చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పక్షుల జాబితాగా సహజంగా వినిపించే సంక్షిప్త నిర్మాణం వాడబడింది. ఈ వాక్యం ముందరి వచనం నుంచి కొనసాగుతున్నందున చివర సెమికోలన్ ఉంచబడింది. మూడు పక్షుల గుర్తింపుల అనిశ్చితిని ఒకే పాదసూచికలో స్పష్టంగా నిలిపాం.
