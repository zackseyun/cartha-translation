source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: te
  text: 'ఎందుకంటే, మీకు దేవుడిగా ఉండడానికి మిమ్మల్ని ఐగుప్తు దేశం నుండి పైకి తీసుకొచ్చిన[a] యెహోవాను నేనే. నేను పవిత్రుణ్ణి కాబట్టి[b] మీరు పవిత్రులుగా ఉండాలి.


    [a] లేదా, “మిమ్మల్ని ఐగుప్తు దేశం నుండి పైకి తీసుకొస్తున్న.” ఇక్కడ హెబ్రీలో వర్తమాన భావాన్ని ఇవ్వగల కృదంత రూపం ఉంది; అయితే అది గతంలో జరిగిన నిర్గమనాన్ని సూచిస్తోంది.


    [b] లేదా, “ఎందుకంటే నేను పవిత్రుణ్ణి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని ఐగుప్తు దేశం నుండి పైకి తీసుకొస్తున్న.” ఇక్కడ హెబ్రీలో వర్తమాన భావాన్ని ఇవ్వగల కృదంత రూపం ఉంది; అయితే అది గతంలో జరిగిన నిర్గమనాన్ని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే నేను పవిత్రుణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచింది; దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు.
- source_word: הַמַּעֲלֶה
  choice: పైకి తీసుకొచ్చిన
  rationale: עלה అనే ధాతువులోని ‘పైకి తీసుకురావడం’ అనే చిత్రాన్ని నిలుపుతూ, నిర్గమణం గతంలో జరిగిన సంఘటన కావడంతో తెలుగులో సహజమైన భూతకాల భావాన్ని వాడింది. హెబ్రీ కృదంత రూపం వల్ల సాధ్యమైన వర్తమాన రూపాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: హెబ్రీలో స్పష్టంగా ఉన్న ‘దేశం’ అనే నామవాచకాన్ని నిలుపుతూ నిర్గమన నిబంధనాత్మక సూత్రాన్ని కాపాడింది.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉండడానికి
  rationale: దేవుడు తన ప్రజలకు దేవుడిగా ఉండే నిబంధన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וִהְיִיתֶם
  choice: మీరు … ఉండాలి
  rationale: సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం భవిష్యత్ ప్రకటనగా పరిమితం చేయదు.
- source_word: קְדֹשִׁים / קָדוֹשׁ
  choice: పవిత్రులుగా / పవిత్రుణ్ణి
  rationale: ‘ప్రత్యేకపరచబడిన’ అనే భావాన్ని మించిన నైతిక, ఆరాధనా, నిబంధన సంబంధిత విస్తృతిని కలిగిన స్థిరమైన తెలుగు పదం ‘పవిత్ర’ను వాడింది.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: నేను పవిత్రుణ్ణి కాబట్టి
  rationale: ఇశ్రాయేలు పవిత్రతకు దేవుని పవిత్రతే కారణం లేదా ఆధారం అనే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: పవిత్రతకు నిబంధనాత్మక ఆధారం
  choice: ప్రజలు పవిత్రులుగా ఉండాలనే పిలుపును యెహోవా స్వరూపం, నిర్గమన కార్యం, మరియు ‘మీకు దేవుడిగా ఉండడం’ అనే నిబంధన సంబంధంతో అనుసంధానించింది.
  alternative: ఈ వాక్యాన్ని విస్తృత నిబంధన ప్రాధాన్యం లేని ఆహారశుద్ధి నియమంగా మాత్రమే చదవడం.
  rationale: తక్షణ సందర్భం ఆహారశుద్ధి గురించినదైనా, వాక్యమే నిర్గమనాన్ని, దేవునితో సంబంధాన్ని, ఆయన పవిత్రతను ఆజ్ఞకు ఆధారాలుగా పేర్కొంటుంది; అనువాదం దీనిని విస్తరించకుండా నిలుపుతుంది.
- issue: రెండవ כִּי యొక్క సంబంధం
  choice: కారణార్థకంగా ‘కాబట్టి’ అని అనువదించింది.
  alternative: వివరణాత్మకంగా ‘ఎందుకంటే/ఏలయనగా నేను పవిత్రుణ్ణి’ అని వాక్యాన్ని విడదీయడం.
  rationale: రెండు నిర్మాణాలూ దేవుని పవిత్రతను ప్రజల పవిత్రతకు ఆధారంగా చూపుతాయి. ప్రధాన పాఠంలో సహజ తెలుగు కారణ నిర్మాణాన్ని, పాదసూచికలో మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పైకి తీసుకొచ్చిన’ ద్వారా మూలంలోని దిశాత్మక రూపకాన్ని, ‘ఉండాలి’ ద్వారా సందర్భంలోని ఆజ్ఞాత్మక బలాన్ని నిలిపింది. దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఇచ్చింది.
