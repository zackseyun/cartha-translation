- from: వాటి కళేబరంలో ఏ భాగమైనా దేనిమీద పడుతుందో అది అపవిత్రమవుతుంది[a]. పొయ్యి అయినా వంటపీఠం అయినా దాన్ని పడగొట్టాలి; అవి అపవిత్రమైనవి, అవి మీకు అపవిత్రంగానే ఉండాలి[b].
  to: వాటి కళేబరంలోని ఏదైనా భాగం దేనిమీద పడుతుందో, అది అపవిత్రమవుతుంది[a]. పొయ్యినైనా వంటపీఠమైనా[b] వాటిని కూల్చివేయాలి; అవి అపవిత్రమైనవి, అవి మీకు అపవిత్రమైనవిగా ఉంటాయి.
