id: LEV.11.35
reference: Leviticus 11:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: te
  text: వాటి కళేబరంలోని ఏదైనా భాగం దేనిమీద పడుతుందో, అది అపవిత్రమవుతుంది[a]. పొయ్యినైనా వంటపీఠమైనా[b] వాటిని కూల్చివేయాలి; అవి అపవిత్రమైనవి, అవి మీకు అపవిత్రమైనవిగా ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘అపవిత్రం’ అనేది నైతిక చెడును కాదు, ధర్మశాస్త్రంలోని శుద్ధి-అశుద్ధతకు సంబంధించిన ఆచార స్థితిని సూచిస్తుంది.
    reason: theological_clarification
  - marker: b
    text: ‘వంటపీఠం’ అనే హెబ్రీ పదం పాత్రలు పెట్టి వండే పొయ్యి అమరికను, వంట స్టౌవును లేదా నిప్పు స్థలాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: వాటి కళేబరం
  rationale: నְבֵלָה అనేది చనిపోయిన జంతువు కళేబరాన్ని, ముఖ్యంగా శుద్ధి-అశుద్ధత నియమాల సందర్భంలో, సూచిస్తుంది. సందర్భం కళేబరంలోని ఏదైనా భాగం పడటాన్ని సూచిస్తున్నందున సహజమైన తెలుగు ప్రయోగాన్ని వాడాం.
- source_word: יִפֹּל
  choice: పడుతుందో
  rationale: న్యాయవిధి శైలిలో సాధారణంగా సంభవించే పరిస్థితిని తెలిపే అసంపూర్ణ క్రియను తెలుగులో షరతుతో కూడిన సాధారణ నియమంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָיו יִטְמָא
  choice: దేనిమీద పడుతుందో అది అపవిత్రమవుతుంది
  rationale: కళేబర భాగం పడిన వస్తువు దాని ఫలితంగా ఆచారపరంగా అపవిత్ర స్థితిలోకి వస్తుందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּנּוּר
  choice: పొయ్యి
  rationale: ఇది రొట్టెలు కాల్చే మట్టి పొయ్యిని సూచిస్తుంది; ఆధునిక సాధారణ పాఠకుడికి 'పొయ్యి' సహజమైన సమానార్థకం.
- source_word: כִירַיִם
  choice: వంటపీఠం
  rationale: ఈ పదం పాత్రలు పెట్టి వండే పురాతన వంట అమరికను సూచించవచ్చు. నిర్దిష్ట నిర్మాణాన్ని అతిగా నిర్ణయించకుండా వంటకు సంబంధించిన స్థిర అమరిక అనే భావాన్ని 'వంటపీఠం' అందిస్తుంది.
- source_word: יֻתָּץ
  choice: దాన్ని పడగొట్టాలి
  rationale: అపవిత్రమైన మట్టి వంట నిర్మాణాన్ని తప్పనిసరిగా కూల్చివేయాలనే న్యాయవిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: טְמֵאִים הֵם
  choice: అవి అపవిత్రమైనవి
  rationale: ఇది నైతిక దుష్టతను కాక ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. లేవీయకాండంలోని కీలక పదజాలానికి అనుగుణంగా 'అపవిత్రమైనవి' ఉంచాం.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: అవి మీకు అపవిత్రంగానే ఉండాలి
  rationale: לָכֶם లోని ఇశ్రాయేలీయ శ్రోతలతో సంబంధాన్ని 'మీకు' నిలుపుతుంది; 'అపవిత్రంగానే ఉండాలి' అవి వారి దృష్టిలో అలా పరిగణించబడాలనే విధి భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు ధర్మశాస్త్రంలో అపవిత్రత స్వభావం
  choice: ప్రధాన పాఠ్యంలో טמא/טמאים పదాలను 'అపవిత్రం/అపవిత్రమైనవి'గా అనువదించడం
  alternative: '''ఆచారపరంగా అపవిత్రం'' లేదా ''కర్మకాండపరంగా అపవిత్రం'''
  rationale: ఈ వచనంలోని అపవిత్రత నైతిక చెడును కాక శుద్ధి-అశుద్ధతకు సంబంధించిన ఆచార స్థితిని సూచిస్తుంది. అయితే ప్రధాన పాఠ్యంలో వివరణను చేర్చి భావాన్ని కుదించకుండా, స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి పాదసూచికలో సందర్భాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని వాడాం. పురాతన వంట నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయకుండా పదార్థంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
