  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన విధి శైలి. హీబ్రూ కుటుంబ సంబంధ వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపి, సహజమైన సమూహార్థ ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
