source:
  edition: WLC
  text: דַּבְּר֛וּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֤את הַֽ/חַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִ/כָּל הַ/בְּהֵמָ֖ה אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పండి: “భూమిమీద ఉన్న[c] జంతువులన్నిటిలో మీరు తినదగిన జీవులు ఇవి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు సంతానానికి,” లేదా “ఇశ్రాయేలీయులకు.” హీబ్రూ పదబంధానికి అక్షరార్థం “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “మీరు తినదగిన జీవి ఇది.” ఇక్కడ ఏకవచన పదం ఒక వర్గాన్ని సమష్టిగా పరిచయం చేస్తోంది కాబట్టి తెలుగులో “జీవులు ఇవి” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “నేలమీద ఉన్న జంతువులు.” ఈ పదబంధం అధ్యాయంలో తరువాత ప్రస్తావించబడే ఇతర వర్గాల నుండి భూమిపై జీవించే జంతువులను వేరుచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: చెప్పండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం; సందర్భంలో మోషే, అహరోనులను ఉద్దేశించింది. ఆధునిక తెలుగులో ‘చెప్పండి’ సహజంగా ఉండి, తరువాతి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబ సంబంధ పదబంధాన్ని సాధ్యమైనంత ప్రత్యక్షంగా నిలుపుతుంది; సమూహార్థంలో ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: హీబ్రూ ఉల్లేఖనార్థక క్రియావిశేషాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా వ్యక్తం చేస్తుంది; ‘చెప్పండి’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: זֹאת הַחַיָּה
  choice: జీవులు ఇవి
  rationale: రూపపరంగా ఏకవచనమైనప్పటికీ, ఇక్కడ חַיָּה వర్గసూచక సమష్టి భావంలో ఉండి తరువాత వచ్చే జాబితాను పరిచయం చేస్తుంది. తెలుగులో బహువచనం ఆ వర్గీకరణ భావాన్ని సహజంగా తెలియజేస్తుంది; ఏకవచన రూపాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: మీరు తినదగిన
  rationale: న్యాయవిధి సందర్భంలోని అనుమతి భావాన్ని ‘తినదగిన’ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; ఇది కేవలం భవిష్యత్ చర్యగా చెప్పదు.
- source_word: מִכָּל הַבְּהֵמָה
  choice: జంతువులన్నిటిలో
  rationale: מִן యొక్క ఎంపికాత్మక భావాన్ని ‘అన్నిటిలో’ తెలియజేస్తుంది. בְּהֵמָה ఇక్కడ భూమిమీద జీవించే జంతువుల విస్తృత వర్గాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: భూమిమీద ఉన్న
  rationale: తరువాత చెప్పబడే నీటి జీవుల నుండి నేలపై జీవించే జంతువులను వేరుచేసే స్థానసూచక పదబంధం.
