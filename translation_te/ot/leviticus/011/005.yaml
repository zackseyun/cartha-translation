source:
  edition: WLC
  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: te
  text: రాక్ హైరాక్స్[a] నెమరు వేస్తుంది గానీ, దాని డెక్క చీలినది కాదు కాబట్టి, అది మీకు అపవిత్రమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హైరాక్స్.” ఇది కొండచరియల్లో నివసించే చిన్న క్షీరదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: రాతిబొచ్చు ఎలుక
  rationale: ఈ పదం కొండచరియల్లో నివసించే చిన్న క్షీరదమైన రాక్ హైరాక్స్‌ను సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే వివరణాత్మక పేరు వాడి, శాస్త్రీయంగా మరింత ఖచ్చితమైన పేరును పాదసూచికలో ఇచ్చాం.
- source_word: כִּי
  choice: గాని (మొత్తం కారణాత్మక నిర్మాణంలో)
  rationale: హీబ్రూ כִּי జంతువు అపవిత్రంగా వర్గీకరించబడటానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం లక్షణాల మధ్య ‘గాని’ ఉంచి, ఆ రెండు లక్షణాల ఆధారంగా తుదినిర్ణయాన్ని తెలిపాం.
- source_word: מַעֲלֵה גֵרָה
  choice: నెమరు వేస్తుంది
  rationale: ‘తిరిగి ఆహారాన్ని పైకి తెస్తుంది’ అనే హీబ్రూ భావానికి సహజమైన, స్థిరపడిన తెలుగు జంతుశాస్త్ర సంబంధ పదబంధం.
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: దాని డెక్క చీలి ఉండదు
  rationale: డెక్క విభజింపబడకపోవడాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: טָמֵא
  choice: అపవిత్రం
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి-అశుద్ధి వర్గాన్ని సూచించే సాధారణ తెలుగు బైబిల్ పదం; నైతిక దుష్టత్వాన్ని సూచించదు.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఈ ఆహార నియమంలోని వర్గీకరణ సంబోధిత సమాజానికి వర్తిస్తుందని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయకాండ ఆహార నియమంలో טָמֵא స్వభావం
  choice: ఆచారపరంగా అపవిత్రం
  alternative: నైతికంగా చెడ్డది లేదా కలుషితమైనది
  rationale: లేవీయకాండం 11లో ఈ పదం ఆహార నియమవ్యవస్థలోని ఆచారపరమైన స్థితిని సూచిస్తుంది; జంతువుకు నైతిక దోషం ఉందని వచనం చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర వాక్యానికి తగిన గంభీరతతో అనువదించబడింది. జంతువు పేరులోని అపరిచితత్వాన్ని ప్రధాన పాఠ్యంలో వివరణాత్మక రూపంతో, పాదసూచికలో శాస్త్రీయ పేరుతో సమతుల్యం చేశాం.
