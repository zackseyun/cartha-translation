source:
  edition: WLC
  text: וְ/כִ֤י יִפֹּל֙ מִ/נִּבְלָתָ֔/ם עַל כָּל זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/037.yaml
  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: te
  text: వాటి కళేబరం నుండి ఏదైనా విత్తడానికి ఉంచిన ఏ విత్తనంపైనా పడితే,[a] అది శుద్ధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వాటి కళేబరాలు ఏవైనా విత్తడానికి ఉంచిన ఏ విత్తనంపైనా పడితే.” హీబ్రూ పదబంధాన్ని ‘వాటి కళేబరం నుండి ఏదైనా’ అని భాగార్థకంగా గానీ, ‘వాటి కళేబరాలు ఏవైనా’ అని సామూహిక/బహువచన భావంతో గానీ అర్థం చేసుకోవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: పడితే
  rationale: న్యాయవిధిలో కొనసాగుతున్న షరతును తెలుగులో సహజమైన ‘-తే’ రూపంతో వ్యక్తపరుస్తుంది; వావ్‌ యొక్క అనుసంధాన భావం సందర్భంలోనే స్పష్టమవుతుంది.
- source_word: יִפֹּל
  choice: పడితే
  rationale: కసూయిస్టిక్ న్యాయవాక్యంలోని అసంపూర్ణ క్రియను షరతు రూపంలో సహజంగా అందిస్తుంది.
- source_word: מִנִּבְלָתָם
  choice: వాటి కళేబరాల్లో ఏదైనా
  rationale: מִן యొక్క భాగార్థాన్ని, נְבֵלָה యొక్క చనిపోయిన జంతు కళేబరం అనే భావాన్ని నిలుపుతుంది. ఏకవచన నామానికి బహువచన ప్రత్యయం ఉన్న హీబ్రూ నిర్మాణంలోని అస్పష్టతను పాదసూచికలో సూచించాం.
- source_word: עַל
  choice: మీద
  rationale: స్థాన సంబంధాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כָּל
  choice: ఏదైనా
  rationale: షరతుతో కూడిన న్యాయసందర్భంలో పంపిణీ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: విత్తడానికి ఉంచిన విత్తనం
  rationale: విత్తనమూ విత్తడమూ అనే మూలపాఠంలోని పునరుక్త భావాన్ని అతిగా భారంగా కాకుండా, అది నాటడానికి ఉద్దేశించిన విత్తనమని స్పష్టంగా తెలుపుతుంది.
- source_word: טָהוֹר הוּא
  choice: అది శుద్ధమైనదే
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి స్థితిని సూచిస్తుంది; ‘అలాగే శుద్ధంగా ఉంటుంది’ అనే మూలంలో లేని కొనసాగింపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: טָהוֹר అనే ఆచారపరమైన వర్గీకరణ
  choice: శుద్ధమైనది
  alternative: పవిత్రమైనది
  rationale: ఈ సందర్భం నైతిక పవిత్రత గురించి కాక ఆచారపరమైన శుద్ధి గురించి; అందువల్ల ‘శుద్ధమైనది’ సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయవిధి శైలి పాటించబడింది. ‘కళేబరం’ సందర్భానికి తగిన ఖచ్చితత్వాన్ని ఇస్తుంది; ‘శుద్ధమైనదే’ ఆచారపరమైన తీర్పును సహజంగా తెలియజేస్తుంది.
