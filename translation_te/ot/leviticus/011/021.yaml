revisions:
- from: అయితే నాలుగు కాళ్లతో నడిచే ఎగిరే ప్రాణులన్నిటిలో, నేలమీద గెంతడానికి తమ పాదాల పైభాగంలో గెంతే కాళ్లు ఉన్నవాటిని[a][b] మీరు తినవచ్చు.
  to: అయితే, నాలుగు కాళ్లపై నడిచే ఎగిరే చిన్నజీవులన్నిటిలో, తమ పాదాలకు పైగా నేలమీద గెంతడానికి ఉపయోగపడే ప్రత్యేక కాళ్లు ఉన్నవాటిని[a][b] మీరు తినవచ్చు.
  rationale: సవరణ మూలంలోని శరీరనిర్మాణ సంబంధ వర్ణనను “పాదాలకు పైగా” ద్వారా మరింత ఖచ్చితంగా వ్యక్తం చేస్తుంది; שֶׁרֶץ యొక్క వర్గభావాన్ని “చిన్నజీవులు”తో నిలుపుతుంది. సాంప్రదాయ పఠనం ఆధారమైన ప్రధాన పాఠాన్ని మార్చకుండా, లిఖిత పాఠభేదాన్ని మరియు పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణుల్లో స్పష్టంగా భద్రపరుస్తుంది.
