reference: Leviticus 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: te
  text: అయితే, నాలుగు కాళ్లపై నడిచే ఎగిరే చిన్నజీవులన్నిటిలో, తమ పాదాలకు పైగా నేలమీద గెంతడానికి ఉపయోగపడే ప్రత్యేక కాళ్లు ఉన్నవాటిని[a][b] మీరు తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ లిఖిత పాఠంలో అక్షరార్థంగా ‘కాళ్లు లేనివి’ అని ఉంది; అయితే సందర్భం, సాంప్రదాయ పఠనం, ప్రాచీన అనువాదాలు ‘కాళ్లు ఉన్నవి’ అనే భావాన్ని సూచిస్తున్నాయి.
    reason: textual_variant
  - marker: b
    text: ‘ప్రత్యేక కాళ్లు’ అనే హీబ్రూ పదం నేలమీద గెంతడానికి ఉపయోగపడే ప్రత్యేకమైన వెనుక కాళ్లను సూచిస్తుంది; దీనిని ‘గెంతే కాళ్లు’ లేదా ‘కీళ్లుగల కాళ్లు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందున్న నిషేధానికి ఇక్కడ మినహాయింపు వస్తోందని సహజంగా సూచిస్తుంది.
- source_word: אֶת זֶה תֹּאכְלוּ
  choice: వాటిని మీరు తినవచ్చు
  rationale: ఏకవచన రూపం అనుమతించబడిన ఒక వర్గాన్ని పరిచయం చేస్తుంది; న్యాయసంబంధ సందర్భంలో క్రియ అనుమతిని వ్యక్తం చేస్తుంది.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: ఎగిరే ప్రాణులన్నిటిలో
  rationale: שֶׁרֶץ చిన్నగా కదిలే లేదా గుంపులుగా విస్తరించే జీవుల విస్తృత వర్గాన్ని సూచిస్తుంది; తెలుగులో అసహజమైన పదబంధాన్ని నివారిస్తూ, ఎగిరే జీవుల వర్గాన్ని స్పష్టంగా ఉంచింది.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: నాలుగు కాళ్లతో నడిచే
  rationale: మూలంలోని నాలుగు అవయవాలపై కదలడమనే వర్ణనను స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר לא/לוֹ כְרָעַיִם
  choice: గెంతే కాళ్లు ఉన్నవాటిని
  rationale: లిఖిత పాఠంలోని לֹא కంటే సందర్భం, సాంప్రదాయ పఠనం, ప్రాచీన అనువాదాలు మద్దతిచ్చే לוֹ భావాన్ని ప్రధాన పాఠంలో అనుసరించింది; כְרָעַיִם ఇక్కడ గెంతడానికి ప్రత్యేకమైన వెనుక కాళ్లను సూచిస్తుంది.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: తమ పాదాల పైభాగంలో
  rationale: ప్రత్యేక గెంతే కాళ్లు సాధారణ పాదాలకు పైన ఉన్నాయనే శరీర నిర్మాణ వర్ణనను నిలుపుతుంది.
- source_word: לְנַתֵּר בָּהֵן עַל הָאָרֶץ
  choice: నేలమీద గెంతడానికి
  rationale: ఆ ప్రత్యేక కాళ్ల ప్రయోజనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సాధనార్థక సర్వనామ భావం సందర్భంలో అంతర్భూతంగా ఉంది.
theological_decisions:
- issue: లిఖిత పాఠం לֹא (‘లేవు/కాదు’) మరియు సాంప్రదాయ పఠనం לוֹ (‘దానికి ఉన్నాయి’) మధ్య పాఠభేదం
  choice: ప్రధాన పాఠంలో ‘ఉన్నవాటిని’
  alternative: ‘కాళ్లు లేనివాటిని’ అనే అక్షరార్థ లిఖిత పాఠం
  rationale: వాక్య సందర్భం, గెంతడానికి ఆ కాళ్లను ఉపయోగిస్తారనే తరువాతి ఉద్దేశ వాక్యం, ప్రాచీన అనువాదాలు—అన్నీ ‘ఉన్నవి’ అనే పఠనానికే మద్దతిస్తాయి; నిజమైన పాఠభేదాన్ని పాదటిప్పణిలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘పక్షులు’ అని పరిమితం చేయకుండా ఎగిరే చిన్న జీవుల విస్తృత వర్గాన్ని ఉంచింది; పాఠభేదం మరియు శరీర నిర్మాణ పదంలోని ప్రత్యామ్నాయాన్ని పాదటిప్పణుల్లో సంరక్షించింది.
