id: LEV.11.4
reference: Leviticus 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: te
  text: 'అయితే, నెమరు వేసే జంతువులలోగానీ, చీలిన డెక్కలు గల జంతువులలోగానీ వీటిని మీరు తినకూడదు: ఒంటె నెమరు వేస్తుంది గాని దాని డెక్క చీలి ఉండదు; అది మీకు అపవిత్రం.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఇశ్రాయేలుకు ఇవ్వబడిన ఆహార నియమాల ప్రకారం అది వారికి అపవిత్రమైనది.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి నియమానికి మినహాయింపు లేదా పరిమితిని సూచించే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: నెమరు వేసే జంతువులలో
  rationale: హీబ్రూ నుడికారంలో అక్షరార్థంగా నెమరును పైకి తెచ్చడం ఉన్నా, జంతువు cud నమలడాన్ని తెలిపే సాధారణ తెలుగు పదబంధం ‘నెమరు వేయడం’.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: చీలిన డెక్కలు గల జంతువులలో
  rationale: రెండవ వర్గీకరణ లక్షణాన్ని స్పష్టంగా తెలుపుతుంది; తరువాతి జంతువులు రెండు లక్షణాల్లో ఒక్కటే కలిగినవిగా పేర్కొనబడతాయి కాబట్టి సందర్భార్థానికి సరిపోతుంది.
- source_word: הַגָּמָל
  choice: ఒంటె
  rationale: పేర్కొన్న జంతువుకు నేరమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: ఒంటె నెమరు వేస్తుంది
  rationale: ఒంటె మొదటి ఆహార నియమ లక్షణాన్ని కలిగి ఉందని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: గాని దాని డెక్క చీలి ఉండదు
  rationale: రెండవ లక్షణం లేకపోవడాన్ని, హీబ్రూ వాక్యంలోని వ్యతిరేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: טָמֵא הוּא לָכֶם
  choice: అది మీకు అపవిత్రం
  rationale: లేవీయకాండంలోని శుద్ధి వర్గీకరణకు కేంద్ర పదమైన טָמֵאను ‘అపవిత్రం’గా అనువదించి, לָכֶםలోని ‘మీకు’ అనే నిబంధనాత్మక దృష్టిని నిలుపుతుంది.
theological_decisions:
- issue: లేవీయ ఆహార నియమంలో అపవిత్రత స్వభావం
  choice: అది మీకు అపవిత్రం
  alternative: అది ఆచారపరంగా మీకు అపవిత్రం
  rationale: మూలంలోని טָמֵא సాధారణంగా ‘అపవిత్రం’ అని మాత్రమే చెబుతుంది. ప్రధాన పాఠ్యంలో ‘ఆచారపరంగా’ అని చేర్చడం భావాన్ని ముందుగానే సంకుచితం చేస్తుంది; ఇశ్రాయేలీయ ఆహార నియమాల సందర్భాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నెమరు వేయడం,’ ‘చీలిన డెక్క,’ ‘అపవిత్రం’ వంటి స్థిరమైన బైబిలు-సందర్భ పదాలను సహజ వాక్య నిర్మాణంలో ఉపయోగించాం. మూలంలో లేని ఆచారపరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఉంచాం.
