id: LEV.11.26
reference: Leviticus 11:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְֽ/כָל הַ/בְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְ/שֶׁ֣סַע אֵינֶ֣/נָּה שֹׁסַ֗עַת וְ/גֵרָה֙ אֵינֶ֣/נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִטְמָֽא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: te
  text: డెక్క చీలి ఉన్నా, అది పూర్తిగా రెండుగా చీలక, నెమరు వేయని ప్రతి జంతువు మీకు అపవిత్రమైనది. వాటిలో దేనినైనా తాకే ప్రతి వ్యక్తి అపవిత్రుడవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: ప్రతి జంతువు
  rationale: לְ־ ఇక్కడ చర్చలోని వర్గాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘విషయానికొస్తే’ అని చేర్చకుండా ‘ప్రతి జంతువు’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది. בְּהֵמָה భూజంతువును సూచించే విస్తృత పదం.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: డెక్క చీలి ఉన్నప్పటికీ
  rationale: ఈ హీబ్రూ పదబంధం విభజితమైన డెక్కను సూచిస్తుంది. తరువాతి వ్యతిరేక వాక్యభాగంతో సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి ‘ఉన్నప్పటికీ’ వాడబడింది.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: ఆ డెక్క పూర్తిగా రెండుగా చీలనిదీ
  rationale: ఒకే మూలానికి చెందిన నామవాచక-క్రియ నిర్మాణం డెక్క సంపూర్ణంగా రెండుగా విడిపోకపోవడాన్ని బలపరుస్తుంది. ‘పూర్తిగా రెండుగా’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: నెమరు వేయనిదీ
  rationale: హీబ్రూలో అక్షరార్థంగా నెమరును పైకి తేవడం అని ఉన్నా, తెలుగులో స్థిరమైన సహజ ప్రయోగం ‘నెమరు వేయడం’.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: మీకు అపవిత్రమైనది
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి సందర్భంలో טָמֵאకు ‘అపవిత్రం’ స్థిరమైన తెలుగు సమానార్థకం. ‘మీకు’ అనే మాట לָכֶםలోని నిబంధనాత్మక దృష్టికోణాన్ని నిలుపుతుంది. హీబ్రూలోని బహువచనం వర్గాన్ని సూచిస్తుండగా, తెలుగు వాక్యంలో ‘ప్రతి జంతువు’తో వ్యాకరణానుసారం ఏకవచనం వాడబడింది.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: వాటిలో దేనినైనా తాకే ప్రతి వ్యక్తి
  rationale: כָּלతో కూడిన ఏకవచన కృదంతం సాధారణ నియమాన్ని తెలియజేస్తుంది. בָּהֶםలోని బహువచన సూచనను ‘వాటిలో దేనినైనా’ స్పష్టంగా నిలుపుతుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడవుతాడు
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం చట్టపరమైన ఫలితాన్ని, అంటే తాకిన వ్యక్తి అపవిత్ర స్థితిలోకి రావడాన్ని తెలుపుతుంది.
theological_decisions:
- issue: లేవీయ ధర్మశాస్త్రంలోని శుద్ధి పరిభాష
  choice: అపవిత్రమైనది / అపవిత్రుడవుతాడు
  alternative: అశుద్ధమైనది / అశుద్ధుడవుతాడు
  rationale: ఈ వచనం ప్రధానంగా ఆచారపరమైన శుద్ధి స్థితిని సూచిస్తుంది, తప్పనిసరిగా నైతిక దోషాన్ని కాదు. ‘అపవిత్రం’ తెలుగు బైబిలు పరిభాషలో గుర్తించదగిన పదం; సందర్భం దాని ఆచారపరమైన అర్థాన్ని నిర్దేశిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, ధర్మశాస్త్ర వచనానికి తగిన గంభీరతతో అనువదించబడింది. ‘నెమరు వేయడం’, ‘డెక్క’ వంటి సహజమైన ప్రస్తుత పదప్రయోగాలు వాడబడ్డాయి; ఆచారపరమైన అపవిత్రతను నైతిక దోషంగా విస్తరించలేదు.
