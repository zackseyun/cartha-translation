  terminology: “డెక్క,” “నెమరు వేయు,” and “అపవిత్రమైనది/అపవిత్రుడవుతాడు” are suitable in this legal-purity context. The latter is to be understood ritually, not as a moral judgment. The note appropriately explains the intensified Hebrew hoof expression.
