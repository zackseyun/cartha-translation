id: LEV.11.12
reference: Leviticus 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: te
  text: నీటిలో తెరచాపలూ పొలుసులూ లేనిదంతా మీకు అసహ్యమైనది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు హేయమైనది.’ ఇక్కడి హీబ్రూ పదం שֶׁקֶץ ఈ ఆహార నియమాల సందర్భంలో ఆచారపరంగా అసహ్యమైన లేదా జుగుప్సాకరమైన దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: లేనిదంతా
  rationale: సమగ్ర వర్గాన్ని సూచించే כֹּל‌తో కూడిన సంబంధవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֵין לוֹ
  choice: లేని
  rationale: హీబ్రూ అస్తిత్వ నిరాకరణతో వ్యక్తమయ్యే ‘కలిగి ఉండకపోవడం’ అనే భావానికి తెలుగులో సహజమైన విశేషణ రూపం.
- source_word: סְנַפִּיר
  choice: రెక్కలు
  rationale: జలచరాల fins‌ను సాధారణ తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే వాడుక పదంతో సూచిస్తుంది; హీబ్రూలో ఏకవచనమైనా ఇది జాతివాచకంగా ఉంది.
- source_word: קַשְׂקֶשֶׂת
  choice: పొలుసులు
  rationale: జలచరాల scales‌కు సహజమైన తెలుగు పదం; హీబ్రూ ఏకవచనం ఇక్కడ జాతివాచకంగా పనిచేస్తుంది.
- source_word: בַּמָּיִם
  choice: నీటిలో
  rationale: హీబ్రూ מַיִם రూపరీత్యా బహువచనమైనా, ఈ సందర్భంలో తెలుగు ఏకవచన సామూహిక పదం సహజంగా స్థలార్థాన్ని ఇస్తుంది.
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనది
  rationale: ఆహార నియమాల సందర్భంలో ఆచారపరంగా జుగుప్సాకరమైన లేదా పూర్తిగా తిరస్కరించవలసిన దానిని సూచించే బలమైన మూలభావాన్ని ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הוּא
  choice: అయినది
  rationale: హీబ్రూ నామవాచక విధేయ వాక్యంలోని నిర్ధారణను తెలుగు విధేయ నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఇశ్రాయేలీయులను నేరుగా ఉద్దేశించిన నిబంధనాత్మక అన్వయాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఆహార నియమాల సందర్భంలో שֶׁקֶץ‌కు ఆచారపరమైన స్థితి పదం
  choice: అసహ్యమైనది
  alternative: హేయమైనది; అసహ్యకరమైన వస్తువు
  rationale: ఈ పదం సాధారణ అయిష్టతకన్నా బలమైన ఆచారపరమైన జుగుప్సను సూచిస్తుంది. ‘అపవిత్రమైనది’ అని అనువదిస్తే ఇక్కడ ఉపయోగించని טמא అనే విస్తృత అపవిత్రత పదజాలంతో కలిసిపోయే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన శాసన శైలి. మూలంలోని సమగ్రతను ‘లేనిదంతా’ ద్వారా, బలమైన మూల్యాంకనాన్ని ‘అసహ్యమైనది’ ద్వారా నిలిపింది.
