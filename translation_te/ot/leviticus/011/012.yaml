  rationale: 'Only the rendering of ‘fins’ is revised: తెరచాపలు precisely denotes aquatic fins, unlike the potentially misleading రెక్కలు (‘wings’). The footnote is retained with minor stylistic smoothing and continues to preserve the lexical alternative without equating שֶׁקֶץ with the separate impurity terminology.'
