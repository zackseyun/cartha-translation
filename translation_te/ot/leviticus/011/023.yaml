  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: te
  text: అయితే రెక్కలుగల గుంపులుగా కదిలే చిన్న ప్రాణుల్లో[a] నాలుగు కాళ్లు[b] గల ప్రతిదీ మీకు అసహ్యమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎగిరే ప్రాకే జీవులు.’ ఈ హెబ్రీ పదబంధం ముఖ్యంగా పురుగులతో సహా, గుంపులుగా కదిలే ఎగిరే చిన్న ప్రాణులను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘నాలుగు పాదాలు’; ఈ సందర్భంలో తెలుగులో ‘నాలుగు కాళ్లు’ సహజమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: అయితే … ప్రతిదీ
  rationale: ముందటి వచనంలోని మినహాయింపుకు భిన్నంగా ఇప్పుడు సాధారణ నిషేధం చెప్పబడుతోంది కాబట్టి וְ లోని సందర్భానుసారమైన వ్యత్యాస భావాన్ని ‘అయితే’ తెలియజేస్తుంది; כֹל యొక్క సమగ్ర భావాన్ని ‘ప్రతిదీ’ నిలుపుతుంది.
- source_word: שֶׁרֶץ הָעֹוף
  choice: గుంపులుగా కదిలే రెక్కల చిన్న ప్రాణులు
  rationale: ఈ హెబ్రీ పదబంధం గుంపులుగా విస్తరించే లేదా కదిలే ఎగిరే చిన్న ప్రాణుల వర్గాన్ని, ముఖ్యంగా పురుగులను, సూచిస్తుంది. కేవలం ‘పురుగులు’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత వర్గార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: אֲשֶׁר לוֹ
  choice: గల
  rationale: ఏ లక్షణం ఉన్న ప్రాణులని నిర్వచించే హెబ్రీ సంబంధవాచక నిర్మాణానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: אַרְבַּע רַגְלָיִם
  choice: నాలుగు కాళ్లు
  rationale: రַגְלָיִם అంటే సందర్భంలో కాళ్లు లేదా పాదాలు. చిన్న ప్రాణుల గురించి తెలుగులో ‘కాళ్లు’ సహజంగా ఉండటంతో పాటు మూలంలోని సంఖ్యను యథాతథంగా ఉంచుతుంది.
- source_word: שֶׁקֶץ
  choice: అసహ్యమైనది
  rationale: ఆహార నియమాల సందర్భంలో ఈ పదం తినకూడదని తిరస్కరించబడిన, అసహ్యంగా పరిగణించాల్సినదాన్ని సూచిస్తుంది. ‘అపవిత్రమైనది’ అని మార్చి వేరొక హెబ్రీ పదవర్గంతో కలపకుండా దాని బలాన్ని నిలుపుతుంది.
- source_word: הוּא לָכֶם
  choice: మీకు అసహ్యమైనది
  rationale: హెబ్రీలో క్రియలేని ‘అది మీకు అసహ్యమైనది’ అనే వాక్యాన్ని సహజమైన తెలుగులో అందిస్తూ, ఈ నియమం ఉద్దేశించబడిన సమాజాన్ని సూచించే ‘మీకు’ను నిలుపుతుంది.
theological_decisions:
- issue: שֶׁקֶץ అనే ఆహారనియమ పదాన్ని సాధారణ అపవిత్రతగా విస్తరించాలా
  choice: అసహ్యమైనది
  alternative: అపవిత్రమైనది / హేయమైనది
  rationale: మూలపదం ఇక్కడ నిషిద్ధమైనదిగా అసహ్యంగా పరిగణించాల్సిన భావాన్ని ఇస్తుంది. దానిని సాధారణ ‘అపవిత్రత’ పదంతో సమానం చేయకుండా, వచనంలోని ఆచార సంబంధ ఉద్రిక్తతను అలాగే ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గుంపులుగా కదిలే రెక్కల చిన్న ప్రాణులు’ అనే రూపం కొంత వివరణాత్మకమైనదైనా, హెబ్రీ జీవవర్గాన్ని కేవలం ఆధునిక శాస్త్రీయ ‘పురుగులు’ అనే వర్గానికి పరిమితం చేయకుండా ఉంచుతుంది.
