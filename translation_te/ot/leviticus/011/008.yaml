  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: te
  text: వాటి మాంసంలో దేనినీ మీరు తినకూడదు; వాటి కళేబరాలను[a] ముట్టుకోకూడదు. అవి మీకు అపవిత్రమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి మృతదేహాలను.” హీబ్రూ పదం చనిపోయిన జంతువు దేహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: వాటి మాంసంలో దేనినీ
  rationale: מִן అనే ఉపసర్గ ఇక్కడ భాగార్థాన్ని సూచిస్తుంది; అందువల్ల వాటి మాంసంలో ఏ భాగాన్నీ తినకూడదనే నిషేధాన్ని ఈ అనువాదం సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, తగిన బలంతో వ్యక్తపరుస్తుంది.
- source_word: וּבְנִבְלָתָם
  choice: వాటి కళేబరాలను
  rationale: נְבֵלָה చనిపోయిన జంతువు దేహాన్ని సూచిస్తుంది. ‘కళేబరం’ మానవ శవంతో గందరగోళం కలిగించకుండా జంతు మృతదేహానికి తగిన, గౌరవప్రదమైన పదం.
- source_word: לֹא תִגָּעוּ
  choice: ముట్టుకోకూడదు
  rationale: נגע అనే క్రియ యొక్క ప్రత్యక్ష అర్థమైన ‘తాకడం/ముట్టుకోవడం’ను స్పష్టంగా నిలుపుతుంది; కర్మసంబంధ అపవిత్రతను అనువాదంలో అదనంగా చేర్చదు.
- source_word: טְמֵאִים
  choice: అపవిత్రమైనవి
  rationale: లేవీయకాండంలోని శుద్ధి నియమాల సందర్భంలో ఇది ఆచారపరమైన అపవిత్రతను సూచిస్తుంది; నైతిక దుష్టత్వాన్ని సూచించకుండా ఆ వర్గాన్ని నిలుపుతుంది.
- source_word: הֵם לָכֶם
  choice: అవి మీకు అపవిత్రమైనవి
  rationale: לָכֶם లోని సంబంధార్థాన్ని ‘మీకు’ అని నేరుగా నిలుపుతూ, ఇశ్రాయేలీయుల పట్ల ఆ జంతువులకు ఉన్న ఆచారపరమైన స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయ ఆహార నియమంలో అపవిత్రత స్వభావం
  choice: ‘అపవిత్రమైనవి’ అని ఆచారపరమైన వర్గాన్ని మాత్రమే వ్యక్తపరచడం
  alternative: ‘అశుద్ధమైనవి’ అని అనువదించడం లేదా నైతికంగా చెడ్డవని విస్తరించడం
  rationale: వచనం ఇశ్రాయేలు శుద్ధి-పరిశుద్ధత నియమాల పరిధిలో మాట్లాడుతుంది. తరువాతి ఒడంబడిక సంబంధ అన్వయాలనుగానీ నైతిక దుష్టత్వాన్నిగానీ ఇది స్వయంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘తినకూడదు,’ ‘ముట్టుకోకూడదు’ అనే రూపాలు నిషేధ బలాన్ని స్పష్టంగా తెలియజేస్తాయి; ‘కళేబరం,’ ‘అపవిత్రం’ అనే పదాలు లేవీయకాండ సందర్భానికి తగిన గౌరవప్రదమైన పదజాలాన్ని నిలుపుతాయి.
