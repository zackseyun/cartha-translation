translation:
  language: te
  text: అపవిత్రమైనదానికీ శుద్ధమైనదానికీ మధ్య, తినదగిన జీవికీ తినకూడని జీవికీ మధ్య తేడాను గుర్తించడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: తేడాను గుర్తించడానికి
  rationale: ఈ క్రియారూపం ముందున్న సందర్భానికి సంబంధించిన ఉద్దేశాన్ని లేదా ఫలితాన్ని తెలుపుతుంది. ఆహార నియమాలలో వర్గాలను వివేచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּין ... וּבֵין
  choice: '...కి ...కి మధ్య ...; ...కి ...కి మధ్య ...'
  rationale: హీబ్రూ వాక్యంలో ఉన్న రెండు జతల వ్యత్యాసాలను సమాంతరంగా నిలుపుతుంది.
- source_word: הַטָּמֵא
  choice: అపవిత్రమైనది
  rationale: లేవీయకాండంలోని ఆచారపరమైన వర్గాన్ని సూచిస్తుంది; నైతిక దుష్టత్వాన్ని అనవసరంగా సూచించదు.
- source_word: הַטָּהֹר
  choice: పవిత్రమైనది
  rationale: טָמֵאకు వ్యతిరేకమైన ఆచారపరమైన శుద్ధి వర్గాన్ని సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా తెలుపుతుంది.
- source_word: הַחַיָּה
  choice: జీవి
  rationale: ఈ సారాంశ వాక్యంలో పదం జంతువు లేదా ప్రాణిని విస్తృతంగా సూచిస్తుంది. ‘జీవి’ అనేది అడవి జంతువులకు మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: הַנֶּאֱכֶלֶת
  choice: తినదగిన
  rationale: కేవలం తినగల సామర్థ్యాన్ని కాక, నియమం ప్రకారం తినడానికి అనుమతించబడినదనే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: తినకూడని
  rationale: ఇది తినడం నిషిద్ధమని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: లేవీయకాండ ధర్మశాస్త్రంలోని ఆచారపరమైన శుద్ధి పరిభాష
  choice: టָמֵא/טָהֹרలను ‘అపవిత్రమైనది/పవిత్రమైనది’గా అనువదించడం
  alternative: ‘అశుద్ధమైనది/శుద్ధమైనది’
  rationale: ఇవి దేవుడు నిర్దేశించిన ఆచారపరమైన వర్గాలు. అనువాదం వాటిని అంతర్గత నైతిక చెడు లేదా మంచిగా మార్చకుండా, తెలుగులో సుపరిచితమైన ధార్మిక పరిభాషను ఉపయోగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. మూలంలోని రెండు సమాంతర వ్యత్యాసాలు నిలుపబడ్డాయి; వాక్యం ముందరి సందర్భాన్ని కొనసాగించే ఉద్దేశార్థక అసమాపక రూపంగా ఉంది.
