  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: te
  text: గుంపులుగా కదిలే ఏ జీవివల్లనైనా[a] మిమ్మల్ని మీరు అసహ్యకరులుగా చేసుకోవద్దు. వాటివల్ల మిమ్మల్ని మీరు అపవిత్రులుగా చేసుకోవద్దు; వాటివల్ల మీరు అపవిత్రులు కాకుండా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాకే ఏ జీవివల్లనైనా.” హీబ్రూ పదం పాకే జీవులకే పరిమితం కాక, గుంపులుగా కదిలే లేదా విరివిగా ఉండే జీవుల వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: మిమ్మల్ని మీరు అసహ్యులుగా చేసుకోవద్దు
  rationale: שׁקץ యొక్క ‘అసహ్యమైనదిగా చేయడం/ఎంచడం’ అనే భావాన్ని, తరువాతి טמא ‘అపవిత్రం’ పదంతో కలపకుండా, కర్మ నַפְשֹׁתֵיכֶם సూచించే ఆత్మవాచక బలంతో అందిస్తుంది.
- source_word: נַפְשֹׁתֵיכֶם
  choice: మిమ్మల్ని మీరు
  rationale: ఇక్కడ נפש కేవలం ‘ఆత్మ’ను కాక వ్యక్తి/స్వయాన్ని సూచిస్తుంది; తెలుగు ఆత్మవాచక నిర్మాణం సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: పాకుతూ గుంపులుగా కదిలే ఏ చిన్న ప్రాణివల్లనైనా
  rationale: శׁרץ పదం పాకే జీవులకే పరిమితం కాక, విస్తారంగా గుంపులుగా కదిలే లేదా విరివిగా ఉండే చిన్న జీవుల వర్గాన్ని సూచిస్తుంది. తెలుగులో మూలంలోని నామ-క్రియా పునరుక్తిని యథాతథంగా ఉంచితే కృత్రిమంగా ఉండేందున భావపరిధిని సహజంగా తెలిపింది.
- source_word: תִטַּמְּאוּ
  choice: మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మవాచక భావాన్ని నిలుపుతూ, తరువాతి ఫలితవాక్యంలోని ‘అపవిత్రులు కావడం’తో రూపభేదాన్ని చూపుతుంది.
- source_word: בָּהֶם / בָּם
  choice: వాటివల్ల
  rationale: ఈ జీవులు అపవిత్రత కలిగే సాధనం లేదా కారణమని సూచించే בְּ యొక్క కరణార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְנִטְמֵתֶם
  choice: అలా ... మీరు అపవిత్రులు కావద్దు
  rationale: నిషేధాల వరుసలో ఇది వాటి ఫలితాన్ని నివారించాలనే బలాన్ని ఇస్తుంది. సాధారణ సముచ్చయంగా మాత్రమే అనువదించకుండా, ఉద్దేశం/ఫలితం మధ్య ఉన్న స్వల్ప సందిగ్ధతను ‘అలా’తో సహజంగా ఉంచింది.
theological_decisions:
- issue: పరిశుద్ధత ధర్మశాస్త్రంలో కర్మకాండ సంబంధ అపవిత్రత పదజాలం
  choice: అపవిత్రులు / అపవిత్రపరచుకోవద్దు
  alternative: మైలపడవద్దు; కలుషితులు కావద్దు
  rationale: טמא ఇక్కడ లేవీయకాండంలోని శుద్ధి–అపవిత్రత వర్గాన్ని సూచిస్తుంది. ‘అపవిత్రం’ స్థిరమైన, గౌరవప్రదమైన పదం; వాక్యం చెప్పనంత మేరకు నైతిక దోషాన్ని దిగుమతి చేయదు.
- issue: וְנִטְמֵתֶם యొక్క సంబంధం
  choice: అలా వాటివల్ల మీరు అపవిత్రులు కావద్దు
  alternative: వాటివల్ల మీరు అపవిత్రులు అవుతారు; వాటివల్ల అపవిత్రులు కాకుండా ఉండండి
  rationale: హీబ్రూ וְ రూపం సముచ్చయం, ఫలితం లేదా హెచ్చరిక ఛాయలను అనుమతిస్తుంది. సందర్భంలోని నిషేధ బలాన్ని నిలుపుతూ ఒకే కఠినమైన తార్కిక సంబంధాన్ని బలవంతంగా నిర్ణయించకుండా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండ ధర్మశాస్త్రానికి తగిన గౌరవప్రదమైన శైలి. ‘అసహ్యులు’ మరియు ‘అపవిత్రులు’ మధ్య మూలపాఠంలోని పదార్థ భేదం నిలుపబడింది.
