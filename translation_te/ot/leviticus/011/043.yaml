review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly distinguishes שׁקץ (''make yourselves detestable'') from טמא (''become/make yourselves unclean'') and appropriately renders the reflexive force of both imperative forms. However, ''చిన్న ప్రాణి'' narrows שׁרץ more than the Hebrew warrants: the term denotes the designated class of swarming/teeming creatures and is not inherently limited to creatures described as small. The final clause is appropriately understood in its warning/result relation, but can be expressed more naturally without the somewhat repetitive ''అలా ... కావద్దు.'''
  naturalness: The register is clear modern standard Telugu. 'మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు' is intelligible but less natural than 'మిమ్మల్ని మీరు అపవిత్రులుగా చేసుకోవద్దు' in this reflexive construction. The revision also avoids a needlessly restrictive description of the creatures.
  terminology: '''అసహ్యులు/అసహ్యకరులు'' and ''అపవిత్రులు'' preserve the important lexical distinction in the Hebrew. ''అపవిత్రులు'' suitably conveys ritual uncleanness without adding moral culpability. ''గుంపులుగా కదిలే జీవులు'' retains the broad swarming category without importing a size limitation.'
  issues:
  - severity: medium
    issue: The phrase 'ఏ చిన్న ప్రాణివల్లనైనా' restricts the Hebrew category.
    rationale: שׁרץ identifies swarming or teeming creatures as a class; although many may be small, 'small' is not stated by the Hebrew and may over-specify the referent.
  - severity: low
    issue: The second prohibition is slightly awkward in Telugu.
    rationale: '''మిమ్మల్ని మీరు అపవిత్రపరచుకోవద్దు'' is understandable, but ''మిమ్మల్ని మీరు అపవిత్రులుగా చేసుకోవద్దు'' more naturally expresses the reflexive causative sense while retaining the contrast with the ensuing state of becoming unclean.'
  - severity: low
    issue: The final 'అలా ... కావద్దు' is repetitive and weakly connected.
    rationale: A compact purpose/warning expression better conveys the contextual force of וְנִטְמֵתֶם while not forcing a more precise syntactic analysis than the Hebrew requires.
  revised_text: గుంపులుగా కదిలే ఏ జీవివల్లనైనా[a] మిమ్మల్ని మీరు అసహ్యకరులుగా చేసుకోవద్దు. వాటివల్ల మిమ్మల్ని మీరు అపవిత్రులుగా చేసుకోవద్దు; వాటివల్ల మీరు అపవిత్రులు కాకుండా ఉండండి.
