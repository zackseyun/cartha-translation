  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: te
  text: గెక్కో[a], ఉడుము, బల్లి, ఇసుక బల్లి, ఊసరవెల్లి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని అనేక జంతువులను ఖచ్చితంగా గుర్తించడం సాధ్యం కాదు. సంప్రదాయ, ఆధునిక ప్రతిపాదనల ప్రకారం ‘గెక్కో’ స్థానంలో ‘ఫెరెట్’ లేదా ‘ష్రూ’; ‘ఉడుము’ స్థానంలో ‘ఊసరవెల్లి’; ‘ఇసుక బల్లి’ స్థానంలో ‘స్కింక్’ లేదా పాత సంప్రదాయంలో ‘నత్త’; ‘ఊసరవెల్లి’ స్థానంలో ‘మోల్’ లేదా మరొక రకమైన బల్లి కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: గెక్కో
  rationale: ఈ జంతువు ఖచ్చితంగా ఏదో తెలియదు. అయితే పాకే జీవుల జాబితా అనే సందర్భంలో క్షీరదం కంటే బల్లి జాతికి చెందిన జీవి కావడం ఎక్కువ సంభావ్యం; అందువల్ల ఆధునికంగా గుర్తించదగిన ‘గెక్కో’ను ఎంచుకున్నాం.
- source_word: הַכֹּחַ
  choice: ఉడుము
  rationale: ఈ పదం పెద్ద బల్లి జాతి జీవిని సూచిస్తుందని సాధారణంగా భావిస్తారు. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే ‘ఉడుము’ మానిటర్ లిజర్డ్‌కు తగిన సమానార్థకం.
- source_word: הַלְּטָאָה
  choice: బల్లి
  rationale: ఖచ్చితమైన జాతి తెలియనందున అతిగా నిర్దిష్టపరచకుండా సాధారణ జంతుశాస్త్ర భావాన్ని నిలిపే ‘బల్లి’ అనే విస్తృత పదాన్ని వాడాం.
- source_word: הַחֹמֶט
  choice: ఇసుక బల్లి
  rationale: ఈ సరీసృపాల జాబితాలో పాత అనువాదమైన ‘నత్త’ కంటే బల్లి జాతి గుర్తింపే సందర్భానికి సరిపోతుంది. ఖచ్చితత్వం సందేహాస్పదమైనప్పటికీ ‘ఇసుక బల్లి’ సంభావ్యమైన ఆధునిక గుర్తింపు.
- source_word: הַתִּנְשָׁמֶת
  choice: ఊసరవెల్లి
  rationale: ఇదే హెబ్రీ పదం మరొక సందర్భంలో పక్షిని సూచించినా, ఇక్కడ పాకే జీవుల జాబితాలో ఉన్నందున సరీసృపాన్ని సూచించాలి. ‘ఊసరవెల్లి’ విస్తృతంగా అంగీకరించిన సందర్భోచిత గుర్తింపు.
