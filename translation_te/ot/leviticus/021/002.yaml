language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י אִם לִ/שְׁאֵר֔/וֹ הַ/קָּרֹ֖ב אֵלָ֑י/ו לְ/אִמּ֣/וֹ וּ/לְ/אָבִ֔י/ו וְ/לִ/בְנ֥/וֹ וּ/לְ/בִתּ֖/וֹ וּ/לְ/אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/002.yaml
  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: te
  text: కాని తనకు అత్యంత సమీప బంధువుల[a] కొరకు మాత్రం—అంటే, తన తల్లి, తన తండ్రి, తన కుమారుడు, తన కుమార్తె, తన సహోదరుడు కొరకు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שְׁאֵר అనే పదానికి అక్షరార్థంగా ‘మాంసం’ అనే భావం ఉంది; ఇక్కడ అది రక్తసంబంధిని లేదా సన్నిహిత బంధువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... మాత్రం
  rationale: మునుపటి వచనంలోని నిషేధానికి ఈ న్యాయవాక్యం మినహాయింపును ప్రవేశపెడుతుంది; తెలుగులో ‘కాని ... మాత్రం’ ఆ పరిమితి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁאֵרוֹ
  choice: తన ... బంధువు
  rationale: שְׁאֵר అనే పదానికి అక్షరార్థంగా ‘మాంసం’ అనే భావమూ, సందర్భంలో రక్తసంబంధం లేదా సన్నిహిత బంధుత్వం అనే భావమూ ఉన్నాయి. జాబితాతో కలిపి ‘బంధువు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הַקָּרֹב אֵלָיו
  choice: తనకు అత్యంత సమీప
  rationale: ఈ పదబంధం బంధుత్వంలోని సాన్నిహిత్యాన్ని సూచిస్తుంది; ‘అత్యంత సమీప’ దాని బలాన్ని నిలుపుతుంది.
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: తన తల్లి, తన తండ్రి, తన కుమారుడు, తన కుమార్తె, తన సహోదరుడు చనిపోయినప్పుడు
  rationale: ప్రతి నామవాచకానికి ఉన్న לְ, మునుపటి వచనంలోని మృతదేహం వల్ల అపవిత్రం కావడం అనే క్రియతో కలిసి, వీరి మరణ సందర్భాన్ని సూచిస్తుంది. స్వతంత్ర తెలుగు వచనంగా అర్థం కావడానికి ‘చనిపోయినప్పుడు’ స్పష్టీకరించబడింది; జాబితాలోని ఏ ఒక్కరి మరణానికైనా మినహాయింపు వర్తిస్తుంది.
theological_decisions:
- issue: ఈ మినహాయింపు ఎవరికి వర్తిస్తుందనే బంధుత్వ పరిధి
  choice: హీబ్రూ పాఠ్యంలో పేర్కొన్న తల్లి, తండ్రి, కుమారుడు, కుమార్తె, సహోదరుడు అనే జాబితాను యథాతథంగా ఉంచడం
  alternative: ‘దగ్గరి కుటుంబ సభ్యులు’ అని సాధారణీకరించడం
  rationale: న్యాయపాఠ్యంలోని నిర్దిష్ట జాబితాను సాధారణ కుటుంబ వర్గంగా విస్తరించడం లేదా కుదించడం తగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని అనుసరించాం. వచనం 1వ వచనంలోని నిషేధ వాక్యాన్ని కొనసాగిస్తున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచాం. ‘సహోదరుడు’ అనే పదం పురుష సహోదరుడనే హీబ్రూ అర్థాన్ని స్పష్టంగా నిలుపుతుంది.
