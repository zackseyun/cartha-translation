review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the exception and preserves the listed mother, father, son, daughter, and brother. However, “చనిపోయినప్పుడు” is not expressed in this verse; it imports the death-event formulation from the preceding context rather than retaining the Hebrew prepositional exception/list structure. “అత్యంత సమీప బంధువైన” is also awkwardly singular before a plural list.
  naturalness: Removing the added temporal clause and recasting the phrase as an exception concerning close relatives produces a clear, natural Telugu continuation of the preceding legal sentence.
  terminology: “రక్తసంబంధులు” appropriately conveys שְׁאֵר in this kinship context, while “అత్యంత సమీప” represents הַקָּרֹב אֵלָיו. “సహోదరుడు” accurately retains the male-sibling sense of אָח.
  issues:
  - severity: medium
    issue: The phrase “చనిపోయినప్పుడు” is added.
    rationale: The Hebrew of this verse lists the relatives introduced by לְ; it does not itself say “when [they] die.” Although death/defilement is supplied by the preceding verse’s context, adding a temporal clause here unnecessarily changes the verse’s expressed syntax.
  - severity: low
    issue: Singular “బంధువైన” is followed by a multi-person list.
    rationale: The Hebrew uses a singular kin term, but Telugu is more natural and clear here with a collective plural expression for the enumerated close relatives.
  revised_text: కాని తనకు అత్యంత సమీప బంధువుల[a] కొరకు మాత్రం—అంటే, తన తల్లి, తన తండ్రి, తన కుమారుడు, తన కుమార్తె, తన సహోదరుడు కొరకు—
  revised_footnotes:
  - marker: a
    text: హీబ్రూ שְׁאֵר అనే పదానికి అక్షరార్థంగా ‘మాంసం’ అనే భావం ఉంది; ఇక్కడ అది రక్తసంబంధిని లేదా సన్నిహిత బంధువును సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision keeps the verse as a continuation of the preceding legal prohibition and represents the Hebrew exception plus kinship list without inserting “when [they] die.” The collective Telugu wording is idiomatic while retaining every specified relative and the male sense of “brother.”
