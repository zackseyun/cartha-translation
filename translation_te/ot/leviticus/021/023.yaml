  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: te
  text: అయితే, అతడు తెర[a] లోపలికి ప్రవేశించకూడదు, బలిపీఠాన్ని సమీపించకూడదు; ఎందుకంటే అతనిలో శారీరక లోపం[b] ఉంది. అతడు నా పరిశుద్ధ స్థలాలను[c] అపవిత్రపరచకుండా ఉండేందుకు ఇలా చేయాలి; వాటిని పరిశుద్ధపరచేవాడనైన యహ్వేను నేనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది పరిశుద్ధ స్థలంలోని అంతర్గత తెరను సూచిస్తుంది; ‘పరదా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘లోపం’ అంటే ఈ యాజక సేవకు సంబంధించిన శారీరక అనర్హత; నైతిక తప్పు లేదా తక్కువ మానవ విలువ అని కాదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘నా పరిశుద్ధ స్థలాలు’ అని బహువచనం ఉంది; కొన్ని అనువాదాలు దీనిని ‘నా పరిశుద్ధ స్థలం’ అని ఏకవచనంలో ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి వచనంలో ఇచ్చిన అనుమతికి ఇక్కడ పరిమితిని విధిస్తున్న ప్రతికూల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַפָּרֹכֶת
  choice: తెర
  rationale: పరిశుద్ధ స్థలంలోని అంతర్గత తెరను సూచించే సహజమైన తెలుగు పదం; ఆరాధనా సందర్భాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: יָבֹא
  choice: దగ్గరకు వెళ్లకూడదు
  rationale: אֶל הַפָּרֹכֶת‌తో కలిసి తెర ఉన్న పరిశుద్ధ ప్రాంతంలోకి వెళ్లడాన్ని లేదా దాని వద్దకు చేరడాన్ని సూచిస్తుంది; మూలంలోని దిశా భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: యాజక సంబంధ బలి సందర్భంలో ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: יִגַּשׁ
  choice: సమీపించకూడదు
  rationale: యాజకుడు పవిత్ర సేవ కోసం దగ్గరకు రావడాన్ని సూచించే నגשׁ క్రియకు గౌరవప్రదమైన సహజ అనువాదం.
- source_word: מוּם בּוֹ
  choice: అతనిలో శారీరక లోపం ఉంది
  rationale: ఈ ధర్మశాస్త్ర సందర్భంలో מוּם నైతిక తప్పును కాక, నిర్దిష్ట యాజక సేవకు అనర్హత కలిగించే శారీరక స్థితిని సూచిస్తుంది.
- source_word: יְחַלֵּל
  choice: అపవిత్రపరచకూడదు
  rationale: పరిశుద్ధమైనదాన్ని సాధారణమైనదిగా లేదా అపవిత్రమైనదిగా చేయకూడదనే חלל పదంలోని యాజక-పరిశుద్ధత భావాన్ని అందిస్తుంది.
- source_word: מִקְדָּשַׁי
  choice: నా పరిశుద్ధ స్థలాలు
  rationale: మూలంలోని బహువచన రూపాన్ని నిలుపుతూ, పవిత్ర ప్రదేశాలను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: מְקַדְּשָׁם
  choice: వాటిని పరిశుద్ధపరచే
  rationale: సమీప వ్యాకరణ పూర్వపదమైన బహువచన ‘నా పరిశుద్ధ స్థలాలు’ను ప్రత్యయానికి సూచ్యంగా తీసుకుని, קדש పదకుటుంబంలోని పరిశుద్ధత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: מְקַדְּשָׁם లోని బహువచన ప్రత్యయం ఎవరిని లేదా వేటిని సూచిస్తుంది?
  choice: ‘వాటిని’ అనేది ‘నా పరిశుద్ధ స్థలాలను’ సూచిస్తుంది
  alternative: అది విస్తృతంగా యాజకులను లేదా ఇశ్రాయేలు ప్రజలను సూచించవచ్చు
  rationale: అత్యంత సమీపంలోని బహువచన నామవాచకం מִקְדָּשַׁי కావడం, అలాగే తక్షణ సందర్భం పవిత్ర ప్రదేశాల్లో ప్రవేశం గురించి ఉండడం వల్ల ఈ సూచన వ్యాకరణపరంగా సహజమైనది.
- issue: యాజక పరిశుద్ధత నియమంలో מוּם అర్థం
  choice: శారీరక లోపం
  alternative: మచ్చ; కళంకం
  rationale: ఇది నైతిక దోషాన్ని లేదా వ్యక్తి విలువలో కొరతను సూచించదు; ఈ సందర్భంలో కొన్ని యాజక విధులను నిర్వహించడానికి సంబంధించిన శారీరక అనర్హతను సూచిస్తుంది.
- issue: וְלֹא יְחַלֵּל సంబంధం
  choice: స్వతంత్ర నిషేధంగా ‘అతడు ... అపవిత్రపరచకూడదు’
  alternative: ఫలితార్థంగా ‘అలా ... అపవిత్రపరచకుండా ఉండాలి’
  rationale: వావ్‌తో కూడిన నిషేధ క్రియను మూలానికి దగ్గరగా స్వతంత్ర ఆజ్ఞగా ఉంచడం వల్ల ఉద్దేశం లేదా ఫలితాన్ని మూలం కంటే ఎక్కువగా నిర్ధారించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ధర్మశాస్త్ర శైలి, కానీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని బహువచనం, శారీరక అనర్హత భావం, దైవనామం మరియు నిషేధాల మధ్య సంబంధం స్పష్టంగా నిలుపబడ్డాయి.
