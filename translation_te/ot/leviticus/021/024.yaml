  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל אַהֲרֹ֖ן וְ/אֶל בָּנָ֑י/ו וְ/אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: te
  text: కాబట్టి మోషే అహరోనుకూ, అతని కుమారులకూ, ఇశ్రాయేలు కుమారులందరికీ[a] మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులందరికీ’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతతివారందరికీ.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులందరికీ’; ఇది ఇశ్రాయేలు ప్రజలకు వాడే ప్రామాణిక నిబంధనా సమూహనామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: కాబట్టి ... మాట్లాడాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని కొనసాగిస్తూ, ఈ విభాగం ముగింపులో సంగ్రహాత్మక ఫలితాన్ని సూచిస్తుంది; ‘కాబట్టి’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడినవారి సంబోధితులను తెలుగులో సహజంగా సూచించడానికి ‘తో’ వాడబడింది.
- source_word: בָּנָיו
  choice: అతని కుమారులతో
  rationale: మూలంలోని పురుష బహువచన రూపం, మూడవ పురుష ఏకవచన ప్రత్యయం అహరోను కుమారులను నిర్దిష్టంగా సూచిస్తున్నాయి.
- source_word: כָּל
  choice: అందరితో
  rationale: తదుపరి సమూహం మొత్తాన్ని సూచించే כָּל భావాన్ని ‘అందరు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఇది అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇశ్రాయేలు ప్రజలకు సంబంధించిన ప్రామాణిక నిబంధనా సమూహనామం. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే నిబంధనా సమూహనామం అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతతి’
  rationale: ఇక్కడ సిద్ధాంతపరమైన వివాదం లేదు. అయినప్పటికీ, పునరావృతమయ్యే ఈ నిబంధనా సమూహనామంలోని హీబ్రూ రూపాన్నీ పురుష బహువచనాన్నీ ప్రధాన పాఠ్యం కాపాడుతుంది; అది మొత్తం ప్రజలను సమష్టిగా సూచించగలదనే విషయాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘అహరోను’ అనే ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపాన్ని ఉపయోగించాం; మూలంలోని సమాంతర సంబోధనలను కామాలతో స్పష్టంగా ఉంచాం.
