revisions:
- from: కాబట్టి మోషే అహరోనుతో, అతని కుమారులతో, ఇశ్రాయేలు కుమారులందరితో[a] మాట్లాడాడు.
  to: కాబట్టి మోషే అహరోనుకూ, అతని కుమారులకూ, ఇశ్రాయేలు కుమారులందరికీ[a] మాట్లాడాడు.
  rationale: 'Only the recipient construction is adjusted: అహరోనుకూ ... కుమారులకూ ... అందరికీ reflects the directional force of אֶל more clearly than తో while retaining the source sequence, the concluding ‘కాబట్టి,’ and the literal rendering of כָּל בְּנֵי יִשְׂרָאֵל. The footnote is conformed to the revised case endings.'
