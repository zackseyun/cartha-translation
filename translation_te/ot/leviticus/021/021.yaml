id: LEV.21.21
reference: Leviticus 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: te
  text: యాజకుడైన అహరోను సంతానంలో శారీరక లోపం ఉన్న ఏ పురుషుడూ యాహ్వేకు అగ్నితో అర్పించే అర్పణలను[a] అర్పించడానికి సమీపించకూడదు. అతనిలో లోపం ఉంది; తన దేవుని రొట్టెను[b] అర్పించడానికి అతడు సమీపించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు సమర్పించే ఆహార అర్పణలను.” אִשֶּׁה అనే పదాన్ని సంప్రదాయంగా “అగ్ని అర్పణ” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “తన దేవుని రొట్టె” అనేది బలిగా దేవునికి సమర్పించే ఆహారాన్ని సూచించే యాజక పదప్రయోగం; లేదా, “తన దేవుని ఆహారాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: ఏ పురుషుడూ ... కూడదు
  rationale: כָּל אִישׁ తరువాత వచ్చే నిషేధంతో కలిసి సార్వత్రిక నిషేధాన్ని తెలియజేస్తుంది. యాజకత్వ సందర్భంలోని పుంలింగ ఏకవచనాన్ని ‘పురుషుడు’ నిలుపుతుంది.
- source_word: מוּם
  choice: శారీరక లోపం / లోపం
  rationale: ఈ యాజక ధర్మశాస్త్ర సందర్భంలో బలిపీఠ సేవకు అనర్హత కలిగించే శరీర సంబంధిత లోపాన్ని సూచిస్తుంది. మొదటి ప్రస్తావనలో భావాన్ని స్పష్టం చేయడానికి ‘శారీరక లోపం’, పునరుక్తిలో మూలంలోని సంక్షిప్తతను నిలుపుతూ ‘లోపం’ వాడాం.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను సంతానంలో
  rationale: זֶרַע ఇక్కడ వంశపారంపర్య సంతానాన్ని సూచిస్తుంది; הַכֹּהֵן అహరోనును విశేషించే సమానాధికార పదం.
- source_word: יִגַּשׁ
  choice: సమీపించకూడదు
  rationale: బలిసేవ కోసం దేవుని సన్నిధికి లేదా బలిపీఠం వద్దకు చేరడాన్ని సూచించే ఆరాధనా పదప్రయోగాన్ని, వచనంలోని పునరుక్తితో సహా, నిలుపుతుంది.
- source_word: לְהַקְרִיב
  choice: అర్పించడానికి
  rationale: హిఫిల్ రూపమైన הקריב బలి సందర్భంలో సమర్పించడం లేదా అర్పించడం అనే అర్థం ఇస్తుంది.
- source_word: אִשֵּׁי יְהוָה
  choice: యాహ్వేకు అగ్నిలో అర్పించే అర్పణలు
  rationale: אִשֶּׁה అగ్నితో సంబంధమున్న బలి అర్పణలకు సాంకేతిక పదం. ‘అగ్నిలో అర్పించే అర్పణలు’ మూల భావాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఆహార అర్పణలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: לֶחֶם אֱלֹהָיו
  choice: తన దేవుని రొట్టె
  rationale: לֶחֶם యొక్క ప్రత్యక్ష అర్థమైన ‘రొట్టె’ను నిలుపుతూ యాజక బలి భాషలోని రూపకాన్ని సంరక్షిస్తుంది; విస్తృతమైన ‘ఆహారం’ అర్థాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. అందువల్ల దానిని సాధారణ బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: బలులను దేవుని ‘రొట్టె’గా పేర్కొనే యాజక రూపకం
  choice: రొట్టె అనే ప్రత్యక్ష రూపకాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: తన దేవుని ఆహారం
  rationale: ఈ మాట దేవునికి భౌతిక ఆకలి ఉందని తేల్చదు; యాజక సాహిత్యంలో బలిపీఠంపై సమర్పించే ఆహార సంబంధిత బలులకు వాడే ఆచార భాష. మూలంలోని భావ ఉద్రిక్తతను తొలగించకుండా పాదసూచికలో వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. మూలంలోని రెండు నిషేధ వాక్యాల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ‘శారీరక లోపం’ ఆధునిక పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తుంది; ఇది వ్యక్తి విలువపై సాధారణ తీర్పు కాక, ఈ అధ్యాయంలోని యాజక సేవా అర్హతకు సంబంధించిన న్యాయపదం.
