source:
  edition: WLC
  text: וְ/עַ֛ל כָּל נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְ/אָבִ֥י/ו וּ/לְ/אִמּ֖/וֹ לֹ֥א יִטַּמָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: te
  text: అతడు ఏ మృతదేహాన్నీ సమీపించకూడదు[a]; తన తండ్రి విషయంలోనైనా తన తల్లి విషయంలోనైనా తన్ను తాను అపవిత్రం చేసుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏ శవాన్నీ సమీపించకూడదు.’ పదశః, ‘మృతుని నెఫెష్‌లు/వ్యక్తులు’; శుద్ధి-అశుద్ధి నియమాల్లో ఈ పదబంధం మృతదేహాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל כָּל נַפְשֹׁת מֵת לֹא יָבֹא
  choice: ఏ మృతదేహం దగ్గరికీ వెళ్లకూడదు
  rationale: యాజకుల పవిత్రతకు సంబంధించిన ఈ సందర్భంలో בוא + על అనేది మృతదేహాన్ని సమీపించడాన్ని సూచిస్తుంది. నిషేధ వాక్యంలో כָּל భావాన్ని ‘ఏ...కీ’ సహజంగా, సమగ్రంగా తెలియజేస్తుంది.
- source_word: נַפְשֹׁת מֵת
  choice: మృతదేహం
  rationale: పదశః ‘చనిపోయినవారి నెఫెష్‌లు/వ్యక్తులు’ అనే నిర్మాణం ఇక్కడ శవాన్ని సూచించే శుద్ధి-అశుద్ధి సంబంధమైన వాడుక. ‘మృతదేహం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ‘ఆత్మ’ అనే తప్పుదోవ పట్టించే అర్థాన్ని నివారిస్తుంది.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: తన తండ్రి కోసం గానీ తన తల్లి కోసం గానీ
  rationale: לְ ఇక్కడ సంబంధాన్ని లేదా సందర్భాన్ని సూచిస్తుంది—అతి సన్నిహితులైన తల్లిదండ్రులు చనిపోయిన సందర్భంలో కూడా మినహాయింపు లేదనే భావం. ‘గానీ...గానీ’ పంపిణీయ నిషేధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יִטַּמָּא
  choice: తనను తాను అపవిత్రపరచుకోకూడదు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని ‘తనను తాను...పరచుకోకూడదు’ నిలుపుతుంది. ‘అపవిత్రం’ ఇక్కడ ఆచారపరమైన అశుద్ధతను సూచిస్తుంది; నైతిక పాపమని అనవసరంగా స్పష్టీకరించదు.
theological_decisions:
- issue: మృతదేహం వల్ల కలిగే ఆచారపరమైన అపవిత్రత
  choice: ‘అపవిత్రపరచుకోకూడదు’ అనే బైబిలు శుద్ధి-అశుద్ధి పరిభాషను నిలుపుట
  alternative: ‘ఆచారపరంగా అపవిత్రుడు కాకూడదు’ లేదా ‘కలుషితం చేసుకోకూడదు’
  rationale: వాక్యం యాజకుడు మృతదేహాన్ని సమీపించడం వల్ల కలిగే లేవీయ అపవిత్రతను గురించి చెబుతుంది. ప్రధాన పాఠ్యంలో ‘ఆచారపరంగా’ అని చేర్చడం వివరణాత్మకం; ‘కలుషితం’ నైతిక భావాన్ని అధికంగా కలిగించవచ్చు.
- issue: తల్లిదండ్రుల విషయంలో కూడా మినహాయింపు లేకపోవడం
  choice: ‘తండ్రి కోసం గానీ తల్లి కోసం గానీ’ అని స్పష్టమైన పంపిణీయ నిషేధంగా అనువదించడం
  alternative: ‘తండ్రి మరియు తల్లి కోసం’
  rationale: హీబ్రూ וְ ను యాంత్రికంగా ‘మరియు’ అని అనువదిస్తే ఇద్దరూ ఒకేసారి చనిపోయిన సందర్భమే అన్న అపార్థం కలగవచ్చు. నిషేధంలో ఒక్కొక్క తల్లిదండ్రి విషయంలోనూ మినహాయింపు లేదనే భావం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆజ్ఞా శైలిని ఉపయోగించాం. ‘మృతదేహం’ సాధారణ పాఠకులకు స్పష్టమైనది; ‘అపవిత్రపరచుకోకూడదు’ లేవీయ శుద్ధి పరిభాషను నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
