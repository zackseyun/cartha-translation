id: LEV.21.18
reference: Leviticus 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: te
  text: 'ఎందుకంటే, శారీరక లోపం ఉన్న ఏ పురుషుడూ సమీపించకూడదు: చూపులేని వాడైనా, కుంటివాడైనా, ముఖం వికృతమైన వాడైనా[a], అవయవం అసమానంగా పెరిగిన వాడైనా[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం అరుదైనది. ఇది మరింత నిర్దిష్టంగా దెబ్బతిన్న లేదా రూపం మారిన ముక్కును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవయవం అసాధారణంగా పొడవైన వాడు.” హీబ్రూ పదం శరీర నిష్పత్తికి భిన్నంగా పొడిగిన లేదా రూపం మారిన అవయవాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞకు కారణాన్ని లేదా వివరణను పరిచయం చేసే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: శారీరక లోపం ఉన్న ఏ పురుషుడూ
  rationale: తరువాతి నిషేధంతో కలిసి ‘ఏ పురుషుడూ ... కూడదు’ అనే భావం వస్తుంది. సందర్భం అహరోను వంశపు పురుష యాజకులకు సంబంధించినది; מוּם ఇక్కడ యాజక సేవకు అనర్హత కలిగించే శారీరక లోపాన్ని సూచిస్తుంది.
- source_word: לֹא יִקְרָב
  choice: సమీపించకూడదు
  rationale: యాజక సంబంధ సందర్భంలో దేవుని సన్నిధికి సేవ నిమిత్తం చేరడాన్ని సూచిస్తుంది; మూలంలోని ఆరాధనా సంబంధ పదప్రయోగాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: אִישׁ עִוֵּר
  choice: చూపులేని వాడు
  rationale: అర్థాన్ని స్పష్టంగా, ఆధునిక తెలుగులో గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: פִסֵּחַ
  choice: కుంటివాడు
  rationale: నడకకు సంబంధించిన శారీరక వైకల్యాన్ని సంక్షిప్తంగా తెలిపే సాధారణ తెలుగు పదం.
- source_word: חָרֻם
  choice: ముఖం వికృతమైన వాడు
  rationale: ఈ అరుదైన పదం ముఖానికి, మరింత నిర్దిష్టంగా ముక్కుకు, కలిగిన రూపవికారాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సంభావ్య భావాన్ని ఇస్తూ, అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: שָׂרוּעַ
  choice: అవయవం అసమానంగా పెరిగిన వాడు
  rationale: పదం పొడిగిన, అతిగా పెరిగిన లేదా శరీర నిష్పత్తికి భిన్నమైన అవయవాన్ని సూచించే అవకాశం ఉంది. తెలుగు పాఠంలో నిర్ధారించలేని అతిసూక్ష్మతను నివారిస్తుంది.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలోని ఈ నిషేధ స్వభావం
  choice: ‘సమీపించకూడదు’ అని యాజక సేవకు సంబంధించిన అర్హత పరిమితిగా అనువదించడం
  alternative: సామాజికంగా సాధారణ బహిష్కరణగా లేదా వ్యక్తిగత విలువపై తీర్పుగా అర్థం చేయడం
  rationale: హీబ్రూ సందర్భం శారీరక లోపాలున్న అహరోను వంశస్థుడు యాజక సేవ కోసం సమీపించడంపైనే కేంద్రీకృతమైంది. వ్యక్తి గౌరవం, నైతిక స్థితి లేదా పాపం గురించి వచనం చెప్పని భావాలను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. సందర్భం పురుష యాజకుల గురించినది కాబట్టి లింగ సూచన నిలుపబడింది. అరుదైన రెండు శారీరక స్థితుల విషయంలో మూలంలోని పదార్థ అనిశ్చితిని పాదసూచికల ద్వారా సంరక్షించాం.
