source:
  edition: WLC
  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: te
  text: '“నీవు అహరోనుతో ఇలా చెప్పు: నీ సంతతికి చెందిన ఏ పురుషుడైనా, వారి తరతరాల్లో, శారీరక లోపం[a] కలిగి ఉంటే, తన దేవుని ఆహారాన్ని[b] అర్పించడానికి సమీపించకూడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోపం’కు ‘దోషం’ లేదా ‘అంగవైకల్యం’ అని కూడా అనువదించవచ్చు. హీబ్రూ మూమ్ ఇక్కడ ఈ యాజక సేవకు అనర్హత కలిగించే శారీరక లోపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన దేవుని రొట్టెను.’ ఈ యాజక సందర్భంలో ‘రొట్టె’ అనేది బలిగా అర్పించే ఆహార సమర్పణలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: నీవు అహరోనుతో ఇలా చెప్పు
  rationale: హీబ్రూ ఆజ్ఞారూపాన్నీ, మాటను పరిచయం చేసే సూత్రప్రయోగాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ఏ పురుషుడూ
  rationale: ఇక్కడ అహరోను వంశంలోని యాజక సేవకు అర్హుడైన పురుష సంతతి ఉద్దేశించబడింది; మూలంలోని పుంలింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: מִזַּרְעֲךָ
  choice: నీ సంతానంలో
  rationale: అహరోనును ఉద్దేశించిన వంశపారంపర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְדֹרֹתָם
  choice: వారి తరతరాల్లో
  rationale: ఈ నియమం అహరోను వంశంలోని వరుస తరాలకు వర్తిస్తుందనే భావాన్ని నిలుపుతుంది.
- source_word: מוּם
  choice: శారీరక లోపం
  rationale: ఈ యాజక సంబంధ సందర్భంలో నిర్దిష్ట సేవకు అనర్హత కలిగించే దేహసంబంధ లోపాన్ని సూచిస్తుంది; కేవలం పైపై మచ్చ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: לֹא יִקְרַב
  choice: సమీపించకూడదు
  rationale: న్యాయపరమైన నిషేధ భావంతో పాటు పరిశుద్ధస్థల సేవకు సమీపించే యాజక సంబంధ ప్రయోగాన్ని కాపాడుతుంది.
- source_word: לְהַקְרִיב
  choice: అర్పించడానికి
  rationale: హిఫిల్ రూపం ఈ బలి సందర్భంలో సమర్పణను తీసుకువచ్చి అర్పించడాన్ని సూచిస్తుంది.
- source_word: לֶחֶם אֱלֹהָיו
  choice: తన దేవుని ఆహారాన్ని
  rationale: לֶחֶם అక్షరార్థంగా రొట్టె అయినా, యాజక-బలి సందర్భంలో దేవునికి అర్పించే ఆహార సమర్పణలను విస్తృతంగా సూచిస్తుంది.
theological_decisions:
- issue: శారీరక లోపం ఉన్న యాజకులపై ఆరాధన సంబంధ నియంత్రణ
  choice: నిర్దిష్టమైన యాజక అర్పణ సేవకు సమీపించడంపై ఉన్న నియమంగా అనువదించడం
  alternative: దీనిని వ్యక్తిగత విలువ, నైతిక అపరాధం లేదా నిబంధన సమాజం నుండి సంపూర్ణ బహిష్కరణగా విస్తరించడం
  rationale: వచనం నిషేధించేది ‘అర్పించడానికి సమీపించడం’ అనే ప్రత్యేక యాజక కార్యాన్నే; వ్యక్తి విలువ లేదా నైతిక స్థితి గురించి మూలపాఠం చెప్పని విషయాన్ని అనువాదం చేర్చకూడదు.
- issue: לֶחֶם אֱלֹהָיו లోని రూపకం
  choice: ప్రధాన పాఠంలో ‘తన దేవుని ఆహారాన్ని’ అని ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘తన దేవుని రొట్టెను’ అని మాత్రమే అనువదించడం
  rationale: ‘ఆహారం’ బలి సంబంధ విస్తృత అర్థాన్ని స్పష్టం చేస్తుంది; పాదటిప్పణి హీబ్రూ రూపాన్ని పారదర్శకంగా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘ఏ పురుషుడూ’ మూలంలోని లింగ నిర్దిష్టతను, ‘సమీపించకూడదు’ యాజక-పరిశుద్ధస్థల సాంకేతిక భావాన్ని నిలుపుతాయి. పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
