  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: te
  text: తనకు దగ్గరగా ఉన్న కన్య అయిన తన సోదరి కోసం—అంటే, ఏ పురుషునికీ చెందనిది అయిన ఆమె కోసం[a]—అతడు ఆచారపరంగా అపవిత్రుడవవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భర్త లేని ఆమె కోసం,” లేదా “ఏ పురుషునితోనూ ఉండని ఆమె కోసం.” హీబ్రూ నుడికారం ఒక పురుషునితో వైవాహిక లేదా లైంగిక ఐక్యతలోకి ప్రవేశించని సోదరిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: తన ... సోదరి కోసం
  rationale: సంబంధబోధక ప్రత్యయం ‘అతని సోదరి’ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘తన సోదరి కోసం’ సహజంగా ఉంటుంది.
- source_word: הַבְּתוּלָה
  choice: కన్యక
  rationale: బְּתוּלָהకు ప్రధానంగా కన్యత్వమే అర్థం; ‘పెళ్లికాని యువతి’ కంటే ‘కన్యక’ లైంగిక స్థితిని స్పష్టంగా కాపాడుతుంది.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: తనకు దగ్గరి బంధువైన
  rationale: ఇక్కడ ‘దగ్గర’ అనేది కేవలం భావోద్వేగ సాన్నిహిత్యం కాక, దగ్గరి కుటుంబ బంధాన్ని సూచిస్తుంది. తెలుగులో అపార్థం రాకుండా బంధుత్వ భావాన్ని వ్యక్తం చేశాం.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: ఇంకా ఏ పురుషునితోనూ సంబంధం ఏర్పడని
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పురుషునికి చెందని/పురుషునితో ఉండని’ అనే విస్తృతమైన వైవాహిక లేదా లైంగిక ఐక్యతను సూచించే నుడికారం. తెలుగు ప్రధాన పాఠంలో సహజంగా ఉండేలా, అయితే దాని అస్పష్టతను పూర్తిగా సంకుచితం చేయకుండా అనువదించాం.
- source_word: לָהּ
  choice: ఆమె కోసం
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం అనుమతి ఎవరి నిమిత్తమో మళ్లీ నొక్కి చెబుతుంది; తెలుగులో ‘ఆమె కోసం’గా వ్యక్తం చేయడం సహజం.
- source_word: יִטַּמָּא
  choice: తనను తాను అపవిత్రపరచుకోవచ్చు
  rationale: సందర్భం మృతదేహ స్పర్శవల్ల కలిగే ఆచారపరమైన అపవిత్రత గురించి. క్రియారూపాన్ని స్వీయ చర్యగా, నియమంలోని అనుమతిని ‘వచ్చు’తో తెలిపాం.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో అపవిత్రత స్వభావం
  choice: ‘తనను తాను అపవిత్రపరచుకోవచ్చు’—ఆచారపరమైన స్థితిగా
  alternative: ‘తనను తాను కలుషితం చేసుకోవచ్చు’—నైతిక అవినీతిగా వినిపించే అవకాశం
  rationale: లేవీయకాండం 21 సందర్భంలో ఇది మృతదేహంతో సంబంధం వల్ల వచ్చే ఆచారపరమైన అపవిత్రత; వ్యక్తిగత పాపం లేదా నైతిక భ్రష్టత కాదు.
- issue: לֹא הָיְתָה לְאִישׁ అనే నుడికారం పరిధి
  choice: వైవాహిక లేదా లైంగిక ఐక్యతను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా ‘పురుషునితో సంబంధం ఏర్పడని’ అని అనువదించి, ప్రత్యామ్నాయాలను పాదసూచికలో చూపడం
  alternative: ‘భర్త లేని’ లేదా ‘పురుషునితో శయనించని’ అని ఒక్క అర్థానికే పరిమితం చేయడం
  rationale: హీబ్రూ నుడికారం వివాహ సంబంధాన్ని లేదా పురుషునితో ఏర్పడిన ఐక్యతను సూచించగలదు; మూలంలోని నిజమైన అర్థవిస్తృతిని నిలుపుకోవడం సముచితం.
