revisions:
- from: తనకు దగ్గరి బంధువైన కన్యక సోదరి కోసం—అంటే, ఇంకా ఏ పురుషునితోనూ సంబంధం ఏర్పడని ఆమె కోసం[a]—అతడు తనను తాను అపవిత్రపరచుకోవచ్చు.
  to: తనకు దగ్గరగా ఉన్న కన్య అయిన తన సోదరి కోసం—అంటే, ఏ పురుషునికీ చెందనిది అయిన ఆమె కోసం[a]—అతడు ఆచారపరంగా అపవిత్రుడవవచ్చు.
  rationale: The revision preserves the Hebrew sequence—his sister, a virgin, near to him, who has not become a man’s—and keeps the legal permission to incur ritual impurity. It removes the added term “relative,” avoids the overbroad “relationship,” and uses clear modern Telugu while retaining the source idiom’s breadth through a footnote.
