id: LEV.21.9
reference: Leviticus 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִ/זְנ֑וֹת אֶת אָבִ֨י/הָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: te
  text: యాజకుని కుమార్తె వేశ్యావృత్తి చేసి తనను తాను అపవిత్రపరచుకుంటే,[a] ఆమె తన తండ్రిని అపవిత్రపరుస్తుంది; ఆమెను అగ్నితో కాల్చివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేశ్యావృత్తి మొదలుపెడితే.” ఇక్కడి హీబ్రూ క్రియకు “మొదలుపెట్టు” అనే అర్థం కూడా సాధ్యమే; అయితే ఈ సందర్భంలో “తనను తాను అపవిత్రపరచుకొను” అనే అర్థం మరింత అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: యాజకుని కుమార్తె
  rationale: ‘ఒక మనిషి, అనగా యాజకుని కుమార్తె’ అనే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: …చేస్తే
  rationale: ఈ న్యాయసూత్ర సందర్భంలో షరతును సూచించే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תֵחֵל
  choice: తనను తాను అపవిత్రపరచుకుంటే
  rationale: חלל నిఫాల్ రూపంలోని అపవిత్రమగుట/తనను అపవిత్రపరచుకొనుట అనే భావాన్ని నిలుపుతుంది; ‘మొదలుపెడితే’ అనే సాధ్యమైన పదార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: לִזְנוֹת
  choice: వ్యభిచారం చేసి
  rationale: זנה సూచించే వేశ్యావృత్తి లేదా వ్యభిచార ప్రవర్తనను సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన భాషలో తెలియజేస్తుంది.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: ఆమె తన తండ్రిని అపవిత్రపరుస్తుంది
  rationale: మూలంలోని חלל పదపునరుక్తిని తెలుగులోనూ కాపాడి, యాజక పవిత్రతకు కలిగే భంగాన్ని వ్యక్తపరుస్తుంది.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: ఆమెను అగ్నితో కాల్చివేయాలి
  rationale: న్యాయపరమైన విధిని ఆధునిక తెలుగు ఆజ్ఞార్థక శైలిలో స్పష్టంగా వ్యక్తపరుస్తూ ‘అగ్నితో’ అనే సాధనార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజక పవిత్రత సందర్భంలో חלל పదజాలం
  choice: రెండు చోట్లా ‘అపవిత్రపరచు’ అనే ఒకే పదాన్ని వాడటం
  alternative: మొదటి చోట ‘తనను చెడగొట్టుకుంటే,’ రెండవ చోట ‘తండ్రిని అవమానిస్తుంది’ అని అనువదించడం
  rationale: ఒకే హీబ్రూ మూలపదానికి చెందిన రూపాల మధ్య సంబంధాన్ని కాపాడుతుంది; కేవలం సామాజిక అవమానంగా భావాన్ని కుదించకుండా యాజక పవిత్రతకు కలిగే భంగాన్ని నిలుపుతుంది.
- issue: זנה యొక్క నిర్దిష్టత
  choice: ‘వ్యభిచారం చేసి’
  alternative: ‘వేశ్యగా ప్రవర్తించి’ లేదా ‘వేశ్యావృత్తి మొదలుపెట్టి’
  rationale: మూలంలోని లైంగిక దురాచార భావాన్ని స్పష్టంగా ఉంచుతూ, వచనం తప్పనిసరిగా వాణిజ్యపరమైన వేశ్యావృత్తినే సూచిస్తుందని అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలి ఉపయోగించబడింది. ‘అపవిత్రపరచు’ అనే పదం యాజక పవిత్రతకు సంబంధించిన మూలపద సంబంధాన్ని నిలుపుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
