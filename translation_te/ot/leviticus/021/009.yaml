  source_fidelity: The draft correctly represents the conditional legal case, the repeated חלל holiness/profanation vocabulary, the father as the object of the second clause, and the prescribed burning penalty. However, ‘వ్యభిచారం’ normally denotes adultery in modern Telugu and is narrower than זנה here, whose primary concrete sense is prostitution/harlotry.
  naturalness: The legal register is clear and modern. Replacing ‘వ్యభిచారం చేసి’ with ‘వేశ్యావృత్తి చేసి’ is both more source-specific and natural in this context. The repeated ‘అపవిత్రపరచు’ appropriately preserves the lexical linkage, though it has a formal cultic register suitable to the passage.
  terminology: ‘యాజకుని కుమార్తె,’ ‘అపవిత్రపరచు,’ and ‘అగ్నితో కాల్చివేయాలి’ suitably convey the priestly/legal context. ‘వేశ్యావృత్తి’ better renders זנה than ‘వ్యభిచారం’ without treating the phrase as a broad generic term for all sexual misconduct.
