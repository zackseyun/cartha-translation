  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ה֕וּא אִשָּׁ֥ה בִ/בְתוּלֶ֖י/הָ יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/013.yaml
  text: And he shall take a wife in her virginity[a].
translation:
  language: te
  text: అతడు కన్యగా ఉన్న స్త్రీని భార్యగా స్వీకరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన కన్యత్వంలో ఉన్న స్త్రీని భార్యగా స్వీకరించాలి.’ హీబ్రూ వాచ్యార్థం, ‘ఆమె కన్యత్వంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామం యాజకుడనే కర్తను స్పష్టంగా, స్వల్ప ఉద్ఘాటనతో కొనసాగిస్తుంది. తెలుగులో ‘అతడు’ సహజంగా దీనిని తెలియజేస్తుంది.
- source_word: אִשָּׁה
  choice: స్త్రీని భార్యగా
  rationale: אִשָּׁה అంటే ‘స్త్రీ’ లేదా ‘భార్య’; לקחతో కూడిన ఈ వివాహ సందర్భంలో ‘స్త్రీని భార్యగా స్వీకరించాలి’ అని అనువదించడం రెండు భావాలను సహజంగా కలుపుతుంది.
- source_word: בִּבְתוּלֶיהָ
  choice: కన్యత్వంలో ఉన్న
  rationale: בְּתוּלִים అనే రూపం ఇక్కడ ఆమె కన్యత్వ స్థితిని సూచిస్తుంది. ‘కన్యత్వంలో ఉన్న’ అనేది హీబ్రూ నిర్మాణాన్ని కొంతవరకు నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: יִקָּח
  choice: స్వీకరించాలి
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’; భార్యను తీసుకునే సందర్భంలో వివాహబంధంలో స్వీకరించడం అనే నుడికార భావం ఉంది. విధినియమ శైలిని ‘స్వీకరించాలి’ నిలుపుతుంది.
theological_decisions:
- issue: యాజక నియమావళిలో వివాహ పదప్రయోగం
  choice: ‘స్త్రీని భార్యగా స్వీకరించాలి’ అనే వివాహ నుడికారాన్ని నిలుపడం
  alternative: ‘కన్యను వివాహం చేసుకోవాలి’
  rationale: మూలంలోని אִשָּׁה ... יִקָּח నిర్మాణాన్ని పూర్తిగా సాధారణీకరించకుండా, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అలాగే בִּבְתוּלֶיהָ సూచించే స్థితిని ప్రధాన పాఠంలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యాజక నియమావళికి తగిన గంభీరమైన విధినిర్దేశక శైలి. ‘భార్యగా స్వీకరించాలి’ వివాహార్థాన్ని స్పష్టంగా చేస్తుంది; పాదసూచిక మూలంలోని అసాధారణ నిర్మాణాన్ని, ప్రత్యామ్నాయ సహజ పఠనాన్ని భద్రపరుస్తుంది.
