id: LEV.21.6
reference: Leviticus 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: te
  text: వారు తమ దేవునికి పవిత్రులై ఉండాలి; తమ దేవుని నామాన్ని అపవిత్రపరచకూడదు. ఎందుకంటే వారు యాహ్వే అగ్నిబలులను—అవి తమ దేవుని ఆహారం—అర్పిస్తారు. కాబట్టి వారు పవిత్రులై ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְדֹשִׁים / קֹדֶשׁ
  choice: పవిత్రులై
  rationale: వాక్యం ఆరంభంలోనూ ముగింపులోనూ ఉన్న పరిశుద్ధత భావాన్ని ఒకే పదంతో నిలుపుతుంది; యాజకులు దేవునికోసం ప్రత్యేకించబడినవారనే భావమూ సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: יִהְיוּ / וְהָיוּ
  choice: ఉండాలి
  rationale: ధర్మశాస్త్ర సందర్భంలోని ఆజ్ఞాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהֵיהֶם
  choice: తమ దేవునికి
  rationale: ל సూచించే దేవునితో సంబంధం మరియు ఆయన కోసం ప్రత్యేకించబడిన స్థితిని దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: יְחַלְּלוּ
  choice: అపవిత్రపరచకూడదు
  rationale: పవిత్రమైనదాన్ని సామాన్యంగా లేదా అపవిత్రంగా చేయడం అనే ఆరాధనా సంబంధ భావాన్ని కాపాడుతూ, వాక్యంలోని ‘పవిత్రులు’ అనే పదానికి వ్యతిరేకతను స్పష్టంగా ఉంచుతుంది.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: తమ దేవుని నామాన్ని
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: אִשֵּׁי יְהוָה
  choice: యెహోవా అగ్ని అర్పణలను
  rationale: అగ్నితో సంబంధమున్న సాంకేతిక బలి పదబంధాన్ని ‘ఆహార అర్పణలు’గా మాత్రమే సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: తమ దేవుని ఆహారమైన
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినప్పటికీ బలి సందర్భంలో విస్తృతంగా ‘ఆహారం’ను సూచిస్తుంది; ఇది అగ్ని అర్పణలకు వివరణాత్మక సమానపదంగా సహజంగా కలుస్తుంది.
- source_word: מַקְרִיבִם
  choice: సమర్పిస్తున్నారు
  rationale: קרב హిఫిల్ రూపంలోని బలిని దగ్గరకు తీసుకువచ్చి అర్పించే ఆరాధనా చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם అనే బలి సంబంధ పదబంధం
  choice: తమ దేవుని ఆహారమైన యెహోవా అగ్ని అర్పణలు
  alternative: యెహోవాకు అర్పించే ఆహార అర్పణలు, తమ దేవుని రొట్టె
  rationale: అగ్నితో అర్పించే బలుల సాంకేతిక భావాన్నీ, అవి దేవుని ‘ఆహారం/రొట్టె’గా వర్ణించబడిన రూపకాన్నీ రెండింటినీ నిలుపుతుంది; ‘ఆహారం’ను అక్షరార్థ భౌతిక అవసరంగా వివరించదు.
- issue: చివరి וְהָיוּ קֹדֶשׁ లోని וְ సంబంధం
  choice: కాబట్టి వారు పవిత్రులై ఉండాలి
  alternative: మరియు వారు పవిత్రులై ఉండాలి
  rationale: ముందున్న כִּי కారణవాక్యంతో ఏర్పడే తార్కిక ప్రవాహాన్ని సహజమైన తెలుగులో చూపుతుంది; అయినప్పటికీ హీబ్రూ సంధి సాధారణంగా ‘మరియు’ అని కూడా అర్థమవగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. ‘పవిత్రులై ఉండాలి’ అనే పునరుక్తిని మూలంలోని నిర్మాణాత్మక ఉద్ఘాటనగా ఉద్దేశపూర్వకంగా నిలిపాం. సాంకేతిక బలి భాషను అర్థమయ్యేలా ఉంచుతూ అతిగా వివరణాత్మకంగా మార్చలేదు.
