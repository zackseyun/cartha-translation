revisions:
- from: వారు తమ దేవునికి పవిత్రులై ఉండాలి; తమ దేవుని నామాన్ని అపవిత్రపరచకూడదు. ఎందుకంటే వారు తమ దేవుని ఆహారమైన యెహోవా అగ్ని అర్పణలను[a] సమర్పిస్తున్నారు. కాబట్టి వారు పవిత్రులై ఉండాలి.
  to: వారు తమ దేవునికి పవిత్రులై ఉండాలి; తమ దేవుని నామాన్ని అపవిత్రపరచకూడదు. ఎందుకంటే వారు యాహ్వే అగ్నిబలులను—అవి తమ దేవుని ఆహారం—అర్పిస్తారు. కాబట్టి వారు పవిత్రులై ఉండాలి.
