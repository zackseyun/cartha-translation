  text: וְ/לֹֽא יְחַלֵּ֥ל זַרְע֖/וֹ בְּ/עַמָּ֑י/ו כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשֽׁ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: te
  text: అతడు తన ప్రజల మధ్య తన సంతానాన్ని అపవిత్రపరచకూడదు.[a][b] ఎందుకంటే, అతనిని పవిత్రపరచే యెహోవాను నేనే.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన సంతానాన్ని సామాన్యమైనదిగా చేయకూడదు’ లేదా ‘తన సంతానానికి అవమానం తేకూడదు.’ హీబ్రూ క్రియ పవిత్రంగా ఉండవలసినదాన్ని అపవిత్రమైనదిగా లేదా సామాన్యమైనదిగా చేయడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఈ సందర్భంలోని వివాహ నియమాలను ఉల్లంఘించడం ద్వారా అతడు తన ప్రజల సమాజంలో తన వంశం మీద అపవిత్రతను తీసుకొస్తాడు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘అతనిని పవిత్రునిగా చేసేవాడైన నేను’ లేదా ‘అతనిని ప్రతిష్ఠించేవాడైన నేను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: అపవిత్రపరచకూడదు
  rationale: חלל అనే క్రియ యొక్క పియేల్ రూపం యాజక పవిత్రత సందర్భాల్లో పవిత్రమైనదాన్ని అపవిత్రం చేయడం లేదా సామాన్యమైనదిగా చేయడం అనే భావాన్ని ఇస్తుంది. ‘అపవిత్రపరచు’ ఈ పవిత్రత-అపవిత్రత వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: זַרְעוֹ
  choice: తన సంతానాన్ని
  rationale: זֶרַע ఇక్కడ బీజం అనే అక్షరార్థం కంటే సంతానం లేదా వంశాన్ని సూచిస్తుంది. ముందున్న వివాహ నియమాల సందర్భంలో ‘సంతానం’ సహజంగా ఉండి వంశసంబంధ భావాన్ని కాపాడుతుంది.
- source_word: בְּעַמָּיו
  choice: తన ప్రజల మధ్య
  rationale: בְּ־తో కూడిన עַמָּיו సామాజిక-నిబంధన సమాజంలో అనే భావంతో ‘తన ప్రజల మధ్య’ అని సహజంగా అనువదించబడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: מְקַדְּשׁוֹ
  choice: అతన్ని పవిత్రపరచేవాడిని
  rationale: קדשׁ యొక్క భాగధాతురూపం పవిత్రంగా చేయడం లేదా ప్రత్యేకపరచడం అనే భావాన్ని ఇస్తుంది. ‘పవిత్రపరచేవాడు’ యాజక పవిత్రత పదజాలాన్ని కాపాడుతూ నిరంతర దైవకార్య భావాన్నీ తెలియజేస్తుంది.
theological_decisions:
- issue: నిషేధం మరియు పవిత్రత కారణంలోని సూచన
  choice: యాజకుడు తన ప్రజల మధ్య తన సంతానాన్ని అపవిత్రపరచకూడదని, యెహోవా అతన్ని పవిత్రపరచేవాడని వాక్యం చెబుతున్నట్లుగా అనువదించాం.
  alternative: నిషిద్ధ వివాహం ద్వారా ప్రధాన యాజకుడు తన వంశాన్ని యాజక సేవకు అనర్హంగా చేయకూడదనే మరింత నిర్దిష్ట అర్థం కావచ్చు.
  rationale: తక్షణ సందర్భం యాజకుని వివాహ పరిమితులను గురించినదే అయినా, హీబ్రూ వాక్యం యాజక హోదాకు అనర్హతను స్పష్టంగా చెప్పదు. అందువల్ల ఆ వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా అసలు వాక్యంలోని విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘అపవిత్రపరచు/పవిత్రపరచు’ అనే సమాంతర పదజాలం మూలంలోని חלל–קדשׁ వ్యత్యాసాన్ని నిలుపుతుంది. హీబ్రూ వాక్యక్రమంలోని దైవ స్వీయప్రకటన బలాన్ని చూపేందుకు ‘యెహోవాను నేనే’ అని ఉంచాం.
