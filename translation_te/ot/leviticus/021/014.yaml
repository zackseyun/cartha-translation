id: LEV.21.14
reference: Leviticus 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: te
  text: విధవరాలిని గాని, విడాకులు పొందిన స్త్రీని గాని, పవిత్రత కోల్పోయిన స్త్రీని[a] గాని, వేశ్యను గాని అతడు వివాహం చేసుకోకూడదు. తన ప్రజల్లోని కన్యనే అతడు వివాహం చేసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అపవిత్రపరచబడిన స్త్రీ,” “పవిత్రస్థితి భంగమైన స్త్రీ.” హీబ్రూ పదం యాజక పవిత్రత నియమాల ప్రకారం వివాహానికి అనర్హంగా పరిగణించబడే స్థితిలో ఉన్న స్త్రీని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: విధవరాలు
  rationale: హీబ్రూ పదానికి సాధారణమైన, స్పష్టమైన అర్థం ‘విధవరాలు’.
- source_word: גְרוּשָׁה
  choice: విడాకులు పొందిన స్త్రీ
  rationale: పంపివేయబడిన లేదా వివాహబంధం నుంచి విడదీయబడిన స్త్రీ అనే న్యాయపరమైన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲלָלָה
  choice: పవిత్రత కోల్పోయిన స్త్రీ
  rationale: యాజక పవిత్రత నియమాల సందర్భంలో, వివాహానికి అనర్హమైన పవిత్రస్థితిని సూచించే పదమిది; కేవలం శారీరక లేదా ఆచార అపవిత్రతగా పరిమితం చేయకుండా మూలంలోని ‘పవిత్రతను భంగపరచడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: זֹנָה
  choice: వేశ్య
  rationale: సమకాలీన తెలుగులో నేరుగా, గౌరవప్రదమైన శైలిలో అర్థమయ్యే సమానార్థకం.
- source_word: לֹא יִקָּח ... אִשָּׁה
  choice: వివాహం చేసుకోకూడదు
  rationale: ‘స్త్రీని తీసుకోవడం’ అనే హీబ్రూ వివాహ వాడుకను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי אִם בְּתוּלָה
  choice: కన్యనే
  rationale: నిషేధానికి విరుద్ధంగా అనుమతించబడిన ఏకైక వర్గాన్ని ‘నే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעַמָּיו
  choice: తన ప్రజల్లోని
  rationale: తన ప్రజాసమూహం మధ్యనుంచి అనే మూలభావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: యాజక పవిత్రతకు సంబంధించిన חֲלָלָה పదం
  choice: పవిత్రత కోల్పోయిన స్త్రీ
  alternative: అపవిత్రపరచబడిన స్త్రీ; పవిత్రస్థితి భంగమైన స్త్రీ
  rationale: ఈ పదం సాధారణ నైతిక నిందకన్నా యాజక పవిత్రత నియమాల్లోని స్థితిని సూచిస్తుంది. ప్రధాన పాఠం ఆ ప్రత్యేక భావాన్ని పాఠకులకు అర్థమయ్యేలా ఉంచుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో, ‘తీసుకోవడం’ అనే అసహజమైన నుడికారానికి బదులు వివాహార్థాన్ని స్పష్టంగా తెలిపే సహజ వాక్యనిర్మాణం వాడబడింది. మూలంలోని వరుస జాబితా ‘గాని’ నిర్మాణంతో నిలుపబడింది.
