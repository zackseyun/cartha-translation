  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: te
  text: వారు వేశ్యను గాని, అపవిత్రురాలైన స్త్రీని గాని[a] భార్యగా చేసుకోకూడదు. తన భర్త నుంచి విడాకులు పొందిన స్త్రీని కూడా భార్యగా చేసుకోకూడదు; ఎందుకంటే అతడు తన దేవునికి పవిత్రుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్ర స్థితి నుంచి తొలగించబడిన స్త్రీని.”
    reason: חֲלָלָה అనే పదం సాధారణ అపవిత్రతతో పాటు పవిత్ర లేదా అర్హ స్థితి కోల్పోవడాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: זֹנָה
  choice: వేశ్య
  rationale: ఈ పదం లైంగిక వ్యభిచారాన్ని వృత్తిగా లేదా ప్రవర్తనగా చేసే స్త్రీని సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: חֲלָלָה
  choice: అపవిత్రురాలైన స్త్రీ
  rationale: חלל మూలంలోని ‘పవిత్ర స్థితిని కోల్పోయిన/అపవిత్రపరచబడిన’ భావాన్ని నిలుపుతుంది. ఇది కేవలం నైతిక మలినతనే సూచిస్తుందని తేల్చకుండా పాదటిప్పణిలో ప్రత్యామ్నాయ భావాన్ని ఇస్తుంది.
- source_word: יִקָּחוּ
  choice: భార్యగా చేసుకోకూడదు
  rationale: ‘స్త్రీని తీసుకోవడం’ అనే హీబ్రూ వివాహప్రయోగాన్ని తెలుగులో సహజంగా వివాహం చేసుకోవడం అనే భావంతో అందిస్తుంది.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: తన భర్త నుంచి విడాకులు పొందిన స్త్రీ
  rationale: స్త్రీ తన భర్త నుండి పంపివేయబడిన లేదా విడాకులు పొందిన స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו
  choice: అతడు తన దేవునికి పవిత్రుడు
  rationale: మూలంలోని ఏకవచన సర్వనామాన్ని, ‘తన దేవునికి’ అనే సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: బహువచన ఆజ్ఞ తరువాత వచ్చే ఏకవచన కారణవాక్యం
  choice: ‘వారు’ అనే బహువచనాన్ని, ‘అతడు’ అనే ఏకవచనాన్ని అలాగే ఉంచడం
  alternative: ‘వారు తమ దేవునికి పవిత్రులు’ అని సంఖ్యను సమన్వయపరచడం
  rationale: మూల హీబ్రూలోని బహువచనం నుంచి ఏకవచనానికి మార్పును సవరించకుండా, ప్రతి యాజకునికి వర్తించే పంపిణీ భావం లేదా పాఠ్య ఉద్రిక్తతను నిలుపుతుంది.
- issue: חֲלָלָה పదంలోని ఆచారపరమైన లేదా సామాజిక-చట్టపరమైన భావం
  choice: ప్రధాన పాఠ్యంలో ‘అపవిత్రురాలైన స్త్రీ’ అని ఉంచి, పాదటిప్పణిలో ‘పవిత్ర స్థితి నుంచి తొలగించబడినది’ అనే భావాన్ని సూచించడం
  alternative: ‘అర్హత కోల్పోయిన స్త్రీ’ లేదా ‘భ్రష్టురాలు’ అని నిర్దిష్టీకరించడం
  rationale: పదానికి ఉన్న యాజక-పవిత్రత నేపథ్యాన్ని పూర్తిగా కోల్పోకుండా, ఒకే సిద్ధాంతపరమైన వ్యాఖ్యానాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన శాసనశైలిని ఉపయోగించాం. ‘స్త్రీని తీసుకోవడం’ అనే అసహజ అక్షరానువాదానికి బదులు ‘భార్యగా చేసుకోవడం’ అని సహజంగా ఇచ్చాం; అయితే మూలంలోని సంఖ్యామార్పు మరియు חללה పదంలోని అర్థసందిగ్ధతను నిలిపాం.
