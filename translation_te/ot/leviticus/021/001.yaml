revisions:
- from: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “యాజకులతో, అంటే అహరోను కుమారులతో, మాట్లాడు. వారితో ఇలా చెప్పు: ‘వారిలో ఎవ్వరూ తన ప్రజల్లో చనిపోయిన వ్యక్తి[a] కారణంగా తనను తాను అపవిత్రపరచుకోకూడదు[b].’”'
  to: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “యాజకులైన అహరోను కుమారులతో మాట్లాడు; వారితో ఇలా చెప్పు: ‘ఏ యాజకుడూ తన ప్రజలలోని మృతుని[a] వల్ల అపవిత్రుడు కాకూడదు[b].’”'
  rationale: The revision retains the source’s repeated command (‘మాట్లాడు ... ఇలా చెప్పు’), the appositional identification of the priests as Aaron’s sons, and the distributive singular force of the prohibition. It makes the relationship conveyed by בְּעַמָּיו clear in idiomatic modern Telugu and renders ritual impurity in a less cumbersome, non-moralizing form. Footnote anchors are retained and attached to their corresponding source expressions.
