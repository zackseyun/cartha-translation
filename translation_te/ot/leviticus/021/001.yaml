reference: Leviticus 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “యాజకులైన అహరోను కుమారులతో మాట్లాడు; వారితో ఇలా చెప్పు: ‘ఏ యాజకుడూ తన ప్రజలలోని మృతుని[a] వల్ల అపవిత్రుడు కాకూడదు[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఒక నెఫెష్ కోసం.’ ఈ శుద్ధాచార సందర్భంలో నెఫెష్ అనే పదం మృతదేహాన్ని లేదా చనిపోయిన వ్యక్తిని సూచించే నానుడిగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘తనను తాను అపవిత్రపరచుకోకూడదు’ లేదా ‘తనను తాను కలుషితం చేసుకోకూడదు’ అని కూడా అనువదించవచ్చు. ఇక్కడ హీబ్రూ పదం మృతునితో సంబంధం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ పేరుకు సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: మాట్లాడు ... ఇలా చెప్పు
  rationale: ఒకే హీబ్రూ క్రియ దగ్గరగా రెండుసార్లు రావడాన్ని భావపరంగా నిలుపుతూ, తెలుగులో సహజంగా వినిపించే రెండు సమానార్థక రూపాలను వాడాం.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: యాజకులతో, అంటే అహరోను కుమారులతో
  rationale: ‘అహరోను కుమారులు’ అనేది ముందున్న ‘యాజకులు’ ఎవరన్నది వివరించే సమానాధికార పదబంధం; ‘అంటే’ ఆ సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְנֶפֶשׁ
  choice: చనిపోయిన వ్యక్తి కారణంగా
  rationale: శవస్పర్శవల్ల కలిగే అపవిత్రతను తెలిపే ఈ శుద్ధాచార సందర్భంలో נֶפֶשׁ జీవాత్మను కాక చనిపోయిన వ్యక్తిని సూచిస్తుంది; לְ ఉపసర్గను సందర్భానుసారంగా ‘కారణంగా’ అని ఇచ్చాం.
- source_word: יִטַּמָּא
  choice: తనను తాను అపవిత్రపరచుకోకూడదు
  rationale: క్రియలోని ఆత్మనేపద భావాన్ని నిలిపి, మృతునితో సంబంధం వల్ల కలిగే శుద్ధాచార అపవిత్రతను సూచించాం; దీనిని నైతిక పాపమని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
- source_word: בְּעַמָּיו
  choice: తన ప్రజల్లో
  rationale: ‘తన ప్రజల/బంధువుల మధ్య’ అనే విస్తృత భావాన్ని నిలిపాం; తరువాతి వచనాలు దగ్గరి బంధువులకు సంబంధించిన మినహాయింపులను ప్రత్యేకంగా చెబుతాయి.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో అపవిత్రత స్వభావం
  choice: మృతునితో సంబంధం వల్ల కలిగే శుద్ధాచార అపవిత్రతగా అర్థం వచ్చేలా ‘తనను తాను అపవిత్రపరచుకోకూడదు’ అని అనువదించడం
  alternative: ‘తనను తాను కలుషితం చేసుకోకూడదు’ అని నైతిక అపవిత్రతలా వినిపించే విధంగా అనువదించడం
  rationale: ఈ సందర్భం మృతదేహ సంబంధిత ఆచార అపవిత్రతను గూర్చినది. కాబట్టి నైతిక దోషాన్ని అనవసరంగా చేర్చకుండా, లేవీయకాండంలోని శుద్ధాచార వర్గాన్ని నిలిపాం.
- issue: ఏకవచన క్రియ మరియు బహువచన సంబోధన
  choice: ‘వారిలో ఎవ్వరూ ... కూడదు’ అనే పంపిణీయ ఏకవచన భావం
  alternative: ‘యాజకుడు ... కూడదు’
  rationale: యాజకులు బహువచనంలో సంబోధించబడినా, నిషేధ క్రియ హీబ్రూలో ఏకవచనంగా ఉంది. ప్రతి యాజకునికీ విడివిడిగా వర్తించే నిషేధంగా తెలుగులో సహజంగా వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని ఆజ్ఞాత్మక పునరుక్తిని సహజంగా నిలిపి, సాంకేతిక శుద్ధాచార భావాన్ని పాదటిప్పణుల్లో వివరించాం.
