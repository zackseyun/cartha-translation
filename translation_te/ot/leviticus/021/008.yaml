source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: te
  text: నీవు అతన్ని పరిశుద్ధునిగా పరిగణించాలి; ఎందుకంటే అతడు నీ దేవుని ఆహారాన్ని[a] అర్పిస్తాడు. అతడు నీకు పరిశుద్ధునిగా ఉండాలి; ఎందుకంటే మిమ్మల్ని పరిశుద్ధపరచే యాహ్వే అయిన నేను పరిశుద్ధుణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ దేవుని రొట్టెను.’ ఇక్కడ ‘రొట్టె’ దేవునికి సమర్పించే ఆహార అర్పణలను విస్తృతంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: నీవు అతన్ని పరిశుద్ధునిగా పరిగణించాలి
  rationale: קדשׁ పియేల్ రూపం అతన్ని పరిశుద్ధునిగా ప్రత్యేకంగా చూడాలని ఆజ్ఞాపిస్తుంది. ‘పరిశుద్ధపరచాలి’ అనే సాంకేతిక పదం కంటే ఈ సందర్భంలో ‘పరిశుద్ధునిగా పరిగణించాలి’ సహజంగా ఉండి ఆజ్ఞ భావాన్ని నిలుపుతుంది.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: నీ దేవుని ఆహారం
  rationale: לֶחֶם ప్రాథమికంగా ‘రొట్టె’ అయినా, యాజక బలుల సందర్భంలో దేవునికి సమర్పించే ఆహార అర్పణలను విస్తృతంగా సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מַקְרִיב
  choice: అర్పిస్తాడు
  rationale: קרב హిఫిల్ రూపం బలి సంబంధ సందర్భంలో అర్పణను దేవుని సన్నిధికి తీసుకువచ్చి సమర్పించడాన్ని సూచిస్తుంది; తెలుగులో ‘అర్పిస్తాడు’ స్పష్టమైన సహజ సమానం.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: అతడు నీకు పరిశుద్ధుడుగా ఉండాలి
  rationale: לְ యొక్క సంబంధ భావాన్ని ‘నీకు’ ద్వారా, పునరుక్త పరిశుద్ధత పదజాలాన్ని ‘పరిశుద్ధుడుగా’ ద్వారా నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందించింది.
- source_word: מְקַדִּשְׁכֶם
  choice: మిమ్మల్ని పరిశుద్ధపరచే
  rationale: బహువచన ప్రత్యయాన్ని ‘మిమ్మల్ని’ ద్వారా నిలిపి, ఆరంభంలోని קדשׁ మూలంతో ఉన్న పదసంబంధాన్ని ‘పరిశుద్ధపరచే’ ద్వారా ప్రతిబింబించింది.
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ అనే ఆరాధనా సంబంధ అభివ్యక్తి
  choice: నీ దేవుని ఆహారం
  alternative: నీ దేవుని రొట్టె
  rationale: ఈ యాజక సందర్భంలో ‘ఆహారం’ బలి అర్పణలను విస్తృతంగా సూచిస్తుంది; ‘రొట్టె’ అనే అక్షరార్థం అర్థాన్ని అనవసరంగా కుదించవచ్చు. అయినప్పటికీ దాన్ని పాదసూచికలో సంరక్షించాం.
- issue: קדשׁ మూలపద పునరుక్తి
  choice: పరిశుద్ధునిగా / పరిశుద్ధుడుగా / పరిశుద్ధపరచే / పరిశుద్ధుణ్ణి
  alternative: ప్రతిష్ఠించు / ప్రత్యేకపరచు
  rationale: యాజకుని స్థితి, దేవుని స్వభావం, ప్రజలను పరిశుద్ధపరచే దేవుని కార్యం మధ్య ఉన్న పదబంధ మరియు వేదాంత సంబంధాన్ని ఈ పునరుక్తి నిలుపుతుంది.
- issue: ఏకవచన, బహువచన సంబోధనల మార్పు
  choice: నీ దేవుని ... మిమ్మల్ని
  alternative: మీ దేవుని ... మిమ్మల్ని
  rationale: హీబ్రూ పాఠంలోని אֱלֹהֶיךָ ఏకవచనాన్ని, מְקַדִּשְׁכֶם బహువచనాన్ని తెలుగులో వేర్వేరుగా నిలిపి మూలపాఠంలోని మార్పును సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘యాహ్వే’ ద్వారా దైవనామాన్ని ప్రత్యక్షంగా నిలిపాం. మూలంలోని ఏకవచన ‘నీ’ మరియు బహువచన ‘మిమ్మల్ని’ మార్పును ఉద్దేశపూర్వకంగా సంరక్షించాం.
