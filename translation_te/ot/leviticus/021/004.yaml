source:
  edition: WLC
  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: te
  text: అతడు తన ప్రజల మధ్య భర్తగా తనను తాను అపవిత్రం చేసుకుని, తద్వారా తన పవిత్ర స్థితిని భ్రష్టుపట్టించుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు తన ప్రజల మధ్య ప్రముఖునిగా తనను తాను అపవిత్రం చేసుకుని, తద్వారా తన పవిత్ర స్థితిని భ్రష్టుపట్టించుకోకూడదు.” ఈ హీబ్రూ వాక్యభాగం క్లిష్టమైనది. కొందరు దీనిని, అతడు తన ప్రజల మధ్య తనను తాను అపవిత్రం చేసుకుని తన పవిత్ర స్థితిని భ్రష్టుపట్టించుకోకూడదనే మరింత సాధారణ నిషేధంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: తనను తాను అపవిత్రం చేసుకొని
  rationale: హిత్పయేల్ రూపం ఇక్కడ మృతదేహ సంబంధం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సూచిస్తుంది. యాజక పవిత్రత సందర్భంలో ‘అపవిత్రం చేసుకోవడం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּעַל
  choice: భర్తగా
  rationale: క్లిష్టమైన ఈ వాక్యంలో బַּעַל‌కు సాధారణ సంబంధార్థమైన ‘భర్త’ను ప్రధాన పాఠంలో ఉంచాం; సమీప బంధువుల మరణం విషయంలో అపవిత్రతకు సంబంధించిన ముందరి నియమాలతో ఇది సరిపోతుంది. ‘ప్రముఖునిగా’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: בְּעַמָּיו
  choice: తన ప్రజల మధ్య
  rationale: హీబ్రూ పదబంధానికి దగ్గరగా ‘తన ప్రజల మధ్య’ అని అనువదించాం. సందర్భంలో ఇది అతని బంధువర్గాన్ని కూడా సూచించవచ్చు.
- source_word: לְהֵחַלּוֹ
  choice: తన పవిత్రతను భ్రష్టుపట్టించుకోకూడదు
  rationale: חלל ధాతువు యాజకుని ప్రత్యేక పవిత్ర స్థితిని అపవిత్రపరచడం లేదా సాధారణమైనదిగా చేయడం అనే భావాన్ని ఇస్తుంది. తెలుగులో కేవలం ‘తన్ను తాను అపవిత్రం చేసుకోవడం’ అని పునరుక్తి చేయకుండా, పవిత్రతకు కలిగే భంగాన్ని స్పష్టంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: בַּעַל בְּעַמָּיו అనే క్లిష్ట పదబంధం యొక్క భావం
  choice: తన ప్రజల మధ్య భర్తగా అతడు అపవిత్రం కాకూడదనే పఠనం
  alternative: తన ప్రజల మధ్య ప్రముఖునిగా అతడు అపవిత్రం కాకూడదు; లేదా తన ప్రజల మధ్య తనను అపవిత్రం చేసుకొని తన పవిత్రతను భ్రష్టుపట్టించుకోకూడదు
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. బַּעַל‌కు సాధారణంగా ‘భర్త’ అనే అర్థం ఉండడం, చుట్టుపక్కల వచనాలు బంధుత్వ ఆధారిత శోకాచార అపవిత్రతను చర్చించడం వల్ల దీనిని ప్రధాన పఠనంగా ఎంచుకున్నాం. అయితే అనిశ్చితిని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. యాజక ధర్మశాస్త్రంలోని ఆచారపరమైన ‘అపవిత్రత’ మరియు ‘పవిత్రతకు భంగం’ అనే భేదాన్ని నిలిపాం; క్లిష్టమైన హీబ్రూ పఠనాన్ని పాదటిప్పణిలో స్పష్టంగా సూచించాం.
