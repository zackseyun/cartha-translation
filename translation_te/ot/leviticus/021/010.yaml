- from: తన సహోదరులకంటే ఉన్నతుడైన ప్రధాన యాజకుడు—అతని తలమీద అభిషేక తైలం పోయబడింది; వస్త్రాలు ధరించడానికి అతని చెయ్యి నింపబడింది[a]—తన తలను అస్తవ్యస్తంగా ఉంచుకోకూడదు[b]; తన వస్త్రాలను చింపుకోకూడదు.
