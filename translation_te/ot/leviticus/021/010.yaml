id: LEV.21.10
reference: Leviticus 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: te
  text: తన సహోదరులకంటే ఉన్నతుడైన ప్రధాన యాజకుడు, ఎవని తలమీద అభిషేక తైలం పోయబడిందో, వస్త్రాలు ధరించడానికి ఎవని చేతిని నింపారో, అతడు తన తలను అస్తవ్యస్తంగా ఉంచుకోకూడదు; తన వస్త్రాలను చింపుకోకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: తన సహోదరులకంటే ఉన్నతుడైన ప్రధాన యాజకుడు
  rationale: ప్రధాన యాజకుని ప్రత్యేక పదవిని ‘ప్రధాన యాజకుడు’ అని సహజంగా తెలియజేస్తూ, מִן‌ను ఇక్కడ తులనార్థకంగా తీసుకొని అతడు తన యాజక సహోదరులకంటే ఉన్నత స్థానంలో ఉన్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: అతని తలమీద అభిషేక తైలం పోయబడింది
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని, తలమీద తైలం పోసే నిర్దిష్ట ఆచార చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: అతని చెయ్యి నింపబడింది
  rationale: యాజక సేవలో ప్రతిష్ఠించడాన్ని సూచించే హీబ్రూ ఆచార సంబంధిత నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: వస్త్రాలు ధరించడానికి
  rationale: ‘వస్త్రాలు’ అనే మూలంలోని సాధారణ పదాన్ని అనవసరంగా ‘యాజక వస్త్రాలు’గా విస్తరించకుండా, సందర్భం ద్వారా దాని సూచన స్పష్టంగా ఉండేలా చేస్తుంది.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: తన తలను అస్తవ్యస్తంగా ఉంచుకోకూడదు
  rationale: మూలంలో ‘తల’ అని ఉన్నదాన్ని నిలుపుతూ, దుఃఖాచారంలో తల లేదా జుట్టును చెదరగా వదిలేయడాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా వ్యక్తపరుస్తుంది.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: తన వస్త్రాలను చింపుకోకూడదు
  rationale: దుఃఖ సూచకమైన వస్త్రాలు చింపుకునే ఆచారాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: מִלֵּא אֶת יָדוֹ అనే యాజక ప్రతిష్ఠాపన నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘అతని చెయ్యి నింపబడింది’ అని నుడికారాన్ని నిలిపి, పాదసూచికలో ప్రతిష్ఠాపన భావాన్ని వివరించడం
  alternative: ‘అతడు యాజకునిగా ప్రతిష్ఠించబడ్డాడు’ అని నేరుగా అనువదించడం
  rationale: ఈ ఆచార సంబంధిత రూపకం మూలపాఠ్య ప్రత్యేకతను, యాజక నియామకంలోని ధార్మిక ప్రాధాన్యాన్ని మోస్తుంది; పాదసూచిక సాధారణ పాఠకునికి దాని భావాన్ని స్పష్టం చేస్తుంది.
- issue: מֵאֶחָיו యొక్క సంబంధం
  choice: ‘తన సహోదరులకంటే ఉన్నతుడైన’ అనే తులనార్థక పఠనం
  alternative: ‘తన సహోదరులలోనుండి వచ్చిన’ లేదా ‘తన సహోదరులలో ప్రధానుడైన’
  rationale: ఈ సందర్భంలో מִן తులనను సూచించగలదు; ప్రధాన యాజకుని ఇతర యాజకులపై ఉన్న ఉన్నత స్థానాన్ని ఈ అనువాదం చూపుతుంది. అయితే ‘వారిలో ప్రధానుడు’ అనే సమీప భావం కూడా వ్యాకరణపరంగా సాధ్యమే.
- issue: יִפְרָע సూచించే దుఃఖాచారం
  choice: ‘తన తలను అస్తవ్యస్తంగా ఉంచుకోకూడదు’
  alternative: ‘తల వెంట్రుకలను విరబోసుకోకూడదు’ లేదా ‘తలను కప్పు లేకుండా ఉంచుకోకూడదు’
  rationale: పదం తల లేదా జుట్టును చెదరగా, అదుపులేకుండా వదిలేయడాన్ని సూచిస్తుంది. జుట్టు అని మాత్రమే నిర్దిష్టం చేయకుండా మూలంలోని ‘తల’ను నిలుపుతూ దుఃఖాచార భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ యాజక ప్రతిష్ఠాపన నుడికారం ఉద్దేశపూర్వకంగా ప్రధాన పాఠ్యంలో నిలుపబడింది; విరామచిహ్నాలు దీర్ఘ సంబంధ వాక్యాన్ని సులభంగా అనుసరించేందుకు సహాయపడతాయి.
