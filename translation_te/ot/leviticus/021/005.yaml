id: LEV.21.5
reference: Leviticus 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: te
  text: వారు తమ తలపై వెంట్రుకలు తీసి బట్టతలగా చేయకూడదు; తమ గడ్డం అంచును[a] గొరిగివేయకూడదు; తమ శరీరంలో కోతలు పెట్టుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గడ్డం పక్కను’ లేదా ‘గడ్డం కొనను.’ హీబ్రూ పదానికి అంచు, పక్క, లేదా కొన అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: బట్టతల మచ్చ చేసుకోకూడదు
  rationale: క్రియ–నామవాచక కలయిక ఉద్దేశపూర్వకంగా వెంట్రుకలు తొలగించి బట్టతల భాగాన్ని చేయడాన్ని సూచిస్తుంది; సహజంగా బట్టతల రావడాన్ని కాదు. ఈ తెలుగు రూపం ఆ స్పష్టమైన చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּרֹאשָׁם
  choice: తమ తలలపై
  rationale: హీబ్రూలో ఏకవచన నామవాచకానికి బహువచన ప్రత్యయం ఉన్నా, తెలుగులో సమూహంలోని ప్రతి వ్యక్తిని సూచించడానికి ‘తమ తలలపై’ సహజమైన పంపిణీ బహువచనం.
- source_word: פְאַת זְקָנָם
  choice: తమ గడ్డం అంచును
  rationale: פאה అనే పదానికి అంచు, పక్క, మూల అనే అర్థాలు ఉండవచ్చు. ఖచ్చితమైన క్షౌర విధానాన్ని అనవసరంగా నిర్దేశించకుండా ‘అంచు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְגַלֵּחוּ
  choice: గొరిగివేయకూడదు
  rationale: పియేల్ రూపం వెంట్రుకలను క్షౌరం చేసి తొలగించే చర్యను సూచిస్తుంది. ‘గొరిగివేయడం’ తొలగింపు భావాన్ని స్పష్టంగా, సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: וּבִבְשָׂרָם
  choice: తమ శరీరంలో
  rationale: בשר అక్షరార్థంగా ‘మాంసం’ అయినప్పటికీ, స్వదేహాన్ని కోసుకునే సందర్భంలో ‘శరీరంలో’ ఆధునిక తెలుగులో సహజంగా ఉండి శారీరక భావాన్ని కాపాడుతుంది.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: కోతలు పెట్టుకోకూడదు
  rationale: క్రియ–నామవాచక కలయిక శరీరాన్ని కోసి గాట్లు చేయడాన్ని సూచిస్తుంది. ‘కోతలు పెట్టుకోవడం’ వైద్యపరమైన లేదా అతిగా వివరణాత్మక పదజాలం లేకుండా ప్రత్యక్షంగా అర్థమవుతుంది.
theological_decisions:
- issue: నిషేధం యొక్క స్వభావం
  choice: శరీర మార్పుకు సంబంధించిన మూడు స్పష్టమైన నిషేధాలుగానే అనువదించడం
  alternative: లేవీయకాండము 19:28 లేదా ద్వితీయోపదేశకాండము 14:1 ఆధారంగా ‘చనిపోయినవారి కోసం’ అని ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: ఈ వచనంలో నిషేధిత చర్యలు మాత్రమే ఉన్నాయి; వాటి ఉద్దేశాన్ని వివరించే ‘చనిపోయినవారి కోసం’ అనే మాట లేదు. సమాంతర వచనంలోని వివరణను ఇక్కడి ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా మూలపాఠ్య పరిధిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. వరుసగా ఉన్న మూడు నిషేధాల సమాంతర నిర్మాణాన్ని నిలిపాం; సందర్భం ఆధారంగా శోకాచారాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించలేదు.
