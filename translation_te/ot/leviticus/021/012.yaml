  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: te
  text: అతడు పరిశుద్ధస్థలం నుండి బయటికి వెళ్లకూడదు; తన దేవుని పరిశుద్ధస్థలాన్ని అపవిత్రపరచకూడదు. ఎందుకంటే తన దేవుని అభిషేక తైలం వల్ల కలిగిన ప్రతిష్ఠ[a] అతని మీద ఉంది. నేను యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదశఃగా, “తన దేవుని అభిషేక తైలపు కిరీటం అతని మీద ఉంది.” హీబ్రూ పదానికి “కిరీటం” లేదా “ప్రతిష్ఠ” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ לֹא יֵצֵא
  choice: అతడు పరిశుద్ధస్థలం నుండి బయటికి వెళ్లకూడదు
  rationale: מִקְדָּשׁ అంటే పవిత్రమైన స్థలం లేదా ఆలయ పరిశుద్ధస్థలం; יֵצֵא యొక్క స్పష్టమైన ‘బయటికి వెళ్లడం’ అనే భావాన్ని న్యాయవిధి శైలిలో నిలిపింది.
- source_word: וְלֹא יְחַלֵּל אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: తన దేవుని పరిశుద్ధస్థలాన్ని అపవిత్రపరచకూడదు
  rationale: పీయేల్ రూపంలోని חלל ఇక్కడ పవిత్రమైనదాని పవిత్రతను భంగపరచడం లేదా దానిని అపవిత్రం చేయడం అనే ఆరాధనా సంబంధ భావాన్ని ఇస్తుంది. హీబ్రూలోని מִקְדָּשׁ పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధాలకు కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక సంధిగా అనువదించబడింది.
- source_word: נֵזֶר
  choice: ప్రతిష్ఠ
  rationale: ఈ పదానికి ‘కిరీటం/శిరోభూషణం’ మరియు ‘ప్రతిష్ఠ’ అనే భావాలు ఉన్నాయి. అభిషేక తైలంతో కలిసిన ఈ సందర్భంలో ప్రధాన పాఠ్యంలో యాజకుని ప్రతిష్ఠిత స్థితిని సహజంగా తెలిపే ‘ప్రతిష్ఠ’ను ఎంచుకుని, పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: తన దేవుని అభిషేక తైలం
  rationale: హీబ్రూ సమాసంలోని అన్ని అంశాలను సహజమైన ఆధునిక తెలుగు క్రమంలో నిలిపింది; שֶׁמֶן మִשְׁחַת అనేది అభిషేకానికి ఉపయోగించే తైలాన్ని సూచిస్తుంది.
- source_word: עָלָיו
  choice: అతని మీద ఉంది
  rationale: అభిషేకం ద్వారా కలిగిన ప్రతిష్ఠ కొనసాగుతూ అతనిపై ఉందనే స్థితిని హీబ్రూ ఉపసర్గబంధానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: యెహోవాను నేనే
  rationale: దైవ నామాన్ని లిప్యంతరీకరించి, లేవీయకాండంలోని అధికారపూర్వక దైవ ప్రకటన సూత్రాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
theological_decisions:
- issue: ప్రధాన యాజకుని స్థితికి సంబంధించి נֵזֶר అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రతిష్ఠ’
  alternative: ‘తన దేవుని అభిషేక తైలపు కిరీటం అతని మీద ఉంది’
  rationale: సందర్భంలో అభిషేక తైలం యాజకుని దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించిన స్థితిని సూచిస్తుంది. అయినప్పటికీ, נֵזֶרలో నిజంగా ఉన్న ‘కిరీటం/శిరోభూషణం’ అనే రూపక లేదా పదశః అవకాశాన్ని తొలగించకుండా పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన న్యాయవిధి శైలిని ఉపయోగించింది. ‘పరిశుద్ధస్థలం,’ ‘అపవిత్రపరచడం,’ ‘అభిషేక తైలం,’ ‘ప్రతిష్ఠ’ వంటి పదాలు యాజక సంబంధ సందర్భానికి తగినవిగా ఉండి అతిగా ప్రాచీన శైలిని నివారిస్తాయి.
