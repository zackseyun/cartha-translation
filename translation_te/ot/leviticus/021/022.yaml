id: LEV.21.22
reference: Leviticus 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: te
  text: అతడు తన దేవుని ఆహారాన్ని[a], అతి పరిశుద్ధమైన వాటిలోనుండి, పరిశుద్ధమైన వాటిలోనుండి తినవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన దేవుని రొట్టెను.’ ఇక్కడ ‘రొట్టె’ అనే పదం యాజకులకు లభించే ఆహార భాగాలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: ఈ పదానికి అక్షరార్థంగా ‘రొట్టె’ అని అర్థం ఉన్నా, బలి సంబంధమైన ధర్మశాస్త్ర సందర్భంలో యాజకునికి లభించే ఆహార భాగాలను విస్తృతంగా సూచిస్తుంది. అందువల్ల ‘ఆహారం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱלֹהָיו
  choice: తన దేవుని
  rationale: ఏకవచన పుంలింగ ప్రత్యయం యాజకుణ్ణి సూచిస్తుంది. తెలుగు ప్రతికర్తను స్పష్టంగా అనుసంధానిస్తూ ‘తన దేవుని’ అనే రూపం హెబ్రీయులోని సంబంధార్థాన్ని నిలుపుతుంది.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధమైన వాటిలోనుండి
  rationale: ఈ నిర్మాణం అత్యున్నత పరిశుద్ధతగల పవిత్ర భాగాల వర్గాన్ని సూచించే హెబ్రీయు అతిశయోక్తి రూపం. ‘అతి పరిశుద్ధమైనవి’ ఆ ఆరాధనా సంబంధ వర్గభేదాన్ని కాపాడుతుంది.
- source_word: וּמִן הַקֳּדָשִׁים
  choice: పరిశుద్ధమైన వాటిలోనుండి
  rationale: ఇది ముందటి అత్యంత పరిశుద్ధ వర్గానికి భిన్నమైన మరో పవిత్ర భాగాల వర్గాన్ని సూచిస్తుంది. రెండు పదబంధాల్లోనూ ‘పరిశుద్ధ’ అనే మూలపద సంబంధాన్ని నిలిపాం.
- source_word: יֹאכֵל
  choice: తినవచ్చు
  rationale: ఈ ధర్మశాస్త్ర సందర్భంలో క్రియ అనుమతిని వ్యక్తం చేస్తుంది. లోపమున్న యాజకుడు కొన్ని సేవలు చేయకూడదనే నిషేధానికి భిన్నంగా, పవిత్ర భాగాలు తినే హక్కు అతనికి ఉందని ‘తినవచ్చు’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో יֹאכֵל క్రియ యొక్క భావబలం
  choice: అనుమతి—‘తినవచ్చు’
  alternative: సాధారణ భవిష్యత్తు—‘తింటాడు’; విధి—‘తినాలి’
  rationale: పరిసర సందర్భం లోపమున్న యాజకుడు బలిపీఠం దగ్గరకు రావడాన్ని నిషేధించినా, పవిత్ర ఆహార భాగాలను తినేందుకు అతనికి అనుమతి కొనసాగుతుందని భేదం చూపుతుంది. అందువల్ల విధిని మోపకుండా అనుమతిని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని అనుసరించాం. ‘అతి పరిశుద్ధమైనవి’ మరియు ‘పరిశుద్ధమైనవి’ అనే పదాలతో మూలంలోని ఆరాధనా సంబంధ వర్గభేదాన్ని నిలిపాం.
