translation:
  language: te
  text: లేదా పాదం విరిగినవాడు గాని, చేయి విరిగినవాడు గాని,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “తనలో పాదానికి విరుపు గాని, చేతికి విరుపు గాని ఉన్న మనిషి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: లేదా … గాని … గాని
  rationale: ఇది అనర్హత కలిగించే శారీరక స్థితుల జాబితాను కొనసాగించే వికల్ప సంధి. తెలుగులో రెండు ప్రత్యామ్నాయాలను సహజంగా సూచించడానికి ‘గాని … గాని’ నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אִישׁ
  choice: వాడు
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో ఇది ఒక పురుషుణ్ణి సూచిస్తుంది. తెలుగు సంబంధవాచక నిర్మాణంలో ‘వాడు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: … విరిగినవాడు
  rationale: అక్షరార్థంగా ‘అతనిలో ఉండే’ అనే స్వాధీన/స్థితి నిర్మాణం. ఆధునిక తెలుగులో శారీరక స్థితిని ‘కాలు విరిగినవాడు’ అని సహజంగా వ్యక్తం చేస్తారు.
- source_word: שֶׁבֶר
  choice: విరిగిన
  rationale: ఈ నామవాచకం విరుపు లేదా ఎముక విరుగుదలను సూచిస్తుంది. ‘విరిగిన కాలు/చెయ్యి’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; ‘భగ్నం’ మరీ సాంకేతికంగా ఉంటుంది.
- source_word: רָגֶל
  choice: కాలు
  rationale: ఈ పదానికి ‘పాదం’ అనే ప్రాథమిక అర్థం ఉన్నా, విరుగుదల సందర్భంలో ఆధునిక తెలుగులో ‘కాలు విరిగిన’ అనడం సహజం. మూలంలోని పదపరిధిని గమనికలో నిలిపాం.
- source_word: שֶׁבֶר יָד
  choice: చెయ్యి విరిగినవాడు
  rationale: יָד నేరుగా చెయ్యిని సూచిస్తుంది; కొన్ని సందర్భాల్లో చెయ్యి నుంచి భుజం వరకు అవయవాన్ని కూడా సూచించవచ్చు. ఇక్కడ విస్తరించాల్సిన సందర్భోచిత అవసరం లేనందున ‘చెయ్యి’ ఎంచుకున్నాం.
