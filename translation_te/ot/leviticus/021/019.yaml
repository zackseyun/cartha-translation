  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘కాలు’ సహజ తెలుగు ప్రయోగం; అక్షరార్థమైన ‘పాదం’ గమనికలో ఇవ్వబడింది.
