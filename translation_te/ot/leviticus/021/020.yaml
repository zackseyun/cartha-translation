  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֽוֹ גִבֵּ֣ן אוֹ דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּ/עֵינ֑/וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: te
  text: లేదా వెన్ను వంగినవాడైనా[a], లేదా పొట్టిగా లేదా కృశంగా ఉన్నవాడైనా[b], లేదా కంటిలో లోపం ఉన్నవాడైనా[c], లేదా దురదగల చర్మవ్యాధి ఉన్నవాడైనా, లేదా పొక్కులు గల చర్మవ్యాధి ఉన్నవాడైనా[d], లేదా వృషణాలు నలిగినవాడైనా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వీపు వంకరగా ఉన్నవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హెబ్రీ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; అది పొట్టితనాన్ని, ఎదుగుదల నిలిచిపోవడాన్ని, లేదా కృశించిన శరీరాకృతిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘కంటిలో మచ్చ ఉన్నవాడు’; ఖచ్చితంగా ఏ కంటి లోపమో తెలియదు.
    reason: lexical_alternative
  - marker: d
    text: ఇక్కడ వాడిన రెండు హెబ్రీ పదాలు వేర్వేరు చర్మవ్యాధులను సూచించినట్లు కనిపిస్తుంది; వాటికి సరితూగే ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణలు తెలియవు.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: వెన్ను వంగినవాడు
  rationale: ఈ పదం వెన్నెముక లేదా వీపు వంగిన శారీరక స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టంగా, అవమానకరమైన ముద్ర వేయకుండా శారీరక భావాన్ని తెలియజేస్తుంది.
- source_word: דַק
  choice: ఎదుగుదల క్షీణించినవాడు
  rationale: ఈ పదం యొక్క ఖచ్చితమైన భావం అనిశ్చితం; పొట్టితనం, ఎదుగుదల నిలిచిపోవడం, లేదా శరీరం కృశించడాన్ని సూచించవచ్చు. ఎంపిక చేసిన పదబంధం ఈ విస్తృత అనిశ్చితిని కొంతవరకు నిలుపుతుంది.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: కంటిలో లోపం ఉన్నవాడు
  rationale: నిర్దిష్ట నేత్రవ్యాధిని గుర్తించడం సాధ్యం కానందున, కనిపించే కంటి అసాధారణతను తెలిపే సాధారణ పదబంధాన్ని వాడాం.
- source_word: גָרָב
  choice: దురద చర్మవ్యాధి ఉన్నవాడు
  rationale: దురద లేదా గజ్జితో కూడిన ఒక చర్మవ్యాధిని సూచిస్తుంది; ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణను రుద్దకుండా దాని సాధారణ స్వభావాన్ని తెలియజేస్తుంది.
- source_word: יַלֶּפֶת
  choice: పొక్కులు గల చర్మవ్యాధి ఉన్నవాడు
  rationale: ముందటి పదానికి భిన్నమైన మరొక చర్మవ్యాధిని సూచిస్తుంది. 'పొక్కులు గల' అనే రూపం ఖచ్చితమైన ఆధునిక వ్యాధి పేరును ఊహించకుండా రెండింటి మధ్య భేదాన్ని నిలుపుతుంది.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: వృషణాలు నలిగిపోయినవాడు
  rationale: వృషణాలకు కలిగిన నలిగిన గాయం లేదా తీవ్రమైన నష్టాన్ని నేరుగా సూచిస్తుంది. హెబ్రీ శరీరసంబంధ స్పష్టతను అస్పష్టమైన సభ్యోక్తితో కప్పిపుచ్చలేదు.
- source_word: אוֹ
  choice: లేదా
  rationale: జాబితాలోని ప్రతి ప్రత్యామ్నాయ స్థితిని గుర్తించే వియోజక అవ్యయాన్ని వరుసగా ఒకే విధంగా అనువదించాం.
theological_decisions:
- issue: యాజక పవిత్రత నియమంలో శారీరక లోపాలకు సంబంధించిన పదజాలం
  choice: నైతిక తీర్పును జోడించకుండా శారీరక స్థితులను నేరుగా వివరించడం
  alternative: కఠినత తగ్గించేందుకు సభ్యోక్తులు వాడడం లేదా ఆధునిక వైద్యపరమైన నిర్ధారణలను చేర్చడం
  rationale: ఈ వచనం బలిపీఠ సేవకు సంబంధించిన యాజక అర్హతలను పేర్కొంటుంది; ఈ శారీరక స్థితులను పాపం లేదా నైతిక దోషంగా పేర్కొనదు. అందువల్ల మూలంలోని శారీరక స్పష్టతను నిలుపుతూ అదనపు నైతిక అర్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. హెబ్రీ వాక్యంలోని పునరుక్త ‘లేదా’ నిర్మాణాన్ని నిలిపాం. అనిశ్చిత వైద్య పదాలకు అతినిర్దిష్ట ఆధునిక పేర్లు పెట్టకుండా పాదసూచనల్లో ప్రత్యామ్నాయాలను తెలిపాం.
