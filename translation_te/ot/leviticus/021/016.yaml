lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే ఈ సాధారణ హీబ్రూ సూత్రంలో דברను ఆధునిక సహజ తెలుగులో ‘చెప్పాడు’ అని అనువదించడం సముచితం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడబడిన వ్యక్తిని సూచించే אֶל‌ను తెలుగు వాక్యనిర్మాణానికి సహజమైన ‘మోషేతో’ అనే రూపంలో వ్యక్తం చేశాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే לֵאמֹר‌ను తెలుగులో సహజంగా ‘ఇలా చెప్పాడు:’ అనే నిర్మాణంలో వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో మౌనంగా భర్తీ చేయకుండా పేరుగా నిలిపాం; తెలుగులో పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దైవిక ప్రసంగ పరిచయం. తరువాతి వచనంలో సందేశం కొనసాగుతుందని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
