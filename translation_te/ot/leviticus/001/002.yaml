source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] మాట్లాడి వారికి ఇలా చెప్పు: ‘మీలో ఒక మనిషి[b] యాహ్వేకు అర్పణను తీసుకొచ్చినప్పుడు, పెంపుడు పశువులలోనుండి—గోవుల మందలోనుండిగాని, గొర్రెలు మేకల మందలోనుండిగాని—మీరు మీ అర్పణను తీసుకురావాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో” లేక “ఇశ్రాయేలు ప్రజలతో.” హీబ్రూ మూలంలో “ఇశ్రాయేలు కుమారులతో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “ఒక మనిషి” అని ఉంది; ఇక్కడ అది ప్రతినిధి అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ సంబోధనా సూత్రంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אָדָם
  choice: ఎవరైనా
  rationale: ఇక్కడ אָדָם ఒక వ్యక్తిని ప్రతినిధిగా చూపే షరతు వాక్యాన్ని ప్రారంభిస్తుంది. ఆధునిక తెలుగులో ‘మీలో ఎవరైనా’ సహజంగా ఉండి, పురుషులకు మాత్రమే పరిమితం చేయకుండా మూలంలోని ప్రతినిధి భావాన్ని అందిస్తుంది.
- source_word: יַקְרִיב
  choice: అర్పణ తీసుకొస్తే
  rationale: קרב హిఫీల్ రూపం బలిసంబంధ సందర్భంలో దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావం ఇస్తుంది; ‘తీసుకొస్తే’ దాని కదలిక భావాన్ని నిలుపుతుంది.
- source_word: מִכֶּם
  choice: మీలో
  rationale: సమాజంలో ఒక వ్యక్తి అనే విభాగార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קָרְבָּן
  choice: అర్పణ
  rationale: קָרְבָּןకు ఉన్న విస్తృత బలిసంబంధ అర్థాన్ని ‘బలి’కన్నా ‘అర్పణ’ సముచితంగా అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: బలికి తగిన పెంపుడు జంతువుల సమగ్ర వర్గాన్ని సూచిస్తుంది.
- source_word: הַבָּקָר
  choice: పశువుల మంద
  rationale: ఇది ప్రత్యేకంగా గోవుల వర్గాన్ని సూచిస్తుంది; తెలుగు వాడుకలో సందర్భానుసారంగా ‘పశువుల మంద’ సహజంగా ఉంటుంది.
- source_word: הַצֹּאן
  choice: గొర్రెలు మేకల మంద
  rationale: చిన్న పశువులైన గొర్రెలు, మేకలు రెండింటినీ స్పష్టంగా తెలిపి హీబ్రూ సమూహపద పరిధిని అందిస్తుంది.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: మీ అర్పణను తీసుకురావాలి
  rationale: ఏకవచన ఉదాహరణ తర్వాత సమాజాన్ని ఉద్దేశించిన హీబ్రూ బహువచనాన్ని ‘మీ’ ద్వారా నిలిపి, ముందటి క్రియతో పదబంధ సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరు రూపంలో ఉంచాం; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘యెహోవా’ ఎక్కువగా పరిచితం, అయితే ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: אָדָםలోని ప్రతినిధి ఏకవచనం
  choice: ఎవరైనా
  alternative: ఒక మనిషి
  rationale: ఈ నియమం సమాజంలోని ఏ వ్యక్తికైనా వర్తించే షరతును ప్రవేశపెడుతుంది. లింగాన్ని అనవసరంగా పరిమితం చేయకుండా ప్రతినిధి భావాన్ని సహజ తెలుగులో నిలిపాం; మూలంలోని ‘మనిషి’ అనే రూపాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ప్రధాన పాఠంలో హీబ్రూ రూపాన్ని స్పష్టంగా నిలిపి, ఆధునిక సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శాసన శైలిని ఉపయోగించాం. మూలంలోని ఏకవచన ఉదాహరణ నుంచి బహువచన సమాజ ఆదేశానికి వచ్చే మార్పును ‘ఎవరైనా’ మరియు ‘మీ అర్పణ’ ద్వారా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
