  to: '“ఇశ్రాయేలు కుమారులతో[a] మాట్లాడి వారికి ఇలా చెప్పు: ‘మీలో ఒక మనిషి[b] యాహ్వేకు అర్పణను తీసుకొచ్చినప్పుడు, పెంపుడు పశువులలోనుండి—గోవుల మందలోనుండిగాని, గొర్రెలు మేకల మందలోనుండిగాని—మీరు మీ అర్పణను తీసుకురావాలి.’”'
