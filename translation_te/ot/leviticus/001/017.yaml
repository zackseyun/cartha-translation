id: LEV.1.17
reference: Leviticus 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అతడు దాని రెక్కల వద్ద దాన్ని చీల్చి తెరవాలి, కాని దాన్ని పూర్తిగా విడదీయకూడదు. యాజకుడు దాన్ని బలిపీఠం మీద, అగ్నిమీద ఉన్న కట్టెలపై దహించాలి. అది యాహ్వేకు దహనబలి, అగ్నితో అర్పించే అర్పణ[a], ఇంపైన సువాసన.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అగ్ని అర్పణ.’
    reason: אִשֵּה అనే బలిసంబంధ పదానికి సాధ్యమైన సంక్షిప్త ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: שִׁסַּע
  choice: చీల్చి తెరవాలి
  rationale: పక్షి దేహాన్ని చీల్చి తెరవడాన్ని సూచిస్తుంది; తరువాతి ‘పూర్తిగా విడదీయకూడదు’ అనే ఆదేశంతో సహజంగా సరిపోతుంది.
- source_word: בִכְנָפָיו
  choice: దాని రెక్కల దగ్గర
  rationale: בְּ ఉపసర్గ స్థలాన్ని లేదా సాధనాన్ని సూచించగలదు. తెలుగు వాక్యంలో సహజంగా ఉండేలా స్థలార్థాన్ని ఎంచుకుని, రెక్కలనే స్పష్టంగా నిలిపింది.
- source_word: לֹא יַבְדִּיל
  choice: దాన్ని పూర్తిగా విడదీయకూడదు
  rationale: בדל యొక్క హిఫీల్ రూపం వేరు చేయడం లేదా విభజించడం అని అర్థం. ‘పూర్తిగా’ అనేది పక్షిని తెరవాలి గాని రెండు భాగాలుగా చేయకూడదనే వ్యత్యాసాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిసంబంధ సందర్భంలో బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది; ‘దహించాలి’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: అగ్నిమీద ఉన్న కట్టెలపై
  rationale: హీబ్రూ వాక్యంలో ఉన్న కట్టెలు–అగ్ని అమరికను అతివ్యాఖ్యానం చేయకుండా సహజమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: లేవీయకాండంలోని పూర్తిగా దహించే బలికి స్థిరమైన, అర్థవంతమైన తెలుగు బలిసంబంధ పదం.
- source_word: אִשֵּׁה
  choice: అగ్నితో అర్పించే అర్పణ
  rationale: ఈ అరుదైన బలిసంబంధ నామవాచకానికి అగ్నితో సమర్పించే అర్పణ అనే అర్థాన్ని నేరుగా తెలియజేస్తుంది; సాధ్యమైన ప్రత్యామ్నాయం పాదటిప్పణిలో నిలిపింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: బలి దేవునికి ఆమోదయోగ్యంగా ఉండటాన్ని వ్యక్తపరిచే రూపకాన్ని సిద్ధాంతపరంగా విస్తరించకుండా సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ల ఉపసర్గలోని సంబంధం లేదా దిశను ‘కు’తో తెలిపి, יהוה అనే దైవనామాన్ని పేరుగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: רֵיחַ נִיחֹחַ అనే బలిసంబంధ సూత్రవాక్యం
  choice: ఇంపైన సువాసన
  alternative: శాంతినిచ్చే సువాసన
  rationale: దైవిక ఆమోదాన్ని సూచించే బలి రూపకాన్ని నిలిపి, పాఠ్యంలో లేని తరువాతి సిద్ధాంత భావాలను చేర్చదు.
- issue: אִשֵּׁה యొక్క అర్థం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: అగ్ని అర్పణ
  rationale: ఈ పదం ‘ఆహారం’ అని తప్పనిసరిగా చెప్పదు; అగ్నితో సమర్పించే బలి అనే మూలార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బలిసంబంధ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ఆదేశాలను ‘చేయాలి/చేయకూడదు’ రూపాల్లో ఇచ్చి, పక్షిని తెరవడం మరియు పూర్తిగా విడదీయకపోవడం మధ్య వ్యత్యాసాన్ని నిలిపింది.
