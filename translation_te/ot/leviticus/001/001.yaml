source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేను పిలిచాడు; అతనితో సమావేశపు గుడారం నుండి మాట్లాడి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో יהוה (YHWH) అనే దైవనామం ఉంది; దానిని ఇక్కడ “యాహ్వే” అని లిప్యంతరీకరించారు.
    reason: దైవనామం మూలరూపాన్ని, అనువాద నిర్ణయాన్ని పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא ఇక్కడ మోషేకు దేవుడు సంబోధించడాన్ని సూచిస్తుంది. ‘పిలిచాడు’ సహజంగా ఉండి, హెబ్రీలో లేని బలవంతపు ఆజ్ఞ భావాన్ని జోడించదు.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేను
  rationale: క్రియతో కూడిన אֶל భావాన్ని తెలుగులో సహజమైన కర్మవిభక్తితో వ్యక్తం చేశాం.
- source_word: וַיְדַבֵּר
  choice: మాట్లాడుతూ
  rationale: דבר లోని ‘మాట్లాడు’ భావాన్ని నిలిపి, తరువాతి לֵאמֹרను ‘ఇలా అన్నాడు’గా వేరుగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: ప్రత్యయం తిరిగి మోషేనే సూచిస్తుంది; ‘అతనితో మాట్లాడాడు’ అనే తెలుగు ప్రయోగం సహజమైనది.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం నుండి
  rationale: אֹהֶל מוֹעֵדను దాని ప్రాథమిక భావానికి దగ్గరగా అనువదించాం. ‘ప్రత్యక్ష గుడారం’ అనే సంప్రదాయ పదం మూలంలో స్పష్టంగా లేని ‘ప్రత్యక్షత’ భావాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ సూత్రప్రయోగాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וַ־
  choice: అప్పుడు
  rationale: ఆదిలోని కథన సంధి నిర్గమకాండ ముగింపు నుంచి కొనసాగే సంఘటనల క్రమాన్ని సూచిస్తుంది; ‘అప్పుడు’ ఆ పురోగతిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం ఉంది. ‘యాహ్వే’ దానిని వ్యక్తిగత నామంగా నిలుపుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారితమైందని మాత్రం భావింపజేయదు.
- issue: אֹהֶל מוֹעֵד అర్థం
  choice: సమావేశ గుడారం
  alternative: ప్రత్యక్ష గుడారం
  rationale: מוֹעֵדకు నియమిత సమయం లేదా సమావేశం అనే భావాలు ఉన్నాయి. సందర్భంలో దేవుడు మోషేతో కలుసుకొని మాట్లాడే పవిత్ర గుడారం ఉద్దేశించబడింది; ‘సమావేశ గుడారం’ మూలపదానికి సన్నిహితంగా ఉండి అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ వాక్యంలోని ‘పిలిచాడు—మాట్లాడాడు—అన్నాడు’ అనే క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో అసహజమైన పునరుక్తిని నివారించేందుకు ‘మాట్లాడుతూ ఇలా అన్నాడు’ అని అమర్చాం. ప్రత్యక్ష వాక్యం తదుపరి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర ద్విబిందువు ఉంచాం.
