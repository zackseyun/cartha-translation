source:
  edition: WLC
  text: וְ/קִרְבּ֥/וֹ וּ/כְרָעָ֖י/ו יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיח֖וֹחַ לַֽ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: te
  text: అతడు దాని అంతర్భాగాలను, కాళ్లను నీళ్లతో కడగాలి; యాజకుడు దానినంతటినీ బలిపీఠంపై పొగగా అర్పించాలి. అది యాహ్వేకు ఇంపైన సువాసనగల దహనబలి, అగ్ని అర్పణ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార అర్పణ.” ఈ హీబ్రూ పదాన్ని “అగ్ని ద్వారా చేసే అర్పణ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇంపైన సువాసన” అనేది బలి యాహ్వేకు ఆమోదయోగ్యమని సూచించే స్థిరమైన బలి-సంబంధ సూత్రవాక్యం.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: దాని అంతర్భాగాలను
  rationale: బలి జంతువు కడగవలసిన లోపలి అవయవాలను సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: כְרָעָיו
  choice: కాళ్లను
  rationale: జంతువు దిగువ కాళ్లను సూచించే పదం; సాంకేతిక పదం కంటే సాధారణ పాఠకులకు సులభమైన రూపం.
- source_word: יִרְחַץ בַּמָּיִם
  choice: నీళ్లతో కడగాలి
  rationale: హీబ్రూ క్రియలోని కడిగే చర్యను, సాధనాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וְהִקְטִיר
  choice: పొగగా పైకి లేచేలా దహించాలి
  rationale: సాధారణంగా కాల్చడం మాత్రమే కాక, బలిని బలిపీఠంపై పొగగా పైకి వెళ్లేలా చేయడం అనే యాజక బలి సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֶת־הַכֹּל
  choice: దానినంతటినీ
  rationale: సిద్ధం చేసిన జంతువు మొత్తాన్ని అర్పించాలనే సంపూర్ణతను వ్యక్తం చేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: ఈ బలి విధానానికి తెలుగులో స్థిరంగా, సులభంగా అర్థమయ్యే పదం; పైకి ఎక్కడం అనే వ్యుత్పత్తిని బలవంతంగా ముందుకు తేవదు.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: అగ్ని ద్వారా సమర్పించే బలిని సూచించే సాంప్రదాయిక అర్థాన్ని నిలుపుతుంది; ‘ఆహార అర్పణ’ అనే సాధ్యమైన అవగాహనను పాదసూచికలో ఉంచి అసలు పదంలోని అనిశ్చితిని కాపాడింది.
- source_word: רֵיחַ נִיחוֹחַ
  choice: ఇంపైన సువాసన
  rationale: దేవునికి బలి ఆమోదయోగ్యమని సూచించే స్థిరమైన బలి రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలపాఠంలోని దైవ నామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవ నామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా అందిస్తుంది.
- issue: רֵיחַ נִיחוֹחַ అనే బలి సూత్రవాక్య భావం
  choice: ఇంపైన సువాసన
  alternative: శాంతినిచ్చే సువాసన; ఆమోదయోగ్యమైన అర్పణ
  rationale: మూలంలోని సువాసన రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం దేవుడు వాసన చూడడమనే యాంత్రిక భావంగా వ్యాఖ్యానించదు.
- issue: אִשֶּׁה అర్థం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదానికి అగ్ని ద్వారా సమర్పించే అర్పణ అనే సాంప్రదాయిక అవగాహన ఉంది; యాజక గ్రంథపు బలి సందర్భంలో ‘ఆహార అర్పణ’ అనే వివరణ కూడా ప్రతిపాదించబడినందున దానిని పాదసూచికలో చూపించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అందుబాటులో ఉండే శైలి. యాజక బలి పదజాలాన్ని స్పష్టంగా ఉంచి, వాక్యాన్ని అతిగా సాంకేతికంగా చేయలేదు.
