revisions:
- from: అయితే దాని అంతర్భాగాలను, కాళ్లను నీళ్లతో కడగాలి. యాజకుడు దానినంతటినీ బలిపీఠం మీద పొగగా పైకి లేచేలా దహించాలి. అది దహనబలి—యాహ్వేకు ఇంపైన సువాసనగా ఉండే అగ్ని అర్పణ[a][b].
