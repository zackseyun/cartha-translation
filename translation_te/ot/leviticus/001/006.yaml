  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: te
  text: తర్వాత అతడు దహనబలి చర్మాన్ని ఒలిచి, దానిని దాని ముక్కలుగా కోయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బలి జంతువును బలి ఆచారానికి భాగాలుగా విభజించడం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: చర్మాన్ని ఒలిచి
  rationale: హిఫిల్ రూపంలోని פשט ఇక్కడ బలి జంతువు చర్మాన్ని తొలగించడాన్ని సూచిస్తుంది. ‘చర్మాన్ని ఒలిచి’ అనేది ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఆ క్రియను తెలియజేస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה లేవీయకాండంలోని పూర్తిగా దహనం చేసే బలికి ప్రామాణిక ఆచార పదం. ‘దహనబలి’ తెలుగులో స్థిరపడిన, స్పష్టమైన పదం.
- source_word: וְנִתַּח
  choice: కోయాలి
  rationale: נתח బలి జంతువును విభాగాలుగా కోయడాన్ని సూచిస్తుంది. తరువాతి ‘ముక్కలుగా’ అనే మాటతో కలిసి ‘కోయాలి’ ఆచార చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִנְתָחֶיהָ
  choice: దాని ముక్కలుగా
  rationale: נתח అంటే కోసిన ముక్క లేదా విభాగం; ఇక్కడ ל ఫలితార్థకంగా ఉండి జంతువును నిర్దిష్ట భాగాలుగా విభజించడాన్ని సూచిస్తుంది. ‘దాని ముక్కలుగా’ మూలంలోని స్వామ్య ప్రత్యయాన్ని కూడా నిలుపుతుంది.
- source_word: וְ
  choice: తర్వాత
  rationale: ముందటి వచనంలోని ప్రక్రియకు కొనసాగింపుగా వచ్చే క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘దహనబలి’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, మిగతా క్రియలను సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా వ్యక్తం చేశాం.
