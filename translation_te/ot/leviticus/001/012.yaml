  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: te
  text: అతడు దానిని దాని ముక్కలుగా కోయాలి; దాని తలను, దాని కొవ్వును[a] కూడా కోయాలి. యాజకుడు వాటిని బలిపీఠం మీద ఉన్న అగ్నిపై ఉన్న కట్టెల మీద క్రమంగా అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని అంతర్భాగాలను కప్పే కొవ్వు.” హీబ్రూ పదం బలి జంతువుకు సంబంధించిన కొవ్వు కణజాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: అతడు దానిని దాని ముక్కలుగా కోయాలి
  rationale: బలి జంతువును నిర్దిష్ట ముక్కలుగా కోసే ఆచారపరమైన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֶת רֹאשׁוֹ
  choice: దాని తలను ... కూడా వేరు చేయాలి
  rationale: హీబ్రూ వాక్యంలో తల, కొవ్వు ముక్కలతో కలిపి అమర్చబడే ప్రత్యేక భాగాలుగా పేర్కొనబడ్డాయి. తెలుగులో క్రియను పూరించడం ద్వారా చర్య స్పష్టంగా ఉంటుంది.
- source_word: וְאֶת פִּדְרוֹ
  choice: దాని కొవ్వును
  rationale: פדר బలి జంతువుతో సంబంధమున్న కొవ్వు కణజాలాన్ని సూచిస్తుంది. ‘కొవ్వు’ సాధారణ పాఠకులకు సహజమైన పదం; ఖచ్చిత పరిధి అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: וְעָרַךְ
  choice: క్రమంగా అమర్చాలి
  rationale: ఆచార సందర్భంలో ערך కేవలం పెట్టడం కాకుండా క్రమపద్ధతిలో అమర్చడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని כהןకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: אֹתָם
  choice: వాటిని
  rationale: కోయబడిన ముక్కలు, తల, కొవ్వు అన్నిటినీ సమష్టిగా సూచిస్తుంది.
- source_word: עַל הָעֵצִים
  choice: కట్టెల మీద
  rationale: హీబ్రూలోని బహువచన భావాన్ని బలిపీఠపు అగ్నికి ఉపయోగించే కట్టెలుగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద ఉన్న అగ్నిపై ఉన్న కట్టెల మీద
  rationale: కట్టెలు అగ్నిపై, అగ్ని బలిపీఠంపై ఉన్నాయనే హీబ్రూ వాక్యంలోని పొరలుగల స్థల వివరణను నిలుపుతుంది.
