source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: te
  text: అయితే అతడు దాని లోపలి భాగాలను, కాళ్లను నీళ్లతో కడగాలి. యాజకుడు దానినంతటినీ సమర్పించి, బలిపీఠం మీద దహింపజేయాలి. అది దహనబలి, యెహోవాకు అగ్న్యర్పణం, ఇంపైన సువాసన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహార అర్పణం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: పేగులు
  rationale: బలి సందర్భంలో జంతువు లోపలి అవయవాలను సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టంగా ఉండే конкретమైన పదం.
- source_word: הַכְּרָעַיִם
  choice: కాళ్లు
  rationale: బలి జంతువు కాళ్లను, ముఖ్యంగా కింది భాగాలను సూచిస్తుంది; ‘కాళ్లు’ సహజమైన ఆధునిక తెలుగు.
- source_word: יִרְחַץ בַּמָּיִם
  choice: నీళ్లతో కడగాలి
  rationale: רחץ అనే క్రియలోని కడగడం భావాన్నీ, בַּמָּיִם లోని సాధనార్థక ‘నీళ్లతో’ భావాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: וְהִקְרִיב
  choice: సమర్పించి
  rationale: హిఫిల్ రూపం బలిని దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే ఆచారపరమైన భావాన్ని ఇస్తుంది; తరువాతి దహనక్రియతో దీనిని కలపలేదు.
- source_word: אֶת־הַכֹּל
  choice: దానినంతటినీ
  rationale: సిద్ధం చేసిన బలి మొత్తాన్ని సూచించే సంపూర్ణతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִקְטִיר
  choice: పొగగా పైకి లేవనివ్వాలి
  rationale: ఇది సాధారణంగా కాల్చడం మాత్రమే కాక, బలిని బలిపీఠం మీద పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచించే ప్రత్యేక బలిపదం.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: బలి దహనం జరిగే స్థలాన్ని సహజంగా, ఖచ్చితంగా తెలుపుతుంది.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా దహనం చేసే ఈ ప్రత్యేక బలికి తెలుగులో స్థిరపడిన, స్పష్టమైన సమానార్థకం.
- source_word: אִשֵּׁה
  choice: అగ్న్యర్పణం
  rationale: అగ్నితో సమర్పించే అర్పణ అనే మూలభావాన్ని నేరుగా కాపాడుతుంది; ‘ఆహార అర్పణ’ అనే సాధ్యమైన వర్గార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: רֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసన
  rationale: బలి దేవునికి ఆమోదయోగ్యంగా ఉండటాన్ని తెలిపే ఇంద్రియాత్మక రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: רֵיחַ נִיחֹחַ లో దేవునికి అన్వయించిన ఇంద్రియాత్మక బలి భాష
  choice: ఇంపైన సువాసన
  alternative: శాంతింపజేసే సువాసన
  rationale: దైవిక అంగీకారాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది; అదే సమయంలో దేవుని శరీరధర్మాల గురించి అదనపు నిర్ధారణ చేయదు.
- issue: אִשֵּׁה యొక్క అర్థం
  choice: అగ్న్యర్పణం
  alternative: ఆహార అర్పణ
  rationale: పదంలోని అగ్ని-సంబంధ మూలభావానికి ప్రాధాన్యం ఇచ్చింది. బలి ‘ఆహారం’ అనే వర్గార్థం సాధ్యమైనందున దానిని పాదటిప్పణిలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మొదటి క్రియకు బలి అర్పించే వ్యక్తి, తరువాతి క్రియలకు యాజకుడు కర్తగా ఉన్న హీబ్రూ మార్పును స్పష్టంగా కాపాడింది.
