id: LEV.1.10
reference: Leviticus 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: te
  text: అయితే అతని అర్పణ మందలోనిది—గొర్రెలలోనిదైనా లేదా మేకలలోనిదైనా—దహనబలి కోసమైతే, అతడు లోపంలేని[a] మగ జంతువును అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లోపంలేని” అంటే ఈ బలికి కావలసిన విధంగా శారీరక దోషం లేనిదని అర్థం.
    reason: బలి సందర్భంలో תָּמִים కు ఉన్న ప్రత్యేక అర్థాన్ని సాధారణ పాఠకునికి వివరిస్తుంది.
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: మునుపటి బలి విధానానికి కొనసాగింపుగా తదుపరి షరతును సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; וְ యొక్క అనుసంధాన భావం, אִם యొక్క షరతు రెండూ సందర్భంలో నిలుస్తాయి.
- source_word: מִן הַצֹּאן
  choice: మందలోనిది
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచిస్తుంది; వెంటనే వచ్చే గొర్రెలు/మేకలు అనే విభజనను పునరుక్తి లేకుండా ఉంచుతుంది.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: ఆరాధనలో దేవుని సన్నిధికి తీసుకువచ్చే బలిని సూచించే קָרְבָּן కు స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: מִן הַכְּשָׂבִים
  choice: గొర్రెలలోనిది
  rationale: వయస్సును అనవసరంగా పరిమితం చేయకుండా כְּשָׂבִים యొక్క జాతి వర్గార్థాన్ని నిలుపుతుంది.
- source_word: אוֹ מִן הָעִזִּים
  choice: మేకలలోనిదైనా
  rationale: עִזִּים ను సహజమైన తెలుగు జాతి బహువచనంగా అందిస్తుంది; אוֹ యొక్క ప్రత్యామ్నాయ భావాన్ని ‘అయినా’ నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה అనే సంపూర్ణంగా దహించబడే బలి వర్గానికి తెలుగులో స్థిరమైన, అర్థమయ్యే పదం; לְ ను ఇక్కడ ‘గా/అర్పించడానికి’ అనే ప్రయోజన భావంతో వ్యక్తం చేస్తుంది.
- source_word: זָכָר
  choice: మగదానిని
  rationale: బలి జంతువు లింగాన్ని మూలపాఠం పేర్కొన్నట్లే స్పష్టంగా నిలుపుతుంది.
- source_word: תָּמִים
  choice: లోపంలేని
  rationale: బలి సందర్భంలో శారీరక దోషం లేని స్థితిని సూచిస్తుంది; ‘పరిపూర్ణమైన’ అనే విస్తృత లేదా నైతిక భావాన్ని రుద్దదు.
- source_word: יַקְרִיבֶנּוּ
  choice: అతడు అర్పించాలి
  rationale: హిఫిల్ రూపంలోని బలిగా సమర్పించే భావాన్ని, ఆదేశాత్మక బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; కర్మను ముందున్న ‘మగదానిని’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: עֹלָה అనే బలి పదం
  choice: దహనబలి
  alternative: ఆరోహణ బలి
  rationale: పదవ్యుత్పత్తిలో ‘పైకి ఎక్కేది’ అనే ఛాయ ఉన్నప్పటికీ, లేవీయకాండపు బలి విధానంలో ఇది పూర్తిగా దహించే స్థిర బలి వర్గం. ‘దహనబలి’ పాఠకులకు స్పష్టంగా ఉంటుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: బలి జంతువు లింగ నిర్దేశం
  choice: మగదానిని
  alternative: ఒక జంతువును
  rationale: זָכָר జంతువు మగదై ఉండాలనే నియమాన్ని స్పష్టంగా చెబుతుంది; లింగాన్ని సాధారణీకరించడం మూలపాఠంలోని అర్హతను తొలగిస్తుంది.
- issue: תָּמִים యొక్క బలి సందర్భార్థం
  choice: లోపంలేని
  alternative: పరిపూర్ణమైన
  rationale: ఇక్కడ నైతిక పరిపూర్ణత కాదు, బలికి తగిన శారీరక దోషరాహిత్యమే ఉద్దేశం. అనువాదం ఆ పరిమిత సందర్భార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైనదైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘మంద’ తర్వాత గొర్రెలు, మేకలు అనే వివరణను డాష్‌లతో స్పష్టం చేశాం. సంప్రదాయ బైబిలు పదమైన ‘దహనబలి’ని ఉంచి, అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
