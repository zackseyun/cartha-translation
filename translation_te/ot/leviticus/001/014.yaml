id: LEV.1.14
reference: Leviticus 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: te
  text: అతని అర్పణ యాహ్వేకు పక్షులలోనుండి దహనబలి అయితే, అతడు తాబేలు పావురాలలోనుండి గానీ పావురపు పిల్లలలోనుండి గానీ తన అర్పణను సమర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ఇది ముందు చెప్పిన బలి విధానాలకు కొనసాగింపుగా మరో షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో షరతు భాగం చివర ‘అయితే’ సహజంగా ఉంటుంది.
- source_word: מִן הָעוֹף
  choice: పక్షుల్లోనుండి
  rationale: עוֹף ఇక్కడ బలికి ఉపయోగించే ఎగిరే జీవులను, అంటే పక్షులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పక్షులు’ స్పష్టమైన సాధారణ పదం.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తంగా బలిపీఠంపై దహించబడే ప్రత్యేక బలి వర్గానికి తెలుగులో స్థిరంగా అర్థమయ్యే పదం; మూలపదంలోని ‘పైకి ఎక్కడం’ భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: קָרְבָּן దేవుని సమక్షానికి తీసుకువచ్చే కానుక లేదా బలిని సూచిస్తుంది; సందర్భంలో ‘అర్పణ’ సహజంగాను విస్తృతంగాను సరిపోతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל యొక్క గ్రహీత/దిశ భావాన్ని ‘-కు’ తెలియజేస్తుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהִקְרִיב
  choice: సమర్పించాలి
  rationale: קרב హిఫీల్ రూపం బలిని దగ్గరకు తీసుకురావడం లేదా ఆచారపూర్వకంగా సమర్పించడం అనే భావం ఇస్తుంది; విధినిర్దేశక సందర్భంలో ‘సమర్పించాలి’ సహజం.
- source_word: מִן הַתֹּרִים
  choice: గువ్వల్లోనుండి
  rationale: תֹּרִים ప్రత్యేకంగా turtledoves‌ను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో వాటికి సహజమైన పేరు ‘గువ్వలు’.
- source_word: אוֹ
  choice: గానీ ... గానీ
  rationale: అనుమతించబడిన రెండు ప్రత్యామ్నాయ పక్షి రకాల మధ్య ఉన్న వికల్పాన్ని సహజ తెలుగు జంట నిర్మాణంతో తెలియజేస్తుంది.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: పావురపు పిల్లల్లోనుండి
  rationale: ‘యోనా సంతానం’ అనే హీబ్రూ నుడికారం చిన్న పావురాలను సూచిస్తుంది; వయస్సు సూచనను నిలుపుతూ తెలుగులో స్పష్టంగా అనువదించాం.
- source_word: אֶת קָרְבָּנוֹ
  choice: తన అర్పణగా ... ఒకదాన్ని
  rationale: మూలంలోని పునరుక్త ‘అతని అర్పణను’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, రెండు సమూహాల్లో ఏదో ఒక పక్షిని సమర్పించాలనే ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం; ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’, అయితే ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్ర విధినిర్దేశానికి తగిన గంభీరతను ఉంచుతూ, అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. మూలంలోని షరతు, రెండు పక్షి రకాల ఎంపిక, దహనబలి అనే ఆచార వర్గం నిలుపబడ్డాయి.
