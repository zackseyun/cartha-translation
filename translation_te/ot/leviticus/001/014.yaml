  terminology: Use 'యాహ్వే' for יהוה in accordance with the project’s stated policy. Render תֹּרִים with the more specific 'తాబేలు పావురాలు' rather than the broad 'గువ్వలు'; retain 'పావురపు పిల్లలు' for בְּנֵי הַיּוֹנָה.
