- from: అతని అర్పణ యెహోవాకు పక్షుల్లోనుండి అర్పించే దహనబలి అయితే, అతడు తన అర్పణగా గువ్వల్లోనుండి గానీ పావురపు పిల్లల్లోనుండి గానీ ఒకదాన్ని సమర్పించాలి.
