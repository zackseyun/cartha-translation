id: LEV.1.16
reference: Leviticus 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: te
  text: అతడు దాని ఆహార సంచి[a]ని దాని ఈకలతో సహా[b] తీసివేసి, బలిపీఠం పక్కన, తూర్పు వైపున, బూడిద ఉన్న స్థలానికి పడవేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పక్షి తిన్న ఆహారం నిలిచే సంచి వంటి భాగం; దీనిని ‘పంటికడుపు’ లేదా ‘క్రాప్’ అని కూడా అనవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఈకలతో’ అని ఉన్న హీబ్రూ పదాన్ని కొందరు ‘దానిలోని మలినంతో’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: తీసివేసి
  rationale: సור ధాతువు హిఫీల్ రూపం ఇక్కడ ఒక భాగాన్ని తొలగించడాన్ని సూచిస్తుంది; ‘తీసివేసి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מֻרְאָתוֹ
  choice: దాని పొట్ట
  rationale: పక్షి శరీర నిర్మాణ సందర్భంలో ఇది ఆహారం నిలిచే crop/craw భాగాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు ‘పొట్ట’ సులభంగా అర్థమవుతుంది; మరింత నిర్దిష్టమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּנֹצָתָהּ
  choice: దాని ఈకలతో సహా
  rationale: వ్యంజన పాఠం נוצה (‘ఈక/పక్షిరోమం’)తో సహజంగా సంబంధిస్తుంది. వాక్యంలోని సాధనార్థక/సహార్థక భావాన్ని ‘తో సహా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: పడవేయాలి
  rationale: שלך హిఫీల్ రూపం విసరడం లేదా పడవేయడాన్ని సూచిస్తుంది; ఆచార విధి ఆజ్ఞకు ‘పడవేయాలి’ సహజంగా సరిపోతుంది.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కన
  rationale: אצל సమీపంలో, ప్రక్కన అనే స్థానార్థాన్ని ఇస్తుంది; ‘పక్కన’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: קֵדְמָה
  choice: తూర్పు వైపున ఉన్న
  rationale: దిశాసూచక రూపం తూర్పు దిశ లేదా తూర్పు భాగాన్ని నిర్దేశిస్తుంది; బూడిద స్థలం ఎక్కడుందో తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: బూడిద స్థలంలో
  rationale: బలిపీఠపు అవశేష బూడిద కోసం నిర్ణయించిన స్థలాన్ని సూచిస్తుంది. గమ్యస్థాన భావం తెలుగులో ‘స్థలంలో పడవేయాలి’ అనే నిర్మాణంతో సహజంగా వ్యక్తమవుతుంది.
