translation_notes:
  register: ఆచార విధిని తెలిపే గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. శరీర నిర్మాణానికి సంబంధించిన అరుదైన సాంకేతిక పదానికి బదులుగా ప్రధాన పాఠంలో సాధారణ పదం ఉంచి, నిర్దిష్ట అర్థాన్ని పాదసూచికలో వివరించాం. మూలంలోని క్లిష్టమైన בְּנֹצָתָהּ పఠన భేదాన్ని పరిష్కరించకుండా పాదసూచికలో నిలిపాం.
