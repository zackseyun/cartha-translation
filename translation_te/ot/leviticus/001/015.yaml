  register: ఆధునిక ప్రామాణిక తెలుగులో, బలుల నియమావళికి తగిన గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. సాంకేతిక బలిక్రియను సాధారణ పాఠకునికి అర్థమయ్యేలా ప్రధాన పాఠ్యంలో స్పష్టీకరించి, ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో నిలిపాం.
