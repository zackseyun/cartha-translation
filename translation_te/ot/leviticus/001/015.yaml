id: LEV.1.15
reference: Leviticus 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: te
  text: యాజకుడు దానిని బలిపీఠం దగ్గరకు తీసుకువచ్చి, దాని తలను నొక్కి తెంపి[a], బలిపీఠం మీద దానిని దహించాలి. దాని రక్తం బలిపీఠపు ప్రక్కపై పిండబడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని తలను మెలిపెట్టి తెంపి.’ ఇక్కడి హీబ్రూ క్రియ పక్షిబలిని యాజకుడు చంపే ప్రత్యేక విధానాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరాలా, ‘బలిపీఠపు గోడపై.’ హీబ్రూ పదం ‘గోడ’ అని అర్థం; ఇక్కడ అది బలిపీఠపు పక్కభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: దానిని ... దగ్గరకు తీసుకువచ్చి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావాన్ని ఇస్తుంది; వెంటనే אֶל הַמִּזְבֵּחַ రావడం వల్ల ఇక్కడ కదలికను స్పష్టంగా చూపే ఈ రూపం సహజంగా ఉంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: బలుల నియమావళిలో כֹּהֵןకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరకు
  rationale: אֶל గమ్యస్థానం వైపు కదలికను సూచిస్తుంది; తెలుగు వాక్యంలో ‘దగ్గరకు తీసుకువచ్చి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וּמָלַק
  choice: గిల్లి తెంపి
  rationale: מלק పక్షిబలిని యాజకుడు ప్రత్యేక పద్ధతిలో చంపడాన్ని సూచించే సాంకేతిక క్రియ. ‘గిల్లి తెంపి’ గోరుతో నొక్కి/గిల్లి తలను వేరుచేసే చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; క్రియలోని ఖచ్చిత విధానంపై ఉన్న పరిమిత అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: אֶת רֹאשׁוֹ
  choice: దాని తలను
  rationale: పక్షిబలినే సూచించే ప్రత్యక్ష కర్మ.
- source_word: וְהִקְטִיר
  choice: దహించాలి
  rationale: బలిసందర్భంలో קטר బలిని బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది; ‘దహించాలి’ గౌరవప్రదంగా, సంక్షిప్తంగా ఉంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: ఈ బలిక్రియ జరిగే స్థలాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: וְנִמְצָה
  choice: పిండివేయాలి
  rationale: מצה నిఫాల్ రూపం రక్తం పిండబడి బయటకు రావడాన్ని సూచిస్తుంది. హెబ్రీలో రూపం నిష్క్రియాత్మకమైనా, వరుస ఆచార ఆదేశాలకు అనుగుణంగా తెలుగులో కర్తృవాచక ఆజ్ఞ సహజంగా ఉంటుంది; ‘కార్చాలి’ కంటే పిండే చర్యను మెరుగ్గా కాపాడుతుంది.
- source_word: דָמוֹ
  choice: దాని రక్తాన్ని
  rationale: పక్షిబలి రక్తాన్ని సూచిస్తుంది.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: బలిపీఠం ప్రక్క గోడ మీద
  rationale: קִיר అక్షరార్థంగా ‘గోడ’; ‘ప్రక్క గోడ’ అనడం బలిపీఠపు నిలువు పక్కభాగాన్ని సహజ తెలుగులో తెలియజేస్తూ మూలరూపాన్ని కాపాడుతుంది.
