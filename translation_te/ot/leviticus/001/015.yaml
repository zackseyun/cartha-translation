- from: యాజకుడు దానిని బలిపీఠం దగ్గరకు తీసుకువచ్చి, దాని తలను గిల్లి తెంపి[a], బలిపీఠం మీద దానిని దహించాలి. దాని రక్తాన్ని బలిపీఠం ప్రక్క గోడ మీద పిండివేయాలి[b].
