id: LEV.1.3
reference: Leviticus 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: te
  text: అతని అర్పణ పశువుల మందలోనిది అయిన దహనబలి అయితే, అతడు లోపంలేని మగ పశువును అర్పించాలి. తాను యాహ్వే సన్నిధిలో అంగీకరించబడేలా[a] సమాగమ గుడారం ప్రవేశద్వారం వద్ద దానిని అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సన్నిధిలో తన ఇష్టప్రకారం దానిని అర్పించాలి.”
    reason: לִרְצֹנוֹ అనే హెబ్రీ పదబంధాన్ని అర్పించేవాని అంగీకారంగా లేదా అతని స్వచ్ఛంద సంకల్పంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: עֹלָה
  choice: దహనబలి
  rationale: బలిపీఠం మీద పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: קָרְבָּנוֹ
  choice: అతని అర్పణ
  rationale: దేవుని దగ్గరకు తీసుకొచ్చే కానుక లేదా బలి అనే సాధారణ బలార్పణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַבָּקָר
  choice: పశువుల మందలోనుండి తీసిన
  rationale: ఇది గొర్రెలు లేదా మేకలు కాకుండా మందలోని గోసంబంధమైన పశువును సూచిస్తుంది; సందర్భంలో తరువాతి ‘మగ పశువు’తో కలిసి అర్థం స్పష్టమవుతుంది.
- source_word: זָכָר תָּמִים
  choice: లోపంలేని మగ పశువు
  rationale: బలికి నిర్దేశించిన లింగాన్నీ శారీరక దోషరాహిత్యాన్నీ రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: అర్పించాలి / దానిని అర్పించాలి
  rationale: హిఫీల్ రూపానికి బలార్పణ సందర్భంలో సహజమైన అర్థం ‘అర్పించు’; రెండవ వాక్యంలో కర్మ ప్రత్యయాన్ని ‘దానిని’గా వ్యక్తం చేసింది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమాగమ గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: మూలంలోని sanctuary expression‌ను అర్థవంతంగా, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לִרְצֹנוֹ
  choice: తాను అంగీకరించబడేలా
  rationale: లేవీయకాండ బలార్పణ సందర్భంలో అర్పించేవాడు యాహ్వే ఎదుట అనుగ్రహపూర్వకంగా అంగీకరించబడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; స్వచ్ఛందత అనే సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని, దైవనామాన్ని యాహ్వేగా ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఇచ్చింది.
- issue: לִרְצֹנוֹ యొక్క భావం
  choice: తాను అంగీకరించబడేలా
  alternative: తన స్వచ్ఛంద ఇష్టంతో
  rationale: ప్రధాన పాఠంలో బలిని అర్పించేవానికి దేవుని అంగీకారం అనే సందర్భోచిత భావాన్ని ఎంచుకుంది; హెబ్రీ పదబంధంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా చిన్న, ఆజ్ఞార్థక వాక్యాలు వాడబడ్డాయి. ‘దహనబలి’, ‘సమాగమ గుడారం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని అతి పురాతన వ్యాకరణం లేకుండా ఉపయోగించింది. పాదసూచిక గుర్తు [a] సంబంధిత సందిగ్ధ పదబంధం తరువాతే ఉంచబడింది.
