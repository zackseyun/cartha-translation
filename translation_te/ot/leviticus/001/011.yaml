reference: Leviticus 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: te
  text: యాహ్వే[a] సన్నిధిలో, బలిపీఠం ఉత్తర వైపున అతడు దానిని వధించాలి. అహరోను కుమారులైన యాజకులు దాని రక్తాన్ని బలిపీఠం మీద, చుట్టూ ఉన్న అన్ని వైపులా విసరాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం יהוה (YHWH) ఉంది.
    reason: divine_name
  - marker: b
    text: లేదా, “దాని రక్తాన్ని బలిపీఠం మీద చుట్టూ ఉన్న అన్ని వైపులా బలంగా చల్లాలి.” హీబ్రూ క్రియ తేలికగా ప్రోక్షించడం కంటే బలంగా విసరడం లేదా చల్లడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: שׁחט బలిగా అర్పించే జంతువును వధించడానికి వాడే ప్రత్యేక క్రియ; సాధారణమైన ‘చంపాలి’ కంటే ‘వధించాలి’ యాజ్ఞిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: బలిపీఠానికి ఉత్తరం వైపున
  rationale: יֶרֶךְ ఇక్కడ బలిపీఠపు వైపు/పక్కను సూచిస్తుంది; צָפֹנָה ఉత్తర దిశలోని స్థానాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనే యాజ్ఞిక ప్రయోగం దేవుని సమక్షాన్ని సూచిస్తుంది; ‘సన్నిధిలో’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: וְזָרְקוּ
  choice: చల్లాలి
  rationale: זרק యొక్క ప్రాథమిక భావం విసరడం; రక్తసంబంధమైన యాజ్ఞిక సందర్భంలో అది రక్తాన్ని బలిపీఠంపై బలంగా చల్లడం/విసరడం సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘చల్లాలి’ ఉంచి, క్రియలోని బలమైన భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులు
  rationale: మూలంలోని సమానాధికార నిర్మాణం అహరోను కుమారులే ఇక్కడ యాజకులని గుర్తిస్తుంది; తెలుగు విశేషణ నిర్మాణం రెండు అంశాలనూ కాపాడుతుంది.
- source_word: דָּמוֹ
  choice: దాని రక్తాన్ని
  rationale: ప్రత్యయం బలి జంతువును సూచిస్తుంది; తెలుగులో జంతువుకు ‘దాని’ సహజమైన సర్వనామం.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠం చుట్టూ దానిపై
  rationale: עַל రక్తం బలిపీఠంపై/దానికి తగిలేలా వేయబడటాన్ని, סָבִיב అన్ని వైపులా జరిగే చర్యను సూచిస్తాయి. ‘చుట్టూ దానిపై’ రక్తం బలిపీఠానికే వర్తింపబడిందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉంచుతూ, ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో ఇచ్చాం; ‘ప్రభువు’గా మార్చి వ్యక్తినామాన్ని మరుగుపరచలేదు.
- issue: బలిపీఠంపై రక్తాన్ని వర్తింపజేసే చర్య
  choice: చల్లాలి
  alternative: విసరాలి / బలంగా చల్లాలి
  rationale: זרק సాధారణ తేలికపాటి ప్రోక్షణ కంటే విసరడం లేదా బలంగా చల్లడం అనే భావాన్ని కలిగి ఉంది. సహజ తెలుగు కోసం ప్రధాన పాఠంలో ‘చల్లాలి’ వాడి, క్రియ తీవ్రతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన యాజ్ఞిక-న్యాయ శైలిని ఉపయోగించాం. విధిని సూచించడానికి ‘-ాలి’ రూపం, sacrificial terminology కోసం ‘వధించాలి’, ‘బలిపీఠం’, ‘యాజకులు’ వంటి సాధారణంగా అర్థమయ్యే పదాలు వాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
