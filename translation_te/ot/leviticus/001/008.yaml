source:
  edition: WLC
  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: te
  text: అహరోను కుమారులైన యాజకులు ఆ ముక్కలను, తలను, కొవ్వును[a] బలిపీఠం మీద ఉన్న అగ్నిపై ఉన్న కట్టెలపై క్రమంగా అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గట్టి కొవ్వు’ లేదా ‘కొవ్వు పొర’; హీబ్రూ పదం బలిలో ఉపయోగించే జంతువులోని ఒక కొవ్వు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: క్రమంగా అమర్చాలి
  rationale: బలి అర్పణ సందర్భంలో ערך అనేది వస్తువులను ఒక క్రమంలో పేర్చడం లేదా అమర్చడం అని సూచిస్తుంది. ‘క్రమంగా అమర్చాలి’ అనే అనువాదం ఆ విధానపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులు
  rationale: మూలంలోని సమానాధికార ప్రయోగం అహరోను కుమారులను యాజకులుగా గుర్తిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘యాజకులైన’ దీనిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַנְּתָחִים
  choice: ఆ ముక్కలను
  rationale: ఈ పదం ముందుగా కోసిన జంతువు భాగాలను సూచిస్తుంది. సందర్భానుసారమైన నిర్దిష్టత కోసం ‘ఆ ముక్కలు’ అని అనువదించబడింది.
- source_word: הָרֹאשׁ
  choice: తలను
  rationale: ఇది జంతువు తలను సూచించే సూటి శరీరావయవ పదం.
- source_word: הַפָּדֶר
  choice: కొవ్వును
  rationale: פָּדֶר బలిలో ఉపయోగించే కొవ్వు భాగాన్ని, బహుశా గట్టి కొవ్వును లేదా కొవ్వు కప్పును సూచిస్తుంది. సాధారణ పాఠకులకు ‘కొవ్వు’ స్పష్టంగా ఉంటుంది; శరీర నిర్మాణ సంబంధమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: עַל הָעֵצִים
  choice: కట్టెలపై
  rationale: עֵצִים ఇక్కడ బలికి ఇంధనంగా ఉపయోగించే కట్టెలను సమూహార్థంలో సూచిస్తుంది. ‘కట్టెలపై’ సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద ఉన్న నిప్పు మీద ఉన్న కట్టెలపై
  rationale: మూలంలోని వరుస సంబంధవాచక నిర్మాణం కట్టెలు నిప్పు మీద, నిప్పు బలిపీఠం మీద ఉన్నాయని పొరలవారీగా వివరిస్తుంది. కొంత పునరుక్తిగా అనిపించినా ఆ స్థల సంబంధాన్ని తెలుగులో నిలిపాం.
