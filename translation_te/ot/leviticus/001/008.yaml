translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన విధానపరమైన శైలి ఉపయోగించబడింది. మూలంలోని స్థల సంబంధాల వరుసను అతిగా సరళీకరించకుండా నిలిపాం. ఇచ్చిన ఇంగ్లీషు పాఠ్యంలో పాదసూచిక గుర్తు ‘Aaron’s sons’ తరువాత ఉన్నప్పటికీ, పాదసూచిక విషయం הַפָּדֶר గురించి కావడంతో తెలుగులో దాన్ని ‘కొవ్వును’ తరువాత ఉంచాం.
