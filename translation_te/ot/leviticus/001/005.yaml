id: LEV.1.5
reference: Leviticus 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: te
  text: అతడు ఆ కోడెను[b] యాహ్వే సన్నిధిలో వధించాలి. అప్పుడు యాజకులైన అహరోను కుమారులు ఆ రక్తాన్ని సమర్పించి, సమావేశపు గుడారం ప్రవేశద్వారం వద్దనున్న బలిపీఠం మీద, దాని చుట్టూ ఆ రక్తాన్ని చిమ్మాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిమ్మాలి’ అని అనువదించిన హీబ్రూ క్రియకు ‘విసరాలి’ లేదా ‘చల్లాలి’ అని కూడా అర్థం రావచ్చు. ఇక్కడ రక్తాన్ని ఆచారపూర్వకంగా బలిపీఠానికి వర్తింపజేయడం ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: ‘కోడె’కు మూల హీబ్రూలో అక్షరార్థంగా ‘పశువుల మందకు చెందిన కుమారుడు’ అనే నానుడి ఉంది; ఇది ఇక్కడ బలికి ఉపయోగించే మగ గోవును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: వధించాలి
  rationale: బలి ఆచారానికి సంబంధించిన జంతు సంహారాన్ని ‘చంపాలి’ కంటే ‘వధించాలి’ మరింత నిర్దిష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; విధినిర్దేశక సందర్భాన్ని ‘-ాలి’ తెలియజేస్తుంది.
- source_word: בֶּן הַבָּקָר
  choice: ఆ కోడెను
  rationale: అక్షరార్థంగా ‘పశువుల మందకు చెందిన కుమారుడు’; ఈ బలి సందర్భంలో మగ గోవును సూచించే సహజమైన తెలుగు పదం ‘కోడె’. వయస్సును మూలం ఖచ్చితంగా నిర్ధారించనందున ‘లేత’ అని చేర్చలేదు.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఆచార క్రియ దేవుని సమక్షంలో జరుగుతుందనే స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ధ్వన్యంతరీకరణతో ఇచ్చింది.
- source_word: וְהִקְרִיבוּ
  choice: సమర్పించి
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ భావాన్ని, ఇక్కడ రక్తాన్ని యాజకులు ఆచారపూర్వకంగా అందించే చర్యగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులు
  rationale: కుటుంబ గుర్తింపుతో పాటు వారి యాజక పాత్రను కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: וְזָרְקוּ
  choice: చల్లాలి
  rationale: זרק రక్తాన్ని విసరడం/చిమ్మడం ద్వారా బలిపీఠానికి ఆచారపూర్వకంగా వర్తింపజేయడాన్ని సూచిస్తుంది. ‘చల్లాలి’ సహజమైన తెలుగు ఆచార పదప్రయోగం; అయితే చర్య బలహీనమైన తుంపరలకే పరిమితం కాదని పాదసూచిక వివరిస్తుంది.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠం చుట్టూ దాని మీద
  rationale: עַל యొక్క ఉపరితల సంబంధాన్ని ‘దాని మీద’, סָבִיב యొక్క పరివ్యాప్తిని ‘చుట్టూ’ ద్వారా నిలుపుతుంది; భావం బలిపీఠం చుట్టుపక్కల నేలపై పోయడం కాదు.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గర ఉన్న
  rationale: సంబంధ వాక్యం బలిపీఠం స్థానాన్ని గుర్తిస్తుంది; פתח ను ‘ప్రవేశద్వారం’, స్థాన సంబంధాన్ని ‘దగ్గర’గా సహజంగా అందించింది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే తెలుగులో స్థిరపడిన, అర్థవంతమైన పదబంధం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చలేదు. ఆధునిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: రక్తాన్ని బలిపీఠానికి వర్తింపజేసే చర్య
  choice: చల్లాలి
  alternative: విసరాలి / చిమ్మాలి
  rationale: తెలుగులో బలి ఆచారాన్ని సహజంగా తెలిపే పదాన్ని వాడుతూ, హీబ్రూ זרק సూచించే విసరడం లేదా చిమ్మడం అనే బలమైన కదలికను పాదసూచికలో నిలిపాం; కేవలం సున్నితంగా బిందువులు చల్లడమనే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విధినిర్దేశక శైలి. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పదబంధాల తరువాత వరుసగా ఉంచబడ్డాయి.
