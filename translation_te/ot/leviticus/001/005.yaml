- from: అతడు ఆ కోడెను యెహోవా సన్నిధిలో వధించాలి. అప్పుడు యాజకులైన అహరోను కుమారులు ఆ రక్తాన్ని సమర్పించి, ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గర ఉన్న బలిపీఠం చుట్టూ దాని మీద ఆ రక్తాన్ని చల్లాలి.[a][b]
  to: అతడు ఆ కోడెను[b] యాహ్వే సన్నిధిలో వధించాలి. అప్పుడు యాజకులైన అహరోను కుమారులు ఆ రక్తాన్ని సమర్పించి, సమావేశపు గుడారం ప్రవేశద్వారం వద్దనున్న బలిపీఠం మీద, దాని చుట్టూ ఆ రక్తాన్ని చిమ్మాలి.[a]
  rationale: పాదసూచిక సూచికలను అవి వివరించే పదాల వెంట ఉంచాము. זרקకు ‘చిమ్మాలి’ని ఉపయోగించి రక్తాన్ని విసిరి వర్తింపజేసే ఆచార చర్యను స్పష్టంగా ప్రతిబింబించాము. యְהוָהను POB విధానానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాము; אֹהֶל מוֹעֵדను ‘సమావేశపు గుడారం’గా పారదర్శకంగా ఇచ్చాము.
