  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: te
  text: అతడు దహనబలి తలపై తన చేయి ఉంచాలి. అది అతని కొరకు ప్రాయశ్చిత్తం చేయడానికి అంగీకరించబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు అంగీకరించబడతాడు.’ హీబ్రూ కర్మణి క్రియను బలిని కాకుండా బలి అర్పించేవాణ్ణి మరింత నేరుగా సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ఉంచాలి
  rationale: బలి ఆచార సందర్భంలో סמך అనేది జంతువు తలపై చెయ్యి ఉంచడం లేదా ఆనించడం అనే చర్యను సూచిస్తుంది. తెలుగులో ‘చెయ్యి ఉంచాలి’ సహజంగా ఉండి, ఎంత బలంగా నొక్కాడో అనవసరంగా నిర్దేశించదు.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: హీబ్రూలో ఏకవచనం ఉంది; కర్తతో గల సంబంధాన్ని సహజమైన తెలుగులో ‘తన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל רֹאשׁ
  choice: తలమీద
  rationale: శారీరక చర్యను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి స్థిరమైన ఆచారపదం. ‘దహనబలి’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది; పదవ్యుత్పత్తి ఆధారమైన ‘ఆరోహణ బలి’ ఇక్కడ అస్పష్టంగా ఉంటుంది.
- source_word: וְנִרְצָה
  choice: అంగీకరించబడుతుంది
  rationale: רצה నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతుంది. సందర్భంలో సమీప బలి సూచకమైన עֹלָהను ప్రధాన కర్తగా తీసుకున్నప్పటికీ, హీబ్రూలోని సాధ్యమైన ప్రత్యామ్నాయ అన్వయాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: לוֹ
  choice: అతని పక్షంగా
  rationale: לְ ప్రయోజనం లేదా లబ్ధిదారుని సూచిస్తుంది. ‘అతని పక్షంగా’ బలి అర్పించేవాని తరఫున అంగీకారం కలుగుతుందనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: כפר బలి ఆచారానికి సంబంధించిన కీలక పదం. ‘ప్రాయశ్చిత్తం చేయడం’ దాని ఆచారపరమైన, దైవశాస్త్ర సంబంధమైన ప్రాముఖ్యతను నిలుపుతూ, ప్రాయశ్చిత్తం ఎలా కార్యసాధకం అవుతుందో అనే ప్రత్యేక సిద్ధాంతాన్ని చొప్పించదు.
- source_word: עָלָיו
  choice: అతని కోసం
  rationale: כפרతో వచ్చిన עַל ప్రాయశ్చిత్తం ఎవరి నిమిత్తం జరుగుతుందో సూచిస్తుంది. ‘అతని కోసం’ లబ్ధిదారుని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְנִרְצָה అనే కర్మణి క్రియ ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: బలి అంగీకరించబడుతుంది
  alternative: బలి అర్పించేవాడు అంగీకరించబడతాడు
  rationale: సందర్భంలో సమీప నామవాచకం దహనబలి; చెయ్యి ఉంచడం, అది అంగీకరించబడడం, ప్రాయశ్చిత్తం చేయడం అనే వరుస కూడా బలి అంగీకారాన్ని సహజంగా సూచిస్తుంది. అయితే హీబ్రూ తృతీయ పురుష ఏకవచన కర్మణి రూపాన్ని అర్పించేవాని అంగీకారానికి మరింత నేరుగా అన్వయించే అవకాశం ఉన్నందున, ఆ దైవశాస్త్ర ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. బలి ఆచారానికి స్థిరమైన ‘దహనబలి’, ‘ప్రాయశ్చిత్తం’ పదాలను ఉంచి, వాక్య సంబంధాలు సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా తీర్చిదిద్దాం.
