  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/נָתְנוּ בְּנֵ֨י אַהֲרֹ֧ן הַ/כֹּהֵ֛ן אֵ֖שׁ עַל הַ/מִּזְבֵּ֑חַ וְ/עָרְכ֥וּ עֵצִ֖ים עַל הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/007.yaml
  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: te
  text: యాజకుడైన అహరోను కుమారులు బలిపీఠం మీద నిప్పు పెట్టి, ఆ నిప్పు మీద కట్టెలను క్రమంగా పేర్చాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: పెట్టాలి
  rationale: נתן అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే భావం ఉంది. బలి ఆచారానికి సంబంధించిన ఈ ఆదేశ సందర్భంలో ‘పెట్టాలి’ సహజంగా ఉండి, విధిగా చేయవలసిన కార్యాన్ని తెలియజేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కుమారులు
  rationale: ఏకవచనంలోని הַכֹּהֵן పదం అహరోనును ‘యాజకుడు’గా గుర్తిస్తుంది; అది కుమారులందరినీ సమష్టిగా ‘యాజక కుటుంబం’ అని పిలుస్తున్నట్లు మార్చకుండా మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: אֵשׁ
  choice: నిప్పు
  rationale: ఇక్కడ బలిపీఠంపై ఉంచే ప్రత్యక్ష అగ్నినే సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘నిప్పు’ సహజమైన ఎంపిక.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి సందర్భంలోని מִזְבֵּחַ కు ‘బలిపీఠం’ ప్రామాణికమైన పదం; עַל కు ఇక్కడ ‘మీద’ సరిపోతుంది.
- source_word: וְעָרְכוּ
  choice: క్రమంగా పేర్చాలి
  rationale: ערך అనేది కేవలం ఉంచడమే కాక క్రమపద్ధతిలో అమర్చడాన్ని సూచిస్తుంది. కట్టెల సందర్భంలో ‘పేర్చాలి’ సహజం; ‘క్రమంగా’ ఆ క్రియలోని సక్రమ అమరిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עֵצִים
  choice: కట్టెలను
  rationale: హీబ్రూలో బహువచనంగా ఉన్న ఈ పదం బలికి ఉపయోగించే చెక్క ముక్కలను సూచిస్తుంది. తెలుగులో ఈ సందర్భానికి ‘కట్టెలు’ సహజం.
- source_word: עַל הָאֵשׁ
  choice: ఆ నిప్పు మీద
  rationale: మూలంలోని ‘నిప్పు’ పద పునరుక్తిని నిలుపుతూ, తెలుగులో ముందుగా పేర్కొన్న నిప్పుతో సంబంధాన్ని ‘ఆ’ ద్వారా సహజంగా చూపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధానానికి తగిన గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని వరుస చర్యలు—నిప్పు పెట్టడం, దానిమీద కట్టెలు పేర్చడం—అదే క్రమంలో నిలుపబడ్డాయి.
