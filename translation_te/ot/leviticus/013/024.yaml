translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక ధర్మశాస్త్రంలోని నిర్ధారణాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. ఈ వాక్యం తరువాతి వచనంలో కొనసాగేందున చివర కామా ఉంచబడింది.
