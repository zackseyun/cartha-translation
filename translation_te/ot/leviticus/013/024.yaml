id: LEV.13.24
reference: Leviticus 13:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹ בָשָׂ֔ר כִּֽי יִהְיֶ֥ה בְ/עֹר֖/וֹ מִכְוַת אֵ֑שׁ וְֽ/הָיְתָ֞ה מִֽחְיַ֣ת הַ/מִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: te
  text: లేదా ఒకరి శరీర చర్మంపై అగ్నివల్ల కాలిన గాయం ఏర్పడి, ఆ కాలిన గాయంలోని పచ్చి మాంసం[a] ఎరుపు కలిసిన తెల్లని మెరిసే మచ్చగా లేదా తెల్లని మెరిసే మచ్చగా మారితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పచ్చి మాంసం’ అనే మాట కాలిన గాయం ఉన్న ప్రాంతంలో కనిపించే సజీవ కణజాలాన్ని సూచించే హీబ్రూ పదబంధానికి అనువాదం.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: లేదా ... ఏర్పడి
  rationale: ధర్మశాస్త్రంలోని ప్రత్యామ్నాయ పరిస్థితిని పరిచయం చేస్తుంది; తెలుగులో షరతుతో కూడిన సందర్భవర్ణన సహజంగా ఉండేలా వాక్య నిర్మాణంలో వ్యక్తపరచబడింది.
- source_word: בָשָׂר
  choice: ఒకరి శరీరం
  rationale: ఇక్కడ వ్యక్తి శరీర కణజాలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘శరీరం’ సందర్భానికి సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּעֹרוֹ
  choice: శరీరపు చర్మంపై
  rationale: ప్రభావిత వ్యక్తి శరీర చర్మాన్ని సూచించే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִכְוַת אֵשׁ
  choice: అగ్నివల్ల కాలిన గాయం
  rationale: అగ్ని కారణంగా కలిగిన కాలిన గాయమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מִחְיַת הַמִּכְוָה
  choice: ఆ కాలిన గాయంలోని పచ్చి మాంసం
  rationale: కాలిన ప్రాంతంలో కనిపించే సజీవమైన లేదా పచ్చిగా ఉన్న కణజాలాన్ని సూచిస్తుంది; ‘పచ్చి మాంసం’ సాధారణ పాఠకులకు అర్థమయ్యే వైద్యసంబంధ వర్ణన.
- source_word: בַּהֶרֶת
  choice: మెరిసే మచ్చ
  rationale: లేవీయకాండము 13లో చర్మంపై స్పష్టంగా కనిపించే ప్రకాశవంతమైన మచ్చను సూచించే నిర్ధారణ పదంగా అనువదించబడింది.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: ఎరుపు కలిసిన తెల్లని
  rationale: తెలుపులో ఎరుపు కలిసిన మిశ్రిత వర్ణాన్ని మూలంలోని అస్పష్టతను తొలగించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אוֹ לְבָנָה
  choice: లేదా తెల్లని
  rationale: ప్రత్యామ్నాయ రంగు వర్ణనను నేరుగా నిలుపుతుంది.
