  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: te
  text: యాజకుడు అతనిని పరిశీలించాలి. ఇదిగో, ఆ బాధిత మచ్చ తెల్లగా మారి ఉంటే, యాజకుడు ఆ మచ్చను శుద్ధమని ప్రకటించాలి; అతడు శుద్ధుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: దానిని పరిశీలించాలి
  rationale: רָאָה అనే క్రియకు అక్షరార్థంగా ‘చూడడం’ అనే భావం ఉన్నా, యాజక సంబంధిత ఈ సందర్భంలో అది అధికారికంగా పరిశీలించడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని כֹּהֵן పదానికి సహజమైన, స్థిరమైన తెలుగు సమానం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: పరిశీలనలో కనిపించిన ఫలితంపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని నిలుపుతుంది.
- source_word: נֶהְפַּךְ
  choice: మారి ఉంటే
  rationale: నిఫాల్ రూపం స్థితిలో సంభవించిన మార్పును సూచిస్తుంది; నిబంధనాత్మక సందర్భానికి అనుగుణంగా తెలుగులో ‘మారి ఉంటే’ సహజంగా ఉంటుంది.
- source_word: הַנֶּגַע
  choice: వ్యాధిగల మచ్చ
  rationale: נֶגַע అనేది యాజకుడు పరిశీలించే, కంటికి కనిపించే బాధిత ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక వైద్య నిర్ధారణను అనవసరంగా నిర్దిష్టం చేయకుండా ‘వ్యాధిగల మచ్చ’ స్పష్టంగా ఉంటుంది.
- source_word: לְלָבָן
  choice: తెల్లగా
  rationale: కంటికి కనిపించే వర్ణమార్పును నేరుగా వ్యక్తపరచే సహజ తెలుగు రూపం.
- source_word: וְטִהַר
  choice: శుద్ధమైనదిగా ప్రకటించాలి
  rationale: ఈ సందర్భంలో యాజకుడు మచ్చను స్వస్థపరచడం లేదా శుభ్రపరచడం కాదు; పరిశీలన అనంతరం ఆచారపరమైన శుద్ధతపై తీర్పు ప్రకటిస్తాడు.
- source_word: טָהוֹר הוּא
  choice: అది శుద్ధమైనదే
  rationale: మసొరేటిక్ పాఠంలోని పుంలింగ ఏకవచన సర్వనామాన్ని సమీపంలోని ‘మచ్చ’కు అన్వయిస్తూ, తుది శుద్ధతా తీర్పును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: శుద్ధతా ధర్మశాస్త్రంలో యాజకుని చర్య స్వభావం
  choice: యాజకుడు మచ్చను శుద్ధమైనదిగా ప్రకటిస్తాడు.
  alternative: యాజకుడు మచ్చను శుద్ధి చేస్తాడు.
  rationale: טהר క్రియ సందర్భానుసారం ‘శుద్ధి చేయడం’ లేదా ‘శుద్ధమైనదిగా ప్రకటించడం’ అని అర్థమివ్వగలదు. లేవీయకాండం 13లో యాజకుడు వైద్యుడిగా స్వస్థపరచేవాడు కాదు; పరిశీలించి ఆచారపరమైన స్థితిని అధికారికంగా నిర్ధారించేవాడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. మూలంలోని పరిశీలన, వర్ణమార్పు, యాజక తీర్పు అనే క్రమాన్ని నిలిపాం; ‘శుద్ధం’ అనే పదం ఇక్కడ ఆచారపరమైన స్థితిని సూచిస్తుంది.
