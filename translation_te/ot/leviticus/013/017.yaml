review_pass:
  verdict: revise
  source_fidelity: సవరణ అవసరం. וְרָאָהוּ లోని పుంలింగ ఏకవచన ప్రత్యయం సందర్భానుసారం బాధితుడిని సూచిస్తుంది; అలాగే టָהוֹר הוּא లోని పుంలింగ సర్వనామం బాధిత వ్యక్తికే వర్తిస్తుంది. ముసాయిదా రెండింటినీ మచ్చకు అన్వయించడం మూలపాఠంలోని వ్యక్తి–మచ్చ భేదాన్ని కోల్పోయింది. וְטִהַר אֶת־הַנֶּגַע మాత్రం మచ్చ గురించిన యాజకుని ఆచారపరమైన తీర్పునే సూచిస్తుంది.
  naturalness: ‘వ్యాధిగల మచ్చ’ అర్థమయ్యేలా ఉన్నప్పటికీ ఆధునిక తెలుగులో కొద్దిగా భారంగా ఉంది. ‘బాధిత మచ్చ’ సహజంగా ఉండి, ఆధునిక వైద్య నిర్ధారణను సూచించదు. ‘శుద్ధమైనదిగా ప్రకటించాలి’ కంటే ‘శుద్ధమని ప్రకటించాలి’ మరింత సహజం.
  terminology: ‘యాజకుడు,’ ‘పరిశీలించాలి,’ మరియు ఆచారపరమైన సందర్భంలోని ‘శుద్ధుడు/శుద్ధమని’ సరైనవి. నెగఁను ‘బాధిత మచ్చ’గా, వ్యక్తి యొక్క తుది స్థితిని ‘అతడు శుద్ధుడు’గా వేరు చేయడం పదబంధాల పాత్రలను స్పష్టంగా ఉంచుతుంది.
