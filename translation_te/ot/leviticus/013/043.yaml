translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-విధాన శైలి వాడబడింది. మూలంలోని రెండు బట్టతల పదాల వ్యత్యాసం పాఠ్యంలో స్పష్టంగా ఉంచబడింది; צָרַעַתను అతిగా నిర్దిష్టం చేయకుండా ‘చర్మవ్యాధి’గా ఇచ్చాం.
