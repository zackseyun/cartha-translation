- from: యాజకుడు అతణ్ణి పరిశీలించినప్పుడు, ఇదిగో, అతని వెనుకవైపు బట్టతలలో గానీ ముందువైపు బట్టతలలో గానీ ఉన్న వ్యాధి వాపు ఎరుపు కలిసిన తెలుపు రంగులో ఉంటే, అది శరీర చర్మంపై వచ్చే చర్మవ్యాధి[a] రూపంలా ఉంటుంది.
