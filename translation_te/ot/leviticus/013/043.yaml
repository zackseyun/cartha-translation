  edition: WLC
  text: וְ/רָאָ֨ה אֹת֜/וֹ הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת הַ/נֶּ֨גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּ/קָרַחְתּ֖/וֹ א֣וֹ בְ/גַבַּחְתּ֑/וֹ כְּ/מַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: te
  text: యాజకుడు అతణ్ణి పరిశీలిస్తాడు; ఇదిగో, అతని తల వెనుక భాగంలోని బట్టతలలోగానీ నుదుటివైపు బట్టతలలోగానీ ఉన్న ఆ వ్యాధి వాపు ఎరుపు ఛాయ కలిగిన తెల్లనిదిగా, శరీర చర్మంపై కనిపించే చర్మవ్యాధి[a] రూపాన్ని పోలి ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ צָרַעַת అనే పదాన్ని సంప్రదాయంగా ‘కుష్ఠు’ అని అనువదించారు. అయితే లేవీయకాండములో అది హాన్సెన్ వ్యాధిని మాత్రమే కాక, తీవ్రమైన అనేక రకాల చర్మ పరిస్థితులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: బట్టతలను సూచించే ఈ రెండు హీబ్రూ పదాలు తల వెనుక భాగంలోని బట్టతలకూ నుదుటివైపు బట్టతలకూ మధ్య వ్యత్యాసాన్ని సూచించే అవకాశం ఉంది; ఆ వ్యత్యాసాన్ని అనువాదంలో నిలుపుతున్నాము.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించినప్పుడు
  rationale: యాజక సంబంధ నిర్ధారణ సందర్భంలో ראה కేవలం చూడడం కాక పరిశీలించడాన్ని సూచిస్తుంది; వాక్యంలోని పరిశీలన-ఫలిత సంబంధాన్ని సహజ తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేసింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: పరిశీలనలో ప్రత్యక్షమైన విషయంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: שְׂאֵת הַנֶּגַע
  choice: వ్యాధి వాపు
  rationale: שְׂאֵת యొక్క పైకి ఉబ్బిన గాయం లేదా వాపు భావాన్ని, נגע యొక్క వ్యాధిగ్రస్త స్థితిని కలిపి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: ఎరుపు కలిసిన తెలుపు రంగు
  rationale: ప్రధాన విశేషణమైన 'తెలుపు'ను నిలుపుతూ, אֲדַמְדֶּמֶת సూచించే ఎరుపు ఛాయను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: వెనుకవైపు బట్టతలలో గానీ ముందువైపు బట్టతలలో గానీ
  rationale: రెండు రకాల బట్టతల మధ్య ఉన్న సంభావ్య వెనుక-ముందు వ్యత్యాసాన్ని పాఠ్యంలోనే నిలుపుతుంది.
- source_word: כְּמַרְאֵה
  choice: రూపంలా
  rationale: నిర్ధారణలో కనిపించే రూపంతో చేసే పోలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఇది తప్పనిసరిగా హాన్సెన్ వ్యాధినే సూచించదు; లేవీయకాండము 13లోని విస్తృత చర్మరోగ వర్గాన్ని తెలుపుతుంది.
- source_word: עוֹר בָּשָׂר
  choice: శరీర చర్మంపై
  rationale: హీబ్రూ పదబంధంలోని చర్మం మరియు శరీరం అనే రెండు అంశాలను సహజ తెలుగులో నిలుపుతుంది.
