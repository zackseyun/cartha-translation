source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు ఆ తెగులును పరిశీలించాలి. ఆ తెగులు వస్త్రంలోగాని, నిలువు పోగుల్లోగాని, అడ్డ పోగుల్లోగాని, తోలులోగాని, తోలుతో చేసిన ఏ ఉపయోగపు వస్తువులోగాని వ్యాపించి ఉంటే, అది వినాశకరమైన త్సారాతు తెగులు[a]; అది అపవిత్రమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “త్సారాతు” అనే హీబ్రూ పదాన్ని సంప్రదాయంగా “కుష్ఠురోగం” అని అనువదించారు. అయితే లేవీయకాండం 13లో ఇది విస్తృతమైన ఆచారపరమైన అపవిత్రత పరిస్థితులను సూచిస్తుంది; ఇది వస్త్రాలకు, తోలుకు కూడా వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు కేవలం చూడడం కాక శుద్ధి-అశుద్ధతను నిర్ణయించేందుకు తనిఖీ చేసే విధివిధాన సందర్భం ఇది.
- source_word: הַנֶּגַע
  choice: ఆ తెగులు
  rationale: వస్త్రం, పోగులు, తోలు వంటి వాటిలో కనిపించి వ్యాపించే ప్రభావిత స్థితిని సహజమైన తెలుగులో సూచిస్తుంది; దీనిని ఆధునిక వైద్యపరమైన సంక్రమణగా పరిమితం చేయదు.
- source_word: פָשָׂה
  choice: వ్యాపించి ఉంటే
  rationale: మూలంలోని విస్తరించడం లేదా వ్యాపించడం అనే భావాన్ని సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: దుస్తు లేదా బట్ట అనే పరిధిని న్యాయవిధి శైలికి తగిన సంక్షిప్త పదంతో తెలియజేస్తుంది.
- source_word: שְׁתִי
  choice: నిలువు పోగులు
  rationale: నేతలో పొడవుగా అమర్చే warp దారాలను సాధారణ పాఠకుడికి అర్థమయ్యే రీతిలో సూచిస్తుంది.
- source_word: עֵרֶב
  choice: అడ్డ పోగులు
  rationale: నేతలో అడ్డంగా వెళ్లే weft దారాలను నిలువు పోగులతో సహజంగా జతచేసి తెలియజేస్తుంది.
- source_word: עוֹר
  choice: తోలు
  rationale: పనికి లేదా వస్తువుల తయారీకి ఉపయోగించే శుద్ధి చేసిన జంతుచర్మం అనే సందర్భార్థానికి సరిపోతుంది.
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: ఏ పనికి ఉపయోగించిన తోలులోగాని
  rationale: తోలు ఏ విధమైన పనికి లేదా ఉపయోగానికి పెట్టబడినా ఈ నియమం వర్తిస్తుందనే సమగ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: నాశనం చేసే త్సారాతు తెగులు
  rationale: מַמְאֶרֶת లోని హానికరమైన లేదా క్షయింపజేసే భావాన్ని తెలియజేస్తూ, మనుషులకు మాత్రమే వర్తించే ఆధునిక చర్మవ్యాధి పేరును వస్త్రం, తోలు మీదికి అనుచితంగా మోపకుండా సాంకేతిక హీబ్రూ పదాన్ని నిలుపుతుంది.
- source_word: טָמֵא הוּא
  choice: అది అపవిత్రమైనది
  rationale: లేవీయకాండంలోని ఆచారపరమైన అశుద్ధ స్థితిని ప్రామాణికమైన, సంక్షిప్త తెలుగులో ప్రకటిస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు పవిత్రత నియమాల్లో צָרַעַת పదానికి అనువాదం
  choice: త్సారాతు తెగులు
  alternative: కుష్ఠురోగం; చర్మవ్యాధి; అపవిత్రపరిచే తెగులు
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికి సమానం కాదు; ఈ అధ్యాయంలో అది వస్త్రాలు, తోలు మీద కూడా వర్తిస్తుంది. అందువల్ల వైద్యపరంగా అతిగా నిర్దిష్టమైన అర్థాన్ని మోపకుండా మూలపదాన్ని లిప్యంతరీకరించి, 'తెగులు'తో అర్థసూచన ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకుడికి అర్థమయ్యేలా గౌరవప్రదమైన న్యాయవిధి శైలి. 'నిలువు పోగులు/అడ్డ పోగులు' సాంకేతిక నేత పదాలకు వివరణాత్మక సమానార్థాలు. వాక్యంలోని కర్తను సందర్భం ప్రకారం 'యాజకుడు'గా స్పష్టం చేశాం.
