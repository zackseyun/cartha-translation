lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దైవిక సంభాషణను ప్రారంభించే דבר క్రియకు సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం; సాధారణ ‘చెప్పాడు’ కంటే మూలంలోని అధికారిక వాక్యారంభ ధోరణిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో ప్రతిబింబిస్తుంది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరూ మాటకు ఉద్దేశితులని సహజమైన తెలుగు విభక్తి నిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది; రెండవ אֶל‌ను కూడా భావపరంగా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా పలికాడు:'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘ఇలా’తో పాటు కోలన్ వాడబడింది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంగానే ఉంచాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యసూత్రాన్ని పదేపదే అనుకరించకుండా, తదుపరి ప్రత్యక్ష వాక్యానికి సహజంగా దారి తీసే నిర్మాణం వాడబడింది.
