  source_fidelity: The draft accurately conveys the seventh-day re-examination, fading of the affected area, lack of spread in the skin, the priest's ritual declaration, washing of clothes, and resulting cleanness. However, ‘మాత్రమే’ (‘only’) adds an exclusion/emphasis not expressed by the Hebrew ‘it is a mispachat.’
