base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు అతన్ని మళ్లీ పరిశీలించాలి. ఆ మచ్చ వెలిసిపోయి, ఆ మచ్చ చర్మంలో వ్యాపించకపోతే, యాజకుడు అతన్ని శుద్ధుడని ప్రకటించాలి. అది చర్మపు దద్దురు[a]. అతడు తన బట్టలు ఉతుక్కోవాలి; అప్పుడు అతడు శుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొలుసులు కట్టిన చర్మపు విస్ఫోటం.” హెబ్రూ పదం యొక్క ఖచ్చితమైన వైద్య స్వభావం అనిశ్చితం; ఇక్కడ అది వ్యాపించే తీవ్రమైన చర్మస్థితికి భిన్నమైన దద్దురును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు నిర్వహించే అధికారిక నిర్ధారణ సందర్భంలో ఇది కేవలం చూడడాన్ని కాక పరిశీలించడాన్ని సూచిస్తుంది.
- source_word: שֵׁנִית
  choice: రెండోసారి
  rationale: పరిశీలన మళ్లీ జరుగుతుందని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כֵּהָה
  choice: వెలిసిపోయి
  rationale: మచ్చ రంగు లేదా తీవ్రత తగ్గి మసకబారడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַנֶּגַע
  choice: చర్మపు మచ్చ
  rationale: ఈ సందర్భంలో యాజకుడు గమనించే చర్మంపై కనిపించే బాధిత ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక వైద్యార్థంలో నిర్దిష్టమైన ‘సంక్రమణ’ అని అనవసరంగా నిర్ణయించదు.
- source_word: פָשָׂה
  choice: వ్యాపించకుండా
  rationale: చర్మంపై బాధిత ప్రాంతం విస్తరించకపోవడమే సందర్భానుగుణ భావం.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: హెబ్రూ పూర్వప్రత్యయాన్ని దగ్గరగా అనుసరిస్తూ, నిర్ధారణ సందర్భానికి సరిపోతుంది.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: యాజకుడు అతన్ని శుద్ధుడని ప్రకటించాలి
  rationale: యాజకుడు శారీరకంగా స్వస్థపరుస్తున్నాడనే భావం కాక, ఆచారసంబంధమైన శుద్ధతపై అధికారిక తీర్పు ఇస్తున్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: מִסְפַּחַת
  choice: చర్మపు దద్దురు
  rationale: మరింత తీవ్రమైన, వ్యాపించే చర్మస్థితికి భిన్నమైన చర్మ విస్ఫోటాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తపరుస్తుంది; పదం యొక్క ఖచ్చిత స్వభావం అనిశ్చితమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: అతడు తన బట్టలు ఉతుక్కోవాలి
  rationale: ఆధునిక తెలుగులో సహజంగా ఉండి, అతని వస్త్రాలను కడగాలనే ఆదేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు శుద్ధుడవుతాడు
  rationale: బట్టలు ఉతికిన తరువాత ఏర్పడే ఆచారసంబంధమైన శుద్ధ స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: ఆచారసంబంధమైన శుద్ధత తీర్పా, శారీరక స్వస్థతా
  choice: యాజకుడు ‘శుద్ధుడని ప్రకటించాలి’; చివరగా అతడు ‘శుద్ధుడవుతాడు’ అని అనువదించడం
  alternative: యాజకుడు అతన్ని శుద్ధిచేయాలి; అతడు స్వస్థుడవుతాడు
  rationale: ఈ వచనం చర్మస్థితిపై యాజకుడు ఇచ్చే ఆచారసంబంధమైన తీర్పును వివరిస్తుంది; శారీరక స్వస్థతను లేదా వైద్య చికిత్సను తప్పనిసరిగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చర్మపు మచ్చ’ అనే పదబంధం ఆధునిక వైద్య నిర్ధారణను బలవంతంగా రుద్దకుండా కనిపించే బాధిత ప్రాంతాన్ని సూచిస్తుంది. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘చర్మపు దద్దురు’ పదం వద్ద ఉంచాం.
