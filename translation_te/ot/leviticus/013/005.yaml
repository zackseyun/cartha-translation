  text: וְ/רָאָ֣/הוּ הַ/כֹּהֵן֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּ֤ה הַ/נֶּ֨גַע֙ עָמַ֣ד בְּ/עֵינָ֔י/ו לֹֽא פָשָׂ֥ה הַ/נֶּ֖גַע בָּ/ע֑וֹר וְ/הִסְגִּיר֧/וֹ הַ/כֹּהֵ֛ן שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు అతనిని పరిశీలించాలి. అప్పుడు ఆ మచ్చ అతనికి మారకుండా కనిపించి, చర్మంలో వ్యాపించకపోతే, యాజకుడు అతనిని మరొకసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మచ్చ”కు హీబ్రూలో నెగా అనే పదం ఉంది. దీనిని “దెబ్బ,” “బాధిత స్థలం,” లేదా “గుర్తు” అని కూడా అనువదించవచ్చు; ఇది తప్పనిసరిగా ఆధునిక వైద్యశాస్త్రం నిర్వచించిన వ్యాధిని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఆయన కళ్లలో నిలిచింది” అని ఉంది; అంటే యాజకునికి అది మారకుండా కనిపించింది.
    reason: lexical_alternative
  - marker: c
    text: “వేరుగా ఉంచాలి” అనే మాటను మరింత అక్షరార్థంగా “మూసి ఉంచాలి” లేదా “నిర్బంధించాలి” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: అతణ్ణి పరిశీలించాలి
  rationale: ראה అనే క్రియకు అక్షరార్థంగా ‘చూడాలి’ అనే భావం ఉన్నా, ఇక్కడ యాజకుని విధివంతమైన తనిఖీ సందర్భం కావడంతో ‘పరిశీలించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: నిర్దిష్టమైన కాలక్రమ సూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఆ మచ్చ ... ఉంటే
  rationale: హీబ్రూ దృష్టి-ఆకర్షక పదాన్ని తెలుగు నియమవాక్య నిర్మాణంలో సహజమైన షరతుగా వ్యక్తం చేస్తుంది; పరిశీలన ఫలితంపైనే తదుపరి చర్య ఆధారపడుతుంది.
- source_word: הַנֶּגַע
  choice: మచ్చ
  rationale: ఇది యాజకుడు పరిశీలించే కనిపించే చర్మలక్షణాన్ని సూచిస్తుంది; ఆధునిక వైద్యపరంగా నిర్దిష్టమైన ‘వ్యాధి’ అని నిర్ణయించకుండా ‘మచ్చ’ అనే స్పష్టమైన పదాన్ని ఎంచుకున్నాం.
- source_word: עָמַד בְּעֵינָיו
  choice: తన దృష్టికి మారకుండా ఉండి
  rationale: ‘అతని కళ్లలో నిలిచింది’ అనే హీబ్రూ నుడికారానికి, యాజకునికి అది మారనట్లుగా కనిపించిందనే భావాన్ని ఇస్తుంది; పరిశీలకుని దృష్టికోణాన్ని కూడా నిలుపుతుంది.
- source_word: לֹא פָשָׂה ... בָּעוֹר
  choice: చర్మంలో వ్యాపించకపోతే
  rationale: మచ్చ చర్మంలో విస్తరించలేదనే నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: וְהִסְגִּירוֹ
  choice: అతణ్ణి ... వేరుగా ఉంచాలి
  rationale: క్రియలోని మూసివేయడం లేదా నిర్బంధించడం అనే భావాన్ని, ఆధునిక వైద్యార్థం గల ‘క్వారంటైన్’ను రుద్దకుండా, ఆచారపరమైన వేరుచేయడంగా స్పష్టంగా అందిస్తుంది.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: మరో ఏడు రోజులపాటు
  rationale: రెండవ ఏడు రోజుల కాలాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
