revisions:
- from: ఏడవ రోజున యాజకుడు అతణ్ణి పరిశీలించాలి. ఆ మచ్చ తన దృష్టికి మారకుండా ఉండి, చర్మంలో వ్యాపించకపోతే, యాజకుడు అతణ్ణి మరో ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a][b]
  to: ఏడవ రోజున యాజకుడు అతనిని పరిశీలించాలి. అప్పుడు ఆ మచ్చ అతనికి మారకుండా కనిపించి, చర్మంలో వ్యాపించకపోతే, యాజకుడు అతనిని మరొకసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a][b][c]
  rationale: The revision retains the draft’s meaning while clarifying that the unchanged appearance is assessed by the priest, adding a natural equivalent for the Hebrew attention marker, and supplying a footnote for the source idiom. It also makes the repeated seven-day confinement explicit as “మరొకసారి.”
  reviewer_model: gpt-5.6-terra
