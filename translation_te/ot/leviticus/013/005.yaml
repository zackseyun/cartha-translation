translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. న్యాయ-ఆచార సందర్భంలోని విధివాచక భావానికి ‘పరిశీలించాలి,’ ‘ఉంచాలి’ రూపాలు వాడబడ్డాయి. హీబ్రూ నుడికారంలోని యాజకుని దృష్టికోణం ‘తన దృష్టికి’ ద్వారా నిలుపబడింది.
