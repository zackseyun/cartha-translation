  edition: WLC
  text: וְ/הִ֨תְגַּלָּ֔ח וְ/אֶת הַ/נֶּ֖תֶק לֹ֣א יְגַלֵּ֑חַ וְ/הִסְגִּ֨יר הַ/כֹּהֵ֧ן אֶת הַ/נֶּ֛תֶק שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: te
  text: అప్పుడు అతడు గొరిగించుకోవాలి[a]; అయితే ఆ వ్యాధిగల మచ్చను గొరిగించకూడదు[b]. యాజకుడు ఆ వ్యాధిగల మచ్చను రెండోసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు గొరిగించబడాలి.” హీబ్రూ క్రియ అతడు స్వయంగా లేదా మరొకరితో గొరిగించుకోవడాన్ని సూచించవచ్చు; సందర్భం తల లేదా గడ్డం ప్రాంతానికి సంబంధించినది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “ఆ వ్యాధిగల మచ్చను గొరిగించకూడదు” అని చెబుతుంది. చుట్టుపక్కల వెంట్రుకలను తొలగించి, వ్యాధిగల భాగాన్ని తదుపరి పరిశీలన కోసం గొరగకుండా ఉంచాలని దీని భావం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: అప్పుడు అతడు తన తలను గొరిగించుకోవాలి
  rationale: גלח యొక్క హిత్పయేల్ రూపం తనను తాను గొరిగించుకోవడం లేదా మరొకరితో గొరిగించుకోవడం అనే ప్రతిఫలార్థాన్ని సూచిస్తుంది. సందర్భం తల లేదా గడ్డం ప్రాంతంలోని వ్యాధికి సంబంధించినది కాబట్టి తెలుగులో సహజంగా ‘తన తలను గొరిగించుకోవాలి’ అని ఇచ్చాం.
- source_word: הַנֶּתֶק
  choice: ఆ వ్యాధిగల మచ్చ
  rationale: נֶתֶק అనేది తల లేదా గడ్డంలో వెంట్రుకలు ఊడిపోవడం వంటి లక్షణాలతో కనిపించే ప్రత్యేక వ్యాధిగ్రస్త ప్రాంతాన్ని సూచిస్తుంది. ఖచ్చితమైన ఆధునిక రోగనిర్ధారణను రుద్దకుండా, సాధారణ పాఠకునికి స్పష్టంగా ఉండేందుకు ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: అయితే ఆ వ్యాధిగల మచ్చను గొరిగించకూడదు
  rationale: హీబ్రూ వాక్యంలో ప్రత్యక్ష కర్మగా ఆ మచ్చనే పేర్కొంది; ‘మచ్చ చుట్టూ’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని రూపాన్ని నిలిపాం.
- source_word: וְהִסְגִּיר
  choice: ప్రత్యేకంగా ఉంచాలి
  rationale: లేవీయకాండం 13లో ఈ క్రియ పరిశీలన కోసం తాత్కాలికంగా వేరుగా ఉంచడాన్ని సూచిస్తుంది. ఆధునిక వైద్యార్థం బలంగా ఉన్న ‘క్వారంటైన్’ వంటి పదం బదులు సహజమైన తెలుగు వాడాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయ ధర్మశాస్త్ర సందర్భంలో כהןకు ప్రామాణికమైన తెలుగు పదం.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: రెండోసారి ఏడు రోజులపాటు
  rationale: మరొక ఏడు రోజుల పరిశీలనా కాలం పునరావృతమవుతుందని שֵׁנִית స్పష్టంగా సూచిస్తుంది.
