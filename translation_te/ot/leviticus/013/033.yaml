  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర సంబంధమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే విధంగా అనువదించాం. మూలంలోని వైద్యపరమైన అనిశ్చితిని కాపాడి, నిర్దిష్ట ఆధునిక రోగనామాన్ని చేర్చలేదు.
