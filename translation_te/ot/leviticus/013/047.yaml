id: LEV.13.47
reference: Leviticus 13:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: te
  text: ఒక వస్త్రంలో కుష్ఠు మచ్చ[a] ఏర్పడితే—అది ఉన్ని వస్త్రమైనా, నార వస్త్రమైనా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ‘త్సారాఅత్’. సంప్రదాయంగా దీనిని ‘కుష్ఠు’ అని అనువదిస్తారు. అయితే ఇక్కడ అది ఆధునిక హాన్సెన్ వ్యాధిని మాత్రమే సూచించదు; వస్త్రాల్లో కనిపించే తెగులు లేదా కలుషిత స్థితులతో సహా మరింత విస్తృతమైన వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: ఒక వస్త్రం
  rationale: నియమసంబంధ సందర్భంలో నిర్దిష్ట ఆర్టికల్ సాధారణ ఉదాహరణను సూచిస్తుంది; తెలుగులో ‘ఒక వస్త్రం’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כִּי יִהְיֶה בוֹ
  choice: లో ... ఏర్పడితే
  rationale: ఇక్కడ כִּי + అసంపూర్ణ క్రియ ఒక న్యాయపరమైన సంభావ్య పరిస్థితిని ప్రవేశపెడుతుంది. בוֹ లోని స్థానార్థాన్ని ‘లో’ నిలుపుతుంది; ‘ఏర్పడితే’ ఉనికిలోకి రావడం లేదా కనిపించడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֶגַע צָרָעַת
  choice: కుష్ఠు మచ్చ
  rationale: נֶגַע కనిపించే మచ్చ లేదా దెబ్బను సూచిస్తుంది; צָרָעַת దాని రకాన్ని వివరిస్తుంది. వస్త్రానికి సంబంధించిన సందర్భంలో ‘మచ్చ’ స్పష్టంగా ఉంటుంది. సంప్రదాయ పదమైన ‘కుష్ఠు’ను ఉంచి, అది ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం కాదని పాదసూచికలో వివరిస్తున్నాం.
- source_word: בְּבֶגֶד צֶמֶר
  choice: ఉన్ని వస్త్రం
  rationale: צֶמֶר ఉన్నిని సూచిస్తుంది; ‘ఉన్ని వస్త్రం’ ఆధునిక తెలుగులో సహజమైన పదబంధం.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: నార వస్త్రం
  rationale: פִּשְׁתִּים అవిసె నారతో చేసిన లినెన్‌ను సూచిస్తుంది. ‘నార వస్త్రం’ సాధారణ పాఠకులకు అర్థమయ్యే సహజ సమానార్థకం.
theological_decisions:
- issue: צָרָעַת అనే పదం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో సంప్రదాయ ‘కుష్ఠు’ను ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో వివరించడం
  alternative: ‘అపవిత్రత కలిగించే తెగులు’ లేదా ‘బూజు’ అని అనువదించడం
  rationale: ఈ అధ్యాయంలో ఈ పదం మనుషుల చర్మానికే కాక వస్త్రాలు, ఇళ్లకు కూడా వర్తిస్తుంది. దానిని ఆధునిక హాన్సెన్ వ్యాధితో సమానపరచకూడదు; అదే సమయంలో ‘బూజు’ అని ఖచ్చితంగా నిర్ణయించడానికి మూలపదం తగినంత నిర్దిష్టంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. వాక్యం తదుపరి వచనాల్లో కొనసాగుతున్నందున చివర డాష్ ఉంచబడింది; ‘అది ... అయినా’ నిర్మాణం ఉన్ని, నార అనే రెండు వస్త్ర రకాలను సహజంగా అనుసంధానిస్తుంది.
