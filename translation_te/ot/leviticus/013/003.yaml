source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: te
  text: యాజకుడు శరీరపు చర్మంపై ఉన్న వ్యాధి మచ్చను పరిశీలించాలి. ఆ మచ్చలోని వెంట్రుక తెల్లబడి, ఆ మచ్చ శరీరపు చర్మం కంటే లోతుగా కనిపిస్తే, అది చర్మవ్యాధి మచ్చ. యాజకుడు ఆ మచ్చను పరిశీలించి, అతడు అపవిత్రుడని ప్రకటించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶגַע
  choice: వ్యాధి మచ్చ
  rationale: యాజకుడు కంటితో పరిశీలించే ప్రభావిత చర్మభాగాన్ని సూచిస్తుంది. ‘తెగులు’ లేదా ‘శిక్ష’ కంటే ‘వ్యాధి మచ్చ’ ఈ నిర్ధారణ సందర్భంలో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: శరీరపు చర్మంపై
  rationale: עוֹר అంటే చర్మం, בָּשָׂר ఇక్కడ శరీరాన్ని సూచిస్తుంది. తెలుగు వాడుకలో సహజమైన శరీర నిర్మాణ భావాన్ని ఇస్తుంది.
- source_word: שֵׂעָר ... הָפַךְ לָבָן
  choice: వెంట్రుక తెల్లబడి
  rationale: ఏకవచన సమూహార్థాన్ని నిలుపుతూ, పరిశీలనలో కనిపించే మారిన స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: ఆ మచ్చ శరీరపు చర్మం కంటే లోతుగా కనిపిస్తే
  rationale: మచ్చ చుట్టుపక్కల చర్మస్థాయి కంటే కిందికి దిగినట్లు కనిపిస్తుందనే దృశ్య పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: נֶגַע צָרַעַת
  choice: చర్మవ్యాధికి సంబంధించిన మచ్చ
  rationale: రెండు నామవాచకాల భావాన్నీ వ్యక్తం చేస్తూ, צָרַעַתను ఆధునిక హాన్సన్ వ్యాధితో తప్పుగా సమానపరచకుండా పురాతన విస్తృత చర్మవ్యాధి వర్గంగా అందిస్తుంది.
- source_word: וְטִמֵּא אֹתוֹ
  choice: అతడు అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు అపవిత్రతను కలిగిస్తున్నాడని కాక, ఆ వ్యక్తి ఆచారపరమైన స్థితిపై అధికారిక తీర్పు ప్రకటిస్తున్నాడని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: లేవీయకాండంలోని צָרַעַת పదం పరిధి
  choice: చర్మవ్యాధి
  alternative: కుష్ఠురోగం
  rationale: హీబ్రూ పదం ఆధునిక కుష్ఠురోగం/హాన్సన్ వ్యాధి కంటే విస్తృతమైన ఆచారపరమైన నిర్ధారణ వర్గాన్ని సూచిస్తుంది. సంప్రదాయ అనువాదాన్ని పాదసూచికలో ఉంచడం పాఠకులకు ఉపయోగకరం.
- issue: וְטִמֵּא אֹתוֹలో యాజకుని చర్య స్వభావం
  choice: అపవిత్రుడని ప్రకటించాలి
  alternative: అపవిత్రుణ్ణి చేయాలి
  rationale: ఈ సందర్భం యాజకుని పరిశీలన, తీర్పుకు సంబంధించినది; యాజకుడు అపవిత్రతను కలిగిస్తాడనే భావాన్ని అనవసరంగా ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-యాజక ధోరణి పాటించబడింది. వైద్యపరంగా అతినిర్దిష్టమైన పదజాలాన్ని నివారించి, పరిశీలన మరియు ఆచారపరమైన తీర్పు మధ్య తేడా స్పష్టంగా ఉంచబడింది.
