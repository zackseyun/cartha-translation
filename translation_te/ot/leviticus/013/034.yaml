source:
  edition: WLC
  text: וְ/רָאָה֩ הַ/כֹּהֵ֨ן אֶת הַ/נֶּ֜תֶק בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וְ֠/הִנֵּה לֹא פָשָׂ֤ה הַ/נֶּ֨תֶק֙ בָּ/ע֔וֹר וּ/מַרְאֵ֕/הוּ אֵינֶ֥/נּוּ עָמֹ֖ק מִן הָ/ע֑וֹר וְ/טִהַ֤ר אֹת/וֹ֙ הַ/כֹּהֵ֔ן וְ/כִבֶּ֥ס בְּגָדָ֖י/ו וְ/טָהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు ఆ పొలుసుల చర్మస్థితిని[a] పరిశీలించాలి. ఆ చర్మస్థితి చర్మంలో వ్యాపించక, దాని రూపం చర్మం కంటే లోతుగా కనిపించకపోతే[b], యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి[c]. అతడు తన బట్టలు ఉతుక్కోవాలి; అప్పుడు అతడు శుద్ధుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నెతెక్ అనే పదం ఒక ప్రత్యేక చర్మస్థితిని సూచిస్తుంది. ఈ సందర్భంలో అది తల లేదా గడ్డం ప్రాంతానికి సంబంధించినది; దానికి సమానమైన ఖచ్చితమైన ఆధునిక వైద్యపేరు అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చర్మం కంటే లోతుగా లేదు.” అంటే ప్రభావిత ప్రాంతం చుట్టుపక్కల చర్మస్థాయి కంటే దిగువకు కుంగినట్లు కనిపించకపోవడం.
    reason: cultural_note
  - marker: c
    text: ఇక్కడ యాజకుడు ఆ వ్యక్తిని వైద్యపరంగా నయం చేయడం కాదు; అతడు శుద్ధస్థితిలో ఉన్నాడని అధికారికంగా ప్రకటించడం.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: నెత్తిమీది లేదా గడ్డంలోని చర్మవ్యాధి
  rationale: ఈ అధ్యాయ సందర్భంలో ఈ పదం నెత్తి లేదా గడ్డం ప్రాంతంలో కనిపించే ఒక ప్రత్యేక చర్మస్థితిని సూచిస్తుంది. ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణను రుద్దకుండా, సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: פָשָׂה
  choice: వ్యాపించక
  rationale: పరిశీలనలో ఉన్న చర్మస్థితి మరింత విస్తరించలేదనే నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: హీబ్రూ ఉపసర్గను సమీపంగా అనుసరిస్తూ, వ్యాధి చర్మప్రాంతంలో వ్యాపించడాన్ని సూచిస్తుంది.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: అది చర్మం కంటే లోతుగా కనిపించకపోతే
  rationale: గాయం చుట్టుపక్కల చర్మస్థాయి కంటే దిగువన ఉన్నట్లు కనిపిస్తుందా అనే యాజక పరిశీలనా ప్రమాణాన్ని నిలుపుతుంది.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి
  rationale: యాజకుడు వైద్యపరంగా నయం చేస్తున్నాడని కాక, ఆరాధనా సంబంధమైన శుద్ధస్థితిపై అధికారిక తీర్పు ఇస్తున్నాడని స్పష్టం చేస్తుంది.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: అతడు తన బట్టలు ఉతుక్కోవాలి
  rationale: ఆచారపరమైన చర్యను ఆధునిక, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అతడు శుద్ధుడవుతాడు
  rationale: బట్టలు ఉతికిన తరువాత కలిగే శుద్ధస్థితిని పూర్తి వాక్యంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: ఇది సాధారణంగా చూడటం కాక అధికారిక పరిశీలన కాబట్టి సందర్భానుకూలమైన క్రియ.
- source_word: וְהִנֵּה
  choice: '...పోతే'
  rationale: అక్షరార్థమైన ‘ఇదిగో’కు బదులుగా, పరిశీలనలో కనబడిన పరిస్థితిని సహజ తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శుద్ధత ధర్మశాస్త్రంలో యాజకుని చర్య స్వభావం
  choice: యాజకుడు ఆ వ్యక్తిని శుద్ధుడని అధికారికంగా ప్రకటిస్తాడు.
  alternative: యాజకుడు అతణ్ణి శుద్ధి చేస్తాడు.
  rationale: ఈ న్యాయ-ఆచార సందర్భంలో טהר శుద్ధస్థితిపై తీర్పును సూచిస్తుంది; యాజకుడు వ్యాధిని నయం చేశాడనే భావాన్ని అనవసరంగా చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. ‘శుద్ధుడు’ అనే పదం వైద్య స్వస్థత కంటే ఆచారపరమైన స్థితిని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
