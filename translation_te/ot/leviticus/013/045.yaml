review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the required public signs and the repeated declaration of ritual impurity. However, ‘ఆ వ్యాధి లక్షణం’ narrows נֶגַע to a symptom, whereas the Hebrew refers to the afflicting condition/outbreak itself. ‘చింపుకొని ఉండాలి’ also presents the torn clothes as the person’s action rather than the stipulated state of his garments. The Hebrew שָׂפָם is best represented in the main text as ‘upper lip,’ with ‘mustache area’ retained as an alternative in the note.
  naturalness: The revision uses idiomatic modern standard Telugu while retaining the legal-prescriptive register. ‘చినిగినవిగా ఉండాలి’ and ‘విరబోసి ఉండాలి’ clearly describe the required ongoing appearance.
  terminology: ‘చర్మవ్యాధి’ appropriately avoids identifying the condition specifically as Hansen’s disease. ‘అపవిత్రుడు’ correctly retains the ritual-status term טָמֵא without importing moral blame. ‘పై పెదవి’ is a clear principal rendering for שָׂפָם.
  issues:
  - severity: medium
    issue: ‘ఆ వ్యాధి లక్షణం’ for הַנֶּגַע
    rationale: ‘లక్షణం’ means a symptom/sign and may imply that the condition is merely evidence of disease. In this context נֶגַע denotes the affliction, outbreak, or diseased condition itself.
  - severity: low
    issue: ‘తన బట్టలను చింపుకొని ఉండాలి’ for בְּגָדָיו יִהְיוּ פְרֻמִים
    rationale: The Hebrew states that his garments are to be torn/rent; it does not explicitly state that he must perform the tearing. A stative Telugu rendering is more exact.
  - severity: low
    issue: ‘మీసం భాగాన్ని’ as the main rendering of שָׂפָם
    rationale: The expression can refer to the upper lip or mustache area. ‘పై పెదవిని’ is more direct and less culturally specific in the main text; the alternative should remain footnoted.
  revised_text: చర్మవ్యాధిగలవాడు, అతనిలో ఆ వ్యాధి ఉన్నప్పుడు, తన బట్టలు చినిగినవిగా ఉండాలి; తన తలవెంట్రుకలు విరబోసి ఉండాలి; అతడు తన పై పెదవిని[a] కప్పుకొని, “అపవిత్రుడు! అపవిత్రుడు!” అని కేక వేయాలి.
