- from: చర్మవ్యాధి సోకినవాడు, ఆ వ్యాధి లక్షణం అతనిలో ఉన్నప్పుడు, తన బట్టలను చింపుకొని ఉండాలి; తల వెంట్రుకలను విరబోసుకొని ఉండాలి; మీసం భాగాన్ని[a] కప్పుకొని, “అపవిత్రుడు! అపవిత్రుడు!” అని కేక వేయాలి.
  to: చర్మవ్యాధిగలవాడు, అతనిలో ఆ వ్యాధి ఉన్నప్పుడు, తన బట్టలు చినిగినవిగా ఉండాలి; తన తలవెంట్రుకలు విరబోసి ఉండాలి; అతడు తన పై పెదవిని[a] కప్పుకొని, “అపవిత్రుడు! అపవిత్రుడు!” అని కేక వేయాలి.
  rationale: The revision preserves the source’s masculine singular formulation and its sequence of mandated public signs, while avoiding an overly clinical or overly narrow rendering of נֶגַע. It more faithfully expresses the stative wording concerning torn garments and uses the less disputed Telugu equivalent ‘పై పెదవి’ in the text, preserving the mustache-area alternative in the anchored footnote.
