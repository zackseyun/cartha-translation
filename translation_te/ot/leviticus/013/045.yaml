id: LEV.13.45
reference: Leviticus 13:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: te
  text: చర్మవ్యాధిగలవాడు, అతనిలో ఆ వ్యాధి ఉన్నప్పుడు, తన బట్టలు చినిగినవిగా ఉండాలి; తన తలవెంట్రుకలు విరబోసి ఉండాలి; అతడు తన పై పెదవిని[a] కప్పుకొని, “అపవిత్రుడు! అపవిత్రుడు!” అని కేక వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీసం ఉన్న భాగాన్ని.” హీబ్రూ పదం పై పెదవి లేదా మీసం ఉన్న ప్రాంతాన్ని సూచించవచ్చు. దాన్ని కప్పుకోవడం దుఃఖానికి, ఇతరులను బహిరంగంగా హెచ్చరించడానికి గుర్తు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: చర్మవ్యాధి సోకినవాడు
  rationale: ఇది హాన్సెన్ వ్యాధిని మాత్రమే సూచించే పదంగా కాకుండా, లేవీయకాండం 13లోని విస్తృతమైన తీవ్రమైన చర్మవ్యాధుల వర్గాన్ని సూచిస్తుంది. హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַנֶּגַע
  choice: ఆ వ్యాధి లక్షణం
  rationale: נגע ఇక్కడ అపవిత్ర స్థితికి కారణమైన గాయం, మచ్చ లేదా వ్యాధి లక్షణాన్ని సూచించగలదు. ఆధునిక సూక్ష్మజీవ సిద్ధాంతాన్ని అనవసరంగా సూచించే ‘ఇన్ఫెక్షన్’ కంటే ఈ ప్రయోగం సందర్భానికి తగినది.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: తన బట్టలను చింపుకొని ఉండాలి
  rationale: చింపబడిన బట్టలు దుఃఖం లేదా బహిరంగ ఆపదకు గుర్తు. ఈ నిర్మాణం ఆ స్థితిని కొనసాగించాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: తల వెంట్రుకలను విరబోసుకొని ఉండాలి
  rationale: פָרוּעַ తల వెంట్రుకలను కట్టకుండా, సరిచేసుకోకుండా వదిలివేయడాన్ని సూచిస్తుంది; ‘తలను బోడి చేసుకోవాలి’ అనే అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: మీసం భాగాన్ని కప్పుకొని
  rationale: שָׂפָם పై పెదవి లేదా మీసం ఉన్న ప్రాంతాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన తెలుగు ప్రయోగాన్ని ఉంచి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: “అపవిత్రుడు! అపవిత్రుడు!” అని కేక వేయాలి
  rationale: రెండుసార్లు పలికిన విశేషణం ఆ వ్యక్తి తన ఆచారపరమైన అపవిత్ర స్థితిని బహిరంగంగా హెచ్చరించడాన్ని బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: లేవీయకాండం 13లో טָמֵא అనే పదం సూచించే అపవిత్రత స్వభావం
  choice: ఆచారపరమైన, సామాజిక స్థితిని సూచించే ‘అపవిత్రుడు’
  alternative: అశుద్ధుడు; కలుషితుడు
  rationale: ఈ సందర్భంలో ఈ పదం తప్పనిసరిగా వ్యక్తిగత పాపదోషాన్ని గానీ ఆధునిక వైద్య నిర్ధారణను గానీ సూచించదు. దేవారాధన సమాజంలో ఉన్న ఆచారపరమైన స్థితిని తెలియజేసేలా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. చట్టపరమైన ఆజ్ఞ భావాన్ని ‘ఉండాలి/వేయాలి’ రూపాలతో నిలిపాం; వైద్యపరంగా అతిగా నిర్దిష్టమైన పదజాలాన్ని నివారించాం.
