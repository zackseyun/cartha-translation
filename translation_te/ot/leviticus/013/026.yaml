source:
  edition: WLC
  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: te
  text: అయితే యాజకుడు దానిని పరిశీలించినప్పుడు, ఇదిగో, ఆ ప్రకాశవంతమైన మచ్చలో తెల్ల వెంట్రుక లేక, అది చర్మం కంటే లోతుగా లేక[a], అది వెలిసిపోయి ఉంటే, యాజకుడు అతనిని ఏడు రోజుల పాటు వేరుగా ఉంచాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అది చర్మం కంటే దిగువగా లేదు’; అంటే, చుట్టూ ఉన్న చర్మస్థాయి కంటే కుంగి కనిపించదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వేరుగా ఉంచాలి’ అనే మాటను ‘నిర్బంధించి ఉంచాలి’ లేదా ‘ఏకాంతంగా ఉంచాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: దానిని పరిశీలించినప్పుడు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చూచుట’ అనే భావం ఉన్నా, యాజకుడు చర్మస్థితిని అధికారికంగా పరీక్షించే సందర్భంలో ‘పరిశీలించుట’ సహజంగాను సందర్భోచితంగాను ఉంది.
- source_word: בַּבֶּהֶרֶת
  choice: ఆ ప్రకాశవంతమైన మచ్చలో
  rationale: ఈ పదం చర్మంపై కనిపించే ప్రకాశవంతమైన లేదా తెల్లటి గుర్తును సూచిస్తుంది. నిర్దిష్ట ఆధునిక వ్యాధి పేరును ఆపాదించకుండా దాని దృశ్య లక్షణాన్ని నిలుపుతుంది.
- source_word: שֵׂעָר לָבָן
  choice: తెల్ల వెంట్రుక
  rationale: హీబ్రూ ఏకవచన సమూహార్థాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: అది చర్మం కంటే లోతుగా ఉండకుండా
  rationale: మూలంలో ‘తక్కువగా/దిగువగా’ అనే దృశ్య భావం ఉంది; ఇక్కడ చుట్టూ ఉన్న చర్మస్థాయి కంటే లోపలికి కుంగి కనిపించకపోవడాన్ని ‘లోతుగా ఉండకుండా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֵהָה
  choice: వెలిసిపోయి ఉంటే
  rationale: మచ్చ ప్రకాశం లేదా తీవ్రత తగ్గి మసకబారిన స్థితిని ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִסְגִּירוֹ
  choice: అతణ్ణి వేరుగా ఉంచాలి
  rationale: పరిశీలన కోసం వ్యక్తిని మూసి లేదా ప్రత్యేకంగా ఉంచే చర్యను తెలియజేస్తుంది; ఆధునిక ప్రజారోగ్య విధానాల భావాన్ని అతిగా దిగుమతి చేయకుండా ఉంటుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: మూలంలోని కాలవ్యవధికి నేరమైన, సహజమైన అనువాదం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: పరిశీలనలో బయటపడిన విషయంపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని నిలుపుతుంది.
