translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. చర్మస్థితికి ఆధునిక వైద్య నిర్ధారణ పేరును పెట్టకుండా, మూలంలోని కనిపించే లక్షణాలనే అనువదించాం. పాదసూచిక గుర్తులను వాటికి సంబంధించిన పదబంధాల దగ్గర ఉంచాం.
