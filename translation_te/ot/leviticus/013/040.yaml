translation:
  language: te
  text: ఒక పురుషుని తల వెంట్రుకలు ఊడిపోతే[a], అతడు బట్టతలవాడు; అతడు శుద్ధుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పురుషుని తల బోసిపోతే.’ హీబ్రూ క్రియ వెంట్రుకలు పోయి తల బోసిపోవడాన్ని సూచించవచ్చు; ప్రధాన పాఠం తరువాత వచ్చే ‘బట్టతలవాడు’ అనే స్థితి వర్ణనకు ముందు క్రియాభావాన్ని వేరుగా ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ఒక పురుషుడు
  rationale: వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్న ఈ పదం, శరీర స్థితికి సంబంధించిన ఈ నియమంలో పురుషునినే సూచిస్తోంది.
- source_word: כִּי
  choice: -తే
  rationale: న్యాయనియమంలోని షరతును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: יִמָּרֵט
  choice: వెంట్రుకలు రాలిపోతే
  rationale: వెంట్రుకలు లేకుండా కావడం అనే క్రియాభావాన్ని తెలియజేస్తూ, దానికి కారణాన్ని అనవసరంగా నిర్దేశించదు; తరువాతి ‘బట్టతలవాడు’ అనే స్థితి వర్ణనతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: רֹאשׁוֹ
  choice: అతని తల వెంట్రుకలు
  rationale: వెంట్రుకలు పోయేది తలపై నుంచే అని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קֵרֵחַ
  choice: బట్టతలవాడు
  rationale: వెంట్రుకలు పోయిన తరువాతి స్థితిని స్పష్టమైన ప్రస్తుత తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: טָהוֹר
  choice: శుద్ధుడు
  rationale: లేవీయకాండం 13లోని ఆచారపరమైన శుద్ధ స్థితిని సూచిస్తుంది; నైతిక నిర్దోషిత్వాన్ని సూచించదు.
- source_word: הוּא ... הוּא
  choice: అతడు ... అతడు
  rationale: హీబ్రూలోని పునరుక్త సర్వనామాలను రెండు వేరు విధేయ వాక్యాలుగా ఉంచి నొక్కిచెప్పే నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: లేవీయకాండంలోని అపవిత్రత నియమాల్లో ఆచారపరమైన స్థితి
  choice: శుద్ధుడు
  alternative: పవిత్రుడు
  rationale: ఇక్కడ విషయం చర్మవ్యాధి నిర్ధారణకు సంబంధించిన ఆచారపరమైన శుద్ధత; నైతిక లేదా సాధారణ పవిత్రత కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవాక్య శైలి. ‘బట్టతలవాడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘శుద్ధుడు’ ఆచారపరమైన వర్గాన్ని నిలుపుతుంది.
