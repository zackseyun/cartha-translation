base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు అతన్ని పరిశీలించాలి. అది చర్మంలో బాగా వ్యాపించి ఉంటే, యాజకుడు అతన్ని అపవిత్రుడని ప్రకటించాలి; అది చర్మవ్యాధి[a] మచ్చ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా “కుష్ఠువ్యాధి” అని అనువదిస్తారు. హీబ్రూ పదం ఇశ్రాయేలు ఆచారశుద్ధి నియమాలలో పలు రకాల చర్మస్థితులను సూచించగలదు; అది తప్పనిసరిగా ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి) మాత్రమే కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: అతన్ని పరిశీలించాలి
  rationale: మూల క్రియ అక్షరార్థంగా ‘చూడడం’ అయినా, ఇక్కడ యాజకుని నిర్ధారణ ప్రక్రియను సూచిస్తుంది; ‘పరిశీలించాలి’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: బాగా వ్యాపించి ఉంటే
  rationale: అనంతరూపం-సమాపక క్రియ కలయికలోని బలవంతమైన నిశ్చయార్థాన్ని ‘బాగా’ ద్వారా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: עוֹר అంటే చర్మం; హీబ్రూ విభక్తి సూచించిన ‘లో’ భావాన్ని నిలుపుతుంది.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: అతన్ని అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు ఆ వ్యక్తిని అపవిత్రునిగా చేయడం కాదు, ఆచారపరమైన తీర్పును ప్రకటించడం ఇక్కడ ఉద్దేశం.
- source_word: נֶגַע
  choice: మచ్చ
  rationale: లేవీయకాండము 13లో కనిపించే ప్రభావిత చర్మస్థానాన్ని సూచిస్తుంది; ‘సంక్రమణ’ అని అనువదిస్తే ఆధునిక సూక్ష్మజీవ సంబంధిత అర్థం అనవసరంగా చేరవచ్చు.
- source_word: צָרַעַת
  choice: తీవ్రమైన చర్మవ్యాధి
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన చర్మస్థితులను సూచించగలదు; సంప్రదాయ ‘కుష్ఠు’ అనే పరిమిత వైద్య గుర్తింపును ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: ముందు వివరించిన స్థితిని గుర్తించే స్త్రీలింగ ఏకవచన సర్వనామానికి సహజ తెలుగు సమానం.
theological_decisions:
- issue: צָרַעַת అనే పదాన్ని ఆచారశుద్ధి నియమాలలో ఎలా అనువదించాలి
  choice: తీవ్రమైన చర్మవ్యాధి
  alternative: కుష్ఠువ్యాధి
  rationale: ఈ పదాన్ని కేవలం ఆధునిక కుష్ఠువ్యాధి లేదా హాన్సెన్ వ్యాధితో సమానంగా చూడలేం. విస్తృత అర్థాన్ని ప్రధాన పాఠ్యం కాపాడగా, సంప్రదాయ అనువాదాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర విధానానికి తగిన గంభీరతతో. ‘అపవిత్రుడని ప్రకటించాలి’ అనే రూపం యాజకుని అధికారిక ఆచారపరమైన తీర్పును స్పష్టం చేస్తుంది.
