id: LEV.13.20
reference: Leviticus 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: te
  text: యాజకుడు దానిని పరిశీలించాలి. ఇదిగో, అది చర్మం కంటే కిందికి కుంగినట్లు కనిపించి, దానిలోని వెంట్రుక తెల్లగా మారి ఉంటే, యాజకుడు అతణ్ణి అపవిత్రుడని ప్రకటించాలి. అది కురుపులో బయలుదేరిన కుష్ఠురోగపు[a] మచ్చ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ צָרַעַת (త్సారాఅత్) పదాన్ని సంప్రదాయంగా ‘కుష్ఠురోగం’ అని అనువదిస్తారు. అయితే లేవీయకాండంలో ఇది ఆధునిక హాన్సెన్ వ్యాధిని మాత్రమే కాక, అనేక తీవ్రమైన చర్మ సమస్యలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు చేసే రోగనిర్ధారణాత్మక తనిఖీని సూచించే సందర్భంలో కేవలం ‘చూడాలి’ కంటే ‘పరిశీలించాలి’ స్పష్టంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: గమనించిన నిర్ధారణ సూచనలపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచికను నిలుపుతుంది.
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: అది చర్మం కంటే లోతుగా కనిపిస్తూ
  rationale: మచ్చ చుట్టుపక్కల చర్మపు ఉపరితలం కంటే దిగువకు కుంగినట్లు కనిపించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఇది కనిపించే రూపం గురించిన మాటేనన్న భావాన్ని కాపాడుతుంది.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: దానిలోని వెంట్రుక తెల్లగా మారి ఉంటే
  rationale: ప్రభావిత ప్రదేశంలోని వెంట్రుకను స్పష్టంగా సూచిస్తుంది; నిర్ధారణ షరతుకు తగిన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: וְטִמְּאוֹ
  choice: అతణ్ణి అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు వ్యక్తిని అపవిత్రునిగా చేయడం కాదు, ఆచారపరమైన స్థితిని అధికారికంగా నిర్ధారించి ప్రకటించడం అనే భావాన్ని అందిస్తుంది.
- source_word: נֶגַע צָרַעַת
  choice: కుష్ఠురోగపు మచ్చ
  rationale: נֶגַעను కనిపించే ‘మచ్చ’గా, צָרַעַתను సంప్రదాయ బైబిలు పదమైన ‘కుష్ఠురోగం’గా అనువదించి, ఆధునిక హాన్సెన్ వ్యాధితో ఖచ్చితంగా సమానం కాదని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: בַּשְּׁחִין
  choice: కురుపులో
  rationale: שְׁחִיןకు ఈ చర్మవ్యాధి సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘కురుపు’.
- source_word: פָּרָחָה
  choice: పుట్టింది
  rationale: మచ్చ కురుపులో బయలుదేరి ప్రత్యక్షమైందనే భావాన్ని ఇస్తుంది; శరీరమంతా వ్యాపించిందని అవసరం లేకుండా సూచించదు.
theological_decisions:
- issue: లేవీయకాండంలోని צָרַעַת పదానికి అనువాదం
  choice: కుష్ఠురోగం
  alternative: తీవ్రమైన చర్మవ్యాధి
  rationale: సంప్రదాయంగా గుర్తించదగిన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచినా, దానిని ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం చేయకుండా పాదటిప్పణి ద్వారా హీబ్రూ పదపు విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారపరమైన న్యాయ సందర్భానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. షరతును తెలుగులో సహజంగా వ్యక్తం చేయడానికి మొదటి రెండు గమనికలను ‘ఉంటే’ నిర్మాణంలో కలిపాం.
