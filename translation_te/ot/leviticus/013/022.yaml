    issue: The main-text term ‘చర్మవ్యాధి’ is medically narrower than Hebrew נֶגַע.
    rationale: In Leviticus 13, נֶגַע is a broad designation for an afflicted mark or condition, not a modern medical diagnosis. ‘చర్మబాధ’ better preserves that breadth.
