  verdict: revise
  source_fidelity: ‘చర్మవ్యాధి’ can imply a defined medical disease more readily than the broad Hebrew נֶגַע, which here denotes an afflicted lesion/condition. Rendering it as ‘చర్మబాధ’ better preserves the source’s nontechnical breadth while retaining the skin-diagnostic context. The priest’s formal declaration and the emphatic spreading condition are otherwise conveyed accurately.
  naturalness: The revision ‘చర్మంలో మరింత వ్యాపిస్తే’ is smooth modern standard Telugu. ‘అపవిత్రుడని ప్రకటించాలి’ is clear, appropriately formal, and natural in this legal-priestly register.
  terminology: ‘అపవిత్రుడు’ appropriately represents ritual uncleanness without claiming that the priest causes it. ‘చర్మబాధ’ avoids a modern diagnostic claim while remaining intelligible. The lexical note is anchored to the term it explains.
