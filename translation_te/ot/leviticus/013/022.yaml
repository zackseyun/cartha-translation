id: LEV.13.22
reference: Leviticus 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֥ה תִפְשֶׂ֖ה בָּ/ע֑וֹר וְ/טִמֵּ֧א הַ/כֹּהֵ֛ן אֹת֖/וֹ נֶ֥גַע הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: te
  text: అయితే అది చర్మంలో మరింత వ్యాపిస్తే, యాజకుడు అతణ్ణి అపవిత్రుడని ప్రకటించాలి; అది ఒక చర్మబాధ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వ్యాధి,’ ‘తెగులు,’ లేదా ‘బాధిత మచ్చ.’ ఇక్కడి హీబ్రూ పదం విస్తృత అర్థాన్ని కలిగి ఉంది; అది ఏదైనా నిర్దిష్ట ఆధునిక వైద్య రోగాన్ని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి పరిస్థితికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: మరింతగా వ్యాపిస్తే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని బలాన్ని అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: עוֹר అనే పదానికి సాధారణ అర్థమైన ‘చర్మం’ను, בְּ ఉపసర్గను అనుసరిస్తుంది.
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: యాజకుడు అతణ్ణి అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు అపవిత్రతను కలిగిస్తాడనే భావం కాకుండా, ఆ వ్యక్తి ఆచారపరమైన స్థితిని అధికారికంగా నిర్ధారించి ప్రకటించే న్యాయపరమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נֶגַע
  choice: చర్మవ్యాధి
  rationale: ఈ అధ్యాయంలోని చర్మ నిర్ధారణ సందర్భంలో సహజంగా అర్థమయ్యే విస్తృత పదం; నిర్దిష్ట ఆధునిక వైద్య నిర్ధారణను రుద్దదు.
- source_word: הִוא
  choice: అది
  rationale: ఇప్పుడే వివరించిన స్థితిని గుర్తించే హీబ్రూ స్త్రీలింగ ఏకవచన సర్వనామాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: యాజకుని అపవిత్రత ప్రకటన స్వభావం
  choice: యాజకుడు ఆ వ్యక్తిని అపవిత్రుడని అధికారికంగా ప్రకటిస్తాడు.
  alternative: యాజకుడు అతణ్ణి అపవిత్రుణ్ణి చేస్తాడు.
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలో Piel טמא అనేది అపవిత్రతను కలిగించడం కంటే ఆచారపరమైన స్థితిని నిర్ధారించి ప్రకటించడాన్ని సూచిస్తుంది.
- issue: נֶגַע యొక్క వైద్య నిర్దిష్టత
  choice: చర్మవ్యాధి
  alternative: సంక్రమణ / తెగులు / మచ్చ
  rationale: నిర్దిష్ట ఆధునిక రోగనిర్ధారణను చెప్పకుండా, చర్మంపై కనిపించే బాధాకర స్థితిని సందర్భానుగుణంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండపు న్యాయ-యాజక శైలికి తగిన గంభీరమైన కాని సులభమైన భాషను ఉపయోగించాం. ‘అపవిత్రుడని ప్రకటించాలి’ అనే రూపం ఆచారపరమైన అధికారిక నిర్ధారణను స్పష్టం చేస్తుంది.
