  verdict: revise
  source_fidelity: The draft correctly preserves the conditional procedural structure and the passive requirement to bring the affected individual to the priest. However, ‘లక్షణం’ means a symptom/sign, whereas נֶגַע in this diagnostic context denotes the affliction or visible lesion itself. ‘కుష్ఠురోగపు మచ్చ’ more closely represents the Hebrew construction without specifying a modern diagnosis.
  naturalness: The revised wording is natural modern standard Telugu and retains an appropriately formal legal-instruction register. ‘యాజకుని వద్దకు’ is idiomatic and clear.
  terminology: ‘కుష్ఠురోగం’ preserves the traditional rendering of צָרַעַת, while the footnote appropriately warns that it is not limited to Hansen’s disease. ‘ఒక వ్యక్తికి’ naturally conveys the generic human reference of בְּאָדָם without making the rule male-exclusive.
  issues:
  - severity: medium
    issue: ‘లక్షణం’ for נֶגַע
    rationale: A symptom is evidence of a disease, but נֶגַע refers to the affliction/lesion being examined. This distinction matters in Leviticus 13’s inspection procedure.
