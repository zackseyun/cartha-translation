source:
  edition: WLC
  text: נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּ/אָדָ֑ם וְ/הוּבָ֖א אֶל הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/009.yaml
  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: te
  text: ఒక వ్యక్తికి కుష్ఠురోగపు మచ్చ కలిగితే[a], అతణ్ణి యాజకుని వద్దకు తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుష్ఠురోగం’ అని అనువదించిన హీబ్రూ పదం צָרַעַת (త్సారాఅత్). ఇది ఆధునిక కుష్ఠురోగం (హాన్సెన్ వ్యాధి) మాత్రమే కాకుండా, మరింత విస్తృతమైన తీవ్రమైన చర్మ పరిస్థితులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: లక్షణం
  rationale: లేవీయకాండము 13లో ఇది యాజకుడు పరిశీలించగల వ్యాధి సూచనను లేదా చర్మంపై కనిపించే దెబ్బను సూచిస్తుంది. ఆధునిక తెలుగులో ‘లక్షణం’ సహజంగా ఉండి, నిర్దిష్ట వైద్య నిర్ధారణను ముందుగానే విధించదు.
- source_word: צָרַעַת
  choice: కుష్ఠువ్యాధి
  rationale: సంప్రదాయ బైబిలు పదప్రయోగంతో అనుసంధానాన్ని నిలుపుతుంది; అయితే ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన చర్మ సంబంధ పరిస్థితులను సూచించవచ్చని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: כִּי
  choice: కలిగితే
  rationale: ఇక్కడ כִּי నియమశాస్త్రంలోని ఒక పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో ‘కలిగితే’ షరతు మరియు తదనంతర ప్రక్రియను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תִהְיֶה
  choice: కలిగితే
  rationale: ‘ఉండు/కలుగు’ అనే సాధారణ భావాన్ని షరతుతో కలిపి సహజమైన తెలుగు క్రియారూపంగా ఇచ్చింది; ‘కనిపిస్తే’ అని మూలంలో లేని భావాన్ని చేర్చలేదు.
- source_word: בְּאָדָם
  choice: ఒక మనిషికి
  rationale: אָדָם ఇక్కడ ఏ మానవునికైనా వర్తించే ఏకవచన న్యాయసందర్భ పదం. తెలుగులో వ్యాధి లేదా లక్షణం కలగడాన్ని ‘మనిషికి’ అని చెప్పడం సహజం.
- source_word: וְהוּבָא
  choice: అతణ్ణి ... తీసుకురావాలి
  rationale: హీబ్రూ నిష్క్రియాత్మక రూపంలోని విధానపరమైన ఆజ్ఞను తెలుగులో సహజమైన కర్తరహిత బాధ్యతా నిర్మాణంతో వ్యక్తపరుస్తుంది; ఎవరు తీసుకురావాలో మూలం చెప్పనందున పేర్కొనలేదు.
- source_word: אֶל הַכֹּהֵן
  choice: యాజకుని దగ్గరికి
  rationale: నిర్దిష్ట ఆర్టికల్ ఆ ప్రక్రియలో పరిశీలించే యాజకుణ్ణి సూచిస్తుంది. ‘దగ్గరికి’ ఆధునిక తెలుగులో వ్యక్తి వద్దకు తీసుకురావడాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: צָרַעַת యొక్క వ్యాధి పరిధి
  choice: ప్రధాన పాఠంలో ‘కుష్ఠువ్యాధి’, పాదసూచికలో విస్తృత అర్థ వివరణ
  alternative: తీవ్రమైన చర్మవ్యాధి
  rationale: సంప్రదాయ గుర్తింపును నిలుపుతూనే, దీనిని ఆధునిక హాన్సెన్ వ్యాధితో మాత్రమే సమానపరచకుండా మూలపదంలోని వైద్య అనిశ్చితిని స్పష్టంగా కాపాడుతుంది.
- issue: אָדָם యొక్క సాధారణ మానవ సూచన
  choice: ఒక మనిషికి
  alternative: ఒక వ్యక్తికి
  rationale: ఏకవచన సాధారణ మానవ సందర్భాన్ని మూలానికి సమీపంగా ఉంచుతుంది; ఈ నియమం పురుషులకు మాత్రమే పరిమితమని సూచించడం ఉద్దేశం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి శైలిని సహజంగా ఉంచిన గౌరవప్రదమైన వాక్యం. మూలంలోని షరతు–ప్రక్రియ క్రమం నిలుపబడింది; వ్యాధి పరిధిలోని అనిశ్చితి పాదసూచికలో భద్రపరచబడింది.
