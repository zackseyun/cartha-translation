translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. నిర్ధారణ నియమానికి సహజమైన షరతు నిర్మాణాన్ని ఎంచుకున్నాం; ‘వాపు’ మరియు ‘మెరిసే మచ్చ’ మధ్య మూలంలోని పదభేదాన్ని నిలిపాం.
