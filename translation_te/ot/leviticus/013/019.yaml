  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: te
  text: కురుపు ఉన్న చోట తెల్లని వాపుగాని, ఎరుపు కలిసిన తెల్లని మెరిసే మచ్చగాని ఏర్పడితే, అతడు యాజకుని ఎదుట హాజరుకావాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు యాజకునికి కనిపించాలి.” హీబ్రూ క్రియను మరింత అక్షరార్థంగా “కనిపించాలి” లేదా “ప్రత్యక్షమవాలి” అని అనువదించవచ్చు; ఇక్కడ యాజకుని పరీక్ష కోసం ప్రభావిత వ్యక్తి యాజకుని ఎదుట హాజరుకావడమే భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఏర్పడితే
  rationale: ఈ నిర్ధారణ సందర్భంలో היה మునుపటి కురుపు ఉన్న చోట చర్మస్థితి ఉనికిలోకి రావడాన్ని సూచిస్తుంది. తెలుగు షరతు వాక్యంలో ‘ఏర్పడితే’ సహజంగా ఉండి ఆ ఆవిర్భావ భావాన్ని నిలుపుతుంది.
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: కురుపు ఉన్న చోట
  rationale: שְׁחִין అనేది వాచిన పుండు లేదా కురుపును సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘కురుపు’ స్పష్టమైన సమానార్థకం. ‘ఉన్న చోట’ మునుపటి గాయం ఉన్న స్థలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׂאֵת לְבָנָה
  choice: తెల్లని వాపు
  rationale: שְׂאֵת చర్మంపై పైకి లేచిన వాపును సూచిస్తుంది. ‘తెల్లని వాపు’ రంగు మరియు గాయం స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: ఎరుపు కలిసిన తెల్లని మెరిసే మచ్చ
  rationale: בַהֶרֶת ప్రకాశంగా లేదా స్పష్టంగా కనిపించే చర్మమచ్చ; అది తెల్లగా ఉండి ఎర్రదనం కలిగినదని విశేషణాలు చెబుతున్నాయి. ఈ అనువాదం రెండు రంగుల వర్ణననూ నిలుపుతుంది.
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: దానిని యాజకునికి చూపించాలి
  rationale: נראה అనే నిఫాల్ రూపం అక్షరార్థంగా ‘కనిపించాలి/చూడబడాలి’ కావచ్చు; అయితే ఈ నియమ సందర్భంలో యాజకుని పరీక్షకు గాయాన్ని సమర్పించడమే ఉద్దేశం. ‘చూపించాలి’ ఆ విధానార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
