  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: te
  text: అతని తల ముందుభాగంలోని వెంట్రుకలు ఊడిపోతే[a], అతడు నుదుటి వైపు బట్టతల గలవాడు; అతడు శుద్ధుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తల ముందుభాగంలో బట్టతల గలవాడు.’ ఇక్కడి హీబ్రూ పదం మునుపటి వచనంలో చెప్పిన తల వెనుకభాగపు బట్టతల నుండి దీనిని వేరు చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: అతని తల ముందుభాగంలో
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘అతని ముఖం వైపు అంచు/భాగం నుండి’ అనే భావాన్ని ఇస్తుంది; అయితే తలపై వెంట్రుకలు రాలడాన్ని పరిశీలించే ఈ సందర్భంలో తల ముందుభాగాన్ని సూచిస్తుంది.
- source_word: יִמָּרֵט
  choice: వెంట్రుకలు ఊడిపోతే
  rationale: నిఫాల్ రూపం వెంట్రుకలు తొలగిపోయి ఆ భాగం బట్టగా కావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: רֹאשׁוֹ
  choice: అతని తల
  rationale: శరీర నిర్మాణ సంబంధమైన ఈ సందర్భంలో మూలపదానికి నేరమైన, సహజమైన అనువాదం.
- source_word: גִּבֵּחַ
  choice: నుదుటి వైపు బట్టతల ఉన్నవాడు
  rationale: మునుపటి వచనంలోని తల వెనుకభాగపు బట్టతలకు భిన్నంగా, ఈ పదం ముందుభాగపు బట్టతలను సూచిస్తుంది; ఆ తేడాను అనువాదంలో స్పష్టంగా ఉంచాం.
- source_word: טָהוֹר
  choice: శుద్ధుడు
  rationale: లేవీయకాండము 13లో ఇది నైతిక స్వచ్ఛతను కాక ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది. తెలుగు బైబిలు పరిభాషలో ‘శుద్ధుడు’ ఈ భావాన్ని తగిన విధంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శుద్ధతా నియమాలలో ఆచారపరమైన స్థితిని తెలిపే పదం
  choice: శుద్ధుడు
  alternative: పవిత్రుడు / పరిశుద్ధుడు
  rationale: ఈ వచనం వ్యక్తి నైతికత లేదా పరిశుద్ధత గురించి కాక, యాజకుడు నిర్ణయించే ఆచారపరమైన శుద్ధస్థితి గురించి చెబుతుంది. అందువల్ల ‘శుద్ధుడు’ అనే పదం ఆ లేవీయ వర్గీకరణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నుదుటి వైపు బట్టతల’ అనే వ్యక్తీకరణ ద్వారా ముందుభాగం–వెనుకభాగం మధ్య మూలపాఠంలోని నిర్ధారణాత్మక వ్యత్యాసాన్ని నిలిపాం.
