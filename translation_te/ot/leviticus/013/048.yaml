id: LEV.13.48
reference: Leviticus 13:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֤וֹ בִֽ/שְׁתִי֙ א֣וֹ בְ/עֵ֔רֶב לַ/פִּשְׁתִּ֖ים וְ/לַ/צָּ֑מֶר א֣וֹ בְ/ע֔וֹר א֖וֹ בְּ/כָל מְלֶ֥אכֶת עֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/048.yaml
  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: te
  text: లేదా అవిసె నారతో చేసిన లేదా ఉన్ని వస్త్రపు నిలువు పోగులో గానీ అడ్డుపోగులో గానీ, తోలులో గానీ, తోలుతో చేసిన ఏ వస్తువులో గానీ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: నిలువు పోగు
  rationale: నేతలో పొడవుగా అమర్చే దారాలను సూచించే సాంకేతిక పదానికి స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: עֵרֶב
  choice: అడ్డుపోగు
  rationale: నిలువు పోగుల గుండా అడ్డంగా నేసే దారాలను సూచిస్తుంది; שְׁתִיతో ఉన్న జంటను సహజంగా నిలుపుతుంది.
- source_word: לַפִּשְׁתִּים
  choice: అవిసెనారతో చేసిన వస్త్రం
  rationale: పదం ప్రాథమికంగా అవిసెను లేదా అవిసెనారను సూచించగలదు; నేత సందర్భంలో ఆ నారతో చేసిన వస్త్రం ఉద్దేశించబడింది. కేవలం 'నారబట్ట' కంటే మూల పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלַצָּמֶר
  choice: ఉన్ని వస్త్రం
  rationale: צֶמֶר అంటే ఉన్ని; ఇక్కడ నిలువు, అడ్డుపోగుల సందర్భం కావడంతో వస్త్రార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: עוֹר
  choice: తోలు
  rationale: ఈ సందర్భంలో ఉపయోగానికి సిద్ధం చేసిన జంతుచర్మ పదార్థాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో 'తోలు' సహజమైన సమానం.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: తోలుతో చేసిన ఏ వస్తువులో
  rationale: מְלָאכָה ఇక్కడ పని అనే అమూర్త భావం కాకుండా తయారుచేసిన వస్తువు లేదా ఉత్పత్తిని సూచిస్తుంది.
- source_word: אוֹ ... אוֹ
  choice: గానీ ... గానీ
  rationale: ప్రత్యామ్నాయ స్థానాలు లేదా పదార్థాలను వరుసగా చూపించే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు సముచ్చయంతో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నేతకు సంబంధించిన పదాలను సాధారణ పాఠకుడు గ్రహించగల రీతిలో స్పష్టంగా ఇచ్చాం. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామ చిహ్నం ఉంచాం.
