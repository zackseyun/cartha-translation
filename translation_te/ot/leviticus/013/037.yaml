base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: te
  text: అయితే అతని దృష్టికి పొలుసుల చర్మమచ్చ మారకుండా ఉండి, దానిలో నల్ల వెంట్రుకలు పెరిగితే, ఆ చర్మమచ్చ నయమైంది; అతడు శుద్ధుడు. యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాజకుడు అతణ్ణి శుద్ధపరచాలి.” హీబ్రూ క్రియను అలా కూడా అనువదించవచ్చు; అయితే ఇక్కడ చర్మమచ్చ నయమైన తరువాత యాజకుడు ఇచ్చే అధికారిక శుద్ధత తీర్పును అది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: అతని దృష్టికి
  rationale: ‘అతని కళ్లలో’ అనే హీబ్రూ ప్రయోగం పరిశీలించే వ్యక్తికి కనిపించిన స్థితిని సూచిస్తుంది. సందర్భంలోని పరిశీలన భావాన్ని నిలుపుతూ సహజమైన తెలుగులో అనువదించబడింది.
- source_word: עָמַד
  choice: మారకుండా ఉండి
  rationale: ఈ నిర్ధారణ సందర్భంలో వ్యాధి మచ్చ వ్యాపించకుండా లేదా మార్పు చెందకుండా మునుపటి స్థితిలో ఉండడాన్ని సూచిస్తుంది.
- source_word: הַנֶּתֶק
  choice: పొలుసుల వ్యాధి మచ్చ
  rationale: తల లేదా గడ్డం ప్రాంతంలో వచ్చే ప్రత్యేక చర్మవ్యాధి మచ్చను సూచించే పదం. కేవలం ‘దురద’ అని అనువదిస్తే అర్థం కుదించబడుతుంది; ఈ ఎంపిక సాధారణ పాఠకులకు లక్షణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׂעָר שָׁחֹר
  choice: నల్ల వెంట్రుకలు
  rationale: హీబ్రూ పదబంధానికి నేరమైన, సహజమైన అనువాదం; ఈ అధ్యాయంలోని నిర్ధారణాత్మక రంగు వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: צָמַח בּוֹ
  choice: దానిలో ... పెరిగితే
  rationale: ప్రభావిత మచ్చలో వెంట్రుకలు పెరగడాన్ని హీబ్రూ పూర్వప్రత్యయం సూచిస్తుంది.
- source_word: נִרְפָּא
  choice: నయమైంది
  rationale: వ్యాధి మచ్చ స్వస్థపడిన స్థితిని తెలిపే నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: טָהוֹר הוּא
  choice: అతడు శుద్ధుడు
  rationale: ఇక్కడ శుద్ధత నిర్ణయం కేవలం మచ్చను కాక పరిశీలించబడిన వ్యక్తిని ఉద్దేశిస్తుంది. లేవీయకాండంలోని ఆచారపరమైన శుద్ధత భాషను నిలుపుతుంది.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి
  rationale: వ్యాధి నయమైన తరువాత యాజకుడు ఇచ్చే అధికారిక ఆచారపరమైన తీర్పును సూచిస్తుంది; యాజకుడే శారీరకంగా స్వస్థపరుస్తాడనే భావాన్ని కలిగించదు.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధత విషయంలో యాజకుని చర్య స్వభావం
  choice: యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి
  alternative: యాజకుడు అతణ్ణి శుద్ధపరచాలి
  rationale: వచనం మొదట వ్యాధి మచ్చ నయమైందని చెప్పి, ఆ తరువాత యాజకుని అధికారిక తీర్పును పేర్కొంటుంది. కాబట్టి యాజకుడు వ్యాధిని నయం చేస్తున్నాడని కాక, వ్యక్తి శుద్ధుడని నిర్ణయించి ప్రకటిస్తున్నాడని అనువాదం స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పొలుసుల వ్యాధి మచ్చ’ అనే పదబంధం నిర్దిష్ట చర్మస్థితిని వివరిస్తూ, ఆధునిక వైద్య నిర్ధారణను అనవసరంగా పాఠ్యంలోకి తేవకుండా ఉంటుంది. మూలంలోని ‘అతని దృష్టికి’ అనే సూచనలో ఉన్న స్వల్ప సర్వనామ అస్పష్టతను నిలుపుకున్నాం.
