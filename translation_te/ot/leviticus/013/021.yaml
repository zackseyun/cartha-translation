  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בָּ/הּ֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣יא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: te
  text: అయితే యాజకుడు దాన్ని పరిశీలించి, దానిలో తెల్ల వెంట్రుక లేక, అది చర్మం కంటే లోతుగా కనిపించక, అది వెలవెలగా ఉంటే, యాజకుడు ఆ వ్యక్తిని ఏడు రోజులపాటు వేరుగా ఉంచాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడు రోజులపాటు వేరుచేసి ఉంచాలి.” హీబ్రూ క్రియ పరిశీలన కోసం ఆ వ్యక్తిని ఇతరులనుంచి వేరుగా ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే
  rationale: ముందటి నిర్ధారణకు భిన్నమైన షరతును సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: יִרְאֶנָּה
  choice: దాన్ని పరిశీలించినప్పుడు
  rationale: మూలార్థం ‘చూచుట’ అయినప్పటికీ, యాజకుడు వ్యాధి లక్షణాన్ని పరీక్షించే ఈ సందర్భంలో ‘పరిశీలించుట’ ప్రక్రియాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని అధికారిక పరిశీలకునికి ప్రామాణికమైన తెలుగు పదం.
- source_word: וְהִנֵּה
  choice: పరిశీలించినప్పుడు
  rationale: హీబ్రూ పరిశీలనా సూత్రంలోని గమనింపజేసే భావాన్ని తెలుగులో వాక్యప్రవాహంలో సహజంగా కలిపింది; ప్రత్యేకంగా ‘ఇదిగో’ అనడం ఈ సందర్భంలో కృత్రిమంగా ఉంటుంది.
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: దానిలో తెల్ల వెంట్రుక లేక
  rationale: గాయస్థానంలో తెల్ల వెంట్రుక లేకపోవడం అనే నిర్ధారణ ప్రమాణాన్ని నేరుగా ఉంచుతుంది.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: అది చర్మం కంటే లోతుగా ఉండక
  rationale: ‘తక్కువగా/కుంగి’ అనే అక్షరార్థాన్ని చర్మ లక్షణం సందర్భంలో సాధారణ పాఠకునికి అర్థమయ్యే ‘లోతుగా’ అనే రూపంలో అందిస్తుంది.
- source_word: וְהִיא כֵהָה
  choice: వెలవెలగా ఉంటే
  rationale: మచ్చ స్పష్టత లేదా గాఢత తగ్గిన రూపాన్ని సూచిస్తుంది; ‘వెలవెలగా’ అనేది כֵהָה లోని మసకబారిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהִסְגִּירוֹ
  choice: ఆ వ్యక్తిని ... వేరుగా ఉంచాలి
  rationale: పురుష ఏకవచన ప్రత్యయం మచ్చను కాక వ్యక్తిని సూచిస్తుంది. క్రియలోని మూసి ఉంచడం/పరిశీలన కోసం వేరుచేయడం అనే భావాన్ని వైద్యపరంగా అతిగా నిర్దిష్టం చేయకుండా తెలుపుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
