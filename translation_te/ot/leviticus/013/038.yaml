  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: te
  text: ఒక పురుషునికైనా స్త్రీకైనా వారి దేహపు చర్మంపై ప్రకాశవంతమైన మచ్చలు, తెల్లని ప్రకాశవంతమైన మచ్చలు ఉంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ఒక పురుషుని లేదా స్త్రీని
  rationale: హీబ్రూ వాక్యం పురుషుణ్ణి, స్త్రీని స్పష్టంగా పేర్కొంటుంది; ధర్మశాస్త్రంలోని సందర్భాధారిత నియమశైలికి అనుగుణంగా తెలుగులో అనిర్దిష్ట ఏకవచనంగా ఇచ్చాం.
- source_word: כִּי יִהְיֶה
  choice: ఉంటే
  rationale: రోగనిర్ధారణకు సంబంధించిన నియమ సందర్భంలో כִּי ఒక పరిస్థితిని ప్రవేశపెడుతుంది; יִהְיֶהతో కలిపి సహజమైన తెలుగులో ‘ఉంటే’ అని అనువదించాం.
- source_word: בְּעוֹר בְּשָׂרָם
  choice: దేహచర్మంపై
  rationale: עוֹר అంటే ‘చర్మం’; בָּשָׂר ఇక్కడ వ్యక్తి దేహాన్ని సూచిస్తుంది. ‘దేహచర్మంపై’ అనే రూపం సంక్షిప్తంగా, సహజంగా ఉండి శరీర సంబంధిత అర్థాన్ని నిలుపుతుంది.
- source_word: בֶּהָרֹת
  choice: తెల్లని మచ్చలు
  rationale: ఈ వైద్యనిర్ధారణ సందర్భంలో ఈ నామవాచకం చర్మంపై కనిపించే వెలిసిన లేదా ప్రకాశవంతమైన మచ్చలను సూచిస్తుంది; తరువాతి ‘తెల్లని’ అనే విశేషణాన్ని దృష్టిలో ఉంచుకొని మొదటి ప్రస్తావనను సహజ తెలుగులో ‘తెల్లని మచ్చలు’గా ఇచ్చాం.
- source_word: בֶּהָרֹת לְבָנֹת
  choice: తెల్లగా ప్రకాశించే మచ్చలు
  rationale: లְבָנֹת మచ్చల తెలుపు రంగును స్పష్టం చేస్తుంది. హీబ్రూలోని నామవాచక పునరుక్తిని నిలుపుతూ, ప్రకాశవంతమైన/తెల్లని రూపం రెండింటినీ వ్యక్తం చేశాం.
