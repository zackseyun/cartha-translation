  text: And when the body has a boil in its skin[a], and it heals[c][b],
translation:
  language: te
  text: ఒకరి శరీరపు చర్మంలో కురుపు పుట్టి, అది నయమైతే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָשָׂר
  choice: ఒకరి శరీరం
  rationale: בָשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా, ఈ వైద్య-న్యాయ సందర్భంలో మొత్తం వ్యక్తి శరీరాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఒకరి శరీరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כִּי
  choice: పుట్టి … అయితే
  rationale: ఇక్కడ כִּי నియమంలోని సందర్భ-షరతును పరిచయం చేస్తుంది. తెలుగు న్యాయ/ప్రక్రియ శైలిలో ‘అయితే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: శరీరపు చర్మంలో … పుట్టి
  rationale: హీబ్రూలోని ‘అతనిలో/దానిలో, అతని/దాని చర్మంలో ఉండడం’ అనే నిర్మాణాన్ని తెలుగులో సహజంగా ‘శరీరపు చర్మంలో … పుట్టడం’గా వ్యక్తీకరించాం.
- source_word: שְׁחִין
  choice: కురుపు
  rationale: ఈ పదం వాపుతో కూడిన పుండు లేదా boil‌ను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘కురుపు’ సంక్షిప్తమైన, తగిన వైద్య పదం.
- source_word: וְנִרְפָּא
  choice: అది నయమైతే
  rationale: רפא యొక్క నిఫ్అల్ రూపం ఇక్కడ కురుపు నయమవడాన్ని సూచిస్తుంది. ‘నయమైతే’ సహజమైన అకర్మక రూపం; నయం చేసిన కర్తను అనవసరంగా చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నియమ-వివరణ శైలి. ఈ వాక్యం తదుపరి వచనంలో కొనసాగుతున్న షరతు వాక్యం కాబట్టి చివర కామా ఉంచబడింది.
