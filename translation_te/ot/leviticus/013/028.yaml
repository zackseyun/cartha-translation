source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: te
  text: కాని ఆ తెల్లని మచ్చ ఉన్నచోటే[a] నిలిచి, చర్మంలో వ్యాపించకుండా వెలిసిపోయి ఉంటే, అది కాలిన గాయం వల్ల వచ్చిన వాపే. యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి; ఎందుకంటే అది కాలిన గాయం మచ్చ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని కింద.’ హీబ్రూలో అక్షరార్థంగా మచ్చ ‘దాని కింద నిలుస్తుంది’ అని ఉంది; అయితే ఈ సందర్భంలో అది వ్యాపించకుండా అదే చోట నిలిచి ఉందనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: ఉన్నచోటే నిలిచి
  rationale: అక్షరార్థంగా ‘దాని కింద నిలిస్తే’ అని ఉన్నా, ఈ నిర్ధారణ సందర్భంలో మచ్చ కదలకుండా లేదా వ్యాపించకుండా అదే చోట ఉండడమే భావం. సహజమైన తెలుగులో ‘ఉన్నచోటే నిలిచి’ అని ఇచ్చాం.
- source_word: הַבַּהֶרֶת
  choice: ఆ తెల్లని మచ్చ
  rationale: ఈ అధ్యాయంలోని చర్మ పరిశీలన సందర్భంలో కనిపించే ప్రకాశవంతమైన లేదా తెల్లని రంగుమార్పును సూచిస్తుంది; సాధారణ పాఠకునికి ‘తెల్లని మచ్చ’ స్పష్టంగా ఉంటుంది.
- source_word: פָשְׂתָה בָעוֹר
  choice: చర్మంలో వ్యాపించకుండా
  rationale: వ్యాధి లక్షణం చర్మంలో విస్తరించకపోవడాన్ని తెలిపే నిర్ధారణ భాషను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֵהָה
  choice: వెలిసిపోయి
  rationale: మచ్చ ప్రకాశం లేదా తీవ్రత తగ్గిన స్థితిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: కాలిన గాయం వల్ల వచ్చిన వాపు
  rationale: שְׂאֵת చర్మంపై పైకి లేచిన వాపును, מִכְוָה కాలిన గాయాన్ని సూచిస్తాయి. వాటి సంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు ‘వల్ల వచ్చిన’ అని అనువదించాం.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి
  rationale: ఇక్కడ క్రియ శుద్ధి చేయడాన్ని కాక, యాజకుడు పరిశీలన అనంతరం ఆ వ్యక్తి శుద్ధుడని అధికారికంగా నిర్ధారించడాన్ని సూచిస్తుంది.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: కాలిన గాయం మచ్చ
  rationale: కాలిన గాయం మానిన తరువాత మిగిలే గుర్తు లేదా మచ్చను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘శుద్ధుడని ప్రకటించాలి’ అనే ఆచారపరమైన నిర్ధారణ
  choice: శుద్ధుడని ప్రకటించాలి
  alternative: శుద్ధి చేయాలి
  rationale: హీబ్రూ సందర్భంలో యాజకుడు వ్యక్తిని ప్రత్యక్షంగా శుద్ధి చేయడం కాదు; పరిశీలించి అతని ఆచారస్థితిని శుద్ధమైనదిగా ప్రకటిస్తున్నాడు. అందువల్ల కారణాత్మకంగా అపార్థమయ్యే ప్రత్యామ్నాయాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. వైద్య నిర్ధారణకు సంబంధించిన వరుసను స్పష్టంగా ఉంచి, హీబ్రూ వాక్యంలోని కారణ సంబంధాన్ని కాపాడాం. పాఠ్యంలో పాదటిప్పణులు అవసరం కాలేదు.
