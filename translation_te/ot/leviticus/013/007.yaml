translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యాజక పరిశీలనకు సంబంధించిన ధర్మశాస్త్రపరమైన ప్రక్రియ స్పష్టంగా ఉండేలా గౌరవప్రదమైన సాధారణ భాష వాడబడింది. హెబ్రీలోని ఉద్ఘాటనను ‘నిజంగానే’తో నిలిపి, לְטָהֳרָתוֹ లోని శుద్ధుడని నిర్ధారించే ప్రక్రియాత్మక భావాన్ని అతిగా సిద్ధాంతీకరించకుండా వ్యక్తం చేయబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
