  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: te
  text: అయితే, ఆ పొలుసుల మచ్చ చర్మంపై నిజంగానే వ్యాపిస్తే[b][a], అతడు తన శుద్ధీకరణ కొరకు యాజకునికి తనను చూపించుకున్న తర్వాత మళ్లీ యాజకుని ఎదుట హాజరుకావాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పొలుసుల మచ్చ’కు ‘చర్మపు విస్ఫోటనం’, ‘దద్దురులాంటి మచ్చ’ లేదా సంప్రదాయంగా ‘పొక్కు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం పరిశీలనలో ఉన్న పైపొర చర్మస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో క్రియను బలపరచి, ‘ఆ మచ్చ నిజంగానే వ్యాపిస్తే’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘తన శుద్ధీకరణ కొరకు’ అనేది శుద్ధుడిగా పరిగణించబడే ఉద్దేశంతో లేదా ఆ ప్రక్రియలో జరిగే యాజకుని పరిశీలనను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: నిజంగానే వ్యాపిస్తే
  rationale: క్రియకు ముందు వచ్చిన అదే ధాతువు యొక్క సంపూర్ణ క్రియారూపం వ్యాప్తిని బలంగా నొక్కిచెబుతుంది; ‘నిజంగానే’ ఆ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַמִּסְפַּחַת
  choice: పొలుసుల మచ్చ
  rationale: ఇది యాజకుడు పరిశీలించే పైపొర చర్మస్థితిని సూచిస్తుంది. ‘పొక్కు’ లేదా ‘గాయం మీద పొట్టు’ అని పరిమితం చేయకుండా, పొలుసుల స్వభావాన్ని తెలిపే సాధారణ పదబంధం ఎంచుకోబడింది.
- source_word: בָּעוֹר
  choice: ఆ చర్మంపై
  rationale: హెబ్రీ పదబంధం స్థితి ఉన్న ప్రదేశాన్ని సూచిస్తుంది; సందర్భంలోని వ్యక్తి చర్మాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘ఆ’ ఉపయోగించబడింది.
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: తనను చూపించుకున్న తర్వాత
  rationale: నిఫాల్ రూపం ఈ పరిశీలనా సందర్భంలో యాజకుని ఎదుట తనను చూపించుకోవడం లేదా పరిశీలనకు హాజరవడం అనే భావాన్ని ఇస్తుంది.
- source_word: לְטָהֳרָתוֹ
  choice: అతడు శుద్ధుడని నిర్ధారించబడేందుకు
  rationale: ఇక్కడ భావం కేవలం శుద్ధీకరణ క్రియకన్నా, యాజక పరిశీలన ద్వారా శుద్ధుడని ప్రకటించబడే ఉద్దేశం లేదా ప్రక్రియను సూచిస్తుంది.
- source_word: וְנִרְאָה שֵׁנִית אֶל הַכֹּהֵן
  choice: అతడు రెండోసారి యాజకుని ఎదుట కనిపించాలి
  rationale: ధర్మశాస్త్ర సందర్భంలోని నిఫాల్ రూపం మళ్లీ హాజరై పరిశీలించబడవలసిన అవసరాన్ని సూచిస్తుంది; ‘కనిపించాలి’ ఆ ఆదేశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
