source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: te
  text: పాడైన దానిని కడిగిన తర్వాత యాజకుడు దానిని పరిశీలించాలి. ఆ పాడు తన రూపాన్ని[a] మార్చుకోకపోయినా, వ్యాపించకపోయినా, అది అపవిత్రమైనది. దానిని అగ్నిలో కాల్చివేయాలి. అది తినివేసే పాడు; అది దాని ఒక వైపునైనా మరొక వైపునైనా ఉన్నా అలాగే చేయాలి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన రంగును.” హీబ్రూ నుడికారం అక్షరార్థంగా “తన కన్నును మార్చుకోలేదు” అని ఉంది; అది కనిపించే రూపాన్ని, బహుశా ముఖ్యంగా రంగును, సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కొరికి తినే చెడిపోవడం.” ఈ అరుదైన హీబ్రూ పదం వస్త్రం లేదా తోలు పదార్థాన్ని నాశనం చేసే పాడును సూచిస్తుంది; దాని ఖచ్చిత స్వభావం అనిశ్చితం.
    reason: lexical_alternative
  - marker: c
    text: చివరి హీబ్రూ పదబంధం కఠినమైనది. అక్షరార్థంగా అది “దాని బట్టతలలో లేదా దాని నుదుటి బట్టతలలో” అని ఉంటుంది. ఇక్కడ అది పాడైన వస్తువు యొక్క రెండు భిన్న వైపులు లేదా ఉపరితలాలను సూచించే రూపకం కావచ్చు; అవి ఖచ్చితంగా లోపలి, వెలుపలి వైపులేనని నిర్ధారించలేం.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: యాజకుడు దానిని పరిశీలించాలి
  rationale: యాజక సంబంధ నిర్ధారణ సందర్భంలో ראה కేవలం చూడడాన్ని కాక పరిశీలించడాన్ని సూచిస్తుంది.
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: పాడైన దానిని కడిగిన తర్వాత
  rationale: ముందరి వచన సందర్భంలో పాడు ఉన్న వస్తువే కడగబడుతుంది. తెలుగులో ‘పాడైన దాని’ అని చెప్పడం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּגַע
  choice: పాడు
  rationale: వస్త్రం లేదా తోలు వస్తువులో కనిపించే దెబ్బతిన్న ప్రాంతాన్ని సూచించడానికి, ఆధునిక వైద్య నిర్ధారణను అనవసరంగా రుద్దకుండా ఉండే సహజమైన తెలుగు పదం.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: తన రూపాన్ని మార్చుకోకపోయినా
  rationale: ‘తన కన్నును మార్చుకోలేదు’ అనే హీబ్రూ నుడికారానికి కనిపించే రూపం లేదా రంగు మారకపోవడం అనే అర్థం ఉంది; ‘రూపం’ దాని విస్తృతిని నిలుపుతుంది.
- source_word: לֹא פָשָׂה
  choice: వ్యాపించకపోయినా
  rationale: פשה ఇక్కడ పాడు మరింత విస్తరించడాన్ని సూచిస్తుంది.
- source_word: טָמֵא הוּא
  choice: అది అపవిత్రమైనదే
  rationale: లేవీయకాండంలోని ఆచార సంబంధ శుద్ధి వ్యవస్థకు ‘అపవిత్రం’ స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: దానిని అగ్నిలో కాల్చివేయాలి
  rationale: వస్తువును పూర్తిగా అగ్నిలో నాశనం చేయాలనే న్యాయ ఆదేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פְּחֶתֶת
  choice: లోపలికి తినివేసే పాడు
  rationale: ఈ అరుదైన పదం పదార్థాన్ని క్రమంగా నాశనం చేసే లేదా కొరికి తినే విధమైన చెడిపోవడాన్ని సూచిస్తుంది; ఖచ్చితమైన ఆధునిక రోగపేరును రుద్దకుండా దాని విధ్వంసక స్వభావాన్ని వ్యక్తపరుస్తుంది.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: వస్తువు లోపలి వైపున ఉన్నా వెలుపలి వైపున ఉన్నా
  rationale: అక్షరార్థంగా తల బట్టతల భాగాలకు సంబంధించిన రూపకాలైన ఈ జంట పదాలు, వస్త్రం లేదా తోలు వస్తువు యొక్క రెండు వైపులు లేదా ఉపరితలాలను సూచిస్తున్నట్లు సందర్భం తెలుపుతుంది; పదబంధంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: వ్యాపించకపోయినా వస్తువు అపవిత్రంగా నిర్ణయించబడటం
  choice: ‘వ్యాపించకపోయినా అది అపవిత్రమైనదే’ అని మూలంలోని ఉద్రిక్తతను యథాతథంగా ఉంచడం
  alternative: వ్యాపించకపోవడాన్ని శుద్ధతకు సూచనగా వివరణాత్మకంగా మార్చడం
  rationale: మూల వాక్యం రూపం మారకపోవడమూ వ్యాపించకపోవడమూ ఉన్నప్పటికీ అపవిత్రత తీర్పునే ఇస్తుంది; దానిని వివరణతో సడలించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, న్యాయవిధి సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. అరుదైన సాంకేతిక హీబ్రూ పదాలకు అతిగా నిర్దిష్టమైన ఆధునిక రోగపేర్లు ఇవ్వకుండా, ప్రధాన పాఠాన్ని సహజంగా ఉంచి అనిశ్చితిని పాదసూచికల్లో వెల్లడించాం.
