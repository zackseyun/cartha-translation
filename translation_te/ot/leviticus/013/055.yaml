  to: పాడైన దానిని కడిగిన తర్వాత యాజకుడు దానిని పరిశీలించాలి. ఆ పాడు తన రూపాన్ని[a] మార్చుకోకపోయినా, వ్యాపించకపోయినా, అది అపవిత్రమైనది. దానిని అగ్నిలో కాల్చివేయాలి. అది తినివేసే పాడు; అది దాని ఒక వైపునైనా మరొక వైపునైనా ఉన్నా అలాగే చేయాలి[b][c].
