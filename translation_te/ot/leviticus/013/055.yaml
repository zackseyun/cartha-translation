  source_fidelity: 'మొత్తంగా మూలానికి దగ్గరగా ఉంది: కడిగిన తరువాత యాజకుని పరిశీలన, రూపం మారకపోవడం, వ్యాపించకపోవడం, అపవిత్రత తీర్పు, దహనం అన్నీ సరిగ్గా వచ్చాయి. అయితే בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ అనే క్లిష్ట జంటకు ‘లోపలి వైపు/వెలుపలి వైపు’ అని నిర్దిష్టంగా ఇవ్వడం మూలం నిర్ధారించని అర్థాన్ని ప్రధాన పాఠంలో స్థిరపరుస్తోంది. ఇవి వస్త్రం/తోలు వస్తువు యొక్క రెండు భిన్న ఉపరితలాలు లేదా భాగాలను సూచిస్తాయని సందర్భం సూచించినా, వాటి ఖచ్చిత సూచన వివాదాస్పదమే.'
  naturalness: తెలుగు సాధారణంగా సహజంగా, ఆధునికంగా ఉంది. ‘లోపలికి తినివేసే పాడే’ అనే ముగింపు కొద్దిగా బరువుగా ఉంది; ‘తినివేసే పాడు’ మరింత సూటిగా ఉంటుంది. ‘ఒక వైపునైనా మరొక వైపునైనా’ అనేది సహజమైనదీ, క్లిష్ట హీబ్రూ జంటకు తటస్థమైనదీ.
