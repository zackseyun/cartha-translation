source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: te
  text: అయితే మీరు ఉతికిన వస్త్రమైనా, నిలువు నూలైనా, అడ్డ నూలైనా,[a] తోలుతో చేసిన ఏ వస్తువైనా—వాటిలోని ఆ మచ్చ తొలగిపోతే, వాటిని రెండోసారి ఉతకాలి; అప్పుడు అవి శుద్ధమైనవిగా ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అడ్డ నూలు” అంటే నేతలో నిలువు నూలుల మధ్య అడ్డంగా పోయే నూలు.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: వస్త్రం
  rationale: בגד అనే సాధారణ పదానికి సందర్భానుగుణంగా సహజమైన, విస్తృతార్థకమైన తెలుగు పదం.
- source_word: הַשְּׁתִי
  choice: నిలువు నూలు
  rationale: నేతలో పొడవుగా అమర్చే నూలును సాధారణ పాఠకుడు గ్రహించేలా సాంకేతిక భావాన్ని వివరిస్తుంది.
- source_word: הָעֵרֶב
  choice: అడ్డ నూలు
  rationale: שׁתי కి జతగా, నేతలో అడ్డంగా పోయే నూలును స్పష్టంగా సూచిస్తుంది.
- source_word: כָל כְּלִי הָעוֹר
  choice: తోలుతో చేసిన ఏ వస్తువు
  rationale: כְּלִי యొక్క విస్తృతమైన ‘వస్తువు/ఉపకరణం’ భావాన్ని కాపాడుతూ, ‘పాత్ర’ అనే అనవసర సంకుచితార్థాన్ని నివారిస్తుంది.
- source_word: תְּכַבֵּס
  choice: మీరు ఉతికిన
  rationale: రెండవ పురుష ఏకవచన సంబోధనను తెలుగులో గౌరవప్రదమైన సాధారణ సూచనగా నిలుపుతుంది; సంబంధ వాక్య నిర్మాణానికి సహజంగా సరిపోతుంది.
- source_word: הַנָּגַע
  choice: మచ్చ
  rationale: వస్త్రం లేదా తోలు మీద కనిపించే ప్రభావిత ప్రాంతాన్ని ఆధునిక వైద్య నిర్ధారణగా నిర్దిష్టం చేయకుండా దృశ్యమాన గుర్తుగా తెలుపుతుంది.
- source_word: וְסָר מֵהֶם
  choice: వాటిలోనుండి ఆ మచ్చ తొలగిపోతే
  rationale: אֲשֶׁר తో ప్రారంభమైన సంబంధ నిర్మాణంలో, తదుపరి ఆజ్ఞకు పరిస్థితిని తెలిపే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכֻבַּס שֵׁנִית
  choice: దాన్ని రెండోసారి ఉతకాలి
  rationale: హీబ్రూ కర్మణి రూపంలోని విధానాత్మక బలాన్ని తెలుగులో సహజమైన బాధ్యతార్థక నిర్మాణంతో అందిస్తుంది.
- source_word: וְטָהֵר
  choice: అప్పుడు అది శుద్ధమవుతుంది
  rationale: లేవీయకాండపు ఆచార సంబంధమైన טהר భావాన్ని ‘శుద్ధం’తో కాపాడి, ఫలిత క్రమాన్ని ‘అప్పుడు’తో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: טהר యొక్క ఆచార సంబంధ భావం
  choice: శుద్ధమవుతుంది
  alternative: శుభ్రమవుతుంది
  rationale: ఇది కేవలం కనిపించే పరిశుభ్రత కాదు; లేవీయకాండ సందర్భంలో ఆచారపరమైన శుద్ధస్థితిని సూచిస్తుంది.
- issue: וְסָר యొక్క సంబంధం లేదా షరతు భావం
  choice: తొలగిపోతే
  alternative: తొలగిపోయి
  rationale: హీబ్రూలో ప్రత్యక్ష షరతు కణం లేకపోయినా, కడిగిన తరువాత మచ్చ తొలగిన వస్తువుకే రెండవసారి కడగాలనే విధానాన్ని సందర్భం సూచిస్తుంది; తెలుగు షరతు రూపం ఆ సంబంధాన్ని స్పష్టంగా, సిద్ధాంతాత్మక అదనార్థం లేకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే ‘నిలువు నూలు/అడ్డ నూలు’ పదజాలం వాడబడింది. వాక్యం విధానాత్మక గంభీరతను నిలుపుకుంటూనే సహజంగా చదవబడేలా రూపొందించబడింది.
