  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: te
  text: వస్త్రంలోనైనా, తోలులోనైనా, నిలువు దారాల్లోనైనా, అడ్డ దారాల్లోనైనా[a], తోలుతో చేసిన ఏ వస్తువులోనైనా ఆ మచ్చ ఆకుపచ్చటి ఛాయలో గానీ ఎర్రటి ఛాయలో గానీ ఉంటే, అది త్సరాతు మచ్చ[b]. దాన్ని యాజకునికి చూపించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, నేతలో నిలువు దారాలకు అడ్డంగా నేసే దారాలు.
    reason: lexical_clarification
  - marker: b
    text: సాంప్రదాయంగా ‘కుష్ఠు తెగులు’ అని అనువదిస్తారు. ఇక్కడి హీబ్రూ పదం ఆధునిక కుష్ఠువ్యాధిని మాత్రమే సూచించదు; లేవీయకాండంలో మనుష్యుల చర్మంతో పాటు వస్త్రాలు, తోలు మొదలైన వాటిపై కనిపించే యాజక పరిశీలనకు సంబంధించిన విస్తృత తెగులు వర్గాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּגַע
  choice: మచ్చ
  rationale: ఈ సందర్భంలో వస్త్రం లేదా తోలుపై కనబడే ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది. ‘మచ్చ’ సాధారణ పాఠకులకు సహజంగా ఉండి, మనుష్యేతర పదార్థాలకు కూడా సరిపోతుంది.
- source_word: יְרַקְרַק
  choice: ఆకుపచ్చటి ఛాయలో
  rationale: ద్విరుక్త రూపం ఖచ్చితమైన గాఢ ఆకుపచ్చను కాక, ఆకుపచ్చదనాన్ని సూచిస్తుంది. ‘ఛాయలో’ అనే రూపం రంగు సుమారుతనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲדַמְדָּם
  choice: ఎర్రటి ఛాయలో
  rationale: ద్విరుక్త రూపం స్వచ్ఛమైన గాఢ ఎరుపుకంటే ఎర్రదనాన్ని సూచిస్తుంది; అందువల్ల ఈ అనువాదం పరిశీలనాత్మక రంగు వివరణను నిలుపుతుంది.
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: వస్త్రంతో చేసిన దుస్తు లేదా బట్ట అనే సందర్భార్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹר
  choice: తోలు
  rationale: ఇక్కడ జీవి చర్మం కాక, వస్తువుల తయారీలో ఉపయోగించే పదార్థం ఉద్దేశించబడింది; ‘తోలు’ ఆ అర్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: שְׁתִי
  choice: నిలువు దారాలు
  rationale: నేతలో పొడవుగా అమర్చే warp దారాలను సాంకేతిక పదజాలం తెలియని పాఠకుడికీ అర్థమయ్యేలా తెలుపుతుంది.
- source_word: עֵרֶב
  choice: అడ్డ దారాలు
  rationale: నిలువు దారాలకు అడ్డంగా నేసే weft దారాలను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: כְּלִי עוֹר
  choice: తోలుతో చేసిన ఏ వస్తువు
  rationale: כְּלִי అనే విస్తృత పదం పాత్ర, పనిముట్టు లేదా ఇతర సామాను కావచ్చు; ‘ఏ వస్తువు’ ఆ విస్తృతిని పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: נֶגַע צָרַעַת
  choice: త్సరాతు తెగులు
  rationale: צָרַעַת ఆధునిక కుష్ఠువ్యాధితో సమానం కాని యాజక పరిశీలనకు సంబంధించిన విస్తృత వర్గం; లిప్యంతరీకరణ మూలంలోని ప్రత్యేక వర్గాన్ని నిలుపుతుంది, ‘తెగులు’ వస్త్రం మరియు తోలు సందర్భానికి సరిపోతుంది.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: దాన్ని యాజకునికి చూపించాలి
  rationale: హీబ్రూ కర్మణి రూపం చూపించే వ్యక్తిని పేర్కొనదు. తెలుగు అవ్యక్త విధిరూపం ఆ దృష్టిని ప్రభావిత వస్తువుపైనే ఉంచుతుంది.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో צָרַעַת పదానికి అనువాదం
  choice: త్సరాతు తెగులు
  alternative: కుష్ఠు తెగులు
  rationale: లేవీయకాండం 13లో ఈ వర్గం మానవ చర్మానికే కాక వస్త్రాలకు, తోలుకు కూడా వర్తిస్తుంది. కాబట్టి ‘కుష్ఠు’ అనే ఆధునిక వైద్యపరమైన గుర్తింపును ప్రధాన పాఠ్యంలో రుద్దకుండా, మూలంలోని ప్రత్యేకమైన ఆచార-శారీరక వర్గాన్ని నిలుపుతూ వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. అరుదైన నేతపని సాంకేతిక పదాలకు బదులు ‘నిలువు దారాలు’, ‘అడ్డ దారాలు’ అనే పారదర్శక పదబంధాలు ఎంచుకున్నాం. צָרַעַת యొక్క ప్రత్యేకతను కోల్పోకుండా ఉండేందుకు ‘త్సరాతు’ అని లిప్యంతరీకరించి, పాదసూచికలో వివరణ ఇచ్చాం.
