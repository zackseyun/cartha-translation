  terminology: కుష్ఠువ్యాధి అనే ఆధునిక నిర్దిష్ట వైద్యార్థాన్ని ప్రధాన పాఠ్యంలో నివారించి త్సరాతు అనే లిప్యంతరీకరణను ఉంచడం సముచితం. దానికి ‘మచ్చ’ను జతచేయడం נֶגַע యొక్క అర్థాన్నీ, צָרַעַת యొక్క సాంకేతిక వర్గస్వభావాన్నీ కాపాడుతుంది.
