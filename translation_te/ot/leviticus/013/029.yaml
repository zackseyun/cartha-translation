    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ ... אִשָּׁה
  choice: ఒక పురుషునికి గాని స్త్రీకి గాని
  rationale: మూలంలో పురుషుడు, స్త్రీ ఇద్దరూ విడివిడిగా ప్రస్తావించబడ్డారు; తెలుగులో సహజమైన న్యాయనియమ శైలిలో ఆ రెండింటినీ స్పష్టంగా నిలిపింది.
- source_word: כִּי
  choice: ఏర్పడితే
  rationale: ఇక్కడ כִּי ఒక నిర్దిష్ట పరిస్థితిని ప్రవేశపెడుతుంది. ‘ఏర్పడితే’ షరతు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה בּוֹ
  choice: ఏర్పడితే
  rationale: అక్షరార్థంగా ‘అతనిలో/ఆమెపై ఉంటే’; వ్యాధి లక్షణం కనిపించే సందర్భంలో ‘ఏర్పడితే’ సహజమైన తెలుగు ప్రయోగం.
- source_word: נָגַע
  choice: వ్యాధి మచ్చ
  rationale: נגע అనేది యాజకుడు పరిశీలించే కనిపించే పుండు, మచ్చ, లేదా వ్యాధి లక్షణాన్ని సూచించే విస్తృత పదం. నిర్దిష్ట ఆధునిక రోగనిర్ధారణగా చూపకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా ‘వ్యాధి మచ్చ’ ఎంచుకోబడింది.
- source_word: בְּרֹאשׁ
  choice: తలపై
  rationale: మూలపదం సాధారణంగా ‘తల’ అని అర్థం; ఈ సందర్భంలో తలచర్మం ఉద్దేశమై ఉండవచ్చన్న అవకాశాన్ని పాదసూచికలో ఉంచుతూ, ప్రధాన పాఠంలో విస్తృత అర్థాన్ని నిలిపింది.
- source_word: בְזָקָן
  choice: గడ్డంలో
  rationale: זָקָן అంటే ‘గడ్డం.’ ఆ ప్రాంతంలో మచ్చ ఉండటాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘గడ్డంలో’ వాడబడింది.
