base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: te
  text: యాజకుడు అతన్ని పరిశీలించగా, ఇదిగో, ఆ పొలుసుల చర్మవ్యాధి[a] చర్మంలో వ్యాపించి ఉన్నట్లు కనిపిస్తే, పసుపురంగు వెంట్రుక ఉందో లేదో యాజకుడు పరిశీలించనవసరం లేదు; అతడు అపవిత్రుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దురద.” హీబ్రూ పదం ముఖ్యంగా తల లేదా గడ్డం మీద కనిపించే, పొలుసులు మరియు వెంట్రుకల మార్పులతో సంబంధం ఉన్న చర్మస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: యాజకుడు అతన్ని పరిశీలించినప్పుడు
  rationale: ראה సాధారణంగా ‘చూచుట’ అయినా, ఇక్కడ యాజకుని అధికారిక వైద్యసదృశ పరిశీలనను సూచిస్తుంది. ముందున్న నియమాల సందర్భంలో వావ్‌కు షరతు/కాల భావాన్ని సహజ తెలుగులో ‘పరిశీలించినప్పుడు’గా వ్యక్తపరిచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: పరిశీలనలో ప్రత్యక్షంగా కనబడిన విషయంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: פָּשָׂה
  choice: వ్యాపించి ఉంటే
  rationale: చర్మవ్యాధి విస్తరించడాన్ని సూచించే నియమపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది; వాక్యంలోని షరతు సందర్భాన్ని కూడా నిలుపుతుంది.
- source_word: הַנֶּתֶק
  choice: పొలుసుల వ్యాధి
  rationale: తల లేదా గడ్డం ప్రాంతంలో పొలుసులు, వెంట్రుకల మార్పులతో కనిపించే ప్రత్యేక చర్మస్థితిని సాధారణ పాఠకుడికి అర్థమయ్యేలా సూచిస్తుంది; దానిని కేవలం ‘దురద’గా పరిమితం చేయదు.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: హీబ్రూ בְּ ఉపసర్గను సన్నిహితంగా ప్రతిబింబిస్తూ తెలుగులో సహజంగా ఉంది.
- source_word: לֹא יְבַקֵּר
  choice: పరిశీలించాల్సిన అవసరం లేదు
  rationale: వ్యాధి వ్యాపించినట్లు నిర్ధారణ అయిన తర్వాత మరొక లక్షణాన్ని వెదికి తనిఖీ చేయనవసరం లేదనే నియమపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: పసుపురంగు వెంట్రుక కోసం
  rationale: ఈ అధ్యాయంలో ముందుగా పేర్కొన్న నిర్ధారణ సూచనను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: טָמֵא הוּא
  choice: అతడు అపవిత్రుడు
  rationale: వ్యాధిగ్రస్త స్థలాన్ని కాక పరిశీలించబడిన వ్యక్తి పొందే ఆచారపరమైన స్థితిని సూచిస్తుంది.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి నియమాల్లో טָמֵא స్వభావం
  choice: అపవిత్రుడు
  alternative: అశుద్ధుడు
  rationale: ఇక్కడ పదం నైతిక దోషాన్ని తప్పనిసరిగా సూచించకుండా, యాజక నియమాల ప్రకారం వ్యక్తి పొందిన ఆచారపరమైన అపవిత్ర స్థితిని సూచిస్తుంది. తెలుగు బైబిలు సంబంధిత వాడుకలో ‘అపవిత్రుడు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా యాజక నియమాల గంభీరతను నిలుపుతూ అనువదించబడింది. హీబ్రూ వాక్యంలోని సందర్భాధారిత షరతు భావాన్ని తెలుగులో సహజంగా వ్యక్తపరిచాం.
