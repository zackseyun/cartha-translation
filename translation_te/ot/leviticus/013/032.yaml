source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: te
  text: ఏడవ రోజున యాజకుడు ఆ వ్యాధిగల ప్రాంతాన్ని పరిశీలించాలి. ఆ పొలుసుల మచ్చ[a] వ్యాపించకపోయి, దానిలో పసుపురంగు వెంట్రుక లేక, ఆ పొలుసుల మచ్చ చర్మం కంటే లోతుగా కనిపించకపోతే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ נֶתֶק అనే పదం ఈ భాగంలో తలపై లేదా గడ్డంలో వచ్చే ఒక ప్రత్యేకమైన పొలుసుల బాధను సూచిస్తుంది. దీనిని ‘దురద మచ్చ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు నిర్ధారణ కోసం చూసే సందర్భం కాబట్టి, కేవలం ‘చూడాలి’ కంటే విధివంతమైన తనిఖీ భావాన్ని ‘పరిశీలించాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆచారశుద్ధి నియమాలలో כֹּהֵןకు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַנֶּגַע
  choice: వ్యాధిగల ప్రాంతం
  rationale: נֶגַע అనేది ఆధునిక వైద్యపరమైన నిర్దిష్ట వ్యాధిపేరు కాకుండా బాధితమైన శరీరభాగాన్ని సూచించే విస్తృత పదం; అందువల్ల ఈ రూపం సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: తిరిగి పరిశీలించాల్సిన నిర్ణీత సమయాన్ని నేరుగా తెలియజేసే సహజమైన కాలవాచకం.
- source_word: וְהִנֵּה
  choice: పరిశీలనలో తేలే షరతుగా వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హీబ్రూ పదం పరిశీలనలో కనిపించిన విషయాలవైపు దృష్టి మళ్లిస్తుంది. తెలుగులో ‘ఇదిగో’ అనడం వైద్య-న్యాయ విధాన సందర్భంలో కృత్రిమంగా ఉండటంతో, తరువాతి ‘-కపోయి ... -పోతే’ నిర్మాణం ద్వారా దాని కార్యాన్ని సహజంగా నిలిపాం.
- source_word: לֹא פָשָׂה
  choice: వ్యాపించకపోయి
  rationale: చర్మంపై మచ్చ విస్తరించకపోవడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַנֶּתֶק
  choice: పొలుసుల మచ్చ
  rationale: తల లేదా గడ్డం ప్రాంతంలో వచ్చే ఈ ప్రత్యేక బాధను ఆధునిక పాఠకుడు అర్థం చేసుకునేలా చెబుతుంది; ‘మచ్చ’ దాని ప్రాంతీయ స్వభావాన్ని, ‘పొలుసుల’ దాని కనిపించే లక్షణాన్ని సూచిస్తాయి. నిర్దిష్ట ఆధునిక రోగనిర్ధారణను అనవసరంగా మోపదు.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: దానిలో పసుపురంగు వెంట్రుక లేక
  rationale: బాధిత ప్రాంతంలో ఆ నిర్ధారణ సూచన లేదనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שֵׂעָר צָהֹב
  choice: పసుపురంగు వెంట్రుక
  rationale: צָהֹב యొక్క రంగు భావాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: ఆ పొలుసుల మచ్చ చర్మం కంటే లోతుగా కనిపించకపోతే
  rationale: מַרְאֶה అనే కనిపించే రూపాన్ని ‘కనిపించు’ ద్వారా స్పష్టంగా నిలిపి, మచ్చ నిజంగా ఎంత లోతులో ఉందనే ఆధునిక వైద్య నిర్ధారణగా మార్చకుండా దృశ్య పరిశీలన భావాన్ని కాపాడుతుంది.
