translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యాజక సంబంధ నిర్ధారణ ప్రక్రియకు తగిన గౌరవప్రదమైన విధి-నియమ శైలి వాడబడింది. వచనం తదుపరి వాక్యంలో కొనసాగే షరతుతో ముగుస్తున్నందున చివర కామా ఉంచబడింది. ప్రతి పాదంలో ‘పొలుసుల మచ్చ’ అని ఏకరీతిగా వాడి, ఆధునిక వైద్య రోగపేరును మోపకుండా మూలంలోని ప్రత్యేక పదం భావాన్ని సంరక్షించాం.
