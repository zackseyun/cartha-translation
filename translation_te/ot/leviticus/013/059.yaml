- from: ఇది ఉన్ని వస్త్రంలో గానీ, నార వస్త్రంలో గానీ, నిలువు పోగుల్లో గానీ, అడ్డ పోగుల్లో గానీ, ఏ తోలు వస్తువులో గానీ కలిగే కుష్ఠు మచ్చకు సంబంధించిన నియమం—దాన్ని శుద్ధమైనదిగా ప్రకటించాలో అశుద్ధమైనదిగా ప్రకటించాలో నిర్ణయించడానికి ఇచ్చినది.
