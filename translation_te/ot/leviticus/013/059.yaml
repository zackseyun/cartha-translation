id: LEV.13.59
reference: Leviticus 13:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: te
  text: ఇది ఉన్ని వస్త్రంలో గానీ, నార వస్త్రంలో గానీ, నిలువు పోగుల్లో గానీ, అడ్డ పోగుల్లో గానీ, ఏ తోలు వస్తువులో గానీ కలిగే కుష్ఠు మచ్చకు సంబంధించిన నియమం—దానిని శుద్ధమైనదిగా లేదా అశుద్ధమైనదిగా ప్రకటించుటకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרַת
  choice: సంబంధించిన నియమం
  rationale: ఇక్కడ ఈ పదం ముందున్న సందర్భాలకు వర్తించే అధికారిక విధి లేదా నియమాన్ని సూచిస్తుంది.
- source_word: נֶגַע צָרַעַת
  choice: కుష్ఠు మచ్చ
  rationale: נֶגַע కనిపించే మచ్చ లేదా ప్రభావిత భాగాన్ని సూచిస్తుంది; צָרַעַת ఆధునిక హాన్సెన్ వ్యాధితో సమానం కాదు, వస్త్రాలు మరియు తోలు వస్తువులకు కూడా వర్తించే ఆచారపరమైన వర్గం. ‘కుష్ఠు మచ్చ’ సంప్రదాయ సంబంధాన్ని నిలుపుతూ వస్తువుపై కనిపించే లక్షణాన్ని తెలియజేస్తుంది.
- source_word: בֶּגֶד הַצֶּמֶר
  choice: ఉన్ని వస్త్రం
  rationale: ఉన్నితో చేసిన వస్త్రాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הַפִּשְׁתִּים
  choice: నార వస్త్రం
  rationale: సమాంతర నిర్మాణం ప్రకారం అవిసెనారతో చేసిన వస్త్రం అనే భావం; ‘వస్త్రం’ను సందర్భానుసారం పూరించాం.
- source_word: הַשְּׁתִי
  choice: నిలువు పోగులు
  rationale: నేతలో పొడవుగా అమర్చే warp దారాలకు సాధారణ పాఠకుడికి అర్థమయ్యే తెలుగు పదబంధం.
- source_word: הָעֵרֶב
  choice: అడ్డ పోగులు
  rationale: నిలువు పోగులకు అడ్డంగా నేసే weft దారాలను స్పష్టంగా సూచిస్తుంది.
- source_word: כָּל כְּלִי עוֹר
  choice: ఏ తోలు వస్తువు
  rationale: כְּלִי అనే విస్తృతార్థక పదాన్ని పాత్రకు పరిమితం చేయకుండా ఏ రకమైన తోలు సామానునైనా కలుపుతుంది.
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: దాన్ని శుద్ధమైనదిగా ప్రకటించాలో అశుద్ధమైనదిగా ప్రకటించాలో నిర్ణయించడానికి
  rationale: యాజకుడు ఆ వస్తువు ఆచారపరమైన స్థితిని నిర్ధారించి ప్రకటించడమే భావం; భౌతికంగా శుభ్రపరచడం లేదా అపవిత్రం చేయడం కాదు.
theological_decisions:
- issue: వస్త్రాలు, తోలు వస్తువులకు వర్తించే צָרַעַת పదం
  choice: కుష్ఠు మచ్చ
  alternative: చర్మవ్యాధి మచ్చ; కుష్ఠువ్యాధి; అపవిత్రత కలిగించే మచ్చ
  rationale: ఈ సందర్భం మానవ చర్మానికి సంబంధించినది కాదు కాబట్టి ‘చర్మవ్యాధి’ తప్పుదారి పట్టిస్తుంది. అదే సమయంలో దీనిని ఆధునిక వైద్యపరమైన కుష్ఠువ్యాధితో ఖచ్చితంగా సమానం చేయకుండా, సంప్రదాయ పదాన్ని ‘మచ్చ’తో కలిపి వస్తువులపై కనిపించే ఆచారపరమైన లక్షణంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. సాంకేతిక నేత పదాలకు ‘నిలువు పోగులు, అడ్డ పోగులు’ అనే వివరణాత్మక రూపాలు వాడాం. మూలంలో లేని పాదసూచికను చేర్చలేదు.
