source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: te
  text: ఆ మచ్చ ఉన్న వస్త్రాన్నైనా, ఉన్ని లేదా నారతో నేసిన నిలువు దారాలనైనా అడ్డ దారాలనైనా[a], లేదా ఆ మచ్చ ఉన్న ఏ తోలు వస్తువునైనా అతడు కాల్చివేయాలి. ఎందుకంటే అది నాశనకరమైన తెగులు[b]. అది అగ్నిలో కాల్చబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో నేయడంలోని రెండు సాంకేతిక పదాలు ఉన్నాయి: పొడవుగా అమర్చే నిలువు దారాలు, వాటికి అడ్డంగా నేసే అడ్డ దారాలు.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘తెగులు’గా అనువదించిన హీబ్రూ పదం צָרַעַת (త్సరాత్). ఇది ఆధునిక కుష్ఠురోగానికే పరిమితం కాదు; ఆచారపరంగా అపవిత్రం చేసే విస్తృత పరిస్థితిని సూచిస్తూ వస్త్రాలు, ఇళ్ల విషయంలోనూ వాడబడుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: అతడు కాల్చివేయాలి
  rationale: న్యాయవిధుల వరుసలో ఈ క్రియ ఆజ్ఞాత్మక విధిని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘కాల్చివేయాలి’ సహజంగా ఆ నిర్దేశాన్ని వ్యక్తపరుస్తుంది.
- source_word: הַבֶּגֶד
  choice: వస్త్రం
  rationale: בגד అనేది వస్త్రం లేదా ధరించే బట్టకు సాధారణ పదం; సందర్భానికి ‘వస్త్రం’ గౌరవప్రదంగా, విస్తృతంగా సరిపోతుంది.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: నిలువు దారాలు ... అడ్డ దారాలు
  rationale: 'ఇవి నేయడంలో ఉపయోగించే రెండు సాంకేతిక పదాలు: పొడవుగా అమర్చే warp దారాలు, వాటికి అడ్డంగా నేసే weft దారాలు. సాధారణ పాఠకులకు అర్థమయ్యే వివరణాత్మక తెలుగు పదాలు ఎంచుకున్నాం.'
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: ఉన్నితో గానీ నారతో గానీ చేసిన
  rationale: ఇక్కడ నేయబడిన పదార్థపు రకాన్ని సూచిస్తుంది. צמרకు ‘ఉన్ని’, פשתיםకు మూలపదార్థం మరియు వస్త్రసందర్భాన్ని కలిపి తెలియజేసే ‘నార’ వాడాం.
- source_word: כָּל כְּלִי הָעוֹר
  choice: ఏ తోలు వస్తువునైనా
  rationale: כלי విస్తృతార్థంలో ఉపకరణం లేదా వస్తువు; పాత్రకే పరిమితం చేయకుండా ‘తోలు వస్తువు’ అని అనువదించడం సందర్భోచితం.
- source_word: הַנָּגַע
  choice: మచ్చ
  rationale: ఈ అధ్యాయంలో נגע కనిపించే ప్రభావిత గుర్తు లేదా దెబ్బను సూచిస్తుంది. ఆధునిక వైద్య నిర్ధారణను ఆరోపించకుండా ‘మచ్చ’ దాని గోచర స్వభావాన్ని నిలుపుతుంది.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: నాశనకరమైన కుష్ఠు మచ్చ
  rationale: ממארתకు నాశనం చేసే లేదా క్రమంగా తినివేసే భావం ఉంది. צרעת మనుషులకే కాక వస్త్రాలు, ఇళ్లకూ వర్తించే లేవీయ అపవిత్రత వర్గం కావడంతో ‘కుష్ఠు మచ్చ’ అనే సాంప్రదాయ సంబంధాన్ని ఉంచి పాదటిప్పణిలో పరిధిని స్పష్టం చేశాం.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: దానిని అగ్నిలో కాల్చివేయాలి
  rationale: నిఫల్ క్రియారూపంలోని తప్పనిసరి నిష్క్రియ ఫలితాన్ని తెలుగులో సహజమైన విధి వాక్యంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: లేవీయ అపవిత్రత నియమాల్లో צָרַעַת అనువాదం
  choice: కుష్ఠు మచ్చ
  alternative: చర్మవ్యాధి; అపవిత్రపరిచే తెగులు; త్సరాత్
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికన్నా విస్తృతమైన ఆచారపరమైన అపవిత్రత వర్గం; వస్త్రాలు, ఇళ్ల విషయంలోనూ వాడబడుతుంది. తెలుగు బైబిలు సంప్రదాయంతో సంబంధాన్ని నిలుపుతూ ‘కుష్ఠు’ను ఉంచాం, అయితే ఇది ఆధునిక కుష్ఠురోగ నిర్ధారణ కాదని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిధి శైలి వాడబడింది. సాంకేతిక నేయు పదాలను సాధారణ పాఠకులకు అర్థమయ్యే ‘నిలువు దారాలు/అడ్డ దారాలు’గా ఇచ్చాం. మూలంలోని పదపునరుక్తి, చివరి తప్పనిసరి దహన ఆదేశం నిలుపబడ్డాయి.
