  text: וְ/כִֽי יִרְאֶ֨ה הַ/כֹּהֵ֜ן אֶת נֶ֣גַע הַ/נֶּ֗תֶק וְ/הִנֵּ֤ה אֵין מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וְ/שֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑/וֹ וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת נֶ֥גַע הַ/נֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: te
  text: యాజకుడు ఆ పొలుసుల వ్యాధి మచ్చను[a] పరిశీలించినప్పుడు, అది చర్మం కంటే లోతుగా కనిపించకపోతే, దానిలో నల్ల వెంట్రుకలేమీ లేకపోతే, యాజకుడు ఆ మచ్చ ఉన్న వ్యక్తిని ఏడు రోజులపాటు వేరుగా ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పొలుసుల వ్యాధి’ అని అనువదించిన נֶתֶק అనే హీబ్రూ పదం ఈ అధ్యాయంలో తల లేదా గడ్డపు చర్మానికి వచ్చే, వెంట్రుకలు రాలడంతో సంబంధమున్న ఒక ప్రత్యేక వ్యాధిని సూచిస్తుంది; దాని ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణ అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: వ్యాధి మచ్చ
  rationale: ఈ అధ్యాయంలోని పరిశీలన సందర్భంలో ఇది కనిపించే వ్యాధిగ్రస్త మచ్చను లేదా ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా ఉండేలా ‘వ్యాధి మచ్చ’ అని అనువదించాం.
- source_word: נֶתֶק
  choice: పొలుసుల వ్యాధి
  rationale: వెంట్రుకలు రాలడంతో సంబంధమున్న తల లేదా గడ్డపు చర్మానికి చెందిన ఒక నిర్దిష్ట వ్యాధిని సూచించే పదం; ఖచ్చితమైన ఆధునిక వైద్య నిర్ధారణను రుద్దకుండా కనిపించే లక్షణాన్ని తెలియజేస్తుంది.
- source_word: מַרְאֵהוּ
  choice: కనిపించు
  rationale: మచ్చను యాజకుడు కంటితో పరిశీలించే సందర్భానికి తగిన సహజ తెలుగు రూపం.
- source_word: עָמֹק מִן־הָעוֹר
  choice: చర్మం కంటే లోతుగా
  rationale: హీబ్రూ తులనాత్మక నిర్మాణాన్ని అలాగే ఉంచి, మచ్చ చర్మపు ఉపరితలం కంటే దిగిపోయినట్లు కనిపిస్తుందా అనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: שֵׂעָר שָׁחֹר
  choice: నల్ల వెంట్రుక
  rationale: రోగనిర్ధారణ ప్రమాణంలో హీబ్రూ స్పష్టంగా పేర్కొన్న నల్ల రంగును సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: וְהִסְגִּיר
  choice: వేరుగా ఉంచాలి
  rationale: పరిశీలన కోసం తాత్కాలికంగా ఒంటరిగా ఉంచే ఆచరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నిర్బంధించాలి’ అనే కఠిన భావాన్ని నివారిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: וְכִי
  choice: పరిశీలించినప్పుడు
  rationale: మునుపటి నియమాలతో అనుసంధానమైన షరతును తెలుగులో సహజమైన కాల-షరతు వాక్యనిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: יִרְאֶה
  choice: పరిశీలించినప్పుడు
  rationale: పదశః ‘చూచినప్పుడు’ అయినా, ఈ న్యాయ-రోగనిర్ధారణ సందర్భంలో యాజకుడు అధికారికంగా తనిఖీ చేయడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: וְהִסְגִּיר యొక్క కర్మ
  choice: వ్యాధి మచ్చ ఉన్న వ్యక్తిని వేరుగా ఉంచాలి
  alternative: వ్యాధి మచ్చను వేరుగా ఉంచాలి
  rationale: హీబ్రూ వ్యాకరణంలో ‘మచ్చ’ ప్రత్యక్ష కర్మగా ఉన్నప్పటికీ, ఆచరణలో వేరుగా ఉంచబడేది బాధిత వ్యక్తే. తెలుగులో అర్థస్పష్టత కోసం వ్యక్తిని వెల్లడించాం; వ్యాధి స్థితిపై తీర్పు ఇంకా ఇవ్వకుండా పరిశీలన కాలాన్ని మాత్రమే సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-విధి శైలిని ఉపయోగించాం. రోగానికి నిర్దిష్ట ఆధునిక వైద్య నామాన్ని రుద్దకుండా మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
