id: LEV.13.57
reference: Leviticus 13:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: te
  text: అయితే అది వస్త్రంలోనైనా, నిలువు నూలుపోగుల్లోనైనా, అడ్డ నూలుపోగుల్లోనైనా, ఏ తోలు వస్తువులోనైనా మళ్లీ కనిపిస్తే, అది వ్యాపిస్తున్నది[a]. ఆ మచ్చ ఉన్న వస్తువును అగ్నిలో కాల్చివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నెగా అనే పదం లేవీయకాండములో దెబ్బతిన్న లేదా కలుషితమైన ప్రాంతాన్ని సూచించే సాంకేతిక పదం; దీనిని ‘వ్యాధి మచ్చ’ లేదా ‘తెగులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: మళ్లీ కనిపిస్తే
  rationale: నిఫ్అల్ రూపంలోని పరిశీలనాత్మక భావాన్ని, శుద్ధి చేసిన తరువాత మచ్చ తిరిగి కనిపించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֶּגֶד
  choice: వస్త్రం
  rationale: ఈ అధ్యాయంలోని బట్ట లేదా దుస్తుల వస్తువుకు వర్తించే విస్తృత పదం; ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: שְׁתִי
  choice: నిలువు నూలుపోగులు
  rationale: నేతలో పొడవుగా అమర్చే warp దారాలను సాధారణ పాఠకుడికి అర్థమయ్యేలా సాంకేతికంగా ఖచ్చితమైన పదబంధంతో తెలిపింది.
- source_word: עֵרֶב
  choice: అడ్డ నూలుపోగులు
  rationale: నిలువు పోగులకు అడ్డంగా నేసే weft దారాలను స్పష్టంగా తెలుపుతూ జతపదాల వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: כְּלִי עוֹר
  choice: తోలు వస్తువు
  rationale: తోలుతో చేసిన ఏ ఉపకరణం లేదా వస్తువునైనా సూచించే హీబ్రూ పదబంధపు విస్తృతిని నిలుపుతుంది.
- source_word: פֹּרַחַת הִוא
  choice: అది వ్యాపిస్తున్న మచ్చ
  rationale: פרח యొక్క అక్షరార్థమైన ‘మొలకెత్తడం’ను కృత్రిమంగా అనువదించకుండా, ఈ సందర్భంలో మచ్చ తిరిగి విస్తరిస్తున్న క్రియాశీల భావాన్ని తెలియజేస్తుంది.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: అగ్నిలో కాల్చివేయాలి
  rationale: హీబ్రూలోని ప్రత్యక్ష న్యాయ ఆదేశాన్ని తెలుగులో సహజమైన విధి వాక్యంగా అందిస్తుంది; కర్తను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: ఆ మచ్చ ఉన్న వస్తువును
  rationale: మచ్చ కలిగిన మొత్తం వస్తువే కాల్చబడాలని సంబంధవాచక నిర్మాణాన్ని స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנָּגַע
  choice: మచ్చ
  rationale: లేవీయకాండము 13లోని సాంకేతిక పదం ఆధునిక వైద్య నిర్ధారణను తప్పనిసరిగా సూచించదు; ‘మచ్చ’ కనిపించే దెబ్బతిన్న లేదా కలుషిత ప్రాంతాన్ని తటస్థంగా సూచిస్తుంది.
