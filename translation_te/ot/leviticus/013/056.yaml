  edition: WLC
  text: וְ/אִם֮ רָאָ֣ה הַ/כֹּהֵן֒ וְ/הִנֵּה֙ כֵּהָ֣ה הַ/נֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑/וֹ וְ/קָרַ֣ע אֹת֗/וֹ מִן הַ/בֶּ֨גֶד֙ א֣וֹ מִן הָ/ע֔וֹר א֥וֹ מִן הַ/שְּׁתִ֖י א֥וֹ מִן הָ/עֵֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: te
  text: కాని యాజకుడు దానిని పరిశీలించినప్పుడు, అది కడిగిన తర్వాత ఆ మచ్చ వెలిసిపోయి ఉంటే, అతడు వస్త్రం నుండిగాని, తోలు నుండిగాని, నిలువుపోగుల నుండిగాని, అడ్డుపోగుల[a] నుండిగాని ఆ భాగాన్ని చింపి తీసివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, నేసిన వస్త్రంలో అడ్డంగా వెళ్లే దారాలు.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאִם רָאָה הַכֹּהֵן
  choice: కాని యాజకుడు దానిని పరిశీలించినప్పుడు
  rationale: హీబ్రూ షరతుతో కూడిన కొనసాగింపును సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తూ, ראה అనే ‘చూడడం’ క్రియకు ఈ న్యాయవిధి సందర్భంలో ‘పరిశీలించడం’ అనే భావాన్ని ఇచ్చింది.
- source_word: וְהִנֵּה כֵּהָה הַנֶּגַע
  choice: ఆ మచ్చ వెలిసిపోయి ఉంటే
  rationale: וְהִנֵּה సూచించే గమనార్హ ఫలితాన్ని తెలుగు షరతు నిర్మాణంలో సహజంగా కలిపింది; כהה ఇక్కడ మచ్చ తీవ్రత తగ్గడాన్ని సూచిస్తుంది.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: అది కడిగిన తర్వాత
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని నిలుపుతూ, సూచింపబడిన వస్తువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְקָרַע אֹתוֹ
  choice: ఆ భాగాన్ని చింపి తీసివేయాలి
  rationale: సర్వనామం మొత్తం వస్తువును కాక మచ్చ ఉన్న భాగాన్ని సూచిస్తున్నదని సందర్భం తెలియజేస్తుంది; ‘చింపి తీసివేయాలి’ తొలగింపు చర్యను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִן הַבֶּגֶד אֹו מִן הָעוֹר
  choice: వస్త్రం నుండిగాని, తోలు నుండిగాని
  rationale: בגד కు ‘వస్త్రం’, పదార్థ సందర్భంలోని עור కు ‘తోలు’ సాధారణ ఆధునిక తెలుగు పదాలు.
- source_word: מִן הַשְּׁתִי אֹו מִן הָעֵרֶב
  choice: నిలువుపోగుల నుండిగాని, అడ్డుపోగుల[a] నుండిగాని
  rationale: నేతలోని longitudinal మరియు transverse దారాలను తెలుగులో అర్థమయ్యే సాంకేతిక పదాలతో వేరు చేస్తుంది; మూలంలోని జోడీని కాపాడుతుంది.
