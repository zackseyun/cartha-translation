translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండంలోని విధినిర్దేశ శైలికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే భాష వాడబడింది. ‘నిలువుపోగులు/అడ్డుపోగులు’ అనే నేతపని పదజాలానికి సంక్షిప్త వివరణ జోడించబడింది.
