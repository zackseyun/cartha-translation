  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/כִ֨בְּס֔וּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּ֑גַע וְ/הִסְגִּיר֥/וֹ שִׁבְעַת יָמִ֖ים שֵׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/054.yaml
  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: te
  text: అప్పుడు యాజకుడు తెగులు ఉన్న వస్తువును కడగమని ఆజ్ఞాపించి, దానిని మరోసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని మరోసారి ఏడు రోజులపాటు మూసి ఉంచాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: అప్పుడు యాజకుడు ... ఆజ్ఞాపించి
  rationale: న్యాయవిధాన క్రమంలో వావ్‌తో కూడిన క్రియ తదుపరి చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְכִבְּסוּ
  choice: కడగాలని
  rationale: బహువచన కర్తలు నిర్దిష్టంగా చెప్పబడలేదు. యాజకుడు ఇతరులతో కడిగించాలనే భావాన్ని, కర్తలను అదనంగా నిర్దేశించకుండా ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: తెగులు ఉన్న వస్తువును
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణం పరిశీలనలో ఉన్న ప్రభావిత వస్తువును విస్తృతంగా సూచిస్తుంది. సందర్భంలోని బట్ట, తోలు లేదా నేసిన వస్తువులన్నిటికీ ‘వస్తువు’ సరిపోతుంది.
- source_word: הַנָּגַע
  choice: తెగులు
  rationale: లేవీయకాండము 13లో ఈ పదం మనుషులపై గానీ వస్తువులపై గానీ కనిపించే తీవ్రమైన ప్రభావిత స్థితి లేదా మచ్చను సూచిస్తుంది. ‘తెగులు’ దాని తీవ్రతను నిలుపుతూ వస్తువుల సందర్భంలోనూ సహజంగా ఉంటుంది.
- source_word: וְהִסְגִּירוֹ
  choice: దానిని ... వేరుగా ఉంచాలి
  rationale: మూలక్రియ మూసివేయడం లేదా నిర్బంధించి పరిశీలనలో ఉంచడం అనే భావాన్ని ఇస్తుంది. ‘వేరుగా ఉంచాలి’ ఆధునిక పాఠకులకు ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: రెండోసారి ఏడు రోజులపాటు
  rationale: మునుపటి ఏడు రోజుల వేరుచేయడాన్ని మరోసారి చేయాలని స్పష్టంగా, సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయవిధాన శైలిని ఉపయోగించాం. హీబ్రూలో ప్రభావిత వస్తువుకు ఉన్న విస్తృత సూచనను ‘వస్తువు’తో నిలుపుకున్నాం; నిర్దిష్టంగా చెప్పని కడిగే వ్యక్తులను అనవసరంగా చేర్చలేదు.
