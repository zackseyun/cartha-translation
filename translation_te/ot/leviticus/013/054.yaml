- from: అప్పుడు యాజకుడు తెగులు ఉన్న వస్తువును కడగాలని ఆజ్ఞాపించి, దానిని రెండోసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a]
  to: అప్పుడు యాజకుడు తెగులు ఉన్న వస్తువును కడగమని ఆజ్ఞాపించి, దానిని మరోసారి ఏడు రోజులపాటు వేరుగా ఉంచాలి.[a]
