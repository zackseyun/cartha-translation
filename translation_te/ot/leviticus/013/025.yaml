source:
  edition: WLC
  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: te
  text: యాజకుడు దానిని పరిశీలించాలి. ఇదిగో, ఆ ప్రకాశవంతమైన మచ్చలోని వెంట్రుక తెల్లబడింది; ఆ మచ్చ చర్మం కంటే లోతుగా కనిపిస్తోంది. అది కాలిన మచ్చలో చెలరేగిన చర్మవ్యాధి[a]. యాజకుడు అతణ్ణి అపవిత్రుడని ప్రకటించాలి. అది చర్మవ్యాధి మచ్చ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ‘త్సారాత్’. ఇది తీవ్రమైన చర్మబాధలకు వాడిన విస్తృత పదం; సంప్రదాయంగా ‘కుష్ఠువ్యాధి’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: పరిశీలించాలి
  rationale: యాజకుడు కేవలం చూడడం కాకుండా అధికారికంగా పరీక్షించి నిర్ధారించే సందర్భం కావడంతో ‘పరిశీలించాలి’ సహజంగాను సందర్భోచితంగాను ఉంది.
- source_word: בַּהֶרֶת
  choice: తెల్లని మచ్చ
  rationale: చర్మంపై స్పష్టంగా కనిపించే ప్రకాశవంతమైన లేదా తెల్లని మచ్చను సూచిస్తుంది; ఆధునిక వైద్యపదాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: వెంట్రుక తెల్లబడింది
  rationale: వెంట్రుక రంగు తెల్లగా మారినదనే హీబ్రూ క్రియాభావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: ఆ మచ్చ చర్మం కంటే లోతుగా కనిపిస్తోంది
  rationale: కంటికి కనిపించే లోతు లేదా అణగిన రూపాన్ని సూచించే యాజక నిర్ధారణ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన ఆచారపరమైన చర్మబాధల వర్గాన్ని సూచిస్తుంది; ‘చర్మవ్యాధి’ అనవసరమైన వైద్య నిర్దిష్టతను నివారిస్తుంది.
- source_word: מִכְוָה
  choice: కాలిన మచ్చ
  rationale: కాలిన గాయం ఉన్న స్థలం లేదా దాని మిగిలిన గుర్తును సందర్భానుసారంగా సూచిస్తుంది.
- source_word: פָּרָחָה
  choice: చెలరేగిన
  rationale: చర్మబాధ బయటపడటం లేదా వ్యాపించి కనిపించడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: טִמֵּא אֹתוֹ
  choice: అతణ్ణి అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు అపవిత్రతను కలిగించడం కాకుండా ఆచారపరమైన తీర్పును అధికారికంగా ప్రకటిస్తున్నాడనే భావాన్ని కాపాడుతుంది.
- source_word: נֶגַע צָרַעַת
  choice: చర్మవ్యాధికి సంబంధించిన మచ్చ
  rationale: נֶגַע అనే పదంలోని కనిపించే బాధిత మచ్చ లేదా గాయస్థాన భావాన్ని ఉంచుతూ, దానిని ఆధునిక అర్థంలోని సూక్ష్మజీవ సంక్రమణగా నిర్ధారించదు.
theological_decisions:
- issue: లేవీయకాండంలోని צָרַעַת పదానికి అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠువ్యాధి
  rationale: צָרַעַת అనే ప్రాచీన వర్గం ఆధునిక కుష్ఠు లేదా హాన్సెన్ వ్యాధితో సమానం కాదు. ‘చర్మవ్యాధి’ మూలంలోని విస్తృతతను కాపాడి, ఆచారపరమైన అపవిత్రతను వైద్య నిర్ధారణతో కలపదు.
- issue: טִמֵּא అనే యాజక చర్య స్వభావం
  choice: అపవిత్రుడని ప్రకటించాలి
  alternative: అపవిత్రుణ్ణి చేయాలి
  rationale: ఈ సందర్భంలో యాజకుడు వ్యక్తికి అపవిత్రతను కలిగిస్తున్నాడని కాక, పరిశీలన ఆధారంగా ఆచారపరమైన స్థితిని ప్రకటిస్తున్నాడని తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా וְהִנֵּה యొక్క దృష్టి ఆకర్షించే బలం నిలుపబడింది. చిన్న వాక్యాలతో నిర్ధారణ క్రమం స్పష్టంగా ఉంచబడింది; ఆధునిక వైద్య నిర్ధారణలను మూలపాఠంలోకి చొప్పించలేదు.
