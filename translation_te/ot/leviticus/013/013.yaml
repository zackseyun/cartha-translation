id: LEV.13.13
reference: Leviticus 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: te
  text: యాజకుడు పరిశీలించినప్పుడు, ఇదిగో, ఆ చర్మవ్యాధి అతని శరీరమంతటినీ కప్పివేసి ఉందని గమనిస్తే, యాజకుడు ఆ వ్యాధిగల వ్యక్తిని శుద్ధుడని ప్రకటించాలి[a]. అదంతా తెల్లగా మారింది; ఆ వ్యక్తి శుద్ధుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘ఆ మచ్చను/వ్యాధిని శుద్ధమైనదిగా ప్రకటించాలి’; అయితే ఈ తీర్పు ఆ వ్యాధిగల వ్యక్తికి వర్తిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించినప్పుడు
  rationale: మూలార్థం ‘చూశాడు’ అయినప్పటికీ, యాజక సంబంధిత ఈ న్యాయ సందర్భంలో పరీక్షించి నిర్ధారించే భావం ఉంది. ముందు వచనాల షరతుకు అనుగుణంగా ‘పరిశీలించినప్పుడు’ సహజంగా ఉంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: పరిశీలించి శుద్ధతపై తీర్పు చెప్పే ఆరాధన సంబంధిత అధికారికి ప్రామాణిక తెలుగు పదం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: పరిశీలనలో కనిపించిన పరిస్థితిని స్పష్టంగా ముందుకు తెచ్చే సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: הַצָּרַעַת
  choice: ఆ చర్మవ్యాధి
  rationale: צָרַעַת ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం కాదు; లేవీయకాండంలోని విస్తృత చర్మ రుగ్మతల వర్గాన్ని సూచిస్తుంది. అందువల్ల ‘కుష్ఠు’ అనే అతి నిర్దిష్ట పదాన్ని నివారించాం.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: అతని శరీరమంతటినీ
  rationale: బָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా, ఇక్కడ శరీర ఉపరితలమంతటిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘శరీరమంతటినీ’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְטִהַר אֶת הַנָּגַע
  choice: అతడు ఆ వ్యాధిగల వ్యక్తిని శుద్ధుడని ప్రకటించాలి
  rationale: పియేల్ రూపంలోని טהר ఇక్కడ చికిత్స చేసి శుద్ధి చేయడం కాదు, యాజకుడు శుద్ధతపై తీర్పు ప్రకటించడం. నేర కర్మ అక్షరార్థంగా ‘మచ్చ/వ్యాధి’ అయినా, తీర్పు దానిని కలిగిన వ్యక్తికి వర్తిస్తుంది.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: అదంతా తెల్లగా మారింది
  rationale: మొత్తం ప్రభావిత స్థితి తెల్లబడిందనే సంపూర్ణతను నిలుపుతుంది; సర్వనామ సూచనలో మూలంలోని స్వల్ప అస్పష్టతను అనవసరంగా పరిష్కరించదు.
- source_word: טָהוֹר הוּא
  choice: అతడు శుద్ధుడు
  rationale: లేవీయకాండపు ఆచార శుద్ధత పరిభాషలో טָהוֹרకు ‘శుద్ధుడు’ ప్రామాణికం. ‘ఆచారపరంగా’ అని చేర్చడం అనువాదానికి మించిన వివరణ అవుతుంది.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధత నియమాలలో צָרַעַת అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠు వ్యాధి
  rationale: హెబ్రీ పదం ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన చర్మ రుగ్మతల వర్గాన్ని సూచించగలదు. వైద్యపరమైన తప్పుడు నిర్దిష్టతను నివారిస్తూ ఆచార-న్యాయ సందర్భాన్ని కాపాడుతుంది.
- issue: וְטִהַר లో యాజకుని చర్య స్వభావం
  choice: శుద్ధుడని ప్రకటించాలి
  alternative: శుద్ధి చేయాలి
  rationale: యాజకుడు చికిత్స ద్వారా వ్యక్తిని శుద్ధి చేయడం లేదు; పరిశీలన ఆధారంగా అతని శుద్ధ స్థితిని అధికారికంగా ప్రకటిస్తున్నాడు.
- issue: אֶת הַנָּגַע యొక్క వ్యాకరణ కర్మ
  choice: వ్యాధిగల వ్యక్తిని
  alternative: మచ్చను/వ్యాధిని
  rationale: మూలపదం ‘మచ్చ, దెబ్బ, వ్యాధి’ని సూచించినప్పటికీ, ఈ న్యాయ తీర్పు ఆ స్థితిని కలిగిన వ్యక్తికి వర్తిస్తుంది. సహజ తెలుగులో వ్యక్తిని ఉద్దేశించిన భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం; మూలంలోని రూపాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆచార శైలిని ఉపయోగించాం. ‘ఇదిగో’ మూలంలోని పరిశీలనా సూచనను నిలుపుతుంది. ‘శుద్ధుడు’ అనే పదాన్ని అదనపు మతపరమైన వివరణ లేకుండా లేవీయకాండపు పరిభాషగా ఉంచాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
