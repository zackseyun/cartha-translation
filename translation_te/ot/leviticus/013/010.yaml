translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నియమవాక్య శైలి. తరువాతి వచనంతో కొనసాగే వాక్యం కావడంతో చివర కామా ఉంచబడింది; షరతు నిర్మాణం హీబ్రూ విధానార్థాన్ని సహజంగా అందిస్తుంది.
