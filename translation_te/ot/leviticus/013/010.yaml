source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת לְבָנָה֙ בָּ/ע֔וֹר וְ/הִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּ/מִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּ/שְׂאֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/010.yaml
  text: and the priest examines him[a], and behold, there is a white swelling in the skin, and it has turned the hair white, and there is raw flesh in the swelling[b],
translation:
  language: te
  text: యాజకుడు అతణ్ణి పరిశీలించినప్పుడు, చర్మంలో తెల్లని వాపు[a] ఉండి, అది వెంట్రుకలను తెల్లగా మార్చి, ఆ వాపులో పచ్చి మాంసం[b] ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వాపు’కు బదులుగా ‘పైకి లేచిన మచ్చ’ అని కూడా అనువదించవచ్చు. హీబ్రూ שְׂאֵת ఈ అధ్యాయంలో పైకి ఉబ్బిన చర్మ గాయాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘సజీవ మాంసం’; గాయంలో కనిపించే పచ్చి, సజీవ కణజాలాన్ని ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించినప్పుడు
  rationale: రోగనిర్ధారణకు సంబంధించిన ఈ నియమ సందర్భంలో ראה కేవలం చూడడాన్ని కాక అధికారికంగా పరీక్షించడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని శుద్ధి నియమాల్లో పరీక్షించే అధికారం కలిగిన כֹּהֵן‌కు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וְהִנֵּה
  choice: కనిపిస్తే
  rationale: హీబ్రూ పదం పరిశీలనలో బయటపడిన స్థితిపై దృష్టి నిలుపుతుంది; తెలుగు నియమవాక్య శైలిలో ‘కనిపిస్తే’ దాని కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂאֵת
  choice: వాపు
  rationale: ఈ అధ్యాయంలో చర్మంపై పైకి లేచిన గాయస్థితిని సూచించే సాంకేతిక పదం; ‘వాపు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְבָנָה
  choice: తెల్లని
  rationale: వాపు రంగును తెలిపే విశేషణానికి ప్రత్యక్షమైన అనువాదం.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: עוֹר అంటే చర్మం; בְּ ఉపసర్గను అనుసరించి గాయం చర్మంలో కనిపించే భావాన్ని నిలుపుతుంది.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: అది వెంట్రుకలను తెల్లగా మార్చి
  rationale: స్త్రీలింగ సర్వనామం వాపును సూచిస్తుంది; వాపు వల్ల వెంట్రుకలు తెల్లబడినట్లు హీబ్రూ వాక్య నిర్మాణాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: పచ్చి మాంసం కనిపిస్తే
  rationale: అక్షరార్థంగా ‘సజీవ మాంసం’; గాయంలో బయటపడిన ముడి సజీవ కణజాలాన్ని సహజమైన తెలుగులో ‘పచ్చి మాంసం’గా వ్యక్తం చేసింది.
- source_word: בַּשְׂאֵת
  choice: ఆ వాపులో
  rationale: మాంసం కనిపించే ప్రదేశాన్ని సూచిస్తూ שְׂאֵת‌కు ‘వాపు’ అనే అనువాదాన్ని స్థిరంగా పునరావృతం చేస్తుంది.
