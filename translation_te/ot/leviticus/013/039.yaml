revisions:
- from: యాజకుడు పరిశీలించినప్పుడు, వారి శరీరపు చర్మంపై వెలవెలబోయిన తెల్లని మచ్చలు కనిపిస్తే, అది చర్మంపై వ్యాపించిన బోహక్[a]; అతడు శుద్ధుడే.
  to: యాజకుడు పరిశీలించినప్పుడు, వారి శరీర చర్మంపై మసక తెల్లని మచ్చలు కనిపిస్తే, అది చర్మంపై పుట్టిన చర్మపు దద్దురు[a]; అతడు శుద్ధుడు.
  rationale: సవరణ మూలంలోని పరిశీలనాత్మక, విధానపరమైన వాక్యనిర్మాణాన్ని నిలుపుతుంది. బֹּהַקకు అర్థమయ్యే సాధారణ తెలుగు అనువాదాన్ని ఇచ్చి, దాని వివాదాస్పద లేదా విస్తృత అర్థపరిధిని పాదటిప్పణిలో భద్రపరుస్తుంది. అలాగే פָּרַח యొక్క ఉద్భవ భావాన్ని, టָהוֹר הוּא యొక్క నొక్కిచెప్పని తీర్పును మరింత ఖచ్చితంగా ప్రతిబింబిస్తుంది.
