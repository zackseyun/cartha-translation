  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: te
  text: యాజకుడు పరిశీలించినప్పుడు, వారి శరీర చర్మంపై మసక తెల్లని మచ్చలు కనిపిస్తే, అది చర్మంపై పుట్టిన చర్మపు దద్దురు[a]; అతడు శుద్ధుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో బోహక్ అనే అరుదైన పదం ఉంది. దీనికి ‘చర్మపు దద్దురు,’ ‘చర్మంపై పుట్టిన మచ్చ,’ లేదా ‘చర్మ విస్ఫోటనం’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో ఇది ఈ అధ్యాయంలో అపవిత్రతకు కారణమయ్యే తీవ్రమైన చర్మస్థితికి భిన్నమైనది.
    reason: అరుదైన హెబ్రీ పదం యొక్క అర్థపరిధిని సూచిస్తూ, దానిని నిర్దిష్ట ఆధునిక వైద్యవ్యాధిగా నిర్ధారించకుండా సందర్భోచిత భేదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించినప్పుడు
  rationale: యాజక సంబంధమైన నిర్ధారణ సందర్భంలో ఈ క్రియ కేవలం చూడడాన్ని కాక పరిశీలించడాన్ని సూచిస్తుంది; వాక్యంలోని షరతు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని అధికారిక పరిశీలకునికి ప్రామాణికమైన తెలుగు పదం.
- source_word: בְעוֹר בְּשָׂרָם
  choice: వారి శరీరపు చర్మంపై
  rationale: మూలంలోని బహువచన ప్రత్యయాన్ని నిలుపుతూ, ‘వారి మాంసపు చర్మం’ అనే అసహజ రూపానికి బదులు ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: వెలవెలబోయిన తెల్లని మచ్చలు
  rationale: మచ్చల తెల్లదనం ప్రకాశవంతంగా కాక మందంగా లేదా మసకగా ఉందనే כֵּהוֹת భావాన్ని నిలుపుతుంది.
- source_word: בֹּהַק
  choice: బోహక్
  rationale: అరుదైన, నిర్దిష్ట చర్మస్థితిని సూచించే పదానికి ‘హానిలేని దద్దురు’ వంటి వివరణాత్మక వైద్య నిర్ధారణను ప్రధాన పాఠ్యంలో చేర్చకుండా లిప్యంతరీకరణ చేసి, అర్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: פָּרַח
  choice: వ్యాపించిన
  rationale: చర్మంపై ఆ స్థితి బయటపడటం లేదా విస్తరించటాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ‘వికసించింది’ అనే అక్షరార్థ అసహజతను నివారిస్తుంది.
- source_word: טָהוֹר הוּא
  choice: అతడు శుద్ధుడే
  rationale: ఇది నైతిక నిర్దోషిత్వం లేదా వైద్య స్వస్థత కాక, యాజక ధర్మశాస్త్రంలోని శుద్ధస్థితి తీర్పు అని సందర్భం స్పష్టం చేస్తుంది; ‘ఏ’ తీర్పు నిశ్చయాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యాజకుడు ఇచ్చే శుద్ధత తీర్పు స్వభావం
  choice: అతడు శుద్ధుడే
  alternative: అతడు ఆచారపరంగా శుద్ధుడు
  rationale: మూలంలోని సంక్షిప్తమైన శుద్ధత వర్గాన్ని నిలుపుతూ, ‘ఆచారపరంగా’ అనే వివరణను పాఠ్యంలో అదనంగా చేర్చలేదు; సందర్భమే ధర్మశాస్త్ర సంబంధమైన అర్థాన్ని అందిస్తుంది.
- issue: בֹּהַק అనే చర్మస్థితి స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘బోహక్’, పాదటిప్పణిలో వివరణ
  alternative: హానిలేని దద్దురు
  rationale: ఈ అరుదైన పదాన్ని ఆధునిక వైద్య వర్గంతో అతిగా సమీకరించకుండా, అది ఈ అధ్యాయంలోని అపవిత్రత కలిగించే తీవ్రమైన చర్మవ్యాధి కాదనే సందర్భోచిత భేదాన్ని పాదటిప్పణి ద్వారా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ధర్మశాస్త్ర శైలి. మూలంలోని దృశ్య నిర్ధారణ, మసక తెల్లదనం, చర్మస్థితి, శుద్ధత తీర్పు అన్నింటినీ నిలిపింది. ‘ఇదిగో’ అనే హెబ్రీ సూచకాన్ని తెలుగులో అసహజంగా విడిగా పెట్టకుండా ‘కనిపిస్తే’ అనే పరిశీలన ఫలిత నిర్మాణంలో సహజీకరించింది.
