    rationale: అరుదైన హెబ్రీ పదానికి పూర్తి వైద్య నిర్ధారణను విధించకుండా, అర్థవంతమైన సాధారణ తెలుగు పదాన్ని ఉపయోగించి అనిశ్చితిని పాదటిప్పణిలో భద్రపరచడం ఉత్తమం.
