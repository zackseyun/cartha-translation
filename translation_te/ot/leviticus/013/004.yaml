translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని పాటించాం. వైద్యపరంగా తుది నిర్ధారణను ముందుగానే విధించకుండా దృశ్య పరిశీలన, తాత్కాలిక వేరుచేయడం అనే మూలపాఠ్య భావాలను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
