- from: అయితే అతని శరీర చర్మంపై తెల్లని మెరిసే మచ్చ[a] ఉండి, అది చర్మం కంటే లోతుగా కనిపించకపోతే, దానిలోని వెంట్రుకలు తెల్లబడకపోతే, యాజకుడు ఆ వ్యాధిగ్రస్తమైన ప్రాంతాన్ని[b] ఏడు రోజులపాటు వేరుగా ఉంచాలి[c].
  to: అయితే అతని శరీరపు చర్మంలో తెల్లని మెరిసే మచ్చ[a] ఉండి, అది చర్మం కంటే లోతుగా కనిపించకపోతే, దానిపై ఉన్న వెంట్రుకలు తెల్లబడకపోతే, యాజకుడు ఆ ప్రభావిత మచ్చను[b] ఏడు రోజులపాటు వేరుగా ఉంచాలి[c].
