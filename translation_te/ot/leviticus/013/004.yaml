  source_fidelity: మూల హీబ్రూలోని షరతుల క్రమం, తెల్లని ప్రకాశవంతమైన మచ్చ, చర్మం కంటే లోతుగా కనిపించకపోవడం, దానిపై వెంట్రుకలు తెల్లబడకపోవడం, ఏడు రోజుల వేరుచేయడం అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే וְהִסְגִּיר אֶת־הַנֶּגַע యొక్క ప్రత్యక్ష కర్మ ‘మచ్చ/ప్రభావిత భాగం’ కావడంతో ‘వ్యాధిగ్రస్తమైన ప్రాంతం’ అనేది నిర్ధారణాత్మకంగా కొద్దిగా ఎక్కువగా ఉంది.
