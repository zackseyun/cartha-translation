  terminology: ‘తెల్లని మెరిసే మచ్చ’ బహెరెత్‌కు అనుకూలమైన సహజ పదబంధం. నెగఅ్‌ను ‘ప్రభావిత మచ్చ’గా అనువదించడం, అది వ్యాధి అని ముందే తేల్చకుండా మూలపాఠ్యంలోని పరిశీలనాత్మక స్వరాన్ని కాపాడుతుంది. ‘వేరుగా ఉంచాలి’ తాత్కాలిక పరిశీలనార్థక వేరుచేయడాన్ని బాగా అందిస్తుంది.
