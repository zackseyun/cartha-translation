  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: te
  text: అయితే అతని శరీరపు చర్మంలో తెల్లని మెరిసే మచ్చ[a] ఉండి, అది చర్మం కంటే లోతుగా కనిపించకపోతే, దానిపై ఉన్న వెంట్రుకలు తెల్లబడకపోతే, యాజకుడు ఆ ప్రభావిత మచ్చను[b] ఏడు రోజులపాటు వేరుగా ఉంచాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెరుస్తున్న మచ్చ’ లేదా ‘తెల్లగా మెరిసే ప్రాంతం’; ఇక్కడ ఈ పదం చర్మంపై కనిపించే ప్రకాశవంతమైన మచ్చను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘తెగులు/ప్రభావిత మచ్చ’; యాజకుడు పరిశీలిస్తున్న చర్మమచ్చ లేదా ప్రభావిత భాగాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఏకాంతంగా ఉంచాలి’; పరిశీలన కోసం తాత్కాలికంగా వేరుచేసి ఉంచడాన్ని హీబ్రూ పదం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: మెరిసే మచ్చ
  rationale: ఈ పదం తెలుపు లేదా మెరుపుతో కనిపించే చర్మపు గుర్తును సూచిస్తుంది. ముందున్న వాపు అనే పదానికి భిన్నంగా, సహజమైన ఆధునిక తెలుగులో ‘మెరిసే మచ్చ’ దాని దృశ్య లక్షణాన్ని తెలియజేస్తుంది.
- source_word: לְבָנָה
  choice: తెల్లని
  rationale: మచ్చ రంగును సూటిగా సూచించే విశేషణం.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: అతని శరీర చర్మంపై
  rationale: హీబ్రూ పదబంధంలోని శరీర సంబంధ నిర్దిష్టతను సహజమైన తెలుగులో అందిస్తుంది; ‘మాంసపు చర్మం’ అనే అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: అది చర్మం కంటే లోతుగా కనిపించకపోతే
  rationale: చుట్టూ ఉన్న చర్మంతో పోలిస్తే మచ్చ దృశ్యపరంగా లోతుగా ఉందా లేదా అనే నిర్ధారణ ప్రమాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּשְׂעָרָהּ
  choice: దానిలోని వెంట్రుకలు
  rationale: మచ్చ ఉన్న ప్రాంతంలోని వెంట్రుకలను సూచిస్తుంది. హీబ్రూలో వ్యాకరణపరంగా ఏకవచనం ఉన్నా, తెలుగులో సమూహార్థక బహువచనం సహజంగా ఉంటుంది.
- source_word: לֹא הָפַךְ לָבָן
  choice: తెల్లబడకపోతే
  rationale: రంగు మార్పు జరగలేదనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְהִסְגִּיר
  choice: వేరుగా ఉంచాలి
  rationale: పరిశీలన కోసం తాత్కాలికంగా వేరుచేసి ఉంచే ప్రక్రియను తెలియజేస్తుంది; ఆధునిక వైద్యార్థంలో అతిగా నిర్దిష్టమైన ‘క్వారంటైన్’ పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: אֶת־הַנֶּגַע
  choice: వ్యాధిగ్రస్తమైన ప్రాంతాన్ని
  rationale: ఇంకా తుది వ్యాధినిర్ధారణ చేయకుండా, యాజకుడు పరిశీలిస్తున్న ప్రభావిత చర్మ ప్రాంతాన్ని సూచిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: వేరుగా ఉంచే కాలవ్యవధిని సహజమైన తెలుగు కాలప్రయోగంతో తెలియజేస్తుంది.
