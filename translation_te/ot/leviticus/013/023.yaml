source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: te
  text: కాని ఆ తెల్లని మచ్చ ఉన్నచోటే ఉండి, వ్యాపించకపోతే[a], అది కురుపు మానిన మచ్చ. యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాని కింద’; అంటే ఆ తెల్లని మచ్చ వ్యాపించకుండా ఉన్నచోటే ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... పోతే
  rationale: మునుపటి పరిస్థితికి భిన్నమైన షరతును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: ఉన్నచోటే ఉండి
  rationale: అక్షరార్థంగా ‘దాని కింద నిలిస్తే’; ఇక్కడ మచ్చ విస్తరించకుండా అదే చోట ఉండడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజంగా అందిస్తుంది.
- source_word: הַבַּהֶרֶת
  choice: ఆ తెల్లని మచ్చ
  rationale: చర్మంపై కనిపించే తెల్లని లేదా ప్రకాశవంతమైన గుర్తును సూచిస్తుంది; నిర్దిష్ట వ్యాధి నిర్ధారణను అనవసరంగా జోడించదు.
- source_word: לֹא פָשָׂתָה
  choice: వ్యాపించకపోతే
  rationale: లేవీయకాండము 13లో చర్మస్థితి విస్తరించడాన్ని సూచించే క్రియకు సహజమైన తెలుగు రూపం.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: కురుపు మానిన మచ్చ
  rationale: కురుపు వల్ల మిగిలిన వాపు లేదా మానిన గుర్తు అనే భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: యాజకుడు అతణ్ణి శుద్ధుడని ప్రకటించాలి
  rationale: యాజకుడు వ్యక్తిని శారీరకంగా స్వస్థపరచడం కాక, ఆచారపరమైన శుద్ధస్థితిని ప్రకటించడమే ఇక్కడ ఉద్దేశం.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధత మరియు వైద్యసంబంధ స్వస్థత మధ్య తేడా
  choice: శుద్ధుడని ప్రకటించాలి
  alternative: అతణ్ణి శుద్ధి చేయాలి
  rationale: טהר అనే క్రియ ఈ యాజక పరిశీలన సందర్భంలో వ్యక్తి శుద్ధుడనే ఆచారపరమైన స్థితిని ప్రకటించడాన్ని సూచిస్తుంది; వైద్యచికిత్సను లేదా యాజకుడు స్వయంగా శుద్ధి కలిగించడాన్ని కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తెల్లని మచ్చ’ను దర్శనీయ లక్షణంగా ఉంచి నిర్దిష్ట వైద్య నిర్ధారణను జోడించలేదు; ‘శుద్ధుడని ప్రకటించాలి’ ద్వారా ఆచారపరమైన తీర్పును స్పష్టం చేశాం.
