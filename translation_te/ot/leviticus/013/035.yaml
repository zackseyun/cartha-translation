  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: te
  text: అయితే, అతడు శుద్ధుడని ప్రకటించబడిన తర్వాత, ఆ పొలుసుల తెగులు చర్మంలో నిజంగానే వ్యాపిస్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పొలుసుల తెగులు” అనేది ఈ అధ్యాయంలో తల లేదా గడ్డం ప్రాంతంలో వెంట్రుకలు రాలడం, పొలుసులు ఏర్పడడం వంటి లక్షణాలతో చెప్పబడిన ఒక ప్రత్యేక చర్మస్థితిని సూచించే హెబ్రీ పదానికి అనువాదం. దీనిని “దురద” లేదా పాత అనువాదాల్లో “స్కాల్” అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... వ్యాపిస్తే
  rationale: ఈ షరతు ముందున్న పరిశీలనా విధానానికి భిన్నమైన పరిస్థితిని పరిచయం చేస్తోంది; ‘అయితే’ వ్యత్యాసాన్ని, ‘-తే’ షరతును సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: మరింతగా వ్యాపిస్తే
  rationale: క్రియతో కూడిన infinitive absolute వ్యాప్తి భావాన్ని బలపరుస్తుంది. ‘మరింతగా’ ఆ ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది; అతిగా విస్తరించిందనే అర్థాన్ని బలవంతంగా చేర్చదు.
- source_word: הַנֶּתֶק
  choice: ఆ పొలుసుల తెగులు
  rationale: ఈ అధ్యాయంలో נֶתֶק తల లేదా గడ్డం ప్రాంతంలో వెంట్రుకలను ప్రభావితం చేసే ప్రత్యేక చర్మస్థితిని సూచిస్తుంది. ‘పొలుసుల తెగులు’ దురద మాత్రమే అన్న అపార్థాన్ని నివారిస్తూ కనిపించే వ్యాధిగ్రస్త మచ్చ స్వభావాన్ని తెలియజేస్తుంది.
- source_word: בָּעוֹר
  choice: చర్మంలో
  rationale: עוֹר అంటే చర్మం; בְּ ఉపసర్గకు అనుగుణంగా ‘చర్మంలో’ అని అనువదించడం మూలపాఠానికి దగ్గరగా ఉండి సందర్భానికీ సరిపోతుంది.
- source_word: אַחֲרֵי
  choice: తర్వాత
  rationale: ఇది సాధారణ కాలసూచక అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: טָהֳרָתוֹ
  choice: అతడు శుద్ధుడని ప్రకటించబడిన
  rationale: ఈ యాజక పరిశీలనా సందర్భంలో ఈ పదం నైతిక శుద్ధీకరణకన్నా ముందుగా శుద్ధుడిగా నిర్ధారించబడిన స్థితిని సూచించగలదు. స్పష్టత కోసం ఆ విధానపరమైన భావాన్ని వ్యక్తం చేశాం.
theological_decisions:
- issue: טָהֳרָתוֹ యొక్క ఆచారపరమైన భావం
  choice: అతడు శుద్ధుడని ప్రకటించబడిన తర్వాత
  alternative: అతని శుద్ధీకరణ తర్వాత
  rationale: సందర్భం యాజకుని పరిశీలన మరియు శుద్ధుడనే నిర్ధారణకు సంబంధించినది. ఈ ఎంపిక నైతిక పాపశుద్ధి భావాన్ని అనవసరంగా చేర్చకుండా ఆచారపరమైన స్థితిని తెలియజేస్తుంది; అయితే హెబ్రీ పదం ‘శుద్ధత/శుద్ధీకరణ’ అనే విస్తృత భావాన్ని కలిగి ఉండగలదని పాదటీపులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్రంలోని పరిశీలనా విధానానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకుడికి స్పష్టమైన శైలి. ‘శుద్ధుడని ప్రకటించబడిన’ అనే పదబంధం నైతిక శుద్ధి భావాన్ని కాక ఆచారపరమైన నిర్ధారణను సూచిస్తుంది.
