  source_fidelity: ‘అతడు శుద్ధుడని ప్రకటించబడిన తర్వాత’ is contextually sound for אַחֲרֵי טָהֳרָתוֹ, which refers to the prior priestly declaration of cleanness. However, ‘మరింతగా’ can imply a comparative or additional degree not explicitly stated by the Hebrew. The infinitive absolute plus finite verb emphasizes that the condition really does spread; ‘నిజంగానే వ్యాపిస్తే’ better represents this without adding a comparison.
  naturalness: The verse is clear and uses modern standard Telugu. Adding commas around the temporal clause and replacing ‘మరింతగా’ with ‘నిజంగానే’ yields a smoother, appropriately formal conditional statement.
  terminology: ‘పొలుసుల తెగులు’ is a reasonable modern rendering for נֶתֶק in this chapter. The footnote should identify the expression as a specific condition in the chapter without presenting ‘వ్యాధిగ్రస్త మచ్చ’ as an equally direct lexical alternative, since it is only a broad explanatory paraphrase.
