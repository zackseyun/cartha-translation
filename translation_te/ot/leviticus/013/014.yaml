translation:
  language: te
  text: అయితే అతనిలో[a] జీవమున్న మాంసం కనిపించే రోజున అతడు అపవిత్రుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దానిలో.
    reason: హీబ్రూ బּוֹ అనే సర్వనామం వ్యక్తిని ప్రధానంగా సూచించినప్పటికీ, సందర్భానుసారంగా ప్రభావిత భాగాన్ని లేదా గాయాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: సజీవ మాంసం
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, వ్యాధిగ్రస్త భాగంలో బయటపడిన జీవమున్న మాంసాన్ని సూచిస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడవుతాడు
  rationale: యాజక ధర్మశాస్త్ర సందర్భంలోని ఆచారపరమైన అపవిత్ర స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בּוֹ అనే సర్వనామం దేనిని సూచిస్తుంది
  choice: దానిలో
  alternative: అతనిలో
  rationale: సమీప సందర్భంలోని వ్యాధిగ్రస్త భాగం లేదా లక్షణాన్ని సూచించే భావాన్ని ప్రధాన పాఠంలో ఉంచాం; హీబ్రూ పురుషలింగ సర్వనామం వ్యక్తిని కూడా సూచించగల నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యాజక ధర్మశాస్త్రానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం ఉపయోగించబడింది.
