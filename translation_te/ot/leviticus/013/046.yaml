review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s sequence and legal force: the continuing presence of the נגע, the repeated declaration of uncleanness, solitary residence, and residence outside the camp. ‘వ్యాధి’ is an acceptable contextual rendering of נגע when its broader range is retained in a note. The wording ‘అతనిలో ఉన్న రోజులన్నిటిలో,’ however, is less idiomatic Telugu and can be made more natural without losing the Hebrew’s in/on-him ambiguity.'
  naturalness: The revision uses ‘అతనికి ఆ వ్యాధి ఉన్న రోజులన్నీ,’ which is natural modern standard Telugu. ‘నివాసస్థలం’ clearly conveys מוֹשָׁבוֹ as a place of residence, and ‘వెలుపలే’ appropriately maintains the exclusionary emphasis.
  terminology: ‘అపవిత్రుడు’ faithfully retains the Levitical category without importing a moral judgment. The cultural footnote should be anchored to that term rather than to the final residence clause. ‘శిబిరం’ is the appropriate rendering for מַּחֲנֶה.
  issues:
  - severity: low
    issue: The opening temporal expression is awkward.
    rationale: ‘ఆ వ్యాధి అతనిలో ఉన్న రోజులన్నిటిలో’ is understandable, but ‘అతనికి ఆ వ్యాధి ఉన్న రోజులన్నీ’ is more idiomatic Telugu while retaining the sense of the condition being on/in the person.
  - severity: medium
    issue: Footnote b is anchored to the wrong clause.
    rationale: Its content explains ‘అపవిత్రుడు,’ but the draft places [b] after ‘ఉండాలి.’ It should immediately follow an occurrence of ‘అపవిత్రుడు.’
  - severity: low
    issue: ‘నివాసం’ can refer both to residence and dwelling place.
    rationale: ‘నివాసస్థలం’ more explicitly renders the concrete locative sense of מוֹשָׁבוֹ in this clause.
  revised_text: అతనికి ఆ వ్యాధి[a] ఉన్న రోజులన్నీ అతడు అపవిత్రుడిగా ఉంటాడు.[b] అతడు అపవిత్రుడు. అతడు ఒంటరిగా నివసించాలి; అతని నివాసస్థలం శిబిరం వెలుపలే ఉండాలి.
