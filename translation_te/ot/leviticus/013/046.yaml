source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: te
  text: అతనికి ఆ వ్యాధి[a] ఉన్న రోజులన్నీ అతడు అపవిత్రుడిగా ఉంటాడు.[b] అతడు అపవిత్రుడు. అతడు ఒంటరిగా నివసించాలి; అతని నివాసస్థలం శిబిరం వెలుపలే ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యాధి’కి బదులుగా ‘బాధ,’ ‘తెగులు,’ లేదా ‘వ్యాధిస్థితి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదానికి విస్తృత అర్థం ఉంది; ఇక్కడ అది ఈ అధ్యాయంలో పరీక్షించి నిర్ధారించిన స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అపవిత్రుడు’ అనేది ధర్మశాస్త్ర సందర్భంలోని లేవీయ అపవిత్ర స్థితిని సూచిస్తుంది; అది తప్పనిసరిగా నైతిక దోషాన్ని సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: ఆ వ్యాధి
  rationale: נֶגַע అనేది దెబ్బ, బాధ, వ్యాధిస్థితి వంటి విస్తృత అర్థాలుగల పదం. లేవీయకాండము 13లో పరీక్షించి నిర్ధారించిన చర్మస్థితిని సూచిస్తున్నందున, ఆధునిక తెలుగులో ‘వ్యాధి’ స్పష్టంగా, సహజంగా ఉంటుంది; పదంలోని విస్తృతిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: בּוֹ
  choice: అతనిలో
  rationale: ఈ ఉపసర్గకు ‘అతనిలో/అతనిపై’ అనే భావపరిధి ఉంది. ‘వ్యాధి’తో ‘అతనిలో’ అనడం తెలుగులో సహజం; అది వ్యక్తిలో ఆ స్థితి కొనసాగడాన్ని సూచిస్తుంది.
- source_word: יִטְמָא
  choice: అపవిత్రుడిగా ఉంటాడు
  rationale: Qal రూపం ఇక్కడ ధర్మశాస్త్ర సంబంధమైన అపవిత్ర స్థితిని సూచిస్తుంది. అసంపూర్ణ క్రియ యొక్క కొనసాగింపు/నియమబద్ధ భావాన్ని ‘ఉంటాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: טָמֵא הוּא
  choice: అతడు అపవిత్రుడు
  rationale: క్రియలేని ఈ వాక్యం అతని స్థితిని నొక్కి మళ్లీ చెబుతుంది. ప్రత్యేక వాక్యంగా ఉంచడం మూలంలోని ఉద్ఘాటనను కాపాడుతుంది.
- source_word: בָּדָד
  choice: ఒంటరిగా
  rationale: בָּדָד వేరుగా లేదా ఏకాకిగా ఉండడాన్ని సూచిస్తుంది. ‘ఒంటరిగా’ నేరుగా, సాధారణ పాఠకులకు అర్థమయ్యే రూపం.
- source_word: יֵשֵׁב
  choice: నివసించాలి
  rationale: ישב కూర్చోవడం, ఉండడం, నివసించడం అనే అర్థాలు కలిగి ఉంది. నివాసస్థలాన్ని నియమించే ఈ సందర్భంలో ‘నివసించాలి’ కొనసాగుతున్న నివాసాన్నీ ధర్మశాస్త్ర ఆదేశాన్నీ తెలియజేస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: అరణ్యకాల సమాజ నివాస పరిధికి బయట ఉండడాన్ని ఈ పదబంధం సూచిస్తుంది. ‘శిబిరం వెలుపల’ స్పష్టమైన, స్థిరమైన అనువాదం.
- source_word: מוֹשָׁבוֹ
  choice: అతని నివాసం
  rationale: מוֹשָׁב నివసించే స్థలం లేదా నివాసాన్ని సూచిస్తుంది. ‘అతని నివాసం’ సంక్షిప్తంగా, సహజంగా, స్థలార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: లేవీయకాండము 13లో అపవిత్రత స్వభావం
  choice: ప్రధాన పాఠ్యంలో טמאను ‘అపవిత్రుడు’ అని మాత్రమే అనువదించడం
  alternative: ‘ఆచారపరంగా అపవిత్రుడు’ లేదా ‘కర్మకాండపరంగా అపవిత్రుడు’
  rationale: ఈ వచనం లేవీయ ధర్మశాస్త్రంలోని అపవిత్ర స్థితిని పేర్కొంటుంది; అది తప్పనిసరిగా నైతిక దోషాన్ని సూచించదు. అయితే హీబ్రూ పాఠ్యంలో లేని వివరణాత్మక విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, వివరణను పాదటిప్పణిలో ఇవ్వడం మూలంలోని వర్గీకరణనూ దాని భావతీవ్రతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ధర్మశాస్త్ర ఆదేశాన్ని ‘ఉంటాడు/నివసించాలి/ఉండాలి’ రూపాలతో సహజంగా వ్యక్తపరచి, మూలంలోని ‘అపవిత్రుడు’ అనే పునరుక్తి మరియు ఉద్ఘాటనను నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
