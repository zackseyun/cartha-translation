revisions:
- from: ఆ వ్యాధి[a] అతనిలో ఉన్న రోజులన్నిటిలో అతడు అపవిత్రుడిగా ఉంటాడు. అతడు అపవిత్రుడు. అతడు ఒంటరిగా నివసించాలి; అతని నివాసం శిబిరం వెలుపల ఉండాలి.[b]
  to: అతనికి ఆ వ్యాధి[a] ఉన్న రోజులన్నీ అతడు అపవిత్రుడిగా ఉంటాడు.[b] అతడు అపవిత్రుడు. అతడు ఒంటరిగా నివసించాలి; అతని నివాసస్థలం శిబిరం వెలుపలే ఉండాలి.
