source:
  edition: WLC
  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אֶת הַ/נֶּ֗גַע וְ/הִנֵּ֤ה מַרְאֵ֨/הוּ֙ עָמֹ֣ק מִן הָ/ע֔וֹר וּ/ב֛/וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְ/טִמֵּ֨א אֹת֤/וֹ הַ/כֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָ/רֹ֛אשׁ א֥וֹ הַ/זָּקָ֖ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: te
  text: యాజకుడు ఆ వ్యాధిగ్రస్తమైన ప్రాంతాన్ని పరిశీలించాలి. ఇదిగో, అది చర్మం కంటే లోతుగా కనిపిస్తూ, దానిలో సన్నని పసుపురంగు వెంట్రుక ఉంటే, యాజకుడు అతణ్ణి అపవిత్రుడని ప్రకటించాలి. అది నెతెక్[a]; అది తలకుగానీ గడ్డానికిగానీ వచ్చే చర్మవ్యాధి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నెతెక్’ అనేది తల లేదా గడ్డం ప్రాంతంలో వచ్చే ఒక ప్రత్యేక వ్యాధికి ఉపయోగించిన హీబ్రూ పదం; దాని ఖచ్చితమైన ఆధునిక వైద్య గుర్తింపు అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం విస్తృతమైన తీవ్రమైన చర్మవ్యాధులను సూచించగలదు; అది తప్పనిసరిగా ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి)నే సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: వ్యాధిగ్రస్తమైన ప్రాంతం
  rationale: లేవీయకాండము 13లో ఇది యాజకుడు పరిశీలించే, కంటికి కనిపించే ప్రభావిత చర్మప్రాంతాన్ని సూచిస్తుంది. ‘తెగులు’ లేదా ‘గాయం’ కంటే ఈ పదబంధం ఆధునిక పాఠకునికి స్పష్టంగా ఉండి, నిర్దిష్ట వైద్య నిర్ధారణను రుద్దదు.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: అది చర్మం కంటే లోతుగా కనిపిస్తూ
  rationale: హీబ్రూ నిర్ధారణాత్మక వర్ణనను సహజమైన తెలుగులో నిలుపుతుంది; వ్యాధి నిజంగా ఎంత లోతులో ఉందో కాక, దాని రూపం అలా కనిపిస్తోందనే భావాన్ని కాపాడుతుంది.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: సన్నని పసుపురంగు వెంట్రుక
  rationale: צָהֹב లోని పసుపు వర్ణాన్ని, דַּק లోని సన్నదనాన్ని రెండింటినీ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְטִמֵּא אֹתוֹ
  choice: అతణ్ణి అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు అపవిత్రతను కలిగిస్తున్నాడని కాక, ఆచారపరమైన స్థితిపై తీర్పు ప్రకటిస్తున్నాడని తెలియజేస్తుంది.
- source_word: נֶתֶק
  choice: నెతెక్
  rationale: ఈ ప్రత్యేక తల/గడ్డం వ్యాధికి ఖచ్చితమైన ఆధునిక వైద్య సమానార్థకం అనిశ్చితం. ఊహాత్మకంగా ‘దురద’ అని నిర్ధారించకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించి, పాదటిప్పణిలో వివరిస్తుంది.
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధి కంటే విస్తృతమైన వ్యాధివర్గాన్ని సూచిస్తుంది; ‘కుష్ఠు’ అనే అతినిర్దిష్టమైన అనువాదాన్ని నివారిస్తుంది.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: తలకుగానీ గడ్డానికిగానీ వచ్చే
  rationale: వ్యాధి ఉన్న స్థలాన్ని సహజమైన ఆధునిక తెలుగులో తెలుపుతూ, ‘తలచర్మం’ అని మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: యాజకుని తీర్పు మరియు అపవిత్రత
  choice: ‘అపవిత్రుడని ప్రకటించాలి’ అని న్యాయనిర్ణయ భావంతో అనువదించడం
  alternative: ‘అపవిత్రుణ్ణి చేయాలి’
  rationale: పూజారిక ధర్మశాస్త్ర సందర్భంలో యాజకుడు వ్యక్తి స్థితిని నిర్ధారించి ప్రకటిస్తాడు; అతడే అపవిత్రతను ఉత్పత్తి చేస్తున్నాడనే భావాన్ని నివారించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాస్త్రపు గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. వైద్యపరంగా అనిశ్చితమైన נֶתֶקను ఊహాత్మక తెలుగు వ్యాధిపేరుతో మార్చకుండా లిప్యంతరీకరించారు. ‘ఇదిగో’ ద్వారా וְהִנֵּהకు ఉన్న గమనార్హతను నిలిపారు.
