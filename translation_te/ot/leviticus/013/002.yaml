id: LEV.13.2
reference: Leviticus 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: te
  text: ఒక వ్యక్తి శరీర చర్మంపై వాపుగానీ, పొక్కుగానీ, ప్రకాశవంతమైన మచ్చగానీ ఏర్పడి, అది అతని శరీర చర్మంపై చర్మవ్యాధి గాయమైతే[a], అతన్ని యాజకుడైన అహరోను వద్దకుగానీ, యాజకులైన అతని కుమారుల్లో ఒకరి వద్దకుగానీ తీసుకురావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సంప్రదాయ అనువాదం: “కుష్ఠరోగపు గాయం.” అయితే ఇక్కడి హీబ్రూ పదమైన צָרָעַת విస్తృతమైన చర్మ రుగ్మతల వర్గాన్ని సూచిస్తుంది; దాన్ని ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం చేయకూడదు.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: ఒక వ్యక్తి
  rationale: ఇది వ్యక్తిని ఉద్దేశించిన సాధారణ ఏకవచన న్యాయపరమైన సందర్భం. తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా, అందరినీ వర్తింపజేసే విధంగా ఉంటుంది.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: శరీర చర్మంపై
  rationale: హీబ్రూ పదబంధంలోని శరీరం-చర్మం అనే నిర్దిష్ట భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; వాక్యంలో దాని పునరుక్తినీ కాపాడుతుంది.
- source_word: שְׂאֵת
  choice: వాపు
  rationale: చర్మంపై పైకి లేచిన భాగాన్ని సూచించే సాధారణ, స్పష్టమైన పదం.
- source_word: סַפַּחַת
  choice: పొక్కు
  rationale: ఖచ్చితమైన చర్మవ్యాధి సూచన అనిశ్చితమైనందున, కనిపించే చర్మపు మచ్చ/పొర స్వభావాన్ని తెలిపే సాధారణ పదం ఎంచుకోబడింది.
- source_word: בַּהֶרֶת
  choice: మెరిసే మచ్చ
  rationale: ప్రకాశవంతమైన లేదా పాలిపోయిన చర్మపు మచ్చ అనే విస్తృత భావాన్ని, నిర్దిష్ట వైద్య నిర్ధారణ చేయకుండా నిలుపుతుంది.
- source_word: לְנֶגַע צָרָעַת
  choice: చర్మవ్యాధి గాయం
  rationale: נֶגַע లోని దెబ్బతిన్న మచ్చ లేదా గాయం భావాన్నీ, צָרָעַת సూచించే విస్తృతమైన చర్మ రుగ్మత వర్గాన్నీ వ్యక్తం చేస్తుంది; ఆధునిక హాన్సెన్ వ్యాధితో స్వయంచాలకంగా సమానం చేయదు.
- source_word: וְהוּבָא
  choice: అతన్ని ... తీసుకురావాలి
  rationale: హీబ్రూ కర్మణి రూపాన్నీ, న్యాయపరమైన విధినీ సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను
  rationale: పేరు మరియు పదవిని స్పష్టంగా, సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: యాజకులైన అతని కుమారుల్లో ఒకరు
  rationale: అహరోను కుమారుల కుటుంబ సంబంధాన్నీ వారి యాజక హోదాన్నీ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: צָרָעַת పదం అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠరోగం
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికన్నా విస్తృతమైన బైబిలు సంబంధిత చర్మ రుగ్మతల వర్గాన్ని సూచిస్తుంది. కాబట్టి ప్రధాన పాఠ్యంలో నిర్దిష్ట ఆధునిక వైద్య నిర్ధారణను రుద్దకుండా ‘చర్మవ్యాధి’ అని ఇచ్చి, సంప్రదాయ అనువాదాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండంలోని న్యాయపరమైన గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని శరీర చర్మం అనే పునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
