translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండంలోని ఆచారపరమైన తనిఖీ సందర్భానికి తగిన గంభీరతను ఉంచుతూ, సాంకేతిక నేతపదాలకు సులభంగా అర్థమయ్యే ‘నిలువు దారాలు’, ‘అడ్డ దారాలు’ ఉపయోగించబడ్డాయి. వాక్యం తరువాతి వచనంలో కొనసాగే షరతు కావడంతో చివర కామా ఉంచబడింది.
