  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: te
  text: అయితే యాజకుడు దానిని పరిశీలించి, ఆ మచ్చ వస్త్రంలోగానీ, నిలువు దారాల్లోగానీ, అడ్డ దారాల్లోగానీ, ఏ తోలు వస్తువులోగానీ వ్యాపించలేదని చూస్తే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... కనిపిస్తే
  rationale: మునుపటి విధానానికి కొనసాగింపుగా వచ్చే షరతును, స్వల్పమైన వ్యత్యాసంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: యాజకుడు దానిని పరిశీలించినప్పుడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘చూచు’ అయినా, ఇక్కడ యాజకుడు అధికారికంగా తనిఖీ చేసే సందర్భం కాబట్టి ‘పరిశీలించు’ సరిపోతుంది.
- source_word: וְהִנֵּה
  choice: '...అని కనిపిస్తే'
  rationale: పరిశీలనలో తేలిన విషయంపై దృష్టి నిలిపే హీబ్రూ సూచకాన్ని తెలుగులో సహజమైన ఫలిత వాక్యనిర్మాణంతో తెలియజేస్తుంది.
- source_word: לֹא פָשָׂה
  choice: వ్యాపించలేదని
  rationale: పునఃపరిశీలన సమయానికి మచ్చ విస్తరించలేదనే ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַנֶּגַע
  choice: ఆ మచ్చ
  rationale: ఈ సందర్భంలో పదార్థంపై కనిపించే ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది; ‘వ్యాధి’ వంటి ఆధునిక వైద్య నిర్ధారణను అనవసరంగా రుద్దకుండా ‘మచ్చ’ సహజంగా ఉంటుంది.
- source_word: בַּבֶּגֶד
  choice: వస్త్రంలో
  rationale: వస్త్ర పదార్థంలో ఉన్న ప్రభావిత భాగాన్ని సహజంగా సూచిస్తుంది.
- source_word: בַשְּׁתִי
  choice: నిలువు దారాల్లో
  rationale: నేతలో పొడవుగా అమర్చే warp దారాలను సామాన్య పాఠకుడికి అర్థమయ్యే తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: בָעֵרֶב
  choice: అడ్డ దారాల్లో
  rationale: నిలువు దారాలకు అడ్డంగా నేసే weft/woof దారాలను సులభమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל כְּלִי עוֹר
  choice: ఏ తోలు వస్తువులోగానీ
  rationale: כְּלִי అనే విస్తృతార్థక పదాన్ని ‘వస్తువు’గా, తయారుచేసిన జంతుచర్మాన్ని ‘తోలు’గా సహజంగా అనువదిస్తుంది.
