id: LEV.13.12
reference: Leviticus 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: te
  text: ఒకవేళ ఆ చర్మవ్యాధి చర్మమంతటా విస్తరించి[a], యాజకునికి కనిపించినంతవరకు బాధితుని తల నుండి పాదాల వరకు ఉన్న చర్మమంతటినీ కప్పివేస్తే[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ צָרַעַת (త్సారా‘అత్) లేవీయకాండంలో ఆచారపరంగా పరిగణించిన అనేక రకాల చర్మబాధలను సూచిస్తుంది. దీనిని ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి)తో మాత్రమే సమానం చేయకూడదు.
    reason: cultural_note
  - marker: b
    text: మరింత అక్షరార్థంగా, “వ్యాధి/గాయం యొక్క చర్మమంతటినీ.” ఈ హీబ్రూ పదబంధం సందర్భంలో వ్యాధి వ్యాప్తికి గురైన వ్యక్తి చర్మాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: విస్తారంగా వ్యాపించి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం వ్యాప్తి తీవ్రతను నొక్కిచెబుతుంది. ‘విస్తారంగా వ్యాపించి’ అనే రూపం సహజమైన తెలుగులో ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: הַצָּרַעַת
  choice: ఆ చర్మవ్యాధి
  rationale: צָרַעַת ఆధునిక హాన్సెన్ వ్యాధికి మాత్రమే పరిమితం కాని ఆచారపరమైన చర్మబాధల శ్రేణిని సూచిస్తుంది; అందువల్ల ‘చర్మవ్యాధి’ స్పష్టమైనదీ వైద్యపరంగా అతిసంకుచితం కానిదీ.
- source_word: בָּעוֹר
  choice: చర్మమంతటా
  rationale: ఇక్కడ ב శరీరపు చర్మంపై వ్యాధి వ్యాపించే పరిధిని సూచిస్తుంది. తీవ్రతను తెలిపే పునరుక్త క్రియతో కలిసి ‘చర్మమంతటా’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וְכִסְּתָה
  choice: కప్పివేస్తే
  rationale: షరతుతో కూడిన వాక్యక్రమంలో ఈ క్రియను తెలుగులో ‘కప్పివేస్తే’గా అనుసంధానించడం సహజం; అది వ్యాధి వ్యాప్తి పరిధిని నిలుపుతుంది.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: చర్మమంతటినీ
  rationale: అక్షరార్థంగా ‘బాధ/పుండు యొక్క చర్మమంతా.’ సందర్భంలో బాధితుని చర్మాన్ని సూచిస్తుంది; తెలుగులో అసహజమైన ‘పుండు యొక్క చర్మం’ను తప్పించి, బాధితుని ప్రస్తావనతో అర్థాన్ని స్పష్టం చేశాం.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: తల మొదలుకొని పాదాల వరకు
  rationale: ఇది శరీరమంతటి పరిధిని తెలిపే మెరిస్మ్. తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేలా, మూలంలోని సంపూర్ణతను నిలిపే రూపం.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: యాజకుని కంటికి కనిపించినంతవరకు
  rationale: అక్షరార్థంలోని ‘యాజకుని కళ్ల చూపు మేరకు’ అనే భావాన్ని, పరిశీలనలో అతనికి కనిపించే పూర్తి పరిధిగా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
