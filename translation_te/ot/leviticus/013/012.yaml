  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. వచనం తరువాతి వాక్యంతో కొనసాగుతున్న షరతు వాక్యం కావడంతో చివర కామాను నిలిపాం. ప్రధాన పాఠ్యంలో [a], [b] సూచికలు రెండూ చేర్చాం.
