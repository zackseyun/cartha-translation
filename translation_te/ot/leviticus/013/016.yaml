revisions:
- from: లేదా పచ్చి మాంసం మళ్లీ మారి తెల్లబడితే[a], అతడు యాజకుని దగ్గరకు రావాలి.
  to: లేదా పచ్చి మాంసం మళ్లీ తెల్లగా మారితే[a], అతడు యాజకుని వద్దకు రావాలి.
  rationale: The revision makes the reversal to a white condition explicit and idiomatic in Telugu, while retaining the contextual term “పచ్చి మాంసం,” the conditional alternative, and the procedural requirement to come to the priest. The footnote continues to preserve the literal Hebrew expression.
