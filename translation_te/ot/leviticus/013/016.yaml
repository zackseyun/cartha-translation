  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: te
  text: లేదా పచ్చి మాంసం మళ్లీ తెల్లగా మారితే[a], అతడు యాజకుని వద్దకు రావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సజీవ మాంసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: లేదా … అయితే
  rationale: אוֹ ప్రత్యామ్నాయ పరిస్థితిని సూచిస్తుంది; దాని తరువాతి כִּי షరతును ప్రవేశపెడుతుంది. తెలుగులో విడదీసిన ‘లేదా … అయితే’ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: יָשׁ֛וּב
  choice: మళ్లీ మారి
  rationale: שוב మునుపటి స్థితికి తిరగడాన్ని సూచిస్తుంది. తరువాతి וְנֶהְפַּךְతో కలిపి, పరిస్థితి తిరిగి మారడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַבָּשָׂר הַחַי
  choice: పచ్చి మాంసం
  rationale: అక్షరార్థంగా ‘సజీవ మాంసం’; ఈ వ్యాధి నిర్ధారణ సందర్భంలో బయటికి కనిపించే పచ్చి మాంసకణజాలాన్ని సూచిస్తుంది. ‘పచ్చి మాంసం’ సాధారణ పాఠకులకు సహజంగా, సందర్భోచితంగా ఉంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: మారి తెల్లబడితే
  rationale: Niphal రూపం స్థితిలో వచ్చిన మార్పును సూచిస్తుంది. ‘తెల్లబడితే’ రంగు మార్పును స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: అతడు యాజకుని దగ్గరకు రావాలి
  rationale: చట్టపరమైన నిర్ధారణ క్రమంలో తదుపరి చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘యాజకుని దగ్గరకు’ అనే రూపం אֶל యొక్క దిశార్థాన్ని నిలుపుతుంది.
