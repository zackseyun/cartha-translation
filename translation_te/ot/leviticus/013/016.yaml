translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యాజక నియమావళికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. వైద్యసందర్భంలో అర్థమయ్యేలా ‘పచ్చి మాంసం’ వాడి, హీబ్రూ పదబంధపు అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
