  text: And the priest shall examine the diseased area[b][a], and he shall isolate the diseased area for seven days.
translation:
  language: te
  text: యాజకుడు ఆ ప్రభావిత భాగాన్ని[a] పరిశీలించి, దానిని ఏడు రోజులపాటు వేరుగా ఉంచాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మచ్చ,’ ‘ప్రభావిత ప్రాంతం,’ లేదా సాంప్రదాయికంగా ‘తెగులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం యాజకుడు పరిశీలించే గుర్తు లేదా ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది; అది తప్పనిసరిగా నిర్దిష్టమైన ఆధునిక వ్యాధి వర్గాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మూసి ఉంచాలి.’ ఇక్కడ భావం, మరింత పరిశీలన కోసం దానిని తాత్కాలికంగా వేరుగా ఉంచడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించి
  rationale: רָאָה అనే క్రియకు ప్రాథమికంగా ‘చూచుట’ అనే అర్థం ఉన్నా, ఇక్కడ యాజకుడు అధికారికంగా పరీక్షించే సందర్భం కాబట్టి ‘పరిశీలించి’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని כֹּהֵן‌కు ఆధునిక ప్రామాణిక తెలుగు రూపం; నిర్దిష్టతను సందర్భం మరియు ‘ఆ’ సూచనలతో వాక్యం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: ఆ ప్రభావిత భాగం / అది ఉన్న వస్తువు
  rationale: נֶגַע ఇక్కడ ఆధునిక వైద్యపరమైన నిర్దిష్ట వ్యాధి పేరుకాక, పరీక్షించబడుతున్న మచ్చ లేదా ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది. రెండో ప్రయోగంలో ఆ ప్రభావిత భాగం ఉన్న వస్తువును వేరుగా ఉంచడం సందర్భానుసారమైన భావం; తెలుగులో అసహజంగా ‘భాగాన్ని నిర్బంధించడం’ అని కాకుండా ఈ లక్ష్యాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: וְהִסְגִּיר
  choice: వేరుగా ఉంచాలి
  rationale: సגר యొక్క హిఫీల్ రూపం ఇక్కడ పరిశీలన నిమిత్తం మూసి ఉంచడం లేదా వేరుచేయడం అనే భావాన్ని ఇస్తుంది. ‘వేరుగా ఉంచాలి’ అనేది ‘నిర్బంధించాలి’ లేదా ఆధునిక వైద్యార్థం బలంగా ఉన్న ‘క్వారంటైన్ చేయాలి’ కంటే సహజంగా, విస్తృతంగా సరిపోతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేసే రూపం.
