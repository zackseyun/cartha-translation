translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హెబ్రీయ భాషలో రెండోసారి కూడా ‘ప్రభావిత భాగం’ అనే పదమే ఉన్నా, సందర్భంలో వస్త్రమో ఇతర వస్తువో వేరుగా ఉంచబడుతుంది; అందువల్ల భావాన్ని సహజ తెలుగులో ‘అది ఉన్న వస్తువు’ అని వ్యక్తం చేసి, మూలపదంలోని విస్తృతిని పాదటిప్పణిలో నిలిపాం.
