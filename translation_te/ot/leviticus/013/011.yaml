id: LEV.13.11
reference: Leviticus 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: te
  text: అది అతని శరీరపు చర్మంలో దీర్ఘకాలంగా ఉన్న చర్మవ్యాధి[a]. యాజకుడు అతన్ని అపవిత్రుడని ప్రకటించాలి. అతడు అపవిత్రుడే కాబట్టి, యాజకుడు అతన్ని వేరుగా ఉంచకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలాకాలంగా ఉన్న చర్మవ్యాధి.” సంప్రదాయ అనువాదాలు צָרַעַת అనే పదాన్ని తరచుగా “కుష్ఠు” అని అనువదిస్తాయి. అయితే లేవీయకాండంలో ఈ హెబ్రీ పదం ఆధునిక కుష్ఠువ్యాధి కంటే విస్తృతమైన చర్మ సమస్యలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: లేవీయకాండంలో ఈ హెబ్రీ పదం ఆధునిక హాన్సెన్ వ్యాధిని మాత్రమే కాక విస్తృతమైన చర్మ సమస్యలను సూచిస్తుంది. కాబట్టి సంప్రదాయ ‘కుష్ఠు’ కంటే ‘చర్మవ్యాధి’ మూలార్థ పరిధిని మెరుగుగా కాపాడుతుంది.
- source_word: נוֹשֶׁנֶת
  choice: దీర్ఘకాలంగా ఉన్న
  rationale: ఈ రూపం పాతది లేదా చాలాకాలంగా కొనసాగుతున్నది అనే భావాన్ని ఇస్తుంది. ‘దీర్ఘకాలంగా ఉన్న’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, వైద్యపరంగా అతినిర్దిష్టం కాకుండా స్థిరపడిన పరిస్థితిని తెలియజేస్తుంది.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: అతని శరీరపు చర్మంలో
  rationale: ‘అతని మాంసపు చర్మంలో’ అనే అక్షరార్థ రూపం కంటే ఇది ఆధునిక తెలుగులో సహజం; శరీరంలోని చర్మమే ఉద్దేశమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטִמְּאוֹ
  choice: అతన్ని అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు ఆ వ్యక్తిని అపవిత్రునిగా చేయడం కాదు; అతని ఆచారపరమైన స్థితిని అధికారికంగా నిర్ధారించి ప్రకటిస్తున్నాడు. అందువల్ల ‘ప్రకటించాలి’ సముచితం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: ఆరాధనా సంబంధమైన ఈ పదవికి ప్రామాణికమైన, నేరుగా అర్థమయ్యే తెలుగు పదం.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: అతన్ని వేరుగా ఉంచకూడదు
  rationale: పరిశీలన కోసం వ్యక్తిని విడిగా నిర్బంధించడాన్ని ఈ క్రియ సూచిస్తుంది. ‘వేరుగా ఉంచడం’ సహజమైన తెలుగు; ‘దిగ్బంధం’ లేదా ‘క్వారంటైన్’ కంటే అనవసరమైన ఆధునిక వైద్య ఛాయను నివారిస్తుంది.
- source_word: כִּי טָמֵא הוּא
  choice: అతడు అపవిత్రుడే కాబట్టి
  rationale: అతని స్థితి ఇప్పటికే స్పష్టంగా నిర్ధారించబడినందున ఇక పరిశీలనార్థం వేరుగా ఉంచనవసరం లేదని తెలిపే కారణవాక్యం. ‘-ఏ’ నిర్ధారణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రత పదజాలం
  choice: అపవిత్రుడు
  alternative: అశుద్ధుడు
  rationale: טמא ఇక్కడ నైతిక దోషాన్ని కాక ఆచార-న్యాయ సంబంధమైన స్థితిని సూచిస్తుంది. ‘అపవిత్రుడు’ స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, సందర్భంలో ఆచారపరమైన స్థితిగా అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని ఆచార-న్యాయ భావాన్ని నిలుపుతూ, ఆధునిక వైద్య నిర్ధారణను అనవసరంగా ఆపాదించలేదు.
