  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: te
  text: అయితే, తల వెనుక భాగంలోని బట్టతల మీదగానీ, తల ముందుభాగంలోని బట్టతల మీదగానీ[b] తెలుపు-ఎరుపు రంగులో ఉన్న వ్యాధి మచ్చ కనిపిస్తే, అది అతని తల వెనుక భాగంలోని బట్టతల మీదగానీ, తల ముందుభాగంలోని బట్టతల మీదగానీ వ్యాపిస్తున్న చర్మవ్యాధి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయ అనువాదంలో, ‘కుష్ఠరోగం.’ ఇక్కడి హీబ్రూ పదం అనేక రకాల చర్మవ్యాధులు లేదా చర్మస్థితులను విస్తృతంగా సూచిస్తుంది; దాన్ని ఆధునిక హాన్సెన్స్ వ్యాధితో మాత్రమే సమానంగా చూడకూడదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి రెండు హీబ్రూ పదాలు తల వెనుక భాగంలోని బట్టతలను, తల ముందుభాగంలోని బట్టతలను వేరు చేస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: అయితే … ఉంటే
  rationale: న్యాయవిధిలో ముందున్న విషయానికి భిన్నమైన షరతును పరిచయం చేస్తుంది; తెలుగు షరతు నిర్మాణంలో ‘అయితే … ఉంటే’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: יִהְיֶה
  choice: కనిపిస్తే
  rationale: అక్షరార్థంగా అస్తిత్వాన్ని సూచించినా, పరిశీలనకు లోనయ్యే మచ్చ సందర్భంలో ‘కనిపిస్తే’ సహజమైన తెలుగు; కొత్తగా పుట్టిందనే భావాన్ని తప్పనిసరిగా మోపదు.
- source_word: בַקָּרַחַת
  choice: తల వెనుక భాగంలోని బట్టతల మీద
  rationale: కָרַחַת మరియు గַּבַּחַת మధ్య ఉన్న వెనుక/ముందు బట్టతల భేదాన్ని స్పష్టంగా, సాధారణ పాఠకుడికి అర్థమయ్యేలా చూపుతుంది.
- source_word: בַגַּבַּחַת
  choice: నుదుటి వైపు బట్టతల మీద
  rationale: ముందుభాగపు బట్టతలను జతపదమైన కָרַחַת నుంచి వేరు చేస్తూ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נֶגַע
  choice: వ్యాధి మచ్చ
  rationale: లేవీయకాండము 13లో యాజకుడు పరిశీలించే కనిపించే అసాధారణ మచ్చను సూచిస్తుంది; ఆధునిక వైద్యపరమైన ఖచ్చిత నిర్ధారణను అనవసరంగా చేర్చదు.
- source_word: לָבָן אֲדַמְדָּם
  choice: తెలుపు-ఎరుపు రంగులో ఉన్న
  rationale: హీబ్రూ రంగు విశేషణాల క్రమాన్ని, మిశ్రమ ఛాయ విషయంలోని కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్స్ వ్యాధికే పరిమితం కాదు; విస్తృతమైన చర్మస్థితుల ఆచారపరమైన వర్గాన్ని సూచించగలదు.
- source_word: פֹּרַחַת
  choice: వ్యాపిస్తున్న
  rationale: פרח ధాతువు ఇక్కడ చర్మస్థితి విస్తరించడం లేదా ఉబికి రావడం అనే భావాన్ని ఇస్తుంది; ‘వ్యాపిస్తున్న’ తెలుగు పాఠకుడికి స్పష్టంగా, వైద్యపరంగా తటస్థంగా ఉంటుంది.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: అతని తల వెనుక భాగంలోని బట్టతల మీదగానీ, నుదుటి వైపు బట్టతల మీదగానీ
  rationale: స్వామ్య ప్రత్యయాన్ని ‘అతని’తో నిలుపుతూ, మొదటి భాగంలోని రెండు రకాల బట్టతల భేదాన్ని పునరావృతం చేస్తుంది.
theological_decisions:
- issue: צָרַעַת అనే ఆచారపరమైన నిర్ధారణను ఆధునిక హాన్సెన్స్ వ్యాధితో సమానపరచాలా?
  choice: ప్రధాన పాఠ్యంలో ‘చర్మవ్యాధి’ అని అనువదించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం
  alternative: ‘కుష్ఠరోగం’ అని మాత్రమే అనువదించడం
  rationale: మూలపదం పరిధి ఆధునిక కుష్ఠు/హాన్సెన్స్ వ్యాధికంటే విస్తృతమైనది. తటస్థ పదం మూలంలోని ఆచారపరమైన వర్గీకరణను ఆధునిక వైద్య నిర్ధారణగా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరతతోనూ సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలంతోనూ రూపొందించబడింది. ‘తెలుపు-ఎరుపు’ మూలంలోని రంగు క్రమం మరియు ఛాయాస్పష్టతను నిలుపుతుంది; ‘చర్మవ్యాధి’ ఆధునిక వైద్య నిర్ధారణను అనవసరంగా మోపదు.
