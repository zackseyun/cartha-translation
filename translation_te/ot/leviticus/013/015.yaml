  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: te
  text: యాజకుడు సజీవ మాంసాన్ని[a] చూసినప్పుడు, ఆ వ్యక్తిని అపవిత్రునిగా ప్రకటించాలి[b]. ఆ సజీవ మాంసం అపవిత్రమైనది; అది చర్మవ్యాధి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సజీవ మాంసం’; సందర్భంలో ఇది సజీవ కణజాలాన్ని సూచిస్తుంది. సంప్రదాయంగా ‘పచ్చి మాంసం’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ వ్యక్తి అపవిత్రుడని తీర్పు ఇవ్వాలి.’ యాజకుడు ఇక్కడ శుద్ధి–అశుద్ధికి సంబంధించిన అధికారిక నిర్ణయం ప్రకటిస్తున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: సంప్రదాయంగా ‘కుష్ఠురోగం.’ అయితే హీబ్రూ పదం ఆధునిక కుష్ఠురోగాన్ని మాత్రమే కాక, మరింత విస్తృతమైన చర్మవ్యాధిని లేదా చర్మస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: యాజకుడు … చూసినప్పుడు
  rationale: న్యాయవిధుల వరుసలోని waw + qatal రూపాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; కార్యనిర్వాహక పరిశీలకుడు యాజకుడేనని స్పష్టంగా ఉంచుతుంది.
- source_word: הַבָּשָׂר הַחַי
  choice: పచ్చి మాంసం
  rationale: అక్షరార్థంగా ‘సజీవ మాంసం.’ ఈ చర్మపరిశీలన సందర్భంలో బయటపడిన సజీవ కణజాలాన్ని సూచించే సంప్రదాయబద్ధమైన, సంక్షిప్త తెలుగు పదబంధంగా ‘పచ్చి మాంసం’ ఎంచుకోబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְטִמְּאוֹ
  choice: ఆ వ్యక్తిని అపవిత్రునిగా ప్రకటించాలి
  rationale: పియేల్ రూపం ఇక్కడ యాజకుడు అపవిత్రతను కలిగించడం కంటే అధికారికంగా అపవిత్రుడని నిర్ణయించి ప్రకటించడాన్ని సూచిస్తుంది. ‘ఆ వ్యక్తిని’ అనడం హీబ్రూ పురుష ఏకవచన కర్మను సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: טָמֵא הוּא
  choice: అపవిత్రమైనది
  rationale: లేవీయకాండంలోని ఆచారపరమైన శుద్ధి–అశుద్ధి వర్గాన్ని నిలుపుతూ, ‘మలినమైనది’ వంటి సాధారణ నైతిక లేదా భౌతిక భావాన్ని నివారిస్తుంది.
- source_word: צָרַעַת
  choice: చర్మవ్యాధి
  rationale: ఈ హీబ్రూ పదం ఆధునిక హాన్సెన్స్ వ్యాధికి మాత్రమే పరిమితం కాదు. సందర్భంలోని విస్తృత చర్మస్థితిని సూచించడానికి ‘చర్మవ్యాధి’ ఉపయోగించబడింది.
theological_decisions:
- issue: లేవీయకాండపు శుద్ధి నియమాల్లో צָרַעַת పదానికి అనువాదం
  choice: చర్మవ్యాధి
  alternative: కుష్ఠురోగం
  rationale: ఆధునిక వైద్య నిర్ధారణను ప్రాచీన ఆచారపరమైన వర్గంపై రుద్దకుండా, మూలపదంలోని విస్తృత పరిధిని కాపాడుతుంది.
- issue: וְטִמְּאוֹ లో యాజకుని పాత్ర
  choice: అపవిత్రునిగా ప్రకటించాలి
  alternative: అపవిత్రుణ్ణి చేయాలి
  rationale: యాజకుడు ఆ స్థితిని కలిగిస్తున్నాడని కాక, అధికారిక శుద్ధి తీర్పు ఇస్తున్నాడని సందర్భం సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన న్యాయవిధి శైలి ఉపయోగించబడింది. ‘అపవిత్రం’ అనే పదం ఆచారపరమైన వర్గాన్ని నిలుపుతుంది; ‘పచ్చి మాంసం’ వల్ల కలగగల అర్థసందిగ్ధతను పాదసూచిక వివరిస్తుంది.
