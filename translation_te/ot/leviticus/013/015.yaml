  source_fidelity: 'The procedural force is preserved well: the priest observes the flesh and formally declares the person unclean. However, “పచ్చి మాంసం” normally means uncooked/raw meat in modern Telugu and can misrepresent the Hebrew בָּשָׂר חַי, which denotes living flesh/tissue in this inspection context. “సజీవ మాంసం” is closer to the source and avoids that misleading culinary sense.'
  naturalness: The sentence structure and legal register are natural modern Telugu. Replacing “పచ్చి మాంసం” with “సజీవ మాంసం” makes the wording clearer in this context. “అపవిత్రునిగా ప్రకటించాలి” appropriately expresses a priestly purity ruling.
  terminology: “అపవిత్రుడు/అపవిత్రమైనది” consistently retains the ritual-purity category. “చర్మవ్యాధి” is a suitable non-anachronistic rendering of צָרַעַת. The phrase “సజీవ మాంసం” should be retained consistently in both occurrences and its note should explain the contextual sense.
