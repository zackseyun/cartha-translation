- from: యాజకుడు పచ్చి మాంసాన్ని[a] చూసినప్పుడు, ఆ వ్యక్తిని అపవిత్రునిగా ప్రకటించాలి[b]. ఆ పచ్చి మాంసం అపవిత్రమైనది; అది చర్మవ్యాధి[c].
  to: యాజకుడు సజీవ మాంసాన్ని[a] చూసినప్పుడు, ఆ వ్యక్తిని అపవిత్రునిగా ప్రకటించాలి[b]. ఆ సజీవ మాంసం అపవిత్రమైనది; అది చర్మవ్యాధి[c].
