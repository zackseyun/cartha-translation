source:
  edition: WLC
  text: אִישׁ צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛/נּוּ הַ/כֹּהֵ֖ן בְּ/רֹאשׁ֥/וֹ נִגְעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: te
  text: అతడు చర్మవ్యాధి ఉన్న మనిషి[a]; అతడు అపవిత్రుడు. యాజకుడు అతణ్ణి తప్పకుండా అపవిత్రుడని ప్రకటించాలి; అతని వ్యాధి అతని తలమీద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “కుష్ఠురోగి.” ఇక్కడి హీబ్రూ పదం ఈ అధ్యాయంలో పరిశీలించే చర్మవ్యాధిని సూచిస్తుంది; అది ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి)తో తప్పనిసరిగా సమానం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: మనిషి
  rationale: ఏకవచన పుంలింగ నామవాచకం; ఈ ధర్మశాస్త్ర సందర్భంలో పరిశీలించబడుతున్న పురుషుణ్ణి సూచిస్తుంది.
- source_word: צָרוּעַ
  choice: చర్మవ్యాధిగల
  rationale: ఈ అధ్యాయంలో పరిశీలించే చర్మసంబంధమైన స్థితిని సూచిస్తుంది; ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం కానందున నిర్దిష్ట వైద్యనామాన్ని నివారిస్తుంది.
- source_word: טָמֵא הוּא
  choice: అతడు అపవిత్రుడు
  rationale: లేవీయకాండంలోని ఆచారపరమైన అపవిత్ర స్థితిని తెలిపే సహజమైన, స్థిరమైన పదప్రయోగం.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: అతణ్ణి తప్పకుండా అపవిత్రుడని ప్రకటించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది; యాజకుడు అపవిత్రతను కలిగించడం కాక అధికారికంగా ఆ స్థితిని ప్రకటిస్తాడు.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: పరిశీలించి ఆచారపరమైన స్థితిని ప్రకటించే ఆరాధనా అధికారికి ప్రామాణిక తెలుగు పదం.
- source_word: בְּרֹאשׁוֹ
  choice: అతని తలమీద
  rationale: హెబ్రీ వాక్యం వ్యాధి ఉన్న స్థానాన్ని సరళంగా ‘అతని తలపై’ అని సూచిస్తుంది; సందర్భం తలచర్మానికి సంబంధించినదైనా మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది.
- source_word: נִגְעוֹ
  choice: అతని వ్యాధి
  rationale: లేవీయకాండం 13లో నిర్ధారించబడిన బాధిత స్థితి లేదా గాయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యాధి’ సహజంగా అర్థమవుతుంది.
