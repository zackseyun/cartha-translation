  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: te
  text: యాజకుడు అతణ్ణి పరిశీలించి, ఆ పొలుసుల దద్దురు చర్మం మీద వ్యాపించి ఉంటే, అతణ్ణి అపవిత్రుడని ప్రకటించాలి; అది సారాత్ అనే చర్మవ్యాధి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘సారాత్’. దీన్ని సంప్రదాయంగా ‘కుష్ఠువ్యాధి’ అని అనువదించారు. అయితే లేవీయకాండంలో ఈ పదం ఆధునిక కుష్ఠు వ్యాధి ఒక్కదానిని మాత్రమే కాకుండా, మరింత విస్తృతమైన తీవ్రమైన చర్మస్థితులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: పరిశీలించాలి
  rationale: యాజక సంబంధమైన నిర్ధారణ సందర్భంలో ఈ క్రియ కేవలం చూడడాన్ని కాకుండా అధికారికంగా పరీక్షించి అంచనా వేయడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: లేవీయకాండంలోని ఆచార శుద్ధి నియమాల సందర్భంలో כהןకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: וְהִנֵּה
  choice: పరిశీలించినప్పుడు … ఉన్నట్లు కనిపిస్తే
  rationale: మూలంలోని దృష్టిని ఆకర్షించే పరిశీలనా సూత్రాన్ని తెలుగులో సహజమైన షరతు వాక్యంగా వ్యక్తం చేస్తుంది; ఫలితం పరీక్షలో ప్రత్యక్షమవుతుందనే భావాన్ని నిలుపుతుంది.
- source_word: פָּשְׂתָה
  choice: వ్యాపించి ఉంటే
  rationale: ఈ అధ్యాయంలోని ముఖ్యమైన నిర్ధారణ ప్రమాణమైన చర్మస్థితి విస్తరించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּסְפַּחַת
  choice: పొలుసుల దద్దురు
  rationale: పైపొరలో కనిపించే చర్మ విస్ఫోటం లేదా పొలుసులతో కూడిన దద్దురును సూచిస్తుంది; ‘పుండుపక్కు’ వంటి అతిసంకుచిత పదాన్ని నివారిస్తుంది.
- source_word: בָּעוֹר
  choice: చర్మం మీద
  rationale: చర్మస్థితి కనిపించే ప్రదేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְטִמְּאוֹ
  choice: అతణ్ణి అపవిత్రుడని ప్రకటించాలి
  rationale: యాజకుడు ఆ వ్యక్తిని అపవిత్రునిగా చేయడం కాకుండా, అతని ఆచారపరమైన స్థితిని అధికారికంగా ప్రకటిస్తున్నాడనే న్యాయనిర్ణయ భావాన్ని కాపాడుతుంది.
- source_word: צָרַעַת
  choice: సారాత్ అనే చర్మవ్యాధి
  rationale: హెబ్రీ సాంకేతిక పదాన్ని లిప్యంతరీకరించి, పాఠకునికి వెంటనే అర్థమయ్యే వర్గవివరణను జతచేస్తుంది; దీనిని ఆధునిక హాన్సెన్స్ వ్యాధితో మాత్రమే సమానపరచే అపార్థాన్ని నివారిస్తుంది.
- source_word: הִוא
  choice: అది
  rationale: ముందు పేర్కొన్న చర్మస్థితిని తిరిగి సూచించే స్త్రీలింగ ఏకవచన సర్వనామానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: లేవీయకాండంలోని צָרַעַת పదాన్ని ఎలా అనువదించాలి
  choice: సారాత్ అనే చర్మవ్యాధి
  alternative: కుష్ఠువ్యాధి
  rationale: లేవీయకాండంలో צָרַעַת ఆధునిక కుష్ఠు లేదా హాన్సెన్స్ వ్యాధి ఒక్కదానికే పరిమితం కాకుండా విస్తృతమైన చర్మస్థితుల వర్గాన్ని సూచించవచ్చు. లిప్యంతరీకరణతో పాటు సాధారణ వివరణ ఇవ్వడం మూలంలోని ప్రత్యేక వర్గాన్ని, దాని వైద్యపరమైన అనిశ్చితిని రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయ-ఆచార శైలిని ఉపయోగించాం. ‘పరిశీలించాలి’, ‘ప్రకటించాలి’ అనే పదాలు యాజకుని అధికారిక నిర్ధారణ పాత్రను స్పష్టపరుస్తాయి; మూలంలోని వైద్యపరమైన అస్పష్టతను ‘సారాత్’ అనే పదం మరియు పాదసూచిక ద్వారా నిలిపాం.
