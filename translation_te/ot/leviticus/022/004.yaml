    rationale: ‘మృతదేహం వల్ల అపవిత్రమైన దేనినైనా’ అర్థమయ్యేది అయినా, ‘మృతదేహ సంబంధ అపవిత్రత కలిగిన దేనినైనా’ అనే రూపం మూలంలోని నుడికార భావాన్ని మరింత నేరుగా తెలియజేస్తుంది; ప్రత్యామ్నాయ వ్యక్తి-సంబంధ అర్థాన్ని పాదసూచికలో ఉంచవచ్చు.
  revised_text: అహరోను సంతానంలో ఎవడైనా ఆచారపరంగా అపవిత్రం చేసే చర్మవ్యాధి[a] గలవాడైనా, స్రావం గలవాడైనా, తాను శుద్ధుడయ్యే వరకు పవిత్రమైన వాటిని తినకూడదు. మృతదేహ సంబంధ అపవిత్రత కలిగిన దేనినైనా తాకినవాడు[b], లేదా ఎవరిలోనుండి వీర్యస్ఖలనం వెలువడుతుందో ఆ మనిషి,
