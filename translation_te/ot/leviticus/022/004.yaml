  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: te
  text: అహరోను సంతానంలో ఎవడైనా ఆచారపరంగా అపవిత్రం చేసే చర్మవ్యాధి[a] గలవాడైనా, స్రావం గలవాడైనా, తాను శుద్ధుడయ్యే వరకు పవిత్రమైన వాటిని తినకూడదు. మృతదేహ సంబంధ అపవిత్రత కలిగిన దేనినైనా తాకినవాడు[b], లేదా ఎవరిలోనుండి వీర్యస్ఖలనం వెలువడుతుందో ఆ మనిషి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, ‘కుష్ఠరోగి.’ హీబ్రూ పదం ఆచారపరంగా అపవిత్రం చేసే విభిన్న చర్మస్థితులను సూచిస్తుంది; అది తప్పనిసరిగా ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి) మాత్రమే కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మృతదేహం వల్ల అపవిత్రుడైన ఏ వ్యక్తినైనా తాకినవాడు.’ హీబ్రూ పదబంధం మృతదేహ సంబంధ అపవిత్రతను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: ఎవడైనా
  rationale: పునరుక్తమైన ఈబ్ర Hebrew పదబంధం ప్రతి వ్యక్తికీ వర్తించే పంపిణీ భావాన్ని ఇస్తుంది. సందర్భం అహరోను వంశంలోని పురుష యాజకుల గురించి కావడంతో పుంలింగ రూపాన్ని నిలిపాం.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: అహరోను సంతానంలో
  rationale: זֶרַע ఇక్కడ అక్షరార్థమైన ‘విత్తనం’ కాక వంశపారంపర్య సంతానాన్ని సూచిస్తుంది.
- source_word: צָרוּעַ
  choice: చర్మాన్ని అపవిత్రం చేసే వ్యాధి గలవాడు
  rationale: ఈ పదం ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం కాదు; ఆచారపరమైన అపవిత్రత కలిగించే విస్తృత చర్మస్థితిని సూచిస్తుంది. అనువాదం వైద్యపరమైన అతినిర్దిష్టతను నివారిస్తూ ఆచార సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: זָב
  choice: స్రావం గలవాడు
  rationale: ఆచారపరమైన అపవిత్రత కలిగించే శరీరస్రావం ఉన్న వ్యక్తిని సూచించే సంక్షిప్తమైన, మర్యాదపూర్వక ఆధునిక రూపం.
- source_word: בַּקֳּדָשִׁים
  choice: ప్రతిష్ఠితమైన వాటిని
  rationale: యాజకులు తినగలిగే దేవునికి ప్రతిష్ఠించిన అర్పణ భాగాలను సూచిస్తుంది. ‘వాటిని’ అనే కర్మరూపం తినడం అనే క్రియతో సహజంగా సరిపోతుంది.
- source_word: לֹא יֹאכַל
  choice: తినకూడదు
  rationale: ధర్మశాస్త్రంలోని నిషేధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: తాను శుద్ధుడయ్యే వరకు
  rationale: ఆచారపరంగా అపవిత్ర స్థితి నుంచి శుద్ధ స్థితికి మారడాన్ని సూచిస్తుంది; కేవలం వైద్యపరంగా స్వస్థపడటం అనే భావాన్ని మోపదు.
- source_word: וְהַנֹּגֵעַ
  choice: అలాగే … తాకినవాడు
  rationale: మరొక అనర్హత పరిస్థితిని పరిచయం చేసే substantival participleను తెలుగు ధర్మశాస్త్ర శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: మృతదేహం వల్ల అపవిత్రమైన దేనినైనా
  rationale: మానవ మరణంతో సంబంధం వల్ల కలిగే అపవిత్రతను సూచించే క్లిష్టమైన ఈబ్ర Hebrew నుడికారాన్ని ప్రధాన పాఠంలో వస్తు-సంబంధ భావంతో ఉంచి, వ్యక్తి-సంబంధ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: שִׁכְבַת זָרַע
  choice: వీర్యస్ఖలనం
  rationale: వీర్యం వెలువడటాన్ని స్పష్టంగా, సంక్షిప్తంగా, మర్యాదపూర్వకంగా తెలిపే ఆధునిక తెలుగు పదం.
- source_word: תֵּצֵא מִמֶּנּוּ
  choice: జరిగినవాడు
  rationale: తెలుగులో ‘వీర్యస్ఖలనం జరిగినవాడు’ అనేది మూలంలోని ‘అతని నుంచి వెలువడుట’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రతను ఆధునిక వైద్య నిర్ధారణగా చూపకుండా అనువదించడం
  choice: ‘చర్మాన్ని అపవిత్రం చేసే వ్యాధి’ మరియు ‘శుద్ధుడయ్యే వరకు’
  alternative: ‘కుష్ఠరోగి’ మరియు ‘స్వస్థపడే వరకు’
  rationale: ఈ వాక్యం పాపనైతిక తీర్పు లేదా నిర్దిష్ట ఆధునిక వ్యాధి గురించి కాక యాజకుని ఆచారపరమైన అర్హత గురించి చెబుతుంది. ఎంచుకున్న రూపం ఆ పరిధిని కాపాడుతుంది.
- issue: ధర్మశాస్త్రంలోని లింగనిర్దిష్ట కర్త
  choice: ‘అహరోను సంతానంలో ఎవడైనా’ అని పుంలింగ సూచనను నిలపడం
  alternative: ‘ఎవరైనా వ్యక్తి’
  rationale: ఈబ్ర Hebrew రూపం పుంలింగంలో ఉంది; సందర్భం అహరోను వంశంలోని పురుష యాజకులను సూచిస్తుంది. లింగతటస్థ రూపం ఆ సందర్భాన్ని మసకబార్చవచ్చు.
- issue: טְמֵא נֶפֶשׁ అనే క్లిష్ట నుడికారంలోని అస్పష్టత
  choice: ప్రధాన పాఠంలో ‘మృతదేహం వల్ల అపవిత్రమైన దేనినైనా’
  alternative: ‘మృతదేహం వల్ల అపవిత్రుడైన వ్యక్తిని’
  rationale: వ్యాకరణపరంగా వస్తువు లేదా వ్యక్తి సంబంధ భావాలకు అవకాశం ఉంది. ఒకదాన్ని ప్రధాన పాఠంలో సహజంగా ఇచ్చి మరొకదాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని నిజమైన అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయకాండ ధర్మశాస్త్రానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో విరామచిహ్నంగా కామా ఉంచబడింది. ‘ప్రతిష్ఠితమైనవి,’ ‘శుద్ధుడు,’ ‘అపవిత్రం’ వంటి పదాలు ఆచారపరమైన సందర్భాన్ని నిలుపుతాయి.
