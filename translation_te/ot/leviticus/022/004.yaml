  revision_rationale: మూలంలోని ఆచారపరమైన అపవిత్రత భావాన్ని వైద్యనిర్ధారణగా మార్చకుండా మరింత స్పష్టంగా చేశాం. మృతదేహ-సంబంధ పదబంధంలోని చర్చనీయమైన వ్యాప్తిని ప్రధాన పాఠం మరియు పాదసూచిక మధ్య నిలిపాం. పాదసూచికలలోని సంపాదకీయ భాషా లోపాలను సరిచేశాం. వచనం మూలంలో తరువాతి వచనానికి కొనసాగుతున్నందున చివరి కామాను అలాగే ఉంచాం.
