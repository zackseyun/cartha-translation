    rationale: ‘చర్మాన్ని అపవిత్రం చేసే వ్యాధి’ అంటే చర్మాన్నే అపవిత్రం చేసేదిగా వినిపిస్తుంది. צָרוּעַ ఇక్కడ వ్యక్తిని ఆచారపరంగా అపవిత్రునిగా చేసే చర్మస్థితిని సూచిస్తుంది.
