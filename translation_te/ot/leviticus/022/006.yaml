reference: Leviticus 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע בּ֔/וֹ וְ/טָמְאָ֖ה עַד הָ/עָ֑רֶב וְ/לֹ֤א יֹאכַל֙ מִן הַ/קֳּדָשִׁ֔ים כִּ֛י אִם רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: te
  text: దానిని తాకిన వ్యక్తి సాయంత్రం వరకు అపవిత్రంగా ఉంటాడు; తన శరీరాన్ని నీటితో కడుక్కొనే వరకు ప్రతిష్ఠితమైన వాటిలో దేనినీ తినకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన మాంసాన్ని నీళ్లలో కడుక్కుంటే తప్ప.” “ప్రతిష్ఠితమైనవి” అనే మాటకు “పవిత్రమైనవి” లేదా “ప్రతిష్ఠిత అర్పణలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: వ్యక్తి
  rationale: ధర్మశాస్త్ర సందర్భంలో ఇది అమూర్తమైన ‘ఆత్మ’ను కాక ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: దానిని తాకిన
  rationale: స్త్రీలింగ క్రియ נֶפֶשׁ అనే వ్యాకరణపరంగా స్త్రీలింగ నామవాచకంతో సరిపోతుంది; జీవసంబంధ లింగాన్ని సూచించదు. పూర్వ సందర్భంలోని అపవిత్రత మూలాన్ని సూచించే సర్వనామాన్ని ‘దానిని’గా అనువదించడం అనవసరంగా పురుష వ్యక్తిని సూచించకుండా ఉంటుంది.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: సాయంత్రం వరకు అపవిత్రుడిగా ఉంటాడు
  rationale: ఇది ఆచారపరమైన అపవిత్ర స్థితి ఎంతకాలం ఉంటుందో తెలుపుతుంది; ఆధునిక తెలుగులో సహజమైన న్యాయశైలి.
- source_word: וְלֹא יֹאכַל מִן הַקֳּדָשִׁים
  choice: ప్రతిష్ఠితమైన వాటిలో దేనినీ తినకూడదు
  rationale: מִן యొక్క భాగార్థాన్ని ‘దేనినీ’ తెలియజేస్తుంది; הַקֳּדָשִׁים దేవునికి ప్రత్యేకపరచబడిన పవిత్ర ఆహార/అర్పణ వస్తువులను సూచిస్తుంది.
- source_word: כִּי אִם
  choice: వరకు
  rationale: కడుక్కోవడం పూర్తయ్యే ముందు తినకూడదనే షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: తన శరీరాన్ని నీళ్లతో కడుక్కొనే
  rationale: בָּשָׂר అక్షరార్థంగా ‘మాంసం’; ఇక్కడ వ్యక్తి శరీరాన్ని సూచిస్తుంది. ‘నీళ్లతో కడుక్కోవడం’ భౌతిక శుద్ధీకరణ చర్యను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అపవిత్రత స్వభావం
  choice: ఆచారపరమైన అపవిత్రతను సూచించే ‘అపవిత్రుడు’
  alternative: నైతిక కల్మషం లేదా పాపదోషం
  rationale: సందర్భం స్పర్శవల్ల కలిగే ఆచారపరమైన స్థితి, ప్రతిష్ఠిత ఆహారం తినే అర్హత, నీటితో కడుక్కోవడం గురించి ఉంది; వచనం చెప్పని నైతిక దోషాన్ని అనువాదం చేర్చదు.
- issue: కడుక్కోవడం మరియు తినే అర్హత మధ్య సంబంధం
  choice: కడుక్కోవడం తినడానికి అవసరమైన షరతుగా చూపించడం
  alternative: కడుక్కున్న వెంటనే అపవిత్రత పూర్తిగా ముగుస్తుందని స్పష్టీకరించడం
  rationale: వచనం సాయంత్రం వరకు అపవిత్రతను, అలాగే కడుక్కోకుండా పవిత్రమైన వాటిని తినరాదనే షరతును చెబుతుంది. వాటి కాలక్రమ సంబంధాన్ని మూలపాఠం కంటే ఎక్కువగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ధర్మశాస్త్ర శైలి. ‘వ్యక్తి’ లింగ సమగ్రతను నిలుపుతుంది; తరువాతి ఏకవచన వాక్య నిర్మాణంలో తెలుగు సహజ ప్రయోగం ప్రకారం ‘అపవిత్రుడిగా’ వాడబడింది. మూలంలోని ఆచారపరమైన భావాన్ని నిలుపుతూ నైతిక దోషార్థాన్ని చేర్చలేదు.
