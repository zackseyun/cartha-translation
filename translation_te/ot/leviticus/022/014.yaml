id: LEV.22.14
reference: Leviticus 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: te
  text: ఒక పురుషుడు[a] ప్రతిష్ఠితమైన దానిని[b] పొరపాటున[c] తింటే, అతడు దానికి ఐదవ వంతు అదనంగా కలిపి[d], ప్రతిష్ఠితమైన దానిని యాజకునికి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎవరైనా’ / ‘ఒక వ్యక్తి’. హెబ్రీలో అక్షరార్థంగా ‘ఒక పురుషుడు’; న్యాయసూత్ర భాషలో ఇది సాధారణ వ్యక్తిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రతిష్ఠితమైనది’ అంటే యాజకుల వినియోగానికి ప్రత్యేకింపబడిన పవిత్ర ఆహారం లేదా వస్తువు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘తెలియక’ / ‘అనుద్దేశంగా’.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘దానిలో ఐదవ వంతును దానికి అదనంగా కలిపి’; అంటే అసలు మొత్తానికి ఇరవై శాతం అదనంగా చేర్చి.
    reason: translation_clarification
lexical_decisions:
- source_word: וְאִישׁ
  choice: ఒక పురుషుడు
  rationale: אִישׁ పుంలింగ ఏకవచన న్యాయసూత్ర పదం. తెలుగు ప్రధాన పాఠంలో మూలంలోని రూపాన్ని నిలుపుతూ ‘ఒక పురుషుడు’ అని ఇచ్చాం; ఈ విధమైన ధర్మశాస్త్ర ప్రయోగం సాధారణ వ్యక్తిని కూడా సూచించవచ్చు.
- source_word: כִּי יֹאכַל
  choice: తింటే
  rationale: כִּי ఇక్కడ షరతును ప్రవేశపెడుతుంది; imperfect క్రియ న్యాయపరమైన సంభావ్య సందర్భాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘తింటే’ సహజంగా రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: קֹדֶשׁ
  choice: ప్రతిష్ఠితమైన దానిని
  rationale: קֹדֶשׁ ఇక్కడ యాజకుల వినియోగానికి ప్రత్యేకింపబడిన పవిత్ర ఆహారం లేదా వస్తువును సూచిస్తుంది. ‘ప్రతిష్ఠితమైనది’ దాని ప్రత్యేకింపబడిన స్థితిని చూపుతూ, ‘ఆహారం’ అని అనవసరంగా అర్థాన్ని కుదించదు.
- source_word: בִּשְׁגָגָה
  choice: పొరపాటున
  rationale: שְׁגָגָה ఉద్దేశపూర్వకమైన అతిక్రమాన్ని కాక అనుద్దేశిత తప్పును సూచిస్తుంది. ‘పొరపాటున’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: అతడు దానికి ఐదవ వంతు అదనంగా కలిపి
  rationale: ఈ పదబంధం అసలు మొత్తానికి దానిలో ఐదవ వంతును అదనంగా చేర్చే పరిహారాన్ని ఆదేశిస్తుంది. తెలుగు వాక్యం మూలంలోని ‘దానికి’ అనే సంబంధాన్ని నిలుపుతూ పునరుక్తిని తగ్గిస్తుంది.
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: ప్రతిష్ఠితమైన దానిని యాజకునికి ఇవ్వాలి
  rationale: נתן యొక్క ప్రాథమిక అర్థమైన ‘ఇవ్వడం’ నిలుపబడింది. రెండో קֹדֶשׁ‌ను కూడా అదే పదబంధంతో అనువదించడం ద్వారా హెబ్రీ పునరుక్తి, పరిహార వస్తువుతో దాని సంబంధం నిలుస్తాయి.
theological_decisions:
- issue: న్యాయసూత్రంలోని పుంలింగ ఏకవచనం
  choice: ప్రధాన పాఠంలో ‘ఒక పురుషుడు’ అని ఉంచడం
  alternative: ‘ఎవరైనా’ లేదా ‘ఒక వ్యక్తి’
  rationale: మూలంలోని אִישׁ వ్యాకరణపరంగా పుంలింగ ఏకవచనం. అది న్యాయభాషలో సాధారణంగా వర్తించే అవకాశం ఉన్నప్పటికీ, ప్రధాన పాఠం మూలరూపాన్ని చెరపకుండా ఉంచి, విస్తృత ప్రయోగాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: పరిహారంగా ఇవ్వబడే వస్తువు స్వభావం
  choice: రెండు చోట్లా ‘ప్రతిష్ఠితమైనది’
  alternative: ‘పవిత్ర ఆహారం’, ‘పవిత్ర భాగం’ లేదా ‘దాని విలువ’
  rationale: కֹדֶשׁ పదం ఈ సందర్భంలో తినదగిన ప్రతిష్ఠిత భాగాన్ని సూచించినా, వచనం దానిని ‘ఆహారం’ లేదా ‘విలువ’ అని స్పష్టంగా పరిమితం చేయదు. అందువల్ల మూలంలోని విస్తృతతను, పరిహార భాషలోని స్వల్ప ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి వాడబడింది. ‘ఇవ్వాలి’ ఆజ్ఞాత్మక న్యాయబలాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘ప్రతిష్ఠితమైనది’ అనే పదం ఆచారపరమైన ప్రత్యేకింపును తెలియజేస్తూ, మూలం చెప్పని మేరకు ‘ఆహారం’ లేదా ‘విలువ’ అని అర్థాన్ని కుదించకుండా ఉంచుతుంది.
