  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: te
  text: వారు నేను అప్పగించిన కర్తవ్యాన్ని[a] పాటించాలి; దానిని అపవిత్రపరచడం వల్ల వారు పాపదోషాన్ని మోసి[b] దానివల్ల మరణించకూడదు[c]. వారిని పవిత్రపరిచే[d] యాహ్వేను నేనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా విధిని.’ హీబ్రూ మిశ్మెరెత్ అనే పదం కాపాడవలసిన బాధ్యతను లేదా అప్పగించబడిన కర్తవ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దానివల్ల అపరాధానికి బాధ్యులై.’ ‘పాపదోషాన్ని మోయడం’ అనే హీబ్రూ నుడికారం అపరాధబాధ్యత వహించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దానివల్ల చనిపోకూడదు.’ హీబ్రూ బ్‌లో ఉన్న సర్వనామం అపవిత్రీకరణకు లేదా సంబంధిత అపరాధానికి అనుసంధానమైన ఫలితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
