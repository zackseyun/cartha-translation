- from: వారు నా ఆజ్ఞాపిత బాధ్యతను[a] పాటించాలి. దాన్ని అపవిత్రపరచి, దాని కారణంగా పాపభారం మోసి[b] చనిపోకుండా[c] ఉండాలి. వారిని పవిత్రపరిచే[d] యెహోవాను నేనే.
  to: వారు నేను అప్పగించిన కర్తవ్యాన్ని[a] పాటించాలి; దానిని అపవిత్రపరచడం వల్ల వారు పాపదోషాన్ని మోసి[b] దానివల్ల మరణించకూడదు[c]. వారిని పవిత్రపరిచే[d] యాహ్వేను నేనే.
