    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: పాటించాలి
  rationale: న్యాయసంబంధమైన, ఆరాధనాసంబంధమైన సందర్భంలో ‘కాపాడాలి’ అనే మూలభావంతో పాటు విధేయంగా ఆచరించాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִשְׁמַרְתִּי
  choice: నా ఆజ్ఞాపిత బాధ్యత
  rationale: యాజకులకు అప్పగించబడిన కర్తవ్యమనే భావాన్ని ‘బాధ్యత’ తెలియజేస్తుంది; ‘ఆజ్ఞాపిత’ అనే విశేషణం అది యెహోవా విధించిన బాధ్యత అని స్పష్టం చేస్తుంది.
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: దాని కారణంగా పాపభారం మోసి
  rationale: ‘పాపాన్ని మోయడం’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, עָלָיו సూచించే సంబంధాన్ని ‘దాని కారణంగా’ సహజంగా వ్యక్తం చేస్తుంది. ఇది అపరాధానికి బాధ్యులవడం అనే భావాన్నీ కలిగి ఉండవచ్చు.
- source_word: וּמֵתוּ בוֹ
  choice: చనిపోకుండా
  rationale: ముందున్న నిషేధంతో కలిపి తెలుగులో సహజంగా ప్రతికూల ఫలితాన్ని తెలియజేస్తుంది; ‘దాని కారణంగా’ అనే పదబంధం పాపభారం మోయడం, మరణించడం రెండింటికీ సందర్భానుసారంగా అనుసంధానమవుతుంది.
- source_word: יְחַלְּלֻהוּ
  choice: దాన్ని అపవిత్రపరచి
  rationale: లేవీయకాండంలోని పవిత్రం–సామాన్యం వ్యత్యాసంలో חלל అంటే పవిత్రమైనదాని పవిత్రతను భంగపరచడం లేదా దాన్ని సామాన్యమైనదిగా చూడడం. ‘అపవిత్రపరచి’ ఈ ఆరాధనాసంబంధ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: מְקַדְּשָׁם
  choice: వారిని పవిత్రపరిచే
  rationale: హీబ్రూ కార్యార్థక రూపం యెహోవా వారిని పవిత్రులుగా నిలబెట్టేవాడని తెలియజేస్తుంది; ‘పవిత్రపరిచే’ ఆ భావాన్నీ లేవీయకాండపు పవిత్రతా పదజాలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ‘దాన్ని / దాని’ అనే ఏకవచన సర్వనామాల నిర్దిష్ట సూచన
  choice: హీబ్రూలో ఉన్నట్లే ఏకవచన సర్వనామాలను నిర్దిష్ట నామవాచకంతో భర్తీ చేయకుండా ఉంచడం
  alternative: అవి సందర్భంలోని పవిత్ర ఆహారాన్ని సూచిస్తాయని లేదా యెహోవా అప్పగించిన బాధ్యతనే సూచిస్తాయని స్పష్టంగా అనువదించడం
  rationale: మూలవచనం ఏకవచన సర్వనామాలను వాడుతుంది గాని వాటి నామవాచక సూచనను మళ్లీ స్పష్టంగా చెప్పదు. సమీప సందర్భం పవిత్రమైన వాటి గురించీ, ఈ వచనం యెహోవా అప్పగించిన బాధ్యత గురించీ మాట్లాడుతుంది. కాబట్టి తెలుగు అనువాదం ఈ నిజమైన అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పాపభారం,’ ‘అపవిత్రపరచి,’ ‘పవిత్రపరిచే’ అనే పదాలు లేవీయకాండంలోని పవిత్రతా భావజాలాన్ని నిలుపుతాయి. మూలంలోని సర్వనామ అస్పష్టతను ‘దాన్ని/దాని’ ద్వారా ఉద్దేశపూర్వకంగా కాపాడాం.
