  text: for your acceptance, it must be a sound male from the cattle, the sheep, or the goats.
translation:
  language: te
  text: మీకు ఆమోదం కలగడానికి, పశువులలోనుండి, గొర్రెలలోనుండి లేదా మేకలలోనుండి లోపంలేని మగ జంతువును అర్పించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: మీరు అంగీకరించబడాలంటే
  rationale: ఈ సందర్భంలో బలి అర్పించేవారికి ఆమోదం కలగాలనే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘మీ ఇష్టప్రకారం’ అనే సాధ్యమైన సాధారణ అర్థం కంటే బలుల ఆమోదం గురించిన సందర్భానికి ఇది బాగా సరిపోతుంది.
- source_word: תָּמִים
  choice: లోపంలేని
  rationale: బలిపశువుకు శారీరక దోషం లేదా కళంకం ఉండకూడదనే ఆచార సంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: זָכָר
  choice: మగదానిని
  rationale: ఎంచుకునే పశువు మగది కావాలనే మూలపాఠంలోని లింగ నిర్దేశాన్ని నిలుపుతుంది.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: పశువులలోనుండి గాని, గొర్రెలలోనుండి గాని, మేకలలోనుండి గాని
  rationale: మూలంలోని మూడు పశువర్గాలను క్రమానుసారంగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: לִרְצֹנְכֶם యొక్క ఆమోద సంబంధ భావం
  choice: మీరు అంగీకరించబడాలంటే
  alternative: మీ ఇష్టప్రకారం
  rationale: లేవీయకాండము 22:18–21లో బలి ఆమోదయోగ్యంగా ఉండటమే ప్రధాన సందర్భం; అయితే మూలపదంలో ‘ఇష్టం/అనుకూలత’ భావ పరిధి కూడా ఉంది.
- issue: תָּמִים యొక్క బలి సంబంధ అర్థం
  choice: లోపంలేని
  alternative: సంపూర్ణమైన / ఆరోగ్యమైన
  rationale: ఇది సాధారణ ఆరోగ్యాన్ని మాత్రమే కాక, బలికి అనర్హం చేసే దోషం లేనిదనాన్ని సూచిస్తుంది; తరువాతి వచనాలు ఈ భావాన్ని వివరంగా నిర్ధారిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞాత్మక భావాన్ని సహజంగా తెలియజేయడానికి మూలంలోని సంక్షిప్త నామవాక్యాన్ని ‘అర్పించాలి’తో పూర్తిచేశాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది.
