  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי לֹ֥א לְ/רָצ֖וֹן יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: te
  text: లోపమున్న దేనినీ మీరు అర్పించకూడదు; ఎందుకంటే అది మీ కొరకు స్వీకరించబడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మీకు ఆమోదయోగ్యంగా ఉండదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: లోపం ఉన్నదేదీ
  rationale: ఈ సమగ్ర నిర్దిష్టతలేని హెబ్రీ వ్యక్తీకరణను సహజమైన తెలుగులో తెలిపి, లోపమున్న ప్రతి బలిని నిషేధించే భావాన్ని నిలుపుతుంది.
- source_word: מוּם
  choice: లోపం
  rationale: యాజకసంబంధమైన బలి సందర్భంలో ఇది అర్పణకు అనర్హత కలిగించే శారీరక దోషాన్ని సూచిస్తుంది. ‘లోపం’ ఆధునిక తెలుగులో సహజంగా, విస్తృతంగా అర్థమవుతుంది.
- source_word: לֹא תַקְרִיבוּ
  choice: మీరు అర్పించకూడదు
  rationale: קרב హిఫీల్ రూపం ఇక్కడ బలిగా దేవుని సన్నిధికి తీసుకురావడం లేదా సమర్పించడం అనే భావంలో ఉంది; తెలుగు బలి సందర్భంలో ‘అర్పించు’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: అది మీ పక్షంగా అంగీకరించబడదు
  rationale: לְרָצוֹן అనే బలిసంబంధ పదబంధంలోని అనుకూల స్వీకార భావాన్నీ, לָכֶם లోని ‘మీ కోసం/మీ పక్షంగా’ అనే సంబంధ భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: బలికి సంబంధించిన అంగీకార భాష
  choice: మీ పక్షంగా అంగీకరించబడదు
  alternative: మీకు ఆమోదయోగ్యంగా ఉండదు
  rationale: వాక్యం కేవలం బలి ప్రమాణానికి సరిపోవడం గురించి కాక, అర్పించేవారి పక్షంగా ఆ బలి అనుకూలంగా స్వీకరించబడుతుందా అనే విషయాన్ని చెబుతుంది. ఈ రూపం తరువాతి సిద్ధాంతార్థాలను చేర్చకుండా ఆ సంబంధపూర్వక బలి భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర బలి సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘లోపం’ అనే పదం శారీరక దోషాన్ని సూచించే బలిసంబంధ భావంలో వాడబడింది.
