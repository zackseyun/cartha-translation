id: LEV.22.21
reference: Leviticus 22:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: te
  text: ఒక పురుషుడు యాహ్వేకు సమాధానబలిని అర్పిస్తే—మొక్కుబడిని నెరవేర్చడానికైనా లేదా స్వచ్ఛంద అర్పణగానైనా, పశువుల మందలోనిదైనా గొర్రెమేకల మందలోనిదైనా—అది అంగీకరించబడటానికి లోపంలేనిదై ఉండాలి; దానిలో ఏ లోపమూ ఉండకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ఒక పురుషుడు ... అర్పిస్తే
  rationale: אִישׁ అనే పుంలింగ ఏకవచన న్యాయవిషయాన్ని ‘పురుషుడు’గా నిలిపి, כִּי మరియు తరువాతి అసంపూర్ణ క్రియ కలిపి సూచించే షరతును ‘అర్పిస్తే’తో సహజంగా వ్యక్తం చేశాం.
- source_word: יַקְרִיב
  choice: అర్పిస్తే
  rationale: קרב హిఫీల్ రూపం బలిని దేవుని ఎదుట సమర్పించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు ఆరాధనా సందర్భంలో ‘అర్పించు’ సహజమూ ఖచ్చితమూ.
- source_word: זֶבַח שְׁלָמִים
  choice: సమాధాన బలి
  rationale: ఇది ప్రత్యేక బలి రకానికి పేరు. שׁלםతో ఉన్న శాంతి/సమాధాన భావసంబంధాన్ని నిలిపే, తెలుగులో పరిచితమైన సంక్షిప్త పదబంధం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించాం.
- source_word: לְפַלֵּא נֶדֶר
  choice: మొక్కుబడిని నెరవేర్చడానికి
  rationale: ఈ బలిసంబంధ సందర్భంలో פלא పియేల్ అనంతరూపం చేసిన మొక్కును కార్యరూపంలో పూర్తిచేయడం లేదా తీర్చడాన్ని సూచిస్తుంది.
- source_word: אוֹ לִנְדָבָה
  choice: స్వేచ్ఛార్పణగా
  rationale: נְדָבָה మొక్కుబడివల్ల తప్పనిసరైనది కాక, స్వచ్ఛందంగా ఇచ్చే అర్పణను సూచిస్తుంది.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: పశువుల్లోనిదైనా గొర్రెమేకల్లోనిదైనా
  rationale: בקר పెద్ద పశువులను, צאן గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల వర్గాన్ని సూచిస్తాయి; రెండవ పదాన్ని కేవలం ‘గొర్రెలు’గా కుదించలేదు.
- source_word: תָּמִים יִהְיֶה לְרָצוֹן
  choice: అది అంగీకరించబడటానికి లోపంలేనిదై ఉండాలి
  rationale: תמים యొక్క బలిసంబంధ భౌతిక సమగ్రతను ‘లోపంలేనిది’గా, לרצון యొక్క అంగీకార ఉద్దేశం/ఫలితాన్ని ‘అంగీకరించబడటానికి’గా నిలిపాం.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: దానిలో ఏ లోపమూ ఉండకూడదు
  rationale: מוּם బలిని అనర్హం చేసే శారీరక లోపం; హెబ్రీ పాఠంలోని బలమైన పునరుద్ఘాటనను తొలగించకుండా సహజ తెలుగు నిషేధంగా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: పాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా నేరుగా సూచిస్తుంది.
- issue: אִישׁ అనే న్యాయవిషయపు లింగం
  choice: ఒక పురుషుడు
  alternative: ఎవరైనా / ఒక వ్యక్తి
  rationale: హెబ్రీలోని పుంలింగ ఏకవచన రూపాన్ని నిలిపాం; దాని ప్రతినిధాత్మక న్యాయప్రయోగాన్ని లింగతటస్థంగా మృదువుచేయలేదు.
- issue: לְרָצוֹן యొక్క భావం
  choice: అంగీకరించబడటానికి
  alternative: అనుగ్రహం పొందటానికి
  rationale: ఇక్కడ ప్రధానంగా బలి ఆమోదయోగ్యత ఉద్దేశించబడింది; ‘అనుగ్రహం’ అని అనువదిస్తే పాఠం స్పష్టంగా చెప్పని ఫలితాన్ని చేర్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడాం. పొడవైన హెబ్రీ వాక్య నిర్మాణాన్ని డాష్‌లతో స్పష్టపరిచి, ‘లోపంలేనిది/లోపం’ అనే మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపాం.
