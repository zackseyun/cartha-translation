- from: ఒక పురుషుడు యాహ్వేకు సమాధాన బలి[a] అర్పిస్తే—అది మొక్కుబడిని నెరవేర్చడానికైనా[b], స్వేచ్ఛార్పణగానైనా, పశువుల్లోనిదైనా గొర్రెమేకల్లోనిదైనా—అది అంగీకరించబడటానికి లోపంలేనిదై ఉండాలి; దానిలో ఏ లోపమూ ఉండకూడదు.
