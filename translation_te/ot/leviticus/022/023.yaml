source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: te
  text: అయితే అవయవం మరీ పొడవుగా గానీ మరీ పొట్టిగా గానీ ఉన్న ఎద్దును గానీ గొర్రెను గానీ స్వచ్ఛంద అర్పణగా[a] అర్పించవచ్చు; కానీ మొక్కుబడి అర్పణగా అది అంగీకరించబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సాధారణంగా, “వికృతమైనది లేదా ఎదుగుదల కుంటుపడినది.” హీబ్రూ పదాలు బహుశా పరస్పర విరుద్ధమైన రెండు రకాల శరీర అసమానతలను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: ఎద్దును
  rationale: שׁוֹר ఒక గోవు జాతి జంతువును సూచిస్తుంది; బలి నియమాల సందర్భంలో ఏకవచనమైన ‘ఎద్దు’ సహజంగా ఉంటుంది.
- source_word: וָשֶׂה
  choice: లేదా గొర్రెను
  rationale: שֶׂה మందలోని గొర్రెను లేదా మేకను సూచించగలదు. ఇక్కడ సాధారణ బలి జంతువును సూచించే సహజమైన పదంగా ‘గొర్రె’ను ఎంచుకున్నాం; వయస్సును అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: అవయవం మరీ పొడవుగా గాని మరీ పొట్టిగా గాని ఉన్న
  rationale: ఈ జత పదాలు పరస్పర విరుద్ధమైన శరీర అసమానతలను—సాగిపోయిన/అతిగా పెరిగినదాన్ని, కుంచించుకుపోయిన/తక్కువగా పెరిగినదాన్ని—సూచించే అవకాశముంది. శరీర భాగమనే భావాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద అర్పణగా
  rationale: నిర్బంధ మొక్కుబడికి భిన్నంగా స్వచ్ఛందంగా ఇచ్చే అర్పణను సూచిస్తుంది.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: అర్పించవచ్చు
  rationale: అక్షరార్థంగా ‘దానిని చేయవచ్చు’ అయినా, బలి సందర్భంలో తెలుగులో ‘అర్పించవచ్చు’ అనేది సహజమైన సందర్భార్థక ప్రయోగం.
- source_word: וּלְנֵדֶר
  choice: కానీ మొక్కుబడి అర్పణగా
  rationale: נֵדֶר అనేది చేసిన మొక్కుబడిని లేదా దాని వల్ల కలిగే అర్పణ బాధ్యతను సూచిస్తుంది; స్వచ్ఛంద అర్పణతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా తెలిపాం.
- source_word: לֹא יֵרָצֶה
  choice: అది అంగీకరించబడదు
  rationale: బలి సందర్భంలో רצה నిఫాల్ రూపం అనుకూలంగా అంగీకరించబడటాన్ని సూచిస్తుంది; కర్తను మూలం స్పష్టంగా చెప్పనందున కర్మణి రూపాన్ని నిలిపాం.
theological_decisions:
- issue: שָׂרוּעַ మరియు קָלוּט అనే లోపపదాల స్వభావం
  choice: ‘అవయవం మరీ పొడవుగా గాని మరీ పొట్టిగా గాని’ అని పరస్పర విరుద్ధ శరీర అసమానతలుగా అనువదించడం
  alternative: ‘వికారంగా లేదా ఎదుగుదల ఆగిపోయినట్లు’ అని సాధారణంగా అనువదించడం
  rationale: సమీప సందర్భం బలి జంతువుల శారీరక లోపాలకు సంబంధించినది; ఈ రెండు పదాలు విరుద్ధమైన పరిమాణ అసమానతలను సూచించేలా కనిపిస్తాయి. అయితే ఖచ్చితమైన శరీర సంబంధ భావం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘స్వచ్ఛంద అర్పణ’ మరియు ‘మొక్కుబడి అర్పణ’ అనే పదబంధాలు ఆచార సంబంధ వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలోని విరుద్ధ లోపపదాల అనిశ్చితి పాదసూచికలో సంరక్షించబడింది.
