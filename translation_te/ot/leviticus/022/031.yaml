id: LEV.22.31
reference: Leviticus 22:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: te
  text: కాబట్టి మీరు నా ఆజ్ఞలను పాటించి, వాటిని ఆచరించాలి. నేను యాహ్వేను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: కాబట్టి మీరు ... పాటించి
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే వాటిని పాటించడం లేదా గైకొనడం. ముందున్న సందర్భంతో ఉన్న అనుసంధానాన్ని וּ సూచిస్తున్నందున సహజమైన తెలుగులో ‘కాబట్టి’ అని అనువదించబడింది.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: מִצְוָה దేవుడు ఇచ్చిన ఆజ్ఞను సూచిస్తుంది; ‘ఆజ్ఞలు’ న్యాయపరమైన, నిబంధనసంబంధమైన గంభీరతను నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరించాలి
  rationale: עשה ... אֹתָם అక్షరార్థంగా ‘వాటిని చేయాలి’ అని ఉన్నా, ఆజ్ఞల విషయంలో ‘ఆచరించాలి’ సహజమైన తెలుగు. ‘పాటించడం’, ‘ఆచరించడం’ అనే రెండు భావాలను కలిపివేయకుండా మూలంలోని జతను నిలిపింది.
- source_word: אֲנִי יְהוָה
  choice: నేను యాహ్వేను
  rationale: లేవీయకాండంలో తరచుగా వచ్చే దైవ స్వపరిచయ సూత్రాన్ని నేరుగా నిలుపుతూ, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన ధర్మశాస్త్ర శైలి వాడబడింది. మూలంలోని ‘పాటించడం—ఆచరించడం’ అనే ద్వంద్వ భావం నిలుపబడింది.
