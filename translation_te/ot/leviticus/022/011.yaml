id: LEV.22.11
reference: Leviticus 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: te
  text: కాని ఒక యాజకుడు తన డబ్బుతో ఒక వ్యక్తిని తన సొత్తుగా కొంటే[a], ఆ వ్యక్తి దానిలోనుండి తినవచ్చు; అతని ఇంట్లో పుట్టినవారు కూడా అతని ఆహారంలోనుండి తినవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక వ్యక్తిని—అతని డబ్బుతో సంపాదించిన సొత్తును”; అంటే, తన డబ్బుతో కొనబడిన వ్యక్తిని.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని రొట్టెలోనుండి.” ఇక్కడ “రొట్టె” అనేది యాజకునికి కేటాయించిన ఆహారాన్ని విస్తృతంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: కాని ఒక యాజకుడు... కొంటే
  rationale: ముందరి నిషేధానికి భిన్నమైన న్యాయపరమైన సందర్భాన్ని ఇది ప్రవేశపెడుతుంది. כִּי ఇక్కడ షరతును సూచిస్తుంది; అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘కొంటే’ అని అనువదించాం.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: ఒక వ్యక్తిని... కొంటే
  rationale: נֶפֶשׁ ఇక్కడ ‘ఆత్మ’ను కాక ఒక మనిషిని సూచిస్తుంది; קנה డబ్బుతో కొనుగోలు చేయడాన్ని సూచిస్తుంది.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: తన డబ్బుతో... తన సొత్తుగా
  rationale: మూలంలోని డబ్బుతో సంపాదించబడిన ఆస్తి/స్వామ్య స్థితిని మృదువుపరచకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: הוּא יֹאכַל בּוֹ
  choice: ఆ వ్యక్తి దానిలోనుండి తినవచ్చు
  rationale: הוּא కొనబడిన వ్యక్తినే తిరిగి సూచిస్తుంది. ‘ఆ వ్యక్తి’ అనడం తెలుగులో కర్తకు గల సందిగ్ధతను నివారిస్తుంది; בּוֹ సందర్భంలోని యాజక ఆహారాన్ని సూచిస్తుంది.
- source_word: וִילִיד בֵּיתוֹ
  choice: అతని ఇంట్లో పుట్టినవారు
  rationale: ఈ పదబంధం ఇంటి/గృహ సముదాయంలో పుట్టిన వారిని సూచిస్తుంది. తరువాతి బహువచన సర్వనామం, క్రియ కారణంగా తెలుగులో సమూహార్థ బహువచనం వాడాం; మూలానికి మించి వారి స్థితిని నిర్వచించలేదు.
- source_word: בְלַחְמוֹ
  choice: అతని ఆహారంలోనుండి
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినప్పటికీ, ఈ యాజక నియమ సందర్భంలో యాజకునికి కేటాయించిన ఆహారాన్ని విస్తృతంగా సూచిస్తుంది.
theological_decisions:
- issue: దాసత్వం/స్వామ్యానికి సంబంధించిన న్యాయపరమైన భాష
  choice: తన డబ్బుతో ఒక వ్యక్తిని తన సొత్తుగా కొంటే
  alternative: తన డబ్బుతో ఒక వ్యక్తిని కొంటే
  rationale: קִנְיַן כַּסְפּוֹలోని స్వామ్య భావాన్ని దాచకుండా అనువదించాం. ఇది వచనంలోని న్యాయస్థితిని పారదర్శకంగా తెలియజేస్తుంది; దానికి నైతిక సమర్థనను జోడించదు.
- issue: పవిత్ర ఆహారం తినడానికి అనుమతి
  choice: తినవచ్చు
  alternative: తింటారు
  rationale: న్యాయసందర్భంలోని అసంపూర్ణ క్రియారూపం ఇక్కడ భవిష్యద్వాణికన్నా అనుమతిని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. మూలంలోని స్వామ్యభాషను మృదువుపరచలేదు. ‘ఆ వ్యక్తి’ ద్వారా సర్వనామ సూచనను స్పష్టం చేశాం; ‘ఇంట్లో పుట్టినవారు’ అనే రూపం మూలంలోని సమూహార్థాన్ని నిలుపుతుంది.
