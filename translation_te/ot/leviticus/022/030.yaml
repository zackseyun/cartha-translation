id: LEV.22.30
reference: Leviticus 22:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/הוּא֙ יֵאָכֵ֔ל לֹֽא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: te
  text: అదే రోజున అది తినబడాలి[a]; దానిలో ఏదీ ఉదయం వరకు మిగల్చకూడదు. నేను యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రోజున.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: అదే రోజున
  rationale: అక్షరార్థంగా ‘ఆ రోజున’; బలి అర్పించిన రోజునే దానిని తినాలనే తక్షణ కాలపరిమితిని సహజమైన తెలుగులో ‘అదే రోజున’ స్పష్టం చేస్తుంది.
- source_word: יֵאָכֵל
  choice: అది తినబడాలి
  rationale: నిఫ్అల్ రూపం ఇక్కడ నిష్క్రియార్థక నియమాన్ని వ్యక్తం చేస్తుంది; ఈ అనువాదం నిష్క్రియ రూపాన్నీ విధి భావాన్నీ నిలుపుతుంది.
- source_word: לֹא תוֹתִירוּ
  choice: మిగల్చకూడదు
  rationale: יתר హిఫ్ఈల్ రూపానికి ‘మిగిలేలా ఉంచడం’ అనే అర్థం ఉంది; ‘మిగల్చకూడదు’ నిషేధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో ఏదీ
  rationale: ప్రత్యయంతో ఉన్న పూర్వప్రత్యయం బలి పదార్థాన్ని సూచిస్తుంది; ‘దానిలో ఏదీ’ దానిలో కొంతైనా మిగలకూడదనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: రాత్రంతా దానిని ఉంచకూడదనే కాలపరిమితిని తెలిపే సాధారణ తెలుగు సమానార్థకం.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: హీబ్రూ నామవాచక వాక్యంలోని దేవుని స్వీయ-గుర్తింపు సూత్రాన్ని, యెహోవా అనే నిబంధన నామంతో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా నిబంధన నామాన్ని తెలుగు సంప్రదాయ లిప్యంతరీకరణలో ఇవ్వడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలినియమానికి తగిన గంభీరమైన విధి శైలిని ఉపయోగించాం. నిష్క్రియ రూపాన్ని సాధ్యమైనంత సహజంగా నిలిపాం; దైవనామాన్ని ప్రత్యేక నామంగా ఇచ్చాం.
