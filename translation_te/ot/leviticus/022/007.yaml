  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: te
  text: సూర్యుడు అస్తమించినప్పుడు అతడు శుద్ధి పొందుతాడు; ఆ తర్వాత అతడు పవిత్రమైన వాటిలోనుండి[b] తినవచ్చు, ఎందుకంటే అవి అతని ఆహారం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అది అతని రొట్టె.” ఇక్కడ “రొట్టె” అంటే అతనికి కేటాయించబడిన పవిత్ర భాగాల ఆహారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పవిత్ర అర్పణలలోనుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించినప్పుడు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘సూర్యుడు వచ్చాడు’ అని ఉన్నా, ఇక్కడ అది సూర్యాస్తమయాన్ని సూచిస్తుంది. కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְטָהֵר
  choice: అతడు శుద్ధుడవుతాడు
  rationale: సూర్యాస్తమయం తర్వాత కర్మకాండపరమైన అశుద్ధి తొలగి శుద్ధస్థితి పునరుద్ధరించబడటాన్ని సూచిస్తుంది; నైతిక పరిశుద్ధతను అదనంగా చేర్చదు.
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: నియమంలోని తదుపరి దశను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֹאכַל
  choice: తినవచ్చు
  rationale: ఇక్కడి అసంపూర్ణ క్రియారూపం శుద్ధస్థితి వచ్చిన తర్వాత కలిగే అనుమతిని సూచిస్తుంది.
- source_word: מִן הַקֳּדָשִׁים
  choice: ప్రతిష్ఠితమైన వాటిలో నుంచి
  rationale: קֳדָשִׁים అనే బహువచనానికి ‘ప్రతిష్ఠితమైనవి’ అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘అర్పణలు’ అని పరిమితం చేయకుండా మూలంలోని సాధారణతను కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తినడానికి అనుమతి ఇవ్వబడిన కారణాన్ని స్పష్టంగా తెలియజేసే కారణార్థక అనుసంధానం.
- source_word: לַחְמוֹ הוּא
  choice: అవి అతని ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా ఇక్కడ యాజకునికి కేటాయించబడిన ఆహారాన్ని విస్తృతంగా సూచిస్తుంది. హీబ్రూలో విధేయపదం ఏకవచనంగా ఉన్నప్పటికీ, ముందున్న బహువచన ప్రతిష్ఠిత వస్తువులతో సహజ తెలుగు అన్వయానికి ‘అవి’ వాడబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: శుద్ధత భాష స్వభావం
  choice: కర్మకాండ సంబంధమైన శుద్ధస్థితిని సూచించే ‘శుద్ధుడవుతాడు’
  alternative: నైతికంగా లేదా ఆధ్యాత్మికంగా పవిత్రుడవుతాడు
  rationale: లేవీయకాండము 22 సందర్భం అశుద్ధస్థితి తర్వాత యాజకుడు ప్రతిష్ఠిత ఆహారం తినగలగడం గురించి చెబుతుంది. అందువల్ల అనువాదం నైతిక అపరాధమో అంతరంగ పవిత్రతో అనే భావాన్ని చేర్చదు.
- issue: లַחְמוֹ הוּא లోని సంఖ్యా ఉద్రిక్తత
  choice: సహజ తెలుగు అన్వయంతో ‘అవి అతని ఆహారం’
  alternative: అక్షరసన్నిహితంగా ‘అది అతని రొట్టె’
  rationale: మూలంలో ‘అతని రొట్టె/ఆహారం’ ఏకవచనంగా ఉన్నా, అది ముందున్న బహువచన ‘ప్రతిష్ఠితమైన వాటిని’ సమష్టిగా సూచిస్తుంది. ప్రధాన పాఠంలో సహజ అన్వయం, పాదసూచికలో అక్షరార్థం ఇవ్వడం ద్వారా రెండింటినీ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రతిష్ఠితమైనవి’ అనే పదం మూలంలోని విస్తృత పవిత్ర వస్తువుల భావాన్ని నిలుపుతుంది; సందర్భం ద్వారా ఇది యాజకునికి ఆహారంగా లభించే పవిత్ర భాగాలను సూచిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
