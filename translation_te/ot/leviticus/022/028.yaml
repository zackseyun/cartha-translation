id: LEV.22.28
reference: Leviticus 22:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שׁ֖וֹר אוֹ שֶׂ֑ה אֹת֣/וֹ וְ/אֶת בְּנ֔/וֹ לֹ֥א תִשְׁחֲט֖וּ בְּ/י֥וֹם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: te
  text: ఎద్దునైనా, గొర్రెనైనా లేదా మేకనైనా, దానినీ దాని పిల్లనూ[a] ఒకే రోజున వధించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దానిని, దాని కుమారుని.” ఇక్కడ ఈ మాట జంతువును, దాని సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఆవు జాతికి చెందిన బలి పశువును సూచించే సాధారణ న్యాయశైలి పదంగా ‘ఎద్దు’ సహజంగా ఉంది; అయితే హీబ్రూ పదం సందర్భానుసారంగా ఆవు జాతి పశువును విస్తృతంగా సూచించగలదు.
- source_word: שֶׂה
  choice: గొర్రె లేదా మేక
  rationale: שֶׂה మందలోని చిన్న పశువును సూచించి, గొర్రెను గానీ మేకను గానీ ఉద్దేశించగలదు. మూలంలోని ఈ వ్యాప్తిని తెలుగులో స్పష్టంగా నిలుపుటకు రెండింటినీ పేర్కొన్నాం.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: దానినీ దాని పిల్లనూ
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దానిని, దాని కుమారుణ్ణి’ అని ఉన్నా, జంతువుల విషయంలో ‘పిల్ల’ సహజంగా ఉండి సంతానాన్ని సూచిస్తుంది; తల్లి అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: תִשְׁחֲטוּ
  choice: వధించకూడదు
  rationale: שׁחט జంతువును, ముఖ్యంగా బలి లేదా న్యాయ సందర్భంలో, వధించడాన్ని సూచిస్తుంది. ‘చంపకూడదు’ కంటే ‘వధించకూడదు’ సాంకేతిక భావాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: בְּיוֹם אֶחָד
  choice: ఒకే రోజున
  rationale: అక్షరార్థంగా ‘ఒక రోజులో/రోజున’; ఈ నిషేధ సందర్భంలో ‘ఒకే రోజున’ అనేది సహజమైన తెలుగు, ఒకే దినంలో రెండింటినీ వధించరాదనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אוֹ
  choice: అయినా / లేదా
  rationale: ఎద్దు మరియు మంద పశువు మధ్యనున్న వికల్ప సంబంధాన్ని తెలుగులో ‘ఎద్దునైనా, గొర్రె లేదా మేకనైనా’ అనే సహజ న్యాయశైలి నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: పెద్ద జంతువు తల్లేనని స్పష్టీకరించాలా
  choice: ‘దానినీ దాని పిల్లనూ’ అని లింగాన్ని నిర్దిష్టం చేయలేదు
  alternative: ‘తల్లినీ దాని పిల్లనూ’
  rationale: ఈ వాక్యంలోని హీబ్రూ వ్యాకరణ రూపం అక్షరార్థంగా ‘దానిని, దాని కుమారుణ్ణి’ అని ఉంది; ‘తల్లి’ అనే భావం సాధ్యమైన సందర్భార్థమైనా వాక్యంలో ప్రత్యక్షంగా లేదు. అందుచేత మూలంలోని ఉద్వేగం/అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘ఒకే రోజున’ సహజమైన తెలుగు; ‘వధించకూడదు’ బలి-న్యాయ సందర్భానికి తగిన పదం.
