  terminology: “వధించకూడదు” suitably reflects the technical animal-slaughter sense of שׁחט. “పిల్ల” is natural Telugu for an animal’s offspring. The footnote should use the standard accusative forms “దానిని, దాని కుమారుని” in its literal Hebrew gloss.
