id: LEV.22.15
reference: Leviticus 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలీయులు యాహ్వేకు పైకెత్తి అర్పించే పవిత్రమైన వాటిని[a] అపవిత్రపరచకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు యాహ్వేకు సమర్పించే పవిత్రమైన వాటిని” లేదా “ఇశ్రాయేలీయులు యాహ్వేకు అర్పించే పవిత్రమైన వాటిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: అపవిత్రపరచకూడదు
  rationale: పవిత్రమైనదాన్ని సాధారణమైనదిగా చేయడం లేదా దాని పవిత్రతను భంగపరచడం అనే పీయేల్ క్రియ భావాన్ని ఆరాధనా సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָדְשֵׁי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల పవిత్రమైన వాటిని
  rationale: קָדְשֵׁי అనే పదాన్ని కేవలం ‘అర్పణలు’గా కుదించకుండా, ప్రతిష్ఠించబడిన వస్తువుల విస్తృత భావాన్ని నిలుపుతుంది; בְּנֵי יִשְׂרָאֵל అనే స్థిర జాతీయ నామానికి సహజమైన ఆధునిక తెలుగు రూపం ‘ఇశ్రాయేలీయులు.’
- source_word: אֲשֶׁר יָרִימוּ
  choice: వారు … పైకెత్తి అర్పించేవాటిని
  rationale: రום హిఫీల్‌లోని ‘పైకెత్తు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, బలిసంబంధ సందర్భంలో దాని సమర్పణ భావాన్ని ‘అర్పించు’తో సహజంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలోని దేవుని నిబంధన నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: וְלֹא
  choice: అపవిత్రపరచకూడదు
  rationale: ధర్మశాస్త్ర సందర్భంలోని నిషేధార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగులో సహజమైన విధినిషేధ రూపంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నిబంధన నామం ప్రత్యక్షంగా ఉన్నందున దానిని పేరుగానే ఉంచి, ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు.
- issue: ‘పవిత్రమైనవి’ అనే పదబంధం పరిధి
  choice: పవిత్రమైన వాటిని
  alternative: పవిత్ర అర్పణలను
  rationale: ఈ సందర్భంలో అర్పణలే ప్రధాన సూచన అయినప్పటికీ, קָדְשֵׁי అనే విస్తృత పదాన్ని అనవసరంగా సంకుచితం చేయకుండా మూలంలోని పరిధిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ‘పైకెత్తి అర్పించు’ అనే పదబంధం మూలంలోని దృశ్యరూపాన్నీ ఆరాధనా సందర్భాన్నీ కలిపి తెలియజేస్తుంది. మూలంలోని రెండు బహువచన క్రియల కర్తలు సందర్భానుసారం వేరుగా అర్థమయ్యే అవకాశాన్ని తెలుగు సర్వనామ పునరుక్తితో పూర్తిగా తొలగించకుండా ఉంచాం.
