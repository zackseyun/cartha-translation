revisions:
- from: ఇశ్రాయేలీయుల పవిత్రమైన వాటిని—వారు యాహ్వేకు పైకెత్తి అర్పించేవాటిని[a]—వారు అపవిత్రపరచకూడదు.
  to: ఇశ్రాయేలీయులు యాహ్వేకు పైకెత్తి అర్పించే పవిత్రమైన వాటిని[a] అపవిత్రపరచకూడదు.
  rationale: The revision removes unnecessary pronoun repetition and dash punctuation. It retains the Hebrew sequence of consecrated things belonging to Israel that Israel lifts up/presents to Yahweh, while leaving the main prohibitive subject implicit, as in the Hebrew and as supplied by the immediate priestly context. No theological or interpretive narrowing has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:49:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the prohibition, the consecrated things belonging to Israel, and the divine name יהוה as “యాహ్వే.” However, the repeated independent pronoun “వారు” makes the two distinct contextual referents unnecessarily difficult to follow: the implicit subject of “shall not profane” is the priests (from the preceding context), whereas the lifters/presenters are the Israelites. The Hebrew’s sacrificial lifting/presentation sense is adequately retained by “పైకెత్తి అర్పించే.”'
  naturalness: The dash-interruption and repeated “వారు” are less natural in modern standard Telugu. Placing the relative clause before “పవిత్రమైన వాటిని” produces a clear, fluent legal-style sentence while retaining the source’s implicit main subject.
  terminology: “పవిత్రమైన వాటిని” appropriately preserves the broad referent of קָדְשֵׁי without narrowing it to offerings. “అపవిత్రపరచకూడదు” is suitable for the cultic Piel of חלל. “యాహ్వే” consistently renders the Tetragrammaton. The footnote gives natural alternatives for the sacrificial verb.
  issues:
  - severity: medium
    issue: Repeated “వారు” creates avoidable referential ambiguity.
    rationale: In the verse’s context, the final prohibition concerns priests, while the relative clause concerns Israelites. The draft’s two identical pronouns, especially with the relative clause inserted between dashes, can lead readers to take Israelites as the ones prohibited from profaning their own holy things.
  - severity: low
    issue: The em-dash parenthesis makes the legal sentence stylistically cumbersome.
    rationale: A straightforward Telugu relative clause is more idiomatic and communicates the syntactic relationship without interrupting the sentence.
  revised_text: ఇశ్రాయేలీయులు యాహ్వేకు పైకెత్తి అర్పించే పవిత్రమైన వాటిని[a] అపవిత్రపరచకూడదు.
  revised_footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు యాహ్వేకు సమర్పించే పవిత్రమైన వాటిని” లేదా “ఇశ్రాయేలీయులు యాహ్వేకు అర్పించే పవిత్రమైన వాటిని.”
    reason: lexical_alternative
  revision_rationale: The revision removes unnecessary pronoun repetition and dash punctuation. It retains the Hebrew sequence of consecrated things belonging to Israel that Israel lifts up/presents to Yahweh, while leaving the main prohibitive subject implicit, as in the Hebrew and as supplied by the immediate priestly context. No theological or interpretive narrowing has been introduced.
