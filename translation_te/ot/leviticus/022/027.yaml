id: LEV.22.27
reference: Leviticus 22:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: te
  text: ఎద్దుగాని, గొర్రెగాని, మేకగాని పుట్టినప్పుడు, అది ఏడు రోజులు తన తల్లి దగ్గర ఉండాలి. ఎనిమిదవ రోజు మొదలుకొని, యాహ్వేకు అగ్నితో అర్పించే అర్పణగా అది అంగీకారయోగ్యమవుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఇక్కడ గోవుల జాతికి చెందిన బలి పశువును సూచించే సాధారణ ఏకవచన పదంగా వాడబడింది; సందర్భంలో లింగాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: כֶשֶׂב
  choice: గొర్రె
  rationale: ఇది తప్పనిసరిగా చిన్న గొర్రెపిల్లను మాత్రమే సూచించదు; బలికి తగిన జంతు వర్గాన్ని సూచిస్తున్నందున విస్తృతమైన ‘గొర్రె’ సరిపోతుంది.
- source_word: עֵז
  choice: మేక
  rationale: వ్యాకరణపరంగా స్త్రీలింగ రూపమైనా, ఇక్కడ జాతి వర్గాన్ని సూచిస్తుంది; అందువల్ల లింగాన్ని ప్రత్యేకంగా పేర్కొనలేదు.
- source_word: כִּי יִוָּלֵד
  choice: పుట్టినప్పుడు
  rationale: న్యాయపరమైన సందర్భంలో כִּי ఒక పరిస్థితిని పరిచయం చేస్తుంది; నిఫాల్ రూపం సహజంగా ‘పుట్టినప్పుడు’ అని అనువదించబడుతుంది.
- source_word: וְהָיָה ... תַּחַת אִמּוֹ
  choice: తన తల్లి దగ్గర ఉండాలి
  rationale: తַּחַת అక్షరార్థంగా ‘కింద’ అయినప్పటికీ, అప్పుడే పుట్టిన జంతువు విషయంలో తల్లి సంరక్షణలో లేదా తల్లి వద్ద ఉండడాన్ని సూచిస్తుంది; సహజ తెలుగు కోసం ‘దగ్గర’ వాడబడింది.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: ఎనిమిదవ రోజు మొదలుకొని
  rationale: అంగీకారయోగ్యత ప్రారంభమయ్యే కాలబిందువును సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֵרָצֶה
  choice: అంగీకరించబడుతుంది
  rationale: ఇక్కడ బలిగా దేవుని ఆమోదం పొందడాన్ని సూచించే నిఫాల్ రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: అగ్నితో అర్పించే అర్పణగా
  rationale: קָרְבָּן యొక్క సాధారణ ‘అర్పణ’ భావాన్ని, אִשֶּׁהలోని అగ్నితో సమర్పించే బలి భావాన్ని రెండింటినీ నిలుపుతుంది; వివాదాస్పదమైన ‘ఆహార అర్పణ’ భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ యొక్క దిశార్థాన్ని ‘-కు’తో తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠ్యంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా తెలిసిన రూపాన్ని ఎంచుకున్నాం.
- issue: אִשֶּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ; దహనార్పణ
  rationale: ఈ పదం అగ్నితో సమర్పించబడే అర్పణను సూచిస్తుంది. ‘ఆహార అర్పణ’ అనేది సాధ్యమైన వివరణాత్మక భావమైనా వివాదరహితం కాదు; ‘దహనార్పణ’ అయితే ఒక నిర్దిష్ట బలి రకాన్ని తప్పుగా సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిధి శైలి వాడబడింది. జంతువుల జాబితాలో ‘-గాని’ నిర్మాణం మూలంలోని ప్రత్యామ్నాయ వర్గాలను స్పష్టంగా చూపుతుంది. మూలంలోని ‘తల్లి కింద’ అనే చిత్రాన్ని పదక్షరంగా కాక, సందర్భానుగుణంగా ‘తల్లి దగ్గర’గా తెలిపాం.
