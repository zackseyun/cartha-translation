lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవవాక్యాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; తరువాతి לֵאמֹר భావాన్ని ‘ఇలా’ ద్వారా కలిపి అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసి సంభాషణ లక్ష్యాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడ్డ లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యవిషయాన్ని సహజ తెలుగులో పరిచయం చేస్తుంది; ‘చెబుతూ’ అనే కృత్రిమ పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది. ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయదు; ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. హీబ్రూ ‘మాట్లాడి, చెబుతూ’ సూత్రాన్ని పదేపదే అనుకరించకుండా ‘ఇలా అన్నాడు’గా సమగ్రంగా అందించింది.
