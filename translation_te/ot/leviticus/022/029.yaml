  revision_rationale: The revision makes only safe stylistic and syntactic adjustments. It retains the repeated Hebrew sacrificial action (‘అర్పించినప్పుడు’ / ‘అర్పించాలి’), preserves the divine name, and renders לִרְצֹנְכֶם with the natural Telugu expression for the offerers’ acceptance, without specifying a theological mechanism not stated in the source.
