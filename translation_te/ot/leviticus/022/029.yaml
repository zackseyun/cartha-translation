id: LEV.22.29
reference: Leviticus 22:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי תִזְבְּח֥וּ זֶֽבַח תּוֹדָ֖ה לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: te
  text: మీరు యాహ్వేకు కృతజ్ఞతా బలిని[a] అర్పించినప్పుడు, మీరు అంగీకరింపబడేలా దానిని అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కృతజ్ఞతార్పణ బలిని’ లేదా ‘కృతజ్ఞతా బలిని.’
    reason: זֶבַח תּוֹדָה అనే పదబంధానికి సాధ్యమైన సమానార్థక అనువాదాలను సూచించడానికి.
lexical_decisions:
- source_word: וְ/כִי
  choice: మీరు … అర్పించినప్పుడు
  rationale: న్యాయసంబంధమైన ఈ ఆదేశంలో וְכִי షరతు-కాల భావాన్ని కలిగి ఉంది. తెలుగు వాక్యప్రవాహంలో ‘అర్పించినప్పుడు’ సహజంగా ఉండి, ఆ ఆచరణను కేవలం ఊహాత్మకమైనదిగా చూపదు.
- source_word: תִזְבְּחוּ / תִּזְבָּחוּ
  choice: అర్పించినప్పుడు / అర్పించాలి
  rationale: זבח బలి అర్పణకు వాడే క్రియ. తెలుగులో ‘బలి అర్పించు’ సహజమైన ఆరాధనా ప్రయోగం. హీబ్రూలోని క్రియ పునరుక్తిని తెలుగు వాక్యంలో రెండు క్రియారూపాలతో నిలిపాం.
- source_word: זֶבַח תּוֹדָה
  choice: కృతజ్ఞతాబలి
  rationale: ఈ నిర్మాణం కృతజ్ఞతను వ్యక్తం చేసే ప్రత్యేక బలిని సూచిస్తుంది. ‘కృతజ్ఞతాబలి’ సంక్షిప్తంగా, సహజంగా ఉండి బలి వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַ/יהוָה
  choice: యాహ్వేకు
  rationale: లామెద్ అర్పణ ఎవరికి సమర్పించబడుతుందో సూచిస్తుంది. יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: לִ/רְצֹנְ/כֶם
  choice: అది మీ పక్షంగా అంగీకరించబడేలా
  rationale: బలి సందర్భంలో רָצוֹן ప్రధానంగా అంగీకారయోగ్యతను సూచిస్తుంది; అర్పించేవారి వ్యక్తిగత ఇష్టాన్ని కాదు. ‘మీ పక్షంగా’ అనే మాట כֶם సంబంధాన్ని తెలిపి, దేవుని అంగీకారం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని ప్రత్యక్షంగా నిలిపేందుకు ‘యాహ్వే’ అనే సమీప లిప్యంతరీకరణను వాడాం; దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు.
- issue: לִרְצֹנְכֶם యొక్క భావం
  choice: అది మీ పక్షంగా అంగీకరించబడేలా
  alternative: మీ ఇష్టప్రకారం / మీ అంగీకారం కోసం
  rationale: లేవీయకాండంలోని బలి సందర్భంలో ఈ పదబంధం బలి దేవునిచేత అంగీకరించబడటాన్ని సూచిస్తుంది. అయినప్పటికీ మూలంలోని సంక్షిప్తతను విపరీతంగా విస్తరించకుండా ఫలితభావంతో అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘అర్పించాలి’ ఆజ్ఞార్థాన్ని సహజంగా తెలియజేస్తుంది; బలి సంబంధిత పరిభాషను అవసరమైనంత మాత్రమే ఉంచాం.
