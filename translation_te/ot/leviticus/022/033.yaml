  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: te
  text: మీకు దేవుడిగా ఉండటానికి మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినవాడిని నేను యహ్వేను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యహ్వే’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామానికి సంబంధించిన హెబ్రీ అక్షరరూపం, సంప్రదాయ అనువాదం, మరియు లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: బయటకు తీసుకొచ్చి
  rationale: יצא ధాతువు హిఫీల్ కృదంత రూపం దేవుని గత కార్యాన్ని వర్ణిస్తోంది. ముందున్న వాక్యంతో భావసంబంధాన్ని నిలుపుతూ, తెలుగులో సహజంగా సంయుక్త క్రియారూపంలో అనువదించబడింది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన ద్వితీయ పురుష బహువచన ప్రత్యయం; తెలుగు బహువచన కర్మరూపం మూలంలోని సంఖ్యను స్పష్టంగా నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: నిర్గమ నిబంధన సూత్రంలోని ‘ఐగుప్తు దేశం’ అనే పూర్తి వ్యక్తీకరణను నిలుపుతుంది.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉన్నవాడిని
  rationale: היה + ל covenant formula లోని సంబంధార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఉద్దేశాన్ని తెలిపే לִהְיוֹת భావం ముందున్న ‘బయటకు తీసుకొచ్చి’తో అనుసంధానమై ఉంది.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: క్రియలేని హెబ్రీ గుర్తింపు వాక్యాన్ని సహజమైన తెలుగు విధేయ రూపంలో అందించి, దైవనామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో నిలుపుతుంది; పాదసూచికలో మూల అక్షరరూపం మరియు ప్రత్యామ్నాయ సంప్రదాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఐగుప్తు దేశం’ అనే పంచగ్రంథీయ నిర్గమ సూత్రాన్ని నిలుపుతూ, ద్వితీయ పురుష బహువచనాన్ని స్పష్టంగా వ్యక్తం చేసింది.
