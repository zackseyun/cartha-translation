source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: te
  text: చనిపోయిన జంతువునుగానీ, క్రూరమృగాలు చీల్చిన జంతువునుగానీ[a] అతడు తినకూడదు; తద్వారా అతడు అపవిత్రుడు కాకూడదు. నేను యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనంతట తానే చనిపోయినదానినిగానీ, క్రూరమృగాలు చీల్చినదానినిగానీ.”
    reason: నְבֵלָה అనేది సాధారణంగా సరైన విధంగా వధించబడకుండా చనిపోయిన జంతువు లేదా దాని కళేబరాన్ని సూచిస్తుంది; సందర్భానుసారం ‘తనంతట తానే చనిపోయినది’ అనే మరింత నిర్దిష్ట భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: נְבֵלָה
  choice: చచ్చిపోయిన జంతువు
  rationale: ఈ పదం సాధారణంగా విధిగా వధించబడకుండా సహజంగా లేదా ఇతర కారణంతో చనిపోయిన జంతువు కళేబరాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో అర్థమయ్యేలా ‘చచ్చిపోయిన జంతువు’ అని అనువదించాం.
- source_word: וּטְרֵפָה
  choice: క్రూరమృగాలు చీల్చిన జంతువు
  rationale: ఈ పదం మృగాల దాడిలో చీల్చబడిన జంతువును సూచిస్తుంది. హీబ్రూలో అంతర్లీనంగా ఉన్న దాడిచేసిన మృగాల భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יֹאכַל
  choice: అతడు తినకూడదు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియ న్యాయవాక్యంలో ఆజ్ఞాత్మక నిషేధాన్ని తెలియజేస్తుంది; ‘తినకూడదు’ ఆధునిక తెలుగు న్యాయ-ఆజ్ఞా శైలికి సహజం.
- source_word: לְטָמְאָה בָהּ
  choice: దానివల్ల అతడు అపవిత్రుడు అవుతాడు
  rationale: ל తో కూడిన క్రియానామం ఉద్దేశం లేదా ఫలితాన్ని సూచించవచ్చు. ఇక్కడ తినడం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తూ మూలంలోని స్వల్ప ఉద్దేశం/ఫలితం సందిగ్ధతను అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: אֲנִי יְהוָה
  choice: నేను యెహోవాను
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యేక నామంగా ఉంచాం.
- issue: לְטָמְאָה בָהּ లో ఉద్దేశం లేదా ఫలితం
  choice: దానివల్ల అతడు అపవిత్రుడు అవుతాడు
  alternative: దానివల్ల తనను అపవిత్రపరచుకోవడానికి
  rationale: సందర్భంలో నిషేధిత మాంసం తినడం అపవిత్రతకు దారితీసే ఫలితమే ప్రధానంగా కనిపిస్తుంది. అయినా హీబ్రూ నిర్మాణం ఉద్దేశం/ఫలితం రెండింటినీ అనుమతిస్తుంది; తెలుగు వాక్యం అనవసరంగా ఉద్దేశపూర్వక స్వీయ-అపవిత్రతను ఆరోపించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ఆజ్ఞా శైలి వాడబడింది. ‘అపవిత్రుడు’ అనే పదం లేవీయకాండంలోని ఆచారపరమైన శుద్ధి-అశుద్ధి భావాన్ని కాపాడుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
