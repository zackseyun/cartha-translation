language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: te
  text: '“వారితో చెప్పు: ‘మీ తరతరాల్లో, మీ సంతానంలో ఎవడైనా ఇశ్రాయేలీయులు యాహ్వేకు ప్రతిష్ఠించే పరిశుద్ధమైన వాటిని తన అపవిత్రత తన మీద ఉండగా సమీపిస్తే, ఆ వ్యక్తి నా సన్నిధి నుండి కొట్టివేయబడును.[a] నేను యాహ్వేను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొట్టివేయబడును’ అనేది నిబంధన సంబంధమైన ప్రామాణిక శిక్షాసూత్రం; అది ఏ విధంగా అమలవుతుందో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: వారితో ఇలా చెప్పు
  rationale: మోషేను ఉద్దేశించిన ఏకవచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగు శైలిలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల్లో
  rationale: తరతరాలపాటు వర్తించే నిబంధనాత్మక-న్యాయపరమైన సూత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: మీ సంతానంలో ఎవడైనా
  rationale: సందర్భంలో అహరోను వంశానికి చెందిన పురుషుని గురించిన న్యాయవిధి కావడంతో మూలంలోని పుంలింగ రూపాన్ని నిలుపుతూ, זרע యొక్క వంశార్థాన్ని ‘సంతానం’తో తెలియజేస్తుంది.
- source_word: יִקְרַב
  choice: దగ్గరికి ... వస్తే
  rationale: యాజక సంబంధ సందర్భంలోని పవిత్ర వస్తువులను సమీపించే క్రియను అతి వివరణ లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַקֳּדָשִׁים
  choice: పరిశుద్ధమైన వాటి
  rationale: ఇది ప్రతిష్ఠిత అర్పణలు లేదా పవిత్ర వస్తువులను సూచించగల విస్తృత బహువచనం; ‘అర్పణలు’ అని మాత్రమే పరిమితం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: יַקְדִּישׁוּ
  choice: ప్రతిష్ఠించే
  rationale: హిఫిల్ రూపంలోని పవిత్రంగా ప్రత్యేకించడం లేదా అంకితం చేయడం అనే ఆరాధనా భావాన్ని తెలుగులో సముచితంగా అందిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హెబ్రీ జాతి-సముదాయ నామానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: לַיהוָה / יְהוָה
  choice: యెహోవాకు / యెహోవాను
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: తన అపవిత్రత ఇంకా తన మీద ఉండగానే
  rationale: కేవలం ‘అపవిత్రుడై ఉండగా’ అని సాఫీ చేయకుండా, అపవిత్రత అతని మీద ఉందనే మూలభాషా ఆచారస్థితి చిత్రణను నిలుపుతుంది.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִלְּפָנַי
  choice: ఆ వ్యక్తి నా సన్నిధి నుండి తొలగించబడాలి
  rationale: נפש ను న్యాయసూత్రంలో ‘వ్యక్తి’గా సహజంగా అనువదించి, כרת యొక్క తొలగింపు భావాన్ని కాపాడుతుంది; శిక్ష అమలు విధానాన్ని ప్రధాన వాక్యంలో నిర్దిష్టం చేయదు.
theological_decisions:
- issue: וְנִכְרְתָה అనే నిబంధనాత్మక శిక్షాసూత్రం యొక్క ఖచ్చితమైన భావం
  choice: ‘తొలగించబడాలి’ అని అనువదించి శిక్ష విధానాన్ని నిర్దిష్టం చేయలేదు.
  alternative: ‘నరికివేయబడాలి,’ ‘సమాజం నుండి వెలివేయబడాలి,’ లేదా ‘చంపబడాలి.’
  rationale: ఈ నిఫల్ సూత్రం మరణం, దైవిక నిర్మూలన, లేదా సమాజం నుండి బహిష్కరణలో ఏదో ఒకదాన్ని సూచిస్తుందా అన్నది వివాదాస్పదం. వచనం స్వయంగా విధానాన్ని నిర్వచించనందున ఆ సందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
- issue: מִלְּפָנַי యొక్క పరిధి
  choice: ‘నా సన్నిధి నుండి’ అని స్పష్టంగా అనువదించింది.
  alternative: ‘నా ఎదుట నుండి’ లేదా కేవలం శిక్షాసూత్రంలో కలిపి ‘నా నుండి తొలగించబడాలి.’
  rationale: దైవసన్నిధి నుండి తొలగింపనే మూలపదబంధాన్ని ప్రత్యేకంగా నిలుపుతూ, దాని ఆధ్యాత్మిక లేదా సామాజిక పరిధిని మరింతగా నిర్వచించదు.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే లేదా ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న నిబంధన దైవనామాన్ని పేరుగానే ఉంచి, బిరుదుతో భర్తీ చేయలేదు; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఆరాధనా శైలిని ఉపయోగించాం. ‘పరిశుద్ధమైన వాటి,’ ‘ప్రతిష్ఠించే,’ ‘అపవిత్రత తన మీద’ వంటి పదబంధాలు యాజక సంబంధ భావాన్ని నిలుపుతాయి; అదే సమయంలో వాక్యం సాధారణ పాఠకుడికి అర్థమయ్యేలా నిర్మించబడింది.
