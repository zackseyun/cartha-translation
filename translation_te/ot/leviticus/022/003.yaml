- from: '“వారితో ఇలా చెప్పు: ‘మీ తరతరాల్లో, మీ సంతానంలో ఎవడైనా ఇశ్రాయేలీయులు యెహోవాకు ప్రతిష్ఠించే పరిశుద్ధమైన వాటి దగ్గరికి, తన అపవిత్రత ఇంకా తన మీద ఉండగానే వస్తే, ఆ వ్యక్తి నా సన్నిధి నుండి తొలగించబడాలి.[a] నేను యెహోవాను.’”'
