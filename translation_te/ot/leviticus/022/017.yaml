  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; దీనిని ‘యాహ్వే’ అని, ప్రత్యామ్నాయంగా ‘యెహోవా’ అని లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అనే క్రియ ఇక్కడ కొత్త దైవవాక్యాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యప్రయోగంలో ‘మోషేతో ఇలా అన్నాడు’ అనేది సహజంగా ఉండి, తరువాతి వచనంలో మాట కొనసాగుతుందని స్పష్టపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో సూచించే אֶל ను సహజమైన తెలుగు సంభాషణ నిర్మాణంలో ‘తో’గా అనువదించాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రామాణికంగా వాడే ‘మోషే’ రూపంలో లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా ‘ఇలా అన్నాడు’ అని వ్యక్తం చేశాం; తరువాతి వచనంలో సందేశం వస్తుందని ఇది సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఉచ్చారణపై నిర్ధారణ లేనందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ సూత్రప్రయోగాన్ని పదేపదే కాకుండా అర్థసమానంగా ‘మోషేతో ఇలా అన్నాడు’ అని అందించాం.
