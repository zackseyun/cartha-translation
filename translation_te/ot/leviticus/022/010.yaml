review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes that זָר is an unauthorized person in this cultic context, and that קֹדֶשׁ refers concretely to priestly sacred food. However, “కూలికి పనిచేసేవాడు” means someone who works for a laborer, not a wage-hired worker (שָׂכִיר). The rendering of תּוֹשַׁב as “పరదేశి” introduces an avoidable ethnic/foreignness implication not required by the term in this context.
  naturalness: The prohibition is natural Telugu, but “కూలికి పనిచేసేవాడు” is semantically and idiomatically unsuitable. “యాజకుని వద్ద నివసించే వాడు” is clear and preserves household association without over-specifying the person as a foreigner.
  terminology: Use “అనధికార వ్యక్తి” for זָר, “పవిత్రమైన ఆహారం” for the contextual referent of קֹדֶשׁ (with the literal singular in a footnote), “యాజకుని వద్ద నివసించే వాడు” for תּוֹשַׁב כֹּהֵן, and “వేతనానికి నియమించబడిన పనివాడు” for שָׂכִיר.
  issues:
  - severity: high
    issue: “కూలికి పనిచేసేవాడు” mistranslates שָׂכִיר.
    rationale: The Hebrew denotes a person hired for wages. The Telugu phrase literally describes a person working for a wage laborer, reversing or obscuring the employment relationship.
  - severity: medium
    issue: “పరదేశి” over-specifies תּוֹשַׁב.
    rationale: In this construction, the term identifies a non-family resident/dependent attached to a priest's household. It need not denote an ethnically foreign person; “పరదేశి” can mislead readers in that direction.
  revised_text: అనధికార వ్యక్తి ఎవరూ పవిత్రమైన ఆహారాన్ని[a] తినకూడదు. యాజకుని వద్ద నివసించే వాడైనా[b], వేతనానికి నియమించబడిన పనివాడైనా పవిత్రమైన ఆహారాన్ని తినకూడదు.
