source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: te
  text: అనధికార వ్యక్తి ఎవరూ పవిత్రమైన ఆహారాన్ని[a] తినకూడదు. యాజకుని వద్ద నివసించే వాడైనా[b], వేతనానికి నియమించబడిన పనివాడైనా పవిత్రమైన ఆహారాన్ని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పవిత్రమైనది.” ఇక్కడ ఈ ఏకవచన పదం యాజకులు తినడానికి కేటాయించిన అర్పణల పవిత్ర ఆహార భాగాన్ని సూచిస్తుంది. “పవిత్ర ఆహారం” లేదా “పవిత్ర భాగం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాట యాజకుని కుటుంబసభ్యుడు కాకపోయినా అతని గృహంతో అనుబంధమై అక్కడ నివసించే వ్యక్తిని సూచిస్తుంది. “యాజకుని నివాసి” లేదా “యాజకుని వద్ద తాత్కాలికంగా నివసించే వాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: అధికారంలేని ఎవరూ
  rationale: ఈ యాజక సంబంధ సందర్భంలో ఇది జాతిపరంగా విదేశీయుణ్ణి మాత్రమే సూచించదు; ప్రతిష్ఠిత ఆహారాన్ని తినే అధికారం లేని వ్యక్తిని సూచిస్తుంది. అందువల్ల సందర్భార్థాన్ని స్పష్టంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: קֹדֶשׁ
  choice: ప్రతిష్ఠితమైన ఆహారం
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘పవిత్రమైనది’; ఇక్కడ యాజకులు తినడానికి కేటాయించిన అర్పణల ఆహార భాగాన్ని సూచిస్తుంది. సహజమైన తెలుగుకోసం సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: యాజకుని వద్ద నివసించే పరదేశి
  rationale: యాజకుని కుటుంబానికి స్వజనుడు కాకపోయినా అతని గృహంతో అనుబంధమై నివసించే వ్యక్తి అనే భావాన్ని ఇది కాపాడుతుంది; కూలికి పనిచేసేవాడితో ఉన్న భేదం కూడా నిలుస్తుంది.
- source_word: שָׂכִיר
  choice: కూలికి పనిచేసేవాడు
  rationale: వేతనం కోసం నియమించబడిన పనివాణ్ణి ఆధునిక, సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא יֹאכַל
  choice: తినకూడదు
  rationale: నిషేధాన్ని తెలిపే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు ధర్మశాసన రూపం.
- source_word: וְכָל
  choice: ఎవరూ
  rationale: తదనంతర నిషేధంతో కలిసి ‘ఒక్క అధికారంలేని వ్యక్తి కూడా తినకూడదు’ అనే సమగ్ర నిషేధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
