translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాసనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకునికి స్పష్టంగానూ రూపొందించబడింది. ‘ప్రతిష్ఠితమైన ఆహారం’ సందర్భాన్ని స్పష్టం చేస్తుండగా మూలంలోని ఏకవచన ‘పవిత్రమైనది’ పాదసూచికలో భద్రపరచబడింది.
