source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: te
  text: '“అహరోనుతో, అతని కుమారులతో, ఇశ్రాయేలు కుమారులందరితో[a] ఇలా చెప్పు: ‘ఇశ్రాయేలు ఇంటివారిలో ఎవరైనా, లేదా ఇశ్రాయేలులో నివసించే పరదేశిలో ఎవరైనా, తన మొక్కుబడులలో దేనికోసమైనా లేదా తన స్వచ్ఛంద అర్పణలలో దేనికోసమైనా యెహోవాకు దహనబలిగా అర్పించే అర్పణను తీసుకువస్తే—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరితో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులందరితో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: ఇలా చెప్పు
  rationale: దైవిక ఆజ్ఞను పరిచయం చేసే పీయేల్ ఆజ్ఞార్థక రూపం. తెలుగు న్యాయ-ఆజ్ఞా సందర్భంలో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం నిర్దిష్టంగా పురుష బహువచనం; యాజక సందర్భంలో అహరోను కుమారులనే సూచిస్తుంది.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరు
  rationale: మూలంలోని బంధుత్వ భాషను నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయం ‘ఇశ్రాయేలీయులందరు’ అని పాదటీపులో ఇచ్చాం.
- source_word: אִישׁ אִישׁ
  choice: ఎవరైనా
  rationale: పునరుక్త ఏకవచనం పంపిణీ భావంతో ‘ప్రతి వ్యక్తి/ఎవరైనా’ అని అర్థం. తెలుగులో ‘ఎవరైనా’ సహజంగా ఈ విస్తృత న్యాయార్థాన్ని తెలియజేస్తుంది.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారిలో
  rationale: ఒడంబడిక సమాజాన్ని సూచించే ‘ఇశ్రాయేలు ఇల్లు’ అనే రూపకాన్ని తెలుగు వాడుకకు తగిన విధంగా నిలుపుతుంది.
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో నివసిస్తున్న పరదేశులు
  rationale: గేర్ అనేది ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తిని సూచిస్తుంది; ‘నివసిస్తున్న పరదేశులు’ న్యాయ-సామాజిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: అర్పణను తీసుకువస్తే
  rationale: హిఫీల్ קרב బలిసందర్భంలో దేవుని సన్నిధికి అర్పణను తీసుకురావడం/సమర్పించడం. తెలుగు వాక్యంలో ‘తీసుకువస్తే’ పునరుక్తిని తగ్గిస్తూ ఆ భావాన్ని అందిస్తుంది.
- source_word: לְכָל נִדְרֵיהֶם
  choice: తమ మొక్కుబడులన్నిటి నిమిత్తం
  rationale: మొక్కుబడులకు సంబంధించిన అర్పణల భావాన్ని మూల నిర్మాణానికి దగ్గరగా ఉంచుతుంది; మరింత నిర్దిష్టమైన అర్థాన్ని పాదటీపులో సూచించాం.
- source_word: נִדְבוֹתָם
  choice: తమ స్వచ్ఛంద అర్పణలు
  rationale: లేవీయకాండంలోని ప్రత్యేక బలి వర్గాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: టెట్రాగ్రామటన్‌ను తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా ఇస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: עֹלָה అనే సంపూర్ణంగా దహించబడే బలి వర్గానికి తెలుగు బైబిలు పరిభాషలో స్థిరమైన పదం.
theological_decisions:
- issue: న్యాయ ఆదేశంలోని אִישׁ אִישׁ యొక్క పురుష ఏకవచన రూపం
  choice: ఎవరైనా
  alternative: ఏ పురుషుడైనా
  rationale: ఇక్కడ పునరుక్తి పంపిణీ న్యాయార్థాన్ని ఇస్తుంది. తెలుగులో ‘ఎవరైనా’ మూలం యొక్క వర్తింపు పరిధిని సహజంగా తెలియజేస్తుంది; లింగాన్ని అనవసరంగా విస్తరించడం లేదా పరిమితం చేయడం లేదు.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: נדרים పదం మొక్కుబడులనేనా లేక మొక్కుబడి అర్పణలనేనా సూచిస్తుంది
  choice: మొక్కుబడులన్నిటి నిమిత్తం
  alternative: మొక్కుబడి అర్పణలన్నిటి నిమిత్తం
  rationale: మూలం సంక్షిప్తంగా ‘వారి మొక్కుబడులన్నిటికోసం’ అని ఉంది. సందర్భం అర్పణలను సూచించినా, ప్రధాన పాఠంలో ఆ నిర్దిష్టతను చేర్చకుండా అస్పష్టతను నిలిపి, ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేవీయకాండ న్యాయ-ఆరాధనా సందర్భానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ఈ వచనం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది.
