  rationale: The revision makes Aaron and his sons—the intended recipients and subject of the required action—unambiguously the addressees through ‘మీరు.’ It retains the source’s broad expression for holy things and its connection between Israel's consecration of them and the holiness of Yahweh's name. Footnote c has been relocated to its actual referent.
