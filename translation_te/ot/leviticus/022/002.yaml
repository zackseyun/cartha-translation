source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: te
  text: 'అహరోనుతోను అతని కుమారులతోను ఇలా చెప్పు: “ఇశ్రాయేలు ప్రజలు[b] నాకు ప్రతిష్ఠించే[c] పవిత్రమైన వాటి నుండి మీరు దూరంగా ఉండాలి[a]; నా పవిత్ర నామాన్ని అపవిత్రపరచకూడదు. నేను యెహోవాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూరంగా ఉండాలి’ అనే మాటను ‘తమను తాము వేరుగా ఉంచుకోవాలి’ లేదా ‘వాటిని ముట్టుకోకుండా మానుకోవాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ జాతీయ పదబంధం.
    reason: lexical_alternative
  - marker: c
    text: ‘నాకు ప్రతిష్ఠించే’ అనే సంబంధవాక్యం ప్రధానంగా ఇశ్రాయేలు ప్రజలు యెహోవాకు అంకితం చేసే పవిత్రమైన వాటినే సూచిస్తుంది; వాటిని అపవిత్రంగా వాడడం దేవుని పవిత్ర నామాన్ని అపవిత్రపరుస్తుంది.
    reason: referent_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: ఇలా చెప్పు
  rationale: దైవ ఆదేశాన్ని పరిచయం చేసే పీయేల్ ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְיִנָּזְרוּ
  choice: వారు దూరంగా ఉండాలి
  rationale: నిఫాల్ రూపంలోని వేరుగా ఉండడం లేదా మానుకోవడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో అనర్హ స్థితిలో పవిత్ర వస్తువులతో వ్యవహరించకుండా ఉండడాన్ని సూచిస్తుంది.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు ... ప్రతిష్ఠించే పవిత్రమైన వాటి నుంచి
  rationale: קָדְשֵׁי అనే విస్తృత ఆరాధనా పదాన్ని కేవలం ‘అర్పణలు’ అని కుదించకుండా ‘పవిత్రమైనవి’గా ఉంచుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ జాతీయ సమూహపదానికి ఆధునిక తెలుగులో సహజంగా, అందరినీ సూచించే రూపం; పదశః రూపాన్ని పాదటిప్పణిలో నమోదు చేశాం.
- source_word: יְחַלְּלוּ
  choice: అపవిత్రపరచకూడదు
  rationale: పవిత్రమైనదాన్ని సామాన్యంగా లేదా అవమానకరంగా చేయడం అనే పీయేల్ భావాన్ని గంభీరమైన, సులభగ్రాహ్యమైన తెలుగులో అందిస్తుంది.
- source_word: שֵׁם קָדְשִׁי
  choice: నా పవిత్ర నామం
  rationale: మూలంలోని నిర్మాణాన్ని సహజమైన తెలుగు పదబంధంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: నాకు ప్రతిష్ఠించే
  rationale: మూలంలోని పవిత్రతకు సంబంధించిన పదసంబంధాన్ని నిలుపుతూ, ఆ వస్తువులను దేవునికి ప్రత్యేకంగా అంకితం చేయడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: ‘వారు నాకు ప్రతిష్ఠించేవి’ అనే సంబంధవాక్యానికి పూర్వపదం
  choice: అది ఇశ్రాయేలు ప్రజల ‘పవిత్రమైన వాటిని’ సూచించేలా వాక్యాన్ని నిర్మించాం.
  alternative: ప్రవాహంలో అది ‘నా పవిత్ర నామం’తో సడలుగా అనుసంధానమైందని చదవవచ్చు.
  rationale: వాక్యనిర్మాణం, బహువచన కర్త, యాజక సంబంధ సందర్భం ఇవన్నీ ప్రజలు దేవునికి ప్రతిష్ఠించే పవిత్ర వస్తువులనే ప్రధానంగా సూచిస్తున్నాయి. అయినప్పటికీ మూలంలోని సమీప పదబంధం వల్ల కలిగే స్వల్ప సందిగ్ధతను పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘పవిత్రమైన వాటి’ అనే విస్తృత పదబంధం మూలంలోని ఆరాధనా పరిధిని కాపాడుతుంది; ‘ఇశ్రాయేలు ప్రజలు’ సహజమైన జాతీయ సమూహ సూచన.
