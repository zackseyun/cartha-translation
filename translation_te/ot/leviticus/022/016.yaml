review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly turns the affirmative Hebrew clause וְהִשִּׂיאוּ ('and they cause/make ... bear') into a prohibition ('మోపకూడదు,' 'must not impose'). Although the preceding verse contains a prohibition, v. 16 itself states its resulting consequence and should not import a negation into this verse. The revised wording retains the Hebrew's deliberately compact, context-dependent pronoun references.
  naturalness: 'The revised Telugu is modern, clear, and suitably formal for Leviticus. It also corrects the final copular expression: ''నేను యెహోవాను'' naturally renders ''I am Yahweh.'''
  terminology: ‘పరిహారం చెల్లించవలసిన అపరాధభారం’ communicates the cultic-juridical force of עֲוֺן אַשְׁמָה without identifying it narrowly with one particular ritual. ‘పవిత్రమైనవి’ is a more direct and idiomatic equivalent for קדשים than ‘ప్రతిష్ఠితమైనవి,’ while the note supplies the offering-related context. ‘పవిత్రపరచే’ appropriately retains the קדשׁ terminology.
  issues:
  - severity: high
    issue: The main clause has been made negative.
    rationale: ‘మోపకూడదు’ means ‘must not impose,’ but וְהִשִּׂיאוּ is affirmative, ‘and they cause [them] to bear.’ This changes the verse's stated consequence.
  - severity: medium
    issue: The final identification is unidiomatic and grammatically displaced.
    rationale: ‘యెహోవాను నేనే’ does not naturally express ‘I am Yahweh.’ Telugu requires ‘నేను యెహోవాను,’ with optional emphasis placed naturally as ‘నేనే యెహోవాను.’
