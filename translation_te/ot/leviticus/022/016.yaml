revisions:
- from: వారు తమ ప్రతిష్ఠితమైన వాటిని తినడం వల్ల, పరిహారం చెల్లించవలసిన అపరాధాన్ని వారిపై మోపకూడదు[a][b]. ఎందుకంటే వారిని పవిత్రపరచే యెహోవాను నేనే[c].
  to: వారు తమ పవిత్రమైన వాటిని తినడం ద్వారా వారిని పరిహారం చెల్లించవలసిన అపరాధభారాన్ని మోయేలా చేస్తారు[a][b]; ఎందుకంటే వారిని పవిత్రపరచేవాడను నేను యెహోవాను[c].
  rationale: The revision restores the affirmative causative force of the Hebrew verb, rather than carrying the prior verse's negation into v. 16. It preserves the ambiguous contextual pronouns (‘వారు ... వారిని’) instead of prematurely specifying priests or lay Israelites. The cultic liability is rendered as an ‘అపరాధభారం’ requiring restitution, and the divine self-identification is corrected to idiomatic Telugu. Footnote markers remain attached to their corresponding lexical issues.
  reviewer_model: gpt-5.6-terra
