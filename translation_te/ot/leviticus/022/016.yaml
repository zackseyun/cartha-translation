source:
  edition: WLC
  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: te
  text: వారు తమ పవిత్రమైన వాటిని తినడం ద్వారా వారిని పరిహారం చెల్లించవలసిన అపరాధభారాన్ని మోయేలా చేస్తారు[a][b]; ఎందుకంటే వారిని పవిత్రపరచేవాడను నేను యెహోవాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిపై అపరాధభారాన్ని రప్పిస్తారు” లేదా “వారిని అపరాధభారం మోయేలా చేస్తారు.” హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది; అది అపరాధానికి సంబంధించిన బాధ్యతను నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “తమ పవిత్రమైనవి” అంటే దేవునికి ప్రతిష్ఠించిన అర్పణలు లేదా వాటి పవిత్ర భాగాలు.
    reason: cultural_note
  - marker: c
    text: “పవిత్రపరచేవాడు” అనే మాటను “పవిత్రులుగా చేసేవాడు” లేదా “ప్రతిష్ఠించేవాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: వారిపై మోపకూడదు
  rationale: హిఫిల్ రూపం ‘మోయడానికి కారణమవడం/వారిపైకి తేవడం’ అనే కారణార్థాన్ని ఇస్తుంది. మునుపటి నిషేధంతో వాక్యనిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో కొనసాగించేందుకు నిషేధార్థక రూపం వాడబడింది.
- source_word: עֲוֺן אַשְׁמָה
  choice: పరిహారం చెల్లించవలసిన అపరాధం
  rationale: ఈ పదబంధం సాధారణ దోషభావం మాత్రమే కాక, ఆరాధన సంబంధమైన అపరాధం వల్ల కలిగే బాధ్యతను సూచిస్తుంది. ‘పరిహారం చెల్లించవలసిన’ అనేది దాని న్యాయ-ఆరాధన భావాన్ని తెలియజేస్తుంది.
- source_word: בְּאָכְלָם
  choice: తినడం వల్ల
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ సందర్భం లేదా కారణాన్ని సూచిస్తుంది; తెలుగులో ‘తినడం వల్ల’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: קָדְשֵׁיהֶם
  choice: తమ ప్రతిష్ఠితమైన వాటిని
  rationale: అక్షరార్థంగా ‘వారి పవిత్ర వస్తువులు’. సందర్భంలో దేవునికి ప్రతిష్ఠించిన అర్పణలు లేదా వాటి పవిత్ర భాగాలు ఉద్దేశించబడ్డాయి; ప్రధాన పాఠం మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచుతుంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: מְקַדְּשָׁם
  choice: వారిని పవిత్రపరచే
  rationale: קדשׁ పియేల్ కృదంతం ‘పవిత్రపరచు/ప్రతిష్ఠించు’ అనే అర్థం ఇస్తుంది. ‘పవిత్రపరచే’ లేవీయకాండంలోని ఆరాధన-దైవశాస్త్ర స్వరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: చివరి ప్రత్యయంలోని ‘వారిని’ ఎవరిని సూచిస్తుంది?
  choice: యెహోవా సందర్భంలోని యాజకులను/ప్రజలను పవిత్రపరుస్తాడు
  alternative: యెహోవా ప్రతిష్ఠిత వస్తువులను పవిత్రపరుస్తాడు
  rationale: పుంలింగ బహువచన ప్రత్యయం సందర్భంలో ఉన్న మనుషులను సూచించడం సహజం. అయినా ప్రధాన పాఠం ‘వారిని’ అని మాత్రమే ఉంచి, మూలపాఠం అనుమతించే ఉద్రిక్తతను వివరణతో పూర్తిగా తొలగించదు.
- issue: עֲוֺן אַשְׁמָה యొక్క ఆరాధన సంబంధమైన బాధ్యత
  choice: పరిహారం చెల్లించవలసిన అపరాధం
  alternative: అపరాధ దోషం / శిక్షకు పాత్రమైన అపరాధం
  rationale: אַשְׁמָה అపరాధం, దానికి సంబంధించిన బాధ్యత, లేదా పరిహార అర్పణతో ముడిపడిన స్థితిని సూచించగలదు. ఎంచుకున్న పదబంధం ఆ న్యాయ-ఆరాధన భావాన్ని తెలుపుతూ ఒక్క నిర్దిష్ట ఆచార వివరానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రతిష్ఠితమైనవి’ ఆరాధన సందర్భాన్ని తెలియజేస్తూ మూలంలోని ‘పవిత్ర వస్తువులు’ అనే విస్తృతతను నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
