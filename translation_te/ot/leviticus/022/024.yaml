id: LEV.22.24
reference: Leviticus 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: te
  text: వృషణాలు నలిగిన, చితికిన, తెగిన లేదా కోయబడిన జంతువును మీరు యెహోవాకు అర్పించకూడదు; మీ దేశంలో మీరు ఇలా చేయకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעוּךְ
  choice: నలిగినవి
  rationale: ఒత్తిడి వల్ల కలిగిన గాయాన్ని సూచిస్తుంది; తరువాతి పదమైన ‘చితికినవి’తో తేడాను నిలుపుతుంది.
- source_word: כָתוּת
  choice: చితికినవి
  rationale: కొట్టడం లేదా నలగగొట్టడం వల్ల పూర్తిగా దెబ్బతిన్న స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָתוּק
  choice: తెగినవి
  rationale: లాగడం వల్ల విడిపోయిన లేదా తెగిపోయిన స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָרוּת
  choice: కోయబడినవి
  rationale: కోసివేయబడిన స్థితిని నేరుగా తెలియజేస్తూ, ముందున్న ‘తెగినవి’తో భేదాన్ని కాపాడుతుంది.
- source_word: תַקְרִיבוּ
  choice: అర్పించకూడదు
  rationale: బలిసంబంధ సందర్భంలో దేవుని సన్నిధికి అర్పణగా తీసుకురావడాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని పేరుగానే నిలుపుతూ తెలుగులో విస్తృతంగా గుర్తించబడే రూపాన్ని ఉపయోగిస్తుంది.
- source_word: בְאַרְצְכֶם
  choice: మీ దేశంలో
  rationale: ఇశ్రాయేలీయులకు ఇవ్వబడే భూభాగవ్యాప్త ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תַעֲשׂוּ
  choice: ఇలా చేయకూడదు
  rationale: హీబ్రూలోని విస్తృతమైన, అధ్యాహార క్రియను అలాగే ఉంచి, ముందున్న జననేంద్రియ వికృతీకరణ చర్యలను సూచిస్తుంది.
- source_word: implicit object of the four participles
  choice: వృషణాలు
  rationale: నాలుగు విశేషణాల అధ్యాహార విషయాన్ని సందర్భానుసారంగా స్పష్టం చేసే ఖచ్చితమైన, గౌరవప్రదమైన శరీర నిర్మాణ పదం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన దైవనామ రూపాన్ని ఉపయోగించి, దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపింది.
- issue: וּבְאַרְצְכֶם לֹא תַעֲשׂוּ అనే చివరి నిషేధం యొక్క పరిధి
  choice: దేశంలో అలాంటి వికృతీకరణ చేయకూడదనే సాధారణ నిషేధం
  alternative: అలాంటి జంతువులను దేశంలో అర్పించకూడదనే నిషేధం
  rationale: ‘చేయు’ అనే హీబ్రూ క్రియ విస్తృతమైనది, అధ్యాహారమైనది. ‘ఇలా చేయకూడదు’ అనేది దాని అనిశ్చితిని నిలుపుతూనే, సందర్భంలో ముందున్న చర్యలకు సహజంగా తిరిగి సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూలో వరుసగా ఉన్న నాలుగు రకాల శారీరక హానిని తెలుగులోనూ వేరువేరు పదాలతో నిలిపాం; అధ్యాహార విషయమైన వృషణాలను స్పష్టత కోసం వాక్యంలో పేర్కొన్నాం.
