lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: దైవిక ప్రసంగాన్ని పరిచయం చేసే ఈ సాధారణ కథన సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: אֶל
  choice: తో
  rationale: తెలుగులో ‘మోషేతో అన్నాడు’ అనేది సంభాషణ గ్రహీతను సహజంగా సూచిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని సహజమైన తెలుగు విరామచిహ్నంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. బిరుదైన ‘ప్రభువు’తో దానిని భర్తీ చేయకుండా పేరుగానే ఉంచాం; తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
