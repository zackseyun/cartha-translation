  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సహజంగా ఉండే సంక్షిప్త దైవిక ప్రసంగ పరిచయం. తదుపరి వచనంలోని ప్రత్యక్ష వాక్యంతో అనుసంధానించేందుకు ద్విబిందువు వాడబడింది.
