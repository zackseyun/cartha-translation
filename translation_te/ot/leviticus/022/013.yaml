id: LEV.22.13
reference: Leviticus 22:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: te
  text: అయితే యాజకుని కుమార్తె విధవరాలైనా, విడాకులు పొందినదైనా, ఆమెకు సంతానం లేక, తన యౌవనంలో ఉన్నట్లే తన తండ్రి ఇంటికి తిరిగి వస్తే, ఆమె తన తండ్రి ఆహారంలోనుండి తినవచ్చు[a]. అయితే ఏ అనధికార వ్యక్తీ[b] దానిలోనుండి తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన తండ్రి రొట్టెలోనుండి.” ఇక్కడ “రొట్టె” యాజక కుటుంబానికి లభించే ఆహారాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బయటివారెవరూ.” హీబ్రూ పదం జాతిపరంగా విదేశీయుణ్ణి తప్పనిసరిగా సూచించదు; అనుమతించబడిన యాజక కుటుంబ వర్గానికి వెలుపల ఉన్న వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת כֹּהֵן כִּי תִהְיֶה
  choice: అయితే యాజకుని కుమార్తె ... అయితే
  rationale: మునుపటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; כִּי תִהְיֶה ఇక్కడ న్యాయపరమైన షరతును సూచిస్తుంది.
- source_word: אַלְמָנָה וּגְרוּשָׁה
  choice: విధవరాలైనా, విడాకులు పొందినదైనా
  rationale: హీబ్రూ సంధి రెండు ప్రత్యామ్నాయ పరిస్థితులను వరుసగా పేర్కొంటుంది; తెలుగులో ‘అయినా...అయినా’ వాటిని సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְזֶרַע אֵין לָהּ
  choice: ఆమెకు సంతానం లేక
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; కుటుంబ-న్యాయ సందర్భంలో పిల్లలు లేదా వారస సంతానాన్ని సూచిస్తుంది. ‘సంతానం’ దాని విస్తృతిని నిలుపుతుంది.
- source_word: וְשָׁבָה אֶל־בֵּית אָבִיהָ כִּנְעוּרֶיהָ
  choice: తన యౌవనకాలంలో ఉన్నట్లుగా తన తండ్రి ఇంటికి తిరిగి వస్తే
  rationale: ఆమె వివాహానికి ముందున్న స్థితిలో తండ్రి ఇంటికి తిరిగి చేరడాన్ని మూలపాఠానికి దగ్గరగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִלֶּחֶם אָבִיהָ תֹּאכֵל
  choice: ఆమె తన తండ్రి ఆహారంలోనుండి తినవచ్చు
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా ఇక్కడ యాజక కుటుంబానికి లభించే ఆహార ఏర్పాటును విస్తృతంగా సూచిస్తుంది; imperfect రూపాన్ని న్యాయపరమైన అనుమతిగా ‘తినవచ్చు’ అని అందించాం.
- source_word: וְכָל־זָר לֹא־יֹאכַל בּוֹ
  choice: అయితే అనధికారులెవరూ దానిలోనుండి తినకూడదు
  rationale: యాజక ధర్మశాస్త్రంలో זָר జాతిపరమైన విదేశీయుణ్ణి కాక, తినడానికి అర్హతలేని వర్గానికి చెందిన వ్యక్తిని సూచిస్తుంది. ‘అనధికారి’ ఆ న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘తండ్రి ఆహారం’ అనే పదబంధం సూచించే పరిధి
  choice: לֶחֶם ను సందర్భానుసారంగా ‘ఆహారం’గా అనువదించడం
  alternative: అక్షరార్థంగా ‘రొట్టె’ అని అనువదించడం
  rationale: లేవీయకాండము 22లో ప్రధానాంశం యాజక కుటుంబానికి సంబంధించిన పవిత్ర ఆహారం తినే అర్హత. ‘ఆహారం’ మూలపదంలోని ఉపలక్షణార్థాన్ని తెలియజేస్తుంది; అయితే అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: זָר యొక్క గుర్తింపు
  choice: జాతిపరమైన ‘విదేశీయుడు’గా కాక, అనుమతించబడిన యాజక వర్గానికి వెలుపలివాడిగా అర్థం చేయడం
  alternative: ‘పరదేశి’ లేదా ‘అపరిచితుడు’
  rationale: ఈ యాజక న్యాయ సందర్భంలో నిషేధం జాతి ఆధారమైనది కాదు; పవిత్ర ఆహారం తినే అధికారానికి సంబంధించినది. అందువల్ల ‘అనధికారి’ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘యాజకుడు,’ ‘సంతానం,’ ‘అనధికారి’ వంటి పదాలు సందర్భపు ఖచ్చితత్వాన్ని కాపాడుతూ సహజంగా ఉన్నాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
