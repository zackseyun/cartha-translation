id: LEV.22.5
reference: Leviticus 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: te
  text: లేదా, తనను అపవిత్రుణ్ణి చేసే ఏ పాకే ప్రాణినైనా[a] తాకిన ఎవరైనా; లేదా, ఎలాంటి అపవిత్రత కలిగిన వ్యక్తిని తాకి అపవిత్రుడైన ఎవరైనా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుంపులుగా కదిలే ప్రాణి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం చిన్నగా పాకే లేదా గుంపులుగా కదిలే జీవులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, ‘తనను అపవిత్రుణ్ణి చేసే వ్యక్తిని—అతని అపవిత్రత ఏదైనా—తాకిన ఎవరైనా’ అని చెప్పవచ్చు. హీబ్రూలోని పుంలింగ ఏకవచన రూపాలు ఇక్కడ సాధారణ న్యాయనియమ అర్థంలో వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: లేదా
  rationale: మునుపటి వచనంలో మొదలైన జాబితాను కొనసాగించే సాధారణ వికల్ప సంధానంగా అనువదించబడింది.
- source_word: אִישׁ
  choice: పురుషుడు
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, న్యాయనియమ సందర్భంలో అది సాధారణ వర్తింపు కలిగినదని అర్థమయ్యేలా వాక్యం నిర్మించబడింది.
- source_word: יִגַּע
  choice: తాకిన
  rationale: శుద్ధి నియమాల సందర్భంలో נגע అనే క్రియకు సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: בְּכָל שֶׁרֶץ
  choice: ఏ పాకే ప్రాణినైనా
  rationale: שֶׁרֶץ చిన్నగా పాకే లేదా గుంపులుగా కదిలే జీవుల విస్తృత వర్గాన్ని సూచిస్తుంది; నిర్దిష్ట జంతుశాస్త్రీయ వర్గంగా పరిమితం చేయలేదు.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: తనను అపవిత్రుణ్ణి చేసే
  rationale: ఆ జీవితో తాకడం వల్ల కలిగే ఆచారపరమైన అపవిత్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְאָדָם
  choice: వ్యక్తిని
  rationale: אָדָם ఇక్కడ అపవిత్రతకు మానవ మూలాన్ని సూచించే సాధారణ పదం; అందువల్ల లింగాన్ని అనవసరంగా పరిమితం చేయకుండా ‘వ్యక్తి’ అని అనువదించబడింది.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: ఎలాంటి అపవిత్రత కలిగిన
  rationale: ఆ వ్యక్తికి ఉండగల ఏ రకమైన అపవిత్రతనైనా ఈ మాటలు కలుపుకుంటాయి; సంక్షిప్తమైన హీబ్రూ భావాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: טמא / טֻמְאָה
  choice: అపవిత్రుడు / అపవిత్రత
  rationale: క్రియ, నామవాచకం మధ్య ఉన్న మూలపద సంబంధాన్ని తెలుగులోనూ నిలుపుతూ, యాజక శుద్ధి నియమాల పదజాలానికి తగిన రూపాలు ఎంచుకోబడ్డాయి.
theological_decisions:
- issue: లేవీయ శుద్ధి నియమాల్లో అపవిత్రత స్వభావం
  choice: ‘అపవిత్రుడు / అపవిత్రత’ అని అనువదించి, నైతిక దోషాన్ని సూచించే పదాలను వాడలేదు.
  alternative: ‘మలినుడు / మలినత’ లేదా నైతిక పాపభావాన్ని స్పష్టంగా చేర్చడం
  rationale: ఈ సందర్భం ప్రధానంగా ఆచారపరమైన శుద్ధి స్థితిని గురించి; మూలపాఠం తప్పనిసరిగా నైతిక అపరాధాన్ని ప్రకటించదు.
- issue: לְכֹל טֻמְאָתוֹలోని సంబంధం
  choice: తాకబడిన వ్యక్తికి ఏ విధమైన అపవిత్రత ఉన్నా అది సంక్రమించగలదనే భావంతో ‘ఎలాంటి అపవిత్రత కలిగిన వ్యక్తి’ అని ఇచ్చింది.
  alternative: సర్వనామాన్ని తాకే పురుషుని అపవిత్రతకు అన్వయించడం
  rationale: సమీపంలోని אָדָם‌కు సర్వనామాన్ని అన్వయించడం వాక్యసందర్భానికి బాగా సరిపోతుంది; అయినా హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉన్నందున అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. ఇది ముందు వచనంలోని జాబితాను కొనసాగించే వాక్యఖండమని చూపేందుకు ‘లేదా’తో ప్రారంభించింది. ‘అపవిత్రత’ అనే పదాన్ని ఆచారపరమైన శుద్ధి సందర్భంలో వాడింది; వివరణాత్మకంగా ‘ఆచారపరంగా’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చి మూలాన్ని విస్తరించలేదు.
