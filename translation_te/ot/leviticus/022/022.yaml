id: LEV.22.22
reference: Leviticus 22:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: te
  text: గుడ్డిదైనా, ఎముక విరిగినదైనా, కోయబడి వికలమైనదైనా, పులిపిరి, గజ్జి లేదా చర్మవ్యాధి ఉన్నదైనా—అలాంటి జంతువులను యాహ్వేకు అర్పించకూడదు. వాటిలో దేనినీ యాహ్వేకు ఆహార అర్పణగా[a] బలిపీఠం మీద ఉంచకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అగ్ని ద్వారా అర్పించే అర్పణ,” లేదా “అగ్ని అర్పణ.”
    reason: אִשֶּׁה పదానికి ఉన్న ముఖ్యమైన పదార్థ ప్రత్యామ్నాయాలను నిలుపుటకు.
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: గుడ్డిదైనా
  rationale: బలికి పనికిరాని జంతువు లోపాన్ని సూచించే ఈ పదాన్ని సహజమైన ఆధునిక తెలుగులో ఇలా అనువదించాం.
- source_word: שָׁבוּר
  choice: ఎముక విరిగినదైనా
  rationale: విరిగిన అవయవం లేదా శరీరభాగం గల జంతువు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָרוּץ
  choice: కోయబడి వికలమైనదైనా
  rationale: కోయబడటం లేదా చీల్చబడటం వల్ల ఏర్పడిన తీవ్రమైన శారీరక లోపాన్ని సూచిస్తుంది; కేవలం ‘కోయబడినది’ అన్నదానికంటే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: יַבֶּלֶת
  choice: కణితి
  rationale: చర్మంపై ఏర్పడే అసాధారణ పెరుగుదలను సాధారణ పాఠకునికి అర్థమయ్యేలా తెలుపుతుంది; ఖచ్చితమైన వైద్య నిర్ధారణను అనవసరంగా రుద్దదు.
- source_word: גָרָב
  choice: గజ్జి
  rationale: కనిపించే చర్మబాధను సూచించే సులభమైన తెలుగు పదం.
- source_word: יַלֶּפֶת
  choice: చర్మవ్యాధి
  rationale: ఖచ్చితమైన చర్మరోగం ఏదో అనిశ్చితంగా ఉన్నందున తప్పుడు వైద్య నిర్దిష్టత లేకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: תַקְרִיבוּ
  choice: అర్పించకూడదు
  rationale: హిఫిల్ రూపానికి ఈ బలుల సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే ఆచారపరమైన భావం ఉంది; తెలుగులో ‘అర్పించడం’ సహజంగా ఉంటుంది.
- source_word: אֵלֶּה
  choice: అలాంటి జంతువులను
  rationale: ముందు పేర్కొన్న లోపాలుగల జంతువులనే సూచిస్తోందని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: וְאִשֶּׁה
  choice: ఆహార అర్పణగా
  rationale: యాజక సంబంధ సందర్భంలో అగ్నిపై సమర్పించబడే అర్పణను సూచించే అందుబాటులోని భావానువాదం; ‘అగ్ని ద్వారా అర్పించే అర్పణ’ అనే ముఖ్య ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: వాటిలో దేనినీ ... బలిపీఠం మీద ఉంచకూడదు
  rationale: మూలంలోని విభజనాత్మక భావాన్ని, నిషేధించబడిన నిర్దిష్ట ఆచార చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను తెలుగు లిపిలో ఇచ్చాం.
- issue: אִשֶּׁה అనే బలి సంబంధ పదం
  choice: ఆహార అర్పణ
  alternative: అగ్ని ద్వారా అర్పించే అర్పణ; అగ్ని అర్పణ
  rationale: ఈ పదం అగ్నిపై సమర్పించే అర్పణకు సంబంధించినది; యాజక సంబంధ వాడుకలో ‘ఆహార అర్పణ’ అర్థవంతమైన భావానువాదం. అయితే పదంలోని అగ్ని సంబంధ భావాన్ని పాదసూచికలో పారదర్శకంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదిగా ఉన్నప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సూచ్యమైన జంతువును స్పష్టం చేశాం.
