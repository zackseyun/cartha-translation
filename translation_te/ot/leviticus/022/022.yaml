  terminology: యాహ్వే appropriately represents יהוה. ఆహార అర్పణ reasonably follows the stated English POB decision for אִשֶּׁה; the footnote adequately preserves the significant fire-offering alternative. పులిపిరి is preferable for יַבֶּלֶת.
