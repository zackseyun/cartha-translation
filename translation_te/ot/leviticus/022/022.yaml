review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the catalog of disqualifying defects, the two prohibitions, the altar reference, and the divine name. However, కణితి commonly denotes a tumor/lump and is not a suitably precise yet non-overstated equivalent for יַבֶּלֶת, ‘wart/growth.’
