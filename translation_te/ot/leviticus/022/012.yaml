id: LEV.22.12
reference: Leviticus 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: te
  text: అయితే యాజకుని కుమార్తె యాజక కుటుంబానికి చెందని వ్యక్తిని పెళ్లి చేసుకుంటే,[a] ఆమె పరిశుద్ధ కానుకలలోని ప్రతిష్ఠిత భాగాన్ని తినకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వేరైన/బయటి వ్యక్తికి [భార్యగా] అయితే.’ ఇక్కడ ఇది తప్పనిసరిగా విదేశీయుణ్ణి సూచించదు; యాజక కుటుంబానికి, లేదా పరిశుద్ధ ఆహారం తినడానికి అర్హులైన వర్గానికి, వెలుపల ఉన్న వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిశుద్ధ కానుకలలోని అర్పణ భాగం,’ ‘పరిశుద్ధ అర్పణలలోని ప్రతిష్ఠిత భాగం,’ లేదా ‘పరిశుద్ధ కానుకలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: అయితే యాజకుని కుమార్తె
  rationale: ముందటి వచనంలోని అనుమతికి భిన్నమైన పరిస్థితిని వావ్ సూచిస్తున్నందున ‘అయితే’ అని అనువదించాం; నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో ‘యాజకుని కుమార్తె’గా ఉంచాం.
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: యాజక కుటుంబానికి చెందని వ్యక్తిని పెళ్లి చేసుకుంటే
  rationale: ఈ సందర్భంలో זָר జాతిపరమైన విదేశీయుణ్ణి కాక, యాజక కుటుంబం లేదా పరిశుద్ధ ఆహారానికి అర్హులైన వర్గం వెలుపలివాణ్ణి సూచిస్తుంది. תִהְיֶה לְאִישׁ‌లోని వివాహ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הִוא
  choice: ఆమె
  rationale: స్వతంత్ర సర్వనామాన్ని స్పష్టమైన కర్తగా నిలిపి, హెబ్రీ పాఠంలోని స్వల్ప ఉద్ఘాటనను అతిగా పెంచకుండా ఉంచాం.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: పరిశుద్ధమైన అర్పణల్లోని ప్రతిష్ఠిత భాగాన్ని
  rationale: תְּרוּמָה అనేది దేవునికి వేరుచేసి సమర్పించిన భాగం లేదా కానుక. ‘ప్రతిష్ఠిత భాగం’ అనే పదబంధం దాని ప్రత్యేకంగా వేరుచేయబడిన స్వభావాన్ని తెలియజేస్తుంది; הַקֳּדָשִׁים అనే బహువచనాన్ని ‘పరిశుద్ధమైన అర్పణలు’గా సహజంగా ప్రతిబింబించాం.
- source_word: לֹא תֹאכֵל
  choice: తినకూడదు
  rationale: న్యాయ నియమంలోని నిషేధార్థక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాజక ధర్మశాస్త్రంలో זָר అర్థం
  choice: యాజక కుటుంబానికి చెందని వ్యక్తి
  alternative: అన్యుడు; విదేశీయుడు; సామాన్యుడు; యాజకుడు కానివాడు
  rationale: లేవీయకాండము 22లో ప్రధాన అంశం జాతి కాదు; పరిశుద్ధ ఆహారం తినడానికి అర్హత కలిగిన యాజక కుటుంబ పరిధి. అందువల్ల జాతిపరమైన భావాన్ని రుద్దకుండా సందర్భానుసారమైన పరిధి-బాహ్యతను స్పష్టం చేశాం.
- issue: תְּרוּמַת הַקֳּדָשִׁים యొక్క పరిధి
  choice: పరిశుద్ధమైన అర్పణల్లోని ప్రతిష్ఠిత భాగం
  alternative: పరిశుద్ధ కానుకలు; పరిశుద్ధ అర్పణ; పరిశుద్ధ వస్తువులలోని ప్రతిష్ఠిత భాగం
  rationale: మూలంలోని నిర్మాణాన్ని పూర్తిగా ఒకే నిర్దిష్ట సాంకేతిక అర్పణ రకానికి పరిమితం చేయకుండా, సమర్పణలలో యాజకులకు కేటాయించిన పవిత్ర భాగం అనే భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా ధర్మశాస్త్ర వచనానికి తగిన గౌరవప్రదమైన శైలి. ‘అన్యుడు/విదేశీయుడు’ వల్ల కలిగే జాతిపరమైన అపార్థాన్ని నివారించి, సందర్భంలోని యాజక కుటుంబ అర్హతను స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
