revisions:
- from: మీరు నా పవిత్ర నామాన్ని అపవిత్రపరచకూడదు. ఇశ్రాయేలు ప్రజల మధ్య నేను పవిత్రుడిగా ఎంచబడాలి.[a] మిమ్మల్ని పవిత్రపరచే యెహోవాను[b] నేనే.
  to: మీరు నా పవిత్ర నామాన్ని అపవిత్రపరచకూడదు. ఇశ్రాయేలు ప్రజల మధ్య నేను పవిత్రునిగా గౌరవించబడతాను.[a] మిమ్మల్ని పవిత్రపరచే యహ్వేను[b] నేనే.
