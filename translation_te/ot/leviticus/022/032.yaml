id: LEV.22.32
reference: Leviticus 22:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: te
  text: మీరు నా పవిత్ర నామాన్ని అపవిత్రపరచకూడదు. ఇశ్రాయేలు ప్రజల మధ్య నేను పవిత్రునిగా గౌరవించబడతాను.[a] మిమ్మల్ని పవిత్రపరచే యహ్వేను[b] నేనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను పవిత్రునిగా కనబడతాను” లేదా “నన్ను పవిత్రునిగా పరిగణిస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీ: యెహోవా (YHWH), ఇశ్రాయేలు దేవుని వ్యక్తిగత నామం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: అపవిత్రపరచకూడదు
  rationale: పవిత్రమైనదాన్ని సామాన్యమైనదిగా చూడడం లేదా దాని పవిత్రతను భంగపరచడం అనే పియేల్ క్రియారూప భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֵׁם קָדְשִׁי
  choice: నా పవిత్ర నామాన్ని
  rationale: మూలంలోని ‘నామం’ మరియు ‘పవిత్రత’ రెండింటినీ నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: וְנִקְדַּשְׁתִּי
  choice: నేను పవిత్రుడిగా ఎంచబడాలి
  rationale: నిఫాల్ రూపంలోని దైవం పవిత్రుడిగా గుర్తించబడడం, గౌరవించబడడం అనే భావాన్ని వ్యక్తం చేస్తుంది; చివరి מְקַדִּשְׁכֶם తో ఉన్న קדשׁ పదబంధ సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్య
  rationale: ఒడంబడిక సమాజంలో, వారి నడుమ అనే స్థానిక మరియు సామాజిక భావాలను సంక్షిప్తంగా ఇస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఈ స్థిర హెబ్రీ ప్రయోగం మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే సాంప్రదాయ లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: מְקַדִּשְׁכֶם
  choice: మిమ్మల్ని పవిత్రపరచే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న దైవకార్యాన్ని తెలుపుతూ, అదే వాక్యంలోని קדשׁ మూలపదంతో పదసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי యొక్క క్రియావాచ్య భావం
  choice: నేను పవిత్రుడిగా ఎంచబడాలి
  alternative: నేను పవిత్రుడిగా కనబడతాను / నన్ను పవిత్రుడిగా గౌరవించాలి
  rationale: హెబ్రీ నిఫాల్ రూపం నిష్క్రియ, మధ్యమ లేదా ప్రతిబింబ ఛాయలను కలిగి ఉండవచ్చు. దేవుడు స్వభావతః మరింత పవిత్రుడు అవుతాడని కాక, సమాజంలో పవిత్రుడిగా గుర్తింపబడి గౌరవింపబడాలని ఈ ఎంపిక తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచింది.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో అందించబడింది; మరింత ప్రత్యక్ష లిప్యంతరీకరణను పాదసూచిక సూచిస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీ రూపం వ్యాకరణపరంగా ‘కుమారులు’ అయినా, ఇక్కడ అది ఒడంబడిక సమాజమంతటినీ సూచించే స్థిర ప్రయోగం. ‘ప్రజలు’ అనేది పరిధిని అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పవిత్రతకు సంబంధించిన קדשׁ పదమూల సంబంధాన్ని ‘పవిత్రుడిగా’/‘పవిత్రపరచే’ రూపాలతో నిలిపింది. హెబ్రీ సముచ్చయాన్ని రెండు సమన్విత వాక్యాలుగా సహజంగా అందించింది.
