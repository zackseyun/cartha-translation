  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: te
  text: విదేశీయుని చేతి నుండి వీటిలో దేనినీ మీ దేవునికి ఆహారంగా[a] అర్పించకూడదు. ఎందుకంటే వాటిలో వికృతి ఉంది; వాటిలో లోపం[b] ఉంది. అవి మీ తరఫున అంగీకరించబడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ దేవుని రొట్టెగా.’ ఇక్కడ ‘రొట్టె’ అనేది దేవునికి అర్పించే ఆహారాన్ని సూచించే హీబ్రూ బలి సంబంధమైన నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మచ్చ.’ హీబ్రూ పదం బలి జంతువును అనర్హం చేసే లోపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: చేతినుండి కూడా
  rationale: מִיַּד అనే హీబ్రూ నుడికారం మూలాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. ‘చేతినుండి’ మూల రూపకాన్ని నిలుపుతుంది; וּ־ను సందర్భానుసారంగా ‘కూడా’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: בֶּן נֵכָר
  choice: విదేశీయుడు
  rationale: అక్షరార్థంగా ‘విదేశీయుని కుమారుడు’ అయినా, ఇది ఇశ్రాయేలీయుడు కాని వ్యక్తిని సూచించే నుడికారం. ఆధునిక తెలుగులో ‘విదేశీయుడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: תַקְרִיבוּ
  choice: అర్పించకూడదు
  rationale: קרב హిఫీల్ రూపం బలి సందర్భంలో దేవుని సమక్షానికి తీసుకురావడం లేదా అర్పించడం అనే అర్థం ఇస్తుంది. ‘అర్పించకూడదు’ ఆ ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: మీ దేవుని ఆహారం
  rationale: לֶחֶם సాధారణంగా ‘రొట్టె’ అయినప్పటికీ, యాజక సంబంధమైన బలి భాషలో దేవునికి అర్పించే ఆహారాన్ని విస్తృతంగా సూచిస్తుంది. జంతుబలుల సందర్భానికి ‘ఆహారం’ సరిపోతుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִכָּל אֵלֶּה
  choice: వీటిలో దేనినీ
  rationale: ఇది ముందుగా చెప్పిన లోపభూయిష్టమైన జంతువులను తిరిగి సూచిస్తుంది. నిషేధ వాక్యంలో ‘వీటిలో దేనినీ’ అనేది מִן యొక్క విభాగార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָשְׁחָתָם
  choice: వాటిలో వికృతి ఉంది
  rationale: ఈ పదం చెడిపోవడం, పాడవడం లేదా రూపవికృతిని సూచించగలదు. బలి జంతువుల శారీరక అనర్హత సందర్భంలో ‘వికృతి’ అనేది తరువాత వచ్చే מוּםతో పూర్తిగా కలిసిపోకుండా భావాన్ని నిలుపుతుంది.
- source_word: מוּם
  choice: లోపం
  rationale: లేవీయకాండము 21–22లో ఈ పదం బలికి అనర్హం చేసే శారీరక దోషాన్ని సూచిస్తుంది. ‘లోపం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది; ‘కళంకం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: అవి మీ తరఫున అంగీకరించబడవు
  rationale: బలి సందర్భంలో רצה నిఫాల్ రూపం అనుకూలంగా స్వీకరించబడడాన్ని సూచిస్తుంది. ‘మీ తరఫున’ అనే మాట לָכֶםను నిలిపి, అర్పించేవారికి సంబంధించిన అంగీకార భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: బలి అర్పణకు వాడిన לֶחֶם అనే ఆరాధనా పదబంధం
  choice: మీ దేవుని ఆహారం
  alternative: మీ దేవుని రొట్టె
  rationale: ఈ వచనం బలి జంతువుల గురించి మాట్లాడుతోంది. ‘ఆహారం’ యాజక సంబంధమైన విస్తృత నుడికార భావాన్ని అందిస్తుంది; ‘రొట్టె’ మాత్రమే అని పరిమితం చేయదు. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- issue: బలి అంగీకారం ఎవరికి సంబంధించినది
  choice: మీ తరఫున అంగీకరించబడవు
  alternative: మీకు అంగీకారయోగ్యంగా ఉండవు
  rationale: לָכֶםను స్పష్టంగా నిలిపి, జంతువులలోని స్వభావసిద్ధ యోగ్యతకే పరిమితం కాకుండా అర్పించేవారి పక్షాన అవి స్వీకరించబడవనే సంబంధాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ ‘చేతినుండి’ నుడికారాన్ని నిలిపి, బలి సంబంధమైన సాంకేతిక భావాలను ‘అర్పించు,’ ‘ఆహారం,’ ‘అంగీకరించబడవు’ వంటి సహజ పదాలతో వ్యక్తం చేశాం.
