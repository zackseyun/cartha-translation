  to: విదేశీయుని చేతి నుండి వీటిలో దేనినీ మీ దేవునికి ఆహారంగా[a] అర్పించకూడదు. ఎందుకంటే వాటిలో వికృతి ఉంది; వాటిలో లోపం[b] ఉంది. అవి మీ తరఫున అంగీకరించబడవు.
