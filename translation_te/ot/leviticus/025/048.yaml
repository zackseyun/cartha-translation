source:
  edition: WLC
  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: te
  text: అతడు అమ్మబడిన తర్వాత, అతనికి విమోచన హక్కు ఉంటుంది; అతని సహోదరులలో ఒకడు అతన్ని విమోచించవచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: అతడు అమ్మబడిన తర్వాత
  rationale: אַחֲרֵי కాలసంబంధాన్ని సూచిస్తుంది; נִמְכַּר అనేది מכר క్రియ యొక్క నిఫాల్ రూపం, కాబట్టి జరిగిన అమ్మకాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంతో తెలిపింది.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: అతనికి విమోచన పొందే అవకాశం ఉంటుంది
  rationale: మూలంలో ‘విమోచన అతనికి ఉంటుంది’ అనే నామవాచక-అస్తిత్వ నిర్మాణం ఉంది. తెలుగులో సహజత కోసం దాని న్యాయపరమైన భావాన్ని—అమ్మబడిన వ్యక్తికి ఇంకా విమోచన లభించగలదనే విషయాన్ని—ఈ విధంగా వ్యక్తం చేసింది.
- source_word: אֶחָד מֵאֶחָיו
  choice: అతని సహోదరులలో ఒకడు
  rationale: మూలంలోని ‘అతని సహోదరులలో ఒకడు’ అనే స్పష్టమైన పుంలింగ బంధుత్వ పదాన్ని విస్తరించి ‘బంధువులు’గా మార్చకుండా నిలిపింది.
- source_word: יִגְאָלֶנּוּ
  choice: అతన్ని విడిపించవచ్చు
  rationale: גאל ఇక్కడ బంధువు చెల్లించి తిరిగి విడిపించే న్యాయపరమైన కార్యాన్ని సూచిస్తుంది. తెలుగులో ‘విడిపించు’ ఈ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; రూపం న్యాయపరమైన అనుమతి లేదా అవకాశాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מֵאֶחָיו అనే బంధుత్వ పదం పరిధి
  choice: అతని సహోదరులలో
  alternative: అతని బంధువులలో
  rationale: హీబ్రూ పదం అక్షరార్థంగా పుంలింగ బహువచనమైన ‘అతని సహోదరులు’ అని చెబుతుంది. సమీప వచనాలు ఇతర బంధువులను విడిగా పేర్కొంటున్నందున ప్రధాన పాఠంలో దానిని సాధారణీకరించలేదు.
- issue: גְּאֻלָּה תִּהְיֶה לּוֹ యొక్క న్యాయపరమైన భావం
  choice: అతనికి విమోచన పొందే అవకాశం ఉంటుంది
  alternative: అతనికి విమోచన ఉంటుంది
  rationale: మూలంలోని నామవాచక నిర్మాణాన్ని యాంత్రికంగా కాకుండా, విమోచనం అతనికి అందుబాటులోనే ఉందనే న్యాయపరమైన అర్థంతో సహజ తెలుగులో అందించింది; దానిని తప్పనిసరిగా జరిగే విమోచనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘సహోదరులు’ మూలంలోని పుంలింగ బంధుత్వ నిర్దిష్టతను నిలుపుతుంది; ‘విడిపించవచ్చు’ సాధారణ పాఠకునికి అర్థమయ్యేలా గోయేలు చేసే విమోచన కార్యాన్ని తెలియజేస్తుంది.
