  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: te
  text: అంతేకాక, మీతో నివసిస్తున్న పరదేశుల కుమారులలో నుండి, మీ మధ్య ఉన్న వారి కుటుంబాలలో నుండి కూడా మీరు కొనవచ్చు; వారు మీ దేశంలో కనినవారు మీకు స్వాస్థ్యంగా ఉంటారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీతో నివసిస్తున్న పరదేశుల సంతతివారిలో నుండి.”
    reason: lexical_alternative
  - marker: b
    text: “స్వాస్థ్యం” ఇక్కడ న్యాయపరంగా వారసత్వంగా బదిలీ చేయగల ఆస్తిని సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְגַם
  choice: నుండియు
  rationale: మునుపటి వచనంలోని కొనుగోలు అవకాశానికి మరొక వర్గాన్ని జోడించే భావాన్ని సహజమైన తెలుగు సముచ్చయంతో తెలియజేస్తుంది.
- source_word: מִבְּנֵי
  choice: కుమారులలో నుండి
  rationale: బెనేగా ఉన్న మూలరూపంలోని ‘కుమారులు’ భావాన్ని నిలుపుతూ, ఒక వర్గంలోనుండి కొనడాన్ని సూచిస్తుంది; సందర్భంలో ఇది సంతతి అనే విస్తృత భావాన్నీ కలిగి ఉండవచ్చు.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: మీతో నివసిస్తున్న పరదేశులు
  rationale: తోషావ్ మరియు గేర్ కలయికలోని స్థానికేతర నివాసుల న్యాయపరమైన భావాన్ని సంక్షిప్తంగా, ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מֵהֶם תִּקְנוּ
  choice: మీరు కొనవచ్చు
  rationale: קנה ఇక్కడ వాణిజ్యపరంగా ‘కొను’ అని అర్థమవుతుంది; ధర్మశాస్త్ర సందర్భంలోని అనుమతిని ‘వచ్చు’ తెలియజేస్తుంది.
- source_word: וּמִמִּשְׁפַּחְתָּם
  choice: వారి కుటుంబాలలో నుండి
  rationale: מִשְׁפָּחָה యొక్క కుటుంబం/వంశగుంపు భావంలో సాధారణ పాఠకులకు ‘కుటుంబాలు’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: వారు మీ దేశంలో కనినవారు
  rationale: הוליד యొక్క సంతానోత్పత్తి/కనుట భావాన్ని సహజంగా వ్యక్తం చేస్తూ, పురుష పూర్వికత్వాన్ని అవసరానికి మించి తెలుగులో కఠినతరం చేయదు.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: వారు మీకు స్వాస్థ్యంగా ఉంటారు
  rationale: אֲחֻזָּה యొక్క న్యాయపరమైన స్వాధీన ఆస్తి/వారసత్వపు స్వాస్థ్య భావాన్ని నిలుపుతుంది; వ్యక్తులను ఆస్తిగా పరిగణిస్తున్న మూలంలోని కఠిన వాస్తవాన్ని మెత్తబరచదు.
theological_decisions:
- issue: బానిసత్వం మరియు ఆస్తి హోదాను తెలిపే న్యాయ భాష
  choice: ‘కొనవచ్చు’, ‘స్వాస్థ్యంగా’ అనే ప్రత్యక్ష భాష
  alternative: ‘సంపాదించవచ్చు’, ‘సేవకులుగా ఉంటారు’
  rationale: హెబ్రీ పాఠం కొనుగోలును, వ్యక్తులు బదిలీ చేయదగిన స్వాధీనంగా ఉండే హోదాను నేరుగా సూచిస్తుంది. నైతిక అసౌకర్యాన్ని తగ్గించేందుకు మూలపాఠంలోని భాషను సౌమ్యపరచకూడదు.
- issue: בְּנֵי యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘కుమారులు’; పాదసూచికలో ‘సంతతివారు’ ప్రత్యామ్నాయం
  alternative: ప్రధాన పాఠంలోనే ‘సంతతివారు’
  rationale: హెబ్రీ రూపానికి దగ్గరగా ఉంటూనే, న్యాయ సందర్భంలో పదానికి ఉండగల విస్తృత వంశార్థాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలి. మూలంలోని కొనుగోలు మరియు ఆస్తి హోదా భాషను సౌమ్యపరచకుండా, వాక్య సంబంధాలను సాధారణ పాఠకులకు స్పష్టంగా ఉంచింది.
