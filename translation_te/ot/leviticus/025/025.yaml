source:
  edition: WLC
  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: te
  text: నీ సహోదరుడు పేదవాడై, తన వారసత్వ భూమిలో కొంత అమ్మితే, అతనికి అత్యంత దగ్గరి బంధువైన విమోచకుడు వచ్చి, అతని సహోదరుడు అమ్మిన దానిని విమోచించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמוּךְ
  choice: పేదవాడై
  rationale: ఆర్థికంగా దిగజారి పేదరికంలోకి రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: హీబ్రూ పదంలోని ప్రత్యక్ష బంధుత్వ భాషను నిలుపుతుంది; ఈ ధర్మశాస్త్ర సందర్భంలో ఇది తోటి ఇశ్రాయేలీయునికీ వర్తించవచ్చు.
- source_word: מֵאֲחֻזָּתוֹ
  choice: తన వారసత్వ భూమిలో కొంత
  rationale: ఇక్కడ אֲחֻזָּה సాధారణ ఆస్తికన్నా కుటుంబానికి కేటాయించబడిన వంశపారంపర్య భూస్వామ్యాన్ని సూచిస్తుంది.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: అతనికి అత్యంత దగ్గరి బంధువైన విమోచకుడు
  rationale: గోయేలు కుటుంబ ఆస్తిని తిరిగి పొందే హక్కు, బాధ్యత గల సమీప బంధువు; 'బంధువైన విమోచకుడు' న్యాయపరమైనదీ బంధుత్వపరమైనదీ అయిన భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: וּבָא וְגָאַל
  choice: వచ్చి ... తిరిగి విడిపించాలి
  rationale: ఈ నియమ సందర్భంలో సమీప బంధువు చేయవలసిన చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; 'తిరిగి విడిపించు' అమ్మబడిన కుటుంబ భూమిని విమోచన ధర చెల్లించి మరల కుటుంబానికి పొందడాన్ని సూచిస్తుంది.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: తన సహోదరుడు అమ్మినదాన్ని
  rationale: మִמְכָּר అమ్మబడిన వస్తువును లేదా అమ్మకాన్ని సూచించగలదు; ఈ రూపం మూలంలోని స్వల్ప విస్తృతిని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ధర్మశాస్త్రంలోని బంధుత్వ భాష
  choice: నీ సహోదరుడు
  alternative: నీ బంధువు / తోటి ఇశ్రాయేలీయుడు
  rationale: మూలంలో ఉన్న 'సహోదరుడు' అనే కుటుంబ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా నిబంధన సమాజాన్ని కుటుంబంగా చూపే భాషను తటస్థీకరించకుండా కాపాడుతుంది.
- issue: גאל పదజాలంలోని న్యాయపరమైన, ధార్మిక ప్రతిధ్వని
  choice: బంధువైన విమోచకుడు ... తిరిగి విడిపించాలి
  alternative: దగ్గరి బంధువు ... తిరిగి కొనాలి
  rationale: '''విమోచకుడు/విడిపించు'' అనే పదజాలం కుటుంబ ఆస్తిని తిరిగి పొందే న్యాయపరమైన భావంతో పాటు హీబ్రూ గ్రంథమంతటా ఉన్న విమోచన ప్రతిధ్వనిని నిలుపుతుంది; బంధుత్వ అంశాన్ని కూడా స్పష్టంగా చెబుతుంది.'
- issue: וּבָא וְגָאַל యొక్క విధిబలం
  choice: వచ్చి ... విడిపించాలి
  alternative: వచ్చి ... విడిపించవచ్చు
  rationale: ఈ నియమ వాక్యంలో క్రియలు సమీప బంధువు చేపట్టవలసిన చర్యగా చదవవచ్చు. అయితే అనుమతి లేదా హక్కును సూచించే పఠనం కూడా సాధ్యమైనందున దానిని [a] పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. 'సహోదరుడు,' 'విమోచకుడు,' 'వారసత్వ భూమి' అనే పదాలు మూలంలోని బంధుత్వ, విమోచన, వంశపారంపర్య భూహక్కుల భావాలను నిలుపుతాయి. విధిబలం విషయంలోని నిజమైన అస్పష్టతను పాదసూచికలో చూపించాం.
