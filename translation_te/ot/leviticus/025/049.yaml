  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: te
  text: లేదా అతని మామగానీ, అతని మామ కుమారుడుగానీ[a] అతణ్ణి విడిపించవచ్చు; లేదా అతని వంశంలో అతనికి దగ్గరి రక్తసంబంధియైనవాడు అతణ్ణి విడిపించవచ్చు; లేదా అతనికి తగిన స్తోమత కలిగితే[b], అతడు తనను తాను విడిపించుకోవచ్చు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని మామ కుమారుడు”; అంటే అతని దాయాది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని చెయ్యి అందుకుంటే/సాధిస్తే”; అంటే తనను తాను విడిపించుకోవడానికి సరిపడే ఆర్థిక స్తోమత అతనికి కలిగితే.
    reason: idiom_explanation
  - marker: c
    text: హీబ్రూ రూపాన్ని “అతడు విడిపించబడవచ్చు” అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో అది తన విమోచన ధరను తానే చెల్లించడాన్ని సూచిస్తుంది.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: דֹדוֹ
  choice: అతని తండ్రి సోదరుడు
  rationale: ఈ బంధుత్వ చట్ట సందర్భంలో דּוֹד అంటే ‘ప్రియుడు’ కాదు, తండ్రి సోదరుడు. తెలుగు ‘మామ’ లేదా ఇతర ప్రత్యేక బంధుత్వ పదాలు తప్పు వైపు బంధాన్ని సూచించవచ్చు కాబట్టి వివరణాత్మక రూపం ఎంచుకున్నాం.
- source_word: בֶן דֹּדוֹ
  choice: అతని తండ్రి సోదరుని కుమారుడు
  rationale: హీబ్రూ బంధుత్వ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది; సాధారణంగా ఇతడు దాయాది లేదా cousin అవుతాడు.
- source_word: יִגְאָלֶנּוּ
  choice: అతణ్ణి విడిపించవచ్చు
  rationale: גאל ఇక్కడ బంధువు చెల్లించి బానిసత్వం నుంచి విడిపించే చట్టపరమైన చర్యను సూచిస్తుంది. ‘విడిపించు’ సామాన్య పాఠకునికి సహజంగా ఉండి, అధ్యాయంలోని విమోచన భావాన్ని నిలుపుతుంది.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: అతనికి దగ్గరి రక్తసంబంధియైనవాడు
  rationale: ‘అతని మాంసంలో మిగిలినవాడు’ అనే పదక్షర రూపం తెలుగులో అపార్థకరం; ఈ హీబ్రూ నుడికారం సమీప రక్తబంధువును సూచిస్తుంది.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: అతని వంశంలో
  rationale: מִשְׁפָּחָה ఇక్కడ కేవలం చిన్న కుటుంబాన్ని కాక విస్తృత బంధుత్వ సమూహాన్ని సూచిస్తుంది; ‘వంశం’ ఆ పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: అతనికి తగిన స్తోమత కలిగితే
  rationale: హీబ్రూ చేతి-నుడికారం స్వయంగా విడిపించుకోవడానికి సరిపడే ఆర్థిక సామర్థ్యం రావడాన్ని సూచిస్తుంది. సహజ తెలుగులో భావాన్ని ప్రధాన వాక్యంలో ఇచ్చి, మూల చిత్రాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְנִגְאָל
  choice: అతడు తనను తాను విడిపించుకోవచ్చు
  rationale: రూపం నిఫ్అల్/కర్మణి అయినప్పటికీ, అతనికి స్తోమత కలిగిన సందర్భం స్వవిమోచన భావాన్ని సూచిస్తుంది. మూలంలోని కర్మణి అవకాశాన్ని పాదసూచికలో పేర్కొన్నాం.
theological_decisions:
- issue: బంధుత్వ విమోచన పదజాలం
  choice: גאלను ఈ చట్ట సందర్భంలో ‘విడిపించు’గా అనువదించడం
  alternative: ‘విమోచించు’ లేదా ‘తిరిగి కొనిపించు’
  rationale: ‘విడిపించు’ చట్టపరమైన కొనుగోలు-విడుదల చర్యను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం వ్యాపార లావాదేవీగానో, కేవలం ఆధ్యాత్మిక భావంగానో పరిమితం చేయదు.
- issue: הִשִּׂיגָה יָדוֹ అనే నుడికారం
  choice: ప్రధాన వాక్యంలో ‘తగిన స్తోమత కలిగితే’; పాదసూచికలో చేతి-చిత్రం
  alternative: ‘అతని చెయ్యి అందుకుంటే’
  rationale: పదక్షర చేతి-నుడికారం ఆధునిక తెలుగులో సహజంగా అర్థం కాదు. భావాన్ని స్పష్టంగా తెలిపి, మూల రూపాన్ని పాదసూచిక ద్వారా సంరక్షించాం.
- issue: וְנִגְאָל లోని కర్మణి రూపం
  choice: సందర్భానుసారంగా ‘తనను తాను విడిపించుకోవచ్చు’
  alternative: ‘అతడు విడిపించబడవచ్చు’
  rationale: ముందున్న ‘అతనికి స్తోమత కలిగితే’ అనే షరతు స్వయంగా విమోచన ధర చెల్లించడాన్ని బలంగా సూచిస్తుంది. అయినా హీబ్రూ రూపం కర్మణి కావడంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభమైన చట్టపరమైన శైలి. ప్రాంతానుసారంగా మారే ‘బాబాయి/మామ’ వంటి పదాలకు బదులుగా స్పష్టమైన బంధుత్వ వివరణ వాడబడింది.
