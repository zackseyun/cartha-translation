  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: te
  text: నీ సహోదరుడు పేదవాడై, నీతో ఉండగా తనను తాను పోషించుకోలేని స్థితికి చేరితే[a], నీవు అతన్ని ఆదుకోవాలి[b], తద్వారా అతడు పరదేశిగా గాని తాత్కాలిక నివాసిగా గాని నీతో జీవించగలడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీతో అతని చేయి దిగజారితే.” ఇది అతని ఆర్థిక స్థోమత క్షీణించి, తనను తాను పోషించుకోలేని స్థితికి చేరడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “పరదేశి, తాత్కాలిక నివాసి” అనే హీబ్రూ పదబంధం వాక్యనిర్మాణపరంగా సంక్షిప్తంగా ఉంది. దీనిని, “అతనిని ఆదుకో; పరదేశిని, తాత్కాలిక నివాసిని కూడా ఆదుకో, తద్వారా అతడు నీతో జీవించగలడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יָמוּךְ
  choice: పేదవాడై
  rationale: ఆర్థికంగా దిగజారడం లేదా పేదరికంలో పడడాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ, నిబంధన సమాజంలోని తోటి సభ్యుని సూచించే సందర్భార్థాన్ని అనువాదంలో అతిగా విప్పదు.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: నీ దగ్గర అతని చేయి దిగజారితే
  rationale: జీవనోపాధి లేదా స్వయంపోషణ సామర్థ్యం క్షీణించడాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది; ‘నీ దగ్గర’ అనేది עִמָּךְ యొక్క సామాజిక-సంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: నీవు అతన్ని ఆదుకోవాలి
  rationale: అవసరంలో ఉన్న వ్యక్తిని పట్టుకొని నిలబెట్టడం, బలపరచడం అనే హిఫిల్ భావాన్ని ఆర్థిక-సామాజిక సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే స్థానికేతర వ్యక్తి అనే న్యాయ-సామాజిక భావాన్ని సుపరిచితమైన ఆధునిక తెలుగు పదంతో అందిస్తుంది.
- source_word: וְתוֹשָׁב
  choice: తాత్కాలిక నివాసి
  rationale: గֵּר నుండి కొంత భిన్నమైన, స్థిరత్వం తక్కువగల నివాస హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָחַי עִמָּךְ
  choice: అతడు నీ దగ్గర జీవించేలా చేయాలి
  rationale: సహాయం యొక్క ఉద్దేశం లేదా ఫలితాన్ని తెలియజేసే וָחַי భావాన్ని, పునరావృతమైన עִמָּךְ సంబంధ సూచనతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీ సహోదరుడు’ అనే పదబంధం యొక్క పరిధి
  choice: మూలంలోని బంధుత్వ పదమైన ‘నీ సహోదరుడు’నే నిలుపుట
  alternative: ‘నీ తోటి ఇశ్రాయేలీయుడు’ లేదా ‘నీ బంధువు’
  rationale: వచనం నిబంధన సమాజంలోని పరస్పర ఆర్థిక బాధ్యతను ఉద్దేశించినప్పటికీ, మూలంలోని బంధుత్వ భాషను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- issue: גֵּר וְתוֹשָׁב పదబంధం యొక్క వాక్యనిర్మాణ సంబంధం
  choice: పేద సహోదరుడు ‘పరదేశిగా గాని తాత్కాలిక నివాసిగా గాని’ జీవించేలా ఆదుకోవాలని ప్రధాన పాఠంలో చూపుట
  alternative: ‘పరదేశిని, తాత్కాలిక నివాసిని కూడా ఆదుకోవాలి’ అనే అదనపు కర్మలుగా గ్రహించుట
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి రెండు విధాలుగా అర్థమయ్యే అవకాశం ఉంది. ప్రధాన పాఠం ముందున్న ఏకవచన వ్యక్తితో ఈ పదబంధాన్ని అనుసంధానిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో పారదర్శకంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘చేయి దిగజారడం’ అనే మూల రూపకాన్ని ప్రధాన పాఠంలో నిలిపి పాదసూచికలో దాని భావాన్ని వివరించాం. హీబ్రూ వాక్యనిర్మాణంలోని నిజమైన సందిగ్ధతను రెండో పాదసూచికలో భద్రపరచాం.
