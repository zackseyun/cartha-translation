review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the impoverishment, the obligation to provide support, and the repeated communal sense of עִמָּךְ. However, “నీ దగ్గర అతని చేయి దిగజారితే” is an overly literal and unnatural Telugu calque of the Hebrew idiom. The final “జీవించేలా చేయాలి” can sound as though the command is simply to cause his residence, rather than that the support is to enable his continued life within the community.
  naturalness: “చేయి దిగజారడం” is not idiomatic modern standard Telugu for loss of means. Rendering the idiom by its contextual meaning in the text and preserving the literal wording in the footnote is clearer. Recasting the final clause as the purpose of the support produces a more natural and coherent Telugu sentence.
  terminology: “సహోదరుడు,” “ఆదుకోవాలి,” “పరదేశి,” and “తాత్కాలిక నివాసి” are suitable and retain the legal-social distinctions without importing later doctrinal interpretation. The syntactic ambiguity of גֵּר וְתוֹשָׁב should remain explicitly represented in the footnote.
  issues:
  - severity: medium
    issue: The phrase “నీ దగ్గర అతని చేయి దిగజారితే” is unnatural Telugu.
    rationale: Although it attempts to preserve the Hebrew hand-metaphor, it does not naturally communicate economic collapse or inability to sustain oneself in modern Telugu.
  - severity: low
    issue: The final clause “అతడు నీ దగ్గర జీవించేలా చేయాలి” is less precise in its relation to the command to support.
    rationale: It may be read as an independent command to arrange residence. Linking it directly to the purpose of support better reflects the Hebrew sequence and reads naturally.
  - severity: low
    issue: Footnote b’s alternative wording should retain the singular consequence in the Hebrew clause.
    rationale: The alternative construal concerns the scope of “resident foreigner and temporary resident”; wording it as “వారు ... జీవించాలి” unnecessarily changes the singular form of וָחַי.
  revised_text: నీ సహోదరుడు పేదవాడై, నీతో ఉండగా తనను తాను పోషించుకోలేని స్థితికి చేరితే[a], నీవు అతన్ని ఆదుకోవాలి[b], తద్వారా అతడు పరదేశిగా గాని తాత్కాలిక నివాసిగా గాని నీతో జీవించగలడు.
