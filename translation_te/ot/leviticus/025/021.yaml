id: LEV.25.21
reference: Leviticus 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: te
  text: అప్పుడు నేను ఆరవ సంవత్సరంలో మీ కోసం నా ఆశీర్వాదాన్ని నియమిస్తాను; అది మూడు సంవత్సరాలకు సరిపడే పంటను ఇస్తుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: అప్పుడు ... ఆజ్ఞాపిస్తాను
  rationale: צוה అనే క్రియ దైవిక ఆజ్ఞను లేదా నిర్ణయాన్ని సూచిస్తుంది. సందర్భంలో ఇది ముందటి వచనంలోని ప్రశ్నకు సమాధానం కాబట్టి וְ ను సహజంగా ‘అప్పుడు’ అని వ్యక్తపరచాం.
- source_word: בִּרְכָתִי
  choice: నా ఆశీర్వాదాన్ని
  rationale: ברכה ఇక్కడ వ్యవసాయ సమృద్ధిగా ఫలించే యెహోవా అనుగ్రహాన్ని సూచిస్తుంది; తరువాతి భాగమే దాని నిర్దిష్ట ఫలితాన్ని వివరిస్తుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: לְ ప్రయోజనం పొందేవారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మీ కోసం’ సహజమైన ప్రయోజనార్థక ప్రయోగం.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: ఆరవ సంవత్సరంలో
  rationale: శబ్బతు సంవత్సర చక్రానికి సంబంధించి ఆశీర్వాదం కలిగే సమయాన్ని నేరుగా తెలిపే కాలవాచక పదబంధం.
- source_word: וְעָשָׂת
  choice: అది ... ఇస్తుంది
  rationale: స్త్రీలింగ ఏకవచన క్రియ ఆశీర్వాదం వల్ల కలిగే ఉత్పత్తిని సూచిస్తుంది. వ్యవసాయ సందర్భంలో ‘పంటను ఇస్తుంది’ అనేది సహజమైన తెలుగు.
- source_word: הַתְּבוּאָה
  choice: పంటను
  rationale: תבואה వ్యవసాయ ఉత్పత్తి లేదా దిగుబడిని సూచిస్తుంది. సాధారణ పాఠకులకు ‘పంట’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: మూడు సంవత్సరాలకు సరిపడే
  rationale: అక్షరార్థంగా ‘మూడు సంవత్సరాల కోసం’ అయినా, సందర్భంలో పంట మూడు సంవత్సరాల అవసరాన్ని తీర్చే పరిమాణంలో ఉంటుందని అర్థం. తెలుగులో ‘మూడు సంవత్సరాలకు సరిపడే’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేయబడిన ఆశీర్వాద స్వభావం
  choice: అసాధారణ వ్యవసాయ సమృద్ధిని కలిగించే దేవుని ప్రత్యక్ష ఆజ్ఞాత్మక ఆశీర్వాదం
  alternative: సాధారణ దైవపోషణను గురించిన విస్తృత ప్రకటన మాత్రమే
  rationale: ‘నేను ఆజ్ఞాపిస్తాను,’ ‘నా ఆశీర్వాదం’ అనే మొదటి పురుష ప్రయోగాలు దీనిని సాధారణ పంటచక్రంపై వ్యాఖ్యగా కాక, దేవుని నిర్దిష్ట కార్యంగా చూపుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని దైవిక ఆజ్ఞ బలం నిలుపబడింది; అవసరం లేని సంప్రదాయపరమైన పదజాలం చేర్చలేదు.
