id: LEV.25.9
reference: Leviticus 25:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִעִ֔י בֶּ/עָשׂ֖וֹר לַ/חֹ֑דֶשׁ בְּ/יוֹם֙ הַ/כִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּ/כָל אַרְצְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: te
  text: ఏడవ నెలలో, నెల పదో రోజున, నీవు బూరను బిగ్గరగా మోగించాలి.[a] ప్రాయశ్చిత్త దినాన[b] మీరు మీ దేశమంతటా బూరను మోగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘షోఫార్’; అంటే కొమ్ముతో చేసిన బూర. సంప్రదాయంగా దీనిని తరచుగా పొట్టేలు కొమ్ముతో చేసిన బూరగా అర్థం చేసుకుంటారు.'
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రాయశ్చిత్త దినం’ అనే హీబ్రూ పదబంధం అక్షరార్థంగా ‘ప్రాయశ్చిత్తాల దినం’ (బహువచనం).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: మోగించాలి
  rationale: עבר హిఫీల్ రూపం అక్షరార్థంగా ‘దాటించు’ అని ఉన్నా, שׁוֹפָר తో కలిసి బూరధ్వనిని దేశమంతటికి వినిపించేలా చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మోగించాలి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: బూరధ్వని
  rationale: שׁוֹפָר కొమ్ముతో చేసిన ఊదే వాద్యం; תְּרוּעָה ఇక్కడ దాని బలమైన సంకేతధ్వనిని సూచిస్తుంది. ‘బూరధ్వని’ వాద్యాన్నీ దాని మోతనూ సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: ఆ నెల పదో రోజున
  rationale: అక్షరార్థమైన ‘నెల పదో తేదీన’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్త దినాన
  rationale: ఈ ఆరాధనా దినానికి తెలుగులో అర్థవంతమైన స్థిర రూపం. మూలంలోని כִּפֻּרִים బహువచన ఆకృతిని పాదటిప్పణిలో సూచించాం.
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: బూర మోగించాలి
  rationale: ఆజ్ఞలోని బహువచన సంబోధనను తెలుగు క్రియారూపం సంఖ్యాపరంగా ప్రత్యేకించదు; సందర్భానుసారంగా సమూహానికి ఇచ్చిన ఆజ్ఞగా సహజంగా చదవబడుతుంది.
- source_word: בְּכָל אַרְצְכֶם
  choice: మీ దేశమంతటా
  rationale: ఇశ్రాయేలీయుల భూభాగమంతటా ధ్వని వ్యాపించాలనే సమగ్ర విస్తృతిని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים అనువాదం
  choice: ప్రాయశ్చిత్త దినం
  alternative: ప్రాయశ్చిత్తాల దినం
  rationale: కల్ట్ సంబంధిత ప్రత్యేక పర్వదినాన్ని సహజమైన తెలుగు పేరుతో అందించాం; హీబ్రూ పదంలోని వ్యాకరణ బహువచనాన్ని అసహజంగా ప్రధాన పాఠంలో పెట్టకుండా పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘బూర’ అనే సుపరిచిత పదాన్ని వాడి, షోఫార్ యొక్క ప్రత్యేక స్వరూపాన్ని పాదటిప్పణిలో వివరించాం. మూలంలో ఏకవచన ఆజ్ఞ నుంచి బహువచన ఆజ్ఞకు వచ్చే మార్పు తెలుగులో సహజ ఆజ్ఞారూపం కారణంగా స్పష్టంగా కనిపించదు; అర్థాన్ని మార్చకుండా ఉంచాం.
