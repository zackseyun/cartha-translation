language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֥ת הַ/יּוֹבֵ֖ל הַ/זֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: te
  text: ఈ యూబిలీ సంవత్సరంలో ప్రతి మనిషి తన స్వాస్థ్యానికి తిరిగి వెళ్లాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: ఈ సునాద సంవత్సరంలో
  rationale: కాలార్థక בְּ, ‘సంవత్సరం’ అనే שָׁנָה, ప్రత్యేక యూబిలీ సంవత్సరాన్ని సూచించే יוֹבֵל, దానిని విశేషించే הַזֹּאת—ఇవన్నీ సహజమైన తెలుగు పదక్రమంలో అందించబడ్డాయి. ‘సునాద సంవత్సరం’ లేవీయకాండం 25లోని ప్రత్యేక సంస్థాపిత సంవత్సరాన్ని సూచిస్తుంది.
- source_word: תָּשֻׁבוּ
  choice: తిరిగి వెళ్లాలి
  rationale: ద్వితీయ పురుష బహువచన అసంపూర్ణ క్రియ ఇక్కడ ధర్మశాస్త్ర ఆజ్ఞను వ్యక్తం చేస్తుంది. తెలుగులో ‘వెళ్లాలి’ ఆ విధిని సహజంగా తెలియజేస్తుంది; ‘తిరిగి’ పునరాగమన భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: אִישׁ ఇక్కడ పంపిణీయ అర్థంలో ‘ఒక్కొక్క మనిషి/ప్రతి మనిషి’ అని సూచిస్తుంది. ఏకవచన ప్రతినిధి రూపాన్ని అలాగే ఉంచుతూ ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: తన స్వాస్థ్యానికి
  rationale: אֲחֻזָּה ఈ సందర్భంలో వ్యక్తి లేదా కుటుంబానికి చెందిన భూస్వాస్థ్యాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆస్తి మాత్రమే కాక కేటాయించబడిన వారసత్వ భూహక్కు అనే సందర్భార్థాన్నీ సంక్షిప్తంగా మోస్తుంది; ప్రత్యావర్తక ‘తన’ తెలుగు వాక్యంలో సహజంగా యాజమాన్యాన్ని చూపుతుంది.
theological_decisions:
- issue: אִישׁ అనే పంపిణీయ పురుష ఏకవచన నామవాచకం
  choice: ప్రతి మనిషి
  alternative: మీలో ప్రతి ఒక్కరూ
  rationale: మూలంలోని పంపిణీయ ఏకవచన నిర్మాణాన్ని, తరువాతి పురుష ఏకవచన స్వామ్య ప్రత్యయంతో ఉన్న సంబంధాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాన్ని కేవలం పురుషులకు మాత్రమే వర్తించే సాంకేతిక పరిమితిగా మరింత కఠినం చేయలేదు.
- issue: אֲחֻזָּה యొక్క న్యాయ-ఒడంబడిక సందర్భం
  choice: స్వాస్థ్యం
  alternative: ఆస్తి
  rationale: లేవీయకాండం 25లో భూమి తిరిగి అసలు కుటుంబ స్వాధీనానికి చేరే నియమం నేపథ్యంగా ఉంది. ‘స్వాస్థ్యం’ ఈ సందర్భాన్ని సూచిస్తుంది; అయితే ‘వారసత్వ భూమి’ అని విస్తరించి మూలంలో స్పష్టంగా లేని పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ధర్మశాస్త్ర శైలి. వాక్య నిర్మాణం సంక్షిప్తంగా ఉంచబడింది. ఈ ముసాయిదాలో పాదటిప్పణులు లేవు, కాబట్టి ప్రధాన పాఠంలో పాదటిప్పణి గుర్తులు అవసరం లేదు.
