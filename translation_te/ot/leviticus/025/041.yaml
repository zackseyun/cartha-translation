- from: అప్పుడు అతడు, అతనితోపాటు అతని కుమారులు నీ దగ్గరనుండి వెళ్లిపోవాలి. అతడు తన వంశం[a] దగ్గరకు తిరిగి వెళ్లాలి; తన పితరుల స్వాస్థ్యానికి[b] తిరిగి చేరాలి.
