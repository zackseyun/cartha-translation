review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequential legal sense: the man and his sons leave the Israelite master''s household/service and return to their wider kin-group and paternal hereditary holding. The masculine "sons" and "fathers" are appropriately retained. A small wording revision better represents אֲחֻזָּה as an inherited landed holding rather than the more abstract/less current "స్వాస్థ్యం."'
  naturalness: '"నీ దగ్గరనుండి" and "వంశం దగ్గరకు" are understandable but somewhat colloquial and spatially awkward in this legal-register context. "నీ వద్దనుండి" and "తన వంశానికి" are more natural modern standard Telugu. Recasting the initial coordinated subject also removes a slight syntactic heaviness.'
  terminology: '"వంశం" is suitable for מִשְׁפָּחָה in this kinship-and-land-tenure context. "పితరుల వారసత్వ ఆస్తి" naturally communicates אֲחֻזַּת אֲבֹתָיו as a paternal ancestral holding without importing a specific technical interpretation. Footnote alternatives remain correctly anchored.'
  issues:
  - severity: low
    issue: The primary term "స్వాస్థ్యం" is less natural in contemporary Telugu and can sound abstract.
    rationale: אֲחֻזָּה refers here to a hereditary property/landholding. "వారసత్వ ఆస్తి" is clearer and maintains the ancestral-inheritance sense.
  - severity: low
    issue: '"వంశం దగ్గరకు" uses a spatial construction where a dative relation is more idiomatic.'
    rationale: For return to a kin-group, "తన వంశానికి తిరిగి వెళ్లాలి" is smoother modern standard Telugu and preserves the Hebrew sense.
  revised_text: అప్పుడు అతడూ అతనితో ఉన్న అతని కుమారులూ నీ వద్దనుండి వెళ్లిపోవాలి. అతడు తన వంశానికి[a] తిరిగి వెళ్లాలి; తన పితరుల వారసత్వ ఆస్తికి[b] తిరిగి వెళ్లాలి.
