id: LEV.25.41
reference: Leviticus 25:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָצָא֙ מֵֽ/עִמָּ֔/ךְ ה֖וּא וּ/בָנָ֣י/ו עִמּ֑/וֹ וְ/שָׁב֙ אֶל מִשְׁפַּחְתּ֔/וֹ וְ/אֶל אֲחֻזַּ֥ת אֲבֹתָ֖י/ו יָשֽׁוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: te
  text: అప్పుడు అతడూ అతనితో ఉన్న అతని కుమారులూ నీ వద్దనుండి వెళ్లిపోవాలి. అతడు తన వంశానికి[a] తిరిగి వెళ్లాలి; తన పితరుల వారసత్వ ఆస్తికి[b] తిరిగి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన కుటుంబం’; హెబ్రీ పదం విస్తృత బంధువర్గాన్ని లేదా వంశాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన పితరుల స్వాధీన భూమికి’ లేదా ‘తన పూర్వీకుల ఆస్తికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: నీ దగ్గరనుండి వెళ్లిపోవాలి
  rationale: న్యాయపరమైన ఈ సందర్భంలో క్రియ భవిష్యత్తు/విధి భావాన్ని ఇస్తుంది. హెబ్రీయులోని ‘నీతో ఉన్న స్థలం నుండి బయటకు వెళ్లడం’ అనే సూటి చిత్రాన్ని కాపాడుతూ, ‘నీ సేవనుండి విడుదల కావాలి’ అని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: అతడు, అతనితోపాటు అతని కుమారులు
  rationale: בָּנָיו స్పష్టంగా పుంలింగ బహువచనం కావడంతో ‘కుమారులు’ అని అనువదించాం; עִמּוֹ లోని సహవాస భావాన్ని ‘అతనితోపాటు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁב ... יָשׁוּב
  choice: తిరిగి వెళ్లాలి ... తిరిగి చేరాలి
  rationale: שׁוב అనే క్రియ పునరావృతిని తెలుగులో ‘తిరిగి’ అనే పదాన్ని రెండుసార్లు ఉంచి కాపాడాం. రెండవ సందర్భంలో భూస్వాస్థ్యానికి పునరుద్ధరణ భావం సహజంగా వినిపించేందుకు ‘చేరాలి’ వాడాం.
- source_word: מִשְׁפַּחְתּוֹ
  choice: తన వంశం
  rationale: ఈ భూస్వామ్య-బంధుత్వ సందర్భంలో ఈ పదం కేవలం తక్షణ కుటుంబం కంటే విస్తృతమైన బంధువర్గం లేదా గోత్రాంతర్గత వంశాన్ని సూచించగలదు.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: తన పితరుల స్వాస్థ్యం
  rationale: אֲחֻזָּה వారసత్వంగా కలిగిన భూమి లేదా స్థిరాస్తిని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ వారసత్వ హక్కు భావాన్ని సంక్షిప్తంగా మోస్తుంది; ‘పితరుల’ అనేది మూలంలోని పితృవంశ భాషను నిలుపుతుంది.
theological_decisions:
- issue: పుంలింగ బంధుత్వ పదాల అనువాదం
  choice: అతని కుమారులు ... తన పితరులు
  alternative: అతని పిల్లలు ... తన పూర్వీకులు
  rationale: మూలంలో పుంలింగ రూపాలే స్పష్టంగా ఉన్నాయి; అంతేకాక ఈ వాక్యం పితృవంశ వారసత్వ భూమి సందర్భంలో ఉంది. అందువల్ల వాటిని లింగతటస్థంగా మార్చలేదు.
- issue: విడుదల అనే సామాజిక-న్యాయ భావం
  choice: నీ దగ్గరనుండి వెళ్లిపోవాలి
  alternative: నీ సేవనుండి విడుదల కావాలి
  rationale: సందర్భం అప్పుబానిసత్వం నుండి యూబిలీ విముక్తిని సూచించినా, మూల వాక్యం సూటిగా ‘బయటకు వెళ్లాలి’ అంటుంది. అందువల్ల న్యాయపరమైన అంతర్భావాన్ని ప్రధాన పాఠ్యంలో వివరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని అనుసరించాం. ‘వెళ్లిపోవాలి’ మరియు ‘తిరిగి చేరాలి’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. మూలంలోని שׁוב పునరావృతిని ‘తిరిగి’ రెండుసార్లు ఉంచి ప్రతిబింబించాం; ‘వంశం,’ ‘పితరులు,’ ‘స్వాస్థ్యం’ పదాలు పురాతన ఇశ్రాయేలు బంధుత్వ-భూవారసత్వ సందర్భాన్ని నిలుపుతాయి.
