id: LEV.25.16
reference: Leviticus 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: te
  text: సంవత్సరాల సంఖ్య ఎక్కువగా ఉంటే కొనుగోలు ధరను పెంచాలి; సంవత్సరాల సంఖ్య తక్కువగా ఉంటే కొనుగోలు ధరను తగ్గించాలి. ఎందుకంటే అతడు నీకు అమ్ముతున్నది పంటకోతల సంఖ్యనే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నీకు అమ్ముతున్నది పంట దిగుబడుల సంఖ్యనే.” హీబ్రూ పదానికి “పంటలు,” “దిగుబడులు,” లేదా “పంటకోతలు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: …గా ఉంటే
  rationale: సంవత్సరాల సంఖ్యకు అనుగుణంగా ధర మారాలనే అనుపాత భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: సంవత్సరాలు ఎక్కువగా / తక్కువగా
  rationale: యోబేలు వరకు మిగిలిన సంవత్సరాల తులనాత్మక సంఖ్యను స్పష్టంగా, సమాంతరంగా తెలియజేస్తుంది.
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: పెంచాలి / తగ్గించాలి
  rationale: ధరను పైకి లేదా కిందికి సవరించాలనే హిఫీల్ క్రియల కారణార్థక భావాన్ని ఆధునిక న్యాయ-వాణిజ్య తెలుగులో సహజంగా అందిస్తుంది.
- source_word: מִקְנָתוֹ
  choice: దానికి చెల్లించే ధర
  rationale: ఈ సందర్భంలో కొనుగోలు వస్తువు కన్నా దాని కొనుగోలు ధర ఉద్దేశించబడింది; తెలుగు పాఠకునికి లావాదేవీ భావం స్పష్టమవుతుంది.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: పంటకోతల సంఖ్య
  rationale: תְּבוּאוֹת సూచించే పంట దిగుబడులు లేదా కోతల భావాన్ని, భూమి వినియోగ సంవత్సరాల లెక్కతో అనుసంధానిస్తూ స్పష్టంగా తెలుపుతుంది.
- source_word: הוּא מֹכֵר לָךְ
  choice: అతడు నీకు అమ్మేది
  rationale: హీబ్రూ పురుష ఏకవచన కర్తను నిలుపుతూ, అమ్మకపు అసలు స్వరూపంపై దృష్టి పెట్టే సహజ తెలుగు నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-వాణిజ్య శైలి. మూలంలోని సమాంతర ధర నిర్ణయ సూత్రాన్ని నిలుపుతూ, సందర్భపరంగా సూచితమైన ‘ధర’ను స్పష్టీకరించింది.
