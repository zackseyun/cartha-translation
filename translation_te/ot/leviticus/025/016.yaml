revisions:
- from: సంవత్సరాలు ఎక్కువగా ఉంటే, దానికి చెల్లించే ధరను పెంచాలి; సంవత్సరాలు తక్కువగా ఉంటే, దానికి చెల్లించే ధరను తగ్గించాలి. ఎందుకంటే అతడు నీకు అమ్మేది పంటకోతల సంఖ్యనే.[a]
  to: సంవత్సరాల సంఖ్య ఎక్కువగా ఉంటే కొనుగోలు ధరను పెంచాలి; సంవత్సరాల సంఖ్య తక్కువగా ఉంటే కొనుగోలు ధరను తగ్గించాలి. ఎందుకంటే అతడు నీకు అమ్ముతున్నది పంటకోతల సంఖ్యనే.[a]
  rationale: The revision removes an unclear pronoun, makes the Hebrew contrast in the number of years explicit, and retains the source’s compact statement that the sale amounts to a number of harvests. No doctrinal or contextual expansion has been introduced.
  reviewer_model: gpt-5.6-terra
