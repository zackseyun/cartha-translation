revisions:
- from: అతడు తనను కొనుకున్నవానితో, తాను అతనికి అమ్ముడుపోయిన సంవత్సరం మొదలుకొని సునాద సంవత్సరం[a] వరకు లెక్క కట్టాలి. అతని అమ్మకపు వెలను సంవత్సరాల సంఖ్య ప్రకారం నిర్ణయించాలి; అతడు అతని దగ్గర ఉన్న కాలం కూలివాని పని దినాలవలె[b] పరిగణించాలి.
  to: అతడు తనను కొనుకున్నవానితో, తాను అతనికి అమ్ముడుపోయిన సంవత్సరం మొదలుకొని సునాద సంవత్సరం[a] వరకు లెక్క కట్టాలి. అతని అమ్మకపు వెల సంవత్సరాల సంఖ్య ప్రకారం ఉండాలి; వేతన కూలివాని దినాలవలె అతడు అతనితో ఉండాలి.[b]
  rationale: మూలంలోని ఆర్థిక లెక్కింపును మొదటి రెండు ఉపవాక్యాల్లో నిలుపుతూ, చివరి ఉపవాక్యాన్ని దాని ప్రత్యక్ష స్థితి/సేవా పోలికతో పునరుద్ధరించాను. దీనివల్ల వ్యక్తి సేవను వేతన కూలివాని కాలంతో పోల్చే హీబ్రూ భావం నిలుస్తుంది; మూలం స్పష్టంగా చెప్పని అదనపు వివరణను వచనంలో చేర్చదు.
