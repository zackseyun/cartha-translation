id: LEV.25.50
reference: Leviticus 25:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: te
  text: అతడు తనను కొనుకున్నవానితో, తాను అతనికి అమ్ముడుపోయిన సంవత్సరం మొదలుకొని సునాద సంవత్సరం[a] వరకు లెక్క కట్టాలి. అతని అమ్మకపు వెల సంవత్సరాల సంఖ్య ప్రకారం ఉండాలి; వేతన కూలివాని దినాలవలె అతడు అతనితో ఉండాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘యోబేలు సంవత్సరం.’ ఇది ప్రతి యాభైవ సంవత్సరంలో ప్రకటించే విముక్తి సంవత్సరం.'
    reason: cultural_clarification
  - marker: b
    text: లేదా, ‘కూలివాని దినాలవలె అతడు అతనితో ఉండాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: లెక్క కట్టాలి
  rationale: ఆర్థిక విమోచన వెలను గణించే న్యాయసంబంధ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: קֹנֵהוּ
  choice: తనను కొనుకున్నవానితో
  rationale: కנה కృదంతం అతనిని కొనుగోలు చేసిన వ్యక్తిని సూచిస్తుంది; తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: తాను అతనికి అమ్ముడుపోయిన సంవత్సరం మొదలుకొని
  rationale: హీబ్రూ నిఫాల్ రూపంలోని ‘అమ్మబడుట’ భావాన్ని నిలుపుతూ, సందర్భానుగుణంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; స్వచ్ఛందతను అతిగా నిర్ధారించదు.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: సునాద సంవత్సరం వరకు
  rationale: యోబేలు అనే ఇశ్రాయేలీయ వ్యవస్థకు సాధారణ తెలుగు బైబిలు పదమైన ‘సునాద సంవత్సరం’ను వాడింది.
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: అతని అమ్మకపు వెలను
  rationale: כֶּסֶף అక్షరార్థంగా వెండి/ధనం అయినా, ఈ వాణిజ్య-న్యాయ సందర్భంలో అమ్మకపు ధర లేదా వెలను సూచిస్తుంది.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: సంవత్సరాల సంఖ్య ప్రకారం
  rationale: సంవత్సరాల సంఖ్య ఆధారంగా అనుపాత లెక్క చేయాలనే భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: כִּימֵי שָׂכִיר
  choice: కూలివాని పని దినాలవలె
  rationale: שָׂכִיר వేతనానికి పనిచేసే కూలివానిని సూచిస్తుంది; ‘పని దినాలు’ పోలిక యొక్క సేవాకాల భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יִהְיֶה עִמּוֹ
  choice: అతడు అతని దగ్గర ఉన్న కాలం ... పరిగణించాలి
  rationale: అక్షరార్థమైన ‘అతనితో ఉండాలి’ అనే నిర్మాణాన్ని, ముందున్న కూలివాని దినాల పోలికతో కలిపి సహజమైన న్యాయ తెలుగు వాక్యంగా అందిస్తుంది.
theological_decisions:
- issue: అమ్ముడుపోయిన వ్యక్తి స్థితి—శాశ్వత యాజమాన్యమా, కాలపరిమిత సేవా?
  choice: అతడు ఉన్న కాలాన్ని కూలివాని పని దినాలవలె పరిగణించాలి
  alternative: అతడు కూలివానివలె అతనితో ఉండాలి
  rationale: హీబ్రూ పోలికను సేవాకాలపు విలువ నిర్ణయంతో అనుసంధానిస్తుంది; వ్యక్తిని శాశ్వత ఆస్తిగా పేర్కొనకుండా వచనంలోని ఆర్థిక లెక్క భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం. ‘అమ్ముడుపోయిన’ అనే నిష్క్రియ రూపం మూలంలోని రూపాన్ని కాపాడి, స్వచ్ఛందతపై మూలం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
