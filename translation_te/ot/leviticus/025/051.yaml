source:
  edition: WLC
  text: אִם ע֥וֹד רַבּ֖וֹת בַּ/שָּׁנִ֑ים לְ/פִי/הֶן֙ יָשִׁ֣יב גְּאֻלָּת֔/וֹ מִ/כֶּ֖סֶף מִקְנָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: te
  text: ఇంకా చాలా సంవత్సరాలు మిగిలి ఉంటే, ఆ సంవత్సరాల నిష్పత్తి ప్రకారం తనను కొనడానికి చెల్లించిన సొమ్ములోనుంచి తన విమోచన ధరను తిరిగి చెల్లించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన విమోచనను చెల్లించాలి.” హీబ్రూ నామవాచకం విమోచన చర్యను సూచించగలదు; అయితే ఇక్కడ అది విమోచన కోసం చెల్లించాల్సిన మొత్తాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עוֹד רַבּוֹת בַּשָּׁנִים
  choice: ఇంకా చాలా సంవత్సరాలు మిగిలి ఉంటే
  rationale: షరతును సహజమైన తెలుగులో వ్యక్తపరుస్తూ, עוֹד మరియు רַבּוֹת సూచించే ‘ఇంకా చాలా’ అనే భావాన్ని నిలుపుతుంది; ‘మిగిలి’ అనేది హీబ్రూ నిర్మాణంలో అంతర్లీనంగా ఉన్న భావం.
- source_word: לְפִיהֶן
  choice: వాటి నిష్పత్తి ప్రకారం
  rationale: అక్షరార్థంగా ‘వాటి నోటి ప్రకారం’ అనే హీబ్రూ నుడికారానికి ఇక్కడ సంవత్సరాల సంఖ్యకు అనుగుణమైన నిష్పత్తి అనే భావం ఉంది.
- source_word: יָשִׁיב
  choice: తిరిగి చెల్లించాలి
  rationale: שוב హిఫీల్ రూపం ఆర్థిక-చట్టపరమైన సందర్భంలో సొమ్మును తిరిగి ఇవ్వడం లేదా చెల్లించడం అనే భావాన్ని ఇస్తుంది.
- source_word: גְּאֻלָּתוֹ
  choice: తన విమోచన వెలను
  rationale: ఈ సందర్భంలో గְּאֻלָּה విమోచన చర్యనే కాక, విమోచన కోసం తిరిగి చెల్లించాల్సిన మొత్తాన్ని కూడా సూచించగలదు; ‘విమోచన వెల’ ఆ నిర్దిష్ట ఆర్థిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: తనను కొన్న సొమ్ములోనుంచి
  rationale: ‘అతని కొనుగోలు సొమ్ములోనుంచి’ అనే హీబ్రూ భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ, లెక్కకు మూలమైన అసలు కొనుగోలు మొత్తాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చట్టపరమైన శైలిని ఉపయోగించాం. మూలంలోని నిష్పత్తి భావాన్ని స్పష్టంగా ఉంచి, విమోచనకు సంబంధించిన నామవాచకంలోని నిజమైన అర్థసంభావ్యతను పాదటిప్పణిలో నిలిపాం.
