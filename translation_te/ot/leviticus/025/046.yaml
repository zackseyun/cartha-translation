  text: וְ/הִתְנַחֲלְתֶּ֨ם אֹתָ֜/ם לִ/בְנֵי/כֶ֤ם אַחֲרֵי/כֶם֙ לָ/רֶ֣שֶׁת אֲחֻזָּ֔ה לְ/עֹלָ֖ם בָּ/הֶ֣ם תַּעֲבֹ֑דוּ וּ/בְ/אַ֨חֵי/כֶ֤ם בְּנֵֽי יִשְׂרָאֵל֙ אִ֣ישׁ בְּ/אָחִ֔י/ו לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָֽרֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: te
  text: మీరు వారిని మీ తరువాత మీ కుమారులకు వారసత్వంగా సంక్రమింపజేయవచ్చు[a], వారు వారిని శాశ్వత స్వాస్థ్యంగా స్వాధీనం చేసుకొనుటకు. వారి చేత మీరు పని చేయించవచ్చు. అయితే ఇశ్రాయేలు కుమారులైన మీ సహోదరులలో ఎవడూ తన సహోదరునిమీద కఠినంగా అధికారం చెలాయించకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ తరువాత మీ కుమారులకు వారిని వంశపారంపర్య ఆస్తిగా సంక్రమింపజేయవచ్చు.”
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు,” “ఇశ్రాయేలు కుమారులు” అనే మాటలు హీబ్రూలోని పుంలింగ బంధుత్వ పదాలను నేరుగా ప్రతిబింబిస్తాయి; ఇక్కడ అవి తోటి ఇశ్రాయేలీయులను ఒడంబడిక బంధువులుగా సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: వారసత్వంగా అప్పగించవచ్చు
  rationale: హిత్పయేల్ రూపం వారసత్వ ఆస్తిగా తరువాతి తరానికి సంక్రమింపజేయడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది; ఈ తెలుగు ప్రయోగం ఆ సంక్రమణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: మీ తరువాత మీ కుమారులకు
  rationale: בנים అనే మూలంలోని స్పష్టమైన పుంలింగ బంధుత్వ పదాన్ని ‘పిల్లలు’ అని తటస్థీకరించకుండా ‘కుమారులు’గా నేరుగా అనువదించాం.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: స్వాస్థ్యంగా వారసత్వంగా పొందవచ్చు
  rationale: אֲחֻזָּה లోని స్వాధీన ఆస్తి భావాన్నీ, ירש లోని వారసత్వంగా పొందే భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: לְעֹלָם
  choice: శాశ్వత
  rationale: ఈ న్యాయ సందర్భంలో దీర్ఘకాలికమైన, నిలిచివుండే ఆస్తి హోదాను సూచిస్తుంది; అధిభౌతిక నిత్యత్వాన్ని బలవంతంగా చొప్పించదు.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: వారితో మీరు పని చేయించవచ్చు
  rationale: ఈ సందర్భంలో עבד స్వచ్ఛంద సేవను కాక, యజమాని చేయించే శ్రమను సూచిస్తుంది. ‘పని చేయించవచ్చు’ ఆధునిక తెలుగులో బలవంతపు శ్రమ వాస్తవాన్ని మృదూకరించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: మీ సహోదరులైన ఇశ్రాయేలీయులలో
  rationale: ఇశ్రాయేలీయులను ఒడంబడిక బంధువులుగా చూపే ‘సహోదరులు’ అనే రూపకాన్ని నిలుపుతూ, అనుబంధ పదబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ בְּאָחִיו
  choice: ఎవడూ తన సహోదరునిపై
  rationale: ప్రతి వ్యక్తి తన తోటి ఇశ్రాయేలీయునితో ఎలా ప్రవర్తించాలో తెలిపే పంపిణీ భావాన్ని నిషేధ వాక్యంలో సహజంగా అందిస్తుంది.
- source_word: לֹא תִרְדֶּה בוֹ
  choice: అధికారం చెలాయించకూడదు
  rationale: רדה లోని పాలించడం లేదా ఆధిపత్యం చూపడం అనే భావాన్ని, తరువాతి ‘కఠినంగా’ అనే క్రియావిశేషణంతో కలిసి స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּפָרֶךְ
  choice: కఠినంగా
  rationale: బలవంతపు శ్రమ సందర్భంలోని నిర్దయ కాఠిన్యాన్ని సంక్షిప్తమైన, సహజ తెలుగు పదంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు సామాజిక ధర్మశాస్త్రంలోని బంధుత్వ భాష
  choice: ‘కుమారులు’, ‘సహోదరులు’ అనే పుంలింగ బంధుత్వ పదాలను నిలుపడం
  alternative: ‘పిల్లలు’, ‘తోటి ఇశ్రాయేలీయులు’ వంటి లింగతటస్థ పదాలు
  rationale: హీబ్రూ మూలం న్యాయపరమైన వారసత్వాన్నీ, ఒడంబడిక బంధుత్వాన్నీ స్పష్టమైన పుంలింగ పదాలతో రూపొందిస్తుంది. వాటిని నిలుపడం మూలంలోని సామాజిక-న్యాయ నిర్మాణాన్ని పారదర్శకంగా ఉంచుతుంది.
- issue: దాసత్వం మరియు ఆస్తి భాషను ఎంత నేరుగా అనువదించాలి
  choice: వారసత్వం, స్వాస్థ్యం, చేయించబడే శ్రమ అనే భాషను స్పష్టంగా ఉంచడం
  alternative: యాజమాన్య భావాన్ని తగ్గించే ‘సేవకులు’ లేదా సాధారణ సేవా భాష
  rationale: హీబ్రూ పాఠం మనుషులను వారసత్వ స్వాస్థ్యంగా ఉంచడాన్నీ వారి నుండి శ్రమ పొందడాన్నీ స్పష్టంగా చెబుతుంది. దాని న్యాయపరమైన మరియు నైతిక భారాన్ని మృదూకరించకుండా నిలుపాం.
- issue: לְעֹלָם యొక్క కాలవ్యాప్తి
  choice: న్యాయపరమైన శాశ్వత హోదాగా అనువదించడం
  alternative: అధిభౌతిక అర్థంలో ‘ఎప్పటికీ’
  rationale: ఈ సందర్భం వారసత్వ ఆస్తి హోదా కొనసాగింపును గురించి ఉంది. అందువల్ల ‘శాశ్వత’ మూలబలాన్ని నిలుపుతూ సందర్భానికి మించిన తాత్త్విక నిర్ణయాన్ని విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘వారసత్వం’, ‘స్వాస్థ్యం’, ‘అధికారం చెలాయించడం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా మూలంలోని ఆస్తి, బలవంతపు శ్రమ, బంధుత్వ భేదాలను మృదూకరించవు. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
