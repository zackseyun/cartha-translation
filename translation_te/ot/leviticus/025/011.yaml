  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: te
  text: ఇది యోబేలు సంవత్సరం[a]; యాభైయవ సంవత్సరం మీకు యోబేలు సంవత్సరంగా ఉండాలి. మీరు విత్తకూడదు; దానంతట అదే మొలిచిన పంటను కోయకూడదు; కత్తిరించకుండా వదిలిన తీగల ద్రాక్షపండ్లను ఏరుకోకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యోబేలు’ అనేది ఇశ్రాయేలులో యాభైయవ సంవత్సరానికి వాడిన ప్రత్యేక పేరు.
    reason: lexical_explanation
  - marker: b
    text: ‘కత్తిరించకుండా వదిలిన తీగల ద్రాక్షపండ్లు’ అనే హీబ్రూ పదబంధం, సంరక్షణ చేయకుండా పెరగనిచ్చిన తీగల ద్రాక్షపండ్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹבֵל
  choice: యోబేలు సంవత్సరం
  rationale: ఈ సందర్భంలో ఈ పదం పొట్టేలు కొమ్మును కాక, యాభైయవ సంవత్సరంగా ఆచరించే ప్రత్యేక వ్యవస్థను సూచిస్తుంది. స్థిరపడిన బైబిలు పదాన్ని ఉంచి, దాని భావాన్ని పాదటీపులో వివరించాం.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: యాభైయవ సంవత్సరం
  rationale: హీబ్రూ నిర్మాణంలోని క్రమసంఖ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִּהְיֶה לָכֶם
  choice: మీకు అలా ఉండాలి
  rationale: హీబ్రూలోని ‘మీకు/మీ కోసం ఉండాలి’ అనే దత్తార్థాన్ని నిలుపుతూ, ముందున్న ‘యోబేలు సంవత్సరం’తో సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: לֹא תִזְרָעוּ
  choice: మీరు విత్తకూడదు
  rationale: ధర్మశాస్త్ర ఆజ్ఞలోని నిషేధాన్ని స్పష్టమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: לֹא תִקְצְרוּ
  choice: కోయకూడదు
  rationale: ధాన్యపు పంట కోతను తరువాతి ద్రాక్షపండ్ల సేకరణ నుంచి వేరు చేస్తుంది.
- source_word: סְפִיחֶיהָ
  choice: దానంతట అదే మొలిచిన పంట
  rationale: విత్తకుండానే మునుపటి గింజల నుంచి స్వయంగా మొలిచే పంటను సూచించే హీబ్రూ భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תִבְצְרוּ
  choice: ఏరుకోకూడదు
  rationale: ద్రాక్షపండ్లను కోసి సేకరించడానికి ప్రత్యేకంగా వాడే క్రియాభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נְזִרֶיהָ
  choice: కత్తిరించకుండా వదిలిన ద్రాక్షతీగలు
  rationale: ఇక్కడ పదం సంరక్షణ చేయకుండా, కత్తిరించకుండా వదిలిన తీగల పెరుగుదలను సూచిస్తుంది; ‘ప్రతిష్ఠితమైనవి’ అనే శబ్దార్థాన్ని సందర్భానికి విరుద్ధంగా బలవంతంగా ప్రయోగించదు.
theological_decisions:
- issue: యోబేలు అనే సంస్థకు అర్థవ్యాఖ్యానం
  choice: మూలపాఠంలో ‘యోబేలు’ అనే పేరును ప్రధాన వచనంలో నిలుపడం
  alternative: ప్రధాన వచనంలోనే ‘విడుదల సంవత్సరం’ అని అనువదించడం
  rationale: లేవీయకాండము 25లో విడుదల ఈ సంవత్సరపు ముఖ్య లక్షణమైనప్పటికీ, יוֹבֵל అనే సంస్థాపిత పేరును కేవలం ఒక లక్షణంతో సమానం చేయకుండా అసలు పదాన్ని నిలిపాం; అర్థసహాయం పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర వచనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకుడికి అర్థమయ్యే వ్యవసాయ పదజాలంతోనూ రూపొందించబడింది. హీబ్రూ ఆరంభంలోని రెండు భాగాల నిర్మాణాన్ని ‘అది యోబేలు సంవత్సరం; యాభైయవ సంవత్సరం మీకు అలా ఉండాలి’ అని ఉంచి, దానిని ఒకే సాఫీ వాక్యంగా మార్చి మూలంలోని పునరుక్తిని తొలగించలేదు.
