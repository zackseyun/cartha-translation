  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: te
  text: ఒకవేళ మీరు, “ఏడవ సంవత్సరంలో మేము ఏమి తింటాం? ఇదిగో, మేము విత్తము, మా పంటను సేకరించము” అని అడిగితే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: ఒకవేళ మీరు … అని అడిగితే
  rationale: షరతుతో కూడిన ప్రత్యక్ష ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘చెబితే’ కంటే సందర్భంలో ‘అడిగితే’ సహజం.
- source_word: הֵן
  choice: కదా
  rationale: తర్వాతి ప్రశ్నకు ఆధారాన్ని లేదా స్పష్టమైన పరిస్థితిని చూపే హెబ్రీయ సమర్థక అవ్యయ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לֹא נִזְרָע
  choice: మేము విత్తము
  rationale: మొదటి పురుష బహువచన క్రియను నేరుగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: וְלֹא נֶאֱסֹף אֶת־תְּבוּאָתֵנוּ
  choice: మా పంటను సమకూర్చుకోము
  rationale: אסף యొక్క ‘సేకరించు/కూర్చు’ భావాన్ని కోత లేదా పంట సేకరణ సందర్భానికి సరిపోయేలా వ్యక్తం చేస్తుంది; תבואהను ‘పంట’గా సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాస్త్ర ప్రసంగానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ప్రశ్న మరియు దానికి ఆధారమైన పరిస్థితి మధ్య సంబంధాన్ని ‘కదా’తో నిలిపింది.
