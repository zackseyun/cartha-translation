source:
  edition: WLC
  text: וְ/חִשַּׁב֙ אֶת שְׁנֵ֣י מִמְכָּר֔/וֹ וְ/הֵשִׁיב֙ אֶת הָ֣/עֹדֵ֔ף לָ/אִ֖ישׁ אֲשֶׁ֣ר מָֽכַר ל֑/וֹ וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/027.yaml
  text: then he shall calculate the years since its sale and return the surplus to the man to whom he sold it, and he shall return to his property.
translation:
  language: te
  text: అప్పుడు అతడు అది అమ్మబడినప్పటి నుంచి గడిచిన సంవత్సరాలను లెక్కించి, మిగిలిన మొత్తాన్ని[a] తాను దానిని అమ్మిన వ్యక్తికి తిరిగి చెల్లించాలి; ఆ తర్వాత అతడు తన స్వాస్థ్యానికి[b] తిరిగి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిగులు’ లేదా ‘అదనపు మొత్తం.’ ఉపయోగించకుండా మిగిలిన సంవత్సరాల విలువను లెక్కించిన తర్వాత మిగిలే మొత్తాన్ని హీబ్రూ పదం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘స్వాస్థ్యం’ అంటే ఇక్కడ అతనికి చెందిన భూభాగం; అది ఇశ్రాయేలులోని అతని వంశపారంపర్య భూవాటా అయి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: అప్పుడు అతడు ... లెక్కించి
  rationale: חִשַּׁב ఇక్కడ విమోచన ధరను లెక్కించడాన్ని సూచిస్తుంది. సందర్భంలోని విధానక్రమాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘అప్పుడు’ వాడబడింది.
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: అది అమ్మబడినప్పటి నుంచి గడిచిన సంవత్సరాలను
  rationale: అక్షరార్థంగా ‘దాని అమ్మకపు సంవత్సరాలు.’ భూమిని తిరిగి విడిపించే సందర్భంలో అమ్మకం జరిగినప్పటి నుంచి గడిచిన సంవత్సరాల సంఖ్య ఉద్దేశించబడింది; తెలుగు పాఠకునికి లెక్కింపు భావం స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: וְהֵשִׁיב
  choice: తిరిగి చెల్లించాలి
  rationale: שׁוב హిఫీల్ రూపం ఇక్కడ మిగిలిన విలువను కొనుగోలుదారునికి తిరిగి ఇవ్వడం లేదా చెల్లించడాన్ని సూచిస్తుంది. ఆర్థిక సందర్భంలో ‘తిరిగి చెల్లించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָעֹדֵף
  choice: మిగిలిన మొత్తాన్ని
  rationale: עודף లెక్కించిన తర్వాత మిగిలే అదనపు భాగాన్ని సూచిస్తుంది. ఇది ధనసంబంధమైన మొత్తమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: తాను దానిని అమ్మిన వ్యక్తికి
  rationale: అక్షరార్థంలోని వ్యక్తిగత సూచనను నిలుపుతూ, తెలుగులో కొనుగోలుదారుని స్పష్టంగా గుర్తించే సహజ నిర్మాణం.
- source_word: וְשָׁב
  choice: తిరిగి వెళ్లాలి
  rationale: Qal שׁוב అమ్మినవాడు విమోచన అనంతరం తన భూస్వాస్థ్యానికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది. విధినియమ శైలిని ‘వెళ్లాలి’ నిలుపుతుంది.
- source_word: לַאֲחֻזָּתוֹ
  choice: తన స్వాస్థ్యానికి
  rationale: אֲחֻזָּה లేవీయకాండంలోని భూవ్యవస్థలో కేవలం సాధారణ ఆస్తి కాక, వ్యక్తికి లేదా కుటుంబానికి కేటాయించబడిన భూస్వాధీనాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఈ న్యాయ-సాంస్కృతిక భావాన్ని సంక్షిప్తంగా మోస్తుంది.
theological_decisions:
- issue: యూబిలీ ధర్మశాసనంలో אֲחֻזָּה స్వభావం
  choice: స్వాస్థ్యం
  alternative: ఆస్తి; వంశపారంపర్య భూస్వాస్థ్యం
  rationale: ఈ పదం ఇశ్రాయేలు భూవ్యవస్థలో వ్యక్తి లేదా కుటుంబానికి చెందిన భూభాగాన్ని సూచిస్తుంది. ‘వంశపారంపర్య’ అని ప్రధాన పాఠంలో చేర్చడం మూలపదంలోని సాధ్యమైన భావాన్ని అతిగా నిర్దిష్టం చేయవచ్చు; అందువల్ల సంక్షిప్తమైన ‘స్వాస్థ్యం’ను ఉంచి, సాంస్కృతిక నేపథ్యాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-విధాన శైలి వాడబడింది. ‘తిరిగి చెల్లించాలి’ మరియు ‘తిరిగి వెళ్లాలి’ అనే రూపాలు రెండు שׁוב రూపాల భావసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగులో సహజత్వాన్ని కాపాడుతాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో సంబంధిత పదం వెంట ఉంచబడింది.
