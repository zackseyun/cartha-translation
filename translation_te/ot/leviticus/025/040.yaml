  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: te
  text: అతడు నీ దగ్గర వేతన కార్మికునిలా, స్థిరనివాసి అయిన పరదేశిలా ఉండాలి; యూబిలీ సంవత్సరంవరకు అతడు నీ దగ్గర పనిచేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: కూలివానిలా
  rationale: שָׂכִיר వేతనానికి పనిచేసే వ్యక్తిని సూచిస్తుంది. ‘కూలివాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఇక్కడ అతడు బానిస కాదనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: כְּתוֹשָׁב
  choice: నీ మధ్య నివసించే పరదేశిలా
  rationale: תּוֹשָׁב స్థానికుడు కాకపోయినా సమాజంలో నివసించే వ్యక్తిని సూచించే సామాజిక-న్యాయ పదం. ‘నివసించే పరదేశి’ అతని విదేశీయతతో పాటు స్థిరనివాస భావాన్నీ తెలియజేస్తుంది.
- source_word: יִהְיֶה עִמָּךְ
  choice: నీ దగ్గర ... ఉండాలి
  rationale: עִמָּךְ యొక్క సంబంధార్థాన్ని సహజమైన తెలుగులో ‘నీ దగ్గర’గా వ్యక్తపరుస్తూ, రెండు పోలికల ద్వారా అతని హోదాను తెలుపుతుంది.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: సునాద సంవత్సరంవరకు
  rationale: יוֹבֵל లేవీయకాండము 25లో విడుదలకు సంబంధించిన ప్రత్యేక సంవత్సరాన్ని సూచిస్తుంది. ‘సునాద సంవత్సరం’ కొమ్ము ఊదే ప్రకటనతో ముడిపడిన సాంకేతిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: יַעֲבֹד עִמָּךְ
  choice: అతడు నీ దగ్గర పనిచేయాలి
  rationale: עבד ఇక్కడ సేవచేయడం లేదా పనిచేయడం అనే భావం కలిగి ఉంది. పరిసర వచనాలు బానిసగా చూడడాన్ని నిషేధిస్తున్నందున ‘పనిచేయాలి’ అనవసరమైన బానిసత్వ ఛాయను నివారిస్తుంది; עִמָּךְ ను ‘నీ దగ్గర’గా నిలుపుతుంది.
theological_decisions:
- issue: అప్పు కారణంగా సేవచేసే ఇశ్రాయేలీయుని హోదా
  choice: బానిసగా కాక, కూలివానితోను నివాస పరదేశితోను పోల్చబడిన తాత్కాలిక పనివానిగా అనువదించబడింది.
  alternative: ‘దాసునిలా సేవచేయాలి’ అని అనువదించడం.
  rationale: తక్షణ సందర్భం (లేవీ 25:39-43) అతనిని బానిస హోదా నుండి వేరు చేసి, అతని పనిని తాత్కాలికంగాను పరిరక్షితంగాను నియంత్రిస్తుంది. అందువల్ల మూలపాఠంలోని עבד భావాన్ని ‘పనిచేయాలి’గా ఇవ్వడం సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన న్యాయశైలి. హీబ్రూ עִמָּךְ పునరుక్తిని రెండు చోట్ల ‘నీ దగ్గర’గా నిలిపింది. మూలపాఠంలో స్పష్టమైన ప్రత్యామ్నాయ పాఠం అవసరం లేకపోవడంతో పాదటిప్పణి చేర్చలేదు.
