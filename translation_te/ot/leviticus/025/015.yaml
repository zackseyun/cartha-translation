id: LEV.25.15
reference: Leviticus 25:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: te
  text: యోబేలు సంవత్సరం[a] తర్వాతి సంవత్సరాల సంఖ్యను బట్టి నీవు నీ తోటి మనిషి నుండి కొనాలి; పంటల సంవత్సరాల సంఖ్యను బట్టి అతడు నీకు అమ్మాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పంటల సంవత్సరాల సంఖ్యను బట్టి.’ అమ్మకం ధర భూమిని శాశ్వతంగా బదిలీ చేయడంపై కాక, తదుపరి యోబేలు సంవత్సరం వరకు పంటలు పండే సంవత్సరాలు ఎన్ని మిగిలి ఉన్నాయనే దానిపై ఆధారపడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: సంవత్సరాల సంఖ్యను బట్టి
  rationale: בְּ ఉపసర్గతో కూడిన מִסְפָּר ఇక్కడ కొలమానం లేదా లెక్కింపు ప్రమాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సంఖ్యను బట్టి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אַחַר הַיּוֹבֵל
  choice: విడుదల సంవత్సరం గడిచిన తరువాతి
  rationale: יוֹבֵל లేవీయకాండము 25లో ఆస్తి తిరిగి అప్పగింపు, బానిసల విడుదల జరిగే ప్రత్యేక సంవత్సరాన్ని సూచిస్తుంది. ‘విడుదల సంవత్సరం’ సాధారణ పాఠకునికి దాని సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; אַחַר యొక్క కాలసంబంధ భావాన్ని ‘గడిచిన తరువాతి’ వ్యక్తం చేస్తుంది.
- source_word: תִּקְנֶה
  choice: నీవు ... కొనాలి
  rationale: చట్టపరమైన ఆదేశంలో ఉన్న 2వ పురుష ఏకవచన అసంపూర్ణ క్రియ యొక్క నిర్దేశక బలాన్ని ‘కొనాలి’ నిలుపుతుంది.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: నీ తోటి వ్యక్తి దగ్గర
  rationale: עָמִית్ ఇక్కడ సమాజంలోని సహసభ్యుణ్ణి సూచిస్తుంది. ‘తోటి వ్యక్తి’ అనవసరంగా జాతి లేదా బంధుత్వ భావాన్ని చేర్చకుండా వ్యక్తిగత, న్యాయసంబంధ భావాన్ని ఇస్తుంది.
- source_word: שְׁנֵי תְבוּאֹת
  choice: పంటలు వచ్చే సంవత్సరాలు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘దిగుబడుల/పంటల సంవత్సరాలు’; కేవలం క్యాలెండర్ సంవత్సరాలు కాక, తదుపరి విడుదల సంవత్సరం వరకు పంట దిగుబడి లభించే సంవత్సరాలనే లెక్కలోకి తీసుకోవాలనే ఆర్థిక భావాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יִמְכָּר לָךְ
  choice: అతడు నీకు అమ్మాలి
  rationale: 3వ పురుష ఏకవచన క్రియను స్పష్టంగా ఉంచి, కొనుగోలుదారునికి ఇచ్చిన ఆదేశంతో ఉన్న చట్టపరమైన సమాంతరతను నిలుపుతుంది.
