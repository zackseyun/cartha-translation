translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. మూలంలోని కొనడం–అమ్మడం సమాంతర నిర్మాణాన్ని నిలిపి, ‘పంటలు వచ్చే సంవత్సరాలు’ ద్వారా שְׁנֵי תְבוּאֹת యొక్క వ్యవసాయ-ఆర్థిక భావాన్ని స్పష్టం చేశాం.
