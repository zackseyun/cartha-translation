id: LEV.25.8
reference: Leviticus 25:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סָפַרְתָּ֣ לְ/ךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְ/הָי֣וּ לְ/ךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַ/שָּׁנִ֔ים תֵּ֥שַׁע וְ/אַרְבָּעִ֖ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: te
  text: “నీవు నీ కొరకు సంవత్సరాల ఏడు విశ్రాంతి-చక్రాలను[a] లెక్కించాలి—ఏడు సంవత్సరాలను ఏడు సార్లు. ఆ సంవత్సరాల ఏడు విశ్రాంతి-చక్రాల దినాలు నీకు నలభై తొమ్మిది సంవత్సరాలు అవుతాయి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంవత్సరాల ఏడు వారాలు.” హీబ్రూ పాఠంలో అక్షరార్థంగా “సంవత్సరాల ఏడు సబ్బాతులు” అని ఉంది; ఇది ఒక్కొక్కటి ఏడు సంవత్సరాలుగా ఉండే ఏడు చక్రాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  choice: నీవు ... లెక్కించాలి
  rationale: ספר అనే క్రియకు ఇక్కడ కాలవ్యవధులను లెక్కించడం అనే అర్థం. לְךָ లోని వ్యక్తిగత సూచనను తెలుగు వాక్యంలోని ‘నీవు’ మరియు చివరి భాగంలోని ‘నీకు’ సహజంగా నిలుపుతున్నాయి.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: ఏడు సంవత్సరాల విశ్రాంతికాలాలు
  rationale: ఈ సందర్భంలో שַׁבְּתֹת సాధారణ వారపు సబ్బాతులను కాక, ఒక్కొక్కటి ఏడు సంవత్సరాలుగా ఉండే చక్రాలను సూచిస్తుంది. ‘విశ్రాంతికాలాలు’ అనేది విశ్రాంతి సంవత్సరాల చట్టంతో ఉన్న సంబంధాన్ని తెలియజేస్తూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: ఏడు సంవత్సరాలను ఏడు సార్లు
  rationale: హీబ్రూ పునరుక్త నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతూ, ఏడు సంవత్సరాల కాలం ఏడుసార్లు లెక్కించబడాలని తెలియజేస్తుంది.
- source_word: יְמֵי שֶׁבַע שַׁבְּתֹת הַשָּׁנִים
  choice: ఆ ఏడు సంవత్సరాల విశ్రాంతికాలాల దినాలు
  rationale: יְמֵי యొక్క అక్షరార్థమైన ‘దినాలు’ను నిలిపి, ముందు చెప్పిన కాలచక్రాలను సూచించడానికి ‘ఆ’ ఉపయోగించబడింది.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: నలభై తొమ్మిది సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని సహజమైన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
theological_decisions:
- issue: שַׁבְּתֹת అనే పదం ఇక్కడ వారపు సబ్బాతులా, ఏడు సంవత్సరాల చక్రాలా
  choice: ప్రధాన పాఠ్యంలో ‘సంవత్సరాల విశ్రాంతికాలాలు’
  alternative: ‘సంవత్సరాల సబ్బాతులు’ లేదా ‘సంవత్సరాల వారాలు’
  rationale: సందర్భం ఏడు సంవత్సరాల చక్రాలను స్పష్టంగా సూచిస్తుంది. అయినా మూలంలోని సబ్బాతు/విశ్రాంతి భావాన్ని ‘విశ్రాంతికాలాలు’ ద్వారా నిలిపి, ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘దినాలు’ అనే కాలవ్యవధి ప్రయోగం మరియు 7×7 నిర్మాణం నిలుపబడ్డాయి.
