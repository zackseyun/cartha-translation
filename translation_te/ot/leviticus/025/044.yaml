  text: וְ/עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ אֲשֶׁ֣ר יִהְיוּ לָ֑/ךְ מֵ/אֵ֣ת הַ/גּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם מֵ/הֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְ/אָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: te
  text: మీకు ఉండబోయే పురుష బానిసలనూ స్త్రీ బానిసలనూ మీ చుట్టుపక్కల ఉన్న జనాంగాల నుండి కొనవచ్చు; వారినుండే పురుష బానిసనూ స్త్రీ బానిసనూ కొనవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ బానిసలనూ బానిస స్త్రీలనూ.” హీబ్రూలో పురుష, స్త్రీ పదాలు వేర్వేరుగా ఉన్నాయి. కొనుగోలు, యాజమాన్యం స్పష్టంగా ఉన్న సందర్భం కాబట్టి ప్రధాన పాఠంలో “బానిస” అనే పదం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: మీకు చెందిన దాసులూ దాసీలూ
  rationale: కొనుగోలు, యాజమాన్యం స్పష్టంగా ఉన్న ఈ న్యాయ సందర్భంలో ‘దాసుడు/దాసి’ అనే పదాలు బానిస స్థితిని ‘సేవకుడు/సేవకురాలు’ కంటే స్పష్టంగా తెలియజేస్తాయి; హీబ్రూలోని పురుష-స్త్రీ భేదాన్ని కూడా నిలుపుతాయి.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: మీకు చెందిన
  rationale: ఈ సంబంధవాక్యం వారు సంబోధితుల ఆధీనంలో లేదా యాజమాన్యంలో ఉండడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో భావాన్ని సంక్షిప్తంగా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: మీ చుట్టూ ఉన్న జనాల నుండి
  rationale: גּוֹיִם ఇక్కడ ఇశ్రాయేలు చుట్టూ ఉన్న ఇశ్రాయేలేతర ప్రజలను సూచిస్తుంది. ‘జనాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అనవసరమైన మతపరమైన అదనపు భావాన్ని మోపదు.
- source_word: מֵהֶם
  choice: వారి నుండే
  rationale: ముందు పేర్కొన్న చుట్టుపక్కల జనాలనే మూలంగా నొక్కిచెప్పే హీబ్రూ పునరుక్తిని ‘నుండే’తో నిలిపింది.
- source_word: תִּקְנוּ
  choice: మీరు ... కొనవచ్చు
  rationale: קנה అంటే కొనడం లేదా సంపాదించుకోవడం. ఈ చట్టపరమైన సందర్భంలో ఇది ఆజ్ఞ కంటే అనుమతిని తెలియజేస్తుంది; అందుకే ‘కొనవచ్చు’ అని అనువదించబడింది.
- source_word: עֶבֶד וְאָמָה
  choice: దాసుణ్ణి, దాసిని
  rationale: ఏకవచన పురుష-స్త్రీ జంటను యథాతథంగా ఉంచి, రెండు వర్గాలనూ స్పష్టంగా తెలిపింది.
theological_decisions:
- issue: దాసత్వ పదజాలాన్ని న్యాయపాఠంలో అనువదించడం
  choice: עֶבֶד/אָמָה పదాలకు ‘దాసుడు/దాసి’ వాడడం
  alternative: సేవకుడు/సేవకురాలు
  rationale: ఈ వచనం వ్యక్తులను కొనడం మరియు వారు ఎవరికో చెందడం గురించి స్పష్టంగా మాట్లాడుతుంది. కాబట్టి బంధిత, యాజమాన్య స్థితిని మృదువుచేయకుండా తెలియజేయడం అవసరం.
- issue: תִּקְנוּ అనే అసంపూర్ణ క్రియారూపం యొక్క సందర్భబలం
  choice: అనుమతిగా ‘కొనవచ్చు’
  alternative: ఆజ్ఞగా ‘కొనాలి’ లేదా సాధ్యతగా ‘కొనగలరు’
  rationale: పరిసర నియమాలలో ఇది కొనుగోలు చేయమనే ఆజ్ఞ కాదు; ఎక్కడి నుండి కొనడానికి అనుమతి ఉందో నిర్దేశిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయవాక్య శైలి. ‘వారి నుండే’ ద్వారా మూలంలోని పునరుక్తి, నొక్కింపు నిలుపబడింది; దాసత్వ వాస్తవాన్ని మృదువుచేయలేదు.
