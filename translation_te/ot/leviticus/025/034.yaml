source:
  edition: WLC
  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: te
  text: అయితే వారి పట్టణాలకు చెందిన పచ్చికభూమిని[a] అమ్మకూడదు; ఎందుకంటే అది వారికి శాశ్వత స్వాస్థ్యం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పట్టణాల ఉమ్మడి భూమి” లేదా “వారి పట్టణాల చుట్టూ ఉన్న బహిరంగ భూమి.” హీబ్రూ పదం మִגְרָשׁ లేవీయుల పట్టణాల చుట్టూ ఉన్న ఈ భూమిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎప్పటికీ వారికి చెందిన స్వాస్థ్యం.” హీబ్రూ עוֹלָם పదం దీర్ఘకాలిక శాశ్వతత్వాన్ని సూచించవచ్చు; ఇక్కడ ఈ భూమి ఇతరులకు బదిలీ చేయరానిదిగా వారికి చెందిన స్థితిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/שְׂדֵה
  choice: అయితే … భూమిని
  rationale: שָׂדֶהను ‘భూమి’గా అనువదించి, ముందటి వచనంలోని ఇళ్ల అమ్మకానికి ఉన్న అనుమతితో ఇక్కడి నిషేధానికి గల వ్యత్యాసాన్ని וּ సూచిస్తున్నందున ‘అయితే’ అని ఇచ్చాం.
- source_word: מִגְרַשׁ
  choice: పచ్చికబయళ్ల
  rationale: మִגְרָשׁ లేవీయుల పట్టణాల చుట్టూ పశువుల మేతకు లేదా ఉమ్మడి వినియోగానికి ఉంచిన బహిరంగ భూమిని సూచిస్తుంది; ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: עָרֵי/הֶם
  choice: వారి పట్టణాలకు చెందిన
  rationale: హీబ్రూ సంబంధపదబంధంలోని స్వామ్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יִמָּכֵר
  choice: అమ్మకూడదు
  rationale: నిఫాల్ క్రియారూపంలోని ‘అమ్మబడకూడదు’ అనే న్యాయపరమైన నిషేధాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ అమ్మకపు నిషేధానికి తరువాత వచ్చే కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: אֲחֻזַּת עוֹלָם
  choice: ఎప్పటికీ వారికే ఉండే స్వాస్థ్యం
  rationale: అֲחֻזָּה భూసంబంధమైన స్వాస్థ్యాన్ని, עוֹלָם ఇక్కడ దాని శాశ్వతంగా బదిలీ చేయరాని స్థితిని సూచిస్తాయి; ఈ పదబంధం న్యాయపరమైన నిరంతరత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוּא לָ/הֶם
  choice: అది … వారికే ఉండే
  rationale: ఆ భూమి వారికి చెందినదనే భావాన్ని, అలాగే దాని అన్యాక్రాంతం కాని స్వభావాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు భూనియమంలో עוֹלָם పదానికి ఉన్న బలం
  choice: ‘ఎప్పటికీ వారికే ఉండే’ అని అనువదించడం
  alternative: ‘శాశ్వతమైన’ లేదా ‘నిత్యమైన’ స్వాస్థ్యం
  rationale: ఈ న్యాయ సందర్భంలో עוֹלָם ఆ భూమి ఒడంబడిక వ్యవస్థలో నిరంతరం వారికి చెందినదిగా, శాశ్వతంగా బదిలీ చేయరానిదిగా ఉండటాన్ని సూచిస్తుంది; కాలాతీతమైన తాత్త్విక నిత్యత్వాన్ని తప్పనిసరిగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయశైలిని ఉపయోగించాం. ‘అమ్మకూడదు’ సహజమైన నిషేధరూపం; ‘స్వాస్థ్యం’ భూహక్కు భావాన్ని కాపాడుతుంది. మూలంలోని నిర్మాణాన్ని నిలుపుతూ అతిగా పదానువాదం కాకుండా వాక్యాన్ని ప్రవాహవంతంగా తీర్చిదిద్దాం.
