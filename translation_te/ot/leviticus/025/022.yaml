translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పంట చేతికి రావడం’ అనే సహజ వ్యవసాయ నుడికారాన్ని ఉపయోగించి, మూలంలోని భావాన్ని నిలిపాం; ‘పాత పంట’ పునరావృతాన్ని కూడా కాపాడాం.
