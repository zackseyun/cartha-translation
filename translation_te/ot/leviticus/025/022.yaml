source:
  edition: WLC
  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: te
  text: మీరు ఎనిమిదవ సంవత్సరంలో విత్తి, తొమ్మిదవ సంవత్సరం వరకు పాత పంటను తింటారు; ఆ సంవత్సరం పంట వచ్చేవరకు[a] మీరు పాత పంటను తింటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో రెండు చోట్లా అక్షరార్థంగా “పాతది” అని ఉంది; సందర్భాన్ని బట్టి “పంట” అని అర్థం చేసుకోవాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: మీరు ... విత్తుతారు
  rationale: న్యాయబోధ సందర్భంలో సంయోజకంతో వచ్చిన Qal perfect భావి కార్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన భావిరూపం దీనిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: ఎనిమిదవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే సహజ తెలుగు విభక్తితో మూలంలోని క్రమసంఖ్యను నేరుగా అందిస్తుంది.
- source_word: וַאֲכַלְתֶּם
  choice: తింటారు
  rationale: ముందటి క్రియతో సమన్వయంగా ఉన్న భావి కార్యాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: పాత పంటనే
  rationale: תְּבוּאָה వ్యవసాయ దిగుబడి లేదా పంటను సూచిస్తుంది; יָשָׁן సందర్భానుసారంగా మునుపటి పంటను సూచిస్తుంది. ‘నే’ పాత పంటను కొనసాగించి తినడంపై ఉన్న ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: తొమ్మిదవ సంవత్సరం వరకు
  rationale: మూలంలోని కాలపరిమితిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: ఆ సంవత్సరం పంట చేతికి వచ్చేవరకు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం సమీపంలోని తొమ్మిదవ సంవత్సరాన్నే సూచిస్తుంది. ‘చేతికి రావడం’ పంట అందుబాటులోకి రావడాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: పాత పంటనే తింటారు
  rationale: మూలంలో ‘పాతది’ అనే పదం పునరావృతమవుతుంది; తెలుగులో అర్థస్పష్టత కోసం సందర్భంలో అంతర్భూతమైన ‘పంట’ను చేర్చి, పునరుక్తిని నిలిపింది.
