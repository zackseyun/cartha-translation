  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: te
  text: అతని నుండి వడ్డీగానీ, అదనపు లాభంగానీ తీసుకోకు[a]. నీ దేవునికి భయపడు; నీ సహోదరుడు[b] నీతో కలిసి జీవించనివ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అదనపు లాభం’కు ‘పెరుగుదల’ లేదా ‘రాబడి’ అని కూడా అనువదించవచ్చు. పేద అప్పుదారుని నుంచి వసూలు చేసే వడ్డీ లేదా అదనపు మొత్తాన్ని సూచించే సంబంధిత రెండు హీబ్రూ పదాలు ఇక్కడ జతగా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరుడు’ అంటే తప్పనిసరిగా ఒకే తల్లిదండ్రులకు పుట్టినవాడు కాదు; నిబంధన సమాజంలోని తోటి సభ్యుడు.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: తీసుకోకు
  rationale: אַל తో కూడిన అసంపూర్ణ క్రియ నేరమైన నిషేధాన్ని వ్యక్తం చేస్తుంది; ‘తీసుకోకు’ ఆధునిక తెలుగులో సహజంగా, బలంగా ఉంది.
- source_word: מֵאִתּוֹ
  choice: అతని దగ్గర
  rationale: నిషేధితమైన ఆర్థిక లాభం ఎవరి నుంచి తీసుకోకూడదో ఈ పదబంధం సూచిస్తుంది; ‘అతని దగ్గర’ సహజమైన తెలుగు ప్రయోగం.
- source_word: נֶשֶׁךְ
  choice: వడ్డీ
  rationale: అప్పుపై వసూలు చేసే వడ్డీని సూచిస్తుంది. పాతకాలపు లేదా కేవలం అధిక వడ్డీ అనే భావం కలిగించే పదం కాకుండా సాధారణ ఆధునిక పదాన్ని ఎంచుకున్నాం.
- source_word: וְתַרְבִּית
  choice: అదనపు లాభం
  rationale: נֶשֶׁךְతో జతగా వచ్చి అప్పుచేసిన పేదవాని నుంచి వసూలు చేసే పెరుగుదల లేదా అదనపు రాబడిని సూచిస్తుంది. ‘అదనపు లాభం’ రెండు పదాల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: నీ దేవునికి భయపడి
  rationale: దోపిడీకి బదులు దేవునిపట్ల భయభక్తితో ప్రవర్తించాలనే నైతిక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నీ దేవుడు’ అనే నిబంధనాత్మక ప్రత్యక్షతను కాపాడుతుంది.
- source_word: וְחֵי
  choice: జీవించేలా చూడు
  rationale: సందర్భంలో ఈ రూపం ఆజ్ఞాత్మక లేదా ఫలితాత్మక భావాన్ని కలిగి ఉంది. ‘జీవించేలా చూడు’ సహోదరుని జీవనాన్ని కొనసాగనివ్వాలనే బాధ్యతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; స్పష్టంగా లేని ఉద్దేశార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: మూలంలోని కుటుంబసంబంధ రూపకాన్ని నిలుపుతూ, ఇక్కడ అది నిబంధన సమాజంలోని తోటి సభ్యుణ్ణి సూచిస్తుందని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: సంబోధితునితో పాటు సమాజంలో జీవితం కొనసాగడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో אָחִיךָ అనే సామాజిక-నైతిక పదం
  choice: నీ సహోదరుడు
  alternative: నీ తోటి ఇశ్రాయేలీయుడు; నీ బంధువు
  rationale: ఈ వాక్యం పేదరికంలో ఉన్న తోటి నిబంధన సమాజ సభ్యునితో ఎలా ప్రవర్తించాలో చెబుతుంది. ‘సహోదరుడు’ మూలంలోని కుటుంబ, నిబంధన భావాలను కాపాడుతుంది; విస్తృత సామాజిక అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఆర్థిక పదాలకు స్పష్టమైన సమకాలీన రూపాలు ఎంచుకుని, మూలంలోని కుటుంబసంబంధ నిబంధన భాషను నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన వచనంలో ఉంచబడింది.
