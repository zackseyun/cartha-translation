  - severity: low
    issue: “జీవించేలా చూడు” for וְחֵי
    rationale: This can be read as ‘see to it that he may live,’ with a more explicitly purposive/causative nuance. “జీవించనివ్వు” directly expresses the imperative sense ‘let ... live’ while retaining “with you.”
