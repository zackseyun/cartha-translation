source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: te
  text: నేను మీ దేవుడైన యాహ్వేను.[a] మీకు కనాను దేశాన్ని ఇవ్వడానికి, మీకు దేవుడిగా ఉండడానికి మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపరీత్యా బహువచన ఆకృతి ఉన్నప్పటికీ, ఇక్కడ ఏకవచన సూచనతో ఇశ్రాయేలు దేవునినే సూచించే నిబంధన సంబంధ పదప్రయోగం.
- source_word: הוֹצֵאתִי
  choice: బయటకు తీసుకొచ్చాను
  rationale: יצא హిఫీల్ రూపం నిర్గమ సందర్భంలో ‘బయటకు తీసుకురావడం’ అనే కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని אֶרֶץ (‘దేశం’) పదాన్ని నిలుపుతూ తెలుగులో సహజంగా అనువదిస్తుంది.
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: మీకు కనాను దేశాన్ని ఇచ్చి
  rationale: ఈ క్రియార్థక నిర్మాణం నిర్గమన చర్యతో ముడిపడిన ఉద్దేశం/ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఇచ్చి’ దానిని సంక్షిప్తంగా, సహజంగా కలుపుతుంది.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉండడానికి
  rationale: దేవుని స్వభావంలో మార్పును కాక, ఆయన ప్రజలతో ఉన్న నిబంధన సంబంధాన్ని తెలిపే సూత్రప్రాయ పదబంధాన్ని నిలుపుతుంది.
- source_word: אֲנִי
  choice: నేనే
  rationale: క్రియలేని హీబ్రూ పరిచయ వాక్యంలో స్వతంత్ర సర్వనామానికి ఉన్న ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధన నామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; పాదసూచిక సంప్రదాయ అనువాదాన్ని తెలియజేస్తుంది.
- issue: నిబంధన సూత్రం לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: మీకు దేవుడిగా ఉండడానికి
  alternative: మీ దేవుడిగా ఉండడానికి; మీకు దేవుడవడానికి
  rationale: ఈ మాటలు దేవుని అస్తిత్వంలో మార్పును సూచించవు; ఆయన ప్రజలతో నిబంధన సంబంధాన్ని వ్యక్తం చేస్తాయి. ‘ఉండడానికి’ ఆ భావాన్ని అతివ్యాఖ్యానం లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ వాక్యంలోని ఉద్దేశం/ఫలితం మరియు నిబంధన సంబంధ భావాన్ని సహజ తెలుగు వాక్యక్రమంలో నిలిపింది.
