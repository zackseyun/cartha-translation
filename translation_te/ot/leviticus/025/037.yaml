  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: te
  text: నీ డబ్బును అతనికి వడ్డీకి అప్పు ఇవ్వకూడదు; నీ ఆహారాన్ని లాభం కోసం ఇవ్వకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: నీ డబ్బును
  rationale: כֶּסֶף అనే పదానికి అక్షరార్థంగా ‘వెండి’ అనే అర్థం ఉన్నా, అప్పు ఇచ్చే ఈ ఆర్థిక సందర్భంలో ‘డబ్బు’ అనే అర్థమే సహజంగా సరిపోతుంది.
- source_word: תִתֵּן לוֹ
  choice: అతనికి ... అప్పుగా ఇవ్వకూడదు
  rationale: נתן సాధారణంగా ‘ఇవ్వు’ అని అర్థం; అయితే డబ్బు మరియు వడ్డీ ప్రస్తావనలో ఇది అప్పుగా ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఆ న్యాయార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘అప్పుగా ఇవ్వు’ అని అనువదించబడింది.
- source_word: בְּנֶשֶׁךְ
  choice: వడ్డీకి
  rationale: נֶשֶׁךְ అప్పుపై తీసుకునే అదనపు మొత్తాన్ని సూచిస్తుంది. ‘వడ్డీకి’ అనేది ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన న్యాయ-ఆర్థిక పదప్రయోగం.
- source_word: וּבְמַרְבִּית
  choice: లాభం కోసం
  rationale: מַרְבִּית అంటే పెరుగుదల, అదనపు రాబడి లేదా లాభం. ఆహారం సరఫరా చేయడంపై అదనపు ప్రయోజనం పొందడాన్ని ‘లాభం కోసం’ సహజంగా తెలియజేస్తుంది; ‘పెరుగుదలకు’ కంటే ఇది తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אָכְלֶךָ
  choice: నీ ఆహారాన్ని
  rationale: אָכֶל కు ప్రత్యక్ష అర్థం ‘ఆహారం.’ ఇది మూలపాఠంలోని స్పష్టమైన, మూర్తమైన సూచనను నిలుపుతుంది.
- source_word: לֹא ... לֹא
  choice: '... ఇవ్వకూడదు; ... ఇవ్వకూడదు'
  rationale: రెండు לֹא పదాలు రెండు సమన్విత నిషేధాలను ఏర్పరుస్తాయి. తెలుగులో రెండుసార్లు ‘ఇవ్వకూడదు’ అనడం మూలంలోని సమాంతర న్యాయ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: నిషేధం సాధారణ వడ్డీకా, కేవలం అధిక వడ్డీకా?
  choice: ‘వడ్డీకి’ అని విస్తృతంగా అనువదించడం
  alternative: ‘అధిక వడ్డీకి’ లేదా ‘దోపిడీ వడ్డీకి’
  rationale: నֶשֶׁךְ అనే పదం ఇక్కడ కేవలం అతిగా వసూలు చేసే వడ్డీకే పరిమితం అని మూలపాఠం చెప్పదు. అందువల్ల ‘అధిక’ లేదా ‘దోపిడీ’ అని జోడించడం వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా న్యాయపరమైన గంభీరతను నిలిపిన అనువాదం. ‘డబ్బు,’ ‘వడ్డీ,’ ‘ఆహారం,’ ‘లాభం’ వంటి ప్రస్తుత వాడుక పదాలు ఎంచుకోబడ్డాయి. మూలంలోని రెండు సమాంతర నిషేధాలు విడిగా నిలుపబడ్డాయి.
