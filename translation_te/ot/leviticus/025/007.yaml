id: LEV.25.7
reference: Leviticus 25:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ֨/בְהֶמְתְּ/ךָ֔ וְ/לַֽ/חַיָּ֖ה אֲשֶׁ֣ר בְּ/אַרְצֶ֑/ךָ תִּהְיֶ֥ה כָל תְּבוּאָתָ֖/הּ לֶ/אֱכֹֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: te
  text: నీ పశువులకు, నీ భూమిలో ఉన్న అడవి జంతువులకు, దాని పంట అంతా ఆహారంగా ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: నీ పశువులకు
  rationale: בְּהֵמָה ఇక్కడ సంబోధితునికి చెందిన పెంపుడు జంతువులను సమూహంగా సూచిస్తుంది. తరువాత వచ్చే అడవి జంతువులతో వ్యత్యాసాన్ని తెలుగులో ‘పశువులు’ సహజంగా చూపిస్తుంది.
- source_word: לַחַיָּה
  choice: అడవి జంతువులకు
  rationale: חַיָּה ఇక్కడ పశువులకు భిన్నంగా స్వేచ్ఛగా తిరిగే వన్యజంతువులను సూచిస్తుంది; ‘అడవి జంతువులు’ స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: నీ దేశంలో ఉన్న
  rationale: సంబంధ వాక్యం ‘అడవి జంతువులు’ను విశేషిస్తుంది. אֶרֶץ యొక్క భూభాగ భావాన్ని సందర్భానుకూలంగా ‘దేశం’ తెలియజేస్తుంది.
- source_word: תִּהְיֶה
  choice: ఉండాలి
  rationale: היה ఇక్కడ ఆ పంట ఆహారంగా అందుబాటులో ఉండాలనే నియామకాన్ని వ్యక్తం చేస్తుంది. ధర్మశాస్త్ర ఆదేశ స్వరాన్ని ‘ఉండాలి’ సహజంగా నిలుపుతుంది.
- source_word: כָּל תְּבוּאָתָהּ
  choice: దాని పంట అంతా
  rationale: תְּבוּאָה భూమి ఇచ్చే పంట లేదా దిగుబడిని సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం ముందున్న ‘దేశం/భూమి’ని తిరిగి సూచిస్తుంది. ‘పంట అంతా’ వ్యవసాయ సందర్భంలో సహజంగా ఉంది.
- source_word: לֶאֱכֹל
  choice: ఆహారంగా
  rationale: ל తో కూడిన క్రియార్థక రూపం ఉద్దేశం లేదా వినియోగాన్ని సూచిస్తుంది. ‘ఆహారంగా’ అనే రూపం ‘తినడానికి’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయంలోని భావాన్ని సహజ తెలుగులో అందిస్తుంది.
