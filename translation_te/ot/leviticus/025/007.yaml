translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ధర్మశాస్త్ర నియామకానికి తగిన గంభీరతతో అనువదించబడింది. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుసరించకుండా, పశువులు–అడవి జంతువులు అనే వ్యత్యాసం మరియు భూమి పంట ఆహారంగా అందుబాటులో ఉండాలనే భావం నిలుపబడింది.
