  rationale: 'A minimal lexical revision changes ‘దేశం’ to ‘భూమి’ to reflect the Hebrew agricultural-land sense more precisely. No footnote is necessary: the Telugu rendering directly communicates the sense of the Hebrew infinitive (‘for eating’) as ‘ఆహారంగా.’'
