id: LEV.25.47
reference: Leviticus 25:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: te
  text: మీ మధ్య నివసించే విదేశీయుడు ఆర్థికంగా స్థోమత కలిగి, అతనితో ఉన్న మీ సోదరుడు పేదవాడై, మీ మధ్య నివసించే విదేశీయునికిగాని, విదేశీయుని వంశానికి చెందిన ఒకరికిగాని[a] తనను తాను అమ్ముకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విదేశీయుని కుటుంబపు మూలానికి లేదా శాఖకు చెందిన ఒకరికిగాని.” ఇక్కడి హీబ్రూ పదబంధం అర్థం కష్టమైనది; ప్రధాన పాఠం సందర్భానికి తగిన సాధ్యమైన భావాన్ని సహజంగా అందిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: ఆర్థిక స్థోమత పెరిగి
  rationale: ‘చేయి అందుకొను’ అనే హీబ్రూ జాతీయం ఆర్థిక వనరులు సమకూరడం లేదా సామర్థ్యం పెరగడాన్ని సూచిస్తుంది. తెలుగులో దాని ఆర్థిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גֵּר וְתוֹשָׁב
  choice: నివసించే విదేశీయుడు
  rationale: ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసిస్తున్న, అయితే స్థానిక జాతికి చెందని వ్యక్తిని ఈ జంట పదాలు సూచిస్తున్నాయి. రెండింటినీ విడివిడిగా కృత్రిమంగా పునరుక్తి చేయకుండా సంయుక్త భావాన్ని అందిస్తుంది.
- source_word: וּמָךְ
  choice: పేదవాడై
  rationale: ఈ క్రియ ఆర్థికంగా దిగజారి పేదరికంలోకి రావడాన్ని సూచిస్తుంది.
- source_word: אָחִיךָ
  choice: మీ సోదరుడు
  rationale: మూలంలోని బంధుత్వ భాషను నిలుపుతుంది; సందర్భంలో ఇది తోటి ఇశ్రాయేలీయుణ్ణి సూచిస్తుంది.
- source_word: עִמּוֹ
  choice: అతనితో ఉన్న
  rationale: విదేశీయునితో ఆ పేద సోదరునికి ఉన్న స్థితిగత సంబంధాన్ని మూలంలోని సంక్షిప్తతతోనే ఉంచుతుంది; ‘అతని పక్కన’ అని స్థలార్థానికే పరిమితం చేయదు.
- source_word: וְנִמְכַּר
  choice: తనను తాను అమ్ముకుంటే
  rationale: నిఫాల్ రూపం వ్యాకరణపరంగా ‘అమ్మబడితే’ అని రావచ్చు; అయితే అప్పు-పేదరికం వల్ల సేవలోకి తనను తాను అమ్ముకునే ఈ న్యాయ సందర్భంలో ప్రతిఫలార్థక భావం సహజంగా సరిపోతుంది.
- source_word: לְגֵר תּוֹשָׁב עִמָּךְ
  choice: మీ మధ్య నివసించే ఆ విదేశీయునికి
  rationale: మొదటి భాగంలో పేర్కొన్న అదే సామాజిక వర్గాన్ని సహజమైన తెలుగులో పునరుద్ఘాటిస్తుంది.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: విదేశీయుని వంశానికి చెందిన ఒకరికి
  rationale: עֵקֶר అనే అరుదైన పదం ఇక్కడ కుటుంబంలోని శాఖ, మూలవంశం, లేదా సభ్యుణ్ణి సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సందర్భానుకూలమైన వ్యక్తి-సూచక అర్థాన్ని ఇస్తూ, పదంలోని క్లిష్టతను పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయుల బంధుత్వ భాష
  choice: మీ సోదరుడు
  alternative: మీ తోటి ఇశ్రాయేలీయుడు / మీ బంధువు
  rationale: ‘సోదరుడు’ అనే మూల రూపం నిబంధనలోని కుటుంబపరమైన నైతిక బలాన్ని నిలుపుతుంది; దాన్ని కేవలం పౌర వర్గీకరణగా మార్చదు.
- issue: וְנִמְכַּר సూచించే అమ్మకం స్వభావం
  choice: తనను తాను అమ్ముకుంటే
  alternative: అమ్మబడితే
  rationale: రూపం నిష్క్రియార్థాన్ని అనుమతించినా, లేవీయకాండము 25లోని అప్పు-పేదరిక న్యాయ సందర్భం స్వయంగా బంధిత సేవలోకి ప్రవేశించడాన్ని సూచిస్తుంది. అయినప్పటికీ యాజమాన్య స్వభావంపై అదనపు సిద్ధాంతాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. షరతును తెలుగులో సహజంగా చివరి ‘అమ్ముకుంటే’తో వ్యక్తం చేశాం. పాదసూచిక గుర్తును క్లిష్టమైన לְעֵקֶר מִשְׁפַּחַת גֵּר పదబంధం దగ్గర ఉంచాం.
