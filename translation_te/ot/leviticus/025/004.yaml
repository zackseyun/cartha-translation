  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: te
  text: అయితే ఏడవ సంవత్సరంలో భూమికి సంపూర్ణ విశ్రాంతి సబ్బాతు[a] ఉండాలి; అది యాహ్వేకు అంకితమైన సబ్బాతు. నీ పొలాన్ని విత్తకూడదు; నీ ద్రాక్షతోటలోని తీగలను కత్తిరించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గంభీర విశ్రాంతి సబ్బాతు.’ హెబ్రీ పదబంధం పూర్తిగా పనిని నిలిపివేయాలనే భావాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: అయితే ఏడవ సంవత్సరంలో
  rationale: ముందటి వచనంలో చెప్పిన ఆరు సంవత్సరాల సాగుకు ఏడవ సంవత్సరం విరుద్ధంగా నిలుస్తున్నందున, ו conjunction యొక్క సందర్భోచిత వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి సబ్బాతు
  rationale: ఈ హెబ్రీ పదబంధం ఆగిపోవడం లేదా విశ్రాంతి అనే భావాన్ని బలపరుస్తుంది. ‘సబ్బాతు’ భావాన్ని నిలుపుతూ ‘సంపూర్ణ విశ్రాంతి’ దాని తీవ్రతను తెలియజేస్తుంది.
- source_word: יִהְיֶה לָאָרֶץ
  choice: భూమికి ... ఉండాలి
  rationale: హెబ్రీలో ఈ విశ్రాంతి ‘భూమికి’ ఉండాలని ఉంది. తెలుగు వాక్యనిర్మాణంలో భూమినే విశ్రాంతి పొందేదిగా స్పష్టంగా ఉంచుతుంది.
- source_word: שַׁבָּת לַיהוָה
  choice: యెహోవాకు అంకితమైన సబ్బాతు
  rationale: ל ఉపసర్గ ఇక్కడ దిశ లేదా అంకిత భావాన్ని సూచిస్తుంది. ‘అంకితమైన’ అనే పదం ఈ విశ్రాంతి యెహోవా కొరకు ప్రత్యేకపరచబడిందనే భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వినియోగంలో ఉన్న ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: నీ పొలాన్ని విత్తకూడదు
  rationale: రెండవ పురుష ఏకవచన నిషేధాన్ని సహజమైన తెలుగు ధర్మశాసన శైలిలో అందిస్తుంది; זרעకు వ్యవసాయ సందర్భంలో ‘విత్తు’ ప్రత్యక్ష సమానం.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: నీ ద్రాక్షతోటను కత్తిరించకూడదు
  rationale: ద్రాక్షతోట సందర్భంలో זמר తీగలను సాగు కోసం కత్తిరించడం లేదా కొమ్మలు తొలగించడాన్ని సూచిస్తుంది; ‘కత్తిరించు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని నిబంధన నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే నిలుపుతుంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నప్పటికీ, మూల ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: שַׁבָּת לַיהוָה లో ל యొక్క సంబంధం
  choice: యెహోవాకు అంకితమైన సబ్బాతు
  alternative: యెహోవా కొరకు సబ్బాతు
  rationale: ఈ విశ్రాంతి కేవలం వ్యవసాయ విరామం కాక యెహోవాకు ప్రత్యేకపరచబడినదని అంకిత భావంతో తెలియజేస్తుంది; ప్రత్యామ్నాయం ఉద్దేశం లేదా ప్రయోజన భావాన్ని మరింత సాధారణంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాసన శైలిని ఉపయోగించాం. వ్యవసాయ పదాలను సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచి, హెబ్రీ పదబంధంలోని బలమైన విశ్రాంతి భావాన్ని పాదటిప్పణితో సంరక్షించాం.
