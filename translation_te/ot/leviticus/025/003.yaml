  yaml_path: translation/ot/leviticus/025/003.yaml
  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: te
  text: ఆరు సంవత్సరాలు నీ పొలాన్ని విత్తాలి; ఆరు సంవత్సరాలు నీ ద్రాక్షతోటను కత్తిరించాలి; దాని దిగుబడిని[a] సేకరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పంటను.” హీబ్రూ పదం సాధారణంగా వ్యవసాయ దిగుబడిని లేదా ఉత్పత్తిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు
  rationale: కాలవ్యవధిని సూచించే హీబ్రూ పదబంధాన్ని సహజమైన తెలుగు కాలప్రయోగంతో అందించింది.
- source_word: תִּזְרַע
  choice: విత్తాలి
  rationale: ధర్మశాస్త్ర సందర్భంలోని ఆదేశాత్మక అసంపూర్ణ క్రియను ఆధునిక తెలుగులో సహజమైన విధ్యర్థక రూపంతో వ్యక్తం చేసింది.
- source_word: שָׂדֶךָ
  choice: నీ పొలాన్ని
  rationale: విస్తృతమైన ‘భూమి’ కంటే సాగుచేసే క్షేత్రాన్ని నిర్దిష్టంగా సూచించే పదం.
- source_word: תִּזְמֹר
  choice: కత్తిరించాలి
  rationale: ద్రాక్షతోట సందర్భంలో తీగలను క్రమంగా కత్తిరించి సంరక్షించే ప్రత్యేక వ్యవసాయ చర్యను సూచిస్తుంది.
- source_word: כַּרְמֶךָ
  choice: నీ ద్రాక్షతోటను
  rationale: హీబ్రూ పదానికి సందర్భోచితమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: וְאָסַפְתָּ
  choice: సమకూర్చుకోవాలి
  rationale: పంటను సేకరించడాన్ని సూచించే మూలక్రియ భావాన్ని, సొంత పంటను కూడబెట్టుకునే సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
- source_word: תְּבוּאָתָהּ
  choice: దాని పంటను
  rationale: దిగుబడి లేదా వ్యవసాయ ఉత్పత్తి అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన ‘పంట’తో వ్యక్తం చేసింది; స్త్రీలింగ ఏకవచన ప్రత్యయం సమీపంలోని ద్రాక్షతోటను సూచించగలదు.
