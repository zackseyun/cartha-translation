translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని నిలుపుతూ ‘విత్తాలి/కత్తిరించాలి/సమకూర్చుకోవాలి’ అనే సమాంతర విధ్యర్థక రూపాలు వాడబడ్డాయి. హీబ్రూ వాక్యంలోని వ్యవసాయ నిర్దిష్టతను కాపాడేందుకు ‘పొలం,’ ‘ద్రాక్షతోట’ పదాలు ఎంచుకున్నాం.
