  naturalness: The draft is generally natural modern Telugu. “దాని దిగుబడిని సేకరించాలి” is both natural in agricultural/legal register and more semantically exact than “దాని పంటను సమకూర్చుకోవాలి.”
  terminology: “పొలం,” “ద్రాక్షతోట,” and “కత్తిరించాలి” appropriately render the agricultural terminology. “దిగుబడి” preserves the broad sense of תְּבוּאָה; a footnote records “పంట” as a natural alternative.
