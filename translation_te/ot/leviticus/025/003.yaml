  to: ఆరు సంవత్సరాలు నీ పొలాన్ని విత్తాలి; ఆరు సంవత్సరాలు నీ ద్రాక్షతోటను కత్తిరించాలి; దాని దిగుబడిని[a] సేకరించాలి.
