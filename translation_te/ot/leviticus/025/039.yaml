  verdict: revise
  source_fidelity: The conditional, impoverishment, kinship term, sale-to-the-addressee construction, and prohibition are conveyed accurately. The passive nuance of וְנִמְכַּר is appropriately retained in footnote b. Revising the final idiom to ‘బానిసలా పని చేయించకూడదు’ more directly conveys the prohibition against imposing slave-like labor/status.
  naturalness: ‘నీ దగ్గర పేదవాడై’ is understandable but less idiomatic and can suggest physical proximity. ‘నీతో ఉండగా పేదవాడై’ is natural modern Telugu and preserves the relational/setting sense of עִמָּךְ. ‘అతనితో బానిస పని చేయించకూడదు’ is also somewhat awkward; the revised wording is smoother.
  terminology: ‘సహోదరుడు’ suitably preserves אָחִיךָ in a dignified legal register. ‘బానిస’ correctly retains the force of עֶבֶד without euphemism. The revised expression retains the distinction between permitted debt service and prohibited slave-like treatment.
  issues:
  - severity: low
    issue: The phrase ‘నీ దగ్గర పేదవాడై’ is slightly unnatural and potentially over-localized.
    rationale: The Hebrew עִמָּךְ is relational/contextual (‘with you’), not necessarily ‘at your place.’ ‘నీతో ఉండగా’ communicates this more naturally.
  - severity: low
    issue: ‘అతనితో బానిస పని చేయించకూడదు’ is syntactically stiff.
    rationale: ‘బానిసలా పని చేయించకూడదు’ is idiomatic Telugu and accurately expresses the force of ‘make him serve with the service/labor of a slave.’
