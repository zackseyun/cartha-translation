id: LEV.25.39
reference: Leviticus 25:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: te
  text: నీ సహోదరుడు నీతో ఉండగా పేదవాడై, తనను తాను నీకు అమ్ముకుంటే[b], అతనితో బానిసలా పని చేయించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతనితో బానిస చేసే సేవ చేయించకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీకు అమ్మబడితే.” హీబ్రూ రూపాన్ని కర్మణిగా అనువదించవచ్చు; ఈ సందర్భంలో పేదవాడు అప్పు-సేవ కోసం తనను తాను అమ్ముకోవడాన్ని అది సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִי
  choice: ఒకవేళ
  rationale: సంబంధిత న్యాయనియమంలో షరతును సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; హీబ్రూ సంధాన భావం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: יָמוּךְ
  choice: పేదవాడై
  rationale: ఆర్థికంగా క్షీణించి పేదరికంలోకి రావడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: మూలంలోని కుటుంబ సంబంధ పదాన్ని నిలుపుతుంది; సందర్భంలో అది తోటి నిబంధన సమాజ సభ్యుణ్ణి సూచించవచ్చు గాని, ప్రధాన పాఠ్యంలో ఆ అర్థాన్ని విస్తరించి చెప్పదు.
- source_word: עִמָּךְ
  choice: నీ దగ్గర
  rationale: వ్యక్తి పేదరిక స్థితి సంబోధితునితో సంబంధమున్న పరిధిలో ఏర్పడిందనే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: וְנִמְכַּר לָךְ
  choice: తనను తాను నీకు అమ్ముకుంటే
  rationale: నిఫాల్ రూపం వ్యాకరణపరంగా ‘నీకు అమ్మబడితే’ అని రావచ్చు; అయితే ఈ పేదరికపు న్యాయ సందర్భంలో అప్పు సేవకై స్వయంగా అమ్ముకోవడం అనే సందర్భార్థాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: అతనితో ... చేయించకూడదు
  rationale: అతని చేత ఒక నిర్దిష్ట రకమైన శ్రమ చేయించడాన్ని నిషేధించే కారక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבֹדַת עָבֶד
  choice: బానిస పని
  rationale: అక్షరార్థమైన ‘బానిస చేసే పని/సేవ’ను సంక్షిప్తంగా నిలుపుతూ, సాధారణ సేవకత్వం కంటే బంధిత హోదాకు సంబంధించిన కఠిన శ్రమను సూచిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయ అప్పు-సేవ నియమంలో సామాజిక హోదా పదజాలం
  choice: ‘బానిస పని’ అని అనువదించడం
  alternative: ‘సేవకుని పని’ లేదా ‘బానిసగా సేవ’
  rationale: עֲבֹדַת עָבֶד సాధారణ సేవను కాక బానిస హోదాకు తగిన శ్రమను సూచిస్తుంది. ఈ వాక్యం పేద సహోదరుడు ఏ సేవలోనూ ప్రవేశించడని చెప్పడం కాదు; అతనితో బానిస పని చేయించడాన్ని నిషేధిస్తుంది. అందువల్ల ఉద్రిక్తతను తగ్గించకుండా ‘బానిస’ను నిలుపాం.
- issue: וְנִמְכַּר యొక్క కర్తృ/కర్మణి వ్యక్తీకరణ
  choice: ప్రధాన పాఠ్యంలో ‘తనను తాను నీకు అమ్ముకుంటే’
  alternative: ‘నీకు అమ్మబడితే’
  rationale: హీబ్రూ రూపం కర్మణిగా వ్యక్తమవుతుంది; న్యాయ సందర్భంలో పేదరికం వల్ల స్వయంగా అప్పు-సేవలోకి వెళ్లడం ఉద్దేశంగా ఉండవచ్చు. నిజమైన వ్యాకరణ అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయశైలికి తగిన గంభీరతను ఉంచాం. ‘నీ సహోదరుడు’ ద్వారా మూల కుటుంబ పదాన్ని, ‘బానిస పని’ ద్వారా సామాజిక హోదా తీవ్రతను నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
