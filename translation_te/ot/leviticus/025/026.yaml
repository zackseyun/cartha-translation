revisions:
- from: అయితే ఒక వ్యక్తికి విమోచించే సమీప బంధువు[a] లేకపోయినా, ఆ తర్వాత అతనికి తగినంత స్తోమత కలిగి, తన ఆస్తిని విడిపించుకోవడానికి కావలసినంత సంపాదిస్తే,
  to: అయితే ఒక వ్యక్తికి విమోచకుడైన సమీప బంధువు లేకపోయి, అతనికి తగినంత స్తోమత కలిగి, తన ఆస్తిని విమోచించుకోవడానికి కావలసినంత అతనికి దొరికితే,
  rationale: The revision removes the unwarranted concessive and temporal nuances, corrects the Telugu syntax, and maintains the source’s legal-economic sense. The comma is retained because the conditional sentence continues into verse 27.
