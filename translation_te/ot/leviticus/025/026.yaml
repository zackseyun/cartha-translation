id: LEV.25.26
reference: Leviticus 25:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: te
  text: అయితే ఒక వ్యక్తికి విమోచకుడైన సమీప బంధువు లేకపోయి, అతనికి తగినంత స్తోమత కలిగి, తన ఆస్తిని విమోచించుకోవడానికి కావలసినంత అతనికి దొరికితే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: అయితే ఒక వ్యక్తికి
  rationale: ఇది ముందరి నియమానికి భిన్నమైన పరిస్థితిని ప్రవేశపెట్టే షరతు. ఆధునిక తెలుగు న్యాయశైలిలో ‘ఒక వ్యక్తి’ సహజంగా ఉంది; సందర్భంలోని వ్యక్తిగత ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: విమోచించే సమీప బంధువు లేకపోయినా
  rationale: గֹּאֵל ఇక్కడ కుటుంబ భూమిని తిరిగి కొనుగోలు చేసే హక్కు లేదా బాధ్యతగల దగ్గరి బంధువును సూచిస్తుంది. ‘సమీప బంధువు’ సంబంధాన్ని, ‘విమోచించే’ అతని న్యాయపరమైన పాత్రను తెలియజేస్తాయి.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: ఆ తర్వాత అతనికి తగినంత స్తోమత కలిగి
  rationale: అక్షరార్థంగా ‘అతని చెయ్యి చేరితే’ అనే హీబ్రూ నుడికారం ఆర్థిక సామర్థ్యం కలగడాన్ని సూచిస్తుంది. తెలుగులో అర్థం సహజంగా ఉండేందుకు ‘స్తోమత కలిగి’ అని అనువదించబడింది.
- source_word: וּמָצָא
  choice: సంపాదిస్తే
  rationale: మూల క్రియ సాధారణంగా ‘కనుగొను/పొందు’ అని అర్థం. ఈ ఆర్థిక సందర్భంలో అవసరమైన మొత్తాన్ని సమకూర్చుకోవడం లేదా సంపాదించడం ఉద్దేశం; ‘సంపాదిస్తే’ సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: כְּדֵי גְאֻלָּתוֹ
  choice: తన ఆస్తిని విడిపించుకోవడానికి కావలసినంత
  rationale: כְּדֵי తగిన పరిమాణాన్ని సూచిస్తుంది; גְּאֻלָּתוֹ ఈ భూమి-న్యాయ సందర్భంలో తిరిగి కొనుగోలు ద్వారా ఆస్తిని విడిపించుకోవడాన్ని సూచిస్తుంది. ‘ఆస్తిని’ అనేది సందర్భం నుంచి స్పష్టీకరించబడింది.
theological_decisions:
- issue: గֹּאֵל అనే పదంలోని కుటుంబ సంబంధం మరియు విమోచన పాత్ర
  choice: విమోచించే సమీప బంధువు
  alternative: విమోచకుడు
  rationale: కేవలం ‘విమోచకుడు’ అంటే సాధారణమైన లేదా ఆధ్యాత్మిక అర్థం కలగవచ్చు. ఈ వచనంలో ఉద్దేశించినది కుటుంబ ఆస్తిని తిరిగి కొనగల సమీప బంధువు; అందువల్ల న్యాయ-కుటుంబ భావాన్ని స్పష్టంగా ఉంచాం.
- issue: גְּאֻלָּתוֹ యొక్క సర్వనామ సూచన
  choice: తన ఆస్తిని విడిపించుకోవడానికి
  alternative: దాని విమోచనకు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘అతని విమోచన’ అని ఉన్నప్పటికీ, సందర్భం అమ్మబడిన భూమిని తిరిగి పొందడం గురించి. వ్యక్తి ఆధ్యాత్మిక విమోచనగా అపార్థం కాకుండా ఆస్తి సందర్భాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-వివరణాత్మక శైలి ఉపయోగించబడింది. ‘చెయ్యి చేరింది’ అనే హీబ్రూ నుడికారాన్ని అక్షరానువాదం చేయకుండా ‘స్తోమత కలిగి’ అని అర్థవంతంగా అందించాం. తదుపరి వచనంతో వాక్యం కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
