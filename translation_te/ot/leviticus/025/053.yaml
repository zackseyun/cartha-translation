    text: లేదా, ‘అతడు సంవత్సరానికొకసారి జీతానికి పనిచేసే వానిగా అతనితో ఉండాలి.’
    reason: పోలికను సూచించే כִּ־ మరియు שָׁנָה בְּשָׁנָה పదబంధాన్ని మరింత రూపసామ్యంగా చూపే ప్రత్యామ్నాయం.
  revision_rationale: The revision retains the Hebrew comparison, annual/distributive sense, and visible prohibition against harsh rule. It replaces a potentially narrower expression for hired labor and, crucially, supplies “ఆ యజమాని” in the second sentence to make explicit the referent recoverable from the immediate context, preventing reversal of the participants.
