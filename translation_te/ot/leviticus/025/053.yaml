review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the comparison (כִּשְׂכִיר), the distributive annual idiom, and the prohibition of harsh domination. However, the Telugu pronouns in the second sentence reverse or at least seriously obscure the Hebrew’s owner–Israelite relationship: after the first sentence’s subject, “అతడు ఇతనిపై” can naturally be read as the Israelite exercising authority over the owner. The owner must be identified from the immediate context.'
  naturalness: “ఏటేటా” and “నీ కళ్ల ఎదుట” are natural modern Telugu. “కూలివానిలా” is understandable, but “జీతానికి పనిచేసే వానిలా” more clearly conveys a hired worker rather than a casual laborer. Explicitly identifying “ఆ యజమాని” produces a clear and idiomatic legal instruction.
  terminology: “కఠినంగా అధికారం చెలాయించకూడదు” adequately conveys לֹא יִרְדֶּנּוּ בְּפֶרֶךְ. “జీతానికి పనిచేసే వానిలా” preserves the distinction between a hired worker and a slave without importing a denominational interpretation.
  issues:
  - severity: medium
    issue: Ambiguous and potentially reversed referents in “నీ కళ్ల ఎదుట అతడు ఇతనిపై కఠినంగా అధికారం చెలాయించకూడదు.”
    rationale: In the Hebrew, the second subject is the purchaser/owner in the surrounding legal context, and the object is the Israelite worker. The Telugu sequence does not securely communicate this and may be read as making the worker the one who exercises authority.
  - severity: low
    issue: “కూలివానిలా” can suggest a casual day laborer more readily than a hired worker in an ongoing annual arrangement.
    rationale: The source’s שָׂכִיר denotes a hired worker. “జీతానికి పనిచేసే వానిలా” is clear, current Telugu and fits the annual employment comparison.
  revised_text: అతడు ఏటేటా జీతానికి పనిచేసే వానిలా అతనితో ఉండాలి[a]. నీ కళ్ల ఎదుట ఆ యజమాని అతనిపై కఠినంగా అధికారం చెలాయించకూడదు.
  revised_footnotes:
