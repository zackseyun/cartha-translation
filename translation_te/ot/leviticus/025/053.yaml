revisions:
- from: అతడు ఏటేటా కూలివానిలా అతనితో ఉండాలి[a]. నీ కళ్ల ఎదుట అతడు ఇతనిపై కఠినంగా అధికారం చెలాయించకూడదు.
  to: అతడు ఏటేటా జీతానికి పనిచేసే వానిలా అతనితో ఉండాలి[a]. నీ కళ్ల ఎదుట ఆ యజమాని అతనిపై కఠినంగా అధికారం చెలాయించకూడదు.
  rationale: The revision retains the Hebrew comparison, annual/distributive sense, and visible prohibition against harsh rule. It replaces a potentially narrower expression for hired labor and, crucially, supplies “ఆ యజమాని” in the second sentence to make explicit the referent recoverable from the immediate context, preventing reversal of the participants.
