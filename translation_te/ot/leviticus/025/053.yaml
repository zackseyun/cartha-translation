id: LEV.25.53
reference: Leviticus 25:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: te
  text: అతడు ఏటేటా జీతానికి పనిచేసే వానిలా అతనితో ఉండాలి[a]. నీ కళ్ల ఎదుట ఆ యజమాని అతనిపై కఠినంగా అధికారం చెలాయించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు సంవత్సరానికొకసారి జీతానికి పనిచేసే వానిగా అతనితో ఉండాలి.’
    reason: పోలికను సూచించే כִּ־ మరియు שָׁנָה בְּשָׁנָה పదబంధాన్ని మరింత రూపసామ్యంగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: కూలివానిలా
  rationale: כ ఉపసర్గ పోలికను (‘వలె/లా’) సూచిస్తుంది; שׂכיר బానిసను కాక కూలికి పనిచేసే వ్యక్తిని సూచిస్తుంది. ‘కూలివానిలా’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భేదాన్ని నిలుపుతుంది.
- source_word: שָׁנָה בְּשָׁנָה
  choice: ఏటేటా
  rationale: ఈ పదబంధం ప్రతి సంవత్సరం కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘ఏటేటా’ దాని విభాజక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה עִמּוֹ
  choice: అతనితో ఉండాలి
  rationale: హీబ్రూ వాక్యం సూటిగా ‘అతనితో ఉండాలి’ అని చెబుతుంది. ‘అతనితోనే కొనసాగాలి’ లేదా ‘అతనికి సేవచేయాలి’ అనడం మూలంలో స్పష్టంగా లేని భావాన్ని జోడిస్తుంది.
- source_word: לֹא יִרְדֶּנּוּ
  choice: అతడు ఇతనిపై ... అధికారం చెలాయించకూడదు
  rationale: רדה అంటే ‘పాలించు, ఆధిపత్యం చెలాయించు.’ ఇద్దరు పురుషులను సూచించే సర్వనామాల భేదం తెలుగులో స్పష్టంగా ఉండేందుకు ‘అతడు ఇతనిపై’ అని ఇచ్చాం.
- source_word: בְּפֶרֶךְ
  choice: కఠినంగా
  rationale: ఈ నామవాచకం నిర్దయతో కూడిన కఠినత్వాన్ని, ముఖ్యంగా బలవంతపు శ్రమ సందర్భంలోని తీవ్రతను సూచిస్తుంది. ‘అధికారం చెలాయించు’తో ‘కఠినంగా’ సహజంగా జతకడుతుంది.
- source_word: לְעֵינֶיךָ
  choice: నీ కళ్ల ఎదుట
  rationale: మూలంలోని ‘నీ కళ్లకు/ఎదుట’ అనే దృశ్యరూపాన్ని నిలుపుతూ, ఈ ప్రవర్తన సంబోధితుని సమక్షంలో జరుగుతున్నదనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విదేశీయుడి ఆధీనంలో ఉన్న ఇశ్రాయేలీయుని స్థితి
  choice: అతని స్థితిని బానిసగా నిర్వచించకుండా, కూలివానితో పోలికగా అనువదించాం.
  alternative: జీతగాడైన సేవకునిగా
  rationale: ఈ వచనం పరదేశి నివాసికి అమ్మబడిన ఇశ్రాయేలీయుని ప్రవర్తనను నియంత్రిస్తూ, అతని స్థితిని కూలివానితో పోలుస్తుంది. అందువల్ల שׂכיר లో లేని సంపూర్ణ బానిసత్వ భావాన్ని చేర్చకుండా, అధ్యాయంలోని సేవాధీన సందర్భాన్ని కూడా తొలగించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిధి స్వరానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. వరుసగా వచ్చే పుంలింగ ఏకవచన సర్వనామాల సూచనను స్పష్టం చేయడానికి రెండో వాక్యంలో ‘అతడు ఇతనిపై’ అనే భేదాన్ని ఉపయోగించాం.
