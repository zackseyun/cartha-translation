id: LEV.25.19
reference: Leviticus 25:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: te
  text: ఆ భూమి తన ఫలాన్ని ఇస్తుంది; మీరు కడుపునిండా తిని, దానిపై సురక్షితంగా నివసిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנָה
  choice: ఇస్తుంది
  rationale: נתן అనే క్రియకు ప్రాథమిక అర్థం ‘ఇవ్వడం.’ భూమి కర్తగా ఉన్నందున, తన ఫలాన్ని ఇచ్చే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: ఆ భూమి
  rationale: ఈ అధ్యాయ సందర్భంలో ఇది సాధారణంగా భూమండలాన్ని కాక, ఇశ్రాయేలీయులు నివసించే నిర్దిష్ట దేశభూమిని సూచిస్తుంది; నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో సూచించాం.
- source_word: פִּרְיָהּ
  choice: తన ఫలాన్ని
  rationale: פְּרִי యొక్క ప్రత్యక్షమైన ‘ఫలం’ అనే రూపకాన్ని నిలుపుతూ, వ్యవసాయ దిగుబడినీ సహజంగా సూచిస్తుంది.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: మీరు కడుపునిండా తిని
  rationale: שֹׂבַע సంతృప్తి లేదా తృప్తిగా నిండడాన్ని సూచిస్తుంది. ‘కడుపునిండా తిని’ ఆధునిక తెలుగులో సహజంగా, సామాన్యులకు స్పష్టంగా ఉంటుంది.
- source_word: וִישַׁבְתֶּם
  choice: నివసిస్తారు
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే స్థిరంగా నివసించడం అనే భావంలో ఉంది; ‘నివసిస్తారు’ గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: בֶּטַח భద్రతతో, భయం లేకుండా ఉండే స్థితిని సూచిస్తుంది; ‘సురక్షితంగా’ ఈ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עָלֶיהָ
  choice: దానిపై
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం భూమిని తిరిగి సూచిస్తుంది; హెబ్రీలోని ‘దానిపై’ అనే స్థల సంబంధాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
