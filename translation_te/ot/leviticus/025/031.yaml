  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చట్టపరమైన శైలి వాడబడింది. ‘సునాద సంవత్సరం’ ద్వారా יוֹבֵל అనే స్థిర బైబిలు భావాన్ని తెలిపి, ‘తిరిగి విడిపించుకునే హక్కు’ ద్వారా ఆస్తి విమోచన యొక్క న్యాయార్థాన్ని స్పష్టం చేశాం.
