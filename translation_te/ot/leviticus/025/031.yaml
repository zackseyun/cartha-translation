  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: te
  text: అయితే చుట్టూ ప్రాకారం లేని గ్రామాల్లోని ఇళ్లు దేశంలోని పొలాలుగా పరిగణించబడాలి[a]. వాటికి విమోచన హక్కు ఉంటుంది; యోబేలు సంవత్సరంలో అవి విడుదల అవుతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేశపు పొలంగా పరిగణించబడాలి.” అంటే, ప్రాకారం గల పట్టణంలోని ఇళ్లలా కాకుండా, ఈ గ్రామ ఇళ్లను చట్టపరంగా గ్రామీణ భూమిలా పరిగణించాలి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యోబేలు సంవత్సరంలో అది బయటికి వెళ్తుంది.” ఈ న్యాయపరమైన సందర్భంలో, అది యోబేలు సంవత్సరంలో విడుదల కావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: గ్రామాల్లోని ఇళ్లు
  rationale: חֲצֵרִים ఇక్కడ ప్రాకారం లేని గ్రామీణ నివాస ప్రాంతాలను సూచిస్తుంది; తరువాతి ఉపవాక్యం ప్రాకారం లేనిదాన్ని స్పష్టంగా చెబుతుంది కాబట్టి ‘గ్రామాలు’ సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: చుట్టూ ప్రాకారం లేని
  rationale: చుట్టుముట్టిన గోడ లేకపోవడాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: ఆ దేశపు పొలాలవలె పరిగణించబడాలి
  rationale: హీబ్రూ ఏకవచన రూపాన్ని దగ్గరగా నిలుపుతూ, ఈ ఇళ్లను ప్రాకార పట్టణ ఇళ్లుగా కాక గ్రామీణ భూమిగా చట్టపరంగా లెక్కించే భావాన్ని తెలియజేస్తుంది.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: వాటిని తిరిగి విడిపించుకునే హక్కు ఉంటుంది
  rationale: గְּאֻלָּה ఆస్తిని ధర చెల్లించి తిరిగి పొందే చట్టబద్ధ హక్కును సూచిస్తుంది; ‘విడిపించుకోవడం’ లేవీయకాండంలోని విమోచన పదజాలాన్ని నిలుపుతుంది.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: సునాద సంవత్సరంలో అవి తిరిగి యజమానికి చెందుతాయి
  rationale: ‘బయటికి వెళ్తాయి’ అనే హీబ్రూ నుడికారానికి ఈ ఆస్తి సందర్భంలో ఉన్న విడుదలై తిరిగి చెందే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
