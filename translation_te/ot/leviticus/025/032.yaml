revisions:
- from: లేవీయుల పట్టణాల విషయానికొస్తే, వారి స్వాస్థ్య పట్టణాల్లోని ఇళ్లను తిరిగి విడిపించుకునే శాశ్వత హక్కు లేవీయులకు ఉంటుంది.[a]
  to: లేవీయుల పట్టణాల విషయానికొస్తే, వారి స్వాస్థ్య పట్టణాల్లోని ఇళ్లను తిరిగి స్వాధీనం చేసుకునే శాశ్వత హక్కు లేవీయులకు ఉంటుంది.[a]
