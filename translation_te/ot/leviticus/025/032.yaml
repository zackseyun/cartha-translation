  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: te
  text: లేవీయుల పట్టణాల విషయానికొస్తే, వారి స్వాస్థ్య పట్టణాల్లోని ఇళ్లను తిరిగి స్వాధీనం చేసుకునే శాశ్వత హక్కు లేవీయులకు ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “శాశ్వత విమోచన హక్కు లేవీయులకు ఉంటుంది.”'
    reason: హీబ్రూ నామవాచక నిర్మాణమైన גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם ను మరింత సన్నిహితంగా చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: లేవీయుల పట్టణాల విషయానికొస్తే
  rationale: וְ ఇక్కడ ముందున్న చట్టపరమైన చర్చలో కొత్త అంశాన్ని ప్రవేశపెడుతుంది. ‘విషయానికొస్తే’ అనే ప్రయోగం ఆ అంశమార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; construct సంబంధాన్ని ‘లేవీయుల పట్టణాలు’గా ఉంచుతుంది.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: వారి స్వాస్థ్య పట్టణాల్లోని ఇళ్లను
  rationale: אֲחֻזָּה భూమికి సంబంధించిన, తరతరాలుగా కలిగే స్వాధీన హక్కు లేదా స్వాస్థ్యాన్ని సూచిస్తుంది. ‘స్వాస్థ్య’ దాని చట్టపరమైన భావాన్ని కాపాడుతుంది; ‘పట్టణాల్లోని’ అనేది ఇళ్ల స్థానసంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: גְּאֻלַּת
  choice: తిరిగి విడిపించుకునే హక్కు
  rationale: ఈ సందర్భంలో גְּאֻלָּה అమ్మబడిన ఆస్తిని చట్టబద్ధంగా తిరిగి పొందడాన్ని సూచిస్తుంది. కేవలం ‘విమోచనం’ అనడం సాధారణ పాఠకునికి మతపరమైన భావాన్ని ముందుకు తేవచ్చు; ‘తిరిగి విడిపించుకోవడం’ ఆస్తి చట్ట సందర్భాన్ని స్పష్టపరుస్తుంది.
- source_word: עוֹלָם
  choice: శాశ్వత
  rationale: చట్టపరమైన సందర్భంలో ఇది నిరంతరంగా అమలులో ఉండే హక్కును సూచిస్తుంది; metaphysical అనంతత్వాన్ని ప్రత్యేకంగా నిర్దేశించదు. ‘శాశ్వత’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ స్థిరత్వాన్ని తెలియజేస్తుంది.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: హక్కు లేవీయులకు ఉంటుంది
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని పూర్తిగా క్రియారూపంగా మార్చకుండా, ל־ సూచించే హక్కుదారులను స్పష్టంగా ఉంచుతుంది. చట్టబద్ధమైన నిరంతర అర్హతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లేవీయుల ఇళ్లకు సంబంధించిన విమోచన నిబంధన యొక్క చట్టబద్ధ బలం
  choice: లేవీయులకు తమ స్వాస్థ్య పట్టణాల్లోని ఇళ్లను తిరిగి విడిపించుకునే నిరంతర హక్కు ఉందని ప్రధాన పాఠ్యంలో స్పష్టపరచడం
  alternative: ‘శాశ్వత విమోచనం లేవీయులకు ఉంటుంది’ అని హీబ్రూ నిర్మాణాన్ని మరింత అక్షరార్థంగా ఉంచడం
  rationale: גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם అనే నామవాచక వాక్యభాగం లేవీయులకు కొనసాగుతూ ఉండే ఆస్తి-విమోచన హక్కును స్థాపిస్తుంది. ఇది ప్రధానంగా చట్టపరమైన, పదార్థ సంబంధిత అంశం; ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చట్టపరమైన శైలి వాడబడింది. ‘విమోచనం’ అనే పదానికి కలగగల విస్తృత మతపరమైన భావం వల్ల ప్రధాన పాఠ్యంలో ‘తిరిగి విడిపించుకునే హక్కు’ అని స్పష్టీకరించబడింది; అక్షరార్థ నిర్మాణం పాదటిప్పణిలో నిలుపబడింది.
