id: LEV.25.28
reference: Leviticus 25:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֨ם לֹֽא מָֽצְאָ֜ה יָד֗/וֹ דֵּי֮ הָשִׁ֣יב ל/וֹ֒ וְ/הָיָ֣ה מִמְכָּר֗/וֹ בְּ/יַד֙ הַ/קֹּנֶ֣ה אֹת֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יּוֹבֵ֑ל וְ/יָצָא֙ בַּ/יֹּבֵ֔ל וְ/שָׁ֖ב לַ/אֲחֻזָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: te
  text: అయితే, దాన్ని తిరిగి కొనడానికి కావలసినంత సొమ్ము అతనికి సమకూరకపోతే, అతడు అమ్మినది కొన్నవాని అధీనంలో సునాద సంవత్సరం వరకు ఉంటుంది. సునాద సంవత్సరంలో అది కొనుగోలుదారుని అధీనంలోనుంచి విడుదల అవుతుంది; అప్పుడు అమ్మినవాడు తన స్వాస్థ్యానికి తిరిగి వస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది తిరిగి అతని స్వాధీనంలోకి వస్తుంది.” చివరి హీబ్రూ క్రియకు అమ్మినవాడిని కాకుండా అమ్మిన ఆస్తిని కర్తగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: కావలసినంత సొమ్ము అతనికి సమకూరకపోతే
  rationale: ‘అతని చెయ్యి కనుగొనకపోతే’ అనే హీబ్రూ జాతీయాన్ని అక్షరార్థంగా ఉంచితే ఆధునిక తెలుగులో అస్పష్టంగా ఉంటుంది. ఈ న్యాయ-ఆర్థిక సందర్భంలో అది తగిన ఆర్థిక వనరులు సమకూరకపోవడాన్ని సూచిస్తుంది.
- source_word: הָשִׁיב לוֹ
  choice: దాన్ని తిరిగి కొనడానికి
  rationale: మునుపటి వాక్యంలోని పరిహార మొత్తాన్ని కొనుగోలుదారునికి చెల్లించి భూమిని విమోచించుకోవడమే సందర్భార్థం. తెలుగు న్యాయవ్యవహారంలో ‘తిరిగి కొనడం’ ఈ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמְכָּרוֹ
  choice: అతడు అమ్మినది
  rationale: ఈ నామవాచకం అమ్మకాన్ని లేదా అమ్మిన ఆస్తిని సూచించగలదు. కొనుగోలుదారుని అధీనంలో ఉండి సునాద సంవత్సరంలో విడుదలయ్యేది ఆస్తే కాబట్టి ‘అతడు అమ్మినది’ అని అనువదించాం.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: కొన్నవాని అధీనంలో
  rationale: ‘చేతిలో’ అనే హీబ్రూ రూపకం ఇక్కడ స్వాధీనాన్ని లేదా నియంత్రణను సూచిస్తుంది. ‘అధీనంలో’ ఆధునిక తెలుగులో స్పష్టమైన న్యాయపరమైన వ్యక్తీకరణ.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: సునాద సంవత్సరం
  rationale: యోబేలు సంవత్సరానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన, భావసూచకమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: సునాద సంవత్సరంలో అది అతని అధీనంలోనుంచి విడుదల అవుతుంది
  rationale: יָצָא యొక్క మౌలిక భావం ‘బయటికి వెళ్లడం.’ ఇక్కడ అమ్మిన ఆస్తి కొనుగోలుదారుని నియంత్రణనుంచి బయటపడటాన్ని సహజ తెలుగులో ‘విడుదల అవుతుంది’ అని తెలిపాం.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: అమ్మినవాడు తన స్వాస్థ్యానికి తిరిగి వెళ్తాడు
  rationale: పుంలింగ ఏకవచన క్రియకు అమ్మిన వ్యక్తినే కర్తగా తీసుకోవడం సందర్భానికి అనుకూలం. אֲחֻזָּה వారసత్వంగా కలిగిన భూస్వాస్థ్యాన్ని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: וְשָׁב అనే చివరి క్రియకు కర్త ఎవరు?
  choice: 'అమ్మినవాడే కర్త: ‘అమ్మినవాడు తన స్వాస్థ్యానికి తిరిగి వెళ్తాడు.’'
  alternative: 'అమ్మిన ఆస్తే కర్త: ‘అది తిరిగి అతని స్వాధీనంలోకి వస్తుంది.’'
  rationale: హీబ్రూలోని పుంలింగ ఏకవచన రూపం వ్యాకరణపరంగా అమ్మిన వ్యక్తిని గానీ అమ్మిన ఆస్తిని గానీ సూచించవచ్చు. సునాద ధర్మశాస్త్రంలోని వ్యక్తి తన వారసత్వ స్వాస్థ్యాన్ని తిరిగి పొందే అంశం మొదటి పఠనానికి కొంత బలం ఇస్తుంది; అయినా నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని ఉపయోగించాం. హీబ్రూ జాతీయాలను అవసరమైన చోట భావసహజంగా మార్చినా, చివరి క్రియలోని నిజమైన సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
