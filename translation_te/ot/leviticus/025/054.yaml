source:
  edition: WLC
  text: וְ/אִם לֹ֥א יִגָּאֵ֖ל בְּ/אֵ֑לֶּה וְ/יָצָא֙ בִּ/שְׁנַ֣ת הַ/יֹּבֵ֔ל ה֖וּא וּ/בָנָ֥י/ו עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: te
  text: అయితే ఈ విధానాల ద్వారా అతడు విమోచించబడకపోతే[a], యోబేలు సంవత్సరంలో అతడూ అతనితోపాటు అతని కుమారులూ విడుదల పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటి ద్వారా”—ఇది ముందటి వచనాల్లో వివరించిన విమోచన ఏర్పాట్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... కాకపోతే
  rationale: ముందటి విమోచన ఏర్పాట్లకు కొనసాగింపుగానూ స్వల్ప వ్యత్యాసంతో కూడిన షరతుగానూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִגָּאֵל
  choice: విమోచించబడకపోతే
  rationale: గోయేలు బంధుత్వం లేదా చెల్లింపు ద్వారా తిరిగి విడిపించే న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: בְּאֵלֶּה
  choice: ఈ మార్గాల్లో
  rationale: ముందటి వచనాల్లో చెప్పిన విమోచన పద్ధతులను సూచిస్తుంది; మూలంలోని సూచనాత్మక అస్పష్టతను పాదసూచికలో తెలియజేస్తుంది.
- source_word: וְיָצָא
  choice: విడుదల కావాలి
  rationale: అక్షరార్థంగా ‘బయటికి వెళ్లాలి’; ఈ దాస్యసేవా సందర్భంలో దాని సహజ న్యాయార్థం విడుదల కావడం.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: సునాద సంవత్సరంలో
  rationale: లేవీయకాండంలోని יוֹבֵל అనే నియమిత కాలానికి గౌరవప్రదమైన, అర్థవంతమైన తెలుగు బైబిలు పదాన్ని వాడుతుంది.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: అతడూ అతనితోపాటు అతని కుమారులూ
  rationale: స్వతంత్ర సర్వనామంలోని ప్రాధాన్యాన్ని, ‘కుమారులు’ అనే స్పష్టమైన పుంలింగ బహువచనాన్ని, వారంతా అతనితో విడుదల కావడాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בָנָיו అనే లింగనిర్దిష్ట కుటుంబ పదం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: హీబ్రూ మూలం స్పష్టంగా పుంలింగ బహువచనమైన ‘కుమారులు’ అంటుంది; దానిని విస్తరించి ‘పిల్లలు’గా మార్చలేదు.
- issue: וְיָצָא అనే ప్రయోగం
  choice: విడుదల కావాలి
  alternative: బయటికి వెళ్లాలి
  rationale: దాస్యసేవకు సంబంధించిన ఈ న్యాయ సందర్భంలో బయటికి వెళ్లడం అంటే సేవాబంధం నుంచి విడుదల కావడం; ఇది ప్రత్యేక సిద్ధాంతార్థాన్ని జోడించకుండా సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘విమోచించబడడం’ మూలంలోని גאל పదబంధాన్ని కాపాడుతుంది; ‘విడుదల కావాలి’ సందర్భంలోని సేవాబంధం ముగింపును స్పష్టం చేస్తుంది.
