  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: te
  text: నీవు అతనిపై కఠినంగా[a] అధికారం చలాయించకూడదు; నీ దేవునికి భయపడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రూరంగా,’ ‘అణచివేసే రీతిలో.’ హీబ్రూ పదం తీవ్రమైన, నలిపివేసే కఠిన వ్యవహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה בּוֹ
  choice: అతనిపై అధికారం చలాయించు
  rationale: רדה అనే క్రియ అధికారంతో ఏలడం లేదా పాలించడం అనే భావాన్ని ఇస్తుంది. సేవలో ఉన్న తోటి ఇశ్రాయేలీయునితో వ్యవహరించే ఈ న్యాయ సందర్భంలో, ‘అతనిపై అధికారం చలాయించు’ అనేది సంబంధంలోని అధికార అంశాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּפָרֶךְ
  choice: కఠినంగా
  rationale: פָּרֶךְ తీవ్రమైన, అణచివేసే కఠినత్వాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘కఠినంగా’ సహజంగా ఉంటుంది; పదంలోని మరింత బలమైన భావఛాయను పాదసూచిక తెలియజేస్తుంది.
- source_word: וְיָרֵאתָ
  choice: భయపడాలి
  rationale: మూలంలోని వావ్ సముచ్చయం వ్యాకరణపరంగా ‘మరియు’ అయినప్పటికీ, నిషేధం తరువాతి ఆజ్ఞ దేవునిపట్ల భయభక్తి మానవ అధికార వినియోగాన్ని నియంత్రించాలనే సంబంధాన్ని చూపుతుంది. తెలుగులో అర్థసంబంధాన్ని సహజంగా ఉంచేందుకు సెమికోలన్‌తో రెండో ఆజ్ఞను ఇచ్చాం; ప్రత్యేకంగా ‘కాని’ అని జోడించలేదు.
- source_word: מֵאֱלֹהֶיךָ
  choice: నీ దేవునికి
  rationale: ירא తో వచ్చిన מִן దేవుణ్ణి భయపడటానికి గురియైన వ్యక్తిగా సూచిస్తుంది. తెలుగులో ‘నీ దేవునికి భయపడాలి’ అనేది భయభక్తితో ఉండాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ స్వామ్యసూచకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగం నైతిక ప్రేరణగా పనిచేయడం
  choice: రెండు ఆజ్ఞలను సెమికోలన్‌తో అనుసంధానించి, దేవునిపట్ల భయం కఠిన అధికారాన్ని నిరోధించే ఆధారంగా వినిపించేలా చేయడం
  alternative: ‘మరియు నీ దేవునికి భయపడాలి’ అని మూల సముచ్చయాన్ని స్పష్టంగా అనువదించడం, లేదా ‘కాని’ అని వ్యతిరేక సంబంధాన్ని బలపరచడం
  rationale: మూలంలోని וְ సాధారణ సముచ్చయమే అయినా సందర్భంలో నైతిక వ్యత్యాసం ఉంది. ‘మరియు’ లేదా ‘కాని’ అనే ఒక్క వివరణను బలవంతంగా నిర్ణయించకుండా, రెండు ఆజ్ఞల మధ్య సంబంధాన్ని తెలుగులో సహజంగా మరియు కొంత తెరవుగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయ-ఆజ్ఞ శైలి. ‘అధికారం చలాయించు’ అధికార సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘కఠినంగా’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
