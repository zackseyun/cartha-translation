  source_fidelity: 'మొదటి ఆజ్ఞ రדה בּוֹ בְּפָרֶךְ భావాన్ని సరిగ్గా తెలియజేస్తుంది: వ్యక్తిపై అధికారాన్ని కఠినంగా వినియోగించరాదనే నిషేధం స్పష్టంగా ఉంది. చివరి భాగంలో ‘నీ దేవునికి’ అనేది ירא ... מִן అనే హీబ్రూ ప్రయోగానికి సహజ తెలుగు రూపం. అయితే ‘భయపడాలి’ అనేది సాధారణ/అవ్యక్త విధిరూపంగా వినిపిస్తుంది; మూలంలోని రెండవ పురుష ఏకవచన ఆజ్ఞకు ‘భయపడు’ సరిపోతుంది.'
