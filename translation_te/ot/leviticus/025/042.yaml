review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explanatory כִּי, YHWH's claim over the Israelites, the exodus grounding, and the legal prohibition. The final Hebrew phrase מִמְכֶּרֶת עָבֶד denotes sale in the manner of a slave transaction; the revision renders this more idiomatically and retains the passive legal force of לֹא יִמָּכְרוּ.
  naturalness: ‘బానిసను అమ్మిన విధంగా’ is awkward in Telugu because it mixes a generic singular object with the persons being sold. ‘బానిస విక్రయ పద్ధతిలో’ is natural, concise modern-standard Telugu. Recasting the relative clause as a finite clause also improves clarity without adding meaning.
  terminology: ‘నా దాసులు’ appropriately retains the source term’s relational, service, and ownership sense without forcing a single narrower Telugu equivalent. ‘బానిస విక్రయ పద్ధతి’ appropriately conveys the social-legal force of the final phrase. ‘ఐగుప్తు’ and the legal register are suitable.
  issues:
  - severity: medium
    issue: The phrase ‘వారిని బానిసను అమ్మిన విధంగా’ is grammatically and idiomatically awkward.
    rationale: It does not naturally express the Hebrew idiom ‘with/in the sale of a slave.’ Replacing it with ‘బానిస విక్రయ పద్ధతిలో’ gives the intended legal sense.
  - severity: low
    issue: The source’s passive prohibition is less directly represented by ‘వారిని ... అమ్మకూడదు.’
    rationale: Although understandable, ‘వారు ... అమ్మబడకూడదు’ more closely preserves the Niphal passive and the formal legal register.
