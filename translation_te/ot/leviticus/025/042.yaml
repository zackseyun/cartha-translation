source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: te
  text: ఎందుకంటే వారు నా దాసులు[a]—నేను వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను; వారు బానిస విక్రయ పద్ధతిలో అమ్మబడకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసులు’ అని అనువదించిన హిబ్రూ పదం సేవకులను లేదా బానిసలను సూచించగలదు. ఇక్కడ వారు యెహోవాకు చెందినవారనే భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బానిస విక్రయంతో అమ్మబడకూడదు’; అంటే సాధారణ బానిస విక్రయ పద్ధతిలో వారిని అమ్మకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే హేతువాచక అవ్యయంగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: עֲבָדַי הֵם
  choice: వారు నా దాసులు
  rationale: స్పష్టంగా ఉన్న הֵם ఇచ్చే ఉద్ఘాటనను ‘వారు’ ద్వారా నిలిపి, עֶבֶד లోని సేవ మరియు యాజమాన్య భావాలను ‘దాసులు’ అనే పదంతో సాధ్యమైనంతవరకు సంరక్షించింది.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: నేను ... బయటకు తీసుకొచ్చినవారు
  rationale: నిర్గమ కార్యాన్ని సూచించే హిబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: భౌగోళిక పదబంధానికి సూటిగా, బైబిలు తెలుగు వాడుకకు అనుగుణంగా ఉంది.
- source_word: לֹא יִמָּכְרוּ
  choice: వారిని ... అమ్మకూడదు
  rationale: హిబ్రూ నిఫల్ నిషేధార్థక రూపంలోని ‘అమ్మబడకూడదు’ అనే భావాన్ని తెలుగులో మరింత సహజమైన కర్తృరహిత నిషేధ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: బానిసను అమ్మిన విధంగా
  rationale: సాధారణ బానిస విక్రయ పద్ధతిలో అమ్మకూడదనే సామాజిక-న్యాయ భావాన్ని స్పష్టంగా ఉంచుతూ హిబ్రూ పదబంధానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: యెహోవాకు చెందిన ఇశ్రాయేలీయులను עֲבָדַי అని పేర్కొనడం
  choice: నా దాసులు
  alternative: నా సేవకులు / నా బానిసలు
  rationale: ‘సేవకులు’ యాజమాన్య భావాన్ని బలహీనపరచవచ్చు; ‘బానిసలు’ తెలుగులో కేవలం సామాజిక బానిసత్వాన్నే అత్యంత బలంగా సూచించవచ్చు. ‘దాసులు’ సేవ, ఆధీనత, యజమానికి చెందుట అనే భావాలను కలిపి ఉంచి మూలంలోని ఉద్రిక్తతను పూర్తిగా పరిష్కరించకుండా సంరక్షిస్తుంది.
- issue: నిర్గమ విమోచన మరియు దైవ యాజమాన్యం మధ్య సంబంధం
  choice: వాక్యంలోని కారణ సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: దేవుడు వారిని విమోచించాడు కాబట్టి వారు స్వతంత్రులు అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలపాఠం వారిని దేవుని దాసులని చెప్పి, అందువల్ల ఇతరులు వారిని సాధారణ బానిస ఆస్తిగా అమ్మరాదని నిర్దేశిస్తుంది. దీనిని సిద్ధాంతపరంగా సులభీకరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-ఒడంబడిక శైలి పాటించబడింది. ‘దాసులు’ మరియు ‘బానిస’లను ఉద్దేశపూర్వకంగా వేరు చేసి, మొదటి పదంలో దేవునికి సేవ/చెందుట అనే విస్తృత భావాన్ని, చివరి పదబంధంలో సాధారణ బానిస విక్రయపు న్యాయస్థితిని స్పష్టంచేసింది.
