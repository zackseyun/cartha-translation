- from: ఎందుకంటే, వారు నా దాసులు[a]—నేను ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినవారు; వారిని బానిసను అమ్మిన విధంగా అమ్మకూడదు.[b]
