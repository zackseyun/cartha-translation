source:
  edition: WLC
  text: וַ/אֲשֶׁ֤ר יִגְאַל֙ מִן הַ/לְוִיִּ֔ם וְ/יָצָ֧א מִמְכַּר בַּ֛יִת וְ/עִ֥יר אֲחֻזָּת֖/וֹ בַּ/יֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַ/לְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔/ם בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: te
  text: లేవీయులలో ఒకడు దానిని విమోచిస్తే[a], అతని స్వాస్థ్యపు పట్టణంలోని ఇంటి విక్రయం సునాద సంవత్సరంలో రద్దవుతుంది; ఎందుకంటే లేవీయుల పట్టణాల్లోని ఇళ్లు ఇశ్రాయేలు కుమారుల మధ్య వారి స్వాస్థ్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “లేవీయులలో ఒకడు విమోచిస్తే, స్వాస్థ్యపు పట్టణంలోని ఇంటి విక్రయం సునాద సంవత్సరంలో బయటికి వెళ్తుంది” అని ఉంది. “బయటికి వెళ్తుంది” అనేది కొనుగోలుదారుని అధీనంనుంచి ఆ విక్రయం లేదా అమ్మబడిన ఆస్తి విడుదల కావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן־הַלְוִיִּם
  choice: లేవీయులలో ఒకడు దానిని విమోచించకపోతే
  rationale: ఈ క్లిష్టమైన వాక్యనిర్మాణంలో מן‌ను సమూహంలో భాగాన్ని సూచించేదిగా తీసుకుని, లేవీయులలో ఎవరో విమోచించని పరిస్థితిని వ్యక్తం చేశాం. సందర్భానుసారంగా గృహమే ‘దానిని’ అనే కర్మ.
- source_word: וְיָצָא מִמְכַּר־בַּיִת
  choice: అమ్మబడిన ఇల్లు … తిరిగి అతనికి చెందాలి
  rationale: యָצָא అక్షరార్థంగా ‘బయటికి వెళ్లాలి’; సునాద సంవత్సరపు ఆస్తి చట్టంలో కొనుగోలుదారుని అధీనంనుంచి విడుదలై పూర్వ యజమానికి తిరిగివెళ్లడాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: అతని స్వాస్థ్యపు పట్టణంలో
  rationale: సంక్షిప్తమైన హెబ్రీ వాక్యనిర్మాణాన్ని సందర్భంతో కలిపి, ఆ ఇల్లు అతని స్వాస్థ్యానికి సంబంధించిన పట్టణంలో ఉందని వ్యక్తం చేశాం.
- source_word: בַּיֹּבֵל
  choice: సునాద సంవత్సరంలో
  rationale: యోబేలు అనే ఇశ్రాయేలు న్యాయవ్యవస్థలోని ప్రత్యేక సంవత్సరాన్ని తెలుగులో సుపరిచితమైన ‘సునాద సంవత్సరం’గా తెలిపాం.
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: లేవీయుల పట్టణాల్లోని ఇళ్లు
  rationale: హెబ్రీ సమాసపరంపర భావాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంతో తెలిపాం.
- source_word: אֲחֻזָּתָם
  choice: వారి స్వాస్థ్యం
  rationale: వంశపారంపర్యంగా కలిగిన భూహక్కు అనే న్యాయపరమైన భావాన్ని ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్య
  rationale: ప్రామాణిక నిబంధనా సముదాయపదంలోని రూపకల్పనను నిలుపుతూ בְּנֵי‌ను ‘కుమారులు’గా అనువదించాం.
theological_decisions:
- issue: יִגְאַל‌తో కూడిన ప్రతికూలతపై పాఠ్యార్థం
  choice: విమోచించకపోతే
  alternative: విమోచిస్తే
  rationale: మసొరేటిక్ పాఠ్యంలో స్పష్టమైన ప్రతికూల కణం లేకున్నా, ముందరి వచనంలోని విమోచన హక్కు మరియు సునాద సంవత్సరంలో తిరిగివచ్చే నియమం దృష్ట్యా అనేక ప్రాచీన/ఆధునిక అవగాహనల్లో భావపూర్వక ప్రతికూలత ఊహించబడుతుంది. వాక్యపు న్యాయపరమైన తర్కాన్ని నిలుపేందుకు ప్రధాన పాఠ్యంలో దీనిని స్వీకరించాం; పాఠ్యసందిగ్ధతను పాదటీపులో వెల్లడించాం.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు
  rationale: హెబ్రీలోని స్థిరమైన నిబంధనా సముదాయపదం యొక్క రూపాన్ని నిలిపాం; ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘విమోచించు,’ ‘స్వాస్థ్యం,’ ‘సునాద సంవత్సరం’ వంటి బైబిలు-న్యాయపరమైన పదాలను సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణంలో ఉంచాం. హెబ్రీలోని నిజమైన వ్యాకరణ/భావ సందిగ్ధతను పాదటీపులో స్పష్టంగా నిలిపాం.
