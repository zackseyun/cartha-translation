id: LEV.25.10
reference: Leviticus 25:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: te
  text: మీరు యాభయ్యవ సంవత్సరాన్ని ప్రతిష్ఠించి, దేశంలో నివసించే వారందరికీ విడుదలను ప్రకటించాలి.[a] అది మీకు సునాద సంవత్సరంగా ఉండాలి.[b] మీలో ప్రతి పురుషుడు తన స్వాస్థ్యానికి తిరిగి రావాలి,[c] మరియు ప్రతి పురుషుడు తన కుటుంబానికి తిరిగి రావాలి.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విడుదల’కు ‘స్వాతంత్ర్యం’ లేదా ‘విముక్తి’ అని కూడా అనువదించవచ్చు. హీబ్రూ దెరోర్ ఇక్కడ సునాద సంవత్సరంలో చేసే అధికారిక విడుదల ప్రకటనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ యోవేల్ పదానికి పొట్టేలు కొమ్ముతో సంబంధం ఉంది; ఇక్కడ అది ఆ కొమ్మునాదంతో ప్రకటించే ప్రత్యేక యాభయ్యవ సంవత్సరాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: హీబ్రూ పదం ముఖ్యంగా కుటుంబానికి సంక్రమించిన భూమి లేదా వారసత్వ స్వాస్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_clarification
  - marker: d
    text: ‘కుటుంబానికి’ అనే మాటను ‘వంశానికి’ లేదా ‘కుటుంబ వర్గానికి’ అని కూడా అనువదించవచ్చు. ‘ప్రతి పురుషుడు’ అనే హీబ్రూ ఏకవచనం ఇక్కడ ఒక్కొక్కరినీ విడివిడిగా సూచిస్తుంది.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: ప్రతిష్ఠించి
  rationale: పియేల్ రూపంలోని קדשׁ ఒకదాన్ని పవిత్రమైనదిగా ప్రత్యేకించడం లేదా ప్రతిష్ఠించడం సూచిస్తుంది. ‘ప్రతిష్ఠించి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పవిత్రార్థాన్ని నిలుపుతుంది.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: యాభయ్యవ సంవత్సరాన్ని
  rationale: హీబ్రూ సంఖ్యా నిర్మాణానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: విడుదలను ప్రకటించాలి
  rationale: דְּרוֹר ఇక్కడ సునాద సంవత్సరంలో దాస్యబంధాల నుంచి, ఆస్తి పరాయీకరణ నుంచి అధికారిక విడుదలను ప్రకటించడాన్ని సూచిస్తుంది; ‘విడుదల’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: దేశంలో నివసించే వారందరికీ
  rationale: בְּ యొక్క స్థానార్థాన్ని ‘దేశంలో’గా, יֹשְׁבֶיהָ యొక్క అర్థాన్ని సాధారణ ప్రజలకు స్పష్టమైన ‘నివసించే వారు’గా అందిస్తుంది.
- source_word: יוֹבֵל
  choice: సునాద సంవత్సరం
  rationale: లేవీయకాండము 25లో ఇది యాభయ్యవ సంవత్సరపు ప్రత్యేక వ్యవస్థకు సాంకేతిక పదం. తెలుగులో స్థిరపడిన బైబిలు పదమైన ‘సునాద సంవత్సరం’ ఆ వ్యవస్థను సూచిస్తుంది; మూలపదానికి పొట్టేలు కొమ్ము/దాని నాదంతో సంబంధం ఉన్నప్పటికీ ఇక్కడ కేవలం వాద్యం ఉద్దేశం కాదు.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: తిరిగి వెళ్లాలి ... తిరిగి వెళ్లాలి
  rationale: మూలంలోని שוב పద పునరుక్తిని, పునరుద్ధరణ భావాన్ని రెండూ నిలుపుతుంది.
- source_word: אִישׁ
  choice: ప్రతి పురుషుడు
  rationale: אִישׁ వ్యాకరణపరంగా పురుష ఏకవచనం, ఇక్కడ పంపిణీయ భావంలో ఉంది. తెలుగు అనువాదం మూలంలోని లింగరూపాన్ని దాచకుండా ‘ప్రతి పురుషుడు’గా ఇస్తుంది.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: తన వంశపారంపర్య భూస్వాస్థ్యానికి
  rationale: אֲחֻזָּה ఈ సందర్భంలో సాధారణ వస్తుసంపదకంటే కుటుంబానికి కేటాయించబడిన వారసత్వ భూహక్కును సూచిస్తుంది. ‘వంశపారంపర్య భూస్వాస్థ్యం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: తన కుటుంబానికి
  rationale: מִשְׁפָּחָה కుటుంబం లేదా విస్తృత వంశగుంపును సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘కుటుంబం’ను ఉంచి, విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: చట్టపరమైన వాక్యంలో పంపిణీయ אִישׁ అనువాదం
  choice: ప్రతి పురుషుడు
  alternative: మీలో ప్రతి ఒక్కరు
  rationale: రెండవ పురుష బహువచన సంబోధనలో ప్రతి వ్యక్తి బాధ్యత ఉద్దేశమైనప్పటికీ, మూలంలో ఉన్న పురుష ఏకవచన రూపాన్ని ప్రధాన పాఠం నిలుపుతుంది; దాని పంపిణీయ ప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- issue: יוֹבֵל యొక్క సాంకేతిక భావం
  choice: సునాద సంవత్సరం
  alternative: విడుదల సంవత్సరం; పొట్టేలు కొమ్ము నాదం
  rationale: ఈ సందర్భంలో పదం కేవలం కొమ్మునో నాదాన్నో కాక యాభయ్యవ సంవత్సరపు సంస్థను సూచిస్తుంది. అందువల్ల తెలుగులో గుర్తించదగిన సాంకేతిక పదబంధాన్ని వాడి, పదవ్యుత్పత్తి సంబంధాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చట్టపరమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ‘ప్రతిష్ఠించాలి’, ‘విడుదల’, ‘సునాద సంవత్సరం’, ‘వంశపారంపర్య భూస్వాస్థ్యం’ వంటి పదాలు పవిత్రత, అధికారిక ప్రకటన, ప్రత్యేక సంవత్సర వ్యవస్థ, వారసత్వ భూమి అనే మూలభావాలను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తాయి. మూలంలోని ‘తిరిగి వెళ్లాలి’ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
