  revision_rationale: అనవసరంగా విస్తరించిన ‘వంశపారంపర్య భూస్వాస్థ్యం’ను మూలానికి మరింత సమీపమైన, సహజమైన ‘స్వాస్థ్యం’గా మార్చాం. వారసత్వ భూమి అనే సందర్భార్థాన్ని పాదసూచికలో నిలిపాం. ఇతర పదాలు, పాదసూచిక సూచికలు, మరియు మూలంలోని రెండు ‘తిరిగి రావడం’ క్రియల పునరుక్తి కాపాడబడ్డాయి.
