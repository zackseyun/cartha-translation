- from: భూమిని శాశ్వతంగా[a] అమ్మకూడదు; ఎందుకంటే భూమి నాది. మీరు నా దగ్గర పరదేశులుగాను నివాసులుగాను ఉన్నారు.[b]
  to: భూమిని శాశ్వతంగా[a] విక్రయించకూడదు; ఎందుకంటే భూమి నాది.[b] మీరు నా దగ్గర పరదేశులుగా, తాత్కాలిక నివాసులుగా ఉన్నారు.
  rationale: The revision preserves the Hebrew legal and theological force while improving lexical differentiation in the גֵרִים/וְתוֹשָׁבִים pair. It also corrects the lexical-alternative note and places the cultural note at the ownership clause it explicates.
