source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: te
  text: భూమిని శాశ్వతంగా[a] విక్రయించకూడదు; ఎందుకంటే భూమి నాది.[b] మీరు నా దగ్గర పరదేశులుగా, తాత్కాలిక నివాసులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎప్పటికీ’ లేదా ‘శాశ్వతంగా పరాయివారి అధీనంలోకి వెళ్లేలా.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరదేశులు, తాత్కాలిక నివాసులు’ అనే జంటపదం, భూమి దేవునిదై ఉండగా ఇశ్రాయేలీయులు ఆయనపై ఆధారపడి అక్కడ నివసిస్తున్న స్థితిని తెలియజేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: అమ్మకూడదు
  rationale: నిఫాల్ అసంపూర్ణ క్రియారూపం ఈ న్యాయ సందర్భంలో నిషేధార్థక కర్మణి భావాన్ని ఇస్తుంది. తెలుగులో ‘అమ్మకూడదు’ ఆ న్యాయబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִצְמִתֻת
  choice: శాశ్వతంగా
  rationale: ఈ భూహక్కుల సందర్భంలో తిరిగి పొందలేనివిధంగా శాశ్వత పరాధీనం చేయడాన్ని సూచిస్తుంది; ‘శాశ్వతంగా’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כִּי לִי הָאָרֶץ
  choice: ఎందుకంటే భూమి నాది
  rationale: כִּי నిషేధానికి కారణాన్ని తెలియజేస్తుంది; ‘భూమి నాది’ అనే దేవుని ప్రత్యక్ష యాజమాన్య ప్రకటనను యథాతథంగా ఉంచుతుంది.
- source_word: גֵרִים
  choice: పరదేశులు
  rationale: సొంత వారసత్వ హక్కు లేని దేశంలో ఆధారపడి నివసించే వారి స్థితిని సూచిస్తుంది. ‘పరదేశులు’ స్థానికేతర స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: וְתוֹשָׁבִים
  choice: నివాసులు
  rationale: ఒక చోట నివసిస్తున్నా దానిపై పూర్తి వారసత్వ హక్కు లేని నివాసులను సూచిస్తుంది; జతపదంలోని భావభేదాన్ని నిలుపుతుంది.
- source_word: עִמָּדִי
  choice: నా దగ్గర
  rationale: עם + మొదటి పురుష ఏకవచన ప్రత్యయం అక్షరార్థంగా ‘నాతో/నా దగ్గర’ అని ఉంటుంది. భూమి దేవునిదై ఉండగా ఇశ్రాయేలు ఆయన వద్ద ఆధారిత నివాసులుగా ఉన్నారనే సందర్భానికి ‘నా దగ్గర’ సహజంగా సరిపోతుంది.
theological_decisions:
- issue: భూమితో ఇశ్రాయేలు సంబంధ స్వభావం
  choice: ఇశ్రాయేలు భూమిపై కలిగిన హక్కు దేవుని యాజమాన్యానికి లోబడినదని వచనం బోధిస్తుంది.
  alternative: ఇది దైవిక యాజమాన్య భావం లేని కేవలం సామాజిక-ఆర్థిక నియమం; లేదా యూబిలీ సందర్భాన్ని మించిన సంపూర్ణ హక్కుచ్యుతిని సూచిస్తుంది.
  rationale: ‘భూమి నాది’ అనే స్పష్టమైన కారణం యూబిలీ నియమాన్ని దేవుని యాజమాన్యంలో నిలుపుతుంది. అనువాదం న్యాయపరమైన, దైవశాస్త్రపరమైన రెండు కోణాలనూ అదనపు సిద్ధాంత విస్తరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘పరదేశులు—నివాసులు’ అనే హెబ్రీ జంటపదంలోని వేర్వేరు ఛాయలను నిలిపి, ‘నా దగ్గర’ ద్వారా עִמָּדִי యొక్క సంబంధార్థక అస్పష్టతను అతిగా వివరించకుండా కాపాడాం.
