  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: te
  text: “ఒక వ్యక్తి గోడలున్న పట్టణంలో ఒక నివాస గృహాన్ని అమ్మితే, అమ్మిన తేదీ నుంచి పూర్తి సంవత్సరం ముగిసే వరకు దానిని తిరిగి కొనుగోలు చేయవచ్చు; దానిని తిరిగి కొనుగోలు చేసే హక్కు పూర్తి సంవత్సరం పాటు[a] ఉంటుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “దినాలపాటు”; ఈ న్యాయపరమైన ప్రయోగం పూర్తి సంవత్సరకాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ఒక వ్యక్తి ... అమ్మితే
  rationale: ఇది ఒక న్యాయపరమైన షరతును ప్రవేశపెడుతుంది. אִישׁ వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఇక్కడ సాధారణ న్యాయనియమంలోని వ్యక్తిని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘ఒక వ్యక్తి’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: בֵּית מוֹשַׁב
  choice: ఒక నివాస గృహం
  rationale: ఈ నిర్మాణ పదబంధం నివసించడానికి ఉపయోగించే ఇంటిని సూచిస్తుంది; ‘నివాస గృహం’ ఆ భేదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עִיר חוֹמָה
  choice: ప్రాకారం ఉన్న పట్టణం
  rationale: పదబంధం గోడ లేదా ప్రాకారం కలిగిన పట్టణాన్ని సూచిస్తుంది. ‘ప్రాకారం ఉన్న పట్టణం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: גְּאֻלָּתוֹ
  choice: దాన్ని తిరిగి కొనుక్కోవచ్చు / దాన్ని తిరిగి కొనుక్కునే హక్కు
  rationale: ఈ ఆస్తి-న్యాయ సందర్భంలో גְּאֻלָּה అమ్మిన ఆస్తిని నిర్ణీత కాలంలో తిరిగి స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. ‘తిరిగి కొనుక్కోవడం’ అనే ప్రయోగం సాధారణ పాఠకులకు ఆ న్యాయార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: అది అమ్మిన నాటి నుంచి పూర్తి సంవత్సరం ముగిసే వరకు
  rationale: ఇది క్యాలెండర్ సంవత్సరం ముగింపును కాక, అమ్మిన సమయం నుంచి లెక్కించే పూర్తి సంవత్సరాన్ని సూచిస్తుంది.
- source_word: יָמִים תִּהְיֶה גְאֻלָּתוֹ
  choice: దాన్ని తిరిగి కొనుక్కునే హక్కు పూర్తి సంవత్సరం పాటు ఉంటుంది
  rationale: יָמִים అక్షరార్థంగా ‘దినాలు’ అయినా, ఈ న్యాయపరమైన ప్రయోగంలో పూర్తి సంవత్సర కాలాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో ఉద్దేశిత అర్థాన్ని సహజంగా ఇచ్చి, మూల ప్రయోగాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన న్యాయశైలిని పాటిస్తూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. మూలంలోని పునరుక్తిని మరియు విమోచన హక్కు కాలపరిమితిని నిలిపాం.
