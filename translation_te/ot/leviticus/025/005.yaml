reference: Leviticus 25:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: te
  text: నీ పూర్వపు పంటనుండి తనంతట తానే మొలిచిన పంటను[a] కోయకూడదు; కత్తిరించకుండా వదిలిన నీ ద్రాక్షతీగకు కాసిన ద్రాక్షపండ్లను[b] ఏరుకోకూడదు. అది భూమికి సంపూర్ణ విశ్రాంతి సంవత్సరం అవుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనంతట తానే పెరిగిన పంటను.” ఇది గత పంటలో పడిన విత్తనాలనుంచి సాగు చేయకుండానే మొలిచిన పంటను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వేరుగా ఉంచబడిన నీ ద్రాక్షతీగ ద్రాక్షపండ్లను.” ఇక్కడ హీబ్రూ పదం విశ్రాంతి సంవత్సరంలో సంరక్షించకుండా, కొమ్మలు కత్తిరించకుండా వదిలిన ద్రాక్షతీగను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “భూమికి సబ్బాతు సంవత్సరం,” లేదా “భూమికి మహా విశ్రాంతి సంవత్సరం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: నీ కోతలోనుంచి దానంతట అదే మొలిచిన పంట
  rationale: סְפִיחַ గత కోతలో పడిన విత్తనాలనుంచి సాగు చేయకుండానే మొలిచే పంటను సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేయడానికి వివరణాత్మకంగా అనువదించబడింది.
- source_word: תִקְצֹר
  choice: కోయకూడదు
  rationale: ఈ క్రియ ధాన్యాన్ని లేదా పొలంలోని పంటను కోయడాన్ని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: కత్తిరించకుండా వదిలిన నీ ద్రాక్షతీగల ద్రాక్షపండ్లు
  rationale: వ్యవసాయ సందర్భంలో נָזִיר సంరక్షణ చేయకుండా, కొమ్మలు కత్తిరించకుండా వదిలిన ద్రాక్షతీగను సూచిస్తుంది; ‘వేరుచేయబడిన’ అనే అక్షరార్థం తెలుగులో అస్పష్టంగా ఉంటుంది.
- source_word: תִבְצֹר
  choice: ఏరుకోకూడదు
  rationale: ద్రాక్షపండ్లను సేకరించడానికి వాడే క్రియ కావడంతో సహజమైన తెలుగు వ్యవసాయ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి సంవత్సరం
  rationale: שַׁבָּתוֹן సాధారణ విశ్రాంతికన్నా గాఢమైన లేదా సంపూర్ణమైన విశ్రాంతిని సూచిస్తుంది; ‘సబ్బాతు సంవత్సరం’ అనే పారిభాషిక రూపంతో మాత్రమే పరిమితం చేయకుండా మూల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לָאָרֶץ
  choice: భూమికి
  rationale: లేవీయకాండము 25లో ఇది సాగుభూమి విశ్రాంతిని సూచిస్తుంది; తెలుగు సందర్భంలో ‘భూమి’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: భూమి సబ్బాతు విశ్రాంతిని తరువాతి కాలపు సిద్ధాంతార్థాలు చేర్చకుండా వ్యక్తీకరించడం
  choice: భూమికి సంపూర్ణ విశ్రాంతి సంవత్సరం
  alternative: భూమికి సబ్బాతు సంవత్సరం / భూమికి మహా విశ్రాంతి సంవత్సరం
  rationale: ఈ ఎంపిక శַׁבָּתוֹן లోని గాఢమైన విశ్రాంతి భావాన్ని నిలుపుతూ, దానిని కేవలం క్యాలెండరు పేరుగా మార్చదు; అదే సమయంలో మూలపాఠానికి మించిన ఆచార లేదా సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. వ్యవసాయ పదబంధాల్లో మూల హీబ్రూ భావాన్ని స్పష్టంగా చేయడానికి పరిమిత వివరణాత్మక సమానార్థక అనువాదం వాడబడింది.
