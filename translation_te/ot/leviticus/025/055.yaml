source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: te
  text: ఎందుకంటే ఇశ్రాయేలు కుమారులు నాకు దాసులు[a]; వారు నా దాసులు[b]—వారిని నేను ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. నేను మీ దేవుడనైన యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు,” లేదా “ఇశ్రాయేలు సంతతి.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా సేవకులు.” హీబ్రూ పదం బద్ధసేవను సూచిస్తుంది; ఇక్కడ ఇశ్రాయేలు మానవ యజమానులకు కాక యెహోవాకే చెందుతుందనే అంశం ప్రధానంగా ఉన్నందున “దాసులు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నియమానికి ఈ వాక్యం కారణాన్ని తెలియజేస్తుంది; తెలుగు భాషలో ఈ వివరణాత్మక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: దేవునికి చెందినవారనే భావాన్ని నేరుగా నిలుపుతుంది; తరువాతి ‘నా దాసులు’ అనే పదబంధంతో అధికారం, అనుబంధం స్పష్టమవుతాయి.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన సామూహిక నుడికారాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: עֲבָדִים / עֲבָדַי
  choice: దాసులు / నా దాసులు
  rationale: עבד పదంలోని బద్ధసేవ, యజమానికి చెందిన స్థితి రెండింటినీ ‘దాసులు’ తెలియజేస్తుంది; ‘సేవకులు’ కంటే ఈ సందర్భంలోని అధీనత వ్యత్యాసాన్ని బలంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: నేను ... బయటకు తీసుకొచ్చిన వారు
  rationale: హిఫిల్ రూపంలోని నిర్గమన కార్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: నిర్గమన సూత్రవాక్యాన్ని స్పష్టంగా, సంప్రదాయ తెలుగు బైబిల్ భాషతో అనుసంధానంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: హీబ్రూ నిబంధనాత్మక స్వామ్యసంబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: నిబంధనాత్మక అనుబంధం, మానవ యజమానుల అధీనత మధ్య వ్యత్యాసంలో עבד అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: 'ఈ వచనం ఇశ్రాయేలీయులు శాశ్వతంగా మానవ యజమానులకు చెందరాదనే నియమానికి కారణం చెబుతుంది: వారు యెహోవాకు చెందినవారు. ‘దాసులు’ అనే పదం ఆ బద్ధస్థితి, అధీనత భావాన్ని నిలుపుతుంది; అయితే పాదసూచికలో ‘సేవకులు’ అనే సాధ్యమైన అనువాదాన్ని ఇస్తుంది.'
- issue: בְנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక నుడికారం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని కుటుంబసంబంధమైన, వ్యాకరణపరంగా పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామూహిక అర్థాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ‘నేనే ... యెహోవాను’ అనే రూపం אֲנִי యొక్క ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
