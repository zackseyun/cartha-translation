    text: లేదా “ఇశ్రాయేలీయులు,” లేదా “ఇశ్రాయేలు సంతతి.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా సేవకులు.” హీబ్రూ పదం బద్ధసేవను సూచిస్తుంది; ఇక్కడ ఇశ్రాయేలు మానవ యజమానులకు కాక యెహోవాకే చెందుతుందనే అంశం ప్రధానంగా ఉన్నందున “దాసులు” అని అనువదించబడింది.
    reason: lexical_alternative
