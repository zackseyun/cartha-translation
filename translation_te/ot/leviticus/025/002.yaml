source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: te
  text: 'ఇశ్రాయేలీయులతో మాట్లాడి, వారితో ఇలా చెప్పు: “నేను మీకు ఇస్తున్న దేశంలోకి మీరు వచ్చినప్పుడు, ఆ దేశం యెహోవాకు శబ్బాతు విశ్రాంతిని ఆచరించాలి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశం యెహోవాకు శబ్బాతు విశ్రాంతి పొందాలి.” హీబ్రూ వాక్యం దేశాన్ని ఒక వ్యక్తిలా చూపిస్తూ, అది శబ్బాతు విశ్రాంతిని ఆచరిస్తుందని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם
  choice: ఇశ్రాయేలీయులతో ఇలా చెప్పు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ కుటుంబపరమైన పదబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సమూహమంతటినీ సూచించే ‘ఇశ్రాయేలీయులు’గా అనువదించాం; రెండు వాక్కు క్రియల భావాన్ని సంక్షిప్తమైన ‘ఇలా చెప్పు’ నిలుపుతుంది.
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: దేశంలోకి మీరు వచ్చినప్పుడు
  rationale: న్యాయపరమైన ఈ సందర్భంలో כִּי ఎదురుచూస్తున్న భవిష్యత్ సందర్భాన్ని సూచిస్తుంది; అందువల్ల షరతుకన్నా కాలార్థకమైన ‘వచ్చినప్పుడు’ సరిపోతుంది.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: నేను మీకు ఇస్తున్న
  rationale: నֹתֵן అనే కృదంతంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్ దానక్రియను ‘ఇస్తున్న’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: ఆ దేశం విశ్రాంతి దినాన్ని ఆచరించాలి
  rationale: హీబ్రూ వాక్యం దేశాన్ని వ్యక్తీకరించి, అది శబ్బాతు విశ్రాంతిని పాటిస్తున్నట్లు చెబుతుంది. ‘ఆచరించాలి’ ఆ వ్యక్తీకరణను, ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: לְ యొక్క అంకితార్థాన్ని ‘కోసం’ తెలియజేస్తుంది; יהוה అనే దైవనామాన్ని తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపంలో నిలిపాం.
- issue: దేశం శబ్బాతును ఆచరించడం అనే వ్యక్తీకరణ
  choice: దేశం విశ్రాంతి దినాన్ని ఆచరించాలి
  alternative: దేశం విశ్రాంతి పొందాలి
  rationale: కేవలం వ్యవసాయ విరామంగా సరళీకరించకుండా, దేశమే యెహోవా కోసం శబ్బాతును ఆచరిస్తుందనే మూలంలోని ధార్మిక వ్యక్తీకరణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; శాసనాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘విశ్రాంతి దినం’ అర్థాన్ని స్పష్టం చేస్తుంది; పాదసూచికలో ‘శబ్బాతు’ అనే ప్రత్యామ్నాయాన్ని ఉంచాం.
