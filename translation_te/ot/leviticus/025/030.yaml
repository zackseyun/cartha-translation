revisions:
- from: కాని దాన్ని ఒక పూర్తి సంవత్సరం ముగిసేలోగా విడిపించకపోతే, ప్రాకారం లేని పట్టణంలో ఉన్న ఆ ఇల్లు దాన్ని కొన్నవాడికి, అతని తరతరాలకు శాశ్వతంగా స్థిరపడుతుంది[a]. సునాద సంవత్సరంలో అది తిరిగి వెళ్లదు[b].
  to: కాని ఆ ఇంటిని పూర్తి సంవత్సరం ముగిసేలోగా విమోచించకపోతే, ప్రాకారం గల పట్టణంలో ఉన్న ఆ ఇల్లు కొన్నవాడికీ అతని తరతరాలకూ శాశ్వత సొత్తుగా నిలుస్తుంది[a]. యోబేలు సంవత్సరంలో అది తిరిగి వెళ్లదు[b].
  rationale: మసొరెటికు కెతీవ్/కెరే సమస్యను దాచకుండా పాదటిప్పణిలో తెలిపి, సందర్భానుసారమైన సంప్రదాయ పఠనంతో ప్రధాన పాఠాన్ని సరిచేశాం. దీనివల్ల 30వ వచనంలోని శాశ్వత విక్రయ నియమం, 31వ వచనంలోని ప్రాకారం లేని గ్రామాల నియమంతో కలగకుండా ఉంటుంది. ఇతర పదబంధాలు మూలంలోని న్యాయపరమైన, వంశపారంపర్య, యోబేలు-సంబంధ భావాలను నిలుపుతాయి.
