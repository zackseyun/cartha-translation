id: LEV.25.30
reference: Leviticus 25:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: te
  text: కాని ఆ ఇంటిని పూర్తి సంవత్సరం ముగిసేలోగా విమోచించకపోతే, ప్రాకారం గల పట్టణంలో ఉన్న ఆ ఇల్లు కొన్నవాడికీ అతని తరతరాలకూ శాశ్వత సొత్తుగా నిలుస్తుంది[a]. యోబేలు సంవత్సరంలో అది తిరిగి వెళ్లదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వ్యంజన పాఠంలో “ప్రాకారం లేదు” అని ఉన్నా, సంప్రదాయ పఠనం “దానికి ప్రాకారం ఉంది” అని చదువుతుంది; తదుపరి వచనంలోని వ్యత్యాసం కూడా ఈ పఠనానికే మద్దతు ఇస్తుంది. “శాశ్వత సొత్తుగా నిలుస్తుంది” అంటే విక్రయం చట్టబద్ధంగా శాశ్వతమవుతుంది.
    reason: textual_variant
  - marker: b
    text: అంటే, యోబేలు సంవత్సరంలో ఆ ఇల్లు మొదటి యజమాని కుటుంబానికి తిరిగి చెందదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: విడిపించకపోతే
  rationale: గאל్ నిఫల్ రూపం ఇక్కడ ఆస్తిని నిర్ణీత కాలంలో వెల చెల్లించి తిరిగి పొందడాన్ని సూచిస్తుంది. లేవీయకాండం 25లోని విమోచన సంబంధిత న్యాయపరమైన పదజాలాన్ని ‘విడిపించు’ నిలుపుతుంది.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: ఒక పూర్తి సంవత్సరం ముగిసేలోగా
  rationale: ఇది విమోచనకు గడువును సూచిస్తుంది. తెలుగు సహజత్వం కోసం సర్వనామ ప్రత్యయాన్ని విడిగా అనువదించకుండా, ఇంటి అమ్మకానికి సంబంధించిన పూర్తి సంవత్సర కాలాన్ని స్పష్టంగా తెలిపింది.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: శాశ్వతంగా స్థిరపడుతుంది
  rationale: ‘నిలుస్తుంది’ అనే మూల భావంతో పాటు, ఆ విక్రయం ఇక తిరుగులేని విధంగా చట్టబద్ధంగా స్థిరమవుతుందనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לֹא חֹמָה
  choice: ప్రాకారం లేని పట్టణంలో ఉన్న ఆ ఇల్లు
  rationale: మూలంలోని సంబంధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా, అర్థనష్టంలేకుండా అందిస్తుంది.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: దాన్ని కొన్నవాడికి
  rationale: కొనుగోలుదారుని సూచించే కృదంతాన్ని సాధారణ పాఠకుడికి సహజమైన రూపంలో తెలిపింది.
- source_word: לְדֹרֹתָיו
  choice: అతని తరతరాలకు
  rationale: కొనుగోలుదారుని వంశపారంపర్య హక్కు కొనసాగుతుందనే భావాన్ని మూలానికి సమీపంగా ఉంచుతుంది.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: సునాద సంవత్సరంలో అది తిరిగి వెళ్లదు
  rationale: యָצָא యొక్క ‘బయటికి వెళ్లడం’ అనే రూపకాన్ని ఆస్తి మూల కుటుంబానికి తిరిగి చెందకపోవడమనే న్యాయసందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יּוֹבֵל
  choice: సునాద సంవత్సరం
  rationale: లేవీయకాండం 25లోని యోబేలు వ్యవస్థకు అర్థవంతమైన, గౌరవప్రదమైన తెలుగు పదం; అది ప్రత్యేక సంవత్సరాన్ని సూచిస్తుందని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ప్రాకారం లేని పట్టణంలోని ఇంటి విక్రయానికి గల చట్టబద్ధమైన శాశ్వతత్వం
  choice: పూర్తి సంవత్సరంలో విడిపించకపోతే ఆ ఇల్లు కొనుగోలుదారునికీ అతని తరాలకూ శాశ్వతంగా స్థిరపడుతుంది; సునాద సంవత్సరంలో మూల కుటుంబానికి తిరిగి వెళ్లదు.
  alternative: విక్రయం కొనుగోలుదారునికి చెల్లుబాటవుతుందని మాత్రమే చెప్పి, వంశపారంపర్య శాశ్వతత్వాన్ని తక్కువగా వ్యక్తం చేయడం.
  rationale: וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו, לֹא יֵצֵא בַּיּוֹבֵל అనే పదబంధాల సమాహారం తిరుగులేని, తరతరాల ఆస్తి బదిలీని బలంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘విడిపించు,’ ‘శాశ్వతంగా స్థిరపడుతుంది,’ ‘తరతరాలకు’ అనే పదాలు మూలంలోని విమోచన, చట్టబద్ధ స్థిరత్వం, వంశపారంపర్య కొనసాగింపు భావాలను నిలుపుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
