id: LEV.25.14
reference: Leviticus 25:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: te
  text: మీరు మీ తోటివానికి ఏదైనా అమ్మినా, లేదా మీ తోటివాని దగ్గర ఏదైనా కొన్నా, మీలో ఎవరూ తన సహోదరునికి అన్యాయం చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకరు మరొకరికి అన్యాయం చేయకూడదు’ లేదా ‘మోసం చేయకూడదు.’ ఇక్కడి క్రియ, ముఖ్యంగా వ్యాపార లావాదేవీలలో, ఎదుటివారికి అన్యాయం చేయడం లేదా అన్యాయంగా లాభం పొందడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: మీరు ... అమ్మినా
  rationale: న్యాయవిధిలోని షరతును సహజమైన తెలుగు ‘అమ్మినా ... కొన్నా’ నిర్మాణంతో తెలిపి, וְ యొక్క అనుసంధాన భావాన్ని వాక్యప్రవాహంలో నిలిపింది.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: ఏదైనా అమ్మినా
  rationale: מִמְכָּר అమ్మబడే వస్తువును లేదా అమ్మకపు లావాదేవీని సూచించగలదు; తెలుగులో ‘ఏదైనా అమ్మినా’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לַעֲמִיתֶךָ ... עֲמִיתֶךָ
  choice: మీ తోటివానికి ... మీ తోటివాని దగ్గర
  rationale: עָמִית సమాజంలోని తోటి సభ్యుణ్ని సూచిస్తుంది. ‘తోటివాడు’ ఆ సామాజిక సంబంధాన్ని నిలుపుతుంది; מִיַּד అనే ‘చేతినుండి’ ప్రయోగాన్ని తెలుగులో సహజమైన ‘దగ్గర’గా వ్యక్తం చేసింది.
- source_word: אוֹ קָנֹה
  choice: లేదా ... ఏదైనా కొన్నా
  rationale: ఇక్కడ infinitive absolute ముందున్న క్రియతో సమన్వయంగా ‘కొను’ అనే రెండవ లావాదేవీని సూచిస్తుంది.
- source_word: אַל תּוֹנוּ
  choice: అన్యాయం చేయకూడదు
  rationale: ינה ఈ వాణిజ్య సందర్భంలో ఎదుటివారిని అన్యాయంగా నష్టపరచడం లేదా వారి బలహీనతను ఉపయోగించుకోవడం అనే విస్తృత భావాన్ని కలిగిస్తుంది. ‘అన్యాయం చేయకూడదు’ ఆ పరిధిని అతిగా కుదించదు.
- source_word: אִישׁ אֶת אָחִיו
  choice: ఎవ్వరూ తన సహోదరునికి
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ఎవ్వరూ’ సహజంగా వ్యక్తం చేస్తుంది; אָחִיו లోని సహోదర సంబంధ భాషను ‘తన సహోదరునికి’ నిలుపుతుంది.
theological_decisions:
- issue: న్యాయ నిషేధంలోని పుంలింగ ప్రతినిధి పదాలు
  choice: ‘ఎవ్వరూ తన సహోదరునికి’ అని అనువదించడం
  alternative: ‘ఒకరినొకరు’ లేదా ‘తోటివారికి’
  rationale: אִישׁ యొక్క సాధారణ పంపిణీ భావానికి ‘ఎవ్వరూ’ సహజమైన తెలుగు; అదే సమయంలో אָחִיו లోని సహోదర సంఘీభావాన్ని ‘తన సహోదరునికి’ అని నిలిపి, దాన్ని పూర్తిగా లింగతటస్థ పదబంధంగా మార్చలేదు.
- issue: ינה యొక్క వాణిజ్య-నైతిక భావం
  choice: ‘అన్యాయం చేయకూడదు’
  alternative: ‘మోసం చేయకూడదు’ లేదా ‘అన్యాయంగా ప్రయోజనం పొందకూడదు’
  rationale: ఈ సందర్భం వాణిజ్య లావాదేవీలకు సంబంధించినదైనా, క్రియ మోసం అనే ఒక్క విధానానికే పరిమితం కాదు. విస్తృత నైతిక నిషేధాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యేక వాణిజ్య భావాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయవిధి శైలిని ఉపయోగించింది. ‘తోటివాడు’ సమాజ సభ్యత్వ భావాన్ని, ‘సహోదరుడు’ మూలంలోని బంధుత్వ-సంఘీభావ భాషను నిలుపుతాయి. ‘చేతినుండి’ అనే హీబ్రూ జాతీయాన్ని అక్షరానువాదం చేయకుండా ‘దగ్గర’గా సహజీకరించింది.
