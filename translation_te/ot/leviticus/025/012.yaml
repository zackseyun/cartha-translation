revisions:
- from: ఎందుకంటే అది సునాద సంవత్సరం; అది మీకు పవిత్రంగా ఉండాలి. పొలం నుంచే దాని దిగుబడిని మీరు తినాలి.
  to: ఎందుకంటే అది యోబేలు సంవత్సరం; అది మీకు పవిత్రమైనదై ఉండాలి. పొలం నుండి దాని పంటను[a] మీరు తినాలి.
  rationale: The revision replaces an unclear expression for יוֹבֵל with “యోబేలు సంవత్సరం,” removes unwarranted emphasis from the phrase for “from the field,” and restores the produce/yield footnote with an anchor on “పంటను.” It preserves the legal-instructional tone and the covenantal holiness language without adding interpretive detail.
