id: LEV.25.12
reference: Leviticus 25:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: te
  text: ఎందుకంటే అది యోబేలు సంవత్సరం; అది మీకు పవిత్రమైనదై ఉండాలి. పొలం నుండి దాని పంటను[a] మీరు తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దిగుబడిని” లేదా “పొలం ఇచ్చే ఫలాన్ని.” హెబ్రీ పదం పొలం పండించే దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి ఆజ్ఞకు కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יוֹבֵל
  choice: సునాద సంవత్సరం
  rationale: లేవీయకాండము 25లో ఇది కొమ్ముబూర ధ్వనితో ప్రకటించే ప్రత్యేక యాభయ్యవ సంవత్సరాన్ని సూచిస్తుంది; కేవలం వాద్యాన్ని కాదు. ఆధునిక పాఠకునికి అర్థమయ్యేలా సంవత్సర భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: అది మీకు పవిత్రంగా ఉండాలి
  rationale: קֹדֶשׁ లోని దేవునికి ప్రత్యేకపరచబడిన పవిత్రత భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన ఆజ్ఞాత్మక రూపాన్ని ఇస్తుంది.
- source_word: מִן הַשָּׂדֶה
  choice: పొలం నుంచే
  rationale: పంటను సాధారణంగా కోసి నిల్వ చేయడం కాకుండా, పొలంలో సహజంగా లభించేదాన్ని అక్కడి నుంచే తినాలనే సందర్భోచిత ఉద్ఘాటనను ‘నుంచే’ తెలియజేస్తుంది.
- source_word: תֹּאכְלוּ
  choice: మీరు తినాలి
  rationale: న్యాయసంబంధ సందర్భంలోని ఆదేశాత్మక అపూర్ణ క్రియను ఆధునిక తెలుగు నియమ భాషలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּבוּאָתָהּ
  choice: దాని దిగుబడిని
  rationale: పొలం లేదా భూమి పండించేదాన్ని సూచించే విస్తృత వ్యవసాయ పదం; ఈ సందర్భంలో స్వయంగా మొలిచిన ఫలసాయాన్ని కూడా కలుపుకోగలదు.
theological_decisions:
- issue: సునాద సంవత్సరానికి వర్తించే పవిత్రత భాష
  choice: అది మీకు పవిత్రంగా ఉండాలి
  alternative: అది మీ కోసం ప్రత్యేకపరచబడాలి
  rationale: ఈ సంవత్సరం కేవలం సామాజికంగా ప్రత్యేకమైనదని కాక, నిబంధన సంబంధంగా పవిత్రమైనదని קֹדֶשׁ చెబుతుంది. ‘పవిత్రంగా’ అనే పదం ఆ ధార్మిక బరువును తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయశైలిని ఉపయోగించాం. ‘సునాద సంవత్సరం’ అనే పదబంధం יוֹבֵל యొక్క సందర్భార్థాన్ని పాఠకునికి స్పష్టంగా చేస్తుంది. మూలంలో లేని పాదసూచికను చేర్చలేదు; ఇచ్చిన ఆంగ్ల పాదసూచిక గుర్తు వాక్యంలో ‘holy to you’ తరువాత ఉన్నప్పటికీ, దాని విషయం ‘produce’ గురించినది కావడం వల్ల అది స్థానభ్రంశమైన సంపాదకీయ అసంగతిగా పరిగణించబడింది.
