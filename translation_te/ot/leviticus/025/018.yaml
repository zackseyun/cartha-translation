id: LEV.25.18
reference: Leviticus 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: te
  text: కాబట్టి మీరు నా కట్టడలను ఆచరించాలి; నా న్యాయవిధులను[a] పాటించి, వాటిని ఆచరించాలి[b]. అప్పుడు మీరు ఆ దేశంలో సురక్షితంగా నివసిస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా కట్టడలు’ను ‘నా శాసనాలు’ అని, ‘నా న్యాయవిధులు’ను ‘నా న్యాయనిర్ణయాలు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో חֻקִּים, מִשְׁפָּטִים అనే రెండు భిన్నమైన న్యాయపదాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో ‘చేయుట’ అనే క్రియ రెండుసార్లు వస్తుంది: అక్షరార్థంగా, ‘మీరు నా కట్టడలను చేయాలి ... నా న్యాయవిధులను కాపాడి, వాటిని చేయాలి.’'
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఇశ్రాయేలుకు వాగ్దానం చేయబడిన దేశంలో సురక్షితంగా నివసిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: నా కట్టడలు
  rationale: חֻקִּים దేవుడు నిర్దేశించిన స్థిరమైన శాసనాలను సూచిస్తుంది. ఆధునిక గౌరవప్రదమైన తెలుగులో ‘కట్టడలు’ నిబంధనాత్మక భావాన్ని నిలుపుతూ מִשְׁפָּטִיםతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: מִשְׁפָּטַי
  choice: నా న్యాయవిధులు
  rationale: מִשְׁפָּטִים న్యాయనిర్ణయాలు, చట్టపరమైన విధులు లేదా శాసనాలను సూచిస్తుంది. ‘న్యాయవిధులు’ దాని న్యాయసంబంధమైన బరువును తెలియజేస్తూ ‘కట్టడలు’తో పూర్తిగా కలిసిపోకుండా ఉంచుతుంది.
- source_word: תִּשְׁמְרוּ
  choice: జాగ్రత్తగా అనుసరించాలి
  rationale: నిబంధనాత్మక సందర్భంలో שׁמר కేవలం గుర్తుంచుకోవడం కాక, శ్రద్ధగా కాపాడి పాటించడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ఆ కార్యబద్ధమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: పాటించాలి ... వాటిని ఆచరించాలి
  rationale: హీబ్రూలో עשה రెండుసార్లు వచ్చి విధేయత యొక్క ఆచరణాత్మక స్వభావాన్ని నొక్కిచెబుతుంది. తెలుగులో అసహజమైన ఒకే పద పునరుక్తిని నివారిస్తూ, రెండు క్రియల నిర్మాణాన్ని మరియు ఉద్ఘాటనను నిలిపేందుకు ‘పాటించాలి ... ఆచరించాలి’ అని ఇచ్చాం.
- source_word: וִישַׁבְתֶּם
  choice: నివసిస్తారు
  rationale: ישׁב ఇక్కడ దేశంలో స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ‘నివసిస్తారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הָאָרֶץ
  choice: ఆ దేశం
  rationale: ఈ సందర్భంలో הָאָרֶץ ఇశ్రాయేలుకు వాగ్దానం చేయబడిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆ దేశం’ ఆ నిర్దిష్టతను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: בֶּטַח భయం లేదా ముప్పు లేకుండా భద్రంగా నివసించే స్థితిని సూచిస్తుంది. ‘సురక్షితంగా’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: విధేయతకు, దేశంలో సురక్షిత నివాసానికి మధ్య సంబంధం
  choice: ఇశ్రాయేలు దేవుని కట్టడలను, న్యాయవిధులను ఆచరించడాన్ని ఆ దేశంలో సురక్షిత నివాసంతో వాక్యం నిబంధనాత్మకంగా అనుసంధానిస్తుంది.
  alternative: అన్ని కాలాల్లోని విశ్వాసులందరికీ వ్యక్తిగత భద్రత లేదా ఐశ్వర్యాన్ని హామీ ఇచ్చే సాధారణ వాగ్దానంగా చదవడం.
  rationale: హీబ్రూ పాఠ్యం విధేయతను నేరుగా ‘ఆ దేశంలో’ సురక్షిత నివాసంతో కలుపుతుంది. అందువల్ల అనువాదం ఇశ్రాయేలు దేశసంబంధ నిబంధన సందర్భాన్ని నిలుపుతుంది; పాఠ్య పరిధిని దాటి వాగ్దానాన్ని సార్వత్రికం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే నిబంధనాత్మక-న్యాయపరమైన గౌరవభావం నిలుపబడింది. ఫలిత సంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు చివరి వాక్యంలో ‘అప్పుడు’ వాడబడింది; ఇది మూలంలోని అనుసరణను వ్యక్తపరుస్తుంది, దానిని విస్తరించదు.
