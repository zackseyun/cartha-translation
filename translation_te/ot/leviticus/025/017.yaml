  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: te
  text: మీరు ఒకరినొకరు అన్యాయంగా దోపిడీ చేయవద్దు[a]. మీ దేవునికి భయపడాలి, ఎందుకంటే నేను మీ దేవుడనైన యెహోవాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరికి ఒకరు అన్యాయం చేయవద్దు” లేదా “ఒకరినొకరు మోసగించవద్దు.” హీబ్రూ క్రియ సామాజిక లేదా ఆర్థిక వ్యవహారాల్లో ఎదుటివారి పరిస్థితిని అన్యాయంగా ఉపయోగించుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: అన్యాయంగా దోచుకోకూడదు
  rationale: యנה హిఫీల్ రూపం ఈ న్యాయ–ఆర్థిక సందర్భంలో ఎదుటివారి పరిస్థితిని అన్యాయంగా ఉపయోగించుకొని నష్టం కలిగించడాన్ని సూచిస్తుంది. తెలుగు పదబంధం ఆర్థిక దోపిడీ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తూనే, విస్తృతమైన అన్యాయ ప్రవర్తనకు కూడా చోటిస్తుంది.
- source_word: אִישׁ אֶת־עֲמִיתוֹ
  choice: మీరు ఒకరినొకరు
  rationale: అక్షరార్థంగా ‘ఒక పురుషుడు తన సహచరుణ్ణి’ అయినా, ఇక్కడ אִישׁ పంపిణీయ ప్రయోగంలో సమాజంలోని ప్రతి వ్యక్తిని ఉద్దేశిస్తుంది. ఆధునిక తెలుగులో ‘ఒకరినొకరు’ సహజంగా ఉండి పరస్పర సామాజిక బాధ్యతను కాపాడుతుంది.
- source_word: וְיָרֵאתָ
  choice: బదులుగా ... భయపడాలి
  rationale: וְ అక్షరార్థంగా ‘మరియు’; అయితే ఇక్కడ నిషేధానికి విరుద్ధంగా ఉండవలసిన వైఖరిని పరిచయం చేస్తుంది. ‘బదులుగా’ ఆ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מֵאֱלֹהֶיךָ
  choice: మీ దేవునికి
  rationale: ירא తరువాత מן భయానికి లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘దేవునికి భయపడాలి’ సహజమైన నుడికారం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: ఎందుకంటే మీ దేవుడైన యెహోవాను నేనే
  rationale: כִּי యొక్క కారణార్థక బలాన్ని ‘ఎందుకంటే’ నిలుపుతుంది; ఒడంబడిక సూత్రవాక్యం ఆజ్ఞకు దేవుని స్వరూపం, అధికారమే ఆధారమని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: אִישׁ లోని ప్రతినిధి పుంలింగం
  choice: మీరు ఒకరినొకరు
  alternative: ఏ పురుషుడూ తన సహచరుణ్ణి
  rationale: ఈ న్యాయ ఆజ్ఞలో పుంలింగ ఏకవచనం పంపిణీయంగా సమాజ సభ్యులందరికీ వర్తిస్తుంది. తెలుగులో అక్షర నిర్మాణాన్ని బలవంతంగా నిలిపితే అర్థం అనవసరంగా పురుషులకు మాత్రమే పరిమితమయ్యే అవకాశం ఉంది; పరస్పర రూపం ప్రయోగబలాన్ని కాపాడుతుంది.
- issue: ירא యొక్క భావం
  choice: దేవునికి భయపడాలి
  alternative: దేవుణ్ణి గౌరవించాలి
  rationale: ‘గౌరవించాలి’ మాత్రమే అనడం మూలంలోని భయం/భక్తిభయం ఉద్వేగాన్ని తగ్గిస్తుంది. అందువల్ల నైతిక బాధ్యతకు ఆధారమైన దేవభయాన్ని ప్రత్యక్షంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయాజ్ఞ శైలిని ఉపయోగించాం. ఏకవచన హీబ్రూ సంబోధనను తెలుగు సామూహిక సంబోధనకు అనుగుణంగా ‘మీరు/మీ’గా ఇచ్చాం; చివరి ‘మీ’ బహువచన సమాజాన్ని ఉద్దేశిస్తుంది.
