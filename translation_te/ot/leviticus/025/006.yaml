source:
  edition: WLC
  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: te
  text: భూమి విశ్రాంతి సంవత్సరంలో వచ్చే పంట మీకు ఆహారంగా ఉంటుంది—నీకు, నీ దాసునికి, నీ దాసికి, నీ కూలివానికి, నీతో నివసించే పరదేశికీ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భూమి విశ్రాంతి సంవత్సరంలో వచ్చే పంట” అనే అనువాదానికి హెబ్రీలో అక్షరార్థం “భూమి విశ్రాంతి.” సందర్భంలో ఇది భూమి విశ్రాంతి పొందే సంవత్సరంలో లభించే పంటను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת הָאָרֶץ
  choice: దేశానికి కలిగే విశ్రాంతి సంవత్సరపు పంట
  rationale: అక్షరార్థంగా ‘దేశపు విశ్రాంతి’ అయినా, לְאָכְלָה మరియు సందర్భం దృష్ట్యా విశ్రాంతి సంవత్సరంలో భూమి సహజంగా ఇచ్చే పంటను సూచిస్తుంది. తెలుగు పాఠకునికి భావం స్పష్టంగా ఉండేలా సంస్థాపిత ‘విశ్రాంతి’ భావాన్నీ పంట సూచననూ నిలిపాం.
- source_word: לָכֶם לְאָכְלָה
  choice: మీకు ఆహారంగా
  rationale: బహువచన సంబోధనతో కూడిన ప్రయోజనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: ముందున్న బహువచన ‘మీకు’ తరువాత వ్యక్తుల జాబితా ఏకవచన సంబోధనలో మొదలవుతుందనే హెబ్రీ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: నీ దాసునికి / నీ దాసికి
  rationale: బంధిత గృహసేవ స్థితినీ, మూలంలోని పురుష–స్త్రీ భేదాన్నీ తెలిపే సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదాలు.
- source_word: שְׂכִירְךָ
  choice: నీ కూలివానికి
  rationale: జీతం లేదా కూలికి పనిచేసే వ్యక్తిని బంధిత దాసుని నుండి స్పష్టంగా వేరుచేస్తుంది.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: నీతో నివసించే పరదేశికి
  rationale: స్థానికేతరుడైనా సమాజంలో నివసిస్తున్న వ్యక్తి అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘తాత్కాలికుడు’ అనే అవసరం లేని పరిమితిని చేర్చదు.
theological_decisions:
- issue: ఇశ్రాయేలు సామాజిక-న్యాయ సందర్భంలోని సేవకత్వ పదాలు
  choice: עבד/אמהలను ‘దాసుడు/దాసి’గా, שׂכירను ‘కూలివాడు’గా వేరు చేయడం
  alternative: అన్నిటినీ ‘సేవకులు’గా అనువదించడం
  rationale: మూలపాఠం బంధిత గృహసేవకులకూ కూలికి పనిచేసేవారికీ మధ్య భేదం చూపుతుంది; ఒకే సాధారణ పదంతో ఆ సామాజిక-న్యాయ భేదాన్ని చెరపకూడదు.
- issue: ‘దేశపు విశ్రాంతి’ అనే రూపకానికి సూచ్యార్థం
  choice: ‘విశ్రాంతి సంవత్సరపు పంట’ అని ప్రధాన పాఠంలో స్పష్టం చేయడం
  alternative: ‘దేశపు విశ్రాంతి’ అని అక్షరార్థంగా మాత్రమే ఉంచడం
  rationale: తరువాతి ‘ఆహారంగా’ అనే మాటతో కలిసి ఈ పదబంధం విశ్రాంతి సంవత్సరంలో లభించే పంటను సూచిస్తుంది. అయితే మూలంలోని ‘విశ్రాంతి’ అనుబంధాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిర్మాణం. హెబ్రీలోని బహువచన ‘మీకు’ నుండి ఏకవచన ‘నీకు’కు వచ్చే మార్పును ఉద్దేశపూర్వకంగా నిలిపాం.
