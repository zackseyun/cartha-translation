  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: te
  text: మీ స్వాస్థ్య భూభాగమంతటిలో, భూమిని విమోచించుకునే అవకాశం మీరు కల్పించాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమి విమోచనాన్ని మీరు అనుమతించాలి.”
    reason: lexical_alternative
  - marker: b
    text: “స్వాస్థ్యం” అంటే ఇశ్రాయేలీయులకు వారసత్వంగా కేటాయించబడిన భూభాగంలోని స్థిరాస్తి లేదా భూకమతం.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְכֹל
  choice: దేశమంతటా
  rationale: సంధానార్థక וּ మరియు ‘అంతట/అంతటిలో’ అనే భావమిచ్చే בְכֹל ను సహజమైన ఆధునిక తెలుగులో సందర్భానుగుణంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: మీ స్వాస్థ్యమైన దేశం
  rationale: ఇక్కడ אֶרֶץ మొత్తం భూమండలాన్ని కాక ఇశ్రాయేలీయుల స్వాధీన భూభాగాన్ని సూచిస్తుంది; אֲחֻזָּה లోని వారసత్వ భూస్వామ్య భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: גְּאֻלָּה
  choice: తిరిగి విడిపించుకునే హక్కు
  rationale: ఈ న్యాయసందర్భంలో పదం అమ్మబడిన భూమిని మూల కుటుంబం చెల్లించి తిరిగి పొందే విమోచనను లేదా దానికి గల హక్కును సూచిస్తుంది; తెలుగు పాఠకునికి ‘విమోచనం’ కంటే ఈ రూపం స్పష్టంగా ఉంటుంది.
- source_word: תִּתְּנוּ
  choice: మీరు కల్పించాలి
  rationale: అక్షరార్థంగా ‘ఇవ్వాలి’; చట్టపరమైన అవకాశం లేదా హక్కును అందుబాటులో ఉంచాలనే భావాన్ని ‘కల్పించాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: לָאָרֶץ
  choice: భూమిని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘భూమికి/భూమి కోసం’; తెలుగులో ‘భూమిని తిరిగి విడిపించుకోవడం’ అని కర్మసంబంధంగా మార్చడం అదే న్యాయార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: అమ్మబడిన స్వాస్థ్య భూమికి సంబంధించిన ఆజ్ఞ స్వరూపం
  choice: భూమిని తిరిగి పొందేందుకు హక్కు లేదా చట్టబద్ధమైన అవకాశం కల్పించాలనే ఆజ్ఞ
  alternative: ‘భూమికి విమోచనం ఇవ్వాలి’ అనే మరింత అక్షరానువాదం
  rationale: లేవీయకాండము 25లోని భూసంబంధ న్యాయసందర్భం గְּאֻלָּהను అమ్మబడిన వంశపారంపర్య భూమిని తిరిగి పొందే ఏర్పాటుగా సూచిస్తుంది. ‘హక్కు’ ఈ భావాన్ని స్పష్టం చేస్తుంది; అయితే పదం చర్యనూ సూచించగలదనే అర్థవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘విమోచనం’ అనే మతపరంగా వినిపించే పదాన్ని ప్రధాన పాఠ్యంలో ఒంటరిగా వాడకుండా, భూమిని చెల్లించి తిరిగి పొందే సందర్భార్థాన్ని స్పష్టంగా చెప్పాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
