source:
  edition: WLC
  text: וְ/אִם מְעַ֞ט נִשְׁאַ֧ר בַּ/שָּׁנִ֛ים עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל וְ/חִשַּׁב ל֑/וֹ כְּ/פִ֣י שָׁנָ֔י/ו יָשִׁ֖יב אֶת גְּאֻלָּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: te
  text: అయితే యోబేలు సంవత్సరానికి ఇంకా కొద్ది సంవత్సరాలే మిగిలి ఉంటే, అతడు అతనితో లెక్కించాలి; తన సంవత్సరాల నిష్పత్తి ప్రకారం తన విమోచన ధరను తిరిగి చెల్లించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన విమోచనకు కావలసిన మొత్తాన్ని తిరిగి చెల్లించాలి.” హీబ్రూ పదబంధం అమూర్తమైన విమోచనను కాక, అతని విమోచనకు చెల్లించవలసిన ధరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: ఇంకా కొద్ది సంవత్సరాలే మిగిలి ఉంటే
  rationale: నిఫాల్ రూపంలోని שׁאר మిగిలి ఉండడాన్ని, מְעַט సంవత్సరాల సంఖ్య తక్కువగా ఉండడాన్ని సూచిస్తాయి. తెలుగులో సహజమైన కాలవ్యవహారంగా అందించబడింది.
- source_word: שְׁנַת הַיֹּבֵל
  choice: విడుదల సంవత్సరం
  rationale: లేవీయకాండము 25లోని יוֹבֵל సంస్థ బానిసలు, ఆస్తుల విడుదలతో సంబంధించింది. ‘విడుదల సంవత్సరం’ ఆధునిక సాధారణ పాఠకునికి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְחִשַּׁב לוֹ
  choice: అతడు అతనితో లెక్క వేసుకోవాలి
  rationale: ఈ న్యాయ-ఆర్థిక సందర్భంలో חשב లెక్క కట్టడాన్ని సూచిస్తుంది; לוֹ ఇరుపక్షాల మధ్య జరిగే లెక్కింపును ఇక్కడ ‘అతనితో’గా ప్రతిబింబిస్తుంది.
- source_word: כְּפִי שָׁנָיו
  choice: మిగిలిన సంవత్సరాల నిష్పత్తి ప్రకారం
  rationale: כְּפִי అనుపాతం లేదా తగిన ప్రమాణాన్ని సూచిస్తుంది. సందర్భం యోబేలు వరకు మిగిలిన సంవత్సరాల ఆధారంగా విమోచన మొత్తాన్ని నిర్ణయించడం కనుక ‘మిగిలిన’ అనే సందర్భస్పష్టీకరణ చేర్చబడింది.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: తన విమోచన వెలను తిరిగి చెల్లించాలి
  rationale: హిఫిల్ שוב ఇక్కడ తిరిగి చెల్లించడాన్ని, גְּאֻלָּה విడుదల పొందేందుకు చెల్లించవలసిన విమోచన మొత్తాన్ని సూచిస్తాయి. అమూర్తమైన ‘విమోచనం’గా కాక ఆర్థిక అర్థం స్పష్టంగా ఉండేలా ‘వెల’ వాడబడింది.
