- from: అయితే విడుదల సంవత్సరానికి ఇంకా కొద్ది సంవత్సరాలే మిగిలి ఉంటే, అతడు అతనితో లెక్క వేసుకోవాలి; మిగిలిన సంవత్సరాల నిష్పత్తి ప్రకారం తన విమోచన వెలను తిరిగి చెల్లించాలి.[a]
  to: అయితే యోబేలు సంవత్సరానికి ఇంకా కొద్ది సంవత్సరాలే మిగిలి ఉంటే, అతడు అతనితో లెక్కించాలి; తన సంవత్సరాల నిష్పత్తి ప్రకారం తన విమోచన ధరను తిరిగి చెల్లించాలి.[a]
