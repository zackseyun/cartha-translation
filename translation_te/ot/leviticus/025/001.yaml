lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר అంటే ‘మాట్లాడు’. అయితే తెలుగులో తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా అన్నాడు’ అనే ప్రయోగం స్పష్టంగా, సరళంగా ఉంటుంది; וַ narrative కొనసాగింపును సందర్భమే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో אֶל సంభాషణ ఉద్దేశిత వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మోషేతో అన్నాడు’ సహజమైన వ్యక్తీకరణ.
- source_word: בְּהַר סִינַי
  choice: సీనాయి కొండ మీద
  rationale: בְּ ఇక్కడ స్థానార్థకం. ‘సీనాయి కొండ మీద’ మూలంలోని స్థల సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ infinitive తరువాతి వచనంలో వచ్చే దైవ వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా అన్నాడు:’ అనే రూపం ఆ ముందుకు చూపే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవ నామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ ‘ప్రభువు’ అనే బిరుదు కాకుండా వ్యక్తిగత దైవ నామం ఉంది. కాబట్టి దానిని బిరుదుగా మార్చలేదు. ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదటిప్పణిలో తెలిపి, తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. తరువాతి వచనంలోని ప్రత్యక్ష దైవ వాక్యానికి సహజమైన ప్రవేశంగా కోలన్ వాడబడింది.
