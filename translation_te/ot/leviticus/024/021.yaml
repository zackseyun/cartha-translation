source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: te
  text: పశువును కొట్టి చంపినవాడు దానికి పరిహారం చెల్లించాలి; మనిషిని[a] కొట్టి చంపినవాడికి మరణశిక్ష అమలు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ వ్యక్తిని.” హెబ్రీలోని אָדָם అనే పదం ఇక్కడ ఒక మానవ ప్రాణిని విస్తృతంగా సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֵּה
  choice: కొట్టి చంపినవాడు
  rationale: נכה పదంలోని ‘కొట్టు’ అనే భావాన్ని నిలుపుతూ, ఈ వాక్యంలోని పరిహారం మరియు మరణశిక్ష ఫలితాలు సూచించే ప్రాణాంతక అర్థాన్ని ‘చంపినవాడు’తో స్పష్టం చేస్తుంది.
- source_word: בְהֵמָה
  choice: పశువు
  rationale: ఇక్కడ ఈ పదం సాధారణంగా పెంపుడు జంతువును సూచిస్తుంది; ఆధునిక తెలుగు న్యాయ సందర్భంలో ‘పశువు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְשַׁלְּמֶנָּה
  choice: దానికి పరిహారం చెల్లించాలి
  rationale: Piel రూపం నష్టాన్ని భర్తీ చేయడం లేదా పరిహారం ఇవ్వడం అనే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న పశువును సూచిస్తుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: పశువుతో చేసిన వ్యత్యాసంలో ఇది ఒక మానవ వ్యక్తిని సూచిస్తుంది. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని సాధారణ మానవ సూచనను నిలుపుతుంది.
- source_word: יוּמָת
  choice: మరణశిక్ష అమలు చేయాలి
  rationale: Hophal రూపం ఆ వ్యక్తిని ఇతరులచేత మరణింపజేయాలనే న్యాయపరమైన కర్మణి భావాన్ని సూచిస్తుంది; ఇది కేవలం సహజ మరణాన్ని కాక మరణదండన అమలును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: న్యాయ సందర్భంలో אָדָם పదానికి అనువాదం
  choice: మనిషి
  alternative: మానవ వ్యక్తి
  rationale: హెబ్రీ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచన రూపంలో ఉన్నా, ఈ సందర్భంలో లింగభేదం కంటే పశువుకు విరుద్ధంగా ఒక మానవ ప్రాణిని సూచిస్తుంది. ‘మనిషి’ రూపాన్నీ సాధారణ మానవ అర్థాన్నీ సహజంగా మోస్తుంది; విస్తృత భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. రెండు సమాంతర విధులను స్పష్టంగా చూపేందుకు ‘కొట్టి చంపినవాడు’ అనే ఒకే నిర్మాణాన్ని నిలిపాం.
