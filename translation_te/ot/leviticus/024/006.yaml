source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: te
  text: వాటిని రెండు వరుసలుగా[a], ప్రతి వరుసలో ఆరు చొప్పున, యాహ్వే సన్నిధిలో శుద్ధమైన బల్లమీద అమర్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెండు అమరికలుగా’ లేదా ‘రెండు దొంతరలుగా.’ హీబ్రూ పదం రొట్టెలను క్రమంగా అమర్చిన సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: అమర్చాలి
  rationale: שׂוּם అంటే ‘పెట్టు, ఉంచు, అమర్చు.’ రొట్టెలను క్రమపద్ధతిలో ఉంచే సందర్భంలో ‘అమర్చాలి’ సహజంగా ఉండి, హీబ్రూ ఆదేశార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: אוֹתָם
  choice: వాటిని
  rationale: మునుపటి వచనంలోని పన్నెండు రొట్టెలను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: రెండు వరుసలుగా
  rationale: מַעֲרָכָה క్రమంగా అమర్చిన సమూహాన్ని సూచిస్తుంది. బల్లపై రొట్టెలను ఉంచే ఈ సందర్భంలో ‘వరుసలు’ సహజమైన అర్థం; అయితే ‘అమరికలు’ లేదా ‘దొంతరలు’ అనే అర్థసాధ్యతను పాదసూచికలో నిలుపుతున్నాం.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: ఒక్కో వరుసలో ఆరు చొప్పున
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆరు, ఆ వరుస’ అని ఉన్నా, ఇది విభజనాత్మక భావం కలిగి ప్రతి వరుసలో ఆరు రొట్టెలు ఉండాలని సూచిస్తుంది.
- source_word: עַל הַשֻּׁלְחָן הַטָּהֹר
  choice: పవిత్రమైన బల్ల మీద
  rationale: עַל అంటే ‘మీద.’ טָהוֹר ఆలయారాధన సందర్భంలో కేవలం భౌతిక శుభ్రతకన్నా ఆచారపరమైన శుద్ధతను సూచిస్తుంది; తెలుగులో ‘పవిత్రమైన’ ఈ ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట, సన్నిధిలో.’ ‘సన్నిధిలో’ ఆలయారాధనా సందర్భంలో సహజంగా ఉంది; יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచడం వ్యక్తిగత నామ స్వభావాన్ని కాపాడుతుంది.
- issue: הַטָּהֹר అనే ఆరాధనా విశేషణం
  choice: పవిత్రమైన బల్ల
  alternative: శుద్ధమైన బల్ల; శుభ్రమైన బల్ల
  rationale: ఇది పరిశుద్ధస్థల సామగ్రికి సంబంధించిన సందర్భం. ‘పవిత్రమైన’ అనే పదం ఆచారపరమైన శుద్ధతను సూచిస్తుంది; కేవలం భౌతికంగా శుభ్రంగా ఉందనే భావానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. ‘అమర్చాలి,’ ‘ఒక్కో వరుసలో ఆరు చొప్పున’ అనే రూపాలు మూలంలోని క్రమబద్ధమైన ఏర్పాటును సహజంగా వ్యక్తపరుస్తాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
