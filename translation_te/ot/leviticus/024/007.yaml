id: LEV.24.7
reference: Leviticus 24:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: te
  text: ప్రతి వరుసపై స్వచ్ఛమైన సాంబ్రాణి ధూపాన్ని ఉంచాలి[a]. అది రొట్టెల కొరకు జ్ఞాపకార్థ భాగంగా[b], యాహ్వేకు అగ్న్యర్పణగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమరికపై’; సందర్భంలో ఇది రొట్టెలను క్రమంగా ఉంచిన వరుసలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అగ్నిచేత అర్పణ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ఉంచాలి
  rationale: ఆచార విధులను నిర్దేశించే సందర్భంలో ఈ క్రియ ఆజ్ఞార్థాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘ఉంచాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל הַמַּעֲרֶכֶת
  choice: ప్రతి వరుసమీద
  rationale: ముందటి వచనంలో రొట్టెలను రెండు వరుసలుగా అమర్చాలని ఉంది. ఏకవచన రూపం ఇక్కడ పంపిణీ భావంతో ప్రతి అమరికను, అంటే ప్రతి వరుసను సూచిస్తుంది; ‘అమరికమీద’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְבֹנָה זַכָּה
  choice: స్వచ్ఛమైన సాంబ్రాణి
  rationale: לְבֹנָה ధూపానికి ఉపయోగించే సుగంధ జిగురైన frankincense; ‘సాంబ్రాణి’ సాధారణ తెలుగు పాఠకులకు తెలిసిన పదం. זַכָּה దాని నిర్మలత లేదా శుద్ధతను సూచిస్తుంది.
- source_word: לַלֶּחֶם
  choice: రొట్టెలకు
  rationale: హీబ్రూలో ఏకవచన సమూహార్థక పదం ఉన్నప్పటికీ, సందర్భంలో అనేక రొట్టెలు ఉద్దేశించబడ్డాయి; తెలుగులో బహువచనం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְאַזְכָּרָה
  choice: జ్ఞాపకార్థ భాగంగా
  rationale: ఇది బలిలో మొత్తం అర్పణకు ప్రాతినిధ్యం వహిస్తూ దేవుని సమక్షంలో జ్ఞాపకార్థంగా అర్పించబడే భాగాన్ని సూచించే యాజక సంబంధ పదం.
- source_word: אִשֶּׁה
  choice: అగ్న్యర్పణగా
  rationale: యాజక గ్రంథంలోని బలి పరిభాషలో ఇది అగ్నితో అర్పించబడే అర్పణను సూచిస్తుంది. ‘అగ్న్యర్పణ’ సంక్షిప్తంగా ఉండి మూలంలోని అగ్ని భావాన్ని కాపాడుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలో ఉన్న దేవుని నిబంధన నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: לְאַזְכָּרָה అనే బలి సంబంధ పదం యొక్క భావం
  choice: జ్ఞాపకార్థ భాగంగా
  alternative: జ్ఞాపకార్థంగా
  rationale: సాంబ్రాణి రొట్టెల స్థానంలో అగ్నిపై అర్పించబడే ప్రాతినిధ్య భాగంగా పనిచేస్తుంది. అయినా మూలపదం ఎవరు ఎవరిని జ్ఞాపకం చేసుకుంటారో స్పష్టంగా చెప్పదు; అనువాదం కూడా దాన్ని నిర్ణయించదు.
- issue: אִשֶּׁה పదంలోని అగ్ని భావం
  choice: అగ్న్యర్పణగా
  alternative: ఆహార అర్పణగా
  rationale: ఈ పదం అగ్నితో అర్పించే బలిని సూచిస్తుంది. ‘ఆహార అర్పణ’ దేవుని ఆహారం అనే బలి రూపకాన్ని ముందుకు తెస్తుంది గాని, ఈ పదానికి ప్రత్యక్షంగా సంబంధించిన అగ్ని భావాన్ని తెలుగులో అస్పష్టపరచవచ్చు.
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో నిబంధన నామం ప్రత్యక్షంగా ఉంది; దాన్ని ‘యాహ్వే’గా ఉంచడం పేరు మరియు బిరుదు మధ్య తేడాను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల ఆచార-నిర్దేశ శైలిని వాడాం. ‘సాంబ్రాణి’, ‘అగ్న్యర్పణ’ వంటి పదాలు సాధారణ అవగాహనను మరియు యాజక పరిభాష ఖచ్చితత్వాన్ని సమతుల్యం చేస్తాయి.
