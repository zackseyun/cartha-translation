  to: ప్రతి వరుసపై స్వచ్ఛమైన సాంబ్రాణి ధూపాన్ని ఉంచాలి[a]. అది రొట్టెల కొరకు జ్ఞాపకార్థ భాగంగా[b], యాహ్వేకు అగ్న్యర్పణగా ఉంటుంది.
  rationale: The revision keeps the distributive contextual rendering of the singular ‘arrangement’ as ‘each row,’ preserves the ambiguity of ‘memorial portion,’ and retains Yahweh. It clarifies that the aromatic substance is incense/frankincense and aligns footnote b with the lexical alternative documented in the English audit trail.
