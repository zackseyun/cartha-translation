review_pass:
  verdict: revise
  source_fidelity: 'The verse’s syntax and ritual sense are substantially retained: pure frankincense is placed on the bread arrangement(s), and it serves for the bread as a memorial portion, a fire offering to Yahweh. The rendering should explicitly identify సాంబ్రాణి as incense/frankincense, since the Telugu word can also denote other aromatic resins in current usage. The footnote for אִשֶּׁה should provide the documented lexical alternative rather than an expanded ritual explanation.'
  naturalness: ప్రతి వరుసపై, రొట్టెల కొరకు, and జ్ఞాపకార్థ భాగంగా are natural modern standard Telugu in a formal ritual-instruction register. అగ్న్యర్పణ is concise and understandable in this context.
  terminology: యాహ్వే correctly preserves יהוה. స్వచ్ఛమైన సాంబ్రాణి ధూపం more securely conveys לְבֹנָה זַכָּה as frankincense/incense. జ్ఞాపకార్థ భాగం adequately represents אַזְכָּרָה without specifying who remembers whom. అగ్న్యర్పణ preserves the fire-offering sense of אִשֶּׁה.
  issues:
  - severity: medium
    issue: ‘సాంబ్రాణి’ alone can be understood as a locally familiar but different aromatic resin rather than frankincense.
    rationale: לְבֹנָה specifically denotes frankincense. Adding ‘ధూపం’ identifies its cultic incense function while retaining the familiar Telugu term.
  - severity: low
    issue: Footnote b is a doctrinal/ritual expansion rather than the supplied lexical alternative for אִשֶּׁה.
    rationale: The audit trail preserves ‘offering by fire’ as the significant alternative. A concise alternative maintains lexical transparency and avoids adding explanatory detail not explicit in this verse.
  revised_text: ప్రతి వరుసపై స్వచ్ఛమైన సాంబ్రాణి ధూపాన్ని ఉంచాలి[a]. అది రొట్టెల కొరకు జ్ఞాపకార్థ భాగంగా[b], యాహ్వేకు అగ్న్యర్పణగా ఉంటుంది.
  revised_footnotes:
