source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: te
  text: అప్పుడు మోషే ఇశ్రాయేలీయులతో మాట్లాడాడు. వారు శపించిన వ్యక్తిని[a] శిబిరం వెలుపలికి తీసుకువెళ్లి, రాళ్లతో కొట్టి చంపారు. యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే ఇశ్రాయేలీయులు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవదూషణ చేసిన వ్యక్తిని.” ఇక్కడి హీబ్రూ పదానికి అక్షరార్థం “శపించిన వ్యక్తి”; ముందరి సందర్భంలో అతడు దేవుని నామాన్ని శపించిన విషయాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: పియేల్ రూపంలోని דבר ఇక్కడ ప్రజలను ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మాట్లాడాడు’ సహజంగా ఉంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ జాతీయ సమూహసూచక నుడికారాన్ని తెలుగులో సహజంగా, అందరినీ సూచించే రూపంలో అందిస్తుంది.
- source_word: וַיּוֹצִיאוּ ... אֶל מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి తీసుకువెళ్లి
  rationale: హిఫీల్ రూపం ‘బయటికి తీసుకువెళ్లడం’ అనే చలనాన్ని సూచిస్తుంది; אֶל మִחוּץ గమ్యాన్ని, అంటే శిబిరం వెలుపలిని, స్పష్టపరుస్తుంది.
- source_word: הַמְקַלֵּל
  choice: శపించిన వ్యక్తిని
  rationale: קלל క్రియ యొక్క కర్తృవాచక రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, ముందరి సందర్భంలో దేవుని నామాన్ని శపించిన వ్యక్తిని సూచిస్తుంది; ప్రధాన పాఠంలో మరింత వ్యాఖ్యాత్మకమైన ‘దైవదూషకుడు’ అనే పదాన్ని చేర్చలేదు.
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: రాళ్లతో కొట్టారు
  rationale: రాళ్లు విసిరి కొట్టే శిక్షను సూచించే רגמ క్రియతో పాటు ఉన్న אֶבֶן భావాన్ని నిలుపుతుంది. మూలంలో విడిగా లేని ‘చంపారు’ అనే పదాన్ని చేర్చకుండా చర్యను యథాతథంగా ఉంచుతుంది.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే ... చేశారు
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు ఇశ్రాయేలీయులు విధేయత చూపారని తెలిపే హీబ్రూ సారాంశ సూత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచుతుంది.
theological_decisions:
- issue: הַמְקַלֵּל ను ‘దైవదూషకుడు’గా వ్యాఖ్యానించాలా, లేక దాని ప్రత్యక్ష క్రియార్థాన్ని నిలుపాలా
  choice: శపించిన వ్యక్తి
  alternative: దైవదూషకుడు
  rationale: ముందరి సందర్భం దేవుని నామాన్ని దూషించడాన్ని స్పష్టం చేసినప్పటికీ, ఈ వచనంలోని పదం קלל (‘శపించు’) క్రియ యొక్క కర్తృవాచక రూపం. అందువల్ల ప్రధాన పాఠం ప్రత్యక్ష పదార్థాన్ని నిలుపుతుంది; సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: రాళ్లతో కొట్టడం వల్ల మరణించాడని ప్రధాన పాఠంలో స్పష్టంగా చేర్చాలా
  choice: రాళ్లతో కొట్టారు
  alternative: రాళ్లతో కొట్టి చంపారు
  rationale: ఇది మరణశిక్ష అమలు సందర్భమే అయినప్పటికీ, ఈ వాక్యఖండంలో ‘చంపారు’ అనే ప్రత్యేక క్రియ లేదు. కాబట్టి మూలంలోని చర్యను మాత్రమే అనువదించి, దాని ఫలితాన్ని వివరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం బదులు సాధారణ పాఠకులకు సహజమైన ‘ఇశ్రాయేలీయులు’ ఎంచుకోబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను స్పష్టమైన తెలుగు వాక్యాలుగా విభజించినా, భావక్రమం మరియు ముగింపు విధేయత సూత్రం నిలుపబడ్డాయి.
