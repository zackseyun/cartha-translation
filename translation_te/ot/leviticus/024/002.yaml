  variant: modern standard Telugu
source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులకు[a] ఇలా ఆజ్ఞాపించు: వెలుగు కొరకు స్వచ్ఛమైన, దంచి తీసిన ఒలీవ నూనెను[b] వారు నీ దగ్గరకు తీసుకురావాలి; దీపాన్ని నిరంతరం వెలిగించడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులకు,” “ఇశ్రాయేలు ప్రజలకు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది; ఇది ఇశ్రాయేలు నిబంధన ప్రజలకు వాడే సంప్రదాయపూర్వక పేరు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దంచిన ఒలీవ పండ్ల స్వచ్ఛమైన నూనెను.” హీబ్రూ నూనె ఒలీవ పండ్లనుంచి వచ్చిందనీ, వాటిని దంచడం ద్వారా అది తయారైందనీ పేర్కొంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: ఆజ్ఞాపించు
  rationale: ఇది צוה క్రియ యొక్క ఆజ్ఞార్థక రూపం. దేవుని అధికారపూర్వకమైన ప్రత్యక్ష ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ నిబంధన ప్రజలను సూచించే ఈ సంప్రదాయపూర్వక సంబోధనను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: వారు నీ దగ్గరకు తీసుకురావాలి
  rationale: לקח సాధారణంగా ‘తీసుకోవడం’ అయినా, ‘నీ దగ్గరకు’ అనే దిశాసూచక పదబంధంతో ఇక్కడ ఉద్దేశం ‘తీసుకురావడం.’ విధిగా చేయవలసిన పనిని ‘తీసుకురావాలి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: దంచిన ఒలీవ పండ్ల స్వచ్ఛమైన నూనె
  rationale: ఈ పదక్రమం నూనె ఒలీవ పండ్లనుంచి వచ్చిందనీ, అవి దంచబడ్డాయనీ, నూనె స్వచ్ఛమైనదనీ తెలియజేస్తుంది; ఉత్పత్తి పదార్థం మరియు తయారీ విధానం రెండింటినీ నిలుపుతుంది.
- source_word: לַמָּאוֹר
  choice: దీపం కోసం
  rationale: מָאוֹר వెలుగు లేదా వెలిగించే ఏర్పాటును సూచిస్తుంది. సందర్భంలో నూనె దీపం వెలిగించడానికే కాబట్టి ‘దీపం కోసం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לְהַעֲלֹת נֵר
  choice: దీపం వెలుగుతూ ఉండేలా చేయాలి
  rationale: ‘దీపాన్ని పైకి లేపడం’ అనే హీబ్రూ రూపం ఇక్కడ దీపాన్ని వెలిగించి వెలుగుతూ ఉంచే కార్యాన్ని సూచించే నుడికారం. తెలుగులో దాని ఉద్దేశాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: యాజక సంబంధ సందర్భంలో క్రమంగా కొనసాగించవలసిన కార్యాన్ని సూచిస్తుంది. ‘నిరంతరం’ మూలంలోని కొనసాగింపు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధనపరమైన పేరు
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూల హీబ్రూలో పురుష బహువచన రూపం అక్షరార్థంగా ఉంది; అదే సమయంలో అది ఇశ్రాయేలు నిబంధన సమాజానికి సంప్రదాయపూర్వకమైన సమష్టి పేరు. ప్రధాన పాఠ్యం రూపాన్ని నిలుపుతుంది; పాదటిప్పణి దాని సమగ్ర సామూహిక భావాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ప్రత్యక్ష ఆజ్ఞకు తగిన అధికార స్వరాన్ని నిలిపాం; ‘ఒలీవ’ అనే విస్తృతంగా గుర్తించగల రూపాన్ని ఉపయోగించాం. మూలంలోని ఒకే ‘దీపం’ అనే ఏకవచనాన్ని అలాగే ఉంచాం.
