  to: '“ఇశ్రాయేలు కుమారులకు[a] ఇలా ఆజ్ఞాపించు: వెలుగు కొరకు స్వచ్ఛమైన, దంచి తీసిన ఒలీవ నూనెను[b] వారు నీ దగ్గరకు తీసుకురావాలి; దీపాన్ని నిరంతరం వెలిగించడానికి.”'
