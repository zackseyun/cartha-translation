  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: te
  text: 'నీవు ఇశ్రాయేలు కుమారులకు[a] ఇలా చెప్పాలి: “ఏ పురుషుడైనా[b] తన దేవుణ్ణి శపిస్తే, అతడు తన పాపాన్ని భరించాలి.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఈ పదబంధం ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: '‘ఎవరైనా’ అని కూడా అనువదించవచ్చు. పంపిణీ భావాన్ని నొక్కిచెప్పడానికి హీబ్రూ ‘పురుషుడు’ అనే పదాన్ని రెండుసార్లు వాడుతుంది: ‘పురుషుడు, పురుషుడు.’'
    reason: lexical_alternative
  - marker: c
    text: ‘తన పాపాన్ని భరించాలి’ అనేది ఆ అపరాధానికి సంబంధించిన దోషభారాన్ని లేదా బాధ్యతను మోయాలి అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ కుటుంబపదబంధాన్ని నిలుపుతూ, సందర్భంలో అది ఇశ్రాయేలు ప్రజల సమూహాన్ని సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేయబడింది.
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: ఇలా చెప్పాలి
  rationale: న్యాయనిర్దేశంలోని ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; לֵאמֹר అనే ఉద్ధరణారంభాన్ని ‘ఇలా’ వ్యక్తం చేస్తుంది.
- source_word: אִישׁ אִישׁ
  choice: ఏ పురుషుడైనా
  rationale: ‘పురుషుడు, పురుషుడు’ అనే పునరుక్తి పంపిణీ భావంతో ‘ఎవరైనా ఒక పురుషుడు’ అని సూచిస్తుంది. తెలుగు న్యాయశైలిలో సహజంగా ఉండేలా, మూలంలోని పుంలింగ ఏకవచన రూపాన్ని కూడా నిలిపింది.
- source_word: כִּי יְקַלֵּל
  choice: శపిస్తే
  rationale: כִּי ఇక్కడ న్యాయపరమైన షరతును ప్రవేశపెడుతుంది; קלל పీయేల్ రూపానికి ‘శపించు’ అనే సూటి అర్థం సరిపోతుంది. తరువాతి వచనంలోని ప్రత్యేక దైవనామ అపరాధాన్ని ముందుగానే ‘దైవదూషణ’గా వ్యాఖ్యానించదు.
- source_word: אֱלֹהָיו
  choice: తన దేవుణ్ణి
  rationale: మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది. మూలంలో లేని ‘యెహోవా’ అనే నిర్దిష్టీకరణను చేర్చదు.
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: అతడు తన పాపాన్ని భరించాలి
  rationale: షరతు ఫలితాన్ని న్యాయనిర్దేశ శైలిలో తెలియజేస్తూ, ‘తన పాపాన్ని మోయడం’ అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; దాని బాధ్యత/దోషభార భావాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: אֱלֹהָיו అనే పదం ఇశ్రాయేలు దేవునితో కలిగిన సంబంధ పరిధి
  choice: తన దేవుణ్ణి
  alternative: దేవుణ్ణి; యెహోవాను
  rationale: ఈ వచనం ఉపయోగించిన స్వామ్యరూపాన్ని నిలుపుతుంది; తరువాతి వచనంలోని మరింత నిర్దిష్టమైన దైవనామ అపరాధంతో దీనికి ఉన్న ఉద్రిక్తతను తొలగించదు, అలాగే మూలం చెప్పనంతగా అర్థాన్ని సంకుచితం చేయదు.
- issue: న్యాయవాక్యంలోని పుంలింగ కర్త
  choice: ఏ పురుషుడైనా
  alternative: ఎవరైనా; ఏ వ్యక్తి అయినా
  rationale: אִישׁ אִישׁ పుంలింగ ఏకవచన రూపంలో పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది. ప్రధాన పాఠ్యం ఆ రూపాన్ని నిలుపగా, పాదటిప్పణి దాని నుడికార స్వభావాన్ని వివరిస్తుంది.
- issue: ‘తన పాపాన్ని భరించడం’ అనే నుడికారం
  choice: నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: తన అపరాధానికి బాధ్యత వహించాలి; తన పాపానికి శిక్ష అనుభవించాలి
  rationale: חֶטְאוֹ పదాన్ని నేరుగా ‘శిక్ష’గా మార్చడం మూలంలోని పాపం, దోషభారం, బాధ్యతల మధ్య ఉన్న భావవిస్తృతిని సంకుచితం చేస్తుంది. పాదటిప్పణి అవసరమైన వివరణను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయనిర్దేశ శైలి ఉపయోగించబడింది. ‘ఇశ్రాయేలు కుమారులు,’ ‘ఏ పురుషుడైనా,’ ‘తన పాపాన్ని భరించాలి’ వంటి మూలానికి దగ్గరైన రూపాలకు పాదటిప్పణులు జతచేసి సాధారణ పాఠకునికి భావం స్పష్టం చేయబడింది.
