source:
  edition: WLC
  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: te
  text: శుద్ధమైన దీపస్తంభం మీద దీపాలను యాహ్వే సన్నిధిలో ఎల్లప్పుడూ అమర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో యాహ్వే (YHWH) అనే దైవనామం ఉంది; “ఎల్లప్పుడూ” అనే పదానికి “క్రమం తప్పకుండా” అనే భావమూ ఉండవచ్చు.
    reason: దైవనామాన్ని స్పష్టం చేయడం మరియు תָּמִיד పదంలోని నిరంతరత/క్రమబద్ధ పునరావృతం అనే సందర్భానుగుణ విస్తృతిని సూచించడం.
lexical_decisions:
- source_word: עַל הַמְּנֹרָה
  choice: దీపస్తంభం మీద
  rationale: עַל ఇక్కడ దీపస్తంభానికి సంబంధించి దీపాల స్థానాన్ని సూచిస్తుంది; מְנוֹרָה ఆరాధనా గుడారంలోని ప్రత్యేక దీపస్తంభం.
- source_word: הַטְּהֹרָה
  choice: పవిత్రమైన
  rationale: యాజక సంబంధ సందర్భంలో טָהוֹר ఆచారపరంగా శుద్ధమైనదనే భావం ఇస్తుంది; తెలుగులో వస్తువుకు ‘పవిత్రమైన’ అనడం సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יַעֲרֹךְ
  choice: క్రమంగా అమర్చాలి
  rationale: ערך యొక్క భావం క్రమపద్ధతిలో అమర్చడం; హెబ్రీ క్రియలోని ఆజ్ఞాత్మక బాధ్యతను తెలుగులో ‘అమర్చాలి’ తెలియజేస్తుంది.
- source_word: אֶת הַנֵּרוֹת
  choice: దీపాలను
  rationale: נֵרוֹת దీపస్తంభంపై ఉండే విడివిడి దీపాలను సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో’; ఆధునిక తెలుగు ఆరాధనా సందర్భంలో ‘సన్నిధిలో’ సహజమైనది. יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: ఈ యాజక సందర్భంలో క్రమంగా కొనసాగించవలసిన నిరంతర ఆచరణను సూచిస్తుంది; ‘ఎల్లప్పుడూ’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపం వ్యక్తిగత నామాన్ని నిలుపుతుంది; పాదటిప్పణి మూలరూపాన్ని స్పష్టం చేస్తుంది.
- issue: תמיד యొక్క కాలవ్యాప్తి
  choice: ఎల్లప్పుడూ
  alternative: క్రమం తప్పకుండా
  rationale: పదం నిరంతరతను లేదా నిర్దిష్ట క్రమంలో పునరావృతమయ్యే ఆచరణను సూచించగలదు. ప్రధాన పాఠం నిరంతరతను నిలుపుతూ, పాదటిప్పణి ఆచార సంబంధ ప్రత్యామ్నాయ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. హెబ్రీ వాక్యంలోని కర్త సందర్భానుసారంగా అహరోను అయినప్పటికీ, ఈ ఒక్క వచనంలో పేరును చేర్చి స్పష్టీకరించకుండా మూలంలోని అంతర్నిహిత కర్తను తెలుగు విధ్యర్థక రూపంతో ఉంచాం.
