  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది. דבר ఇక్కడ మాటలాడడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: హీబ్రూ ‘మోషేకు/మోషే వైపు’ అనే నిర్మాణం మాటలాడే క్రియతో కలిసి తెలుగులో సహజంగా ‘మోషేతో’ అవుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఇలా అన్నాడు:’గా వ్యక్తపరచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: సరళమైన, ఆధునిక, గౌరవప్రదమైన తెలుగు. తదుపరి వచనంలో వచ్చే దేవుని మాటలకు సంకేతంగా చివర ద్విబిందువు వాడబడింది.
