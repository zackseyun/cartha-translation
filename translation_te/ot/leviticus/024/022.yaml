  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: te
  text: మీకు ఒకే న్యాయ ప్రమాణం ఉండాలి; పరదేశికైనా స్వదేశికైనా అదే ఉండాలి. ఎందుకంటే నేను మీ దేవుడైన యెహోవాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: ఒకే న్యాయ ప్రమాణం
  rationale: ఇక్కడ מִשְׁפָּט అనేది ఒక ప్రత్యేక తీర్పుకన్నా అందరికీ సమానంగా వర్తించే న్యాయ ప్రమాణాన్ని సూచిస్తుంది; אֶחָד సమానమైన ఒకే ప్రమాణాన్ని నొక్కిచెబుతుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసిస్తున్న, స్వదేశీయుడు కాని వ్యక్తిని సూచించే గֵּר భావాన్ని సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֶזְרָח
  choice: స్వదేశి
  rationale: దేశంలో పుట్టి సమాజానికి సహజ సభ్యుడైన వ్యక్తి అనే భావాన్ని పరదేశికి సమాంతరంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: పరదేశి మరియు స్వదేశికి సమాన న్యాయం
  choice: పరదేశికి ఎలాగో స్వదేశికి అలాగే
  alternative: పరదేశికీ స్వదేశికీ ఒకే విధంగా
  rationale: כַּגֵּר כָּאֶזְרָח అనే సమాంతర నిర్మాణాన్ని నిలుపుతూ, ఇద్దరికీ ఒకే న్యాయ ప్రమాణం వర్తించాలనే వాక్యబలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: దైవ స్వీయ ప్రకటన
  choice: మీ దేవుడైన యెహోవాను నేనే
  alternative: నేను యెహోవాను, మీ దేవుణ్ణి
  rationale: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם లోని ఒడంబడికాత్మక స్వీయ ప్రకటనను సహజమైన తెలుగు వాక్యరూపంలో, కారణార్థక సంబంధంతో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సమాన న్యాయ ప్రమాణంపై ఉన్న బలాన్ని కాపాడుతూ సహజ తెలుగు నిర్మాణం ఉపయోగించబడింది.
