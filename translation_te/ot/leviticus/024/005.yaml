translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆదేశ శైలిని వాడింది. మూలంలోని రెండవ పురుష ఏకవచన ఆజ్ఞను ‘నువ్వు’తో నిలిపింది; కొలతను వివరించినప్పటికీ ఆధునిక పరిమాణానికి ఊహాత్మక మార్పిడి చేయలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
