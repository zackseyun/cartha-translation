id: LEV.24.5
reference: Leviticus 24:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ סֹ֔לֶת וְ/אָפִיתָ֣ אֹתָ֔/הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽ/חַלָּ֥ה הָ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: te
  text: నీవు సన్నని పిండిని తీసుకొని, దానితో పన్నెండు రొట్టెలు[a] కాల్చాలి. ఒక్కొక్క రొట్టెకు ఏఫాలో రెండు పదోవంతుల పిండి ఉండాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పన్నెండు పిండివంటలు.” హీబ్రూ పదం ఆచార సంబంధ సందర్భాల్లో కాల్చిన రొట్టె భాగాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రెండు పదోవంతులు.” యాజక సంబంధ కొలత భాషలో ఇది ఒక్కొక్క రొట్టెకు ఏఫాలో రెండు పదోవంతుల పిండి అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: నువ్వు ... తీసుకొని
  rationale: ఆచార ప్రక్రియలో ఆజ్ఞను తెలిపే సంయుక్త క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగు ఆదేశ క్రమంగా అనువదించింది.
- source_word: סֹלֶת
  choice: మెత్తని పిండి
  rationale: బలులు, పవిత్ర రొట్టెల సందర్భాల్లో వాడే శుద్ధమైన సన్నని పిండిని సూచిస్తుంది; మూలంలో లేని ధాన్య రకాన్ని చేర్చలేదు.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: దానితో ... కాల్చాలి
  rationale: స్త్రీలింగ సర్వనామం ముందున్న పిండినే సూచిస్తుంది. తెలుగులో ఫలితంగా రొట్టెలు తయారవుతాయని సహజంగా వ్యక్తం చేయడానికి ‘దానితో’ వాడింది.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: పన్నెండు రొట్టెలు
  rationale: חַלּוֹת ఆచార సంబంధమైన కాల్చిన రొట్టె ముద్దలు లేదా రొట్టెలను సూచించగలదు. సాధారణ పాఠకులకు స్పష్టమైన ‘రొట్టెలు’ను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: రెండు పదోవంతుల ఏఫా
  rationale: అక్షరార్థంగా ‘రెండు పదోవంతులు’; యాజక సంబంధ కొలత భాషలో ఏఫాలో రెండు పదోవంతులు అని అర్థం. ఆధునిక పాఠకునికి కొలత ప్రమాణాన్ని స్పష్టం చేసింది.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: ఒక్కొక్క రొట్టెకు ... ఉండాలి
  rationale: అక్షరార్థంగా ‘ఒక్క రొట్టె ఉండాలి’; ఇక్కడ కొలత ప్రతి రొట్టెకూ వర్తిస్తుందని తెలుగులో సహజమైన విభజనార్థక రూపంతో తెలిపింది.
