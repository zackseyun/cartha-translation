    issue: Register of second-person pronoun
    rationale: ‘నువ్వు’ is informal/colloquial in comparison with the formal procedural instruction of the Hebrew; ‘నీవు’ retains singular address in a more appropriate register.
  - severity: medium
    issue: Footnote a uses ‘రొట్టె ముద్దలు’
    rationale: This wording may denote dough balls rather than baked bread units. The Hebrew refers to baked units, so the alternative should not imply an unbaked product.
  - severity: low
    issue: Measurement phrasing is awkwardly ordered
    rationale: '‘రెండు పదోవంతుల ఏఫా పిండి’ is understandable but less natural than expressing the fraction of the ephah directly: ‘ఏఫాలో రెండు పదోవంతుల పిండి.’'
