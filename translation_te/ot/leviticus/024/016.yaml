id: LEV.24.16
reference: Leviticus 24:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: te
  text: యెహోవా నామాన్ని దూషించేవాడు తప్పక మరణశిక్ష విధించబడాలి[a]. సమాజమంతా అతనిని తప్పక రాళ్లతో కొట్టి చంపాలి. విదేశీయుడైనా, స్వదేశీయుడైనా—ఆ నామాన్ని దూషించినప్పుడు[b] మరణశిక్ష విధించబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దూషించు’ అని అనువదించిన హీబ్రూ క్రియకు ‘స్పష్టంగా ఉచ్చరించు’ లేదా ‘పేర్కొను,’ అలాగే ఈ సందర్భంలో ‘శపించు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ఇక్కడ కేవలం ‘నామం’ అని ఉంది; అది దేవుని నామానికి గౌరవసూచక ప్రత్యామ్నాయంగా వాడబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: దూషించేవాడు / దూషించినప్పుడు
  rationale: נקב అనే క్రియకు ‘స్పష్టంగా పలుకు/పేర్కొను’ అనే అర్థాలు ఉండగలవు; అయితే ఈ న్యాయ సందర్భంలో దేవుని నామాన్ని అపవిత్రపరచే దూషణ భావం సహజంగా సరిపోతుంది. మూలంలోని సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: שֵׁם יְהוָה
  choice: యెహోవా నామం
  rationale: שֵׁם అంటే ‘నామం’; יהוה అనే ఒడంబడిక నామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: מֹות יוּמָת
  choice: తప్పక మరణశిక్ష పొందాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం నిశ్చయాన్ని, న్యాయపరమైన ఆజ్ఞను బలపరుస్తుంది; కర్మణి భావాన్ని ‘మరణశిక్ష పొందాలి’ నిలుపుతుంది.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: అతణ్ణి రాళ్లతో కొట్టి చంపాలి
  rationale: హీబ్రూ పునరుక్త క్రియారూపం శిక్షను బలంగా నిర్దేశిస్తుంది. తెలుగులో ‘రాళ్లతో కొట్టి చంపాలి’ దాని విధానాన్నీ ఫలితాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ సమకూడిన ఒడంబడిక సమాజాన్ని సూచిస్తుంది; ‘సమాజమంతా’ ఆధునిక పాఠకులకు సహజంగా, సామూహిక బాధ్యతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: పరదేశిగా నివసించేవాడైనా, స్వదేశీయుడైనా
  rationale: גֵּר అనేది ఇశ్రాయేలు మధ్య నివసించే స్థానికేతరుణ్ణి, אֶזְרָח స్థానికంగా పుట్టిన సమాజ సభ్యుణ్ణి సూచిస్తాయి. ఈ జంట వారి న్యాయసమానత్వాన్ని స్పష్టం చేస్తుంది.
- source_word: שֵׁם (absolute)
  choice: ఆ నామం
  rationale: చివరి భాగంలో ‘నామం’ స్వతంత్రంగా వచ్చి దేవుని నామానికి గౌరవసూచక ప్రత్యామ్నాయంగా పనిచేస్తుంది; తెలుగులో ‘ఆ నామం’ ముందున్న యెహోవా నామాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామంగానే నిలిపాం. ఆధునిక తెలుగు క్రైస్తవ పఠనంలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: נקב שֵׁם అనే పదబంధ భావం
  choice: నామాన్ని దూషించు
  alternative: నామాన్ని పలుకు / శపించు
  rationale: శిక్షాసందర్భం నామాన్ని అపవిత్రపరచే దూషణను సూచిస్తుంది; కేవలం దైవనామాన్ని పలకడమే నేరమని పాఠ్యంలో నిర్ణయించకుండా ఇతర సాధ్యార్థాలను పాదటిప్పణిలో భద్రపరిచాం.
- issue: పరదేశి మరియు స్వదేశీయునికి ఒకే శిక్ష
  choice: ఇద్దరికీ సమానంగా వర్తించే న్యాయవాక్యంగా అనువదించడం
  alternative: పరదేశిని తాత్కాలిక ప్రయాణికుడిగా అర్థం చేసుకోవడం
  rationale: גֵּר ఇక్కడ సమాజంలో నివసించే స్థానికేతరుడు; వాక్యం అతనికీ స్వదేశీయునికీ ఒకే నిబంధన వర్తిస్తుందని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. ‘తప్పక’ మొదటి బలప్రయోగాన్ని వ్యక్తం చేస్తుంది; రాళ్లతో కొట్టే ఆజ్ఞను సహజ తెలుగు న్యాయరూపంలో ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
