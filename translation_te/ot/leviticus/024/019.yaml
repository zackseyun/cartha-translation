  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: te
  text: ఒకడు తన తోటివానికి గాయం కలిగిస్తే[a], అతడు చేసినట్లే అతనికి చేయబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “తన తోటివానికి లోపం లేదా వైకల్యం కలిగిస్తే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: ఒకడు ... కలిగిస్తే
  rationale: న్యాయవిధిలో כִּי షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగు న్యాయశైలిలో ‘ఒకడు ... చేస్తే’ సహజంగా ఉండి, హీబ్రూ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: יִתֵּן מוּם
  choice: గాయం కలిగిస్తే
  rationale: పదశః ‘లోపం/వైకల్యం కలిగిస్తే.’ ఈ శారీరక హాని సందర్భంలో ‘గాయం కలిగిస్తే’ సహజమైన తెలుగు; శరీరానికి జరిగిన నష్టాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּעֲמִיתוֹ
  choice: తన తోటివానికి
  rationale: עָמִית సమాజంలోని తోటి వ్యక్తి లేదా సహచరుణ్ణి సూచిస్తుంది. ‘తోటివాడు’ ఈ సంబంధ భావాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: అతడు చేసినట్లే
  rationale: ప్రతిఫలం చేసిన పనికి సరిసమానంగా ఉండాలనే పోలికను నేరుగా నిలుపుతుంది.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: అతనికీ చేయాలి
  rationale: హీబ్రూ నిఫల్ రూపంలోని పరోక్ష న్యాయచర్యను తెలుగు విధి ప్రయోగంతో సహజంగా వ్యక్తపరుస్తుంది; వ్యక్తిగత ప్రతీకారాన్ని ప్రత్యేకంగా చేర్చదు.
theological_decisions:
- issue: న్యాయసందర్భంలోని సమాన ప్రతిఫల సూత్రం
  choice: చేసిన హానికి తగిన సమాన న్యాయప్రతిఫలంగా వాక్యాన్ని అనువదించడం
  alternative: వ్యక్తులు స్వయంగా ప్రతీకారం తీర్చుకోవాలనే ఆజ్ఞగా విస్తరించడం
  rationale: హీబ్రూ పరోక్ష క్రియారూపం న్యాయపరమైన చర్యను తెలియజేస్తుంది. మూలపాఠం చెప్పని వ్యక్తిగత ప్రతీకార భావాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన న్యాయశైలి. ‘తోటివాడు’ సమాజంలోని సహవ్యక్తి భావాన్ని అందిస్తుంది; ‘గాయం’ సందర్భానుసారంగా מוּם యొక్క శారీరక హాని భావాన్ని తెలియజేస్తుంది.
