id: LEV.24.11
reference: Leviticus 24:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: te
  text: ఇశ్రాయేలీయురాలి కుమారుడు ఆ నామాన్ని స్పష్టంగా పలికి, శపించాడు[a]. అప్పుడు వారు అతణ్ణి మోషే దగ్గరకు తీసుకొచ్చారు. అతని తల్లి పేరు దిబ్రీ కుమార్తె, దాను గోత్రానికి చెందిన షెలోమీతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ నామాన్ని దూషించి, శపించాడు.” ఇక్కడి హీబ్రూ క్రియకు “స్పష్టంగా పలికాడు” అనే అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది దైవనామ దూషణ చర్యను కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: స్పష్టంగా పలికి
  rationale: נקב అనే క్రియకు ‘స్పష్టంగా పేర్కొను/పలుకు’ అనే భావం ఉండగలదు. వెంటనే వేరుగా וַיְקַלֵּל (‘శపించాడు’) రావడం వల్ల, రెండు క్రియలను కలిపి ఒకే ‘దూషించాడు’ అనే భావంగా మార్చకుండా వాటి క్రమాన్ని నిలిపాం.
- source_word: אֶת הַשֵּׁם
  choice: ఆ నామాన్ని
  rationale: నిర్దిష్ట సూచకంతో ఉన్న ‘నామం’ ఇక్కడ దేవుని నామానికి భక్తిపూర్వక సూచన. ‘ఆ నామం’ అని అనువదించడం ప్రత్యేకతను చూపుతూ, మూలంలో లేని నిర్దిష్ట దైవనామాన్ని చేర్చదు.
- source_word: וַיְקַלֵּל
  choice: శపించాడు
  rationale: קלל పియేల్ రూపానికి సందర్భానుసారం నేరుగా ‘శపించు’ అనే అర్థం సరిపోతుంది; ముందున్న క్రియతో దీనిని కలపకుండా ప్రత్యేక చర్యగా ఉంచాం.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: వారు అతణ్ణి మోషే దగ్గరకు తీసుకొచ్చారు
  rationale: హీబ్రూలో కర్తను నిర్దిష్టంగా చెప్పని మూడవ పురుష బహువచన క్రియ ఉంది. తెలుగులోనూ ‘వారు’ అని సహజంగా నిలిపాం.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: షెలోమీతు; ఆమె ... దిబ్రీ కుమార్తె
  rationale: వ్యక్తుల పేర్లను లిప్యంతరీకరించి, తెలుగు వాక్య నిర్మాణంలో బంధుత్వాన్ని స్పష్టంగా, సహజంగా తెలిపాం.
- source_word: לְמַטֵּה דָן
  choice: దాను గోత్రానికి చెందిన
  rationale: ఈ హీబ్రూ ప్రయోగం గోత్ర సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన సమానార్థక రూపాన్ని వాడాం.
theological_decisions:
- issue: נקב అనే క్రియకు ‘ఆ నామం’తో కలిసినప్పుడు వచ్చే అర్థం
  choice: దైవనామాన్ని స్పష్టంగా పలికాడు; ఆ తరువాత వేరుగా శపించాడు
  alternative: ఆ నామాన్ని దూషించాడు, శపించాడు
  rationale: మూలంలో נקב, קלל అనే రెండు క్రియలు వరుసగా ఉన్నాయి. మొదటిదాన్ని ‘స్పష్టంగా పలికాడు’ అని ఇవ్వడం వాటి వేర్వేరు పాత్రలను కాపాడుతుంది. అయితే సందర్భంలో ఆ పలుకే దూషణ చర్యలో భాగమని అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆ నామం’ ద్వారా భక్తిపూర్వక సూచనను నిలిపి, మూలంలోని పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
