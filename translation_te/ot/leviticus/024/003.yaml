source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: te
  text: సాక్ష్యపు తెర[a] వెలుపల, సమాగమ గుడారంలో, అహరోను దానిని సాయంత్రం నుంచి ఉదయం వరకు యాహ్వే సన్నిధిలో నిత్యం[b] అమర్చాలి. ఇది మీ తరతరాలన్నిటికీ శాశ్వతమైన నియమం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సాక్ష్యపు పరదా.’ ఇక్కడ ‘సాక్ష్యం’ ముఖ్యంగా నిబంధనకు సాక్ష్యమైన పలకలతో సంబంధం కలిగిన ఆరాధనా పదం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘నిత్యం’ అనేది ప్రతి క్షణం ఆరిపోకుండా ఉండడాన్ని తప్పనిసరిగా సూచించదు; వాక్యంలో చెప్పినట్లుగా సాయంత్రం నుంచి ఉదయం వరకు ఈ సేవను క్రమం తప్పకుండా కొనసాగించడాన్ని సూచించవచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘ఎల్లకాల నియమం,’ ‘నిరంతరం అమలులో ఉండే నియమం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: సాక్ష్యపు తెర వెలుపల
  rationale: מִחוּץ స్థలాన్ని ‘వెలుపల’ అని సూచిస్తుంది; פָּרֹכֶת పరిశుద్ధస్థలంలోని విభజన తెర; הָעֵדֻת అనే ఆరాధనా సంబంధ పదాన్ని అతిగా వివరిచకుండా ‘సాక్ష్యం’గా నిలిపింది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: ఇది ఇశ్రాయేలు ఆరాధనా గుడారానికి స్థిరమైన పేరు. ‘సమావేశ గుడారం’ మూలార్థాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: దానిని … క్రమంగా ఉంచాలి
  rationale: ערך అంటే అమర్చడం, క్రమంలో ఉంచడం లేదా సంరక్షిస్తూ సిద్ధంగా ఉంచడం. సందర్భంలోని దీపాన్ని సూచించే ఏకవచన సర్వనామాన్ని ‘దానిని’గా నిలిపి, క్రియ యొక్క ఆరాధనా భావాన్ని ‘క్రమంగా ఉంచాలి’గా తెలిపింది.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: సాయంత్రం మొదలుకొని ఉదయం వరకు
  rationale: మూలంలోని కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో ఖచ్చితంగా తెలిపింది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ దేవుని సమక్షంలో జరిగే ఆరాధనా సేవను సూచిస్తుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: תָּמִיד
  choice: నిత్యం
  rationale: ఈ పదం నిరంతరత్వాన్ని లేదా క్రమం తప్పని పునరావృత ఆచరణను సూచించగలదు. ‘నిత్యం’ ఆ విస్తృతిని నిలుపుతుంది; రాత్రివేళ అనే పరిమితిని వాక్యమే స్పష్టం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలకు శాశ్వతమైన నియమం
  rationale: חֻקָּה నిర్దేశిత నియమాన్ని, עוֹלָם దాని దీర్ఘకాలిక లేదా శాశ్వత బలాన్ని, לְדֹרֹתֵיכֶם వరుస తరాలకు వర్తింపును సూచిస్తాయి.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత నామమైన יהוה నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా మూల ఉచ్చారణకు సమీపమైన రూపంలో ఇచ్చింది.
- issue: תָּמִיד యొక్క కాలబలం
  choice: నిత్యం
  alternative: క్రమం తప్పకుండా; ప్రతి రాత్రీ నిరంతరంగా
  rationale: ఈ పదం పూర్తిగా విరామంలేని చర్యనూ, నియమితంగా కొనసాగించే ఆచరణనూ సూచించగలదు. ‘సాయంత్రం మొదలుకొని ఉదయం వరకు’ అనే వాక్యభాగంతో ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా ‘నిత్యం’గా ఉంచి, వివరణను పాదసూచికలో ఇచ్చింది.
- issue: חֻקַּת עוֹלָם యొక్క వ్యవధి
  choice: శాశ్వతమైన నియమం
  alternative: ఎల్లకాల నియమం; నిరంతరం అమలులో ఉండే నియమం
  rationale: עוֹלָם పదానికి దీర్ఘకాలికమైనది లేదా శాశ్వతమైనది అనే భావపరిధి ఉంది. ప్రధాన పాఠంలో సూటి రూపాన్ని ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. పాతకాలపు ‘గుడారము,’ ‘కట్టడ’ వంటి రూపాలకు బదులుగా ‘గుడారం,’ ‘నియమం’ వాడబడ్డాయి. ఆరాధనా సందర్భపు ప్రత్యేక పదాలను అర్థం కోల్పోకుండా సాధారణ పాఠకుడికి గ్రాహ్యంగా ఉంచింది.
