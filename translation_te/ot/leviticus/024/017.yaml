source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: te
  text: ఒక మనిషి ఏ మానవ వ్యక్తినైనా కొట్టి చంపితే[a], అతనికి తప్పకుండా మరణశిక్ష విధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “ఏ మానవ వ్యక్తినైనా కొడితే.” ఇక్కడ “కొట్టడం” సందర్భానుసారం మరణానికి దారితీసే దెబ్బను సూచిస్తుంది; “మానవ వ్యక్తి” అంటే శరీరానికి వేరైన ‘ఆత్మ’ కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: ఒక మనిషి … కొడితే
  rationale: אִישׁ అనే పురుష ఏకవచన రూపాన్ని ‘ఒక మనిషి’గా నిలిపి, న్యాయవాక్యంలోని כִּי షరతును తెలుగు ‘-తే’ రూపంతో సహజంగా వ్యక్తం చేశాం. వְ సందర్భంతో అనుసంధానించినా, తెలుగులో వచనారంభ ‘మరియు’ అవసరం లేదు.
- source_word: יַכֶּה
  choice: చావుదెబ్బ కొడితే
  rationale: נכה హిఫీల్‌కు మూలార్థం ‘కొట్టు’; ఈ సందర్భంలో ఆ దెబ్బ మరణానికి దారితీస్తుంది. ‘చంపితే’కన్నా ‘చావుదెబ్బ కొడితే’ దెబ్బ అనే మూలచిత్రాన్నీ ప్రాణాంతక ఫలితాన్నీ రెండింటినీ తెలియజేస్తుంది.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: మరొక మనిషిని
  rationale: నֶפֶשׁ ఇక్కడ శరీరానికి వేరైన ‘ఆత్మ’ను కాక మానవ వ్యక్తిని సూచిస్తుంది; אָדָם సాధారణ మానవార్థంలో ఉంది. తెలుగు న్యాయవాక్యంలో ‘మరొక మనిషిని’ సహజంగా ఉండి బాధితుడు మానవ వ్యక్తి అని స్పష్టం చేస్తుంది.
- source_word: מוֹת יוּמָת
  choice: అతనికి తప్పకుండా మరణశిక్ష విధించాలి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన నిష్క్రియ క్రియారూపం శిక్ష యొక్క నిశ్చితత్వాన్ని బలపరుస్తుంది. ‘తప్పకుండా’ ఆ బలాన్ని, ‘మరణశిక్ష విధించాలి’ తెలుగు న్యాయశైలిని వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: נֶפֶשׁ אָדָם యొక్క భావం
  choice: మరొక మనిషిని
  alternative: మానవ ప్రాణాన్ని / ఆత్మను
  rationale: ఈ సందర్భంలో పదబంధం చంపబడిన మానవ వ్యక్తిని సూచిస్తుంది; దానిని అమూర్తమైన ప్రాణంగా లేదా శరీరరహిత ఆత్మగా అర్థం చేసుకోకూడదు.
- issue: אִישׁ అనే పురుష ఏకవచనం
  choice: ఒక మనిషి
  alternative: ఎవరైనా / ఒక వ్యక్తి
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; అయితే బాధితునికి వాడిన אָדָם సాధారణ మానవార్థంలోనే గ్రహించబడింది.
- issue: מוֹת יוּמָת లోని నిశ్చిత శిక్షా సూత్రం
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  alternative: అతడు నిశ్చయంగా చంపబడాలి
  rationale: మరణదండన యొక్క నిశ్చితత్వాన్ని కాపాడుతూ, దానిని వ్యక్తిగత ప్రతీకారంగా కాక న్యాయపరమైన శిక్షగా తెలుగులో సహజంగా వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన న్యాయశైలి. ‘చావుదెబ్బ కొడితే’ మూలక్రియలోని దెబ్బ చిత్రాన్ని నిలిపి ప్రాణాంతక ఫలితాన్ని స్పష్టం చేస్తుంది. ‘మరణశిక్ష విధించాలి’ ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే న్యాయపరమైన రూపం.
