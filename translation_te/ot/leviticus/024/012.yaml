source:
  edition: WLC
  text: וַ/יַּנִּיחֻ֖/הוּ בַּ/מִּשְׁמָ֑ר לִ/פְרֹ֥שׁ לָ/הֶ֖ם עַל פִּ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: te
  text: యాహ్వే మాట ప్రకారం వారికి స్పష్టంగా తెలియజేయడానికి వారు అతణ్ణి నిర్బంధంలో ఉంచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి స్పష్టంగా వివరించడానికి” లేదా “నిర్దిష్టంగా ప్రకటించడానికి.” హెబ్రీ క్రియ ఒక విషయాన్ని స్పష్టం చేయడం లేదా నిర్దిష్టంగా ప్రకటించడం అనే అర్థాన్నివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: అతణ్ణి … ఉంచారు
  rationale: హిఫీల్ రూపంలోని ‘ఉంచు, నిలుపు’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది.
- source_word: בַּמִּשְׁמָר
  choice: నిర్బంధంలో
  rationale: కాపలా కింద ఉంచబడిన న్యాయపరమైన నిర్బంధాన్ని సూచిస్తుంది; కేవలం ‘కాపలా’ అనే భావం కాదు.
- source_word: לִפְרֹשׁ
  choice: విషయం స్పష్టం అయ్యేంతవరకు
  rationale: פרשׁ అనే క్రియకు ‘స్పష్టం చేయు, విశదపరచు, నిర్దిష్టంగా తెలియజేయు’ అనే అర్థాలున్నాయి. ఇక్కడ ఎవరు స్పష్టం చేస్తారో లేదా ఏది స్పష్టమవాలో హెబ్రీ పాఠం బహిరంగంగా చెప్పనందున, ‘తీర్పు’ అని చేర్చకుండా సందర్భోచితమైన అస్పష్టతను నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: స్పష్టత కోసం ఎదురుచూస్తున్న సమాజపు నాయకులు లేదా సంబంధిత ప్రజలను సూచించే సహజమైన దత్తివాచక రూపం.
- source_word: עַל־פִּי
  choice: నోటి మాట ప్రకారం
  rationale: ‘నోటి ప్రకారం’ అనే హెబ్రీ నుడికారంలోని వాచికమైన, అధికారపూర్వకమైన భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠన సంప్రదాయంలో విస్తృతంగా పరిచయమైన రూపంతో దైవ నామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే అందిస్తుంది.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవ నామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపం పేరును ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: לִפְרֹשׁ యొక్క న్యాయపరమైన సూచన
  choice: విషయం స్పష్టం అయ్యేంతవరకు
  alternative: తీర్పు స్పష్టం అయ్యేంతవరకు
  rationale: సందర్భం న్యాయపరమైన నిర్ణయాన్ని సూచించినా, హెబ్రీ పాఠంలో ‘తీర్పు’ అనే నామవాచకం లేదు. దానిని చేర్చకుండా మూలంలోని భావసంక్షిప్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-కథన శైలి. ‘నిర్బంధంలో’ ప్రస్తుత పాఠకులకు స్పష్టంగా ఉంటుంది. మూలంలోని సంక్షిప్తత, కర్త/విషయ సంబంధిత స్వల్ప అస్పష్టత పాదటిప్పణితో కాపాడబడింది.
