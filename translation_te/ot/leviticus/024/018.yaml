source:
  edition: WLC
  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: te
  text: జంతువును చంపినవాడు దానికి పరిహారం చెల్లించాలి—ప్రాణానికి ప్రాణం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “ప్రాణానికి ప్రాణం.” జంతువుకు పరిహారం చెల్లించే ఈ సందర్భంలో, ఈ మాట సమానమైన ప్రతిపూరణను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה נֶפֶשׁ בְּהֵמָה
  choice: జంతువును చంపినవాడు
  rationale: నכה హిఫీల్ కృదంతం సాధారణ న్యాయనియమంలోని వ్యక్తిని సూచిస్తుంది. נֶפֶשׁ בְּהֵמָה అనే ప్రయోగం జంతువు ప్రాణాన్ని హరించే చర్యను సూచిస్తుంది; తెలుగులో ‘జంతువు ప్రాణాన్ని కొట్టినవాడు’ అనడం అసహజం కాబట్టి భావాన్ని నేరుగా ‘చంపినవాడు’గా ఇచ్చాం.
- source_word: בְּהֵמָה
  choice: జంతువు
  rationale: ఇది జంతువు లేదా పశువు అనే సాధారణ పదం. సందర్భంలో యాజమాన్యంలోని జంతువు ఉద్దేశించబడినా, మూలంలోని విస్తృతతను నిలుపుతూ ఆధునిక సాధారణ తెలుగు పదం ఎంచుకున్నాం.
- source_word: יְשַׁלְּמֶנָּה
  choice: దానికి పరిహారం చెల్లించాలి
  rationale: పీయేల్ రూపంలోని שלם నష్టాన్ని పూరించడం లేదా పరిహారం ఇవ్వడం అనే న్యాయార్థాన్ని కలిగిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం జంతువును తిరిగి సూచిస్తుంది.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: ప్రాణానికి ప్రాణం
  rationale: హీబ్రూ న్యాయసూత్రపు సంక్షిప్త రూపాన్ని సహజమైన తెలుగులో నిలిపాం. ఇది సమానమైన ప్రతిపూరణను సూచిస్తుంది; దాని ఖచ్చితమైన విధానాన్ని అనువాదంలో నిర్దేశించలేదు.
theological_decisions:
- issue: జంతువుకు సంబంధించిన న్యాయసందర్భంలో ‘ప్రాణానికి ప్రాణం’ అనే సూత్రం అర్థం
  choice: జంతువును చంపినందుకు సమానమైన పరిహారం అవసరమని చెప్పే సూత్రంగా అనువదించడం
  alternative: చనిపోయిన జంతువుకు బదులుగా తప్పనిసరిగా మరో జంతువునే ఇవ్వాలని నిర్దిష్టంగా అర్థం చేసుకోవడం
  rationale: ముందున్న יְשַׁלְּמֶנָּה (‘పరిహారం చెల్లించాలి’) ముగింపు సూత్రాన్ని నియంత్రిస్తుంది. మూలపాఠం చెప్పని నిర్దిష్ట పరిహార విధానాన్ని చేర్చకుండా, దాని న్యాయపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే న్యాయశైలిని వాడాం. ‘పరిహారం చెల్లించాలి’ అనే పదబంధం ఆజ్ఞాత్మక న్యాయభావాన్ని సహజంగా తెలియజేస్తుంది; ‘ప్రాణానికి ప్రాణం’ అనే మూలసూత్రాన్ని యథాతథ భావంతో నిలిపాం.
