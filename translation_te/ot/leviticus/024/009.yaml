  text: וְ/הָֽיְתָה֙ לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֔י/ו וַ/אֲכָלֻ֖/הוּ בְּ/מָק֣וֹם קָדֹ֑שׁ כִּ֡י קֹדֶשׁ֩ קָֽדָשִׁ֨ים ה֥וּא ל֛/וֹ מֵ/אִשֵּׁ֥י יְהוָ֖ה חָק עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: te
  text: అది అహరోనుకూ అతని కుమారులకూ చెందుతుంది. వారు దానిని పవిత్ర స్థలంలో తినాలి; ఎందుకంటే అది యెహోవాకు అర్పించే అగ్ని అర్పణలలో నుండినది, అతనికి అత్యంత పవిత్రమైనది.[a] ఇది శాశ్వతమైన నియమం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా అగ్ని అర్పణలలో నుండినది.’ హీబ్రూ పదం సంప్రదాయంగా అగ్నిచే సమర్పించే అర్పణలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: అది అహరోనుకు, అతని కుమారులకు చెందుతుంది
  rationale: היה + לְ ఇక్కడ ఉనికిని కాక కేటాయింపు/స్వామ్యాన్ని సూచిస్తుంది; ‘చెందుతుంది’ ఆధునిక తెలుగులో న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲכָלֻהוּ
  choice: వారు దానిని ... తినాలి
  rationale: ఈ రూపం ధర్మశాసన ఆదేశాన్ని కొనసాగిస్తుంది; తెలుగులో ‘తినాలి’ విధిబద్ధతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పవిత్ర స్థలంలో
  rationale: మూలంలో నిర్దిష్ట ఉపపదం లేకపోయినా, తెలుగు నామవాచక వ్యవస్థలో ఈ రూపం ఏకైక ఆలయ గదిని తప్పనిసరిగా సూచించకుండా పవిత్రంగా నియమితమైన స్థలాన్ని తెలియజేస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పవిత్రమైన
  rationale: హీబ్రూ అతిశయోక్తి నిర్మాణాన్ని స్థలానికి సంబంధించిన ‘అతి పరిశుద్ధ స్థలం’గా అపార్థం కాకుండా గరిష్ఠ పవిత్రతగా అందిస్తుంది.
- source_word: הוּא לוֹ
  choice: అది అతనికి ... భాగం
  rationale: לֹו లోని ఏకవచనాన్ని ‘అతనికి’గా నిలిపి, అహరోను యాజక వంశానికి ప్రతినిధిగా ఉన్న మూలవ్యాకరణంలోని ఉద్రిక్తతను సవరించకుండా ఉంచుతుంది; సందర్భానుగుణంగా ‘భాగం’ కేటాయింపును స్పష్టం చేస్తుంది.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: యెహోవాకు అర్పించే అగ్ని అర్పణల్లో
  rationale: אִשֶּׁה అనే బలిపదానికి ఉన్న అగ్నితో సమర్పించే అర్పణ భావాన్ని నేరుగా నిలుపుతుంది; దేవుడు ఆహారం తింటాడనే అనుచిత సూచనను నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: חָק עוֹלָם
  choice: శాశ్వతమైన నియమం
  rationale: నిరంతరం అమల్లో ఉండే శాసనాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అహరోను, అతని కుమారులు అని బహువచన సందర్భంలో ఉన్న ఏకవచన לֹו యొక్క సూచన
  choice: ‘అతనికి’ అని ఏకవచనంగానే అనువదించడం
  alternative: సందర్భానికి అనుగుణంగా ‘వారికి’ అని బహువచనం చేయడం
  rationale: మూలంలోని ఏకవచనాన్ని కాపాడుతుంది; అహరోను యాజక వంశానికి ప్రతినిధిగా ఉండవచ్చనే భావాన్ని పాఠకుడు సందర్భం నుంచి గ్రహించేలా చేసి, వ్యాకరణాన్ని నిశ్శబ్దంగా సవరించదు.
- issue: אִשֵּׁי అనే బలిపదం యొక్క భావం
  choice: ‘అగ్ని అర్పణలు’ అని అనువదించడం
  alternative: ‘ఆహార అర్పణలు’ అని అనువదించడం
  rationale: ఈ పదానికి సంప్రదాయంగా ఉన్న అగ్నితో సమర్పణ భావాన్ని స్పష్టంగా ఉంచుతూ, దేవుడు అక్షరార్థంగా ఆహారం భుజిస్తాడనే భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ధర్మశాసన వాక్యానికి తగిన గౌరవప్రదమైన శైలి. సాధారణ పాఠకులకు స్పష్టత కోసం సహజ వాక్యనిర్మాణం వాడబడింది; మూలంలోని לֹו ఏకవచనం మాత్రం ఉద్దేశపూర్వకంగా నిలుపబడింది.
