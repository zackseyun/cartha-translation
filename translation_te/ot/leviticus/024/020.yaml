  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: te
  text: విరుగుదలకు విరుగుదల, కంటికి కన్ను, పంటికి పన్ను; ఎవడు ఒక వ్యక్తికి గాయం కలిగిస్తాడో[a], అతనికి కూడా అలాగే చేయబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గాయం కలిగిస్తాడు’ అనే చోట హీబ్రూలో అక్షరార్థంగా ‘ఒక వ్యక్తిలో లోపం/వైకల్యం కలిగిస్తాడు’ అని ఉంది. చివరి భాగాన్ని ‘అది అతనికి చేయబడాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: ఎముక విరుగుదల
  rationale: ఈ శాసన సందర్భంలో శరీరంలోని విరుగుదలను, ముఖ్యంగా ఎముక విరగడాన్ని సూచిస్తుంది. కేవలం ‘విరుగుదల’ కంటే ‘ఎముక విరుగుదల’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: תַּחַת
  choice: ప్రతిగా / -కి
  rationale: ప్రతీకార న్యాయ సూత్రంలో సమాన ప్రతిఫలాన్ని సూచిస్తుంది. మొదటి పదబంధంలో ‘ప్రతిగా’ స్పష్టతనిస్తుంది; స్థిరమైన తెలుగు నుడికారంలో ‘కంటికి కన్ను, పంటికి పన్ను’ సహజంగా ఉంటుంది.
- source_word: עַיִן
  choice: కన్ను
  rationale: శరీర అవయవాన్ని సూచించే ప్రత్యక్ష పదం; న్యాయ సూత్రంలోని రూపాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: שֵׁן
  choice: పన్ను
  rationale: శరీర అవయవాన్ని సూచించే ప్రత్యక్ష పదం; ‘పంటికి పన్ను’ అనే సహజ విభక్తి రూపంలో వాడబడింది.
- source_word: כַּאֲשֶׁר
  choice: ఏ ... ఓ
  rationale: హీబ్రూ పోలికను తెలుగులో సహజమైన పరస్పర నిర్మాణమైన ‘ఏ... అదే’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: יִתֵּן מוּם
  choice: గాయం కలిగిస్తాడు
  rationale: అక్షరార్థంగా ‘లోపం/వైకల్యం ఇవ్వడం’ అయిన హీబ్రూ నుడికారాన్ని, ఈ దాడి-శాసన సందర్భంలో సహజ తెలుగులో ‘గాయం కలిగించడం’గా అందిస్తుంది.
- source_word: מוּם
  choice: గాయం
  rationale: ఈ సందర్భంలో ఒక వ్యక్తి మరొకరికి కలిగించే శారీరక హాని లేదా వికృతిని సూచిస్తుంది. ‘లోపం’ లేదా ‘మచ్చ’ కంటే ‘గాయం’ సందర్భానుకూలంగా, సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: אָדָם
  choice: వ్యక్తి
  rationale: ఈ శాసన సందర్భంలో ఏ మానవునినైనా సూచించే ప్రతినిధి ఏకవచనం. ఆధునిక తెలుగులో ‘వ్యక్తి’ లింగనిరపేక్షంగా సహజంగా ఉంటుంది.
- source_word: כֵּן
  choice: అదే
  rationale: కలిగించిన హానికి సరిగ్గా సరిపడే పరిణామాన్ని సూచిస్తూ న్యాయ సమాంతరతను నిలుపుతుంది.
- source_word: יִנָּתֶן בּוֹ
  choice: అతనికి కలిగించాలి
  rationale: హీబ్రూలోని నిష్క్రియ భావాన్ని తెలుగులో సహజమైన విధి/న్యాయ ఆజ్ఞగా అందిస్తుంది; ముందున్న ‘గాయం’ భావాన్ని పునరుద్ధరిస్తుంది.
theological_decisions:
- issue: ప్రతీకార న్యాయ సూత్ర స్వభావం
  choice: ‘ఎముక విరుగుదలకు ప్రతిగా ఎముక విరుగుదల, కంటికి కన్ను, పంటికి పన్ను’ అనే స్పష్టమైన సమాన ప్రతిఫల సూత్రాన్ని నిలుపడం
  alternative: సమానమైన పరిహారం లేదా గాయానికి తగిన నష్టపరిహారం అని సారాంశీకరించడం
  rationale: హీబ్రూ పాఠం శరీర గాయాలను స్పష్టంగా, పరస్పర సమాంతరంగా పేర్కొంటుంది. దానిని కేవలం ఆర్థిక పరిహారంగా వ్యాఖ్యానించడం పాఠంలో లేని న్యాయ వివరణను అనువాదంలోకి తెస్తుంది.
- issue: אָדָם యొక్క సాధారణ మానవ సూచన
  choice: వ్యక్తి
  alternative: మనిషి / పురుషుడు
  rationale: ఇక్కడ పదం కేసు చట్టంలో ఏ మానవ బాధితునినైనా సూచిస్తుంది. ‘వ్యక్తి’ ఆ సాధారణ అర్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; పురుషునికే పరిమితం చేయదు.
- issue: יִנָּתֶן בּוֹ లోని నిష్క్రియ నిర్మాణం
  choice: అతనికి కలిగించాలి
  alternative: అది అతనికి కలిగించబడాలి
  rationale: తెలుగులో కర్తరహిత విధి నిర్మాణం సహజంగా ఉండి హీబ్రూ నిష్క్రియ భావాన్ని కాపాడుతుంది. శిక్షను ఎవరు అమలు చేస్తారో పాఠం చెప్పని అస్పష్టతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శాసన శైలిని ఉపయోగించాం. స్థిరంగా వినిపించే ‘కంటికి కన్ను, పంటికి పన్ను’ రూపాన్ని నిలిపి, שֶׁבֶר విషయంలో స్పష్టత కోసం ‘ఎముక విరుగుదల’ అని అనువదించాం. ‘ఒకడు మరొక వ్యక్తికి’ అనే నిర్మాణం హీబ్రూ వాక్యంలోని కర్తను మరియు సాధారణ మానవ బాధితుని తెలుగులో స్పష్టంగా వేరు చేస్తుంది.
