  source_fidelity: ప్రధాన పాఠం תָּמִיד (‘నిరంతరం/క్రమంగా’)ను ‘నిత్య నిబంధన’కు విశేషణంగా మార్చింది. హీబ్రూ వాక్యనిర్మాణంలో అది యַעַרְכֶנּוּ (‘అమర్చాలి’) అనే క్రియను విశేషిస్తుంది. అలాగే ‘అది ... నిబంధన’ అనే స్వతంత్ర వాక్యంగా చేయడం మూలంలోని ‘నిత్య నిబంధనగా’ అనే నియమ-సంబంధ పదబంధాన్ని కొంత మార్చుతుంది. సవరించిన పాఠం ఈ సంబంధాలను నిలుపుతుంది.
