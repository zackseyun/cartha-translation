base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: te
  text: ప్రతి విశ్రాంతిదినాన అతడు దానిని యాహ్వే సన్నిధిలో నిరంతరం అమర్చాలి; ఇది ఇశ్రాయేలు కుమారుల నుండి వచ్చిన నిత్య నిబంధనగా ఉండాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: “విశ్రాంతిదినాన, విశ్రాంతిదినాన”; ఇది ప్రతి విశ్రాంతిదినాన అనే పంపిణీయ భావాన్ని తెలియజేస్తుంది. “దానిని” అనేది రొట్టెల అమరిక మొత్తాన్ని ఏకవచనంగా సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారుల నుండి”కు సందర్భానుసారంగా “ఇశ్రాయేలు కుమారుల తరఫున” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: ప్రతి విశ్రాంతిదినాన
  rationale: హీబ్రూ పదబంధంలోని పునరుక్తి పంపిణీయ భావాన్ని, అంటే ప్రతి విశ్రాంతిదినం క్రమంగా జరిగే కార్యాన్ని, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַעַרְכֶנּוּ
  choice: అతడు దానిని క్రమంగా అమర్చాలి
  rationale: ערך అనే క్రియ ఆరాధన సంబంధ వస్తువులను పద్ధతి ప్రకారం అమర్చడాన్ని సూచిస్తుంది. ఏకవచన ప్రత్యయం రొట్టెల అమరికను సమష్టిగా సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో సమర్పించి ఉంచడాన్ని సూచించే సహజమైన ఆరాధన సంబంధ ప్రయోగం; יְהוָה అనే దైవనామాన్ని యాహ్వే అని లిప్యంతరీకరించాం.
- source_word: תָּמִיד
  choice: నిరంతరం ఉండే
  rationale: ఇక్కడ ఆచారం విరామం లేకుండా జరుగుతుందని కాక, తరతరాలుగా క్రమంగా కొనసాగాలని సూచిస్తుంది; వారానికొకసారి అనే కాలనిర్దేశంతో కలిపి ఈ భావం స్పష్టమవుతుంది.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తరఫున
  rationale: מֵאֵת మూలం లేదా ప్రతినిధిత్వం అనే రెండు ఛాయలను అనుమతిస్తుంది. సందర్భంలో సమాజం తరఫున యాహ్వే సన్నిధిలో ఉంచే రొట్టెల భావం సరిపోతుంది; בְּנֵי అనే రూపాన్ని ‘కుమారులు’గా నిలిపాం.
- source_word: בְּרִית עוֹלָם
  choice: నిత్య నిబంధన
  rationale: హీబ్రూలోని నిబంధన భాషను వ్యాఖ్యానాత్మకంగా ‘బాధ్యత’గా విస్తరించకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్పష్టంగా లిప్యంతరీకరించాం.
- issue: מֵאֵת యొక్క సంబంధ భావం
  choice: ఇశ్రాయేలు కుమారుల తరఫున
  alternative: ఇశ్రాయేలు కుమారుల నుండి
  rationale: ఈ రొట్టెలు సమాజం అందించినవని ‘నుండి’ సూచించవచ్చు; అయితే ఆరాధన సందర్భంలో అవి వారి తరఫున యాహ్వే సన్నిధిలో ఉంచబడతాయనే ప్రతినిధిత్వ భావం కూడా నిజమైన సాధ్యత. ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: תָּמִיד మరియు בְּרִית עוֹלָם మధ్య వాక్యనిర్మాణ సంబంధం
  choice: అది ... నిరంతరం ఉండే నిత్య నిబంధన
  alternative: అతడు దానిని నిరంతరం అమర్చాలి ... నిత్య నిబంధనగా
  rationale: హీబ్రూ పదక్రమం תָּמִיד ను అమర్చే క్రియతో సహజంగా కలపగలదు; అలాగే మొత్తం నియమం కొనసాగింపును సూచించేలా కూడా వినిపిస్తుంది. తెలుగులో అసహజత లేకుండా రెండవ ఛాయను ప్రధాన పాఠంలో ఇచ్చి, మొదటి అవకాశాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలి వాడబడింది. ‘విశ్రాంతిదినం,’ ‘సన్నిధి,’ ‘నిబంధన’ వంటి పరిచిత బైబిలు పదాలను నిలిపి, అతిగా వ్యాఖ్యానాత్మకమైన ‘నిబంధన బాధ్యత’ను నివారించాం.
