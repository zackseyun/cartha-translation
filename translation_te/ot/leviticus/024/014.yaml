revisions:
- from: “శపించినవాణ్ణి శిబిరం వెలుపలికి తీసుకురా.[a] విన్నవారందరూ అతని తలపై తమ చేతులు ఉంచాలి.[b] ఆ తర్వాత సమాజమంతా అతణ్ణి రాళ్లతో కొట్టాలి.”
  to: “శపించినవాణ్ణి శిబిరం వెలుపలికి తీసుకుపో.[a] విన్నవారందరూ అతని తలపై తమ చేతులు ఉంచాలి.[b] సమాజమంతా అతణ్ణి రాళ్లతో కొట్టి చంపాలి.”
