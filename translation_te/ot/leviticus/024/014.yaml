source:
  edition: WLC
  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: te
  text: “శపించినవాణ్ణి శిబిరం వెలుపలికి తీసుకుపో.[a] విన్నవారందరూ అతని తలపై తమ చేతులు ఉంచాలి.[b] సమాజమంతా అతణ్ణి రాళ్లతో కొట్టి చంపాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవదూషణ చేసినవాణ్ణి.” హీబ్రూ పదం అక్షరార్థంగా “శపించినవాణ్ణి” అని సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ తలపై చేతులు ఉంచడం, విన్నవారు నేరస్థుణ్ణి అధికారికంగా గుర్తించడాన్ని సూచించి ఉండవచ్చు. దీనికి సంకేతాత్మక ప్రాముఖ్యత కూడా ఉందని కొందరు భావిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: వెలుపలికి తీసుకురా
  rationale: יצא క్రియ యొక్క causative ఆజ్ఞారూపం ఒకరిని బయటికి తీసుకువెళ్లడాన్ని సూచిస్తుంది. గమ్యస్థానమైన శిబిరం వెలుపలితో కలిపి ఈ ప్రయోగం తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמְקַלֵּל
  choice: శపించినవాణ్ణి
  rationale: קלל ధాతువు యొక్క సూచిత వ్యక్తిని తెలిపే participial రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది. సందర్భంలో దేవుని నామాన్ని శపించడం ఉన్నప్పటికీ, ప్రధాన పాఠంలో ‘దైవదూషణ చేసినవాణ్ణి’ అనే వ్యాఖ్యానాత్మక అర్థాన్ని ప్రవేశపెట్టలేదు.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపలికి
  rationale: సమాజ నివాస పరిధికి బయట అనే స్థలార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְסָמְכוּ
  choice: ఉంచాలి
  rationale: చేతులను తలపై ఉంచే סמך ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది; మొదటి ఆజ్ఞ కొనసాగింపుగా విధిని సూచించే ‘ఉంచాలి’ వాడబడింది.
- source_word: כָל הַשֹּׁמְעִים
  choice: విన్నవారందరూ
  rationale: మూలంలోని ‘వినిన వారందరూ’ అనే భావాన్ని కర్మను అదనంగా చేర్చకుండా నిలుపుతుంది.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: అతని తలపై తమ చేతులు
  rationale: మూలంలోని బహువచన ‘చేతులు’ను, ఏకవచన ‘తల’ను యథాతథంగా పరిరక్షిస్తుంది.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: అతణ్ణి రాళ్లతో కొట్టాలి
  rationale: רגם సూచించే రాళ్లతో కొట్టే శిక్షను నేరుగా తెలుపుతుంది. మూలంలో ప్రత్యేకంగా లేని ‘చంపాలి’ అనే పదాన్ని చేర్చలేదు.
- source_word: כָל הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה సూచించే సమష్టి ఒడంబడిక సమాజాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నేరస్థుణ్ణి ‘శపించినవాడు’గా అనువదించాలా, ‘దైవదూషణ చేసినవాడు’గా అనువదించాలా
  choice: శపించినవాణ్ణి
  alternative: దైవదూషణ చేసినవాణ్ణి
  rationale: ఇక్కడి హీబ్రూ పదం నేరుగా ‘శపించు’ అనే קלל ధాతువునుంచి వచ్చింది. విస్తృత సందర్భం దేవుని నామాన్ని శపించడాన్ని సూచించినా, ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో స్థిరపరచకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: తలపై చేతులు ఉంచడంలోని సంకేతార్థం
  choice: చర్యను మాత్రమే ప్రధాన పాఠంలో ఉంచడం
  alternative: సాక్షులు నేరస్థుణ్ణి అధికారికంగా గుర్తించడం లేదా అపరాధాన్ని సంకేతాత్మకంగా బదిలీ చేయడం అని వివరించడం
  rationale: ఈ వచనం ఆ చర్యను ఆదేశిస్తుంది గాని దాని సంకేతార్థాన్ని వివరించదు. అందువల్ల ప్రధాన పాఠం ఏ ఒక్క వేదాంత వ్యాఖ్యానాన్నీ నిర్ణయంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఆజ్ఞతో మొదలై తదనంతర విధులను ‘ఉంచాలి’, ‘కొట్టాలి’తో వ్యక్తం చేశాం. మూలంలో స్పష్టంగా లేని కర్మను ‘విన్నవారందరూ’ తర్వాత చేర్చలేదు; రాళ్లతో కొట్టడాన్ని ‘చంపాలి’ అని విస్తరించలేదు.
