source:
  edition: WLC
  text: וַ/יֵּצֵא֙ בֶּן אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְ/הוּא֙ בֶּן אִ֣ישׁ מִצְרִ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּנָּצוּ֙ בַּֽ/מַּחֲנֶ֔ה בֶּ֚ן הַ/יִּשְׂרְאֵלִ֔ית וְ/אִ֖ישׁ הַ/יִּשְׂרְאֵלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: te
  text: ఇశ్రాయేలీయురాలైన ఒక స్త్రీ కుమారుడు—అతని తండ్రి ఐగుప్తీయుడు—ఇశ్రాయేలు కుమారుల మధ్యకు[a] వెళ్లాడు. శిబిరంలో ఆ ఇశ్రాయేలీయురాలి కుమారుడూ ఒక ఇశ్రాయేలీయుడూ పోట్లాడుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలీయుల మధ్యకు” అని కూడా అనువదించవచ్చు. హీబ్రూ అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల మధ్యకు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వాదించుకున్నారు.” ఈ హీబ్రూ క్రియ వాగ్వాదాన్ని లేదా పోరాటాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వెళ్లాడు
  rationale: יצא అనే క్రియ కథనంలో ‘బయటికి వెళ్లాడు/వెళ్లాడు’ అనే భావాన్ని ఇస్తుంది. అతడు ఎక్కడి నుంచి బయలుదేరాడో మూలపాఠం చెప్పనందున తెలుగు అనువాదంలో దాన్ని చేర్చలేదు.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: ఇశ్రాయేలీయురాలైన ఒక స్త్రీ కుమారుడు
  rationale: ఈ పదబంధం అతణ్ణి తల్లి వంశం ద్వారా గుర్తిస్తుంది. స్త్రీలింగ జాతిసూచక రూపాన్ని తెలుగులో స్పష్టంగా ఉంచింది.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: అతని తండ్రి ఐగుప్తీయుడు
  rationale: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా ‘అతడు ఐగుప్తీయుడైన పురుషుని కుమారుడు’ అని ఉన్నా, అదే సంబంధాన్ని సహజమైన తెలుగులో ఈ విధంగా తెలిపింది.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల మధ్యకు
  rationale: בְּתוֹךְ అంటే ‘మధ్యలో/మధ్యకు’; בְּנֵי יִשְׂרָאֵל అనే సంప్రదాయ జాతీయ పదబంధాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలిపింది.
- source_word: וַיִּנָּצוּ
  choice: పోట్లాడుకున్నారు
  rationale: נצה క్రియ ఇక్కడ వాగ్వాదం లేదా శారీరక పోరాటాన్ని సూచించగలదు. ‘పోట్లాడుకున్నారు’ ఆ పరిధిని తెలుగులో సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చింది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలో
  rationale: మַחֲנֶהకు సహజమైన, నేరమైన స్థానసూచక అనువాదం.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: ఆ ఇశ్రాయేలీయురాలి కుమారుడు
  rationale: వ్యక్తిని మళ్లీ గుర్తించే మూలపాఠంలోని పునరుక్తిని సాహిత్య ప్రాధాన్యంతో సహా నిలిపింది.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: ఒక ఇశ్రాయేలీయుడు
  rationale: ఇది మరొక పురుషుణ్ణి ఇశ్రాయేలీయుడిగా గుర్తించి మొదటి వ్యక్తితో వ్యత్యాసాన్ని చూపుతుంది; తెలుగులో ‘ఒక ఇశ్రాయేలీయుడు’ సహజంగా ఉంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక జాతీయ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ఈ సందర్భంలో ఇది జాతిని సూచించే స్థిరమైన నిబంధనా పదబంధం. మూలంలోని రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన సమూహనామాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. తల్లివైపు గుర్తింపును తెలిపే పునరుక్తి నిలిపివేయబడింది. పితృగుర్తింపులో అర్థాన్ని మార్చకుండా సహజ తెలుగు వాక్యనిర్మాణం ఎంచుకోబడింది; పోరాటం ఎంతవరకు శారీరకమో అనవసరంగా నిర్ణయించలేదు.
