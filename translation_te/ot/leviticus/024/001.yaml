lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ‘అప్పుడు’ క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది; דִּבֵּר ను ఈ వాక్యసందర్భంలో ‘అన్నాడు’ అని ఇవ్వడం తరువాతి ప్రత్యక్ష వాక్యానికి సహజమైన పరిచయం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֶל
  choice: తో
  rationale: דבר + אֶל నిర్మాణం ఎవరిని ఉద్దేశించి మాట్లాడాడో సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో అన్నాడు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ infinitive construct తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. ‘ఇలా అన్నాడు’ హీబ్రూ వాక్యకార్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం. ఉచ్చారణ పునర్నిర్మాణం పూర్తిగా నిశ్చితం కానందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ప్రత్యక్ష వాక్యానికి ముందున్న హీబ్రూ సూత్రబద్ధ నిర్మాణాన్ని ‘ఇలా అన్నాడు’గా సహజీకరించాం.
