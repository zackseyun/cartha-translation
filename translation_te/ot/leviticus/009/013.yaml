id: LEV.9.13
reference: Leviticus 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: te
  text: వారు దహనబలిని, దాని ముక్కలను మరియు తలను, అతని దగ్గరకు తీసుకొచ్చారు; అతడు వాటిని బలిపీఠం మీద పొగగా అర్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: లేవీయకాండంలోని עֹלָה అనే ప్రామాణిక బలిపదానికి ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన, సందర్భోచితమైన సమానార్థకం.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: అతని దగ్గరకు తీసుకొచ్చారు
  rationale: హిఫీల్ రూపం ఇక్కడ బలి భాగాలను అహరోనుకు అందించేలా తీసుకురావడాన్ని సూచిస్తుంది; ఈ ప్రయోగం కర్మకాండ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִנְתָחֶיהָ
  choice: మాంసఖండాలను ఒక్కొక్కటిగా
  rationale: נֶתַח వధించిన జంతువు యొక్క కోసిన భాగాన్ని సూచిస్తుంది; ל ఉపసర్గతో కూడిన బహువచన రూపం వాటిని విడివిడిగా అందించిన భావాన్ని ఇస్తుంది.
- source_word: הָרֹאשׁ
  choice: తలతో సహా
  rationale: మూలంలో తల ఇతర ఖండాలనుంచి ప్రత్యేకంగా పేర్కొనబడింది; తెలుగులో వాక్యసంబంధాన్ని స్పష్టంగా ఉంచేందుకు ‘తో సహా’ ఉపయోగించబడింది.
- source_word: וַיַּקְטֵר
  choice: బలిగా పొగగా పైకి లేచేలా కాల్చాడు
  rationale: కర్మకాండ సందర్భంలో קטר కేవలం కాల్చడమే కాక, బలిపీఠంపై పొగగా అర్పించడాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి ఆ ప్రత్యేక బలిభావం స్పష్టమయ్యేలా అనువదించబడింది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి అర్పించే నిర్మాణాన్ని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదబంధం.
theological_decisions:
- issue: וַיַּקְטֵר యొక్క బలిసంబంధిత భావం
  choice: బలిగా పొగగా పైకి లేచేలా కాల్చాడు
  alternative: కాల్చాడు
  rationale: క్రియలోని కర్మకాండసంబంధమైన ‘పొగగా అర్పించడం’ అనే భావాన్ని వ్యక్తం చేస్తూ, దానిపై అదనపు సిద్ధాంతార్థాన్ని మోపకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేవీయకాండపు కర్మకాండ సందర్భానికి తగిన గంభీరతతో రచించబడింది. మూలంలోని భాగాలవారీగా అందించడం మరియు తలను ప్రత్యేకంగా పేర్కొనడం నిలుపబడ్డాయి.
