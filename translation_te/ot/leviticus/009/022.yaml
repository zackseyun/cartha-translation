id: LEV.9.22
reference: Leviticus 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: te
  text: అప్పుడు అహరోను ప్రజలవైపు తన చేతిని ఎత్తి[a] వారిని ఆశీర్వదించాడు. పాపపరిహార బలి[b], దహనబలి, సమాధాన బలులు[c] అర్పించిన తరువాత అతడు కిందికి దిగివచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన చేతులను ఎత్తి’; హీబ్రూ రూపం ఏకవచనంలో ఉంది, అయితే ఆశీర్వదించే ఈ సంజ్ఞను సాధారణంగా రెండు చేతులు ఎత్తడంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శుద్ధీకరణ బలి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: ఎత్తి
  rationale: נשׂא అనే క్రియ చేయి సందర్భంలో ‘ఎత్తడం’ అనే సహజమైన భావాన్ని ఇస్తుంది; ఆశీర్వాదానికి ముందున్న శారీరక సంజ్ఞను నిలుపుతుంది.
- source_word: יָדוֹ
  choice: తన చేతిని
  rationale: మసొరా పాఠంలోని రూపం ఏకవచనం (‘అతని చేయి’). దాన్ని ప్రధాన పాఠంలో నిలిపి, రెండు చేతులు అనే సాధారణ అవగాహనను పాదటిప్పణిలో సూచించాం.
- source_word: אֶל הָעָם
  choice: ప్రజలవైపు
  rationale: אֶל సూచించే దిశను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְבָרְכֵם
  choice: వారిని ఆశీర్వదించాడు
  rationale: ברך పియేల్ రూపానికి నేరమైన, గౌరవప్రదమైన తెలుగు అనువాదం.
- source_word: וַיֵּרֶד
  choice: కిందికి దిగివచ్చాడు
  rationale: ירד యొక్క దిగడం అనే ప్రాథమిక భావాన్ని నిలుపుతూ, బలిపీఠ ప్రాంతం నుంచి దిగివచ్చిన చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: מֵעֲשֹׂת
  choice: అర్పించిన తరువాత
  rationale: מן తో కూడిన క్రియానామం పూర్తయిన కార్యం నుంచి తదుపరి చర్యకు మారడాన్ని సూచిస్తుంది; బలి సందర్భంలో ‘అర్పించిన తరువాత’ సహజంగా ఉంటుంది.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: లేవీయకాండంలోని సాంకేతిక బలి పదంగా חטאתను గుర్తించదగిన రీతిలో అందిస్తుంది; శుద్ధీకరణ కార్యభావం ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עלה బలి వర్గానికి తెలుగులో స్థిరంగా, సంక్షిప్తంగా అర్థమయ్యే సాంకేతిక పదం.
- source_word: הַשְּׁלָמִים
  choice: సమాధాన బలులు
  rationale: שׁלמיםకు సంప్రదాయంగా గుర్తించదగిన బలి పేరు; సహవాసం లేదా క్షేమం అనే భావ ఛాయలను పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: బలి సంబంధ సాంకేతిక పదాల అనువాదం
  choice: ప్రధాన పాఠంలో ‘పాపపరిహార బలి,’ ‘దహనబలి,’ ‘సమాధాన బలులు’ వాడటం
  alternative: ‘శుద్ధీకరణ బలి,’ ‘సంపూర్ణ దహనబలి,’ ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు’
  rationale: ఇవి లేవీయకాండంలోని ప్రత్యేక బలి వర్గాలు. ప్రధాన పదాలు గుర్తించదగినవిగా, పరస్పర సూచనలకు అనుకూలంగా ఉంటాయి; ప్రత్యామ్నాయాలు ఆయా బలుల కార్యం లేదా భావ ఛాయను ముందుకు తెస్తాయి కాబట్టి పాదటిప్పణుల్లో నిలుపబడ్డాయి.
- issue: יָדוֹ యొక్క వచనం
  choice: హీబ్రూ ఏకవచనాన్ని ‘తన చేతిని’గా ప్రధాన పాఠంలో నిలుపటం
  alternative: ఆశీర్వాద సంజ్ఞను సమూహార్థంగా గ్రహించి ‘తన చేతులను’ అని అనువదించడం
  rationale: మూల రూపం స్పష్టంగా ఏకవచనం; ప్రాచీన అనువాదాలు మరియు యాజక ఆశీర్వాద సంజ్ఞ ఆధారంగా బహువచన అవగాహన సాధ్యమైనా, దానిని నిశ్శబ్దంగా ప్రధాన పాఠంలో ప్రవేశపెట్టకుండా పాదటిప్పణిలో నమోదు చేయడం మూలాధారానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. లేవీయకాండంలోని బలి వర్గాలకు గుర్తించదగిన సాంకేతిక పదాలు ప్రధాన పాఠంలో ఉంచి, మూలంలోని నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో భద్రపరచాం.
