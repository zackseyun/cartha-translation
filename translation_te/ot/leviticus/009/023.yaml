id: LEV.9.23
reference: Leviticus 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: te
  text: మోషే, అహరోను సమావేశ గుడారంలోకి వెళ్లారు. వారు బయటికి వచ్చి ప్రజలను ఆశీర్వదించారు. అప్పుడు యహ్వే మహిమ ప్రజలందరికీ ప్రత్యక్షమైంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే ఆరాధనా గుడారాన్ని సూచించే స్థిరమైన, సహజమైన తెలుగు పదబంధం.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: లోపలికి వెళ్లారు ... బయటికి వచ్చి
  rationale: మోషే, అహరోను ఇద్దరినీ కర్తలుగా గ్రహిస్తూ, చర్యల వరుసను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיְבָרֲכוּ
  choice: ఆశీర్వదించారు
  rationale: ఆశీర్వాద రూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా హీబ్రూ క్రియకు నేరమైన సమానార్థకం.
- source_word: הָעָם / כָּל הָעָם
  choice: ప్రజలను / ప్రజలందరికీ
  rationale: సమకూడిన నిబంధన సమాజాన్ని సహజంగా సూచిస్తూ, రెండవ ప్రయోగంలోని כָּל భావాన్ని ‘అందరికీ’తో స్పష్టంగా నిలుపుతుంది.
- source_word: כְבוֹד יְהוָה
  choice: యహ్వే మహిమ
  rationale: כָּבוֹד యొక్క దైవ ప్రత్యక్షత భావాన్ని ‘మహిమ’తోనూ, יְהוָה అనే నిబంధన నామాన్ని ‘యహ్వే’తోనూ కాపాడుతుంది.
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమైంది
  rationale: నిఫాల్ రూపంలోని కనబడే దైవ ప్రత్యక్షతను సందర్భోచితంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל כָּל הָעָם
  choice: ప్రజలందరికీ
  rationale: ప్రత్యక్షత ప్రజలందరికీ కనబడిందనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- issue: క్లాజుల మధ్య కాలక్రమ సంబంధం
  choice: అప్పుడు
  alternative: మరియు
  rationale: హీబ్రూ కథన వరుసలో తదుపరి సంఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది; కారణ సంబంధాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆరాధనా సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ చర్యల క్రమం నిలుపబడింది; మూలంలో లేని వివరణలు జోడించబడలేదు.
