id: LEV.9.3
reference: Leviticus 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר קְח֤וּ שְׂעִיר עִזִּים֙ לְ/חַטָּ֔את וְ/עֵ֨גֶל וָ/כֶ֧בֶשׂ בְּנֵי שָׁנָ֛ה תְּמִימִ֖ם לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమారులతో ఇలా చెప్పాలి: ‘పాపబలిగా[a] ఒక మగ మేకను, దహనబలిగా ఏడాది వయసున్న, లోపంలేని ఒక దూడను, ఒక గొర్రెపిల్లను తీసుకోండి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలిగా’; యాజక బలుల సందర్భంలో హీబ్రూ חַטָּאת పదానికి ఈ అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: సూచన ఎవరికి చెప్పాలో సహజమైన తెలుగులో తెలియజేస్తూ, בְּנֵי అనే పురుష బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: నీవు ఇలా చెప్పాలి
  rationale: ద్వితీయ పురుష ఏకవచన ఆదేశ భావాన్ని, తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹר భావాన్ని సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: קְחוּ
  choice: తీసుకోండి
  rationale: ఇది సమూహాన్ని ఉద్దేశించిన బహువచన ఆజ్ఞ; గమ్యస్థాన భావాన్ని అనవసరంగా చేర్చకుండా לקח యొక్క సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: שְׂעִיר עִזִּים
  choice: ఒక మగ మేకను
  rationale: బలికి సంబంధించిన లింగ నిర్దేశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: యాజక బలి సందర్భంలో ఇది పాపం అనే భావనకన్నా ఒక నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది; తెలుగులో సుపరిచితమైన పదబంధాన్ని ఎంచుకుంది.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: ఒక దూడను, ఒక గొర్రెపిల్లను
  rationale: עֵגֶל యొక్క ప్రాథమిక అర్థాన్ని ‘దూడ’గా, כֶבֶשׂ యొక్క ప్రత్యేక అర్థాన్ని ‘గొర్రెపిల్ల’గా అందిస్తుంది.
- source_word: בְּנֵי שָׁנָה
  choice: ఒక్కొక్కటి ఏడాది వయసుగల
  rationale: ఈ బహువచన పదబంధం దూడకూ గొర్రెపిల్లకూ వర్తిస్తుందనే పంపిణీ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: תְּמִימִם
  choice: లోపంలేని
  rationale: బలి జంతువులకు శారీరక దోషం లేకపోవడాన్ని సూచించే సందర్భోచిత అర్థాన్ని ఇస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలిగా
  rationale: మొత్తంగా దహించబడే బలి వర్గానికి తెలుగులో స్థిరపడిన, స్పష్టమైన పదాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: కార్పొరేట్ సమూహాన్ని సూచించినప్పటికీ, మూలంలోని పురుష బహువచన నిర్మాణాన్ని పారదర్శకంగా ఉంచింది.
- issue: యాజక బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే సంప్రదాయ పదాన్ని ఉంచి, శుద్ధీకరణను నొక్కిచెప్పే సముచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఆదేశ భావం, బలి జంతువుల వివరాలు, రెండు జంతువులకూ వర్తించే వయస్సు మరియు లోపరాహిత్య నిర్దేశం స్పష్టంగా నిలుపబడ్డాయి.
