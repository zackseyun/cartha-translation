id: LEV.9.21
reference: Leviticus 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: te
  text: అహరోను రొమ్ము భాగాలను, కుడి తొడను యాహ్వే సన్నిధిలో ఊపే అర్పణగా సమర్పించాడు; మోషే ఆజ్ఞాపించినట్లే చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: రొమ్ముభాగాలను
  rationale: బలుల సందర్భంలో חָזֶה జంతువు రొమ్ములోని నియమిత భాగాన్ని సూచిస్తుంది. బహువచనాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అవయవాలుగా అపార్థం కాకుండా ‘రొమ్ముభాగాలు’ అని అనువదించాం.
- source_word: שׁוֹק הַיָּמִין
  choice: కుడి తొడను
  rationale: שׁוֹק కాలు లేదా తొడ భాగాన్ని సూచిస్తుంది; బలి నియమాల సందర్భంలో ‘కుడి తొడ’ సహజమైన, తగినంత నిర్దిష్టమైన అనువాదం.
- source_word: הֵנִיף
  choice: ఊపాడు
  rationale: נוּף హిఫీల్ రూపం యెహోవా సన్నిధిలో బలి భాగాన్ని ఆచారబద్ధంగా ఊపి సమర్పించే చర్యను సూచిస్తుంది. ‘ఊపాడు’ మూలంలోని చర్యను నేరుగా నిలుపుతుంది.
- source_word: תְּנוּפָה
  choice: ప్రతిష్ఠార్పణగా
  rationale: ఇది బలి భాగాన్ని యెహోవా సన్నిధిలో ఊపి సమర్పించే ప్రత్యేక ఆచారానికి వాడే సాంకేతిక పదం. ‘ప్రతిష్ఠార్పణ’ ఆ సమర్పణ స్వభావాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది; క్రియలో ఊపే చర్యను స్పష్టంగా ఉంచాం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ముందు/సన్నిధిలో.’ ఆరాధనా సందర్భంలో ‘సన్నిధిలో’ సహజంగా ఉంది; יְהוָה అనే నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: మోషే ఆజ్ఞాపించినట్లే
  rationale: అహరోను చేసినది మోషే ముందుగా ఇచ్చిన ఆజ్ఞకు సరిగ్గా అనుగుణంగా ఉందని ఈ పదబంధం తెలుపుతుంది.
- source_word: וְאֵת ... וְאֵת
  choice: రొమ్ముభాగాలను, కుడి తొడను
  rationale: పునరుక్త ప్రత్యక్ష కర్మ సూచకాలు రెండు కర్మలను సమన్వయపరుస్తాయి; తెలుగులో విభక్తి ప్రత్యయాలతో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా వ్యక్తినామంగా నిలిపాం. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: תְּנוּפָה అనే ఆచారపదం
  choice: ప్రతిష్ఠార్పణగా
  alternative: అల్లాడించే అర్పణగా
  rationale: పదం ప్రత్యేకమైన ఆచార సమర్పణను సూచిస్తుంది; క్రియలో ‘ఊపాడు’ అని స్పష్టంగా చెప్పడం వల్ల నామవాచకంలో అసహజమైన పునరుక్తి లేకుండా ఆచారార్థం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి ఆచారానికి సంబంధించిన సాంకేతికతను నిలుపుతూ, ‘రొమ్ములు’ వల్ల కలగగల అనవసర శరీరార్థాన్ని నివారించేందుకు ‘రొమ్ముభాగాలు’ వాడాం. మూలంలోని క్రియ–నామ పునరుక్తిని ‘ప్రతిష్ఠార్పణగా ఊపాడు’ ద్వారా సహజంగా వ్యక్తం చేశాం.
