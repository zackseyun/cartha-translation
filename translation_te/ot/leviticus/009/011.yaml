  edition: WLC
  text: וְ/אֶת הַ/בָּשָׂ֖ר וְ/אֶת הָ/ע֑וֹר שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: te
  text: కానీ మాంసాన్ని, చర్మాన్ని అతడు శిబిరం వెలుపల అగ్నితో కాల్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాంసాన్ని, చర్మాన్ని అతడు శిబిరం వెలుపల అగ్నిలో కాల్చాడు.”
    reason: בָּאֵשׁ అనే పదబంధాన్ని సాధనార్థకంగా ‘అగ్నితో’ అని లేదా స్థానార్థకంగా ‘అగ్నిలో’ అని అనువదించవచ్చు; అలాగే וְ ను సందర్భానుసారం ‘కానీ’ లేదా ‘మరియు’ అని చూపవచ్చు.
lexical_decisions:
- source_word: וְ/אֶת
  choice: కానీ ...ను
  rationale: וְ వరుస చర్యను కొనసాగిస్తున్నప్పటికీ, ముందటి వచనంలో బలిపీఠంపై కాల్చిన భాగాలకు, ఇక్కడ శిబిరం వెలుపల కాల్చిన భాగాలకు మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో ‘కానీ’ సహజంగా సూచిస్తుంది; אֵת ప్రత్యక్ష కర్మ సూచికగా విడిగా అనువదించబడదు.
- source_word: הַ/בָּשָׂר
  choice: మాంసాన్ని
  rationale: בָּשָׂר జంతువు యొక్క మాంసాన్ని సూచిస్తుంది; బలి సందర్భంలో ‘మాంసం’ సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: הָ/עוֹר
  choice: చర్మాన్ని
  rationale: עוֹר జంతువు చర్మాన్ని సూచిస్తుంది. ‘చర్మం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: שָׂרַף
  choice: కాల్చాడు
  rationale: ఈ క్రియ యొక్క సరళ అర్థం ‘కాల్చడం’; పూర్తిగా భస్మం చేశాడనే అదనపు భావాన్ని చేర్చకుండా చర్యను తెలియజేస్తుంది.
- source_word: בָּ/אֵשׁ
  choice: అగ్నితో
  rationale: בְּ ఇక్కడ సాధనార్థకంగా గ్రహించవచ్చు; ‘అగ్నితో’ మూల నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: ఈ పదబంధం ఇశ్రాయేలీయుల శిబిరానికి బయట ఉన్న స్థలాన్ని సూచిస్తుంది; ‘శిబిరం వెలుపల’ సంక్షిప్తంగా, సహజంగా ఉండి ఆచార సంబంధిత భౌగోళిక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: బలి సందర్భంలోని ఆచార సంబంధిత నిర్మూలన చర్య
  choice: మాంసాన్ని, చర్మాన్ని శిబిరం వెలుపల కాల్చిన చర్యగా యథార్థంగా అనువదించడం
  alternative: తరువాతి బైబిలు సంబంధాలను ముందుకు తెచ్చే సూచనాత్మక లేదా ప్రతిరూపాత్మక అనువాదం
  rationale: వచనం యాజక సంబంధిత బలి విధానాన్ని వివరిస్తుంది. హీబ్రూ పాఠ్యంలో లేని తరువాతి వేదాంత సూచనలను అనువాదంలో చేర్చకుండా, ఆచార చర్యను స్పష్టంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. బలి ఆచారానికి సంబంధించిన పదజాలాన్ని స్పష్టంగా ఉంచి, మూలంలోని సంక్షిప్త క్రియాక్రమాన్ని కాపాడాం.
