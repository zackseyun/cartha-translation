translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బలిసంబంధ పదజాలం వాడబడింది. హెబ్రీ వాక్యంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ‘పొగగా పైకి లేచేలా దహనం చేశాడు’ ద్వారా קטר యొక్క ఆచారపరమైన సూక్ష్మార్థం స్పష్టంగా చేయబడింది.
