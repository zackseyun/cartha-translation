  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: te
  text: అతడు లోపలి అవయవాలను, కాళ్ల దిగువ భాగాలను కడిగి, వాటిని బలిపీఠం మీద ఉన్న దహనబలి పైన పొగగా అర్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: కడిగి
  rationale: רחץ బలిసంబంధ సందర్భంలో నీటితో కడగడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కడిగి’ సహజమైన, స్పష్టమైన పదం.
- source_word: הַקֶּרֶב
  choice: లోపలి అవయవాలను
  rationale: קֶרֶב సాధారణంగా ‘లోపలి భాగం’ అని అర్థమైనా, ఇక్కడ బలిపశువు అంతర్గత అవయవాలను సూచిస్తుంది. ‘లోపలి అవయవాలు’ సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַכְּרָעָיִם
  choice: కాలి కింది భాగాలను
  rationale: כְּרָעַיִם జంతువు కాళ్లను, ముఖ్యంగా కింది భాగాలను సూచిస్తుంది; ‘కాలి కింది భాగాలు’ శరీర నిర్మాణ సంబంధిత ప్రత్యేకతను నిలుపుతుంది.
- source_word: וַיַּקְטֵר
  choice: పొగగా పైకి లేచేలా దహనం చేశాడు
  rationale: హిఫీల్ రూపంలోని קטר బలిపీఠం మీద అర్పణను కేవలం కాల్చడం కాక, పొగగా పైకి వెళ్లేలా దహనం చేయడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ ఆరాధనా భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל הָעֹלָה
  choice: దహనబలి పైన
  rationale: עַל ఇక్కడ బలిపీఠం మీద ఇప్పటికే ఉన్న దహనబలి పైన ఉంచడాన్ని సూచిస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే స్థిరమైన బలిసంబంధ పదం; ‘దహనబలి’ తెలుగులో సుపరిచితమైన, సంక్షిప్తమైన సమానం.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: מִזְבֵּחַ అంటే బలిపీఠం; దిశాసూచక అంత్యాక్షరం మరియు వాక్యనిర్మాణాన్ని తెలుగులో ‘బలిపీఠం మీద’ సహజంగా వ్యక్తపరుస్తుంది.
