  source_fidelity: 'వాక్యం హెబ్రీ మూలానికి విశ్వసనీయంగా ఉంది: అహరోను తన పాపపరిహార బలిని, దహనబలిని అర్పించి తన కొరకును ప్రజల కొరకును ప్రాయశ్చిత్తం చేయాలి; తరువాత ప్రజల అర్పణను అర్పించి వారి కొరకు ప్రాయశ్చిత్తం చేయాలి. అయితే קְרַב (‘సమీపించు/దగ్గరకు రా’)కు ‘దగ్గరికి వెళ్లి’ అనడం ‘వెళ్ళు’ అనే అదనపు దిశాభావాన్ని ఇస్తుంది. ‘దగ్గరకు వచ్చి’ మూల ఆహ్వానానికి మరింత సమీపంగా ఉంటుంది.'
