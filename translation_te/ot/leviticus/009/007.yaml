source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: te
  text: 'మోషే అహరోనుతో ఇలా అన్నాడు: “బలిపీఠం దగ్గరకు వచ్చి, నీ పాపపరిహార బలిని[a], నీ దహనబలిని అర్పించి, నీ కోసం, ప్రజల కోసం ప్రాయశ్చిత్తం చేయి. ఆ తర్వాత ప్రజల అర్పణను అర్పించి, యెహోవా ఆజ్ఞాపించినట్టే వారి కోసం ప్రాయశ్చిత్తం చేయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ శుద్ధీకరణ బలిని.” హీబ్రూ పదం חַטָּאת పాపపరిహార బలిని సూచించగలదు; కొన్ని సందర్భాల్లో అపవిత్రత నుంచి శుద్ధీకరణపై దృష్టి పెడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరికి వెళ్లి
  rationale: ఆరాధనా సందర్భంలో קרב అంటే సమీపించడం. సహజమైన ఆధునిక తెలుగులో అహరోనుకు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞను ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַעֲשֵׂה
  choice: అర్పించి / అర్పించు
  rationale: పదశః ‘చేయి’ అయినా, బలులను కర్మవస్తువులుగా తీసుకున్న ఈ సందర్భంలో ‘అర్పించు’ అనేది సహజమైన ఆరాధనా ప్రయోగం.
- source_word: חַטָּאתְךָ
  choice: నీ పాపపరిహార బలి
  rationale: חַטָּאת ఇక్కడ ఒక బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సుపరిచితమైన అర్థాన్ని ఇస్తుంది; శుద్ధీకరణను నొక్కిచెప్పే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֹלָתֶךָ
  choice: నీ దహనబలి
  rationale: ఆరాధనా వాడుకలో עֹלָה పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది; ‘దహనబలి’ ఖచ్చితమైన ప్రామాణిక పదం.
- source_word: וְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయి
  rationale: యాజక బలి సందర్భంలోని כפר యొక్క విస్తృత పరిహార, శుద్ధీకరణ భావాన్ని ఒకే సిద్ధాంతానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: నీ కోసం, ప్రజల కోసం
  rationale: בְּעַד సూచించే ప్రయోజనార్థక, ప్రతినిధిత్వ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: קָרְבַּן הָעָם
  choice: ప్రజల అర్పణ
  rationale: קָרְבָּן సాధారణంగా దేవుని సమక్షానికి తీసుకువచ్చే అర్పణను సూచిస్తుంది; నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: యెహోవా ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר ఆజ్ఞకు అనుగుణంగా చేయడాన్ని నొక్కిచెబుతుంది. יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపానికి సంబంధించిన బలినీ, అపవిత్రత నుంచి శుద్ధీకరణను నొక్కిచెప్పే బలినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సుపరిచితమైన పదాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సంరక్షించాం.
- issue: כפר అనువాదం
  choice: ప్రాయశ్చిత్తం చేయి
  alternative: పరిహారం చేయి / శుద్ధి చేయి
  rationale: మూల క్రియలోని బలి సంబంధమైన పరిహార, శుద్ధీకరణ బలాన్ని నిలుపుతూ, ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బలి సంబంధ సాంకేతిక పదాలను స్పష్టంగా ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దాం.
