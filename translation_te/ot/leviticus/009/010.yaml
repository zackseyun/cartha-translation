base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: te
  text: పాపపరిహార బలిలోని[a] కొవ్వును, మూత్రపిండాలను, కాలేయపు ఉపాంగాన్ని అతడు బలిపీఠంపై పొగగా అర్పించాడు; యెహోవా మోషేకు ఆజ్ఞాపించినట్టే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ పదం పాపంతో వ్యవహరించడమే కాక అపవిత్రతను తొలగించడంలో ఈ బలి చేసే పనిని కూడా నొక్కి చెప్పగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలి సందర్భంలో అర్పణకు ప్రత్యేకించిన కొవ్వు భాగాలను సూచిస్తుంది; ప్రధాన పాఠంలో సంక్షిప్తమైన ప్రత్యక్ష పదాన్ని ఉంచాం.
- source_word: כְּלָיֹת
  choice: మూత్రపిండాలు
  rationale: మూలంలోని స్పష్టమైన శరీరావయవ సూచనను యథాతథంగా కాపాడుతుంది.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: కాలేయపు ఉపాంగం
  rationale: కాలేయానికి అనుబంధంగా తొలగించే భాగాన్ని సూచించే ఈ కొంత అనిశ్చిత శరీర నిర్మాణ పదబంధానికి ‘ఉపాంగం’ సన్నిహితమైన, అతిగా నిర్దిష్టీకరించని అనువాదం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: తెలుగులో సుపరిచితమైన బలి వర్గపదంగా ఉండి, పాపంతో సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; శుద్ధీకరణ కార్యభావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הִקְטִיר
  choice: పొగగా పైకి లేచేలా దహనం చేశాడు
  rationale: సాధారణంగా కాల్చడమే కాక, బలిపీఠంపై అర్పణను పొగగా పైకి లేపే ఆచారక్రియను సూచించే హిఫీల్ రూప భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశార్థక ప్రత్యయం ఉన్నప్పటికీ, הִקְטִירతో కలిసి బలిపీఠంపై దహనం చేయడమే సందర్భానుగుణమైన సహజ తెలుగు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: యాజక బలి నియమాలలో חַטָּאת అర్థం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ పదం పాపంతో వ్యవహరించే బలినీ, అపవిత్రతను తొలగించే దాని శుద్ధీకరణ కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సుపరిచిత వర్గపదాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని వరుస జాబితాను నిలిపి, చివరి ఉపవాక్యాన్ని తెలుగులో స్పష్టత కోసం స్వతంత్ర వాక్యంగా ఇచ్చాం. మూలంలో కర్త స్పష్టంగా పేరుతో లేకపోవడంతో ‘అతడు’ అని మాత్రమే ఉంచాం.
