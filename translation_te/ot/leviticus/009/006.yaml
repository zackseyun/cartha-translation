id: LEV.9.6
reference: Leviticus 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “మీరు చేయమని యాహ్వే ఆజ్ఞాపించినది ఇదే. అప్పుడు యాహ్వే మహిమ మీకు ప్రత్యక్షమవుతుంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే మహిమ మీకు ప్రత్యక్షమయ్యేలా.”
    reason: వְיֵרָא అనే చివరి వాక్యభాగాన్ని ఫలిత వాగ్దానంగా కాక ఉద్దేశాన్ని తెలిపేదిగా కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం ‘ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: זֶה הַדָּבָר
  choice: ఇదే
  rationale: అక్షరార్థంగా ‘ఇదే ఆ విషయం/మాట.’ సందర్భంలో దేవుడు ఆజ్ఞాపించిన కార్యాన్ని సూచించడానికి ‘ఇదే’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించినది
  rationale: צוה అధికారపూర్వకమైన ఆజ్ఞను సూచిస్తుంది; హీబ్రూ పరిపూర్ణ క్రియ భావాన్ని తెలుగు సంబంధ క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: תַּעֲשׂוּ
  choice: మీరు చేయాలని
  rationale: రెండవ పురుష బహువచనాన్ని ‘మీరు’తో స్పష్టంగా చూపుతూ, ఆజ్ఞాపించిన కార్యవిషయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיֵרָא
  choice: అప్పుడు ... ప్రత్యక్షమవుతుంది
  rationale: నిఫాల్ అసంపూర్ణ రూపం ఆజ్ఞను నెరవేర్చిన తరువాత సంభవించే ప్రత్యక్షతను సూచించగలదు. ‘అప్పుడు’ దాని ఫలిత/క్రమ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲלֵיכֶם
  choice: మీకు
  rationale: ప్రత్యక్షమగుట అనే క్రియతో אֶל ను తెలుగులో సహజంగా ‘మీకు’ అని అనువదించాం.
- source_word: כְּבוֹד יְהוָה
  choice: యెహోవా మహిమ
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, కనిపించే దైవ మహాత్మ్య భావాన్ని ‘మహిమ’తో నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: చివరి వాక్యభాగం וְיֵרָא యొక్క సంబంధం
  choice: 'ఫలిత/క్రమ భావం: ‘అప్పుడు ... ప్రత్యక్షమవుతుంది’'
  alternative: 'ఉద్దేశ భావం: ‘... ప్రత్యక్షమయ్యేలా’'
  rationale: హీబ్రూ సంధి మరియు అసంపూర్ణ క్రియ ఆజ్ఞ అనంతర ఫలితమైన వాగ్దానంగా గానీ, ఉద్దేశంగా గానీ అర్థమవవచ్చు. ప్రధాన పాఠ్యంలో క్రమ/ఫలిత భావాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ఆరాధనా సందర్భానికి తగిన ‘ఆజ్ఞాపించినది,’ ‘మహిమ,’ ‘ప్రత్యక్షమవుతుంది’ వంటి పరిచితమైన పదాలను నిలిపి, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం.
