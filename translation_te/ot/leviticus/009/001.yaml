translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడింది. మూలంలోని అంశాల క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, హీబ్రూ కథన సూత్రాన్ని తెలుగులో కృత్రిమంగా అనిపించే పదబంధంతో అనువదించలేదు. పాదసూచిక సూచిక [a] ప్రధాన వచనంలో ఉంచబడింది.
