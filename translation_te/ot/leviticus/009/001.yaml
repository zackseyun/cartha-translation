    text: లేదా, “పిలిపించాడు.” సందర్భంలో హీబ్రూ క్రియకు ఈ అర్థమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[ప్రత్యేక పదంగా అనువదించకుండా కథన వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది]'
  rationale: హీబ్రూ కథనాన్ని ముందుకు నడిపే וַיְהִי భావం తెలుగులో ‘ఎనిమిదవ రోజున’ అని నేరుగా వాక్యాన్ని ప్రారంభించడం ద్వారా సహజంగా వ్యక్తమవుతుంది; ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చడం ఆధునిక తెలుగులో అనవసరంగా భారంగా ఉంటుంది.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: మూలంలోని కాలసూచనను నేరుగా ఉంచుతుంది; అది ఏడు రోజుల ప్రతిష్ఠాపన కాలం తరువాతి రోజు అనే సందర్భ వివరణను వాక్యంలో అదనంగా చేర్చదు.
- source_word: קָרָא
  choice: పిలిచాడు
  rationale: క్రియకు ‘పిలిచాడు’ లేదా ‘రమ్మని పిలిపించాడు’ అనే భావాలు సందర్భంలో సాధ్యమైనవి. ‘పిలిచాడు’ నేరమైన, సహజమైన తెలుగు రూపం; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְאַהֲרֹן
  choice: అహరోనును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపంలో ఇచ్చి, קרא క్రియకు తగిన కర్మవిభక్తిని ఉపయోగించింది.
- source_word: וּלְבָנָיו
  choice: అతని కుమారులను
  rationale: యాజక సేవ సందర్భంలో בָּנָיו అహరోను కుమారులనే సూచిస్తుంది; ‘పిల్లలు’ కంటే ‘కుమారులు’ స్పష్టమైనది.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలను
  rationale: ఇది ఇశ్రాయేలు సమాజంలోని గుర్తింపు పొందిన నాయకులు లేదా ప్రతినిధులను సూచించే సహజమైన తెలుగు పదబంధం.
