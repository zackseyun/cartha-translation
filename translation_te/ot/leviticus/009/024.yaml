source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: te
  text: యాహ్వే సన్నిధి నుండి[a] అగ్ని వెలువడి, బలిపీఠం మీద ఉన్న దహనబలిని, కొవ్వు భాగాలను దహించివేసింది. ప్రజలందరూ అది చూసి ఆనందంతో కేకలు వేశారు[b]; ముఖాలపై పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ఎదుటి నుండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఉల్లాసంగా జయధ్వని చేశారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: అగ్ని బయలుదేరి
  rationale: יצא అగ్ని యాహ్వే సన్నిధి నుండి బయటికి రావడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ దృశ్యమయమైన కథన క్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధి నుండి
  rationale: לִפְנֵי అక్షరార్థంగా ‘ఎదుట/ముందు’ అయినా, ఇక్కడ అగ్ని దేవుని సన్నిధి నుండి రావడాన్ని సూచిస్తుంది. ‘సన్నిధి నుండి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూల భావాన్ని కాపాడుతుంది.
- source_word: וַתֹּאכַל
  choice: దహించివేసింది
  rationale: క్రియ అక్షరార్థంగా ‘తినివేసింది’; అగ్ని బలిని పూర్తిగా కాల్చివేసిన సందర్భంలో ‘దహించివేసింది’ స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עֹלָה పూర్తిగా అగ్నికి అర్పించే బలిని సూచించే స్థిరమైన బలిపద్ధతి పదం; ‘దహనబలి’ ఆ ప్రత్యేకతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַחֲלָבִים
  choice: కొవ్వు భాగాలు
  rationale: బలిలో దేవునికి అర్పించడానికి ప్రత్యేకంగా వేరు చేసిన కొవ్వు ముక్కలను ఈ బహువచనం సూచిస్తుంది; కేవలం ‘కొవ్వు’ కంటే ‘కొవ్వు భాగాలు’ ఆచార సంబంధిత నిర్దిష్టతను నిలుపుతుంది.
- source_word: וַיָּרֹנּוּ
  choice: ఆనందంతో కేకలు వేశారు
  rationale: רנן ఉల్లాసంతో వెలువడే గంభీరమైన కేక లేదా జయధ్వనిని సూచించగలదు. ఈ సందర్భంలో సహజస్ఫూర్తితో వ్యక్తమైన సంతోషాన్ని ఈ అనువాదం తెలియజేస్తుంది; అధికారిక గానం అనే భావాన్ని బలవంతంగా చేర్చదు.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: తమ ముఖాలు నేలకు ఆనించి పడిపోయారు
  rationale: హీబ్రూ వాక్యం శరీరంతో నేలపై బోర్లాపడే స్పష్టమైన దృశ్యాన్ని ఇస్తుంది. ఈ రూపం ‘సాష్టాంగపడ్డారు’ అనే వ్యాఖ్యాత్మక పదం కంటే మూలంలోని శరీర భంగిమను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామమైన יהוה ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామాన్ని కాపాడుతుంది.
- issue: ప్రజలు ముఖాలు నేలకు ఆనించి పడిపోవడం యొక్క భావం
  choice: శరీర భంగిమను మాత్రమే స్పష్టంగా అనువదించడం
  alternative: వారు ఆరాధించారు / సాష్టాంగ నమస్కారం చేశారు
  rationale: ఈ చర్య భక్తి, భయం లేదా ఆరాధనను సూచించవచ్చు; అయితే క్రియ స్వయంగా ఉద్దేశాన్ని పేరుపెట్టి చెప్పదు. కాబట్టి వచనంలోని దృశ్యాన్ని నిలిపి, దాని ధార్మిక ఉద్దేశాన్ని పాఠకుడే సందర్భం ద్వారా గ్రహించేలా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. బలిపద్ధతికి సంబంధించిన ‘దహనబలి’, ‘కొవ్వు భాగాలు’ అనే పదాలను నిర్దిష్టత కోసం ఉంచాం; చివరి చర్యలోని స్పష్టమైన శరీర దృశ్యాన్ని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
