  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: te
  text: తరువాత అతడు ప్రజల అర్పణను సమర్పించాడు. ప్రజల కోసం ఉద్దేశించిన పాపపరిహార బలి మేకపోతును తీసుకొని దాన్ని వధించాడు; మొదటి బలి విషయంలో చేసినట్లే, దానిని పాపపరిహార బలిగా అర్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానితో శుద్ధి క్రియ చేశాడు.” ఇక్కడి హీబ్రూ క్రియ పాపపరిహార బలి విధిని నిర్వహించడం అనే అర్థంతో పాటు, యాజక ఆచార సందర్భాల్లో శుద్ధి చేయడం లేదా అపవిత్రతను తొలగించడం అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: సమర్పించాడు
  rationale: హిఫీల్ రూపంలోని קרב బలి సందర్భంలో అర్పణను దేవుని సన్నిధికి తీసుకురావడం లేదా సమర్పించడం అనే అర్థం ఇస్తుంది. ‘సమర్పించాడు’ సహజమైన ఆధునిక తెలుగు; మొత్తం బలిక్రియను అతిగా నిర్దిష్టం చేయదు.
- source_word: קָרְבַּן הָעָם
  choice: ప్రజల అర్పణ
  rationale: קָרְבָּן అనేది సమీపానికి తీసుకువచ్చే అర్పణకు సాధారణ బలి పదం. నిర్మాణ సంబంధాన్ని ‘ప్రజల అర్పణ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂעִיר הַחַטָּאת
  choice: పాపపరిహార బలి మేకపోతు
  rationale: שָׂעִיר మగ మేకను సూచిస్తుంది; ఈ యాజక బలి సందర్భంలో חַטָּאת అమూర్తమైన ‘పాపం’ కంటే పాపానికి సంబంధించిన బలిని సూచిస్తుంది. ‘మేకపోతు’ లింగాన్ని, ‘పాపపరిహార బలి’ ఆచారపరమైన భావాన్ని నిలుపుతాయి.
- source_word: אֲשֶׁר לָעָם
  choice: ప్రజల కోసం ఉద్దేశించిన
  rationale: ఇక్కడ ל కేవలం యాజమాన్యాన్ని కాక ప్రజల తరఫున లేదా వారి కోసం నియమించబడిన బలిపశువును సూచిస్తుంది.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: దాన్ని వధించాడు
  rationale: שׁחט బలిపశువును ఆచారపూర్వకంగా వధించడానికి వాడే సాధారణ క్రియ. ‘వధించాడు’ సాధారణ ‘చంపాడు’ కంటే బలి సందర్భానికి తగిన గౌరవప్రద పదం.
- source_word: וַיְחַטְּאֵהוּ
  choice: దానిని పాపపరిహార బలిగా అర్పించాడు
  rationale: חטא పీయేల్ రూపం ఇక్కడ ఆ మేకతో పాపపరిహార బలి క్రియను నిర్వహించడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం మేకనే శుద్ధి చేశాడనే అపార్థాన్ని నివారిస్తూ ఆచారపరమైన కార్యాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంచబడింది.
- source_word: כָּרִאשׁוֹן
  choice: మొదటి బలి విషయంలో చేసినట్లే
  rationale: ఈ మాట అధ్యాయంలో ఇంతకుముందు అర్పించిన పాపపరిహార బలిని వెనక్కి సూచిస్తూ అదే విధానాన్ని అనుసరించాడని తెలియజేస్తుంది. ‘మొదటి బలి’ అనేది తెలుగులో సూచనను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת అర్థం
  choice: పాపపరిహార బలి
  alternative: పాపం
  rationale: లేవీయకాండము 9లో సందర్భం స్పష్టంగా బలుల గురించి ఉంది; ఇక్కడ חַטָּאת బలినే సూచిస్తుంది. అమూర్తమైన ‘పాపం’ అని అనువదిస్తే ఆచారపరమైన పదార్థం మరుగుపడుతుంది.
- issue: וַיְחַטְּאֵהוּ యొక్క ఆచారపరమైన భావం
  choice: దానిని పాపపరిహార బలిగా అర్పించాడు
  alternative: దానిని శుద్ధి చేశాడు / దానితో శుద్ధి క్రియ చేశాడు
  rationale: హీబ్రూ క్రియకు పాపపరిహార బలి విధిని నిర్వహించడం, లేదా యాజక ఆచార సందర్భంలో శుద్ధి చేయడం/అపవిత్రతను తొలగించడం అనే భావ పరిధి ఉంది. ప్రధాన పాఠం పశువుతో చేసిన బలిక్రియను సహజంగా తెలియజేస్తుంది; ‘ప్రాయశ్చిత్తం చేశాడు’ వంటి మరింత నిర్దిష్టమైన సిద్ధాంత పదాన్ని మూలంలో లేనంతగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బలి-ఆచార శైలిని వాడాం. ‘మేకపోతు’ మూలంలోని మగ మేక భావాన్ని నిలుపుతుంది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో సహజ పఠనానికి రెండు వాక్యాలుగా విభజించి, కార్యాల క్రమాన్ని యథాతథంగా ఉంచాం.
