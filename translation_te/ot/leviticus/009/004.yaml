id: LEV.9.4
reference: Leviticus 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: te
  text: యాహ్వే సన్నిధిలో సమాధాన బలుల కొరకు బలి అర్పించడానికి ఒక ఎద్దును, ఒక పొట్టేలును తీసుకురండి. నూనెతో కలిపిన ధాన్యార్పణను కూడా తీసుకురండి. ఎందుకంటే ఈ రోజు యాహ్వే మీకు ప్రత్యక్షమవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఇది గోవు జాతికి చెందిన బలి పశువును సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు పదంగా ‘ఎద్దు’ ఎంచుకోబడింది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: ఈ పదం మగ గొర్రెను నిర్దిష్టంగా సూచిస్తుంది; బలి సందర్భంలో ‘పొట్టేలు’ స్పష్టమైన తెలుగు రూపం.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: క్షేమం, సహవాసం, సమాధానం అనే భావపరిధి గల బలి పదం. పరిచితమైన ఆచారపర పదంగా ‘సమాధాన బలులు’ ఉంచి, ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: לִזְבֹּחַ
  choice: బలి అర్పించడానికి
  rationale: కేవలం వధించడం కాక, యెహోవా సన్నిధిలో జరిగే ఆచారపర బలి క్రియను తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లִפְנֵי అనే పదంలోని ‘ముందు/సన్నిధిలో’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించాం.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: లేవీయకాండంలోని ఆచార సందర్భంలో ఇది ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: నూనె కలిపిన
  rationale: అర్పణను నూనెతో కలిపి సిద్ధం చేసిన విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי הַיּוֹם
  choice: ఎందుకంటే ఈ రోజు
  rationale: כִּי యొక్క కారణార్థాన్ని, הַיּוֹם యొక్క కాల ప్రాధాన్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: మీకు ప్రత్యక్షమవుతాడు
  rationale: రూపరీత్యా నిఫల్ పరిపూర్ణ క్రియ అయినా, సందర్భంలో త్వరలో జరగబోయే దైవ ప్రత్యక్షతను సూచిస్తున్నందున భవిష్యదర్థం ఎంచుకోబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: దైవ ప్రత్యక్షత వాక్యార్థం
  choice: యెహోవా మీకు ప్రత్యక్షమవుతాడు
  alternative: యెహోవా మహిమ మీకు ప్రత్యక్షమవుతుంది; యెహోవా మీకు ప్రత్యక్షమయ్యాడు
  rationale: ఈ వచనం ‘యెహోవా’ అని నేరుగా చెబుతుంది; తరువాతి వచనంలోని ‘యెహోవా మహిమ’ అనే మాటను ఇక్కడికి దిగుమతి చేయలేదు. సందర్భం ఎదురుచూస్తున్న ప్రత్యక్షతను సూచించడం వల్ల భవిష్యదర్థాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది. హీబ్రూ వాక్యంలో కొనసాగుతున్న ఆజ్ఞకు అనుగుణంగా ‘తీసుకురండి’ను స్పష్టంగా పునరుద్ధరించాం. దైవనామం ‘యెహోవా’గా ఉంచబడింది.
