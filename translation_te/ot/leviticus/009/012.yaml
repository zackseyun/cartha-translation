  text: וַ/יִּשְׁחַ֖ט אֶת הָ/עֹלָ֑ה וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָי/ו֙ אֶת הַ/דָּ֔ם וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: te
  text: తర్వాత అతడు దహనబలిని వధించాడు. అహరోను కుమారులు రక్తాన్ని అతని వద్దకు తీసుకొచ్చారు; అతడు దాన్ని బలిపీఠం చుట్టూ చిమ్మాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దాన్ని బలిపీఠం చుట్టూ విసిరాడు.” ఇక్కడ రక్తాన్ని ప్రయోగించడానికి వాడిన హీబ్రూ క్రియ, దాన్ని సన్నగా చల్లడం కాక బలంగా విసరడం లేదా చిమ్మడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: వధించాడు
  rationale: బలి ఆచార సందర్భంలో שׁחט సాధారణంగా చంపడం కాక, బలిపశువును విధిపూర్వకంగా వధించడాన్ని సూచిస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: עוֹלָה పూర్తిగా దహనం చేసే బలికి ప్రామాణిక బైబిలు తెలుగు పదం; మూలంలోని బలి రకాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּמְצִאוּ
  choice: తీసుకొచ్చారు
  rationale: ఈ ఆచార క్రమంలో అహరోను కుమారులు రక్తాన్ని అతని దగ్గరకు తెచ్చి అందించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: కుటుంబ సంబంధాన్నీ, యాజక సేవలో పాల్గొన్న వారి గుర్తింపునూ నేరుగా నిలుపుతుంది.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: రక్తాన్ని అహరోనుకు తీసుకొచ్చారనే దిశార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַדָּם
  choice: రక్తాన్ని
  rationale: మూలంలోని నిర్దిష్ట కర్మవాచక పదాన్ని అదనపు వివరణ లేకుండా అనువదిస్తుంది.
- source_word: וַיִּזְרְקֵהוּ
  choice: దాన్ని … చిమ్మాడు
  rationale: זָרַק ఇక్కడ రక్తాన్ని బలిపీఠంపై ప్రయోగించే బలమైన ఆచార చర్యను సూచిస్తుంది. ‘చిమ్మాడు’ ఆధునిక పాఠకునికి సహజంగా ఉండగా, అది కేవలం సన్నగా చల్లడం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: రక్తం బలిపీఠంపై ప్రయోగించబడిందనే עַל యొక్క స్థానిక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: סָבִיב
  choice: అన్ని వైపులా
  rationale: బలిపీఠం చుట్టూ రక్తాన్ని ప్రయోగించిన పంపిణీ భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
