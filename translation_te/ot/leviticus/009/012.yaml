translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆచార శైలిని నిలిపాం. హీబ్రూ కథన క్రమాన్ని ‘తర్వాత’తో సహజీకరించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న రక్త ప్రయోగ క్రియ వెంట ఉంచాం.
