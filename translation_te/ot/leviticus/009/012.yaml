  naturalness: “అతని దగ్గరకు” is understandable but slightly colloquial in this formal narrative register; “అతని వద్దకు” is more standard. “బలిపీఠం మీద అన్ని వైపులా” is awkward in Telugu for the Hebrew ritual idiom; “బలిపీఠం చుట్టూ” naturally conveys the application around the altar.
  terminology: “దహనబలి,” “బలిపీఠం,” and “రక్తం” are established, clear Telugu biblical terms. “అహరోను” is retained as the conventional Telugu form of Aaron’s name.
