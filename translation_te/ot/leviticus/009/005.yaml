id: LEV.9.5
reference: Leviticus 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: te
  text: అప్పుడు వారు మోషే ఆజ్ఞాపించినవాటిని సమావేశ గుడారం ఎదుటకు తీసుకువచ్చారు; సమాజమంతా దగ్గరకు వచ్చి యాహ్వే ఎదుట నిలబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొచ్చారు
  rationale: לקח సాధారణంగా ‘తీసుకోవడం’ అని అర్థమైనా, ఇక్కడ గమ్యస్థానం వైపు వస్తువులను తీసుకురావడం సందర్భం కాబట్టి ‘తీసుకొచ్చారు’ సహజంగా దిశను తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: మోషే ఆజ్ఞాపించినవాటిని
  rationale: ఈ సంబంధవాచక నిర్మాణం ముందు చెప్పబడిన అర్పణ సామగ్రిని సూచిస్తుంది; బహువచన రూపం తెలుగులో ఆ వస్తుసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל־פְּנֵי
  choice: ముందుకు
  rationale: ఇది ప్రత్యక్ష గుడారం ఎదుటి ప్రదేశాన్ని సూచించే స్థలార్థక ప్రయోగం; తరువాతి לִפְנֵי יְהוָהతో తేడాను నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనా సందర్భంలో ‘సమావేశ గుడారం’ను సూచించే స్థిరమైన, పరిచితమైన తెలుగు బైబిలు పదబంధం.
- source_word: וַיִּקְרְבוּ
  choice: దగ్గరకు వచ్చి
  rationale: קרבలోని సమీపించడం అనే చలనార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָּל־הָעֵדָה
  choice: సమాజమంతా
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు సముదాయాన్ని సమష్టిగా సూచిస్తుంది; ‘సమాజమంతా’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיַּעַמְדוּ
  choice: నిలబడింది
  rationale: עמד యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, సమష్టివాచకమైన ‘సమాజం’కు అనుగుణంగా ఏకవచన క్రియ వాడబడింది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఈ పదబంధంలోని భౌతిక సమీపతతోపాటు దేవుని సమక్షంలో ఉండే ఆరాధనా భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం; హీబ్రూ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘ప్రత్యక్ష గుడారం’ వంటి పాఠకులకు పరిచితమైన ఆరాధనా పదజాలాన్ని ఉంచుతూ, వాక్య నిర్మాణాన్ని సరళంగా మరియు సహజంగా తీర్చిదిద్దాం.
