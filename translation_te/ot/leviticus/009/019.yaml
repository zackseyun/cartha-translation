id: LEV.9.19
reference: Leviticus 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: te
  text: ఎద్దు నుండీ, పొట్టేలు నుండీ తీసిన కొవ్వు భాగాలను—కొవ్వుతో నిండిన తోకను, అంతరంగాలను కప్పి ఉన్న కొవ్వును, మూత్రపిండాలను, కాలేయపు లోబును—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: కొవ్వు భాగాలను
  rationale: బలి సందర్భంలో חֲלָבִים సాధారణ కొవ్వును కాక, అర్పణ కోసం వేరుచేసిన నిర్దిష్ట కొవ్వు భాగాలను సూచిస్తుంది.
- source_word: מִן הַשּׁוֹר
  choice: ఎద్దులోనూ
  rationale: שׁוֹר పశువర్గంలోని మగ జంతువును సూచించగలదు; ఈ బలి సందర్భంలో ‘ఎద్దు’ సహజమైన తెలుగు పదం.
- source_word: וּמִן הָאַיִל
  choice: పొట్టేలులోనూ
  rationale: אַיִל అనేది బలి సందర్భంలో మగ గొర్రె; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הָאַלְיָה
  choice: కొవ్వుతో నిండిన తోకను
  rationale: ఇది కొవ్వు అధికంగా ఉండే గొర్రె తోకను సూచిస్తుంది; కేవలం ‘తోక కొవ్వు’ కంటే ఈ రూపం అవయవాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְכַסֶּה
  choice: లోపలి అవయవాలను కప్పే కొవ్వును
  rationale: ‘కప్పేది’ అనే మూలభావాన్ని నిలుపుతూ, బలి జాబితాలో ఉద్దేశించిన అంతరాంగాలపై ఉండే కొవ్వును స్పష్టం చేస్తుంది.
- source_word: הַכְּלָיֹת
  choice: మూత్రపిండాలను
  rationale: ఇది ప్రామాణిక ఆధునిక తెలుగు శరీర నిర్మాణ పదం.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: కాలేయపు తమ్మెను
  rationale: కాలేయానికి అనుబంధంగా ఉన్న ప్రత్యేక భాగాన్ని సూచించే సాంప్రదాయిక తెలుగు బైబిలు పదప్రయోగం; మూలంలోని శరీర నిర్మాణ సూచనను అతిగా నిర్దిష్టీకరించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బలి-సంబంధ పదజాలం వాడబడింది. వచనం 18వ వచనంలో మొదలైన వాక్యానికి కొనసాగింపు కావడంతో ముగింపులో దీర్ఘ విరామ చిహ్నం ఉంచబడింది. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, ‘కప్పే కొవ్వు’ యొక్క శరీర నిర్మాణ సందర్భాన్ని స్పష్టంచేశాం.
