revisions:
- from: ఎద్దులోనూ పొట్టేలులోనూ తీసిన కొవ్వు భాగాలను—కొవ్వుతో నిండిన తోకను, లోపలి అవయవాలను కప్పే కొవ్వును, మూత్రపిండాలను, కాలేయపు తమ్మెను—
  to: ఎద్దు నుండీ, పొట్టేలు నుండీ తీసిన కొవ్వు భాగాలను—కొవ్వుతో నిండిన తోకను, అంతరంగాలను కప్పి ఉన్న కొవ్వును, మూత్రపిండాలను, కాలేయపు లోబును—
  rationale: The revision corrects the Hebrew preposition מן (“from”) and updates the last anatomical expression to clear modern Telugu. The trailing dash is retained because this is a syntactic continuation into the following verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:07:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the sacrificial fat portions and preserves the verse's list structure. However, ఎద్దులోనూ / పొట్టేలులోనూ means “in the ox / in the ram,” whereas מן requires “from,” so the source relation needs correction. The final anatomical term is better rendered with a clear modern term for the liver lobe/appendage.
  naturalness: The terminology is generally understandable, but “ఎద్దు నుండీ, పొట్టేలు నుండీ తీసిన” is more idiomatic and accurate than the locative wording. “కాలేయపు లోబు” is clearer in modern standard Telugu than the traditional and potentially opaque “తమ్మె.”
  terminology: కొవ్వు భాగాలు, కొవ్వుతో నిండిన తోక, అంతరంగాలను కప్పి ఉన్న కొవ్వు, and మూత్రపిండాలు are suitable sacrificial/anatomical terminology. “కాలేయపు లోబు” conveys the Hebrew anatomical expression without claiming a more exact identification than the source warrants.
  issues:
  - severity: medium
    issue: Locative forms used for מן
    rationale: “ఎద్దులోనూ పొట్టేలులోనూ” expresses location (“in the ox and in the ram”), but the Hebrew מן ... ומן means that the designated portions are taken “from the ox and from the ram.”
  - severity: low
    issue: Opaque final anatomical term
    rationale: “కాలేయపు తమ్మె” is traditional but not readily clear in modern standard Telugu. “కాలేయపు లోబు” is natural and corresponds well to the conventional rendering “lobe of the liver,” while retaining the source's general anatomical sense.
  revised_text: ఎద్దు నుండీ, పొట్టేలు నుండీ తీసిన కొవ్వు భాగాలను—కొవ్వుతో నిండిన తోకను, అంతరంగాలను కప్పి ఉన్న కొవ్వును, మూత్రపిండాలను, కాలేయపు లోబును—
  revised_footnotes: []
  revision_rationale: The revision corrects the Hebrew preposition מן (“from”) and updates the last anatomical expression to clear modern Telugu. The trailing dash is retained because this is a syntactic continuation into the following verse.
