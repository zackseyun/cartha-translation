id: LEV.9.18
reference: Leviticus 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: te
  text: తర్వాత అతడు ప్రజల కోసం సమాధాన బలిగా ఎద్దును, పొట్టేలును వధించాడు.[a] అహరోను కుమారులు రక్తాన్ని అతని దగ్గరికి తీసుకొచ్చారు; అతడు దాన్ని బలిపీఠం మీద అన్ని వైపులా చల్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలిగా,” లేదా “క్షేమ బలిగా.” హీబ్రూ పదం שְׁלָמִים (షెలామీమ్) శాంతి, సంపూర్ణత, క్షేమం, సహవాసం అనే భావాలతో ముడిపడి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: తర్వాత అతడు ... వధించాడు
  rationale: కథన క్రమాన్ని וַ సూచిస్తుండగా, బలి సందర్భంలో שׁחטకు ‘వధించాడు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: הַשּׁוֹר וְאֶת הָאַיִל
  choice: ఎద్దును, పొట్టేలును
  rationale: שׁוֹרను సాధారణ గోవు జాతి మగ జంతువుగా ‘ఎద్దు’ అని, אַיִלను నిర్దిష్టంగా ‘పొట్టేలు’ అని అనువదించాం.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలిగా
  rationale: שְׁלָמִיםలోని శాంతి, క్షేమం, సహవాసం భావాలను పూర్తిగా ఒకే పదం పట్టుకోలేకపోయినా, తెలుగు బైబిలు వాడుకలో సహజమైన ‘సమాధాన బలి’ మూలపదంతోనున్న శాంతి సంబంధాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לָעָם
  choice: ప్రజల కోసం
  rationale: ఈ బలి ప్రజల పక్షంగా అర్పించబడిందనే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: అతని దగ్గరికి తీసుకొచ్చారు
  rationale: ఇక్కడ מצא హిఫీల్ రూపం రక్తాన్ని యాజకునికి అందించడం లేదా తీసుకురావడాన్ని సూచిస్తుంది; ‘తీసుకొచ్చారు’ సాధారణ పాఠకులకు స్పష్టం.
- source_word: וַיִּזְרְקֵהוּ עַל הַמִּזְבֵּחַ סָבִיב
  choice: దాన్ని బలిపీఠం మీద చుట్టూ చల్లాడు
  rationale: זרק బలి రక్తాన్ని విసిరి/చల్లి వర్తింపజేయడాన్ని సూచిస్తుంది; ‘చల్లాడు’ సాధారణ ‘చిలకరించాడు’ కంటే బలమైన చర్యకు అనుకూలం. סָבִיבను ‘చుట్టూ’గా నిలిపాం.
theological_decisions:
- issue: שְׁלָמִים అనే బలి పేరులోని భావ పరిధి
  choice: సమాధాన బలి
  alternative: సహవాస బలి; క్షేమ బలి
  rationale: మూలపదం శాంతి, సంపూర్ణ క్షేమం, దేవునితో/సమాజంతో సహవాసం వంటి అనుబంధాలను కలిగి ఉంది. ప్రధాన పాఠంలో ఒక భావాన్ని సిద్ధాంతపరంగా సంపూర్ణ నిర్వచనంగా చేయకుండా సంప్రదాయబద్ధమైన పదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బలి సంబంధ పదజాలం వాడబడింది. హీబ్రూ కథన క్రమం, కర్తల మార్పు, రక్తాన్ని బలిపీఠం చుట్టూ వర్తింపజేసిన చర్య స్పష్టంగా నిలుపబడ్డాయి.
