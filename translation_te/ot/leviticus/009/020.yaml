  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: te
  text: వారు కొవ్వు భాగాలను రొమ్ములపై ఉంచారు; అతడు ఆ కొవ్వు భాగాలను బలిపీఠంపై దహించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అతడు కొవ్వు భాగాలను బలిపీఠంపై పొగగా అర్పించాడు.”
    reason: కטר క్రియ బలిపీఠంపై కాల్చి పొగగా ఎగసేలా అర్పించే ప్రత్యేక బలి-భావాన్ని సూచించగలదు.
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: వారు ఉంచారు
  rationale: שׂים అనే సాధారణ క్రియకు ‘ఉంచు/పెట్టు’ అనే అర్థం ఉంది. ఆచారంలో జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో ‘ఉంచారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֲלָבִים
  choice: కొవ్వు భాగాలను
  rationale: బలి సందర్భంలో חֵלֶב బలి అర్పణ కోసం వేరుచేసిన కొవ్వు భాగాలను సూచిస్తుంది. హీబ్రూ బహువచనాన్ని స్పష్టంగా నిలుపుతూ ‘కొవ్వు భాగాలు’ అని అనువదించబడింది.
- source_word: עַל הֶחָזוֹת
  choice: బోరల మీద
  rationale: బలి నియమాలలో חָזֶה జంతువు బోర భాగాన్ని సూచిస్తుంది. ‘బోరలు’ శరీర నిర్మాణపరమైన భావాన్ని సహజంగా, నిర్దిష్టంగా అందిస్తుంది.
- source_word: וַיַּקְטֵר
  choice: దహనం చేశాడు
  rationale: యాజక బలి సందర్భంలో קטר బలిపీఠం మీద అర్పణను కాల్చి పొగగా పైకి లేపే చర్యను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘దహనం చేశాడు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: קטר క్రియతో వచ్చిన దిశార్థక రూపం ఇక్కడ కాల్చే స్థలాన్ని సూచిస్తుంది; అందువల్ల తెలుగులో ‘బలిపీఠం మీద’ సహజమైన అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, బలి ఆచారానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని బహువచన కొవ్వు భాగాలు మరియు ఏకవచన కర్త మార్పు (‘వారు’—‘అతడు’) యథాతథంగా నిలుపబడ్డాయి.
