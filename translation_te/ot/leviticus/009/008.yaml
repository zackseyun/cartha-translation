source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: te
  text: అప్పుడు అహరోను బలిపీఠం దగ్గరికి వచ్చి, తన కోసం ఉన్న పాపపరిహార బలి దూడను[a] వధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కోసం ఉన్న శుద్ధీకరణ బలి దూడను.” హీబ్రూ పదం పాపం మరియు అపవిత్రత తొలగింపుతో సంబంధం ఉన్న బలిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: దగ్గరికి వచ్చి
  rationale: క్రియ బలిపీఠం వైపు భౌతికంగా సమీపించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే పీఠాన్ని సూచించే స్థిరమైన, సాధారణ తెలుగు పదం.
- source_word: וַיִּשְׁחַט
  choice: వధించాడు
  rationale: బలి సందర్భంలోని ఉద్దేశపూర్వక జంతు వధను ఖచ్చితంగా తెలియజేస్తుంది; సాధారణమైన ‘చంపాడు’ కంటే ఆచార సందర్భానికి తగినది.
- source_word: עֵגֶל
  choice: దూడను
  rationale: యువ గోవును సూచించే עֵגֶל పదానికి నేరమైన, సందర్భోచితమైన తెలుగు సమానం.
- source_word: הַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: ఇక్కడ חטאת పాపాన్నే కాక బలి వర్గాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకునికి దాని బలి స్వభావాన్ని స్పష్టం చేస్తుంది; శుద్ధీకరణ భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: אֲשֶׁר לוֹ
  choice: తన కోసం ఉన్న
  rationale: సందర్భంలో ఇది ప్రజల బలికి భిన్నంగా అహరోను తన కోసం అర్పించే బలిని గుర్తిస్తుంది; కేవలం యాజమాన్యాన్ని సూచించే ‘అతనిది’ కంటే ఈ ప్రయోజనార్థక భావం సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: యాజక బలి సందర్భంలో חטאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి
  rationale: హీబ్రూ పదం ఇక్కడ ఒక నిర్దిష్ట బలి వర్గాన్ని సూచిస్తుంది. సంప్రదాయ పాప సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అపవిత్రత తొలగింపు లేదా శుద్ధీకరణ అనే ఆచారపరమైన భావసంభావ్యతను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆచారపరమైన ఖచ్చితత్వం కోసం ‘బలిపీఠం,’ ‘వధించాడు,’ ‘పాపపరిహార బలి’ అనే పదాలను ఉపయోగించాం; నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
