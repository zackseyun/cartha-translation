id: LEV.9.2
reference: Leviticus 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: te
  text: 'ఆయన అహరోనుతో ఇలా అన్నాడు: “నీ కోసం మందలోని ఒక దూడను[a] పాపపరిహార బలిగా, ఒక పొట్టేలును దహనబలిగా తీసుకో. అవి రెండూ లోపం లేనివిగా ఉండాలి. వాటిని యాహ్వే సన్నిధికి తీసుకురా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక దూడ, పశువుల మందకు చెందిన కుమారుడు”; అంటే, ఒక చిన్న గోవు జాతి జంతువు.
    reason: మూలంలోని עֵגֶל בֶּן־בָּקָר అనే విశేష ప్రయోగాన్ని చూపించి, దాని భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אַהֲרֹן
  choice: ఆయన అహరోనుతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో ఉంచుతుంది. కర్త మునుపటి సందర్భం నుంచి గ్రహించబడుతుంది.
- source_word: קַח לְךָ
  choice: నీ కోసం ... తీసుకో
  rationale: లְךָలోని వ్యక్తిగత లేదా ప్రతిబింబార్థ ఛాయను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: עֵגֶל בֶּן־בָּקָר
  choice: మందలోని ఒక దూడను
  rationale: అక్షరార్థంగా ‘పశువుల మందకు చెందిన దూడ/పశువు కుమారుడు’; సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూలంలోని విశేష ప్రయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: ఈ బలుల సందర్భంలో חַטָּאת నైరూప్యమైన ‘పాపం’ను కాక పాపానికి సంబంధించిన బలిని సూచిస్తుంది.
- source_word: וְאַיִל לְעֹלָה
  choice: ఒక పొట్టేలును దహనబలిగా
  rationale: אַיִלకు ‘పొట్టేలు’, עֹלָהకు స్థిరమైన బలిసంబంధ పదం ‘దహనబలి’ వాడాం.
- source_word: תְּמִימִם
  choice: అవి రెండూ లోపం లేనివిగా ఉండాలి
  rationale: బహువచన విశేషణం రెండు జంతువులకూ వర్తిస్తుందని స్పష్టపరుస్తూ, బలికి అనర్హం చేసే లోపం లేదనే భావాన్ని అందిస్తుంది.
- source_word: וְהַקְרֵב
  choice: వాటిని ... తీసుకురా
  rationale: హిఫీల్ రూపంలోని ‘దగ్గరకు తీసుకురావడం/సమర్పణకు తీసుకురావడం’ అనే భావాన్ని నిలుపుతుంది; తరువాత జరిగే బలి చర్యను ముందుగానే ‘అర్పించు’ అని నిర్ధారించదు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి
  rationale: దేవుని సమక్షానికి తీసుకురావాలనే ఆరాధనాసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దైవనామాన్ని పేరుగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: חַטָּאת యొక్క బలిసంబంధ అర్థం
  choice: పాపపరిహార బలి
  alternative: పాపబలి
  rationale: ఇది పాపానికి సంబంధించిన బలి అని స్పష్టం చేస్తుంది; అయితే ప్రాయశ్చిత్తం ఎలా పనిచేస్తుందనే విస్తృత సిద్ధాంతాన్ని ఈ పదంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. బలులకు సంబంధించిన స్థిర పదజాలాన్ని నిలిపి, హీబ్రూ వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు చిన్న వాక్యాలుగా విభజించాం.
