source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: te
  text: అహరోను కుమారులు రక్తాన్ని అతని వద్దకు తీసుకొచ్చారు[a]. అతడు తన వేలిని రక్తంలో ముంచి, రక్తాన్ని బలిపీఠపు కొమ్ముల మీద[b] పూశాడు. రక్తాన్ని బలిపీఠపు అడుగుభాగం వద్ద[c] కుమ్మరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి రక్తాన్ని సమర్పించారు”; ఇక్కడి హీబ్రూ క్రియకు ఆచార సందర్భంలో “దగ్గరకు తీసుకురావడం” లేదా “సమర్పించడం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: బలిపీఠపు “కొమ్ములు” అంటే దాని మూలల వద్ద పైకి పొడుచుకొచ్చిన భాగాలు.
    reason: cultural_note
  - marker: c
    text: లేదా, “బలిపీఠపు పునాది వద్ద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: దగ్గరకు తీసుకొచ్చారు
  rationale: హిఫిల్ రూపంలోని קרב ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావాన్ని ఇస్తుంది. ఆచార సందర్భాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండే వ్యక్తీకరణను ఎంచుకున్నాం.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: మూలంలోని సంబంధాన్ని సరళంగా, సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: הַדָּם
  choice: రక్తాన్ని
  rationale: ముందే ప్రస్తావనలో ఉన్న నిర్దిష్ట బలి రక్తాన్నే సూచిస్తుంది.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా మూలంలోని రూపాన్ని నిలిపాం; సందర్భంలో అది అహరోనును సూచిస్తుంది.
- source_word: וַיִּטְבֹּל אֶצְבָּעוֹ
  choice: తన వేలిని … ముంచి
  rationale: טבל అంటే ముంచడం; ఏకవచనమైన ‘వేలు’ను నిలుపుతూ చర్యను స్పష్టంగా తెలిపాం.
- source_word: וַיִּתֵּן עַל
  choice: దానిని … మీద పూశాడు
  rationale: నేరుగా ‘పెట్టాడు’ అనడం కంటే రక్తాన్ని ఆచారపూర్వకంగా అంటించిన చర్యకు ‘పూశాడు’ సహజంగా, స్పష్టంగా సరిపోతుంది; ‘దానిని’ అనేది సందర్భంలోని రక్తాన్ని సూచిస్తుంది.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములు
  rationale: బలిపీఠం మూలల వద్ద పైకి పొడుచుకొచ్చిన కొమ్ములవంటి భాగాలను సూచించే ఆచార సంబంధిత పదబంధాన్ని యథాతథంగా నిలిపాం.
- source_word: יָצַק
  choice: కుమ్మరించాడు
  rationale: ద్రవాన్ని ఉద్దేశపూర్వకంగా పోయడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠపు అడుగుభాగం దగ్గర
  rationale: יְסוֹד కు ‘పునాది/అడుగుభాగం’ అనే అర్థాలున్నాయి. బలిపీఠ సందర్భంలో ‘అడుగుభాగం’ పాఠకులకు స్పష్టంగా ఉంటుంది; אֶל లోని దిశాభావాన్ని ‘దగ్గర’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֵלָיו లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: రక్తాన్ని అహరోను దగ్గరకు తీసుకొచ్చారు.
  alternative: రక్తాన్ని బలిపీఠం దగ్గరకు లేదా సూచింపబడిన మరొకరి దగ్గరకు తీసుకొచ్చారు.
  rationale: ముందటి సందర్భంలో ఆచారాన్ని నిర్వహిస్తున్నవాడు అహరోను, అతనికి సహాయం చేస్తున్నవారు అతని కుమారులు. కాబట్టి ‘అతని’ అనే సర్వనామానికి అహరోనే అత్యంత సహజమైన పూర్వపదం; ఇది సందర్భాధారిత వ్యాకరణ నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణాన్ని వాడాం. ‘బలిపీఠపు కొమ్ములు’ అనే సాంస్కృతిక-ఆచార పదబంధాన్ని మూలానికి దగ్గరగా ఉంచి పాదసూచికలో వివరించాం. మూలంలో స్పష్టంగా లేని ‘మిగిలిన’ అనే భావం సందర్భం ద్వారా సహజంగా సూచింపబడినా, అది హీబ్రూలో ప్రత్యక్షంగా లేదు; తెలుగులో రెండు రక్త వినియోగ చర్యల మధ్య వ్యత్యాసాన్ని స్పష్టపరచడానికి వాడాం.
