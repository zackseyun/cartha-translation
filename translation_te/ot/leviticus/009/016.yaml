    text: లేదా, “నిర్దేశించిన విధానం ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: సమర్పించి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే భావాన్ని ఇస్తుంది. బలి సందర్భంలో ‘సమర్పించి’ సహజంగా ఉండి, ఆచారపరమైన సమర్పణ భావాన్ని నిలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలిని
  rationale: עֹלָה అనేది పూర్తిగా దహనం చేసే బలికి ప్రామాణిక బలిసంబంధ పదం. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘దహనబలి’ స్పష్టమైన, స్థిరమైన అనువాదం.
- source_word: וַיַּעֲשֶׂהָ
  choice: దాన్ని అర్పించాడు
  rationale: עשה సాధారణంగా ‘చేయడం’ అని అర్థమైనా, ఇక్కడ బలికి నిర్దేశించిన క్రియను నిర్వహించడాన్ని సూచిస్తుంది. ‘దాన్ని అర్పించాడు’ సందర్భానుకూలంగా సహజంగా ఉంటుంది; అయితే మూలంలోని విస్తృత క్రియను ఆచార సందర్భం ద్వారా స్పష్టం చేస్తుంది.
- source_word: כַּמִּשְׁפָּט
  choice: దాని నియమం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ బలికి నిర్దేశించబడిన నియమం లేదా విధానాన్ని సూచిస్తుంది. ‘దాని నియమం ప్రకారం’ న్యాయ-ఆచార భావాన్ని కాపాడుతుంది.
theological_decisions: []
