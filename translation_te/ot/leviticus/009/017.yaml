revisions:
- from: తర్వాత అతడు ధాన్యార్పణను సమర్పించి, దానితో తన అరచేతిని నింపుకొని[a], బలిపీఠం మీద దహించాడు. ఇది ఉదయపు దహనబలికి అదనంగా అర్పించబడింది.
  to: తర్వాత అతడు ధాన్యార్పణను సమర్పించి, దానిలోనుండి తన అరచేతినిండా తీసుకొని[a], ఆ భాగాన్ని బలిపీఠం మీద దహించాడు; ఇది ఉదయపు దహనబలికి అదనంగా జరిగింది.
  rationale: The revision retains the Hebrew sequence and sacrificial terminology, makes the burned portion explicit, and renders מִלְּבַד as an additive relation without converting the clause into a separate passive assertion. The footnote preserves the literal hand-filling idiom while the main text uses idiomatic Telugu.
