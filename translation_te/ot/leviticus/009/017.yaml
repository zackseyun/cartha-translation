id: LEV.9.17
reference: Leviticus 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְרֵב֮ אֶת הַ/מִּנְחָה֒ וַ/יְמַלֵּ֤א כַפּ/וֹ֙ מִמֶּ֔/נָּה וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּ֑חַ מִ/לְּ/בַ֖ד עֹלַ֥ת הַ/בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/017.yaml
  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: te
  text: తర్వాత అతడు ధాన్యార్పణను సమర్పించి, దానిలోనుండి తన అరచేతినిండా తీసుకొని[a], ఆ భాగాన్ని బలిపీఠం మీద దహించాడు; ఇది ఉదయపు దహనబలికి అదనంగా జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దానిలోనుండి తన అరచేతిని నింపుకొని.” అంటే ధాన్యార్పణలో కొంత భాగాన్ని చేతితో తీసుకొని బలిపీఠం మీద దహించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: సమర్పించి
  rationale: హిఫీల్ రూపంలోని קרב బలుల సందర్భంలో ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే అర్థం ఇస్తుంది. ‘సమర్పించి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆచార సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణను
  rationale: లేవీయకాండంలోని బలి నియమాల సందర్భంలో מִנְחָה సాధారణ కానుకను కాక, ప్రత్యేకంగా ధాన్యార్పణను సూచిస్తుంది.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: దానితో తన అరచేతిని నింపుకొని
  rationale: హీబ్రూ వాక్యంలోని స్పష్టమైన చేతి చిత్రణను కాపాడుతుంది. భావం ధాన్యార్పణలో కొంత భాగాన్ని చేతితో తీసుకోవడం; దీనిని పాదసూచిక వివరిస్తుంది.
- source_word: וַיַּקְטֵר
  choice: దహించాడు
  rationale: కטר హిఫీల్ బలి సందర్భంలో బలిపీఠం మీద కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. ‘దహించాడు’ సంక్షిప్తంగా, ఆచార సందర్భానికి తగిన విధంగా ఉంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి సందర్భంలోని స్థానార్థక ప్రయోగానికి ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: מִלְּבַד
  choice: అదనంగా
  rationale: ఇక్కడ ఈ అర్పణ ఉదయపు నియమిత దహనబలితో పాటు చేయబడిందని సూచిస్తుంది; ‘అదనంగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹלַת הַבֹּקֶר
  choice: ఉదయపు దహనబలి
  rationale: עֹלָה లేవీయకాండంలో పూర్తిగా దహించే ప్రామాణిక బలిని సూచిస్తుంది. ‘ఉదయపు దహనబలి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
theological_decisions:
- issue: מִלְּבַד ద్వారా సూచించబడిన అర్పణల సంబంధం
  choice: ఇది ఉదయపు దహనబలికి అదనంగా అర్పించబడింది
  alternative: ఉదయపు దహనబలి కాకుండా
  rationale: ఈ సందర్భంలో מִלְּבַד మినహాయింపును కాక, ముందే ఉన్న నియమిత ఉదయపు దహనబలికి తోడు ఈ ధాన్యార్పణ దహించబడిందనే సంకలిత భావాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ ఉంది. హీబ్రూలోని చేతి చిత్రణను ప్రధాన పాఠ్యంలో నిలిపి, దాని ఆచారార్థాన్ని పాదసూచికలో వివరించాం.
