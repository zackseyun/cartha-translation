  source_fidelity: మూల హీబ్రూ వాక్యంలోని కదలికల వరుస, పగటి వేడివేళ, ఇష్బోషెతు ఇంటి వద్దకు రావడం, అతని మధ్యాహ్న విశ్రాంతి స్థితి అన్నీ ముసాయిదాలో సారాంశంగా సరిగానే ఉన్నాయి. అయితే పాదటిప్పణిలో మూలపదబంధాన్ని తప్పుగా, వ్యాకరణపరంగా అసహజంగా పునరావృతం చేశారు.
