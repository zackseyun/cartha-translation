  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: te
  text: బెయేరోతీయుడైన రిమ్మోను కుమారులు రేకాబు, బయనా బయలుదేరి పగటి వేడివేళ ఇష్బోషెతు ఇంటికి వచ్చారు. అతడు మధ్యాహ్న విశ్రాంతి తీసుకుంటూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మధ్యాహ్నపు పడుకోవడం”; అంటే మధ్యాహ్న విశ్రాంతి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: బెయేరోతీయుడైన రిమ్మోను కుమారులు
  rationale: בְּנֵי అనే పదానికి ఇక్కడ సహజమైన అర్థం ‘కుమారులు’; వెంటనే రేకాబు, బయనా పేర్లు రావడం కుటుంబ సంబంధాన్ని సూచిస్తుంది.
- source_word: רֵכָב וּבַעֲנָה
  choice: రేకాబు, బయనా
  rationale: హీబ్రూ పేర్ల ఉచ్చారణను ఆధారంగా చేసుకొని, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించబడింది.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: బయలుదేరి ... వచ్చారు
  rationale: రెండు వరుస కదలిక క్రియలను నిలుపుతూ, తెలుగులో అసహజంగా అనిపించే ‘వెళ్లి వచ్చారు’ అనే సందిగ్ధ వాక్యాన్ని నివారిస్తుంది.
- source_word: כְּחֹם הַיּוֹם
  choice: పగటి వేడివేళ
  rationale: ‘రోజు వేడిలో’ అనే మూల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘మధ్యాహ్నం’ అని మరీ నిర్దిష్టంగా మార్చదు.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: ఇష్బోషెతు ఇంటికి
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విభక్తి నిర్మాణంలో అందిస్తుంది; వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరిస్తుంది.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: అప్పుడు అతడు మధ్యాహ్న విశ్రాంతి తీసుకుంటూ పడుకొని ఉన్నాడు
  rationale: ఆగమన సమయంలో ఇష్బోషెతు స్థితిని తెలిపే సందర్భార్థాన్ని స్పష్టం చేస్తూ, ‘మధ్యాహ్నపు పడుకోవడం’ అనే మూల నామవాచక ప్రయోగాన్ని సహజంగా అనువదిస్తుంది.
