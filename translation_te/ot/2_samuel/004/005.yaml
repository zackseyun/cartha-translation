translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. పేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం.
