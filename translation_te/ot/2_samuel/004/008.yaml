  to: 'వారు ఇష్బోషెతు తలను హెబ్రోనులోని దావీదు దగ్గరికి తీసుకొచ్చి రాజుతో ఇలా అన్నారు: “ఇదిగో, నీ ప్రాణం తీయాలని చూసిన నీ శత్రువు, సౌలు కుమారుడైన ఇష్బోషెతు తల. యాహ్వే ఈ రోజు సౌలుపై, అతని సంతానంపై నా ప్రభువైన రాజు పక్షాన ప్రతీకారం[a] తీర్చాడు.”'
