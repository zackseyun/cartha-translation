  terminology: యెహోవా స్థానంలో మూలపాఠ్యానికి మరియు ఇంగ్లీషు POB నిర్ణయానికి అనుగుణంగా “యాహ్వే” వాడాలి. “నా ప్రభువైన రాజు” రాజసభా సంబోధనను సరిగ్గా నిలుపుతుంది. నְקָמוֹת యొక్క బహువచనాన్ని ప్రధాన పాఠ్యంలో సహజమైన ఏకవచనంగా ఉంచి పాదటిప్పణిలో తెలియజేయాలి.
