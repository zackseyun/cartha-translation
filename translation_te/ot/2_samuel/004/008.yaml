source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: te
  text: 'వారు ఇష్బోషెతు తలను హెబ్రోనులోని దావీదు దగ్గరికి తీసుకొచ్చి రాజుతో ఇలా అన్నారు: “ఇదిగో, నీ ప్రాణం తీయాలని చూసిన నీ శత్రువు, సౌలు కుమారుడైన ఇష్బోషెతు తల. యాహ్వే ఈ రోజు సౌలుపై, అతని సంతానంపై నా ప్రభువైన రాజు పక్షాన ప్రతీకారం[a] తీర్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హెబ్రూలో “ప్రతీకారాలు” అని బహువచనంలో ఉంది; ఇది తీవ్రతను లేదా ప్రతీకార కార్యాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ אֶת רֹאשׁ אִישׁ־בֹּשֶׁת
  choice: వారు ఇష్బోషెతు తలను ... తీసుకొచ్చి
  rationale: కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందిస్తూ, רֹאשׁ అనే పదాన్ని భౌతికమైన ‘తల’గానే నిలిపింది.
- source_word: אֶל־דָּוִד חֶבְרוֹן
  choice: హెబ్రోనులో ఉన్న దావీదు దగ్గరికి
  rationale: గమ్యాన్ని, దావీదు ఉన్న ప్రదేశాన్ని తెలుగులో స్పష్టంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ఎదుట ఉన్నదాన్ని చూపిస్తూ సమర్పించే హెబ్రీయ పదబలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֹיִבְךָ
  choice: నీ శత్రువు
  rationale: సాధారణ నామవాచకానికి నేరమైన, సహజమైన సమానార్థకం.
- source_word: אֲשֶׁר בִּקֵּשׁ אֶת־נַפְשֶׁךָ
  choice: నీ ప్రాణం తీయాలని చూసిన
  rationale: అక్షరార్థంగా ‘నీ ప్రాణాన్ని వెదికిన’ అనే హెబ్రీయ నుడికారానికి ఉద్దేశాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుకు
  rationale: మాట్లాడువారి రాజసభా సంబోధనను, ఏకవచన ప్రథమపురుష సంబంధాన్ని నిలుపుతుంది.
- source_word: נְקָמוֹת
  choice: ప్రతీకారం
  rationale: హెబ్రీయ బహువచనం తీవ్రతను లేదా ప్రతీకార కార్యాలను సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ఏకవచనాన్ని వాడి, రూపభేదాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: సౌలు మీద, అతని సంతానం మీద
  rationale: రెండు లక్ష్యాలనూ స్పష్టంగా ఉంచి, זֶרַע యొక్క వంశ/సంతతి భావాన్ని ‘సంతానం’తో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో గుర్తించదగిన రూపంలో నిలిపింది.
- issue: హంతకులు తమ చర్యకు దైవ అనుమోదన ఉందని చేసిన వాదన
  choice: వారి మాటలను ఎలాంటి వ్యాఖ్యాత్మక అర్హత లేకుండా ప్రత్యక్ష ఉక్తిగా నిలపడం
  alternative: ‘వారి మాట ప్రకారం’ లేదా ‘దేవుడు చేసినట్టుగా’ అనే సందేహ సూచనను చేర్చడం
  rationale: ఈ వాదన పాత్రల ప్రత్యక్ష మాటల్లోనే ఉంది. అనువాదం దానిని కథకుని ఆమోదంగా మార్చదు; అదే సమయంలో మూలంలో లేని సందేహ సూచనను కూడా చేర్చదు.
- issue: וַיִּתֵּן ... נְקָמוֹת అనే ప్రయోగం
  choice: ప్రతీకారం కలిగించాడు
  alternative: ప్రతీకారం తీర్చుకున్నాడు; ప్రతీకారాలను ఇచ్చాడు
  rationale: ‘ఇచ్చాడు’ అనే మూల నిర్మాణాన్ని తెలుగులో పూర్తిగా అసహజంగా చేయకుండా ఫలితార్థంతో అందిస్తుంది; దేవుడే నేరుగా ప్రతీకారం తీర్చుకున్నాడని అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నా ప్రభువైన రాజు’ అనే రాజసభా సంబోధనను నిలిపి, మిగతా వాక్యాన్ని సహజమైన తెలుగు క్రమంలో అమర్చింది.
