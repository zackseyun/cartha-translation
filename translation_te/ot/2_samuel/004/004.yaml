source:
  edition: WLC
  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: te
  text: సౌలు కుమారుడైన యోనాతానుకు కాళ్లలో వైకల్యం ఉన్న ఒక కుమారుడు ఉండేవాడు.[a] సౌలు, యోనాతానుల గురించిన వార్త యెజ్రెయేలు నుండి వచ్చినప్పుడు అతనికి ఐదేళ్లు. అతణ్ణి చూసుకునే దాది అతణ్ణి ఎత్తుకొని పారిపోయింది. ఆమె హడావిడిగా పారిపోతుండగా అతడు పడిపోయి కుంటివాడయ్యాడు. అతని పేరు మెఫీబోషెతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘రెండు కాళ్లలోనూ కుంటివాడు.’ హీబ్రూ పదబంధం అక్షరార్థంగా కాళ్లలో దెబ్బతిన్నవాడని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: కాళ్లలో వైకల్యం ఉన్న
  rationale: హీబ్రూ పదబంధం కాళ్లలో కలిగిన శారీరక వైకల్యాన్ని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండి, ద్వివచన రూపంలో సూచితమైన ‘రెండు’ అనే భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: అతనికి ఐదేళ్లు
  rationale: వయస్సును తెలుగులో సహజంగా చెప్పే రూపం; మూలార్థాన్ని యథాతథంగా అందిస్తుంది.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: సౌలు, యోనాతానుల గురించిన వార్త ... వచ్చినప్పుడు
  rationale: వార్త వారిని గురించి అని మాత్రమే మూలం స్పష్టంగా చెబుతుంది; వారి మరణవార్త అని ప్రధాన పాఠంలో వివరించి మూలంలోని సంక్షిప్తతను తొలగించలేదు.
- source_word: מִיִּזְרְעֶאל
  choice: యెజ్రెయేలు నుండి
  rationale: వార్త వచ్చిన స్థలమూలాన్ని నేరుగా, సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: אֹמַנְתּוֹ
  choice: అతణ్ణి చూసుకునే దాది
  rationale: పిల్లవాణ్ణి పోషిస్తూ చూసుకునే స్త్రీని సూచించే పదం. ‘దాది’కి వివరణాత్మక పదబంధాన్ని జోడించడం వల్ల ఆధునిక పాఠకులకు పాత్ర స్పష్టమవుతుంది.
- source_word: וַתִּשָּׂאֵהוּ
  choice: అతణ్ణి ఎత్తుకొని
  rationale: పారిపోవడానికి ముందు బాలుణ్ణి ఎత్తుకొని మోసిన చర్యను సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: וַתָּנֹס / לָנוּס
  choice: పారిపోయింది / పారిపోతుండగా
  rationale: నూస్ అనే ధాతువు సూచించే ప్రమాదం నుండి పారిపోవడాన్ని రెండు చోట్ల సహజమైన తెలుగు రూపాలతో, భావసామ్యాన్ని నిలుపుతూ అనువదించింది.
- source_word: בְּחָפְזָהּ
  choice: హడావిడిగా
  rationale: ఆమె తొందరపాటు, ఆతురతతో పారిపోతున్న పరిస్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּפֹּל
  choice: అతడు పడిపోయి
  rationale: తరువాతి పుంలింగ ఏకవచన క్రియకు అనుగుణంగా పడిపోయినవాడు బాలుడేనని స్పష్టంగా చూపుతుంది.
- source_word: וַיִּפָּסֵחַ
  choice: కుంటివాడయ్యాడు
  rationale: పడిపోవడం వల్ల అతనికి నడక వైకల్యం ఏర్పడిన ఫలితార్థాన్ని హీబ్రూ క్రియకు అనుగుణంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సౌలు, యోనాతానుల గురించిన వార్తలోని విషయం
  choice: ‘గురించిన వార్త’ అని మాత్రమే అనువదించడం
  alternative: ‘వారి మరణవార్త’ అని స్పష్టీకరించడం
  rationale: సందర్భం వారి ఓటమి, మరణాన్ని సూచించినా, ఈ వాక్యంలోని హీబ్రూ పదబంధం వార్త యొక్క విషయాన్ని స్వయంగా విపులీకరించదు. అందువల్ల మూలంలోని సంక్షిప్తతను, పాఠకుడు సందర్భం ద్వారా గ్రహించే అవకాశాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. శారీరక వైకల్యాన్ని మొదట ‘కాళ్లలో వైకల్యం ఉన్న’ అని వ్యక్తి గౌరవాన్ని కాపాడే భాషలో పేర్కొని, సంఘటన ఫలితాన్ని తెలిపే క్రియ వద్ద మూలానికి దగ్గరగా ‘కుంటివాడయ్యాడు’ అని అనువదించాం. హీబ్రూలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు.
