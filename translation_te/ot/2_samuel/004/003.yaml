  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: te
  text: అయితే బెయేరోతీయులు గిత్తయీముకు పారిపోయి, నేటివరకు అక్కడ పరదేశులుగా నివసిస్తూ వచ్చారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేటివరకు అక్కడ స్థానికేతర నివాసులుగా ఉంటూ వచ్చారు.”
    reason: גָּרִים అనే పదం స్వదేశానికి వెలుపల, స్థానిక హక్కులు సంపూర్ణంగా లేని నివాసులుగా ఉండే భావాన్ని కూడా కలిగి ఉంది.
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: పారిపోయి
  rationale: ברח అనే క్రియకు ‘పారిపోవడం’ అనే స్పష్టమైన అర్థం ఉంది. తెలుగు వాక్యప్రవాహంలో తరువాతి కొనసాగుతున్న స్థితితో సహజంగా కలపడానికి సంయుక్త క్రియారూపం వాడబడింది.
- source_word: הַבְּאֵרֹתִים
  choice: బెయేరోతీయులు
  rationale: బెయేరోతు ప్రాంతానికి చెందిన ప్రజలను సూచించే బహువచన జాతివాచక నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: גִּתָּיְמָה
  choice: గిత్తయీముకు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక రూపం ఆ స్థలంవైపు కదలికను తెలియజేస్తుంది; తెలుగులో ‘-కు’ సహజంగా దానిని వ్యక్తం చేస్తుంది.
- source_word: וַיִּהְיוּ שָׁם
  choice: అక్కడ ... నివసిస్తూ వచ్చారు
  rationale: గతంలో మొదలై కథకుని కాలం వరకు కొనసాగిన స్థితిని ‘నేటివరకు’తో కలిసి ఈ తెలుగు రూపం సహజంగా తెలియజేస్తుంది.
- source_word: גָּרִים
  choice: పరదేశులుగా
  rationale: גור మూలం స్థానికులు కానివారిగా వేరే ప్రాంతంలో నివసించడాన్ని సూచిస్తుంది. ‘పరదేశులుగా’ అనే పదం ఆ సామాజిక స్థితిని సంక్షిప్తంగా నిలుపుతుంది; అది కేవలం స్వల్పకాలిక బస అని నిర్బంధంగా చెప్పదు.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: కథకుని వర్తమాన కాలం వరకు పరిస్థితి కొనసాగిందని తెలిపే హీబ్రూ కాలవ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: וַ
  choice: అయితే
  rationale: వ్యాకరణపరంగా సాధారణ సంధికారకమైనప్పటికీ, సందర్భంలో ముందున్న సమాచారానికి వివరణాత్మక వ్యత్యాసాన్ని పరిచయం చేస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
