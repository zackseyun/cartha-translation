source:
  edition: WLC
  text: וַ/יַּ֨עַן דָּוִ֜ד אֶת רֵכָ֣ב וְ/אֶת בַּעֲנָ֣ה אָחִ֗י/ו בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֵֽרֹתִ֖י וַ/יֹּ֣אמֶר לָ/הֶ֑ם חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: te
  text: 'అప్పుడు దావీదు బేయేరోతీయుడైన రిమ్మోను కుమారులైన రేకాబుకూ, అతని సోదరుడైన బయానాకూ జవాబిచ్చి వారితో ఇలా అన్నాడు: “ప్రతి ఆపద నుండి నా ప్రాణాన్ని విమోచించిన యాహ్వే జీవముతోడు,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה యొక్క వయిక్టోల్ రూపం సంభాషణలో ప్రత్యుత్తరాన్ని పరిచయం చేస్తుంది; తెలుగు కథనశైలిలో ‘జవాబిచ్చాడు’ సహజంగా ఉంది.
- source_word: רֵכָב
  choice: రేకాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בַּעֲנָה
  choice: బయానా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; మధ్యనున్న గొంతు ధ్వనిని తెలుగులో సహజంగా సూచించేందుకు ‘యా’ వాడాం.
- source_word: אָחִיו
  choice: అతని సహోదరుడు
  rationale: ఏకవచన 3వ పురుష ప్రత్యయం సహజంగా బయానాను రేకాబు సహోదరుడిగా సూచిస్తుంది; సంబంధాన్ని స్పష్టంగా ఉంచాం.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: బేయేరోతీయుడైన రిమ్మోను కుమారులు
  rationale: నిర్మాణ శ్రేణి వారి తండ్రిని, జాతివాచక రూపం అతని ఊరిని సూచిస్తుంది; తెలుగు వాక్యక్రమంలో సహజంగా అమర్చాం.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది గంభీరమైన ప్రమాణ సూత్రం; తెలుగులో ప్రమాణార్థాన్ని సహజంగా, బలంగా తెలియజేసే రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఇచ్చాం.
- source_word: פָּדָה
  choice: విమోచించిన
  rationale: פדה లోని విడిపింపు/వెలచెల్లించి రక్షించడం అనే బరువును ‘విమోచించిన’ నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఇక్కడ נפש అమూర్తమైన ‘ఆత్మ’ కంటే ప్రమాదంలో ఉన్న దావీదు జీవాన్ని సూచిస్తుంది; ‘నా ప్రాణాన్ని’ సందర్భోచితం.
- source_word: מִכָּל צָרָה
  choice: అన్ని కష్టాల నుండి
  rationale: צרה ఆపద, ఇబ్బంది, సంకటాన్ని సూచిస్తుంది; כל యొక్క సమగ్ర భావాన్ని ‘అన్ని’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: נַפְשִׁי యొక్క భావం
  choice: నా ప్రాణాన్ని
  alternative: నా ఆత్మను / నన్ను
  rationale: ఈ సందర్భంలో దావీదు ఎదుర్కొన్న బాహ్య ఆపదల నుండి అతని జీవితం కాపాడబడటమే భావం; శరీరానికి వేరైన ఆత్మ అనే భావాన్ని అనవసరంగా ప్రవేశపెట్టలేదు.
- issue: פָּדָה యొక్క రక్షణార్థక బరువు
  choice: విమోచించిన
  alternative: విడిపించిన / రక్షించిన
  rationale: మూలపదంలోని విమోచన భావాన్ని నిలుపుతూ, ఈ సందర్భంలోని ఆపద నుండి విడిపింపును కూడా సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ప్రమాణ వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాతో ముగించాం. మూలపాఠంలో లేని పాదసూచికను చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో సూచిక లేదు.
