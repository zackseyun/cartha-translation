  naturalness: భాష ఆధునిక ప్రామాణిక తెలుగులో సహజంగానే ఉంది. అయినా ‘అయితే’ మూలంలోని వరుస చర్యల అనుసంధానానికి అవసరం లేని బలమైన విరోధాన్ని ఇస్తుంది; సెమికోలన్‌తో చర్యల వరుసను చూపడం సహజం. చివరి ఆశ్చర్యార్థకం కంటే సూటి వ్యంగ్య వాక్యం గంభీరమైన కథనశైలికి తగినది.
