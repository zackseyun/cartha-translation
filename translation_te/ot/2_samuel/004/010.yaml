source:
  edition: WLC
  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: te
  text: “ఇదిగో, సౌలు చనిపోయాడు” అని ఒకడు నాకు చెప్పినప్పుడు, అతడు తన దృష్టిలో తాను శుభవార్త తెచ్చినవాడినని అనుకున్నాడు.[a] నేను అతణ్ణి పట్టుకొని సిక్లగులో చంపాను; అతని వార్తకు ప్రతిఫలంగా నేను అతనికి ఇచ్చింది అదే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నాకు ‘ఇదిగో, సౌలు చనిపోయాడు’ అని తెలిపినవాడు తన దృష్టిలో శుభవార్త తెచ్చేవాడిలా ఉన్నాడు.”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా, వ్యంగ్యార్థంతో ఉంది. వార్తకు ప్రతిఫలం ఆశించిన సందేశకుడికి దావీదు ఇచ్చిన ‘ప్రతిఫలం’ అతన్ని చంపడమే అని సందర్భం సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: చెప్పినప్పుడు
  rationale: ఇక్కడ כִּי ముందున్న మాటకు ఆధారంగా ఒక నిర్దిష్ట సంఘటనను పరిచయం చేస్తోంది. తెలుగు వాక్యప్రవాహంలో కాలసందర్భాన్ని తెలిపే ‘చెప్పినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: ఒకడు నాకు చెప్పినప్పుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం అక్షరార్థంగా ‘నాకు తెలిపినవాడు’ అని అర్థం. ఆధునిక తెలుగులో సంఘటనను సహజంగా చెప్పేందుకు ‘ఒకడు నాకు చెప్పినప్పుడు’ అని అనువదించాం.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: “ఇదిగో, సౌలు చనిపోయాడు”
  rationale: הִנֵּה శ్రద్ధను ఆకర్షించే మాట కాబట్టి ‘ఇదిగో’ అని ఇచ్చాం. מֵת సౌలు మరణించిన ఫలితస్థితిని సూచిస్తుంది; తెలుగులో ‘చనిపోయాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: తన దృష్టిలో తాను శుభవార్త తెచ్చినవాడినని అతడు అనుకున్నాడు
  rationale: בְּעֵינָיו అక్షరార్థంగా ‘అతని కళ్లలో’ అయినా, ఇక్కడ ‘అతని స్వంత అంచనాలో’ అనే నుడికారం. כִמְבַשֵּׂר వార్తను, సందర్భానుసారంగా శుభవార్తను తెచ్చేవాడిని సూచిస్తుంది. సందేశకుడు దానిని శుభవార్తగా భావించాడనే వ్యక్తిగత అంచనాను అనువాదం నిలుపుతుంది.
- source_word: וָאֹחֲזָה בוֹ
  choice: నేను అతణ్ణి పట్టుకొని
  rationale: אָחַז గట్టిగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే భావం ఇస్తుంది. ‘పట్టుకొని’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וָאֶהְרְגֵהוּ
  choice: చంపాను
  rationale: హీబ్రూ క్రియ నేరుగా ‘చంపడం’ అని అర్థం; మూలంలో స్పష్టంగా లేని న్యాయపరమైన భావాన్ని జోడించలేదు.
- source_word: בְּצִקְלָג
  choice: సిక్లగులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: అతని వార్తకు నేను ఇచ్చిన బహుమానం అదే!
  rationale: హీబ్రూ ముగింపు సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది. בְּשֹׂרָה వార్తకు లభించే ప్రతిఫలాన్ని కూడా సూచించగలదు. సందేశకుడు ఆశించిన బహుమానానికి బదులుగా అతనికి మరణమే దక్కిందనే వ్యంగ్యాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
