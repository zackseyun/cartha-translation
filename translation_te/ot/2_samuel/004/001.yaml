source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: te
  text: షౌలు కుమారుడు అబ్నేరు హెబ్రోనులో మరణించాడని విన్నప్పుడు, షౌలు కుమారుని చేతులు సడలిపోయాయి[a]; ఇశ్రాయేలంతా కలవరపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతని చేతులు సడలిపోయాయి”; అంటే అతడు బలాన్ని లేదా ధైర్యాన్ని కోల్పోయాడు.
    reason: హీబ్రూ నుడికారంలోని శరీరరూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని ఉద్దేశాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: షౌలు కుమారుడు
  rationale: మూలంలోని నిర్మాణబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఈ వచనంలో లేని ఇష్బోషెతు పేరును చేర్చదు.
- source_word: כִּי מֵת אַבְנֵר
  choice: అబ్నేరు ... చనిపోయాడని
  rationale: כִּי ఇక్కడ విన్న విషయం ఏమిటో పరిచయం చేస్తుంది; מֵת అప్పటికే పూర్తయిన మరణాన్ని తెలుపుతుంది.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: స్థలాన్ని సూచించే בְּకు సహజమైన తెలుగు రూపం.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: అతని చేతులు సడలిపోయాయి
  rationale: బలం లేదా ధైర్యం కోల్పోవడాన్ని తెలిపే హీబ్రూ శరీరరూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతా
  rationale: ప్రజలను సమష్టిగా సూచించే మూలంలోని జాతీయ సముదాయ పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: נִבְהָלוּ
  choice: కలవరపడింది
  rationale: భయంతో లేదా ఆందోళనతో చలించిపోవడం అనే క్రియ భావాన్ని మితంగా, సహజంగా వ్యక్తం చేస్తుంది.
