translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథనానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని పరోక్ష గుర్తింపును, సమష్టి ‘ఇశ్రాయేలు’ ప్రయోగాన్ని, చేతులు సడలిపోవడం అనే నుడికారాన్ని నిలుపుకుంది.
