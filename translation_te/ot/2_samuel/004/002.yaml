  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ వాక్య నిర్మాణాన్ని యథాశక్తి నిలుపుతూ, పొడవైన వాక్యాన్ని పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. ఆరంభ ו కు సందర్భాన్ని బట్టి ప్రత్యేకంగా ‘ఇప్పుడు’ లేదా ‘మరి’ చేర్చలేదు.
