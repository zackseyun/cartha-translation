source:
  edition: WLC
  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: te
  text: సౌలు కుమారునికి దాడి దళాల అధిపతులైన ఇద్దరు మనుషులు ఉండేవారు. ఒకరి పేరు బానా, రెండవవాని పేరు రేకాబు. వారు బెన్యామీను వంశానికి చెందిన బేరోతీయుడైన రిమ్మోను కుమారులు; ఎందుకంటే బేరోతు కూడా బెన్యామీనుకు చెందినదిగా పరిగణించబడేది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీనుకు చెందినదిగా లెక్కించబడేది.”
    reason: תֵּחָשֵׁב అనే పదానికి “పరిగణించబడేది”తో పాటు “లెక్కించబడేది” అనే సమీప ప్రత్యామ్నాయ అర్థాన్ని చూపుతుంది.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: ఇద్దరు మనుషులు
  rationale: పురుషులను సూచించే హెబ్రీ బహువచనాన్ని సహజమైన, లింగ-నిర్దిష్ట తెలుగు రూపంలో అందిస్తుంది.
- source_word: שָׂרֵי גְדוּדִים
  choice: దాడి దళాల అధిపతులు
  rationale: שָׂרֵי అనే నాయకత్వ భావాన్నీ, גְדוּדִים లోని క్రమబద్ధ సైన్యం కంటే దాడులు చేసే బృందాల భావాన్నీ నిలుపుతుంది.
- source_word: בֶן שָׁאוּל
  choice: సౌలు కుమారునికి
  rationale: ముందటి వచనంలోని ఇష్బోషెతును సూచించే ఏకవచన సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: ఒకని పేరు ... రెండవవాని పేరు
  rationale: హెబ్రీలోని పునరుక్త నామకరణ సూత్రాన్ని, ముఖ్యంగా 'రెండవవాడు' అనే భావాన్ని, చదవదగిన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי רִמּוֹן
  choice: రిమ్మోను కుమారులు
  rationale: ఇద్దరి పితృసంబంధ గుర్తింపును నేరుగా ప్రతిబింబిస్తుంది.
- source_word: הַבְּאֶרֹתִי
  choice: బేరోతీయుడు
  rationale: బేరోతు ప్రాంతానికి చెందినవాడని తెలిపే హెబ్రీ జాతి/స్థలనామ విశేషణానికి సహజ తెలుగు రూపం.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: బెన్యామీను వంశానికి చెందిన
  rationale: అక్షరార్థమైన 'బెన్యామీను కుమారులలోనివాడు' అనే గోత్ర సంబంధాన్ని సాధారణ పాఠకునికి స్పష్టమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי גַּם
  choice: ఎందుకంటే ... కూడా
  rationale: తర్వాతి వాక్యం ముందటి గోత్ర గుర్తింపుకు వివరణ ఇస్తున్న సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּאֵרוֹת
  choice: బేరోతు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: బెన్యామీనుకు చెందినదిగా పరిగణించబడేది
  rationale: నిఫాల్ రూపంలోని 'లెక్కించబడుట/భావించబడుట' మరియు עַל తెలిపే అనుబంధ భావం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
