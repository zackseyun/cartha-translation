  text: וַ/יָּבֹ֣אוּ הַ/בַּ֗יִת וְ/הֽוּא שֹׁכֵ֤ב עַל מִטָּת/וֹ֙ בַּ/חֲדַ֣ר מִשְׁכָּב֔/וֹ וַ/יַּכֻּ֨/הוּ֙ וַ/יְמִתֻ֔/הוּ וַ/יָּסִ֖ירוּ אֶת רֹאשׁ֑/וֹ וַ/יִּקְחוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יֵּֽלְכ֛וּ דֶּ֥רֶךְ הָ/עֲרָבָ֖ה כָּל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: te
  text: వారు ఇంట్లోకి వచ్చేసరికి, అతడు తన పడకగదిలోని మంచం మీద పడుకొని ఉన్నాడు.[a] వారు అతనిని కొట్టి, చంపారు. తరువాత వారు అతని తలను వేరు చేసి,[b] అతని తలను తీసుకొని, అరాబా[c] మార్గంలో రాత్రంతా ప్రయాణించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నిద్రించే గదిలోని మంచం మీద.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని తలను నరికివేసి.” హీబ్రూ క్రియకు అక్షరార్థంగా “తొలగించి” లేదా “వేరు చేసి” అని అర్థం; ఈ సందర్భంలో శిరచ్ఛేదం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: c
    text: అరాబా అనేది యోర్దాను లోయను, దానికి దక్షిణంగా కొనసాగే పల్లపు మైదాన ప్రాంతాన్ని సూచించే భౌగోళిక పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: వారు ఇంట్లోకి వచ్చినప్పుడు
  rationale: בוא తో కూడిన הַבַּיִת ఇంట్లోకి ప్రవేశించడాన్ని సూచిస్తుంది. తరువాతి పరిస్థితివాచక ఉపవాక్యంతో సహజంగా కలవడానికి ‘వచ్చినప్పుడు’ అని అనువదించాం.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: అతడు ... మంచం మీద పడుకొని ఉన్నాడు
  rationale: ఈ ఉపవాక్యం వారు వచ్చిన సమయంలో అతని స్థితిని తెలియజేస్తుంది; ‘పడుకొని ఉన్నాడు’ ఆధునిక తెలుగులో సహజమైన నిరంతర స్థితి వ్యక్తీకరణ.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: తన పడకగదిలోని
  rationale: ఈ నిర్మాణం అతడు నిద్రించే గదిని సూచిస్తుంది. ‘పడకగది’ సంక్షిప్తమైన, సహజమైన సమానార్థక రూపం.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: వారు అతనిని కొట్టి చంపారు
  rationale: రెండు హీబ్రూ క్రియల క్రమాన్ని ‘కొట్టి’ మరియు ‘చంపారు’గా నిలిపి, తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: అతని తలను వేరు చేసి
  rationale: హిఫిల్ రూపంలోని סור ప్రాథమికంగా తొలగించడం లేదా వేరు చేయడం అని అర్థం. సందర్భంలో శిరచ్ఛేదం సూచితమైనా, ‘వేరు చేసి’ మూలంలోని కొంత సాధారణతను కాపాడుతుంది.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: దానిని తీసుకొని
  rationale: לקח సాధారణంగా ‘తీసుకొను.’ తెలుగులో అదే నామవాచకాన్ని వెంటనే మళ్లీ పలకడం కంటే సర్వనామం సహజంగా ఉన్నా, తలను తీసుకెళ్లారనే భావం స్పష్టంగా ఉంటుంది.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: అరాబా మార్గంలో ... ప్రయాణించారు
  rationale: דֶּרֶךְ స్థలపేరుతో కలిసి ఆ ప్రాంతం గుండా లేదా ఆ దారిలో వెళ్లడాన్ని సూచిస్తుంది. అరాబా భౌగోళిక నామాన్ని లిప్యంతరీకరించాం.
- source_word: כָּל הַלָּיְלָה
  choice: రాత్రంతా
  rationale: మొత్తం రాత్రి పొడవునా అనే హీబ్రూ కాలవ్యక్తీకరణకు సహజమైన తెలుగు రూపం.
