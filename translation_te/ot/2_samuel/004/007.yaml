translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హింసను మూలపాఠం చెప్పినంత స్పష్టంగా ఉంచి, అదనపు తీవ్రతను చేర్చలేదు. ప్రధాన పాఠంలో అన్ని పాదసూచిక గుర్తులు చేర్చబడ్డాయి.
