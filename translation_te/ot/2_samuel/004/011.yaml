  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: te
  text: దుర్మార్గులు ఒక నీతిమంతుణ్ణి అతని సొంత ఇంట్లో, అతని మంచం మీద చంపినప్పుడు, ఇంకెంతగా[a] ఇప్పుడు నేను అతని రక్తానికి మీ చేతులనుండి లెక్క అడిగి[b], మిమ్మల్ని దేశం నుండి నిర్మూలించకూడదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇంకెంతగా” అనేది 10వ వచనంలోని ఘటన కంటే ఈ హత్య మరింత ఘోరమైనదని చూపించే తారతమ్య వాదం.
    reason: discourse_note
  - marker: b
    text: “అతని రక్తానికి మీ చేతులనుండి లెక్క అడగడం” అంటే అతని హత్యకు మిమ్మల్ని బాధ్యులుగా నిలబెట్టడం. ఇది హీబ్రూ న్యాయపరమైన నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: చంపినప్పుడు, ఇంకెంతగా
  rationale: 10వ వచనంలోని తక్కువ తీవ్రతగల ఘటన నుండి ఇక్కడి మరింత ఘోరమైన ఘటనకు దావీదు చేసే తారతమ్య వాదాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: దుర్మార్గులు
  rationale: వారి చర్యపై ఉన్న స్పష్టమైన నైతిక ఖండనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָרְגוּ
  choice: చంపినప్పుడు
  rationale: మూలంలోని సాధారణ ‘చంపు’ అనే అర్థాన్నే ఉంచి, సందర్భం సూచించే హత్యను పదంలోనే మరింత నిర్దిష్టం చేయకుండా ఉంటుంది.
- source_word: אִישׁ צַדִּיק
  choice: ఒక నీతిమంతుణ్ణి
  rationale: צַדִּיק యొక్క ప్రాథమిక ‘నీతిమంతుడు/న్యాయవంతుడు’ భావాన్ని నిలుపుతుంది; ‘నిర్దోషి’ అని వ్యాఖ్యానాత్మకంగా కుదించదు.
- source_word: בְּבֵיתוֹ
  choice: అతని సొంత ఇంట్లో
  rationale: స్వామ్య ప్రత్యయాన్ని స్పష్టంగా తెలియజేస్తూ, బాధితుని వ్యక్తిగత నివాసంలోనే జరిగిన దారుణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל מִשְׁכָּבוֹ
  choice: అతని మంచం మీద
  rationale: పడుకునే స్థలాన్ని సూచించే పదానికి ప్రత్యక్షమైన, సందర్భోచిత అనువాదం.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: నేను అతని రక్తానికి మీ చేతిలో లెక్క అడిగి
  rationale: రక్తపాతానికి బాధ్యులుగా నిలబెట్టే న్యాయపరమైన హీబ్రూ నుడికారాన్ని దాని స్పష్టమైన ‘రక్తం/చేతి’ రూపకంతో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: דָּמוֹ
  choice: అతని రక్తానికి
  rationale: అన్యాయంగా తీసిన ప్రాణం మరియు దానికి సంబంధించిన రక్తాపరాధం రెండింటినీ సూచించే పాత నిబంధన న్యాయపరమైన భాషను కాపాడుతుంది.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: మిమ్మల్ని దేశం నుండి నిర్మూలించకూడదు
  rationale: ఇది కేవలం ఆచారపరమైన శుద్ధి కాక, నేరస్థులను న్యాయతీర్పు ద్వారా దేశం నుండి తొలగించడమని బలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రక్తాన్ని చేతిలోనుండి అడగడం అనే న్యాయపరమైన నుడికారాన్ని వ్యాఖ్యానాత్మకంగా మార్చాలా
  choice: ‘అతని రక్తానికి మీ చేతిలో లెక్క అడిగి’ అనే రక్త-బాధ్యత భాషను ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘అతని రక్తానికి మిమ్మల్ని బాధ్యులుగా చేసి’ లేదా ‘అతని రక్తానికి ప్రతీకారం తీర్చి’
  rationale: మూలంలోని న్యాయపరమైన, స్పష్టమైన రూపకాన్ని కాపాడుతుంది; దీనిని వ్యక్తిగత ప్రతీకార భావానికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయతీర్పు ధోరణి ఉంచబడింది. ‘నీతిమంతుడు,’ ‘రక్తం,’ ‘చేతి,’ ‘దేశం’ వంటి మూలపాఠ్యపు న్యాయపరమైన, ధార్మిక ప్రతిరూపాలు కాపాడబడ్డాయి; అసహజమైన పదానువాదాన్ని తగ్గించడానికి వాక్యక్రమం తెలుగుకు అనుగుణంగా మార్చబడింది.
