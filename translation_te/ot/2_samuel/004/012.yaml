source:
  edition: WLC
  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: te
  text: అప్పుడు దావీదు యువకులకు ఆజ్ఞాపించాడు. వారు ఆ ఇద్దరినీ చంపి, వారి చేతులనూ కాళ్లనూ నరికి వేశారు; హెబ్రోనులోని కొలను దగ్గర వారిని వేలాడదీశారు.[a] ఇష్బోషెతు తలనైతే తీసుకెళ్లి, హెబ్రోనులో అబ్నేరు సమాధిలో పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలను మీద వారిని వేలాడదీశారు.” ఇక్కడి హీబ్రూ విభక్తి కొలను దగ్గర అనే సాధారణ స్థలార్థాన్నీ, కొలను మీద అనే అర్థాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: అప్పుడు దావీదు యువకులకు ఆజ్ఞాపించాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; అందుకే సహజమైన తెలుగు కథన క్రమానికి ‘అప్పుడు’ వాడబడింది. נְעָרִים అనే పదంలోని ప్రాథమిక ‘యువకులు’ భావాన్ని నిలిపి ఉంచాం; సందర్భానుసారంగా వారు దావీదు సేవకులు లేదా పరిచారకులు కావచ్చు.
- source_word: וַיַּהַרְגוּם
  choice: వారు ఆ ఇద్దరినీ చంపి
  rationale: הרג సాధారణంగా ‘చంపు’ అని అర్థం. పూర్వసందర్భంలో ఉన్న ఇద్దరు సహోదరులే కర్మ అని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘ఆ ఇద్దరినీ’ అని ఇచ్చాం.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: వారి చేతులనూ కాళ్లనూ నరికి
  rationale: קצץ అంటే నరికివేయడం లేదా కోసివేయడం. రెండు శరీర భాగాలనూ మూలపాఠం స్పష్టంగా పేర్కొన్నందున రెండింటినీ నిలిపాం.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: కొలను దగ్గర వారిని వేలాడదీశారు
  rationale: תלה అంటే ‘వేలాడదీయు’. עַל ఇక్కడ కొలనుకు సమీపంలోని ప్రదేశాన్ని సూచించవచ్చు; సహజమైన ప్రధాన పాఠంగా ‘కొలను దగ్గర’ ఎంచుకొని, ‘కొలను మీద’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: నగరంలో జరిగిన స్థలాన్ని తెలుగులో సహజంగా సూచించడానికి ‘హెబ్రోనులో’ అని అనువదించాం.
- source_word: וְאֵת רֹאשׁ אִישׁ בֹּשֶׁת לָקָחוּ
  choice: ఇష్బోషెతు తలనైతే తీసుకెళ్లి
  rationale: కర్మపదాన్ని ముందుంచిన హీబ్రూ నిర్మాణం తలపై ప్రత్యేక దృష్టి పెడుతుంది. తెలుగులో ‘తలనైతే’ ఆ వ్యత్యాసాన్ని సహజంగా చూపుతుంది. לקח యొక్క ప్రాథమిక భావాన్ని సందర్భానికి తగిన ‘తీసుకెళ్లి’గా ఇచ్చాం.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: అబ్నేరు సమాధిలో పాతిపెట్టారు
  rationale: కర్మ ఇష్బోషెతు తల అని సందర్భం స్పష్టం చేస్తుంది. קֶבֶר‌కు గౌరవప్రదమైన, సహజమైన తెలుగు పదం ‘సమాధి’; קבר క్రియకు ‘పాతిపెట్టారు’ వాడాం.
theological_decisions:
- issue: దావీదు చర్యకు నైతిక లేదా న్యాయపరమైన వ్యాఖ్యానాన్ని జోడించడం
  choice: మూలపాఠంలోని నిరాడంబరమైన కథన వర్ణనను మాత్రమే నిలిపి ఉంచడం
  alternative: ‘మరణశిక్ష అమలు చేయించాడు’ వంటి స్పష్టమైన న్యాయపరమైన పదజాలం చేర్చడం
  rationale: ఈ వాక్యం దావీదు ఆజ్ఞను, హంతకుల మరణాన్ని, వారి అవయవాలను నరికి బహిరంగంగా వేలాడదీయడాన్ని నివేదిస్తుంది; అయితే ఇదే వాక్యంలో ప్రత్యక్ష నైతిక లేదా దైవశాస్త్రీయ తీర్పు ఇవ్వదు. కాబట్టి కథనంలోని కఠినతను తగ్గించకుండా, అదనపు వ్యాఖ్యానాన్ని కూడా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, కానీ కథన గాంభీర్యం మరియు మూలంలోని కఠిన స్వరూపం నిలిచేలా అనువదించబడింది. వ్యక్తుల పేర్లు ‘ఇష్బోషెతు’, ‘అబ్నేరు’; స్థలనామం ‘హెబ్రోను’గా రూపాంతరీకరించబడ్డాయి.
