  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: te
  text: వారు అక్కడ గోధుమలు తీసుకొనేవారిగా ఇంటి లోపలి భాగం వరకు వచ్చి, అతని కడుపు ప్రాంతంలో[a] దెబ్బకొట్టారు. తరువాత రేకాబు, అతని సోదరుడు బానా తప్పించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయిక అనువాదాల్లో, “ఐదవ పక్కటెముక కింద” అని ఉంటుంది. హీబ్రూ పదం సాధారణంగా ఉదరం లేదా కడుపు ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: వారు అక్కడ
  rationale: హీబ్రూ పదబంధంలోని స్థలసూచక, కథనాన్ని ముందుకు నడిపించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పాతకాలపు ఆశ్చర్యోద్గారాన్ని అనవసరంగా చేర్చదు.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: ఇంటి లోపలి భాగం వరకు వచ్చి
  rationale: עַד תּוֹךְ అనే పదబంధం ఇంటి అంతర్భాగం వరకు చొచ్చుకొని వచ్చిన భావాన్ని ఇస్తుంది. ఈ అనువాదం గమనాన్ని, లోపలి ప్రదేశాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לֹקְחֵי חִטִּים
  choice: గోధుమలు తీసుకుంటూ
  rationale: ఇది సంక్షిప్తమైన కర్తృవాచక క్రియారూపం. సందర్భంలో గోధుమలు తీసుకునే నెపంతో వచ్చారనే భావం సాధ్యమైనప్పటికీ, హీబ్రూ పాఠంలో స్పష్టంగా లేని ‘నెపంతో’ లేదా ‘తీసుకునేవారిలా’ అనే వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: וַיַּכֻּהוּ
  choice: అతనిని … కొట్టారు
  rationale: נכה యొక్క ప్రాథమిక అర్థం ‘కొట్టు/దెబ్బకొట్టు.’ సందర్భంలో అది ప్రాణాంతక దెబ్బ అయినప్పటికీ, ‘చంపారు’ లేదా ఆయుధాన్ని సూచించే ‘పొడిచారు’ అని విస్తరించలేదు.
- source_word: אֶל הַחֹמֶשׁ
  choice: కడుపులో
  rationale: חֹמֶשׁ ఇక్కడ ఉదరం లేదా కడుపు ప్రాంతాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి స్పష్టమైన ‘కడుపు’ను ఎంచుకుని, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: తరువాత రేకాబు, అతని సోదరుడు బయనా
  rationale: హీబ్రూ వాక్యక్రమాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘అతని సోదరుడు’ అనేది రేకాబును సూచించేలా ఉంచింది. పేర్లు హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
- source_word: נִמְלָטוּ
  choice: తప్పించుకున్నారు
  rationale: నిఫాల్ రూపం విజయవంతంగా తప్పించుకొని వెళ్లిన భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, సంక్షిప్తమైన పదప్రయోగం.
