translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ పాఠంలోని సంక్షిప్తతను నిలుపుతూ, గోధుమలు తీసుకోవడం ఒక నెపమని ప్రధాన పాఠంలో స్పష్టీకరించలేదు; అలాగే దెబ్బకు ఉపయోగించిన ఆయుధాన్ని ఊహించి చేర్చలేదు.
