  naturalness: The draft is fluent modern Telugu. The revision retains its clear, dignified poetic parallelism while making the fire and coals imagery more exact.
  terminology: ‘ముక్కుపుటాలు’ appropriately preserves the concrete anthropomorphic image, and the footnote responsibly records the idiomatic anger sense without imposing it. ‘బొగ్గులు’ is the more accurate Telugu term for גֶּחָלִים.
