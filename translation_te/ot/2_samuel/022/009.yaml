    rationale: The Hebrew has ‘fire from his mouth’ followed by a feminine singular participial/verbal form meaning ‘consuming.’ Rendering it as ‘దహించే అగ్ని ... వెలువడింది’ preserves both the active consuming quality and the source imagery without the extraneous sequential ‘came and burned.’
