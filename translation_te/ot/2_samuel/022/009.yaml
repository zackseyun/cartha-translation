- from: ఆయన ముక్కుపుటాలనుండి పొగ పైకి లేచింది[a]; ఆయన నోటినుండి అగ్ని వచ్చి దహించింది; ఆయననుండి నిప్పులు రగులుకున్నాయి.
  to: ఆయన ముక్కుపుటాల నుండి పొగ పైకి లేచింది[a]; ఆయన నోటి నుండి దహించే అగ్ని వెలువడింది; ఆయన నుండి బొగ్గులు రగిలాయి.
