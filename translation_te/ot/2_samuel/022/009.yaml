source:
  edition: WLC
  text: עָלָ֤ה עָשָׁן֙ בְּ/אַפּ֔/וֹ וְ/אֵ֥שׁ מִ/פִּ֖י/ו תֹּאכֵ֑ל גֶּחָלִ֖ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: te
  text: ఆయన ముక్కుపుటాల నుండి పొగ పైకి లేచింది[a]; ఆయన నోటి నుండి దహించే అగ్ని వెలువడింది; ఆయన నుండి బొగ్గులు రగిలాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ముక్కు నుండి.’ ఇక్కడ ‘ముక్కు/ముక్కుపుటం’కు వాడిన హెబ్రీ పదం నానుడిగా ‘కోపం’ అని కూడా అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: పొగ పైకి లేచింది
  rationale: עָלָה సూచించే పైకి కదలడాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, కావ్యాత్మక దృశ్యాన్ని నిలుపుతుంది.
- source_word: בְּאַפּוֹ
  choice: ఆయన ముక్కుపుటాలనుండి
  rationale: אַף అనే పదానికి ‘ముక్కు/ముక్కుపుటం’ అనే శరీరార్థంతో పాటు ‘కోపం’ అనే నానుడి అర్థమూ ఉంది. ఇక్కడ ‘ఆయన నోటినుండి’ అనే సమాంతర ప్రయోగం కారణంగా స్పష్టమైన శరీర దృశ్యానికే ప్రాధాన్యం ఇచ్చాం; పొగ బయటకు రావడాన్ని తెలుగులో సహజంగా చూపేందుకు בְּ ను ‘నుండి’గా వ్యక్తం చేశాం.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: ఆయన నోటినుండి అగ్ని వచ్చి దహించింది
  rationale: మూలంలోని అగ్ని క్రియాశీలంగా భక్షించే/దహించే భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన క్రియారూపాన్ని వాడాం. ‘ముక్కుపుటాలనుండి’ అనే ముందు పాదంతో ఉన్న సమాంతరతను కూడా కాపాడాం.
- source_word: גֶּחָלִים
  choice: నిప్పులు
  rationale: ఇక్కడ మండుతున్న బొగ్గులు లేదా అగ్నికణాల భావం ఉంది. ‘నిప్పులు’ సాధారణ పాఠకులకు సహజంగా ఉండి, తరువాతి ‘రగులుకున్నాయి’తో కలసి మండే బొగ్గుల దృశ్యాన్ని అందిస్తుంది.
- source_word: בָּעֲרוּ מִמֶּנּוּ
  choice: ఆయననుండి నిప్పులు రగులుకున్నాయి
  rationale: מן ను మూలం లేదా ఉద్గమం సూచించే ‘నుండి’గా నిలిపి, בָּעֲרוּ యొక్క మండడం/రగలడం అనే సజీవ భావాన్ని ‘రగులుకున్నాయి’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: దేవుని ప్రత్యక్షతలో మానవరూప వర్ణన
  choice: ‘ముక్కుపుటాలు,’ ‘నోరు,’ వాటినుండి వెలువడే పొగ, అగ్ని అనే స్పష్టమైన దృశ్యాన్ని యథాతథంగా నిలిపాం.
  alternative: ‘ముక్కు’ అనే పదాన్ని నానుడిగా తీసుకొని ‘ఆయన కోపంలోనుండి’ అని భావానువాదం చేయడం.
  rationale: ఈ కావ్యాత్మక దైవప్రత్యక్షత దేవుని ఉగ్రతను, శక్తిని మానవరూప దృశ్యంతో చిత్రిస్తుంది. దానిని కేవలం ‘కోపం’ అనే అమూర్త భావంగా మార్చకుండా ఉంచడం ద్వారా హెబ్రీ సమాంతరత, కావ్యబలం, అర్థంలోని ఉద్రిక్తత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కావ్యాత్మక గాంభీర్యం తగ్గకుండా అనువదించాం. అతి సంస్కృత పదజాలాన్ని నివారించి, మూలంలోని మూడు సజీవ అగ్ని-దృశ్యాలను సంక్షిప్త సమాంతర వాక్యభాగాలుగా నిలిపాం.
