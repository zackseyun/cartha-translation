  text: וְ/אֶשְׁחָקֵ֖/ם כַּ/עֲפַר אָ֑רֶץ כְּ/טִיט חוּצ֥וֹת אֲדִקֵּ֖/ם אֶרְקָעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: te
  text: వారిని నేల ధూళిలా నలిపివేశాను; వీధుల బురదలా వారిని చితకగొట్టి తొక్కివేశాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని చదును చేసి పరచివేశాను.” చివరి హీబ్రూ క్రియకు కొట్టి చదును చేయడం లేదా పరచడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: వారిని నలిపివేశాను
  rationale: שׁחק అనే క్రియ ఇక్కడ వారిని ధూళిలా మెత్తగా నలిపివేయడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం హింసాత్మక బలాన్నీ ఉపమానాన్నీ సహజంగా నిలుపుతుంది.
- source_word: כַּעֲפַר אָרֶץ
  choice: నేల ధూళిలా
  rationale: עָפָר అంటే ధూళి లేదా వదులైన మట్టి; אֶרֶץ ఇక్కడ నేల అనే భావాన్ని ఇస్తుంది. ‘నేల ధూళి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: כְּטִיט חוּצוֹת
  choice: వీధుల బురదలా
  rationale: טִיט అంటే బురద లేదా ఊబి; חוּצוֹת పట్టణంలోని వీధులు లేదా బహిరంగ ప్రదేశాలను సూచిస్తుంది. సందర్భంలో ‘వీధుల బురద’ స్పష్టమైన దృశ్యాన్ని అందిస్తుంది.
- source_word: אֲדִקֵּם
  choice: వారిని చితకగొట్టి
  rationale: דקק యొక్క హిఫీల్ రూపం మెత్తగా నలగగొట్టడం లేదా పొడిచేయడం అనే భావాన్ని ఇస్తుంది. మొదటి క్రియతో అనవసర పునరుక్తి లేకుండా తీవ్రతను కొనసాగించడానికి ‘చితకగొట్టి’ ఎంచుకోబడింది.
- source_word: אֶרְקָעֵם
  choice: తొక్కివేశాను
  rationale: רקע కొట్టడం, తొక్కడం, చదును చేయడం లేదా పరచడం వంటి భావాలను కలిగి ఉండగలదు. యుద్ధసందర్భంలో వీధి బురద ఉపమానంతో ‘తొక్కివేశాను’ సహజంగా సరిపోతుంది; ఇతర సాధ్య భావం పాదసూచికలో నిలుపబడింది.
