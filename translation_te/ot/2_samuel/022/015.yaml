source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח חִצִּ֖ים וַ/יְפִיצֵ֑/ם בָּרָ֖ק ו/יהמ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: te
  text: 'ఆయన బాణాలను పంపి వారిని చెదరగొట్టాడు;

    మెరుపుతో వారిని కలవరపరిచాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, రెండు క్రియల ప్రభావాన్ని సూచిస్తూ: “వారిని ఓడించి తరిమివేశాడు.”'
    reason: వַיְפִיצֵם మరియు וַיְהֻמֵּםలకు సందర్భానుసారమైన సైనిక ఫలితార్థక ప్రత్యామ్నాయాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో ఉన్న ‘చెదరగొట్టాడు’ మరియు ‘కలవరపరిచాడు’ అనే విభిన్న భావాలను కలపదు.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שׁלח అనే క్రియకు ఉన్న సాధారణమైన ‘పంపు’ భావాన్ని నిలుపుతుంది; బాణాల సందర్భంలో ‘వేయు’ అని మరింత నిర్దిష్టం చేయకుండా హీబ్రూ కవితా చిత్రాన్ని కాపాడుతుంది.
- source_word: חִצִּים
  choice: బాణాలను
  rationale: חציםకు సహజమైన ప్రామాణిక తెలుగు పదం; యుద్ధసంబంధమైన స్పష్ట చిత్రాన్ని నిలుపుతుంది.
- source_word: וַיְפִיצֵם
  choice: వారిని చెదరగొట్టాడు
  rationale: కారణార్థకంగా ‘చెదరగొట్టు/చెల్లాచెదురు చేయు’ అనే భావాన్ని వ్యక్తం చేస్తుంది. బహువచన ప్రత్యయం పరిసర సందర్భంలోని శత్రువులను సూచిస్తుంది.
- source_word: בָּרָק
  choice: మెరుపును
  rationale: בָּרָק యొక్క ‘మెరుపు’ అనే అర్థాన్ని, మూలంలోని సంక్షిప్త ఏకవచన కవితా రూపాన్ని నిలుపుతుంది.
- source_word: וַיְהֻמֵּם
  choice: వారిని కలవరపరిచాడు
  rationale: המם యొక్క కారణార్థకమైన ‘గందరగోళానికి గురిచేయు, కలవరపరచు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దానిని కేవలం సైనిక ఓటమిగా పరిమితం చేయదు.
theological_decisions:
- issue: ‘వారిని చెదరగొట్టాడు,’ ‘వారిని కలవరపరిచాడు’ అనే చోట బహువచన ప్రత్యయాల సూచితులు
  choice: పరిసర కవితా సందర్భంలోని శత్రువులు/విరోధులు
  alternative: తెలుగులో కర్మను చెప్పకుండా సందర్భానికి వదిలేయడం
  rationale: హీబ్రూలో రెండుచోట్లా బహువచన కర్మప్రత్యయం స్పష్టంగా ఉంది; దైవిక యుద్ధాన్ని వర్ణించే విస్తృత సందర్భంలో అది శత్రువులను సూచించడం అత్యంత సహజం. ‘వారిని’ అనడం మూలంలోని రూపాన్ని నిలుపుతూ తెలుగులో స్పష్టతనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కవితా ధోరణిని, సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. మూలంలో రెండో పాదానికి ప్రత్యేక ‘పంపు’ క్రియ లేకపోయినా, తెలుగులో సహజమైన సమాంతర నిర్మాణం కోసం ‘పంపి’ని సందర్భానుసారంగా పూరించాం.
