  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: te
  text: యుద్ధానికి నన్ను బలంతో సన్నద్ధం చేశావు[a]; నాపై లేచినవారిని నా కింద మోకరించేలా చేశావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి బలాన్ని నాకు నడికట్టుగా బిగించావు.” హీబ్రూ క్రియలో నడికట్టు కట్టడం ద్వారా సిద్ధపరచడం అనే చిత్రం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాపై లేచినవారిని నా కింద వంగేలా చేశావు.” హీబ్రూ క్రియ ప్రత్యర్థులను వంగేలా లేదా మోకరించేలా చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: నన్ను ... సన్నద్ధం చేశావు
  rationale: ఈ క్రియకు నడికట్టు కట్టడం అనే మూలచిత్రంతో పాటు యుద్ధానికి సిద్ధపరచడం లేదా శక్తితో సమకూర్చడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘సన్నద్ధం చేశావు’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; మూలచిత్రాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: חַיִל
  choice: బలంతో
  rationale: ఈ సందర్భంలో యుద్ధానికి అవసరమైన బలం, శౌర్యం లేదా సామర్థ్యాన్ని సూచిస్తుంది. ‘బలం’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: מִלְחָמָה అంటే యుద్ధం లేదా పోరాటం. ఇక్కడ విస్తృత సైనిక సందర్భానికి ‘యుద్ధానికి’ తగినది.
- source_word: תַּכְרִיעַ
  choice: వంగేలా చేశావు
  rationale: כָּרַע క్రియ యొక్క హిఫీల్ రూపం వంగించడం, మోకరింపజేయడం లేదా కిందపడేలా చేయడం అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. ‘వంగేలా చేశావు’ ఆ భంగిమను మరియు కారణార్థాన్ని నిలుపుతుంది.
- source_word: קָמַי
  choice: నాపై లేచినవారిని
  rationale: קוּם నుంచి వచ్చిన ఈ రూపం అక్షరార్థంగా ‘నాకు విరోధంగా లేచినవారు’ అని సూచిస్తుంది. తెలుగు అనువాదం ఆ చలనాత్మక విరోధ భావాన్ని నిలుపుతుంది.
- source_word: תַּחְתֵּנִי
  choice: నా కింద
  rationale: ఇది అక్షరార్థంగా ‘నా కింద’ అని అర్థం. శత్రువులు వంగి ఆధీనపడిన దృశ్యాన్ని నేరుగా నిలుపుతుంది.
