  text: חַי יְהוָ֖ה וּ/בָר֣וּךְ צוּרִ֑/י וְ/יָרֻ֕ם אֱלֹהֵ֖י צ֥וּר יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/047.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: te
  text: 'యహ్వే సజీవుడు!


    నా బండ ధన్యుడు గాక!


    దేవుడు—నా రక్షణ బండ—ఉన్నతపరచబడును గాక![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని నిర్మాణబంధంగా అక్షరార్థంగా ‘నా రక్షణ బండయొక్క దేవుడు’ అని కూడా చదవవచ్చు. కవితా సందర్భంలో ‘దేవుడు, నా రక్షణ బండ’ అనే సమానాధికరణ పఠనం కూడా సాధ్యమే. ‘నా రక్షణ బండ’ను ‘నన్ను రక్షించే బండ’ లేదా ‘నా విమోచన బండ’ అని కూడా భావించవచ్చు.
    reason: అֱלֹהֵי צוּר יִשְׁעִיలో నిర్మాణబంధ సంబంధం మరియు కవితా సమానాధికరణ పఠనం మధ్య ఉన్న నిజమైన వ్యాకరణ-వ్యాఖ్యాన సందిగ్ధతను కాపాడటానికి; יֶשַׁע యొక్క ‘రక్షణ/విమోచన’ భావపరిధిని సూచించటానికి.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యహ్వే సజీవుడు
  rationale: క్రియలేని హీబ్రూ వాక్యం ఇక్కడ ప్రమాణసూత్రం కంటే స్తుతిపూర్వక ప్రకటనగా ఉంది. అందువల్ల సహజమైన తెలుగులో ‘సజీవుడు’ అని అందించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ יהוהకు సాధారణంగా పునర్నిర్మించే ఉచ్చారణను తెలుగులో నేరుగా లిప్యంతరీకరించాం.
- source_word: וּבָרוּךְ
  choice: స్తుతించబడును గాక
  rationale: స్తుతి సందర్భంలోని ఆశీర్వాదాత్మక ప్రశంసను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘ఆశీర్వదించబడును గాక’ అనే మరింత రూపసామ్యమైన అనువాదం దేవుని గురించి ఆధునిక తెలుగులో అపార్థానికి దారితీయవచ్చు.
- source_word: צוּרִי
  choice: నా బండ
  rationale: దేవుని స్థిరత్వం, భద్రతను సూచించే మూల రూపకాన్ని ‘ఆశ్రయం’ వంటి వివరణాత్మక పదంతో భర్తీ చేయకుండా నిలిపాం.
- source_word: וְיָרֻם
  choice: ఉన్నతపరచబడును గాక
  rationale: హీబ్రూ జస్సివ్ రూపంలోని ఆకాంక్షాత్మక స్తుతి భావాన్ని నిలుపుతుంది; ముందు పాదంలోని ప్రశంసతో సమాంతరతను కూడా కాపాడుతుంది.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: దేవుడు—నా రక్షణ బండ
  rationale: మసొరా స్వరచిహ్నాల ప్రకారం అక్షరార్థంగా ఇది నిర్మాణబంధ శ్రేణి అయినప్పటికీ, కవితా సమాంతరతలో ‘దేవుడు’ మరియు ‘నా రక్షణ బండ’ను సమానాధికరణంగా గ్రహించడం సహజం. విరామరేఖలు ఆ సంబంధాన్ని చూపుతాయి; నిర్మాణబంధ పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా నిలిపాం. ‘యహ్వే’ హీబ్రూ నామానికి దగ్గరైన ఆధునిక తెలుగు లిప్యంతరీకరణ.
- issue: దేవునికి צוּר అనే రూపకం
  choice: బండ
  alternative: ఆశ్రయం / దుర్గం
  rationale: దైవిక స్థిరత్వం, రక్షణ అనే భావాలను మోసే హీబ్రూ కవితా రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా యథాతథంగా కాపాడాం.
- issue: אֱלֹהֵי צוּר יִשְׁעִי యొక్క వ్యాకరణ సంబంధం
  choice: ‘దేవుడు—నా రక్షణ బండ’ అనే సమానాధికరణ పఠనం
  alternative: ‘నా రక్షణ బండకు దేవుడు’ అనే నిర్మాణబంధ పఠనం
  rationale: కవితా సమాంతరత మరియు పునరుక్త צוּר సమానాధికరణ పఠనానికి మద్దతిస్తాయి; అయితే మసొరా స్వరచిహ్నాలు నిర్మాణబంధ రూపాన్ని సూచిస్తున్నందున ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా-స్తుతి శైలిని వాడాం. మూడు చిన్న ఆశ్చర్యార్థక పాదాలు హీబ్రూ కవిత్వపు ఉద్ధృతిని నిలుపుతాయి. ‘బండ’ అనే స్పష్టమైన రూపకాన్ని రెండు చోట్లా ఏకరీతిగా ఉంచాం.
