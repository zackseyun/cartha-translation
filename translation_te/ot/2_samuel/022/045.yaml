lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: విదేశీయులు
  rationale: ‘పరదేశపు కుమారులు’ అనే అక్షరార్థ హెబ్రీయ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం; ఇది విదేశీ ప్రజలను సూచిస్తుంది.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: నాకు భయంతో లొంగిపోతారు
  rationale: כחש యొక్క హిత్పయేల్ రూపం ఈ విజయగీత సందర్భంలో స్వచ్ఛంద విధేయతకన్నా భయంతో లేదా అయిష్టంగా లొంగడాన్ని సూచించగలదు. ‘లోబడినట్లు నటిస్తారు’ అనే కపట విధేయత భావాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని అర్థ పరిధిని కాపాడాం.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: చెవిన పడగానే
  rationale: ‘చెవి వినగానే’ అనే హెబ్రీయ నుడికారంలోని తక్షణ స్పందన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִשָּׁמְעוּ לִי
  choice: వారు నాకు విధేయులవుతారు
  rationale: ל అనే విభక్తితో వచ్చిన שׁמע ఇక్కడ కేవలం వినడం కాక, విని మాట పాటించడం లేదా విధేయత చూపడాన్ని సూచిస్తుంది.
