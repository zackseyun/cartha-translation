  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: te
  text: నా ప్రజల కలహాల నుండి నీవు నన్ను విడిపించావు[a]; దేశాలకు అధిపతిగా నన్ను కాపాడావు[b]; నాకు తెలియని ప్రజ నన్ను సేవించింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రజల వివాదాల నుండి.’ ఈ హెబ్రీ పదబంధం దావీదు సొంత ప్రజల మధ్య అంతర్గత కలహాలను గానీ, వారితో సంబంధమున్న సంఘర్షణలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశాలకు అధిపతిగా నన్ను నిలిపి ఉంచావు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నాకు తెలియని ప్రజ నన్ను సేవిస్తుంది.’ కావ్య సందర్భంలో హెబ్రీ అసంపూర్ణ క్రియకు భవిష్యత్ భావం ఉండవచ్చు. ఇక్కడ ‘సేవించడం’ రాజకీయంగా లోబడడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_and_tense_alternative
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: నీవు నన్ను విడిపించావు
  rationale: פלט హిఫిల్ రూపం అపాయం లేదా సంఘర్షణ నుండి తప్పించి విడుదల చేయడాన్ని సూచిస్తుంది; ‘విడిపించావు’ సహజమైన, గంభీరమైన తెలుగు ప్రయోగం.
- source_word: מֵרִיבֵי עַמִּי
  choice: నా ప్రజల కలహాల నుండి
  rationale: רִיב వివాదం, కలహం, పోరాటం వంటి విస్తృత భావాలను కలిగి ఉంది. ఈ నిర్మాణం దావీదు సొంత ప్రజల మధ్య కలహాలను గానీ, వారితో సంబంధమున్న సంఘర్షణలను గానీ సూచించవచ్చు; ‘నా ప్రజల కలహాలు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: תִּשְׁמְרֵנִי
  choice: నన్ను కాపాడావు
  rationale: שׁמר అంటే కాపాడడం, భద్రపరచడం, నిలిపి ఉంచడం. ఇక్కడ దేవుడు రాజును జనాలపై అధిపతిగా నిలిపి సంరక్షించిన భావం ఉంది.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: జనాలకు అధిపతిగా
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా ఇక్కడ నాయకత్వం లేదా ప్రధానాధికారాన్ని సూచించే రూపకం. సహజ తెలుగులో ‘అధిపతిగా’ రాజకీయ-రాజసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: ఈ రాజసంబంధ సందర్భంలో גּוֹיִם ఇశ్రాయేలు వెలుపలి జనసమూహాలు లేదా దేశప్రజలను సూచిస్తుంది; ‘జనాలు’ అనవసరమైన తరువాతి మతపరమైన భావాలను దిగుమతి చేయదు.
- source_word: עַם לֹא יָדַעְתִּי
  choice: నాకు తెలియని ప్రజ
  rationale: యదా పరిపూర్ణ రూపం ముందస్తు పరిచయం లేకపోవడాన్ని సూచిస్తుంది. తెలుగులో ‘నాకు తెలియని ప్రజ’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: יַעַבְדֻנִי
  choice: నన్ను సేవించింది
  rationale: עבד ఇక్కడ రాజుకు సేవ చేయడం లేదా రాజకీయంగా లోబడడం అనే భావాన్ని కలిగి ఉంది. ‘సేవించింది’ మూలపదాన్ని నేరుగా నిలుపుతూ, ‘లోబడింది’ అనే సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడానికి వీలు కల్పిస్తుంది.
theological_decisions:
- issue: విదేశీ జనాలపై రాజాధికార భాష
  choice: ప్రధాన పాఠ్యంలో దావీదు చారిత్రక రాజాధికార భావాన్ని నిలుపడం
  alternative: ఈ వాక్యాన్ని ప్రధాన పాఠ్యంలోనే ప్రత్యక్ష మెస్సీయ ప్రవచనంగా వివరించడం
  rationale: సందర్భం దావీదు విమోచన మరియు రాజ్యాధికార గీతం. విస్తృత కానోనిక పఠనంలో ప్రతిరూపాత్మక లేదా మెస్సీయ సంబంధ ప్రాముఖ్యత ఉండవచ్చు; అయితే అనువాదం మొదట హెబ్రీ పాఠ్యంలోని తక్షణ చారిత్రక భావాన్ని ప్రతిబింబించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కావ్య-రాజసంబంధ శైలి. మూలంలోని మూడు సమాంతర వాక్యభాగాలు నిలుపబడ్డాయి. ‘అధిపతి’ ద్వారా רֹאשׁ యొక్క సందర్భోచిత నాయకత్వ భావం వ్యక్తమైంది; ‘జనాలు/ప్రజ’ ద్వారా బహువచన גּוֹיִם మరియు ఏకవచన עַם మధ్య భేదం సాధ్యమైనంతవరకు నిలుపబడింది.
