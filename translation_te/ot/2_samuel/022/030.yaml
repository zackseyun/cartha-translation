  edition: WLC
  text: כִּ֥י בְ/כָ֖ה אָר֣וּץ גְּד֑וּד בֵּ/אלֹהַ֖/י אֲדַלֶּג שֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/030.yaml
  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: te
  text: ఎందుకంటే, నీ ద్వారా నేను దండుపైకి దూసుకుపోగలను[a][b]; నా దేవుని ద్వారా నేను ప్రాకారాన్ని గెంతి దాటగలను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతో’ లేదా ‘నీ వల్ల’ అని కూడా అనువదించవచ్చు; హీబ్రూ ఉపసర్గ సహవాసాన్ని లేదా మాధ్యమాన్ని సూచించగలదు. ఇక్కడ దేవుడు కార్యానికి సామర్థ్యం ఇస్తున్నాడనే భావంలో ‘నీ ద్వారా’ అని తీసుకున్నాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దోపిడీ దండు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గోడ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి లేదా సాక్ష్యానికి కారణాన్ని తెలిపే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְכָה
  choice: నీ వల్ల
  rationale: בְּ ఉపసర్గ ఇక్కడ సహవాసాన్ని లేదా సాధనాన్ని సూచించవచ్చు; సందర్భంలో దేవుడు కార్యసామర్థ్యం కలిగిస్తున్నాడనే సాధనార్థాన్ని ప్రధాన పాఠంలో తీసుకున్నాం.
- source_word: אָרוּץ
  choice: నేను ... పరుగెత్తగలను
  rationale: కవితా సందర్భంలోని అసంపూర్ణ క్రియ దేవునిచేత కలిగిన సామర్థ్యాన్ని సూచించగలదు; తెలుగు సామర్థ్య రూపం ఆ భావాన్ని స్పష్టంగా, అతివ్యాఖ్య లేకుండా అందిస్తుంది.
- source_word: גְּדוּד
  choice: దండు
  rationale: సైనిక దండు లేదా దోపిడీ దండును సూచించే పదం; ‘దండు’ సంక్షిప్తంగా, యుద్ధ చిత్రణకు తగినదిగా ఉంది.
- source_word: בֵּאלֹהַי
  choice: నా దేవుని వల్ల
  rationale: మొదటి పాదంలోని సాధనార్థక నిర్మాణాన్ని పునరావృతం చేస్తూ, ‘నా దేవుడు’ అనే వ్యక్తిగత సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֲדַלֶּג
  choice: నేను ... దాటగలను
  rationale: דּלג యొక్క పియేల్ రూపానికి ఎగిరి దాటడం లేదా గెంతి దాటడం అనే భావం ఉంది; ప్రాకారం సందర్భంలో సహజ తెలుగు కోసం ‘దాటగలను’ తీసుకుని, గెంతే భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: שׁוּר
  choice: ప్రాకారం
  rationale: కోట రక్షణ గోడ లేదా ప్రాకారాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో ‘ప్రాకారం’ సాధారణ ‘గోడ’ కంటే చిత్రణను మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ చిత్రణలో దేవుని సామర్థ్యప్రదానం
  choice: ‘పరుగెత్తగలను ... దాటగలను’ అని దేవునివల్ల కలిగిన సామర్థ్యంగా అనువదించాం.
  alternative: సామర్థ్యాన్ని స్పష్టంచేయకుండా ‘పరుగెత్తుతాను ... దాటుతాను’ అని అనువదించడం.
  rationale: ఈ కవితా సందర్భంలో హీబ్రూ అసంపూర్ణ క్రియలు దేవుని సహాయంతో కలిగే సామర్థ్యాన్ని సహజంగా వ్యక్తం చేయగలవు. దీనివల్ల వాక్య పరిధిని మించిన సిద్ధాంతాన్ని చేర్చకుండా విజయానికి దేవుడే మూలమనే ఒత్తిడి నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలి. సమాంతర పాదాల్లో ‘నీ వల్ల / నా దేవుని వల్ల’ మరియు ‘పరుగెత్తగలను / దాటగలను’ అనే సమతుల్యతను కాపాడాం. యుద్ధ పదచిత్రాన్ని మృదువుచేయకుండా, సాధారణ పాఠకునికి అర్థమయ్యే పదాలను ఎంచుకున్నాం.
