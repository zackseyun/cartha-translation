reference: 2 Samuel 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: te
  text: ఆయన కెరూబు మీద ఎక్కి ఎగిరాడు; గాలి రెక్కల మీద కనిపించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనబడాడు.” హీబ్రూ క్రియను “కనబడాడు” లేదా “ప్రత్యక్షమయ్యాడు” అనే భావంలో అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ఎక్కి
  rationale: רכב అనే క్రియ ఇక్కడ స్వారీ చేయడానికి ఎక్కడాన్ని సూచిస్తుంది. తరువాతి క్రియతో సహజమైన తెలుగు వాక్యప్రవాహం కోసం ‘ఎక్కి’ అని అనువదించాం.
- source_word: עַל כְּרוּב
  choice: కెరూబుమీద
  rationale: ఏకవచనమైన כְּרוּבను స్థిరపడిన బైబిలు పదమైన ‘కెరూబు’గా లిప్యంతరీకరించి, עַלను ‘మీద’గా వ్యక్తం చేశాం; కవితాత్మక దైవదర్శన చిత్రణను వివరణాత్మకంగా మార్చలేదు.
- source_word: וַיָּעֹף
  choice: ఎగిరాడు
  rationale: עוף యొక్క సూటి అర్థం ‘ఎగురు.’ ‘దూసుకుపోయాడు’ వంటి అదనపు భావాన్ని చేర్చకుండా మూలంలోని చిత్రాన్ని నిలిపాం.
- source_word: וַיֵּרָא
  choice: కనిపించాడు
  rationale: ראה యొక్క నిఫాల్ రూపం ‘కనబడాడు’ లేదా ‘ప్రత్యక్షమయ్యాడు’ అనే భావాన్ని ఇవ్వగలదు. ఆధునిక తెలుగులో సహజంగా ఉండి ఈ రెండు భావాలకు దగ్గరగా నిలిచే ‘కనిపించాడు’ను ఎంచుకున్నాం.
- source_word: עַל כַּנְפֵי רוּחַ
  choice: గాలి రెక్కలమీద
  rationale: כַּנְפֵי అనే బహువచన నిర్మాణాన్ని ‘రెక్కలు’గా, ఈ దైవదర్శన సందర్భంలోని רוּחַను ‘గాలి’గా అనువదించి, మూలంలోని స్పష్టమైన కవితాత్మక రూపకాన్ని నిలిపాం.
theological_decisions:
- issue: దైవ యోధుని దైవదర్శన చిత్రణను ఎలా వ్యక్తం చేయాలి
  choice: కెరూబుమీద ఎక్కడం, ఎగరడం, గాలి రెక్కలమీద కనిపించడం అనే స్పష్టమైన కవితాత్మక చిత్రాలను యథాతథంగా నిలిపాం.
  alternative: దేవుడు తుఫానులో మహిమగా ప్రత్యక్షమయ్యాడని భావానువాదం చేయడం.
  rationale: మూలపాఠం దైవదర్శనాన్ని కవితాత్మకంగా వర్ణిస్తుంది. దాన్ని సిద్ధాంతపరమైన వివరణగా మార్చకుండా, దాని రూపకాన్నీ అంతర్గత ఉద్వేగాన్నీ కాపాడటం సముచితం.
- issue: וַיֵּרָאలోని నిష్క్రియ లేదా ప్రత్యక్షత భావం
  choice: కనిపించాడు
  alternative: కనబడాడు / ప్రత్యక్షమయ్యాడు
  rationale: ‘కనిపించాడు’ అనేది తెలుగులో సహజంగా ఉండి, ‘కనబడాడు’ అనే నిష్క్రియ భావానికీ ‘ప్రత్యక్షమయ్యాడు’ అనే అవిర్భావ భావానికీ మధ్యనున్న మూలభాషా విస్తృతిని పూర్తిగా ఒక వైపుకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘కెరూబు’ అనే బైబిలు సాంకేతిక పదాన్ని వివరణతో భర్తీ చేయకుండా నిలిపాం; క్రియల క్రమం మూలంలోని వేగవంతమైన దృశ్యాన్ని ప్రతిబింబిస్తుంది.
