source:
  edition: WLC
  text: וַ/יֵּֽרָאוּ֙ אֲפִ֣קֵי יָ֔ם יִגָּל֖וּ מֹסְד֣וֹת תֵּבֵ֑ל בְּ/גַעֲרַ֣ת יְהוָ֔ה מִ/נִּשְׁמַ֖ת ר֥וּחַ אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: te
  text: 'అప్పుడు సముద్రపు కాలువలు కనిపించాయి;


    లోకపు[a] పునాదులు బయల్పడ్డాయి—


    యాహ్వే[b] గద్దింపువల్ల,


    ఆయన నాసికల ఊపిరి విసురువల్ల.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాసిత లోకపు.”
    reason: תֵּבֵל కొన్నిసార్లు ప్రత్యేకంగా మనుషులు నివసించే లోకాన్ని సూచిస్తుంది.
  - marker: b
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం YHWH.
    reason: ‘యాహ్వే’ అనేది పాఠంలో ఉన్న దైవనామపు లిప్యంతరీకరణ అని పాఠకుడికి తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: కనిపించాయి
  rationale: నిఫ్అల్ రూపంలోని కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సముద్రపు కాలువలు దృశ్యమయ్యాయనే కవితాత్మక చిత్రణను కాపాడుతుంది.
- source_word: אֲפִקֵי יָם
  choice: సముద్రపు కాలువలు
  rationale: אֲפִיקִים నీటి కాలువలు లేదా ప్రవాహ మార్గాలను సూచిస్తుంది. నీరు తొలగిపోయి సముద్రంలోని మార్గాలు బయటపడిన దృశ్యాన్ని ఇది అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: יִגָּלוּ
  choice: బయల్పడ్డాయి
  rationale: గלה నిఫ్అల్ రూపంలోని ‘కప్పు తొలగి వెల్లడవడం’ అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: లోకపు పునాదులు
  rationale: מֹסְדוֹת అంటే పునాదులు; תֵּבֵל కవిత్వంలో లోకాన్ని, కొన్నిసార్లు నివాసిత లోకాన్ని సూచిస్తుంది. ‘లోకం’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּגַעֲרַת
  choice: గద్దింపువల్ల
  rationale: దైవిక గద్దింపు ఈ విశ్వవ్యాప్త బయల్పాటుకు కారణమైందనే בְּ యొక్క కారణార్థక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: ఆయన నాసికల నుంచి వీచిన ఊపిరివల్ల
  rationale: נְשָׁמָה, רוּחַ పదాల బలమైన ఉచ్ఛ్వాస చిత్రణను సహజ తెలుగులో అందిస్తూ, אַף యొక్క ప్రత్యక్షమైన ‘నాసిక’ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలపాఠాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- issue: אַף యొక్క అర్థం
  choice: నాసికలు
  alternative: కోపం
  rationale: אַף పదానికి ‘కోపం’ అనే రూపకాలంకార అర్థం ఉన్నప్పటికీ, ఇక్కడ ఊపిరి/గాలి పదాలతో కలిసిన శరీరరూపక చిత్రణ ‘నాసికలు’ అనే ప్రత్యక్ష అర్థానికి బలమిస్తుంది. ప్రత్యామ్నాయ భావాన్ని నిశ్శబ్దంగా పాఠంలో కలపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా శైలిని ఉపయోగించాం. సమాంతర పాదాలను, విశ్వవ్యాప్త తుఫాను-దైవదర్శన చిత్రణను నిలిపాం; ‘నాసికలు’ అనే మానవరూపకాన్ని సారాంశమైన ‘కోపం’గా మార్చలేదు.
