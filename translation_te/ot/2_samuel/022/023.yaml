id: 2SA.22.23
reference: 2 Samuel 22:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֥י כָל משפט/ו לְ/נֶגְדִּ֑/י וְ/חֻקֹּתָ֖י/ו לֹא אָס֥וּר מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: te
  text: ఎందుకంటే ఆయన న్యాయవిధులన్నీ నా ఎదుట ఉన్నాయి; ఆయన శాసనాల నుండి నేను తొలగిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా “దానినుండి.” ఇది ముందున్న “శాసనాలు” అనే పదాన్ని సమష్టిగా సూచిస్తుండవచ్చు; “వాటినుండి” అని కూడా అనువదించవచ్చు.
    reason: మూలంలోని స్త్రీలింగ ఏకవచన సర్వనామం మరియు ముందున్న బహువచన నామవాచకం మధ్య ఉన్న అసాధారణ సంబంధాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలియజేసే హెబ్రీ సంబంధపదం యొక్క కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָל מִשְׁפָּטָיו
  choice: ఆయన న్యాయవిధులన్నీ
  rationale: כָל యొక్క సమగ్ర భావాన్ని ‘అన్నీ’ నిలుపుతుంది; מִשְׁפָּטָיו దేవుని న్యాయనిర్ణయాలు లేదా విధులను సూచించగలందున ‘న్యాయవిధులు’ న్యాయపరమైన భావాన్నీ కవితాత్మక సమాంతరతనూ కాపాడుతుంది.
- source_word: לְנֶגְדִּי
  choice: నా ఎదుటే ఉన్నాయి
  rationale: నిరంతరం తన దృష్టిలో లేదా అవగాహనలో ఉంచుకోవడం అనే రూపకాన్ని అతిగా విప్పకుండా సహజంగా వ్యక్తం చేస్తుంది; ‘ఏ’ ఉద్ఘాటన ఆ సన్నిధి భావాన్ని బలపరుస్తుంది.
- source_word: וְחֻקֹּתָיו
  choice: ఆయన శాసనాలు
  rationale: స్థిరంగా విధించబడిన కట్టడలు అనే חֻקּוֹת భావాన్ని ‘శాసనాలు’ అందిస్తుంది; మִשְׁפָּטִיםతో ఉన్న పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: לֹא אָסוּר
  choice: నేను తొలగిపోలేదు
  rationale: సוּר క్రియలోని పక్కకు తొలగడం లేదా మార్గం విడిచిపోవడం అనే భావాన్ని గంభీరమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִמֶּנָּה
  choice: ఆయన శాసనాలనుండి
  rationale: హెబ్రీ రూపం అక్షరార్థంగా స్త్రీలింగ ఏకవచనంలో ‘దానినుండి’ అని ఉన్నా, సందర్భంలో ముందున్న దేవుని శాసనాలనే సమష్టిగా సూచిస్తుందని ప్రధాన పాఠంలో స్పష్టం చేయబడింది; రూపంలోని అసాధారణతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: నిబంధన-ధర్మశాస్త్ర సంబంధ పదాల మధ్య భేదం
  choice: מִשְׁפָּטִיםను ‘న్యాయవిధులు,’ חֻקּוֹתను ‘శాసనాలు’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ సాధారణంగా ‘చట్టాలు’ లేదా ‘ఆజ్ఞలు’గా అనువదించడం
  rationale: మూలపాఠం సమాంతరంగా రెండు వేర్వేరు న్యాయపదాలను ఉపయోగిస్తుంది. వాటి భేదాన్ని నిలపడం పాఠంలోని భావసూక్ష్మతను కాపాడి, మూలంలో లేని ఏకరీతి ధార్మిక వర్గీకరణను రుద్దకుండా ఉంటుంది.
- issue: מִמֶּנָּה యొక్క అసాధారణ స్త్రీలింగ ఏకవచన సూచన
  choice: ప్రధాన పాఠంలో ‘ఆయన శాసనాలనుండి’ అని సందర్భార్థాన్ని ఇవ్వడం, అక్షరరూపాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘దానినుండి’ అని అస్పష్టంగానే ప్రధాన పాఠంలో ఉంచడం లేదా ‘వాటినుండి’ అని సర్వనామంతో అనువదించడం
  rationale: సందర్భం దేవుని విధులనుండి తొలగకపోవడాన్ని సూచిస్తుంది; అయితే హెబ్రీ సర్వనామంలోని సంఖ్య-లింగ ఉద్రిక్తతను మౌనంగా చెరపకుండా పాదసూచిక ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గౌరవప్రద స్వరం ఉపయోగించబడింది. ‘న్యాయవిధులు’ మరియు ‘శాసనాలు’ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయపరమైన పదాలుగా ఉండి, హెబ్రీ సమాంతర పదభేదాన్ని నిలుపుతాయి.
