  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: te
  text: యాహ్వే నా నీతిని బట్టి నాతో వ్యవహరించాడు[a]; నా చేతుల స్వచ్ఛతను బట్టి నాకు ప్రతిఫలమిచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు ప్రతిఫలమిచ్చాడు.’ హీబ్రూ క్రియ ఒకరి ప్రవర్తనకు అనుగుణంగా వారితో వ్యవహరించడం లేదా వారికి ప్రతిఫలం ఇవ్వడం అనే అర్థాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నా చేతుల స్వచ్ఛత’ అనేది ఒకరి క్రియల్లోని నిర్దోషిత్వాన్ని లేదా నైతిక స్వచ్ఛతను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: నాకు తగినట్లు చేశాడు
  rationale: גמל అనే క్రియ ఒకరి నడవడికి అనుగుణంగా వారితో వ్యవహరించడం లేదా వారికి ప్రతిఫలం ఇవ్వడం అనే భావాలను కలిగి ఉంటుంది. సందర్భంలోని అనుకూల ప్రతిఫల భావాన్ని నిలుపుతూ, దాని విస్తృత అర్థపరిధిని ఈ ఎంపిక కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ అని ఇచ్చాం.
- source_word: כְּצִדְקָתִי
  choice: నా నీతిని బట్టి
  rationale: צדקה ఇక్కడ వక్త యొక్క యథార్థమైన, సరైన నడవడిని సూచిస్తుంది. כְּ ఉపసర్గలోని ప్రమాణం లేదా అనుగుణత భావాన్ని ‘బట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּבֹר
  choice: శుద్ధిని బట్టి
  rationale: בֹּר శుభ్రత లేదా పవిత్రతను సూచిస్తుంది. చేతులతో కలిసిన concrete రూపకాన్ని చెదరగొట్టకుండా ‘శుద్ధి’ ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יָדַי
  choice: నా చేతుల
  rationale: ‘నా చేతుల శుద్ధి’ అనే హీబ్రూ రూపకాన్ని అలాగే ఉంచడం ద్వారా వక్త క్రియల్లోని నిర్దోషిత్వం లేదా నిష్కపటత వ్యక్తమవుతుంది.
- source_word: יָשִׁיב לִי
  choice: నాకు ప్రతిఫలమిచ్చాడు
  rationale: שוב యొక్క హిఫీల్ రూపం ఇక్కడ తిరిగి ఇవ్వడం లేదా తగిన ప్రతిఫలం ఇవ్వడం అనే అర్థంలో ఉంది. ‘ప్రతిఫలమిచ్చాడు’ కవితా సమాంతరతను, దైవ ప్రతిస్పందన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వక్త తన నీతి, చేతుల శుద్ధి గురించి చెప్పడం సంపూర్ణ పాపరాహిత్యాన్నో దేవుని ఎదుట స్వార్జిత యోగ్యతనో సూచిస్తుందా?
  choice: వచనం చెప్పినట్టే, యెహోవా వక్త యొక్క నీతికి, శుద్ధమైన క్రియలకు అనుగుణంగా స్పందించాడనే వాదనను నేరుగా నిలిపాం.
  alternative: వ్యక్తిగత నీతి భావాన్ని మృదువుచేయడం, లేదా దీనిని సంపూర్ణ పాపరాహిత్యం లేదా రక్షణకు స్వార్జిత యోగ్యతగా విస్తరించడం.
  rationale: హీబ్రూ పాఠం ‘నా నీతి’, ‘నా చేతుల శుద్ధి’ అని స్పష్టంగా చెబుతుంది. అందువల్ల ఆ భాషను నిలుపుతూ, దాని పరిధిని మించి సిద్ధాంతపరమైన నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవభరితంగా రూపొందించాం. హీబ్రూ కవితా సమాంతరతను, ‘చేతుల శుద్ధి’ అనే దృశ్యరూపకాన్ని నిలిపాం; వివరణ అవసరమైన చోట పాదటిప్పణులు ఇచ్చాం.
