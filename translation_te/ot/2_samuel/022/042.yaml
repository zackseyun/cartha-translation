source:
  edition: WLC
  text: יִשְׁע֖וּ וְ/אֵ֣ין מֹשִׁ֑יעַ אֶל יְהוָ֖ה וְ/לֹ֥א עָנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: te
  text: వారు సహాయం కోసం మొరపెట్టుకున్నారు[a], కాని రక్షించేవాడు ఎవరూ లేడు; యాహ్వేకు మొరపెట్టుకున్నారు, కాని ఆయన వారికి జవాబివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారు సహాయం కోసం చూశారు.” హీబ్రూ క్రియకు ఇక్కడ ఈ అర్థం కూడా సాధ్యమే.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: వారు సహాయం కోసం మొరపెట్టుకున్నారు
  rationale: ఈ రూపానికి ‘చూశారు/ఆశగా చూశారు’ అనే సాధ్యమైన అర్థం ఉన్నప్పటికీ, ‘రక్షించేవాడు ఎవరూ లేడు’ అనే సమాంతర సందర్భం సహాయం కోసం చేసిన ఆర్తవిన్నపాన్ని సూచిస్తుంది. ‘మొరపెట్టుకున్నారు’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וְאֵין מֹשִׁיעַ
  choice: కాని రక్షించేవాడు ఎవరూ లేడు
  rationale: וְ ఇక్కడ విఫలమైన మొరకు విరుద్ధ ఫలితాన్ని కలుపుతుంది కాబట్టి ‘కాని’ సహజం. מֹשִׁיעַను బిరుదుగా కాక, రక్షించే వ్యక్తిని సూచించే కృదంతంగా అనువదించాం.
- source_word: אֶל יְהוָה
  choice: యాహ్వేకు మొరపెట్టుకున్నారు
  rationale: אֶל విన్నపం ఎవరిని ఉద్దేశించిందో సూచిస్తుంది. రెండో భాగంలో హీబ్రూ క్రియను విడిచిపెట్టినా, సమాంతర నిర్మాణం వల్ల మొదటి క్రియ భావాన్ని తెలుగులో పునరుక్తి చేయడం స్పష్టతకూ సహజత్వానికీ అవసరం.
- source_word: וְלֹא עָנָם
  choice: కాని ఆయన వారికి జవాబివ్వలేదు
  rationale: עָנָם అంటే ‘వారికి జవాబిచ్చాడు’; లోֹతో అది నిరాకరణ అవుతుంది. కర్త ముందున్న యాహ్వే. సందర్భంలోని వ్యతిరేకతను తెలుగులో ‘కాని’ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో దైవనామం నేరుగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’గా మార్చకుండా, ‘Jehovah’కు సాధారణంగా సంబంధించిన ‘యెహోవా’ రూపం బదులు మూలనామానికి దగ్గరైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: యాహ్వే జవాబివ్వకపోవడం
  choice: ఆయన వారికి జవాబివ్వలేదు
  alternative: వారి విన్నపాన్ని అంగీకరించలేదు
  rationale: మూలంలోని ענה ‘జవాబివ్వడం’ అనే మాటనే నిలుపుకున్నాం. ఎందుకు జవాబివ్వలేదో లేదా దాని ధార్మిక భావం ఏమిటో వచనంలో లేనందున వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. రెండు సమాంతర మొరలను స్పష్టంగా చూపేందుకు రెండో భాగంలో సందర్భం సూచించే క్రియను పునరుక్తి చేశాం.
