  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֥י נֵכָ֖ר יִבֹּ֑לוּ וְ/יַחְגְּר֖וּ מִ/מִּסְגְּרוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/046.yaml
  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: te
  text: విదేశీయులు వాడిపోతారు[a]; తమ కోటలలోనుండి వణుకుతూ బయటికి వస్తారు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విదేశీయులు ధైర్యం కోల్పోతారు.’ హీబ్రూ క్రియ మరింత అక్షరార్థంగా ‘వాడిపోతారు’ లేదా ‘క్షీణిస్తారు’ అని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది. ఇతర అనువాదాలు: ‘భయంతో అణగి వస్తారు,’ ‘కుంటుతూ వస్తారు,’ లేదా మరింత అక్షరార్థంగా ‘నడుము కట్టుకుంటారు.’'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తమ దుర్గాలనుండి’; తక్కువ సంభావ్యతతో, ‘తమ బందీగృహాలనుండి/ఆవరణలనుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: విదేశీయులు
  rationale: ఈ నిర్మాణం అక్షరార్థంగా ‘విదేశీయుల కుమారులు’ అయినా, విదేశీ ప్రజలను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘విదేశీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יִבֹּלוּ
  choice: వాడిపోతారు
  rationale: נבל అనే క్రియకు ప్రాథమికంగా ‘వాడిపోవడం, క్షీణించడం’ అనే అర్థం ఉంది. కావ్యాత్మక సైనిక సందర్భంలో ఇది వారి శక్తి లేదా ధైర్యం క్షీణించడాన్ని సూచించవచ్చు; మూలంలోని రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: וְיַחְגְּרוּ
  choice: వణుకుతూ బయటికి వస్తారు
  rationale: ఈ క్రియ ఇక్కడ క్లిష్టమైనది. חגר సాధారణంగా ‘నడుము కట్టుకొను’ అని అర్థమిచ్చినా, ఈ సందర్భంలో భయంతో తడబడుతూ లేదా వణుకుతూ రావడంగా అర్థం చేసుకోవచ్చు. సందర్భానుకూలమైన పఠనాన్ని ప్రధాన పాఠంలో ఉంచి, ఇతర అవకాశాలను పాదసూచికలో ఇచ్చాం.
- source_word: מִמִּסְגְּרוֹתָם
  choice: తమ కోటలలోనుండి
  rationale: מִסְגְּרוֹת అనేది మూసివేసిన లేదా రక్షిత ప్రదేశాలను సూచించగలదు. విజయగీతంలోని సైనిక సందర్భంలో ‘కోటలు’ సహజమైన అర్థం; ‘బందీగృహాలు/ఆవరణలు’ అనే పదార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
