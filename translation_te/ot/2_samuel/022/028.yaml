  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: te
  text: 'బాధిత ప్రజలను[a] నీవు రక్షిస్తావు;

    కాని గర్విష్ఠులపై[b] నీ చూపు ఉంటుంది;

    వారిని నీవు తగ్గిస్తావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పేద ప్రజలను,’ ‘అణచివేయబడిన ప్రజలను.’ హీబ్రూ పదం పేదరికం, బాధ లేదా అణచివేతలో ఉన్నవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గర్వించేవారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: ప్రజలు
  rationale: ఏకవచన సమూహవాచకమైన ఈ పదం వ్యక్తుల సమూహాన్ని సూచిస్తుంది; కవితా సందర్భంలో ‘ప్రజలు’ సహజంగా ఉంది.
- source_word: עָנִי
  choice: బాధింపబడిన
  rationale: ఈ విశేషణం పేదరికం, బాధ, అణచివేత లేదా దీనస్థితిని సూచించగలదు. ఇక్కడ ఆర్థిక భావానికే పరిమితం చేయకుండా అనుభవిస్తున్న బాధను వ్యక్తం చేస్తుంది.
- source_word: תּוֹשִׁיעַ
  choice: నీవు రక్షిస్తావు
  rationale: ישׁע ధాతువు హిఫీల్ రూపంలో రక్షించడం లేదా విడిపించడం అనే విస్తృత భావం కలిగి ఉంది; ‘రక్షిస్తావు’ దానిని సహజంగా నిలుపుతుంది.
- source_word: עֵינֶיךָ
  choice: నీ చూపు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ కళ్ళు’ ఉన్నా, తెలుగులో దృష్టిని ఉద్దేశించే ‘నీ చూపు వారిమీద ఉంటుంది’ అనే ప్రయోగం సహజంగా ఉండి మూలంలోని సజీవ రూపకాన్ని కాపాడుతుంది.
- source_word: רָמִים
  choice: గర్విష్ఠులు
  rationale: ‘ఎత్తైనవారు’ అనే మూలభావం ఈ సందర్భంలో ప్రతికూల నైతిక అర్థంతో గర్వించే వారిని సూచిస్తుంది.
- source_word: תַּשְׁפִּיל
  choice: అణచివేయడానికి
  rationale: שׁפל హిఫీల్ రూపం కిందికి దించడం, తగ్గించడం లేదా అవమానించడం అనే భావం ఇస్తుంది; సందర్భంలో ‘అణచివేయడం’ గర్విష్ఠులను తక్కువ స్థితికి తేవడాన్ని తెలియజేస్తుంది.
- source_word: וְ
  choice: కాని
  rationale: రూపపరంగా ‘మరియు’ అయినా, బాధింపబడినవారిని రక్షించడం మరియు గర్విష్ఠులను అణచివేయడం మధ్యనున్న వ్యతిరేక సమాంతరతను ‘కాని’ స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: నైతిక వ్యత్యాసమా, కేవలం సామాజిక వ్యత్యాసమా
  choice: బాధింపబడిన లేదా దీనస్థితిలో ఉన్న ప్రజలను దేవుడు రక్షించడం, గర్విష్ఠులను అణచివేయడం అనే వ్యత్యాసం
  alternative: ఆర్థికంగా పేదవారికీ సామాజికంగా ఉన్నతస్థితిలో ఉన్నవారికీ మధ్య వ్యత్యాసం
  rationale: హీబ్రూ పదాలకు సామాజిక-ఆర్థిక ఛాయలు ఉండవచ్చు. అయితే సమాంతర పదజాలం నైతిక భావాన్నీ మోస్తుంది. ప్రధాన పాఠం బాధ మరియు గర్వం అనే వ్యత్యాసాన్ని చూపుతూ, పేదరికం లేదా అణచివేత అనే సాధ్యమైన భావాన్ని పాదటిప్పణుల్లో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే కవితా శైలి. హీబ్రూ సమాంతరతను రెండు పాదాలుగా ఉంచి, పదాల అర్థవిస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం.
