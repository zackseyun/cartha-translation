revisions:
- from: యెహోవా నా నీతిని బట్టి నాకు ప్రతిఫలమిచ్చాడు; ఆయన కళ్ల ఎదుట నాకున్న పవిత్రతను బట్టి నాకు ప్రతిఫలమిచ్చాడు.[a]
  to: యెహోవా నా నీతిని బట్టి, ఆయన కళ్ల ఎదుట నా స్వచ్ఛతను బట్టి నాకు ప్రతిఫలమిచ్చాడు.[a]
  rationale: The revision retains the straightforward first-person claim and both repeated Hebrew comparative phrases, while using one governing verb as in the source. It also replaces a potentially theologically heightened term with ‘స్వచ్ఛత,’ which more closely reflects cleanness/purity. The footnote is retained only for the idiomatic alternative of ‘before his eyes.’
