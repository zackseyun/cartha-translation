source:
  edition: WLC
  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: te
  text: యెహోవా నా నీతిని బట్టి, ఆయన కళ్ల ఎదుట నా స్వచ్ఛతను బట్టి నాకు ప్రతిఫలమిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన కళ్ల ఎదుట’ అంటే ‘ఆయన దృష్టిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ప్రతిఫలమిచ్చాడు
  rationale: ఈ సందర్భంలో שוב క్రియకు, యెహోవా కర్తగా לִי పరోక్ష కర్మగా ఉన్నప్పుడు, చేసినదానికి తగినట్లు తిరిగి ఇవ్వడం అనే భావం ఉంది. ‘ప్రతిఫలమిచ్చాడు’ సహజమైన తెలుగులో ఈ ప్రతిఫలార్థాన్ని వ్యక్తం చేస్తుంది; కేవలం సానుకూల బహుమాన భావానికే దీనిని పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: לִי
  choice: నాకు
  rationale: లְ ఉపసర్గ క్రియ యొక్క పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో ‘నాకు ప్రతిఫలమిచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: כְּצִדְקָתִי
  choice: నా నీతిని బట్టి
  rationale: צדקה ఇక్కడ నీతి, యథార్థత, న్యాయబద్ధత అనే భావపరిధిని కలిగి ఉంది. ‘నా నీతిని బట్టి’ అనే రూపం כְּ యొక్క ప్రమాణార్థాన్ని నిలుపుతూ, భావాన్ని కేవలం న్యాయపరమైన తీర్పుకే పరిమితం చేయదు.
- source_word: כְּבֹרִי
  choice: నాకున్న పవిత్రతను బట్టి
  rationale: בֹּר స్వచ్ఛత లేదా పవిత్రతను సూచిస్తుంది. ఈ వచనంలో ‘చేతులు’ అనే పదం లేదు కాబట్టి సమాంతర కీర్తన నుంచి దానిని చేర్చలేదు. ‘పవిత్రత’ ఆధునిక తెలుగులో వ్యక్తి యొక్క నైతిక స్వచ్ఛతను సహజంగా తెలియజేస్తుంది.
- source_word: לְנֶגֶד עֵינָיו
  choice: ఆయన కళ్ల ఎదుట
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన ‘ఆయన కళ్ల ఎదుట’ అనే దృశ్యరూపాన్ని నిలిపాం; భావం ‘ఆయన దృష్టిలో’ అని ఉంటుంది.
theological_decisions:
- issue: దావీదు తన నీతి, పవిత్రత గురించి చేసిన ప్రకటన
  choice: మొదటి వ్యక్తిలో ఉన్న సూటి ప్రకటనను సిద్ధాంతపరమైన మృదీకరణ లేకుండా నిలుపడం
  alternative: దీనిని సాపేక్ష నిబంధనా విశ్వాస్యతగా వివరించడం లేదా దావీదు పాపాలతో కలిగే ఉద్రిక్తతను తొలగించేలా భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం దావీదు నీతి, పవిత్రతను బట్టి యెహోవా అతనికి ప్రతిఫలమిచ్చాడని నేరుగా చెబుతుంది. ఇది సంపూర్ణ పాపరాహిత్యమా, నిర్దిష్ట విషయంలో నిర్దోషిత్వమా అనే ప్రశ్నను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలోని పునరుక్త నిర్మాణాన్ని స్పష్టత కోసం తెలుగులోనూ పునరావృతం చేశాం; సంధికారకమైన וַ ను తెలుగు వాక్యారంభంలో తప్పనిసరిగా ‘మరియు’ అని పెట్టకుండా సహజ కథన ప్రవాహంలో వ్యక్తం చేశాం.
