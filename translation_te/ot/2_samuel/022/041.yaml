translation:
  language: te
  text: నా శత్రువులు నాకు వెన్ను చూపేలా నీవు చేశావు[a]; నన్ను ద్వేషించినవారిని నేను నిర్మూలించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా శత్రువుల మెడను/మెడ వెనుక భాగాన్ని నాకు ఇచ్చావు.” అంటే విజేత ఎదుట శత్రువులు వెనుదిరిగి పారిపోయేలా చేశావని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: אֹיֵב అనే నామవాచకానికి ‘శత్రువు’ సహజమైన, స్పష్టమైన తెలుగు సమానం; ప్రథమ పురుష ఏకవచన ప్రత్యయం ‘నా’ను కోరుతుంది.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: నాకు వెన్ను చూపేలా నీవు చేశావు
  rationale: అక్షరార్థంగా ‘నాకు మెడ/మెడ వెనుక భాగాన్ని ఇచ్చావు.’ యుద్ధ సందర్భంలో ఇది శత్రువులు తిరిగి పారిపోయేలా చేయడాన్ని సూచించే నుడికారం. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా నుడికార భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం; మూలంలోని శరీర భాగపు చిత్రణను ‘వెన్ను చూపడం’ ద్వారా నిలిపాం.
- source_word: מְשַׂנְאַי
  choice: నన్ను ద్వేషించినవారిని
  rationale: שׂנא ధాతువు నుంచి వచ్చిన కృదంత రూపం ‘నన్ను ద్వేషించినవారు/ద్వేషించేవారు’ అని సూచిస్తుంది. గతకాల కావ్య సందర్భానికి ‘ద్వేషించినవారు’ సహజంగా సరిపోతుంది.
- source_word: וָאַצְמִיתֵם
  choice: నేను నిర్మూలించాను
  rationale: హిఫిల్ రూపంలోని צמת నాశనం చేయడం లేదా అంతం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నిర్మూలించాను’ ఆ తీవ్రతను గౌరవప్రదమైన ఆధునిక తెలుగులో కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కావ్యోచిత గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే రూపం. మొదటి పాదంలో హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు నుడికారంతో అందించి, అక్షరార్థ చిత్రణను పాదటిప్పణిలో నమోదు చేశాం.
