  text: He trains my hands for battle[b][a], and my arms can bend a bow of bronze.
translation:
  language: te
  text: యుద్ధం కోసం నా చేతులకు శిక్షణ ఇచ్చేవాడు ఆయనే; నా బాహువులు కంచు విల్లును వంచుతాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా బాహువులు కంచు విల్లును వంచగలవు”; లేదా, “నా బాహువుల బలానికి కంచు విల్లు వంగుతుంది.” హీబ్రూ క్రియారూపం అరుదైనది మరియు దాని ఖచ్చితమైన వ్యాకరణ విశ్లేషణ వివాదాస్పదమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: శిక్షణ ఇచ్చేవాడు
  rationale: למד పియేల్ కృదంతం బోధించడం లేదా శిక్షణ ఇవ్వడం అనే అర్థం ఇస్తుంది. యుద్ధ సందర్భంలో ఆచరణాత్మక సన్నద్ధతను ‘శిక్షణ ఇచ్చేవాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָדַי
  choice: నా చేతులకు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన రూపాన్ని నిలుపుతూ, శరీర సంబంధమైన స్పష్ట చిత్రణను కాపాడుతుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: מלחמה యుద్ధం లేదా పోరాటాన్ని సూచించవచ్చు. ఇక్కడ సైనిక సందర్భాన్ని సాధారణ ఆధునిక తెలుగులో ‘యుద్ధానికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנִחַת
  choice: వంచుతాయి
  rationale: ఈ అరుదైన రూపం పాఠ్యసంప్రదాయంలో విల్లు బాహువుల బలంతో వంగడాన్ని సూచిస్తుంది. సామర్థ్యాన్ని అదనంగా చేర్చకుండా హీబ్రూ వాక్యంలోని సంక్షిప్త ప్రత్యక్షతను ‘వంచుతాయి’ నిలుపుతుంది.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: కంచు విల్లును
  rationale: קשת ఆయుధమైన విల్లు; נחושה కంచు/రాగితో సంబంధం ఉన్న విశేషణం. ‘కంచు విల్లు’ బలమైన లోహ విల్లు అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: זְרֹעֹתַי
  choice: నా బాహువులు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచనాన్ని నిలుపుతుంది; ‘చేతులు’తో ఉన్న సమాంతర శరీర చిత్రణను కాపాడేందుకు ‘బాహువులు’ ఎంచుకోబడింది.
theological_decisions:
- issue: యుద్ధ నైపుణ్యంలో దేవుని కార్యం
  choice: ‘ఆయనే’ అనే పదంతో ముందున్న దేవుడే దావీదు చేతులకు శిక్షణ ఇచ్చేవాడని స్పష్టం చేయడం
  alternative: దీనిని విశ్వాసుల ఆత్మీయ పోరాటానికి సంబంధించిన సాధారణ ప్రకటనగా మార్చడం
  rationale: సందర్భం దావీదు నిజమైన సైనిక పోరాటాల్లో పొందిన విడుదల, శిక్షణ, బలాన్ని దేవునికి ఆపాదిస్తుంది. అనువాదం ఆ చారిత్రక అర్థాన్నే నిలుపుతుంది; రూపకాలంకరణను చేర్చదు.
- issue: וְנִחַת లోని వ్యాకరణ/అర్థ సందిగ్ధత
  choice: ‘నా బాహువులు ... వంచుతాయి’ అనే క్రియాశీల పఠనం
  alternative: ‘కంచు విల్లు నా బాహువుల చేత వంగుతుంది’ లేదా ‘నా బాహువులు కంచు విల్లును వంచగలవు’
  rationale: హీబ్రూ రూపం అరుదైనది; చర్య, ఫలితం, సామర్థ్యం మధ్య కొంత సందిగ్ధత ఉంది. ప్రధాన పాఠంలో సహజమైన క్రియాశీల రూపాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో చూపించడం ద్వారా దానిని నిశ్శబ్దంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘చేతులు—బాహువులు’ అనే కవితాత్మక సమాంతరతను నిలిపి, యుద్ధ సందర్భాన్ని ఆత్మీయీకరించలేదు.
