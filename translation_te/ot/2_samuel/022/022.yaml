source:
  edition: WLC
  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: te
  text: ఎందుకంటే నేను యాహ్వే మార్గాలను పాటించాను; నా దేవుని నుండి దుర్మార్గంగా తొలగిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవునికి విరోధంగా దుర్మార్గంగా ప్రవర్తించలేదు.”
    reason: రָשַׁעְתִּי מֵאֱלֹהָי అనే అసాధారణ హీబ్రూ నిర్మాణం దేవుని నుండి దుర్మార్గంగా తొలగిపోవడం అనే భావంతో పాటు, దేవునికి విరోధంగా దుర్మార్గంగా ప్రవర్తించడం అనే సంబంధిత భావాన్నీ అనుమతిస్తుంది.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁמַרְתִּי
  choice: పాటించాను
  rationale: שׁמר ఇక్కడ మార్గాలను కాపాడటం అనే అక్షరార్థం కంటే వాటి ప్రకారం నడుచుకోవడం, ఆచరించడం అనే భావంలో ఉంది; ‘పాటించాను’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: דַּרְכֵי
  choice: మార్గాలను
  rationale: దేవుడు నిర్దేశించిన ప్రవర్తనా విధానాలను సూచించే బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: దుష్టంగా తొలగిపోలేదు
  rationale: רשע లోని నైతిక దుష్టత్వాన్ని, מִן లోని ‘నుండి’ అనే విడిపోవు భావాన్ని కలిపి సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֱלֹהָי
  choice: నా దేవుని నుండి
  rationale: మొదటి పురుష సంబంధాన్ని, מִן యొక్క సహజమైన వియోగార్థాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా ఉంచడం మూలసాక్ష్యానికి దగ్గరగా ఉంటుంది.
- issue: רָשַׁעְתִּי מֵאֱלֹהָי అనే అసాధారణ నిర్మాణం
  choice: నా దేవుని నుండి దుష్టంగా తొలగిపోలేదు
  alternative: నా దేవునికి విరోధంగా దుష్టంగా ప్రవర్తించలేదు
  rationale: ప్రధాన పాఠం מִן లోని వియోగ భావాన్నీ רשע లోని నైతిక భావాన్నీ నిలుపుతుంది; అయితే ఈ నిర్మాణం దేవునికి విరోధంగా దుష్టంగా ప్రవర్తించడం అనే అర్థాన్నీ అనుమతిస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. రెండు సమాంతర వాక్యభాగాలను అర్ధవిరామంతో కలిపి హీబ్రూ గీతంలోని కారణాత్మక ప్రవాహాన్ని నిలిపాం.
