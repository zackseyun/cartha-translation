  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: te
  text: నీవు నా అడుగులకు విశాలమైన చోటు కల్పించావు[a]; నా చీలమండలు జారిపోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “నీవు నా కింద నా అడుగులను విశాలం చేశావు.” ఈ హీబ్రూ ప్రయోగం సురక్షితంగా అడుగువేయడానికి విస్తారమైన చోటు కల్పించడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నా చీలమండలు తూలిపోలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: విశాలమైన చోటు కల్పించావు
  rationale: רחב హిఫీల్ రూపం ‘విశాలం చేయడం, విస్తార స్థలం కల్పించడం’ అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు కవితా సందర్భంలో ఈ రూపం సహజంగా ఉండి మూలంలోని విశాలత భావాన్ని నిలుపుతుంది.
- source_word: צַעֲדַי
  choice: నా అడుగులకు
  rationale: צעד అనే నామవాచకం ‘అడుగు’ లేదా ‘అడుగువేయడం’ అని అర్థం. ‘నా అడుగులకు’ అనేది మూలంలోని వ్యక్తిగత శరీరచలన చిత్రాన్ని కాపాడుతుంది.
- source_word: תַּחְתֵּנִי
  choice: (విశాలమైన) చోటు
  rationale: పదశః ‘నా కింద’ అనే స్థలార్థం. తెలుగులో ‘నా అడుగులకు విశాలమైన చోటు’ అని అనువదించడం, కింద సురక్షితంగా కదలడానికి తగిన స్థలం ఇచ్చిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; పదశః రూపం పాదసూచికలో ఉంది.
- source_word: וְלֹא
  choice: …లేదు
  rationale: వావ్ సంధి మరియు నిషేధాన్ని సరళ సమన్వయంగా ఉంచి, ఉద్దేశార్థాన్ని అదనంగా చేర్చలేదు.
- source_word: מָעֲדוּ
  choice: జారిపోలేదు
  rationale: מעד అంటే ‘జారడం, తూలడం, నిలకడ కోల్పోవడం.’ చీలమండల సందర్భంలో ‘జారిపోలేదు’ సహజంగా ఉండి స్థిరత్వాన్ని తెలియజేస్తుంది.
- source_word: קַרְסֻלַּי
  choice: నా చీలమండలు
  rationale: ఈ పదం సాధారణంగా పాదాలకన్నా ప్రత్యేకంగా చీలమండల ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల శరీరచిత్రాన్ని ఖచ్చితంగా నిలుపుతుంది.
