translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. మూలంలోని ‘అడుగులు/చీలమండలు’ అనే శరీరచిత్రం నిలుపబడింది; మొదటి ఉపవాక్యంలోని హీబ్రూ నుడికారాన్ని అర్థస్పష్టంగా అనువదించి, పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
