source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: te
  text: స్తుతికి అర్హుడైన యాహ్వేకు[a] నేను మొరపెడతాను; నా శత్రువుల నుండి రక్షించబడతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్తుతింపబడినవాడు” లేదా “స్తుతించదగినవాడు.” హీబ్రూ కృదంతం యాహ్వేను స్తుతించదగినవానిగా వర్ణిస్తుంది; “స్తుతికి అర్హుడైన” అనే మాట ఆ భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: స్తుతికి అర్హుడైన
  rationale: הלל ధాతువు యొక్క పుయల్ కృదంతం యెహోవాను విశేషిస్తూ, ఆయన స్తుతించదగినవాడని తెలియజేస్తుంది. ‘స్తుతికి అర్హుడైన’ అనేది ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶקְרָא
  choice: నేను మొరపెడతాను
  rationale: దైవనామంతో వాడిన קרא ఇక్కడ కేవలం పేరు పలకడం కాక, ప్రార్థనలో సహాయం కోసం పిలవడం అనే భావాన్ని ఇస్తుంది. ‘మొరపెడతాను’ ఆ ప్రార్థనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וּמֵאֹיְבַי
  choice: నా శత్రువుల నుండి
  rationale: מִן ఉపసర్గ విమోచించబడే మూలాన్ని సూచిస్తుంది; మూలంలో లేని ‘చేతిలోనుండి’ వంటి విస్తరణను చేర్చలేదు.
- source_word: אִוָּשֵׁעַ
  choice: రక్షించబడతాను
  rationale: ישׁע యొక్క నిఫాల్ అసంపూర్ణ క్రియ మొదటి పురుష ఏకవచనం. కవితాత్మక సమాంతర నిర్మాణంలో אֶקְרָאతో కలిసి భవిష్యత్/పునరావృత భావానికి వీలున్నందున, తెలుగు క్రియారూప సమాంతరతను కాపాడుతూ ‘రక్షించబడతాను’ అని అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిల్ వాడుకలో సాధారణంగా గుర్తించబడే రూపం ‘యెహోవా’.
- issue: అసంపూర్ణ క్రియల కాల/దృక్కోణ భావం
  choice: నేను మొరపెడతాను … రక్షించబడతాను
  alternative: నేను మొరపెడుతున్నాను … రక్షించబడుతున్నాను / నేను మొరపెట్టినప్పుడు … రక్షించబడతాను
  rationale: హీబ్రూ అసంపూర్ణ రూపాలు భవిష్యత్, అలవాటైన చర్య, లేదా సాధారణ సత్యాన్ని సూచించగలవు. సందర్భాన్ని అతిగా నిర్ణయించకుండా రెండు క్రియల సమాంతరతను భవిష్యత్ రూపాలతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక వాక్యనిర్మాణం. మూలంలోని రెండు సమాంతర క్రియలను భవిష్యత్ రూపాల్లో ఉంచి, కారణార్థక సంబంధాన్ని అదనంగా చేర్చలేదు.
