- from: ఆయన నా బలమైన శత్రువు చేతిలోనుండి నన్ను విడిపించాడు; నన్ను ద్వేషించినవారి చేతిలోనుండి నన్ను విడిపించాడు, ఎందుకంటే వారు నాకంటే బలవంతులు.
  to: ఆయన నన్ను నా బలమైన శత్రువు నుండి, నన్ను ద్వేషించేవారి నుండి విడిపించాడు; వారు నాకంటే బలవంతులు కాబట్టి.
