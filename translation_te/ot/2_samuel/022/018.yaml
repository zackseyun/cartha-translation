  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: te
  text: ఆయన నన్ను నా బలమైన శత్రువు నుండి, నన్ను ద్వేషించేవారి నుండి విడిపించాడు; వారు నాకంటే బలవంతులు కాబట్టి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: నన్ను విడిపించాడు
  rationale: హిఫీల్ రూపంలోని ‘రక్షించు/బయటపడేయు’ భావాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאֹיְבִי עָז
  choice: నా బలమైన శత్రువు చేతిలోనుండి
  rationale: עָז అనే విశేషణానికి ఇక్కడ ‘బలమైన’ అని అర్థం; ఏకవచన ‘శత్రువు’ను అలాగే నిలిపింది.
- source_word: מִשֹּׂנְאַי
  choice: నన్ను ద్వేషించినవారి చేతిలోనుండి
  rationale: బహువచన కృదంతంలోని వ్యక్తిగత విరోధ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: ఎందుకంటే వారు నాకంటే బలవంతులు
  rationale: מִמֶּנִּי లోని తులనాత్మక భావాన్ని ‘నాకంటే’గా, אָמְצוּ లోని అధిక బలాన్ని ‘బలవంతులు’గా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని సమాంతర పునరుక్తిని నిలిపి, ఏకవచన శత్రువు మరియు బహువచన ద్వేషుల మధ్య తేడాను కాపాడింది.
