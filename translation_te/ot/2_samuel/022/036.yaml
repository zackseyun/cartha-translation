translation:
  language: te
  text: 'నీవు నీ రక్షణ అనే డాలును నాకు ఇచ్చావు;

    నీ వినయం[a] నన్ను గొప్పవానిగా చేసింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ సౌమ్యత,” లేదా “నీవు కృపతో దిగివచ్చి ఆదరించడం.” హీబ్రూ పదబంధం అర్థం చేసుకోవడం కష్టం; వక్తను హెచ్చించడానికి దేవుడు కృపతో దిగివచ్చి సహాయపడడాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן לִי
  choice: నాకు ఇచ్చావు
  rationale: נתן అనే క్రియ యొక్క సాధారణ భూతకాల భావాన్ని, దేవుణ్ణి నేరుగా సంబోధించే ఏకవచన రూపాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: מָגֵן
  choice: డాలు
  rationale: అమూర్తమైన ‘రక్షణ’గా మార్చకుండా, యుద్ధసంబంధమైన స్పష్టమైన రూపకాన్ని నిలిపింది.
- source_word: יִשְׁעֶךָ
  choice: నీ రక్షణ
  rationale: దేవుడు అనుగ్రహించే విమోచన లేదా కాపుదలను సూచించే మూలభావాన్ని, మూలంలోని ‘నీ’ అనే సంబంధాన్ని నిలిపింది.
- source_word: וַעֲנֹתְךָ
  choice: నీ వినయం
  rationale: ఈ కష్టమైన హీబ్రూ రూపానికి ‘వినయం/సౌమ్యత/దిగివచ్చి ఆదరించడం’ అనే భావాలు ప్రతిపాదించబడ్డాయి. ‘నీ వినయం’ మూలంలోని ఆశ్చర్యకరమైన దైవసంబంధ వర్ణనను వివరణతో కరిగించకుండా నిలుపుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: תַּרְבֵּנִי
  choice: నన్ను గొప్పవానిగా చేసింది
  rationale: רבה యొక్క హిఫిల్ రూపం ఇక్కడ ‘గొప్పగా చేయడం, హెచ్చించడం’ అనే ఫలితార్థాన్ని ఇస్తుంది; తెలుగులో ఇది సహజంగా, సందర్భానుగుణంగా ఉంది.
theological_decisions:
- issue: దేవునికి సంబంధించి וַעֲנֹתְךָ అనే పదం యొక్క భావం
  choice: నీ వినయం
  alternative: నీ సౌమ్యత; నీవు కృపతో దిగివచ్చి ఆదరించడం; నీ సహాయం
  rationale: దేవుడు తన సేవకుని హెచ్చించడానికి కృపతో తన్నుతాను తగ్గించుకున్నాడనే భావం సందర్భానికి సరిపోతుంది. అయితే హీబ్రూ పదం కష్టమైనదీ, బహుళార్థసాధ్యమైనదీ కావడంతో, ప్రధాన పాఠం theological tension‌ను నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా స్వరానికి తగిన గౌరవప్రదమైన భాష వాడబడింది. ‘డాలు’ అనే స్పష్టమైన యుద్ధరూపకం, ‘నీ వినయం’ అనే ఉద్దేశపూర్వకమైన theological tension రెండూ నిలుపబడ్డాయి; అస్పష్టతను పాదసూచిక వివరిస్తుంది.
