base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: te
  text: ఆయన ఆకాశాలను వంచి దిగివచ్చాడు; ఆయన పాదాల కింద గాఢాంధకారం[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కారు మేఘం.” హెబ్రీ పదం యెహోవా ప్రత్యక్షతతో ముడిపడిన దట్టమైన చీకటిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: వంచి
  rationale: נטה అనే క్రియ ఇక్కడ ఆకాశాలను కిందికి వంగేలా చేసిన దృశ్యాన్ని సూచిస్తుంది. ‘వంచి’ అనే పదం ఆ మహత్తర కావ్యచిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలను
  rationale: హెబ్రీ బహువచన రూపం ఆకాశమండలాన్ని సూచిస్తుంది. తెలుగు కావ్యప్రయోగంలో ‘ఆకాశాలను’ మూలంలోని విశ్వవ్యాప్త వైభవాన్ని నిలుపుతుంది.
- source_word: וַיֵּרַד
  choice: దిగివచ్చాడు
  rationale: ירד అనే క్రియకు నేరమైన, సహజమైన అర్థం ‘దిగివచ్చాడు’; ఇది దైవ ప్రత్యక్షతలోని కదలికను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַעֲרָפֶל
  choice: గాఢాంధకారం
  rationale: עֲרָפֶל దట్టమైన చీకటిని లేదా కారు మేఘాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ‘గాఢాంధకారం’ దాని సాంద్రతను, దైవ ప్రత్యక్షతకు సంబంధించిన గంభీర వాతావరణాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: תַּחַת
  choice: కింద
  rationale: ఇది నేరమైన స్థలసంబంధ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רַגְלָיו
  choice: ఆయన పాదాలు
  rationale: మూలంలోని ‘అతని పాదాలు’ అనే స్పష్టమైన శరీరరూపకాన్ని వ్యాఖ్యానించకుండా నిలుపుతుంది; దేవునికి గౌరవార్థకంగా ‘ఆయన’ వాడాం.
theological_decisions:
- issue: దేవుని ప్రత్యక్షతలో శరీరసంబంధమైన, స్థలసంబంధమైన కావ్యచిత్రణ
  choice: ‘దిగివచ్చాడు’, ‘ఆయన పాదాల కింద’ అనే మూల చిత్రణను యథాతథంగా నిలుపడం
  alternative: ‘పరలోకం నుంచి తనను ప్రత్యక్షపరచుకున్నాడు’ వంటి శరీరరహిత వివరణగా మార్చడం
  rationale: హెబ్రీ పాఠం దేవుని ప్రత్యక్షతను మానవరూపక, స్థలసంబంధ భాషలో కవితాత్మకంగా చిత్రిస్తుంది. దైవాతీతతతో ఈ రూపకానికి ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా మూల పాఠం ప్రకారమే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కావ్యానికి తగిన గంభీరతను నిలిపాం. ‘ఆకాశాలను వంచి’ అనే విశ్వవ్యాప్త రూపకాన్నీ, ‘పాదాల కింద’ అనే మానవరూపకాన్నీ సరళీకరించలేదు.
