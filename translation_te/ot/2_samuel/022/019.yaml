  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: te
  text: వారు నా ఆపద రోజున నన్ను ఎదుర్కొన్నారు[a]; అయితే యాహ్వే[b] నాకు ఆధారమయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నా ఆపద రోజున నాపైకి వచ్చారు”; లేదా, “నాకు ఎదురుపడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో దేవుని వ్యక్తిగత నామం YHWH ఉంది; దీనిని కొన్ని అనువాదాలు “యెహోవా” లేదా “ప్రభువు” అని అనువదిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: నన్ను ఎదుర్కొన్నారు
  rationale: పీయేల్ రూపంలోని קדמ ఈ శత్రుత్వ సందర్భంలో దూకుడుగా ఎదురుపడడం లేదా ఎదుర్కోవడం అనే భావాన్ని ఇస్తుంది. ‘ఎదుర్కొన్నారు’ ఆ ప్రతికూల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּיוֹם אֵידִי
  choice: నా ఆపద రోజున
  rationale: אֵיד తీవ్రమైన విపత్తు లేదా ఆపదను సూచిస్తుంది. ‘నా ఆపద రోజున’ కాలసూచక హెబ్రీ నిర్మాణాన్ని స్పష్టమైన తెలుగు నుడికారంలో అందిస్తుంది.
- source_word: וַיְהִי
  choice: అయితే ... అయ్యాడు
  rationale: వ్యాకరణపరంగా సంధానార్థకమైన వావ్ ఉన్నప్పటికీ, శత్రువుల ఎదురుదాడికి యాహ్వే ఇచ్చిన ఆధారానికి మధ్య సందర్భోచితమైన వ్యతిరేకత ఉంది; అందువల్ల ‘అయితే’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: מִשְׁעָן לִי
  choice: నాకు ఆధారమయ్యాడు
  rationale: מִשְׁעָן అక్షరార్థంగా ఆనుకోవడానికి ఉపయోగపడే వస్తువును, రూపకాలంకారంగా తోడ్పాటు లేదా ఆధారాన్ని సూచిస్తుంది. ‘నాకు ఆధారమయ్యాడు’ ఈ రూపకాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా ఉంచుతుంది; అదే సమయంలో ‘యెహోవా’ అనే భిన్న సంప్రదాయ ఉచ్చారణతో కలపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. కవితాత్మక సంక్షిప్తతను కాపాడుతూ హెబ్రీ వాక్యంలోని శత్రుత్వ భావం, విరోధ సంబంధం, ఆధార రూపకం నిలుపబడ్డాయి.
