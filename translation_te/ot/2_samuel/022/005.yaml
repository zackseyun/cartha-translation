source:
  edition: WLC
  text: כִּ֥י אֲפָפֻ֖/נִי מִשְׁבְּרֵי מָ֑וֶת נַחֲלֵ֥י בְלִיַּ֖עַל יְבַעֲתֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: te
  text: 'ఎందుకంటే మరణపు ఉప్పెనలు[a] నన్ను చుట్టుముట్టాయి;

    నాశనపు ఉద్ధృత ప్రవాహాలు[b] నన్ను తీవ్రంగా భయపెట్టాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉప్పెనలు’ అనే పదాన్ని ‘విరుచుకుపడే అలలు’ లేదా ‘మహా అలలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదాన్ని బెలీయాలును వ్యక్తినామంగా తీసుకొని ‘బెలీయాలు యొక్క ఉద్ధృత ప్రవాహాలు’ అని కూడా అనువదించవచ్చు; లేదా ‘దుష్టత్వపు ఉద్ధృత ప్రవాహాలు’ అని భావించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే హీబ్రూ అవ్యయపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲפָפֻנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: అన్ని వైపుల నుంచి ఆవరించి ప్రమాదంలో బంధించిన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִשְׁבְּרֵי
  choice: ఉప్పెనలు
  rationale: విరుచుకుపడే సముద్రపు అలలు అనే బలమైన జలచిత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన పదాలను పాదసూచికలో ఉంచాం.
- source_word: מָוֶת
  choice: మరణపు
  rationale: మూలంలోని ‘మరణం’ అనే నామవాచకాన్ని రూపక సంబంధంతో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: נַחֲלֵי
  choice: ఉద్ధృత ప్రవాహాలు
  rationale: వాగులు లేదా ప్రవాహాలు అనే మూలార్థంతో పాటు, కవితా సందర్భంలోని వేగంగా పొంగివచ్చే ప్రమాదకర జలాల తీవ్రతను తెలియజేస్తుంది.
- source_word: בְלִיַּעַל
  choice: దుష్టత్వపు
  rationale: ఇక్కడ వ్యక్తినామంగా కాక, నీచత్వం, పనికిరానితనం, దుష్టతను సూచించే సాధారణ నామవాచకంగా గ్రహించి, తెలుగులో సందర్భానికి సహజమైన ‘దుష్టత్వం’ను ఎంచుకున్నాం.
- source_word: יְבַעֲתֻנִי
  choice: నన్ను తీవ్రంగా భయపెట్టాయి
  rationale: ఆకస్మికమైన తీవ్రమైన భయం లేదా దిగ్భ్రాంతిని సూచించే క్రియాబలాన్ని సులభమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: בְלִיַּעַל ను వ్యక్తినామమైన ‘బెలీయాలు’గా తీసుకోవాలా, లేక సాధారణ నామవాచకంగా తీసుకోవాలా
  choice: ప్రధాన పాఠ్యంలో ‘దుష్టత్వపు’ అని సాధారణ నామవాచకంగా అనువదించాం.
  alternative: ‘బెలీయాలు యొక్క’ లేదా ‘వినాశపు’
  rationale: ఈ కవితా సమాంతర నిర్మాణంలో ఈ పదం వినాశకరమైన దుష్టశక్తులను వర్ణిస్తుంది. దానిని తరువాతి కాలపు వ్యక్తీకృత దుష్టసత్తకు పేరుగా నిర్బంధించడం మూలపాఠ్యం కోరని భావాన్ని చేర్చవచ్చు. అయినా నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా కవిత్వానికి తగిన గంభీరతతో రూపొందించాం. జలప్రళయ రూపకాన్ని స్పష్టంగా ఉంచుతూ, అరుదైన లేదా అతిగా శాస్త్రీయ పదజాలాన్ని నివారించాం.
