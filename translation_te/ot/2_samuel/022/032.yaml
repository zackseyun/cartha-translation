revisions:
- from: ఎందుకంటే, యెహోవా తప్ప దేవుడు ఎవరు? మన దేవుడు తప్ప బండ ఎవరు?[a]
  to: ఎందుకంటే యాహ్వే తప్ప దేవుడు ఎవరు? మరి మన దేవుడు తప్ప బండవంటివాడు ఎవరు?[a]
  rationale: The revision conforms the divine name to “Yahweh,” preserves both rhetorical questions and the conjunction, and makes the second rock-metaphor clause natural in modern standard Telugu. The footnote preserves the viable direct/title-like rendering without forcing that reading into the main text.
