  edition: WLC
  text: כִּ֥י מִי אֵ֖ל מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֖וּר מִֽ/בַּלְעֲדֵ֥י אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/032.yaml
  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: te
  text: ఎందుకంటే యాహ్వే తప్ప దేవుడు ఎవరు? మరి మన దేవుడు తప్ప బండవంటివాడు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన దేవుడు తప్ప బండ ఎవరు?” హీబ్రూలో “బండ” దేవుని స్థిరత్వం, బలం, రక్షణను సూచించే తరచైన రూపకం; కొన్ని సందర్భాల్లో అది దాదాపు ఒక బిరుదులా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి ఆధారాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారప్రశ్నలోని ప్రశ్నార్థక సర్వనామాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఏకదైవ సందర్భంలో నిజమైన దేవుణ్ణే సూచిస్తున్నందున సాధారణ ఆధునిక తెలుగు పదాన్ని వాడింది.
- source_word: מִבַּלְעֲדֵי
  choice: తప్ప
  rationale: యెహోవా కాక మరెవరూ దేవుడు కాదనే మినహాయింపు మరియు ఏకైకత్వ భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וּמִי
  choice: ఎవరు
  rationale: తెలుగులో రెండు సమాంతర ప్రశ్నలను వరుసగా ఉంచడం సహజం; వాక్యారంభంలోని అనుసంధానం భావపరంగా నిలిచినా అదనపు ‘మరి’ అవసరం లేదు.
- source_word: צוּר
  choice: బండ
  rationale: స్థిరత్వం, బలం, రక్షణను సూచించే మూల హీబ్రూ రూపకాన్ని వివరణాత్మక పదంతో మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన రూపంలో నిలిపింది.
- issue: צוּר పదాన్ని బిరుదుగా లేదా సాధారణ రూపకంగా చూపడం
  choice: బండ
  alternative: బండ అయినవాడు / శరణదుర్గం
  rationale: హీబ్రూలో ఇది విధేయ రూపకంగా ఉంది; ‘బండ’ ఆ రూపకాన్నీ దాని ఉద్దేశపూర్వక విస్తృత భావాన్నీ కాపాడుతుంది. అది దైవబిరుదుగా కూడా వినిపించవచ్చనే అవకాశాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కవితాత్మక సమాంతర నిర్మాణం. అలంకారప్రశ్నల బలం, దేవుని ఏకైకత్వ వాదన, ‘బండ’ అనే మూల రూపకం నిలుపబడ్డాయి.
