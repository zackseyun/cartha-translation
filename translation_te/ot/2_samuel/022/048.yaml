translation:
  language: te
  text: నాకు ప్రతీకారాలు ఇచ్చే దేవుడు, ప్రజలను నా కిందకు దించేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ‘దేవుడు’ అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הַנֹּתֵן נְקָמֹת לִי
  choice: నాకు ప్రతీకారాలు ఇచ్చే
  rationale: נְקָמוֹת బహువచనాన్ని, לִי యొక్క ప్రత్యక్ష ‘నాకు’ భావాన్ని నిలుపుతుంది; ‘నా పక్షంగా ప్రతీకారం తీర్చే’ అని వివరణాత్మకంగా మార్చదు.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: ప్రజలను నా కిందికి దించేవాడు
  rationale: యుద్ధసందర్భంలోని అధీనపరచే చిత్రాన్ని నిలుపుతూ మూలంలోని ‘దించు’ మరియు ‘నా కింద’ అంశాలను ప్రత్యక్షంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రతీకారం ఎవరిచేత, ఎవరికోసం జరుగుతుందనే సంబంధం
  choice: నాకు ప్రతీకారాలు ఇచ్చే
  alternative: నా పక్షంగా ప్రతీకారం తీర్చే
  rationale: మూలంలోని לִי అక్షరార్థంగా ‘నాకు’; దానిని ‘నా పక్షంగా’ అని విస్తరించడం మూలంలో ఉన్న సంబంధాన్ని ముందుగానే వ్యాఖ్యానిస్తుంది.
- issue: ప్రజల అధీనతను తెలిపే రూపకం
  choice: ప్రజలను నా కిందికి దించేవాడు
  alternative: ప్రజలను నాకు లోబరచేవాడు
  rationale: ప్రత్యామ్నాయం భావాన్ని స్పష్టం చేసినా, మూలంలోని స్థలరూపకమైన ‘నా కిందికి దించు’ను కాపాడటం మంచిది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా శైలికి తగిన గంభీరతతో, మూలంలోని సమాంతర నిర్మాణం మరియు ఉద్దేశపూర్వక అస్పష్టతను నిలిపింది.
