  yaml_path: translation/ot/2_samuel/022/002.yaml
  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “యెహోవా నా శిల, నా కోట, నన్ను విడిపించేవాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַלְעִי
  choice: నాకు ఆశ్రయశిల
  rationale: סֶלַע అక్షరార్థంగా పెద్ద రాతిబండ లేదా శిల; ఈ కీర్తనాత్మక సందర్భంలో భద్రతనిచ్చే దృఢమైన ఆశ్రయం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מְצֻדָתִי
  choice: నా కోట
  rationale: ముట్టడిని తట్టుకునే రక్షణస్థలం అనే రూపకాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: מְפַלְטִי לִי
  choice: నన్ను విడిపించేవాడు
  rationale: מְפַלְטִי అనే ‘నా విమోచకుడు/విడిపించేవాడు’ భావాన్నీ, לִי వల్ల కలిగే వ్యక్తిగత ప్రయోజనాన్నీ సహజమైన తెలుగు క్రియారూపంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన నామరూపంలో సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక ప్రత్యేక దైవనామం ఉన్నందున దానిని నామరూపంగా నిలిపాం; ఇది ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: מְפַלְטִי לִי లోని לִי వ్యక్తీకరణ
  choice: నన్ను విడిపించేవాడు
  alternative: నా విమోచకుడు, నాకు
  rationale: ‘నాకు’ అని విడిగా ఉంచితే తెలుగులో అసహజ పునరుక్తి వస్తుంది. వ్యక్తిగత సంబంధం మరియు ప్రయోజనం ‘నన్ను’ అనే కర్మరూపంలో నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనాత్మక శైలిని ఉంచుతూ, హీబ్రూ సమాంతర రూపకాలైన శిల, కోట, విడిపించేవాడు అనే క్రమాన్ని కాపాడాం.
