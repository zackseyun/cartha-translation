translation:
  language: te
  text: ఆయన నా పాదాలను[c] ఆడజింకల పాదాలవలె[a] చేస్తాడు, నా ఎత్తైన ప్రదేశాల మీద[b] నన్ను నిలబెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదం ప్రత్యేకంగా ఆడజింకలను సూచిస్తుంది; ఇది చురుకుదనం, కొండప్రదేశాల్లో స్థిరంగా అడుగువేయడం అనే భావచిత్రం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా ఎత్తుల మీద నన్ను నిలబెడతాడు.”
