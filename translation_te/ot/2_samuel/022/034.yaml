  source_fidelity: 'మొదటి భాగంలోని పాద-ప్రత్యయం మసొరెటికు సంబంధించిన కేతీవ్/కెరే భేదాన్ని కలిగి ఉంది: కేతీవ్‌లో ‘అతని పాదాలు,’ కెరేలో ‘నా పాదాలు.’ సందర్భం, సమాంతర కీర్తన 18:33, మరియు రెండో భాగంలోని మొదటి పురుష ప్రత్యయం కెరే పఠనమైన ‘నా పాదాలు’కు మద్దతిస్తాయి. అయితే ఈ పాఠభేదాన్ని పాదసూచికలో తెలియజేయాలి. మిగిలిన అనువాదం హెబ్రీయ కారణార్థక క్రియలను, ఆడజింకల ఉపమానాన్ని, ‘నా ఎత్తైన ప్రదేశాలు’ అనే భావాన్ని విశ్వసనీయంగా అందిస్తుంది.'
