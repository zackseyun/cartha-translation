  - marker: c
    text: హెబ్రీ లిఖిత పాఠంలో, “అతని పాదాలను” అని ఉంది; సంప్రదాయ పఠనంలో, “నా పాదాలను” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: చేసి
  rationale: పీయేల్ రూపం ఇక్కడ ‘దేనివలె చేయడం’ అనే కారణార్థాన్ని తెలియజేస్తుంది; తెలుగు పోలికతో కలిపి ‘చేసి’ సహజంగా ఉంటుంది.
- source_word: רגליו (Ketiv; contextually רַגְלַי)
  choice: నా పాదాలను
  rationale: లిఖిత పాఠంలో మూడవ పురుష ప్రత్యయం కనిపించినా, వాక్యసందర్భం మరియు సమాంతర కీర్తన 18:33 మొదటి పురుషార్థాన్ని బలపరుస్తాయి; రెండో భాగంలోని ‘నన్ను/నా’తోనూ ఇది సరిపోతుంది.
- source_word: כָּאַיָּלוֹת
  choice: ఆడజింకల పాదాలవలె
  rationale: స్త్రీలింగ బహువచనం ఆడజింకలను సూచిస్తుంది. పోలిక పాదాల నైపుణ్యానికని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘పాదాలు’ పునరుక్తి చేయబడింది.
- source_word: בָּמוֹתַי
  choice: నా ఎత్తైన ప్రదేశాల మీద
  rationale: పదం ‘ఎత్తులు/ఎత్తైన ప్రదేశాలు’ అని అర్థం; ఇక్కడ ఆరాధనా సంబంధమైన ‘ఉన్నత స్థలాలు’ అనే సాంకేతిక భావాన్ని అనవసరంగా రుద్దకుండా, కవితాత్మక భౌగోళిక భావం నిలుపబడింది.
- source_word: יַעֲמִדֵנִי
  choice: నన్ను నిలబెడతాడు
  rationale: హిఫీల్ రూపంలోని ‘నిలిచేలా చేయడం, నిలబెట్టడం’ అనే కారణార్థాన్ని నేరుగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘సురక్షితంగా’ అనే భావాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
