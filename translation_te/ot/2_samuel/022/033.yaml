- from: దేవుడే నాకు బలమైన ఆశ్రయం; ఆయన నా మార్గాన్ని నిర్దోషమైనదిగా చేస్తాడు.[a]
  to: దేవుడు నాకు బలమైన ఆశ్రయం; ఆయన నా మార్గాన్ని పరిపూర్ణం చేస్తాడు.[a]
  rationale: The revision removes unwarranted emphasis from the opening divine title and uses a broader, source-appropriate equivalent for תָּמִים. The textual ambiguity in the final possessive is retained in the footnote, while the main text follows the parallel reading supported by Psalm 18:32.
