  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: te
  text: దేవుడు నాకు బలమైన ఆశ్రయం; ఆయన నా మార్గాన్ని పరిపూర్ణం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యంజన పాఠాన్ని మరింత అక్షరార్థంగా అనుసరిస్తే, “ఆయన తన మార్గాన్ని పరిపూర్ణం చేస్తాడు” అని అనువదించవచ్చు. కీర్తన 18:32లోని సమాంతర వాక్యం “నా మార్గాన్ని” అనే పఠనానికి మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుడే
  rationale: నిర్దిష్టతను, కవితాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מָעוּזִּי חָיִל
  choice: నాకు బలమైన ఆశ్రయం
  rationale: మָעוֹז్‌లోని రక్షణ భావాన్నీ חַיִל‌లోని బల భావాన్నీ నిలుపుతూ, అతిగా సైనిక రూపకాన్ని రుద్దకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּתֵּר
  choice: చేస్తాడు
  rationale: కష్టమైన ఈ క్రియకు కీర్తన 18:32లోని సమాంతర వాక్యాన్ని దృష్టిలో ఉంచుకొని, తరువాతి విశేషణంతో సహజంగా కలిసే కారణార్థక భావాన్ని ఇస్తుంది.
- source_word: תָּמִים
  choice: నిర్దోషమైనదిగా
  rationale: సంపూర్ణత, యథార్థత, నిందారాహిత్యం అనే భావపరిధిలో ఇక్కడ సందర్భానుకూలమైన పదం; ఆధునిక పాఠకుడు ‘పరిపూర్ణం’ను సంపూర్ణ పాపరాహిత్యంగా అపార్థం చేసుకునే అవకాశాన్ని తగ్గిస్తుంది.
- source_word: דרכו
  choice: నా మార్గాన్ని
  rationale: వ్యంజన పాఠం ‘అతని మార్గం’ అని చదవడానికి వీలున్నా, కీర్తన 18:32లోని సమాంతర పాఠం మొదటి పురుషార్థాన్ని బలపరుస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: చివరి పదంలోని సర్వనామ ప్రత్యయ పఠనం
  choice: దేవుడు వక్త మార్గాన్ని నిర్దోషమైనదిగా చేస్తాడు
  alternative: దేవుడు తన మార్గాన్ని నిర్దోషమైనదిగా చేస్తాడు
  rationale: మసొరేటిక్ సూచనలతో ఉన్న సమూయేలు పాఠం ‘అతని/తన మార్గం’ అనే అర్థాన్ని సూచించగలదు; అయితే కీర్తన 18:32లోని సమాంతర వాక్యం ‘నా మార్గం’ అనే పఠనానికి మద్దతిస్తుంది. సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన కవితా వచనం. ‘దేవుడే’ ఉద్ఘాటనను, ‘బలమైన ఆశ్రయం’ రక్షణతో కూడిన బల భావాన్ని నిలుపుతాయి.
