source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే, నీవే నా దీపం[a]; యాహ్వే నా చీకటిని వెలిగిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నా దీపం’; ‘నా వెలుగు’ అని కూడా భావానువాదం చేయవచ్చు. హీబ్రూలో అమూర్తమైన వెలుగు కంటే దీపం అనే స్పష్టమైన రూపకం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా చీకటిలో వెలుగు కలిగిస్తాడు.’ క్రియకు ప్రకాశింపజేయడం లేదా వెలుగు కలిగించడం అనే కారణార్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు ఆధారాన్ని లేదా వివరణను పరిచయం చేసే సంధానార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ఉద్ఘాటనగా మాత్రమే పరిమితం చేయదు.
- source_word: נֵירִי
  choice: నా దీపం
  rationale: נֵר అమూర్తమైన ‘వెలుగు’ కంటే వెలుగునిచ్చే దీపాన్ని సూచిస్తుంది. దేవుడే వెలుగు, దారి చూపు కలిగించే మూలమనే సజీవ రూపకాన్ని ఇది కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: יַגִּיהַּ
  choice: వెలిగిస్తాడు
  rationale: נגד కాదు, נגה ధాతువు హిఫీల్ రూపం ‘ప్రకాశింపజేయడం, వెలుగు కలిగించడం’ అనే కారణార్థాన్ని ఇస్తుంది. ‘వెలిగిస్తాడు’ సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని, కవితాత్మక స్పష్టతను నిలుపుతుంది.
- source_word: חָשְׁכִּי
  choice: నా చీకటిని
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘చీకటి’ని నేరుగా అనువదిస్తూ, అది ఆపదనా, దుఃఖమా, మరేదైనా అనుభవమా అని అతిగా నిర్ధారించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం ఇక్కడ దైవనామాన్నే రెండుసార్లు ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నామంగా నిలుపుతుంది; రెండవ ఉపవాక్యంలో కూడా నామాన్ని పునరుక్తి చేయడం హీబ్రూ సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- issue: రెండవ ఉపవాక్యంలో సంబోధన నుంచి మూడవ పురుషానికి మార్పు
  choice: ‘యాహ్వే నా చీకటిని వెలిగిస్తాడు’ అని మూడవ పురుష నిర్మాణాన్ని నిలపడం
  alternative: ‘నీవు నా చీకటిని వెలిగిస్తావు’
  rationale: మొదటి ఉపవాక్యంలో దేవుణ్ణి నేరుగా ‘నీవు’ అని సంబోధించిన తరువాత, హీబ్రూ రెండవ ఉపవాక్యంలో יהוה అనే నామాన్ని మళ్లీ ఉంచి మూడవ పురుష క్రియను వాడుతుంది. ఆ కవితాత్మక మార్పును సులభతరం చేసి తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను ఉంచింది. ‘నీవే’ హీబ్రూలోని స్వతంత్ర సర్వనామానికి ఉన్న ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది. దైవనామ పునరుక్తి, ‘దీపం/చీకటి’ రూపక విరుద్ధత, రెండవ పురుషం నుంచి మూడవ పురుషానికి మార్పు అన్నీ నిలుపబడ్డాయి.
