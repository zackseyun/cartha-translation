source:
  edition: WLC
  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: te
  text: నమ్మకస్థునితో నీవు నమ్మకస్థుడిగా కనబడతావు; నిర్దోషుడైన యోధునితో నీవు నిర్దోషుడిగా కనబడతావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: నమ్మకమైనవాడు
  rationale: ఈ సందర్భంలో ఒడంబడికపరమైన విశ్వసనీయత, భక్తినిబద్ధత అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּתְחַסָּד
  choice: నమ్మకంగా వ్యవహరిస్తావు
  rationale: మూలంలోని חָסִיד పదంతో ఉన్న పదక్రీడను ‘నమ్మకమైనవాడు—నమ్మకంగా’ అనే సమాంతర రూపంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: גִּבּוֹר תָּמִים
  choice: నిర్దోషుడైన యోధుడు
  rationale: גִּבּוֹר యొక్క బలశాలి/వీరుడు భావాన్ని సందర్భానుసారంగా ‘యోధుడు’గా, תָּמִים యొక్క సమగ్రత లేదా నిందారాహిత్యాన్ని ‘నిర్దోషుడు’గా అందిస్తుంది.
- source_word: תִּתַּמָּם
  choice: నిర్దోషంగా వ్యవహరిస్తావు
  rationale: תָּמִיםతో ఉన్న మూల పదసామ్యాన్ని తెలుగులో ‘నిర్దోషుడు—నిర్దోషంగా’గా ప్రతిబింబిస్తూ, దేవుడు తనను అలా చూపించుకుంటాడు/అలా వ్యవహరిస్తాడు అనే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని ప్రతిస్పందనాత్మక లక్షణవర్ణన
  choice: ‘నీవు ... వ్యవహరిస్తావు’ అనే సమాంతర వాక్యనిర్మాణం
  alternative: ‘నీవు నిన్ను ...గా చూపించుకుంటావు’
  rationale: హిత్పయేల్ రూపాల పరస్పర/ప్రవర్తనా భావాన్ని స్పష్టంగా తెలుపుతుంది; దేవుని స్వభావం మారుతుందని సూచించకుండా, వ్యక్తితో ఆయన వ్యవహరించే విధానాన్ని వ్యక్తం చేస్తుంది.
- issue: תָּמִים భావపరిధి
  choice: నిర్దోషుడు
  alternative: యథార్థవంతుడు / సంపూర్ణుడు
  rationale: నైతిక సమగ్రత, నిందారాహిత్యం రెండింటినీ సాధారణ పాఠకునికి సులభంగా అందించే పదం; అయితే మూలంలోని ‘సంపూర్ణత’ భావపరిధిని పూర్తిగా నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా సమాంతర నిర్మాణాన్ని, మూలంలోని పదపునరుక్తిని సాధ్యమైనంతవరకు కాపాడుతూ గంభీరమైన కానీ సులభగ్రాహ్యమైన శైలి ఉపయోగించబడింది.
