  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: te
  text: యాహ్వే దావీదును అతని శత్రువులందరి చేతినుండి, సౌలు చేతినుండి విడిపించిన రోజున, దావీదు ఈ పాటలోని మాటలను యాహ్వేకు పలికాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ పాటలోని మాటలను”; ఈ రచనను మూలపాఠం స్పష్టంగా పాటగా పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: దבר అనే క్రియకు సాధారణ అర్థం ‘మాట్లాడు/పలుకు’. సందర్భం పాట అయినప్పటికీ, మూలపాఠం ‘ఈ పాటలోని మాటలను పలికాడు’ అని చెప్పే నిర్మాణాన్ని నిలుపుతుంది; అందువల్ల ‘పాడాడు’ అని సరళీకరించలేదు.
- source_word: לַיהוָה / יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం; బిరుదుగా మార్చలేదు.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ఈ పాటలోని మాటలను
  rationale: మూలంలోని ‘మాటలు’ మరియు ‘పాట’ అనే రెండు అంశాలనూ నిలుపుతూ సహజమైన ఆధునిక తెలుగు నిర్మాణాన్ని వాడాం.
- source_word: בְּיוֹם
  choice: రోజున
  rationale: ఈ పదబంధం పాట పలికిన సందర్భాన్ని సూచిస్తుంది. ‘రోజున’ మూలంలోని కాలసూచనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הִצִּיל
  choice: విడిపించిన
  rationale: נצל ఇక్కడ శత్రువుల అధికారము లేదా ప్రమాదం నుంచి రక్షించి బయటకు తేవడాన్ని సూచిస్తుంది; ‘విడిపించిన’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִכַּף
  choice: చేతిలోనుండి
  rationale: כף యొక్క ‘చేయి/అరచేయి’ రూపకాన్ని నిలుపుతూ, శత్రువుల అధికారం లేదా పట్టునుంచి విడిపించడాన్ని తెలిపే తెలుగు బైబిలు శైలిని అనుసరించాం.
- source_word: כָּל אֹיְבָיו
  choice: అతని శత్రువులందరి
  rationale: సమూహ సంపూర్ణతను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలిపాం. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా పరిగణించబడినా, ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘పాటలోని మాటలను పలికాడు’ అనే ఉద్దేశపూర్వక నిర్మాణాన్ని కాపాడాం.
