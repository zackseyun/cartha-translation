  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: te
  text: 'యాహ్వే ఆకాశం నుండి ఉరిమాడు;

    సర్వోన్నతుడు తన స్వరం వినిపించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన స్వరాన్ని ఇచ్చాడు.” ఇది “ఉరిమాడు” అనే మాటకు సమాంతరంగా ఉన్న హీబ్రూ కవితా వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: ఉరిమాడు
  rationale: רעם యొక్క హిఫీల్ రూపం ఇక్కడ తుఫాను-దైవప్రత్యక్షత సందర్భంలో ఉరుము పుట్టించడాన్ని సూచిస్తుంది. ‘ఉరిమాడు’ తెలుగులో సహజంగా ఉండి వాతావరణ సంబంధిత కవితా చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִן שָׁמַיִם
  choice: ఆకాశం నుండి
  rationale: שָׁמַיִם అంటే ‘ఆకాశం/ఆకాశాలు’ లేదా ‘పరలోకం’ కావచ్చు. ఈ సందర్భంలో ‘ఆకాశం నుండి’ స్థలార్థాన్ని సహజంగా తెలియజేస్తూ దైవప్రత్యక్షత భావాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: וְעֶלְיוֹן
  choice: సర్వోన్నతుడు
  rationale: עֶלְיוֹן ఇక్కడ యాహ్వేకు సమాంతరంగా వాడిన దైవ బిరుదు. ‘సర్వోన్నతుడు’ దాని అత్యున్నత స్థితిని తెలిపే గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: יִתֵּן קוֹלוֹ
  choice: తన స్వరం వినిపించాడు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘తన స్వరాన్ని ఇచ్చాడు.’ తెలుగులో అది అసహజంగా ఉండటంతో, స్వరాన్ని వెలువరించడం అనే భావాన్ని ‘తన స్వరం వినిపించాడు’గా సహజంగా వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: యాహ్వే మరియు ‘సర్వోన్నతుడు’ మధ్య సంబంధం
  choice: ఒకే దేవునిని సూచించే సమాంతర నామం మరియు బిరుదుగా అనువదించడం
  alternative: ‘సర్వోన్నతుడు’ను విడిగా ఉన్న వ్యక్తిగా చదవడం
  rationale: హీబ్రూ కవితా సమాంతర నిర్మాణంలో రెండవ పాదం మొదటి పాదాన్ని ప్రతిధ్వనిస్తుంది. అనువాదం ఈ సమాంతరతను చూపుతుంది; అయితే మూలంలో లేని వివరణాత్మక సమీకరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల నిర్మాణాన్ని నిలిపి, అసహజమైన అక్షరానువాదాన్ని ప్రధాన పాఠంలో నివారించాం.
