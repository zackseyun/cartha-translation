  text: He made darkness a shelter around him[a], a massing of waters, thick clouds of the skies.
translation:
  language: te
  text: ఆయన తన చుట్టూ చీకటిని ఆశ్రయాలుగా ఉంచాడు—నీటి గుమికూడిన రాశి, ఆకాశపు దట్టమైన మేఘాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన చుట్టూ చీకటిని ఆశ్రయాలుగా ఉంచాడు—నీటి సమూహం, ఆకాశపు దట్టమైన మేఘాలు.” హీబ్రూ వాక్యం అత్యంత కవితాత్మకంగా ఉంది. “నీటి గుమికూడిన రాశి” అని అనువదించిన అరుదైన పదబంధానికి “నీటి సమూహం” అనే అర్థం కూడా సాధ్యమే; భావానువాదంగా “నల్లని వర్షమేఘాలు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁת
  choice: ఉంచాడు
