  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: te
  text: ఆయన నన్ను విశాలమైన స్థలంలోకి తీసుకొచ్చాడు[a]; నన్ను రక్షించాడు, ఎందుకంటే ఆయన నన్నుబట్టి ఆనందించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశాలమైన బహిరంగ స్థలానికి.’ హీబ్రూ రూపకం ఇరుకు లేదా ఆపదకు విరుద్ధంగా స్వేచ్ఛను, ఉపశమనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన నన్ను ఇష్టపడ్డాడు’ / ‘ఆయన నాపట్ల సంతోషించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: బయటికి తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటికి తీసుకురావడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַמֶּרְחָב
  choice: విశాలమైన చోటికి
  rationale: మֶרְחָב సూచించే విశాలమైన, తెరచిన స్థలాన్ని వ్యక్తపరుస్తూ, ఇరుకు లేదా ఆపద నుంచి విడుదల అనే హీబ్రూ దృశ్యాన్ని నిలుపుతుంది.
- source_word: יְחַלְּצֵנִי
  choice: నన్ను రక్షించాడు
  rationale: חלץ పియేల్ రూపంలోని బయటికి లాగి విడిపించడం లేదా రక్షించడం అనే భావాన్ని సందర్భానుకూలమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రక్షణకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָפֵץ בִּי
  choice: ఆయన నాలో ఆనందించాడు
  rationale: חפץ ב వ్యక్తపరచే ఒకరిలో ఆనందం లేదా ఇష్టం కలిగి ఉండే వ్యక్తిగత భావాన్ని నిలుపుతుంది; కేవలం ‘నాతో సంతోషించాడు’ కంటే మూలంలోని అనురాగపూర్వక బలం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దైవిక రక్షణకు కారణం
  choice: ఎందుకంటే ఆయన నాలో ఆనందించాడు
  alternative: ఎందుకంటే ఆయన నన్ను ఇష్టపడ్డాడు / నాపట్ల సంతోషించాడు
  rationale: దావీదు రక్షణను దేవుని అనుకూల ఆనందంతో వాక్యం అనుసంధానిస్తుంది. దీనిని నిలుపుతూ, అర్హత లేదా పుణ్యం గురించి పాఠ్యం చెప్పని విస్తృత సిద్ధాంతాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్య నిర్మాణం. ‘విశాలమైన చోటు’ అనే మూల రూపకాన్ని అలాగే ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
