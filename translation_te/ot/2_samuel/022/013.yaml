  yaml_path: translation/ot/2_samuel/022/013.yaml
  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: te
  text: ఆయన ముందున్న ప్రకాశం నుండి[a] నిప్పు బొగ్గులు జ్వలించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ముందున్న తేజస్సు నుండి నిప్పు బొగ్గులు మండాయి.”
    reason: నֹגַהּకు ‘తేజస్సు’ అనే ప్రత్యామ్నాయం, బָּעֲרוּకు ‘మండాయి’ అనే సహజ క్రియారూపం సాధ్యమని చూపుతుంది.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: ప్రకాశం నుండి
  rationale: נֹגַהּ అంటే ప్రకాశం, వెలుగు లేదా తేజస్సు; ముందు ఉన్న מִן మూలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రకాశం నుండి’ సహజంగా ఉండి దైవదర్శన చిత్రణను నిలుపుతుంది.
- source_word: נֶגְדּוֹ
  choice: ఆయన ఎదుటి
  rationale: נֶגֶד + తృతీయ పురుష ఏకవచన ప్రత్యయం ‘ఆయన ఎదుట/ఆయన ముందు ఉన్న’ అనే స్థలార్థాన్ని ఇస్తుంది. ‘ఎదుటి ప్రకాశం’ తెలుగులో ఆ సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בָּעֲרוּ
  choice: మండాయి
  rationale: בער క్రియకు మండడం, జ్వలించడం అనే అర్థం. ‘మండాయి’ క్రియ యొక్క బహువచన రూపాన్ని, కవితాత్మక అగ్ని చిత్రణను స్పష్టంగా నిలుపుతుంది; మూలంలో లేని స్పష్టమైన కారణార్థాన్ని చేర్చదు.
- source_word: גַּחֲלֵי אֵשׁ
  choice: నిప్పుకణికలు
  rationale: ఈ నిర్మాణానికి అక్షరార్థం ‘అగ్ని బొగ్గులు/నిప్పు బొగ్గులు’. ‘నిప్పుకణికలు’ ఆధునిక తెలుగులో మండుతున్న అగ్నికణాల చిత్రాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయంగా ‘నిప్పు బొగ్గులు’ మరింత రూపాత్మకంగా ఉంటుంది.
theological_decisions:
- issue: దైవదర్శన చిత్రణలో చర్యకు సూచింపబడిన కర్త
  choice: ప్రకాశం నుండి నిప్పుకణికలు మండినట్లు వర్ణించి, దేవుడు వాటిని వెలిగించాడనే ప్రత్యక్ష కారణవాక్యాన్ని చేర్చలేదు.
  alternative: ‘ఆయన ప్రకాశం నిప్పుకణికలను మండించింది’ అని కారణార్థంగా అనువదించడం.
  rationale: హీబ్రూ కవితాత్మకంగా, సంక్షిప్తంగా ఉంది. మూలంలో స్పష్టంగా లేని దైవకార్యాన్ని జోడించకుండా, దైవదర్శనంలోని అగ్ని దృశ్యాన్ని యథాతథంగా ఉంచడం theological restraint‌ను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా కవితాత్మక దైవదర్శన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘ఆయన’ గౌరవసూచక రూపంగా వాడబడింది.
