  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: te
  text: 'నేను ఆయన ఎదుట నిందలేనివాడిగా[a] ఉన్నాను;

    నా దోషం నుండి నన్ను నేను కాపాడుకున్నాను.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనతో సంపూర్ణంగా ఉన్నాను.’ హీబ్రూ పదం కేవలం నింద లేకపోవడమే కాక యథార్థత లేదా సంపూర్ణతను కూడా నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా పాపం నుండి’ లేదా ‘నా అపరాధభారం నుండి.’ హీబ్రూ పదానికి సందర్భానుసారం దోషం, పాపం, అపరాధభారం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: నేను ... ఉన్నాను
  rationale: హיה అనే క్రియ యొక్క ఈ కవితాత్మక గతకాల రూపాన్ని తెలుగులో సహజంగా ‘ఉన్నాను’ అని ఇచ్చాం; వావ్ సంధిని వాక్యప్రవాహంలోనే వ్యక్తం చేశాం.
- source_word: תָמִים
  choice: నిందలేనివాడిగా
  rationale: ఈ పదం సంపూర్ణత, యథార్థత, నిష్కళంక ప్రవర్తన అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో బలమైన నైతిక సమగ్రతను తెలియజేస్తూ, తప్పనిసరిగా సంపూర్ణ పాపరాహిత్యాన్ని సూచించని విధంగా ‘నిందలేనివాడిగా’ ఎంచుకున్నాం.
- source_word: לוֹ
  choice: ఆయన ఎదుట
  rationale: అక్షరార్థంగా ‘ఆయనకు/ఆయనతో’ కావచ్చుగాని, ఇక్కడ దేవుని దృష్టిలో లేదా ఆయన సమక్షంలో ఉన్న స్థితిని తెలిపే సంబంధాత్మక ప్రయోగంగా ‘ఆయన ఎదుట’ సహజంగా సరిపోతుంది.
- source_word: וָאֶשְׁתַּמְּרָה
  choice: నన్ను నేను కాపాడుకున్నాను
  rationale: שׁמר క్రియలోని ఆత్మనేపద భావాన్ని స్పష్టంగా నిలుపుతూ, తాను జాగ్రత్తగా దూరంగా ఉన్నాడనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעֲוֺנִי
  choice: నా దోషం నుండి
  rationale: עָוֹן పదానికి దోషం, పాపం, అపరాధభారం అనే అర్థవ్యాప్తి ఉంది. ‘నా దోషం’ నైతిక తీవ్రతను, ప్రథమపురుష స్వామ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దావీదు మాటలు సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తాయా?
  choice: దేవుని ఎదుట నిందలేని యథార్థతను తెలిపే బలమైన ప్రకటనగా అనువదించడం
  alternative: సంపూర్ణ నైతిక పరిపూర్ణతకు సంబంధించిన ప్రకటనగా అనువదించడం
  rationale: תָמִים అనే పదం యథార్థత లేదా సమగ్రతను సూచించగలదు; అది తప్పనిసరిగా సంపూర్ణ పాపరాహిత్యాన్ని ప్రకటించదు. అయితే మూలంలోని బలమైన స్వీయవివరణను తగ్గించకుండా ‘నిందలేనివాడిగా’ ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు స్పష్టంగా ఉండే పదప్రయోగం. మూలంలోని రెండు సమాంతర ప్రథమపురుష ప్రకటనలను అలాగే ఉంచాం.
