translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా-యుద్ధ సందర్భానికి తగిన గంభీరమైన కాని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ క్రియల వరుసను తెలుగులో సహజంగా వినిపించేందుకు మొదటి క్రియను అసమాపక రూపంలో ఇచ్చాం; చివరి పదబంధంలోని కర్తృ/కర్మ సంబంధిత భావసాధ్యతను పాదటిప్పణిలో భద్రపరిచాం.
