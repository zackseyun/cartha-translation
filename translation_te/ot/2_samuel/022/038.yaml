  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: te
  text: నేను నా శత్రువులను తరిమి, వారిని నాశనం చేశాను; వారు పూర్తిగా అంతమయ్యే వరకు[a] నేను వెనుదిరగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వారిని పూర్తిగా అంతం చేసేవరకు.” హీబ్రూ పదబంధం వారు పూర్తిగా అంతమవడాన్ని లేదా వారిని పూర్తిగా అంతం చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: తరిమి
  rationale: רדף అనే క్రియకు యుద్ధ సందర్భంలో ‘వెంటాడటం/తరమటం’ అనే అర్థం ఉంది. ‘తరిమి’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; తదుపరి క్రియతో సులభంగా కలుస్తుంది.
- source_word: אֹיְבַי
  choice: నా శత్రువులను
  rationale: אויב అనే నామవాచకానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం జతకావడంతో నేరుగా ‘నా శత్రువులు’ అని అర్థం; కర్మవిభక్తితో అనువదించబడింది.
- source_word: וָאַשְׁמִידֵם
  choice: వారిని నాశనం చేశాను
  rationale: Hiphil రూపంలోని שׁמד బలమైన విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేశాను’ మూలంలోని తీవ్రతను గౌరవప్రదమైన, సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא אָשׁוּב
  choice: నేను వెనుదిరగలేదు
  rationale: ఈ యుద్ధ సందర్భంలో שׁוב సాధారణంగా తిరిగి రావడం కంటే శత్రువులను తరమడం మానేసి వెనక్కి తిరగడాన్ని సూచిస్తుంది.
- source_word: עַד כַּלּוֹתָם
  choice: వారు పూర్తిగా అంతమయ్యే వరకు
  rationale: כלה పూర్తి చేయడం, ముగించడం, పూర్తిగా నశింపజేయడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠం ఫలిత స్థితిని సహజమైన తెలుగులో తెలుపుతుంది; క్రియ నిర్మాణంలోని ప్రత్యామ్నాయ క్రియాశీల భావాన్ని పాదటిప్పణిలో ఉంచింది.
