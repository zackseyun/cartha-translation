  edition: WLC
  text: וּ/מוֹצִיאִ֖/י מֵ/אֹֽיְבָ֑/י וּ/מִ/קָּמַ/י֙ תְּר֣וֹמְמֵ֔/נִי מֵ/אִ֥ישׁ חֲמָסִ֖ים תַּצִּילֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/049.yaml
  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: te
  text: 'నా శత్రువులనుండి నన్ను బయటికి తీసుకువచ్చేవాడవు;[a]

    నా మీద లేచేవారిపైకి నన్ను ఉన్నతంగా ఎత్తుతావు;

    హింసాత్మకుడైన వ్యక్తి నుండి నన్ను విడిపిస్తావు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు నా శత్రువులనుండి నన్ను బయటికి తీసుకువస్తావు.” హీబ్రూ సంయోజక అవ్యయాన్ని స్పష్టంగా “మరియు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “హింసల మనిషి నుండి”; అంటే హింసకు పాల్పడే వ్యక్తి నుండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: బయటికి తీసుకువచ్చేవాడా
  rationale: హిఫీల్ రూపంలోని ‘బయటికి తీసుకురావడం’ అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, ముందటి సందర్భంలో దేవుని సంబోధిస్తూ సాగుతున్న వర్ణనకు సహజంగా సరిపోతుంది.
- source_word: מֵאֹיְבָי
  choice: నా శత్రువుల మధ్యనుండి
  rationale: מִן ఉపసర్గను కేవలం విడిపింపుగా కాక, శత్రువుల చెర/పరిధి నుండి బయటికి తీసుకురావడమనే భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמִקָּמַי
  choice: నా మీదికి లేచేవారికంటే
  rationale: קום పదంలోని లేవడం అనే క్రియాత్మక రూపకాన్నీ, విరోధంగా ఎదిరించే భావాన్నీ నిలుపుతుంది; తరువాతి רוםతో ఉన్న ‘కంటే ఉన్నతంగా’ అనే సంబంధానికీ సరిపోతుంది.
- source_word: תְּרוֹמְמֵנִי
  choice: నన్ను ఉన్నతంగా నిలబెడతావు
  rationale: రוםలోని పైకి ఎత్తడం, ప్రత్యర్థులపై ఆధిక్యంలో ఉంచడం అనే నిలువు రూపకాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: מֵאִישׁ חֲמָסִים
  choice: హింసాత్మకుడైన మనిషి నుండి
  rationale: איש యొక్క ఏకవచనాన్ని నిలుపుతూ, חמסים సూచించే హింసతో లక్షణీకరించబడిన వ్యక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּצִּילֵנִי
  choice: నన్ను కాపాడతావు
  rationale: נצל యొక్క ప్రమాదం నుండి విడిపించడం/రక్షించడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా, గంభీరంగా అందిస్తుంది.
