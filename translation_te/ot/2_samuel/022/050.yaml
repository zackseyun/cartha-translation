id: 2SA.22.50
reference: 2 Samuel 22:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: te
  text: 'కాబట్టి, యాహ్వే[a], దేశాల మధ్య నేను నిన్ను స్తుతిస్తాను[b];

    నీ నామానికి స్తుతిగానం చేస్తాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని నామం יהוה (YHWH). ఇక్కడ దాన్ని ‘యాహ్వే’ అని లిప్యంతరీకరించాం; ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియదు. కొన్ని అనువాదాలు ‘ప్రభువు’ అని వాడుతాయి.
    reason: దైవనామపు రూపం మరియు ప్రత్యామ్నాయ సంప్రదాయ అనువాదాన్ని తెలియజేయడం.
  - marker: b
    text: ‘నీకు కృతజ్ఞతలు చెల్లిస్తాను’ అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ క్రియలో ఉన్న స్తోత్రం–కృతజ్ఞత అనే భావ విస్తృతిని నిలుపడం.
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: ముందు వివరించిన దేవుని రక్షణ కార్యాల నుంచి వచ్చే నిర్ణయాన్ని లేదా ఫలితాన్ని ఈ పదబంధం సూచిస్తుంది.
- source_word: אוֹדְךָ
  choice: నేను నిన్ను స్తుతిస్తాను
  rationale: ידה అనే క్రియ ఇక్కడ దేవుణ్ణి ఉద్దేశించిన స్తోత్ర సందర్భంలో ఉంది; తరువాతి పాదంలోని ‘కీర్తిస్తూ పాడుతాను’తో కవితాత్మక సమాంతరతను కూడా ఇది నిలుపుతుంది. ‘నీకు కృతజ్ఞతలు చెల్లిస్తాను’ అనే భావఛాయ కూడా సాధ్యమే.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలపాఠంలో ఉన్న దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בַּגּוֹיִם
  choice: జనాల మధ్య
  rationale: గోయీమ్ ఇక్కడ ఇశ్రాయేలుకు వెలుపల ఉన్న దేశజనాలను విస్తృతంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘జనాల మధ్య’ సహజంగా ఉండి, తరువాతి కాలానికి చెందిన ప్రత్యేక మతపరమైన భావాన్ని దిగుమతి చేయదు.
- source_word: וּלְשִׁמְךָ
  choice: నీ నామాన్ని
  rationale: ‘నామం’ అనే మూలపాఠ రూపకాన్ని నిలుపుతూ, తెలుగు క్రియతో సహజంగా కలిసే కర్మ రూపాన్ని వాడింది; ఇది దేవుని కీర్తి, వెల్లడైన వ్యక్తిత్వం అనే భావాలను కూడా మోస్తుంది.
- source_word: אֲזַמֵּר
  choice: కీర్తిస్తూ పాడుతాను
  rationale: זמר పియేల్ రూపం సంగీతంతో స్తుతించడాన్ని సూచిస్తుంది. ఈ అనువాదం పాట మరియు స్తోత్రం అనే రెండు భావాలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוהను అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని వ్యక్తిగత నామంగా నిలుపుతుంది; అయితే దాని ప్రాచీన ఖచ్చిత ఉచ్చారణ పూర్తిగా నిర్ధారించలేమని పాదసూచిక తెలియజేస్తుంది.
- issue: אוֹדְךָలో స్తోత్రం–కృతజ్ఞత భావఛాయ
  choice: నేను నిన్ను స్తుతిస్తాను
  alternative: నేను నీకు కృతజ్ఞతలు చెల్లిస్తాను
  rationale: సందర్భం మరియు తరువాతి పాదంలోని గానస్తుతి ‘స్తుతిస్తాను’కు బలం ఇస్తాయి. అయినా ఈ క్రియలో కృతజ్ఞత తెలిపే భావం నిజంగా ఉన్నందున దాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కవితా శైలిని వాడాం. ‘జనములు’ కంటే సాధారణ పాఠకులకు సులభమైన ‘జనాలు’ను ఎంచుకున్నాం; పాదాల సమాంతర నిర్మాణాన్ని నిలుపడానికి రెండు కవితా పంక్తులుగా అమర్చాం.
