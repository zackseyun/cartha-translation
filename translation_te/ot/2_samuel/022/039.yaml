id: 2SA.22.39
reference: 2 Samuel 22:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֲכַלֵּ֥/ם וָ/אֶמְחָצֵ֖/ם וְ/לֹ֣א יְקוּמ֑וּ/ן וַֽ/יִּפְּל֖וּ תַּ֥חַת רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/039.yaml
  text: I consumed them and shattered them[a], and they did not rise[b]; they fell under my feet.
translation:
  language: te
  text: నేను వారిని కబళించాను[a], చితకగొట్టాను[b]; వారు లేవలేదు; నా పాదాల కింద పడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “వారిని నాశనం చేశాను.” మూలభాషలోని క్రియకు అక్షరార్థంగా “తినివేయడం, కబళించడం” అనే భావం ఉంది; ఇక్కడ అది యుద్ధంలో పూర్తిగా నాశనం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేక, “వారిని నలగగొట్టాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: వారిని కబళించి
  rationale: אכל అనే క్రియకు ప్రాథమికంగా ‘తిను/కబళించు’ అనే భావం ఉంది; యుద్ధ సందర్భంలో అది పూర్తిగా నాశనం చేయడాన్ని సూచిస్తుంది. ‘కబళించి’ అనే పదం మూలంలోని బలమైన కవితాత్మక రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וָאֶמְחָצֵם
  choice: చితకగొట్టాను
  rationale: מחץ అనే క్రియ నలగగొట్టడం, చితకగొట్టడం, బలంగా కొట్టి ఛిన్నాభిన్నం చేయడం అనే భావాలను ఇస్తుంది. ‘చితకగొట్టాను’ నిర్ణాయకమైన హింసాత్మక ఓటమిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יְקוּמוּן
  choice: వారు లేవలేదు
  rationale: హీబ్రూ వాక్యం వారు తిరిగి లేవలేదనే ఫలితాన్ని నేరుగా చెబుతుంది; మూలంలో స్పష్టంగా లేని ‘లేవలేకపోయారు’ అనే సామర్థ్య భావాన్ని చేర్చలేదు.
- source_word: וַיִּפְּלוּ
  choice: పడ్డారు
  rationale: נפל కు నేరమైన, సహజమైన సమానార్థకం; కవితా పాదంలోని సంక్షిప్త గమనాన్ని నిలుపుతుంది.
- source_word: תַּחַת רַגְלָי
  choice: నా పాదాల కింద
  rationale: శత్రువులు పూర్తిగా లోబడిపోయి ఓడిపోయారనే దృశ్యరూపాన్ని మూలానికి దగ్గరగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దావీదు విజయగీతంలోని హింసాత్మక యుద్ధ చిత్రణ
  choice: సంపూర్ణ ఓటమిని తెలిపే ప్రథమపురుష, బలమైన యుద్ధ భాషను యథాతథంగా నిలుపడం
  alternative: ‘నేను వారిని పూర్తిగా ఓడించాను’ వంటి మృదువైన భావానువాదం
  rationale: మూల హీబ్రూ నాశనం, నలగగొట్టడం, పాదాల కింద పడడం వంటి తీవ్ర కవితాత్మక చిత్రాలను ఉపయోగిస్తుంది. ఆధునిక భావాలకు అనుగుణంగా వాటిని మృదుపరచకుండా, మూలంలోని తీవ్రతనూ ఉద్రిక్తతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే విజయగీతానికి తగిన గంభీరమైన కవితాత్మక శైలిలో అనువదించబడింది. ‘కబళించి’ మూలంలోని రూపకాన్ని నిలుపుతుండగా, ‘చితకగొట్టాను’ యుద్ధచిత్రణ తీవ్రతను సహజంగా తెలియజేస్తుంది.
