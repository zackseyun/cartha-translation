  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: te
  text: తన రాజుకు గొప్ప విమోచనలను కలుగజేసేవాడు ఆయనే[a]; తన అభిషిక్తునికి[b]—దావీదుకు, అతని సంతానానికి—నిత్యమూ నిబంధనకు నమ్మకమైన ప్రేమను చూపేవాడు ఆయనే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో బహువచనం ఉంది; ‘తన రాజుకు గొప్ప రక్షణలు’ లేదా ‘గొప్ప విజయాలు కలుగజేసేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన అభిషిక్తుడు’ అనే మాటను ‘తన మెస్సీయ’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది మొదట దావీదును, దావీదు వంశపు రాజును సూచిస్తూ, విస్తృతమైన మెస్సీయ వాగ్దానాన్ని కూడా ప్రతిధ్వనింపజేస్తుంది.
    reason: alternative_reading
  - marker: c
    text: ‘స్థిరమైన ప్రేమ’ లేదా ‘విశ్వాసపాత్రమైన ప్రేమ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం తరచుగా నిబంధనకు నమ్మకమైన ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדיל יְשׁוּעוֹת
  choice: గొప్ప రక్షణ కార్యాలు అనుగ్రహించేవాడు
  rationale: מגדיל అనే హిఫీల్ రూపంలోని ‘గొప్పచేయు’ భావాన్ని, יְשׁוּעוֹת అనే బహువచనంలోని అనేక విమోచన/విజయ కార్యాల భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: מַלְכּוֹ
  choice: తన రాజుకు
  rationale: మూడవ పురుష ఏకవచన సంబంధప్రత్యయాన్ని సహజంగా ఉంచి, యెహోవాకు ఆయన అభిషిక్త రాజుతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: నిబంధన విశ్వసనీయత చూపేవాడు
  rationale: חֶסֶד లోని స్థిరమైన ప్రేమ, విధేయత, నిబంధనపట్ల నమ్మకత్వం అనే భావసముదాయాన్ని ఈ దావీదు నిబంధన సందర్భంలో స్పష్టంగా అందిస్తుంది.
- source_word: לִמְשִׁיחוֹ
  choice: తన అభిషిక్తునికి
  rationale: చారిత్రకంగా దావీదును/దావీదు వంశపు రాజును సూచించే ‘అభిషిక్తుడు’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతూ, మెస్సీయ సంబంధ ప్రతిధ్వనిని ముందుగానే ఒక్క అర్థానికి పరిమితం చేయదు.
- source_word: לְדָוִד וּלְזַרְעוֹ
  choice: దావీదుకు, అతని సంతానానికి
  rationale: זֶרַע యొక్క ఏకవచన సమూహార్థాన్ని ‘సంతానం’ సహజంగా నిలుపుతుంది; దావీదు మరియు అతని వంశంతో నిబంధన కొనసాగింపును వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: నిత్యమూ
  rationale: నిరంతరమైన, శాశ్వత కాలవ్యాప్తిని గౌరవప్రదమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదు నిబంధన సందర్భంలో חֶסֶד అనువాదం
  choice: నిబంధన విశ్వసనీయత
  alternative: స్థిరమైన ప్రేమ; విశ్వాసపాత్రమైన ప్రేమ
  rationale: ఈ ముగింపు వాక్యంలో దేవుడు దావీదుకు, అతని వంశానికి చేసిన వాగ్దానంపట్ల చూపే స్థిరమైన నమ్మకత్వం ప్రధానంగా ఉంది. అయితే ప్రేమభావం కూడా మూలపదంలో ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: מְשִׁיחוֹ అనువాదం
  choice: తన అభిషిక్తునికి
  alternative: తన మెస్సీయకు
  rationale: తక్షణ చారిత్రక సూచన దావీదు మరియు దావీదు వంశపు రాజు. ‘అభిషిక్తుడు’ మూలపదార్థాన్ని కాపాడి, విస్తృత మెస్సీయ నిరీక్షణను నిరాకరించకుండా నిజమైన వ్యాఖ్యాన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. హీబ్రూ భాగధాతువుల నిరంతర/లక్షణాత్మక భావాన్ని ‘అనుగ్రహించేవాడు ఆయనే’, ‘చూపేవాడు ఆయనే’ అనే నిర్మాణాలతో నిలిపాం. ‘రక్షణ కార్యాలు’ ద్వారా బహువచనాన్ని ప్రధాన పాఠ్యంలోనే ప్రతిఫలింపజేశాం; ‘అభిషిక్తుడు’ ద్వారా చారిత్రక మరియు మెస్సీయ సంబంధ ఉద్వేగాన్ని తెరిచి ఉంచాం.
