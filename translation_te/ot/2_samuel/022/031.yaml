  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: te
  text: 'దేవుని మార్గం నిర్దోషమైనది;

    యాహ్వే పలికిన మాట పరీక్షించబడి రుజువైనది.[a]

    ఆయనను ఆశ్రయించే వారందరికీ

    ఆయన ఒక డాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అగ్నిలో శుద్ధి చేయబడినది” లేదా “పరీక్షించబడినది.” హీబ్రూ పదం కొలిమిలో లోహాన్ని శుద్ధిచేసే దృశ్యాన్ని సూచిస్తుంది.
    reason: צְרוּפָה అనే పదంలోని లోహశుద్ధి రూపకాన్నీ, సాధ్యమైన అక్షరార్థ అనువాదాలనూ భద్రపరచడం.
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుని
  rationale: వాక్యారంభంలోని నిర్దిష్ట రూపం దేవుణ్ణి అంశంగా ముందుకు తెస్తుంది. తెలుగులో కృత్రిమమైన ‘దేవుని విషయానికొస్తే’ అనే విస్తరణ లేకుండానే ‘దేవుని మార్గం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תָּמִים
  choice: నిర్దోషమైనది
  rationale: ఇక్కడ దేవుని కార్యవిధానం ఏ లోపమూ లేనిదని సూచిస్తుంది. ‘పరిపూర్ణమైనది’ కంటే ‘నిర్దోషమైనది’ నైతిక, గుణాత్మక సమగ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: דַּרְכּוֹ
  choice: దేవుని మార్గం
  rationale: דֶּרֶךְ దేవుని నడవడి లేదా కార్యవిధానాన్ని సూచించే ‘మార్గం’ అనే రూపకాన్ని నిలుపుతుంది; తెలుగులో స్వామ్యాన్ని స్పష్టంచేయడానికి ‘దేవుని’ అని ఇచ్చాం.
- source_word: אִמְרַת יְהוָה
  choice: యాహ్వే పలికిన మాట
  rationale: אִמְרָה పలుకు, ఉక్తి, మాట అనే విస్తృత అర్థాన్ని కలిగి ఉంది. ‘పలికిన మాట’ మూలంలోని ఉక్తి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: צְרוּפָה
  choice: పరీక్షించబడి రుజువైనది
  rationale: లోహాన్ని అగ్నిలో శుద్ధిచేసి దాని స్వచ్ఛతను నిర్ధారించే రూపకంలోని పరీక్షనూ, దాని ఫలితమైన నమ్మకత్వ నిరూపణనూ ఈ పదబంధం తెలియజేస్తుంది. మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מָגֵן
  choice: ఒక డాలు
  rationale: రక్షణను సూచించే స్పష్టమైన ఆయుధ రూపకాన్ని ‘డాలు’ నేరుగా నిలుపుతుంది; ‘కవచం’ శరీరంపై ధరించే armor అనే అర్థానికీ వెళ్లవచ్చు.
- source_word: הוּא
  choice: ఆయన
  rationale: హీబ్రూలోని స్పష్టమైన సర్వనామాన్ని గౌరవసూచకమైన, సహజ తెలుగు రూపంలో నిలిపాం.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: ఆయనను ఆశ్రయించే వారందరికీ
  rationale: חסה ప్రమాదంలో రక్షణ కోసం ఆశ్రయం పొందడాన్ని సూచిస్తుంది. ‘ఆశ్రయించే’ అనే ఎంపిక సాధారణ ‘నమ్మే’ కంటే మూలంలోని రక్షణ రూపకాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే తరువాతి సంప్రదాయ ఉచ్చారణను అనుసరించకుండా సూచిస్తుంది.
- issue: צְרוּפָה లోని లోహశుద్ధి రూపకం
  choice: పరీక్షించబడి రుజువైనది
  alternative: శుద్ధి చేయబడినది; పరీక్షించబడినది
  rationale: మూలంలోని రూపకం యాహ్వే మాట పరీక్షను తట్టుకొని నమ్మదగినదిగా తేలిందనే భావాన్ని కలిగిస్తుంది. ప్రధాన పాఠం ఆ ఫలితాన్ని స్పష్టంగా చెబుతుంది; పాదటిప్పణి అక్షరార్థ రూపకాన్ని భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా శైలికి తగిన గంభీరతతో చిన్న సమాంతర పాదాలుగా రచించాం. ‘డాలు’ కొంత సాహిత్య పదమైనప్పటికీ మూలంలోని shield రూపకాన్ని ‘కవచం’ కంటే ఖచ్చితంగా నిలుపుతుంది. ‘యాహ్వే’ దైవనామాన్ని ప్రత్యక్షంగా చూపుతుంది.
