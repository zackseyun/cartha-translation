  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: te
  text: 'నా ఆపదలో నేను యహ్వేకు మొరపెట్టాను;

    నా దేవునికి మొరపెట్టాను.

    ఆయన తన ఆలయం నుండి[a] నా స్వరం విన్నాడు;

    సహాయం కోసం నా మొర ఆయన చెవులకు చేరింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆలయం’ అనే పదాన్ని ‘రాజభవనం’ లేదా ‘పరిశుద్ధ మందిరం’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది దేవుని పరలోక నివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר
  choice: నా ఆపదలో
  rationale: צַר సూచించే కష్టం, సంకటం, ఇరుకు పరిస్థితి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆపద’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶקְרָא
  choice: మొరపెట్టాను
  rationale: קרא ఇక్కడ దేవునికి సహాయం కోసం పిలవడాన్ని సూచిస్తుంది. రెండు సార్లు వచ్చిన క్రియను ఒకే విధంగా అనువదించి మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהַי
  choice: నా దేవుడు
  rationale: ఏకవచన రూపానికి ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయం చేరిన నేరమైన అర్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: హీబ్రూ కథన క్రియ యొక్క భూతకాల క్రమాన్ని, ఈ గీతంలో చెప్పబడుతున్న విమోచన అనుభవాన్ని అనుసరించి భూతకాలంలో ఇచ్చాం.
- source_word: מֵהֵיכָלוֹ
  choice: తన ఆలయంలోనుండి
  rationale: הֵיכָלకు ఆలయం, రాజభవనం అనే అర్థాలు ఉన్నాయి. దేవుని నివాసాన్ని సూచించే ఈ సందర్భంలో ‘ఆలయం’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: קוֹלִי యొక్క నేరమైన అర్థాన్ని సంక్షిప్తంగా, సహజంగా నిలిపాం.
- source_word: שַׁוְעָתִי
  choice: నా సహాయ మొర
  rationale: שַׁוְעָה కేవలం కేకనే కాక సహాయం కోరే మొరను సూచిస్తుంది; ‘సహాయ మొర’ ఆ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּאָזְנָיו
  choice: ఆయన చెవులకు చేరింది
  rationale: అక్షరార్థంగా ‘ఆయన చెవుల్లో’ అనే చిత్రాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతూ, మొర వినబడిందనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- issue: దేవుని నివాసమైన הֵיכָל భావం
  choice: ఆలయం
  alternative: రాజభవనం; పరిశుద్ధ మందిరం
  rationale: ఈ పదంలో ఆరాధనా స్థలం, రాజ నివాసం అనే రెండు ఛాయలూ ఉన్నాయి. దేవుని పరలోక నివాసాన్ని సూచించే సందర్భంలో ‘ఆలయం’ సహజంగా ఉన్నా, రాజసంబంధమైన ఛాయను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా గంభీరతను నిలిపే సరళమైన వాక్యనిర్మాణం వాడాం. మూలంలోని రెండు సమాంతర మొరలను పునరుక్తితోనే ఉంచి, కథన సందర్భానికి అనుగుణంగా భూతకాలాన్ని ఎంచుకున్నాం.
