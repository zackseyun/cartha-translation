review_pass:
  verdict: revise
  source_fidelity: The parallel structure and reflexive nuance are represented, but పవిత్రుడు is narrower and more theologically loaded than נָבָר (“clean, pure”), and మెలికలు తిరిగినవాడిగా is an unnatural, overly physical Telugu expression for the difficult final verb.
  naturalness: The repeated తో ... కనిపిస్తావు structure is clear and poetic. Replacing the two key expressions with నిర్మలుడు and వక్రుడిగా yields idiomatic modern Telugu while retaining the Hebrew wordplay and deliberate tension.
  terminology: నిర్మలుడు better represents the purity/cleanness of נָבָר without importing the specialized sense of “holy.” వక్రుడు and వక్రుడిగా preserve the lexical and poetic correspondence of עִקֵּשׁ and תִּתַּפָּל without resolving the rare verb into a doctrinally safer paraphrase.
  issues:
  - severity: medium
    issue: పవిత్రుడు for נָבָר
    rationale: The Hebrew denotes cleanness or purity, not specifically holiness. నిర్మలుడు is a closer, natural Telugu equivalent and permits the noun–verb wordplay to be retained.
  - severity: medium
    issue: మెలికలు తిరిగినవాడిగా కనిపిస్తావు for תִּתַּפָּל
    rationale: This wording normally evokes physical twisting and is not idiomatic for a person's manner or appearance. వక్రుడిగా కనిపిస్తావు is concise, natural, and retains the difficult negative/corresponding sense without falsely claiming certainty.
  revised_text: 'నిర్మలునితో నీవు నిర్మలుడిగా కనిపిస్తావు;

    వక్రునితో నీవు వక్రుడిగా కనిపిస్తావు.[a]'
