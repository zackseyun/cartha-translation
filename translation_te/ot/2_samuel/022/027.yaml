revisions:
- from: 'పవిత్రునితో నీవు పవిత్రుడిగా కనిపిస్తావు;

    వక్రబుద్ధిగలవానితో నీవు మెలికలు తిరిగినవాడిగా కనిపిస్తావు.[a]'
  to: 'నిర్మలునితో నీవు నిర్మలుడిగా కనిపిస్తావు;

    వక్రునితో నీవు వక్రుడిగా కనిపిస్తావు.[a]'
  rationale: 'The revision more closely reflects the Hebrew lexical field and preserves the verse’s deliberately reciprocal wordplay: “pure/pure” and “crooked/crooked.” It retains కనిపిస్తావు for the reflexive form and leaves the disputed force of the rare final verb appropriately signaled in the footnote, without imposing a harmonizing interpretation.'
  reviewer_model: gpt-5.6-terra
