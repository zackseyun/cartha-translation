source:
  edition: WLC
  text: עִם נָבָ֖ר תִּתָּבָ֑ר וְ/עִם עִקֵּ֖שׁ תִּתַּפָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/027.yaml
  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: te
  text: 'నిర్మలునితో నీవు నిర్మలుడిగా కనిపిస్తావు;

    వక్రునితో నీవు వక్రుడిగా కనిపిస్తావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వక్రునితో నీవు యుక్తిగా వ్యవహరిస్తావు,” లేక “వ్యతిరేకంగా వ్యవహరిస్తావు.” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; దాని ఖచ్చితమైన అర్థం నిర్ధారించడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: పవిత్రుడు
  rationale: ఈ విశేషణం శుద్ధతను సూచిస్తుంది. దేవుని నైతిక పవిత్రతను తెలిపే తరువాతి సమానమూల క్రియతో పదప్రయోగ సంబంధాన్ని నిలుపుతుంది.
- source_word: תִּתָּבָר
  choice: నీవు పవిత్రుడిగా కనిపిస్తావు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, నָבָרతో ఉన్న పదప్రయోగాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: עִקֵּשׁ
  choice: వక్రబుద్ధిగలవాడు
  rationale: ఈ పదం నైతికంగా వక్రమైన, కపటమైన వ్యక్తిని సూచిస్తుంది. 'వక్రబుద్ధి' ఆధునిక తెలుగులో వ్యక్తి దుర్మార్గపు యుక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּתַּפָּל
  choice: నీవు మెలికలు తిరిగినవాడిగా కనిపిస్తావు
  rationale: అరుదైన, అర్థనిర్ణయం కష్టమైన క్రియలోని ప్రతికూలమైన 'వక్రంగా/మెలికగా వ్యవహరించడం' అనే భావాన్ని కాపాడుతుంది. దేవునికి నైతిక దుష్టత్వాన్ని నిర్ద్వంద్వంగా ఆపాదించకుండా మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
- source_word: עִם
  choice: తో
  rationale: వ్యక్తితో దేవుని సంబంధిత వ్యవహారంలో కనిపించే అనురూప ప్రతిస్పందనను సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: వక్రునికి దేవుడు ఇచ్చే ప్రతిస్పందనను ఎలా అనువదించాలి
  choice: నీవు మెలికలు తిరిగినవాడిగా కనిపిస్తావు
  alternative: నీవు యుక్తిగా వ్యవహరిస్తావు; నీవు ప్రతికూలంగా వ్యవహరిస్తావు
  rationale: మూలంలోని అరుదైన క్రియకు ప్రతికూలమైన, వక్రతతో సంబంధమున్న భావం ఉంది. దానిని 'యుక్తిగా' అని సర్దుబాటు చేయడం మూలంలోని కావ్యాత్మక ఉద్రిక్తతను తగ్గిస్తుంది. 'కనిపిస్తావు' అనే ఆత్మనేపద రూపం దేవుడు వక్రునికి తగిన విధంగా ఎదురవుతాడనే సంబంధ భావాన్ని నిలుపుతుంది; పాదటిప్పణి ఇతర సాధ్యార్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కావ్య సమాంతరత కోసం రెండు పాదాల్లోనూ 'తో ... కనిపిస్తావు' నిర్మాణాన్ని ఉంచి, అరుదైన క్రియలోని అస్పష్టతను పాదటిప్పణిలో కాపాడాం.
