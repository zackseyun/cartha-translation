reference: 2 Samuel 22:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: te
  text: నా దేవుడు[a], నా బండ—ఆయనలో నేను ఆశ్రయం పొందుతాను; నా డాలు, నా రక్షణ కొమ్ము[b], నా ఎత్తైన దుర్గం, నా ఆశ్రయం, నా రక్షకుడు[c]—హింస నుండి నన్ను రక్షిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, పదక్షరంగా, ‘నా బండయొక్క దేవుడు.’ హీబ్రూ నిర్మాణాన్ని ఇలా అనువదించవచ్చు; అయితే ఇక్కడ వరుసగా వచ్చే కవితాత్మక బిరుదులకు ‘నా దేవుడు, నా బండ’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కొమ్ము’ హీబ్రూ కవిత్వంలో బలానికి, విజయశక్తికి రూపకం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘నన్ను విడిపించేవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: నా దేవుడు, నా బండ
  rationale: హీబ్రూ నిర్మాణాన్ని పదక్షరాలా ‘నా బండకు దేవుడు’ అని అనువదించవచ్చు; అయితే వరుసగా వచ్చే దైవ బిరుదుల కవితా సందర్భంలో సమానాధికార పదబంధంగా ‘నా దేవుడు, నా బండ’ సహజంగా ఉంటుంది. మూలంలోని నిర్మాణ అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
- source_word: אֶחֱסֶה בּוֹ
  choice: ఆయనలో నేను ఆశ్రయం పొందుతాను
  rationale: חסה అంటే భద్రత కోసం ఆశ్రయం పొందడం. בוֹలోని ‘ఆయనలో’ అనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מָגִנִּי
  choice: నా డాలు
  rationale: రక్షణను సూచించే స్పష్టమైన యుద్ధ రూపకాన్ని నిలుపుతుంది; ఆధునిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: קֶרֶן יִשְׁעִי
  choice: నా రక్షణ కొమ్ము
  rationale: ‘కొమ్ము’ బలం, విజయశక్తికి హీబ్రూ రూపకం. దాన్ని ‘బలం’ అని వివరణాత్మకంగా మార్చకుండా మూలచిత్రాన్ని నిలిపి, construct phraseను ‘నా రక్షణ కొమ్ము’గా ఇచ్చాం.
- source_word: מִשְׂגַּבִּי
  choice: నా ఎత్తైన దుర్గం
  rationale: మూలపదం అందనంత ఎత్తులోని సురక్షిత స్థలాన్ని లేదా బలమైన ఆశ్రయాన్ని సూచిస్తుంది. ‘ఎత్తైన దుర్గం’ భద్రతతో పాటు ఎత్తు భావాన్నీ నిలుపుతుంది.
- source_word: וּמְנוּסִי
  choice: నా ఆశ్రయం
  rationale: ప్రమాదం నుండి పారిపోయి చేరే సురక్షిత స్థలమనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹשִׁעִי
  choice: నా రక్షకుడు
  rationale: ישע ధాతువు నుండి వచ్చిన ఈ రూపం రక్షించే లేదా విడిపించే వ్యక్తిని సూచిస్తుంది. ‘రక్షకుడు’ పదం తరువాతి క్రియతోనూ సహజంగా అనుసంధానమవుతుంది.
- source_word: מֵחָמָס
  choice: హింస నుండి
  rationale: חָמָס హింసను లేదా హింసాత్మక దుర్మార్గాన్ని సూచిస్తుంది. మూలంలో వ్యక్తులు స్పష్టంగా లేనందున ‘హింసాత్మకుల నుండి’ అని చేర్చలేదు.
- source_word: תֹּשִׁעֵנִי
  choice: నన్ను రక్షిస్తావు
  rationale: రెండవ పురుష ఏకవచన క్రియతో మొదటి పురుష కర్మ ఉంది. హీబ్రూ కవిత్వంలోని అసంపూర్ణ క్రియారూపాన్ని సందర్భానుసారమైన సాధారణ/భవిష్యత్ భావంతో తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవునికి వరుసగా వాడిన స్పష్టమైన రూపకాలు
  choice: బండ, డాలు, కొమ్ము, ఎత్తైన దుర్గం, ఆశ్రయం అనే రూపకాలను నిలుపడం
  alternative: రక్షకుడు, బలానికి మూలం వంటి వివరణాత్మక అమూర్త పదాలతో రూపకాలను మార్చడం
  rationale: ఈ వాక్యం దేవుని రక్షణను అనేక కవితాత్మక, యుద్ధసంబంధ చిత్రాలతో వర్ణిస్తుంది. వాటిని నిలుపడం మూలంలోని కవితా శక్తిని, ధార్మిక వైవిధ్యాన్ని కాపాడుతుంది.
- issue: מֹשִׁעִי యొక్క అనువాదం
  choice: నా రక్షకుడు
  alternative: నన్ను విడిపించేవాడు
  rationale: ‘రక్షకుడు’ మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం. తరువాత వచ్చే ‘నన్ను రక్షిస్తావు’తో మూలంలోని పదపునరుక్తి సంబంధాన్నీ ప్రతిబింబిస్తుంది; తరువాతి సిద్ధాంతార్థాలను అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంటూనే, మూలంలోని వరుస రూపకాలను సరళీకరించకుండా నిలిపాం. ‘రక్షణ కొమ్ము’ కొంత అసాధారణమైన తెలుగు ప్రయోగమైనప్పటికీ, హీబ్రూ రూపకాన్ని సంరక్షించేందుకు ఉద్దేశపూర్వకంగా వాడి పాదటిప్పణితో వివరించాం.
