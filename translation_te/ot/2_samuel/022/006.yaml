  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: te
  text: 'షెయోల్ తాళ్లు నన్ను చుట్టుముట్టాయి[a];

    మరణపు ఉరులు నాకు ఎదురయ్యాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెయోల్’కు ‘సమాధి’ లేదా ‘మృతుల లోకం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నన్ను ఎదుర్కొన్నాయి,’ ‘నా ముందుకు వచ్చాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: తాళ్లు
  rationale: ఈ కవితా సందర్భంలో חבל బంధించే తాళ్లను సూచిస్తుంది. పక్కనే ఉన్న ‘ఉరులు’ అనే రూపకంతో ఇది సహజంగా జతకడుతుంది; ‘వేదనలు’ అని తీసుకొని రూపకాన్ని మార్చలేదు.
- source_word: שְׁאוֹל
  choice: షెయోల్
  rationale: మృతుల లోకాన్ని సూచించే హీబ్రూ పదాన్ని లిప్యంతరీకరించడం ద్వారా ‘సమాధి’ లేదా ‘మృతుల లోకం’ అనే ఒక్క అర్థానికే పరిమితం చేయకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
- source_word: סַבֻּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: סבב యొక్క ‘చుట్టుముట్టు/ఆవరించు’ అనే ప్రాథమిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קִדְּמֻנִי
  choice: నాకు ఎదురయ్యాయి
  rationale: קדם ఇక్కడ ముందుకు వచ్చి కలుసుకోవడం లేదా ఎదురుపడడం అనే భావాన్ని ఇస్తుంది. ‘ఎదురయ్యాయి’ శత్రుభావ సందర్భాన్ని తెలిపినా, ‘దాడి చేశాయి’ వంటి అతివ్యాఖ్యను జోడించదు.
- source_word: מֹקְשֵׁי
  choice: ఉరులు
  rationale: מוקש అనేది పట్టుకోవడానికి వేసే ఉచ్చు లేదా ఉరిని సూచిస్తుంది. కవితా సమాంతరతలో ‘తాళ్లు’తో చక్కగా సరిపోతుంది.
- source_word: מָוֶת
  choice: మరణపు
  rationale: మూలంలోని ‘మరణం’ అనే నామవాచకాన్ని సంబంధార్థక రూపంలో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: שְׁאוֹל పదానికి అనువాదం
  choice: షెయోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ పదం కేవలం వ్యక్తిగత సమాధినే సూచిస్తుందా, మరణ స్థితిని సూచిస్తుందా, లేక మృతుల లోకాన్ని సూచిస్తుందా అన్న భావ విస్తృతిని మూలం పూర్తిగా పరిష్కరించదు. లిప్యంతరీకరణ ఆ వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక సమాంతరతను మరియు బంధనం–ఉచ్చు రూపకాలను నిలుపుతూ గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం.
