id: 2SA.22.8
reference: 2 Samuel 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/תגעש וַ/תִּרְעַשׁ֙ הָ/אָ֔רֶץ מוֹסְד֥וֹת הַ/שָּׁמַ֖יִם יִרְגָּ֑זוּ וַ/יִּֽתְגָּעֲשׁ֖וּ כִּֽי חָ֥רָה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/008.yaml
  text: Then the earth reeled and quaked; the foundations of the heavens trembled and shook, because he was angry.
translation:
  language: te
  text: అప్పుడు భూమి ఊగి కంపించింది; ఆకాశపు పునాదులు వణికి కదిలిపోయాయి, ఎందుకంటే ఆయనకు కోపం రగిలింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: ఊగి
  rationale: רעשׁ ఇక్కడ భూమి బలంగా కదలడాన్ని సూచిస్తుంది; తరువాతి געשׁతో ఉన్న పదభేదాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘ఊగి’ అని అనువదించాం.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: కదిలిపోయాయి
  rationale: געשׁ యొక్క కల్లోలభరిత కదలికను తెలియజేస్తూ, ముందున్న ‘వణికి’తో పునరుక్తి రాకుండా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: ఆకాశపు పునాదులు
  rationale: కావ్యాత్మక విశ్వవర్ణనను వ్యాఖ్యానించకుండా మూలానికి దగ్గరగా నిలిపాం.
- source_word: חָרָה לוֹ
  choice: ఆయనకు కోపం రగిలింది
  rationale: חרה యొక్క ‘మండడం/రగలడం’ అనే రూపకబలాన్ని సహజమైన తెలుగు ప్రయోగంలో నిలిపాం.
theological_decisions:
- issue: దైవకోపపు వ్యక్తీకరణ
  choice: ఆయనకు కోపం రగిలింది
  alternative: ఆయన కోపగించుకున్నాడు
  rationale: మూలంలోని חרה అనే ‘రగులు/మండు’ భావాన్ని నిలిపి, దైవకోపాన్ని తగ్గించకుండా లేదా అదనపు సిద్ధాంతార్థం చేర్చకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కావ్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను వాడాం.
