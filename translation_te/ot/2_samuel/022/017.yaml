source:
  edition: WLC
  text: יִשְׁלַ֥ח מִ/מָּר֖וֹם יִקָּחֵ֑/נִי יַֽמְשֵׁ֖/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/017.yaml
  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: te
  text: ఆయన ఉన్నత స్థలం నుండి చేయి చాచి[a] నన్ను తీసుకున్నాడు; అనేక జలాల[b] నుండి నన్ను బయటికి లాగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః ‘ఉన్నత స్థలం నుండి పంపాడు’; లేదా ‘ఉన్నత స్థలం నుండి చాపాడు.’ హీబ్రూ పాఠ్యంలో ఏమి పంపాడో లేదా చాపాడో స్పష్టంగా చెప్పలేదు; సందర్భాన్ని బట్టి ‘చేయి’ని సూచ్యార్థంగా చేర్చాం.
    reason: lexical_alternative
  - marker: b
    text: ‘విస్తారమైన జలాల నుండి’ లేదా ‘మహా జలాల నుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: ఉన్నత స్థలం నుండి చేయి చాపి
  rationale: יִשְׁלַח అనే క్రియకు ‘పంపు’ లేదా ‘చాపు’ అనే అర్థాలు ఉన్నాయి. హీబ్రూ పాఠ్యంలో కర్మ స్పష్టంగా లేకపోయినా, తరువాతి రక్షణ చర్యల సందర్భంలో తెలుగులో సహజంగా ఉండేందుకు ‘చేయి’ని సూచ్యార్థంగా చేర్చి ‘చేయి చాపి’ అని అనువదించాం. מָרוֹםను ‘పరలోకం’గా నిర్దిష్టం చేయకుండా ‘ఉన్నత స్థలం’గా ఉంచాం.
- source_word: יִקָּחֵנִי
  choice: నన్ను పట్టుకున్నాడు
  rationale: לקחకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది. నీటిలోనుండి రక్షించే దృశ్యంలో ‘పట్టుకున్నాడు’ అనేది చర్యను సహజంగా తెలియజేస్తూ, తరువాతి ‘బయటికి లాగాడు’ అనే క్రియతో సుసంబద్ధంగా ఉంటుంది.
- source_word: יַמְשֵׁנִי
  choice: నన్ను బయటికి లాగాడు
  rationale: משה హిఫిల్ రూపం నీటిలోనుండి ఒకరిని బయటికి లాగడం లేదా తీయడం అనే భావాన్ని ఇస్తుంది. ‘బయటికి లాగాడు’ ఈ రక్షణ దృశ్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִמַּיִם רַבִּים
  choice: అనేక జలాల నుండి
  rationale: పదశః ‘అనేక జలాల నుండి.’ కవితాత్మక బహువచన చిత్రాన్ని నిలుపుతూ, רַבִּיםలోని సమృద్ధి భావాన్ని ముందుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: పై నుండి జరిగే దైవిక రక్షణ చిత్రణ
  choice: ‘ఉన్నత స్థలం నుండి’ అనే కవితాత్మక స్థలభాషను నిలుపుకోవడం
  alternative: ‘పరలోకం నుండి’
  rationale: మూలంలోని מָרוֹם ఎత్తైన స్థలాన్ని సూచిస్తుంది; దాన్ని ‘పరలోకం’గా అనువదిస్తే మూలం కన్నా నిర్దిష్టమైన విశ్వదృక్పథ పదం చేరుతుంది. అందువల్ల దైవిక జోక్యాన్ని సూచించే కవితాత్మక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కవితాత్మక ధోరణితో అనువదించాం. ‘జలాలు’ అనే పదం పద్య సందర్భానికి తగిన ఉన్నత శైలిని నిలుపుతుంది; వాక్య నిర్మాణం మాత్రం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం.
