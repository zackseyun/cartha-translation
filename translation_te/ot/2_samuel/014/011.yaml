  text: וַ/תֹּאמֶר֩ יִזְכָּר נָ֨א הַ/מֶּ֜לֶךְ אֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ מ/הרבית גֹּאֵ֤ל הַ/דָּם֙ לְ/שַׁחֵ֔ת וְ/לֹ֥א יַשְׁמִ֖ידוּ אֶת בְּנִ֑/י וַ/יֹּ֨אמֶר֙ חַי יְהוָ֔ה אִם יִפֹּ֛ל מִ/שַּׂעֲרַ֥ת בְּנֵ֖/ךְ אָֽרְצָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: te
  text: 'అప్పుడు ఆమె ఇలా చెప్పింది: “రాజుగారు దయచేసి మీ దేవుడైన యెహోవాను జ్ఞాపకం చేసుకొని, రక్తప్రతీకారం తీర్చుకునేవాడు[a] నాశనం చేయడాన్ని ఇక కొనసాగించకుండా, వారు నా కుమారుణ్ణి నిర్మూలించకుండా చేయాలి.” అందుకు అతడు, “యెహోవా జీవం తోడు, నీ కుమారుని ఒక్క వెంట్రుక కూడా నేలపై పడదు[b]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రక్తానికి విమోచకుడు’; చంపబడిన వ్యక్తి తరఫున రక్తప్రతీకారం చేసే సమీప బంధువు.
    reason: lexical_alternative
  - marker: b
    text: ఇది సంపూర్ణ రక్షణను హామీ ఇచ్చే హీబ్రూ నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: יִזְכָּר נָא הַמֶּלֶךְ
  choice: రాజుగారు దయచేసి ... జ్ఞాపకం చేసుకోవాలి
  rationale: నָאతో కూడిన జస్సివ్ మర్యాదపూర్వకమైన విజ్ఞప్తిని వ్యక్తం చేస్తుంది. హీబ్రూలో రాజును మూడవ పురుషంలో సంబోధించిన గౌరవభావాన్ని ‘రాజుగారు’ నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: మీ దేవుడైన యెహోవా
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, రెండవ పురుష ఏకవచన స్వామ్యార్థాన్ని గౌరవసూచకమైన ‘మీ’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: రక్తప్రతీకారం తీర్చుకునేవాడు ఇంకా నాశనం చేయకుండా
  rationale: מן + רבה హిఫీల్ క్రియానామ రూపం విధ్వంసక చర్య మరింతగా లేదా కొనసాగుతూ జరగకుండా ఆపాలనే భావాన్ని ఇస్తుంది. ‘ఇంకా’ ఆ పునరావృత్తి/పెరుగుదల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גֹּאֵל הַדָּם
  choice: రక్తప్రతీకారం తీర్చుకునేవాడు
  rationale: ఇది చంపబడిన బంధువు తరఫున రక్తప్రతీకారం చేసే సమీప బంధువుకు సంబంధించిన న్యాయపరమైన పదబంధం. తెలుగు పాఠకులకు అర్థమయ్యే క్రియాత్మక రూపాన్ని ఎంచుకుంది.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: వాళ్లు నా కుమారుణ్ణి నిర్మూలించకుండా
  rationale: హీబ్రూ బహువచన కర్తను నిర్దిష్టంగా గుర్తించకుండా ‘వాళ్లు’తో నిలిపింది; שׁמד యొక్క పూర్తిగా తుడిచివేయడం అనే బలమైన భావాన్ని ‘నిర్మూలించు’ తెలియజేస్తుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది ప్రమాణ సూత్రం. ‘యెహోవా జీవం తోడు’ దాని గంభీరతను, దైవనామాన్ని నిలుపుతూ తెలుగులో ప్రమాణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: నీ కుమారుని వెంట్రుకల్లో ఒక్కటి కూడా నేలపై పడదు
  rationale: ప్రమాణం తరువాత אִם బలమైన ప్రతికూల హామీని సూచిస్తుంది. తెలుగు వాక్యం సంపూర్ణ రక్షణను తెలిపే హీబ్రూ నుడికారాన్ని దాని దృశ్యరూపంతో సహా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో దాన్ని నిలిపింది.
- issue: ‘యెహోవాను జ్ఞాపకం చేసుకోవాలి’ అనే విజ్ఞప్తి భావం
  choice: మూలంలోని ‘జ్ఞాపకం చేసుకో’ అనే విస్తృత భావాన్ని నిలపడం
  alternative: యెహోవా పేరుతో ప్రమాణం చేయాలి
  rationale: సందర్భం ప్రమాణాన్ని సూచించవచ్చుగానీ, זכר అనే క్రియ స్వయంగా ‘ప్రమాణం చేయు’ అని స్పష్టంగా చెప్పదు. అందువల్ల ఆ అంతర్భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా అసలు అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడింది. స్త్రీ రాజును మూడవ పురుష గౌరవ రూపంలో సంబోధించడాన్ని ‘రాజుగారు’తో, రాజు ఆమెను ఏకవచనంలో సంబోధించడాన్ని ‘నీ’తో ప్రతిబింబించింది. న్యాయపరమైన ‘రక్తప్రతీకారం’ భావాన్ని సంక్షిప్త వివరణాత్మక పదబంధంతో అందించింది.
