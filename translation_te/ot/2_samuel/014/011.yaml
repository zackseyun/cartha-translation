- from: అప్పుడు ఆమె, “రక్తప్రతీకారం తీర్చుకునేవాడు[a] ఇంకా నాశనం చేయకుండా, వాళ్లు నా కుమారుణ్ణి నిర్మూలించకుండా ఉండేలా, రాజుగారు దయచేసి మీ దేవుడైన యెహోవాను జ్ఞాపకం చేసుకోవాలి” అని చెప్పింది. అందుకు అతడు, “యెహోవా జీవం తోడు, నీ కుమారుని వెంట్రుకల్లో ఒక్కటి కూడా నేలపై పడదు[b]” అన్నాడు.
