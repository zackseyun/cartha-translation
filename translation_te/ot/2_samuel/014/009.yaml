  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: te
  text: అప్పుడు తెకోవా నుండి వచ్చిన స్త్రీ రాజుతో, “నా ప్రభువైన రాజా, ఆ దోషం నా మీదా నా తండ్రి ఇంటివారి మీదా ఉండనివ్వండి; అయితే రాజుకూ ఆయన సింహాసనానికీ దోషం లేకుండుగాక[a]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిర్దోషంగా ఉండుగాక.” హీబ్రూ పదం నిర్దోషిత్వాన్ని, దోషబాధ్యత లేకపోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: తెకోవకు చెందిన స్త్రీ
  rationale: స్త్రీని ఆమె స్వస్థలంతో గుర్తించే హీబ్రూ పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלַי
  choice: నా మీదా
  rationale: బాధ్యతను తానే స్వీకరిస్తున్నదనే ముందుంచిన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజసభలోని గౌరవపూర్వక సంబోధనను సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
- source_word: הֶעָוֺן
  choice: ఆ దోషం
  rationale: ఈ న్యాయసంబంధ సందర్భంలో తప్పు, అపరాధభారం, దాని బాధ్యత అనే భావవ్యాప్తిని పూర్తిగా సంకుచితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: וְעַל בֵּית אָבִי
  choice: నా తండ్రి ఇంటివారి మీదా
  rationale: ‘నా తండ్రి ఇల్లు’ అనే హీబ్రూ కుటుంబ/వంశ సంబంధ నుడికారాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: అయితే రాజు, ఆయన సింహాసనం
  rationale: మొదటి భాగంలోని బాధ్యత స్వీకరణకు తరువాతి రాజవిముక్తికి మధ్య ఉన్న భావవిరుద్ధతను ‘అయితే’ స్పష్టం చేస్తుంది; సింహాసనం రాజాధికారానికి సంకేతంగా యథాతథంగా ఉంచబడింది.
- source_word: נָקִי
  choice: నిర్దోషులుగా ఉంటారు
  rationale: న్యాయపరమైన బాధ్యత నుంచి విముక్తి అనే భావాన్ని తెలియజేస్తుంది; ఇది రాజు సంపూర్ణ నైతిక పరిపూర్ణతను ప్రకటించదు.
theological_decisions:
- issue: రాజును, అతని సింహాసనాన్ని దోషబాధ్యత నుంచి విడిపించే ప్రకటన
  choice: రాజు, ఆయన సింహాసనం నిర్దోషులుగా ఉంటారు
  alternative: రాజు, ఆయన సింహాసనం దోషరహితంగా ఉంటాయి
  rationale: ఈ మాట నిర్దిష్ట వ్యవహారంలోని న్యాయ/నైతిక బాధ్యతను మాత్రమే సూచిస్తుంది; రాజు గురించి విస్తృతమైన సిద్ధాంతపరమైన పరిపూర్ణతను దీనిలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజసభ సంబోధనను నిలుపుతూ, కుటుంబాన్ని సూచించే హీబ్రూ నుడికారాన్ని స్పష్టమైన తెలుగులో అందించాం.
