  terminology: ‘దోషం’ עָוֹן‌కు ఈ న్యాయసందర్భంలో సరైన విస్తృత పదం; అది తప్పు, అపరాధభారం, లేదా దోషబాధ్యతను సూచించగలదు. ‘నా ప్రభువైన రాజా’ రాజసభ గౌరవసంబోధనకు తగినది. ‘సింహాసనం’ను రాజాధికారానికి సంకేతంగా అక్షరార్థంగా ఉంచడం సముచితం.
