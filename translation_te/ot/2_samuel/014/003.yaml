translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. స్త్రీని ఉద్దేశించిన హీబ్రూ క్రియారూపం తెలుగులో ప్రత్యేకంగా గుర్తించబడదు; సందర్భమే దాన్ని స్పష్టం చేస్తుంది. మూలంలోని నానుడిని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
