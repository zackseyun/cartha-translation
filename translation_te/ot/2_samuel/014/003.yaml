  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: te
  text: “తర్వాత రాజు వద్దకు వెళ్లి అతనితో ఈ విధంగా మాట్లాడు.” అప్పుడు యోవాబు ఆ మాటలను ఆమె నోట పెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆ మాటలను ఆమె నోట పెట్టాడు” అనేది, ఆమె ఏమి చెప్పాలో యోవాబు ఆమెకు చెప్పాడని సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: తర్వాత నీవు ... వెళ్లి
  rationale: సూచనల క్రమంలో ఉన్న 2వ పురుష ఏకవచన స్త్రీలింగ క్రియకు ఆజ్ఞార్థక భావం ఉంది. తెలుగులో సహజమైన వరుస సూచనగా ‘తర్వాత ... వెళ్లి’ అని ఇచ్చాం.
- source_word: אֶל־הַמֶּלֶךְ
  choice: రాజు దగ్గరికి
  rationale: אֶל కదలిక యొక్క గమ్యాన్ని సూచిస్తుంది. ‘రాజు దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: అతనితో ... మాట్లాడు
  rationale: דבר אֶל అంటే సాధారణంగా ‘ఒకరితో మాట్లాడడం.’ ఆజ్ఞార్థక సందర్భాన్ని తెలుగులో నేరుగా నిలిపాం.
- source_word: כַּדָּבָר הַזֶּה
  choice: ఈ విధంగా
  rationale: ఇది చెప్పబోయే మాటల పద్ధతి లేదా విషయాన్ని పరిచయం చేస్తుంది. ‘ఈ విధంగా’ మూలంలోని సూచనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיָּשֶׂם
  choice: పెట్టాడు
  rationale: שׂים యొక్క ప్రాథమిక అర్థం ‘పెట్టు.’ ‘మాటలను నోట పెట్టడం’ అనే హీబ్రూ రూపకాన్ని ఇది నిలుపుతుంది.
- source_word: אֶת־הַדְּבָרִים
  choice: ఆ మాటలను
  rationale: బహువచన דְּבָרִים యోవాబు ఆమెకు చెప్పించిన నిర్దిష్ట మాటలను సూచిస్తుంది. తెలుగు కథనంలో ‘ఆ మాటలను’ సహజంగా పూర్వోక్త ప్రసంగాన్ని సూచిస్తుంది.
- source_word: בְּפִיהָ
  choice: ఆమె నోట
  rationale: మూలంలోని సజీవమైన ‘ఆమె నోట’ అనే రూపకాన్ని నిలిపాం; పాదసూచిక దాని ప్రయోగార్థాన్ని వివరిస్తుంది.
