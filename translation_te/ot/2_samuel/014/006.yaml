translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. స్త్రీ వక్త యొక్క వినయపూర్వక స్వీయసూచనను ‘నీ దాసికి’ ద్వారా నిలుపుతూ, హీబ్రూ వాక్యంలోని సంఘటనల క్రమాన్ని చిన్న, సహజ వాక్యాలతో అందించింది.
