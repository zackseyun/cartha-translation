  text: וּ/לְ/שִׁפְחָֽתְ/ךָ֙ שְׁנֵ֣י בָנִ֔ים וַ/יִּנָּצ֤וּ שְׁנֵי/הֶם֙ בַּ/שָּׂדֶ֔ה וְ/אֵ֥ין מַצִּ֖יל בֵּֽינֵי/הֶ֑ם וַ/יַּכּ֧/וֹ הָ/אֶחָ֛ד אֶת הָ/אֶחָ֖ד וַ/יָּ֥מֶת אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: te
  text: మీ దాసికి[a] ఇద్దరు కుమారులు ఉండేవారు. వారిద్దరూ పొలంలో పోట్లాడుకున్నారు. వారి మధ్య జోక్యం చేసుకొని వారిని విడదీయడానికి ఎవరూ లేరు[b]. అప్పుడు ఒకడు మరొకడిని కొట్టి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ సేవకురాలికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం రాజుతో మాట్లాడుతున్న స్త్రీ తనను తాను వినయంగా పేర్కొనే విధానం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి మధ్య విడిపించేవాడు ఎవరూ లేరు’; అంటే, జోక్యం చేసుకొని వారిని విడదీసేవారు ఎవరూ లేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: నీ దాసికి
  rationale: שִׁפְחָה స్త్రీ దాసిని సూచిస్తుంది; రాజుతో మాట్లాడుతున్న స్త్రీ వినయపూర్వకంగా తనను తాను ఇలా పేర్కొంటోంది. తెలుగులో ‘నీ దాసికి’ స్త్రీలింగాన్ని, సభామర్యాదతో కూడిన అణకువను సహజంగా నిలుపుతుంది.
- source_word: שְׁנֵי בָנִים
  choice: ఇద్దరు కుమారులు
  rationale: בָנִים ఇక్కడ సాధారణంగా పిల్లలు అని కాక, మగ సంతానాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: וַיִּנָּצוּ
  choice: పోట్లాడుకున్నారు
  rationale: נצה ఇక్కడ శారీరక ఘర్షణను సూచిస్తుంది; తరువాత ఒకడు మరొకడిని చంపడం దీనిని బలపరుస్తుంది. ‘పోట్లాడుకున్నారు’ ఆధునిక తెలుగులో పరస్పర శారీరక పోరాటాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: స్థలాన్ని నేరుగా, సహజంగా సూచించే అనువాదం.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: వారిని విడదీయడానికి వారి మధ్య ఎవరూ లేరు
  rationale: מַצִּיל అక్షరార్థంగా రక్షించేవాడు లేదా విడిపించేవాడు; ఈ ఘర్షణ సందర్భంలో మధ్యలో జోక్యం చేసుకొని వారిని విడదీయగల వ్యక్తి లేడనే భావం.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: ఒకడు మరొకడిని కొట్టి
  rationale: נכה కొట్టడం లేదా దెబ్బతీయడం అనే అర్థం ఇస్తుంది. ‘కొట్టి’ దెబ్బ యొక్క స్వరూపం లేదా సంఖ్యను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיָּמֶת אֹתוֹ
  choice: చంపాడు
  rationale: מות రూపం ఇక్కడ ప్రత్యక్ష కర్మతో కారణార్థకంగా ఉంది—అతడు మరొకని మరణింపజేశాడు. తెలుగులో సహజమైన రూపం ‘చంపాడు’.
