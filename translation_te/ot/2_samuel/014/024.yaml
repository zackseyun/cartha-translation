  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ יִסֹּ֣ב אֶל בֵּית֔/וֹ וּ/פָנַ֖/י לֹ֣א יִרְאֶ֑ה וַ/יִּסֹּ֤ב אַבְשָׁלוֹם֙ אֶל בֵּית֔/וֹ וּ/פְנֵ֥י הַ/מֶּ֖לֶךְ לֹ֥א רָאָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: te
  text: అయితే రాజు, “అతడు తన ఇంటికి వెళ్లిపోవాలి; నా ముఖం చూడకూడదు[a]” అని చెప్పాడు. కాబట్టి అబ్షాలోము తన ఇంటికి వెళ్లిపోయాడు; రాజు ముఖం చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నా ముఖం చూడకూడదు” / “రాజు ముఖం చూడలేదు.” ఇది ఒకరి సన్నిధిలోకి రావడం లేదా వారి సన్నిధిలో ప్రవేశం పొందడం అనే భావాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: తన ఇంటికి వెళ్లాలి / తన ఇంటికి వెళ్లాడు
  rationale: ఈ సందర్భంలో סבב రాజు సన్నిధి నుండి తన ఇంటివైపు మళ్లించబడడాన్ని సూచిస్తుంది. తెలుగులో ‘తిరిగి వెళ్లాలి’ అనడం అతడు ఇంతకుముందు అదే ఇంటి నుండి వచ్చాడనే అనవసర భావాన్ని కలిగించవచ్చు; అందువల్ల సహజమైన ‘వెళ్లాలి’ ఎంచుకొని, రెండు చోట్ల క్రియ పునరావృతిని నిలిపాం.
- source_word: בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థం ‘ఇల్లు’; స్వామ్య ప్రత్యయం తెలుగులో సహజంగా ‘తన’ ద్వారా వ్యక్తమవుతుంది.
- source_word: וּפָנַי ... לֹא יִרְאֶה
  choice: నా ముఖం చూడకూడదు
  rationale: ‘ముఖం చూడడం’ అనే హీబ్రూ నుడికారాన్ని యథాతథంగా నిలిపి, రాజు విధించిన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: రాజు ముఖం చూడలేదు
  rationale: ఆజ్ఞలోని ‘ముఖం’ నుడికారాన్ని కథన భాగంలోనూ పునరావృతం చేసి, రాజు దర్శనం నిరాకరించబడిన భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలిపాం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: מֶלֶךְకు ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וַיֹּאמֶר
  choice: అయితే రాజు ... అని చెప్పాడు
  rationale: 'వావ్-క్రమ రూపం సందర్భంలో స్వల్ప వ్యతిరేక మలుపును సూచిస్తుంది: అబ్షాలోము తిరిగి వచ్చినప్పటికీ రాజు అతనికి దర్శనం ఇవ్వలేదు. ‘అయితే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.'
theological_decisions:
- issue: ‘నా ముఖం చూడడం / రాజు ముఖం చూడడం’ అనే నుడికారాన్ని అక్షరార్థంగా ఉంచాలా, రాజు సన్నిధి లేదా దర్శనంగా విప్పి చెప్పాలా
  choice: ప్రధాన పాఠ్యంలో ‘ముఖం చూడడం’ అనే రూపాన్ని నిలిపాం
  alternative: ‘నా సన్నిధికి రాకూడదు’; ‘రాజు దర్శనం అతనికి లభించలేదు’
  rationale: అక్షర రూపం హీబ్రూ వాక్యంలోని పునరావృతిని, కథన బలాన్ని కాపాడుతుంది. పాదసూచిక నుడికారార్థాన్ని స్పష్టం చేస్తుంది; ప్రధాన పాఠ్యం సామాజిక లేదా రాజసభ సంబంధిత పరిణామాలను అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. హీబ్రూ మూలంలోని ఆజ్ఞ–నెరవేర్పు సమాంతర నిర్మాణాన్ని, ‘ముఖం’ అనే పద పునరావృతిని కాపాడింది.
