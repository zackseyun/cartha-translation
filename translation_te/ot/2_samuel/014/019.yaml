  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ הֲ/יַ֥ד יוֹאָ֛ב אִתָּ֖/ךְ בְּ/כָל זֹ֑את וַ/תַּ֣עַן הָ/אִשָּׁ֣ה וַ/תֹּ֡אמֶר חֵֽי נַפְשְׁ/ךָ֩ אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אִם אִ֣שׁ לְ/הֵמִ֣ין וּ/לְ/הַשְׂמִ֗יל מִ/כֹּ֤ל אֲשֶׁר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי עַבְדְּ/ךָ֤ יוֹאָב֙ ה֣וּא צִוָּ֔/נִי וְ/ה֗וּא שָׂ֚ם בְּ/פִ֣י שִׁפְחָֽתְ/ךָ֔ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: te
  text: 'అప్పుడు రాజు, “ఈ సంగతంతటిలో యోవాబు ప్రమేయం ఉందా?[a]” అని అడిగాడు. ఆ స్త్రీ జవాబిస్తూ ఇలా చెప్పింది: “నా ప్రభువైన రాజా, నీ ప్రాణం సజీవంగా ఉన్నంత నిశ్చయంగా,[b] నా ప్రభువైన రాజు పలికిన దేనినుంచైనా కుడికిగానీ ఎడమకిగానీ మళ్లడం ఎవరికీ సాధ్యం కాదు.[c] నీ సేవకుడైన యోవాబే నాకు ఆజ్ఞాపించాడు; అతడే ఈ మాటలన్నిటినీ నీ దాసి నోట ఉంచాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యోవాబు హస్తం నీతో ఉందా?” ఇక్కడ “హస్తం” యోవాబు ప్రమేయాన్ని, సహకారాన్ని లేదా ప్రభావాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: 'హీబ్రూ ప్రమాణ వాక్యం అక్షరార్థంగా, “నీ ప్రాణం జీవిస్తున్నట్లుగా” అని ఉంది. భావం: “నీవు జీవించడం ఎంత నిశ్చయమో అంత నిశ్చయంగా.”'
    reason: lexical_alternative
  - marker: c
    text: “కుడికి లేదా ఎడమకు మళ్లడం” అంటే రాజు చెప్పినదాని నుంచి వైదొలగడం, దాన్ని ఖండించడం లేదా తప్పించుకోవడం అనే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיָד יוֹאָב אִתָּךְ
  choice: యోవాబు హస్తం నీతో ఉందా?
  rationale: ‘హస్తం’ ఏజెన్సీ, ప్రమేయం లేదా ప్రభావాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది; దాని ఉద్దేశాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּכָל זֹאת
  choice: ఇదంతటిలో
  rationale: చర్చలో ఉన్న మొత్తం పథకం లేదా వ్యవహారాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: חֵי נַפְשְׁךָ
  choice: నీ ప్రాణం సజీవంగా ఉన్నంత నిశ్చయంగా
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని ‘నీ ప్రాణం జీవిస్తున్నట్లుగా’ అనే చిత్రాన్ని ఉంచుతూ, తెలుగులో ప్రమాణార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: కుడికిగానీ ఎడమకిగానీ మళ్లడం ఎవరికీ సాధ్యం కాదు
  rationale: రాజు చెప్పినదాన్ని తప్పించుకోవడం లేదా ఖండించడం అసాధ్యమనే భావంతోపాటు హీబ్రూ దిశాత్మక నుడికారాన్ని కూడా నిలుపుతుంది.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: పలికిన దేనినుంచైనా
  rationale: రాజు పలికిన మాటల నుంచి వైదొలగడం అనే సంబంధాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడైన
  rationale: రాజసభ సందర్భంలో రాజుకు లోబడిన వ్యక్తిని సూచించేందుకు ‘సేవకుడు’ సహజమైన గౌరవప్రద సమానం.
- source_word: צִוָּנִי
  choice: నాకు ఆజ్ఞాపించాడు
  rationale: యోవాబు అధికారపూర్వకంగా ఆదేశించిన భావాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: שָׂם בְּפִי
  choice: నోట ఉంచాడు
  rationale: మాటలను చెప్పేందుకు అందించడం అనే హీబ్రూ నుడికారపు సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: שִׁפְחָתְךָ
  choice: నీ దాసి
  rationale: స్త్రీ తనను తాను రాజు ఎదుట వినయంగా సంబోధించుకునే స్త్రీలింగ రూపాన్ని కాపాడుతుంది.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటినీ
  rationale: యోవాబు ఆమెకు చెప్పవలసిన ప్రసంగాన్ని ఇచ్చినందున ‘మాటలు’ సందర్భానికి అత్యంత సరైనది.
