    issue: ‘యోవాబు హస్తం నీతో ఉందా?’ అనే పదబంధం అసహజంగా ఉంది.
    rationale: హీబ్రూ ‘యాదు’ ఇక్కడ ప్రమేయం లేదా భాగస్వామ్యాన్ని సూచిస్తుంది. తెలుగులో ‘హస్తం నీతో ఉంది’ అక్షరానువాదంలా వినిపిస్తుంది; ప్రశ్నార్థక ఉద్దేశం స్పష్టపడేందుకు ‘యోవాబు ప్రమేయం ఉందా?’ అవసరం.
