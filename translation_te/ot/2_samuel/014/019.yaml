translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసభ శైలిని వాడాం. ‘హస్తం,’ ‘కుడికి…ఎడమకు,’ ‘నోట ఉంచాడు’ వంటి మూలభాషా చిత్రాలను పాఠ్యంలో నిలిపి, అవసరమైన చోట పాదటిప్పణులతో అర్థాన్ని స్పష్టం చేశాం. స్త్రీ తనను ‘నీ దాసి’ అని సంబోధించుకోవడంలోని లింగసూచనను కాపాడాం.
