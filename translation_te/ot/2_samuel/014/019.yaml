- from: 'అప్పుడు రాజు, “ఇదంతటిలో యోవాబు హస్తం నీతో ఉందా?[a]” అని అడిగాడు. ఆ స్త్రీ ఇలా జవాబిచ్చింది: “నా ప్రభువైన రాజా, నీ ప్రాణం సజీవంగా ఉన్నంత నిశ్చయంగా,[b] నా ప్రభువైన రాజు పలికిన దేనినుంచైనా కుడికిగానీ ఎడమకిగానీ మళ్లడం ఎవరికీ సాధ్యం కాదు.[c] నీ సేవకుడైన యోవాబే నాకు ఆజ్ఞాపించాడు; అతడే ఈ మాటలన్నిటినీ నీ దాసి నోట ఉంచాడు.”'
  to: 'అప్పుడు రాజు, “ఈ సంగతంతటిలో యోవాబు ప్రమేయం ఉందా?[a]” అని అడిగాడు. ఆ స్త్రీ జవాబిస్తూ ఇలా చెప్పింది: “నా ప్రభువైన రాజా, నీ ప్రాణం సజీవంగా ఉన్నంత నిశ్చయంగా,[b] నా ప్రభువైన రాజు పలికిన దేనినుంచైనా కుడికిగానీ ఎడమకిగానీ మళ్లడం ఎవరికీ సాధ్యం కాదు.[c] నీ సేవకుడైన యోవాబే నాకు ఆజ్ఞాపించాడు; అతడే ఈ మాటలన్నిటినీ నీ దాసి నోట ఉంచాడు.”'
  rationale: అర్థాన్ని మార్చకుండా, హీబ్రూ రూపకమైన ‘హస్తం’ను పాదటిప్పణిలో నిలిపి పాఠ్యంలో దాని ఉద్దేశ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం. చిన్న సూచనాత్మక అదనాన్ని తొలగించాం.
