  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: te
  text: అప్పుడు యోవాబు రాజు దగ్గరికి వచ్చి, అతనికి చెప్పాడు. రాజు అబ్షాలోమును పిలిపించాడు[a]. అబ్షాలోము రాజు దగ్గరికి వచ్చి, రాజు ఎదుట తన ముఖాన్ని నేలమీద ఉంచి నమస్కరించాడు. అప్పుడు రాజు అబ్షాలోమును ముద్దుపెట్టుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు అబ్షాలోమును తన దగ్గరకు రమ్మని కబురు పంపాడు.”
    reason: lexical_alternative
  - marker: b
    text: రాజు పెట్టిన ఈ ముద్దు సమాధానానికి లేదా పునరుద్ధరించిన అనుగ్రహానికి సంకేతమై ఉండవచ్చు; అయితే పాఠం అతడు అబ్షాలోమును ముద్దుపెట్టుకున్నాడని మాత్రమే చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: యోవాబు రాజు దగ్గరికి వచ్చి
  rationale: בוא అనే సాధారణ కథన క్రియను సహజమైన తెలుగులో ‘వచ్చి’ అని అనువదించాం; కదలిక రాజువైపు ఉందనే భావం నిలుస్తుంది.
- source_word: וַיַּגֵּד לוֹ
  choice: అతనికి సంగతి తెలియజేశాడు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం/చెప్పడం’ అనే అర్థాన్ని ఇస్తుంది. హెబ్రీ పాఠం ఏమి తెలియజేశాడో పేర్కొననందున ‘సంగతి’ అనే సాధారణ పదంతో ఆ అనిర్దిష్టతను నిలిపాం.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: రాజు అబ్షాలోమును పిలిపించాడు
  rationale: రాజసభ సందర్భంలో קרא אל ఒకరిని తన సన్నిధికి రప్పించడాన్ని సూచిస్తుంది. సందర్భం ప్రకారం కర్త రాజు; తెలుగు వాక్యంలో సర్వనామ సందిగ్ధత రాకుండా కర్తను స్పష్టంగా పేర్కొన్నాం.
- source_word: וַיִּשְׁתַּחוּ לוֹ עַל־אַפָּיו אַרְצָה
  choice: రాజు ఎదుట నేలకు ముఖం ఆనించి వంగి నమస్కరించాడు
  rationale: שׁחה గౌరవంతో వంగడాన్ని సూచిస్తే, עַל־אַפָּיו אַרְצָה అతని ముఖం నేలవైపు ఉండే లోతైన ప్రణామ భంగిమను స్పష్టం చేస్తుంది. ఈ రెండు అంశాలనూ సహజమైన తెలుగులో కలిపి వ్యక్తం చేశాం.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: రాజు అబ్షాలోమును ముద్దుపెట్టుకున్నాడు
  rationale: నేరుగా తెలిపిన ముద్దు చర్యను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా అనువదించాం; దాని సామాజిక లేదా సంబంధపరమైన ప్రాముఖ్యతను పాదసూచికలో మాత్రమే సూచించాం.
theological_decisions:
- issue: రాజు పెట్టిన ముద్దు స్వభావం
  choice: ప్రధాన పాఠంలో ముద్దుపెట్టుకున్న చర్యను మాత్రమే యథార్థంగా పేర్కొనడం
  alternative: దీనిని స్పష్టంగా సమాధానానికి లేదా తిరిగి అనుగ్రహించడానికి సంకేతంగా అనువదించడం
  rationale: కథన సందర్భంలో ఇది సమాధానాన్ని లేదా రాజానుగ్రహ పునరుద్ధరణను సూచించే అవకాశం ఉంది. అయినా హెబ్రీ పాఠం రాజు అబ్షాలోమును ముద్దుపెట్టుకున్నాడని మాత్రమే చెబుతుంది; అందువల్ల అంతకుమించిన భావాన్ని ప్రధాన పాఠంలో ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా సహజమైన చిన్న వాక్యాలుగా విభజించాం. ‘అబ్షాలోము,’ ‘యోవాబు’ అనే సుపరిచిత బైబిలు నామరూపాలను నిలిపాం; ముద్దు యొక్క భావాన్ని ప్రధాన పాఠంలో సిద్ధాంతపరంగా నిర్ధారించలేదు.
