source:
  edition: WLC
  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: te
  text: '“ఇప్పుడు నేను ఈ విషయం గురించి నా ప్రభువైన రాజుతో మాట్లాడడానికి వచ్చాను. ఎందుకంటే ప్రజలు నన్ను భయపెట్టారు.[a] అప్పుడు మీ దాసి ఇలా చెప్పింది: ‘దయచేసి నన్ను రాజుతో మాట్లాడనివ్వండి; బహుశా రాజు తన దాసి మాట ప్రకారం చేస్తాడేమో.’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలు నాకు భయం కలిగించారు.” ఇక్కడి హీబ్రూ క్రియ కారణార్థకంగా ఉంది; దీని అర్థం “ప్రజలు నాకు భయపడుతున్నారు” కాదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “రాజు తన దాసి మాటను చేస్తాడు”; అంటే ఆమె విన్నపం ప్రకారం చేస్తాడు.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రస్తుత వివరణను ప్రారంభించే సంభాషణా సూచికగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: మాట్లాడడానికి వచ్చాను
  rationale: రావడం మరియు మాట్లాడాలనే ఉద్దేశం రెండింటినీ మూల నిర్మాణానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: నా ప్రభువైన రాజుతో
  rationale: రాజ బిరుదును, గౌరవపూర్వక సంబోధనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి
  rationale: דבר ఇక్కడ ఆమె రాజు ఎదుట ఉంచుతున్న సంగతి లేదా వ్యవహారాన్ని సూచిస్తుంది; కేవలం ఒక మాటను కాదు.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: ఎందుకంటే ప్రజలు నన్ను భయపెట్టారు
  rationale: యిరే అనే క్రియ యొక్క పియేల్ రూపంలో ఉన్న కారణార్థక భావాన్ని—భయపడేలా చేయడం—స్పష్టంగా నిలుపుతుంది.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: అప్పుడు మీ దాసి ... అనుకుంది
  rationale: ఇది స్త్రీ తనను తాను వినయంగా సూచించుకునే రాజసభా భాష. సందర్భంలో అంతరంగ నిర్ణయాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘అనుకుంది’ వాడబడింది.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: దయచేసి నన్ను రాజుతో మాట్లాడనివ్వండి
  rationale: కోహోర్టేటివ్ రూపం మరియు נָא కలిపి తెలిపే వినయపూర్వక సంకల్పం/విన్నపాన్ని నిలుపుతుంది.
- source_word: אוּלַי
  choice: బహుశా ... ఏమో
  rationale: సంభావ్యతను సూచించే మూల భావాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: రాజు తన దాసి మాట ప్రకారం చేస్తాడేమో
  rationale: עשה అనే విస్తృతార్థక క్రియను ‘చేస్తాడు’గా, דבר ను ‘మాట’గా ఉంచి, విన్నపాన్ని మన్నించడం అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
