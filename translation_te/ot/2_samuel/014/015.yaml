translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభా స్వరాన్ని నిలిపాం. ‘దాసి’ అనే స్త్రీలింగ పదం మూలంలోని שִׁפְחָה మరియు אָמָה అనే వినయపూర్వక స్త్రీ సేవకురాలి స్వీయసూచనను ప్రతిబింబిస్తుంది. ప్రత్యక్ష వాక్యంలో ఉన్న వినయపూర్వకతను ‘దయచేసి’ ద్వారా కాపాడాం.
