source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: te
  text: 'అప్పుడు ఆ స్త్రీ ఇలా అంది: “అయితే దేవుని ప్రజలకు విరోధంగా ఇలాంటి దాన్ని ఎందుకు తలపెట్టారు?[a] రాజు ఈ మాట చెప్పడం ద్వారా దోషి అయినవానిలా ఉన్నాడు;[b] ఎందుకంటే రాజు తన బహిష్కృతుణ్ణి తిరిగి రప్పించలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ప్రజలకు విరోధంగా ఇలాంటి దాన్ని ఎందుకు ఆలోచించారు?” లేదా “దేవుని ప్రజలకు విరోధంగా ఇలాంటి దానికి ఎందుకు పన్నాగం వేశారు?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాజు దోషి అయినవానిలా ఉన్నాడు”; అంటే, తన బహిష్కృతుణ్ణి తిరిగి రప్పించకపోవడం వల్ల రాజు పలికిన తీర్పే అతన్ని దోషి స్థానంలో నిలబెడుతోంది.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: తలపెట్టారు
  rationale: ఈ క్రియ ఆలోచించడం, యోచించడం, పథకం వేయడం అనే భావాలను కలిగి ఉంది. ఇక్కడ దావీదు అనుసరించిన ఉద్దేశపూర్వక వైఖరిని స్త్రీ ప్రశ్నిస్తున్నందున ‘తలపెట్టారు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: כָּזֹאת
  choice: ఇలాంటి దాన్ని
  rationale: ముందటి ఉపమానం సూచించిన చర్య రకాన్ని చూపించే నిర్దేశక పదబంధం; తెలుగు వాక్యంలో ఆరోపణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: עַל עַם אֱלֹהִים
  choice: దేవుని ప్రజలకు విరోధంగా
  rationale: חשב తో కూడిన עַל ఈ సందర్భంలో ప్రతికూల దిశను సూచిస్తుంది. మూలంలోని ‘దేవుని ప్రజలు’ అనే విస్తృత నిబంధనాత్మక పదబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: రాజు ఈ మాట చెప్పడం ద్వారా
  rationale: 'מִ + infinitive construct ఇక్కడ సాధనాత్మక/పరిస్థితిజన్య భావాన్ని ఇస్తుంది: రాజు పలికిన తీర్పే అతని స్థితిని బయటపెడుతుంది.'
- source_word: כְּאָשֵׁם
  choice: దోషిలాంటి వాడవుతున్నాడు
  rationale: כְּ ఉపమానాన్ని సూచిస్తుంది. నేరుగా ‘దోషి’ అని తేల్చకుండా, తన తీర్పు వల్ల దోషి స్థానంలో నిలుస్తున్నాడనే వాక్యంలోని పోలికను కాపాడుతుంది.
- source_word: לְבִלְתִּי
  choice: ఎందుకంటే ... లేదు
  rationale: రాజుపై వచ్చిన ఆరోపణకు కారణాన్ని పరిచయం చేసే నిర్మాణంగా తెలుగులో స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: הָשִׁיב
  choice: తిరిగి రప్పించలేదు
  rationale: Hiphil రూపం ‘తిరిగి తీసుకురావడం/రప్పించడం’ అనే సకర్మక భావాన్ని ఇస్తుంది; బహిష్కరణలో ఉన్న వ్యక్తి సందర్భానికి ఇది సరిపోతుంది.
- source_word: נִדְּחוֹ
  choice: తన బహిష్కృతుణ్ణి
  rationale: ఏకవచన నిష్క్రియ కృదంతం ‘తోలివేయబడిన లేదా బహిష్కరించబడిన వ్యక్తి’ని సూచిస్తుంది. అబ్షాలోమును సూచించినప్పటికీ స్త్రీ వాడిన సాధారణీకృత రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని ప్రజలు’ అనే మాట పరిధి
  choice: మూలంలోని ‘దేవుని ప్రజలు’ అనే విస్తృత పదబంధాన్ని నిలుపడం
  alternative: ‘ఇశ్రాయేలుకు విరోధంగా’ లేదా ‘అబ్షాలోముకు, రాజకుటుంబానికి విరోధంగా’ అని సంకుచితం చేయడం
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘దేవుని ప్రజలు’ అంటుంది. సందర్భంలో రాజు తన కుమారుని పట్ల చూపిన వైఖరి సమాజంపై ప్రభావం చూపుతుందని సూచించినా, అనువాదం ఆ వాక్చాతుర్యాన్ని మరింత సంకుచితం చేయకూడదు.
- issue: כְּאָשֵׁם లోని దోషారోపణ స్వరూపం
  choice: ‘దోషిలాంటి వాడు’ అనే పోలికను నిలుపడం
  alternative: ‘రాజు దోషి’ అని నేరుగా ప్రకటించడం
  rationale: כְּ సూచించే పోలికను కాపాడడం ద్వారా రాజు పలికిన తీర్పు అతనినే దోషి స్థానంలో నిలబెడుతుందనే ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవవాచక సంబోధనను సందర్భానుసారంగా వాడుతూ, రాజసభకు తగిన గంభీరతను మరియు స్త్రీ ఆరోపణలోని ధైర్యాన్ని నిలిపింది. మూలంలోని ఉపమానాన్ని, కారణ సంబంధాన్ని అతిగా వివరణ చేయకుండా ఉంచింది.
