  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: te
  text: 'రాజు ఆమెతో, “నీకు ఏమైంది?[a]” అన్నాడు. ఆమె ఇలా అంది: “నిజంగా నేను విధవరాలిని;[b] నా భర్త చనిపోయాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సంగతి ఏమిటి?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అయ్యో, నేను విధవరాలిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לָּךְ
  choice: నీకు ఏమైంది?
  rationale: ‘నీకు ఏమి?’ అనే హీబ్రూ నుడికారం ఎదుటివారి సమస్య లేదా బాధ ఏమిటని అడుగుతుంది. ‘నీకు ఏమైంది?’ అనేది దాని వ్యక్తిగత సంబోధనను నిలుపుతూ సహజమైన ఆధునిక తెలుగు ప్రశ్నగా ఉంది.
- source_word: אֲבָל
  choice: నిజంగా
  rationale: ఇక్కడ ఈ పదం ప్రధానంగా వ్యతిరేకార్థకమైన ‘కాని’గా కాక, ఆమె చెప్పబోయే విషయాన్ని నొక్కిచెప్పే పదంగా పనిచేస్తుంది. ‘నిజంగా’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది; సందర్భానుసారం విలాపార్థకంగా కూడా గ్రహించే అవకాశం ఉన్నందున దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: אִשָּׁה אַלְמָנָה
  choice: నేను విధవరాలిని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘విధవరాలైన స్త్రీ’ అని ఉన్నా, తెలుగులో ‘విధవరాలిని’ అనడం సహజం, సంపూర్ణం.
- source_word: וַיָּמָת אִישִׁי
  choice: నా భర్త చనిపోయాడు
  rationale: ఈ సందర్భంలో אִישִׁי అంటే ‘నా భర్త.’ וַיָּמָת క్రియ జరిగిన మరణాన్ని చెబుతుంది; అందువల్ల ‘చనిపోయాడు’ నేరుగా, సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట రాజును సూచించే హీబ్రూ పదానికి సహజమైన తెలుగు రూపం.
- source_word: וַתֹּאמֶר
  choice: ఆమె … అంది
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణ నిర్మాణంతో తెలిపింది.
