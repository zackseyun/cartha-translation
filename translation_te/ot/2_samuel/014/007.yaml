base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: te
  text: “ఇదిగో, మా కుటుంబమంతా నీ దాసికి విరోధంగా లేచి, ‘తన సహోదరుణ్ణి కొట్టినవాణ్ణి అప్పగించు. అతడు చంపిన తన సహోదరుని ప్రాణానికి ప్రతిగా అతణ్ణి చంపుతాం; వారసుణ్ణి కూడా నాశనం చేస్తాం’ అన్నారు. అలా వారు నాకు మిగిలి ఉన్న నిప్పుబొగ్గును[a] ఆర్పివేసి, నా భర్తకు భూమిమీద పేరు గాని మిగిలిన సంతతి గాని[b] లేకుండా చేస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాకు మిగిలిన చివరి నిప్పుబొగ్గును.’ కుటుంబ వంశం కొనసాగుతుందనే చివరి ఆశను హీబ్రూ పాఠం ఇంకా మండుతున్న నిప్పుకణం లేదా బొగ్గు రూపకంతో సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పేరు గాని మిగిలిన సంతతి గాని’ అంటే కేవలం మంచి పేరు లేదా కీర్తి కాదు; ఆ వ్యక్తి జ్ఞాపకమూ అతని వంశమూ నిలిచి ఉండడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని తరువాతి పరిస్థితిపై నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: మా కుటుంబమంతా
  rationale: מִשְׁפָּחָה ఇక్కడ విస్తృత కుటుంబ లేదా బంధువర్గాన్ని సూచిస్తుంది. సందర్భానుసారమైన ‘మా’ను చేర్చడం తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది; ‘కుటుంబమంతా’ సాధారణ పాఠకులకు సహజం.
- source_word: שִׁפְחָתֶךָ
  choice: నీ దాసి
  rationale: రాజును ఉద్దేశించి స్త్రీ తనను తాను వినయంగా పేర్కొనే రూపం. స్త్రీలింగాన్ని, వినయపూర్వక రాజసభా సంబోధనను రెండింటినీ నిలుపుతుంది.
- source_word: קָמָה ... עַל
  choice: విరోధంగా లేచి
  rationale: కేవలం నిలబడటాన్ని కాక శత్రుత్వంతో ఎదిరించడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని ప్రతిబింబిస్తుంది.
- source_word: תְּנִי
  choice: అప్పగించు
  rationale: న్యాయప్రతీకారం కోసం కుమారుణ్ణి తమ చేతికి ఇవ్వాలనే బలవంతపు డిమాండును సహజంగా తెలియజేస్తుంది.
- source_word: מַכֵּה אָחִיו
  choice: తన సహోదరుణ్ణి కొట్టినవాణ్ణి
  rationale: נכה పదాన్ని ముందుగానే ‘హంతకుడు’గా నిర్ణయించకుండా, తరువాత వచ్చే ‘చంపిన’ అనే స్పష్టీకరణ వరకు మూలంలోని కథన క్రమాన్ని కాపాడుతుంది.
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: తన సహోదరుని ప్రాణానికి ప్రతిగా అతణ్ణి చంపుతాం
  rationale: ప్రాణానికి ప్రాణం అనే ప్రతీకార న్యాయ భావాన్ని స్పష్టంగా తెలుపుతూ cohortative ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: వారసుణ్ణి కూడా నాశనం చేస్తాం
  rationale: బతికున్న కుమారుడు వారసుడనే అంశాన్ని, అతణ్ణి పూర్తిగా తొలగించాలనే కుటుంబ ఉద్దేశ తీవ్రతను నిలుపుతుంది.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: నాకు మిగిలిన నిప్పుకణాన్ని ఆర్పివేసి
  rationale: కుటుంబ వంశానికి చివరి ఆశగా ఉన్న కుమారుణ్ణి సూచించే సజీవ నిప్పుకణం రూపకాన్ని చదును చేయకుండా అలాగే నిలుపుతుంది.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: పేరు గాని మిగిలిన సంతతి గాని
  rationale: ‘పేరు’ను మృతుని జ్ఞాపకం/వంశపేరు భావంలో నిలుపుతూ, שְׁאֵרִית ఇక్కడ జీవించి కొనసాగే వంశాన్ని సూచిస్తుందని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: భూమిమీద
  rationale: హీబ్రూ నుడికారానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: ప్రాణానికి ప్రతిగా ప్రాణం అనే భాషను న్యాయబద్ధమైన తీర్పుగా లేదా వ్యక్తిగత ప్రతీకారంగా నిర్ణయించడం
  choice: కుటుంబం పలికిన ప్రతీకార డిమాండుగానే అనువదించడం
  alternative: అధికారిక మరణశిక్షగా ‘శిక్షిస్తాం’ అని అనువదించడం
  rationale: ఈ వాక్యం కుటుంబ సభ్యుల మాటలను నివేదిస్తుంది; వారి చర్యకు అధికారిక న్యాయస్థాన అనుమతి ఉందని మూలపాఠం స్పష్టంగా చెప్పదు. అందువల్ల అనువాదం దానిని ముందుగానే చట్టబద్ధ తీర్పుగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజసభా వినయాన్ని ‘నీ దాసి’తో నిలిపి, ప్రత్యక్ష ఉల్లేఖనంలో కుటుంబపు కఠిన డిమాండుకు సరళమైన వాక్యనిర్మాణం ఇచ్చాం. ‘నిప్పుకణం’ అనే మూల రూపకాన్ని ప్రధాన పాఠంలోనే ఉంచి పాదసూచికలో వివరణ ఇచ్చాం.
