  to: 'అప్పుడు నీ దాసి ఇలా అంది: “నా ప్రభువైన రాజు మాట దయచేసి ఉపశమనాన్ని కలిగించుగాక. ఎందుకంటే నా ప్రభువైన రాజు మంచి చెడులను ఆలకించి వివేచించగల దేవుని దూతవంటివాడు.[a][b] నీ దేవుడైన యెహోవా నీకు తోడుగా ఉండుగాక.”'
