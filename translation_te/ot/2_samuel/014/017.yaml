source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: te
  text: 'అప్పుడు నీ దాసి ఇలా అంది: “నా ప్రభువైన రాజు మాట దయచేసి ఉపశమనాన్ని కలిగించుగాక. ఎందుకంటే నా ప్రభువైన రాజు మంచి చెడులను ఆలకించి వివేచించగల దేవుని దూతవంటివాడు.[a][b] నీ దేవుడైన యెహోవా నీకు తోడుగా ఉండుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని దూత’ అనే మాటను ‘దేవదూత’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మంచి చెడులను వినడం’; ఇది మంచి చెడులను వివేచించి తీర్పు చేయడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: నీ దాసి
  rationale: ఈ పదం స్త్రీ సేవకురాలిని సూచిస్తుంది. మాట్లాడుతున్న స్త్రీ తనను తాను తగ్గించుకొని రాజును సంబోధిస్తున్న ఆస్థానిక ధోరణిని ‘నీ దాసి’ సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: יִהְיֶה נָּא
  choice: దయచేసి ... కలిగించుగాక
  rationale: జస్సివ్ రూపంతో కూడిన נָא వినయపూర్వక విన్నపాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు నిర్మాణం విన్నపాన్నీ ఆశాభావాన్నీ నిలుపుతుంది.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు మాట
  rationale: דבר అనే పదానికి మాట, విషయం, తీర్పు అనే భావాలు ఉండవచ్చు. ఇక్కడ రాజు పలికే నిర్ణయాత్మక మాట సందర్భానికి సరిపోతుంది; ‘మాట’ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: לִמְנוּחָה
  choice: మనశ్శాంతిని కలిగించు
  rationale: מְנוּחָה విశ్రాంతి, ఉపశమనం, ప్రశాంతతను సూచిస్తుంది. వివాదాన్ని రాజు మాట స్థిరపరచాలనే సందర్భంలో ‘మనశ్శాంతి’ సహజమైన తెలుగు భావవ్యక్తీకరణ.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూతవంటివాడు
  rationale: מַלְאָךְ అంటే దూత లేదా దేవదూత. ‘దేవుని దూత’ మూలపదంలోని సందేశవాహక భావాన్ని కాపాడుతూ, ఈ సందర్భంలోని పరలోక సంబంధమైన పోలికకు కూడా చోటిస్తుంది.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: మంచి చెడులను విని విచారించడంలో
  rationale: అక్షరార్థంగా ‘మంచిని చెడును వినడానికి.’ రాజన్య సందర్భంలో שׁמע వినడమే కాక వాదనలను ఆలకించి వివేచించడం లేదా తీర్పు చెప్పడం అనే భావాన్ని కలిగి ఉంది. ‘విని విచారించడం’ వినికిడి రూపకాన్నీ న్యాయపరమైన భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: వ్యక్తిగత దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, ‘నీ దేవుడు’ అనే సంబంధాన్ని యథాతథంగా ఉంచింది.
- source_word: יְהִי עִמָּךְ
  choice: నీకు తోడుగా ఉండుగాక
  rationale: ఇది ఆశీర్వాదార్థక జస్సివ్. ‘తోడుగా ఉండుగాక’ గౌరవప్రదమైన, సహజమైన తెలుగు ఆశీర్వచనం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో వ్యక్తిగత నామం ప్రత్యక్షంగా ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యమైన ‘యెహోవా’ రూపంలో నిలుపుతుంది.
- issue: מַלְאָךְ భావం
  choice: దూత
  alternative: దేవదూత
  rationale: మూలపదం మానవ దూతనూ పరలోక దూతనూ సూచించగలదు. ‘దేవుని దూత’ అనే పదబంధం సందర్భంలోని ఉన్నతమైన పోలికను తెలియజేస్తూనే ‘దేవదూత’ అని అర్థాన్ని పూర్తిగా నిర్బంధించదు.
- issue: ‘మంచి చెడులను వినడం’ అనే న్యాయపరమైన ప్రయోగం
  choice: విని విచారించడం
  alternative: మంచి చెడులను వివేచించడం
  rationale: ఇది రాజు వాదనలను విని న్యాయంగా నిర్ణయించగల సామర్థ్యాన్ని సూచిస్తుంది. అయితే మూలంలోని ‘విను’ అనే రూపకాన్ని తొలగించకుండా ఉంచడానికి ‘విని విచారించడం’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజును ఉద్దేశించిన వినయపూర్వక ఆస్థానిక ధోరణిని నిలిపేలా అనువదించబడింది. ‘దాసి,’ ‘నా ప్రభువైన రాజు,’ ‘ఉండుగాక’ వంటి రూపాలు గౌరవప్రదంగా ఉన్నా సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
