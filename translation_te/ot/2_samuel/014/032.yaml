source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: te
  text: 'అబ్షాలోము యోవాబుతో ఇలా అన్నాడు: “చూడు, ‘ఇక్కడికి రా. నేను నిన్ను రాజు దగ్గరికి పంపి, “నేను గెషూరు నుండి ఎందుకు వచ్చాను? నేను ఇంకా అక్కడే ఉంటే నాకు మేలు” అని చెప్పిస్తాను’ అంటూ నీకు కబురు పంపాను. ఇప్పుడు నన్ను రాజు ముఖాన్ని చూడనివ్వాలి[a]. నాలో ఏదైనా దోషం ఉంటే[b], ఆయన నన్ను చంపించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రాజు ముఖాన్ని చూడాలి”; అంటే రాజు సన్నిధిలో హాజరు కావాలి.
    reason: lexical_alternative
  - marker: b
    text: “నాలో అపరాధం ఉంటే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడు
  rationale: అబ్షాలోము తన ఫిర్యాదుపై యోవాబు దృష్టిని నిలిపే ఆధునిక, సహజ సంభాషణ సూచకంగా అనువదించబడింది.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: నీకు కబురు పంపాను
  rationale: ఈ సందర్భంలో భౌతిక వస్తువును పంపడం కాక, సందేశం లేదా పిలుపు పంపడమే ఉద్దేశం.
- source_word: בֹּא הֵנָּה
  choice: ఇక్కడికి రా
  rationale: ఆజ్ఞార్థక క్రియతో స్థలసూచక అవ్యయాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: నేను నిన్ను రాజు దగ్గరికి పంపి … చెప్పిస్తాను
  rationale: యోవాబును పిలిపించిన ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, అతడిని రాజు వద్దకు దూతగా పంపే భావాన్ని నిలుపుతుంది.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: నేను గెషూరు నుండి ఎందుకు వచ్చాను?
  rationale: హీబ్రూలోని ప్రథమ పురుష కర్తృవాచ్యాన్ని అలాగే ఉంచి, అబ్షాలోము ప్రస్తుత పరిస్థితిపై చేస్తున్న ఫిర్యాదును వ్యక్తం చేస్తుంది.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: నేను ఇంకా అక్కడే ఉండి ఉంటే నాకు మేలుగా ఉండేది
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది; గెషూరులోనే ఉండడం తనకు మేలని అబ్షాలోము చెప్పిన పోలికను సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ఫిర్యాదు నుండి తదుపరి డిమాండుకు మార్పును సూచిస్తుంది; కారణార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: నేను రాజు ముఖాన్ని చూడాలి
  rationale: రాజు సన్నిధిలో హాజరవడం అనే నుడికారార్థాన్ని కలిగిన మూలభాషా రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: עָוֺן
  choice: దోషం
  rationale: తప్పు, అపరాధబాధ్యత రెండింటినీ సూచించగల పదంగా ఈ న్యాయసంబంధ సందర్భానికి సరిపోతుంది.
- source_word: וֶהֱמִתָנִי
  choice: ఆయన నన్ను చంపించాలి
  rationale: מות హిఫీల్ రూపంలోని ‘మరణింపజేయు’ అనే కారణార్థాన్ని నిలుపుతూ, రాజు అధికారంతో మరణశిక్ష విధించే భావాన్ని అతిగా న్యాయసాంకేతికం చేయకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עָוֺן అనే పదంలో పాపం, దోషం, అపరాధబాధ్యతల మధ్య అర్థవిస్తృతి
  choice: దోషం
  alternative: పాపం / అపరాధం
  rationale: అబ్షాలోము తనపై విచారణ చేసి శిక్షించమనే సవాలు చేస్తున్న సందర్భంలో ‘దోషం’ నైతిక మరియు న్యాయపరమైన భావాలను రెండింటినీ తెరిచి ఉంచుతుంది; నిర్దిష్ట మతపరమైన వ్యాఖ్యానాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలి ఉపయోగించబడింది. మూలంలోని ప్రత్యక్ష ఉద్ధరణల అంతర్నిర్మాణం నిలుపబడింది. ‘రాజు ముఖాన్ని చూడాలి’ అనే హీబ్రూ నుడికారాన్ని పాఠ్యంలో ఉంచి పాదసూచికలో వివరించబడింది; అధ్యాహారమైన పోలిక వాక్యాన్ని సహజ తెలుగులో స్పష్టం చేశారు.
