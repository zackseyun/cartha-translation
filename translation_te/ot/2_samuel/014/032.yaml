  to: 'అబ్షాలోము యోవాబుతో ఇలా అన్నాడు: “చూడు, ‘ఇక్కడికి రా. నేను నిన్ను రాజు దగ్గరికి పంపి, “నేను గెషూరు నుండి ఎందుకు వచ్చాను? నేను ఇంకా అక్కడే ఉంటే నాకు మేలు” అని చెప్పిస్తాను’ అంటూ నీకు కబురు పంపాను. ఇప్పుడు నన్ను రాజు ముఖాన్ని చూడనివ్వాలి[a]. నాలో ఏదైనా దోషం ఉంటే[b], ఆయన నన్ను చంపించాలి.”'
  rationale: కోహార్టేటివ్ అభ్యర్థనను తెలుగులో సహజమైన అనుమతి కోరే రూపంలో సవరించాం. గెషూరులో ఉండడం మేలనే మూలంలోని సంక్షిప్త, అధ్యాహార పోలికను కాపాడేందుకు షరతు వాక్యాన్ని సరళీకరించాం. పాదసూచిక సూచికలు, వాటి వివరణలు సరైన స్థానాల్లో ఉన్నాయి.
