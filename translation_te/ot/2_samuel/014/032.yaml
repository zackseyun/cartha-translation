  naturalness: సంభాషణ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. సవరించిన రూపంలో అంతర్నిర్మిత ఉద్ధరణల సంబంధం, రాజును దర్శించేందుకు అనుమతి కోరుతున్న భావం మరింత సులభంగా అర్థమవుతాయి.
