    rationale: ‘దేవుని దూత జ్ఞానంలాంటి జ్ఞానంతో’ lacks a natural possessive/comparative linkage in Telugu and repeats ‘జ్ఞానం’ awkwardly. A direct idiomatic comparison communicates the Hebrew simile more naturally.
