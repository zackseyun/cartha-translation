base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: te
  text: “ఈ వ్యవహారాన్ని మలుపుతిప్పడానికి[a] మీ సేవకుడైన యోవాబు ఈ పని చేశాడు. అయితే నా ప్రభువు దేవుని దూతవంటి జ్ఞానంతో దేశంలో[b] ఉన్నదంతా తెలుసుకోగలవాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ నుడికారం అక్షరార్థంగా ‘వ్యవహారం ముఖాన్ని తిప్పడం.’ దీన్ని ‘విషయాన్ని మలుపుతిప్పడం’ లేదా ‘విషయం కనిపించే తీరును మార్చడం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమిమీద.’ ఈ సందర్భంలో ఇది మొత్తం ప్రపంచం కంటే రాజ్యం లేదా దేశాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: చేయడానికి
  rationale: ఇక్కడ ఉద్దేశాన్ని తెలిపే ప్రయోజనార్థక ప్రయోగం; తెలుగులో క్రియతో కలిపిన ‘-డానికి’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: ఈ వ్యవహారాన్ని మలుపుతిప్పడానికి
  rationale: ‘వ్యవహారం ముఖాన్ని తిప్పడం’ అనే హెబ్రీ రూపకాన్ని పదక్షరంగా కాకుండా, విషయ గమనాన్ని లేదా కనిపించే తీరును మార్చడం అనే రెండు సంభావ్య భావాలకూ చోటిచ్చే సహజ తెలుగు నుడికారంతో అనువదించబడింది.
- source_word: עַבְדְּךָ יוֹאָב
  choice: మీ సేవకుడైన యోవాబు
  rationale: రాజసభలో రాజును ఉద్దేశించి పలికే వినయపూర్వక సంబోధనను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పని చేశాడు
  rationale: హెబ్రీ వాక్యంలోని సాధారణ క్రియ-కర్మ నిర్మాణాన్ని పునరుక్తి లేకుండా స్పష్టమైన తెలుగులో ఇస్తుంది.
- source_word: וַאדֹנִי חָכָם
  choice: అయితే నా ప్రభువు జ్ఞాని
  rationale: వివరణ నుంచి రాజును ప్రశంసించే మాటకు వచ్చే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ సూచిస్తుంది; חָכָם యొక్క సాధారణ భావాన్ని ‘జ్ఞాని’ నిలుపుతుంది.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూత జ్ఞానంలాంటి జ్ఞానంతో
  rationale: כְּ అనే స్పష్టమైన పోలికను నిలుపుతూ, מלאך האלהים ను తెలుగులో నిర్దిష్టతను బలవంతంగా నిర్ణయించని ‘దేవుని దూత’గా అనువదిస్తుంది.
- source_word: לָדַעַת אֶת כָּל אֲשֶׁר בָּאָרֶץ
  choice: దేశంలో ఉన్నదంతా తెలుసుకోగలవాడు
  rationale: అనంతరూపం ఇక్కడ జ్ఞానసామర్థ్యాన్ని సూచిస్తుంది. రాజ్య సంబంధ సందర్భంలో הָאָרֶץ కు ‘దేశం’ ప్రధాన భావం; విశాలమైన ‘భూమి’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ‘దేవుని దూత’తో దావీదు జ్ఞానానికి చేసిన పోలిక
  choice: అసాధారణ వివేచనను ప్రశంసించే పోలికగా అనువదించడం
  alternative: దావీదుకు దేవునితో సమానమైన లేదా సర్వజ్ఞతతో కూడిన జ్ఞానం ఉందనే బలమైన వాదనగా చదవడం
  rationale: మూలంలో పోలిక మాత్రమే ఉంది. దావీదు స్వభావం లేదా సర్వజ్ఞత గురించి అదనపు సిద్ధాంతార్థం చేర్చకుండా రాజసభకు తగిన అతిశయోక్తితో కూడిన ప్రశంసను నిలుపుతుంది.
- issue: מַלְאַךְ הָאֱלֹהִים యొక్క నిర్దిష్టత
  choice: దేవుని దూత
  alternative: ఆ దేవదూత లేదా ఒక దేవదూత
  rationale: హెబ్రీ నిర్మాణం దేవునికి చెందిన దూతను సూచిస్తుంది; తెలుగులో ఉపపదాలు లేనందున ‘దేవుని దూత’ అనే రూపం ఒక నిర్దిష్ట దూతనా, సాధారణ పోలికనా అన్న విషయాన్ని అవసరం లేకుండా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభ శైలిని నిలిపాం. ‘ప్రభువు,’ ‘సేవకుడు’ వంటి పదాలు సందర్భానుసార వినయాన్ని అందిస్తాయి; మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంచాం.
