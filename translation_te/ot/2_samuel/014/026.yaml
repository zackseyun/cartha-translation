  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: te
  text: అతడు తన తల వెంట్రుకలను కత్తిరించుకున్నప్పుడు—అవి అతనికి బరువుగా ఉండడం వల్ల ప్రతి సంవత్సరం చివర్లో వాటిని కత్తిరించుకునేవాడు—అతడు తన తల వెంట్రుకలను తూచేవాడు; రాజు తూనికరాయి ప్రమాణం ప్రకారం వాటి బరువు రెండువందల షెకెలులు ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రాజు రాయి ప్రకారం”; ఇది రాజ ప్రమాణంగా ఉపయోగించే తూనికరాయిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: అతడు తన తలవెంట్రుకలను కత్తిరించుకునేటప్పుడు
  rationale: גלח ఇక్కడ సందర్భానుసారం పూర్తిగా గొరిగించడంకన్నా వెంట్రుకలను కత్తిరించడాన్ని సూచిస్తుంది. בְּ + infinitive construct కాలసంబంధమైన, పునరావృత చర్యను పరిచయం చేస్తుంది.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים אֲשֶׁר יְגַלֵּחַ
  choice: ప్రతి సంవత్సరం చివరలో వాటిని కత్తిరించుకునేవాడు
  rationale: ఈ హీబ్రూ ప్రయోగం క్రమంగా తిరిగి వచ్చే కాలాంతాన్ని సూచిస్తుంది; కథాసందర్భంలో వార్షిక అలవాటును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי־כָבֵד עָלָיו
  choice: అవి అతనికి బరువుగా ఉండేవి కాబట్టి
  rationale: మూలంలోని ‘అతనిమీద బరువుగా’ అనే చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతూ, సూచించబడిన కర్త వెంట్రుకలేనని స్పష్టం చేస్తుంది.
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: కత్తిరించుకున్న వెంట్రుకలను తూచేవాడు
  rationale: సందర్భంలోని అలవాటైన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; שְׂעַר רֹאשׁוֹ యొక్క భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מָאתַיִם שְׁקָלִים
  choice: రెండువందల షెకెలుల బరువు
  rationale: షెకెలు ఇక్కడ నాణెం కాక బరువు ప్రమాణం; ‘బరువు’ చేర్చడం ఆధునిక పాఠకునికి అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: రాజ తూనిక ప్రకారం
  rationale: אֶבֶן అక్షరార్థంగా ‘రాయి’; ఇక్కడ రాజ ప్రమాణంగా ఉపయోగించిన తూనికరాయిని సూచిస్తుంది. ప్రధాన పాఠ్యంలో భావాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
