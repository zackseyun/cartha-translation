    rationale: אֶבֶן అక్షరార్థంగా ‘రాయి’; ఇక్కడ ప్రమాణ తూనికరాయిని సూచిస్తుంది. ప్రధాన పాఠ్యంలో దీనిని పేర్కొనడం వల్ల పాదసూచికపై మాత్రమే ఆధారపడకుండా మూలభావం నిలుస్తుంది.
