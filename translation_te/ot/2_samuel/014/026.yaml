  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని పునరావృత చర్యను ‘కత్తిరించుకునేవాడు,’ ‘తూచేవాడు’ రూపాలతో వ్యక్తం చేసింది. ‘షెకెలు’ను చారిత్రక బరువు ప్రమాణంగా అలాగే ఉంచి వివరణను వాక్యంలోనూ పాదసూచికలోనూ స్పష్టం చేసింది.
