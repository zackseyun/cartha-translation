translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అరికాలి నుండి నడినెత్తి వరకు’ అనే శరీరసంబంధ సమగ్ర వ్యక్తీకరణను, అలాగే మూలంలోని ప్రశంస భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపాం.
