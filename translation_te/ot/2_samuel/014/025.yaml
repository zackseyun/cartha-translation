  text: וּ/כְ/אַבְשָׁל֗וֹם לֹא הָיָ֧ה אִישׁ יָפֶ֛ה בְּ/כָל יִשְׂרָאֵ֖ל לְ/הַלֵּ֣ל מְאֹ֑ד מִ/כַּ֤ף רַגְל/וֹ֙ וְ/עַ֣ד קָדְקֳד֔/וֹ לֹא הָ֥יָה ב֖/וֹ מֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/025.yaml
  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: te
  text: ఇశ్రాయేలు అంతటిలో అబ్షాలోమంత అందగాడూ, అంతగా ప్రశంసించబడినవాడూ మరొకడు లేడు.[a] అరికాలు నుండి తల నడినెత్తి వరకు అతనిలో ఏ శారీరక లోపమూ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంతో ప్రశంసనీయమైనవాడు.’ హెబ్రీ పదబంధం ప్రశంస యొక్క అసాధారణ స్థాయిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: అబ్షాలోమంత
  rationale: כְּ యొక్క పోలిక భావాన్ని సహజమైన తెలుగు తులనాత్మక నిర్మాణంతో వ్యక్తం చేస్తుంది; వచనంలో లేని కాలసూచకమైన ‘ఇప్పుడు’ను చేర్చదు.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అంతటిలో ... అందగాడు మరొకడు లేడు
  rationale: ఇది అబ్షాలోముతో సాటిలేని అందాన్ని తెలిపే అతిశయార్థక పోలిక. పురుషుని రూపాన్ని వర్ణించే ఆధునిక, సహజమైన పదంగా ‘అందగాడు’ను ఎంచుకున్నాం.
- source_word: לְהַלֵּל מְאֹד
  choice: అతనికి ఎంతో ప్రశంస లభించింది
  rationale: అతనికి లభించిన ప్రశంస యొక్క అసాధారణ స్థాయిని సహజమైన తెలుగులో తెలియజేస్తుంది; కర్తను మూలపాఠం పేర్కొననందున ‘అందరూ’ వంటి కర్తను చేర్చలేదు.
- source_word: מִכַּף רַגְלוֹ וְעַד קָדְקֳדוֹ
  choice: అరికాలి నుండి నడినెత్తి వరకు
  rationale: పాదం అడుగుభాగం నుండి తల పైభాగం వరకు అనే సంపూర్ణ శరీరాన్ని సూచించే ద్వంద్వ సరిహద్దు వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: అతనిలో ఏ లోపమూ లేదు
  rationale: מוּם ఇక్కడ శారీరక లోపాన్ని సూచిస్తుంది. ‘లోపం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని శారీరక పరిపూర్ణత భావాన్ని కాపాడుతుంది.
