translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభకు తగిన గౌరవభరిత శైలి వాడబడింది. ‘నీ దాసి’ అనే స్త్రీలింగ రూపం మూలంలోని సామాజిక వినయసూత్రాన్ని స్పష్టంగా నిలుపుతుంది; అందువల్ల పాదసూచిక అవసరం లేదు.
