source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה תְּדַבֶּר נָ֧א שִׁפְחָתְ/ךָ֛ אֶל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֖אמֶר דַּבֵּֽרִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/012.yaml
  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ, “మీ దాసి నా ప్రభువైన రాజుకు ఒక మాట మాట్లాడనివ్వండి” అంది. అందుకు అతడు, “మాట్లాడు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో రాజుతో మాట్లాడుతున్న స్త్రీనే సూచిస్తుంది; నిర్దిష్ట సూచనను తెలుగులో ‘ఆ స్త్రీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּדַבֶּר נָא
  choice: చెప్పడానికి దయచేసి అనుమతించు
  rationale: అసంపూర్ణ క్రియారూపంతో కూడిన נָא రాజును ఉద్దేశించిన వినయపూర్వక అభ్యర్థనను సూచిస్తుంది.
- source_word: שִׁפְחָתְךָ
  choice: నీ దాసి
  rationale: హీబ్రూ పదంలోని స్త్రీలింగాన్ని, రాజసభలోని వినయపూర్వక స్వీయసంబోధనను నేరుగా నిలుపుతుంది.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుతో
  rationale: אדון ఇక్కడ దేవుని బిరుదు కాదు, మానవ రాజుకు గౌరవసూచక సంబోధన. ‘నా ప్రభువైన రాజు’ ఆ గౌరవాన్ని నిలుపుతుంది.
- source_word: דָּבָר
  choice: ఒక మాట
  rationale: హీబ్రూ పదానికి ‘మాట/విషయం’ అనే అర్థాలు ఉన్నాయి; సంక్షిప్త వినయపూర్వక ప్రయోగాన్ని ‘ఒక మాట’ పారదర్శకంగా నిలుపుతుంది.
- source_word: וַיֹּאמֶר
  choice: అందుకు అతడు ... అన్నాడు
  rationale: రాజు ఇచ్చిన ప్రత్యుత్తరాన్ని సహజమైన తెలుగు సంభాషణ క్రమంలో పరిచయం చేస్తుంది.
- source_word: דַּבֵּרִי
  choice: చెప్పు
  rationale: స్త్రీని ఉద్దేశించిన ప్రత్యక్ష ఆజ్ఞ; అదనపు భావాన్ని చేర్చకుండా సంక్షిప్తంగా అనువదిస్తుంది.
