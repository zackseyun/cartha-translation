translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజును ఉద్దేశించిన గౌరవార్థక బహువచనాన్ని వాడారు. ‘సాష్టాంగపడి’ మరియు ‘వంగి నమస్కరించి’ అనే వరుస ప్రయోగాలు మూలంలోని రెండు వేర్వేరు క్రియలను నిలుపుతాయి.
