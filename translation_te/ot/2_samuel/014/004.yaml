source:
  edition: WLC
  text: וַ֠/תֹּאמֶר הָ/אִשָּׁ֤ה הַ/תְּקֹעִית֙ אֶל הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֧ל עַל אַפֶּ֛י/הָ אַ֖רְצָ/ה וַ/תִּשְׁתָּ֑חוּ וַ/תֹּ֖אמֶר הוֹשִׁ֥עָ/ה הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: te
  text: అప్పుడు తెకోవకు చెందిన ఆ స్త్రీ రాజుతో మాట్లాడింది.[a] ఆమె ముఖం నేలకు ఆనేటట్లు పడిపోయి, నమస్కరించింది; అప్పుడు ఆమె, “రాజా, నన్ను రక్షించండి!”[b] అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “తెకోవీయురాలైన స్త్రీ.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “రక్షించు, రాజా”; సందర్భానుసారంగా సూచిత కర్మను తెలుగులో “నన్ను” అని స్పష్టపరచారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: తెకోవకు చెందిన ఆ స్త్రీ
  rationale: హీబ్రూ విశేషణ రూపం ఆమె తెకోవ ప్రాంతానికి చెందినదని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: రాజుతో మాట్లాడింది
  rationale: אָמַר సాధారణంగా ‘చెప్పు’ అని అర్థమైనా, రాజును మొదట సంబోధించిన సందర్భంలో ‘మాట్లాడింది’ సహజంగా ఉంటుంది; తరువాతి ప్రత్యక్ష వాక్యానికి ‘అని వేడుకుంది’ వాడటం సందర్భంలోని అభ్యర్థన స్వరాన్ని తెలియజేస్తుంది.
- source_word: וַתִּפֹּל עַל אַפֶּיהָ אַרְצָה
  choice: సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడటాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; లోతైన వినయపూర్వక విన్నప భంగిమను కాపాడుతుంది.
- source_word: וַתִּשְׁתָּחוּ
  choice: నేలవరకు వంగి నమస్కరించి
  rationale: ఈ క్రియ గౌరవంతో వంగడం లేదా ప్రణమిల్లడాన్ని సూచిస్తుంది. ఆరాధన అనే ప్రత్యేక మతార్థాన్ని రుద్దకుండా రాజు ఎదుట చూపిన గౌరవాన్ని వ్యక్తం చేస్తుంది.
- source_word: הוֹשִׁיעָה
  choice: నన్ను రక్షించండి
  rationale: యָשַׁע ధాతువు నుంచి వచ్చిన ఆజ్ఞార్థక రూపం రక్షణ కోసం అత్యవసర విన్నపం. హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భంలో విన్నపకర్తే ఉద్దేశిత కర్మ; తెలుగులో దాన్ని స్పష్టపరచడం సహజం.
- source_word: הַמֶּלֶךְ
  choice: రాజా
  rationale: ప్రత్యక్ష సంబోధనకు సహజమైన తెలుగు సంబోధన రూపం; గౌరవభరితమైన, అత్యవసర విన్నప స్వరాన్ని నిలుపుతుంది.
