    text: లేదా, మరింత అక్షరార్థంగా, “తెకోవీయురాలైన స్త్రీ.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “రక్షించు, రాజా”; సందర్భానుసారంగా సూచిత కర్మను తెలుగులో “నన్ను” అని స్పష్టపరచారు.
    reason: lexical_alternative
