revisions:
- from: అప్పుడు తెకోవకు చెందిన ఆ స్త్రీ రాజుతో మాట్లాడింది.[a] ఆమె సాష్టాంగపడి, నేలవరకు వంగి నమస్కరించి, “రాజా, నన్ను రక్షించండి!”[b] అని వేడుకుంది.
  to: అప్పుడు తెకోవకు చెందిన ఆ స్త్రీ రాజుతో మాట్లాడింది.[a] ఆమె ముఖం నేలకు ఆనేటట్లు పడిపోయి, నమస్కరించింది; అప్పుడు ఆమె, “రాజా, నన్ను రక్షించండి!”[b] అంది.
