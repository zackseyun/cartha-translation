  yaml_path: translation/ot/2_samuel/014/028.yaml
  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: te
  text: అలా అబ్షాలోము యెరూషలేములో నిండు రెండు సంవత్సరాలు నివసించాడు; అతడు రాజు ముఖాన్ని చూడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు రాజు ముఖాన్ని చూడలేదు.” ఈ హీబ్రూ నుడికారం అబ్షాలోముకు రాజును ప్రత్యక్షంగా కలుసుకునే అవకాశం లేదా రాజు సన్నిధిలోకి ప్రవేశం లభించలేదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב అనే క్రియకు ‘కూర్చున్నాడు, నివసించాడు, ఉండిపోయాడు’ అనే అర్థాలున్నాయి. ఒక పట్టణంలో రెండేళ్లపాటు కొనసాగిన నివాసాన్ని ఈ సందర్భంలో ‘నివసించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థానార్థక בְּ ఉపసర్గను తెలుగు విభక్తి ‘లో’తో సహజంగా వ్యక్తం చేశాం; స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపాన్ని వాడాం.
- source_word: שְׁנָתַיִם יָמִים
  choice: నిండు రెండు సంవత్సరాలు
  rationale: అక్షరార్థంగా ‘రెండు సంవత్సరాలు, రోజులు’ అనే ఈ హీబ్రూ కాలవ్యక్తీకరణ పూర్తిగా గడిచిన రెండేళ్ల వ్యవధిని సూచిస్తుంది. ‘నిండు’ ఆ నుడికార బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּפְנֵי הַמֶּלֶךְ
  choice: రాజు ముఖాన్ని
  rationale: అక్షరార్థమైన ‘రాజు ముఖం’ అనే స్పష్టమైన హీబ్రూ చిత్రణను నిలిపాం. ఇది రాజును ప్రత్యక్షంగా కలుసుకోవడం లేదా ఆయన సన్నిధికి ప్రవేశం పొందడం అనే నుడికారార్థాన్ని కలిగి ఉంది.
- source_word: לֹא רָאָה
  choice: చూడలేదు
  rationale: హీబ్రూ నిషేధాత్మక క్రియను నేరుగా, సహజంగా అనువదించాం; ‘ఎప్పుడూ చూడలేదు’ అని మూలంలో లేని సంపూర్ణ నిషేధ భావాన్ని చేర్చలేదు.
