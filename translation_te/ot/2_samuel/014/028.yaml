translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు సమన్విత భాగాలను అర్ధవిరామంతో స్పష్టంగా ఉంచాం. ‘రాజు ముఖం’ అనే మూలభాషా చిత్రణను ప్రధాన పాఠ్యంలో నిలిపి, దాని నుడికారార్థాన్ని పాదటిప్పణిలో వివరించాం.
