  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: te
  text: అప్పుడు రాజు, “నీతో మాట్లాడే ఎవరినైనా నా దగ్గరికి తీసుకురా; అతడు ఇక ఎన్నడూ నిన్ను తాకడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఇకపై నిన్ను తాకడు.” ఇక్కడి హీబ్రూ ప్రయోగం కేవలం శారీరక స్పర్శను మాత్రమే కాక, శత్రుత్వంతో తాకడం లేదా హాని చేయడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట రూపంలోని מֶלֶךְకు సందర్భానుసారమైన సహజ తెలుగు రూపం.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: నీతో మాట్లాడేవాణ్ణి
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం ‘నీతో మాట్లాడే వ్యక్తి’ అని నామవాచకార్థంలో పనిచేస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: నా దగ్గరికి తీసుకురా
  rationale: בוא హిఫీల్ రూపం ‘రప్పించు/తీసుకురా’ అనే కారక భావాన్ని ఇస్తుంది; ప్రత్యక్ష ఆజ్ఞకు ‘తీసుకురా’ సహజం.
- source_word: לֹא יֹסִיף עוֹד
  choice: ఇక ఎన్నడూ ...డు
  rationale: יסף మరియు עוד కలయిక మరలా జరగకపోవడాన్ని బలంగా వ్యక్తం చేస్తుంది; తెలుగులో ‘ఇక ఎన్నడూ’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לָגַעַת בָּךְ
  choice: నిన్ను తాకడు
  rationale: נגע యొక్క ప్రాథమిక అర్థమైన ‘తాకు’ను ప్రధాన పాఠ్యంలో నిలిపి, ఈ సందర్భంలో ఉండగల హాని చేసే భావాన్ని పాదటిప్పణిలో సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘తాకు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
