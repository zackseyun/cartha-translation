reference: 2 Samuel 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב הִנֵּה נָ֥א עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֵ֛ךְ הָשֵׁ֥ב אֶת הַ/נַּ֖עַר אֶת אַבְשָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: te
  text: 'అప్పుడు రాజు యోవాబుతో ఇలా అన్నాడు: “చూడు, నేను ఇప్పుడు ఈ విషయం చేశాను.[a] వెళ్లి, ఆ యువకుడైన అబ్షాలోమును తిరిగి తీసుకురా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడు, నేను ఈ మనవిని అంగీకరించాను.” హెబ్రీలో అక్షరార్థంగా, “నేను ఈ విషయం చేశాను” అని ఉంది.
    reason: సందర్భం రాజు యోవాబు మనవిని అంగీకరించాడని సూచిస్తుంది; అయితే హెబ్రీ పదబంధం విస్తృతంగా ఉండటం వల్ల ప్రధాన పాఠ్యంలో దానికి దగ్గరైన రూపాన్ని ఉంచి, సందర్భానుగుణమైన ప్రత్యామ్నాయాన్ని ఇక్కడ ఇచ్చాం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הִנֵּה נָא
  choice: ఇదిగో, ఇప్పుడు
  rationale: הִנֵּה శ్రద్ధను ఆకర్షిస్తుంది; נָא మాటను మృదువుచేయడం లేదా తక్షణతను సూచిస్తుంది. ఈ రెండింటి సంభాషణాత్మక బలాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: నేను ఈ పని చేశాను
  rationale: ఇది హెబ్రీ వాక్యానికి సమీపమైన అనువాదం. సందర్భంలో యోవాబు మనవిని రాజు అంగీకరించాడనే భావం ఉన్నా, మూలంలోని విస్తృతమైన మాటను ప్రధాన పాఠ్యంలో అలాగే ఉంచాం.
- source_word: וְלֵךְ
  choice: వెళ్లి
  rationale: సంయోజకంతో కూడిన ఆజ్ఞను తెలుగులో సహజంగా తరువాతి ఆజ్ఞతో కలుపుతుంది.
- source_word: הָשֵׁב
  choice: తిరిగి తీసుకురా
  rationale: 'שׁוב క్రియ యొక్క హిఫీల్ రూపం కారణార్థకంగా ఉంది: యోవాబు అబ్షాలోము తిరిగి వచ్చేలా చేయాలి. ‘తిరిగి తీసుకురా’ ఆ భావాన్ని స్పష్టంగా తెలుపుతుంది.'
- source_word: הַנַּעַר
  choice: ఆ యువకుడు
  rationale: נַעַר సందర్భానుసారం బాలుడు, యువకుడు లేదా సేవకుడు అని అర్థమవుతుంది. అబ్షాలోము వయోజనుడైన కుమారుడు కావడంతో ‘యువకుడు’ గౌరవాన్నీ వయస్సుకు సంబంధించిన సాపేక్ష భావాన్నీ నిలుపుతుంది.
- source_word: אֶת אַבְשָׁלוֹם
  choice: అబ్షాలోమును
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చి, ‘ఆ యువకుడు’ తరువాత మూలంలోని నిర్దిష్టీకరణను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. రాజును వ్యక్తిపేరుతో మార్చకుండా మూలంలోని బిరుదునే ఉంచాం; ఆజ్ఞల సంక్షిప్తతను కూడా కాపాడాం.
