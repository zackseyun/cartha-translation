translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా పొలం’ అనే పదాన్ని జోడించడం ద్వారా భూమికి ఆనుకొని ఉన్నదనే హెబ్రీ నుడికార భావం స్పష్టమవుతుంది; ఇది సందర్భస్పష్టీకరణ మాత్రమే. వ్యక్తి పేర్లకు తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన ‘అబ్షాలోము,’ ‘యోవాబు’ రూపాలు ఉపయోగించబడ్డాయి.
