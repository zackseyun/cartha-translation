  text: וַ/יֹּ֨אמֶר אֶל עֲבָדָ֜י/ו רְאוּ֩ חֶלְקַ֨ת יוֹאָ֤ב אֶל יָדִ/י֙ וְ/ל/וֹ שָׁ֣ם שְׂעֹרִ֔ים לְכ֖וּ ו/הוצתי/ה בָ/אֵ֑שׁ וַ/יַּצִּ֜תוּ עַבְדֵ֧י אַבְשָׁל֛וֹם אֶת הַ/חֶלְקָ֖ה בָּ/אֵֽשׁ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: te
  text: అప్పుడు అబ్షాలోము తన సేవకులతో, “చూడండి, యోవాబు పొలం నా పొలం పక్కనే ఉంది; అందులో అతనికి యవలు ఉన్నాయి. వెళ్లి దానికి నిప్పంటించండి” అన్నాడు. అప్పుడు అబ్షాలోము సేవకులు ఆ పొలానికి నిప్పంటించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקַת
  choice: పొలం
  rationale: ఈ వ్యవసాయ సందర్భంలో ఈ పదం యోవాబుకు చెందిన సాగుభూమిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పొలం’ సహజమైన సమానార్థకం.
- source_word: אֶל יָדִי
  choice: నా పొలం పక్కనే
  rationale: అక్షరార్థంగా ‘నా చేతి దగ్గర’ అయినా, భూముల వర్ణనలో ఇది ఆనుకొని లేదా పక్కన ఉండటాన్ని సూచించే నుడికారం. సందర్భాన్ని స్పష్టంచేయడానికి ‘నా పొలం పక్కనే’ అని అనువదించబడింది.
- source_word: שְׂעֹרִים
  choice: యవలు
  rationale: ఇది పొలంలో పండుతున్న barley పంటను సూచించే బహువచన నామవాచకం; ప్రామాణిక తెలుగులో ‘యవలు’ తగిన పదం.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: దానికి నిప్పంటించండి / ఆ పొలానికి నిప్పంటించారు
  rationale: హిఫీల్ రూపం మంట పెట్టడం లేదా అంటించడం అనే కారక భావాన్ని తెలియజేస్తుంది. ఆజ్ఞలోను, దాని అమలులోను ఒకే క్రియను వాడడం మూలంలోని పదసామ్యాన్ని కాపాడుతుంది.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: తన సేవకులు / అబ్షాలోము సేవకులు
  rationale: עבד అనే పదం దాసులను లేదా సేవకులను సూచించగలదు. ఇక్కడ రాజకుటుంబ సంబంధమైన కథన సందర్భం బానిసత్వ స్థితిని ప్రత్యేకంగా ముందుకు తేవడం లేదు కాబట్టి ‘సేవకులు’ సముచితం.
- source_word: רְאוּ
  choice: చూడండి
  rationale: సమీపంలోని పొలంపై సేవకుల దృష్టిని నిలిపే సహజమైన తెలుగు ఆజ్ఞారూపం.
- source_word: לְכוּ
  choice: వెళ్లి
  rationale: నిప్పంటించే ఆజ్ఞకు ముందు వచ్చే గమన ఆజ్ఞను తెలుగులో సహజంగా సంయుక్త క్రియారూపంలో వ్యక్తం చేస్తుంది.
