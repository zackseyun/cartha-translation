translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘నూనె రాసుకోవద్దు’ వంటి సాధారణ పదప్రయోగంతో ప్రాచీన ఆచారాన్ని అర్థమయ్యేలా ఉంచాం. మూలంలోని ‘దుఃఖించు’ అనే క్రియకు సందర్భం ఇచ్చే నటన భావాన్ని ప్రధాన పాఠ్యంలో చూపించి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
