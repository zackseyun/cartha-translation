source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יוֹאָב֙ תְּק֔וֹעָ/ה וַ/יִּקַּ֥ח מִ/שָּׁ֖ם אִשָּׁ֣ה חֲכָמָ֑ה וַ/יֹּ֣אמֶר אֵ֠לֶי/הָ הִֽתְאַבְּלִי נָ֞א וְ/לִבְשִׁי נָ֣א בִגְדֵי אֵ֗בֶל וְ/אַל תָּס֨וּכִי֙ שֶׁ֔מֶן וְ/הָיִ֕ית כְּ/אִשָּׁ֗ה זֶ֚ה יָמִ֣ים רַבִּ֔ים מִתְאַבֶּ֖לֶת עַל מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: te
  text: అప్పుడు యోవాబు తెకోవకు ఒకరిని పంపి, అక్కడి నుండి జ్ఞానవంతురాలైన ఒక స్త్రీని తీసుకువచ్చాడు. అతడు ఆమెతో, “దయచేసి దుఃఖంలో ఉన్నట్లు నటించు;[a] దుఃఖవస్త్రాలు ధరించు.[b] నూనె రాసుకోవద్దు.[c] చనిపోయిన ఒక వ్యక్తి కోసం అనేక రోజులుగా దుఃఖిస్తున్న స్త్రీలా ఉండు”[d] అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుఃఖించు” / “దుఃఖించే వ్యక్తిలా ప్రవర్తించు.” హీబ్రూ క్రియకు “దుఃఖించు” అని అర్థం; అయితే యోవాబు వేసిన పథకంలో ఆమె దుఃఖిస్తున్నట్లు కనిపించాలనే భావం సందర్భం ద్వారా తెలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దుఃఖపు వస్త్రాలు.”
    reason: lexical_alternative
  - marker: c
    text: నూనె రాసుకోకుండా ఉండడం సాధారణ శరీర సంరక్షణకు, ఉల్లాసానికి భిన్నంగా దుఃఖాన్ని సూచించే ఆచారం.
    reason: cultural_note
  - marker: d
    text: అక్షరార్థంగా, “చనిపోయిన వ్యక్తి కోసం అనేక రోజులుగా దుఃఖిస్తున్న స్త్రీలా ఉండు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: తెకోవ
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: אִשָּׁה חֲכָמָה
  choice: జ్ఞానవంతురాలైన ఒక స్త్రీ
  rationale: חֲכָמָה అనే పదంలోని జ్ఞానం, నేర్పు అనే విస్తృత భావాన్ని నిలుపుతుంది; సందర్భం ఆమె చాకచక్యాన్ని సూచించినా దానిని పాఠ్యంలో అతిగా నిర్దిష్టం చేయలేదు.
- source_word: הִתְאַבְּלִי נָא
  choice: దయచేసి నీవు దుఃఖిస్తున్నదానిలా నటించి
  rationale: క్రియకు ప్రాథమికంగా ‘దుఃఖించు’ అనే అర్థం ఉంది; అయితే యోవాబు రూపొందించిన ప్రదర్శనలో దుఃఖించే వ్యక్తి రూపాన్ని ధరించమనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וְלִבְשִׁי נָא בִגְדֵי אֵבֶל
  choice: దుఃఖవస్త్రాలు ధరించు
  rationale: ‘దుఃఖపు వస్త్రాలు’ అనే హీబ్రూ పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: నూనె రాసుకోవద్దు
  rationale: సוך అనే క్రియ శరీరానికి నూనె పూసుకోవడాన్ని సూచిస్తుంది; ‘అభిషేకించుకోవద్దు’ కంటే ఇది సాధారణ అలంకరణ/శరీర సంరక్షణ సందర్భాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָיִית כְּאִשָּׁה
  choice: స్త్రీలా కనిపించు
  rationale: అక్షరార్థమైన ‘స్త్రీలా ఉండు’ కంటే, ఆమె ప్రదర్శించవలసిన బాహ్య రూపం మరియు ప్రవర్తనను సందర్భానుగుణంగా తెలుగులో తెలియజేస్తుంది.
- source_word: זֶה יָמִים רַבִּים
  choice: చాలాకాలంగా
  rationale: ‘ఇవి అనేక దినాలు’ అనే హీబ్రూ కాలవ్యవధి నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: מִתְאַבֶּלֶת עַל מֵת
  choice: చనిపోయినవారి కోసం దుఃఖిస్తున్న
  rationale: కొనసాగుతున్న దుఃఖస్థితిని తెలియజేస్తుంది; హీబ్రూ అనిర్దిష్ట ఏకవచనం సాధారణ భావంలో ఉన్నందున తెలుగులో గౌరవ/సామాన్య రూపమైన ‘చనిపోయినవారి’ని వాడాం.
