source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: te
  text: ఎందుకంటే మనమందరం తప్పక చనిపోతాం; నేలమీద పారబోసిన, తిరిగి పోగుచేయలేని నీళ్లలా ఉన్నాం. అయినా దేవుడు ప్రాణాన్ని తీసివేయడు[a]; ఆయననుండి బహిష్కరించబడినవాడు బహిష్కృతుడిగానే ఉండిపోకుండా ఆయన ప్రణాళికలు వేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ఒక వ్యక్తిపట్ల పక్షపాతం చూపడు.” ఈ హీబ్రూ వాక్యభాగం అర్థం చేసుకోవడం కష్టం; దీనిని వేరే విధంగానూ గ్రహిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “బహిష్కరించబడినవాడు ఆయననుండి దూరం చేయబడకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి విజ్ఞప్తికి ఈ మాట కారణాన్ని అందిస్తున్నందున హీబ్రూ వాదనాత్మక అనుసంధానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מוֹת נָמוּת
  choice: మనమందరం తప్పక చనిపోతాం
  rationale: క్రియార్థక నామం + అసంపూర్ణ క్రియ నిర్మాణం మరణ నిశ్చయాన్ని బలపరుస్తుంది; ‘తప్పక’ ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది. సందర్భానుసారంగా అంతర్నిహితమైన సమగ్ర భావాన్ని ‘మనమందరం’ స్పష్టం చేస్తుంది.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: నేలమీద ఒలికిపోయిన నీళ్లలా
  rationale: ‘ఒలికిపోయిన’ అనే రూపం నేలపై పారబోసిన నీరు తిరిగి పొందలేని దృశ్యాన్ని సజీవంగా, సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: మళ్లీ సమకూర్చలేని
  rationale: నిఫాల్ రూపంలోని తిరిగి సేకరించబడకపోవడం లేదా సాధ్యంకాకపోవడం అనే భావాన్ని, నీటి ఉపమానానికి సరిపోయే విధంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: అయినా దేవుడు ప్రాణాన్ని తీసివేయడు
  rationale: కఠినమైన ఈ పదబంధాన్ని మరణం–పునరుద్ధరణ సందర్భంలో ‘ప్రాణం తీసివేయడం’గా గ్రహించాం. ‘అయినా’ మానవ మరణ అనివార్యతకు దేవుని చర్యకు మధ్య వ్యత్యాసాన్ని చూపుతుంది; ఇతర సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: ఉపాయాలు ఆలోచిస్తాడు
  rationale: ఒకే మూలానికి చెందిన నామ–క్రియా నిర్మాణంలోని ఉద్దేశపూర్వక ప్రణాళిక భావాన్ని సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: לְבִלְתִּי יִדַּח
  choice: బహిష్కృతుడిగానే ఉండిపోకుండా
  rationale: נדח నిఫాల్‌లోని దూరం చేయబడటం లేదా బహిష్కరించబడటం అనే స్థితినీ, అది కొనసాగకుండా చేయాలనే ఉద్దేశాన్నీ కాపాడుతుంది.
- source_word: מִמֶּנּוּ נִדָּח
  choice: తన దగ్గరనుంచి బహిష్కరించబడినవాడు
  rationale: సంక్షిప్త హీబ్రూ పదక్రమాన్ని తెలుగులో వ్యక్తిగత సంబంధం స్పష్టంగా ఉండేలా అమర్చింది; ‘తన’ అనే సర్వనామం హీబ్రూలోని సూచనాత్మక అస్పష్టతను పూర్తిగా తొలగించదు.
theological_decisions:
- issue: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ యొక్క అర్థం
  choice: దేవుడు ప్రాణాన్ని తీసివేయడు
  alternative: దేవుడు ఒక వ్యక్తిపట్ల పక్షపాతం చూపడు
  rationale: మరణం తిరుగులేనిదనే ఉపమానం తరువాత బహిష్కృతుని పునరుద్ధరించడానికి దేవుడు ఉపాయాలు ఆలోచిస్తాడనే ప్రవాహంలో ‘ప్రాణాన్ని తీసివేయడు’ అనేది సందర్భానికి బాగా సరిపోతుంది. అయినప్పటికీ హీబ్రూ పదబంధం కఠినమైనది కాబట్టి పక్షపాతం గురించిన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: מִמֶּנּוּ లోని సర్వనామ సూచన
  choice: తన దగ్గరనుంచి
  alternative: ఆయన దగ్గరనుంచి / అతని దగ్గరనుంచి
  rationale: సందర్భంలో ఇది దేవునికి లేదా రాజుకు అన్వయించే ప్రతిరూపాత్మక ప్రతిధ్వనిని కలిగి ఉండవచ్చు. ‘తన’ మూలంలోని మూడవ పురుష సూచనను నిలుపుతూ తెలుగులో అతిగా నిర్ధారించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘బహిష్కరించబడినవాడు/బహిష్కృతుడు’ సందర్భంలోని రాజదర్బారు మరియు సంబంధ విరహ భావాలను కాపాడుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
