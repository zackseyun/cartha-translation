revisions:
- from: ఎందుకంటే మనమందరం తప్పక చనిపోతాం; నేలమీద ఒలికిపోయి, మళ్లీ సమకూర్చలేని నీళ్లలా ఉన్నాం. అయినా దేవుడు ప్రాణాన్ని తీసివేయడు[a]; తన దగ్గరనుంచి బహిష్కరించబడినవాడు బహిష్కృతుడిగానే ఉండిపోకుండా ఆయన ఉపాయాలు ఆలోచిస్తాడు[b].
  to: ఎందుకంటే మనమందరం తప్పక చనిపోతాం; నేలమీద పారబోసిన, తిరిగి పోగుచేయలేని నీళ్లలా ఉన్నాం. అయినా దేవుడు ప్రాణాన్ని తీసివేయడు[a]; ఆయననుండి బహిష్కరించబడినవాడు బహిష్కృతుడిగానే ఉండిపోకుండా ఆయన ప్రణాళికలు వేస్తాడు[b].
  rationale: The revision retains the draft’s adopted reading of the disputed divine-action clause and preserves its alternative in footnote a. It improves the water image, makes the final relation to God unambiguous in idiomatic Telugu, and removes the unsupported comparative wording from footnote b.
