  yaml_path: translation/ot/2_samuel/014/008.yaml
  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: te
  text: అప్పుడు రాజు ఆ స్త్రీతో, “నీ ఇంటికి వెళ్లు; నీ విషయంలో నేను ఆజ్ఞలు ఇస్తాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ కోసం ఆజ్ఞ ఇస్తాను” / “నీ పక్షంగా ఆదేశాలు ఇస్తాను.” హీబ్రూ ఉపసర్గను ఒకటికంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు; రాజు ఆమె వ్యవహారానికి సంబంధించి ఆదేశాలు జారీ చేస్తాడనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భానుగుణమైన సూటి అనువాదం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీతో
  rationale: సందర్భంలో తెకోవకు చెందిన స్త్రీని సూచిస్తుంది; ఇక్కడ ‘భార్య’ అనే అర్థం తగదు.
- source_word: לְכִי
  choice: వెళ్లు
  rationale: స్త్రీని ఉద్దేశించిన ఏకవచన ఆజ్ఞారూపం; తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞ.
- source_word: לְבֵיתֵךְ
  choice: నీ ఇంటికి
  rationale: בַּיִת అనే పదంలోని ‘ఇల్లు/నివాసం’ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: וַאֲנִי
  choice: నేను
  rationale: హీబ్రూలో సర్వనామం స్పష్టంగా ఉండి కర్తకు స్వల్ప ఉద్ఘాటన ఇస్తుంది; తెలుగులో ‘నేను’ దానిని నిలుపుతుంది.
- source_word: אֲצַוֶּה
  choice: ఆజ్ఞలు ఇస్తాను
  rationale: צוה యొక్క పియేల్ రూపం ‘ఆజ్ఞాపించు, ఆదేశాలు ఇవ్వు’ అని అర్థం; రాజు పలికే మాటగా ‘ఆజ్ఞలు ఇస్తాను’ సహజంగా ఉండి అధికార భావాన్ని కాపాడుతుంది.
- source_word: עָלָיִךְ
  choice: నీ విషయం గురించి
  rationale: צוה తో వచ్చిన עַל ఆమెకు సంబంధించిన వ్యవహారంపై ఆదేశాలు ఇవ్వడాన్ని సూచించవచ్చు. ‘నీ విషయం గురించి’ ప్రధాన భావాన్ని ఇస్తుంది; ‘నీ కోసం/నీ పక్షంగా’ కూడా వ్యాకరణపరంగా సాధ్యమే.
