source:
  edition: WLC
  text: וַ/יִּפֹּל֩ יוֹאָ֨ב אֶל פָּנָ֥י/ו אַ֛רְצָ/ה וַ/יִּשְׁתַּ֖חוּ וַ/יְבָ֣רֶךְ אֶת הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר יוֹאָ֡ב הַ/יּוֹם֩ יָדַ֨ע עַבְדְּ/ךָ֜ כִּי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁר עָשָׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר עבד/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: te
  text: 'అప్పుడు యోవాబు ముఖం నేలకు ఆనించి పడిపోయి, నమస్కరించి, రాజును దీవించాడు. యోవాబు ఇలా అన్నాడు: “ఈ రోజు, రాజు తన సేవకుని మాటను చేసినందువల్ల, నా ప్రభువైన రాజా, నీ దృష్టిలో నాకు అనుగ్రహం దొరికిందని నీ సేవకుడను నేను తెలుసుకున్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: సాష్టాంగంగా నేలమీద పడి
  rationale: ముఖం నేలవైపు ఉండే సంపూర్ణ ప్రణామ భంగిమను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחוּ
  choice: నమస్కరించి
  rationale: మానవ రాజు ఎదుట చేసిన గౌరవపూర్వక వంగి నమస్కారాన్ని సూచిస్తుంది; దైవారాధన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: రాజును దీవించాడు
  rationale: ברך అనే క్రియ యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, రాజుకు గౌరవంతో మేలు కోరిన మాటను సూచిస్తుంది.
- source_word: יָדַע עַבְדְּךָ
  choice: నీ సేవకుడనైన నాకు ఈ రోజు తెలిసింది
  rationale: పూర్తయిన సంఘటన వల్ల ఇప్పుడు కలిగిన గ్రహింపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; రాజసభలోని వినయపూర్వక మూడవ పురుష స్వీయసూచనను భావపరంగా నిలుపుతుంది.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం లభించింది
  rationale: హీబ్రూ దృష్టి-రూపకాన్ని నిలుపుతూ, חֵן ను సందర్భానుకూలంగా ‘అనుగ్రహం’గా అందిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజును ఉద్దేశించిన గౌరవపూర్వక సంబోధనను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר
  choice: కాబట్టి
  rationale: రాజు చేసిన కార్యమే యోవాబు తనకు అనుగ్రహం లభించిందని తెలుసుకోవడానికి ఆధారమని తెలిపే కారణ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה ... אֶת דְּבַר עַבְדּוֹ
  choice: తన సేవకుని మనవిని అంగీకరించాడు
  rationale: అక్షరార్థంగా ‘తన సేవకుని మాటను చేశాడు’; సందర్భంలో యోవాబు చేసిన విజ్ఞప్తిని రాజు మన్నించిన భావాన్ని సహజ తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మానవ రాజుకు చూపిన గౌరవాన్ని ఆరాధనగా చూపాలా?
  choice: ‘నమస్కరించి’, ‘నా ప్రభువైన రాజా’ అని అనువదించడం
  alternative: ‘ఆరాధించి’ అని అనువదించడం
  rationale: ఇక్కడ రాజసభకు తగిన గౌరవప్రదర్శనే ఉద్దేశం; దైవారాధన అనే వేదాంత భావాన్ని పాఠ్యంలోకి చేర్చకూడదు.
- issue: దీవించడం అనే పదాన్ని కృతజ్ఞతగా మాత్రమే వివరణాత్మకంగా మార్చాలా?
  choice: ‘రాజును దీవించాడు’ అని మూలంలోని విస్తృత భావాన్ని నిలుపడం
  alternative: ‘రాజుకు కృతజ్ఞతలు చెప్పాడు’
  rationale: సందర్భంలో కృతజ్ఞత అంతర్భాగమైనా, ברך అనే పదం దానికంటే విస్తృతం; మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘సాష్టాంగంగా’ భంగిమను సంక్షిప్తంగా తెలియజేస్తుంది; సంస్కృతాధిక భారాన్ని మిగతా వాక్యంలో తగ్గించాం.
