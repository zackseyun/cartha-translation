translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా ‘కబురు పంపాడు’ వాడబడింది. గౌరవభరితమైన కథనశైలిని, మూలంలోని పునరుక్తిని కాపాడాం. సర్వనామ అస్పష్టతను తగ్గించేందుకు రెండో వాక్యంలో ‘యోవాబు’ను పునరుక్తి చేశాం; చివరి భాగంలో సందర్భానుసారంగా కర్త స్పష్టంగా ఉన్నందున పేరు మళ్లీ చేర్చలేదు.
