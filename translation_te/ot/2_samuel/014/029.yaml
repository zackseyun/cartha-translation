  to: అబ్షాలోము తనను రాజు దగ్గరకు పంపించమని యోవాబుకు కబురు పంపాడు. అయితే యోవాబు అతని దగ్గరకు రావడానికి ఇష్టపడలేదు.[a] అబ్షాలోము రెండోసారి మళ్లీ కబురు పంపాడు; అయినా యోవాబు రావడానికి ఇష్టపడలేదు.
