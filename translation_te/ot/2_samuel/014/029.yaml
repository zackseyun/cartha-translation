  text: וַ/יִּשְׁלַ֨ח אַבְשָׁל֜וֹם אֶל יוֹאָ֗ב לִ/שְׁלֹ֤חַ אֹת/וֹ֙ אֶל הַ/מֶּ֔לֶךְ וְ/לֹ֥א אָבָ֖ה לָ/ב֣וֹא אֵלָ֑י/ו וַ/יִּשְׁלַ֥ח עוֹד֙ שֵׁנִ֔ית וְ/לֹ֥א אָבָ֖ה לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: te
  text: అబ్షాలోము తనను రాజు దగ్గరకు పంపించమని యోవాబుకు కబురు పంపాడు. అయితే యోవాబు అతని దగ్గరకు రావడానికి ఇష్టపడలేదు.[a] అబ్షాలోము రెండోసారి మళ్లీ కబురు పంపాడు; అయినా యోవాబు రావడానికి ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రావడానికి నిరాకరించాడు.” అక్షరార్థంగా, “రావడానికి ఇష్టపడలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: అబ్షాలోము యోవాబు కోసం కబురు పంపాడు
  rationale: שׁלח యొక్క మూలార్థం ‘పంపు’; אֶל יוֹאָב మరియు తరువాతి ఉద్దేశార్థక క్రియారూపం కలిపి చూస్తే, యోవాబును రప్పించేందుకు అబ్షాలోము సందేశం పంపాడనే భావం వస్తుంది. ఆధునిక తెలుగులో ‘కబురు పంపాడు’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: రాజు దగ్గరకు తనను పంపించమని
  rationale: ఇది అబ్షాలోము కోరిన ఉద్దేశాన్ని నేరుగా ఉంచుతుంది. ‘తనను’ అనే పదం אֹתוֹ యొక్క సూచన అబ్షాలోముకేనని తెలుగులో స్పష్టం చేస్తుంది; యోవాబు మధ్యవర్తిత్వ విధానాన్ని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా వివరించదు.
- source_word: וְלֹא אָבָה
  choice: అయితే ... ఇష్టపడలేదు
  rationale: אָבָה అంటే ‘ఇష్టపడు/సమ్మతించు’. ‘ఇష్టపడలేదు’ అనేది ‘నిరాకరించాడు’ కంటే మూలంలోని స్వరాన్ని సన్నిహితంగా కాపాడుతుంది.
- source_word: לָבוֹא אֵלָיו
  choice: అతని దగ్గరకు రావడానికి
  rationale: אֵלָיוలోని దిశను నిలుపుతూ, యోవాబు అబ్షాలోము దగ్గరకు రావడాన్ని సూచిస్తుంది.
- source_word: עוֹד שֵׁנִית
  choice: రెండోసారి మళ్లీ
  rationale: עוֹד (‘మళ్లీ’) మరియు שֵׁנִית (‘రెండోసారి’) రెండింటినీ అనువదించి మూలపాఠంలోని పునరుక్తి నొక్కును నిలుపుతుంది.
- source_word: וַיִּשְׁלַח ... וְלֹא אָבָה ... וַיִּשְׁלַח ... וְלֹא אָבָה
  choice: కబురు పంపాడు ... ఇష్టపడలేదు ... మళ్లీ కబురు పంపాడు ... ఇష్టపడలేదు
  rationale: హీబ్రూ వాక్యంలోని పునరావృత నిర్మాణం కథన పురోగతిని, యోవాబు స్పందించకపోవడాన్ని బలపరుస్తుంది; తెలుగులోనూ దానిని నిలిపాం.
