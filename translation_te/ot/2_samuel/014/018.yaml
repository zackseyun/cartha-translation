revisions:
- from: 'అప్పుడు రాజు ఆ స్త్రీకి ఇలా జవాబిచ్చాడు: “నేను నిన్ను అడిగే ఏ విషయాన్నీ దయచేసి నా దగ్గర దాచవద్దు.” అందుకు ఆ స్త్రీ, “నా ప్రభువైన రాజు దయచేసి మాట్లాడాలి[a]” అంది.'
  to: 'అప్పుడు రాజు ఆ స్త్రీతో ఇలా జవాబిచ్చాడు: “నేను నిన్ను అడిగే ఏ విషయాన్నీ దయచేసి నా నుండి దాచవద్దు.” అప్పుడు ఆ స్త్రీ, “నా ప్రభువైన రాజా, దయచేసి మాట్లాడండి[a]” అంది.'
