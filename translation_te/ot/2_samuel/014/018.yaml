base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/018.yaml
  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: te
  text: 'అప్పుడు రాజు ఆ స్త్రీతో ఇలా జవాబిచ్చాడు: “నేను నిన్ను అడిగే ఏ విషయాన్నీ దయచేసి నా నుండి దాచవద్దు.” అప్పుడు ఆ స్త్రీ, “నా ప్రభువైన రాజా, దయచేసి మాట్లాడండి[a]” అంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, మరింత పరోక్ష గౌరవ రూపంలో: “నా ప్రభువైన రాజు దయచేసి మాట్లాడనివ్వండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ సూత్రాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా శైలిలో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట రాజబిరుదుకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో తెకోవ స్త్రీనే సూచిస్తుంది; భార్య సంబంధాన్ని సూచించదు.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: దయచేసి నా దగ్గర దాచవద్దు
  rationale: నిషేధంతో కూడిన నָא యొక్క వినయపూర్వక విజ్ఞప్తి ధోరణిని నిలుపుతూ, ‘నా నుండి దాచకు’ అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: דָּבָר
  choice: ఏ విషయాన్నీ
  rationale: ప్రతిషేధ వాక్యంలో ‘ఒక మాట/విషయం’ అనే అనిర్దిష్ట భావం తెలుగులో సహజంగా ‘ఏ విషయాన్నీ’ అవుతుంది.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: నేను నిన్ను అడిగే
  rationale: వర్తమాన కృదంతపు తక్షణ, కొనసాగుతున్న ప్రశ్నార్థక సందర్భాన్ని సరళంగా నిలుపుతుంది.
- source_word: יְדַבֶּר נָא
  choice: దయచేసి మాట్లాడాలి
  rationale: మూడవ పురుష జస్సివ్ ద్వారా వ్యక్తమైన రాజసభా మర్యాదను తెలుగులో నిలుపుతుంది; నేరుగా ‘మాట్లాడండి’ అని మార్చడం కంటే మూలంలోని పరోక్ష గౌరవ రూపానికి దగ్గరగా ఉంటుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజును ఉద్దేశించిన గౌరవసూచక సంబోధనలో స్వామిత్వ భావాన్నీ రాజబిరుదునూ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. రాజసభా మర్యాదను నిలుపుతూ, అసహజమైన పదానువాదాన్ని నివారించాం. ప్రధాన పాఠంలో יְדַבֶּר అనే మూడవ పురుష గౌరవ రూపాన్ని ప్రతిబింబించాం; ప్రత్యక్ష సంబోధన రూపాన్ని పాదటీపులో ఇచ్చాం.
