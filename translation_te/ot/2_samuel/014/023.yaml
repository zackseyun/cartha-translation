  source_fidelity: 'హీబ్రూ వచనంలోని వరుస చర్యలను పాఠ్యం నమ్మకంగా ప్రతిబింబిస్తుంది: యోవాబు లేచాడు, గెషూరుకు వెళ్లాడు, అబ్షాలోమును యెరూషలేముకు తీసుకొచ్చాడు. గెషూరా యొక్క దిశార్థక రూపాన్ని ‘గెషూరుకు’గా, హిఫిల్ וַיָּבֵאను ‘తీసుకొచ్చాడు’గా సరిగ్గా ఇచ్చింది. మూలంలో స్పష్టంగా లేని ‘తిరిగి’ని ప్రధాన పాఠ్యంలో చేర్చలేదు.'
