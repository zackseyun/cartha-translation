translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వరుస హీబ్రూ క్రియలను తెలుగు సంయుక్త క్రియ నిర్మాణంతో ‘లేచి… వెళ్లి… తీసుకొచ్చాడు’గా ఇచ్చాం. మూలంలో స్పష్టంగా లేని ‘తిరిగి’ భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో ఉంచాం.
