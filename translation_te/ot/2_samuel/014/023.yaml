  yaml_path: translation/ot/2_samuel/014/023.yaml
  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: te
  text: అప్పుడు యోవాబు లేచి గెషూరుకు వెళ్లి, అబ్షాలోమును యెరూషలేముకు తీసుకొచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి ‘అబ్షాలోమును తిరిగి యెరూషలేముకు తీసుకొచ్చాడు’ అని కూడా అర్థం చేసుకోవచ్చు. అతడు ప్రవాసం నుండి తిరిగి వస్తున్నాడనే భావం సందర్భంలో ఉంది; అయితే ‘తిరిగి’ అనే మాట హీబ్రూ క్రియలో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום క్రియ కథన క్రమంలో చర్యకు లేవడాన్ని సూచిస్తుంది. ‘లేచి’ మూలంలోని చర్యను సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך సాధారణ కథనంలో ‘వెళ్లు’ అనే అర్థం ఇస్తుంది; ముందున్న క్రియతో సహజంగా అనుసంధానించేందుకు ‘వెళ్లి’ అని అనువదించబడింది.
- source_word: גְּשׁוּרָה
  choice: గెషూరుకు
  rationale: పదాంత దిశాసూచక ה గెషూరు వైపు గమనాన్ని తెలియజేస్తుంది; తెలుగులో ‘గెషూరుకు’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చాడు
  rationale: ביא హిఫిల్ రూపం ‘రప్పించు/తీసుకురా’ అనే కారణార్థక భావాన్ని ఇస్తుంది. యోవాబు గెషూరు నుండి అబ్షాలోమును యెరూషలేముకు తీసుకువచ్చిన గమనాన్ని ‘తీసుకొచ్చాడు’ సహజంగా తెలియజేస్తుంది; తిరిగి రావడం సందర్భంలో ఉన్నప్పటికీ ప్రధాన పాఠ్యంలో ‘తిరిగి’ చేర్చలేదు.
- source_word: אֶת אַבְשָׁלוֹם
  choice: అబ్షాలోమును
  rationale: אֶת ప్రత్యక్ష కర్మ సూచిక; వ్యక్తి పేరును తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ‘అబ్షాలోము’గా, కర్మ విభక్తితో ఇచ్చాం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: హీబ్రూలో ప్రత్యేక ఉపసర్గ లేకపోయినా, ‘తీసుకొచ్చాడు’ అనే క్రియతో గమ్యస్థానం వాక్యనిర్మాణం ద్వారా స్పష్టమవుతుంది; తెలుగులో దాన్ని ‘కు’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన చర్యల వరుసను ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ ఆ క్రమ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
