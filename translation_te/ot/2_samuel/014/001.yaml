source:
  edition: WLC
  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: te
  text: జెరూయా కుమారుడు యోవాబు, రాజు హృదయం అబ్షాలోము వైపే ఉందని తెలుసుకున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజు అబ్షాలోము కోసం తపించాడు.” హీబ్రూ వాక్యప్రయోగం సంక్షిప్తంగా ఉంది; దానికి మరింత సాధారణంగా “రాజు హృదయం అబ్షాలోముపైనే నిలిచింది” అని కూడా అర్థం కావచ్చు. కొందరు దాన్ని ప్రతికూలంగా, “రాజు హృదయం అబ్షాలోముకు వ్యతిరేకంగా ఉంది” అని అర్థం చేసుకున్నారు; అయితే తరువాతి సందర్భం సానుకూల మొగ్గును సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: గ్రహించాడు
  rationale: ידע యొక్క సాధారణ అర్థమైన ‘తెలుసుకున్నాడు’ను సందర్భానుకూలంగా సహజమైన ‘గ్రహించాడు’తో వ్యక్తం చేశాం; వాక్యారంభంలో మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: జెరూయా కుమారుడు యోవాబు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో ఇచ్చి, వ్యక్తినామాలను లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: అని
  rationale: యోవాబు గ్రహించిన విషయాన్ని పరిచయం చేసే విషయార్థక సంధిగా అనువదించాం.
- source_word: לֵב הַמֶּלֶךְ
  choice: రాజు హృదయం
  rationale: לֵב అంతరంగ వైఖరి, సంకల్పం లేదా అనురాగాన్ని సూచించగలదు; ‘హృదయం’ మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: עַל
  choice: వైపు ఉంది
  rationale: ఇక్కడ עַל సంక్షిప్తమైన, కొంత సందిగ్ధమైన దిశాత్మక సంబంధాన్ని సూచిస్తుంది. ‘వైపు ఉంది’ అనేది ప్రేమ, తపన లేదా వ్యతిరేకతలో ఏదో ఒకదానిని అనవసరంగా ఖరారు చేయకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: అబ్షాలోము పట్ల రాజు అంతరంగ వైఖరిలోని సందిగ్ధత
  choice: రాజు హృదయం అబ్షాలోము వైపు ఉంది
  alternative: రాజు అబ్షాలోము కోసం తపించాడు; లేదా రాజు హృదయం అబ్షాలోముకు వ్యతిరేకంగా ఉంది
  rationale: హీబ్రూ వాక్యప్రయోగం సంక్షిప్తంగా ఉండి రాజు వైఖరి సానుకూలమా ప్రతికూలమా అని స్పష్టంగా చెప్పదు. తరువాతి సందర్భం సానుకూల మొగ్గును సూచించినప్పటికీ, ప్రధాన పాఠం మూలంలోని ఉద్రిక్తతను కాపాడుతుంది; మరింత నిర్దిష్టమైన అర్థాలను పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘హృదయం ... వైపు ఉంది’ అనే రూపకం కొంత అసాధారణంగా అనిపించినా, మూలంలోని ఉద్దేశపూర్వక సందిగ్ధతను కాపాడేందుకు ఉంచాం.
