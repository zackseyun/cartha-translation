source:
  edition: WLC
  text: כִּ֚י יִשְׁמַ֣ע הַ/מֶּ֔לֶךְ לְ/הַצִּ֥יל אֶת אֲמָת֖/וֹ מִ/כַּ֣ף הָ/אִ֑ישׁ לְ/הַשְׁמִ֨יד אֹתִ֤/י וְ/אֶת בְּנִ/י֙ יַ֔חַד מִֽ/נַּחֲלַ֖ת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: te
  text: ఎందుకంటే, దేవుని స్వాస్థ్యం[a] నుండి నన్నూ నా కుమారుణ్ణీ ఇద్దరినీ నిర్మూలించాలనుకునే ఆ మనిషి చేతిలోనుండి తన దాసిని విడిపించడానికి రాజు నా మాట వింటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేవుని స్వాస్థ్యం” అంటే దేవుడు ఇశ్రాయేలులో కేటాయించిన స్వాస్థ్యం కావచ్చు; లేదా దేవునికి చెందిన స్వాస్థ్యం అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో స్త్రీ వ్యక్తం చేసిన నిరీక్షణకు ఇది కారణాన్ని వివరిస్తుంది; హెబ్రీ పదంలోని వివరణాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִשְׁמַע
  choice: నా మాట వింటాడు
  rationale: שׁמע అంటే వినడం, ఆలకించడం, మాటకు స్పందించడం అనే భావాలు ఉండవచ్చు. సందర్భంలో రాజు ఆమె విజ్ఞప్తిని విని చర్య తీసుకుంటాడనే భావం ఉంది; అయితే స్పందనను అతిగా నిర్దిష్టం చేయకుండా ‘నా మాట వింటాడు’ అని అనువదించాం.
- source_word: לְהַצִּיל
  choice: విడిపించడానికి
  rationale: נצל హిఫీల్ రూపం ప్రమాదం లేదా మరొకరి అధికారం నుండి రక్షించి విడిపించడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘విడిపించడానికి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲמָתוֹ
  choice: తన దాసిని
  rationale: హెబ్రీ నామవాచకం ప్రత్యేకంగా స్త్రీలింగంలో ఉంది. రాజుతో వినయంగా మాట్లాడుతున్న స్త్రీ తనను తాను సూచిస్తున్నందున తెలుగులోనూ స్త్రీలింగాన్ని స్పష్టంగా నిలిపాం.
- source_word: מִכַּף הָאִישׁ
  choice: ఆ మనిషి చేతిలోనుండి
  rationale: ‘చేయి’ అధికారం లేదా పట్టును సూచించే హెబ్రీ రూపకం. అదే రూపకం తెలుగులోనూ అర్థమయ్యే కారణంగా దాన్ని నిలిపాం.
- source_word: לְהַשְׁמִיד
  choice: నాశనం చేయాలనుకునే
  rationale: ఈ క్రియారూపం ఆ మనిషి యొక్క వినాశక ఉద్దేశాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో సంబంధార్థకంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: יַחַד
  choice: నన్నూ నా కుమారుణ్ణీ కలిసి
  rationale: తల్లినీ కుమారుణ్ణీ ఇద్దరినీ ఒకేసారి లక్ష్యంగా చేసుకున్నారనే ఉద్ఘాటనను ‘కలిసి’ నిలుపుతుంది.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: దేవుని స్వాస్థ్యంలో లేకుండా
  rationale: מִן ఇక్కడ వారిని స్వాస్థ్యం నుండి తొలగించి లేకుండా చేయడాన్ని సూచిస్తుంది. ‘దేవుని స్వాస్థ్యం’ అనే పదబంధం దేవుడు ఇచ్చిన వారసత్వం మరియు దేవునికి చెందిన స్వాస్థ్యం అనే రెండు సాధ్య భావాలను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ‘దేవుని స్వాస్థ్యం’ అనే పదబంధం యొక్క భావం
  choice: దేవుడు ఇశ్రాయేలులో అనుగ్రహించిన స్వాస్థ్యం నుండి ఆ స్త్రీ కుటుంబ వంశాన్ని తొలగించడం అనే భావాన్ని ప్రధానంగా సూచించేలా, మూలంలోని సంక్షిప్త పదబంధాన్ని నిలిపాం.
  alternative: ఇది దేవుని సొంత ప్రజలను లేదా దేవునికి చెందిన స్వాస్థ్యాన్ని సూచించవచ్చు.
  rationale: సందర్భం కుటుంబ వంశం అంతరించిపోవడం, ఇశ్రాయేలులో దాని స్థానం కోల్పోవడం గురించి మాట్లాడుతుంది. అయినా హెబ్రీ నిర్మాణం స్వాస్థ్యం ఎవరిది లేదా ఎవరు ఇచ్చింది అనే సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు; కాబట్టి అనువాదంలో ఆ భావ విస్తృతిని కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభలో స్త్రీ పలికే వినయపూర్వక స్వరాన్ని నిలిపేలా ‘తన దాసిని’ వాడాం. మూలంలోని ‘చేతిలోనుండి’ అనే రూపకాన్ని సహజంగా ఉంచి, క్లిష్టమైన హెబ్రీ ఉద్దేశార్థక నిర్మాణాన్ని చదవదగిన తెలుగు సంబంధ వాక్యంగా మలిచాం.
