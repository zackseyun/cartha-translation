base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: te
  text: అబ్షాలోముకు ముగ్గురు కుమారులు, ఒక కుమార్తె పుట్టారు. ఆమె పేరు తామారు. ఆమె చూడటానికి అందమైన స్త్రీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: అబ్షాలోముకు ... పుట్టారు
  rationale: ילד నిఫాల్ రూపం జన్మించడాన్ని సూచిస్తుంది; לְ parentageను తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: שְׁלוֹשָׁה בָנִים וּבַת אַחַת
  choice: ముగ్గురు కుమారులు, ఒక కుమార్తె
  rationale: בָנִיםను లింగనిర్దిష్టమైన ‘కుమారులు’గా ఉంచి, సంఖ్యలను సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: וּשְׁמָהּ תָּמָר
  choice: ఆమె పేరు తామారు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందుగా ప్రస్తావించిన కుమార్తెను సూచిస్తుంది.
- source_word: הִיא הָיְתָה אִשָּׁה יְפַת מַרְאֶה
  choice: ఆమె చూడడానికి అందమైన స్త్రీగా ఉండేది
  rationale: יְפַת מַרְאֶה శారీరక రూపసౌందర్యాన్ని సూచిస్తుంది. ‘చూడడానికి అందమైన’ అనేది మూలంలోని appearance భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో మూలంలోని గంభీరమైన కథన శైలిని కాపాడాం. పేర్లను ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
