  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: te
  text: 'అప్పుడు యోవాబు లేచి అబ్షాలోము ఇంటికి వెళ్లి అతనితో ఇలా అన్నాడు: “నీ సేవకులు నాకు చెందిన పొలానికి ఎందుకు నిప్పు పెట్టారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: అప్పుడు యోవాబు లేచి
  rationale: కథనాన్ని ముందుకు నడిపించే వయ్యిక్తోల్ క్రమాన్ని ‘అప్పుడు’ ద్వారా, קום అనే క్రియను సహజమైన ‘లేచి’ ద్వారా వ్యక్తం చేశాం.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: అబ్షాలోము ఇంటికి వెళ్లి
  rationale: దిశను సూచించే ה־తో ఉన్న הַבָּיְתָה అంటే ‘ఇంటికి’; సందర్భంలో అది అబ్షాలోము నివాసాన్ని సూచిస్తుంది. గమ్యస్థానానికి వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపాం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతనితో … అని అడిగాడు
  rationale: మూలంలో ‘అతనితో అన్నాడు’ అని ఉన్నా, తరువాత ప్రత్యక్ష ప్రశ్న వస్తున్నందున తెలుగులో ‘అడిగాడు’ సహజంగా ఉంటుంది; אֵלָיוలోని సంబోధన సంబంధాన్ని ‘అతనితో’ నిలుపుతుంది.
- source_word: עֲבָדֶךָ
  choice: నీ సేవకులు
  rationale: రూపం సమూహార్థక ఏకవచనంగా ఉన్నా, దానికి సంబంధించిన הִצִּיתוּ క్రియ బహువచనంలో ఉంది. అందువల్ల భావాన్ని ‘సేవకులు’ అని అనువదించాం.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: నాకు చెందిన పొలానికి
  rationale: חֶלְקָה అనేది భూమి ముక్క లేదా పొలాన్ని సూచిస్తుంది; אֲשֶׁר לִי దాని యాజమాన్యాన్ని స్పష్టంగా ‘నాకు చెందిన’ అని తెలుపుతుంది.
- source_word: הִצִּיתוּ … בָּאֵשׁ
  choice: నిప్పు పెట్టారు
  rationale: హిఫీల్ రూపం మంట అంటించడం లేదా తగలబెట్టడం అనే కారక భావాన్ని ఇస్తుంది; సాధనార్థక בָּאֵשׁతో కూడిన భావాన్ని తెలుగులో ‘నిప్పు పెట్టారు’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
