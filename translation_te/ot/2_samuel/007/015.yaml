  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: te
  text: అయితే నా స్థిరమైన ప్రేమ అతని నుండి తొలగిపోదు[a]; నేను నీ ఎదుటనుండి తొలగించిన సౌలు నుండి దానిని తొలగించినట్లుగా కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రేమపూర్వక విశ్వసనీయత,’ ‘నిబంధనకు నమ్మకమైన నా ప్రేమ.’ హెబ్రీ పదం నిబంధన సంబంధంలో నిలకడగల, నమ్మకమైన ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘నేను నీ ఎదుటనుండి తొలగించిన సౌలు నుండి దానిని తొలగించినట్లుగా.’ ‘నీ ఎదుటనుండి’ అనే మాట సౌలు దావీదుతో సంబంధించి తొలగించబడటాన్ని సూచించవచ్చు; మూలవాక్యం అది ఎలా జరిగిందో మరింత స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: నా నిబంధన విశ్వాసం
  rationale: חֶסֶד ఇక్కడ దావీదుతో చేసిన నిబంధన సందర్భంలో దేవుని స్థిరమైన ప్రేమను, విశ్వసనీయతను సూచిస్తుంది. ‘నిబంధన విశ్వాసం’ దాని సంబంధపరమైన, నిబద్ధతగల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יָסוּר
  choice: విడిచిపోదు
  rationale: סור అంటే తొలగిపోవడం లేదా దూరమవడం. חֶסֶד కర్తగా ఉన్నందున ‘అతనిని విడిచిపోదు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: מִמֶּנּוּ
  choice: అతనిని
  rationale: מן ప్రత్యయంతో వేరుపడటాన్ని సూచిస్తుంది; తెలుగులో ‘అతని నుండి’ కంటే ప్రేమ లేదా విశ్వాసం ‘అతనిని విడిచిపోదు’ అనడం సహజం.
- source_word: כַּאֲשֶׁר
  choice: తొలగించినట్లు
  rationale: సౌలు విషయంలో జరిగినదానితో పోలికను యథాతథంగా నిలుపుతుంది.
- source_word: הֲסִרֹתִי
  choice: తొలగించిన
  rationale: סור హిఫీల్ రూపం కారణార్థకంగా ‘తొలగించు’ అని అర్థం; ముందున్న క్రియతో పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: מֵעִם שָׁאוּל
  choice: సౌలు నుండి
  rationale: సౌలుతో ఉన్న అనుబంధం నుండి దేవుని నిబంధన అనుగ్రహం తొలగింపును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: నీ ఎదుటనుండి నేను తొలగించిన సౌలు
  rationale: మִלְּפָנֶיךָ యొక్క ‘నీ ఎదుటనుండి’ అనే రూపకాన్ని కాపాడి, అది కేవలం భౌతిక స్థలమా లేక రాజస్థానమా అని అనువాదంలో నిర్ణయించదు.
theological_decisions:
- issue: దావీదు నిబంధన సందర్భంలో חֶסֶד స్వభావం
  choice: ‘నా నిబంధన విశ్వాసం’ అని అనువదించడం
  alternative: నా స్థిరమైన ప్రేమ / నా కృప / నా కనికరం
  rationale: ఈ పదం కేవలం భావోద్వేగ ప్రేమను లేదా కనికరాన్ని కాక, నిబంధన సంబంధంలో దేవుని స్థిరమైన ప్రేమపూర్వక విశ్వసనీయతను సూచిస్తుంది. అయితే ఏ ప్రత్యేక సిద్ధాంత సూత్రాన్నీ ఇందులో చేర్చలేదు.
- issue: ‘నీ ఎదుటనుండి’ అనే మాట యొక్క సూచన
  choice: హెబ్రీ రూపకాన్ని ‘నీ ఎదుటనుండి’గా నిలుపడం
  alternative: నీ సన్నిధి నుండి / నీ ముందు రాజుగా ఉండకుండా
  rationale: ఈ మాట సౌలు దావీదుతో సంబంధించి తొలగించబడటాన్ని సూచించినా, అది ఎలా అనేది మూలంలో పూర్తిగా వివరించబడలేదు. అందువల్ల రాజత్వం గురించిన వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
- issue: సౌలు నుండి తొలగించబడిన దాని అంతర్నిహిత కర్మ
  choice: తెలుగులో స్పష్టత కోసం ‘దానిని’ చేర్చి, అది దేవుని నిబంధన విశ్వాసాన్ని సూచించేలా చేయడం
  alternative: కర్మను వ్యక్తం చేయకుండా ‘సౌలు విషయంలో చేసినట్లు’ అని అనువదించడం
  rationale: హెబ్రీలో రెండవ הֲסִרֹתִי వద్ద కర్మ సందర్భం ద్వారా అర్థమవుతుంది. తెలుగులో ‘దానిని’ చేర్చడం అదే కర్మను సహజంగా తెలియజేస్తుంది; కొత్త భావాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నిబంధన విశ్వాసం’ కొంత సాంకేతికంగా అనిపించవచ్చు కాబట్టి [a]లో సహజ ప్రత్యామ్నాయాలు ఇచ్చాం. హెబ్రీ పోలికలోని స్వల్ప అసంపూర్ణతను తెలుగులో అర్థవంతం చేయడానికి ‘దానిని’ చేర్చాం; ‘నీ ఎదుటనుండి’ అనే ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
