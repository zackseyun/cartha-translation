  terminology: חֶסֶדను ‘స్థిరమైన ప్రేమ’గా అనువదించడం దాని నిలకడగల, నిబంధన-సంబంధమైన ప్రేమ భావాన్ని కాపాడుతుంది. పాదటిప్పణిలో ‘ప్రేమపూర్వక విశ్వసనీయత’ మరియు ‘నిబంధనకు నమ్మకమైన ప్రేమ’ వంటి వివరణలు ప్రత్యామ్నాయ భావాలను అందిస్తాయి; ప్రధాన వాక్యంపై సాంకేతిక పదబంధాన్ని మోపవు.
