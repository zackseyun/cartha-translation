  source_fidelity: ముసాయిదా హీబ్రూ వాక్యంలోని పోలికను, సౌలును ‘నీ ఎదుటనుండి’ తొలగించిన సూచనను సాధారణంగా కాపాడుతుంది. అయితే חַסְדִּיకి ‘నా నిబంధన విశ్వాసం’ అనడం ప్రేమ/కృప అనే ప్రధాన భావాన్ని మసకబారుస్తుంది; చివరి ‘తొలగించను’ కూడా మూలంలోని ‘తొలగిపోదు/విడిచిపోదు’ అనే క్రియకు బదులుగా దేవుడు నేరుగా చేసే చర్యగా మారుస్తుంది.
