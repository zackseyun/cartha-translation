- from: అయితే నా నిబంధన విశ్వాసం అతనిని విడిచిపోదు[a]. నీ ఎదుటనుండి నేను తొలగించిన సౌలు నుండి దానిని తొలగించినట్లు అతని నుండి తొలగించను[b].
  to: అయితే నా స్థిరమైన ప్రేమ అతని నుండి తొలగిపోదు[a]; నేను నీ ఎదుటనుండి తొలగించిన సౌలు నుండి దానిని తొలగించినట్లుగా కాదు[b].
  rationale: ప్రధాన పదమైన חֶסֶדకు ప్రేమతో కూడిన సహజ తెలుగు సమానార్థకాన్ని ఉపయోగించాం. హీబ్రూలో ఉన్నట్లే ‘స్థిరమైన ప్రేమ’నే తొలగిపోని కర్తగా ఉంచాం. సౌలును తొలగించిన విషయానికి సంబంధించిన ‘నీ ఎదుటనుండి’ అనే ఉద్దేశపూర్వక అస్పష్టతను అలాగే నిలిపి, పోలికలో అంతర్నిహితమైన కర్మ ‘దానిని’ని తెలుగులో స్పష్టత కోసం మాత్రమే ఉంచాం.
