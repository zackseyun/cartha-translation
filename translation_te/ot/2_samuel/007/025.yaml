  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: te
  text: ఇప్పుడు, యాహ్వే దేవా, నీ సేవకుని గురించీ అతని ఇంటి గురించీ[a] నీవు పలికిన మాటను[b] శాశ్వతంగా స్థిరపరచి, నీవు పలికినట్టే చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “అతని ఇల్లు” అంటే కేవలం అతని కుటుంబ గృహం మాత్రమే కాదు; అతని వంశాన్ని, ముఖ్యంగా రాజవంశాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీవు పలికిన వాగ్దానాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవా
  rationale: దైవనామమైన יְהוָהను ‘యెహోవా’గా లిప్యంతరీకరించి, సంబోధనలోని אֱלֹהִיםను సహజమైన తెలుగులో ‘దేవా’గా ఇచ్చాం.
- source_word: הַדָּבָר
  choice: మాటను
  rationale: דָּבָר ఇక్కడ దేవుడు పలికిన వాక్కును, సందర్భానుసారంగా వాగ్దానాన్ని సూచిస్తుంది. మూలంలోని పదప్రయోగాన్ని కాపాడేందుకు ప్రధాన పాఠంలో ‘మాటను’ ఉంచి, ‘వాగ్దానాన్ని’ పాదటిప్పణిలో ఇచ్చాం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుని
  rationale: రాజప్రార్థన సందర్భంలో עֶבֶד దేవుని ఎదుట వినయపూర్వక సేవాసంబంధాన్ని తెలియజేస్తుంది; అందువల్ల ఆధునిక ప్రామాణిక తెలుగులో ‘సేవకుడు’ సహజమైన ఎంపిక.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటి
  rationale: בַּיִת అనే కీలకమైన ‘ఇల్లు’ రూపకాన్ని నిలిపాం. ఈ అధ్యాయంలో అది దావీదు వంశాన్ని లేదా రాజవంశాన్ని కూడా సూచిస్తుందనే భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: הָקֵם
  choice: స్థిరపరచి
  rationale: קום హిఫీల్ ఆజ్ఞారూపం పలికిన మాట నిలిచేలా, దృఢంగా ఉండేలా చేయమనే భావం ఇస్తుంది. తెలుగులో వరుస ఆజ్ఞలను సహజంగా కలపడానికి ‘స్థిరపరచి ... చేయి’ అని ఇచ్చాం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ పదబంధం నిరంతరమైన, అంతంలేని కాలాన్ని సూచిస్తుంది; ‘శాశ్వతంగా’ దాని గంభీరతను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: నీవు పలికినట్టే చేయి
  rationale: మూలంలోని సంక్షిప్త ఆజ్ఞను, דבר ధాతువు పునరావృతిని కాపాడుతూ సహజమైన తెలుగులో ఇచ్చాం.
theological_decisions:
- issue: הַדָּבָרను ‘మాట’గా ఇవ్వాలా, నిబంధన సందర్భాన్ని స్పష్టం చేస్తూ ‘వాగ్దానం’గా ఇవ్వాలా
  choice: మాట
  alternative: వాగ్దానం
  rationale: హీబ్రూ పాఠం నేరుగా ‘నీవు పలికిన మాట’ అంటుంది. ‘మాట’ మూలరూపాన్ని, ఉద్దేశపూర్వక పునరావృతిని కాపాడుతుంది; వాగ్దాన భావం సందర్భం నుంచి వస్తుంది మరియు పాదటిప్పణిలో సూచించబడింది.
- issue: בֵּיתוֹను ‘అతని ఇల్లు’గా ఉంచాలా, ‘అతని రాజవంశం’గా స్పష్టీకరించాలా
  choice: అతని ఇల్లు
  alternative: అతని రాజవంశం / వంశం
  rationale: 2 సమూయేలు 7లో రాజవంశ భావం కీలకమైనప్పటికీ, ‘ఇల్లు’ అనే రూపకం అధ్యాయం అంతటా ఉన్న నిబంధనాత్మక పదబంధాన్ని నిలుపుతుంది. రాజవంశార్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధన. ‘పలికిన’ అనే పదం గంభీరతను నిలుపుతూ, అదే హీబ్రూ ధాతువు పునరావృతిని తెలుగులోనూ కాపాడుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
