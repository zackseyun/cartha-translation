    issue: The draft renders יְהוָה as ‘యెహోవా.’
    rationale: The source-context lexical decision explicitly renders the Tetragrammaton as ‘Yahweh.’ In Telugu transliteration this should be ‘యాహ్వే,’ not the alternative traditional form ‘యెహోవా.’
  - severity: low
    issue: Footnote b says ‘నీవు చేసిన వాగ్దానాన్ని.’
    rationale: The alternative should retain the source verb ‘spoken,’ as in the English audit trail. ‘నీవు పలికిన వాగ్దానాన్ని’ avoids replacing speech with the more interpretive ‘made.’
