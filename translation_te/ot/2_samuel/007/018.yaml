  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: te
  text: 'అప్పుడు రాజైన దావీదు లోపలికి వెళ్లి యెహోవా సన్నిధిలో కూర్చొని ఇలా అన్నాడు: “ప్రభువైన యెహోవా, నీవు నన్ను ఇంతవరకు తీసుకొచ్చేలా నేనెవరిని? నా ఇల్లు[a] ఎంతటిది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఇల్లు” అంటే దావీదు కుటుంబం, ఇంటివారు, అలాగే ఏర్పడబోయే రాజవంశం అనే విస్తృత భావాలు ఉండవచ్చు. ఈ అధ్యాయంలో పదేపదే వచ్చే “ఇల్లు” అనే పదంతో ఉన్న సంబంధాన్ని ప్రధాన పాఠం నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: లోపలికి వెళ్లి
  rationale: בוא అనే క్రియలోని ప్రవేశ కదలికను నిలుపుతుంది; స్థలాన్ని మూలపాఠం స్పష్టంగా చెప్పనందున దానిని అదనంగా పేర్కొనదు.
- source_word: וַיֵּשֶׁב לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో కూర్చుని
  rationale: ישב యొక్క సహజమైన భౌతిక అర్థమైన ‘కూర్చోవడం’ను, לִפְנֵי యొక్క సన్నిధి భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִי אָנֹכִי
  choice: నేనెవరిని?
  rationale: దావీదు వినయంతో అడిగిన అలంకారప్రశ్న యొక్క వ్యక్తిగత బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: אֲדֹנָי అనే అధిపత్య బిరుదును, יהוה అనే దైవనామాన్ని రెండింటినీ వేరుచేసి నిలుపుతుంది; తెలుగులో సహజమైన సంబోధన.
- source_word: וּמִי בֵיתִי
  choice: నా ఇల్లు ఎంతటిది?
  rationale: మూలంలోని ‘ఇల్లు’ ప్రతీకను నిలుపుతూ, వ్యక్తిని కాని ‘ఇల్లు’ గురించి ఉన్న מִי ప్రశ్నను తెలుగులో సహజమైన వినయప్రశ్నగా అందిస్తుంది.
- source_word: הֲבִיאֹתַנִי עַד הֲלֹם
  choice: నీవు నన్ను ఇంతవరకు తీసుకొచ్చావు
  rationale: הביא యొక్క కారణార్థక ‘తీసుకురావడం’ భావాన్ని, עַד הֲלֹם యొక్క ఇప్పటి స్థితి/స్థాయి వరకు అనే విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని ప్రధాన పాఠంలో నామరూపంగానే నిలుపుతుంది; אֲדֹנָי יהוה వచ్చిన చోట రెండు పదాల భేదం కూడా స్పష్టంగా ఉంటుంది.
- issue: ‘నా ఇల్లు’ అనే పదబంధం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘నా ఇల్లు’ను నిలిపి, కుటుంబం/ఇంటివారు/వంశం అనే విస్తృత భావాన్ని పాదటిప్పణిలో తెలియజేయడం
  alternative: నా కుటుంబం / నా ఇంటివారు / నా వంశం
  rationale: 2 సమూయేలు 7 అంతటా ‘ఇల్లు’ దేవాలయం, దావీదు ఇంటివారు, రాజవంశం అనే పరస్పర సంబంధిత భావాలతో వచ్చే సాహిత్యపరమైన పదప్రయోగాన్ని ఇది కాపాడుతుంది.
- issue: చివరి వాక్యపు వాక్యబలం
  choice: ఆశ్చర్యం, వినయం వ్యక్తమయ్యే ప్రకటనగా అనువదించడం
  alternative: ‘నన్ను ఇంతవరకు తీసుకొచ్చేందుకు?’ అనే ప్రశ్నారూపం
  rationale: כִּי కలిపిన మొత్తం వాక్యం అలంకారప్రశ్నలో భాగమైనప్పటికీ, తెలుగులో చివరి భాగాన్ని ఆశ్చర్యోద్గార ప్రకటనగా ఇవ్వడం దాని భావోద్వేగ బలాన్ని సహజంగా తెలియజేస్తుంది; కారణ సంబంధాన్ని అనవసరంగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవభరితమైన శైలి. కథనంలో సహజమైన క్రియాక్రమం వాడబడింది. మూలంలోని ‘ఇల్లు’ పదప్రయోగం మరియు దైవనామం నిలుపబడ్డాయి; మూలం చెప్పని ప్రార్థనా స్థలాన్ని ప్రత్యేకంగా చేర్చలేదు.
