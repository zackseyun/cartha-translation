revisions:
- from: 'అప్పుడు దావీదు రాజు లోపలికి వెళ్లి యెహోవా సన్నిధిలో కూర్చుని ఇలా అన్నాడు: “ప్రభువైన యెహోవా, నేనెవరిని? నా ఇల్లు[a] ఎంతటిది? నీవు నన్ను ఇంతవరకు తీసుకొచ్చావు!”'
  to: 'అప్పుడు రాజైన దావీదు లోపలికి వెళ్లి యెహోవా సన్నిధిలో కూర్చొని ఇలా అన్నాడు: “ప్రభువైన యెహోవా, నీవు నన్ను ఇంతవరకు తీసుకొచ్చేలా నేనెవరిని? నా ఇల్లు[a] ఎంతటిది?”'
  rationale: The revision retains every principal lexical choice of the draft but restores the Hebrew rhetorical-question structure and its connection to God's bringing David to his present position. The word “ఇల్లు” and its explanatory footnote are retained to preserve the literary and dynastic resonance of בית.
