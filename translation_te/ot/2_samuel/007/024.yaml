base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: te
  text: నీవు నీ ప్రజలైన ఇశ్రాయేలును నీ సొంత ప్రజలుగా శాశ్వతంగా స్థిరపరిచావు; నీవు, యాహ్వే[a], వారికి దేవుడివయ్యావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామమైన YHWH ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “వారికి దేవుడిగా ఉన్నావు.” ఈ హీబ్రూ రూపాన్ని స్థితివాచకంగానూ అనువదించవచ్చు; అయితే ఈ సందర్భంలో “దేవుడివయ్యావు” అనే అనువాదం ఒడంబడిక సంబంధాన్ని స్థాపించిన భావాన్ని మరింత స్పష్టంగా చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: స్థిరపరిచావు
  rationale: כון ధాతువు ఇక్కడ దృఢంగా నెలకొల్పడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. ‘స్థిరపరిచావు’ ఒడంబడిక సంబంధాన్ని దృఢంగా నెలకొల్పిన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְךָ ... לְךָ לְעָם
  choice: నీ కోసమే ... నీ ప్రజలుగా
  rationale: రెండుసార్లు వచ్చిన לְךָ ఇశ్రాయేలు యెహోవాకు చెందిన ప్రజలుగా నియమించబడిన సంగతిని నొక్కిచెబుతుంది. తెలుగు వాక్యంలో ‘కోసమే’ ఆ ఉద్ఘాటనను, ‘నీ ప్రజలుగా’ ఒడంబడిక గుర్తింపును తెలియజేస్తాయి.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలును
  rationale: స్వామ్య భావాన్నీ ‘ఇశ్రాయేలు’ అనే జాతీయ నామాన్నీ రెండింటినీ నిలుపుతూ, తెలుగు వ్యాకరణానికి సహజంగా ఉంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలిక, నిలిచే శాశ్వతత్వాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: వారికి దేవుడివయ్యావు
  rationale: היה + ל నిర్మాణం ఈ సందర్భంలో ఒడంబడిక సంబంధంలో ప్రవేశించడం లేదా ఆ సంబంధాన్ని స్థాపించడం సూచించగలదు. ‘దేవుడివయ్యావు’ ఆ క్రియాత్మక భావాన్ని నిలుపుతుంది; అయితే స్థితిని సూచించే అనువాదం కూడా సాధ్యమే.
theological_decisions:
- issue: పరస్పర ఒడంబడిక సూత్రాన్ని అనువదించడం
  choice: నీ ప్రజలుగా ... వారికి దేవుడివయ్యావు
  alternative: నీ ప్రజలుగా ... వారికి దేవుడిగా ఉన్నావు
  rationale: వాక్యం ఇశ్రాయేలు యెహోవా ప్రజలుగా, యెహోవా ఇశ్రాయేలు దేవునిగా ఉన్న పరస్పర ఒడంబడిక సంబంధాన్ని చెబుతుంది. సందర్భంలోని స్థాపన భావాన్ని ప్రధాన పాఠం చూపుతుంది; హీబ్రూ క్రియకు సాధ్యమైన స్థితివాచక భావాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: దైవనామాన్ని సూచించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం YHWH ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని పారదర్శకంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని לְךָ పునరుక్తిని ‘నీ కోసమే ... నీ ప్రజలుగా’ అని నిలిపి, అసహజమైన పదక్రమాన్ని నివారించాం. దైవనామానికి ‘యెహోవా’ రూపాన్ని వాడాం; היה + ל లోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సూచించాం.
