- from: నీవు నీ ప్రజలైన ఇశ్రాయేలును నీ కోసమే శాశ్వతంగా నీ ప్రజలుగా స్థిరపరిచావు; నీవు, యెహోవా[a], వారికి దేవుడివయ్యావు[b].
