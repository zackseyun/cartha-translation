- from: అప్పుడు, ‘సేనల యాహ్వే ఇశ్రాయేలుపై దేవుడు’ అని ప్రజలు చెప్పేలా, నీ నామం ఎప్పటికీ మహోన్నతమగుగాక[a]. నీ సేవకుడైన దావీదు ఇల్లు[b] నీ సన్నిధిలో స్థిరంగా ఉండుగాక.
