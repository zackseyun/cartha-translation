source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: te
  text: ‘సేనల యాహ్వే ఇశ్రాయేలుపై దేవుడై ఉన్నాడు’ అని చెప్పబడునట్లు నీ నామం ఎప్పటికీ మహోన్నతమగుగాక[a]. నీ సేవకుడైన దావీదు ఇల్లు[b] నీ సన్నిధిలో స్థిరంగా ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామం ఎప్పటికీ గొప్పదిగా చేయబడుగాక.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ఇల్లు” అంటే కేవలం ఒక కట్టడం కాదు; దావీదు కుటుంబాన్ని లేదా రాజవంశాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל
  choice: మహోన్నతమగుగాక
  rationale: ప్రార్థన సందర్భంలోని ఆశార్థక భావాన్ని ‘గాక’తో వ్యక్తం చేస్తూ, దేవుని నామం గొప్పదిగా వెల్లడింపబడాలనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שִׁמְךָ
  choice: నీ నామం
  rationale: హెబ్రీయ భాషలో ఇది కీర్తి, ప్రతిష్ఠ, వెల్లడైన వ్యక్తిత్వాన్ని కూడా సూచించగలిగినా, మూలంలోని విస్తృత భావాన్ని నిలుపుకోవడానికి ‘నామం’ అని ఉంచబడింది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: అంతులేని కాలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לֵאמֹר
  choice: అని ప్రజలు చెప్పేలా
  rationale: తరువాత వచ్చే ప్రకటనతో ఉన్న ఉద్ధరణ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ఎవరు చెబుతారో మూలంలో వ్యక్తంగా లేకపోయినా, తెలుగు వాక్య నిర్మాణం కోసం సాధారణ కర్తగా ‘ప్రజలు’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన రూపంలో లిప్యంతరీకరించబడింది.
- source_word: צְבָאוֹת
  choice: సేనల
  rationale: దైవ బిరుదులోని విస్తృతమైన ‘సమూహాలు/సేనలు’ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై దేవుడు
  rationale: עַל ఇక్కడ అధికారాన్ని, సార్వభౌమాధికారాన్ని సూచించడాన్ని ‘పై’ సహజంగా నిలుపుతుంది.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: నీ సేవకుడైన దావీదు ఇల్లు
  rationale: ఈ అధ్యాయంలోని ‘ఇల్లు’ అనే పదప్రయోగాన్ని నిలుపుతూ, అది దావీదు కుటుంబం లేదా రాజవంశాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: יִהְיֶה נָכוֹן
  choice: స్థిరంగా ఉండుగాక
  rationale: నిలకడగా, దృఢంగా స్థాపించబడి ఉండాలనే భావాన్ని ప్రార్థనాత్మక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: దేవుని ఎదుట, ఆయన సమక్షంలో నిలిచే సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉన్నందున, దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: దావీదు ‘ఇల్లు’ అనే పదం భావం
  choice: ప్రధాన పాఠంలో ‘ఇల్లు’ను ఉంచి, పాదటిప్పణిలో రాజవంశ భావాన్ని వివరించడం
  alternative: వంశం; రాజవంశం
  rationale: 2 సమూయేలు 7లో మందిరం/గృహం మరియు రాజవంశం మధ్య ఉన్న పదక్రీడను కాపాడుతూ, ఉద్దేశించిన వంశపారంపర్య భావాన్ని పాఠకునికి స్పష్టం చేస్తుంది.
- issue: יִהְיֶה נָכוֹן లోని స్థిరత్వ భావం
  choice: స్థిరంగా ఉండుగాక
  alternative: స్థాపించబడుగాక; దృఢపరచబడుగాక
  rationale: దావీదు ఇంటి స్థిరత్వం కోసం చేసే ప్రార్థనను నిలుపుతూ, అది ఎలా స్థిరపరచబడుతుందో మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలి వాడబడింది. ‘గాక’ రూపాలు ఆశార్థక హెబ్రీయ భావాన్ని నిలుపుతాయి. దైవ నామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది; అధ్యాయంలోని పదక్రీడ కోసం ‘ఇల్లు’ ప్రధాన పాఠంలో నిలుపబడింది.
