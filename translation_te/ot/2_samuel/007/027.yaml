source:
  edition: WLC
  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: te
  text: ఎందుకంటే సేనల యెహోవా, ఇశ్రాయేలు దేవా, “నేను నీకు ఇల్లు కడతాను”[b] అని నీవు నీ సేవకునికి వెల్లడించావు.[a] అందువల్ల నీ సేవకుడు నీకు ఈ ప్రార్థన చేయడానికి ధైర్యం తెచ్చుకున్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ సేవకుని చెవిని తెరిచావు”; ఇది అతనికి ఒక విషయం తెలియజేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “ఇల్లు” అనే పదం ఈ సందర్భంలో గృహాన్నే కాక రాజవంశాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నీ సేవకుడు తన హృదయాన్ని కనుగొన్నాడు”; అంటే ప్రార్థించడానికి ధైర్యం లేదా మనోనిశ్చయం పొందాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: సేనల యెహోవా
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, צְבָאוֹת అనే బిరుదును ‘సేనలు’గా సహజమైన తెలుగు నిర్మాణంలో ఉంచింది; దాని పరిధిని కేవలం మానవ సైన్యాలకు పరిమితం చేయలేదు.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవా
  rationale: ప్రార్థనలోని ప్రత్యక్ష సంబోధనను తెలుగులో సహజమైన సంబోధనా రూపంతో నిలిపింది.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: నీ సేవకునికి వెల్లడించావు
  rationale: అక్షరార్థంగా ‘నీ సేవకుని చెవిని తెరిచావు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు అర్థాన్ని ఇచ్చింది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు / నీ సేవకునికి
  rationale: రాజైన దావీదు దేవుని ఎదుట తనను తాను వినయంగా పేర్కొనే ప్రార్థనా సందర్భానికి ‘సేవకుడు’ సరిపోతుంది.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: నేను నీకు ఇల్లు కడతాను
  rationale: ‘ఇల్లు’ అనే పదాన్ని ఆలయం లేదా వంశం అని నిర్దిష్టం చేయకుండా ఉంచి, సందర్భంలోని ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కాపాడింది.
- source_word: עַל כֵּן
  choice: అందువల్ల
  rationale: దేవుడు వెల్లడించిన వాగ్దానానికి దావీదు ప్రార్థన ప్రతిస్పందనగా వచ్చిన తార్కిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: ధైర్యం తెచ్చుకున్నాడు
  rationale: అక్షరార్థంగా ‘తన హృదయాన్ని కనుగొన్నాడు’ అనే హీబ్రూ నుడికారం ఇక్కడ ప్రార్థించడానికి ధైర్యం లేదా మనోనిశ్చయం పొందడాన్ని సూచిస్తుంది.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: నీకు ఈ ప్రార్థన చేయడానికి
  rationale: ప్రార్థన దేవునికే ఉద్దేశించబడిందని, ఇదే ప్రస్తుతం పలుకుతున్న ప్రార్థన అని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఇల్లు’ అనే పదంలోని ఒడంబడిక సంబంధిత ద్వంద్వార్థం
  choice: ఇల్లు
  alternative: ఆలయం; వంశం
  rationale: ఈ సందర్భంలో בַּיִת భవనాన్నీ రాజవంశాన్నీ ప్రతిధ్వనింపజేస్తుంది. ఒకే అర్థానికి పరిమితం చేస్తే మూలంలోని ధార్మిక ఉద్వేగం, పదప్రయోగం పోతాయి.
- issue: దైవిక వెల్లడిని తెలిపే హీబ్రూ నుడికారం
  choice: నీ సేవకునికి వెల్లడించావు
  alternative: నీ సేవకుని చెవిని తెరిచావు
  rationale: అక్షరానువాదం ఆధునిక తెలుగులో అపార్థానికి దారితీయవచ్చు. ప్రధాన పాఠంలో భావాన్ని స్పష్టంగా ఇచ్చి, మూల రూపాన్ని పాదసూచికలో నిలిపింది.
- issue: హృదయాన్ని కనుగొనడం అనే నుడికారం
  choice: ధైర్యం తెచ్చుకున్నాడు
  alternative: తన హృదయాన్ని కనుగొన్నాడు; తన మనసులో నిశ్చయించుకున్నాడు
  rationale: ఈ ప్రార్థన చేయడానికి దావీదు పొందిన ధైర్యం లేదా మనోనిశ్చయాన్ని సహజంగా తెలియజేస్తూ, భావాన్ని ఒకే మానసిక స్థితికి అతిగా పరిమితం చేయకుండా పాదసూచికలో మూల నుడికారాన్ని చూపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘దేవా’ అనే సంబోధన, ‘నీ సేవకుడు’ అనే వినయపూర్వక స్వీయప్రస్తావన నిలిపివేయబడ్డాయి. అపరిచితమైన హీబ్రూ నుడికారాలు ప్రధాన పాఠంలో సహజంగా అనువదించి, పాదసూచికల్లో అక్షరార్థాన్ని ఇచ్చాం.
