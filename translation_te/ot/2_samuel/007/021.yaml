base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: te
  text: నీ మాట కారణంగా, నీ హృదయానుసారంగా[a], నీ సేవకునికి తెలియజేయడానికి నీవు ఈ మహత్కార్యమంతటినీ[b] చేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, నీ స్వంత ఉద్దేశం లేదా సంకల్పం ప్రకారం.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో ఏకవచన భావం: ‘ఈ గొప్పతనమంతటినీ’; దీనిని సమగ్ర మహత్కార్యాన్ని సూచించేలా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: నీ మాటను బట్టి
  rationale: בַּעֲבוּר కారణం లేదా ఆధారాన్ని సూచిస్తుంది; דָּבָר ఇక్కడ దేవుడు పలికిన మాటను, సందర్భానుసారంగా వాగ్దానాన్ని కూడా సూచించవచ్చు. ‘నీ మాటను బట్టి’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וּכְלִבְּךָ
  choice: నీ హృదయానుసారంగా
  rationale: לֵב అంతరంగ ఉద్దేశం, సంకల్పం లేదా చిత్తాన్ని సూచిస్తుంది. మూలంలోని ‘హృదయం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: עָשִׂיתָ
  choice: నీవు చేసి
  rationale: పూర్తయిన కార్యాన్ని సూచించే క్రియను, తదనంతర ఉద్దేశ్యక్రియతో సహజంగా అనుసంధానించే తెలుగు రూపం.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: ఈ గొప్ప కార్యమంతటినీ
  rationale: גְּדוּלָּה ఏకవచన భావనను కలిగి దేవుని మహాకార్యాన్ని సమగ్రంగా సూచిస్తుంది. ‘గొప్ప కార్యమంతటినీ’ తెలుగు సహజత్వంతో ఆ ఏకీకృత భావాన్ని కాపాడుతుంది.
- source_word: לְהוֹדִיעַ
  choice: తెలియజేశావు
  rationale: ידע హిఫిల్ రూపంలోని ‘తెలిసేలా చేయడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకునికి
  rationale: రాజప్రార్థన సందర్భంలో దావీదు దేవుని ఎదుట తనను వినయంగా సూచించుకునే స్థిరమైన, సందర్భోచిత పదం.
theological_decisions:
- issue: నిబంధన సందర్భంలో ‘నీ మాట’ సూచన
  choice: నీ మాటను బట్టి
  alternative: నీ వాగ్దానాన్ని బట్టి
  rationale: సందర్భం దేవుడు దావీదుతో పలికిన నిబంధనాత్మక వాక్యాన్ని సూచించినా, హెబ్రీ మూలం ‘మాట’ అనే విస్తృత పదాన్నే వాడుతుంది. అందువల్ల దాన్ని ‘వాగ్దానం’గా మాత్రమే పరిమితం చేయలేదు.
- issue: దేవుని గురించి ‘నీ హృదయానుసారంగా’ అనే మానవరూపక భాష
  choice: నీ హృదయానుసారంగా
  alternative: నీ సంకల్పానుసారంగా
  rationale: మూలం దేవుని అంతరంగ ఉద్దేశాన్ని ‘హృదయం’ అనే రూపకంతో చెబుతుంది. దాన్ని అమూర్తమైన ‘సంకల్పం’గా మార్చకుండా మూల రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన శైలి. ‘హృదయం’ అనే హెబ్రీ రూపకాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించేందుకు ‘గొప్ప కార్యమంతటినీ’ ఉపయోగించబడింది.
