  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: te
  text: రాజు తన ఇంటిలో[a] నివసిస్తూ ఉండగా, యాహ్వే అతని చుట్టుపక్కల ఉన్న శత్రువులందరి నుండి అతనికి విశ్రాంతి కలిగించాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన రాజభవనంలో.’ హీబ్రూలో ‘తన ఇంటిలో’; ఈ అధ్యాయంలో తరువాత వచ్చే ‘ఇల్లు’ అనే పదంతోనున్న పదప్రయోగ సంబంధాన్ని కాపాడటానికి ప్రధాన పాఠంలో ‘ఇల్లు’నే ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: నివసిస్తున్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రం కొత్త దృశ్యానికి కాలసంబంధ పరిచయం ఇస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చకుండా ‘-ప్పుడు’ నిర్మాణం సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יָשַׁב
  choice: నివసిస్తున్న
  rationale: ఇక్కడ క్రియ భౌతికంగా కూర్చోవడాన్ని కాక స్థిరంగా నివసించడాన్ని సూచిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక నిర్దిష్ట బిరుదు ఉంది; దావీదు అని విపులీకరించకుండా దానినే నిలిపాం.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంటిలో
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థం ‘ఇల్లు’. రాజభవనం అనే సందర్భార్థం సాధ్యమైనా, అధ్యాయమంతటా వచ్చే ‘ఇల్లు’ పదప్రయోగ సంబంధాన్ని కాపాడేందుకు ‘ఇల్లు’ నిలిపాం.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: הֵנִיחַ לוֹ
  choice: అతనికి విశ్రాంతి అనుగ్రహించాడు
  rationale: נוח హిఫీల్ రూపం విశ్రాంతిని కలిగించడం లేదా ఇవ్వడం అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది; ‘అనుగ్రహించాడు’ ఆ ప్రసాదిత విశ్రాంతిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ
  rationale: అన్ని దిక్కులలో నెలకొన్న భద్రతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִכָּל אֹיְבָיו
  choice: అతని శత్రువులందరి నుండి
  rationale: విశ్రాంతి ఏవరి నుండి లభించిందో తెలిపే మూలార్థాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో సాధారణంగా ‘ప్రభువు’ అనే బిరుదు కాక టెట్రాగ్రామటన్ అనే వ్యక్తిగత దైవనామం ఉంది. దాన్ని నామంగానే ఉంచుతూ, ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; మూల ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించినట్లు చెప్పడం లేదు.
- issue: בַּיִת లోని రాజనివాస భావఛాయ
  choice: ఇల్లు
  alternative: రాజభవనం
  rationale: సందర్భంలో రాజు నివాసం కావడంతో ‘రాజభవనం’ సాధ్యమే. అయితే ‘ఇల్లు’ మూలపదానికి దగ్గరగా ఉండటంతోపాటు తరువాతి వచనాల్లో దేవుని ఇల్లు, దావీదు వంశగృహం మధ్యనున్న సాహిత్య మరియు ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నప్పటికీ, తెలుగు ప్రచురణలో స్వతంత్ర వచనంగా చదవదగినట్లు ముగింపు విరామచిహ్నం వాడబడింది.
