- from: రాజు తన ఇంటిలో[a] నివసిస్తున్నప్పుడు, యెహోవా అతని శత్రువులందరి నుండి చుట్టూ అతనికి విశ్రాంతి అనుగ్రహించాడు.
  to: రాజు తన ఇంటిలో[a] నివసిస్తూ ఉండగా, యాహ్వే అతని చుట్టుపక్కల ఉన్న శత్రువులందరి నుండి అతనికి విశ్రాంతి కలిగించాడు,
  rationale: The revision preserves the Hebrew temporal clause and its continuation into the next verse, improves the idiomatic expression of rest from enemies on every side, and renders יהוה consistently as “యాహ్వే.” The house/palace alternative and the chapter’s wordplay are retained in the footnote.
