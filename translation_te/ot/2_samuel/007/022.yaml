source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: te
  text: అందుచేత, ప్రభువైన యెహోవా, నీవు గొప్పవాడవు[a]; ఎందుకంటే మా చెవులతో మేము విన్నవాటన్నిటిని బట్టి నీవంటివాడు ఎవరూ లేరు, నీవు తప్ప మరే దేవుడూ లేడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీవు నీ గొప్పతనాన్ని కనబరిచావు.”'
    reason: గָּדַלְתָּ అనే క్రియ దేవుని గొప్పతనాన్ని స్థితిగా ప్రకటించవచ్చు లేదా ఆయన తనను గొప్పవాడిగా కనబరచుకున్నాడనే భావాన్ని ఇవ్వవచ్చు.
  - marker: b
    text: 'లేదా: “నీవు తప్ప ఏ దేవుడూ లేడు”; “నీకు వేరుగా దేవుడు లేడు.”'
    reason: זוּלָתֶךָ అనే పదానికి ‘తప్ప,’ ‘కాకుండా,’ ‘వేరుగా’ అనే సమీప భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి సందర్భంలో చెప్పబడిన దేవుని కార్యాలనుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גָּדַלְתָּ
  choice: నీవు గొప్పవాడవు
  rationale: Qal perfect ఇక్కడ దేవుని గొప్పతనాన్ని గుర్తించి ప్రకటించే ఫలితస్థితిని సూచిస్తుంది; గౌరవప్రదమైన స్తుతి భాషను నిలుపుతుంది.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: אֲדֹנָי అనే అధికార బిరుదును, יהוה అనే దైవ నామాన్ని రెండింటినీ స్పష్టంగా ఉంచి, తెలుగులో సహజమైన సంయుక్త సంబోధనగా అందిస్తుంది.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో భావాన్ని కలిపాం
  rationale: ఇది ముందటి ప్రకటనకు ఆధారాన్ని పరిచయం చేస్తుంది. తెలుగులో రెండవ వాక్యం మరియు ‘విన్నదంతటినిబట్టి’ అనే నిర్మాణం ఆ వివరణాత్మక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: אֵין כָּמוֹךָ
  choice: నీవంటివాడు ఎవరూ లేరు
  rationale: దేవుని సాటిలేనితనాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని స్పష్టమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: నీవు తప్ప వేరే దేవుడు లేడు
  rationale: זוּלָתֶךָ లోని ‘తప్ప/కాకుండా’ అనే మినహాయింపు భావాన్ని, ఏకైక దేవుని గురించిన ప్రత్యక్ష ఒప్పుకోలును కాపాడుతుంది.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: మేము మా చెవులతో విన్నదంతటినిబట్టి
  rationale: בְּ యొక్క ఆధారార్థాన్ని ‘బట్టి’తో, ‘మా చెవులతో’ అనే ఉద్ఘాటనాత్మక హీబ్రూ నుడికారాన్ని తొలగించకుండా నిలుపుతుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוִה లోని దైవ నామం
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన దేవుడు; సర్వాధికారియైన యెహోవా
  rationale: మూలపాఠంలో ఉన్న יהוה అనే వ్యక్తిగత దైవ నామాన్ని లుప్తం చేయకుండా, אֲדֹנָי అనే బిరుదుతో దాని భేదాన్ని కాపాడుతుంది.
- issue: אֵין אֱלֹהִים זוּלָתֶךָ లోని ఏకదైవ ప్రత్యేకత
  choice: నీవు తప్ప వేరే దేవుడు లేడు
  alternative: నీవు తప్ప ఏ దేవుడూ లేడు; నీకు వేరుగా దేవుడు లేడు
  rationale: మూలంలోని ప్రత్యేకతను నేరుగా ప్రకటిస్తుంది; తరువాతి తాత్త్విక నిర్వచనాలను ఇందులోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘మా చెవులతో’ అనే మూలంలోని ఉద్ఘాటనను ఉద్దేశపూర్వకంగా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
