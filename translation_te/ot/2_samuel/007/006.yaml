  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת לְ֠/מִ/יּוֹם הַעֲלֹתִ֞/י אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶֽהְיֶה֙ מִתְהַלֵּ֔ךְ בְּ/אֹ֖הֶל וּ/בְ/מִשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: te
  text: ఎందుకంటే, నేను ఇశ్రాయేలు కుమారులను[a] ఐగుప్తులోనుండి పైకి తీసుకొచ్చిన రోజు మొదలుకొని ఈ రోజు వరకు ఒక ఇంటిలో నివసించలేదు; గుడారంలోను, నివాసస్థలంలోను[b] సంచరిస్తూ ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులను” లేదా “ఇశ్రాయేలు సంతతిని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నివాసగుడారంలోను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: నివసించలేదు
  rationale: ישׁב ఇక్కడ ఒక ఇంటిలో స్థిరంగా ఉండడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: בְּבַיִת
  choice: ఒక ఇంటిలో
  rationale: హీబ్రూలో నామవాచకం నిర్దిష్టంగా లేదు. ‘దేవాలయం’ అని అనువదిస్తే సందర్భార్థాన్ని పదంలోకి ముందుగానే చేర్చినట్లవుతుంది.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: నేను ... పైకి తీసుకొచ్చిన రోజు మొదలుకొని
  rationale: ఈ పదబంధం కాలారంభాన్ని తెలియజేస్తుంది; עלה హిఫీల్ రూపం నిర్గమన సందర్భంలో ‘పైకి తీసుకొచ్చు’ అనే భావాన్ని ఇస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: హీబ్రూ రూపంలోని ‘కుమారులు’ అనే నిర్మాణాన్ని నిలుపుతూ, అది ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి
  rationale: మూలంలోని ‘నుండి’ భావాన్ని సహజమైన తెలుగు విభక్తితో తెలియజేస్తుంది.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: కొనసాగుతున్న కాలపరిమితిని తెలిపే హీబ్రూ ప్రయోగానికి ఇది సూటి, సహజ తెలుగు సమానం.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: సంచరిస్తూ ఉన్నాను
  rationale: హిత్పయేల్ కృదంతం నిరంతర చలనాన్ని సూచిస్తుంది. స్థిరమైన ఇంటిలో నివసించకపోవడానికి వ్యతిరేకంగా, కొనసాగుతున్న సంచార భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: בְּאֹהֶל
  choice: గుడారంలో
  rationale: אֹהֶל యొక్క ప్రాథమిక అర్థం ‘గుడారం’; సంచార పరిశుద్ధస్థల నేపథ్యానికి సరిపోతుంది.
- source_word: וּבְמִשְׁכָּן
  choice: నివాసస్థలంలోను
  rationale: מִשְׁכָּן యొక్క మూలార్థమైన ‘నివాసస్థలం’ను నిలుపుతుంది; సందర్భానుసారమైన ‘మందిరపు గుడారం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క లింగసూచక రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పురుష బహువచన నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, సమూహార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: מִשְׁכָּן అనే ఆరాధనా పదం
  choice: నివాసస్థలం
  alternative: మందిరపు గుడారం
  rationale: ఈ పదానికి సాధారణంగా ‘నివాసస్థలం’ అనే అర్థమూ, ఈ సందర్భంలో తరలించగల పరిశుద్ధస్థలం అనే ప్రత్యేక భావమూ ఉన్నాయి. ప్రధాన పాఠం మూలార్థాన్ని, పాదసూచిక ఆరాధనా సందర్భార్థాన్ని కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. దేవాలయమనే వ్యాఖ్యానాన్ని ముందుగానే పాఠ్యంలో చేర్చకుండా ‘ఇల్లు’ను నిలిపింది; אֹהֶל మరియు מִשְׁכָּן అనే రెండు పదాల భేదాన్నీ కాపాడింది.
