id: 2SA.7.12
reference: 2 Samuel 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: te
  text: నీ దినాలు పూర్తయి, నీవు నీ పితరులతో కలిసి నిద్రించినప్పుడు[a], నీ తరువాత వచ్చే నీ సంతానాన్ని[b]—నీ సొంత శరీరం నుంచి పుట్టిన వానిని[c]—నేను లేపి నిలబెడతాను; అతని రాజ్యాన్ని స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితరులతో కలిసి నిద్రించడం’ అనేది మరణించి పూర్వీకుల సరసన చేరడాన్ని సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: b
    text: ‘సంతానం’కు హీబ్రూలో అక్షరార్థం ‘విత్తనం.’ ఇది సంతతిని సమూహంగా గానీ, ఒక ప్రతినిధి వారసుణ్ణి గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: మూలంలో ‘నీ అంతర్భాగాల నుంచి’ అని ఉంది; ఇది నీ స్వంత శరీరసంబంధ సంతానాన్ని సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: నీ రోజులు నిండిపోయి ... నిద్రించినప్పుడు
  rationale: כִּי ఇక్కడ కారణాన్ని కాక భవిష్యత్తులో జరిగే సందర్భాన్ని పరిచయం చేస్తుంది. ‘రోజులు నిండిపోవడం’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలిపి ఉంచింది.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: నీవు నీ పితరులతో కలిసి నిద్రించినప్పుడు
  rationale: ఇది మరణాన్ని సూచించే హీబ్రూ నానుడి. రూపకాన్ని నిలుపుతూ, ‘కలిసి’ అనే పదంతో పితరుల సరసన చేరడమనే భావాన్ని తెలుగులో స్పష్టంగా చేసింది.
- source_word: וַהֲקִימֹתִי
  choice: నేను నిలబెడతాను
  rationale: హిఫీల్ రూపం వారసుణ్ణి ఉద్భవింపజేసి అతని స్థానంలో నిలబెట్టడాన్ని సూచిస్తుంది. ‘నిలబెడతాను’ వారసత్వ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זַרְעֲךָ
  choice: నీ సంతానం
  rationale: זֶרַע సమూహార్థంలోనూ, ఒక ప్రతినిధి వారసుణ్ణి సూచించే ఏకవచనార్థంలోనూ పనిచేయగలదు. ‘సంతానం’ ఈ భావవిస్తృతిని కాపాడుతుంది.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: నీ సొంత శరీరం నుంచి పుట్టే
  rationale: మూలంలో అక్షరార్థంగా ‘నీ అంతర్భాగాల నుంచి బయలుదేరే’ అని ఉంది; ఇది దావీదు శరీరసంబంధ సంతానాన్ని సూచించే నానుడి. ఆధునిక తెలుగులో స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: וַהֲכִינֹתִי אֶת־מַמְלַכְתּוֹ
  choice: అతని రాజ్యాన్ని స్థిరపరుస్తాను
  rationale: כון హిఫీల్ రూపం దృఢపరచడం లేదా స్థిరంగా నెలకొల్పడం అనే భావాన్ని ఇస్తుంది. ‘స్థిరపరుస్తాను’ రాజవంశ వాగ్దాన సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: దావీదుకు ఇచ్చిన వాగ్దానంలో זַרְעֲךָ పరిధి
  choice: నీ సంతానం
  alternative: నీ వంశస్థుడు / నీ సంతతి
  rationale: హీబ్రూ పదం సమూహ సంతతినీ, ప్రతినిధి ఏకవచన వారసుణ్ణీ సూచించగలదు. తరువాతి ‘అతని రాజ్యం’ ఒక వ్యక్తిని ముందుకు తెచ్చినా, ‘సంతానం’ తక్షణ వారసుడు మరియు విస్తృత రాజవంశ పరంపర మధ్యనున్న మూలపాఠ్య ఉద్వేగాన్ని అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన వాగ్దాన స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మరణ నానుడి మరియు ‘రోజులు నిండిపోవడం’ అనే హీబ్రూ రూపకాలు వివరణాత్మక పాదసూచిక సహాయంతో నిలిపి ఉంచబడ్డాయి.
