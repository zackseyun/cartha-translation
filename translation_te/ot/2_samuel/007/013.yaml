source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: te
  text: అతడు నా నామం కొరకు ఒక ఇల్లు[a] కడతాడు; నేను అతని రాజ్యపు సింహాసనాన్ని ఎల్లకాలము స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఇల్లు” సందర్భానుసారంగా మందిరాన్ని సూచిస్తుంది. హీబ్రూలో ఇదే పదం ఈ అధ్యాయంలో మందిరాన్ని, రాజవంశాన్ని సూచించే పదప్రయోగంలోనూ వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: అతడు
  rationale: స్వతంత్ర తృతీయ పురుష ఏకవచన పుంలింగ సర్వనామాన్ని సహజమైన తెలుగులో స్పష్టమైన కర్తగా అనువదించింది; అనవసరమైన ఉద్ఘాటనను జోడించలేదు.
- source_word: יִבְנֶה
  choice: కడతాడు
  rationale: వాగ్దాన సందర్భంలో భవిష్యత్ కార్యాన్ని సూచించే ఖల్ అసంపూర్ణ క్రియకు సహజమైన తెలుగు భవిష్యత్ రూపం.
- source_word: בַּיִת
  choice: ఒక మందిరం
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘ఇల్లు’; ఇక్కడ అది యెహోవా ఆరాధన మందిరాన్ని సూచిస్తుంది. తెలుగులో ‘నా నామం కోసం ఒక ఇల్లు’ అసహజంగా, సాధారణ నివాసంగా అపార్థమయ్యే అవకాశం ఉన్నందున ప్రధాన పాఠ్యంలో ‘మందిరం’ వాడి, మూలంలోని ‘ఇల్లు’ పదప్రయోగాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: ל ఉపసర్గతో కూడిన ‘నా నామం’ అనే నిబంధనాత్మక-దైవశాస్త్రీయ నుడికారాన్ని అతిగా వివరణ చేయకుండా నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְכֹנַנְתִּי
  choice: నేను ... స్థిరపరుస్తాను
  rationale: వాగ్దాన క్రమంలో భవిష్యత్ భావం కలిగిన క్రియను రాజాధికారాన్ని దృఢంగా నిలబెట్టే అర్థంతో అనువదించింది.
- source_word: אֶת כִּסֵּא
  choice: సింహాసనాన్ని
  rationale: రాజసంబంధ సందర్భంలో כִּסֵּאకు నేరమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: מַמְלַכְתּוֹ
  choice: అతని రాజ్య
  rationale: రాజ్యం లేదా రాజాధికార పరిధిని సూచించే పదాన్ని ‘సింహాసనం’తో సహజంగా కలిసే విధంగా అనువదించింది.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: దావీదు నిబంధన వాగ్దానంలోని నిరంతరత్వ బలాన్ని తగ్గించకుండా స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בַּיִתను ‘ఇల్లు’గా ఉంచాలా, సందర్భానుసారంగా ‘మందిరం’గా అనువదించాలా
  choice: మందిరం
  alternative: ఇల్లు
  rationale: తక్షణ సందర్భంలో సొలొమోను నిర్మించబోయే ఆరాధన మందిరమే ఉద్దేశం. అయితే అధ్యాయమంతటా ‘ఇల్లు’ అనే పదం మందిరం మరియు వంశం అనే రెండు భావాలతో చేసే సాహిత్య-దైవశాస్త్రీయ పదప్రయోగాన్ని పాదటిప్పణి స్పష్టంగా సంరక్షిస్తుంది.
- issue: עַד עוֹלָם యొక్క బలం
  choice: శాశ్వతంగా
  alternative: చాలా కాలం వరకు
  rationale: ఈ నిబంధనాత్మక సందర్భంలో మాట శాశ్వత కొనసాగింపుతో కూడిన వాగ్దానాన్ని వ్యక్తం చేస్తుంది; దానిని కేవలం సుదీర్ఘమైన అనిర్దిష్ట కాలంగా బలహీనపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాగ్దాన శైలి. ‘నామం,’ ‘రాజ్య సింహాసనం,’ ‘శాశ్వతంగా’ వంటి బైబిలు భావభారం గల పదాలను సాధారణ పాఠకులకు అర్థమయ్యే రూపంలో ఉంచింది.
