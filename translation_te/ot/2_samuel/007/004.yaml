  yaml_path: translation/ot/2_samuel/007/004.yaml
  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: te
  text: 'అయితే, ఆ రాత్రి యాహ్వే వాక్కు నాతానుకు వచ్చింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: అయితే ... వచ్చింది
  rationale: మొదటి וַיְהִי కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి వచనంలో నాతాను ఇచ్చిన సమ్మతికి ఇప్పుడు వచ్చే దైవవాక్యం వ్యతిరేక మలుపు కావడంతో ‘అయితే’ సహజంగా ఉంది. రెండవ וַיְהִי ను తెలుగు ప్రవచన సూత్రానికి తగినట్లుగా ‘వచ్చింది’గా వ్యక్తం చేశాం.
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: అక్షరార్థమైన ‘ఆ రాత్రిలో’ కంటే ఆధునిక తెలుగులో ‘ఆ రాత్రి’ సహజంగా ఉండి, నిర్దిష్ట కాలసూచనను నిలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: דָּבָר యొక్క ప్రకటనాత్మక, దైవిక భావాన్ని ‘వాక్కు’ నిలుపుతుంది; ‘సందేశం’ కంటే ఇది ప్రవచన సూత్రభాషకు దగ్గరగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֶל נָתָן
  choice: నాతానుకు
  rationale: אֶל ఇక్కడ ప్రకటనను స్వీకరించే వ్యక్తిని సూచిస్తుంది; తెలుగులో సంప్రదాన విభక్తి సహజమైన నిర్మాణం.
- source_word: לֵאמֹר
  choice: ':'
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష పలుకును పరిచయం చేసే לֵאמֹר ను తెలుగులో విడిగా ‘ఇలా చెబుతూ’ అని భారంగా చెప్పకుండా ద్విబిందువుతో సహజంగా సూచించాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ఖచ్చితమైన పురాతన ఉచ్చారణ నిర్ధారితంగా లేనందున, ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్త וַיְהִי ను తెలుగులో సహజమైన ఒకే ప్రధాన వాక్యంగా మలిచాం; ముందరి సందర్భంతో ఉన్న వ్యతిరేక మలుపును ‘అయితే’తో వెల్లడించాం.
