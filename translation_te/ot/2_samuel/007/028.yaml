  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: te
  text: ఇప్పుడు, ప్రభువైన యెహోవా, నీవే దేవుడవు. నీ మాటలు సత్యమైనవి[a]. ఈ మేలును నీ సేవకునికి చెప్పావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీ మాటలు సత్యమవుతాయి”; లేదా “నీ మాటలు నమ్మదగినవి.”'
    reason: హీబ్రూ יִהְיוּ అక్షరార్థంగా భవిష్యత్ భావాన్ని ఇవ్వవచ్చు; אֱמֶת ‘సత్యం’, ‘నమ్మకత్వం’ అనే భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: సంయుక్త దైవ సంబోధనలోని ‘ప్రభువు’ అనే బిరుదును, యెహోవా అనే దైవనామాన్ని రెండింటినీ సహజమైన తెలుగులో ప్రత్యేకంగా నిలుపుతుంది.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: నీవే దేవుడవు
  rationale: అసలు పాఠంలోని బలప్రయోగంతో కూడిన సర్వనామ నిర్మాణాన్ని ‘నీవే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דְבָרֶיךָ
  choice: నీ మాటలు
  rationale: మూలంలోని బహువచన రూపాన్ని యథాతథంగా కాపాడుతుంది; ‘వాగ్దానాలు’ అని ప్రత్యేకీకరించదు.
- source_word: יִהְיוּ אֱמֶת
  choice: సత్యమైనవి
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం సందర్భంలో స్థిరమైన వాస్తవాన్ని తెలుపగలదు. ‘సత్యమైనవి’ అనేది మాటల నిజత్వాన్నీ విశ్వసనీయతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתְּדַבֵּר
  choice: చెప్పావు
  rationale: దేవుడు ముందుగా పలికిన మాటను సూచించే సాధారణ క్రియార్థాన్ని నిలుపుతుంది; ‘వాగ్దానం చేశావు’ అనే వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: אֶל עַבְדְּךָ
  choice: నీ సేవకునితో
  rationale: దావీదు దేవుని ఎదుట తనను తాను పేర్కొనే రాజప్రార్థనా సందర్భంలో ‘సేవకుడు’ సహజమైనది. אֶל తో వచ్చిన మాటలాడే భావానికి ‘తో’ సరిపోతుంది.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: ఈ మేలును
  rationale: విశేషణాన్ని నామవాచకంగా వాడిన హీబ్రూ ప్రయోగంలోని విస్తృతతను నిలుపుతుంది; దానిని ‘వాగ్దానం’ లేదా ‘ఆశీర్వాదం’ అని పరిమితం చేయదు.
theological_decisions:
- issue: אֲדֹנָי יְהוִה లోని దైవనామం
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన దేవుడు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక దైవనామాన్ని లుప్తం చేయకుండా, దానికి ముందు ఉన్న ‘ప్రభువు’ అనే బిరుదును కూడా నిలుపుతుంది.
- issue: יִהְיוּ אֱמֶת యొక్క కాలం మరియు భావం
  choice: నీ మాటలు సత్యమైనవి
  alternative: నీ మాటలు సత్యమవుతాయి
  rationale: అసంపూర్ణ క్రియారూపానికి భవిష్యత్ భావం సాధ్యమే అయినా, ఇక్కడ దావీదు దేవుని మాటల స్థిరమైన సత్యతను ఒప్పుకుంటున్న సందర్భం వర్తమాన గుణవచనాన్ని సమర్థిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధన. వాక్యాన్ని సహజ పఠనార్థం మూడు భాగాలుగా విభజించాం; మూలంలోని ‘మేలు’ అనే ఉద్దేశపూర్వక విస్తృత పదాన్ని నిలిపాం.
