  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: te
  text: 'కాబట్టి ఇప్పుడు[a], నీవు నా సేవకుడైన దావీదుతో ఇలా చెప్పు: సేనల యాహ్వే ఇలా అంటున్నాడు: ‘నా ప్రజల మీద, ఇశ్రాయేలు మీద నాయకుడిగా ఉండడానికి, పచ్చికబయలు[b] నుండి, మంద వెనుక నడవడం నుండి నిన్ను నేను తీసుకున్నాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు.” హీబ్రూ పదబంధం కాలాన్ని సూచించడంతో పాటు సందేశంలోని తదుపరి అంశానికి మార్పును కూడా తెలియజేస్తుంది.
    reason: discourse_alternative
  - marker: b
    text: “పచ్చికబయలు” అని అనువదించిన హీబ్రూ నామవాచకం మందలు మేసే ప్రదేశాన్ని లేదా అవి ఉండే చోటును సూచించవచ్చు; అందువల్ల “మంద ఉండే చోటు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: కాలసూచనతో పాటు సందేశంలోని తదుపరి దశకు మార్పును సూచిస్తుంది; తెలుగు సహజ క్రమంలో ‘కాబట్టి ఇప్పుడు’ ఆ రెండు భావాలను నిలుపుతుంది.
- source_word: כֹּה תֹאמַר
  choice: ఇలా చెప్పాలి
  rationale: దూతకు ఇచ్చే ఆదేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְעַבְדִּי לְדָוִד
  choice: నా సేవకుడైన దావీదుతో
  rationale: עבד ఇక్కడ దావీదు దేవునికి లోబడిన సేవకుడనే గౌరవప్రదమైన సంబంధపదం; బానిసత్వాన్ని ప్రధానంగా సూచించదు.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ దూతసూత్రాన్ని ప్రత్యక్ష ప్రకటనగా సహజంగా అందిస్తుంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన యెహోవా
  rationale: צבאות యొక్క ‘సైన్యాలు’ అనే విస్తృత భావాన్ని ఉంచుతూ, తెలుగులో దైవ బిరుదుగా స్పష్టంగా వినిపిస్తుంది; అవి భూసైన్యాలా పరలోక సైన్యాలా అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: לְקַחְתִּיךָ
  choice: నిన్ను నేను తీసుకున్నాను
  rationale: దేవుడు దావీదును ఎన్నుకొని అతని పూర్వస్థితి నుంచి పైకి తీసుకువచ్చిన భావాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מִן הַנָּוֶה
  choice: పచ్చికబయలులో
  rationale: נוה ఇక్కడ మంద మేసే లేదా నివసించే ప్రదేశాన్ని సూచిస్తుంది; ‘పచ్చికబయలు’ సందర్భానుకూలమైన సహజ తెలుగు.
- source_word: מֵאַחַר הַצֹּאן
  choice: మంద వెనుక నడుస్తున్న
  rationale: ‘మంద వెనుకనుంచి/వెంబడి’ అనే హీబ్రూ కాపరి చిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: נָגִיד
  choice: నాయకుడు
  rationale: నియమించబడిన పాలకుడు లేదా అధిపతి అనే భావాన్ని ఇస్తుంది; హీబ్రూలో లేని నిర్దిష్ట ‘రాజు’ బిరుదును చేర్చదు.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: నా ప్రజల మీద, ఇశ్రాయేలు మీద
  rationale: రెండుసార్లు వచ్చిన עַל ను నిలిపి, మూలంలోని ఉద్ఘాటనను మరియు లయను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచుతుంది; ఇది తెలుగులో విస్తృతంగా గుర్తించబడే రూపం.
- issue: దావీదుకు వాడిన עבד
  choice: సేవకుడు
  alternative: బానిస
  rationale: ఈ రాజనిబంధన సందర్భంలో ఇది దేవునితో దావీదుకున్న విధేయతా సంబంధాన్ని తెలిపే గౌరవపదం; బానిసత్వ స్థితిని ముందుకు తేవడం సందర్భానికి తగదు.
- issue: נגיד యొక్క పరిపాలనా భావం
  choice: నాయకుడు
  alternative: పాలకుడు / రాజకుమారుడు
  rationale: ఈ పదం రాజసంబంధ ఛాయ కలిగినా ‘రాజు’ అనే నిర్దిష్ట బిరుదుతో సమానం కాదు; ‘నాయకుడు’ ఆ పదంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. హీబ్రూ సందేశ సూత్రాలు, కాపరి చిత్రం, చివరి భాగంలోని పునరుక్తి నిలుపబడ్డాయి. ప్రధాన వాక్యంలో [a], [b] గుర్తులు రెండూ ఉన్నాయి.
