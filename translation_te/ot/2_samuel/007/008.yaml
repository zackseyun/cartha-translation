  to: 'కాబట్టి ఇప్పుడు[a], నీవు నా సేవకుడైన దావీదుతో ఇలా చెప్పు: సేనల యాహ్వే ఇలా అంటున్నాడు: ‘నా ప్రజల మీద, ఇశ్రాయేలు మీద నాయకుడిగా ఉండడానికి, పచ్చికబయలు[b] నుండి, మంద వెనుక నడవడం నుండి నిన్ను నేను తీసుకున్నాను.’'
