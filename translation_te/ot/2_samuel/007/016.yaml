  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֶאְמַ֨ן בֵּיתְ/ךָ֧ וּ/מַֽמְלַכְתְּ/ךָ֛ עַד עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽסְאֲ/ךָ֔ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: te
  text: నీ రాజవంశమూ[a] నీ రాజ్యమూ నీ ఎదుట[b] ఎప్పటికీ స్థిరంగా నిలుస్తాయి; నీ సింహాసనం ఎప్పటికీ స్థాపించబడి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం అక్షరార్థంగా ‘నీ ఇల్లు’; ఇక్కడ అది దావీదు రాజకుటుంబ పరంపరను, అంటే అతని రాజవంశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ పాఠం: ‘నీ ఎదుట’; కొన్ని పాఠసాక్ష్యాల్లో ‘నా ఎదుట’ అని ఉంది.'
    reason: textual_variant
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: స్థిరంగా నిలుస్తాయి
  rationale: అמן ధాతువు నిఫాల్ రూపం ఇక్కడ దృఢంగా, విశ్వసనీయంగా, నిలకడగా ఉండడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘స్థిరంగా నిలుస్తాయి’ అని అనువదించి, తరువాతి נָכוֹן పదబంధంతో ఉన్న స్వల్ప భేదాన్ని నిలిపాం.
- source_word: בֵּיתְךָ
  choice: నీ రాజవంశం
  rationale: బַּיִת అనే పదానికి మూలంగా ‘ఇల్లు/ఇంటి వారు’ అనే అర్థం ఉన్నా, రాజుకు ఇచ్చిన ఈ వాగ్దానంలో అది అతని రాజకుటుంబ పరంపరను, అంటే రాజవంశాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘రాజవంశం’ ఎంచుకున్నాం; మూలపదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וּמַמְלַכְתְּךָ
  choice: నీ రాజ్యం
  rationale: מַמְלֶכֶת రాజ్యం, రాజాధికారం లేదా పరిపాలనను సూచిస్తుంది. ఈ సందర్భంలో ‘రాజ్యం’ నేరుగా, సహజంగా సరిపోతుంది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: ఈ పదబంధం నిరంతరమైన, అంతంలేని కాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎప్పటికీ’ సహజంగా ఉంది; మూలంలోని పునరుక్తిని కూడా నిలిపాం.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: అందించిన WLC పాఠం రెండవ పురుష ఏకవచన రూపంలో ‘నీ ఎదుట’ అని ఉంది. ముఖ్యమైన ‘నా ఎదుట’ అనే పాఠాంతరాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כִּסְאֲךָ
  choice: నీ సింహాసనం
  rationale: ఇది రాజు కూర్చునే ఆసనాన్నీ, దాని ద్వారా రాజాధికారాన్నీ సూచించే ప్రామాణిక పదం; ‘సింహాసనం’ రెండు భావాలనూ నిలుపుతుంది.
- source_word: יִהְיֶה נָכוֹן
  choice: స్థాపించబడి ఉంటుంది
  rationale: היה తో కూడిన נָכוֹן దృఢంగా నెలకొల్పబడిన స్థితిని సూచిస్తుంది. ‘స్థాపించబడి ఉంటుంది’ ఆ భావాన్నీ నిష్క్రియ ఛాయనూ తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ముందున్న ‘స్థిరంగా నిలుస్తాయి’తో పదభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దావీదు రాజవంశానికి ఇచ్చిన వాగ్దానం మరియు దాని సాధ్యమైన మెస్సీయ సంబంధం
  choice: ‘రాజవంశం,’ ‘రాజ్యం,’ ‘సింహాసనం’ అనే చారిత్రక-రాజకీయ భాషనే ఉంచి, మెస్సీయ నెరవేర్పును అనువాదంలో ప్రత్యక్షంగా చేర్చలేదు.
  alternative: మెస్సీయ నెరవేర్పును స్పష్టంగా సూచించేలా అనువదించడం.
  rationale: వచనం మొదట దావీదు రాజపరంపర గురించి మాట్లాడుతుంది. దానికి విస్తృతమైన మెస్సీయ ప్రాముఖ్యత ఉండవచ్చు; అయినా హీబ్రూ పాఠం స్వయంగా చెప్పినదానికంటే ఎక్కువ వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా దాని theological tensionను నిలిపాం.
- issue: לְפָנֶיךָ లోని పాఠాంతరం
  choice: అందించిన WLC పాఠాన్ని అనుసరించి ప్రధాన పాఠంలో ‘నీ ఎదుట’ ఉంచాం.
  alternative: కొన్ని పాఠసాక్ష్యాల ప్రకారం ‘నా ఎదుట’ అని చదవడం.
  rationale: మూలంగా ఇచ్చిన హీబ్రూ రూపం ‘నీ ఎదుట’ అని చదువుతుంది. దైవవాక్య సందర్భానికి సహజంగా సరిపోయే ‘నా ఎదుట’ అనే ముఖ్యమైన పాఠాంతరాన్ని మాత్రం పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. సమాంతర రాజపదాలను, ‘ఎప్పటికీ’ అనే పునరుక్తిని నిలిపి, וְנֶאְמַן మరియు נָכוֹן మధ్య ఉన్న స్వల్ప పదార్థభేదాన్ని వేర్వేరు తెలుగు వ్యక్తీకరణలతో చూపించాం.
