  to: నేను ఇశ్రాయేలు కుమారులందరి మధ్య ఎక్కడెక్కడ సంచరించానో, అక్కడ ఎన్నడైనా నా ప్రజ అయిన ఇశ్రాయేలును కాపరిలా నడిపించమని నేను ఆజ్ఞాపించిన ఇశ్రాయేలు గోత్రాల్లో ఒకదానికి[a], ‘మీరు నాకు దేవదారు కలపతో ఒక ఇల్లు ఎందుకు కట్టలేదు?’ అని ఒక్క మాటైనా చెప్పానా?
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి బֵּית్‌కు ‘ఇల్లు’ అనే విస్తృత మూలార్థాన్ని తిరిగి ఇస్తాయి, పాఠభేద సూచికను సంబంధిత పదబంధానికి జతచేస్తాయి, మరియు సంబోధనను తెలుగులో మరింత సహజంగా చేస్తాయి. MTలోని ‘గోత్రాలు’ అనే కష్టమైన పఠనం ప్రధాన పాఠంలోనే ఉంచబడింది; సమాంతర పఠనం పాదటిప్పణిలో మాత్రమే ఉంది.
