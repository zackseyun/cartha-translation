source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: te
  text: నేను ఇశ్రాయేలు కుమారులందరి మధ్య ఎక్కడెక్కడ సంచరించానో, అక్కడ ఎన్నడైనా నా ప్రజ అయిన ఇశ్రాయేలును కాపరిలా నడిపించమని నేను ఆజ్ఞాపించిన ఇశ్రాయేలు గోత్రాల్లో ఒకదానికి[a], ‘మీరు నాకు దేవదారు కలపతో ఒక ఇల్లు ఎందుకు కట్టలేదు?’ అని ఒక్క మాటైనా చెప్పానా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఇశ్రాయేలు గోత్రాల్లో ఒకదానికి’ అని ఉంది. సమాంతర వచనమైన 1 దినవృత్తాంతాలు 17:6లో ‘ఇశ్రాయేలు న్యాయాధిపతుల్లో ఒకనితో’ అని ఉంది; ప్రజలను కాపరిలా నడిపించడానికి నియమించబడిన నాయకులను అది సూచిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: సంచరించానో
  rationale: దేవుడు తన ప్రజల మధ్య స్థిర నివాసంలో కాకుండా వారితో పాటు తిరిగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּכָל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరి మధ్య ఎక్కడెక్కడ ... అక్కడ
  rationale: రెండు בְּכָל ప్రయోగాల విస్తృత భావాన్ని, సంచరించే స్థలసూచనను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ జాతీయ-నిబంధనాత్మక నామాన్ని రూపపరంగా పారదర్శకంగా ఉంచుతుంది.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: ఎన్నడైనా ... ఒక్క మాటైనా అన్నానా?
  rationale: ప్రశ్నార్థక రూపాన్నీ, సమాన మూలపదాల వల్ల కలిగే బలాన్నీ సహజ తెలుగు వాక్యంతో నిలుపుతుంది.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల్లో ఒకదానితో
  rationale: మసొరెటిక్ పాఠంలోని ‘గోత్రాలు’ అనే పదాన్ని ప్రధాన పాఠంలో యథాతథంగా అనుసరిస్తుంది; నాయకులను సూచించే సాధ్యతను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: కాపరిలా నడిపించమని నేను ఆజ్ఞాపించిన
  rationale: ‘మేపు/కాపరి’ రూపకాన్ని నిలుపుతూ, ప్రజల నాయకత్వం మరియు సంరక్షణ అనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలు
  rationale: దేవునికి చెందిన ప్రజలు అనే నిబంధనాత్మక భావాన్నీ, వారు ఇశ్రాయేలు అనే గుర్తింపునీ నిలుపుతుంది.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: మీరు నా కోసం దేవదారు మ్రానుతో ఒక మందిరాన్ని ఎందుకు కట్టలేదు?
  rationale: బహువచన సంబోధనను ‘మీరు’తో చూపి, దేవదారు పదార్థంతో చేసిన దేవుని నివాసాన్ని సందర్భానుకూలంగా ‘మందిరం’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: లింగసూచక నిబంధనాత్మక జాతీయ నామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది జాతి మొత్తాన్ని సూచించే స్థిర నామప్రయోగం.
- issue: ‘గోత్రాలు’ పాఠం మరియు నాయకులను సూచించే సందర్భం మధ్య ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో ‘గోత్రాల్లో ఒకదాని’
  alternative: ‘న్యాయాధిపతుల్లో/పాలకుల్లో ఒకనితో’
  rationale: WLC/MTలో ఉన్న שִׁבְטֵי (‘గోత్రాలు’)నే అనువదించాం. అయితే ‘కాపరిలా నడిపించమని ఆజ్ఞాపించిన’ అనే ఉపవాక్యం నాయకులను సూచిస్తుంది; 1 దినవృత్తాంతాలు 17:6లో ‘న్యాయాధిపతులు’ అని ఉండటాన్ని పాదటిప్పణిలో తెలియజేశాం.
- issue: దేవుని ‘ఇల్లు’ అనే పదానికి సందర్భానుకూల తెలుగు
  choice: మందిరం
  alternative: ఇల్లు
  rationale: בַּיִת యొక్క సాధారణ అర్థం ‘ఇల్లు’ అయినా, ఇక్కడ దేవుని కోసం నిర్మించే దేవదారు నివాసాన్ని సూచిస్తుంది. ‘మందిరం’ తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది; నిర్మిత ఆలయ వ్యవస్థకు మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కాపరిలా నడిపించు’ ద్వారా మూలంలోని పశుపాలక రూపకం నిలుపబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన వాక్యాంతంలో ఉంచబడింది.
