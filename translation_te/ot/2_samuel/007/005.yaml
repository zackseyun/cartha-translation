reference: 2 Samuel 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֤ךְ וְ/אָֽמַרְתָּ֙ אֶל עַבְדִּ֣/י אֶל דָּוִ֔ד כֹּ֖ה אָמַ֣ר יְהוָ֑ה הַ/אַתָּ֛ה תִּבְנֶה לִּ֥/י בַ֖יִת לְ/שִׁבְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: te
  text: 'నీవు వెళ్లి నా సేవకుడైన దావీదుకు ఇలా చెప్పు: ‘యాహ్వే ఇలా అంటున్నాడు: నేను నివసించడానికి ఇల్లు కట్టేది నీవేనా?[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నేను నివసించడానికి ఇల్లు కడతావా?” హీబ్రూ ప్రశ్నలో “నీవు” అనే మాటకు ప్రత్యేక ఉద్ఘాటన ఉంది; ఇది అలంకారిక ప్రశ్న.
    reason: హీబ్రూ ప్రశ్న నిర్మాణంలోని ఉద్ఘాటనను, సహజమైన మరొక తెలుగు రూపాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: నీవు వెళ్లి... ఇలా చెప్పు
  rationale: ఆజ్ఞార్థక క్రియను, దాని వెంట ఆజ్ఞార్థక బలంతో వచ్చిన క్రమవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో రెండు అనుసంధానిత ఆజ్ఞలుగా వ్యక్తపరుస్తుంది.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: నా సేవకుడైన దావీదుతో
  rationale: עבד యొక్క రాజసంబంధమైన గౌరవార్థాన్ని ‘సేవకుడు’గా నిలుపుతూ, హీబ్రూ పునరుక్త విభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ సంబంధంగా అందిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రంలోని అధికారిక స్వరాన్ని సహజ తెలుగులో నిలుపుతుంది; יהוהను బిరుదుతో మార్చకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: הַאַתָּה
  choice: నీవేనా?
  rationale: ప్రశ్నార్థక అవ్యయంతో బలపరచబడిన సర్వనామంలోని ఉద్ఘాటనను ‘ఏ’ ప్రత్యయంతో స్పష్టంగా నిలుపుతుంది.
- source_word: תִּבְנֶה לִּי בַיִת
  choice: నా కోసం ఇల్లు కట్టేది
  rationale: ביתను ‘దేవాలయం’గా ముందుగానే నిర్దిష్టం చేయకుండా ‘ఇల్లు’గా ఉంచి, అధ్యాయమంతటా వచ్చే ‘ఇల్లు’ అనే పదప్రయోగ సంబంధాన్ని కాపాడుతుంది.
- source_word: לְשִׁבְתִּי
  choice: నా నివాసం కోసం
  rationale: ישב ధాతువు యొక్క ఉద్దేశార్థక క్రియానామ నిర్మాణాన్ని స్పష్టంగా తెలుపుతుంది; దేవుడు భౌతిక స్థలానికే పరిమితుడన్న అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: בַיִת యొక్క అర్థం
  choice: ఇల్లు
  alternative: దేవాలయం
  rationale: ఇక్కడ పరిశుద్ధస్థలమే ఉద్దేశమైనా, ‘ఇల్లు’ అనే పదం మూలంలోని విస్తృతార్థాన్నీ, తరువాత దావీదు వంశాన్ని సూచించే సాహిత్య పదప్రయోగాన్నీ కాపాడుతుంది.
- issue: ప్రశ్న యొక్క ఉద్ఘాటన మరియు అలంకారిక స్వభావం
  choice: నా నివాసం కోసం ఇల్లు కట్టేది నీవేనా?
  alternative: నీవు నా నివాసం కోసం ఇల్లు కడతావా?
  rationale: הַאַתָּהలోని ఉద్ఘాటనను నిలుపుతూ, ప్రశ్నను సాధారణ భవిష్యత్ సమాచార ప్రశ్నగా మాత్రమే కాక అలంకారిక ప్రశ్నగా వినిపిస్తుంది; దాని సమస్త అంతర్భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవక్త సందేశ స్వరాన్ని సాధారణ పాఠకుడికి సహజంగా ఉండే వాక్యక్రమంతో కలిపింది. ‘ఇల్లు’ అనే కీలక పదాన్ని సాహిత్య సంబంధం కోసం నిలిపింది.
