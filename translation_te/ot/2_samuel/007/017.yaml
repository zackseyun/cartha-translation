  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: te
  text: ఈ మాటలన్నిటి ప్రకారమును, ఈ దర్శనమంతటి ప్రకారమును, నాతాను దావీదుతో అలాగే మాట్లాడాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రత్యక్షత.’ హీబ్రూ పదం ప్రవచన ప్రత్యక్షతను సూచిస్తుంది; అది తరచుగా దర్శన రూపంలో లభిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: అన్నిటి ప్రకారం
  rationale: כְּ అనురూపతను, כֹל సమగ్రతను సూచిస్తాయి. ‘అన్నిటి ప్రకారం’ అనే పదబంధం మూలంలోని అర్థాన్ని, పునరుక్తిని నిలుపుతుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: దైవిక సందేశంలోని వాచిక విషయాన్ని సూచిస్తున్నందున דְּבָרִים‌కు ‘మాటలు’ సహజమైన, సూటియైన అనువాదం.
- source_word: וּכְכֹל
  choice: ఈ ... అంతటి ప్రకారం
  rationale: హీబ్రూలోని సముచ్చయాన్ని, పునరుక్త సమాంతర నిర్మాణాన్ని తెలుగులో నిలుపుతూ, ‘ఈ దర్శనమంతటి ప్రకారం’ అని సహజంగా అమర్చబడింది.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: ఈ దర్శనమంతటి
  rationale: חִזָּיוֹן ప్రవచన సంబంధమైన దర్శనాన్ని లేదా దర్శన రూపంలో లభించిన ప్రత్యక్షతను సూచిస్తుంది. ప్రధాన పాఠంలో ‘దర్శనం’ మూలపదానికి అత్యంత ప్రత్యక్షమైన సమానం.
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందున్న రెండు ‘ప్రకారం’ పదబంధాలను తిరిగి సూచించి, నాతాను వాటికి అనుగుణంగానే మాట్లాడాడని తెలియజేస్తుంది.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: דבר‌కు సాధారణ అర్థం ‘మాట్లాడు’; కథన సందర్భంలో ఇది సహజంగా ఉంటుంది.
- source_word: נָתָן
  choice: నాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶל דָּוִד
  choice: దావీదుతో
  rationale: మాట్లాడే క్రియతో కలిసి אֶל సూచించే సంభాషణ దిశను తెలుగులో సహజంగా ‘దావీదుతో’ వ్యక్తం చేస్తుంది; ‘దావీదుకు’ మరింత రూపపరమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: חִזָּיוֹן‌లో ప్రవచన ప్రత్యక్షత స్వభావం
  choice: ప్రధాన పాఠంలో ‘దర్శనం’
  alternative: ‘ప్రత్యక్షత’ లేదా ‘ప్రవచన దర్శనం’
  rationale: మూలపదం దర్శన రూపంలో లభించే ప్రవచన ప్రత్యక్షతను సూచిస్తుంది. ‘దర్శనం’ మూలంలోని విధానాన్ని స్పష్టంగా నిలుపుతుంది; సాధారణ సందేశంగా కుదించదు, వ్యాఖ్యాత్మక విస్తరణను కూడా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని ‘ప్రకారం ... ప్రకారం ... అలాగే’ అనే సమాంతరతను సాధ్యమైనంత సహజంగా నిలుపుతూ, ‘మాటలు’ మరియు ‘దర్శనం’ మధ్య ఉన్న భావభేదాన్ని కాపాడింది.
