  source_fidelity: The added clause “ఇదే విధంగా చేశాను” has no counterpart in the Hebrew of v. 11 and should be removed. The temporal phrase is singular (“from the day”), and the announcement should retain Yahweh as the subject of both “declares” and “will make/establish.”
