reference: 2 Samuel 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: te
  text: 'నా ప్రజలైన ఇశ్రాయేలుపై నేను న్యాయాధిపతులను నియమించిన దినం నుంచీ, నీ శత్రువులందరి నుండి నీకు విశ్రాంతి కలిగించాను. అంతేకాక, యాహ్వే నీకు ప్రకటిస్తున్నాడు: యాహ్వే నీకు ఒక గృహాన్ని[a] ఏర్పాటు చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకు ఒక గృహాన్ని కడతాడు.’ ఇక్కడ ‘గృహం’ దావీదు రాజవంశాన్ని సూచించవచ్చు; అదే సమయంలో యాహ్వేకు గృహం, అంటే మందిరం, కట్టాలన్న దావీదు కోరికను కూడా ప్రతిధ్వనిస్తుంది.
    reason: బַּיִת అనే పదంలోని భవనం–రాజవంశం ద్వంద్వార్థాన్ని వివరించడానికి.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: నేను న్యాయాధిపతులను నియమించిన రోజులనుంచి
  rationale: צוה యొక్క ప్రాథమిక భావం ‘ఆజ్ఞాపించు’ అయినా, ఇక్కడ న్యాయాధిపతులను ఇశ్రాయేలుపై ఉంచడాన్ని సూచిస్తుంది; అందువల్ల ‘నియమించిన’ సహజంగా ఉంటుంది. ‘ఆ రోజు నుంచి’ అనే హెబ్రీ ఏకవచన కాలప్రయోగాన్ని తెలుగులో సహజమైన ‘రోజులనుంచి’గా వ్యక్తం చేశాం.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుపై
  rationale: עַל ఇక్కడ అధికార పరిధిని సూచిస్తుంది; ‘పై’ ఆ పరిపాలనా సంబంధాన్ని నిలుపుతుంది.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: నీ శత్రువులందరి నుంచి నీకు విశ్రాంతి కలిగించాను
  rationale: నוח హిఫిల్ రూపం విశ్రాంతి లేదా ఉపశమనం కలిగించడాన్ని సూచిస్తుంది. ఈ అనువాదం దేవుని కార్యసాధక పాత్రను స్పష్టంగా ఉంచుతుంది.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: అంతేకాక, యాహ్వే నీకు ప్రకటిస్తున్నాడు
  rationale: נגד హిఫిల్ ‘తెలియజేయు/ప్రకటించు’ అనే గంభీర ప్రకటన భావాన్ని ఇస్తుంది. וְ యొక్క అనుసంధాన బలాన్ని ‘అంతేకాక’ ద్వారా చూపించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: యాహ్వే నీ కోసం ఒక గృహాన్ని ఏర్పరుస్తాడని
  rationale: עשה ను ‘ఏర్పరచు’గా అనువదించడం సహజ తెలుగు వాక్యాన్ని ఇస్తూనే, בַיִת లోని భవనం–వంశం ద్వంద్వార్థాన్ని ‘గృహం’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: దావీదుకు వాగ్దానం చేసిన בַיִת భావం
  choice: గృహం—భవనం మరియు రాజవంశం రెండింటి ప్రతిధ్వనిని నిలుపడం
  alternative: వంశం / రాజవంశం / మందిరం
  rationale: సందర్భంలో దావీదు దేవునికి మందిరం కట్టాలనుకోవడం, దేవుడు దావీదుకు వంశగృహాన్ని స్థాపిస్తానని చెప్పడం మధ్య ఉద్దేశపూర్వక పదప్రయోగం ఉంది. కేవలం ‘రాజవంశం’ లేదా ‘మందిరం’ అనడం ఆ ఉద్రిక్తతను ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. వచనం ముందు వాక్యానికి కొనసాగింపుగా మొదలవుతున్నందున ‘ఇదే విధంగా’ను చేర్చి హెబ్రీ కాలసంబంధాన్ని సహజంగా తెలిపాం; ఇది 10వ వచనంలోని పోలికకు అనుసంధానం.
