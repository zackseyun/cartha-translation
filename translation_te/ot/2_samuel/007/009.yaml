  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: te
  text: నీవు వెళ్లిన ప్రతిచోటా నేను నీతో ఉన్నాను; నీ ఎదుటనుండి నీ శత్రువులందరినీ తొలగించాను. భూమిపై ఉన్న గొప్పవారి పేరువంటి[b] గొప్ప పేరును[a] నీకు కలుగజేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప ఖ్యాతి.’ హీబ్రూలో ‘పేరు’ అనే పదం తరచుగా కీర్తి లేదా ఖ్యాతి అనే భావాన్ని కలిగి ఉంటుంది; ప్రధాన పాఠం బైబిలీయ నుడికారాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భూమిపై ఉన్న గొప్ప పురుషుల పేరువంటి.’
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: నేను ... ఉన్నాను
  rationale: היה క్రియ యొక్క కథనాత్మక భూతకాల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దేవుని సన్నిధి, సహాయం అనే రెండు ఛాయలనూ సందర్భం నిలుపుతుంది.
- source_word: עִמְּךָ
  choice: నీతో
  rationale: మూలంలోని సన్నిధి మరియు తోడ్పాటు భావాలను నేరుగా కాపాడుతుంది.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: నీవు వెళ్లిన ప్రతిచోటా
  rationale: దావీదు వెళ్లిన అన్ని ప్రదేశాలనూ పరిస్థితులనూ సూచించే హీబ్రూ ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וָאַכְרִתָה
  choice: నిర్మూలించాను
  rationale: כרת హిఫీల్ రూపం ఇక్కడ శత్రువులను పూర్తిగా తొలగించడం లేదా నాశనం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది; అసహజమైన పదశః రూపం కంటే ‘నిర్మూలించాను’ ఆ బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת כָּל אֹיְבֶיךָ
  choice: నీ శత్రువులందరినీ
  rationale: ‘అందరినీ’ అనే పదం మూలంలోని כָּל యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: అక్షరార్థంగా ‘నీ ముఖము/సన్నిధి నుండి’; శత్రువులను దావీదు ఎదుటనుండి తొలగించడమనే స్థలసంబంధ హీబ్రూ నుడికారాన్ని ఇది నిలుపుతుంది.
- source_word: וְעָשִׂיתִי לְךָ
  choice: నీకు ... కలుగజేస్తాను
  rationale: లామెద్ సూచించే ప్రయోజనార్థక భావాన్ని ‘నీకు’ కాపాడుతుంది; వాగ్దాన సందర్భంలో క్రియను భవిష్యత్తుగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֵׁם גָּדוֹל
  choice: గొప్ప పేరు
  rationale: ‘పేరు’ ఇక్కడ ఖ్యాతి లేదా ప్రఖ్యాతిని సూచించినా, బైబిలీయ నుడికారాన్నీ అంతర్వాక్య సంబంధాన్నీ నిలపడానికి ప్రధాన పాఠంలో ‘పేరు’ ఉంచబడింది.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: గొప్పవారి పేరులాంటి
  rationale: మూలంలోని ‘పేరు’ పునరుక్తిని, పోలికను కాపాడుతుంది. ‘గొప్పవారు’ అనేది హీబ్రూ substantival plural ను లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: భూమిపై ఉన్న
  rationale: אָרֶץ కు ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు; ప్రపంచంలోని ప్రసిద్ధులతో చేసే విస్తృత పోలికకు ‘భూమిపై’ తగినది.
theological_decisions:
- issue: దైవ వాగ్దాన సందర్భంలో וְעָשִׂיתִי యొక్క కాలార్థం
  choice: భవిష్యత్తుగా ‘నీకు ... కలుగజేస్తాను’
  alternative: పూర్తయిన కార్యంగా ‘నీకు ... కలుగజేశాను’
  rationale: రూపపరంగా qatal అయినప్పటికీ, గతంలో దేవుడు చేసిన కార్యాల వర్ణన నుంచి ముందున్న వాగ్దానానికి ప్రసంగం మారుతుంది; 1 దినవృత్తాంతాలు 17:8లోని సమాంతర వాక్యమూ భవిష్యత్ భావానికి మద్దతిస్తుంది. అందుచేత భవిష్యత్ రూపం ఒడంబడిక వాగ్దాన స్వభావాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘గొప్ప పేరు’ అనే బైబిలీయ నుడికారం ఉద్దేశపూర్వకంగా నిలుపబడింది. ‘గొప్పవారు’ లింగాన్ని అనవసరంగా పరిమితం చేయకుండా మూలంలోని బహువచన విశేషణ నామీకరణను ప్రతిబింబిస్తుంది. అందించిన ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు స్థానభ్రంశమైనట్లు కనిపించినందున, దాని గమనికకు సంబంధించిన ‘గొప్ప పేరు’ వద్ద గుర్తులు ఉంచబడ్డాయి.
