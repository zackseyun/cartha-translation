  source_fidelity: ముసాయిదా לָכֶם లోని రెండవ పురుష బహువచనమైన ‘మీకొరకు’ను సరిగ్గా నిలుపుతుంది; అలాగే פדהను ‘విమోచించు’గా స్థిరంగా అనువదిస్తుంది. అయితే ముగింపులో లేని రెండవ ‘వెళ్లాడు’ను చేర్చి, ‘జనాలను, వారి దేవుళ్లను తొలగించడానికి’ అనే క్రియను ప్రధాన పాఠంలో స్పష్టంగా ప్రవేశపెట్టింది. చివరి హీబ్రూ పదబంధం నిజంగా క్లిష్టమైనదైనా, ఆ అదనపు క్రియ మూలంలోని అస్పష్ట వాక్యనిర్మాణాన్ని మించిన వివరణ అవుతుంది.
  naturalness: ప్రారంభంలోని ‘ఇశ్రాయేలులా ఉన్న నీ ప్రజలవంటి వారు’ సహజంగా లేదు. సవరించిన పాఠం అలంకార ప్రశ్నను ఆధునిక, గౌరవభరితమైన తెలుగులో మరింత సూటిగా ఇస్తుంది. దీర్ఘ హీబ్రూ వాక్యాన్ని తెలుగులో చదవగలిగేలా ఉంచుతూ దాని సంబంధాలను వీలైనంత వరకు కాపాడుతుంది.
  terminology: ‘విమోచించు,’ ‘తనకొరకు ఒక ప్రజగా,’ ‘తనకు పేరు సంపాదించుకోవడం’ తగిన పదప్రయోగాలు. נוראותకు ‘భయవిస్మయాలు కలిగించే కార్యాలు’ అనేది కేవలం ప్రతికూలమైన ‘భయంకరమైన’ కంటే సందర్భానికి తగినది. ‘జనాలు, వారి దేవుళ్లు’ అనే వివాదాస్పద ముగింపు పాదసూచికతోనే పరిమితంగా వివరించబడాలి.
  issues:
  - severity: high
    issue: ముగింపులో ‘తొలగించడానికి వెళ్లాడు’ అనే అదనపు చర్య
    rationale: హీబ్రూ పాఠంలో దేవుడు ‘వెళ్లాడు’ అన్నది ఒక్కసారే ఉంది; చివరి గּוֹיִם וֵאלֹהָיו పదబంధం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. ‘తొలగించడానికి’ అనేది సమాంతర వృత్తాంతం ప్రభావంతో సాధ్యమైన వ్యాఖ్యానం అయినా, ఇక్కడ ప్రధాన పాఠంలో కొత్త క్రియను స్పష్టంగా చేర్చకూడదు.
  - severity: medium
    issue: ప్రారంభ పోలిక యొక్క అసహజ తెలుగు నిర్మాణం
    rationale: ‘ఇశ్రాయేలులా ఉన్న నీ ప్రజలవంటి వారు’లో పోలికలు ఒకదానిపై మరొకటి పడుతున్నాయి. ‘నీ ప్రజలైన ఇశ్రాయేలుకు సాటి ఎవరు?’ అదే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
  - severity: low
    issue: నוראותకు ‘భయంకరమైన’
    rationale: ఈ పదం భయంతో కూడిన విస్మయాన్ని సూచిస్తుంది; ‘భయంకరమైన’ ఆధునిక తెలుగులో కేవలం హానికరమైన లేదా భీతికరమైన అర్థాన్ని బలంగా సూచించవచ్చు.
  revised_text: భూమిమీద ఏకైక జనమైన నీ ప్రజలైన ఇశ్రాయేలుకు సాటి ఎవరు? తనకొరకు వారిని ఒక ప్రజగా విమోచించడానికి, తనకు పేరు సంపాదించుకోవడానికి, నీవు ఐగుప్తులోనుండి నీకొరకు విమోచించిన నీ ప్రజల ఎదుట నీ దేశం కోసం మీకొరకు గొప్ప, భయవిస్మయాలు కలిగించే కార్యాలు[a] చేయడానికి దేవుడు వెళ్లాడు—జనాలనుండి, వారి దేవుళ్లనుండి.[b]
  revised_footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప మరియు భయంకరమైన కార్యాలు.’ హీబ్రూ పదం విస్మయం, భీతి, లేదా భయం కలిగించే కార్యాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో చివరి పదబంధం క్లిష్టంగా ఉంది. దీనిని ‘ఐగుప్తులోనుండి—జనాలను, దాని దేవుణ్ణి’ లేదా ‘ఐగుప్తులోనుండి—జనాలను, దేవుళ్లను’ అని కూడా అర్థం చేసుకోవచ్చు. కొందరు దీనిని ఇశ్రాయేలు ఎదుటనుండి తొలగించబడిన జనాలు మరియు వారి దేవుళ్లను సూచిస్తున్నట్లు గ్రహిస్తారు.
    reason: alternative_reading
  revision_rationale: సవరణ మూలపాఠంలోని ప్రధాన క్రియను ఒక్కసారే ఉంచి, చివరి క్లిష్ట పదబంధానికి ‘తొలగించు’ వంటి వ్యాఖ్యానాత్మక క్రియను చేర్చలేదు. ‘మీకొరకు’ (לָכֶם), ‘నీ దేశం’ (לְאַרְצְךָ), ‘నీ ప్రజల ఎదుట’ (מִפְּנֵי עַמְּךָ) అనే ఉద్దేశపూర్వక పురుష-వచన మార్పులు నిలుపబడ్డాయి. ముగింపు యొక్క వివాదాస్పద అనుసంధానాన్ని పాదసూచిక స్పష్టంగా తెలియజేస్తుంది.
