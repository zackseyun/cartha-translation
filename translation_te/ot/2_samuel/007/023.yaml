revisions:
- from: భూమిమీద ఏకైక జనమైన ఇశ్రాయేలులా ఉన్న నీ ప్రజలవంటి వారు ఇంకెవరు? దేవుడు తనకొరకు ఒక ప్రజగా వారిని విమోచించడానికి వెళ్లాడు; తనకు పేరు సంపాదించుకోవడానికి, మీకొరకు గొప్పవాటిని, భయంకరమైన కార్యాలను[a] చేయడానికి, నీవు ఐగుప్తులోనుండి నీకొరకు విమోచించిన నీ ప్రజల ఎదుట నీ దేశం కోసం జనాలను, వారి దేవుళ్లను తొలగించడానికి వెళ్లాడు.[b]
  to: భూమిమీద ఏకైక జనమైన నీ ప్రజలైన ఇశ్రాయేలుకు సాటి ఎవరు? తనకొరకు వారిని ఒక ప్రజగా విమోచించడానికి, తనకు పేరు సంపాదించుకోవడానికి, నీవు ఐగుప్తులోనుండి నీకొరకు విమోచించిన నీ ప్రజల ఎదుట నీ దేశం కోసం మీకొరకు గొప్ప, భయవిస్మయాలు కలిగించే కార్యాలు[a] చేయడానికి దేవుడు వెళ్లాడు—జనాలనుండి, వారి దేవుళ్లనుండి.[b]
  rationale: సవరణ మూలపాఠంలోని ప్రధాన క్రియను ఒక్కసారే ఉంచి, చివరి క్లిష్ట పదబంధానికి ‘తొలగించు’ వంటి వ్యాఖ్యానాత్మక క్రియను చేర్చలేదు. ‘మీకొరకు’ (לָכֶם), ‘నీ దేశం’ (לְאַרְצְךָ), ‘నీ ప్రజల ఎదుట’ (מִפְּנֵי עַמְּךָ) అనే ఉద్దేశపూర్వక పురుష-వచన మార్పులు నిలుపబడ్డాయి. ముగింపు యొక్క వివాదాస్పద అనుసంధానాన్ని పాదసూచిక స్పష్టంగా తెలియజేస్తుంది.
