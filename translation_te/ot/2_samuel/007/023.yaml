source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: te
  text: భూమిమీద ఏకైక జనమైన నీ ప్రజలైన ఇశ్రాయేలుకు సాటి ఎవరు? తనకొరకు వారిని ఒక ప్రజగా విమోచించడానికి, తనకు పేరు సంపాదించుకోవడానికి, నీవు ఐగుప్తులోనుండి నీకొరకు విమోచించిన నీ ప్రజల ఎదుట నీ దేశం కోసం మీకొరకు గొప్ప, భయవిస్మయాలు కలిగించే కార్యాలు[a] చేయడానికి దేవుడు వెళ్లాడు—జనాలనుండి, వారి దేవుళ్లనుండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప మరియు భయంకరమైన కార్యాలు.’ హీబ్రూ పదం విస్మయం, భీతి, లేదా భయం కలిగించే కార్యాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో చివరి పదబంధం క్లిష్టంగా ఉంది. దీనిని ‘ఐగుప్తులోనుండి—జనాలను, దాని దేవుణ్ణి’ లేదా ‘ఐగుప్తులోనుండి—జనాలను, దేవుళ్లను’ అని కూడా అర్థం చేసుకోవచ్చు. కొందరు దీనిని ఇశ్రాయేలు ఎదుటనుండి తొలగించబడిన జనాలు మరియు వారి దేవుళ్లను సూచిస్తున్నట్లు గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: ఇశ్రాయేలులా ఉన్న నీ ప్రజలవంటి వారు ఇంకెవరు?
  rationale: సాటిలేనితనాన్ని తెలిపే అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో ఉంచి, ‘నీ ప్రజలు—ఇశ్రాయేలు’ అనే నొక్కిచెప్పే సంబంధాన్ని నిలిపింది.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: భూమిమీద ఏకైక జనమైన
  rationale: אֶחָד యొక్క ప్రత్యేకతను సందర్భానుసారంగా ‘ఏకైక’ అని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: దేవుడు ... వెళ్లాడు
  rationale: אֱלֹהִים రూపరీత్యా బహువచనమైనా సందర్భంలో ఇశ్రాయేలు దేవుని సూచిస్తుంది; ‘వెళ్లాడు’ మూలంలోని క్రియాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: తనకొరకు ఒక ప్రజగా వారిని విమోచించడానికి
  rationale: פדה యొక్క విడిపింపు/విమోచన భావాన్ని, לּוֹ లోని స్వాధీన సంబంధాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: తనకు పేరు సంపాదించుకోవడానికి
  rationale: కీర్తి లేదా ప్రఖ్యాతి పొందడాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: మీకొరకు ... చేయడానికి
  rationale: మసొరేటిక్ పాఠంలోని రెండవ పురుష బహువచన దత్తివాచకమైన לָכֶם ను తొలగించకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: గొప్పవాటిని, భయంకరమైన కార్యాలను
  rationale: నורא లోని భయం, విస్మయం కలిగించే బలమైన అర్థాన్ని ‘భయంకరమైన’ నిలుపుతుంది; పదబంధంలోని సంఖ్యా అసమతను సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: నీ ప్రజల ఎదుట నీ దేశం కోసం
  rationale: לְאַרְצְךָ లోని ‘నీ దేశం/భూమి కోసం’ భావాన్ని, מִפְּנֵי లోని ముందునుండి తొలగింపు అనే స్థల భావాన్ని సందర్భంతో అనుసంధానిస్తుంది.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: నీవు ఐగుప్తులోనుండి నీకొరకు విమోచించిన
  rationale: פדה ను ముందున్నట్లే ‘విమోచించు’ అని ఏకరీతిగా అనువదించి, לְךָ లోని స్వాధీన భావాన్ని నిలుపుతుంది.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: జనాలను, వారి దేవుళ్లను తొలగించడానికి
  rationale: క్లిష్టమైన చివరి పదబంధాన్ని ఇశ్రాయేలు ఎదుటనుండి తొలగించబడిన జనాలు మరియు వారి దేవుళ్లుగా సందర్భానుసారంగా అనుసంధానిస్తుంది; అనిశ్చితిని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: אֱלֹהִים యొక్క వచనం మరియు సూచితుడు
  choice: ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచనం ‘దేవుడు’
  alternative: ‘దేవతలు’ అనే బహువచనం
  rationale: ఈ ప్రార్థనలో క్రియ యొక్క భావం, ప్రసంగ సందర్భం ఇశ్రాయేలు కోసం కార్యం చేసిన దేవుణ్ణే సూచిస్తున్నాయి; రూపరీత్యా బహువచనాన్ని అర్థరీత్యా బహువచనంగా చేయడం సందర్భాన్ని వక్రీకరిస్తుంది.
- issue: ముగింపులోని క్లిష్టమైన גּוֹיִם וֵאלֹהָיו పదబంధం
  choice: ఇశ్రాయేలు ఎదుటనుండి తొలగించబడిన ‘జనాలు, వారి దేవుళ్లు’
  alternative: ‘ఐగుప్తులోనుండి—జనాలను, దాని దేవుణ్ణి’ లేదా ‘ఐగుప్తులోనుండి—జనాలను, దేవుళ్లను’
  rationale: హీబ్రూ వాక్యాంతం సంక్షిప్తంగా, వాక్యనిర్మాణపరంగా క్లిష్టంగా ఉంది. ప్రధాన పాఠం విస్తృత నిర్గమణ-దేశాధికార సందర్భానికి అనుగుణమైన పఠనాన్ని ఇస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచి అనిశ్చితిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దైవసంబోధనకు ఏకవచన ‘నీవు/నీ’, సమూహాన్ని ఉద్దేశించిన לָכֶם కు బహువచన ‘మీకొరకు’ వాడి మూలంలోని వ్యక్తి-వచన మార్పును నిలిపింది. ప్రధాన వాక్యాన్ని తెలుగులో చదవదగినట్లుగా రెండు వాక్యాలుగా విభజించినా మూలంలోని భావసంబంధాన్ని కాపాడింది.
