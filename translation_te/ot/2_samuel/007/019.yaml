source:
  edition: WLC
  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: te
  text: ఇది కూడా నీ దృష్టిలో చిన్న విషయమే, ప్రభువైన యెహోవా; నీవు నీ సేవకుని ఇంటి[a] గురించి సుదూర భవిష్యత్తు వరకూ కూడా మాట్లాడావు; ఇది మానవుని ఉపదేశం[b], ప్రభువైన యెహోవా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇల్లు’ అనే హీబ్రూ పదం ఇక్కడ కుటుంబాన్ని లేదా రాజవంశాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ చివరి హీబ్రూ పదబంధం అర్థం క్లిష్టమైనది. దీనిని ‘ఇది మానవాళికి నియమం,’ ‘ఇది మానవుని ధర్మశాసనం,’ లేదా ‘ఇది మానవాళికి సంబంధించిన ఉపదేశం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: అయినా ఇది నీ దృష్టిలో చిన్న విషయమే
  rationale: קטן యొక్క ‘చిన్నదిగా ఉండడం’ అనే భావాన్ని, בְּעֵינֶיךָ అనే మూలభాషా మూల్యాంకన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది. עוֹד ఇక్కడ ముందటి కృపకు మించి దేవుడు చేసినదాన్ని సూచించే సందర్భంలో ‘అయినా’ అనే అనుసంధానంతో వ్యక్తమైంది.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: రెండు దైవపదవుల భేదాన్ని నిలుపుతూ, తెలుగులో అసహజమైన పదపునరుక్తిని నివారిస్తుంది.
- source_word: בֵּית עַבְדְּךָ
  choice: నీ సేవకుని ఇల్లు
  rationale: ‘ఇల్లు’ అనే మూలరూపాన్ని ఉంచింది; సందర్భంలో అది దావీదు కుటుంబాన్ని లేదా వంశపరంపరను సూచించవచ్చని పాదటిప్పణి వివరిస్తుంది.
- source_word: לְמֵרָחוֹק
  choice: సుదూర భవిష్యత్తు వరకూ
  rationale: ‘దూరానికి’ అనే అక్షరార్థం ఇక్కడ కాలపరంగా, ఎంతో ముందున్న భవిష్యత్తును సూచిస్తుంది.
- source_word: תּוֹרַת הָאָדָם
  choice: మానవుని ఉపదేశం
  rationale: תּוֹרָה పదంలోని ఉపదేశం, ధర్మశాసనం, నియమం వంటి భావవిస్తృతిని ‘ఉపదేశం’ కొంతవరకు నిలుపుతుంది; הָאָדָם ను ఏ ఒక్క ప్రత్యేక వ్యక్తికి పరిమితం చేయకుండా ‘మానవుడు’గా అనువదించింది.
theological_decisions:
- issue: וְזֹאת תּוֹרַת הָאָדָם అనే క్లిష్టమైన చివరి పదబంధం
  choice: ఇది మానవుని ఉపదేశం
  alternative: ఇది మానవాళికి నియమం / ఇది మానవుని ధర్మశాసనం / ఇది మానవాళికి సంబంధించిన ఉపదేశం
  rationale: హీబ్రూ పదబంధపు వ్యాకరణ సంబంధం, ఉద్దేశం రెండూ వివాదాస్పదమైనవి. ప్రధాన పాఠం పదాలకు దగ్గరగా ఉండి ఆ అనిశ్చితిని పరిష్కరించినట్లు నటించదు; సాధ్యమైన ఇతర అర్థాలను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. దైవసంబోధనలో భక్తిపూర్వక గంభీరతను నిలిపి, క్లిష్టమైన చివరి వాక్యభాగాన్ని అతివ్యాఖ్యానం చేయకుండా ఉంచింది.
