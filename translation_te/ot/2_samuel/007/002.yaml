language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: te
  text: రాజు నాతాను ప్రవక్తతో, “చూడండి, నేను దేవదారు కలపతో కట్టిన ఇంట్లో నివసిస్తున్నాను; కానీ దేవుని మందసం తెరల లోపల ఉంది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక గుడారపు తెర లోపల.” హీబ్రూ పదం గుడారానికి సంబంధించిన తెరను లేదా వేలాడే వస్త్రాన్ని సూచిస్తుంది; ఇక్కడ అది గుడారపు ఆవరణలను గుర్తుచేస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: రాజు ... అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తూ, మూలంలోని ‘రాజు’ అనే బిరుదునే నిలిపింది; ‘దావీదు’ అని పేరు చేర్చలేదు.
- source_word: נָתָן הַנָּבִיא
  choice: నాతాను ప్రవక్తతో
  rationale: వ్యక్తిపేరుతో పాటు ఉన్న ప్రవక్త అనే గుర్తింపును సూటిగా, సహజంగా తెలిపింది.
- source_word: רְאֵה נָא
  choice: చూడండి
  rationale: దృష్టిని ఆకర్షించే ఆజ్ఞార్థక ప్రయోగాన్ని గౌరవసూచకమైన ఆధునిక తెలుగులో తెలిపింది; נָא ను అతిగా వేడుకోలుగా మార్చలేదు.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: నేను ... నివసిస్తున్నాను
  rationale: ఈ సందర్భంలో ישׁב నివాసాన్ని సూచిస్తుంది. స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటన ‘నేను’ ద్వారా నిలుస్తుంది.
- source_word: בְּבֵית אֲרָזִים
  choice: దేవదారు కలపతో కట్టిన ఇంట్లో
  rationale: నిర్మాణ పదార్థాన్ని సూచించే నిర్మాణాన్ని సాధారణ పాఠకునికి స్పష్టమైన సహజ తెలుగులో అందించింది.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: కానీ దేవుని మందసం
  rationale: וְ ఇక్కడ రాజు నివాసానికీ మందసం ఉన్న స్థితికీ మధ్య వ్యత్యాసాన్ని చూపుతుంది; ‘కానీ’ ఆ సంభాషణాత్మక బలాన్ని తెలియజేస్తుంది.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: తెరల మధ్య ఉంది
  rationale: మందసానికి వ్యక్తీకరణగా వాడిన ‘నివసించు’ను తెలుగులో అసహజంగా పునరావృతం చేయకుండా స్థితిని తెలిపింది. יְרִיעָה గుడారపు తెర/వేలాడే వస్త్రాన్ని సూచిస్తుంది; సమూహార్థాన్ని ‘తెరలు’గా సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: దేవుని మందసం ఉన్న నివాసస్థల స్వరూపం
  choice: ‘తెరల మధ్య’ అని నిర్దిష్ట వస్త్ర చిత్రాన్ని నిలిపివేయడం
  alternative: ‘గుడారంలో’
  rationale: మూలంలోని יְרִיעָה సాధారణంగా గుడారం అనే విస్తృత పదం కాకుండా తెర లేదా కప్పే వస్త్రాన్ని సూచిస్తుంది. అందువల్ల తరువాతి ఆలయ సంబంధమైన భావాన్ని చేర్చకుండా తాత్కాలిక, గుడారసంబంధ దృశ్యాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభమైన శైలి. ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని ఉపయోగించి, ‘దేవదారు కలపతో కట్టిన ఇల్లు’ ద్వారా నిర్మాణ పదార్థాన్ని స్పష్టం చేసింది.
