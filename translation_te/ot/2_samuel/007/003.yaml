  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: te
  text: 'నాతాను రాజుతో ఇలా అన్నాడు: “నీ హృదయంలో ఉన్నదంతా వెళ్లి చేయి, ఎందుకంటే యాహ్వే నీతో ఉన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సందర్భానుసారమైన సహజ కథన క్రమాన్ని ‘ఇలా అన్నాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: נָתָן
  choice: నాతాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజుతో
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదంతో ఉన్న సాధారణ నామవాచకమే ఉంది; ఈ వచనంలో లేని ‘దావీదు’ అనే పేరును చేర్చలేదు.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: నీ హృదయంలో ఉన్నదంతా
  rationale: לֵבָב భావోద్వేగం మాత్రమే కాక అంతరంగ ఉద్దేశం, సంకల్పం అనే భావాన్నీ కలిగి ఉంటుంది. ‘హృదయంలో’ అనే రూపం మూలభాషా నుడికారాన్ని నిలుపుతూ తెలుగులో అర్థమవుతుంది.
- source_word: לֵךְ עֲשֵׂה
  choice: వెళ్లి చేయి
  rationale: వరుసగా ఉన్న రెండు ఆజ్ఞార్థక క్రియలు అనుమతి, ప్రోత్సాహం అనే భావాన్ని ఇస్తాయి. ‘వెళ్లి చేయి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי నాతాను ఇచ్చిన ప్రోత్సాహానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: עִמָּךְ
  choice: నీకు తోడుగా ఉన్నాడు
  rationale: ఈ రూపం సన్నిధి, సహవాసం, మద్దతు అనే ప్రతిధ్వనులను అతిగా విస్తరించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: ‘నీతో ఉన్నాడు’ అనే మాటలోని భావం
  choice: నీకు తోడుగా ఉన్నాడు
  alternative: నీతో ఉన్నాడు
  rationale: దైవసన్నిధి మరియు సహకారం రెండింటి ప్రతిధ్వనిని సహజ తెలుగులో ఉంచాం; అయితే నాతాను మాటకు మూలంలో లేనంత నిర్దిష్టమైన దైవ ఆమోదార్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘రాజు’ అనే పదాన్ని అలాగే ఉంచి సందర్భం నుంచి ‘దావీదు’ పేరును చేర్చలేదు. హృదయం అనే హీబ్రూ నుడికారాన్ని పరిరక్షించాం.
