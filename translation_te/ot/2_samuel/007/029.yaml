base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: te
  text: ఇప్పుడు నీ సేవకుని ఇంటిని[b] ఆశీర్వదించడానికి దయచేసి సమ్మతించు[a], అది నీ ఎదుట శాశ్వతంగా ఉండునట్లు. ప్రభువైన యాహ్వే[c], నీవు పలికావు; నీ ఆశీర్వాదం వల్ల నీ సేవకుని ఇల్లు శాశ్వతంగా ఆశీర్వదించబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దయచేసి సమ్మతించు’ అనే మాటను ‘దయచేసి ఇష్టపడు’ లేదా ‘అనుగ్రహపూర్వకంగా అంగీకరించు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఇల్లు’ అనే మాటకు ‘ఇంటివారు’ లేదా ‘వంశం’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘అదోనాయి YHWH’; ఇది ‘ప్రభువు’ అనే బిరుదును ‘యాహ్వే’ అనే దైవనామంతో కలిపి వాడిన రూపం.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹאֵל
  choice: దయచేసి సమ్మతించు
  rationale: హిఫీల్ రూపంలోని ఇష్టపడడం లేదా అనుగ్రహపూర్వకంగా సమ్మతించడం అనే భావాన్ని ప్రార్థనాత్మకమైన సహజ తెలుగు వాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: וּבָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ‘సమ్మతించు’ అనే క్రియతో సహజంగా అనుసంధానిస్తూ, ברך ఆజ్ఞారూపంలోని ఆశీర్వదించు అనే ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: בֵּית עַבְדְּךָ
  choice: నీ సేవకుని ఇల్లు
  rationale: ‘ఇల్లు’ అనే పదం కుటుంబం, వంశం, గృహం అనే సందర్భోచిత అంతర్లీన భావాలను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: అది నీ సన్నిధిలో శాశ్వతంగా ఉండాలి
  rationale: మూలంలోని ‘నీ ఎదుట శాశ్వతంగా ఉండుటకు’ అనే నిర్మాణానికి దగ్గరగా ఉండి, స్థాపించబడడం వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యెహోవా
  rationale: అదోనాయి అనే బిరుదును ‘ప్రభువు’గా, YHWH అనే దైవనామాన్ని ఆధునిక ప్రామాణిక తెలుగు సంప్రదాయంలో గుర్తించదగిన ‘యెహోవా’గా వ్యక్తం చేస్తుంది.
- source_word: דִּבַּרְתָּ
  choice: నీవే ఈ మాట చెప్పావు
  rationale: దేవుడు ఇంతకుముందు పలికిన వాగ్దానమే ప్రార్థనకు ఆధారమని తెలుగు ఉద్ఘాటనతో స్పష్టం చేస్తుంది; ‘ఈ మాట’ సందర్భంలోని వాగ్దానాన్ని సూచిస్తుంది.
- source_word: וּמִבִּרְכָתְךָ
  choice: నీ ఆశీర్వాదం వల్ల
  rationale: מִן సూచించే మూలం లేదా సాధన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְבֹרַךְ
  choice: ఆశీర్వదించబడుతుంది
  rationale: హీబ్రూ నిష్క్రియార్థక అసంపూర్ణ క్రియ యొక్క భవిష్యత్ భావాన్ని నిలుపుతుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: ఒడంబడిక సందర్భంలోని నిరంతర భవిష్యత్ కాల భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוִה అనే బిరుదు-నామ సమ్మేళనం
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన దేవుడు
  rationale: దైవనామాన్ని సాధారణ నామమైన ‘దేవుడు’లో కలిపివేయకుండా, మూలంలోని బిరుదు మరియు ప్రత్యేక నామం రెండింటినీ నిలుపుతుంది.
- issue: בַּיִת పదాన్ని వంశంగా స్పష్టీకరించాలా
  choice: ఇల్లు
  alternative: వంశం / ఇంటివారు
  rationale: ఈ అధ్యాయంలో ‘ఇల్లు’ భౌతిక గృహం, కుటుంబం, రాజవంశం అనే పరస్పర సంబంధిత భావాలను మోస్తుంది; ‘వంశం’ అని మాత్రమే అనువదించడం మూలంలోని సాహిత్య, దైవశాస్త్రీయ బహుళార్థాన్ని ముందుగానే పరిష్కరిస్తుంది.
- issue: לִהְיוֹת అనే క్రియకు స్థాపన భావం చేర్చాలా
  choice: ఉండాలి
  alternative: స్థిరపరచబడాలి
  rationale: మూలంలో సాధారణ ‘ఉండు’ క్రియే ఉంది. సందర్భం నిలకడను సూచించినప్పటికీ, ‘స్థిరపరచు’ అనే అదనపు భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. అతిగా ప్రాచీనమైన క్రియాంతాలను నివారించాం. ‘ఇల్లు’ అనే పదంలోని కుటుంబ-వంశ బహుళార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పాదటిప్పణిలో వివరించాం.
