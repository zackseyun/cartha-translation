reference: 2 Samuel 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: te
  text: నా ప్రజలైన ఇశ్రాయేలుకు నేను ఒక స్థలాన్ని కేటాయించి, వారిని అక్కడ నాటుతాను; వారు తమ స్థలంలో నివసించి ఇక కలత చెందరు. దుష్టత్వపు కుమారులు[a] మునుపటిలా ఇక వారిని బాధించరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దుర్మార్గులు” లేదా “దుష్టులు.” హీబ్రూలో అక్షరార్థంగా “దుష్టత్వపు కుమారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: ఒక స్థలాన్ని నియమించి
  rationale: שׂוּם యొక్క మూలభావం ‘ఉంచడం’; מָקוֹםతో కూడిన ఈ వాగ్దాన సందర్భంలో దేవుడు స్థలాన్ని కేటాయించడం అనే భావం ఉంది. ‘నియమించి’ దైవిక చొరవను సహజంగా తెలియజేస్తుంది.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుకు
  rationale: రెండు పదబంధాలు సమానాధికార సంబంధంలో ఉన్నాయి. ఈ రూపం ‘నా ప్రజలు’ అనే నిబంధనాత్మక సంబంధాన్నీ ‘ఇశ్రాయేలు’ అనే గుర్తింపునూ నిలుపుతుంది.
- source_word: וּנְטַעְתִּיו
  choice: వారిని అక్కడ నాటుతాను
  rationale: ఏకవచన ప్రత్యయం సమష్టిగా భావించబడిన ఇశ్రాయేలును సూచిస్తుంది. తెలుగులో ప్రజలను సూచించేందుకు ‘వారిని’ సహజం; ‘నాటుతాను’ సురక్షితంగా స్థిరపరచడం అనే వ్యవసాయ రూపకాన్ని కాపాడుతుంది. ‘అక్కడ’ నియమించిన స్థలంతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: వారు తమ స్థలంలో నివసిస్తారు
  rationale: సమష్టి ఏకవచనమైన ఇశ్రాయేలును తెలుగులో బహువచనంగా సూచించాం. תַּחְתָּיו ఇక్కడ స్థిరంగా తన స్థానంలో ఉండడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది; ‘కింద’ అనే స్థలార్థం ఈ సందర్భానికి అసహజం.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: ఇక కలవరపరచబడరు
  rationale: רגז కదల్చబడడం, అశాంతికి గురికావడం, కలవరపడడం అనే భావాలను కలిగి ఉంది. శత్రువుల వల్ల కలిగే బాహ్య అశాంతిని ‘కలవరపరచబడరు’ తెలియజేస్తుంది; עוֹדతో కూడిన నిషేధాన్ని ‘ఇక’ వ్యక్తపరుస్తుంది.
- source_word: בְנֵי עַוְלָה
  choice: దుష్టత్వపు కుమారులు
  rationale: హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో రూపపరంగా నిలిపాం. సహజమైన అర్థమైన ‘దుర్మార్గులు’ను పాదసూచికలో ఇచ్చాం.
- source_word: לְעַנּוֹתוֹ
  choice: వారిని బాధించరు
  rationale: Piel రూపంలోని ענה బాధించడం, అణచివేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘బాధించరు’ మూలంలోని విస్తృతతను నిలుపుతుంది; ‘వారిని’ సమష్టిగా ఉన్న ఇశ్రాయేలును సూచిస్తుంది.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: మునుపటిలా
  rationale: గతంలో జరిగిన అణచివేతతో పోలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును సమష్టి ఏకవచనంగా సూచించే క్రియలు, ప్రత్యయాలు
  choice: తెలుగులో ‘వారు/వారిని’ అనే గౌరవసూచక బహువచన రూపాలు
  alternative: ‘అతడు/అతనిని’ అంటూ జాతిని ఏకవచన వ్యక్తిగా చూపడం
  rationale: హీబ్రూ ఒక ప్రజాసమూహాన్ని ఏకవచనంగా పరిగణించగలదు. తెలుగులో ఇశ్రాయేలు ప్రజలను ‘వారు’ అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది; ఇది భాషాపరమైన నిర్ణయం మాత్రమే.
- issue: בְנֵי עַוְלָה అనే హీబ్రూ నుడికారం
  choice: ప్రధాన పాఠంలో ‘దుష్టత్వపు కుమారులు’ అని ఉంచడం
  alternative: ‘దుర్మార్గులు’ లేదా ‘దుష్టులు’
  rationale: మూలంలోని స్పష్టమైన పుంలింగ నుడికారాన్ని చెరపకుండా నిలిపి, దాని సహజ తెలుగు భావాన్ని పాదసూచికలో ఇచ్చాం.
- issue: వాగ్దానంలోని స్థిర నివాసం
  choice: ‘తమ స్థలంలో నివసిస్తారు’
  alternative: ‘దాని కింద నివసిస్తారు’
  rationale: תַּחְתָּיוను యథార్థ స్థల సంబంధమైన ‘కింద’గా తీసుకోవడం ఇక్కడ అసహజం. నియమించబడిన స్థలంలో భద్రంగా స్థిరపడడం అనే సందర్భార్థాన్ని ఎంచుకున్నాం; వాగ్దానానికి అదనపు సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నాటుతాను’ అనే మూల రూపకాన్ని, ‘దుష్టత్వపు కుమారులు’ అనే హీబ్రూ నుడికారాన్ని నిలిపాం. పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
