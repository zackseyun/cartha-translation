  to: నా ప్రజలైన ఇశ్రాయేలుకు నేను ఒక స్థలాన్ని కేటాయించి, వారిని అక్కడ నాటుతాను; వారు తమ స్థలంలో నివసించి ఇక కలత చెందరు. దుష్టత్వపు కుమారులు[a] మునుపటిలా ఇక వారిని బాధించరు.
  rationale: సవరణలు అర్థాన్ని మార్చకుండా తెలుగులో పదఎంపికను, వాక్యప్రవాహాన్ని మెరుగుపరుస్తాయి. “కేటాయించి” నియమిత స్థలం అనే సందర్భార్థాన్ని స్పష్టపరుస్తుంది; “కలత చెందరు” మూలంలోని భద్రత మరియు అశాంతి తొలగింపు భావాన్ని మరింత సహజంగా వ్యక్తం చేస్తుంది. సమష్టి అయిన ఇశ్రాయేలును సూచించడానికి బహువచన రూపాలు నిలుపబడ్డాయి; బְנֵי עַוְלָה నుడికారం మరియు దాని పాదసూచిక ప్రత్యామ్నాయాలు కూడా సంరక్షించబడ్డాయి.
