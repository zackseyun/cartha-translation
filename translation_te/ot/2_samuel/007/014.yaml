id: 2SA.7.14
reference: 2 Samuel 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִי֙ אֶהְיֶה לּ֣/וֹ לְ/אָ֔ב וְ/ה֖וּא יִהְיֶה לִּ֣/י לְ/בֵ֑ן אֲשֶׁר֙ בְּ/הַ֣עֲוֺת֔/וֹ וְ/הֹֽכַחְתִּי/ו֙ בְּ/שֵׁ֣בֶט אֲנָשִׁ֔ים וּ/בְ/נִגְעֵ֖י בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: te
  text: నేను అతనికి తండ్రిగా ఉంటాను; అతడు నాకు కుమారుడిగా ఉంటాడు. అతడు దోషం చేసినప్పుడు, నేను అతన్ని మనుషుల దండంతోను మానవుల దెబ్బలతోను సరిదిద్దుతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుల దెబ్బలు’ అనే మాటకు హీబ్రూ పాఠ్యంలో అక్షరార్థంగా ‘మనుష్యకుమారుల దెబ్బలు’ అని ఉంది. ఇది మానవులకు సాధారణమైన దెబ్బలను, లేదా మానవుల ద్వారా వచ్చే దెబ్బలను సూచించవచ్చు.
    reason: బְּנֵי אָדָם అనే హీబ్రూ నుడికారపు అక్షరరూపాన్ని, దాని సాధ్యమైన భావవ్యాప్తిని ‘ఆదాము కుమారులు’ అనే తప్పు వ్యక్తినామార్థం లేకుండా తెలియజేస్తుంది.
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: నేను అతనికి తండ్రిగా ఉంటాను
  rationale: లామెద్‌తో ఉన్న సంబంధసూచక నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘నేను అతని తండ్రిగా ఉంటాను’ కంటే హీబ్రూ పరస్పర ఒడంబడిక సూత్రానికి మరింత సమీపంగా ఉంటుంది.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: అతడు నాకు కుమారుడిగా ఉంటాడు
  rationale: ముందటి వాక్యంతో సమాంతరంగా ఉన్న సంబంధసూచక నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: అతడు దోషం చేసినప్పుడు
  rationale: אֲשֶׁר ఇక్కడ పరిస్థితి లేదా కాలాన్ని పరిచయం చేస్తుంది; ‘ఒకవేళ’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే షరతు భావం బలపడుతుంది. ‘దోషం చేయడం’ నైతిక అపరాధభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהֹכַחְתִּיו
  choice: నేను అతన్ని శిక్షించి సరిదిద్దుతాను
  rationale: יכח హిఫిల్ రూపం గద్దింపు, దిద్దుబాటు, క్రమశిక్షణ అనే పరిధిని కలిగి ఉంది; తరువాత వచ్చే దండం, దెబ్బలు అనే సాధనాల సందర్భంలో శిక్ష ద్వారా సరిదిద్దే భావాన్ని ఈ పదబంధం స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: మనుషుల దండంతో
  rationale: ‘దండం’ అనే రూపకాన్ని నిలుపుతూ, ఇది సాధారణ మానవ సాధనాన్నా లేక మానవ ప్రతినిధుల ద్వారా వచ్చే శిక్షనా అన్న అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: మానవుల దెబ్బలతో
  rationale: נגעי కి సందర్భానుసారంగా ‘దెబ్బలు’ సరిపోతుంది. בני אדם అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా ‘మానవుల’ అని అందిస్తుంది.
theological_decisions:
- issue: దావీదు రాజవంశ వాగ్దానం మరియు తరువాతి మెస్సీయ సంబంధ అన్వయాల మధ్య ఈ కుమారత్వ వాక్యపు పరిధి
  choice: వచనాన్ని దావీదు సంతానమైన రాజు గురించిన తక్షణ చారిత్రక సందర్భంలో అనువదించి, ప్రధాన పాఠ్యంలో ప్రత్యక్ష మెస్సీయ వ్యాఖ్యానాన్ని చేర్చలేదు.
  alternative: ప్రధాన పాఠ్యంలోనే దీనిని నేరుగా మెస్సీయకు సంబంధించినదిగా స్పష్టీకరించడం.
  rationale: హీబ్రూ పాఠ్యం మొదట దావీదు సంతానం మరియు రాజవంశ ఒడంబడికను ఉద్దేశిస్తుంది. తరువాతి లేఖన వినియోగాన్ని నిరాకరించకుండా, మూలంలో స్పష్టంగా లేని క్రీస్తు సంబంధ వివరణను అనువాదంలో చేర్చకపోవడం అసలు పాఠ్యంలోని పరిధి మరియు ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. పరస్పర తండ్రి–కుమార సంబంధసూత్రం నిలుపబడింది. ‘శిక్షించి సరిదిద్దుతాను’ ద్వారా కేవలం ప్రతీకార శిక్ష కాక దిద్దుబాటు ఉద్దేశం వ్యక్తమవుతుంది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
