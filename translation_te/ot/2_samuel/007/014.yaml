    issue: వְהֹכַחְתִּיוకు “శిక్షించి సరిదిద్దుతాను” అనే ద్విక్రియా అనువాదం
    rationale: హీబ్రూ క్రియ ప్రధానంగా దిద్దడం, గద్దించడం, ఒప్పించడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘దండం’ మరియు ‘దెబ్బలు’ ఆ దిద్దుబాటుకు సాధనాలను తెలియజేస్తాయి. ‘శిక్షించి’ని ప్రత్యేక క్రియగా చేర్చడం మూలంలో లేని భావ విస్తరణ.
