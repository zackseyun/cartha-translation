lexical_decisions:
- source_word: צַלְמוֹן
  choice: సల్మోను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం. మొదటి వ్యంజనం צ ను ‘స’గా ఇవ్వడం తెలుగు బైబిలు పేర్ల సంప్రదాయానికి అనుగుణం; ‘జల్మోను’ అనే ప్రత్యామ్నాయం మూల ధ్వనిలోని ఘర్షణాత్మక ఉచ్చారణను మరింత స్పష్టంగా సూచించవచ్చు.
- source_word: הָאֲחֹחִי
  choice: అహోహీయుడైన
  rationale: నిర్దిష్ట ఉపజాతి/వంశ సంబంధాన్ని సూచించే gentilic రూపాన్ని జాబితా శైలిలో సహజమైన తెలుగు విశేషణంగా నిలిపాం; ‘అహోహు వంశస్థుడైన’ అనేది మరింత వివరణాత్మక ప్రత్యామ్నాయం.
- source_word: מַהְרַי
  choice: మహరై
  rationale: హీబ్రూ వ్యక్తిపేరును దాని వ్యంజన, అచ్చుల రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הַנְּטֹפָתִי
  choice: నెటోఫాతీయుడైన
  rationale: నెటోఫా ప్రాంతం లేదా వంశంతో సంబంధాన్ని తెలిపే gentilic రూపాన్ని సంక్షిప్త జాబితా శైలిలో అనువదించాం; ‘నెటోఫాకు చెందిన’ అనేది సహజమైన వివరణాత్మక ప్రత్యామ్నాయం.
