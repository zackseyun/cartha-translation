id: 2SA.23.5
reference: 2 Samuel 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: te
  text: ఎందుకంటే, దేవునితో నా ఇల్లు అలా లేదు[a]. అయినా ఆయన నాతో నిత్య నిబంధన చేశాడు; అది అన్ని విషయాల్లో క్రమపరచబడి, భద్రంగా కాపాడబడింది. ఎందుకంటే, ఇదే నా సమస్త రక్షణ, నా కోరిక అంతా—ఆయన దాన్ని మొలకెత్తించకుండా ఉంటాడా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునితో నా ఇల్లు అలా లేదూ?” చాలామంది ఈ ప్రారంభ వాక్యాన్ని ప్రతికూల ప్రకటనగా కాక, సానుకూల అలంకార ప్రశ్నగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఎందుకంటే, ఆయన దాన్ని తప్పక మొలకెత్తిస్తాడు / వర్ధిల్లేలా చేస్తాడు.” చివరి హెబ్రీ వాక్యం క్లిష్టమైనది; దాన్ని అలంకార ప్రశ్నగా గానీ, బలమైన ధృవీకరణగా గానీ చదవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి כִּי ముందటి ప్రవచన వాక్యానికి వివరణాత్మకంగా అనుసంధానిస్తుంది. తరువాతి సందర్భాల్లో దాని వాక్యప్రవాహ పాత్రను సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: לֹא כֵן
  choice: అలా లేదు
  rationale: ప్రత్యేకంగా ఏ విషయం అలా లేదో వివరణతో నింపకుండా, హెబ్రీ నుడికారంలోని అస్పష్టతను మరియు ఉద్రిక్తతను నిలుపుతుంది.
- source_word: בֵּיתִי
  choice: నా ఇల్లు
  rationale: ‘ఇల్లు’ అనే పదం కుటుంబం, గృహం, వంశం అనే భావాలన్నిటినీ సందర్భానుసారంగా మోయగలదు; అందువల్ల వంశపరమైన భావాన్ని మాత్రమే ముందుకు తేవలేదు.
- source_word: עִם אֵל
  choice: దేవునితో
  rationale: עִם యొక్క సహజ సంబంధార్థమైన ‘తో’ను నేరుగా నిలుపుతుంది.
- source_word: בְרִית עוֹלָם
  choice: నిత్య నిబంధన
  rationale: עוֹלָם యొక్క నిరంతరత్వాన్ని తెలిపే, ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన బైబిలు పదబంధం.
- source_word: שָׂם לִי
  choice: ఆయన నాతో ... చేశాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఉంచాడు/స్థాపించాడు’ అయినా, నిబంధన సందర్భంలో ‘నాతో నిబంధన చేశాడు’ సహజంగా కార్యాన్ని తెలియజేస్తుంది.
- source_word: עֲרוּכָה בַכֹּל
  choice: అన్ని విషయాల్లో క్రమపరచబడి
  rationale: నిబంధన సంపూర్ణంగా అమర్చబడి, సక్రమంగా ఏర్పాటుచేయబడిందనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וּשְׁמֻרָה
  choice: భద్రంగా కాపాడబడింది
  rationale: పదంలోని కర్మణి, ఫలితార్థక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כָל יִשְׁעִי
  choice: నా సమస్త రక్షణ
  rationale: יֵשַׁע లోని విమోచన, కాపుదల అనే విస్తృత భావాన్ని ‘రక్షణ’ సహజంగా మోస్తుంది.
- source_word: וְכָל חֵפֶץ
  choice: నా కోరిక అంతా
  rationale: חֵפֶץ కు కోరిక లేదా ఆనందం అనే అర్థాలు సాధ్యం; ఇక్కడ ‘రక్షణ’తో సమాంతరంగా ‘కోరిక’ సరిపోతుంది.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: ఆయన దాన్ని మొలకెత్తించకుండా ఉంటాడా?
  rationale: హిఫిల్ క్రియలోని ‘మొలకెత్తేలా చేయడం’ అనే కారణార్థాన్ని ఉంచుతూ, సందర్భానికి అనుగుణమైన సానుకూల అలంకార ప్రశ్నగా అందించింది; ‘దాన్ని’ అనే పదం కర్తవ్యవిషయ అస్పష్టతను కొంత నిలుపుతుంది.
theological_decisions:
- issue: ప్రారంభ వాక్యం כִּי לֹא כֵן בֵּיתִי עִם אֵל యొక్క భావం
  choice: ‘దేవునితో నా ఇల్లు అలా లేదు’ అనే ప్రతికూల వాక్యంగా ప్రధాన పాఠంలో ఉంచాం.
  alternative: ‘దేవునితో నా ఇల్లు అలా లేదూ?’ అనే సానుకూల అలంకార ప్రశ్న.
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న పాఠం ప్రతికూల వాక్యంగా సహజంగా చదవబడుతుంది. తరువాతి నిబంధన ధృవీకరణతో కలిగే ఉద్రిక్తతను సమన్వయం పేరిట తొలగించకుండా, ప్రధాన పాఠంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: చివరి יַצְמִיחַ యొక్క భావం మరియు కర్మ
  choice: దేవుడు దావీదు రక్షణను/కోరికను ఫలించేలా చేస్తాడనే సానుకూల అలంకార ప్రశ్నగా అనువదించాం.
  alternative: ‘ఆయన దాన్ని మొలకెత్తించడు’ అనే నేర ప్రతికూల ప్రకటన; లేదా ‘ఆయన తప్పక మొలకెత్తిస్తాడు’ అనే బలమైన ధృవీకరణ.
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా ఉండి వ్యాకరణపరంగా క్లిష్టమైనది. నిత్య నిబంధన సందర్భంలో అలంకార ప్రశ్న అనుకూలంగా ఉన్నప్పటికీ, బలమైన ధృవీకరణగా చదివే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఇల్లు,’ ‘నిత్య నిబంధన,’ ‘రక్షణ’ వంటి మూలపాఠానికి దగ్గరైన కీలక పదాలను నిలిపాం. రెండు పాదసూచికల గుర్తులు ప్రధాన పాఠంలో [a], [b]గా ఉన్నాయి.
