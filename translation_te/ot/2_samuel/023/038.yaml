  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ సంబంధవాచకం వంశ లేదా ప్రాంత అనుబంధాన్ని సూచిస్తుంది; హీబ్రూ ఆద్యాక్షరమైన యోద్‌ను ‘యి’గా నిలిపి, తెలుగులో సహజమైన విశేషణ రూపాన్ని వాడాం.
