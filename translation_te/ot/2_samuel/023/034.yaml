source:
  edition: WLC
  text: אֱלִיפֶ֥לֶט בֶּן אֲחַסְבַּ֖י בֶּן הַ/מַּֽעֲכָתִ֑י אֱלִיעָ֥ם בֶּן אֲחִיתֹ֖פֶל הַ/גִּלֹנִֽי־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: te
  text: మయకాతీయుని కుమారుడైన అహస్బయి కుమారుడు ఎలీఫెలెతు[a]; గిలోనీయుడైన అహీతోఫెలు కుమారుడు ఎలీయాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, పేర్ల జాబితాలోని అన్వయాన్ని వేరుగా గ్రహించి, 1 దినవృత్తాంతాలు 11:35–36లోని సమాంతర జాబితాతో పోలిస్తే: “మయకాతీయుడైన అహస్బయి కుమారుడు ఎలీఫెలెతు; గిలోనీయుడైన అహీతోఫెలు కుమారుడు ఎలీయాము.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: ఎలీఫెలెతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు / కుమారుడైన
  rationale: ఈ వీరుల పేర్ల జాబితాలో ఇది సహజంగా తండ్రి–కుమార సంబంధాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా రూపాన్ని మార్చాం.
- source_word: אֲחַסְבַּי
  choice: అహస్బయి
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా లిప్యంతరీకరించాం.
- source_word: הַמַּעֲכָתִי
  choice: మయకాతీయుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ ప్రాంతీయ/జాతీయ విశేషణాన్ని వ్యక్తిని సూచించే తెలుగు నామరూపంగా ఇచ్చాం; ‘మయకా ప్రాంతానికి చెందినవాడు’ అనే భావం ఇందులో నిలుస్తుంది.
- source_word: אֱלִיעָם
  choice: ఎలీయాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామశైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲחִיתֹפֶל
  choice: అహీతోఫెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామశైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַגִּלֹנִי
  choice: గిలోనీయుడు
  rationale: గిలోహు ప్రాంతానికి చెందినవాడని తెలిపే హీబ్రూ ప్రాంతీయ విశేషణాన్ని సహజమైన తెలుగు వ్యక్తివాచక రూపంలో ఇచ్చాం.
theological_decisions:
- issue: אֲחַסְבַּי בֶּן הַמַּעֲכָתִי పదబంధంలోని అన్వయ సంబంధం
  choice: ‘మయకాతీయుని కుమారుడైన అహస్బయి’—‘మయకాతీయుడు’ అనే గుర్తింపును అహస్బయి తండ్రికి అన్వయించడం
  alternative: ‘మయకాతీయుడైన అహస్బయి’—ఆ ప్రాంతీయ గుర్తింపును అహస్బయికే అన్వయించడం
  rationale: మసొరా పాఠంలోని వరుసగా వచ్చిన రెండు בֶּן రూపాలను ప్రధాన అనువాదంలో స్పష్టంగా ప్రతిబింబించాం; అయితే పేర్ల జాబితా నిర్మాణం, సమాంతర జాబితాతో పోలిక వేరొక అన్వయానికి అవకాశం ఇస్తున్నందున దానిని పాదటిప్పణిలో నిలిపాం. ఇది సిద్ధాంతపరమైన నిర్ణయం కాక పాఠ్య-వ్యాకరణ సందిగ్ధత.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే పేర్ల-జాబితా శైలిని వాడాం. తెలుగు సహజ వాక్యక్రమం కోసం హీబ్రూ ‘పేరు–కుమారుడు–తండ్రి’ క్రమాన్ని ‘తండ్రి కుమారుడు పేరు’ క్రమంగా మార్చాం; రెండు వ్యక్తుల వివరాలను అర్ధవిరామంతో వేరు చేశాం.
