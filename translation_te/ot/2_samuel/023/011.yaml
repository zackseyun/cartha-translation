id: 2SA.23.11
reference: 2 Samuel 23:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרָ֛י/ו שַׁמָּ֥א בֶן אָגֵ֖א הָרָרִ֑י וַ/יֵּאָסְפ֨וּ פְלִשְׁתִּ֜ים לַ/חַיָּ֗ה וַ/תְּהִי שָׁ֞ם חֶלְקַ֤ת הַ/שָּׂדֶה֙ מְלֵאָ֣ה עֲדָשִׁ֔ים וְ/הָ/עָ֥ם נָ֖ס מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: te
  text: అతని తరువాత ఆగే కుమారుడైన హారారీ షమ్మా ఉన్నాడు. ఫిలిష్తీయులు యుద్ధానికి[a] సమకూడారు. అక్కడ మసూరలతో నిండిన ఒక పొలభాగం ఉండేది; ప్రజలు ఫిలిష్తీయుల ఎదుటనుండి పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదబంధం అర్థం కష్టమైనది. దీనిని “యుద్ధానికి” అని అర్థం చేసుకోవచ్చు; మరికొందరు “ఒక సైనిక దళంగా” అని, లేదా “లెహీ వద్ద” అనే స్థలనామంగా అర్థం చేసుకుంటారు.
    reason: లַחַיָּה అనే క్లిష్ట పాఠానికి ఉన్న ప్రధాన భాషాత్మక ప్రత్యామ్నాయాలను దాచకుండా తెలియజేయడం.
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: అతని తరువాత
  rationale: వీరుల జాబితాలోని వరుసను సంక్షిప్తంగా చూపిస్తుంది; హీబ్రూలో లేని క్రియను ఈ పదబంధంలో చేర్చదు.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: ఆగే కుమారుడైన హారారీ వంశస్థుడు షమ్మా
  rationale: వ్యక్తి పేర్లను తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించి, הָרָרִי అనే వంశ/ప్రాంత సూచనను సాధారణ విశేషణంగా మార్చకుండా నిలుపుతుంది.
- source_word: וַיֵּאָסְפוּ פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు … సమకూడారు
  rationale: אסף క్రియ యొక్క సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַחַיָּה
  choice: యుద్ధానికి[a]
  rationale: ఈ క్లిష్టమైన పదబంధానికి సైనిక సందర్భంలో సాధ్యమైన కార్యాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తూ, ఇతర నిజమైన పాఠార్థ అవకాశాలను పాదసూచికలో నిలుపుతుంది.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: ఒక పొలభాగం
  rationale: חלקה సూచించే నిర్దిష్ట పొలపు భాగాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: మసూర పంటతో నిండిన
  rationale: עֲדָשִׁים ను lentils అనే నిర్దిష్ట పంటగా గుర్తిస్తూ, పొలం గురించి తెలుగులో సహజంగా పలికే రీతిని ఉపయోగిస్తుంది.
- source_word: וְהָעָם נָס מִפְּנֵי פְלִשְׁתִּים
  choice: ప్రజలు ఫిలిష్తీయుల ఎదుటనుండి పారిపోయారు
  rationale: עם ను అతిగా సైనికీకరించకుండా “ప్రజలు”గా ఉంచి, מִפְּנֵי లోని ‘ఎదుటనుండి’ అనే దిశాత్మక భావాన్ని నిలుపుతుంది.
