  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. పేర్లు లిప్యంతరీకరించబడ్డాయి; క్లిష్టమైన సైనిక పదబంధంలోని అనిశ్చితి పాదసూచికలో స్పష్టంగా నిలుపబడింది.
