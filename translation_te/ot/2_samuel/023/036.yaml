lexical_decisions:
- source_word: יִגְאָל
  choice: ఇగాలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధ జాబితాలో సహజమైన తెలుగు రూపం; పదక్రమాన్ని తెలుగుకు అనుగుణంగా మార్చాం.
- source_word: נָתָן
  choice: నాతాను
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מִצֹּבָה
  choice: సోబాకు చెందిన
  rationale: מִן ఉపసర్గ ఇక్కడ భౌగోళిక మూలాన్ని లేదా అనుబంధాన్ని సూచించగలదు; తెలుగు జాబితా శైలిలో రెండింటినీ సహజంగా మోయగల రూపం ఎంచుకున్నాం.
- source_word: בָּנִי
  choice: బానీ
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַגָּדִי
  choice: గాదీయుడైన
  rationale: గాదు గోత్రానికి లేదా ప్రాంతానికి చెందిన వ్యక్తిని సూచించే జాతివాచక రూపాన్ని సంక్షిప్తంగా, సహజంగా అనువదించాం.
