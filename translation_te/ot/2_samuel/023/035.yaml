  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న స్థలనామజన్య విశేషణం; ‘కర్మెలు ప్రాంతానికి చెందినవాడు’ అనే భావాన్ని జాబితా శైలికి తగిన సంక్షిప్త రూపంలో తెలిపింది.
- source_word: פַּעֲרַי
