- source_word: הָאַרְבִּי
  choice: అరబీయుడైన
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న స్థలనామజన్య విశేషణం; బహుశా ‘అరబ్’ అనే ప్రదేశానికి చెందినవాడని సూచిస్తుంది. తెలుగు పాఠకునికి సహజమైన జనపద రూపాన్ని వాడింది.
