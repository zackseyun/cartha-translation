  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: te
  text: బానా కుమారుడైన నెటోఫాతీయుడు హేలెబు; బెన్యామీను వంశస్థుల గిబియా నుండి వచ్చిన[a] రీబయి కుమారుడు ఇత్తయి;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బెన్యామీనీయుల గిబియా నుండి.” హీబ్రూలో అక్షరార్థంగా, “బెన్యామీను కుమారుల గిబియా నుండి.”
    reason: בְּנֵי בִנְיָמִן యొక్క అక్షరార్థాన్ని, అలాగే సందర్భానుకూలమైన ‘బెన్యామీనీయులు’ ప్రత్యామ్నాయాన్ని స్పష్టపరుస్తుంది.
lexical_decisions:
- source_word: חֵלֶב
  choice: హేలెబు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן בַּעֲנָה
  choice: బయనా కుమారుడు
  rationale: בֶּן అనే పుత్రసంబంధ సూచకాన్ని జాబితా సందర్భంలో సహజమైన తెలుగులో ‘కుమారుడు’గా ఇచ్చాం; בַּעֲנָה పేరును ‘బయనా’గా లిప్యంతరీకరించాం.
- source_word: הַנְּטֹפָתִי
  choice: నెటోఫాతీయుడైన
  rationale: నెటోఫా ప్రాంతం లేదా వంశంతో అనుబంధాన్ని సూచించే gentilic రూపాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִתַּי
  choice: ఇత్తయి
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶּן רִיבַי
  choice: రీబయి కుమారుడు
  rationale: పుత్రసంబంధాన్ని స్పష్టంగా ఉంచుతూ, רִיבַי పేరును తెలుగులో చదవడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: מִגִּבְעַת
  choice: గిబియాకు చెందిన
  rationale: מִן మూలం లేదా ప్రాంత సంబంధాన్ని సూచిస్తుంది. వ్యక్తి స్వస్థలాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘చెందిన’ అని వాడాం.
- source_word: בְּנֵי בִנְיָמִן
  choice: బెన్యామీను వంశస్థుల
  rationale: అక్షరార్థంగా ‘బెన్యామీను కుమారులు’; ఇక్కడ బెన్యామీను గోత్ర ప్రజలను సూచిస్తున్నందున ‘వంశస్థులు’ సహజమైన సందర్భానుకూల రూపం.
