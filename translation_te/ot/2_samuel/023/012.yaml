revisions:
- from: కాని అతడు ఆ పొలం మధ్యలో నిలబడి దాన్ని కాపాడాడు; ఫిలిష్తీయులను హతమార్చాడు. యెహోవా గొప్ప విజయాన్ని[a] కలుగజేశాడు.
  to: కాని అతడు ఆ పొలం మధ్యలో స్థిరంగా నిలబడి దాన్ని కాపాడాడు; ఫిలిష్తీయులను ఓడించాడు. యెహోవా గొప్ప విజయాన్ని[a] కలుగజేశాడు.
  rationale: The revision avoids making an unqualified claim of killing where the Hebrew uses the broader battle verb ‘struck,’ and it better represents the firm, intentional stance conveyed by וַיִּתְיַצֵּב. All other wording and the lexical footnote are retained because they are faithful, natural, and contextually appropriate.
