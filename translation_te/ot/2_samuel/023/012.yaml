  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: te
  text: కాని అతడు ఆ పొలం మధ్యలో స్థిరంగా నిలబడి దాన్ని కాపాడాడు; ఫిలిష్తీయులను ఓడించాడు. యెహోవా గొప్ప విజయాన్ని[a] కలుగజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొప్ప విడుదల’ లేదా ‘గొప్ప రక్షణ’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఈ అర్థాలన్నిటినీ ఇవ్వగలదు; ఇక్కడ అది యుద్ధంలో యెహోవా చేసిన రక్షణకార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: నిలబడి
  rationale: హిత్‌పయేల్ రూపం ఉద్దేశపూర్వకంగా తన స్థానం చేపట్టి నిలబడడాన్ని సూచిస్తుంది. యుద్ధ సందర్భంలో ‘నిలబడి’ సహజంగా ఉండి, స్థిరంగా ఎదుర్కొన్న భావాన్ని అందిస్తుంది.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: ఆ పొలం మధ్యలో
  rationale: חֶלְקָה అనేది భూమి ముక్కను లేదా పొలాన్ని సూచించగలదు. ఈ కథన సందర్భంలో ‘పొలం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; בְּתוֹךְ భావాన్ని ‘మధ్యలో’ తెలియజేస్తుంది.
- source_word: וַיַּצִּילֶהָ
  choice: దాన్ని కాపాడాడు
  rationale: నצל సాధారణంగా విడిపించడం లేదా రక్షించడం అనే భావం ఇస్తుంది. స్త్రీలింగ ప్రత్యయం పొలాన్ని సూచిస్తున్నందున, శత్రువుల చేతికి చిక్కకుండా దాన్ని రక్షించిన భావాన్ని ‘కాపాడాడు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను హతమార్చాడు
  rationale: యుద్ధ సందర్భంలో נכה కొట్టి పడగొట్టడం లేదా సంహరించడం అనే బలమైన భావాన్ని కలిగి ఉంది. ‘హతమార్చాడు’ ఆ యుద్ధ తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ יְהוָה
  choice: యెహోవా ... కలుగజేశాడు
  rationale: עשה అనే క్రియ תְּשׁוּעָה వంటి భావవాచక కర్మతో వచ్చినప్పుడు ఒక ఫలితాన్ని సాధించడం లేదా కలుగజేయడం అని అర్థం. ‘కలుగజేశాడు’ దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: గొప్ప విజయం
  rationale: תְּשׁוּעָה రక్షణ, విడుదల, విజయం అనే అర్థాలను కలిగి ఉంటుంది. ఇక్కడ యుద్ధ ఫలితమే తక్షణ సందర్భం కాబట్టి ‘గొప్ప విజయం’ ప్రధాన పాఠంలో సహజమైన ఎంపిక; ఇతర అర్థాలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగులో పరిచయమైన రూపంలో నిలిపాం.
- issue: యుద్ధ సందర్భంలో תְּשׁוּעָה అర్థం
  choice: విజయం
  alternative: విడుదల లేదా రక్షణ
  rationale: తక్షణ సందర్భం ఫిలిష్తీయులపై సాధించిన యుద్ధ ఫలితాన్ని వర్ణిస్తుంది కాబట్టి ‘విజయం’ స్పష్టంగా ఉంటుంది. అయితే ఈ విజయం యెహోవా చేసిన రక్షణకార్యమే అనే విస్తృత భావాన్ని పాదసూచిక ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వరుస క్రియల ప్రవాహాన్ని సహజమైన తెలుగు విరామచిహ్నాలతో అందించాం; ఆరంభ וַ־కు ముందరి సందర్భంలోని వ్యతిరేక మలుపును సూచిస్తూ ‘కాని’ వాడాం.
