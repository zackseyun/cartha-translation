  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల పేర్ల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. రెండు వ్యక్తుల నమోదులు స్పష్టంగా వేరుపడేందుకు అర్ధవిరామ చిహ్నం ఉపయోగించబడింది.
