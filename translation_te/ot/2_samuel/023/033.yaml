  text: Shammah the Hararite[a], Ahiam son of Sharar the Ararite.
translation:
  language: te
  text: హరారీయుడైన షమ్మా; అరారీయుడైన[a] షారారు కుమారుడు అహీయాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సమాంతరమైన వంశీయ పదంతో సమన్వయపరిస్తే, ‘హరారీయుడైన.’ అయితే ఇక్కడి హెబ్రీ రూపాన్ని ‘అరారీయుడైన’ అని చదవడమే మెరుగైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁמָּה
  choice: షమ్మా
  rationale: వ్యక్తి పేరు కావడంతో అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הֲרָרִי
  choice: హరారీయుడైన
  rationale: వంశీయ లేదా ప్రాంతీయ గుర్తింపును తెలిపే పదం. జాబితా సందర్భంలో వివరణాత్మకంగా ‘కొండప్రాంతవాసి’ అని కాకుండా ‘హరారీయుడు’ అనే పేరురూపాన్ని నిలిపివేయడం సహజం.
- source_word: אֲחִיאָם
  choice: అహీయాము
  rationale: వ్యక్తి పేరు కావడంతో తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: హెబ్రీ వంశావళి నిర్మాణానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: שָׁרָר
  choice: షారారు
  rationale: వ్యక్తి పేరు కావడంతో తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הָארָרִי
  choice: అరారీయుడైన
  rationale: హెబ్రీ వ్యంజన రూపం ‘హరారీయుడు’ కంటే ‘అరారీయుడు’ అనే ప్రత్యేక ప్రాంతీయ లేదా వంశీయ గుర్తింపును సూచిస్తుంది; సమీపంలోని సారూప్య పదంతో సమన్వయపరచకుండా ఈ భేదం నిలిపివేయబడింది.
