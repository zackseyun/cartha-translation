    text: “బర్హూమీయుడు” అనేది మసొరెటిక్ పాఠాన్ని అనుసరిస్తుంది; కొందరు ఈ పదాన్ని బహూరీముతో సంబంధపెట్టి “బహారూమీయుడు” అని అనువదిస్తారు.
