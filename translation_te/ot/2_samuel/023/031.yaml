lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: అబీ-అల్బోను
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. రెండు భాగాలుగా కనిపించే పేరును స్పష్టత కోసం హైఫన్‌తో ఇచ్చాం.
- source_word: הָעַרְבָתִי
  choice: అరాబాతీయుడైన
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ప్రదేశవాచక సంబంధపదం. అది అరాబా/అరాబాత్‌తో సంబంధమున్న వ్యక్తిని సూచిస్తుంది; ఖచ్చితమైన ప్రదేశ నిర్ధారణను బలవంతంగా తేల్చకుండా లిప్యంతరీకృత రూపాన్ని వాడాం.
- source_word: עַזְמָוֶת
  choice: అజ్మావెతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: הַבַּרְחֻמִי
  choice: బర్హూమీయుడైన
  rationale: మసొరెతు పాఠంలోని వ్యంజన, స్వర రూపాన్ని అనుసరించిన ప్రదేశవాచక సంబంధపదం. బహూరీముతో అనుసంధానించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
