translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. వ్యక్తి పేర్లు, ప్రదేశ సంబంధ బిరుదులు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; రెండు పాఠభేద సూచనలు పాదసూచికలలో నిలుపబడ్డాయి.
