lexical_decisions:
- source_word: צֶלֶק
  choice: సెలెకు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הָעַמֹּנִי
  choice: అమ్మోనీయుడైన
  rationale: సెలెకు జాతి లేదా దేశ మూలాన్ని సూచించే విశేషణాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: נַחְרַי
  choice: నహరయి
  rationale: మసొరేతీయ స్వరచిహ్నాలతో ఉన్న వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: הַבְּאֵרֹתִי
  choice: బేరోతీయుడైన
  rationale: బేరోతు ప్రాంతానికి చెందినవాడని తెలిపే భౌగోళిక విశేషణాన్ని సంక్షిప్త జాబితా శైలిలో నిలిపాం.
- source_word: נשאי כְּלֵי
  choice: ఆయుధాలను మోసేవాడు
  rationale: నשאי అనే కేతీవ్ రూపాన్ని బహువచనంగా కాకుండా, సందర్భానికి సరిపోయే ఏకవచన కార్యవాచకంగా గ్రహించాం; כְּלֵי అనే విస్తృత పదానికి సైనిక సందర్భంలో ‘ఆయుధాలు’ అని ఇచ్చాం. ఇది ‘కవచధారి’ అనే పదం కలిగించగల కేవలం కవచం మోసే భావాన్ని నివారిస్తుంది.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: సెరూయా కుమారుడైన యోవాబు
  rationale: హీబ్రూ సంబంధాన్ని పూర్తిగా ఉంచుతూ, సహజ తెలుగు పదక్రమంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వీరుల పేర్ల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. హీబ్రూ పాఠంలోని స్రోతల ముగింపు గుర్తులు అనువదించలేదు. అందించిన ఆంగ్ల పాదసూచిక నహరయి పేరుకు సంబంధించిన ఆంగ్ల లిప్యంతరీకరణ భేదమే గనుక తెలుగు పాఠానికి అవసరం లేదు.
