  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: te
  text: సూర్యుడు ఉదయించే వేళ ఉదయకాంతిలా అతడు ఉంటాడు[a]; మేఘాలు లేని ఉదయంలా, కాంతి, వానల వల్ల భూమి నుండి మొలిచే పచ్చికలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మరియు ఉదయకాంతిలా.” ఈ హెబ్రీ పాదం సంక్షిప్తంగా ఉంది; ఇది మునుపటి వచనంలోని పాలకుని వర్ణనను కొనసాగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కాంతి నుండి, వాన నుండి, భూమి నుండి పచ్చిక.” ఇది కుదించబడిన కవితా ప్రయోగం; కాంతి, వాన, భూమి నుండి మొలిచే కొత్త పచ్చికల మధ్య సంబంధాన్ని హెబ్రీ పూర్తిగా వివరించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר בֹּקֶר
  choice: ఉదయకాంతిలా అతడు ఉంటాడు
  rationale: వావ్‌తో కూడిన ఉపమాన సూచక כְּను ‘లా’గా అనువదించాం. హెబ్రీ పాదం క్రియలేని సంక్షిప్త వాక్యం; మునుపటి వచనంలోని నీతిమంతుడైన పాలకుడే ఉద్దేశమని సందర్భం సూచిస్తున్నందున సహజమైన తెలుగుకోసం ‘అతడు ఉంటాడు’ అని పూరించాం.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: సూర్యుడు ఉదయించే వేళ
  rationale: יִזְרַח సూర్యుడు ప్రకాశిస్తూ పైకి రావడాన్ని సూచిస్తుంది. ‘ఉదయించే వేళ’ తెలుగు కవితాత్మక భావాన్నీ కాలసంబంధాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: మేఘాలు లేని ఉదయం
  rationale: పదచిత్రాన్ని నేరుగా, సులభమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: מִנֹּגַהּ מִמָּטָר
  choice: వాన తరువాతి వెలుగులో
  rationale: రెండు מִן ఉపసర్గల సంబంధం ఈ సంక్షిప్త కవితా పాదంలో సందిగ్ధంగా ఉంది. తెలుగులో అర్థమయ్యేలా వాన తరువాత కనిపించే వెలుగనే సహజ దృశ్యంగా ఇచ్చాం; అడుగుటిప్పణిలో హెబ్రీ నిర్మాణపు సంక్షిప్తతను తెలిపాం.
- source_word: דֶּשֶׁא מֵאָרֶץ
  choice: భూమి నుండి మొలిచే పచ్చిక
  rationale: דֶּשֶׁא తాజా పచ్చని మొలకలు లేదా గడ్డిని సూచిస్తుంది. మూలంలో ‘మొలిచే’ అనే క్రియ ప్రత్యక్షంగా లేకపోయినా, భూమి నుండి పచ్చిక రావడం అనే సంక్షిప్త చిత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని అంతర్లీన కర్త
  choice: మునుపటి వచనంలోని నీతిమంతుడైన పాలకుని సూచిస్తూ ‘అతడు’ అని స్పష్టపరచడం
  alternative: ‘మరియు ఉదయకాంతిలా...’ అని కర్తలేని కవితా ఖండంగా ఉంచడం
  rationale: హెబ్రీ కవిత్వం ఉద్దేశపూర్వకంగా సంక్షిప్తమైనప్పటికీ, 3వ వచనమే కర్తను నిర్దేశిస్తుంది. ‘అతడు’ అనడం కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: చివరి పాదంలోని ఉపసర్గల సంబంధం
  choice: వాన తరువాతి వెలుగులో భూమి నుండి మొలిచే పచ్చిక అనే దృశ్యం
  alternative: ‘వెలుగు నుండి, వాన నుండి, భూమి నుండి పచ్చిక’ అనే పదానుక్రమ రూపం
  rationale: మూలంలోని מִן ఉపసర్గలు కవితాత్మకంగా కుదించబడి ఉండటం వల్ల సంబంధం పూర్తిగా స్పష్టం కాదు. ప్రధాన పాఠంలో సహజ దృశ్యాన్ని అందించి, అడుగుటిప్పణిలో అక్షరార్థ నిర్మాణాన్ని ఉంచడం ద్వారా సందిగ్ధతను దాచకుండా చదవదగిన అనువాదం ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కవితాత్మక శైలిని వాడాం. ‘ఉదయకాంతి,’ ‘మేఘాలు లేని ఉదయం,’ ‘మొలిచే పచ్చిక’ అనే పదచిత్రాలు మూలంలోని సమాంతరతను సహజంగా మోస్తాయి; హెబ్రీ చివరి పాదంలోని నిజమైన వ్యాకరణ సందిగ్ధతను అడుగుటిప్పణిలో నిలిపాం.
