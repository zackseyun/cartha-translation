lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: బెనాయా
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని, బైబిలు నామరూప సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פִּרְעָתֹנִי
  choice: పిరాతోనీయుడైన
  rationale: పిరాతోను ప్రాంతానికి చెందినవాడని తెలిపే హీబ్రూ జాతివాచక విశేషణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִדַּי
  choice: హిద్దయి
  rationale: మసొరేటిక్ పాఠంలోని వ్యక్తి పేరును లిప్యంతరీకరించాం; సమాంతర వంశావళిలోని భిన్న నామరూపాన్ని పాఠంలో కలపకుండా పాదటిప్పణిలో ఇచ్చాం.
- source_word: מִנַּחֲלֵי
  choice: వాగులోయలకు చెందిన
  rationale: נחל అనేది నీరు ఎల్లప్పుడూ ప్రవహించే వాగును మాత్రమే కాక, కాలానుగుణ ప్రవాహం వెళ్లే లోయ లేదా ప్రవాహపాత్రను కూడా సూచించగలదు. ‘వాగులోయలు’ భౌగోళిక భావాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גָעַשׁ
  choice: గాయషు
  rationale: స్థల నామాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
