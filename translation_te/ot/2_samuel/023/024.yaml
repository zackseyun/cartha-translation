translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపి, వ్యక్తినామాలకు గౌరవప్రదమైన సంప్రదాయ తెలుగు రూపాలు వాడబడ్డాయి. హీబ్రూ పాఠంలోని విరామరహిత యోధుల జాబితాను తెలుగులో స్పష్టత కోసం అర్ధవిరామంతో విభజించాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదటిప్పణి సూచిక ‘ముప్పై మంది’ తర్వాత ఉన్నప్పటికీ, దాని విషయం דֹּדֹו అనే పేరుకు సంబంధించినందున సూచికను ‘దోదో’ తర్వాత ఉంచాం.
