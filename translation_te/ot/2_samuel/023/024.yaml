lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: అసాహేలు
  rationale: హీబ్రూ వ్యంజన పాఠంలో విడిగా కనిపించినా, ఇది తెలిసిన వ్యక్తినామమైన עֲשָׂהאֵל; ఆధునిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ‘అసాహేలు’ అని లిప్యంతరీకరించబడింది.
- source_word: אֲחִי יוֹאָב
  choice: యోవాబు సోదరుడైన
  rationale: కుటుంబ సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: בַּשְּׁלֹשִׁים
  choice: ముప్పై మందిలో ఒకడు
  rationale: ב ఉపసర్గ ఇక్కడ దావీదు శూరుల సమూహంలో సభ్యత్వాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి సహజంగా అర్థమయ్యేలా వ్యక్తి సూచనను స్పష్టం చేసింది.
- source_word: אֶלְחָנָן
  choice: ఎల్హానాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בֶּן דֹּדֹו
  choice: దోదో కుమారుడు
  rationale: మసోరా పాఠంలోని דֹּדֹו ను వ్యక్తినామంగా యథాతథంగా ఉంచింది; సమాంతర పాఠంలోని భిన్నరూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: בֵּית לָחֶם
  choice: బేత్లెహేముకు చెందిన
  rationale: స్థల సంబంధాన్ని సూచించే ఈ సంక్షిప్త హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
