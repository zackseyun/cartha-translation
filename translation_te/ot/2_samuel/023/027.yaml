    text: హీబ్రూలో “అనాతోతువాడు,” “హూషావాడు” అనే జెంటిలిక్ రూపాలు ఉన్నాయి; ఇవి ఆ ప్రాంతానికి చెందినవారిని లేదా దానితో సంబంధమున్నవారిని సూచిస్తాయి.
