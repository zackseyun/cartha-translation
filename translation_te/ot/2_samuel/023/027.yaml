lexical_decisions:
- source_word: אֲבִיעֶזֶר
  choice: అబీయెజెరు
  rationale: వ్యక్తిపేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: הָעַנְּתֹתִי
  choice: అనాతోతువాడైన
  rationale: ఇది అనాతోతుకు చెందినవాడిని లేదా అక్కడి నివాసిని సూచించే gentilic రూపం. జాబితాలోని సంక్షిప్త విశేషణ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: מְבֻנַּי
  choice: మెబున్నయి
  rationale: మసొరెటిక్ పాఠంలోని వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַחֻשָׁתִי
  choice: హూషావాడైన
  rationale: ఇది హూషా ప్రాంతానికి లేదా ఆ వంశసంబంధానికి చెందినవాడిని సూచించే gentilic రూపం; ముందున్న పదబంధానికి సమాంతరంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక వీరుల జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. రెండు gentilic పదబంధాల సమాంతర నిర్మాణాన్ని కాపాడాం.
