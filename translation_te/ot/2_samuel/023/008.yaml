source:
  edition: WLC
  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: te
  text: 'దావీదుకు చెందిన శూరుల పేర్లు ఇవి: తహ్కెమోనీయుడైన యోషేబ్-బష్షెబెత్[a]—అతడు ముగ్గురికి అధిపతి[b]. అతడు అదీనో ఎజ్నీయుడు[c]; అతడు ఒకేసారి ఎనిమిది వందల మందిపై తన ఈటెను ప్రయోగించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని హెబ్రీ పాఠం క్లిష్టంగా ఉంది. “యోషేబ్-బష్షెబెత్” అనేది మసొరెటిక్ పాఠాన్ని అనుసరిస్తుంది; 1 దినవృత్తాంతాలు 11:11లోని సమాంతర పాఠంలో “హక్మోనీయుడైన యాషొబాము” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: కొన్ని ప్రాచీన సాక్ష్యాలు, వ్యాఖ్యానాల ప్రకారం “ముప్పైమందికి అధిపతి” అని కూడా అనువదించవచ్చు; మసొరెటిక్ పాఠం “ముగ్గురికి అధిపతి” అని ఉంది.
    reason: alternative_reading
  - marker: c
    text: “అదీనో ఎజ్నీయుడు” అనే హెబ్రీ పదబంధం అర్థం చేసుకోవడం చాలా కష్టం. చాలామంది దీనిని “అతడు తన ఈటెను ప్రయోగించాడు” లేదా “తన ఈటెను ఎత్తాడు” అనే భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: శూరులు
  rationale: యుద్ధంలో పరాక్రమం చూపిన వీరులను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: లామెద్ సూచించే అనుబంధాన్ని తెలియజేస్తుంది; వీరు దావీదు పక్షంలోని యోధులని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: యోషేబ్-బష్షెబెత్
  rationale: మసొరెటిక్ పాఠంలోని క్లిష్ట రూపాన్ని సవరించకుండా వ్యక్తినామంగా లిప్యంతరీకరించి, దినవృత్తాంతాల సమాంతర పాఠాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: תַּחְכְּמֹנִי
  choice: తహ్కెమోనీయుడు
  rationale: సమూహం లేదా వంశ సంబంధాన్ని సూచించే హెబ్రీ రూపానికి సమీపమైన లిప్యంతరీకరణ.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: ముగ్గురికి అధిపతి
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న పాఠం ప్రకారం ‘ముగ్గురిలో/ముగ్గురికి అధిపతి’ అనే భావాన్ని నిలుపుతుంది; ‘ముప్పైమందికి అధిపతి’ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: అదీనో అనే ఎజ్నీయుడు
  rationale: అత్యంత క్లిష్టమైన మసొరెటిక్ పదబంధాన్ని ఊహాత్మకంగా సవరించకుండా పేరు, బిరుదుగా నిలిపాం; ఈటెను ప్రయోగించాడనే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలిపాం.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: ఎనిమిది వందలమందిని హతమార్చాడు
  rationale: חָלָל ఇక్కడ హతులైనవారిని సూచిస్తుంది. తెలుగులో అసహజమైన ‘హతులపై’ అనే నిర్మాణాన్ని తప్పించి, యుద్ధ సందర్భంలో అంతర్లీనమైన క్రియను సహజంగా వ్యక్తపరిచాం.
- source_word: בְּפַעַם אֶחָד
  choice: ఒకేసారి
  rationale: ఒకే సందర్భంలో లేదా ఒకే పోరాటంలో జరిగిన కార్యాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
