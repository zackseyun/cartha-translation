id: 2SA.23.18
reference: 2 Samuel 23:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲבִישַׁ֞י אֲחִ֣י יוֹאָ֣ב בֶּן צְרוּיָ֗ה ה֚וּא רֹ֣אשׁ ה/שלשי וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל וְ/ל/וֹ שֵׁ֖ם בַּ/שְּׁלֹשָֽׁה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: te
  text: సెరూయా కుమారుడైన యోవాబు సోదరుడు అబీషై ఆ ముగ్గురికి నాయకుడు[a]. అతడు తన ఈటెను మూడు వందల మందిమీద ప్రయోగించి వారిని చంపాడు[b]; ఆ ముగ్గురిలో అతనికి ఖ్యాతి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం: “ఆ ముగ్గురికి నాయకుడు.” అయితే 1 దినవృత్తాంతాలు 11:20లోని సమాంతర వచనం, ఈ భాగంలోని పాఠభేద సమస్యల ఆధారంగా కొందరు దీనిని “ముప్పైమందికి నాయకుడు” అని అర్థం చేసుకుంటారు.'
    reason: textual_variant
  - marker: b
    text: 'లేదా: “తన ఈటెను మూడు వందలమందికి ఎదురుగా ఎత్తాడు; వారు హతులయ్యారు.” హీబ్రూ వాక్యం చాలా సంక్షిప్తంగా, అక్షరార్థంగా “తన ఈటెను మూడు వందల హతుల మీద లేపాడు” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: ఆ ముగ్గురికి నాయకుడు
  rationale: רֹאשׁ అనే పదానికి ‘తల/నాయకుడు’ అనే అర్థం ఉంది. మసొరా పాఠంలోని రూపాన్ని, వచనం చివర ఉన్న בַּשְּׁלֹשָׁהను అనుసరించి ‘ముగ్గురు’ అనే అర్థాన్ని ప్రధాన పాఠంలో ఉంచాం; ‘ముప్పైమంది’ అనే పాఠసంభావ్యతను పాదటిప్పణిలో తెలిపాం.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: తన ఈటెను ... ప్రయోగించి
  rationale: עורר అక్షరార్థంగా ‘లేపు/రేపు’ అని అర్థమిచ్చినా, యుద్ధ సందర్భంలో ఈటెను క్రియాశీలంగా ఉపయోగించడాన్ని సహజమైన ఆధునిక తెలుగులో ‘ప్రయోగించి’ తెలియజేస్తుంది.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: మూడు వందల మందిమీద ... వారిని చంపాడు
  rationale: חָלָל అంటే ‘పొడవబడి చనిపోయినవాడు/హతుడు.’ హీబ్రూ వాక్యం సంక్షిప్తంగా ‘మూడు వందల హతుల మీద’ అని ఉంటుంది; సందర్భంలో సూచితమైన ఫలితాన్ని సహజ తెలుగులో స్పష్టంచేశాం, అదే సమయంలో అక్షరార్థపు సంక్షిప్తతను పాదటిప్పణిలో నిలిపాం.
- source_word: וְלוֹ שֵׁם
  choice: అతనికి పేరు ప్రఖ్యాతులు ఉండేవి
  rationale: అక్షరార్థంగా ‘అతనికి పేరు ఉండెను’ అనే హీబ్రూ నుడికారం కీర్తి లేదా ఖ్యాతిని సూచిస్తుంది. ‘పేరు ప్రఖ్యాతులు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּשְּׁלֹשָׁה
  choice: ఆ ముగ్గురిలో
  rationale: בְּ ఉపసర్గ ఇక్కడ సమూహంతో సంబంధాన్ని సూచిస్తుంది; ‘ఆ ముగ్గురిలో’ తక్షణ పాఠరూపాన్ని, శ్రేష్ఠ యోధుల సమూహంతో అబీషై సంబంధాన్ని నిలుపుతుంది.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: అబీషై ... యోవాబు ... సెరూయా
  rationale: వ్యక్తినామాలను ఆధునిక తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు. పాఠభేదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదటిప్పణిలో భద్రపరిచాం; హీబ్రూ సంక్షిప్త యుద్ధవర్ణనను పాఠకసౌలభ్యార్థం ప్రధాన పాఠంలో కొద్దిగా స్పష్టంచేశాం.
