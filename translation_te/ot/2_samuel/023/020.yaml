id: 2SA.23.20
reference: 2 Samuel 23:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: te
  text: పరాక్రమశాలియైన వ్యక్తి కుమారుడైన యెహోయాదా కుమారుడు బెనాయా, కబ్సెయేలుకు చెందిన గొప్ప కార్యాలు చేసినవాడు, మోయాబుకు చెందిన ఇద్దరు అరియేలులను[a] కొట్టి పడేశాడు. మంచు పడిన ఒక రోజున అతడు గుంతలోకి దిగి, గుంత మధ్యలో ఉన్న సింహాన్ని కొట్టి పడేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం אֲרִאֵל (అరియేల్) అర్థం అనిశ్చితం. అది ‘సింహాలవంటి వీరులు,’ ‘శూరులు’ అని అర్థం కావచ్చు; లేదా ఒక బిరుదు లేక పేరు కావచ్చు. ఈ అస్పష్టతను కాపాడటానికి ప్రధాన పాఠ్యంలో ‘అరియేలులు’ అనే రూపాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: పరాక్రమశాలి
  rationale: ఈ వీరుల జాబితాలో ఈ పదబంధం కేవలం ‘బతికున్న మనిషి’ అని కాక, బలం లేదా శౌర్యం గల వ్యక్తిని సూచించే జాతీయ ప్రయోగంగా ఉంది.
- source_word: רַב פְּעָלִים
  choice: గొప్ప కార్యాలు చేసినవాడు
  rationale: అనేక విశేషమైన సాహసకార్యాలు చేసిన వ్యక్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִקַּבְצְאֵל
  choice: కబ్సెయేలుకు చెందిన
  rationale: מִן ఉపసర్గ సూచించే మూలస్థల భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: ఇక్కడ మోయాబు యోధులను, తరువాత సింహాన్ని ఎదుర్కొన్న వీరోచిత సందర్భంలో నכה ప్రాణాంతకంగా కొట్టి చంపడాన్ని సూచిస్తుంది.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: మోయాబుకు చెందిన ఇద్దరు అరియేలులు
  rationale: అర్థం వివాదాస్పదమైన אֲרִאֵל పదాన్ని ఒకే వ్యాఖ్యానంగా మార్చకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించి, వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: יָרַד
  choice: దిగి
  rationale: గుంతలోకి దిగిన దిశాత్మక చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲרִי
  choice: సింహం
  rationale: నిర్దిష్టమైన సింహాన్ని సూచించే సాధారణ నామవాచకానికి సరళమైన తెలుగు సమానం.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: గుంతలోకి … అందులో ఉన్న
  rationale: בּוֹר కు సాధ్యమైన ‘గుంత/నీటి తొట్టి’ అర్థాలలో సందర్భానికి విస్తృతమైన ‘గుంత’ను ఎంచుకుని, בְּתוֹךְ భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలిపాం.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: మంచు పడిన ఒక రోజున
  rationale: ‘మంచు దినమున’ అనే హీబ్రూ కాలసూచనను అతి నిర్దిష్టత లేకుండా సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אֲרִאֵל అనే అస్పష్ట పదం యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘అరియేలులు’ అని రూపాన్ని నిలిపి, పాదసూచికలో సాధ్యార్థాలు ఇవ్వడం
  alternative: ‘సింహాలవంటి వీరులు,’ ‘వీరులు,’ లేదా ‘అరియేలు కుమారులు’ అని నేరుగా అనువదించడం
  rationale: మూలపాఠంలోని నిజమైన పదార్థ అస్పష్టతను ఏ ఒక్క వ్యాఖ్యానంతోనూ ముందుగానే పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని ఉపయోగించాం. అస్పష్టమైన ‘అరియేల్’ పదాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం; పాదసూచిక గుర్తు అదే పదం వద్ద ఉంచాం. ‘కబ్సెయేలు,’ ‘మోయాబు’ వంటి పేర్లకు తెలుగు బైబిల్ సంప్రదాయానికి అనుగుణమైన రూపాలు వాడాం.
