id: 2SA.23.9
reference: 2 Samuel 23:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: te
  text: అతని తరువాత అహోహి కుమారుడైన దోదో కుమారుడు ఎలియాజరు ఉన్నాడు.[a] దావీదుతో ఉన్న ముగ్గురు పరాక్రమశాలుల్లో అతడు ఒకడు. యుద్ధం కోసం అక్కడ సమకూడిన ఫిలిష్తీయులను వారు ధిక్కరించినప్పుడు,[c] ఇశ్రాయేలు మనుషులు పైకి వెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహోహీయుని కుమారుడైన దోదయి కుమారుడు.”
    reason: దది మరియు అహోహి రూపాలను వ్యక్తినామం లేదా వంశసూచకంగా అర్థం చేసుకోవడంలో పాఠార్థ ప్రత్యామ్నాయం ఉంది.
  - marker: b
    text: అక్షరార్థంగా, “పైకి వెళ్లారు”; ఈ సందర్భంలో “వెనుదిరిగారు” అని కూడా అర్థం కావచ్చు.
    reason: עלה యొక్క అక్షరార్థాన్నీ యుద్ధసందర్భంలో సాధ్యమైన ప్రయోగార్థాన్నీ సంరక్షిస్తుంది.
  - marker: c
    text: “ధిక్కరించినప్పుడు” అనే మాటను “నిందించినప్పుడు” లేదా “అవమానించినప్పుడు” అని కూడా అనువదించవచ్చు.
    reason: חרף క్రియలో నిందించడం, అవమానించడం, ధిక్కరించడం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: ו/אחר/ו
  choice: అతని తరువాత ... ఉన్నాడు
  rationale: మునుపటి వీరుని తరువాతి స్థానంలో ఎలియాజరును పరిచయం చేసే క్రియారహిత గుర్తింపు వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: అహోహి వంశస్థుడైన దోదో కుమారుడు
  rationale: వ్యంజన పాఠంలోని దోదోను వ్యక్తినామంగా ఉంచి, אֲחֹחִי రూపాన్ని సహజ తెలుగులో వంశ/కుల సంబంధ సూచనగా వ్యక్తం చేస్తుంది; మరో పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: ముగ్గురు పరాక్రమశాలుల్లో అతడు ఒకడు
  rationale: సైనిక-వీరోచిత సందర్భంలోని גברים భావాన్ని తెలియజేస్తూ, ముగ్గురిలో సభ్యత్వాన్ని స్పష్టంగా, సహజంగా చెబుతుంది.
- source_word: עִם דָּוִד
  choice: దావీదుతో ఉన్న
  rationale: సహవాసం లేదా అనుబంధం అనే సరళ భావాన్ని నిలుపుతుంది.
- source_word: בְּ/חָרְפָם
  choice: వారు నిందిస్తూ సవాలు చేసినప్పుడు
  rationale: חרף లోని అవమానించడం/దూషించడం అనే మూలభావాన్నీ, యుద్ధ సందర్భంలోని ధిక్కార సవాలునూ కలిపి వ్యక్తం చేస్తుంది; కర్తను సందర్భానుసారం దావీదు మరియు అతని వీరులుగా బహువచనంలో ఉంచుతుంది.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ప్రజానామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: యుద్ధం చేయడానికి అక్కడ సమకూడిన
  rationale: నిఫాల్ రూపంలోని సమకూడుట భావాన్ని ఫిలిష్తీయులను విశేషించే సహజ తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: וַֽ/יַּעֲלוּ אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మనుషులు వెళ్లిపోయారు
  rationale: עלה యొక్క ప్రాథమిక కదలిక భావాన్ని అతిగా నిర్ణయించకుండా సహజ తెలుగులో ఇస్తుంది; అక్షరార్థమైన ‘పైకి వెళ్లారు’ మరియు సందర్భసాధ్యమైన ‘వెనుదిరిగారు’ పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: חרף అనే క్రియలో నింద/అవమానం మరియు సవాలు/ధిక్కారం రెండూ వినిపించడం
  choice: నిందిస్తూ సవాలు చేసినప్పుడు
  alternative: ధిక్కరించినప్పుడు
  rationale: పదంలోని అవమానకర వాక్కు భావాన్ని తొలగించకుండా యుద్ధ సందర్భంలోని సవాలును కూడా నిలుపుతుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చదు.
- issue: עלה యొక్క సందర్భార్థం
  choice: వెళ్లిపోయారు
  alternative: వెనుదిరిగారు
  rationale: హీబ్రూ క్రియ అక్షరార్థంగా ‘పైకి వెళ్లారు’ అని ఉన్నా, యుద్ధసందర్భంలో వెనక్కి వెళ్లడాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఉద్దేశపూర్వక అస్పష్టతను కొంత నిలుపుతూ, ప్రత్యామ్నాయాలను పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించాం. వ్యక్తినామాలు, జాతినామాలు తెలుగు బైబిలు సంప్రదాయానికి దగ్గరగా ఉంచబడ్డాయి; మూలంలోని నిజమైన పాఠార్థ అస్పష్టతలు పాదసూచికల్లో నిలుపబడ్డాయి.
