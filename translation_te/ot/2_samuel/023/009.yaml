- from: అతని తరువాత అహోహి వంశస్థుడైన దోదో కుమారుడు ఎలియాజరు ఉన్నాడు.[a] దావీదుతో ఉన్న ముగ్గురు పరాక్రమశాలుల్లో అతడు ఒకడు. యుద్ధం చేయడానికి అక్కడ సమకూడిన ఫిలిష్తీయులను వారు నిందిస్తూ సవాలు చేసినప్పుడు, ఇశ్రాయేలు మనుషులు వెళ్లిపోయారు.[b][c]
