  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/022.yaml
  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా ఈ కార్యాలు చేశాడు; ఆ ముగ్గురు వీరులలో అతనికి పేరు ఉంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ ముగ్గురు వీరులలో అతడు ప్రసిద్ధి పొందాడు.” హీబ్రూ నుడికారం అక్షరార్థంగా “అతనికి పేరు ఉంది” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: దావీదు వీరుల విస్తృత జాబితాను దృష్టిలో ఉంచుకుని కొందరు వ్యాఖ్యాతలు “ముప్పైమంది” అనే పాఠంతో పోల్చి అర్థం చేసుకుంటారు; అయితే ఇక్కడి హీబ్రూ పాఠంలో “ముగ్గురు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: ఈ కార్యాలు చేశాడు
  rationale: ఇంతకుముందు వివరించిన బెనాయా సాహసకార్యాలను సూచించే పునరుద్ధరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది; వ్యక్తి పేర్లను లిప్యంతరీకరించింది.
- source_word: וְלוֹ שֵׁם
  choice: అతనికి పేరు ఉంది
  rationale: అక్షరార్థంగా ‘అతనికి పేరు ఉంది’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఖ్యాతిని సూచిస్తుంది.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: ఆ ముగ్గురు వీరులలో
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలోని ‘ముగ్గురు’ను అనుసరిస్తూ, גִּבֹּרִיםను సందర్భానుసారంగా ‘వీరులు’ అని అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘పేరు ఉంది’ అనే నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావాన్ని పాదసూచికలో తెలిపింది. రెండు పాదసూచిక గుర్తులూ సంబంధిత వాక్యభాగం తరువాత ఉంచబడ్డాయి.
