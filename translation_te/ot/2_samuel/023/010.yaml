source:
  edition: WLC
  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: te
  text: అతడు లేచి, తన చెయ్యి అలసిపోయేంతవరకు ఫిలిష్తీయులను హతమార్చాడు; అతని చెయ్యి కత్తికి అంటుకుపోయింది. ఆ రోజున యాహ్వే గొప్ప విజయాన్ని కలిగించాడు.[a] ప్రజలు అతని వెంట తిరిగి వచ్చారు—హతులైనవారి ఆయుధసామగ్రిని, కొల్లసొమ్మును తీసుకోవడానికి మాత్రమే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొప్ప విడుదల’ లేదా ‘గొప్ప రక్షణ’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం విస్తృతంగా రక్షించడాన్ని సూచించగలదు; ఇక్కడ యుద్ధంలో యాహ్వే కలిగించిన నిర్ణయాత్మక విజయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఒలిచివేయడానికి మాత్రమే’; అంటే యుద్ధం తరువాత హతులైనవారి ఆయుధాలు, కవచం, ఇతర కొల్లసొమ్ము తీసుకోవడం.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: లేచి
  rationale: యుద్ధంలో నిర్ణయాత్మకంగా చర్యకు దిగడాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను హతమార్చాడు
  rationale: సైనిక సందర్భంలో נכה బలంగా కొట్టడం, సాధారణంగా ప్రాణాంతకంగా సంహరించడం అనే భావాన్ని ఇస్తుంది.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: తన చెయ్యి అలసిపోయేంతవరకు
  rationale: יגע సూచించే శారీరక అలసటను, עַד כִּי యొక్క పరిమితి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: అతని చెయ్యి కత్తికి అంటుకుపోయింది
  rationale: דבק లోని అంటుకోవడం లేదా గట్టిగా అతుక్కుపోవడం అనే సజీవ చిత్రాన్ని కండరాల వైద్య వివరణతో పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: గొప్ప విజయం
  rationale: పదానికి రక్షణ, విడుదల అనే విస్తృత భావాలు ఉన్నప్పటికీ, ఈ యుద్ధ సందర్భంలో స్పష్టమైన ఫలితం ‘విజయం’; దానిని కలిగించినవాడు యాహ్వే అని వాక్యం తెలియజేస్తుంది.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: ప్రజలు అతని వెంట తిరిగి వచ్చారు
  rationale: ప్రజలు నిర్ణయాత్మక పోరాటం ముగిసిన తరువాత అతని వెనుక తిరిగి చేరారనే హెబ్రీ క్రమాన్ని అదనపు సైనిక వివరాలు చేర్చకుండా నిలుపుతుంది.
- source_word: אַךְ לְפַשֵּׁט
  choice: హతులైనవారి దగ్గర ఉన్నవి తీసుకోవడానికి మాత్రమే
  rationale: యుద్ధంలో పడిపోయినవారి ఆయుధాలు, కవచం, ఇతర సంపదను తీసుకోవడాన్ని ఆధునిక పాఠకునికి సహజంగా తెలియజేస్తూ אַךְ లోని ‘మాత్రమే’ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: యుద్ధ సందర్భంలో תְּשׁוּעָה అర్థం
  choice: విజయం
  alternative: విడుదల / రక్షణ
  rationale: ఈ పదం విస్తృతంగా రక్షణను సూచించగలదు. ఇక్కడ యుద్ధ ఫలితమే తక్షణ సందర్భం కాబట్టి ‘విజయం’ ఎంచుకున్నాం; అయినా ప్రత్యామ్నాయ భావాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘చెయ్యి కత్తికి అంటుకుపోయింది’ అనే మూలపాఠంలోని సజీవమైన, కొంత అస్పష్టమైన చిత్రణను అలాగే ఉంచాం. పాదసూచిక గుర్తులను వాటి అసలు విషయాలకు సరిపడే చోట్ల—‘విజయం’ తరువాత [a], హతులైనవారి సొత్తు తీసుకోవడం తరువాత [b]—ఉంచాం.
