  source_fidelity: 'మొత్తంగా హెబ్రీ మూలానికి నమ్మకంగా ఉంది: యుద్ధంలో అతని చేతి అలసిపోవడం, కత్తికి అతుక్కుపోవడం, యాహ్వే గొప్ప విజయాన్ని కలిగించడం, ఆ తరువాత ప్రజలు కొల్లసొమ్ము కోసం రావడం అన్నీ నిలిచాయి. అయితే ‘హతులైనవారి దగ్గర ఉన్నవి’ అనే చివరి పదబంధం మూలంలోని לְפַשֵּׁט (‘ఒలిచి/తీసివేసి ఆయుధసామగ్రి లేదా కొల్లసొమ్ము తీసుకోవడం’) భావాన్ని కొద్దిగా అస్పష్టంగా చేస్తుంది.'
