  to: అతడు లేచి, తన చెయ్యి అలసిపోయేంతవరకు ఫిలిష్తీయులను హతమార్చాడు; అతని చెయ్యి కత్తికి అంటుకుపోయింది. ఆ రోజున యాహ్వే గొప్ప విజయాన్ని కలిగించాడు.[a] ప్రజలు అతని వెంట తిరిగి వచ్చారు—హతులైనవారి ఆయుధసామగ్రిని, కొల్లసొమ్మును తీసుకోవడానికి మాత్రమే.[b]
