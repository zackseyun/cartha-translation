    issue: The word 'కూడా' adds an additive nuance.
    rationale: The second אָז repeats the temporal setting ('then/at that time'); it does not mean 'also.' The Hebrew וְ is simple coordination.
  - severity: low
    issue: '''కోట'' is somewhat narrower than מְצוּדָה.'
    rationale: The Hebrew denotes a stronghold or defensible refuge and need not specify a constructed castle. 'దుర్గం' is more semantically open while remaining natural.
