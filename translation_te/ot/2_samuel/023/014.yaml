  terminology: '''దుర్గం'' is an appropriate modern-standard Telugu rendering for ''stronghold.'' ''సైనిక స్థావరం'' suitably renders מַצָּב in this military context. ''ఫిలిష్తీయులు'' and ''బేత్లెహేము'' are standard forms.'
  issues:
