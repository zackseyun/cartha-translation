  yaml_path: translation/ot/2_samuel/023/014.yaml
  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: te
  text: ఆ సమయంలో దావీదు దుర్గంలో ఉన్నాడు, ఫిలిష్తీయుల సైనిక స్థావరం[a] ఆ సమయంలో బేత్లెహేములో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సైనిక స్థావరం” అని అనువదించిన హెబ్రీ పదం సైనిక దండు నిలిచే స్థలాన్ని లేదా అక్కడ నియమించబడిన సైనిక దండును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: ఆ సమయంలో ... ఆ సమయంలో
  rationale: మూలంలో ఈ కాలసూచక క్రియావిశేషణం రెండుసార్లు వచ్చింది. తెలుగులో సహజంగా ఉండేలా, అదే కాలపరమైన నొక్కింపును రెండు ఉపవాక్యాల్లోనూ నిలిపాం.
- source_word: מְצוּדָה
  choice: కోట
  rationale: దావీదు ఉన్న రక్షణాత్మక ప్రదేశాన్ని సూచించే సాధారణమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: מַצַּב
  choice: సైనిక స్థావరం
  rationale: ఈ సందర్భంలో ఫిలిష్తీయుల సైనిక దండు నిలిచిన లేదా నియమించబడిన స్థలాన్ని సూచిస్తుంది; హెబ్రీ పదం స్థావరాన్నీ, అక్కడి దండునీ సూచించగలదు.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాజాతికి ప్రామాణిక తెలుగు రూపం.
- source_word: בֵּית לָחֶם
  choice: బేత్లెహేము
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וְ
  choice: ; ... కూడా
  rationale: మూలంలోని సమన్వయ సంబంధాన్ని తెలుగులో సహజంగా చూపుతూ, రెండు పరిస్థితులు ఒకే సమయంలో ఉన్నాయని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని אָז పద పునరుక్తిని తొలగించకుండా సహజంగా నిలిపాం; రెండు నామవాచక వాక్యాలను తెలుగులో అవసరమైన ‘ఉన్నాడు/ఉంది’ రూపాలతో వ్యక్తం చేశాం.
