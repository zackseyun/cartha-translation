    text: ఇక్కడి హెబ్రీ పాఠం సంక్షిప్తంగా ఉండి అర్థం చేసుకోవడానికి కష్టంగా ఉంది. అక్షరార్థంగా, “షాల్బోనీయుడైన ఎల్యహ్బా, యాషేను కుమారులు, యోనాతాను” అని ఉంది. కొందరు ఈ పాఠ్యంలో ఒక అసంగతి ఉందని భావించి, “యోనాతాను”ను “యాషేను కుమారులు”లో ఒకడిగా తీసుకోవడం వంటి విధాలుగా ఈ జాబితాను పునర్నిర్మిస్తారు. అయితే ఈ అనువాదం పాఠాన్ని సవరించకుండా, అందిన హెబ్రీ పదప్రయోగాన్నే నిలుపుతుంది.
    reason: textual_variant
