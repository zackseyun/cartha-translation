revisions:
- from: దావీదు ఎంతో ఆశపడి, “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావి నీళ్లు ఎవరైనా నాకు తాగిస్తే ఎంత బాగుంటుంది!” అని అన్నాడు.[a]
  to: దావీదు ఎంతో కోరుకుని, “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావి నుండి నీళ్లు నాకు తాగడానికి ఎవరు ఇస్తారు?” అని అన్నాడు.[a]
