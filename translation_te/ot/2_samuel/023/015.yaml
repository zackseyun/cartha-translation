id: 2SA.23.15
reference: 2 Samuel 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְאַוֶּ֥ה דָוִ֖ד וַ/יֹּאמַ֑ר מִ֚י יַשְׁקֵ֣/נִי מַ֔יִם מִ/בֹּ֥אר בֵּֽית לֶ֖חֶם אֲשֶׁ֥ר בַּ/שָּֽׁעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/015.yaml
  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: te
  text: దావీదు ఎంతో కోరుకుని, “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావి నుండి నీళ్లు నాకు తాగడానికి ఎవరు ఇస్తారు?” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత భావానువాదంగా: “ద్వారం దగ్గర ఉన్న బేత్లెహేము బావి నుండి నీళ్లు నాకు తాగడానికి ఎవరైనా ఇస్తే ఎంత బాగుంటుంది!” హీబ్రూలో “ఎవరు...?” అనే ప్రశ్న ఇక్కడ బలమైన కోరికను వ్యక్తం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: ఎంతో ఆశపడి
  rationale: హిత్‌పయేల్ రూపం బలమైన కోరికను తెలియజేస్తుంది. ‘ఎంతో ఆశపడి’ అనేది భావోద్వేగ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמַר
  choice: అని అన్నాడు
  rationale: ఇది సాధారణంగా ‘అన్నాడు’ అనే అర్థమిచ్చే క్రియ. మూలంలో ‘తనలో తాను’ లేదా ‘బిగ్గరగా’ వంటి అదనపు భావం స్పష్టంగా లేదు.
- source_word: מִי
  choice: ఎవరైనా ... ఎంత బాగుంటుంది
  rationale: హీబ్రూలోని ‘ఎవరు...?’ అనే ప్రశ్న ఇక్కడ కోరికను వ్యక్తం చేసే వాక్యరీతి. తెలుగు పాఠకునికి అదే ప్రయోజనాన్ని సహజంగా తెలియజేయడానికి ఈ కోరికసూచక నిర్మాణాన్ని ఎంచుకున్నాం; అడుగుసూచనలో మరింత రూపసామ్యమైన ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: יַשְׁקֵנִי
  choice: నాకు తాగిస్తే
  rationale: שקה అనే క్రియ హిఫీల్ రూపంలో ‘త్రాగడానికి ఇవ్వడం/తాగించడం’ అనే కారణార్థాన్ని కలిగి ఉంది. ‘నాకు తాగిస్తే’ ఆ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: తాగునీటి సందర్భంలో ‘నీళ్లు’ అనేది సహజమైన ఆధునిక తెలుగు వాడుక.
- source_word: מִבֹּאר
  choice: బావి నీళ్లు
  rationale: בְּאֵר సాధారణంగా నీటి బావిని సూచిస్తుంది; ‘బావి నీళ్లు’ మూలంలోని ‘బావి నుండి నీరు’ అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בֵּית לֶחֶם
  choice: బేత్లెహేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: ద్వారం దగ్గర ఉన్న
  rationale: ఈ పదబంధం పట్టణ ద్వారానికి సమీపంలో ఉన్న ప్రత్యేక బావిని గుర్తిస్తుంది. ‘దగ్గర’ అనేది בַּ యొక్క స్థానసంబంధ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. మూలంలోని బలమైన కోరికను ప్రధాన పాఠ్యంలో సహజమైన తెలుగు కోరికసూచక నిర్మాణంతో అందించి, హీబ్రూ ప్రశ్నారూపాన్ని అడుగుసూచనలో నిలిపాం.
