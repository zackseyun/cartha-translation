  yaml_path: translation/ot/2_samuel/023/023.yaml
  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: te
  text: అతడు ముప్పైమందిలో గౌరవం పొందాడు[a]; అయితే ఆ ముగ్గురి స్థాయికి చేరుకోలేదు[b]. దావీదు అతణ్ణి తన అంగరక్షక దళానికి అధికారిగా నియమించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు ముప్పైమందికంటే ఎక్కువ గౌరవం పొందాడు.’ హీబ్రూ నిర్మాణం అతడు ఆ సమూహంలో గౌరవించబడ్డాడని లేదా వారికంటే ఎక్కువ గౌరవించబడ్డాడని అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అయితే అతడు ఆ ముగ్గురి వద్దకు రాలేదు’; అంటే, అత్యున్నత స్థానంలోని ఆ ముగ్గురు వీరుల హోదాను అతడు అందుకోలేదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘తన మిష్మాఅత్‌కు.’ దీనికి ‘తన ఆజ్ఞాధీనంలో’ లేదా ‘తన రక్షక దళంపై’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ‘అంగరక్షక దళం’ అనేది సందర్భానికి సరిపోయే సైనిక అర్థాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים
  choice: ముప్పైమందిలో
  rationale: מִן ఇక్కడ సమూహంలో స్థానాన్ని లేదా ఆ సమూహంతో పోలికను సూచించవచ్చు. వీరుల జాబితా సందర్భంలో సమూహంలో గౌరవస్థానాన్ని తెలిపే సహజమైన తెలుగు రూపంగా ‘ముప్పైమందిలో’ ఎంచుకోబడింది; తులనాత్మక అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִכְבָּד
  choice: గౌరవం పొందాడు
  rationale: כבד ధాతువు నిఫాల్ రూపం గౌరవించబడడం లేదా ఘనత పొందడం అనే నిష్క్రియ భావాన్ని ఇస్తుంది. ‘గౌరవం పొందాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: అయితే ఆ ముగ్గురి స్థాయికి చేరుకోలేదు
  rationale: בוא אֶל అనే నిర్మాణం ఇక్కడ కేవలం భౌతికంగా రావడాన్ని కాక, స్థానం లేదా హోదాను అందుకోవడాన్ని సూచిస్తుంది. ‘స్థాయికి చేరుకోలేదు’ సందర్భంలోని వీరుల శ్రేణిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְשִׂמֵהוּ
  choice: దావీదు అతణ్ణి … అధికారిగా నియమించాడు
  rationale: שׂים యొక్క మూలార్థం ‘ఉంచు’ అయినప్పటికీ, ఒక బాధ్యత లేదా అధికార స్థానాన్ని అప్పగించే సందర్భంలో ‘నియమించాడు’ సరైన సహజ సమానార్థకం.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: తన అంగరక్షక దళానికి అధికారిగా
  rationale: מִשְׁמַעַת ఆజ్ఞ, అధికారం కింద ఉన్నవారు, లేదా రక్షక దళం అనే భావాలను కలిగి ఉండవచ్చు. రాజసైనిక సందర్భంలో వ్యక్తిగత రక్షక దళం అనే భావం సంభావ్యమైనది; ‘అధికారిగా’ అనే పదం אֶל నిర్మాణంతో కూడిన నియామక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
