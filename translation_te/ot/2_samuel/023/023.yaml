translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. వీరుల హోదాల మధ్య తేడాను సహజంగా తెలిపేందుకు ‘స్థాయికి చేరుకోలేదు’ అని అనువదించాం. మూలంలోని מִן మరియు מִשְׁמַעַת పదాల నిజమైన సందిగ్ధతలను ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదటిప్పణుల్లో భద్రపరిచాం.
