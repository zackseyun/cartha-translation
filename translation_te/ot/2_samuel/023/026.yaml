lexical_decisions:
- source_word: חֶלֶץ
  choice: హేలెజు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించబడింది.
- source_word: הַפַּלְטִי
  choice: పల్తీయుడైన
  rationale: నిర్దిష్ట ఉపజాతి లేదా ప్రాంత సంబంధాన్ని తెలిపే పదం. ఈ వచనంలోని హీబ్రూ రూపాన్ని నేరుగా అనుసరించి ‘పల్తీయుడు’ అని అనువదించబడింది.
- source_word: עִירָא
  choice: ఈరా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: בֶן
  choice: కుమారుడు
  rationale: వంశ సంబంధాన్ని తెలిపే సాధారణ హీబ్రూ పదం; తెలుగు పేర్ల వరుసలో సహజమైన ‘కుమారుడు’ వాడబడింది.
- source_word: עִקֵּשׁ
  choice: ఇక్కేషు
  rationale: వ్యక్తి పేరు; హీబ్రూలోని ద్విత్వ క ధ్వనిని నిలుపుతూ తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הַתְּקוֹעִי
  choice: తెకోవీయుడైన
  rationale: తెకోవ ప్రాంతానికి చెందినవాడని తెలిపే నిర్దిష్ట ప్రాంతవాచక విశేషణం; హీబ్రూ సంక్షిప్త రూపాన్ని నిలుపుతుంది.
