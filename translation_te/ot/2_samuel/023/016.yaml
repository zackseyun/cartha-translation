source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: te
  text: అప్పుడు ఆ ముగ్గురు పరాక్రమశాలులు ఫిలిష్తీయుల శిబిరాన్ని ఛేదించి, ద్వారం వద్దనున్న బేత్లెహేము బావిలోనుంచి నీళ్లు తోడారు. వాటిని మోసుకొని దావీదు దగ్గరకు తీసుకొచ్చారు. అయితే అతడు వాటిని తాగడానికి ఇష్టపడలేదు.[a] వాటిని యెహోవాకు కుమ్మరించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘వాటిని’ అని బహువచన ప్రత్యయం ఉంది; ‘నీళ్లు’ అనే పదం కూడా అక్కడ బహువచన రూపంలోనే ఉంది.
    reason: మూలభాషలోని సంఖ్యా రూపాన్ని తెలియజేయడం; తెలుగు పాఠం దానిని సహజంగా నిలుపుతుంది.
  - marker: b
    text: ఇది యెహోవాకు నీటిని అర్పణగా కుమ్మరించిన చర్య; దీనికి పానార్పణను పోలిన భావం ఉంది.
    reason: נסך అనే క్రియలో ఉన్న ఆచారపరమైన లేదా అర్పణాత్మక అంతర్భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా వివరించడం.
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: శిబిరాన్ని చీల్చుకొని వెళ్లి
  rationale: ఈ క్రియ ప్రత్యర్థి స్థావరాన్ని బలవంతంగా ఛేదించి వెళ్లడాన్ని సూచిస్తుంది; సైనిక సందర్భంలో ఈ పదబంధం సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ఆ ముగ్గురు పరాక్రమశాలులు
  rationale: గిబ్బోరీమ్ దావీదు సైన్యంలోని విశిష్ట యోధులను సూచించే బిరుదులాంటి పదం. ‘పరాక్రమశాలులు’ దాని బలం, గౌరవాన్ని నిలుపుతుంది.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరాన్ని
  rationale: హెబ్రీ ఉపసర్గ ఈ సందర్భంలో వారు చొచ్చుకుపోయిన సైనిక శిబిరాన్ని సూచిస్తుంది.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: నీళ్లు తోడారు
  rationale: బావిలోనుంచి నీటిని తీసే నిర్దిష్ట చర్యకు ఆధునిక తెలుగులో ‘నీళ్లు తోడారు’ సహజమైన ప్రయోగం.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: ద్వారం దగ్గర ఉన్న బేత్లెహేము బావిలోనుంచి
  rationale: బావి బేత్లెహేముకు చెందినదని, అది ద్వారం వద్ద లేదా సమీపంలో ఉందని తెలిపే స్థల సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: వాటిని మోసుకొని దావీదు దగ్గరకు తీసుకొచ్చారు
  rationale: నీటిని అక్కడినుంచి మోసుకొని వచ్చారనే వరుస చర్యలను సహజ తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘తిరిగి’ అనే భావాన్ని చేర్చలేదు.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: అతడు వాటిని తాగడానికి ఇష్టపడలేదు
  rationale: אָבָהలోని సమ్మతి లేదా ఇష్టానికి సంబంధించిన భావాన్ని కేవలం ‘తాగలేదు’ అని కాకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: వాటిని ... కుమ్మరించాడు
  rationale: మూలంలోని ద్రవాన్ని కుమ్మరించే ప్రత్యక్ష చర్యను ప్రధాన వాక్యంలో ఉంచి, దాని అర్పణ సంబంధమైన అంతర్భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని తెలుగులో సుపరిచితమైన రూపంలో వ్యక్తినామంగా అందిస్తుంది; ‘కు’ అనే విభక్తి ఆ చర్య దేవునికి అంకితమైనదని తెలియజేస్తుంది.
theological_decisions:
- issue: దావీదు నీటిని కుమ్మరించిన చర్య స్వభావం
  choice: యెహోవాకు చేసిన అర్పణాత్మక కుమ్మరింపు అనే భావాన్ని సూచిస్తూ, ప్రధాన వాక్యంలో కేవలం ప్రత్యక్ష చర్యను పేర్కొనడం
  alternative: దీనిని స్పష్టంగా ‘పానార్పణగా అర్పించాడు’ అని అనువదించడం, లేదా కేవలం తాగకుండా పారబోశాడని భావించడం
  rationale: נסך అనే క్రియకు ఆచారపరమైన పానార్పణ భావం ఉండవచ్చు; ‘యెహోవాకు’ అనే మాట కూడా అంకితభావాన్ని బలపరుస్తుంది. అయినా ఈ వచనం ఆచార విధిని వివరంగా నిర్వచించదు. కాబట్టి ప్రధాన పాఠం అతిగా నిర్ధారించకుండా, పాదసూచిక ఆ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘నీళ్లు తోడారు,’ ‘మోసుకొని,’ ‘కుమ్మరించాడు’ వంటి సహజ క్రియలను ఎంచుకున్నారు. కథనంలోని వేగవంతమైన వరుస చర్యలు నిలుపబడ్డాయి.
