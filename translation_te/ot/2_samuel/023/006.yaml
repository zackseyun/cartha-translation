source:
  edition: WLC
  text: וּ/בְלִיַּ֕עַל כְּ/ק֥וֹץ מֻנָ֖ד כֻּלָּ֑/הַם כִּֽי לֹ֥א בְ/יָ֖ד יִקָּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/006.yaml
  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: te
  text: కాని పనికిమాలినవారందరూ దూరంగా తోసివేయబడిన ముళ్లవంటివారు[a]; ఎందుకంటే వారిని చేతితో పట్టుకోలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం బెలీయాల్ తరువాత వ్యక్తినామంగా వాడబడిన అర్థాన్ని కాకుండా, ‘పనికిమాలిన’ లేదా ‘దుష్టులైన’ వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: కాని పనికిమాలినవారు
  rationale: ఇక్కడ בְּלִיַּעַל అనేది తరువాతి కాలంలో వ్యక్తినామంగా వాడిన ‘బెలీయాలు’ను సూచించదు; దుష్టులు లేదా విలువలేనివారిని సూచించే సమూహవాచక వ్యక్తి ప్రయోగం. సందర్భానికి సహజంగా ‘పనికిమాలినవారు’ అని అనువదించబడింది.
- source_word: כְּקוֹץ
  choice: ముళ్లవంటివారు
  rationale: మూలంలో ఏకవచన రూపం ఉన్నా ఇది సమూహార్థక ఉపమానం; బహువచన వ్యక్తులను సూచిస్తున్నందున తెలుగులో ‘ముళ్లవంటివారు’ సహజంగా ఉంది.
- source_word: מֻנָד
  choice: పారవేయబడిన
  rationale: ఈ నిష్క్రియార్థక కృదంతం తోసివేయబడిన లేదా దూరం చేయబడిన భావాన్ని ఇస్తుంది. ముళ్ల ఉపమానంలో ‘పారవేయబడిన’ అనేది ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כֻּלָּהֶם
  choice: అంతా
  rationale: ‘వారందరూ’ అనే సమగ్ర భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ పాదం మొదటి పాదంలోని ఉపమానానికి కారణాన్ని వివరిస్తుంది.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: వారిని చేతితో పట్టుకోలేరు
  rationale: ముళ్లను నేరుగా చేతితో పట్టుకోని ఆచరణాత్మక అసాధ్యతను తెలుగులో సహజంగా తెలుపుతుంది; వ్యక్తులను సూచించే ‘వారిని’ అనే రూపం ఉపమాన సంబంధాన్ని నిలుపుతుంది.
