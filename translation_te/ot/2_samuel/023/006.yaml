translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. హీబ్రూ కవితా ఉపమానాన్ని, కారణసంబంధాన్ని నిలుపుతూ అతివ్యాఖ్యానం నివారించబడింది.
