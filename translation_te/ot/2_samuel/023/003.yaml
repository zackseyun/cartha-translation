reference: 2 Samuel 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: te
  text: 'ఇశ్రాయేలు దేవుడు పలికాడు; ఇశ్రాయేలు శిల నాతో పలికాడు: “మనుష్యులను నీతిగా పరిపాలించేవాడు, దేవుని భయంతో పరిపాలించేవాడు[a]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాటలను ఆదర్శ రాజును వర్ణించే మెస్సీయ సంబంధిత మాటలుగా కూడా అర్థం చేసుకోవచ్చు; ఆ వర్ణన అంతిమంగా మెస్సీయలో నెరవేరుతుందని ఈ పఠనం భావిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు పలికాడు
  rationale: పరిపూర్ణ క్రియ ప్రవచనాత్మక ప్రకటనను పరిచయం చేస్తుంది. ఆధునిక తెలుగులో గంభీరంగా, సహజంగా ఉండేలా ‘పలికాడు’ అని అనువదించాం.
- source_word: לִי דִבֶּר
  choice: నాకు ఇలా చెప్పింది
  rationale: לִי ను సహజమైన పరోక్ష కర్మగా ‘నాకు’ అని తీసుకున్నాం; ‘నా గురించి’ అనే తక్కువ సంభావ్య అర్థాన్ని ప్రధాన పాఠ్యంలో స్వీకరించలేదు.
- source_word: צוּר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు బండ
  rationale: צוּר దేవునికి వాడిన రూపక బిరుదు. స్థిరత్వం, రక్షణ వంటి సూచనలను వివరణగా కలపకుండా మూల రూపకాన్ని నిలిపాం. తెలుగులో ‘బండ’ నపుంసకలింగం కావడంతో క్రియను ‘చెప్పింది’గా అన్వయించాం.
- source_word: מוֹשֵׁל בָּאָדָם
  choice: మనుష్యులను ... పరిపాలించేవాడు
  rationale: పాలనకు లోబడిన మానవ సమూహాన్ని సూచించే సమష్ట్యర్థక אָדָם ను ఆధునిక, సమగ్ర తెలుగులో ‘మనుష్యులను’గా ఇచ్చాం; participle యొక్క సాధారణ సూత్రార్థాన్ని ‘పరిపాలించేవాడు’ నిలుపుతుంది.
- source_word: צַדִּיק
  choice: నీతిగా
  rationale: రూపరీత్యా విశేషణమైనా, ఈ సంక్షిప్త కవితా వాక్యంలో పరిపాలించే విధానాన్ని సూచించే క్రియావిశేషణార్థం సహజం; అందువల్ల ‘నీతిగా’ అని ఇచ్చాం.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: దేవుని భయంతో పరిపాలించేవాడు
  rationale: రెండవ participial phrase ఆదర్శ పాలకుణ్ణి మరింత వర్ణిస్తుంది. ‘దేవుని భయం’లోని భక్తిపూర్వక జవాబుదారీతనాన్ని వ్యాఖ్యానంతో విస్తరించకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
theological_decisions:
- issue: సాధారణ రాజధర్మ వాక్యమా, మెస్సీయ సంబంధమైన వాక్యమా
  choice: ప్రధాన పాఠ్యంలో నీతిమంతుడైన ఆదర్శ పాలకుని గురించిన సాధారణ సూత్రంగా అనువదించాం.
  alternative: ఈ వర్ణనకు మెస్సీయ సంబంధమైన ప్రాధాన్యం ఉందనీ, అది అంతిమంగా మెస్సీయలో నెరవేరుతుందనీ అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ పాఠ్యం మెస్సీయను నేరుగా పేర్కొనకుండా ఆదర్శ పాలనను వర్ణిస్తుంది. కాబట్టి ప్రధాన పాఠ్యం ఆ పరిమితిని గౌరవిస్తుంది; సాధ్యమైన మెస్సీయ పఠనాన్ని పాదటిప్పణిలో ఉంచి వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కవితాత్మక గాంభీర్యం నిలిచే శైలిని వాడాం. మూలంలోని సమాంతర నిర్మాణం, ‘బండ’ అనే దైవ రూపకం, రెండుసార్లు వచ్చే ‘పరిపాలించేవాడు’ అనే నిర్మాణం నిలిపాం. వాక్యం తదుపరి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
