reference: 2 Samuel 23:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: te
  text: యెహోవా ఆత్మ నా ద్వారా మాట్లాడింది[a]; ఆయన మాట నా నాలుకపై ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాలో పలికింది.’ ఇక్కడి హీబ్రూ ఉపసర్గ ‘నాలో’ అనే భావాన్ని లేదా సాధనార్థకంగా ‘నా ద్వారా’ అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: యెహోవా ఆత్మ
  rationale: ప్రవచన వాక్కు సందర్భంలో רוּחַ అనేది గాలి లేదా ఊపిరి కంటే దేవుని క్రియాశీలమైన ఆత్మను సూచిస్తుంది. యెహోవా అనే నిబంధన నామాన్ని ప్రత్యక్షంగా ఉంచాం.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: דבר యొక్క సాధారణ భావం ‘మాట్లాడు’; దావీదు గతంలో పొందిన ప్రవచన వాక్కును తెలిపే సందర్భానికి భూతకాల రూపం సరిపోతుంది.
- source_word: בִּי
  choice: నా ద్వారా
  rationale: בְּ ఉపసర్గ ఇక్కడ సాధనార్థకంగా, దావీదు దేవుని వాక్కుకు మాధ్యమమయ్యాడనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘నా ద్వారా’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘నాలో’ అనే అక్షరార్థ అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּמִלָּתוֹ
  choice: ఆయన మాట
  rationale: מִלָּה అంటే ‘మాట’ లేదా ‘ఉచ్చారణ’; ‘మాట’ మూలపదానికి దగ్గరగా ఉండి దైవిక వాక్కు యొక్క బరువును నిలుపుతుంది.
- source_word: עַל לְשׁוֹנִי
  choice: నా నాలుకపై ఉంది
  rationale: హీబ్రూ రూపకాన్ని నేరుగా నిలుపుతూ, తెలుగులో అర్థమయ్యే సహజమైన వ్యక్తీకరణను ఎంచుకున్నాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నిబంధన నామమైన చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: רוּחַ ను వ్యక్తిగతమైన ‘ఆత్మ’గా లేదా ‘గాలి/ఊపిరి’గా అనువదించడం
  choice: ఆత్మ
  alternative: ఊపిరి లేదా గాలి
  rationale: యెహోవా మాట్లాడుతున్న ప్రవచన సందర్భం వ్యక్తిగతమైన దైవ కార్యశక్తిని సూచిస్తుంది; అందువల్ల ‘ఆత్మ’ సందర్భార్థానికి సరిపోతుంది, అయితే వాక్యం చెప్పినదానికంటే మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన ప్రవచన-కావ్య శైలిని వాడాం. మూలంలోని ‘నాలుకపై’ అనే దృశ్యరూపాన్ని నిలిపాం.
