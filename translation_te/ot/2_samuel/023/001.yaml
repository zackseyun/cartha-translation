id: 2SA.23.1
reference: 2 Samuel 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: te
  text: 'దావీదు చివరి మాటలు ఇవి:


    యెష్షయి కుమారుడైన దావీదు గంభీర ప్రకటన,

    ఉన్నతంగా ఎత్తబడిన మనిషి గంభీర ప్రకటన,

    యాకోబు దేవుని అభిషిక్తుడు,

    ఇశ్రాయేలు గీతాల మధుర గాయకుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: దావీదు చివరి మాటలు
  rationale: ‘మాటలు’ మరియు ‘చివరి’ అనే ప్రత్యక్ష అర్థాలను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: נְאֻם
  choice: పలికిన దైవోక్తి
  rationale: ఇది గంభీరమైన, ప్రవచనాత్మక ప్రకటనను పరిచయం చేసే సూత్రపదం; ‘దైవోక్తి’ ఆ ఉన్నత భావాన్ని వ్యక్తం చేస్తుంది, ‘పలికిన’ తెలుగు వాక్య నిర్మాణాన్ని సహజం చేస్తుంది.
- source_word: בֶּן יִשַׁי
  choice: యెష్షయి కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణానికి ప్రత్యక్ష అనువాదం.
- source_word: הַגֶּבֶר
  choice: మనిషి
  rationale: బలం లేదా ప్రాముఖ్యత అనే ఛాయ ఉండగలిగినా, సందర్భాన్ని అతిగా నిర్ధారించకుండా మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: הֻקַם עָל
  choice: ఉన్నత స్థానానికి ఎత్తబడిన
  rationale: దైవిక నిష్క్రియ రూపాన్నీ, పైకి ఎత్తడం లేదా ఘనపరచడం అనే చిత్రాన్నీ నిలుపుతుంది.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: యాకోబు దేవునిచేత అభిషేకించబడినవాడు
  rationale: ఇక్కడ ప్రత్యక్షంగా దావీదును సూచించే రాజసంబంధ అభిషేక భావాన్ని తెలుపుతూ, ‘మెస్సీయ’ అనే తరువాతి సాంకేతిక బిరుదును ప్రధాన పాఠ్యంలో ముందుగానే రుద్దదు.
- source_word: וּנְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గీతాలలో ప్రియమైనవాడు
  rationale: నిర్మాణం సంక్షిప్తంగా ఉండి ఒకటికంటే ఎక్కువ విధాలుగా అర్థమయ్యే అవకాశం ఉంది. ‘గీతాలలో ప్రియమైనవాడు’ అనే పఠనం נְעִים ను ‘ప్రియమైన/మనోహరమైన’గా, זְמִרוֹת ను ‘గీతాలు’గా నిలుపుతుంది; ప్రత్యామ్నాయంగా ‘మధుర గాయకుడు’ అనే అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: מְשִׁיחַ ను ఇక్కడ ప్రత్యక్ష మెస్సీయ బిరుదుగా అనువదించాలా?
  choice: అభిషేకించబడినవాడు
  alternative: యాకోబు దేవుని మెస్సీయ
  rationale: తక్షణ సందర్భంలో ఈ వర్ణన దావీదుకే వర్తిస్తుంది. అయినా రాజసంబంధమైన మెస్సీయ ఛాయను ‘అభిషేకించబడినవాడు’ నిలుపుతుంది; దానిని ప్రత్యక్ష క్రీస్తుసంబంధ గుర్తింపుగా నిర్ణయించదు.
- issue: נְעִים זְמִרוֹת יִשְׂרָאֵל యొక్క నిర్మాణం
  choice: ఇశ్రాయేలు గీతాలలో ప్రియమైనవాడు
  alternative: ఇశ్రాయేలు మధుర గాయకుడు
  rationale: హీబ్రూ పదబంధం ‘గాయకుడు’ అనే నామవాచకాన్ని స్పష్టంగా ఉపయోగించదు. ప్రధాన పాఠ్యం పదబంధపు సంక్షిప్తతను దగ్గరగా నిలుపుతుంది; సాంప్రదాయ గాయకుని పఠనాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా-ప్రవచన శైలిని వాడాం. మూలంలోని రెండుసార్ల נְאֻם నిర్మాణాన్ని పునరావృతం చేశాం. ప్రధాన పాఠ్యంలో ప్రతి పాదటిప్పణి గుర్తు [a], [b], [c] చేర్చబడింది; కవితా పంక్తుల రూపం సమాంతర నిర్మాణాన్ని స్పష్టపరుస్తుంది.
