  to: 'దావీదు చివరి మాటలు ఇవి:


    యెష్షయి కుమారుడైన దావీదు గంభీర ప్రకటన,

    ఉన్నతంగా ఎత్తబడిన మనిషి గంభీర ప్రకటన,

    యాకోబు దేవుని అభిషిక్తుడు,

    ఇశ్రాయేలు గీతాల మధుర గాయకుడు.'
  rationale: మూలంలో ఉన్న రెండుసార్ల నְאֻם ను సమాంతరంగా “గంభీర ప్రకటన”గా అనువదించాం; మూలంలో లేని “పలికిన” మరియు చివరి “మాటలు” పునరుక్తిని తొలగించాం. దేవునితో అభిషిక్తుని సంబంధాన్ని హీబ్రూ నిర్మాణానికి అనుగుణంగా “యాకోబు దేవుని అభిషిక్తుడు”గా చేశాం. చివరి పదబంధంలో సందర్భానికి సహజమైన “ఇశ్రాయేలు గీతాల మధుర గాయకుడు”ను ప్రధాన పాఠ్యంలో ఉంచి, పదబంధపు ప్రత్యామ్నాయ సంక్షిప్త అర్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
