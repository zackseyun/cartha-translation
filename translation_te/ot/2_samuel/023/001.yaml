- from: 'దావీదు చివరి మాటలు ఇవి:


    యెష్షయి కుమారుడైన దావీదు పలికిన దైవోక్తి,[a]

    ఉన్నత స్థానానికి ఎత్తబడిన మనిషి పలికిన దైవోక్తి,

    యాకోబు దేవునిచేత అభిషేకించబడినవాడు,[b]

