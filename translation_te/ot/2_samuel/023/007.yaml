source:
  edition: WLC
  text: וְ/אִישׁ֙ יִגַּ֣ע בָּ/הֶ֔ם יִמָּלֵ֥א בַרְזֶ֖ל וְ/עֵ֣ץ חֲנִ֑ית וּ/בָ/אֵ֕שׁ שָׂר֥וֹף יִשָּׂרְפ֖וּ בַּ/שָּֽׁבֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: te
  text: అయితే వాటిని తాకేవాడు[c] ఇనుముతోను ఈటె కాడతోను తనను తాను సన్నద్ధం చేసుకోవాలి[a]; అవి ఉన్న చోటనే[d] అగ్నితో పూర్తిగా కాల్చివేయబడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ఇనుముతోను ఈటె కాడతోను తనను తాను సిద్ధం చేసుకోవాలి.’ అక్షరార్థం: ‘ఇనుముతోను ఈటె చెక్కతోను నింపబడాలి.’'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవి అగ్నితో తప్పకుండా కాల్చివేయబడతాయి.’ హీబ్రూలో క్రియకు ముందు అదే క్రియకు చెందిన నిరపేక్ష క్రియారూపం (infinitive absolute) వచ్చి చర్యను బలంగా నొక్కిచెప్పుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘వాటిని’ అనేది ముందటి వచనంలో ముళ్లతో పోల్చబడిన పనికిమాలిన మనుషులను సూచిస్తుంది.
    reason: cross_reference
  - marker: d
    text: హీబ్రూలోని అరుదైన పదం యొక్క అర్థం అనిశ్చితం. సాధారణంగా ‘అవి ఉన్న చోటనే’ లేదా ‘అక్కడికక్కడే’ అని అర్థం చేసుకుంటారు; కొందరు దీనిని ‘నివాసస్థలంలో’ అని అర్థం చేసుకుంటారు.
    reason: textual_uncertainty
lexical_decisions:
- source_word: וְאִישׁ יִגַּע בָּהֶם
  choice: అయితే వాటిని తాకేవాడు
  rationale: וְ సందర్భంలో వ్యత్యాసాన్ని సూచిస్తుంది; אִישׁ ఇక్కడ సాధారణంగా ఎవరినైనా సూచిస్తుంది. נגע యొక్క ప్రాథమిక భావమైన ‘తాకు’ ముళ్ల ఉపమానానికి సరిపోతుంది.
- source_word: יִמָּלֵא
  choice: తనను తాను సిద్ధం చేసుకోవాలి
  rationale: మూలార్థం ‘నింపబడాలి’; అయితే ఇనుము, ఈటె దండం వంటి సాధనాలతో కూడిన ఈ నిర్మాణంలో ‘సన్నద్ధం చేసుకోవాలి/సామగ్రితో సిద్ధపడాలి’ అనే భావం సహజంగా వస్తుంది.
- source_word: בַרְזֶל
  choice: ఇనుము
  rationale: హీబ్రూ పదం ఒక నిర్దిష్ట ఇనుప పనిముట్టును చెప్పకుండా ‘ఇనుము’ అని మాత్రమే ఉంది; ఆ సాధారణతను నిలిపాం.
- source_word: וְעֵץ חֲנִית
  choice: ఈటె దండం
  rationale: అక్షరార్థంగా ‘ఈటె యొక్క చెక్క’; ఇది ఈటెకు ఉండే చెక్క దండాన్ని సూచిస్తుంది, ఈటె మొనను కాదు.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: పూర్తిగా కాల్చివేయాలి
  rationale: క్రియతో పాటు వచ్చిన infinitive absolute కాల్చే చర్యను బలపరుస్తుంది; ‘పూర్తిగా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּשָּׁבֶת
  choice: అవి ఉన్న చోటనే
  rationale: ఈ అరుదైన రూపాన్ని సందర్భంలో స్థలార్థకంగా, ‘అక్కడికక్కడే/ఉన్న చోటనే’ అని గ్రహించడం ముళ్లను అవి ఉన్న చోట కాల్చే చిత్రణకు సరిపోతుంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
