  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. ముళ్ల ఉపమానంలోని స్పష్టమైన వస్తు చిత్రణ కోసం ‘ఇనుము,’ ‘ఈటె దండం,’ ‘అగ్ని’ అనే నిర్దిష్ట పదాలను నిలిపాం.
