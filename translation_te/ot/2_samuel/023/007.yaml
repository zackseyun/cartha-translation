revisions:
- from: అయితే వాటిని తాకేవాడు[c] ఇనుముతోను ఈటె దండంతోను తనను తాను సిద్ధం చేసుకోవాలి[a]; అవి ఉన్న చోటనే వాటిని అగ్నితో పూర్తిగా కాల్చివేయాలి[b].
  to: అయితే వాటిని తాకేవాడు[c] ఇనుముతోను ఈటె కాడతోను తనను తాను సన్నద్ధం చేసుకోవాలి[a]; అవి ఉన్న చోటనే[d] అగ్నితో పూర్తిగా కాల్చివేయబడాలి[b].
  rationale: The revision retains the draft’s strong contextual rendering while making the burning clause passive, improving the idiomatic term for a spear’s wooden shaft, and adding a needed note for the disputed rare final Hebrew form. Footnote b is also made fully intelligible in Telugu.
