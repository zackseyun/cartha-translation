  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని చర్యల క్రమం, సంధాన స్వభావం నిలుపబడ్డాయి. ఆ ఐగుప్తీయుడి రూపానికి సంబంధించిన అస్పష్టతను ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
