source:
  edition: WLC
  text: וְ/הוּא הִכָּה֩ אֶת אִ֨ישׁ מִצְרִ֜י אשר מַרְאֶ֗ה וּ/בְ/יַ֤ד הַ/מִּצְרִי֙ חֲנִ֔ית וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: te
  text: అతడు గమనించదగిన రూపం కలిగిన[a] ఒక ఐగుప్తీయుణ్ణి కూడా పడగొట్టాడు. ఆ ఐగుప్తీయుడి చేతిలో ఈటె ఉంది. అతడు కర్రతో[b] అతని దగ్గరికి దిగివెళ్లి, ఆ ఐగుప్తీయుడి చేతిలోని ఈటెను లాక్కొని, ఆ ఐగుప్తీయుడి ఈటెతో అతన్ని చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందమైనవాడు,’ లేదా ‘గమనించదగిన రూపం ఉన్నవాడు.’ హీబ్రూ పదబంధం ఆ ఐగుప్తీయుడి బాహ్య రూపాన్ని విస్తృతంగా సూచిస్తుంది. 1 దినవృత్తాంతాలు 11:23లోని సమాంతర వాక్యాన్ని బట్టి, కొందరు ఇది అతని అసాధారణ ఎత్తును సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దండంతో,’ లేదా ‘కొర్రతో.’ హీబ్రూ שֵׁבֶט (షేవెట్) అనే పదం సందర్భానుసారం కర్ర, దండం, రాజదండం, లేదా కొట్టడానికి ఉపయోగించే కర్రను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: పడగొట్టాడు
  rationale: నכה అనే క్రియకు ‘కొట్టు/పడగొట్టు’ అనే భావం ఉంది. వాక్యం చివరలో చంపినట్లు ప్రత్యేకంగా చెప్పబడినందున, మొదటి క్రియను ‘చంపాడు’గా అనువదించకుండా చర్యల క్రమాన్ని నిలిపింది.
- source_word: אִישׁ מִצְרִי
  choice: ఒక ఐగుప్తీయుణ్ణి
  rationale: జాతి గుర్తింపును ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: אשר מַרְאֶה
  choice: చూడడానికి ఆకట్టుకునేలా ఉన్న
  rationale: మַרְאֶה బాహ్య రూపాన్ని సూచిస్తుంది. ఈ అనువాదం అందం లేదా అసాధారణ ఎత్తు అని నిర్దిష్టంగా తేల్చకుండా, గమనించదగిన రూపం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: ఆ ఐగుప్తీయుడి చేతిలో ఈటె ఉంది
  rationale: హీబ్రూ స్వాధీన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיֵּרֶד אֵלָיו
  choice: అతని దగ్గరికి దిగివెళ్లి
  rationale: ירד లోని ‘దిగివెళ్లు’ అనే దిశాభావాన్ని నిలుపుతూ, అతని వైపు కదిలిన భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: בַּשָּׁבֶט
  choice: ఒక కర్రతో
  rationale: שֵׁבֶט సందర్భానుసారం కర్ర, దండం లేదా గదను సూచించవచ్చు. ‘కర్ర’ అత్యల్ప వ్యాఖ్యానంతో కూడిన విస్తృత తెలుగు పదం.
- source_word: וַיִּגְזֹל
  choice: లాక్కొని
  rationale: גזל లోని బలవంతంగా తీసుకోవడం అనే భావాన్ని యుద్ధ సందర్భంలో స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּהַרְגֵהוּ
  choice: అతన్ని చంపాడు
  rationale: הרג అనే సాధారణ హత్యాక్రియను నేరుగా, ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּחֲנִיתוֹ
  choice: అతని సొంత ఈటెతోనే
  rationale: సమీప సందర్భంలో ప్రత్యయం ఐగుప్తీయుణ్ణే సూచిస్తుంది. ‘సొంత’ మరియు ‘నే’ పలుకులు ఆయుధం తిరిగి అతనిపైనే ఉపయోగించబడిన వ్యతిరేక పరిణామాన్ని స్పష్టం చేస్తాయి.
- source_word: וְהוּא
  choice: అతడు … కూడా
  rationale: వీరకార్యాల జాబితాలోని కొనసాగింపు, అదనపు భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
