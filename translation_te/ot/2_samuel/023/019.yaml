translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. అలంకారప్రశ్నను నిలిపి, ‘ఆ ముగ్గురు’ అనే ప్రసిద్ధ యోధుల వర్గ సూచనను అలాగే ఉంచాం. హీబ్రూలోని తులనార్థకతకు ఉన్న స్వల్ప సందిగ్ధతను [a] పాదటిప్పణిలో సంరక్షించాం.
