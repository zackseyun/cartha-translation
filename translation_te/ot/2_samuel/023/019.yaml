  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: te
  text: అతడు ఆ ముగ్గురికంటే ఎక్కువ గౌరవం పొందినవాడు కాదా?[a] అందుచేత అతడు వారికి అధిపతి అయ్యాడు. అయినా అతడు ఆ ముగ్గురి స్థాయిని అందుకోలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆ ముగ్గురిలో గౌరవం పొందినవాడు కాదా?” హీబ్రూ మాటలను ఈ విధంగానూ అర్థం చేసుకోవచ్చు; అయితే తులనార్థక భావమే వాక్యనిర్మాణానికీ పరిసర సమాంతర వాక్యానికీ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, దావీదు పరాక్రమశాలుల్లో అత్యున్నత వర్గమైన ‘ఆ ముగ్గురి’ హోదా లేదా స్థాయిని అతడు చేరుకోలేదు.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: ఆ ముగ్గురికంటే
  rationale: נִכְבָּדతో కలిసిన מִן‌ను తులనార్థకంగా తీసుకోవడం వాక్యనిర్మాణానికీ పరిసర సమాంతర వాక్యానికీ బాగా సరిపోతుంది.
- source_word: הֲכִי
  choice: కాదా?
  rationale: హֲతో కూడిన నిర్మాణం సమ్మతికర జవాబును ఆశించే అలంకారప్రశ్నను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాదా?’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: נִכְבָּד
  choice: ఎక్కువ గౌరవం పొందినవాడు
  rationale: כבד నిఫాల్ రూపం గౌరవింపబడిన లేదా ఉన్నతంగా ఎంచబడిన భావాన్ని ఇస్తుంది; తులనార్థక నిర్మాణం వల్ల ‘ఎక్కువ’ చేర్చబడింది.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: అందుచేత అతడు వారికి అధిపతి అయ్యాడు
  rationale: שַׂר సైనిక సందర్భంలో నాయకుడు లేదా అధిపతిని సూచిస్తుంది. ‘అధిపతి’ గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: అయినా అతడు ఆ ముగ్గురి స్థాయిని అందుకోలేదు
  rationale: ‘వరకు రాలేదు’ అనే అక్షరార్థం ఇక్కడ భౌతిక గమనాన్ని కాక హోదా లేదా స్థాయిని చేరకపోవడాన్ని సూచిస్తుంది; తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘స్థాయిని అందుకోలేదు’ అని అనువదించబడింది.
