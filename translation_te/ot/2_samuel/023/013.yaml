translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. మూలంలోని క్లిష్ట సంఖ్యాపదబంధాన్ని పూర్తిగా సవ్యంగా మార్చివేయకుండా, ప్రధాన పాఠంలో దగ్గరగా ఉంచి పాదసూచికలో దాని అనిశ్చితిని సంరక్షించాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
