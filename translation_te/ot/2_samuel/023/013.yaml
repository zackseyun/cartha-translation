source:
  edition: WLC
  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: te
  text: అప్పుడు ముప్పైమందిలోనుండి ముప్పైమంది ప్రధానులు[a] కోతకాలంలో[b] అదుల్లాము గుహలో ఉన్న దావీదు దగ్గరికి దిగివచ్చారు. ఆ సమయంలో ఫిలిష్తీయుల దండు[c] రెఫాయీము లోయలో మకాం వేసి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ముప్పైమందిలోనుండి ముప్పైమంది, ప్రధానుడు’ అన్నట్లుగా ఉండి, దాని నిర్మాణం క్లిష్టంగా ఉంది. దీనిని ‘ముప్పైమంది ప్రధానులు’ అని లేదా దావీదు శ్రేష్ఠ యోధులైన ‘ముప్పైమంది’ సభ్యులను సూచిస్తున్నట్లు కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘కోత జరుగుతున్నప్పుడు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ חַיַּת פְּלִשְׁתִּים పదబంధం అక్షరార్థంగా ‘ఫిలిష్తీయుల జీవి/జంతువు’; ఇక్కడ అది నుడికారంగా సైనిక దండు లేదా బృందాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: దిగివచ్చారు
  rationale: యָרַד అనే క్రియలోని ‘దిగడం’ అనే దిశాభావాన్ని నిలుపుతూ, దావీదు ఉన్న చోటికి వారు రావడాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: ఆ ముప్పైమంది ప్రముఖుల్లో ముప్పైమంది
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగానూ వ్యాకరణపరంగా క్లిష్టంగానూ ఉంది. సంఖ్యను, ప్రముఖుల సమూహంతో ఉన్న సంబంధాన్ని ప్రధాన పాఠంలో సాధ్యమైనంత సమీపంగా నిలిపి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: אֶל קָצִיר
  choice: కోతకాలంలో
  rationale: అక్షరార్థంగా ‘కోతకు’ అయినా, సందర్భంలో ఇది కాలసూచక ప్రయోగంగా సహజంగా అర్థమవుతుంది.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: అదుల్లాము గుహలో ఉన్న దావీదు దగ్గరికి
  rationale: వరుసగా వచ్చిన గమ్యసూచక పదబంధాలను సహజమైన తెలుగులో కలిపి, దావీదు గుహలో ఉన్నాడనే స్థలసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దండు
  rationale: חַיָּה సాధారణంగా ‘జీవి/జంతువు’ అని అర్థమిచ్చినా, ఇక్కడ సైనిక సందర్భంలో సైనిక బృందం లేదా దండు అనే నుడికారార్థం సరిపోతుంది.
- source_word: חֹנָה
  choice: మకాం వేసి ఉంది
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న నేపథ్య స్థితిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֵמֶק רְפָאִים
  choice: రెఫాయీము లోయలో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, עֵמֶק అనే భౌగోళిక పదాన్ని ‘లోయ’గా అనువదించింది.
