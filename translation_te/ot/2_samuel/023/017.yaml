source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י יְהוָ֜ה מֵ/עֲשֹׂ֣תִ/י זֹ֗את הֲ/דַ֤ם הָֽ/אֲנָשִׁים֙ הַ/הֹלְכִ֣ים בְּ/נַפְשׁוֹתָ֔/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבֹּרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: te
  text: అతడు, “యాహ్వే, నేను ఇలా చేయడం నాకు ఎంతమాత్రమూ తగదు! తమ ప్రాణాలను పణంగా పెట్టి[a] వెళ్లిన ఆ మనుషుల రక్తమే కదా ఇది?[b]” అన్నాడు. అతడు దాన్ని తాగడానికి ఇష్టపడలేదు. ఇలాంటి కార్యాలను ఆ ముగ్గురు పరాక్రమవంతులు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తమ ప్రాణాలతో”; అంటే వారు ప్రాణాపాయాన్ని ఎదుర్కొని వెళ్లారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “తమ ప్రాణాలతో వెళ్లిన మనుషుల రక్తమా ఇది?” అనే అలంకారిక ప్రశ్న. వారు మరణించే ప్రమాదాన్ని ఎదుర్కొని ఆ నీటిని తెచ్చినందున, దావీదు దాన్ని వారి రక్తంలా పరిగణించాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: యెహోవా, నేను ఇలా చేయడం ఎన్నటికీ తగదు
  rationale: חָלִילָה అనే బలమైన అసమ్మతి, నైతిక విరక్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; יְהוָהను సంబోధనగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: నేను ఇలా చేయడం
  rationale: మִן‌తో కూడిన క్రియారూపం ఇక్కడ ఆ కార్యాన్ని తీవ్రంగా తిరస్కరించడాన్ని సూచిస్తుంది.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: ఆ మనుషుల రక్తమే కదా ఇది?
  rationale: ప్రశ్నార్థక הֲను అలంకారిక ప్రశ్నగా ఉంచి, ఆ నీటిని తాగడం వారి రక్తాన్ని తాగడంతో సమానమని దావీదు భావించిన ఉద్రిక్తతను నిలుపుతుంది.
- source_word: בְּנַפְשׁוֹתָם
  choice: తమ ప్రాణాలను పణంగా పెట్టి
  rationale: అక్షరార్థంగా ‘తమ ప్రాణాలతో’; సందర్భంలో వారు ప్రాణాపాయాన్ని ఎదుర్కొని వెళ్లారని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: అందుకే అతడు దాన్ని తాగడానికి ఇష్టపడలేదు
  rationale: אָבָהలోని ఇష్టపడటం లేదా సమ్మతించడం అనే భావాన్ని నిలుపుతుంది; ప్రత్యయం సందర్భంలోని నీటిని సూచిస్తున్నందున తెలుగులో ఏకవచనం వాడబడింది.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ఆ ముగ్గురు పరాక్రమవంతులు
  rationale: గిబ్బోరీమ్ అనే పదం ఇక్కడ దావీదు శ్రేష్ఠ యోధులను సూచిస్తుంది; ‘పరాక్రమవంతులు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించబడింది.
- issue: నీటిని మనుషుల రక్తంగా పేర్కొనడం
  choice: అలంకారిక ప్రశ్నను నిలుపుతూ ‘రక్తమే కదా ఇది?’
  alternative: ‘నేను వారి రక్తాన్ని తాగాలా?’ అని భావాన్ని విప్పి చెప్పడం
  rationale: దావీదు నీటిని అక్షరార్థంగా రక్తమని చెప్పడం కాదు; వారు ప్రాణాపాయంలో దాన్ని తెచ్చినందున దాన్ని తాగడం వారి రక్తాన్ని తాగినట్లేననే నైతిక భావాన్ని మూలంలోని రూపక ఉద్రిక్తతతోనే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. חָלִילָהను కృత్రిమమైన అక్షరానువాదంగా కాక బలమైన నైతిక నిరాకరణగా వ్యక్తం చేశాం; అయితే రక్తం–నీరు రూపకంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తొలగించలేదు.
