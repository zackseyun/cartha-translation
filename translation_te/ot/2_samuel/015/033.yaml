  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ דָּוִ֑ד אִ֚ם עָבַ֣רְתָּ אִתִּ֔/י וְ/הָיִ֥תָ עָלַ֖/י לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/033.yaml
  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: te
  text: 'దావీదు అతనితో ఇలా అన్నాడు: “నువ్వు నాతో కలిసి ముందుకు వెళ్తే[a], నాకు భారమవుతావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో కలిసి దాటితే.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “దాటడం” లేదా “దాటి వెళ్లడం” అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: దావీదు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ప్రత్యేకంగా ‘అప్పుడు/మరియు’ చేర్చకుండానే సహజమైన కథన క్రమం వ్యక్తమవుతుంది.
- source_word: לוֹ
  choice: అతనితో
  rationale: హీబ్రూలో పురుష ఏకవచన సర్వనామం మాత్రమే ఉంది. సందర్భంలో అతడు హూషై అయినప్పటికీ, ఈ వచనంలో లేని పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: אִם
  choice: వస్తే
  rationale: తెలుగులో క్రియకు ‘-తే’ ప్రత్యయం జోడించడం ద్వారా షరతును సహజంగా, స్పష్టంగా వ్యక్తం చేశాం.
- source_word: עָבַרְתָּ אִתִּי
  choice: నాతో కలిసి ముందుకు వస్తే
  rationale: עבר అనే క్రియకు ‘దాటడం/ముందుకు సాగడం’ అనే భావాలు ఉన్నాయి. ఇక్కడ దావీదుతో ప్రయాణాన్ని కొనసాగించడమే సందర్భోచిత భావం; ‘ముందుకు వస్తే’ దిశను, ‘నాతో కలిసి’ సహవాసాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: וְהָיִתָ עָלַי
  choice: నాకు ... ఉంటావు
  rationale: היה + על నిర్మాణం దావీదుపై కలిగే ప్రభావాన్ని సూచిస్తుంది. తెలుగులో ‘నాకు ... ఉంటావు’ అనే నిర్మాణం తరువాతి నామవాచకంతో సహజంగా సరిపోతుంది.
- source_word: לְמַשָּׂא
  choice: భారంగా
  rationale: מַשָּׂא అంటే మోయవలసిన బరువు లేదా భారం. వ్యక్తి సహాయంకన్నా అదనపు బాధ్యతగా మారతాడనే భావాన్ని ‘భారంగా’ స్పష్టంగా అందిస్తుంది.
