revisions:
- from: దావీదు అతనితో, “నువ్వు నాతో కలిసి ముందుకు వస్తే, నాకు భారంగా ఉంటావు” అన్నాడు.
  to: 'దావీదు అతనితో ఇలా అన్నాడు: “నువ్వు నాతో కలిసి ముందుకు వెళ్తే[a], నాకు భారమవుతావు.”'
  rationale: The revision corrects the directional implication of the motion verb, improves Telugu idiom, and supplies an anchored lexical alternative corresponding to the Hebrew ambiguity and the English POB audit note. It does not name the pronoun's referent or add interpretive detail.
