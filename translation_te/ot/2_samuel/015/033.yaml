translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో సందర్భానికి తగిన ఏకవచన ‘నువ్వు’ వాడబడింది. మూలంలోని ప్రయాణ భావాన్ని అతిగా భౌగోళికంగా నిర్దిష్టం చేయకుండా ‘ముందుకు వస్తే’గా అనువదించాం.
