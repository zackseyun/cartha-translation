review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves David as the speaker, the unnamed masculine singular referent ('to him'), the conditional force, accompaniment with David, and the result that the man would be a burden. However, 'ముందుకు వస్తే' ('come forward') shifts the motion toward David; in context the man would accompany David onward. 'ముందుకు వెళ్తే' preserves the movement more accurately. A lexical note should retain the Hebrew verb's possible more literal sense, 'cross over/pass over,' as reflected in the English audit trail.
  naturalness: '''దావీదు అతనితో ... అన్నాడు'' is understandable, but ''దావీదు అతనితో ఇలా అన్నాడు:'' is more idiomatic Telugu introduction to direct speech. ''నాకు భారమవుతావు'' is more natural and concise than ''నాకు భారంగా ఉంటావు.'''
  terminology: '''భారం/భారమవుతావు'' accurately conveys מַשָּׂא in this interpersonal context without importing theological or interpretive content. The informal singular ''నువ్వు'' fits the direct address and remains natural modern standard Telugu.'
  issues:
  - severity: medium
    issue: Directional nuance in 'ముందుకు వస్తే'
    rationale: The Hebrew conditional uses עבר with 'with me,' describing accompanying David in his movement. Telugu 'వస్తే' can imply movement toward David, whereas 'వెళ్తే' better represents going onward with him.
  - severity: low
    issue: No lexical-alternative footnote for עבר
    rationale: The English POB audit trail retains an alternative, more literal 'cross over/pass over.' Adding an anchored Telugu note preserves this legitimate lexical nuance without over-specifying the main text.
  - severity: low
    issue: Direct-speech introduction and burden idiom can be smoother
    rationale: Adding 'ఇలా' and using 'భారమవుతావు' produces idiomatic modern Telugu while retaining the source meaning.
  revised_text: 'దావీదు అతనితో ఇలా అన్నాడు: “నువ్వు నాతో కలిసి ముందుకు వెళ్తే[a], నాకు భారమవుతావు.”'
  revised_footnotes:
