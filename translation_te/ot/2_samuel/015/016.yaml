  edition: WLC
  text: וַ/יֵּצֵ֥א הַ/מֶּ֛לֶךְ וְ/כָל בֵּית֖/וֹ בְּ/רַגְלָ֑י/ו וַ/יַּעֲזֹ֣ב הַ/מֶּ֗לֶךְ אֵ֣ת עֶ֧שֶׂר נָשִׁ֛ים פִּֽלַגְשִׁ֖ים לִ/שְׁמֹ֥ר הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: te
  text: అప్పుడు రాజు బయలుదేరాడు; అతని ఇంటివారందరూ అతని వెనుక కాలినడకన వెళ్లారు.[a] రాజు ఇంటిని కాపాడటానికి ఉపపత్నులైన పది మంది స్త్రీలను ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ఇంటివారందరూ అతని పాదాల వద్ద.” ఈ హీబ్రూ ప్రయోగం వారు అతని వెనుక కాలినడకన వెళ్లారని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అనే క్రియ ఇక్కడ రాజు అక్కడి నుంచి వెళ్లడాన్ని సూచిస్తుంది. ‘బయలుదేరాడు’ కథన ప్రవాహంలో సహజంగా ఉండి, కదలికను స్పష్టంగా నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో వ్యక్తిపేరు కాకుండా బిరుదే ఉంది; అందువల్ల దావీదు అని విపులీకరించకుండా ‘రాజు’ అని అనువదించాం.
- source_word: וְכָל בֵּיתוֹ
  choice: అతని ఇంటివారందరూ
  rationale: ఈ సందర్భంలో בַּיִת భవనాన్ని కాకుండా రాజు గృహానికి చెందిన ప్రజలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇంటివారు’ సహజంగా ఈ సమూహార్థాన్ని తెలియజేస్తుంది.
- source_word: בְּרַגְלָיו
  choice: అతని వెనుక కాలినడకన
  rationale: అక్షరార్థంగా ‘అతని పాదాల దగ్గర/వద్ద’ అయిన ఈ హీబ్రూ ప్రయోగం, వారు రాజును అనుసరిస్తూ కాలినడకన వెళ్లారని సూచిస్తుంది. అనుసరణ, నడక అనే రెండు భావాలనూ తెలుగులో తెలిపాం.
- source_word: וַיַּעֲזֹב
  choice: అక్కడే ఉంచాడు
  rationale: עזב ఇక్కడ ఉద్దేశపూర్వకంగా వెనుక ఉంచడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టాడు’ అనవసరంగా పరిత్యాగ భావాన్ని బలపరచవచ్చు.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: ఉపపత్నులైన పది మంది స్త్రీలను
  rationale: మూలంలోని ‘స్త్రీలు’ మరియు ‘ఉపపత్నులు’ అనే రెండు అంశాలనూ నిలుపుతూ, వాటి సమానాధికార సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: לִשְׁמֹר
  choice: కాపాడడానికి
  rationale: שׁמר కు కాపాడడం, చూసుకోవడం అనే భావాలు ఉన్నాయి. ఇక్కడ రాజనివాసాన్ని సంరక్షించడానికి వారిని ఉంచినట్టు ‘కాపాడడానికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבָּיִת
  choice: రాజభవనాన్ని
  rationale: మొదటి בֵּיתוֹ ప్రజలతో కూడిన గృహసమూహాన్ని సూచించగా, ఇక్కడ הַבָּיִת వారు కాపాడవలసిన రాజనివాసాన్ని సూచిస్తుంది. సందర్భానుసారంగా ‘రాజభవనం’ సాధారణ పాఠకునికి ఈ భేదాన్ని స్పష్టం చేస్తుంది.
