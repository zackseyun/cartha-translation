    issue: “రాజభవనాన్ని” is more specific than the Hebrew ‘the house.’
    rationale: The context supports a royal residence, but the Hebrew does not explicitly say ‘palace.’ “ఇంటిని” preserves the source wording and adequately conveys the physical residence in context.
