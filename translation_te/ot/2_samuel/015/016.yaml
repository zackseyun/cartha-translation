translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇంటివారు’ మరియు ‘రాజభవనం’ ద్వారా ఒకే హీబ్రూ పదమైన בַּיִת కు ఈ వాక్యంలో ఉన్న సమూహార్థం, భవనార్థం మధ్య సందర్భోచిత భేదాన్ని స్పష్టం చేశాం. మూలంలోని ‘స్త్రీలు, ఉపపత్నులు’ అనే నిర్మాణాన్ని ‘ఉపపత్నులైన పది మంది స్త్రీలు’గా నిలిపాం.
