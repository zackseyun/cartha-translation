  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מַּגִּ֔יד אֶל דָּוִ֖ד לֵ/אמֹ֑ר הָיָ֛ה לֶב אִ֥ישׁ יִשְׂרָאֵ֖ל אַחֲרֵ֥י אַבְשָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: te
  text: అప్పుడు ఒక వార్తాహరుడు దావీదు వద్దకు వచ్చి, “ఇశ్రాయేలు పురుషుల హృదయాలు అబ్షాలోము పక్షాన ఉన్నాయి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఇశ్రాయేలు పురుషుల హృదయం అబ్షాలోము వెనుక ఉంది.” ఇది వారు అబ్షాలోముకు విధేయులుగా, అతని పక్షాన ఉన్నారని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הַמַּגִּיד
  choice: ఒక వార్తాహరుడు ... వచ్చి
  rationale: వార్తను తెలియజేసే వ్యక్తిని సూచించే హిఫీల్ కృదంతానికి ‘వార్తాహరుడు’ సహజమైన తెలుగు సమానం. కథనంలో ఈ వ్యక్తి ఇక్కడ పరిచయమవుతున్నందున ‘ఒక’ అని వాడబడింది.
- source_word: אֶל דָּוִד
  choice: దావీదు దగ్గరికి
  rationale: గమ్యాన్ని సూచించే אֶל భావాన్ని ఆధునిక సహజ తెలుగులో ‘దగ్గరికి’ తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణంగా వ్యక్తపరుస్తుంది.
- source_word: הָיָה לֶב
  choice: మనసు ... మళ్లింది
  rationale: లేబ్ ఇక్కడ శారీరక హృదయాన్ని కాక అంతరంగ వైఖరి, సంకల్పం లేదా విధేయతను సూచిస్తుంది. ‘మళ్లింది’ అనే క్రియ రాజకీయ అనుబంధంలో వచ్చిన మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషుల
  rationale: ఏకవచన రూపంలోని אִישׁ ఇక్కడ సమూహార్థకంగా ఉంది. సందర్భంలోని పురుష మరియు రాజకీయ భావాన్ని నిలుపుతూ ‘పురుషుల’ అని అనువదించబడింది.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: అబ్షాలోము వైపు
  rationale: అక్షరార్థంగా ‘అబ్షాలోము వెనుక’ అయినా, ఈ ప్రయోగం అతని పక్షాన్ని అనుసరించడం లేదా అతనికి విధేయత చూపడం అనే రాజకీయ భావాన్ని కలిగిస్తుంది. ‘వైపు’ ఆ భావాన్ని సహజంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కథన శైలి వాడబడింది. ‘మనసు’ అంతరంగ వైఖరిని సహజంగా తెలియజేస్తుండగా, అడుగుసూచన మూలంలోని ఏకవచన ‘హృదయం’ మరియు ‘వెనుక’ అనే రూపకాన్ని సంరక్షిస్తుంది.
