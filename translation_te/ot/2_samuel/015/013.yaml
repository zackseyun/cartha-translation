    issue: The main text renders the idiom as “అబ్షాలోము వైపు మళ్లింది.”
    rationale: This is interpretively plausible, but it foregrounds a completed shift that is not explicitly stated by the Hebrew. “అబ్షాలోము పక్షాన ఉన్నాయి” more closely represents the reported allegiance/state.
  - severity: low
    issue: “దావీదు దగ్గరికి” is somewhat colloquial for this narrative register.
    rationale: “దావీదు వద్దకు” is a smoother modern-standard Telugu equivalent for the destination marked by אֶל.
