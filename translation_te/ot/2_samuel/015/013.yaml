  to: అప్పుడు ఒక వార్తాహరుడు దావీదు వద్దకు వచ్చి, “ఇశ్రాయేలు పురుషుల హృదయాలు అబ్షాలోము పక్షాన ఉన్నాయి[a]” అని చెప్పాడు.
