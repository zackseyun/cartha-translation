id: 2SA.15.4
reference: 2 Samuel 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: te
  text: 'అప్పుడు అబ్షాలోము ఇలా అనేవాడు[a]: “దేశంలో నన్ను న్యాయాధిపతిగా నియమిస్తే ఎంత బాగుండు! అప్పుడు వివాదమో న్యాయవ్యాజ్యమో ఉన్న ప్రతి ఒక్కరూ[b] నా దగ్గరకు రావచ్చు; నేను వారికి న్యాయం చేస్తాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “దేశంలో నన్ను న్యాయాధిపతిగా ఎవరు నియమిస్తారు?” హీబ్రూ మాట నిజంగా సమాచారం అడిగే ప్రశ్నకన్నా ఒక ఆకాంక్షను వ్యక్తం చేస్తోంది.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః “ప్రతి పురుషుడు”; ఇక్కడ అది న్యాయవిషయం ఉన్న ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “నేను వారిని సరైనవారిగా తీర్పు ఇస్తాను” లేదా “వారి పక్షాన తీర్పు ఇస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అబ్షాలోము ఇలా అనేవాడు
  rationale: సందర్భంలో ఇది అబ్షాలోము పదేపదే పలికిన మాటను సూచిస్తుంది; అందువల్ల సాధారణ భూతకాలమైన ‘అన్నాడు’ కంటే ‘అనేవాడు’ పునరావృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִי יְשִׂמֵנִי
  choice: నన్ను ... నియమిస్తే ఎంత బాగుండు
  rationale: పదశః ‘నన్ను ఎవరు నియమిస్తారు?’ అయినా, ఇక్కడ ప్రశ్న సమాచారం అడగడం కాదు; పదవి కోసం వ్యక్తం చేసిన ఆకాంక్ష. తెలుగు వాక్యం ఆ వాక్చాతుర్యపు కోరికను సహజంగా అందిస్తుంది.
- source_word: שֹׁפֵט
  choice: న్యాయాధిపతి
  rationale: వివాదాలు, న్యాయవ్యాజ్యాలు తీర్చే అధికారిని సూచిస్తున్నందున ‘న్యాయాధిపతి’ ఈ న్యాయసందర్భానికి తగినది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఇక్కడ אֶרֶץ మొత్తం రాజకీయ భూభాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశంలో’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְעָלַי יָבוֹא
  choice: నా దగ్గరకు రావచ్చు
  rationale: అబ్షాలోము ఊహిస్తున్న నియామకానికి ఫలితంగా ప్రజలకు తనను ఆశ్రయించే అవకాశం ఉంటుందనే భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా ఇక్కడ న్యాయవిషయం ఉన్న ఎవరినైనా సాధారణంగా సూచిస్తుంది. ‘ప్రతి ఒక్కరూ’ ఆ సమగ్ర భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: רִיב וּמִשְׁפָּט
  choice: వివాదమో న్యాయవ్యాజ్యమో
  rationale: רִיב వివాదాన్ని, מִשְׁפָּט తీర్పు కోరే న్యాయవిషయాన్ని సూచిస్తాయి. ఈ జతలోని న్యాయపరమైన విస్తృతిని రెండు పదాలు కాపాడుతాయి.
- source_word: וְהִצְדַּקְתִּיו
  choice: నేను వారికి న్యాయం చేస్తాను
  rationale: צדק హిఫీల్ రూపానికి ‘న్యాయవంతుడని తీర్పు చెప్పడం’, ‘నిర్దోషిగా నిలబెట్టడం’, ‘న్యాయం చేయడం’ అనే న్యాయపరమైన పరిధి ఉంది. ప్రధాన పాఠంలో ‘న్యాయం చేస్తాను’ సహజంగా ఉండి, ప్రత్యామ్నాయాన్ని పాదటిప్పణి నిలుపుతుంది.
theological_decisions:
- issue: וְהִצְדַּקְתִּיו అనేది నిష్పాక్షిక న్యాయమా లేక అనుకూల తీర్పా అనే భావసూక్ష్మత
  choice: ప్రధాన పాఠంలో ‘న్యాయం చేస్తాను’
  alternative: ‘వారిని న్యాయవంతులుగా తీర్పుతీరుస్తాను’ లేదా ‘వారి పక్షాన తీర్పు ఇస్తాను’
  rationale: అబ్షాలోము ప్రజలను ఆకర్షించడానికి అనుకూల తీర్పును వాగ్దానం చేస్తున్న సూచన ఉండవచ్చు; అయితే క్రియ స్వయంగా న్యాయస్థానంలో న్యాయం చేయడం లేదా నిర్దోషిగా నిలబెట్టడం అనే రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠం అస్పష్టతను అతిగా పరిష్కరించకుండా, పాదటిప్పణి ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. న్యాయసందర్భాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ వాక్చాతుర్యపు కోరికను మరియు చివరి క్రియలోని భావపరిధిని పాదటిప్పణుల్లో కాపాడింది.
