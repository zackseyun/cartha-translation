translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. సమూహనామాలను లిప్యంతరీకరించి, మూలంలోని ఊరేగింపు కదలికను ‘సాగిపోతున్నారు/సాగిపోయారు’ ద్వారా వ్యక్తం చేశాం. హీబ్రూ నుడికారంలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో నిలిపాం.
