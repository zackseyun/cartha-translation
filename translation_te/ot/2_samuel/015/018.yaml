source:
  edition: WLC
  text: וְ/כָל עֲבָדָי/ו֙ עֹבְרִ֣ים עַל יָד֔/וֹ וְ/כָל הַ/כְּרֵתִ֖י וְ/כָל הַ/פְּלֵתִ֑י וְ/כָֽל הַ/גִּתִּ֞ים שֵׁשׁ מֵא֣וֹת אִ֗ישׁ אֲשֶׁר בָּ֤אוּ בְ/רַגְל/וֹ֙ מִ/גַּ֔ת עֹבְרִ֖ים עַל פְּנֵ֥י הַ/מֶּֽלֶךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: te
  text: అతని సేవకులందరూ అతని పక్కగా సాగిపోతుండగా, కెరేతీయులందరూ, పెలేతీయులందరూ, గాతు నుండి అతనితో కాలినడకన వచ్చిన ఆరువందల మంది గిత్తీయులందరూ రాజు ముందుగా సాగిపోతున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాతు నుండి అతనిని అనుసరించి వచ్చినవారు.” హీబ్రూలో అక్షరార్థంగా, “గాతు నుండి అతని పాదంతో వచ్చినవారు” అని ఉంది; ఇది ఒకరితో కలిసి కాలినడకన రావడం లేదా అతని పరివారంగా అనుసరించడం అనే నుడికారం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: עֶבֶד అనే పదం సేవకులు, పరివారస్థులు లేదా రాజోద్యోగులను సూచించగలదు. ఇక్కడ ప్రత్యేక సైనిక బృందాలకంటే వేరుగా దావీదు వెంట ఉన్న విస్తృత వర్గం ఉద్దేశించబడినందున, ప్రాథమిక అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ అని అనువదించాం.
- source_word: עֹבְרִים עַל־יָדוֹ
  choice: అతని పక్కగా సాగిపోతున్నారు
  rationale: עַל־יָד అనే ప్రయోగానికి ‘పక్కన/సమీపంలో’ అనే స్థలార్థం ఉంది. ఊరేగింపు సందర్భంలో ‘పక్కగా సాగిపోతున్నారు’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: הַכְּרֵתִי
  choice: కెరేతీయులు
  rationale: దావీదు సేవలోని ఒక ప్రత్యేక వర్గానికి సంబంధించిన పేరుగా భావించి, అర్థానువాదం చేయకుండా తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: הַפְּלֵתִי
  choice: పెలేతీయులు
  rationale: ఇది కూడా ఒక ప్రత్యేక వర్గనామం కాబట్టి తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: הַגִּתִּים
  choice: గిత్తీయులు
  rationale: ఈ పదం గాతుకు చెందిన ప్రజలను సూచిస్తుంది. వచనంలోని సమూహనామాల రూపాన్ని నిలుపుతూ ‘గిత్తీయులు’ అని లిప్యంతరీకరించాం.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: ఆరువందల మంది
  rationale: אִישׁ ఇక్కడ పురుషుల సంఖ్యను లెక్కించే పదం. సందర్భం యోధులను సూచించినప్పటికీ మూలపాఠంలో స్పష్టంగా లేని ‘సైనికులు’ అనే భావాన్ని చేర్చలేదు.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: గాతు నుండి అతనితో కాలినడకన వచ్చిన
  rationale: בְרַגְלוֹ అక్షరార్థంగా ‘అతని పాదంతో’ అని ఉండి, ఒకరితో కలిసి కాలినడకన రావడం లేదా అతని పరివారంగా అనుసరించడం అనే ప్రయోగార్థం కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సజీవమైన ప్రత్యక్ష చిత్రాన్ని నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: עֹבְרִים עַל־פְּנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుటగా సాగిపోయారు
  rationale: עַל־פְּנֵי సాధారణంగా ‘ఎదుట/ముందుగా’ అని అర్థమిస్తుంది. ఊరేగింపు కదలికను సహజ తెలుగులో వ్యక్తం చేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
