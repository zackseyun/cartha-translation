review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys David's arrival, the summit, Hushai's identity, and the narrative marker. However, “తన అంగీని చింపుకొని” changes the Hebrew description of Hushai's torn tunic into an explicit action performed by him. The revision expresses the resulting state without adding that action. The worship clause is also recast so that David, rather than the summit, is unmistakably its subject, while retaining the Hebrew imperfect's contextual openness.
  naturalness: The revised wording is natural modern standard Telugu narrative prose. “అంగీ చినిగినదిగా, తలపై మట్టితో” is a compact idiomatic description of mourning appearance and avoids the awkward implication that the garments themselves are acting or that Hushai necessarily tore them at that moment.
  terminology: “దేవునికి ఆరాధన,” “ఇదిగో,” “అర్కీయుడైన హూషై,” and “అంగీ” are appropriate. “మట్టి” faithfully represents the broad sense of אֲדָמָה (soil/earth) in this mourning context.
  issues:
  - severity: medium
    issue: The worship relative clause can be syntactically misread as modifying the summit as its subject.
    rationale: In “దేవునికి ఆరాధన చేసే కొండ శిఖరం,” the immediately adjacent noun phrase is “కొండ శిఖరం.” Reordering makes David the explicit subject of the worship clause and preserves the intended relationship.
  - severity: medium
    issue: “తన అంగీని చింపుకొని” adds an active action not explicitly stated in the Hebrew.
    rationale: קָרוּעַ כֻּתָּנְתּוֹ describes Hushai with his tunic in a torn state. “అంగీ చినిగినదిగా” retains that stative description without asserting that he tore it.
  revised_text: దావీదు దేవునికి ఆరాధన చేసే ఆ కొండ శిఖరానికి[a] చేరుకున్నప్పుడు, ఇదిగో[b], అర్కీయుడైన హూషై అంగీ చినిగినదిగా, తలపై మట్టితో అతనిని కలుసుకోవడానికి వచ్చాడు.
