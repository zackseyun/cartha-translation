source:
  edition: WLC
  text: וַ/יְהִ֤י דָוִד֙ בָּ֣א עַד הָ/רֹ֔אשׁ אֲשֶֽׁר יִשְׁתַּחֲוֶ֥ה שָׁ֖ם לֵ/אלֹהִ֑ים וְ/הִנֵּ֤ה לִ/קְרָאת/וֹ֙ חוּשַׁ֣י הָ/אַרְכִּ֔י קָר֨וּעַ֙ כֻּתָּנְתּ֔/וֹ וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: te
  text: దావీదు దేవునికి ఆరాధన చేసే ఆ కొండ శిఖరానికి[a] చేరుకున్నప్పుడు, ఇదిగో[b], అర్కీయుడైన హూషై అంగీ చినిగినదిగా, తలపై మట్టితో అతనిని కలుసుకోవడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ అతడు దేవునికి ఆరాధన చేశాడు.” హీబ్రూ క్రియ అలవాటుగా జరిగే చర్యను (“ఆరాధించేవాడు”) గానీ, ఒకసారి జరిగిన గత చర్యను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇదిగో” అనే మాట హూషై అకస్మాత్తుగా కనిపించడాన్ని ప్రధానంగా చూపే హీబ్రూ కథన సూచకాన్ని అనువదిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: కొండ శిఖరం
  rationale: పదశః ‘తల’; ఈ పర్వతారోహణ సందర్భంలో పైభాగం లేదా శిఖరాన్ని సూచిస్తుంది. తెలుగులో స్థలార్థం స్పష్టమయ్యేందుకు ‘కొండ శిఖరం’ అని అనువదించాం.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: దేవునికి ఆరాధన చేసే
  rationale: יִשְׁתַּחֲוֶה మూలంగా వంగి నమస్కరించడాన్ని, దేవుని పట్ల వాడినప్పుడు ఆరాధనను సూచిస్తుంది. అసంపూర్ణ క్రియారూపం అలవాటైన చర్యను గానీ, కథనంలోని చర్యను గానీ సూచించగల అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హూషై అకస్మాత్తుగా కనిపించడాన్ని ప్రధానంగా చూపే హీబ్రూ కథన సూచకంలోని సజీవతను నిలుపుతుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనిని కలుసుకోవడానికి వచ్చాడు
  rationale: ఎదురుగా వెళ్లి కలుసుకోవాలనే గమనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భం నుంచి ‘వచ్చాడు’ను స్పష్టపరచాం.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: అర్కీయుడైన హూషై
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, వంశ/ప్రాంత సంబంధ విశేషణాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: తన అంగీని చింపుకొని
  rationale: כֻּתֹּנֶת శరీరంపై ధరించే అంగీ వంటి వస్త్రం. చినిగిన స్థితి శోకచర్య ఫలితమని తెలుగులో సహజంగా తెలిపేందుకు ‘చింపుకొని’ వాడాం.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: తలపై మట్టి వేసుకొని
  rationale: אֲדָמָה అంటే నేల/మట్టి. ఇక్కడ శోక సూచక చర్యను సహజంగా తెలియజేసే తెలుగు ప్రయోగం ఇది; ‘ధూళి’ కంటే మూలపద పరిధికి దగ్గరగా ఉంది.
theological_decisions:
- issue: ఆరాధన క్రియ యొక్క కాల/అలవాటు భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆరాధన చేసే’ అని ఉంచి కాలార్థాన్ని తెరిచి ఉంచడం
  alternative: ‘ఆరాధించేవాడు’ లేదా ‘ఆరాధించాడు’
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం అలవాటైన గత చర్యగానూ, సాధారణ లేదా కథన చర్యగానూ అర్థమవవచ్చు. ఏ ఒక్క భావాన్నీ సిద్ధాంతపరంగా స్థిరపరచకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ మూలంలోని నాటకీయ ఉద్ఘాటనను నిలుపుతుంది; ‘అంగీ’, ‘మట్టి’ సాధారణ పాఠకులకు స్పష్టమైన పదాలు.
