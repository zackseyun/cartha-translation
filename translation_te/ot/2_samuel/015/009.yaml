  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే బైబిల్ కథనానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. హీబ్రూ వరుస కథనక్రియలను తెలుగులో సహజమైన వాక్యప్రవాహంగా మలిచింది.
