  text: రాజు అతనితో, “క్షేమంగా వెళ్లు” అని అన్నాడు. అప్పుడు అతడు లేచి హెబ్రోనుకు వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר యొక్క సాధారణ కథనరూపం; ప్రత్యక్ష సంభాషణను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో తెలిసిన రాజైన దావీదును సూచించే నిర్దిష్ట నామవాచకం; పేరును అదనంగా చేర్చకుండా హీబ్రూ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: הלך యొక్క ఆజ్ఞార్థక రూపం; తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞ.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: వీడ్కోలు లేదా ఆశీర్వాద భావమున్న హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום యొక్క కథనరూపం; తరువాతి క్రియతో కలిపి వరుస చర్యలను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: చలనాన్ని సూచించే సాధారణ కథనక్రియ; సరళమైన అర్థాన్ని నిలుపుతుంది.
- source_word: חֶבְרוֹנָה
  choice: హెబ్రోనుకు
  rationale: స్థలనామానికి జతైన దిశార్థక ה ను తెలుగులో గమ్యార్థక ‘-కు’తో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
