translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడింది. న్యాయసందర్భాన్ని స్పష్టం చేయడానికి ‘వ్యాజ్యం,’ ‘విన్నపం’ వాడినా, ‘రాజు నియమించిన అధికారి’ అని మూలంలో లేని వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు. హీబ్రూ పదాల విస్తృత అర్థసాధ్యతను పాదసూచికల్లో నిలిపింది.
