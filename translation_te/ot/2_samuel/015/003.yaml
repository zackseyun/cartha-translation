  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אַבְשָׁל֔וֹם רְאֵ֥ה דְבָרֶ֖/ךָ טוֹבִ֣ים וּ/נְכֹחִ֑ים וְ/שֹׁמֵ֥עַ אֵין לְ/ךָ֖ מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/003.yaml
  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: te
  text: అప్పుడు అబ్షాలోము అతనితో, “చూడు, నీ వ్యాజ్యం మంచిదీ న్యాయమైనదీ[a]. కానీ రాజు తరఫున నీ వ్యాజ్యాన్ని వినేవాడు ఎవరూ లేరు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ మాటలు’ లేదా ‘నీ విషయం’ అని కూడా అనువదించవచ్చు. హీబ్రూ דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ లేదా న్యాయసందర్భంలో ‘వ్యాజ్యం/వాదన’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజు తరఫున నీకు వినేవాడు లేడు.” అంటే, ఆ వ్యాజ్యాన్ని వినడానికి రాజు తరఫున అధికారం పొందినవాడు ఎవరూ లేరని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: అప్పుడు అబ్షాలోము అతనితో ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని చూపుతుంది. אֵלָיו లోని పుంలింగ ఏకవచన సర్వనామాన్ని ‘అతనితో’గా నిలిపింది.
- source_word: רְאֵה
  choice: చూడు
  rationale: ఇక్కడ ראה ఆజ్ఞారూపం ప్రత్యక్షంగా చూడమని కాక, ఎదుటివారి దృష్టిని ఆకర్షించే సంభాషణా ప్రయోగం. ‘చూడు’ ఆధునిక తెలుగులో సహజంగా అదే పనిని చేస్తుంది.
- source_word: דְבָרֶךָ
  choice: నీ వ్యాజ్యం
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘వ్యవహారం’ అనే విస్తృత అర్థాలున్నాయి. తీర్పు కోసం వచ్చినవారి న్యాయసంబంధ సందర్భంలో ‘వ్యాజ్యం’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; పదంలోని విస్తృత అర్థసాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: טוֹבִים וּנְכֹחִים
  choice: మంచిదీ న్యాయమైనదీ
  rationale: טוֹבִים యొక్క సాధారణ మూల్యాంకన భావాన్ని ‘మంచిది’ నిలుపుతుంది. נְכֹחִים లోని సరైనది, నిటారైనది, న్యాయబద్ధమైనది అనే భావాన్ని న్యాయసందర్భంలో ‘న్యాయమైనది’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: కానీ రాజు తరఫున నీ విన్నపాన్ని వినేవాడు ఎవరూ లేరు
  rationale: שֹׁמֵעַ అనే కర్తృవాచక రూపాన్ని ‘వినేవాడు’గా నిలిపింది; సందర్భం ప్రకారం ఇది న్యాయవిన్నపాన్ని వినడాన్ని సూచిస్తుంది. מֵאֵת הַמֶּלֶךְ రాజు స్వయంగా వినడంకన్నా అతని తరఫున లేదా అధికారంతో వినే వ్యక్తిని సూచించగలదు; అందుకే ‘రాజు తరఫున’ అని అనువదించింది.
