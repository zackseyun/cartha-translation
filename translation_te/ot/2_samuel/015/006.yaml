  text: וַ/יַּ֨עַשׂ אַבְשָׁל֜וֹם כַּ/דָּבָ֤ר הַ/זֶּה֙ לְ/כָל יִשְׂרָאֵ֔ל אֲשֶׁר יָבֹ֥אוּ לַ/מִּשְׁפָּ֖ט אֶל הַ/מֶּ֑לֶךְ וַ/יְגַנֵּב֙ אַבְשָׁל֔וֹם אֶת לֵ֖ב אַנְשֵׁ֥י יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: te
  text: తీర్పు కోసం రాజు వద్దకు వచ్చే ఇశ్రాయేలీయులందరికీ అబ్షాలోము ఇలాగే చేసేవాడు. అలా అబ్షాలోము ఇశ్రాయేలు పురుషుల హృదయాలను దొంగిలించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు పురుషుల మనసులను తనవైపు తిప్పుకున్నాడు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘హృదయాన్ని దొంగిలించాడు’ అని ఉంది; ఇది రహస్యంగా లేదా మోసపూరితంగా వారి విధేయతను సంపాదించడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּדָּבָר הַזֶּה
  choice: ఇలాగే చేసేవాడు
  rationale: ఈ మాట ముందటి వచనంలో వివరించిన అబ్షాలోము పదేపదే అనుసరించిన ప్రవర్తనను సూచిస్తుంది. గతంలో అలవాటుగా జరిగిన కార్యాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘చేసేవాడు’ వాడబడింది.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో
  rationale: అబ్షాలోము ప్రవర్తన ప్రజల పట్ల నేరుగా ఉద్దేశించబడిందని సందర్భం చూపుతుంది; అందువల్ల తెలుగులో సహజమైన ‘అందరితో’ ఎంచుకోబడింది.
- source_word: אֲשֶׁר יָבֹאוּ לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: తీర్పు కోసం రాజు దగ్గరకు వచ్చే
  rationale: מִשְׁפָּט ఇక్కడ న్యాయవిచారణ లేదా న్యాయనిర్ణయాన్ని సూచిస్తుంది. ‘తీర్పు కోసం’ న్యాయసంబంధ భావాన్ని సంక్షిప్తంగా ఉంచుతుంది; ‘వచ్చే’ పునరావృతంగా జరిగే పరిస్థితిని తెలియజేస్తుంది.
- source_word: וַיְגַנֵּב ... אֶת לֵב
  choice: హృదయాలను దొంగిలించాడు
  rationale: గనב్ అనే క్రియ యొక్క ప్రత్యక్షార్థమైన ‘దొంగిలించాడు’ను నిలుపుతూ, రహస్యంగా లేదా కపటంగా ప్రజల విధేయతను తనవైపు తిప్పుకున్నాడనే హీబ్రూ రూపకాన్ని సంరక్షిస్తుంది. హీబ్రూలో ‘హృదయం’ ఏకవచన సమూహార్థంలో ఉన్నా, తెలుగులో అనేక వ్యక్తులను ఉద్దేశించి ‘హృదయాలను’ సహజంగా ఉంది.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: אַנְשֵׁי అనే పురుషలింగ పదాన్ని తటస్థ సమూహపదంగా మార్చకుండా మూలంలోని లింగ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: אַנְשֵׁי יִשְׂרָאֵל లోని లింగ సూచన
  choice: ఇశ్రాయేలు పురుషులు
  alternative: ఇశ్రాయేలు ప్రజలు / ఇశ్రాయేలీయులు
  rationale: ఈ పదబంధం విస్తృత ప్రజాసమూహాన్ని ప్రతినిధిగా సూచించే అవకాశం ఉన్నప్పటికీ, హీబ్రూ పాఠం స్పష్టంగా ‘పురుషులు’ అనే రూపాన్ని వాడుతుంది. కాబట్టి ఆ లింగ సూచనను ప్రధాన పాఠంలో నిలిపి, దాని పరిధిని అనవసరంగా విస్తరించలేదు.
- issue: ‘హృదయాలను దొంగిలించాడు’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: హృదయాలను గెలుచుకున్నాడు / తమవైపు తిప్పుకున్నాడు
  rationale: ఈ హీబ్రూ ప్రయోగం విధేయతను సంపాదించడమే కాక, అది రహస్యమైన లేదా కపటమైన పద్ధతిలో జరిగిందనే ప్రతికూల భావాన్ని కూడా కలిగిస్తుంది. అందువల్ల సులభీకరించి కేవలం ‘గెలుచుకున్నాడు’ అని చెప్పలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘రాజు దగ్గరకు’ సాధారణ పాఠకులకు స్పష్టమైన రూపం; ‘తీర్పు,’ ‘హృదయాలు’ వంటి పదాలు మూలంలోని న్యాయసంబంధ భావాన్నీ సాహిత్య రూపకాన్నీ నిలుపుతాయి.
