    rationale: ఆంగ్ల audit trail యెహోవా నామాన్ని “Yahweh”గా స్థిరపరుస్తుంది; ముసాయిదాలో “యెహోవా” ఉంది. తెలుగు లిప్యంతరీకరణలో “యాహ్వే” వాడటం ఆ నిర్ణయానికి అనుగుణంగా ఉంటుంది.
