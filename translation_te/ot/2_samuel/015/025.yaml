id: 2SA.15.25
reference: 2 Samuel 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: te
  text: అప్పుడు రాజు సాదోకుతో, “దేవుని మందసాన్ని తిరిగి నగరానికి తీసుకెళ్లు. యాహ్వే దృష్టిలో నాకు అనుగ్రహం లభిస్తే, ఆయన నన్ను తిరిగి తీసుకువచ్చి, దానినీ దాని నివాసస్థలాన్నీ నాకు చూపిస్తాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయననూ ఆయన నివాసస్థలాన్నీ నాకు చూపిస్తాడు.” హీబ్రూ పదాలను దేవునినే సూచించే విధంగా కూడా అర్థం చేసుకోవచ్చు; అయితే వెంటనే ముందు ప్రస్తావించబడింది దేవుని మందసం.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: తిరిగి ... తీసుకెళ్లు
  rationale: సాదోకును ఉద్దేశించిన שוב క్రియ యొక్క ఆజ్ఞారూపం. మందసాన్ని నగరానికి వెనక్కి తీసుకెళ్లాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: మూలంలో אֱלֹהִים (‘దేవుడు’) ఉంది; అందువల్ల పరిచితమైన ఇతర పదబంధంతో సమన్వయపరచకుండా మూలపాఠాన్ని అనుసరిస్తుంది.
- source_word: הָעִיר
  choice: నగరానికి
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భం దిశార్థాన్ని ఇస్తోంది; తెలుగులో ‘నగరానికి’ సహజంగా ఆ గమ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో నాకు అనుగ్రహం దొరికితే
  rationale: ‘కళ్లలో కృప పొందడం’ అనే హీబ్రూ నుడికారంలోని సంబంధాత్మక భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘దృష్టిలో ... అనుగ్రహం దొరికితే’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: וֶהֱשִׁבַנִי
  choice: ఆయన నన్ను తిరిగి తీసుకువచ్చి
  rationale: שוב హిఫీల్ రూపం కారణార్థక తిరిగిరాకను సూచిస్తుంది. కథా సందర్భంలో దావీదు తిరిగి యెరూషలేముకు తీసుకురాబడటమే ఉద్దేశం.
- source_word: וְהִרְאַנִי
  choice: నాకు చూపిస్తాడు
  rationale: ראה హిఫీల్ రూపానికి ‘చూసేలా చేయడం/చూపించడం’ అనే అర్థం ఉంది; ‘నాకు చూపిస్తాడు’ తెలుగులో నేరుగా, సహజంగా ఉంటుంది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: సమీప పూర్వపదమైన ‘మందసం’ దీనికి అత్యంత సహజ సూచ్యార్థం; తెలుగులో జడవస్తువుకు ‘దానిని’ సరిపోతుంది.
- source_word: נָוֵהוּ
  choice: దాని నివాసస్థలాన్ని
  rationale: נוה అంటే నివాసం లేదా నివాసస్థలం. ఇక్కడ మందసం ఉండే స్థలాన్ని సూచిస్తుంది; ఇంకా నిర్మించబడని దేవాలయాన్ని ముందుగానే నిర్దిష్టపరచకుండా ఉంటుంది.
theological_decisions:
- issue: ‘దానినీ దాని నివాసస్థలాన్నీ’ అనే మాటల సూచ్యార్థం
  choice: ఈ పదబంధం మందసాన్నీ, యెరూషలేములో అది ఉండే స్థలాన్నీ సూచిస్తుంది.
  alternative: ఇది మరింత దేవుని-కేంద్రీకృతంగా దేవుణ్ణీ ఆయన నివాసస్థలాన్నీ సూచించవచ్చు.
  rationale: אֹתוֹ కు అత్యంత సమీప పూర్వపదం ‘దేవుని మందసం’ కాబట్టి మందసమే సహజ సూచ్యార్థం. అయితే మందసం దేవుని సన్నిధిని సూచించేందున, దేవుణ్ణీ ఆయన నివాసాన్నీ ఉద్దేశించిన భావసంభావ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం,’ ‘అనుగ్రహం,’ ‘నివాసస్థలం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణంతో కలిపాం. మూలంలోని సర్వనామ సూచ్యార్థ సందిగ్ధతను ప్రధాన పాఠంలో సహజ పఠనంతో, పాదసూచికలో ప్రత్యామ్నాయ పఠనంతో పరిరక్షించాం.
