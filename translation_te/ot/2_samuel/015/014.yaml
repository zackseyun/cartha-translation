source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּ֠וִד לְ/כָל עֲבָדָ֨י/ו אֲשֶׁר אִתּ֤/וֹ בִ/ירוּשָׁלִַ֨ם֙ ק֣וּמוּ וְ/נִבְרָ֔חָה כִּ֛י לֹא תִֽהְיֶה לָּ֥/נוּ פְלֵיטָ֖ה מִ/פְּנֵ֣י אַבְשָׁל֑וֹם מַהֲר֣וּ לָ/לֶ֗כֶת פֶּן יְמַהֵ֤ר וְ/הִשִּׂגָ֨/נוּ֙ וְ/הִדִּ֤יחַ עָלֵ֨י/נוּ֙ אֶת הָ֣/רָעָ֔ה וְ/הִכָּ֥ה הָ/עִ֖יר לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: te
  text: 'అప్పుడు దావీదు యెరూషలేములో తనతో ఉన్న సేవకులందరితో ఇలా అన్నాడు: “లేవండి, మనం పారిపోదాం; అబ్షాలోము నుండి మనకు తప్పించుకునే మార్గం ఉండదు. త్వరగా బయలుదేరండి; లేకపోతే అతడు త్వరపడి మనలను చేరుకొని, మనపై విపత్తు తెచ్చి, నగరాన్ని కత్తి ధారతో కొడతాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కత్తి నోటితో.” ఇది కత్తి ద్వారా నగరంపై ప్రాణాంతక దాడిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: తన సేవకులు
  rationale: రాజసభ సందర్భంలో ఈ పదం దావీదు అధికారులను, పరివారాన్ని లేదా సేవలో ఉన్నవారిని సూచించగలదు; బానిసత్వాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ సహజంగా ఉంది.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: లేవండి, మనం పారిపోదాం
  rationale: ఆజ్ఞారూపంలోని ‘లేవండి’ని, మాట్లాడేవాడినీ కలుపుకొనే ప్రోత్సాహక రూపమైన ‘మనం పారిపోదాం’ని రెండింటినీ నిలుపుతుంది.
- source_word: פְלֵיטָה
  choice: తప్పించుకునే అవకాశం
  rationale: ఈ సందర్భంలో అబ్షాలోము దాడి నుండి ప్రాణాలతో బయటపడడాన్ని సూచిస్తుంది; దైవిక విమోచన అనే అదనపు భావాన్ని చేర్చదు.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: త్వరగా బయలుదేరండి
  rationale: అక్షరార్థంగా ‘వెళ్లడానికి త్వరపడండి’; సందర్భానుసారంగా తక్షణమే నగరాన్ని విడిచి వెళ్లాలనే ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִשִּׂגָנוּ
  choice: మనల్ని పట్టుకొని
  rationale: వెంబడించి చేరుకోవడం లేదా పట్టుకోవడం అనే సైనిక సందర్భంలోని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: మన మీదికి విపత్తు రప్పించి
  rationale: רָעָה ఇక్కడ నైతిక చెడును కాక ఆపద లేదా విపత్తును సూచిస్తుంది; హిఫీల్ క్రియ కారణక భావాన్ని కలిగి ఉంది.
- source_word: וְהִכָּה הָעִיר לְפִי־חָרֶב
  choice: నగరవాసులను కత్తివాత చంపి
  rationale: ‘కత్తి నోటితో నగరాన్ని కొట్టడం’ అనే హీబ్రూ యుద్ధ నుడికారం నగర ప్రజలను కత్తితో సంహరించడాన్ని సూచిస్తుంది; లక్ష్యమైన నగరాన్ని దాని నివాసులుగా భావించే సహజ లక్షణార్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
