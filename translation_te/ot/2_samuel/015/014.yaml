translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. దావీదు మాటలలోని అత్యవసరతను ఆశ్చర్యార్థకం, చిన్న ఆజ్ఞావాక్యాలు, ‘త్వరగా’ అనే పదంతో నిలిపాం. మూలపాఠంలోని ‘పెన్’ నిషేధార్థక హెచ్చరికను తెలుగులో సహజమైన ‘చంపకముందే’ నిర్మాణంతో చివర ఉంచాం.
