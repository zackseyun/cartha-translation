source:
  edition: WLC
  text: וְ/דָוִ֡ד עֹלֶה֩ בְ/מַעֲלֵ֨ה הַ/זֵּיתִ֜ים עֹלֶ֣ה וּ/בוֹכֶ֗ה וְ/רֹ֥אשׁ ל/וֹ֙ חָפ֔וּי וְ/ה֖וּא הֹלֵ֣ךְ יָחֵ֑ף וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ חָפוּ֙ אִ֣ישׁ רֹאשׁ֔/וֹ וְ/עָל֥וּ עָלֹ֖ה וּ/בָכֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: te
  text: దావీదు ఒలీవల కొండ ఎక్కే దారిలో పైకి వెళ్తూ ఏడుస్తున్నాడు.[a] అతని తల కప్పబడి ఉంది; అతడు చెప్పులు లేకుండా నడుస్తున్నాడు. అతనితో ఉన్న ప్రజలందరూ ఒక్కొక్కరు తమ తలను కప్పుకొని,[b] పైకి వెళ్తూ ఏడుస్తూనే ఉన్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘పైకి వెళ్లడం’ అనే భావం పునరుక్తమై, “పైకి వెళ్తూ, పైకి వెళ్తూ ఏడుస్తున్నాడు” అనే బలమైన, సజీవ భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'మూలంలో పంపిణీ ఏకవచనం ఉంది: “ప్రతి వ్యక్తి తన తలను కప్పుకున్నాడు.”'
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, “వారు పైకి వెళ్లారు—పైకి వెళ్తూ ఏడుస్తూ” అని ఉంది; ఈ నిర్మాణం చర్య కొనసాగడాన్ని, దాని తీవ్రతను చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: ఒలీవ కొండ ఎక్కే దారిలో
  rationale: מַעֲלֵה అనేది పైకి ఎక్కే దారి లేదా వాలును సూచిస్తుంది; הַזֵּיתִים ఇక్కడ స్థలనామంగా ఒలీవ కొండను సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘ఎక్కే దారి’ అని ఇచ్చాం.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: పైకి వెళ్తూ ఏడుస్తున్నాడు
  rationale: పునరుక్త participleలు కొనసాగుతున్న దృశ్యాన్ని సజీవంగా చూపిస్తాయి. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉంచి, హెబ్రీ పునరుక్తిని పాదటిప్పణిలో తెలియజేశాం.
- source_word: בֹּכֶה
  choice: ఏడుస్తున్నాడు
  rationale: ఈ పదం శారీరకంగా కన్నీరు కారుస్తూ ఏడవడాన్ని సాధారణంగా సూచిస్తుంది; ఆచారబద్ధమైన విలాపం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: అతని తల కప్పబడి ఉంది
  rationale: חָפוּי యొక్క స్థితివాచక భావాన్ని నిలుపుతూ, తలను ఎలా కప్పుకున్నాడో అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: יָחֵף
  choice: చెప్పులు లేకుండా
  rationale: ఆధునిక సాధారణ తెలుగులో ‘చెప్పులు లేకుండా’ అనేది స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: הָעָם విస్తృతంగా అతనితో ఉన్న సమూహాన్ని సూచిస్తుంది; వారిని సైనికులుగా మాత్రమే పరిమితం చేయలేదు.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: ఒక్కొక్కరు తమ తలను కప్పుకొని
  rationale: אִישׁ ఇక్కడ పంపిణీ ఏకవచనంగా ‘ఒక్కొక్కరు’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేందుకు ‘తమ తలను’ వాడాం.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: పైకి వెళ్తూ ఏడుస్తూనే ఉన్నారు
  rationale: finite verbతో కూడిన infinitive absolute ఎక్కడం, ఏడవడం కొనసాగుతున్న దృశ్యాన్ని బలపరుస్తుంది. తెలుగులో అసహజమైన పదపునరుక్తి లేకుండా ‘వెళ్తూ… ఏడుస్తూనే’ అని ఆ కొనసాగింపును తెలిపాం.
