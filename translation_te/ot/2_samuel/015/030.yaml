translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హెబ్రీలోని పునరుక్తుల సజీవతను ప్రధాన పాఠ్యంలో కొనసాగింపు సూచకాలతో, పాదటిప్పణుల్లో రూపపరమైన వివరాలతో నిలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఉంచబడ్డాయి.
