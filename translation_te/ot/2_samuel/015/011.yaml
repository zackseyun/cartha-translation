  edition: WLC
  text: וְ/אֶת אַבְשָׁל֗וֹם הָלְכ֞וּ מָאתַ֤יִם אִישׁ֙ מִ/יר֣וּשָׁלִַ֔ם קְרֻאִ֖ים וְ/הֹלְכִ֣ים לְ/תֻמָּ֑/ם וְ/לֹ֥א יָדְע֖וּ כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: te
  text: యెరూషలేము నుండి రెండువందల మంది పురుషులు అబ్షాలోముతో కలిసి వెళ్లారు; వారు ఆహ్వానించబడినవారు. వారు తమ నిష్కపటత్వంతో[a] వెళ్లారు; వారికి ఏ విషయమూ తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ అమాయకత్వంతో,” “నిష్కపటంగా,” లేదా “యథార్థతతో.” హీబ్రూ పదబంధం, అబ్షాలోము పన్నాగం వారికి తెలియక వారు అనుమానం లేకుండా వెళ్లారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... אֶת־אַבְשָׁלוֹם
  choice: అబ్షాలోముతో పాటు ... వెళ్లారు
  rationale: הלך అంటే ‘వెళ్లు’; אֶת־אַבְשָׁלוֹם ఇక్కడ సహవాసాన్ని సూచిస్తున్నందున, సహజమైన తెలుగులో ‘అబ్షాలోముతో పాటు వెళ్లారు’ అని అనువదించాం.
- source_word: מָאתַיִם אִישׁ
  choice: రెండువందల మంది
  rationale: సంఖ్య తర్వాత אִישׁ వ్యక్తులను లెక్కించే పదంగా ఉంది. తెలుగులో ‘రెండువందల మంది’ సహజంగా ఉండి, సందర్భంలోని పురుషులను సూచిస్తుంది.
- source_word: מִירוּשָׁלַםִ
  choice: యెరూషలేము నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; అందువల్ల ‘నుండి’ సూటియైన సమానార్థకం.
- source_word: קְרֻאִים
  choice: ఆహ్వానించబడిన
  rationale: קרא క్రియ యొక్క కర్మణి కృదంతం ‘పిలువబడిన/ఆహ్వానించబడిన’ అని అర్థం. సందర్భంలో విందుకు ఆహ్వానం భావం ఉన్నప్పటికీ, మూలంలో లేని ‘అతిథులు’ అనే నామవాచకాన్ని చేర్చలేదు.
- source_word: לְתֻמָּם
  choice: నిర్దోషమైన మనసుతో
  rationale: ఈ పదబంధం నిర్దోషిత్వం, నిష్కపటత్వం లేదా సమగ్రతను సూచించగలదు. వెంట వచ్చే ‘ఏ సంగతీ తెలియక’ అనే మాటలు వారు కుట్రను ఎరుగక నిష్కపటంగా వెళ్లారనే సందర్భార్థాన్ని బలపరుస్తాయి.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: వారు ఏ సంగతీ తెలియక
  rationale: ‘ఏ సంగతీ తెలియదు’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చి, వారి నిష్కపట స్థితికి కారణాన్ని స్పష్టంగా కొనసాగించాం.
