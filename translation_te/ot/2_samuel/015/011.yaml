  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘తెలియక’ అనే వివరణను ముందుంచి తెలుగు ప్రవాహాన్ని మెరుగుపరిచాం; అయినా మూలంలోని భావ సంబంధం నిలుపబడింది.
