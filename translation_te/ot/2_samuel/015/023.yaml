translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని పునరుక్తి మరియు ప్రజల నిరంతర కదలిక నిలుపబడ్డాయి; చివరి మార్గసూచక పదబంధంలోని స్వల్ప సందిగ్ధతను అతిగా పరిష్కరించలేదు.
