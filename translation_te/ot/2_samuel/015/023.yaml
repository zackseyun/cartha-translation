source:
  edition: WLC
  text: וְ/כָל הָ/אָ֗רֶץ בּוֹכִים֙ ק֣וֹל גָּד֔וֹל וְ/כָל הָ/עָ֖ם עֹֽבְרִ֑ים וְ/הַ/מֶּ֗לֶךְ עֹבֵר֙ בְּ/נַ֣חַל קִדְר֔וֹן וְ/כָל הָ/עָם֙ עֹבְרִ֔ים עַל פְּנֵי דֶ֖רֶךְ אֶת הַ/מִּדְבָּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: te
  text: దేశమంతా బిగ్గరగా ఏడుస్తోంది[a]; ప్రజలందరూ దాటిపోతున్నారు. రాజు కూడా కిద్రోను లోయను[b] దాటాడు; ప్రజలందరూ ఎడారి దారివైపుగా దాటిపోతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేశమంతా’ అనేది ఆ ప్రాంతంలోని ప్రజలను సమష్టిగా సూచించే హీబ్రూ ప్రయోగం.
    reason: cultural_note
  - marker: b
    text: '‘కిద్రోను లోయ’: సంప్రదాయంగా ‘కిద్రోను వాగు.’ హీబ్రూ పదం నఖల్ లోయను, కనుమను లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగును సూచించగలదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: దేశమంతా
  rationale: ఇక్కడ אָרֶץ అంటే భూమి అంతా కాదు; ఆ ప్రాంతాన్ని, అక్కడి ప్రజలను సమష్టిగా సూచించే హీబ్రూ ప్రయోగం. ‘దేశమంతా’ ఆ సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: బిగ్గరగా ఏడుస్తూ ఉండగా
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరంతో ఏడుస్తూ’ అనే భావం. ఆధునిక తెలుగులో వినిపించేలా విలపించడాన్ని ‘బిగ్గరగా ఏడుస్తూ’ సహజంగా తెలియజేస్తుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם ఇక్కడ కేవలం సైనికులను కాకుండా దావీదుతో వెళ్తున్న సమూహమంతటినీ సూచిస్తుంది.
- source_word: עֹבְרִים / עֹבֵר
  choice: దాటిపోతున్నారు / దాటాడు
  rationale: ప్రజల కదలిక కొనసాగుతున్న చర్యగా, రాజు దాటడాన్ని కథనంలోని నిర్దిష్ట చర్యగా తెలుగులో వ్యక్తం చేశాం.
- source_word: בְּנַחַל קִדְרוֹן
  choice: కిద్రోను లోయను
  rationale: נחל అనేది వాగు, వర్షాకాలపు నీటిప్రవాహం, లోయ లేదా కనుమను సూచించగలదు. ఈ భౌగోళిక సందర్భంలో ‘లోయ’ స్పష్టమైన ఆధునిక పదం.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: ఎడారి వైపు వెళ్లే దారి మీదుగా
  rationale: మూలంలోని సంక్షిప్తమైన, కొంత సందిగ్ధమైన పదబంధం ఎడారి దిశగా సాగే మార్గాన్ని సూచిస్తుంది. దిశను స్పష్టంగా తెలుపుతూ అవసరానికి మించి వివరించకుండా అనువదించాం.
