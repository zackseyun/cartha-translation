revisions:
- from: అప్పుడు రాజు గిత్తీయుడైన ఇత్తయితో, “నీవు కూడా మాతో ఎందుకు వస్తున్నావు?[a] వెనక్కి వెళ్లి రాజుతోనే ఉండు.[b] ఎందుకంటే నీవు పరదేశివి; పైగా నీ స్వస్థలం నుంచి వచ్చిన ప్రవాసివి.[c]” అన్నాడు.
  to: అప్పుడు రాజు గిత్తీయుడైన ఇత్తయితో, “నీవు కూడా మాతో ఎందుకు వస్తున్నావు?[a] వెనక్కి వెళ్లి రాజుతో ఉండు.[b] ఎందుకంటే నీవు పరదేశివి; పైగా నీ స్వస్థలానికి సంబంధించిన ప్రవాసివి.[c]” అన్నాడు.
  rationale: హీబ్రూలో లేని ‘నే’ ఉద్ఘాటనను తొలగించాం. చివరి పదబంధంలో ‘నుంచి వచ్చిన’ అనే నిర్దిష్ట వివరణకు బదులుగా ‘స్వస్థలానికి సంబంధించిన’ అని ఇచ్చి, లమెద్ యొక్క సంక్షిప్తమైన, వివాదాస్పద సంబంధాన్ని ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ జాగ్రత్తగా నిలిపాం. మిగతా పాఠ్యం మూలానికి నమ్మకంగా, సహజంగా ఉంది.
