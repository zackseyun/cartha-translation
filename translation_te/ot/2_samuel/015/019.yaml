id: 2SA.15.19
reference: 2 Samuel 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל אִתַּ֣י הַ/גִּתִּ֔י לָ֧/מָּה תֵלֵ֛ךְ גַּם אַתָּ֖ה אִתָּ֑/נוּ שׁ֣וּב וְ/שֵׁ֤ב עִם הַ/מֶּ֨לֶךְ֙ כִּֽי נָכְרִ֣י אַ֔תָּה וְ/גַם גֹּלֶ֥ה אַתָּ֖ה לִ/מְקוֹמֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: te
  text: అప్పుడు రాజు గిత్తీయుడైన ఇత్తయితో, “నీవు కూడా మాతో ఎందుకు వస్తున్నావు?[a] వెనక్కి వెళ్లి రాజుతో ఉండు.[b] ఎందుకంటే నీవు పరదేశివి; పైగా నీ స్వస్థలానికి సంబంధించిన ప్రవాసివి.[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు కూడా మాతో ఎందుకు వెళ్తావు?”
    reason: హీబ్రూ అసంపూర్ణ క్రియారూపాన్ని వర్తమానంగా లేదా భవిష్యత్ భావంతో అర్థం చేసుకోవచ్చు.
  - marker: b
    text: ‘రాజుతో ఉండు’ అన్న మాట యెరూషలేములో కొనసాగుతున్న రాజాధికారంతో ఉండడాన్ని సూచించవచ్చు; హీబ్రూ ఎవరిని ఉద్దేశించిందో స్పష్టంగా చెప్పదు.
    reason: ‘రాజు’ అనే పదం ఎవరిని సూచిస్తుందనే అస్పష్టతను నిలుపుతుంది.
  - marker: c
    text: హీబ్రూ అక్షరార్థంగా, “నీ స్థలానికి/నీ స్థలం విషయంగా ప్రవాసివి” అని ఉంది. ఇది సంక్షిప్తమైన నిర్మాణం; ఇత్తయి తన స్వస్థలం విడిచి ఉన్న స్థితిని సూచించవచ్చు.
    reason: לִמְקוֹמֶךָలోని దిశా లేదా సంబంధ భావం అస్పష్టంగా ఉండటాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది. మూలంలో ఉన్న బిరుదును అనుసరించి దావీదు పేరుకు బదులు ‘రాజు’ అని ఉంచాం.
- source_word: אִתַּי הַגִּתִּי
  choice: గిత్తీయుడైన ఇత్తయి
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, הַגִּתִּי అనే జాతి/ప్రాంత సూచకాన్ని గాతు పట్టణానికి చెందినవాడనే భావంతో ‘గిత్తీయుడు’గా ఇచ్చాం.
- source_word: לָמָּה תֵלֵךְ גַּם־אַתָּה אִתָּנוּ
  choice: నీవు కూడా మాతో ఎందుకు వస్తున్నావు?
  rationale: అసంపూర్ణ క్రియారూపం ఈ ప్రత్యక్ష సంభాషణలో జరుగబోయే లేదా సాగుతున్న చర్యను సూచించగలదు. ఆధునిక తెలుగులో సందర్భానికి సహజంగా ‘వస్తున్నావు’ అని ఇచ్చి, גַּם భావాన్ని ‘కూడా’తో నిలిపాం.
- source_word: שׁוּב וְשֵׁב
  choice: వెనక్కి వెళ్లి ... ఉండు
  rationale: మొదటి ఆజ్ఞ తిరిగి వెళ్లడాన్ని, ישׁב రూపం ఇక్కడ కూర్చోవడాన్ని కాక అక్కడే నిలిచి ఉండడాన్ని సూచిస్తుంది.
- source_word: עִם הַמֶּלֶךְ
  choice: రాజుతోనే
  rationale: మూలంలోని ‘రాజుతో’ అనే మాటను దాని వ్యక్తి సూచనను నిర్ణయించకుండా అలాగే నిలిపాం. ‘నే’ సందర్భంలోని అక్కడే ఉండాలనే బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָכְרִי
  choice: పరదేశివి
  rationale: స్థానికుడు కాని వ్యక్తి అనే భావాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְגַם גֹּלֶה אַתָּה
  choice: పైగా ... ప్రవాసివి
  rationale: גֹּלֶה బలవంతపు లేదా పరిస్థితులవల్ల కలిగిన స్థానచలన స్థితిని సూచిస్తుంది; ‘ప్రవాసి’ ఆ భావాన్ని మతపరమైన అదనపు నిర్ణయాలు లేకుండా ఇస్తుంది.
- source_word: לִמְקוֹמֶךָ
  choice: నీ స్వస్థలం నుంచి వచ్చిన
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీ స్థలానికి/నీ స్థలం విషయంగా’ అని సంక్షిప్తంగా ఉంది. సందర్భంలో ఇత్తయి తన స్థలం విడిచి ప్రవాసిగా ఉన్నాడనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం; మూలంలోని దిశా అస్పష్టతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘రాజుతో ఉండు’లో ‘రాజు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ప్రధాన పాఠ్యంలో ‘రాజుతోనే ఉండు’ అని మాత్రమే ఉంచడం
  alternative: ‘అబ్షాలోము రాజుతో ఉండు’ లేదా ‘యెరూషలేములోని రాజుతో ఉండు’ లేదా ‘రాజునైన నాతో ఉండు’
  rationale: హీబ్రూ వ్యక్తి పేరును చెప్పకుండా ‘రాజు’ అనే బిరుదునే మళ్లీ వాడుతుంది. కాబట్టి అనిశ్చిత సూచనను వ్యాఖ్యానంతో పరిష్కరించకుండా నిలిపాం.
- issue: לִמְקוֹמֶךָ మరియు ప్రవాస స్థితి మధ్య సంబంధం
  choice: ‘నీ స్వస్థలం నుంచి వచ్చిన ప్రవాసివి’ అని సందర్భానుగుణంగా అనువదించి, అక్షర నిర్మాణాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘నీ స్థలానికి ప్రవాసివి’
  rationale: ప్రత్యామ్నాయ అక్షర రూపం తెలుగులో అసహజంగా, అర్థం కానట్టుగా ఉంటుంది. అయితే మూలంలో ‘నుంచి’ అనే విభక్తి స్పష్టంగా లేదనే నిజాన్ని పాదసూచిక ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పరదేశి,’ ‘ప్రవాసి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని ‘రాజు’ సూచనను, చివరి హీబ్రూ పదబంధంలోని సంక్షిప్తతను వ్యాఖ్యానాత్మకంగా పూర్తిగా పరిష్కరించకుండా పాదసూచికలతో కాపాడాం.
