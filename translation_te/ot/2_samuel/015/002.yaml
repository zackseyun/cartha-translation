translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పునరావృత చర్యలను తెలుగు ‘-వాడు’ రూపాలతో వ్యక్తం చేశాం. ‘ద్వారం’ సందర్భాన్ని నగర ప్రవేశ ద్వారంగా స్పష్టం చేయడానికి ‘పట్టణ ద్వారం’ అన్నాం.
