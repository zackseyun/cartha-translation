source:
  edition: WLC
  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: te
  text: అబ్షాలోము ఉదయాన్నే లేచి, ద్వారానికి వెళ్లే దారి పక్కన నిలబడేవాడు. తీర్పు కోసం రాజు దగ్గరకు రావాల్సిన వివాదం ఉన్న ఎవరైనా వచ్చినప్పుడు, అబ్షాలోము అతన్ని పిలిచి, “నీవు ఏ పట్టణానికి చెందినవాడివి?” అని అడిగేవాడు. అతడు, “నీ సేవకుడు ఇశ్రాయేలు గోత్రాల్లో ఒకదానికి చెందినవాడిని” అని చెప్పేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: ఉదయాన్నే లేచి
  rationale: క్రియకు ‘తెల్లవారగానే/ఉదయాన్నే లేవడం’ అనే అర్థం ఉంది. వాక్యంలోని పునరావృత సందర్భాన్ని ‘నిలబడేవాడు’ అనే అలవాటుసూచక రూపంతో సహజంగా వ్యక్తం చేశాం.
- source_word: וְעָמַד
  choice: నిలబడేవాడు
  rationale: మూలంలోని సాధారణ ‘నిలుచు’ భావాన్ని కాపాడుతూ, ఇది అబ్షాలోము పదేపదే చేసేవాడనే సందర్భార్థాన్ని తెలుగు అలవాటుసూచక రూపం తెలియజేస్తుంది.
- source_word: עַל יַד
  choice: పక్కన
  rationale: ఈ హీబ్రూ నుడికారం ‘దగ్గరగా, ప్రక్కన’ అని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పక్కన’ సహజంగా ఉంది.
- source_word: דֶּרֶךְ הַשָּׁעַר
  choice: పట్టణ ద్వారానికి వెళ్లే దారి
  rationale: నిర్మాణ పదబంధం ద్వారానికి దారితీసే మార్గాన్ని సూచిస్తుంది. సందర్భ స్పష్టత కోసం తెలుగులో ‘పట్టణ’ చేర్చబడింది; పురాతన నగర ద్వారమే ఉద్దేశం.
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה־לּוֹ רִיב
  choice: వివాదం ఉన్నవాడు ఎవడైనా వచ్చినప్పుడు
  rationale: ఇది పునరావృతంగా ఏర్పడే పరిస్థితిని పరిచయం చేస్తుంది. רִיב పదంలోని వివాదం/ఫిర్యాదు/న్యాయవ్యాజ్యం అనే పరిధిలో ‘వివాదం’ ప్రధాన పాఠ్యంలో సహజంగా ఉంది.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: తీర్పు కోసం రాజు దగ్గరకు రావడానికి
  rationale: מִשְׁפָּט ఇక్కడ న్యాయపరమైన నిర్ణయం లేదా తీర్పును సూచిస్తుంది. ‘తీర్పు కోసం’ సంక్షిప్తంగా న్యాయ సందర్భాన్ని నిలుపుతుంది.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: అతన్ని పిలిచి
  rationale: క్రియ ‘పిలుచు/పిలిచి మాట్లాడు’ అనే భావాన్ని ఇస్తుంది; అధికారికంగా సమన్లు పంపినట్టు బలమైన భావాన్ని చేర్చలేదు.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: నువ్వు ఏ పట్టణం నుంచి వచ్చావు?
  rationale: వ్యక్తి ఏ పట్టణానికి చెందినవాడో అడిగే మూలప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల్లో ఒకదానికి చెందినవాణ్ణి
  rationale: సమాధానం గోత్ర సంబంధాన్ని తెలియజేస్తుంది. మూలంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో స్పష్టంగా చెప్పడానికి ‘చెందినవాణ్ణి’ వాడాం.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడైన నేను
  rationale: ఇక్కడ పదం గౌరవపూర్వకమైన స్వీయ సంబోధనగా పనిచేస్తుంది. బానిసత్వ స్థితిని అవసరం లేకుండా నొక్కిచెప్పకుండా సామాజిక మర్యాదను ‘నీ సేవకుడైన నేను’ నిలుపుతుంది.
