  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: te
  text: ఎవరైనా అబ్షాలోముకు వంగి నమస్కరించడానికి[a] అతని దగ్గరకు వచ్చినప్పుడల్లా, అతడు తన చెయ్యి చాపి అతణ్ణి పట్టుకొని ముద్దు పెట్టుకునేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్షాలోముకు సాష్టాంగంగా నమస్కరించడానికి.’ హీబ్రూ క్రియ గౌరవ సూచకంగా వంగి నమస్కరించడాన్ని సూచించవచ్చు; ఇక్కడ అది తప్పనిసరిగా మతపరమైన ఆరాధనను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: వచ్చినప్పుడల్లా ... చేసేవాడు
  rationale: కథన సందర్భంలో ఇది పదేపదే జరిగే అలవాటైన చర్యను సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘అప్పుడల్లా ... చేసేవాడు’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּקְרָב אִישׁ
  choice: ఎవరైనా ... దగ్గరకు వచ్చినప్పుడు
  rationale: אִישׁ వ్యాకరణపరంగా ఏకవచన పుంలింగమైనా, ఇక్కడ ప్రతి వ్యక్తినీ సాధారణంగా సూచిస్తుంది. ‘ఎవరైనా’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: తనకు వంగి నమస్కరించడానికి
  rationale: ఈ క్రియ గౌరవ సూచకంగా వంగడం లేదా సాష్టాంగపడడం అనే శారీరక చర్యను సూచించగలదు. ఇక్కడ రాజసంబంధ గౌరవ సందర్భం కావడంతో ‘వంగి నమస్కరించడం’ సహజంగా ఉండి మతపరమైన ఆరాధన అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: తన చెయ్యి చాపి
  rationale: ‘చేతిని పంపడం’ అనే పదశః రూపానికి బదులు, చేయి ముందుకు చాపడాన్ని తెలిపే సహజ తెలుగు నుడికారం వాడబడింది.
- source_word: וְהֶחֱזִיק לוֹ
  choice: అతణ్ణి పట్టుకొని
  rationale: హిఫీల్ రూపం ఇక్కడ ఒకరిని పట్టుకోవడం లేదా చేయిపట్టుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పట్టుకొని’ మూలంలోని శారీరక చర్యను నిలుపుతూ ‘బలవంతంగా పట్టుకున్నాడు’ అనే అనవసర కఠిన భావాన్ని కలిగించదు.
- source_word: וְנָשַׁק לוֹ
  choice: ముద్దుపెట్టుకునేవాడు
  rationale: మూల క్రియకు నేరుగా ‘ముద్దుపెట్టు’ అనే అర్థం. సందర్భంలో ఇది ఆప్యాయత లేదా అనుగ్రహ సూచకమైన సామాజిక చర్య అయినప్పటికీ, ఆ వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: לְהִשְׁתַּחֲוֺת לוֹ అనే పదబంధం ఆరాధననా లేక గౌరవ నమస్కారమా
  choice: వంగి నమస్కరించడానికి
  alternative: అతనికి సాష్టాంగపడడానికి; అతణ్ణి ఆరాధించడానికి
  rationale: ఈ రాజకీయ-సామాజిక సందర్భంలో అబ్షాలోముకు గౌరవం చూపే శారీరక నమస్కారం ఉద్దేశించబడింది. అయినా క్రియలోని వంగడం/సాష్టాంగపడడం అనే విస్తృత భావాన్ని పాదసూచికలో నిలిపాం; ‘ఆరాధన’ అని అనువదిస్తే ఇక్కడ అవసరం లేని మతపరమైన అర్థం వచ్చేది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. అలవాటుగా పునరావృతమయ్యే చర్యను ‘వచ్చినప్పుడల్లా ... చేసేవాడు’ నిర్మాణంతో తెలిపాం. ఎవరు చర్యలు చేస్తున్నారో తెలుగులో స్పష్టంగా ఉండేందుకు సందర్భానుసారంగా ‘అబ్షాలోము’ పేరును ఉంచాం.
