translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీలోని ప్రయాణ క్రమాన్ని సహజంగా వ్యక్తపరచడానికి రెండు వాక్యాలుగా విభజించబడింది; సందిగ్ధమైన స్థలపదబంధం ప్రధాన పాఠ్యంలో అక్షరార్థానికి దగ్గరగా ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
