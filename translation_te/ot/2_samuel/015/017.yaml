- from: రాజు బయలుదేరాడు; ప్రజలందరూ అతనితో కాలినడకన వెళ్లారు. వారు దూరపు ఇంటి దగ్గర[a] ఆగారు.
  to: రాజు బయలుదేరాడు, ప్రజలందరూ అతనితో పాటు వెళ్లారు. వారు దూరంలోని ఇంటివద్ద[a] ఆగారు.
  rationale: బְּרַגְלָיוలో ఉన్న ‘వెంబడి/తోడు’ భావాన్ని ‘అతనితో పాటు’ ద్వారా నిలుపుతూ, ‘కాలినడకన’ అనే నిర్ధిష్టతను తొలగించాం. బֵּית הַמֶּרְחָక యొక్క అనిశ్చితిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా ఉంచి, ప్రత్యామ్నాయ స్థలనామం మరియు ‘చివరి ఇల్లు’ అనే వ్యాఖ్యానాన్ని పాదటిప్పణిలో భద్రపరిచాం.
