  yaml_path: translation/ot/2_samuel/015/017.yaml
  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: te
  text: రాజు బయలుదేరాడు, ప్రజలందరూ అతనితో పాటు వెళ్లారు. వారు దూరంలోని ఇంటివద్ద[a] ఆగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ఇది స్థలనామం కావచ్చు: “బేత్‌-మెర్హాక్.” హెబ్రీ పదబంధాన్ని “దూరపు ఇల్లు” లేదా “దూరంలోని ఇల్లు” అని అర్థం చేసుకోవచ్చు; చాలామంది దీనిని నగరపు అంచున ఉన్న “చివరి ఇల్లు” అని అర్థం చేసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అనే క్రియ ఇక్కడ ప్రయాణ సందర్భంలో బయటికి వెళ్లడం లేదా బయలుదేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘బయలుదేరాడు’ సహజంగా ఉంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో దావీదును సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో ‘రాజు’ సహజమైన నిర్దిష్ట సూచన.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם రాజుతో వెళ్లిన సమూహాన్ని విస్తృతంగా సూచిస్తుంది; వారిని సైనికులకే పరిమితం చేయకుండా ‘ప్రజలు’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: בְּרַגְלָיו
  choice: అతనితో కాలినడకన
  rationale: అక్షరార్థంగా ‘అతని పాదాల వద్ద/వెంబడి’; ఈ సందర్భంలో రాజుతో పాటు కాలినడకన వెళ్లడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיַּעַמְדוּ
  choice: ఆగారు
  rationale: עמד ప్రాథమికంగా ‘నిలబడు’ అయినా, ప్రయాణ కథనంలో కదలికను ఆపి నిలవడం అనే భావం ఉంది; ‘ఆగారు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּית הַמֶּרְחָק
  choice: దూరపు ఇంటి దగ్గర
  rationale: హెబ్రీ పదబంధాన్ని వివరణాత్మకంగా ‘దూరపు ఇల్లు’ అని నేరుగా ప్రతిబింబిస్తుంది; ‘చివరి ఇల్లు’ అనే సాధ్యమైన సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించదు.
