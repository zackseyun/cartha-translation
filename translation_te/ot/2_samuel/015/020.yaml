source:
  edition: WLC
  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: te
  text: నీవు నిన్ననే వచ్చావు; ఈ రోజు నేను నిన్ను మాతోపాటు అటూ ఇటూ తిరిగేలా చేయాలా? నేనైతే ఎటు వెళ్తున్నానో అటు వెళ్తున్నాను.[a] నీవు తిరిగి వెళ్లి, నీ సహోదరులను నీతో తీసుకుపో.[b] స్థిరమైన ప్రేమ, విశ్వసనీయత నీతో ఉండుగాక.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ మాటమాటకు, “నేను ఎటు వెళ్తున్నానో అటు వెళ్తున్నాను.” ఈ పునరుక్తి దావీదు పారిపోతున్న పరిస్థితిలోని అనిశ్చితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ సహోదరులు” అనేది ఇత్తయితో వచ్చిన అతని బంధువులను లేదా సహచరులను సూచిస్తుండవచ్చు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో ఇక్కడ క్రియ లేదు; “స్థిరమైన ప్రేమ, విశ్వసనీయత” అనే మాటలను సందర్భానుసారంగా ఆశీర్వాద కోరికగా అనువదించాం.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: నీవు నిన్ననే వచ్చావు
  rationale: תְּמוֹל అంటే ప్రధానంగా ‘నిన్న’; సందర్భంలో ఇత్తయి అతి ఇటీవలే వచ్చినవాడని ‘నిన్ననే’ సహజంగా నొక్కి చెబుతుంది. בּוֹאֶךָ అనే క్రియానామ రూపాన్ని తెలుగులో సహజమైన సమాపక క్రియగా ఇచ్చాం.
- source_word: אֲנוּעֲךָ עִמָּנוּ לָלֶכֶת
  choice: నేను నిన్ను మాతోపాటు అటూ ఇటూ తిరిగేలా చేయాలా?
  rationale: נוע క్రియలోని అస్థిరంగా తిరిగే భావాన్నీ, రూపంలోని కారణార్థాన్నీ ‘తిరిగేలా చేయడం’ నిలుపుతుంది; ప్రశ్నారూపం దావీదు ఇత్తయిని అలా చేయదలచుకోలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: నేనైతే ఎటు వెళ్తున్నానో అటు వెళ్తున్నాను
  rationale: మూలంలోని పునరుక్తినీ, దావీదు ప్రయాణ గమ్యం అనిశ్చితంగా ఉన్న భావాన్నీ ఏదో నిర్దిష్ట గమ్యాన్ని చేర్చకుండా నిలుపుతుంది.
- source_word: שׁוּב וְהָשֵׁב
  choice: నీవు తిరిగి వెళ్లి, ... నీతో తీసుకుపో
  rationale: మొదటి క్రియ సాధారణ ఆజ్ఞ ‘తిరిగి వెళ్లు’; రెండవది కారణార్థక రూపం. తెలుగులో వ్యక్తిని వెంట తీసుకుపోవడాన్ని ‘నీతో తీసుకుపో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַחֶיךָ
  choice: నీ సహోదరులను
  rationale: మూలంలోని ‘నీ సోదరులు’ అనే బంధుత్వ పదాన్ని నిలిపాం; సందర్భంలో ఇది ఇత్తయి సహచరులను లేదా బంధువులను సూచించవచ్చు.
- source_word: חֶסֶד וֶאֱמֶת
  choice: స్థిరమైన ప్రేమ, విశ్వసనీయత
  rationale: חֶסֶד లోని నిలకడగల నిబద్ధ ప్రేమను ‘స్థిరమైన ప్రేమ’గా, אֱמֶת లోని నమ్మదగిన స్థిరత్వాన్ని ‘విశ్వసనీయత’గా ఇచ్చాం; కేవలం ‘సత్యం’ అని ఇస్తే ఈ జంట పదాల సంబంధపరమైన భావం తగ్గిపోవచ్చు.
theological_decisions:
- issue: చివరి חֶסֶד וֶאֱמֶת పదబంధంలోని అంతర్లీన క్రియ
  choice: స్థిరమైన ప్రేమ, విశ్వసనీయత నీతో ఉండుగాక
  alternative: స్థిరమైన ప్రేమ, విశ్వసనీయత
  rationale: హీబ్రూలో స్పష్టమైన క్రియ లేదు. వీడ్కోలు సందర్భంలో ఇది ఆశీర్వాద కోరికగా సహజంగా అర్థమవుతుంది; అయినప్పటికీ మూలంలోని సంక్షిప్తతను గమనికలో తెలియజేశాం.
- issue: దావీదు ప్రయాణాన్ని సూచించే పునరుక్త పదబంధం
  choice: ఎటు వెళ్తున్నానో అటు వెళ్తున్నాను
  alternative: నేను వెళ్లగలిగిన చోటికి వెళ్తున్నాను
  rationale: ‘వెళ్లగలిగిన’ అని అనువదిస్తే సామర్థ్య భావం మూలంలోకంటే స్పష్టంగా చేరుతుంది. ఎంపిక చేసిన రూపం అనిశ్చితినీ మూలంలోని పునరుక్తినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘అటూ ఇటూ తిరిగేలా’ అనేది నిరాశ్రయమైన సంచార భావాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని ప్రయాణ అనిశ్చితినీ చివరి క్రియలేని ఆశీర్వాద సూత్రంలోని వ్యాకరణ ఉద్రిక్తతనూ గమనికలతో నిలిపాం.
