source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל צָד֣וֹק הַ/כֹּהֵ֔ן הֲ/רוֹאֶ֣ה אַתָּ֔ה שֻׁ֥בָ/ה הָ/עִ֖יר בְּ/שָׁל֑וֹם וַ/אֲחִימַ֨עַץ בִּנְ/ךָ֜ וִ/יהוֹנָתָ֧ן בֶּן אֶבְיָתָ֛ר שְׁנֵ֥י בְנֵי/כֶ֖ם אִתְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: te
  text: అప్పుడు రాజు యాజకుడైన సాదోకుతో, “నీవు ద్రష్టవా?[a] క్షేమంగా నగరానికి తిరిగి వెళ్లు; నీ కుమారుడైన అహీమయస్సును, అబ్యాతారు కుమారుడైన యోనాతానును—మీ ఇద్దరి కుమారులను—మీతో పాటు తీసుకువెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు చూస్తున్నావు కదా?” హీబ్రూ పదాన్ని సాదోకును ‘ద్రష్ట’గా సూచిస్తున్నట్లు గానీ, చూడడం లేదా గ్రహించడం గురించిన ప్రశ్నగా గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/רוֹאֶה
  choice: నీవు దీర్ఘదర్శివా?
  rationale: హీబ్రూ రూపాన్ని ‘దీర్ఘదర్శి’ అనే నామవాచకంగా లేదా ‘చూస్తున్నావు కదా?’ అనే గ్రహణార్థక ప్రశ్నగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో వ్యక్తిని సూచించే అర్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: שֻׁבָ/ה הָ/עִיר
  choice: నగరానికి తిరిగి వెళ్లు
  rationale: שוב ఆజ్ఞార్థక రూపం తిరిగి వెళ్లడాన్ని, העיר గమ్యస్థానమైన నగరాన్ని సూచిస్తాయి; ఆధునిక తెలుగులో ఇది సహజమైన నిర్మాణం.
- source_word: בְּ/שָׁלוֹם
  choice: ప్రశాంతంగా
  rationale: ఇక్కడ שָׁלוֹם సురక్షితంగా లేదా క్షేమంగా తిరిగి వెళ్లడాన్ని కూడా సూచించగలదు. ‘ప్రశాంతంగా’ మూలంలోని శాంతి భావాన్ని నిలుపుతుంది.
- source_word: וַ/אֲחִימַעַץ בִּנְ/ךָ וִ/יהוֹנָתָן בֶּן אֶבְיָתָר
  choice: నీ కుమారుడైన అహీమయస్సు, అబ్యాతారు కుమారుడైన యోనాతాను
  rationale: ఇద్దరి పేర్లు, వారి తండ్రులతోనున్న సంబంధాలు మూలంలోని సమాంతర గుర్తింపుకు అనుగుణంగా స్పష్టంగా ఉంచబడ్డాయి.
- source_word: שְׁנֵי בְנֵי/כֶם אִתְּ/כֶם
  choice: మీ ఇద్దరి కుమారులు—మీతో ఉండాలి
  rationale: బహువచన ప్రత్యయాలు సాదోకు, అబ్యాతారు ఇద్దరినీ ఉద్దేశిస్తున్నాయి. ముందుగా పేర్లు చెప్పి, తరువాత వారిని ‘మీ ఇద్దరి కుమారులు’ అని సమాహారంగా పేర్కొనే హీబ్రూ అన్వయాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సాదోకును הֲרֹאֶה అని సంబోధించడం
  choice: నీవు దీర్ఘదర్శివా?
  alternative: నీవు చూస్తున్నావు కదా?
  rationale: ఈ పదబంధం సాదోకుకు ‘దీర్ఘదర్శి’ అనే పాత్రను ఆపాదిస్తుందా, లేక అతని గ్రహణాన్ని ప్రశ్నిస్తుందా అనేది అనిశ్చితం. ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పేర్లకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణను అనుసరించాం; మూలంలోని అనిశ్చితిని [a] పాదటిప్పణితో నిలిపాం.
