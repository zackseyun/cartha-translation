- from: అప్పుడు రాజు యాజకుడైన సాదోకుతో, “నీవు దీర్ఘదర్శివా?[a] ప్రశాంతంగా నగరానికి తిరిగి వెళ్లు. నీ కుమారుడైన అహీమయస్సు, అబ్యాతారు కుమారుడైన యోనాతాను—మీ ఇద్దరి కుమారులు—మీతో ఉండాలి” అన్నాడు.
  to: అప్పుడు రాజు యాజకుడైన సాదోకుతో, “నీవు ద్రష్టవా?[a] క్షేమంగా నగరానికి తిరిగి వెళ్లు; నీ కుమారుడైన అహీమయస్సును, అబ్యాతారు కుమారుడైన యోనాతానును—మీ ఇద్దరి కుమారులను—మీతో పాటు తీసుకువెళ్లు” అన్నాడు.
  rationale: The revision maintains the Hebrew ambiguity of הֲרֹאֶה and its footnote anchor, uses “క్షేమంగా” for the contextual force of בְּשָׁלוֹם, and explicitly connects the two sons’ accompaniment to the command to return. “తీసుకువెళ్లు” is a natural Telugu expression of the imperative’s implied instruction that they accompany the addressed group; it does not alter the identities or relationships named in the Hebrew.
