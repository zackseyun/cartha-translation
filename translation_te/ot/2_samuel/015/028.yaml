  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: te
  text: “చూడండి, మీరు నాకు తెలియజేయడానికి కబురు పంపేవరకు నేనైతే అరణ్యంలోని దాటే స్థలాల దగ్గర[a] వేచి ఉంటాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అరణ్యంలోని రేవుల దగ్గర.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “అక్కడే ఉండిపోతాను” / “ఆలస్యం చేస్తూ ఉంటాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: చూడండి
  rationale: రביםను ఉద్దేశించిన ఆజ్ఞారూపం ఇక్కడ శ్రద్ధను ఆకర్షించే మాటగా ఉంది; ‘చూడండి’ దాని ప్రత్యక్షతను సహజంగా నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేనైతే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִתְמַהְמֵהַּ
  choice: వేచివుంటాను
  rationale: ఈ హిత్పయేల్ కృదంతం ఆలస్యం చేయడం లేదా అక్కడే నిలిచి ఉండడం అనే భావం ఇస్తుంది; సమాచారం కోసం దావీదు ఉద్దేశపూర్వకంగా అక్కడ ఉండే సందర్భంలో ‘వేచివుంటాను’ సహజమైన కార్యార్థాన్ని తెలియజేస్తుంది.
- source_word: בְּעַבְרוֹת
  choice: రేవుల దగ్గర
  rationale: బహువచన పదం దాటే ప్రదేశాలను, ముఖ్యంగా నీటిని దాటగల రేవులను సూచిస్తుంది; పారిపోతున్న ఈ సందర్భంలో ‘రేవులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמִּדְבָּר
  choice: అరణ్యం
  rationale: ఈ పదం తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన బీడు లేదా అడవి ప్రాంతాన్ని సూచిస్తుంది; ‘అరణ్యం’ తెలుగు బైబిలు సందర్భంలో సహజమైన విస్తృత పదం.
- source_word: עַד בּוֹא דָבָר
  choice: కబురు వచ్చేవరకు
  rationale: דָבָר ఇక్కడ సాధారణ ‘మాట’ కంటే సమాచారం లేదా వార్త అనే అర్థంలో ఉంది; ‘కబురు వచ్చేవరకు’ హీబ్రూ సంక్షిప్తతను, సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: מֵעִמָּכֶם
  choice: మీ దగ్గర నుంచి
  rationale: కబురు వారివద్ద నుంచి రావడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַגִּיד לִי
  choice: నాకు తెలియజేసే
  rationale: נגד హిఫీల్ రూపంలోని ‘తెలియజేయడం/నివేదించడం’ అనే భావాన్ని కబురుతో సహజంగా అనుసంధానిస్తుంది.
