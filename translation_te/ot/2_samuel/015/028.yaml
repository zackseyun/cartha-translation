  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నేనైతే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘కబురు’ సందేశవాహక సందర్భంలో సహజంగా ఉంది. ప్రత్యామ్నాయ అర్థాలను పాదసూచికల్లో భద్రపరిచాం.
