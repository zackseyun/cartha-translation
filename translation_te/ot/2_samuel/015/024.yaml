source:
  edition: WLC
  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: te
  text: ఇదిగో, సాదోకు కూడా వచ్చాడు. అతనితోపాటు లేవీయులందరూ దేవుని నిబంధన మందసాన్ని మోస్తూ వచ్చారు. వారు దేవుని మందసాన్ని దింపి ఉంచారు[a]. పట్టణం[c] నుండి ప్రజలందరూ దాటి వెళ్లడం పూర్తయ్యే వరకు అబ్యాతారు పైకి వెళ్లాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు దేవుని మందసాన్ని అక్కడ ఉంచారు.” హీబ్రూ క్రియ దాన్ని కింద ఉంచడాన్ని లేదా ఒక స్థానంలో ఉంచడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అబ్యాతారు పైకి వచ్చాడు.” హీబ్రూలో అక్షరార్థంగా “పైకి వెళ్లాడు” అని ఉంది; కథనంలో కదలిక యొక్క ఖచ్చితమైన దిశ స్పష్టంగా లేదు.
    reason: alternative_reading
  - marker: c
    text: అంటే, యెరూషలేము నుండి.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృశ్యంలోని కొత్త అంశం వైపు పాఠకుని దృష్టిని మళ్లించే హీబ్రూ సూచనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: גַם צָדוֹק
  choice: సాదోకు కూడా
  rationale: גַם లోని చేర్పు భావాన్ని ‘కూడా’ స్పష్టంగా వ్యక్తం చేస్తుంది; צָדוֹק పేరును సాధారణ తెలుగు లిప్యంతరీకరణలో ఇస్తుంది.
- source_word: כָל הַלְוִיִּם אִתּוֹ
  choice: అతనితోపాటు లేవీయులందరూ
  rationale: אִתּוֹ సహజంగా సాదోకును సూచిస్తుంది; כָל యొక్క సమగ్ర భావాన్ని ‘అందరూ’ నిలుపుతుంది.
- source_word: נֹשְׂאִים
  choice: మోస్తూ వచ్చారు
  rationale: వర్తమాన కృదంతం లేవీయులు మందసాన్ని మోస్తున్న దృశ్యాన్ని వర్ణిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘మోస్తూ వచ్చారు’ సహజంగా ఉంటుంది; ‘వచ్చారు’ అనేది దృశ్యంలో వారి ప్రత్యక్షతను తెలిపే సందర్భానుగుణ పూరణ.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: దేవుని నిబంధన మందసం
  rationale: హీబ్రూ సమాసంలోని ‘దేవుడు,’ ‘నిబంధన,’ ‘మందసం’ అనే అంశాలన్నిటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּצִּקוּ
  choice: దింపి ఉంచారు
  rationale: ఈ సందర్భంలో మందసాన్ని మోసుకువచ్చి ఒకచోట కింద ఉంచడాన్ని సూచిస్తుంది. క్రియకు ఉన్న ‘ఉంచడం/నిలపడం’ పరిధిని పాదటిప్పణిలో నిలుపుతున్నాం.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: అబ్యాతారు పైకి వెళ్లాడు
  rationale: עלה యొక్క ప్రాథమిక పైకి కదలిక భావాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; కథన దిశలోని అనిశ్చితిని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: ప్రజలందరూ దాటి వెళ్లడం పూర్తయ్యే వరకు
  rationale: చర్య పూర్తయ్యే కాలపరిమితిని తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: מִן הָעִיר
  choice: పట్టణం నుండి
  rationale: మూలంలోని సాధారణ ‘పట్టణం’ అనే పదాన్నే ప్రధాన పాఠ్యంలో ఉంచి, యెరూషలేము అనే సందర్భోచిత గుర్తింపును పాదటిప్పణికి పరిమితం చేస్తుంది.
theological_decisions:
- issue: ‘పట్టణం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘పట్టణం’ అని మాత్రమే అనువదించడం
  alternative: ‘యెరూషలేము నుండి’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యం העיר, ‘పట్టణం,’ అని మాత్రమే చెబుతుంది. సందర్భంలో అది యెరూషలేమే అయినా, మూలపాఠ్యంలోని సాధారణ పదాన్ని మార్చకుండా సందర్భోచిత గుర్తింపును పాదటిప్పణిలో ఇస్తున్నాం.
- issue: וַיַּעַל אֶבְיָתָר లోని కదలిక భావం
  choice: ‘అబ్యాతారు పైకి వెళ్లాడు’
  alternative: ‘అబ్యాతారు పైకి వచ్చాడు’ లేదా యాజక క్రియను సూచించే వ్యాఖ్యానాత్మక అనువాదం
  rationale: עלה యొక్క ప్రత్యక్ష అర్థం పైకి వెళ్లడం/ఎక్కడం. కథనంలోని ఖచ్చితమైన దిశ లేదా ఉద్దేశం స్పష్టంగా లేనందున దానిని సిద్ధాంతపరంగా లేదా కథనపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ద్వారా హీబ్రూ దృష్టి-ఆహ్వాన సూచనను నిలిపాం. ‘మందసం,’ ‘నిబంధన,’ ‘లేవీయులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని కొనసాగిస్తూ, అస్పష్టమైన కదలిక మరియు ఉంచే క్రియల అర్థాలను పాదటిప్పణుల్లో తెరిచి ఉంచాం.
