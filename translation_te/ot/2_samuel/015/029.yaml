  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: te
  text: అప్పుడు సాదోకు, అబ్యాతారు దేవుని మందసాన్ని యెరూషలేముకు తిరిగి తీసుకువెళ్లి, అక్కడే ఉండిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: తిరిగి తీసుకువెళ్లి
  rationale: שׁוב అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ సకర్మకంగా, మందసాన్ని మళ్లీ యెరూషలేముకు తీసుకెళ్లడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְאֶבְיָתָר
  choice: అబ్యాతారు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; సంధానార్థం తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తమైంది.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసాన్ని
  rationale: మూలంలో ఉన్న ‘దేవుని మందసం’ అనే సంక్షిప్త పదబంధాన్నే నిలిపి, ఇక్కడ లేని ‘నిబంధన’ అనే పదాన్ని చేర్చలేదు.
- source_word: יְרוּשָׁלָם
  choice: యెరూషలేముకు
  rationale: క్రియలోనూ సందర్భంలోనూ అంతర్లీనంగా ఉన్న గమ్యార్థాన్ని తెలుగు విభక్తి ‘-కు’తో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడే ఉండిపోయారు
  rationale: ישׁב ఇక్కడ అక్కడ కొనసాగి ఉండడాన్ని సూచిస్తుంది. ‘ఉండిపోయారు’ ఆధునిక కథన తెలుగులో సహజంగా ఉండి, వారి నిరంతర ఉనికిని తెలియజేస్తుంది.
