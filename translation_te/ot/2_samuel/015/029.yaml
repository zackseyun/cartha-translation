  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వరుస చర్యలను ఒక ప్రవాహవంతమైన వాక్యంగా ఉంచాం; మూలంలో లేని ఒడంబడిక సంబంధిత వివరణను చేర్చలేదు.
