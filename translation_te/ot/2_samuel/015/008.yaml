source:
  edition: WLC
  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: te
  text: 'ఎందుకంటే, నీ సేవకుడనైన నేను అరాములోని గెషూరులో నివసిస్తున్నప్పుడు ఇలా మొక్కుకున్నాను[a]: “యాహ్వే నన్ను యెరూషలేముకు తప్పకుండా తిరిగి తీసుకొస్తే[b], నేను యాహ్వేను సేవిస్తాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మొక్కుబడి మొక్కుకున్నాను.” హీబ్రూలో ఒకే మూలానికి చెందిన పదాల పునరుక్తి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “తప్పకుండా తిరిగి తీసుకొస్తే” అనే హీబ్రూ వ్యక్తీకరణలో ‘తిరిగి తీసుకురావడం’ అనే క్రియ ఉద్ఘాటన కోసం పునరుక్తమైంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నేను యాహ్వేను ఆరాధిస్తాను.” ఇక్కడి హీబ్రూ క్రియ దేవునికి చేసే ఆరాధనాత్మక సేవను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: ఒక మొక్కుబడి చేసుకున్నాను
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన నామవాచకం, క్రియ కలసి వచ్చి మొక్కుబడిని బలంగా వ్యక్తం చేస్తున్నాయి. ఆధునిక తెలుగులో ‘ఒక మొక్కుబడి చేసుకున్నాను’ సహజంగా ఉంటుంది; మూలంలోని రూపాన్ని పాదసూచికలో చూపించాం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడనైన నేను
  rationale: రాజుతో మాట్లాడేటప్పుడు వినయపూర్వకంగా తనను తాను సూచించే ఆస్థాన ప్రయోగం ఇది. ‘నీ సేవకుడు’ అనే భావాన్ని నిలుపుతూ తెలుగు వాక్యంలో మొదటి పురుషంతో సహజంగా అనుసంధానించాం.
- source_word: בְּשִׁבְתִּי
  choice: నివసిస్తున్నప్పుడు
  rationale: ఈ నిర్మాణం మొక్కుబడి చేసిన కాలాన్ని, అక్కడ కొంతకాలం ఉండిన భావాన్ని సూచిస్తుంది.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: అరాములోని గెషూరులో
  rationale: గెషూరు అరాము ప్రాంతంలో ఉన్నదని తెలిపే స్థానసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: తప్పకుండా తిరిగి తీసుకొస్తే
  rationale: שוב క్రియ యొక్క పునరుక్తి షరతులో బలాన్ని కలిగిస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను, ‘తిరిగి తీసుకొస్తే’ స్థలానికి తిరిగి రప్పించే భావాన్ని నిలుపుతాయి.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణాధారిత రూపంగా ఇచ్చాం.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: నేను యాహ్వేను సేవిస్తాను
  rationale: עבד దేవునితో వాడినప్పుడు సేవనూ ఆరాధనాత్మక సేవనూ సూచించగలదు. ‘సేవిస్తాను’ విస్తృత భావాన్ని నిలుపుతుంది; ‘ఆరాధిస్తాను’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: యాహ్వేను ‘సేవించడం’ లేదా ‘ఆరాధించడం’
  choice: సేవిస్తాను
  alternative: ఆరాధిస్తాను
  rationale: עבד పదానికి దేవుని సందర్భంలో ఆరాధనాత్మక సేవ అనే భావం ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘సేవిస్తాను’ను ఉంచి, సంకుచితమైన సాధ్యార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. రాజును ఉద్దేశించిన వినయపూర్వక స్వీయసూచనను ‘నీ సేవకుడనైన నేను’గా నిలిపాం. మూలంలోని ఉద్ఘాటనను అతిశయింపకుండా ‘తప్పకుండా’తో వ్యక్తం చేశాం; సేవ/ఆరాధన మధ్యనున్న అర్థవ్యాప్తిని పాదసూచికలో సంరక్షించాం.
