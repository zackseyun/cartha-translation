  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: te
  text: అబ్షాలోము గిలోహువాడైన అహీతోఫెలును—దావీదు సలహాదారుని—అతని పట్టణమైన గిలోహు నుండి పిలిపించాడు[a]. అబ్షాలోము బలులు అర్పిస్తున్నప్పుడు, కుట్ర బలపడింది[b]; అబ్షాలోము పక్షాన చేరే ప్రజల సంఖ్య అంతకంతకు పెరిగింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహీతోఫెలును పంపించాడు.” సందర్భంలో ఈ క్రియ అతణ్ణి తిరుగుబాటులో చేరడానికి పిలిపించాడనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పన్నాగం బలపడింది.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “అబ్షాలోముతో ఉన్న ప్రజలు పోతూ, అధికమవుతూ ఉన్నారు”; అంటే అతనికి మద్దతు ఇచ్చేవారి సంఖ్య క్రమంగా పెరుగుతూ వచ్చింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పిలిపించాడు
  rationale: వ్యక్తిని ప్రత్యక్ష కర్మగా తీసుకున్న ఈ క్రియ, తిరుగుబాటులో చేరేందుకు అహీతోఫెలును రప్పించాడనే సందర్భార్థాన్ని సూచిస్తుంది; అయితే అక్షరార్థమైన ‘పంపించాడు’ అనే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַגִּלֹנִי
  choice: గిలోహీయుడైన
  rationale: గిలోహు ప్రాంతానికి చెందినవాడనే జాత్యర్థక/స్థలసంబంధ విశేషణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹעֵץ דָּוִד
  choice: దావీదు సలహాదారుని
  rationale: దావీదుతో అహీతోఫెలుకు ఉన్న రాజకీయ సలహాదారు సంబంధాన్ని స్పష్టంగా, ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: అతని సొంత పట్టణమైన గిలోహు నుండి
  rationale: ‘అతని పట్టణం’ మరియు ‘గిలోహు’ అనే రెండు మూలాంశాలను apposition రూపంలో సహజంగా కలుపుతుంది.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: అతడు బలులు అర్పిస్తున్న సమయంలో
  rationale: ఉపసర్గతో కూడిన infinitive construct సమకాలీన చర్యను సూచిస్తుంది. సర్వనామ సూచనలోని సాధ్యమైన సందిగ్ధతను పూర్తిగా తొలగించకుండా, సమీప పురుషుడైన అబ్షాలోమును సహజ సూచనగా ఉంచుతుంది.
- source_word: הַקֶּשֶׁר
  choice: కుట్ర
  rationale: అబ్షాలోము చేపట్టిన సమన్విత రాజకీయ తిరుగుబాటుకు తగిన పదం; ‘పన్నాగం’ కూడా సాధ్యమే.
- source_word: אַמִּץ
  choice: బలపడింది
  rationale: וַיְהִי తో కలిసి కుట్ర అభివృద్ధి చెందుతున్న స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הוֹלֵךְ וָרָב
  choice: అంతకంతకు పెరిగింది
  rationale: కొనసాగుతూ వృద్ధి చెందడాన్ని తెలిపే హెబ్రీయ నిర్మాణపు durative భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజల సంఖ్య
  rationale: అబ్షాలోముతో కలుస్తున్న సమూహం నిరంతరం పెరుగుతోందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ప్రజలు’ అనే మూల సమూహార్థాన్ని నిలుపుతుంది.
- source_word: אֶת אַבְשָׁלוֹם
  choice: అబ్షాలోము పక్షాన
  rationale: ఇక్కడ אֶת సహవాసం/అనుబంధాన్ని సూచిస్తుంది; రాజకీయ సందర్భంలో ‘పక్షాన’ అనేది ‘తో’ కంటే ఉద్దేశించిన మద్దతును సహజంగా వెల్లడిస్తుంది.
