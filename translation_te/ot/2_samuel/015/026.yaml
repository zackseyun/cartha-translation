  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: te
  text: కాని ఆయన, ‘నీ పట్ల నాకు ఆనందం లేదు’ అని చెబితే[a], ఇదిగో, నేను ఇక్కడ ఉన్నాను; ఆయన దృష్టికి ఏది మంచిదో అది ఆయన నాకు చేయుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పట్ల నాకు ఇష్టం లేదు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆయన కళ్లలో ఏది మంచిదో అది’; అంటే, ఆయనకు ఏది మంచిదిగా తోస్తుందో అది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... చెబితే
  rationale: ముందటి వచనంలోని ఆశాభావానికి భిన్నమైన అవకాశాన్ని చూపుతూ, షరతును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּה יֹאמַר
  choice: అని చెబితే
  rationale: כֹּה అనేది ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే אמרతో కూడిన ప్రయోగం; తెలుగులో ఉద్ధరణతో ‘అని చెబితే’ సహజంగా దాని భావాన్ని అందిస్తుంది.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: నీ పట్ల నాకు ఇష్టం లేదు
  rationale: חפץ ఇక్కడ ఒకరి పట్ల సంతోషం, అనుకూలత లేదా ఇష్టాన్ని సూచిస్తుంది. ఈ రూపం సంబంధాత్మకమైన, మూల్యాంకనాత్మకమైన భావాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను ఇక్కడ ఉన్నాను
  rationale: స్వయాన్ని సమర్పించుకోవడం, సిద్ధంగా ఉండడం సూచించే సూత్రప్రాయమైన పలుకును స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲשֶׂה לִּי
  choice: అదే నాకు చేయనివ్వండి
  rationale: ఈ రూపం దేవుని చర్యకు దావీదు ఇష్టపూర్వకంగా లోబడుతున్న అనుమతార్థక భావాన్ని తెలుగులో అందిస్తుంది.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: తన దృష్టికి ఏది మంచిదో అదే
  rationale: ‘అతని కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారంలోని దృష్టి-రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఆయనకు మంచిదిగా తోచినదనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఏకవచన తృతీయ పురుష సర్వనామాల సూచ్యుడు
  choice: సందర్భంలో యెహోవాను సూచించే ‘ఆయన/తన’ అనే సర్వనామాలను ఉంచడం
  alternative: సర్వనామాల స్థానంలో ‘యెహోవా’ అని స్పష్టంగా పునరుక్తి చేయడం
  rationale: హీబ్రూ పాఠం దేవుని పేరును మళ్లీ చెప్పకుండా ఏకవచన తృతీయ పురుష రూపాలను వాడుతుంది. ముందు వచనం వల్ల సూచ్యుడు స్పష్టంగా ఉన్నందున మూలంలోని రూపాన్ని నిలుపుతూ తెలుగులో గౌరవార్థక సర్వనామాలు ఉపయోగించబడ్డాయి.
- issue: దావీదు మాటల్లోని సమర్పణ స్వభావం
  choice: ‘చేయనివ్వండి’ ద్వారా దేవుని నిర్ణయానికి లోబడే భావాన్ని వ్యక్తం చేయడం
  alternative: ‘ఆయన నాకు చేయవచ్చు’ అని సామర్థ్యం లేదా సాధారణ అనుమతిగా అనువదించడం
  rationale: יַעֲשֶׂה ఇక్కడ కేవలం భవిష్యత్తు చర్యను కాక, ‘ఇదిగో నేను’ అన్న మాటతో కలసి ఇష్టపూర్వక సమర్పణను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజు దేవునికి తెలిపే గౌరవం మరియు సమర్పణకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ప్రత్యక్ష వాక్యం, షరతు, దృష్టి-నుడికారం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
