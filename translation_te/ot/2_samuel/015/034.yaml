id: 2SA.15.34
reference: 2 Samuel 15:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: te
  text: కాని నీవు పట్టణానికి తిరిగి వెళ్లి అబ్షాలోముతో, ‘రాజా, నేను నీ సేవకుడనై ఉంటాను. గతంలో నేను నీ తండ్రికి సేవకుడిగా ఉన్నట్లే, ఇప్పుడు నేను నీ సేవకుడను’ అని చెబితే, నాకోసం అహీతోఫేలు సలహాను నీవు భగ్నం చేస్తావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: కాని ... చెబితే
  rationale: సందర్భంలోని వ్యతిరేకతను ‘కాని’తో, షరతును ‘చెబితే’తో సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: הָעִיר
  choice: పట్టణానికి
  rationale: నిర్దిష్టమైన యెరూషలేము పట్టణాన్ని సందర్భం స్పష్టం చేస్తుంది; మూలంలోని సాధారణ నామవాచక రూపాన్ని నిలిపింది.
- source_word: עֶבֶד / עַבְדְּךָ
  choice: సేవకుడు / నీ సేవకుడు
  rationale: రాజసభా విధేయతను సూచించే పదానికి ఆధునిక, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: וְהֵפַרְתָּ
  choice: భగ్నం చేయగలవు
  rationale: హిఫీల్ రూపంలోని ‘విఫలం చేయడం, చెడగొట్టడం’ అనే భావాన్ని సందర్భానుసారంగా తెలిపింది.
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: అహీతోఫెలు ఇచ్చే ఆలోచనను
  rationale: עֵצָה అనే పదంలోని సలహా/యోచన భావాన్ని సహజంగా తెలిపి, ఇది రాబోయే వ్యూహాత్మక సలహా అని సందర్భానుగుణంగా సూచించింది.
theological_decisions:
- issue: హూషై పలకవలసిన విధేయతా ప్రకటనలోని ఉద్దేశపూర్వక ద్వంద్వార్థం
  choice: ‘గతంలో నేను నీ తండ్రికి సేవకుడిగా ఉన్నట్లే, ఇప్పుడు నీకు సేవకుడిగా ఉంటాను’ అని ప్రత్యక్షంగా నిలిపింది
  alternative: అతడు నిజంగా అబ్షాలోముకు విధేయుడవుతున్నట్లు వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని రాజకీయ మాయోపాయం మరియు ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: ‘నాకోసం’ అనే దావీదు ప్రయోజన సూచన
  choice: నాకోసం
  alternative: నా పక్షాన
  rationale: לִי యొక్క సంక్షిప్తతను కాపాడుతూ, దావీదు ప్రయోజనార్థమైన చర్య అని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా సందర్భానికి తగిన గౌరవప్రదమైన, కానీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని షరతు, కాలసంబంధ సమాంతరత, రాజకీయ ద్వంద్వార్థం నిలిపివేయబడ్డాయి.
