  yaml_path: translation/ot/2_samuel/015/022.yaml
  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: te
  text: అప్పుడు దావీదు ఇత్తయితో, “వెళ్లు, దాటి వెళ్లు” అన్నాడు. అప్పుడు గిత్తీయుడైన ఇత్తయి, తన మనుషులందరితోనూ తనతో ఉన్న చిన్నపిల్లలందరితోనూ కలిసి దాటి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: వెళ్లు, దాటి వెళ్లు
  rationale: రెండు హీబ్రూ ఆజ్ఞారూపాలనూ నిలుపుతూ, ప్రయాణాన్ని కొనసాగించి దాటాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַגִּתִּי
  choice: గిత్తీయుడైన
  rationale: గాతు పట్టణానికి చెందినవాడనే జాతి/స్థల సంబంధ విశేషణాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: אֲנָשָׁיו
  choice: తన మనుషులందరితోనూ
  rationale: ఇక్కడ ‘మనుషులు’ అనేది ఇత్తయితో ఉన్న అతని అనుచరులు లేదా సైనికులను సూచిస్తుంది; మూలంలోని సాధారణ పదాన్ని అలాగే ఉంచుతుంది.
- source_word: הַטַּף
  choice: చిన్నపిల్లలందరితోనూ
  rationale: ఈ సందర్భంలో ఆధారపడిన చిన్నవారిని సూచించే పదానికి సహజమైన అర్థం; మూలంలోని సమూహార్థాన్ని ‘అందరూ’ ద్వారా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియలు మరియు ‘అందరూ’ అనే సమగ్ర భావం నిలుపబడ్డాయి.
