  terminology: ‘గిత్తీయుడైన’ అనేది הַגִּתִּיకు సరైన స్థల-సంబంధ విశేషణం. ‘చిన్నపిల్లలు’ అనేది הַטַּףకు ఈ సందర్భంలో సహజమైన, అర్థవంతమైన అనువాదం; అనవసరమైన వివరణను చేర్చదు.
