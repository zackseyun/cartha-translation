  source_fidelity: హీబ్రూ మూలంలోని రెండు ఆజ్ఞారూపాలు ("వెళ్లు"; "దాటి వెళ్లు"), ఇత్తయి గిత్తీయుడనే గుర్తింపు, అతని మనుషులందరూ మరియు అతనితో ఉన్న చిన్నపిల్లలందరూ దాటివెళ్లడం—అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. మూలంలోని సాధారణమైన אֲנָשָׁיוకు ‘తన మనుషులు’ అనువాదం తగినదే.
