  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יַּ֤עַשׂ ל/וֹ֙ אַבְשָׁל֔וֹם מֶרְכָּבָ֖ה וְ/סֻסִ֑ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: te
  text: ఆ తర్వాత అబ్షాలోము తన కోసం ఒక రథాన్ని, గుర్రాలను సమకూర్చుకున్నాడు[a], అతని ముందు పరుగెత్తే యాభై మందిని పెట్టుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమకూర్చుకున్నాడు” అని అనువదించిన హీబ్రూ వ్యక్తీకరణను “తన కోసం చేసుకున్నాడు” లేదా “తన కోసం ఏర్పాటు చేసుకున్నాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఒక ప్రముఖుని రథం ముందు పరుగెత్తే ఇలాంటి పరివారం రాజరిక వైభవాన్ని ప్రదర్శించేది. ఇక్కడ అది అబ్షాలోము తనను బహిరంగంగా ఉన్నతపరచుకుంటున్నాడనే సంకేతాన్ని ఇస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ לוֹ
  choice: తన కోసం ... సమకూర్చుకున్నాడు
  rationale: עָשָׂה + לוֹ ఇక్కడ స్వయంగా తయారుచేయడం లేదా తన కోసం సంపాదించి ఏర్పాటు చేసుకోవడం అనే అర్థాలను అనుమతిస్తుంది. రథం, గుర్రాల సందర్భంలో ‘సమకూర్చుకున్నాడు’ సహజంగా ఉండి స్వార్థక భావాన్ని కాపాడుతుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ పేరుకు సమీపంగా, తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: ఒక రథాన్ని, గుర్రాలను
  rationale: వస్తువులను నేరుగా వర్ణిస్తూ, హీబ్రూ జాబితా నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘రాజరథం’ అని వ్యాఖ్యానాన్ని మూలపాఠ్యంలో చేర్చదు.
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: అతని ముందు పరుగెత్తడానికి యాభై మందిని కూడా పెట్టుకున్నాడు
  rationale: ఈ పురుషుల నియమిత పని అబ్షాలోము ముందు పరుగెత్తడమేనని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; హీబ్రూ క్రియావిశేషణాత్మక రూపంలోని నిరంతర పాత్రభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అబ్షాలోము పరివారం సూచించే రాజరిక ఆకాంక్ష
  choice: ప్రధాన పాఠ్యంలో రథం, గుర్రాలు, ముందు పరుగెత్తే యాభై మంది అనే వివరాలను మాత్రమే అనువదించడం
  alternative: అబ్షాలోము తన కోసం రాజోచిత ఊరేగింపును ఏర్పాటు చేసుకున్నాడు
  rationale: రాజరిక ప్రదర్శన, స్వీయ ఉన్నతి అనే భావం సందర్భంలో సూచితమైనప్పటికీ, హీబ్రూ వాక్యం దానిని ప్రత్యక్షంగా ప్రకటించదు. అందువల్ల వ్యాఖ్యానాన్ని పాఠ్యంలో కాకుండా గమనికలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రెండో వాక్యంగా విభజించడం ద్వారా జాబితా భారాన్ని తగ్గించి, ముందు పరుగెత్తే యాభై మంది పాత్రను స్పష్టంచేశారు. మూలంలోని రాజకీయ సూచనను ప్రధాన పాఠ్యంలో అతిగా వివరించలేదు.
