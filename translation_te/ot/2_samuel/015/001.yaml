revisions:
- from: ఆ తర్వాత అబ్షాలోము తన కోసం ఒక రథాన్ని, గుర్రాలను సమకూర్చుకున్నాడు[a]. అతని ముందు పరుగెత్తడానికి యాభై మందిని కూడా పెట్టుకున్నాడు[b].
  to: ఆ తర్వాత అబ్షాలోము తన కోసం ఒక రథాన్ని, గుర్రాలను సమకూర్చుకున్నాడు[a], అతని ముందు పరుగెత్తే యాభై మందిని పెట్టుకున్నాడు[b].
  rationale: The revision retains the draft’s sound contextual choice “సమకూర్చుకున్నాడు,” while rendering רָצִים with the Telugu participle “పరుగెత్తే.” It also corrects the lexical note’s formulation and removes an unwarranted causative alternative. The cultural note remains appropriately anchored to the fifty runners and leaves the political implication out of the main text.
