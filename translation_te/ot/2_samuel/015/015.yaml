translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభకు తగిన గౌరవభావాన్ని ఉంచుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ప్రధాన పాఠ్యంలో భావస్పష్టత కోసం ‘చేయడానికి’ మరియు ‘సిద్ధంగా ఉన్నాం’ సందర్భానుగుణంగా వ్యక్తీకరించబడ్డాయి; పాదసూచికలో సంక్షిప్త హెబ్రీయ రూపం భద్రపరచబడింది.
