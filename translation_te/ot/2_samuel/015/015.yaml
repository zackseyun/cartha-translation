source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ עַבְדֵֽי הַ/מֶּ֖לֶךְ אֶל הַ/מֶּ֑לֶךְ כְּ/כֹ֧ל אֲשֶׁר יִבְחַ֛ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הִנֵּ֥ה עֲבָדֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/015.yaml
  text: The king’s servants said to the king[a], “Whatever my lord the king chooses, here are your servants.”
translation:
  language: te
  text: రాజు సేవకులు రాజుతో, “నా ప్రభువైన రాజు ఏది ఎంచుకున్నా, ఇదిగో, మేము మీ సేవకులం” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నా ప్రభువైన రాజు ఎంచుకునే ప్రతిదానికీ అనుగుణంగా—ఇదిగో, మీ సేవకులు.”'
    reason: హెబ్రీయ כְּכֹל אֲשֶׁר (“ఎంచుకునే ప్రతిదానికీ అనుగుణంగా”) అనే నిర్మాణాన్నీ, הִנֵּה (“ఇదిగో”)తో కూడిన సంక్షిప్త స్వీయ-సమర్పణను చూపిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: אמר యొక్క సాధారణ కథన ప్రయోగాన్ని సహజమైన తెలుగు భూతకాల క్రియగా అనువదించింది.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: రాజు సేవకులు
  rationale: రాజసభ సందర్భంలో עבד రాజుకు లోబడిన సేవకులు లేదా పరివారాన్ని సూచిస్తుంది; ‘సేవకులు’ అనేది దాస్యస్థితిని అనవసరంగా ముందుకు తేకుండా సందర్భానికి సరిపోతుంది.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజుతో
  rationale: మాట్లాడబడిన వ్యక్తిని తెలుగులో సహజంగా ‘రాజుతో ... అన్నారు’ అనే నిర్మాణంతో తెలిపింది.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: ఏది కోరుకుంటే అది చేయడానికి
  rationale: అక్షరార్థంగా ‘ఎంచుకునే ప్రతిదాని ప్రకారం’ అనే హెబ్రీయ ప్రయోగం; సందర్భంలో రాజు కోరుకున్న కార్యమంతటికీ లోబడే సంసిద్ధతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִבְחַר
  choice: కోరుకుంటే
  rationale: בחר యొక్క మూలభావం ‘ఎంచుకొను’; ఇక్కడ రాజు ఎంచుకునే కార్యమార్గాన్ని సూచిస్తున్నందున ‘కోరుకుంటే’ సహజంగా ఉంది, అయితే ‘ఎంచుకుంటే’ అనే మరింత రూపసన్నిహిత పఠనాన్ని పాదసూచికలో నిలిపింది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజును ఉద్దేశించిన గౌరవపూర్వక రాజసభ సంబోధనను ఆధునిక, గంభీర తెలుగులో కాపాడుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సమర్పణ, తక్షణ సమక్షతను సూచించే הִנֵּה యొక్క బలాన్ని నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులమైన మేము సిద్ధంగా ఉన్నాం
  rationale: ‘మీ సేవకులు ఇదిగో’ అనే సంక్షిప్త హెబ్రీయ వాక్యం వ్యక్తం చేసే తక్షణ లభ్యతను తెలుగులో స్పష్టంగా చెబుతూ, עבד పదపునరుక్తిని ‘సేవకులు’తో నిలుపుతుంది.
