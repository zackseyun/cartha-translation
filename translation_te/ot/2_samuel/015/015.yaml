- from: రాజు సేవకులు రాజుతో, “నా ప్రభువైన రాజు ఏది కోరుకుంటే అది చేయడానికి, ఇదిగో, మీ సేవకులమైన మేము సిద్ధంగా ఉన్నాం” అన్నారు.[a]
  to: రాజు సేవకులు రాజుతో, “నా ప్రభువైన రాజు ఏది ఎంచుకున్నా, ఇదిగో, మేము మీ సేవకులం” అన్నారు.[a]
  rationale: The revision removes interpretive additions while retaining the source’s deferential, comprehensive pledge of service. It also renders בחר with “ఎంచు,” preserves the repeated “సేవకులు,” and keeps the footnote anchor and a source-near alternative.
