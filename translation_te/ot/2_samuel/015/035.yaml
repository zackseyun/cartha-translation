base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: te
  text: “యాజకులైన సాదోకు, అబ్యాతారు అక్కడ నీతో ఉన్నారు కదా? రాజభవనం నుండి నీవు వినే ప్రతి సంగతినీ యాజకులైన సాదోకుకు, అబ్యాతారుకు తెలియజేయాలి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: ఉన్నారు కదా?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించని అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: సాదోకు, అబ్యాతారు ఇద్దరినీ వివరించే బహువచన పదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כָּל־הַדָּבָר
  choice: ప్రతి సంగతి
  rationale: దావీదు కోరుతున్న సమాచారంలోని ప్రతి విషయాన్ని సూచిస్తుంది; కేవలం వినబడిన మాటలుగా పరిమితం చేయదు.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: రాజభవనంలో
  rationale: అక్షరార్థంగా ‘రాజు ఇంటి నుండి’; సందర్భంలో రాజు పరిపాలనా గృహంలో వినే సమాచారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּגִּיד
  choice: తెలియజేయాలి
  rationale: ఆజ్ఞార్థక భావమున్న అసంపూర్ణ క్రియను తెలుగులో స్పష్టమైన నిర్దేశంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ వాక్యంలోని అలంకార ప్రశ్నను, సమాచారాన్ని యాజకులకు చేరవేయాలనే నిర్దేశాన్ని నిలుపుకుంది.
