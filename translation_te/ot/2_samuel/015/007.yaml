  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: te
  text: నలభై సంవత్సరాలు[a] గడిచిన తరువాత, అబ్షాలోము రాజుతో, “నేను హెబ్రోనులో యెహోవాకు మొక్కుకున్న మొక్కుబడిని చెల్లించడానికి దయచేసి నన్ను వెళ్లనివ్వండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన అనువాద సాక్ష్యాలు “నాలుగు సంవత్సరాలు” అని చదువుతాయి; హీబ్రూ పాఠం “నలభై సంవత్సరాలు” అని ఉంది.
    reason: హీబ్రూ పాఠంలోని సంఖ్య కథాక్రమపరంగా కఠినమైనది; ముఖ్యమైన ప్రాచీన పాఠాంతరాన్ని పాఠకునికి తెలియజేస్తూ మూలపాఠాన్ని ప్రధాన వచనంలో కాపాడుతుంది.
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు గడిచిన తరువాత
  rationale: కాలవ్యవధి ముగింపును సూచించే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשַׁלֵּם אֶת נִדְרִי
  choice: నా మొక్కుబడిని చెల్లించడానికి
  rationale: שלם అనే క్రియకు ఇక్కడ మొక్కుబడిని నెరవేర్చడం/చెల్లించడం అనే భావం ఉంది; మూలంలోని ‘చెల్లించు’ రూపకాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో సూచిస్తుంది.
- source_word: אֵלֲכָה נָּא
  choice: దయచేసి నన్ను వెళ్లనివ్వండి
  rationale: ఆజ్ఞార్థక అభ్యర్థనలోని మర్యాదను సహజమైన తెలుగు సంభాషణలో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘నలభై సంవత్సరాలు’ అనే పాఠాంతరం
  choice: ప్రామాణిక WLC పాఠాన్ని అనుసరించి ‘నలభై సంవత్సరాలు’ను ప్రధాన పాఠంలో ఉంచడం
  alternative: కొన్ని ప్రాచీన సాక్ష్యాలు మరియు పాఠసవరణ ప్రతిపాదనల ఆధారంగా ‘నాలుగు సంవత్సరాలు’
  rationale: అందించిన మూలపాఠం స్పష్టంగా אַרְבָּעִים (‘నలభై’) అని చదువుతుంది. కథాక్రమ సమస్యను అనువాదంలో నిశ్శబ్దంగా సవరించకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. అబ్షాలోము, హెబ్రోను వంటి సంప్రదాయ బైబిలు పేరురూపాలు ఉపయోగించబడ్డాయి.
