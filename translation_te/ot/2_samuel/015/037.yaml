  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని క్రియారూప భేదం సూచించే సమకాలీనతను ప్రధాన పాఠంలో ఉంచి, సాధారణ క్రమానుసార పఠనాన్ని పాదసూచికలో ఇచ్చాం.
