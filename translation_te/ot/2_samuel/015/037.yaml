  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: te
  text: దావీదు స్నేహితుడైన హూషై పట్టణంలోకి వచ్చాడు; అబ్షాలోము యెరూషలేములోకి ప్రవేశిస్తున్నప్పుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అబ్షాలోము యెరూషలేములోకి వచ్చాడు.” హీబ్రూలోని అనుసంధాన పదాన్ని సాధారణమైన “మరియు” అనే క్రమానుసార భావంలోనూ తీసుకోవచ్చు; క్రియను సాధారణ భూతకాలంగానూ అనువదించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే క్రియకు ‘రావడం’ లేదా ‘ప్రవేశించడం’ అనే అర్థాలు ఉన్నాయి. ‘పట్టణానికి వచ్చాడు’ అనేది గమ్యస్థానంవైపు కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חוּשַׁי
  choice: హూషై
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: רֵעֶה דָוִד
  choice: దావీదు స్నేహితుడైన
  rationale: רֵעֶה అంటే స్నేహితుడు, సహచరుడు లేదా సన్నిహితుడు కావచ్చు. సందర్భం స్పష్టంగా అధికారిక సలహాదారు అనే పదవిని చెప్పనందున నేరుగా ‘స్నేహితుడు’ అని అనువదించాం.
- source_word: הָעִיר
  choice: పట్టణానికి
  rationale: మూలంలో ఉన్న సాధారణ నామవాచకమైన ‘పట్టణం’ను నిలిపాం; సందర్భం యెరూషలేమును సూచించినా, ఇక్కడ దాని పేరుతో భర్తీ చేయలేదు.
- source_word: וְאַבְשָׁלֹם יָבֹא
  choice: అదే సమయంలో అబ్షాలోము … ప్రవేశిస్తున్నాడు
  rationale: ముందటి wayyiqtol తరువాత వచ్చిన yiqtol రూపం నేపథ్యంగా సాగుతున్న లేదా సమకాలీన చర్యను సూచించగలదు. అందువల్ల రెండు రాకల మధ్య కాలసామీప్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
