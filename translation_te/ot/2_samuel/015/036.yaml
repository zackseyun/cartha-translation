id: 2SA.15.36
reference: 2 Samuel 15:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּה שָׁ֤ם עִמָּ/ם֙ שְׁנֵ֣י בְנֵי/הֶ֔ם אֲחִימַ֣עַץ לְ/צָד֔וֹק וִ/יהוֹנָתָ֖ן לְ/אֶבְיָתָ֑ר וּ/שְׁלַחְתֶּ֤ם בְּ/יָדָ/ם֙ אֵלַ֔/י כָּל דָּבָ֖ר אֲשֶׁ֥ר תִּשְׁמָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: te
  text: ఇదిగో, వారితోపాటు వారి ఇద్దరు కుమారులు అక్కడ ఉన్నారు—సాదోకు కుమారుడు అహీమయసు, అబ్యాతారు కుమారుడు యోనాతాను. మీరు వినే ప్రతి విషయాన్నీ[a] వారి ద్వారా[b] నాకు పంపండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీరు వినే ప్రతిదాన్నీ’ లేదా ‘మీరు వినే ప్రతి సమాచారాన్నీ.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వారి చేతి ద్వారా’; ఇది వారి ద్వారా పంపడం అనే భావమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని బలంగా ఆకర్షించే హీబ్రూ సూచనార్థక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: שָׁם עִמָּם
  choice: వారితోపాటు ... అక్కడ ఉన్నారు
  rationale: కుమారులు ఆ ఇద్దరు యాజకులతో అదే చోట ఉన్నారని తెలిపే స్థలార్థం, సహవాసార్థం రెండింటినీ నిలుపుతుంది.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: వారి ఇద్దరు కుమారులు
  rationale: ఇది సాదోకు, అబ్యాతారు అనే ఇద్దరి కుమారులను సూచించే సరళమైన సంబంధవాచక నిర్మాణం.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: సాదోకు కుమారుడు అహీమయస్సు, అబ్యాతారు కుమారుడు యోనాతాను
  rationale: ముందున్న ‘వారి ఇద్దరు కుమారులు’ అనే మాటల దృష్ట్యా לְ ఇక్కడ కుమార సంబంధాన్ని సూచిస్తుంది; తెలుగులో అస్పష్టత లేకుండా సహజంగా వ్యక్తం చేయబడింది.
- source_word: וּשְׁלַחְתֶּם
  choice: పంపండి
  rationale: ఈ సందర్భంలో క్రియ ఆజ్ఞాత్మక భావాన్ని కలిగి ఉంది; తెలుగు గౌరవ బహువచన ఆజ్ఞ దాని నిర్దేశక స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּיָדָם
  choice: వారి ద్వారా
  rationale: అక్షరార్థంగా ‘వారి చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం వ్యక్తుల ద్వారా సమాచారాన్ని చేరవేయడాన్ని సూచిస్తుంది.
- source_word: כָּל דָּבָר
  choice: ప్రతి విషయాన్నీ
  rationale: דָּבָר అనే పదంలోని ‘మాట/విషయం/సమాచారం’ అనే విస్తృత భావాన్ని ‘విషయం’ నిలుపుతుంది; సందర్భంలో విన్న సమాచారమంతా ఉద్దేశించబడింది.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: మీరు వినే
  rationale: שׁמע యొక్క ప్రత్యక్ష శ్రవణార్థాన్ని నిలుపుతూ, వారు తెలుసుకునే సమాచారాన్ని సందర్భానుసారంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పేర్లను సాధారణ తెలుగు బైబిల్ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. హీబ్రూ నుడికారాన్ని ప్రధాన వాక్యంలో సహజంగా అనువదించి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
