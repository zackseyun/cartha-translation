source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אַבְשָׁלוֹם֙ מְרַגְּלִ֔ים בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּ/שָׁמְעֲ/כֶם֙ אֶת ק֣וֹל הַ/שֹּׁפָ֔ר וַ/אֲמַרְתֶּ֕ם מָלַ֥ךְ אַבְשָׁל֖וֹם בְּ/חֶבְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: te
  text: అప్పుడు అబ్షాలోము ఇశ్రాయేలు గోత్రాలన్నిటిలో గూఢచారులను పంపి, “మీరు బూర శబ్దం వినగానే, ‘అబ్షాలోము హెబ్రోనులో రాజయ్యాడు’ అని చెప్పండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: రహస్య దూతలను
  rationale: ఈ పదానికి సాధారణ అర్థం ‘గూఢచారులు’; అయితే ఇక్కడ వారు సమాచారం సేకరించేవారిగా కాక, ముందుగా నిర్ణయించిన సంకేతం అందగానే ప్రకటన చేసే రహస్య ప్రతినిధులుగా పనిచేస్తున్నారు. సందర్భానుసారంగా ‘రహస్య దూతలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כְּשָׁמְעֲכֶם
  choice: మీరు ... వినగానే
  rationale: כְּ ఉపసర్గతో వచ్చిన infinitive construct ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది; ‘విన్నప్పుడు’ కంటే ‘వినగానే’ ఆ సంకేతం వెంటనే అనుసరించాల్సిన చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קוֹל הַשֹּׁפָר
  choice: బూర శబ్దం
  rationale: שׁוֹפָר అనేది కొమ్ముతో చేసిన సంకేత వాద్యం. తెలుగు బైబిల్ వాడుకలో పరిచితమైన ‘బూర’ను ఉంచడం ద్వారా సంకేతార్థం స్పష్టమవుతుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: Qal perfect క్రియను ‘రాజుగా అయ్యాడు/రాజయ్యాడు’ అనే రాజ్యాధికార స్వీకరణ భావంతో అనువదించాం; ‘పాలిస్తున్నాడు’ అని వర్తమాన స్థితిగా మాత్రమే మార్చలేదు.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ అనే స్థానసూచక ఉపసర్గను నేరుగా ‘లో’గా అనువదించాం; ప్రకటనలో రాజ్యాధికార స్వీకరణ జరిగిన కేంద్రాన్ని సూచిస్తుంది.
theological_decisions:
- issue: మָלַךְ అనే ప్రకటనలో రాజ్యాధికార భావం
  choice: ‘అబ్షాలోము హెబ్రోనులో రాజయ్యాడు’
  alternative: ‘అబ్షాలోము హెబ్రోనులో రాజుగా పాలిస్తున్నాడు’
  rationale: హీబ్రూ perfect రూపం ఇక్కడ అబ్షాలోము రాజ్యాన్ని స్వీకరించాడనే ప్రకటనకు అనుకూలంగా ఉంది. అతని హక్కును సమర్థించేలా లేదా తిరస్కరించేలా అదనపు వ్యాఖ్యానం చేర్చకుండా కథనంలోని రాజకీయ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ఆజ్ఞాత్మక ప్రకటనను స్పష్టంగా ఉంచి, సందర్భాన్ని మించి వివరణాత్మక పదాలు చేర్చలేదు.
