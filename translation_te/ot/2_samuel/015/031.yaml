source:
  edition: WLC
  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: te
  text: 'దావీదుకు ఇలా తెలియజేయబడింది: “అహీతోఫెలు అబ్షాలోముతో కలిసి కుట్రదారుల్లో ఉన్నాడు.” అప్పుడు దావీదు, “యెహోవా, దయచేసి అహీతోఫెలు సలహాను మూర్ఖమైనదిగా చేయుము[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహీతోఫెలు సలహాను భగ్నం చేయుము.” హీబ్రూలో మరింత అక్షరార్థంగా, అతని సలహాను మూర్ఖమైనదిగా చేయమని కోరుతున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: తెలియజేయబడింది
  rationale: నגד హిఫిల్ రూపం ‘తెలియజేయు, నివేదించు’ అనే అర్థం ఇస్తుంది. కర్తను మూలపాఠం పేర్కొననందున, తెలుగులో సహజమైన కర్మణి ప్రయోగాన్ని వాడాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: హీబ్రూ ఉద్ధరణ సూత్రాన్ని తెలుగులో సహజంగా పరిచయం చేయడానికి ‘ఇలా’ అని అనువదించాం; విడిగా ‘అంటూ’ అని పెట్టడం ఇక్కడ భారంగా ఉంటుంది.
- source_word: בַּקֹּשְׁרִים
  choice: కుట్రదారుల్లో
  rationale: బహువచన రూపం కుట్రలో భాగమైన వ్యక్తుల సమూహాన్ని సూచిస్తుంది; అందువల్ల ‘కుట్రలో’ కంటే ‘కుట్రదారుల్లో’ రూపానికి ప్రాధాన్యం ఇచ్చాం.
- source_word: עִם
  choice: తో కలిసి
  rationale: అబ్షాలోముతో ఉన్న అనుబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: סַכֶּל
  choice: మూర్ఖత్వంగా మార్చు
  rationale: పియేల్ ఆజ్ఞారూపం సలహాను మూర్ఖమైనదిగా లేదా ఫలించనిదిగా చేయమనే విన్నపం. ప్రధాన పాఠంలో ‘మూర్ఖత్వం’ అనే మూలార్థాన్ని నిలిపి, ఫలితార్థమైన ‘భగ్నం చేయి’ని పాదసూచికలో ఇచ్చాం.
- source_word: נָא
  choice: దయచేసి
  rationale: ప్రార్థనలోని విన్నపం మరియు వేడుకోలు ధోరణిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֲצַת
  choice: సలహాను
  rationale: రాజకీయ, వ్యూహాత్మక సందర్భంలోని counsel/advice భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేసే పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: ప్రత్యక్ష సంబోధనలో יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువా
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగా ఉంచాం.
- issue: దావీదు ప్రార్థనలో సలహా ‘మూర్ఖత్వం’ కావడం
  choice: మూర్ఖత్వంగా మార్చు
  alternative: సలహాను భగ్నం చేయి
  rationale: మూలంలోని పదప్రయోగం సలహాను మూర్ఖమైనదిగా చేయాలని నేరుగా కోరుతుంది; అది విఫలం కావాలనే భావం సాధ్యమైన ఫలితార్థం అయినప్పటికీ, ప్రధాన పాఠంలో ఆ భావాన్ని మాత్రమే పెట్టి మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. పేర్లను సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా ఉంచాం. కర్తను మూలం పేర్కొనని నివేదిక సూత్రాన్ని కర్మణి రూపంలో నిలిపాం.
