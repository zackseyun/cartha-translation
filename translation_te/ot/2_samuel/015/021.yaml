revisions:
- from: 'అప్పుడు ఇత్తయి రాజుకు ఇలా జవాబిచ్చాడు: “యెహోవా జీవిస్తున్నంత నిశ్చయంగా, నా ప్రభువైన రాజు జీవిస్తున్నంత నిశ్చయంగా నేను ప్రమాణం చేస్తున్నాను[a]: నా ప్రభువైన రాజు ఎక్కడ ఉంటే అక్కడే—చావైనా బతుకైనా[b]—మీ సేవకుడైన నేనూ ఉంటాను.”'
  to: 'అప్పుడు ఇత్తయి రాజుకు జవాబిచ్చి ఇలా అన్నాడు: “యాహ్వే జీవించి ఉన్నట్టుగా, నా ప్రభువైన రాజు జీవించి ఉన్నట్టుగా[a], నిశ్చయంగా నా ప్రభువైన రాజు ఎక్కడ ఉంటారో అక్కడే—మరణమైనా జీవమైనా[b]—మీ సేవకుడైన నేను ఉంటాను.”'
  rationale: సవరణ మూలంలోని ప్రమాణసూత్రాన్ని దానికి అనవసరమైన స్వతంత్ర ప్రమాణక్రియను జోడించకుండా నిలుపుతుంది; יהוהకు ప్రాజెక్టు-నిర్దేశిత “యాహ్వే” రూపాన్ని వాడుతుంది; అలాగే మరణం/జీవితం జంటకు గంభీరమైన ఆధునిక ప్రామాణిక తెలుగు రూపాన్ని ఇస్తుంది. రెండు పాదాల సమాంతరత, రాజుకు గౌరవసంబోధన, మరియు “అక్కడే” అనే సంపూర్ణ నిబద్ధత యథాతథంగా నిలిచాయి.
