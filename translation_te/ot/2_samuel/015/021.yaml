id: 2SA.15.21
reference: 2 Samuel 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: te
  text: 'అప్పుడు ఇత్తయి రాజుకు జవాబిచ్చి ఇలా అన్నాడు: “యాహ్వే జీవించి ఉన్నట్టుగా, నా ప్రభువైన రాజు జీవించి ఉన్నట్టుగా[a], నిశ్చయంగా నా ప్రభువైన రాజు ఎక్కడ ఉంటారో అక్కడే—మరణమైనా జీవమైనా[b]—మీ సేవకుడైన నేను ఉంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది గంభీరమైన ప్రమాణ సూత్రం; అక్షరార్థంగా, “యాహ్వే జీవించి ఉన్నట్టుగా, నా ప్రభువైన రాజు జీవించి ఉన్నట్టుగా.”
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “మరణానికైనా జీవానికైనా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: అప్పుడు ఇత్తయి రాజుకు ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: యెహోవా జీవిస్తున్నంత నిశ్చయంగా, నా ప్రభువైన రాజు జీవిస్తున్నంత నిశ్చయంగా నేను ప్రమాణం చేస్తున్నాను
  rationale: ఇది ప్రమాణ సూత్రమని పాఠకునికి స్పష్టమయ్యేలా చేస్తూనే, రెండు సమాంతర ‘జీవిస్తున్నంత నిశ్చయంగా’ పదబంధాలను నిలుపుతుంది; יהוהను వ్యక్తినామంగా ‘యెహోవా’ అని లిప్యంతరీకరించింది.
- source_word: כִּי אִם
  choice: నిశ్చయంగా / నేను ప్రమాణం చేస్తున్నాను
  rationale: ప్రమాణ సందర్భంలో ఇది షరతును కాక బలమైన నిశ్చయాన్ని సూచిస్తుంది; తెలుగులో ప్రమాణ బలాన్ని సహజంగా వ్యక్తం చేయడానికి ప్రమాణ క్రియను స్పష్టీకరించింది.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు ఎక్కడ ఉంటే అక్కడే
  rationale: స్థలాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సహసంబంధ వాక్యరూపంలో అందిస్తుంది.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: చావైనా బతుకైనా
  rationale: మరణమో జీవమో అనే సంపూర్ణ నిబద్ధతను సామాన్యులకు స్పష్టమైన, గంభీరతను కోల్పోని తెలుగు జంటపదాలతో వ్యక్తం చేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: మీ సేవకుడైన నేను
  rationale: రాజు ఎదుట వినయపూర్వక స్వీయసూచనను వ్యక్తం చేస్తుంది; ఈ సందర్భంలో బానిసత్వ స్థితిని ప్రధానంగా సూచించనందున ‘సేవకుడు’ సముచితం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలిపింది. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: రాజు జీవితం ఆధారంగా చేసిన సమాంతర ప్రమాణం
  choice: రెండు భాగాలనూ ప్రమాణ సూత్రంగా నిలుపడం
  alternative: ‘యెహోవా సాక్షిగా’ అని ఒక్క భాగాన్ని మాత్రమే స్వేచ్ఛగా మార్చడం
  rationale: దేవుని జీవితం మరియు రాజు జీవితం ప్రస్తావించే మూలంలోని అసౌకర్యకరమైనా నిజమైన సమాంతరతను తొలగించకుండా నిలుపుతుంది; వాటి తాత్త్విక స్థాయులు సమానమని అదనంగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభ సంభాషణకు తగిన గౌరవభావం నిలిపింది. ‘నా ప్రభువైన రాజు,’ ‘మీ సేవకుడు’ అనే రూపాలు ఇత్తయి వినయాన్ని కాపాడుతాయి. ప్రమాణంలోని సమాంతర నిర్మాణం మరియు ‘చావైనా బతుకైనా’ అనే సంపూర్ణ నిబద్ధత స్పష్టంగా నిలిచాయి.
