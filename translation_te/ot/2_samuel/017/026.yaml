translation:
  language: te
  text: ఇశ్రాయేలువారూ అబ్షాలోమూ గిలాదుదేశంలో మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַן
  choice: మకాం వేశారు
  rationale: חנה అనే క్రియ ఇక్కడ సైనిక సందర్భంలో శిబిరం ఏర్పాటు చేసి నిలవడాన్ని సూచిస్తుంది. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వారు
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ అనేది అబ్షాలోము పక్షాన ఉన్న ఇశ్రాయేలు సైన్యాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో వ్యక్తి పేరుగా అపార్థం కాకుండా ‘వారు’ చేర్చబడింది; అయినా మూలంలోని జాతీయ నామం నిలుపబడింది.
- source_word: וְאַבְשָׁלֹם
  choice: అబ్షాలోమూ
  rationale: וְ సంధి అబ్షాలోమును ఇశ్రాయేలుతో కూడిన సంయుక్త కర్తగా కలుపుతుంది. తెలుగు ‘-ఊ’ సముచ్చయ నిర్మాణం ఈ అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: గిలాదుదేశంలో
  rationale: אֶרֶץ + ప్రాంతనామం ‘గిలాదు దేశం/ప్రాంతం’ అనే భౌగోళిక భావాన్ని ఇస్తుంది. సమాసరూపమైన ‘గిలాదుదేశంలో’ మూలార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు. సైనిక శిబిర సందర్భాన్ని సహజంగా చూపిస్తూ మూలంలోని సమష్టి కర్త నిర్మాణాన్ని నిలిపింది.
