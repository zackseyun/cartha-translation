translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. వ్యక్తుల పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలను ఉపయోగించాం. మూలంలోని అసాధారణ జలమార్గ పదబంధాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా, పాదసూచికలో అనిశ్చితిని స్పష్టంగా నిలిపాం.
