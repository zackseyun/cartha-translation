  source_fidelity: జలమార్గానికి సంబంధించిన అసాధారణ హీబ్రూ పదబంధాన్ని ‘నీటి కాలువ’గా అనువదించి, పాదసూచికలో అనిశ్చితిని నిలపడం సముచితం. అయితే ‘ఆ ఇంటి దగ్గర ఉన్న ఆ స్త్రీ వద్దకు’ అనే పదబంధం స్త్రీ ఇంటి దగ్గర నిలిచి ఉన్నట్లు అనవసరంగా సూచిస్తుంది; హీబ్రూలో సేవకులు ఇంటి వైపుకు/ఇంటి వద్దకు వచ్చి స్త్రీని సంప్రదించినట్లు ఉంది. అలాగే చివరి వెతుకులాట వాక్యంలో సేవకులే వెదికి కనుగొనలేదనే కర్తను నేరుగా ఉంచడం మూలానికి మరింత నమ్మకంగా ఉంటుంది.
