  text: וַ/יָּבֹ֣אוּ עַבְדֵי֩ אַבְשָׁל֨וֹם אֶֽל הָ/אִשָּׁ֜ה הַ/בַּ֗יְתָ/ה וַ/יֹּֽאמְרוּ֙ אַיֵּ֗ה אֲחִימַ֨עַץ֙ וִ/יה֣וֹנָתָ֔ן וַ/תֹּ֤אמֶר לָ/הֶם֙ הָֽ/אִשָּׁ֔ה עָבְר֖וּ מִיכַ֣ל הַ/מָּ֑יִם וַ/יְבַקְשׁוּ֙ וְ/לֹ֣א מָצָ֔אוּ וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: te
  text: అబ్షాలోము సేవకులు ఆ ఇంటి దగ్గరకు వచ్చి, ఆ స్త్రీతో, “అహీమయస్సు, యోనాతాను ఎక్కడ ఉన్నారు?” అని అడిగారు. ఆ స్త్రీ వారితో, “వారు నీటి కాలువను[a] దాటి వెళ్లారు” అని చెప్పింది. వారు వెదికారు, కాని వారిని కనుగొనలేకపోయారు. దాంతో వారు యెరూషలేముకు తిరిగి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీటి వాగును,” “జలమార్గాన్ని.” ఇక్కడి హీబ్రూ పదబంధం (מִיכַל הַמָּיִם) అసాధారణంగా ఉంది; ఉద్దేశించిన జలమార్గం ఖచ్చితంగా ఏ విధమైనదో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: అబ్షాలోము సేవకులు
  rationale: ఇక్కడ עֶבֶד అబ్షాలోము తరఫున పనిచేసే వ్యక్తులను సూచిస్తోంది; బానిసత్వాన్ని అనవసరంగా ముందుకు తేవకుండా ‘సేవకులు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: ఆ ఇంటి దగ్గర ఉన్న ఆ స్త్రీ వద్దకు
  rationale: దిశను సూచించే הַבַּיְתָה ఇంటివైపు రాకను తెలియజేస్తుంది; వారు తప్పక ఇంట్లోకి ప్రవేశించారని మూలం నిర్దిష్టంగా చెప్పదు. స్త్రీ ముందే పరిచయమైన వ్యక్తి కాబట్టి ‘ఆ స్త్రీ’ అని అనువదించబడింది.
- source_word: אַיֵּה אֲחִימַעַץ וִיהוֹנָתָן
  choice: అహీమయస్సు, యోనాతాను ఎక్కడ ఉన్నారు?
  rationale: ఇద్దరి స్థానం గురించి అడుగుతున్న ప్రశ్నను ఆధునిక ప్రామాణిక తెలుగులో సహజమైన బహువచన రూపంతో అందించింది.
- source_word: עָבְרוּ
  choice: దాటి వెళ్లారు
  rationale: עבר ఇక్కడ ఒక జలమార్గాన్ని దాటి అవతలికి వెళ్లడాన్ని సూచిస్తుంది; ‘దాటి వెళ్లారు’ అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִיכַל הַמָּיִם
  choice: నీటి కాలువను
  rationale: హీబ్రూ పదబంధం అసాధారణమైనది, దాని ఖచ్చితమైన భౌగోళిక స్వరూపం అనిశ్చితం. ‘నీటి కాలువ’ సాధ్యమైన అర్థాన్ని ఇస్తూ, పాదసూచికలో ఇతర అవకాశాలను నిలుపుతుంది.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: వారు వెదికినా ఆ ఇద్దరూ కనిపించలేదు
  rationale: בקשׁ ఇక్కడ వ్యక్తులను వెదకడాన్ని సూచిస్తుంది. హీబ్రూలో కర్మ సూచితం మాత్రమే; తెలుగులో స్పష్టత కోసం ‘ఆ ఇద్దరూ’ చేర్చబడింది. ‘వెదికినా’ విఫల ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: దాంతో వారు యెరూషలేముకు తిరిగి వెళ్లిపోయారు
  rationale: שׁוב అంటే తిరిగి వెళ్లడం. కథనంలోని ఫలిత సంబంధాన్ని ‘దాంతో’ సహజంగా తెలియజేస్తుంది.
