source:
  edition: WLC
  text: וַ/יָּבֹ֣א חוּשַׁי֮ אֶל אַבְשָׁלוֹם֒ וַ/יֹּאמֶר֩ אַבְשָׁל֨וֹם אֵלָ֜י/ו לֵ/אמֹ֗ר כַּ/דָּבָ֤ר הַ/זֶּה֙ דִּבֶּ֣ר אֲחִיתֹ֔פֶל הֲ/נַעֲשֶׂ֖ה אֶת דְּבָר֑/וֹ אִם אַ֖יִן אַתָּ֥ה דַבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: te
  text: హూషయి అబ్షాలోము దగ్గరకు వచ్చినప్పుడు, అబ్షాలోము అతనితో, “అహీతోఫెలు ఈ విధంగా చెప్పాడు. అతని మాట ప్రకారం మనం చేయాలా?[a] కాకపోతే, నువ్వే మాట్లాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మాటను మనం అమలు చేయాలా?” హీబ్రూలో అక్షరార్థంగా, “అతని మాటను మనం చేయాలా?” అని ఉంది; అంటే అహీతోఫెలు ఇచ్చిన సలహాను అమలు చేయడమని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే క్రియ ఇక్కడ అబ్షాలోము వైపు రావడాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో తరువాతి ప్రధాన వాక్యంతో సహజంగా కలపడానికి ‘వచ్చినప్పుడు’ అని అనువదించబడింది.
- source_word: חוּשַׁי
  choice: హూషై
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֶל אַבְשָׁלוֹם
  choice: అబ్షాలోము దగ్గరకు
  rationale: אֶל దిశను సూచిస్తుంది; వ్యక్తి వద్దకు రావడం అనే సందర్భంలో ‘దగ్గరకు’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: అతనితో ... అన్నాడు
  rationale: హీబ్రూలోని ద్వంద్వ వాక్పరిచయాన్ని తెలుగులో సహజంగా ఒకే మాటల క్రియతో వ్యక్తం చేస్తుంది.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: ఈ విధంగా చెప్పాడు
  rationale: ఈ పదబంధం అహీతోఫెలు ఇంతకుముందు ప్రతిపాదించిన సలహా విధానాన్ని, విషయాన్ని సూచిస్తుంది; ‘ఈ విధంగా’ ప్రదర్శక భావాన్ని నిలుపుతుంది.
- source_word: הֲנַעֲשֶׂה
  choice: మనం చేయాలా?
  rationale: ప్రశ్నార్థక హేతో కూడిన ప్రథమ పురుష బహువచన అసంపూర్ణ క్రియ deliberative భావాన్ని ఇస్తుంది; ‘చేయాలా?’ తెలుగులో ఆ సంప్రదింపుభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת דְּבָרוֹ
  choice: అతని మాట ప్రకారం
  rationale: అక్షరార్థంగా ‘అతని మాట’; సందర్భంలో అహీతోఫెలు ఇచ్చిన సలహాను అమలు చేయడాన్ని సూచిస్తుంది. ఈ రూపం మూలంలోని ‘మాట’ను నిలుపుతూ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: אִם אַיִן
  choice: వద్దంటే
  rationale: ఇది ‘అలా చేయకూడదనుకుంటే/కాకపోతే’ అనే షరతుతో కూడిన వ్యతిరేకత. సంభాషణలో ‘వద్దంటే’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: אַתָּה דַבֵּר
  choice: నువ్వే మాట్లాడు
  rationale: ప్రత్యేకంగా ఉంచిన אַתָּה సర్వనామంలోని ఉద్ఘాటనను ‘నువ్వే’ నిలుపుతుంది; ఆజ్ఞార్థక דַבֵּרను ‘మాట్లాడు’గా నేరుగా అందిస్తుంది.
