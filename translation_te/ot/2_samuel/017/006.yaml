translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తినామాలు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని సంప్రదింపు ప్రశ్నను, ‘నువ్వే’ అనే ఉద్ఘాటనను నిలుపుతూ అతి వివరణను ప్రధాన పాఠ్యంలో నివారించాం.
