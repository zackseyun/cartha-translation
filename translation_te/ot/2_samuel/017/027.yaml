translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హెబ్రీయ మూలంలో ఈ వచనం వ్యక్తుల జాబితాతో ముగిసి, వాక్యభావం తదుపరి వచనంలో కొనసాగుతుంది; అందువల్ల తెలుగు పాఠ్యమూ ముగింపు కామాతో ఉద్దేశపూర్వకంగా కొనసాగింపును నిలిపింది.
