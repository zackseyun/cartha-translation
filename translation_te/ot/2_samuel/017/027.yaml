id: 2SA.17.27
reference: 2 Samuel 17:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: te
  text: దావీదు మహనయీముకు వచ్చినప్పుడు, అమ్మోనీయుల రబ్బా పట్టణానికి చెందిన నాహాషు కుమారుడు షోబీ, లోదెబారుకు చెందిన అమ్మీయేలు కుమారుడు మాకీరు, రోగెలీముకు చెందిన గిలాదీయుడైన బర్జిల్లయి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: వచ్చినప్పుడు
  rationale: כְּతో కూడిన בוא క్రియార్థక నామరూపం ఇక్కడ కాలసంబంధాన్ని సూచిస్తుంది. וַיְהִי కథనంలోని కొత్త పరిణామాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని కలపకుండా కాలవాక్య నిర్మాణమే సహజంగా ఆ మార్పును తెలియజేస్తుంది.
- source_word: מַחֲנָיְמָה
  choice: మహనయీముకు
  rationale: చివరి దిశాసూచక ה ఆ ప్రదేశం వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘-కు’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: నాహాషు కుమారుడు షోబీ
  rationale: వ్యక్తినామాలను లిప్యంతరీకరించి, హెబ్రీయ patronymic నిర్మాణాన్ని సహజ తెలుగు పదక్రమంలో అందించాం.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రబ్బా పట్టణానికి చెందిన
  rationale: రబ్బా నగరనామం; ‘అమ్మోను కుమారులు’ అనే జాతి-రాజకీయ పదబంధాన్ని సహజంగా ‘అమ్మోనీయులు’ అని ఇచ్చాం. నగరమని పాఠకునికి స్పష్టమయ్యేలా ‘పట్టణం’ చేర్చాం.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: అమ్మీయేలు కుమారుడు మాకీరు
  rationale: వ్యక్తినామాలను లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని తెలుగు పదక్రమంలో నిలిపాం.
- source_word: מִלֹּא דְבָר
  choice: లోదెబారుకు చెందిన
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, מן సూచించే మూలస్థల సంబంధాన్ని ‘చెందిన’తో తెలిపాం.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: గిలాదీయుడైన బర్జిల్లయి
  rationale: הַגִּלְעָדִי ప్రాంతీయ గుర్తింపును ‘గిలాదీయుడు’గా నిలిపి, తెలుగులో సహజమైన పదక్రమాన్ని వాడాం.
- source_word: מֵרֹגְלִים
  choice: రోగెలీముకు చెందిన
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, מן సూచించే మూలస్థలాన్ని సహజ తెలుగులో తెలిపాం.
