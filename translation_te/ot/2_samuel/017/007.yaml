source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר חוּשַׁ֖י אֶל אַבְשָׁל֑וֹם לֹֽא טוֹבָ֧ה הָ/עֵצָ֛ה אֲשֶׁר יָעַ֥ץ אֲחִיתֹ֖פֶל בַּ/פַּ֥עַם הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/007.yaml
  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: te
  text: 'అప్పుడు హూషై అబ్షాలోముతో ఇలా అన్నాడు: “ఈసారి[a] అహీతోఫెలు ఇచ్చిన సలహా మంచిది కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ సందర్భంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ ఆ క్రమబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: חוּשַׁי
  choice: హూషై
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: అబ్షాలోముతో
  rationale: మాట్లాడే క్రియతో కలిసి אֶל ఇక్కడ సంబోధిత వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘అబ్షాలోముతో ... అన్నాడు’ సహజమైన ప్రయోగం.
- source_word: לֹא טוֹבָה
  choice: మంచిది కాదు
  rationale: טוֹבָה అనే సాధారణ మూల్యాంకన పదానికి విస్తృత అర్థాన్ని నిలుపుతూ నేరుగా, సహజంగా అనువదించాం.
- source_word: הָעֵצָה
  choice: సలహా
  rationale: עֵצָה సలహా, ఆలోచన లేదా పథకం అనే భావాలను ఇవ్వగలదు. రాజనీతి-వ్యూహ సందర్భంలో సాధారణ పాఠకులకు ‘సలహా’ సహజంగా ఉండి సలహాదారు పాత్రను కూడా నిలుపుతుంది.
- source_word: אֲשֶׁר יָעַץ
  choice: ఇచ్చిన
  rationale: హీబ్రూలో ఒకే మూలపదం పునరావృతమయ్యే ‘సలహా ఇచ్చాడు’ భావాన్ని తెలుగులో సహజంగా ‘ఇచ్చిన సలహా’గా వ్యక్తం చేశాం.
- source_word: אֲחִיתֹפֶל
  choice: అహీతోఫెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בַּפַּעַם הַזֹּאת
  choice: ఈసారి
  rationale: ఈ పదబంధానికి సందర్భానుసారమైన సహజ తెలుగు సమానార్థం ‘ఈసారి’; ‘ఈ సందర్భంలో’ అనే భావం కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని మూల్యాంకన సరళతను, వ్యూహాత్మక సందర్భాన్ని అతిగా వివరించకుండా నిలిపాం.
