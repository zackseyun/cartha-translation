  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: te
  text: అప్పుడు మేము అతడు కనిపించే ప్రదేశాల్లో ఏదో ఒకదానిలో అతని మీదికి వచ్చి, నేలపై మంచు పడినట్లుగా అతని మీద కమ్ముకుంటాం[a]; అతడూ, అతనితో ఉన్న మనుషులందరిలో ఒక్కరు కూడా మిగలరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిపై స్థిరపడతాం.’ ఇక్కడి హెబ్రీ క్రియకు ‘విశ్రమించడం, నిలవడం, స్థిరపడడం’ అనే అర్థాలున్నాయి. నేలపై మంచు పడినట్లుగా సైన్యం అతణ్ణి పూర్తిగా ఆవరించడాన్ని ఈ ఉపమానం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: అప్పుడు మేము అతని మీదికి వచ్చి
  rationale: בוא యొక్క ప్రాథమిక ‘రావడం’ భావాన్ని నిలుపుతూ, యుద్ధ సందర్భంలోని శత్రుత్వ దిశను ‘మీదికి’ తెలియజేస్తుంది.
- source_word: בְאַחַת הַמְּקֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: అతడు కనిపించే ప్రదేశాల్లో ఒకదానిలో
  rationale: נמצא లోని నిష్క్రియ భావాన్ని ‘కనిపించే’ సహజ తెలుగులో వ్యక్తపరుస్తూ, హెబ్రీలో లేని సంభావ్యతను చేర్చదు.
- source_word: וְנַחְנוּ עָלָיו
  choice: అతని మీద కమ్ముకుంటాం
  rationale: נוּחַ యొక్క నిలిచి/పరచుకొని ఉండే భావాన్ని, వెంట వచ్చే మంచు ఉపమానానికి అనుగుణంగా తెలుగులో సహజంగా అందిస్తుంది; తరువాతి יִפֹּל అనే వేరే క్రియతో దీనిని కలపదు.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: నేలమీద మంచు కమ్ముకున్నట్లుగా
  rationale: טל ను సందర్భానుసారంగా ‘మంచు’గా, ఉపమానంలోని విస్తారమైన ఆవరింపును సహజ తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: וְלֹא נוֹתַר
  choice: మిగలనివ్వం
  rationale: యుద్ధ ప్రణాళిక సందర్భంలో ఎవ్వరూ మిగలని ఫలితాన్ని తెలుగులో సహజంగా చెబుతుంది.
- source_word: בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: అతనిలో గానీ, అతనితో ఉన్న మనుషులందరిలో గానీ
  rationale: దావీదునూ అతని మొత్తం బృందాన్నీ కలుపుతున్న హెబ్రీ నిర్మాణాన్ని సమాంతర తెలుగు నిర్మాణంతో నిలుపుతుంది.
- source_word: גַּם אֶחָד
  choice: ఒక్కణ్ణి కూడా
  rationale: ఒక్కడైనా మిగలడనే సంపూర్ణ నిరాకరణకు హెబ్రీలోని ఉద్ఘాటనను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. נוח (‘నిలవడం/స్థిరపడడం’) మరియు נפל (‘పడడం’) అనే వేర్వేరు హెబ్రీ క్రియల మధ్య తేడాను తెలుగులో సాధ్యమైనంతవరకు కాపాడుతూ, మంచు ఉపమానాన్ని సహజంగా తీర్చిదిద్దాం.
