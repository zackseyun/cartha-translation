  source_fidelity: 'The Telugu accurately represents the Hebrew narrative: David and all those with him rose and crossed the Jordan, and by the arrival of morning light no one remained who had not crossed. The double-negative force of עַד־אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר is preserved naturally in “దాటనివాడు ఒక్కడూ మిగలలేదు.”'
  naturalness: The wording is fluent modern standard Telugu. “ఉదయపు వెలుగు వచ్చేసరికి” naturally conveys the temporal endpoint marked by עַד אוֹר הַבֹּקֶר while retaining the image of morning light. “యొర్దాను నదిని” is clear and idiomatic.
  terminology: “దావీదు” and “యొర్దాను” are established Telugu biblical forms. “ప్రజలందరూ,” “లేచి,” and “దాటారు” are appropriate to the narrative register and do not add theological or interpretive content.
