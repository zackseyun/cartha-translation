translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని ఉదయపు వెలుగు చిత్రణను నిలిపి, వాక్యాన్ని తెలుగు సహజ క్రమంలో అమర్చాం.
