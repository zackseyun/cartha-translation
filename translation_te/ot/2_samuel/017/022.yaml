id: 2SA.17.22
reference: 2 Samuel 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּעַבְר֖וּ אֶת הַ/יַּרְדֵּ֑ן עַד א֣וֹר הַ/בֹּ֗קֶר עַד אַחַד֙ לֹ֣א נֶעְדָּ֔ר אֲשֶׁ֥ר לֹא עָבַ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: te
  text: అప్పుడు దావీదు, అతనితో ఉన్న ప్రజలందరూ లేచి యొర్దాను నదిని దాటారు. ఉదయపు వెలుగు వచ్చేసరికి, యొర్దాను నదిని దాటనివాడు ఒక్కడూ మిగలలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క సాధారణ అర్థమైన ‘లేచుట’ను నిలుపుతూ, తరువాతి ప్రయాణ చర్యకు సహజమైన కథన కదలికను ఇస్తుంది; ‘బయలుదేరి’ అనడం సందర్భానుసారమైన విస్తరణ అవుతుంది.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: దావీదుతో ఉన్న మొత్తం సమూహాన్ని లింగపరంగా పరిమితం చేయకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: యొర్దాను నదిని దాటారు
  rationale: עבר యొక్క ప్రత్యక్ష అర్థమైన ‘దాటారు’ను ఇస్తుంది; తెలుగు పాఠకులకు భౌగోళిక సూచన స్పష్టంగా ఉండేందుకు ‘నది’ చేర్చబడింది.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: ఉదయపు వెలుగు వచ్చేసరికి
  rationale: ‘ఉదయపు వెలుగు’ అనే మూలభాషా చిత్రాన్ని నిలుపుతూ, దాటడం పూర్తైన కాలపరిమితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַד אַחַד לֹא נֶעְדָּר
  choice: ఒక్కడూ మిగలలేదు
  rationale: ఎవరూ వెనుకబడిపోలేదనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి సంబంధ వాక్యంతో కలిసి హెబ్రీయులోని ప్రతికూల నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר לֹא עָבַר אֶת הַיַּרְדֵּן
  choice: యొర్దాను నదిని దాటనివాడు
  rationale: ‘దాటని వాడు ఒక్కడూ మిగలలేదు’ అనే నిర్మాణం ద్వారా మూలంలోని ద్వంద్వ-ప్రతికూల భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
