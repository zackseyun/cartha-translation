  variant: modern standard Telugu
source:
  edition: WLC
  text: מִשְׁכָּ֤ב וְ/סַפּוֹת֙ וּ/כְלִ֣י יוֹצֵ֔ר וְ/חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/קֶ֣מַח וְ/קָלִ֑י וּ/פ֥וֹל וַ/עֲדָשִׁ֖ים וְ/קָלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/028.yaml
  text: beds[a], basins, and pottery vessels, and wheat, barley, flour[b], roasted grain, beans, lentils[d][c], and parched grain.
translation:
  language: te
  text: పడకలు, గిన్నెలు[a], మట్టి పాత్రలు[b], గోధుమలు, యవలు, పిండి, కాల్చిన ధాన్యం, బీన్స్[c], మసూర్ పప్పు, కాల్చిన ధాన్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తొట్టెలు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కుమ్మరి చేసిన పాత్రలు’; అంటే మట్టిపాత్రలు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం మరింత ప్రత్యేకంగా బాక్లా బీన్స్ (ఫావా బీన్స్)ను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: పడకలు
  rationale: ఈ పదం పడుకునే స్థలాన్ని లేదా పరుపు వంటి పడక సామగ్రిని సూచించగలదు. సరఫరా వస్తువుల జాబితాలో సహజమైన సమూహార్థంతో ‘పడకలు’ అని అనువదించబడింది.
- source_word: סַפּוֹת
  choice: గిన్నెలు
  rationale: ఇది గిన్నెలు లేదా పళ్లెం ఆకారపు పాత్రలను సూచించే అవకాశం ఉంది. ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే ‘గిన్నెలు’ ఎంచుకోబడింది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: כְלִי יוֹצֵר
  choice: మట్టి పాత్రలు
  rationale: అక్షరార్థంగా ‘కుమ్మరి పాత్రలు.’ సందర్భంలో ఇది కుమ్మరి చేసిన మట్టిపాత్రలను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగు రూపం ఉపయోగించబడింది.
- source_word: חִטִּים
  choice: గోధుమలు
  rationale: ఈ ధాన్యానికి ప్రామాణికమైన తెలుగు పేరు.
- source_word: שְׂעֹרִים
  choice: యవలు
  rationale: బార్లీ ధాన్యానికి ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: קֶמַח
  choice: పిండి
  rationale: దంచిన ధాన్యాన్ని సూచించే స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: קָלִי
  choice: కాల్చిన ధాన్యం
  rationale: వేడి మీద కాల్చి సిద్ధం చేసిన ధాన్యాన్ని సూచిస్తుంది. మూలంలో ఈ పదం రెండుసార్లు ఉన్నందున రెండుచోట్లా ఒకే విధంగా అనువదించి పునరుక్తిని నిలుపుకున్నాం.
- source_word: פּוֹל
  choice: చిక్కుడు గింజలు
  rationale: ఇది ఒక రకమైన చిక్కుడు గింజను, బహుశా broad/fava bean‌ను, సూచిస్తుంది. ప్రధాన పాఠ్యంలో సులభంగా అర్థమయ్యే సాధారణ పదాన్ని ఉంచి, ప్రత్యేకతను పాదసూచికలో తెలిపాం.
- source_word: עֲדָשִׁים
  choice: మసూర్ పప్పు
  rationale: లెంటిల్‌ను ఆధునిక తెలుగులో స్పష్టంగా గుర్తించే పేరు.
