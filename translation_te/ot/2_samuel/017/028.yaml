translation_notes:
  register: సరఫరా వస్తువుల జాబితాకు తగినట్లు సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. హీబ్రూలో קָלִי రెండుసార్లు రావడాన్ని శైలీ సౌలభ్యం కోసం తొలగించకుండా యథాతథంగా నిలుపుకున్నాం. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదం వెంటనే ఉంచబడింది.
