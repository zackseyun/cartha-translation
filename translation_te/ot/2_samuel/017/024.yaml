source:
  edition: WLC
  text: וְ/דָוִ֖ד בָּ֣א מַחֲנָ֑יְמָ/ה וְ/אַבְשָׁלֹ֗ם עָבַר֙ אֶת הַ/יַּרְדֵּ֔ן ה֕וּא וְ/כָל אִ֥ישׁ יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/024.yaml
  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: te
  text: అప్పుడు దావీదు మహనయీముకు చేరుకున్నాడు. అబ్షాలోము, అతనితోపాటు ఇశ్రాయేలు పురుషులందరూ, యొర్దాను నదిని దాటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: చేరుకున్నాడు
  rationale: בוא అనే క్రియ ఇక్కడ గమ్యస్థానానికి రావడం లేదా చేరుకోవడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగు కథనంలో ‘చేరుకున్నాడు’ సహజంగా ఉండి, గమ్యస్థాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַחֲנָיְמָה
  choice: మహనయీముకు
  rationale: స్థలనామానికి జతచేసిన దిశాసూచక ה, ఆ ప్రదేశం వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘-కు’ ద్వారా అది సహజంగా వ్యక్తమవుతుంది.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: యొర్దాను నదిని దాటాడు
  rationale: עבר క్రియకు ‘యొర్దాను’ ప్రత్యక్ష కర్మగా రావడం నదిని దాటడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు అది నది అని స్పష్టపడేందుకు ‘నదిని’ చేర్చబడింది.
- source_word: הוּא
  choice: అతను
  rationale: స్వతంత్ర సర్వనామం అబ్షాలోమును మళ్లీ స్పష్టంగా సూచిస్తూ, తరువాతి సమూహంతో అతన్ని కలుపుతుంది. తెలుగులో ‘అతను’ ఈ నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నప్పటికీ כָל తో కలిసి సామూహికంగా ‘ఇశ్రాయేలు పురుషులందరూ’ అని అర్థమిస్తుంది. పురుషవాచక పదాన్ని నిలుపుతూ, సందర్భంలోని సైనిక లేదా రాజకీయ అనుచర సమూహాన్ని విస్తరించకుండా అనువదించబడింది.
- source_word: עִמּוֹ
  choice: అతనితోపాటు
  rationale: ఈ విభక్తి-సర్వనామ రూపం సహవాసం లేదా తోడుగా ఉండడాన్ని సూచిస్తుంది; ‘అతనితోపాటు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: וְ
  choice: అప్పుడు / మరియు భావసంబంధం
  rationale: మొదటి వావ్ కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’గా వ్యక్తమైంది. తరువాతి వావ్ వాక్యాలను అనుసంధానిస్తుంది; తెలుగులో విరామచిహ్నం మరియు వాక్యనిర్మాణం ద్వారా ఆ సంబంధం సహజంగా తెలియజేయబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి వాడబడింది. హెబ్రీ మూలంలోని రెండు సమాంతర సంఘటనలు స్పష్టంగా ఉండేందుకు రెండు వాక్యాలుగా అమర్చబడ్డాయి; చివరి క్రియ ‘దాటారు’ తెలుగులో అవసరమైన విధంగా పునరుక్తమైంది.
