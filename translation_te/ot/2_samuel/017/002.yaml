source:
  edition: WLC
  text: וְ/אָב֣וֹא עָלָ֗י/ו וְ/ה֤וּא יָגֵ֨עַ֙ וּ/רְפֵ֣ה יָדַ֔יִם וְ/הַֽחֲרַדְתִּ֣י אֹת֔/וֹ וְ/נָ֖ס כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וְ/הִכֵּיתִ֥י אֶת הַ/מֶּ֖לֶךְ לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: te
  text: అతడు అలసిపోయి, చేతులు సడలిపోయి ఉన్నప్పుడు[a] నేను అతని మీదికి వస్తాను. అతన్ని భయభ్రాంతికి గురిచేస్తాను; అప్పుడు అతనితో ఉన్న ప్రజలందరూ పారిపోతారు. రాజును మాత్రమే నేను హతమారుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘చేతులు సడలిపోయినవాడై’; ఇది బలం లేదా ధైర్యం క్షీణించడాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: నేను అతని మీదికి వస్తాను
  rationale: בוא + עַל ఇక్కడ శత్రుభావంతో ఒకరి మీదికి రావడాన్ని సూచిస్తుంది. ‘మీదికి వస్తాను’ అనే రూపం మూలంలోని గమనచిత్రాన్ని నిలుపుతూ సైనిక సందర్భాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: יָגֵעַ
  choice: అలసిపోయి
  rationale: ఈ విశేషణం శ్రమవల్ల కలిగిన అలసటను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּרְפֵה יָדַיִם
  choice: చేతులు సడలిపోయి ఉన్నప్పుడు
  rationale: అక్షరార్థంగా ‘చేతులు బలహీనంగా/సడలుగా ఉన్నవాడు.’ బలం లేదా ధైర్యం క్షీణించిన స్థితిని తెలిపే హీబ్రూ దృశ్యరూపాన్ని అనువాదంలో నిలిపింది.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: అతన్ని భయభ్రాంతికి గురిచేస్తాను
  rationale: חרד హిఫిల్ రూపంలోని కారణార్థాన్ని—అతడు వణికేలా లేదా తీవ్రంగా భయపడేలా చేయడం—యుద్ధ సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: అప్పుడు అతనితో ఉన్న ప్రజలందరూ పారిపోతారు
  rationale: హీబ్రూలో సాధారణ సంధానం ఉన్నప్పటికీ, ముందు కలిగించిన భయానికి ఫలితంగా పారిపోవడం సందర్భంలో స్పష్టంగా ఉంది. ‘అతనితో ఉన్న’ అనేది אֲשֶׁר אִתּוֹను నిలుపుతుంది.
- source_word: וְהִכֵּיתִי
  choice: నేను హతమారుస్తాను
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం; ఈ సందర్భంలో రాజును ఒంటరి లక్ష్యంగా చేసి ప్రాణాంతకంగా చంపడం ఉద్దేశం. ‘హతమారుస్తాను’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజును
  rationale: మూలంలో నామవాచకం నిర్దిష్టమైనది. సందర్భంలో దావీదును సూచించినప్పటికీ, మూలంలోని బిరుదైన ‘రాజు’నే నిలిపింది.
- source_word: לְבַדּוֹ
  choice: మాత్రం
  rationale: రాజే ఏకైక లక్ష్యమని ఈ పదం నొక్కిచెబుతుంది. తెలుగులో ‘రాజును మాత్రం’ ఆ ప్రత్యేక దృష్టిని సహజంగా వ్యక్తం చేస్తుంది.
