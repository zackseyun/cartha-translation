  edition: WLC
  text: וִ/יהוֹנָתָ֨ן וַ/אֲחִימַ֜עַץ עֹמְדִ֣ים בְּ/עֵין רֹגֵ֗ל וְ/הָלְכָ֤ה הַ/שִּׁפְחָה֙ וְ/הִגִּ֣ידָה לָ/הֶ֔ם וְ/הֵם֙ יֵֽלְכ֔וּ וְ/הִגִּ֖ידוּ לַ/מֶּ֣לֶךְ דָּוִ֑ד כִּ֣י לֹ֥א יוּכְל֛וּ לְ/הֵרָא֖וֹת לָ/ב֥וֹא הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: te
  text: యోనాతాను, అహీమయాజు ఏన్‌రోగేలు దగ్గర ఉండేవారు[a]. ఒక స్త్రీ సేవకురాలు[b] వెళ్లి వారికి సమాచారం అందించేది; వారు వెళ్లి దావీదు రాజుకు తెలియజేసేవారు. వారు పట్టణంలోకి ప్రవేశిస్తూ కనిపించలేకపోయారు కాబట్టి ఇలా చేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నిలబడి ఉండేవారు’; ఈ సందర్భంలో వారు అక్కడే ఉండేవారని లేదా అక్కడ నియమించబడి ఉండేవారని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ప్రత్యేకంగా స్త్రీ సేవకురాలిని సూచిస్తుంది; ‘దాసి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: ఉండేవారు
  rationale: ఈ వర్తమాన కృదంతానికి అక్షరార్థంగా ‘నిలబడి ఉన్నారు’ అనే భావం ఉన్నా, ఒక స్థలంతో వచ్చిన ఈ కథన సందర్భంలో అక్కడే ఉండడం లేదా నియమించబడి ఉండడం అనే కొనసాగుతున్న స్థితిని సూచిస్తుంది. సహజమైన తెలుగులో ‘ఉండేవారు’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּעֵין רֹגֵל
  choice: ఏన్‌రోగేలు దగ్గర
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; בְ అనే స్థానార్థక ఉపసర్గను సహజంగా ‘దగ్గర’ అని ఇచ్చాం.
- source_word: הַשִּׁפְחָה
  choice: ఒక పనిమనిషి
  rationale: ఈ పదం ప్రత్యేకంగా స్త్రీ సేవకురాలిని లేదా దాసిని సూచిస్తుంది. బానిస స్థితిని అవసరానికి మించి నొక్కిచెప్పకుండా, ఆమె పాత్రను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేయడానికి ‘పనిమనిషి’ వాడాం.
- source_word: וְהָלְכָה וְהִגִּידָה לָהֶם
  choice: వెళ్లి వారికి సమాచారం అందించేది
  rationale: కథనంలోని సమాచార పంపిణీ ఏర్పాటును, పునరావృతంగా లేదా నియమితంగా జరిగే చర్యను తెలుగులో ‘అందించేది’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהֵם יֵלְכוּ וְהִגִּידוּ
  choice: వారు వెళ్లి … తెలియజేసేవారు
  rationale: సేవకురాలు సమాచారం ఇచ్చిన తరువాత వారు దానిని దావీదుకు చేరవేసే క్రమాన్ని, విధానపూర్వక చర్యను ఈ రూపం నిలుపుతుంది.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజుకు
  rationale: బిరుదు-పేరు కలయికను ఆధునిక ప్రామాణిక తెలుగులో సహజమైన క్రమంలో ఇచ్చాం.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: పట్టణంలోకి వస్తున్నట్టు ఎవరికీ కనిపించడానికి వీల్లేదు
  rationale: నిఫాల్ రూపంలోని ‘కనిపించడం/చూడబడడం’ భావాన్నీ, పట్టణం వైపు ప్రవేశాన్ని సూచించే దిశార్థక రూపాన్నీ నిలుపుతూ, రహస్యంగా ఉండవలసిన సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. చర్యల క్రమాన్ని స్పష్టంగా ఉంచి, మూలంలోని విధానపూర్వక/పునరావృత భావాన్ని ‘అందించేది’, ‘తెలియజేసేవారు’ రూపాలతో వ్యక్తపరిచాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
