language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָשִׁ֥יבָה כָל הָ/עָ֖ם אֵלֶ֑י/ךָ כְּ/שׁ֣וּב הַ/כֹּ֔ל הָ/אִישׁ֙ אֲשֶׁ֣ר אַתָּ֣ה מְבַקֵּ֔שׁ כָּל הָ/עָ֖ם יִהְיֶ֥ה שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: te
  text: ప్రజలందరినీ నీ దగ్గరికి తిరిగి తీసుకొస్తాను. నీవు వెదుకుతున్న ఆ మనిషి తొలగిపోతే అందరూ తిరిగి వస్తారు[a]; ప్రజలందరికీ శాంతి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. అక్షరార్థానికి దగ్గరగా, “అందరి తిరిగిరావడంలా, నీవు వెదుకుతున్న ఆ మనిషి” అని ఉంది. వెదకబడుతున్న ఒక్క మనిషిని తొలగిస్తే మిగిలినవారంతా తిరిగి వస్తారనేది సందర్భార్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: తిరిగి తీసుకొస్తాను
  rationale: שׁוב హిఫీల్ రూపం కారణార్థకమైనది; అహీతోపెలు ప్రజలు తిరిగి వచ్చేలా చేస్తానని చెబుతున్నందున ఈ ప్రయోగం సందర్భానికి సరిపోతుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరినీ / ప్రజలందరూ
  rationale: עָם యొక్క సాధారణ అర్థం ‘ప్రజలు.’ సందర్భంలో ఒక పక్షాన్ని అనుసరించినవారిని సూచించినా, ‘సైన్యం’ అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత పదాన్ని నిలుపుతుంది.
- source_word: אֵלֶיךָ
  choice: నీ దగ్గరికి
  rationale: దిశను తెలిపే אֶל భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: నీవు వెదుకుతున్న ఆ మనిషి
  rationale: నిర్దిష్టంగా వెదకబడుతున్న ఒక్క వ్యక్తిని—ఈ సందర్భంలో దావీదును—సూచించే ఏకవచన సంబంధ వాక్యాన్ని నిలుపుతుంది.
- source_word: יִהְיֶה שָׁלוֹם
  choice: ప్రశాంతంగా ఉంటారు
  rationale: సంఘర్షణ ముగిసిన తరువాత కలిగే శాంతి, క్షేమ స్థితిని సహజ తెలుగులో తెలియజేస్తుంది; కేవలం భద్రత అనే అర్థానికే పరిమితం చేయదు.
theological_decisions:
- issue: కఠినమైన మధ్య వాక్యభాగంలో వెదకబడుతున్న మనిషి గతి
  choice: ‘ఆ మనిషి తొలగిపోతే’ అని సందర్భార్థాన్ని తెలిపి, అనిశ్చితిని పాదసూచికలో ఉంచడం
  alternative: ‘ఆ మనిషి చనిపోతే’ లేదా పదక్షరంగా అస్పష్టమైన నిర్మాణాన్ని ప్రధాన వచనంలో ఉంచడం
  rationale: మునుపటి వచనంలో దావీదును మాత్రమే హతమార్చాలనే యోచన స్పష్టమైనా, ఈ వచనంలో ‘చనిపోవడం’ అనే క్రియ ప్రత్యక్షంగా లేదు. అందువల్ల హింసాత్మక సందర్భాన్ని దాచకుండా, మూలంలో లేని స్పష్టతను జోడించకుండా ‘తొలగిపోతే’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. రాజకీయ-సైనిక సందర్భాన్ని నిలుపుతూ, క్లిష్టమైన హెబ్రీ నిర్మాణాన్ని ప్రధాన వచనంలో సహజంగా తెలిపి, దాని నిజమైన అస్పష్టతను పాదసూచికలో సంరక్షించాం.
