source:
  edition: WLC
  text: כִּ֣י יָעַ֗צְתִּי הֵ֠אָסֹף יֵאָסֵ֨ף עָלֶ֤י/ךָ כָל יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע כַּ/ח֥וֹל אֲשֶׁר עַל הַ/יָּ֖ם לָ/רֹ֑ב וּ/פָנֶ֥י/ךָ הֹלְכִ֖ים בַּ/קְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: te
  text: కాని నా సలహా ఏమిటంటే, దాను నుండి బెయేర్షెబా వరకు ఉన్న ఇశ్రాయేలీయులందరూ సముద్రతీరాన ఉన్న ఇసుకంతమందిగా నీ దగ్గరకు తప్పకుండా సమకూడాలి; నీవే స్వయంగా యుద్ధానికి వెళ్లాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ ముఖం యుద్ధంలో వెళ్తూ.” ఇది నీవు స్వయంగా యుద్ధంలో ముందుండి దాడికి నాయకత్వం వహించాలనే భావాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: ముందున్న అహీతోపెలు పథకానికి భిన్నమైన హుషయి ప్రతిసలహాను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: יָעַצְתִּי
  choice: నేను ఇచ్చే సలహా ఏమిటంటే
  rationale: יעץ అనే క్రియలోని సలహా ఇవ్వడం అనే ప్రసంగ క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: తప్పకుండా సమకూడాలి
  rationale: అదే ధాతువుతో వచ్చిన ధాతురూపం, సమాపక క్రియ కలయికలోని బలమైన నిశ్చయార్థాన్ని నిలుపుతుంది.
- source_word: עָלֶיךָ
  choice: నీ దగ్గర
  rationale: అబ్షాలోము నాయకత్వం కింద అతని వద్దకు సమకూడడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘నీ చుట్టూ’ అనే భావం కూడా సాధ్యమే.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: దేశం లేదా సైన్యాన్ని సమష్టిగా సూచించే పదబంధాన్ని సాధారణ పాఠకులకు స్పష్టమైన వ్యక్తుల సమూహంగా అందిస్తుంది.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: దాను నుండి బెయేర్షెబా వరకు
  rationale: ఇశ్రాయేలు దేశపు సంపూర్ణ విస్తీర్ణాన్ని సూచించే భౌగోళిక ద్వంద్వసూచనను యథాతథంగా నిలుపుతుంది.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: సముద్రతీరంలోని ఇసుకంత విస్తారంగా
  rationale: అపారమైన సంఖ్యను తెలిపే మూలభాషా ఉపమానాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: నీవే స్వయంగా ... వెళ్లాలి
  rationale: అక్షరార్థంగా ‘నీ ముఖం వెళ్తూ’ ఉన్న హీబ్రూ ప్రయోగం అబ్షాలోము వ్యక్తిగతంగా పాల్గొని ముందుండాలని సూచిస్తుంది.
- source_word: בַּקְרָב
  choice: యుద్ధానికి
  rationale: సైనిక సందర్భంలో קרב సూచించే పోరాటం లేదా యుద్ధంలో ప్రవేశించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
