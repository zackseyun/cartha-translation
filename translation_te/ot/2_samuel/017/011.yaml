    issue: “సముద్రతీరంలోని ఇసుకంత విస్తారంగా” can describe geographical extent rather than numerical multitude.
    rationale: The Hebrew כַּחוֹל ... לָרֹב compares the assembled force to the sand in its abundance. The Telugu should explicitly express number/multitude.
