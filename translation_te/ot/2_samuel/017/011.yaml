review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Hushai's counter-advice, the emphatic gathering, the geographic merism, and Absalom's personal participation. However, “విస్తారంగా” primarily denotes spatial extent, whereas the Hebrew simile explicitly denotes numerical abundance (לָרֹב).
  naturalness: The sentence is generally fluent modern standard Telugu. Recasting the sand comparison in terms of people/number makes the meaning more idiomatic and precise. “నీ దగ్గరకు” is slightly more natural than “నీ దగ్గర” with “సమకూడాలి.”
  terminology: Place names are appropriately rendered as దాను and బెయేర్షెబా. “ఇశ్రాయేలీయులందరూ” suitably represents the collective rhetoric of “all Israel” in this military context. “యుద్ధానికి వెళ్లాలి” faithfully conveys going into battle.
