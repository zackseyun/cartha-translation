- from: 'కాని నేను ఇచ్చే సలహా ఏమిటంటే: దాను నుండి బెయేర్షెబా వరకు ఉన్న ఇశ్రాయేలీయులందరూ సముద్రతీరంలోని ఇసుకంత విస్తారంగా నీ దగ్గర తప్పకుండా సమకూడాలి; నీవే స్వయంగా యుద్ధానికి వెళ్లాలి.[a]'
  to: కాని నా సలహా ఏమిటంటే, దాను నుండి బెయేర్షెబా వరకు ఉన్న ఇశ్రాయేలీయులందరూ సముద్రతీరాన ఉన్న ఇసుకంతమందిగా నీ దగ్గరకు తప్పకుండా సమకూడాలి; నీవే స్వయంగా యుద్ధానికి వెళ్లాలి.[a]
