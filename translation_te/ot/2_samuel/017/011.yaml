translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూ మూలంలోని బలమైన సమీకరణ ఆజ్ఞను ‘తప్పకుండా’తో, వ్యక్తిగత నాయకత్వాన్ని ‘నీవే స్వయంగా’తో వ్యక్తం చేసి, అక్షరార్థ ప్రయోగాన్ని పాదటిప్పణిలో ఉంచాం.
