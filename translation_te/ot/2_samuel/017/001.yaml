reference: 2 Samuel 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: te
  text: 'అప్పుడు అహీతోఫెలు అబ్షాలోముతో ఇలా అన్నాడు[a]: “దయచేసి, పన్నెండు వేల మందిని ఎంచుకోనివ్వు; నేను లేచి ఈ రాత్రి దావీదు వెనుకపడతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానుసారంగా: “దయచేసి, నేను పన్నెండు వేల మందిని ఎంచుకుంటాను; నేను లేచి ఈ రాత్రి దావీదును వెంబడిస్తాను.”'
    reason: హీబ్రూలోని వరుస కోహోర్టేటివ్ క్రియారూపాల మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: אֲחִיתֹפֶל
  choice: అహీతోఫెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל־אַבְשָׁלֹם
  choice: అబ్షాలోముతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל యొక్క లక్ష్యార్థాన్ని సహజమైన తెలుగులో ‘తో’ విభక్తి ద్వారా వ్యక్తం చేశాం.
- source_word: אֶבְחֲרָה נָּא
  choice: దయచేసి ... నేను ఎంపిక చేసుకొని ... నన్ను అనుమతించు
  rationale: కోహోర్టేటివ్‌తో కూడిన נָא మర్యాదపూర్వక ప్రతిపాదన లేదా అభ్యర్థనను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘దయచేసి ... నన్ను అనుమతించు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: పన్నెండు వేల మందిని
  rationale: అక్షరార్థంగా ‘పన్నెండు వేల మంది’. సందర్భం సైనికమైనప్పటికీ మూలంలో లేని ‘సైనికులు’ అనే ప్రత్యేకతను చేర్చకుండా ‘మంది’ని వాడాం.
- source_word: וְאָקוּמָה
  choice: లేచి
  rationale: קום యొక్క ‘లేచుట’ అనే ప్రతిమను నిలుపుతూ, వెంటనే కార్యానికి ఉపక్రమించడాన్ని సహజమైన తెలుగు సంయుక్త క్రియగా తెలిపాం.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: దావీదును వెంబడించడానికి
  rationale: רדף మరియు אַחֲרֵי కలిపి సైనిక సందర్భంలోని ‘దావీదును వెంబడించు’ అనే అర్థాన్ని ఇస్తాయి. తెలుగులో కర్మను ప్రత్యక్షంగా చూపడం సహజం.
- source_word: הַלָּיְלָה
  choice: ఈ రాత్రే
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న పదం సందర్భంలోని ప్రస్తుత రాత్రిని సూచిస్తుంది. ‘ఈ రాత్రే’ సమయాన్నీ తక్షణత్వాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కోహోర్టేటివ్ వరుసను మర్యాదపూర్వక ప్రతిపాదనగా ప్రధాన పాఠంలో వ్యక్తం చేసి, దాని మరింత అక్షరానుసార రూపాన్ని పాదటిప్పణిలో నిలిపాం. వ్యక్తినామాలకు తెలుగు బైబిలు సంప్రదాయానికి సమీపమైన రూపాలు వాడాం.
