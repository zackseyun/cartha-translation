source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם קְרָ֣א נָ֔א גַּ֖ם לְ/חוּשַׁ֣י הָ/אַרְכִּ֑י וְ/נִשְׁמְעָ֥ה מַה בְּ/פִ֖י/ו גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/005.yaml
  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: te
  text: అప్పుడు అబ్షాలోము, “దయచేసి అర్కీయుడైన హూషైని కూడా పిలవండి; అతడు ఏమి చెబుతాడో అతని మాటనూ విందాం” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קְרָא נָא
  choice: దయచేసి ... పిలవండి
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన נָא అభ్యర్థన లేదా మర్యాదపూర్వక భావాన్ని ఇస్తుంది; ‘దయచేసి’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: అహీతోఫెలుతో పాటు మరొక సలహాదారుని పిలవాలనే అదనపు భావాన్ని ‘కూడా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: అర్కీయుడైన హుషై
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, הָאַרְכִּי అనే ప్రాంతీయ/వంశసంబంధ విశేషణాన్ని ‘అర్కీయుడైన’గా అందించింది.
- source_word: וְנִשְׁמְעָה
  choice: విందాం
  rationale: ప్రథమ పురుష బహువచన కోహోర్టేటివ్ ప్రతిపాదనాత్మక సంకల్పాన్ని సూచిస్తుంది; ‘విందాం’ తెలుగులో దాన్ని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: מַה בְּפִיו
  choice: అతని నోటిలో ఏముందో
  rationale: హీబ్రూ మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ, దాని భావం అతడు చెప్పబోయే మాట లేదా సలహా అని పాదసూచికలో వివరిస్తుంది.
- source_word: גַּם הוּא
  choice: అతని మాట కూడా
  rationale: హుషై సలహాను కూడా వినాలనే అదనపు ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పూర్వ భాగంలోని అక్షరార్థ రూపకంతో కలిపి వాక్యం అర్థవంతంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘నోటిలో ఏముందో’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
