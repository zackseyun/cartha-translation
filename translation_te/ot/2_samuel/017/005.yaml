- from: అప్పుడు అబ్షాలోము, “దయచేసి అర్కీయుడైన హుషైని కూడా పిలవండి. అతని నోటిలో ఏముందో[a] అతని మాట కూడా విందాం” అన్నాడు.
  to: అప్పుడు అబ్షాలోము, “దయచేసి అర్కీయుడైన హూషైని కూడా పిలవండి; అతడు ఏమి చెబుతాడో అతని మాటనూ విందాం” అన్నాడు.
