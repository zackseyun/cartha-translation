  edition: WLC
  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: te
  text: అయితే ఒక యువకుడు వారిని చూసి అబ్షాలోముకు తెలియజేశాడు. అప్పుడు వారిద్దరూ త్వరగా వెళ్లి బహూరీములోని ఒక వ్యక్తి ఇంటికి వచ్చారు. అతని ప్రాంగణంలో ఒక బావి ఉంది; వారు అక్కడికి దిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు దానిలోకి దిగారు,’ అంటే బావిలోకి.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: యువకుడు
  rationale: ఈ పదం బాలుడు, యువకుడు, లేదా సేవకుడు అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ అతడు గమనించి స్వతంత్రంగా సమాచారం అందిస్తున్నందున, వయస్సు లేదా హోదాను అతిగా నిర్దిష్టం చేయకుండా ‘యువకుడు’ సహజంగా సరిపోతుంది.
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: נגד హిఫిల్ రూపం చెప్పడం లేదా సమాచారం అందించడం అనే భావాన్ని ఇస్తుంది. ‘తెలియజేశాడు’ సందర్భంలోని నివేదన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: హీబ్రూ ఇద్దరు వ్యక్తులను స్పష్టంగా సూచిస్తుంది; ‘వారిద్దరూ’ ఆ నిర్దిష్టతను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מְהֵרָה
  choice: త్వరగా
  rationale: ఈ క్రియావిశేషణ ప్రయోగం తొందరను సూచిస్తుంది; ‘త్వరగా’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భంలోని అత్యవసరతను కాపాడుతుంది.
- source_word: בֵּית אִישׁ
  choice: ఒక వ్యక్తి ఇంటికి
  rationale: నిర్మాణబద్ధ పదబంధాన్ని తెలుగులో సహజమైన క్రమంలో అనువదిస్తూ, ఆ ఇంటి యజమాని పేరు చెప్పబడలేదనే విషయాన్ని నిలుపుతుంది.
- source_word: בְּבַחוּרִים
  choice: బహూరీములోని
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, స్థలార్థాన్ని తెలుగు విభక్తితో తెలిపింది.
- source_word: בְאֵר
  choice: బావి
  rationale: בְאֵר సాధారణంగా బావిని సూచిస్తుంది. తరువాతి వచనంలో దాని నోరు కప్పడం కూడా ఈ అర్థానికి సరిపోతుంది; అందువల్ల ‘నీటి తొట్టి’ వంటి ప్రత్యామ్నాయాన్ని ఎంచుకోలేదు.
- source_word: בַּחֲצֵרוֹ
  choice: అతని ప్రాంగణంలో
  rationale: חָצֵר ఇంటికి సంబంధించిన ఆవరణ లేదా ముంగిలిని సూచిస్తుంది. ‘ప్రాంగణం’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: וַיֵּרְדוּ שָׁם
  choice: వారు అక్కడికి దిగారు
  rationale: హీబ్రూ అక్షరార్థంగా ‘వారు అక్కడ దిగారు’ అని చెబుతుంది. బావిలోకి దిగారనే భావం సందర్భంలో స్పష్టమైనా, మూలంలోని స్వల్ప పరోక్షతను ప్రధాన పాఠంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస సంఘటనలను స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం; భావసంబంధాన్ని మాత్రం కాపాడాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న చివరి క్రియ తర్వాత ఉంచాం.
