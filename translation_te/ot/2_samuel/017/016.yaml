  revised_text: 'ఇప్పుడు వెంటనే కబురు పంపి దావీదుకు ఇలా చెప్పండి: “ఈ రాత్రి అరణ్యపు మైదానాల్లో[a] ఉండిపోవద్దు. తప్పకుండా దాటి వెళ్లండి; లేకపోతే రాజు, ఆయనతో ఉన్న ప్రజలందరూ మింగివేయబడతారు.”'
