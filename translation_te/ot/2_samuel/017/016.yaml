  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. అత్యవసర ఆజ్ఞ స్వరాన్ని నిలిపింది; మూలంలోని ‘మింగివేయబడటం’ అనే బలమైన రూపకాన్ని సరళీకరించి ‘నాశనం’ అని మార్చలేదు.
