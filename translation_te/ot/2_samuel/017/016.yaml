  source_fidelity: 'The draft accurately preserves the urgency, the emphatic command to cross, the warning relation, the title “the king,” and the passive vividness of “be swallowed up.” The main wording needs a small grammatical correction: దావీదుతో means “with David,” whereas the Hebrew requires “to David.”'
