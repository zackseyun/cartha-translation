  text: וְ/עַתָּ֡ה שִׁלְח֣וּ מְהֵרָה֩ וְ/הַגִּ֨ידוּ לְ/דָוִ֜ד לֵ/אמֹ֗ר אַל תָּ֤לֶן הַ/לַּ֨יְלָה֙ בְּ/עַֽרְב֣וֹת הַ/מִּדְבָּ֔ר וְ/גַ֖ם עָב֣וֹר תַּעֲב֑וֹר פֶּ֚ן יְבֻלַּ֣ע לַ/מֶּ֔לֶךְ וּ/לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: te
  text: 'ఇప్పుడు వెంటనే కబురు పంపి దావీదుకు ఇలా చెప్పండి: “ఈ రాత్రి అరణ్యపు మైదానాల్లో[a] ఉండిపోవద్దు. తప్పకుండా దాటి వెళ్లండి; లేకపోతే రాజు, ఆయనతో ఉన్న ప్రజలందరూ మింగివేయబడతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరణ్యంలోని దాటే ప్రదేశాల దగ్గర.” హీబ్రూ పదం సాధారణంగా మైదానాలు లేదా లోతట్టు ప్రాంతాలను సూచిస్తుంది; అయితే వెంటనే దాటి వెళ్లాలనే ఆజ్ఞ ఉన్న ఈ సందర్భంలో నది దాటే ప్రదేశాలను కూడా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: అత్యవసరంగా చేపట్టవలసిన తదుపరి చర్యను పరిచయం చేసే సంభాషణ సూచకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: వెంటనే కబురు పంపి
  rationale: ఆజ్ఞలోని అత్యవసరతను స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో పంపించేది దావీదుకు సమాచారం తీసుకెళ్లే సందేశమే.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: దావీదుతో ఇలా చెప్పండి
  rationale: హీబ్రూ సందేశ పరిచయ సూత్రాన్ని పదేపదే అనుకరించకుండా, దాని భావాన్ని సహజమైన కథన తెలుగులో నిలుపుతుంది.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: ఈ రాత్రి … ఉండిపోవద్దు
  rationale: לון అంటే రాత్రి బసచేయడం లేదా గడపడం; ‘ఉండిపోవద్దు’ సందర్భంలోని ఆలస్యపడకూడదనే హెచ్చరికను సహజంగా తెలియజేస్తుంది.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: అరణ్య మైదానాల్లో
  rationale: עֲרָבוֹת సాధారణంగా మైదానాలు లేదా లోతట్టు విశాల ప్రాంతాలను సూచిస్తుంది. దాటే ప్రదేశాలు అనే సందర్భానుగుణ అర్థసంభావ్యతను పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో ప్రత్యక్ష పదార్థాన్ని కాపాడింది.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: తప్పకుండా దాటి వెళ్లండి
  rationale: క్రియావ్యయ సంపూర్ణ రూపం మరియు సమాపక క్రియ కలయిక ఇచ్చే బలమైన ఆజ్ఞను ‘తప్పకుండా’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: హెచ్చరికను పరిచయం చేసే పదాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: יְבֻלַּע
  choice: మింగివేయబడతారు
  rationale: సైనిక వినాశాన్ని సూచించే బלע ధాతువు యొక్క స్పష్టమైన ‘మింగివేయడం’ రూపకాన్ని కాపాడుతుంది.
- source_word: לַמֶּלֶךְ וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: రాజూ, ఆయనతో ఉన్న ప్రజలంతా
  rationale: దావీదు అనే పేరుకు బదులు మూలపాఠ్యంలో ఉన్న రాజబిరుదును నిలుపుతూ, עָם అనే విస్తృత పదాన్ని ‘ప్రజలు’గా అనువదిస్తుంది.
