translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ సింహ-హృదయ ఉపమానం నిలుపబడింది; ‘కరిగిపోవడం’ అనే మూల రూపకం తెలుగులో కరుణ కలగడం అనే అపార్థాన్ని కలిగించగలందున ప్రధాన పాఠంలో దాని సందర్భార్థం ఇచ్చి, మూల నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
