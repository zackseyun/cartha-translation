source:
  edition: WLC
  text: וְ/ה֣וּא גַם בֶּן חַ֗יִל אֲשֶׁ֥ר לִבּ֛/וֹ כְּ/לֵ֥ב הָ/אַרְיֵ֖ה הִמֵּ֣ס יִמָּ֑ס כִּֽי יֹדֵ֤עַ כָּל יִשְׂרָאֵל֙ כִּי גִבּ֣וֹר אָבִ֔י/ךָ וּ/בְנֵי חַ֖יִל אֲשֶׁ֥ר אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: te
  text: సింహం హృదయం వంటి హృదయం గల పరాక్రమశాలి[a] కూడా పూర్తిగా ధైర్యం కోల్పోతాడు[b]. ఎందుకంటే నీ తండ్రి మహా యోధుడని, అతనితో ఉన్నవారు పరాక్రమశాలులని ఇశ్రాయేలీయులందరికీ తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శౌర్యవంతుడు.’ ఇదే חַיִל ఆధారిత నుడికారం ఈ వచనం చివర బహువచనంలోనూ వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో ‘కరిగిపోతూ కరిగిపోతాడు’ అనే బలమైన నిర్మాణం ఉంది; భావం: అతడు తప్పకుండా పూర్తిగా ధైర్యం కోల్పోతాడు.'
    reason: source_form
lexical_decisions:
- source_word: בֶּן חַיִל / בְנֵי חַיִל
  choice: పరాక్రమశాలి / పరాక్రమశాలులు
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘శక్తి/పరాక్రమపు కుమారుడు/కుమారులు’ అని ఉన్నా, ధైర్యం మరియు యుద్ధసామర్థ్యం గల వ్యక్తులను సూచిస్తుంది. ‘పరాక్రమశాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి, రెండు సందర్భాల్లోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: సింహ హృదయంలాంటి హృదయం గల
  rationale: హీబ్రూలోని సింహంతో చేసిన స్పష్టమైన ఉపమానాన్ని సంక్షిప్త విశేషణంగా మార్చకుండా నిలుపుతుంది.
- source_word: הִמֵּס יִמָּס
  choice: పూర్తిగా ధైర్యం కోల్పోతాడు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ బలమైన నిశ్చయాన్నీ సంపూర్ణతనూ తెలియజేస్తుంది. అక్షరార్థమైన ‘కరిగిపోతాడు’ తెలుగులో ఇక్కడ తప్పుదారి పట్టించవచ్చు; సందర్భంలో ఉద్దేశించిన ధైర్యం నీరుగారడాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరికీ తెలుసు
  rationale: స్థిరంగా అందరికీ తెలిసిన విషయాన్ని తెలిపే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: גִבּוֹר
  choice: మహా యోధుడు
  rationale: దావీదు బలవంతుడైన యుద్ధవీరుడని తెలిపే నామవాచక బలాన్ని, సైనిక సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్నవారు
  rationale: సంబంధవాచక పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
