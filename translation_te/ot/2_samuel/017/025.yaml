  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వ్యక్తుల పేర్లను సాధారణ తెలుగు బైబిలు రూపాలకు సమీపంగా ఉంచి, హీబ్రూ సభ్యోక్తిని ‘కలిశాడు’ అని మితంగా అనువదించాం.
