  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: te
  text: అబ్షాలోము యోవాబుకు బదులుగా అమాశాను సైన్యాధిపతిగా నియమించాడు. అమాశా ఇశ్రాయేలీయుడైన ఇత్రా అనే వ్యక్తి కుమారుడు. ఇత్రా నాహాషు కుమార్తెయైన అబీగయీలు దగ్గరకు వెళ్లినవాడు. అబీగయీలు యోవాబు తల్లియైన సెరూయా సహోదరి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: సైన్యాధిపతిగా నియమించాడు
  rationale: సైన్యంపై అధికారిగా ఉంచడాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחַת יוֹאָב
  choice: యోవాబుకు బదులుగా
  rationale: ఇక్కడ תַּחַת స్థలాన్ని కాకుండా ఒకరి స్థానంలో మరొకరిని నియమించడాన్ని సూచిస్తుంది.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: ఇత్రా అనే వ్యక్తి కుమారుడు
  rationale: హీబ్రూ వాక్యంలోని అనిర్దిష్టమైన אִישׁ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַיִּשְׂרְאֵלִי
  choice: ఇశ్రాయేలీయుడైన
  rationale: అందించిన మసొరెటిక్ పాఠంలోని ‘ఇశ్రాయేలీయుడు’ అనే రూపాన్నే అనుసరిస్తుంది; సమాంతర పాఠాంతరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: אֲשֶׁר בָּא אֶל
  choice: తో కలిశాడు
  rationale: లైంగిక సంయోగాన్ని సూచించే హీబ్రూ సభ్యోక్తిని అసభ్యంగా కాకుండా ఆధునిక తెలుగులో అర్థవంతంగా వ్యక్తపరుస్తుంది.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: నాహాషు కుమార్తెయైన అబీగయీలు
  rationale: పితృసంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: యోవాబు తల్లి సెరూయా సహోదరి
  rationale: సెరూయా ఎవరో తెలిపే అనుబంధ గుర్తింపును కాపాడుతూ బంధుత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
