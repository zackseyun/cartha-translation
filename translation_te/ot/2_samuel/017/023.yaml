  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన కథన శైలి వాడబడింది. హీబ్రూ వరుస చర్యల క్రమాన్ని నిలుపుతూ, తెలుగులో అతిగా కృత్రిమంగా వినిపించే పదప్రతిపద నిర్మాణాలను నివారించాం. మూలంలోని అనిశ్చితులను పాదటిప్పణుల్లో భద్రపరిచాం.
