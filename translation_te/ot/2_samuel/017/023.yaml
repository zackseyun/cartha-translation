source:
  edition: WLC
  text: וַ/אֲחִיתֹ֣פֶל רָאָ֗ה כִּ֣י לֹ֣א נֶעֶשְׂתָה֮ עֲצָת/וֹ֒ וַ/יַּחֲבֹ֣שׁ אֶֽת הַ/חֲמ֗וֹר וַ/יָּ֜קָם וַ/יֵּ֤לֶךְ אֶל בֵּית/וֹ֙ אֶל עִיר֔/וֹ וַ/יְצַ֥ו אֶל בֵּית֖/וֹ וַ/יֵּחָנַ֑ק וַ/יָּ֕מָת וַ/יִּקָּבֵ֖ר בְּ/קֶ֥בֶר אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: te
  text: అహీతోఫెలు తన సలహా అమలు కాలేదని[a] చూసినప్పుడు, గాడిదకు జీను కట్టి, లేచి, తన పట్టణంలోని తన ఇంటికి వెళ్లాడు. తన ఇంటివారికి ఆదేశాలు ఇచ్చి[b], ఉరి వేసుకొని[c] చనిపోయాడు. అతని తండ్రి సమాధిలో అతన్ని పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన సలహా చేయబడలేదని”; అంటే అది అమలు చేయబడలేదని.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన ఇంటి వ్యవహారాలను చక్కబెట్టుకొని.” హీబ్రూ మరింత అక్షరార్థంగా, “తన ఇంటికి/ఇంటివారికి ఆదేశించాడు” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తనను తాను గొంతు బిగించుకొని.” ఈ క్రియ ఉరి వేయడం లేదా గొంతు బిగించడం వల్ల కలిగే మరణాన్ని సూచించగలదు; ఇక్కడ అహీతోఫెలు ఆత్మహత్యను వివరిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: తన సలహా
  rationale: עֵצָה రాజకీయ సందర్భంలో సలహా, ఆలోచన లేదా వ్యూహాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘సలహా’ సహజంగా ఉండి advisory భావాన్ని నిలుపుతుంది.
- source_word: לֹא נֶעֶשְׂתָה
  choice: అమలు కాలేదు
  rationale: అక్షరార్థంగా ‘చేయబడలేదు’; ఇక్కడ అహీతోఫెలు చెప్పిన సలహా కార్యరూపం దాల్చలేదనే సందర్భార్థాన్ని ‘అమలు కాలేదు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: గాడిదకు జీను కట్టి
  rationale: חבש అనే క్రియ గాడిదను ప్రయాణానికి సిద్ధం చేయడం, సాధారణంగా జీను కట్టడం అని సూచిస్తుంది. హీబ్రూలో స్వామ్యప్రత్యయం లేనందున ‘తన గాడిద’ అని చేర్చలేదు.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: హీబ్రూ కథన క్రమంలోని సాధారణ చర్యను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: తన పట్టణంలోని తన ఇంటికి
  rationale: రెండు గమ్యసూచక పదబంధాలనూ సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: తన ఇంటివారికి ఆదేశాలు ఇచ్చి
  rationale: ‘తన ఇల్లు/ఇంటివారికి ఆదేశించాడు’ అనే హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంది. ‘తన ఇంటి వ్యవహారాలను చక్కబెట్టాడు’ అనేది సాధ్యమైన సందర్భార్థం అయినా మూలంలో స్పష్టంగా లేని భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וַיֵּחָנַק
  choice: ఉరి వేసుకొని
  rationale: חנק నిఫాల్ రూపం ఉక్కిరిబిక్కిరి కావడం లేదా ఉరి/గొంతు బిగింపు ద్వారా మరణించడాన్ని సూచించగలదు. సందర్భంలో ఇది ఆత్మహత్య కాబట్టి ప్రతిబింబార్థకమైన ‘ఉరి వేసుకొని’ సహజంగా ఉంటుంది; పదార్థంలోని విస్తృతతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: בְּקֶבֶר אָבִיו
  choice: అతని తండ్రి సమాధిలో
  rationale: קֶבֶרకు సమాధి లేదా సమాధిగృహం అనే అర్థాలు ఉండవచ్చు. ‘తండ్రి సమాధి’ మూలంలోని ఏకవచన బంధుత్వ సూచనను యథాతథంగా నిలుపుతుంది.
