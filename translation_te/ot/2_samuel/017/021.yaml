base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: te
  text: వారు వెళ్లిపోయిన తర్వాత, వారు బావిలోనుంచి పైకి వచ్చి వెళ్లి రాజైన దావీదుకు విషయం తెలియజేశారు. వారు దావీదుతో, “లేచి, త్వరగా నీటిని దాటండి; ఎందుకంటే అహీతోపెలు మీకు వ్యతిరేకంగా ఇలా సలహా ఇచ్చాడు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵהַבְּאֵר
  choice: బావిలోనుంచి
  rationale: בְּאֵר సాధారణంగా ‘బావి’; సందర్భంలో వారు దానిలో దాగి ఉండి పైకి వచ్చిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְעִבְרוּ מְהֵרָה אֶת הַמַּיִם
  choice: త్వరగా నీటిని దాటి వెళ్లండి
  rationale: עָבַר మరియు אֶת־הַמַּיִם యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతూ, నీటి ప్రవాహాన్ని దాటాలనే ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי כָכָה יָעַץ עֲלֵיכֶם
  choice: ఎందుకంటే అహీతోపెలు మీకు వ్యతిరేకంగా ఇచ్చిన సలహా ఇదే
  rationale: כָכָה ను ‘ఇదే’గా, יָעַץ ను ‘సలహా ఇచ్చాడు’గా, עֲלֵיכֶם లోని ప్రతికూల దిశను ‘మీకు వ్యతిరేకంగా’గా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. దావీదును ఉద్దేశించిన బహువచన ఆజ్ఞారూపాన్ని ‘వెళ్లండి’తో నిలిపి, అది దావీదు మరియు అతని వెంటివారిని సూచించే అవకాశాన్ని కాపాడింది.
