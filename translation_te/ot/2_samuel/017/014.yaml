  to: అప్పుడు అబ్షాలోము, ఇశ్రాయేలు పురుషులందరూ, “అహీతోఫెలు సలహాకంటే అర్కీయుడైన హూషై సలహా మంచిది” అన్నారు. ఎందుకంటే అహీతోఫెలు మంచి సలహాను భగ్నం చేయాలని యాహ్వే నిర్ణయించాడు[a], అబ్షాలోము మీదికి విపత్తు[b] తెచ్చుటకు.
  rationale: యెహోవా నామాన్ని ప్రాజెక్టు నిర్ణయం ప్రకారం “యాహ్వే”గా సవరించాం. మూలంలోని స్వామ్య నిర్మాణాన్ని కాపాడేందుకు “ఇచ్చిన”ను తొలగించాం; వ్యూహాత్మక సలహా సందర్భాన్ని స్పష్టంగా తెలియజేయడానికి “ఆలోచన” స్థానంలో “సలహా”ను వాడాం. కారణం మరియు ఉద్దేశ సంబంధం, అలాగే పాదటిప్పణి సూచికలు వాటి సంబంధిత పదాల వద్దే ఉంచబడ్డాయి.
