source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: te
  text: అప్పుడు అబ్షాలోము, ఇశ్రాయేలు పురుషులందరూ, “అహీతోఫెలు సలహాకంటే అర్కీయుడైన హూషై సలహా మంచిది” అన్నారు. ఎందుకంటే అహీతోఫెలు మంచి సలహాను భగ్నం చేయాలని యాహ్వే నిర్ణయించాడు[a], అబ్షాలోము మీదికి విపత్తు[b] తెచ్చుటకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆజ్ఞాపించాడు.” హెబ్రీ క్రియకు సాధారణంగా “ఆజ్ఞాపించు” అని అర్థం; ఇక్కడ అది అహీతోఫెలు సలహాను విఫలం చేయాలనే యాహ్వే ప్రభావవంతమైన నిర్ణయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “విపత్తు” అని అనువదించిన హెబ్రీ పదానికి “కీడు,” “అపాయం” అని కూడా అర్థాలు ఉండవచ్చు; ఇక్కడ అది అబ్షాలోముకు కలిగే నాశనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. సమ్మిళిత కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియను వాడాం.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమూహార్థకం; మూలంలోని లింగసూచనను నిలిపి ఉంచుతుంది.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: ఆలోచనకంటే ... ఆలోచనే మంచిది
  rationale: מִן పోలికను సూచిస్తున్నందున טוֹבָה ఇక్కడ తులనాత్మకంగా పనిచేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘కంటే ... మంచిది’ సహజం.
- source_word: עֲצַת
  choice: ఆలోచన
  rationale: ఈ రాజసభ, యుద్ధవ్యూహ సందర్భంలో సలహా మరియు పథకం అనే రెండు ఛాయలనూ ‘ఆలోచన’ సహజంగా అందిస్తుంది.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: అర్కీయుడైన హూషై
  rationale: Gentilic הָאַרְכִּיని వ్యక్తి Herkunft/వర్గసూచకంగా సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: צִוָּה
  choice: నిర్ణయించాడు
  rationale: ఈ సందర్భంలో క్రియ యెహోవా చేసిన ప్రభావవంతమైన నిర్ధారణను సూచిస్తుంది. సాధారణ అర్థమైన ‘ఆజ్ఞాపించాడు’ను పాదటిప్పణిలో నిలిపాం.
- source_word: לְהָפֵר
  choice: భగ్నం చేయాలని
  rationale: פרר హిఫిల్ రూపం ఆలోచనను అమలుకాకుండా చేయడం, విఫలం చేయడం అనే వ్యూహాత్మక భావాన్ని ఇస్తుంది.
- source_word: הַטּוֹבָה
  choice: మంచి
  rationale: అహీతోఫెలు ఆలోచనను మూలపాఠమే ‘మంచిది’గా అంచనా వేస్తుంది; దాని నైతిక లేదా వ్యూహాత్మక స్వభావాన్ని అనవసరంగా నిర్ధారించలేదు.
- source_word: לְבַעֲבוּר הָבִיא
  choice: రప్పించడానికి
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా లక్ష్యఫలితాన్ని తెలియజేస్తుంది; తెలుగులో ఈ రూపం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: הָרָעָה
  choice: విపత్తు
  rationale: ఇక్కడ పదం అబ్షాలోము మీదికి వచ్చే నాశనం లేదా అపాయాన్ని సూచిస్తుంది; నైతిక దుష్టత్వం అని ముందుగానే నిర్ణయించకుండా సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన ప్రత్యక్ష రూపంలో ఉంచాం.
- issue: צִוָּה לְהָפֵרలో దైవ చర్య
  choice: భగ్నం చేయాలని యెహోవా నిర్ణయించాడు
  alternative: భగ్నం చేయాలని యెహోవా ఆజ్ఞాపించాడు
  rationale: వాక్యం అహీతోఫెలు ఆలోచన విఫలమవడంపై యెహోవా ప్రభావవంతమైన సంకల్పాన్ని ఆపాదిస్తుంది. ఏ ప్రత్యేక సిద్ధాంతవ్యవస్థను చొప్పించకుండా, ‘ఆజ్ఞాపించాడు’ అనే పదార్థాన్ని పాదటిప్పణిలో చూపాం.
- issue: దైవ చర్యకు సంబంధించిన הָרָעָה
  choice: విపత్తు
  alternative: కీడు
  rationale: ఈ సందర్భంలో అబ్షాలోము మీదికి వచ్చే తీర్పురూప నాశనం ఉద్దేశించబడింది. అయినా హెబ్రీ పదంలోని విస్తృతమైన ‘కీడు/అపాయం’ భావపరిధిని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. రాజసభ వ్యూహసందర్భానికి ‘ఆలోచన’, దైవనామానికి ‘యెహోవా’, తీర్పుగా వచ్చే హానికి ‘విపత్తు’ ఎంచుకున్నాం. మూలంలోని కారణ–ఉద్దేశ సంబంధాన్ని ‘ఎందుకంటే ... రప్పించడానికి’ నిర్మాణంతో స్పష్టంగా నిలిపాం.
