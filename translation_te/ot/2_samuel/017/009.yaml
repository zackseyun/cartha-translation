  source_fidelity: ‘దాక్కొని ఉన్నాడు’ నిఫాల్ రూపంలోని దాగి/దాచబడి ఉన్న స్థితికన్నా స్వయంగా దాక్కోవడాన్ని కొద్దిగా ఎక్కువగా సూచిస్తుంది. అలాగే כִּנְפֹל בָּהֶם కు సమీప సందర్భంలో ఉన్న ‘అతడు’నే కర్తగా గ్రహించి, ‘వారిమీద దాడి చేసినప్పుడు’ అని చెప్పడం మూలవాక్యంలోని సైనిక చర్యను మరింత నేరుగా ప్రతిబింబిస్తుంది.
