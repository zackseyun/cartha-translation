id: 2SA.17.9
reference: 2 Samuel 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: te
  text: చూడండి, ప్రస్తుతం అతడు ఏదో ఒక గోతిలోనో మరొక చోటో దాగి ఉన్నాడు.[a] మొదట్లో అతడు వారిమీద దాడి చేసినప్పుడు, ఆ సంగతి విన్నవాడు, ‘అబ్షాలోమును అనుసరిస్తున్న ప్రజల్లో సంహారం జరిగింది’ అని అంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏదో ఒక పల్లంలోనో’; ఇక్కడి హీబ్రూ పదం గోతులు, పల్లాలు లేదా భూభాగంలో దాగడానికి అనువైన ఇలాంటి లోతైన ప్రదేశాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సంహారం జరిగింది’ అనే మాటను ‘ఓటమి కలిగింది’ లేదా ‘తీవ్రమైన దెబ్బ తగిలింది’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం వ్యాధి వల్ల వచ్చే తెగులును కాక, యుద్ధంలో జరిగే తీవ్రమైన కొట్టివేత లేదా భారీ నష్టాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: చూడండి, ప్రస్తుతం
  rationale: הִנֵּה శ్రోత దృష్టిని సజీవంగా ఆకర్షిస్తుంది; עַתָּה ప్రస్తుత తక్షణ పరిస్థితిని నొక్కి చెబుతుంది. ఆధునిక ప్రామాణిక తెలుగులో ఈ కలయిక సహజంగానూ గౌరవప్రదంగానూ ఉంటుంది.
- source_word: נֶחְבָּא
  choice: దాక్కొని ఉన్నాడు
  rationale: నిఫాల్ రూపం దాగి ఉన్న స్థితిని సూచిస్తుంది. తెలుగు సహజ ప్రయోగం ప్రకారం ఇలా అనువదించినా, అతడు ఎక్కడ దాగి ఉన్నాడనే అంశానికే ప్రధాన్యత ఉంటుంది.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: ఏదో ఒక గోతిలో
  rationale: פְּחָתִים భూభాగంలోని గోతులు, పల్లాలు లేదా దాగడానికి అనువైన లోతైన ప్రదేశాలను సూచించగలదు. ప్రధాన పాఠంలో ‘గోతి’ సూటిగా ఉంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: మరేదైనా చోటులో
  rationale: אוֹ ద్వారా ముందటి నిర్దిష్ట భూభాగానికి ప్రత్యామ్నాయం చూపబడుతోంది. ‘మరేదైనా చోటులో’ ఆ విరుద్ధ ప్రత్యామ్నాయాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: మొదటి దాడిలోనే వారిలో కొందరు పడిపోతే
  rationale: సైనిక సందర్భంలో נפל ב־ సమూహంలో ప్రాణనష్టం కలగడాన్ని సూచించవచ్చు. కర్తను దావీదుగా నిర్ణయించకుండా, అబ్షాలోము పక్షంలోని కొందరు పడిపోవడం అనే సందర్భోచిత భావాన్ని నిలుపుతుంది.
- source_word: הַשֹּׁמֵעַ
  choice: ఆ సంగతి విన్నవాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం ఇక్కడ సాధారణ ప్రతినిధి అర్థంలో ఉంది. ‘విన్నవాడు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מַגֵּפָה
  choice: సంహారం
  rationale: ఈ యుద్ధ సందర్భంలో పదం వ్యాధిని కాదు, తీవ్రమైన దెబ్బ లేదా సైనిక నష్టాన్ని సూచిస్తుంది. ‘సంహారం’ తీవ్రతను చూపుతుంది; ‘ఓటమి/దెబ్బ’ సాధ్యమైన ప్రత్యామ్నాయాలు.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: అబ్షాలోమును అనుసరిస్తున్న ప్రజలు
  rationale: אַחֲרֵי ఇక్కడ భౌతికంగా వెనుక ఉండడాన్ని కాక, రాజకీయ లేదా సైనిక విధేయతతో అనుసరించడాన్ని సూచిస్తుంది.
