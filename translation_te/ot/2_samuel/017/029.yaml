  text: וּ/דְבַ֣שׁ וְ/חֶמְאָ֗ה וְ/צֹאן֙ וּ/שְׁפ֣וֹת בָּקָ֔ר הִגִּ֧ישׁוּ לְ/דָוִ֛ד וְ/לָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ לֶ/אֱכ֑וֹל כִּ֣י אָמְר֔וּ הָ/עָ֗ם רָעֵ֛ב וְ/עָיֵ֥ף וְ/צָמֵ֖א בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: te
  text: తేనె, పెరుగు[a], గొర్రెలు[b], పశువుల పాలతో చేసిన జున్ను[c] తెచ్చి, దావీదుకూ అతనితో ఉన్న ప్రజలకూ తినడానికి అందించారు. ఎందుకంటే, “అరణ్యంలో ప్రజలు ఆకలితో, అలసటతో, దాహంతో ఉన్నారు” అని వారు అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెన్న’ లేదా ‘చిక్కని పాల పదార్థం’ అని కూడా అనువదించవచ్చు. חֶמְאָה అనే హెబ్రీ పదం పాలతో చేసిన పదార్థాన్ని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘చిన్న పశువులు’ అని కూడా అనువదించవచ్చు; צֹאן అనే హెబ్రీ పదం గొర్రెలు, మేకలు రెండింటినీ సమూహంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: שְׁפוֹת בָּקָר అనే అరుదైన హెబ్రీ పదబంధం పశువుల పాలతో చేసిన పదార్థాన్ని సూచిస్తుంది; అది ఖచ్చితంగా ఏ రకమైన పాల పదార్థమో స్పష్టంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: తేనె
  rationale: ఈ ఆహార పదార్థాల జాబితాలో సాధారణ అర్థమైన ‘తేనె’ సహజంగా సరిపోతుంది; తీపి పాకం అనే విస్తృత అర్థం ఇక్కడ అవసరం లేదు.
- source_word: חֶמְאָה
  choice: పెరుగు
  rationale: ఈ హెబ్రీ పదం ఆధునిక పద్ధతిలో చేసిన వెన్నకన్నా చిక్కగా లేదా పులియబెట్టిన పాల పదార్థాన్ని సూచించే అవకాశం ఎక్కువ; సాధారణ తెలుగు పాఠకునికి ‘పెరుగు’ సహజమైన సమీప పదం.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ సమూహవాచక పదం గొర్రెలతో పాటు మేకలనూ సూచించగలిగినా, సంక్షిప్తమైన ప్రధాన అర్థంగా ‘గొర్రెలు’ ఎంచుకోబడింది; విస్తృత అర్థం పాదసూచికలో ఉంచబడింది.
- source_word: שְׁפוֹת בָּקָר
  choice: ఆవుపాలతో చేసిన జున్ను
  rationale: ఈ అరుదైన పదబంధం పశువుల పాలతో చేసిన ఘన పాల పదార్థాన్ని సూచిస్తుంది. ఖచ్చితమైన తయారీ విధానాన్ని నిర్ణయించకుండా, తెలుగులో అర్థమయ్యేలా ‘ఆవుపాలతో చేసిన జున్ను’ అని అనువదించబడింది.
- source_word: הִגִּישׁוּ
  choice: తెచ్చి ... అందించారు
  rationale: కేవలం తీసుకురావడమే కాక ఎవరికైనా సమర్పించడం లేదా అందుబాటులో ఉంచడం అనే క్రియ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: దావీదుకూ అతనితో ఉన్న ప్రజలకూ
  rationale: దావీదు మరియు అతనితో ఉన్న ప్రజలు అనే రెండు గ్రహీత వర్గాలను హెబ్రీ నిర్మాణానికి అనుగుణంగా స్పష్టంగా ఉంచుతుంది.
- source_word: לֶאֱכֹל
  choice: తినడానికి
  rationale: హెబ్రీ క్రియార్థక రూపంలోని ప్రయోజన భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי אָמְרוּ
  choice: ఎందుకంటే ... అని వారు అన్నారు
  rationale: వారు ఆ ఆహారం అందించిన కారణాన్ని పరిచయం చేసే כִּי భావాన్ని, బహువచన క్రియను నిలుపుతుంది.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: ఆకలితో, అలసటతో, దాహంతో ఉన్నారు
  rationale: మూడు స్థితుల వరుసను అతిశయింపకుండా, ఆధునిక తెలుగులో లయబద్ధంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇది తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన నిర్జన ప్రాంతాన్నీ సూచించగలదు; ‘అరణ్యం’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
