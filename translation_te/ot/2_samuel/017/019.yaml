translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. వస్తువుల పదార్థం లేదా దాచిన విధానాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయలేదు; చివరి వాక్యభాగంలోని నిష్క్రియ భావాన్ని సహజ తెలుగులో నిలిపింది.
