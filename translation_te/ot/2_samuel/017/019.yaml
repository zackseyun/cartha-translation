  text: וַ/תִּקַּ֣ח הָ/אִשָּׁ֗ה וַ/תִּפְרֹ֤שׂ אֶת הַ/מָּסָךְ֙ עַל פְּנֵ֣י הַ/בְּאֵ֔ר וַ/תִּשְׁטַ֥ח עָלָ֖י/ו הָֽ/רִפ֑וֹת וְ/לֹ֥א נוֹדַ֖ע דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/019.yaml
  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ ఒక తెరను తీసుకొని బావి నోటి మీద పరచి, దానిమీద నూరిన ధాన్యాన్ని చల్లింది; ఏ విషయమూ తెలియలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: אִשָּׁה అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. సందర్భంలో ఇంటి స్త్రీని సూచిస్తున్నందున, అదనపు వ్యాఖ్యానం లేకుండా ‘ఆ స్త్రీ’ సహజంగా ఉంటుంది.
- source_word: הַמָּסָךְ
  choice: ఒక కప్పు
  rationale: מָסָךְ కప్పు, తెర లేదా ఆవరణను సూచిస్తుంది. ఇక్కడ బావిని దాచేందుకు ఉపయోగించిన వస్తువు యొక్క పదార్థాన్ని నిర్దిష్టం చేయకుండా ‘ఒక కప్పు’ అని అనువదించడం సరైనది.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: బావి నోటి మీద
  rationale: అక్షరార్థంగా ‘బావి ముఖం/ఉపరితలం మీద.’ బావి తెరుచుకున్న భాగాన్ని సూచించేందుకు తెలుగులో ‘బావి నోటి మీద’ సహజమైన నుడికారం.
- source_word: וַתִּשְׁטַח
  choice: చల్లింది
  rationale: שׁטח అంటే పరచడం లేదా విస్తరింపజేయడం. నలగగొట్టిన ధాన్యాన్ని కప్పుపై వేసి దాచిన సందర్భంలో ‘చల్లింది’ సహజంగా చర్యను తెలియజేస్తుంది.
- source_word: הָרִפוֹת
  choice: నలగగొట్టిన ధాన్యం
  rationale: רִפוֹת నూరిన, దంచిన లేదా నలగగొట్టిన ధాన్య పదార్థాన్ని సూచిస్తుంది. ‘నలగగొట్టిన ధాన్యం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి వ్యవసాయ సంబంధిత వివరాన్ని నిలుపుతుంది.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: ఆ సంగతి ఎవరికీ తెలియలేదు
  rationale: అక్షరార్థం ‘మరియు ఒక విషయం తెలియబడలేదు.’ తెలుగులో సహజమైన నిష్క్రియార్థాన్ని ఇచ్చే ‘ఆ సంగతి ఎవరికీ తెలియలేదు’ అనే రూపం, అది గమనించబడలేదనే సందర్భార్థాన్ని బలవంతంగా జోడించకుండా నిలుపుతుంది.
