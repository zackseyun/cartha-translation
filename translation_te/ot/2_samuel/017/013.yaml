source:
  edition: WLC
  text: וְ/אִם אֶל עִיר֙ יֵֽאָסֵ֔ף וְ/הִשִּׂ֧יאוּ כָֽל יִשְׂרָאֵ֛ל אֶל הָ/עִ֥יר הַ/הִ֖יא חֲבָלִ֑ים וְ/סָחַ֤בְנוּ אֹת/וֹ֙ עַד הַ/נַּ֔חַל עַ֛ד אֲשֶֽׁר לֹא נִמְצָ֥א שָׁ֖ם גַּם צְרֽוֹר־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: te
  text: ఒకవేళ అతడు ఏదైనా పట్టణంలోకి వెనక్కి వెళ్లితే, ఇశ్రాయేలీయులందరూ ఆ పట్టణానికి తాళ్లు తీసుకువస్తారు; మనం దానిని వాగు[a] వరకు ఈడ్చుకుపోతాం, అక్కడ ఒక చిన్న రాయి కూడా కనిపించకుండా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాగు లోయ.’ హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును లేదా దాని లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף
  choice: వెనక్కి వెళ్లితే
  rationale: ఈ నిఫ్అల్ రూపం అక్షరార్థంగా ‘చేర్చబడితే’ అనే భావాన్ని ఇవ్వగలిగినా, ఇక్కడ దావీదు ఒక పట్టణంలోకి వెనుదిరిగి తలదాచుకునే సైనిక సందర్భాన్ని సూచిస్తుంది. ‘వెనక్కి వెళ్లితే’ సహజంగా ఉండి, ఆశ్రయం పొందాడనే భావాన్ని అనవసరంగా స్పష్టీకరించదు.
- source_word: וְהִשִּׂיאוּ ... חֲבָלִים
  choice: తాళ్లు తీసుకువస్తారు
  rationale: పట్టణాన్ని ఈడ్చివేయడానికి తాళ్లు మోసుకొని రావడమనే అతిశయోక్తి చిత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: మనం దాన్ని ... ఈడ్చుకుపోతాం
  rationale: סחב అంటే బలంగా ఈడ్చడం లేదా లాగుకుపోవడం. సర్వనామం పట్టణాన్ని సూచిస్తున్నందున ‘దాన్ని’ అని అనువదించి, హింసాత్మక అతిశయోక్తిని నిలిపింది.
- source_word: הַנַּחַל
  choice: వాగు
  rationale: נחל ప్రవహించే వాగును గానీ, కాలానుగుణంగా నీరు ప్రవహించే వాగు లోయను గానీ సూచించవచ్చు. ‘వాగు’ సాధారణ తెలుగు పాఠకులకు సహజమైన సమానార్థకం.
- source_word: גַּם צְרוֹר
  choice: ఒక చిన్న రాయి కూడా
  rationale: צְרוֹר ఇక్కడ చిన్న రాయి లేదా గులకరాయిని సూచిస్తుంది. పట్టణం పూర్తిగా నాశనమవుతుందనే అతిశయోక్తిని ఈ పదబంధం కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నేరుగా పలికిన సైనిక సలహా ధోరణిని నిలిపాం. ‘ఇశ్రాయేలు వారందరూ’ తర్వాత ‘మనం’ అనే వ్యక్తి మార్పు హీబ్రూ వాక్యంలోని మార్పునే ప్రతిబింబిస్తుంది. పట్టణాన్నే తాళ్లతో వాగు వరకు ఈడ్చుతామనే ఉద్దేశపూర్వక అతిశయోక్తిని మృదువుపరచలేదు.
