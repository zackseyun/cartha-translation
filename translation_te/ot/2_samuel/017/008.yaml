source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אַתָּ֣ה יָ֠דַעְתָּ אֶת אָבִ֨י/ךָ וְ/אֶת אֲנָשָׁ֜י/ו כִּ֧י גִבֹּרִ֣ים הֵ֗מָּה וּ/מָרֵ֥י נֶ֨פֶשׁ֙ הֵ֔מָּה כְּ/דֹ֥ב שַׁכּ֖וּל בַּ/שָּׂדֶ֑ה וְ/אָבִ֨י/ךָ֙ אִ֣ישׁ מִלְחָמָ֔ה וְ/לֹ֥א יָלִ֖ין אֶת הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: te
  text: 'హూషై ఇలా అన్నాడు: “నీ తండ్రి, అతని మనుషులు ఎంతటి పరాక్రమవంతులో నీకు తెలుసు. వారు ఉగ్రంగా ఉన్నారు[a], పొలంలో తన పిల్లలను కోల్పోయిన ఆడ ఎలుగుబంటిలా ఉన్నారు. అంతేకాదు, నీ తండ్రి యుద్ధవీరుడు; అతడు సైనికులతో కలిసి రాత్రి బస చేయడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రాణంలో చేదుగా ఉన్నవారు”; లేదా, “తీవ్ర ఆగ్రహంతో ఉన్నవారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు ప్రజలతో కలిసి రాత్రి బస చేయడు.” ఇక్కడ “ప్రజలు” అనే పదం దావీదుతో ఉన్న పోరాట దళాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: పరాక్రమవంతులు
  rationale: బలం, శౌర్యం అనే భావాలను తెలియజేస్తూ, ఇక్కడి సైనిక సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מָרֵי נֶפֶשׁ
  choice: మనసులో రగిలిపోతున్నారు
  rationale: అక్షరార్థంగా ఉన్న ‘ప్రాణంలో/మనసులో చేదుగా ఉన్నవారు’ అనే హీబ్రూ నుడికారంలోని తీవ్ర ఆవేశాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘క్రూరంగా ఉన్నారు’ అని మాత్రమే అనువదించడం కంటే వారి అంతర్గత భావస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּדֹב שַׁכּוּל
  choice: తన పిల్లలను కోల్పోయిన ఆడ ఎలుగుబంటిలా
  rationale: సంతానాన్ని కోల్పోయిన ఎలుగుబంటి అనే ప్రమాదకరమైన ఉగ్రతను చూపే హీబ్రూ ఉపమానాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: అడవిలో
  rationale: שׂדה పొలం మాత్రమే కాక బహిరంగ ప్రదేశం లేదా అరణ్యప్రాంతాన్ని కూడా సూచించగలదు; ఎలుగుబంటి ఉపమానంలో ‘అడవిలో’ ఆధునిక తెలుగు పాఠకునికి సహజంగా ఉంటుంది.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరుడు
  rationale: యుద్ధంలో అనుభవం, నైపుణ్యం గల వ్యక్తి అనే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: అతడు సైనికులతో కలిసి రాత్రి బస చేయడు
  rationale: לין రాత్రి బస చేయడాన్ని సూచిస్తుంది; ఈ సైనిక సందర్భంలో העם దావీదుతో ఉన్న పోరాట దళాన్ని సూచిస్తున్నందున ‘సైనికులు’ అనేది స్పష్టమైన సందర్భోచిత పదం.
- source_word: יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: అబ్షాలోమును నేరుగా ఉద్దేశించిన సాధారణ, సహజమైన తెలుగు రూపం.
- source_word: אֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: హీబ్రూ పదానికి నేరమైన సమానార్థకం; సందర్భం వారు దావీదు అనుచరులు, యోధులు అని తెలియజేస్తుంది కాబట్టి అనవసరంగా అర్థాన్ని కుదించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ భావచిత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అపరిచితమైన అక్షరానువాదాన్ని పాదసూచికలో ఇచ్చాం.
