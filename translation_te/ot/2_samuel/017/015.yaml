  to: 'అప్పుడు హూషై యాజకులైన సాదోకుకూ అబ్యాతారుకూ ఇలా అన్నాడు: “అహీతోఫెలు అబ్షాలోముకూ ఇశ్రాయేలు పెద్దలకూ ఇలా ఇలా[a] సలహా ఇచ్చాడు; నేనైతే ఇలా ఇలా సలహా ఇచ్చాను.”'
