  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁ֗י אֶל צָד֤וֹק וְ/אֶל אֶבְיָתָר֙ הַ/כֹּ֣הֲנִ֔ים כָּ/זֹ֣את וְ/כָ/זֹ֗את יָעַ֤ץ אֲחִיתֹ֨פֶל֙ אֶת אַבְשָׁלֹ֔ם וְ/אֵ֖ת זִקְנֵ֣י יִשְׂרָאֵ֑ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את יָעַ֥צְתִּי אָֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: te
  text: 'అప్పుడు హూషై యాజకులైన సాదోకుకూ అబ్యాతారుకూ ఇలా అన్నాడు: “అహీతోఫెలు అబ్షాలోముకూ ఇశ్రాయేలు పెద్దలకూ ఇలా ఇలా[a] సలహా ఇచ్చాడు; నేనైతే ఇలా ఇలా సలహా ఇచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నానుడి: ‘ఇలా ఇలా’; చెప్పిన సలహాను మాటకు మాటగా మళ్లీ చెప్పకుండా దాని సారాంశాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חוּשַׁי
  choice: హూషై
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: אֶל־צָדוֹק וְאֶל־אֶבְיָתָר הַכֹּהֲנִים
  choice: యాజకులైన సాదోకుతో, అబ్యాతారుతో
  rationale: ‘యాజకులు’ అనే బహువచన విశేషణం ఇద్దరికీ వర్తించేలా చేసి, రెండు హీబ్రూ సంబంధసూచక పదాల భావాన్ని తెలుగు ‘తో’ ద్వారా స్పష్టంగా నిలిపాం.
- source_word: כָּזֹאת וְכָזֹאת
  choice: ఇలా ఇలా
  rationale: చెప్పిన మాటలను పదేపదే ఉటంకించకుండా వాటి సారాంశాన్ని సూచించే హీబ్రూ నానుడికి ‘ఇలా ఇలా’ సహజమైన తెలుగు సమానం. పునరుక్తిని రెండు చోట్లా అలాగే ఉంచి వాక్య సమాంతరతను కాపాడాం.
- source_word: יָעַץ
  choice: సలహా ఇచ్చాడు
  rationale: రాజకీయ, వ్యూహాత్మక సందర్భంలో ఈ క్రియకు ‘సలహా ఇచ్చాడు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֶת־אַבְשָׁלֹם וְאֵת זִקְנֵי יִשְׂרָאֵל
  choice: అబ్షాలోముకూ ఇశ్రాయేలు పెద్దలకూ
  rationale: సలహా అందుకున్న ఇద్దరు పక్షాలను తెలుగు సంప్రదాన విభక్తితో స్పష్టంగా చూపించాం; జతచేసే ‘కూ’ రూపాన్ని రెండింటికీ ఉంచి సమాంతరతను నిలిపాం.
- source_word: יָעַצְתִּי אָנִי
  choice: నేనైతే ... సలహా ఇచ్చాను
  rationale: స్వతంత్ర సర్వనామమైన אָנִי కలిగించే వ్యత్యాసాత్మక ఉద్ఘాటనను ‘నేనైతే’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని రెండు సలహాల సమాంతర నిర్మాణాన్ని, చివరి ‘నేను’పై ఉన్న ఉద్ఘాటనను నిలిపాం. పాదసూచిక గుర్తును అది వివరించే మొదటి ‘ఇలా ఇలా’ నానుడి దగ్గర ఉంచాం.
