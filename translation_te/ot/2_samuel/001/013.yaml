base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: te
  text: దావీదు తనకు ఆ వార్త చెప్పిన యువకుణ్ణి, “నువ్వు ఎక్కడివాడివి?” అని అడిగాడు. అతడు, “నేను అమాలేకీయుడైన ఒక వలసవాసి కుమారుణ్ణి[a]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఒక వలసవాసి కుమారుణ్ణి—అమాలేకీయుణ్ణి.” హీబ్రూ పదబంధం అతని తండ్రిని అమాలేకీయ వలసవాసిగా గుర్తిస్తున్నట్లు గానీ, వలసవాసి వంశానికి చెందిన ఈ వ్యక్తిని అమాలేకీయుడిగా గుర్తిస్తున్నట్లు గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: נַעַר సాధారణంగా యువ పురుషుణ్ణి లేదా పరిచారకుణ్ణి సూచించవచ్చు. ఇక్కడ సేవకుడనే భావం స్పష్టంగా లేకపోవడంతో సహజమైన ‘యువకుడు’ ఎంచుకున్నాం.
- source_word: הַמַּגִּיד לוֹ
  choice: తనకు ఆ వార్త చెప్పిన
  rationale: נגד క్రియ యొక్క కృదంత రూపం దావీదుకు సమాచారం తెచ్చిన వ్యక్తిని గుర్తిస్తుంది. సందర్భంలోని నివేదికను స్పష్టం చేయడానికి ‘ఆ వార్త చెప్పిన’ అని అనువదించాం.
- source_word: אֵי מִזֶּה
  choice: నువ్వు ఎక్కడివాడివి?
  rationale: ఈ హీబ్రూ నుడికారం వ్యక్తి మూలస్థలాన్ని అడుగుతుంది. ఆధునిక తెలుగులో ఇది సహజమైన, స్పష్టమైన రూపం.
- source_word: בֶּן אִישׁ
  choice: ఒక … కుమారుణ్ణి
  rationale: అక్షరార్థంగా ‘ఒక మనిషి కుమారుడు’; తెలుగులో సహజంగా తండ్రి గుర్తింపును తెలిపే విధంగా సంక్షిప్తంగా అనువదించాం.
- source_word: גֵּר
  choice: వలసవాసి
  rationale: גֵּר స్వదేశానికి వెలుపల లేదా స్థానికేతరుడిగా ఒక ప్రాంతంలో నివసించే వ్యక్తిని సూచిస్తుంది. ‘వలసవాసి’ ఈ నివాసస్థితిని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲמָלֵקִי
  choice: అమాలేకీయుడు
  rationale: అమాలేకుతో సంబంధమున్న జాతి గుర్తింపుకు ప్రామాణిక తెలుగు రూపం.
- source_word: אָנֹכִי
  choice: నేను … కుమారుణ్ణి
  rationale: స్వతంత్ర సర్వనామం స్పష్టమైన స్వీయ గుర్తింపును ఇస్తుంది; తెలుగు వాక్యనిర్మాణంలో విధేయంతో కలిపి సహజంగా వ్యక్తపరిచాం.
theological_decisions:
- issue: בֶּן אִישׁ גֵּר עֲמָלֵקִי పదబంధంలోని అన్వయ అస్పష్టత
  choice: ‘అమాలేకీయుడైన ఒక వలసవాసి కుమారుణ్ణి’—తండ్రిని అమాలేకీయ వలసవాసిగా గుర్తించడం
  alternative: ‘వలసవాసి కుమారుణ్ణి, అమాలేకీయుణ్ణి’—మాట్లాడుతున్న వ్యక్తినే అమాలేకీయుడిగా మరింత ప్రత్యక్షంగా గుర్తించడం
  rationale: హీబ్రూ పదక్రమం ప్రధానంగా తండ్రిని ‘అమాలేకీయుడైన వలసవాసి’గా చదవడానికి అనుకూలిస్తుంది; అయినా వంశ/జాతి గుర్తింపు ఎవరికీ నేరుగా అన్వయిస్తుందనే విషయంలో కొంత అస్పష్టత ఉంది. దానిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే సంభాషణ శైలిని వాడాం. ‘నువ్వు ఎక్కడివాడివి?’ మూలంలోని ప్రత్యక్ష ప్రశ్నను సహజంగా అందిస్తుంది; גֵּר యొక్క సామాజిక-నివాస భావాన్ని ‘వలసవాసి’తో వ్యక్తపరిచాం.
