translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, శోకగీతానికి తగిన గంభీరమైన కవితాత్మక ధోరణి పాటించబడింది. సంబోధనలో హీబ్రూ నుడికారం నిలుపబడింది; అరుదైన రంగుపేరు బదులు సాధారణ పాఠకునికి స్పష్టమైన ‘ఎర్రని వస్త్రాలు’ వాడబడింది.
