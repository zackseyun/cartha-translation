  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: te
  text: 'ఇశ్రాయేలు కుమార్తెలారా, సౌలును గూర్చి విలపించండి;


    అతడు మీకు విలాసవంతమైన[a] స్కార్లెట్ రంగు వస్త్రాలు తొడిగించాడు,


    మీ దుస్తులపై బంగారు ఆభరణాలు[b] ఉంచాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుఖవస్తువులతో కూడిన,’ ‘శోభతో కూడిన,’ లేదా ‘అలంకారాలతో కూడిన వస్త్రాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బంగారు నగలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమార్తెలారా
  rationale: ప్రత్యక్ష సంబోధనను, హీబ్రూ కవితాత్మక నుడికారాన్ని నిలుపుతుంది; ‘ఇశ్రాయేలు స్త్రీలారా’ కంటే మూలరూపానికి దగ్గరగా ఉంది.
- source_word: אֶל שָׁאוּל בְּכֶינָה
  choice: సౌలును గూర్చి విలపించండి
  rationale: శోకగీత సందర్భంలో אֶל విలాపానికి గురియైన వ్యక్తిని సూచిస్తుంది; בְּכֶינָה సాధారణ ఏడుపుకంటే ఆచారబద్ధమైన శోకవిలాప భావాన్ని కలిగిస్తుంది.
- source_word: הַמַּלְבִּשְׁכֶם
  choice: అతడు మీకు ... వస్త్రాలు తొడిగించాడు
  rationale: నామవాచకార్థక కృదంతం సౌలును తిరిగి సూచిస్తోంది; కారణక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁנִי
  choice: ఎర్రని వస్త్రాలు
  rationale: ఈ పదం స్కార్లెట్/క్రిమ్సన్ రంగుతో అద్దిన విలువైన వస్త్రాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి సహజంగా ఉండేందుకు రంగును వస్త్రంతో కలిపి చెప్పబడింది.
- source_word: עִם עֲדָנִים
  choice: విలాసవంతమైన
  rationale: దీనికి ‘సుఖవస్తువులతో,’ ‘శోభతో,’ లేదా ‘అలంకారాలతో’ అనే భావవ్యాప్తి ఉంది; వస్త్రాల వైభవాన్ని సహజంగా తెలియజేస్తూనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: הַמַּעֲלֶה
  choice: అలంకరించాడు
  rationale: עלה ఇక్కడ దుస్తులపై ఉంచడం లేదా ధరింపజేయడం అనే సందర్భార్థంలో ఉంది; ఆభరణాల విషయంలో ‘అలంకరించాడు’ సహజమైన తెలుగు.
- source_word: עֲדִי זָהָב
  choice: బంగారు ఆభరణాలు
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘బంగారు నగలు’ అనే మరింత సాధారణ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: עַל לְבוּשְׁכֶן
  choice: మీ దుస్తులపై
  rationale: స్థానార్థక עַל మరియు ‘దుస్తులు/వస్త్రధారణ’ అనే לְבוּשׁ భావాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
