id: 2SA.1.21
reference: 2 Samuel 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: te
  text: గిల్బోవ పర్వతాలారా, మీ మీద మంచుగానీ వర్షంగానీ పడకూడదు; అర్పణల పొలాలు[a] ఉండకూడదు. ఎందుకంటే అక్కడ వీరుల డాలు అపవిత్రమైంది—నూనెతో పూయబడని సౌలు డాలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమృద్ధిగల పొలాలు,’ ‘ప్రథమఫలాల పొలాలు,’ లేదా ‘ప్రత్యేక అర్పణల పొలాలు.’ ఈ హెబ్రీ పదబంధం అర్థం నిర్ధారించడం కష్టం; תְּרוּמוֹת అనే పదం తరచుగా దేవునికోసం ప్రత్యేకించిన అర్పణలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి పదబంధం సౌలును ‘అభిషిక్తుడు’ అని సూచించకుండా, యుద్ధానికి సిద్ధం చేయడంలో సాధారణంగా చేసే విధంగా అతని డాలుకు ఇక నూనె రాయబడలేదని సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: గిల్బోవ పర్వతాలారా
  rationale: నిర్మాణబంధాన్ని ప్రత్యక్ష సంబోధనగా సహజమైన తెలుగు విభక్తితో వ్యక్తపరుస్తుంది; הָרֵי యొక్క బహువచన భావాన్ని ‘పర్వతాలు’ నిలుపుతుంది.
- source_word: אַל טַּל וְאַל מָטָר עֲלֵיכֶם
  choice: మీ మీద మంచుగానీ వర్షంగానీ కురవకూడదు
  rationale: אַל ద్వారా వ్యక్తమైన శాపసదృశ ఆకాంక్షను ‘కూడదు’తో తెలుగులో సహజంగా అందిస్తుంది; ‘మీ మీద’ ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
- source_word: וּשְׂדֵי תְרוּמוֹת
  choice: అర్పణల పంటపొలాలు
  rationale: కఠినమైన హెబ్రీ పదబంధంలోని שְׂדֵיని ‘పంటపొలాలు’గా, תְרוּמוֹת యొక్క దేవునికి ప్రత్యేకించిన అర్పణల భావాన్ని ‘అర్పణలు’గా పారదర్శకంగా ఉంచుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: כִּי שָׁם
  choice: ఎందుకంటే అక్కడ
  rationale: పర్వతాలపై పలికిన శాపానికి కారణాన్ని తెలుగులో స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נִגְעַל
  choice: అపవిత్రమైంది
  rationale: నిఫాల్ రూపంలోని అపవిత్రత, అవమానం అనే భావాలను యుద్ధంలో పడిపోయిన డాలు సందర్భంలో అతిగా వ్యాఖ్యానించకుండా వ్యక్తపరుస్తుంది.
- source_word: מָגֵן גִּבּוֹרִים
  choice: వీరుల డాలు
  rationale: גִּבּוֹרִים యొక్క యోధులు/వీరులు అనే భావాన్ని కావ్యోచితంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: מָגֵן שָׁאוּל
  choice: సౌలు డాలు
  rationale: ముందటి ‘వీరుల డాలు’కు వివరణగా వచ్చే కావ్య పునరుక్తిని కుదించకుండా నిలుపుతుంది.
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: నూనెతో అభిషేకించబడనిదిగా
  rationale: ‘నూనెతో అభిషేకించబడని’ అనే మూలపదాల రూపాన్ని నిలుపుతూ, వ్యాకరణపరంగా డాలునే సూచించేలా స్త్రీలింగ అన్వయాన్ని ఉపయోగిస్తుంది; యుద్ధానికి ముందు డాలుకు నూనె రాసే ఆచారాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: מָשִׁיחַ అనే రూపాన్ని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదుగా అపార్థం చేసుకునే అవకాశం
  choice: ‘నూనెతో అభిషేకించబడనిదిగా’ అని డాలు స్థితిని సూచించేలా అనువదించడం
  alternative: ‘నూనెతో అభిషేకించబడిన సౌలు డాలు కాదు’ లేదా సౌలును ‘అభిషిక్తుడు’గా సూచించడం
  rationale: בַּשָּׁמֶן (‘నూనెతో’) అనే సమీప పదబంధం, యుద్ధసామగ్రి సందర్భం కలిసి డాలుకు నూనె రాయడాన్నే బలంగా సూచిస్తున్నాయి. అందువల్ల మెస్సీయ సంబంధమైన లేదా రాజబిరుదు సంబంధమైన భావాన్ని దిగుమతి చేయకుండా మూలంలోని సాధారణ అభిషేక భావాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాపకావ్య ధోరణి పాటించబడింది. ‘గిల్బోవ పర్వతాలారా’ అనే సంబోధన, డాలు గురించిన పునరుక్తి, శాపసదృశ ఆకాంక్ష నిలుపబడ్డాయి. అరుదైన పదజాలాన్ని తగ్గించినా, కఠినమైన హెబ్రీ పదబంధాన్ని సులభీకరించి దాని అస్పష్టతను తొలగించలేదు.
