  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: te
  text: 'హతుల రక్తం నుండి,

    వీరుల కొవ్వు నుండి[a],

    యోనాతాను విల్లు వెనుదిరగలేదు[b];

    సౌలు ఖడ్గం ఖాళీగా తిరిగి రాలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొవ్వు’ అనే పదం శ్రేష్ఠమైన లేదా అత్యంత పుష్టిగల భాగాన్ని కూడా సూచించవచ్చు; ఇక్కడ అది యుద్ధవిజయ చిత్రాన్ని మరింత తీవ్రం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెనక్కి తగ్గలేదు.’ హీబ్రూ క్రియ వెనక్కి తగ్గడం లేదా వెనుదిరగడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: హతుల రక్తం నుండి
  rationale: מִן అనే విభక్త్యర్థాన్ని ‘నుండి’గా ఉంచి, ఆయుధం హతుల రక్తం నుండి వెనుదిరగలేదనే యుద్ధకావ్య చిత్రాన్ని కాపాడుతుంది. חֲלָלִים ఇక్కడ యుద్ధంలో హతులైనవారిని సూచిస్తుంది.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: వీరుల కొవ్వు నుండి
  rationale: חֵלֶב యొక్క ప్రత్యక్ష అర్థమైన ‘కొవ్వు’ను నిలిపి, గాఢమైన శరీర సంబంధ యుద్ధచిత్రాన్ని అనవసరంగా మృదువుచేయలేదు. גִּבּוֹרִיםను సందర్భానుసారంగా ‘వీరులు’గా అనువదించడం సహజంగా, కావ్యోచితంగా ఉంది.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: యోనాతాను విల్లు
  rationale: హీబ్రూ construct సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: వెనుదిరగలేదు
  rationale: נסוג మరియు אָחוֹר కలిసి వెనక్కి తగ్గడం లేదా తిరగడం అనే భావాన్ని ఇస్తాయి. విల్లుకు వ్యక్తీకరణ కల్పించిన మూలకావ్యాన్ని ఈ పదప్రయోగం నిలుపుతుంది.
- source_word: וְחֶרֶב שָׁאוּל
  choice: సౌలు ఖడ్గం
  rationale: ముందటి ‘యోనాతాను విల్లు’తో ఉన్న కావ్య సమాంతరతను సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: ఖాళీగా తిరిగిరాలేదు
  rationale: ఖడ్గం తన కార్యాన్ని సాధించకుండా తిరిగిరాలేదనే భావాన్ని స్పష్టంగా ఇస్తూనే, ‘ఖాళీగా తిరిగిరావడం’ అనే మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
