translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దావీదు విలాపానికి తగిన సంక్షిప్తమైన కావ్య గాంభీర్యంతో అనువదించబడింది. మూలంలోని సమాంతర పాద నిర్మాణం, ఆయుధాల వ్యక్తీకరణ, అలాగే ‘రక్తం/కొవ్వు’ అనే తీవ్ర యుద్ధచిత్రాలు నిలుపబడ్డాయి. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు విరుద్ధ స్థానాల్లో ఉన్నందున, మూలపదాలకు అనుగుణంగా [a]ను ‘కొవ్వు’ వద్ద, [b]ను ‘వెనుదిరగలేదు’ వద్ద ఉంచాం.
