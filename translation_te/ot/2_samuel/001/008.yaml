  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. హీబ్రూలోని సాధారణ ‘అన్నాడు’ అనే ప్రయోగం ప్రశ్న సందర్భంలో తెలుగుకు సహజమైన ‘అడిగాడు’గా ఇచ్చాం. హీబ్రూ క్రియారూపం మరియు సందర్భార్థం మధ్య ఉన్న ఉద్వేగాన్ని పాదసూచికతో నిలిపాం.
