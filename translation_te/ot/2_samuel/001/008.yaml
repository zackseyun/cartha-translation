translation:
  language: te
  text: అతడు నన్ను, “నీవెవరు?” అని అడిగాడు. నేను అతనికి[a], “నేను అమాలేకీయుణ్ణి” అని చెప్పాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో రెండవ వాక్యభాగంలోని క్రియారూపం అక్షరార్థంగా ‘అతడు చెప్పాడు’ అని ఉంది. అయితే సంభాషణ సందర్భంలో అమాలేకీయుడే సౌలుకు జవాబిస్తున్నందున భావం ‘నేను అతనికి చెప్పాను.’
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: అతడు నన్ను … అని అడిగాడు
  rationale: ప్రశ్నను పరిచయం చేస్తున్న ‘అతడు నాతో అన్నాడు’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘అడిగాడు’ అని వ్యక్తం చేశాం; לִי వల్ల మాట కథకునికి ఉద్దేశించబడింది.
- source_word: מִי אַתָּה
  choice: నీవెవరు?
  rationale: מִי అనే ప్రశ్నార్థక సర్వనామం, రెండవ పురుష ఏకవచనమైన אַתָּה కలసి ఏర్పరచే నామవాక్య ప్రశ్నకు సహజమైన తెలుగు రూపం.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అందుకు నేను అతనితో … అని చెప్పాను
  rationale: లిఖిత హీబ్రూ క్రియారూపం మూడవ పురుష ఏకవచనంగా ‘అతడు అన్నాడు’ అని ఉన్నప్పటికీ, אֵלָיו (‘అతనితో’) మరియు సంభాషణ సందర్భం ప్రకారం అమాలేకీయుడు సౌలుకు ఇచ్చిన ప్రత్యుత్తరమే ఉద్దేశం. ఈ సందర్భార్థాన్ని పాఠ్యంలో ఇచ్చి, రూపభేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: עֲמָלֵקִי
  choice: అమాలేకీయుణ్ణి
  rationale: ఇది అమాలేకుకు చెందిన జాతి/ప్రజా గుర్తింపును తెలిపే gentilic పదం; పురుష వక్త తనను తాను గుర్తించుకునే సహజ తెలుగు రూపం.
- source_word: אָנֹכִי
  choice: నేను … ణ్ణి
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామం స్వీయ గుర్తింపును స్పష్టంగా నొక్కి చెబుతుంది; క్రియలేని హీబ్రూ వాక్యానికి తెలుగులో సహజమైన విధేయ రూపాన్ని వాడాం.
