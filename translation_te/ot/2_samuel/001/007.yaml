  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: te
  text: అతడు వెనక్కి తిరిగి నన్ను చూశాడు[a], నన్ను పిలిచాడు; నేను, “ఇదిగో, నేనున్నాను” అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతడు తన వెనుకవైపుకు తిరిగాడు.” అంటే అతడు వెనక్కి తిరిగి చూశాడని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: తన వెనుకవైపు తిరిగి
  rationale: פנה అనే క్రియ తిరగడాన్ని సూచిస్తుంది; אַחֲרָיו అక్షరార్థంగా ‘అతని వెనుక’ అని స్థలార్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా రెండింటినీ కలిపి అనువదించాం.
- source_word: וַיִּרְאֵנִי
  choice: నన్ను చూశాడు
  rationale: ראה క్రియకు ప్రథమ పురుష ఏకవచన కర్మప్రత్యయం చేరి ‘నన్ను చూశాడు’ అనే సూటి అర్థం వస్తుంది.
- source_word: וַיִּקְרָא אֵלַי
  choice: నన్ను పిలిచాడు
  rationale: קרא + אֶל నిర్మాణం ఒకరిని ఉద్దేశించి పిలవడాన్ని సూచిస్తుంది; ‘రమ్మని పిలిచాడు’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: וָאֹמַר
  choice: నేను … అన్నాను
  rationale: אמר యొక్క సాధారణ అర్థం ‘అను/చెప్పు’; సందర్భానుసారంగా ‘జవాబిచ్చాను’ అనవచ్చుగానీ, మూలంలోని సాదాసీదా వాక్క్రియను నిలిపాం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: మాట్లాడేవాడు తన సన్నిధిని, సిద్ధతను తెలియజేసే హీబ్రూ ప్రత్యుత్తరానికి ఇది సహజమైన, గంభీరమైన తెలుగు రూపం; ‘మీ సేవలో’ వంటి వివరణాత్మక భావాన్ని జోడించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వరుస వాక్య నిర్మాణాన్ని తెలుగులో చిన్న వాక్యాలుగా ఇచ్చి స్పష్టతను కాపాడాం; మూలంలోని సమాచారాన్ని తొలగించలేదు.
