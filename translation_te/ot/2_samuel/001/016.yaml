reference: 2 Samuel 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ דָּוִ֔ד דמי/ך עַל רֹאשֶׁ֑/ךָ כִּ֣י פִ֗י/ךָ עָנָ֤ה בְ/ךָ֙ לֵ/אמֹ֔ר אָנֹכִ֥י מֹתַ֖תִּי אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: te
  text: అప్పుడు దావీదు అతనితో, “నీ రక్తం నీ తలమీదే ఉంది[a]; ఎందుకంటే నీ నోరే నీకు వ్యతిరేకంగా సాక్ష్యమిచ్చింది[b], ‘నేనే యాహ్వే అభిషిక్తుణ్ణి చంపాను’ అని,” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీ రక్తం నీ తలమీద ఉండుగాక.” ఈ హీబ్రూ నానుడి అతని మరణానికి అతడే బాధ్యుడని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ నోరు నీకు వ్యతిరేకంగా సాక్ష్యం చెప్పింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: అప్పుడు దావీదు అతనితో ... అన్నాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని చూపుతుంది. אֵלָיוను ‘అతనితో’ అని స్పష్టంగా అనువదించాం.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: నీ రక్తం నీ తలమీదే ఉంది
  rationale: ఇది తన మరణానికి తానే బాధ్యుడని తెలిపే న్యాయపరమైన హీబ్రూ నానుడి. తెలుగు పాఠకునికి అర్థమయ్యేలా మూలంలోని రక్తం–తల ప్రతీకను నిలిపి ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దావీదు తీర్పుకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: פִּיךָ עָנָה בְךָ
  choice: నీ నోటితో నీవే నీకు వ్యతిరేకంగా సాక్ష్యమిచ్చావు
  rationale: ענה בְ ఇక్కడ న్యాయపరంగా ఒకరికి వ్యతిరేకంగా సాక్ష్యం చెప్పడాన్ని సూచిస్తుంది. ‘నీ నోరు’ అనే అవయవ-ప్రతినిధిత్వాన్ని సహజ తెలుగులో ‘నీ నోటితో’గా నిలిపి, స్వీయ నేరారోపణను ‘నీవే’తో స్పష్టం చేశాం.
- source_word: לֵאמֹר
  choice: అని చెప్పి
  rationale: సాక్ష్యం యొక్క విషయాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֹתַתִּי
  choice: చంపాను
  rationale: ఈ కారణక క్రియ మరణింపజేయడాన్ని సూచిస్తుంది; ఒప్పుకోలు సందర్భంలో ‘చంపాను’ నేరుగా, సహజంగా ఉంది.
- source_word: מְשִׁיחַ יְהוָה
  choice: యెహోవా అభిషిక్తుణ్ణి
  rationale: ఇది అభిషేకించబడిన రాజైన సౌలును సూచించే బిరుదు. ‘మెస్సీయ’ అని లిప్యంతరీకరించకుండా సందర్భానుగుణ అర్థాన్ని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. తెలుగులో స్థిరంగా, విస్తృతంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఇది ‘ప్రభువు’ అనే బిరుదుతో నామాన్ని భర్తీ చేయదు.
- issue: రాజసంబంధ సందర్భంలో מְשִׁיחַ అనువాదం
  choice: అభిషిక్తుడు
  alternative: మెస్సీయ
  rationale: ఇక్కడ పదం అభిషేకించబడిన రాజైన సౌలును సూచిస్తుంది. తరువాతి క్రీస్తుసంబంధ భావాన్ని ఈ కథనంలోకి ముందుగానే తీసుకురాకుండా, పదార్థాన్ని ‘అభిషిక్తుడు’గా అనువదించాం.
- issue: דָּמֶיךָ עַל רֹאשֶׁךָ యొక్క న్యాయపరమైన భావం
  choice: నీ రక్తం నీ తలమీదే ఉంది
  alternative: నీ మరణానికి నీవే బాధ్యుడివి
  rationale: మూలంలోని బలమైన ప్రతీకను నిలిపి ఉంచుతూ, దాని బాధ్యతారోపణ భావాన్ని పాదటిప్పణిలో వివరించాం; భావాన్ని మాత్రమే ఇచ్చి రూపకాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన-న్యాయ శైలిని ఉపయోగించాం. ప్రత్యక్ష వాక్యంలో ‘నేనే’ అనే ఉద్ఘాటనను, ‘రక్తం నీ తలమీద’ అనే మూల రూపకాన్ని కాపాడాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
