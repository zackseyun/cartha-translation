id: 2SA.1.27
reference: 2 Samuel 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: te
  text: అయ్యో, వీరులు ఎలా పడిపోయారు! యుద్ధ సామగ్రి[a][b] నశించిపోయింది!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధ ఆయుధాలు’ లేదా ‘యుద్ధ కవచాలు.’ హీబ్రూ పదబంధం దాడి చేసే ఆయుధాలకే పరిమితం కాకుండా సైనిక సామగ్రిని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘యుద్ధ సామగ్రి’ అనే పదబంధం సౌలు, యోనాతానులను—ఇశ్రాయేలు యుద్ధబలంగా—రూపకంగా సూచించవచ్చు; దాన్ని అక్షరార్థంలో కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: అయ్యో, ... ఎలా
  rationale: ఇది సమాచారాన్ని అడిగే ప్రశ్న కాదు; విలాపాన్ని వ్యక్తం చేసే ఆశ్చర్యోక్తి. ‘అయ్యో’ విలాప స్వరాన్ని, ‘ఎలా’ మూలంలోని కవితాత్మక పునరుక్తిని నిలుపుతాయి.
- source_word: נָפְלוּ
  choice: పడిపోయారు
  rationale: పూర్తయిన పతనాన్ని తెలిపే సహజమైన తెలుగు రూపం; వ్యక్తులను సూచించే ‘బలవంతులు’తో గౌరవ బహువచన క్రియ సరిపోతుంది.
- source_word: גִבּוֹרִים
  choice: బలవంతులు
  rationale: ఈ సందర్భంలో పరాక్రమశాలులు లేదా యోధులు అనే భావం ఉంది. ‘బలవంతులు’ సంక్షిప్తంగా ఉండి, విలాపంలోని ఉన్నత కవితా స్వరాన్ని కాపాడుతుంది.
- source_word: וַיֹּאבְדוּ
  choice: నశించిపోయాయి
  rationale: אבד లోని నశించడం, కోల్పోవడం అనే భావాలను వ్యక్తం చేస్తుంది; సైనిక సామగ్రి నిజంగా నాశనమైందనే పఠనానికీ, వ్యక్తులను రూపకంగా సూచించే పఠనానికీ అవకాశం ఉంచుతుంది.
- source_word: כְּלֵי מִלְחָמָה
  choice: యుద్ధాయుధాలు
  rationale: పదబంధం విస్తృతంగా యుద్ధ సామగ్రి లేదా కవచ సామగ్రిని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త రూపాన్ని ఇచ్చి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ‘యుద్ధాయుధాలు’ అనే పదబంధం అక్షరార్థమా, సౌలు యోనాతానులకు రూపకమా
  choice: ప్రధాన పాఠ్యంలో రూపకార్థాన్ని నిర్బంధించకుండా ‘యుద్ధాయుధాలు’ అని ఉంచడం
  alternative: దీనిని నేరుగా సౌలు, యోనాతానులను సూచించే ‘యుద్ధ వీరులు’ వంటి పదాలతో అనువదించడం
  rationale: హీబ్రూ పదబంధం యుద్ధ సామగ్రిని అక్షరార్థంగా సూచించవచ్చు; సందర్భంలో సౌలు, యోనాతానులను ఇశ్రాయేలు యుద్ధబలంగా రూపకంగా సూచించే అవకాశం కూడా ఉంది. మూలంలోని ఈ ద్వంద్వార్థాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపానికి తగిన గంభీరమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని אֵיךְ పునరుక్తి ప్రభావాన్ని తెలుగులో రెండు వాక్యభాగాల్లో ‘ఎలా’తో ప్రతిబింబించాం; అర్థసందిగ్ధతను పాదసూచికలతో కాపాడాం.
