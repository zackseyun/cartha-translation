source:
  edition: WLC
  text: אֵ֚יךְ נָפְל֣וּ גִבֹּרִ֔ים בְּ/ת֖וֹךְ הַ/מִּלְחָמָ֑ה יְה֣וֹנָתָ֔ן עַל בָּמוֹתֶ֖י/ךָ חָלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: te
  text: 'యుద్ధం నడుమ పరాక్రమవంతులు ఎలా పడిపోయారు!


    యోనాతానూ, నీ ఎత్తైన ప్రదేశాలపై నీవు హతుడవై పడి ఉన్నావు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓ ఇశ్రాయేలూ, నీ ఎత్తైన ప్రదేశాలపై యోనాతాను హతుడై పడ్డాడు.” హెబ్రీలో “నీ” అనేది యోనాతానునే సంబోధించవచ్చు; లేదా కవితాత్మకంగా ఇశ్రాయేలు దేశాన్నీ, దాని భూభాగాన్నీ సంబోధించవచ్చు. “ఎత్తైన ప్రదేశాలు” అనే హెబ్రీ పదం కొన్ని సందర్భాల్లో ఆరాధనా స్థలాలను కూడా సూచిస్తుంది.
    reason: వ్యాకరణ మరియు పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: אֵיךְ
  choice: ఎలా
  rationale: ఇది సమాచారాన్ని అడిగే ప్రశ్న కాదు; ఆశ్చర్యం, దుఃఖం వ్యక్తంచేసే విలాపోక్తి. ‘ఎలా’ కవితాత్మక పునరుక్తిని నిలుపుతుంది.
- source_word: נָפְלוּ
  choice: పడిపోయారు
  rationale: సంపూర్ణమైన విషాద సంఘటనను తెలిపే క్రియ; తెలుగు విలాప సందర్భంలో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: גִבֹּרִים
  choice: పరాక్రమవంతులు
  rationale: యుద్ధశౌర్యం గల బలవంతులను సూచిస్తుంది; ‘యోధులు’ అని అతి నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: యుద్ధం నడుమ
  rationale: పోరాటం మధ్యలోనే అనే בְּתוֹךְ భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతానూ
  rationale: తెలుగులో స్థిరపడిన నామరూపాన్ని సంబోధన విభక్తితో ఇచ్చి, విలాపంలోని ప్రత్యక్ష సంబోధనను ప్రతిబింబిస్తుంది.
- source_word: עַל
  choice: మీద
  rationale: సాధారణ స్థానార్థక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָּמוֹתֶיךָ
  choice: నీ ఉన్నత స్థలాలు
  rationale: במות అనే పదంలోని ఎత్తైన ప్రదేశాలు/ఉన్నత స్థలాలు అనే భౌగోళిక భావాన్ని నిలుపుతుంది; ఆరాధనా ‘ఉన్నత స్థలాలు’ అనే సాధ్యమైన పదార్థాన్ని పూర్తిగా తొలగించదు.
- source_word: חָלָל
  choice: హతుడవై పడి ఉన్నావు
  rationale: చంపబడినవాడు అనే నామవాచక/విశేషణ భావాన్ని సందర్భానుగుణంగా విధేయ వాక్యంగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: בָּמוֹתֶיךָ లోని రెండవ పురుష ఏకవచన ప్రత్యయానికి సంబోధితుడు
  choice: వ్యాకరణపరంగా యోనాతానును నేరుగా సంబోధించే పఠనాన్ని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: ఇశ్రాయేలు దేశాన్ని లేదా దాని పర్వత ప్రాంతాన్ని కవితాత్మకంగా సంబోధిస్తూ ‘నీ ఉన్నత స్థలాలపై యోనాతాను హతుడై పడ్డాడు’ అని పఠించడం
  rationale: మసొరేటిక్ విరామచిహ్నాలు ‘యోనాతాను’ను తరువాతి వాక్యభాగంతో కలుపుతాయి; రెండవ పురుష ఏకవచన క్రియాప్రత్యయం కూడా యోనాతానుతో సహజంగా సరిపోతుంది. అయినా విలాపంలోని భూభాగ సంబోధన నేపథ్యం వల్ల ప్రత్యామ్నాయ పఠనం సాధ్యమే; దానిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన విలాప స్వరాన్ని ఉంచాం. మొదటి పాదంలోని పునరుక్తి స్వభావాన్ని కాపాడుతూ, రెండవ పాదంలో మసొరేటిక్ వాక్యవిభజనకు అనుగుణంగా యోనాతానును నేరుగా సంబోధించాం; నిజమైన ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
