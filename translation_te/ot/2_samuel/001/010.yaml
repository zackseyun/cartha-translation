source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: te
  text: “అప్పుడు నేను అతనిపై నిలబడి అతన్ని చంపాను. ఎందుకంటే అతడు పడిపోయిన తర్వాత బ్రతకడని నాకు తెలుసు. ఆ తర్వాత అతని తలపై ఉన్న కిరీటాన్ని, అతని బాహువుపై ఉన్న బాహుభూషణాన్ని[a] తీసుకొని, వాటిని ఇక్కడ నా ప్రభువు వద్దకు తెచ్చాను.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చేతి కడియం.’ హీబ్రూ పదం బాహువుపై ధరించే ఆభరణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇది దావీదుకు అమాలేకీయుడు చెప్పిన నివేదిక. సౌలు మరణం గురించి మునుపటి కథనం కోసం 1 సమూయేలు 31:4–5 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: నేను అతని దగ్గర నిలబడి
  rationale: ఈ సందర్భంలో עמד על అంటే పడివున్న సౌలు దగ్గర లేదా అతనిపై వంగి నిలబడటాన్ని సూచిస్తుంది. తెలుగులో ‘అతని మీద నిలబడి’ అంటే శరీరంపై కాలు పెట్టి నిలబడినట్టు అనిపించవచ్చు; అందువల్ల సందర్భార్థాన్ని సహజంగా తెలిపే ‘అతని దగ్గర నిలబడి’ ఎంచుకున్నాం.
- source_word: וַאֲמֹתְתֵהוּ
  choice: అతన్ని చంపాను
  rationale: מות యొక్క హిఫీల్ రూపం ఇక్కడ అతని మరణానికి తానే కారణమయ్యానని వక్త స్పష్టంగా చెప్పడాన్ని సూచిస్తుంది. ‘చంపాను’ ఆధునిక తెలుగులో నేరుగా, సహజంగా ఉంది.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: ఎందుకంటే ... బ్రతకడని నాకు తెలుసు
  rationale: రెండు כִּי పదాల సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వక్త చెప్పిన కారణాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: అతడు పడిపోయిన తర్వాత
  rationale: నפל నుండి వచ్చిన నిర్మాణం ముందుగా పూర్తయిన పడిపోవడాన్ని కాలసంబంధంగా సూచిస్తుంది.
- source_word: הַנֵּזֶר
  choice: కిరీటం
  rationale: ఇక్కడ נֵזֶר రాజు తలపై ధరించే రాజచిహ్నాన్ని సూచిస్తుంది; ‘కిరీటం’ సాధారణ పాఠకులకు స్పష్టమైన సమానార్థకం.
- source_word: וְאֶצְעָדָה אֲשֶׁר עַל זְרֹעוֹ
  choice: అతని బాహువుపై ఉన్న బాహుభూషణం
  rationale: ఈ ఆభరణం זרוע, అంటే బాహువుపై ధరించబడింది. ‘బాహుభూషణం’ మణికట్టుకే పరిమితం చేయకుండా వస్తువు స్వరూపాన్ని తెలియజేస్తుంది.
- source_word: וָאֲבִיאֵם אֶל אֲדֹנִי הֵנָּה
  choice: వాటిని ఇక్కడ నా ప్రభువు దగ్గరికి తెచ్చాను
  rationale: హీబ్రూ కథన భూతకాల క్రమాన్ని ‘తెచ్చాను’ నిలుపుతుంది; הֵנָּהను ‘ఇక్కడ’గా, మానవ ఉన్నతాధికారిని సంబోధించే אֲדֹנִיను గౌరవార్థకంగా ‘నా ప్రభువు’గా అనువదించాం.
theological_decisions:
- issue: సౌలు మరణం గురించి అమాలేకీయుని వాదన
  choice: అమాలేకీయుడు తానే సౌలును చంపానని చెప్పిన మాటను నేరుగా అనువదించడం
  alternative: 1 సమూయేలు 31:4–5తో సమన్వయపరచడానికి ఈ వాదనను అనువాదంలోనే అబద్ధంగా లేదా అతిశయోక్తిగా సూచించడం
  rationale: ఈ వచనం అమాలేకీయుని ప్రత్యక్ష నివేదికను అందిస్తుంది. ఇతర కథనంతో కనిపించే ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా, వక్త చెప్పిన వాదనగానే నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష సంభాషణ శైలి ఉపయోగించబడింది. ‘బాహుభూషణం’ కొద్దిగా సాహిత్య పదమైనా వస్తువు బాహువుపై ధరించబడిందనే మూలభాషా వివరాన్ని కచ్చితంగా నిలుపుతుంది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక [a] పొరపాటున ‘చంపాను’ తర్వాత కనిపించినప్పటికీ, దాని విషయం చేతి ఆభరణానికి సంబంధించినందున తెలుగులో సంబంధిత పదం తర్వాత ఉంచబడింది; కథన సరిపోలిక పాదసూచిక [b] వాక్యాంతంలో ఉంచబడింది.
