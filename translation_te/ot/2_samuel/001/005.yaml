translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రశ్నార్థకతను యథాతథంగా ఉంచి, మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
