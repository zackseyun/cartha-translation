id: 2SA.1.5
reference: 2 Samuel 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד אֶל הַ/נַּ֖עַר הַ/מַּגִּ֣יד ל֑/וֹ אֵ֣יךְ יָדַ֔עְתָּ כִּי מֵ֥ת שָׁא֖וּל וִ/יהֽוֹנָתָ֥ן בְּנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/005.yaml
  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: te
  text: అప్పుడు దావీదు తనకు ఆ వార్త చెప్పిన యువకునితో, “సౌలు, సౌలు కుమారుడైన యోనాతాను చనిపోయారని నీకు ఎలా తెలుసు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఇది ప్రశ్న కావడంతో తెలుగులో సహజంగా ‘అప్పుడు ... అడిగాడు’ అని అనువదించాం.
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: నַעַר ఇక్కడ యుద్ధరంగపు సమాచారం అందించగల యువకుణ్ణి సూచిస్తుంది; ‘బాలుడు’ కంటే ‘యువకుడు’ సందర్భోచితం.
- source_word: הַמַּגִּיד לוֹ
  choice: తనకు ఆ వార్త చెప్పిన
  rationale: పార్టిసిపిల్ దావీదుకు సమాచారం అందించిన వ్యక్తిగా యువకుణ్ణి గుర్తిస్తుంది; సందర్భంలోని మరణవార్తను సూచిస్తూ ‘ఆ వార్త’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אֵיךְ יָדַעְתָּ
  choice: నీకు ఎలా తెలుసు?
  rationale: హీబ్రూ పర్ఫెక్ట్ గతంలో పొందిన సమాచారంపై ప్రస్తుతం ఉన్న జ్ఞానాన్ని ప్రశ్నిస్తుంది; ఆధునిక తెలుగులో ‘నీకు ఎలా తెలుసు?’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇది తెలిసిన విషయవస్తువును పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణాత్మక పూరకానికి ‘అని’ సరైనది.
- source_word: מֵת
  choice: చనిపోయారని
  rationale: హీబ్రూలో సంయుక్త కర్తతో ఏకవచన రూపం ఉన్నప్పటికీ, తెలుగులో ఇద్దరినీ సూచించే గౌరవ/బహువచన అనుసరణతో ‘చనిపోయారని’ సహజంగా ఉంటుంది.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: సర్వనామ ప్రత్యయం సౌలును సూచించి యోనాతానును అతని కుమారునిగా గుర్తిస్తుంది.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: సౌలు, ... యోనాతాను
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపాలను ఉపయోగించాం; ‘మరియు’కు బదులు జాబితాలో సహజమైన కామాను ఉంచాం.
