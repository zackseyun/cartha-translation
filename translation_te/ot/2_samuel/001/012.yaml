  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: te
  text: వారు సౌలు కోసం, అతని కుమారుడైన యోనాతాను కోసం, యాహ్వే ప్రజల కోసం, ఇశ్రాయేలు వంశం కోసం[a] విలపించారు, ఏడ్చారు, సాయంత్రం వరకు ఉపవాసమున్నారు; ఎందుకంటే వారు ఖడ్గం చేత పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘ఇశ్రాయేలు ఇల్లు’; ఇది ఇశ్రాయేలు సమాజమంతటినీ సూచించే సమూహపదం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: విలపించి
  rationale: ספד మృతుల కోసం ఆచరించే గంభీరమైన శోకాన్ని లేదా విలాపాన్ని సూచిస్తుంది. ‘విలపించి’ అనేది తరువాతి ‘ఏడ్చి’తో అర్థభేదాన్ని నిలుపుతుంది.
- source_word: וַיִּבְכּוּ
  choice: ఏడ్చి
  rationale: בכה నేరుగా ఏడవడం లేదా కన్నీరు కార్చడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన పదం.
- source_word: וַיָּצֻמוּ עַד הָעָרֶב
  choice: సాయంత్రం వరకు ఉపవాసమున్నారు
  rationale: צום ఆహారం మానుకొని ఉపవాసం ఉండడాన్ని, עַד הָעָרֶב దాని కాలపరిమితిని సూచిస్తాయి.
- source_word: עַל
  choice: కోసం
  rationale: ఇక్కడ పదేపదే వచ్చిన עַל శోకం ఎవరిని లేదా ఏ సమూహాన్ని బట్టి కలిగిందో పరిచయం చేస్తుంది; తెలుగులో ‘కోసం’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: అతని కుమారుడైన యోనాతాను
  rationale: בְּנוֹ యోనాతాను సౌలు కుమారుడని స్పష్టపరుస్తుంది. తెలుగు వాక్యనిర్మాణంలో సంబంధం సందిగ్ధం కాకుండా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: עַם יְהוָה
  choice: యాహ్వే ప్రజలు
  rationale: ఈ నిర్మాణం యాహ్వేకు చెందిన ప్రజలను సూచిస్తుంది; సంక్షిప్తమైన ఈ రూపం నిబంధనాత్మక సమూహభావాన్ని నిలుపుతుంది.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారు
  rationale: ‘ఇల్లు’ అనే హీబ్రూ సమూహరూపకాన్ని పూర్తిగా తొలగించకుండా, మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: כִּי נָפְלוּ בֶּחָרֶב
  choice: ఎందుకంటే వారు ఖడ్గానికి కూలిపోయారు
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది; נפל ... בחרב యుద్ధంలో ఖడ్గం వల్ల మరణించడాన్ని చిత్రాత్మకంగా చెబుతుంది. ‘కూలిపోయారు’ ఆ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: ‘వారు ఖడ్గానికి కూలిపోయారు’ అనే బహువచన కర్త పరిధి
  choice: మూలంలోని బహువచన అస్పష్టతను నిలుపడం
  alternative: సౌలు, యోనాతాను మాత్రమే ఖడ్గానికి కూలిపోయారని స్పష్టీకరించడం
  rationale: נָפְלוּ బహువచనంలో ఉన్నప్పటికీ, ముందున్న జాబితాలోని ఏ అంశాలన్నింటిని అది వ్యాకరణపరంగా చేర్చుకుంటుందో వాక్యం ప్రత్యేకంగా పరిమితం చేయదు. అందువల్ల అనువాదం దానిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని వాడాం. ‘విలపించి, ఏడ్చి’ అనే రెండు క్రియలను వేర్వేరుగా ఉంచి మూలంలోని శోకక్రియల భేదాన్ని నిలిపాం; ‘ఖడ్గానికి కూలిపోయారు’ ద్వారా యుద్ధమరణపు మూలరూపకాన్ని పరిరక్షించాం.
