id: 2SA.1.20
reference: 2 Samuel 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: te
  text: 'గాతులో దానిని చెప్పవద్దు;

    అష్కెలోను వీధుల్లో ఆ వార్తను ప్రకటించవద్దు[a].

    లేకపోతే ఫిలిష్తీయుల కుమార్తెలు సంతోషిస్తారు;

    సున్నతి లేనివారి కుమార్తెలు ఉల్లసిస్తారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ వార్తను ప్రకటించవద్దు’ అనే మాటను ‘ఆ వార్తను తెలియజేయవద్దు’ లేదా ‘ఆ వార్తను తీసుకురావద్దు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సున్నతి లేనివారి కుమార్తెలు’ అనేది ఫిలిష్తీయులను ఉద్దేశించిన నిబంధనాత్మక నిందాపదానికి అక్షరార్థ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: దానిని చెప్పవద్దు
  rationale: נגד అనే క్రియకు ‘చెప్పు, తెలియజేయు, నివేదించు’ అనే అర్థాలున్నాయి. సందర్భంలో సౌలు, యోనాతానుల పతనవార్త కర్మగా అంతర్లీనంగా ఉంది; సహజమైన తెలుగుకోసం ‘దానిని’ చేర్చబడింది.
- source_word: בְגַת
  choice: గాతులో
  rationale: בְ అనే స్థానార్థక ఉపసర్గను నగరనామమైన గాతుతో సహజమైన తెలుగు విభక్తిలో అందించింది.
- source_word: תְּבַשְּׂרוּ
  choice: ఆ వార్తను ప్రకటించవద్దు
  rationale: పియేల్ రూపంలోని בשר వార్తను తీసుకురావడం లేదా ప్రకటించడం సూచిస్తుంది. ‘ప్రకటించవద్దు’ బహిరంగ ప్రకటన భావాన్ని నిలుపుతూ మొదటి పాదంలోని ‘చెప్పవద్దు’తో సమాంతరతను కాపాడుతుంది.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: అష్కెలోను వీధుల్లో
  rationale: חוּצוֹת నగరంలోని వీధులు లేదా బహిరంగ ప్రదేశాలను సూచించగలదు. ఈ సందర్భంలో ‘వీధుల్లో’ సహజంగా ఉండి బహిరంగ ప్రచార దృశ్యాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ప్రతికూల ఉద్దేశం లేదా సంభవించే ఫలితాన్ని పరిచయం చేసే פֶּן భావాన్ని ఆధునిక తెలుగులో ‘లేకపోతే’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּשְׂמַחְנָה
  choice: సంతోషిస్తారు
  rationale: שמח సంతోషం లేదా ఆనందాన్ని సూచిస్తుంది. ‘సంతోషిస్తారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల కుమార్తెలు
  rationale: ‘కుమార్తెలు’ అనే అక్షరార్థ రూపం విలాపంలోని కవితాత్మక సమాంతరతను, ఫిలిష్తీయ స్త్రీలను విజయోత్సవం చేసేవారిగా చిత్రించే భావాన్ని నిలుపుతుంది.
- source_word: תַּעֲלֹזְנָה
  choice: ఉల్లసిస్తారు
  rationale: עלז మిక్కిలి ఉత్సాహంతో ఆనందించడాన్ని సూచిస్తుంది. ‘ఉల్లసిస్తారు’ ముందు పాదంలోని ‘సంతోషిస్తారు’ కంటే బలమైన భావాన్ని ఇచ్చి క్రియల తీవ్రతాభివృద్ధిని నిలుపుతుంది.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: సున్నతి లేనివారి కుమార్తెలు
  rationale: עֲרֵלִים అక్షరార్థంగా ‘సున్నతి లేనివారు.’ ఈ రూపం ఫిలిష్తీయులపై ప్రయోగించిన నిబంధనాత్మక-మతపరమైన నిందార్థాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: עֲרֵלִים అనే నిబంధనాత్మక నిందాపదం అనువాదం
  choice: సున్నతి లేనివారు
  alternative: అన్యజనులు; అపవిత్రులు
  rationale: హీబ్రూ పదం నేరుగా సున్నతితోను, అందువల్ల నిబంధన గుర్తింపుతోను సంబంధించింది. ‘అన్యజనులు’ లేదా ‘అపవిత్రులు’ అని సాధారణీకరించడం కంటే అక్షరార్థ అనువాదం మూలంలోని దైవశాస్త్రీయ, వాక్చాతుర్య బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు ఉపయోగించబడింది. విలాపానికి తగిన గంభీరతను నిలుపుతూ అతిగా ప్రాచీనమైన క్రియారూపాలు నివారించబడ్డాయి. హీబ్రూ కవిత్వంలోని రెండు నిషేధాలు, రెండు ఫలిత పాదాలు, అలాగే ‘సంతోషిస్తారు/ఉల్లసిస్తారు’ అనే తీవ్రతాభివృద్ధి కాపాడబడ్డాయి.
