  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యం నిలిచేలా రెండు వాక్యాలుగా రూపొందించబడింది. హీబ్రూ కథన సంధిని తెలుగులో అనవసరంగా పదశః పునరుత్పత్తి చేయలేదు.
