source:
  edition: WLC
  text: וַ/יְהִ֗י אַֽחֲרֵי֙ מ֣וֹת שָׁא֔וּל וְ/דָוִ֣ד שָׁ֔ב מֵ/הַכּ֖וֹת אֶת הָ/עֲמָלֵ֑ק וַ/יֵּ֧שֶׁב דָּוִ֛ד בְּ/צִקְלָ֖ג יָמִ֥ים שְׁנָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: te
  text: సౌలు మరణించిన తరువాత, దావీదు అమాలేకీయులను కొట్టి తిరిగి వచ్చినప్పుడు, దావీదు సిక్లగులో రెండు రోజులు ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనాన్ని కొనసాగించే సన్నివేశారంభ సూత్రం. తెలుగులో తరువాతి కాలవాచక ఉపవాక్యమే కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అప్పుడు జరిగింది’ అని పెట్టడం కృత్రిమంగా ఉంటుంది.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: సౌలు మరణించిన తరువాత
  rationale: హీబ్రూ నామవాచక నిర్మాణంలోని కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְדָוִד שָׁב
  choice: దావీదు ... తిరిగి వచ్చాడు
  rationale: ప్రధాన కథన చర్యకు ముందు పూర్తయిన తిరుగు ప్రయాణాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగు క్రియాక్రమంలో దీనిని సహజంగా తెలిపింది.
- source_word: מֵהַכּוֹת
  choice: హతమార్చి
  rationale: נכה క్రియలోని సైనిక హింసను నిలుపుతుంది. ‘ఓడించి’ కంటే బలమైనది, కానీ మొత్తం ప్రజలను నిర్మూలించాడనే భావాన్ని తప్పనిసరిగా కలిగించదు.
- source_word: אֶת הָעֲמָלֵק
  choice: అమాలేకీయులను
  rationale: ఏకవచన జాతినామమైన ‘అమాలేకు’ ఇక్కడ ఆ ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగులో ప్రజావాచక బహువచనం సహజం.
- source_word: וַיֵּשֶׁב
  choice: ఉన్నాడు
  rationale: రెండు రోజుల పరిమిత కాలానికి ‘నివసించాడు’ కంటే ‘ఉన్నాడు’ సహజంగా సరిపోతుంది.
- source_word: בְּצִקְלָג
  choice: సిక్లగులో
  rationale: స్థల నామానికి సహజమైన తెలుగు స్థానవాచక రూపం.
- source_word: יָמִים שְׁנָיִם
  choice: రెండు రోజులు
  rationale: కాలవ్యవధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
