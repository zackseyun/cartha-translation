id: 2SA.1.9
reference: 2 Samuel 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲמָד נָ֤א עָלַ/י֙ וּ/מֹ֣תְתֵ֔/נִי כִּ֥י אֲחָזַ֖/נִי הַ/שָּׁבָ֑ץ כִּֽי כָל ע֥וֹד נַפְשִׁ֖/י בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/009.yaml
  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: te
  text: 'అతడు నాతో ఇలా అన్నాడు: “దయచేసి నా మీద నిలబడి నన్ను చంపు. ఎందుకంటే తీవ్రమైన వేదన నన్ను పట్టుకుంది[a]; అయినా నా ప్రాణం ఇంకా నాలోనే ఉంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కండరాల ముడతలు లేదా మూర్ఛలు నన్ను పట్టుకున్నాయి.” ఇక్కడ వాడిన హెబ్రీ పదం అరుదైనది; దాని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఎందుకంటే నా ప్రాణమంతా ఇంకా నాలోనే ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: అతడు నాతో ఇలా అన్నాడు
  rationale: కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది; אֵלַי లోని ‘నాతో’ అనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֲמָד נָא עָלַי
  choice: దయచేసి నా మీద నిలబడి
  rationale: עָמַד యొక్క ‘నిలబడు’ అర్థాన్ని, עַל వల్ల గాయపడి పడివున్న వ్యక్తి మీదుగా నిలిచే భావాన్ని, נָא లోని వినయపూర్వక విన్నపాన్ని కాపాడుతుంది.
- source_word: וּמֹתְתֵנִי
  choice: నన్ను చంపు
  rationale: מות యొక్క కారణార్థక రూపం ఇక్కడ నేరుగా మరణింపజేయమనే విజ్ఞప్తి. ‘చంపు’ యుద్ధసందర్భంలో సహజంగా, సందిగ్ధత లేకుండా ఉంటుంది.
- source_word: אֲחָזַנִי
  choice: నన్ను పట్టుకుంది
  rationale: אָחַז లోని బలంగా పట్టుకోవడం లేదా ఆవరించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַשָּׁבָץ
  choice: తీవ్రమైన వేదన
  rationale: ఈ అరుదైన హెబ్రీ పదానికి ఖచ్చితమైన అర్థం అనిశ్చితం. ప్రధాన పాఠంలో అతిగా నిర్దిష్టమైన శారీరక నిర్ధారణ చేయకుండా సందర్భోచితమైన విస్తృత పదాన్ని వాడి, ఇతర అవకాశాలను పాదసూచికలో ఉంచాం.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: అయినా నా ప్రాణం ఇంకా పూర్తిగా నాలోనే ఉంది
  rationale: נֶפֶשׁ ఇక్కడ సాంకేతికంగా దేహానికి భిన్నమైన ఆత్మకన్నా జీవప్రాణాన్ని సూచిస్తుంది. כָל עוֹד లోని ‘ఇంకా పూర్తిగా’ అనే బలాన్ని నిలుపుతూ, సందర్భంలో కనిపించే వ్యతిరేకార్థక సంబంధాన్ని ‘అయినా’ ద్వారా సహజంగా తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష వాక్యంలో అత్యవసరతను నిలుపుతూ సరళమైన పదజాలం వాడబడింది. అరుదైన הַשָּׁבָץ పదంలోని అనిశ్చితిని పాదసూచిక ద్వారా కాపాడాం; చివరి כִּי యొక్క రూపపరమైన కారణార్థాన్ని పాదసూచికలో చూపించి, సందర్భోచితమైన వ్యతిరేక భావాన్ని ప్రధాన పాఠంలో ఉంచాం.
