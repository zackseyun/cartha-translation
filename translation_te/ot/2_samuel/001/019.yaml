translation:
  language: te
  text: ఇశ్రాయేలూ, నీ వైభవం[a] నీ ఎత్తైన ప్రదేశాలపై[b] హతమై పడి ఉంది! పరాక్రమవంతులు ఎలా పడిపోయారు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని ‘అందం’ లేదా ‘శోభ’ అని కూడా అనువదించవచ్చు; కొందరు దాన్ని ‘జింక’ అనే పదార్థంలో తీసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ ఉన్నత స్థలాలపై.’ ఇక్కడ ఆరాధనా స్థలాలనే భావం అనవసరంగా కలగకుండా, భౌగోళిక అర్థాన్ని నిలుపుకోవడానికి ‘ఎత్తైన ప్రదేశాలు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: నీ వైభవం
  rationale: צְבִי అనే పదానికి అందం, శోభ, వైభవం అనే భావార్థాలతో పాటు జింక అనే స్పష్టార్థం కూడా ఉండవచ్చు. సౌలు, యోనాతానుల మరణంపై చేసిన ఈ విలాపంలో, ఇశ్రాయేలును నేరుగా సంబోధిస్తున్న సందర్భానికి ‘నీ వైభవం’ సహజంగా సరిపోతుంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: ఇది ప్రత్యక్ష సంబోధన అని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి సంబోధన రూపాన్ని వాడాం.
- source_word: עַל
  choice: పై
  rationale: హతమైనవాడు ఇశ్రాయేలు ఎత్తైన ప్రదేశాలపై పడి ఉన్నాడనే స్థానార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בָּמוֹתֶיךָ
  choice: నీ ఎత్తైన ప్రదేశాలపై
  rationale: భౌగోళికంగా ఎత్తులో ఉన్న ప్రదేశాలనే ప్రధానంగా సూచిస్తూ, ఆరాధనా సంబంధమైన ‘ఉన్నత స్థలాలు’ అనే భావాన్ని అనవసరంగా ముందుకు తేవకుండా అనువదించాం.
- source_word: חָלָל
  choice: హతమై పడి ఉంది
  rationale: చంపబడిన స్థితిని సూచించే హీబ్రూ పదాన్ని తెలుగులో సహజమైన విధేయ పదబంధంగా అందించాం.
- source_word: אֵיךְ
  choice: ఎలా
  rationale: విలాపంలోని ఆశ్చర్యం, దుఃఖం కలిసిన ఉద్గారాన్ని సహజంగా నిలుపుతుంది.
- source_word: נָפְלוּ
  choice: పడిపోయారు
  rationale: జరిగిపోయిన మరణాన్ని విలాప పల్లవిలో సజీవంగా ప్రకటించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גִבּוֹרִים
  choice: పరాక్రమవంతులు
  rationale: ఈ పదం బలశాలులు, యోధులు, వీరులు అనే విస్తృత భావాలను కలిగి ఉంది. ‘పరాక్రమవంతులు’ ఆ కవితాత్మక విస్తృతిని కాపాడుతుంది.
