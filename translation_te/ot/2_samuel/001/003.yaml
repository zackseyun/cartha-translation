translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో సందర్భోచితమైన ఏకవచన ‘నువ్వు’ వాడబడింది. మూలంలోని భావాన్ని సహజ తెలుగులో అందించేందుకు ‘అన్నాడు’ పునరుక్తికి బదులుగా ‘అడిగాడు ... జవాబిచ్చాడు’ వాడబడింది.
