  to: దావీదు అతనితో, “నువ్వు ఎక్కడి నుండి వచ్చావు?” అన్నాడు. అతడు దావీదుతో, “నేను ఇశ్రాయేలు శిబిరం నుండి తప్పించుకున్నాను” అన్నాడు.
