source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ דָּוִ֔ד אֵ֥י מִ/זֶּ֖ה תָּב֑וֹא וַ/יֹּ֣אמֶר אֵלָ֔י/ו מִ/מַּחֲנֵ֥ה יִשְׂרָאֵ֖ל נִמְלָֽטְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: te
  text: దావీదు అతనితో, “నువ్వు ఎక్కడి నుండి వచ్చావు?” అన్నాడు. అతడు దావీదుతో, “నేను ఇశ్రాయేలు శిబిరం నుండి తప్పించుకున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: ఎక్కడి నుండి
  rationale: ఈ హీబ్రూ నుడికారం వచ్చిన స్థలాన్ని లేదా మూలాన్ని ప్రశ్నిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ఎక్కడి నుండి’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תָּבוֹא
  choice: వచ్చావు
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, ఈ ప్రత్యక్ష ప్రశ్నలో ఇప్పటికే జరిగిన రాకను గురించి అడుగుతోంది. తెలుగులో ‘వచ్చావు’ సందర్భానికి సహజమైన భూతకాల ప్రయోగం.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శిబిరం నుండి
  rationale: מַחֲנֶה సైనిక శిబిరాన్ని సూచిస్తుంది. ఈ ఎంపిక హీబ్రూ సంబంధ నిర్మాణాన్ని, సైనిక సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִמְלָטְתִּי
  choice: తప్పించుకొని వచ్చాను
  rationale: מלט నిఫల్ రూపం ప్రమాదం నుండి విజయవంతంగా తప్పించుకోవడాన్ని సూచిస్తుంది. తెలుగులో ‘తప్పించుకొని వచ్చాను’ తప్పించుకోవడాన్నీ, దావీదు దగ్గరకు చేరిన సందర్భాన్నీ సహజంగా వ్యక్తం చేస్తుంది; ప్రమాద స్వరూపాన్ని అదనంగా నిర్ధారించదు.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అడిగాడు ... జవాబిచ్చాడు
  rationale: హీబ్రూలో రెండుసార్లూ సాధారణ ‘చెప్పాడు’ క్రియే ఉన్నా, మొదటిది ప్రశ్న, రెండవది దానికి సమాధానం. ఆధునిక తెలుగులో సంభాషణ పాత్రలను ‘అడిగాడు ... జవాబిచ్చాడు’ అని చెప్పడం సహజంగా ఉండి మూలార్థాన్ని మార్చదు.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
