  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֥י/ו דָּוִ֛ד מֶה הָיָ֥ה הַ/דָּבָ֖ר הַגֶּד נָ֣א לִ֑/י וַ֠/יֹּאמֶר אֲשֶׁר נָ֨ס הָ/עָ֜ם מִן הַ/מִּלְחָמָ֗ה וְ/גַם הַרְבֵּ֞ה נָפַ֤ל מִן הָ/עָם֙ וַ/יָּמֻ֔תוּ וְ/גַ֗ם שָׁא֛וּל וִ/יהוֹנָתָ֥ן בְּנ֖/וֹ מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: te
  text: దావీదు అతనితో, “ఏం జరిగింది?[a] దయచేసి నాకు చెప్పు” అన్నాడు. అతడు, “ప్రజలు యుద్ధం నుండి పారిపోయారు; ప్రజలలో చాలామంది కూలిపోయి చనిపోయారు.[b] సౌలు, అతని కుమారుడు యోనాతాను కూడా చనిపోయారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విషయం ఏమిటి?” అక్షరార్థంగా, “ఆ సంగతి ఏమిటి?”
    reason: lexical_alternative
  - marker: b
    text: ‘కూలిపోవడం’ అనేది యుద్ధంలో హతమవడాన్ని సూచించే సాధారణ హీబ్రూ ప్రయోగం; ఆ వెంటనే ఉన్న ‘చనిపోయారు’ అనే మాట ఫలితాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: ఏం జరిగింది?
  rationale: అక్షరార్థంగా ‘విషయం ఏమైంది?’ అనే భావమున్న ఈ హీబ్రూ ప్రయోగం సందర్భంలో జరిగిన పరిణామాన్ని అడుగుతోంది. ఆధునిక తెలుగులో ‘ఏం జరిగింది?’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַגֶּד נָא לִי
  choice: దయచేసి నాకు చెప్పు
  rationale: הַגֶּד అనేది ‘చెప్పు/తెలియజేయి’ అనే ఆజ్ఞ; נָא వినయాన్ని లేదా అభ్యర్థనలోని ఆతురతను సూచిస్తుంది. ఈ రెండింటినీ ఈ అనువాదం నిలుపుతుంది.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: ప్రజలు యుద్ధం నుండి పారిపోయారు
  rationale: נָס అంటే ‘పారిపోయారు.’ הָעָם ఇక్కడ సమూహంగా ఉన్న ఇశ్రాయేలు ప్రజలను లేదా సైనిక బలగాన్ని సూచించవచ్చు; ‘ప్రజలు’ మూలంలోని సాధారణ పదాన్ని నిలుపుతుంది.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: ప్రజల్లో చాలామంది యుద్ధంలో కూలి చనిపోయారు
  rationale: యుద్ధ సందర్భంలో נפל ‘కూలిపోవడం/హతమవడం’ అనే భావాన్ని ఇస్తుంది; వెంటనే వచ్చే וַיָּמֻתוּ మరణాన్ని స్పష్టపరుస్తుంది. ‘యుద్ధంలో కూలి చనిపోయారు’ హీబ్రూ చిత్రణనూ ఫలితాన్నీ నిలుపుతుంది.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: సౌలు, అతని కుమారుడు యోనాతాను కూడా చనిపోయారు
  rationale: מֵתוּ భూతకాల మరణవార్తను తెలియజేస్తుంది. ‘చనిపోయారు’ తెలుగు కథనంలో సహజంగా ఉండి, ‘అతని కుమారుడు’ అనే మూలపాఠంలోని సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ‘ప్రజలు,’ ‘కూలి,’ ‘చనిపోయారు’ అనే వరుస భావాలను సాధ్యమైనంతవరకు నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం ఉపయోగించబడింది.
