source:
  edition: WLC
  text: וַ/יִּקְרָ֣א דָוִ֗ד לְ/אַחַד֙ מֵֽ/הַ/נְּעָרִ֔ים וַ/יֹּ֖אמֶר גַּ֣שׁ פְּגַע בּ֑/וֹ וַ/יַּכֵּ֖/הוּ וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: te
  text: అప్పుడు దావీదు యువకులలో ఒకరిని పిలిచి, “అతని దగ్గరికి వెళ్లి, అతనిపై దాడి చేయి[a]” అన్నాడు. అతడు అతనిని కొట్టాడు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనిపై పడు” లేదా “అతనిని కొట్టు.” హెబ్రీ పదబంధం (פְּגַע בּוֹ) హింసాత్మకంగా దాడి చేయడం లేదా మీదపడడం అని కూడా అర్థం కావచ్చు; ఇక్కడి సందర్భంలో దాని ఫలితం మరణమని తరువాతి వాక్యం స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ కథన సందర్భంలో קרא అంటే పిలవడం లేదా రమ్మని ఆదేశించడం. ‘పిలిచి’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: యువకుల్లో ఒకణ్ణి
  rationale: נְעָרִים అనే పదం సందర్భానుసారంగా యువకులు, సేవకులు లేదా పరిచారకులను సూచించవచ్చు. ఇక్కడ దావీదు వెంట ఉన్నవారిలో ఒక యువకుణ్ణి సూచించే ప్రత్యక్ష పదప్రయోగాన్ని ఉంచాం.
- source_word: גַּשׁ
  choice: దగ్గరికి వెళ్లి
  rationale: נגשׁ అంటే దగ్గరికి రావడం లేదా సమీపించడం. ఆ యువకుడు శిక్షించబడే వ్యక్తి దగ్గరికి వెళ్లవలసి ఉన్నందున తెలుగులో ‘దగ్గరికి వెళ్లి’ సహజంగా ఉంది.
- source_word: פְּגַע בּוֹ
  choice: అతణ్ణి కొట్టి చంపు
  rationale: פגע ב అనే ప్రయోగం దాడిచేయడం, మీదపడడం లేదా ప్రాణాంతకంగా కొట్టడం అనే అర్థాలు ఇవ్వగలదు. సందర్భం ఆజ్ఞ ప్రాణాంతకమైనదని స్పష్టం చేస్తుంది; తెలుగు ‘కొట్టి చంపు’ హింసాత్మక చర్యనూ ఉద్దేశించిన ఫలితాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּכֵּהוּ
  choice: అతడు అతణ్ణి కొట్టాడు
  rationale: נכה సాధారణంగా ‘కొట్టు’ అని అర్థం. తర్వాతి వాక్యభాగమే మరణాన్ని తెలుపుతుంది కాబట్టి చర్యను, ఫలితాన్ని వేర్వేరుగా ఉంచాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: מות అంటే చనిపోవడం. హెబ్రీ కథన క్రమాన్ని తెలుగులో స్పష్టంగా కొనసాగించేందుకు ఈ ప్రత్యక్ష రూపాన్ని వాడాం.
