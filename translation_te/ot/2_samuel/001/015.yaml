translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘యువకులు’ అనే మూలపదంలోని వయస్సు/హోదా భావాన్ని నిలిపి, ‘సేవకులు’ లేదా ‘పరిచారకులు’ అని కార్యపరంగా ప్రత్యేకీకరించలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
