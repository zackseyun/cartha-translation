  to: అప్పుడు దావీదు యువకులలో ఒకరిని పిలిచి, “అతని దగ్గరికి వెళ్లి, అతనిపై దాడి చేయి[a]” అన్నాడు. అతడు అతనిని కొట్టాడు; అతడు చనిపోయాడు.
