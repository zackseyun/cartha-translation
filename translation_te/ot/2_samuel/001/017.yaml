- from: అప్పుడు దావీదు సౌలును, అతని కుమారుడైన యోనాతానును గురించి ఈ శోకగీతాన్ని ఆలపించాడు.[a]
  to: అప్పుడు దావీదు సౌలు మీదా, అతని కుమారుడైన యోనాతాను మీదా ఈ విలాపగీతాన్ని ఆలపించాడు.[a]
  rationale: The revision strengthens the rendering of עַל as the persons over whom David performed the lament and uses “విలాపగీతం” for the formal קִינָה. It retains the performative sense reflected in the English audit trail while preserving the alternative, cognate Hebrew construction in the footnote.
