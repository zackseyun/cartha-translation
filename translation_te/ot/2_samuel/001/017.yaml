  edition: WLC
  text: וַ/יְקֹנֵ֣ן דָּוִ֔ד אֶת הַ/קִּינָ֖ה הַ/זֹּ֑את עַל שָׁא֖וּל וְ/עַל יְהוֹנָתָ֥ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/017.yaml
  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: te
  text: అప్పుడు దావీదు సౌలు మీదా, అతని కుమారుడైన యోనాతాను మీదా ఈ విలాపగీతాన్ని ఆలపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విలాపంతో విలపించాడు’; హీబ్రూలో క్రియ, నామవాచకం ఒకే మూలానికి చెందినవి. ఈ పదప్రయోగం అధికారికంగా మృతుల కోసం విలాపాన్ని ఎత్తుకొని పలకడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: అప్పుడు ... శోకగీతాన్ని ఆలపించాడు
  rationale: קונן అంటే మరణించినవారి కోసం పద్ధతిబద్ధమైన విలాపాన్ని ఎత్తుకొని పలకడం లేదా ఆలపించడం. తెలుగు సహజ వాడుకలో ‘శోకగీతాన్ని ఆలపించాడు’ ఆ ప్రదర్శనాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది; కేవలం ‘విలపించాడు’ అంటే దాని అధికారిక గీతరూపం మరుగునపడవచ్చు.
- source_word: הַקִּינָה הַזֹּאת
  choice: ఈ శోకగీతాన్ని
  rationale: קִינָה అనేది ముఖ్యంగా మృతుల కోసం పలికే అధికారిక విలాపగీతం. ‘శోకగీతం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది; הַזֹּאת ను ‘ఈ’గా నేరుగా అనువదించాం.
- source_word: עַל
  choice: గురించి
  rationale: ఇక్కడ עַל విలాపానికి విషయమైన వ్యక్తులను సూచిస్తుంది. తెలుగులో ‘గురించి శోకగీతాన్ని ఆలపించాడు’ సహజంగా ఉండి, వారి మరణం నిమిత్తం చేసిన విలాప భావాన్ని సందర్భంలో తెలియజేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడైన
  rationale: ఏకవచన పురుష ప్రత్యయం సౌలును సూచిస్తుంది; యోనాతాను సౌలు కుమారుడని సహజ తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్‌తో కూడిన wayyiqtol కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగులో ఆ వరుసను సహజంగా తెలియజేస్తుంది.
