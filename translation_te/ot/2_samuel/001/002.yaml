base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: te
  text: మూడవ రోజున, ఇదిగో, ఒక వ్యక్తి సౌలు వద్దనున్న శిబిరం నుండి వచ్చాడు.[a] అతని బట్టలు చినిగిపోయి ఉన్నాయి, అతని తలపై మట్టి ఉంది.[b] అతడు దావీదు దగ్గరకు వచ్చినప్పుడు నేలమీద పడి ప్రణామం చేశాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సౌలు వద్దనున్న శిబిరం నుండి’ అనే హీబ్రూ పదబంధాన్ని ‘సౌలుతో ఉన్న చోటు నుండి’ లేదా ‘సౌలు వైపు నుండి’ అని కూడా అనువదించవచ్చు. అతణ్ణి సౌలే నేరుగా పంపాడని ఇది తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని తలపై నేలమట్టి.’ ఇది దుఃఖాన్ని లేదా శోకాన్ని తెలిపే ఆచార సూచన.
    reason: cultural_note
  - marker: c
    text: దీనిని ‘పూర్తిగా వంగి ప్రణామం చేశాడు’ అని కూడా అనువదించవచ్చు. ఈ క్రియ సందర్భానుసారం ప్రగాఢ గౌరవం, విధేయత లేదా ఆరాధనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కథన క్రమాన్ని తెలిపే וַיְהִיకు తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ వంటి అదనపు పదం అవసరం లేదు; కాలవాచక పదబంధమే సహజంగా తదుపరి సంఘటనను పరిచయం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనాన్ని సజీవంగా పాఠకుని దృష్టికి తీసుకువచ్చే హీబ్రూ సూచక బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ בָּא
  choice: ఒక మనిషి ... వచ్చాడు
  rationale: ఏకవచన పురుష వ్యక్తిని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: శిబిరం నుంచి, సౌలు దగ్గర నుంచి
  rationale: రెండు మూల పదబంధాలనూ నిలుపుతూ, מֵעִםలోని సౌలుతో అనుబంధం లేదా అతని వైపు అనే భావాన్ని నేరుగా పంపించబడ్డాడనే అర్థానికి పరిమితం చేయదు.
- source_word: וּבְגָדָיו קְרֻעִים
  choice: అతని బట్టలు చినిగిపోయి ఉన్నాయి
  rationale: దుఃఖ సూచకమైన బాహ్య స్థితిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: అతని తలపై మట్టి ఉంది
  rationale: אֲדָמָה యొక్క ‘నేల/మట్టి’ భావాన్ని కాపాడుతూ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: అతడు దావీదు దగ్గరకు వచ్చినప్పుడు
  rationale: ఇన్ఫినిటివ్ నిర్మాణంలోని కాలసంబంధాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: וַיִּפֹּל אַרְצָה וַיִּשְׁתָּחוּ
  choice: నేలమీద పడి సాష్టాంగ నమస్కారం చేశాడు
  rationale: కింద పడటం, గౌరవంతో పూర్తిగా వంగటం అనే వరుస చర్యలను నిలుపుతుంది; దీనిని దేవారాధనగా మాత్రమే నిర్వచించదు.
theological_decisions:
- issue: וַיִּשְׁתָּחוּ దేవారాధననా, రాజుకు చూపిన గౌరవమా అనే సందర్భార్థం
  choice: సాష్టాంగ నమస్కారం చేశాడు
  alternative: ఆరాధించాడు
  rationale: ఈ క్రియ సందర్భానుసారం గౌరవం, విధేయత, ప్రణామం లేదా ఆరాధనను సూచించగలదు. ఇక్కడ దావీదు ఎదుట చేసిన చర్య కాబట్టి ‘ఆరాధించాడు’ అని మతపరమైన అర్థాన్ని బలవంతంగా చేర్చకుండా శరీర భంగిమను తెలిపే అనువాదం ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని సజీవ సూచనను నిలుపుతుంది. ‘సాష్టాంగ నమస్కారం’ శరీర భంగిమను స్పష్టంగా తెలిపినా, దానిని దేవారాధనగా మాత్రమే నిర్ణయించదు.
