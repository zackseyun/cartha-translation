  text: וַ/יֹּ֜אמֶר הַ/נַּ֣עַר הַ/מַּגִּ֣יד ל֗/וֹ נִקְרֹ֤א נִקְרֵ֨יתִי֙ בְּ/הַ֣ר הַ/גִּלְבֹּ֔עַ וְ/הִנֵּ֥ה שָׁא֖וּל נִשְׁעָ֣ן עַל חֲנִית֑/וֹ וְ/הִנֵּ֥ה הָ/רֶ֛כֶב וּ/בַעֲלֵ֥י הַ/פָּרָשִׁ֖ים הִדְבִּקֻֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: te
  text: 'దావీదుకు ఆ సంగతి తెలియజేసిన యువకుడు ఇలా అన్నాడు: “నేను యాదృచ్ఛికంగా గిల్బోవ పర్వతంపై ఉన్నాను.[a] ఇదిగో, సౌలు తన ఈటెపై ఆనుకొని ఉన్నాడు; ఇదిగో, రథాలూ గుర్రపు రౌతులూ అతన్ని తరుముతూ దగ్గరపడ్డాయి.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అనుకోకుండా గిల్బోవ పర్వతంపై ఉన్నాను.” హెబ్రీ నుడికారం అక్కడ ఉండటం యాదృచ్ఛికమని బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రథబలగమూ గుర్రపు స్వారులూ అతన్ని చేరుకున్నాయి” లేదా “అతనిపై బలంగా ఒత్తిడి తెస్తూ తరుముతున్నాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: సందర్భంలో అమాలేకీయ సందేశకుణ్ణి సూచించే נַעַרకు ఆధునిక తెలుగులో సహజమైన, హోదాను అనవసరంగా సూచించని సమానార్థకం.
- source_word: הַמַּגִּיד לוֹ
  choice: అతనికి ఆ సంగతి తెలియజేసిన
  rationale: נגד క్రియాపద భాగం దావీదుకు నివేదిక ఇస్తున్న యువకుణ్ణి విశేషిస్తుంది; తెలుగు కథనంలో ఈ రూపం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: నేను అనుకోకుండా ... వచ్చాను
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ యాదృచ్ఛికంగా అక్కడికి రావడాన్ని బలపరుస్తుంది; ‘అనుకోకుండా’ ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: గిల్బోవ పర్వతం మీదికి
  rationale: పేరుగల పర్వతాన్ని సూచించే הַרకు ‘పర్వతం’ సరైన భౌగోళిక పదం; రావడం అనే క్రియతో ‘మీదికి’ సహజంగా సరిపోతుంది.
- source_word: וְהִנֵּה
  choice: అక్కడ
  rationale: దృశ్యంపై ఆకస్మికంగా దృష్టి నిలిపే הִנֵּה యొక్క కథన ప్రభావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; రెండో ప్రయోగం వాక్యప్రవాహంలో దృశ్యవర్ణన ద్వారానే ప్రతిఫలిస్తుంది.
- source_word: נִשְׁעָן
  choice: ఆనుకొని ఉన్నాడు
  rationale: నిఫాల్ పార్టిసిపిల్ భౌతికంగా ఆధారం చేసుకోవడాన్ని సూచిస్తుంది; ‘ఆనుకొని’ దీనికి సూటి తెలుగు రూపం.
- source_word: חֲנִיתוֹ
  choice: తన ఈటెపై
  rationale: חֲנִית యుద్ధాయుధమైన spear/lanceను సూచిస్తుంది; ‘ఈటె’ సాధారణ పాఠకులకు స్పష్టమైన తెలుగు పదం.
- source_word: הָרֶכֶב
  choice: రథాలు
  rationale: సమూహార్థక רֶכֶבను తెలుగు కథనంలో సహజంగా బహువచన ‘రథాలు’గా వ్యక్తపరుస్తుంది.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: అక్షరార్థంగా గుర్రాల యజమానులు/స్వారులు అనే హెబ్రీ నుడికారానికి యుద్ధ సందర్భంలో స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: הִדְבִּקֻהוּ
  choice: అతనికి చేరువగా దూసుకొస్తున్నాయి
  rationale: హిఫిల్ రూపం వెంటాడుతూ చేరుకోవడం, సమీపించడం లేదా పట్టుకోవడాన్ని సూచిస్తుంది; కొనసాగుతున్న ప్రమాద దృశ్యాన్ని ఈ రూపం నిలుపుతుంది.
