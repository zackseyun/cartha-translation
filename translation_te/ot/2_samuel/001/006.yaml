revisions:
- from: 'అతనికి ఆ సంగతి తెలియజేసిన యువకుడు ఇలా అన్నాడు: “నేను అనుకోకుండా గిల్బోవ పర్వతం మీదికి వచ్చాను.[a] అక్కడ సౌలు తన ఈటెపై ఆనుకొని ఉన్నాడు. రథాలూ గుర్రపు రౌతులూ అతనికి చేరువగా దూసుకొస్తున్నాయి.[b]”'
  to: 'దావీదుకు ఆ సంగతి తెలియజేసిన యువకుడు ఇలా అన్నాడు: “నేను యాదృచ్ఛికంగా గిల్బోవ పర్వతంపై ఉన్నాను.[a] ఇదిగో, సౌలు తన ఈటెపై ఆనుకొని ఉన్నాడు; ఇదిగో, రథాలూ గుర్రపు రౌతులూ అతన్ని తరుముతూ దగ్గరపడ్డాయి.[b]”'
  rationale: The revision removes the added idea of coming onto the mountain, restores the two vivid attention markers, and renders the final verb as close pursuit. It preserves the source’s narrative ambiguity concerning whether the force had fully overtaken Saul or was pressing close behind him.
