translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి వాడబడింది. הִנֵּהను పదేపదే ‘ఇదిగో’ అని అనువదించడం వల్ల కలిగే కృత్రిమతను నివారిస్తూ, దాని దృశ్యాత్మక ప్రభావాన్ని ‘అక్కడ’ మరియు వాక్య నిర్మాణం ద్వారా నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
