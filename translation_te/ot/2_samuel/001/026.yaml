  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: te
  text: నా సోదరుడా యోనాతానా, నీ విషయమై నేను దుఃఖిస్తున్నాను! నీవు నాకు ఎంతో ప్రియమైనవాడివి. నాపట్ల నీ ప్రేమ అద్భుతమైనది—స్త్రీల ప్రేమను మించినది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్త్రీలపట్ల ప్రేమను మించినది,’ లేదా ‘స్త్రీలు చూపే ప్రేమను మించినది.’ హీబ్రూలోని కవితాత్మకమైన ‘స్త్రీల ప్రేమ’ అనే పదబంధం ఈ సంబంధాన్ని ఖచ్చితంగా నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: నీ విషయమై నేను ఎంతో దుఃఖిస్తున్నాను
  rationale: צַר לִי వ్యక్తిగత వేదనను, עָלֶיךָ ఆ వేదన యోనాతాను విషయమై కలిగిందని తెలియజేస్తాయి. ఆధునిక తెలుగులో సహజమైన విలాప స్వరాన్ని నిలుపుతుంది.
- source_word: אָחִי
  choice: నా సోదరుడా
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను, సోదరసమానమైన సాన్నిహిత్యాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతానూ
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన నామరూపాన్ని సంబోధనలో సహజంగా ఇచ్చింది.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: నీవు నాకు ఎంతో ప్రియంగా ఉండేవాడివి
  rationale: נעם సూచించే హృద్యమైన, ఆనందకరమైన సాన్నిహిత్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది; కేవలం ‘ఆహ్లాదకరంగా’ అనడం వ్యక్తిగత విలాప సందర్భంలో కృత్రిమంగా ఉంటుంది.
- source_word: נִפְלְאַתָה
  choice: అద్భుతమైనది
  rationale: ఈ రూపం అసాధారణమైనదిగా, ఆశ్చర్యకరమైనదిగా ఉండటాన్ని సూచిస్తుంది; ప్రేమకు విశేషణంగా తెలుగు వాక్యంలో సహజంగా సరిపోతుంది.
- source_word: אַהֲבָתְךָ לִי
  choice: నాపట్ల నీ ప్రేమ
  rationale: మూలంలోని ప్రేమ దిశను స్పష్టంగా, సహజ తెలుగులో వ్యక్తపరుస్తూ ‘నీ ప్రేమ’నే వాక్యకర్తగా నిలుపుతుంది.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: స్త్రీల ప్రేమను మించినది
  rationale: మִן యొక్క తులనాత్మక భావాన్ని ‘మించినది’గా అందిస్తుంది. ‘స్త్రీల ప్రేమ’ అనే మూలంలోని సంక్షిప్త, ద్వ్యర్థక సంబంధాన్ని నిర్దిష్టంగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: ‘స్త్రీల ప్రేమ’తో దావీదు చేసిన పోలిక యొక్క స్వభావం
  choice: స్త్రీల ప్రేమను మించినది
  alternative: స్త్రీలపట్ల ప్రేమను మించినది / స్త్రీలు చూపే ప్రేమను మించినది
  rationale: హీబ్రూ סמיכות నిర్మాణం పోలికను తెలియజేసినా, అది స్త్రీలపట్ల కలిగే ప్రేమనా లేక స్త్రీలు చూపే ప్రేమనా అనేది స్వయంగా నిర్దేశించదు. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది; లైంగిక, శృంగార లేదా కేవలం స్నేహపూర్వక వర్గీకరణను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విలాప స్వరం. ప్రత్యక్ష సంబోధనకు ‘యోనాతానూ’ వాడబడింది. ప్రధాన పాఠం సరళంగా ఉన్నప్పటికీ, చివరి పోలికలోని నిజమైన హీబ్రూ సందిగ్ధతను పాదటీకలో సంరక్షించింది.
