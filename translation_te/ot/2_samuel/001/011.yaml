  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: te
  text: అప్పుడు దావీదు తన వస్త్రాలను పట్టుకొని వాటిని చించుకున్నాడు[a]; అతనితో ఉన్న పురుషులందరూ కూడా అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో నామవాచకం అక్షరార్థంగా ‘తన వస్త్రం’ అనే ఏకవచనంలో ఉంది; అయితే తరువాతి క్రియకు ‘వాటిని’ అనే బహువచన కర్మప్రత్యయం ఉంది. తెలుగులో సహజ ప్రయోగం కోసం ‘వస్త్రాలను’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: పట్టుకొని
  rationale: חזק అనే క్రియ ఇక్కడ వస్త్రాన్ని చింపే ముందు దానిని పట్టుకోవడాన్ని సూచిస్తుంది. ‘పట్టుకొని’ భౌతిక చర్యను సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: בבגדו
  choice: తన వస్త్రాన్ని
  rationale: బహువచన ప్రత్యయానికి భిన్నంగా నామవాచకం ఏకవచనంలో ఉంది. తెలుగు భాషలో ‘తన వస్త్రాన్ని చింపుకున్నాడు’ అనేది సహజంగానూ మూలరూపానికి సన్నిహితంగానూ ఉంటుంది.
- source_word: וַיִּקְרָעֵם
  choice: దాన్ని చింపుకున్నాడు
  rationale: మసొరేటిక్ పాఠంలో క్రియకు బహువచన కర్మప్రత్యయం ఉన్నా, ముందున్న ‘వస్త్రం’ ఏకవచనం. తెలుగులో ముందున్న స్పష్టమైన నామవాచకానికి అనుగుణంగా ఏకవచన సర్వనామం వాడి, ఈ పాఠ్య అసమ్మతిని పాదటీక లేకుండా మృదువుగా వ్యక్తం చేశాం.
- source_word: וְגַם
  choice: కూడా అలాగే చేశారు
  rationale: సంయోజక పదం మరియు ‘కూడా’ అనే భావం, దావీదు చేసిన చర్యనే అతనితో ఉన్నవారు చేశారనే లుప్తక్రియను సూచిస్తాయి. ఈ భావాన్ని తెలుగులో సహజంగా తెలిపే రూపం ఇది.
- source_word: כָּל הָאֲנָשִׁים
  choice: మనుషులందరూ
  rationale: אֲנָשִׁים ఇక్కడ దావీదుతో ఉన్న పురుషులను సూచిస్తుంది. ‘మనుషులందరూ’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి సమూహాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: సంబంధ వాక్యాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అనువదించింది.
