base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: te
  text: సౌలు, యోనాతాను తమ జీవితకాలంలో ప్రేమించబడినవారు, మనోహరమైనవారు; మరణంలోనూ వారు విడిపోలేదు. వారు గద్దలకంటే వేగవంతులు,[a] సింహాలకంటే బలవంతులు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గద్దలు’ అనే చోట ‘పెద్ద వేటపక్షులు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గద్ద లేదా రాబందు వంటి పెద్ద వేటపక్షిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘బలవంతులు’ అనే చోట ‘పరాక్రమవంతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: సౌలు, యోనాతాను
  rationale: వ్యక్తుల పేర్లను తెలుగులో ప్రామాణికంగా వాడుకలో ఉన్న రూపాల్లో ఇచ్చాం.
- source_word: הַנֶּאֱהָבִים
  choice: ప్రేమించబడినవారు
  rationale: אהב మూలం నుంచి వచ్చిన కర్మణి/విశేషణ భావాన్ని నిలుపుతూ, వారు ప్రేమకు పాత్రులని కాక నిజంగా ప్రేమించబడినవారని స్పష్టపరుస్తుంది.
- source_word: וְהַנְּעִימִם
  choice: మనోహరమైనవారు
  rationale: נעים లోని ఆహ్లాదకరత, ఇంపు, అభిమానాన్ని రేకెత్తించే స్వభావాన్ని గంభీరమైన ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; నైతిక సుగుణం లేదా శారీరక సౌందర్యం మాత్రమే అని పరిమితం చేయదు.
- source_word: בְּחַיֵּיהֶם
  choice: తమ జీవితకాలంలో
  rationale: వారు జీవించిన కాలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: మరణంలోనూ వారు విడిపోలేదు
  rationale: జీవితం–మరణం మధ్యనున్న కవితాత్మక సమాంతరతను కాపాడుతూ, נפְרָדוּ లోని విడిపోవడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: వారు గద్దలకంటే వేగవంతులు
  rationale: קלל ఇక్కడ వేగాన్ని సూచిస్తుంది. נשר పెద్ద వేటపక్షిని సూచించగల విస్తృత పదమైనప్పటికీ, ఈ కవితాత్మక పోలికలో ‘గద్దలు’ సహజమైన సంప్రదాయ తెలుగు సమానం.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: సింహాలకంటే బలవంతులు
  rationale: גבר తెలిపే బలం లేదా ఆధిక్యాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, పోలిక రూపంలో అందిస్తుంది.
theological_decisions:
- issue: సౌలు, యోనాతానుల గురించి దావీదు విలాపంలోని ప్రశంసాత్మక స్వరం
  choice: సౌలు గత వైఫల్యాల కారణంగా ప్రశంసను తగ్గించకుండా, వారిని సద్గుణసంపన్నులుగా అతిశయీకరించకుండా, అంత్యక్రియల విలాపానికి తగిన గౌరవపూర్వక కవితాత్మక ప్రశంసగా అనువదించాం.
  alternative: సౌలు గత కథనాన్ని బట్టి ప్రశంసను మృదువుచేయడం, లేదా ఈ మాటలను సంపూర్ణ నైతిక ఆమోదంగా విస్తరించడం.
  rationale: మూలవచనం సౌలు, యోనాతానులను కలిపి స్మరించే విలాపం. విస్తృత కథనంలో ఉన్న ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపగీతానికి తగిన గంభీరమైన కవితాత్మక శైలిని వాడాం. హీబ్రూ సమాంతర నిర్మాణాన్ని తెలుగులో సహజంగా నిలిపాం; పాఠ్యంలో ఉన్న సౌలుపై సానుకూల స్మరణను తగ్గించలేదు.
