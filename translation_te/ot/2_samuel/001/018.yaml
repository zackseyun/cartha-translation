source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: te
  text: 'యూదా ప్రజలకు “విల్లు” నేర్పించాలని అతడు చెప్పాడు. ఇదిగో, అది యాషారు గ్రంథంలో వ్రాయబడి ఉంది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשֶׁת
  choice: “విల్లు”
  rationale: ఈ పదానికి సాధారణ అర్థం ‘విల్లు’; ఇక్కడ తరువాత వచ్చే విలాపగీతానికి శీర్షిక కావచ్చనే భావాన్ని ఉద్ధరణ చిహ్నాలతో సూచించాం, అయితే మూలంలోని సంక్షిప్తతను అలాగే ఉంచాం.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా కుమారులకు
  rationale: హీబ్రూ జాతీయ సమూహ సూచనను సహజమైన తెలుగు రూపంలో, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: סֵפֶר הַיָּשָׁר
  choice: యాషారు గ్రంథం
  rationale: తెలియని ప్రాచీన గ్రంథనామాన్ని భావానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: మూలంలోని దృష్టి ఆకర్షించే సూచనను నిలుపుతుంది.
theological_decisions:
- issue: קָשֶׁת అనేది ఆయుధమా లేక గీత శీర్షికా?
  choice: “విల్లు” అని శీర్షికలా ఉద్ధరణ చిహ్నాల్లో ఉంచడం
  alternative: విలువిద్య నేర్పించడం
  rationale: వాక్య నిర్మాణం రెండు విధాలుగా అర్థమయ్యే అవకాశమున్నా, తరువాతి విలాపానికి పరిచయంగా ఉండటం మరియు ఆంగ్ల సంప్రదింపు పాఠం దీన్ని గీత శీర్షికగా గ్రహించేందుకు బలం ఇస్తాయి; ‘విల్లు’ అనే మూల పదార్థాన్ని మాత్రం మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. వాక్యాంతంలోని ద్విబిందువు తరువాత వచ్చే విలాపాన్ని సూచిస్తుంది.
