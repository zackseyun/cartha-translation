    issue: ‘భయపడకుండా ఉన్నావు’ is awkward in this rhetorical rebuke.
    rationale: Although understandable, it reads as a continuous-state expression. ‘ఎలా భయపడలేదు?’ is more natural modern Telugu and better carries the Hebrew shocked challenge.
  - severity: low
    issue: ‘నాశనం చేయడానికి’ is unnatural with a personal direct object in this context.
    rationale: The Hebrew verb has a broad destructive sense, but David’s accusation concerns killing Saul. ‘హతం చేయడానికి’ is idiomatic Telugu and retains a formal register without over-interpreting the passage.
  - severity: low
