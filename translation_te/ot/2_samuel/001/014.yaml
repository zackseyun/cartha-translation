  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: te
  text: 'అప్పుడు దావీదు అతనితో ఇలా అన్నాడు: “యెహోవా అభిషిక్తుణ్ణి[a] హతం చేయడానికి నీ చెయ్యి చాపి, నీవు ఎలా భయపడలేదు?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెహోవా అభిషిక్తుడు.” అంటే, యెహోవా రాజుగా అభిషేకించి నియమించినవాడు.
    reason: cultural_note
  - marker: b
    text: “నీవు ఎందుకు భయపడలేదు?” అని కూడా అనువదించవచ్చు. హీబ్రూలోని אֵיךְ అక్షరార్థంగా “ఎలా?” అని అర్థం; ఇక్కడ అది ఆశ్చర్యంతో కూడిన మందలింపును వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו דָּוִד
  choice: అప్పుడు దావీదు అతనితో ... అని అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. אֵלָיו ను ‘అతనితో’గా అనువదించడం తెలుగు సంభాషణా నిర్మాణానికి సహజం.
- source_word: אֵיךְ לֹא יָרֵאתָ
  choice: నీవు ఎలా భయపడకుండా ఉన్నావు?
  rationale: אֵיךְ యొక్క ప్రాథమిక అర్థమైన ‘ఎలా?’ను నిలుపుతూ, ఆశ్చర్యంతో కూడిన తీవ్ర మందలింపును వ్యక్తం చేస్తుంది. ‘ఎందుకు భయపడలేదు?’ అనేది సహజమైన ప్రత్యామ్నాయమైనా, మూలంలోని ప్రశ్నారూపాన్ని కొంత వివరిస్తుంది.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: నీ చెయ్యి చాపడానికి
  rationale: ఇది ఎవరికైనా హాని చేయడానికి పూనుకోవడాన్ని సూచించే హీబ్రూ నుడికారం. ‘చెయ్యి చాపడం’ రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంటుంది.
- source_word: לְשַׁחֵת
  choice: నాశనం చేయడానికి
  rationale: שׁחת పదంలోని విస్తృతమైన ‘నాశనం చేయు/పాడు చేయు’ భావాన్ని నిలుపుతుంది. ఈ సందర్భంలో అది చంపడాన్ని సూచించినప్పటికీ, ‘చంపడానికి’ కంటే మూలపద పరిధిని మెరుగ్గా ప్రతిబింబిస్తుంది.
- source_word: מְשִׁיחַ
  choice: అభిషిక్తుణ్ణి
  rationale: ఇక్కడ ఈ పదం యెహోవా రాజుగా ప్రతిష్ఠించిన సౌలును సూచిస్తుంది. ‘మెస్సీయను’ అని అనువదిస్తే తరువాతి కాలపు ప్రత్యేక బిరుదు భావం అనవసరంగా దిగుమతి కావచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ మరొక సముచిత లిప్యంతరీకరణ.
- issue: సౌలును సూచించే מְשִׁיחַ పదం
  choice: అభిషిక్తుడు
  alternative: మెస్సీయ; అభిషేకించబడినవాడు
  rationale: ఈ చారిత్రక సందర్భంలో పదం రాజుగా అభిషేకించబడిన సౌలును సూచిస్తుంది. ‘అభిషిక్తుడు’ మూలభావాన్ని కాపాడుతూ, తరువాతి క్రీస్తుసంబంధ ప్రత్యేక బిరుదును ఈ సందర్భంపై బలవంతంగా మోపదు.
- issue: దావీదు ప్రశ్నలోని אֵיךְ యొక్క మందలింపు స్వభావం
  choice: ఎలా భయపడకుండా ఉన్నావు?
  alternative: ఎందుకు భయపడలేదు?
  rationale: ‘ఎలా?’ మూలంలోని ఆశ్చర్యం, దిగ్భ్రాంతి, మందలింపును నిలుపుతుంది. ‘ఎందుకు?’ భావపరంగా సాధ్యమైనా కారణాన్ని అడిగినట్లు మరింత వివరణాత్మకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చెయ్యి చాపడం’ అనే మూల నుడికారాన్ని అర్థమయ్యే రీతిలో నిలిపి, ప్రశ్నలోని దిగ్భ్రాంతి మరియు నైతిక మందలింపును కాపాడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
