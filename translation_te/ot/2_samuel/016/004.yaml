  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: te
  text: అప్పుడు రాజు సీబాతో, “ఇదిగో, మెఫీబోషెతుకు చెందినదంతా నీదే” అన్నాడు. సీబా, “నేను మీకు వంగి నమస్కరిస్తున్నాను. నా ప్రభువైన రాజా, మీ దృష్టిలో నాకు అనుగ్రహం లభించుగాక” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: రాజు చేస్తున్న నిర్ణయంపై దృష్టి నిలిపే హీబ్రూ సూచనార్థక పదాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: నేను మీకు వంగి నమస్కరిస్తున్నాను
  rationale: సీబా రాజు ఎదుట తనను తాను వంచుకుని గౌరవం చూపుతున్న భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; సందర్భానికి అనుగుణంగా కర్మను తెలుగులో తెలిపింది.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో నాకు అనుగ్రహం లభించుగాక
  rationale: ‘నీ కళ్లలో కృపను కనుగొందును’ అనే హీబ్రూ మర్యాదా ప్రయోగాన్ని దాని ఆశాభావంతో సహా సహజ తెలుగులో అందిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజును నేరుగా సంబోధించే గౌరవపూర్వక హీబ్రూ బిరుదును తెలుగు సంబోధన రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: మెఫీబోషెతు ఆస్తిపై రాజు చేసిన ప్రకటనను కథకుడి నైతిక ఆమోదంగా చూపాలా
  choice: రాజు పలికిన నేర ప్రకటనగానే అనువదించడం
  alternative: ఆ నిర్ణయం న్యాయమైనదని లేదా తుది నిర్ణయమని సూచించే వివరణను చేర్చడం
  rationale: మూలవచనం రాజు నిర్ణయాన్ని మాత్రమే నమోదు చేస్తుంది; దాని నైతికతను ఇక్కడ తీర్మానించదు. కాబట్టి కథనంలోని ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సరళత, రాజసభ సంభాషణలో గౌరవభావం నిలుపబడ్డాయి. వ్యక్తిపేర్లను సాధారణ తెలుగు బైబిలు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
