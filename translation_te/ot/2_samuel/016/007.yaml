id: 2SA.16.7
reference: 2 Samuel 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹֽה אָמַ֥ר שִׁמְעִ֖י בְּ/קַֽלְל֑/וֹ צֵ֥א צֵ֛א אִ֥ישׁ הַ/דָּמִ֖ים וְ/אִ֥ישׁ הַ/בְּלִיָּֽעַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: te
  text: 'షిమీ అతన్ని శపిస్తూ ఇలా అన్నాడు: “పో, పో! రక్తపాతానికి పాల్పడినవాడా[a], నీచుడా[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘రక్తాల మనిషి’ లేదా ‘రక్తపు మనిషి.’ హీబ్రూలోని బహువచన జాతీయం రక్తాపరాధాన్ని లేదా రక్తపాతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దుష్టుడా,’ ‘పనికిమాలినవాడా.’ హీబ్రూ జాతీయం అధముడైన లేదా నైతికంగా పనికిమాలిన వ్యక్తిని సూచిస్తుంది; ఇక్కడ అది తప్పనిసరిగా ‘బెలీయాలు’ అనే వ్యక్తిపేరు కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כֹה אָמַר
  choice: ఇలా అన్నాడు
  rationale: כֹּה పరిచయం చేసే మాటల విషయాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించింది.
- source_word: בְּ/קַלְל/וֹ
  choice: అతన్ని శపిస్తూ
  rationale: బెత్ ఉపసర్గతో కూడిన క్రియానామ రూపం సమకాలిక చర్యను సూచిస్తుంది; పురుష ఏకవచన ప్రత్యయం సందర్భంలో దావీదును సూచిస్తుంది.
- source_word: צֵא צֵא
  choice: పో, పో!
  rationale: ఆజ్ఞారూప పునరుక్తి తీవ్ర నిరాకరణను, వెళ్లగొట్టే భావాన్ని తెలియజేస్తుంది; తెలుగు ప్రత్యక్ష సంబోధనలో ‘పో, పో’ సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ הַ/דָּמִים
  choice: రక్తపాతానికి పాల్పడినవాడా
  rationale: ‘రక్తాలు’ అనే హీబ్రూ బహువచన జాతీయం రక్తపాతం లేదా రక్తాపరాధాన్ని సూచిస్తుంది. ఈ అనువాదం రక్తపాతానికి బాధ్యుడనే ఆరోపణను తెలియజేస్తుంది; రక్తదాహం అనే ఉద్దేశాన్ని అదనంగా చేర్చదు.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: నీచుడా
  rationale: ఇక్కడ בְּלִיַּעַל ఒక వ్యక్తిపేరు కాక, నైతికంగా పనికిమాలిన లేదా అధమ వ్యక్తిని దూషించే జాతీయం. ప్రత్యక్ష సంబోధనలో ‘నీచుడా’ సహజంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: בְּלִיַּעַל పదాన్ని వ్యక్తిపేరుగా లేదా సాధారణ దూషణగా అనువదించడం
  choice: సాధారణ దూషణగా ‘నీచుడా’
  alternative: ‘బెలీయాలు మనిషీ’ లేదా ‘దుష్టుడా’
  rationale: ఈ పాత నిబంధన సందర్భంలో ఈ పదం నైతిక అధమత్వాన్ని సూచించే సాధారణ జాతీయంగా ఉంది. ‘బెలీయాలు’ అనే వ్యక్తిపేరు వాడితే ఈ వచనం తప్పనిసరిగా సూచించని తరువాతి కాలపు దుష్టాత్మ సంబంధ భావనలు దిగుమతి అవుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష సంబోధనను వాడింది. హీబ్రూ ఆజ్ఞారూప పునరుక్తిని నిలిపింది; రెండు దూషణలను తెలుగు విభక్తి సంబోధనలుగా మార్చి భావబలాన్ని కాపాడింది.
