  text: וַ/יְסַקֵּ֤ל בָּֽ/אֲבָנִים֙ אֶת דָּוִ֔ד וְ/אֶת כָּל עַבְדֵ֖י הַ/מֶּ֣לֶךְ דָּוִ֑ד וְ/כָל הָ/עָם֙ וְ/כָל הַ/גִּבֹּרִ֔ים מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: te
  text: అతడు దావీదుపై, రాజైన దావీదు సేవకులందరిపై రాళ్లు విసిరాడు.[a] ప్రజలందరూ, పరాక్రమశాలులందరూ దావీదుకు కుడివైపునా ఎడమవైపునా ఉండగా ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదును, రాజైన దావీదు సేవకులందరినీ రాళ్లతో రువ్వాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: రాళ్లు విసిరాడు
  rationale: పీయేల్ క్రియ ఇక్కడ రాళ్లతో కొట్టడం లేదా రాళ్లు విసరడం అనే భావాన్ని ఇస్తుంది. సందర్భం విధిపూర్వక రాళ్లతో చంపడం గురించి కాక, షిమీ దావీదును శపిస్తూ అతని మీద రాళ్లు విసరడం గురించి కాబట్టి ఈ సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: రాజు సేవలో ఉన్నవారిని విస్తృతంగా సూచిస్తుంది. ‘బానిసలు’ అని అనడం ఇక్కడ అవసరానికి మించిన నిర్దిష్టతను కలిగిస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: మూలంలోని రాజబిరుదును, వ్యక్తి పేరును రెండింటినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: దావీదుతో వెళ్తున్న సమూహాన్ని విస్తృతంగా సూచిస్తుంది; వారిని కేవలం సైనికులుగా పరిమితం చేయదు.
- source_word: הַגִּבֹּרִים
  choice: పరాక్రమశాలులు
  rationale: వీరత్వం, యుద్ధనైపుణ్యం గల మనుషుల భావాన్ని తెలియజేస్తూ, దావీదు విశిష్ట యోధులను సూచించే అవకాశాన్ని నిలుపుతుంది.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: దావీదుకు కుడివైపున, ఎడమవైపున
  rationale: ప్రత్యయానికి సందర్భానుసారం దావీదే సహజ సూచితుడు. తెలుగులో అస్పష్టతను తగ్గించేందుకు పేరును స్పష్టంగా పునరుక్తి చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా అనువదించబడింది. మూలంలోని చర్య, రాజసభ సందర్భం, దావీదు చుట్టూ ఉన్న ప్రజలు మరియు పరాక్రమశాలుల స్థానం స్పష్టంగా ఉంచబడ్డాయి.
