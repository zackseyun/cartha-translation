translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని ‘నీ స్నేహితుడు’ అనే పునరుక్తిని అలాగే నిలిపాం; חֶסֶד పదంలోని భావవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
