  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל חוּשַׁ֔י זֶ֥ה חַסְדְּ/ךָ֖ אֶת רֵעֶ֑/ךָ לָ֥/מָּה לֹֽא הָלַ֖כְתָּ אֶת רֵעֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: te
  text: అబ్షాలోము హూషైతో, “నీ స్నేహితునిపట్ల నీకున్న విశ్వసనీయత[a] ఇదేనా? నీవు నీ స్నేహితునితో ఎందుకు వెళ్లలేదు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘దయ’ లేదా ‘నిబద్ధమైన ప్రేమ’ (హీబ్రూ: חֶסֶד).'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: నీకున్న విశ్వసనీయత
  rationale: חֶסֶד దయ, నిబద్ధమైన ప్రేమ, విశ్వసనీయత అనే భావాలను వ్యక్తం చేయగలదు. ఇక్కడ దావీదుపట్ల హూషై చూపవలసిన వ్యక్తిగత, రాజకీయ నిబద్ధతను అబ్షాలోము ప్రశ్నిస్తున్నందున ‘విశ్వసనీయత’ సందర్భానికి సరిపోతుంది; పదంలోని ఇతర భావసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: רֵעֶךָ
  choice: నీ స్నేహితుడు
  rationale: רֵעַ అంటే స్నేహితుడు, సహచరుడు లేదా సన్నిహితుడు. ఇక్కడ అది దావీదును సూచిస్తుంది; పునరుక్తిని నిలుపుతూ సహజమైన తెలుగులో ‘స్నేహితుడు’ అని అనువదించాం.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: నీవు నీ స్నేహితునితో ఎందుకు వెళ్లలేదు?
  rationale: הלך తో కూడిన אֶת ఇక్కడ ఒకరితో కలిసి వెళ్లడాన్ని సూచిస్తుంది. మూలంలోని సరళమైన క్రియారూపాన్ని నిలుపుతూ ‘తో వెళ్లడం’ అని సహజంగా అనువదించాం.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: నీ స్నేహితునిపట్ల నీకున్న విశ్వసనీయత ఇదేనా?
  rationale: ఇది క్రియలేని అలంకారప్రశ్న. అబ్షాలోము వ్యక్తం చేస్తున్న నిందాభావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంతో చూపించాం; సంబంధాన్ని తెలిపే אֶת భావాన్ని ‘పట్ల’తో వ్యక్తం చేశాం.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: ప్రశ్నలతో కూడిన మాట అయినప్పటికీ, וַיֹּאמֶר సాధారణ కథన క్రియ ‘అన్నాడు’; ప్రశ్నార్థకతను ఉద్ధరణలోనే నిలిపాం.
