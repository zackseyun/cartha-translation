language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: te
  text: అప్పుడు వారు అబ్షాలోము కోసం మేడపై గుడారాన్ని వేశారు. అబ్షాలోము ఇశ్రాయేలీయులందరి కళ్లముందే[a] తన తండ్రి ఉపపత్నులతో శయనించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరి సమక్షంలో,” అంటే “ఇశ్రాయేలీయులందరికీ బహిరంగంగా కనిపించేలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: వేశారు
  rationale: נטה అనే క్రియ గుడారాన్ని చాపి ఏర్పాటు చేయడాన్ని సూచిస్తుంది; తెలుగులో ‘గుడారం వేశారు’ సహజమైన, సందర్భానుకూలమైన ప్రయోగం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్నప్పటికీ తెలుగులో ఈ సందర్భంలో ‘గుడారం వేశారు’ అనే ప్రయోగమే సహజం; అబ్షాలోము కోసం ప్రత్యేకంగా సిద్ధం చేసిన గుడారమే ఉద్దేశం.
- source_word: עַל הַגָּג
  choice: మేడమీద
  rationale: గృహపు సమతల పైకప్పును సూచించే సందర్భంలో ఆధునిక ప్రామాణిక తెలుగులో ‘మేడమీద’ సహజంగా స్థలార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹא ... אֶל
  choice: దగ్గరికి వెళ్లాడు
  rationale: హెబ్రీ లైంగిక సభ్యోక్తిని తెలుగులో గౌరవప్రదంగా, అతిగా స్పష్టీకరించకుండా నిలుపుతుంది; సందర్భం లైంగిక సంబంధాన్ని తగినంతగా తెలియజేస్తుంది.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: తన తండ్రి ఉపపత్నులు
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతూ, రాజకుటుంబ సందర్భంలోని secondary wives/concubines భావానికి ‘ఉపపత్నులు’ గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి కళ్లముందే
  rationale: ‘అందరి కళ్ల ఎదుట’ అనే మూల రూపకాన్ని నిలుపుతూ, కార్యం బహిరంగంగా జరిగిందనే భావాన్ని సహజ తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజ్యాధికార అపహరణకు సంబంధించిన నైతికంగా తీవ్రమైన సందర్భంలో లైంగిక సభ్యోక్తి అనువాదం
  choice: తన తండ్రి ఉపపత్నుల దగ్గరికి వెళ్లాడు
  alternative: తన తండ్రి ఉపపత్నులతో లైంగిక సంబంధం పెట్టుకున్నాడు / వారితో పడుకున్నాడు
  rationale: మూలంలోని בוא אל అనే సభ్యోక్తిని నిలుపుతుంది. కార్యాన్ని కేవలం సాధారణంగా వెళ్లడమని అస్పష్టపరచకుండా సందర్భం అర్థాన్ని తెలియజేస్తుంది; అదే సమయంలో మూలంలో లేని ఆధునిక స్పష్టీకరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. హెబ్రీ సభ్యోక్తి, బహిరంగతను సూచించే కళ్ల రూపకం రెండూ సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
