    text: లేదా, “ఇశ్రాయేలీయులందరి సమక్షంలో,” అంటే “ఇశ్రాయేలీయులందరికీ బహిరంగంగా కనిపించేలా.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an innocuous movement expression with the formal, restrained Telugu expression “ఉపపత్నులతో శయనించాడు,” which communicates the meaning of the Hebrew sexual idiom without unnecessary explicitness. It also uses “మేడపై” to identify the roof more precisely. The public-witness wording and its alternative footnote are retained.
