source:
  edition: WLC
  text: וַ/יָּבֹ֥א הַ/מֶּ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ עֲיֵפִ֑ים וַ/יִּנָּפֵ֖שׁ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: te
  text: రాజు, అతనితో ఉన్న ప్రజలందరూ అలసిపోయి అక్కడికి చేరుకున్నారు; అక్కడ అతడు సేదతీరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ క్రియ ఏకవచనంలో ఉంది: “అతడు సేదతీరాడు.” అయితే కొందరు దీనిని సమష్టి భావంలో “వారు సేదతీరారు” అని అర్థం చేసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: చేరుకున్నారు
  rationale: בוא అనే క్రియకు ‘వచ్చారు’ అనే సాధారణ అర్థం ఉన్నా, ప్రయాణం చివర ఒక చోటికి చేరడాన్ని ఈ సందర్భం సూచిస్తున్నందున ‘చేరుకున్నారు’ సహజంగా ఉంది. రాజు మరియు ప్రజలందరూ అనే సముచ్చయ కర్తకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూ పాఠంలోని బిరుదునే నిలుపుతుంది; సందర్భంలో ఆయన దావీదు అయినప్పటికీ పేరును చేర్చలేదు.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: అతనితో ఉన్న ప్రజలందరూ
  rationale: హీబ్రూలోని సంబంధ వాక్యాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲיֵפִים
  choice: అలసిపోయి
  rationale: ఈ పదం శారీరక అలసటను సూచిస్తుంది. ‘అలసిపోయి’ సాధారణ పాఠకులకు సహజంగా ఉండి, ప్రయాణం వల్ల కలిగిన ఆయాసాన్ని తెలియజేస్తుంది.
- source_word: וַיִּנָּפֵשׁ
  choice: అతడు సేదతీరాడు
  rationale: ఈ క్రియ ఊపిరి పీల్చుకొని శక్తి పుంజుకోవడం లేదా విశ్రాంతి పొందడం అనే భావాన్ని కలిగి ఉంది. హీబ్రూ క్రియ ఏకవచనంలో ఉన్నందున ‘అతడు’ అని నిలిపి, దాని భావాన్ని సహజంగా చెప్పేందుకు ‘సేదతీరాడు’ ఎంచుకోబడింది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: చేరుకున్న ప్రదేశంలోనే సేదతీరినట్లు సూచించే సాధారణ స్థలవాచక అనువాదం.
theological_decisions:
- issue: సముచ్చయ కర్త తర్వాత וַיִּנָּפֵשׁ అనే ఏకవచన క్రియ
  choice: అక్కడ అతడు సేదతీరాడు
  alternative: అక్కడ వారు సేదతీరారు
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలో చివరి క్రియ స్పష్టంగా ఏకవచనంలో ఉంది. అది రాజును సూచించవచ్చు; అయితే ముందున్న రాజు మరియు ప్రజల సమూహాన్ని సమష్టిగా సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో వ్యాకరణ ఏకవచనాన్ని నిలిపి, ప్రత్యామ్నాయ సమష్టి అవగాహనను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సేదతీరాడు’ విశ్రాంతితో పాటు శక్తి పుంజుకున్న భావాన్నీ సహజంగా అందిస్తుంది. హీబ్రూ పాఠంలోని ఏకవచన–బహువచన ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా యథాతథంగా నిలిపాం.
