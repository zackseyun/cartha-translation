  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חוּשַׁי֮ אֶל אַבְשָׁלֹם֒ לֹ֕א כִּי֩ אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה וְ/הָ/עָ֥ם הַ/זֶּ֖ה וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֑ל לא אֶהְיֶ֖ה וְ/אִתּ֥/וֹ אֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: te
  text: 'హూషై అబ్షాలోముతో ఇలా అన్నాడు: “కాదు, ఎందుకంటే యాహ్వే, ఈ ప్రజలు, ఇశ్రాయేలులోని ప్రతి పురుషుడూ[a] ఎవరిని ఎన్నుకున్నారో, నేను అతనివాడనై ఉంటాను[b]; అతనితో ఉంటాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “ఇశ్రాయేలులోని ప్రతి పురుషుడు.”
    reason: lexical_alternative
  - marker: b
    text: మసొరేటిక్ పఠనసూచన ప్రకారం, “నేను అతనివాడనై ఉంటాను.” వ్యంజన పాఠాన్ని యథాతథంగా చదివితే, “నేను ఉండను” అని వస్తుంది.
    reason: textual_variant
  - marker: c
    text: లేదా, “అతనితోనే ఉంటాను.” హీబ్రూ క్రియకు అక్షరార్థంగా “కూర్చుంటాను” అనే భావమూ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: కాదు!
  rationale: ఈ పదబంధం ముందున్న అభిప్రాయాన్ని బలంగా తిరస్కరించి, ఆ తరువాత హూషై తన వైఖరిని వివరిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘కాదు!’ అని ఇచ్చి, తరువాతి వాక్యంతో వివరణను కొనసాగించాం.
- source_word: אֲשֶׁר בָּחַר
  choice: ఎవరిని ఎన్నుకున్నారో
  rationale: ఇప్పటికే దృష్టిలో ఉన్న ఒక వ్యక్తిని సూచించే సంబంధవాచక నిర్మాణం. בָּחַר పూర్తయిన ఎంపికను సూచిస్తున్నందున భూతకాల భావాన్ని నిలిపాం; తరువాత వచ్చే సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియ వాడాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: וְהָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: హీబ్రూలోని సూచక భావాన్ని నేరుగా నిలిపి, ఆధునిక తెలుగులో సహజమైన సమూహవాచక రూపాన్ని వాడాం.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని ప్రతి పురుషుడూ
  rationale: כָל + אִישׁ లోని పంపిణీ భావాన్నీ, మూలంలోని పురుషలింగ సూచననూ నిలిపాం.
- source_word: לוֹ אֶהְיֶה (Qere; Ketiv לֹא אֶהְיֶה)
  choice: నేను అతనివాడనై ఉంటాను
  rationale: మసొరేటిక్ పఠనసూచన לוֹ ప్రకారం విధేయత లేదా అనుబంధ భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం; వ్యంజన పాఠంలోని భేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: అతనితోనే నివసిస్తాను
  rationale: יָשַׁב యొక్క మూలార్థం ‘కూర్చోవడం’ అయినప్పటికీ, ఇక్కడ ఒకరి వద్ద కొనసాగి ఉండడం లేదా నివసించడం అనే సందర్భోచిత భావం ఉంది. ‘తోనే’ అనుబంధంపై ఉన్న ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా నామరూపంలో నిలిపాం.
- issue: అబ్షాలోమును దేవుడు మరియు ఇశ్రాయేలు ఎన్నుకున్నారని హూషై చెప్పడంలోని ద్వంద్వార్థం
  choice: వాక్యంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపివేయడం
  alternative: ఇది అబ్షాలోమునే సూచిస్తుందని స్పష్టీకరించడం
  rationale: సందర్భంలో హూషై మాటలను అబ్షాలోము తనకు అనుకూలంగా అర్థం చేసుకోగలడు; అయితే హూషై దావీదును మనసులో ఉంచుకొని ఉండవచ్చు. అనువాదం ఈ కథనాత్మక ఉద్రిక్తతను పరిష్కరించకుండా ‘ఎవరిని’ అనే రూపాన్ని నిలిపింది.
- issue: אִישׁ יִשְׂרָאֵל లోని లింగ సూచన
  choice: ఇశ్రాయేలులోని ప్రతి పురుషుడూ
  alternative: ఇశ్రాయేలీయులందరూ
  rationale: మూలంలోని אִישׁ అనే పురుషలింగ పదాన్నీ, ‘ప్రతి’ అనే పంపిణీ భావాన్నీ నిలిపాం; దానిని లింగనిరపేక్ష సమూహపదంగా సాధారణీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే రాజసభ సందర్భానికి తగిన గంభీరతను నిలిపాం. ‘అతనివాడనై ఉంటాను’ విధేయతను సూచిస్తుంది; ‘ఎవరిని’ అనే రూపం హూషై మాటల్లోని కథనాత్మక ద్వంద్వార్థాన్ని కాపాడుతుంది.
