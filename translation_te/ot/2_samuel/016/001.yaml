translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. וְהִנֵּה యొక్క కథన బలాన్ని ‘ఇదిగో’తో నిలిపాం. కొలతలు, ఆహార పదార్థాలు సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా చెప్పి, నిజమైన నిఘంటు అనిశ్చితులను పాదసూచికల్లో భద్రపరిచాం.
