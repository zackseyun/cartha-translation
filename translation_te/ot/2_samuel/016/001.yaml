id: 2SA.16.1
reference: 2 Samuel 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דָוִ֗ד עָבַ֤ר מְעַט֙ מֵֽ/הָ/רֹ֔אשׁ וְ/הִנֵּ֥ה צִיבָ֛א נַ֥עַר מְפִי בֹ֖שֶׁת לִ/קְרָאת֑/וֹ וְ/צֶ֨מֶד חֲמֹרִ֜ים חֲבֻשִׁ֗ים וַ/עֲלֵי/הֶם֩ מָאתַ֨יִם לֶ֜חֶם וּ/מֵאָ֧ה צִמּוּקִ֛ים וּ/מֵ֥אָה קַ֖יִץ וְ/נֵ֥בֶל יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: te
  text: దావీదు కొండ శిఖరాన్ని దాటి కొంత దూరం వెళ్లినప్పుడు[a], ఇదిగో, మెఫీబోషెతు సేవకుడైన[b] సీబా అతనిని కలుసుకోవడానికి వచ్చాడు. జీను కట్టిన రెండు గాడిదలతో అతడు వచ్చాడు. వాటి మీద రెండువందల రొట్టెలు, వంద ఎండుద్రాక్ష గుత్తులు, వంద వేసవికాలపు పండ్లు[c], ఒక ద్రాక్షారసపు తోలుతిత్తి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిఖరం నుండి కొంత దూరం వెళ్లినప్పుడు.” హీబ్రూ వాక్యం అక్షరార్థంగా “తల నుండి కొంత” అని ఉంది; ఇక్కడ “తల” కొండ శిఖరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సేవకుడు” అనే పదాన్ని “యువకుడు” లేదా “పరిచారకుడు” అని కూడా అనువదించవచ్చు; ఇక్కడ సీబాకు మెఫీబోషెతుతో ఉన్న సంబంధాన్ని బట్టి “సేవకుడు” అని అనువదించాం.
    reason: lexical_alternative
  - marker: c
    text: “వేసవికాలపు పండ్లు” అనేది ప్రత్యేకంగా అంజూరపు పండ్లను సూచిస్తుండవచ్చు; అయితే హీబ్రూ పదానికి విస్తృతమైన అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: కొండ శిఖరాన్ని దాటి కొంత దూరం
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’; ఈ భౌగోళిక సందర్భంలో కొండ శిఖరాన్ని సూచిస్తుంది. מֵ־ను ప్రయాణ సందర్భంలో ‘దాటి/నుండి ముందుకు’ అనే భావంతో సహజంగా వ్యక్తం చేశాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించడాన్ని, కథనంలోని సజీవతను సూచించే మూలపాఠపు సంభాషణ సూచికను నిలిపింది.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: మెఫీబోషెతు సేవకుడు
  rationale: נַעַר అంటే యువకుడు, పరిచారకుడు లేదా సేవకుడు కావచ్చు; సీబా పాత్రను బట్టి ‘సేవకుడు’ సందర్భోచితం, అయితే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: צֶמֶד חֲמֹרִים
  choice: రెండు గాడిదలు
  rationale: צֶמֶד జతను సూచిస్తుంది. తెలుగులో సంఖ్యను నేరుగా చెప్పడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חֲבֻשִׁים
  choice: కళ్లాలు కట్టిన
  rationale: ప్రయాణం లేదా బరువు మోయడానికి సిద్ధం చేసిన గాడిదలను సూచించే సందర్భానుకూల తెలుగు ప్రయోగం; కేవలం ‘కట్టబడిన’ అనే అస్పష్టతను నివారిస్తుంది.
- source_word: מָאתַיִם לֶחֶם
  choice: రెండువందల రొట్టెలు
  rationale: లెక్కించదగిన ఆహార రొట్టెలనే సందర్భం సూచిస్తున్నందున తెలుగులో సహజమైన బహువచనం వాడాం.
- source_word: צִמּוּקִים
  choice: ఎండుద్రాక్ష గుత్తులు
  rationale: ఎండబెట్టిన ద్రాక్ష లేదా వాటి నొక్కిన గుత్తులను సూచించే పదం; ‘అప్పాలు’ అని మరీ నిర్దిష్టం చేయకుండా మూలార్థాన్ని నిలిపింది.
- source_word: קַיִץ
  choice: వేసవికాలపు పండ్లు
  rationale: ఈ పదం అంజూరపు పండ్లను ప్రత్యేకంగా సూచించగలిగినా, దాని విస్తృత అర్థాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: נֵבֶל יָיִן
  choice: ఒక ద్రాక్షారసపు తోలుతిత్తి
  rationale: נֵבֶל ఇక్కడ ద్రవాన్ని ఉంచే తోలు సంచిని సూచిస్తుంది; ప్రాచీన పాత్ర స్వరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
