id: 2SA.16.10
reference: 2 Samuel 16:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַה לִּ֥/י וְ/לָ/כֶ֖ם בְּנֵ֣י צְרֻיָ֑ה כי יְקַלֵּ֗ל ו/כי יְהוָה֙ אָ֤מַר ל/וֹ֙ קַלֵּ֣ל אֶת דָּוִ֔ד וּ/מִ֣י יֹאמַ֔ר מַדּ֖וּעַ עָשִׂ֥יתָה כֵּֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: te
  text: అయితే రాజు, “సెరూయా కుమారులారా, మీతో నాకు ఏమి పని? యెహోవా అతనితో, ‘దావీదును శపించు’ అని చెప్పాడు కాబట్టి అతడు శపిస్తున్నట్లయితే[a], ‘నీవు ఇలా ఎందుకు చేశావు?’ అని ఎవరు చెప్పగలరు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు శపిస్తున్నాడు, ఎందుకంటే యెహోవా అతనితో, ‘దావీదును శపించు’ అని చెప్పాడు.” హీబ్రూ కణాలను షరతుగా కాక వివరణాత్మకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: మీతో నాకు ఏమి పని?
  rationale: ఇది అక్షరార్థ ప్రశ్న కాక, అసమ్మతిని మరియు దూరం పెట్టడాన్ని తెలిపే హీబ్రూ నుడికారం; ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי צְרֻיָה
  choice: సెరూయా కుమారులారా
  rationale: యోవాబు, అబీషైలను వారి తల్లి పేరుతో సంబోధించే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: יְקַלֵּל / קַלֵּל
  choice: శపిస్తున్నాడు / శపించు
  rationale: ఒకే హీబ్రూ మూలపదానికి ఉన్న పదబంధ అనుసంధానాన్ని తెలుగులోనూ నిలిపి, దావీదుపై పలికిన దూషణాత్మక శాపాన్ని సూచిస్తుంది.
- source_word: כִּי ... וְכִי
  choice: '... కాబట్టి ... అనుకుందాం'
  rationale: పాఠంలోని కణాల క్లిష్టతను షరతుతో కూడిన కారణార్థంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది; వివరణాత్మక పఠనాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: וּמִי יֹאמַר
  choice: ఎవరు అడగగలరు?
  rationale: ఇది కేవలం భవిష్యత్తు మాటను కాక, ప్రశ్నించే అధికారం లేదా సమర్థత ఎవరికీ లేదనే అలంకారిక ప్రశ్న భావాన్ని అందిస్తుంది.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: నీవు ఇలా ఎందుకు చేశావు?
  rationale: మూలంలోని ప్రత్యక్ష ప్రశ్నను స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: షిమీ శపించడంలో యెహోవా ప్రమేయం
  choice: యెహోవా షిమీతో ‘దావీదును శపించు’ అని చెప్పి ఉండవచ్చనే దావీదు వాదనను యథాతథంగా ఉంచడం
  alternative: దీనిని కేవలం యెహోవా అనుమతిగా మృదువుగా చేయడం, లేదా ఎలాంటి షరతూ లేకుండా నిస్సందేహమైన ప్రత్యక్ష ఆజ్ఞగా బలపరచడం
  rationale: హీబ్రూ పాఠం దైవ ఆజ్ఞను స్పష్టంగా ప్రస్తావించినప్పటికీ, వాక్యంలోని కణాల వల్ల షరతు/వివరణ అనే సందిగ్ధత ఉంది. అనువాదం దైవ కారణత్వం లేదా నైతిక ఆమోదంపై అదనపు సిద్ధాంత నిర్ణయం చేయకుండా ఆ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని ఉపయోగించాం. ‘మీతో నాకు ఏమి పని?’ అనే నుడికారం రాజు వ్యక్తం చేసిన మందలింపును నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
