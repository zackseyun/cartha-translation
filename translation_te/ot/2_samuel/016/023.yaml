  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: te
  text: ఆ రోజుల్లో అహీతోఫెలు ఇచ్చిన సలహా దేవుని దగ్గర విచారణ చేసినట్లుగా ఉండేది[a]; దావీదుకైనా అబ్షాలోముకైనా అహీతోఫెలు సలహా అంతా అలాగే ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని మాటను/విషయాన్ని అడిగినట్లుగా.” హీబ్రూలోని ఈ ప్రయోగం దేవుని నుండి మార్గదర్శకత్వం కోరడాన్ని సూచిస్తుంది; అహీతోఫెలు సలహా ఎంత ఉన్నతంగా విలువ చేయబడిందో ఈ పోలిక తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: సలహా
  rationale: ఆలోచనకర్త ఇచ్చే సూచన లేదా మంత్రాంగం అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది; పద్యంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יָעַץ
  choice: ఇచ్చిన
  rationale: ‘సలహా ఇచ్చిన’ అనేది తెలుగులో సహజమైన పదబంధం; మూలంలోని క్రియాభావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: మూలంలోని కాలసూచనకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: దేవుని దగ్గర విచారణ చేసినప్పుడు లభించే జవాబులా
  rationale: దైవిక మార్గదర్శకత్వం కోసం విచారించడమనే హీబ్రూ ప్రయోగార్థాన్ని సహజ తెలుగులో అందిస్తుంది. ‘దేవుని వాక్యాన్ని విచారించడం’ అని పరిమితం చేయకుండా, דְבַר లోని మాట/విషయం/జవాబు సంబంధిత అస్పష్టతను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: כֵּן
  choice: అంతటి గౌరవమే ఉండేది
  rationale: ముందున్న పోలికను రెండో వాక్యంలో సహజంగా తిరిగి అనుసంధానిస్తూ, సలహా ఎలా పరిగణించబడిందో తెలుపుతుంది.
- source_word: כָּל עֲצַת אֲחִיתֹפֶל
  choice: అహీతోఫెలు ఇచ్చిన సలహాలన్నిటికీ
  rationale: כָּל యొక్క సమగ్ర భావాన్ని, עֲצַת యొక్క పునరుక్తిని స్పష్టంగా నిలుపుతుంది.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: దావీదుకు, అబ్షాలోముకు—ఇద్దరికీ
  rationale: గַּם...גַּם అనే ‘ఇద్దరికీ’ నిర్మాణాన్ని తెలుగులో ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని దగ్గర విచారణతో చేసిన పోలిక యొక్క బలం
  choice: అహీతోఫెలు సలహా దేవుని దగ్గర విచారణ చేసి పొందిన జవాబులా పరిగణించబడిందని అనువదించడం
  alternative: అతని సలహా స్వయంగా దేవుని ప్రత్యక్ష ప్రకటన లేదా దైవవాక్యమని చెప్పడం
  rationale: హీబ్రూ వాక్యం గుర్తింపును కాక పోలికను చేస్తుంది. అందువల్ల అతని సలహాకు లభించిన అసాధారణ అధికారాన్ని నిలుపుతూ, అది ప్రేరేపిత దైవప్రకటన అని మించి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలో లేని ప్రారంభ అనుసంధాన పదాన్ని చేర్చలేదు. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
