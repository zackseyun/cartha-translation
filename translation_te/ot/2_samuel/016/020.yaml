- source_word: הָבוּ לָכֶם עֵצָה
  choice: మీ సలహా ఇవ్వండి
  rationale: హీబ్రూ బహువచన ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగు గౌరవ/సమూహ సంబోధనతో వ్యక్తం చేస్తూ, עֵצָהకు ‘సలహా’ అని స్పష్టంగా అనువదించాం.
- source_word: מַה נַּעֲשֶׂה
  choice: మనం ఏమి చేయాలి?
  rationale: మొదటి పురుష బహువచన భావాన్ని ‘మనం’తో నిలిపి, deliberative ప్రశ్నను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
