  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ పదక్రమాన్ని పూర్తిగా అనుకరించకుండా, సమానార్థక వివరణను డాష్‌ల మధ్య ఉంచి మూలంలోని అనుబంధ నిర్మాణాన్ని నిలిపాం.
