  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: te
  text: అబ్షాలోము, ప్రజలందరూ—ఇశ్రాయేలు పురుషులు[a]—యెరూషలేముకు వచ్చారు. అహీతోఫెలు అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ప్రజలందరూ, ఇశ్రాయేలుకు చెందిన ప్రతి పురుషుడు” లేదా “ప్రజలందరూ, ఇశ్రాయేలు పురుషులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: కథనంలోని సంధానక వావ్‌ను తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు; పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చాం.
- source_word: וְ/כָל הָ/עָם
  choice: ప్రజలందరూ
  rationale: עָם ఇక్కడ అబ్షాలోముతో వచ్చిన సమూహాన్ని సూచిస్తుంది. ‘సైన్యమంతా’ అనడం భావాన్ని అనవసరంగా కుదిస్తుంది.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు
  rationale: ఏకవచన రూపమైన אִישׁ ఇక్కడ సమష్టి లేదా విభాజక భావంలో ఉంది. ప్రధాన పాఠంలో సహజమైన బహువచనాన్ని వాడి, అక్షరార్థ నిర్మాణంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: בָּאוּ יְרוּשָׁלִָם
  choice: యెరూషలేముకు వచ్చారు
  rationale: בוא యొక్క సాధారణ గమనార్థాన్ని, గమ్యస్థానాన్ని సూచించే సహజ తెలుగు విభక్తితో అనువదించాం.
- source_word: וַ/אֲחִיתֹפֶל אִתּוֹ
  choice: అహీతోఫెలు అతనితో ఉన్నాడు
  rationale: హెబ్రీలో ఇక్కడ స్పష్టమైన క్రియ లేకపోయినా తెలుగులో వాక్యం పూర్తిగా ఉండేందుకు ‘ఉన్నాడు’ చేర్చాం. సందర్భానుసారం ‘అతనితో’ అన్నది అబ్షాలోమును సూచిస్తుంది.
