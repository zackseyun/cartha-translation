source:
  edition: WLC
  text: וּ/בָ֛א הַ/מֶּ֥לֶךְ דָּוִ֖ד עַד בַּֽחוּרִ֑ים וְ/הִנֵּ֣ה מִ/שָּׁם֩ אִ֨ישׁ יוֹצֵ֜א מִ/מִּשְׁפַּ֣חַת בֵּית שָׁא֗וּל וּ/שְׁמ/וֹ֙ שִׁמְעִ֣י בֶן גֵּרָ֔א יֹצֵ֥א יָצ֖וֹא וּ/מְקַלֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: te
  text: రాజు దావీదు బహూరీముకు వచ్చినప్పుడు, ఇదిగో, సౌలు ఇంటివారి వంశానికి చెందిన ఒక మనిషి అక్కడి నుండి బయటికి వచ్చాడు. అతని పేరు గెరా కుమారుడు షిమీ. అతడు బయటికి వస్తూనే, శపిస్తూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు బయటికి వస్తూ శపిస్తూనే ఉన్నాడు.” హీబ్రూలో ‘బయటికి రావడం’ అనే క్రియను బలపరిచే నిర్మాణం ఉంది; అది నిరంతరమైన లేదా పునరావృతమైన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד עַד בַּחוּרִים
  choice: దావీదు రాజు బహూరీముకు వచ్చినప్పుడు
  rationale: వావ్‌తో కూడిన క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి దృశ్యానికి కాలసంబంధ నేపథ్యాన్ని సహజమైన తెలుగులో చూపేందుకు ‘వచ్చినప్పుడు’ వాడబడింది. עַד ఇక్కడ గమ్యస్థానాన్ని చేరడాన్ని సూచిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా గమనించదగిన వ్యక్తి రంగప్రవేశాన్ని చూపే హీబ్రూ సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: ఒకడు అక్కడి నుండి బయటికి వచ్చాడు
  rationale: కథన దృశ్యంలో జరుగుతున్న బయటికి రావడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: సౌలు వంశానికి చెందిన
  rationale: מִשְׁפָּחָה మరియు בֵּית కలిపి సూచించే బంధుత్వ/రాజవంశ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: అతని పేరు గెరా కుమారుడు షిమీ
  rationale: హీబ్రూ పరిచయ సూత్రంలోని పేరు, తండ్రి పేరు రెండింటినీ యథాతథంగా నిలుపుతుంది.
- source_word: יֹצֵא יָצוֹא
  choice: బయటికి వస్తూనే ఉన్నాడు
  rationale: కృదంతం + infinitive absolute నిర్మాణంలోని నిరంతర లేదా పునరావృత చర్య బలాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וּמְקַלֵּל
  choice: శపిస్తూ
  rationale: బయటికి వస్తున్న చర్యతో సమకాలంలో కొనసాగుతున్న శాపోక్తిని కృదంత రూపంలో స్పష్టంగా చూపుతుంది.
