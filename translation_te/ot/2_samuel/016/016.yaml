  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר בָּ֞א חוּשַׁ֧י הָ/אַרְכִּ֛י רֵעֶ֥ה דָוִ֖ד אֶל אַבְשָׁל֑וֹם וַ/יֹּ֤אמֶר חוּשַׁי֙ אֶל אַבְשָׁלֹ֔ם יְחִ֥י הַ/מֶּ֖לֶךְ יְחִ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: te
  text: 'దావీదు స్నేహితుడైన అర్కీయుడు హూషై అబ్షాలోము వద్దకు వచ్చినప్పుడు, హూషై అబ్షాలోముతో ఇలా అన్నాడు: “రాజు చిరకాలం జీవించుగాక![a] రాజు చిరకాలం జీవించుగాక!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు చిరకాలం జీవించాలి!” హీబ్రూలో ఇది రాజును ఉద్దేశించి చేసే జయధ్వని.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని సంఘటనల క్రమాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంతో తెలియజేస్తుంది; విడిగా ‘అప్పుడు జరిగింది’ అని అనవసరంగా చేర్చదు.
- source_word: בָּא
  choice: దగ్గరికి వచ్చినప్పుడు
  rationale: అబ్షాలోము సమక్షానికి హూషై రావడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: హూషై అనే అర్కీయుడు
  rationale: వ్యక్తి పేరును, అతని ప్రాంతీయ/వంశసంబంధ విశేషణాన్ని లిప్యంతరీకరించి, తెలుగు వాక్యంలో స్పష్టంగా కలుపుతుంది.
- source_word: רֵעֶה דָוִד
  choice: దావీదు స్నేహితుడు
  rationale: నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతూ వ్యక్తిగత మరియు రాజకీయ అనుబంధ భావాన్ని నిలుపుతుంది.
- source_word: אֶל אַבְשָׁלוֹם
  choice: అబ్షాలోము దగ్గరికి / అబ్షాలోముతో
  rationale: మొదటి సందర్భంలో గమన లక్ష్యాన్ని, రెండవ సందర్భంలో సంభాషణ దిశను తెలుగు వాడుకకు తగిన విధంగా తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేయడానికి సహజమైన ఆధునిక తెలుగు క్రియ.
- source_word: יְחִי הַמֶּלֶךְ
  choice: రాజు చిరకాలం జీవించాలి!
  rationale: రాజును ఉద్దేశించిన ప్రజా జయధ్వని స్వరాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఆశీర్వచన/ఆకాంక్ష భావాన్ని నిలుపుతుంది.
- source_word: יְחִי הַמֶּלֶךְ (repeated)
  choice: రాజు చిరకాలం జీవించాలి!
  rationale: హీబ్రూలోని పునరుక్తిని యథాతథంగా ఉంచి, జయధ్వని ఉద్ఘాటనను మరియు హూషై విధేయతలోని కథనాత్మక సందిగ్ధతను కాపాడుతుంది.
theological_decisions:
- issue: అబ్షాలోమును ఉద్దేశించి హూషై పలికిన రాజ జయధ్వనిలోని సందిగ్ధత
  choice: వ్యంగ్యమని లేదా మోసపూరితమని వివరించకుండా సాధారణ రాజ జయధ్వనిగానే అనువదించడం
  alternative: హూషై వ్యంగ్యంగా లేదా మోసపూరిత ఉద్దేశంతో పలికాడని పదాల్లోనే స్పష్టం చేయడం
  rationale: వచనం స్వయంగా ప్రామాణిక రాజ జయధ్వనిని మాత్రమే నమోదు చేస్తుంది. విస్తృత సందర్భం వ్యూహాత్మక ద్వంద్వార్థాన్ని సూచించినా, అనువాదం దాన్ని ముందుగానే పరిష్కరించకుండా కథన ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, అయితే రాజసంబంధ జయధ్వనికి తగిన గౌరవభరిత స్వరంతో రూపొందించబడింది. పేర్లకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు దగ్గరైన రూపాలు ఉపయోగించబడ్డాయి.
