  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד וַ/אֲנָשָׁ֖י/ו בַּ/דָּ֑רֶךְ וְ/שִׁמְעִ֡י הֹלֵךְ֩ בְּ/צֵ֨לַע הָ/הָ֜ר לְ/עֻמָּת֗/וֹ הָלוֹךְ֙ וַ/יְקַלֵּ֔ל וַ/יְסַקֵּ֤ל בָּֽ/אֲבָנִים֙ לְ/עֻמָּת֔/וֹ וְ/עִפַּ֖ר בֶּ/עָפָֽרס׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: te
  text: దావీదు మరియు అతని మనుషులు దారిలో వెళ్తుండగా, షిమీ అతనికి ఎదురుగా కొండ వాలుపై నడుస్తూ, శపిస్తూ[a], అతనికి ఎదురుగా రాళ్లు విసురుతూ[b], దుమ్ము విసురుతూ వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని నిర్మాణం షిమీ నడుస్తూనే నిరంతరం శపిస్తూ ఉన్నాడనే భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇక్కడ మళ్లీ ‘అతనికి ఎదురుగా’ అనే స్థానసూచక పదబంధమే ఉంది; షిమీ దావీదుకు ఎదురుగా ఉండి రాళ్లు విసురుతున్నాడనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: దారిలో
  rationale: דֶּרֶךְ ఇక్కడ దావీదు ప్రయాణిస్తున్న దారి లేదా మార్గాన్ని సూచిస్తుంది; ‘దారిలో’ సహజమైన, నిర్దిష్టమైన తెలుగు ప్రయోగం.
- source_word: בְּצֵלַע הָהָר
  choice: కొండ పక్కన
  rationale: צֵלַע అనే పదానికి ‘పక్క/వైపు’ అనే ప్రాథమిక భావం ఉంది. కొండ వాలును సూచించే ఈ సందర్భంలో ‘కొండ పక్కన’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְעֻמָּתוֹ
  choice: అతనికి ఎదురుగా / అతని వైపుగా
  rationale: మొదటి సందర్భంలో షిమీ దావీదుకు ఎదురుగా, కొండ పక్కన సమాంతరంగా కదులుతున్న స్థితిని ‘అతనికి ఎదురుగా’ తెలియజేస్తుంది. రాళ్లు విసిరే రెండో సందర్భంలో సహజమైన తెలుగుకోసం ‘అతని వైపుగా’ వాడి, మూలంలోని స్థానార్థక అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: నడుస్తూ ... వెళ్లాడు
  rationale: మూలంలోని పునరుక్త గమన నిర్మాణం చర్యలు కొనసాగుతూ ఉన్నాయని సూచిస్తుంది. తెలుగు వాక్యంలో ‘నడుస్తూ ... వెళ్లాడు’ ఆ నిరంతర గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְקַלֵּל
  choice: శపిస్తూ
  rationale: Piel రూపంలోని קלל స్పష్టంగా ‘శపించు’ అని అర్థం; కొనసాగుతున్న చర్యగా తెలుగులో ‘శపిస్తూ’ అనువదించాం.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: రాళ్లు రువ్వుతూ
  rationale: ఇది న్యాయపరమైన రాళ్లతో చంపే శిక్ష కంటే దూరం నుంచి రాళ్లు విసిరే వేధింపును సూచిస్తుంది. ‘రాళ్లు రువ్వుతూ’ ఆ దృశ్యాన్ని సంక్షిప్తంగా, సజీవంగా తెలియజేస్తుంది.
- source_word: וְעִפַּר בֶּעָפָר
  choice: దుమ్ము ఎగరేస్తూ
  rationale: ఈ పదబంధం దుమ్ము లేదా మట్టిని విసరడాన్ని సూచిస్తుంది. ‘దుమ్ము ఎగరేస్తూ’ శత్రుత్వపూరితమైన ఆ చర్యను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַאֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: సందర్భంలో אֲנָשָׁיו దావీదుతో ఉన్న పురుష అనుచరులను సూచిస్తుంది; ‘అతని మనుషులు’ మూలానికి దగ్గరగా ఉండి తెలుగులో స్పష్టంగా ఉంటుంది.
