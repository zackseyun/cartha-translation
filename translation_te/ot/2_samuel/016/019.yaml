base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/019.yaml
  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: te
  text: రెండవది, నేను ఎవరిని సేవించాలి? అతని కుమారుని సన్నిధిలోనే సేవ చేయాలి కదా? నేను నీ తండ్రి సన్నిధిలో ఎలా సేవ చేశానో, అలాగే నీ సన్నిధిలో ఉంటాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతని కుమారుని సన్నిధిలో ... నీ తండ్రి సన్నిధిలో ... నీ సన్నిధిలో.’ ఇది రాజు సమక్షంలో లేదా అతని ఆధీనంలో సేవ చేయడాన్ని సూచించే రాజసభా ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: రెండవది
  rationale: హుషై తన రెండవ వాదనను ప్రవేశపెట్టే సంభాషణ సూచకంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: నేను ఎవరిని సేవించాలి?
  rationale: రాజకీయ విధేయతతో సేవచేయడం అనే עבד భావాన్ని, అలంకారప్రశ్న స్వరాన్ని నిలుపుతుంది.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: అతని కుమారుని సన్నిధిలోనే కదా?
  rationale: הֲלוֹא ఆశించే సమ్మతిని ‘కదా’ తెలియజేస్తుంది; לִפְנֵי అనే రాజసభా ప్రయోగాన్ని ‘సన్నిధిలో’ నిలుపుతుంది.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: నేను నీ తండ్రి సన్నిధిలో ఎలా సేవించానో
  rationale: సేవను, రాజు ఎదుట లేదా అతని ఆధీనంలో ఉండే సభా ప్రయోగాన్ని రెండింటినీ స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: అలాగే నీ సన్నిధిలో ఉంటాను
  rationale: మూలంలో עבדను మళ్లీ వాడకుండా היה (‘ఉండు’)కు మారినదాన్ని కాపాడుతూ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘సేవించాలి/సేవించాను’ నుంచి ‘ఉంటాను’ అనే క్రియామార్పును, అలాగే ‘సన్నిధిలో’ అనే మూడుసార్ల రాజసభా భావాన్ని సాధ్యమైనంతవరకు నిలిపింది.
