source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: te
  text: 'అహీతోఫెలు అబ్షాలోముతో ఇలా అన్నాడు: “నీ తండ్రి ఇంటిని కాపాడుటకు విడిచిపెట్టిన ఉపపత్నులతో శయనించు[a]. అప్పుడు నీవు నీ తండ్రికి అసహ్యుడవయ్యావని ఇశ్రాయేలీయులందరూ వింటారు; నీతో ఉన్న వారందరూ ధైర్యం తెచ్చుకుంటారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దగ్గరికి వెళ్లు’; ఇది లైంగిక సంబంధానికి సాధారణ సభ్యోక్తి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘నీతో ఉన్న వారందరి చేతులు బలపడతాయి’; అంటే వారు ధైర్యం తెచ్చుకుంటారు లేదా మరింత సాహసంగా నిలబడతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: తో శయనించు
  rationale: ఈ సందర్భంలో ఇది లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తి. అక్షరార్థమైన ‘దగ్గరికి వెళ్లు’ తెలుగు పాఠకులకు ఉద్దేశాన్ని స్పష్టంగా తెలియజేయకపోవచ్చు; ‘శయనించు’ గంభీరతను, సభ్యోక్తి స్వభావాన్ని కాపాడుతుంది.
- source_word: פִּלַגְשֵׁי
  choice: ఉపపత్నులు
  rationale: ప్రాచీన రాజకుటుంబంలో గుర్తింపు ఉన్నప్పటికీ భార్యకంటే తక్కువ హోదా కలిగిన స్త్రీలను సూచించే పదానికి ఇది ఖచ్చితమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: ఇంటిని కాపాడడానికి ... విడిచిపెట్టిన
  rationale: హీబ్రూ ఉద్దేశార్థక నిర్మాణాన్ని సహజమైన తెలుగులో చూపుతూ, שמר లోని కాపలా/సంరక్షణ భావాన్ని నిలుపుతుంది.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: అప్పుడు ... ఇశ్రాయేలీయులందరూ వింటారు
  rationale: ఆజ్ఞకు కలిగే ఫలితాన్ని సందర్భానుసారంగా ‘అప్పుడు’ స్పష్టం చేస్తుంది. ‘ఇశ్రాయేలీయులందరూ’ అనేది దేశభూభాగం కంటే ప్రజాసమూహాన్ని సూచిస్తుంది.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: నీవు నీ తండ్రికి అసహ్యుడవయ్యావు
  rationale: נבאשׁ యొక్క దుర్వాసన/అసహ్యత రూపకబలాన్ని సహజమైన తెలుగులో నిలుపుతూ, అబ్షాలోము తన తండ్రికి పూర్తిగా ద్వేషపాత్రుడయ్యాడనే సామాజిక-రాజకీయ భావాన్ని తెలియజేస్తుంది.
- source_word: וְחָזְקוּ יְדֵי
  choice: ధైర్యం తెచ్చుకుంటారు
  rationale: ‘చేతులు బలపడతాయి’ అనే హీబ్రూ జాతీయానికి సంకల్పం లేదా ధైర్యం పెరగడం అనే అర్థం ఉంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు భావాన్ని ఇచ్చి, మూల చిత్రాన్ని పాదసూచికలో ఉంచింది.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: నీతో ఉన్న వారందరూ
  rationale: మద్దతుదారులు ఉద్దేశించబడినప్పటికీ, హీబ్రూ సంబంధపూర్వక పదప్రయోగాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: రాజకీయ ఉద్దేశంతో ఇచ్చిన లైంగిక సలహాలోని సభ్యోక్తి
  choice: ‘ఉపపత్నులతో శయనించు’ అని గంభీరమైన, స్పష్టమైన సభ్యోక్తితో అనువదించడం.
  alternative: ‘ఉపపత్నుల దగ్గరికి వెళ్లు’ లేదా ‘వారితో లైంగిక సంబంధం పెట్టుకో.’
  rationale: ఈ చర్య దావీదుతో తిరుగులేని విరోధాన్ని బహిరంగంగా ప్రకటించడానికి ఉద్దేశించబడింది. అనువాదం దానిని మరుగుపరచకూడదు, అలాగే అనవసరంగా కఠినంగా లేదా సంచలనాత్మకంగా చెప్పకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. లైంగిక చర్యను అసభ్యంగా కాకుండా స్పష్టంగా తెలిపేందుకు ‘శయనించు’ ఎంచుకోబడింది; హీబ్రూ జాతీయాన్ని ప్రధాన పాఠ్యంలో భావానువాదం చేసి దాని మూల చిత్రాన్ని పాదసూచికలో ఇచ్చాం.
