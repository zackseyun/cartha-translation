reference: 2 Samuel 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤ד אֶל אֲבִישַׁי֙ וְ/אֶל כָּל עֲבָדָ֔י/ו הִנֵּ֥ה בְנִ֛/י אֲשֶׁר יָצָ֥א מִ/מֵּעַ֖/י מְבַקֵּ֣שׁ אֶת נַפְשִׁ֑/י וְ/אַ֨ף כִּֽי עַתָּ֜ה בֶּן הַ/יְמִינִ֗י הַנִּ֤חוּ ל/וֹ֙ וִֽ/יקַלֵּ֔ל כִּ֥י אָֽמַר ל֖/וֹ יְהוָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: te
  text: 'అప్పుడు దావీదు అబీషైతోనూ తన సేవకులందరితోనూ ఇలా అన్నాడు: “చూడండి, నా దేహం నుంచి పుట్టిన నా కుమారుడే నా ప్రాణం తీయాలని చూస్తున్నాడు; ఇక ఈ బెన్యామీనీయుడు మరెంతగా! అతణ్ణి వదిలేయండి; అతణ్ణి శపించనివ్వండి. ఎందుకంటే యాహ్వే అతనికి చెప్పాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఎందుకంటే యాహ్వే అతనితో అన్నాడు.” ఏమి అన్నాడో హీబ్రూ పాఠం స్పష్టంగా చెప్పదు; సందర్భం ప్రకారం శపించడమే ఉద్దేశమని తెలుస్తుంది.
    reason: మూలంలోని వ్యక్తం చేయని కర్మను మరియు సాధ్యమైన అక్షరార్థ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి
  rationale: దావీదు చేస్తున్న పోలికపై శ్రోతల దృష్టిని నిలిపే ఆహ్వానార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: నా దేహం నుంచి పుట్టిన నా కుమారుడు
  rationale: సహజ సంతానాన్ని సూచించే హీబ్రూ శరీరసంబంధమైన చిత్రాన్ని నిలుపుతుంది; పురుషుడైన దావీదు మాటలో ‘నా గర్భం నుంచి’ అని తప్పుదారి పట్టించకుండా ఉంటుంది.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: నా ప్రాణం తీయాలని చూస్తున్నాడు
  rationale: హీబ్రూ జాతీయార్థం ఒకరి ప్రాణాన్ని తీసేందుకు ప్రయత్నించడాన్ని సూచిస్తుంది; తెలుగులో అర్థం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאַף כִּי עַתָּה
  choice: ఇక ... మరెంతగా!
  rationale: దావీదు తన సొంత కుమారుని చర్య నుంచి బెన్యామీనీయుని చర్యకు చేసే ఉద్ధృత అలంకారిక పోలికను, మూలంలోని సంక్షిప్తతను నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: בֶּן הַיְמִינִי
  choice: ఈ బెన్యామీనీయుడు
  rationale: బెన్యామీను గోత్రానికి చెందిన వ్యక్తిని సూచించే ప్రామాణికమైన, సంక్షిప్తమైన రూపం.
- source_word: הַנִּחוּ לוֹ
  choice: అతణ్ణి వదిలేయండి
  rationale: దావీదు తన మనుషులందరికీ ఇచ్చిన బహువచన ఆజ్ఞను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וִיקַלֵּל
  choice: అతడు శపించనివ్వండి
  rationale: ముందున్న ఆజ్ఞకు కొనసాగింపుగా షిమీ శపించడానికి అడ్డుపడవద్దనే అనుమతిని వ్యక్తం చేస్తుంది.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: ఎందుకంటే యెహోవా అతనికి అలా చెప్పాడు
  rationale: దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా ఉంచి, చెప్పబడిన విషయం సందర్భం నుంచి గ్రహించాల్సి ఉందనే మూలంలోని సంక్షిప్తతను ‘అలా’ ద్వారా సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: షిమీ శాపాన్ని దేవుని ప్రత్యక్ష ఆజ్ఞగా భావించాలా, లేక కేవలం దేవుని అనుమతి లేదా ప్రావిడెన్సుగా భావించాలా
  choice: యెహోవా అతనికి అలా చెప్పాడని దావీదు చేసిన ఆరోపణను యథాతథంగా ఉంచడం
  alternative: యెహోవా అతనిని అనుమతించాడు
  rationale: హీబ్రూ పాఠం దావీదు మాటలో ఈ చర్యను యెహోవా చెప్పినదానితో నేరుగా అనుసంధానిస్తుంది. దాన్ని కేవలం అనుమతిగా మృదువుపరచకుండా theological tensionను నిలుపుతుంది; అయితే మూలంలో లేని ప్రత్యక్ష ఉద్ధరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, రాజు పలికిన గంభీరతకు తగినదిగానూ ఉంది. మూలంలోని ఉద్ధృత పోలికను ఆశ్చర్యార్థక సంక్షిప్త వాక్యంతో నిలిపింది.
