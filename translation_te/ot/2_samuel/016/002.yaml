  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל צִיבָ֖א מָה אֵ֣לֶּה לָּ֑/ךְ וַ/יֹּ֣אמֶר צִ֠יבָא הַ/חֲמוֹרִ֨ים לְ/בֵית הַ/מֶּ֜לֶךְ לִ/רְכֹּ֗ב ו/ל/ה/לחם וְ/הַ/קַּ֨יִץ֙ לֶ/אֱכ֣וֹל הַ/נְּעָרִ֔ים וְ/הַ/יַּ֕יִן לִ/שְׁתּ֥וֹת הַ/יָּעֵ֖ף בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: te
  text: 'అప్పుడు రాజు సీబాతో, “ఇవన్నీ దేనికి?[a]” అని అడిగాడు. సీబా ఇలా జవాబిచ్చాడు: “గాడిదలు రాజు పరివారంలోని వారు స్వారీ చేయడానికి, రొట్టెలు మరియు వేసవికాలపు పండ్లు[b] యువకులు[c] తినడానికి, ద్రాక్షారసం అరణ్యంలో అలసినవారు తాగడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇవి నీకు ఏమిటి?” అంటే, “ఇవన్నీ దేనికి?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వేసవికాలపు దిగుబడి.” ఈ హీబ్రూ పదం వేసవిలో సేకరించే పండ్లను లేదా ఇతర దిగుబడిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పరిచారకులు” లేదా “సేవకులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: ఇవన్నీ ఎందుకు తెచ్చావు?
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘ఇవి నీకు ఏమిటి?’ అని ఉన్నా, సందర్భంలో రాజు సీబా తెచ్చిన వస్తువుల ఉద్దేశాన్ని అడుగుతున్నాడు. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: הַחֲמוֹרִים
  choice: గాడిదలు
  rationale: జంతువుకు సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: రాజు ఇంటివారు
  rationale: בַּיִת ఇక్కడ భవనం కంటే రాజు కుటుంబం లేదా పరివారాన్ని సూచిస్తుంది. ‘రాజు ఇంటివారు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: לִרְכֹּב
  choice: ఎక్కడానికి
  rationale: గాడిదల ప్రయోజనాన్ని తెలిపే ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַלֶּחֶם
  choice: రొట్టెలు
  rationale: మూలంలోని ‘రొట్టె’ అనే నిర్దిష్ట ఆహారపదాన్ని సాధారణ తెలుగు వాడుకలో సహజంగా అందిస్తుంది; దాన్ని విస్తృతమైన ‘ఆహారం’గా మార్చలేదు.
- source_word: הַקַּיִץ
  choice: వేసవికాలపు పండ్లు
  rationale: ఈ పదం వేసవిలో సేకరించే పండ్లు లేదా దిగుబడిని విస్తృతంగా సూచించవచ్చు. మూలంలో లేని నిర్దిష్ట పండును చేర్చకుండా భావ విస్తృతిని కాపాడుతుంది.
- source_word: הַנְּעָרִים
  choice: యువకులు
  rationale: పదం ప్రాథమికంగా యువకులను సూచించినా, సందర్భానుసారం సేవకులు లేదా పరిచారకులు అనే భావం ఉండవచ్చు. ప్రధాన పాఠంలో రూపసామ్యాన్ని కాపాడి, సందర్భార్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: הַיָּעֵף
  choice: అలసిపోయినవారు
  rationale: హీబ్రూలో ఏకవచన విశేషణం సమూహార్థకంగా లేదా సాధారణార్థకంగా వాడబడింది. తెలుగులో బహువచన రూపం అదే సాధారణ వర్గార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసం లేని నిర్జన ప్రాంతాన్ని సూచిస్తుంది; కేవలం ఇసుక ఎడారి అనే సంకుచిత భావాన్ని కలిగించకుండా ‘అరణ్యం’ కథా సందర్భానికి సరిపోతుంది.
