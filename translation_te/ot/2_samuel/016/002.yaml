  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. జాబితా నిర్మాణాన్ని సెమీకోలన్లతో స్పష్టంగా ఉంచాం. హీబ్రూ పదాల నిజమైన భావవిస్తృతిని ప్రధాన పాఠంలో అతిగా వివరించకుండా పాదసూచికల్లో సంరక్షించాం.
