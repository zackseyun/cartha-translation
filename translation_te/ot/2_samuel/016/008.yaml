  revision_rationale: 'ప్రధాన పాఠంలో ‘రక్తపాతపు మనిషివి’ స్థానంలో ‘రక్తపాతకుడివి’ని పెట్టాం. ఈ చిన్న మార్పు మాత్రమే అవసరం: ఇది అర్థాన్ని మార్చకుండా, హీబ్రూ నుడికారంలోని రక్తపాతం/రక్తాపరాధంతో గుర్తింపబడిన వ్యక్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. మిగిలిన పాఠం మరియు పాదసూచికలు మూలపాఠపు భావసాధ్యతలను సముచితంగా కాపాడుతున్నాయి.'
