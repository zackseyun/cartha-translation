- from: “యాహ్వే సౌలు ఇంటివారి రక్తమంతటినీ నీ మీదికి తిరిగి రప్పించాడు[a]. నువ్వు సౌలు స్థానంలో రాజ్యమేలావు; ఇప్పుడు యాహ్వే రాజ్యాన్ని నీ కుమారుడైన అబ్షాలోము చేతికి అప్పగించాడు. ఇదిగో, నువ్వు నీ విపత్తులో ఉన్నావు[b]; ఎందుకంటే నువ్వు రక్తపాతపు మనిషివి[c].”
  to: “యాహ్వే సౌలు ఇంటివారి రక్తమంతటినీ నీ మీదికి తిరిగి రప్పించాడు[a]. నువ్వు సౌలు స్థానంలో రాజ్యమేలావు; ఇప్పుడు యాహ్వే రాజ్యాన్ని నీ కుమారుడైన అబ్షాలోము చేతికి అప్పగించాడు. ఇదిగో, నువ్వు నీ విపత్తులో ఉన్నావు[b]; ఎందుకంటే నువ్వు రక్తపాతకుడివి[c].”
  rationale: 'ప్రధాన పాఠంలో ‘రక్తపాతపు మనిషివి’ స్థానంలో ‘రక్తపాతకుడివి’ని పెట్టాం. ఈ చిన్న మార్పు మాత్రమే అవసరం: ఇది అర్థాన్ని మార్చకుండా, హీబ్రూ నుడికారంలోని రక్తపాతం/రక్తాపరాధంతో గుర్తింపబడిన వ్యక్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. మిగిలిన పాఠం మరియు పాదసూచికలు మూలపాఠపు భావసాధ్యతలను సముచితంగా కాపాడుతున్నాయి.'
