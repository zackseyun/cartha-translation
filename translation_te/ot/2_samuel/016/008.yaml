  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: te
  text: “యాహ్వే సౌలు ఇంటివారి రక్తమంతటినీ నీ మీదికి తిరిగి రప్పించాడు[a]. నువ్వు సౌలు స్థానంలో రాజ్యమేలావు; ఇప్పుడు యాహ్వే రాజ్యాన్ని నీ కుమారుడైన అబ్షాలోము చేతికి అప్పగించాడు. ఇదిగో, నువ్వు నీ విపత్తులో ఉన్నావు[b]; ఎందుకంటే నువ్వు రక్తపాతకుడివి[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సౌలు ఇంటి రక్తాలన్నిటినీ.” దీనిని “సౌలు ఇంటివారి రక్తపాతమంతటినీ” లేదా “సౌలు ఇంటి రక్తాపరాధమంతటినీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నీ కీడులో” లేదా “నీ చెడులో” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం నైతిక చెడునైనా, ఒకరికి సంభవించిన కీడు లేదా విపత్తునైనా సూచించగలదు; ఇక్కడ దావీదుకు వచ్చిన విపత్తు ప్రధానంగా ఉద్దేశించబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “రక్తాల మనిషివి.” ఈ నుడికారం రక్తాపరాధం లేదా హింసతో గుర్తింపబడిన వ్యక్తిని సూచిస్తుంది; “రక్తపాతం చేసినవాడివి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: నీ మీదికి తిరిగి రప్పించాడు
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి వచ్చేలా చేయడం’ అనే భావాన్నీ, దావీదు మీదికి ప్రతిఫలం తిరిగి వచ్చిందనే హీబ్రూ చిత్రాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: సౌలు ఇంటివారి రక్తమంతటినీ
  rationale: హీబ్రూలో అక్షరార్థంగా ఉన్న ‘సౌలు ఇంటి రక్తాలన్నీ’ అనే బహువచన ప్రయోగాన్ని సహజమైన తెలుగులో ఉంచుతూ, రక్తపాతం లేదా రక్తాపరాధం అనే సాధ్యమైన భావాలకు చోటిస్తుంది.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: నువ్వు సౌలు స్థానంలో రాజ్యమేలావు
  rationale: תחתיו ఇక్కడ ‘అతని స్థానంలో’ అనే రాజ్య వారసత్వ భావాన్ని సూచిస్తుంది. తెలుగులో సంబంధవాక్యాన్ని విడదీయడం అర్థస్పష్టతను, సహజత్వాన్ని పెంచుతుంది.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: రాజ్యాన్ని ... చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ అధికార బదిలీ నుడికారాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: וְהִנְּךָ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని వెంటనే ఆకర్షించే హీబ్రూ సంభాషణ అవ్యయానికి గౌరవప్రదమైన, సుపరిచితమైన తెలుగు సమానం.
- source_word: בְּרָעָתֶךָ
  choice: నీ విపత్తులో
  rationale: רָעָה నైతిక చెడునూ, అనుభవిస్తున్న కీడు లేదా విపత్తునూ సూచించగలదు. అబ్షాలోము తిరుగుబాటు సందర్భంలో దావీదుకు సంభవించిన విపత్తు ప్రధాన భావం; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: אִישׁ דָּמִים
  choice: రక్తపాతపు మనిషివి
  rationale: ‘రక్తాల మనిషి’ అనే హీబ్రూ నుడికారపు బలాన్ని నిలుపుతూ, హింస లేదా రక్తాపరాధంతో గుర్తింపబడిన వ్యక్తి అనే భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: בְּרָעָתֶךָ యొక్క భావం
  choice: నీ విపత్తులో
  alternative: నీ చెడులో / నీ కీడులో
  rationale: ప్రస్తుత సందర్భం దావీదును చుట్టుముట్టిన విపత్తును సూచిస్తుంది. అయితే నైతిక ‘చెడు’ అనే పదసాధ్యతను పాదసూచికలో ఉంచడం ద్వారా షిమీ ఆరోపణలోని ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని పూర్తిగా తొలగించలేదు.
- issue: షిమీ మాటలలోని దైవిక ప్రతీకార ఆరోపణ
  choice: ఆరోపణను నేరుగా అనువదించడం
  alternative: వ్యాఖ్యాత్మకంగా మృదువుచేయడం
  rationale: ఇవి షిమీ పలికిన మాటలు; అనువాదం అతని వాదనను యథాతథంగా తెలియజేస్తుంది గాని, కథకుడు దానిని సమర్థిస్తున్నాడని అదనంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రత్యక్ష ఆరోపణకు తగిన బలమైన కానీ అర్థమయ్యే శైలిని ఉపయోగించాం. దావీదును ఉద్దేశించిన ఏకవచన సంభాషణలో సహజమైన ‘నువ్వు/నీ’ రూపాలు వాడాం. ‘ఇదిగో’ వంటి స్వల్ప బైబిలీయ గాంభీర్యాన్ని నిలిపినా, పాతకాలపు క్లిష్ట వాక్యనిర్మాణాన్ని నివారించాం.
