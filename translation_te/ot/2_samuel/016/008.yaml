    rationale: అర్థం చేరుతున్నప్పటికీ, ఆధునిక తెలుగులో వ్యక్తి స్వభావాన్ని లేదా రక్తపాతంతో ముడిపడిన గుర్తింపును చెప్పడానికి ‘రక్తపాతకుడివి’ మరింత సవ్యంగా ఉంటుంది. ఇది మూలంలోని వ్యక్తిని వర్ణించే నుడికారాన్ని కాపాడుతుంది; ఒక నిర్దిష్ట ఘటనకు పరిమితం చేయదు.
  revised_text: “యాహ్వే సౌలు ఇంటివారి రక్తమంతటినీ నీ మీదికి తిరిగి రప్పించాడు[a]. నువ్వు సౌలు స్థానంలో రాజ్యమేలావు; ఇప్పుడు యాహ్వే రాజ్యాన్ని నీ కుమారుడైన అబ్షాలోము చేతికి అప్పగించాడు. ఇదిగో, నువ్వు నీ విపత్తులో ఉన్నావు[b]; ఎందుకంటే నువ్వు రక్తపాతకుడివి[c].”
