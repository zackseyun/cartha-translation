    text: లిఖిత పాఠాన్ని అనుసరిస్తే, “నా దోషాన్ని.”
    reason: textual_variant
  revision_rationale: The revision retains the Hebrew uncertainty marker (“బహుశా”), the traditional qere sense “my affliction,” and the explicit ketiv alternative in the footnote. It aligns the divine name with the project’s Yahweh policy and more directly represents Shimei’s cursing without adding interpretation.
