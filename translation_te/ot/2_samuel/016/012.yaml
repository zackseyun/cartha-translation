id: 2SA.16.12
reference: 2 Samuel 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אוּלַ֛י יִרְאֶ֥ה יְהוָ֖ה ב/עונ/י וְ/הֵשִׁ֨יב יְהוָ֥ה לִ/י֙ טוֹבָ֔ה תַּ֥חַת קִלְלָת֖/וֹ הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/012.yaml
  text: Perhaps Yahweh will look on my affliction[a], and Yahweh will repay me with good in place of his cursing this day.
translation:
  language: te
  text: బహుశా యాహ్వే నా బాధను[a] గమనించి, ఈ రోజున అతడు నన్ను శపించిన దానికి బదులుగా యాహ్వే నాకు మేలు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లిఖిత పాఠాన్ని అనుసరిస్తే, “నా దోషాన్ని.”
    reason: textual_variant
lexical_decisions:
- source_word: אוּלַי
  choice: బహుశా
  rationale: దావీదు మాటలోని అనిశ్చితితో కూడిన నిరీక్షణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִרְאֶה
  choice: చూసి
  rationale: ראה యొక్క ప్రాథమిక దృశ్యరూపాన్ని నిలుపుతూ, ఇక్కడ బాధను గమనించి పట్టించుకోవడం అనే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: ב/עונ/י
  choice: నా బాధను
  rationale: మాసొరేటిక్ పఠన సంప్రదాయం మరియు షిమీ దూషణ వల్ల దావీదు అనుభవిస్తున్న అవమానకర పరిస్థితి ఈ అర్థానికి మద్దతిస్తాయి; లిఖిత రూపంలోని భిన్నార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהֵשִׁיב יְהוָה לִי טוֹבָה
  choice: యెహోవా నాకు మేలు చేస్తాడు
  rationale: హిఫిల్ రూపంలోని తిరిగి ఇవ్వడం లేదా ప్రతిఫలించడం అనే భావాన్ని, తెలుగులో సహజంగా ప్రయోజనకరమైన ప్రతిఫలంగా వ్యక్తం చేస్తుంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఒకదాని స్థానంలో మరొకటి ఇవ్వబడే మార్పిడి లేదా ప్రతిఫల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קִלְלָתוֹ
  choice: ఇతడు చేసిన దూషణకు
  rationale: సందర్భంలో షిమీ పలుకుతున్న శాపవాక్యాలు, నిందాపూర్వక మాటల క్రియాత్మక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హీబ్రూ కాలసూచనను స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ב/עונ/י లోని కెతీవ్-కెరే భేదం
  choice: నా బాధను
  alternative: నా దోషాన్ని
  rationale: సాంప్రదాయ పఠనం మరియు తక్షణ సందర్భం దావీదు అనుభవిస్తున్న బాధ లేదా దుస్థితిని సూచిస్తాయి. అయితే లిఖిత రూపం ‘నా దోషాన్ని’ అని అర్థమయ్యే అవకాశాన్ని కలిగిస్తుంది; ఆ పాఠ్య-దైవశాస్త్ర ఉద్రిక్తతను తొలగించకుండా పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బహుశా’ ద్వారా దావీదు అనిశ్చిత నిరీక్షణను, ‘చూసి’ ద్వారా దేవుడు అతని పరిస్థితిని గమనించే భావాన్ని నిలిపాం. పాదటిప్పణి గుర్తు [a] ప్రధాన వచనంలో చేర్చబడింది.
