source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וְ/אַיֵּ֖ה בֶּן אֲדֹנֶ֑י/ךָ וַ/יֹּ֨אמֶר צִיבָ֜א אֶל הַ/מֶּ֗לֶךְ הִנֵּה֙ יוֹשֵׁ֣ב בִּ/ירוּשָׁלִַ֔ם כִּ֣י אָמַ֔ר הַ/יּ֗וֹם יָשִׁ֤יבוּ לִ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל אֵ֖ת מַמְלְכ֥וּת אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: te
  text: అప్పుడు రాజు, “నీ యజమాని కుమారుడు ఎక్కడ ఉన్నాడు?” అని అడిగాడు. సీబా రాజుతో, “ఇదిగో, అతడు యెరూషలేములో ఉన్నాడు[a]; ఎందుకంటే, ‘ఈ రోజు ఇశ్రాయేలు వంశస్థులు నా తండ్రి రాజ్యాన్ని నాకు తిరిగి ఇస్తారు’ అని అతడు చెప్పాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెరూషలేములో ఉండిపోయాడు.” హీబ్రూ కృదంతం కేవలం కూర్చోవడమే కాక, ఒక చోట కొనసాగి ఉండడం లేదా అక్కడే ఉండిపోవడం అనే భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అని అడిగాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: וְאַיֵּה בֶּן אֲדֹנֶיךָ
  choice: నీ యజమాని కుమారుడు ఎక్కడ ఉన్నాడు?
  rationale: ‘అదోనెఖా’ ఇక్కడ సీబా యజమానిని సూచిస్తుంది; దైవిక బిరుదు కాదు. ప్రారంభ సంధికారకాన్ని తెలుగులో సహజమైన ప్రశ్నా నిర్మాణంలో అంతర్నిహితం చేశాం.
- source_word: צִיבָא
  choice: సీబా
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సమాధానంలోని సూచనాత్మక, దృష్టి ఆకర్షించే బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יוֹשֵׁב
  choice: ఉంటున్నాడు
  rationale: యషవ్ క్రియ యొక్క వర్తమాన కృదంతం ఇక్కడ కేవలం కూర్చోవడాన్ని కాక ఒక చోట ఉండిపోవడం లేదా నివసించడాన్ని సూచిస్తుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములోనే
  rationale: స్థలనామాన్ని ప్రామాణికంగా లిప్యంతరీకరించాం; ‘నే’ అతడు అక్కడే ఉండిపోయాడనే సందర్భబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי אָמַר
  choice: ఎందుకంటే ... అని అతడు అనుకున్నాడు
  rationale: ‘కి’ కారణాన్ని పరిచయం చేస్తుంది. హీబ్రూ ‘అమర్’ సందర్భానుసారం మనసులో అనుకోవడాన్నీ సూచించగలదు; ఇక్కడ ఉద్దేశాన్ని తెలుగులో స్పష్టంగా, కానీ అదనపు సందేహభావం చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాల సూచక పదానికి సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: יָשִׁיבוּ לִי
  choice: నాకు తిరిగి అప్పగిస్తారు
  rationale: హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం/పునరుద్ధరించడం’ అనే భావం ఇస్తుంది; రాజ్యాన్ని వ్యక్తికి తిరిగి ఇవ్వడం అనే సందర్భంలో ‘తిరిగి అప్పగిస్తారు’ సహజం.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వంశస్థులు
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సామూహిక-జాతీయ ప్రయోగాన్ని పదశః కఠినత లేకుండా ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: אֵת מַמְלְכוּת אָבִי
  choice: నా తండ్రి రాజ్యాన్ని
  rationale: మూలంలోని సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో కచ్చితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మెఫీబోషెతు ఉద్దేశం గురించి సీబా నివేదించిన మాట
  choice: సీబా చేసిన ఆరోపణను సాధారణ నివేదిత వాక్యంగా అనువదించడం; దాని నిజత్వాన్ని అనువాదం ద్వారా సమర్థించకపోవడం
  alternative: ‘అతడు చెప్పుకున్నాడట’ లేదా ‘అని ఆరోపించాడు’ వంటి సందేహం కలిగించే అదనపు భాషను చేర్చడం
  rationale: హీబ్రూ ఈ వాక్యంలో సీబా చెప్పినదానిని మాత్రమే నివేదిస్తుంది. విస్తృత కథనం ఆధారంగా ఇక్కడే అనుమానాన్ని చేర్చడం వ్యాఖ్యానాత్మక నిర్ణయం అవుతుంది; పాఠకుడు సందర్భం ద్వారా దానిని అంచనా వేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే కథన శైలి. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేలా వాక్యక్రమాన్ని సర్దాం; మూలంలోని నివేదిత ఆరోపణపై అదనపు తీర్పు చేర్చలేదు.
