  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: te
  text: 'అతడు దూతకు ఇలా ఆజ్ఞాపించాడు: “యుద్ధానికి సంబంధించిన విషయాలన్నీ రాజుకు చెప్పడం ముగించినప్పుడు,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధ సమాచారమంతా రాజుకు చెప్పడం ముగించినప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה క్రియలో అధికారపూర్వకంగా ఆదేశించే భావం ఉంది; ‘ఆజ్ఞాపించాడు’ దానిని సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది.
- source_word: הַמַּלְאָךְ
  choice: దూతకు
  rationale: మూలపదం సందర్భానుసారం మానవ దూతను లేదా దేవదూతను సూచించగలదు; ఇక్కడ యుద్ధవార్తను తీసుకెళ్లే మానవ సందేశవాహకుడే ఉద్దేశం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ కథన సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తం చేశాం.
- source_word: כְּכַלּוֹתְךָ
  choice: ముగించినప్పుడు
  rationale: כְּ + క్రియార్థక నామరూపం కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది; తక్షణత్వాన్ని అదనంగా చేర్చకుండా ‘ముగించినప్పుడు’ దాని భావాన్ని ఇస్తుంది.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: యుద్ధానికి సంబంధించిన విషయాలన్నీ
  rationale: దీని అక్షరార్థం ‘యుద్ధపు మాటలు/విషయాలన్నీ’; సైనిక నివేదిక సందర్భంలో ‘విషయాలన్నీ’ సహజంగా ఉండి, పూర్తి సమాచార భావాన్ని నిలుపుతుంది.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: రాజుకు చెప్పడం
  rationale: అక్షరార్థంగా ‘రాజుతో మాట్లాడడం’; సందర్భంలో నివేదికను రాజుకు తెలియజేయడమే ఉద్దేశం కాబట్టి ‘రాజుకు చెప్పడం’ సహజమైన సమానార్థకం.
