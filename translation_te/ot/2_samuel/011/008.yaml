source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/א֣וּרִיָּ֔ה רֵ֥ד לְ/בֵיתְ/ךָ֖ וּ/רְחַ֣ץ רַגְלֶ֑י/ךָ וַ/יֵּצֵ֤א אֽוּרִיָּה֙ מִ/בֵּ֣ית הַ/מֶּ֔לֶךְ וַ/תֵּצֵ֥א אַחֲרָ֖י/ו מַשְׂאַ֥ת הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: te
  text: అప్పుడు దావీదు ఊరియాతో, “నీ ఇంటికి దిగివెళ్లి, నీ కాళ్లు కడుక్కో[a]” అన్నాడు. ఊరియా రాజభవనం నుండి బయటికి వెళ్లాడు; రాజు కానుక ఒకటి అతని వెనుకగా వెళ్లింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ కాళ్లు కడుక్కో” అనేది అక్షరార్థమైన మాట. ప్రయాణం తర్వాత సేదతీరడం లేదా ఇంటికి వెళ్లి విశ్రాంతి తీసుకోవడం అనే భావాన్ని కూడా ఇది సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా “రాజు పంపిన వంతు.” ఇక్కడి హీబ్రూ పదం మోసుకెళ్లే లేదా పంపే వస్తువును సూచిస్తుంది; అది ఆహారపు వంతు లేదా కానుక కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵד
  choice: వెళ్లి
  rationale: మూలంలో ‘దిగివెళ్లు’ అనే దిశాసూచక భావం ఉంది. అయితే రాజభవనం నుండి ఇంటికి వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా చెప్పడానికి ‘వెళ్లి’ ఎంచుకున్నాం; దిశను ప్రత్యేకంగా చెప్పడం సందర్భానికి అవసరం లేదు.
- source_word: לְבֵיתְךָ
  choice: నీ ఇంటికి
  rationale: בַּיִת యొక్క ప్రత్యక్ష అర్థమైన ‘ఇల్లు’ను సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: నీ కాళ్లు కడుక్కో
  rationale: మూలంలోని స్పష్టమైన శరీరచర్యను యథాతథంగా ఉంచుతూ, దాని వెనుక ఉన్న విశ్రాంతి లేదా ఇంట్లో స్థిరపడే సూచనను పాదటిప్పణిలో తెలిపాం.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: రాజభవనం నుండి
  rationale: అక్షరార్థంగా ‘రాజు ఇంటి నుండి.’ సందర్భంలో అది రాజు నివాసమైన భవనాన్ని సూచిస్తుంది; ‘రాజభవనం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: రాజు పంపిన కానుక
  rationale: מַשְׂאֵת మోసుకెళ్లే లేదా పంపే భాగం, వంతు, బహుమతి అనే అర్థాలను కలిగి ఉంటుంది. ఈ కథన సందర్భంలో రాజు ఊరియా వెనుక పంపించిన వస్తువును ‘కానుక’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אַחֲרָיו
  choice: అతని వెనుక
  rationale: ఊరియాను అనుసరిస్తూ పంపబడినదనే క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
