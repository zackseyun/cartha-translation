translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని స్పష్టమైన చర్యను నిలిపి, మַשְׂאֵת పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం. అందించిన ఇంగ్లీషు పాఠ్యంలో పాదటిప్పణి సూచికలు విషయాలతో తారుమారైనట్లు కనిపించడంతో, తెలుగులో [a]ను ‘కాళ్లు కడుక్కో’ వద్ద, [b]ను ‘కానుక’ వద్ద సరియైన విధంగా ఉంచాం.
