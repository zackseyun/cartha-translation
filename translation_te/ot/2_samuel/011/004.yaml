revisions:
- from: కాబట్టి దావీదు దూతలను పంపి ఆమెను తీసుకురప్పించాడు.[a] ఆమె అతని దగ్గరికి వచ్చింది; అతడు ఆమెతో శయనించాడు. అప్పుడు ఆమె తన అపవిత్రత నుంచి శుద్ధి చేసుకుంటూ ఉంది. తరువాత ఆమె తన ఇంటికి తిరిగి వెళ్లింది.
  to: దావీదు దూతలను పంపి ఆమెను తీసుకురప్పించాడు.[a] ఆమె అతని దగ్గరికి వచ్చింది, అతడు ఆమెతో శయనించాడు. ఆమె తన అపవిత్రత నుండి శుద్ధి చేసుకుంటూ ఉంది.[b] తరువాత ఆమె తన ఇంటికి తిరిగి వెళ్లింది.
  rationale: సవరణ హెబ్రీయ కథన క్రమాన్ని మరియు నేపథ్య కృదంత ఉపవాక్యపు పాత్రను కాపాడుతుంది. ‘తీసుకురప్పించాడు’ దూతలను పంపిన సందర్భానికి సహజమైన తెలుగు రూపం అయినప్పటికీ, మరింత పదశః ప్రత్యామ్నాయాన్ని ప్రత్యేక పాదటిప్పణిలో ఉంచాం. శుద్ధి వాక్యానికి ప్రత్యామ్నాయ కాలవ్యాఖ్యను దాని సొంత లంగరుతో ఇచ్చాం; ఇది బత్షెబ నైతిక బాధ్యత లేదా సమ్మతి గురించి పాఠం చెప్పనిదాన్ని జోడించదు.
