id: 2SA.11.4
reference: 2 Samuel 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: te
  text: దావీదు దూతలను పంపి ఆమెను తీసుకురప్పించాడు.[a] ఆమె అతని దగ్గరికి వచ్చింది, అతడు ఆమెతో శయనించాడు. ఆమె తన అపవిత్రత నుండి శుద్ధి చేసుకుంటూ ఉంది.[b] తరువాత ఆమె తన ఇంటికి తిరిగి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను తీసుకున్నాడు.” హెబ్రీయ క్రియకు పదశః ఈ అర్థం ఉంది; ఈ సందర్భంలో దూతల ద్వారా ఆమెను తీసుకురావడాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆమె అప్పటికే తన అపవిత్రత నుండి శుద్ధి చేసుకుంది.” హెబ్రీయ కృదంతాన్ని గతంలో పూర్తయిన ఆచార శుద్ధి గురించిన నేపథ్య సూచనగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שלח అనే సాధారణ కథన క్రియను సహజమైన తెలుగు క్రమంలో ‘పంపి’ అని అనువదించాం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ మַלְאָכִים అంటే సందేశం లేదా ఆజ్ఞ మోసుకెళ్లే మానవ దూతలు; వారి అధికారిక పాత్రను అతిగా నిర్దేశించకుండా ‘దూతలు’ మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּקָּחֶהָ
  choice: ఆమెను తీసుకురప్పించాడు
  rationale: לקח యొక్క మూలభావం ‘తీసుకోవడం’; సందర్భంలో దావీదు పంపిన దూతల ద్వారా ఆమెను తన దగ్గరికి రప్పించాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూనే, చర్యకు దావీదే కర్త అనే అంశాన్ని నిలుపుతుంది.
- source_word: וַתָּבֹוא אֵלָיו
  choice: ఆమె అతని దగ్గరికి వచ్చింది
  rationale: చలనక్రియను, אֵלָיו అనే సంబంధాన్ని సూటిగా అందిస్తుంది; మూలంలో లేని అదనపు శృంగార సూచనను చేర్చదు.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: అతడు ఆమెతో శయనించాడు
  rationale: లైంగిక సంబంధాన్ని సూచించే హెబ్రీయ బైబిలు నుడికారానికి ‘శయనించాడు’ గౌరవప్రదమైన, సాహిత్యపరమైన సమానార్థకం.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: అప్పుడు ఆమె తన అపవిత్రత నుంచి శుద్ధి చేసుకుంటూ ఉంది
  rationale: התפעל రూపంలోని קדשׁ ఇక్కడ నైతిక పరిశుద్ధీకరణకంటే ఆచారపరమైన శుద్ధిని సూచిస్తుంది. ‘అపవిత్రత’ טֻמְאָה యొక్క ఆచారపరమైన వర్గాన్ని నిలుపుతుంది; వర్తమాన కృదంత భావాన్ని ‘చేసుకుంటూ ఉంది’ ప్రతిబింబిస్తుంది.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: తరువాత ఆమె తన ఇంటికి తిరిగి వెళ్లింది
  rationale: కథన క్రమాన్ని సహజ తెలుగులో తెలియజేస్తూ, בית యొక్క సందర్భోచిత అర్థాన్ని ‘ఇల్లు’గా అందిస్తుంది.
theological_decisions:
- issue: ఆచార శుద్ధి వాక్యభాగం యొక్క కాలభావం, కథనపాత్ర
  choice: ఆమె తన అపవిత్రత నుంచి శుద్ధి చేసుకుంటూ ఉందని నేపథ్య సూచనగా అనువదించడం
  alternative: ‘ఆమె తన అపవిత్రత నుంచి శుద్ధి చేసుకుంది’ లేదా ‘శుద్ధి చేసుకొని ఉంది’ అని ముందే పూర్తయిన చర్యగా అనువదించడం
  rationale: హెబ్రీయ కృదంత వాక్యభాగం కొనసాగుతున్న లేదా నేపథ్య పరిస్థితిని సహజంగా సూచించగలదు; అదే సమయంలో ముందే పూర్తయిన శుద్ధిగా గ్రహించే అవకాశం కూడా ఉంది. ప్రధాన పాఠంలో కృదంత భావాన్ని ఉంచి, ప్రత్యామ్నాయ కాలవ్యాఖ్యను పాదటిప్పణిలో తెలియజేశాం. ఇది లేవీయ ఆచారశుద్ధి సందర్భాన్ని సూచిస్తుంది గాని బత్షెబ యొక్క నైతిక బాధ్యతపై పాఠం చెప్పనిదాన్ని జోడించదు.
- issue: וַיִּקָּחֶהָ లో చర్య యొక్క స్వరూపం
  choice: ‘ఆమెను తీసుకురప్పించాడు’ అని దావీదు ఆదేశంతో జరిగిన చర్యగా చూపించడం
  alternative: ‘ఆమెను తీసుకున్నాడు’ అని మరింత పదశః అనువదించడం
  rationale: దూతలను పంపిన వెంటనే వచ్చే క్రియ కావడంతో, తెలుగులో ‘తీసుకురప్పించాడు’ కథన చర్యను స్పష్టంగా అందిస్తుంది. అయితే సమ్మతి లేదా బలవంతం గురించి మూలపాఠం ఈ క్రియలో స్పష్టంగా తీర్పు చెప్పదు; అనువాదం కూడా దానిని అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన ప్రవాహాన్ని, గౌరవప్రదమైన బైబిలు శైలిని కలిపాం. ‘శయనించాడు,’ ‘అపవిత్రత,’ ‘శుద్ధి’ వంటి పదాలు లైంగిక మరియు ఆచారపరమైన భావాలను అసభ్యంగా గానీ, మతశాఖాపరంగా అతివ్యాఖ్యానిస్తూ గానీ కాకుండా వ్యక్తం చేస్తాయి.
