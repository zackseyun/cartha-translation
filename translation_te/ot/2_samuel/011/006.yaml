  yaml_path: translation/ot/2_samuel/011/006.yaml
  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: te
  text: అప్పుడు దావీదు యోవాబుకు కబురు పంపి, “హిత్తీయుడైన ఊరియాను నా దగ్గరికి పంపు” అన్నాడు. యోవాబు ఊరియాను దావీదు దగ్గరికి పంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: దావీదు యోవాబుకు కబురు పంపి
  rationale: שׁלח అనే క్రియకు ప్రాథమిక అర్థం ‘పంపు’. ఇక్కడ పంపబడిన వస్తువు స్పష్టంగా చెప్పబడక, వెంటనే ఆజ్ఞ ఉటంకించబడినందున, తెలుగులో సహజంగా ‘కబురు పంపి’ అని అనువదించాం.
- source_word: שְׁלַח אֵלַי
  choice: నా దగ్గరికి పంపు
  rationale: ఆజ్ఞార్థక క్రియ యొక్క సూటితనాన్ని నిలుపుతూ, אֵלַי అనే ‘నా వైపుకు/నా వద్దకు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘తిరిగి’ అనే భావాన్ని చేర్చలేదు.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: హిత్తీయుడైన ఊరియాను
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికకు ప్రత్యేక అనువాదం అవసరం లేదు. הַחִתִּי జాతి గుర్తింపును ‘హిత్తీయుడు’గా, పేరును ‘ఊరియా’గా లిప్యంతరీకరించాం.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: యోవాబు ఊరియాను దావీదు దగ్గరికి పంపాడు
  rationale: కథన క్రమంలో పునరావృతమైన שׁלח క్రియను ‘పంపాడు’గా నిలిపి, אֶל యొక్క దిశార్థాన్ని సహజమైన తెలుగులో ‘దగ్గరికి’గా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కబురు పంపి’ అనేది మొదటి క్రియలో అంతర్నిహితమైన సందేశ పంపకాన్ని స్పష్టం చేస్తుంది; రెండో క్రియలో వ్యక్తినే పంపడం వల్ల ‘పంపాడు’ అని ఉంచాం.
