  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ אֶל יוֹאָ֔ב שְׁלַ֣ח אֵלַ֔/י אֶת אֽוּרִיָּ֖ה הַ/חִתִּ֑י וַ/יִּשְׁלַ֥ח יוֹאָ֛ב אֶת אֽוּרִיָּ֖ה אֶל דָּוִֽד־־־־׃
