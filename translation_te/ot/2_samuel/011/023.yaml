source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מַּלְאָךְ֙ אֶל דָּוִ֔ד כִּֽי גָבְר֤וּ עָלֵ֨י/נוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּצְא֥וּ אֵלֵ֖י/נוּ הַ/שָּׂדֶ֑ה וַ/נִּהְיֶ֥ה עֲלֵי/הֶ֖ם עַד פֶּ֥תַח הַ/שָּֽׁעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: te
  text: 'ఆ దూత దావీదుతో ఇలా చెప్పాడు: “ఆ మనుషులు మనకంటే బలంగా ఉన్నారు; వారు మనపైకి మైదానంలోకి వచ్చారు. అయితే మేము వారిని ద్వారం దగ్గర వరకు వెనక్కు నెట్టాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ సైనిక కథన సందర్భంలో ఇది దేవదూతను కాకుండా మానవ వార్తాహరుణ్ని సూచిస్తుంది; తెలుగులో ‘దూత’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: כִּי
  choice: 'ఇలా చెప్పాడు:'
  rationale: ఇక్కడ כִּי నివేదికలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష వాక్యానికి ముందు ‘ఇలా చెప్పాడు’ అని ఇవ్వడం సహజం.
- source_word: גָבְרוּ עָלֵינוּ
  choice: మనకంటే బలంగా నిలిచి
  rationale: גבר + עַל లోని ‘పైచేయి సాధించడం/బలవంతులుగా ఉండడం’ అనే భావాన్ని, తరువాతి యుద్ధచర్యతో అనుసంధానిస్తూ వ్యక్తపరుస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ మనుషులు
  rationale: హీబ్రూ సాధారణంగా ‘మనుషులు’ అంటుంది; సందర్భం వారిని శత్రు యోధులుగా స్పష్టం చేస్తున్నందున ‘సైనికులు’ అని అధికంగా నిర్దిష్టం చేయలేదు.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: మనకు ఎదురుగా మైదానంలోకి వచ్చారు
  rationale: పట్టణ రక్షకులు యుద్ధానికి బయటికి వచ్చిన భావాన్ని, אֵלֵינוּ లోని ప్రతికూల దిశను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: మేము వారిని ... వెనక్కు నెట్టాము
  rationale: అక్షరార్థంగా ‘మేము వారిమీద ఉన్నాము’; ఇక్కడ అది ఎదురు దాడి చేసి శత్రువును ద్వారం వరకు వెనక్కు నెట్టిన సైనిక భావాన్ని సూచిస్తుంది.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: పట్టణ ద్వారప్రవేశం వరకు
  rationale: פֶּתַח ‘ప్రవేశం/తెరువు’, שַׁעַר ‘ద్వారం’; ‘పట్టణ’ అనే పదం సందర్భంలో సూచితమైన నగర ద్వారాన్ని తెలుగులో స్పష్టం చేస్తుంది.
