translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. యుద్ధ నివేదికలోని వరుస చర్యలను స్పష్టంగా ఉంచుతూ, హీబ్రూ సైనిక ప్రయోగాన్ని అతి అక్షరార్థంగా కాకుండా సహజంగా అనువదించాం.
