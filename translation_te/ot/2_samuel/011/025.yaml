source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: te
  text: 'అప్పుడు దావీదు దూతతో ఇలా అన్నాడు: “నీవు యోవాబుతో ఇలా చెప్పాలి: ‘ఈ విషయం నీ దృష్టిలో చెడ్డదిగా ఉండనివ్వకు[a]. ఎందుకంటే ఖడ్గం ఒకరినీ మరొకరినీ మింగివేస్తుంది[b]. పట్టణంపై నీ దాడిని మరింత తీవ్రం చేసి, దాన్ని కూలదోయి.’ నీవు అతణ్ణి ధైర్యపరచు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయం నీకు అసంతృప్తి కలిగించనివ్వకు.” హెబ్రీలో అక్షరార్థంగా, “ఈ విషయం నీ కళ్లలో చెడ్డదిగా ఉండనివ్వకు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “ఎందుకంటే ఖడ్గం ఇలాంటివాణ్ణి, అలాంటివాణ్ణి మింగివేస్తుంది”; అంటే, అది ఒకరినీ మరొకరినీ తేడా లేకుండా చంపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అతణ్ణి బలపరచు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ కథన సందర్భంలో మానవ సందేశవాహకుణ్ణి సూచిస్తుంది; తెలుగు బైబిల్ వాడుకలో ‘దూత’ సహజంగా సరిపోతుంది.
- source_word: כֹּה תֹאמַר
  choice: నీవు ... ఇలా చెప్పాలి
  rationale: ఇతరునికి అందించవలసిన మాటను పరిచయం చేసే సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַל יֵרַע בְּעֵינֶיךָ
  choice: ఈ విషయం నీ దృష్టికి చెడ్డదిగా అనిపించనివ్వకు
  rationale: హెబ్రీ ‘నీ కళ్లలో చెడ్డదిగా ఉండకూడదు’ అనే రూపకాన్ని, దాని నైతిక ఛాయను పూర్తిగా తొలగించకుండా తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: ఖడ్గం ఒకరిని, మరొకరిని తేడా లేకుండా మింగివేస్తుంది
  rationale: ‘ఇలాంటివాణ్ణి, అలాంటివాణ్ణి’ అనే అస్పష్ట హెబ్రీ ప్రయోగం సందర్భంలో ఖడ్గం ఎవరినైనా చంపగలదనే భావాన్ని ఇస్తుంది; ‘మింగివేస్తుంది’ మూలంలోని తినడం అనే సజీవ రూపకాన్ని కాపాడుతుంది.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ
  choice: నీ యుద్ధాన్ని మరింత బలపరచి
  rationale: ‘నీ యుద్ధాన్ని బలపరచు’ అనే మూల నిర్మాణాన్ని నిలుపుతూ, పట్టణంపై దాడిని తీవ్రం చేయాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהָרְסָהּ
  choice: దాన్ని కూలదోయి
  rationale: ముట్టడిలో పట్టణాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే క్రియ యొక్క బలమైన భావాన్ని ఇస్తుంది.
- source_word: וְחַזְּקֵהוּ
  choice: అతణ్ణి ధైర్యపరచు
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సహజంగా యోవాబును సూచిస్తుంది; వ్యక్తిని ‘బలపరచడం’ ఇక్కడ ప్రోత్సహించడం లేదా ధైర్యపరచడం అనే భావంలో ఉంది.
theological_decisions:
- issue: దావీదు మాటల నైతిక స్వరూపం
  choice: ‘నీ దృష్టికి చెడ్డదిగా అనిపించనివ్వకు’ అనే నైతిక ఛాయగల మూలప్రయోగాన్ని నిలుపడం
  alternative: ‘దీనివల్ల బాధపడకు’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: దావీదు ఊరియా మరణాన్ని సాధారణ యుద్ధ పరిణామంగా చూపేందుకు ప్రయత్నిస్తున్న కథన ఉద్రిక్తతను అనువాదం మృదువుచేయకూడదు.
- issue: וְחַזְּקֵהוּ యొక్క సూచ్యుడు
  choice: ‘అతణ్ణి ధైర్యపరచు’—యోవాబును సూచిస్తున్నట్లు ప్రధాన పాఠంలో ఇవ్వడం
  alternative: ‘దాన్ని బలపరచు’ లేదా సూచ్యుణ్ణి నిర్ధారించకుండా ఉంచడం
  rationale: వ్యాకరణంలోని పుంలింగ ఏకవచనం యోవాబుకు సహజంగా సరిపోతుంది; అయినా ‘బలపరచు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఖడ్గం ... మింగివేస్తుంది’ అనే మూల రూపకం, ‘నీ దృష్టికి చెడ్డదిగా’ అనే నైతిక ఛాయ ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో సంబంధిత స్థానంలో ఉంది.
