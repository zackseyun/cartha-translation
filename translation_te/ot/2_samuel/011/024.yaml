base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/024.yaml
  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: te
  text: విలుకాండ్రు గోడమీద నుండి నీ సేవకులపై బాణాలు వేశారు; రాజు సేవకుల్లో కొందరు చనిపోయారు. నీ సేవకుడైన హిత్తీయుడు ఊరియా కూడా చనిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సేవకుడైన హిత్తీయుడు ఊరియా కూడా చనిపోయి ఉన్నాడు.” హీబ్రూ రూపం మరణించిన స్థితిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: విలుకాండ్రు ... బాణాలు వేశారు
  rationale: ירה అనే క్రియకూ הַמּוֹרִים అనే కర్తకూ ఉన్న సైనిక భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל עֲבָדֶיךָ
  choice: నీ సేవకులపై
  rationale: బాణాలు వేయడం అనే సందర్భంలో אֶל లక్ష్యాన్ని సూచిస్తుంది; రాజసభలోని గౌరవపూర్వక సంబోధనను ‘సేవకులు’ నిలుపుతుంది.
- source_word: מֵעַל הַחוֹמָה
  choice: గోడమీద నుండి
  rationale: గోడపై ఉన్న ఎత్తైన స్థానం నుండి బాణాలు వేసిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: రాజు సేవకుల్లో కొందరు చనిపోయారు
  rationale: מִן ఇక్కడ విభాగార్థకంగా ఉండి, రాజు సేవకులలో కొందరు మరణించారని సూచిస్తుంది.
- source_word: וְגַם
  choice: కూడా
  rationale: ఊరియా మరణాన్ని అదనపు, పరాకాష్ఠ సమాచారంగా తెలిపే యోజక భావాన్ని నిలుపుతుంది.
- source_word: עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: నీ సేవకుడైన హిత్తీయుడు ఊరియా
  rationale: గౌరవపూర్వక రాజసభ భాషను, జాతి గుర్తింపును నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: రూపపరంగా ‘చనిపోయి ఉన్నాడు/మృతుడయ్యాడు’ అనే స్థితి భావం సాధ్యమైనా, కథన నివేదికలో ‘చనిపోయాడు’ సహజంగా ఉండి ముందున్న మరణవార్తతో సరిపోతుంది.
