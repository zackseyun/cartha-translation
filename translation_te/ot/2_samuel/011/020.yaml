translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజును సూచించే సర్వనామానికి గౌరవార్థక ఏకవచనం, సైనికులను ఉద్దేశించిన మాటలో బహువచనం వాడబడ్డాయి. ఈ వచనంలోని షరతు 21వ వచనంలో పూర్తవుతుండటంతో చివర దీర్ఘరేఖ ఉంచబడింది.
