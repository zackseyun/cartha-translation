source:
  edition: WLC
  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: te
  text: రాజు కోపం రేగి, ఆయన నీతో, ‘పోరాడడానికి మీరు పట్టణానికి అంత దగ్గరగా ఎందుకు వెళ్లారు? ప్రాకారం మీద నుంచి వారు ఏమి ప్రయోగిస్తారో మీకు తెలియదా?[a]’ అని అడిగితే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాకారం మీద నుంచి వారు ఏమి విసురుతారో మీకు తెలియదా?” హీబ్రూ క్రియ సాధారణంగా బాణాలు వంటి ప్రక్షేపకాలను ప్రయోగించడాన్ని సూచిస్తుంది; సందర్భానుసారం విసరడమనే విస్తృత అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: అడిగితే—
  rationale: హీబ్రూ నిర్మాణం యోవాబు ఊహాత్మకంగా చెప్పిన షరతును పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘అడిగితే’ ఆ షరతును సహజంగా వ్యక్తం చేస్తుంది; వాక్యం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘరేఖ సూచిస్తుంది.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: రాజుకు కోపం రేగి
  rationale: חֵמָה యొక్క తీవ్రమైన కోప భావాన్ని, עלה సూచించే పైకెగసే భావాన్ని ‘కోపం రేగి’ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְאָמַר לְךָ
  choice: ఆయన నీతో ... అని అడిగితే
  rationale: షరతుతో కూడిన ఊహాత్మక సందర్భంలో రాజు దూతతో పలికే మాటలను తెలుగులో సహజంగా నేరవచనంగా అమర్చింది. ప్రశ్నలు కావడంతో ‘అడిగితే’ అనేది సందర్భోచితం.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: సాధారణ ప్రశ్నార్థక క్రియావిశేషణానికి సహజమైన సమానార్థకం.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: మీరు పట్టణానికి అంత దగ్గరగా ... వెళ్లారు
  rationale: נגשׁ అంటే సమీపించడం. సందర్భంలోని మందలింపు—ప్రాకారానికి ప్రమాదకరంగా దగ్గరవడం—తెలియజేయడానికి ‘అంత దగ్గరగా’ ఉపయోగించబడింది.
- source_word: לְהִלָּחֵם
  choice: పోరాడడానికి
  rationale: క్రియానామక రూపంలోని ఉద్దేశాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: మీకు తెలియదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే హీబ్రూ అలంకార ప్రశ్న యొక్క మందలింపు ధోరణిని నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: వారు బాణాలు వేస్తారని
  rationale: ירה హిఫిల్ రూపానికి ‘వేయడం/ప్రయోగించడం’ అనే సైనిక అర్థం ఉంది. ఈ ప్రాకార యుద్ధ సందర్భంలో లక్ష్యంగా ప్రయోగించే బాణాలు ఉద్దేశించబడి ఉండవచ్చు; అయితే హీబ్రూ పదం విస్తృతంగా ఇతర విసిరే ఆయుధాలనూ సూచించగలదు కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: מֵעַל הַחוֹמָה
  choice: ప్రాకారం మీద నుంచి
  rationale: מֵעַל లోని ‘పైనుంచి’ అనే స్థానిక భావాన్ని స్పష్టంగా నిలుపుతూ, కోటపట్టణ సందర్భంలో חוֹמָה ను ‘ప్రాకారం’గా అనువదించింది.
