  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: te
  text: అయితే ఊరియా రాజభవన ద్వారం దగ్గర తన ప్రభువైన రాజు సేవకులందరితో కలిసి రాత్రి గడిపాడు[a]; అతడు తన ఇంటికి దిగి వెళ్లలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పడుకున్నాడు’ లేదా ‘నిద్రించాడు.’ హీబ్రూ క్రియకు ఈ అర్థాలు ఉండవచ్చు; ఇక్కడ అతడు అక్కడ రాత్రి బస చేసినట్లు సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన ఇంటికి వెళ్లలేదు.’ అక్షరార్థంగా, ‘తన ఇంటికి దిగి వెళ్లలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: రాత్రి గడిపాడు
  rationale: שׁכב అనే క్రియకు ‘పడుకున్నాడు’ లేదా ‘నిద్రించాడు’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో ఊరియా అక్కడ రాత్రి బస చేశాడన్న కథనాంశాన్ని ‘రాత్రి గడిపాడు’ సహజంగా తెలియజేస్తుంది; క్రియ యొక్క భావపరిధిని పాదసూచికలో ఉంచాం.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: రాజభవన ద్వారం దగ్గర
  rationale: అక్షరార్థంగా ‘రాజు ఇంటి ప్రవేశం దగ్గర.’ సందర్భంలో అది రాజభవనాన్ని సూచిస్తుంది; ‘రాజభవన ద్వారం దగ్గర’ ఆధునిక తెలుగులో సహజంగా ఉండి స్థలసూచనను కాపాడుతుంది.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: తన యజమాని సేవకులందరితో కలిసి
  rationale: אֵת ఇక్కడ సహవాసం లేదా సమీపాన్ని సూచిస్తుంది. עבדיםకు ఈ రాజాస్థాన సందర్భంలో ‘సేవకులు,’ אֲדֹנָיוకు మానవ అధికారి అయిన దావీదును సూచించే ‘తన యజమాని’ స్పష్టమైన, సహజమైన ఎంపికలు.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: అతడు తన ఇంటికి దిగివెళ్లలేదు
  rationale: ירד యొక్క ‘దిగివెళ్లు’ అనే దిశాత్మక భావాన్ని నిలిపి, בֵּיתוֹను ‘తన ఇంటికి’ అని ప్రత్యక్షంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘రాజభవనం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘దిగివెళ్లలేదు’ మూలంలోని దిశాత్మక క్రియను నిలుపుతుంది. పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
