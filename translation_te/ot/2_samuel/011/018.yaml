translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పంపించి తెలియజేశాడు’ అనే నిర్మాణం మూలంలోని వరుస క్రియలను నిలుపుతూ, దూత ద్వారా నివేదిక పంపిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన వచనంలో చేర్చబడింది.
