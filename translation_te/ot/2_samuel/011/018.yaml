  yaml_path: translation/ot/2_samuel/011/018.yaml
  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: te
  text: అప్పుడు యోవాబు దావీదుకు యుద్ధానికి సంబంధించిన వార్తలన్నిటినీ పంపించి తెలియజేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుద్ధ విషయాలన్నిటినీ.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘యుద్ధపు మాటలన్నిటినీ’ అని ఉంది; ఇది పోరాటానికి సంబంధించిన వివరాలు లేదా నివేదికను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపించి
  rationale: שׁלח అనే క్రియకు ప్రాథమిక అర్థం ‘పంపడం.’ తరువాత వచ్చే ‘తెలియజేశాడు’ అనే నివేదన క్రియతో కలిసి, యోవాబు ఒక దూత ద్వారా సమాచారాన్ని పంపించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: తెలుగు బైబిల్ వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, నివేదించడం’ అని అర్థం. సందర్భంలో దావీదుకు యుద్ధ సమాచారాన్ని నివేదించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: לְ ఉపసర్గలోని గ్రహీత భావాన్ని తెలుగు సంప్రదాన విభక్తి ‘కు’తో వ్యక్తపరిచాం; వ్యక్తినామానికి స్థిరపడిన తెలుగు రూపాన్ని వాడాం.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: యుద్ధానికి సంబంధించిన వార్తలన్నిటినీ
  rationale: דִּבְרֵי అక్షరార్థంగా ‘మాటలు/విషయాలు’ అయినా, ఈ కథన సందర్భంలో పోరాటానికి సంబంధించిన వివరాలు లేదా నివేదికను సూచిస్తుంది. ‘వార్తలన్నిటినీ’ అనేది ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַמִּלְחָמָה
  choice: యుద్ధం
  rationale: מִלְחָמָה యుద్ధం లేదా పోరాటాన్ని సూచించగలదు. ఇక్కడ నిర్దిష్ట సైనిక చర్య గురించిన నివేదిక ఉన్నందున ‘యుద్ధం’ సహజమైన, విస్తృతంగా అర్థమయ్యే ఎంపిక.
