  source_fidelity: హీబ్రూ వచనంలోని వరుస క్రియలు—యోవాబు పంపడం మరియు దావీదుకు తెలియజేయడం—‘పంపించి తెలియజేశాడు’ ద్వారా సందర్భానుకూలంగా ప్రతిఫలించాయి. ‘యుద్ధానికి సంబంధించిన వార్తలన్నిటినీ’ అనేది כָּל־דִּבְרֵי הַמִּלְחָמָהకు సహజమైన, అర్థసమీపమైన అనువాదం.
