translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని వాడాం. ఆజ్ఞలలో బహువచన రూపాన్ని నిలిపి, హత్యా ఉద్దేశాన్ని మరుగుపరచకుండా మూలంలోని కారణ–ఫలిత క్రమాన్ని స్పష్టంగా తెలిపాం.
