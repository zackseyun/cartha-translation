  text: וַ/יִּכְתֹּ֥ב בַּ/סֵּ֖פֶר לֵ/אמֹ֑ר הָב֣וּ אֶת אֽוּרִיָּ֗ה אֶל מוּל֙ פְּנֵ֤י הַ/מִּלְחָמָה֙ הַֽ/חֲזָקָ֔ה וְ/שַׁבְתֶּ֥ם מֵ/אַחֲרָ֖י/ו וְ/נִכָּ֥ה וָ/מֵֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: te
  text: 'అతడు ఉత్తరంలో ఇలా రాశాడు: “ఊరియాను అత్యంత భీకరమైన పోరాటం ముందువరుసలో[a] ఉంచండి. తరువాత అతని వెనుక నుంచి వెనక్కి తగ్గండి; అతడు దెబ్బతిని చనిపోయేలా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పోరాటం అత్యంత తీవ్రంగా జరిగే చోట.”
    reason: మూలంలోని సైనిక పదబంధాన్ని ముందువరుసను నొక్కిచెప్పే విధంగానూ, పోరాట తీవ్రత గల ప్రదేశాన్ని నొక్కిచెప్పే విధంగానూ సహజంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיִּכְתֹּב בַּסֵּפֶר לֵאמֹר
  choice: అతడు ఉత్తరంలో ఇలా రాశాడు
  rationale: సందర్భంలో סֵפֶר అనేది దావీదు పంపిన లిఖిత సందేశం కాబట్టి ‘ఉత్తరం’ సహజమైన అర్థం. לֵאמֹר ను తెలుగులో సహజమైన ఉల్లేఖన పరిచయమైన ‘ఇలా’తో వ్యక్తం చేశాం.
- source_word: הָבוּ אֶת אוּרִיָּה
  choice: ఊరియాను ... ఉంచండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని ‘ఉంచండి’గా అనువదించి, యుద్ధస్థానంలో నియమించాలనే భావాన్ని నిలిపాం.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: యుద్ధం అత్యంత తీవ్రంగా జరిగే ముందువరుసలో
  rationale: מוּל פְּנֵי ముందుభాగంలో నేరుగా శత్రువుకు ఎదురుగా ఉండడాన్ని, הַמִּלְחָמָה הַחֲזָקָה తీవ్రమైన పోరాటాన్ని సూచిస్తాయి. ఈ రూపం సైనిక సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: అతని వెనుకనుండి వెనక్కి తగ్గండి
  rationale: שׁוּב ఇక్కడ తిరిగి రావడం కంటే యుద్ధంలో వెనక్కి తగ్గడాన్ని సూచిస్తుంది; מֵאַחֲרָיו లోని వ్యూహాత్మకంగా అతణ్ణి ఒంటరిగా విడిచిపెట్టే భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: וְנִכָּה וָמֵת
  choice: అతడు దెబ్బతిని చనిపోతాడు
  rationale: נכה నిఫాల్ రూపంలోని ‘దెబ్బతినడం/కొట్టబడడం’ భావాన్ని ఉంచి, וָמֵת అనే వేరైన మరణ క్రియను కూడా తొలగించకుండా అనువదించాం.
