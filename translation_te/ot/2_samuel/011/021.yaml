translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. మూలపాఠంలో ప్రత్యక్షంగా లేని వక్తను స్పష్టపరచే పదాలను వీలైనంత తగ్గిస్తూ, తెలుగు సంభాషణ ప్రవాహం కోసం ‘అని రాజు అడిగితే’ చేర్చబడింది; మొత్తం వాక్యం యోవాబు దూతకు ముందుగా చెప్పిన సూచనలో భాగమని చివరి ఉద్ధరణ గుర్తు సూచిస్తుంది.
