  source_fidelity: 'మూల హీబ్రూ భావాన్ని ముసాయిదా ప్రధానంగా సరిగ్గా అందిస్తుంది: అబీమెలెకు పేరు, యెరుబ్బెషెతు రూపం, స్త్రీ విసిరిన తిరుగలి రాయి, తేబేసులో మరణం, గోడను సమీపించినందుకు ప్రశ్న, ఊరియా మరణవార్త అన్నీ నిలిచాయి. అయితే ఉద్ధరణ గుర్తుల నిర్మాణం అస్పష్టంగా ఉంది; అలాగే యెరుబ్బెషెతు/యెరుబ్బయలు పాఠభేద-సంబంధిత గమనికకు పేరువద్ద ప్రత్యేక అంకరం అవసరం.'
