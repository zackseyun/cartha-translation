  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: te
  text: “యెరుబ్బెషెతు[a] కుమారుడైన అబీమెలెకును ఎవరు చంపారు? ఒక స్త్రీ గోడ మీద నుంచి తిరుగలి పైరాతి ముక్కను[b] అతనిమీద విసరడంతో, అతడు తేబేసులో చనిపోలేదా?[c] మీరు గోడ దగ్గరికి ఎందుకు వెళ్లారు?” అని రాజు అడిగితే, అప్పుడు నీవు, “నీ సేవకుడైన హిత్తీయుడైన ఊరియా కూడా చనిపోయాడు” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పాఠంలో “యెరుబ్బెషెతు” అని ఉంది; న్యాయాధిపతులు 9:1లో “యెరుబ్బయలు” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పదబంధాన్ని “తిరుగలి రాతి ముక్క” అని కూడా అనువదించవచ్చు; అది బహుశా తిరుగలి పైరాతిలోని ఒక భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ప్రస్తావించిన సంఘటన కోసం న్యాయాధిపతులు 9:53 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: చంపారు
  rationale: నכה ప్రాథమికంగా ‘కొట్టు’ అని అర్థమైనా, ఇక్కడ ఆ దెబ్బ మరణానికి దారితీసినందున సహజమైన తెలుగులో ‘చంపారు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲבִימֶלֶךְ בֶּן־יְרֻבֶּשֶׁת
  choice: యెరుబ్బెషెతు కుమారుడైన అబీమెలెకు
  rationale: మసొరా పాఠంలోని యెరుబ్బెషెతు రూపాన్ని న్యాయాధిపతులు 9లోని యెరుబ్బయలుతో సమన్వయపరచకుండా యథాతథంగా ఉంచింది.
- source_word: הֲלוֹא
  choice: చనిపోలేదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే ప్రతికూల అలంకారప్రశ్న బలాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: פֶּלַח רֶכֶב
  choice: తిరుగలి పైరాతి ముక్క
  rationale: פֶּלַח ‘ముక్క/భాగం’ అనే భావాన్ని, רֶכֶב తిరుగలి పైరాతిని సూచించే అవకాశాన్ని రెండింటినీ నిలుపుతుంది; కేవలం ‘పైరాయి’ అని చెప్పి మూలంలోని భాగార్థాన్ని తొలగించదు.
- source_word: מֵעַל הַחוֹמָה
  choice: గోడ మీద నుంచి
  rationale: ఎత్తైన గోడపై నుంచి కిందికి విసిరిన దిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּמָת בְּתֵבֵץ
  choice: అతడు తేబేసులో చనిపోయాడు
  rationale: వావ్ వరుసలోని సంఘటన ఫలితాన్ని తెలిపి, స్థలనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל־הַחוֹמָה
  choice: మీరు గోడ దగ్గరికి ఎందుకు వెళ్లారు?
  rationale: נגשׁ యొక్క ‘సమీపించు’ భావాన్ని సైనిక సందర్భంలో సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְאָמַרְתָּ
  choice: అప్పుడు నువ్వు ... అని చెప్పాలి
  rationale: దూతకు ఇచ్చిన తదుపరి సూచనగా ఉన్న క్రమాన్ని స్పష్టంగా చూపుతుంది.
- source_word: גַּם
  choice: కూడా
  rationale: ఇతర మృతులతో పాటు ఊరియా అదనంగా చనిపోయాడనే సంకలన భావాన్ని కాపాడుతుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: రాజును ఉద్దేశించిన విధేయతా సంబోధనకు సరిపోతుంది; అవసరం లేని బానిసత్వ నుడికారాన్ని రుద్దదు.
