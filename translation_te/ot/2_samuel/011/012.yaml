source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה שֵׁ֥ב בָּ/זֶ֛ה גַּם הַ/יּ֖וֹם וּ/מָחָ֣ר אֲשַׁלְּחֶ֑/ךָּ וַ/יֵּ֨שֶׁב אוּרִיָּ֧ה בִ/ירוּשָׁלִַ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא וּ/מִֽ/מָּחֳרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: te
  text: అప్పుడు దావీదు ఊరియాతో, “నేడు కూడా ఇక్కడే ఉండు; రేపు నేను నిన్ను పంపిస్తాను” అన్నాడు. కాబట్టి ఊరియా ఆ రోజూ, మరుసటి రోజూ యెరూషలేములోనే ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: שֵׁב בָּזֶה
  choice: ఇక్కడే ఉండు
  rationale: ఈ సందర్భంలో ישׁב కూర్చోవడం కాదు, కొంతకాలం అదే చోట ఉండడం అనే అర్థం ఇస్తుంది; ‘ఇక్కడే ఉండు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַּם הַיּוֹם
  choice: నేడు కూడా
  rationale: גַּם లోని ‘కూడా’ అనే అదనపు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: రేపు నేను నిన్ను పంపిస్తాను
  rationale: שׁלח యొక్క సాధారణ అర్థమైన ‘పంపు’ను నిలుపుతూ, దావీదు ఊరియాను అక్కడి నుంచి వెళ్లనిస్తానని చెప్పిన భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: וַיֵּשֶׁב
  choice: కాబట్టి ... ఉన్నాడు
  rationale: దావీదు మాటకు ప్రతిస్పందనగా ఊరియా అక్కడే మిగిలాడనే కథన సంబంధాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; తెలుగులో అనవసర పునరుక్తిని నివారించేందుకు ‘ఉన్నాడు’ వాడబడింది.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: ఆ రోజూ, మరుసటి రోజూ
  rationale: రెండు రోజుల కాలవ్యాప్తిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; מִמָּחֳרָת ను ‘మరుసటి రోజు’గా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వ్యక్తులు, స్థలనామాలు సంప్రదాయ తెలుగు రూపాల్లో ‘దావీదు,’ ‘ఊరియా,’ ‘యెరూషలేము’గా ఇవ్వబడ్డాయి. ఈ వచనంలో వివరణ అవసరమైన తాత్త్విక పదం లేదా నిజమైన పాఠ్య సందిగ్ధత లేనందున పాదటిప్పణి చేర్చలేదు.
