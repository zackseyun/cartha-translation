translation:
  language: te
  text: ఆ స్త్రీ గర్భవతి అయింది. ఆమె దావీదుకు సందేశం పంపి, “నేను గర్భవతిని” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతి అయింది
  rationale: הרה అనే క్రియ గర్భం ధరించడం లేదా గర్భవతి కావడం అనే సంఘటనను సూచిస్తుంది. ఆధునిక తెలుగులో ‘గర్భవతి అయింది’ సహజంగా ఉండి మూలంలోని సంఘటనాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: אִשָּׁה సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అని అర్థమవుతుంది. ఈ వాక్యంలో వివాహ సంబంధాన్ని ప్రత్యేకంగా ముందుకు తేవడం లేదు; ముందుగా ప్రస్తావించిన బత్షెబను సూచిస్తున్నందున ‘ఆ స్త్రీ’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: וַתִּשְׁלַח
  choice: వర్తమానం పంపి
  rationale: שׁלח అక్షరార్థంగా ‘పంపింది’; తరువాత వచ్చే ‘తెలియజేసింది’ అనే క్రియతో కలిపి ఇక్కడ సందేశం పంపించిందనే భావం ఉంది. ‘వర్తమానం పంపి’ ఆ అంతర్భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתַּגֵּד
  choice: తెలియజేసింది
  rationale: נגד హిఫిల్ రూపం చెప్పడం, నివేదించడం, తెలియజేయడం అనే అర్థాలను కలిగి ఉంది. దావీదుకు పంపిన సమాచారాన్ని సూచించడానికి ‘తెలియజేసింది’ సహజంగా సరిపోతుంది.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: דָוִד అనే వ్యక్తి పేరుకు ప్రామాణిక తెలుగు రూపం ‘దావీదు’; לְ ఉపసర్గను సంప్రదానార్థక ‘కు’తో వ్యక్తం చేశాం.
- source_word: הָרָה אָנֹכִי
  choice: నేను గర్భవతిని
  rationale: הָרָה అనే విధేయ విశేషణం, אָנֹכִי అనే సర్వనామంతో కలిసి ప్రస్తుతం ఉన్న స్థితిని తెలియజేస్తుంది. ‘నేను గర్భవతిని’ ఆధునిక తెలుగులో సహజమైన, నేరమైన అనువాదం.
