translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హెబ్రీ వాక్యంలోని సంక్షిప్తతను నిలుపుతూ, וַתִּשְׁלַח וַתַּגֵּד అనే వరుస క్రియలను తెలుగులో ‘వర్తమానం పంపి … తెలియజేసింది’గా సహజంగా కలిపాం.
