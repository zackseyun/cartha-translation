  yaml_path: translation/ot/2_samuel/011/007.yaml
  text: When Uriah came to him[a], David asked about Joab's welfare, the welfare of the troops, and the welfare of the war.
translation:
  language: te
  text: ఊరియా దావీదు వద్దకు వచ్చినప్పుడు, దావీదు యోవాబు క్షేమం గురించి, సైనికుల క్షేమం గురించి, యుద్ధ పరిస్థితి గురించి అడిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “దావీదు యోవాబు క్షేమం గురించి, ప్రజల క్షేమం గురించి, యుద్ధ క్షేమం గురించి అడిగాడు.”'
    reason: మూలంలోని לִשְׁלוֹם పదబంధం మూడుసార్లు సమాంతరంగా రావడాన్ని చూపించడానికి; ప్రధాన పాఠ్యంలో సహజమైన తెలుగుకోసం చివరిదాన్ని ‘యుద్ధ పరిస్థితి’గా ఇచ్చాం.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే క్రియకు ఇక్కడ ‘వచ్చాడు’ అనే సహజ అర్థం ఉంది; వరుస కథనాన్ని తెలుగులో సునిశితంగా కలపడానికి కాలసూచక ఉపవాక్యంగా అనువదించాం.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: אֶל ప్రత్యయం దావీదు వైపు ఊరియా వచ్చిన దిశను సూచిస్తుంది; ‘అతని దగ్గరకు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיִּשְׁאַל
  choice: అడిగాడు
  rationale: שׁאל ఇక్కడ యుద్ధరంగ పరిస్థితులను విచారించడాన్ని సూచిస్తుంది; ‘అడిగాడు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: לִשְׁלוֹם
  choice: క్షేమం గురించి / పరిస్థితి గురించి
  rationale: שָׁלוֹם ఈ నిర్మాణంలో క్షేమం, స్థితి లేదా పరిస్థితిని సూచిస్తుంది. వ్యక్తులకు ‘క్షేమం’, యుద్ధానికి సహజమైన తెలుగులో ‘పరిస్థితి’ వాడి మూలంలోని మూడు సమాంతర విచారణలను నిలిపాం.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: הָעָם
  choice: సైనికులు
  rationale: עָם సాధారణంగా ‘ప్రజలు’ అయినా, ఈ సైనిక సందర్భంలో యోవాబుతో ఉన్న పోరాట దళాన్ని సూచిస్తుంది; ‘సైనికులు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּלְחָמָה
  choice: యుద్ధ పరిస్థితి
  rationale: מִלְחָמָה యుద్ధం లేదా పోరాటాన్ని సూచిస్తుంది. ‘యుద్ధ క్షేమం’ తెలుగు భాషలో అసహజం కావడంతో, శాలోమ్ నిర్మాణ భావాన్ని ‘యుద్ధ పరిస్థితి’గా వ్యక్తపరిచాం.
