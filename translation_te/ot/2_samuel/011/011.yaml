source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: te
  text: ఊరియా దావీదుతో, “మందసం, ఇశ్రాయేలు ప్రజలు, యూదా ప్రజలు తాత్కాలిక ఆశ్రయాల్లో[a] ఉంటున్నారు. నా యజమాని యోవాబు, నా యజమాని సేవకులు ఆరుబయట మైదానంలో మకాం వేసి ఉన్నారు. అలాంటప్పుడు నేను తినడానికి, తాగడానికి, నా భార్యతో పడుకోవడానికి నా ఇంటికి వెళ్లనా?[b] నీ జీవం తోడు, నీ ప్రాణం తోడు—నేను ఈ పని ఎంతమాత్రం చేయను!”[c] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదానికి అక్షరార్థం ‘పందిళ్లు’ లేదా ‘తాత్కాలిక గుడిసెలు’; యుద్ధక్షేత్రంలో ఏర్పాటు చేసుకున్న తాత్కాలిక నివాసాలను ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ వాక్యం ‘నేను నా ఇంటికి వెళ్లనా?’ అనే అలంకారప్రశ్న; తాను అలా చేయబోనని ఊరియా దీనితో గట్టిగా చెబుతున్నాడు.
    reason: alternative_reading
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, ‘నీ జీవం తోడు, నీ ప్రాణం తోడు, నేను ఈ పని చేస్తే…’ అని ఉంది. ఇది శాపభాగాన్ని పలకకుండా విడిచిపెట్టే ప్రమాణ సూత్రం; ఇక్కడ ‘నేను ఎంతమాత్రం చేయను’ అనే బలమైన నిరాకరణను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: హెబ్రీ పాఠంలో నిర్దిష్ట ఉపపదంతో ‘మందసం’ అని మాత్రమే ఉంది. ‘దేవుని మందసం’ లేదా ‘నిబంధన మందసం’ అని పాఠంలో లేని వివరణను చేర్చకుండా, సందర్భంలో తెలిసిన పవిత్ర మందసాన్ని సూచించే సంప్రదాయబద్ధమైన పదాన్ని నిలుపుతుంది.
- source_word: יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు ప్రజలు, యూదా ప్రజలు
  rationale: దేశాల పేర్లు ఇక్కడ వారి సైనిక సమూహాలను సూచిస్తాయి. తెలుగులో సహజంగా అర్థమయ్యేలా ‘ప్రజలు’ చేర్చబడింది; ‘సైన్యాలు’ అని మార్చి మూలపాఠం కంటే భావాన్ని మరీ నిర్దిష్టం చేయలేదు.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: తాత్కాలిక ఆశ్రయాల్లో ఉంటున్నారు
  rationale: סֻכּוֹת అనేది తాత్కాలిక పందిళ్లు లేదా గుడిసెలను సూచిస్తుంది. యుద్ధక్షేత్రంలో తాత్కాలిక నివాసం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇది యోవాబును గౌరవంగా సూచించే మానవ బిరుదు; దైవ నామం కాదు. ‘నా యజమాని’ సామాజిక సంబంధాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: עַל פְּנֵי הַשָּׂדֶה חֹנִים
  choice: ఆరుబయట మైదానంలో మకాం వేసి ఉన్నారు
  rationale: ‘మైదానం ముఖంపై’ అనే హెబ్రీ నుడికారం బహిరంగ ప్రదేశంలో శిబిరం వేసి ఉండటాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ బహిరంగతను, కొనసాగుతున్న మకాంను రెండింటినీ తెలుపుతుంది.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: అలాంటప్పుడు నేను … నా ఇంటికి వెళ్లనా?
  rationale: రూపపరంగా ఇది ప్రథమ పురుష అసంపూర్ణ క్రియ అయినప్పటికీ, సందర్భంలో ఊరియా నిరాకరణను తెలిపే అలంకారప్రశ్న. ‘అలాంటప్పుడు’ ముందున్న పరిస్థితులతో దాని తార్కిక సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: తినడానికి, తాగడానికి, నా భార్యతో పడుకోవడానికి
  rationale: మూలంలోని వరుస క్రియలను నిలుపుతూ, లైంగిక భావాన్ని మర్యాదపూర్వకంగా తెలిపే హెబ్రీ సభ్యోక్తిని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: నీ జీవం తోడు, నీ ప్రాణం తోడు
  rationale: సంబోధితుని జీవాన్ని, ప్రాణాన్ని రెండుసార్లు ఉటంకించే గంభీర ప్రమాణ సూత్రాన్ని కుదించకుండా నిలుపుతుంది.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: నేను ఈ పని ఎంతమాత్రం చేయను
  rationale: ప్రమాణ సూత్రం తరువాత אִם అపూర్ణ ప్రమాణ వాక్యంలో బలమైన నిరాకరణగా పనిచేస్తుంది. తెలుగులో తప్పుదారి పట్టించే షరతు వాక్యంగా కాకుండా దాని ఉద్దేశిత నిరాకరణను స్పష్టంగా చెప్పింది.
theological_decisions:
- issue: మందసం యొక్క పూర్తి బిరుదు
  choice: మూలంలోని సంక్షిప్త ‘మందసం’నే ఉంచడం
  alternative: ‘దేవుని మందసం’ లేదా ‘నిబంధన మందసం’
  rationale: సందర్భంలో ఆ గుర్తింపు సాధ్యమైనప్పటికీ, ఈ వచనం ఆ విస్తృత బిరుదును పలకదు; అందువల్ల పాఠానికి మించిన దైవశాస్త్రీయ వివరణను ప్రధాన వచనంలో చేర్చలేదు.
- issue: ప్రమాణంలోని అపూర్ణ షరతు వాక్యం
  choice: బలమైన నిరాకరణగా అనువదించి, హెబ్రీ రూపాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘నేను ఈ పని చేస్తే…’ అని అపూర్ణంగానే ఉంచడం
  rationale: హెబ్రీ ప్రమాణ సంప్రదాయంలో దాచివేయబడిన శాపభాగం వల్ల ‘అలా చేయను’ అనే అర్థం వస్తుంది. ప్రధాన వచనం ఉద్దేశిత అర్థాన్ని తెలుపుతుంది; పాదసూచిక అసలు నిర్మాణంలోని ఉద్రిక్తతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఊరియా మాటలోని నైతిక ఆవేశాన్ని అలంకారప్రశ్న, ద్విగుణ ప్రమాణం ద్వారా నిలుపుతూ, అనవసరమైన సైనిక లేదా మతపరమైన విస్తరణలను నివారించింది.
