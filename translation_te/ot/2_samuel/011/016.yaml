translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి ఉపయోగించబడింది. సైనిక సందర్భం స్పష్టంగా ఉండేలా పదాలు ఎంచుకున్నప్పటికీ, మూలంలో లేని ఉద్దేశాన్ని లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
