id: 2SA.11.16
reference: 2 Samuel 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י בִּ/שְׁמ֥וֹר יוֹאָ֖ב אֶל הָ/עִ֑יר וַ/יִּתֵּן֙ אֶת א֣וּרִיָּ֔ה אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יָדַ֔ע כִּ֥י אַנְשֵׁי חַ֖יִל שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/016.yaml
  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: te
  text: యోవాబు పట్టణాన్ని గమనిస్తూ ఉండగా, పరాక్రమవంతులైన యోధులు ఉన్నారని అతనికి తెలిసిన చోట ఊరియాను ఉంచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁמֹר
  choice: గమనిస్తూ ఉన్నప్పుడు
  rationale: שׁמר అనే క్రియకు בְּ జతకావడం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. ముట్టడి సందర్భంలో ఇది పట్టణంపై నిఘా ఉంచడం లేదా దాని కదలికలను గమనించడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֶל הָעִיר
  choice: పట్టణాన్ని
  rationale: ఇక్కడ אֶל అనేది గమనింపు దేనిపై కేంద్రీకృతమైందో సూచిస్తుంది. సహజమైన తెలుగులో కర్మవిభక్తితో ‘పట్టణాన్ని గమనిస్తూ’ అని చెప్పడం స్పష్టంగా ఉంటుంది.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: ఊరియాను ... నియమించాడు
  rationale: נתן మౌలికంగా ‘పెట్టాడు/ఉంచాడు’ అని అర్థమైనా, సైనిక సందర్భంలో ఒక నిర్దిష్ట స్థానం వద్ద సైనికుణ్ణి ఉద్దేశపూర్వకంగా నిలబెట్టడాన్ని ‘నియమించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַמָּקוֹם
  choice: ఆ చోట
  rationale: מקום అంటే ‘చోటు/స్థలం.’ ఇక్కడ ముందుగా తెలిసిన వ్యూహాత్మక ప్రదేశాన్ని సూచిస్తున్నందున ‘ఆ చోట’ సహజమైనది.
- source_word: יָדַע
  choice: అతనికి తెలుసు
  rationale: ידע అనే సాధారణ క్రియ యొక్క ‘తెలుసు’ అనే అర్థాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: אַנְשֵׁי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ పదబంధం బలమైన, సమర్థులైన లేదా భీకరమైన పోరాట యోధులను సూచిస్తుంది. ‘పరాక్రమవంతులైన యోధులు’ మార్షల్ భావాన్ని స్పష్టంగా ఇస్తూ, దావీదు ప్రత్యేక వీరదళాన్ని సూచించే సాంకేతిక బిరుదుగా వినిపించకుండా ఉంటుంది.
- source_word: שָׁם
  choice: ఎక్కడ ఉన్నారో
  rationale: שָׁם లోని స్థానార్థం తెలుగులో ‘ఎక్కడ ఉన్నారో’ అనే నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: וַיְהִי
  choice: '... ఉన్నప్పుడు'
  rationale: హీబ్రూ కథనంలోని తదుపరి సంఘటనను కాలసంబంధంగా పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకుండా కాలసూచక నిర్మాణంతో సహజంగా అందించవచ్చు.
