base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: te
  text: దావీదు ఊరియాను పిలిచాడు[a]. అతడు దావీదు సమక్షంలో తిని తాగాడు; దావీదు అతణ్ణి మత్తెక్కించాడు. సాయంకాలం ఊరియా తన యజమాని సేవకులతో కలిసి తన పడక మీద పడుకోవడానికి బయటికి వెళ్లాడు. అయితే అతడు తన ఇంటికి దిగివెళ్లలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు ఊరియాను తన దగ్గరకు పిలిచాడు”; సందర్భాన్ని బట్టి, “అతణ్ణి ఆహ్వానించాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో, “తన ఇంటికి దిగివెళ్లలేదు.” ‘ఇంటికి వెళ్లలేదు’ అని సరళీకరించకుండా, సందర్భంలో పదేపదే వచ్చే దిశార్థక క్రియను ఇక్కడ నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: దావీదు ఊరియాను పిలిపించాడు
  rationale: קרא + לְ వ్యక్తిని తన దగ్గరకు పిలవడం లేదా రప్పించడం అనే భావం ఇస్తుంది. భోజనానికి ఆహ్వానించాడు అని సందర్భం సూచించినా, మూలంలోని విస్తృత భావాన్ని నిలుపుకోవడానికి ‘పిలిపించాడు’ ఎంచుకున్నాం.
- source_word: לְפָנָיו
  choice: దావీదు సమక్షంలో
  rationale: అక్షరార్థంగా ‘అతని ఎదుట’; తెలుగులో ‘సమక్షంలో’ సహజంగా ఉండి, ఊరియా దావీదు సన్నిధిలో తిని తాగాడనే సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: దావీదు అతణ్ణి మత్తెక్కించాడు
  rationale: שׁכר హిఫీల్ రూపం కారణార్థకం; ఊరియా మత్తులోకి రావడానికి దావీదే కారణమయ్యాడనే ఉద్దేశపూర్వక చర్యను ఇది నిలుపుతుంది.
- source_word: בָּעֶרֶב
  choice: సాయంకాలం
  rationale: కథనంలోని తదుపరి దశను సూచించే సహజమైన ఆధునిక తెలుగు కాలవాచకం.
- source_word: לִשְׁכַּב
  choice: పడుకోవడానికి
  rationale: మూల క్రియ ‘పడుకోవడం’ అని సూచిస్తుంది; ‘నిద్రపోవడానికి’ అనడం నిజంగా నిద్రపోయాడని అవసరానికి మించి నిర్ధారిస్తుంది.
- source_word: בְּמִשְׁכָּבוֹ
  choice: తన పడక మీద
  rationale: מִשְׁכָּב ఇక్కడ పడక లేదా పడుకునే చోటును సూచిస్తుంది. ‘పడక మీద’ దృశ్యాన్ని సహజంగా, నిర్దిష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: తన యజమాని సేవకులతో కలిసి
  rationale: אֲדֹנָיו ఊరియా యజమానియైన దావీదును సూచిస్తుంది. ‘తన యజమాని’ అనే నిర్మాణం మూలంలోని మూడవ పురుష సంబంధాన్ని, కథన వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: అయితే అతడు తన ఇంటికి దిగివెళ్లలేదు
  rationale: ירד లోని దిశార్థమైన ‘దిగివెళ్లు’ను పరిసర వచనాలతో అనుసంధానం కోసం నిలిపాం. וְ సందర్భంలో వ్యతిరేక మలుపు చూపుతుంది కాబట్టి ‘అయితే’ వాడాం.
