source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: te
  text: సంవత్సరం మళ్లినప్పుడు[a], దూతలు బయలుదేరే కాలంలో[b], దావీదు యోవాబును, అతనితో కూడ తన సేవకులను, ఇశ్రాయేలీయులందరినీ పంపించాడు. వారు అమ్మోనీయులను తీవ్రంగా నాశనం చేసి, రబ్బాకు ముట్టడి వేశారు. కాని దావీదు యెరూషలేములోనే ఉండిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “సంవత్సరం తిరిగివచ్చే వేళ.” ఇది బహుశా వసంతకాల యుద్ధారంభాన్ని సూచిస్తుంది.'
    reason: cultural_note
  - marker: b
    text: ఇక్కడి హీబ్రూ పాఠం “దూతలు” అని ఉంది. అయితే సైనిక సందర్భం, 1 దినవృత్తాంతాలు 20:1లోని సమాంతర వాక్యం ఆధారంగా చాలామంది “రాజులు యుద్ధానికి బయలుదేరే కాలంలో” అని చదువుతారు.
    reason: textual_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: సంవత్సరం మళ్లినప్పుడు
  rationale: హీబ్రూ పదబంధంలోని సంవత్సరం ‘తిరగడం/మళ్లడం’ అనే రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది. సందర్భంలో ఇది బహుశా వసంతకాల యుద్ధారంభాన్ని సూచిస్తుంది; అయితే దానిని ప్రధాన పాఠ్యంలో స్పష్టీకరించకుండా పాదసూచికలో తెలిపాం.
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: దూతలు బయలుదేరే కాలంలో
  rationale: ఇచ్చిన WLC పాఠంలో అలెఫ్‌తో కూడిన מַלְאָכִים ఉంది; దాని సహజ అర్థం ‘దూతలు.’ సైనిక సందర్భం మరియు 1 దినవృత్తాంతాలు 20:1లోని సమాంతర పాఠం ఆధారంగా ‘రాజులు’ అనే పఠనం బలంగా ఉన్నప్పటికీ, మూలపాఠంలోని నిజమైన పాఠాంతర సమస్యను ప్రధాన పాఠ్యం, పాదసూచిక ద్వారా నిలిపాం.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: కథన సందర్భంలో שלח క్రియకు సహజమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: రాజసేవలో ఉన్న వారిని సూచించే విస్తృత పదార్థాన్ని నిలుపుతుంది; వారిని కేవలం సైనిక అధికారులుగా సంకుచితం చేయదు. ‘తన’ అనే రూపం సేవకులు దావీదుకు చెందినవారని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: హీబ్రూలోని ‘ఇశ్రాయేలు అంతా’ అనే సమష్టి ప్రయోగాన్ని సాధారణ పాఠకునికి సహజమైన తెలుగులో అందిస్తుంది; సందర్భంలో ఇది యుద్ధానికి వెళ్లిన జాతీయ సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: וַיַּשְׁחִתוּ אֶת בְּנֵי עַמּוֹן
  choice: వారు అమ్మోనీయులను చిత్తుచేసి
  rationale: שׁחת హిఫీల్ రూపంలోని విధ్వంసక సైనిక చర్యను తెలియజేస్తూ, తరువాత రబ్బాపై ముట్టడి కొనసాగుతున్నందున సంపూర్ణ జననాశనం జరిగిందనే అవసరంలేని భావాన్ని నివారిస్తుంది.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: రబ్బాకు ముట్టడి వేశారు
  rationale: צור על అనే సైనిక ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְדָוִד יוֹשֵׁב בִּירוּשָׁלִָם
  choice: కాని దావీదు యెరూషలేములోనే ఉండిపోయాడు
  rationale: יוֹשֵׁב అక్షరార్థంగా ‘కూర్చున్నాడు/నివసిస్తున్నాడు’; ఇక్కడ సైన్యం బయలుదేరగా దావీదు వెనుకనే ఉన్నాడనే కథన విరుద్ధతను ‘ఉండిపోయాడు’ సహజంగా వ్యక్తం చేస్తుంది. ‘కాని’ మరియు ‘లోనే’ ఆ విరుద్ధతను తెలుగులో స్పష్టం చేస్తాయి.
theological_decisions:
- issue: לְעֵת צֵאת הַמַּלְאֿכִים అనే యుద్ధకాల పదబంధపు పఠనం
  choice: దూతలు బయలుదేరే కాలంలో
  alternative: రాజులు యుద్ధానికి బయలుదేరే కాలంలో
  rationale: ఇచ్చిన హీబ్రూ పాఠం అలెఫ్‌తో ‘దూతలు’ అని చదువుతుంది. అయితే సైనిక సందర్భం, ప్రాచీన వసంతకాల యుద్ధాచారం, 1 దినవృత్తాంతాలు 20:1లోని సమాంతర వాక్యం ‘రాజులు’ అనే పఠనానికి బలమైన మద్దతు ఇస్తాయి. మూలపాఠాన్ని నిశ్శబ్దంగా సవరించకుండా, ప్రధాన పాఠ్యంలో WLC పఠనాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం; దీనివల్ల దావీదు రాజులు సాధారణంగా చేయవలసినదాన్ని చేయలేదనే కథన వ్యంగ్యార్థం కూడా పాఠకునికి అందుబాటులో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘యెరూషలేము,’ ‘అమ్మోనీయులు,’ ‘రబ్బా’ వంటి స్థిర బైబిలు నామరూపాలు వాడబడ్డాయి. మూలపాఠంలోని పాఠాంతర సమస్యను దాచకుండా, పాఠ్య ప్రవాహాన్ని భంగపరచని పాదసూచికతో వివరించాం.
