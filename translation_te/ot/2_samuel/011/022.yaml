revisions:
- from: అప్పుడు ఆ దూత వెళ్లి, దావీదు దగ్గరికి వచ్చి, యోవాబు తనను పంపి చెప్పమన్నదంతా[a] దావీదుకు తెలియజేశాడు.
  to: అప్పుడు ఆ దూత వెళ్లి, దావీదు దగ్గరికి వచ్చి, యోవాబు ఆ దూత ద్వారా పంపిన సంగతులన్నీ దావీదుకు తెలియజేశాడు.[a]
  rationale: The revision resolves the ambiguous Telugu reflexive pronoun by explicitly identifying the messenger and preserves the Hebrew’s totality (‘all’) and its implied communicative force. The footnote retains the more literal Hebrew wording and explains the contextual sense without making that expansion obligatory in the text.
