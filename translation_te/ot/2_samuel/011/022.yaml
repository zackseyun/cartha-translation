source:
  edition: WLC
  text: וַ/יֵּ֖לֶךְ הַ/מַּלְאָ֑ךְ וַ/יָּבֹא֙ וַ/יַּגֵּ֣ד לְ/דָוִ֔ד אֵ֛ת כָּל אֲשֶׁ֥ר שְׁלָח֖/וֹ יוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/022.yaml
  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: te
  text: అప్పుడు ఆ దూత వెళ్లి, దావీదు దగ్గరికి వచ్చి, యోవాబు ఆ దూత ద్వారా పంపిన సంగతులన్నీ దావీదుకు తెలియజేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యోవాబు అతనిని పంపినదంతా.” సందర్భంలో, యోవాబు దూత ద్వారా దావీదుకు తెలియజేయడానికి పంపిన సంగతులన్నీ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ఆ దూత
  rationale: ఇక్కడ మַלְאָךְ యోవాబు పంపిన మానవ సందేశవాహకుణ్ణి సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘దూత’ సహజంగా, సంక్షిప్తంగా ఉంటుంది; సందర్భం వల్ల దేవదూత అనే అర్థం రాదు.
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך యొక్క కథన క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియారూపంతో నిలుపుతుంది.
- source_word: וַיָּבֹא
  choice: దావీదు దగ్గరికి వచ్చి
  rationale: בוא అంటే ‘వచ్చు/చేరుకొను.’ గమ్యాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి వాక్యంలోని לְדָוִד‌తో కలిపి ‘దావీదు దగ్గరికి వచ్చి’ అని అనువదించబడింది.
- source_word: וַיַּגֵּד לְדָוִד
  choice: దావీదుకు తెలియజేశాడు
  rationale: Hiphil נגד అంటే చెప్పడం, నివేదించడం, తెలియజేయడం. అధికారిక సందేశాన్ని అందించే సందర్భంలో ‘తెలియజేశాడు’ సహజంగా సరిపోతుంది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: అంతా
  rationale: כָּל సూచించే సంపూర్ణతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: యోవాబు తనను పంపి చెప్పమన్నది
  rationale: హీబ్రూ అక్షరార్థంగా ‘యోవాబు అతణ్ణి పంపినది’ అని ఉంటుంది. సందర్భంలోని సమాచార ప్రసార భావాన్ని తెలుగులో పూర్తి, సహజ వాక్యంగా చేయడానికి ‘పంపి చెప్పమన్నది’ అని వ్యక్తం చేయబడింది; ఈ విస్తరణను పాదటిప్పణి సూచిస్తుంది.
