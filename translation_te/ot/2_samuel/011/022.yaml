    reason: lexical_alternative
  revision_rationale: The revision resolves the ambiguous Telugu reflexive pronoun by explicitly identifying the messenger and preserves the Hebrew’s totality (‘all’) and its implied communicative force. The footnote retains the more literal Hebrew wording and explains the contextual sense without making that expansion obligatory in the text.
