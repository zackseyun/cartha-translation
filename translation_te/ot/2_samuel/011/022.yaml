translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వరుస హీబ్రూ క్రియలను ‘వెళ్లి... వచ్చి... తెలియజేశాడు’ అనే తెలుగు క్రమంలో నిలిపి, సందేశ ఉద్దేశాన్ని పాఠ్యంలో స్పష్టంచేసి అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరచాం.
