source:
  edition: WLC
  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: te
  text: ఊరియా భార్య తన భర్త ఊరియా చనిపోయాడని విని, తన భర్త కోసం శోకించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע అనే క్రియకు ప్రాథమిక అర్థం ‘విను’. ఇక్కడ కథన సందర్భంలో ‘విన్నప్పుడు’ సహజంగా ఉండి, తరువాతి כִּי వాక్యాన్ని ఆమె విన్న సమాచారంగా చూపుతుంది.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: ఊరియా భార్య
  rationale: హీబ్రూ సమాసబంధాన్ని తెలుగులో సహజమైన నామవాచక క్రమంతో అందిస్తుంది; స్త్రీని ఈ సందర్భంలో మూలపాఠం పేర్కొన్న సంబంధం ద్వారానే గుర్తిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי ఆమె విన్న విషయాన్ని పరిచయం చేస్తుంది. తెలుగు పరోక్ష వాక్యంలో ‘అని’ దీనిని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడని
  rationale: מֵת ఊరియా మరణించిన స్థితిని తెలుపుతుంది. తెలుగులో ‘చనిపోయాడు’ సహజమైన కథన ప్రయోగం; ‘మరణించాడు’ కంటే సాధారణ పాఠకులకు మరింత సూటిగా ఉంటుంది.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: తన భర్త ఊరియా
  rationale: మూలంలోని పేరు మరియు వైవాహిక సంబంధం రెండింటినీ నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది. కర్తకే తిరిగి సూచన కావడంతో ‘తన’ అనేది ‘ఆమె’ కంటే స్పష్టమైనది.
- source_word: וַתִּסְפֹּד
  choice: దుఃఖించింది
  rationale: ספד మృతుని కోసం శోకించడం లేదా విలపించడం సూచిస్తుంది. ‘దుఃఖించింది’ విస్తృతంగా అర్థమయ్యే సహజ తెలుగు; ఆచారబద్ధమైన విలాపాన్ని తప్పనిసరిగా ఊహింపజేయదు.
- source_word: עַל
  choice: కోసం
  rationale: శోకాన్ని తెలిపే క్రియతో עַל ఎవరిని గూర్చి లేదా ఎవరి నిమిత్తం దుఃఖించారో సూచిస్తుంది; తెలుగులో ‘కోసం’ సహజంగా సరిపోతుంది.
- source_word: בַּעְלָהּ
  choice: తన భర్త
  rationale: వైవాహిక సందర్భంలో בַּעַל స్పష్టంగా ‘భర్త’ అని అర్థం. ‘యజమాని’ లేదా ‘ప్రభువు’ వంటి ఇతర అర్థాలను ఇక్కడ చేర్చడం సందర్భానికి అనవసరం.
