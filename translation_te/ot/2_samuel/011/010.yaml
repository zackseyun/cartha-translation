revisions:
- from: 'దావీదుకు ఇలా తెలియజేశారు: “ఊరియా తన ఇంటికి దిగివెళ్లలేదు[a].” అప్పుడు దావీదు ఊరియాతో, “నీవు ప్రయాణం చేసి వచ్చావు కదా[b]? నీ ఇంటికి ఎందుకు దిగివెళ్లలేదు?” అని అడిగాడు.'
  to: 'దావీదుకు ఇలా తెలియజేశారు: “ఊరియా తన ఇంటికి దిగివెళ్లలేదు[a].” అప్పుడు దావీదు ఊరియాతో ఇలా అన్నాడు: “నీవు ప్రయాణం నుండి వచ్చావు కదా[b]? నీ ఇంటికి ఎందుకు దిగివెళ్లలేదు?”'
  rationale: The revision preserves the Hebrew’s ‘from a journey’ construction more closely, avoids narrowing ‘said’ to ‘asked,’ and clarifies the literal-versus-explanatory distinction in the cultural footnote. It retains the original’s repeated ‘go down to ... house’ wording and rhetorical force.
