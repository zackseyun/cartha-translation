translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ירד యొక్క ‘దిగివెళ్లు’ అనే దృశ్యరూపాన్నీ, రెండు వాక్యాల్లోని పునరుక్తినీ ఉద్దేశపూర్వకంగా నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
