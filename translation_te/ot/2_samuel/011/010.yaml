  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר לֹֽא יָרַ֥ד אוּרִיָּ֖ה אֶל בֵּית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אוּרִיָּ֗ה הֲ/ל֤וֹא מִ/דֶּ֨רֶךְ֙ אַתָּ֣ה בָ֔א מַדּ֖וּעַ לֹֽא יָרַ֥דְתָּ אֶל בֵּיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: te
  text: 'దావీదుకు ఇలా తెలియజేశారు: “ఊరియా తన ఇంటికి దిగివెళ్లలేదు[a].” అప్పుడు దావీదు ఊరియాతో ఇలా అన్నాడు: “నీవు ప్రయాణం నుండి వచ్చావు కదా[b]? నీ ఇంటికి ఎందుకు దిగివెళ్లలేదు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన/నీ ఇంటికి దిగివెళ్లడం.” ఇది ఇంటికి వెళ్లడాన్ని సూచించే హెబ్రీయ ప్రయోగం; ఎత్తైన ప్రదేశం లేదా రాజప్రాసాద పరిసరాల నుంచి నివాసానికి వెళ్లడం ఇందులో ఉద్దేశమై ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, “దారి నుంచి వచ్చావు కదా?” హెబ్రీయ పదబంధం ప్రయాణం నుంచి రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: తెలియజేశారు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, నివేదించడం’ అనే అర్థాన్నిస్తుంది. సందర్భంలోని రాజుకు అందిన సమాచారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְדָוִד לֵאמֹר
  choice: దావీదుకు ఇలా
  rationale: లֵאמֹר ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ discourse marker. తెలుగులో ‘ఇలా’ మరియు ద్విబిందువు దాని పనిని సహజంగా నిర్వహిస్తాయి.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: ఊరియా తన ఇంటికి దిగివెళ్లలేదు
  rationale: ירד యొక్క అక్షరార్థమైన ‘దిగివెళ్లు’ను, అలాగే వచనంలోని ముఖ్యమైన పునరుక్తిని నిలుపుతుంది; ‘తన’ సహజ తెలుగులో కర్తను స్పష్టంగా సూచిస్తుంది.
- source_word: בֵּיתוֹ / בֵּיתֶךָ
  choice: తన ఇంటికి / నీ ఇంటికి
  rationale: בַּיִת ఇక్కడ భౌతిక నివాసాన్ని సూచిస్తుంది. ‘ఇల్లు’ భావాన్ని విభక్తితో సహజంగా అందిస్తూ రెండు చోట్ల ఒకే పదాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు దావీదు ... అని అడిగాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. మాట ప్రశ్నల రూపంలో ఉన్నందున తెలుగులో ‘అడిగాడు’ సహజం; ‘అప్పుడు’ క్రమాన్ని సూచిస్తుంది.
- source_word: הֲלוֹא
  choice: కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే ప్రతికూల ప్రశ్న యొక్క వాక్చాతుర్య బలాన్ని ఆధునిక తెలుగులో ‘కదా?’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִדֶּרֶךְ
  choice: ప్రయాణం చేసి
  rationale: דֶּרֶךְ అక్షరార్థంగా ‘దారి’ అయినప్పటికీ, ఈ ప్రయోగంలో ప్రయాణం నుంచి రావడాన్ని సూచిస్తుంది. ‘ప్రయాణం చేసి’ తెలుగులో స్పష్టమైన సహజ సమానార్థకం.
- source_word: בָא
  choice: వచ్చావు
  rationale: בוא అనే సాధారణ క్రియకు నేర సమానార్థకం. ‘తిరిగి వచ్చావు’ అని అనువదిస్తే మూలంలో లేని తిరుగు భావం మరింత స్పష్టంగా జోడించబడుతుంది.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే సాధారణ ప్రశ్నార్థక పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: నీ ఇంటికి ఎందుకు దిగివెళ్లలేదు
  rationale: ముందటి ‘తన ఇంటికి దిగివెళ్లలేదు’ అనే మాటను రెండవ పురుషంలో పునరావృతం చేసి, హెబ్రీయ కథనంలోని ఉద్రిక్తతను నిలుపుతుంది.
