  yaml_path: translation/ot/2_samuel/011/014.yaml
  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: te
  text: ఉదయం దావీదు యోవాబుకు ఒక ఉత్తరం రాసి, దాన్ని ఊరియా చేత పంపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: ఉదయం
  rationale: హీబ్రూ కథన క్రమాన్ని సూచించే וַיְהִיని తెలుగులో విడిగా అనువదిస్తే కృతకంగా ఉంటుంది; కాలసూచకమైన ‘ఉదయం’ సహజంగా తదుపరి సంఘటనను ప్రవేశపెడుతుంది.
- source_word: וַיִּכְתֹּב
  choice: రాసి
  rationale: ఇది రాయడాన్ని సూచించే సాధారణ కథన క్రియ. తరువాతి వరుస క్రియతో సహజ తెలుగు వాక్యంగా కలపడానికి ‘రాసి’ అని ఇచ్చాం.
- source_word: סֵפֶר
  choice: ఒక ఉత్తరం
  rationale: ఈ పదానికి విస్తృతంగా లిఖిత పత్రం అనే అర్థం ఉన్నా, దావీదు యోవాబుకు రాసి పంపిన సందర్భంలో ‘ఉత్తరం’ దాని సమాచార విధిని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל יוֹאָב
  choice: యోవాబుకు
  rationale: אֶל ఇక్కడ లిఖిత సందేశాన్ని అందుకొనే వ్యక్తిని సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజం.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: దావీదు ఆ ఉత్తరాన్ని ఊరియా ద్వారా చేరవేయించాడు అనే ప్రయోజక భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד אוּרִיָּה
  choice: ఊరియా చేత
  rationale: అక్షరార్థంగా ‘ఊరియా చేతి ద్వారా’; ఇది వ్యక్తి ద్వారా పంపడం లేదా అందజేయించడం అనే హీబ్రూ నుడికారము. ‘ఊరియా చేత’ తెలుగు వాడుకలో ఆ సాధనార్థాన్ని, అలాగే ఊరియానే ఉత్తరాన్ని మోసుకెళ్లాడనే వ్యంగ్యభరిత సందర్భాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, వరుస సంఘటనలను తెలుగు సహజ క్రియారూపాలతో తెలిపాం. ‘ఊరియా చేత’ అనే రూపం మూలంలోని నుడికారానికి దగ్గరగా ఉండి ఆధునిక పాఠకుడికి కూడా అర్థమవుతుంది.
