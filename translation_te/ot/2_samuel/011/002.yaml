source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/עֵ֣ת הָ/עֶ֗רֶב וַ/יָּ֨קָם דָּוִ֜ד מֵ/עַ֤ל מִשְׁכָּב/וֹ֙ וַ/יִּתְהַלֵּךְ֙ עַל גַּ֣ג בֵּית הַ/מֶּ֔לֶךְ וַ/יַּ֥רְא אִשָּׁ֛ה רֹחֶ֖צֶת מֵ/עַ֣ל הַ/גָּ֑ג וְ/הָ֣/אִשָּׁ֔ה טוֹבַ֥ת מַרְאֶ֖ה מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: te
  text: సాయంకాల వేళ[a] దావీదు తన పడకమీద నుంచి లేచి, రాజు ఇంటి[b] మేడపై నడిచాడు. మేడపై నుంచి స్నానం చేస్తున్న ఒక స్త్రీని చూశాడు; ఆ స్త్రీ చూడడానికి ఎంతో అందంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “సాయంకాల సమయానికి ఇలా జరిగింది.”
    reason: lexical_alternative
  - marker: b
    text: “రాజు ఇల్లు” అనే హీబ్రూ పదబంధాన్ని సందర్భానుసారంగా “రాజభవనం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: సాయంకాల వేళ
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని సహజమైన తెలుగు కాలసూచనగా అందిస్తుంది; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: కథనంలోని వరుస చర్యలకు సహజమైన తెలుగు క్రియారూపం.
- source_word: מֵעַל מִשְׁכָּבוֹ
  choice: తన పడకమీద నుంచి
  rationale: מִשְׁכָּב అనే పదంలోని పడుకునే స్థలం లేదా మంచం భావాన్ని సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּתְהַלֵּךְ
  choice: నడిచాడు
  rationale: హిత్పయేల్ రూపం సూచించగల అటూ ఇటూ నడకను అతిగా వ్యాఖ్యానించకుండా, తెలుగు కథనశైలిలో సహజంగా చెబుతుంది.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: రాజు ఇంటి మేడపై
  rationale: ‘రాజు ఇంటి మేడపై’ అనే మూలపాఠ రూపాన్ని కాపాడుతుంది; సందర్భోచితమైన ‘రాజభవనం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: స్నానం చేస్తున్న ఒక స్త్రీని చూశాడు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל הַגָּג
  choice: మేడపై నుంచి
  rationale: దావీదు ఆమెను చూసిన ప్రదేశాన్ని స్పష్టంగా తెలియజేస్తూ మూలంలోని స్థలవివరాన్ని నిలుపుతుంది.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: చూడడానికి ఎంతో అందంగా ఉంది
  rationale: మూలంలోని రూపం లేదా దృశ్యాకర్షణపై ఉన్న దృష్టిని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
