source:
  edition: WLC
  text: וַ/יַּעֲבֹ֣ר הָ/אֵ֗בֶל וַ/יִּשְׁלַ֨ח דָּוִ֜ד וַ/יַּאַסְפָ֤/הּ אֶל בֵּית/וֹ֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֥לֶד ל֖/וֹ בֵּ֑ן וַ/יֵּ֧רַע הַ/דָּבָ֛ר אֲשֶׁר עָשָׂ֥ה דָוִ֖ד בְּ/עֵינֵ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: te
  text: శోకకాలం ముగిసిన తరువాత, దావీదు పంపించి ఆమెను తన ఇంటికి తీసుకొచ్చాడు. ఆమె అతని భార్య అయింది, అతనికి ఒక కుమారుణ్ణి కనింది. అయితే దావీదు చేసిన కార్యం యాహ్వే దృష్టిలో చెడ్డది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే కళ్లలో చెడ్డది.” “యాహ్వే దృష్టిలో చెడ్డది” అనేది హీబ్రూ నుడికారాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ఇది దావీదు చేసిన కార్యంపై దేవుని నైతిక తీర్పును వ్యక్తం చేస్తుంది.
    reason: హీబ్రూ నుడికారం మరియు దాని నైతిక తీర్పు భావాన్ని వివరించడం
lexical_decisions:
- source_word: הָאֵבֶל
  choice: శోకకాలం
  rationale: ఊరియా మరణానంతరం పాటించిన సామాజిక ఆచారంతో కూడిన సంతాపకాలాన్ని సూచిస్తుంది; కేవలం అంతర్గత దుఃఖాన్ని కాకుండా కాలవ్యవధిని కూడా సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲבֹר
  choice: ముగిసిన తరువాత
  rationale: అక్షరార్థంగా ‘గడిచింది’; కాలాన్ని సూచించే కర్తతో ఆధునిక తెలుగులో ‘ముగిసిన తరువాత’ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: దావీదు మనుషులను పంపించి ఆమెను తన ఇంటికి రప్పించాడు
  rationale: హీబ్రూ క్రియల క్రమాన్ని నిలుపుతూ, దావీదు పంపించి ఆమెను తన గృహంలోకి చేర్చుకున్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. పంపబడినవారు పాఠ్యంలో ప్రత్యక్షంగా చెప్పబడకపోయినా, ‘పంపించాడు’ అనే క్రియకు తెలుగులో అవసరమైన భావపూరకంగా ‘మనుషులను’ వాడబడింది.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ఆమె అతనికి భార్య అయింది
  rationale: ఆమె స్థితిలో వచ్చిన మార్పును హీబ్రూ నిర్మాణానికి దగ్గరగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: అతనికి ఒక కుమారుణ్ణి కన్నది
  rationale: יַלד క్రియతో పరోక్ష కర్మను తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּרַע
  choice: చెడ్డది
  rationale: ఇది కేవలం అయిష్టతను కాక నైతిక దోషాన్ని సూచిస్తుంది; ‘చెడ్డది’ దైవిక నైతిక తీర్పు బలాన్ని తగ్గించదు.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: దావీదు చేసిన పని
  rationale: דָּבָר ఇక్కడ కార్యం లేదా వ్యవహారాన్ని సూచిస్తుంది; ‘చేసిన పని’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: ‘యాహ్వే కళ్లలో’ అనే అక్షర రూపంలోని మూల రూపక భావాన్ని ‘దృష్టిలో’ అనే సహజ తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దావీదు చర్యపై కథకుని నైతిక తీర్పు బలం
  choice: యాహ్వే దృష్టిలో చెడ్డది
  alternative: యాహ్వేకు అసంతృప్తి కలిగించింది
  rationale: וַיֵּרַע ఇక్కడ స్పష్టమైన నైతిక ప్రతికూలతను వ్యక్తం చేస్తుంది. ‘అసంతృప్తి కలిగించింది’ అనడం తీర్పును బలహీనపరచవచ్చు; ‘చెడ్డది’ మూలంలోని ఖండనను నిలుపుతుంది.
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం ద్వారా దాని ప్రత్యేకతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘శోకకాలం,’ ‘దృష్టిలో,’ ‘చెడ్డది’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలపాఠంలోని ఆచారపరమైన సందర్భం మరియు నైతిక బలాన్ని నిలుపుతాయి.
