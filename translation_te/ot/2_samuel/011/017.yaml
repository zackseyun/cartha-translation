  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י הָ/עִיר֙ וַ/יִּלָּחֲמ֣וּ אֶת יוֹאָ֔ב וַ/יִּפֹּ֥ל מִן הָ/עָ֖ם מֵ/עַבְדֵ֣י דָוִ֑ד וַ/יָּ֕מָת גַּ֖ם אוּרִיָּ֥ה הַ/חִתִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: te
  text: పట్టణంలోని పురుషులు బయటికి వచ్చి యోవాబుతో యుద్ధం చేశారు[a]. దావీదు సేవకుల్లో కొందరు పడిపోయారు[b]; హిత్తీయుడైన ఊరియా కూడా చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయటికి వెళ్లి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, ‘ప్రజల్లోనుండి, దావీదు సేవకుల్లోనుండి’; ఇది దావీదు సేవకుల్లో కొందరు పడిపోయారని తెలిపే భాగసూచక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయటికి వచ్చి
  rationale: יצא అంటే ‘బయటికి వెళ్లడం/రావడం.’ పట్టణపు పురుషులు యోవాబు సేనను ఎదుర్కొనేందుకు బయటికి వచ్చిన దృశ్యకోణానికి ‘బయటికి వచ్చి’ సహజంగా సరిపోతుంది; ‘బయటికి వెళ్లి’ కూడా సాధ్యమే.
- source_word: אַנְשֵׁי הָעִיר
  choice: పట్టణంలోని పురుషులు
  rationale: అక్షరార్థంగా ‘పట్టణపు పురుషులు.’ సందర్భంలో వీరు పురుష యోధులు కాబట్టి లింగసూచనను నిలిపి ఉంచింది.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: యోవాబుతో యుద్ధం చేశారు
  rationale: ఈ యుద్ధప్రయోగం యోవాబును, సందర్భానుసారం అతని సేనను, శత్రువుగా ఎదుర్కొనడాన్ని సూచిస్తుంది. తెలుగులో ‘తో యుద్ధం చేశారు’ సహజమైన విరోధార్థక ప్రయోగం.
- source_word: וַיִּפֹּל
  choice: పడిపోయారు
  rationale: యుద్ధంలో మరణించినవారిని సూచించే హీబ్రూ సైనిక నుడికారాన్ని ‘పడిపోయారు’గా నిలిపింది; వెంటనే ఊరియా మరణాన్ని చెప్పే సందర్భం దాని భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: దావీదు సేవకులైన ఆ సైన్యంలోని కొందరు
  rationale: 'రెండు מן పదబంధాలు భాగసూచకంగా ఉన్నాయి: దావీదు సేవకులుగా ఉన్న సమూహం నుంచి కొందరు. యుద్ధసందర్భంలో הָעָם ను ‘సైన్యం’గా ఇవ్వడం తెలుగులో స్పష్టంగా ఉంటుంది; ‘సేవకులు’ అనే రాజసేవా పదాన్ని నిలిపింది.'
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: హిత్తీయుడైన ఊరియా కూడా చనిపోయాడు
  rationale: גם లోని చేర్పు/ఉద్ఘాటన భావాన్ని ‘కూడా’ నిలుపుతుంది. ‘చనిపోయాడు’ వచనంలోని ప్రత్యక్ష మరణప్రకటనను సహజంగా అందిస్తుంది.
- source_word: הַחִתִּי
  choice: హిత్తీయుడు
  rationale: ఊరియా జాతి గుర్తింపును తెలిపే స్థిరమైన బైబిలు పేరు; తెలుగులో విశేషణ సంబంధాన్ని ‘హిత్తీయుడైన’గా సహజంగా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘పడిపోయారు’ అనే యుద్ధ నుడికారాన్ని, ‘సేవకులు’ అనే రాజసేవా పదాన్ని మూలానికి పారదర్శకంగా నిలిపి, భాగసూచక నిర్మాణాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తీర్చిదిద్దింది.
