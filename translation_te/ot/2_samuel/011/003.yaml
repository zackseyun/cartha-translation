  text: וַ/יִּשְׁלַ֣ח דָּוִ֔ד וַ/יִּדְרֹ֖שׁ לָֽ/אִשָּׁ֑ה וַ/יֹּ֗אמֶר הֲ/לוֹא זֹאת֙ בַּת שֶׁ֣בַע בַּת אֱלִיעָ֔ם אֵ֖שֶׁת אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: te
  text: అప్పుడు దావీదు పంపి, ఆ స్త్రీ గురించి విచారించాడు. ఒకడు, “ఈమె ఏలీయాము కుమార్తె, హిత్తీయుడైన ఊరియా భార్య బత్షెబా కాదా?” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד וַיִּדְרֹשׁ לָאִשָּׁה
  choice: దావీదు ఆ స్త్రీ గురించి తెలుసుకోవడానికి మనుషులను పంపాడు
  rationale: రెండు వరుస హీబ్రూ క్రియలను సహజమైన తెలుగులో ఉద్దేశ్య సంబంధంతో వ్యక్తం చేసింది; ‘పంపాడు’ అనే క్రియలో పంపబడినవారు అంతర్లీనంగా ఉన్నారు.
- source_word: וַיֹּאמֶר
  choice: ఒకడు ... అని చెప్పాడు
  rationale: హీబ్రూలో కర్త స్పష్టంగా పేర్కొనబడలేదు. దావీదే అన్నాడని సూచించకుండా, గుర్తుతెలియని ప్రతిస్పందకుడిని ‘ఒకడు’గా ఉంచింది.
- source_word: הֲלוֹא זֹאת
  choice: ఈమె ... కాదా?
  rationale: గుర్తింపును నిర్ధారించే హీబ్రూ ప్రశ్నార్థక నిర్మాణాన్ని సహజమైన తెలుగు ప్రతిప్రశ్నగా నిలిపింది.
- source_word: בַּת שֶׁבַע
  choice: బత్షెబ
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: הַחִתִּי
  choice: హిత్తీయుడైన
  rationale: ఊరియా జాతి గుర్తింపును సూచించే విశేషణాన్ని సహజ తెలుగు రూపంలో అనువదించింది.
theological_decisions:
- issue: וַיֹּאמֶר అనే ఏకవచన క్రియకు కర్త ఎవరు?
  choice: ఒకడు అన్నట్లు అనువదించడం
  alternative: దావీదు అన్నట్లు అనువదించడం
  rationale: సందర్భంలో దావీదు విచారణకు పంపిన తరువాత సమాధానం అందినట్లు భావించడం సహజం; అయినప్పటికీ మూలపాఠం కర్తను పేరుతో చెప్పదు. అందువల్ల దావీదును కర్తగా చేయకుండా మూలంలోని అనిశ్చితిని కాపాడింది.
- issue: స్త్రీ పరిచయంలో కుటుంబ, వివాహ సంబంధాల ప్రాధాన్యం
  choice: ఏలీయాము కుమార్తె, ఊరియా భార్య అనే రెండు గుర్తింపులనూ యథాతథంగా ఉంచడం
  alternative: పేరును మాత్రమే ప్రధానంగా చూపడం
  rationale: కథనంలో ఆమె ఇప్పటికే ఊరియా భార్య అని స్పష్టంగా తెలియజేసే నైతిక ఉద్రిక్తతను మూలపాఠం ఉద్దేశపూర్వకంగా ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన కథన శైలి. మూలంలోని కర్త అస్పష్టతను ‘ఒకడు’ ద్వారా కాపాడింది; అనవసరమైన సిద్ధాంత వివరణను చేర్చలేదు.
