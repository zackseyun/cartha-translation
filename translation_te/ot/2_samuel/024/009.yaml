  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל הַ/מֶּ֑לֶךְ וַ/תְּהִ֣י יִשְׂרָאֵ֡ל שְׁמֹנֶה֩ מֵא֨וֹת אֶ֤לֶף אִֽישׁ חַ֨יִל֙ שֹׁ֣לֵֽף חֶ֔רֶב וְ/אִ֣ישׁ יְהוּדָ֔ה חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: te
  text: యోవాబు ప్రజల లెక్కింపు మొత్తాన్ని రాజుకు అందజేశాడు. ఇశ్రాయేలులో కత్తి దూసే పరాక్రమవంతులైన పురుషులు ఎనిమిది లక్షల మంది[a]; యూదా పురుషులు ఐదు లక్షల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 21:5లోని సమాంతర వాక్యం వేరే మొత్తాలను ఇస్తుంది—ఇశ్రాయేలుకు 11 లక్షలు, యూదాకు 4 లక్షల 70 వేలు. ఇక్కడ సంఖ్యలను సమన్వయపరచకుండా, 2 సమూయేలులోని హెబ్రీ పాఠాన్నే అనుసరించాం.
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: ప్రజల జనగణన సంఖ్య
  rationale: ‘సంఖ్య’ మరియు ‘లెక్కింపు/జనగణన’ అనే మూలపాఠంలోని నిర్మాణాన్ని నిలుపుతూ, ఈ అధ్యాయంలోని ప్రజలను లెక్కించే సందర్భాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ... ఉన్నారు
  rationale: సామూహిక నామమైన ‘ఇశ్రాయేలు’కు సంబంధించిన మొత్తం సంఖ్యను తెలుగులో సహజంగా పరిచయం చేస్తుంది; హెబ్రీ వాక్యంలోని ఫలితార్థాన్ని కాపాడుతుంది.
- source_word: שְׁמֹנֶה מֵאוֹת אֶלֶף
  choice: ఎనిమిది లక్షల మంది
  rationale: హెబ్రీ సంఖ్య 800,000ను భారతీయ సంఖ్యా పద్ధతిలో సహజంగా, ఖచ్చితంగా అందిస్తుంది.
- source_word: אִישׁ חַיִל
  choice: పరాక్రమవంతులైన పురుషులు
  rationale: חַיִל లోని బలం, యుద్ధసామర్థ్యం, పరాక్రమం అనే భావాలను సైనిక జనగణన సందర్భంలో నిలుపుతుంది.
- source_word: שֹׁלֵף חֶרֶב
  choice: కత్తి దూసే
  rationale: ‘కత్తిని ఒరనుండి తీసే’ అనే సజీవ సైనిక చిత్రాన్ని నిలుపుతుంది; కేవలం ‘ఆయుధధారులు’ అని భావానువాదం చేయకుండా మూలంలోని concrete idiomను ప్రతిబింబిస్తుంది.
- source_word: וְאִישׁ יְהוּדָה
  choice: యూదా పురుషులు
  rationale: ఏకవచన రూపంలో ఉన్న אִישׁ ఇక్కడ సమూహార్థకంగా వాడబడింది; తెలుగు బహువచనం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: ఐదు లక్షల మంది
  rationale: 500,000 అనే సంఖ్యను ఖచ్చితంగా అందిస్తూ, ‘మంది’ ద్వారా మనుషుల లెక్క అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: 1 దినవృత్తాంతాలు 21:5లోని సమాంతర వాక్యంతో సంఖ్యల వ్యత్యాసం
  choice: '2 సమూయేలు మసొరెటిక్ హెబ్రీ పాఠంలోని సంఖ్యలనే అనువదించడం: ఇశ్రాయేలు ఎనిమిది లక్షలు; యూదా ఐదు లక్షలు.'
  alternative: దినవృత్తాంతాల సంఖ్యలతో సమన్వయపరచడం, లేదా స్థిర సైన్యం/నిల్వ దళాల చేర్పు-మినహాయింపును ప్రధాన పాఠంలో ఊహించడం.
  rationale: అనువాదం మూలపాఠంలోని సంఖ్యలను మార్చకూడదు. వ్యత్యాసాన్ని పరిష్కరించే ఊహలను ప్రధాన వాక్యంలో ప్రవేశపెట్టకుండా, సమాంతర పాఠంలోని భిన్న సంఖ్యలను పాదటిప్పణిలో పారదర్శకంగా తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘తెలియజేశాడు’ తెలుగు వాడుకలో సహజంగా ఉన్నప్పటికీ, యోవాబు సంఖ్యను రాజుకు ఇచ్చాడనే మూలార్థాన్ని కాపాడుతుంది. సైనిక చిత్రాన్ని నిలుపుటకు ‘కత్తి దూసే’ ఉపయోగించబడింది; సంఖ్యలు తెలుగు పాఠకులకు సహజమైన లక్షల పద్ధతిలో ఇవ్వబడ్డాయి.
