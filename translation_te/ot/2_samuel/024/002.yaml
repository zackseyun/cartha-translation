source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: te
  text: 'అప్పుడు రాజు తనతో ఉన్న సైన్యాధిపతి యోవాబుతో ఇలా అన్నాడు: “ఇప్పుడు ఇశ్రాయేలు గోత్రాలన్నిటిలో, దాను నుండి బెయేరు-షెబా వరకు సంచరించి, ప్రజలను లెక్కించండి[a], తద్వారా నేను ప్రజల సంఖ్యను తెలుసుకోగలను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రజలను నమోదు చేయండి,” లేదా “సైనిక అవసరాల కోసం ప్రజలను నమోదు చేయండి.” హీబ్రూ క్రియ ప్రజలను లెక్కించడం లేదా నమోదు చేయడాన్ని సూచించవచ్చు; కొన్నిసార్లు దీనికి సైనిక సందర్భం ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో దావీదు పేరు కాకుండా బిరుదే ఉంది; అందువల్ల అదే నిలిపాం.
- source_word: שַׂר הַחַיִל
  choice: సైన్యాధిపతి
  rationale: שַׂר నాయకుడు లేదా అధికారి; חַיִל ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది. ‘సైన్యాధిపతి’ స్పష్టమైన, ప్రస్తుత తెలుగు పదం.
- source_word: אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న
  rationale: యోవాబు రాజుతో ఉన్నాడనే సంబంధవాచక ఉపవాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שׁוּט נָא
  choice: ఇప్పుడు ... తిరిగి
  rationale: שׁוּט ఒక ప్రాంతమంతా సంచరించడాన్ని సూచిస్తుంది; נָא ఆజ్ఞను కొంత మృదువుగా చేస్తుంది. రాజాజ్ఞ సందర్భంలో ‘ఇప్పుడు ... తిరిగి’ సహజంగా ఉంటుంది.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలో
  rationale: చలనాన్ని సూచించే క్రియతో కలిపి, అన్ని గోత్ర ప్రాంతాల గుండా తిరగాలనే భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: దాను నుండి బెయేరు-షెబా వరకు
  rationale: దేశపు ఉత్తర-దక్షిణ విస్తీర్ణమంతటినీ సూచించే భౌగోళిక జంటను పేర్లతోనే నిలిపాం.
- source_word: וּפִקְדוּ
  choice: లెక్కించండి
  rationale: פקד ఇక్కడ జనగణన లేదా నమోదును సూచిస్తుంది. బహువచన ఆజ్ఞారూపాన్ని గౌరవ సూచకంగా కాకుండా, యోవాబు ఆధ్వర్యంలోని కార్యబృందాన్ని ఉద్దేశించిన మూలరూపానికి అనుగుణంగా నిలిపాం; సైనిక నమోదు భావసంభావ్యతను పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֶת הָעָם
  choice: ప్రజలను
  rationale: עָם సాధారణంగా ‘ప్రజలు’ అని అర్థం; సైనిక సందర్భం ఉన్నప్పటికీ దానిని ‘యోధులు’గా సంకుచితం చేయలేదు.
- source_word: וְיָדַעְתִּי
  choice: అప్పుడు ... నేను తెలుసుకుంటాను
  rationale: హీబ్రూ సమన్వయ నిర్మాణాన్ని సహజ తెలుగులో ఫలిత భావంతో వ్యక్తం చేస్తుంది; ‘తెలుసుకోవడానికి’ అనే స్పష్టమైన ఉద్దేశ్యార్థమూ సందర్భంలో సాధ్యమే.
- source_word: מִסְפַּר הָעָם
  choice: ప్రజల సంఖ్య
  rationale: మూలంలోని నిర్మాణానికి స్పష్టమైన, సంక్షిప్త తెలుగు సమానం.
theological_decisions:
- issue: సైనిక-పరిపాలనా సందర్భంలో הָעָם పరిధి
  choice: ప్రజలు
  alternative: యుద్ధానికి తగిన పురుషులు / సైనికులు
  rationale: యోవాబు సైన్యాధిపతి కావడం, తరువాతి సందర్భంలో సైనిక సంఖ్యలు రావడం సైనిక భావాన్ని సూచించినా, ఈ వచనంలో వాడిన עָם విస్తృతమైన ‘ప్రజలు’ అనే పదం. మూలం కంటే పరిధిని సంకుచితం చేయలేదు.
- issue: וְיָדַעְתִּי యొక్క సంబంధం
  choice: అప్పుడు ... నేను తెలుసుకుంటాను
  alternative: నేను తెలుసుకోవడానికి
  rationale: రూపపరంగా ‘మరియు నేను తెలుసుకుంటాను’ అనే వరుస/ఫలిత భావం ఉంది; సందర్భంలో ఉద్దేశ్య భావమూ సాధ్యమే. ప్రధాన పాఠ్యంలో సహజమైన ఫలిత సంబంధాన్ని ఉంచి, ఉద్వేగాన్ని అనవసరంగా సిద్ధాంతీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథనశైలి వాడబడింది. స్థలనామాలు ‘దాను,’ ‘బెయేరు-షెబా’గా లిప్యంతరీకరించబడ్డాయి. మూలంలోని ‘ప్రజలు’ అనే విస్తృత పదాన్ని నిలిపి, సైనిక నమోదు నుడికారాన్ని పాదటిప్పణిలో సంరక్షించాం.
