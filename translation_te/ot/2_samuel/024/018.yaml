id: 2SA.24.18
reference: 2 Samuel 24:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֣אמֶר ל֗/וֹ עֲלֵה֙ הָקֵ֤ם לַֽ/יהוָה֙ מִזְבֵּ֔חַ בְּ/גֹ֖רֶן ארניה הַ/יְבֻסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: te
  text: ఆ రోజున గాదు దావీదు వద్దకు వచ్చి అతనితో, “పైకి వెళ్లి యెబూసీయుడైన అరౌనా కళ్లం మీద యాహ్వేకు బలిపీఠం నిలబెట్టు” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 21:18లో ఈ పేరు ‘ఒర్నాను’గా ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא యొక్క కథనరూపం ఇక్కడ గాదు దావీదు దగ్గరికి రావడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూలోని కాలనిర్దేశాన్ని సహజమైన ఆధునిక తెలుగులో యథాతథంగా నిలుపుతుంది.
- source_word: עֲלֵה
  choice: పైకి వెళ్లి
  rationale: עלה ఆజ్ఞారూపంలోని దిశాసూచక భావాన్ని ‘వెళ్లు’ మాత్రమే అనకుండా నిలుపుతుంది.
- source_word: הָקֵם
  choice: నిలబెట్టు
  rationale: קום హిఫిల్ రూపం ‘నిలిచేలా చేయు/ఏర్పాటు చేయు’ అనే భావం ఇస్తుంది; బలిపీఠం సందర్భంలో ‘నిలబెట్టు’ మూల క్రియకు దగ్గరగా ఉంది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే పీఠానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל సమర్పణ లేదా అంకిత దిశను సూచిస్తుంది; יהוה అనే వ్యక్తినామాన్ని తెలుగు బైబిల్ వాడుకలో పరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: בְּגֹרֶן
  choice: కళ్లం మీద
  rationale: గింజలను నూర్చి వేరు చేసే స్థలాన్ని ‘కళ్లం’ సహజంగా సూచిస్తుంది; అక్కడ బలిపీఠం నిలబెట్టడం వల్ల ב ను ‘మీద’గా అనువదించడం సందర్భోచితం.
- source_word: ארניה
  choice: అరౌనా
  rationale: సమూయేలు గ్రంథంలోని నామరూపాన్ని అనుసరిస్తుంది; దినవృత్తాంతాల్లోని ‘ఒర్నాను’ రూపాన్ని ఈ వచనంలో కలపదు.
- source_word: הַיְבֻסִי
  choice: యెబూసీయుడు
  rationale: అరౌనా జాతి గుర్తింపును తెలిపే హీబ్రూ విశేషణానికి సహజ తెలుగు రూపం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం ఉంది. దానిని ‘ప్రభువు’గా మార్చకుండా, ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపంతో నిలిపాం.
- issue: లַיהוָהలో ל యొక్క భావం
  choice: యెహోవాకు
  alternative: యెహోవా కోసం
  rationale: బలిపీఠం దేవునికి అంకితమవుతుందనే దిశ/సమర్పణ భావాన్ని ‘కు’ నేరుగా నిలుపుతుంది; ‘కోసం’ కూడా సాధ్యమే కాని ఉద్దేశ్యార్థాన్ని కొద్దిగా ఎక్కువగా ముందుకు తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవభరితమైన కథనశైలి వాడబడింది. ‘పైకి వెళ్లి’ మూలంలోని భౌగోళిక దిశను, ‘నిలబెట్టు’ క్రియ యొక్క causative భావాన్ని కాపాడుతాయి. పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
