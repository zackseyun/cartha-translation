  text: וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל דָּוִ֔ד יִקַּ֥ח וְ/יַ֛עַל אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב ב/עינ/ו רְאֵה֙ הַ/בָּקָ֣ר לָ/עֹלָ֔ה וְ/הַ/מֹּרִגִּ֛ים וּ/כְלֵ֥י הַ/בָּקָ֖ר לָ/עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: te
  text: అప్పుడు అరౌనా దావీదుతో, “నా ప్రభువైన రాజు తనకు మంచిదనిపించినదాన్ని తీసుకొని అర్పించవచ్చు.[a] ఇదిగో, దహనబలి కోసం ఎద్దులు ఉన్నాయి; ఇంధన కట్టెలుగా నూర్పిడి పలకలూ, ఎద్దుల సామగ్రিও ఉన్నాయి.[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని దృష్టిలో మంచిదైనదాన్ని.’ ఇది ‘తనకు మంచిదనిపించినదాన్ని’ అనే అర్థమిచ్చే హెబ్రీ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎద్దుల పరికరాలు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదబంధం విస్తృతమైనది; ఇంధన కట్టెలుగా ఉపయోగించగల ఎద్దుల చెక్క సామగ్రిని సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: తీసుకొని అర్పించవచ్చు
  rationale: ఈ సందర్భంలో అసంపూర్ణ క్రియారూపాలు గౌరవపూర్వకమైన అనుమతి లేదా ఆహ్వానాన్ని వ్యక్తం చేస్తున్నాయి. ‘అర్పించవచ్చు’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; עלה అనే బలిసంబంధ క్రియను ‘అర్పించు’గా అనువదించింది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: గౌరవసూచక సంబోధనను, రాజబిరుదును కలిపి చూపుతుంది; హెబ్రీలోని మర్యాదపూర్వక రాజాస్థాన శైలిని నిలుపుతుంది.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: తనకు మంచిదనిపించినదాన్ని
  rationale: హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానార్థక రూపం. రాజును నేరుగా సంబోధించిన తరువాత మూడవ పురుషంలో ప్రస్తావించే మూలంలోని మార్పును ‘తనకు’ నిలుపుతుంది.
- source_word: רְאֵה
  choice: ఇదిగో
  rationale: అరౌనా అందిస్తున్న వాటివైపు దృష్టి మళ్లించే సంభాషణ సూచికగా ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: నూర్పిడి పరికరాలతో పనిచేసే, బలికి తగిన లాగుడు పశువులను ఈ సందర్భంలో ‘ఎద్దులు’ స్పష్టంగా సూచిస్తుంది.
- source_word: לָעֹלָה
  choice: దహనబలి కోసం
  rationale: עֹלָה అనే బలి పదానికి స్థిరమైన, స్పష్టమైన తెలుగు పదం ‘దహనబలి’; ל ఉపసర్గ సూచించే ఉద్దేశాన్ని ‘కోసం’ తెలియజేస్తుంది.
- source_word: הַמֹּרִגִּים
  choice: నూర్పిడి పలకలు
  rationale: మోరగ్ అనేది ధాన్యం నూర్చడానికి ఉపయోగించే పలక లేదా బల్లవంటి పరికరం. ‘నూర్పిడి పలకలు’ దాని రూపాన్నీ పనినీ సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְלֵי הַבָּקָר
  choice: ఎద్దుల సామగ్రి
  rationale: כְּלִי అనే పదం పరికరాలు లేదా సామగ్రి అనే విస్తృత భావం కలిగి ఉంది. ‘కాడులు’ వంటి ఒక నిర్దిష్ట వస్తువుకు పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: לָעֵצִים
  choice: కట్టెల కోసం
  rationale: ఆ చెక్క సామగ్రిని బలి దహనానికి ఇంధనంగా ఉపయోగించవచ్చనే ఉద్దేశాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
