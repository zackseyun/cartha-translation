  terminology: ‘దహనబలి’ is an appropriate established rendering for עֹלָה. ‘నూర్పిడి పలకలు’ reasonably renders threshing sledges, while ‘ఎద్దుల సామగ్రి’ properly retains the breadth of כְלֵי הַבָּקָר. The footnotes appropriately preserve the Hebrew idiom and the lexical breadth of the latter expression.
