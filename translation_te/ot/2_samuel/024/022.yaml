translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజుతో మాట్లాడే గౌరవపూర్వక స్వరాన్ని నిలిపాం. మూలంలోని మూడవ పురుష గౌరవప్రయోగాన్ని ‘నా ప్రభువైన రాజు… తనకు’ ద్వారా కాపాడాం. బలిసంబంధ పదజాలానికి స్పష్టమైన ‘దహనబలి’ వాడాం; స్పష్టతలేని כְלֵי הַבָּקָר ను అతిగా నిర్దిష్టం చేయకుండా ‘ఎద్దుల సామగ్రి’గా అనువదించాం.
