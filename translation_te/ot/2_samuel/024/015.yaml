reference: 2 Samuel 24:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: te
  text: అప్పుడు యాహ్వే ఉదయం నుండి నియమిత సమయం వరకు[a] ఇశ్రాయేలుపై తెగులును పంపాడు. దాను నుండి బెయేర్షెబా వరకు ప్రజలలోని డెబ్బై వేల మంది పురుషులు మరణించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిర్ణీత సమయం వరకు.’ హీబ్రూ పదబంధం నియమించబడిన లేదా స్థిరపరచబడిన సమయాన్ని సూచించగలదు; ఇక్కడ ‘సమావేశ సమయం వరకు’ అనే అర్థం వచ్చే అవకాశం తక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: పంపాడు
  rationale: క్రియకు అక్షరార్థంగా ‘ఇచ్చాడు’ అనే భావం ఉన్నా, דֶּבֶרతో కూడిన ఈ తీర్పు సందర్భంలో ‘తెగులును పంపాడు’ అనేది సహజమైన తెలుగు ప్రయోగం; దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
- source_word: דֶּבֶר
  choice: తెగులు
  rationale: ప్రాణాంతకంగా వ్యాపించే వ్యాధిని సూచించే స్పష్టమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీదికి
  rationale: విపత్తు ఆ ప్రజలపైకి రావడం అనే భావాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తం చేస్తుంది.
- source_word: מֵהַבֹּקֶר
  choice: ఉదయం మొదలుకొని
  rationale: కాలవ్యవధి ప్రారంభ బిందువును స్పష్టంగా తెలుపుతుంది.
- source_word: וְעַד עֵת מוֹעֵד
  choice: నియమిత సమయం వరకు
  rationale: מוֹעֵד ఇక్కడ ముందుగా నిర్ణయించబడిన లేదా నిర్దేశిత సమయాన్ని సూచించే అవకాశమే ఎక్కువ; మూలంలోని కొంత అనిశ్చితిని ‘నియమిత సమయం’ నిలుపుతుంది.
- source_word: וַיָּמָת מִן הָעָם
  choice: ప్రజల్లో ... చనిపోయారు
  rationale: సమూహార్థక నిర్మాణాన్ని తెలుగులో సహజమైన బహువచన వాక్యంగా అందిస్తుంది; మరణించినవారు ప్రజలలోనివారని స్పష్టం చేస్తుంది.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: దాను మొదలుకొని బెయేర్షెబా వరకు
  rationale: ఇశ్రాయేలు దేశ విస్తారమంతటినీ సూచించే భౌగోళిక సూత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: డెబ్బై వేల మంది
  rationale: אִישׁ సంఖ్య తరువాత వ్యక్తులను పంపిణీ భావంతో సూచిస్తుంది. తెలుగులో ‘మంది’ సహజమైన వ్యక్తి-లెక్కింపు రూపం; ఇది ‘ప్రజలు’ అని సాధారణీకరించకుండా వ్యక్తుల సంఖ్యను కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తీర్పులో దేవుని కార్యసాధకత్వం
  choice: యెహోవా ... తెగులును పంపాడు
  alternative: యెహోవా తెగులు రావడానికి అనుమతించాడు
  rationale: హీబ్రూ వాక్యం కార్యాన్ని యెహోవాకే ప్రత్యక్షంగా ఆపాదిస్తుంది; ‘అనుమతించాడు’ వంటి ఉపశమన భావాన్ని మూలంలో లేనప్పుడు చేర్చలేదు.
- issue: עֵת מוֹעֵד యొక్క అర్థం
  choice: నియమిత సమయం వరకు
  alternative: నిర్ణీత సమయం వరకు; సమావేశ సమయం వరకు
  rationale: ఈ కథన సందర్భంలో నిర్ణయించబడిన కాలాంతం అనే భావమే ఎక్కువ సంభావ్యమైనది. అయినా పదబంధానికి ఉన్న ప్రత్యామ్నాయ సాధ్యతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. ‘తెగులు,’ ‘నియమిత సమయం,’ ‘ప్రజల్లో’ వంటి రూపాలు సహజత్వం మరియు మూలార్థ నిష్ఠ మధ్య సమతుల్యతను కాపాడుతాయి.
