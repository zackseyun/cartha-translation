  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשֻׁ֖טוּ בְּ/כָל הָ/אָ֑רֶץ וַ/יָּבֹ֜אוּ מִ/קְצֵ֨ה תִשְׁעָ֧ה חֳדָשִׁ֛ים וְ/עֶשְׂרִ֥ים י֖וֹם יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: te
  text: వారు దేశమంతటా సంచరించి, తొమ్మిది నెలల ఇరవై రోజులు పూర్తయ్యేసరికి యెరూషలేముకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: సంచరించి
  rationale: שׁוּט అనే క్రియ ఒక ప్రాంతమంతటా తిరిగి ప్రయాణించడాన్ని సూచిస్తుంది. జనగణన కోసం దేశమంతటా చేసిన ప్రయాణాన్ని ‘సంచరించి’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది; లక్ష్యం లేకుండా తిరిగారనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: בְּכָל הָאָרֶץ
  choice: దేశమంతటా
  rationale: ב + כל + הארץ ఇక్కడ లెక్కించబడుతున్న భూభాగమంతటా కదలికను సూచిస్తుంది. సందర్భానుసారంగా ‘దేశమంతటా’ అనేది ‘భూమి’ కంటే స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא సాధారణంగా ‘వచ్చు’ లేదా ‘చేరుకొను’ అని అర్థం. గమ్యస్థానమైన యెరూషలేముతో కలిసి ‘వచ్చారు’ హెబ్రీ కథన శైలిని నిలుపుతుంది.
- source_word: מִקְצֵה
  choice: ముగింపులో
  rationale: కాలవ్యవధితో వాడిన מִקְצֵה ఆ వ్యవధి పూర్తయిన బిందువును సూచిస్తుంది. ‘ముగింపులో’ మూల నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: తొమ్మిది నెలల ఇరవై రోజులు
  rationale: ఇది తొమ్మిది నెలలు, ఇరవై రోజులు అనే మొత్తం కాలవ్యవధిని నేరుగా తెలియజేస్తుంది. విభక్తి సందర్భంలో ‘తొమ్మిది నెలల ఇరవై రోజుల’ అనే రూపం సహజమైన తెలుగు.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామ రూపం; వాక్యంలో దిశను సూచించేందుకు ‘యెరూషలేముకు’గా వాడబడింది.
