translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని క్రమాన్ని—దేశమంతటా సంచారం, కాలవ్యవధి ముగింపు, యెరూషలేముకు రాక—కాపాడుతూ, తెలుగులో సులభంగా చదివేలా నిర్మించబడింది.
