source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֣ף אֲרַ֗וְנָה וַ/יַּ֤רְא אֶת הַ/מֶּ֨לֶךְ֙ וְ/אֶת עֲבָדָ֔י/ו עֹבְרִ֖ים עָלָ֑י/ו וַ/יֵּצֵ֣א אֲרַ֔וְנָה וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ אַפָּ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: te
  text: అరౌనా బయటకు చూసి, రాజును, అతని సేవకులను తన వైపుకు వస్తుండగా చూశాడు.[a] అప్పుడు అరౌనా బయటకు వెళ్లి, ముఖం నేలకు తగిలేలా రాజుకు సాగిలపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పక్కగా వెళ్తుండగా.” హీబ్రూ పదబంధం రాజు, అతని సేవకులు అరౌనాకు సంబంధించి కదులుతున్నారని చెబుతుంది; వారు అతని వైపుకు వస్తున్నారా, అతని పక్కగా వెళ్తున్నారా అనేది పదబంధంలో పూర్తిగా స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: బయటకు చూసి
  rationale: ఈ క్రియ ఎత్తైన స్థలం నుంచో, ఏదైనా తెరువు గుండానో బయటకు చూడడాన్ని సూచిస్తుంది; సాధారణమైన ‘చూశాడు’ కంటే ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ముందటి ‘బయటకు చూసి’ అనే చర్య తర్వాత అతడు వారిని గమనించిన కథన క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసంబంధ సందర్భంలో עבד అనే పదం రాజు సేవకులను లేదా పరివారాన్ని సూచించగలదు; ‘సేవకులు’ మూలానికి నేరుగా సరిపోతుంది.
- source_word: עֹבְרִים עָלָיו
  choice: తన వైపుగా వస్తుండడం
  rationale: עבר עם על ఇక్కడ అరౌనాకు సంబంధించి వారు కదులుతున్నారని చెబుతుంది. సందర్భంలో దావీదు అరౌనా స్థలానికి వస్తున్నందున ‘తన వైపుగా వస్తుండడం’ సహజమైన భావం; ‘అతని పక్కగా వెళ్తుండడం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיֵּצֵא
  choice: బయటకు వెళ్లి
  rationale: יצא యొక్క సాధారణ అర్థాన్ని, ముందుగా అరౌనా బయటకు చూసిన దృశ్యకోణాన్ని నిలుపుతూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: ఈ క్రియ వంగి సాష్టాంగపడే చర్యను సూచిస్తుంది. ఇక్కడ మానవ రాజు ఎదుట చేసిన గౌరవసూచక చర్య కావడంతో, దైవారాధనను సూచించకుండా శారీరక చర్యను వ్యక్తం చేస్తుంది.
- source_word: אַפָּיו אָרְצָה
  choice: ముఖం నేలకు తగిలేలా
  rationale: ‘ముఖం/ముక్కు నేలవైపు’ అనే హీబ్రూ నుడికారంలో సంపూర్ణంగా నేలవైపు వంగడం ఉద్దేశించబడింది; ఈ తెలుగు రూపం దాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲרַוְנָה
  choice: అరౌనా
  rationale: సమూయేలు గ్రంథంలోని హీబ్రూ నామరూపాన్ని తెలుగు లిపిలో ప్రతిబింబిస్తుంది; దినవృత్తాంతములలోని ‘ఒర్నాను’ రూపాన్ని ఇక్కడకు దిగుమతి చేయదు.
theological_decisions:
- issue: రాజు ఎదుట అరౌనా చేసిన చర్య స్వభావం
  choice: మానవ రాజుకు గౌరవం తెలుపుతూ వంగి నమస్కరించడం
  alternative: రాజును ఆరాధించడం
  rationale: וַיִּשְׁתַּחוּ అనే క్రియ ఆరాధనకూ, మానవ అధికారి ఎదుట సాష్టాంగ గౌరవానికీ వాడవచ్చు. ఇక్కడ కర్మ మానవ రాజైన దావీదు కాబట్టి, దైవారాధన భావాన్ని రుద్దకుండా శారీరక గౌరవచర్యగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘వంగి నమస్కరించాడు’ అనేది సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ఆ చర్యను దైవారాధనగా అతిగా అర్థం చేయకుండా నివారిస్తుంది. పాదసూచిక గుర్తు [a] సంబంధిత అస్పష్ట పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
