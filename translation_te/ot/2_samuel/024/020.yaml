revisions:
- from: అరౌనా బయటకు చూసి, రాజు, అతని సేవకులు తన వైపుగా వస్తుండడం చూశాడు.[a] అప్పుడు అరౌనా బయటకు వెళ్లి, ముఖం నేలకు తగిలేలా రాజు ముందు వంగి నమస్కరించాడు.
  to: అరౌనా బయటకు చూసి, రాజును, అతని సేవకులను తన వైపుకు వస్తుండగా చూశాడు.[a] అప్పుడు అరౌనా బయటకు వెళ్లి, ముఖం నేలకు తగిలేలా రాజుకు సాగిలపడ్డాడు.
