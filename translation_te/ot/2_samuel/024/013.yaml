revisions:
- from: 'కాబట్టి గాదు దావీదు దగ్గరికి వచ్చి, అతనికి విషయం తెలియజేసి ఇలా అన్నాడు: “నీ దేశంలో ఏడు సంవత్సరాలు కరవు రావాలా?[a] లేక నీ శత్రువులు నిన్ను తరుముతుండగా, మూడు నెలలు వారి ఎదుటనుంచి నీవు పారిపోవాలా?[b] లేక నీ దేశంలో మూడు రోజులు అంటువ్యాధి ఉండాలా?[c] ఇప్పుడు ఆలోచించి నిర్ణయించుకో; నన్ను పంపినవానికి నేను ఏ జవాబు తీసుకువెళ్లాలో చెప్పు.”'
  to: 'అప్పుడు గాదు దావీదు దగ్గరికి వచ్చి, అతనికి తెలియజేసి ఇలా అన్నాడు: “నీ దేశంలో ఏడు సంవత్సరాల కరవు రావాలా?[a] లేక నీ శత్రువులు నిన్ను తరుముతుండగా, నీవు వారి ఎదుట మూడు నెలలు పారిపోవాలా?[b] లేక నీ దేశంలో మూడు రోజులు మహమ్మారి ఉండాలా?[c] ఇప్పుడు ఆలోచించి చూడు; నన్ను పంపినవానికి నేను ఏ జవాబు తిరిగి చెప్పాలో.”'
  rationale: మూలంలోని ప్రశ్నల త్రివిధ నిర్మాణం, ఏడు సంవత్సరాల మసొరెటిక్ పఠనం, మరియు పంపినవానికి జవాబు తిరిగి చెప్పే భావం నిలిపాం. మూలంలో లేని ప్రత్యక్ష ఆజ్ఞను తొలగించాం; వ్యాధి పదాన్ని అనవసరంగా సంక్రమణకు పరిమితం చేయకుండా సవరించాం. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉంచబడ్డాయి.
