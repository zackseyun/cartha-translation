  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: te
  text: 'అప్పుడు గాదు దావీదు దగ్గరికి వచ్చి, అతనికి తెలియజేసి ఇలా అన్నాడు: “నీ దేశంలో ఏడు సంవత్సరాల కరవు రావాలా?[a] లేక నీ శత్రువులు నిన్ను తరుముతుండగా, నీవు వారి ఎదుట మూడు నెలలు పారిపోవాలా?[b] లేక నీ దేశంలో మూడు రోజులు మహమ్మారి ఉండాలా?[c] ఇప్పుడు ఆలోచించి చూడు; నన్ను పంపినవానికి నేను ఏ జవాబు తిరిగి చెప్పాలో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 21:12లోని సమాంతర వచనం “మూడు సంవత్సరాల కరవు” అని చెబుతుంది.
    reason: textual_variant
  - marker: b
    text: “శత్రువులు” అనే పదాన్ని “విరోధులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “మహమ్మారి” అనే పదాన్ని “తెగులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: గాదు దావీదు దగ్గరికి వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియను సందర్భానికి సహజంగా ‘దగ్గరికి వచ్చి’ అని అనువదించాం.
- source_word: וַיַּגֶּד לוֹ
  choice: అతనికి విషయం తెలియజేసి
  rationale: Hiphil נגד ఇక్కడ చెప్పడం లేదా నివేదించడం అనే భావం ఇస్తుంది; తెలుగులో కర్మ స్పష్టత కోసం ‘విషయం’ చేర్చడం సహజం.
- source_word: שֶׁבַע שָׁנִים רָעָב
  choice: ఏడు సంవత్సరాలు కరవు
  rationale: రָעָב సామాన్య ఆకలి కంటే దేశవ్యాప్త కరవును సూచిస్తుంది. WLCలోని ‘ఏడు’ను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: צָרֶיךָ
  choice: నీ శత్రువులు
  rationale: צַר అంటే విరోధి లేదా శత్రువు. ఆధునిక సాధారణ తెలుగులో ‘శత్రువులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְהוּא רֹדְפֶךָ
  choice: నిన్ను తరుముతుండగా
  rationale: హీబ్రూలో ఏకవచన సర్వనామం ఉన్నా, ముందున్న బహువచన శత్రువులను సమూహార్థంగా సూచిస్తుంది; తెలుగులో భావానుసారంగా బహువచనం తీసుకున్నాం.
- source_word: דֶּבֶר
  choice: అంటువ్యాధి
  rationale: דֶּבֶר తీవ్రమైన వ్యాపక వ్యాధి లేదా మహమ్మారిని సూచిస్తుంది. ‘అంటువ్యాధి’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం; ‘మహమ్మారి’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: ఇప్పుడు ఆలోచించి నిర్ణయించుకో
  rationale: పదశః ‘తెలుసుకొని చూడు’ అన్న జంట ఆజ్ఞ ఇక్కడ పరిశీలించి ఎంపిక చేయమనే కార్యార్థం కలిగి ఉంది; సహజ తెలుగులో దానిని స్పష్టం చేశాం.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: నన్ను పంపినవానికి నేను ఏ జవాబు తీసుకువెళ్లాలో చెప్పు
  rationale: השיב דבר అనేది జవాబు తిరిగి తీసుకెళ్లడం అనే నుడికారం. చివరి ‘చెప్పు’ హీబ్రూ ఆజ్ఞల సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: 1 దినవృత్తాంతాలు 21:12లోని సమాంతర వచనంతో సంవత్సరాల సంఖ్యలో భేదం
  choice: ప్రధాన పాఠ్యంలో మసొరెటిక్ పాఠంలోని ‘ఏడు సంవత్సరాలు’ను అనువదించడం
  alternative: ‘మూడు సంవత్సరాలు’—1 దినవృత్తాంతాలు 21:12లోని సమాంతర పాఠం
  rationale: ఇచ్చిన WLC మూలపాఠం ‘ఏడు’ అని చదువుతుంది. సమాంతర వచనంతో బలవంతంగా సమన్వయం చేయకుండా, భేదాన్ని పాదటిప్పణిలో పారదర్శకంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ ప్రశ్నల త్రివిధ నిర్మాణాన్ని నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా తీర్చిదిద్దాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
