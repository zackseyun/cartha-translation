revisions:
- from: వారు యొర్దాను నదిని దాటి, అరోయేరు దగ్గర—గాదు వాగులోయ[b] మధ్యలో ఉన్న పట్టణానికి కుడివైపున[a], యాజేరు వైపుగా[c]—మకాం వేశారు.
  to: వారు యొర్దాను నదిని దాటి, గాదు వాగులోయ[b] మధ్యలో ఉన్న పట్టణానికి కుడివైపున[a] ఉన్న అరోయేరు వద్ద మకాం వేశారు; ఆపై యాజేరు వైపుగా[c] వెళ్లారు.
  rationale: 'The revision makes the Hebrew geographical relations explicit in natural Telugu: Aroer is located to the right of the city in the wadi/valley of Gad, and the following phrase signals onward movement toward Jazer. The added Telugu verb ‘వెళ్లారు’ expresses the action ellipted in the Hebrew itinerary sequence, while ‘వైపుగా’ and its footnote preserve the unresolved ‘to/toward Jazer’ distinction. Footnote anchors remain attached to precisely the relevant expressions.'
