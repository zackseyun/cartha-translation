base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: te
  text: వారు యొర్దాను నదిని దాటి, గాదు వాగులోయ[b] మధ్యలో ఉన్న పట్టణానికి కుడివైపున[a] ఉన్న అరోయేరు వద్ద మకాం వేశారు; ఆపై యాజేరు వైపుగా[c] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పట్టణానికి కుడివైపున.’ కొందరు దీనిని భౌగోళికంగా ‘పట్టణానికి దక్షిణాన’ అని అర్థం చేసుకుంటారు; అయితే హీబ్రూ వాక్యం స్వయంగా ‘కుడివైపు’ అనే పదాన్నే ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం లోయను, కనుమను, లేదా కాలానుగుణంగా నీరు ప్రవహించే వాగుపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘యాజేరుకు’ అని కూడా అనువదించవచ్చు. హీబ్రూ విభక్తి ఒక ప్రదేశం వైపుగా ఉన్న దిశను గానీ, ఆ ప్రదేశానికి చేరే గమనాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: వారు యొర్దాను నదిని దాటి
  rationale: עבר అనే క్రియకు ఈ ప్రయాణ సందర్భంలో ‘దాటడం’ సహజార్థం. యొర్దాను ఒక నది అని ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా ఉండేందుకు ‘నదిని’ చేర్చబడింది.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అంటే ప్రయాణంలో ఒకచోట బస చేయడం లేదా శిబిరం వేయడం. ‘మకాం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రయాణ వర్ణనకు సరిపోతుంది.
- source_word: בַעֲרוֹעֵר
  choice: అరోయేరు దగ్గర
  rationale: స్థలనామంతో వచ్చిన ב ప్రయాణంలోని ఆగే ప్రదేశాన్ని సూచిస్తుంది. ‘దగ్గర’ అనేది స్థల సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘లో’ అని అనవసరంగా ఖచ్చితపరచదు.
- source_word: יְמִין הָעִיר
  choice: పట్టణానికి కుడివైపున
  rationale: ימין యొక్క ప్రత్యక్ష స్థలార్థం ‘కుడివైపు.’ దీనిని ‘దక్షిణాన’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని దిశా వ్యక్తీకరణను నిలిపింది.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: గాదు వాగులోయ మధ్యలో ఉన్న
  rationale: సంబంధ వాక్యం ‘పట్టణం’ను విశేషిస్తుంది. נחל లోయ, కనుమలోని వాగు, లేదా కాలానుగుణ ప్రవాహపాత్రను సూచించగలదు; ‘వాగులోయ’ ఈ భౌగోళిక విస్తృతిని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְאֶל יַעְזֵר
  choice: యాజేరు వైపుగా
  rationale: אל గమ్యస్థానానికి ‘కు’ లేదా దాని దిశగా ‘వైపుగా’ అనే రెండర్థాలు కలిగి ఉండవచ్చు. ఈ వచనం యాజేరుకు చేరుకున్నారని ఖచ్చితంగా చెప్పనందున దిశను సూచించే రూపం ఎంచబడింది.
