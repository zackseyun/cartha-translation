- from: వారు గిలాదుకు, తహ్తీమ్-హొద్షీ దేశానికి వచ్చారు[a]. తరువాత వారు దాన్-యాన్‌కు వచ్చి[b], సీదోను చుట్టుపక్కల ప్రాంతానికి వెళ్లారు.
  to: వారు గిలాదుకు, తహ్తీమ్-హోద్షీ దేశానికి వచ్చారు[a]. వారు దాన్-యాన్‌కు వచ్చి[b], సీదోను వరకు చుట్టూ తిరిగారు.
  rationale: The revision preserves the Hebrew itinerary's final expression of circling movement to/as far as Sidon, rather than identifying Sidon's surrounding district as the destination. It also regularizes the transliteration “హోద్షీ” to reflect the audit trail’s Tahtim-hodshi, while retaining the source text's geographic uncertainty in the footnote.
