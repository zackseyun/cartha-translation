language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ הַ/גִּלְעָ֔דָ/ה וְ/אֶל אֶ֥רֶץ תַּחְתִּ֖ים חָדְשִׁ֑י וַ/יָּבֹ֨אוּ֙ דָּ֣נָ/ה יַּ֔עַן וְ/סָבִ֖יב אֶל צִידֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: te
  text: వారు గిలాదుకు, తహ్తీమ్-హోద్షీ దేశానికి వచ్చారు[a]. వారు దాన్-యాన్‌కు వచ్చి[b], సీదోను వరకు చుట్టూ తిరిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తహ్తీమ్-హోద్షీ” అనే హీబ్రూ పదబంధం అస్పష్టంగా ఉంది. కొందరు దీనిని పాఠసవరణ ద్వారా లేదా వ్యాఖ్యానంగా “కాదేషులోని హిత్తీయుల దేశం” లేదా దానికి సమానమైన అర్థంగా తీసుకుంటారు; అయితే మూల స్థలనామం అనిశ్చితంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: “దాన్-యాన్” బహుశా ఒక స్థలనామం; అది ఖచ్చితంగా ఏ ప్రదేశమో తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వారు వచ్చారు
  rationale: בוא క్రియ యొక్క వరుస కథన రూపం ప్రయాణంలోని తదుపరి చేరికను సూచిస్తుంది. హీబ్రూలోని దశలవారీ ప్రయాణ నివేదికను నిలుపుటకు మొదటి సందర్భంలో ‘వచ్చారు’ అని అనువదించాం.
- source_word: הַגִּלְעָדָה
  choice: గిలాదుకు
  rationale: స్థలనామానికి జతైన దిశార్థక ה, గిలాదు వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘గిలాదుకు’ సహజమైన రూపం.
- source_word: אֶרֶץ
  choice: దేశానికి
  rationale: ఇక్కడ אֶרֶץ భూమి మొత్తాన్ని కాక ఒక భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. గమ్యార్థక సందర్భానికి అనుగుణంగా ‘దేశానికి’ అని ఇచ్చాం.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: తహ్తీమ్-హొద్షీ
  rationale: ఈ హీబ్రూ పదబంధం పాఠపరంగానూ భౌగోళికంగానూ అస్పష్టమైనది. ఊహాత్మక సవరణను ప్రధాన పాఠ్యంలో ప్రవేశపెట్టకుండా స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: דָּנָה יַּעַן
  choice: దాన్-యాన్‌కు
  rationale: దీనిని అనిశ్చిత గుర్తింపుగల స్థలనామంగా తీసుకున్నాం. דנה లోని దిశార్థక ముగింపును తెలుగులో ‘-కు’ ద్వారా స్పష్టంగా వ్యక్తం చేశాం.
- source_word: וְסָבִיב אֶל צִידוֹן
  choice: సీదోను చుట్టుపక్కల ప్రాంతానికి వెళ్లారు
  rationale: సָבִיב చుట్టుపక్కల ప్రాంతం లేదా పరిసర కదలికను సూచిస్తుంది; אֶל צִידוֹן దిశను తెలుపుతుంది. తెలుగులో అసంపూర్ణంగా వినిపించకుండా ప్రయాణార్థాన్ని సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రయాణ-కథన శైలి వాడాం. అస్పష్ట స్థలనామాలను ఊహాత్మకంగా పరిష్కరించకుండా లిప్యంతరీకరించి, వివరాలను పాదటిప్పణుల్లో ఉంచాం.
