source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יְהוָ֜ה בִּ/רְאֹת֣/וֹ אֶֽת הַ/מַּלְאָ֣ךְ הַ/מַּכֶּ֣ה בָ/עָ֗ם וַ/יֹּ֨אמֶר֙ הִנֵּ֨ה אָנֹכִ֤י חָטָ֨אתִי֙ וְ/אָנֹכִ֣י הֶעֱוֵ֔יתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ תְּהִ֨י נָ֥א יָדְ/ךָ֛ בִּ֖/י וּ/בְ/בֵ֥ית אָבִֽ/י־׀־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: te
  text: 'ప్రజలపై ప్రహరిస్తున్న దూతను చూసినప్పుడు దావీదు యెహోవాతో ఇలా అన్నాడు: “ఇదిగో, నేను పాపం చేశాను; నేను దుర్మార్గంగా ప్రవర్తించాను. కానీ ఈ గొర్రెలు ఏమి చేశాయి? దయచేసి నీ చెయ్యి నాకూ నా తండ్రి ఇంటివారికీ విరోధంగా ఉండనివ్వు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామంగా నిలిపింది.
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: ప్రజలను సంహరిస్తున్న దూత
  rationale: מכה అనే ప్రస్తుత క్రియారూపం ఇక్కడ తెగులు ద్వారా ప్రాణహాని కలిగిస్తున్న చర్యను సూచిస్తుంది; సందర్భానికి తగిన బలాన్ని ‘సంహరిస్తున్న’ నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దావీదు తన అపరాధాన్ని గట్టిగా ముందుకు తెచ్చే ఉద్ఘాటనను సహజమైన గంభీర తెలుగు రూపంలో నిలిపింది.
- source_word: הֶעֱוֵיתִי
  choice: తప్పు చేసినవాణ్ణి
  rationale: ‘వక్రంగా/దుర్మార్గంగా ప్రవర్తించాను’ అనే భావాన్ని, ముందున్న ‘పాపం చేశాను’తో ఉన్న సమాంతర ఉద్ఘాటనను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: కానీ గొర్రెలవంటి వీరు
  rationale: ప్రజలను గొర్రెలుగా పేర్కొనే కాపరి రూపకాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో వారు అక్షరార్థంగా గొర్రెలనే అపార్థాన్ని నివారిస్తుంది.
- source_word: בְבֵית אָבִי
  choice: నా తండ్రి ఇంటివారికి
  rationale: ‘ఇల్లు’ అనే భవనం కంటే తండ్రి వంశం లేదా కుటుంబాన్ని సూచించే హీబ్రూ కుటుంబపదబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దావీదు ఒక్కడే దోషి అని వాక్యం తేల్చి చెబుతుందా?
  choice: దావీదు పలికిన స్వీయనిందను ప్రత్యక్ష వాక్యంగానే ఉంచడం
  alternative: ఇశ్రాయేలు గత పాపాన్ని బట్టి దావీదు మాటను వ్యాఖ్యానించి పరిమితం చేయడం
  rationale: ఈ వాక్యం దావీదు విజ్ఞప్తిని నమోదు చేస్తుంది; అతని మాటకు వెలుపల నుంచి దోషనిర్ణయాన్ని జోడించదు.
- issue: ‘గొర్రెలు’ అనే రూపకం
  choice: ‘గొర్రెలవంటి వీరు’
  alternative: ‘ఈ ప్రజలు’ లేదా అక్షరార్థంగా ‘ఈ గొర్రెలు’
  rationale: రాజు-కాపరి, ప్రజలు-గొర్రెలు అనే రూపక సంబంధాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థస్పష్టతను ఇస్తుంది.
- issue: దేవుని ‘చెయ్యి’
  choice: ‘నీ చెయ్యి ... విరోధంగా ఉండనివ్వు’ అని రూపకాన్ని నిలపడం
  alternative: ‘నీ శిక్ష ... మీదికి రానివ్వు’
  rationale: దైవిక దండన/చర్యకు సూచకమైన మూలపాఠ రూపకాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష వాక్యశైలి. ‘యెహోవా’, ‘దూత’, ‘నీ చెయ్యి’ వంటి బైబిలు పదప్రయోగాలను నిలిపి, ‘ఇంటివారు’ వంటి సహజ రూపాలతో అర్థస్పష్టత కల్పించబడింది.
