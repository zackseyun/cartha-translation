source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: te
  text: అక్కడ దావీదు యెహోవా[b]కు ఒక బలిపీఠం కట్టి, దహనబలులనూ సమాధానబలులనూ[a] అర్పించాడు. అప్పుడు దేశం కోసం చేసిన విన్నపానికి యెహోవా అనుకూలంగా స్పందించాడు[c]; ఇశ్రాయేలు మీదున్న తెగులు ఆపబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులు”; సంప్రదాయంగా “శాంతిబలులు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: “యెహోవా” అనేది יהוה (YHWH) అనే దైవనామానికి తెలుగు రూపం; “యాహ్వే” అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ క్రియ విన్నపానికి అనుకూలంగా స్పందించడాన్ని సూచిస్తుంది. దీనిని “దేశం విషయంలో యెహోవా అనుకూలంగా స్పందించాడు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד מִזְבֵּחַ
  choice: అక్కడ దావీదు ఒక బలిపీఠం కట్టి
  rationale: కథన సందర్భంలో בנהకు సహజమైన తెలుగు ‘కట్టు’; שָׁםను సంక్షిప్తంగా ‘అక్కడ’ అని అనువదించాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ అంకితం లేదా దిశను సూచిస్తుంది; יהוה అనే నిబంధన నామాన్ని తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּעַל עֹלוֹת
  choice: దహనబలులను అర్పించాడు
  rationale: עלה అనే బలి సంబంధిత ప్రయోగం ‘అర్పించు’ అనే భావాన్ని ఇస్తుంది; עֹלוֹתకు ‘దహనబలులు’ స్పష్టమైన సంప్రదాయ పదం.
- source_word: וּשְׁלָמִים
  choice: సమాధానబలులు
  rationale: శాంతి, సంపూర్ణత, సహవాసంతో సంబంధమున్న ఈ బలి వర్గానికి ‘సమాధానబలులు’ స్థిరమైన తెలుగు సమానం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: దేశం కోసం చేసిన విన్నపాన్ని యెహోవా ఆలకించాడు
  rationale: עתר నిఫాల్ రూపంలో విన్నపానికి అనుకూలంగా స్పందించే భావం అంతర్భూతంగా ఉంది. לָאָרֶץను ‘దేశం కోసం’గా తీసుకోవడం సహజమైన తెలుగు; విన్నపం చేసిన వ్యక్తిని వాక్యం పేర్కొనదు.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీదున్న తెగులు ఆపబడింది
  rationale: Niphal క్రియలోని కర్మణి భావాన్ని ‘ఆపబడింది’ నిలుపుతుంది; מֵעַל‌ను ‘మీదున్న’గా వ్యక్తం చేయడం మూలంలోని స్థల సంబంధాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; మరొక సాధ్యమైన లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
- issue: וַיֵּעָתֵר יְהוָה לָאָרֶץలో దైవ స్పందన స్వభావం
  choice: దేశం కోసం చేసిన విన్నపాన్ని యెహోవా ఆలకించాడు
  alternative: దేశం విషయంలో యెహోవా అనుకూలంగా స్పందించాడు
  rationale: క్రియలో విన్నపానికి స్పందించడం అనే భావం ఉన్నప్పటికీ, వాక్యం విన్నపకర్తను లేదా విన్నపపు మాటలను చెప్పదు. అందువల్ల అనుకూల స్పందనను వ్యక్తం చేస్తూ, పేర్కొనని వివరాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి వాడబడింది. ‘బలిపీఠం’, ‘దహనబలి’, ‘సమాధానబలి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, క్లిష్టమైన హీబ్రూ వాక్యభాగాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
