source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: te
  text: దావీదు గాదు మాట ప్రకారం పైకి వెళ్లాడు, యాహ్వే ఆజ్ఞాపించినట్లే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: כִּדְבַר
  choice: మాట ప్రకారం
  rationale: כ + דבר నిర్మాణంలోని ‘మాట ప్రకారం’ అనే భావాన్ని స్పష్టంగా నిలుపుతూ, గాదు తెలియజేసిన ప్రవక్తీయ ఆదేశాన్ని సూచిస్తుంది.
- source_word: גָּד
  choice: గాదు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: గాదు మాటకు యెహోవా ఆజ్ఞకు ఉన్న ఖచ్చితమైన అనురూపతను ‘అట్లే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ‘ఆజ్ఞాపించు’ అనే మూలార్థాన్ని నిలుపుతుంది; తెలుగు ఉపవాక్య నిర్మాణంలో ఆ ఆజ్ఞ దావీదు చర్యకు ముందున్నదని సందర్భమే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది; ఇది ‘ప్రభువు’ వంటి బిరుదుతో నామాన్ని భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని దిశార్థం, ‘మాట ప్రకారం’ అనే నిర్మాణం, యెహోవా ఆజ్ఞతో గాదు మాటకున్న అనురూపత నిలుపబడ్డాయి.
