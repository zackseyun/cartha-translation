source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹאָ֜ב אֶל הַ/מֶּ֗לֶךְ וְ/יוֹסֵ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֶל הָ/עָ֜ם כָּ/הֵ֤ם וְ/כָ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים וְ/עֵינֵ֥י אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ רֹא֑וֹת וַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ לָ֥/מָּה חָפֵ֖ץ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: te
  text: అయితే యోవాబు రాజుతో, “నీ దేవుడైన యాహ్వే ప్రజలను ఇప్పుడున్నదానికంటే నూరింతలు పెంచుగాక; నా ప్రభువైన రాజు కళ్లు అది చూడుగాక.[a] కాని నా ప్రభువైన రాజు ఈ పని చేయాలని ఎందుకు కోరుకుంటున్నాడు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రభువైన రాజు కళ్లు చూడుగాక.” హెబ్రీలో దేనిని చూడాలనే కర్మపదం స్పష్టంగా లేదు; రాజు ప్రజల పెరుగుదలను తన జీవితకాలంలో చూడాలని యోవాబు కోరుతున్నాడనేది సందర్భ భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో యోవాబు రాజాజ్ఞకు అభ్యంతరంగా స్పందిస్తున్నందున ‘అయితే’ ప్రతికూల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: וְיוֹסֵף
  choice: పెంచుగాక
  rationale: సందర్భంలోని జస్సివ్ భావం యోవాబు పలికిన ఆశీర్వాదపూర్వక కోరికను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష నామరూపంతో అందిస్తుంది.
- source_word: אֶל הָעָם
  choice: ప్రజలను
  rationale: עָם యొక్క విస్తృత అర్థమైన ‘ప్రజలు’ను నిలుపుతుంది; జనగణన సందర్భం ఉన్నప్పటికీ ‘సైన్యం’ అని అతి నిర్దిష్టం చేయదు.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: ఇప్పుడున్నదానికంటే నూరింతలు
  rationale: ప్రస్తుత సంఖ్యతో పోల్చి నూరింతల వృద్ధిని సూచించే హెబ్రీ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: నా ప్రభువైన రాజు కళ్లు అది చూడుగాక
  rationale: రాజు ఆ పెరుగుదలను స్వయంగా చూడాలనే కోరికను నిలుపుతుంది; హెబ్రీలో కర్మ అవ్యక్తంగా ఉన్నందున తెలుగులో ‘అది’ చేర్చి, దాని అవ్యక్తతను పాదటిప్పణిలో సూచించింది.
- source_word: חָפֵץ בַּדָּבָר הַזֶּה
  choice: ఈ పని చేయాలని ... కోరుకుంటున్నాడు
  rationale: ‘ఈ విషయాన్ని కోరడం/దానిలో ఇష్టపడడం’ అనే భావాన్ని సందర్భంలోని జనగణన చర్యకు అనుసంధానించి సహజంగా వ్యక్తం చేస్తుంది; నైతిక కారణాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: హెబ్రీ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపింది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: యోవాబు మాటలోని ప్రతిఘటన తీవ్రత
  choice: ఎందుకు కోరుకుంటున్నాడు?
  alternative: ఎందుకు ఈ విషయంలో ఆనందిస్తున్నాడు?
  rationale: חפץ ఇష్టం, కోరిక, అభిలాషను సూచించగలదు. ఇక్కడ జనగణన చేయాలనే రాజు సంకల్పాన్ని ప్రశ్నించడం ప్రధాన భావం; అతడు దానిలో ఆనందిస్తున్నాడని మరింత భావోద్వేగార్థం నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభ సంభాషణను ఉపయోగించింది. ‘నా ప్రభువైన రాజు’ అనే సంబోధనను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దింది.
