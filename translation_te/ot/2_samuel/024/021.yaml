  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲרַ֔וְנָה מַדּ֛וּעַ בָּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אֶל עַבְדּ֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד לִ/קְנ֧וֹת מֵ/עִמְּ/ךָ֣ אֶת הַ/גֹּ֗רֶן לִ/בְנ֤וֹת מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: te
  text: అరౌనా, “నా ప్రభువైన రాజు మీ సేవకుని దగ్గరకు ఎందుకు వచ్చారు?” అన్నాడు.[a] దావీదు, “నీ దగ్గర నుండి నూర్పిడి కళ్లాన్ని కొనడానికి, యాహ్వేకు బలిపీఠం కట్టడానికి, ప్రజల మీద ఉన్న తెగులు ఆగిపోవడానికి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, ‘తన సేవకుని.’ హీబ్రూలో మూడవ పురుష రూపం ఉంది; ఇది రాజాస్థానంలో తనను తాను వినయంగా సూచించుకునే పద్ధతి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: రాజు వచ్చిన కారణాన్ని అడిగే ప్రత్యక్ష ప్రశ్నకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: స్వామ్య సూచనతో కూడిన గౌరవ సంబోధనను, రాజ బిరుదును రెండింటినీ నిలుపుతుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుని
  rationale: హీబ్రూలోని మూడవ పురుష ఏకవచన రూపాన్ని, అరౌనా తనను తాను వినయంగా సూచించే రాజాస్థాన శైలిని నిలుపుతుంది.
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: నీ దగ్గర నుంచి ఈ నూర్పిడి కళ్లాన్ని కొని
  rationale: కొనుగోలు భావాన్ని స్పష్టంగా తెలియజేస్తూ, సందర్భంలో ఎదుట కనిపిస్తున్న నిర్దిష్ట స్థలానికి తెలుగులో సహజంగా ‘ఈ’ వాడింది.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: బలిపీఠం కట్టడానికి
  rationale: ఉద్దేశాన్ని సూచించే infinitive నిర్మాణానికి సహజమైన తెలుగు ప్రయోజనార్థక రూపం.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: అప్పుడు ప్రజల మీదున్న తెగులు ఆగిపోవచ్చు
  rationale: Niphal క్రియలోని ఆపబడే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ఉద్దేశిత ఫలితాన్ని నిశ్చయంగా కాక సంభావ్యంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే ఉంచింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’.
- issue: తెగులు ఆగడంలో ఉద్దేశం మరియు ఫలితం
  choice: ఆగిపోవచ్చు
  alternative: ఆగిపోతుంది
  rationale: וְתֵעָצַר ను ఉద్దేశిత ఫలితంగా గ్రహించి, బలిపీఠ నిర్మాణం తెగులును తప్పక ఆపుతుందని పాఠం కంటే బలంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక రాజాస్థాన సంభాషణకు ‘వచ్చారు’ వాడబడింది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు పునరుక్తమైన ‘అని చెప్పాడు’ బదులు ‘అని అడిగాడు/జవాబిచ్చాడు’ వాడినా, సంభాషణలోని అర్థం మార్చలేదు.
