  text: וַ/יָּבֹ֨אוּ֙ מִבְצַר צֹ֔ר וְ/כָל עָרֵ֥י הַ/חִוִּ֖י וְ/הַֽ/כְּנַעֲנִ֑י וַ/יֵּֽצְא֛וּ אֶל נֶ֥גֶב יְהוּדָ֖ה בְּאֵ֥ר שָֽׁבַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: te
  text: వారు కోటపట్టణమైన తూరుకు, హివ్వీయుల మరియు కనానీయుల పట్టణాలన్నిటికీ వచ్చారు. తరువాత వారు యూదా నెగెబుకు[a], బెయేర్షెబాకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా దక్షిణ ప్రాంతానికి.’ హీబ్రూ పదమైన నెగెబు ఒక నిర్దిష్ట భౌగోళిక ప్రాంతనామాన్ని గానీ, సాధారణంగా దక్షిణ ప్రాంతాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: కోటగల తూరు పట్టణం
  rationale: מִבְצַר అనే పదం కోట లేదా బలపరచబడిన స్థలాన్ని సూచిస్తుంది. తూరును ఒకే కోటగా కాక కోటగల పట్టణంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: హివ్వీయులూ కనానీయులూ నివసించే పట్టణాలన్నీ
  rationale: జాతి పేర్లు ఏకవచన రూపంలో ఉన్నా, అవి సమూహాలను సూచిస్తున్నాయి. ‘నివసించే’ అనేది ఆ పట్టణాలు ఆ ప్రజలకు చెందినవని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరారు
  rationale: יצא యొక్క ‘వెలుపలికి వెళ్లడం/ప్రయాణం కొనసాగించడం’ అనే భావాన్ని ఈ ప్రయాణ వర్ణనలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: యూదా నెగెబు ప్రాంతంలోని
  rationale: నֶגֶב ఇక్కడ భౌగోళిక ప్రాంతనామంగా ఉండవచ్చు. ‘నెగెబు’ను ఉంచడం ఆ అవకాశాన్ని కాపాడుతుంది; సాధారణంగా ‘దక్షిణ ప్రాంతం’ అనే అర్థాన్ని పాదసూచికలో ఇస్తున్నాం.
- source_word: בְּאֵר שָׁבַע
  choice: బెయేర్షెబా
  rationale: ఈ స్థలనామానికి తెలుగులో సులభంగా గుర్తించదగిన లిప్యంతరీకరణ.
