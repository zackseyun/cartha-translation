translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రయాణ క్రమం స్పష్టంగా ఉండేలా సహజమైన వాక్య నిర్మాణం వాడబడింది. స్థలనామాలు, జాతినామాలు గౌరవప్రదమైన బైబిలు వచన శైలికి తగిన లిప్యంతరీకరణలో ఇవ్వబడ్డాయి.
