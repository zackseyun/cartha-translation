source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק דְּבַר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב וְ/עַ֖ל שָׂרֵ֣י הֶ/חָ֑יִל וַ/יֵּצֵ֨א יוֹאָ֜ב וְ/שָׂרֵ֤י הַ/חַ֨יִל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ לִ/פְקֹ֥ד אֶת הָ/עָ֖ם אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: te
  text: అయితే రాజు మాట యోవాబుపైనా సైన్యాధిపతులపైనా పైచేయి సాధించింది. కాబట్టి యోవాబు, సైన్యాధిపతులు ఇశ్రాయేలు ప్రజలను లెక్కించడానికి రాజు సమక్షం నుండి బయలుదేరారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ אֶל־יוֹאָב וְעַל שָׂרֵי הֶחָיִל
  choice: రాజు మాట యోవాబుపైనా సైన్యాధిపతులపైనా పైచేయి సాధించింది
  rationale: חזק అనే క్రియ ఇక్కడ రాజాజ్ఞ వారి అభ్యంతరాన్ని అధిగమించి అమలులోకి వచ్చిందనే భావాన్ని ఇస్తుంది. ‘పైచేయి సాధించింది’ ఆ ప్రతిఘటన భావాన్ని నిలుపుతూ సహజమైన తెలుగును అందిస్తుంది.
- source_word: שָׂרֵי הֶחָיִל
  choice: సైన్యాధిపతులు
  rationale: ఈ సందర్భంలో חיל సైన్యాన్ని, שרים దాని అధికారులను సూచిస్తున్నాయి.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షం నుండి
  rationale: హీబ్రూ పదబంధంలోని ‘రాజు ఎదుటి నుండి’ అనే రాజసభా సందర్భాన్ని సహజమైన గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలను లెక్కించడానికి
  rationale: פקד కు అనేక అర్థాలు ఉన్నా, ఈ జనగణన సందర్భంలో ‘లెక్కించడం’ స్పష్టమైన భావం; appositional ‘ప్రజలను—ఇశ్రాయేలును’ తెలుగులో సహజంగా ‘ఇశ్రాయేలు ప్రజలను’ అయింది.
theological_decisions:
- issue: రాజు మాట యోవాబు మరియు అధికారుల ప్రతిఘటనను అధిగమించిన తీరు
  choice: వారిపైనా పైచేయి సాధించింది
  alternative: వారికి వ్యతిరేకంగా బలపడింది / వారిమీద చెల్లింది
  rationale: మూలంలోని אל/על మరియు חזק కలయికలో ఉన్న ప్రతిఘటన, అధికారబలం రెండింటినీ ఉంచుతుంది; వారి సమ్మతి లేదా స్వచ్ఛంద అంగీకారాన్ని అనవసరంగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. వాక్య సంబంధాన్ని స్పష్టంచేయడానికి రెండవ భాగంలో ‘కాబట్టి’ వాడబడింది; మూలంలోని వరుస సంఘటనల కారణసంబంధాన్ని ఇది సహజంగా తెలియజేస్తుంది.
