source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛ד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד נִפְּלָה נָּ֤א בְ/יַד יְהוָה֙ כִּֽי רַבִּ֣ים רחמ/ו וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: te
  text: అప్పుడు దావీదు గాదుతో, “నేను చాలా తీవ్ర సంకటంలో ఉన్నాను. దయచేసి మనం యాహ్వే చేతిలో పడదాం; ఎందుకంటే ఆయన కనికరాలు అనేకం[a]. అయితే మనిషి చేతిలో మాత్రం నేను పడకూడదు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన కనికరం అపారం.” హీబ్రూలో అక్షరార్థంగా, “ఆయన కనికరాలు అనేకం.”
    reason: lexical_alternative
  - marker: b
    text: “మనిషి చేతిలో” అంటే మానవ అధికారానికి లేదా అదుపుకు లోబడటం.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: నేను చాలా ఇరుకులో ఉన్నాను
  rationale: వ్యక్తిగతమైన తీవ్రమైన సంకటస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נִפְּלָה נָּא
  choice: దయచేసి మనం ... పడదాం
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్‌ను ‘మనం ... పడదాం’గా ఉంచి, נָא లోని వేడుకోలును ‘దయచేసి’తో తెలిపింది.
- source_word: בְיַד יְהוָה
  choice: యెహోవా చేతిలో
  rationale: ఒకరి అధికారానికి లేదా అదుపుకు అప్పగించబడటం అనే హీబ్రూ నుడికారాన్ని నిలుపుతుంది; దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: כִּי רַבִּים רחמיו
  choice: ఎందుకంటే ఆయన కనికరాలు అనేకం
  rationale: ‘ఆయన కనికరాలు అనేకం’ అనే మూలంలోని బహువచన రూపాన్నీ సమృద్ధి భావాన్నీ సంరక్షిస్తుంది.
- source_word: וּבְיַד אָדָם
  choice: అయితే మనిషి చేతిలో మాత్రం
  rationale: యెహోవా చేతికీ మానవ అధికారానికీ మధ్య ఉన్న ఏకవచన అలంకారిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: אַל אֶפֹּלָה
  choice: నేను పడకూడదు
  rationale: దావీదు వ్యక్తపరచిన ప్రతికూల కోరికను సహజమైన తెలుగులో అందిస్తుంది; ముందున్న బహువచనానికీ ఇక్కడి ఏకవచనానికీ మధ్య తేడాను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- issue: אָדָם ను యెహోవాతో వ్యత్యాసంగా చూపడం
  choice: మనిషి
  alternative: మనుషులు / మానవుల చేతులు
  rationale: హీబ్రూ ఏకవచన సాధారణ నామాన్ని, అలాగే ‘యెహోవా చెయ్యి—మనిషి చెయ్యి’ అనే ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- issue: נִפְּלָה మరియు אֶפֹּלָה మధ్య సంఖ్యా మార్పు
  choice: మనము పడదాం ... నేను పడకూడదు
  alternative: నేను పడతాను ... నేను పడకూడదు
  rationale: మొదటి క్రియలోని బహువచనాన్నీ చివరి క్రియలోని ఏకవచనాన్నీ అలాగే ఉంచి, దావీదు ప్రజలతో తనను కలుపుకోవడం మరియు చివర్లో తన కోరికను వ్యక్తిగతంగా చెప్పడం మధ్యనున్న ఉద్వేగాన్ని పరిష్కరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చేతిలో పడటం’ అనే తెలుగు నుడికారం హీబ్రూ రూపకాన్ని సులభంగా మోస్తుంది. మూలంలోని ‘మనం’ నుంచి ‘నేను’కు మార్పును ఉద్దేశపూర్వకంగా నిలిపాం.
