id: 2SA.24.10
reference: 2 Samuel 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤ךְ לֵב דָּוִד֙ אֹת֔/וֹ אַחֲרֵי כֵ֖ן סָפַ֣ר אֶת הָ/עָ֑ם וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל יְהוָ֗ה חָטָ֤אתִי מְאֹד֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/עַתָּ֣ה יְהוָ֔ה הַֽעֲבֶר נָא֙ אֶת עֲוֺ֣ן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: te
  text: దావీదు ప్రజలను లెక్కించిన[a] తరువాత, అతని హృదయం అతన్ని గుచ్చింది[b]. అప్పుడు దావీదు యాహ్వేతో, “నేను చేసిన దానిలో ఘోరంగా పాపం చేశాను. ఇప్పుడు యాహ్వే, దయచేసి నీ సేవకుని దోషాన్ని[c] తొలగించు; ఎందుకంటే నేను చాలా మూర్ఖంగా ప్రవర్తించాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రజల జనాభాను లెక్కించిన”; అంటే, జనగణన చేసిన.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దావీదు హృదయం అతన్ని కొట్టింది.” ఇది అతని అంతరంగ పశ్చాత్తాపాన్నీ మనస్సాక్షి కలతనూ తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా “నీ సేవకుని అక్రమాన్ని.” హీబ్రూ పదం అక్రమం, దోషభారం, లేదా కొన్నిసార్లు పాపం వల్ల కలిగే శిక్షను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: అతని హృదయం అతన్ని గుచ్చింది
  rationale: హీబ్రూ వాక్యంలోని ‘హృదయం అతన్ని కొట్టింది’ అనే బలమైన రూపకాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది; ఇది అంతరంగ పశ్చాత్తాపాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: סָפַר אֶת־הָעָם
  choice: ప్రజలను లెక్కించిన
  rationale: సָפַר అనే క్రియకు ప్రాథమికంగా ‘లెక్కించు’ అనే అర్థం ఉంది. సందర్భంలో ఇది జనగణన చేయడాన్ని సూచించగలిగినా, మూలంలోని సాధారణ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: חָטָאתִי מְאֹד
  choice: ఘోరంగా పాపం చేశాను
  rationale: మְאֹד అనే తీవ్రతను తెలుగులో సహజంగా, దావీదు ఒప్పుకోలులోని గంభీరతతో వ్యక్తం చేస్తుంది.
- source_word: הַעֲבֶר נָא
  choice: దయచేసి … తొలగించు
  rationale: హిఫీల్ రూపం ఇక్కడ దోషాన్ని పోగొట్టమనే ప్రార్థన. נָא లోని విన్నప భావాన్ని ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: עֲוֺן עַבְדְּךָ
  choice: నీ సేవకుని దోషాన్ని
  rationale: עָוֹן పాపం, దోషభారం లేదా దాని శిక్షను సూచించగలదు. పాపాంగీకారం తరువాతి క్షమాపణ విన్నపంలో ‘దోషం’ ఈ అర్థవిస్తృతిని తగినంతగా నిలుపుతుంది.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: ఎందుకంటే నేను చాలా మూర్ఖంగా ప్రవర్తించాను
  rationale: క్రియలోని ‘మూర్ఖంగా ప్రవర్తించు’ అనే క్రియాశీల భావాన్నీ, מְאֹד తీవ్రతనూ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: עָוֹן యొక్క భావం
  choice: దోషం
  alternative: అక్రమం; దోషశిక్ష
  rationale: ఈ పదం చేసిన పాపాన్నీ, దాని వల్ల కలిగే దోషభారాన్నీ, కొన్నిసార్లు శిక్షనూ సూచించగలదు. ఇక్కడ దావీదు పాపాన్ని ఒప్పుకొని దాన్ని తొలగించమని అడుగుతున్నందున ‘దోషం’ సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. మూలంలోని హృదయ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని నుడికారార్థాన్ని పాదసూచికలో వివరించాం. దైవనామాన్ని ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
