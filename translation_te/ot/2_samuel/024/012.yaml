id: 2SA.24.12
reference: 2 Samuel 24:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: te
  text: '“దావీదు దగ్గరకు వెళ్లి అతనితో మాట్లాడు: ‘యాహ్వే ఇలా అంటున్నాడు: నేను నీ ముందు మూడు విషయాలను ఉంచుతున్నాను. వాటిలో ఒకదాన్ని నీకోసం ఎంచుకో; నేను దానిని నీకు చేస్తాను.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: నీవు వెళ్లి ... ఇలా చెప్పు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ ఆజ్ఞను బలపరుస్తుంది; ఆధునిక తెలుగులో సహజమైన ఆజ్ఞా క్రమంగా అనువదించబడింది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని సహజమైన, గంభీరమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: שָׁלֹשׁ
  choice: మూడు విపత్తులను
  rationale: మూలంలో నామవాచకం లేక కేవలం ‘మూడు’ అని ఉంది. తరువాతి సందర్భం ఇవి శిక్షాత్మక విపత్తులని స్పష్టం చేస్తుంది; తెలుగులో వాక్యం సహజంగా ఉండేందుకు సూచిత నామవాచకం చేర్చబడింది, దానికి పాదసూచిక ఇచ్చబడింది.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: నేను ... నీ ముందు ఉంచుతున్నాను
  rationale: ఎంచుకోవడానికి మూడు పరిణామాలను ప్రతిపాదిస్తున్న సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నీ మీద మోపుతున్నాను’ అనే సాధ్యమైన మరింత అక్షరార్థాన్ని సందర్భం కారణంగా తీసుకోలేదు.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: వాటిలో ఒకదాన్ని నీకోసం నీవే ఎంచుకో
  rationale: భాగసూచక నిర్మాణాన్నీ, לְךָ ద్వారా వ్యక్తమయ్యే దావీదు వ్యక్తిగత ఎంపిక బాధ్యతనూ నిలుపుతుంది.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: దాన్ని నేను నీకు చేస్తాను
  rationale: తీర్పు సందర్భంలోని ప్రతికూల భావాన్ని అతిగా విపులీకరించకుండా మూలంలోని సాధారణ עשׂה క్రియను ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన రూపంతో ఇచ్చాం.
- issue: మూడు అనే సంఖ్యకు సూచిత నామవాచకం
  choice: మూడు విపత్తులు
  alternative: మూడు విషయాలు / మూడు ఎంపికలు
  rationale: తదుపరి వచనంలోని సందర్భం వాటిని తీర్పు రూపాలుగా గుర్తిస్తుంది. అయినా హీబ్రూలో నామవాచకం స్పష్టంగా లేదనే అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవక్తీయ సందేశానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణం. ప్రత్యక్ష సంభాషణలో ‘నీవు’ రూపం ఉపయోగించబడింది.
