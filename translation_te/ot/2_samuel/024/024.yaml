source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: te
  text: అయితే రాజు అరౌనాతో, “లేదు! నేను దానిని నీ దగ్గర నుంచే తప్పకుండా ధర చెల్లించి కొంటాను. నాకు ఏమీ ఖర్చు కాని[a] దహనబలులను నా దేవుడైన యాహ్వేకు అర్పించను” అన్నాడు. అప్పుడు దావీదు ఆ నూర్పిడి కళ్లాన్ని, పశువులను[b] యాభై వెండి షెకెలులకు కొన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఉచితంగా” లేదా “ఏమీ లేకుండా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎద్దులను.” హీబ్రూ పదం పశువులను సమూహంగా గానీ, పని లేదా బలి కోసం వాడే ఎద్దులను ప్రత్యేకంగా గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 1 దినవృత్తాంతాలు 21:25లో దావీదు ఆ స్థలానికి ఆరు వందల షెకెలుల బంగారం చెల్లించాడు; ఇక్కడ నూర్పిడి కళ్లం, పశువుల ధరగా యాభై షెకెలుల వెండి పేర్కొనబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: అరౌనా
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం; దినవృత్తాంతాల సమాంతర వచనంలోని ‘ఒర్నాను’ రూపాన్ని ఇక్కడికి మార్చలేదు.
- source_word: קָנוֹ אֶקְנֶה
  choice: తప్పకుండా … కొంటాను
  rationale: క్రియతో కూడిన infinitive absolute కొనుగోలు చేయాలనే దావీదు దృఢనిశ్చయాన్ని బలపరుస్తుంది; ఆధునిక తెలుగులో ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: בִּמְחִיר
  choice: వెల చెల్లించి
  rationale: మְחִיר కొనుగోలు ధరను సూచిస్తుంది; ఉచితంగా తీసుకోననే సందర్భానికి ఈ ప్రయోగం స్పష్టంగా సరిపోతుంది.
- source_word: לַיהוָה אֱלֹהַי
  choice: నా దేవుడైన యాహ్వేకు
  rationale: మొదటి పురుష ఏకవచన సంబంధాన్ని నిలిపి, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా ధ్వన్యనుకరించాం.
- source_word: עֹלוֹת
  choice: దహనబలులను
  rationale: బలిపీఠం మీద పూర్తిగా దహనం చేసే బలులను సూచించే స్థిరమైన, సాధారణ తెలుగు పదం.
- source_word: חִנָּם
  choice: నాకు ఏమీ ఖర్చు కాని
  rationale: పదానికి అక్షరార్థంగా ‘ఉచితంగా/ఏమీ లేకుండా’ అనే భావం ఉంది; ఈ సందర్భంలో దావీదుకు వ్యక్తిగత వ్యయం లేని అర్పణలని సహజ తెలుగులో వ్యక్తపరుస్తుంది, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הַגֹּרֶן
  choice: నూర్పిడి కళ్లం
  rationale: ధాన్యాన్ని నూర్చే ప్రదేశాన్ని సూచించే వ్యవసాయ సంబంధమైన నిర్దిష్ట పదబంధం.
- source_word: הַבָּקָר
  choice: పశువులను
  rationale: בָּקָר సమూహార్థంలో పశువులను, సందర్భానుసారం ప్రత్యేకంగా ఎద్దులను సూచించవచ్చు; మూలంలోని విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: యాభై షెకెలుల వెండికి
  rationale: కొనుగోలు ధరగా ఇచ్చిన వెండి బరువును సహజమైన తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరగా తెలుగులో ధ్వన్యనుకరించాం.
- issue: ధర చెల్లించని బలులపై దావీదు మాట
  choice: నాకు ఏమీ ఖర్చు కాని దహనబలులు
  alternative: ఉచితమైన దహనబలులు / ఏమీ లేకుండా దహనబలులు
  rationale: חִנָּם యొక్క ‘ఉచితంగా’ అనే భావాన్ని సందర్భంలో దావీదు భరించే వ్యయంతో అనుసంధానించాం; అయినా దాన్ని సూత్రబద్ధమైన బలిదాన సిద్ధాంతంగా విస్తరించలేదు.
- issue: 2 సమూయేలు 24:24 మరియు 1 దినవృత్తాంతాలు 21:25లోని ధరలు
  choice: ఈ వచనంలోని యాభై వెండి షెకెలులను యథాతథంగా ఉంచడం
  alternative: ఆరు వందల బంగారు షెకెలులతో సమన్వయపరచడం
  rationale: వచనాల మధ్య ఉన్న వివరభేదాన్ని ప్రధాన పాఠ్యంలో మార్చి పరిష్కరించకుండా, సమాంతర వచనాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘వద్దు!’ మరియు ‘తప్పకుండా’ ద్వారా రాజు నిరాకరణ, కొనుగోలు సంకల్పంలోని బలాన్ని నిలిపాం. వ్యవసాయ-బలి సందర్భానికి తగిన ‘నూర్పిడి కళ్లం’, ‘దహనబలులు’ వంటి స్థిర పదాలను ఉపయోగించాం.
