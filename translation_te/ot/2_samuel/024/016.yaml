  revision_rationale: ప్రారంభంలోని “దానివైపు” తొలగించి, మూలంలోని లె-ఉద్దేశార్థక నిర్మాణాన్ని “యెరూషలేమును నాశనం చేయడానికి” ద్వారా స్పష్టంగా, సహజంగా వ్యక్తం చేశాను. “అప్పుడు” తొలగించడం ద్వారా చివరి వాక్యంలోని సాధారణ కథన-సంధి తెలుగులో అనవసర కాలసూచన లేకుండా నిలిచింది. పాదసూచిక గుర్తులు వాటి సంబంధిత పదబంధాలకు సరిగ్గా అమర్చబడ్డాయి; వాటి విషయాన్ని మార్చలేదు.
