  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: te
  text: దూత యెరూషలేమును నాశనం చేయడానికి తన చెయ్యి చాపినప్పుడు, యెహోవా ఆ విపత్తు విషయమై మనసు మార్చుకొని[a] ప్రజలను నాశనం చేస్తున్న దూతతో, “చాలు; ఇప్పుడు నీ చెయ్యి వెనక్కి తీసుకో” అన్నాడు. యెహోవా దూత యెబూసీయుడైన అరౌనా కళ్లం దగ్గర ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా ఆ విపత్తును కలిగించకుండా వెనుదిరిగాడు.” హీబ్రూలో అక్షరార్థంగా, “ఆ విపత్తు విషయమై మనసు మార్చుకున్నాడు” అని ఉంది. ఇక్కడ רָעָה అంటే నైతిక చెడు కాదు, విపత్తు.
    reason: lexical_alternative
  - marker: b
    text: 1 దినవృత్తాంతములు 21:15లో అరౌనా పేరు “ఒర్నాను” అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: తన చెయ్యి చాపినప్పుడు
  rationale: שׁלח + יד అనే హీబ్రూ నుడికారం చర్య చేయడానికి చెయ్యి చాపడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేలా కాలసంబంధ ఉపవాక్యంగా అనువదించబడింది.
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ సందర్భంలో ఇది తెగులు ద్వారా తీర్పును అమలు చేసే పరలోక దూతను సూచిస్తుంది; తెలుగు బైబిలు భాషలో ‘దూత’ సహజమైన పదం.
- source_word: לְשַׁחֲתָהּ
  choice: దానిని నాశనం చేయడానికి
  rationale: స్త్రీలింగ ప్రత్యయం యెరూషలేమును తిరిగి సూచిస్తుంది; שׁחת యొక్క విధ్వంసక భావాన్ని ‘నాశనం చేయడానికి’ నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: యెహోవా ఆ విపత్తు విషయమై మనసు మార్చుకొని
  rationale: నిఫాల్ נחם ఇక్కడ ప్రకటిత తీర్పును కొనసాగించకుండా వెనుదిరగడాన్ని సూచిస్తుంది. אֶל భావాన్ని ‘విషయమై’ నిలుపుతూ, רָעָהను నైతిక చెడుగా కాక సందర్భానుసారంగా ‘విపత్తు’గా అనువదించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తినామంగా నిలిపింది.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: ప్రజలను నాశనం చేస్తున్న దూతతో
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న విధ్వంసక చర్యను సూచిస్తుంది; తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంతో అనువదించింది.
- source_word: רַב
  choice: చాలు
  rationale: ఇక్కడ רַב ఆపమని చెప్పే సంక్షిప్త ఉద్గారం; ‘చాలు’ దాని బలాన్ని సహజంగా అందిస్తుంది.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: ఇప్పుడు నీ చెయ్యి వెనక్కి తీసుకో
  rationale: הרף చర్యను నిలిపివేయమనే అర్థం ఇస్తుంది; చెయ్యి అనే ప్రతిమను నిలుపుతూ తెలుగు నుడికారంలో స్పష్టంగా అనువదించింది.
- source_word: וּמַלְאַךְ יְהוָה
  choice: అప్పుడు యెహోవా దూత
  rationale: ו కథనాన్ని ముందుకు నడిపిస్తుంది; ‘యెహోవా దూత’ అనే మూలపాఠ designation‌ను అలాగే ఉంచి దూత స్వరూపంపై అదనపు నిర్ణయం చేయదు.
- source_word: הָיָה עִם
  choice: దగ్గర ఉన్నాడు
  rationale: עִם ఇక్కడ స్థలసామీప్యాన్ని సూచిస్తుంది; ‘దగ్గర ఉన్నాడు’ ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
- source_word: גֹּרֶן
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చి తూర్పారబట్టే స్థలానికి ‘కళ్లం’ ఖచ్చితమైన, సంక్షిప్త తెలుగు వ్యవసాయపదం.
- source_word: הָאֹרְנָה
  choice: అరౌనా
  rationale: సమూయేలు గ్రంథంలోని నామరూపాన్ని తెలుగు లిప్యంతరీకరణలో నిలిపింది; దినవృత్తాంతములలోని ‘ఒర్నాను’ రూపాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: וַיִּנָּחֶם יְהוָהలో దేవుని గురించి మానవానుభవ భాష
  choice: యెహోవా ఆ విపత్తు విషయమై మనసు మార్చుకొని
  alternative: యెహోవా ఆ విపత్తును గూర్చి పశ్చాత్తాపపడ్డాడు; యెహోవా విపత్తు కలిగించకుండా వెనుదిరిగాడు
  rationale: మూలపాఠం దేవుడు తదుపరి తీర్పును నిలిపివేసినట్లు వర్ణిస్తుంది. ‘మనసు మార్చుకొని’ ఆ వర్ణనలోని ఉద్రిక్తతను నిలుపుతుంది; ‘విపత్తు’ అనే పదం నైతిక దోషమనే అపార్థాన్ని నివారిస్తుంది. పాదసూచిక ప్రత్యామ్నాయాన్ని ఇస్తుంది.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: దైవ ప్రత్యక్షత; సృష్టించబడిన పరలోక దూత
  rationale: వచనం ఆ వ్యక్తిని ‘యెహోవా దూత’ అని మాత్రమే పేర్కొంటుంది; అతని తాత్త్విక స్వరూపాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చెయ్యి చాపడం/వెనక్కి తీసుకోవడం’ అనే మూలపాఠ ప్రతిమను నిలిపింది. ‘కళ్లం’ సాధారణ వ్యవసాయపదం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
