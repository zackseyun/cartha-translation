    issue: ప్రారంభ ఉపవాక్యంలో అనవసర ద్విరుక్తి ఉంది.
    rationale: “యెరూషలేమును నాశనం చేయడానికి” ఇప్పటికే దూత చెయ్యి చాపిన లక్ష్యాన్ని తెలియజేస్తుంది. వెంటనే “దానివైపు” చేర్చడం మూలపాఠంలో లేని పునరుక్తి, తెలుగులో కొద్దిగా అసహజమైన నిర్మాణాన్ని కలిగిస్తుంది.
  revised_text: దూత యెరూషలేమును నాశనం చేయడానికి తన చెయ్యి చాపినప్పుడు, యెహోవా ఆ విపత్తు విషయమై మనసు మార్చుకొని[a] ప్రజలను నాశనం చేస్తున్న దూతతో, “చాలు; ఇప్పుడు నీ చెయ్యి వెనక్కి తీసుకో” అన్నాడు. యెహోవా దూత యెబూసీయుడైన అరౌనా కళ్లం దగ్గర ఉన్నాడు.[b]
