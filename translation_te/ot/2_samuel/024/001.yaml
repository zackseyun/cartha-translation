  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: te
  text: యాహ్వే కోపం ఇశ్రాయేలుమీద మళ్లీ రగులుకుంది[a]. ఆయన దావీదును వారికి వ్యతిరేకంగా[c] పురికొల్పి, “వెళ్లి ఇశ్రాయేలును, యూదాను లెక్కించు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 21:1లో సాతాను ఇశ్రాయేలుకు వ్యతిరేకంగా నిలబడి దావీదును పురికొల్పాడని ఉంది. ఇక్కడి ప్రధాన పాఠం 2 సమూయేలు హీబ్రూ వాక్యంలో సహజంగా కనిపించే కర్తను అనుసరిస్తూ, రెండు వృత్తాంతాలను బలవంతంగా సమన్వయపరచకుండా వాటి మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
    reason: cross_reference
  - marker: b
    text: లేదా “సంఖ్య తీయి”; సందర్భార్థంగా “జనగణన చేయి.”
    reason: lexical_alternative
  - marker: c
    text: “వారికి వ్యతిరేకంగా” అని అనువదించిన హీబ్రూ పదబంధం క్లిష్టమైనది; “వారి మధ్య” లేదా “వారి విషయంలో” అనే అర్థాలు కూడా సాధ్యమే.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּסֶף ... לַחֲרוֹת
  choice: మళ్లీ రగులుకుంది
  rationale: వ renewed actionను సూచించే וַיֹּסֶף భావాన్నీ, חרה אף అనే ‘కోపం మండడం’ రూపకాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַף
  choice: కోపం
  rationale: అక్షరార్థంగా ‘ముక్కు’ అయినా, ఈ హీబ్రూ ప్రయోగంలో కోపాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: ఈ కోపప్రయోగంలో בְ విరోధ దిశను సూచిస్తుంది; తెలుగులో ‘మీద’ సహజంగా ఉంది.
- source_word: וַיָּסֶת
  choice: పురికొల్పి
  rationale: סות హిఫీల్ రూపంలోని ప్రేరేపించడం లేదా ఒక చర్యకు ఉసిగొల్పడం అనే కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: בָּהֶם
  choice: వారికి వ్యతిరేకంగా
  rationale: ఈ క్లిష్టమైన పదబంధాన్ని జనులపై ప్రభావం చూపే చర్యకు దావీదును ప్రేరేపించడంగా సందర్భానుసారం అనువదించింది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపింది.
- source_word: מְנֵה
  choice: లెక్కించు
  rationale: מנה క్రియకు నేరమైన అర్థం ‘లెక్కించు’; జనగణన చేయడం సందర్భార్థమైన విస్తరణ.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: ఇశ్రాయేలును, యూదాను
  rationale: మూలంలోని రెండు సమూహాల పేర్లను వివరణాత్మక విస్తరణ లేకుండా అలాగే ఉంచుతుంది.
theological_decisions:
- issue: 1 దినవృత్తాంతాలు 21:1తో పోల్చినప్పుడు దావీదును పురికొల్పిన కర్త ఎవరు?
  choice: ఆయన దావీదును ... పురికొల్పి
  alternative: సాతాను దావీదును పురికొల్పాడు; లేదా ఎవరో దావీదును పురికొల్పారు
  rationale: 2 సమూయేలు హీబ్రూ వాక్యంలో וַיָּסֶת క్రియకు సహజమైన కర్త ముందున్న యాహ్వే. 1 దినవృత్తాంతాలు 21:1లోని సాతాను ప్రస్తావనను ఇక్కడికి దిగుమతి చేయకుండా, రెండు వృత్తాంతాల మధ్య ఉన్న ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదటిప్పణి నిలుపుతున్నాయి.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘యాహ్వే’ అనే వ్యక్తినామాన్ని నిలిపి, కోపం ‘రగులుకోవడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా వ్యక్తం చేసింది. ఆజ్ఞలో ఏకవచన సంబోధనను తెలుగు క్రియారూపాల ద్వారా స్పష్టంగా ఉంచింది.
