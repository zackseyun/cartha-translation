source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: te
  text: రాజైన అరౌనా ఇవన్నీ రాజుకు ఇచ్చాడు.[a] అరౌనా రాజుతో, “నీ దేవుడైన యాహ్వే నిన్ను అంగీకరించుగాక[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా ‘రాజైన అరౌనా’ అని ఉంది. అరౌనాకు రాజపదవి ఉన్నట్లు సూచించకుండా ఉండేందుకు కొన్ని అనువాదాలు ఈ అసాధారణమైన బిరుదును తొలగిస్తాయి; ఇక్కడ అది మూలపాఠం ప్రకారం నిలుపబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నీ పట్ల ప్రసన్నుడగుగాక,’ లేదా ‘నీకు అనుగ్రహం చూపుగాక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: ఇవన్నీ
  rationale: ముందటి వచనంలో బలికోసం ప్రతిపాదించిన వస్తువులన్నిటినీ సమగ్రంగా సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: కథన సందర్భంలోని సంపూర్ణ క్రియను సాధారణ భూతకాలంగా అనువదిస్తుంది.
- source_word: אֲרַוְנָה הַמֶּלֶךְ
  choice: రాజైన అరౌనా
  rationale: అసాధారణమైనప్పటికీ, అరౌనాకు హీబ్రూ పాఠం జోడించిన ‘రాజు’ అనే బిరుదును ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజుకు
  rationale: ל ఉపసర్గ ఇక్కడ వస్తువులను స్వీకరించే దావీదును పరోక్ష కర్మగా సూచిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: కథనాన్ని ముందుకు నడిపే వావ్-కన్సిక్యూటివ్‌ను సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చారిత్రక తెలుగు బైబిలు వాడుకలో దైవనామానికి సుపరిచితమైన లిప్యంతరీకరణ; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాన్ని దావీదుకు ఉద్దేశించిన ‘నీ’గా నేరుగా వ్యక్తపరుస్తుంది.
- source_word: יִרְצֶךָ
  choice: నిన్ను అంగీకరించుగాక
  rationale: רצה ఇక్కడ అనుకూలంగా స్వీకరించడాన్ని సూచిస్తుంది; బలి సందర్భాన్ని అతిగా విపులీకరించకుండా భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: అరౌనాకు ‘రాజు’ అనే బిరుదును ఉంచాలా
  choice: ప్రధాన పాఠంలో ‘రాజైన అరౌనా’ అని నిలుపడం
  alternative: ‘అరౌనా’ అని మాత్రమే చదవడం లేదా ‘రాజా’ అనే సంబోధనగా అర్థం చేసుకోవడం
  rationale: మసొరేటిక్ హీబ్రూ పాఠం అక్షరార్థంగా ‘రాజైన అరౌనా’ అని ఉంది. సందర్భంలో అసాధారణంగా అనిపించినా దానిని మౌనంగా సవరించకుండా పాఠ్య ఉద్రిక్తతను నిలిపాం.
- issue: יִרְצֶךָ యొక్క భావం
  choice: నిన్ను అంగీకరించుగాక
  alternative: నీ పట్ల ప్రసన్నుడగుగాక / నీకు అనుగ్రహం చూపుగాక
  rationale: వ్యక్తినే కర్మగా ఉంచే మూల వాక్య నిర్మాణాన్ని కాపాడుతూ, అనుకూల స్వీకార భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని అసాధారణమైన ‘రాజైన అరౌనా’ను ఉద్దేశపూర్వకంగా నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
