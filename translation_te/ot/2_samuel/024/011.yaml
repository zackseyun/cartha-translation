  revision_rationale: The revision aligns the divine-name rendering with the stated POB policy, improves the natural Telugu expression for 'David's seer,' and makes explicit the background/pluperfect force reflected in the English audit trail without altering the verse's meaning. The footnote is updated to use the same divine-name form and to represent the literal 'was to' construction more closely.
