source:
  edition: WLC
  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: te
  text: 'దావీదు ఉదయాన లేచే సమయానికి, దావీదు దర్శియైన గాదు ప్రవక్తకు యాహ్వే వాక్కు ఇప్పటికే వచ్చింది[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “యాహ్వే వాక్కు గాదు ప్రవక్తయొద్ద ఉండింది.”
    reason: הָיָה אֶל అనే హీబ్రూ నిర్మాణంలోని అక్షరార్థమైన “ఉండింది/యొద్ద” భావాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచినప్పుడు
  rationale: קום క్రియ ఇక్కడ దావీదు ఉదయాన లేవడాన్ని సూచిస్తుంది. తరువాతి దైవవాక్య ప్రకటనతో సహజమైన కాలసంబంధాన్ని చూపేందుకు తెలుగు ఉపవాక్యంగా అనువదించబడింది.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన
  rationale: కాలాన్ని సహజమైన, సంక్షిప్త ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּדְבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: ప్రవచన ప్రకటనకు సంబంధించిన స్థిరమైన భావాన్ని ‘వాక్కు’ నిలుపుతుంది; יְהוָה అనే దైవనామం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: הָיָה אֶל
  choice: వచ్చింది
  rationale: ప్రవచన సందర్భాల్లో ‘వాక్కు ఒకరి వద్దకు రావడం’ అనే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు సమానార్థకం. హీబ్రూ రూపంలోని అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: גָּד
  choice: గాదు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הַנָּבִיא
  choice: ప్రవక్త
  rationale: נָבִיא అనే పదవిని నేరుగా, సాధారణంగా అర్థమయ్యే విధంగా అనువదిస్తుంది.
- source_word: חֹזֵה דָוִד
  choice: దావీదుకు దర్శిగా ఉన్న
  rationale: חֹזֶהను ‘ప్రవక్త’తో కలిపివేయకుండా ‘దర్శి’గా ఉంచి, గాదుకు దావీదుతో ఉన్న అధికారిక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే לֵאמֹר భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలుపుతుంది.
- issue: గాదును ప్రవక్తగా, దర్శిగా పేర్కొనడం
  choice: ‘ప్రవక్త’ మరియు ‘దర్శి’ అనే రెండు గుర్తింపులనూ నిలుపడం
  alternative: రెండింటినీ కలిపి కేవలం ‘ప్రవక్త’ అని అనువదించడం
  rationale: נָבִיא మరియు חֹזֶה అనే వేర్వేరు మూలపదాలను సమీకరించకుండా మూలంలోని భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథనశైలి, కాని సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘దర్శి’ అనే పదం ‘ప్రవక్త’కు భిన్నమైన మూలపదాన్ని నిలుపేందుకు ఉద్దేశపూర్వకంగా ఉపయోగించబడింది.
