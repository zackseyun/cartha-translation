  text: וַ/יֵּ֥לֶךְ נָתָ֖ן אֶל בֵּית֑/וֹ וַ/יִּגֹּ֣ף יְהוָ֗ה אֶת הַ/יֶּ֜לֶד אֲשֶׁ֨ר יָלְדָ֧ה אֵֽשֶׁת אוּרִיָּ֛ה לְ/דָוִ֖ד וַ/יֵּאָנַֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: te
  text: అప్పుడు నాతాను తన ఇంటికి వెళ్లాడు. యాహ్వే ఊరియా భార్య దావీదుకు కనిన బిడ్డను దెబ్బతీశాడు[a], ఆ బిడ్డ జబ్బుపడ్డాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాధించాడు” లేదా “పీడించాడు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ఈ క్రియ పుంలింగ ఏకవచనంలో ఉండి బిడ్డను సూచిస్తుంది; “తీవ్రంగా జబ్బుపడ్డాడు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు ... వెళ్లాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: ‘అతని ఇంటికి’ అనే అక్షరార్థాన్ని, కర్త నాతానునే స్పష్టంగా సూచించే సహజ తెలుగు ప్రతిబింబాత్మక రూపంతో అందిస్తుంది.
- source_word: וַיִּגֹּף
  choice: దెబ్బతీయగా
  rationale: నָגַף హానికరంగా కొట్టడం లేదా బాధించడం అనే భావాన్ని కలిగిస్తుంది. ‘దెబ్బతీయగా’ దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలుపుతూ, నిర్దిష్ట తెగులు అని అతివ్యాఖ్య చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: הַיֶּלֶד
  choice: బిడ్డను / ఆ బిడ్డ
  rationale: సందర్భంలో నవజాత లేదా చిన్న బిడ్డ ఉద్దేశించబడినందున ఆధునిక తెలుగులో సహజమైన ‘బిడ్డ’ను ఎంచుకున్నాం.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: ఊరియా భార్య దావీదుకు కనిన బిడ్డను
  rationale: హెబ్రీ సంబంధవాక్య భావాన్ని సహజ తెలుగులో నిలుపుతుంది; బత్షెబ పేరును చేర్చకుండా ‘ఊరియా భార్య’ అనే ఉద్దేశపూర్వక కథన గుర్తింపును కాపాడుతుంది.
- source_word: וַיֵּאָנַשׁ
  choice: ఆ బిడ్డ జబ్బుపడ్డాడు
  rationale: పుంలింగ ఏకవచన క్రియ బిడ్డను సూచిస్తుంది. ‘జబ్బుపడ్డాడు’ అనారోగ్యం కలిగినట్లు చెబుతుంది; తరువాతి వచనంలోని తీవ్రతను ముందుగానే చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన రూపాన్ని ఉపయోగించాం.
- issue: బిడ్డ అనారోగ్యానికి దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: యెహోవా ... బిడ్డను దెబ్బతీయగా
  alternative: యెహోవా ... బిడ్డను బాధించగా
  rationale: మూలపాఠం కార్యాన్ని యెహోవాకే ప్రత్యక్షంగా ఆపాదిస్తుంది. దానిని మృదువుపరచకుండా, అలాగే నిర్దిష్ట వ్యాధి లేదా తెగులుగా అతిగా నిర్ధారించకుండా అనువదించాం.
- issue: ‘ఊరియా భార్య’ అనే గుర్తింపు
  choice: ఊరియా భార్య
  alternative: బత్షెబ
  rationale: ఈ సందర్భంలో మూలపాఠం ఆమె పేరును ఉపయోగించకుండా నైతిక ఉద్రిక్తతను నిలుపుతుంది; అందుచేత అదే గుర్తింపును కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘ఊరియా భార్య’ అనే మూలంలోని నైతికంగా ప్రాముఖ్యమైన పదబంధం యథాతథంగా నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
