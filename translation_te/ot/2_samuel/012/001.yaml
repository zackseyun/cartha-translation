source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే నాతానును దావీదు దగ్గరికి పంపాడు. అతడు దావీదు దగ్గరికి వచ్చి అతనితో ఇలా అన్నాడు: “ఒక పట్టణంలో ఇద్దరు మనుషులు ఉండేవారు—ఒకడు ధనవంతుడు, మరొకడు పేదవాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక పట్టణంలో ఇద్దరు మనుషులు నివసించేవారు.” హీబ్రూ వాక్యం మరింత అక్షరార్థంగా, “ఒక పట్టణంలో ఇద్దరు మనుషులు ఉండేవారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שׁלח అనే క్రియ కథన సందర్భంలో సాధారణంగా ‘పంపాడు’ అని అర్థమిస్తుంది; ఇది ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం יְהוָה ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֶת נָתָן
  choice: నాతానును
  rationale: אֶת కర్మ సూచికకు ప్రత్యేక పదం అవసరం లేదు; נָתָן అనే పేరును ‘నాతాను’గా లిప్యంతరీకరించి ద్వితీయావిభక్తి చేర్చాం.
- source_word: אֶל דָּוִד
  choice: దావీదు దగ్గరికి
  rationale: אֶל ఇక్కడ నాతాను పంపబడిన గమ్యాన్ని సూచిస్తుంది. ‘దగ్గరికి’ తెలుగులో వ్యక్తి వద్దకు పంపడాన్ని సహజంగా తెలియజేస్తుంది; ‘వ్యతిరేకంగా’ అనడం సందర్భాన్ని ముందుగానే వ్యాఖ్యానిస్తుంది.
- source_word: וַיָּבֹא אֵלָיו
  choice: అతడు దావీదు దగ్గరికి వచ్చి
  rationale: בוא + אֶל కు ‘దగ్గరికి వచ్చాడు’ సహజ సమానం. సర్వనామ సూచన స్పష్టత కోసం ‘అతని’ స్థానంలో ‘దావీదు’ అని పునరుక్తి చేశాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో ఇలా అన్నాడు
  rationale: హీబ్రూలోని పరోక్ష కర్మను నిలిపి, ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి తెలుగులో సహజమైన ‘ఇలా’ను చేర్చాం.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: ఇద్దరు మనుషులు
  rationale: ఇది ఇద్దరు పురుష వ్యక్తులను సూచిస్తుంది; ‘ఇద్దరు మనుషులు’ స్పష్టమైన, సాధారణ తెలుగు.
- source_word: הָיוּ
  choice: ఉండేవారు
  rationale: היה ఇక్కడ అస్తిత్వార్థకంగా ఉంది. తెలుగు కథన ప్రారంభంలో ‘ఉండేవారు’ సహజంగా ఉన్నప్పటికీ, ‘నివసించేవారు’ అనే అదనపు భావాన్ని బలవంతంగా చేర్చదు.
- source_word: בְּעִיר אֶחָת
  choice: ఒక పట్టణంలో
  rationale: హీబ్రూ పదబంధంలోని ‘ఒక’ను నిలిపి, עִיר కు ఆధునిక సందర్భానుకూలమైన ‘పట్టణం’ను ఎంచుకున్నాం.
- source_word: אֶחָד עָשִׁיר
  choice: ఒకడు ధనవంతుడు
  rationale: హీబ్రూ సంక్షిప్త నామవాచక వాక్యాన్ని తెలుగులో సహజమైన విధంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶחָד רָאשׁ
  choice: మరొకడు పేదవాడు
  rationale: רָאשׁ అంటే పేద లేదా దరిద్రుడు. ధనవంతునితో నేరుగా వ్యత్యాసం చూపడానికి ‘పేదవాడు’ స్పష్టమైన ఎంపిక; సమన్వయంలోని రెండవ אֶחָד ను సహజ తెలుగులో ‘మరొకడు’గా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని రూపాన్నీ దాని ధార్మిక ఉద్వేగాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘యాహ్వే’ అనే దైవనామాన్ని నిలిపాం. హీబ్రూ వాక్య నిర్మాణంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతూ, సర్వనామ సందిగ్ధతను నివారించడానికి రెండవ వాక్యంలో ‘దావీదు’ను పునరుక్తి చేశాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
