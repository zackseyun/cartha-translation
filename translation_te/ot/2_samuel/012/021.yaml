- from: అప్పుడు అతని సేవకులు అతనితో, “నువ్వు చేసిన ఈ పని ఏమిటి? బిడ్డ బతికున్నప్పుడు నువ్వు ఉపవాసముండి ఏడ్చావు; కానీ బిడ్డ చనిపోగానే లేచి రొట్టె తిన్నావు[a]” అన్నారు.
  to: అప్పుడు అతని సేవకులు అతనితో, “మీరు చేసిన ఈ పని ఏమిటి? బిడ్డ బతికున్నప్పుడు మీరు ఉపవాసముండి ఏడ్చారు; కానీ బిడ్డ చనిపోయినప్పుడు లేచి రొట్టె తిన్నారు[a]” అన్నారు.
