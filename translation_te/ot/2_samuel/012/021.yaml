id: 2SA.12.21
reference: 2 Samuel 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ עֲבָדָי/ו֙ אֵלָ֔י/ו מָֽה הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֣ר עָשִׂ֑יתָה בַּ/עֲב֞וּר הַ/יֶּ֤לֶד חַי֙ צַ֣מְתָּ וַ/תֵּ֔בְךְּ וְ/כַֽ/אֲשֶׁר֙ מֵ֣ת הַ/יֶּ֔לֶד קַ֖מְתָּ וַ/תֹּ֥אכַל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: te
  text: అప్పుడు అతని సేవకులు అతనితో, “మీరు చేసిన ఈ పని ఏమిటి? బిడ్డ బతికున్నప్పుడు మీరు ఉపవాసముండి ఏడ్చారు; కానీ బిడ్డ చనిపోయినప్పుడు లేచి రొట్టె తిన్నారు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రొట్టె తిన్నారు’; ఇది ఆహారం తీసుకోవడం లేదా భోజనం చేయడం అనే అర్థంలో వాడే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ עֲבָדָיו אֵלָיו
  choice: అప్పుడు అతని సేవకులు అతనితో ... అన్నారు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. రాజసభ సందర్భంలో עֲבָדָיו కు ‘సేవకులు’ తగినది.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: నువ్వు చేసిన ఈ పని ఏమిటి?
  rationale: మూలంలోని స్పష్టమైన ప్రశ్నారూపాన్నీ, సేవకుల ఆశ్చర్యాన్నీ నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది; దీనిని కేవలం ‘ఎందుకు ఇలా చేశావు?’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: బిడ్డ బతికున్నప్పుడు
  rationale: సందర్భంలోని కాలసంబంధ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది. יֶלֶד ఇక్కడ దావీదు పసిబిడ్డను సూచిస్తున్నందున ‘బిడ్డ’ ఎంచుకున్నాం.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: నువ్వు ఉపవాసముండి ఏడ్చావు
  rationale: రెండు హీబ్రూ క్రియల అర్థాన్నీ, వాటి క్రమాన్నీ నేరుగా మరియు గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: కానీ బిడ్డ చనిపోగానే
  rationale: ముందటి ప్రవర్తనతో ఉన్న బలమైన వ్యత్యాసాన్ని ‘కానీ’ చూపిస్తుంది; ‘చనిపోగానే’ మరణం తరువాత వెంటనే జరిగిన చర్యల క్రమాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: קַמְתָּ וַתֹּאכַל לָחֶם
  choice: లేచి రొట్టె తిన్నావు
  rationale: קום కు ‘లేచి’ సహజమైనది. לֶחֶם అనే స్పష్టమైన ‘రొట్టె’ పదాన్ని నిలిపి, అది సాధారణంగా భోజనం చేయడాన్ని సూచించే నుడికారమని పాదటిప్పణిలో తెలిపాం.
