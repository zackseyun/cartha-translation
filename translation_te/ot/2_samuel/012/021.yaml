translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీర కథనశైలిని ఉపయోగించాం. సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ రూపాన్ని ఉంచాం; మూలంలోని ఆశ్చర్యం, ఉపవాసం–భోజనం మధ్య వ్యత్యాసం కాపాడబడ్డాయి.
