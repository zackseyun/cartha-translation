  - severity: low
    issue: '''సాష్టాంగపడ్డాడు'' makes full prostration more specific than the Hebrew verb requires.'
    rationale: וַיִּשְׁתָּחוּ can denote bowing in reverence or prostration. 'వంగి నమస్కరించాడు' retains the physical-reverential action while leaving the degree of bowing open.
  - severity: low
    issue: לֶחֶם is translated as 'ఆహారం.'
    rationale: The term can refer metonymically to food, but 'రొట్టె' retains the Hebrew's explicit lexical form and remains natural in this narrative context.
