id: 2SA.12.20
reference: 2 Samuel 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקָם֩ דָּוִ֨ד מֵ/הָ/אָ֜רֶץ וַ/יִּרְחַ֣ץ וַ/יָּ֗סֶךְ וַ/יְחַלֵּף֙ שמלת/ו וַ/יָּבֹ֥א בֵית יְהוָ֖ה וַ/יִּשְׁתָּ֑חוּ וַ/יָּבֹא֙ אֶל בֵּית֔/וֹ וַ/יִּשְׁאַ֕ל וַ/יָּשִׂ֥ימוּ ל֛/וֹ לֶ֖חֶם וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: te
  text: అప్పుడు దావీదు నేలమీదనుండి లేచి, కడుక్కొని, నూనె రాసుకొని, తన బట్టలు మార్చుకున్నాడు. అతడు యాహ్వే మందిరంలోకి వెళ్లి వంగి నమస్కరించాడు.[a] తరువాత అతడు తన ఇంటికి వెళ్లి అడిగాడు; వారు అతని ముందు రొట్టె పెట్టారు, అతడు తిన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరాధించాడు.” హీబ్రూ క్రియ భక్తితో వంగి నమస్కరించడాన్ని లేదా సాష్టాంగపడడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵהָאָרֶץ
  choice: నేలమీద నుంచి లేచి
  rationale: మునుపటి సందర్భంలో దావీదు నేలపై పడి దుఃఖిస్తున్నాడు; కాబట్టి ‘నేలమీద నుంచి లేచి’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: וַיִּרְחַץ
  choice: స్నానం చేసి
  rationale: רחץ కడుక్కోవడం లేదా స్నానం చేయడం అనే అర్థాలు ఇస్తుంది; దుఃఖాచారాన్ని ముగించే ఈ వరుసలో ‘స్నానం చేసి’ సహజమైన తెలుగు.
- source_word: וַיָּסֶךְ
  choice: నూనె రాసుకొని
  rationale: סוך శరీరానికి నూనె పూసుకోవడాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు ‘నూనె రాసుకొని’ స్పష్టంగా ఉంటుంది.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: తన బట్టలు మార్చుకున్నాడు
  rationale: హీబ్రూ ఏకవచన వస్త్రపదం ఇక్కడ వస్త్రధారణను సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: בית יהוה ఆరాధనా స్థలాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ తెలుగు బైబిలు వాడుకలో సహజంగా ఉండి, ఈ కాలంలోని గుడారపు ఆరాధనా స్థలానికీ విస్తృతంగా వర్తిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందించబడింది.
- source_word: וַיִּשְׁתָּחוּ
  choice: సాష్టాంగపడ్డాడు
  rationale: ఈ క్రియ భక్తిపూర్వకంగా వంగడం లేదా నేలపై సాగిలపడడాన్ని సూచిస్తుంది. భౌతిక చర్యను నిలుపుతూ ఆరాధనా సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשְׁאַל
  choice: అడిగాడు
  rationale: మూలంలో కర్మ స్పష్టంగా లేదు. తరువాతి వాక్యం ఆహారం పెట్టారని చెబుతుంది; అయినా మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడేందుకు కర్మను జోడించలేదు.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, భోజనం లేదా ఆహారం మొత్తానికి సూచకంగా వాడవచ్చు. ఈ సందర్భంలో తెలుగులో ‘ఆహారం పెట్టడం’ సహజమైన ప్రయోగం.
- source_word: וַיֹּאכַל
  choice: అతడు తిన్నాడు
  rationale: సాధారణ కథన ముగింపును నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: וַיִּשְׁתָּחוּలో భౌతిక నమస్కారం మరియు ఆరాధన మధ్య భావసంబంధం
  choice: సాష్టాంగపడ్డాడు
  alternative: ఆరాధించాడు
  rationale: మూలక్రియ భౌతికంగా వంగి నమస్కరించడాన్ని సూచించగలదు; సందర్భంలో అది ఆరాధనగా కూడా అర్థమవుతుంది. ప్రధాన పాఠం భౌతిక చర్యను నిలుపుతుంది; పాదటిప్పణి ఆరాధనా భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. వరుస హీబ్రూ క్రియలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా కలిపినా, చర్యల క్రమం యథాతథంగా ఉంచబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
