source:
  edition: WLC
  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: te
  text: అయినా[a], ఈ విషయం ద్వారా నీవు యాహ్వే శత్రువులను తీవ్రంగా ధిక్కరించావు కాబట్టి, నీకు పుట్టిన కుమారుడు తప్పకుండా చనిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అనేక అనువాదాలు ఈ క్లిష్టమైన హీబ్రూ వాక్యాన్ని వ్యాఖ్యానాత్మకంగా లేదా పాఠాన్ని సవరించి, ‘నీవు యాహ్వే శత్రువులకు ఆయనను నిందించడానికి లేదా దూషించడానికి అవకాశం ఇచ్చావు’ అని అనువదిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: అయినా
  rationale: మునుపటి క్షమాపణ ప్రకటనకు బలమైన వ్యతిరేక మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ప్రకటించబడిన పరిణామానికి కారణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִאֵץ נִאַצְתָּ
  choice: పూర్తిగా తృణీకరించావు
  rationale: ధాతువు వ్యక్తం చేసే ధిక్కార భావాన్నీ, infinitive absolute వల్ల వచ్చే తీవ్రతనూ నిలుపుతుంది.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: యాహ్వే శత్రువులను
  rationale: ఇచ్చిన మసొరెటిక్ పాఠంలో ప్రత్యక్ష కర్మగా ఉన్న పదబంధాన్ని యథాతథంగా అనుసరిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ధ్వన్యనుకరణను ఇస్తుంది.
- source_word: בַּדָּבָר הַזֶּה
  choice: ఈ విషయం ద్వారా
  rationale: דבר ఇక్కడ సూచించే మొత్తం వ్యవహారం లేదా కార్యాన్ని విస్తృతంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: నీకు పుట్టిన కుమారుడు
  rationale: בן లోని పుంలింగ నిర్దిష్టతను, passive participle భావాన్ని నిలుపుతుంది.
- source_word: מוֹת יָמוּת
  choice: తప్పకుండా చనిపోతాడు
  rationale: infinitive absolute మరియు finite verb కలయిక వ్యక్తం చేసే నిశ్చితమైన తీవ్రతను సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ‘యాహ్వే శత్రువులు’ ఉన్న వాక్యభాగంలో కర్త–కర్మ సంబంధం
  choice: మసొరెటిక్ పాఠాన్ని నేరుగా అనుసరించి, దావీదు ‘యాహ్వే శత్రువులను పూర్తిగా తృణీకరించాడు’ అని ప్రధాన పాఠంలో ఉంచడం.
  alternative: దావీదు యాహ్వే శత్రువులు ఆయనను నిందించడానికి లేదా దూషించడానికి అవకాశం ఇచ్చాడని అర్థం చేసుకోవడం.
  rationale: ఇచ్చిన హీబ్రూ వ్యంజన పాఠంలో אֵת వల్ల ‘యాహ్వే శత్రువులు’ ప్రత్యక్ష కర్మగా అత్యంత సహజంగా చదవబడతారు. సందర్భపరమైన క్లిష్టతను పరిష్కరించే ప్రసిద్ధ వ్యాఖ్యానాత్మక లేదా సవరించిన పఠనాన్ని ప్రధాన పాఠంలోకి చొప్పించకుండా పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: సామాన్య ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. క్లిష్టమైన మసొరెటిక్ పాఠాన్ని సరళీకరించకుండా ప్రధాన వాక్యంలో నిలిపి, విస్తృతంగా అనుసరించే ప్రత్యామ్నాయ పఠనాన్ని [a] పాదసూచికలో ఇచ్చాం.
