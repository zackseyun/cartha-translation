  text: וְ/עַתָּ֗ה לֹא תָס֥וּר חֶ֛רֶב מִ/בֵּיתְ/ךָ֖ עַד עוֹלָ֑ם עֵ֚קֶב כִּ֣י בְזִתָ֔/נִי וַ/תִּקַּ֗ח אֶת אֵ֨שֶׁת֙ אוּרִיָּ֣ה הַ/חִתִּ֔י לִ/הְי֥וֹת לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, నీ ఇంటి నుండి ఖడ్గం ఎన్నటికీ తొలగిపోదు[a]. ఎందుకంటే నీవు నన్ను తృణీకరించి[b], హిత్తీయుడైన ఊరియా భార్యను నీకు భార్యగా చేసుకున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ ఇల్లు’ అనే హెబ్రీయ ప్రయోగం నీ కుటుంబాన్ని, ఇంటివారిని లేదా రాజవంశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠంలో ‘నన్ను తృణీకరించి’ అని ఉంది; ఊరియాకు, అతని భార్యకు వ్యతిరేకంగా చేసిన అపరాధం దేవునిపట్లనే చూపిన తృణీకారంగా ఇక్కడ చెప్పబడింది.
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి నేరారోపణకు పర్యవసానంగా వచ్చే తీర్పును సూచించే కాలార్థక, కారణానుగత బలాలు రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: ఎన్నటికీ తొలగిపోదు
  rationale: סור యొక్క ‘తొలగిపోవడం/వీడిపోవడం’ అనే భావాన్నీ, עַד עוֹלָם ఇచ్చే దీర్ఘకాలిక తీర్పు బలాన్నీ సహజమైన తెలుగులో కలిపి అందిస్తుంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: హింసాత్మక సంఘర్షణ, తీర్పును సూచించే మూలపాఠంలోని ఖడ్గ రూపకాన్ని నిలుపుతుంది.
- source_word: מִבֵּיתְךָ
  choice: నీ ఇంటి నుండి
  rationale: ‘ఇల్లు’ అనే హెబ్రీయ రూపకాన్ని అలాగే ఉంచి, కుటుంబం, ఇంటివారు, రాజవంశం అనే విస్తృత సంభావ్య పరిధిని కాపాడుతుంది.
- source_word: עֵקֶב כִּי
  choice: ఎందుకంటే
  rationale: ప్రకటించిన తీర్పుకు కారణాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְזִתָנִי
  choice: నీవు నన్ను తృణీకరించి
  rationale: בזה లోని అవమానించడం, హేయంగా చూడడం అనే బలమైన వ్యక్తిగత భావాన్ని నిలుపుతుంది.
- source_word: וַתִּקַּח
  choice: చేసుకున్నావు
  rationale: తరువాతి వివాహ సంబంధ ప్రయోజన వాక్యంతో కలిపి, పూర్తయిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: హిత్తీయుడైన ఊరియా భార్యను
  rationale: ఆమెకు ఊరియాతో ఉన్న వివాహబంధాన్ని ముందుకు తెస్తూ హెబ్రీయ నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: నీకు భార్యగా చేసుకున్నావు
  rationale: ‘నీకు భార్యగా ఉండేందుకు’ అనే హెబ్రీయ ప్రయోజన నిర్మాణాన్ని సహజమైన తెలుగు వివాహప్రయోగంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నన్ను తృణీకరించి’లోని ప్రథమ పురుష సర్వనామ నిర్దేశ్యం
  choice: దేవుణ్ణే నేరుగా సూచించే ‘నన్ను’ను నిలుపడం
  alternative: ‘యెహోవా వాక్యాన్ని/ఆజ్ఞను తృణీకరించి’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: హెబ్రీ పాఠంలో ప్రథమ పురుష ఏకవచన ప్రత్యయం స్పష్టంగా ఉంది. ఊరియా, అతని భార్యకు వ్యతిరేకంగా చేసిన పాపాన్ని దేవునిపట్ల తృణీకారంగా పాఠమే చూపించే వేదాంత బరువును విస్తరణ లేకుండా నిలుపుతుంది.
- issue: ‘నీ ఇల్లు’ అనే పదబంధపు పరిధి
  choice: ‘నీ ఇంటి నుండి’ అని రూపకాన్ని నిలుపడం
  alternative: ‘నీ కుటుంబం నుండి’ లేదా ‘నీ రాజవంశం నుండి’ అని నిర్దిష్టీకరించడం
  rationale: మూలపదం కుటుంబం, ఇంటివారు, రాజవంశం అన్నింటినీ సూచించగలదు. ఒకే భావానికి కుదించకుండా ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఖడ్గం’, ‘తృణీకరించి’ వంటి పదాలు ప్రవచన తీర్పు గంభీరతను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
