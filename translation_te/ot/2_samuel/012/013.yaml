base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: te
  text: అప్పుడు దావీదు నాతానుతో, “నేను యహ్వేకు విరోధంగా పాపం చేశాను” అన్నాడు. నాతాను దావీదుతో, “యహ్వే కూడా నీ పాపాన్ని తొలగించాడు[a]; నీవు చనిపోవు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ పాపాన్ని తీసివేశాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “దాటిపోయేలా చేశాడు” అనే భావం ఉంది; ఇక్కడ అది పాపదోషాన్ని తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీవు మరణించవు.” హీబ్రూ వాక్యం కేవలం “నీవు చనిపోవు” అని చెబుతుంది; న్యాయపరమైన సందర్భం మరణశిక్ష నుండి తప్పించబడడాన్ని సూచించవచ్చు గాని, “మరణశిక్ష విధించబడదు” అని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: కాల్ పర్ఫెక్ట్ ప్రథమ పురుష ఏకవచనం; పూర్తయిన తప్పును నేరుగా ఒప్పుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు విరోధంగా
  rationale: חטא క్రియతో ל సంబంధాన్ని సూచిస్తుంది; ఈ పాపస్వీకార సందర్భంలో ‘విరోధంగా’ అనే ప్రయోగం తెలుగు భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: దావీదు ఒప్పుకోలుకు నాతాను ఇచ్చిన ప్రతిస్పందనలోని అనుసంధాన/ఉద్ఘాటన భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: הֶעֱבִיר
  choice: తొలగించాడు
  rationale: עבר హిఫిల్ రూపానికి అక్షరార్థంగా ‘దాటిపోయేలా చేశాడు’ అనే భావం ఉన్నా, పాపంతో కలిసిన ఈ సందర్భంలో దాని బాధ్యతను తీసివేయడం అనే ప్రయోగార్థం సహజంగా వ్యక్తమవుతుంది.
- source_word: חַטָּאתְךָ
  choice: నీ పాపాన్ని
  rationale: ఇక్కడ దావీదు ఇప్పుడే ఒప్పుకున్న అపరాధాన్నే సూచిస్తుంది; ‘దోషం’ అనే భావసూక్ష్మత సాధ్యమైనా, ‘పాపం’ మూలపదానికి నేరుగా సరిపోతుంది.
- source_word: לֹא תָמוּת
  choice: నీవు చనిపోవు
  rationale: నిషేధార్థక ఇంపర్ఫెక్ట్ దావీదు చనిపోడని చెబుతుంది. ‘మరణశిక్ష విధించబడదు’ అని అనడం సందర్భానుగుణ వ్యాఖ్యానం అవుతుంది; మూలంలో ఉన్న సరళమైన అనిశ్చితిని ఈ రూపం కాపాడుతుంది.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు ... అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా చూపిస్తూ, పదేపదే సంధిపదాలను యాంత్రికంగా వాడకుండా సంభాషణ ప్రవాహాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: הֶעֱבִיר חַטָּאתְךָ సూచించే క్షమాపణ స్వభావం
  choice: నీ పాపాన్ని తొలగించాడు
  alternative: నీ పాపాన్ని తీసివేశాడు; నీ పాపం దాటిపోయేలా చేశాడు
  rationale: వాక్యం దావీదు పాపాన్ని దేవుడు తొలగించి అతన్ని మరణం నుండి విడిపించినట్లు చెబుతుంది; అయితే దానికి సంబంధించిన ప్రాయశ్చిత్త విధానాన్ని వివరించదు. అందువల్ల తరువాతి సిద్ధాంతపరమైన వివరణలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. దావీదు పాపస్వీకారం సంక్షిప్తంగా, నాతాను ప్రకటన గంభీరంగా ఉంచబడ్డాయి. దైవనామం ‘యహ్వే’గా నిలుపబడింది; మూలంలో లేని ప్రాయశ్చిత్త వివరణ లేదా స్పష్టమైన మరణశిక్ష భాషను చేర్చలేదు.
