source:
  edition: WLC
  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: te
  text: అతడు ఆ పట్టణంలో ఉన్న ప్రజలను బయటికి తీసుకొచ్చి, వారితో రంపాలు[a], ఇనుప గునపాలు, ఇనుప గొడ్డళ్లు ఉపయోగించి పని చేయించాడు; ఇటుక బట్టీ దగ్గర కూడా వారితో వెట్టిచాకిరి చేయించాడు.[b] అమ్మోనీయుల పట్టణాలన్నిటికీ అతడు ఇలాగే చేశాడు.[c] ఆ తర్వాత దావీదు, ప్రజలందరూ యెరూషలేముకు తిరిగివచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని రంపం దగ్గర, పదునైన ఇనుప పనిముట్ల దగ్గర, ఇనుప కోత పనిముట్ల దగ్గర ఉంచాడు.” ఇక్కడ చెప్పిన పనిముట్ల ఖచ్చితమైన పేర్లు అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం క్లిష్టమైనది. సంప్రదాయంగా, “వారిని ఇటుక బట్టీ గుండా పోనిచ్చాడు” అని అనువదిస్తారు; కొందరు ఈ వాక్యమంతటినీ వెట్టిచాకిరిగా కాక మరణశిక్షగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: ఇదే సంఘటనను తెలిపే, అలాగే క్లిష్టమైన పదప్రయోగం ఉన్న 1 దినవృత్తాంతములు 20:3 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: బయటికి తీసుకొచ్చి
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיָּשֶׂם
  choice: వారితో ... పని చేయించాడు
  rationale: అక్షరార్థంగా ‘ఉంచాడు/నియమించాడు.’ పనిముట్ల జాబితా ఉన్న ఈ సందర్భంలో బలవంతపు పనికి నియమించాడనే ప్రధాన పఠనాన్ని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בַּמְּגֵרָה
  choice: రంపాలు
  rationale: מְגֵרָה సాధారణంగా రంపాన్ని సూచిస్తుంది; ఏకవచనం ఇక్కడ సమూహార్థకంగా ఉండవచ్చు కాబట్టి తెలుగులో బహువచనం సహజం.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: ఇనుప గునపాలు
  rationale: ఈ పదబంధం పదునైన ఇనుప పనిముట్లను లేదా నూర్పిడి బల్లలను సూచించవచ్చు. పని సందర్భంలో ‘ఇనుప గునపాలు’ సాధ్యమైన, సులభంగా అర్థమయ్యే ఎంపిక; అనిశ్చితిని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: ఇనుప గొడ్డళ్లు
  rationale: కోయడానికి ఉపయోగించే ఇనుప పనిముట్లను సూచించే విస్తృత పదానికి సందర్భోచితమైన స్పష్టమైన తెలుగు రూపం; ఖచ్చితమైన పనిముట్టు అనిశ్చితమే.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: వారితో వెట్టిచాకిరి చేయించాడు
  rationale: అక్షరార్థం ‘వారిని దాటించాడు/పోయేలా చేశాడు.’ తరువాతి క్లిష్ట పదంతో కలిపి బలవంతపు శ్రమను సూచిస్తుందనే ప్రధాన పఠనాన్ని ‘వెట్టిచాకిరి’ స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: במלכן
  choice: ఇటుక బట్టీ దగ్గర
  rationale: హీబ్రూ పాఠం అత్యంత క్లిష్టమైనది. సమాంతర వృత్తాంతం, పని సందర్భం ఆధారంగా ఇటుకల తయారీకి సంబంధించిన స్థలంగా ప్రధాన పాఠంలో అనువదించబడింది; సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: וְכֵן יַעֲשֶׂה
  choice: ఇలాగే చేశాడు
  rationale: దావీదు ఇతర అమ్మోనీయ పట్టణాలకు చేసినదాన్ని సంగ్రహించే సహజమైన తెలుగు కథన రూపం.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: అమ్మోనీయుల పట్టణాలన్నిటికీ
  rationale: בְנֵי עַמּוֹןకు తెలుగులో సహజమైన జాతినామం ‘అమ్మోనీయులు.’
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: యెరూషలేముకు తిరిగివచ్చారు
  rationale: గమ్యస్థానంతో కూడిన שובకు సహజమైన తెలుగు కథన ప్రయోగం; సంయుక్త కర్త కారణంగా బహువచనం వాడబడింది.
theological_decisions:
- issue: దావీదు అమ్మోనీయ బందీలను పనిముట్లు, బట్టీతో చంపించాడా లేక వారితో కఠినమైన వెట్టిచాకిరి చేయించాడా?
  choice: పనిముట్లతోనూ ఇటుక బట్టీ దగ్గరనూ వారితో బలవంతపు శ్రమ చేయించాడు
  alternative: వారిని రంపాలు, ఇనుప పనిముట్లతో హతమార్చి, ఇటుక బట్టీ గుండా పోనిచ్చాడు
  rationale: וַיָּשֶׂם మరియు וְהֶעֱבִיר ... במלכן అనే పదబంధాలకు ఒకటి కంటే ఎక్కువ అర్థనిర్మాణాలు సాధ్యమవుతాయి. జయించబడిన ప్రజలను లోబరచిన సందర్భం, 1 దినవృత్తాంతములు 20:3లోని సమాంతర వృత్తాంతం దృష్ట్యా ప్రధాన పాఠం వెట్టిచాకిరి పఠనాన్ని అనుసరిస్తుంది. అయితే హింసాత్మక మరణశిక్ష పఠనాన్ని తొలగించకుండా పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వెట్టిచాకిరి’ బలవంతపు శ్రమను సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. మూలపాఠంలోని పనిముట్ల పేర్లు, ఇటుక బట్టీకి సంబంధించిన క్లిష్టత, మరణశిక్ష/బలవంతపు శ్రమ మధ్య ఉన్న వ్యాఖ్యాన ఉద్రిక్తత పాదసూచికల్లో యథాతథంగా నిలుపబడ్డాయి.
