reference: 2 Samuel 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: te
  text: కానీ ఇప్పుడు అతడు చనిపోయాడు. ఇక నేను ఎందుకు ఉపవాసం ఉండాలి? నేను అతనిని మళ్లీ తీసుకురాగలనా? నేను అతని దగ్గరికి వెళ్తున్నాను[a]; కానీ అతడు నా దగ్గరికి తిరిగి రాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అతని దగ్గరికి వెళ్తాను.” హీబ్రూ కృదంతం నిశ్చయమైన భవిష్యత్తును కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: బిడ్డ చనిపోకముందు దావీదు ప్రవర్తనకు, చనిపోయిన తర్వాత అతని మారిన ప్రవర్తనకు మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: బిడ్డ ఇప్పుడు మరణించిన స్థితిలో ఉన్నాడనే హీబ్రూ విధేయార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: ఇక నేను ఎందుకు ఉపవాసం ఉండాలి?
  rationale: ఇది అలంకారప్రశ్న. עוֹד సూచించే కొనసాగింపు భావాన్ని తెలుగులో ‘ఇక’ ద్వారా స్పష్టంగా వ్యక్తం చేసింది.
- source_word: הַאוּכַל לַהֲשִׁיבוֹ עוֹד
  choice: నేను వాణ్ణి మళ్లీ తీసుకురాగలనా?
  rationale: హిఫిల్ రూపం ‘తిరిగి వచ్చేలా చేయడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; మరణ సందర్భంలో ‘మళ్లీ తీసుకురావడం’ సహజంగా ఉండి, పునరాగమనాన్ని మించి విధానాన్ని నిర్దేశించదు.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: నేను వాడి దగ్గరికి వెళ్తున్నాను
  rationale: הֹלֵךְ అనే కృదంతం కొనసాగుతున్న గమనాన్ని లేదా నిశ్చిత భవిష్యత్తును సూచించగలదు. వర్తమాన ప్రగతిశీల రూపం మూలంలోని అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: కానీ వాడు నా దగ్గరికి తిరిగి రాడు
  rationale: అసంపూర్ణ క్రియ ఇక్కడ భవిష్యత్తు నిరాకరణను సూచిస్తుంది. ‘తిరిగి రాడు’ ముందున్న ‘మళ్లీ తీసుకురాగలనా’ అనే భావంతో పదార్థ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దావీదు మాట మరణించిన బిడ్డతో చైతన్యపూర్వక పరలోక పునఃకలయికను సూచిస్తుందా?
  choice: ‘నేను వాడి దగ్గరికి వెళ్తున్నాను’ అని మాత్రమే అనువదించి, ఆ వెళ్లడం యొక్క స్వభావాన్ని వివరించలేదు.
  alternative: దావీదు కూడా చనిపోయి మృతుల లోకానికి చేరతాడని మాత్రమే అర్థం చేసుకోవడం; లేదా మరణానంతరం బిడ్డతో వ్యక్తిగతంగా కలుస్తాడని అర్థం చేసుకోవడం.
  rationale: హీబ్రూ పాఠం దావీదు బిడ్డ దగ్గరికి వెళ్తాడనీ, బిడ్డ అతని దగ్గరికి తిరిగి రాడనీ మాత్రమే చెబుతుంది. మధ్యస్థితి లేదా శిశువుల రక్షణ గురించి నిర్దిష్ట సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించింది. సందర్భంలో దావీదు తన కుమారుని గురించి సేవకులతో మాట్లాడుతున్నందున ‘వాడు/వాణ్ణి’ రూపాలు సహజంగా ఉన్నాయి; అవమానార్థం ఉద్దేశించబడలేదు. మూలంలోని రెండు అలంకారప్రశ్నలు, ‘వెళ్లడం/తిరిగి రావడం’ మధ్య వ్యత్యాసం, అలాగే భవిష్యత్తు భావంలోని స్వల్ప అస్పష్టతను నిలిపింది.
