id: 2SA.12.25
reference: 2 Samuel 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח בְּ/יַד֙ נָתָ֣ן הַ/נָּבִ֔יא וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יְדִ֣ידְיָ֑הּ בַּ/עֲב֖וּר יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: te
  text: ఆయన నాతాను ప్రవక్త ద్వారా[a] కబురు పంపించి, యెహోవా నిమిత్తం ఆ బిడ్డకు యెదీద్యా[b] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నాతాను ప్రవక్త చేతి ద్వారా.”
    reason: హీబ్రూ మధ్యవర్తిత్వ నుడికారాన్ని తెలియజేయడం.
  - marker: b
    text: “యెదీద్యా” అనే పేరుకు బహుశా “యెహోవాకు ప్రియమైనవాడు” అని అర్థం.
    reason: వ్యక్తినామంలోని సాధ్యమైన పదార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపించి
  rationale: שׁלח అనే క్రియ అక్షరార్థంగా ‘పంపాడు’ అని అర్థం. ఇక్కడ నాతాను ప్రవక్త మధ్యవర్తిగా ఉండడం వల్ల సమాచారాన్ని లేదా ఆజ్ఞను పంపించిన భావం ఉంది; సహజమైన తెలుగులో దాన్ని ‘కబురు పంపించి’ అని వ్యక్తం చేశాం.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: నాతాను ప్రవక్త ద్వారా
  rationale: בְּיַד అనే పదబంధం అక్షరార్థంగా ‘చేతి ద్వారా’; ఇక్కడ అది వ్యక్తి ద్వారా జరిగిన మధ్యవర్తిత్వాన్ని సూచించే హీబ్రూ నుడికారం. ‘ద్వారా’ అనే రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: ఆ బిడ్డకు … అని పేరు పెట్టాడు
  rationale: అక్షరార్థంగా ‘అతని పేరును పిలిచాడు’ అయినా, పేరుపెట్టే సందర్భంలో ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ సహజమైన, ఖచ్చితమైన వ్యక్తీకరణ.
- source_word: יְדִידְיָהּ
  choice: యెదీద్యా
  rationale: ఇది వ్యక్తినామం కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం; దాని సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בַּעֲבוּר
  choice: నిమిత్తం
  rationale: ఈ పదం కారణం, ఆధారం లేదా ప్రయోజనం అనే పరస్పర సంబంధిత భావాలను మోయగలదు. ‘నిమిత్తం’ వాటిని అతిగా కుదించకుండా తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘పంపించి’, ‘పేరు పెట్టాడు’ అనే క్రియల కర్త
  choice: మునుపటి సందర్భంలోని యెహోవాను సూచించే ‘ఆయన’ను కర్తగా ఉంచడం
  alternative: దావీదు లేదా నాతాను పేరు పెట్టాడని స్పష్టీకరించడం
  rationale: 12:24 చివర యెహోవా బిడ్డను ప్రేమించాడని చెప్పిన తరువాత ఈ వాక్యం కొనసాగుతుంది; అందువల్ల రెండు క్రియలకూ యెహోవాయే కర్తగా ఉండడం సందర్భపరంగా బలంగా ఉంది. అయినా మూలపాఠ్యం పేరుపెట్టే చర్యలో కొత్త కర్తను స్పష్టంగా పేర్కొనదు; కాబట్టి దావీదు లేదా నాతాను పేరును ప్రధాన పాఠ్యంలో చేర్చి అనిశ్చితిని కృత్రిమంగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘ఆ బిడ్డకు’ అనే పదబంధం సందర్భాన్ని స్పష్టంచేస్తుంది; మూలంలోని వ్యక్తినామం, దైవనామం లిప్యంతరీకరణలో నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
