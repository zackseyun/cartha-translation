translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు సంభాషణకు సహజమైన క్రియలను ఉపయోగించాం. ఈ వచనానికి అవసరమైన పాఠాంతర లేదా భావసందిగ్ధత గమనిక లేదు.
