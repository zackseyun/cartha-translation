source:
  edition: WLC
  text: וַ/יַּ֣רְא דָּוִ֗ד כִּ֤י עֲבָדָי/ו֙ מִֽתְלַחֲשִׁ֔ים וַ/יָּ֥בֶן דָּוִ֖ד כִּ֣י מֵ֣ת הַ/יָּ֑לֶד וַ/יֹּ֨אמֶר דָּוִ֧ד אֶל עֲבָדָ֛י/ו הֲ/מֵ֥ת הַ/יֶּ֖לֶד וַ/יֹּ֥אמְרוּ מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: te
  text: దావీదు తన సేవకులు గుసగుసలాడుకోవడం చూసి, బిడ్డ చనిపోయాడని గ్రహించాడు. అప్పుడు దావీదు తన సేవకులతో, “బిడ్డ చనిపోయాడా?” అని అడిగాడు. వారు, “చనిపోయాడు” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה ఇక్కడ ప్రత్యక్షంగా గమనించడాన్ని సూచిస్తుంది; సందర్భంలో సహజమైన తెలుగు రూపం ‘చూసి’.
- source_word: מִתְלַחֲשִׁים
  choice: గుసగుసలాడుకోవడం
  rationale: לחש హిత్పయేల్ రూపం మెల్లగా, తమలో తాము మాట్లాడుకోవడాన్ని సూచిస్తుంది; పరస్పర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֶן
  choice: గ్రహించాడు
  rationale: గమనించిన సంకేతాలనుబట్టి మనసులో నిర్ధారించుకోవడం అనే בין భావాన్ని ‘గ్రహించాడు’ స్పష్టంగా అందిస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: ఈ సందర్భంలో מֵת బిడ్డ మరణించిన స్థితిని తెలియజేస్తుంది. తెలుగులో ‘చనిపోయాడు’ సహజంగా ఉండి, ప్రకటనలోను ప్రశ్నలోను సరిపోతుంది.
- source_word: הַיָּלֶד
  choice: బిడ్డ
  rationale: יֶלֶד కు ‘పిల్లవాడు’ అనే అర్థం సాధ్యమైనా, సందర్భం శిశువును గూర్చినది కాబట్టి ‘బిడ్డ’ మరింత సముచితం.
- source_word: עֲבָדָיו
  choice: తన సేవకులు
  rationale: రాజగృహ పరిచారకుల సందర్భంలో עֶבֶד ను ‘సేవకులు’గా అనువదించడం హోదాను అతిగా నిర్దిష్టం చేయకుండా సహజంగా ఉంటుంది.
- source_word: הֲמֵת הַיֶּלֶד
  choice: బిడ్డ చనిపోయాడా?
  rationale: ప్రశ్నార్థక הֲ తో కూడిన నిర్మాణం బిడ్డ మరణించాడా అని నేరుగా అడుగుతుంది; ఈ రూపం ఆధునిక తెలుగులో సహజం.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: అడిగాడు ... జవాబిచ్చారు
  rationale: మూలంలోని אמר సాధారణంగా ‘చెప్పు’ అయినా, సంభాషణ కార్యాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ప్రశ్న వద్ద ‘అడిగాడు’, ప్రతిస్పందన వద్ద ‘జవాబిచ్చారు’ వాడబడ్డాయి.
