translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. మూలంలోని వరుస క్రియల ప్రవాహాన్ని తెలుగు సంయుక్త క్రియలతో నిలిపి, כָּל הָעָם లోని సందర్భసంబంధమైన సైనిక భావాన్ని పాదసూచికలో ఉంచి ప్రధాన పాఠంలో అక్షరార్థాన్ని పరిరక్షించాం.
