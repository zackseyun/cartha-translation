  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: te
  text: అప్పుడు దావీదు ప్రజలందరినీ[a] సమకూర్చి, రబ్బాకు వెళ్లి, దానిపై యుద్ధం చేసి దానిని స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సైన్యమంతటినీ’ లేదా ‘యోధులందరినీ’; హీబ్రూలో అక్షరార్థంగా ‘ప్రజలందరినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చి
  rationale: אסף అంటే ఒకచోటికి చేర్చడం. యుద్ధ సందర్భంలో సైన్యాన్ని సమీకరించడం భావమైనప్పటికీ, మూలపదం సైనిక సమీకరణను ప్రత్యేకంగా పేర్కొనదు; అందువల్ల ‘సమకూర్చి’ సహజంగా ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరినీ
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ప్రజలందరూ.’ సందర్భంలో ఇది దావీదు ఆధీనంలోని యోధులను లేదా సైన్యాన్ని సూచించే అవకాశం ఉన్నా, మూలంలో మరింత నిర్దిష్టమైన సైనిక పదం కాక עָם వాడబడింది.
- source_word: רַבָּתָה
  choice: రబ్బాకు
  rationale: రబ్బా అనే స్థలనామానికి దిశను సూచించే ה జత అయింది; తెలుగులో ‘రబ్బాకు’ ఆ గమనార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: దానితో యుద్ధం చేసి
  rationale: לחם క్రియ ב ఉపసర్గతో ఇక్కడ ఆ నగరానికి వ్యతిరేకంగా యుద్ధం చేయడాన్ని సూచిస్తుంది. నగరాన్ని తెలుగులో ‘దానితో’ అని సూచించడం సహజం.
- source_word: וַיִּלְכְּדָהּ
  choice: దాన్ని స్వాధీనం చేసుకున్నాడు
  rationale: לכד యుద్ధ సందర్భంలో, ముఖ్యంగా నగరాన్ని పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అని అర్థం. ‘స్వాధీనం చేసుకున్నాడు’ స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
