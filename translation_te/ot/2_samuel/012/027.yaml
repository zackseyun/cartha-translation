id: 2SA.12.27
reference: 2 Samuel 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח יוֹאָ֛ב מַלְאָכִ֖ים אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר֙ נִלְחַ֣מְתִּי בְ/רַבָּ֔ה גַּם לָכַ֖דְתִּי אֶת עִ֥יר הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/027.yaml
  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: te
  text: అప్పుడు యోవాబు దావీదు వద్దకు దూతలను పంపి, “నేను రబ్బాకు వ్యతిరేకంగా యుద్ధం చేశాను; జలాల నగరాన్ని[a] కూడా స్వాధీనం చేసుకున్నాను” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీటి నగరాన్ని.” ఇది బహుశా రబ్బా నగరపు నీటి సరఫరాను నియంత్రించే భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపించి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ సందర్భంలో రాజుకు సమాచారం తీసుకెళ్లే మానవ సందేశవాహకులే ఉద్దేశం; ‘దూతలు’ సహజమైన తెలుగు పదం.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: నేను రబ్బాకు వ్యతిరేకంగా యుద్ధం చేశాను
  rationale: నగరంపై జరిగిన సైనిక పోరాటాన్ని స్పష్టంగా తెలియజేస్తూ, హీబ్రూ పరిపూర్ణ క్రియను నివేదికలో పూర్తయిన చర్యగా వ్యక్తపరుస్తుంది.
- source_word: רַבָּה
  choice: రబ్బా
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం; సందర్భంలో అది అమ్మోనీయుల రబ్బా అని తెలిసేందున ప్రధాన పాఠ్యంలో అదనపు వివరణ అవసరం లేదు.
- source_word: גַּם
  choice: కూడా
  rationale: మొదటి సైనిక చర్యకు రెండవ విజయాన్ని జోడించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָכַדְתִּי
  choice: స్వాధీనం చేసుకున్నాను
  rationale: సైనికంగా ఒక నగర భాగాన్ని పట్టుకొని ఆధీనంలోకి తెచ్చిన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עִיר הַמָּיִם
  choice: జలాల నగరం
  rationale: హీబ్రూ పదబంధంలోని అస్పష్టతను అతిగా వ్యాఖ్యానించకుండా సన్నిహితంగా నిలుపుతుంది; ఇది నీటి సరఫరాను నియంత్రించే నగర భాగాన్ని సూచించే అవకాశం ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘జలాల నగరం’ అనే కొంత విశిష్టమైన పదబంధం మూలంలోని నిజమైన అస్పష్టతను నిలుపుతుంది; పాదసూచిక సాధ్యమైన ప్రత్యామ్నాయాన్ని, సందర్భార్థాన్ని అందిస్తుంది.
