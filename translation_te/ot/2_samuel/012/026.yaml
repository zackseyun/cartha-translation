    rationale: The slash-separated ‘రాజరికపు/రాజ్యాధికారపు నగరం’ reads as unresolved wording. A single literal gloss, ‘రాజత్వపు నగరం,’ better reflects מְּלוּכָה (‘kingship/royalty’) without imposing the more interpretive ‘capital.’
