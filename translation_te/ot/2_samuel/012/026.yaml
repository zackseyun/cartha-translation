base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/026.yaml
  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: te
  text: యోవాబు అమ్మోనీయుల రబ్బా పట్టణంపై యుద్ధం చేసి, రాజనగరాన్ని[a] స్వాధీనం చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజధాని నగరాన్ని.’ హీబ్రూలో అక్షరార్థంగా, ‘రాజత్వపు నగరం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: యుద్ధం చేసి
  rationale: לחם అనే క్రియ నిఫాల్ రూపంలో యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. ‘పై యుద్ధం చేసి’ అనేది సందర్భంలోని ప్రతికూల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రబ్బా పట్టణం
  rationale: రబ్బా స్థలనామం; בְּנֵי עַמּוֹן అమ్మోను ప్రజలను సూచించే సాధారణ జాతి-రాజకీయ నామం. తెలుగు పాఠకులకు ఇది పట్టణమని స్పష్టమయ్యేలా ‘పట్టణం’ చేర్చబడింది.
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לכד సైనిక సందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే అర్థం ఇస్తుంది. పట్టణాన్ని జయించి ఆధీనంలోకి తెచ్చిన భావానికి ఈ తెలుగు ప్రయోగం సహజంగా సరిపోతుంది.
- source_word: עִיר הַמְּלוּכָה
  choice: రాజనగరం
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘రాజరికపు/రాజ్యాధికారపు నగరం.’ ‘రాజనగరం’ మూలంలోని రాజసంబంధ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘రాజధాని’ అనేది సాధ్యమైన సందర్భార్థమైనా మరింత వివరణాత్మకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘రాజనగరం’ ద్వారా మూలంలోని ఉద్దేశపూర్వక పదబంధాన్ని నిలిపి, ‘రాజధాని’ అనే సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
