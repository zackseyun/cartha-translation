source:
  edition: WLC
  text: וְ/עַתָּ֗ה אֱסֹף֙ אֶת יֶ֣תֶר הָ/עָ֔ם וַ/חֲנֵ֥ה עַל הָ/עִ֖יר וְ/לָכְדָ֑/הּ פֶּן אֶלְכֹּ֤ד אֲנִי֙ אֶת הָ/עִ֔יר וְ/נִקְרָ֥א שְׁמִ֖/י עָלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: te
  text: ఇప్పుడు మిగిలిన సైన్యాన్ని సమకూర్చి, పట్టణానికి ఎదురుగా మకాం వేసి దాన్ని స్వాధీనం చేసుకో. లేకపోతే నేనే ఆ పట్టణాన్ని స్వాధీనం చేసుకుంటాను; అప్పుడు ఆ పట్టణం నా పేరుతో పిలువబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా పేరు దానిమీద పిలువబడుతుంది.” ఈ హెబ్రీ నుడికారం ఆ పట్టణాన్ని జయించిన ఘనత లేదా దానిపై హక్కు యోవాబుకే ఆపాదించబడుతుందని సూచిస్తుంది.
    reason: హెబ్రీ నుడికారంలోని ‘పేరు పిలువబడుట’ అనే రూపాన్ని, దాని సందర్భోచితమైన ఘనత/హక్కు ఆపాదన భావాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తక్షణ తదుపరి చర్యను పరిచయం చేసే సంభాషణ సూచకంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֱסֹף
  choice: సమకూర్చి
  rationale: సైనిక సందర్భంలో మిగిలిన బలగాలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది.
- source_word: יֶתֶר הָעָם
  choice: మిగిలిన సైన్యాన్ని
  rationale: עָם సాధారణంగా ‘ప్రజలు’ అయినప్పటికీ, ఈ ముట్టడి సందర్భంలో దావీదుతో ఉన్న మిగిలిన యుద్ధబలగాలను సూచిస్తుంది.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: పట్టణానికి ఎదురుగా మకాం వేసి
  rationale: חנה అనే ‘మకాం వేయు’ అర్థాన్ని నిలుపుతూ, על యొక్క ప్రతికూల సైనిక భావాన్ని ‘ఎదురుగా’ తెలియజేస్తుంది; ‘ముట్టడించు’ అని అతివ్యాఖ్యానించదు.
- source_word: וְלָכְדָהּ
  choice: దాన్ని స్వాధీనం చేసుకో
  rationale: యుద్ధంలో పట్టణాన్ని పట్టుకోవడం/వశపరచుకోవడం అనే לכד భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ప్రతికూల పరిణామాన్ని హెచ్చరించే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: אֶלְכֹּד אֲנִי
  choice: నేనే ఆ పట్టణాన్ని స్వాధీనం చేసుకుంటాను
  rationale: ప్రత్యేకంగా ఉంచిన אֲנִי వల్ల వచ్చే ‘నేనే’ అనే ఉద్ఘాటనను, అలాగే ముందున్న לכד క్రియతో పదసామ్యాన్ని నిలుపుతుంది.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: దానిమీద నా పేరు నిలుస్తుంది
  rationale: అక్షరార్థమైన ‘దానిమీద నా పేరు పిలువబడుతుంది’ అనే హెబ్రీ నుడికారాన్ని తెలుగులో అర్థవంతంగా ఉంచి, విజయ ఘనత యోవాబుకు చెందుతుందనే భావాన్ని తెలియజేస్తుంది; నగరానికి నిజంగా పేరు మార్చబడుతుందని మాత్రమే నిర్ధారించదు.
