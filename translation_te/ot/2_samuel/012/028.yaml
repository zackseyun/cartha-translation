translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక కథన శైలి. ఆజ్ఞల వరుసను తెలుగులో సులభంగా చదవడానికి క్రియావిశేషణ రూపాలతో అనుసంధానించాం. మూలంలోని ‘నా పేరు దానిమీద పిలువబడుతుంది’ అనే నుడికారపు సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి కలిసి సంరక్షిస్తాయి.
