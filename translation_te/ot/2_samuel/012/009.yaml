id: 2SA.12.9
reference: 2 Samuel 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: te
  text: యాహ్వే వాక్యాన్ని తృణీకరించి[a], ఆయన దృష్టిలో చెడైనది ఎందుకు చేశావు? హిత్తీయుడైన ఊరియాను ఖడ్గంతో హతమార్చావు; అతని భార్యను నీ కోసం భార్యగా తీసుకున్నావు[b]; అమ్మోనీయుల ఖడ్గంతో[c] అతన్ని చంపావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యాహ్వే వాక్యాన్ని ఎందుకు చులకన చేశావు?”'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదప్రయోగం అక్షరార్థంగా, “అతని భార్యను నీ కోసం భార్యగా తీసుకున్నావు”; ఊరియా భార్యను దావీదు తన సొంతం చేసుకున్నాడనే భావాన్ని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “అమ్మోను కుమారుల ఖడ్గంతో.” అమ్మోనీయులను సాధనంగా ఉపయోగించి దావీదు ఊరియా మరణానికి కారణమయ్యాడని ఇది సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: నాతాను పలికిన సూటియైన నిందాత్మక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָּזִיתָ
  choice: తృణీకరించి
  rationale: కేవలం అవిధేయతను కాకుండా, చులకనగా చూడడం మరియు ధిక్కరించడం అనే బలమైన భావాన్ని నిలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్యాన్ని
  rationale: דָּבָר అనే పదంలోని ‘వాక్యం/ఆజ్ఞ’ భావవిస్తృతిని నిలుపుతూ, יהוה అనే దేవుని నామాన్ని యాహ్వే అని లిప్యంతరీకరిస్తుంది.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: ఆయన దృష్టిలో చెడైనది చేశావు
  rationale: దేవుని నైతిక తీర్పును సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: ఖడ్గంతో హతమార్చి
  rationale: נכה లోని హింసాత్మక ‘కొట్టి పడగొట్టు/హతమార్చు’ భావాన్ని తెలిపి, తరువాత వచ్చే הרג అనే ‘చంపు’ క్రియతో ఉన్న ఆరోపణాత్మక పునరుక్తిని నిలుపుతుంది.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: అతని భార్యను నీ కోసం భార్యగా తీసుకున్నావు
  rationale: హీబ్రూలోని ఉద్దేశపూర్వక పునరుక్తిని, ముఖ్యంగా לְךָ సూచించే దావీదు స్వప్రయోజనాన్ని, తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల ఖడ్గంతో
  rationale: ‘అమ్మోను కుమారులు’ అనే జాతీయ నామాన్ని సహజంగా ‘అమ్మోనీయులు’ అని ఇచ్చి, వారి ద్వారా జరిగిన హత్యలో దావీదుకే బాధ్యతను ఆపాదించే సాధనార్థక భావాన్ని నిలుపుతుంది.
- source_word: אוּרִיָּה הַחִתִּי
  choice: హిత్తీయుడైన ఊరియా
  rationale: వ్యక్తి పేరును, అతని జాతి గుర్తింపును ప్రామాణిక తెలుగు రూపాల్లో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో ఇస్తుంది.
- issue: ఊరియా మరణానికి దావీదు బాధ్యత
  choice: అమ్మోనీయుల ఖడ్గం సాధనమైనప్పటికీ ‘నీవు అతన్ని చంపావు’ అనే ప్రత్యక్ష ఆరోపణ
  alternative: అమ్మోనీయులు అతన్ని చంపారు
  rationale: దావీదు స్వయంగా ఖడ్గం పట్టకపోయినా, అతని పన్నాగం ద్వారా జరిగిన మరణానికి మూలపాఠం అతనినే బాధ్యునిగా పేర్కొంటుంది; ఈ నైతిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ న్యాయతీర్పు వంటి గంభీరత కలిగిన శైలి వాడబడింది. ‘ఖడ్గం,’ ‘తృణీకరించు,’ ‘హతమార్చు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతాయి; మూలంలోని పునరుక్తి మరియు ప్రత్యక్ష నైతిక ఆరోపణ తొలగించబడలేదు.
