  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וַ/יָּ֣מָת הַ/יָּ֑לֶד וַ/יִּֽרְאוּ֩ עַבְדֵ֨י דָוִ֜ד לְ/הַגִּ֥יד ל֣/וֹ כִּי מֵ֣ת הַ/יֶּ֗לֶד כִּ֤י אָֽמְרוּ֙ הִנֵּה֩ בִ/הְי֨וֹת הַ/יֶּ֜לֶד חַ֗י דִּבַּ֤רְנוּ אֵלָי/ו֙ וְ/לֹא שָׁמַ֣ע בְּ/קוֹלֵ֔/נוּ וְ/אֵ֨יךְ נֹאמַ֥ר אֵלָ֛י/ו מֵ֥ת הַ/יֶּ֖לֶד וְ/עָשָׂ֥ה רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: te
  text: ఏడవ రోజున ఆ బిడ్డ చనిపోయాడు. బిడ్డ చనిపోయాడని దావీదుకు చెప్పడానికి అతని సేవకులు భయపడ్డారు. ఎందుకంటే వారు, “ఇదిగో, బిడ్డ బతికి ఉన్నప్పుడే మనం అతనితో మాట్లాడాం; అతడు మన మాట వినలేదు. ఇప్పుడు ‘బిడ్డ చనిపోయాడు’ అని అతనికి ఎలా చెప్పగలం? అతడు ఏదైనా హాని చేయవచ్చు[a]” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చెడు చేయవచ్చు,” “అతడు తీవ్రంగా ప్రతిస్పందించవచ్చు”; బహుశా, “అతడు తనకు తానే హాని చేసుకోవచ్చు.” హెబ్రీయ ప్రయోగం సంక్షిప్తంగా ఉంది; వారు భయపడిన చర్య ఏమిటో అది స్పష్టంగా చెప్పదు.
    reason: మూలంలోని וְעָשָׂה רָעָה అనే అస్పష్ట ప్రయోగానికి సాధ్యమైన భావాలను తెలియజేస్తూ, ప్రధాన పాఠంలో ఆ అస్పష్టతను కాపాడటం.
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: కథన క్రమంలోని కాలమార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘జరిగిందేమంటే’ వంటి అనవసరమైన పదబాహుళ్యాన్ని నివారిస్తుంది.
- source_word: וַיָּמָת הַיָּלֶד
  choice: ఆ బిడ్డ చనిపోయాడు
  rationale: יֶלֶד ఇక్కడ పసిబిడ్డను సూచిస్తుంది. ‘బిడ్డ’ సందర్భానికి తగినది; ‘చనిపోయాడు’ సంఘటనను నేరుగా తెలియజేస్తుంది.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: దావీదు సేవకులు భయపడ్డారు
  rationale: ירא ఇక్కడ భక్తిపూర్వక భయం కాక, విషయం చెప్పడం వల్ల కలిగే పరిణామం గురించిన భయాన్ని సూచిస్తుంది.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: బిడ్డ చనిపోయాడని దావీదుకు చెప్పడానికి
  rationale: హెబ్రీయ భావాన్ని సహజమైన తెలుగు పరోక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది; సర్వనామ సందిగ్ధత రాకుండా ‘దావీదుకు’ అని స్పష్టం చేసింది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి పరిస్థితిపై దృష్టి పెట్టించే మూలపద బలాన్ని, గౌరవప్రదమైన కాని అర్థమయ్యే తెలుగు శైలిలో నిలుపుతుంది.
- source_word: בִּהְיוֹת הַיֶּלֶד חַי
  choice: బిడ్డ బతికి ఉన్నప్పుడే
  rationale: కాలసంబంధ భావాన్నీ, తరువాతి మరణవార్తతో ఉన్న వ్యత్యాసాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: మనం అతనితో మాట్లాడాం; అతడు మన మాట వినలేదు
  rationale: ‘మా స్వరం వినలేదు’ అనే కఠిన పదానువాదానికి బదులు, שׁמע בקול యొక్క ‘మాట ఆలకించడం/పట్టించుకోవడం’ అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: ఇప్పుడు … అని అతనితో ఎలా చెప్పగలం?
  rationale: ముందటి పరిస్థితి నుంచి వచ్చే ఆందోళనతో కూడిన తార్కిక ప్రశ్నను ‘ఇప్పుడు’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָשָׂה רָעָה
  choice: అతడు ఏదైనా హాని చేయవచ్చు
  rationale: רעה యొక్క ప్రతికూల/హానికర భావాన్ని నిలుపుతూ, హాని ఎవరికి లేదా ఏ రూపంలో జరుగుతుందో మూలంలో పేర్కొనని విషయాన్ని నిర్దిష్టం చేయదు.
theological_decisions:
- issue: וְעָשָׂה רָעָה లో భయపడిన చర్య ఏమిటన్నది
  choice: అతడు ఏదైనా హాని చేయవచ్చు
  alternative: అతడు తనకు తానే హాని చేసుకోవచ్చు / చెడు చేయవచ్చు / తీవ్రంగా ప్రతిస్పందించవచ్చు
  rationale: హెబ్రీయ వాక్యం కర్మను గానీ, చర్య స్వరూపాన్ని గానీ చెప్పదు. దావీదు తనకు తానే హాని చేసుకుంటాడని నిర్దిష్టీకరించడం లేదా నైతిక తీర్పును చేర్చడం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సంభాషణలో సాధారణంగా అర్థమయ్యే ‘మన మాట వినలేదు’ వాడబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. చివరి వాక్యంలోని అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక రెండింటిలోనూ జాగ్రత్తగా కాపాడాం.
