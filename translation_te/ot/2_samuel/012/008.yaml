  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: te
  text: నేను నీ యజమాని ఇంటిని, నీ యజమాని భార్యలను నీ ఒడిలోకి ఇచ్చాను. ఇశ్రాయేలు, యూదా రాజవంశాన్ని నీకు ఇచ్చాను[a]. ఇవన్నీ చాలకపోయి ఉంటే, ఇలాంటివి ఇంకా మరెన్నో నీకు ఇచ్చేవాణ్ణి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు, యూదా ఇల్లు.’ ఇక్కడ ‘ఇల్లు’ రాజవంశాన్ని, ప్రజలను, లేదా పాలనకు లోబడిన ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: b
    text: ‘ఇలాంటివి ఇంకా మరెన్నో’ అనే హీబ్రూ నుడికారం, ఇదే విధమైన వాటిని మరింతగా జోడించడాన్ని సూచిస్తుంది.
    reason: idiom
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: నేను ... ఇచ్చాను
  rationale: נתן అనే క్రియ యొక్క కథన క్రమంలోని రూపం; యెహోవా దావీదుకు చేసిన మేలులను గతకాలంలో వరుసగా చెప్పే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: నీ యజమాని ఇంటిని
  rationale: בַּיִת అనే పదానికి ఇల్లు, ఇంటివారు, రాజవంశం లేదా ఆస్తి అనే విస్తృత భావాలు ఉండవచ్చు. ‘ఇంటి’ అనే రూపం మూలంలోని స్పష్టమైన రూపకాన్ని, దాని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: నీ యజమాని భార్యలను
  rationale: మూలంలోని సమాస పదబంధానికి నేరమైన, సహజమైన తెలుగు అనువాదం. ఇక్కడ אֲדֹנֶיךָ మానవ యజమానిని సూచిస్తుంది.
- source_word: בְּחֵיקֶךָ
  choice: నీ ఒడిలోకి
  rationale: חֵיק అంటే ఒడి లేదా వక్షస్థలం. ‘నీ ఒడిలోకి’ అనే తెలుగు నుడికారం సన్నిహిత స్వాధీనం లేదా స్వీకరణను తెలియజేస్తూ మూల రూపకాన్ని నిలుపుతుంది.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా రాజ్యాన్ని
  rationale: ఇక్కడ בֵּית రాజపాలనకు లోబడిన ప్రజలు లేదా రాజ్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘రాజ్యాన్ని’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘ఇంటిని’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאִם מְעָט
  choice: ఇవన్నీ చాలకపోయి ఉంటే
  rationale: మూలంలోని ఊహాత్మక అసమృద్ధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘ఇవన్నీ’ ముందుగా పేర్కొన్న వరాల సమష్టిని సూచిస్తుంది.
- source_word: וְאֹסִפָה לְּךָ
  choice: నీకు ఇచ్చేవాణ్ణి
  rationale: יסף హిఫీల్ రూపానికి ‘మరింత జోడించు’ అనే భావం ఉంది. వెంట ఉన్న ‘ఇంకా మరెన్నో’తో కలిపి, తెలుగులో ‘ఇచ్చేవాణ్ణి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: ఇలాంటివి ఇంకా మరెన్నో
  rationale: జతగా వచ్చిన ఈ నిర్దేశక పదబంధం ఇదే విధమైనవి మరింతగా జోడించడాన్ని సూచించే నుడికారం. ఎంపిక చేసిన రూపం దాని అనిర్దిష్ట, సమృద్ధి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు సౌలు భార్యలను దావీదుకు ఇచ్చాడనే మాటను వివాహ సంబంధానికి దైవ ఆమోదంగా విస్తరించాలా?
  choice: ‘నీ యజమాని భార్యలను నీ ఒడిలోకి ఇచ్చాను’ అని మూలంలోని బదిలీ మరియు సన్నిహిత స్వాధీన భావాన్ని మాత్రమే తెలిపాం.
  alternative: ‘నీ యజమాని అంతఃపురాన్ని నీకు ఇచ్చాను’ లేదా ‘నీ యజమాని స్త్రీలను నీ సంరక్షణకు అప్పగించాను’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ వాక్యం రాజ్య వారసత్వంతో ముడిపడిన బదిలీని చెబుతుంది; అది వివాహ స్వరూపం లేదా నైతిక ఆమోదం గురించి మరింత వివరించదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా మూల భావాన్నే నిలిపాం.
- issue: ‘ఇశ్రాయేలు, యూదా ఇల్లు’ ప్రజలా, రాజవంశమా, రాజ్యమా?
  choice: సందర్భంలో దావీదుకు అప్పగించబడిన పాలనా పరిధిని సూచించేందుకు ‘ఇశ్రాయేలు, యూదా రాజ్యాన్ని’ అని అనువదించాం; అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘ఇశ్రాయేలు, యూదా ఇంటిని’ లేదా ‘ఇశ్రాయేలు, యూదా ప్రజలను’.
  rationale: בֵּית అనే పదం బహుఅర్థకమైనది. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఎంచుకున్నా, పాదసూచిక ద్వారా మూలంలోని రూపకం మరియు అర్థ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. ‘యజమాని,’ ‘ఒడి,’ ‘రాజ్యం’ వంటి సాధారణ పదాలతో మూలంలోని రాజసంబంధ సందర్భాన్ని నిలిపాం; పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
