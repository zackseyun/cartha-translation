  to: నేను నీ యజమాని ఇంటిని, నీ యజమాని భార్యలను నీ ఒడిలోకి ఇచ్చాను. ఇశ్రాయేలు, యూదా రాజవంశాన్ని నీకు ఇచ్చాను[a]. ఇవన్నీ చాలకపోయి ఉంటే, ఇలాంటివి ఇంకా మరెన్నో నీకు ఇచ్చేవాణ్ణి[b].
