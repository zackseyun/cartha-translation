source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: te
  text: కాని ఆ పేదవానికి తాను కొన్న ఒక చిన్న ఆడ గొర్రెపిల్ల తప్ప మరేమీ లేదు. అతడు దానిని పోషించాడు; అది అతనితోను అతని కుమారులతోను కలిసి పెరిగింది. అది తన రొట్టె ముక్కనుండి తినేది, తన కప్పునుండి తాగేది, అతని ఒడిలో[a] పడుకునేది; అది అతనికి కుమార్తెలా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘అతని ఒడిలో/రొమ్ము దగ్గర’; ‘కౌగిలిలో’ లేదా ‘రొమ్ముకు ఆనుకొని’ అని కూడా అనువదించవచ్చు. ఇది ఇంటిలోని సన్నిహిత ఆప్యాయతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: పేదవాడు
  rationale: ధనవంతునికి వ్యతిరేకంగా ఉన్న పేద లేదా నిరుపేద పురుషుణ్ణి సూచించే ఏకవచన నామవాచకానికి సహజమైన తెలుగు రూపం.
- source_word: אֵין כֹּל כִּי אִם
  choice: తప్ప మరేమీ లేదు
  rationale: ఒక్క మినహాయింపు తప్ప సంపూర్ణ లేమిని తెలిపే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: ఒక చిన్న ఆడ గొర్రెపిల్ల
  rationale: సంఖ్యను, ఆడ జంతువు అనే భావాన్ని, చిన్నదనే ఆప్యాయ సూచనను నిలుపుతుంది.
- source_word: אֲשֶׁר קָנָה
  choice: తాను కొన్న
  rationale: קנה ఇక్కడ కొనడం లేదా సంపాదించడాన్ని సూచిస్తుంది; సందర్భంలో కొనడం స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: וַיְחַיֶּהָ
  choice: దానిని బతికించి ఉంచాడు
  rationale: హిఫిల్ రూపంలోని ‘బతికించడం, ప్రాణంతో కాపాడడం’ అనే ప్రత్యక్ష భావాన్ని ‘పెంచాడు’గా మాత్రమే కుదించకుండా నిలుపుతుంది.
- source_word: וַתִּגְדַּל
  choice: పెరిగింది
  rationale: గొర్రెపిల్ల కుటుంబంతో కలిసి ఎదిగిన భావాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: అతనితో, అతని కుమారులతో కలిసి
  rationale: בָּנָיו యొక్క రూపపరమైన అర్థమైన ‘అతని కుమారులు’ను నిలుపుతూ, יַחְדָּו యొక్క కలిసి అనే ఉద్ఘాటనను కూడా వ్యక్తం చేస్తుంది.
- source_word: מִפִּתּוֹ
  choice: అతని రొట్టె ముక్కలోనుంచి
  rationale: פַּת సూచించే రొట్టె లేదా ఆహారపు ముక్కను, తనదానిలో భాగం పంచుకునే సన్నిహిత చిత్రంతో వ్యక్తం చేస్తుంది.
- source_word: מִכֹּסוֹ
  choice: అతని గిన్నెలోనుంచి
  rationale: అతని స్వంత పానపాత్రలోనుంచి తాగిన ఇంటి సన్నిహిత దృశ్యాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: בְחֵיקוֹ
  choice: అతని ఒడిలో
  rationale: חֵיק సూచించే ఒడి, రొమ్ము లేదా కౌగిలి ప్రాంతాన్ని తెలుగులో ఆప్యాయమైన గృహదృశ్యంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִשְׁכָּב
  choice: పడుకునేది
  rationale: ‘పండుకోవడం/పడుకోవడం’ అనే భౌతిక భావాన్ని నిలుపుతుంది; తప్పనిసరిగా నిద్రపోయిందని అధికంగా నిర్ధారించదు.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: అది అతనికి కుమార్తెలా ఉండేది
  rationale: స్పష్టమైన ఉపమానాన్ని, దానిలోని కుటుంబ ఆప్యాయతను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఆడ గొర్రెపిల్లను కుటుంబ సభ్యురాలిలా చూపించే మానవ గృహచిత్రణ
  choice: ఆప్యాయమైన కుటుంబ భాషను నేరుగా నిలుపడం
  alternative: అతిశయ భావోద్వేగం అనిపించకుండా చిత్రణను మృదువుచేయడం
  rationale: హీబ్రూ ఉపమానం ఉద్దేశపూర్వకంగా గొర్రెపిల్లను ప్రియమైన ఇంటి సభ్యురాలిగా చూపి కథలోని వేదనను పెంచుతుంది; దానిని తగ్గించకూడదు.
- issue: בָּנָיו యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులు’
  alternative: ‘పిల్లలు’
  rationale: మూలరూపం స్పష్టంగా ‘అతని కుమారులు’ అని ఉంది. కుటుంబమంతటినీ సాధారణంగా సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలియజేసి, మూలంలోని లింగ నిర్దిష్టతను ప్రధాన పాఠ్యంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘ఆడ గొర్రెపిల్ల’, ‘రొట్టె ముక్క’, ‘ఒడి’, ‘కుమార్తెలా’ వంటి పదాలతో మూలంలోని స్పష్టమైన గృహచిత్రణను నిలిపాం; కృత్రిమమైన సంస్కృతీకరణను నివారించాం.
