source:
  edition: WLC
  text: וְ/אֶת הַ/כִּבְשָׂ֖ה יְשַׁלֵּ֣ם אַרְבַּעְתָּ֑יִם עֵ֗קֶב אֲשֶׁ֤ר עָשָׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/עַ֖ל אֲשֶׁ֥ר לֹֽא חָמָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/006.yaml
  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: te
  text: ఆ ఆడ గొర్రెపిల్లకు బదులుగా నాలుగింతల పరిహారం చెల్లించాలి. ఎందుకంటే అతడు ఈ పని చేశాడు; కనికరం చూపలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని విడిచిపెట్టలేదు.’ హీబ్రూ క్రియ జాలితో హాని చేయకుండా విడిచిపెట్టడాన్ని లేదా కనికరం చూపడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: ఆ ఆడ గొర్రెపిల్లకు
  rationale: כִּבְשָׂה ప్రత్యేకంగా ఆడ గొర్రెపిల్లను సూచిస్తుంది. నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా, లింగాన్ని ‘ఆడ’ ద్వారా నిలిపాం.
- source_word: יְשַׁלֵּם
  choice: తిరిగి చెల్లించాలి
  rationale: Piel రూపం ఇక్కడ నష్టపరిహారంగా తిరిగి చెల్లించడాన్ని సూచిస్తుంది; సందర్భంలోని దావీదు న్యాయతీర్పు బలాన్ని ‘చెల్లించాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבַּעְתָּיִם
  choice: నాలుగింతలు
  rationale: ఈ సంఖ్యావాచక ప్రయోగం నాలుగు రెట్ల నష్టపరిహారాన్ని సూచిస్తుంది; ‘నాలుగింతలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: עֵקֶב אֲשֶׁר
  choice: ఎందుకంటే
  rationale: విధించిన తీర్పుకు కారణాన్ని పరిచయం చేసే హీబ్రూ పదబంధానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: అతడు ఈ పని చేశాడు
  rationale: דָּבָר ఇక్కడ పని/కార్యం అనే అర్థం ఇస్తుంది. ‘ఈ పని’ హీబ్రూ వ్యక్తీకరణను అతివ్యాఖ్యానం చేయకుండా సహజంగా అందిస్తుంది.
- source_word: לֹא חָמָל
  choice: కనికరం చూపలేదు
  rationale: חמל హాని చేయకుండా విడిచిపెట్టడం లేదా జాలితో కనికరించడం అనే భావాలను కలిగి ఉంది. సందర్భంలో కరుణలేమిని ‘కనికరం చూపలేదు’ స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
