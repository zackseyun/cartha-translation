  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: te
  text: అప్పుడు దావీదు తన భార్య బత్షెబాను ఓదార్చాడు[a]. అతడు ఆమె దగ్గరికి వెళ్లి ఆమెతో శయనించాడు[b]. ఆమె ఒక కుమారునికి జన్మనిచ్చింది; దావీదు అతనికి సొలొమోను అని పేరు పెట్టాడు. యాహ్వే అతన్ని ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన భార్య బత్షెబాను సాంత్వనపరిచాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఆమె దగ్గరికి వెళ్లి ఆమెతో శయనించాడు’ అనేది లైంగిక సంబంధాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: ఓదార్చాడు
  rationale: పియేల్ రూపంలోని נחם ఇక్కడ బిడ్డ మరణం వల్ల కలిగిన దుఃఖంలో ఆదరణ ఇవ్వడాన్ని సూచిస్తుంది. ‘ఓదార్చాడు’ సహజమైన ఆధునిక తెలుగు పదం; సందర్భంలోని సాంత్వన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בַּת שֶׁבַע
  choice: బత్షెబా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిల్ లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: אִשְׁתּוֹ
  choice: తన భార్య
  rationale: హీబ్రూ వచనం బత్షెబాను ఈ దశలో దావీదు భార్యగా స్పష్టంగా పేర్కొంటుంది; అందువల్ల ఆ సంబంధ సూచనను విడిచిపెట్టలేదు.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: అతడు ఆమె దగ్గరికి వెళ్లి
  rationale: ఇది లైంగిక సంబంధాన్ని పరిచయం చేసే హీబ్రూ నుడికారం. తెలుగులో సహజంగా ఉండేలా ‘ఆమె దగ్గరికి వెళ్లి’ అని ఇచ్చి, వెంట వచ్చే క్రియతో దాని భావాన్ని నిలిపాం.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: ఆమెతో శయనించాడు
  rationale: שכב עם అనే నుడికారం లైంగిక సంబంధాన్ని సూచిస్తుంది. ‘శయనించాడు’ కథన గౌరవాన్ని, మూలంలోని పరోక్ష వ్యక్తీకరణను కాపాడుతుంది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఆమె ఒక కుమారునికి జన్మనిచ్చింది
  rationale: హీబ్రూ భావాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: దావీదు అతనికి సొలొమోను అని పేరు పెట్టాడు
  rationale: మూలంలోని క్రియ ఏకవచన పుంలింగంలో ఉంది; సందర్భంలో దాని కర్త దావీదు. తెలుగు పాఠకునికి సందిగ్ధత రాకుండా పేరును కర్తగా పునరుక్తి చేశాం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిల్ రూపాన్ని ఉపయోగించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణ ‘యాహ్వే’గా ఇచ్చాం.
- source_word: אֲהֵבוֹ
  choice: అతన్ని ప్రేమించాడు
  rationale: אהב యొక్క సూటి అర్థం ‘ప్రేమించు’; పుంలింగ ప్రత్యయం అప్పుడే పుట్టిన కుమారుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూల వచనంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ రూపాన్ని ఉపయోగించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: యాహ్వే ప్రేమించిన వ్యక్తి ఎవరు?
  choice: కొత్తగా పుట్టిన కుమారుడు సొలొమోను
  alternative: దావీదు
  rationale: אֲהֵבוֹ లోని పుంలింగ ఏకవచన ప్రత్యయం సమీప పూర్వపదమైన కుమారుణ్ణి, అంటే సొలొమోనును, సహజంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని పాటించాం. లైంగిక సంబంధాన్ని మూలంలోని పరోక్ష నుడికారానికి దగ్గరగా, అసభ్యత లేకుండా వ్యక్తం చేశాం. ఆంగ్ల సంప్రదింపுப் పాఠంలోని పాదసూచికల విషయానికి తగినట్లుగా [a], [b] గుర్తులను సంబంధిత పదబంధాల దగ్గర ఉంచాం.
