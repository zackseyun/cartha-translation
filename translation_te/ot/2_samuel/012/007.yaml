reference: 2 Samuel 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר נָתָ֛ן אֶל דָּוִ֖ד אַתָּ֣ה הָ/אִ֑ישׁ כֹּה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י מְשַׁחְתִּ֤י/ךָֽ לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֥י הִצַּלְתִּ֖י/ךָ מִ/יַּ֥ד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: te
  text: 'అప్పుడు నాతాను దావీదుతో ఇలా అన్నాడు: “నువ్వే ఆ మనిషివి![a] ఇశ్రాయేలు దేవుడైన యహ్వే ఇలా అంటున్నాడు: ‘నేనే నిన్ను ఇశ్రాయేలుపై రాజుగా అభిషేకించాను; నేనే నిన్ను సౌలు చేతి నుండి విడిపించాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వే ఆ మనిషి!” హెబ్రీలో అక్షరార్థంగా, “నువ్వు ఆ మనిషి.”
    reason: హెబ్రీ క్రియలేని ఉద్ఘాటక వాక్యంలోని సాధ్యమైన తెలుగు రూపాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אַתָּה הָאִישׁ
  choice: ఆ మనిషివి నువ్వే!
  rationale: క్రియలేని హెబ్రీ వాక్యం నాతాను చెప్పిన ఉపమానం తరువాత వచ్చే ఆకస్మిక, బలమైన ఆరోపణ. ‘నువ్వే’ ఉద్ఘాటనను నిలుపుతుంది; ‘ఆ మనిషి’ సందర్భంలోని వ్యక్తిని స్పష్టంగా సూచిస్తుంది, అయితే హెబ్రీలో అక్షరార్థంగా నిర్దిష్ట ఉపపదంతో ‘మనిషి’ ఉంది కాబట్టి పాదటిప్పణి ఇచ్చాం.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం; దేవుని సందేశాన్ని ప్రత్యక్షంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించి వ్యక్తినామంగా నిలిపాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఇశ్రాయేలుతో దేవుని ప్రత్యేక సంబంధాన్ని నిలుపుతుంది.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: నేనే ... నేనే
  rationale: స్వతంత్ర సర్వనామం రెండుసార్లు రావడం వల్ల ఉన్న ఉద్ఘాటనను తెలుగులో ‘నేనే’ పునరుక్తితో స్పష్టంగా నిలిపాం.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: నిన్ను ... రాజుగా అభిషేకించాను
  rationale: రాజపదవికి నూనెతో నియమించే చారిత్రక, ధార్మిక భావాన్ని ‘అభిషేకించాను’ కాపాడుతుంది; לְמֶלֶךְ ను సహజంగా ‘రాజుగా’ అన్నాం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: రాజాధికార పరిధిని సూచించే עַל భావాన్ని ‘మీద’ నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִצַּלְתִּיךָ
  choice: విడిపించాను
  rationale: శత్రువు అధికారం లేదా ప్రమాదం నుండి రక్షించి బయటకు తేవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ఈ సందర్భంలో అనవసరమైన రక్షణశాస్త్ర భావాన్ని మోపదు.
- source_word: מִיַּד שָׁאוּל
  choice: సౌలు చేతిలోనుండి
  rationale: ‘చేతి’ అనే హెబ్రీ అధికార/పట్టు నుడికారాన్ని తెలుగులోనూ అర్థమయ్యే విధంగా నిలిపింది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ధ్వన్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని నిలుపుతుంది.
- issue: אָנֹכִי పదంలోని ఉద్ఘాటన
  choice: నేనే ... నేనే
  alternative: నేను ... నేను
  rationale: రెండు దైవకార్యాలకూ ముందు స్వతంత్ర సర్వనామం పునరావృతమవడం దేవుడే వాటి కర్త అని బలంగా చూపుతుంది; తెలుగు ఉద్ఘాటక ప్రత్యయం దాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా ప్రవక్త ప్రకటనలోని గంభీరతను మరియు నాతాను ఆరోపణలోని ఆకస్మిక బలాన్ని నిలిపే శైలి. దైవనామం ‘యహ్వే’గా, రాజాభిషేక పదజాలం సంప్రదాయ గంభీరతతో ఉంచబడింది.
