  naturalness: The Telugu is clear, modern, and suitably restrained in register. ‘బిడ్డ ఇంకా బతికి ఉన్నప్పుడు,’ ‘ఉపవాసముండి ఏడ్చాను,’ and ‘ఎవరికి తెలుసు?’ are natural. The direct-report form ‘అని అనుకున్నాను’ is acceptable for the inner reasoning represented by David’s speech.
