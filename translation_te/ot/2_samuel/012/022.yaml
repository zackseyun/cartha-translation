id: 2SA.12.22
reference: 2 Samuel 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “బిడ్డ ఇంకా బతికి ఉన్నప్పుడు నేను ఉపవాసముండి ఏడ్చాను. ఎందుకంటే, ‘ఎవరికి తెలుసు? యాహ్వే నాపట్ల కృప చూపుతాడేమో[a], బిడ్డ బతుకుతుందేమో’ అని అనుకున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాపట్ల దయ చూపవచ్చేమో.”
    reason: חנן అనే క్రియకు ‘కృప చూపు’ లేదా ‘దయ చూపు’ అనే భావాలు ఉండవచ్చు.
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: బిడ్డ ఇంకా బతికి ఉన్నప్పుడు
  rationale: בְּעוֹד కొనసాగుతున్న గత పరిస్థితిని సూచిస్తుంది; ‘ఇంకా ... ఉన్నప్పుడు’ కాలసంబంధ భావాన్నీ, బిడ్డ పరిస్థితిలోని అనిశ్చితినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: צַמְתִּי
  choice: నేను ఉపవాసముండి
  rationale: צום అంటే ఆహారం తీసుకోకుండా ఉపవాసం ఉండడం; సందర్భానికి తగిన సాధారణ తెలుగు పదబంధం.
- source_word: וָאֶבְכֶּה
  choice: ఏడ్చాను
  rationale: בכה దుఃఖంతో ఏడవడాన్ని సూచిస్తుంది; గంభీరమైన సందర్భంలో ‘ఏడ్చాను’ సహజంగా ఉంటుంది.
- source_word: כִּי אָמַרְתִּי
  choice: ఎందుకంటే ... అని అనుకున్నాను
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది. אָמַרְתִּי అక్షరార్థంగా ‘నేను అన్నాను’; ఇక్కడ దావీదు తనలో తాను భావించిన మాటలను నివేదిస్తున్నందున ‘అనుకున్నాను’ సహజమైన తెలుగు, భావాన్ని మార్చదు.
- source_word: מִי יוֹדֵעַ
  choice: ఎవరికి తెలుసు?
  rationale: ఈ హీబ్రూ జాతీయం దేవుడు ఏమి చేయవచ్చో తెలియని స్థితిని వ్యక్తం చేస్తుంది; తెలుగు జాతీయం అదే అనిశ్చితిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יְחָנֵּנִי
  choice: నాపట్ల కృప చూపుతాడేమో
  rationale: חנן అనుగ్రహం లేదా కృప చూపడాన్ని సూచిస్తుంది. ‘నాపట్ల కృప చూపు’ వ్యక్తిగత కర్మభావాన్ని నిలుపుతుంది; ‘ఏమో’ ఆశతో కూడిన అనిశ్చితిని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְחַי הַיָּלֶד
  choice: బిడ్డ బతుకుతుందేమో
  rationale: ఈ సందర్భంలో వాక్యం దావీదు ఆశించిన సాధ్యమైన ఫలితాన్ని సూచిస్తుంది. ‘ఏమో’ నిశ్చయాన్ని చేర్చకుండా అవకాశాన్నీ ఆశనూ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణతో నిలుపుతున్నాం.
- issue: దేవుని స్పందన గురించి దావీదు ఆశలోని అనిశ్చితి
  choice: కృప చూపుతాడేమో ... బతుకుతుందేమో
  alternative: కృప చూపుతాడు ... బతుకుతుంది
  rationale: ‘ఎవరికి తెలుసు?’ అనే మాట దావీదుకు నిశ్చయం లేదని చూపుతుంది. రెండు క్రియలలోనూ ‘ఏమో’ వాడటం ఆశను నిలుపుతూ, మూలంలో లేని హామీని చేర్చకుండా ఉంటుంది.
- issue: וְחַי యొక్క సంబంధం
  choice: కృప చూపుతాడేమో, బిడ్డ బతుకుతుందేమో
  alternative: కృప చూపి బిడ్డను బతికిస్తాడేమో
  rationale: హీబ్రూ రెండు సమన్విత భావాలను ఉంచుతుంది. తెలుగు ప్రధాన పాఠం కూడా దేవుని కృపకూ బిడ్డ జీవించడానికీ మధ్య సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘ఉపవాసముండి’ బైబిలు సందర్భానికి తగినదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. ‘ఏమో’ పునరుక్తి తెలుగులో సహజంగా ఉండి, దావీదు ఆశలోని ద్వంద్వ అనిశ్చితిని కాపాడుతుంది.
