  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని పొడవును తెలుగులో సహజమైన రెండు వాక్యాలుగా విభజించాం. ‘బాటసారి’ ద్వారా ప్రయాణికుడు అనే భావాన్ని నిలిపి, పాదటిప్పణిలో ‘అతిథి’ అనే ప్రత్యామ్నాయాన్ని ఇచ్చాం.
