base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: te
  text: ఒక ప్రయాణికుడు ఆ ధనవంతుని దగ్గరికి వచ్చాడు.[a] తన దగ్గరికి వచ్చిన ఆ అతిథి కోసం సిద్ధం చేయడానికి తన సొంత మందలోని గొర్రెలనుండిగానీ పశువులనుండిగానీ తీసుకోవడానికి అతడు మనసు ఒప్పలేదు. కాబట్టి అతడు ఆ పేదవాని ఆడ గొర్రెపిల్లను తీసుకొని, తన దగ్గరికి వచ్చిన ఆ మనిషి కోసం దాన్ని సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రయాణికుడు’ స్థానంలో ‘అతిథి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ప్రయాణంలో ఉన్న వ్యక్తిని సూచించే పదం, ఆతిథ్యం పొందే వ్యక్తిని సూచించే సంబంధిత పదం వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵלֶךְ
  choice: బాటసారి
  rationale: ప్రయాణంలో ఉన్న వ్యక్తిని సూచించే ఈ నామవాచకానికి ‘బాటసారి’ సహజమైన తెలుగు పదం; కేవలం ఆతిథ్యం పొందే ‘అతిథి’ అని పరిమితం చేయదు.
- source_word: וַיַּחְמֹל
  choice: మనసు ఒప్పలేదు
  rationale: ఈ సందర్భంలో కర్మ స్పష్టంగా చెప్పబడలేదు; తన సొంత జంతువుల్లో ఒకదాన్ని తీసుకోకుండా వెనుకాడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘కనికరించాడు’ అనే సాధారణ అర్థాన్ని యాంత్రికంగా వాడి భావాన్ని అస్పష్టం చేయదు.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: తన సొంత మందలోని గొర్రెలలోనుంచిగానీ, పశువులలోనుంచిగానీ
  rationale: రెండు సమూహవాచకాలను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, స్వామ్య ప్రత్యయాల వల్ల ఉన్న ‘తన సొంత’ అనే నైతిక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: לַעֲשׂוֹת
  choice: భోజనం సిద్ధం చేయడానికి
  rationale: ఆహార సందర్భంలో עשה యొక్క ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది; ‘భోజనం’ సందర్భం ద్వారా సూచితమైనదే గాని వంట విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: לָאֹרֵחַ
  choice: ఆ బాటసారికి
  rationale: אָרֵחַ ప్రయాణికుడు లేదా అతిథి అనే భావాలు కలిగి ఉండవచ్చు; మొదటి పదమైన הֵלֶךְతో సంబంధాన్ని తెలుగులో నిలుపడానికి ‘బాటసారి’ ఎంచుకోబడింది.
- source_word: כִּבְשַׂת
  choice: ఆడ గొర్రెపిల్లను
  rationale: హీబ్రూ పదంలో ఉన్న స్త్రీలింగ ప్రత్యేకతను సాధారణ పాఠకుడికి స్పష్టంగా నిలుపుతుంది.
- source_word: הָאִישׁ הָרָאשׁ
  choice: ఆ పేదవాని
  rationale: רָאשׁ ఇక్కడ పేద లేదా అవసరంలో ఉన్న వ్యక్తిని సూచిస్తుంది; ‘పేదవాడు’ ధనవంతునితో ఉన్న సామాజిక-ఆర్థిక వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וַיַּעֲשֶׂהָ
  choice: దాన్ని సిద్ధం చేశాడు
  rationale: ముందటి עשהతో ఉన్న పదపునరావృతిని నిలుపుతూ, వంట ప్రక్రియను ‘వండాడు’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: తన దగ్గరికి వచ్చిన
  rationale: రెండు సంబంధిత పదబంధాల్లో వచ్చిన సందర్శకుడనే భావాన్ని సహజమైన తెలుగు కథనశైలిలో నిలుపుతుంది.
