revisions:
- from: అప్పుడు దావీదుకు ఆ మనిషిమీద కోపం తీవ్రంగా మండింది. అతడు నాతానుతో, “యెహోవా జీవంతోడు, ఈ పని చేసిన మనిషి మరణపాత్రుడు![a]” అన్నాడు.
  to: అప్పుడు దావీదుకు ఆ మనిషిమీద కోపం తీవ్రంగా మండింది. అతడు నాతానుతో, “యెహోవా జీవముతోడు, ఈ పని చేసిన మనిషి మరణానికి అర్హుడు![a]” అన్నాడు.
  rationale: The revision corrects the Telugu oath formula and uses a more natural equivalent for the Hebrew idiom בן־מות. It retains the source's imagery and intensity in the anger clause, preserves the divine name, and retains the literal idiom in the footnote.
