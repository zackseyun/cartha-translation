reference: 2 Samuel 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף דָּוִ֛ד בָּ/אִ֖ישׁ מְאֹ֑ד וַ/יֹּ֨אמֶר֙ אֶל נָתָ֔ן חַי יְהוָ֕ה כִּ֣י בֶן מָ֔וֶת הָ/אִ֖ישׁ הָ/עֹשֶׂ֥ה זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: te
  text: అప్పుడు దావీదుకు ఆ మనిషిమీద కోపం తీవ్రంగా మండింది. అతడు నాతానుతో, “యెహోవా జీవముతోడు, ఈ పని చేసిన మనిషి మరణానికి అర్హుడు![a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదశః ‘మరణపు కుమారుడు’; అంటే మరణానికి అర్హుడు లేదా మరణశిక్షకు పాత్రుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף ... מְאֹד
  choice: కోపం తీవ్రంగా మండింది
  rationale: హీబ్రూ నుడికారంలోని ‘కోపం మండడం’ అనే సజీవ చిత్రాన్ని నిలుపుతూ, מְאֹד ఇచ్చే తీవ్రతను ‘తీవ్రంగా’ ద్వారా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בָּאִישׁ
  choice: ఆ మనిషిమీద
  rationale: దావీదు కోపానికి గురైన వ్యక్తిని తెలుగులో సహజంగా సూచిస్తుంది; సందర్భంలోని ఉపమానకథలోని ధనవంతునినే ఇది సూచిస్తుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవంతోడు
  rationale: ఇది ప్రమాణాన్ని సూచించే స్థిరమైన హీబ్రూ సూత్రం. తెలుగులో గంభీరమైన ప్రమాణ వాక్యంగా సహజంగా ఉండడంతో పాటు దైవనామాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כִּי
  choice: ప్రత్యక్ష ప్రకటనలో అంతర్భావంగా వ్యక్తీకరించబడింది
  rationale: ఇక్కడ כִּי ప్రమాణంతో బలపరచబడిన ప్రకటనలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ప్రత్యేక సంధిపదం లేకుండానే ప్రత్యక్ష ప్రకటన సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: בֶן מָוֶת
  choice: మరణపాత్రుడు
  rationale: పదశః ‘మరణపు కుమారుడు’ అనే హీబ్రూ నుడికారం మరణానికి అర్హుడైన లేదా మరణశిక్షకు పాత్రుడైన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘మరణపాత్రుడు’ సంక్షిప్తంగా, గంభీరంగా, అర్థస్పష్టంగా ఉంటుంది.
- source_word: הָעֹשֶׂה זֹאת
  choice: ఈ పని చేసిన
  rationale: అపరాధిని అతని చర్య ద్వారా గుర్తించే హీబ్రూ కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల తెలుగులో పరిచితమైన ‘యెహోవా’ రూపం ఆ వ్యత్యాసాన్ని కాపాడుతుంది.
- issue: בֶן מָוֶת అనే నుడికారాన్ని పదశః ఉంచాలా, అర్థానుసారంగా ఇవ్వాలా
  choice: మరణపాత్రుడు
  alternative: మరణపు కుమారుడు
  rationale: పదశః తెలుగు రూపం సాధారణ పాఠకునికి తప్పుదారి పట్టించవచ్చు. ‘మరణపాత్రుడు’ న్యాయపరమైన తీవ్రతను మరియు మరణానికి అర్హత అనే అసలు భావాన్ని కాపాడుతుంది; పదశః రూపాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి ఉపయోగించబడింది. ‘కోపం తీవ్రంగా మండింది’ మూలంలోని రూపకాన్నీ తీవ్రతనూ కాపాడుతుంది; ‘మరణపాత్రుడు’ సాధారణ పాఠకునికి స్పష్టమైన న్యాయపరమైన పదం.
