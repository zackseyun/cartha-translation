id: 2SA.12.11
reference: 2 Samuel 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי֩ מֵקִ֨ים עָלֶ֤י/ךָ רָעָה֙ מִ/בֵּיתֶ֔/ךָ וְ/לָקַחְתִּ֤י אֶת נָשֶׁ֨י/ךָ֙ לְ/עֵינֶ֔י/ךָ וְ/נָתַתִּ֖י לְ/רֵעֶ֑י/ךָ וְ/שָׁכַב֙ עִם נָשֶׁ֔י/ךָ לְ/עֵינֵ֖י הַ/שֶּׁ֥מֶשׁ הַ/זֹּֽאת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: te
  text: 'యెహోవా ఇలా అంటున్నాడు: “ఇదిగో, నీ సొంత ఇంటి నుండే నీకు విరోధంగా విపత్తును రేపుతున్నాను. నీ కళ్ల ముందే నీ భార్యలను తీసుకొని, నీ సన్నిహితునికి[a] ఇస్తాను. అతడు ఈ సూర్యుని ఎదుటనే[b] నీ భార్యలతో శయనిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ పొరుగువానికి,” “నీ సహచరునికి.” హీబ్రూ పదం సన్నిహితుడు, సహచరుడు లేదా పొరుగువాడు అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఈ సూర్యుని కళ్ల ఎదుట”; అంటే పగటి వెలుగులో, అందరికీ తెలిసేలా బహిరంగంగా.
    reason: idiom_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రంలోని అధికారపూర్వక ప్రకటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: రాబోయే దైవిక చర్యపై శ్రద్ధను కేంద్రీకరించే హీబ్రూ అవ్యయ బలాన్ని నిలుపుతుంది.
- source_word: מֵקִים ... רָעָה
  choice: విపత్తును రేపుతున్నాను
  rationale: רָעָה ఇక్కడ నైతిక చెడును కాక తీర్పురూపమైన విపత్తును సూచిస్తుంది; ‘రేపుతున్నాను’ అనే పదం מֵקִים లోని లేవనెత్తే భావాన్ని నిలుపుతుంది.
- source_word: עָלֶיךָ
  choice: నీకు విరోధంగా
  rationale: ఈ సందర్భంలోని ప్రతికూల, న్యాయతీర్పు దిశను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִבֵּיתֶךָ
  choice: నీ సొంత ఇంటి నుండే
  rationale: విపత్తు దావీదు కుటుంబం లేదా రాజగృహం లోపలి నుండే వస్తుందనే భావాన్ని ‘ఇంటి’ రూపకాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: לְעֵינֶיךָ
  choice: నీ కళ్ల ముందే
  rationale: దావీదు ఎరుగకుండా కాక అతని ఎదుటనే జరుగుతుందనే స్పష్టమైన దృశ్యరూపకాన్ని కాపాడుతుంది.
- source_word: לְרֵעֶיךָ
  choice: నీ సన్నిహితునికి
  rationale: רֵעַ అనే పదానికి పొరుగువాడు, సహచరుడు, సన్నిహితుడు అనే అర్థపరిధి ఉంది; సందర్భంలో దావీదు పరిధిలోని ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తున్నందున ‘సన్నిహితుడు’ సహజంగా సరిపోతుంది, అయితే అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: וְשָׁכַב עִם
  choice: తో శయనిస్తాడు
  rationale: లైంగిక సంబంధాన్ని సూచించే హీబ్రూ సభ్యోక్తి గంభీరతను, అసభ్యత లేకుండా, తెలుగులో కాపాడుతుంది.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: ఈ సూర్యుని ఎదుటనే
  rationale: బహిరంగంగా, పగటి వెలుగులో జరుగుతుందనే భావంతో పాటు మూలంలోని ఉద్దేశపూర్వక సూర్య రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక తీర్పులో רָעָה అర్థం
  choice: విపత్తు
  alternative: చెడు
  rationale: ఈ న్యాయతీర్పు సందర్భంలో పదం నైతిక దుష్టత్వాన్ని కాక దావీదుపై వచ్చే హానికరమైన విపత్తును సూచిస్తుంది. అందువల్ల దేవుడు నైతిక చెడును చేస్తున్నాడనే అనవసర భావం కలిగించకుండా, తీర్పు దేవుని నుండే వస్తుందనే వాక్య బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవక్త ప్రకటనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణం. మూలంలోని ‘కళ్ల ముందు’ మరియు ‘సూర్యుని ఎదుట’ దృశ్యరూపకాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
