  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: te
  text: ఎందుకంటే నీవు రహస్యంగా ఆ పని చేశావు; కానీ నేను ఈ కార్యాన్ని ఇశ్రాయేలీయులందరి ఎదుట, సూర్యుని ఎదుట[a] చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టపగలే”; అక్షరార్థంగా, “సూర్యుని ఎదుట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: '[తెలుగులో ప్రత్యేకంగా అనువదించకుండా కారణసంబంధాన్ని వాక్య నిర్మాణంలో వ్యక్తపరచడం]'
  rationale: ఈ పదం ముందరి వాక్యంలో ప్రకటించిన తీర్పుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగు సందర్భంలో ‘ఎందుకంటే’ అని పెట్టడం కంటే, కారణాన్ని నేరుగా చెప్పి తరువాత ‘కానీ’తో వ్యత్యాసాన్ని చూపడం సహజంగా ఉంటుంది.
- source_word: עָשִׂיתָ
  choice: ఆ పని చేశావు
  rationale: క్రియ దావీదు చేసిన అపరాధాన్ని తిరిగి స్పష్టంగా పేర్కొనకుండా సూచిస్తుంది. ‘ఆ పని’ హెబ్రీ వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: בַסָּתֶר
  choice: రహస్యంగా
  rationale: ‘రహస్యమైన చోట’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, తరువాతి బహిరంగ చర్యతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: וַאֲנִי
  choice: కానీ నేను
  rationale: వావ్ సాధారణ సంధిగా ఉండగలిగినా, ఇక్కడ దావీదు రహస్యంగా చేసిన పనికీ దేవుడు బహిరంగంగా చేయబోయే పనికీ స్పష్టమైన వ్యత్యాసం ఉంది.
- source_word: אֶעֱשֶׂה
  choice: చేస్తాను
  rationale: రాబోయే తీర్పును ప్రకటించే ప్రథమ పురుష భవిష్యత్ క్రియను నేరుగా నిలుపుతుంది.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ పనిని
  rationale: ముందరి వచనంలో ప్రకటించిన తీర్పు చర్యను సూచిస్తుంది. ‘ఈ పని’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిర్దేశక బలాన్ని కాపాడుతుంది.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరి ఎదుట
  rationale: నెగెద్‌లోని సమక్షం/దృష్టి ఎదుట అనే భావాన్ని, చర్య బహిరంగంగా జరుగుతుందనే ఉద్దేశంతో సహజంగా వ్యక్తపరుస్తుంది. ‘ప్రజలు’ను చేర్చడం ద్వారా ‘ఇశ్రాయేలు’ సమూహాన్ని సాధారణ పాఠకునికి స్పష్టంచేస్తుంది.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: సూర్యుని ఎదుట
  rationale: మూలంలోని సజీవమైన అక్షరార్థ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ‘పట్టపగలే’ అనే భావానువాదాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ప్రకటించిన తీర్పులో దేవుని కర్తృత్వం
  choice: ‘నేను ఈ పనిని ... చేస్తాను’ అనే ప్రథమ పురుష దైవిక కర్తృత్వాన్ని నిలుపడం
  alternative: ‘నేను ఈ పని జరిగేలా చేస్తాను’
  rationale: హెబ్రీలో నేరుగా ప్రథమ పురుష క్రియ ఉంది. కథనంలో తీర్పు చారిత్రక సాధనాల ద్వారా నెరవేరినా, ఈ వచనం దేవుని కర్తృత్వాన్ని సూటిగా చెబుతుంది; దాన్ని సున్నితపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. రహస్య చర్యకూ బహిరంగ తీర్పుకూ మధ్య వ్యత్యాసం నిలుపబడింది. ప్రధాన పాఠ్యంలో హెబ్రీ రూపకాన్ని ఉంచి, దాని భావాన్ని పాదసూచికలో ఇచ్చాం.
