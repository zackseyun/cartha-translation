  text: The rich man had very many sheep and cattle[a].
translation:
  language: te
  text: ధనవంతునికి గొర్రెలు, పశువులు చాలా ఎక్కువగా ఉండేవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక ధనవంతునికి గొర్రెలు, పశువులు చాలా ఎక్కువగా ఉండేవి.’
    reason: హీబ్రూ లె- ఉపసర్గతో ఉన్న స్వామ్య నిర్మాణాన్ని కథనంలోని నిర్దిష్ట ధనవంతునిగా లేదా కథను పరిచయం చేసే అనిర్దిష్ట ధనవంతునిగా అనువదించే అవకాశాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: לְעָשִׁיר הָיָה
  choice: ధనవంతునికి … ఉండేవి
  rationale: לְ + היה అనే హీబ్రూ స్వామ్య నిర్మాణాన్ని తెలుగులో సహజమైన ‘ధనవంతునికి … ఉండేవి’గా అనువదించాం. సందర్భంలోని నిర్దిష్ట ధనవంతుణ్ణి సూచించే భావాన్ని ‘ధనవంతునికి’ నిలుపుతుంది.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమూహంగా సూచించగలదు; ఇక్కడ బָקָרతో ఉన్న సాధారణ జతను సహజ తెలుగులో ‘గొర్రెలు, పశువులు’గా ఇచ్చాం.
- source_word: וּבָקָר
  choice: పశువులు
  rationale: בָּקָר మందగా పెంచే పెద్ద పశువులను, ముఖ్యంగా గోవులను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘పశువులు’ సహజంగా అర్థమవుతుంది.
- source_word: הַרְבֵּה מְאֹד
  choice: చాలా విస్తారంగా
  rationale: పరిమాణాన్ని బలంగా నొక్కిచెప్పే ఈ పదబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో ‘చాలా విస్తారంగా’గా అందించాం.
