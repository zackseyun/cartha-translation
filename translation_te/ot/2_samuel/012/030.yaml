reference: 2 Samuel 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: te
  text: అతడు వారి రాజు తలమీద నుండి కిరీటాన్ని తీసుకున్నాడు[a]. దాని బరువు ఒక తలాంతు బంగారం; దానిలో ఒక విలువైన రాయి ఉంది. ఆ కిరీటం దావీదు తలమీద ఉంచబడింది[b]. అతడు పట్టణంలోని కొల్లసొమ్మును చాలా ఎక్కువ పరిమాణంలో బయటికి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిల్కోము యొక్క కిరీటాన్ని.” ఇక్కడి హీబ్రూ పదాన్ని “వారి రాజు” అని గానీ, అమ్మోనీయుల దేవుడైన మిల్కోము పేరుగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: తలాంతు చాలా పెద్ద బరువు ప్రమాణం. ప్రాచీన ప్రమాణాలు మారుతూ ఉండేవి; సాధారణంగా దీని బరువు సుమారు 34 కిలోగ్రాములుగా అంచనా వేయబడుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: కిరీటం
  rationale: రాజసందర్భంలో రాజు ధరించే కిరీటాన్ని సూచించడానికి ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన పదం.
- source_word: מַלְכָּם
  choice: వారి రాజు
  rationale: మసొరెటిక్ రూపవిభజన ప్రకారం ఇది ‘వారి రాజు’ అని అర్థమవుతుంది; అమ్మోనీయుల దేవుని పేరుగా చదివే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: מֵעַל רֹאשׁוֹ
  choice: తలమీద నుండి
  rationale: מֵעַל లోని ‘మీద నుండి’ అనే దిశార్థాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: כִּכַּר זָהָב
  choice: ఒక తలాంతు బంగారం
  rationale: כִּכָּר అనే ప్రాచీన పెద్ద బరువు ప్రమాణానికి బైబిలు తెలుగులో గుర్తించదగిన ‘తలాంతు’ వాడబడింది; దాని అంచనా బరువు పాదసూచికలో వివరించబడింది.
- source_word: וְאֶבֶן יְקָרָה
  choice: దానిలో ఒక విలువైన రాయి ఉంది
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉన్నా రాయి కిరీటంతో సంబంధమున్నదని స్పష్టం చేస్తుంది; అది అమర్చబడిన ఖచ్చిత విధానాన్ని అదనంగా ఊహించదు.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: ఆ కిరీటం దావీదు తలమీద ఉంచబడింది
  rationale: స్త్రీలింగ ఏకవచన క్రియకు సమీప ప్రధాన సూచ్యం కిరీటమే; తెలుగులో కర్తను స్పష్టంచేసి సంఘటనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שְׁלַל הָעִיר
  choice: పట్టణంలోని కొల్లసొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తుసంపదను ‘కొల్లసొమ్ము’ స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹצִיא הַרְבֵּה מְאֹד
  choice: అత్యధిక పరిమాణంలో బయటికి తీసుకొచ్చాడు
  rationale: హిఫిల్ క్రియలోని ‘బయటికి తీసుకురావడం’ అనే భావాన్నీ, పరిమాణాన్ని బలంగా తెలిపే הַרְבֵּה מְאֹד నూ కాపాడుతుంది.
theological_decisions:
- issue: מַלְכָּם అనే రూపం సాధారణ నామవాచకంగా ‘వారి రాజు’నా, లేక అమ్మోనీయుల దేవుని పేరు మిల్కోమా?
  choice: వారి రాజు
  alternative: మిల్కోము (మల్కాము అని కూడా లిప్యంతరీకరించవచ్చు)
  rationale: మసొరెటిక్ స్వరచిహ్నాలు, అందించిన రూపవిభజన ‘వారి రాజు’ అనే పఠనానికి మద్దతిస్తాయి; ‘అతని తలమీద నుండి’ అనే సందర్భమూ దానికి సులభంగా సరిపోతుంది. అయినా దేవుని పేరుగా చదివే ప్రాచీనంగా గుర్తించబడిన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన వ్యాఖ్యాన సందిగ్ధతను కాపాడాం.
- issue: దావీదు తలమీద ఉన్నది కిరీటమా లేక విలువైన రాయా?
  choice: కిరీటం
  alternative: విలువైన రాయి
  rationale: וַתְּהִי అనే స్త్రీలింగ రూపం రెండింటికీ వ్యాకరణపరంగా సరిపోవచ్చు; అయితే వాక్య ప్రవాహం మరియు రాజకిరీట సందర్భం కిరీటాన్నే సహజ సూచ్యంగా చేస్తాయి. ప్రధాన పాఠ్యంలో దానిని స్పష్టంచేశాం, కానీ అనవసరమైన సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. ‘తలమీద నుండి’, ‘బయటికి తీసుకొచ్చాడు’ వంటి రూపాలు మూలంలోని దిశార్థాన్ని నిలుపుతాయి. ‘తలాంతు’ అనే సంప్రదాయ బైబిలు ప్రమాణపదానికి వెంటనే పాదసూచిక వివరణ ఇచ్చి సాధారణ పాఠకునికి అర్థమయ్యేలా చేశాం.
