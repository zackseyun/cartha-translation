  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: te
  text: అతన్ని నేలమీదనుండి లేపడానికి అతని ఇంటి పెద్దలు[a] అతని దగ్గర నిలబడ్డారు. కానీ అతడు ఒప్పుకోలేదు; వారితో కలిసి భోజనం చేయలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ఇంటి పెద్దలు”; ఇది అతని రాజగృహంలోని పెద్దలను లేదా అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారితో రొట్టె తినలేదు”; అంటే వారితో కలిసి ఆహారం తీసుకోలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: నిలబడ్డారు
  rationale: קום అనే క్రియ ఇక్కడ పెద్దలు దావీదు దగ్గర నిలబడి చర్య తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: זִקְנֵי בֵיתוֹ
  choice: అతని ఇంటి పెద్దలు
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా అనుసరిస్తుంది; సందర్భంలో ఇది రాజగృహానికి చెందిన పెద్దలను లేదా అధికారులను సూచించవచ్చు.
- source_word: עָלָיו
  choice: అతని దగ్గర
  rationale: అక్షరార్థంగా ‘అతనిపై/అతని మీద’ అనే భావం ఉన్నా, నేలపై పడి ఉన్న అతన్ని లేపడానికి వారు సమీపంలో నిలబడిన దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַהֲקִימוֹ
  choice: అతన్ని ... లేపడానికి
  rationale: קום హిఫీల్ రూపంలోని కారణార్థాన్ని, అంటే అతడు లేచేలా చేయడాన్ని, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הָאָרֶץ
  choice: నేలమీదనుండి
  rationale: ఈ సందర్భంలో אֶרֶץ దావీదు పడి ఉన్న నేలను సూచిస్తుంది.
- source_word: וְלֹא אָבָה
  choice: కానీ అతడు ఒప్పుకోలేదు
  rationale: אָבָה లోని ఇష్టపడటం లేదా సమ్మతించడం అనే భావాన్ని, ‘తిరస్కరించాడు’ అనే మరింత బలమైన పదం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: వారితో కలిసి భోజనం చేయలేదు
  rationale: అక్షరార్థంగా ‘వారితో రొట్టె తినలేదు’; ఆహారం తీసుకోవడం అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
