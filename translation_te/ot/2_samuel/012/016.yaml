translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మొదటి వాక్యంలో ‘దావీదు,’ తరువాత ‘అతడు’ అని వాడి అనవసర పునరుక్తిని తగ్గించాం. హీబ్రూ క్రియాక్రమంలోని అన్ని అంశాలు—వేడుకోవడం, ఉపవాసం చేయడం, లోపలికి వెళ్లడం, రాత్రి గడపడం, నేలపై పడుకోవడం—నిలుపబడ్డాయి.
