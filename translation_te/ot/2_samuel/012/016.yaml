reference: 2 Samuel 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ דָּוִ֛ד אֶת הָ/אֱלֹהִ֖ים בְּעַ֣ד הַ/נָּ֑עַר וַ/יָּ֤צָם דָּוִד֙ צ֔וֹם וּ/בָ֥א וְ/לָ֖ן וְ/שָׁכַ֥ב אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: te
  text: దావీదు ఆ బాలుని[a] కోసం దేవుణ్ణి వేడుకున్నాడు. అతడు ఉపవాసం చేశాడు[b]; లోపలికి వెళ్లి, రాత్రంతా నేలమీద పడి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బిడ్డ కోసం.” ఇక్కడ “బాలుడు” అనేది అనారోగ్యానికి గురైన దావీదు కుమారుణ్ణి సూచిస్తుంది (15, 18 వచనాలు).
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “ఉపవాసం చేయు” అనే అర్థమున్న క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసి వచ్చి ఉపవాసాన్ని నొక్కి చెబుతున్నాయి; అక్షరాలా, “అతడు ఒక ఉపవాసాన్ని ఉపవాసంగా ఆచరించాడు” అనే భావం.
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: వేడుకున్నాడు
  rationale: בקש ఇక్కడ దేవుని వైపు తిరిగి బాలుని కోసం మనవి చేయడాన్ని సూచిస్తుంది. ‘వెదికాడు’ అనే అక్షరార్థ రూపం తెలుగులో ఈ సందర్భంలో అసహజంగా, భావం స్పష్టంగా లేకుండా ఉంటుంది; ‘వేడుకున్నాడు’ ప్రార్థనాపూర్వకమైన అభ్యర్థనను సహజంగా తెలియజేస్తుంది.
- source_word: אֶת־הָאֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ప్రత్యక్ష కర్మగా ఉన్న האלהיםకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: בְּעַד
  choice: కోసం
  rationale: బాలుని పక్షాన చేసిన మనవిని సందర్భానుసారంగా స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: బాలుని
  rationale: נערకు ‘బాలుడు,’ ‘బిడ్డ,’ ‘యువకుడు,’ ‘సేవకుడు’ వంటి అర్థాలు ఉండవచ్చు. ఇక్కడ దావీదు అనారోగ్యంతో ఉన్న కుమారుణ్ణి సూచిస్తున్నందున ‘బాలుడు’ మూలపదానికి దగ్గరగా ఉంటుంది; సందర్భోచితమైన ‘బిడ్డ’ను పాదసూచికలో ఇచ్చాం.
- source_word: וַיָּצָם ... צוֹם
  choice: ఉపవాసం చేశాడు
  rationale: హీబ్రూలో ఒకే మూలానికి చెందిన క్రియ-నామ రూపాల కలయిక చర్యను నొక్కి చెబుతుంది. తెలుగులో ‘ఉపవాసం చేశాడు’ సహజమైన ప్రయోగం; మూలంలోని బలప్రయోగాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: וּבָא
  choice: లోపలికి వెళ్లి
  rationale: בוא ఇక్కడ కథన క్రమంలో లోపలికి ప్రవేశించడాన్ని సూచిస్తుంది. ‘లోపలికి వెళ్లి’ దిశాభావాన్ని నిలుపుతుంది.
- source_word: וְלָן
  choice: రాత్రంతా ... ఉన్నాడు
  rationale: לון రాత్రి గడపడాన్ని సూచిస్తుంది. తరువాతి ‘పడుకున్నాడు’ అనే క్రియతో కలిపి తెలుగులో సహజంగా ‘రాత్రంతా ... పడి ఉన్నాడు’ అని అనువదించాం.
- source_word: וְשָׁכַב אָרְצָה
  choice: నేలమీద పడి ఉన్నాడు
  rationale: שכב మరియు ארצה కలయిక నేలపై పడుకోవడాన్ని సూచిస్తుంది. ‘నేలమీద’ అని అనడం ఇంటి నేలా, బయట భూమా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
