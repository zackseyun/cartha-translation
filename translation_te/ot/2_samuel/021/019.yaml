source:
  edition: WLC
  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: te
  text: ఫిలిష్తీయులతో గోబులో మళ్లీ యుద్ధం జరిగింది. యారే-ఓరెగీము[b] కుమారుడూ బేత్లెహేమీయుడూ అయిన ఎల్హానాను గిత్తీయుడైన గొల్యాతును[a] కొట్టి పడగొట్టాడు. గొల్యాతు ఈటె కాడ నేత మగ్గపు దండెవలె ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '1 దినవృత్తాంతములు 20:5లో పాఠం భిన్నంగా ఉంది: ఎల్హానాను గొల్యాతు సహోదరుడైన లహ్మీని చంపాడని అక్కడ ఉంది. ఇక్కడ సమూయేలు గ్రంథంలోని పాఠం క్లిష్టమైనదో, నకలు చేసే క్రమంలో మారిపోయినదో అయి ఉండవచ్చని చాలామంది భావించి, దినవృత్తాంతముల పాఠానికి అనుగుణంగా దీన్ని అర్థం చేసుకుంటారు.'
    reason: textual_variant
  - marker: b
    text: ‘యారే-ఓరెగీము’ అనే హీబ్రూ పితృనామం క్లిష్టంగా ఉంది. వాక్యాంతంలోనూ కనిపించే ‘ఓరెగీము’—అంటే ‘నేతగాళ్లు’—అనే పదం పొరపాటున ఇక్కడ కూడా నకలై ఉండవచ్చని కొందరు భావిస్తారు.
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: గోబులో
  rationale: యుద్ధం జరిగిన ప్రదేశాన్ని సూచించే בְּ ఉపసర్గను తెలుగులో సహజంగా ‘లో’ అని అనువదించి, గోబు అనే స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וַיַּךְ
  choice: కొట్టి పడగొట్టాడు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టడం లేదా హతమార్చడం అనే భావాన్ని ఇవ్వగలదు. ‘కొట్టి పడగొట్టాడు’ అనే రూపం దాని యుద్ధసంబంధ బలాన్ని నిలుపుతూ, క్రియలో ఉన్నదానికంటే మరింత స్పష్టంగా ‘చంపాడు’ అని నిర్ణయించదు.
- source_word: יַעְרֵי אֹרְגִים
  choice: యారే-ఓరెగీము
  rationale: మసొరెటిక్ పాఠంలోని క్లిష్టమైన సంయుక్త నామరూపాన్ని సవరించకుండా లిప్యంతరీకరించాం; సంభావ్య పాఠదోషాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: בֵּית הַלַּחְמִי
  choice: బేత్లెహేమీయుడైన
  rationale: ఈ రూపం బేత్లెహేముకు చెందిన వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన జాతివాచక రూపాన్ని వాడాం.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: గిత్తీయుడైన గొల్యాతును
  rationale: అందించిన హీబ్రూ పాఠం గొల్యాతునే ప్రత్యక్ష కర్మగా పేర్కొంటుంది. దినవృత్తాంతములలోని భిన్న పాఠంతో ప్రధాన వాక్యాన్ని సమన్వయపరచకుండా, ఆ భేదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: అతని ఈటె కాడ
  rationale: עֵץ అక్షరార్థంగా ‘కలప’ అయినప్పటికీ, ఈటె సందర్భంలో దాని చెక్క భాగాన్ని ‘కాడ’ అనడం తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: నేతగాని మగ్గపు దండెవలె
  rationale: ఈ ఉపమానం ఈటె కాడ మందాన్ని నేతగాని మగ్గంలోని పెద్ద దండెతో పోలుస్తుంది; మూలార్థాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదబంధాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: దావీదు గొల్యాతును చంపినట్లు చెప్పే 1 సమూయేలు 17తోనూ, 1 దినవృత్తాంతములు 20:5లోని సమాంతర వాక్యంతోనూ కనిపించే ఉద్రిక్తత
  choice: మసొరెటిక్ పాఠాన్ని అనుసరించి, ఎల్హానాను గిత్తీయుడైన గొల్యాతును కొట్టి పడగొట్టాడనే పాఠాన్ని ప్రధాన వాక్యంలో నిలిపాం.
  alternative: ‘ఎల్హానాను గొల్యాతు సహోదరుడైన లహ్మీని చంపాడు’ అని 1 దినవృత్తాంతములు 20:5కు అనుగుణంగా సవరించడం.
  rationale: అందించిన హీబ్రూ మూలపాఠం ప్రత్యక్షంగా గొల్యాతు పేరునే పేర్కొంటుంది. సమాంతర వాక్యంతో సమన్వయం చేయడం ద్వారా ఈ నిజమైన పాఠసంబంధ ఉద్రిక్తతను తొలగించకుండా, ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలిని వాడాం. మసొరెటిక్ పాఠంలోని క్లిష్టతను ప్రధాన వాక్యంలో నిలిపి, వివరణను పాదటిప్పణులకు పరిమితం చేశాం. పాదటిప్పణి సూచికలను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
