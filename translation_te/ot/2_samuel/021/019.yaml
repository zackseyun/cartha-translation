revisions:
- from: ఫిలిష్తీయులతో గోబులో మళ్లీ యుద్ధం జరిగింది. అప్పుడు బేత్లెహేమీయుడైన యారే-ఓరెగీము కుమారుడు ఎల్హానాను[b] గిత్తీయుడైన గొల్యాతును[a] కొట్టి పడగొట్టాడు. అతని ఈటె కాడ నేతగాని మగ్గపు దండెవలె ఉండేది.
  to: ఫిలిష్తీయులతో గోబులో మళ్లీ యుద్ధం జరిగింది. యారే-ఓరెగీము[b] కుమారుడూ బేత్లెహేమీయుడూ అయిన ఎల్హానాను గిత్తీయుడైన గొల్యాతును[a] కొట్టి పడగొట్టాడు. గొల్యాతు ఈటె కాడ నేత మగ్గపు దండెవలె ఉండేది.
  rationale: మసొరెటిక్ పాఠంలోని కష్టమైన పఠనాన్ని, ముఖ్యంగా ఎల్హానాను గొల్యాతును కొట్టి పడగొట్టాడనే వాక్యాన్ని, ఏ విధమైన సమన్వయం లేకుండా నిలిపాం. పాదటిప్పణి bని అది వివరించే పితృనామానికి జతచేశాం; మగ్గపు దండెకు సహజమైన తెలుగు పదబంధాన్ని వాడాం; ఈటె గొల్యాతుదేనని సందర్భార్థాన్ని స్పష్టం చేశాం.
