id: 2SA.21.7
reference: 2 Samuel 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: te
  text: అయితే రాజు సౌలు కుమారుడైన యోనాతాను కుమారుడు మెఫీబోషెతును విడిచిపెట్టాడు; దావీదుకూ సౌలు కుమారుడైన యోనాతానుకూ మధ్య ఉన్న యెహోవా ప్రమాణం కారణంగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: ప్రాణాలతో విడిచిపెట్టాడు
  rationale: ఈ సందర్భంలో חמל అనేది చంపకుండా లేదా మరణానికి అప్పగించకుండా వదిలేయడాన్ని సూచిస్తుంది. ‘ప్రాణాలతో విడిచిపెట్టాడు’ కథనంలోని నిర్దిష్ట భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో ఇది దావీదును సూచించినా, మూలపాఠంలోని బిరుదును అలాగే నిలుపుతుంది.
- source_word: מְפִיבֹשֶׁת
  choice: మెఫీబోషెతు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: సౌలు కుమారుడైన యోనాతాను కుమారుడు
  rationale: హీబ్రూ వంశపరంపర నిర్మాణంలోని రెండుసార్లు వచ్చే ‘కుమారుడు’ సంబంధాన్ని నిలుపుతూ తెలుగులో సహజమైన క్రమాన్ని ఉపయోగించాం.
- source_word: עַל
  choice: ఎందుకంటే
  rationale: ఇక్కడ עַל రాజు చేసిన పనికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שְׁבֻעַת יְהוָה
  choice: యెహోవా ప్రమాణం
  rationale: మూలంలోని నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, అది యెహోవా చేసిన ప్రమాణమా లేక యెహోవా నామంలో చేసిన ప్రమాణమా అనే భాషాపరమైన ఉద్వేగాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: వారి మధ్య ... ఉంది
  rationale: ప్రమాణం ఇద్దరి మధ్య ఉన్నదనే సంబంధ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: దావీదుకు ... యోనాతానుకు మధ్య
  rationale: హీబ్రూలోని ద్వైపాక్షిక సంబంధాన్ని తెలుగులో సహజమైన విభక్తి నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘యెహోవా ప్రమాణం’ అనే పదబంధం అర్థం
  choice: ప్రధాన పాఠంలో ‘యెహోవా ప్రమాణం’ అని అక్షరార్థ నిర్మాణాన్ని నిలిపి, అది యెహోవా నామంలో లేదా ఆయన సాక్షిగా చేసిన ప్రమాణమనే సంభావ్య భావాన్ని పాదసూచికలో తెలిపాం.
  alternative: యెహోవా స్వయంగా చేసిన ప్రమాణం
  rationale: ఈ కథన సందర్భంలో ఇది దావీదు, యోనాతానులు యెహోవాను సాక్షిగా చేసుకున్న ప్రమాణాన్ని సూచించే అవకాశం ఎక్కువ. అయినా మూలపాఠంలోని నిర్మాణం మరో పఠనాన్ని పూర్తిగా తొలగించదు కాబట్టి ప్రధాన పాఠం దానిని అతిగా నిర్ధారించదు.
- issue: ‘రాజు’ ఎవరిని సూచిస్తుంది
  choice: దావీదును సూచిస్తుంది; అయినా అనువాదంలో ‘రాజు’ అనే మూలపాఠ రూపాన్నే ఉంచాం.
  alternative: ప్రధాన పాఠంలో నేరుగా ‘దావీదు’ అని పెట్టడం
  rationale: సందర్భం సూచించే వ్యక్తిని స్పష్టీకరించేందుకు మూలపాఠంలోని అధికారిక సంబోధనను మార్చాల్సిన అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; ‘వారి మధ్య, అంటే...’ అనే పునర్వివరణతో మూలంలోని సంబంధ సూచనను నిలిపాం.
