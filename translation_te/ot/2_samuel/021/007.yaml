revisions:
- from: అయితే రాజు సౌలు కుమారుడైన యోనాతాను కుమారుడు మెఫీబోషెతును ప్రాణాలతో విడిచిపెట్టాడు. ఎందుకంటే వారి మధ్య, అంటే దావీదుకు సౌలు కుమారుడైన యోనాతానుకు మధ్య, యెహోవా ప్రమాణం[a] ఉంది.
  to: అయితే రాజు సౌలు కుమారుడైన యోనాతాను కుమారుడు మెఫీబోషెతును విడిచిపెట్టాడు; దావీదుకూ సౌలు కుమారుడైన యోనాతానుకూ మధ్య ఉన్న యెహోవా ప్రమాణం కారణంగా.
  rationale: హీబ్రూ వాక్యంలోని ప్రధాన క్రియకు ‘విడిచిపెట్టాడు’ను ఉపయోగించి, ప్రాణరక్షణను విడిగా జోడించకుండా సందర్భానుగుణ ‘spared’ భావాన్ని నిలిపాం. కారణాన్ని ఒకే వాక్యంలో ‘... ప్రమాణం కారణంగా’ అని అనుసంధానించి, ‘వారి మధ్య’ అనే సూచనలోని రెండు పక్షాలను నేరుగా పేర్కొన్నాం. యెహోవా ప్రమాణం అనే నిర్మాణంలోని అర్థసంభావ్యతను ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో మృదువుగా వివరించాం.
