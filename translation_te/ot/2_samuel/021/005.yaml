  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הָ/אִישׁ֙ אֲשֶׁ֣ר כִּלָּ֔/נוּ וַ/אֲשֶׁ֖ר דִּמָּה לָ֑/נוּ נִשְׁמַ֕דְנוּ מֵֽ/הִתְיַצֵּ֖ב בְּ/כָל גְּבֻ֥ל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: te
  text: 'వారు రాజుతో ఇలా అన్నారు: “మమ్మల్ని అంతమొందించిన ఆ మనిషి, ఇశ్రాయేలు ప్రాంతమంతటిలో మేము నిలదొక్కుకోకుండా నాశనమైపోవాలని మాకు వ్యతిరేకంగా పన్నాగం పన్నినవాడు[a][b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు వ్యతిరేకంగా యోచించినవాడు.” హీబ్రూ క్రియకు యోచించడం లేదా పథకం వేయడం అనే భావం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నిలదొక్కుకోకుండా” అన్నది అక్షరార్థంగా “ఇశ్రాయేలు ప్రాంతమంతటిలో నిలబడకుండా/స్థిరపడకుండా”; అంటే, ఇశ్రాయేలులో ఎక్కడా తమకు స్థిరమైన చోటు లేకుండా చేయడం. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: మమ్మల్ని అంతమొందించినవాడు
  rationale: כלה అనే క్రియకు ఇక్కడ ‘ముగింపుకు తీసుకురావడం, నిర్మూలించడం’ అనే భావం ఉంది. ‘అంతమొందించడం’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דִּמָּה לָנוּ
  choice: మా మీద పన్నాగం పన్నినవాడు
  rationale: ఈ సందర్భంలో דמה అనేది తలంచడం లేదా పథకం వేయడం అనే భావాన్ని ఇస్తుంది; לָנוּ ప్రతికూల ఉద్దేశాన్ని సూచిస్తుంది. ‘పన్నాగం పన్నడం’ శత్రుత్వపూర్వక యోచనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִשְׁמַדְנוּ
  choice: మేము ... నాశనమైపోవాలని
  rationale: שׁמד నిఫాల్ రూపం నిర్మూలించబడడం లేదా నాశనమవడం అనే భావాన్ని ఇస్తుంది. వాక్యంలో ఇది పన్నాగపు ఉద్దేశం లేదా ఆశించిన ఫలితంగా చదవబడుతుంది; తెలుగు ప్రయోజనార్థక నిర్మాణం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵהִתְיַצֵּב
  choice: మేము నిలదొక్కుకోకుండా
  rationale: התייצב అక్షరార్థంగా తనను తాను నిలబెట్టుకోవడం లేదా స్థిరపరచుకోవడం. ఈ సందర్భంలో ఇశ్రాయేలులో స్థిరమైన ఉనికి లేకుండా చేయడమే భావం; ‘నిలదొక్కుకోకుండా’ అక్షరార్థ చిత్రాన్ని, సందర్భార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతమంతటిలో
  rationale: גְּבוּל ఇక్కడ సరిహద్దు రేఖను మాత్రమే కాక భూభాగాన్ని సూచిస్తుంది. ‘ప్రాంతమంతటిలో’ సమగ్ర వ్యాప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: …వాడు
  rationale: నిర్దిష్ట నామవాచకం సందర్భంలో సౌలును సూచిస్తుంది. తెలుగులో సంబంధ క్రియారూపాలతో కూడిన ‘వాడు’ నిర్మాణం ప్రత్యక్ష సంభాషణలో సహజంగా ఉంటుంది.
