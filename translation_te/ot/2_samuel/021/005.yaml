translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే ప్రత్యక్ష సంభాషణ. మూలంలోని అసంపూర్ణ వాక్యప్రవాహాన్ని దీర్ఘ విరామచిహ్నంతో నిలిపాం. ప్రతి పాదటిప్పణి సూచికను ప్రధాన పాఠ్యంలో ఉంచాం.
