source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: te
  text: దావీదు కాలంలో వరుసగా మూడు సంవత్సరాలపాటు, ఏడాదికేడాది కరవు వచ్చింది. దావీదు యాహ్వే సన్నిధిని వెదికాడు[a]. అప్పుడు యాహ్వే, “ఈ కరువు సౌలు కారణంగాను, రక్తపాత దోషమున్న అతని వంశం కారణంగాను వచ్చింది[b]; అతడు గిబియోనీయులను చంపాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే ముఖాన్ని వెదికాడు”; అంటే యాహ్వేను ఆశ్రయించి ఆయనను విచారించాడు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “రక్తాల ఇల్లు”; ఇది రక్తపాత దోషం మోసిన కుటుంబం లేదా వంశాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: కరవు
  rationale: భూమిని ప్రభావితం చేసిన తీవ్రమైన ఆహార కొరతను కథన సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: వరుసగా మూడు సంవత్సరాలు
  rationale: మూడు సంవత్సరాల సంఖ్యనూ, అవి ఒకదాని వెంట మరొకటి కొనసాగాయనే హెబ్రీయ బలవత్తర భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: యాహ్వే సన్నిధిని వెదికాడు
  rationale: అక్షరార్థమైన ‘ముఖాన్ని వెదికాడు’ అనే హెబ్రీయ నుడికారంలోని దేవుని అనుగ్రహ సన్నిధిని ఆశ్రయించి విచారించే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: సౌలు నిమిత్తమూ, రక్తపాత దోషమున్న అతని ఇంటివారి నిమిత్తమూ
  rationale: సందర్భంలో కరవుకు కారణాన్ని తెలిపే సంబంధాన్ని స్పష్టం చేస్తూ, ‘ఇల్లు’ అనే పదంలోని కుటుంబం లేదా వంశం భావాన్ని ‘ఇంటివారు’గా వ్యక్తం చేస్తుంది.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: అతడు గిబియోనీయులను చంపాడు
  rationale: ఏకవచన క్రియకు సౌలే ప్రధాన కర్త అని నిలుపుతూ, మరణానికి కారణమయ్యాడనే భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా ఉంచుతుంది.
- issue: సౌలు ఇంటిని గూర్చిన కారణ వాక్యం
  choice: కరవు సౌలు మరియు రక్తపాత దోషమున్న అతని ఇంటివారి నిమిత్తం వచ్చిందని స్పష్టంగా వ్యక్తీకరించడం
  alternative: ‘సౌలుకు, రక్తాల ఇంటికి’ అని అక్షరానుసారంగా ఉంచడం
  rationale: హెబ్రీయ ఉపసర్గ సందర్భంలో కారణాన్ని సూచిస్తుంది; సహజ తెలుగులో ‘నిమిత్తం’ ఆ న్యాయతీర్పు భావాన్ని తెలియజేస్తుంది. ‘రక్తపాత దోషం’ హింసను మాత్రమే కాక దానికి సంబంధించిన నైతిక బాధ్యతను కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. హెబ్రీయ నుడికారాలను అర్థవంతంగా అందిస్తూ, వాటి అక్షర రూపాలను పాదటిప్పణుల్లో నిలిపాం. మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు.
