source:
  edition: WLC
  text: ו/ישבו בְּנֹ֜ב אֲשֶׁ֣ר בִּ/ילִידֵ֣י הָ/רָפָ֗ה וּ/מִשְׁקַ֤ל קֵינ/וֹ֙ שְׁלֹ֤שׁ מֵאוֹת֙ מִשְׁקַ֣ל נְחֹ֔שֶׁת וְ/ה֖וּא חָג֣וּר חֲדָשָׁ֑ה וַ/יֹּ֖אמֶר לְ/הַכּ֥וֹת אֶת דָּוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: te
  text: రాఫా వంశస్థులలో ఒకడైన ఇష్బీ-బెనోబు[a][c], మూడు వందల షెకెళ్ల బరువున్న కంచు ఈటెను కలిగి, కొత్త కత్తిని[b] నడుముకు కట్టుకొని, దావీదును హతమార్చుతానని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పేరురూపం అనిశ్చితం. ఇక్కడ సాంప్రదాయ అవగాహనను అనుసరించి ‘ఇష్బీ-బెనోబు’ అని ఇచ్చాం; ‘యెష్బీ-బెనోబు’ అని గానీ, వ్యంజనాలను వేరుగా విభజించి గానీ చదవవచ్చు.
    reason: textual_variant
  - marker: b
    text: హీబ్రూలో ‘కొత్తది’ అని మాత్రమే ఉంది; దానికి సంబంధించిన నామవాచకం లుప్తమైంది. సాంప్రదాయంగా దాన్ని ‘కత్తి’గా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘రాఫాకు పుట్టినవారిలో ఒకడు.’ ఈ పదబంధం రేఫాయీము అని పిలువబడే దైత్యవంశంతో సంబంధమున్న వంశాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: ఇష్బీ-బెనోబు
  rationale: హీబ్రూ వ్యంజన పాఠం, పదవిభజన క్లిష్టమైనవి. యుద్ధవృత్తాంతంలోని వ్యక్తిపేరుగా తీసుకునే సాంప్రదాయ అవగాహన సందర్భానికి సరిపోతుంది; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: రాఫా వంశస్థులలో ఒకడైన
  rationale: יְלִידֵי ఇక్కడ పుట్టుక లేదా వంశసంబంధాన్ని సూచిస్తుంది. రాఫాను వ్యక్తి/వంశనామంగా ఉంచడం మూలంలోని రూపాన్ని కాపాడుతుంది.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: ఈటె బరువు
  rationale: קֵין అరుదైన పదమైనప్పటికీ, ఈ యుద్ధసందర్భంలో ఆయుధాన్ని—సాంప్రదాయంగా ఈటెను లేదా దాని కాండాన్ని—సూచిస్తుందని గ్రహించాం.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: మూడు వందల తులాల కంచు
  rationale: షెకెల్ అనే ప్రాచీన బరువు ప్రమాణానికి సాధారణ తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘తులం’ను ఎంచుకున్నాం; נְחֹשֶׁתను సైనిక సందర్భంలో ‘కంచు’గా అనువదించాం.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: కొత్త కత్తిని నడుముకు కట్టుకొని
  rationale: మూలంలో ‘కొత్తది’ అనే స్త్రీలింగ విశేషణం మాత్రమే ఉండి నామవాచకం లుప్తమైంది. యుద్ధసందర్భం మరియు సాంప్రదాయ అవగాహన ప్రకారం ‘కత్తి’ని పూరించాం; అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: దావీదును హతమార్చాలని అన్నాడు
  rationale: అక్షరార్థంగా ‘దావీదును కొట్టడానికి అన్నాడు’; సందర్భంలో ఇది పలికిన సంకల్పం లేదా ప్రతిజ్ఞను సూచిస్తుంది. ‘అన్నాడు’ అనే క్రియను నిలిపి, ప్రాణాంతక ఉద్దేశాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. మూలంలోని క్లిష్టమైన పేరురూపం, లుప్తమైన ఆయుధనామం పాదసూచికల్లో స్పష్టంగా నిలిపాం. వాక్యప్రవాహం సహజంగా ఉండేందుకు సంబంధవాచక నిర్మాణాన్ని సంక్షిప్తంగా మార్చాం.
