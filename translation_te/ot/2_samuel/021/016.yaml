  to: రాఫా వంశస్థులలో ఒకడైన ఇష్బీ-బెనోబు[a][c], మూడు వందల షెకెళ్ల బరువున్న కంచు ఈటెను కలిగి, కొత్త కత్తిని[b] నడుముకు కట్టుకొని, దావీదును హతమార్చుతానని అన్నాడు.
  rationale: ఈటె బరువును తెలుగులో పూర్తి, సహజమైన నిర్మాణంగా మార్చి, మూలంలోని షెకెల్ కొలతను నిలిపాం. రాఫా పదబంధానికి ఉన్న సమీప ప్రత్యామ్నాయాన్ని పాదసూచికలో చేర్చాం. మిగిలిన అనిశ్చితులు—ఇష్బీ-బెనోబు పేరువిభజన మరియు ‘కొత్తది’కి లుప్తమైన నామవాచకం—పాదసూచికల ద్వారా స్పష్టంగా సంరక్షించబడ్డాయి.
