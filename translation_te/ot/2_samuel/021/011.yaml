id: 2SA.21.11
reference: 2 Samuel 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: te
  text: అయ్యా కుమార్తె, సౌలు ఉపపత్ని అయిన రిస్పా చేసిన పని దావీదుకు తెలియజేయబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: נגד యొక్క హోఫల్ రూపం సమాచారం దావీదుకు తెలియజేయబడిందనే కర్మణి భావాన్ని ఇస్తుంది; ఈ ఎంపిక ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: ל ఉపసర్గ సూచించే పరోక్ష కర్మను తెలుగు చతుర్థీ విభక్తితో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֵת אֲשֶׁר
  choice: చేసిన పని
  rationale: కర్మసూచక పదం, సంబంధవాచక పదం కలిసి నివేదించబడిన విషయాన్ని సూచిస్తున్నాయి; తెలుగులో ‘చేసిన పని’ స్పష్టంగా, సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עָשְׂתָה
  choice: చేసిన
  rationale: నివేదికకు ముందే జరిగిన చర్యను సంబంధ కృదంత రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רִצְפָּה
  choice: రిస్పా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בַת אַיָּה
  choice: అయ్యా కుమార్తె
  rationale: హీబ్రూ పితృనామ గుర్తింపును నేరుగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: సౌలు ఉపపత్ని
  rationale: సంబంధం మరియు సామాజిక హోదాను సభ్యోక్తి లేకుండా తెలియజేస్తుంది; ‘ఉపపత్ని’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, అర్థవంతమైన పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి. మూలంలోని కర్మణి నిర్మాణాన్ని నిలుపుతూ, రిస్పా గుర్తింపుకు సంబంధించిన రెండు విశేషణ పదబంధాలను స్పష్టంగా అమర్చింది.
