reference: 2 Samuel 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יִּקַּ֞ח אֶת עַצְמ֤וֹת שָׁאוּל֙ וְ/אֶת עַצְמוֹת֙ יְהוֹנָתָ֣ן בְּנ֔/וֹ מֵ/אֵ֕ת בַּעֲלֵ֖י יָבֵ֣ישׁ גִּלְעָ֑ד אֲשֶׁר֩ גָּנְב֨וּ אֹתָ֜/ם מֵ/רְחֹ֣ב בֵּֽית שַׁ֗ן אֲשֶׁ֨ר תלו/ם שם ה/פלשתים בְּ/י֨וֹם הַכּ֧וֹת פְּלִשְׁתִּ֛ים אֶת שָׁא֖וּל בַּ/גִּלְבֹּֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: te
  text: అప్పుడు దావీదు వెళ్లి, సౌలు ఎముకలను[a], అతని కుమారుడైన యోనాతాను ఎముకలను యాబేషు-గిలాదు నివాసుల నుండి తీసుకున్నాడు. ఫిలిష్తీయులు గిల్బోవలో[c] సౌలును హతమార్చిన రోజున బేత్-షాను బహిరంగ కూడలిలో వాటిని వేలాడదీశారు[b]; అక్కడి నుండి ఆ నివాసులు వాటిని దొంగిలించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎముకలు’ అనే చోట ‘అవశేషాలు’ అని కూడా అనువదించవచ్చు; అయితే హీబ్రూ పదం అక్షరార్థంగా ‘ఎముకలు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వేలాడదీశారు’ అనే మాటను ‘ప్రదర్శనగా ఉంచారు’ అని, మరింత బలమైన భావంలో ‘కొయ్యకు గుచ్చి ఉంచారు’ అని కూడా అనువదించవచ్చు; అయితే హీబ్రూ క్రియకు అత్యంత ప్రత్యక్షమైన అర్థం ‘వేలాడదీయడం.’
    reason: lexical_alternative
  - marker: c
    text: గిల్బోవ అనేది సౌలు మరణించిన పర్వత ప్రాంతాన్ని సూచిస్తుంది (1 సమూయేలు 31:8–13 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ఎముకలు
  rationale: హీబ్రూ నామవాచకానికి ప్రత్యక్షమైన, నిర్దిష్టమైన అర్థం ‘ఎముకలు’; ‘అవశేషాలు’ కంటే మూలంలోని స్పష్టతను కాపాడుతుంది.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: యాబేషు-గిలాదువాసులు
  rationale: స్థలనామంతో ఉన్న בַּעֲלֵי ఇక్కడ ఆ పట్టణ నివాసులను సూచిస్తుంది; తెలుగులో ‘-వాసులు’ సహజంగా, సమగ్రంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: גָּנְבוּ
  choice: దొంగిలించి తీసుకొచ్చారు
  rationale: క్రియకు ప్రాథమిక అర్థం ‘దొంగిలించారు’; సందర్భంలో శవావశేషాలను అక్కడి నుండి తీసుకుపోయిన చర్యను తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: מֵרְחֹב
  choice: బహిరంగ కూడలి
  rationale: పట్టణంలోని తెరచిన ప్రజా ప్రదేశం లేదా కూడలిని సూచించే పదం; ‘బహిరంగ కూడలి’ స్థల స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית שַׁן
  choice: బేత్-షాను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణకు అనుగుణంగా ఇచ్చింది.
- source_word: תלו/ם שם
  choice: వారిని వేలాడదీసి ఉంచగా
  rationale: תלה యొక్క ప్రత్యక్ష అర్థం ‘వేలాడదీయడం’; ‘కొయ్యకు గుచ్చడం’ వంటి మరింత నిర్దిష్టమైన భావాన్ని మూలం తప్పనిసరి చేయదు. సర్వనామం వ్యక్తులను సూచిస్తున్నందున ‘వారిని’ వాడింది.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: సౌలును హతమార్చిన
  rationale: ఈ సందర్భంలో נכה సౌలు మరణానికి దారితీసిన దెబ్బను సూచిస్తుంది; ‘హతమార్చిన’ సంక్షిప్తంగా, సహజంగా మరణార్థాన్ని తెలియజేస్తుంది.
- source_word: בַּגִּלְבֹּעַ
  choice: గిల్బోవలో
  rationale: మూలంలో ‘గిల్బోవ’ మాత్రమే ఉంది; ‘పర్వతం’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַיֵּלֶךְ ... וַיִּקַּח
  choice: అప్పుడు దావీదు వెళ్లి ... తీసుకొచ్చాడు
  rationale: వావ్-క్రమం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ కొనసాగింపును తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: అతని కుమారుడైన యోనాతాను
  rationale: యోనాతాను సౌలు కుమారుడని హీబ్రూ అనుబంధాన్ని తెలుగులో సందిగ్ధత లేకుండా తెలియజేస్తుంది.
