- from: అప్పుడు దావీదు వెళ్లి, సౌలు ఎముకలను, అతని కుమారుడైన యోనాతాను ఎముకలను యాబేషు-గిలాదువాసుల దగ్గరనుండి తీసుకొచ్చాడు.[a] ఫిలిష్తీయులు గిల్బోవలో సౌలును హతమార్చిన రోజున బేత్-షాను బహిరంగ కూడలిలో వారిని వేలాడదీసి ఉంచగా,[b] యాబేషు-గిలాదువాసులు అక్కడి నుండి వాటిని దొంగిలించి తీసుకొచ్చారు.[c]
