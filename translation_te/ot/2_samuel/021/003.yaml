id: 2SA.21.3
reference: 2 Samuel 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: te
  text: 'దావీదు గిబియోనీయులతో ఇలా అన్నాడు: “నేను మీ కోసం ఏమి చేయాలి? యెహోవా స్వాస్థ్యాన్ని మీరు ఆశీర్వదించేలా[a] నేను దేనితో ప్రాయశ్చిత్తం చేయాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దేనితో ప్రాయశ్చిత్తం చేయాలి? మరియు యెహోవా స్వాస్థ్యాన్ని ఆశీర్వదించండి.” హెబ్రీ వాక్యాన్ని మరింత అక్షరార్థంగా సమన్వయ వాక్యంగా కూడా చదవవచ్చు; ప్రధాన పాఠం సందర్భానికి తగిన ఉద్దేశం లేదా ఫలిత భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: אמר అనే సాధారణ కథన క్రియను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది; ‘అడిగాడు’ అని పలుకుబడి స్వభావాన్ని అదనంగా నిర్ధారించదు.
- source_word: הַגִּבְעֹנִים
  choice: గిబియోనీయులతో
  rationale: గిబియోను ప్రజలను సూచించే జాతివాచక బహువచనానికి ప్రామాణిక తెలుగు రూపం.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: నేను మీ కోసం ఏమి చేయాలి?
  rationale: ప్రశ్నార్థకం మరియు అసంపూర్ణ క్రియలోని ఆలోచనాత్మక భవిష్యదర్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּבַמָּה אֲכַפֵּר
  choice: నేను దేనితో ప్రాయశ్చిత్తం చేయాలి
  rationale: במה లోని సాధనార్థక భావాన్ని ‘దేనితో’ నిలుపుతూ, כפר పీయేల్ రూపంలోని పరిహారాత్మక, ధార్మిక బరువును ‘ప్రాయశ్చిత్తం చేయాలి’ తెలియజేస్తుంది.
- source_word: וּבָרְכוּ
  choice: మీరు ఆశీర్వదించేలా
  rationale: సందర్భంలో ఈ సంయుక్త వాక్యం దావీదు చేయబోయే పరిహారానికి ఆశించిన ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగు ‘-ేలా’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַחֲלַת יְהוָה
  choice: యెహోవా స్వాస్థ్యాన్ని
  rationale: נחלה ఇక్కడ యెహోవాకు చెందిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘స్వాస్థ్యం’ యాజమాన్యమూ వారసత్వమూ రెండింటి భావాన్ని గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: రక్తాపరాధం మరియు ఒడంబడిక ఉల్లంఘన సందర్భంలో כפר అర్థం
  choice: ప్రాయశ్చిత్తం చేయాలి
  alternative: పరిహారం చేయాలి
  rationale: ఇది కేవలం సామాజిక నష్టపరిహారం కాదు; దేవుని ఎదుట ఉన్న సామూహిక అపరాధాన్ని, గిబియోనీయులకు జరిగిన అన్యాయాన్ని పరిష్కరించే గంభీరతను ‘ప్రాయశ్చిత్తం’ బాగా నిలుపుతుంది.
- issue: וּבָרְכוּ אֶת נַחֲלַת יְהוָה చివరి ఉపవాక్య సంబంధం
  choice: 'ఉద్దేశం/ఫలితం: ‘యెహోవా స్వాస్థ్యాన్ని మీరు ఆశీర్వదించేలా’'
  alternative: 'సాధారణ సమన్వయం: ‘యెహోవా స్వాస్థ్యాన్ని ఆశీర్వదించండి’'
  rationale: సందర్భంలో దావీదు అడిగిన చర్య, ప్రాయశ్చిత్తం వల్ల కలగాల్సిన ఆశించిన ఫలితాన్ని ఈ పఠనం స్పష్టంగా తెలియజేస్తుంది; అయితే హెబ్రీలో సాధారణ సమన్వయ పఠనానికీ అవకాశం ఉన్నందున దానిని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన ప్రశ్నారూపం, అయితే ‘ప్రాయశ్చిత్తం’, ‘స్వాస్థ్యం’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని నిలుపుకుంది. పాదటిప్పణి సూచిక ప్రధాన పాఠంలో సంబంధిత సందిగ్ధ ఉపవాక్యానికి అమర్చబడింది.
