source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: te
  text: దీని తరువాత, గోబులో ఫిలిష్తీయులతో మళ్లీ యుద్ధం జరిగింది. అప్పుడు హూషాతీయుడైన సిబ్బెకై రాఫా[a] సంతతివారిలో ఒకడైన సఫ్‌ను[b] హతమార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహాకాయుని సంతతివారిలో ఒకడైన.” హీబ్రూ పదబంధం రాఫా అనే వ్యక్తి వంశాన్నిగానీ, మహాకాయుల లేదా రెఫాయీయుల వంశాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పాఠంలో ఈ పేరు “సఫ్”; 1 దినవృత్తాంతాలు 20:4లోని సమాంతర వృత్తాంతంలో “సిప్పై” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: మళ్లీ యుద్ధం జరిగింది
  rationale: עוֹד సూచించే పునరావృత భావాన్ని నిలుపుతూ తెలుగు కథనశైలికి సహజంగా ఉంది.
- source_word: בְּגֹב
  choice: గోబులో
  rationale: యుద్ధం జరిగిన ప్రదేశాన్ని సూచించే ב ఉపసర్గను సహజమైన తెలుగు స్థానవిభక్తితో అనువదిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ జాతి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే హీబ్రూ కథన క్రమాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: యోధుల మరణాలను వర్ణించే ఈ యుద్ధ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడాన్ని సూచిస్తుంది; ‘హతమార్చాడు’ ఆ సందర్భార్థాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: హూషాతీయుడైన సిబ్బెకై
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, జాతి లేదా ప్రాంత సంబంధ విశేషణాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా అమర్చింది.
- source_word: סַף
  choice: సఫ్
  rationale: మసొరా పాఠంలోని పేరును నేరుగా లిప్యంతరీకరిస్తుంది; సమాంతర పాఠంలోని ‘సిప్పై’ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: రాఫా సంతతివారిలో ఒకడైన
  rationale: యְלִדֵי యొక్క వంశ లేదా సమూహ సంబంధ భావాన్ని వ్యక్తం చేస్తూ, הָרָפָהను ప్రధాన పాఠంలో రాఫా అనే పేరుగా నిలుపుతుంది.
theological_decisions:
- issue: הָרָפָהను ‘రాఫా’ అనే పేరు/వంశ మూలపురుషునిగా తీసుకోవాలా, లేక ‘మహాకాయుడు’ అనే సాధారణ వర్ణనగా తీసుకోవాలా
  choice: రాఫా సంతతివారు
  alternative: మహాకాయుని సంతతివారు; రెఫాయీయుల వంశం
  rationale: వంశసంబంధ నిర్మాణంలో ఉన్న హీబ్రూ రూపాన్ని ప్రధాన పాఠంలో సాధ్యమైనంత నేరుగా ఉంచి, ‘మహాకాయుడు’ అనే వ్యాఖ్యానాన్ని పాదసూచికలో భద్రపరుస్తుంది; తద్వారా నిజమైన అస్పష్టతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
