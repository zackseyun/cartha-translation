source:
  edition: WLC
  text: וַ/יִּקְרָ֥א הַ/מֶּ֛לֶךְ לַ/גִּבְעֹנִ֖ים וַ/יֹּ֣אמֶר אֲלֵי/הֶ֑ם וְ/הַ/גִּבְעֹנִ֞ים לֹ֣א מִ/בְּנֵ֧י יִשְׂרָאֵ֣ל הֵ֗מָּה כִּ֚י אִם מִ/יֶּ֣תֶר הָ/אֱמֹרִ֔י וּ/בְנֵ֤י יִשְׂרָאֵל֙ נִשְׁבְּע֣וּ לָ/הֶ֔ם וַ/יְבַקֵּ֤שׁ שָׁאוּל֙ לְ/הַכֹּתָ֔/ם בְּ/קַנֹּאת֥/וֹ לִ/בְנֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: te
  text: అప్పుడు రాజు గిబియోనీయులను పిలిపించి వారితో మాట్లాడాడు. గిబియోనీయులు ఇశ్రాయేలు కుమారులలోనివారు కాదు; వారు అమోరీయులలో మిగిలినవారు[a]. ఇశ్రాయేలు కుమారులు వారికి ప్రమాణం చేశారు. కానీ సౌలు ఇశ్రాయేలు, యూదా కుమారుల పట్ల తనకున్న ఉత్సాహంతో[b] వారిని హతమార్చాలని ప్రయత్నించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అమోరీయుల శేషానికి చెందినవారు.”
    reason: lexical_alternative
  - marker: b
    text: “ఉత్సాహంతో” అని అనువదించిన హీబ్రూ పదానికి సందర్భాన్ని బట్టి “అసూయతో” లేదా “మితిమీరిన మక్కువతో” అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ
  choice: రాజు ... పిలిపించి
  rationale: సందర్భంలో קרא అంటే తన సమక్షానికి పిలవడం; తెలుగులో ‘పిలిపించి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది. మూలంలో లేనందున దావీదు అనే పేరును చేర్చలేదు.
- source_word: לַגִּבְעֹנִים
  choice: గిబియోనీయులను
  rationale: జనసమూహాన్ని సూచించే పేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: వారితో మాట్లాడాడు
  rationale: అక్షరార్థంగా ‘వారితో అన్నాడు’; ముందున్న పిలుపుతో కలిపి తెలుగులో ‘మాట్లాడాడు’ సహజంగా ఉంటుంది.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: ఇశ్రాయేలు కుమారులలోనివారు కాదు
  rationale: בני ישראל అనే కుటుంబాధారిత జాతీయ పదబంధాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే రూపంలో ఇచ్చింది.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: అమోరీయులలో మిగిలినవారు
  rationale: יֶתֶר అంటే మిగిలిన భాగం లేదా శేషం; ‘మిగిలినవారు’ సాధారణ పాఠకులకు సహజమైనది. ‘శేషం’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: వారికి ప్రమాణం చేశారు
  rationale: ఇది గతంలో జరిగిన నేపథ్య చర్య; తెలుగు క్రియారూపం ప్రమాణబద్ధమైన బాధ్యతను స్పష్టంగా తెలుపుతుంది.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: సౌలు ... వారిని హతమార్చాలని ప్రయత్నించాడు
  rationale: בקש + infinitive ప్రయత్నం/ఉద్దేశాన్ని, נכה ఈ సందర్భంలో ప్రాణహరణాన్ని సూచిస్తుంది; ‘హతమార్చాలని ప్రయత్నించాడు’ రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּקַנֹּאתוֹ
  choice: తనకున్న ఉత్సాహంతో
  rationale: קנא ఇక్కడ ఇశ్రాయేలు, యూదా పక్షాన తీవ్రమైన జాతీయ మక్కువను సూచించగలదు; ‘ఉత్సాహం’ అసూయ అని అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: בני ישראל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ఒకే వచనంలో రెండుసార్లు వచ్చే మూలపదబంధపు కుటుంబ రూపకాన్ని, అలాగే తరువాత ‘యూదా’తో ఉన్న సంబంధాన్ని నిలిపింది.
- issue: קנא అనే పదంలో సౌలు ఉద్దేశం
  choice: ఉత్సాహం
  alternative: ఈర్ష్య / మితిమీరిన మక్కువ
  rationale: జాతీయ పక్షపాతంతో కూడిన తీవ్ర మక్కువ అనే సందర్భార్థాన్ని ‘ఉత్సాహం’ అందిస్తుంది; అయితే మూలపదంలోని ప్రతికూల ఛాయను పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: לְהַכֹּתָם యొక్క తీవ్రత
  choice: వారిని హతమార్చడం
  alternative: వారిని కొట్టివేయడం
  rationale: ఈ కథన సందర్భంలో నכה కేవలం కొట్టడం కాక చంపడం లేదా నిర్మూలించడం వైపు సూచిస్తుంది; అయినా మొత్తం నిర్మూలన అనే భావాన్ని మూలం కంటే ఎక్కువగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘ఇశ్రాయేలు కుమారులు’ వంటి మూలపాఠానికి పారదర్శకమైన రూపాన్ని నిలిపి, మిగతా వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
