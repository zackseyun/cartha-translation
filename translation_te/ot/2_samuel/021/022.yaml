id: 2SA.21.22
reference: 2 Samuel 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: te
  text: ఈ నలుగురు గాతులో రాఫాకు పుట్టారు[a]. వారు దావీదు చేత, అతని సేవకుల చేత పడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాఫా అనే వానికి పుట్టారు,’ ‘ఆ దైత్యునికి పుట్టారు,’ లేదా ‘రెఫాయీయులకు చెందినవారు.’ హీబ్రూ పదబంధం బహుశా గాతుతో సంబంధమున్న రాఫా/దైత్య వంశపు సంతతిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: ఈ నలుగురు
  rationale: హీబ్రూ సంఖ్యా-సూచక నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; మూలంలో ‘పురుషులు’ అనే పదం లేనందున దానిని చేర్చలేదు.
- source_word: יֻלְּדוּ
  choice: పుట్టారు
  rationale: ఈ నిష్క్రియ రూపం జననం లేదా వంశసంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పుట్టారు’ సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: לְהָרָפָה
  choice: రాఫాకు
  rationale: రాఫా అనే పూర్వికుడు లేదా వంశాన్ని సూచించే అవకాశం ఉన్నందున పేరును లిప్యంతరీకరించి, ‘దైత్యుడు’ లేదా ‘రెఫాయీయులు’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించలేదు.
- source_word: בְּגַת
  choice: గాతులో
  rationale: స్థలాన్ని సూచించే ఉపసర్గకు సహజమైన తెలుగు రూపం.
- source_word: וַיִּפְּלוּ
  choice: పడ్డారు
  rationale: యుద్ధ సందర్భంలో మరణించడాన్ని సూచించినప్పటికీ, హీబ్రూలోని ‘పడుట’ అనే చిత్రణను నిలుపుతుంది.
- source_word: בְיַד
  choice: చేతిలో
  rationale: కర్తృత్వం లేదా సాధనాన్ని సూచించే హీబ్రూ జాతీయాన్ని తెలుగులో సమానమైన, అర్థమయ్యే జాతీయంతో నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజకీయ-సైనిక సందర్భంలో రాజుకు సేవచేసే వారిని సూచించే మూలపదానికి నేరమైన అనువాదం; ‘యోధులు’ అని మరింత నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: הָרָפָה యొక్క గుర్తింపు
  choice: పేరు లేదా వంశపూర్విక బిరుదుగా భావించగల ‘రాఫా’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘దైత్యుడు’ అనే సామాన్య నామంగా లేదా ‘రెఫాయీయులు’ అనే జనసమూహ సూచనగా అనువదించడం
  rationale: ఈ వచనం గాతుతో సంబంధమున్న దైత్య వంశపు నలుగురిని సంగ్రహంగా పేర్కొంటుంది. హీబ్రూ రూపం వ్యక్తి, వంశపూర్వికుడు లేదా వంశసమూహాన్ని సూచించవచ్చు కాబట్టి ప్రధాన పాఠ్యం ఆ సందిగ్ధతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చేతిలో పడ్డారు’ అనే పునరుక్త నిర్మాణం హీబ్రూ వాక్యరూపాన్ని, యుద్ధసందర్భపు చిత్రణను నిలుపుతుంది.
