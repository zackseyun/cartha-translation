  naturalness: ‘ఈ నలుగురు గాతులో రాఫాకు పుట్టారు’ సహజంగానే అర్థమవుతుంది. ‘దావీదు చేతిలో, అతని సేవకుల చేతిలో పడ్డారు’ హీబ్రూ పునరుక్తిని కాపాడుతుంది; రెండు చోట్ల ‘చేత’ వాడటం ఆధునిక ప్రామాణిక తెలుగులో కొద్దిగా మరింత సూటిగా, యుద్ధసందర్భానికి తగినట్లుగా ఉంటుంది.
  terminology: రాఫా, గాతు, దావీదు అనే రూపాలు స్థిరంగా, అనుకూలంగా ఉన్నాయి. הָרָפָה యొక్క వ్యక్తి/బిరుదు/వంశసూచక సందిగ్ధతను ప్రధాన పాఠ్యంలో ‘రాఫా’గా ఉంచడం సరైన సంయమనం. పాదటిప్పణిలో ‘దైత్యుడు’ మరియు ‘రెఫాయీయులు’ అనే వివరణలను ప్రత్యామ్నాయ అవకాశాలుగానే సూచించాలి; వాటిని నిర్ధారిత చారిత్రక గుర్తింపుగా చెప్పరాదు.
