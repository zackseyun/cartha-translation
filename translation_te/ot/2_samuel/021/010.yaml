translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథనశైలిని ఉపయోగించాం. మృతదేహాలను సూచించే ‘వారిమీద’ అనే వ్యక్తివాచక రూపాన్ని మూలంలోని బహువచన సర్వనామానికి అనుగుణంగా నిలిపాం. చివరి భాగంలో హెబ్రీ వాక్యం క్రియను సంక్షిప్తంగా వదిలినందున, తెలుగులో అర్థస్పష్టత కోసం ‘రానివ్వలేదు’ను పూరించాం.
