source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: te
  text: అప్పుడు అయ్యా కుమార్తె రిస్పా గోనెపట్టను తీసుకొని, కోతకాలం ప్రారంభమైనప్పటి నుంచి ఆకాశం నుండి వారిమీద నీళ్లు కుమ్మరించబడే వరకు తనకోసం దాన్ని బండమీద పరచుకుంది.[a] పగటివేళ ఆకాశపక్షులను వారిమీద వాలనివ్వలేదు; రాత్రివేళ అడవి జంతువులను కూడా వారిమీదికి రానివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశం నుండి వారిమీద వర్షం కురిసే వరకు.’ హెబ్రీ వాక్యం అక్షరార్థంగా, ‘ఆకాశం నుండి వారిమీద నీళ్లు కుమ్మరించబడే వరకు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: గోనెపట్ట
  rationale: ఇది సాధారణ సంచి కాదు; దుఃఖాన్ని సూచించే ముతక గోనెవస్త్రం. ఆధునిక తెలుగులో ‘గోనెపట్ట’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: తనకోసం దాన్ని బండమీద పరచుకుంది
  rationale: נטה ఇక్కడ వస్త్రాన్ని పరచడం లేదా చాపడం అనే భావాన్ని ఇస్తుంది; לָהּ లోని ప్రయోజనార్థక భావాన్ని ‘తనకోసం’ నిలుపుతుంది. אֶל הַצּוּר ను సందర్భానుసారంగా ‘బండమీద’గా అనువదించాం.
- source_word: מִתְּחִלַּת קָצִיר
  choice: కోతకాలం ప్రారంభమైనప్పటి నుంచి
  rationale: మూలంలో ఏ పంట కోత అనేది పేర్కొనలేదు; అందువల్ల ‘యవల కోత’ వంటి అదనపు నిర్దిష్టతను చేర్చలేదు.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: ఆకాశం నుండి వారిమీద నీళ్లు కుమ్మరించబడే వరకు
  rationale: נתך లోని ‘కుమ్మరించబడడం/ధారగా పోయబడడం’ అనే దృశ్యాన్ని నిలిపి, దానిని నేరుగా ‘వర్షం’గా మాత్రమే నిర్ణయించలేదు.
- source_word: עוֹף הַשָּׁמַיִם
  choice: ఆకాశపక్షులు
  rationale: హెబ్రీయుల సాధారణ నుడికారాన్ని సహజమైన ఆధునిక తెలుగు సమాసంతో వ్యక్తపరుస్తుంది.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: వారిమీద వాలడం
  rationale: నוח ఇక్కడ పక్షులు దిగివచ్చి వాలడం లేదా స్థిరపడడం అనే అర్థంలో ఉంది; ‘వాలడం’ ఈ సందర్భంలో సహజమైన తెలుగు.
- source_word: חַיַּת הַשָּׂדֶה
  choice: అడవి జంతువులు
  rationale: ఈ పదబంధం పెంపుడు జంతువులకు భిన్నంగా బయటి ప్రదేశాల్లో తిరిగే క్రూర లేదా అడవి జంతువులను సూచిస్తుంది.
- source_word: יוֹמָם ... לָיְלָה
  choice: పగటివేళ ... రాత్రివేళ
  rationale: మూలంలోని కాలవ్యతిరేకతను సహజమైన, గంభీరమైన తెలుగు లయతో నిలుపుతుంది.
- source_word: וְלֹא נָתְנָה
  choice: రానివ్వలేదు / వాలనివ్వలేదు
  rationale: נתן + క్రియారూపం ఇక్కడ ‘అనుమతించు’ అనే నుడికారార్థం కలిగి ఉంది. పక్షులకు ‘వాలనివ్వలేదు,’ జంతువులకు సందర్భానుసారంగా ‘రానివ్వలేదు’ అని సహజంగా చెప్పాం.
