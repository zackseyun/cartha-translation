source:
  edition: WLC
  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: te
  text: అయితే సెరూయా కుమారుడు అబీషై దావీదుకు సహాయం చేసి, ఆ ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు. అప్పుడు దావీదు మనుషులు దావీదుకు ప్రమాణం చేసి, “ఇశ్రాయేలు దీపాన్ని[a] నీవు ఆర్పివేయకుండా ఉండేందుకు, ఇకమీదట నీవు మాతో కలిసి యుద్ధానికి రాకూడదు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు వెలుగును.” హీబ్రూలో అక్షరార్థంగా “దీపం” అని ఉంది. ఇది దేశ జీవితం, స్థిరత్వంలో దావీదుకున్న కీలక పాత్రను సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: దావీదుకు సహాయం చేసి
  rationale: עזר అంటే ‘సహాయం చేయడం.’ తెలుగు వాక్యంలో సర్వనామ సందిగ్ధతను నివారించడానికి సందర్భానుసారంగా ‘దావీదుకు’ అని స్పష్టం చేయబడింది; యుద్ధంలో అబీషై జోక్యం చేసుకున్న భావం నిలిచింది.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు అబీషై
  rationale: హీబ్రూ వ్యక్తి పేర్లు తెలుగు ఉచ్చారణ సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; בן సంబంధాన్ని ‘కుమారుడు’గా సహజంగా తెలిపింది.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי וַיְמִיתֵהוּ
  choice: ఆ ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు
  rationale: נכה లోని ‘కొట్టు’ భావాన్ని, తరువాతి מות హిఫీల్‌లోని ‘చంపు’ భావాన్ని వేర్వేరుగా ఉంచుతూ తెలుగులో సహజమైన వరుస చర్యగా అనువదించబడింది.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: అప్పుడు దావీదు మనుషులు అతనితో ప్రమాణం చేస్తూ
  rationale: נשבע లోని గంభీరమైన ప్రమాణ స్వభావాన్ని ‘ప్రమాణం చేస్తూ’ తెలియజేస్తుంది. לוֹ ఇక్కడ ప్రమాణం ఎవరిని ఉద్దేశించి చేశారో సూచిస్తున్నందున ‘అతనితో’గా ఇవ్వబడింది.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: ఇకమీదట నీవు మాతో కలిసి యుద్ధానికి రాకూడదు
  rationale: ప్రమాణ సందర్భంలోని అసంపూర్ణ క్రియకు ఉన్న బలమైన నిషేధార్థాన్ని ‘రాకూడదు’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תְכַבֶּה
  choice: ఆర్పివేయకుండా ఉండడానికి
  rationale: రూపరీత్యా సముచ్చయంతో కూడిన నిషేధ వాక్యభాగమైనా, ముందున్న ఆంక్షకు కారణం లేదా నివారించవలసిన ఫలితాన్ని ఇది సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలిపేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: נֵר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దీపాన్ని
  rationale: נֵר యొక్క మూలార్థం ‘దీపం.’ దావీదు దేశ జీవితానికి, స్థిరత్వానికి అత్యవసరమైనవాడనే రూపకాన్ని వివరణగా మార్చకుండా అలాగే నిలిపింది.
theological_decisions:
- issue: దావీదును ఇశ్రాయేలును నిలబెట్టే వెలుగుగా సూచించే రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు దీపం’ అనే రూపకాన్ని నిలిపివేయడం
  alternative: ‘ఇశ్రాయేలు వెలుగు’ లేదా ‘ఇశ్రాయేలు ఆశ’
  rationale: హీబ్రూ పాఠ్యం భావాన్ని అమూర్త వివరణగా కాకుండా ‘దీపం’ అనే నిర్దిష్ట రూపకంతో చెబుతుంది. దానిని అలాగే ఉంచడం సాహిత్య, రాజసంబంధ భావాలను అతిగా వ్యాఖ్యానించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కథన శైలిని పాటించాం. మూలంలోని ‘దీపం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
