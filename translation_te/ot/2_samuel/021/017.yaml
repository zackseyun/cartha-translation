  to: అయితే సెరూయా కుమారుడు అబీషై దావీదుకు సహాయం చేసి, ఆ ఫిలిష్తీయుణ్ణి కొట్టి చంపాడు. అప్పుడు దావీదు మనుషులు దావీదుకు ప్రమాణం చేసి, “ఇశ్రాయేలు దీపాన్ని[a] నీవు ఆర్పివేయకుండా ఉండేందుకు, ఇకమీదట నీవు మాతో కలిసి యుద్ధానికి రాకూడదు” అన్నారు.
