  source_fidelity: మొదటి వాక్యంలోని పరిహార/దావా భావం మూలంలోని నానుడి ప్రయోగానికి, ఆంగ్ల POB నిర్ణయానికి అనుగుణంగా ఉంది. అయితే “చంపడం మా పని కాదు” కంటే మూలంలోని చట్టబద్ధమైన పరిధి లేదా అధికారం లేదనే సందర్భార్థాన్ని మరింత స్పష్టంగా, కానీ అతిగా విస్తరించకుండా చెప్పవచ్చు. చివరి ప్రశ్నలో తెలుగులో పదక్రమం సవరించితే దావీదు వారి కోరిక ఏమిటో అడుగుతున్న భావం స్పష్టమవుతుంది.
