source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ הַ/גִּבְעֹנִ֗ים אֵֽין ל/י כֶּ֤סֶף וְ/זָהָב֙ עִם שָׁא֣וּל וְ/עִם בֵּית֔/וֹ וְ/אֵֽין לָ֥/נוּ אִ֖ישׁ לְ/הָמִ֣ית בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֛אמֶר מָֽה אַתֶּ֥ם אֹמְרִ֖ים אֶעֱשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: te
  text: 'గిబియోనీయులు అతనికి ఇలా అన్నారు: “వెండి బంగారాల విషయంలో సౌలుమీదగానీ అతని ఇంటివారిమీదగానీ మాకు ఎలాంటి దావా లేదు[a]. ఇశ్రాయేలులో ఎవ్వరినీ చంపే అధికారం మాకు లేదు[b].” అప్పుడు అతడు, “నేను మీకోసం ఏమి చేయాలని మీరు చెబుతున్నారు?” అని అడిగాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకూ సౌలుకు, అతని ఇంటివారికి మధ్య ఉన్న విషయం వెండి బంగారాలకు సంబంధించినది కాదు.” ఈ హీబ్రూ ప్రయోగం నానుడి రూపంలో ఉంది; అది బహుశా ధనపరిహారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలులో ఎవ్వరినీ చంపడం మా వంతు కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: సౌలు మీదగానీ అతని ఇంటివారి మీదగానీ వెండిబంగారాల కోసం మాకు ఎలాంటి దావా లేదు
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం తమ వద్ద వెండిబంగారాలు లేవని చెప్పడం కాదు; సౌలు కుటుంబం నుండి ధనపరిహారం కోరడం లేదనే భావాన్ని సందర్భం సూచిస్తుంది. సమూహం తరఫున పలికిన ఏకవచన לִיని తెలుగులో సహజమైన బహువచనంగా ఇచ్చాం.
- source_word: עִם
  choice: మీదగానీ … మీదగానీ
  rationale: עִם సాధారణంగా ‘తో’ అని అర్థమైనా, ఇక్కడ వివాదం లేదా దావాలో ఎవరిపై ఆ దావా ఉందో సూచిస్తుంది. అందువల్ల ‘మీద’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ఎవరినైనా చంపడం మా పని కాదు
  rationale: ఈ సంక్షిప్త హీబ్రూ వాక్యం చంపడానికి వ్యక్తి లేడని కాక, అలా చేయడం తమ పరిధి లేదా హక్కు కాదని సూచించే అవకాశం ఎక్కువ. ‘మా పని కాదు’ ఆ భావాన్ని సహజంగా ఉంచుతూ, హక్కు అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో మరీ స్పష్టంగా నిశ్చయించదు.
- source_word: אִישׁ
  choice: ఎవరినైనా
  rationale: ఇక్కడ אִישׁ ఒక వ్యక్తిని సాధారణార్థంలో సూచిస్తుంది. తెలుగులో ‘ఎవరినైనా’ సహజంగా, సమగ్రంగా ఆ సాధారణ భావాన్ని అందిస్తుంది.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: నేను మీకు ఏమి చేయాలని మీరు అంటున్నారు?
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్త నిర్మాణాన్ని నిలుపుకుంటూనే, వారు కోరే పరిష్కారాన్ని చెప్పమని దావీదు అడుగుతున్న భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గిబియోనీయులు ఇశ్రాయేలులో ఒకరిని చంపడం గురించి చెప్పిన మాట అధికారం లేకపోవడాన్నా, చంపడానికి వ్యక్తి లేకపోవడాన్నా సూచిస్తుందా?
  choice: ‘చంపడం మా పని కాదు’ అని అనువదించి అధికారం లేదా హక్కు తమది కాదనే సందర్భార్థాన్ని సూచించడం
  alternative: ‘చంపడానికి ఇశ్రాయేలులో మాకు ఎవరూ లేరు’
  rationale: తదుపరి సంభాషణలో రాజే చర్యకు అనుమతి ఇవ్వవలసిన నేపథ్యం కనిపిస్తుంది. అయినా హీబ్రూ వాక్యం సంక్షిప్తంగా ఉన్నందున ప్రధాన పాఠం ‘హక్కు లేదు’ అని పూర్తిగా నిర్ణయించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘దావా’ న్యాయపరమైన లేదా పరిహార సంబంధ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘మా పని కాదు’ మూలంలోని సంక్షిప్తతను, కొంత అస్పష్టతను కాపాడుతుంది.
