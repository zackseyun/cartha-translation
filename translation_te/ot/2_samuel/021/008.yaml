revisions:
- from: కాబట్టి రాజు, అయ్యా కుమార్తె రిస్పా సౌలుకు కన్న ఇద్దరు కుమారులైన అర్మోనీని, మెఫీబోషెతును, అలాగే సౌలు కుమార్తె మీకాల[a] మెహోలాతీయుడైన బర్జిల్లయి కుమారుడు అద్రీయేలుకు కన్న ఐదుగురు కుమారులను తీసుకున్నాడు.
  to: అప్పుడు రాజు అయ్యా కుమార్తె రిస్పా సౌలుకు కన్న ఇద్దరు కుమారులను—అర్మోనీని, మెఫీబోషెతును—మరియు సౌలు కుమార్తె మీకాల[a] అద్రీయేలుకు కన్న ఐదుగురు కుమారులను తీసుకున్నాడు. ఆ అద్రీయేలు మెహోలాతీయుడైన బర్జిల్లయి కుమారుడు.
  rationale: The revision retains the WLC reading మీకాల in the main text and preserves the Merab variant at the same anchor. It makes the narrative connective less interpretively causal, clarifies the two enumerated groups through Telugu apposition, and makes Adriel’s identity syntactically explicit. No harmonization of the Michal/Merab difficulty has been imposed.
  reviewer_model: gpt-5.6-terra
