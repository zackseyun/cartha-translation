reference: 2 Samuel 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: te
  text: అప్పుడు రాజు అయ్యా కుమార్తె రిస్పా సౌలుకు కన్న ఇద్దరు కుమారులను—అర్మోనీని, మెఫీబోషెతును—మరియు సౌలు కుమార్తె మీకాల[a] అద్రీయేలుకు కన్న ఐదుగురు కుమారులను తీసుకున్నాడు. ఆ అద్రీయేలు మెహోలాతీయుడైన బర్జిల్లయి కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులు, ప్రాచీన వ్యాఖ్యాతలు ‘మీకాల’కు బదులుగా ‘మేరబు’ అని చదువుతారు. అద్రీయేలు సౌలు కుమార్తె మేరబును వివాహం చేసుకున్నాడని చెప్పే 1 సమూయేలు 18:19తో పోల్చండి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: కాబట్టి ... తీసుకున్నాడు
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తూ, ముందు వచనంలోని నిర్ణయానికి వచ్చిన ఫలితాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూ మూలం దావీదు అనే పేరుకు బదులు బిరుదునే ఉపయోగిస్తుంది; అందువల్ల ‘రాజు’ అని ఉంచాం.
- source_word: שְׁנֵי בְּנֵי
  choice: ఇద్దరు కుమారులు
  rationale: వ్యక్తులను లెక్కించేటప్పుడు ఆధునిక తెలుగులో సహజమైన వ్యక్తివాచక సంఖ్యారూపాన్ని ఉపయోగించాం.
- source_word: רִצְפָּה בַת אַיָּה
  choice: అయ్యా కుమార్తె రిస్పా
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం; పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: సౌలుకు కన్న
  rationale: ילד తో కూడిన ל తండ్రిని సూచిస్తుంది. ‘సౌలుకు కన్న’ అనేది సంబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలిపే సహజ తెలుగు రూపం.
- source_word: אַרְמֹנִי וְאֶת מְפִבֹשֶׁת
  choice: అర్మోనీని, మెఫీబోషెతును
  rationale: వ్యక్తిపేర్లను లిప్యంతరీకరించి, ప్రత్యక్ష కర్మను తెలుగు విభక్తులతో స్పష్టంగా చూపించాం.
- source_word: חֲמֵשֶׁת בְּנֵי
  choice: ఐదుగురు కుమారులు
  rationale: మనుషులను సూచించే సంఖ్యకు తగిన తెలుగు వర్గసూచకాన్ని వాడాం.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: సౌలు కుమార్తె మీకాల
  rationale: WLC హీబ్రూ పాఠంలో ఉన్న ‘మీకాల’నే ప్రధాన పాఠంలో నిలిపాం; ‘మేరబు’ అనే పాఠభేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: అద్రీయేలుకు కన్న
  rationale: మొదటి సమాన నిర్మాణంతో ఏకరీతిని కాపాడుతూ, హీబ్రూలో మీకాలే ఈ కుమారులను కన్నదని ఉన్న వాక్యసంబంధాన్ని పరిష్కరించకుండా యథాతథంగా ఉంచాం.
- source_word: בֶּן בַּרְזִלַּי הַמְּחֹלָתִי
  choice: మెహోలాతీయుడైన బర్జిల్లయి కుమారుడు
  rationale: తండ్రి సంబంధాన్నీ, ప్రాంతీయ గుర్తింపునీ సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
theological_decisions:
- issue: అద్రీయేలు కుమారుల తల్లిగా ‘మీకాల’ను పేర్కొనడంలో కనిపించే చారిత్రక/పాఠ్య ఉద్రిక్తత
  choice: హీబ్రూ మూలపాఠంలోని ‘మీకాల’ను ప్రధాన పాఠంలో ఉంచి, ‘మేరబు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం
  alternative: సౌలు కుమార్తె మేరబు
  rationale: ఇక్కడి హీబ్రూ పాఠం ‘మీకాల’ అని చదువుతుంది; 1 సమూయేలు 18:19లో అద్రీయేలు భార్యగా మేరబు చెప్పబడింది. ఈ ఉద్రిక్తతను మౌనంగా సమన్వయపరచకుండా మూలపాఠాన్ని అనుసరిస్తూ, ముఖ్యమైన పాఠభేదాన్ని పారదర్శకంగా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని నిలిపినప్పటికీ, ‘అలాగే’ మరియు విరామచిహ్నాల ద్వారా రెండు కుమారుల సమూహాలను స్పష్టంగా వేరు చేశాం. పాఠభేద సూచికను సంబంధిత ‘మీకాల’ పేరు వెంట ఉంచాం.
