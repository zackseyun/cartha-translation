  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: te
  text: ఫిలిష్తీయులకూ ఇశ్రాయేలీయులకూ మధ్య మళ్లీ యుద్ధం జరిగింది. దావీదు దిగివెళ్లాడు; అతనితోపాటు అతని సేవకులు[a] కూడా వెళ్లారు. వారు ఫిలిష్తీయులకు వ్యతిరేకంగా యుద్ధం చేశారు. దావీదు అలసిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని మనుషులు.’ హీబ్రూలో ‘అతని సేవకులు’ అని ఉంది. రాజు సేవలో ఉన్నవారిని, సైనిక అనుచరులతో సహా, సూచించడానికి ఈ పదాన్ని సాధారణంగా వాడేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: మళ్లీ యుద్ధం జరిగింది
  rationale: కథనంలో కొత్త పరిస్థితిని పరిచయం చేసే היה రూపాన్ని సహజమైన తెలుగులో ‘జరిగింది’గా, עוֹד సూచించే పునరావృతిని ‘మళ్లీ’గా వ్యక్తం చేస్తుంది.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: ఫిలిష్తీయులకు ఇశ్రాయేలుతో
  rationale: హీబ్రూ నిర్మాణంలోని రెండు ప్రతిపక్షాలను తెలుగులో సహజంగా చూపిస్తూ, ఎవరు దాడి ప్రారంభించారనే విషయాన్ని పాఠ్యంలో లేనంతగా నిర్ధారించదు.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: ירד యొక్క దిగువకు వెళ్లడం అనే ప్రాథమిక భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: అతనితోపాటు అతని సేవకులు కూడా వెళ్లారు
  rationale: ‘అతని సేవకులు’ మరియు ‘అతనితో’ అనే మూలపాఠ్యంలోని రెండు అంశాలనూ స్పష్టంగా ఉంచి, తెలుగు వాక్యనిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: וַיִּלָּחֲמוּ אֶת־פְּלִשְׁתִּים
  choice: వారు ఫిలిష్తీయులతో యుద్ధం చేశారు
  rationale: לחם క్రియ సూచించే సాయుధ పోరాటాన్ని స్పష్టమైన, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּעַף
  choice: అలసిపోయాడు
  rationale: యుద్ధంలో దావీదు నీరసించి అలసిన స్థితికి చేరాడనే క్రియాభావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
