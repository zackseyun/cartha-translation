translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించినా, సంఘటనల క్రమం మరియు మూలంలోని ముఖ్య పదబంధాలు నిలుపబడ్డాయి.
