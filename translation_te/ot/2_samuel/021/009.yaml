source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: te
  text: అతడు వారిని గిబియోనీయుల చేతికి అప్పగించాడు. వారు యహ్వే ఎదుట కొండమీద వారిని వేలాడదీశారు[a]. ఆ ఏడుగురు ఒకేసారి పడిపోయారు. కోతకాలపు తొలి రోజుల్లో, యవల కోత ఆరంభంలో, వారు చంపబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని శూలాలపై ఎక్కించారు,” లేదా “వారిని బహిరంగ ప్రదర్శనకు ఉంచారు.” హీబ్రూ క్రియ బహిరంగంగా శరీరాలను వేలాడదీయడాన్ని లేదా ప్రదర్శనకు ఉంచడాన్ని విస్తృతంగా సూచించవచ్చు; అది తప్పనిసరిగా తరువాతి కాలంలోని సంకుచిత అర్థంలో ఉరి తీయడాన్నే సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: వారిని … చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారం మరొకరి అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘చేతికి అప్పగించాడు’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: הַגִּבְעֹנִים
  choice: గిబియోనీయులు
  rationale: ఈ ప్రజాసమూహపు పేరుకు ప్రామాణికమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וַיֹּקִיעֻם
  choice: వారిని వేలాడదీశారు
  rationale: ఈ క్రియ బహిరంగంగా వేలాడదీయడం, గుచ్చి నిలబెట్టడం లేదా ప్రదర్శనకు ఉంచడం వంటి శిక్షావిధానాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘వేలాడదీశారు’ వాడి, ఖచ్చితమైన విధానంపై ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: בָּהָר
  choice: కొండమీద
  rationale: నిర్దిష్ట ఏకవచన రూపాన్ని, ఈ సందర్భంలోని స్థలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా ఎదుట
  rationale: దైవనామాన్ని యెహోవాగా ఉంచుతూ, ‘సన్నిధిలో/ఎదుట’ అనే న్యాయ-నిబంధన సంబంధిత భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: ఆ ఏడుగురూ ఒకేసారి పడిపోయారు
  rationale: మరణంలో పడిపోవడం అనే హీబ్రూ చిత్రణను, ఏడుగురి సమష్టి పరిణామాన్ని నిలుపుతుంది.
- source_word: הֻמְתוּ
  choice: వారు చంపబడ్డారు
  rationale: מות క్రియ యొక్క కారణార్థక కర్మణి రూపాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: కోతకాలపు తొలి రోజుల్లో
  rationale: కోత ప్రారంభ దశలో జరిగిన సమయాన్ని సూటిగా సూచిస్తుంది.
- source_word: תחלת קְצִיר שְׂעֹרִים
  choice: అంటే యవల కోత ఆరంభంలో
  rationale: ముందటి కాలసూచనను ఇది మరింత నిర్దిష్టంగా వివరిస్తుంది; ‘అంటే’ ఆ వివరణాత్మక సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
theological_decisions:
- issue: יקע అనే శిక్షా క్రియ యొక్క ఖచ్చితమైన అర్థం
  choice: ప్రధాన పాఠంలో ‘వేలాడదీశారు’
  alternative: ‘గుచ్చి నిలబెట్టారు’ లేదా ‘బహిరంగ ప్రదర్శనకు ఉంచారు’
  rationale: ఈ వచనం యెహోవా ఎదుట జరిగిన నిబంధన-న్యాయ సంబంధిత మరణశిక్షను వర్ణిస్తుంది. హీబ్రూ క్రియ శిక్ష లేదా మృతదేహ ప్రదర్శన యొక్క ఖచ్చితమైన విధానాన్ని నిర్దిష్టంగా తేల్చదు; అందువల్ల ప్రధాన పాఠం చదవడానికి సహజంగా ఉండగా, ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. హీబ్రూ నుడికారాన్ని యాంత్రికంగా కాకుండా ‘చేతికి అప్పగించాడు’గా సహజీకరించాం. దైవనామాన్ని ‘యెహోవా’గా ఉంచాం; మరణశిక్ష విధానంలోని అస్పష్టతను తొలగించకుండా పాదసూచికలో నమోదు చేశాం.
