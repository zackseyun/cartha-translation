  source_fidelity: ‘చేతికి అప్పగించాడు’ faithfully conveys נתן + בְּיַד as transfer into another party’s control. ‘వేలాడదీశారు’ is a permissible main-text rendering of יקע when its broader and disputed sense is retained in a footnote. The collective death imagery, timing, and barley-harvest specification are preserved.
