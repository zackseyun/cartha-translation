    issue: Divine name differs from the audited POB rendering.
    rationale: The source and English POB use Yahweh; ‘యెహోవా’ represents a different traditional vocalization. ‘యహ్వే’ better follows the project’s stated divine-name convention.
  - severity: low
    issue: The temporal apposition is introduced by ‘అంటే.’
    rationale: The Hebrew second phrase specifies the first appositionally; omitting ‘అంటే’ is more direct and avoids adding an explanatory connective.
  - severity: low
    issue: Footnote alternative ‘గుచ్చి నిలబెట్టారు’ can suggest a more specific manner than the Hebrew securely establishes.
    rationale: A wording such as ‘శూలాలపై ఎక్కించారు’ remains an explicitly alternative possibility, while the note as a whole should emphasize that the exact method is uncertain.
