translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ఏకవచన ‘అతడు’ మరియు తరువాతి బహువచన ‘వారు’ మధ్య ఉన్న మార్పును నిలిపాం.
