  terminology: “ఎముకలు,” “సౌలు,” and “యోనాతాను” are appropriate. “కొయ్యలపై వేలాడదీయబడినవారు” is a suitably broad rendering of the publicly exposed executed persons, while the footnote preserves the more specific impalement possibility and the broader exposure sense.
