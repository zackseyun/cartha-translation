  verdict: revise
  source_fidelity: The draft correctly retains the singular subject in the first clause, the plural subject in the second, the concrete reference to bones, and the sense of removal/upward bringing in וַיַּעַל. The execution/display term הַמּוּקָעִים has a disputed precise mechanism; a broad primary rendering with stated alternatives is appropriate.
