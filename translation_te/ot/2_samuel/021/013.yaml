  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַל מִ/שָּׁם֙ אֶת עַצְמ֣וֹת שָׁא֔וּל וְ/אֶת עַצְמ֖וֹת יְהוֹנָתָ֣ן בְּנ֑/וֹ וַ/יַּ֣אַסְפ֔וּ אֶת עַצְמ֖וֹת הַ/מּוּקָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/013.yaml
  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: te
  text: అతడు అక్కడి నుండి సౌలు ఎముకలనూ, సౌలు కుమారుడైన యోనాతాను ఎముకలనూ పైకి తీసుకొచ్చాడు. వారు కొయ్యలపై వేలాడదీయబడినవారి[a] ఎముకలను కూడగట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొయ్యలకు గుచ్చబడినవారు,” లేదా “బహిరంగంగా ప్రదర్శించబడినవారు.” హీబ్రూ పదం శిక్షించబడిన వారి దేహాలు బహిరంగంగా ఉంచబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి తీసుకొచ్చాడు
  rationale: עלה అనే క్రియలోని ‘పైకి తీసుకురావడం’ అనే భావాన్ని నిలుపుతూ, ఆ స్థలం నుండి ఎముకలను తీసుకువచ్చిన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుండి
  rationale: స్థలాన్ని సూచించే సరళమైన పదబంధం; మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַצְמוֹת
  choice: ఎముకలు
  rationale: ‘అవశేషాలు’ అనే విస్తృత పదానికి బదులు, మూలపదంలోని నిర్దిష్టమైన ‘ఎముకలు’ అనే అర్థాన్ని కాపాడుతుంది.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: అతని కుమారుడు యోనాతాను
  rationale: యోనాతాను సౌలు కుమారుడని స్పష్టంగా చూపుతూ, తెలుగులో సహజమైన అనుబంధ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: וַיַּאַסְפוּ
  choice: వారు ... కూడగట్టారు
  rationale: మూలంలోని మూడవ పురుష బహువచన రూపాన్ని ఏకవచనంగా సమన్వయపరచకుండా అలాగే నిలుపుతుంది.
- source_word: הַמּוּקָעִים
  choice: మ్రానులపై వేలాడదీయబడినవారు
  rationale: ఈ పదం శిక్షించబడిన వారి దేహాలను మ్రానులపై బహిరంగంగా ఉంచడాన్ని సూచిస్తుంది. ఖచ్చితమైన విధానం అనిశ్చితంగా ఉండటంతో, ప్రధాన పాఠంలో సహజమైన విస్తృత పదబంధాన్ని ఇచ్చి ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
