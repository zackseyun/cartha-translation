  to: అతడు అక్కడి నుండి సౌలు ఎముకలనూ, సౌలు కుమారుడైన యోనాతాను ఎముకలనూ పైకి తీసుకొచ్చాడు. వారు కొయ్యలపై వేలాడదీయబడినవారి[a] ఎముకలను కూడగట్టారు.
