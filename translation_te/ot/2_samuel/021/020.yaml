  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִי ע֥וֹד מִלְחָמָ֖ה בְּ/גַ֑ת וַ/יְהִ֣י אִ֣ישׁ מדין וְ/אֶצְבְּעֹ֣ת יָדָי/ו֩ וְ/אֶצְבְּעֹ֨ת רַגְלָ֜י/ו שֵׁ֣שׁ וָ/שֵׁ֗שׁ עֶשְׂרִ֤ים וְ/אַרְבַּע֙ מִסְפָּ֔ר וְ/גַם ה֖וּא יֻלַּ֥ד לְ/הָ/רָפָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: te
  text: గాతులో మళ్లీ యుద్ధం జరిగింది. అక్కడ భారీ దేహం గల ఒక మనిషి ఉన్నాడు.[a] అతని ఒక్కో చేతికి ఆరేసి వేళ్లు, ఒక్కో కాలికి ఆరేసి వేళ్లు—మొత్తం ఇరవై నాలుగు వేళ్లు—ఉన్నాయి.[b] అతడు కూడా రాఫా వంశంలో పుట్టినవాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “కొలత గల మనిషి”; “అసాధారణమైన దేహాకృతి గల మనిషి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదశః, “అతని చేతుల వేళ్లు, అతని కాళ్ల వేళ్లు—ఆరు, ఆరు”; అంటే ఒక్కో చేతికి, ఒక్కో కాలికి ఆరు వేళ్లు.
    reason: lexical_clarification
  - marker: c
    text: “రాఫాకు పుట్టినవాడు” అని పదశః అనువదించవచ్చు; లేదా “రాఫా సంతతివాడు.” ఇది దైత్యాకారులతో సంబంధమున్న రెఫాయీయుల వంశాన్ని సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: యుద్ధం
  rationale: ఈ నామవాచకం సాధారణంగా యుద్ధం లేదా సైనిక సంఘర్షణను సూచిస్తుంది; పునరావృతమైన సంఘర్షణ సందర్భానికి ‘యుద్ధం’ సహజంగా సరిపోతుంది.
- source_word: בְּגַת
  choice: గాతులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది. సైనిక చర్య జరిగిన ప్రదేశాన్ని ఆధునిక తెలుగులో ‘గాతులో’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: אִישׁ מדין
  choice: భారీ దేహం గల ఒక మనిషి
  rationale: అసాధారణమైన కొలత లేదా శరీర పరిమాణాన్ని సూచించే ఈ అరుదైన పదబంధాన్ని పదశః కాకుండా దాని సందర్భార్థంతో అనువదించాం; మూలంలోని ‘కొలత’ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: అతని ఒక్కో చేతికి ... వేళ్లు, ఒక్కో కాలికి ... వేళ్లు
  rationale: హీబ్రూ చేతుల వేళ్లను, కాళ్ల వేళ్లను విడిగా పేర్కొంటుంది. తెలుగులో ‘చేతివేళ్లు’, ‘కాలివేళ్లు’ అనే భేదం సహజంగా అర్థమవుతుంది.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: ఆరేసి ... ఆరేసి
  rationale: హీబ్రూలోని సంఖ్య పునరుక్తిని తెలుగులో సహజంగా నిలుపుతూ, తరువాత చెప్పిన మొత్తం ఇరవై నాలుగుతో సరిపోయేలా ప్రతి చేతికీ, ప్రతి కాలికీ ఆరు వేళ్లు ఉన్నాయని స్పష్టం చేస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: మొత్తం ఇరవై నాలుగు వేళ్లు
  rationale: ఇది అన్ని వేళ్ల సంఖ్యను కలిపి చెప్పే సారాంశ వాక్యభాగం; ‘మొత్తం’ అనే పదం ఆ గణనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֻלַּד לְהָרָפָה
  choice: రాఫా వంశంలో పుట్టినవాడు
  rationale: ילד యొక్క కర్మణి రూపం, לְ తో కలిసి, జననం లేదా వంశసంబంధాన్ని సూచిస్తుంది. ‘రాఫా’ను కేవలం ‘దైత్యుడు’గా మార్చకుండా వంశనామంగా నిలిపాం.
theological_decisions:
- issue: הָרָפָה అనే పదం ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: రాఫా అనే పూర్వికుడు లేదా వంశానికి చెందినవాడనే భావం
  alternative: దైత్యునికి పుట్టినవాడు; రెఫాయీయుల సంతతివాడు
  rationale: సందర్భం శరీర పరిమాణాన్ని మాత్రమే కాక వంశసంబంధాన్ని కూడా సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘రాఫా’ అనే పేరును ఉంచడం ద్వారా రెఫాయీయులతో ఉన్న సాధ్యమైన సంబంధాన్ని బలవంతంగా నిర్ధారించకుండా భావసందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘ఆరేసి’ అనే సహజ తెలుగు రూపం మూలంలోని సంఖ్య పునరుక్తిని నిలుపుతుంది; అరుదైన వంశనామం ‘రాఫా’ను వ్యాఖ్యానించి మార్చకుండా ప్రధాన పాఠ్యంలో ఉంచాం.
