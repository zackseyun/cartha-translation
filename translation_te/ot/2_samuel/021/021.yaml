id: 2SA.21.21
reference: 2 Samuel 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: te
  text: అతడు ఇశ్రాయేలును ధిక్కరించాడు. అప్పుడు దావీదు సోదరుడైన షిమీ[a] కుమారుడు యోనాతాను అతణ్ణి కొట్టి చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులు, అలాగే 1 దినవృత్తాంతాలు 20:7లోని సమాంతర వాక్యం, ఇక్కడ ‘షిమీ’కి బదులుగా ‘షిమ్యా’ అని చదువుతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: ధిక్కరించాడు
  rationale: యుద్ధ సందర్భంలో חרף అవమానకరంగా సవాలు చేయడం, ఎదిరించడం అనే భావాన్ని ఇస్తుంది. ‘ధిక్కరించాడు’ ఆ శత్రుత్వపూరిత సవాలును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: మూలంలో ప్రత్యక్ష కర్మగా ఉన్న జాతీయ సమూహనామం ‘ఇశ్రాయేలు’ను విస్తరించకుండా అలాగే నిలుపుతుంది.
- source_word: וַיַּכֵּהוּ
  choice: అతణ్ణి కొట్టి చంపాడు
  rationale: נכה ప్రాథమికంగా ‘కొట్టు’ అని అర్థం; ఈ యుద్ధ సందర్భంలో ఆ దెబ్బ ప్రాణాంతకమైనదని కథనం సూచిస్తుంది. ఈ అనువాదం దెబ్బకొట్టే చిత్రాన్ని, ఫలితాన్ని రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: בֶּן שמעי
  choice: షిమీ కుమారుడు
  rationale: ప్రస్తుత హీబ్రూ పాఠంలోని שמעי రూపాన్ని అనుసరిస్తూ, వంశసంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో తెలిపింది; ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֲחִי דָוִד
  choice: దావీదు సోదరుడైన
  rationale: ‘దావీదు సోదరుడు’ అనే మూలంలోని బంధుత్వ గుర్తింపును షిమీకి సహజంగా అనుసంధానిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పేర్లను ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాల్లో ఇచ్చాం. పాదసూచిక గుర్తును అది వివరించే ‘షిమీ’ పేరుకే జోడించాం.
