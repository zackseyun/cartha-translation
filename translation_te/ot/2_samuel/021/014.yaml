  edition: WLC
  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: te
  text: వారు సౌలు ఎముకలను, అతని కుమారుడైన యోనాతాను ఎముకలను బెన్యామీను ప్రాంతంలోని సెలాలో, సౌలు తండ్రి కీషు సమాధిలో పాతిపెట్టారు. రాజు ఆజ్ఞాపించినదంతా వారు చేశారు. ఆ తర్వాత దేశం కోసం చేసిన విన్నపానికి దేవుడు అనుకూలంగా స్పందించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశం కోసం దేవుడు వేడుకొనబడ్డాడు,” లేదా “దేశం కోసం చేసిన ప్రార్థనకు దేవుడు జవాబిచ్చాడు.” హీబ్రూ క్రియ విన్నపానికి అనుకూలంగా స్పందించే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: వారు ... పాతిపెట్టారు
  rationale: קבר అనే క్రియను సహజమైన తెలుగు కథన భూతకాలంలో అందించింది; వాక్యారంభంలోని וַ క్రమాన్ని సందర్భం ద్వారా నిలిపింది.
- source_word: עַצְמוֹת שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: సౌలు ఎముకలను, అతని కుమారుడైన యోనాతాను ఎముకలను
  rationale: ‘ఎముకలు’ అనే స్పష్టమైన మూలపదాన్ని నిలిపి, తెలుగులో సంబంధం సందిగ్ధం కాకుండా యోనాతాను సౌలు కుమారుడని తెలిపింది.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: బెన్యామీను ప్రాంతంలోని
  rationale: אֶרֶץ యొక్క ప్రాంతీయ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּצֵלָע
  choice: సెలాలో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: సౌలు తండ్రి కీషు సమాధిలో
  rationale: ‘అతని తండ్రి’ అనే హీబ్రూ ప్రయోగంలో సూచితుడు సౌలు అని తెలుగులో స్పష్టం చేసింది; קֶבֶר కు సందర్భానుకూలంగా ‘సమాధి’ వాడింది.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞాపించినదంతా వారు చేశారు
  rationale: మూలంలోని సంపూర్ణతను, ఆజ్ఞ భావాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: దేశం కోసం చేసిన వేడుకకు దేవుడు అనుకూలంగా స్పందించాడు
  rationale: עתר నిఫాల్ రూపంలోని విన్నపానికి అనుకూలంగా స్పందించే భావాన్ని తెలియజేస్తుంది; విన్నపం చేసిన వ్యక్తిని మూలం చెప్పనందున పేర్కొనలేదు.
- source_word: אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: సాధారణమైన, స్పష్టమైన కాలక్రమ సూచన.
theological_decisions:
- issue: וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ యొక్క భావం
  choice: దేశం కోసం చేసిన వేడుకకు దేవుడు అనుకూలంగా స్పందించాడు
  alternative: దేశం కోసం దేవుడు ప్రార్థనకు జవాబిచ్చాడు; దేశం కోసం దేవుడు వేడుకొనబడ్డాడు
  rationale: హీబ్రూ క్రియ విన్నపానికి అనుకూల స్పందనను సూచిస్తుంది. ‘ప్రార్థన’ అనడం సాధ్యమైనప్పటికీ మూలంలో ఆ నామవాచకం లేదు; ‘దేశాన్ని స్వస్థపరిచాడు’ అనడం మూలానికి మించిన వివరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి. పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా ఉంచబడ్డాయి; అంతర్లీన విన్నప భావం ప్రధాన పాఠ్యంలో కనిపించేలా చేసి, సాధ్యమైన ప్రత్యామ్నాయ నిర్మాణాలను పాదసూచికలో ఇచ్చింది.
