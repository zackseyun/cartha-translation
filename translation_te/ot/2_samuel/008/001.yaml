source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: te
  text: ఆ తర్వాత దావీదు ఫిలిష్తీయులపై దాడి చేసి, వారిని అణచివేశాడు. దావీదు ఫిలిష్తీయుల చేతిలోనుండి మెతెగ్-హమ్మాను[a] తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థంగా “తల్లి యొక్క కళ్లెం” అని అర్థం; ఇది కష్టమైన ప్రయోగం. ప్రధాన నగరంపై నియంత్రణను సూచించే నుడికారం కావచ్చు. 1 దినవృత్తాంతాలు 18:1లో దీనికి సమాంతరంగా “గాతును, దానికి చెందిన పట్టణాలను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: కథనంలోని కాలక్రమ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూ వాక్యారంభ సూత్రాన్ని అనవసరంగా పదానువాదం చేయదు.
- source_word: וַיַּךְ
  choice: ఓడించి
  rationale: సైనిక సందర్భంలో נכה దాడిచేసి జయించడాన్ని సూచిస్తుంది. తరువాతి క్రియ ఫలితంగా అధీనపరచడాన్ని చెబుతుంది కాబట్టి, తెలుగులో ‘ఓడించి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులను
  rationale: ఈ ప్రజాసమూహపు పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וַיַּכְנִיעֵם
  choice: వారిని తన అధీనంలోకి తెచ్చాడు
  rationale: హిఫిల్ రూపంలోని כנע రాజకీయ-సైనిక లోబడుదలను సూచిస్తుంది. ఈ ప్రయోగం ఆ ఫలితాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּקַּח
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: లక్ష్యవస్తువు ఒక నగరం లేదా అధికార కేంద్రం కావచ్చని సందర్భం సూచిస్తున్నందున, לקח యొక్క ‘తీసుకోవడం’ అనే భావాన్ని సైనిక సందర్భానికి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֶתֶג הָאַמָּה
  choice: మెతెగ్-హమ్మాను[a]
  rationale: అర్థం కష్టమైన ఈ హీబ్రూ పదబంధాన్ని నిర్ధారిత నగరపేరుగా గానీ, ‘మాతృనగరపు కళ్లెం’ అనే వివరణగా గానీ ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా లిప్యంతరీకరించాం; సందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: అధికారం లేదా స్వాధీనాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
