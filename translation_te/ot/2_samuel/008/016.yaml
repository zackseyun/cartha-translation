source:
  edition: WLC
  text: וְ/יוֹאָ֥ב בֶּן צְרוּיָ֖ה עַל הַ/צָּבָ֑א וִ/יהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד מַזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/016.yaml
  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: te
  text: సెరూయా కుమారుడైన యోవాబు సైన్యానికి అధిపతిగా ఉన్నాడు[a]; అహీలూదు కుమారుడైన యెహోషాపాతు నమోదుల అధికారిగా ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘సైన్యంపై ఉన్నాడు’; లేదా, ‘సైన్యానికి నాయకత్వం వహించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘నమోదుల అధికారి’ అనేది రాజు వద్ద విషయాలను నమోదు చేసి నివేదించే రాజసభ అధికారిని సూచించే పదవిగా సాధారణంగా అర్థం చేసుకుంటారు. ప్రత్యామ్నాయంగా, ‘లేఖనాధికారి,’ ‘కార్యదర్శి,’ లేదా ‘చరిత్రకారుడు’ అని అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: సైన్యానికి అధిపతిగా ఉన్నాడు
  rationale: అధికారుల జాబితాలో עַל అనేది అధికారం లేదా పర్యవేక్షణను సూచిస్తుంది. తెలుగులో ‘సైన్యానికి అధిపతిగా’ అనడం సహజంగా ఉండి, యోవాబు సైన్యంపై అధికారంలో ఉన్నాడనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַזְכִּיר
  choice: రాజ్య వ్యవహారాలను నమోదు చేసి రాజుకు నివేదించే అధికారి
  rationale: ఈ పదం రాజసభలో విషయాలను నమోదు చేసి రాజుకు నివేదించే బాధ్యతగల అధికార పదవిని సూచిస్తుంది. ఒకే ఆధునిక తెలుగు పదం ఆ పదవి పరిధిని స్పష్టంగా అందించకపోవడంతో, దాని కార్యాన్ని సంక్షిప్తంగా వివరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశ లేదా కుటుంబ గుర్తింపులో בֶּן కు నేరమైన, సహజమైన తెలుగు సమానం ‘కుమారుడు’.
- source_word: וְ / וִ
  choice: రెండు సమాంతర వాక్యాలుగా
  rationale: హీబ్రూ సంధులు అధికారుల జాబితాలో అంశాలను కలుపుతున్నాయి. ఆధునిక తెలుగులో సహజమైన ప్రవాహం కోసం రెండు సమాంతర వాక్యాలుగా ఇచ్చినా, జాబితా సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: యోవాబు / సెరూయా / యెహోషాపాతు / అహీలూదు
  rationale: హీబ్రూ పేర్ల ఉచ్చారణను అనుసరించి, ఆధునిక తెలుగు బైబిలు పాఠకులకు సులభంగా చదవదగిన రూపాల్లో లిప్యంతరీకరించాం.
