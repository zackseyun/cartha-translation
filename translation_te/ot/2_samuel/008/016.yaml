  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజ అధికారుల జాబితాకు తగిన గంభీరమైన కానీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ పరిపాలనా పదవికి ఖచ్చితమైన ఏకపద తెలుగు సమానం లేకపోవడంతో మַזְכִּיר యొక్క విధిని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా వివరించాం.
