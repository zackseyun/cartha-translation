source:
  edition: WLC
  text: וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וּ/בְנֵ֥י דָוִ֖ד כֹּהֲנִ֥ים הָיֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా కెరేతీయులకూ పెలేతీయులకూ అధిపతిగా ఉన్నాడు. దావీదు కుమారులు యాజకులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన అధికారులు’ లేదా ‘రాజాధికారులు.’ హీబ్రూ పదం సాధారణంగా ‘యాజకులు’ అనే అర్థాన్నిస్తుంది; అయితే ఇక్కడ రాజపాలనకు సంబంధించిన అధికారుల జాబితా సందర్భం ఉన్నందున, కొందరు దీన్ని విస్తృతమైన రాజసభ పదవిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן־יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְהַכְּרֵתִי
  choice: కెరేతీయులు
  rationale: ఇది ఒక ప్రజా లేదా సైనిక సమూహాన్ని సూచించే పేరు. దాని నిర్దిష్ట గుర్తింపును ముందే నిర్ణయించకుండా హీబ్రూ రూపాన్ని లిప్యంతరీకరించాం.
- source_word: וְהַפְּלֵתִי
  choice: పెలేతీయులు
  rationale: కెరేతీయులతో జతగా ఉన్న సమూహనామం కావడంతో, వ్యాఖ్యానాత్మక అర్థాన్ని చేర్చకుండా నేరుగా లిప్యంతరీకరించాం.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: ఈ హీబ్రూ పదానికి సాధారణమైన, ప్రత్యక్ష అర్థం ‘యాజకులు.’ రాజపాలన సందర్భంలో దీనికి విస్తృతమైన అధికార పదవి అనే భావం ఉండవచ్చన్న అవకాశాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో మూలపదం కలిగించే ఉద్రిక్తతను నిలిపాం.
- source_word: הָיוּ
  choice: ఉన్నారు
  rationale: హీబ్రూ క్రియ యొక్క సాధారణ అస్తిత్వార్థాన్ని సహజమైన తెలుగు విధేయ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: బెనాయా కెరేతీయులకూ పెలేతీయులకూ అధిపతిగా ఉన్నాడు
  rationale: హీబ్రూ జాబితా నిర్మాణంలో సంబంధం సంక్షిప్తంగా ఉంది; ముందున్న రాజాధికారుల జాబితా సందర్భం ఆధారంగా బెనాయా ఈ రెండు దళాలకు అధిపతి అనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపాం.
theological_decisions:
- issue: దావీదు కుమారులను כֹּהֲנִים అని పిలవడం
  choice: ప్రధాన పాఠ్యంలో ‘యాజకులు’ అని ఉంచడం
  alternative: ‘ప్రధాన పరిచారకులు’ లేదా ‘రాజాధికారులు’
  rationale: దావీదు కుమారులు సాధారణంగా ఆరాధనా సంబంధమైన లేవీయ యాజకులుగా అర్థం చేసుకోబడకపోయినా, మూలపదానికి సహజమైన అర్థం ‘యాజకులు.’ ఈ చారిత్రక-వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో తొలగించకుండా, రాజసభ పదవిని సూచించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని వాడాం. సమూహనామాలను లిప్యంతరీకరించాం; ‘యాజకులు’ అనే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భాధారిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
