source:
  edition: WLC
  text: וַ/יַּ֣ךְ דָּוִ֔ד אֶת הֲדַדְעֶ֥זֶר בֶּן רְחֹ֖ב מֶ֣לֶךְ צוֹבָ֑ה בְּ/לֶכְתּ֕/וֹ לְ/הָשִׁ֥יב יָד֖/וֹ בִּֽ/נְהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: te
  text: దావీదు రెహోబు కుమారుడైన, సోబా రాజైన హదదెజెరును[a], అతడు నది వద్ద తన అధికారాన్ని పునరుద్ధరించడానికి[b] వెళ్లినప్పుడు, ఓడించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘హదదెజెరు’; కొన్ని పాఠ సంప్రదాయాల్లోనూ 1 దినవృత్తాంతములలోని సమాంతర వృత్తాంతంలోనూ ‘హదరెజెరు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా ‘తన ఆధిపత్యాన్ని తిరిగి పొందడానికి’; అక్షరార్థంగా, ‘తన చేతిని తిరిగి స్థాపించడానికి.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘నది’ బహుశా యూఫ్రటీసు నదిని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: ఓడించాడు
  rationale: נכה అనే క్రియ యుద్ధ సందర్భంలో కొట్టడం లేదా పరాజయం కలిగించడం అనే భావాన్ని ఇస్తుంది. ఈ వచనం హతమార్చాడని స్పష్టంగా చెప్పనందున, సహజమైన తెలుగు కోసం ‘ఓడించాడు’ అని అనువదించబడింది.
- source_word: הֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: WLC లోని హీబ్రూ రూపాన్ని తెలుగు లిపిలో ధ్వన్యనువాదం చేశాం; ప్రత్యామ్నాయ పాఠరూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֶּן רְחֹב
  choice: రెహోబు కుమారుడు
  rationale: సరళమైన పితృనామ నిర్మాణాన్ని యథార్థంగా నిలిపే అనువాదం.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం; స్థలనామాన్ని ధ్వన్యనువాదం చేశాం.
- source_word: בְּלֶכְתּוֹ
  choice: అతడు ... వెళ్లినప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని సూచిస్తుంది.
- source_word: לְהָשִׁיב יָדוֹ
  choice: తన అధికారాన్ని తిరిగి స్థాపించుకోవడానికి
  rationale: అక్షరార్థంగా ‘తన చేతిని తిరిగి స్థాపించడానికి’ అనే హీబ్రూ నుడికారం సైనిక-రాజకీయ సందర్భంలో అధికారం లేదా ఆధిపత్యాన్ని సూచిస్తుంది. ‘అధికారం’ నుడికార భావాన్ని స్పష్టంగా ఇస్తూ, ‘సామ్రాజ్యం’ వంటి అతినిర్దిష్టతను నివారిస్తుంది.
- source_word: בִּנְהַר
  choice: నది దగ్గర
  rationale: మూలంలోని సాధారణ ‘నది’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపాం; అది యూఫ్రటీసును సూచించే అవకాశాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని పాఠంలో సహజంగా అందించి, దాని అక్షరార్థాన్నీ సాధ్యమైన ప్రత్యామ్నాయ భావాన్నీ పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
