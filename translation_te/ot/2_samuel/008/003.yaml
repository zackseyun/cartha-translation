  to: దావీదు రెహోబు కుమారుడైన, సోబా రాజైన హదదెజెరును[a], అతడు నది వద్ద తన అధికారాన్ని పునరుద్ధరించడానికి[b] వెళ్లినప్పుడు, ఓడించాడు.[c]
