source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: te
  text: అప్పుడు తోఈ తన కుమారుడైన యోరామును దావీదు రాజు వద్దకు పంపించాడు; దావీదు క్షేమం అడిగి తెలుసుకోవడానికీ, దావీదు హదదెజెరుపై యుద్ధం చేసి అతణ్ణి ఓడించినందుకు ఆయనను దీవించడానికీ పంపించాడు.[a] ఎందుకంటే హదదెజెరు తోఈతో యుద్ధం చేస్తుండేవాడు. యోరాము వద్ద వెండి వస్తువులు, బంగారు వస్తువులు, కంచు వస్తువులు ఉన్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రాజదౌత్య సందర్భంలో “దీవించడానికి” అనే మాట “అభినందించడానికి” అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని చేతిలో వెండి వస్తువులు, బంగారు వస్తువులు, కంచు వస్తువులు ఉన్నాయి” అని ఉంది; అంటే ఆ వస్తువులు యోరాముతో ఉన్నాయి.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపించాడు
  rationale: Wayyiqtol కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ వరుసగా జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תֹּעִי
  choice: తోఈ
  rationale: సమూయేలు గ్రంథంలోని హీబ్రూ రూపాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יוֹרָם בְּנוֹ
  choice: తన కుమారుడైన యోరామును
  rationale: బంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: దావీదు క్షేమం అడిగి తెలుసుకోవడానికి
  rationale: అక్షరార్థంగా ‘శాంతిని అడగడం’ అనే హీబ్రూ నుడికారానికి ‘క్షేమం అడిగి తెలుసుకోవడం’ సహజమైన తెలుగు సమానం.
- source_word: וּלְבָרֲכוֹ
  choice: అతణ్ణి దీవించడానికి
  rationale: ברך యొక్క ప్రాథమిక అర్థమైన ‘దీవించు’ను నిలుపుతుంది; రాజదౌత్య సందర్భంలో అభినందన భావం కూడా ఉండవచ్చని పాదసూచికలో తెలిపాం.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: అతడు హదదెజెరుతో యుద్ధం చేసి అతణ్ణి ఓడించినందుకు
  rationale: ב ఇక్కడ ప్రతికూల యుద్ధ సంబంధాన్ని సూచిస్తుంది. נכהను ‘చంపాడు’ అని అతిగా నిర్దిష్టం చేయకుండా, సైనిక సందర్భానికి తగిన ‘ఓడించాడు’గా అనువదించాం.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: ఎందుకంటే హదదెజెరు తోఈతో యుద్ధాలు చేస్తూ ఉండేవాడు
  rationale: ‘తోఈకి సంబంధించి యుద్ధాల మనిషి’ అనే సంక్షిప్త హీబ్రూ నుడికారాన్ని, బహువచన యుద్ధాల భావాన్ని నిలుపుతూ సహజమైన తెలుగులో ఇచ్చాం.
- source_word: וּבְיָדוֹ הָיוּ
  choice: యోరాము తన వెంట ... తీసుకువచ్చాడు
  rationale: అక్షరార్థంగా ‘అతని చేతిలో ఉన్నాయి’; సందర్భంలో యోరాము ఆ వస్తువులను వెంట తెచ్చాడనే భావాన్ని సహజంగా వ్యక్తం చేశాం. అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: వెండి వస్తువులు, బంగారు వస్తువులు, కంచు వస్తువులు
  rationale: כְּלִי పాత్ర, పనిముట్టు లేదా ఇతర వస్తువును సూచించగల విస్తృత పదం కాబట్టి ‘వస్తువులు’ సరైన సాధారణ పదం. נְחֹשֶׁתను ఈ సందర్భంలో ‘కంచు’గా ఇచ్చాం.
