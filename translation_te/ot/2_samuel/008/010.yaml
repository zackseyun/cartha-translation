revisions:
- from: అప్పుడు తోఈ తన కుమారుడైన యోరామును దావీదు రాజు దగ్గరికి పంపించాడు. దావీదు క్షేమం అడిగి తెలుసుకోవడానికీ, అతడు హదదెజెరుతో యుద్ధం చేసి అతణ్ణి ఓడించినందుకు అతణ్ణి దీవించడానికీ[a] అలా చేశాడు. ఎందుకంటే హదదెజెరు తోఈతో యుద్ధాలు చేస్తూ ఉండేవాడు. యోరాము తన వెంట వెండి వస్తువులు, బంగారు వస్తువులు, కంచు వస్తువులు తీసుకువచ్చాడు.[b]
  to: అప్పుడు తోఈ తన కుమారుడైన యోరామును దావీదు రాజు వద్దకు పంపించాడు; దావీదు క్షేమం అడిగి తెలుసుకోవడానికీ, దావీదు హదదెజెరుపై యుద్ధం చేసి అతణ్ణి ఓడించినందుకు ఆయనను దీవించడానికీ పంపించాడు.[a] ఎందుకంటే హదదెజెరు తోఈతో యుద్ధం చేస్తుండేవాడు. యోరాము వద్ద వెండి వస్తువులు, బంగారు వస్తువులు, కంచు వస్తువులు ఉన్నాయి.[b]
  rationale: సవరణ హదదెజెరుకు వ్యతిరేకంగా జరిగిన యుద్ధాన్ని స్పష్టం చేస్తుంది, పంపినవాడు తోఈ అనే కర్తను ఉద్దేశ్య ఉపవాక్యంలో కొనసాగిస్తుంది, మరియు వస్తువులను ‘తీసుకువచ్చాడు’ అని అదనంగా నిర్దిష్టపరచకుండా యోరాము వద్ద ఉన్నాయని చెబుతుంది. పాదసూచికల గుర్తులు రెండూ వాటి సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
