  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం నాలుగు తెలుగు వాక్యాలుగా విభజించాం; పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
