id: 2SA.8.17
reference: 2 Samuel 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: te
  text: అహీటూబు కుమారుడైన సాదోకు, అబ్యాతారు కుమారుడైన అహీమెలెకు యాజకులుగా[a] ఉన్నారు; శెరాయా కార్యదర్శిగా[b] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన అధికారులు” లేదా “రాజోద్యోగులు.” ఈ వచనం దావీదు అధికారుల జాబితాలో ఉన్నందువల్ల, కొందరు ఇక్కడి హీబ్రూ పదాన్ని విస్తృత రాజాస్థాన పరిపాలనా అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “లేఖికుడిగా.” హీబ్రూ పదం రాజాస్థానంలో లేఖన లేదా పరిపాలనా బాధ్యతలు నిర్వహించే అధికారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ అధికారుల జాబితాలో ఇది ప్రత్యక్ష పితృసంబంధాన్ని సూచించే సహజ అర్థం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: אֲחִימֶלֶךְ
  choice: అహీమెలెకు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: హీబ్రూ పదానికి సాధారణమైన, ప్రాథమికమైన అర్థం ‘యాజకులు.’ సందర్భం రాజోద్యోగుల జాబితా అయినప్పటికీ, ఆ ప్రాథమిక అర్థాన్ని మార్చడానికి తగినంత ఆధారం లేదు.
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: סוֹפֵר
  choice: కార్యదర్శి
  rationale: రాజాస్థాన సందర్భంలో ఈ పదం లేఖన, పత్రవ్యవహార, పరిపాలనా బాధ్యతలు నిర్వహించే అధికారిని సూచిస్తుంది; ఆధునిక పాఠకునికి ‘కార్యదర్శి’ ఆ పదవిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాజోద్యోగుల జాబితాలో כֹּהֲנִים పదానికి అర్థం
  choice: యాజకులు
  alternative: ప్రధాన అధికారులు లేదా రాజోద్యోగులు
  rationale: ఇక్కడ సిద్ధాంతపరమైన నిర్ణయం ఏదీ బలవంతంగా రుద్దకూడదు. పదం యొక్క సాధారణ అర్థం ‘యాజకులు’; అయితే రాజాస్థాన అధికారుల జాబితా అనే సందర్భం వల్ల విస్తృత పరిపాలనా అర్థాన్ని ప్రతిపాదించే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో సాధారణ అర్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. సమాంతర వాక్యనిర్మాణం కోసం ‘కుమారుడైన’ మరియు పదవులతో ‘గా ఉన్నారు/ఉన్నాడు’ అనే రూపాలను ఉపయోగించాం. మూలంలోని బహువచన ‘యాజకులు’ ఇద్దరికీ వర్తించేలా వాక్యాన్ని నిర్మించాం; పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాల వెంటనే ఉంచాం.
