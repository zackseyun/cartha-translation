source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: te
  text: అతడు ఎదోములో సైనిక స్థావరాలను ఉంచాడు; ఎదోము దేశమంతటా సైనిక స్థావరాలను ఉంచాడు. ఎదోమంతా దావీదుకు లోబడిన సేవకులయ్యారు.[a] దావీదు ఎక్కడికి వెళ్లినా యాహ్వే అతనికి విజయాన్ని అనుగ్రహించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎదోమంతా దావీదుకు బానిసలు/సేవకులయ్యారు.” ఇక్కడ “ఎదోము” అనే దేశనామం దాని ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దావీదు ఎక్కడికి వెళ్లినా యాహ్వే అతనిని రక్షించాడు (లేదా విడిపించాడు).” ఈ సైనిక సందర్భంలో ఆ రక్షణ ఫలితాన్ని ప్రధాన పాఠ్యం “విజయం”గా వ్యక్తం చేసింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: ఉంచాడు
  rationale: שׂים అనే సాధారణ ‘పెట్టు/ఉంచు’ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సైనిక చర్యను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: נְצִבִים
  choice: సైనిక స్థావరాలు
  rationale: ఎదోమును జయించి అదుపులో ఉంచిన సందర్భంలో, నియమించబడిన అధికారులకన్నా అక్కడ నిలిపిన సైనిక బలగాలు లేదా దళస్థావరాలు అనే భావం ఎక్కువగా సరిపోతుంది; పదంలోని కొంత సందిగ్ధతను పాదసూచనలో చూపవచ్చు.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: ఎదోములో / ఎదోము దేశమంతటా
  rationale: בְ స్థానాన్ని సూచిస్తుంది; בְכָל యొక్క సమగ్ర విస్తార భావాన్ని ‘దేశమంతటా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: ఎదోమంతా దావీదుకు లోబడిన సేవకులయ్యారు
  rationale: ‘ఎదోమంతా’ అనే దేశనామపు సమష్టి ప్రయోగాన్ని నిలుపుతూ, עֲבָדִים సూచించే రాజకీయ-సేవాపరమైన అధీనతను ‘లోబడిన సేవకులు’గా తెలియజేస్తుంది; ‘బానిసలు’ అనే మరింత కఠిన ప్రత్యామ్నాయాన్ని పాదసూచనలో ఉంచుతుంది.
- source_word: וַיּוֹשַׁע
  choice: విజయాన్ని అనుగ్రహించాడు
  rationale: ישׁע హిఫిల్ రూపంలోని ‘రక్షించు/విడిపించు/విజయం కలిగించు’ భావాలలో, ఈ సైనిక సారాంశ సందర్భానికి ‘విజయాన్ని అనుగ్రహించాడు’ సహజంగా సరిపోతూ దైవ కార్యసాధకత్వాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠన సంప్రదాయంలో విస్తృతంగా గుర్తించబడే విధంగా దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ఎక్కడికి వెళ్లినా
  rationale: దావీదు వెళ్లిన ప్రతి చోట అనే సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘దండెత్తి వెళ్లినా’ వంటి మూలంలో లేని సైనిక నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలుపుతుంది. తెలుగు సాధారణ బైబిలు వినియోగంలో ‘యెహోవా’ సుపరిచితం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: וַיּוֹשַׁע లో దైవ కార్యం
  choice: యెహోవా అతనికి విజయాన్ని అనుగ్రహించాడు
  alternative: యెహోవా దావీదును రక్షించాడు/విడిపించాడు
  rationale: సైనిక సందర్భంలోని విజయ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టపరుస్తుంది; అయినా క్రియకు ఉన్న రక్షణ లేదా విడుదల భావాన్ని పాదసూచనలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన వాక్యనిర్మాణం. మూలంలోని పునరుక్తిని నిలిపి, దేశనామపు సమష్టి ప్రయోగం మరియు ישׁע క్రియలోని భావ విస్తారాన్ని పాదసూచనల్లో భద్రపరిచింది.
