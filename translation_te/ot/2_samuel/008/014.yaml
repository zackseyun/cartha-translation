  terminology: “సైనిక స్థావరాలు,” “సేవకులు,” and “విజయాన్ని అనుగ్రహించాడు” fit the military and political context without imposing a doctrinal interpretation. The footnotes preserve the stronger possible sense “బానిసలు” and the lexical alternatives “రక్షించాడు/విడిపించాడు.”
