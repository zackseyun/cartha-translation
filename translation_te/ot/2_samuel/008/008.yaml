translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి. మూలంలోని స్థలనామాలు, ‘నుండి’ అనే పునరుక్తి, లోహపదంలోని సందిగ్ధత సంరక్షించబడ్డాయి.
