source:
  edition: WLC
  text: וּ/מִ/בֶּ֥טַח וּ/מִ/בֵּֽרֹתַ֖י עָרֵ֣י הֲדַדְעָ֑זֶר לָקַ֞ח הַ/מֶּ֧לֶךְ דָּוִ֛ד נְחֹ֖שֶׁת הַרְבֵּ֥ה מְאֹֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: te
  text: హదదెజెరుకు చెందిన బేతహు మరియు బేరోతై[a] పట్టణాల నుండి రాజు దావీదు అత్యధిక కంచును[b] తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 18:8లోని సమాంతర వృత్తాంతం ఈ స్థలాలను తిబ్హతు, కూను అని పేర్కొంటుంది; ఇక్కడి హెబ్రీ పాఠంలో బేతహు, బేరోతై అని ఉంది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘రాగి’; హెబ్రీ పదం సందర్భాన్ని బట్టి రాగిని లేదా కంచును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בֶּטַח
  choice: బేతహు నుండి
  rationale: సంయోజక అవ్యయం సందర్భానుసారంగా వాక్య నిర్మాణంలో కలిసిపోయింది; מִן‌ను ‘నుండి’గా అనువదించి, ఈ వచనంలోని మసొరేటిక్ స్థలనామ రూపాన్ని ‘బేతహు’గా లిప్యంతరీకరించాం.
- source_word: וּ/מִ/בֵּרֹתַי
  choice: బేరోతై నుండి
  rationale: מִן‌ను ‘నుండి’గా అనువదించి, హెబ్రీ రూపాన్ని స్థలనామంగా ‘బేరోతై’ అని లిప్యంతరీకరించాం.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: హదదెజెరుకు చెందిన పట్టణాలు
  rationale: నిర్మాణ సంబంధం ఈ పట్టణాలు హదదెజెరుకు చెందినవని లేదా అతని ఆధీనంలో ఉన్నవని సూచిస్తుంది; ‘చెందిన’ ఈ అనుబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לָקַח
  choice: తీసుకున్నాడు
  rationale: లָקַח యొక్క ప్రాథమిక అర్థమైన ‘తీసుకొను’ను నిలిపి, యుద్ధసందర్భం ఆధారంగా ‘స్వాధీనం చేసుకున్నాడు’ అని అర్థాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: రాజైన దావీదు
  rationale: హెబ్రీలోని బిరుదు-పేరు నిర్మాణాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు; ఆలయ సామగ్రికి సంబంధించిన సమాంతర సందర్భం దృష్ట్యా ప్రధాన పాఠ్యంలో సంప్రదాయబద్ధమైన ‘కంచు’ను ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַרְבֵּה מְאֹד
  choice: అపారమైన
  rationale: అత్యధిక పరిమాణాన్ని బలంగా తెలిపే ఈ హెబ్రీ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘అపారమైన’గా అందించాం.
