source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: te
  text: దావీదు రాజు వాటిని కూడా యాహ్వేకు ప్రతిష్ఠించాడు[b], తాను లోబరచుకున్న[a] అన్ని జనాంగాల నుండి ఆయన ప్రతిష్ఠించిన వెండి బంగారంతో పాటు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జయించిన.” హీబ్రూ క్రియ బలప్రయోగంతో జనాలను ఆధీనంలోకి తేవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “వాటిని” అనేది మునుపటి వచనంలో పేర్కొన్న వస్తువులను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి వచనంలోని వస్తువులను ఇప్పటికే ప్రతిష్ఠించిన సంపదకు అదనంగా చేర్చుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: మునుపటి వచనంలో పేర్కొన్న వస్తువులను సూచించే సాధారణ సర్వనామాన్ని నిలుపుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: הִקְדִּישׁ
  choice: ప్రతిష్ఠించాడు
  rationale: విలువైన వస్తువులను దేవునికి పవిత్రంగా అంకితం చేసిన ఆరాధనాసంబంధ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: బిరుదు-పేరు కలయికకు సహజమైన తెలుగు పదక్రమం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగానే ప్రతిబింబిస్తుంది.
- source_word: עִם
  choice: అలాగే … కూడా
  rationale: మునుపటి వస్తువులను వెండిబంగారాలతో కలిపే సమన్వయాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టం చేస్తుంది.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: వెండిబంగారాలను
  rationale: నిర్దిష్టమైన విలువైన లోహాల సముదాయాన్ని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: ప్రతిష్ఠించిన
  rationale: గతంలో జరిగిన అంకితాన్ని సందర్భమే తెలియజేస్తుంది; తెలుగు అసమాపక క్రియ సహజంగా సంబంధవాక్యాన్ని మోస్తుంది.
- source_word: מִכָּל הַגּוֹיִם
  choice: సమస్త జనాల దగ్గరనుంచి
  rationale: מִן యొక్క మూలం/ఎక్కడినుంచి అనే భావాన్ని, גּוֹיִם యొక్క రాజకీయ-జాతి సమూహాల అర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: తాను లోబరచుకున్న
  rationale: כּבש సూచించే బలప్రయోగంతో ఆధీనంలోకి తేవడం అనే భావాన్ని నిలుపుతూ, శాశ్వత విలీనాన్ని అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం నేరుగా ఒడంబడిక నామాన్ని వాడుతుంది; అందువల్ల దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: הקדיש యొక్క ఆరాధనాసంబంధ భావం
  choice: ప్రతిష్ఠించాడు
  alternative: అంకితం చేశాడు / పవిత్రపరిచి వేరుగా ఉంచాడు
  rationale: సంపదను దేవునికి ప్రత్యేకంగా కేటాయించిన భావాన్ని నిలుపుతుంది; వస్తువుల్లో అంతర్గత మార్పు జరిగిందని అదనంగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ వాక్యంలో ఒక్కసారి ఉన్న క్రియను తెలుగు స్పష్టత కోసం రెండో సమన్విత వాక్యంలో పునరుక్తి చేశాం; అర్థాన్ని మార్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
