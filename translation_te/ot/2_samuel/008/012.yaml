  text: from Aram[a], and from Moab, and from the Ammonites, and from the Philistines, and from Amalek, and from the spoil of Hadadezer son of Rehob[c][b], king of Zobah.
translation:
  language: te
  text: అరాము నుండి, మోయాబు నుండి, అమ్మోనీయుల నుండి,[a] ఫిలిష్తీయుల నుండి, అమాలేకు నుండి, అలాగే రెహోబు కుమారుడైన, సోబా రాజైన హదదెజెరు యొక్క దోపిడి సొమ్ము నుండి వచ్చిన వాటిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అమ్మోను కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲרָם
  choice: అరాము నుండి
  rationale: אֲרָם అనే ప్రాచీన ప్రాంత/ప్రజల స్వనామాన్ని నిలుపుతుంది; తరువాతి కాలపు ‘సిరియా’ అనే పేరుతో భర్తీ చేయదు.
- source_word: וּמִמּוֹאָב
  choice: మోయాబు నుండి
  rationale: దేశం/ప్రాంతాన్ని సూచించే స్వనామాన్ని సహజమైన తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల నుండి
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారుల నుండి’; ఆధునిక తెలుగులో జాతి/ప్రజలను సహజంగా సూచించేందుకు ‘అమ్మోనీయులు’ అని అనువదించాం.
- source_word: וּמִפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల నుండి
  rationale: హీబ్రూ జాతినామానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: וּמֵעֲמָלֵק
  choice: అమాలేకు నుండి
  rationale: మూలంలో స్పష్టమైన జాతివాచక రూపం కాక స్వనామమే ఉంది; అందువల్ల దానిని నిలిపాం.
- source_word: וּמִשְּׁלַל
  choice: కొల్లగొట్టిన సొమ్ము నుండి
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న వస్తుసంపదను సూచిస్తుంది; సాధారణ పాఠకునికి స్పష్టమైన సహజ తెలుగు ప్రయోగం.
- source_word: הֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: ఈ వచనంలోని మసోరా హీబ్రూ అక్షరరూపాన్ని అనుసరించిన లిప్యంతరీకరణ.
- source_word: בֶּן רְחֹב
  choice: రెహోబు కుమారుడు
  rationale: సాధారణ పుత్రసంబంధ నిర్మాణాన్ని నేరుగా, స్పష్టంగా తెలిపాం.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజు
  rationale: రాజబిరుదును స్థలనామంతో సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
