    issue: The final phrase is rendered as “హదదెజెరు దగ్గర కొల్లగొట్టిన సొమ్ము నుండి తీసుకున్న వాటిని.”
    rationale: The Hebrew uses a construct phrase, “the spoil of Hadadezer,” not an expression meaning spoil taken near or from Hadadezer. “తీసుకున్న” additionally supplies an action absent from the verse. A possessive rendering preserves the source wording and its ambiguity.
