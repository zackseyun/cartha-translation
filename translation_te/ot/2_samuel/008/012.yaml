translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ఈ వచనం ముందరి వాక్యాన్ని కొనసాగించే జాబితా కాబట్టి, తెలుగులో దాని వ్యాకరణ సంబంధం స్పష్టమయ్యేలా చివర ‘తీసుకున్న వాటిని’ అని పూరించాం. ప్రతి మూల ‘నుండి’ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
