  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: te
  text: దావీదు దమస్కు అరాములో సైనిక స్థావరాలను ఏర్పాటు చేశాడు.[a] అరాము దావీదుకు సేవకులై, కప్పం చెల్లించింది.[b] దావీదు ఎక్కడికి వెళ్లినా యాహ్వే అతనికి విజయం ఇచ్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అధికారులను నియమించాడు.” హెబ్రీ పదం సైనిక దళాలు లేదా స్థావరాలను, లేక నియమించబడిన అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కప్పం’గా అనువదించిన హెబ్రీ పదానికి ‘కానుక,’ ‘అర్పణ’ అనే అర్థాలు కూడా ఉన్నాయి; ఇక్కడ అది లోబడిన రాజ్యం చెల్లించే కప్పాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దావీదు ఎక్కడికి వెళ్లినా యాహ్వే అతన్ని రక్షించాడు” లేదా “విడిపించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂים అనే సాధారణ క్రియకు ‘ఉంచు, ఏర్పాటు చేయు’ అనే భావం ఉంది; సైనిక స్థావరాల సందర్భంలో ‘ఉంచాడు’ సహజంగా ఉంటుంది.
- source_word: נְצִבִים
  choice: సైనిక స్థావరాలు
  rationale: ఈ విజయయాత్ర సందర్భంలో ఈ పదం ఆక్రమిత ప్రాంతాన్ని అదుపులో ఉంచే దళాలు లేదా స్థావరాలను సూచించే అవకాశం ఎక్కువ. అయితే ‘అధికారులు’ అనే భావం కూడా సాధ్యమే; దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: దమస్కు అరాములో
  rationale: אֲרָם అనే హెబ్రీ భౌగోళిక నామాన్ని ‘సిరియా’గా మార్చకుండా ‘అరాము’గా నిలిపి, దమస్కు కేంద్రంగా ఉన్న అరాము ప్రాంతాన్ని తెలుగులో సహజమైన పదక్రమంతో తెలిపాం.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: అరాము దావీదుకు సేవచేస్తూ
  rationale: ఈ వాక్యం రాజకీయ లోబడుదలను సూచిస్తుంది. దేశాన్ని వ్యక్తిగత బానిసగా చిత్రించే అసహజ తెలుగు రూపాన్ని నివారిస్తూ, עֲבָדִים లోని సేవ/దాస్య భావాన్ని నిలిపాం.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: కప్పం చెల్లించింది
  rationale: מִנְחָה కానుక, అర్పణ లేదా కప్పం కావచ్చు. జయించబడిన రాజ్యం లోబడి చెల్లించే సందర్భంలో ‘కప్పం’ అత్యంత సందర్భోచితమైనది.
- source_word: וַיֹּשַׁע
  choice: విజయం ఇచ్చాడు
  rationale: ישׁע హిఫీల్ రూపం రక్షించడం లేదా విడిపించడం అనే మూలభావాన్ని కలిగివున్నా, ఇక్కడ యుద్ధ సందర్భంలో దావీదుకు విజయాన్ని ప్రసాదించడాన్ని సూచిస్తుంది. మూలార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, మూలనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడాం.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ఎక్కడికి వెళ్లినా
  rationale: ఈ హెబ్రీ నుడికారం దావీదు వెళ్లిన ప్రతి చోట అతనికి కలిగిన విజయాన్ని సమగ్రంగా తెలియజేస్తుంది; ‘ఎక్కడికి వెళ్లినా’ సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: עֲבָדִים అనే పదాన్ని రాజకీయ లోబడుదల సందర్భంలో వ్యక్తీకరించడం
  choice: సేవచేస్తూ
  alternative: సేవకులై; లోబడిన ప్రజలై; బానిసలై
  rationale: ఇక్కడ వ్యక్తిగత బానిసత్వం కంటే ఒక రాజ్యం మరొక రాజుకు లోబడి కప్పం చెల్లించే సంబంధమే ఉద్దేశం. ‘సేవచేస్తూ’ మూలంలోని సేవ భావాన్ని ఉంచి, అనవసరంగా వ్యక్తిగత బానిసత్వాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అరాము,’ ‘దమస్కు,’ ‘యాహ్వే’ అనే మూలనామాలను నిలిపాం. రాజకీయ దాస్యభావాన్ని అతిగా లేదా మృదువుగా చేయకుండా ‘సేవచేస్తూ కప్పం చెల్లించింది’ అని వ్యక్తీకరించాం.
