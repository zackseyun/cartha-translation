id: 2SA.8.13
reference: 2 Samuel 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ שֵׁ֔ם בְּ/שֻׁב֕/וֹ מֵ/הַכּוֹת֥/וֹ אֶת אֲרָ֖ם בְּ/גֵיא מֶ֑לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: te
  text: ఉప్పు లోయలో అరామును[a] కొట్టి పద్దెనిమిది వేల మందిని హతమార్చి తిరిగి వచ్చిన తరువాత, దావీదు తనకు పేరు తెచ్చుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని పాఠసాక్ష్యాలు, అలాగే 1 దినవృత్తాంతములు 18:12లోని సమాంతర వచనం, ఇక్కడ ‘అరాము’కు బదులు ‘ఎదోము’ అని సూచిస్తున్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ ... שֵׁם
  choice: తనకు పేరు సంపాదించుకున్నాడు
  rationale: ‘పేరు చేసుకున్నాడు’ అనే హీబ్రూ నుడికారానికి కీర్తి లేదా ప్రఖ్యాతి పొందడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘తనకు పేరు సంపాదించుకున్నాడు’ సహజంగా ఉండి ఆ నుడికార భావాన్ని నిలుపుతుంది.
- source_word: בְּשֻׁבוֹ
  choice: తిరిగి వచ్చినప్పుడు
  rationale: ఉపసర్గతో కూడిన క్రియానామ రూపం కాలసంబంధాన్ని సూచిస్తుంది; ఈ అనువాదం కథన క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵהַכּוֹתוֹ
  choice: ఓడించి ... హతమార్చి
  rationale: נכה అనే క్రియ కొట్టడం, సంహరించడం లేదా యుద్ధంలో ఓడించడం అనే పరిధిని కలిగి ఉంది. అరామును ‘ఓడించి’ అని, తరువాతి సంఖ్యను యుద్ధంలో హతమైనవారితో అనుసంధానిస్తూ ‘హతమార్చి’ అని తెలుగులో స్పష్టంగా వ్యక్తపరచబడింది.
- source_word: אֶת אֲרָם
  choice: అరామును
  rationale: మసొరెటిక్ పాఠంలో ఉన్న ప్రదేశ/ప్రజానామమైన ‘అరాము’నే ప్రధాన పాఠంలో ఉంచి, తరువాతి కాలపు ‘సిరియా’ అనే పేరును నివారించాం.
- source_word: בְּגֵיא מֶלַח
  choice: ఉప్పు లోయలో
  rationale: స్థల నామాన్ని అర్థానువాదంగా, యుద్ధం జరిగిన ప్రదేశాన్ని సూచించే సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: పద్దెనిమిది వేల మందిని
  rationale: హీబ్రూలో సంఖ్య మాత్రమే ఉంది; యుద్ధ సందర్భంలో సూచిత నామవాచకాన్ని తెలుగులో ‘మందిని’ అని చేర్చడం అర్థాన్ని సహజంగా చేస్తుంది.
theological_decisions:
- issue: ఓడించబడిన శత్రువు ఎవరు?
  choice: ప్రధాన పాఠంలో ‘అరాము’
  alternative: ‘ఎదోము’
  rationale: WLC మసొరెటిక్ పాఠం ‘అరాము’ అని చదువుతుంది. అయితే కొన్ని పాఠసాక్ష్యాలు, 1 దినవృత్తాంతములు 18:12లోని సమాంతర వచనం, ఉప్పు లోయ సందర్భం ‘ఎదోము’ పఠనానికి మద్దతిస్తాయి. అందువల్ల మూలపాఠాన్ని ప్రధాన వాక్యంలో అనుసరించి, ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీర కథనశైలిని వాడాం. హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తూ, పాఠభేదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో స్పష్టంగా ఉంచాం.
