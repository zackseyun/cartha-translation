  to: ఉప్పు లోయలో అరామును[a] కొట్టి పద్దెనిమిది వేల మందిని హతమార్చి తిరిగి వచ్చిన తరువాత, దావీదు తనకు పేరు తెచ్చుకున్నాడు.
