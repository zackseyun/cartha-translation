  source_fidelity: The draft follows the MT reading ‘Aram’ and preserves the important Edom variant in a footnote. However, it syntactically separates ‘eighteen thousand’ from David’s striking of Aram and makes the sequence appear as though he killed the eighteen thousand after returning. In the Hebrew, the number belongs with the military action from which he returned.
  naturalness: The Telugu is generally clear and in an appropriate modern narrative register. Reordering the clauses makes the event sequence and the attachment of the number natural and unambiguous in Telugu.
  terminology: ‘అరాము,’ ‘ఉప్పు లోయ,’ and ‘ఎదోము’ are suitable renderings. ‘తనకు పేరు తెచ్చుకున్నాడు’ is an idiomatic modern Telugu expression for gaining renown while retaining the sense of the Hebrew idiom.
  issues:
  - severity: medium
    issue: The phrase ‘తిరిగి వచ్చినప్పుడు, పద్దెనిమిది వేల మందిని హతమార్చి’ attaches the killing of the eighteen thousand to the return rather than to the prior striking of Aram.
    rationale: The Hebrew presents David’s return as being from the action of striking Aram, with ‘eighteen thousand’ specifying that military action. Reordering is needed to preserve this relationship.
  revised_text: ఉప్పు లోయలో అరామును[a] కొట్టి పద్దెనిమిది వేల మందిని హతమార్చి తిరిగి వచ్చిన తరువాత, దావీదు తనకు పేరు తెచ్చుకున్నాడు.
