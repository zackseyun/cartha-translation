source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֶת מוֹאָ֗ב וַֽ/יְמַדְּדֵ֤/ם בַּ/חֶ֨בֶל֙ הַשְׁכֵּ֣ב אוֹתָ֣/ם אַ֔רְצָ/ה וַ/יְמַדֵּ֤ד שְׁנֵֽי חֲבָלִים֙ לְ/הָמִ֔ית וּ/מְלֹ֥א הַ/חֶ֖בֶל לְ/הַחֲי֑וֹת וַ/תְּהִ֤י מוֹאָב֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נֹשְׂאֵ֥י מִנְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: te
  text: అతడు మోయాబును దెబ్బతీసి, మోయాబీయులను నేలపై పడుకోబెట్టి తాడుతో[a] కొలిచాడు. చంపడానికి రెండు తాడు పొడవులను, బ్రతకనివ్వడానికి తాడు పొడవంతా కొలిచాడు. ఆ విధంగా మోయాబీయులు దావీదుకు సేవకులై[b], కప్పం చెల్లించేవారయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొలత తాడుతో.”
    reason: lexical_alternative
  - marker: b
    text: 'మోయాబీయులను నేలపై పడుకోబెట్టి దావీదు కొలిచాడని హీబ్రూ చెబుతోంది: రెండు కొలిచిన భాగాలు “చంపడానికి,” తాడు నిండా ఒక పూర్తి భాగం “బ్రతకనివ్వడానికి” కేటాయించబడ్డాయి. అంటే కొందరు చంపబడి, మరికొందరు ప్రాణాలతో విడిచిపెట్టబడ్డారు.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: అతడు మోయాబును దెబ్బతీసి
  rationale: נכה అనే క్రియలోని ‘కొట్టు/దెబ్బతీయు’ భావాన్ని నిలుపుతూ, సందర్భంలోని సైనిక చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘పూర్తిగా నాశనం చేశాడు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: మోయాబీయులను ... తాడుతో కొలిచాడు
  rationale: מדד అంటే ‘కొలుచు’; חבל ఇక్కడ కొలిచే తాడు లేదా కొలత తాడు. ‘వారిని’ అనే ప్రత్యయానికి స్పష్టత కోసం ‘మోయాబీయులను’ అని చెప్పబడింది.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: మోయాబీయులను నేలపై పడుకోబెట్టి
  rationale: హీబ్రూ causative భావాన్ని, కొలత ఎలా జరిగిందో తెలిపే కఠినమైన దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: שְׁנֵי חֲבָלִים לְהָמִית
  choice: చంపడానికి రెండు తాడు కొలతలను
  rationale: రెండు కొలిచిన భాగాలు మరణానికి కేటాయించబడ్డాయని తెలుపుతుంది. ‘తాడు కొలతలు’ అనడం రెండు వేర్వేరు తాళ్లు తప్పనిసరిగా ఉన్నాయని సూచించకుండా కొలత భాగాల భావాన్ని ఇస్తుంది.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: బ్రతకనివ్వడానికి ఒక పూర్తి తాడు కొలతను
  rationale: מְלֹא הַחֶבֶל లోని పూర్తి కొలత భావాన్ని, חיה హిఫీల్‌లోని ‘ప్రాణాలతో ఉండనివ్వు’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: మోయాబీయులు దావీదుకు సేవకులై
  rationale: రాజకీయంగా లోబడిన ప్రజల భావాన్ని ‘సేవకులు’గా నేరుగా అందిస్తుంది; ఈ సందర్భంలో ‘బానిసలు’ అనడం అవసరానికి మించిన సామాజిక అర్థాన్ని మోపుతుంది.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: కప్పం చెల్లించేవారయ్యారు
  rationale: రాజకీయ సందర్భంలో מִנְחָה ఆరాధనా అర్పణ కాక, లోబడిన రాజ్యం చెల్లించే కప్పాన్ని సూచిస్తుంది.
theological_decisions:
- issue: మోయాబీయులను కొలిచి మరణం లేదా జీవితం కోసం కేటాయించిన చర్య స్వభావం
  choice: కొలిచే తాడు, నేలపై పడుకోబెట్టడం, రెండు భాగాలను చంపడం కోసం మరియు ఒక పూర్తి భాగాన్ని బ్రతకనివ్వడం కోసం కేటాయించడం అనే చిత్రణను నేరుగా నిలుపడం
  alternative: దీనిని సాధారణ లోబరచడం అనే రూపకంగా మార్చడం, లేదా ప్రధాన వాక్యంలోనే మూడింట రెండు వంతులు చంపబడ్డారని స్పష్టంగా చెప్పడం
  rationale: హీబ్రూ ఒక కఠినమైన, స్పష్టమైన ప్రక్రియను వర్ణిస్తుంది. నిష్పత్తి సూచితమైనప్పటికీ, మూలపాఠం దానిని భిన్నంగా గణాంక రూపంలో చెప్పదు; అందువల్ల అనిశ్చితిని తొలగించే వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. యుద్ధంలోని కఠినత్వాన్ని మృదువుచేయకుండా, హీబ్రూ వాక్యంలోని సంక్షిప్తత మరియు కొలత దృశ్యం నిలుపబడ్డాయి.
