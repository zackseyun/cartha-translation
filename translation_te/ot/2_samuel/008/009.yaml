  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֕ע תֹּ֖עִי מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔ד אֵ֖ת כָּל חֵ֥יל הֲדַדְעָֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: te
  text: దావీదు హదదెజెరు సైన్యమంతటినీ ఓడించాడని హమాతు రాజు తోఈ[a] విన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనికి సమాంతరమైన 1 దినవృత్తాంతాలు 18:9లో ఈ రాజు పేరు ‘తోవు’ అని ఉంది. ఇక్కడి హీబ్రూ పాఠంలో ‘తోఈ’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע అనే క్రియకు ‘విన్నాడు’ అనేది ప్రత్యక్ష అర్థం. తరువాతి వచనంతో వాక్య సంబంధాన్ని సహజంగా నిలుపుటకు తెలుగు ఉపవాక్య రూపమైన ‘విన్నప్పుడు’ వాడబడింది.
- source_word: תֹּעִי
  choice: తోఈ
  rationale: మసొరా పాఠంలోని వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం. 1 దినవృత్తాంతాలు 18:9లోని భిన్న రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֶלֶךְ חֲמָת
  choice: హమాతు రాజు
  rationale: హీబ్రూ నిర్మాణం తోఈ యొక్క పదవిని, రాజ్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన క్రమంలో అనువదించాం.
- source_word: כִּי
  choice: అని
  rationale: తోఈ విన్న సమాచార విషయాన్ని పరిచయం చేసే అవ్యయంగా כִּי ఇక్కడ పనిచేస్తుంది; కారణార్థకంగా కాక విషయార్థకంగా ‘అని’ సరిపోతుంది.
- source_word: הִכָּה
  choice: ఓడించాడని
  rationale: సైనిక సందర్భంలో נכה శత్రు బలగాన్ని దెబ్బతీసి జయించడాన్ని సూచిస్తుంది. ‘ఓడించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని సైనిక ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘హతమార్చాడు’ అయితే ప్రతి సైనికుడూ చంపబడ్డాడనే అధిక నిర్దిష్టతను కలిగించవచ్చు.
- source_word: אֵת כָּל חֵיל
  choice: సైన్యమంతటినీ
  rationale: חַיִל ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది. כָּל యొక్క సమగ్ర భావాన్ని ‘అంతటినీ’ నిలుపుతుంది.
- source_word: הֲדַדְעָזֶר
  choice: హదదెజెరు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు లిపిలో పఠనయోగ్యంగా ధ్వన్యనుకరించాం.
