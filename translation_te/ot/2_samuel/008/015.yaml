  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: te
  text: దావీదు ఇశ్రాయేలు అంతటినీ రాజుగా పరిపాలించాడు. దావీదు తన ప్రజలందరికీ న్యాయాన్నీ నీతినీ అమలు చేసేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך ఇక్కడ రాజ్యాభిషేకం పొందడాన్ని మాత్రమే కాక, రాజుగా పాలించడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘రాజుగా పరిపాలించాడు’ అని అనువదించాం.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: עַל రాజ్యపాలన విస్తరించిన పరిధిని, כָּל సంపూర్ణతను తెలియజేస్తాయి; ‘ఇశ్రాయేలంతటిమీద’ రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: జరిగిస్తూ ఉండేవాడు
  rationale: וַיְהִי + కృదంత నిర్మాణం కొనసాగుతూ లేదా ఆచారంగా జరిగే కార్యాన్ని సూచిస్తుంది. ‘ఉండేవాడు’ ఆ నిరంతర పరిపాలనా విధానాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: రాజపాలన సందర్భంలో ఈ పదం కేవలం తీర్పును కాక, న్యాయాన్ని అమలు చేయడాన్ని సూచిస్తుంది.
- source_word: וּצְדָקָה
  choice: నీతి
  rationale: צְדָקָה నైతిక సరిదనాన్ని, యథార్థమైన ప్రవర్తనను సూచిస్తుంది. ‘నీతి’ దానిని ‘న్యాయం’తో కలిపివేయకుండా ప్రత్యేక భావంగా నిలుపుతుంది.
- source_word: לְכָל עַמּוֹ
  choice: తన ప్రజలందరికీ
  rationale: לְ ఇక్కడ ప్రజల ప్రయోజనార్థం, వారి పట్ల నిర్వహించిన పాలనను సూచిస్తుంది; 3 పురుష ఏకవచన ప్రత్యయం ‘తన’ ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: రాజు ఆదర్శ పాలనను వర్ణించే מִשְׁפָּט וּצְדָקָה అనే జంట పదాల అనువాదం
  choice: న్యాయం, నీతి
  alternative: న్యాయం, సరైనది
  rationale: ఈ రెండు హీబ్రూ నామవాచకాలను వేర్వేరుగా ఉంచడం ద్వారా న్యాయపరమైన సముచితతతో పాటు నైతిక సరిదనం కూడా వ్యక్తమవుతుంది; రెండింటినీ ఒకే భావంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కొనసాగుతున్న/అలవాటైన కార్యభావాన్ని ‘జరిగిస్తూ ఉండేవాడు’ ద్వారా నిలుపుతూ, ‘న్యాయం, నీతి’ అనే సంప్రదాయమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన పదజంటను ఉపయోగించాం.
