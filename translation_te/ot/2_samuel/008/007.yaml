source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֗ד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ אֶ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: te
  text: దావీదు హదదెజెరు సేవకుల వద్ద ఉన్న బంగారు డాళ్లను తీసుకుని యెరూషలేముకు తీసుకొచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారంతో చేసిన డాళ్లు”; అక్షరార్థంగా, “బంగారం యొక్క డాళ్లు.” అల్పసంఖ్యాక అభిప్రాయం ప్రకారం హెబ్రీ పదానికి “బాణాల పొదులు” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: కథన సందర్భంలో לקח అనే క్రియకు సాధారణంగా ‘తీసుకొను’ అనే అర్థం సరిపోతుంది; సందర్భంలో యుద్ధంలో స్వాధీనం చేసుకున్న భావం ఉన్నప్పటికీ, మూలంలో లేని అధిక బలప్రయోగ భావాన్ని చేర్చదు.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: బంగారు డాళ్లను
  rationale: సైనిక దోపుడు సందర్భంలో שׁלטים అనేది రక్షణ ఆయుధాలైన డాళ్లను సూచించే సంప్రదాయ, సందర్భోచిత అర్థం. తెలుగు సహజత్వం కోసం ‘బంగారంతో చేసిన డాళ్లు’ అనే భావాన్ని ‘బంగారు డాళ్లు’గా ఇచ్చాం; ‘బాణాల పొదులు’ అనేది అల్పసంఖ్యాక నిఘంటు ప్రతిపాదన.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: దగ్గర ఉన్న
  rationale: ఈ హెబ్రీ నిర్మాణం స్వామ్యాన్ని లేదా ఆధీనంలో ఉండడాన్ని సూచిస్తుంది. ‘దగ్గర ఉన్న’ అనేది వస్తువులు సేవకుల వద్ద ఉన్నాయని సహజ తెలుగులో చెబుతూ, అవి వారి వ్యక్తిగత ఆస్తేనని అవసరానికి మించి ఖచ్చితపరచదు.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: హదదెజెరు సేవకుల
  rationale: עבדים అనే పదం సేవకులు, రాజోద్యోగులు లేదా దాసులు అనే విస్తృత అర్థాలను కలిగి ఉంటుంది. ఇక్కడ రాజుకు చెందిన పరివారం లేదా సేవకుల భావం సందర్భానికి సరిపోతుంది; ‘సేవకులు’ ఆ విస్తృతిని తగినంతగా నిలుపుతుంది.
- source_word: וַיְבִיאֵם
  choice: వాటిని ... తీసుకొచ్చాడు
  rationale: בוא హిఫీల్ రూపానికి ‘తీసుకురావడం’ సాధారణ అర్థం; సర్వనామ ప్రత్యయం డాళ్లను సూచిస్తున్నందున ‘వాటిని’ అని స్పష్టంగా ఇచ్చాం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
