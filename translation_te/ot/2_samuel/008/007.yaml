  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దగ్గర ఉన్న’ అనే రూపం స్వామ్యం/ఆధీనానికి సంబంధించిన హెబ్రీ భావాన్ని అతిగా నిర్ధారించకుండా నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
