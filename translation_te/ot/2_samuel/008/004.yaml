source:
  edition: WLC
  text: וַ/יִּלְכֹּ֨ד דָּוִ֜ד מִמֶּ֗/נּוּ אֶ֤לֶף וּ/שְׁבַע מֵאוֹת֙ פָּרָשִׁ֔ים וְ/עֶשְׂרִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וַ/יְעַקֵּ֤ר דָּוִד֙ אֶת כָּל הָ/רֶ֔כֶב וַ/יּוֹתֵ֥ר מִמֶּ֖/נּוּ מֵ֥אָה רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: te
  text: దావీదు అతని నుండి 1,700 మంది గుర్రపు సైనికులను, 20,000 మంది కాలినడక సైనికులను పట్టుకున్నాడు.[a] దావీదు రథదళంలోని గుర్రాలన్నిటి వెనుక కాళ్ల స్నాయువులను కోయించాడు,[b] అయితే 100 రథాలకు సరిపడా గుర్రాలను మిగిల్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో “1,700 మంది గుర్రపు సైనికులు” అని ఉంది. సమాంతర వాక్యమైన 1 దినవృత్తాంతాలు 18:4లో “7,000 మంది గుర్రపు సైనికులు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “రథదళమంతటినీ” అని ఉంది. వెనుక కాళ్ల స్నాయువులను కోయడం గుర్రాలకు చేసే చర్య కాబట్టి, అనువాదంలో “రథదళంలోని గుర్రాలు” అని స్పష్టం చేయబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అయితే వాటిలో నూరురథాలకు సరిపడిన వాటిని మిగిల్చాడు.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: పట్టుకున్నాడు
  rationale: యుద్ధ సందర్భంలో לכד అంటే పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం; సైనికులను బందీలుగా పట్టుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: అతని దగ్గర నుండి
  rationale: ఏకవచన ప్రత్యయం సందర్భంలో ఓడిపోయిన హదదెజెరును సూచిస్తుంది.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1,700 మంది గుర్రపు సైనికులు
  rationale: פָּרָשִׁים గుర్రాలపై పోరాడే సైనికులను సూచిస్తుంది; మసొరా పాఠంలోని సంఖ్యను యథాతథంగా ఉంచింది.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20,000 మంది కాల్బల సైనికులు
  rationale: గుర్రపు సైనికులకు భిన్నంగా కాలినడకన పోరాడే సైనిక దళాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: וַיְעַקֵּר
  choice: మోకాలి నరాలను కోయించాడు
  rationale: ఈ సందర్భంలో עקר గుర్రాలను యుద్ధానికి పనికిరాకుండా వాటి వెనుక కాలి నరాలను కోయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో అర్థమయ్యే వివరణాత్మక అనువాదం.
- source_word: אֶת כָּל הָרֶכֶב
  choice: రథదళంలోని గుర్రాలన్నిటిని
  rationale: רֶכֶב అక్షరార్థంగా రథం లేదా రథదళం అయినా, నరాలు కోయడం గుర్రాలకే వర్తిస్తుంది; అందువల్ల ఇక్కడ ఉద్దేశించిన సూచ్యార్థాన్ని స్పష్టం చేసింది.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: 100 రథాలకు సరిపడా గుర్రాలను మిగిల్చాడు
  rationale: יתר అంటే మిగిల్చడం; రథదళ సందర్భంలో 100 రథాలను నడపడానికి అవసరమైన గుర్రాలను ఉంచాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
