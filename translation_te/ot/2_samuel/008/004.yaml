  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. సైనిక పదజాలం సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా ఎంపిక చేయబడింది; హీబ్రూ పాఠంలోని సంఖ్యా భేదం పాదసూచికలో భద్రపరచబడింది.
