base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: te
  text: దమస్కుకు చెందిన అరామీయులు సోబా రాజైన హదదెజెరుకు[b] సహాయం చేయడానికి వచ్చారు. అప్పుడు దావీదు అరామీయులలో ఇరవై రెండు వేల మందిని హతమార్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘అరాము’ అనే పేరు ఇక్కడ దమస్కు కేంద్రంగా ఉన్న అరామీయుల రాజ్యాన్ని లేదా ప్రజలను సూచిస్తుంది; సంప్రదాయ అనువాదాల్లో దీనిని ‘సిరియా’ అని కూడా అనువదించారు.
    reason: lexical_alternative
  - marker: b
    text: ‘హదదెజెరు’ అనే పేరు కొన్ని వచనాల్లో, అనువాదాల్లో ‘హదరెజెరు’ అని కూడా కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  choice: వచ్చింది
  rationale: בוא అనే క్రియ యొక్క కథనరూపం; కర్తగా ఉన్న ‘దమస్కు అరాము’ను రాజ్యంగా భావిస్తూ సహజమైన గతకాల స్త్రీలింగ రూపం వాడబడింది.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: దమస్కు అరాము
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే పేరును రుద్దకుండా, దమస్కు కేంద్రంగా ఉన్న అరాము రాజ్యాన్ని మూలానికి దగ్గరగా సూచిస్తుంది.
- source_word: לַעְזֹר
  choice: సహాయం చేయడానికి
  rationale: עזר యొక్క సరళమైన అర్థమైన ‘సహాయం చేయు’ను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַהֲדַדְעֶזֶר
  choice: హదదెజెరు
  rationale: ఈ వచనంలోని హీబ్రూ రూపాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేసింది; ఇతర చోట్ల కనిపించే ప్రత్యామ్నాయ రూపం పాదటిప్పణిలో ఉంచబడింది.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజైన
  rationale: హదదెజెరును వివరిస్తున్న construct chainను తెలుగులో సహజమైన విశేషణ సంబంధంగా అందిస్తుంది.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: సైనిక సందర్భంలో נכה మరియు వెంట వచ్చే మనుషుల సంఖ్య మరణాన్ని సూచిస్తున్నందున ‘హతమార్చాడు’ స్పష్టమైన, సహజమైన ఎంపిక; కేవలం ‘ఓడించాడు’ అన్నదానికంటే మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: בַּאֲרָם
  choice: అరామువారిలో
  rationale: נכהతో కూడిన ב దెబ్బతిన్న వర్గాన్ని సూచిస్తుంది. లెక్కించబడిన వారు మనుషులు కాబట్టి తెలుగులో ‘అరామువారిలో’ సహజంగా ఉంటుంది; భూభాగంలో జరిగిన చర్యగా అనవసరంగా మార్చదు.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: ఇరవై రెండు వేల మందిని
  rationale: సంఖ్యను, అలాగే אִישׁ సూచించే మనుషులను నిలుపుతుంది; సందర్భం యోధులను సూచించినా మూలంలో లేని ‘సైనికులు’ అనే పదాన్ని చేర్చదు.
