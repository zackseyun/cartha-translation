translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘అరాము’ అనే చారిత్రక పేరును నిలిపి, రెండో ప్రయోగంలో ప్రజలను సూచించేందుకు ‘అరామువారు’ వాడబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
