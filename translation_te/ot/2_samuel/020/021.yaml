translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని “చేయి ఎత్తాడు” అనే రూపకం ప్రధాన పాఠ్యంలో నిలుపబడి, దాని తిరుగుబాటు భావం పాదటిప్పణిలో ఇవ్వబడింది. ఆంగ్ల సంప్రదింపుపాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి విషయాలకు సరిపోని చోట ఉన్నందున, తెలుగులో [a] భౌగోళిక పదబంధం వద్దను, [b] హీబ్రూ నానుడి వద్దను ఉంచి సరిచేయబడింది.
