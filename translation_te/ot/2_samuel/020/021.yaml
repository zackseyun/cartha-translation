  text: לֹא כֵ֣ן הַ/דָּבָ֗ר כִּ֡י אִישׁ֩ מֵ/הַ֨ר אֶפְרַ֜יִם שֶׁ֧בַע בֶּן בִּכְרִ֣י שְׁמ֗/וֹ נָשָׂ֤א יָד/וֹ֙ בַּ/מֶּ֣לֶךְ בְּ/דָוִ֔ד תְּנֽוּ אֹת֣/וֹ לְ/בַדּ֔/וֹ וְ/אֵלְכָ֖ה מֵ/עַ֣ל הָ/עִ֑יר וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל יוֹאָ֔ב הִנֵּ֥ה רֹאשׁ֛/וֹ מֻשְׁלָ֥ךְ אֵלֶ֖י/ךָ בְּעַ֥ד הַ/חוֹמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: te
  text: “విషయం అలా కాదు. ఎఫ్రాయిము కొండప్రాంతానికి[a] చెందిన బిక్రీ కుమారుడు షెబ అనే ఒక మనిషి రాజుకు, అంటే దావీదుకు, విరోధంగా చేయి ఎత్తాడు[b]. అతణ్ణి మాత్రమే అప్పగించండి; అప్పుడు నేను ఈ పట్టణం నుండి వెనుదిరుగుతాను.” అందుకు ఆ స్త్రీ యోవాబుతో, “ఇదిగో, అతని తలను గోడ మీదుగా నీ దగ్గరికి విసిరివేస్తారు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాయిము పర్వతప్రాంతానికి.” ఈ హీబ్రూ పదబంధం సంప్రదాయంగా “ఎఫ్రాయిము పర్వతం నుండి” అని కూడా అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: “చేయి ఎత్తాడు” అనేది హీబ్రూ మూలంలోని యథార్థ ప్రయోగం; భావార్థంగా, “రాజుకు, అంటే దావీదుకు, విరోధంగా తిరుగుబాటు చేశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: విషయం అలా కాదు
  rationale: ముందుగా వ్యక్తమైన భావనను తిరస్కరించే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతానికి చెందిన
  rationale: ఇది సాధారణంగా ఒకే పర్వతశిఖరాన్ని కాక ఎఫ్రాయిము కొండల ప్రాంతాన్ని సూచిస్తుంది.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: బిక్రీ కుమారుడు షెబ అనే
  rationale: పేరు తెలిపే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: נָשָׂא יָדוֹ
  choice: చేయి ఎత్తాడు
  rationale: తిరుగుబాటు లేదా శత్రుత్వపూర్వక ధిక్కారాన్ని సూచించే మూలభాషా రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: రాజుకు, అంటే దావీదుకు, విరోధంగా
  rationale: రెండుసార్లు వచ్చిన సంబంధసూచకాన్ని, దావీదు ఎవరో వివరిస్తున్న అనుబంధ నిర్మాణాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: అతణ్ణి మాత్రమే అప్పగించండి
  rationale: ఇతరులను కాక ఆ ఒక్క వ్యక్తినే అప్పగించాలనే డిమాండును సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: నేను ఈ పట్టణం నుండి వెనుదిరుగుతాను
  rationale: ముట్టడి సందర్భంలో పట్టణానికి వ్యతిరేకంగా ఉన్న సైన్యాన్ని వెనక్కి తీసుకుపోవడం అనే భావాన్ని, అనవసరంగా వివరాలు చేర్చకుండా తెలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాత వెంటనే జరగబోయే విషయాన్ని బలంగా ప్రకటించే హీబ్రూ సూచనపదానికి సహజమైన తెలుగు సమానం.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: అతని తలను గోడ మీదుగా నీ దగ్గరికి విసిరివేస్తారు
  rationale: హీబ్రూ కర్మణి భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేస్తూ, త్వరలో జరిగే చర్యను భవిష్యదర్థంలో అందిస్తుంది.
