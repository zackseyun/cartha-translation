  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: te
  text: అప్పుడు అమాసా యూదావారిని సమీకరించడానికి[a] వెళ్లాడు. అయితే అతను తనకు నిర్ణయించిన సమయంకంటే ఆలస్యమయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైనిక సమీకరణకు పిలవడానికి.’ హీబ్రూ క్రియ అత్యవసరంగా ఒకచోటికి పిలవడాన్ని సూచించగలదు; ఈ సందర్భంలో సైనిక సమీకరణ భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: הלך యొక్క సాధారణ కథన రూపానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: לְהַזְעִיק
  choice: సమీకరించడానికి
  rationale: ఈ హిఫిల్ రూపం ప్రజలను అత్యవసరంగా ఒకచోటికి పిలిపించడాన్ని సూచిస్తుంది; సందర్భంలో సైనిక సమీకరణ భావం ఉన్నా, ప్రధాన పాఠంలో దానిని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֶת יְהוּדָה
  choice: యూదావారిని
  rationale: ఇక్కడ ‘యూదా’ అనేది ఆ ప్రాంతం లేదా వ్యక్తి కాక, సమష్టిగా యూదా ప్రజలను సూచిస్తుంది; తెలుగులో ‘యూదావారిని’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וייחר
  choice: ఆలస్యం చేశాడు
  rationale: ఈ సందర్భంలో אחר నిర్ణీత సమయాన్ని మించి ఆలస్యమవడాన్ని సూచిస్తుంది.
- source_word: מִן הַמּוֹעֵד
  choice: నిర్ణయించిన సమయానికంటే
  rationale: מוֹעֵד స్థిరపరచిన లేదా నియమించిన సమయాన్ని సూచిస్తుంది; מן తో కలిసి ఆ సమయాన్ని మించిపోయిన భావం వస్తుంది.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: అతనికి నిర్ణయించిన
  rationale: יעד ఇక్కడ సమయాన్ని నిర్ణయించడాన్ని సూచిస్తుంది. కర్త మునుపటి వచనంలోని దావీదు అని సందర్భం తెలియజేస్తున్నా, హీబ్రూ వాక్యంలో పేరును పునరుక్తి చేయనందున తెలుగులోనూ చేర్చలేదు.
