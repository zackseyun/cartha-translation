revisions:
- from: అప్పుడు అమాసా యూదావారిని సమీకరించడానికి[a] వెళ్లాడు. అయితే అతనికి నిర్ణయించిన సమయానికంటే ఆలస్యం చేశాడు.
  to: అప్పుడు అమాసా యూదావారిని సమీకరించడానికి[a] వెళ్లాడు. అయితే అతను తనకు నిర్ణయించిన సమయంకంటే ఆలస్యమయ్యాడు.
  rationale: The revision replaces the non-idiomatic expression for delay with the standard Telugu construction “ఆలస్యమయ్యాడు.” “తనకు నిర్ణయించిన” conveys that the time was appointed for Amasa while leaving the appointing person unexpressed, corresponding to the Hebrew wording and its contextual reference.
