  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు పురుషులందరూ[a] దావీదును అనుసరించడం మాని, బిక్రీ కుమారుడైన షెబను అనుసరించడానికి వెళ్లిపోయారు[b]. యూదా పురుషులు మాత్రం యొర్దాను మొదలుకొని యెరూషలేము వరకు తమ రాజును గట్టిగా అంటిపెట్టుకొని ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలుకు చెందిన ప్రతి పురుషుడు.’ హీబ్రూలో ఇది సమూహాన్ని సూచించే పురుషవాచక ఏకవచన ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘దావీదును అనుసరించడం నుండి పైకి వెళ్లి, షెబ వెనుకకు [వెళ్లారు].’ పునరావృతమైన ‘వెనుక’ అనే ప్రయోగం దావీదును విడిచి షెబను అనుసరించడం ద్వారా విధేయత మారడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లడం’ అనే భావం ఉన్నా, ఇక్కడ కథన సందర్భంలో ఒక నాయకుణ్ణి విడిచి మరొక నాయకుణ్ణి అనుసరించి వెళ్లడాన్ని సూచిస్తుంది. తెలుగులో అసహజమైన ‘పైకి వెళ్లారు’ కంటే ‘వెళ్లారు’ సహజంగా ఉండి, కదలికను అతిగా వ్యాఖ్యానించదు.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలుకు చెందిన ప్రతి పురుషుడు’ అనే ఏకవచన సమూహ ప్రయోగం ఉంది. తెలుగులో సహజమైన బహువచన సమూహ రూపం వాడుతూ, మూలంలోని పురుషవాచక సూచనను నిలిపాం.
- source_word: מֵאַחֲרֵי דָוִד
  choice: దావీదును వెంబడించడం మాని
  rationale: מֵאַחֲרֵי అనేది దావీదు వెనుక నడవడం లేదా అతణ్ణి అనుసరించడం నుంచి తొలగిపోవడాన్ని సూచిస్తుంది. ‘వెంబడించడం మాని’ అనే రూపం విధేయత మార్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబను వెంబడిస్తూ
  rationale: పునరావృతమైన אַחֲרֵי, దావీదు నుంచి షెబ వైపు అనుసరణ లేదా విధేయత మారినట్లు చూపుతుంది. ‘వెంబడిస్తూ’ మూలంలోని అనుసరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאִישׁ יְהוּדָה
  choice: యూదా పురుషులు మాత్రం
  rationale: ఏకవచన రూపం సమూహార్థకంగా ఉంది. ముందటి ఇశ్రాయేలు పురుషుల చర్యకు వ్యతిరేకమైన భేదాన్ని ‘మాత్రం’ సహజంగా వెల్లడిస్తుంది.
- source_word: דָּבְקוּ
  choice: అంటిపెట్టుకొని ఉన్నారు
  rationale: דבק అంటే గట్టిగా అతుక్కోవడం లేదా పట్టుకొని ఉండడం; ఇక్కడ రాజుపట్ల స్థిరమైన విధేయతను రూపకాలంకారంగా సూచిస్తుంది. ‘అంటిపెట్టుకొని ఉన్నారు’ ఆ concrete metaphorను నిలుపుతుంది.
- source_word: בְמַלְכָּם
  choice: తమ రాజును
  rationale: דבקతో వచ్చిన ב సంబంధాన్ని తెలుగులో ‘రాజును అంటిపెట్టుకొని’ అని సహజంగా వ్యక్తం చేయవచ్చు. బహువచన ప్రత్యయం యూదా పురుషుల రాజైన దావీదును సూచిస్తుంది.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלָם
  choice: యొర్దాను మొదలుకొని యెరూషలేము వరకు
  rationale: ఈ పదబంధం యొర్దాను నుంచి యెరూషలేము దాకా ఉన్న ప్రయాణ లేదా భౌగోళిక వ్యాప్తిని తెలుపుతుంది. ‘మొదలుకొని ... వరకు’ మూలంలోని מן ... ועד నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
