  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘వెంబడించడం’ మరియు ‘అంటిపెట్టుకొని ఉండడం’ ద్వారా మూలంలోని అనుసరణ, గట్టి అనుబంధం అనే రూపకాలను సాధ్యమైనంతవరకు నిలిపాం.
