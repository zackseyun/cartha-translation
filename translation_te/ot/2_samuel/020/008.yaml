  text: הֵ֗ם עִם הָ/אֶ֤בֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בְּ/גִבְע֔וֹן וַ/עֲמָשָׂ֖א בָּ֣א לִ/פְנֵי/הֶ֑ם וְ/יוֹאָ֞ב חָג֣וּר מִדּ֣/וֹ לְבֻשׁ֗/וּ ו/על/ו חֲג֥וֹר חֶ֨רֶב֙ מְצֻמֶּ֤דֶת עַל מָתְנָי/ו֙ בְּ/תַעְרָ֔/הּ וְ/ה֥וּא יָצָ֖א וַ/תִּפֹּֽל־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: te
  text: వారు గిబ్యోనులో ఉన్న పెద్ద బండ దగ్గర ఉన్నప్పుడు, అమాశా వారి ఎదుటికి వచ్చాడు.[a] యోవాబు తన యుద్ధవస్త్రం ధరించి ఉన్నాడు; దానిపై ఒక నడుముదట్టి ఉంది, దానికి తన నడుము వద్ద ఒరలో ఉన్న కత్తి బిగించబడి ఉంది.[b] అతడు బయటికి వెళ్తుండగా, అది పడిపోయింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారి ఎదుటికి వచ్చాడు.’ దీనికి ‘వారిని కలవడానికి వచ్చాడు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యుద్ధవస్త్రం’ అనే పదాన్ని ‘అతడు ధరించిన వస్త్రం’ లేదా ‘అతని ప్రత్యేక వస్త్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘అది’ బహుశా కత్తినే సూచిస్తుంది; హీబ్రూలో ‘పడిపోయింది’ అనే క్రియ స్త్రీలింగంలో ఉంది. ‘బయటికి వెళ్తుండగా’కు ‘ముందుకు కదులుతుండగా’ అనే అర్థం కూడా సాధ్యమే.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה אֲשֶׁר בְּגִבְעוֹן
  choice: వారు గిబ్యోనులో ఉన్న పెద్ద బండ దగ్గర ఉన్నప్పుడు
  rationale: స్థలాన్ని సూచించే עִם ను సహజమైన ఆధునిక తెలుగులో ‘దగ్గర’గా అనువదించాం; సంబంధవాక్యం ఆ బండ ఉన్న స్థలాన్ని గుర్తిస్తుంది.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: అమాశా వారి ముందుకు వచ్చాడు
  rationale: לִפְנֵי యొక్క ‘ముందు/ఎదుట’ అనే మూలభావాన్ని నిలిపి, అతడు వారిని కలవడానికి వచ్చాడనే భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించలేదు.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: యోవాబు తన యుద్ధవస్త్రం ధరించి ఉన్నాడు
  rationale: מַד ప్రత్యేకమైన, ఈ సందర్భంలో సైనిక సంబంధమైన దుస్తును సూచించగలదు. కత్తి, దట్టి ఉన్న యుద్ధసందర్భంలో ‘యుద్ధవస్త్రం’ సహజమైనప్పటికీ, విస్తృతమైన ‘వస్త్రం’ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְעָלָיו חֲגוֹר
  choice: దానిపై ... దట్టి కట్టుకొని ఉన్నాడు
  rationale: వస్త్రంపై ఆయుధాన్ని మోయడానికి కట్టుకున్న నడుముదట్టిని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: ఒరలో ఉన్న కత్తిని నడుముకు బిగించిన
  rationale: מְצֻמֶּדֶת యొక్క బిగించి/జతచేసి ఉంచిన భావం, מָתְנַיִם యొక్క నడుము భావం, תַּעַר యొక్క ఒర భావం నిలిచేలా పదబంధాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
- source_word: וְהוּא יָצָא
  choice: అతడు ముందుకు వెళ్తుండగా
  rationale: יָצָא యొక్క కదలికను సందర్భానుగుణంగా ‘ముందుకు వెళ్తుండగా’ అని ఇచ్చాం; ‘బయటికి వెళ్తుండగా’ కూడా సాధ్యమే.
- source_word: וַתִּפֹּל
  choice: అది పడిపోయింది
  rationale: స్త్రీలింగ క్రియకు సమీప పూర్వపదమైన חֶרֶב (‘కత్తి’) అత్యంత సహజ కర్త. అయినా మూలంలోని సర్వనామాత్మక అస్పష్టతను ప్రధాన పాఠ్యంలో ‘అది’తో నిలిపి, పాదసూచికలో సంభావ్య సూచ్యాన్ని వివరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని పాటించాం. ‘దట్టి’, ‘ఒర’ వంటి సాధారణంగా అర్థమయ్యే ఆయుధ-వస్త్ర పదాలను వాడాం. మూలంలోని ‘వారి ముందు’ మరియు చివరి ‘అది’ అనే అస్పష్టతలను తొలగించకుండా పాదసూచికలతో వివరించాం.
