base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: te
  text: యోవాబు మనుషులు, కెరేతీయులు[a], పెలేతీయులు, పరాక్రమశాలులందరూ అతని వెనుక బయలుదేరారు. బిక్రీ కుమారుడైన షెబను తరుమడానికి వారు యెరూషలేము నుండి బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయ అనువాదాల్లో ఈ పేరును “కెరెతీయులు” అని లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: అతని వెనుక బయలుదేరారు
  rationale: హీబ్రూ ‘బయలుదేరు + వెనుక’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, ‘అతడు’ ఎవరో సందర్భమే నిర్ణయించేలా అస్పష్టతను కాపాడుతుంది.
- source_word: אַנְשֵׁי יוֹאָב
  choice: యోవాబు మనుషులు
  rationale: యోవాబుకు చెందిన లేదా అతని ఆధీనంలో ఉన్న మనుషులు అనే సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַכְּרֵתִי
  choice: కెరేతీయులు
  rationale: దావీదు రాజసైన్యానికి సంబంధించిన వర్గనామాన్ని ఊహాత్మకంగా అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: הַפְּלֵתִי
  choice: పెలేతీయులు
  rationale: కెరేతీయులతో జతగా కనిపించే వర్గనామం కావడంతో లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: כָל הַגִּבֹּרִים
  choice: పరాక్రమశాలులందరూ
  rationale: సైనిక బలం, శౌర్యం గల మనుషులు అనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִירוּשָׁלִַם
  choice: యెరూషలేము నుండి
  rationale: బయలుదేరిన స్థలాన్ని సూచించే హీబ్రూ ఉపసర్గను నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: తరుమడానికి
  rationale: వెంబడించడం లేదా పట్టుకోవాలనే ఉద్దేశంతో అనుసరించడం అనే క్రియాభావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని స్పష్టమైన తెలుగు రూపంలో నిలుపుతుంది.
