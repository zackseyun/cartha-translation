  text: וַ/תָּבוֹא֩ הָ/אִשָּׁ֨ה אֶל כָּל הָ/עָ֜ם בְּ/חָכְמָתָ֗/הּ וַֽ/יִּכְרְת֞וּ אֶת רֹ֨אשׁ שֶׁ֤בַע בֶּן בִּכְרִי֙ וַ/יַּשְׁלִ֣כוּ אֶל יוֹאָ֔ב וַ/יִּתְקַע֙ בַּ/שּׁוֹפָ֔ר וַ/יָּפֻ֥צוּ מֵֽ/עַל הָ/עִ֖יר אִ֣ישׁ לְ/אֹהָלָ֑י/ו וְ/יוֹאָ֛ב שָׁ֥ב יְרוּשָׁלִַ֖ם אֶל הַ/מֶּֽלֶךְ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: te
  text: ఆ స్త్రీ తన జ్ఞానంతో ప్రజలందరి దగ్గరికి వెళ్లింది. వారు బిక్రీ కుమారుడైన షెబ తలను నరికి యోవాబు దగ్గరికి విసిరేశారు. అప్పుడు యోవాబు బూర ఊదాడు. దాంతో వారు పట్టణం వద్ద నుంచి చెదరిపోయి, ఎవరి గుడారానికి వారు వెళ్లిపోయారు[a]. యోవాబు యెరూషలేముకు రాజు దగ్గరికి తిరిగి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఎవరి గుడారానికి వారు’ అనే మాట, ప్రతి ఒక్కరూ తమ తమ చోటికి వెళ్లిపోయారని తెలిపే స్థిర నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: వెళ్లింది
  rationale: בוא సందర్భానుసారంగా ‘రావడం’ లేదా ‘వెళ్లడం’ అని అర్థమవుతుంది; బాహ్య కథకుని దృష్టిలో ఆమె ప్రజల దగ్గరికి కదలడాన్ని ‘వెళ్లింది’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּחָכְמָתָהּ
  choice: తన జ్ఞానంతో
  rationale: בְּ ఉపసర్గంలోని సాధనార్థాన్ని, అలాగే ఆమె జ్ఞానానికి కథనం ఇచ్చే ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: אֶל כָּל הָעָם
  choice: ప్రజలందరి దగ్గరికి
  rationale: עָם అనే విస్తృత పదాన్ని సందర్భాన్ని మించి ‘సైనికులు’ లేదా ‘పట్టణవాసులు’గా పరిమితం చేయకుండా అనువదిస్తుంది.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: తలను నరికి
  rationale: ‘తలను నరికివేయడం’ అనే చర్యను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: యోవాబు దగ్గరికి విసిరేశారు
  rationale: אֶל లోని దిశాభావాన్ని నిలుపుతూ, చర్య తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: యోవాబు బూర ఊదాడు
  rationale: ఏకవచన కర్త సందర్భానుసారంగా యోవాబు; שׁוֹפָרను సాధారణ పాఠకుడికి అర్థమయ్యే ‘బూర’గా ఇచ్చింది.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: వారు పట్టణం మీద నుంచి చెదరిపోయి
  rationale: వారు పట్టణాన్ని ముట్టడించిన స్థానం నుంచి వెనుదిరిగారని సూచించే מֵעַל భావాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ఎవరి గుడారానికి వారు వెళ్లిపోయారు
  rationale: హీబ్రూ పంపిణీ నిర్మాణాన్ని సహజమైన తెలుగు నుడికారంలో అందిస్తూ, ‘తమ తమ చోట్లకు వెళ్లడం’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు చిన్న వాక్యాలుగా ఇచ్చి పఠనసౌలభ్యాన్ని పెంచాం; అయితే సంఘటనల క్రమం, కర్తలు, మరియు ముట్టడి స్థలం నుంచి చెదరిపోవడం అనే భావం నిలుపబడ్డాయి.
