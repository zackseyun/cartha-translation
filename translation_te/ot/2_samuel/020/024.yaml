  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: te
  text: అదోరాము నిర్బంధ శ్రమను[a] పర్యవేక్షించేవాడు; అహీలూదు కుమారుడైన యెహోషాపాతు నమోదుల అధికారి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెట్టి చాకిరీని”; హీబ్రూ పదం సాధారణ పన్నును కాకుండా, రాజ్యం విధించే తప్పనిసరి శ్రమసేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: అదోరాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַל
  choice: అధికారి
  rationale: ఈ పరిపాలనా సందర్భంలో పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; హీబ్రూ నామవాచక వాక్యంలో అంతర్లీనంగా ఉన్న క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּס
  choice: నిర్బంధ శ్రమ
  rationale: రాజ్య పరిపాలనా సందర్భంలో ఇది సాధారణ ధనపు పన్నును కాకుండా, ప్రభుత్వం విధించే తప్పనిసరి శ్రమసేవను సూచిస్తుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן אֲחִילוּד
  choice: అహీలూదు కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: הַמַּזְכִּיר
  choice: రాజ్య దస్తావేజుల అధికారి
  rationale: రాజసభలో నమోదులు, అధికారిక జ్ఞాపికలు నిర్వహించే పదవిని సూచించేలా అనువదించాం; కేవలం చరిత్రకారుడు లేదా సాధారణ కార్యదర్శి అనే అపార్థాన్ని నివారిస్తుంది.
