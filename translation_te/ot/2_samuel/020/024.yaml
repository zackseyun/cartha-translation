  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన రాజ్యాధికారుల జాబితా శైలిని నిలిపాం. పదవులను సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన పరిపాలనా పదజాలంతో అందించాం.
