  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרַ֣ב אֵלֶ֔י/הָ וַ/תֹּ֧אמֶר הָ/אִשָּׁ֛ה הַ/אַתָּ֥ה יוֹאָ֖ב וַ/יֹּ֣אמֶר אָ֑נִי וַ/תֹּ֣אמֶר ל֗/וֹ שְׁמַע֙ דִּבְרֵ֣י אֲמָתֶ֔/ךָ וַ/יֹּ֖אמֶר שֹׁמֵ֥עַ אָנֹֽכִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: te
  text: అతడు ఆమె దగ్గరికి వచ్చాడు. ఆ స్త్రీ, “మీరు యోవాబేనా?” అని అడిగింది. అతడు, “నేనే” అన్నాడు. అప్పుడు ఆమె అతనితో, “మీ దాసి[a] మాటలు వినండి” అంది. అతడు, “వింటున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సేవకురాలి.” హీబ్రూ పదం ఒక స్త్రీ తనను తాను వినయంతో సేవకురాలిగా పేర్కొనడానికి ఉపయోగించిన రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: అతడు ఆమె దగ్గరికి వచ్చాడు
  rationale: קרב అనే క్రియ భౌతికంగా సమీపించడాన్ని సూచిస్తుంది; אֵלֶיהָ దిశను, అంటే ఆమెవైపు రావడాన్ని తెలియజేస్తుంది. ఈ తెలుగు ప్రయోగం సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో אִשָּׁה భార్యను ప్రత్యేకంగా సూచించదు; మాట్లాడుతున్న వయోజన స్త్రీని సూచిస్తుంది.
- source_word: הַאַתָּה יוֹאָב
  choice: నువ్వేనా యోవాబు?
  rationale: ప్రశ్నార్థక రూపంతో కూడిన స్వతంత్ర సర్వనామం వ్యక్తి గుర్తింపును అడుగుతుంది. ‘నువ్వేనా’ మూలంలోని సర్వనామ ప్రాధాన్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָנִי
  choice: నేనే
  rationale: ఒంటరిగా ఉన్న సర్వనామం సంక్షిప్త స్వీయ గుర్తింపుగా పనిచేస్తుంది. ‘నేనే’ ప్రశ్నలోని గుర్తింపు భావానికి సహజమైన సమాధానం.
- source_word: שְׁמַע
  choice: విను
  rationale: שמע ఆజ్ఞారూపం ఇక్కడ శ్రద్ధగా వినమనే అభ్యర్థనను సూచిస్తుంది; ‘విను’ సరళమైన, నేరమైన తెలుగు రూపం.
- source_word: דִּבְרֵי אֲמָתֶךָ
  choice: నీ దాసి మాటలు
  rationale: דִּבְרֵי అనేది ‘మాటలు’ అనే బహువచన నిర్మాణరూపం. אָמָה స్త్రీ సేవకురాలిని సూచిస్తూ ఇక్కడ వినయపూర్వక స్వీయ సంబోధనగా ఉంది; ‘దాసి’ లింగాన్ని, వినయభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: వింటున్నాను
  rationale: కృదంతంతో కూడిన సర్వనామ నిర్మాణం కొనసాగుతున్న శ్రద్ధను వ్యక్తం చేస్తుంది. ‘వింటున్నాను’ సమకాలీన తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. సంభాషణ సంక్షిప్తతను నిలిపి, స్త్రీ ఉపయోగించిన వినయపూర్వక స్వీయ సంబోధనను ‘దాసి’గా అనువదించి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
