base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: te
  text: యోవాబు అమాసాతో, “నా సహోదరా, నీవు క్షేమంగా ఉన్నావా?” అన్నాడు. ఆపై అతన్ని ముద్దుపెట్టుకోవడానికి యోవాబు తన కుడిచేతితో అమాసా గడ్డాన్ని పట్టుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గడ్డం పట్టుకోవడం, ముద్దుపెట్టుకోవడం సన్నిహితంగా పలకరించే పద్ధతులతో ముడిపడిన చర్యలు; అయితే ఇక్కడ, సందర్భాన్ని బట్టి చూస్తే, యోవాబు మోసపూరితంగా ఇలా చేశాడు.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: నీవు క్షేమంగా ఉన్నావా?
  rationale: ఈ హీబ్రూ ప్రయోగం ఎదుటివారి క్షేమాన్ని, శాంతిని విచారిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, మూలంలోని భావాన్ని నిలుపుతూ ఇలా అనువదించాం.
- source_word: אָחִי
  choice: నా సహోదరా
  rationale: మూలంలో ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయం స్పష్టంగా ఉంది. ఈ సంబోధనలోని సన్నిహితత్వాన్ని, యోవాబు నటించిన ఆప్యాయతను రెండింటినీ ఇది నిలుపుతుంది.
- source_word: וַתֹּחֶז
  choice: పట్టుకున్నాడు
  rationale: ఈ క్రియ పట్టుకోవడం లేదా గట్టిగా అందుకోవడం అనే అర్థాన్ని ఇస్తుంది. తరువాతి వచనంలోని దాడిని ముందుగానే ఈ వచనంలో అతిగా సూచించకుండా, ఇక్కడి చర్యను సహజంగా తెలియజేయడానికి ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: יַד יְמִין יוֹאָב
  choice: యోవాబు తన కుడిచేతితో
  rationale: చర్యను చేసింది యోవాబు కుడిచేయేనన్న మూలపాఠంలోని ప్రత్యేక వివరాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: అమాసా గడ్డాన్ని
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, అభివాద చర్యలో ప్రాముఖ్యమైన గడ్డం పట్టుకోవడం అనే వివరాన్ని యథాతథంగా ఉంచాం.
- source_word: לִנְשָׁק לוֹ
  choice: అతన్ని ముద్దుపెట్టుకోవడానికి
  rationale: ל తో కూడిన క్రియారూపం ఉద్దేశాన్ని సూచిస్తుంది; గడ్డం పట్టుకున్న ఉద్దేశం అమాసాను ముద్దుపెట్టుకోవడమేనని ఈ అనువాదం స్పష్టంగా తెలియజేస్తుంది.
