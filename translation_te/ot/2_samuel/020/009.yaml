translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడాం. ‘నా సహోదరా’ అనే సంబోధన మూలంలోని బంధుత్వ పదాన్నీ నటించిన సన్నిహితత్వాన్నీ నిలుపుతుంది; గడ్డం పట్టుకోవడం మరియు కుడిచేయి అనే సాంస్కృతికంగా, కథనపరంగా ముఖ్యమైన వివరాలు తొలగించలేదు.
