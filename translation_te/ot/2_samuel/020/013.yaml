  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר הֹגָ֖ה מִן הַֽ/מְסִלָּ֑ה עָבַ֤ר כָּל אִישׁ֙ אַחֲרֵ֣י יוֹאָ֔ב לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: te
  text: అతడు రాజమార్గం నుండి[a] తొలగించబడగానే, బిక్రీ కుమారుడైన షెబాను తరుమడానికి మనుషులందరూ యోవాబు వెనుక ముందుకు సాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దారి నుండి’ / ‘రోడ్డు నుండి.’ ఇక్కడి హీబ్రూ పదం מְסִלָּה ప్రధాన దారిని లేదా రాజమార్గాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: తొలగించగానే
  rationale: ఈ కాలసూచక ప్రయోగం వెంటనే జరిగిన తదుపరి చర్యను తెలియజేస్తుంది. తెలుగులో ‘-గానే’ ఆ తక్షణ క్రమాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הֹגָה
  choice: అతణ్ణి ... తొలగించగానే
  rationale: హోఫల్ రూపం వేరొకరు అతణ్ణి పక్కకు తొలగించారని సూచిస్తుంది. ముందు వచనంలోని అమాశా శవమే ఉద్దేశమని సందర్భం తెలుపుతుంది; అయితే మూలంలోని పురుష సర్వనామ రూపాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: מִן הַמְסִלָּה
  choice: రాజమార్గం మీదనుంచి
  rationale: מְסִלָּה సాధారణ దారి కంటే ప్రధానమైన లేదా ఎత్తుగా వేసిన మార్గాన్ని సూచించగలదు. ‘రాజమార్గం’ ఆ ప్రత్యేక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עָבַר
  choice: ముందుకు సాగారు
  rationale: అడ్డంకి తొలగిన తర్వాత సైనికులు తమ ప్రయాణాన్ని తిరిగి కొనసాగించారనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כָּל אִישׁ
  choice: మనుషులందరూ
  rationale: హీబ్రూ ఏకవచన సమష్టి ప్రయోగం యోవాబును అనుసరిస్తున్న సైనికులందరినీ సూచిస్తుంది. ‘మనుషులందరూ’ లింగసూచనను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: אַחֲרֵי יוֹאָב
  choice: యోవాబు వెనుక
  rationale: ఈ సందర్భంలో యోవాబును అనుసరిస్తూ వెళ్లడాన్ని సూచించే ప్రత్యక్షమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: తరుమడానికి
  rationale: లక్ష్యాన్ని సూచించే క్రియారూపాన్ని, సైనిక వెంబడింపును ‘తరుమడానికి’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పేరుపద్ధతిలో నిలుపుతుంది.
