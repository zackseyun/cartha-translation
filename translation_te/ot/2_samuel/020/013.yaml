revisions:
- from: అతణ్ణి రాజమార్గం మీదనుంచి[a] తొలగించగానే, బిక్రీ కుమారుడైన షెబను తరుమడానికి మనుషులందరూ యోవాబు వెనుక ముందుకు సాగారు.
  to: అతడు రాజమార్గం నుండి[a] తొలగించబడగానే, బిక్రీ కుమారుడైన షెబాను తరుమడానికి మనుషులందరూ యోవాబు వెనుక ముందుకు సాగారు.
  rationale: The revision preserves the Hebrew passive verb, uses a direct Telugu expression for removal from the road, and standardizes Sheba’s name as «షెబా». It otherwise retains the draft’s faithful temporal sequence, collective reference to the men, and purpose clause.
  reviewer_model: gpt-5.6-terra
