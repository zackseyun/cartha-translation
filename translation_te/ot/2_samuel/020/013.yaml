translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. తక్షణ సంఘటనల క్రమాన్ని ‘-గానే’తో స్పష్టంగా తెలిపి, మూలంలోని మార్గపదానికి ఉన్న భావవిస్తృతిని పాదసూచికలో నిలిపాం.
