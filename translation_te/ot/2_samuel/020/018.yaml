translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రాచీన సామెత స్వరాన్ని నిలిపేందుకు అంతర్గత ప్రత్యక్ష వాక్యాన్ని ఉంచాం. హీబ్రూ వాక్య నిర్మాణంలోని అనిశ్చితిని పాదటిప్పణిలో పరిరక్షించాం.
