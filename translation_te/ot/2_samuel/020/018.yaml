source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר לֵ/אמֹ֑ר דַּבֵּ֨ר יְדַבְּר֤וּ בָ/רִֽאשֹׁנָה֙ לֵ/אמֹ֔ר שָׁאֹ֧ל יְשָׁאֲל֛וּ בְּ/אָבֵ֖ל וְ/כֵ֥ן הֵתַֽמּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: te
  text: 'అప్పుడు ఆమె ఇలా అంది[a]: “పూర్వకాలంలో ప్రజలు, ‘ఆబేలులో[b] తప్పక అడగాలి’ అని చెప్పేవారు; ఆ విధంగా వారు విషయాన్ని ముగించేవారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్య నిర్మాణాన్ని మరో విధంగా ఇలా అనువదించవచ్చు: “పూర్వకాలంలో వారు, ‘ఆబేలులో తప్పక అడగాలి’ అని నిశ్చయంగా చెప్పేవారు; అలా వారు దానిని ముగించేవారు.” రెండు క్రియాపదబంధాల్లోనూ బలాన్ని సూచించే infinitive absolute నిర్మాణం ఉంది; చివరి క్రియకు “ముగింపుకు తెచ్చేవారు” లేదా సందర్భానుసారంగా “పరిష్కరించేవారు” అనే అర్థాలు సాధ్యమైనవి.'
    reason: lexical_alternative
  - marker: b
    text: “ఆబేలు” అనేది ఈ సందర్భంలో ముట్టడిలో ఉన్న ఆబేలు-బేత్-మయకా పట్టణానికి సంక్షిప్త నామం.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: అప్పుడు ఆమె ఇలా అంది
  rationale: కథన క్రమాన్ని సూచించే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తం చేసి, לֵאמֹר ను ప్రత్యక్ష వాక్య పరిచయంగా ‘ఇలా’తో తెలిపాం.
- source_word: דַּבֵּר יְדַבְּרוּ
  choice: ప్రజలు ... చెప్పేవారు
  rationale: infinitive absolute + imperfect నిర్మాణం గతకాలపు స్థిరమైన వాడుక లేదా సామెతను సూచిస్తున్నందున ‘చెప్పేవారు’ అని అనువదించాం; కర్త హీబ్రూలో స్పష్టంగా లేకపోవడంతో సాధారణ అర్థంలో ‘ప్రజలు’ అని ఇచ్చాం.
- source_word: בָרִאשֹׁנָה
  choice: పూర్వకాలంలో
  rationale: ఇది క్రమంలోని మొదటి దశకన్నా పూర్వపు ఆచారం లేదా సంప్రదాయాన్ని సూచిస్తుంది.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: తప్పక విచారణ చేయాలి
  rationale: infinitive absolute + imperfect లోని బలాన్ని ‘తప్పక’తో నిలిపి, שאל కు ఈ సందర్భంలో సలహా లేదా నిర్ణయం కోసం అడగడం అనే భావాన్ని ‘విచారణ చేయాలి’గా ఇచ్చాం.
- source_word: בְּאָבֵל
  choice: ఆబేలులో
  rationale: בְ ఉపసర్గకు సహజమైన స్థానార్థాన్ని నిలిపాం; ఇక్కడ ఆబేలు అనేది ఆబేలు-బేత్-మయకా పట్టణానికి సంక్షిప్త నామం.
- source_word: וְכֵן הֵתַמּוּ
  choice: ఆ విధంగా వారు విషయాన్ని ముగించేవారు
  rationale: וְכֵן లోని విధాన/ఫలిత సంబంధాన్ని ‘ఆ విధంగా’తో చూపించి, תמם హిఫీల్ రూపంలోని ‘ముగింపుకు తేవడం’ భావాన్ని నిలిపాం. సందర్భానుసారంగా ‘విషయాన్ని పరిష్కరించేవారు’ అనే అర్థమూ సాధ్యమే.
