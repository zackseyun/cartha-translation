  text: וְ/אִישׁ֙ עָמַ֣ד עָלָ֔י/ו מִֽ/נַּעֲרֵ֖י יוֹאָ֑ב וַ/יֹּ֗אמֶר מִי֩ אֲשֶׁ֨ר חָפֵ֧ץ בְּ/יוֹאָ֛ב וּ/מִ֥י אֲשֶׁר לְ/דָוִ֖ד אַחֲרֵ֥י יוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/011.yaml
  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: te
  text: యోవాబు యువకుల్లో[b] ఒకడు అమాశా దగ్గర నిలబడి, “యోవాబును సమర్థించే వారెవరైనా, దావీదు పక్షాన ఉన్న వారెవరైనా, యోవాబు వెంట వెళ్లండి![a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యోవాబు వెనుక.” సందర్భంలో ఇది అతని వెంట వెళ్లి అతనితో చేరమనే పిలుపు.
    reason: lexical_alternative
  - marker: b
    text: “యువకులు” అనే పదాన్ని “సేవకులు” లేదా “పరిచారకులు” అని కూడా అనువదించవచ్చు; ఇక్కడ అది యోవాబు ఆధీనంలోని అనుచరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ఒకడు
  rationale: ఇక్కడ אִישׁ యోవాబు మనుషుల్లో నిర్దిష్టంగా పేరు చెప్పని ఒక వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘ఒకడు’ సహజంగా ఆ అనిర్దిష్ట భావాన్ని ఇస్తుంది.
- source_word: עָמַד עָלָיו
  choice: అమాశా దగ్గర నిలబడి
  rationale: עמד על ఒకరి మీదుగా లేదా దగ్గర నిలబడడాన్ని సూచించగలదు. సందర్భంలో అమాశా నేలపై పడి ఉన్నందున ‘దగ్గర నిలబడి’ దృశ్యాన్ని సహజంగా తెలుపుతుంది; ‘మీద నిలబడి’ అని చెప్పడం అతని శరీరంపై కాలు పెట్టినట్టు అపార్థం కలిగించవచ్చు.
- source_word: מִנַּעֲרֵי יוֹאָב
  choice: యోవాబు యువకుల్లో
  rationale: נַעַר కు యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఉన్నాయి. మూలంలోని రూపాన్ని పారదర్శకంగా ఉంచుతూ సైనిక అనుచరుల సందర్భానికి ‘యువకులు’ సరిపోతుంది.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: యోవాబును సమర్థించేవాడూ
  rationale: חפץ ב ఇష్టపడడం, అనుకూలంగా ఉండడం, మద్దతు ఇవ్వడం అనే పరిధి కలిగి ఉంది. ఈ సమీకరణ పిలుపులో ‘సమర్థించేవాడు’ నిబద్ధత భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: దావీదు పక్షాన ఉన్నవాడూ
  rationale: దావీదుతో వచ్చిన לְ రాజకీయ లేదా సైనిక విధేయతను సూచిస్తుంది; ‘పక్షాన ఉన్నవాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אַחֲרֵי יוֹאָב
  choice: యోవాబు వెంట రండి
  rationale: అక్షరార్థంగా ‘యోవాబు వెనుక’ అయినప్పటికీ, ఈ సందర్భంలో అది అతని వెంబడి వెళ్లి అతనితో చేరమనే సమీకరణ పిలుపు. ప్రత్యక్ష ప్రసంగంలో ‘వెంట రండి’ సహజమైన ఆజ్ఞారూపం.
