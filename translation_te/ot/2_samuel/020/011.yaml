  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ సమీకరణ పిలుపు తెలుగులో సహజంగా వినిపించేందుకు బహువచన గౌరవ/సామూహిక ఆజ్ఞారూపమైన ‘రండి’ ఉపయోగించబడింది.
