source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: te
  text: అక్కడ బిక్రీ కుమారుడైన షెబా అనే నీచుడు[a] ఉన్నాడు. అతడు బెన్యామీను గోత్రానికి చెందినవాడు. అతడు బూర[b] ఊది, “దావీదులో మనకు భాగం[c] లేదు; యెష్షయి కుమారునిలో మనకు స్వాస్థ్యం లేదు. ఇశ్రాయేలూ, ప్రతి ఒక్కరూ తమ తమ గుడారాలకు వెళ్లండి![d]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుష్టుడు,’ ‘పనికిమాలినవాడు’; మరింత అక్షరార్థంగా ‘బెలీయాలు మనిషి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో షోఫార్—ప్రజలకు సంకేతమివ్వడానికి ఉపయోగించే కొమ్ము వాద్యం; సంప్రదాయంగా ఇది పొట్టేలు కొమ్ముతో చేసినదిగా భావిస్తారు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘దావీదులో మనకు వాటా లేదు.’
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూ అక్షరార్థం ‘ప్రతి మనిషి తన గుడారాలకు.’ ఇది ప్రతి ఒక్కరూ తమ ఇళ్లకు లేదా శిబిరాలకు వెళ్లిపోవాలని చెప్పే పంపిణీ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: ఉన్నాడు
  rationale: שָׁם తో కూడిన ఈ నిఫ్అల్ ప్రయోగం ఇక్కడ పేరు పెట్టడాన్ని కాక ఉనికిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అక్కడ ... ఉన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אִישׁ בְּלִיַּעַל
  choice: పనికిమాలినవాడు
  rationale: ఇది వ్యక్తి నీచత్వం లేదా దుష్ట స్వభావాన్ని తెలిపే వర్ణనాత్మక పదబంధం; ‘బెలీయాలు మనిషి’ అనే తరువాతి దయ్యసంబంధ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబ
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు తగిన విధంగా లిప్యంతరీకరించి, హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: אִישׁ יְמִינִי
  choice: బెన్యామీను గోత్రానికి చెందినవాడు
  rationale: ఈ పదబంధం అతని గోత్ర అనుబంధాన్ని సూచిస్తుంది; స్పష్టమైన ఆధునిక తెలుగులో అర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: అతడు బూర ఊది
  rationale: שׁוֹפָר ప్రజలకు సంకేతమిచ్చేందుకు ఊదే కొమ్ము వాద్యం. ‘బూర’ కథనంలో సహజంగా ఉండగా, దాని నిర్దిష్ట స్వరూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: దావీదులో మనకు భాగం లేదు
  rationale: חֵלֶק యొక్క భాగం/వాటా భావాన్ని, దావీదు పరిపాలనలో తమకు వాటా లేదనే రాజకీయ ప్రకటనతో సహా నిలుపుతుంది.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: యెష్షయి కుమారునిలో మనకు స్వాస్థ్యం లేదు
  rationale: נַחֲלָה లోని వారసత్వపు ఆస్తి లేదా కేటాయింపబడిన భాగం అనే ప్రతిధ్వనిని ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: בְּבֶן יִשַׁי
  choice: యెష్షయి కుమారునిలో
  rationale: రాజు అనే బిరుదుకు బదులు వంశాన్ని మాత్రమే పేర్కొనే మూలంలోని కొంత తిరస్కారపూర్వక ధోరణిని నిలుపుతుంది.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ప్రతి ఒక్కరూ తమ తమ గుడారాలకు వెళ్లండి
  rationale: అక్షరార్థంగా ‘ప్రతి మనిషి తన గుడారాలకు’ అనే పంపిణీ ప్రయోగం. తెలుగు ఆజ్ఞారూపం నినాద స్వభావాన్ని, ప్రతి వ్యక్తి తన నివాసానికి లేదా శిబిరానికి తిరగాలనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: ఇది ఉత్తర గోత్రాలను ఉద్దేశించిన సంబోధన; తెలుగు సంబోధనారూపం మూలంలోని పిలుపును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: בְּלִיַּעַל ను ‘బెలీయాలు’ అనే నామంగా తీసుకోవాలా, లేక వర్ణనాత్మక పదంగా అనువదించాలా
  choice: వర్ణనాత్మకంగా ‘పనికిమాలినవాడు’
  alternative: ‘బెలీయాలు మనిషి’ లేదా ‘దుష్టుడు’
  rationale: ఈ చారిత్రక కథనంలో ఈ పదం షెబ యొక్క నీచమైన లేదా ధర్మవిరుద్ధమైన స్వభావాన్ని వర్ణిస్తుంది; తరువాత ఏర్పడిన దయ్యసంబంధ నామార్థం ఇక్కడ అవసరం లేదు. ‘దుష్టుడు’ సాధ్యమే అయినా, మూలంలోని worthlessness భావాన్ని ‘పనికిమాలినవాడు’ దగ్గరగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. షెబ మాటలకు తిరుగుబాటు నినాదపు సంక్షిప్తతను ఇచ్చి, ‘దావీదులో భాగం’ మరియు ‘యెష్షయి కుమారునిలో స్వాస్థ్యం’ అనే మూల రూపకాలను ఉద్దేశపూర్వకంగా నిలిపాం. ప్రధాన వచనంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
