source:
  edition: WLC
  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: te
  text: అమాసా ప్రధాన రహదారి మధ్యలో రక్తంలో పొర్లుతున్నాడు.[a] ప్రజలందరూ ఆగిపోతున్నారని ఆ మనిషి చూశాడు. అతని దగ్గరికి వచ్చిన ప్రతివాడూ ఆగిపోవడం చూసినప్పుడు, అతడు అమాసాను ప్రధాన రహదారి నుండి పొలంలోకి తీసుకెళ్లి, అతని మీద ఒక వస్త్రం కప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రక్తంలో దొర్లుతున్నాడు.’ హీబ్రూ క్రియ మరింత అక్షరార్థంగా ‘తనను తాను దొర్లించుకుంటున్నాడు’ అనే భావాన్ని ఇస్తుంది; ఇక్కడ అది గాయపడి పడివున్న అమాసా కదలికను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: పొర్లుతున్నాడు
  rationale: גלל యొక్క హిత్పోలేల్ రూపం తనను తాను దొర్లించుకోవడం లేదా పొర్లడం అనే భావాన్ని ఇస్తుంది. గాయంతో రక్తంలో కదులుతున్న అమాసా దృశ్యాన్ని సహజంగా తెలియజేస్తూ, మూలంలోని శారీరక కదలికను నిలుపుతుంది.
- source_word: בַּדָּם
  choice: రక్తంలో
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో ఈ సందర్భంలో ‘రక్తంలో’ అనడం సహజం. మూలంలో స్పష్టంగా లేని ‘తన రక్తంలో’ అనే భావాన్ని చేర్చలేదు.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: రాజమార్గం మధ్యలో
  rationale: מְסִלָּה ప్రధానమైన లేదా ఎత్తుగా నిర్మించిన రహదారిని సూచించగలదు. ‘రాజమార్గం’ ప్రజలు ప్రయాణించే ప్రధాన మార్గం అనే భావాన్ని, ‘మధ్యలో’ בְּתוֹךְ భావాన్ని అందిస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: నిర్దిష్ట ఉపపదం సందర్భంలో తెలిసిన వ్యక్తిని సూచిస్తుంది; అందువల్ల ‘ఒక మనిషి’ కంటే ‘ఆ మనిషి’ తగినది.
- source_word: כִּי עָמַד כָּל הָעָם
  choice: ప్రజలందరూ ఆగిపోతున్నారని
  rationale: עמד ఇక్కడ మార్గంలో ఉన్న అమాసాను చూసి ప్రజలు ఒక్కొక్కరుగా ఆగిపోవడాన్ని సూచిస్తుంది. కొనసాగుతున్న దృశ్యానికి ‘ఆగిపోతున్నారు’ సహజంగా సరిపోతుంది.
- source_word: וַיַּסֵּב
  choice: తీసుకెళ్లి
  rationale: సబబ్ హిఫీల్ రూపం అమాసాను మార్గం నుంచి పక్కకు తరలించడాన్ని సూచిస్తుంది. ‘లాగాడు’ అని విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, తెలుగులో సహజంగా గమ్యస్థానానికి తరలింపును తెలుపుతుంది.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: రాజమార్గం మీదనుంచి పొలంలోకి
  rationale: మార్గం నుంచి తొలగించి పక్కనున్న పొలంలోకి చేర్చిన దిశను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֶּגֶד
  choice: ఒక వస్త్రం
  rationale: בֶּגֶד సాధారణంగా దుస్తు లేదా వస్త్రం. ‘అంగీ’ వంటి మరింత నిర్దిష్ట వస్త్రాన్ని ఊహించకుండా విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది.
- source_word: כָּל הַבָּא עָלָיו
  choice: అతని దగ్గరికి వచ్చిన ప్రతివాడూ
  rationale: అమాసా ఉన్న చోటికి వచ్చి అతన్ని ఎదుర్కొన్న ప్రతి ప్రయాణికుడిని సూచిస్తుంది. ‘దగ్గరికి వచ్చిన’ తెలుగులో సహజంగా ఆ సందర్భాన్ని అందిస్తుంది.
- source_word: וְעָמָד
  choice: ఆగిపోవడం
  rationale: ముందటి עמד ను పునరావృతం చేస్తూ, అక్కడికి వచ్చినవారు ప్రయాణం నిలిపారని స్పష్టంగా తెలియజేస్తుంది.
