source:
  edition: WLC
  text: אָנֹכִ֕י שְׁלֻמֵ֖י אֱמוּנֵ֣י יִשְׂרָאֵ֑ל אַתָּ֣ה מְבַקֵּ֗שׁ לְ/הָמִ֨ית עִ֤יר וְ/אֵם֙ בְּ/יִשְׂרָאֵ֔ל לָ֥/מָּה תְבַלַּ֖ע נַחֲלַ֥ת יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: te
  text: నేను ఇశ్రాయేలులో శాంతియుతులైన నమ్మకస్థులలో ఒకరిని. నీవు ఇశ్రాయేలులో ఒక పట్టణాన్ని, ఒక తల్లిని[a] నాశనం చేయాలని ప్రయత్నిస్తున్నావు. యెహోవా స్వాస్థ్యాన్ని ఎందుకు మింగివేయాలని ప్రయత్నిస్తున్నావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలులో తల్లివంటి పట్టణాన్ని’; అంటే ఇశ్రాయేలులో ప్రాముఖ్యమైన లేదా ఇతరులకు ఆదరణనిచ్చే పట్టణాన్ని అని భావం కావచ్చు.
    reason: ‘పట్టణం’ మరియు ‘తల్లి’ అనే పదాల మధ్య ఉండగల సమానాధికార సంబంధాన్ని వివరిస్తుంది; ప్రధాన పాఠ్యం హెబ్రీ రూపకాన్ని, దాని సంధిగ్ధతను నిలుపుతుంది.
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలులో శాంతిని కోరే నమ్మకమైనవారిలో ఒకరిని
  rationale: రెండు బహువచన రూపాల సమూహార్థాన్ని నిలిపి, వక్త తనను శాంతికాముకులైన నమ్మకస్థుల సమూహంలో ఒకరిగా గుర్తించుకునే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: నాశనం చేయాలని చూస్తున్నావు
  rationale: మూలంలో చంపాలని ప్రయత్నించడం అనే భావం ఉన్నా, కర్మగా పట్టణం రావడం వల్ల సైనిక సందర్భంలో ‘నాశనం చేయడం’ సహజంగా ఉండి ఉద్దేశపూర్వక ప్రయత్నాన్ని కూడా తెలియజేస్తుంది.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ఒక పట్టణాన్ని, ఒక తల్లిని
  rationale: ‘పట్టణం’ మరియు ‘తల్లి’ మధ్య ఉన్న సంధిగ్ధ సంబంధాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా, హెబ్రీ రూపకాన్ని నిలుపుతుంది; సంభావ్య సమానాధికార అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: תְבַלַּע
  choice: మింగివేయాలి
  rationale: సర్వనాశనాన్ని సూచించే సజీవమైన ‘మింగివేయడం’ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: נַחֲלַת יְהוָה
  choice: యెహోవా స్వాస్థ్యాన్ని
  rationale: נחלה యొక్క వారసత్వం/స్వాధీనభాగం అనే ఒడంబడిక సంబంధిత భావాన్ని ‘స్వాస్థ్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలులో తల్లి’ అనే రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘ఒక పట్టణాన్ని, ఒక తల్లిని’ అని రూపకాన్నీ వ్యాకరణ సంధిగ్ధతనూ నిలుపడం
  alternative: ‘ఇశ్రాయేలులో తల్లివంటి పట్టణాన్ని’ లేదా ‘ఇశ్రాయేలులో ఒక ముఖ్య పట్టణాన్ని’
  rationale: హెబ్రీలో ఇది పట్టణాన్ని ‘తల్లి’గా వివరించే సమానాధికార ప్రయోగం కావచ్చు; అయితే దానిని ప్రధాన పాఠ్యంలో పూర్తిగా వ్యాఖ్యానించి చెప్పకుండా సాహిత్య బలాన్ని, నిజమైన సంధిగ్ధతను కాపాడడం సముచితం.
- issue: נַחֲלַת יְהוָה యొక్క సంబంధం
  choice: ‘యెహోవా స్వాస్థ్యం’
  alternative: ‘యెహోవా వారసత్వం’
  rationale: ఇశ్రాయేలు యెహోవాకు చెందిన ప్రజ/భాగం అనే దైవశాస్త్రీయ వాదనను ‘స్వాస్థ్యం’ సహజంగా తెలియజేస్తుంది; ఎవరు ఎవరి నుండి వారసత్వంగా పొందారనే అనవసర అపార్థాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలి. వక్త స్త్రీ కావడం వల్ల ‘ఒకరిని’ రూపం లింగనిరపేక్షంగా సహజంగా ఉంది. ‘నీవు’ అనే ఏకవచన సంబోధన మూలంలోని ప్రత్యక్ష గద్దింపును నిలుపుతుంది.
