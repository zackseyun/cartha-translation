translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని అనుసరించాం. దావీదు ఇచ్చిన ఆజ్ఞలోని ఉద్ఘాటనను ‘నువ్వే’తో నిలిపి, సైనిక సందర్భానికి తగిన ‘వెంబడించు,’ ‘ప్రాకారాలున్న పట్టణాలు’ వంటి పదాలను వాడాం. అరుదైన హీబ్రూ చూపు-ప్రయోగాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగు నుడికారంతో, పాదటిప్పణిలో అక్షరార్థంతో అందించాం.
