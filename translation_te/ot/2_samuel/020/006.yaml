source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל אֲבִישַׁ֔י עַתָּ֗ה יֵ֧רַֽע לָ֛/נוּ שֶׁ֥בַע בֶּן בִּכְרִ֖י מִן אַבְשָׁל֑וֹם אַ֠תָּה קַ֞ח אֶת עַבְדֵ֤י אֲדֹנֶ֨י/ךָ֙ וּ/רְדֹ֣ף אַחֲרָ֔י/ו פֶּן מָ֥צָא ל֛/וֹ עָרִ֥ים בְּצֻר֖וֹת וְ/הִצִּ֥יל עֵינֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: te
  text: అప్పుడు దావీదు అబీషైతో, “ఇప్పుడు బిక్రీ కుమారుడైన షెబ మనకు అబ్షాలోము కంటే ఎక్కువ హాని చేస్తాడు. నీవు నీ ప్రభువు సేవకులను తీసుకొని అతన్ని వెంబడించు; లేకపోతే అతడు ప్రాకారాలున్న పట్టణాలను తన కోసం సంపాదించుకొని మన కంటికి చిక్కకుండా తప్పించుకుంటాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మన కళ్లను విడిపిస్తాడు.” ఇది అతడు మన కంటికి చిక్కకుండా తప్పించుకోవడం లేదా మన దృష్టి నుంచి తప్పించుకోవడం అనే భావాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: మనకు ... ఎక్కువ హాని చేస్తాడు
  rationale: ఈ సందర్భంలో רעע నైతిక దుష్టత్వాన్ని కాక హాని లేదా కీడు కలిగించడాన్ని సూచిస్తుంది. מִן‌తో ఉన్న తులనను తెలుగులో సహజంగా ‘కంటే ఎక్కువ’ అని వ్యక్తం చేశాం.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబ
  rationale: వ్యక్తి పేర్లను తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చి, హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: מִן אַבְשָׁלוֹם
  choice: అబ్షాలోము కంటే
  rationale: מִן ఇక్కడ తులనార్థకంగా ఉంది; అందువల్ల ‘కంటే’ అనేది సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: אַתָּה קַח
  choice: నువ్వే ... వెంటబెట్టుకొని
  rationale: స్వతంత్ర సర్వనామమైన אַתָּה ఇచ్చే ఉద్ఘాటనను ‘నువ్వే’ ద్వారా నిలిపాం. ‘తీసుకో’ అనే అక్షరార్థం ఈ సైనిక సందర్భంలో ‘వెంటబెట్టుకొని’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: నీ ప్రభువు సేవకులను
  rationale: అబీషై ప్రభువైన దావీదును సూచించే అధీనతా భాషను నిలిపి, ఇక్కడ బానిసత్వాన్ని అనవసరంగా ముందుకు తేవకుండా עֲבָדִיםను ‘సేవకులు’గా అనువదించాం.
- source_word: וּרְדֹף אַחֲרָיו
  choice: అతన్ని వెంబడించు
  rationale: רדף సైనిక సందర్భంలో తరుమడం లేదా వెంబడించడం. ‘వెంబడించు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలార్థాన్ని పూర్తిగా అందిస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: פֶּן భయాశంకతో కూడిన ప్రతికూల పరిణామాన్ని పరిచయం చేస్తుంది. ‘లేకపోతే’ సాధారణ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: ప్రాకారాలున్న పట్టణాలను తనకు ఆశ్రయంగా సంపాదించుకొని
  rationale: מָצָא అక్షరార్థంగా ‘కనుగొను/పొందు’; לוֹ స్వప్రయోజనాన్ని సూచిస్తుంది. సందర్భంలో రక్షణగల పట్టణాలను ఆశ్రయంగా పొందడం ఉద్దేశం కాబట్టి దాన్ని సహజ తెలుగులో స్పష్టంచేశాం.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: మన కంటికి చిక్కకుండా తప్పించుకుంటాడు
  rationale: అక్షరార్థంగా ‘మన కళ్లను విడిపించు/లాక్కొను’ అనే అసాధారణ హీబ్రూ ప్రయోగం ఇక్కడ మన దృష్టికి చిక్కకుండా తప్పించుకోవడాన్ని సూచిస్తుంది. తెలుగు సమానార్థక ప్రయోగం మూలంలోని చూపు-రూపకాన్ని కొంత నిలుపుతుంది.
