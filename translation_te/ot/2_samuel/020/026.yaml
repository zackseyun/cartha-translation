  yaml_path: translation/ot/2_samuel/020/026.yaml
  text: And Ira the Jairite also was priest to David[a].
translation:
  language: te
  text: యాయీరీయుడైన ఈరా కూడా దావీదుకు యాజకుడిగా ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన అధికారి” లేదా “రాజ సలహాదారు.” హీబ్రూ పదానికి అక్షరార్థం “యాజకుడు”; అయితే కొన్ని రాజసభ సందర్భాల్లో అది ఉన్నతస్థాయి ఆస్థాన అధికారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: సందర్భంలోని కొనసాగింపును, అదనపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వాక్యారంభంలోని హీబ్రూ సంధానార్థం తెలుగు ప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: עִירָא
  choice: ఈరా
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הַיָּאִרִי
  choice: యాయీరీయుడైన
  rationale: ఇది యాయీరు వంశం లేదా గోత్రానికి చెందినవాడనే విశేషణ రూపం; సంక్షిప్తమైన వంశసూచక రూపాన్ని నిలుపుతుంది.
- source_word: הָיָה
  choice: ఉన్నాడు
  rationale: అధికారుల జాబితాలో ఇది సాధారణ భూతకాల స్థితిని సూచిస్తుంది; ‘అయ్యాడు’ అనే మార్పు భావాన్ని అనవసరంగా చేర్చదు.
- source_word: כֹהֵן
  choice: యాజకుడు
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘యాజకుడు.’ రాజసభ సందర్భంలో ఉన్నతాధికారి అనే సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా పాదసూచికలో ఉంచాం.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: దావీదుతో సంబంధం లేదా అతనికి చేసే సేవను సూచించే לְ ఉపసర్గను సన్నిహితంగా అనువదిస్తూ, ఖచ్చితమైన విధిని నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: రాజసభ సందర్భంలో כֹהֵן పదార్థం
  choice: ప్రధాన పాఠ్యంలో ‘యాజకుడు’
  alternative: ‘ప్రధాన అధికారి’ లేదా ‘రాజ సలహాదారు’
  rationale: ఈ సందర్భంలో పరిపాలనా పదవి ఉద్దేశించబడి ఉండవచ్చు; అయినా పదానికి సహజమైన ప్రాథమిక అర్థం ‘యాజకుడు.’ మూలంలోని సందిగ్ధతను తొలగించకుండా ప్రధాన అర్థాన్ని పాఠ్యంలో, కార్యనిర్వాహక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన అధికారుల జాబితా శైలిని నిలిపి, గౌరవప్రదమైన సాధారణ పదజాలం వాడాం. మూలంలోని రాజసభ పదవికి సంబంధించిన సందిగ్ధతను పాదసూచికతో సంరక్షించాం.
