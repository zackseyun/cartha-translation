review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and central meanings of the Hebrew: David''s return, the ten concubines left to guard the house, their placement in custody, their material support, the sexual euphemism, and their continuing widow-like condition until death. “కాపలా నిర్బంధంలో” is understandable but is not a sufficiently natural Telugu expression for בֵּית מִשְׁמֶרֶת; it can be improved without losing the custodial and guarded sense. “భర్త బతికుండగానే” appropriately explains the paradox but makes explicit in the verse what the Hebrew’s compressed expression leaves implicit; this is better retained in the note.'
  naturalness: The register is generally modern, clear, and suitably restrained. “కాపలాతో కూడిన నిర్బంధంలో” is smoother and more idiomatic than “కాపలా నిర్బంధంలో.” “వారితో కలవలేదు” can be understood as ordinary social contact; “వారి దగ్గరకు వెళ్లలేదు,” supported by the note, more closely preserves the Hebrew euphemism while remaining natural Telugu.
  terminology: “ఉపపత్నులు” is an appropriate standard equivalent for פִּלַגְשִׁים. “పోషణ కల్పించాడు” correctly conveys ongoing provision. The notes properly explain the sexual euphemism and the unusual phrase “living widowhood.”
  issues:
  - severity: medium
    issue: కాపలా నిర్బంధంలో
    rationale: This wording is somewhat compressed and awkward in modern Telugu. The Hebrew בֵּית מִשְׁמֶרֶת denotes custody/confinement under guard; “కాపలాతో కూడిన నిర్బంధంలో” naturally preserves both features.
  - severity: low
    issue: భర్త బతికుండగానే విధవరాళ్లలా
    rationale: The phrase accurately explains the contextual paradox, but the Hebrew itself uses the deliberately compact expression “living widowhood.” Keeping the explanation in the footnote better preserves that rhetorical compression.
  - severity: low
    issue: వారితో కలవలేదు
    rationale: Without the note it may primarily suggest ordinary association. “వారి దగ్గరకు వెళ్లలేదు” is a closer Telugu idiomatic counterpart to the Hebrew euphemism, while the note continues to identify its sexual sense.
  revised_text: దావీదు యెరూషలేములోని తన ఇంటికి వచ్చినప్పుడు, రాజు తాను ఇంటిని కాపాడడానికి విడిచిపెట్టిన పది మంది ఉపపత్నులను తీసుకొని, వారిని కాపలాతో కూడిన నిర్బంధంలో ఉంచి వారికి పోషణ కల్పించాడు. అయితే అతడు వారి దగ్గరకు వెళ్లలేదు.[a] ఆ విధంగా వారు చనిపోయే రోజు వరకు నిర్బంధంలోనే ఉండి, విధవరాళ్లలా జీవించారు.[b]
