source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: te
  text: దావీదు యెరూషలేములోని తన ఇంటికి వచ్చినప్పుడు, రాజు తాను ఇంటిని కాపాడడానికి విడిచిపెట్టిన పది మంది ఉపపత్నులను తీసుకొని, వారిని కాపలాతో కూడిన నిర్బంధంలో ఉంచి వారికి పోషణ కల్పించాడు. అయితే అతడు వారి దగ్గరకు వెళ్లలేదు.[a] ఆ విధంగా వారు చనిపోయే రోజు వరకు నిర్బంధంలోనే ఉండి, విధవరాళ్లలా జీవించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి దగ్గరకు వెళ్లలేదు’ అనేది వారితో లైంగిక సంబంధం పెట్టుకోలేదని చెప్పే హెబ్రీ సభ్యోక్తి.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా ‘బతికున్న విధవత్వం.’ దావీదు బతికే ఉన్నప్పటికీ వారు విధవరాళ్లలా జీవించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: తన ఇల్లు
  rationale: בַּיִת ఇల్లు, రాజభవనం, గృహస్థానం అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ రాజనివాసం ఉద్దేశమైనా, హెబ్రీ పదరూపాన్ని సహజంగా నిలుపుతూ ‘తన ఇల్లు’ అని అనువదించాం.
- source_word: פִּלַגְשִׁים
  choice: ఉపపత్నులు
  rationale: ప్రాచీన రాజగృహంలో తక్కువ స్థాయి గల గుర్తింపు పొందిన వైవాహిక సంబంధంలోని స్త్రీలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఉపపత్నులు’ సంక్షిప్తమైన, గౌరవప్రదమైన సమానం.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: ఇంటిని కాపాడడానికి విడిచిపెట్టిన
  rationale: שׁמר కాపాడడం, చూసుకోవడం అనే భావాలను కలిగి ఉంది. ఈ సందర్భంలో నివాసాన్ని కాపాడే బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: కాపలా నిర్బంధం
  rationale: అక్షరార్థంగా ‘కాపలా/నిర్బంధ గృహం.’ పర్యవేక్షణలో ఏకాంతంగా ఉంచబడిన స్థితి అనే రెండు భావాలనూ ఈ ప్రయోగం నిలుపుతుంది.
- source_word: וַיְכַלְכְּלֵם
  choice: వారికి పోషణ కల్పించాడు
  rationale: అవసరమైన జీవనాధారాన్ని నిరంతరం సమకూర్చడం అనే క్రియాభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: అతడు వారితో కలవలేదు
  rationale: ఈ సందర్భంలోని בוא אל లైంగిక సంబంధానికి వాడే సభ్యోక్తి. తెలుగులో ‘వారితో కలవలేదు’ అదే సభ్యోక్తి స్వభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: צְרֻרוֹת
  choice: నిర్బంధంలోనే ఉండి
  rationale: నిర్బంధించబడి అలాగే కొనసాగిన ఫలితాత్మక, దీర్ఘస్థితిని ‘లోనే ఉండి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד יוֹם מֻתָן
  choice: వారు చనిపోయే రోజు వరకు
  rationale: హెబ్రీ నామవాచక నిర్మాణాన్ని సహజ ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אַלְמְנוּת חַיּוּת
  choice: భర్త బతికుండగానే విధవరాళ్లలా జీవించారు
  rationale: అక్షరార్థంలోని అసాధారణ ‘జీవించి ఉన్న విధవత్వం’ భావాన్ని, దావీదు సజీవుడే అయినా వారు విధవరాళ్ల స్థితిలో జీవించారనే వైరుధ్యంతో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దావీదు ఉపపత్నులపట్ల చేసిన చర్యకు నైతిక, సామాజిక మూల్యాంకనం
  choice: చర్యను సమర్థించకుండా లేదా అదనంగా ఖండించకుండా, నిర్బంధం, పోషణ, లైంగిక సంబంధం లేకపోవడం, విధవరాళ్లలాంటి జీవితం అనే అంశాలను వివరణాత్మకంగా అనువదించడం.
  alternative: దీనిని కేవలం రక్షణాత్మక చర్యగా మృదువుగా చూపడం, లేదా మూలపాఠంలో లేని ప్రత్యక్ష నైతిక ఖండనను చేర్చడం.
  rationale: మూలపాఠం చర్యను మరియు స్త్రీలకు ఏర్పడిన స్థితిని కఠినంగా వర్ణిస్తుంది గాని ప్రత్యక్ష నైతిక తీర్పు ఇవ్వదు; అనువాదం ఆ ఉద్రిక్తతను యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన శైలి. ‘ఉపపత్నులు’ సామాజిక-వైవాహిక స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది. మూలంలోని కఠినతను మృదువుచేయకుండా, అసభ్యంగా కాకుండా సభ్యోక్తిని నిలిపాం.
