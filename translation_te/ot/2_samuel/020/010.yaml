  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. హింసాత్మక వివరాన్ని మూలానికి తగినంత స్పష్టంగా ఉంచినా, అనవసరంగా ముతక లేదా సంచలనాత్మక పదజాలాన్ని నివారించాం. [a] పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
