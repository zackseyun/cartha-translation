  terminology: ‘ఖడ్గం,’ ‘కడుపు,’ ‘అంతరావయవాలు,’ ‘వెంబడించారు’ తగిన ప్రామాణిక పదాలు. షెబా, బిక్రీ, యోవాబు, అబీషై పేర్లు సుసంగతంగా ఉన్నాయి. חֹמֶשׁ యొక్క సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో కొనసాగించాలి.
