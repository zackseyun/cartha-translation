source:
  edition: WLC
  text: וַ/עֲמָשָׂ֨א לֹֽא נִשְׁמַ֜ר בַּ/חֶ֣רֶב אֲשֶׁ֣ר בְּ/יַד יוֹאָ֗ב וַ/יַּכֵּ/הוּ֩ בָ֨/הּ אֶל הַ/חֹ֜מֶשׁ וַ/יִּשְׁפֹּ֨ךְ מֵעָ֥י/ו אַ֛רְצָ/ה וְ/לֹא שָׁ֥נָה ל֖/וֹ וַ/יָּמֹ֑ת וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: te
  text: అయితే యోవాబు చేతిలో ఉన్న ఖడ్గం పట్ల అమాశా అప్రమత్తంగా లేడు. యోవాబు దానితో అతని కడుపులో దెబ్బకొట్టాడు[a]. అతని అంతరావయవాలు నేలపై చిందిపోయాయి. యోవాబు అతనిని మళ్లీ దెబ్బకొట్టలేదు; అతడు చనిపోయాడు. తరువాత యోవాబు, అతని సోదరుడైన అబీషై, బిక్రీ కుమారుడైన షెబాను వెంబడించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఐదవ పక్కటెముక వద్ద.” ఇక్కడి హీబ్రూ పదాన్ని పాత అనువాదాలు సంప్రదాయంగా ఇలా అనువదించాయి; అయితే ఈ సందర్భంలో అది సాధారణంగా కడుపు లేదా ఉదర ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: అప్రమత్తంగా లేడు
  rationale: నిఫాల్ రూపం ఇక్కడ మరొకరి రక్షణలో లేకపోవడం కంటే ప్రమాదం పట్ల జాగ్రత్తగా లేకపోవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం సహజంగా, స్పష్టంగా ఉంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: యుద్ధ ఆయుధమైన ఖడ్గానికి గౌరవప్రదమైన, సాధారణ బైబిలు కథన శైలికి సరిపోయే తెలుగు పదం.
- source_word: בְּיַד יוֹאָב
  choice: యోవాబు చేతిలో ఉన్న
  rationale: ఆయుధం యోవాబు చేతిలో ఉందనే ప్రత్యక్ష స్థలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיַּכֵּהוּ בָהּ
  choice: దానితో అతని కడుపులో పొడిచాడు
  rationale: נכה సాధారణంగా ‘కొట్టాడు’ అని అర్థమిచ్చినా, ఖడ్గంతో కడుపుకు కలిగించిన ప్రాణాంతక గాయం సందర్భంలో ‘పొడిచాడు’ అనేది తెలుగులో స్పష్టమైన సహజ సమానార్థకం; గాయ విధానాన్ని సందర్భం సమర్థిస్తుంది.
- source_word: אֶל הַחֹמֶשׁ
  choice: అతని కడుపులో
  rationale: ఈ సమూయేలు యుద్ధ కథనాల్లో חֹמֶשׁ కడుపు లేదా ఉదర ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ. ‘ఐదవ పక్కటెముక’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని పదార్థ సమస్యను వెల్లడించాం.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: అతని పేగులు నేలమీదికి బయటపడ్డాయి
  rationale: అంతర్గత అవయవాలు నేలపైకి వెలువడిన ఘోర దృశ్యాన్ని స్పష్టంగా, కానీ అతిగా వాడుకభాషలో కాకుండా తెలియజేస్తుంది.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: అతన్ని మళ్లీ పొడవలేదు
  rationale: అక్షరార్థంగా ‘అతనికి మరలా చేయలేదు’ అనే సంక్షిప్త ప్రయోగంలో సూచితమైన దెబ్బను సందర్భానుసారంగా స్పష్టపరుస్తుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: సరళమైన కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: רָדַף אַחֲרֵי
  choice: వెంబడించారు
  rationale: సైనిక అన్వేషణ లేదా తరుముదలకు సరిపోయే ప్రామాణిక తెలుగు పదం.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: బిక్రీ కుమారుడైన షెబ
  rationale: హీబ్రూ పేర్లను తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, ‘కుమారుడు’ సంబంధాన్ని సహజ తెలుగు పదక్రమంలో తెలిపింది.
