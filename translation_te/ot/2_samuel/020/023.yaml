source:
  edition: WLC
  text: וְ/יוֹאָ֕ב אֶ֥ל כָּל הַ/צָּבָ֖א יִשְׂרָאֵ֑ל וּ/בְנָיָה֙ בֶּן יְה֣וֹיָדָ֔ע עַל ה/כרי וְ/עַל הַ/פְּלֵתִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/023.yaml
  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: te
  text: యోవాబు ఇశ్రాయేలు సైన్యమంతటికీ అధిపతిగా ఉన్నాడు. యెహోయాదా కుమారుడు బెనాయా కెరేతీయుల[a] మీద, పెలేతీయుల మీద అధిపతిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ సమూహనామపు ఖచ్చిత రూపం అనిశ్చితం; దీనిని ‘కరీయులు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: యోవాబు
  rationale: వ్యక్తి పేరును సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణలో ఇచ్చాం. వావ్ ఈ పరిపాలనా జాబితాలో తదుపరి అంశాన్ని కలుపుతుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని ప్రారంభించకుండానే సందర్భ సంబంధం సహజంగా ఉంటుంది.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సైన్యమంతటికీ అధిపతిగా ఉన్నాడు
  rationale: క్రియలేని ఈ పరిపాలనా పదబంధంలో אֶל అధికార బాధ్యతను సూచిస్తుంది. צָבָא ఇక్కడ వ్యవస్థీకృత సైన్యం; כָּל భావాన్ని ‘సైన్యమంతటికీ’ నిలుపుతుంది.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు బెనాయా
  rationale: తండ్రి-కుమార సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో ఉంచి, రెండు పేర్లను లిప్యంతరీకరించాం.
- source_word: עַל ה/כרי
  choice: కెరీతీయుల మీద ... అధిపతిగా ఉన్నాడు
  rationale: עַל ఈ అధికారుల జాబితాలో పర్యవేక్షణను సూచిస్తుంది. הכרי ఒక సమూహనామం; దాని ఖచ్చిత రూపం అనిశ్చితమైనందున అర్థానువాదం చేయకుండా ‘కెరీతీయులు’గా లిప్యంతరీకరించాం.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: పెలేతీయుల మీద
  rationale: ముందటి עַל పదబంధంతో సమాంతరంగా అధికార పరిధిని సూచిస్తుంది. సమూహనామాన్ని ‘పెలేతీయులు’గా లిప్యంతరీకరించాం; చివరి ‘అధిపతిగా ఉన్నాడు’ రెండు సమూహాలకూ వర్తిస్తుంది.
