translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన పరిపాలనా శైలిని వాడాం. ‘అధిపతిగా ఉన్నాడు’ అధికార బాధ్యతను సహజంగా తెలియజేస్తుంది. మూలంలోని రెండు అధికార పదబంధాల సమాంతరత్వాన్ని ‘మీద’ అనే పునరుక్తితో నిలిపాం.
