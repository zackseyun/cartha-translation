base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: te
  text: వారు వచ్చి ఆబేలు-బేత్-మయకాలో అతనిని ముట్టడించారు.[a] పట్టణం మీదికి ఒక ముట్టడి దిబ్బను పోశారు; అది బయటి రక్షణకట్టుకు ఆనుకొని నిలిచింది.[b][c] యోవాబుతో ఉన్న ప్రజలందరూ ప్రాకారాన్ని కూల్చడానికి దాన్ని ధ్వంసం చేస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని ముట్టడించారు.” హీబ్రూ పాఠంలో “అతనిని” అని ఉంది; పట్టణం ముట్టడిలో ఉన్నప్పటికీ, లక్ష్యం షెబా అని ఇది సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ముట్టడి దిబ్బ”కు “మట్టికట్ట” లేదా “ముట్టడి కోసం వేసిన ఎత్తైన మార్గం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “బయటి రక్షణకట్టు”గా అనువదించిన హీబ్రూ పదం బయటి ప్రాకారాన్ని, రక్షణ మట్టికట్టను లేదా మరొక రక్షణ నిర్మాణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వారు వచ్చి
  rationale: בוא అనే సాధారణ కథన క్రియను సహజమైన తెలుగు కథన శైలిలో అనువదిస్తుంది.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: అతనిని ముట్టడించారు
  rationale: צור עם על అంటే ముట్టడించడం. ఏకవచన పుంలింగ ప్రత్యయం పట్టణంలోని షెబాను లక్ష్యంగా చూపుతున్నందున ‘అతనిని’ అని నిలుపుకుంది.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: ఆబేలు-బేత్-మయకాలో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, ఏకీకృత పట్టణనామంగా హైఫన్‌తో ఇచ్చింది.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: ఒక ముట్టడి దిబ్బను పోశారు
  rationale: שׁפך యొక్క ‘పోయడం’ అనే రూపక చిత్రాన్ని నిలుపుతూ, סֹלְלָהను ముట్టడిలో మట్టితో ఏర్పరచే దిబ్బగా స్పష్టపరుస్తుంది.
- source_word: אֶל הָעִיר
  choice: పట్టణానికి ఎదురుగా
  rationale: אֶל యొక్క దిశాభావాన్ని, ఈ సైనిక సందర్భంలోని ప్రతికూల ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: అది బయటి రక్షణకట్టుకు ఆనుకొని నిలిచింది
  rationale: స్త్రీలింగ క్రియకు ముందున్న סֹלְלָהనే కర్తగా తీసుకొని, חֵלను బయటి రక్షణ నిర్మాణంగా అనువదించింది; ఖచ్చిత నిర్మాణం అస్పష్టంగా ఉండటంతో విస్తృత పదాన్ని వాడింది.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: యోవాబుతో ఉన్న ప్రజలందరూ
  rationale: אֶת ఇక్కడ సహచర్యాన్ని సూచిస్తుంది. ‘ప్రజలు’ మూలంలోని הָעָםను నిలుపుతుంది, సందర్భంలో వారు యోవాబు దళాలు.
- source_word: מַשְׁחִיתִם
  choice: దాన్ని ధ్వంసం చేస్తూ ఉన్నారు
  rationale: שׁחת కృదంతంలోని కొనసాగుతున్న విధ్వంసక చర్యను నిలుపుతుంది. అంతర్నిహిత కర్మను ‘దాన్ని’గా ఉంచి మూలంలోని స్వల్ప అస్పష్టతను కాపాడుతుంది.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: ప్రాకారాన్ని కూల్చడానికి
  rationale: נפל హిఫీల్ రూపంలోని ‘పడేలా చేయడం’ భావాన్ని సహజమైన ముట్టడి భాషలో వ్యక్తం చేస్తుంది.
