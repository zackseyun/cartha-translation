  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజాజ్ఞకు తగిన సంక్షిప్తతను ఉంచుతూ, మూలంలోని సమూహార్థక పురుషలింగ ప్రయోగం మరియు సైనిక సందర్భంలోని స్వల్ప అస్పష్టతను పాదసూచికలో కాపాడాం.
