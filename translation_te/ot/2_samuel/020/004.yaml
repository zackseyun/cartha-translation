source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל עֲמָשָׂ֔א הַזְעֶק לִ֥/י אֶת אִישׁ יְהוּדָ֖ה שְׁלֹ֣שֶׁת יָמִ֑ים וְ/אַתָּ֖ה פֹּ֥ה עֲמֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: te
  text: 'అప్పుడు రాజు అమాసాతో ఇలా అన్నాడు: “మూడు రోజులలోగా యూదా పురుషులను[a] నా కోసం సమకూర్చు; నువ్వు ఇక్కడే ఉండు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదా పురుషులు’ అనే హీబ్రూ పదబంధం పురుషలింగ సమూహార్థక ప్రయోగం. సందర్భంలో ఇది యుద్ధానికి సమీకరించగల యూదా పురుషులను సూచించే అవకాశం ఉంది; అయితే మూలపాఠం వారిని స్పష్టంగా ‘యోధులు’ అని పిలవదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో దావీదును సూచించే నిర్దిష్ట నామవాచకం. పేరును చేర్చకుండా మూలంలోని బిరుదునే ఉంచింది.
- source_word: אֶל עֲמָשָׂא
  choice: అమాశాతో
  rationale: మాట్లాడిన వ్యక్తిని తెలుగులో సహజంగా సూచించేందుకు ‘తో’ విభక్తి వాడబడింది.
- source_word: הַזְעֶק
  choice: సమకూర్చు
  rationale: זעק హిఫిల్ ఆజ్ఞారూపం ఇక్కడ బహిరంగ పిలుపుతో ప్రజలను సమీకరించడం లేదా సైనిక సమీకరణ చేయించడం అనే భావాన్ని ఇస్తుంది. ‘సమకూర్చు’ ఆ కారక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే ‘యోధులు’ అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: לִי
  choice: నా కోసం
  rationale: ఈ దత్తివిభక్తి రాజు తరఫున పని చేయడాన్ని సూచిస్తుంది; ‘నా కోసం’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: యూదా పురుషులను
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా, ఇక్కడ సమూహార్థకంగా వాడబడింది. సందర్భం సైనిక సమీకరణను సూచించినప్పటికీ, మూలపాఠం స్పష్టంగా ‘యోధులు’ అనదు; అందువల్ల పురుష సమూహార్థాన్ని నిలిపింది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులలోగా
  rationale: ఆజ్ఞ సందర్భంలో ఇది కార్యాన్ని పూర్తి చేయవలసిన గడువును సూచిస్తుంది; కాలవ్యవధిని కాదు.
- source_word: וְאַתָּה
  choice: నువ్వు కూడా
  rationale: స్పష్టంగా ఉన్న ద్వితీయ పురుష సర్వనామపు ఉద్ఘాటనను నిలుపుతూ, సమన్వయ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פֹּה עֲמֹד
  choice: ఇక్కడే ఉండు
  rationale: עמד ప్రాథమికంగా ‘నిలబడు’ అయినా, ఈ ఆజ్ఞలో ఒకే చోట ఉండిపోవడం భావం. ‘ఇక్కడే ఉండు’ భౌతికంగా నిలబడాలని అనవసరంగా సూచించకుండా సందర్భార్థాన్ని ఇస్తుంది.
