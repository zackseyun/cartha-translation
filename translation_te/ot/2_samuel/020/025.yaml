  yaml_path: translation/ot/2_samuel/020/025.yaml
  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: te
  text: షెవా కార్యదర్శిగా[a] ఉన్నాడు; సాదోకు, అబ్యాతారు యాజకులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లేఖకుడిగా.’ హీబ్రూ పదం రాజసభలోని లేఖకుడు లేదా కార్యదర్శిని సూచించగలదు; ఇక్కడ పరిపాలనా పదవిని స్పష్టం చేయడానికి ‘కార్యదర్శి’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: షెవా
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజన రూపాన్ని నేరుగా ప్రతిబింబించేలా వ్యక్తి పేరును లిప్యంతరీకరించాం; సమాంతర జాబితాల్లో పేరుకు భిన్న రూపాలు కనిపించినా వాటిని ఇక్కడి పాఠంలోకి దిగుమతి చేయలేదు.
- source_word: סֹפֵר
  choice: కార్యదర్శి
  rationale: రాజపాలనలో లేఖన, పరిపాలనా బాధ్యతలు నిర్వహించే అధికారిని సూచించే పదం. ఆధునిక తెలుగు పాఠకులకు పదవిని స్పష్టంగా తెలియజేయడానికి ‘కార్యదర్శి’ వాడాం; ‘లేఖకుడు’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచాం.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హీబ్రూ వ్యక్తి పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: హీబ్రూ వ్యక్తి పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సేవలోని యాజక పదవిని సూచించే బహువచన నామవాచకానికి ప్రామాణిక తెలుగు అనువాదం.
- source_word: וְ
  choice: మరియు/జాబితా అనుసంధానం
  rationale: హీబ్రూలో పునరావృతమయ్యే సంధికారకం జాబితాలోని వ్యక్తులు, పదవులను అనుసంధానిస్తుంది; సహజమైన తెలుగులో విరామచిహ్నం మరియు సంయుక్త నిర్మాణంతో దాని సంబంధాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యంలో స్పష్టంగా లేని ‘రాజు’ వంటి పదాలను చేర్చలేదు; తెలుగు వాక్యసంపూర్ణత కోసం ‘ఉన్నాడు/ఉన్నారు’ను ఉపయోగించాం.
