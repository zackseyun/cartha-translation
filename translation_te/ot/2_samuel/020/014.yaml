translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే కథనశైలిని వాడాం. స్థలనామాలను సాధారణ తెలుగు లిప్యంతరీకరణలో ఉంచి, అనిశ్చిత ప్రజావర్గ నామాన్ని పాఠ్యంలో పరిష్కరించకుండా పాదటిప్పణిలో వివరించాం.
