- from: అతడు ఇశ్రాయేలు గోత్రాలన్నిటి ప్రాంతాల గుండా ఆబేలు, బేత్‌-మయకా వరకు వెళ్లాడు. బెరీయులందరూ[a] సమకూడి, వారు కూడా అతని వెనుక వెళ్లారు[b].
  to: అతడు ఇశ్రాయేలు గోత్రాలన్నిటి ప్రాంతాల గుండా ఆబెలు, బేత్-మయకా వద్దకు వెళ్లాడు. బెరీయులందరూ[a] సమకూడి, వారు కూడా అతని వెనుక వెళ్లారు[b].
