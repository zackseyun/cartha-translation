source:
  edition: WLC
  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు గోత్రాలన్నిటి ప్రాంతాల గుండా ఆబెలు, బేత్-మయకా వద్దకు వెళ్లాడు. బెరీయులందరూ[a] సమకూడి, వారు కూడా అతని వెనుక వెళ్లారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘బెరీయులందరూ’ అని ఉంది. సందర్భంలోని బిక్రీ కుమారుడైన షెబాతో ఈ పదబంధాన్ని అనుసంధానిస్తూ కొన్ని అనువాదాలు ‘బిక్రీయులందరూ’ అని ఇస్తాయి; అయితే ఇక్కడి మసొరెటిక్ పాఠం ‘బెరీయులు’ అనే రూపానికే మరింత నేరుగా మద్దతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘వారు కూడా అతని వెనుక వచ్చారు.’ హీబ్రూ పదబంధానికి ఇది మరింత అక్షరార్థ అనువాదం; సందర్భంలో అతనిని అనుసరించి వెళ్లారనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: అతడు ... గుండా ... వెళ్లాడు
  rationale: עבר అనే క్రియ ఇక్కడ ప్రాంతాల గుండా ప్రయాణించడాన్ని సూచిస్తుంది; తెలుగు కథనశైలిలో ‘గుండా వెళ్లాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటి ప్రాంతాల గుండా
  rationale: గోత్రాలనే కాక వాటి భూభాగాల గుండా సాగిన కదలికను సందర్భం సూచిస్తున్నందున ‘ప్రాంతాల’ను స్పష్టీకరణగా చేర్చడం తెలుగులో సహజంగా ఉంటుంది.
- source_word: אָבֵלָה וּבֵית מַעֲכָה
  choice: ఆబేలు, బేత్‌-మయకా వరకు
  rationale: אָבֵלָה లోని దిశాసూచక ה ను ‘వరకు’తో వ్యక్తం చేశాం; బేత్‌-మయకాను స్థలనామంగా లిప్యంతరీకరించాం. హీబ్రూ రూపంలో పేర్లు పక్కపక్కనే ఉన్నందున వాటిని వేర్వేరు పేర్లుగానే ఉంచాం.
- source_word: וְכָל הַבֵּרִים
  choice: బెరీయులందరూ
  rationale: మసొరెటిక్ పాఠం నేరుగా సూచించే ప్రజావర్గ నామాన్ని లిప్యంతరీకరించాం; సందర్భం ఆధారంగా దానిని ‘బిక్రీయులు’గా మార్చలేదు.
- source_word: וַיִּקָּהֲלוּ
  choice: సమకూడి
  rationale: קהל ఇక్కడ ఒకచోట చేరడాన్ని సూచిస్తుంది; వరుస కథనక్రియలతో సహజంగా కలిసేలా ‘సమకూడి’ అని అనువదించాం.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: వారు కూడా అతని వెనుక వెళ్లారు
  rationale: ‘వచ్చారు’ మరియు ‘అతని వెనుక’ అనే హీబ్రూ పదబంధం సందర్భంలో అతనిని అనుసరించడాన్ని సూచిస్తుంది. ‘కూడా’ אַף ను నిలుపుతుంది; ‘వెనుక వెళ్లారు’ మూలంలోని దృశ్యరూపాన్ని కాపాడుతుంది.
