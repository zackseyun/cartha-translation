  yaml_path: translation/ot/2_samuel/020/016.yaml
  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: te
  text: అప్పుడు పట్టణం నుండి ఒక జ్ఞానవంతురాలైన స్త్రీ బిగ్గరగా పిలిచి, “వినండి! వినండి! దయచేసి యోవాబుకు, ‘ఇక్కడికి రమ్మని చెప్పండి; నేను అతనితో మాట్లాడాలి’ అని చెప్పండి” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: జ్ఞానవంతురాలైన స్త్రీ
  rationale: ‘జ్ఞానముగల స్త్రీ’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు పదబంధంతో వ్యక్తపరుస్తుంది.
- source_word: וַתִּקְרָא
  choice: బిగ్గరగా పిలిచి
  rationale: దూరంలో ఉన్నవారిని ఉద్దేశించి పిలిచే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: వినండి! వినండి!
  rationale: హీబ్రూ పునరుక్తినీ, దాని అత్యవసర పిలుపునీ యథాతథంగా నిలుపుతుంది.
- source_word: אִמְרוּ נָא
  choice: దయచేసి ... చెప్పండి
  rationale: נָא లోని వినయపూర్వక అభ్యర్థన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: קְרַב עַד הֵנָּה
  choice: ఇక్కడికి దగ్గరగా రా
  rationale: ‘ఇక్కడివరకు సమీపించు’ అనే మూలపాఠ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: నేను నీతో మాట్లాడేలా
  rationale: హీబ్రూలోని ఉద్దేశ/ఫలిత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. స్త్రీ పట్టణం లోపలినుండి గోడ వెలుపలివారికి వినిపించేలా పిలిచిన సందర్భాన్ని ‘బిగ్గరగా పిలిచి’ తెలియజేస్తుంది. ప్రత్యక్ష వాక్యంలోని ఏకవచన ‘నీతో’ యోవాబును సూచిస్తుంది.
