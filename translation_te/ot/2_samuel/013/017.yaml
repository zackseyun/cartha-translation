  text: וַ/יִּקְרָ֗א אֶֽת נַעֲר/וֹ֙ מְשָׁ֣רְת֔/וֹ וַ/יֹּ֕אמֶר שִׁלְחוּ נָ֥א אֶת זֹ֛את מֵ/עָלַ֖/י הַ/ח֑וּצָ/ה וּ/נְעֹ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/017.yaml
  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: te
  text: అప్పుడు అతడు తన యువ పరిచారకుణ్ణి పిలిచి, “దయచేసి ఈమెను నా దగ్గరనుండి బయటికి పంపి, ఆమె వెళ్లిన తర్వాత తలుపుకు గడియ వేయి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తలుపుకు తాళం వేయి.” హీబ్రూ క్రియకు తలుపును గడియతో బిగించడం, అడ్డకడ్డీ వేయడం, లేదా తాళం వేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: తనకు సేవచేసే యువకుణ్ణి
  rationale: נַעַר లోని ‘యువకుడు’ అనే భావాన్నీ, מְשָׁרְתוֹ లోని వ్యక్తిగత సేవకుడనే వివరణాత్మక భావాన్నీ రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁלְחוּ נָא
  choice: దయచేసి ... పంపించి
  rationale: బహువచన రూపం గౌరవార్థక ఆజ్ఞగా సందర్భంలో ఒక సేవకునికే ఉద్దేశించబడింది; נָא లోని అభ్యర్థనాత్మక ఛాయను ‘దయచేసి’ తెలియజేస్తుంది.
- source_word: זֹאת
  choice: ఈమెను
  rationale: స్త్రీలింగ ఏకవచన సూచక సర్వనామాన్ని అదనంగా ‘స్త్రీ’ అనే నామవాచకం చేర్చకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సందర్భంలోని దూరీకరణతో కూడిన అవమానకర స్వరం నిలుస్తుంది.
- source_word: מֵעָלַי הַחוּצָה
  choice: నా దగ్గరనుండి బయటికి
  rationale: పదబద్ధమైన ‘నా మీదనుండి’ కంటే, అతని సన్నిధి నుండి బయటకు తొలగించాలనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וּנְעֹל הַדֶּלֶת אַחֲרֶיהָ
  choice: ఆమె వెనుక తలుపుకు గడియ వేయి
  rationale: נעל అనే క్రియలోని తలుపును గడియ/అడ్డకడ్డీతో బిగించే భావాన్ని ప్రాచీన గృహ సందర్భానికి తగిన ‘గడియ వేయి’తో అందిస్తుంది; אַחֲרֶיהָ ను సహజంగా ‘ఆమె వెనుక’గా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరమైన, సులభమైన శైలి. ‘ఈమెను’ అనేది మూలంలోని స్త్రీలింగ సూచకాన్ని నిలుపుతూ అమ్నోను చూపిన తిరస్కారపూరిత దూరీకరణను వ్యక్తం చేస్తుంది. సేవకుడు ఒక్కడే అయినందున తెలుగు వాక్యంలో సహజమైన ఏకవచన ఆజ్ఞ వాడబడింది.
