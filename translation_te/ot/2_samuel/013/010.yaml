id: 2SA.13.10
reference: 2 Samuel 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַמְנ֜וֹן אֶל תָּמָ֗ר הָבִ֤יאִי הַ/בִּרְיָה֙ הַ/חֶ֔דֶר וְ/אֶבְרֶ֖ה מִ/יָּדֵ֑/ךְ וַ/תִּקַּ֣ח תָּמָ֗ר אֶת הַ/לְּבִבוֹת֙ אֲשֶׁ֣ר עָשָׂ֔תָה וַ/תָּבֵ֛א לְ/אַמְנ֥וֹן אָחִ֖י/הָ הֶ/חָֽדְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: te
  text: అప్పుడు అమ్నోను తామారుతో, “ఆహారాన్ని లోపలి గదిలోకి[a] తీసుకురా, నేను నీ చేతినుండి తినేందుకు” అన్నాడు. తామారు తాను చేసిన పిండివంటలను తీసుకొని, వాటిని లోపలి గదిలోకి తన సహోదరుడైన అమ్నోను వద్దకు తీసుకువచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గదిలోకి.” హీబ్రూ חֶדֶר ఇంటి అంతర్భాగంలోని గదిని సూచించవచ్చు; ఇక్కడి ఏకాంత వాతావరణాన్ని తెలియజేయడానికి “లోపలి గది” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: తీసుకురా
  rationale: בוא క్రియ యొక్క హిఫీల్ స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. అమ్నోను ఉన్న చోటికి ఆహారాన్ని తీసుకురమ్మనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַבִּרְיָה
  choice: ఆహారాన్ని
  rationale: తినడానికి సిద్ధం చేసిన పదార్థాన్ని సూచించే విస్తృత పదం; తరువాత వచ్చే నిర్దిష్టమైన לְבִבוֹת పదంతో అనవసరంగా కలపదు.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: లోపలి గదిలోకి / లోపలి గదిలో
  rationale: חֶדֶר ఇంటి అంతర్భాగంలోని గదిని సూచిస్తుంది. రెండు చోట్ల ఒకే పదబంధాన్ని ఉపయోగించడం మూలపాఠంలోని పునరుక్తిని, ఏకాంత ప్రదేశ భావాన్ని నిలుపుతుంది; దిశార్థక ה కారణంగా ‘లోకి’ వాడబడింది.
- source_word: וְאֶבְרֶה
  choice: నేను ... తింటాను
  rationale: ברה ఇక్కడ ఆహారం తినడాన్ని సూచిస్తుంది. ఆజ్ఞ తరువాత వచ్చే ఉద్దేశ భావం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: מִיָּדֵךְ
  choice: నీ చేతిలోనుంచి
  rationale: హీబ్రూ ఏకవచన ‘నీ చేతి నుండి’ అనే సన్నిహితమైన, ఉద్దేశపూర్వక అభ్యర్థనను యథాశక్తి నేరుగా నిలుపుతుంది.
- source_word: הַלְּבִבוֹת
  choice: రొట్టెలను
  rationale: ముందరి సందర్భంలో తామారు ప్రత్యేకంగా తయారుచేసిన పిండివంటలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘రొట్టెలు’ సాధారణంగా అర్థమయ్యే సముచిత పదం; ఖచ్చితమైన రూపం మూలంలో స్పష్టంగా లేదు.
- source_word: אָחִיהָ
  choice: తన సహోదరుడు
  rationale: బంధుత్వాన్ని స్పష్టంగా నిలిపి, కథనంలోని నైతిక తీవ్రతను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. అమ్నోను అభ్యర్థనలోని ‘నీ చేతిలోనుంచి’ అనే హీబ్రూ ప్రయోగం ఉద్దేశపూర్వకంగా నిలుపబడింది. [a] గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
