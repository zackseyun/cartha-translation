translation:
  language: te
  text: కానీ అబ్షాలోము అతనిని గట్టిగా ఒత్తిడి చేశాడు[a]. కాబట్టి అతడు అమ్నోనును, రాజు కుమారులందరినీ అబ్షాలోముతో పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్షాలోము అతనిని పట్టుబట్టి కోరాడు’ / ‘అబ్షాలోము అతనిని ఒప్పించాడు.’ హీబ్రూ జాతీయ ప్రయోగం సాధారణ విన్నపం కంటే బలమైనది; అది పట్టుదలతో చేసిన ఒత్తిడిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: అతన్ని పట్టుబట్టి ఒత్తిడి చేశాడు
  rationale: ఇక్కడ פרץ + בְּ అనేది అక్షరార్థంగా ‘చొచ్చుకుపోవడం’ కాదు; దావీదు మొదట నిరాకరించిన తరువాత అబ్షాలోము పట్టుదలగా ఒత్తిడి చేసినట్లు తెలిపే జాతీయ ప్రయోగం. ‘పట్టుబట్టి ఒత్తిడి చేశాడు’ దాని బలాన్నీ నిరంతర విన్నపాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: సందర్భంలో దావీదు అభ్యర్థనకు అంగీకరించి తన కుమారులను అబ్షాలోముతో పంపుతున్నాడు; అందువల్ల ‘పంపించాడు’ సహజమైన సందర్భార్థం.
- source_word: אִתּוֹ
  choice: అతనితో
  rationale: హీబ్రూలో ఉన్న సర్వనామ రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది అబ్షాలోమును సూచిస్తుంది.
- source_word: אֶת אַמְנוֹן
  choice: అమ్నోనును
  rationale: నేర కర్మ విభక్తితో వ్యక్తినామాన్ని సహజమైన తెలుగులో అందించింది; את ప్రత్యేకంగా అనువదించబడదు.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులందరినీ
  rationale: రాజైన దావీదు కుమారులందరినీ సూచించే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
