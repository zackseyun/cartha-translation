source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: te
  text: అప్పుడు యోనాదాబు రాజుతో, “ఇదిగో, రాజు కుమారులు వచ్చారు; నీ సేవకుడు చెప్పినట్లే జరిగింది” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֽוֹנָדָב
  choice: యోనాదాబు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజుతో
  rationale: ఇది మానవ రాజైన దావీదును సూచిస్తుంది; తెలుగు సంభాషణా నిర్మాణంలో ‘రాజుతో ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షిస్తూ, ఎదురుగా జరుగుతున్న విషయాన్ని సూచించే హిబ్రూ అవ్యయపు తక్షణతను ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులు
  rationale: హిబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగులో ఇచ్చాం; సందర్భంలో బహువచనం ముఖ్యమైనది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: పూర్తయిన రాకను, ఇప్పుడు ప్రత్యక్షంగా నిర్ధారిస్తున్న సందర్భాన్ని తెలుగు భూతకాల రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: నీ సేవకుడు చెప్పినట్లే
  rationale: దర్బారు మర్యాదతో కూడిన స్వీయసూచన అయిన ‘నీ సేవకుడు’ను నిలిపి, דָּבָר నిర్మాణాన్ని సహజంగా ‘చెప్పినట్లే’ అని అనువదించాం.
- source_word: כֵּן הָיָה
  choice: జరిగింది
  rationale: యోనాదాబు ముందుగా చెప్పినది నిజమైందనే నిర్ధారణను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
