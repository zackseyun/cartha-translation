translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నీ సేవకుడు’ అనే రాజసభా మర్యాదాపూర్వక స్వీయసూచనను మూలానికి అనుగుణంగా నిలిపాం; ఈ వచనంలో ప్రచురణకు అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత పాదటిప్పణి లేదు.
