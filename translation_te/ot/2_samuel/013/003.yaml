source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: te
  text: అమ్నోనుకు ఒక స్నేహితుడు ఉండేవాడు. అతని పేరు యోనాదాబు; అతడు దావీదు సహోదరుడైన షిమ్యా కుమారుడు. యోనాదాబు ఎంతో తెలివిగలవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎంతో జ్ఞానవంతుడు,’ ‘ఎంతో చాకచక్యంగలవాడు.’ హీబ్రూ పదం విస్తృతంగా జ్ఞానం లేదా తెలివిని సూచించగలదు; తరువాతి కథనంలో అతని తెలివి నైతికంగా సందిగ్ధమైన రీతిలో కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: స్నేహితుడు
  rationale: ఈ నామవాచకం స్నేహితుడు, సహచరుడు లేదా సన్నిహితుడిని సూచించగలదు. కథలో అమ్నోనుతో యోనాదాబుకు ఉన్న సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘స్నేహితుడు’ సరిపోతుంది.
- source_word: וּלְאַמְנוֹן
  choice: అమ్నోనుకు ... ఉండేవాడు
  rationale: ‘అమ్నోనుకు’ అనే హీబ్రూ స్వామ్యప్రయోగాన్ని తెలుగులో సహజమైన ‘అమ్నోనుకు ఒక స్నేహితుడు ఉండేవాడు’గా వ్యక్తం చేశాం; మూలంలో ప్రత్యేక కాలసూచక పదం లేనందున అదనంగా ‘ఇప్పుడు’ చేర్చలేదు.
- source_word: וּשְׁמוֹ
  choice: అతని పేరు
  rationale: హీబ్రూ నామపరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ‘అతని పేరు యోనాదాబు’గా ఇచ్చాం.
- source_word: בֶּן שִׁמְעָה
  choice: షిమ్యా కుమారుడు
  rationale: సూటిగా ఉన్న వంశసంబంధ వ్యక్తీకరణ; పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲחִי דָוִד
  choice: దావీదు సహోదరుడైన
  rationale: ఈ నిర్మాణం షిమ్యాను దావీదు సహోదరునిగా గుర్తిస్తుంది. సంబంధం ఎవరికీ వర్తిస్తుందో స్పష్టంగా ఉండేలా వాక్యాన్ని అమర్చాం.
- source_word: אִישׁ חָכָם מְאֹד
  choice: ఎంతో తెలివిగలవాడు
  rationale: חָכָם సాధారణంగా జ్ఞానం లేదా నైపుణ్యాన్ని సూచించినా, తరువాతి కథనంలో యోనాదాబు తెలివి నైతికంగా సందిగ్ధమైన సలహాగా వ్యక్తమవుతుంది. ‘తెలివిగలవాడు’ అతని మేధస్సును తెలిపి, దానిని ముందుగానే సద్గుణంగా లేదా దుర్గుణంగా తీర్పు చేయదు.
theological_decisions:
- issue: חָכָם అనే పదానికి నైతిక విలువను ఎలా ప్రతిబింబించాలి
  choice: తెలివిగలవాడు
  alternative: జ్ఞానవంతుడు / కపటబుద్ధిగలవాడు
  rationale: మూలపదం విస్తృతార్థకమైంది. ‘జ్ఞానవంతుడు’ అనవసరమైన సానుకూల నైతిక ప్రశంసను, ‘కపటబుద్ధిగలవాడు’ ముందస్తు ప్రతికూల తీర్పును కలిగించవచ్చు. అందువల్ల కథనంలోని నైతిక ఉద్రిక్తతను నిలుపుతూ తటస్థమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. బంధుత్వ సంబంధం స్పష్టంగా ఉండేందుకు వాక్యాన్ని రెండు భాగాలుగా అమర్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
