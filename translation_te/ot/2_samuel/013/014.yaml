  yaml_path: translation/ot/2_samuel/013/014.yaml
  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: te
  text: కానీ అతడు ఆమె మాట వినడానికి ఇష్టపడలేదు[a]. అతడు ఆమెకంటే బలవంతుడు[b]; ఆమెను లైంగికంగా అవమానపరచి[c] ఆమెతో శయనించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆమె స్వరం వినడానికి ఇష్టపడలేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు ఆమెను బలంతో లొంగదీసుకున్నాడు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ క్రియకు ‘అవమానపరచడం’ లేదా ‘హింసించడం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది లైంగిక హింసను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: నిరాకరణతో వచ్చిన ఈ క్రియ కేవలం వినకపోవడాన్ని కాక, వినడానికి సుముఖత చూపకపోవడాన్ని సూచిస్తుంది.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: ఆమె మాట వినడానికి
  rationale: అక్షరార్థంగా ‘ఆమె స్వరం వినడం’; ఈ సందర్భంలో ఆమె విజ్ఞప్తిని ఆలకించి దానికి లోబడడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: అతడు ఆమెకంటే బలవంతుడు కావడంతో
  rationale: חזק అనే క్రియ מן‌తో కలిసి బలంలో మరొకరిని మించిపోవడం లేదా వారిపై పైచేయి సాధించడం అనే భావాన్ని ఇస్తుంది. తులనాత్మక భావాన్ని, తదుపరి చర్యకు దారితీసిన పరిస్థితిని ఈ రూపం నిలుపుతుంది.
- source_word: וַיְעַנֶּהָ
  choice: ఆమెను లైంగికంగా అవమానపరచి
  rationale: ענה అనే క్రియకు అవమానించడం, అణచివేయడం, హింసించడం అనే అర్థపరిధి ఉంది; ఇక్కడ బలవంతపు లైంగిక సందర్భం ఉన్నందున ‘లైంగికంగా’ అనే పదం హింస స్వభావాన్ని స్పష్టం చేస్తుంది, అలాగే మూలపదంలోని అవమానపరచడం అనే భావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: ఆమెతో శయనించాడు
  rationale: שׁכב ప్రత్యక్ష కర్మతో వచ్చినప్పుడు లైంగిక సంభోగాన్ని సూచించే హీబ్రూ ప్రయోగం. ‘శయనించాడు’ గంభీరమైన శైలిలో ఆ ప్రయోగాన్ని నిలుపుతుంది; సందర్భం అది పరస్పర సమ్మతితో జరిగినదనే అపార్థానికి తావివ్వదు.
