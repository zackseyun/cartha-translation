translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. లైంగిక హింసను అస్పష్టమైన సభ్యోక్తితో కప్పిపుచ్చకుండా ‘లైంగికంగా అవమానపరచి’ అని స్పష్టం చేయబడింది; అదే సమయంలో וַיְעַנֶּהָ మరియు וַיִּשְׁכַּב అనే రెండు వేర్వేరు హీబ్రూ క్రియల క్రమం నిలుపబడింది.
