id: 2SA.13.1
reference: 2 Samuel 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: te
  text: ఆ తరువాత[a], దావీదు కుమారుడైన అబ్షాలోముకు తామారు అనే అందమైన ఒక సహోదరి ఉండేది; దావీదు కుమారుడైన అమ్నోను ఆమెను ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెపై మోహపడ్డాడు” లేదా “ఆమెను కోరుకున్నాడు.” హీబ్రూ మూలంలో ఇక్కడ సాధారణంగా ‘ప్రేమించు’ అనే అర్థమిచ్చే క్రియ ఉంది; అయితే తరువాతి కథనం అమ్నోను ప్రేమ వికృతమైనదని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: కథనాన్ని ముందటి సంఘటనలతో కాలక్రమంగా అనుసంధానించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; וַיְהִי అనే కథనారంభ సూత్రాన్ని విడిగా కృత్రిమంగా అనువదించకుండా మొత్తం పదబంధపు భావాన్ని అందిస్తుంది.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: దావీదు కుమారుడైన అబ్షాలోముకు ... ఉండేది
  rationale: హీబ్రూలోని దత్తివాచక స్వామ్య నిర్మాణాన్ని తెలుగులో సహజమైన ‘అబ్షాలోముకు ... ఉండేది’ రూపంలో ఇచ్చి, ‘దావీదు కుమారుడు’ అనే వంశసంబంధ గుర్తింపును నిలిపింది.
- source_word: אָחוֹת יָפָה
  choice: అందమైన చెల్లెలు
  rationale: יָפָה శారీరక సౌందర్యాన్ని సూచిస్తుంది. కథలో అబ్షాలోము, తామారు ఒకే తల్లికి పుట్టినవారని తరువాత స్పష్టమవుతుంది; తెలుగు బంధుత్వ వాడుకలో స్త్రీ సహోదరిని సహజంగా ‘చెల్లెలు’ అని పేర్కొనడం సందర్భోచితం.
- source_word: וּשְׁמָהּ תָּמָר
  choice: తామారు అనే
  rationale: ‘ఆమె పేరు తామారు’ అనే నామకరణ వాక్యాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיֶּאֱהָבֶהָ
  choice: ఆమెను ప్రేమించాడు
  rationale: אהב సాధారణంగా ‘ప్రేమించు’ అనే క్రియ. తరువాతి కథనం అమ్నోను భావం వికృతమైనదని చూపించినా, ఈ వచనంలో ఉన్న సాధారణ పదాన్ని అలాగే ఉంచడం సాహిత్య, నైతిక ఉద్వేగాన్ని కాపాడుతుంది.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: దావీదు కుమారుడైన అమ్నోను
  rationale: రాజకుటుంబ సంబంధాలపై వచనం ఉంచిన దృష్టిని కాపాడేందుకు పునరుక్తమైన ‘దావీదు కుమారుడు’ గుర్తింపును తొలగించలేదు.
theological_decisions:
- issue: నైతికంగా భారమైన కథనంలో אהב క్రియను ఎలా అనువదించాలి
  choice: ప్రేమించాడు
  alternative: ఆమెను కోరుకున్నాడు / ఆమెపై మోహపడ్డాడు
  rationale: మూలవచనం సాధారణ ‘ప్రేమించు’ క్రియనే వాడుతుంది. తరువాతి హింసాత్మక పరిణామాల ఆధారంగా ఈ వచనంలోనే దాని అర్థాన్ని ముందుగానే ప్రతికూలంగా నిర్ధారించకుండా, మూలంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన కథనశైలి. రాజవంశ సంబంధాల పునరుక్తిని, మూలంలోని నైతిక ఉద్వేగాన్ని నిలిపింది. పాదసూచిక గుర్తును ప్రధాన పాఠ్యంలో [a]గా చేర్చాం.
