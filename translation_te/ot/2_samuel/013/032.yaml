source:
  edition: WLC
  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: te
  text: 'దావీదు సోదరుడైన షిమ్యా కుమారుడు యోనాదాబు ఇలా జవాబిచ్చాడు: “నా ప్రభువు, ‘రాజు కుమారులైన యువకులందరినీ వారు చంపేశారు’ అని అనకూడదు. అమ్నోను ఒక్కడే చనిపోయాడు. అబ్షాలోము సోదరి తామారుపై అమ్నోను అత్యాచారం చేసిన[b] రోజు నుంచే ఇది అబ్షాలోము మాట ప్రకారం స్థిరపరచబడింది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అబ్షాలోము ఆజ్ఞ ప్రకారం ఇది స్థిరపరచబడింది.” హీబ్రూ పదబంధం అబ్షాలోము మాట, ఆజ్ఞ లేదా స్థిర సంకల్పానికి అనుగుణంగా ఈ నిర్ణయం ఏర్పడిందని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు “అవమానపరచడం” లేదా “హీనపరచడం” అనే అర్థాలు కూడా ఉన్నాయి; ఈ సందర్భంలో అది తామారుపై చేసిన అత్యాచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలోని జవాబు-మాట్లాడు అనే జంట క్రియలను సహజమైన ఆధునిక తెలుగు కథనశైలిలో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: אֲחִי דָוִד
  choice: దావీదు సోదరుడైన
  rationale: షిమ్యా దావీదు సోదరుడని స్పష్టంగా తెలియజేస్తూ హీబ్రూ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: నా ప్రభువు ... అని అనుకోవద్దు
  rationale: నిషేధార్థక భావాన్నీ రాజును ఉద్దేశించిన గౌరవపూర్వక సంబోధననూ సహజమైన తెలుగులో అందిస్తుంది; ఇక్కడ ‘చెప్పవద్దు’ కంటే ‘అనుకోవద్దు’ వచ్చిన వార్తను నిజమని స్వీకరించవద్దనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులైన యువకులందరినీ
  rationale: נְעָרִים కు ‘యువకులు’ అనే సాధారణ అర్థాన్ని తీసుకుని, వారు రాజు కుమారులని తెలిపే సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הֵמִיתוּ
  choice: వారు చంపేశారు
  rationale: హిఫీల్ క్రియలోని ‘చంపడం/మరణానికి గురిచేయడం’ భావాన్నీ బహువచన కర్తనూ నిలుపుతుంది.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: అమ్నోను ఒక్కడే చనిపోయాడు
  rationale: לְבַדּוֹ లోని ప్రత్యేకతను ‘ఒక్కడే’తో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל פִּי אַבְשָׁלוֹם ... שׂוּמָה
  choice: అబ్షాలోము మాట ప్రకారం నిర్ణయించబడి ఉంది
  rationale: עַל־פִּי లోని ‘మాట/ఆజ్ఞ ప్రకారం’ అనే రూపకాన్ని పూర్తిగా తొలగించకుండా, שׂוּמָה లోని స్థిరపరచబడిన నిర్ణయ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִיּוֹם עַנֹּתוֹ אֵת תָּמָר
  choice: తామారుపై అమ్నోను అత్యాచారం చేసిన రోజు నుంచే
  rationale: ענה పియేల్‌కు విస్తృతంగా ‘అవమానపరచడం/హింసించడం’ అనే భావం ఉన్నా, ఈ కథన సందర్భంలో అది బలవంతపు లైంగిక దాడిని సూచిస్తుంది. ఆధునిక పాఠకుడికి నేర స్వభావం అస్పష్టంగా కాకుండా ‘అత్యాచారం’ అని ఇచ్చి, పదార్థ పరిధిని పాదసూచికలో నిలిపాం.
- source_word: אֲחֹתוֹ
  choice: అబ్షాలోము సోదరి
  rationale: హీబ్రూ ప్రత్యయంలోని సూచిత సంబంధాన్ని సందర్భం ఆధారంగా స్పష్టం చేస్తుంది; వరుసగా వచ్చే పురుష సూచనల వల్ల తెలుగులో కలగగల అయోమయాన్ని నివారిస్తుంది.
theological_decisions:
- issue: అబ్షాలోము పాత్ర—ఆజ్ఞా, మాటా, లేక స్థిర సంకల్పమా
  choice: అబ్షాలోము మాట ప్రకారం నిర్ణయించబడి ఉంది
  alternative: అబ్షాలోము ఆజ్ఞ ప్రకారం నిర్ణయించబడి ఉంది; అబ్షాలోము నిర్ణయించాడు
  rationale: עַל־פִּי అనే పదబంధం మాట లేదా ఆజ్ఞను సూచించగలదు; שׂוּמָה స్థిర నిర్ణయాన్ని తెలియజేస్తుంది. ‘ఆజ్ఞ’ అని మాత్రమే తేల్చకుండా మూలంలోని భావ పరిధిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. రాజసభ సంబోధనకు ‘నా ప్రభువు’ను నిలిపాం. లైంగిక హింసను పాతబడిన లేదా అస్పష్టమైన సభ్యోక్తితో కప్పిపుచ్చకుండా ‘అత్యాచారం’ అని స్పష్టంగా చెప్పాం. [a], [b] గుర్తులు రెండూ ప్రధాన వచనంలో సంబంధిత పదబంధాల వెంట ఉన్నాయి.
