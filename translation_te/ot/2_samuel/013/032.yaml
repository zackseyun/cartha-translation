revisions:
- from: 'దావీదు సోదరుడైన షిమ్యా కుమారుడు యోనాదాబు ఇలా జవాబిచ్చాడు: “నా ప్రభువు, ‘రాజు కుమారులైన యువకులందరినీ వారు చంపేశారు’ అని అనుకోవద్దు. అమ్నోను ఒక్కడే చనిపోయాడు. అబ్షాలోము సోదరి తామారుపై అమ్నోను అత్యాచారం చేసిన[b] రోజు నుంచే ఇది అబ్షాలోము మాట ప్రకారం నిర్ణయించబడి ఉంది[a].”'
  to: 'దావీదు సోదరుడైన షిమ్యా కుమారుడు యోనాదాబు ఇలా జవాబిచ్చాడు: “నా ప్రభువు, ‘రాజు కుమారులైన యువకులందరినీ వారు చంపేశారు’ అని అనకూడదు. అమ్నోను ఒక్కడే చనిపోయాడు. అబ్షాలోము సోదరి తామారుపై అమ్నోను అత్యాచారం చేసిన[b] రోజు నుంచే ఇది అబ్షాలోము మాట ప్రకారం స్థిరపరచబడింది[a].”'
  rationale: సవరణలు అర్థాన్ని మార్చవు. మొదటిది హీబ్రూ ‘చెప్పడం’ అనే క్రియను తెలుగులో నేరుగా నిలుపుతుంది. రెండవది అబ్షాలోము యొక్క ప్రణాళిక ఆ రోజు నుంచే స్థిరపడిందనే గతకాల భావాన్ని స్పష్టపరుస్తుంది. పాదసూచిక గుర్తులు [b] అత్యాచారం పదం వద్ద, [a] అబ్షాలోము మాట ప్రకారం అనే పదబంధం వద్ద యథాస్థానంగా ఉన్నాయి.
