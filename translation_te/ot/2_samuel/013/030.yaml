  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమాచారం ఇంకా నిర్ధారించబడని స్వభావాన్ని పాదసూచికలో నిలిపి, ప్రధాన వాక్యాన్ని స్పష్టంగా ఉంచింది.
