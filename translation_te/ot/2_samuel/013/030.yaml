  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: te
  text: 'వారు దారిలో ఉండగానే, దావీదుకు ఒక వార్త[a] చేరింది: “అబ్షాలోము రాజు కుమారులందరినీ హతమార్చాడు; వారిలో ఒక్కరూ మిగలలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక సమాచారం”; హీబ్రూ పదం నిర్ధారణ కాని సమాచారం లేదా వదంతి అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: వారు దారిలో ఉండగానే
  rationale: హీబ్రూ కథన సూత్రంలోని సందర్భార్థక కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַשְּׁמֻעָה
  choice: ఒక సమాచారం
  rationale: ఈ పదానికి సమాచారం, వార్త, వదంతి అనే అర్థపరిధి ఉంది. తరువాతి వచనాల్లో నిజానిజాలు స్పష్టమయ్యే ముందు దావీదుకు చేరిన నిర్ధారణ కాని సమాచారమనే భావాన్ని ఇది అతిగా నిర్ణయించకుండా నిలుపుతుంది.
- source_word: בָאָה אֶל דָּוִד
  choice: దావీదుకు ... అందింది
  rationale: ‘దావీదు దగ్గరకు వచ్చింది’ అనే మూలభావానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: לֵאמֹר
  choice: 'అందింది:'
  rationale: హీబ్రూ ఉద్ధరణ పరిచయాన్ని తెలుగులో సహజంగా ద్విబిందువుతో ప్రత్యక్ష వాక్యానికి అనుసంధానిస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: נכה అంటే కొట్టడం లేదా కూలదోయడం; ఈ ప్రాణాంతక సందర్భంలో ‘హతమార్చాడు’ ఆరోపణలోని మరణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులందరినీ
  rationale: లింగనిర్దిష్టమైన ‘కుమారులు’ అనే అర్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: వారిలో ఒక్కడు కూడా మిగలలేదు
  rationale: יתר నిఫల్ రూపంలోని ‘మిగిలి ఉండడం’ భావాన్ని బలమైన సహజ తెలుగు నిరాకరణతో వ్యక్తపరుస్తుంది.
