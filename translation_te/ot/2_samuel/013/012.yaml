  verdict: revise
  source_fidelity: The direct prohibitions and the moral force of נְבָלָה are substantially represented. However, the Hebrew impersonal Niphal, לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל, says that such a thing is not done in Israel—an appeal to Israel's accepted moral practice. The draft's ‘చేయకూడదు’ shifts this to an explicit prescriptive command. ‘ఇశ్రాయేలులో ఇలాంటిది చేయరు’ is natural modern Telugu and preserves the source construction more closely.
  naturalness: The dialogue is clear and urgent. ‘ఇశ్రాయేలులో ఇలాంటిది చేయరు’ is idiomatic modern standard Telugu. ‘హేయమైన పని’ more naturally conveys a morally abhorrent act than ‘నీచమైన పని,’ which can more readily describe a lowly or contemptible person.
  terminology: ‘నన్ను అవమానపరచకు’ can retain the Hebrew verb’s humiliation/violation range in this immediate sexual context; the footnote appropriately identifies the possible explicit rendering ‘నన్ను బలాత్కరించకు.’ The revised final term ‘హేయమైన పని’ conveys נְבָלָה as moral outrage rather than mere foolishness.
  issues:
  - severity: medium
    issue: ‘ఇలాంటిది ఇశ్రాయేలులో చేయకూడదు’ makes the source statement explicitly prescriptive.
    rationale: The Hebrew is an impersonal passive/customary statement, ‘such a thing is not done in Israel.’ A customary impersonal Telugu expression preserves both form and discourse force without unnecessarily narrowing it to a direct rule.
  - severity: low
    issue: ‘నీచమైన పని’ is less precise for נְבָלָה.
    rationale: The term denotes a scandalously immoral, disgraceful act. ‘హేయమైన పని’ more directly conveys this ethical abhorrence in contemporary Telugu.
