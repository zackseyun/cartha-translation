  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: te
  text: ఆమె అతనితో, “వద్దు, నా అన్నా! నన్ను అవమానపరచకు[a]. ఇశ్రాయేలులో ఇలాంటిది చేయరు. ఈ హేయమైన పని చేయకు[b]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను బలాత్కరించకు,” “నన్ను కించపరచకు.” ఇక్కడి హీబ్రూ క్రియ లైంగిక హింసనూ, దానివల్ల కలిగే అవమానాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ నీచమైన పని చేయకు.” ఇక్కడి హీబ్రూ పదం కేవలం తెలివితక్కువ పనిని కాక, నైతికంగా ఘోరమైన కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: ఆమె అతనితో ... అంది
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אַל אָחִי
  choice: వద్దు, నా అన్నా!
  rationale: మొదటి אַל లోని అత్యవసర నిరాకరణను ‘వద్దు’ తెలియజేస్తుంది; బంధుత్వ సంబోధన సంఘటనలోని ఘోరతకు కీలకం కాబట్టి నిలుపబడింది.
- source_word: תְּעַנֵּנִי
  choice: నన్ను అవమానపరచకు
  rationale: Piel రూపంలోని ענה లైంగిక హింసతోపాటు అవమానం, అణచివేత భావాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో ‘అవమానపరచకు’ ఆ విస్తృతిని కాపాడుతుంది; సందర్భానుసారమైన స్పష్టతను పాదసూచిక ఇస్తుంది.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: ఇలాంటిది ఇశ్రాయేలులో చేయకూడదు
  rationale: עשה యొక్క అవ్యక్త Niphal నిర్మాణం సమాజంలో అంగీకరించరాని నైతిక నిషేధాన్ని సూచిస్తుంది; తెలుగులో ‘చేయకూడదు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: ఈ నీచమైన పని
  rationale: נְבָלָה సాధారణ మూర్ఖత్వం కాక, సామాజిక-నైతిక క్రమాన్ని ఉల్లంఘించే హేయమైన కార్యాన్ని సూచిస్తుంది; ‘నీచమైన పని’ ఆధునిక తెలుగులో దాని నైతిక తీవ్రతను తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలులో చేయరాని కార్యం అనే వాక్యపు స్వరూపం
  choice: సమాజ నైతిక నిషేధంగా ‘చేయకూడదు’
  alternative: వాడుకను మాత్రమే తెలిపే ‘చేయబడదు’
  rationale: అవ్యక్త క్రియారూపం రెండింటికీ వీలున్నప్పటికీ, సందర్భంలోని వేడుకోలు మరియు נְבָלָה అనే నైతిక పదం దీన్ని కేవలం ఆచార వివరణగా కాక గట్టి నైతిక నిషేధంగా చూపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. తామారు పలికిన అత్యవసరతను చిన్న, నేరుగా ఉన్న నిషేధ వాక్యాలతో నిలిపాం. ‘అన్నా’ అనే సంబోధనను కుటుంబ సంబంధం మరియు దాని వల్ల పెరిగే నైతిక ఘోరత స్పష్టంగా ఉండేలా ఉంచాం.
