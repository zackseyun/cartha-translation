translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యారంభంలోని సాధారణ సంధిని అనవసర కాలసూచక పదంగా మార్చలేదు. వస్త్రానికి సంబంధించిన నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలో నిలిపాం.
