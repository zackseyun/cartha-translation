id: 2SA.13.18
reference: 2 Samuel 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָלֶ֨י/הָ֙ כְּתֹ֣נֶת פַּסִּ֔ים כִּי֩ כֵ֨ן תִּלְבַּ֧שְׁןָ בְנוֹת הַ/מֶּ֛לֶךְ הַ/בְּתוּלֹ֖ת מְעִילִ֑ים וַ/יֹּצֵ֨א אוֹתָ֤/הּ מְשָֽׁרְת/וֹ֙ הַ/ח֔וּץ וְ/נָעַ֥ל הַ/דֶּ֖לֶת אַחֲרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: te
  text: ఆమె ఒక విశిష్టమైన అంగీని[a] ధరించి ఉంది; కన్యలైన రాజకుమార్తెలు ఇలాంటి వస్త్రాలనే ధరించేవారు. అతని పరిచారకుడు ఆమెను బయటికి పంపి, ఆమె వెనుక తలుపుకు గడియ వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంపన్నంగా అలంకరించిన అంగీ,” “అనేక రంగుల అంగీ,” లేదా “పొడవాటి చేతులున్న అంగీ”; ఈ వస్త్రపదం యొక్క కచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: అలంకారంతో నేసిన పొడవాటి అంగీ
  rationale: ఇది ప్రత్యేకమైన అంగీని సూచిస్తుంది; פַּסִּים అనే పదం దాని అలంకారం, రంగులు, పొడవు లేదా పొడవాటి చేతులను సూచిస్తుందా అనేది అనిశ్చితం. ప్రధాన పాఠంలో గౌరవప్రదమైన ప్రత్యేక వస్త్రమనే భావాన్ని సహజంగా తెలిపి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת מְעִילִים
  choice: కన్యలైన రాజకుమార్తెలు అలాంటి వస్త్రాలే ధరించేవారు
  rationale: ఈ నిర్మాణం రాజు కన్య కుమార్తెల సాధారణ వస్త్రధారణను వివరిస్తుంది. 'కన్యలైన రాజకుమార్తెలు' రాజవంశ సంబంధాన్నీ కన్యత్వాన్నీ స్పష్టంగా నిలుపుతుంది; 'ధరించేవారు' అలవాటైన ఆచారాన్ని తెలియజేస్తుంది.
- source_word: מְשָׁרְתוֹ
  choice: అతని పరిచారకుడు
  rationale: సందర్భంలో అమ్నోనుకు వ్యక్తిగతంగా సేవచేసే సహాయకుడిని సూచిస్తుంది; 'పరిచారకుడు' ఆధునిక తెలుగులో సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: ఆమెను బయటికి పంపి
  rationale: హిఫీల్ క్రియ ఆమెను బయటికి వెళ్లేలా చేయడాన్ని సూచిస్తుంది. 'బయటికి పంపి' చర్యలోని కఠినత్వాన్ని తగ్గించకుండా, మూలంలో స్పష్టంగా లేని అదనపు హింసను చేర్చదు.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: ఆమె వెనుక తలుపుకు గడియ వేశాడు
  rationale: נעל తలుపును తాళం వేయడం లేదా గడియ పెట్టడాన్ని సూచిస్తుంది. ప్రాచీన గృహసందర్భంలో 'గడియ వేశాడు' చర్య యొక్క ఉద్దేశపూర్వక ముగింపును సహజంగా తెలియజేస్తుంది.
