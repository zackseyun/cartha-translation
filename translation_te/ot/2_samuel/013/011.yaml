  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: te
  text: ఆమె అతడు తినడానికి దానిని అతని దగ్గరకు తీసుకువచ్చినప్పుడు[a], అతడు ఆమెను గట్టిగా పట్టుకొని, “నా సహోదరీ, రా, నాతో శయనించు” అని ఆమెతో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె అతడు తినడానికి అతని దగ్గరకు వచ్చినప్పుడు”; ఇక్కడి హీబ్రూ క్రియకు ఆమె దగ్గరకు వచ్చిందని గానీ, ఆహారాన్ని అతని దగ్గరకు తీసుకువచ్చిందని గానీ అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: దానిని అతని దగ్గరకు తీసుకువచ్చినప్పుడు
  rationale: נגשׁ రూపానికి ‘దగ్గరకు రావడం’ లేదా ‘దగ్గరకు తీసుకురావడం’ అనే రెండు అర్థాలు సాధ్యమే. తామారు ఆహారం వడ్డిస్తున్న సందర్భంలో వస్తువును దగ్గరకు తీసుకురావడం ప్రధాన పాఠ్యంగా సహజం; మరో సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: దిశను సూచించే పూర్వప్రత్యయార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֶאֱכֹל
  choice: అతడు తినడానికి
  rationale: ఉద్దేశాన్ని తెలిపే infinitive construct. హీబ్రూలో కర్త అంతర్భావంగా ఉన్నా, తెలుగులో అర్థస్పష్టత కోసం ‘అతడు’ చేర్చడం సహజం.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: అతడు ఆమెను గట్టిగా పట్టుకొని
  rationale: חזק + ב బలంగా పట్టుకోవడాన్ని సూచిస్తుంది. ‘గట్టిగా పట్టుకొని’ బలవంతపు చర్యను స్పష్టంగా తెలియజేస్తూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיֹּאמֶר לָהּ
  choice: అని ఆమెతో అన్నాడు
  rationale: ప్రామాణిక సంభాషణ సూత్రాన్ని సహజ తెలుగు వాక్యక్రమంలో ఉంచింది.
- source_word: בּוֹאִי
  choice: రా
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁכְבִי עִמִּי
  choice: నాతో శయనించు
  rationale: శృంగార సంబంధాన్ని సూచించే హీబ్రూ నుడికారాన్ని అస్పష్టం చేయకుండా, సంఘటన తీవ్రతకు తగిన గంభీరమైన భాషలో అందిస్తుంది.
- source_word: אֲחוֹתִי
  choice: నా సహోదరీ
  rationale: బంధుత్వ సంబోధనను స్పష్టంగా నిలుపుతుంది; కథనంలోని నైతిక భయంకరతకు ఈ సంబంధం కేంద్రబిందువు.
theological_decisions:
- issue: లైంగిక ఆజ్ఞను మృదువైన సభ్యోక్తితో కప్పిపుచ్చకుండా అనువదించడం
  choice: నాతో శయనించు
  alternative: నాతో పడుకో
  rationale: హీబ్రూ పదబంధం లైంగిక నుడికారం. ‘శయనించు’ దాని అర్థాన్ని నిలుపుతూ, అతిగా వ్యావహారికంగా మారకుండా సంఘటన గంభీరతను కాపాడుతుంది.
- issue: బంధుత్వ సంబోధనను నిలుపడం
  choice: నా సహోదరీ
  alternative: నా చెల్లెలా
  rationale: హీబ్రూ אֲחוֹתִי వయోక్రమాన్ని నిర్దిష్టంగా చెప్పదు. ‘సహోదరీ’ ఆ అనిశ్చితిని కాపాడుతూ, కుటుంబ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. బలవంతపు చర్యను మృదువుగా చేయలేదు. ‘సహోదరీ’ ద్వారా హీబ్రూలో లేని అక్క/చెల్లెలు వయోభేదాన్ని చేర్చకుండా నివారించాం.
