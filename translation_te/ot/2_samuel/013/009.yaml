source:
  edition: WLC
  text: וַ/תִּקַּ֤ח אֶת הַ/מַּשְׂרֵת֙ וַ/תִּצֹ֣ק לְ/פָנָ֔י/ו וַ/יְמָאֵ֖ן לֶ/אֱכ֑וֹל וַ/יֹּ֣אמֶר אַמְנ֗וֹן הוֹצִ֤יאוּ כָל אִישׁ֙ מֵֽ/עָלַ֔/י וַ/יֵּצְא֥וּ כָל אִ֖ישׁ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: te
  text: అప్పుడు ఆమె ఆ పెనాన్ని తీసుకొని, అతని ముందు వాటిని వడ్డించింది[a]. కాని అతడు తినడానికి నిరాకరించాడు. అప్పుడు అమ్నోను, “అందరినీ నా దగ్గర నుండి బయటకు పంపండి” అని చెప్పాడు. కాబట్టి అందరూ అతని దగ్గర నుండి బయటకు వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని ముందు వాటిని పోసింది”; ఇక్కడ ఆహారాన్ని పాత్రనుండి తీసి అతని ముందు వడ్డించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: పెనాన్ని
  rationale: ఈ సందర్భంలో మַשְׂרֵת వండిన ఆహారాన్ని తీసుకువచ్చి వడ్డించే పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పెనం’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: וַתִּצֹק לְפָנָיו
  choice: అతని ముందు వాటిని వడ్డించింది
  rationale: יצק అక్షరార్థంగా ‘పోసింది’ అయినప్పటికీ, ఇక్కడ తయారుచేసిన ఆహారాన్ని పాత్రనుండి అతని ముందు పెట్టడాన్ని సూచిస్తుంది. ‘వడ్డించింది’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיְמָאֵן לֶאֱכֹל
  choice: అతడు తినడానికి నిరాకరించాడు
  rationale: מָאֵן కేవలం తినాలనిపించకపోవడాన్ని కాక, ఉద్దేశపూర్వకంగా తిరస్కరించడాన్ని వ్యక్తం చేస్తుంది.
- source_word: הוֹצִיאוּ
  choice: బయటకు పంపండి
  rationale: יצא హిఫిల్ ఆజ్ఞారూపం ఇతరులను బయటకు వెళ్లేలా చేయమనే కారణార్థాన్ని కలిగి ఉంది.
- source_word: כָל אִישׁ
  choice: అందరినీ / అందరూ
  rationale: అక్షరార్థం ‘ప్రతి పురుషుడు’; ఈ సందర్భంలో అక్కడున్న వారందరినీ సమష్టిగా సూచిస్తుంది. తెలుగు కథనంలో ‘అందరూ’ సహజం.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: నా దగ్గర నుండి / అతని దగ్గర నుండి
  rationale: అక్షరార్థంగా ‘నా/అతని మీద నుండి’ అనే ఈ హీబ్రూ ప్రయోగం సందర్భంలో ‘నా/అతని సమక్షం నుండి, దగ్గర నుండి’ అనే అర్థం ఇస్తుంది; ఆజ్ఞలోనూ కథనంలోనూ ఉన్న సమాంతరతను నిలిపాం.
