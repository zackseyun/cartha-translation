  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యంలోని ఆజ్ఞ–నెరవేర్పు సమాంతరతను ‘నా దగ్గర నుండి / అతని దగ్గర నుండి’ అనే రూపాలతో నిలిపాం.
