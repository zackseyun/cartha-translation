  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: te
  text: అయితే రాజు అబ్షాలోముతో, “అలా కాదు, నా కుమారుడా; మేమందరం వెళ్లకుందాం. మేము నీకు భారంగా ఉండకూడదు” అన్నాడు. అబ్షాలోము అతనిని బలంగా కోరాడు, అయినా రాజు వెళ్లడానికి ఒప్పుకోలేదు; అప్పుడు అతనిని దీవించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא נֵלֵךְ כֻּלָּנוּ
  choice: మేమంతా వచ్చి... దయచేసి మమ్మల్ని రానివ్వకు
  rationale: హీబ్రూలోని మర్యాదపూర్వక నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘మేమంతా వెళ్లకుందాం’ అనే భావాన్ని సందర్భానుసారంగా ‘రానివ్వకు’ అని అందించింది.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: నీకు భారంగా ఉండకూడదు
  rationale: నిఫ్అల్ రూపంలోని ‘భారంగా/బరువుగా ఉండడం’ అనే భావాన్ని నేరుగా, సహజంగా నిలుపుకుంది.
- source_word: וַיִּפְרָץ בּוֹ
  choice: అబ్షాలోము ఎంతగా ఒత్తిడి చేసినా
  rationale: ఈ సందర్భంలో క్రియకు ‘పట్టుబట్టి కోరడం, బలంగా ఒత్తిడి చేయడం’ అనే భావం ఉంది; ప్రయత్నం కొనసాగినప్పటికీ ఫలించలేదనే నిర్మాణాన్ని తెలుగులో సహజంగా తెలిపింది.
- source_word: וַיְבָרֲכֵהוּ
  choice: అతన్ని ఆశీర్వదించాడు
  rationale: కర్త రాజు, కర్మ అబ్షాలోము అని సందర్భం స్పష్టం చేస్తుంది; హీబ్రూ క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుకుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా కథనానికి తగిన గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. అసలు వాక్యంలోని కర్తల మార్పు తెలుగులో అస్పష్టంగా కాకుండా ‘అబ్షాలోము’, ‘రాజు’ అని పునరుద్ఘాటించబడింది.
