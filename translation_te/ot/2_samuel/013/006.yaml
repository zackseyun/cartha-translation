  text: וַ/יִּשְׁכַּ֥ב אַמְנ֖וֹן וַ/יִּתְחָ֑ל וַ/יָּבֹ֨א הַ/מֶּ֜לֶךְ לִ/רְאֹת֗/וֹ וַ/יֹּ֨אמֶר אַמְנ֤וֹן אֶל הַ/מֶּ֨לֶךְ֙ תָּֽבוֹא נָ֞א תָּמָ֣ר אֲחֹתִ֗/י וּ/תְלַבֵּ֤ב לְ/עֵינַ/י֙ שְׁתֵּ֣י לְבִב֔וֹת וְ/אֶבְרֶ֖ה מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: te
  text: అమ్నోను పడుకొని, జబ్బుపడినట్టు నటించాడు. రాజు అతణ్ణి చూడడానికి వచ్చినప్పుడు అమ్నోను రాజుతో, “దయచేసి నా సోదరి తామారు వచ్చి, నా కళ్ల ముందే రెండు పిండివంటలు[a] చేసి, ఆమె చేతినుండి నేను తినడానికి అనుమతించండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రెండు కేకులు,” లేదా “రెండు పేస్ట్రీలు.” ఇక్కడి హీబ్రూ పదం సూచించే వంటకం ఖచ్చితంగా ఏమిటో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: పడుకొని
  rationale: అమ్నోను తన మోసంలో భాగంగా మంచం పట్టిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּתְחָל
  choice: జబ్బుపడినట్టు నటించాడు
  rationale: హిత్పయేల్ రూపం ఇక్కడ నిజంగా జబ్బుపడటాన్ని కాక అనారోగ్యాన్ని నటించడాన్ని సూచిస్తుంది.
- source_word: לִרְאֹתוֹ
  choice: అతణ్ణి చూడడానికి
  rationale: ‘అతణ్ణి చూడడానికి’ అనేది హీబ్రూ పదబంధానికి నేరుగా సరిపోతూ, సందర్భంలోని పరామర్శ భావాన్ని కూడా సహజంగా మోస్తుంది.
- source_word: תָּבוֹא נָא
  choice: దయచేసి ... వచ్చి ... చేయండి
  rationale: נָא కలిగిన అభ్యర్థన ధోరణిని రాజుకు చేసిన మర్యాదపూర్వక విన్నపంగా సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: תָּמָר אֲחֹתִי
  choice: నా సోదరి తామారు
  rationale: ఆధునిక తెలుగులో సహజమైన బంధుత్వ-పేరు క్రమాన్ని ఉపయోగిస్తుంది.
- source_word: וּתְלַבֵּב
  choice: చేసి
  rationale: అరుదైన వంటక్రియ యొక్క ఖచ్చిత స్వభావం అనిశ్చితమైనందున సాధారణమైన ‘చేసి’ అనేది అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: לְעֵינַי
  choice: నా కళ్ల ముందే
  rationale: తామారు తన సమక్షంలోనే వంట చేయాలన్న అమ్నోను అభ్యర్థనలోని దృశ్య స్పష్టతను నిలుపుతుంది.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: రెండు పిండివంటలు
  rationale: לְבִבוֹת సూచించే ఆహార పదార్థం ఖచ్చితంగా ఏమిటో తెలియదు; ‘పిండివంటలు’ ఆకారాన్ని లేదా నిర్దిష్ట వంటకాన్ని అనవసరంగా నిర్ణయించకుండా విస్తృత అర్థాన్ని ఇస్తుంది.
- source_word: וְאֶבְרֶה
  choice: నేను తినేలా
  rationale: అనారోగ్యుడిగా ఆహారం తీసుకోవడం అనే సందర్భార్థాన్ని స్పష్టమైన సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִיָּדָהּ
  choice: ఆమె చేతి నుంచి
  rationale: హీబ్రూలోని ఏకవచన ‘చేతి నుంచి’ అనే వ్యక్తిగతంగా వడ్డించే భావాన్ని యథాతథంగా నిలుపుతుంది.
