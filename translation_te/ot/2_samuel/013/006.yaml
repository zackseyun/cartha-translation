translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ఆహార పదార్థం ఆకారాన్ని ‘గుండె ఆకారం’గా నిర్ణయించకుండా మూలంలోని అనిశ్చితి నిలుపబడింది; పాదసూచిక గుర్తు సంబంధిత పదమైన ‘పిండివంటలు’ తర్వాత ఉంచబడింది.
