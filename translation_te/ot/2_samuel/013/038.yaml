  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: te
  text: అయితే అబ్షాలోము పారిపోయి గెషూరుకు వెళ్లాడు[a]; అతడు అక్కడ మూడు సంవత్సరాలు ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు అబ్షాలోము పారిపోయి గెషూరుకు వెళ్లాడు.” హీబ్రూ సంధిని సందర్భానుసారంగా “అయితే” అని గానీ, “మరియు” అని గానీ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “అతడు అక్కడ మూడు సంవత్సరాలు ఉన్నాడు”; లేదా, “అతడు అక్కడ మూడు సంవత్సరాలు నివసించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: అయితే అబ్షాలోము
  rationale: వావ్ సంధి కథనాన్ని కొనసాగించడంతో పాటు మునుపటి సందర్భానికి స్వల్ప వ్యత్యాసాన్ని కూడా సూచించగలదు. అందువల్ల సహజమైన తెలుగు కథనంలో ‘అయితే’ ఎంచుకోబడింది; ‘అబ్షాలోము’ వ్యక్తి పేరుకు స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בָּרַח
  choice: పారిపోయి
  rationale: బరఖ్ అనే క్రియ ప్రమాదం లేదా శిక్ష నుంచి తప్పించుకొని వెళ్లడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘పారిపోయి’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: וַ/יֵּלֶךְ
  choice: వెళ్లాడు
  rationale: హాలఖ్ క్రియ ఇక్కడ వరుస కథన చర్యగా ‘వెళ్లాడు’ అనే సూటి అర్థాన్ని ఇస్తుంది.
- source_word: גְּשׁוּר
  choice: గెషూరు
  rationale: స్థల నామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో అందించింది.
- source_word: וַ/יְהִי שָׁם
  choice: అతడు అక్కడ ఉన్నాడు
  rationale: హీబ్రూ పదబంధంలోని ‘అక్కడ ఉన్నాడు’ అనే అక్షరార్థాన్ని సహజమైన తెలుగులో నిలిపింది; సందర్భానుసారంగా ‘అక్కడ నివసించాడు’ లేదా ‘అక్కడే ఉండిపోయాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: కాలవ్యవధిని సూచించే సంఖ్యా-నామవాచక పదబంధానికి సూటి తెలుగు అనువాదం.
