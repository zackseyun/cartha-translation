translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, సంధి యొక్క స్వల్ప సందిగ్ధత, ‘ఉన్నాడు’ అనే సరళ వ్యక్తీకరణ నిలుపబడ్డాయి.
