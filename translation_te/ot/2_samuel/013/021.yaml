translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ కోప నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా అనువదించి, దాని రూపక స్వరూపాన్ని పాదసూచికలో నిలిపాం.
