  text: When King David heard all these things[a], he was very angry.
translation:
  language: te
  text: దావీదు రాజు ఈ సంగతులన్నీ విన్నప్పుడు, ఆయనకు చాలా కోపం వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దావీదు రాజు ఈ సంగతులన్నీ విన్నాడు; ఆయనకు ఎంతో మండింది,” అంటే, “ఆయన కోపం ఎంతో మండింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: దావీదు రాజు ... విన్నప్పుడు
  rationale: వావ్ సంధిని కథనంలోని కాలసంబంధంగా సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘రాజు దావీదు’ అనే అర్థాన్ని సాధారణ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: שָׁמַע
  choice: విన్నప్పుడు
  rationale: మూల క్రియకు ‘విన్నాడు’ అనే ప్రత్యక్ష అర్థమే ఉంది; ఇక్కడ జరిగిన సంగతుల గురించిన సమాచారం అందుకోవడాన్ని సూచిస్తుంది.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: ఈ సంగతులన్నీ
  rationale: דברים అనే పదం మాటలు, విషయాలు, సంగతులు అనే విస్తృత అర్థాలను కలిగి ఉంది. సందర్భంలో తామారు, అమ్నోనులకు సంబంధించిన ఘటనలను సూచిస్తున్నందున ‘సంగతులు’ సహజంగా, తగినంత విస్తృతంగా ఉంది.
- source_word: וַ/יִּחַר ל֖/וֹ
  choice: ఆయనకు ... కోపం వచ్చింది
  rationale: అక్షరార్థంగా ‘అతనికి మండింది’ అనే హెబ్రీ నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగు కోప నుడికారంతో వ్యక్తం చేస్తుంది; మూలంలో ‘కోపం’ అనే నామవాచకం స్పష్టంగా లేకపోవడాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: מְאֹד
  choice: చాలా
  rationale: తీవ్రతను తెలిపే సాధారణ క్రియావిశేషణానికి సహజమైన ఆధునిక తెలుగు సమానం.
