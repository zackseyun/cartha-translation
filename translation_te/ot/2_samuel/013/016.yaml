source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אוֹדֹ֞ת הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את מֵ/אַחֶ֛רֶת אֲשֶׁר עָשִׂ֥יתָ עִמִּ֖/י לְ/שַׁלְּחֵ֑/נִי וְ/לֹ֥א אָבָ֖ה לִ/שְׁמֹ֥עַֽ לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: te
  text: 'కానీ ఆమె అతనితో[a] ఇలా అంది: “వద్దు! నన్ను పంపివేయడంలోని ఈ గొప్ప అన్యాయం, నువ్వు నాకు చేసిన మరొక అన్యాయం కంటే గొప్పది.” కానీ అతడు ఆమె మాట వినడానికి ఇష్టపడలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశః: “వద్దు! నన్ను పంపివేయడంలోని ఈ గొప్ప అన్యాయం, నువ్వు నాకు చేసిన మరొక అన్యాయం కంటే గొప్పది.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి అర్థం చేసుకోవడానికి క్లిష్టంగా ఉంది; అందువల్ల తెలుగులో వాక్యనిర్మాణాన్ని కొంత సహజీకరించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: వద్దు!
  rationale: ఇది సాధారణంగా నిషేధాన్ని సూచించినా, ఇక్కడ సంక్షిప్తమైన ప్రత్యక్ష సంభాషణలో తామారు చెప్పిన తీవ్రమైన నిరాకరణగా ఉంది. ‘వద్దు!’ సహజమైన తెలుగు అభ్యంతరాన్ని వ్యక్తం చేస్తుంది.
- source_word: אוֹדֹת
  choice: '[తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక పదంగా వ్యక్తం కాలేదు]'
  rationale: ఈ పదం తదుపరి విషయాన్ని అభ్యంతరానికి కారణంగా అనుసంధానిస్తుంది. తెలుగులో ‘నన్ను పంపివేయడం అనే ఈ…’ అనే నిర్మాణమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: ఈ ఘోరమైన అన్యాయం
  rationale: רָעָה ఇక్కడ నైతికంగా, వ్యక్తిగతంగా చేసిన హాని లేదా అన్యాయాన్ని సూచిస్తుంది; גְּדוֹלָה తీవ్రతను తెలియజేస్తుంది. ‘ఘోరమైన అన్యాయం’ ఆధునిక తెలుగులో సందర్భానికి తగిన స్పష్టమైన పదబంధం.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: నువ్వు ఇంతకుముందు నాకు చేసిన అన్యాయం కంటే
  rationale: אַחֶרֶת ముందటి మరొక అన్యాయాన్ని సూచిస్తుంది. సందర్భంలో అది ముందే జరిగిన చర్య కాబట్టి ‘ఇంతకుముందు’ కాల సంబంధాన్ని సహజంగా వెల్లడిస్తుంది; ‘అన్యాయం’ అనేది హీబ్రూలో సూచితమైన నామవాచకాన్ని తెలుగులో స్పష్టపరుస్తుంది.
- source_word: לְשַׁלְּחֵנִי
  choice: నన్ను పంపివేయడం
  rationale: ప్రత్యయంతో కూడిన క్రియానామం చర్చలోని చర్యను తెలియజేస్తుంది. ‘నన్ను పంపివేయడం’ దాని భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: అయినా అతడు ఆమె మాట వినడానికి ఇష్టపడలేదు
  rationale: אָבָה సంకల్పం లేదా సుముఖత లేకపోవడాన్ని సూచిస్తుంది. ‘ఇష్టపడలేదు’ అతని ఉద్దేశపూర్వక నిరాకరణను నిలుపుతుంది; ‘ఆమె మాట వినడం’ సహజమైన తెలుగు.
- source_word: לּוֹ
  choice: అతనితో
  rationale: తెలుగులో ‘అతనితో అంది’ అనేది ప్రత్యక్ష సంభాషణను పరిచయం చేసే సహజ నిర్మాణం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి, కానీ తామారు అభ్యంతరంలోని తీవ్రతను నిలిపే సహజ ప్రత్యక్ష సంభాషణ. మూలంలోని సంక్షిప్త, క్లిష్ట నిర్మాణాన్ని పాదసూచికలో వెల్లడించాం.
