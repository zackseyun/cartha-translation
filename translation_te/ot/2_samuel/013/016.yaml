- from: అయితే ఆమె అతనితో[a], “వద్దు! నన్ను పంపివేయడం అనే ఈ ఘోరమైన అన్యాయం, నువ్వు ఇంతకుముందు నాకు చేసిన అన్యాయం కంటే మరింత ఘోరమైనది” అంది. అయినా అతడు ఆమె మాట వినడానికి ఇష్టపడలేదు.
  to: 'కానీ ఆమె అతనితో[a] ఇలా అంది: “వద్దు! నన్ను పంపివేయడంలోని ఈ గొప్ప అన్యాయం, నువ్వు నాకు చేసిన మరొక అన్యాయం కంటే గొప్పది.” కానీ అతడు ఆమె మాట వినడానికి ఇష్టపడలేదు.'
  rationale: ‘ఇంతకుముందు’ అనే మూలంలో లేని కాలసూచకాన్ని తొలగించి, אַחֶרֶת యొక్క ‘మరొకటి’ అనే సూచనను నిలిపాం. ‘గొప్ప అన్యాయం’ మరియు ‘కంటే గొప్పది’ ద్వారా మూలంలోని తీవ్రత, తులన రెండింటినీ నేరుగా ప్రతిబింబించాం. పాదసూచికను మూలంలోని సంక్షిప్తతను వివరించేలా, కానీ అనవసరమైన వ్యాకరణ తీర్పు లేకుండా సవరించాం.
