    rationale: మూల నిర్మాణం సంక్షిప్తంగా, అర్థనిర్ణయంలో కష్టంగా ఉంది; కానీ దానిని వ్యాకరణపరంగా క్లిష్టమని చెప్పడం అవసరానికి మించిన నిర్ధారణ. మరింత తటస్థమైన వివరణ మంచిది.
