source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/שְׁנָתַ֣יִם יָמִ֔ים וַ/יִּהְי֤וּ גֹֽזְזִים֙ לְ/אַבְשָׁל֔וֹם בְּ/בַ֥עַל חָצ֖וֹר אֲשֶׁ֣ר עִם אֶפְרָ֑יִם וַ/יִּקְרָ֥א אַבְשָׁל֖וֹם לְ/כָל בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: te
  text: రెండు పూర్తి సంవత్సరాలు గడిచిన తర్వాత, ఎఫ్రాయిముకు సమీపంలో ఉన్న బయల్-హాసోరులో అబ్షాలోము గొర్రెల బొచ్చు కత్తిరించే ఏర్పాటు చేశాడు.[a] అబ్షాలోము రాజు కుమారులందరినీ ఆహ్వానించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “రెండు సంవత్సరాల దినాలు”; అంటే పూర్తి రెండు సంవత్సరాల కాలం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: రెండు పూర్తి సంవత్సరాలు గడిచిన తర్వాత
  rationale: ‘రెండు సంవత్సరాల దినాలు’ అనే హీబ్రూ నుడికారంలోని పూర్తి రెండేళ్ల కాలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גֹזְזִים
  choice: గొర్రెల బొచ్చు కత్తిరించేవారు
  rationale: గזז్ ధాతువు ఈ సందర్భంలో గొర్రెల బొచ్చు కత్తిరించే పనివారిని సూచిస్తుంది; తెలుగులో సూచిత కర్మను స్పష్టంగా పేర్కొనడం సహజం.
- source_word: בְּבַעַל חָצוֹר
  choice: బయల్-హాసోరులో
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; ‘లో’ సంఘటన జరిగిన ప్రదేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: ఎఫ్రాయిముకు సమీపంలో ఉన్న
  rationale: עִם ఇక్కడ భౌగోళిక సామీప్యాన్ని సూచిస్తుంది; ‘సమీపంలో’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיִּקְרָא
  choice: ఆహ్వానించాడు
  rationale: మూల క్రియకు ‘పిలిచాడు’ అనే ప్రాథమిక అర్థం ఉన్నా, గొర్రెల బొచ్చు కత్తిరింపు విందు సందర్భంలో ఆహ్వానించడం అనే ప్రయోగార్థం ఉద్దేశించబడింది.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: రాజ కుమారులందరినీ
  rationale: ‘రాజు కుమారులందరినీ’ అనే నిర్మాణానికి సహజమైన సంక్షిప్త తెలుగు రూపం; కుటుంబ, రాజసంబంధ సూచన రెండింటినీ నిలుపుతుంది.
- source_word: וַיְהִי
  choice: గడిచిన తర్వాత
  rationale: కథన క్రమాన్ని తెలుగు కాలవాక్య నిర్మాణంలో సహజంగా సమన్వయపరుస్తుంది; మూలంలో లేని ప్రత్యేక ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
