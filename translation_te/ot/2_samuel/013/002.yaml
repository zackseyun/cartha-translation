base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: te
  text: తన సహోదరి తామారు కారణంగా అమ్నోను ఎంతగా వ్యాకులపడ్డాడంటే, అతడు జబ్బుపడ్డాడు.[a] ఎందుకంటే ఆమె కన్య. ఆమెకు ఏమైనా చేయడం అమ్నోనుకు అసాధ్యంగా అనిపించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తాను జబ్బుపడేలా చేసుకున్నాడు.” హీబ్రూ రూపం ‘జబ్బుపడ్డాడు’ అనే ఫలితార్థాన్ని గానీ, ప్రతిఫలార్థక భావాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అసాధ్యంగా అనిపించింది” అనేది అమ్నోను దృష్టిలో ఆమె విషయంలో చర్య తీసుకోవడానికి ఆచరణసాధ్యమైన మార్గం కనిపించలేదని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: ఎంతగా వ్యాకులపడ్డాడంటే
  rationale: ఈ సందర్భంలో యצר క్రియ భావోద్వేగపరమైన ఇరుకు, తీవ్రమైన కలతను సూచిస్తుంది. తరువాతి అనారోగ్య స్థితితో సహజంగా అనుసంధానించేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: לְהִתְחַלּוֹת
  choice: జబ్బుపడే స్థితికి వచ్చాడు
  rationale: חלה హిత్పయేల్ రూపం ‘తాను జబ్బుపడేలా చేసుకున్నాడు’ లేదా ఫలితంగా ‘జబ్బుపడ్డాడు’ అనే రెండింటికీ వీలు కల్పిస్తుంది. ప్రధాన పాఠం ఉద్దేశపూర్వకతను నిర్ణయించకుండా ఫలితార్థాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: בַּעֲבוּר
  choice: కారణంగా
  rationale: ఇక్కడ ఈ విభక్త్యర్థక పదం ప్రయోజనాన్ని కాక కారణాన్ని సూచిస్తుంది.
- source_word: אֲחֹתוֹ
  choice: తన సహోదరి
  rationale: బంధుత్వాన్ని స్పష్టంగా నిలుపుతుంది; కథనంలోని నైతిక ఉద్రిక్తతకు ఈ సంబంధం కీలకం.
- source_word: בְתוּלָה
  choice: కన్య
  rationale: హీబ్రూ పదం కన్యత్వాన్ని నేరుగా సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘కన్య’ సంక్షిప్తమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: అమ్నోనుకు అసాధ్యంగా అనిపించింది
  rationale: అమ్నోను దృష్టిలో అది సాధ్యపడని లేదా అందుబాటులో లేని కార్యమని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: ఆమెకు ఏమైనా చేయడం
  rationale: מְאוּמָה అంటే ‘ఏమైనా’ లేదా ‘అతి స్వల్పమైనదైనా.’ తరువాత జరిగే నేరాన్ని ముందుగానే నిర్దిష్టంగా పేర్కొనకుండా, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: అమ్నోను ఉద్దేశం మరియు ‘ఆమెకు ఏమైనా చేయడం’ అనే మాటల పరిధి
  choice: చర్య స్వరూపాన్ని నిర్దిష్టీకరించకుండా ‘ఆమెకు ఏమైనా చేయడం’ అని ఉంచడం
  alternative: ‘ఆమెను పొందడం’ లేదా ‘ఆమెతో లైంగిక సంబంధం పెట్టుకోవడం’
  rationale: ఈ వచనంలోని హీబ్రూ మాటలు సాధారణంగానే ఉన్నాయి. తరువాతి కథనం అమ్నోను ఉద్దేశాన్ని బయటపెట్టినా, ఈ వచనంలో మూలం ఉంచిన కథనాత్మక ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సహోదరి’ బంధుత్వాన్ని స్పష్టంగా ఉంచుతుంది; ‘జబ్బుపడే స్థితికి వచ్చాడు’ మూలంలోని వ్యాకరణ అస్పష్టతను ప్రధాన పాఠంలో అతిగా నిర్ణయించదు. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
