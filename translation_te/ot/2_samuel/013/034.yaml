  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడాం. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణను నిలిపి, కఠినమైన స్థల వర్ణనలో ఉన్న అస్పష్టతను పాదసూచికలో స్పష్టంగా తెలియజేశాం.
