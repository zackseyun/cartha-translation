  text: וַ/יִּבְרַ֖ח אַבְשָׁל֑וֹם וַ/יִּשָּׂ֞א הַ/נַּ֤עַר הַ/צֹּפֶה֙ אֶת עינ/ו וַ/יַּ֗רְא וְ/הִנֵּ֨ה עַם רַ֜ב הֹלְכִ֥ים מִ/דֶּ֛רֶךְ אַחֲרָ֖י/ו מִ/צַּ֥ד הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: te
  text: అబ్షాలోము పారిపోయాడు. కావలి కాస్తున్న యువకుడు[a] కళ్లెత్తి చూసినప్పుడు[b], ఇదిగో, చాలామంది కొండ పక్కనుండి అతని వెనుకనున్న దారిలో వస్తూ కనిపించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కావలివాడు.’ హీబ్రూలో ‘యువకుడు/సేవకుడు’ అనే పదంతో ‘గమనిస్తూ ఉన్నవాడు’ అనే పదం కలిపి ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘తన కళ్లను పైకెత్తాడు’; అంటే అతడు పైకి లేదా దూరంగా చూశాడు.'
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అతని వెనుకనున్న దారి వైపునుండి, కొండ పక్కనుండి.’ హీబ్రూలో ఇక్కడి స్థల సంబంధం సంక్షిప్తంగా ఉండి, ‘అతని’ అనేది ఎవరిని సూచిస్తుందో స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: పారిపోయాడు
  rationale: ברח పారిపోవడం లేదా తప్పించుకొని వెళ్లడం అనే భావాన్ని ఇస్తుంది. కథన సందర్భంలో ‘పారిపోయాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: కావలి కాస్తున్న యువకుడు
  rationale: נַעַר లోని ‘యువకుడు/సేవకుడు’ భావాన్నీ, צֹפֶה లోని గమనిస్తూ కావలి కాసే భావాన్నీ రెండింటినీ నిలుపుతుంది; అధికారిక హోదాను అవసరానికి మించి నిర్ధారించదు.
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: కళ్లెత్తి చూసినప్పుడు
  rationale: హీబ్రూ జాతీయాన్ని తెలుగు సహజ ప్రయోగంతో అందిస్తూ, పైకి లేదా దూరంగా దృష్టి సారించిన భావాన్ని నిలుపుతుంది.
- source_word: וַיַּרְא וְהִנֵּה
  choice: చూసినప్పుడు, ఇదిగో ... కనిపించారు
  rationale: הִנֵּה కలిగించే ఆకస్మిక గమనికను ‘ఇదిగో’ నిలుపుతుంది; వాక్యం తెలుగులో సహజంగా ఉండేందుకు చూడడాన్ని ప్రధాన క్రియతో అనుసంధానించాం.
- source_word: עַם רַב
  choice: చాలామంది
  rationale: పెద్ద సమూహమనే భావాన్ని సులభమైన ఆధునిక తెలుగులో తెలుపుతుంది; అది ఒక అధికారిక గుంపు అని అదనంగా సూచించదు.
- source_word: הֹלְכִים
  choice: వస్తూ
  rationale: הלך అక్షరార్థంగా వెళ్లడం/నడవడం అయినా, కావలి కాస్తున్నవాని దృష్టికోణం నుంచి వారు సమీపిస్తున్నందున ‘వస్తూ’ సందర్భోచితం.
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: కొండ పక్కనుండి అతని వెనుకనున్న దారిలో
  rationale: మూలంలోని సంక్షిప్తమైన స్థల సంబంధాన్ని పూర్తిగా పరిష్కరించకుండా, కొండ పక్కనుండి రావడం, ‘అతని వెనుక’ ఉన్న దారి అనే రెండు అంశాలను నిలుపుతుంది.
