source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: te
  text: 'యెహోనాదాబు అతనితో ఇలా అన్నాడు: “నీ మంచం మీద పడుకొని, జబ్బుపడినట్టు నటించు.[a] నీ తండ్రి నిన్ను చూడడానికి వచ్చినప్పుడు అతనితో ఇలా చెప్పు: ‘దయచేసి, నా సోదరి తామారు వచ్చి నాకు ఆహారం పెట్టేలా అనుమతించండి.[b] నేను చూస్తుండగా ఆమె ఆహారాన్ని సిద్ధం చేయనివ్వండి,[c] తద్వారా నేను చూసి ఆమె చేతినుండి తినగలను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియకు ఇక్కడ ‘జబ్బుగా కనిపించేలా చేసుకో’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘రొట్టె’; ఈ పదం సాధారణంగా ఆహారం అనే విస్తృత అర్థంలోనూ వాడబడుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ఈ హీబ్రూ పదం రోగి లేదా కోలుకుంటున్న వ్యక్తి కోసం ప్రత్యేకంగా సిద్ధం చేసే ఆహారాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: నీ మంచం మీద పడుకొని
  rationale: శయనించడానికి ఉపయోగించే స్థలంపై పడుకోవడం అనే సహజ అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִתְחָל
  choice: జబ్బుపడినట్టు నటించు
  rationale: సందర్భంలో నిజంగా జబ్బుపడమని కాక, జబ్బుగా కనిపించేలా నటించమనే భావం ఉంది.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: నీ తండ్రి నిన్ను చూడడానికి వచ్చినప్పుడు
  rationale: ఆజ్ఞల వరుసలోని హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అందిస్తుంది.
- source_word: תָּבֹא נָא תָמָר אֲחוֹתִי
  choice: దయచేసి నా సహోదరి తామారు వచ్చి
  rationale: נָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’తో, తామారు గురించిన సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: నాకు ఆహారం పెట్టనివ్వండి
  rationale: ברה ఇక్కడ రోగికి పోషణ అందించడం/తినిపించడం అనే భావం ఇస్తుంది; לֶחֶם విస్తృతంగా ఆహారాన్ని సూచించగలదు. తరువాతి עשה ‘సిద్ధం చేయడం’తో దీనిని కలపలేదు.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: నేను చూస్తుండగా ఆమె రోగికి పెట్టే ఆహారాన్ని సిద్ధం చేయనివ్వండి
  rationale: לְעֵינַי లోని ప్రత్యక్షంగా చూడటం, עשה లోని సిద్ధం చేయడం, הַבִּרְיָה లోని రోగికి తగిన ఆహార సూచన—మూడింటినీ నిలుపుతుంది.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: అప్పుడు నేను చూసి
  rationale: ראה కు ప్రత్యక్ష కర్మ లేదు; కాబట్టి హీబ్రూలో లేని ‘దానిని’ను చేర్చకుండా ఉద్దేశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: ఆమె చేతినుండి తింటాను
  rationale: తామారు స్వయంగా ఆహారం అందించాలనే కథాపరమైన ముఖ్యమైన భావాన్ని కాపాడుతుంది.
