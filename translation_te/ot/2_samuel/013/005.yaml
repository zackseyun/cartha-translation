- from: యెహోనాదాబు అతనితో, “నీ మంచం మీద పడుకొని, జబ్బుపడినట్టు నటించు.[a] నీ తండ్రి నిన్ను చూడడానికి వచ్చినప్పుడు అతనితో, ‘దయచేసి నా సహోదరి తామారు వచ్చి నాకు ఆహారం పెట్టనివ్వండి.[b] నేను చూస్తుండగా ఆమె రోగికి పెట్టే ఆహారాన్ని[c] సిద్ధం చేయనివ్వండి; అప్పుడు నేను చూసి, ఆమె చేతినుండి తింటాను’ అని చెప్పు” అన్నాడు.
  to: 'యెహోనాదాబు అతనితో ఇలా అన్నాడు: “నీ మంచం మీద పడుకొని, జబ్బుపడినట్టు నటించు.[a] నీ తండ్రి నిన్ను చూడడానికి వచ్చినప్పుడు అతనితో ఇలా చెప్పు: ‘దయచేసి, నా సోదరి తామారు వచ్చి నాకు ఆహారం పెట్టేలా అనుమతించండి.[b] నేను చూస్తుండగా ఆమె ఆహారాన్ని సిద్ధం చేయనివ్వండి,[c] తద్వారా నేను చూసి ఆమె చేతినుండి తినగలను.’”'
  rationale: బִּרְיָהకు సంబంధించిన వ్యాఖ్యానాత్మక నిర్దిష్టతను ప్రధాన పాఠం నుంచి పాదటిప్పణికి మార్చి, మూలంలోని అర్థానిశ్చితిని కాపాడాం. తండ్రిని ఉద్దేశించిన అనుమతి-అభ్యర్థనను ఆధునిక ప్రామాణిక తెలుగులో మరింత స్పష్టంగా తీర్చిదిద్దాం. לְעֵינַי మరియు אֶרְאֶהలోని వరుస చూపు భావాలను ‘నేను చూస్తుండగా’ మరియు ‘నేను చూసి’ ద్వారా నిలిపాం.
