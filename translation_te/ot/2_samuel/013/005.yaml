translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజుతో మాట్లాడే ఉద్ధృత వాక్యంలో ‘నివ్వండి’ అనే మర్యాదారూపం పెట్టబడింది. పునరుక్తిగా ఉన్న చూపు-భాషను తొలగించకుండా, ‘నేను చూస్తుండగా… నేను చూసి’ అని మూలంలోని לְעֵינַי మరియు אֶרְאֶה రెండింటినీ నిలిపాం.
