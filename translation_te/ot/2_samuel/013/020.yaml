source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֜י/הָ אַבְשָׁל֣וֹם אָחִ֗י/הָ הַ/אֲמִינ֣וֹן אָחִי/ךְ֮ הָיָ֣ה עִמָּ/ךְ֒ וְ/עַתָּ֞ה אֲחוֹתִ֤/י הַחֲרִ֨ישִׁי֙ אָחִ֣י/ךְ ה֔וּא אַל תָּשִׁ֥יתִי אֶת לִבֵּ֖/ךְ לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תֵּ֤שֶׁב תָּמָר֙ וְ/שֹׁ֣מֵמָ֔ה בֵּ֖ית אַבְשָׁל֥וֹם אָחִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: te
  text: అప్పుడు ఆమె సహోదరుడైన అబ్షాలోము ఆమెతో ఇలా అన్నాడు, “నీ అన్న అమ్నోను నీతో ఉన్నాడా?[a] కానీ ఇప్పుడు, నా చెల్లీ, మౌనంగా ఉండు; అతడు నీ అన్న. ఈ విషయాన్ని మనసుకు తీసుకోకు.” అప్పుడు తామారు వెలవెలబోయిన స్థితిలో తన అన్న అబ్షాలోము ఇంట్లో ఉండిపోయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీతో ఉన్నాడా?” అనేది ఇక్కడ లైంగిక దాడిని సూచించే నిగూఢమైన హీబ్రూ వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విధ్వస్తురాలై” లేదా “వెలితిగా.” హీబ్రూ పదం విధ్వంసం, పాడైపోవడం, లేదా దిగ్భ్రాంతితో కూడిన వెలితి స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲמִינוֹן
  choice: అమ్నోను
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָיָה עִמָּךְ
  choice: నీతో ఉన్నాడా?
  rationale: మూలంలోని నిగూఢమైన ప్రయోగాన్ని యథాతథంగా ఉంచుతుంది; సందర్భం ఇది లైంగిక దాడిని సూచిస్తోందని తెలియజేస్తుంది.
- source_word: הַחֲרִישִׁי
  choice: మౌనంగా ఉండు
  rationale: חרשׁ ఆజ్ఞారూపంలోని ‘నిశ్శబ్దంగా ఉండు/ఏమీ చెప్పకు’ అనే బలాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָחִיךְ הוּא
  choice: అతడు నీ అన్న
  rationale: కుటుంబ బంధాన్ని చూపుతూ అబ్షాలోము చెప్పిన కలవరపరిచే కారణాన్ని మెత్తబరచకుండా నిలుపుతుంది.
- source_word: אַל תָּשִׁיתִי אֶת־לִבֵּךְ לַדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి మనసులో పెట్టుకోకు
  rationale: ‘ఈ విషయంపై నీ హృదయాన్ని ఉంచకు’ అనే హీబ్రూ నుడికారాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּשֶׁב
  choice: ఉండిపోయింది
  rationale: కూర్చోవడం/నివసించడం అనే మూలక్రియ ఇక్కడ అబ్షాలోము ఇంట్లో కొనసాగిన స్థితిని సూచిస్తుంది.
- source_word: שֹׁמֵמָה
  choice: నిర్జీవంగా
  rationale: పాడైపోయిన, దిగ్భ్రాంతితో వెలవెలబోయిన స్థితిని సూచించే పదం; తెలుగులో వ్యక్తి యొక్క తీవ్ర మానసిక, సామాజిక విధ్వంసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: అబ్షాలోము ఇంట్లో
  rationale: కుటుంబ, గృహ నేపథ్యాన్ని స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: లైంగిక దాడికి సంబంధించిన కథన నిగూఢోక్తి
  choice: ‘నీతో ఉన్నాడా?’ అనే మూలంలోని పరోక్ష వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘నీపై అత్యాచారం చేశాడా?’ లేదా ‘నీతో శయనించాడా?’
  rationale: హీబ్రూ పాఠ్యం బాధాకరమైన సంఘటనను నిగూఢంగా ప్రస్తావిస్తుంది. దానిని స్పష్టీకరించి వ్యాఖ్యానంగా మార్చకుండా, మూలంలోని సంయమనాన్ని నిలిపి, అర్థాన్ని పాదసూచికలో తెలియజేశాం.
- issue: שֹׁמֵמָה పదంలోని బహుళార్థ ఛాయలు
  choice: ‘నిర్జీవంగా’ అని అనువదించి, విధ్వంసం మరియు వెలితి ఛాయలను పాదసూచికలో చూపడం.
  alternative: ‘వెలవెలబోయి’, ‘పాడైపోయిన స్థితిలో’, లేదా ‘దిగ్భ్రాంతితో’
  rationale: ఈ పదం కేవలం దుఃఖాన్ని కాక, భయంకరమైన విధ్వంసం, వెలితి, దిగ్భ్రాంతిని కలిపి సూచిస్తుంది; ఒకే తెలుగు పదం అన్ని ఛాయలను పూర్తిగా పట్టుకోలేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణం. మూలంలోని నిగూఢోక్తిని, అసౌకర్యకరమైన కుటుంబ-సంబంధ కారణాన్ని, తామారు స్థితిలోని అర్థవిస్తృతిని మెత్తబరచకుండా నిలిపాం.
