  to: అప్పుడు ఆమె సహోదరుడైన అబ్షాలోము ఆమెతో ఇలా అన్నాడు, “నీ అన్న అమ్నోను నీతో ఉన్నాడా?[a] కానీ ఇప్పుడు, నా చెల్లీ, మౌనంగా ఉండు; అతడు నీ అన్న. ఈ విషయాన్ని మనసుకు తీసుకోకు.” అప్పుడు తామారు వెలవెలబోయిన స్థితిలో తన అన్న అబ్షాలోము ఇంట్లో ఉండిపోయింది.[b]
  rationale: שֹׁמֵמָהకు మరణం లేదా అచేతనతను సూచించగల ‘నిర్జీవంగా’ బదులు, మూలంలోని మానసిక-సామాజిక వెలితి మరియు విధ్వంస భావాన్ని వ్యక్తపరిచే ‘వెలవెలబోయిన స్థితిలో’ వాడబడింది. ఇతర మార్పులు తెలుగు నుడికారాన్ని మెరుగుపరుస్తాయి; మూలంలోని పరోక్షతను లేదా కథనంలోని అసౌకర్యకరమైన అంశాన్ని మార్చవు.
