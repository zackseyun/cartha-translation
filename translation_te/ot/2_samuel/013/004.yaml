  text: וַ/יֹּ֣אמֶר ל֗/וֹ מַדּ֣וּעַ אַ֠תָּה כָּ֣כָה דַּ֤ל בֶּן הַ/מֶּ֨לֶךְ֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר הֲ/ל֖וֹא תַּגִּ֣יד לִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ אַמְנ֔וֹן אֶת תָּמָ֗ר אֲח֛וֹת אַבְשָׁלֹ֥ם אָחִ֖/י אֲנִ֥י אֹהֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: te
  text: అతడు అతనితో, “రాజకుమారుడా, నీవు ఉదయం తర్వాత ఉదయం[a] ఇలా ఎందుకు కృశించిపోతున్నావు? నాకు చెప్పవా?” అన్నాడు. అమ్నోను అతనితో, “నా సోదరుడైన అబ్షాలోము సోదరి తామారును నేను ప్రేమిస్తున్నాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి ఉదయం’; మరింత అక్షరార్థంగా, ‘ఉదయం ఉదయాన.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను తామారుపై ప్రేమలో ఉన్నాను.’ హీబ్రూలో అక్షరార్థంగా, ‘తామారును నేను ప్రేమిస్తున్నాను’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని నేరుగా ప్రశ్నించే సాధారణ ప్రశ్నార్థక పదం; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כָּכָה דַּל
  choice: ఇలా చిక్కిపోతున్నావు
  rationale: దృశ్యంగా కృశించిపోతున్న స్థితిని సూచించే సందర్భానుకూల తెలుగు; ఆర్థిక పేదరికం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజకుమారుడవైన నీవు
  rationale: అక్షరార్థంలోని ‘రాజు కుమారుడు’ భావాన్ని సహజమైన తెలుగు సంబోధనగా అందిస్తుంది; యోనాదాబు మాటలోని వ్యంగ్యభరిత ఆశ్చర్యాన్ని నిలుపుతుంది.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ఉదయం ఉదయం
  rationale: హీబ్రూ పదపునరుక్తిని నిలుపుతూ ప్రతి ఉదయం అనే పునరావృత్త భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: నాకు చెప్పవా?
  rationale: సమాధానం చెప్పాలని ఆశిస్తూ ప్రోత్సహించే ప్రశ్నను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: నా సహోదరుడైన అబ్షాలోము సహోదరి
  rationale: అబ్షాలోముతో అమ్నోనుకు ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచి, మూలంలోని సంబంధ నిర్మాణాన్ని వీలైనంతగా కాపాడుతుంది.
- source_word: אֲנִי אֹהֵב
  choice: నేను ప్రేమిస్తున్నాను
  rationale: אָהֵב అనే సాధారణ ‘ప్రేమించు’ క్రియను నేరుగా అనువదిస్తుంది; తరువాతి కథనం ఆధారంగా కోరిక లేదా మోహం అనే వివరణను ఈ వాక్యంలోకి చేర్చదు.
theological_decisions:
- issue: తామారు పట్ల అమ్నోను చెప్పిన ప్రేమ/కోరిక స్వభావం
  choice: నేను ప్రేమిస్తున్నాను
  alternative: నేను తామారుపై ప్రేమలో పడ్డాను; నేను తామారును కోరుతున్నాను
  rationale: మూలంలో సాధారణ אָהֵב క్రియ ఉంది. తరువాతి కథనం అతని ప్రేమ వికృతమైనదని చూపించినా, ఈ వచనం స్వయంగా చెప్పే మాటలో ఆ నైతిక లేదా మానసిక విశ్లేషణను కలపకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కథన శైలి. ‘ఉదయం ఉదయం’ అనే మూల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం. ‘సహోదరుడు/సహోదరి’ పదాలు కుటుంబ సంబంధాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తాయి.
