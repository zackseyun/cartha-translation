source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח דָּוִ֛ד אֶל תָּמָ֖ר הַ/בַּ֣יְתָ/ה לֵ/אמֹ֑ר לְכִ֣י נָ֗א בֵּ֚ית אַמְנ֣וֹן אָחִ֔י/ךְ וַ/עֲשִׂי ל֖/וֹ הַ/בִּרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: te
  text: అప్పుడు దావీదు తామారు ఉన్న ఇంటికి కబురు పంపి, “దయచేసి నీ అన్న అమ్నోను ఇంటికి వెళ్లి, అతని కోసం ఆహారం[a] సిద్ధం చేయి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోలుకోవడానికి తోడ్పడే వంటకం” లేదా “భోజనం.” ఈ హీబ్రూ పదం అనారోగ్యంతో ఉన్నవారి కోసం లేదా కోలుకుంటున్నవారి కోసం సిద్ధం చేసే ఆహారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל־תָּמָר ... לֵאמֹר
  choice: తామారుకు కబురు పంపి ... అని చెప్పాడు
  rationale: ‘పంపాడు’ అనే మూలక్రియకు, తరువాత సందేశం నేరుగా ఉటంకించబడినందున, తెలుగులో సహజమైన ‘కబురు పంపాడు’ అనే భావాన్ని ఇచ్చాం.
- source_word: הַבַּיְתָה
  choice: ఇంట్లో ఉన్న
  rationale: దిశను సూచించే రూపం అక్షరార్థంగా ‘ఇంటివైపుకు’ అని ఉండగలదు; సందర్భంలో తామారు ఉన్న చోటికి సందేశం పంపడాన్ని సూచిస్తున్నందున, స్థితిని సహజంగా తెలిపే ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: לְכִי־נָא
  choice: దయచేసి ... వెళ్లి
  rationale: స్త్రీ ఏకవచన ఆజ్ఞారూపంతో ఉన్న נָא ఆజ్ఞను మర్యాదపూర్వక విజ్ఞప్తిగా మృదువుచేస్తుంది.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: నీ అన్న అమ్నోను ఇంటికి
  rationale: మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ, తెలుగు వాక్యక్రమంలో సహజంగా ఇచ్చాం. కథా సందర్భంలో అమ్నోను తామారు కంటే పెద్దవాడని సూచించబడటంతో ‘అన్న’ సరిపోతుంది.
- source_word: וַעֲשִׂי לוֹ
  choice: అతని కోసం ... సిద్ధం చేయి
  rationale: עשה విస్తృతంగా ‘చేయు/తయారుచేయు’ అని అర్థమిస్తుంది; ఆహార సందర్భంలో ‘సిద్ధం చేయి’ సహజమైన తెలుగు.
- source_word: הַבִּרְיָה
  choice: బలాన్నిచ్చే ఆహారం
  rationale: ఈ నామవాచకం అనారోగ్యంతో ఉన్నవారికి లేదా కోలుకుంటున్నవారికి సిద్ధం చేసే పోషక/పునరుద్ధరణ ఆహారాన్ని సూచిస్తుంది. కేవలం ‘ఆహారం’ కంటే మూలంలోని ప్రత్యేక భావాన్ని ఇది మెరుగ్గా తెలియజేస్తుంది; అయినా ఖచ్చితమైన వంటకాన్ని నిర్ణయించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘బలాన్నిచ్చే ఆహారం’ ద్వారా అరుదైన హీబ్రూ పదంలోని రోగికి సిద్ధం చేసే ఆహార భావం నిలుపబడింది; పాదసూచికలో విస్తృత ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
