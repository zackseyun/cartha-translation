source:
  edition: WLC
  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: te
  text: అబ్షాలోము అమ్నోనుతో మంచి మాటగానీ చెడు మాటగానీ మాట్లాడలేదు[a]. ఎందుకంటే తన సహోదరి తామారును అమ్నోను లైంగికంగా అవమానపరిచినందుకు[b] అబ్షాలోము అతన్ని ద్వేషించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చెడు మొదలుకొని మంచి వరకు మాట్లాడలేదు”; ఇది అమ్నోనుతో అబ్షాలోము ఏ మాటా మాట్లాడలేదని సూచించే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అవమానించినందుకు.” ఈ సందర్భంలో హీబ్రూ క్రియ తామారుపై అమ్నోను చేసిన లైంగిక దౌర్జన్యాన్నీ అవమానాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: తో ... మాట్లాడలేదు
  rationale: דבר עם అనే నిర్మాణం ఎవరితోనైనా మాట్లాడడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘తో మాట్లాడలేదు’ సంబంధార్థాన్ని సూటిగా నిలుపుతుంది.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: మంచి మాటగానీ చెడు మాటగానీ
  rationale: ఇది ఎలాంటి మాటా మాట్లాడలేదని సూచించే ద్వంద్వార్థక నానుడి. మూలంలోని మంచి–చెడు ధ్రువాలను ఉంచుతూ తెలుగులో సహజమైన క్రమం, నిర్మాణం వాడబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అబ్షాలోము మాట్లాడకపోవడానికి గల కారణాన్ని ఈ పదం పరిచయం చేస్తుంది.
- source_word: שָׂנֵא
  choice: ద్వేషించాడు
  rationale: మూల క్రియలోని బలమైన ప్రతికూల భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: '... చేసినందుకు'
  rationale: కారణాన్ని సూచించే హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన కారణార్థక రూపంతో అందిస్తుంది.
- source_word: עִנָּה
  choice: లైంగికంగా అవమానపరిచిన
  rationale: ఈ సందర్భంలో ఈ క్రియ తామారుపై జరిగిన లైంగిక దౌర్జన్యాన్నీ దాని అవమానాన్నీ సూచిస్తుంది. ‘లైంగికంగా అవమానపరిచిన’ అనేది క్రియలోని సందర్భార్థాన్ని స్పష్టం చేస్తూ, ఈ వాక్యంలోనే లేని ప్రత్యేక న్యాయపరమైన పదాన్ని చేర్చదు.
- source_word: אֲחֹתוֹ
  choice: తన సహోదరి
  rationale: సర్వనామ ప్రత్యయం అబ్షాలోమును సూచిస్తుంది. ‘తన సహోదరి’ అని చెప్పడం తెలుగులో సూచనను స్పష్టంగా ఉంచుతుంది.
