  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: te
  text: ఇప్పుడు, ‘రాజు కుమారులందరూ చనిపోయారు’ అని అనుకుంటూ నా ప్రభువైన రాజు ఈ విషయాన్ని మనసులో పెట్టుకోకూడదు; ఎందుకంటే అమ్నోను ఒక్కడే చనిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ విషయం/మాటను తన హృదయంలో ఉంచుకోకూడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందు చెప్పిన సమాచారాన్ని ఆధారంగా చేసుకొని యోనాదాబు రాజును సరిదిద్దుతున్న సంభాషణ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: మనసులో పెట్టుకోవద్దు
  rationale: ‘హృదయంపై/హృదయంలో ఉంచడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ఆ వార్తను నిజమని స్వీకరించి మనసుకు పట్టించుకోవద్దనే భావాన్ని నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలో వాడే గౌరవపూర్వక సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: דָּבָר
  choice: మాట
  rationale: ఇక్కడ రాజు విన్న నివేదికలోని వాదనను సూచిస్తుంది; ‘మాట’ అనే పదం హీబ్రూ పదపు విస్తృత పరిధిని కూడా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ‘...’ అనే
  rationale: రాజు మనసులో పెట్టుకోకూడని మాటలోని విషయాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులందరూ
  rationale: రాజు యొక్క మగ సంతానాన్నే సూచించే మూలపాఠంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: מֵתוּ
  choice: చనిపోయారు
  rationale: నివేదికలో చెప్పబడిన మరణాన్ని నేరుగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם ... לְבַדּוֹ
  choice: అమ్నోను ఒక్కడే
  rationale: అందరూ కాదని సరిదిద్ది, అమ్నోను మాత్రమే చనిపోయాడనే మినహాయింపు మరియు ప్రత్యేక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: అమ్నోను మరణించిన స్థితిని ముందటి తప్పుడు నివేదికతో స్పష్టంగా వ్యతిరేకిస్తుంది.
