    reason: lexical_alternative
  revision_rationale: The revision removes the added inferential force of “కాబట్టి,” uses a natural Telugu third-person deferential form for the courtly Hebrew jussive, and renders דָּבָר as “ఈ విషయం” while retaining the quoted content introduced by לֵאמֹר. The contrast and exclusive force that only Amnon died are preserved. The footnote is adjusted to reflect the Hebrew idiom without adding a source-level demonstrative.
