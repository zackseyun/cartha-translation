id: 2SA.13.19
reference: 2 Samuel 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקַּ֨ח תָּמָ֥ר אֵ֨פֶר֙ עַל רֹאשָׁ֔/הּ וּ/כְתֹ֧נֶת הַ/פַּסִּ֛ים אֲשֶׁ֥ר עָלֶ֖י/הָ קָרָ֑עָה וַ/תָּ֤שֶׂם יָדָ/הּ֙ עַל רֹאשָׁ֔/הּ וַ/תֵּ֥לֶךְ הָל֖וֹךְ וְ/זָעָֽקָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: te
  text: అప్పుడు తామారు తన తలపై బూడిద పోసుకొని, తాను ధరించిన ప్రత్యేకమైన నిలువుటంగీని[a] చింపుకొని, తన తలపై చెయ్యి పెట్టుకొని, బిగ్గరగా కేకలు వేస్తూ వెళ్లిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పొడవైన చేతులున్న నిలువుటంగీ,’ ‘అలంకరించిన నిలువుటంగీ,’ ‘అనేక రంగుల నిలువుటంగీ.’ హీబ్రూ పదబంధం అర్థం అనిశ్చితం; ఈ సందర్భంలో అది రాజు కన్య కుమార్తెలు ధరించే ప్రత్యేక వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: బూడిద
  rationale: శోక సూచకంగా తలపై వేసుకునే బూడిదను సూచిస్తుంది; తెలుగులో ఏకవచన సమష్టి రూపమైన ‘బూడిద’ సహజం.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: తన తలపై బూడిద పోసుకొని
  rationale: అక్షరార్థంగా ‘బూడిద తీసుకొని తలపై’ అనే నిర్మాణం; శోకాచారంలో చేసిన కార్యాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: ప్రత్యేకమైన నిలువుటంగీని
  rationale: ఈ అనిశ్చిత హీబ్రూ పదబంధం రాజకుమార్తెలైన కన్యలు ధరించే ప్రత్యేక వస్త్రాన్ని సూచిస్తుందని సందర్భం (13:18) స్పష్టం చేస్తుంది. ‘నిలువుటంగీ’ వస్త్ర రకాన్ని తెలియజేస్తుంది; ‘ప్రత్యేకమైన’ దాని విశిష్టతను చెప్పి, పొడవైన చేతులు లేదా అనేక రంగులు వంటి అనిశ్చిత వివరాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించదు.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: తాను ధరించిన
  rationale: ఆ వస్త్రం ఆమె ఒంటిమీద ఉందని తెలిపే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: קָרָעָה
  choice: చింపుకొని
  rationale: దుఃఖ సూచకంగా వస్త్రాన్ని చింపే చర్యను తెలిపే సహజ తెలుగు పదం.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: తన తలపై చెయ్యి పెట్టుకొని
  rationale: దుఃఖం, అవమానం వ్యక్తమయ్యే శరీర భంగిమను అదనపు వ్యాఖ్యానం లేకుండా యథాతథంగా ఉంచుతుంది.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: బిగ్గరగా కేకలు వేస్తూ వెళ్లిపోయింది
  rationale: ఆమె వెళ్తూనే గట్టిగా మొరపెట్టుకుంటున్న నిరంతర చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָעָקָה
  choice: బిగ్గరగా కేకలు వేస్తూ
  rationale: పదం సూచించే తీవ్రమైన, వినిపించే అరుపును నిలుపుతుంది; అది విలాపమా, నిరసనా, అరుపా అని మరీ నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఖేతోనెత్’కు సాధారణ పాఠకుడు అర్థం చేసుకోగల ‘నిలువుటంగీ’ వాడబడింది. అనిశ్చితమైన הַפַּסִּים వివరాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
