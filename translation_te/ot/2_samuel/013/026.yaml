source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם וָ/לֹ֕א יֵֽלֶךְ נָ֥א אִתָּ֖/נוּ אַמְנ֣וֹן אָחִ֑/י וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֥/מָּה יֵלֵ֖ךְ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: te
  text: అప్పుడు అబ్షాలోము, “అలా కాకపోతే,[a] దయచేసి నా సోదరుడు అమ్నోనును మాతో వెళ్లడానికి అనుమతించండి” అన్నాడు. అయితే రాజు అతనితో, “అతడు నీతో ఎందుకు వెళ్లాలి?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “మీరు రాకపోతే, దయచేసి నా సోదరుడు అమ్నోనును మాతో వెళ్లడానికి అనుమతించండి.” హెబ్రీ వాక్యం అధ్యాహారంగా, సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు / అయితే ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. మొదటి సందర్భంలో ‘అప్పుడు’, రాజు ప్రతిస్పందనలో భావమలుపును తెలియజేయడానికి ‘అయితే’ సహజంగా ఉన్నాయి.
- source_word: וָלֹא
  choice: అలా కాకపోతే
  rationale: మునుపటి నిరాకరణను సూచించే సంక్షిప్త, అధ్యాహార ప్రయోగం. ‘అలా కాకపోతే’ హెబ్రీ సంక్షిప్తతను కొంత నిలుపుతూ తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఇది వినయపూర్వక అభ్యర్థనను సూచించే కణం; ఆధునిక తెలుగులో ‘దయచేసి’ సహజమైన సమానం.
- source_word: יֵלֶךְ
  choice: వెళ్లనివ్వండి / ఎందుకు వెళ్లాలి
  rationale: అబ్షాలోము అభ్యర్థనలోని జస్సివ్ భావాన్ని ‘వెళ్లనివ్వండి’ వ్యక్తం చేస్తుంది; రాజు వేసిన అలంకారిక ప్రశ్నలో ఇంపర్ఫెక్ట్‌కు ‘ఎందుకు వెళ్లాలి?’ సహజంగా సరిపోతుంది.
- source_word: אִתָּנוּ
  choice: మాతో
  rationale: మొదటి పురుష బహువచన సహచర్యార్థక విభక్తిని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אַמְנוֹן אָחִי
  choice: నా సోదరుడు అమ్నోను
  rationale: తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తూ వ్యక్తి పేరు మరియు బంధుత్వాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: సాధారణ కారణార్థక ప్రశ్నకు సహజమైన తెలుగు సమానం.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: అబ్షాలోమును ఉద్దేశించిన ద్వితీయ పురుష ఏకవచన సహచర్యార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజుతో మాట్లాడుతున్న సందర్భానికి అనుగుణంగా అభ్యర్థనలో గౌరవ బహువచనం వాడబడింది; రాజు అబ్షాలోముతో మాట్లాడేటప్పుడు మూలంలోని ఏకవచనాన్ని ‘నీతో’గా నిలిపాం.
