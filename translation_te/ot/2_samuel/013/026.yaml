  terminology: అబ్షాలోము, అమ్నోను అనే పేర్ల రూపాలు స్థిరమైన బైబిలు తెలుగు వాడుకకు అనుగుణంగా ఉన్నాయి. ‘నా సోదరుడు’ హెబ్రీ אָחִיకి సరైన, సహజమైన సమానం. ‘రాజు’ మరియు ‘దయచేసి’ నమోదు సందర్భోచితంగా ఉన్నాయి.
