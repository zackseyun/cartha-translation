translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వరుస హీబ్రూ క్రియలను తెలుగు సంయుక్త క్రియలతో సాఫీగా అనుసంధానించగా, చివరి కృదంతపు కొనసాగుతున్న స్థితిని ‘నిలబడి ఉన్నారు’గా నిలుపబడింది.
