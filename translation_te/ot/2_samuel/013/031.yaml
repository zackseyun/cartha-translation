reference: 2 Samuel 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֧קָם הַ/מֶּ֛לֶךְ וַ/יִּקְרַ֥ע אֶת בְּגָדָ֖י/ו וַ/יִּשְׁכַּ֣ב אָ֑רְצָ/ה וְ/כָל עֲבָדָ֥י/ו נִצָּבִ֖ים קְרֻעֵ֥י בְגָדִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: te
  text: అప్పుడు రాజు లేచి[a], తన వస్త్రాలు చింపుకొని నేలపై పడుకున్నాడు. అతని సేవకులందరూ చినిగిన వస్త్రాలతో నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వస్త్రాలు చింపుకోవడం హీబ్రూ బైబిలులో దుఃఖం, దిగ్భ్రాంతి లేదా సంతాపాన్ని వ్యక్తం చేసే ఆచారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంయుక్త క్రియతో తెలియజేస్తుంది; రాజు వెంటనే స్పందించిన భావాన్ని నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలపాఠం దావీదు పేరుకు బదులు బిరుదునే వాడుతుంది; అందువల్ల అదే నిలుపబడింది.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: తన వస్త్రాలు చింపుకొని
  rationale: విషాదం లేదా దిగ్భ్రాంతిలో దుస్తులు చింపుకొనే ప్రాచీన ఆచారాన్ని నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: నేలమీద పడుకున్నాడు
  rationale: שׁכב మరియు దిశాసూచకమైన אַרְצָה కలిపి నేలవైపు వెళ్లి అక్కడ పడుకొనే భంగిమను సూచిస్తాయి; తెలుగు వాక్యప్రయోగంలో ఇది సహజం.
- source_word: וְכָל־עֲבָדָיו
  choice: అతని సేవకులందరూ
  rationale: עֲבָדָיו రాజు సేవకులు లేదా ఆస్థాన పరిచారకులను విస్తృతంగా సూచించగలదు; హోదాను అనవసరంగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ నేరమైన సమానార్థాన్ని ఇస్తుంది.
- source_word: נִצָּבִים
  choice: నిలబడి ఉన్నారు
  rationale: నిఫాల్ కృదంతంలోని కొనసాగుతున్న స్థితిని తెలుగు ప్రగతిశీల రూపం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: קְרֻעֵי בְגָדִים
  choice: తమ వస్త్రాలు చింపుకొని
  rationale: వస్త్రాలు చింపబడిన స్థితిని తెలుగు సహజ ప్రయోగంతో తెలియజేస్తుంది; సందర్భంలో వారు శోక సూచకంగా తమ వస్త్రాలు చింపుకున్నారని స్పష్టమవుతుంది.
