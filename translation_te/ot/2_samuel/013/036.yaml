id: 2SA.13.36
reference: 2 Samuel 13:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלֹּת֣/וֹ לְ/דַבֵּ֗ר וְ/הִנֵּ֤ה בְנֵֽי הַ/מֶּ֨לֶךְ֙ בָּ֔אוּ וַ/יִּשְׂא֥וּ קוֹלָ֖/ם וַ/יִּבְכּ֑וּ וְ/גַם הַ/מֶּ֨לֶךְ֙ וְ/כָל עֲבָדָ֔י/ו בָּכ֕וּ בְּכִ֖י גָּד֥וֹל מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: te
  text: అతడు మాట్లాడడం ముగించగానే, ఇదిగో, రాజు కుమారులు వచ్చారు. వారు తమ స్వరాలను ఎత్తి విలపించారు. రాజు, అతని సేవకులందరూ కూడా ఎంతోగా రోదించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతి గొప్ప ఏడుపుతో ఏడ్చారు”; ఇది వారి తీవ్రమైన దుఃఖాన్ని నొక్కిచెప్పే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: అతడు మాట్లాడడం ముగించగానే
  rationale: וַיְהִי అనే కథన సూత్రాన్ని తెలుగులో విడిగా అనువదించకుండా, כְּכַלֹּתוֹ యొక్క తక్షణ కాలసంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: రాజ కుమారుల రాకవైపు పాఠకుని దృష్టిని ఆకర్షించే హీబ్రూ కథన సూచిక యొక్క సజీవతను నిలుపుతుంది.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: రాజ కుమారులు
  rationale: రాజు కుమారులు అనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగు సమాసంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: సాధారణ గమన క్రియ యొక్క కథనార్థాన్ని నేరుగా అందిస్తుంది.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: వారు బిగ్గరగా ఏడ్చారు
  rationale: అక్షరార్థంగా ‘తమ స్వరం ఎత్తి ఏడ్చారు’ అనే హీబ్రూ విలాప నుడికారాన్ని సహజమైన తెలుగులో, గట్టిగా వినిపించే ఏడుపు భావంతో అందిస్తుంది.
- source_word: וְגַם הַמֶּלֶךְ
  choice: రాజు ... కూడా
  rationale: וְגַם సూచించే చేరికను తెలుగులో సహజమైన ‘కూడా’తో నిలుపుతుంది.
- source_word: וְכָל עֲבָדָיו
  choice: అతని సేవకులందరూ
  rationale: עֲבָדָיו రాజసభ సేవకులు లేదా పరిచారకులను సూచించవచ్చు; ‘సేవకులు’ అనవసరంగా వారి హోదాను నిర్దిష్టం చేయకుండా విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: ఎంతోగా రోదించారు
  rationale: సమాన మూలపదంతో ఏర్పడిన హీబ్రూ బలవర్ధక ప్రయోగాన్ని సహజమైన, గంభీరమైన తెలుగులో తీవ్రమైన దుఃఖరోదనగా వ్యక్తపరుస్తుంది; మూలరూపాన్ని పాదటిప్పణిలో చూపిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణను, ‘రోదించారు’ ద్వారా చివరి వాక్యంలోని తీవ్ర విలాపాన్ని నిలుపబడింది.
