revisions:
- from: అతడు మాట్లాడడం ముగించగానే, ఇదిగో, రాజ కుమారులు వచ్చారు. వారు బిగ్గరగా ఏడ్చారు. రాజు, అతని సేవకులందరూ కూడా ఎంతోగా రోదించారు.[a]
  to: అతడు మాట్లాడడం ముగించగానే, ఇదిగో, రాజు కుమారులు వచ్చారు. వారు తమ స్వరాలను ఎత్తి విలపించారు. రాజు, అతని సేవకులందరూ కూడా ఎంతోగా రోదించారు.[a]
  rationale: The revision preserves the draft's faithful rendering while making the first lament clause more closely reflect the Hebrew idiom וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ ('they raised their voices and wept'). It also uses a clearer modern Telugu possessive phrase for 'the king's sons.' The final emphatic mourning expression and its explanatory footnote are retained.
