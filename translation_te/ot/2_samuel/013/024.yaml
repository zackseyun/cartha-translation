revisions:
- from: అబ్షాలోము రాజు దగ్గరికి వచ్చి, “ఇదిగో, నీ సేవకుని గొర్రెల బొచ్చు కత్తిరించేవారు పని చేస్తున్నారు. దయచేసి రాజు, అతని సేవకులు నీ సేవకునితో కలిసి రావాలి” అని అన్నాడు.
  to: అబ్షాలోము రాజు వద్దకు వచ్చి, “ఇదిగో, నీ సేవకునికి గొర్రెల బొచ్చు కత్తిరించేవారు ఉన్నారు. దయచేసి రాజు తన సేవకులతో కలిసి నీ సేవకునితో రావాలి” అని అన్నాడు.
  rationale: The revision removes the unsupported explicit statement that the shearers are currently working and renders the Hebrew possession/construction more directly. It preserves the polite request, royal register, and Absalom’s self-humbling reference as “your servant.”
