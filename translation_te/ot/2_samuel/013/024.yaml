  text: וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֹּ֕אמֶר הִנֵּה נָ֥א גֹזְזִ֖ים לְ/עַבְדֶּ֑/ךָ יֵֽלֶךְ נָ֥א הַ/מֶּ֛לֶךְ וַ/עֲבָדָ֖י/ו עִם עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/024.yaml
  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: te
  text: అబ్షాలోము రాజు వద్దకు వచ్చి, “ఇదిగో, నీ సేవకునికి గొర్రెల బొచ్చు కత్తిరించేవారు ఉన్నారు. దయచేసి రాజు తన సేవకులతో కలిసి నీ సేవకునితో రావాలి” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא גֹזְזִים לְעַבְדֶּךָ
  choice: ఇదిగో, నీ సేవకుని గొర్రెల బొచ్చు కత్తిరించేవారు పని చేస్తున్నారు
  rationale: గֹזְזִים పదం అక్షరార్థంగా ‘కత్తిరించేవారు/బొచ్చు కత్తిరించేవారు’; సందర్భంలో గొర్రెల బొచ్చు కత్తిరించే కాలానుగుణ పని జరుగుతోందనే భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది. לְעַבְדֶּךָ లోని వినయపూర్వక మూడవపురుష స్వీయసూచనను ‘నీ సేవకుని’గా నిలిపింది.
- source_word: יֵלֶךְ נָא הַמֶּלֶךְ וַעֲבָדָיו
  choice: దయచేసి రాజు, అతని సేవకులు ... రావాలి
  rationale: యుస్సివ్ భావం మరియు נָא యొక్క మర్యాదపూర్వక విన్నపాన్ని ‘దయచేసి ... రావాలి’గా తెలిపింది; మాట్లాడువాని దృష్టిలో గమ్యం తనవైపు కావడం వల్ల తెలుగులో ‘రావాలి’ సహజం.
- source_word: עִם עַבְדֶּךָ
  choice: నీ సేవకునితో కలిసి
  rationale: అబ్షాలోము రాజుతో వినయంగా తనను ‘నీ సేవకుడు’ అని పేర్కొన్న రాజసభా సంభాషణ శైలిని యథాతథంగా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభా సంభాషణను నిలిపాం. ‘నీ సేవకుడు’ అనే హెబ్రీయ వినయసూత్రాన్ని సహజీకరించి ‘నేను/నాతో’గా మార్చకుండా ఉంచాం. పాఠ్యంలో పాదసూచికలు లేవు.
