source:
  edition: WLC
  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: te
  text: అయితే అబ్షాలోము పారిపోయి, గెషూరు రాజైన అమ్మీహూరు కుమారుడు తల్మయి దగ్గరకు వెళ్లాడు. దావీదు[a] తన కుమారుని కోసం అన్ని రోజులూ దుఃఖించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దావీదు’ అనే పేరు హీబ్రూ పాఠ్యంలో ఇక్కడ ప్రత్యక్షంగా లేదు; ‘దుఃఖించాడు’ అనే క్రియకు కర్త సందర్భం ద్వారా దావీదు అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם בָּרַח
  choice: అయితే అబ్షాలోము పారిపోయి
  rationale: וְ ఇక్కడ ముందటి కథనంతో వ్యత్యాసాన్ని సూచించేలా ‘అయితే’ అని సహజంగా అనువదించబడింది; בָּרַח కు ‘పారిపోయి’ కథన బలాన్ని నిలుపుతుంది.
- source_word: וַיֵּלֶךְ אֶל
  choice: దగ్గరకు వెళ్లాడు
  rationale: వ్యక్తి వద్దకు వెళ్లడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תַּלְמַי בֶּן עַמִּיחוּר מֶלֶךְ גְּשׁוּר
  choice: గెషూరు రాజైన అమ్మీహూరు కుమారుడు తల్మయి
  rationale: హీబ్రూ బంధుత్వ, బిరుదు సంబంధాలను స్పష్టమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: וַיִּתְאַבֵּל
  choice: దుఃఖించాడు
  rationale: אבל హిత్పయేల్ మరణశోకాన్ని సూచిస్తుంది; ‘దుఃఖించాడు’ సాధారణ ఆధునిక తెలుగులో సహజమైన శోకపదం.
- source_word: עַל בְּנוֹ
  choice: తన కుమారుని గురించి
  rationale: శోకానికి కారణమైన కుమారునితో సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భంలో ఆ కుమారుడు అమ్నోను.
- source_word: כָּל הַיָּמִים
  choice: రోజులన్నీ
  rationale: హీబ్రూ ‘అన్ని రోజులు’ అనే కాలవ్యాప్తి నుడికారాన్ని సంక్షిప్తంగా, సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: וַיִּתְאַבֵּל క్రియకు కర్త హీబ్రూలో ప్రత్యక్షంగా లేకపోవడం
  choice: ముఖ్య పాఠ్యంలో ‘దావీదు’ను చేర్చి పాదసూచికతో మూలంలోని అంతర్నిహితత్వాన్ని తెలిపింది
  alternative: ‘అతడు దుఃఖించాడు’ అని అస్పష్టంగా ఉంచడం
  rationale: సందర్భం ప్రకారం కర్త దావీదు; తెలుగులో స్పష్టత కోసం పేరు అవసరమైనప్పటికీ, హీబ్రూ పాఠ్యంలో కర్త అంతర్నిహితమనే నిజమైన భాషా లక్షణాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన సరళ కథనశైలి. పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని కర్త అస్పష్టత పాదసూచికలో వెల్లడించబడింది.
