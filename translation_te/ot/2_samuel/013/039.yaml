translation:
  language: te
  text: అబ్షాలోము దగ్గరికి వెళ్లాలని రాజైన దావీదు ఎంతో ఆరాటపడ్డాడు.[a] ఎందుకంటే అమ్నోను చనిపోయినందుకు కలిగిన దుఃఖం నుంచి అతడు తేరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్య నిర్మాణం అసాధారణంగా ఉంది. దీనిని “రాజైన దావీదు అబ్షాలోము దగ్గరికి వెళ్లడం మానుకున్నాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: మూలపాఠంలోని వ్యాకరణ అస్పష్టతను, ముఖ్యమైన ప్రత్యామ్నాయ అర్థాన్ని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתְּכַל
  choice: ఎంతో ఆరాటపడ్డాడు
  rationale: ఈ రూపం సాధారణంగా ‘తీవ్రంగా కోరుకొను/ఆరాటపడు’ అనే భావాన్ని ఇస్తుంది. హీబ్రూలో క్రియ స్త్రీలింగ ఏకవచనంలో ఉండి స్పష్టమైన స్త్రీలింగ కర్త లేకపోవడం వల్ల ‘దావీదు మనసు/ప్రాణం’ అనే కర్త అధ్యాహారంగా ఉన్నట్లు గ్రహించవచ్చు.
- source_word: לָצֵאת אֶל־אַבְשָׁלוֹם
  choice: అబ్షాలోము దగ్గరికి వెళ్లాలని
  rationale: ‘అబ్షాలోము వైపు బయలుదేరడం’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִחַם עַל־אַמְנוֹן
  choice: అమ్నోను చనిపోయినందుకు కలిగిన దుఃఖం నుంచి అతడు తేరుకున్నాడు
  rationale: ఇక్కడ נִחַם శోకం తగ్గి ఓదార్పు పొందడం లేదా తేరుకోవడం అనే భావాన్ని సూచిస్తుంది; తరువాతి ‘ఎందుకంటే అతడు చనిపోయాడు’ అనే కారణ వాక్యంతో సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దావీదు అబ్షాలోము దగ్గరికి వెళ్లాలని కోరుకున్నాడా, లేక వెళ్లడం మానుకున్నాడా?
  choice: వెళ్లాలని ఎంతో ఆరాటపడ్డాడు
  alternative: అబ్షాలోము దగ్గరికి వెళ్లడం మానుకున్నాడు
  rationale: మసొరా పాఠంలోని స్త్రీలింగ క్రియకు ‘దావీదు మనసు/ప్రాణం’ అనే అధ్యాహార కర్తను తీసుకోవడం సంప్రదాయబద్ధమైన, సందర్భానుకూలమైన పఠనం. అయితే వ్యాకరణ నిర్మాణం అసాధారణంగా ఉండడం వల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఎంతో ఆరాటపడ్డాడు’ భావతీవ్రతను నిలుపుతుంది; మూలంలోని నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో సంరక్షించాం.
