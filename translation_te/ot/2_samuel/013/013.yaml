  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: te
  text: నా విషయానికొస్తే, నా అవమానాన్ని ఎక్కడికి తీసుకుపోగలను?[a] నువ్వేమో ఇశ్రాయేలులోని నీచులలో ఒకడిలా అవుతావు.[b] కాబట్టి ఇప్పుడు దయచేసి రాజుతో మాట్లాడు; ఆయన నన్ను నీకు ఇవ్వకుండా ఉండడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అవమానం’కు ‘అపకీర్తి’ లేదా ‘నింద’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీచులు’కు అక్షరార్థంగా ‘మూర్ఖులు’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం కేవలం తెలివిలేనివారిని కాక, నైతికంగా సిగ్గుమాలినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, ‘ఆయన నన్ను నీకు ఇవ్వడానికి నిరాకరించడు.’ తామారు నిజమైన విజ్ఞప్తి చేసిందా, లేక అమ్నోనును ఆలస్యం చేయడానికి ఇలా చెప్పిందా అనేది స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה אוֹלִיךְ אֶת חֶרְפָּתִי
  choice: నా అవమానాన్ని ఎక్కడికి తీసుకుపోగలను?
  rationale: ‘ఎక్కడికి’ అనే గమనార్థక ప్రశ్నను, ‘తీసుకుపోవడం’ అనే హిఫీల్ క్రియలోని రూపకాన్ని నిలుపుతుంది. חֶרְפָּה ఇక్కడ బహిరంగ అపకీర్తి, అవమానం అనే భావాన్ని సూచిస్తుంది.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: నీచులలో ఒకడిలా
  rationale: נָבָל ఇక్కడ తెలివిలేమికన్నా నైతిక నీచత్వం, సిగ్గుమాలిన ప్రవర్తనను సూచిస్తుంది; అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘నీచుడు’ అనేది సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: דַּבֶּר נָא
  choice: దయచేసి ... మాట్లాడు
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన నָא లోని వేడుకోలు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יִמְנָעֵנִי מִמֶּךָּ
  choice: ఆయన నన్ను నీకు ఇవ్వకుండా ఉండడు
  rationale: హీబ్రూ వాక్యంలోని ‘నీ నుండి నన్ను నిలిపివేయడు’ అనే భావాన్ని తెలుగులో స్పష్టమైన వివాహ-ఇచ్చివేత సందర్భార్థంతో అందిస్తుంది; అయితే అది నిజంగా సాధ్యమా అనే విషయాన్ని నిర్ధారించదు.
theological_decisions:
- issue: తామారు రాజును అడగమన్న మాట యొక్క ఉద్దేశం
  choice: రాజు తనను అమ్నోనుకు ఇవ్వకుండా ఉండడని ఆమె చెప్పినట్లుగా నేరుగా అనువదించడం
  alternative: ఇది నిజమైన వివాహ ప్రతిపాదన కావచ్చు; లేదా దాడిని ఆలస్యం చేయడానికి చేసిన ఆపత్కాల ప్రయత్నం కావచ్చు
  rationale: వచనం తామారు ఉద్దేశాన్ని వివరించదు. కాబట్టి ఆమె మాట చట్టపరంగా లేదా రాజకీయంగా సాధ్యమైనదని గానీ, కేవలం వ్యూహాత్మకమని గానీ అనువాదంలో తేల్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. హీబ్రూలోని గమన రూపకం మొదటి వాక్యంలో నిలుపబడింది; చివరి వాక్యం తెలుగులో సహజంగా ఉండేందుకు సందర్భార్థంతో వ్యక్తీకరించబడింది.
