revisions:
- from: అబ్షాలోము ఆజ్ఞాపించినట్లే అతని యువకులు[a] అమ్నోనుకు చేశారు[b]. అప్పుడు రాజు కుమారులందరూ లేచి, ఒక్కొక్కరు తమ కంచరగాడిదపై ఎక్కి పారిపోయారు.
  to: అబ్షాలోము ఆజ్ఞాపించినట్లే అబ్షాలోము యువకులు[a] అమ్నోను విషయంలో చేశారు[b]. అప్పుడు రాజు కుమారులందరూ లేచి, ఒక్కొక్కరు తమ కంచరగాడిదపై ఎక్కి పారిపోయారు.
  rationale: 'The revision makes two limited idiomatic improvements: it explicitly repeats Absalom’s name, as in the Hebrew, and replaces the incomplete-sounding “అమ్నోనుకు చేశారు” with “అమ్నోను విషయంలో చేశారు.” The latter still does not state the killing in the verse itself. Footnotes remain attached to the respective lexical ambiguity and contextual ellipsis.'
