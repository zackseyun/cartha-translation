  text: וַֽ/יַּעֲשׂ֞וּ נַעֲרֵ֤י אַבְשָׁלוֹם֙ לְ/אַמְנ֔וֹן כַּ/אֲשֶׁ֥ר צִוָּ֖ה אַבְשָׁל֑וֹם וַ/יָּקֻ֣מוּ כָּל בְּנֵ֣י הַ/מֶּ֗לֶךְ וַֽ/יִּרְכְּב֛וּ אִ֥ישׁ עַל פִּרְדּ֖/וֹ וַ/יָּנֻֽסוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: te
  text: అబ్షాలోము ఆజ్ఞాపించినట్లే అబ్షాలోము యువకులు[a] అమ్నోను విషయంలో చేశారు[b]. అప్పుడు రాజు కుమారులందరూ లేచి, ఒక్కొక్కరు తమ కంచరగాడిదపై ఎక్కి పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్షాలోము సేవకులు’ లేదా ‘అబ్షాలోము పరిచారకులు.’ హీబ్రూ పదం సేవలో ఉన్న యువకులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అబ్షాలోము ఆజ్ఞాపించినట్లే అమ్నోను విషయంలో చేశారు.’ ముందరి వచనంలో, అమ్నోను ద్రాక్షారసం తాగి ఉల్లాసంగా ఉన్నప్పుడు అతనిని కొట్టి చంపాలని అబ్షాలోము ఇచ్చిన ఆజ్ఞ స్పష్టంగా ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: అబ్షాలోము యువకులు
  rationale: נַעַר అనే పదం యువకుడు, సేవకుడు లేదా పరిచారకుడు అనే భావాలను సందర్భానుసారంగా ఇవ్వగలదు. ఇక్కడ వారు అబ్షాలోము ఆజ్ఞను అమలు చేసే అతని మనుషులు; ‘యువకులు’ మూలపదంలోని వయస్సు సంబంధిత భావాన్ని నిలుపుతూ, వారి ఖచ్చితమైన సేవా హోదాను అనవసరంగా నిర్ణయించదు.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: అమ్నోనుకు చేశారు
  rationale: עשה + ל నిర్మాణంలోని సంక్షిప్తతను ఈ అనువాదం నిలుపుతుంది. వారు చేసిన హింసాత్మక కార్యం ఏమిటో ముందరి వచనంలోని ఆజ్ఞ స్పష్టం చేస్తుంది; ఈ వచనంలో లేని ‘చంపారు’ వంటి పదాన్ని ఇక్కడ చేర్చలేదు.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్లే
  rationale: అబ్షాలోము ముందుగా ఇచ్చిన ఆజ్ఞకు వారు సరిగ్గా అనుగుణంగా నడుచుకున్నారని తెలిపే తులనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: కథనంలోని ఆకస్మిక ప్రతిస్పందనను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులందరూ
  rationale: మూలంలోని construct phrase‌కు నేరమైన, సహజమైన తెలుగు రూపం; సందర్భంలో దావీదు కుమారులను సూచిస్తుంది.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: ఒక్కొక్కరు తమ కంచరగాడిదపై ఎక్కి
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు’ అని అర్థమిస్తుంది. פֶּרֶד‌కు ఖచ్చితమైన తెలుగు పదం ‘కంచరగాడిద’.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוּס సూచించే భయంతో కూడిన అత్యవసర పలాయనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
