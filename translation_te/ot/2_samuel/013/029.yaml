translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. మూలంలోని సంక్షిప్తతను ‘అమ్నోనుకు చేశారు’లో నిలిపి, హత్యను ప్రధాన పాఠ్యంలో వివరణాత్మకంగా చేర్చకుండా పూర్వసందర్భానికి వదిలాం. వ్యక్తినామాలకు తెలుగు బైబిల్ వాడుకకు అనుగుణంగా ‘అబ్షాలోము,’ ‘అమ్నోను’ రూపాలు ఉపయోగించబడ్డాయి.
