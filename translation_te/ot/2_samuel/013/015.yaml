id: 2SA.13.15
reference: 2 Samuel 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂנָאֶ֣/הָ אַמְנ֗וֹן שִׂנְאָה֙ גְּדוֹלָ֣ה מְאֹ֔ד כִּ֣י גְדוֹלָ֗ה הַ/שִּׂנְאָה֙ אֲשֶׁ֣ר שְׂנֵאָ֔/הּ מֵ/אַהֲבָ֖ה אֲשֶׁ֣ר אֲהֵבָ֑/הּ וַֽ/יֹּאמֶר לָ֥/הּ אַמְנ֖וֹן ק֥וּמִי לֵֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: te
  text: అప్పుడు అమ్నోను ఆమెను చాలా గొప్ప ద్వేషంతో ద్వేషించాడు; అతడు ఆమెను ద్వేషించిన ద్వేషం, అతడు ఆమెను ప్రేమించిన ప్రేమకంటే గొప్పది. అమ్నోను ఆమెతో, “లేచి, వెళ్లు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో అక్షరార్థంగా: “లేచి, వెళ్లు.” ఈ సంక్షిప్తమైన రెండు ఆజ్ఞలు అమ్నోను ఆమెను కఠినంగా పంపివేస్తున్నట్లు తెలియజేస్తాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ
  choice: అప్పుడు అమ్నోను ఆమెను ... ద్వేషించాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; שׂנא అంటే ‘ద్వేషించు,’ స్త్రీలింగ ఏకవచన ప్రత్యయం తామారును సూచించే ‘ఆమెను’ అనే కర్మను వ్యక్తం చేస్తుంది.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: ఎంతో తీవ్రంగా
  rationale: ఇది క్రియ యొక్క విధానాన్ని, తీవ్రతను బలపరిచే ప్రయోగం. హెబ్రీలోని ‘చాలా గొప్ప ద్వేషంతో’ అనే పదబాహుళ్యాన్ని అసహజంగా అనుకరించకుండా, ఆధునిక తెలుగులో దాని బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: '[రెండు వాక్యాల మధ్య వివరణాత్మక సంబంధం]'
  rationale: ఇది ముందటి ప్రకటనను వివరించే కారణార్థక సంబంధాన్ని సూచిస్తుంది. తెలుగులో వాక్యాన్ని విడదీసి తదుపరి వాక్యంతో వివరణ ఇవ్వడం సహజంగా ఉంది.
- source_word: גְדוֹלָה הַשִּׂנְאָה ... מֵאַהֲבָה
  choice: ప్రేమకంటే ... ద్వేషమే ఎక్కువగా ఉంది
  rationale: מִן ఇక్కడ పోలికను సూచిస్తుంది; అందువల్ల ద్వేషం ప్రేమకంటే ఎక్కువ అనే తులనను స్పష్టంగా నిలుపుతుంది.
- source_word: אֲשֶׁר שְׂנֵאָהּ / אֲשֶׁר אֲהֵבָהּ
  choice: ఆమెను ద్వేషించిన / ఆమెను ప్రేమించిన
  rationale: రెండు సంబంధవాచక ఉపవాక్యాల సమాంతర నిర్మాణాన్ని తెలుగులో సహజంగా కాపాడుతుంది; ప్రేమ ముందటి స్థితి అని సందర్భం తెలియజేస్తుంది.
- source_word: קוּמִי לֵכִי
  choice: లేచి, వెళ్లిపో
  rationale: రెండూ స్త్రీలింగ ఏకవచన ఆజ్ఞలు. ‘లేచి, వెళ్లిపో’ వాటి హఠాత్తైన, కఠినమైన పంపివేత భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
