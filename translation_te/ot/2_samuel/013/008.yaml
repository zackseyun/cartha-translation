revisions:
- from: అప్పుడు తామారు పడుకొని ఉన్న తన సోదరుడు అమ్నోను ఇంటికి వెళ్లింది. ఆమె పిండిని తీసుకొని, దాన్ని పిసికి, అతని కళ్లముందే రొట్టెలుగా ఆకారమిచ్చి[a], వాటిని వండింది[b].
  to: అప్పుడు తామారు తన సోదరుడైన అమ్నోను ఇంటికి వెళ్లింది. అతడు పడుకొని ఉన్నాడు. ఆమె పిండిని తీసుకొని, దాన్ని పిసికి, అతని కళ్లముందే పిండివంటలుగా ఆకారమిచ్చి[a], వాటిని వండింది[b].
  rationale: The revision makes Amnon's posture an explicit circumstantial statement, as in the Hebrew, while retaining the narrative flow. It also uses a broader Telugu food term for the rare and uncertain לביבות, preserving the possible heart-shape nuance exclusively in the anchored footnote.
