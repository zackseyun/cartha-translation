base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: te
  text: అప్పుడు తామారు తన సోదరుడైన అమ్నోను ఇంటికి వెళ్లింది. అతడు పడుకొని ఉన్నాడు. ఆమె పిండిని తీసుకొని, దాన్ని పిసికి, అతని కళ్లముందే పిండివంటలుగా ఆకారమిచ్చి[a], వాటిని వండింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హృదయాకారపు పిండివంటలు చేసింది.’ ఇక్కడి హీబ్రూ క్రియ, దానికి సంబంధించిన ఆహారపదం రెండూ అరుదైనవి; అవి ‘హృదయం’ అనే పదంతో సంబంధం ఉన్న ఆకారాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటిని ఉడికించింది.’ హీబ్రూ క్రియ ప్రత్యేకంగా ఉడికించడాన్ని సూచించగలదు; అయితే ఇక్కడ అది సాధారణంగా వండడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: అప్పుడు ... వెళ్లింది
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: בֵּית אַמְנוֹן אָחִיהָ
  choice: తన సోదరుడు అమ్నోను ఇంటికి
  rationale: గమ్యస్థానాన్ని, బంధుత్వాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהוּא שֹׁכֵב
  choice: పడుకొని ఉన్న
  rationale: ఇది అమ్నోను అప్పటి స్థితిని తెలిపే సందర్భార్థక ఉపవాక్యం; ‘మంచంలో ఉన్న’ అని అదనపు భావాన్ని చేర్చకుండా మూలానికి దగ్గరగా ఉంది.
- source_word: הַבָּצֵק
  choice: పిండి
  rationale: ఆహార తయారీ సందర్భంలో కలిపి సిద్ధం చేసిన dough‌ను తెలుగులో సహజంగా ‘పిండి’ అంటారు.
- source_word: וְתָלֹשׁ
  choice: దాన్ని పిసికి
  rationale: לוש పిండిని knead చేయడాన్ని సూచిస్తుంది; ‘పిసికి’ సాధారణ ఆధునిక తెలుగులో సహజమైన వంటపదం.
- source_word: וַתְּלַבֵּב
  choice: రొట్టెలుగా ఆకారమిచ్చి
  rationale: అరుదైన ఈ క్రియ తరువాతి לְבִבוֹת అనే ఆహారపదార్థాన్ని రూపుచేయడాన్ని సూచిస్తుంది; హృదయాకారం అనే అనిశ్చిత వ్యుత్పత్తిని ప్రధాన వాక్యంలో ఖరారు చేయదు.
- source_word: לְעֵינָיו
  choice: అతని కళ్లముందే
  rationale: అతను చూస్తుండగా లేదా అతని సమక్షంలో అనే భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתְּבַשֵּׁל
  choice: వండింది
  rationale: בשל సాధారణంగా వండడం, కొన్ని సందర్భాల్లో ప్రత్యేకంగా ఉడికించడం అని అర్థమవుతుంది; విధానం అనిశ్చితంగా ఉన్నందున విస్తృతార్థాన్ని ప్రధాన పాఠంలో ఉంచింది.
- source_word: הַלְּבִבוֹת
  choice: వాటిని
  rationale: ముందు పేర్కొన్న ఆకారమిచ్చిన రొట్టెలను సూచించే సహజ తెలుగు సర్వనామం; అరుదైన ఆహారపదానికి ఉన్న అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
