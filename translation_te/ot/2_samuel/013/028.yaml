source:
  edition: WLC
  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: te
  text: 'అప్పుడు అబ్షాలోము తన యువకులకు ఇలా ఆజ్ఞాపించాడు: “గమనించండి: అమ్నోను మనస్సు ద్రాక్షామద్యం వల్ల ఉల్లాసంగా ఉన్నప్పుడు[a], ‘అమ్నోనును కొట్టండి’ అని నేను మీతో చెప్పగానే, అతన్ని చంపండి. భయపడకండి. నేనే మీకు ఆజ్ఞాపించలేదా? ధైర్యంగా ఉండండి; పరాక్రమవంతులైన పురుషులుగా ఉండండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షామద్యం వల్ల అమ్నోను ఉల్లాసంగా ఉన్నప్పుడు.” హెబ్రీ నుడికారం అక్షరార్థంగా అతని హృదయం ద్రాక్షామద్యంతో మంచిగా ఉండడం గురించి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָרָיו
  choice: తన యువకులకు
  rationale: נַעַר అనే పదం సందర్భానుసారం యువకుడు, సేవకుడు, పరిచారకుడు లేదా సాయుధ అనుచరుడు అని సూచించగలదు. ఇక్కడ హింసాత్మక ఆజ్ఞను అమలు చేసే అబ్షాలోము వ్యక్తిగత అనుచరులు ఉద్దేశించబడ్డారు; ‘యువకులు’ మూలంలోని సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: רְאוּ נָא
  choice: వినండి
  rationale: ראה ఆజ్ఞారూపం నָאతో కలిసి ఇక్కడ దృశ్యంగా చూడమని మాత్రమే కాక, తదుపరి సూచనను జాగ్రత్తగా గమనించమనే పిలుపుగా ఉంది. సహజమైన ఆధునిక తెలుగులో ‘వినండి’ ఆ శ్రద్ధాపూర్వక ఆజ్ఞను వ్యక్తం చేస్తుంది.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: ద్రాక్షారసం వల్ల అమ్నోను హృదయం ఉల్లాసంగా ఉన్నప్పుడు
  rationale: ‘హృదయం మంచిగా ఉండడం’ అనే హెబ్రీ నుడికారం ద్రాక్షారసం వల్ల కలిగిన ఉల్లాస స్థితిని సూచిస్తుంది; పూర్తిగా మత్తులో ఉన్నాడని తప్పనిసరిగా చెప్పదు. మూలంలోని హృదయ-నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: అమ్నోనును కొట్టండి
  rationale: נכה విస్తృతార్థంలో కొట్టు లేదా దాడిచేయు అని అర్థం. తరువాతి క్రియ మరణకర ఫలితాన్ని స్పష్టపరుస్తుంది కాబట్టి, ఇక్కడ ‘కొట్టండి’ అనే ప్రత్యక్ష పదం అనుకూలం.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: అతన్ని చంపండి
  rationale: מות హిఫిల్ రూపం ‘చనిపోయేలా చేయు, చంపు’ అని స్పష్టంగా అర్థమిస్తుంది. తెలుగు ఆజ్ఞారూపం సహజంగా ఆ ప్రాణాంతక ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: ఇది ప్రత్యక్ష నిషేధాత్మక ఆజ్ఞ; ఆధునిక తెలుగులో ‘భయపడకండి’ సహజంగా, బలంగా ఉంటుంది.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: మీకు ఆజ్ఞాపించింది నేనే కదా?
  rationale: אָנֹכִיలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది. הֲלוֹאతో వచ్చిన అలంకార ప్రశ్నను ‘కదా?’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חִזְקוּ
  choice: ధైర్యంగా ఉండండి
  rationale: חזק ఆజ్ఞారూపం బలం లేదా ధైర్యం చూపమనే పిలుపు. ఈ హింసాత్మక చర్యకు ముందు ఉన్న సందర్భంలో ‘ధైర్యంగా ఉండండి’ సహజమైన భావసమానం.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: పరాక్రమవంతులైన పురుషులుగా ఉండండి
  rationale: בני חיל అనేది సామర్థ్యం, శౌర్యం, పరాక్రమం గల పురుషులను సూచించే, తరచుగా యుద్ధ సంబంధమైన నుడికారం. సంబోధితులు పురుష అనుచరులు కావడంతో లింగసూచనను నిలిపాం.
theological_decisions:
- issue: לִבְנֵי חָיִלలో లింగసూచక వ్యక్తీకరణ
  choice: పరాక్రమవంతులైన పురుషులుగా ఉండండి
  alternative: పరాక్రమంగా ఉండండి
  rationale: హెబ్రీ వ్యక్తీకరణ వ్యాకరణపరంగాను, సందర్భపరంగాను పురుషులను సూచిస్తుంది; ఇది అబ్షాలోము పురుష అనుచరులకు ఇచ్చిన ఆజ్ఞ. లింగతటస్థ అనువాదం మూలంలోని సామాజిక, కథన సందర్భాన్ని సపాటుచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథన శైలి. హింసాత్మక ఆజ్ఞను శుద్ధీకరించకుండా నేరుగా అనువదించాం. ద్రాక్షారసం వల్ల కలిగిన స్థితిని పూర్తిస్థాయి మత్తుగా అతివ్యాఖ్యానించకుండా మూల నుడికారాన్ని పాఠ్యంలో, దాని సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
