revisions:
- from: 'అప్పుడు అబ్షాలోము తన యువకులకు ఇలా ఆజ్ఞాపించాడు: “వినండి, ద్రాక్షారసం వల్ల అమ్నోను హృదయం ఉల్లాసంగా ఉన్నప్పుడు[a], ‘అమ్నోనును కొట్టండి’ అని నేను మీతో చెప్పగానే, అతన్ని చంపండి. భయపడకండి. మీకు ఆజ్ఞాపించింది నేనే కదా? ధైర్యంగా ఉండండి; పరాక్రమవంతులైన పురుషులుగా ఉండండి.”'
  to: 'అప్పుడు అబ్షాలోము తన యువకులకు ఇలా ఆజ్ఞాపించాడు: “గమనించండి: అమ్నోను మనస్సు ద్రాక్షామద్యం వల్ల ఉల్లాసంగా ఉన్నప్పుడు[a], ‘అమ్నోనును కొట్టండి’ అని నేను మీతో చెప్పగానే, అతన్ని చంపండి. భయపడకండి. నేనే మీకు ఆజ్ఞాపించలేదా? ధైర్యంగా ఉండండి; పరాక్రమవంతులైన పురుషులుగా ఉండండి.”'
  rationale: The revision corrects the attentional imperative from ‘listen’ to ‘watch/take notice’ (‘గమనించండి’) and specifies wine as ‘ద్రాక్షామద్యం.’ It uses idiomatic ‘మనస్సు’ in the main text while preserving the Hebrew ‘heart’ idiom in the footnote. No interpretive or doctrinal additions have been made.
  reviewer_model: gpt-5.6-terra
