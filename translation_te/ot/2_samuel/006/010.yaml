source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֣ה דָוִ֗ד לְ/הָסִ֥יר אֵלָ֛י/ו אֶת אֲר֥וֹן יְהוָ֖ה עַל עִ֣יר דָּוִ֑ד וַ/יַּטֵּ֣/הוּ דָוִ֔ד בֵּ֥ית עֹבֵֽד אֱד֖וֹם הַ/גִּתִּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: te
  text: అందుచేత దావీదు యెహోవా మందసాన్ని తన దగ్గరకు, దావీదు నగరానికి తీసుకురావడానికి ఇష్టపడలేదు.[a] కాబట్టి దావీదు దాన్ని గిత్తీయుడైన[b] ఓబేదెదోము ఇంటివైపు మళ్లించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు నగరానికి పైకి తీసుకురావడానికి.” హెబ్రీ ఉపసర్గ కేవలం గమ్యాన్ని మాత్రమే కాక, ఒక స్థలం వైపు లేదా పైకి కదలడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గాతు వాడైన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: ఇష్టపడలేదు
  rationale: ఈ క్రియ సమ్మతి లేదా సంసిద్ధతను సూచిస్తుంది. సందర్భంలో భయంతో కూడిన అయిష్టతను సహజంగా తెలియజేస్తుంది; ‘నిరాకరించాడు’ అనే మరింత బలమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: לְהָסִיר אֵלָיו
  choice: తన దగ్గరికి తీసుకురావడానికి
  rationale: הֵסִיר యొక్క మూలభావం తొలగించడం లేదా పక్కకు మళ్లించడం అయినా, ఇక్కడ మందసాన్ని దావీదు ఉన్న చోటికి తరలించడమే సందర్భానుగుణ భావం. తెలుగులో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: నిబంధన మందసాన్ని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదప్రయోగం; יְהוָה అనే దైవనామాన్ని లిప్యంతరీకరించి నిలుపుతుంది.
- source_word: עַל עִיר דָוִד
  choice: దావీదు నగరంలోని
  rationale: దావీదు తన దగ్గరికి తీసుకురావడం మరియు దావీదు నగరం అనే గమ్యాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది. עַל ఇక్కడ నగరం వైపు లేదా పైకి కదలికను కూడా సూచించగలదని పాదటిప్పణిలో ఉంచబడింది.
- source_word: וַיַּטֵּהוּ
  choice: దాన్ని … ఇంటివైపు మళ్లించాడు
  rationale: נטה ఇక్కడ ముందుగా ఉద్దేశించిన గమ్యం నుండి వేరొక చోటికి మళ్లించడాన్ని సూచిస్తుంది. ‘మళ్లించాడు’ ఆ వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ఓబేదెదోము ఇంటివైపు
  rationale: בֵּית ఇల్లు లేదా ఇంటివారిని సూచించవచ్చు. మందసం ఉంచబడిన భౌతిక నివాసమే ఈ సందర్భంలో ప్రధాన భావం.
- source_word: הַגִּתִּי
  choice: గిత్తీయుడైన
  rationale: గాతుతో సంబంధమున్న వ్యక్తిని సూచించే హెబ్రీ జాతి/స్థలనామ విశేషణాన్ని సంప్రదాయ రూపంలో నిలుపుతుంది; స్పష్టమైన భౌగోళిక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం వ్యక్తిగత నామాన్ని నిలుపుతుంది; దానిని బిరుదుగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం,’ ‘గిత్తీయుడు’ వంటి బైబిలు సందర్భానికి స్థిరమైన పదాలను ఉంచుతూ, వాక్యనిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా తీర్చిదిద్దాం.
