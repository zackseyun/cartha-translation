reference: 2 Samuel 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: te
  text: యాహ్వే మందసం గిత్తీయుడైన[a] ఓబేదెదోము ఇంట్లో మూడు నెలలపాటు ఉండింది. యాహ్వే ఓబేదెదోమును, అతని ఇంటివారందరినీ[b] ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘గిత్తీయుడు’; అంటే గాతు పట్టణంతో అనుబంధమున్న వ్యక్తి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘అతని ఇల్లంతటినీ.’ హీబ్రూ పదం అతని కుటుంబాన్ని లేదా గృహస్థ పరివారమంతటినీ విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ఉండింది
  rationale: ישׁב అనే క్రియకు ‘కూర్చుండు, నివసించు, ఉండు’ అనే అర్థాలున్నాయి. మందసం కర్తగా ఉండి, కాలవ్యవధి వెంట వస్తున్న ఈ సందర్భంలో ‘ఉండింది’ సహజంగా ఉండటంతో పాటు అక్కడే కొనసాగి ఉన్న భావాన్ని తెలియజేస్తుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. אֲרוֹן‌కు ఈ సందర్భంలో స్థిరపడిన అర్థమైన ‘మందసం’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ఓబేదెదోము ఇంట్లో
  rationale: ఇక్కడ בֵּית భౌతిక నివాసస్థలాన్ని సూచిస్తుంది; తెలుగు స్థలవాచక ప్రయోగానికి అనుగుణంగా ‘ఇంట్లో’ అని అనువదించబడింది.
- source_word: עֹבֵד אֱדֹם
  choice: ఓబేదెదోము
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הַגִּתִּי
  choice: గిత్తీయుడైన
  rationale: గాతుతో అనుబంధమున్న వ్యక్తిని సూచించే జాతివాచక విశేషణాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా నిలుపుతుంది.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: మూడు నెలలపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలిపేందుకు ‘పాటు’ చేర్చబడింది; ఇది మూలంలోని అర్థాన్నే స్పష్టం చేస్తుంది.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך క్రియకు ప్రామాణికమైన, సందర్భానికి తగిన తెలుగు సమానార్థకం.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: ఓబేదెదోమును, అతని ఇంటివారందరినీ
  rationale: כָּל בֵּיתוֹ అక్షరార్థంగా ‘అతని ఇల్లంతటిని’ అనగలిగినా, ఇక్కడ కుటుంబం మరియు గృహస్థ పరివారాన్ని సూచించే విస్తృత సామాజిక భావాన్ని ‘ఇంటివారందరినీ’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. దానిని ఒక బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం వ్యక్తిగత నామ స్వభావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మందసం,’ ‘ఆశీర్వదించాడు’ వంటి స్థిరపడిన బైబిల్ పదజాలాన్ని నిలిపి, అసహజమైన పదశః నిర్మాణాలను నివారించాం. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
