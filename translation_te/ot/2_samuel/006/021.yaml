source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: te
  text: 'దావీదు మీకాలుతో ఇలా అన్నాడు: “నీ తండ్రికంటే, అతని ఇంటివారందరికంటే నన్ను ఎన్నుకొని, యాహ్వే ప్రజలమీద—ఇశ్రాయేలుమీద—నన్ను నాయకునిగా నియమించిన యాహ్వే సన్నిధిలోనే నేను సంబరమాడాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నాట్యం చేశాను.” ఇక్కడి హీబ్రూ క్రియ నృత్యానికే పరిమితం కాకుండా, ఆనందోత్సాహంతో సంబరపడడాన్ని లేదా ఆటపాటలతో ఉల్లాసించడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: ఈ పదబంధం యాహ్వే సమక్షంలో చేసిన కార్యాన్ని సూచిస్తుంది. ‘సన్నిధిలో’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, వచనంలోని పునరుక్త ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: నీ తండ్రికంటే, అతని ఇంటివారందరికంటే నన్ను ఎన్నుకొని
  rationale: בחר తరువాతి מן పోలికతో పాటు ఒకరిని మరొకరి స్థానంలో ఎంచుకున్న భావాన్నీ కలిగిస్తుంది. ‘కంటే ... నన్ను ఎన్నుకొని’ అనే రూపం దావీదును సౌలు వంశానికి బదులుగా ఎంచుకున్న సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఇల్లు’లోని కుటుంబ/వంశ భావాన్ని ‘ఇంటివారు’ తెలియజేస్తుంది.
- source_word: לְצַוֹּת אֹתִי
  choice: నన్ను ... నియమించిన
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అయినా, ఇక్కడ వెంట వచ్చే అధికార పదవితో కలిసి నియామకం లేదా బాధ్యత అప్పగింపును సూచిస్తుంది.
- source_word: נָגִיד
  choice: నాయకుడు
  rationale: ఈ పదం అధికారంతో నియమించబడిన పాలక నాయకుణ్ణి సూచిస్తుంది. ‘నాయకుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ‘రాజు’ అని మూలానికంటే నిర్దిష్టం చేయదు.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: యాహ్వే ప్రజలమీద—ఇశ్రాయేలుమీద
  rationale: రెండుసార్లు వచ్చిన עַל భావాన్ని నిలుపుతూ, యాహ్వే ప్రజలు ఎవరో ‘ఇశ్రాయేలు’ అనే పునర్వివరణను అలాగే ఉంచాం.
- source_word: וְשִׂחַקְתִּי
  choice: నేను సంబరమాడాను
  rationale: שׂחק ఆనందభరితమైన, ఉత్సవపూర్వక లేదా ఆటపాటలతో కూడిన చర్యను సూచించగల విస్తృత పదం. ముందరి వచనాల్లో నృత్యానికి వాడిన మరింత నిర్దిష్టమైన క్రియలతో దీనిని కలిపివేయకుండా ‘సంబరమాడాను’ అని అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు సమీపమైన రూపాన్ని నిలిపాం.
- issue: దావీదు చివరిగా పేర్కొన్న చర్యను నిర్దిష్టంగా నృత్యమని అనువదించాలా
  choice: సంబరమాడాను
  alternative: నాట్యం చేశాను
  rationale: ఇక్కడి שׂחק నృత్యానికే పరిమితమైన పదం కాదు; ఆనందోత్సాహంతో చేసిన చర్య అనే విస్తృత భావం ఉంది. సందర్భం వల్ల ‘నాట్యం చేశాను’ సాధ్యమైనా, ఆ నిర్దిష్టతను ప్రధాన పాఠ్యంలో బలవంతంగా మోపకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. మూలంలోని దైవనామం, ఇశ్రాయేలుపై నాయకత్వ నియామకం, చివరి క్రియలోని విస్తృతార్థం నిలుపబడ్డాయి.
