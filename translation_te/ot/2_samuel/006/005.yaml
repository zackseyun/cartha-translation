  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דָוִ֣ד וְ/כָל בֵּ֣ית יִשְׂרָאֵ֗ל מְשַֽׂחֲקִים֙ לִ/פְנֵ֣י יְהוָ֔ה בְּ/כֹ֖ל עֲצֵ֣י בְרוֹשִׁ֑ים וּ/בְ/כִנֹּר֤וֹת וּ/בִ/נְבָלִים֙ וּ/בְ/תֻפִּ֔ים וּ/בִ/מְנַֽעַנְעִ֖ים וּֽ/בְ/צֶלְצֶלִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: te
  text: దావీదు, ఇశ్రాయేలు వంశమంతా యాహ్వే సన్నిధిలో సైప్రస్ చెక్కతో చేసిన వివిధ వాద్యాలతో[a]—లైర్లతో, స్వరమండలాలతో, కంజీరాలతో, గిలకలతో[b], తాళాలతో—సంబరాలు చేసుకుంటున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అన్ని రకాల సైప్రస్ చెక్కలతో.” ఇది బహుశా ఆ చెక్కతో చేసిన వివిధ వాద్యాలను సూచిస్తుంది. చెట్టు జాతి ఖచ్చితంగా తెలియదు; సైప్రస్, ఫర్ లేదా జూనిపర్ కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “గిలకలు” అని అనువదించిన వాద్యాల ఖచ్చిత రూపం తెలియదు; అవి సిస్ట్రాలు లేదా ఊపి మోగించే వేరే వాద్యాలు కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆడుతూ ఆనందిస్తున్నారు.” హీబ్రూ క్రియ ఉత్సవపూర్వకమైన ఆటను, ప్రదర్శనను లేదా ఆనందోత్సాహాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: సంబరాలు చేసుకుంటున్నారు
  rationale: పియేల్ రూపంలోని ఈ క్రియ ఇక్కడ వాద్యాలతో కూడిన ఉత్సవపూర్వక ఆనందాన్ని సూచిస్తుంది. ‘సంబరాలు చేసుకుంటున్నారు’ అనేది కేవలం ఆట అనే భావాన్ని కలిగించకుండా సామూహిక ఉల్లాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగిన కార్యాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దైవనామాన్ని పేరుగానే నిలుపుతుంది.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారందరూ
  rationale: ‘ఇశ్రాయేలు ఇంటివారు’ అనే సామూహిక హీబ్రూ వ్యక్తీకరణను పూర్తిగా నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: వివిధ రకాల సరళచెక్క వాద్యాలతో
  rationale: మూలంలోని ‘అన్ని/అన్నిరకాల సరళ చెక్కలతో’ అనే క్లిష్టమైన, సంక్షిప్త పదబంధంలో వాద్యాలు సూచితమై ఉన్నట్లు సందర్భం తెలుపుతుంది. పాఠ్యంలో ఆ సూచిత భావాన్ని స్పష్టం చేసి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בְרוֹשִׁים
  choice: సరళచెక్క
  rationale: ఈ చెట్టు జాతి ఖచ్చితంగా తెలియదు. ‘సరళ’ అనేది సైప్రస్/ఫర్ వర్గపు నాణ్యమైన కలపకు అందుబాటులో ఉన్న తెలుగు సమానార్థకం; జాతి అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: כִנֹּרוֹת
  choice: తంతివీణలు
  rationale: כִּנּוֹר ఒక లైర్ తరహా తంతివాద్యం. సాధారణ ‘వీణ’ కంటే ‘తంతివీణ’ వాద్య స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נְבָלִים
  choice: స్వరమండలాలు
  rationale: ఇది כִּנּוֹר నుండి వేరైన తంతివాద్యం. ఖచ్చిత నిర్మాణం అనిశ్చితమైనప్పటికీ, ‘స్వరమండలం’ భిన్నమైన తంతివాద్యాన్ని తెలుగులో గౌరవప్రదంగా, అర్థవంతంగా సూచిస్తుంది.
- source_word: תֻפִּים
  choice: కంజీరాలు
  rationale: תֹּף చేతితో వాయించే చట్రపు డప్పు లేదా టాంబురీన్. ఆధునిక తెలుగు పాఠకులకు ‘కంజీరాలు’ సులభంగా అర్థమయ్యే సమీప వాద్యపదం.
- source_word: מְנַעַנְעִים
  choice: గిలకలు
  rationale: అరుదైన ఈ పదం ఊపి శబ్దం చేసే వాద్యాలను సూచించే అవకాశం ఉంది. ‘గిలకలు’ సహజమైన తెలుగు పదం; ఖచ్చిత గుర్తింపు అనిశ్చితమని పాదసూచిక తెలియజేస్తుంది.
- source_word: צֶלְצֶלִים
  choice: తాళాలు
  rationale: ఒకదానితో ఒకటి ఢీకొట్టి మోగించే లోహ వాద్యాలను సూచించే ప్రామాణిక, సులభ తెలుగు పదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం పేరును పేరుగానే నిలుపుతుంది; బిరుదుగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వాద్యాల జాబితాలో లయను నిలుపుతూ, ప్రాచీన వాద్యాల గుర్తింపులో ఉన్న నిజమైన అనిశ్చితిని పాదసూచికల్లో సంరక్షించాం. ప్రధాన వాక్యంలో ప్రతి పాదసూచిక గుర్తు [a], [b], [c] చేర్చబడింది.
