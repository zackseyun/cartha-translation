- from: దావీదు, ఇశ్రాయేలు ఇంటివారందరూ యెహోవా సన్నిధిలో వివిధ రకాల సరళచెక్క వాద్యాలతో[a]—తంతివీణలతో, స్వరమండలాలతో, కంజీరాలతో, గిలకలతో[b], తాళాలతో—సంబరాలు చేసుకుంటున్నారు[c].
  to: దావీదు, ఇశ్రాయేలు వంశమంతా యాహ్వే సన్నిధిలో సైప్రస్ చెక్కతో చేసిన వివిధ వాద్యాలతో[a]—లైర్లతో, స్వరమండలాలతో, కంజీరాలతో, గిలకలతో[b], తాళాలతో—సంబరాలు చేసుకుంటున్నారు[c].
  rationale: దైవనామాన్ని అందించిన నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. ఇశ్రాయేలు ప్రజలను సూచించే హీబ్రూ సామూహిక పదబంధాన్ని సహజమైన ‘ఇశ్రాయేలు వంశమంతా’గా సవరించాం. వృక్షజాతి విషయంలో ఉన్న అనిశ్చితిని పాదసూచికలో కాపాడుతూ, వాద్యాల జాబితా మరియు ఉత్సవభావాన్ని మూలానికి సమీపంగా ఉంచాం.
