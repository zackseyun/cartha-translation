translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని పునరుక్తి నిలిపి, గిబియా/కొండ అనే నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరచాం.
