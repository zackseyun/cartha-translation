id: 2SA.6.3
reference: 2 Samuel 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: te
  text: వారు దేవుని మందసాన్ని ఒక కొత్త బండిపై ఉంచి, కొండమీద ఉన్న[a] అబీనాదాబు ఇంటి నుండి దాన్ని తీసుకొచ్చారు; అబీనాదాబు కుమారులైన ఉజ్జా, అహ్యో ఆ కొత్త బండిని నడిపిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గిబియాలో ఉన్న.” ఈ పదబంధాన్ని కొండను సూచించే వర్ణనగా కాక స్థలనామంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: బండిపై ఉంచి
  rationale: רכב హిఫీల్ రూపం ‘ఎక్కించడం/మీద ఉంచడం’ అనే భావాన్ని ఇస్తుంది. మందసం మరియు బండి సందర్భంలో ‘బండిపై ఉంచి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ఈ పవిత్ర వస్తువుకు ప్రామాణిక తెలుగు బైబిలు పదమైన ‘మందసం’ను వాడటం ద్వారా సందర్భోచిత అర్థం నిలుస్తుంది.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: ఒక కొత్త బండిపై
  rationale: אֶל ఇక్కడ బండిమీదికి ఉంచడాన్ని సూచిస్తుంది; עֲגָלָהకు ‘బండి’ సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: וַיִּשָּׂאֻהוּ
  choice: దాన్ని తీసుకొచ్చారు
  rationale: נשאకు ఎత్తడం, మోయడం, తీసుకురావడం అనే అర్థాలు ఉన్నాయి. మందసం అప్పటికే బండిపై ఉన్నందున, చేతులతో మోశారనే అనవసర భావం రాకుండా సందర్భానుసారంగా ‘తీసుకొచ్చారు’ అని అనువదించబడింది.
- source_word: מִבֵּית אֲבִינָדָב
  choice: అబీనాదాబు ఇంటి నుండి
  rationale: హీబ్రూ నిర్మాణానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: కొండమీద ఉన్న
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న גִּבְעָהను ప్రధాన పాఠ్యంలో భౌగోళిక వర్ణనగా తీసుకున్నాం; స్థలనామంగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: ఉజ్జా, అహ్యో
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: בְּנֵי אֲבִינָדָב
  choice: అబీనాదాబు కుమారులైన
  rationale: ఈ కథన సందర్భంలో בְּנֵי సహజంగా ప్రత్యక్ష కుమారులను సూచిస్తుంది.
- source_word: נֹהֲגִים
  choice: నడిపిస్తున్నారు
  rationale: נהג బండిని లేదా దానిని లాగే జంతువులను నడిపించడం/మార్గనిర్దేశం చేయడం సూచిస్తుంది; ‘బండిని నడిపిస్తున్నారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: ఆ కొత్త బండిని
  rationale: మూలంలోని పునరుక్తిని కథన ప్రాధాన్యం మరియు పదసామ్యాన్ని కాపాడటానికి నిలిపాం.
