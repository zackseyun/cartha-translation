source:
  edition: WLC
  text: וְ/דָוִ֛ד מְכַרְכֵּ֥ר בְּ/כָל עֹ֖ז לִ/פְנֵ֣י יְהוָ֑ה וְ/דָוִ֕ד חָג֖וּר אֵפ֥וֹד בָּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: te
  text: దావీదు యాహ్వే సన్నిధిలో తన పూర్ణ శక్తితో నాట్యం చేస్తూ ఉన్నాడు[a]. దావీదు నారతో చేసిన ఏఫోదును ధరించి ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గిరగిరా తిరుగుతూ ఉన్నాడు’ లేదా ‘గెంతుతూ ఉన్నాడు’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం వేడుకలోని బలమైన, ఉత్సాహభరితమైన కదలికను చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఏఫోదు అనేది యాజక లేదా ఆరాధనా సేవతో సంబంధమున్న ప్రత్యేక వస్త్రం; ఇక్కడ దావీదు నారతో చేసిన ఏఫోదును ధరించినట్లు చెప్పబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: ఉత్సాహంగా నాట్యం చేస్తూ ఉన్నాడు
  rationale: ఈ హెబ్రీ భాగధాతువు వేడుకలో చేసే బలమైన, ఉత్సాహభరితమైన శరీర కదలికను సూచిస్తుంది. సాధారణ పాఠకులకు ‘నాట్యం’ సహజంగా అర్థమవుతుంది; ‘ఉత్సాహంగా’ అనే పదం కదలిక తీవ్రతను తెలియజేస్తుంది, అయితే నిర్దిష్టంగా గిరగిరా తిరిగాడని లేదా గెంతాడని తేల్చదు.
- source_word: בְּכָל עֹז
  choice: తన శక్తినంతా ఉపయోగించి
  rationale: ఈ పదబంధం సంపూర్ణ శక్తితో, తీవ్రంగా చేయడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం అర్థాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో’. ఆధునిక తెలుగులో ‘సన్నిధిలో’ సహజంగా ఉండి దేవుని సమక్షంలో జరిగిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: חָגוּר
  choice: ధరించి ఉన్నాడు
  rationale: ఈ రూపం వస్త్రాన్ని కట్టుకొని లేదా ధరించి ఉన్న స్థితిని సూచిస్తుంది. ‘ధరించి ఉన్నాడు’ ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: ఇది ఇశ్రాయేలీయుల ఆరాధనతో సంబంధమున్న ప్రత్యేక వస్త్రం; ఖచ్చితమైన తెలుగు సమానపదం లేకపోవడంతో సాంకేతిక పదాన్ని లిప్యంతరీకరించాం.
- source_word: בָּד
  choice: నారతో చేసిన
  rationale: ఇక్కడ בָּד వస్త్రపు పదార్థమైన నారను సూచిస్తుంది. మూలంలో లేని నాణ్యతా భావాన్ని చేర్చకుండా పదార్థాన్ని మాత్రమే తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా విస్తృత గుర్తింపు పొందిన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: దావీదు ధరించిన ఏఫోదు స్వభావం
  choice: మూలపాఠం చెప్పినట్లుగా నారతో చేసిన ఏఫోదు అని మాత్రమే పేర్కొనడం
  alternative: యాజక వస్త్రం అని ప్రధాన వాక్యంలో స్పష్టీకరించడం
  rationale: ఏఫోదు ఆరాధనా లేదా యాజక సంబంధ వస్త్రమైనా, ఈ వాక్యం దావీదు యాజక పదవిని స్వీకరించాడని స్పష్టంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాత్మక నిర్ణయాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా సాంస్కృతిక వివరణను పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హెబ్రీ వాక్యంలోని కొనసాగుతున్న చర్యను ‘చేస్తూ ఉన్నాడు/ధరించి ఉన్నాడు’ రూపాలతో నిలిపాం. సాంకేతిక సాంస్కృతిక పదమైన ‘ఏఫోదు’ను లిప్యంతరీకరించి పాదసూచికలో వివరించాం.
