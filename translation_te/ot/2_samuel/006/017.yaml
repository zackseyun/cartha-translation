source:
  edition: WLC
  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: te
  text: వారు యాహ్వే మందసాన్ని తీసుకొచ్చి, దావీదు దాని కోసం వేసిన గుడారంలో దాని స్థానంలో ఉంచారు. తరువాత దావీదు యాహ్వే సన్నిధిలో దహనబలులను, సమాధాన బలులను[a] అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులు”; “క్షేమ బలులు” అని కూడా అనువదించవచ్చు.
    reason: שְׁלָמִים అనే హీబ్రూ పదానికి ‘సమాధాన బలులు’తో పాటు సహవాసం లేదా క్షేమం/శ్రేయస్సును సూచించే ప్రత్యామ్నాయ అనువాదాలు ఉన్నాయి.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: యాహ్వే మందసం
  rationale: אֲרוֹן అనేది పవిత్ర మందసం లేదా పెట్టెను సూచిస్తుంది. మూలంలో లేని ‘ఒడంబడిక’ అనే పదాన్ని చేర్చకుండా, తెలుగులో స్థిరపడిన ‘మందసం’ను వాడాం; יְהוָהను వ్యక్తిగత దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: וַיָּבִאוּ
  choice: తీసుకొచ్చి
  rationale: בוא యొక్క హిఫీల్ రూపం దానిని నిర్దిష్ట స్థలంలోకి తీసుకురావడాన్ని సూచిస్తుంది; ‘తీసుకొచ్చి’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: దాని స్థానంలో ఉంచారు
  rationale: יצג ఇక్కడ ఒక వస్తువును నిర్దేశిత స్థానంలో నిలిపి ఉంచడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో అనవసరమైన సర్వనామ పునరుక్తిని నివారిస్తూ భావాన్ని నిలిపాం.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: గుడారం మధ్యలో
  rationale: בְּתוֹךְ లోపలి భాగాన్ని సూచిస్తుంది. ‘గుడారం మధ్యలో’ మూలపద నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; ఇది తప్పనిసరిగా ఖచ్చితమైన కేంద్రబిందువును నిర్ధారించదు.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: దావీదు దాని కోసం వేసిన
  rationale: గుడారంతో వాడిన נטה అంటే దాన్ని పరచడం లేదా వేయడం. לוֹ సందర్భంలో మందసాన్ని సూచిస్తుంది కాబట్టి ‘దాని కోసం’ అని స్పష్టం చేశాం.
- source_word: וַיַּעַל דָּוִד
  choice: దావీదు ... అర్పించాడు
  rationale: బలుల సందర్భంలో עלה హిఫీల్ రూపం ‘అర్పించడం’ అనే ఆచారార్థాన్ని ఇస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులను
  rationale: עֹלָה పూర్తిగా దహనం చేసి అర్పించే బలికి స్థిరమైన పదం; మూలంలోని బహువచనాన్ని నిలిపాం.
- source_word: וּשְׁלָמִים
  choice: సమాధాన బలులను
  rationale: שְׁלָמִיםకు సంప్రదాయబద్ధమైన, గుర్తుపట్టగల తెలుగు సమానం ‘సమాధాన బలులు’; సహవాసం లేదా క్షేమం అనే భావ ఛాయలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అక్షరార్థంగా ‘ముందు’ అయినా, ఆరాధనా సందర్భంలో ‘సన్నిధిలో’ సహజంగా దైవ సమక్షాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించే ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: שְׁלָמִים బలుల భావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: హీబ్రూ పదంలో సమాధానం, సంపూర్ణ క్షేమం, బలిభోజన సహవాసం వంటి అనుబంధ భావాలు ఉన్నాయి. ప్రధాన పాఠంలో స్థిరమైన పదాన్ని ఉంచి, ఇతర సాధ్యమైన భావవ్యక్తీకరణలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆరాధనా శైలిని వాడాం. హీబ్రూ కథన క్రమాన్ని సహజ తెలుగు వాక్యసంధులతో వ్యక్తం చేశాం. పాదటిప్పణి సూచికను దానికి సంబంధించిన ‘సమాధాన బలులు’ దగ్గరే ఉంచాం.
