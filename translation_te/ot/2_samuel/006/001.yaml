  text: וַ/יֹּ֨סֶף ע֥וֹד דָּוִ֛ד אֶת כָּל בָּח֥וּר בְּ/יִשְׂרָאֵ֖ל שְׁלֹשִׁ֥ים אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/001.yaml
  text: David again gathered all the chosen men of Israel[a], thirty thousand.
translation:
  language: te
  text: దావీదు మళ్లీ ఇశ్రాయేలులోని ఎంపికైన పురుషులందరినీ[a] సమకూర్చాడు—ముప్పై వేల మందిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యువకులను’ లేదా ‘శ్రేష్ఠమైన పురుషులను’ అని కూడా అనువదించవచ్చు. బָּחוּר అనే హీబ్రూ పదం యౌవనాన్ని గానీ, ఎంపిక చేయబడిన లేదా శ్రేష్ఠమైన వారిని గానీ సూచించగలదు; ఇక్కడి సమీకరణ సందర్భం ‘ఎంపికైన పురుషులు’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: మళ్లీ
  rationale: יסף + עוד అనే హీబ్రూ ప్రయోగం ఇక్కడ గత చర్యకు మరొక చర్యను చేర్చడంకన్నా, చర్య పునరావృతమైందని సూచిస్తుంది.
- source_word: אֶת כָּל
  choice: అందరినీ
  rationale: אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుండగా, כָּל సమగ్రతను తెలియజేస్తుంది; తెలుగులో ‘అందరినీ’ సహజంగా రెండింటి వాక్యపాత్రను వ్యక్తం చేస్తుంది.
- source_word: בָּחוּר
  choice: ఎంపికైన పురుషులు
  rationale: ఈ పదం ‘యువకులు’ అని కూడా అర్థమివ్వగలదు; అయితే సంఖ్యతో కూడిన సమీకరణ సందర్భంలో ఎంపిక చేయబడిన లేదా శ్రేష్ఠమైన పురుషులు అనే భావం ఎక్కువగా సరిపోతుంది. మూలంలోని భావసందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని
  rationale: ב ఉపసర్గను నిలుపుకుంటూ, ఇశ్రాయేలు సమూహంలోనివారనే విభాగార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: ముప్పై వేల మంది
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదించి, వ్యక్తులను లెక్కిస్తున్నందున తెలుగులో సహజమైన ‘మంది’ వర్గసూచకాన్ని చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, అర్థాన్ని స్పష్టంగా ఉంచేందుకు సంఖ్యను విడి వాక్యభాగంగా ఇచ్చాం; బָּחוּר పదంలోని నిజమైన భావసందిగ్ధతను పాదసూచికలో పరిరక్షించాం.
