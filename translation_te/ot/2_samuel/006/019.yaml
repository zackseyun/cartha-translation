  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని పునరుక్తి భావాన్ని పూర్తిగా తొలగించకుండా ‘అంటే’తో వివరణాత్మక సంబంధం చూపించాం. అరుదైన אֶשְׁפָּר పదంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠంలో సాధ్యమైన అర్థంతోనూ, పాదసూచికలో ప్రత్యామ్నాయంతోనూ కాపాడాం.
