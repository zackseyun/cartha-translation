source:
  edition: WLC
  text: וַ/יְחַלֵּ֨ק לְ/כָל הָ/עָ֜ם לְ/כָל הֲמ֣וֹן יִשְׂרָאֵל֮ לְ/מֵ/אִ֣ישׁ וְ/עַד אִשָּׁה֒ לְ/אִ֗ישׁ חַלַּ֥ת לֶ֨חֶם֙ אַחַ֔ת וְ/אֶשְׁפָּ֣ר אֶחָ֔ד וַ/אֲשִׁישָׁ֖ה אֶחָ֑ת וַ/יֵּ֥לֶךְ כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: te
  text: అతడు ప్రజలందరికీ, ఇశ్రాయేలు జనసమూహమంతటికీ—పురుషుల నుండి స్త్రీల వరకు[a]—ఒక్కొక్కరికి ఒక రొట్టె, ఒక మాంసపు భాగం[b], ఒక ఎండుద్రాక్షల అప్పం పంచిపెట్టాడు. తరువాత ప్రజలందరూ తమతమ ఇళ్లకు వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘పురుషుని నుండి స్త్రీ వరకు.’ ఇది పురుషులనూ స్త్రీలనూ కలుపుకొని అక్కడ సమకూడిన ప్రజలందరినీ సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఒక కొలత/భాగం.’ ఇక్కడున్న אֶשְׁפָּר అనే హీబ్రూ పదం అరుదైనది. ముఖ్యంగా 1 దినవృత్తాంతాలు 16:3లోని సమాంతర వృత్తాంతం దృష్ట్యా, చాలామంది దీనిని మాంసపు భాగంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: పంచిపెట్టాడు
  rationale: పీయేల్ రూపం జనసమూహంలోని ఒక్కొక్కరికి భాగాలు పంచడాన్ని సూచిస్తుంది. ‘పంచిపెట్టాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ నిర్దిష్ట చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: ప్రజలందరికీ, అంటే ఇశ్రాయేలు జనసమూహమంతటికీ
  rationale: రెండు హీబ్రూ పదబంధాలు ఒకే సమూహాన్ని వివరణాత్మకంగా, నొక్కిచెప్పే విధంగా సూచిస్తాయి. రెండింటినీ ఉంచడం మూలపాఠంలోని సంపూర్ణతను కాపాడుతుంది; ‘అంటే’ వాటి వివరణాత్మక సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుల మొదలుకొని స్త్రీల వరకు
  rationale: ఇది సమావేశమైన ప్రజలందరినీ, పురుషులనూ స్త్రీలనూ కలుపుకొని సూచించే హీబ్రూ నుడికారం. తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేలా బహువచనం వాడబడింది.
- source_word: לְאִישׁ
  choice: ఒక్కొక్కరికి
  rationale: ముందటి పదబంధం పురుషులనూ స్త్రీలనూ స్పష్టంగా చేర్చినందున, ఇక్కడి పంపిణీ భావాన్ని లింగపరంగా పరిమితం చేయకుండా ‘ఒక్కొక్కరికి’ సరిగ్గా తెలియజేస్తుంది.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: ఒక రొట్టె
  rationale: חַלָּה ఇక్కడ రొట్టె లేదా రొట్టె-అప్పాన్ని సూచిస్తుంది. ‘ఒక రొట్టె’ సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన రూపం.
- source_word: אֶשְׁפָּר אֶחָד
  choice: ఒక మాంసపు భాగం
  rationale: אֶשְׁפָּר అరుదైన, అర్థం వివాదాస్పదమైన పదం. సందర్భం మరియు 1 దినవృత్తాంతాలు 16:3లోని సమాంతర వృత్తాంతం దృష్ట్యా ఆహారపు భాగం, బహుశా మాంసపు భాగం, అన్న భావం సాధ్యమైనది. అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: ఒక ఎండుద్రాక్షల అప్పం
  rationale: אֲשִׁישָׁה నొక్కి చేసిన అప్పాన్ని, సాధారణంగా ఎండుద్రాక్షలతో చేసిన అప్పాన్ని సూచిస్తుంది. ‘ఎండుద్రాక్షల అప్పం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: తరువాత ప్రజలందరూ తమతమ ఇళ్లకు వెళ్లిపోయారు
  rationale: పంపిణీ అనంతరం జనులు విడివిడిగా తమ ఇళ్లకు తిరిగిన భావాన్ని ‘తమతమ ఇళ్లకు’ సహజమైన తెలుగులో కాపాడుతుంది.
