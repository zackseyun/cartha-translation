base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: te
  text: 'దావీదు తన ఇంటివారిని ఆశీర్వదించడానికి తిరిగి వచ్చాడు. అప్పుడు సౌలు కుమార్తె మీకాలు దావీదును ఎదుర్కోవడానికి బయటికి వచ్చి ఇలా అంది: “ఇశ్రాయేలు రాజు ఈ రోజు ఎంత ఘనత పొందాడో![a] పనికిమాలినవాళ్లలో ఒకడు నిస్సిగ్గుగా తనను తాను బహిర్గతం చేసుకున్నట్టే, తన సేవకుల దాసీల[b] కళ్ల ఎదుట ఈ రోజు తనను తాను బహిర్గతం చేసుకున్నాడు![c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది సందర్భంలో వ్యంగ్యంగా చెప్పిన మాట. మూలంలోని పదానికి ‘ఎంత మహిమాన్వితంగా కనిపించాడో’ అని కూడా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దాసీలు’ అనే పదాన్ని ‘పరిచారికలు’ లేదా ‘సేవకురాళ్లు’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం తక్కువ హోదాలో బంధిత సేవ చేసే స్త్రీలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: మూలంలో ‘బహిర్గతం చేసుకోవడం’ అనే క్రియ బలవర్ధకంగా పునరుక్తమైంది; ‘పూర్తిగా తనను తాను బహిర్గతం చేసుకున్నాడు’ అని కూడా అనువదించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: לְבָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ברך అనే క్రియకు సహజమైన ప్రత్యక్ష సమానార్థకం; దావీదు తన ఇంటివారికి ఆశీర్వాదం పలకాలనే ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: בֵּיתוֹ
  choice: తన ఇంటివారిని
  rationale: בית ఇక్కడ నివాసాన్ని మాత్రమే కాక ఇంటివారిని సూచించే అవకాశం ఉంది; ఆశీర్వదించబడేది ప్రజలే కావడం వల్ల ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: సౌలు కుమార్తె మీకాలు
  rationale: మీకాలు సౌలు వంశానికి చెందినదనే కథన ప్రాధాన్యాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: מַה נִּכְבַּד הַיּוֹם
  choice: ఈ రోజు ఎంత ఘనత పొందాడో
  rationale: כבד లోని ఘనత/గౌరవ భావాన్ని నిలుపుతూ, సందర్భంలోని వ్యంగ్యాన్ని ఆశ్చర్యార్థక వాక్యరూపం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: נִגְלָה
  choice: తన దేహాన్ని బయటపెట్టుకున్నాడు
  rationale: నిఫాల్ రూపంలోని తనను తాను బహిర్గతం చేసుకోవడం అనే భావాన్ని తెలుగులో స్పష్టంగా, అతిగా లైంగికీకరించకుండా తెలియజేస్తుంది.
- source_word: לְעֵינֵי
  choice: కళ్ల ఎదుట
  rationale: ‘కళ్లకు/కళ్ల ఎదుట’ అనే హెబ్రీయ నుడికారంలోని బహిరంగ దృశ్యతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: తన సేవకుల దాసీలు
  rationale: אמה సూచించే తక్కువ సామాజిక స్థాయి మరియు బంధిత సేవ స్థితిని ‘దాసీలు’ నిలుపుతుంది; עבדיו తో ఉన్న సంబంధాన్ని ‘తన సేవకుల’గా అనువదించింది.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: నిస్సిగ్గుగా తన దేహాన్ని బయటపెట్టుకున్నట్టే
  rationale: హెబ్రీలోని బలవర్ధక నిర్మాణాన్ని పదేపదే అనుకరించకుండా, సందర్భంలోని అవమానకరమైన తీవ్రతను ‘నిస్సిగ్గుగా’ ద్వారా అందిస్తుంది.
- source_word: אַחַד הָרֵקִים
  choice: పనికిమాలినవాళ్లలో ఒకడు
  rationale: ריקים లోని శూన్యమైన, విలువలేని, సామాజికంగా హేయమైన వ్యక్తుల భావాన్ని ఆధునిక సాధారణ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אַמְהוֹת లోని సామాజిక స్థాయి పదజాలం
  choice: దాసీలు
  alternative: పరిచారికలు / సేవకురాళ్లు
  rationale: మీకాలు అవమానపరచే మాటల్లో దిగువ స్థాయి స్త్రీల ఎదుట జరిగిన చర్య ప్రధానంగా ఉంది. అందువల్ల బంధిత సేవ స్థితిని మృదువుగా మార్చకుండా ‘దాసీలు’ అని ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: מַה נִּכְבַּד లోని వ్యంగ్యం
  choice: పదార్థాన్ని నిలిపి వ్యంగ్య స్వరాన్ని సందర్భం మరియు ఆశ్చర్యార్థకం ద్వారా చూపడం
  alternative: ‘ఎంత అవమానకరంగా ప్రవర్తించాడో’ అని వ్యంగ్యాన్ని నేరుగా విప్పి చెప్పడం
  rationale: మూలంలో వాడిన పదం ఘనత/గౌరవాన్ని సూచిస్తుంది; మీకాలు ఉద్దేశం వ్యతిరేకమైనప్పటికీ, ఆ ఉద్రిక్తతను అనువాదంలో చెరపకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మీకాలు మాటల్లోని వ్యంగ్యం, సామాజిక అవమానం, మరియు బహిర్గతం కావడంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి; అసభ్యమైన లేదా అతిగా వివరణాత్మకమైన పదజాలం నివారించబడింది.
