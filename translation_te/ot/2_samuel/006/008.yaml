- from: యెహోవా ఉజ్జా మీద విరుచుకుపడి అతనిని చీల్చివేసినందుకు దావీదుకు కోపం వచ్చింది. అందువల్ల అతడు ఆ స్థలానికి పెరెజ్-ఉజ్జా[a] అని పేరు పెట్టాడు. ఈ రోజు వరకూ దానికి అదే పేరు ఉంది.
  to: యెహోవా ఉజ్జా మీద విరుచుకుపడినందుకు దావీదుకు కోపం వచ్చింది. అందువల్ల అతడు ఆ స్థలానికి పెరెజ్-ఉజ్జా[a] అని పేరు పెట్టాడు; అది నేటివరకూ ఆ పేరుతోనే పిలవబడుతోంది.
