  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: te
  text: యెహోవా ఉజ్జా మీద విరుచుకుపడినందుకు దావీదుకు కోపం వచ్చింది. అందువల్ల అతడు ఆ స్థలానికి పెరెజ్-ఉజ్జా[a] అని పేరు పెట్టాడు; అది నేటివరకూ ఆ పేరుతోనే పిలవబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పెరెజ్-ఉజ్జా” అనే పేరుకు “ఉజ్జాపై జరిగిన విరుపు” లేదా “ఉజ్జాపై విరుచుకుపడడం” అనే భావం ఉంది. ఇది “యెహోవా ఉజ్జా మీద విరుచుకుపడ్డాడు” అనే హీబ్రూ పదక్రీడను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: దావీదుకు కోపం వచ్చింది
  rationale: חרה ל అనే హీబ్రూ నుడికారం కోపాన్ని సూచిస్తుంది. ఈ రూపం కర్తను లేదా కోపం ఎవరిమీదో మూలపాఠం చెప్పినదానికంటే స్పష్టంగా నిర్ధారించకుండా, సహజమైన ఆధునిక తెలుగులో భావాన్ని తెలియజేస్తుంది.
- source_word: פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: యెహోవా ఉజ్జా మీద విరుచుకుపడి అతనిని చీల్చివేసినందుకు
  rationale: פָּרַץ అనే క్రియకూ פֶּרֶץ అనే అదే మూలపు నామవాచకానికీ మధ్య ఉన్న ఉద్దేశపూర్వక పదక్రీడను ‘విరుచుకుపడి ... చీల్చివేశాడు’ అనే సహజమైన తెలుగు జంట కొంతవరకు ప్రతిబింబిస్తుంది; ఆకస్మికమైన, విధ్వంసకరమైన దైవిక చర్యను మృదువుపరచదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: అతడు ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: స్థలానికి పేరు పెట్టే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: פֶּרֶץ עֻזָּה
  choice: పెరెజ్-ఉజ్జా
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం; దాని వెనుకనున్న పదక్రీడను పాదసూచికలో వివరించాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకూ దానికి అదే పేరు ఉంది
  rationale: హీబ్రూ కాలసూచక సూత్రాన్ని తెలుగు పాఠకులకు స్పష్టంగా, సహజంగా అందించే రూపం.
theological_decisions:
- issue: ఉజ్జాపై జరిగిన తీర్పులో దైవిక చర్యను ఎలా వ్యక్తపరచాలి
  choice: యెహోవా ఉజ్జా మీద విరుచుకుపడి అతనిని చీల్చివేశాడు
  alternative: యెహోవా ఉజ్జాకు హాని కలిగించాడు
  rationale: మూలపాఠం ఈ సంఘటనను యెహోవా చేసిన ప్రత్యక్షమైన, ఆకస్మిక తీర్పు చర్యగా పేర్కొంటుంది. దానిని కేవలం పరోక్ష పరిణామంగా మృదువుపరచకుండా, హీబ్రూ పదక్రీడ యొక్క బలాన్ని సాధ్యమైనంతగా నిలిపాం.
- issue: దావీదు కోపం ఎవరిమీదో నిర్ధారించడం
  choice: దావీదుకు కోపం వచ్చింది
  alternative: దావీదు యెహోవా మీద కోపపడ్డాడు
  rationale: לְדָוִד అనే నిర్మాణం దావీదుకు కోపం కలిగిందని చెబుతుంది గాని, అతని కోపానికి గురైన వ్యక్తిని స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి. ‘దావీదుకు కోపం వచ్చింది’ అని ఉంచి కోపం ఎవరిమీదో మూలంలోని అస్పష్టతను కాపాడాం. ప్రధాన వాక్యంలో [a] గుర్తు సంబంధిత స్థలనామం వెంట ఉంచబడింది.
