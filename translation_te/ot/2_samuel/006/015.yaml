source:
  edition: WLC
  text: וְ/דָוִד֙ וְ/כָל בֵּ֣ית יִשְׂרָאֵ֔ל מַעֲלִ֖ים אֶת אֲר֣וֹן יְהוָ֑ה בִּ/תְרוּעָ֖ה וּ/בְ/ק֥וֹל שׁוֹפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/015.yaml
  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: te
  text: దావీదూ, ఇశ్రాయేలు ఇంటివారందరూ కేకలతో[a], కొమ్ముబూర ధ్వనితో[b] యెహోవా మందసాన్ని పైకి తీసుకువస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆనంద జయధ్వనితో’; హెబ్రీ పదం ఉత్సాహభరితమైన సామూహిక కేకను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘షోఫార్ ధ్వనితో’; షోఫార్ సాధారణంగా జంతువుకొమ్ముతో, తరచుగా పొట్టేలుకొమ్ముతో చేసిన బూర.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: పైకి తీసుకొస్తూ ఉన్నారు
  rationale: హిఫిల్ కృదంతం కథనంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. యెరూషలేమువైపు మందసాన్ని తీసుకురావడంలోని పైకి వెళ్లే భావాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారందరూ
  rationale: ‘ఇశ్రాయేలు ఇల్లు/కుటుంబం’ అనే సామూహిక, కుటుంబ సంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: אֲרוֹןకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మందసం’ను, దైవనామానికి ‘యెహోవా’ను ఉపయోగించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: תְרוּעָה
  choice: కేకలు వేస్తూ
  rationale: ఈ పదం బిగ్గరగా చేసే కేకను లేదా ఉత్సాహభరిత జయధ్వనిని సూచించగలదు. తరువాత షోఫార్ ధ్వని ప్రత్యేకంగా ప్రస్తావించబడినందున ఇక్కడ మానవుల కేకల భావం సహజంగా సరిపోతుంది; ఆనందోత్సాహ భావం పాదసూచికలో ఉంచాం.
- source_word: קוֹל שׁוֹפָר
  choice: కొమ్ముబూర ధ్వనితో
  rationale: שׁוֹפָר సాధారణంగా జంతువుకొమ్ముతో, తరచుగా పొట్టేలుకొమ్ముతో చేసిన వాద్యం. ‘కొమ్ముబూర’ ఆధునిక లోహపు బాకా అనే అపార్థాన్ని తగ్గిస్తూ మూల రూపాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలిపాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా మూల ఉచ్చారణను సూచించే సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘మందసం’ సంప్రదాయ తెలుగు బైబిలు పదంగా నిలుపబడింది; ‘కొమ్ముబూర’ వాద్య స్వరూపాన్ని స్పష్టపరుస్తుంది.
