source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: te
  text: యాహ్వే కోపం ఉజ్జా మీద రగులుకుంది. అతని తప్పిదం[a] కారణంగా దేవుడు అక్కడే అతన్ని కొట్టాడు; అతడు అక్కడ దేవుని మందసం పక్కనే చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని అవివేకపు చర్య కారణంగా,’ ‘అతడు చెయ్యి చాపినందుకు,’ లేదా ‘అతని అగౌరవకరమైన చర్య కారణంగా.’ ఇక్కడి హీబ్రూ పదబంధం క్లిష్టమైనది; దాన్ని అనేక విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం ... రగులుకుంది
  rationale: కోపం మండడం అనే హీబ్రూ నుడికార చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּעֻזָּה
  choice: ఉజ్జా మీద
  rationale: ఈ కోప నుడికారంతో వచ్చిన בְ కోపానికి గురైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘మీద’ సహజంగా ఉంది.
- source_word: וַיַּכֵּהוּ
  choice: అతన్ని కొట్టాడు
  rationale: נכה యొక్క ప్రాథమిక భావాన్ని ఇస్తూ, దాని ప్రాణాంతక ఫలితాన్ని తరువాతి ‘చనిపోయాడు’ వాక్యభాగానికి వదిలింది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: మూలంలో రెండుసార్లు వచ్చిన స్థల ఉద్ఘాటనను రెండు చోట్లా నిలుపుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: మూలంలో దైవనామం తరువాత వచ్చిన ‘దేవుడు’ అనే పదభేదాన్ని అలాగే కాపాడుతుంది.
- source_word: עַל הַשַּׁל
  choice: అతని తప్పిదం కారణంగా
  rationale: అరుదైన, అర్థనిర్ణయం కష్టమైన שַׁל పదాన్ని అతిగా విశదీకరించకుండా సాధ్యమైన సాధారణ భావంతో అనువదించింది; ఇతర అర్థాలను పాదటిప్పణిలో ఉంచింది.
- source_word: וַיָּמָת
  choice: అతడు ... చనిపోయాడు
  rationale: సరళమైన కథన క్రియను సాధారణ ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం పక్కనే
  rationale: ఇక్కడ עִם స్థలసంబంధాన్ని సూచిస్తుంది; ‘పక్కనే’ అనేది తెలుగులో సహజంగా ఉండి, మందసంతో కలిసి ప్రయాణించాడనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: עַל הַשַּׁל అనే అస్పష్ట పదబంధంలో ఉజ్జా మరణానికి చెప్పిన కారణం
  choice: అతని తప్పిదం కారణంగా
  alternative: అతని అవివేకపు చర్య కారణంగా; అతడు చెయ్యి చాపినందుకు; అతని అగౌరవకరమైన చర్య కారణంగా
  rationale: שַׁל అరుదైన, క్లిష్టమైన పదం. అది తప్పిదాన్ని, తొందరపాటు లేదా అగౌరవకరమైన చర్యను, లేక మందసం వైపు చెయ్యి చాపడాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఒక సాధ్యమైన సాధారణ అర్థాన్ని ఇస్తుంది; పాదటిప్పణి నిజమైన అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథనానికి తగిన గంభీరతతో ఉంది. ‘యాహ్వే’ దైవనామాన్ని నేరుగా నిలుపుతుంది; ‘మందసం’ బైబిలు సందర్భంలో పరిచితమైన, గౌరవప్రదమైన పదం.
