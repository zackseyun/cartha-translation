source:
  edition: WLC
  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: te
  text: 'రాజైన దావీదుకు ఇలా తెలియజేయబడింది: “దేవుని మందసం కారణంగా యహ్వే[a] ఓబేద్-ఎదోము ఇంటిని, అతనికి చెందిన సమస్తాన్నీ ఆశీర్వదించాడు.” అప్పుడు దావీదు వెళ్లి, దేవుని మందసాన్ని ఓబేద్-ఎదోము ఇంటి నుండి దావీదు నగరానికి ఆనందంతో పైకి తీసుకొచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం YHWH; ఇక్కడ “యహ్వే” అని లిప్యంతరీకరించబడింది. సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.
    reason: దైవనామానికి ఉన్న ప్రధాన అనువాద సంప్రదాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: హోఫల్ కర్మణి రూపం సమాచారాన్ని ఎవరు తెలిపారో చెప్పదు; తెలుగు కర్మణి ప్రయోగం ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: రాజైన దావీదుకు
  rationale: బిరుదు, పేరు రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּרַךְ יְהוָה
  choice: యహ్వే ఆశీర్వదించాడు
  rationale: హీబ్రూ పరిపూర్ణ క్రియను నివేదితమైన పూర్తి చర్యగా సహజ తెలుగులో అందిస్తుంది.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: ఓబేద్-ఎదోము ఇంటిని
  rationale: ‘ఇల్లు’ అనే పదం సందర్భంలో కుటుంబాన్ని లేదా ఇంటివారిని సూచించగలదు; తరువాత వచ్చే భౌతిక ఇంటి ప్రస్తావనతోనూ పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: అతనికి చెందిన సమస్తాన్నీ
  rationale: ఆస్తి, పరివారం సహా అతనికి చెందినదంతటినీ సూచించే సహజమైన సమగ్ర ప్రయోగం.
- source_word: בַּעֲבוּר
  choice: కారణంగా
  rationale: మందసం అక్కడ ఉండడమే ఆశీర్వాదానికి కారణమని తెలిపే కారణార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: పవిత్ర నిబంధన మందసాన్ని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదప్రయోగం.
- source_word: וַיַּעַל
  choice: పైకి తీసుకొచ్చాడు
  rationale: దావీదు నగరం వైపు మందసాన్ని తరలించడంతో పాటు עלה లోని పైకి తీసుకెళ్లే దిశార్థాన్ని నిలుపుతుంది.
- source_word: בְּשִׂמְחָה
  choice: ఆనందంతో
  rationale: మూలంలోని సంతోషభరితమైన విధానాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో ఉంచింది; పాఠకులకు సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇంటి’ అనే పదంలో కుటుంబం/గృహం అనే సందర్భోచిత విస్తృతార్థం, ‘పైకి తీసుకొచ్చాడు’లో ప్రయాణ దిశ రెండూ నిలుపబడ్డాయి.
