id: 2SA.6.22
reference: 2 Samuel 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: te
  text: నేను దీన్నికంటే ఇంకా నన్ను నేను అల్పపరచుకుంటాను; నా దృష్టిలో నేను అల్పుడిగా ఉంటాను. అయితే నువ్వు చెప్పిన ఆ దాసీలతో నేను గౌరవించబడతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పనికత్తెలతో,’ ‘స్త్రీ సేవకురాళ్లతో.’ హీబ్రూ పదం ఇంటిలో తక్కువ సామాజిక హోదాలో ఉన్న స్త్రీలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: నన్ను నేను అల్పపరచుకుంటాను
  rationale: קלל నిఫాల్ రూపం తేలికగా లేదా అల్పంగా ఎంచబడడాన్ని సూచిస్తుంది. సందర్భంలో దావీదు ఉద్దేశపూర్వకంగా మరింతగా తనను తాను తగ్గించుకోవడానికి సిద్ధంగా ఉన్నందున, తెలుగు ప్రతిబింబక నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד מִזֹּאת
  choice: ఇంతకంటే ఇంకా
  rationale: עוֹד తీవ్రతను, מִזֹּאת పోలికను తెలియజేస్తాయి; మునుపటి వచనంలో మీకాలు చేసిన ఆరోపణతో ఉన్న పోలికను ఈ పదబంధం నిలుపుతుంది.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: నా దృష్టిలో నేను తక్కువవాడిగా ఉంటాను
  rationale: שָׁפָל అంటే తక్కువ స్థితిలో లేదా అల్పంగా ఉండడం. ‘నా దృష్టిలో’ అనే హెబ్రీ నుడికారాన్ని నిలుపుతూ, దానిని కేవలం నైతిక వినయమనే అర్థానికి పరిమితం చేయకుండా సామాజిక హోదా భావాన్ని కాపాడుతుంది.
- source_word: הָאֲמָהוֹת
  choice: దాసీలు
  rationale: אָמָה తక్కువ గృహస్థ హోదాలోని స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది. ‘దాసీలు’ సామాజిక స్థాయి వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: నువ్వు చెప్పిన
  rationale: మునుపటి వచనంలో మీకాలు ప్రస్తావించిన స్త్రీలను సూచించే సహజమైన తెలుగు సంబంధవాచక నిర్మాణం.
- source_word: עִמָּם
  choice: ఆ దాసీలతోనే
  rationale: עם యొక్క ‘తో’ భావాన్ని నిలుపుతూ, హెబ్రీలో పునరుక్తి ద్వారా వచ్చిన ఉద్ఘాటనను తెలుగు ‘నే’ ప్రత్యయంతో సహజంగా వ్యక్తం చేస్తుంది. ఇది వారిచేత గౌరవం పొందడం కంటే వారి సామాజిక వర్గంలో గౌరవం పొందడాన్ని సూచించగల అస్పష్టతను కాపాడుతుంది.
- source_word: אִכָּבֵדָה
  choice: నేను గౌరవించబడతాను
  rationale: כבד నిఫాల్ రూపం గౌరవం పొందడాన్ని సూచిస్తుంది. ఇది ముందున్న అల్పపరచుకోవడంతో ఉన్న గౌరవం–అవమానం వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אָמָהוֹת పదంలోని సామాజిక హోదా
  choice: ప్రధాన పాఠ్యంలో ‘దాసీలు’
  alternative: ‘పనికత్తెలు’ లేదా ‘స్త్రీ సేవకులు’
  rationale: వచనంలోని హోదా మరియు గౌరవం–అవమానం వ్యత్యాసానికి తక్కువ సామాజిక స్థితి ముఖ్యమైనది. ‘దాసీలు’ ఆ అంశాన్ని మృదువుపరచకుండా తెలియజేస్తుంది; ఇతర సాధ్యమైన తెలుగు పదాలను పాదసూచికలో ఉంచాం.
- issue: עִמָּם మరియు אִכָּבֵדָה మధ్య సంబంధం
  choice: ‘ఆ దాసీలతోనే నేను గౌరవించబడతాను’ అని అనువదించడం
  alternative: ‘ఆ దాసీలచేత నేను గౌరవించబడతాను’
  rationale: హెబ్రీ עם సాధారణంగా ‘తో/మధ్య’ అనే సామాజిక పరిధిని సూచిస్తుంది; దానిని కర్తృకారకమైన ‘చేత’గా నిర్ణయించడం మూలంలోని సాధ్యమైన అస్పష్టతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దావీదు మీకాలుతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ వాడబడింది. గౌరవం–అవమానం వ్యత్యాసం మరియు ‘నా దృష్టిలో’ అనే మూల నుడికారం నిలుపబడ్డాయి.
