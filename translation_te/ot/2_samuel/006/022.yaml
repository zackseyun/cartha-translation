- from: నేను ఇంతకంటే ఇంకా నన్ను నేను అల్పపరచుకుంటాను; నా దృష్టిలో నేను తక్కువవాడిగా ఉంటాను. అయినా నువ్వు చెప్పిన ఆ దాసీలతోనే[a] నేను గౌరవించబడతాను.
  to: నేను దీన్నికంటే ఇంకా నన్ను నేను అల్పపరచుకుంటాను; నా దృష్టిలో నేను అల్పుడిగా ఉంటాను. అయితే నువ్వు చెప్పిన ఆ దాసీలతో నేను గౌరవించబడతాను.[a]
