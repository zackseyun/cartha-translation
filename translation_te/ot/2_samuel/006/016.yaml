id: 2SA.6.16
reference: 2 Samuel 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: te
  text: యహ్వే మందసం దావీదు నగరంలోకి వస్తుండగా, సౌలు కుమార్తె మీకాలు కిటికీలోంచి బయటికి చూసి, యహ్వే సమక్షంలో గంతులు వేస్తూ, గిరగిరా తిరుగుతున్న రాజు దావీదును చూసింది.[a] ఆమె తన హృదయంలో అతణ్ణి తృణీకరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గంతులు వేస్తూ, గిరగిరా తిరుగుతూ” అనే రెండు హెబ్రీ క్రియలు యహ్వే సమక్షంలో దావీదు చేసిన ఉత్సాహభరితమైన కదలికలను సూచిస్తాయి.
    reason: అరుదైన రెండు హెబ్రీ క్రియల ప్రత్యేకమైన, ఉత్సాహభరితమైన కదలిక భావాన్ని వివరిస్తుంది; మూలంలో లేని పండుగ-నిర్దిష్టతను చేర్చదు.
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: వస్తుండగా
  rationale: మందసం నగరంలోకి వస్తున్న సమయంలో మీకాలు చూసిన సమకాలిక దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: నిబంధనతో సంబంధమున్న పవిత్ర పెట్టెకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘మందసం’ను ఉంచి, దైవనామాన్ని లిప్యంతరీకరించాం.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: కిటికీలోనుంచి చూసింది
  rationale: ఒక లోపలి లేదా ఎత్తైన స్థానం నుంచి బయటకు చూడడమనే భావాన్ని, దిశను అతిగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְפַזֵּז
  choice: గంతులు వేస్తూ
  rationale: ఈ అరుదైన క్రియ సూచించే ఉత్సాహభరితమైన ఎగిరే కదలికను స్పష్టంగా నిలుపుతుంది.
- source_word: וּמְכַרְכֵּר
  choice: గిరగిరా తిరుగుతూ
  rationale: మొదటి క్రియతో కలపకుండా, తిరిగే లేదా చుట్టూ చలించే ప్రత్యేక కదలికను నిలుపుతుంది.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: ఆమె తన హృదయంలో అతణ్ణి తృణీకరించింది
  rationale: బాహ్యంగా పలికిన మాటగా కాక, అంతరంగంలో కలిగిన ధిక్కారంగా హెబ్రీ వాక్యాన్ని సూటిగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: మీకాలు దావీదును తృణీకరించినదానికి నైతిక వివరణ
  choice: మూలం తెలిపిన అంతరంగ ప్రతిస్పందనను మాత్రమే పేర్కొనడం
  alternative: ఆమెను బహిరంగంగా దోషిగా తీర్పు చెప్పే వివరణను చేర్చడం
  rationale: ఈ వచనం ఆమె ప్రతిస్పందనను కథనాత్మకంగా తెలుపుతుంది; దాని ఉద్దేశం లేదా నైతిక మూల్యాంకనాన్ని ఇక్కడే విస్తరించడం మూలానికి మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘మందసం’, ‘సన్నిధి’, ‘తృణీకరించింది’ వంటి స్థిరమైన బైబిలు పదాలను సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణంలో ఉపయోగించాం.
