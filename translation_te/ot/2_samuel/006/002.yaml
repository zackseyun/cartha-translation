base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: te
  text: దావీదు లేచి, తనతో ఉన్న ప్రజలందరితో కలిసి, కెరూబులపై ఆసీనుడై ఉన్న సైన్యాల యెహోవా నామము దానిమీద పిలువబడే దేవుని మందసాన్ని అక్కడి నుండి పైకి తీసుకురావడానికి బయలే-యూదా నుండి వెళ్లాడు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదాలోని బాలా నుండి.” ఇక్కడి హీబ్రూ రూపం అసాధారణంగా ఉంది; ఇది కిర్యత్-యెయారీము అని కూడా పిలువబడిన స్థలాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, “సైన్యాల యెహోవా నామము దానిమీద పిలువబడే.” హీబ్రూ నామకరణ సూత్రం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “కెరూబులపై ఆసీనుడై ఉన్న” అనే మాటను “కెరూబుల మధ్య నివసించే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: లేచి … బయలుదేరాడు
  rationale: రెండు హీబ్రూ క్రియల క్రమాన్ని నిలుపుతూ, ఆధునిక తెలుగు కథనంలో సహజంగా చర్య ప్రారంభాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న ప్రజలందరితో కలిసి
  rationale: దావీదుతో పాటు మొత్తం సమూహం వెళ్లిందనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: యూదాలోని బాలే నుండి
  rationale: సందర్భానికి అనుగుణంగా దీనిని స్థలనామంగా తీసుకుంది; అసాధారణ రూపం వల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: అక్కడి నుండి తీసుకురావడానికి
  rationale: హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే భావాన్ని తెలుగు గమ్యసందర్భంలో సహజంగా తెలియజేస్తుంది; యెరూషలేముకు ఎత్తుకెళ్లే అంతర్భావాన్ని అతిగా వివరించదు.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ఒడంబడిక మందసానికి తెలుగులో స్థిరమైన, గౌరవప్రదమైన పదప్రయోగం.
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם יְהוָה צְבָאוֹת
  choice: నామంతో—… సైన్యాల యెహోవా నామంతో—పిలువబడింది
  rationale: పునరుక్తితో కూడిన సంక్షిప్త హీబ్రూ నామకరణ సూత్రాన్ని పూర్తిగా సులభీకరించకుండా, దాని గంభీరతను మరియు వ్యాకరణ అస్పష్టతను నిలుపుతుంది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాల యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా ప్రతిలిపి చేసి, צְבָאוֹת ను ఆధునిక పాఠకులకు అర్థమయ్యేలా ‘సైన్యాలు’గా అనువదిస్తుంది.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: కెరూబులపై ఆసీనుడై ఉన్న
  rationale: ישׁב యొక్క సింహాసనాసీన భావాన్ని ‘ఆసీనుడు’ ద్వారా నిలుపుతుంది; కెరూబులతో సంబంధమైన స్థానాన్ని ‘పై’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు సాధారణ బైబిలు వాడుకలో గుర్తించదగిన దైవనామ రూపాన్ని ఉపయోగించింది; దీనిని ‘ప్రభువు’గా మార్చి మూలంలోని వ్యక్తిగత నామాన్ని మరుగుపరచలేదు.
- issue: צְבָאוֹת అనే బిరుదు
  choice: సైన్యాల
  alternative: సేనల / సైన్యముల
  rationale: ‘hosts’ వంటి సంప్రదాయ అస్పష్టతకు బదులుగా, భౌమిక-దివ్య సైన్యాల విస్తృత భావాన్ని ఉంచే ఆధునిక తెలుగు పదాన్ని ఎంచుకుంది.
- issue: మందసంపై నామం పిలువబడే సంక్షిప్త సూత్రం
  choice: ఆ మందసం నామంతో—… నామంతో—పిలువబడింది
  alternative: దానిపై … నామం ప్రకటించబడింది
  rationale: మూలంలో మందసం దేవుని నామంతో ఎలా సంబంధించబడిందో పూర్తిగా నిర్ణయించకుండా, ‘పిలువబడింది’ అనే రూపంతో నిజమైన భావసందిగ్ధతను కాపాడుతుంది.
- issue: יֹשֵׁב అనే పదంలోని నివాసం/సింహాసనాసీనత భావం
  choice: ఆసీనుడై ఉన్న
  alternative: నివసించే
  rationale: మందసం-కెరూబుల సింహాసన చిత్రాన్ని తెలియజేస్తూనే, దేవుడు భౌతికంగా అక్కడికే పరిమితుడనే భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘మందసం,’ ‘కెరూబులు,’ ‘ఆసీనుడు’ వంటి బైబిలు సందర్భానికి అవసరమైన పదాలను ఉంచి, మిగతా వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దింది. మూలంలోని పునరుక్తి మరియు నామకరణ అస్పష్టతను ప్రధాన పాఠ్యంతో పాటు పాదసూచికల్లో సంరక్షించింది.
