source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: te
  text: దావీదు దహనబలిని, సమాధానబలులను అర్పించడం ముగించిన తర్వాత, సైన్యాల యాహ్వే[a] నామంలో ప్రజలను ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “సైన్యాల యాహ్వే”; “సైన్యాల యెహోవా” లేదా “సేనల ప్రభువు” అని కూడా అనువదించవచ్చు.'
    reason: యెహోవా అనే సాంప్రదాయ నామరూపాన్ని, అలాగే צְבָאוֹת బిరుదుకు సాధ్యమైన ప్రత్యామ్నాయ అనువాదాలను సూచించడానికి.
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించిన తర్వాత
  rationale: כלה అనే క్రియ ముందటి కార్యం పూర్తయినదని తెలిపి, ఆ తర్వాత జరిగిన ఆశీర్వాదానికి కథన క్రమాన్ని సహజంగా కలుపుతుంది.
- source_word: מֵהַעֲלוֹת
  choice: అర్పించడం
  rationale: עלה యొక్క హిఫిల్ క్రియారూపం బలి సందర్భంలో ‘పైకి అర్పించడం’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘అర్పించడం’ సహజమైనది.
- source_word: הָעֹלָה
  choice: దహనబలిని
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే స్థిరమైన బలి పదం; ఏకవచనం నిలుపబడింది.
- source_word: וְהַשְּׁלָמִים
  choice: సమాధాన బలులను
  rationale: שְׁלָמִים సహవాసం, క్షేమం, సమాధానం వంటి విస్తృత భావాలు గల బలి వర్గాన్ని సూచిస్తుంది; ‘సమాధాన బలులు’ పరిచితమైనదీ, సంక్షిప్తమైనదీ అయిన అనువాదం.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך ఇక్కడ ప్రజలపై ఆశీర్వాదం పలకడాన్ని నేరుగా సూచిస్తుంది.
- source_word: אֶת־הָעָם
  choice: ప్రజలను
  rationale: עָם సమకూడిన ప్రజలందరినీ సమష్టిగా సూచిస్తుంది.
- source_word: בְּשֵׁם
  choice: నామంలో
  rationale: ఈ పదబంధం ఆశీర్వాదం పలికేటప్పుడు దేవుని అధికారం లేదా నామాన్ని ఆశ్రయించడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠనంలో విస్తృతంగా గుర్తించబడే రూపంలో దైవనామాన్ని శీర్షికతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది; ఉచ్చారణను ‘యాహ్వే’గా ఇవ్వడం కూడా సాధ్యం.
- source_word: צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన
  rationale: צְבָאוֹת యొక్క సైన్యాలు/సమూహాలు అనే భావాన్ని సహజమైన తెలుగు దైవబిరుదుగా వ్యక్తం చేస్తుంది; కేవలం మానవ సైన్యాలకు పరిమితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు రూపం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక పండిత ఉచ్చారణకు ‘యాహ్వే’ దగ్గరగా ఉన్నప్పటికీ, ‘యెహోవా’ తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపం; ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: יְהוָה צְבָאוֹת అనే బిరుదు
  choice: సైన్యాలకు అధిపతియైన యెహోవా
  alternative: సైన్యముల యెహోవా
  rationale: צְבָאוֹת అనే బహువచన పదంలోని సైన్యాలు లేదా సమూహాల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే విధంగా అధిపత్య సంబంధాన్ని స్పష్టం చేసింది; అది మానవ సైన్యాలకే పరిమితమని నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమం, గౌరవప్రదమైన బలి పరిభాష ఉపయోగించబడ్డాయి. మూలంలోని ఏకవచన ‘దహనబలి’, బహువచన ‘సమాధాన బలులు’ నిలుపబడ్డాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత దైవబిరుదు వద్ద ఉంచబడింది.
