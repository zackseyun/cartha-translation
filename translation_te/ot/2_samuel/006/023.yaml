  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: te
  text: సౌలు కుమార్తె మీకాలుకు ఆమె చనిపోయిన రోజు వరకు సంతానం కలగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బిడ్డ’; హీబ్రూ పదం తప్పనిసరిగా కుమారుడినే కాకుండా సాధారణంగా బిడ్డను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: మీకాలుకు
  rationale: హీబ్రూ సంధి-దత్త విభక్తి నిర్మాణం కథన అనుసంధానంతో మీకాలును స్వామ్య వాక్యానికి అంశంగా పరిచయం చేస్తుంది. తెలుగులో ‘మీకాలుకు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: בַּת שָׁאוּל
  choice: సౌలు కుమార్తె
  rationale: ఈ సమాస నిర్మాణం మీకాలును సౌలు కుమార్తెగా గుర్తిస్తుంది. తెలుగు నామపద క్రమంలో ఇది సహజమూ మూలానికి సన్నిహితమూ.
- source_word: לֹא הָיָה לָהּ
  choice: కలగలేదు
  rationale: ‘ఆమెకు లేదు’ అనే హీబ్రూ స్వామ్య ప్రయోగాన్ని సంతానం సందర్భంలో ఆధునిక తెలుగులో సహజమైన ‘కలగలేదు’గా అనువదించాం.
- source_word: יָלֶד
  choice: సంతానం
  rationale: ఈ నామవాచకం సందర్భంలో లింగాన్ని నిర్దిష్టం చేయకుండా బిడ్డ లేదా సంతానాన్ని సూచించగలదు. ‘సంతానం’ పురుష శిశువని అనవసరంగా పరిమితం చేయదు; ప్రత్యామ్నాయంగా ‘బిడ్డ’ సాధ్యం.
- source_word: עַד יוֹם מוֹתָהּ
  choice: ఆమె చనిపోయిన రోజు వరకు
  rationale: మరణదినం వరకు అనే హీబ్రూ కాలపరిమితిని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆమె చనిపోయిన రోజు వరకు’ అనే కాలవాచక ప్రయోగం యొక్క సూచన
  choice: మీకాలు జీవితాంతం సంతానం లేనిదిగా ఉందని తెలిపే మూలంలోని కాలవాచక రూపాన్ని నేరుగా నిలిపి ఉంచడం
  alternative: ‘ఆమె జీవితాంతం’ అని భావాన్ని పూర్తిగా విప్పి చెప్పడం
  rationale: మూలంలోని ‘మరణదినం వరకు’ అనే మాటతీరును కాపాడుతూ, మరణానంతరం సంతానం కలిగిందనే అసంభవ భావాన్ని సూచించకుండా, అదనపు సిద్ధాంతార్థాన్ని ప్రవేశపెట్టకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సంతానం’ అనే పదం మూలంలోని లింగ-అనిర్దిష్టతను కాపాడుతుంది.
