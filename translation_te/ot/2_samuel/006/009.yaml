source:
  edition: WLC
  text: וַ/יִּרָ֥א דָוִ֛ד אֶת יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּ֕אמֶר אֵ֛יךְ יָב֥וֹא אֵלַ֖/י אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: te
  text: ఆ రోజు దావీదు యాహ్వేకు భయపడి, “యాహ్వే మందసం నా దగ్గరికి ఎలా వస్తుంది?” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “యాహ్వే మందసం నా దగ్గరికి ఎలా వస్తుంది?” ఉజ్జా మరణం తర్వాత పలికిన ఈ మాటలు, మందసాన్ని ఎలా తీసుకురావాలనే ఆచరణాత్మక అనిశ్చితినిగానీ, భయాన్నిగానీ, లేదా తాను అర్హుడు కాదనే భావాన్నిగానీ వ్యక్తం చేసి ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: భయపడి
  rationale: యిరా అనే క్రియకు ఈ సందర్భంలో ఉజ్జా మరణం తరువాత కలిగిన నిజమైన భయం ప్రధాన భావం. ‘భక్తి చూపి’ అనడం ఈ కథనంలోని తీవ్రతను తగ్గిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన దైవనామ రూపం ‘యెహోవా’గా ఇచ్చాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: నిర్దిష్టమైన ఆ సంఘటన జరిగిన రోజును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: אֵיךְ יָבֹא
  choice: ఎలా వస్తుంది
  rationale: పదశః ‘ఎలా వస్తుంది?’ అనే ప్రశ్న. ఇది ఆచరణాత్మక అనిశ్చితి, భయం, తాను అర్హుడు కాదనే భావం—వీటిలో ఏదో ఒకదాన్ని ఖచ్చితంగా నిర్ణయించకుండా నిలుపుతుంది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: ‘నా వద్దకు/నా దగ్గరికి’ అనే ప్రత్యక్ష అర్థాన్ని ఇస్తుంది; ‘నా ఇంటికి’ అని చెప్పడం మూలంలో లేని వివరాన్ని చేర్చుతుంది.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: నిబంధన మందసాన్ని సూచించే స్థిరమైన తెలుగు బైబిల్ పదం ‘మందసం’; సంబంధాన్ని సహజంగా ‘యెహోవా మందసం’గా తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపాన్ని ఉంచాం.
- issue: దావీదు ప్రశ్నలోని భావం
  choice: ఎలా వస్తుంది?
  alternative: ఎలా రాగలదు?
  rationale: ‘ఎలా రాగలదు?’ సాధ్యతను బలంగా సూచిస్తుంది; అయితే హీబ్రూ రూపం భవిష్యత్ పరిణామంపై అనిశ్చితిని కూడా అనుమతిస్తుంది. అందువల్ల వ్యాఖ్యానాన్ని సంకుచితం చేయకుండా ‘ఎలా వస్తుంది?’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మందసం’ పవిత్ర వస్తువుకు తెలుగు బైబిల్ వాడుకలో స్థిరమైన పదంగా నిలుపబడింది; ప్రశ్నలోని ఉద్దేశపూర్వక అస్పష్టతను వివరణతో తొలగించలేదు.
