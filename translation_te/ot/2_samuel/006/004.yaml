translation_notes:
  register: సామాన్య ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, హీబ్రూలోని కొనసాగుతున్న చర్యను ‘నడుస్తూ ఉన్నాడు’తో వ్యక్తం చేశాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
