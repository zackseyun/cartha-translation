source:
  edition: WLC
  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: te
  text: కొండమీద ఉన్న అబీనాదాబు ఇంటి నుండి దేవుని మందసాన్ని వారు తీసుకువెళ్లారు.[a] అహ్యో మందసం ముందు నడుస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గిబియాలో ఉన్న అబీనాదాబు ఇంటి నుండి.” హీబ్రూ పదాన్ని “కొండ” అనే సాధారణ నామవాచకంగానూ, “గిబియా” అనే స్థలనామంగానూ చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: తీసుకువెళ్లారు
  rationale: נשׂא క్రియ ఇక్కడ మందసాన్ని ఒక చోటు నుండి తరలించడాన్ని సూచిస్తుంది. దాన్ని చేతులతో మోశారని అతిగా నిర్దిష్టం చేయకుండా, సందర్భానికి సహజంగా ‘తీసుకువెళ్లారు’ అని అనువదించాం.
- source_word: מִבֵּית אֲבִינָדָב
  choice: అబీనాదాబు ఇంటి నుండి
  rationale: מן ఉపసర్గతో కూడిన בית నిర్మాణం బయలుదేరిన స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన రూపం.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: కొండమీద ఉన్న
  rationale: גִּבְעָה సాధారణ నామవాచకంగా ‘కొండ’ అని లేదా స్థలనామంగా ‘గిబియా’ అని అర్థమవవచ్చు. నిర్దిష్ట ఉపపదంతో ఉన్న రూపం వల్ల ప్రధాన పాఠ్యంలో సాధారణ నామవాచక అర్థాన్ని ఎంచుకుని, స్థలనామ అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసాన్ని
  rationale: హీబ్రూ వాక్య నిర్మాణంలో עם ‘తో’ అనే సహచర్య భావాన్ని ఇస్తున్నప్పటికీ, మునుపటి సర్వనామం సూచించేది దేవుని మందసమే. తెలుగులో అస్పష్టమైన పునరుక్తిని నివారిస్తూ వాక్యార్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: וְאַחְיוֹ
  choice: అహ్యో
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הֹלֵךְ
  choice: నడుస్తూ ఉన్నాడు
  rationale: వర్తమాన కృదంతం తరలింపుతో సమకాలంగా కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘నడుస్తూ ఉన్నాడు’ ఆ దీర్ఘత్వాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי הָאָרוֹן
  choice: మందసం ముందు
  rationale: לִפְנֵי ఇక్కడ స్థలపరంగా ‘ముందు’ అని అర్థం; ఊరేగింపు క్రమాన్ని సహజంగా తెలియజేస్తుంది.
