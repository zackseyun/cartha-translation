id: 2SA.6.13
reference: 2 Samuel 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֧י צָעֲד֛וּ נֹשְׂאֵ֥י אֲרוֹן יְהוָ֖ה שִׁשָּׁ֣ה צְעָדִ֑ים וַ/יִּזְבַּ֥ח שׁ֖וֹר וּ/מְרִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: te
  text: యెహోవా మందసాన్ని మోసేవారు ఆరు అడుగులు[a] వేసినప్పుడు, అతడు ఒక ఎద్దును, బలిసిన పశువును[b] బలిగా అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆరు అడుగుల దూరం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘బలిసిన పశువు’; సంప్రదాయంగా ఇక్కడ దీనిని బలిసిన దూడగా అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: אֲרוֹן అనే ఆరాధనాసంబంధ పదానికి తెలుగులో స్థిరంగా వాడే ‘మందసం’ను తీసుకుని, యెహోవా అనే దైవనామాన్ని పేరుగానే ఉంచాం.
- source_word: וַיְהִי כִּי
  choice: …వేసినప్పుడు
  rationale: కథనంలో כִּי కాలసంబంధ పరిస్థితిని పరిచయం చేస్తుంది; సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘అప్పుడు’ భావాన్ని ‘వేసినప్పుడు’ ద్వారా తెలిపాం.
- source_word: צָעֲדוּ
  choice: అడుగులు వేశారు
  rationale: క్రియలోని ముందుకు అడుగులు వేయడం/నడవడం అనే భావాన్ని, సంఖ్యతో సహజంగా కలిసే తెలుగు ప్రయోగంతో తెలిపాం.
- source_word: נֹשְׂאֵי
  choice: మోసేవారు
  rationale: మందసాన్ని మోస్తున్న వారిని సూచించే కృదంత భావాన్ని సూటిగా, ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: שִׁשָּׁה צְעָדִים
  choice: ఆరు అడుగులు
  rationale: సంఖ్యను మరియు అడుగుల కొలతను నేరుగా ప్రతిబింబించే సహజమైన తెలుగు రూపం.
- source_word: וַיִּזְבַּח
  choice: అతడు … బలిగా అర్పించాడు
  rationale: ఏకవచన కర్త సందర్భానుసారం దావీదును సూచిస్తుంది; זבח యొక్క బలి అర్పణ భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: שׁוֹר
  choice: ఒక ఎద్దు
  rationale: ఈ పదం గోవర్గపు మగ పశువును సూచించగలదు; బలి సందర్భంలో ‘ఎద్దు’ సాధారణమైన, సూటి సమానార్థకం.
- source_word: מְרִיא
  choice: కొవ్వించిన ఒక పశువు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా దూడనే కాక, బలిపుష్టిగా పెంచిన పశువును విస్తృతంగా సూచిస్తుంది; మూలంలోని అనిర్దిష్టతను ప్రధాన పాఠ్యంలో కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపంగా ఇచ్చాం.
- issue: וַיִּזְבַּח అనే ఏకవచన క్రియకు కర్త
  choice: అతడు
  alternative: దావీదు
  rationale: హీబ్రూ పాఠ్యం పేరును పునరుక్తి చేయకుండా ఏకవచన కర్తను మాత్రమే సూచిస్తుంది. సందర్భంలో అది దావీదు అయినప్పటికీ, మూలపాఠ్య రూపాన్ని కాపాడేందుకు ‘అతడు’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘కొవ్వించిన పశువు’ ద్వారా మూలంలోని విస్తృత అర్థాన్ని నిలిపి, ‘కొవ్వించిన దూడ’ అనే సంప్రదాయ వివరణను పాదసూచికలో ఇచ్చాం.
