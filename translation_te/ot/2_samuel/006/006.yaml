id: 2SA.6.6
reference: 2 Samuel 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: te
  text: వారు నాకోను కళ్లం దగ్గరికి వచ్చినప్పుడు[a], ఎద్దులు జారిపోవడంతో[b] ఉజ్జా దేవుని మందసం వైపు చేయి చాపి, దాన్ని పట్టుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకోను అనే వ్యక్తికి చెందిన కళ్లం’; తక్కువ సంభావ్యతతో, ‘స్థిరమైన కళ్లం.’
    reason: lexical_alternative
  - marker: b
    text: ‘జారిపోవడంతో’ అనే హీబ్రూ మాటకు ‘తొట్రుపడడంతో’ లేదా ‘దాన్ని జారవిడవబోవడంతో’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చి, తూర్పారబట్టే స్థలాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: נָכוֹן
  choice: నాకోను
  rationale: ఇక్కడ ఇది కళ్లం పేరుగా లేదా దాని యజమాని పేరుగా పనిచేయడం అత్యంత సహజం. విశేషణార్థపు సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַיִּשְׁלַח
  choice: చెయ్యి చాపి
  rationale: చెయ్యి అనే పదం హీబ్రూలో వ్యక్తంగా లేకపోయినా, ఒక వస్తువు వైపు చాపడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: హీబ్రూ నిర్మాణంలోని పూర్తి పవిత్ర గుర్తింపును నిలుపుతూ, ark కు స్థిరమైన బైబిలు తెలుగు సమానార్థకాన్ని వాడాం.
- source_word: וַיֹּאחֶז בּוֹ
  choice: దాన్ని పట్టుకున్నాడు
  rationale: హింసాత్మక భావాన్ని అదనంగా చేర్చకుండా, אחז యొక్క పట్టుకోవడం అనే అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כִּי
  choice: -డంతో
  rationale: ఉజ్జా చేసిన పనికి ఎద్దుల కదలిక కారణమని సహజమైన తెలుగు కారణార్థక నిర్మాణంలో తెలియజేస్తుంది.
- source_word: שָׁמְטוּ
  choice: జారిపోవడంతో
  rationale: ఈ క్రియ జారడం, అదుపు తప్పడం లేదా జారవిడవడం అనే పరిధి కలిగి ఉంది. ఎద్దులు కర్తలుగా ఉన్నందున ‘జారిపోవడం’ మూలంలోని అనిశ్చితిని ‘తొట్రుపడ్డాయి’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: బండిని లాగే పశువులను ఈ సందర్భంలో ‘ఎద్దులు’ అని చెప్పడం ‘పశువులు’ కంటే నిర్దిష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఉజ్జా చర్యకు తక్షణ కారణం
  choice: ఎద్దులు జారిపోవడం వల్ల ఉజ్జా మందసాన్ని పట్టుకున్నాడు.
  alternative: ఎద్దులు మందసాన్ని పడవేయబోయాయి లేదా దాన్ని జారవిడిచాయి.
  rationale: హీబ్రూ వాక్యం ఎద్దులనే కర్తలుగా ఉంచి జారడం/జారవిడవడం అనే విస్తృతార్థం గల క్రియను వాడుతుంది. మందసం నిజంగా ఒరిగిందని లేదా పడబోయిందని స్పష్టంగా చెప్పదు; అందువల్ల యాంత్రిక వివరాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘మందసం’ అనే పరిచిత బైబిలు పదాన్ని నిలిపి, చర్యల క్రమాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో అందించాం.
