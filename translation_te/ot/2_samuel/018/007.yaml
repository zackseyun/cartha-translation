reference: 2 Samuel 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּנָּ֤גְפוּ שָׁם֙ עַ֣ם יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וַ/תְּהִי שָׁ֞ם הַ/מַּגֵּפָ֧ה גְדוֹלָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא עֶשְׂרִ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: te
  text: అక్కడ ఇశ్రాయేలు ప్రజలు దావీదు సేవకుల ఎదుట ఓడిపోయారు. ఆ రోజు అక్కడ ఘోరమైన సంహారం[a] జరిగింది—ఇరవై వేలమంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దెబ్బ,’ ‘పరాజయం,’ లేదా ‘తెగులు.’ ఈ హెబ్రీ పదం ఇతర సందర్భాల్లో తెగులును సూచించవచ్చు; ఇక్కడ మాత్రం యుద్ధంలో జరిగిన ప్రాణాంతక హతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘ఇరవై వేలు’ అని మాత్రమే ఉంది. యుద్ధ సందర్భంలో స్పష్టత కోసం ‘మంది’ చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: ఓడిపోయారు
  rationale: నָגַף నిఫాల్ రూపం ఇక్కడ యుద్ధంలో దెబ్బతిని ఓడిపోవడాన్ని సూచిస్తుంది. ప్రతి వ్యక్తీ హతుడయ్యాడని అతిగా చెప్పకుండా సైనిక పరాజయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హెబ్రీ పదబంధానికి సన్నిహితమైన అనువాదం. సందర్భంలో ఇది ఇశ్రాయేలు పక్షాన యుద్ధం చేసిన దళాలను సూచించినప్పటికీ, మూలంలోని ‘ప్రజలు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: యుద్ధ సందర్భంలో ప్రత్యర్థి ఎదుట పరాజయం పొందిన భావాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: עֶבֶד అనే పదంలోని సేవకులు/అనుచరులు అనే భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో వారు దావీదు సైనిక అనుచరులు.
- source_word: הַמַּגֵּפָה
  choice: సంహారం
  rationale: מַגֵּפָה ఇతర సందర్భాల్లో తెగులు లేదా దెబ్బను సూచించగలదు; ఇక్కడ యుద్ధంలో జరిగిన ప్రాణాంతక హతాన్ని ‘సంహారం’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: גְדוֹלָה
  choice: ఘోరంగా
  rationale: అక్షరార్థంగా ‘గొప్పది/పెద్దది’; సంహార తీవ్రతను ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘ఘోరంగా’ ఎంచుకున్నాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: సాధారణ కాలసూచక పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: עֶשְׂרִים אָלֶף
  choice: ఇరవై వేలమంది
  rationale: హెబ్రీలో ‘ఇరవై వేలు’ మాత్రమే ఉంది. యుద్ధ సందర్భంలో సంఖ్య వ్యక్తులను సూచిస్తుందని తెలుగులో స్పష్టత కోసం ‘మంది’ చేర్చబడింది.
