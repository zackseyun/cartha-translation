translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, సైనిక సందర్భం మరియు హెబ్రీ పదాల భావపరిధిని నిలుపుతూ సహజమైన వాక్యనిర్మాణం ఎంచుకున్నాం.
