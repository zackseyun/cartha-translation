    issue: Awkward predicate for the slaughter
    rationale: The phrase “సంహారం ఘోరంగా ఉండి” is not the most natural modern Telugu expression. Recasting it as “ఘోరమైన సంహారం జరిగింది” improves readability without changing meaning.
  - severity: low
    issue: The casualty number is detached into a separate assertion
    rationale: Using an em dash keeps “twenty thousand” closely tied to the preceding slaughter, reflecting the Hebrew construction while retaining the supplied Telugu classifier “మంది.”
