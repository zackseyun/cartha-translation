translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘టెరెబింతు’ సాధారణ పాఠకునికి అపరిచితమైనా, చెట్టు రకాన్ని ఊహాపూర్వకంగా మార్చకుండా మూలపదానికి దగ్గరగా లిప్యంతరీకరించాం. హీబ్రూలోని ‘అబ్షాలోము గుండె/చెట్టు గుండె’ పదప్రయోగ పునరుక్తి తెలుగులో చెట్టు విషయంలో అత్యంత అసహజంగా ఉండటంతో, రెండవదాన్ని దాని సందర్భార్థమైన ‘నడిమధ్యలో’గా ఇచ్చాం.
