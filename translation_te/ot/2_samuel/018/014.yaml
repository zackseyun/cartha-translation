  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: te
  text: యోవాబు, “అలా కాదు; నీ ఎదుట నేను ఆలస్యం చేయను” అని చెప్పి, తన చేతిలో మూడు ఈటెలను[a] తీసుకున్నాడు. అబ్షాలోము ఇంకా టెరెబింతు చెట్టు[b] నడిమధ్యలో బతికి ఉండగానే, వాటిని అతని గుండెలోకి బలంగా దించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూడు కర్రలను/దండాలను.’ ఇక్కడి హీబ్రూ పదం కర్ర, దండం లేదా రాజదండాన్ని సూచించగలదు; అయితే ఈ సందర్భంలో పొడవడానికి ఉపయోగించిన ఆయుధాలనే సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఓక్ చెట్టు.’ హీబ్రూ אֵלָה సాధారణంగా టెరెబింతు చెట్టును సూచిస్తుంది; కొందరు దీనిని మరింత సాధారణంగా ‘ఓక్ చెట్టు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה
  choice: నేను ఆలస్యం చేయను
  rationale: היחל హిఫీల్ రూపం ఈ సందర్భంలో వేచి ఉండడం లేదా జాప్యం చేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆలస్యం చేయను’ సహజంగా ఉండి యోవాబు వెంటనే చర్యకు దిగుతున్న సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: ‘నీ ముఖం ముందు/నీ సమక్షంలో’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁבָטִים
  choice: ఈటెలను
  rationale: ఈ పదానికి కర్రలు, దండాలు అనే విస్తృత అర్థాలున్నా, వాటిని అబ్షాలోము గుండెలోకి దించిన సైనిక సందర్భంలో పొడిచే ఆయుధాలైన ‘ఈటెలు’ భావాన్ని స్పష్టంగా అందిస్తుంది. పదార్థంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וַיִּתְקָעֵם
  choice: వాటిని అతని గుండెలోకి బలంగా దించాడు
  rationale: תקע ఇక్కడ బలంగా లోపలికి దించడం లేదా గుచ్చడం అనే హింసాత్మక చర్యను సూచిస్తుంది. ‘బలంగా దించాడు’ ఆ తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: అతని గుండెలోకి
  rationale: మూలంలోని శరీర సంబంధమైన ‘గుండె’ను ‘ఛాతీ’గా సాధారణీకరించకుండా నేరుగా నిలుపుతుంది.
- source_word: עוֹדֶנּוּ חַי
  choice: ఇంకా ... సజీవంగా ఉండగానే
  rationale: యోవాబు పొడిచిన సమయంలో అబ్షాలోము మరణించకుండా ఇంకా బతికే ఉన్నాడనే ఉద్ఘాటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּלֵב הָאֵלָה
  choice: టెరెబింతు చెట్టు నడిమధ్యలో
  rationale: אֵלָה సాధారణంగా టెరెబింతు చెట్టును సూచిస్తుంది. చెట్టు ‘గుండెలో’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన స్థలార్థక సమానంగా ‘నడిమధ్యలో’ వాడాం; చెట్టు రకానికి ఉన్న ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
