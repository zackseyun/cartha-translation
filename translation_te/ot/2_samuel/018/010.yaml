source:
  edition: WLC
  text: וַ/יַּרְא֙ אִ֣ישׁ אֶחָ֔ד וַ/יַּגֵּ֖ד לְ/יוֹאָ֑ב וַ/יֹּ֗אמֶר הִנֵּה֙ רָאִ֣יתִי אֶת אַבְשָׁלֹ֔ם תָּל֖וּי בָּ/אֵלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: te
  text: 'ఒక మనిషి అది చూసి యోవాబుకు తెలియజేశాడు. అతడు ఇలా అన్నాడు: “ఇదిగో, అబ్షాలోము టెరెబింతు చెట్టులో[a] వేలాడుతూ ఉండడాన్ని నేను చూశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఓక్ చెట్టులో.” హీబ్రూ אֵלָה అనే పదం టెరెబింతు చెట్టును సూచించవచ్చు; కొన్నిసార్లు దానిని మరింత సాధారణంగా “ఓక్ చెట్టు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: ఒక మనిషి
  rationale: హీబ్రూ పదబంధంలోని సంఖ్యావాచక బలాన్ని, పురుష ఏకవచన సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיַּרְא
  choice: చూసి
  rationale: మూలంలో కర్మ ప్రత్యక్షంగా లేదు. సందర్భం ద్వారా అది అబ్షాలోమును సూచిస్తున్నప్పటికీ, తెలుగులో కర్మను చేర్చి భావాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూల నిర్మాణాన్ని నిలిపింది.
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: నివేదికను మరొకరికి చెప్పడం అనే נגד క్రియ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని విషయంపై నిలిపే హీబ్రూ సూచక అవ్యయ బలాన్ని, పాతకాలపు శైలి లేకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: గతంలో పూర్తయిన ప్రత్యక్ష దర్శనాన్ని తెలిపే హీబ్రూ రూపానికి సహజమైన తెలుగు సమానం.
- source_word: תָּלוּי
  choice: వేలాడుతూ ఉండడం
  rationale: నిలకడగా వేలాడుతున్న స్థితిని సూచించే హీబ్రూ కర్మణి అసమాపక క్రియ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בָּאֵלָה
  choice: టెరెబింతు చెట్టులో
  rationale: אֵלָה పదానికి మరింత నిర్దిష్టమైన వృక్షార్థం ‘టెరెబింతు.’ בְּ ఉపసర్గను ‘చెట్టులో’ అని అనువదించడం కొమ్మల మధ్య వేలాడుతున్న స్థానాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘సింధూర వృక్షం/ఓకు చెట్టు’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
