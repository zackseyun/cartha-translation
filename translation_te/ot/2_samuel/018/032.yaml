base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: te
  text: అప్పుడు రాజు కూషీయునితో, “యువకుడైన అబ్షాలోము క్షేమంగా ఉన్నాడా?[a]” అని అడిగాడు. కూషీయుడు, “నా ప్రభువైన రాజు శత్రువులూ, మీకు హాని చేయడానికి మీకు విరోధంగా లేచే వారందరూ ఆ యువకునిలా అవుతారు గాక!”[b] అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యువకుడైన అబ్షాలోము సురక్షితంగా ఉన్నాడా?” హీబ్రూలో అక్షరార్థంగా అతని ‘షాలోమ్’—అంటే శాంతి, క్షేమం, సుస్థితి—గురించి అడుగుతున్నాడు; ఇది కేవలం ప్రాణాలతో ఉన్నాడా అనే దానికంటే విస్తృతమైన పదం.
    reason: lexical_alternative
  - marker: b
    text: కూషీయుడు నేరుగా సమాధానం చెప్పలేదు. రాజు శత్రువుకు తగిన గతి అబ్షాలోముకు పట్టిందని అతని మాటలు పరోక్షంగా తెలియజేస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: కూషీయుడు
  rationale: ఇది కూషు ప్రాంతానికి చెందిన వ్యక్తిని సూచించే జాతి/ప్రాంతీయ నామం. ఆధునిక ‘ఇథియోపీయుడు’ అనే మరింత సంకుచిత గుర్తింపును రుద్దకుండా మూలపదాన్ని నిలుపుతుంది.
- source_word: הֲשָׁלוֹם לַנַּעַר לְאַבְשָׁלוֹם
  choice: యువకుడైన అబ్షాలోము క్షేమంగా ఉన్నాడా?
  rationale: שָׁלוֹם ఇక్కడ కేవలం ప్రాణాలతో ఉండడమే కాక సంపూర్ణ క్షేమాన్ని విచారిస్తుంది. నַעַר పదం అబ్షాలోము రాజు కుమారుడనే సంబంధ సందర్భంలో ‘యువకుడు’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: יִהְיוּ כַנַּעַר
  choice: ఆ యువకునిలా అవుతారు గాక
  rationale: జుస్సివ్ రూపంలోని శాపార్థక ఆకాంక్షను ‘అవుతారు గాక’ తెలియజేస్తుంది; ‘ఆ యువకుడు’ అబ్షాలోమును పరోక్షంగా సూచిస్తూ అతని మరణాన్ని బాహాటంగా చెప్పకుండా మూలంలోని పరోక్షతను కాపాడుతుంది.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు శత్రువులు
  rationale: రాజసభకు తగిన గౌరవసంబోధనను, మూలంలోని సంబంధ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וְכֹל אֲשֶׁר קָמוּ עָלֶיךָ לְרָעָה
  choice: మీకు కీడు చేయడానికి మీ మీదికి లేచే వారందరూ
  rationale: קום על అనే విరోధం/తిరుగుబాటు సూచించే నుడికారాన్ని ‘మీ మీదికి లేచే’ అని, לְרָעָה లోని హానికర ఉద్దేశాన్ని ‘కీడు చేయడానికి’ అని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: కూషీయుడు అబ్షాలోము మరణాన్ని పరోక్షంగా తెలియజేయడం
  choice: అతని మాటలను పరోక్షంగానే ఉంచడం
  alternative: ‘అబ్షాలోము చనిపోయాడు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం మరణాన్ని నేరుగా ప్రకటించకుండా, రాజు శత్రువులందరికీ అబ్షాలోము గతి పట్టాలని కోరుతుంది. ఈ కథన ఉద్వేగాన్ని మరియు భావసూక్ష్మతను అనువాదంలో నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రభువైన రాజు’ రాజసభా మర్యాదను నిలుపుతుంది; ‘అవుతారు గాక’ ఆకాంక్షతో కూడిన శాపార్థాన్ని వ్యక్తపరుస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
