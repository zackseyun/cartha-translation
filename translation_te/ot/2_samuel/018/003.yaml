source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם לֹ֣א תֵצֵ֗א כִּי֩ אִם נֹ֨ס נָנ֜וּס לֹא יָשִׂ֧ימוּ אֵלֵ֣י/נוּ לֵ֗ב וְ/אִם יָמֻ֤תוּ חֶצְיֵ֨/נוּ֙ לֹֽא יָשִׂ֤ימוּ אֵלֵ֨י/נוּ֙ לֵ֔ב כִּֽי עַתָּ֥ה כָמֹ֖/נוּ עֲשָׂרָ֣ה אֲלָפִ֑ים וְ/עַתָּ֣ה ט֔וֹב כִּי תִֽהְיֶה לָּ֥/נוּ מֵ/עִ֖יר ל/עזיר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: te
  text: కానీ ప్రజలు, “మీరు బయటికి వెళ్లవద్దు. ఎందుకంటే మేము పారిపోయినా వారు మమ్మల్ని పట్టించుకోరు[a]; మాలో సగం మంది చనిపోయినా వారు మమ్మల్ని పట్టించుకోరు. ఎందుకంటే ఇప్పుడు మీరు మాలో పదివేల మందితో సమానం[b]. కాబట్టి మీరు నగరం నుంచే మాకు సహాయం చేయడానికి సిద్ధంగా ఉండడం మంచిది[c]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు మనవైపు తమ హృదయాన్ని ఉంచరు”; అంటే వారు మనలను తమ ప్రధాన లక్ష్యంగా పరిగణించరు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యానికి మరింత అక్షరార్థ అనువాదం: “ఇప్పుడు మీరు మాలో పదివేల మందిలా ఉన్నారు.”'
    reason: lexical_alternative
  - marker: c
    text: చివరి మాటలు, దావీదు నగరంలో ఉండి అవసరమైతే సహాయం లేదా అదనపు బలగాలు అందించాలని సూచిస్తున్నట్లు కనిపిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: మీరు యుద్ధానికి రావద్దు
  rationale: సందర్భంలో ‘బయటికి వెళ్లడం’ అంటే దావీదు సైన్యంతో కలిసి యుద్ధానికి బయలుదేరడం. బలమైన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם נֹס נָנוּס
  choice: ఎందుకంటే మేము పారిపోయినా
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ పారిపోవడాన్ని బలపరుస్తుంది; షరతు భావాన్ని తెలుగులో ‘పారిపోయినా’ సహజంగా అందిస్తుంది.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: వారు మమ్మల్ని పట్టించుకోరు
  rationale: అక్షరార్థంగా ‘మనవైపు హృదయం ఉంచరు’ అనే హీబ్రూ నుడికారం. ఈ సైనిక సందర్భంలో శత్రువు వారిని ప్రధాన లక్ష్యంగా చూడడని సూచిస్తుంది.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: మాలో సగం మంది చనిపోయినా
  rationale: ‘చనిపోవడం’ అనే మూల క్రియను నిలుపుతుంది; యుద్ధంలో ‘చంపబడినా’ అని స్పష్టీకరించడం అవసరం లేదు.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: ఇప్పుడు మీరు మాలో పదివేల మందితో సమానం
  rationale: దావీదు విలువను తెలిపే భావాన్ని ఉంచుతూ, హీబ్రూలోని ‘మాలో పదివేల మందిలా’ అనే పోలికకు దగ్గరగా ఉంటుంది; ‘విలువైనవారు’ అని పూర్తిగా వ్యాఖ్యానించదు.
- source_word: וְעַתָּה טוֹב
  choice: కాబట్టి ... మంచిది
  rationale: ఇక్కడ טוֹב సూచించే మెరుగైన కార్యమార్గాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעִיר לְעָזִיר
  choice: నగరం నుంచే మాకు సహాయం చేయడానికి సిద్ధంగా ఉండడం
  rationale: מן యొక్క మూలస్థాన భావాన్ని ‘నగరం నుంచి’గా, עזר యొక్క సహాయ భావాన్ని స్పష్టంగా ఉంచుతుంది. దావీదు నగరంలో ఉండి అవసరమైనప్పుడు మద్దతు ఇవ్వాలనే సందర్భార్థాన్ని ‘సిద్ధంగా ఉండడం’ తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక ‘మీరు’ వాడబడింది. వాక్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా రూపొందించబడింది; హీబ్రూ నుడికారాలు మరియు చివరి పదబంధంలోని స్వల్ప అస్పష్టత పాదటిప్పణుల్లో నిలుపబడ్డాయి.
