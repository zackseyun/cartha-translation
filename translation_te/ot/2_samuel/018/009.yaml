  register: ఆధునిక ప్రామాణిక తెలుగులో, కథన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. వ్యక్తినామానికి ‘అబ్షాలోము’, జంతువుకు విస్తృతంగా అర్థమయ్యే ‘కంచరగాడిద’ వాడబడ్డాయి. మూలంలో లేని ‘జుట్టు’ అనే సంప్రదాయ వివరణను చేర్చలేదు.
