  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: te
  text: అబ్షాలోము దావీదు సేవకుల ఎదురుగా అనుకోకుండా వచ్చాడు. అప్పుడు అబ్షాలోము కంచరగాడిద మీద స్వారీ చేస్తున్నాడు. ఆ కంచరగాడిద ఒక పెద్ద తెరెబింత్ చెట్టు[a] దట్టమైన కొమ్మల కిందికి వెళ్లినప్పుడు, అతని తల ఆ చెట్టులో గట్టిగా చిక్కుకుంది. దాంతో అతడు ఆకాశానికీ భూమికీ మధ్య వేలాడుతూ ఉండిపోయాడు; అతని కింద ఉన్న కంచరగాడిద ముందుకు వెళ్లిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక పెద్ద ఓకు చెట్టు.’ హీబ్రూ אֵלָה అనే పదాన్ని విస్తృతార్థంలో పెద్ద చెట్టని కూడా అనువదించవచ్చు; అయితే ఇక్కడ ‘తెరెబింత్ చెట్టు’ మరింత నిర్దిష్టమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא
  choice: అనుకోకుండా వచ్చాడు
  rationale: నిఫ్అల్ రూపం ఇక్కడ ఉద్దేశపూర్వకంగా కలుసుకోవడాన్ని కాక, యాదృచ్ఛికంగా వారి ఎదుటికి రావడాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי עַבְדֵי דָוִד
  choice: దావీదు సేవకుల ఎదుటికి
  rationale: לִפְנֵי యొక్క స్థలసంబంధ భావాన్ని ‘ఎదుటికి’ సహజంగా తెలియజేస్తుంది; עֲבָדִיםకు ‘సేవకులు’ మూలపద రూపాన్ని నిలుపుతుంది, సందర్భంలో వారు దావీదు సైనికులని పాఠకుడు గ్రహించగలడు.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: కంచరగాడిద మీద స్వారీ చేస్తున్నాడు
  rationale: పాల్గొనరూపం ఆ సమయంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది; פֶּרֶדకు ఆధునిక తెలుగులో స్పష్టమైన పదం ‘కంచరగాడిద’.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: ఒక పెద్ద మస్తకి చెట్టు దట్టమైన కొమ్మల కిందికి
  rationale: שׂוֹבֶךְ సూచించే చిక్కగా అల్లుకున్న దట్టమైన కొమ్మల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. אֵלָהకు వృక్షశాస్త్రపరంగా దగ్గరైన తెలుగు పేరు ‘మస్తకి చెట్టు’.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: అతని తల ఆ చెట్టులో చిక్కుకుంది
  rationale: అక్షరార్థంలోని ‘తల గట్టిగా పట్టుకుంది’ అనే ఫలితస్థితిని, అనైచ్ఛికంగా చిక్కుకున్న భావంతో సహజ తెలుగులో అందిస్తుంది; జుట్టు అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: וַיֻּתַּן
  choice: వేలాడుతూ ఉండిపోయాడు
  rationale: נתן కర్మణి రూపానికి అక్షరార్థంగా ‘ఉంచబడ్డాడు’ అనవచ్చుగాని, సందర్భంలో ఏర్పడిన వేలాడే స్థితిని ఈ ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: ఆకాశానికి భూమికి మధ్య
  rationale: హీబ్రూ సంప్రదాయ వ్యక్తీకరణను గంభీరత కోల్పోకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: עָבָר
  choice: ముందుకు వెళ్లిపోయింది
  rationale: అబ్షాలోము చిక్కుకున్న తర్వాత జంతువు అక్కడి నుంచి కదులుతూ వెళ్లిపోయిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
