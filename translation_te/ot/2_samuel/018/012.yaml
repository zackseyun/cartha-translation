translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ చేతి-నుడికారం తెలుగులో ‘చేయి వేయను’గా నిలుపబడింది; క్లిష్టమైన చివరి పాఠం ప్రధాన వాక్యంలో సందర్భానుసారంగా చదివి, అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
