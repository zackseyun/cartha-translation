source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: te
  text: 'అప్పుడు ఆ మనిషి యోవాబుతో ఇలా అన్నాడు: “నా అరచేతుల్లో వెండి వెయ్యి తూచి పెట్టినా[a], రాజు కుమారుని మీద నేను చేయి వేయను. ఎందుకంటే రాజు మేము వింటుండగానే నీకూ, అబీషైకీ, ఇత్తయికీ, ‘నాకోసం యువకుడైన అబ్షాలోమును కాపాడండి’ అని ఆజ్ఞాపించాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “నా అరచేతుల మీద వెండి వెయ్యి తూచుతున్నా.” ఇది పెద్ద మొత్తాన్ని బరువుతో కొలిచి చెల్లింపుగా ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: వచనం చివర ఉన్న హీబ్రూ పాఠం క్లిష్టంగా ఉంది; అక్షరార్థంగా, “యువకుడైన అబ్షాలోము విషయంలో מי కాపాడండి.” 18:5లోని సమాంతర ఆజ్ఞ ఆధారంగా చాలామంది దీనిని, “నాకోసం యువకుడైన అబ్షాలోమును కాపాడండి” అని అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: నా అరచేతుల మీద వెయ్యి వెండి నాణాలు తూచి పెట్టినా
  rationale: వెండిని బరువుతో కొలిచి చేతుల్లో చెల్లింపుగా పెట్టే దృశ్యాన్ని నిలుపుతుంది. ప్రమాణపు పేరు మూలంలో స్పష్టంగా లేకపోవడంతో ‘షెకెల్లు’ అని పేర్కొనకుండా, సహజ తెలుగు కోసం ‘వెండి నాణాలు’ అని అనువదించబడింది.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: మీద నేను చేయి వేయను
  rationale: హింస చేయడం లేదా దాడి చేయడం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగు నుడికారంతో వ్యక్తపరుస్తుంది.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజు కుమారుని
  rationale: రాజుతో ఉన్న సంబంధాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: בְאָזְנֵינוּ
  choice: మేము వింటుండగానే
  rationale: అక్షరార్థమైన ‘మా చెవుల్లో’ అనే రూపానికి బదులు, ఆజ్ఞను అక్కడున్నవారు ప్రత్యక్షంగా విన్నారనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: రాజు అధికారంతో ఇచ్చిన నిర్దేశాన్ని తగిన గంభీరతతో వ్యక్తపరుస్తుంది.
- source_word: שִׁמְרוּ
  choice: కాపాడండి
  rationale: ఈ సందర్భంలో కేవలం గమనించడం కాక అబ్షాలోమును హాని నుంచి రక్షించాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: నా నిమిత్తం యువకుడైన అబ్షాలోమును
  rationale: మసోరెటిక్ పాఠంలోని క్లిష్టమైన מִי రూపాన్ని 18:5లోని సమాంతర ఆజ్ఞ వెలుగులో ‘నా నిమిత్తం’గా ప్రధాన పాఠంలో ఇచ్చి, మూలంలోని కష్టాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: నిర్దిష్టంగా ఇప్పటికే సందర్భంలో ఉన్న వ్యక్తిని సూచించే హీబ్రూ నిర్దేశకాన్ని నిలుపుతుంది.
- source_word: וְלֹא אָנֹכִי
  choice: పెట్టినా ... నేను చేయి వేయను
  rationale: మాట్లాడువాని బలమైన నిరాకరణను తెలుగులో concessive నిర్మాణం మరియు స్పష్టమైన ‘నేను’ ద్వారా తెలియజేస్తుంది.
