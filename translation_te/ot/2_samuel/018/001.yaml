  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ప్రజలు’ అనే మూలపదాన్ని నిలుపుతూ దాని సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపాం; సైనిక హోదాలకు సులభంగా అర్థమయ్యే ‘అధిపతులు’ వాడాం.
