id: 2SA.18.1
reference: 2 Samuel 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְקֹ֣ד דָּוִ֔ד אֶת הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יָּ֣שֶׂם עֲלֵי/הֶ֔ם שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֥י מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/001.yaml
  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: te
  text: దావీదు తనతో ఉన్న ప్రజలను సమీకరించి[a][b], వారిమీద వెయ్యిమందికి అధిపతులను, వందమందికి అధిపతులను నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లెక్కించి’ లేదా ‘పరిశీలించి’; ఇక్కడి హీబ్రూ క్రియ కేవలం సంఖ్య లెక్కించడమే కాకుండా సైనికులను సమీకరించి పరిశీలించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ప్రజలు’; ఈ సందర్భంలో ఇది దావీదుతో ఉన్న సైనిక బలగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: సమీకరించి
  rationale: ఈ సైనిక సందర్భంలో פקד కేవలం లెక్కించడం కాకుండా దళాన్ని సమీకరించి పరిశీలించడం లేదా క్రమబద్ధం చేయడం అనే భావాన్ని ఇస్తుంది. తరువాత అధికారులను నియమించడం ఈ అర్థానికి మద్దతిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עם యొక్క ప్రాథమిక అర్థం ‘ప్రజలు’. ఇక్కడ సందర్భానుసారంగా దావీదుతో ఉన్న సైనిక బలగాన్ని సూచించినా, మూలపదాన్ని నిలుపుకోవడానికి ‘ప్రజలు’ అని అనువదించబడింది.
- source_word: אֲשֶׁר אִתּוֹ
  choice: తనతో ఉన్న
  rationale: ఈ సంబంధవాచక పదబంధం దావీదుతో ఉన్నవారిని నేరుగా సూచిస్తుంది; ‘అతని ఆధీనంలో ఉన్న’ అని చెప్పి అధికార సంబంధాన్ని అదనంగా చేర్చలేదు.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: వారిమీద ... నియమించాడు
  rationale: שׂים עַל అనే నిర్మాణం ఇతరులపై నాయకులను ఉంచడం లేదా నియమించడం అనే పరిపాలనా భావాన్ని తెలియజేస్తుంది.
- source_word: שָׂרֵי
  choice: అధిపతులను
  rationale: שׂר నాయకుడు లేదా అధికారి అని అర్థం. ఈ సైనిక సందర్భంలో ‘అధిపతులు’ అధికార బాధ్యతను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲלָפִים
  choice: వెయ్యిమందికి
  rationale: אֶלֶף కొన్నిసార్లు ఖచ్చిత సంఖ్యకన్నా ఒక సామాజిక లేదా సైనిక విభాగాన్ని సూచించవచ్చు. అయినా ‘వేల అధిపతులు, వందల అధిపతులు’ అనే స్థిరమైన సైనిక జతలో సంఖ్యాపరమైన భావాన్ని సహజ తెలుగులో ‘వెయ్యిమందికి’ అని వ్యక్తం చేయడం సముచితం.
- source_word: מֵאוֹת
  choice: వందమందికి
  rationale: ‘వెయ్యిమందికి అధిపతులు’ అనే సైనిక-పరిపాలనా జతలో భాగంగా, సంఖ్యాపరమైన మూల నిర్మాణాన్ని ‘వందమందికి’ అని స్పష్టంగా నిలుపుతుంది.
