  source_fidelity: హీబ్రూ వచనంలోని సంభాషణ నిర్మాణం, సూచిత కర్మం (అబ్షాలోము), ‘అక్కడే/నేలకు’ అనే బలవత్తర భావం, అలాగే עָלַי + infinitive లోని బాధ్యతార్థకం సరిగ్గా ప్రతిఫలించాయి. ‘అలా చేసి ఉంటే’ అనేది సందర్భంలో అంతర్లీనంగా ఉన్న షరతును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; కొత్త అర్థాన్ని చేర్చదు.
