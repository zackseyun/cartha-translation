  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב לָ/אִישׁ֙ הַ/מַּגִּ֣יד ל֔/וֹ וְ/הִנֵּ֣ה רָאִ֔יתָ וּ/מַדּ֛וּעַ לֹֽא הִכִּית֥/וֹ שָׁ֖ם אָ֑רְצָ/ה וְ/עָלַ֗/י לָ֤/תֶת לְ/ךָ֙ עֲשָׂ֣רָה כֶ֔סֶף וַ/חֲגֹרָ֖ה אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: te
  text: అప్పుడు యోవాబు తనకు ఆ సంగతి తెలిపిన మనిషితో, “ఇదిగో, నువ్వు అతన్ని చూశావు కదా! మరి అక్కడే అతన్ని కొట్టి నేలకూల్చకపోయావెందుకు? అలా చేసి ఉంటే నీకు పది వెండి ముక్కలు[a], ఒక నడికట్టు ఇవ్వడం నా బాధ్యతగా ఉండేది[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పది వెండి’ అని ఉంది; నిర్దిష్ట కొలమానం చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను నీకు పది వెండి ముక్కలు, ఒక నడికట్టు ఇచ్చేవాణ్ణి.’ హీబ్రూ నుడికారం మరింత అక్షరార్థంగా, ‘నీకు ఇవ్వడం నాపై ఉండేది’ అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: తనకు ఆ సంగతి తెలిపిన మనిషి
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం ‘అతనికి తెలిపిన/నివేదించిన వ్యక్తి’ అనే నామవాచక భావంలో ఉంది. సందర్భంలోని ముందటి నివేదికను సహజమైన తెలుగులో తెలియజేయడానికి ‘ఆ సంగతి’ సరఫరా చేయబడింది.
- source_word: וְהִנֵּה רָאִיתָ
  choice: ఇదిగో, నువ్వు అతన్ని చూశావు కదా
  rationale: וְהִנֵּה యోవాబు ఆశ్చర్యంతో, నిందారోపణగా స్పందిస్తున్న భావాన్ని సూచిస్తుంది. రָאִיתָలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భం అబ్షాలోమును స్పష్టంగా సూచిస్తుంది; తెలుగులో ‘అతన్ని’ సహజంగా సరఫరా చేయబడింది.
- source_word: הִכִּיתוֹ שָׁם אָרְצָה
  choice: అక్కడే అతన్ని కొట్టి నేలకూల్చడం
  rationale: נכה యొక్క ‘కొట్టు’ అనే మూల చిత్రాన్ని నిలుపుతూ, אָרְצָהలోని ‘నేలవైపు/నేలకు’ భావాన్ని ‘నేలకూల్చు’ సహజంగా వ్యక్తపరుస్తుంది. ‘చంపు’ అని అనువదిస్తే సందర్భసిద్ధమైన ఫలితాన్ని మూలపదం కంటే మరీ స్పష్టంగా నిర్ణయించినట్లవుతుంది.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: నీకు ఇవ్వడం నా బాధ్యతగా ఉండేది
  rationale: עָלַי + క్రియార్థక రూపం ‘అది నాపై ఉండేది,’ అంటే బాధ్యత లేదా కర్తవ్య భావాన్ని వ్యక్తపరుస్తుంది. కేవలం ‘నేను ఇచ్చేవాణ్ణి’ అనడం ఈ నుడికారంలోని బాధ్యతా భావాన్ని తగ్గిస్తుంది.
- source_word: עֲשָׂרָה כֶסֶף
  choice: పది వెండి ముక్కలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పది వెండి’ అని మాత్రమే ఉంది; కొలమానం పేర్కొనబడలేదు. అందువల్ల ‘షెకెలులు’ లేదా ‘నాణాలు’ అని నిర్దిష్టం చేయకుండా, సహజమైన తెలుగుకోసం ‘ముక్కలు’ చేర్చబడింది.
- source_word: חֲגֹרָה אֶחָת
  choice: ఒక నడికట్టు
  rationale: חֲגֹרָה నడుముకు కట్టుకునే బెల్టు/కట్టును సూచిస్తుంది. ‘నడికట్టు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, אֶחָתలోని ‘ఒకటి’ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: וְעָלַי לָתֶת לְךָలో బాధ్యతా భావం
  choice: ఇవ్వడం నా బాధ్యతగా ఉండేది
  alternative: నేను నీకు ఇచ్చేవాణ్ణి
  rationale: ఈ నుడికారం సాధారణ భవిష్యత్ లేదా ఉద్దేశాన్ని మాత్రమే కాక, ‘నాపై ఉండేది’ అనే బాధ్యత/అవశ్యతను సూచిస్తుంది. పాఠంలోని ఉద్రిక్తతను తగ్గించకుండా ఆ భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. యోవాబు మాటల్లోని ఆశ్చర్యం మరియు మందలింపు ‘ఇదిగో… చూశావు కదా!’ ద్వారా నిలుపబడ్డాయి. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
