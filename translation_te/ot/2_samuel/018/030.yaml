translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ఆజ్ఞలోని చర్యను సహజంగా వ్యక్తపరుస్తూ, హీబ్రూ క్రియలో ఉన్న ‘తిరుగు/పక్కకు వెళ్లు’ అనే సందిగ్ధతను పాదటిప్పణిలో నిలిపాము.
