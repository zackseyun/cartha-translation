  terminology: “రాజు,” “అన్నాడు,” “నిలబడు,” “నిలబడ్డాడు” అనే పదప్రయోగాలు సందర్భానికి, కథన రిజిస్టరుకు తగినవి. ప్రత్యేక మతపరమైన పదజాల సమస్య లేదు.
