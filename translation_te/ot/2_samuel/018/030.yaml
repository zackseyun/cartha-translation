source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ סֹ֖ב הִתְיַצֵּ֣ב כֹּ֑ה וַ/יִּסֹּ֖ב וַֽ/יַּעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: te
  text: రాజు, “ఒక పక్కకు వెళ్లి ఇక్కడ నిలబడు” అన్నాడు.[a] అతడు ఒక పక్కకు వెళ్లి నిలబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనక్కి తిరిగి ఇక్కడ నిలబడు.” హీబ్రూ క్రియ సాధారణంగా తిరగడాన్ని సూచించగలదు; అయితే ఈ సందర్భంలో తరువాతి వార్తాహరునికి చోటివ్వడానికి ఒక పక్కకు వెళ్లమనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר అనే సాధారణ కథన క్రియ ప్రత్యక్ష సంభాషణను పరిచయం చేస్తోంది; ఆధునిక తెలుగు కథనంలో ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకం సందర్భంలో ఇప్పటికే తెలిసిన రాజును సూచిస్తోంది; తెలుగులో ‘రాజు’ అనడం సహజం.
- source_word: סֹב
  choice: ఒక పక్కకు వెళ్లు
  rationale: סבב ఆజ్ఞారూపం సాధారణంగా తిరగడాన్ని సూచించగలదు; ఈ సందర్భంలో తరువాతి వార్తాహరునికి చోటివ్వడానికి పక్కకు జరగమనే భావం ఎక్కువగా సరిపోతుంది.
- source_word: הִתְיַצֵּב
  choice: నిలబడు
  rationale: יצב హిత్పయేల్ ఆజ్ఞారూపం ఒక స్థానంలో నిలుచోవడం లేదా తనను తాను అక్కడ నిలబెట్టుకోవడం అనే భావాన్ని ఇస్తుంది; ‘నిలబడు’ స్పష్టమైన సహజ తెలుగు.
- source_word: כֹּה
  choice: ఇక్కడ
  rationale: ఈ ఆజ్ఞ సందర్భంలో כֹּה స్థలాన్ని సూచిస్తోంది; అందువల్ల ‘ఇక్కడ’ సరైన సమానార్థకం.
- source_word: וַיִּסֹּב
  choice: అతడు ఒక పక్కకు వెళ్లి
  rationale: ఇది ముందు ఇచ్చిన סֹב ఆజ్ఞ నెరవేర్చబడినదని చూపుతుంది; అదే పదబంధాన్ని పునరావృతం చేయడం మూలంలోని పదసంబంధాన్ని నిలుపుతుంది.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: עמד ఇక్కడ సాధారణ కథనంలో నిలుచోవడాన్ని తెలియజేస్తోంది; ‘నిలబడ్డాడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
