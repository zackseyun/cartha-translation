id: 2SA.18.19
reference: 2 Samuel 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: te
  text: 'అప్పుడు సాదోకు కుమారుడైన అహీమయసు ఇలా అన్నాడు: “దయచేసి నన్ను పరుగెత్తి రాజుకు శుభవార్తను తెలియజేయనివ్వండి; యాహ్వే ఆయనకు తన శత్రువుల చేతిలోనుండి న్యాయం చేశాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆయనను తన శత్రువుల చేతిలోనుండి విడిపించాడు.” హీబ్రూ క్రియకు ఆయన పక్షంగా తీర్పు తీర్చడం లేదా న్యాయం చేయడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: అప్పుడు సాదోకు కుమారుడైన అహీమయస్సు ... అని అన్నాడు
  rationale: వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. పుత్రసంబంధాన్ని స్పష్టంగా ఉంచి, אמרను ప్రత్యక్ష వాక్య పరిచయానికి సహజమైన ‘అని అన్నాడు’గా అనువదించాం.
- source_word: אָרוּצָה נָּא
  choice: దయచేసి నన్ను పరుగెత్తనివ్వండి
  rationale: కోహోర్టేటివ్ రూపం మాట్లాడేవాని కోరికను, נָא వినయపూర్వక అభ్యర్థనను వ్యక్తం చేస్తాయి.
- source_word: וַ/אֲבַשְּׂרָה
  choice: శుభవార్తను ... తెలియజేస్తాను
  rationale: పియేల్ בשׂר వార్తను, ఈ విజయ సందర్భంలో ముఖ్యంగా మంచి వార్తను ప్రకటించడాన్ని సూచిస్తుంది. ‘శుభవార్త’ సందర్భానుగుణ భావాన్ని ఇస్తుంది; తరువాతి సాంకేతిక మతపరమైన అర్థాన్ని ఇక్కడ బలవంతంగా మోపదు.
- source_word: אֶת הַ/מֶּלֶךְ
  choice: రాజుకు
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ సూచిక ఉన్నప్పటికీ, בשׂרతో వార్తను అందుకునే వ్యక్తిని తెలుగులో ‘రాజుకు’ అని చెప్పడం సహజం.
- source_word: כִּי
  choice: అనే
  rationale: ఇక్కడ כי వార్త యొక్క విషయాన్ని పరిచయం చేసే విధంగా గ్రహించవచ్చు; తెలుగు వాక్య నిర్మాణంలో ‘అనే శుభవార్త’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: שְׁפָטוֹ יְהוָה
  choice: యెహోవా రాజును ... విడిపించాడు
  rationale: שׁפט ప్రాథమికంగా తీర్పు తీర్చడం లేదా న్యాయం చేయడం; ఈ సందర్భంలో రాజు పక్షంగా తీర్పిచ్చి శత్రువుల అధికారంనుండి రక్షించిన ఫలితాన్ని సూచిస్తుంది. పక్కనున్న ‘శత్రువుల చేతిలోనుండి’తో సహజంగా కలిసేందుకు ‘విడిపించాడు’ ఎంచుకున్నాం; న్యాయపరమైన అంతర్భావం వ్యాఖ్యాన గమనికలో గుర్తించవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: מִ/יַּד אֹיְבָי/ו
  choice: అతని శత్రువుల చేతిలోనుండి
  rationale: ‘చేతి’ అధికారం లేదా అదుపుకు హీబ్రూ రూపకం. తెలుగు పాఠకులకు అర్థమయ్యే మూలచిత్రాన్ని అలాగే నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది సాధారణ బిరుదు కాక వ్యక్తిగత దైవనామం. ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను వాడి, మూలంలోని పేరును నిలిపాం.
- issue: שְׁפָטוֹ యొక్క న్యాయపరమైన మరియు రక్షణపరమైన భావాలు
  choice: విడిపించాడు
  alternative: అతని పక్షంగా తీర్పు తీర్చాడు / అతనికి న్యాయం చేశాడు
  rationale: శత్రువుల చేతిలోనుండి విముక్తి అనే సందర్భఫలితాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేశాం. అయినా మూల క్రియలోని న్యాయపరమైన భావం నిజమైన ప్రత్యామ్నాయం; దానిని తాత్వికంగా పూర్తిగా చెరపకుండా నిర్ణయ వివరణలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభమైన కథన శైలి. మూలంలోని ‘చేతి’ రూపకాన్ని నిలిపి, అభ్యర్థనలోని వినయాన్ని ‘దయచేసి’తో వ్యక్తం చేశాం. ఈ ముసాయిదాలో పాదసూచికలు లేవు; అందువల్ల ప్రధాన పాఠంలో సూచికలు అవసరం లేదు.
