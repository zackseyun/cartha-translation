revisions:
- from: అప్పుడు సాదోకు కుమారుడైన అహీమయస్సు, “దయచేసి నన్ను పరుగెత్తనివ్వండి; యెహోవా రాజును అతని శత్రువుల చేతిలోనుండి విడిపించాడనే శుభవార్తను నేను రాజుకు తెలియజేస్తాను” అని అన్నాడు.
  to: 'అప్పుడు సాదోకు కుమారుడైన అహీమయసు ఇలా అన్నాడు: “దయచేసి నన్ను పరుగెత్తి రాజుకు శుభవార్తను తెలియజేయనివ్వండి; యాహ్వే ఆయనకు తన శత్రువుల చేతిలోనుండి న్యాయం చేశాడు.”[a]'
  rationale: సవరించిన పాఠం రెండు హీబ్రూ కోహోర్టేటివ్‌లను ఒకే వినయపూర్వక అభ్యర్థనగా సహజ తెలుగులో నిలుపుతుంది. శׁפט యొక్క ప్రాథమిక న్యాయపరమైన భావాన్ని ప్రధాన పాఠంలో ఉంచి, సందర్భానుగుణ ‘విడిపించాడు’ అర్థాన్ని పాదసూచికలో అందిస్తుంది. దైవనామాన్ని ఆడిట్ ట్రయిల్‌కు అనుగుణంగా యాహ్వేగా, పేరును సరళమైన ధ్వన్యాత్మక రూపంలో ఇచ్చాం.
