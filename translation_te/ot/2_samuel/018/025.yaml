base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/025.yaml
  text: Then the watchman called out and told the king. And the king said[a], “If he is by himself, there is news in his mouth.” And he kept coming nearer and nearer.
translation:
  language: te
  text: అప్పుడు కావలివాడు బిగ్గరగా పిలిచి రాజుకు తెలియజేశాడు. రాజు, “అతడు ఒక్కడే అయితే, అతని నోట వార్త ఉంది[a]” అన్నాడు. అతడు అంతకంతకు దగ్గరగా వస్తూనే ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని నోట శుభవార్త ఉంది.” హీబ్రూ నామవాచకం సాధారణంగా ‘వార్త’ అని అర్థమివ్వగలదు; అయితే ఈ సందర్భంలో అది అనుకూలమైన వార్తను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: צפה నుండి వచ్చిన ఈ రూపం గమనిస్తూ కాపలా ఉండేందుకు నియమించబడిన వ్యక్తిని సూచిస్తుంది; గోడపై నుండి చూసే ఈ సందర్భంలో ‘కావలివాడు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: וַיִּקְרָא
  choice: కేకవేసి
  rationale: ఇక్కడ קרא అనేది కనిపించిన విషయాన్ని రాజుకు వినిపించేలా బిగ్గరగా పిలవడాన్ని సూచిస్తుంది; ‘కేకవేసి’ ఆ శ్రావ్యమైన ప్రకటన భావాన్ని అందిస్తుంది.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: రాజుకు తెలియజేశాడు
  rationale: Hiphil נגד అంటే తెలియజేయడం లేదా నివేదించడం; ‘రాజుకు తెలియజేశాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אִם לְבַדּוֹ
  choice: అతడు ఒక్కడే వస్తుంటే
  rationale: లెబద్దో అనే పదం ‘అతడు ఒక్కడే’ అని నేరుగా చెబుతుంది; తెలుగు సందర్భ స్పష్టత కోసం పరుగెత్తి వస్తున్న భావాన్ని ‘వస్తుంటే’ ద్వారా స్వల్పంగా పూరించాం.
- source_word: בְּשׂוֹרָה
  choice: వార్త
  rationale: בְּשׂוֹרָה సాధారణంగా ‘వార్త’ అని, సందర్భానుసారం ‘శుభవార్త’ అని అర్థం కావచ్చు. మూలంలోని అనిశ్చితిని ప్రధాన పాఠ్యంలో ‘వార్త’గా ఉంచి, అనుకూల వార్త భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: בְּפִיו
  choice: అతని నోట
  rationale: హీబ్రూ భాషా చిత్రమైన ‘అతని నోట’ను నిలిపి ఉంచడం మూలపాఠ్య స్వరూపాన్ని కాపాడుతుంది; తెలుగులోనూ ఇది అర్థమయ్యే ప్రయోగమే.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: అతడు అంతకంతకు దగ్గరగా వస్తూనే ఉన్నాడు
  rationale: ఈ నిర్మాణం కొనసాగుతున్న కదలికను, పెరుగుతున్న సమీపత్వాన్ని వ్యక్తం చేస్తుంది; ‘అంతకంతకు... వస్తూనే ఉన్నాడు’ ఆ ప్రగతిశీల భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అతని నోట వార్త ఉంది’ అనే హీబ్రూ భాషా చిత్రాన్ని ఉద్దేశపూర్వకంగా నిలిపి, בְּשׂוֹרָה లోని ‘వార్త/శుభవార్త’ అనిశ్చితిని పాదసూచిక ద్వారా సంరక్షించాం.
