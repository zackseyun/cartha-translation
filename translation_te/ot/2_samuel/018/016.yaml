  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: te
  text: అప్పుడు యోవాబు బూర ఊదాడు[a]. సైనికులు ఇశ్రాయేలును వెంబడించడం మానుకొని వెనుదిరిగారు[b]. ఎందుకంటే యోవాబు దళాలను నిలువరించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొమ్ముబూర.’ హీబ్రూ షోఫారు సాధారణంగా జంతువుల కొమ్ముతో చేసిన సంకేత వాయిద్యం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఇశ్రాయేలు’ అంటే అబ్షాలోము పక్షాన పోరాడిన ఇశ్రాయేలు దళాలు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘దళాలను వెనక్కి ఉంచాడు’; ఈ హీబ్రూ క్రియకు ‘నిలువరించడం,’ ‘వెనక్కి ఉంచడం,’ లేదా ‘కాపాడడం’ అనే భావాలు రావచ్చు. ఇక్కడ యోవాబు తన దళాలు వెంబడింపును కొనసాగించకుండా ఆపాడనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: ఊదాడు
  rationale: שׁוֹפָר అనే వాయిద్యంతో వచ్చినప్పుడు תקע దానిని ఊదడం లేదా మోగించడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘బూర ఊదాడు’ సహజమైన ప్రయోగం.
- source_word: בַּשֹּׁפָר
  choice: బూర
  rationale: שׁוֹפָר సంకేతం ఇవ్వడానికి ఉపయోగించే కొమ్ము వాయిద్యం. సైనిక కథన సందర్భంలో ‘బూర’ సహజంగా ఉండి, దాని సంకేత వాయిద్య స్వభావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּשָׁב הָעָם
  choice: ప్రజలు ... వెనుదిరిగారు
  rationale: שׁוּב ఇక్కడ వెనుదిరగడాన్ని సూచిస్తుంది. הָעָם సందర్భంలో యోవాబు సైనికులను సూచించినప్పటికీ, మూలంలోని సాధారణ పదాన్ని నిలుపుకోవడానికి ‘ప్రజలు’ ఎంచుకున్నాం.
- source_word: מִרְדֹף
  choice: వెంబడించడం మానుకొని
  rationale: מן + infinitive construct కొనసాగుతున్న చర్య నుంచి విరమించడాన్ని సూచిస్తుంది; ‘వెంబడించడం మానుకొని’ అనే రూపం తెలుగులో ఈ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: మూలంలో వెంబడింపబడుతున్న పక్షం ‘ఇశ్రాయేలు’ అని మాత్రమే ఉంది; సందర్భం అబ్షాలోము పక్షాన ఉన్న ఇశ్రాయేలు దళాలను సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי వెంబడింపు ఎందుకు ఆగిందో కారణాన్ని పరిచయం చేస్తుంది.
- source_word: חָשַׂךְ
  choice: నిలువరించాడు
  rationale: חשׂך కు ఆపడం, అదుపు చేయడం, వెనక్కి ఉంచడం, కాపాడడం వంటి భావాలు ఉండవచ్చు. ఇక్కడ యోవాబు తనవారిని వెంబడింపు కొనసాగించకుండా ఆపాడనే సందర్భార్థానికి ‘నిలువరించాడు’ సరిపోతుంది; కనికరంతో శత్రువును కాపాడాడని అనవసరంగా నిర్ధారించదు.
- source_word: אֶת הָעָם
  choice: ప్రజలను
  rationale: మొదటి הָעָם కు అనుగుణంగా ‘ప్రజలు’ అనే పదాన్నే నిలిపాం; సైనిక సందర్భం వారు యోవాబు దళాలని స్పష్టం చేస్తుంది.
