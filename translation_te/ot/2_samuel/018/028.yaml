  text: וַ/יִּקְרָ֣א אֲחִימַ֗עַץ וַ/יֹּ֤אמֶר אֶל הַ/מֶּ֨לֶךְ֙ שָׁל֔וֹם וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ לְ/אַפָּ֖י/ו אָ֑רְצָ/ה וַ/יֹּ֗אמֶר בָּרוּךְ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֤ר סִגַּר֙ אֶת הָ֣/אֲנָשִׁ֔ים אֲשֶׁר נָשְׂא֥וּ אֶת יָדָ֖/ם בַּֽ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: te
  text: అహీమయస్సు రాజును పిలిచి, “క్షేమం!”[a] అన్నాడు. తరువాత అతడు ముఖం నేలమీద ఉంచి రాజుకు సాగిలపడి, “నా ప్రభువైన రాజుకు వ్యతిరేకంగా తమ చేయి ఎత్తిన మనుష్యులను అప్పగించిన[b] నీ దేవుడైన యాహ్వే స్తుతింపబడుగాక!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతా క్షేమమే!” హీబ్రూ ‘షాలోమ్’ ఇక్కడ పలకరింపుతో పాటు క్షేమవార్తను లేదా అనుకూల ఫలితాన్ని తెలియజేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి “చేతికి అప్పగించిన” లేదా “వశపరచిన” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: బిగ్గరగా ... అన్నాడు
  rationale: దూత దూరం నుంచే రాజుకు వినిపించేలా పిలిచి చెప్పిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁלוֹם
  choice: క్షేమం!
  rationale: ఇక్కడ ఇది కేవలం పలకరింపు మాత్రమే కాక, పరిస్థితి అనుకూలంగా ఉందనే సంక్షిప్త సమాచారంగానూ పనిచేస్తుంది. ‘క్షేమం!’ మూలంలోని సంక్షిప్తతను, అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: ముఖం నేలకు ఆనించి రాజుకు సాగిలపడి
  rationale: రాజు ఎదుట నేలపై ముఖం ఉంచి చేసిన సంపూర్ణ వినయప్రణామాన్ని స్పష్టమైన, సహజమైన తెలుగులో చూపుతుంది.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే స్తుతింపబడుగాక
  rationale: ఇది దేవుణ్ణి స్తుతించే సంప్రదాయ ఆశీర్వాద సూత్రం; తెలుగులో ప్రార్థనాత్మక, గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: סִגַּר
  choice: అప్పగించిన
  rationale: శత్రువులను మరొకరి అధికారానికి లేదా చేతికి అప్పగించడం అనే సైనిక సందర్భంలోని భావాన్ని ఇస్తుంది; మూలంలో లేని స్వీకర్తను వాక్యంలో చేర్చదు.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: తమ చేతిని ఎత్తిన
  rationale: తిరుగుబాటు లేదా శత్రుత్వ చర్యను సూచించే హీబ్రూ రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుకు విరోధంగా
  rationale: దావీదును ఉద్దేశించిన ఆస్థాన గౌరవభాషను ‘నా ప్రభువైన రాజు’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- issue: בָּרוּךְ అనే స్తుతి సూత్రం
  choice: స్తుతింపబడుగాక
  alternative: ధన్యుడు
  rationale: దేవుని గురించి ‘ధన్యుడు’ అని చెప్పడం కంటే, ఈ సందర్భంలోని స్తుతి ప్రకటనను సహజమైన తెలుగు ఆరాధనా భాషలో వ్యక్తం చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించబడింది. ‘తమ చేతిని ఎత్తిన’ అనే హీబ్రూ రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘తిరుగుబాటు చేసిన’ అని పూర్తిగా వ్యాఖ్యానించలేదు.
