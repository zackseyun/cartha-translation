  source_fidelity: 'The draft preserves the verse’s sequence and core meaning: Ahimaaz calls out, reports shalom, prostrates himself, and blesses Yahweh for handing over the men who raised a hand against the king. The divine name, deferential expression ‘my lord the king,’ and the concrete Hebrew idiom of raising a hand are retained.'
