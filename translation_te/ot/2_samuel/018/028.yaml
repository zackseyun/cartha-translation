    rationale: ‘ముఖం నేలమీద ఉంచి’ clearly reflects לְאַפָּיו אָרְצָה and is more natural than ‘ముఖం నేలకు ఆనించి.’
  - severity: low
    issue: Hand idiom agreement
    rationale: ‘తమ చేయి ఎత్తిన’ is a natural Telugu distributive rendering for the Hebrew singular idiom with plural referents.
