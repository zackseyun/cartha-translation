  terminology: ‘యాహ్వే,’ ‘నా ప్రభువైన రాజు,’ and ‘క్షేమం’ are appropriate for modern standard Telugu and the requested register. ‘స్తుతింపబడుగాక’ suitably renders the blessing formula without imposing interpretation. The idiom is made natural as ‘చేయి ఎత్తిన,’ while retaining its literal imagery.
