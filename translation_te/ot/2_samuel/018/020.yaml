reference: 2 Samuel 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יוֹאָ֗ב לֹא֩ אִ֨ישׁ בְּשֹׂרָ֤ה אַתָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בִשַּׂרְתָּ֖ בְּ/י֣וֹם אַחֵ֑ר וְ/הַ/יּ֤וֹם הַ/זֶּה֙ לֹ֣א תְבַשֵּׂ֔ר כִּֽי על בֶּן הַ/מֶּ֖לֶךְ מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: te
  text: యోవాబు అతనితో, “ఈ రోజు నువ్వు వార్త తీసుకెళ్లే దూతవు కావు.[a] మరో రోజున నువ్వు వార్త తీసుకెళ్లవచ్చు. కానీ ఈ రోజు మాత్రం వార్త తీసుకెళ్లకూడదు; ఎందుకంటే రాజు కుమారుడు చనిపోయాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుభవార్త తీసుకెళ్లే దూతవు.” ఇక్కడి హెబ్రీ పదం సాధారణ వార్తను లేదా శుభవార్తను సూచించగలదు; అయితే ఈ సందర్భం రాజు కుమారుని మరణానికి సంబంధించినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: వార్త తీసుకెళ్లేవాడివి
  rationale: అక్షరార్థంగా ‘వార్తకు సంబంధించిన వ్యక్తి’ అనే భావం. సందర్భంలో యుద్ధవార్తను రాజుకు తీసుకెళ్లే దూతను సూచిస్తున్నందున, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండే ఈ రూపాన్ని ఎంచుకున్నాం. בְּשֹׂרָהకు ‘శుభవార్త’ అనే భావం కూడా ఉండగలదనే సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: וּבִשַּׂרְתָּ
  choice: నువ్వు వార్త తీసుకెళ్లవచ్చు
  rationale: ఇక్కడ రూపం భవిష్యత్ కార్యాన్ని సూచించగలిగినా, యోవాబు ఈ రోజుకు నిరాకరించి మరో రోజుకు అనుమతిస్తున్న సందర్భం వల్ల అవకాశార్థకంగా అనువదించాం.
- source_word: לֹא תְבַשֵּׂר
  choice: వార్త తీసుకెళ్లకూడదు
  rationale: לֹאతో కూడిన అసంపూర్ణ క్రియారూపం ఈ ప్రత్యక్ష సంభాషణలో ప్రస్తుత సందర్భానికి సంబంధించిన నిషేధాన్ని వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యోవాబు విధించిన నిషేధానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజు కుమారుడు
  rationale: హెబ్రీ నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: మరణం సంభవించి ఉన్న ప్రస్తుత స్థితిని సందర్భానుగుణంగా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: పునరావృతమైన కాలసూచక పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, దాని తక్షణతను కాపాడుతూ అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ అనువదించాం. ‘వార్త తీసుకెళ్లడం’ అనే పదబంధాన్ని పునరావృతం చేసి మూలంలోని בשׂר పదకుటుంబ పునరుక్తిని సాధ్యమైనంత వరకు కాపాడాం.
