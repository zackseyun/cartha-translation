  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: te
  text: అప్పుడు సైనికులు ఇశ్రాయేలును ఎదుర్కోవడానికి మైదానంలోకి బయలుదేరారు[a]. యుద్ధం ఎఫ్రాయిము అడవిలో జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రజలు’; ఇక్కడ ఈ పదం దావీదు పక్షాన యుద్ధానికి వెళ్లిన బలగాలను సూచిస్తోంది. అందుకే ‘సైనికులు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: సైనికులు
  rationale: ఈ నామవాచకానికి సాధారణంగా ‘ప్రజలు’ అని అర్థం; అయితే ఇక్కడి సైనిక సందర్భంలో ఇది దావీదు పక్షాన యుద్ధానికి బయలుదేరిన బలగాన్ని సూచిస్తోంది. అందువల్ల ఆధునిక తెలుగులో ‘సైనికులు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַשָּׂדֶה
  choice: మైదానానికి
  rationale: ఈ పదం ‘పొలం/బయలు/బహిరంగ ప్రదేశం’ అనే అర్థాలను కలిగి ఉంది. יצא (‘బయలుదేరు/బయటకు వెళ్లు’)తో కలిసి ఇక్కడ యుద్ధప్రాంతమైన బహిరంగ మైదానానికి వెళ్లడాన్ని సూచిస్తుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కోవడానికి
  rationale: మూలపదానికి ‘కలవడానికి/ఎదురుగా వెళ్లడానికి’ అనే అర్థం ఉంది; యుద్ధ సందర్భంలో శత్రుబలాన్ని ఎదుర్కోవడం భావం సహజంగా వస్తుంది. ‘ఎదుర్కోవడానికి’ ఆ సందర్భార్థాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: మూలంలోని జాతీయ నామాన్ని యథాతథంగా నిలిపాం. సందర్భంలో ఇది అబ్షాలోము పక్షాన ఉన్న ఇశ్రాయేలు బలగాలను సూచించినప్పటికీ, వచనం స్వయంగా ‘ఇశ్రాయేలు’ అనే అంటుంది.
- source_word: הַמִּלְחָמָה
  choice: యుద్ధం
  rationale: ఈ పదం ‘యుద్ధం/పోరాటం’ అని అర్థం. ఇక్కడ నిర్దిష్ట సమరాన్ని సూచిస్తున్నందున ‘యుద్ధం’ సహజమైన తెలుగు పదం.
- source_word: וַתְּהִי
  choice: జరిగింది
  rationale: అక్షరార్థంగా ‘ఉంది/సంభవించింది’; సంఘటనను సూచించే ‘యుద్ధం’తో ఆధునిక తెలుగులో ‘జరిగింది’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: ఎఫ్రాయిము అడవిలో
  rationale: יַעַר అంటే ‘అడవి/వనప్రాంతం.’ నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా ‘ఎఫ్రాయిము అడవి’గా తెలిపాం; భౌగోళిక సందిగ్ధతను పరిష్కరించడానికి అదనపు వివరణ చేర్చలేదు.
