source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/צֹּפֶ֔ה אֲנִ֤י רֹאֶה֙ אֶת מְרוּצַ֣ת הָ/רִאשׁ֔וֹן כִּ/מְרֻצַ֖ת אֲחִימַ֣עַץ בֶּן צָד֑וֹק וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אִֽישׁ ט֣וֹב זֶ֔ה וְ/אֶל בְּשׂוֹרָ֥ה טוֹבָ֖ה יָבֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: te
  text: అప్పుడు కావలివాడు, “మొదటివాడు పరుగెత్తే తీరు సాదోకు కుమారుడైన అహీమయజు పరుగెత్తే తీరులా నాకు కనిపిస్తోంది” అన్నాడు. అందుకు రాజు, “అతడు మంచి మనిషి; శుభవార్తతో వస్తున్నాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుభవార్తతో వస్తాడు.” హీబ్రూ క్రియను భవిష్యత్ భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: కాపలా కాస్తూ దూరాన్ని గమనించే వ్యక్తిని సూచించే ఈ కృదంత నామవాచకానికి కథన సందర్భంలో సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: מְרוּצַת הָרִאשׁוֹן כִּמְרֻצַת
  choice: మొదటివాడు పరుగెత్తే తీరు ... పరుగెత్తే తీరులా
  rationale: హీబ్రూలోని ‘పరుగు’ అనే నామవాచక పునరుక్తిని యథాతథంగా అనువదిస్తే తెలుగులో కృతకంగా ఉంటుంది. ‘పరుగెత్తే తీరు’ అనేది కావలివాడు వ్యక్తిని అతని పరుగు శైలిని బట్టి గుర్తిస్తున్న భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: సాదోకు కుమారుడైన అహీమయస్సు
  rationale: పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, בֶּן సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: אִישׁ טוֹב זֶה
  choice: అతడు మంచివాడు
  rationale: అక్షరార్థంగా ‘ఈయన మంచి మనిషి’ అనే నిర్మాణం ఉన్నా, ఇక్కడ సమీపిస్తున్న అహీమయస్సును గురించి రాజు చెప్పే సహజ తెలుగు రూపం ఇది.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: శుభవార్తతో వస్తున్నాడు
  rationale: בְּשׂוֹרָה טוֹבָהకు ‘శుభవార్త’ సహజమైన సమానార్థకం. సమీపిస్తున్న దూత గురించి రాజు చేస్తున్న తక్షణ నిర్ధారణగా yiqtol రూపాన్ని వర్తమాన ప్రగతిశీల భావంతో ఇచ్చింది; భవిష్యత్ అర్థసాధ్యతను పాదటిప్పణిలో నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘పరుగు’ పునరుక్తి భావాన్ని ‘పరుగెత్తే తీరు’ అనే పునరుక్తితో నిలిపి, క్రియాకాల అస్పష్టతను పాదటిప్పణిలో సంరక్షించింది.
