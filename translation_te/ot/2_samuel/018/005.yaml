  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת י֠וֹאָב וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר לְ/אַט לִ֖/י לַ/נַּ֣עַר לְ/אַבְשָׁל֑וֹם וְ/כָל הָ/עָ֣ם שָׁמְע֗וּ בְּ/צַוֺּ֥ת הַ/מֶּ֛לֶךְ אֶת כָּל הַ/שָּׂרִ֖ים עַל דְּבַ֥ר אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: te
  text: 'రాజు యోవాబును, అబీషైను, ఇత్తయిని ఇలా ఆజ్ఞాపించాడు: “నా నిమిత్తం ఆ యువకుడైన అబ్షాలోముతో సౌమ్యంగా వ్యవహరించండి.” అబ్షాలోము విషయంలో రాజు సైన్యాధిపతులందరికీ ఆజ్ఞాపించినప్పుడు ప్రజలందరూ విన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ రాజు అధికారపూర్వకంగా ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఆజ్ఞాపించాడు’ సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక బిరుదే ఉంది; అందువల్ల ‘దావీదు’ అని స్పష్టీకరించకుండా ‘రాజు’గా ఉంచాం.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: యోవాబును, అబీషైను, ఇత్తయిని
  rationale: వ్యక్తుల పేర్లను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; పునరుక్త ప్రత్యక్ష కర్మ సూచకాన్ని తెలుగు విభక్తులతో సహజంగా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని తెలుగులో సహజమైన కథన ప్రయోగమైన ‘ఇలా’తో వ్యక్తం చేశాం.
- source_word: לְאַט
  choice: సౌమ్యంగా వ్యవహరించండి
  rationale: ఈ రూపం మృదుత్వం, నిగ్రహంతో ప్రవర్తించడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో అబ్షాలోమును కఠినంగా హతమార్చకుండా చూడాలనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: לִי
  choice: నా నిమిత్తం
  rationale: దావీదు వ్యక్తిగత విజ్ఞప్తి, సంబంధపూర్వక ఆసక్తిని ‘నా కోసం’ కంటే గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לַנַּעַר
  choice: ఆ యువకుడైన
  rationale: נַעַר కు బాలుడు, యువకుడు వంటి అర్థాలున్నాయి. అబ్షాలోము వయోజనుడైనా తండ్రి దృష్టిలో పలికిన మమకార స్వరాన్ని ‘యువకుడు’ నిలుపుతుంది.
- source_word: לְאַבְשָׁלוֹם
  choice: అబ్షాలోముతో
  rationale: రెండవ ל అబ్షాలోమును ‘ఆ యువకుడు’గా గుర్తించే సంక్షిప్త అన్వయాన్ని కలిగి ఉంది; తెలుగులో ‘ఆ యువకుడైన అబ్షాలోముతో’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: ప్రజలందరూ విన్నారు
  rationale: הָעָם అక్షరార్థంగా ‘ప్రజలు’; సందర్భం సైనికమైనప్పటికీ రాజాజ్ఞ బహిరంగంగా వినబడిందనే అంశాన్ని మూలానికి దగ్గరగా ఉంచాం.
- source_word: בְּצַוֹּת
  choice: ఆజ్ఞాపించినప్పుడు
  rationale: ב తో కూడిన infinitive construct సమకాలిక పరిస్థితిని సూచిస్తుంది; తెలుగులో కాలార్థక ఉపవాక్యం సహజంగా ఉంటుంది.
- source_word: כָּל הַשָּׂרִים
  choice: సైన్యాధిపతులందరికీ
  rationale: యుద్ధ సందర్భంలో שָׂרִים సైనిక నాయకులను సూచిస్తుంది; ‘అధికారులు’ కంటే ‘సైన్యాధిపతులు’ సందర్భానుకూలంగా స్పష్టం.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: అబ్షాలోము విషయంలో
  rationale: ఈ పదబంధం ‘గురించి/విషయంలో’ అనే అర్థం ఇస్తుంది; తెలుగు కథనంలో ‘విషయంలో’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
