  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: te
  text: అప్పుడు కావలివాడు పరుగెత్తుతున్న మరొక మనిషిని చూశాడు. కావలివాడు ద్వారపాలకుణ్ణి పిలిచి, “చూడు, ఒక మనిషి ఒంటరిగా పరుగెత్తుతున్నాడు” అన్నాడు. రాజు, “ఇతడూ వార్త తెస్తున్నవాడే[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడూ వార్తాహరుడే”; ఈ హీబ్రూ కృదంతం వార్తను తెచ్చే వ్యక్తిని సూచించగలదు; తరచుగా అది శుభవార్తను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: צפה అనే ధాతువు నుంచి వచ్చిన ఈ కృదంతం గమనిస్తూ కాపలా కాసే వ్యక్తిని సూచిస్తుంది. నగర ద్వార సందర్భంలో ‘కావలివాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אִישׁ אַחֵר
  choice: మరొక మనిషి
  rationale: అతడు మొదటి పరుగెత్తువాడికి భిన్నంగా, అదనంగా కనిపించిన వ్యక్తి అని నేరుగా తెలియజేస్తుంది.
- source_word: רָץ
  choice: పరుగెత్తుకొస్తున్న
  rationale: కృదంతం కొనసాగుతున్న చర్యను చిత్రిస్తుంది; సందర్భంలో అతడు నగర ద్వారం వైపు వస్తున్నాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַשֹּׁעֵר
  choice: ద్వారపాలకుడు
  rationale: నగర ద్వారాన్ని చూసుకునే వ్యక్తిని సూచించే స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: దృష్టిని వెంటనే ఒక దృశ్యంపైకి మళ్లించే హీబ్రూ అవ్యయ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְבַדּוֹ
  choice: ఒంటరిగా
  rationale: ఆ వ్యక్తి గుంపులో కాకుండా తానే పరుగెత్తుకొస్తున్నాడనే పరిశీలనను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: גַּם זֶה
  choice: ఇతడు కూడా
  rationale: రెండవ పరుగెత్తువాడిని సూచించే זֶה యొక్క నిర్దేశక బలాన్నీ, גם యొక్క ‘కూడా’ భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: מְבַשֵּׂר
  choice: వార్త తెస్తున్నాడు
  rationale: בשׂר పీయేల్ కృదంతం వార్తను—తరచుగా శుభవార్తను—తెచ్చేవాడిని సూచించగలదు. ఇక్కడ వార్త స్వభావాన్ని అతిగా నిర్ధారించకుండా ‘వార్త తెస్తున్నాడు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించాం. ‘కావలివాడు’, ‘ద్వారపాలకుడు’ అనే పదాలు నగర ద్వార సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. హీబ్రూ వాక్యంలోని పునరుక్తిని ప్రధానంగా నిలిపినా, తెలుగు ప్రవాహం కోసం సంభాషణను సహజంగా అమర్చాం.
