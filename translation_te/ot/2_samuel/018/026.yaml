  text: וַ/יַּ֣רְא הַ/צֹּפֶה֮ אִישׁ אַחֵ֣ר רָץ֒ וַ/יִּקְרָ֤א הַ/צֹּפֶה֙ אֶל הַ/שֹּׁעֵ֔ר וַ/יֹּ֕אמֶר הִנֵּה אִ֖ישׁ רָ֣ץ לְ/בַדּ֑/וֹ וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ גַּם זֶ֥ה מְבַשֵּֽׂר־־־־׃
base_translation:
