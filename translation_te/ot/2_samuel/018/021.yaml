  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹאָב֙ לַ/כּוּשִׁ֔י לֵ֛ךְ הַגֵּ֥ד לַ/מֶּ֖לֶךְ אֲשֶׁ֣ר רָאִ֑יתָה וַ/יִּשְׁתַּ֧חוּ כוּשִׁ֛י לְ/יוֹאָ֖ב וַ/יָּרֹֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: te
  text: అప్పుడు యోవాబు కూషీయునితో[a], “నీవు వెళ్లి, నీవు చూసినదాన్ని రాజుకు తెలియజేయి” అన్నాడు. కూషీయుడు యోవాబుకు వంగి నమస్కరించి పరుగెత్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దీనిని వ్యక్తిపేరుగా తీసుకుంటే ‘కూషీ’; సాంప్రదాయకంగా ‘ఇథియోపీయుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: కూషీయుడు
  rationale: హీబ్రూ పదం సాధారణంగా కూషు ప్రాంతానికి లేదా ప్రజకు చెందిన వ్యక్తిని సూచించే జాతి/ప్రాంత నామం. అందువల్ల వ్యక్తిపేరుగా నిర్ణయించకుండా ‘కూషీయుడు’ అని అనువదించాం.
- source_word: לֵךְ
  choice: వెళ్లి
  rationale: ఆజ్ఞార్థక రూపాన్ని తెలుగు సహజ వాక్యనిర్మాణంలో తరువాతి ఆజ్ఞతో అనుసంధానిస్తూ ‘వెళ్లి’ అని ఇచ్చాం.
- source_word: הַגֵּד
  choice: తెలియజేయి
  rationale: నגד హిఫీల్ రూపం ఏదైనా సమాచారాన్ని తెలియజేయడం లేదా నివేదించడం అనే భావాన్ని ఇస్తుంది; రాజుకు వార్త అందించే సందర్భంలో ‘తెలియజేయి’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲשֶׁר רָאִיתָה
  choice: నీవు చూసినదాన్ని
  rationale: మూలంలోని సంబంధవాచక నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది; అతడు స్వయంగా చూసిన విషయమే నివేదికకు ఆధారం.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించి
  rationale: ఈ క్రియ వంగడం లేదా సాష్టాంగపడడం ద్వారా గౌరవం చూపడాన్ని సూచిస్తుంది. పూర్తిగా నేలపై పడినట్లు అతిగా నిర్దిష్టం చేయకుండా శారీరక గౌరవ చర్యను తెలిపాం.
- source_word: וַיָּרֹץ
  choice: పరుగెత్తాడు
  rationale: רוּץ క్రియ యొక్క సాధారణ, ప్రత్యక్ష అర్థాన్ని నిలుపుతూ కథన వేగాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమానుగత రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల వరుసను సహజ తెలుగులో తెలియజేస్తుంది.
