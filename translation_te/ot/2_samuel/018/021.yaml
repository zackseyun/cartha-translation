translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘కూషీయుడు’ అనే రూపం మూలంలోని జాతి/ప్రాంత సూచనను పారదర్శకంగా ఉంచుతుంది; పాదసూచికలో వ్యక్తిపేరు మరియు సాంప్రదాయక భౌగోళిక ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
