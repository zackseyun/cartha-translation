source:
  edition: WLC
  text: וְ/דָוִ֥ד יוֹשֵׁ֖ב בֵּין שְׁנֵ֣י הַ/שְּׁעָרִ֑ים וַ/יֵּ֨לֶךְ הַ/צֹּפֶ֜ה אֶל גַּ֤ג הַ/שַּׁ֨עַר֙ אֶל הַ֣/חוֹמָ֔ה וַ/יִּשָּׂ֤א אֶת עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִ֖ישׁ רָ֥ץ לְ/בַדּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: te
  text: దావీదు రెండు ద్వారాల మధ్య కూర్చుని ఉన్నాడు.[a] కావలివాడు ప్రాకారం దగ్గర ఉన్న ద్వారపు పైకప్పు మీదికి వెళ్లాడు. అతడు తలెత్తి చూడగా, ఇదిగో, ఒక మనిషి ఒంటరిగా పరుగెత్తుతూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండు ద్వారగృహాల మధ్య.” హీబ్రూలో అక్షరార్థంగా “రెండు ద్వారాల మధ్య” అని ఉంది; బహుశా కోట ప్రవేశద్వారంలోని రెండు ద్వారాల నడుమ ఉన్న స్థలాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: కూర్చుని ఉన్నాడు
  rationale: హీబ్రూ వర్తమాన క్రియారూపం ఆ సమయంలో కొనసాగుతున్న దావీదు భంగిమను సూచిస్తుంది.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: రెండు ద్వారాల మధ్య
  rationale: మూలపాఠంలోని అక్షరార్థాన్ని నిలుపుతుంది; ఇవి కోట ప్రవేశమార్గంలోని బయటి, లోపలి ద్వారాలు కావచ్చుగాని, పాఠం దానిని స్పష్టంగా చెప్పదు.
- source_word: הַצֹּפֶה
  choice: కావలివాడు
  rationale: నగర ప్రాకారం వద్ద నిఘా ఉంచే వ్యక్తిని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: ప్రాకారం దగ్గర ఉన్న ద్వారపు పైకప్పు మీదికి
  rationale: ద్వార నిర్మాణపు పైభాగానికి వెళ్లడాన్ని, ప్రాకారంతో దాని స్థలసంబంధాన్ని అనవసరమైన నిర్మాణ వివరాలు చేర్చకుండా తెలియజేస్తుంది.
- source_word: וַיִּשָּׂא אֶת עֵינָיו וַיַּרְא
  choice: తలెత్తి చూడగా
  rationale: ‘కళ్లను ఎత్తి చూశాడు’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కావలివాడి దృష్టికి అకస్మాత్తుగా కనిపించిన దృశ్యాన్ని చూపించే మూలపాఠపు సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: אִישׁ רָץ לְבַדּוֹ
  choice: ఒక మనిషి ఒంటరిగా పరుగెత్తుకుంటూ వస్తున్నాడు
  rationale: ఒక పురుషుడు ఒంటరిగా పరుగులో కనిపిస్తున్న దృశ్యాన్ని స్పష్టంగా తెలుపుతుంది; తెలుగు సందర్భంలో అతడు నగరం వైపు వస్తున్న చలనాన్ని ‘వస్తున్నాడు’ సహజంగా వ్యక్తం చేస్తుంది.
