  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ నిర్మాణ సంబంధమైన అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
