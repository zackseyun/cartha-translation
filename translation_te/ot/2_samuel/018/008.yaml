  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. అడవి, ఖడ్గం ‘మింగివేయడం’ అనే హీబ్రూ వ్యక్తీకరణను నిలిపి, అర్థాన్ని స్పష్టంగా ఉంచడానికి మరణించినవారిని సూచించే తెలుగు తులనాత్మక నిర్మాణం వాడబడింది.
