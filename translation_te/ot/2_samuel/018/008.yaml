source:
  edition: WLC
  text: וַ/תְּהִי שָׁ֧ם הַ/מִּלְחָמָ֛ה נפצית עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַ/יֶּ֤רֶב הַ/יַּ֨עַר֙ לֶ/אֱכֹ֣ל בָּ/עָ֔ם מֵ/אֲשֶׁ֥ר אָכְלָ֛ה הַ/חֶ֖רֶב בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: te
  text: అక్కడ యుద్ధం ఆ ప్రాంతమంతటా వ్యాపించింది[a]. ఆ రోజు ఖడ్గం మింగివేసినదానికంటే అడవి ప్రజలను ఎక్కువగా మింగివేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ యుద్ధం ఆ ప్రాంతమంతటా చెల్లాచెదురుగా సాగింది.” హీబ్రూ పదం యుద్ధం ఆ ప్రాంతమంతటా విస్తరించి, చెదరిపోయిన విధానాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: వ్యాపించింది
  rationale: פוץ నిఫాల్ రూపం చెల్లాచెదరవడం లేదా విస్తరించడాన్ని సూచిస్తుంది. యుద్ధం విస్తృత ప్రాంతానికి వ్యాపించిందనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: ఆ ప్రాంతమంతటా
  rationale: ఇక్కడ הָאָרֶץ భూమండలాన్ని కాక యుద్ధం జరిగిన స్థానిక ప్రాంతాన్ని సూచిస్తుంది. హీబ్రూ వాక్యబంధంలోని విస్తృతి భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וירב ... לֶאֱכֹל
  choice: మింగివేసినవారే ఎక్కువ
  rationale: רבה, לֶאֱכֹל, మరియు తులనార్థక מֵאֲשֶׁר కలిపి, అడవి కారణంగా మరణించినవారు ఖడ్గం వల్ల మరణించినవారికంటే ఎక్కువని తెలియజేస్తాయి; అదే సమయంలో 'మింగివేయడం' అనే రూపకాన్ని నిలుపుతుంది.
- source_word: היער
  choice: అడవి
  rationale: יַעַר అనే అరణ్య ప్రాంతానికి సాధారణంగా అర్థమయ్యే సహజ తెలుగు పదం.
- source_word: לֶאֱכֹל / אכלה
  choice: మింగివేసిన
  rationale: హీబ్రూలో రెండుసార్లు వచ్చిన 'తిను/మింగివేయు' రూపకాన్ని అడవి, ఖడ్గం రెండింటికీ ఒకే పదంతో నిలిపి, వ్యక్తీకరణను మరియు సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: בעם
  choice: వారిని / వారే
  rationale: ప్రజలలో మరణించినవారిని భాగార్థకంగా సూచించే భావాన్ని తెలుగు తులనాత్మక నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ביום ההוא
  choice: ఆ రోజు
  rationale: కాలసూచక హీబ్రూ పదబంధానికి సహజమైన కథన తెలుగు రూపం.
