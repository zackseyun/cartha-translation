source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת אַבְשָׁל֗וֹם וַ/יַּשְׁלִ֨יכוּ אֹת֤/וֹ בַ/יַּ֨עַר֙ אֶל הַ/פַּ֣חַת הַ/גָּד֔וֹל וַ/יַּצִּ֧בוּ עָלָ֛י/ו גַּל אֲבָנִ֖ים גָּד֣וֹל מְאֹ֑ד וְ/כָל יִשְׂרָאֵ֔ל נָ֖סוּ אִ֥ישׁ ל/אהל/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: te
  text: వారు అబ్షాలోమును తీసుకొని, అడవిలోని పెద్ద గోతిలో పడవేశారు. అతని మీద చాలా పెద్ద రాళ్లకుప్పను పేర్చారు. ఇశ్రాయేలీయులందరూ తమ తమ గుడారాలకు పారిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తమ తమ గుడారాలకు” అంటే తమ తమ నివాసాలకు లేదా ఇళ్లకు వెళ్లిపోయారని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియను అదనపు బలార్థం చేర్చకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: అతనిని ... పడవేశారు
  rationale: శవాన్ని అవమానకరంగా గోతిలో పారవేసిన భావాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  choice: అడవిలోని పెద్ద గోతిలో
  rationale: יַעַר ను ‘అడవి’గా, פַּחַת ను ‘గోతి’గా నేరుగా అనువదిస్తూ, గమ్యాన్ని సూచించే אֶל భావాన్ని తెలుగు విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: וַיַּצִּבוּ עָלָיו גַּל אֲבָנִים
  choice: అతని మీద ... రాళ్లకుప్పను పేర్చారు
  rationale: రాళ్లను అతని మీద కుప్పగా ఏర్పాటు చేసిన దృశ్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: גָּדוֹל מְאֹד
  choice: చాలా పెద్ద
  rationale: విశేషణానికి מְאֹד ఇచ్చే తీవ్రతను సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సామూహిక జాతీయ నామాన్ని తెలుగులో వ్యక్తుల సమూహంగా సహజంగా తెలియజేస్తుంది.
- source_word: נָסוּ אִישׁ לְאֹהָלוֹ
  choice: తమ తమ గుడారాలకు పారిపోయారు
  rationale: נוּס యొక్క ‘పారిపోవడం’ భావాన్నీ, אִישׁ యొక్క పంపిణీ భావాన్నీ, אֹהֶל యొక్క ప్రత్యక్ష రూపకాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: אִישׁ לְאֹהָלוֹ లోని పంపిణీ మరియు లింగవ్యక్తీకరణ
  choice: తమ తమ గుడారాలకు
  alternative: ప్రతి పురుషుడు తన గుడారానికి
  rationale: ఇక్కడ אִישׁ ఏకవచన పుంలింగ రూపంలో ఉన్నా, మొత్తం సైన్యం చెదరిపోయిందనే పంపిణీ భావమే ప్రధానము. ‘తమ తమ’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; అవసరం లేని లింగ పరిమితిని చేర్చదు.
- issue: לְאֹהָלוֹ ను ప్రత్యక్షంగా లేదా నుడికారంగా అనువదించడం
  choice: గుడారాలకు
  alternative: ఇళ్లకు
  rationale: ‘గుడారం’ మూలపాఠంలోని దృశ్యాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది నివాసస్థలాన్ని సూచించే నుడికారమై ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే కథనశైలి. సంస్కృతభారం, ప్రాచీన క్రియారూపాలు తగ్గించబడ్డాయి; మూలంలోని వరుస చర్యలు స్పష్టంగా ఉంచబడ్డాయి.
