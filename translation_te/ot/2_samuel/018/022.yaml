source:
  edition: WLC
  text: וַ/יֹּ֨סֶף ע֜וֹד אֲחִימַ֤עַץ בֶּן צָדוֹק֙ וַ/יֹּ֣אמֶר אֶל יוֹאָ֔ב וִ֣/יהִי מָ֔ה אָרֻֽצָה נָּ֥א גַם אָ֖נִי אַחֲרֵ֣י הַ/כּוּשִׁ֑י וַ/יֹּ֣אמֶר יוֹאָ֗ב לָֽ/מָּה זֶּ֞ה אַתָּ֥ה רָץ֙ בְּנִ֔/י וּ/לְ/כָ֖ה אֵין בְּשׂוֹרָ֥ה מֹצֵֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: te
  text: 'సాదోకు కుమారుడైన అహీమయస్సు యోవాబుతో మళ్లీ ఇలా అన్నాడు: “ఏమి జరిగినా సరే, దయచేసి నేను కూడా కూషీయుని వెనుక పరుగెత్తనివ్వండి.” అందుకు యోవాబు, “నా కుమారుడా, నువ్వెందుకు పరుగెత్తాలి? నీకు ప్రతిఫలం తెచ్చే వార్త ఏదీ లేదు కదా[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ వాక్యభాగం క్లిష్టంగా ఉంది. దీని అర్థం “నీ వార్త అనుకూలంగా స్వీకరించబడదు” లేదా “ఆ వార్తకు నీకు ప్రతిఫలం దొరకదు” అని కూడా కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: మళ్లీ ఇలా అన్నాడు
  rationale: ‘మరల జోడించాడు’ అనే హీబ్రూ ప్రయోగం ఇక్కడ అభ్యర్థనను పునరావృతం చేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా ఉంది.
- source_word: וִיהִי מָה
  choice: ఏమైతే అది కానివ్వండి
  rationale: పరిణామం ఏదైనా సరే అన్న పట్టుదలను వ్యక్తం చేసే హీబ్రూ నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: אָרֻצָה נָּא
  choice: దయచేసి నన్ను ... పరుగెత్తనివ్వండి
  rationale: కోహోర్టేటివ్ రూపం మరియు נָא కలిపి వినయపూర్వకమైనప్పటికీ పట్టుదలగల అభ్యర్థనను సూచిస్తాయి.
- source_word: גַם אֲנִי
  choice: నన్ను కూడా
  rationale: అప్పటికే పంపబడిన కూషీయునికి అదనంగా తానూ పరుగెత్తాలనే అహీమయస్సు కోరికను స్పష్టంగా చూపిస్తుంది.
- source_word: הַכּוּשִׁי
  choice: కూషీయుడు
  rationale: జాతివాచకాన్ని నేరుగా అందిస్తూ, ‘ఇథియోపీయుడు’ అనే తరువాతి భౌగోళిక గుర్తింపును అనవసరంగా దిగుమతి చేయదు.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: నువ్వెందుకు పరుగెత్తాలి?
  rationale: యోవాబు వ్యక్తం చేసిన ప్రశ్నార్థక అభ్యంతరాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; זֶה యొక్క బలాన్ని ప్రశ్న స్వరంలో ప్రతిబింబిస్తుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ఇది తప్పనిసరిగా రక్తసంబంధాన్ని సూచించకుండా ఆప్యాయమైన లేదా పెద్దరికంతో కూడిన సంబోధనను నిలుపుతుంది.
- source_word: אֵין בְּשׂוֹרָה מֹצֵאת
  choice: నీకు ప్రతిఫలం తెచ్చే శుభవార్త ఏదీ లేదు
  rationale: క్లిష్టమైన, సంక్షిప్తమైన హీబ్రూ వాక్యభాగానికి సందర్భానుకూల ప్రధాన అర్థాన్ని ఇస్తూ, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: אֵין בְּשׂוֹרָה מֹצֵאת అనే క్లిష్టమైన చివరి వాక్యభాగం
  choice: నీకు ప్రతిఫలం తెచ్చే శుభవార్త ఏదీ లేదు
  alternative: నీ వార్త అనుకూలంగా స్వీకరించబడదు
  rationale: ఇది సిద్ధాంత సంబంధమైన నిర్ణయం కాకపోయినా కథనార్థంపై ప్రభావం చూపుతుంది. מֹצֵאת అనే పదం లాభం లేదా అనుకూల ఫలితం దొరకడాన్ని సూచించవచ్చు; అందువల్ల ప్రధాన పాఠంలో ప్రతిఫల భావాన్ని ఉంచి, నిజమైన అస్పష్టతను పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తుల పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. హీబ్రూ నుడికారాన్ని అతి శాబ్దికంగా కాకుండా స్పష్టంగా అందించాం; చివరి క్లిష్ట వాక్యభాగంలోని అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
