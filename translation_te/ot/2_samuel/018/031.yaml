  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: te
  text: 'ఇదిగో, కూషీయుడు[a] వచ్చాడు. కూషీయుడు ఇలా అన్నాడు: “నా ప్రభువైన రాజా, మీకు శుభవార్త! యాహ్వే ఈ రోజు మీకు విరోధంగా లేచిన వారందరి చేతిలోనుండి మీ పక్షంగా తీర్పు తీర్చాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కూషు దేశస్థుడు”; సాంప్రదాయంగా, “ఇథియోపీయుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ రోజు యాహ్వే నీ పక్షంగా తీర్పు తీర్చాడు” లేదా “నీకు న్యాయం చేశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కొత్త వ్యక్తి రాకను సజీవంగా చూపించే హీబ్రూ కథన సూచకాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: הַכּוּשִׁי
  choice: కూషీయుడు
  rationale: నిర్దిష్ట వ్యక్తిపేరు కాకుండా కూషు ప్రాంతానికి చెందినవాడనే జాతి/ప్రాంత సూచనను హీబ్రూకు దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: יִתְבַּשֵּׂר
  choice: శుభవార్త అందుగాక
  rationale: హిత్పయేల్ అసంపూర్ణ క్రియ ఇక్కడ ఆశీర్వాదాత్మక/ఆజ్ఞార్థక భావంతో ఉంది; రాజును ఉద్దేశించిన దూత ప్రకటనకు ఈ తెలుగు రూపం సహజంగా సరిపోతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలో గౌరవపూర్వక సంబోధనను చూపుతుంది; సందర్భంలో ‘ప్రభువు’ దైవత్వాన్ని సూచించదు.
- source_word: שְׁפָטְךָ
  choice: నీకు న్యాయం తీర్చాడు
  rationale: שׁפט క్రియలోని న్యాయతీర్పు మరియు దావీదు పక్షంగా చేసిన న్యాయచర్య—రెండింటినీ నిలుపుతుంది; ‘నిన్ను నిర్దోషిగా తీర్చాడు’ అని అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఇస్తుంది; దానిని కేవలం బిరుదుగా మార్చదు.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: వ్యతిరేకుల అధికారాన్ని సూచించే హీబ్రూ దృశ్యరూపాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: నీకు విరోధంగా లేచిన వారందరు
  rationale: קום + על లోని శత్రుత్వపూర్వకంగా లేచే భావాన్ని కాపాడుతుంది; వారిని ప్రత్యేకంగా ‘తిరుగుబాటుదారులు’ అని మూలం కంటే సంకుచితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో స్థిరపడి విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపాన్ని ఉపయోగించడం ద్వారా దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నామ స్వరూపాన్ని నిలుపుతుంది.
- issue: שְׁפָטְךָ లో న్యాయతీర్పు మరియు విమోచన భావాల సంబంధం
  choice: నీకు న్యాయం తీర్చాడు
  alternative: నిన్ను సమర్థించాడు / నీ పక్షంగా తీర్పు తీర్చాడు
  rationale: ఈ క్రియ దావీదు పక్షంగా దేవుడు న్యాయచర్య చేసినట్లు సూచిస్తుంది. ‘నీకు న్యాయం తీర్చాడు’ అనే రూపం న్యాయపరమైన భావాన్ని నిలుపుతూ, దావీదు నైతిక నిర్దోషిత్వంపై మూలం చెప్పినదానికంటే ఎక్కువ నిర్ణయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథన గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. రాజసభ సంబోధనలో మర్యాదను, దూత మాటల్లోని శుభవార్త స్వరాన్ని కాపాడాం. మూలంలోని న్యాయపరమైన బహుఅర్థతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలిపాం.
