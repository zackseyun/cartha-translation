id: 2SA.18.2
reference: 2 Samuel 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: te
  text: 'దావీదు సైన్యాన్ని పంపించాడు: మూడింట ఒక వంతును యోవాబు ఆధ్వర్యంలో, మూడింట ఒక వంతును సెరూయా కుమారుడూ యోవాబు సోదరుడూ అయిన అబీషై ఆధ్వర్యంలో, మూడింట ఒక వంతును గిత్తీయుడైన ఇత్తయి ఆధ్వర్యంలో పంపించాడు. రాజు సైన్యంతో, “నేను కూడా తప్పకుండా మీతో బయలుదేరుతాను” అని అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: పంపించాడు
  rationale: యుద్ధానికి సైన్యాన్ని పంపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: הָעָם
  choice: సైన్యాన్ని / సైన్యంతో
  rationale: పదశః ‘ప్రజలు’ అయినా, ఈ యుద్ధ సందర్భంలో దావీదు పోరాట దళాన్ని సూచిస్తుంది.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: మూడవ వంతును
  rationale: సైన్యాన్ని మూడు సమాన విభాగాలుగా విభజించిన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּיַד
  choice: అధీనంలో
  rationale: పదశః ‘చేతిలో’; ఇక్కడ సైనిక నాయకత్వం లేదా అధికారానికి అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారం.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: సెరూయా కుమారుడూ యోవాబు సోదరుడూ అయిన అబీషై
  rationale: రెండు కుటుంబ సంబంధాలనూ సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: אִתַּי הַגִּתִּי
  choice: గిత్తీయుడైన ఇత్తయి
  rationale: వ్యక్తి పేరును, గాతు ప్రాంతానికి చెందినవాడనే జాతివాచక గుర్తింపును నిలుపుతుంది.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: יָצֹא אֵצֵא
  choice: తప్పకుండా ... బయలుదేరుతాను
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే నిశ్చయాత్మక ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: גַּם אֲנִי
  choice: నేను కూడా
  rationale: రాజు వ్యక్తిగతంగా వారితో చేరతాడనే అదనపు ఉద్ఘాటనను నేరుగా నిలుపుతుంది.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: సైన్యంతో కలిసి వెళ్లడాన్ని సూచించే సరళమైన సహచర్య ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. సైనిక సందర్భాన్ని బట్టి הָעָםను ‘సైన్యం’గా సందర్భానుగుణంగా అనువదించాం. בְּיַד అనే నుడికారాన్ని సహజంగా ‘అధీనంలో’ అని ఇచ్చినందున పాదటిప్పణి అవసరం లేదు.
