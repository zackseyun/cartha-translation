  to: 'దావీదు సైన్యాన్ని పంపించాడు: మూడింట ఒక వంతును యోవాబు ఆధ్వర్యంలో, మూడింట ఒక వంతును సెరూయా కుమారుడూ యోవాబు సోదరుడూ అయిన అబీషై ఆధ్వర్యంలో, మూడింట ఒక వంతును గిత్తీయుడైన ఇత్తయి ఆధ్వర్యంలో పంపించాడు. రాజు సైన్యంతో, “నేను కూడా తప్పకుండా మీతో బయలుదేరుతాను” అని అన్నాడు.'
