translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఏమైతేనేం’ అహీమయస్సు పట్టుదలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. ‘కూషీయుడు’ మూలంలోని జాతి-భౌగోళిక designation‌ను నిలుపుతుంది; ‘మైదాన మార్గం’ అవసరానికి మించిన భౌగోళిక వివరణను నివారిస్తుంది.
