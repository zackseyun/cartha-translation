  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: te
  text: అయినా అతడు, “ఏమైతేనేం, నన్ను పరుగెత్తనివ్వండి” అన్నాడు.[a] అప్పుడు యోవాబు అతనితో, “పరుగెత్తు” అన్నాడు. అహీమయసు మైదానపు మార్గంలో పరుగెత్తి, కూషీయుణ్ణి దాటిపోయాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏది జరిగినా నేను పరుగెత్తుతాను.” హీబ్రూ నుడికారం, ఫలితం ఏదైనా సరే పరుగెత్తాలనే అహీమయసు పట్టుదలను తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “మైదానం” బహుశా యొర్దాను మైదానాన్ని సూచిస్తుంది; అయితే ప్రధాన పాఠంలో అంత స్పష్టంగా పేర్కొనాలని హీబ్రూ నిర్బంధించదు.
    reason: cultural_note
  - marker: c
    text: లేదా, “పరుగులో కూషీయుణ్ణి అధిగమించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: అయినా అతడు, “ఏమైతేనేం, నన్ను పరుగెత్తనివ్వండి” అన్నాడు
  rationale: ఈ సందర్భంలో హీబ్రూ నుడికారం ఫలితం ఏదైనా సరే పరుగెత్తాలనే అహీమయస్సు పట్టుదలనూ, అనుమతి కోసం అతడు చేసిన విజ్ఞప్తినీ వ్యక్తం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ రెండు భావాలనూ ఈ రూపం నిలుపుతుంది.
- source_word: רוּץ
  choice: పరుగెత్తు
  rationale: רוץ అనే క్రియకు ఇది నేరమైన ఆజ్ఞార్థక అనువాదం.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: మైదాన మార్గంలో
  rationale: דֶּרֶךְ అంటే మార్గం; הַכִּכָּר ఇక్కడ మైదాన ప్రాంతాన్ని, బహుశా యొర్దాను మైదానాన్ని, సూచిస్తుంది. ప్రధాన పాఠంలో భౌగోళిక వివరాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: కూషీయుణ్ణి దాటిపోయాడు
  rationale: עבר ప్రత్యక్ష కర్మతో ‘దాటిపోవడం’ లేదా ‘అధిగమించడం’ అనే అర్థాన్నిస్తుంది. పరుగుపందెం సందర్భంలో ముందుకు వెళ్లిపోయాడనే భావం స్పష్టంగా ఉన్నా, ‘పరుగులో అధిగమించాడు’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో నిర్బంధించకుండా ఈ అనువాదం మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: הַכּוּשִׁי
  choice: కూషీయుడు
  rationale: ఇది కూషు దేశానికి లేదా ప్రజకు చెందిన వ్యక్తిని సూచించే జాతి-భౌగోళిక పదం. సంప్రదాయ ‘ఇథియోపీయుడు’ కంటే ‘కూషీయుడు’ హీబ్రూ designation‌ను నేరుగా నిలుపుతుంది.
- source_word: אֲחִימַעַץ
  choice: అహీమయస్సు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు పఠనానికి సహజంగా ఉండే ధ్వని రూపంలో లిప్యంతరీకరించాం.
