  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: te
  text: లేదా, నేను అతని ప్రాణం విషయంలో ద్రోహం చేసి ఉంటే—ఏ విషయమూ రాజుకు దాగి ఉండదు—నువ్వే పక్కకు తప్పుకొని నిలిచేవాడివి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: నేను అతని ప్రాణానికి విరోధంగా మోసం చేసి ఉంటే
  rationale: ‘అతని ప్రాణం విషయంలో అబద్ధం/ద్రోహం చేయడం’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, అబ్షాలోమును చంపడం ద్వారా రాజాజ్ఞకు ద్రోహం చేసే సందర్భాన్ని నిలుపుతుంది.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: ఏ విషయమూ రాజుకు మరుగై ఉండదు
  rationale: יִכָּחֵד యొక్క ‘దాచబడడం, మరుగై ఉండడం’ అనే భావాన్ని, రాజుకు ఏ సంగతీ తెలియకుండా ఉండదనే సాధారణ వాక్యంగా అందిస్తుంది.
- source_word: וְאַתָּה תִּתְיַצֵּב מִנֶּגֶד
  choice: నువ్వే నాకు ఎదురుగా నిలిచేవాడివి
  rationale: מִנֶּגֶד అంటే ‘ఎదురుగా/దూరంగా’ అని ఉండవచ్చు. సందర్భంలో యోవాబు ఆ సైనికునికి మద్దతివ్వకుండా అతనికి వ్యతిరేకంగా నిలబడతాడనే భావం బలంగా ఉంది; ‘నాకు’ అనేది తెలుగులో అంతర్లీన సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని షరతుతో కూడిన ఊహాత్మక వాక్యాన్ని, మధ్యలో రాజుకు ఏదీ మరుగుకాదనే వ్యాఖ్యను అలాగే నిలిపాం.
