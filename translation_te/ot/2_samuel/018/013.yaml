revisions:
- from: లేదా, నేను అతని ప్రాణానికి విరోధంగా మోసం చేసి ఉంటే—ఏ విషయమూ రాజుకు మరుగై ఉండదు—నువ్వే నాకు ఎదురుగా నిలిచేవాడివి.
  to: లేదా, నేను అతని ప్రాణం విషయంలో ద్రోహం చేసి ఉంటే—ఏ విషయమూ రాజుకు దాగి ఉండదు—నువ్వే పక్కకు తప్పుకొని నిలిచేవాడివి.
  rationale: The revision removes the unsupported explicit object in the final clause and uses smoother modern Telugu. It preserves the conditional construction, the king’s awareness, and the English audit trail’s contextual rendering of the final phrase as standing aside, without asserting a denominational or interpretive conclusion.
  reviewer_model: gpt-5.6-terra
