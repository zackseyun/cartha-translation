source:
  edition: WLC
  text: וְ/אַבְשָׁלֹ֣ם לָקַ֗ח וַ/יַּצֶּב ל֤/וֹ ב/חי/ו אֶת מַצֶּ֨בֶת֙ אֲשֶׁ֣ר בְּ/עֵֽמֶק הַ/מֶּ֔לֶךְ כִּ֤י אָמַר֙ אֵֽין לִ֣/י בֵ֔ן בַּ/עֲב֖וּר הַזְכִּ֣יר שְׁמִ֑/י וַ/יִּקְרָ֤א לַ/מַּצֶּ֨בֶת֙ עַל שְׁמ֔/וֹ וַ/יִּקָּ֤רֵא לָ/הּ֙ יַ֣ד אַבְשָׁלֹ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: te
  text: అబ్షాలోము తన జీవితకాలంలో రాజు లోయలో ఉన్న ఒక స్తంభాన్ని తీసుకొని తనకోసం నిలబెట్టాడు. ఎందుకంటే, “నా పేరు జ్ఞాపకంగా నిలిచేలా చేయడానికి నాకు కుమారుడు లేడు” అని అతడు అన్నాడు. అతడు ఆ స్తంభానికి తన పేరే పెట్టాడు. అది ఈనాటివరకు “అబ్షాలోము స్మారకచిహ్నం”[a] అని పిలువబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా “అబ్షాలోము చేయి.” ఇక్కడ “చేయి” అనేది స్మారకచిహ్నం లేదా జ్ఞాపకార్థక గుర్తును సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לוֹ
  choice: తన కోసం నిలబెట్టుకున్నాడు
  rationale: లָקַח తరువాతి క్రియతో కలిసి కార్యాన్ని ముందుకు నడిపే ప్రయోగంగా ఉంది. తెలుగులో అసహజమైన ‘తీసుకొని’ అనే పదాన్ని విడిగా పెట్టకుండా, స్తంభాన్ని తన కోసం స్థాపించుకున్న భావాన్ని సహజంగా తెలిపింది.
- source_word: בְחַיּו
  choice: తాను బ్రతికి ఉన్నప్పుడే
  rationale: అబ్షాలోము తన జీవితకాలంలోనే దీనిని చేశాడనే కాలార్థాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַצֶּבֶת
  choice: స్తంభం
  rationale: ఈ పదం నిలబెట్టిన రాయి లేదా స్తంభాన్ని సూచిస్తుంది; మూలంలోని స్పష్టమైన భౌతిక రూపాన్ని కాపాడుతుంది.
- source_word: בְעֵמֶק הַמֶּלֶךְ
  choice: రాజు లోయలో
  rationale: స్థలనామంలోని పదబంధాన్ని నేరుగా, తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: నా పేరు జ్ఞాపకంగా ఉండేలా చేయడానికి
  rationale: తన పేరు మరువబడకుండా నిలవాలనే ఉద్దేశాన్ని తెలియజేస్తూ, హిఫీల్ రూపంలోని కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: ఆ స్తంభానికి తన పేరే పెట్టాడు
  rationale: హెబ్రీ నామకరణ ప్రయోగాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది; ‘తన పేరే’ అనే రూపం స్వీయనామకరణాన్ని చూపిస్తుంది.
- source_word: יַד אַבְשָׁלוֹם
  choice: అబ్షాలోము స్మారకచిహ్నం
  rationale: יַד అక్షరార్థంగా ‘చేయి’ అయినా, ఇక్కడ జ్ఞాపకార్థంగా నిలిపిన గుర్తు లేదా స్మారకాన్ని సూచిస్తుంది. పాఠ్యంలో భావాన్ని ఇచ్చి, అసాధారణమైన అక్షరార్థాన్ని పాదసూచికలో కాపాడింది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: పేరు రచయిత కాలం వరకు వాడుకలో కొనసాగిందనే హెబ్రీ కాలసూత్రానికి సహజమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని స్తంభం అనే భౌతిక చిత్రాన్ని కాపాడుతూ, יַד అనే అసాధారణ నామాన్ని పాఠ్యంలో భావానువాదంగా మరియు పాదసూచికలో అక్షరార్థంగా ఇచ్చింది.
