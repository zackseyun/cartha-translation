id: 2SA.18.15
reference: 2 Samuel 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ עֲשָׂרָ֣ה נְעָרִ֔ים נֹשְׂאֵ֖י כְּלֵ֣י יוֹאָ֑ב וַ/יַּכּ֥וּ אֶת אַבְשָׁל֖וֹם וַ/יְמִיתֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/015.yaml
  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: te
  text: అప్పుడు యోవాబు ఆయుధాలను మోసే పదిమంది యువకులు అబ్షాలోమును చుట్టుముట్టి, అతనిని కొట్టి చంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: చుట్టుముట్టి
  rationale: సבב అనే క్రియ ఇక్కడ ఒక వ్యక్తి చుట్టూ చేరి అతనిని ఆవరించడాన్ని సూచిస్తుంది; ‘చుట్టుముట్టి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עֲשָׂרָה נְעָרִים
  choice: పదిమంది యువకులు
  rationale: נְעָרִים ఇక్కడ పిల్లలను కాక, సైనిక సేవలో ఉన్న యువకులను సూచిస్తుంది; వారి హోదాను అవసరానికి మించి నిర్దిష్టం చేయకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: యోవాబు ఆయుధాలను మోసే
  rationale: ఈ పదబంధం అక్షరార్థంగా యోవాబు సామగ్రి లేదా ఆయుధాలను మోసేవారిని సూచిస్తుంది. ‘ఆయుధాలను మోసే’ అనేది సందర్భానికి స్పష్టంగా ఉండి, వారి ఖచ్చితమైన అధికారిక హోదాను ఊహించదు.
- source_word: וַיַּכּוּ
  choice: కొట్టి
  rationale: נכה అనే విస్తృతార్థక క్రియలోని శారీరకంగా దెబ్బకొట్టే చర్యను ‘కొట్టి’ నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְמִיתֻהוּ
  choice: చంపారు
  rationale: מות హిఫిల్ రూపం ‘చనిపోయేలా చేయడం’ లేదా ‘చంపడం’ అని అర్థం; కథనంలో ‘చంపారు’ అత్యంత సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు—చుట్టుముట్టడం, కొట్టడం, చంపడం—స్పష్టంగా నిలుపబడ్డాయి.
