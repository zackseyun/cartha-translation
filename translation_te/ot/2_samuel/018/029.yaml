translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజుతో మాట్లాడే సందర్భంలోని వినయాన్ని ‘మీ సేవకుణ్ణి’ ద్వారా నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘కలకలం’ పదం వద్ద ఉంచాం.
