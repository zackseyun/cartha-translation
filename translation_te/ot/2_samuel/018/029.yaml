  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ שָׁל֥וֹם לַ/נַּ֖עַר לְ/אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר אֲחִימַ֡עַץ רָאִיתִי֩ הֶ/הָמ֨וֹן הַ/גָּד֜וֹל לִ֠/שְׁלֹחַ אֶת עֶ֨בֶד הַ/מֶּ֤לֶךְ יוֹאָב֙ וְ/אֶת עַבְדֶּ֔/ךָ וְ/לֹ֥א יָדַ֖עְתִּי מָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: te
  text: రాజు, “యువకుడైన అబ్షాలోము క్షేమంగా ఉన్నాడా?” అని అడిగాడు. అహీమయజు, “యోవాబు రాజు సేవకుణ్ణి, మీ సేవకుణ్ణి పంపినప్పుడు గొప్ప కలకలం[a] కనిపించింది; అయితే అది ఏమిటో నాకు తెలియదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెద్ద గుంపు,” లేదా “గొప్ప కోలాహలం.” హీబ్రూ పదం గుంపును, శబ్దాన్ని లేదా కల్లోలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: క్షేమంగా ఉన్నాడా
  rationale: ఈ ప్రశ్నలో שָׁלוֹם అనేది కేవలం యుద్ధం లేకపోవడాన్ని కాకుండా అబ్షాలోము క్షేమాన్ని, బాగోగులను గురించి అడుగుతోంది. ‘క్షేమంగా ఉన్నాడా’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని తెలియజేస్తుంది; అతడు తప్పక సురక్షితంగా ఉన్నాడనే నిర్దిష్ట భావాన్ని చేర్చదు.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: యువకుడైన అబ్షాలోము
  rationale: נַעַר ఇక్కడ ‘యువకుడు’ అనే అర్థంలో ఉంది. దావీదు తన కుమారుని పేరు నేరుగా ప్రశ్నలో ఉంచుతూనే అతణ్ణి ‘యువకుడు’ అని సంబోధించిన హీబ్రూ భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: רָאִיתִי
  choice: కనిపించింది
  rationale: తెలుగులో ‘గొప్ప కలకలం కనిపించింది’ అని చెప్పడం, అహీమయస్సు దానిని చూశాడనే רָאִיתִי భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: గొప్ప కలకలం
  rationale: הָמוֹן అనే పదం గుంపు, సందడి, కోలాహలం లేదా అల్లకల్లోలాన్ని సూచించగలదు. సందర్భంలో కనిపించిన కదలికతో కూడిన గందరగోళాన్ని ‘గొప్ప కలకలం’ సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: לִשְׁלֹחַ
  choice: పంపినప్పుడు
  rationale: ל తో కూడిన infinitive construct ఇక్కడ కాలసంబంధాన్ని సూచిస్తుంది. ‘పంపినప్పుడు’ తెలుగులో సహజమైన కాలవాచక ఉపవాక్యం.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: రాజు సేవకుణ్ణి
  rationale: עֶבֶד సందర్భానుసారం దాసుడు లేదా సేవకుడు కావచ్చు. ఇక్కడ రాజుకు లోబడిన అధికారిక దూతను సూచిస్తున్నందున ‘సేవకుడు’ సరైన సందర్భార్థం.
- source_word: וְאֶת עַבְדֶּךָ
  choice: మీ సేవకుణ్ణి
  rationale: అహీమయస్సు తనను తాను రాజు ఎదుట వినయంగా ‘మీ సేవకుడు’ అని పేర్కొన్న ఆస్థాన మర్యాదను యథాతథంగా నిలుపుతుంది.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: అయితే అది ఏమిటో నాకు తెలియదు
  rationale: హీబ్రూలో వాక్యం ‘ఏమిటో తెలియదు’ అని సంక్షిప్తంగా ఉంది. సహజమైన తెలుగు కోసం ‘అది’ చేర్చడం అంతర్లీన సూచనను మాత్రమే స్పష్టం చేస్తుంది.
