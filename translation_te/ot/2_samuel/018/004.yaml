source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/מֶּ֔לֶךְ אֲשֶׁר יִיטַ֥ב בְּ/עֵינֵי/כֶ֖ם אֶעֱשֶׂ֑ה וַ/יַּעֲמֹ֤ד הַ/מֶּ֨לֶךְ֙ אֶל יַ֣ד הַ/שַּׁ֔עַר וְ/כָל הָ/עָם֙ יָֽצְא֔וּ לְ/מֵא֖וֹת וְ/לַ/אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: te
  text: రాజు వారితో, “మీ దృష్టికి ఏది మంచిదో అదే చేస్తాను” అన్నాడు.[a] అప్పుడు రాజు ద్వారం పక్కన నిలబడ్డాడు.[b] ప్రజలందరూ వందలుగా, వేలుగా బయలుదేరారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “మీ కళ్లలో ఏది మంచిదో, అది చేస్తాను.” అంటే, వారు ఏది ఉత్తమమని భావిస్తారో అదే.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “ద్వారం వద్ద.” హీబ్రూలో అక్షరార్థంగా “ద్వారం చేతివద్ద”; ఇది ద్వారం పక్కనున్న స్థానాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: అంటే, వందమంది, వెయ్యిమంది చొప్పున ఏర్పాటుచేసిన సైనిక విభాగాలుగా.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: మీ దృష్టికి ఏది మంచిదో
  rationale: ‘మీ కళ్లలో ఏది మంచిదో’ అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచుతూ, వారు మంచిదని నిర్ణయించినదనే భావాన్ని తెలియజేస్తుంది.
- source_word: אֶעֱשֶׂה
  choice: అదే చేస్తాను
  rationale: עשה క్రియకు నేరుగా సరిపోయే భవిష్యత్ అర్థాన్ని ఇస్తుంది; వారి సలహాను రాజు అంగీకరించిన సందర్భంలో ‘అదే’ సహజంగా పూర్వపదాన్ని సూచిస్తుంది.
- source_word: אֶל יַד הַשַּׁעַר
  choice: ద్వారం పక్కన
  rationale: అక్షరార్థంగా ‘ద్వారం చేతివద్ద’ అనే హీబ్రూ నుడికారానికి సమీపస్థానాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: సందర్భం సైనికమైనదైనా, మూలంలోని ‘ప్రజలు’ అనే విస్తృత పదాన్ని నిలుపుతుంది.
- source_word: יָצְאוּ
  choice: బయలుదేరారు
  rationale: יצא అనే సాధారణ ‘వెళ్లిపోవడం/బయటకు వెళ్లడం’ భావాన్ని సహజంగా తెలుపుతుంది; ‘కవాతుగా వెళ్లారు’ వంటి అదనపు సైనిక భావాన్ని చేర్చదు.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: వందలుగా, వేలుగా
  rationale: హీబ్రూ సంఖ్యా నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, ప్రజలు సైనిక విభాగాలుగా ఏర్పడి బయలుదేరిన భావాన్ని సందర్భంతో తెలియజేస్తుంది.
