translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రజలందరూ’ అని మూలపదాన్ని నిలుపుతూ, సైనిక సందర్భాన్ని పాదటిప్పణిలో స్పష్టం చేశాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత వాక్యాల వెంట ఉంచబడ్డాయి.
