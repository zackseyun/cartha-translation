  text: וְ/אֵ֗לֶּה שְׁמ֛וֹת הַ/יִּלֹּדִ֥ים ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב וְ/נָתָ֖ן וּ/שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: te
  text: 'యెరూషలేములో అతనికి పుట్టినవారి పేర్లు ఇవి: షమ్మూవా, షోబాబు, నాతాను, సొలొమోను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: పేర్లు ఇవి
  rationale: జాబితాను పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో అందిస్తుంది; ఆరంభంలోని וְ ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: הַיִּלֹּדִים לוֹ
  choice: అతనికి పుట్టినవారి
  rationale: ילד ధాతువు నుంచి వచ్చిన నిష్క్రియార్థక కృదంతం అక్షరార్థంగా ‘పుట్టినవారు’ అని సూచిస్తుంది. ‘కుమారులు’ అని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత రూపాన్ని నిలుపుతుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: జన్మస్థలాన్ని తెలిపే స్థానార్థక పదబంధానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: שַׁמּוּעַ
  choice: షమ్మూయ
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: שׁוֹבָב
  choice: షోబాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనివ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: נָתָן
  choice: నాతాను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన, హీబ్రూ పేరుకు సమీపమైన రూపం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన బైబిలు నామరూపాన్ని ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘పుట్టినవారి’ అనే రూపం మూలంలోని కృదంతపు అనిర్దిష్టతను నిలుపుతుంది; సందర్భం పురుష సంతానాన్ని సూచించినా ‘కుమారులు’ అని మూలానికి మించి పేర్కొనలేదు.
