- source_word: יִבְחָר
  choice: యిభారు
  rationale: వంశావళి జాబితాలోని వ్యక్తి పేరు కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אֱלִישׁוּעַ
  choice: ఎలీషూవ
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం; చివరి ע ధ్వనికి తెలుగులో ఖచ్చితమైన సమానం లేకపోవడంతో సహజమైన రూపం వాడబడింది.
- source_word: נֶפֶג
  choice: నెఫెగు
  rationale: వ్యక్తి పేరును నేరుగా లిప్యంతరీకరించి, తెలుగులో సహజంగా పలకడానికి చివర ఉకారం చేర్చబడింది.
- source_word: יָפִיעַ
  choice: యాఫీయ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; చివరి ע ధ్వనికి ఖచ్చితమైన తెలుగు సమానం లేదు.
- source_word: וְ
  choice: మరియు (జాబితా విరామచిహ్నాల ద్వారా సూచితం)
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు సంధాయకం పునరావృతమవుతుంది. సహజమైన ఆధునిక తెలుగు పేర్ల జాబితాలో దానిని కామాలతో సూచించాం; మూలంలోని పునరావృతాన్ని పాదసూచికలో తెలిపాం.
