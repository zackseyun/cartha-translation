  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹ֣ת לָ/הֶם֩ הַ/מֶּ֨לֶךְ דָּוִ֥ד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֧וּ אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: te
  text: ఇశ్రాయేలు పెద్దలందరూ హెబ్రోనులో ఉన్న రాజు దగ్గరకు వచ్చారు. రాజైన దావీదు హెబ్రోనులో యెహోవా సన్నిధిలో వారితో నిబంధన చేశాడు[a]. అప్పుడు వారు దావీదును ఇశ్రాయేలుమీద రాజుగా అభిషేకించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా ‘నిబంధనను కోశాడు’; దీని అర్థం ‘నిబంధన చేశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא అనే క్రియ యొక్క కథన రూపం ఇక్కడ గమ్యస్థానానికి రావడాన్ని సహజంగా సూచిస్తుంది.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలందరూ
  rationale: זקנים అనే పదంలోని సామూహిక నాయకత్వ భావాన్ని, כָּל లోని సంపూర్ణతను స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: హెబ్రోనులో ఉన్న రాజు దగ్గరకు
  rationale: חֶבְרוֹנָה లోని దిశాసూచక రూపం హెబ్రోనువైపు ప్రయాణాన్ని సూచిస్తుంది; తెలుగులో రాజు అక్కడ ఉన్నాడనే సంబంధాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: నిబంధన చేశాడు
  rationale: అక్షరార్థంగా ‘నిబంధనను కోశాడు’ అనే హీబ్రూ నుడికారాన్ని, దాని గంభీరమైన ఒడంబడిక భావాన్ని కాపాడుతూ సహజ తెలుగులో అందిస్తుంది.
- source_word: לָהֶם
  choice: వారితో
  rationale: כרת ברית నిర్మాణంలో పరస్పర సంబంధాన్ని తెలుగులో ‘వారితో నిబంధన చేశాడు’ అని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: దైవసాక్షిగా జరిగిన గంభీరమైన నిబంధన సందర్భాన్ని సహజంగా తెలియజేస్తూ, ‘యెహోవా ఎదుట’ అనే ప్రత్యామ్నాయ భావాన్నీ కలిగి ఉంటుంది.
- source_word: וַיִּמְשְׁחוּ
  choice: అభిషేకించారు
  rationale: రాజ నియామక సందర్భంలో משׁח సూచించే ఆచారపూర్వక అభిషేకాన్ని ఖచ్చితంగా నిలుపుతుంది.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు రాజుగా
  rationale: ఇశ్రాయేలుపై రాజాధికారానికి నియమించబడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: హీబ్రూ విశేష్య-వివరణ సంబంధాన్ని తెలుగులో సహజమైన బిరుదు-పేరు క్రమంతో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- issue: בְּרִית లోని ఒడంబడిక భావం
  choice: నిబంధన
  alternative: ఒప్పందం
  rationale: రాజకీయంగానూ దైవసాక్షిగా జరిగిన గంభీర బంధంగానూ ఉన్న మూలపదపు బరువును ‘ఒప్పందం’ కంటే ‘నిబంధన’ మెరుగ్గా కాపాడుతుంది.
- issue: לִפְנֵי יְהוָה యొక్క భావవ్యాప్తి
  choice: యెహోవా సన్నిధిలో
  alternative: యెహోవా ఎదుట
  rationale: దేవుని సాక్షాత్ సన్నిధి లేదా ఆయన ఎదుట జరిగిన కార్యం అనే మూలంలోని భావాన్ని సిద్ధాంతపరంగా మరీ విప్పకుండా సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస వావ్-కథన నిర్మాణాన్ని తెలుగులో చిన్న వాక్యాలుగా విభజించి, చివరి చర్యకు ‘అప్పుడు’ జోడించడం ద్వారా సంఘటనల క్రమం స్పష్టంగా ఉంచబడింది.
