source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: te
  text: దావీదు అంతకంతకూ గొప్పవాడవుతూ పోయాడు[a]; సైన్యాల దేవుడైన యాహ్వే అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు మరింత మరింత గొప్పవాడయ్యాడు.” హెబ్రీయ భావప్రయోగం కొనసాగుతూ పెరుగుతున్న గొప్పతనాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: అంతకంతకు గొప్పవాడవుతూ పోయాడు
  rationale: పరిమిత క్రియతో పాటు క్రియావిశేషక ధాతురూపం వచ్చిన ఈ హెబ్రీయ భావప్రయోగం నిరంతర పురోగతిని, పెరుగుతున్న గొప్పతనాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కొనసాగింపు మరియు తీవ్రత రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన వ్యక్తినామ రూపంగా అందించబడింది.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: సైన్యాల దేవుడు
  rationale: צְבָאוֹת అనే పదం సైన్యాలు లేదా సమూహాలను సూచిస్తుంది. మూలంలోని విస్తృత దైవబిరుదును అనవసరంగా భూసైన్యాలు లేదా పరలోక సైన్యాలు అని పరిమితం చేయకుండా ఈ రూపం నిలుపుతుంది.
- source_word: עִמּוֹ
  choice: అతనికి తోడుగా ఉన్నాడు
  rationale: దావీదుతో దేవుని సన్నిధి, సహవాసం మరియు అనుకూల సహాయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామమే ప్రత్యక్షంగా ఉంది; కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు. ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: צְבָאוֹת అనే దైవబిరుదు పరిధి
  choice: సైన్యాలు
  alternative: పరలోక సైన్యాలు
  rationale: హెబ్రీ పదం సూచించే సమూహాలను మూలం ఇక్కడ ప్రత్యేకంగా పరలోక సైన్యాలకే పరిమితం చేయదు. అందువల్ల ఆ ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని కొనసాగుతున్న వృద్ధిని ‘అంతకంతకు ... అవుతూ పోయాడు’ ద్వారా స్పష్టంగా నిలిపాం; దైవనామాన్ని బిరుదుగా మార్చలేదు.
