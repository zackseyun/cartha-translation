id: 2SA.5.24
reference: 2 Samuel 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: te
  text: బాల్సమ్ చెట్ల పైభాగాల్లో అడుగుల శబ్దం నీకు వినబడినప్పుడు[a], అప్పుడు నిర్ణయాత్మకంగా చర్య తీసుకో; ఎందుకంటే అప్పుడు యాహ్వే ఫిలిష్తీయుల శిబిరంపై దాడి చేయడానికి నీకు ముందుగా బయలుదేరి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బెకాయీమ్ చెట్లు.’ ఈ చెట్టు జాతి ఖచ్చితంగా ఏదో తెలియదు. దీనిని ‘బాల్సమ్ చెట్లు’ అని అనువదించవచ్చు; ‘బెకాయీమ్ చెట్లు’ అని లిప్యంతరీకరించవచ్చు; పాత అనువాదాల్లో ‘మల్బరీ చెట్లు’ అని కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: నీకు వినబడినప్పుడు
  rationale: היה తో కూడిన కాలసూచక infinitive construct భావాన్ని ఆధునిక తెలుగులో సహజమైన షరతు-కాల నిర్మాణంగా వ్యక్తం చేస్తుంది.
- source_word: קוֹל צְעָדָה
  choice: అడుగుల చప్పుడు
  rationale: צְעָדָה అడుగులు వేయడం లేదా కవాతుగా సాగడాన్ని సూచిస్తుంది. మూలంలోని దృశ్య అస్పష్టతను నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘అడుగుల చప్పుడు’ ఎంచుకోబడింది.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: చెట్ల పైకొమ్మల్లో
  rationale: רָאשֵׁי అంటే శిఖరాలు లేదా పైభాగాలు. בְּכָאִים అనే చెట్టు జాతి ఖచ్చితంగా తెలియనందున ప్రధాన పాఠ్యంలో సాధారణ పదాన్ని వాడి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: אָז תֶּחֱרָץ
  choice: వెంటనే దృఢంగా కార్యానికి పూనుకో
  rationale: חרץ ఇక్కడ వేగంతో పాటు నిర్ణయాత్మకమైన, చురుకైన చర్యను సూచిస్తుంది; ఈ అనువాదం ఆ రెండు భావాలను సహజంగా తెలియజేస్తుంది.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: యెహోవా ... నీకు ముందుగా బయలుదేరి వెళ్లాడు
  rationale: Perfect క్రియ, సూచన వినబడే సమయానికి యెహోవా చర్య ప్రారంభమైందని తెలియజేస్తుంది; לְפָנֶיךָ ఆయన దావీదుకు ముందుగా యుద్ధానికి వెళ్లడాన్ని సూచిస్తుంది.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరాన్ని హతమార్చడానికి
  rationale: נכה యుద్ధ సందర్భంలో హతమార్చడం లేదా దెబ్బకొట్టడాన్ని, מַחֲנֶה సైనిక శిబిరాన్ని సూచిస్తాయి; మూలంలోని బలమైన సైనిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ హీబ్రూ ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన కథనశైలి. దైవనామాన్ని పేరుగా నిలిపి, తెలియని వృక్షజాతి విషయంలో మూలభాషలోని అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
