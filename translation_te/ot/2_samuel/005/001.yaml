source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు గోత్రాలన్నీ హెబ్రోనుకు[a] దావీదు దగ్గరకు వచ్చి, “ఇదిగో, మేము నీ ఎముక, నీ మాంసం[b]” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హెబ్రోనులో’; హీబ్రూ స్థలనామ రూపంలో దిశను సూచించే ప్రత్యయం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇది దగ్గరి రక్తసంబంధాన్ని లేదా ఉమ్మడి కుటుంబ గుర్తింపును తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వచ్చి’ בוא అనే క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నీ
  rationale: ఈ రూపం గోత్రాల సమష్టిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל דָּוִד
  choice: దావీదు దగ్గరికి
  rationale: אֶל ఇక్కడ ఒక వ్యక్తివైపు కదలికను సూచిస్తుంది. ‘దగ్గరికి’ గమ్యమైన వ్యక్తిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חֶבְרֹנָה
  choice: హెబ్రోనులో
  rationale: స్థలనామానికి ఉన్న దిశాసూచక ప్రత్యయం ‘హెబ్రోనుకు’ అనే భావాన్ని ఇవ్వగలదు. అయితే వాక్యంలో దావీదు దగ్గరికి రావడం ఇప్పటికే కదలికను వ్యక్తం చేస్తున్నందున, హెబ్రోనును ఆ కలయిక జరిగిన ప్రదేశంగా ‘హెబ్రోనులో’ అని ఇవ్వడం సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: అని అన్నారు
  rationale: హీబ్రూలో సాధారణమైన ఈ మాటల పరిచయ సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా అనువదిస్తుంది.
- source_word: הִנּוּ
  choice: ఇదిగో
  rationale: ఈ అవ్యయం తరువాతి ప్రకటనపై దృష్టి పెట్టిస్తుంది. ‘ఇదిగో’ దాని సూచనాత్మక, ఉద్ఘాటనాత్మక బలాన్ని ఆధునికమైనప్పటికీ గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: నీ ఎముక, నీ మాంసం
  rationale: మూలంలోని పదక్రమాన్నీ, బంధుత్వం మరియు ఐక్యతను తెలిపే రూపకాన్నీ నిలుపుతుంది. దాని సాంస్కృతిక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: אֲנָחְנוּ
  choice: మేము
  rationale: హీబ్రూ నామవాచక విధేయ వాక్యంలో క్రియ లేకపోయినా, తెలుగులో ‘మేము నీ ఎముక, నీ మాంసం’ అనే నిర్మాణం సందర్భానుసారంగా సంపూర్ణమైన ప్రకటనగా సహజంగా పనిచేస్తుంది.
theological_decisions:
- issue: బంధుత్వ సూత్రం మరియు దాని రాజకీయ-దైవశాస్త్ర బలం
  choice: ‘మేము నీ ఎముక, నీ మాంసం’ అని రూపకాన్ని ప్రత్యక్షంగా నిలుపడం
  alternative: ‘మేము నీ సొంత ప్రజలం’ లేదా ‘మేము నీ బంధువులం’ అని భావానువాదం చేయడం
  rationale: ఇశ్రాయేలు గోత్రాలు దావీదుతో తమ ఉమ్మడి బంధుత్వాన్ని ప్రస్తావించి, అతని రాజ్యాధికారానికి జాతీయ ఐక్యత ఆధారమని సూచిస్తున్నాయి. ప్రత్యక్ష రూపకం కుటుంబ సంబంధాన్నీ రాజకీయ బలాన్నీ నిలుపుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలి సహజంగా, గౌరవప్రదంగా ఉంది. బంధుత్వ రూపకాన్ని సరళీకరించకుండా మూలంలోని క్రమంతో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్ద ప్రధాన పాఠ్యంలో ఉంచబడింది.
