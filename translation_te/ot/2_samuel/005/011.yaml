reference: 2 Samuel 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: te
  text: తూరు రాజు హీరాము దావీదు దగ్గరికి దూతలను, దేవదారు కలపను, చెక్క పనివారిని, రాతి గోడల పనివారిని[a] పంపాడు; వారు దావీదు కోసం ఒక ఇల్లు[b] కట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాతి మేస్త్రీలను.’ హీబ్రూ పదబంధంలో అక్షరార్థంగా ‘రాయి,’ ‘గోడ’ అనే రెండు పదాలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దావీదు కోసం ఒక రాజభవనం.’ హీబ్రూలో అక్షరార్థంగా ‘ఒక ఇల్లు’ అని ఉంది; రాజసందర్భంలో అది రాజభవనాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שׁלח అనే క్రియకు సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: తూరు రాజు హీరాము
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చి, వ్యక్తి పేరును మరియు స్థల పేరును ప్రామాణికంగా లిప్యంతరీకరించింది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ పదం సాధారణ సందేశవాహకులను లేదా రాజదౌత్య ప్రతినిధులను సూచించగలదు. ‘దూతలు’ ఆ విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: וַעֲצֵי אֲרָזִים
  choice: దేవదారు దుంగలను
  rationale: అక్షరార్థంగా ‘దేవదారు చెట్లు/కలప’ అనే హీబ్రూ నుడికారం నిర్మాణానికి పంపిన దేవదారు మ్రానును సూచిస్తుంది; ‘దుంగలు’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: חָרָשֵׁי עֵץ
  choice: చెక్క పనివారిని
  rationale: చెక్కతో పనిచేసే నిపుణులనే విస్తృత భావాన్ని ఇస్తుంది; ‘వడ్రంగులు’ అనే మరింత సంకుచిత వృత్తిపేరుకు పరిమితం చేయదు.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: రాతి గోడల పనివారిని
  rationale: క్లిష్టమైన ఈ పదబంధంలో ఉన్న ‘రాయి’ మరియు ‘గోడ’ అనే రెండు అంశాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיִּבְנוּ
  choice: వారు ... కట్టారు
  rationale: బహువచన కర్తను తెలుగులో స్పష్టంగా చూపిస్తూ కథన క్రియను సహజంగా అనువదించింది.
- source_word: בַיִת
  choice: ఒక ఇల్లు
  rationale: పదం యొక్క ప్రాథమిక అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; రాజసందర్భంలో సాధ్యమైన ‘రాజభవనం’ అనే భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: לְדָוִד
  choice: దావీదు కోసం
  rationale: దావీదుకు ప్రయోజనార్థంగా కట్టబడిందనే దాత్యర్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: בַיִת అనే పదం రాజసందర్భంలో ‘ఇల్లు’ లేదా ‘రాజభవనం’ అని అర్థమవగల అస్పష్టత
  choice: ప్రధాన పాఠ్యంలో ‘ఇల్లు’
  alternative: ‘దావీదు కోసం ఒక రాజభవనం’
  rationale: హీబ్రూ ప్రత్యేకంగా రాజభవనాన్ని సూచించే పదాన్ని వాడలేదు. అందువల్ల ప్రాథమిక అర్థాన్ని పాఠ్యంలో ఉంచి, సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస వస్తువులను ఒకే వాక్యంలో ఉంచి, పఠనసౌలభ్యానికి అర్ధవిరామం వాడబడింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
