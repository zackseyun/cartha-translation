id: 2SA.5.25
reference: 2 Samuel 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: te
  text: దావీదు అలాగే చేశాడు. యహ్వే అతనికి ఆజ్ఞాపించినట్టే, అతడు ఫిలిష్తీయులను గెబా[a] నుండి గెజెరు సమీపం వరకు[b] ఓడించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరా హెబ్రీ పాఠంలో ‘గెబా’ అని ఉంది. పాఠాంతరాన్ని లేదా సమాంతర వచనాన్ని పరిగణనలోకి తీసుకోవడం వల్ల కొన్ని అనువాదాల్లో వేరే స్థలనామం కనిపిస్తుంది.
    reason: textual_variant
  - marker: b
    text: అక్షరార్థంగా, ‘నీవు గెజెరుకు వచ్చేవరకు’; అంటే గెజెరు చేరువ లేదా పరిసర ప్రాంతం వరకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: అలాగే చేశాడు
  rationale: ముందు ఇచ్చిన ఆజ్ఞను దావీదు అమలు చేశాడనే సంక్షిప్త హెబ్రీ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: అతనికి ఆజ్ఞాపించినట్టే
  rationale: దేవుని ఆజ్ఞకూ దావీదు చేసిన కార్యానికీ ఉన్న ఖచ్చితమైన అనుగుణ్యతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיַּךְ
  choice: ఓడించాడు
  rationale: సైనిక సందర్భంలో נכה శత్రువును దెబ్బతీయడం లేదా ఓడించడం అనే భావాన్ని ఇస్తుంది. ప్రతి వ్యక్తినీ చంపాడని అవసరానికి మించి నిర్దిష్టం చేయకుండా యుద్ధ విజయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ జనసమూహానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: מִגֶּבַע
  choice: గెబా నుండి
  rationale: మసొరా పాఠంలోని גבע అనే స్థలనామాన్ని నేరుగా అనుసరిస్తుంది; సమాంతర వచనంతో సమన్వయపరచి ‘గిబియోను’గా మార్చదు.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: గెజెరు సమీపం వరకు
  rationale: అక్షరార్థంగా ‘నీవు గెజెరుకు వచ్చేవరకు’ అనే దిశాసూచక ప్రయోగం గెజెరు చేరువ లేదా ప్రవేశ ప్రాంతాన్ని సూచిస్తుంది; తెలుగులో భౌగోళిక పరిధిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతూ, మూల హెబ్రీ నామానికి దగ్గరైన లిప్యంతరీకరణను ఉపయోగించింది.
translation_notes:
  register: సహజమైన, ఆధునిక, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని సంక్షిప్తతను కాపాడుతూ, స్థలనామ పాఠాంతరాన్ని మరియు చివరి దిశాసూచక ప్రయోగంలోని అక్షరార్థాన్ని పాదటిప్పణుల్లో స్పష్టం చేసింది.
