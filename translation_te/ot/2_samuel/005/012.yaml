revisions:
- from: యెహోవా తనను ఇశ్రాయేలుమీద రాజుగా స్థిరపరిచాడనీ, తన ప్రజలైన ఇశ్రాయేలు నిమిత్తం తన రాజ్యాన్ని ఉన్నతపరిచాడనీ దావీదు తెలుసుకున్నాడు.[a]
  to: యెహోవా దావీదును ఇశ్రాయేలుపై రాజుగా స్థిరపరిచాడనీ, తన ప్రజలైన ఇశ్రాయేలు నిమిత్తం దావీదు రాజ్యాన్ని ఉన్నతపరిచాడనీ దావీదు తెలుసుకున్నాడు.[a]
  rationale: యెహోవా దావీదును స్థిరపరిచాడనే మొదటి చర్యను, దావీదు రాజ్యాన్ని ఉన్నతపరిచాడనే రెండవ చర్యను పేర్లతో స్పష్టం చేశాం. దీనివల్ల ప్రధాన పాఠ్యంలో עַמּוֹ ను యెహోవాకు అన్వయించిన అత్యంత సంభావ్య పఠనం స్పష్టమవుతుంది; అదే సమయంలో దావీదుకు అన్వయించే వ్యాకరణ అవకాశం పాదటిప్పణిలో యథాతథంగా నిలుస్తుంది.
