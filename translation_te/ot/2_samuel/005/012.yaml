source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: te
  text: యెహోవా దావీదును ఇశ్రాయేలుపై రాజుగా స్థిరపరిచాడనీ, తన ప్రజలైన ఇశ్రాయేలు నిమిత్తం దావీదు రాజ్యాన్ని ఉన్నతపరిచాడనీ దావీదు తెలుసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘తన ప్రజలైన ఇశ్రాయేలు’లోని ‘తన’ దావీదును సూచిస్తుంది: ‘దావీదు ప్రజలైన ఇశ్రాయేలు నిమిత్తం.’'
    reason: עַמּוֹ లోని ఏకవచన పురుష ప్రత్యయం యెహోవాను లేదా దావీదును సూచించగల వ్యాకరణ సందిగ్ధతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: తెలుసుకున్నాడు
  rationale: ידע అనే క్రియ తెలుసుకోవడం లేదా గ్రహించడం అనే భావాన్ని ఇస్తుంది. కథన సందర్భంలో ‘తెలుసుకున్నాడు’ సహజంగా ఉండి, ‘గ్రహించాడు’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా ఉంది.
- source_word: הֱכִינוֹ
  choice: తనను … స్థిరపరిచాడని
  rationale: כון హిఫిల్ రూపం స్థాపించడం, దృఢపరచడం అనే భావాలను కలిగి ఉంది. రాజరిక సందర్భంలో ‘స్థిరపరిచాడు’ అనేది దావీదు రాజత్వాన్ని యెహోవా దృఢపరిచిన భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: לְמֶלֶךְ పాత్రను లేదా పదవిని సూచిస్తుంది; עַל పాలనాధికారాన్ని సూచిస్తుంది. అందువల్ల ‘ఇశ్రాయేలుమీద రాజుగా’ సహజమైన, మూలానికి దగ్గరైన అనువాదం.
- source_word: נִשֵּׂא
  choice: ఉన్నతపరిచాడని
  rationale: נשׂא రూపం పైకెత్తడం లేదా ఘనపరచడం అనే భావాన్ని ఇస్తుంది. రాజ్య సందర్భంలో ‘ఉన్నతపరిచాడు’ భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: מַמְלַכְתּוֹ
  choice: తన రాజ్యాన్ని
  rationale: ממלכה రాజ్యం, రాజాధికారం లేదా పరిపాలనను సూచించగలదు. ‘రాజ్యం’ మూలంలోని విస్తృతిని నిలుపుతుంది; ‘పాలన’ కంటే తక్కువ సంకుచితమైనది.
- source_word: בַּעֲבוּר
  choice: నిమిత్తం
  rationale: ఈ పదబంధం ప్రయోజనం లేదా మేలు కోసం చేసిన కార్యాన్ని సూచిస్తుంది. ఆధునిక గౌరవప్రద తెలుగులో ‘నిమిత్తం’ దీనిని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: తన ప్రజలైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలు ఎవరి ప్రజలో తెలిపే ప్రత్యయం మూలంలో సందిగ్ధంగా ఉన్నప్పటికీ, సమీప కర్త యెహోవా కావడం వల్ల ప్రధాన పాఠ్యంలో దాన్ని యెహోవాకు అన్వయించాం. ‘ప్రజలైన ఇశ్రాయేలు’ సమానాధికార నిర్మాణాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: עַמּוֹ (‘అతని/తన ప్రజలు’) లోని ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: యెహోవాను సూచించేలా ‘తన ప్రజలైన ఇశ్రాయేలు’
  alternative: దావీదును సూచిస్తే ‘దావీదు ప్రజలైన ఇశ్రాయేలు’
  rationale: యెహోవానే దావీదును స్థిరపరిచి అతని రాజ్యాన్ని ఉన్నతపరిచిన కర్తగా సందర్భంలో ప్రధానంగా ఉన్నాడు; ఇశ్రాయేలు యెహోవా ప్రజలు అనే ప్రయోగం కూడా సాధారణం. అయినా హెబ్రీ ప్రత్యయం వ్యాకరణపరంగా దావీదును సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు కాబట్టి పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రెండు כִּי ఉపవాక్యాలను ‘…అనీ, …అనీ’ నిర్మాణంతో నిలిపాం. దైవనామాన్ని ‘యెహోవా’గా ఇచ్చాం; ప్రత్యయ సందిగ్ధతను ప్రధాన పాఠ్యంలో అత్యంత సంభావ్య పఠనంతో, పాదటిప్పణిలో ప్రత్యామ్నాయంతో పరిరక్షించాం.
