lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ו కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది. פְלִשְׁתִּים అనే జాతినామానికి ప్రామాణిక తెలుగు రూపం ‘ఫిలిష్తీయులు’.
- source_word: בָּאוּ
  choice: వచ్చి
  rationale: בוא క్రియ యొక్క ఖాల్ సంపూర్ణ రూపం ఇక్కడ ‘వచ్చారు’ అనే అర్థం ఇస్తుంది; తరువాతి క్రియతో సహజంగా కలపడానికి ‘వచ్చి’ అని అనువదించబడింది.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: విస్తరించి నిలిచారు
  rationale: נטשׁ ఇక్కడ ఒక ప్రాంతమంతటా సైనికులు విస్తరించి మోహరించడాన్ని సూచిస్తుంది. ‘విస్తరించి నిలిచారు’ మూలంలోని దృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తూ, కేవలం చెదరిపోయారనే భావాన్ని నివారిస్తుంది.
- source_word: בְּ/עֵמֶק
  choice: లోయలో
  rationale: ב స్థానార్థకంగా ఉంది; עֵמֶק అంటే ‘లోయ’. తెలుగు పదక్రమంలో ప్రదేశనామం తరువాత ‘లోయలో’ సహజంగా వస్తుంది.
- source_word: רְפָאִים
  choice: రెఫాయీము
  rationale: ఇది עֵמֶק רְפָאִים అనే ప్రదేశనామంలో భాగం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర కథనశైలి ఉపయోగించబడింది. సైనిక భావాన్ని అతిగా సాంకేతికం చేయకుండా ప్రధాన పాఠంలో ‘విస్తరించి నిలిచారు’ అని, ప్రత్యామ్నాయంగా ‘మోహరించారు’ అని పాదటిప్పణిలో ఇచ్చాం.
