- from: ఫిలిష్తీయులు మళ్లీ పైకి వచ్చి రెఫాయీము లోయలో విస్తరించి మోహరించారు.[a]
  to: ఫిలిష్తీయులు మళ్లీ పైకి వచ్చి రెఫాయీము లోయంతటా విస్తరించారు.[a]
  rationale: The revision keeps the repeated upward advance and the conventional names intact. It renders the uncertain final verb with the broad, contextually apt ‘విస్తరించారు’ and moves the more specific military-deployment interpretation to the footnote, preserving the source ambiguity and the English audit trail’s lexical caution.
