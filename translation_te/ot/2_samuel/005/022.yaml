  yaml_path: translation/ot/2_samuel/005/022.yaml
  text: And the Philistines came up again and spread out in the Valley of Rephaim[a].
translation:
  language: te
  text: ఫిలిష్తీయులు మళ్లీ పైకి వచ్చి రెఫాయీము లోయంతటా విస్తరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమను మోహరించుకున్నారు.’ హీబ్రూ క్రియకు ‘దాడి చేయడానికి విస్తరించారు’ లేదా ‘చెదరిపోయారు’ అనే భావాలు కూడా ఉండవచ్చు. ఈ సందర్భంలో ఫిలిష్తీయులు లోయ అంతటా తమ సైనిక స్థావరాలను విస్తరించారని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: మళ్లీ పైకి వచ్చి
  rationale: יסף తో עוֹד, తరువాతి לעלות కలసి గతంలో చేసిన సైనిక కదలికను మరల చేయడాన్ని సూచిస్తున్నాయి. ‘మళ్లీ పైకి వచ్చి’ అనే రూపం పునరావృతినీ, עלה యొక్క ఎత్తువైపు కదలికనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజావర్గానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיִּנָּטְשׁוּ
  choice: విస్తరించి మోహరించారు
  rationale: ఈ సైనిక సందర్భంలో క్రియ కేవలం చెదరిపోవడాన్ని కాక, లోయ అంతటా విస్తరించి స్థానాలు చేపట్టడాన్ని సూచించే అవకాశం ఉంది. ఈ సంయుక్త పదబంధం ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: בְּעֵמֶק רְפָאִים
  choice: రెఫాయీము లోయలో
  rationale: עמק ను ‘లోయ’గా అనువదించి, רפאים అనే స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘విస్తరించి మోహరించారు’ సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది; హీబ్రూ క్రియలోని నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
