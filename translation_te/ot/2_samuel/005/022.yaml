  text: וַ/יֹּסִ֥פוּ ע֛וֹד פְּלִשְׁתִּ֖ים לַֽ/עֲל֑וֹת וַ/יִּנָּֽטְשׁ֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
