translation:
  language: te
  text: దావీదు రాజైనప్పుడు అతనికి ముప్పై సంవత్సరాల వయసు; అతడు నలభై సంవత్సరాలు రాజ్యపాలన చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: అతనికి ముప్పై సంవత్సరాలు
  rationale: ‘ముప్పై సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వయస్సును తెలిపే విధంగా అనువదించాం.
- source_word: דָּוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన מלך క్రియానామ రూపం దావీదు రాజ్యాధికారంలోకి వచ్చిన సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ ఈ కాలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: దావీదు పరిపాలన కాలవ్యవధిని నేరుగా తెలియజేసే సంఖ్యా పదబంధం.
- source_word: מָלָךְ
  choice: పరిపాలించాడు
  rationale: מלך ఇక్కడ రాజుగా అధికారాన్ని నిర్వహించడాన్ని సూచిస్తుంది; ‘పరిపాలించాడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
