  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: te
  text: వారు తమ విగ్రహాలను[a] అక్కడే విడిచిపెట్టారు; దావీదు, అతని మనుషులు వాటిని తీసుకెళ్లారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ ప్రతిమలను.’ హెబ్రీ పదం ఆరాధనా ప్రతిమలను సూచిస్తుంది; ‘విగ్రహాలు’ అనే పదం సందర్భంలోని భావాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 1 దినవృత్తాంతాలు 14:12 ప్రకారం, దావీదు ఆజ్ఞతో ఆ విగ్రహాలు కాల్చివేయబడ్డాయి. అయితే ఇక్కడ సమూయేలు గ్రంథంలోని హెబ్రీ పాఠం దావీదు, అతని మనుషులు వాటిని తీసుకెళ్లారని మాత్రమే చెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టారు
  rationale: עזב అనే క్రియకు ‘వదిలివేయు/విడిచిపెట్టు’ అనే సాధారణ అర్థం ఉంది. వెనుదిరిగిన ఫిలిష్తీయులు వస్తువులను అక్కడే వదిలిన ఈ సందర్భంలో ‘విడిచిపెట్టారు’ సహజంగా ఉంది.
- source_word: שָׁם
  choice: అక్కడే
  rationale: స్థలాన్ని సూచించే సరళమైన అవ్యయం. తెలుగు కథన ప్రవాహంలో ‘అక్కడే’ వారు విగ్రహాలను వెనుక విడిచిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲצַבֵּיהֶם
  choice: తమ విగ్రహాలను
  rationale: ఈ నామవాచకం చెక్కిన ప్రతిమలను, ముఖ్యంగా ఆరాధనా ప్రతిమలను సూచిస్తుంది. ఈ మతపరమైన సందర్భంలో ‘విగ్రహాలు’ సాధారణ పాఠకులకు ఉద్దేశిత భావాన్ని స్పష్టంగా అందిస్తుంది; ‘తమ’ కర్తతో సంబంధాన్ని సహజ తెలుగులో చూపిస్తుంది.
- source_word: וַיִּשָּׂאֵם
  choice: వాటిని తీసుకెళ్లారు
  rationale: נשא అనే క్రియ ‘ఎత్తు, మోయు, తీసుకెళ్లు’ అనే విస్తృత అర్థాలను కలిగి ఉంది. ఇక్కడ ‘తీసుకెళ్లారు’ భౌతిక చర్యను సహజంగా వ్యక్తం చేస్తూ, వాటిని ఎందుకు తీసుకెళ్లారో అదనంగా ఊహించదు.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: దావీదు, అతని మనుషులు
  rationale: అక్షరార్థంగా ‘దావీదు మరియు అతని మనుషులు.’ సందర్భంలో యోధులు ఉద్దేశించబడినా, ‘మనుషులు’ మూలపాఠానికి దగ్గరగా ఉండి ‘సైనికులు’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: విగ్రహాలను కాల్చివేశారని చెప్పే 1 దినవృత్తాంతాలు 14:12 సమాంతర వృత్తాంతంతో సంబంధం
  choice: 2 సమూయేలు మసొరెటిక్ పాఠం ప్రకారం ‘వాటిని తీసుకెళ్లారు’ అని అనువదించడం
  alternative: దినవృత్తాంతాల వివరాన్ని సమన్వయపరచి, ఇక్కడే వాటిని కాల్చివేశారనే భావాన్ని అనువాదంలో చేర్చడం
  rationale: సమూయేలు హెబ్రీ పాఠం దావీదు, అతని మనుషులు వాటిని తీసుకెళ్లారని మాత్రమే చెబుతుంది. దావీదు ఆజ్ఞ ప్రకారం అవి కాల్చివేయబడ్డాయని దినవృత్తాంతాలు అదనంగా చెబుతుంది. ఆ వివరాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయకుండా, పాఠాల మధ్య ఉన్న భేదాన్ని పాదసూచికలో పారదర్శకంగా ఉంచడం మూలభాషా ప్రాధాన్యాన్ని, నిజమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘వాటిని తీసుకెళ్లారు’ అనే సహజ ప్రయోగం נשא యొక్క విస్తృత భావాన్ని కాపాడుతూ దహనం అనే సమాంతర వృత్తాంత వివరాన్ని ప్రధాన పాఠంలో కలపదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
