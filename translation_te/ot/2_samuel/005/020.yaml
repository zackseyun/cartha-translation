id: 2SA.5.20
reference: 2 Samuel 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֥ד בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִד֒ וַ/יֹּ֕אמֶר פָּרַ֨ץ יְהוָ֧ה אֶת אֹיְבַ֛/י לְ/פָנַ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: te
  text: దావీదు బయల్‌-పెరాజీముకు[a] వచ్చి, అక్కడ వారిని కొట్టి పడగొట్టాడు. అప్పుడు దావీదు, “నీటి ప్రవాహం కట్టను తెంచుకొని ఉప్పొంగినట్లు[b] యాహ్వే నా ఎదుట నా శత్రువులపై విరుచుకుపడ్డాడు” అన్నాడు. అందువల్ల అతడు ఆ స్థలానికి బయల్‌-పెరాజీము అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయల్‌-పెరాజీము” అనే పేరుకు “చీల్చివేతల యజమాని” లేదా “చీల్చివేతలు జరిగిన స్థలం” అనే భావం ఉంది. యాహ్వే తన శత్రువులపై “విరుచుకుపడ్డాడు” అన్న దావీదు మాటతో ఈ పేరుకు పదప్రయోగ సంబంధం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీటి ప్రవాహం కట్టను బద్దలుకొట్టినట్లు.” హిబ్రూ పదబంధం యాహ్వే శత్రువులపై విరుచుకుపడడాన్ని, “బయల్‌-పెరాజీము” అనే స్థలనామాన్ని కలిపే పదప్రయోగాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: బయల్‌-పెరాజీము
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం. పేరులోని פְּרָצִיםకు, దావీదు చెప్పిన פָּרַץ/פֶּרֶץ పదాలకు మధ్య ఉన్న శబ్దార్థ సంబంధాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: וַיַּכֵּם
  choice: వారిని హతమార్చాడు
  rationale: נכה అనే క్రియకు యుద్ధ సందర్భంలో ‘కొట్టి పడగొట్టు/హతమార్చు’ అనే బలమైన అర్థం ఉంది. ‘ఓడించాడు’ కంటే మూలంలోని యుద్ధ తీవ్రతను ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: פָּרַץ
  choice: ఛేదించాడు
  rationale: ఈ క్రియలో అడ్డంకిని బద్దలుకొట్టి చొచ్చుకుపోవడం అనే భావం ఉంది. నీళ్ల ఉపమానంతోనూ స్థలనామంతోనూ ఉన్న పదప్రయోగ సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֹיְבַי
  choice: నా శత్రువులను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన నామానికి నేరమైన, సహజమైన అనువాదం.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: యుద్ధ సందర్భంలో హెబ్రీ పూర్వప్రత్యయ పదబంధాన్ని సహజంగా, దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: כְּפֶרֶץ מָיִם
  choice: నీళ్లు చీల్చుకొని దూసుకొచ్చినట్లు
  rationale: నీరు అడ్డంకిని బద్దలుకొట్టి ఉప్పొంగి రావడం అనే చిత్రాన్ని సహజమైన తెలుగులో అందిస్తూ, פֶּרֶץ మరియు פָּרַץ మధ్య ఉన్న పదసంబంధాన్ని ‘చీల్చుకొని/ఛేదించాడు’ ద్వారా కొంతవరకు నిలుపుతుంది.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: హెబ్రీ నామకరణ ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: పాఠ్యంలో బిరుదు కాకుండా దేవుని వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అని ప్రత్యామ్నాయపరచకుండా, హిబ్రూ ఉచ్చారణకు సమీపమైన ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. స్థలనామాన్ని ధ్వన్యంతరీకరించి, మూలంలోని నీటి-ఛేదన పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో ‘చీల్చుకొని/ఛేదించాడు’ ద్వారా మరియు పాదటిప్పణుల్లో వివరణ ద్వారా నిలిపాం.
