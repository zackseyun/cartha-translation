  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: te
  text: అయితే దావీదు సీయోను కోటను[a] స్వాధీనం చేసుకున్నాడు; అదే దావీదు నగరం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సీయోను దుర్గాన్ని.’ హీబ్రూ పదం బలపరచబడిన రక్షిత స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకున్నాడు
  rationale: לכד అనే క్రియ యుద్ధ సందర్భంలో ఒక స్థలాన్ని పట్టుకోవడం లేదా వశపరచుకోవడం సూచిస్తుంది. ‘స్వాధీనం చేసుకున్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి సైనిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַ
  choice: అయితే
  rationale: ఇక్కడ వావ్ వరుస కథనాన్ని కొనసాగించడంతో పాటు ముందటి వచనంలోని యెబూసీయుల ధీమాకు విరుద్ధమైన ఫలితాన్ని సూచిస్తుంది. అందువల్ల ‘అయితే’ ఆ స్వల్ప వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: מְצֻדַת
  choice: కోటను
  rationale: מְצוּדָה బలపరచబడిన రక్షిత స్థలాన్ని సూచిస్తుంది. ‘కోట’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదం; నిర్మాణ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా సైనిక భావాన్ని అందిస్తుంది.
- source_word: צִיּוֹן
  choice: సీయోను
  rationale: స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపమైన ‘సీయోను’గా లిప్యంతరీకరించాం.
- source_word: הִיא
  choice: అదే
  rationale: ఈ స్వతంత్ర సర్వనామం ముందు పేర్కొన్న సీయోను కోటను తరువాతి ‘దావీదు నగరం’తో సమానార్థకంగా గుర్తిస్తుంది. ‘అదే’ ఈ వివరణాత్మక సమానీకరణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִיר דָּוִד
  choice: దావీదు నగరం
  rationale: హీబ్రూ సమాసంలోని సంబంధాన్ని నిలుపుతూ, స్థలనామసదృశమైన ఈ పదబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
