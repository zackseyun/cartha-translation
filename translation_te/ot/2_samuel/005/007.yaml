  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని స్వల్ప వ్యతిరేక భావాన్ని ‘అయితే’తో, స్థల గుర్తింపును ‘అదే’తో వ్యక్తం చేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
