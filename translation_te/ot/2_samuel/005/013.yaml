source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: te
  text: దావీదు హెబ్రోను నుండి వచ్చిన తర్వాత యెరూషలేము నుండి మరిన్ని ఉపపత్నులను, భార్యలను తీసుకున్నాడు[a]. దావీదుకు ఇంకా కుమారులు, కుమార్తెలు పుట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేములో.” హీబ్రూలో అక్షరార్థంగా “యెరూషలేము నుండి” అని ఉంది; అయితే దావీదు యెరూషలేముకు వచ్చి నివసించడం మొదలుపెట్టిన తర్వాత అక్కడ మరిన్ని స్త్రీలను స్వీకరించాడనే అర్థం కూడా కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: ఈ సందర్భంలో לקח స్త్రీలను భార్యలుగా లేదా ఉపపత్నులుగా స్వీకరించడాన్ని సూచిస్తుంది. మూలంలోని సూటితనాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే రూపం.
- source_word: עוֹד
  choice: మరికొందరు / ఇంకా
  rationale: రెండు చోట్లా ఇది అదనాన్ని సూచిస్తుంది. వ్యక్తుల విషయంలో ‘మరికొందరు’, జననాల విషయంలో ‘ఇంకా’ సహజమైన తెలుగు ప్రయోగాలు.
- source_word: פִּלַגְשִׁים
  choice: ఉపపత్నులను
  rationale: భార్యల నుండి వేరుగా పేర్కొన్న సామాజిక-కుటుంబ వర్గాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְנָשִׁים
  choice: భార్యలను
  rationale: ‘ఉపపత్నులు’తో సమన్వయంగా వచ్చినందున ఇక్కడ נָשִׁים సాధారణంగా ‘స్త్రీలు’ కంటే వివాహ భాగస్వాములను సూచిస్తుంది.
- source_word: מִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: హీబ్రూలో מן సాధారణంగా ‘నుండి’ అయినప్పటికీ, ఇక్కడ స్థలార్థకంగా—దావీదు యెరూషలేముకు చేరిన తరువాత అక్కడ వారిని స్వీకరించాడనే భావంలో—అర్థం చేసుకోవడం సందర్భానికి సహజం. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: హెబ్రోను నుండి వచ్చిన తర్వాత
  rationale: దావీదు హెబ్రోను నుండి వచ్చిన తరువాత జరిగిన చర్యగా కాలక్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּוָּלְדוּ
  choice: పుట్టారు
  rationale: ילד నిఫాల్ రూపానికి సహజమైన తెలుగు అనువాదం; లְדָוִד‌తో కలిపి ‘దావీదుకు ... పుట్టారు’ అనే జనన సూత్రం ఏర్పడుతుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులు, కుమార్తెలు
  rationale: మూలంలో రెండు లింగాలనూ విడిగా పేర్కొన్న ప్రత్యేకతను ‘పిల్లలు’ అని సాధారణీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: దావీదు బహుభార్యత్వం గురించిన కథన వర్ణన
  choice: ఈ వచనం చెప్పిన చర్యను నైతిక వ్యాఖ్య లేకుండా వర్ణనాత్మకంగా అనువదించడం.
  alternative: ఆమోదం లేదా ఖండనను సూచించే మూలంలో లేని విలువ నిర్ణయాన్ని చేర్చడం.
  rationale: ఈ వచనం దావీదు చర్యను, తదనంతర జననాలను మాత్రమే నివేదిస్తుంది; స్పష్టమైన నైతిక తీర్పు ఇవ్వదు. కాబట్టి అనువాదం అదనపు సిద్ధాంతపరమైన తీర్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఉపపత్నులు’ మరియు ‘భార్యలు’ అనే మూలంలోని భేదాన్ని నిలిపి, స్థల సూచనలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
