source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי מָשְׁח֨וּ אֶת דָּוִ֤ד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑ד וַ/יִּשְׁמַ֣ע דָּוִ֔ד וַ/יֵּ֖רֶד אֶל הַ/מְּצוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: te
  text: ఫిలిష్తీయులు దావీదును ఇశ్రాయేలు మీద రాజుగా అభిషేకించారని విన్నప్పుడు, వారందరూ దావీదును వెదకడానికి పైకి వచ్చారు. దావీదు అది విని, దుర్గానికి[a] దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోటకు.” హెబ్రీ పదం కట్టుదిట్టమైన రక్షణ స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజావర్గం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: כִּי
  choice: అని
  rationale: ఫిలిష్తీయులు విన్న విషయాన్ని పరిచయం చేస్తుంది; ఇక్కడ కారణార్థం కంటే విషయార్థమే సందర్భానికి సరిపోతుంది.
- source_word: מָשְׁחוּ
  choice: అభిషేకించారని
  rationale: మూలంలోని ‘అభిషేకించు’ అనే భావాన్ని నిలుపుతూ, వినడానికి ముందే జరిగిన కార్యాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీద రాజుగా
  rationale: రాజుగా నియామకాన్నీ, ఇశ్రాయేలుపై ఆయన పరిపాలనా అధికారాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּעֲלוּ כָל־פְלִשְׁתִּים
  choice: వారందరూ ... పైకి వచ్చారు
  rationale: כָל యొక్క సమగ్రతను ‘అందరూ’తో, עלה యొక్క భౌగోళిక పైకి కదలికను ‘పైకి వచ్చారు’తో నిలిపాం.
- source_word: לְבַקֵּשׁ אֶת־דָּוִד
  choice: దావీదును వెదకడానికి
  rationale: בקש యొక్క విస్తృతమైన ‘వెదుకు’ భావాన్ని నిలుపుతుంది; పట్టుకోవడం లేదా చంపడం అనే ఉద్దేశాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: దావీదు అది విని
  rationale: మూలంలో కర్మ స్పష్టంగా లేకపోయినా, మునుపటి సమాచారాన్ని సూచించే ‘అది’ తెలుగులో సహజమైన అనుసంధానం.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: ירד యొక్క ‘కిందికి వెళ్లు’ అనే దిశార్థాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: הַמְּצוּדָה
  choice: దుర్గం
  rationale: కట్టుదిట్టమైన రక్షణ స్థలాన్ని సూచించే పదంగా ‘దుర్గం’ సంక్షిప్తంగానూ గౌరవప్రదంగానూ సరిపోతుంది; సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
