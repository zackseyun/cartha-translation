translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ‘పైకి వచ్చారు,’ ‘దిగివెళ్లాడు’ అనే భౌగోళిక దిశలను నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తు ‘ఇశ్రాయేలు’ తర్వాత కనిపించినప్పటికీ, దాని విషయం הַמְּצוּדָה గురించి కావడంతో తెలుగులో ‘దుర్గానికి’ తర్వాత సరిచేసి ఉంచాం.
