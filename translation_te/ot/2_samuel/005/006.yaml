    rationale: ‘యెరూషలేముకు వెళ్లాడు; అక్కడ నివసిస్తున్న యెబూసీయుల దగ్గరికి’ అనే నిర్మాణం మూలంలోని గమ్యస్థానాన్ని, యెబూసీయులతో ఎదురుపడే సందర్భాన్ని మరింత సహజంగా తెలియజేస్తుంది.
  revised_text: 'రాజు తన మనుషులతో కలిసి యెరూషలేముకు వెళ్లాడు; అక్కడ నివసిస్తున్న యెబూసీయుల దగ్గరికి వెళ్లాడు. యెబూసీయులు దావీదుతో ఇలా అన్నారు[a]: “నువ్వు ఇక్కడికి ప్రవేశించలేవు; గుడ్డివాళ్లూ కుంటివాళ్లే నిన్ను వెనక్కి తరిమేస్తారు[b].” అంటే, “దావీదు ఇక్కడికి ప్రవేశించలేడు.”'
  revised_footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “అతడు దావీదుతో అన్నాడు” అని ఏకవచనంలో ఉంది. ఇక్కడ ఆ ఏకవచనం యెబూసీయులను సమూహంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: వ్యాకరణపరమైన ఏకవచనం మరియు సందర్భపరమైన సమూహార్థం మధ్య తేడాను తెలియజేయడం.
  - marker: b
    text: ఈ హీబ్రూ వాక్యభాగం అర్థం చేసుకోవడం కష్టం. అక్షరార్థానికి దగ్గరగా, “గుడ్డివాళ్లను, కుంటివాళ్లను నువ్వు తొలగిస్తే తప్ప” అని కూడా అనువదించవచ్చు. తమ పట్టణం ఎంత సురక్షితమైనదంటే గుడ్డివాళ్లూ కుంటివాళ్లే దావీదును అడ్డుకోగలరని యెబూసీయులు ఎగతాళి చేసినట్లు సందర్భం సూచిస్తుంది.
    reason: కష్టమైన హీబ్రూ నిర్మాణం, దాని అక్షరార్థ ప్రత్యామ్నాయం, సందర్భసమ్మతమైన ఎగతాళి భావం—మూడింటినీ పారదర్శకంగా చూపడం.
  revision_rationale: కనిష్ఠ సవరణతో వాక్యప్రవాహాన్ని మెరుగుపరిచాం మరియు ప్రధాన పాఠం నుండి నకిలీగా చేర్చిన పాదసూచిక పాఠాన్ని తొలగించాం. యెబూసీయుల ఎగతాళి భావాన్ని, హీబ్రూ నిర్మాణంలోని అస్పష్టతను, మరియు పునరుక్తిని నిలిపి ఉంచాం.
