source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ וַֽ/אֲנָשָׁי/ו֙ יְר֣וּשָׁלִַ֔ם אֶל הַ/יְבֻסִ֖י יוֹשֵׁ֣ב הָ/אָ֑רֶץ וַ/יֹּ֨אמֶר לְ/דָוִ֤ד לֵ/אמֹר֙ לֹא תָב֣וֹא הֵ֔נָּה כִּ֣י אִם הֱסִֽירְ/ךָ֗ הַ/עִוְרִ֤ים וְ/הַ/פִּסְחִים֙ לֵ/אמֹ֔ר לֹֽא יָב֥וֹא דָוִ֖ד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: te
  text: 'రాజు తన మనుషులతో కలిసి యెరూషలేముకు వెళ్లాడు; అక్కడ నివసిస్తున్న యెబూసీయుల దగ్గరికి వెళ్లాడు. యెబూసీయులు దావీదుతో ఇలా అన్నారు[a]: “నువ్వు ఇక్కడికి ప్రవేశించలేవు; గుడ్డివాళ్లూ కుంటివాళ్లే నిన్ను వెనక్కి తరిమేస్తారు[b].” అంటే, “దావీదు ఇక్కడికి ప్రవేశించలేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “అతడు దావీదుతో అన్నాడు” అని ఏకవచనంలో ఉంది. ఇక్కడ ఆ ఏకవచనం యెబూసీయులను సమూహంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: వ్యాకరణపరమైన ఏకవచనం మరియు సందర్భపరమైన సమూహార్థం మధ్య తేడాను తెలియజేయడం.
  - marker: b
    text: ఈ హీబ్రూ వాక్యభాగం అర్థం చేసుకోవడం కష్టం. అక్షరార్థానికి దగ్గరగా, “గుడ్డివాళ్లను, కుంటివాళ్లను నువ్వు తొలగిస్తే తప్ప” అని కూడా అనువదించవచ్చు. తమ పట్టణం ఎంత సురక్షితమైనదంటే గుడ్డివాళ్లూ కుంటివాళ్లే దావీదును అడ్డుకోగలరని యెబూసీయులు ఎగతాళి చేసినట్లు సందర్భం సూచిస్తుంది.
    reason: కష్టమైన హీబ్రూ నిర్మాణం, దాని అక్షరార్థ ప్రత్యామ్నాయం, సందర్భసమ్మతమైన ఎగతాళి భావం—మూడింటినీ పారదర్శకంగా చూపడం.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లాడు
  rationale: కథనాన్ని ముందుకు నడిపించే సాధారణ భూతకాల క్రియ; ‘దండెత్తి వెళ్లాడు’ అని అనువదిస్తే మూలక్రియలో స్పష్టంగా లేని సైనిక భావాన్ని అదనంగా చేర్చినట్లవుతుంది.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: రాజు తన మనుషులతో కలిసి
  rationale: ‘అతని మనుషులు’ అనే విస్తృత భావాన్ని నిలుపుతుంది; సందర్భంలో వారు యోధులు కావచ్చుగానీ, మూలపాఠం అంతగా పరిమితం చేయదు.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: ఆ దేశంలో నివసిస్తున్న యెబూసీయుల దగ్గరికి
  rationale: హీబ్రూలోని ఏకవచన జాతివాచక రూపాన్ని సహజమైన తెలుగు సమూహవాచక బహువచనంగా అందిస్తుంది; אֶל యొక్క ప్రాథమిక ‘వద్దకు/దగ్గరికి’ భావాన్ని కాపాడుతుంది.
- source_word: וַיֹּאמֶר
  choice: యెబూసీయులు ... అన్నారు
  rationale: వ్యాకరణ రూపం ఏకవచనమైనా సందర్భంలో జాతి సమూహమే వక్త. ప్రధాన పాఠంలో సహజమైన బహువచనం వాడి, ఏకవచనాన్ని పాదసూచికలో తెలిపాం.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: నువ్వు ఇక్కడికి ప్రవేశించలేవు
  rationale: కోటగల పట్టణంలోకి రానివ్వమనే ఎగతాళి సందర్భాన్ని ‘ప్రవేశించు’ సహజంగా తెలియజేస్తుంది; అసమర్థత/ధిక్కార భావం కలిగిన వాక్యబలాన్ని నిలుపుతుంది.
- source_word: הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: గుడ్డివాళ్లూ కుంటివాళ్లే నిన్ను వెనక్కి తరిమేస్తారు
  rationale: కష్టమైన హీబ్రూ నిర్మాణానికి సందర్భసమ్మతమైన ఎగతాళి భావాన్ని ప్రధాన పాఠంలో అందిస్తుంది. ప్రత్యామ్నాయమైన ‘వారిని తొలగిస్తే తప్ప’ అనే పఠనాన్ని పాదసూచికలో కాపాడింది.
- source_word: לֵאמֹר לֹא יָבֹא דָוִד הֵנָּה
  choice: అంటే, “దావీదు ఇక్కడికి ప్రవేశించలేడు” అని వారు అన్నారు
  rationale: లֵאמֹר ద్వారా వచ్చే పునరుక్తిని తొలగించకుండా, ముందున్న ఎగతాళి మాటల సారాంశంగా తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: వైకల్యాన్ని సూచించే పదాలు ఎగతాళిలో రావడం
  choice: ‘గుడ్డివాళ్లు, కుంటివాళ్లు’ అనే నిర్దిష్ట పదాలను నిలుపడం
  alternative: ‘మాలో అత్యంత బలహీనులే’ అని సాధారణీకరించడం
  rationale: ఇది యెబూసీయుల ధిక్కారపు మాటలను నివేదిస్తుంది; వాటిని మృదువుగా మార్చడం మూలపాఠంలోని స్పష్టమైన చిత్రణను, తదుపరి వచనాలతో ఉన్న సంబంధాన్ని దాచుతుంది. ఈ మాటలు కథకుని నైతిక తీర్పుగా కాక వక్తల ఎగతాళిగా ఉండేలా సందర్భాన్ని నిలిపాం.
- issue: కష్టమైన షరతు వాక్యభాగం యొక్క భావం
  choice: యెబూసీయుల ఉద్దేశాన్ని ‘గుడ్డివాళ్లూ కుంటివాళ్లే నిన్ను వెనక్కి తరిమేస్తారు’గా ప్రధాన పాఠంలో ఇవ్వడం
  alternative: ‘గుడ్డివాళ్లను, కుంటివాళ్లను నువ్వు తొలగిస్తే తప్ప’
  rationale: హీబ్రూ వాక్యనిర్మాణం అస్పష్టంగా ఉంది. పట్టణ భద్రతపై చేసిన ఎగతాళిని సందర్భం బలపరుస్తుంది; అయినా అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి నిజమైన అనిశ్చితిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ప్రవేశించలేవు’ కోటపట్టణ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘వెనక్కి తరిమేస్తారు’ ఎగతాళి బలాన్ని సాధారణ పాఠకుడికి సులభంగా అందిస్తుంది. వైకల్య పదాలను మూలపాఠానికి నిబద్ధంగా ఉంచినా, అవి యెబూసీయుల మాటలని వాక్య నిర్మాణం స్పష్టం చేస్తుంది.
