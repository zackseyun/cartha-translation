  source_fidelity: ప్రధాన భావం మూల హీబ్రూకు నమ్మకంగానే ఉంది. కష్టమైన ‘గుడ్డివాళ్లు, కుంటివాళ్లు’ వాక్యభాగాన్ని యెబూసీయుల ఎగతాళిగా ఇవ్వడం సందర్భానికి తగినది; అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం అవసరమైన అస్పష్టతను కాపాడుతుంది.
  naturalness: ‘యెరూషలేముకు, ఆ దేశంలో నివసిస్తున్న యెబూసీయుల దగ్గరికి’ అనే వరుస కొద్దిగా భారంగా ఉంది. అలాగే ప్రధాన అనువాద పాఠంలో పాదసూచికల పాఠాన్ని మళ్లీ చేర్చకూడదు; అవి విడిగా footnotes సమితిలోనే ఉండాలి. పునరుక్తి అయిన לֵאמֹר ను తెలుగులో ‘అంటే’తో సహజంగా ఉంచవచ్చు.
  terminology: యెరూషలేము, యెబూసీయులు, దావీదు సరైన పేర్లు. ‘గుడ్డివాళ్లు, కుంటివాళ్లు’ మూలంలోని ఎగతాళి పదజాలాన్ని అనవసరంగా మృదువుచేయకుండా ప్రతిబింబిస్తుంది. ‘ప్రవేశించలేవు’ కోటపట్టణ సందర్భానికి అనుకూలం.
