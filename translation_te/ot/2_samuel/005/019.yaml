id: 2SA.5.19
reference: 2 Samuel 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ אֶל פְּלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל דָּוִד֙ עֲלֵ֔ה כִּֽי נָתֹ֥ן אֶתֵּ֛ן אֶת הַ/פְּלִשְׁתִּ֖ים בְּ/יָדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: te
  text: దావీదు యాహ్వేను అడిగి, “నేను ఫిలిష్తీయుల మీదికి వెళ్లాలా? నీవు వారిని నా చేతికి అప్పగిస్తావా?[a]” అన్నాడు. యాహ్వే దావీదుతో, “వెళ్లు; నేను తప్పకుండా ఫిలిష్తీయులను నీ చేతికి అప్పగిస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని నా చేతిలో ఇస్తావా?” హీబ్రూలో ‘చేతికి/చేతిలో ఇవ్వడం’ అనేది శత్రువుపై విజయం కలిగించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: యెహోవాను అడిగి
  rationale: ఈ సందర్భంలో శׁאל దేవుని మార్గదర్శనం కోరడాన్ని సూచిస్తుంది. ఆచార పద్ధతిని అనవసరంగా నిర్దిష్టం చేయకుండా, సహజమైన తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ పాఠంలోని దేవుని ప్రత్యేక నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: הַאֶעֱלֶה אֶל־פְּלִשְׁתִּים
  choice: నేను ఫిలిష్తీయుల మీదికి వెళ్లాలా?
  rationale: עלה యొక్క ‘వెళ్లు/పైకి వెళ్లు’ భావాన్ని నిలుపుతూ, సైనిక సందర్భంలోని విరోధ దిశను ‘మీదికి’ సహజంగా తెలియజేస్తుంది.
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: నీవు వారిని నా చేతికి అప్పగిస్తావా?
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ విజయసూచక నుడికారాన్ని తెలుగులో సహజమైన ‘చేతికి అప్పగించడం’తో అందిస్తుంది.
- source_word: עֲלֵה
  choice: వెళ్లు
  rationale: ప్రశ్నలోని עלה క్రియను సమాధానంలోనూ పునరావృతం చేస్తుంది; మూలంలో లేని ‘దాడి చేయి’ వంటి నిర్దిష్టతను చేర్చదు.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: నేను తప్పకుండా ... అప్పగిస్తాను
  rationale: క్రియానామ ధాతురూపం మరియు పరిమిత క్రియ కలయికలోని బలమైన నిశ్చయార్థాన్ని ‘తప్పకుండా’ తెలియజేస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి
  rationale: దావీదు ప్రశ్నలోని నుడికారంతో సమాంతరతను, దేవుడు విజయాన్ని అనుగ్రహించే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్ష నామంగా ఉంచి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: విజయాన్ని సూచించే ‘చేతికి ఇవ్వడం’ నుడికారం
  choice: చేతికి అప్పగించడం
  alternative: వారిపై విజయం ఇవ్వడం
  rationale: దైవ సహాయంతో లభించే విజయార్థం స్పష్టంగా ఉండేలా చేస్తూనే, మూలంలోని ‘చేతి’ రూపకాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ప్రశ్న-సమాధాన సమాంతరతను, עלה మరియు נתן/יד నుడికారాల పునరావృతాన్ని సాధ్యమైనంతవరకు నిలిపింది.
