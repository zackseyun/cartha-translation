id: 2SA.5.23
reference: 2 Samuel 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל דָּוִד֙ בַּֽ/יהוָ֔ה וַ/יֹּ֖אמֶר לֹ֣א תַעֲלֶ֑ה הָסֵב֙ אֶל אַ֣חֲרֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל בְּכָאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: te
  text: 'దావీదు యాహ్వేను అడిగి మార్గదర్శకత్వం కోరాడు. ఆయన ఇలా చెప్పాడు: “నీవు పైకి వెళ్లవద్దు. వారి వెనుకకు చుట్టి వెళ్లి, బాకా చెట్లకు[a] ఎదురుగా వారిమీదికి రా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాల్సమ్ చెట్లు”; సంప్రదాయంగా “మల్బెరీ చెట్లు.” హీబ్రూ పదం సూచించే చెట్టు జాతి ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: యెహోవాను అడిగి తెలుసుకున్నాడు
  rationale: ఇక్కడ שׁאל + ביהוה సాధారణ ప్రశ్నను కాక, యుద్ధ నిర్ణయం విషయంలో దేవుని మార్గదర్శకత్వం కోరడాన్ని సూచిస్తుంది. ‘అడిగి తెలుసుకున్నాడు’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: לֹא תַעֲלֶה
  choice: నీవు నేరుగా పైకి వెళ్లవద్దు
  rationale: עלה యొక్క ‘పైకి వెళ్లు/దండెత్తి వెళ్లు’ భావాన్ని నిలుపుతూ, తరువాత చెప్పిన చుట్టుమార్గానికి వ్యతిరేకంగా ఉన్న ప్రత్యక్ష ముందడుగు అని సందర్భం తెలియజేయడానికి ‘నేరుగా’ చేర్చాం.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: వారి వెనుకవైపుకు చుట్టి వెళ్లు
  rationale: సైనిక వ్యూహంలో శత్రువుల వెనుకకు చుట్టుమార్గంలో వెళ్లాలనే ఆజ్ఞను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּבָאתָ לָהֶם
  choice: వారిమీదికి రా
  rationale: בוא + ל కు ఈ యుద్ధ సందర్భంలో ఉన్న ప్రతికూలంగా సమీపించే భావాన్ని అతిగా వివరణ చేయకుండా అందిస్తుంది.
- source_word: מִמּוּל
  choice: ఎదురుగా
  rationale: ఒక ప్రదేశానికి అభిముఖంగా లేదా దానికి ఎదురుగా ఉండే స్థానిక సంబంధాన్ని సూటిగా నిలుపుతుంది.
- source_word: בְּכָאִים
  choice: బాకా చెట్లు
  rationale: చెట్టు జాతి నిర్ధారణ కాలేదు. ఊహాత్మకంగా ఒక నిర్దిష్ట జాతిని ప్రధాన పాఠంలో స్థిరపరచకుండా, హీబ్రూ పదాన్ని లిప్యంతరీకరించి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: దైవవాక్యంలో לֹא תַעֲלֶה యొక్క బలం
  choice: నీవు ... వెళ్లవద్దు
  alternative: నీవు పైకి వెళ్లవు
  rationale: సందర్భంలో ఇది దావీదుకు ఇచ్చిన వ్యూహాత్మక నిషేధ ఆజ్ఞ. తెలుగు నిషేధార్థక ఆజ్ఞారూపం ఆ బలాన్ని స్పష్టంగా చూపుతుంది; భవిష్యద్వాక్యంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని వాడాం. సైనిక కదలిక స్పష్టంగా ఉండేలా సహజ పదబంధాలను ఎంచుకున్నాం; నిర్ధారణ లేని వృక్షజాతిని ప్రధాన పాఠంలో సిద్ధాంతీకరించలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
