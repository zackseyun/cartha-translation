  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: te
  text: దావీదు ఆ కోటలో నివసించి, దానికి దావీదు నగరం అని పేరు పెట్టాడు. దావీదు మిల్లో నుండి లోపలివైపుకు చుట్టూ కట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిల్లో నుండి లోపలికి,” లేదా “మిల్లో నుండి అంతర్భాగం వైపుకు” అని అనువదించవచ్చు. “మిల్లో” యెరూషలేములో తెలిసిన ఒక నిర్మాణాన్ని లేదా మట్టితో నింపి ఏర్పరచిన మెట్లవంటి ఆధార కట్టడాన్ని సూచించి ఉండవచ్చు.
    reason: מִן הַמִּלּוֹא וָבָיְתָה అనే పదబంధంలోని దిశాసంబంధ నిర్మాణం, అలాగే מִלּוֹא యొక్క ఖచ్చితమైన సూచన అనిశ్చితంగా ఉన్నందున ప్రత్యామ్నాయాలను నమోదు చేశాం.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించి
  rationale: ישב ఇక్కడ స్వాధీనం చేసుకున్న కోటలో నివాసం ఏర్పరచుకోవడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించాడు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בַּמְּצֻדָה
  choice: ఆ కోటలో
  rationale: מְצֻדָה రక్షణగల కోట లేదా దుర్గాన్ని సూచిస్తుంది. ముందరి సందర్భంలో తెలిసిన స్థలాన్ని సూచిస్తున్నందున నిర్దిష్టతను ‘ఆ’ ద్వారా తెలిపాం.
- source_word: וַיִּקְרָא לָהּ
  choice: దానికి ... అని పేరు పెట్టాడు
  rationale: קרא + ל అనే నిర్మాణం పేరు పెట్టడం లేదా ఒక పేరుతో పిలవడాన్ని సూచిస్తుంది; తెలుగులో ‘పేరు పెట్టాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עִיר דָּוִד
  choice: దావీదు నగరం
  rationale: ఇది స్థలనామంగా వాడబడింది; తెలుగు బైబిలు శైలిలోనూ సాధారణ పాఠకులకు కూడా ‘దావీదు నగరం’ స్పష్టంగా ఉంటుంది.
- source_word: וַיִּבֶן
  choice: నిర్మాణాలు చేపట్టాడు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘కట్టడం’. కర్మ స్పష్టంగా చెప్పబడని ఈ వాక్యంలో ‘నిర్మాణాలు చేపట్టాడు’ సహజమైన తెలుగును ఇస్తూ, ‘బలపరిచాడు’ లేదా ‘పునర్నిర్మించాడు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: סביב పరిసర విస్తృతిని సూచిస్తుంది; ‘చుట్టూ’ దీనిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִן הַמִּלּוֹא
  choice: మిల్లో మొదలుకొని
  rationale: מִלּוֹא యొక్క ఖచ్చితమైన నిర్మాణాత్మక లేదా స్థలసంబంధ సూచన వివాదాస్పదం. అందువల్ల దాన్ని ‘మిల్లో’గా లిప్యంతరీకరించి, מן యొక్క ఆరంభబిందు భావాన్ని ‘మొదలుకొని’గా ఇచ్చాం.
- source_word: וָבָיְתָה
  choice: లోపలి వైపుకు
  rationale: దిశను సూచించే ఈ రూపం సందర్భంలో అంతర్భాగం వైపు అనే భావాన్ని ఇవ్వవచ్చు. ‘లోపలి వైపుకు’ స్థలసంబంధ భావాన్ని నిలుపుతూ, ఒక నిర్దిష్ట ‘ఇంటి’ని అనవసరంగా నిర్ణయించదు.
