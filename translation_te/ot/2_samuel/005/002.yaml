reference: 2 Samuel 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: te
  text: 'ఇంతకుముందు కూడా[a], సౌలు మాకు రాజుగా ఉన్నప్పుడు, ఇశ్రాయేలును బయటికి నడిపించి లోపలికి తీసుకొచ్చేవాడివి నీవే[b]. యాహ్వే నీతో ఇలా అన్నాడు: “నా ప్రజలైన ఇశ్రాయేలును నీవు కాపరిగా నడిపిస్తావు; ఇశ్రాయేలుపై నీవు అధిపతిగా ఉంటావు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిన్నా మొన్నా”; ఇది “ఇంతకుముందు” లేదా “కొంతకాలంగా ఇదివరకే” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలును బయటికి తీసుకెళ్లి లోపలికి తీసుకొచ్చేవాడివి నీవే” అని కూడా అనువదించవచ్చు. ఇది ప్రజల వ్యవహారాల్లో, ముఖ్యంగా యుద్ధంలో, వారికి నాయకత్వం వహించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: “నాయకుడు” లేదా “పాలకుడు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం సాధారణంగా వాడే “రాజు” అనే పదానికి భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: అంతకుముందు కూడా
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ‘నిన్న కూడా, మొన్న కూడా’ అని ఉన్నా, సందర్భంలో గతకాలంలోనే లేదా ఇదివరకే అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తూ ‘కూడా’ అనే పునరుద్ఘాటనను నిలుపుతుంది.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: సౌలు మాకు రాజుగా ఉన్నప్పుడు
  rationale: בְּ తో కూడిన infinitive construct కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది. ‘మాకు రాజుగా’ అనేది ‘మాపై రాజుగా’ కంటే సహజమైన తెలుగు.
- source_word: אַתָּה
  choice: నువ్వే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ఏకారంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מוציא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును బయటికి నడిపించి తిరిగి లోపలికి తీసుకొచ్చింది
  rationale: మూలంలోని బయటికి తీసుకెళ్లడం–లోపలికి తీసుకురావడం అనే చిత్రాన్ని నిలుపుతూ, ప్రజలను ముఖ్యంగా యుద్ధంలో నడిపించే భావాన్ని అర్థమయ్యేలా చేస్తుంది. ‘తిరిగి’ తెలుగు వాక్యప్రవాహాన్ని సహజం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించబడింది.
- source_word: תִרְעֶה
  choice: కాపరిగా మేపుతావు
  rationale: రాజు దేవుని ప్రజలను కాపరిగా నడిపించే మూల రూపకాన్ని నిలుపుతుంది; కేవలం ‘పాలిస్తావు’ అని చేసి రూపకాన్ని చదును చేయదు.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలును
  rationale: ‘నా ప్రజలు’ మరియు ‘ఇశ్రాయేలు’ ఒకే సమూహాన్ని సూచించే apposition‌ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָגִיד
  choice: అధిపతి
  rationale: ఈ పదం సాధారణ ‘రాజు’ అనే מֶלֶךְ పదానికి భిన్నమైన నియమిత నాయకుడు లేదా పాలకుడు అనే భావాన్ని కలిగి ఉంది. ‘అధిపతి’ ఆ భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ప్రత్యేక దైవనామం ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: תִרְעֶה లోని రాజసంబంధ కాపరి రూపకం
  choice: కాపరిగా మేపుతావు
  alternative: పాలిస్తావు; సంరక్షిస్తావు
  rationale: దావీదు పాలనను కాపరి పనిగా వర్ణించే దైవశాస్త్రీయ రూపకాన్ని యథాతథంగా నిలుపుతుంది; పరిపాలన అనే భావానికి మాత్రమే దాన్ని పరిమితం చేయదు.
- issue: נָגִיד మరియు מֶלֶךְ మధ్య పదభేదం
  choice: అధిపతి
  alternative: రాజు; నాయకుడు; యువరాజు
  rationale: ఈ వాక్యంలో సౌలుకు వాడిన ‘రాజు’ పదం కాక వేరొక హీబ్రూ పదం దావీదుకు వాడబడింది. ‘అధిపతి’ నియమిత పాలకుని భావాన్ని అందిస్తూ ఆ పదభేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దావీదును నేరుగా సంబోధిస్తున్నందున ‘నువ్వు’ రూపం వాడబడింది; ఇది తెలుగు బైబిలు కథన శైలిలో సహజంగా ఉండి మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది. హీబ్రూ కాపరి రూపకం మరియు బయటికి నడిపించి లోపలికి తీసుకురావడం అనే చిత్రభాషను సంరక్షించాం.
