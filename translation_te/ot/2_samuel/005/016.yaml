lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: వ్యక్తి పేరును దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. జాబితాలో తెలుగు సహజ శైలికి అనుగుణంగా ముందున్న ו (‘మరియు’)ను ప్రత్యేకంగా అనువదించలేదు.
- source_word: וְ/אֶלְיָדָע
  choice: ఎల్యాదా
  rationale: హీబ్రూ వ్యక్తి పేరును అర్థానువాదం చేయకుండా తెలుగులో సహజంగా లిప్యంతరీకరించాం; జాబితాలోని וను విరామచిహ్నంతో వ్యక్తం చేశాం.
- source_word: וֶ/אֱלִיפָלֶט
  choice: ఎలీఫెలెతు
  rationale: హీబ్రూ אֱלִיפָלֶט పేరును మూలరూపానికి దగ్గరగా లిప్యంతరీకరించాం. చివరి ו జాబితా సమన్వయాన్ని సూచిస్తున్నప్పటికీ, సంక్షిప్త తెలుగు పేర్ల జాబితాలో కామా సహజంగా అదే పనిని చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన సరళ శైలితో పేర్ల జాబితాగా అందించబడింది. పేర్ల వ్యుత్పత్తి అర్థాలను అనువదించకుండా లిప్యంతరీకరించాం. మూలంలోని సంధికారకాలను పదేపదే ‘మరియు’గా ఇవ్వకుండా తెలుగు జాబితా విరామచిహ్నాలను ఉపయోగించాం.
