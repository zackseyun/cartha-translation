revisions:
- from: హెబ్రోనులో అతడు యూదాపై ఏడు సంవత్సరాల ఆరు నెలలు పరిపాలించాడు. యెరూషలేములో ఇశ్రాయేలంతటిపైనా యూదాపైనా ముప్పై మూడు సంవత్సరాలు పరిపాలించాడు.
  to: హెబ్రోనులో అతడు యూదాపై ఏడు సంవత్సరాలు ఆరు నెలలు పరిపాలించాడు. యెరూషలేములో ఇశ్రాయేలు ప్రజలందరిపైనా, యూదా ప్రజలందరిపైనా ముప్పై మూడు సంవత్సరాలు పరిపాలించాడు.
  rationale: The revision corrects the Telugu duration construction and clarifies that ‘all’ encompasses both Israel and Judah. It retains the source’s locations, reign durations, political scope, and concise historical register; no footnotes are needed.
