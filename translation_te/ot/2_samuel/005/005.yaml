  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: te
  text: హెబ్రోనులో అతడు యూదాపై ఏడు సంవత్సరాలు ఆరు నెలలు పరిపాలించాడు. యెరూషలేములో ఇశ్రాయేలు ప్రజలందరిపైనా, యూదా ప్రజలందరిపైనా ముప్పై మూడు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో నగరంలో జరిగిన పరిపాలనను సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: ఈ సందర్భంలో క్రియ సింహాసనారోహణ క్షణాన్ని కాకుండా పాలన సాగిన కాలాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עַל יְהוּדָה
  choice: యూదాపై
  rationale: מָלַךְ తో కూడిన עַל పాలనకు లోబడిన ప్రజలను లేదా రాజ్యాన్ని సూచిస్తుంది; మూలంలోని సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ఏడు సంవత్సరాల ఆరు నెలలు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ క్రమాన్ని సహజమైన తెలుగు రూపంలో ఇస్తుంది.
- source_word: וּבִירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: సంయోజక అవ్యయం మరియు స్థలసూచక విభక్తి రెండో పాలనా కేంద్రాన్ని పరిచయం చేస్తాయి; తెలుగు వాక్య విభజన వల్ల 'అక్కడ' అనే భావసంబంధం స్పష్టంగా ఉంటుంది.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: ముప్పై మూడు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా వ్యక్తీకరణను ప్రస్తుత ప్రామాణిక తెలుగు సంఖ్యా శైలిలో అందిస్తుంది.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలంతటిపైనా యూదాపైనా
  rationale: כָּל అనే సమగ్రతను 'అంతటి'తో వ్యక్తం చేస్తూ, ఇశ్రాయేలు మరియు యూదా అనే రెండు పేర్లనూ మూలం ప్రకారం విడిగా నిలుపుతుంది.
