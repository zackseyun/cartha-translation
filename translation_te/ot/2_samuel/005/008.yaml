id: 2SA.5.8
reference: 2 Samuel 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: te
  text: 'ఆ రోజున దావీదు ఇలా అన్నాడు: “యెబూసీయులను కొట్టి, నీటి సొరంగాన్ని[a] చేరేవాడెవడైనా—దావీదు ప్రాణం ద్వేషించే కుంటివారినీ అంధులనూ...”[b] అందుకే, “అంధుడూ కుంటివాడూ ఆ ఇంట్లోకి[c] రాడు” అని అంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీటి కాలువ,’ ‘గొట్టం,’ ‘నీటి నిలువు మార్గం.’ హీబ్రూ పదం బహుశా ఏదో నీటి వ్యవస్థను సూచిస్తుంది; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యభాగపు హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. ‘కుంటివారు, అంధులు’ అనే మాటలను కొందరు ఇక్కడ దావీదు సవాలులో భాగంగా కాకుండా, ముందరి వచనంలో యెబూసీయులు చేసిన ఎగతాళిలో భాగంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: ‘రాజభవనంలోకి’ అని కూడా అర్థం కావచ్చు; ఈ సందర్భంలో ‘ఇల్లు’ అనే పదం రాజనివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: యెబూసీయులను కొట్టి ... చేరేవాడు
  rationale: כָּל తో వచ్చిన participle ఇక్కడ ఎవరైనా చేసే కార్యాన్ని సూచించే సవాలు రూపం. יְבֻסִי ఏకవచన రూపంలో ఉన్నప్పటికీ సమూహార్థక జననామం కాబట్టి తెలుగులో బహువచన భావంతో అనువదించబడింది.
- source_word: וְיִגַּע
  choice: చేరేవాడు
  rationale: נגע యొక్క ప్రాథమిక భావం ‘తాకడం/చేరడం.’ సైనిక సందర్భంలో తరువాత వచ్చే నీటి వ్యవస్థను దృష్టిలో ఉంచుకొని, హింసాత్మక భావాన్ని అదనంగా చేర్చకుండా ‘చేరేవాడు’ అని ఇచ్చాం.
- source_word: בַּצִּנּוֹר
  choice: నీటి సొరంగం
  rationale: צִנּוֹר యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; అది కాలువ, గొట్టం, సొరంగం లేదా నీటి నిలువు మార్గాన్ని సూచించవచ్చు. నగర రక్షణ వ్యవస్థ సందర్భానికి సరిపోయే సహజమైన తెలుగు పదబంధంగా ‘నీటి సొరంగం’ ఎంచుకొని, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הָעִוְרִים
  choice: కుంటివారిని, గుడ్డివారిని కూడా
  rationale: ఈ విశేషణాలు నామవాచకాలుగా వాడబడ్డ బహువచన రూపాలు. ‘కూడా’ అనే పదం את తో వచ్చిన పదబంధాన్ని ముందరి క్రియకు సాధ్యమైన కర్మగా చదవడానికి వీలు కల్పిస్తుంది; అయితే క్లిష్టమైన వాక్యనిర్మాణాన్ని పాదసూచిక స్పష్టంగా తెలియజేస్తుంది.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: దావీదు ప్రాణం ద్వేషించే
  rationale: హీబ్రూ పదప్రయోగంలోని ‘దావీదు ప్రాణం’ అనే తీవ్రతను తగ్గించకుండా నిలిపాం. మరింత సహజంగా ‘దావీదు ద్వేషించే’ అని చెప్పవచ్చుగానీ, మూలంలోని נֶפֶשׁ ను సంరక్షించాం.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: అందుకే ... అని అంటారు
  rationale: ఇది ఒక సామెత లేదా ప్రచలిత నానుడిని పరిచయం చేస్తుంది. కర్తను నిర్దిష్టం చేయకుండా హీబ్రూ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: గుడ్డివాడు, కుంటివాడు
  rationale: హీబ్రూలో ఏకవచన రూపాలు ఉన్నప్పటికీ అవి ఒక వర్గాన్ని సాధారణంగా సూచిస్తున్నాయి. తెలుగు సామెత ధోరణిని నిలబెట్టేందుకు ఏకవచన సాధారణ రూపాన్ని వాడాం.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: ఆ ఇంట్లోకి రాకూడదు
  rationale: בַּיִת సాధారణంగా ‘ఇల్లు,’ సందర్భానుసారం రాజనివాసం లేదా రాజభవనం కూడా కావచ్చు. మూలం కంటే అర్థాన్ని నిర్దిష్టం చేయకుండా ‘ఇల్లు’ ఉంచి, సందర్భసాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ‘కుంటివారు, గుడ్డివారు’ పట్ల దావీదు ద్వేషం అనే క్లిష్టమైన వాక్యం
  choice: మసొరేటిక్ పాఠంలోని కఠినమైన మాటలను మృదువుపరచకుండా, ‘దావీదు ప్రాణం ద్వేషించే’ అని నిలిపాం.
  alternative: ఈ పదాలను ముందరి వచనంలోని యెబూసీయుల ఎగతాళిలో భాగంగా మాత్రమే అర్థం చేసుకోవడం, లేదా దావీదుకు ద్వేషాన్ని ఆపాదించకుండా స్వేచ్ఛగా పునర్వ్యాఖ్యానించడం.
  rationale: హీబ్రూ వాక్యనిర్మాణం అసాధారణంగా సంక్షిప్తమూ సందిగ్ధమూ. అనువాదం ఆ ఉద్రిక్తతను నిలబెడుతుంది; అయితే ఈ ఒక్క వచనం ఆధారంగా వైకల్యం గురించి లేదా ఆరాధనా ప్రవేశం గురించి విస్తృతమైన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని అసంపూర్ణంగా వినిపించే సవాలు మరియు వాక్యనిర్మాణ సందిగ్ధతను దీర్ఘ గీత, విరామచిహ్నాలు, పాదసూచిక సహాయంతో నిలిపాం. ‘ప్రాణం ద్వేషించే’ అనే కొద్దిగా అసాధారణమైన తెలుగు నిర్మాణం హీబ్రూ నుడికారంలోని తీవ్రతను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
