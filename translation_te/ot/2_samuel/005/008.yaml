  revision_rationale: సవరణ మూలంలోని కఠినమైన, వివాదాస్పదమైన వాక్యనిర్మాణాన్ని అలాగే ఉంచుతుంది. ‘కూడా’ తొలగించడం ద్వారా మూలంలో లేని ఉద్ఘాటనను నివారించాం; ‘అంధులు’ను ఆధునిక ప్రామాణిక రిజిస్టర్ కోసం వాడాం. చివరి సామెతలో ‘రాడు’ అనేది హీబ్రూ భవిష్యత్ ప్రకటనను నిషేధాజ్ఞగా మార్చకుండా సహజంగా తెలియజేస్తుంది. అన్ని పాదసూచిక గుర్తులు తమ సంబంధిత పదాలకు జతచేయబడ్డాయి.
