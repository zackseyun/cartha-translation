  revised_text: 'ఆ రోజున దావీదు ఇలా అన్నాడు: “యెబూసీయులను కొట్టి, నీటి సొరంగాన్ని[a] చేరేవాడెవడైనా—దావీదు ప్రాణం ద్వేషించే కుంటివారినీ అంధులనూ...”[b] అందుకే, “అంధుడూ కుంటివాడూ ఆ ఇంట్లోకి[c] రాడు” అని అంటారు.'
