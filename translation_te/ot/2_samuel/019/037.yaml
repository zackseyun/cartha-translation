translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజును ఉద్దేశించిన గౌరవభరితమైన స్వీయనమ్రతను నిలిపి, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది.
