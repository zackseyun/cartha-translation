- from: ఎందుకంటే, నీ సేవకుడినైన నేను రాజుతో కలిసి యొర్దాను దాటి కొంతదూరమే వస్తాను. రాజు నాకు ఈ ప్రతిఫలాన్ని ఎందుకు ఇవ్వాలి?[a]
  to: ఎందుకంటే, నీ సేవకుడినైన నేను రాజుతో కలిసి యొర్దాను దాటి కొంత దూరం మాత్రమే వెళ్తాను. రాజు నాకు ఈ ప్రతిఫలాన్ని[a] ఎందుకు ఇవ్వాలి?
