  text: כִּ/מְעַ֞ט יַעֲבֹ֧ר עַבְדְּ/ךָ֛ אֶת הַ/יַּרְדֵּ֖ן אֶת הַ/מֶּ֑לֶךְ וְ/לָ֨/מָּה֙ יִגְמְלֵ֣/נִי הַ/מֶּ֔לֶךְ הַ/גְּמוּלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: te
  text: ఎందుకంటే, నీ సేవకుడినైన నేను రాజుతో కలిసి యొర్దాను దాటి కొంత దూరం మాత్రమే వెళ్తాను. రాజు నాకు ఈ ప్రతిఫలాన్ని[a] ఎందుకు ఇవ్వాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ప్రతిఫలమివ్వడం’ అనే క్రియ, ‘ప్రతిఫలం’ అనే నామవాచకం ఒకే మూలపదం (גמל) నుంచి వచ్చాయి; దీనివల్ల తిరిగి చేసిన మేలు లేదా ప్రతిచేయడం అనే భావం నొక్కి చెప్పబడుతుంది.
    reason: మూలభాషలోని పదపునరుక్తి తెలుగులో సహజంగా పూర్తిగా ప్రతిబింబించకపోవడం
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: ఎందుకంటే ... కొంతదూరమే
  rationale: כִּי సందర్భంలో కారణాన్ని పరిచయం చేస్తుంది; מְעַט ప్రయాణదూరాన్ని పరిమితం చేస్తుంది. సహజమైన తెలుగులో ఈ రెండింటినీ ఈ నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: יַעֲבֹר
  choice: దాటి ... వస్తాను
  rationale: ఈ అసంపూర్ణ క్రియ సందర్భంలో ఉద్దేశించిన, పరిమితమైన వెంటరావడాన్ని సూచిస్తుంది; సాధారణ భవిష్యద్వాక్యంగా మాత్రమే కాదు.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడినైన నేను
  rationale: రాజుతో మాట్లాడేటప్పుడు ఇది తనను తాను తగ్గించుకొని సంబోధించే సంప్రదాయ ప్రయోగం; ఇక్కడ బానిసత్వ భావం ప్రధానంగా లేదు.
- source_word: אֶת הַ/יַּרְדֵּן
  choice: యొర్దాను దాటి
  rationale: עבר అనే క్రియతో కలిసినప్పుడు నదిని దాటడం అనే అర్థం వస్తుంది; తెలుగులో ‘యొర్దాను దాటి’ సహజంగా ఉంటుంది.
- source_word: אֶת הַ/מֶּלֶךְ
  choice: రాజుతో కలిసి
  rationale: ఇక్కడ אֶת కర్మసూచకం కాదు; ‘తో’ అనే సహవాసార్థక విభక్తి. అందువల్ల రాజుతో కలిసి దాటడం అనే భావం వస్తుంది.
- source_word: יִגְמְלֵ/נִי ... הַ/גְּמוּלָה הַ/זֹּאת
  choice: నాకు ఈ ప్రతిఫలాన్ని ... ఇవ్వాలి
  rationale: గమల్ మూలానికి చెందిన క్రియ, నామవాచకం రెండూ ప్రతిచేయడం లేదా ప్రతిఫలం ఇవ్వడం అనే భావాన్ని బలపరుస్తాయి. అదే మూలపునరుక్తిని తెలుగులో బలవంతంగా ఉంచితే అసహజంగా ఉండేందున భావాన్ని సహజంగా వ్యక్తం చేశాం.
