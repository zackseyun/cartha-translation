id: 2SA.19.10
reference: 2 Samuel 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: te
  text: 'ఇశ్రాయేలు గోత్రాలన్నిటిలోని ప్రజలంతా ఇలా వాదించుకుంటూ ఉన్నారు[a]: “రాజు మన శత్రువుల చేతిలోనుండి మనలను విడిపించాడు; ఫిలిష్తీయుల చేతిలోనుండి మనలను రక్షించాడు[b]. కాని ఇప్పుడు అబ్షాలోము కారణంగా[c] దేశం విడిచి పారిపోయాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చర్చించుకుంటూ,” “వివాదపడుతూ.” హీబ్రూ పదం సాధారణ సంభాషణను మాత్రమే కాకుండా, గోత్రాలన్నిటిలో సాగిన భిన్నాభిప్రాయాలతో కూడిన చర్చను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మన శత్రువుల చేతిలోనుండి,” “ఫిలిష్తీయుల చేతిలోనుండి.” ఇక్కడ “చేయి” అనేది వారి అధికారం లేదా అదుపును సూచించే హీబ్రూ రూపకం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “అబ్షాలోము ఎదుటనుండి,” “అబ్షాలోము వల్ల.” ఇది అతని కారణంగా లేదా అతని ఒత్తిడికి దూరంగా పారిపోవడాన్ని సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: వాదించుకుంటూ
  rationale: దీన్ అనే క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ ప్రజల మధ్య సాగుతున్న విస్తృతమైన వాదన లేదా చర్చను సూచిస్తుంది; కేవలం మాట్లాడుకోవడం కంటే బలమైన, సహజమైన తెలుగు పదప్రయోగం.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలో
  rationale: ఈ చర్చ ఇశ్రాయేలు గోత్రాలన్నిటిలో వ్యాపించి ఉందనే పరిధిని సహజంగా తెలియజేస్తుంది.
- source_word: הִצִּילָנוּ
  choice: మనలను విడిపించాడు
  rationale: ప్రమాదం లేదా శత్రువుల ఆధిపత్యం నుండి తప్పించడం అనే సైనిక-రాజకీయ భావాన్ని తెలియజేస్తుంది; తరువాతి క్రియతో పదపునరుక్తిని నివారిస్తుంది.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: మన శత్రువుల చేతిలోనుండి
  rationale: ‘చేయి’ అనేది అధికారం లేదా అదుపును సూచించే హీబ్రూ రూపకం; తెలుగులోనూ అర్థమయ్యేలా మూల రూపకాన్ని నిలుపుతుంది.
- source_word: מִלְּטָנוּ
  choice: మనలను రక్షించాడు
  rationale: మునుపటి క్రియతో భావసామ్యాన్ని కాపాడుతూ, వేరొక తెలుగు క్రియతో హీబ్రూ పదభేదాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల చేతిలోనుండి
  rationale: మునుపటి సమాంతర పదబంధంలోని ‘చేతిలోనుండి’ అనే అధికార రూపకాన్ని స్థిరంగా నిలుపుతుంది.
- source_word: וְעַתָּה
  choice: కాని ఇప్పుడు
  rationale: రాజు గతంలో చేసిన రక్షణకు, ప్రస్తుతం అతడు పారిపోయిన పరిస్థితికి మధ్యనున్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּרַח מִן הָאָרֶץ
  choice: దేశం విడిచి పారిపోయాడు
  rationale: అక్షరార్థమైన ‘దేశం నుండి పారిపోయాడు’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, ఆ ప్రాంతాన్ని విడిచి వెళ్లిన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: అబ్షాలోము కారణంగా
  rationale: పారిపోవడాన్ని సూచించే క్రియ తరువాత ఈ విభక్తి పదబంధం అబ్షాలోము వల్ల లేదా అతని ఒత్తిడి కారణంగా పారిపోయిన భావాన్ని ఇస్తుంది.
