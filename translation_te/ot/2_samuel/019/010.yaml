- from: ఇశ్రాయేలు గోత్రాలన్నిటిలో ప్రజలందరూ వాదించుకుంటూ[a], “రాజు మన శత్రువుల చేతిలోనుండి మనలను విడిపించాడు; ఫిలిష్తీయుల చేతిలోనుండి మనలను రక్షించాడు[b]. కాని ఇప్పుడు అబ్షాలోము కారణంగా[c] దేశం విడిచి పారిపోయాడు” అని చెప్పుకుంటున్నారు.
  to: 'ఇశ్రాయేలు గోత్రాలన్నిటిలోని ప్రజలంతా ఇలా వాదించుకుంటూ ఉన్నారు[a]: “రాజు మన శత్రువుల చేతిలోనుండి మనలను విడిపించాడు; ఫిలిష్తీయుల చేతిలోనుండి మనలను రక్షించాడు[b]. కాని ఇప్పుడు అబ్షాలోము కారణంగా[c] దేశం విడిచి పారిపోయాడు.”'
  rationale: అర్థంలో ఎటువంటి మార్పు చేయకుండా, వాక్యనిర్మాణాన్ని సహజమైన కథన తెలుగుగా సవరించాం. “ఇలా ... ఉన్నారు:” నిర్మాణం ప్రజల విస్తృత వాదనను, దాని విషయాన్ని స్పష్టంగా కలుపుతుంది; అన్ని పాదటిప్పణి ఆంకర్లు తమకు సంబంధించిన పదబంధాల వద్దే నిలిచాయి.
