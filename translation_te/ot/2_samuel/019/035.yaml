  text: וַ/יֹּ֥אמֶר בַּרְזִלַּ֖י אֶל הַ/מֶּ֑לֶךְ כַּ/מָּ֗ה יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י כִּי אֶעֱלֶ֥ה אֶת הַ/מֶּ֖לֶךְ יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/035.yaml
  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: te
  text: 'బర్జిల్లయి రాజుతో ఇలా అన్నాడు: “నేను రాజుతో కలిసి యెరూషలేముకు వెళ్లడానికి, నా జీవితంలో ఇంకా ఎన్ని రోజులు మిగిలి ఉన్నాయి?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో మరింత అక్షరార్థంగా, “నా జీవితపు సంవత్సరాల రోజులు ఎన్ని?”
    reason: మూల హీబ్రూలోని ఉద్దేశపూర్వకంగా పొరలుగల కాలవ్యక్తీకరణను చూపించడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన శైలిలో אמר అనే సాధారణ క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בַּרְזִלַּי
  choice: బర్జిల్లయి
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజుతో
  rationale: మూలంలో వ్యక్తి పేరు కాకుండా నిర్దిష్ట సామాన్య నామవాచకం ‘రాజు’ ఉంది; తెలుగు మాటల సందర్భంలో ‘రాజుతో అన్నాడు’ సహజంగా ఉంది.
- source_word: כַּמָּה יְמֵי שְׁנֵי חַיַּי
  choice: నా జీవితంలో ఇంకా ఎన్ని రోజులు మిగిలి ఉన్నాయి?
  rationale: మూలంలోని పొరలుగల ‘నా జీవిత సంవత్సరాల రోజులు ఎన్ని?’ అనే ప్రశ్నను, మిగిలిన ఆయుష్షును సూచించే సందర్భానుసారమైన సహజ తెలుగులో అందించింది; అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో నిలిపింది.
- source_word: כִּי אֶעֱלֶה
  choice: నేను ... వెళ్లడానికి
  rationale: ఈ అలంకారిక ప్రశ్నలో כִּי తో కూడిన క్రియ వ్యక్తపరచే ఉద్దేశం/పర్యవసాన భావాన్ని సహజ తెలుగులో చూపుతుంది. యెరూషలేముకు ‘పైకి వెళ్లడం’ అనే భౌగోళిక భావం తెలుగులో సాధారణంగా ‘వెళ్లడం’లోనే సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶת הַמֶּלֶךְ
  choice: రాజుతో కలిసి
  rationale: ఇక్కడ אֶת సహవాసం లేదా తోడుగా వెళ్లడాన్ని సూచిస్తుంది; రాజును కర్మగా తీసుకోవడం సందర్భానికి సరిపోదు.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
