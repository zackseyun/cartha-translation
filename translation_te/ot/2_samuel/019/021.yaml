  text: כִּ֚י יָדַ֣ע עַבְדְּ/ךָ֔ כִּ֖י אֲנִ֣י חָטָ֑אתִי וְ/הִנֵּֽה בָ֣אתִי הַ/יּ֗וֹם רִאשׁוֹן֙ לְ/כָל בֵּ֣ית יוֹסֵ֔ף לָ/רֶ֕דֶת לִ/קְרַ֖את אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: te
  text: ఎందుకంటే, మీ సేవకుడైన నేను పాపం చేశానని నాకు తెలుసు. ఇదిగో, ఈ రోజు నా ప్రభువైన రాజును ఎదుర్కొనడానికి దిగివచ్చినవారిలో యోసేపు వంశమంతటిలో నేనే మొదటివాడిగా వచ్చాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యోసేపు వంశం” అనేది యోసేపు సంతతికి చెందిన గోత్రాలను, ముఖ్యంగా ఎఫ్రాయిము, మనష్షేలతో సంబంధమున్న ఉత్తర గోత్రసమూహాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “యోసేపు వంశమంతటినుండి.” యోసేపు గోత్రసమూహమంతటిలో రాజును ఎదుర్కొనడానికి దిగివచ్చిన మొదటివాడు ఇతడే అనే అర్థం వచ్చేలా హెబ్రీ నిర్మాణాన్ని గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: షిమీ చేస్తున్న విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజమైన కారణసూచక అనుసంధానం.
- source_word: יָדַע עַבְדְּךָ
  choice: మీ సేవకుడనైన నాకు తెలుసు
  rationale: రాజసభలో వినయపూర్వక స్వీయసంబోధనను నిలుపుతూ, సంపూర్ణ క్రియ సూచించే ప్రస్తుత అవగాహనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: חטא పదంలోని నైతిక, ధార్మిక బరువును తగ్గించకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే మూలపద బలాన్ని ఆధునికమైనప్పటికీ గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: בָאתִי הַיּוֹם
  choice: ఈ రోజు వచ్చాను
  rationale: షిమీ ఇప్పుడు రాజు సమక్షంలో ఉన్న సందర్భానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: యోసేపు వంశమంతటిలో నేనే మొదటివాడిగా
  rationale: షిమీ తనను ఆ సమూహంలో మొదట వచ్చినవాడిగా చూపే భావాన్ని వ్యక్తం చేస్తూ, לְ నిర్మాణంలోని స్వల్ప అస్పష్టతను పాదసూచికలో ఉంచుతుంది.
- source_word: בֵּית יוֹסֵף
  choice: యోసేపు వంశం
  rationale: గోత్రసమూహాన్ని సూచించే సామూహిక నామాన్ని అక్షరార్థానికి దగ్గరగా, సహజ తెలుగులో నిలుపుతుంది.
- source_word: לָרֶדֶת לִקְרַאת
  choice: ఎదుర్కొనడానికి దిగివచ్చిన
  rationale: దిగివచ్చే భౌగోళిక కదలికను, రాజును కలుసుకోవడానికి అతని వైపు వెళ్లడాన్ని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజుకు ఉద్దేశించిన గౌరవపూర్వక సంబోధనను సహజ తెలుగు నిర్మాణంలో ప్రతిబింబిస్తుంది.
