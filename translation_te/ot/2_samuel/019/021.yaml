translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభకు తగిన గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కారణసంబంధం, ‘ఇదిగో’ అనే దృష్ట్యాకర్షణ, ‘దిగివచ్చిన’ అనే భౌగోళిక భావం, యోసేపు వంశానికి సంబంధించిన నిర్మాణ అస్పష్టత పరిరక్షించబడ్డాయి. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
