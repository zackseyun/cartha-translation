translation:
  language: te
  text: అతడు యూదా ప్రజలందరూ ఒకే మనస్సుతో ఉండేలా వారి హృదయాలను మళ్లించాడు. అప్పుడు వారు రాజుకు, “నీవూ నీ సేవకులందరూ తిరిగి రండి” అని కబురు పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: హృదయాన్ని ... తనవైపు తిప్పాడు
  rationale: נטה యొక్క ‘వంచు/మళ్లించు/మొగ్గుచూపేలా చేయు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో అతడు యూదావారి మద్దతును గెలుచుకున్నాడనే భావం ఉంది.
- source_word: כָּל־אִישׁ יְהוּדָה
  choice: యూదా మనుషులందరి
  rationale: సమూహార్థక ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంగా అందిస్తుంది.
- source_word: כְּאִישׁ אֶחָד
  choice: ఏకమనస్సు కలిగేలా
  rationale: అక్షరార్థంగా ‘ఒక మనిషిలా’; ఇక్కడ ఉద్దేశించిన ఐక్యతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שׁוּב אַתָּה וְכָל־עֲבָדֶיךָ
  choice: నీవూ నీ సేవకులందరూ తిరిగి రండి
  rationale: రాజుతో పాటు అతని సేవకులూ రావాలనే బహువచన భావానికి అనుగుణంగా తెలుగులో గౌరవపూర్వక బహువచన క్రియను వాడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘హృదయం’ అనే బైబిలీయ రూపకాన్ని నిలిపి, ‘ఒక మనిషిలా’ అనే హీబ్రూ నుడికారాన్ని ‘ఏకమనస్సు కలిగేలా’ అని అర్థసహజంగా ఇచ్చాం.
