translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ బంధుత్వ నుడికారాన్ని వివరణగా మార్చకుండా ప్రధాన వచనంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో తెలిపాం.
