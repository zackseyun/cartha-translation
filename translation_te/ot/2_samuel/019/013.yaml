  text: אַחַ֣/י אַתֶּ֔ם עַצְמִ֥/י וּ/בְשָׂרִ֖/י אַתֶּ֑ם וְ/לָ֧/מָּה תִהְי֛וּ אַחֲרֹנִ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/013.yaml
  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: te
  text: మీరు నా సహోదరులు[a]; మీరు నా ఎముక, నా మాంసం[b]. కాబట్టి రాజును[c] తిరిగి తీసుకురావడంలో మీరెందుకు చివరివారిగా ఉండాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానుసారంగా ‘నా బంధువులు’; అక్షరార్థంగా ‘నా సోదరులు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నా ఎముక, నా మాంసం’; ఇది దగ్గరి రక్తసంబంధాన్ని తెలిపే నుడికారం.
    reason: cultural_note
  - marker: c
    text: దావీదు ఇక్కడ తనను తాను మూడవ పురుషలో ‘రాజు’ అని పేర్కొంటున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: నా సహోదరులు
  rationale: మూలంలోని ‘నా సోదరులు’ అనే ప్రత్యక్ష బంధుత్వ పదాన్ని నిలుపుతూ, యూదా వారితో దావీదుకున్న రక్తసంబంధాన్ని సూచిస్తుంది.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: నా ఎముక, నా మాంసం
  rationale: దగ్గరి రక్తసంబంధాన్ని తెలిపే హీబ్రూ నుడికారంలోని స్పష్టమైన శరీర చిత్రణను యథాతథంగా, తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְלָמָה
  choice: కాబట్టి … ఎందుకు
  rationale: ముందు చెప్పిన బంధుత్వాన్ని ఆధారంగా చేసుకొని చేసే విజ్ఞప్తిలోని తార్కిక అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: మీరెందుకు చివరివారిగా ఉండాలి?
  rationale: ఇది కేవలం భవిష్యత్ అంచనా కాకుండా ప్రేరేపించే అలంకార ప్రశ్న; ‘చివరివారిగా’ ఇతరులకంటే ఆలస్యంగా చర్య తీసుకోవడాన్ని నిలుపుతుంది.
- source_word: לְהָשִׁיב
  choice: తిరిగి తీసుకురావడంలో
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి వచ్చేలా చేయడం’ అనే causative భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: אֶת־הַמֶּלֶךְ
  choice: రాజును
  rationale: దావీదు తనను తాను మూడవ పురుషలో ‘రాజు’ అని పేర్కొన్న మూలభాషా రూపాన్ని మార్చకుండా ఉంచుతుంది.
