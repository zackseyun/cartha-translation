base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: te
  text: అప్పుడు రాజు తిరిగి యొర్దాను వరకు వచ్చాడు. యూదా ప్రజలు[a] రాజును ఎదుర్కొనడానికి వెళ్లి, ఆయనను యొర్దాను దాటించడానికి గిల్గాలుకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘యూదా’ అని మాత్రమే ఉంది; అది ఇక్కడ యూదా గోత్ర ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి
  rationale: שוב అనే క్రియ కథన క్రమంలో రాజు తన పారిపోవడం తర్వాత తిరిగి రావడాన్ని సూచిస్తుంది; తెలుగులో ‘తిరిగి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: యొర్దాను వరకు వచ్చాడు
  rationale: עַד గమనం నది వద్దకు చేరినంతవరకు జరిగిందని సూచిస్తుంది; ఈ దశలోనే దాటాడని చెప్పకుండా మూలంలోని సరిహద్దు భావాన్ని కాపాడుతుంది.
- source_word: וִיהוּדָה
  choice: యూదా ప్రజలు
  rationale: స్థలనామమైన ‘యూదా’ ఇక్కడ గోత్రం లేదా దాని ప్రజలను సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో వాక్యం స్పష్టంగా ఉండేందుకు ‘ప్రజలు’ చేర్చబడింది; సంక్షిప్త ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בָּא הַגִּלְגָּלָה
  choice: గిల్గాలుకు వచ్చారు
  rationale: స్థలనామానికి జోడించిన దిశాసూచక ה గిల్గాలుకు గమనాన్ని తెలియజేస్తుంది. సమష్టివాచకమైన యూదా ప్రజలకు అనుగుణంగా బహువచన క్రియ వాడబడింది.
- source_word: לָלֶכֶת לִקְרַאת הַמֶּלֶךְ
  choice: రాజును ఎదుర్కొని
  rationale: లక్ష్యార్థక క్రియారూపాలు రాజును కలుసుకోవడానికి వెళ్లడాన్ని సూచిస్తాయి. ‘ఎదుర్కొని’ ఇక్కడ ప్రతిఘటన కాదు, స్వాగతంగా ఎదురువెళ్లి కలుసుకోవడం అనే సహజ సందర్భార్థంలో వాడబడింది.
- source_word: לְהַעֲבִיר אֶת הַמֶּלֶךְ אֶת הַיַּרְדֵּן
  choice: ఆయనను యొర్దాను దాటించడానికి
  rationale: עבר హిఫీల్ రూపంలోని కారణార్థాన్ని ‘దాటించడానికి’ నేరుగా కాపాడుతుంది; పడవ లేదా ఇతర నిర్దిష్ట సాధనాన్ని అనవసరంగా చేర్చదు.
