  text: בֶּן שְׁמֹנִ֣ים שָׁנָה֩ אָנֹכִ֨י הַ/יּ֜וֹם הַ/אֵדַ֣ע בֵּין ט֣וֹב לְ/רָ֗ע אִם יִטְעַ֤ם עַבְדְּ/ךָ֙ אֶת אֲשֶׁ֤ר אֹכַל֙ וְ/אֶת אֲשֶׁ֣ר אֶשְׁתֶּ֔ה אִם אֶשְׁמַ֣ע ע֔וֹד בְּ/ק֖וֹל שָׁרִ֣ים וְ/שָׁר֑וֹת וְ/לָ/מָּה֩ יִֽהְיֶ֨ה עַבְדְּ/ךָ֥ עוֹד֙ לְ/מַשָּׂ֔א אֶל אֲדֹנִ֖/י הַ/מֶּֽלֶךְ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: te
  text: ఈ రోజు నాకు ఎనభై ఏళ్లు. మంచి చెడుల మధ్య తేడాను నేను గుర్తించగలనా?[a] నీ సేవకుడైన నేను తినేదాన్ని, తాగేదాన్ని రుచి చూడగలనా? గాయకుల, గాయనుల స్వరాన్ని నేను ఇంకా వినగలనా? అలాంటప్పుడు నీ సేవకుడు నా ప్రభువైన రాజుకు ఇంకా ఎందుకు భారంగా ఉండాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మంచి చెడుల మధ్య తేడాను నేను గుర్తించగలనా?” అనే మాటకు “మేలు కీడులను నేను వివేచించగలనా?” అని కూడా అనువదించవచ్చు. హెబ్రీయ ప్రయోగం నైతిక వివేచనను గానీ, ఆచరణాత్మక నిర్ణయశక్తిని గానీ సూచించగలదు; ఇక్కడ వృద్ధాప్యం, క్షీణిస్తున్న ఇంద్రియాల సందర్భం సాధారణ నిర్ణయశక్తి తగ్గడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: ఈ రోజు నాకు ఎనభై ఏళ్లు
  rationale: వయస్సును తెలిపే హెబ్రీయ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; הַיּוֹםను ‘ఈ రోజు’గా నిలుపుతుంది.
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: మంచి చెడుల మధ్య తేడాను నేను గుర్తించగలనా?
  rationale: ידע בין అనే ప్రయోగంలోని వివేచన భావాన్ని ‘తేడాను గుర్తించు’ సహజంగా అందిస్తుంది; טוֹב/רָע జంటను ‘మంచి చెడులు’గా సన్నిహితంగా నిలుపుతుంది.
- source_word: יִטְעַם ... אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: తాను తినేదాని రుచిని, తాగేదాని రుచిని తెలుసుకోగలడా?
  rationale: טעם యొక్క ఇంద్రియార్థమైన ‘రుచి చూడు/గ్రహించు’ను వృద్ధాప్య సందర్భంలో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: రాజుతో మాట్లాడే సందర్భంలోని వినయపూర్వక స్వీయసంబోధన; ఇక్కడ బానిసత్వం ప్రధానాంశం కాదు.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: గాయకుల, గాయనుల స్వరాన్ని నేను ఇంకా వినగలనా?
  rationale: పురుష, స్త్రీ గాయకుల మధ్య మూలపాఠంలోని వ్యత్యాసాన్ని నిలుపుతూ קולను ‘స్వరం’గా అందిస్తుంది.
- source_word: לְמַשָּׂא
  choice: భారంగా
  rationale: రాజుకు కలిగే ఇబ్బంది లేదా మోపును సూచించే రూపకార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: మానవ రాజుకు చేసే గౌరవపూర్వక ఆస్థాన సంబోధనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: טוֹב לְרָע అనే జంట నైతిక మంచిచెడులను మాత్రమే సూచిస్తుందా, లేక సాధారణ వివేచనను కూడా సూచిస్తుందా?
  choice: మంచి చెడుల మధ్య తేడాను గుర్తించడం
  alternative: మేలు కీడులను వివేచించడం
  rationale: మూలంలోని సాంప్రదాయ పదజంటను నిలుపుతూనే, వృద్ధాప్యం మరియు క్షీణిస్తున్న ఇంద్రియాల సందర్భానికి సరిపోయే సాధారణ నిర్ణయశక్తి భావాన్ని వాక్యనిర్మాణం ద్వారా తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రాజాస్థాన వినయాన్ని ‘నీ సేవకుడు’, ‘నా ప్రభువైన రాజు’ ద్వారా నిలిపి, వరుస అలంకారప్రశ్నల నిర్మాణాన్ని కాపాడింది.
