  terminology: “మంచి చెడుల మధ్య తేడా,” “నీ సేవకుడు,” “గాయకులు, గాయనులు,” and “నా ప్రభువైన రాజు” are suitable. “రుచి చూడగలనా” is the natural sensory equivalent of the Hebrew verb for tasting.
  issues:
