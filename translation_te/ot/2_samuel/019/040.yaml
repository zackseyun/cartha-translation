reference: 2 Samuel 19:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: te
  text: ప్రజలంతా యొర్దాను నదిని దాటారు; రాజు కూడా దాటాడు. అప్పుడు రాజు బర్జిల్లయిని ముద్దుపెట్టుకొని, అతణ్ణి ఆశీర్వదించాడు. అతడు తన చోటికి తిరిగి వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు’ అనేది సందర్భం ప్రకారం బర్జిల్లయిని సూచించడం అత్యంత సహజం. హీబ్రూ పాఠంలో కర్త పేరు మళ్లీ చెప్పబడలేదు కాబట్టి, వ్యాకరణపరంగా రాజును సూచించే అవకాశం కూడా ఉంది.
    reason: కర్తకు సంబంధించిన అసలు హీబ్రూ పాఠంలోని అస్పష్టతను వివరించడం.
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: దాటారు / దాటాడు
  rationale: עבר ఇక్కడ యొర్దాను నదిని దాటడాన్ని సూచిస్తుంది. కర్తల సంఖ్యకు అనుగుణంగా తెలుగులో బహువచన, ఏకవచన రూపాలు వాడబడ్డాయి.
- source_word: כָּל הָעָם
  choice: ప్రజలంతా
  rationale: עם అనే పదానికి విస్తృతమైన ‘ప్రజలు’ అనే అర్థాన్ని నిలుపుతుంది; వీరిని సైనికులుగా మాత్రమే పరిమితం చేయదు.
- source_word: אֶת הַיַּרְדֵּן
  choice: యొర్దాను నదిని
  rationale: తెలుగు పాఠకులకు భౌగోళిక సూచన స్పష్టంగా ఉండేందుకు నది అనే పదం సహజంగా చేర్చబడింది.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: రాజు కూడా దాటాడు
  rationale: హీబ్రూలోని పునరుక్తిని నిలుపుతూ, తెలుగులో వాక్య సంబంధాన్ని సహజంగా చూపడానికి ‘కూడా’ వాడబడింది.
- source_word: וַיִּשַּׁק
  choice: ముద్దుపెట్టుకొని
  rationale: נשק క్రియలోని వీడ్కోలు ప్రేమాభిమాన సూచక చర్యను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבַרְזִלַּי
  choice: బర్జిల్లయి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וַיְבָרֲכֵהוּ
  choice: అతణ్ణి ఆశీర్వదించాడు
  rationale: ברך అనే స్పష్టమైన ‘ఆశీర్వదించు’ అర్థాన్ని వీడ్కోలు పలికాడు అని కుదించకుండా నిలుపుతుంది.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: అతడు తన చోటికి తిరిగి వెళ్లాడు
  rationale: מקום ను ‘ఇల్లు’ లేదా ‘ఊరు’ అని ప్రత్యేకంగా నిర్ణయించకుండా ‘చోటు’గా ఉంచి, హీబ్రూలోని మూడవ పురుష ఏకవచన కర్త అస్పష్టతను ‘అతడు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: וַיָּשָׁב అనే క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో ‘అతడు’ అని ఉంచి కర్తను పేరుతో స్పష్టం చేయలేదు.
  alternative: ‘బర్జిల్లయి తన చోటికి తిరిగి వెళ్లాడు’ లేదా ‘రాజు తన చోటికి తిరిగి వెళ్లాడు.’
  rationale: సందర్భం ప్రకారం బర్జిల్లయి కర్త కావడం అత్యంత సహజం; అయినా హీబ్రూ పాఠంలో పేరు కాక మూడవ పురుష ఏకవచన క్రియ మాత్రమే ఉంది. అందువల్ల అసలు పాఠంలోని స్వల్ప వ్యాకరణ అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, సందర్భసూచనను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘తన చోటికి’ అనే పదబంధం కొద్దిగా మూలపాఠానుసారమైనదైనా, מקום యొక్క విస్తృత అర్థాన్ని అనవసరంగా ‘ఇల్లు’ లేదా ‘ఊరు’గా పరిమితం చేయదు.
