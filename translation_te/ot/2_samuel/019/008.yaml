  to: ఇప్పుడు లేచి, బయటికి వెళ్లి, నీ సేవకుల మనసుకు నచ్చేలా మాట్లాడు[a]. నీవు బయటికి వెళ్లకపోతే, ఈ రాత్రి ఒక్కడు కూడా నీతో ఉండడని యాహ్వే సాక్షిగా ప్రమాణం చేస్తున్నాను. అప్పుడు, నీ యౌవనం మొదలుకొని ఇప్పటివరకు నీకు సంభవించిన కష్టాలన్నిటికంటే ఇది నీకు మరింత ఘోరంగా ఉంటుంది.
