id: 2SA.19.8
reference: 2 Samuel 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: te
  text: ఇప్పుడు లేచి, బయటికి వెళ్లి, నీ సేవకుల మనసుకు నచ్చేలా మాట్లాడు[a]. నీవు బయటికి వెళ్లకపోతే, ఈ రాత్రి ఒక్కడు కూడా నీతో ఉండడని యాహ్వే సాక్షిగా ప్రమాణం చేస్తున్నాను. అప్పుడు, నీ యౌవనం మొదలుకొని ఇప్పటివరకు నీకు సంభవించిన కష్టాలన్నిటికంటే ఇది నీకు మరింత ఘోరంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ సేవకుల హృదయానికి మాట్లాడు.” ఈ నుడికారం ఆదరణగా, ధైర్యం కలిగేలా లేదా ఒప్పించే విధంగా మాట్లాడడాన్ని సూచించవచ్చు.
    reason: మూల నుడికారంలోని అక్షరార్థాన్ని, దాని సందర్భానుసారమైన భావవిస్తృతిని తెలియజేయడం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడైనా
  rationale: తక్షణ చర్యకు పిలిచే సంభాషణ మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: קוּם צֵא
  choice: లేచి, బయటికి వెళ్లి
  rationale: మూలంలోని రెండు ఆజ్ఞలైన లేవడం, బయటికి వెళ్లడం రెండింటినీ విడివిడిగా నిలుపుతుంది.
- source_word: וְדַבֵּר עַל־לֵב
  choice: మనసులను తాకేలా మాట్లాడు
  rationale: అక్షరార్థమైన ‘హృదయంపై/హృదయానికి మాట్లాడు’ అనే నుడికారంలోని ఆదరణ, ధైర్యం, ఒప్పించే భావాలను ఒక్కదానికే పరిమితం చేయకుండా సహజ తెలుగులో విస్తృతంగా నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: రాజకీయ-రాజసభ సందర్భంలో రాజుకు లోబడినవారు లేదా అనుచరులు అనే సంబంధాన్ని సూచిస్తుంది; బానిసత్వాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: యాహ్వే పేరున ప్రమాణం చేస్తున్నాను
  rationale: ప్రమాణ ప్రకటనలోని ప్రత్యక్ష బలాన్ని సహజ తెలుగులో నిలుపుతూ, יהוה అనే దైవనామాన్ని యాహ్వేగా ప్రతిలిపి చేస్తుంది.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: నీవు బయటికి వెళ్లకపోతే
  rationale: హెచ్చరికకు ఆధారమైన షరతును స్పష్టమైన తెలుగు షరతు వాక్యంగా అందిస్తుంది.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: ఈ రాత్రి ఒక్కడు కూడా నీతో ఉండడు
  rationale: לין లోని రాత్రివేళ నిలిచి ఉండే భావాన్ని ‘ఈ రాత్రి ... ఉండడు’గా, איש లోని సంపూర్ణ నిరాకరణ బలాన్ని ‘ఒక్కడు కూడా’గా వ్యక్తం చేస్తుంది.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: కష్టాలన్నిటికంటే ఇది నీకు ఘోరంగా ఉంటుంది
  rationale: רעה ను ఇక్కడ నైతిక చెడుగా కాక విపత్తు/ప్రతికూల ఫలితంగా గ్రహించి, מן సూచించే తులనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: నీ యౌవనం మొదలుకొని ఇప్పటివరకు
  rationale: దావీదు యౌవనం నుండి ప్రస్తుత సంక్షోభం వరకు ఉన్న మొత్తం కాలవ్యాప్తిని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా సాధ్యమైన ధ్వన్యనుకరణతో నేరుగా అందిస్తుంది.
- issue: רעה యొక్క భావం
  choice: కష్టం / ఘోరమైన ప్రతికూల ఫలితం
  alternative: చెడు
  rationale: ఈ చారిత్రక సందర్భంలో పదం నైతిక దుష్టత్వాన్ని కాక దావీదుపై వచ్చిన ఆపదలను, ఇక రాబోయే విపత్తును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభ సందర్భానికి తగిన గౌరవభరితమైన కానీ సామాన్య పాఠకులకు సులభమైన శైలి ఉపయోగించబడింది. యోవాబు మాటల అత్యవసరతను చిన్న ఆజ్ఞావాక్యాలతో, ప్రమాణంలోని తీవ్రతను నేరుగా నిలుపుకున్నాం.
