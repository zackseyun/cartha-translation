- from: రాజు షిమీతో, “నీవు చనిపోవు[a]” అని చెప్పి, అతనికి ప్రమాణం చేశాడు.
  to: రాజు షిమీతో, “నీవు చనిపోవు[a]” అని చెప్పాడు. రాజు అతనికి ప్రమాణం చేశాడు.
