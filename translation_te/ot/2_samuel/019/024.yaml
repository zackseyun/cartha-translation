id: 2SA.19.24
reference: 2 Samuel 19:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/מֶּ֛לֶךְ אֶל שִׁמְעִ֖י לֹ֣א תָמ֑וּת וַ/יִּשָּׁ֥בַֽע ל֖/וֹ הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/024.yaml
  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: te
  text: రాజు షిమీతో, “నీవు చనిపోవు[a]” అని చెప్పాడు. రాజు అతనికి ప్రమాణం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “నీకు మరణశిక్ష విధించరు.” హీబ్రూలో అక్షరార్థంగా “నీవు చనిపోవు” అని ఉంది; ఇక్కడ అది మరణశిక్ష నుంచి క్షమిస్తున్న రాజవాగ్దానంగా పనిచేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని చెప్పి
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, తరువాతి ప్రమాణ చర్యతో అనుసంధానిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన రాజును సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో సహజంగా ‘రాజు’ సరిపోతుంది.
- source_word: אֶל שִׁמְעִי
  choice: షిమీతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא תָמוּת
  choice: నీవు చనిపోవు
  rationale: నిషేధార్థక అసంపూర్ణ క్రియలోని గంభీరమైన రాజవాగ్దానం లేదా నిర్ణయ భావాన్ని నిలుపుతూ, అది సహజ మరణమా లేక మరణశిక్ష నుంచి మినహాయింపా అనే అంతర్భావాన్ని పాఠ్యంలోనే పరిష్కరించదు.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేశాడు
  rationale: నిఫాల్ రూపంలోని ‘ప్రమాణం చేయడం’ అనే అర్థాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: సర్వనామ ప్రత్యయం షిమీని తిరిగి సూచిస్తుంది; అనవసరమైన పేరుపునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: ‘నీవు చనిపోవు’ అనే మాట మరణశిక్ష నుంచి క్షమాభిక్షను స్పష్టంగా సూచించాలా?
  choice: నీవు చనిపోవు
  alternative: నిన్ను చంపరు / నీకు మరణశిక్ష విధించను
  rationale: మూల హీబ్రూ అక్షరార్థాన్ని, అలాగే రాజు ఇచ్చిన హామీలోని సందర్భానుగుణమైన కానీ పూర్తిగా పలకని మరణశిక్ష భావాన్ని నిలుపుతుంది; వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, రాజవాక్యానికి తగిన గంభీరతను నిలిపింది.
