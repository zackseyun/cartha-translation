source:
  edition: WLC
  text: וְ/אַבְשָׁלוֹם֙ אֲשֶׁ֣ר מָשַׁ֣חְנוּ עָלֵ֔י/נוּ מֵ֖ת בַּ/מִּלְחָמָ֑ה וְ/עַתָּ֗ה לָ/מָ֥ה אַתֶּ֛ם מַחֲרִשִׁ֖ים לְ/הָשִׁ֥יב אֶת הַ/מֶּֽלֶךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: te
  text: మనం మనపై రాజుగా అభిషేకించిన అబ్షాలోము యుద్ధంలో చనిపోయాడు. ఇప్పుడు రాజును తిరిగి తీసుకురావడం[a] గురించి మీరు ఎందుకు మౌనంగా ఉన్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజును తిరిగి నిలబెట్టడం.”
    reason: לְהָשִׁיב అనే క్రియకు ‘తిరిగి తీసుకురావడం’తో పాటు సందర్భానుసారంగా ‘తిరిగి నిలబెట్టడం’ అనే సమీప భావం ఉండవచ్చు; రెండోది రాజ్యాధికారాన్ని ప్రత్యేకంగా పేర్కొనకుండా మూలపాఠంలోని విస్తృతతను కాపాడుతుంది.
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: వావ్ సంధిని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, ముందరి మాటను కొనసాగించే సహజ వాక్యప్రవాహంతో వ్యక్తపరిచాం.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: మనం మనమీద రాజుగా అభిషేకించిన
  rationale: מָשַׁח అనే రాజప్రతిష్ఠాపన పదానికి ‘అభిషేకించిన’ అని ఇచ్చాం. עָלֵינוּ లోని అధికార సంబంధాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘మనమీద రాజుగా’ అని అనువదించాం.
- source_word: מֵת בַּמִּלְחָמָה
  choice: యుద్ధంలో చనిపోయాడు
  rationale: పూర్తయిన సంఘటనను సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది; ‘యుద్ధంలో’ అనే ప్రయోగం నిర్దిష్ట ఉపపదాన్ని విడిగా బలవంతంగా చూపకుండా సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: וְ/עַתָּה
  choice: ఇప్పుడు
  rationale: ముందు చెప్పిన విషయానికి ప్రస్తుత ఆచరణాత్మక పరిణామాన్ని సూచిస్తుంది; తెలుగులో ‘ఇప్పుడు’తో ఆ సంబంధం సహజంగా తెలుస్తుంది.
- source_word: מַחֲרִשִׁים
  choice: మౌనంగా ఉన్నారు
  rationale: חרשׁ హిఫీల్ రూపంలోని మౌనంగా ఉండడం లేదా మాట్లాడకుండా ఉండడం అనే భావాన్ని కాపాడుతుంది; ‘తటపటాయిస్తున్నారు’ వంటి వ్యాఖ్యాత్మక అర్థాన్ని చేర్చదు.
- source_word: לְ/הָשִׁיב אֶת הַמֶּלֶךְ
  choice: రాజును తిరిగి తీసుకురావడం
  rationale: שׁוּב హిఫీల్ యొక్క ‘తిరిగి వచ్చేలా చేయడం/తీసుకురావడం’ అనే స్పష్టమైన భావాన్ని నిలుపుతుంది. రాజు దావీదే అయినా, మూలంలోని రాజకీయ సంబోధనను కాపాడేందుకు పేరు పెట్టలేదు.
theological_decisions:
- issue: అబ్షాలోము విషయంలో రాజప్రతిష్ఠాపన క్రియ מָשַׁח అనువాదం
  choice: అభిషేకించిన
  alternative: రాజుగా చేసుకున్న
  rationale: కథనంలో అబ్షాలోము తిరుగుబాటుదారుడైనా, మూలపాఠం రాజును అభిషేకించడానికి వాడే సాధారణ క్రియనే ఉపయోగిస్తుంది. ‘అభిషేకించిన’ అనడం ద్వారా ఆ చర్యను సమర్థించకుండానే దాని రాజకీయ-మతపరమైన గంభీరతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘అభిషేకించిన’ మరియు ‘మౌనంగా ఉన్నారు’ వంటి పదాలతో మూలపాఠంలోని రాజకీయ బరువును, నేరుగా అడిగిన ప్రశ్నను కాపాడాం.
