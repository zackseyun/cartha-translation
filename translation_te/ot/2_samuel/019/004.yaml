review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two occurrences of וַיִּתְגַּנֵּב with ‘దొంగచాటుగా’ and retains the comparison. However, ‘యుద్ధంలో పారిపోయి అవమానపడినవారు’ can imply that shame occurred after fleeing, whereas the Hebrew participle הַנִּכְלָמִים depicts people who are ashamed as they flee.
  naturalness: The draft is generally understandable, but recasting the comparison as ‘యుద్ధంలో పారిపోతూ సిగ్గుపడినవారు’ is more idiomatic and makes the temporal relationship clear in modern standard Telugu.
  terminology: ‘దొంగచాటుగా’ suitably expresses the unobtrusive, furtive sense without alleging theft. ‘సిగ్గుపడినవారు’ is a natural rendering of the ashamed people in this simile and avoids overstating the term as public disgrace alone.
  issues:
  - severity: low
    issue: Temporal nuance of shame and flight is slightly blurred.
    rationale: The Hebrew construction refers to ashamed people in their flight from battle. The draft’s perfective sequence ‘పారిపోయి అవమానపడినవారు’ may suggest that they first fled and then became ashamed.
  revised_text: కాబట్టి ఆ రోజు ప్రజలు యుద్ధంలో పారిపోతూ సిగ్గుపడినవారు దొంగచాటుగా వెళ్లినట్లే, దొంగచాటుగా పట్టణంలోకి వచ్చారు.
