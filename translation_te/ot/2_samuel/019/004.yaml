  text: కాబట్టి ఆ రోజు ప్రజలు యుద్ధంలో పారిపోతూ సిగ్గుపడినవారు దొంగచాటుగా వెళ్లినట్లే, దొంగచాటుగా పట్టణంలోకి వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב
  choice: దొంగచాటుగా ... వచ్చారు
  rationale: హిత్పయేల్ రూపం జనులు ఇతరుల కంటపడకుండా, నిశ్శబ్దంగా పట్టణంలోకి ప్రవేశించారనే భావాన్ని ఇస్తుంది.
- source_word: הַנִּכְלָמִים
  choice: అవమానపడినవారు
  rationale: యుద్ధంలో ఓడి పారిపోవడం వల్ల కలిగిన సిగ్గు, అవమానం రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: యుద్ధంలో పారిపోయి
  rationale: వారు యుద్ధం నుంచి పారిపోతున్న సందర్భాన్ని సంక్షిప్తంగా, మూలార్థానికి నిబద్ధంగా తెలుపుతుంది.
