base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: te
  text: గిలాదీయుడైన బర్జిల్లయి రోగెలీము నుండి దిగివచ్చాడు. రాజును యొర్దాను వద్ద సాగనంపడానికి అతడు రాజుతో కలిసి యొర్దాను దాటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోగెలీము నుండి దిగివచ్చి, రాజుతో కలిసి యొర్దాను దాటి అతనిని సాగనంపడానికి వెళ్లాడు.” బర్జిల్లయి రాజుకు తోడుగా నది దాటడం, యొర్దాను వద్ద రాజును సాగనంపడం అనే భావాల అనుసంధానాన్ని హెబ్రీ వాక్యనిర్మాణం కొద్దిగా భిన్నంగా అర్థం చేసుకోవడానికి వీలు కల్పిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: బర్జిల్లయి
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా, తెలుగులో సులభంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
- source_word: הַגִּלְעָדִי
  choice: గిలాదీయుడైన
  rationale: బర్జిల్లయి గిలాదు ప్రాంతానికి చెందినవాడని తెలిపే ప్రాంతవాచక విశేషణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָרַד מֵרֹגְלִים
  choice: రోగెలీము నుండి దిగివచ్చాడు
  rationale: ירד అనే క్రియలోని ‘దిగివచ్చు’ భావాన్ని నిలిపి, బయలుదేరిన స్థలాన్ని מן ఉపసర్గ ప్రకారం తెలిపాం.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: అతడు రాజుతో కలిసి యొర్దాను దాటాడు
  rationale: עבר క్రియ దాటడాన్ని సూచిస్తుంది. אֶת הַמֶּלֶךְ నిర్మాణం ఇక్కడ రాజుకు తోడుగా వెళ్లడాన్ని సూచిస్తున్నందున ‘రాజుతో కలిసి’ అని సహజంగా అనువదించాం.
- source_word: לְשַׁלְּחוֹ
  choice: రాజును ... సాగనంపడానికి
  rationale: שלח యొక్క ఉద్దేశార్థక క్రియారూపం ఇక్కడ రాజును వీడ్కోలు పలికి పంపడం లేదా కొంతదూరం తోడుగా వెళ్లి పంపడం అనే భావాన్ని ఇస్తుంది; ‘సాగనంపడానికి’ ఈ రెండు ఛాయలను సహజంగా కలిగి ఉంది.
- source_word: בַיַּרְדֵּן
  choice: యొర్దాను దగ్గర
  rationale: ב ఉపసర్గ ఇక్కడ వీడ్కోలు జరిగే నదీప్రాంతాన్ని సూచించవచ్చు; ‘దగ్గర’ అనేది దాటిన దిశను అనవసరంగా నిర్ణయించకుండా స్థలాన్ని తెలుపుతుంది.
