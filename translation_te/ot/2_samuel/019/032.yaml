  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. హెబ్రీ వాక్యంలోని స్థలసంబంధమైన స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
