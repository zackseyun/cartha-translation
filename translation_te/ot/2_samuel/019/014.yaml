id: 2SA.19.14
reference: 2 Samuel 19:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: te
  text: 'అమాశాతో ఇలా చెప్పండి: ‘నువ్వు నా ఎముకవు, నా మాంసానివి కావా? యోవాబుకు బదులుగా నువ్వు నా సేవలో అన్ని రోజులూ సైన్యాధిపతిగా ఉండకపోతే, దేవుడు నాకు ఈ విధంగా చేయుగాక; ఇంకా ఎక్కువ చేయుగాక.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: అమాశాతో ఇలా చెప్పండి
  rationale: రెండవ పురుష బహువచన ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הֲלוֹא
  choice: కావా?
  rationale: సమ్మతిని ఆశించే అలంకార ప్రశ్న రూపాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: నా ఎముకవు, నా మాంసానివి
  rationale: బంధుత్వాన్ని సూచించే స్పష్టమైన హీబ్రూ రూపకాన్ని ‘నా బంధువువి’ అని వివరణాత్మకంగా కుదించకుండా నిలుపుతుంది.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: దేవుడు నాకు తగినది చేసి, అంతకంటే ఎక్కువే చేయుగాక
  rationale: పేర్కొనని శిక్షను అనవసరంగా నిర్దిష్టం చేయకుండా ప్రమాణ సూత్రంలోని గంభీరతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִם לֹא
  choice: ఉండకపోతే
  rationale: ప్రమాణ వాక్యంలోని షరతు నిర్మాణాన్ని నిలుపుతుంది; సందర్భంలో ఇది తరువాతి నియామకాన్ని నిశ్చయంగా ప్రకటిస్తుంది.
- source_word: שַׂר צָבָא
  choice: సైన్యాధిపతి
  rationale: ప్రధాన సైనిక నాయకుని పదవిని స్పష్టంగా, సంక్షిప్తంగా సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: תִּהְיֶה לְפָנַי
  choice: నా సేవలో ... ఉండడం
  rationale: అక్షరార్థమైన ‘నా ఎదుట’ కంటే, రాజు సమక్షంలో మరియు అధికారంలో సేవ చేయడమనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: కొనసాగుతున్న పదవీకాలం అనే నుడికార భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: תַּחַת יוֹאָב
  choice: యోవాబు స్థానంలో
  rationale: ఇక్కడ תַּחַת ఆధీనతను కాకుండా ప్రత్యామ్నాయం లేదా పదవీభర్తీని సూచిస్తుంది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: రూపపరంగా బహువచనమైనప్పటికీ, ఈ హీబ్రూ ప్రమాణ సూత్రంలో ఇశ్రాయేలు దేవుడే ఏకవచన కర్తగా సూచించబడ్డాడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. బంధుత్వ రూపకం మరియు ప్రమాణంలోని ఉద్దేశపూర్వక అనిర్దిష్టత నిలుపబడ్డాయి.
