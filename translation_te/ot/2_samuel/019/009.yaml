base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: te
  text: అప్పుడు రాజు లేచి ద్వారం వద్ద కూర్చున్నాడు[a]. “ఇదిగో, రాజు ద్వారం వద్ద కూర్చున్నాడు” అని ప్రజలందరికీ తెలియజేశారు. అప్పుడు ప్రజలందరూ రాజు సమక్షానికి వచ్చారు. అయితే ఇశ్రాయేలీయులు ఒక్కొక్కరు తమ గుడారాలకు పారిపోయారు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పురాతన పట్టణ ద్వారం కేవలం ప్రవేశద్వారం మాత్రమే కాదు; ప్రజలు కూడే, అధికారిక వ్యవహారాలు జరిగే ప్రాంగణం కూడా.
    reason: cultural_note
  - marker: b
    text: 'లేదా: “మరియు ఇశ్రాయేలీయులు ఒక్కొక్కరు తమ గుడారాలకు పారిపోయారు.” హీబ్రూ సంధిపదాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; సందర్భంలోని వ్యత్యాసాన్ని చూపడానికి ప్రధాన పాఠంలో “అయితే” వాడబడింది.'
    reason: lexical_alternative
  - marker: c
    text: “ఒక్కొక్కరు తమ గుడారాలకు పారిపోయారు” అనేది ఒక్కొక్కరూ తమ నివాసానికి లేదా తమ గోత్ర ప్రాంతానికి చెదరిపోయారని తెలిపే హీబ్రూ నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: అప్పుడు రాజు లేచి
  rationale: קום క్రియ యొక్క వరుస కథన రూపం తరువాత జరిగిన చర్యను సూచిస్తుంది. ‘అప్పుడు ... లేచి’ అనేది ఆ కథన గమనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: నగర ద్వారం దగ్గర కూర్చున్నాడు
  rationale: ישׁב ఇక్కడ రాజు ప్రజలకు కనిపించే బహిరంగ స్థానంలో కూర్చోవడాన్ని సూచిస్తుంది. పురాతన పట్టణ ద్వారం ఒక ప్రాంగణంతో కూడిన ప్రజా స్థలం కావడంతో, తెలుగులో ‘ద్వారం దగ్గర’ సహజంగా అర్థమవుతుంది.
- source_word: הִגִּידוּ לֵאמֹר
  choice: అని ప్రజలందరికీ తెలియజేశారు
  rationale: נגד యొక్క హిఫీల్ రూపానికి ‘తెలియజేయు, ప్రకటించు’ అనే భావం ఉంది. కర్త నిర్దిష్టంగా చెప్పబడలేదు కాబట్టి, తెలుగులో కర్తలేని బహువచన క్రియను ఉంచాం; לֵאמֹר యొక్క ఉద్ధరణ భావాన్ని ‘అని’ తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה శ్రద్ధను ప్రత్యక్షంగా ఆకర్షించే సూచక అవ్యయం. ‘ఇదిగో’ దాని బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: יוֹשֵׁב
  choice: కూర్చున్నాడు
  rationale: వర్తమాన కృదంతం రాజు ఆ సమయంలో కూర్చొని ఉన్న దృశ్యమాన స్థితిని సూచిస్తుంది. తెలుగు ఉద్ధరణలో ‘కూర్చున్నాడు’ ఆ కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: అప్పుడు ప్రజలందరూ రాజు సమక్షానికి వచ్చారు
  rationale: בוא + לפני అంటే ఒకరి ముందుకు లేదా సమక్షానికి రావడం. ‘రాజు సమక్షానికి’ ప్రజా దర్శన సందర్భాన్ని అతిగా వివరించకుండా స్పష్టంగా తెలుపుతుంది.
- source_word: וְיִשְׂרָאֵל נָס
  choice: అయితే ఇశ్రాయేలు ప్రజలు పారిపోయి
  rationale: יִשְׂרָאֵל ఇక్కడ సమష్టిగా ప్రజలను సూచిస్తుంది; అందువల్ల తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ అని స్పష్టం చేశాం. נָס ముందే జరిగిన నేపథ్య చర్యగా అర్థమవుతుంది. וְ ను సందర్భంలోని వ్యత్యాసం దృష్ట్యా ‘అయితే’గా ఇచ్చినా, దాని సాధారణ ‘మరియు’ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אִישׁ לְאֹהָלָיו
  choice: ప్రతి పురుషుడూ తన గుడారానికి వెళ్లిపోయాడు
  rationale: אִישׁ స్పష్టమైన పుంలింగ పంపిణీ ఏకవచనం; అందువల్ల ‘ప్రతి పురుషుడూ’ అని నిలిపాం. ‘తన గుడారానికి’ మూలంలోని సాంస్కృతిక రూపకాన్ని కాపాడుతుంది; తెలుగు వాక్యపూర్ణత కోసం ‘వెళ్లిపోయాడు’ వాడాం.
theological_decisions:
- issue: אִישׁ అనే పుంలింగ పంపిణీ వ్యక్తీకరణ
  choice: ప్రతి పురుషుడూ
  alternative: ప్రతి ఒక్కరూ
  rationale: హీబ్రూ పదం స్పష్టంగా పుంలింగ ఏకవచనంలో ఉండి, సమూహంలోని పురుషులను ఒక్కొక్కరిగా సూచించే సాంప్రదాయ వ్యక్తీకరణ. దానిని లింగతటస్థంగా మార్చకుండా మూలరూపానికి అనుగుణంగా ఉంచాం.
- issue: וְיִשְׂרָאֵל נָס లో సంబంధం మరియు కాలభావం
  choice: అయితే ఇశ్రాయేలు ప్రజలు పారిపోయి
  alternative: మరియు ఇశ్రాయేలు ప్రజలు పారిపోయారు
  rationale: ముందు రాజు దగ్గరకు కూడిన ప్రజలకు, అబ్షాలోము ఓటమి తరువాత చెదరిపోయిన విస్తృత ఇశ్రాయేలు సమూహానికి మధ్య సందర్భోచిత వ్యత్యాసాన్ని ‘అయితే’ చూపిస్తుంది. అయినా וְ సాధారణ సంధి కావడం వల్ల ‘మరియు’ అనే పఠనం కూడా సాధ్యమే; దానిని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇదిగో,’ ‘రాజు సమక్షానికి’ వంటి పదబంధాలు మూలంలోని బహిరంగ రాజసభ సందర్భాన్ని నిలుపుతాయి. పురాతన నగర ద్వారం మరియు ‘తన గుడారానికి’ అనే నానుడికి సంబంధించిన సాంస్కృతిక సమాచారాన్ని ప్రధాన పాఠాన్ని భారంగా చేయకుండా పాదసూచికల్లో ఇచ్చాం.
