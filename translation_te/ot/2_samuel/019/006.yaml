source:
  edition: WLC
  text: וַ/יָּבֹ֥א יוֹאָ֛ב אֶל הַ/מֶּ֖לֶךְ הַ/בָּ֑יִת וַ/יֹּאמֶר֩ הֹבַ֨שְׁתָּ הַ/יּ֜וֹם אֶת פְּנֵ֣י כָל עֲבָדֶ֗י/ךָ הַֽ/מְמַלְּטִ֤ים אֶֽת נַפְשְׁ/ךָ֙ הַ/יּ֔וֹם וְ/אֵ֨ת נֶ֤פֶשׁ בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ וְ/נֶ֣פֶשׁ נָשֶׁ֔י/ךָ וְ/נֶ֖פֶשׁ פִּלַגְשֶֽׁי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: te
  text: 'అప్పుడు యోవాబు రాజు దగ్గరకు ఇంట్లోకి వచ్చి ఇలా అన్నాడు: “ఈ రోజు నీ ప్రాణాన్ని, నీ కుమారుల, కుమార్తెల ప్రాణాలను, నీ భార్యల, ఉపపత్నుల ప్రాణాలను కాపాడిన నీ సేవకులందరినీ నీవు ఈ రోజు అవమానపరిచావు.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ సేవకులందరి ముఖాలను సిగ్గుపడేలా చేశావు.” ఇది వారిని బహిరంగంగా అవమానించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ప్రాణం/ప్రాణాలు” అని అనువదించిన హీబ్రూ పదం నెఫెష్; ఈ సందర్భంలో అది ‘ఆత్మ’ను కాక భౌతిక ప్రాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: ఇంట్లో ఉన్న రాజు దగ్గరికి
  rationale: హీబ్రూ పదక్రమం ‘రాజు దగ్గరికి—ఇంటికి/ఇంట్లో’ అని సంక్షిప్తంగా ఉంది. సందర్భంలో ఇది రాజనివాసాన్ని సూచించినా, ‘ఇల్లు’ అనే మూలార్థాన్ని నిలిపి సహజమైన తెలుగులో రాజు ఇంట్లో ఉన్నాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: అవమానపరిచావు
  rationale: హిఫీల్ రూపం అవమానం కలిగించడాన్ని సూచిస్తుంది. ‘ముఖాలను అవమానపరిచావు’ అనే యథార్థ రూపం తెలుగులో అసహజంగా ఉండటంతో భావసమానమైన సహజ ప్రయోగాన్ని ఎంచుకున్నాం; మూలంలోని దృశ్యరూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: రాజుతో సంబంధమున్న సేవకులు, అనుచరులు అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం సైనికులు లేదా అధికారులు అని అనవసరంగా పరిమితం చేయదు.
- source_word: הַמְמַלְּטִים
  choice: కాపాడిన
  rationale: మరణాపాయం నుండి తప్పించి ప్రాణాన్ని నిలిపిన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం / ప్రాణాలు
  rationale: ఈ సందర్భంలో נֶפֶשׁ అమూర్తమైన ‘ఆత్మ’ను కాక, మరణం నుండి కాపాడబడిన భౌతిక ప్రాణాన్ని సూచిస్తుంది.
- source_word: פִּלַגְשֶׁיךָ
  choice: నీ ఉపపత్నులు
  rationale: గుర్తింపు పొందినప్పటికీ భార్యకన్నా తక్కువ సామాజిక హోదా గల స్త్రీలను సూచించే చారిత్రక కుటుంబపదంగా ‘ఉపపత్నులు’ ఖచ్చితంగా సరిపోతుంది.
- source_word: וַיָּבֹא ... וַיֹּאמֶר
  choice: అప్పుడు ... వచ్చి ఇలా అన్నాడు
  rationale: వయ్యిక్తోల్ క్రియాశ్రేణి కథనాన్ని ముందుకు నడిపే క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
theological_decisions:
- issue: చారిత్రక కుటుంబ సంబంధ పదాలను నైతిక వ్యాఖ్య లేకుండా అనువదించడం
  choice: భార్యలు, ఉపపత్నులు
  alternative: భార్యలు, ద్వితీయ భార్యలు
  rationale: మూలపాఠం రెండు వేర్వేరు సామాజిక-కుటుంబ వర్గాలను నేరుగా పేర్కొంటుంది. వాటిని మృదువుచేయకుండా లేదా నైతిక తీర్పు జోడించకుండా అలాగే భేదపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని కుటుంబ సభ్యుల జాబితా, రెండుసార్లు వచ్చే ‘ఈ రోజు’లో తెలుగులో భారంగా అనిపించే రెండవదాన్ని సందర్భార్థంలో సమీకరించడం, అలాగే అవమానానికి సంబంధించిన హీబ్రూ ముఖ-నుడికారాన్ని పాదసూచికలో సంరక్షించడం జరిగింది.
