  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: te
  text: అతనితో పాటు బెన్యామీను గోత్రానికి చెందిన వెయ్యిమంది పురుషులు ఉన్నారు. సౌలు ఇంటి సేవకుడైన సీబా తన పదిహేనుమంది కుమారులతోను తన ఇరవైమంది సేవకులతోను ఉన్నాడు. వారు రాజు ముందు[a] యొర్దాను దాటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజుకంటే ముందుగా.” హీబ్రూ పదబంధం రాజు సమక్షంలో అని గానీ, రాజుకంటే ముందుగా అని గానీ అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ עִמּוֹ מִבִּנְיָמִן
  choice: అతనితోపాటు బెన్యామీను గోత్రానికి చెందిన వెయ్యిమంది
  rationale: సంఖ్యను, పురుషులను సూచించే భావాన్ని నిలుపుతూ, בִּנְיָמִן ఇక్కడ గోత్రసంబంధాన్ని సూచిస్తుందని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: צִיבָא
  choice: సీబా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: సౌలు ఇంటి సేవకుడు
  rationale: נַעַר అనే పదానికి యువకుడు, పరిచారకుడు, సేవకుడు అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో సౌలు రాజవంశ గృహానికి సేవచేసే సీబా పాత్రకు ‘సేవకుడు’ సరిపోతుంది. ‘ఇంటి’ అనే పదం గృహం/వంశం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו וְעֶשְׂרִים עֲבָדָיו אִתּוֹ
  choice: తన పదిహేనుమంది కుమారులతో, ఇరవైమంది సేవకులతో అతనితో ఉన్నాడు
  rationale: సీబాతో వచ్చిన రెండు వర్గాలనూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; עֲבָדָיו ను సందర్భానుసారంగా ‘సేవకులు’గా అనువదించింది.
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  choice: వారు యొర్దాను దాటారు
  rationale: צָלְחוּ ఇక్కడ నదిని దాటడాన్ని సూచిస్తుంది; ‘దాటారు’ సహజమైన, నేరమైన తెలుగు ప్రయోగం.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ముందు
  rationale: ఈ హీబ్రూ పదబంధం రాజు సమక్షంలో లేదా రాజుకంటే ముందుగా అనే రెండు స్థలార్థాలను అనుమతిస్తుంది. ‘రాజు ముందు’ మూలంలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
