translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించింది; మూలంలోని ‘రాజు ముందు’ అనే ఉద్దేశపూర్వక స్థలార్థ సందిగ్ధతను పాదసూచికతో కాపాడింది.
