source:
  edition: WLC
  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: te
  text: నా తండ్రి కుటుంబమంతా రాజైన నా ప్రభువు దృష్టిలో మరణదండనకు పాత్రులైనవారే[a]. అయినా, నీ బల్ల వద్ద భోజనం చేసేవారిలో నీ సేవకుడైన నన్ను నీవు చేర్చావు. కాబట్టి రాజుకు ఇక మొరపెట్టుకోవడానికి నాకు ఇంకా ఏ న్యాయమైన హక్కు ఉంది[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరణపు మనుషులు’; అంటే మరణశిక్షకు లోబడినవారు లేదా మరణదండనకు పాత్రులైనవారు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘న్యాయమైన హక్కు’ అని అనువదించిన హీబ్రూ పదం ‘త్సెదాకా’; ఈ సందర్భంలో అది ప్రధానంగా వ్యక్తిగత నైతిక నీతిని కాక, న్యాయమైన దావా లేదా అర్హతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: '...మంతా ... పాత్రులే'
  rationale: ఈ నిర్మాణంలోని బలమైన పరిమితి భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘అంతా...లే’ ద్వారా వ్యక్తం చేసింది.
- source_word: כָּל בֵּית אָבִי
  choice: నా తండ్రి వంశమంతా
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక విస్తృత కుటుంబ వంశాన్ని సూచిస్తుంది; ‘వంశమంతా’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אַנְשֵׁי מָוֶת
  choice: మరణానికి పాత్రులు
  rationale: అక్షరార్థమైన ‘మరణపు మనుషులు’ కంటే, మరణశిక్షకు లోబడినవారు లేదా మరణదండనకు తగినవారు అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: రాజైన నా ప్రభువు దృష్టిలో
  rationale: లామెద్ సూచించే రాజుతో సంబంధమైన న్యాయస్థితిని ‘దృష్టిలో’ సహజంగా తెలియజేస్తుంది.
- source_word: וַתָּשֶׁת
  choice: అయినా ... చేర్చావు
  rationale: మూలంలోని ‘ఉంచావు/నియమించావు’ అనే భావంతో పాటు ముందటి వాక్యానికి ఉన్న వ్యత్యాసాన్ని ‘అయినా’ వెల్లడిస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడైన నన్ను
  rationale: రాజు ఎదుట వినయపూర్వక స్వీయసంబోధన కావడంతో ‘సేవకుడు’ సందర్భోచితం.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: నీ బల్ల దగ్గర భోజనం చేసేవారిలో
  rationale: రాజు పోషణలో, సాంగత్యంలో ప్రత్యేక స్థానం పొందినవారి సామాజిక చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: నాకు ఇంకా ఏ న్యాయమైన హక్కు ఉంది
  rationale: צְדָקָה ఇక్కడ వ్యక్తిగత నీతిని ప్రధానంగా సూచించకుండా, రాజు ఎదుట ఉన్న న్యాయమైన దావా లేదా హక్కును సూచిస్తుంది.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: రాజుకు ఇక మొరపెట్టుకోవడానికి
  rationale: זעק లోని బలమైన వేడుకోలు/ఫిర్యాదు భావాన్ని ‘మొరపెట్టుకోవడం’ సహజమైన తెలుగులో అందిస్తుంది.
