id: 2SA.19.33
reference: 2 Samuel 19:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַרְזִלַּי֙ זָקֵ֣ן מְאֹ֔ד בֶּן שְׁמֹנִ֖ים שָׁנָ֑ה וְ/הֽוּא כִלְכַּ֤ל אֶת הַ/מֶּ֨לֶךְ֙ בְּ/שִׁיבָת֣/וֹ בְ/מַחֲנַ֔יִם כִּֽי אִ֛ישׁ גָּד֥וֹל ה֖וּא מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: te
  text: బర్జిల్లయి చాలా వృద్ధుడు; అతనికి ఎనభై ఏళ్లు. రాజు మహనయీములో ఉన్నప్పుడు అతడు రాజుకు అవసరమైనవి సమకూర్చాడు, ఎందుకంటే అతడు చాలా గొప్పవాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చాలా ధనవంతుడు,” లేదా “చాలా ప్రముఖుడు.” “చాలా గొప్పవాడు” అనే హీబ్రూ పదబంధం సంపదను, సామాజిక హోదాను లేదా ప్రాబల్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: చాలా వృద్ధుడు
  rationale: זָקֵן ఇక్కడ విధేయ విశేషణంగా ఉండగా מְאֹד దాని భావాన్ని బలపరుస్తుంది. ‘చాలా వృద్ధుడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: అతనికి ఎనభై ఏళ్లు
  rationale: ‘ఎనభై సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన తెలుగు వయస్సు ప్రయోగంతో అందించింది.
- source_word: כִלְכַּל
  choice: కావలసినవన్నీ సమకూర్చాడు
  rationale: כלכל ఇక్కడ రాజును భౌతికంగా పోషించడం, ఆయన అవసరాలను సమకూర్చడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఆచరణాత్మక సహాయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת הַמֶּלֶךְ
  choice: రాజు … ఆయనకు
  rationale: దావీదును అతని రాజపదవితో సూచించే నిర్దిష్ట కర్మను నిలుపుతూ, తెలుగులో గౌరవసూచక సర్వనామాన్ని ఉపయోగించింది.
- source_word: בְּשִׁיבָתוֹ
  choice: ఉన్నప్పుడు
  rationale: ישב ఇక్కడ సింహాసనాసీనతను కాక ఒక చోట ఉండడాన్ని సూచిస్తుంది; ప్రత్యయం సమీపంలో ప్రస్తావించిన రాజునే సహజంగా సూచిస్తుంది.
- source_word: בְמַחֲנַיִם
  choice: మహనయీములో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బర్జిల్లయి రాజుకు అవసరాలు సమకూర్చగలిగిన కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: బర్జిల్లయి చాలా గొప్ప వ్యక్తి
  rationale: ఈ హీబ్రూ పదబంధం సంపద, సామాజిక స్థాయి, ప్రాబల్యం వంటి విస్తృత భావాలను కలిగి ఉండవచ్చు. ‘గొప్ప వ్యక్తి’ ఆ ఉద్దేశపూర్వక విస్తృతిని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: אִישׁ גָּדוֹל అనే పదబంధం సంపదకే పరిమితమా, లేక హోదా/ప్రాబల్యాన్నీ సూచిస్తుందా?
  choice: చాలా గొప్ప వ్యక్తి
  alternative: చాలా ధనవంతుడు
  rationale: రాజును పోషించిన సందర్భం అతని సంపదను బలంగా సూచించినా, మూల హీబ్రూ మాట సంపదకన్నా విస్తృతమైన సామాజిక గొప్పతనాన్ని కూడా సూచించగలదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది; పాదసూచిక సందర్భోచిత అర్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించింది. అనవసరమైన కాలసూచక ప్రారంభపదాన్ని చేర్చలేదు; ‘గొప్ప వ్యక్తి’ అనే మూలంలోని భావవిస్తృతిని పాదసూచికతో సంరక్షించింది.
