  text: וְ/עָבְרָ֣ה הָ/עֲבָרָ֗ה לַֽ/עֲבִיר֙ אֶת בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/לַ/עֲשׂ֥וֹת הַ/טּ֖וֹב ב/עינ/ו וְ/שִׁמְעִ֣י בֶן גֵּרָ֗א נָפַל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ בְּ/עָבְר֖/וֹ בַּ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: te
  text: రాజు పరివారాన్ని[b] అవతలి ఒడ్డుకు చేర్చడానికి, ఆయనకు నచ్చినది చేయడానికి[c] పడవ[a] దాటివచ్చింది. రాజు యొర్దాను నదిని దాటుతున్నప్పుడు[d], గేరా కుమారుడు షిమీ రాజు ఎదుట సాగిలపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాటించే పడవ’; హీబ్రూ పదం నదిని దాటడానికి ఉపయోగించే సాధనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘రాజు పరివారం’ అంటే రాజభవనం కాదు; రాజ కుటుంబానికి లేదా రాజ సమూహానికి చెందిన ప్రజలు.
    reason: cultural_note
  - marker: c
    text: 'హీబ్రూలో అక్షరార్థం: ‘ఆయన కళ్లలో మంచిదైనది చేయడానికి’; అంటే ఆయనకు నచ్చినది చేయడానికి.'
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘షిమీ యొర్దాను నదిని దాటుతున్నప్పుడు’; హీబ్రూలో ‘అతడు’ ఎవరిని సూచిస్తుందో స్పష్టంగా లేదు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: పడవ
  rationale: ఈ సందర్భంలో నదిని దాటించడానికి ఉపయోగించే సాధనాన్ని ఈ నామవాచకం సూచిస్తుంది. ఆధునిక తెలుగులో ‘పడవ’ సహజంగా, స్పష్టంగా ఉంటుంది; ఖచ్చితమైన పడవ రకం మూలపాఠంలో నిర్ధారితం కానందున మరింత నిర్దిష్ట పదాన్ని వాడలేదు.
- source_word: וְעָבְרָה
  choice: దాటివచ్చింది
  rationale: స్త్రీలింగ ఏకవచన క్రియ הָעֲבָרָהతో సరిపోతుంది. కథనంలో పడవ నదిని దాటి రాజువైపు వచ్చిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: రాజు పరివారాన్ని అవతలి ఒడ్డుకు చేర్చడానికి
  rationale: హిఫీల్ క్రియలోని ‘దాటించు’ భావాన్ని, సందర్భానికి అవసరమైన గమ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది. בֵּית הַמֶּלֶךְ ఇక్కడ భవనాన్ని కాక రాజుతో సంబంధమున్న ప్రజలను సూచిస్తుంది.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: ఆయనకు నచ్చినది చేయడానికి
  rationale: అక్షరార్థంగా ‘ఆయన కళ్లలో మంచిదైనది చేయడానికి’ అనే హీబ్రూ నుడికారానికి ఇది సహజ తెలుగు సమానార్థకం.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుట సాగిలపడ్డాడు
  rationale: ఇక్కడి చర్య వినయపూర్వకమైన విన్నపం లేదా లోబడుటను సూచిస్తుంది. ‘సాగిలపడ్డాడు’ శారీరక భంగిమనూ సందర్భార్థాన్నీ సంక్షిప్తంగా అందిస్తుంది.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: రాజు యొర్దాను నదిని దాటుతున్నప్పుడు
  rationale: సమీప సందర్భంలో రాజే ప్రయాణానికి కేంద్రంగా ఉన్నందున సర్వనామాన్ని ‘రాజు’గా స్పష్టం చేశాం. అయితే హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా షిమీని కూడా సూచించగలదు; ఆ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: בְּעָבְרוֹలోని కర్త ఎవరు?
  choice: రాజు యొర్దాను నదిని దాటుతున్నప్పుడు
  alternative: షిమీ యొర్దాను నదిని దాటుతున్నప్పుడు
  rationale: కథన దృష్టి రాజు దాటడంపైనే ఉండటం, ‘రాజు ఎదుట’ అన్న సమీప ప్రస్తావన ఈ పఠనానికి మద్దతిస్తాయి. అయినా మూలంలోని పురుష ఏకవచన ప్రత్యయం పేరును నిర్దిష్టంగా చెప్పదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘పరివారం,’ ‘సాగిలపడ్డాడు’ వంటి పదాలు సందర్భ గాంభీర్యాన్ని కాపాడుతూనే సాధారణ పాఠకులకు సుపరిచితంగా ఉంటాయి.
