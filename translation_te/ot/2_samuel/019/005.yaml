  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ֙ לָאַ֣ט אֶת פָּנָ֔י/ו וַ/יִּזְעַ֥ק הַ/מֶּ֖לֶךְ ק֣וֹל גָּד֑וֹל בְּנִ/י֙ אַבְשָׁל֔וֹם אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: te
  text: 'రాజు తన ముఖాన్ని కప్పుకున్నాడు[a]; రాజు బిగ్గరగా కేక వేశాడు: “నా కుమారుడా, అబ్షాలోమా! అబ్షాలోమా, నా కుమారుడా, నా కుమారుడా!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ముఖాన్ని చుట్టుకున్నాడు” లేదా “తన ముఖానికి ముసుగు వేసుకున్నాడు.” హెబ్రీయ క్రియ దుఃఖంలో ముఖాన్ని కప్పుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: కప్పుకొని
  rationale: ఈ క్రియ ఇక్కడ దుఃఖంలో ముఖాన్ని కప్పుకోవడాన్ని సూచిస్తుంది. ‘కప్పుకొని’ అనేది విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా సహజమైన ఆధునిక తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: פָּנָיו
  choice: తన ముఖాన్ని
  rationale: ప్రత్యక్ష కర్మ సూచికతోను దుఃఖసందర్భంలోని చర్యతోను ఇక్కడ ‘ముఖం’ అనే ప్రత్యక్ష అర్థమే ఉద్దేశించబడింది.
- source_word: וַיִּזְעַק
  choice: కేక వేసాడు
  rationale: ఈ క్రియ బిగ్గరగా వెలువడిన ఆర్తనాదాన్ని సూచిస్తుంది. ‘కేక వేసాడు’ తీవ్రతను నిలుపుతూ, కోపమా దుఃఖమా అని క్రియలోనే మరీ నిర్దిష్టం చేయదు; సందర్భం దానిని దుఃఖంగా తెలియజేస్తుంది.
- source_word: קוֹל גָּדוֹל
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరంతో’ అనే హెబ్రీయ భాషాప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘బిగ్గరగా’ అని అందించడం భావతీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: ఏకవచన పుంలింగ నామవాచకానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం కలిసిన రూపం. సంబోధనలో ‘నా కుమారుడా’ సంబంధాన్నీ భావోద్వేగాన్నీ ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: వ్యక్తినామాన్ని మూల హెబ్రీయ ఉచ్చారణకు దగ్గరగా, తెలుగులో స్థిరంగా చదవదగిన రూపంలో లిప్యంతరీకరించాం; వాక్యంలో సంబోధనార్థకంగా ‘అబ్షాలోమా’ వాడాం.
- source_word: repetition of אַבְשָׁלוֹם / בְּנִי
  choice: “నా కుమారుడా అబ్షాలోమా! అబ్షాలోమా, నా కుమారుడా, నా కుమారుడా!”
  rationale: మూలంలోని పునరుక్తి దావీదు తీవ్రమైన దుఃఖాన్ని వ్యక్తం చేస్తుంది. దానిని సరళీకరించకుండా పూర్తిగా నిలిపి, సహజ తెలుగు విలాపానికి తగిన విరామచిహ్నాలు వాడాం.
