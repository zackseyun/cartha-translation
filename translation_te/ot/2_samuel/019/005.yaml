translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి పాటించబడింది. రాజు దుఃఖతీవ్రతను తెలిపే పునరుక్తిని యథాతథంగా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
