id: 2SA.19.1
reference: 2 Samuel 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְגַּ֣ז הַ/מֶּ֗לֶךְ וַ/יַּ֛עַל עַל עֲלִיַּ֥ת הַ/שַּׁ֖עַר וַ/יֵּ֑בְךְּ וְ/כֹ֣ה אָמַ֣ר בְּ/לֶכְתּ֗/וֹ בְּנִ֤/י אַבְשָׁלוֹם֙ בְּנִ֣/י בְנִ֣/י אַבְשָׁל֔וֹם מִֽי יִתֵּ֤ן מוּתִ/י֙ אֲנִ֣י תַחְתֶּ֔י/ךָ אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: te
  text: 'అప్పుడు రాజు తీవ్రంగా కలతచెంది, ద్వారంపై ఉన్న మేడగదికి ఎక్కి వెళ్లి ఏడ్చాడు. అతడు వెళ్తూ ఇలా అన్నాడు: “నా కుమారుడా అబ్షాలోమా! నా కుమారుడా, నా కుమారుడా అబ్షాలోమా! నీకు బదులుగా నేనే చనిపోయి ఉంటే ఎంత బాగుండేది! అబ్షాలోమా, నా కుమారుడా, నా కుమారుడా!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: తీవ్రంగా కలతచెంది
  rationale: רגז శారీరకంగా వణకడం, ఉద్వేగానికి లోనవడం, తీవ్రంగా కలతచెందడం అనే భావాలను ఇవ్వగలదు. కుమారుని మరణవార్తపై రాజు పొందిన గాఢమైన భావోద్వేగ కుదుపును ఈ సందర్భంలో ‘తీవ్రంగా కలతచెంది’ సహజంగా తెలియజేస్తుంది.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: ద్వారంపై ఉన్న మేడగది
  rationale: עֲלִיָּה పై అంతస్తులోని గదిని సూచిస్తుంది; הַשַּׁעַרతో కలిసి ఇది నగర ద్వార నిర్మాణం పైనున్న గది అని అర్థమవుతుంది. ‘మేడగది’ ఆధునిక తెలుగులో ఆ నిర్మాణార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה దుఃఖంతో ఏడవడాన్ని నేరుగా సూచిస్తుంది. ‘ఏడ్చాడు’ సాధారణ పాఠకులకు సహజమైనదిగా ఉండి, సందర్భంలోని గంభీరతను నిలుపుతుంది.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: అతడు వెళ్తూ ఇలా అన్నాడు
  rationale: బెళెఖ్తో అనే కాలసూచక నిర్మాణాన్ని ‘వెళ్తూ’గా, כֹהను ‘ఇలా’గా ఉంచడం ద్వారా అతడు నడుస్తూనే పలికిన విలాపాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడా
  rationale: పదేపదే వచ్చే సంబోధన ఈ విలాపంలోని భావోద్వేగ తీవ్రతకు కేంద్రం. అందువల్ల ప్రతి పునరుక్తినీ తగ్గించకుండా నిలిపాం.
- source_word: מִי יִתֵּן
  choice: ఎంత బాగుండేది
  rationale: ‘ఎవరు ఇస్తారు?’ అనే పదశః రూపం ఇక్కడ కోరికను వ్యక్తపరిచే హీబ్రూ జాతీయ ప్రయోగం. గతానికి సంబంధించిన అసాధ్యమైన కోరికను ఆధునిక తెలుగులో ‘...ఉంటే ఎంత బాగుండేది!’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: నీకు బదులుగా నేనే చనిపోయి ఉంటే
  rationale: తాను కుమారుని స్థానంలో మరణించి ఉండాలనే రాజు యొక్క ప్రతివాస్తవిక కోరికను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది; אֲנִיలోని ‘నేను’ అనే నొక్కిచెప్పడాన్ని ‘నేనే’ నిలుపుతుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగు బైబిలు వాడుకకు అనుకూలమైన లిప్యంతరీకరణను ఎంచుకున్నాం; సంబోధనలో ‘అబ్షాలోమా’ అవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలిని ఉపయోగించాం. మూలంలోని ‘నా కుమారుడా’ అనే పునరుక్తులన్నిటినీ భావతీవ్రత కోసం యథాతథంగా నిలిపాం. ఈ వచనానికి అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత గమనిక లేదు.
