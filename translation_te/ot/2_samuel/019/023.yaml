review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves David''s rebuke, the familial address, the legal sense of judicial execution, and the rhetorical affirmation of his kingship. However, “ఎందుకు నిలుస్తున్నారు?” introduces an explicit “why” and the nuance of actively taking a stand, neither of which is expressed by the Hebrew. The Hebrew construction is better retained as a rhetorical question: “should you be adversaries to me today?”'
  naturalness: The Telugu is modern and clear. Revising the first two questions to “మీకూ నాకూ ఏమి సంబంధం?” and “మీరు ... విరోధులుగా ఉండాలా?” is both more idiomatic and closer to the Hebrew rhetorical sequence.
  terminology: “సెరూయా కుమారులారా,” “మరణశిక్ష విధించాలా,” and “ఇశ్రాయేలుమీద రాజు” are appropriate. The note correctly distinguishes the common noun שָׂטָן from the later proper name; it should avoid presenting “సాతానుగా” as an unqualified Telugu lexical equivalent and state the Hebrew expression directly.
  issues:
  - severity: medium
    issue: “ఎందుకు నిలుస్తున్నారు?” adds an explicit causal question and an extra action nuance.
    rationale: כִּי תִהְיוּ ... לְשָׂטָן is not “why are you standing against me?” It rhetorically challenges their being adversaries to David on that day.
  revised_text: దావీదు, “సెరూయా కుమారులారా, మీకూ నాకూ ఏమి సంబంధం? మీరు ఈ రోజు నాకు విరోధులుగా ఉండాలా?[a] ఈ రోజు ఇశ్రాయేలులో ఎవరికైనా మరణశిక్ష విధించాలా? ఈ రోజు నేను ఇశ్రాయేలుమీద రాజునని నాకు తెలియదా?” అన్నాడు.
