  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד מַה לִּ֤/י וְ/לָ/כֶם֙ בְּנֵ֣י צְרוּיָ֔ה כִּי תִֽהְיוּ לִ֥/י הַ/יּ֖וֹם לְ/שָׂטָ֑ן הַ/יּ֗וֹם י֤וּמַת אִישׁ֙ בְּ/יִשְׂרָאֵ֔ל כִּ֚י הֲ/ל֣וֹא יָדַ֔עְתִּי כִּ֥י הַ/יּ֖וֹם אֲנִי מֶ֥לֶךְ עַל יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: te
  text: దావీదు, “సెరూయా కుమారులారా, మీకూ నాకూ ఏమి సంబంధం? మీరు ఈ రోజు నాకు విరోధులుగా ఉండాలా?[a] ఈ రోజు ఇశ్రాయేలులో ఎవరికైనా మరణశిక్ష విధించాలా? ఈ రోజు నేను ఇశ్రాయేలుమీద రాజునని నాకు తెలియదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “నాకు శాతానుగా”; అంటే “నాకు విరోధిగా” లేదా “నాకు ప్రత్యర్థిగా.” ఇక్కడ శాతాను అనేది ప్రత్యేక నామం కాదు; విరోధి అనే అర్థంలోని సాధారణ నామవాచకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: మీతో నాకు ఏమి పని?
  rationale: ఇది సంబంధాన్ని నిరాకరిస్తూ మందలించే హెబ్రీ నానుడి. తెలుగు పాఠకులకు సహజంగా ఉండేలా దాని తీవ్రతను నిలిపింది.
- source_word: בְּנֵי צְרוּיָה
  choice: సెరూయా కుమారులారా
  rationale: యోవాబు, అబీషైలను ఉద్దేశించిన ప్రత్యక్ష సంబోధనను, కుటుంబ సంబంధాన్ని యథాతథంగా నిలిపింది.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: ఈ రోజు మీరు నాకు విరోధులుగా ఎందుకు నిలుస్తున్నారు?
  rationale: שָׂטָן ఇక్కడ ప్రత్యేక నామం కాదు; అడ్డుకునే విరోధి అనే సాధారణ నామవాచకం. తెలుగు వాక్యంలో మందలింపు భావం సహజంగా వ్యక్తమయ్యేలా ప్రశ్నారూపాన్ని ఉపయోగించింది.
- source_word: יוּמַת אִישׁ
  choice: ఎవరికైనా మరణశిక్ష విధించాలా?
  rationale: కేవలం మరణించడం కాక, అధికారపూర్వకంగా చంపబడడం అనే హోఫాల్ రూపంలోని న్యాయపరమైన భావాన్ని తెలియజేస్తుంది; אִישׁ యొక్క సందర్భానుగుణ సాధారణార్థాన్ని ‘ఎవరికైనా’గా అందించింది.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: నాకు తెలియదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే హెబ్రీ అలంకారప్రశ్న రూపాన్ని నిలిపింది.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజును
  rationale: עַל అనే విభక్తి సూచించే ‘మీద/పైగా’ అనే పాలనా అధికార భావాన్ని నిలిపింది.
theological_decisions:
- issue: שָׂטָן అనే పదం యొక్క భావం
  choice: సాధారణ నామవాచకంగా ‘విరోధులు’
  alternative: ‘సాతాను’ అనే ప్రత్యేక నామం
  rationale: ఈ చారిత్రక కథనంలో ఈ పదం దావీదును అడ్డుకునే సెరూయా కుమారులను సూచిస్తుంది. దీనిని ‘సాతాను’ అనే ప్రత్యేక నామంగా అనువదించడం సందర్భం సమర్థించని తరువాతి దయ్యశాస్త్ర భావాన్ని పాఠ్యంలోకి తెస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. దావీదు మందలింపులోని తీవ్రతను, రెండు అలంకారప్రశ్నలను, న్యాయపరమైన మరణదండన భావాన్ని నిలిపాం.
