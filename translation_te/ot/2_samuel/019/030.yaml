id: 2SA.19.30
reference: 2 Samuel 19:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה תְּדַבֵּ֥ר ע֖וֹד דְּבָרֶ֑י/ךָ אָמַ֕רְתִּי אַתָּ֣ה וְ/צִיבָ֔א תַּחְלְק֖וּ אֶת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: te
  text: అప్పుడు రాజు అతనితో, “నీ విషయాల గురించి ఇంకా ఎందుకు మాట్లాడుతున్నావు? నేను నిర్ణయించాను:[a] నువ్వూ సీబా భూమిని[b] పంచుకోవాలి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత పదశః, “నేను చెప్పాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొలాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: ప్రత్యక్ష ప్రశ్నార్థక పదానికి సరళమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: תְּדַבֵּר עוֹד
  choice: ఇంకా ఎందుకు మాట్లాడుతున్నావు?
  rationale: עוֹד తదుపరి లేదా కొనసాగుతున్న మాటను సూచిస్తుంది; ఈ రూపం రాజు ఇక చర్చను కొనసాగించదలచుకోలేదనే స్వరాన్ని అతిశయించకుండా వ్యక్తం చేస్తుంది.
- source_word: דְּבָרֶיךָ
  choice: నీ విషయాల గురించి
  rationale: דבר అంటే ‘మాటలు,’ ‘విషయాలు,’ లేదా ‘వ్యవహారాలు’ కావచ్చు. ఈ వివాద సందర్భంలో ‘నీ విషయాలు’ సహజంగా ఉండి, ‘నీ వాదన’ అనే మరింత న్యాయపరమైన వ్యాఖ్యానాన్ని రుద్దదు.
- source_word: אָמַרְתִּי
  choice: నేను నిర్ణయించాను
  rationale: పదశః ‘నేను చెప్పాను’; సందర్భంలో అది రాజు ప్రకటించిన స్థిరమైన తీర్పుగా పనిచేస్తుంది. పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אַתָּה וְצִיבָא
  choice: నువ్వూ సీబా
  rationale: సంబోధించబడుతున్న మెఫీబోషెతును సూచించే సర్వనామాన్ని నిలిపి, Ziba పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న ‘సీబా’ రూపాన్ని వాడాం.
- source_word: תַּחְלְקוּ
  choice: పంచుకోవాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం రాజు ఇచ్చిన అధికారపూర్వక తీర్పు లేదా ఆదేశాన్ని తెలియజేస్తుంది; ‘పంచుకోవాలి’ ఆధునిక తెలుగులో ఆ నిర్దేశక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: הַשָּׂדֶה
  choice: భూమిని
  rationale: పదశః ‘పొలం’; ఆస్తి వివాద సందర్భంలో ఇది భూసంపదను సమష్టిగా సూచించగలదు. ‘భూమి’ సందర్భానికి సరిపడే విస్తృత అర్థాన్ని ఇస్తుంది; పదశః రూపం పాదటిప్పణిలో ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజు మాటలోని అసహనం మరియు తీర్పు యొక్క అధికారపూర్వక స్వరం నిలిచేలా చూశాం; మూలంలోని పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో భద్రపరిచాం.
