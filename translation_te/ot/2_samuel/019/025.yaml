translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని శరీర సంరక్షణకు సంబంధించిన మొదటి ప్రయోగం అస్పష్టంగా ఉన్నందున ప్రధాన పాఠ్యంలో విస్తృతార్థాన్ని ఉంచి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం. కాలవాక్యాన్ని తెలుగులో స్పష్టత కోసం ముందుకు తీసుకువచ్చినా, మూలంలోని సంఘటనల సంబంధాన్ని మార్చలేదు.
