  text: וּ/מְפִבֹ֨שֶׁת֙ בֶּן שָׁא֔וּל יָרַ֖ד לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וְ/לֹא עָשָׂ֨ה רַגְלָ֜י/ו וְ/לֹא עָשָׂ֣ה שְׂפָמ֗/וֹ וְ/אֶת בְּגָדָי/ו֙ לֹ֣א כִבֵּ֔ס לְ/מִן הַ/יּוֹם֙ לֶ֣כֶת הַ/מֶּ֔לֶךְ עַד הַ/יּ֖וֹם אֲשֶׁר בָּ֥א בְ/שָׁלֽוֹם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: te
  text: సౌలు కుమారుడైన మెఫీబోషెతు రాజును కలుసుకోవడానికి దిగి వచ్చాడు. రాజు వెళ్లిన రోజు మొదలుకొని అతడు క్షేమంగా వచ్చిన రోజు వరకు[c] మెఫీబోషెతు తన పాదాలను సంరక్షించుకోలేదు[a], మీసం కత్తిరించుకోలేదు[b], బట్టలు ఉతుకుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన పాదాలను చేయలేదు.” ఇది పాదాలకు సాధారణంగా చేసే శుభ్రత లేదా సంరక్షణను నిర్లక్ష్యం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీసాన్ని సంరక్షించుకోలేదు.” హీబ్రూ పదం మొత్తం గడ్డాన్ని కాక, ప్రత్యేకంగా పైపెదవి వద్దనున్న వెంట్రుకల ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అతడు శాంతితో వచ్చిన రోజు వరకు” లేదా “అతడు క్షేమంగా చేరిన రోజు వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: దిగి వచ్చాడు
  rationale: క్రియకు ఉన్న ‘దిగివచ్చాడు/దిగివెళ్లాడు’ అనే దిశార్థాన్ని నిలుపుతూ, రాజును సమీపిస్తున్న కథన దృష్టికోణానికి ‘దిగి వచ్చాడు’ సహజంగా సరిపోతుంది.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: రాజును కలుసుకోవడానికి
  rationale: ఎదురుగా వెళ్లి ఒకరిని కలుసుకోవడం అనే హీబ్రూ ప్రయోగార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: తన పాదాల సంరక్షణ చేసుకోలేదు
  rationale: అక్షరార్థంగా ‘తన పాదాలను చేయలేదు’ అని ఉన్నా, ఏ నిర్దిష్ట శుభ్రత లేదా అలంకరణ చర్య ఉద్దేశించబడిందో స్పష్టం కాదు. అందువల్ల అస్పష్టతను కాపాడే విస్తృత ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: మీసం కత్తిరించుకోలేదు
  rationale: שָׂפָם పైపెదవి వద్దనున్న వెంట్రుకలను సూచిస్తుంది; మొత్తం గడ్డాన్ని సూచించే పదాన్ని చేర్చకుండా, సందర్భంలోని శరీర సంరక్షణ నిర్లక్ష్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: బట్టలు ఉతుకుకోలేదు
  rationale: వస్త్రాలను కడగడం అనే క్రియకు ఇది స్పష్టమైన, సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: రాజు వెళ్లిన రోజు మొదలుకొని
  rationale: రాజు ప్రయాణం మొదలైన కాలబిందువును మూలంలోని సాధారణ రిజిస్టర్‌తోనే తెలుపుతుంది.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: అతడు క్షేమంగా తిరిగి వచ్చిన రోజు వరకు
  rationale: בְשָׁלוֹם లోని సురక్షితమైన, ప్రశాంతమైన రాక భావాన్ని ‘క్షేమంగా’ తెలియజేస్తుంది. సందర్భం తిరిగి రావడాన్ని సూచిస్తున్నందున ‘తిరిగి వచ్చిన’ సహజంగా ఉంది; ‘ఇంటికి’ అనే మూలంలో లేని అంశాన్ని చేర్చలేదు.
