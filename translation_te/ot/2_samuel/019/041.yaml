translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలో చివరి క్రియ రెండు సమూహాలకూ వర్తిస్తున్నందున, తెలుగులో స్పష్టత కోసం ‘ఆయనను దాటించారు’ అని రెండోసారి వ్యక్తం చేయబడింది.
