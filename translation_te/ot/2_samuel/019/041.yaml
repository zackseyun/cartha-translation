source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר הַ/מֶּ֨לֶךְ֙ הַ/גִּלְגָּ֔לָ/ה וְ/כִמְהָ֖ן עָבַ֣ר עִמּ֑/וֹ וְ/כָל עַ֤ם יְהוּדָה֙ ו/יעברו אֶת הַ/מֶּ֔לֶךְ וְ/גַ֕ם חֲצִ֖י עַ֥ם יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: te
  text: అప్పుడు రాజు గిల్గాలుకు దాటి వెళ్లాడు; కింహాము అతనితో కలిసి దాటి వెళ్లాడు. యూదా ప్రజలందరూ రాజును దాటి తీసుకువెళ్లారు[a], ఇశ్రాయేలు ప్రజల్లో సగం మంది కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజును అవతలికి తోడ్కొని వెళ్లారు.” ఈ సందర్భంలో ప్రత్యక్ష కర్మతో ఉన్న హీబ్రూ క్రియ రాజును దాటించి తీసుకువెళ్లడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: దాటివెళ్లాడు
  rationale: עבר అనే క్రియ ఇక్కడ యొర్దాను నదిని దాటడాన్ని సూచిస్తుంది. ‘దాటివెళ్లాడు’ కదలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַגִּלְגָּלָה
  choice: గిల్గాలుకు
  rationale: స్థలనామానికి జోడించిన దిశార్థక ה, గిల్గాలు వైపు కదలికను సూచిస్తుంది; తెలుగులో ‘గిల్గాలుకు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְכִמְהָן
  choice: కింహాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా అందించాం.
- source_word: עָבַר עִמּוֹ
  choice: అతనితో కలిసి దాటివెళ్లాడు
  rationale: ముందటి עבר క్రియతో ఉన్న కథన సంబంధాన్ని నిలుపుతూ, సహవాసాన్ని తెలిపే עִמּוֹను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכָל עַם יְהוּדָה
  choice: యూదా ప్రజలందరూ
  rationale: యూదాకు చెందిన ప్రజాసమూహాన్ని సంక్షిప్తంగా, స్పష్టంగా సూచించే ఆధునిక తెలుగు రూపం.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: రాజును అవతలికి దాటించారు
  rationale: ప్రత్యక్ష కర్మతో వచ్చిన עבר క్రియకు ఇక్కడ కారణార్థక భావం ఉంది. ‘దాటించారు’ ఆ వ్యాకరణ భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘అవతలికి’ నది దాటడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְגַם
  choice: కూడా
  rationale: మరొక సమూహాన్ని చేర్చే అదనపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల్లో సగం మంది
  rationale: యూదా ప్రజలతో రాజకీయంగా వేరుగా ప్రస్తావించిన ఇశ్రాయేలు ప్రజల్లో సగం మందిని పరిమాణాత్మకంగా, అతివ్యాఖ్యానం లేకుండా సూచిస్తుంది.
