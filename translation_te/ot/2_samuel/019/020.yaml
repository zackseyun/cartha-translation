source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/מֶּ֗לֶךְ אַל יַחֲשָׁב לִ֣/י אֲדֹנִ/י֮ עָוֺן֒ וְ/אַל תִּזְכֹּ֗ר אֵ֚ת אֲשֶׁ֣ר הֶעֱוָ֣ה עַבְדְּ/ךָ֔ בַּ/יּ֕וֹם אֲשֶׁר יָׄצָ֥ׄאׄ אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ מִ/ירֽוּשָׁלִָ֑ם לָ/שׂ֥וּם הַ/מֶּ֖לֶךְ אֶל לִבּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: te
  text: 'అతడు రాజుతో ఇలా అన్నాడు: “నా ప్రభువు నన్ను దోషిగా లెక్కించవద్దు[a]. నా ప్రభువైన రాజు యెరూషలేము నుండి బయలుదేరిన రోజున నీ సేవకుడు చేసిన తప్పును జ్ఞాపకం చేసుకోవద్దు; రాజు దానిని మనసులో పెట్టుకోవద్దు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా దోషాన్ని నా మీద మోపవద్దు”; హీబ్రూ నుడికారం అక్షరార్థంగా న్యాయపరమైన లెక్కింపు రూపంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “దానిని తన హృదయంపై ఉంచడం”; అంటే దానిని తీవ్రంగా పరిగణించడం లేదా తనకు వ్యతిరేకంగా మనసులో పెట్టుకోవడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: నా దోషాన్ని నాకు లెక్కించవద్దు
  rationale: హీబ్రూ న్యాయపరమైన ‘దోషాన్ని ఒకరి ఖాతాలో లెక్కించడం’ అనే రూపాన్ని తెలుగులో అర్థమయ్యేలా నిలుపుతుంది; కేవలం ‘నన్ను దోషిగా ఎంచవద్దు’ కంటే మూలంలోని నిర్మాణానికి దగ్గరగా ఉంది.
- source_word: עָוֺן
  choice: దోషం
  rationale: ఈ సందర్భంలో అపరాధం మరియు దాని వల్ల కలిగే బాధ్యత రెండింటినీ సూచించగల సాధారణ, గంభీరమైన పదం.
- source_word: תִּזְכֹּר
  choice: జ్ఞాపకం చేసుకోవద్దు
  rationale: మూలంలోని సాధారణ ‘జ్ఞాపకం చేసుకొను’ క్రియను కాపాడుతూ, దానిని తనకు వ్యతిరేకంగా గుర్తుంచుకోవద్దనే సందర్భార్థాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: הֶעֱוָה
  choice: చేసిన తప్పు
  rationale: తప్పుగా లేదా వక్రంగా ప్రవర్తించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: రాజు ఎదుట వినయపూర్వకంగా తనను తాను సంబోధించుకునే ఆస్థాన భాషను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: యెరూషలేము నుండి బయలుదేరిన
  rationale: నగరాన్ని విడిచి వెళ్లడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తూ హీబ్రూ కదలికను కాపాడుతుంది.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: మనసులో పెట్టుకోవద్దు
  rationale: ‘హృదయంపై ఉంచడం’ అనే హీబ్రూ నుడికారానికి సహజ తెలుగు సమానం; విషయాన్ని తీవ్రంగా పరిగణించడం లేదా తనకు వ్యతిరేకంగా నిలుపుకోవడం అనే భావాన్ని అందిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలోని పునరుక్తిని, ఆస్థాన సందర్భాన్ని కాపాడుతుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: ఇక్కడ ఇది దేవుని నామం కాదు; రాజుకు ఇచ్చే గౌరవపూర్వక సంబోధన. స్వామ్యసూచక రూపాన్ని కూడా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. ‘నా ప్రభువు,’ ‘నీ సేవకుడు’ అనే రూపాలు రాజాస్థాన వినయాన్ని నిలుపుతాయి. న్యాయపరమైన లెక్కింపు నుడికారాన్ని ప్రధాన పాఠ్యంలో కొంత రూపసామ్యంతో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో వివరించాం.
