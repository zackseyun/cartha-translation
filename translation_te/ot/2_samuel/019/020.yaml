- from: 'అతడు రాజుతో[a] ఇలా అన్నాడు: “నా ప్రభువు నా దోషాన్ని నాకు లెక్కించవద్దు. నా ప్రభువైన రాజు యెరూషలేము నుండి బయలుదేరిన రోజున నీ సేవకుడు చేసిన తప్పును జ్ఞాపకం చేసుకోవద్దు; రాజు దానిని మనసులో పెట్టుకోవద్దు[b].”'
  to: 'అతడు రాజుతో ఇలా అన్నాడు: “నా ప్రభువు నన్ను దోషిగా లెక్కించవద్దు[a]. నా ప్రభువైన రాజు యెరూషలేము నుండి బయలుదేరిన రోజున నీ సేవకుడు చేసిన తప్పును జ్ఞాపకం చేసుకోవద్దు; రాజు దానిని మనసులో పెట్టుకోవద్దు[b].”'
  rationale: పాదటిప్పణి aను అది వివరిస్తున్న న్యాయపరమైన లెక్కింపు విన్నపానికి తరలించాం. మొదటి వాక్యాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించేలా ‘నన్ను దోషిగా లెక్కించవద్దు’గా సవరించాం; పాదటిప్పణి మూలంలోని అక్షరార్థ లెక్కింపు రూపాన్ని కొనసాగిస్తుంది. మిగిలిన పాఠ్యం మూల భావానికీ ఆస్థాన-వినయ రిజిస్టర్‌కీ తగినదిగా ఉంది.
