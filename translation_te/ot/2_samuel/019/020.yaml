    rationale: ‘నా దోషాన్ని నాకు లెక్కించవద్దు’ మూల నిర్మాణానికి దగ్గరగా ఉన్నప్పటికీ, ‘నన్ను దోషిగా లెక్కించవద్దు’ మరింత సహజమైన ఆధునిక తెలుగు; దోషాన్ని లెక్కించడమనే మూల భావాన్ని పాదటిప్పణి స్పష్టపరుస్తుంది.
