  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: te
  text: 'యోవాబుకు ఇలా సమాచారం అందింది: “ఇదిగో, రాజు అబ్షాలోము కోసం ఏడుస్తూ దుఃఖిస్తున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: సమాచారం అందింది
  rationale: נגד క్రియ యొక్క హొఫాల్ రూపం సమాచారాన్ని తెలియజేయడం అనే కర్మణి భావాన్ని ఇస్తుంది. ఎవరు తెలిపారో పేర్కొనకుండా, ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: לְיוֹאָב
  choice: యోవాబుకు
  rationale: לְ ఉపసర్గలోని గ్రహీత భావాన్ని తెలుగు సంప్రదాన విభక్తితో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వార్తలోని విషయంపై వెంటనే దృష్టి నిలిపే సూచనార్థక అవ్యయ భావాన్ని గౌరవప్రదమైన, ప్రస్తుత తెలుగులో నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూ పాఠంలో దావీదు పేరు కాక బిరుదే ఉన్నందున దానినే అనువదిస్తుంది.
- source_word: בֹּכֶה
  choice: ఏడుస్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న క్రియను, తరువాతి దుఃఖక్రియతో సహజంగా సమన్వయిస్తుంది.
- source_word: וַיִּתְאַבֵּל
  choice: దుఃఖిస్తున్నాడు
  rationale: אבל హిత్పయేల్ రూపం మరణం లేదా నష్టాన్ని బట్టి దుఃఖించడం అనే భావాన్ని ఇస్తుంది; తెలుగు వర్తమాన కొనసాగింపు రూపం నివేదికలో వర్ణించిన స్థితిని స్పష్టం చేస్తుంది.
- source_word: עַל אַבְשָׁלֹם
  choice: అబ్షాలోము కోసం
  rationale: దుఃఖానికి వ్యక్తిని విషయంగా/కారణంగా సూచించే עַל భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘కోసం’ ఇక్కడ అతని నిమిత్తంగా దుఃఖించడం అనే అర్థంలో ఉంది.
