translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. హీబ్రూలోని కర్మణి నివేదిక భావం, הִנֵּה యొక్క దృష్టి ఆకర్షణ, రాజు చేస్తున్న కొనసాగుతున్న రెండు చర్యలు నిలుపబడ్డాయి. పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
