id: 2SA.19.22
reference: 2 Samuel 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: te
  text: 'అప్పుడు సెరూయా కుమారుడు అబీషై ఇలా జవాబిచ్చాడు: “షిమీ యెహోవా అభిషిక్తుణ్ణి శపించినందుకు అతనికి మరణశిక్ష విధించకూడదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీని కారణంగా” / “దీనికి ప్రతిఫలంగా.” ఈ హీబ్రూ ప్రయోగం ఈ చర్యవల్ల షిమీకి మరణశిక్ష విధించాలా అని అడుగుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలోని రెండు మాటల క్రియలను సహజమైన ఆధునిక తెలుగులో ఒకే ప్రవాహవంతమైన వాక్యంగా అందిస్తుంది; ప్రత్యుత్తర భావాన్ని నిలుపుతుంది.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు అబీషై
  rationale: హీబ్రూ గుర్తింపును, పేర్లను తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: הֲתַחַת זֹאת
  choice: దీనికి
  rationale: ఈ హీబ్రూ ప్రయోగం ‘దీని కారణంగా/దీనికి ప్రతిఫలంగా’ అనే శిక్షాత్మక కారణార్థాన్ని సూచిస్తుంది; తెలుగు ప్రశ్నలో ‘దీనికి’ సహజంగా ఉంటుంది.
- source_word: לֹא יוּמַת
  choice: అతనికి మరణశిక్ష విధించకూడదా?
  rationale: מות యొక్క హోఫల్ రూపం కేవలం చనిపోవడాన్ని కాక, అతన్ని చంపించడం లేదా న్యాయపరంగా మరణానికి గురిచేయడాన్ని సూచిస్తుంది. ‘మరణశిక్ష విధించు’ ఆ న్యాయపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరుకు సరళమైన తెలుగు లిప్యంతరీకరణ.
- source_word: כִּי
  choice: కాబట్టి
  rationale: షిమీకి మరణశిక్ష విధించాలనే ప్రతిపాదనకు తరువాతి వాక్యం కారణాన్ని ఇస్తోంది; తెలుగు వాక్యక్రమంలో ‘కాబట్టి’ ఆ కారణ-ఫల సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קִלֵּל
  choice: శపించాడు
  rationale: షిమీ దావీదును దూషిస్తూ పలికిన శాపవాక్యాల తీవ్రతను నిలుపుతుంది.
- source_word: מְשִׁיחַ יְהוָה
  choice: యెహోవా అభిషిక్తుణ్ణి
  rationale: యెహోవా చేత అభిషేకించబడిన రాజును సూచించే నిర్మాణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది. ఆధునిక తెలుగు బైబిల్ వాడుకలో ‘యెహోవా’ విస్తృతంగా గుర్తించదగిన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: מְשִׁיחַ అనే పదంలోని రాజపదవి భావం
  choice: అభిషిక్తుడు
  alternative: అభిషేకించబడినవాడు
  rationale: ఇక్కడి పదం దావీదు రాజుగా యెహోవా చేత నియమించబడిన స్థితిని సూచిస్తుంది; తరువాతి మెస్సీయ సంబంధిత భావాన్ని బలవంతంగా చొప్పించకుండా మూల పదవీ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. న్యాయపరమైన మరణదండన భావాన్ని స్పష్టంగా ఉంచుతూ, ప్రశ్నలోని వాక్చాతుర్యాన్ని మరియు ‘యెహోవా అభిషిక్తుడు’ అనే ధార్మిక-రాజకీయ పదబంధాన్ని నిలిపింది.
