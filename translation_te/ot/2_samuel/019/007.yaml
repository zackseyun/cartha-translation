id: 2SA.19.7
reference: 2 Samuel 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: te
  text: నిన్ను ద్వేషించేవారిని ప్రేమించడానికీ, నిన్ను ప్రేమించేవారిని ద్వేషించడానికీ. సేనాధిపతులూ సేవకులూ నీకు లేనట్టేనని ఈ రోజు స్పష్టం చేశావు[a]. అబ్షాలోము బ్రతికి ఉండి, మేమంతా ఈ రోజు చనిపోయి ఉంటే, అది నీ దృష్టిలో సరైనదిగా ఉండేదని ఈ రోజు నాకు తెలుసు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీకు సేనాధిపతులూ సేవకులూ లేరని ఈ రోజు ప్రకటించావు.” అంటే, నీ దృష్టిలో వారికి ఏ విలువా లేదన్నట్టుగా ప్రవర్తించావని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అబ్షాలోము మాత్రమే బ్రతికి ఉండి, మేమంతా ఈ రోజు చనిపోయి ఉంటే బాగుండేది.” ఇవి దావీదు నిజంగా పలికిన మాటలు కావు; యోవాబు చేసిన తీవ్రమైన ప్రతివాస్తవ ఆరోపణ.
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: నిన్ను ద్వేషించేవారిని ప్రేమిస్తూ, నిన్ను ప్రేమించేవారిని ద్వేషిస్తున్నావు
  rationale: రెండు కర్తృవాచక క్రియారూపాల మాటల బలాన్ని, ప్రేమించడం–ద్వేషించడం అనే వ్యతిరేక సమాంతరతను నిలుపుతూ, ముందున్న సందర్భంతో కలిసే సహజమైన తెలుగు నిందారూపంగా అనువదించబడింది.
- source_word: הִגַּדְתָּ הַיּוֹם
  choice: ఈ రోజు స్పష్టం చేశావు
  rationale: దావీదు మాటలతో చెప్పాడని కాక, అతని ప్రవర్తన ద్వారా తన వైఖరిని బహిర్గతం చేశాడనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: שָׂרִים וַעֲבָדִים
  choice: సేనాధిపతులూ సేవకులూ
  rationale: యుద్ధానంతర రాజసైనిక సందర్భంలో שָׂרִים అనేది నాయకులకన్నా సేనాధిపతులను సూచించడం సహజం; עֲבָדִים రాజసేవలో ఉన్నవారిని విస్తృతంగా సూచిస్తుంది.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: సేనాధిపతులూ సేవకులూ నీకు లేనట్టే
  rationale: వారు నిజంగా లేరని కాక, దావీదు దృష్టిలో వారికి విలువ లేనట్టుగా అతని ప్రవర్తన ఉందనే గద్దింపు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָדַעְתִּי הַיּוֹם
  choice: ఈ రోజు నాకు తెలిసింది
  rationale: యోవాబు ఆ రోజు జరిగినదానిని బట్టి తాను చేరుకున్న కఠినమైన నిర్ధారణను తెలియజేస్తుంది.
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: నీ దృష్టికి సరైనదిగా
  rationale: ‘నీ కళ్లలో సరైనది’ అనే హీబ్రూ నుడికారంలోని నైతిక మూల్యాంకన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అబ్షాలోము బ్రతికి, దావీదు అనుచరులందరూ చనిపోయిన పరిస్థితి
  choice: వాస్తవానికి విరుద్ధమైన షరతుగా అనువదించడం
  alternative: ‘అబ్షాలోము బతికి ఉండి, మేమంతా చనిపోయి ఉంటే బాగుండేది’ అనే కోరికరూపం
  rationale: సందర్భంలో ఇది దావీదు పలికిన మాటల నివేదిక కాదు; యోవాబు చేసిన తీవ్రమైన ప్రతివాస్తవ ఆరోపణ. ప్రధాన పాఠం షరతు భావాన్ని ఉంచగా, కోరిక ఛాయను పాదటిప్పణిలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యోవాబు గద్దింపులోని నేరుగా తాకే వ్యతిరేక సమాంతరతను, రాజసైనిక సందర్భాన్ని, హీబ్రూ నుడికారాన్ని నిలుపుతూ అవసరమైన చోట పాదటిప్పణులు ఇచ్చాం.
