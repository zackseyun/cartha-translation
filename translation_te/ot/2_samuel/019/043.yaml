  text: וַ/יַּעַן֩ כָּל אִ֨ישׁ יְהוּדָ֜ה עַל אִ֣ישׁ יִשְׂרָאֵ֗ל כִּֽי קָר֤וֹב הַ/מֶּ֨לֶךְ֙ אֵלַ֔/י וְ/לָ֤/מָּה זֶּה֙ חָרָ֣ה לְ/ךָ֔ עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה הֶ/אָכ֤וֹל אָכַ֨לְנוּ֙ מִן הַ/מֶּ֔לֶךְ אִם נִשֵּׂ֥את נִשָּׂ֖א לָֽ/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: te
  text: 'అప్పుడు యూదావారందరూ ఇశ్రాయేలువారికి[a] ఇలా జవాబిచ్చారు: “రాజు మాకు దగ్గరి బంధువు[b] కాబట్టి. ఈ విషయం గురించి మీకెందుకు కోపం వచ్చింది? మేమేమైనా రాజు సొమ్ముతో భోజనం చేశామా? లేక మాకు ఏదైనా కానుక అందించబడిందా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “యూదాలోని ప్రతి పురుషుడు ఇశ్రాయేలు పురుషునికి”; ఇక్కడ ఈ ఏకవచన పదాలు రెండు సమూహాలను సమష్టిగా సూచిస్తున్నాయి.
    reason: collective_singular
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “రాజు నాకు దగ్గరగా ఉన్నాడు”; ఇక్కడ కుటుంబ లేదా గోత్ర బంధుత్వమే భావమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: అప్పుడు ... జవాబిచ్చారు
  rationale: కథన క్రమంలో తదుపరి స్పందనను సూచించే wayyiqtol రూపాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: כָּל אִישׁ יְהוּדָה ... אִישׁ יִשְׂרָאֵל
  choice: యూదావారందరూ ఇశ్రాయేలువారికి
  rationale: హీబ్రూలో ఏకవచన రూపాలు ఉన్నప్పటికీ ఇక్కడ రెండు గోత్ర సమూహాలు సమష్టిగా మాట్లాడుతున్నాయి; తెలుగులో బహువచనం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: రాజు మాకు దగ్గరి బంధువు కాబట్టి
  rationale: సందర్భంలో קָרוֹב భౌగోళిక సమీపతకన్నా కుటుంబ లేదా గోత్ర బంధుత్వాన్ని సూచిస్తుంది.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి మీకెందుకు ఇంత కోపం వచ్చింది?
  rationale: חָרָה అనే ‘మండుట’ జాతీయాన్ని సహజమైన తెలుగు కోపవ్యక్తీకరణగా, הַדָּבָר הַזֶּהను ‘ఈ విషయం’గా అందిస్తుంది.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: మేమేమైనా రాజు సొమ్ముతో భోజనం చేశామా?
  rationale: infinitive absolute కలిగించే బలాన్ని ‘ఏమైనా’తో చూపుతూ, ‘రాజు నుండి తినడం’ అనే మాటను అతని ఖర్చుతో లాభం పొందడమనే సందర్భార్థంలో అందిస్తుంది.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: లేక మాకు ఏదైనా కానుక అందించబడిందా?
  rationale: కష్టమైన హీబ్రూ పాఠంలోని נשׂא రూపాల నిష్క్రియ/ఫలిత భావాన్ని నిలుపుతూ, సందర్భంలో సూచితమైన భౌతిక ప్రయోజనాన్ని ‘కానుక’గా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యూదా వాదనలో రాజుతో ఉన్న దగ్గరితనం
  choice: దగ్గరి బంధువు
  alternative: మాకు దగ్గరగా ఉన్నాడు
  rationale: ఇది ప్రత్యేక సిద్ధాంతార్థం కాదు; దావీదుతో యూదా గోత్రానికి ఉన్న బంధుత్వమే సందర్భంలో ప్రధాన భావం. అయినప్పటికీ మూలంలోని ‘దగ్గర’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: చివరి క్లాజులో పొందిన ప్రయోజనం
  choice: కానుక అందించబడిందా
  alternative: మాకు ఏదైనా ఇవ్వబడిందా
  rationale: మూలపాఠం వ్యాకరణపరంగా క్లిష్టమైనందున కర్తను ‘రాజు’గా నిర్ధారించకుండా నిష్క్రియ నిర్మాణం ద్వారా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. సమూహాల మధ్య సంభాషణ కావడంతో సహజ తెలుగు బహువచనాలు వాడబడ్డాయి. చివరి క్లాజులోని హీబ్రూ క్లిష్టతను అతిగా పరిష్కరించకుండా నిష్క్రియ రూపంలో నిలిపాం.
