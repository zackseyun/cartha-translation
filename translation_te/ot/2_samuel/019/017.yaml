  edition: WLC
  text: וַ/יְמַהֵ֗ר שִׁמְעִ֤י בֶן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אֲשֶׁ֖ר מִ/בַּֽחוּרִ֑ים וַ/יֵּ֨רֶד֙ עִם אִ֣ישׁ יְהוּדָ֔ה לִ/קְרַ֖את הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: te
  text: బహూరీము వాడైన బెన్యామీనీయుడు, గేరా కుమారుడు షిమీ త్వరపడి, యూదా మనుషులతో[a] కలిసి రాజైన దావీదును కలవడానికి దిగివచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘యూదా మనిషితో’; ఇక్కడ ఈ మాటను సమూహార్థకంగా ‘యూదా మనుషులతో’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: త్వరపడి
  rationale: ఈ క్రియ వేగాన్ని, ఆతురతను తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా కథన భావాన్ని నిలుపుతుంది.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: గేరా కుమారుడు షిమీ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: בֶּן הַיְמִינִי
  choice: బెన్యామీనీయుడు
  rationale: సందర్భంలో ఇది వ్యక్తి గోత్ర సంబంధాన్ని సూచించే జాతివాచకం; మరో పితృనామంగా తీసుకోలేదు.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: బహూరీము వాడైన
  rationale: షిమీ స్వస్థలాన్ని సూచించే సంబంధ వాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా ఇచ్చింది.
- source_word: וַיֵּרֶד
  choice: దిగివచ్చాడు
  rationale: భౌగోళికంగా కిందికి కదలడాన్ని తెలిపే హీబ్రూ క్రియ యొక్క స్పష్ట భావాన్ని నిలుపుతూ, కలుసుకోవడానికి వచ్చిన దిశను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִם אִישׁ יְהוּדָה
  choice: యూదా మనుషులతో
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నప్పటికీ ఇక్కడ సమూహార్థకంగా అర్థం చేసుకోవడం సందర్భానికి సరిపోతుంది; మూలంలోని రూపభేదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לִקְרַאת
  choice: ఎదుర్కోవడానికి
  rationale: ఇక్కడ శత్రుత్వార్థం కాదు; ముందుకు వెళ్లి రాజును కలుసుకోవడం లేదా స్వాగతించడం అనే కదలిక-సమాగమ భావాన్ని సూచిస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: బిరుదు మరియు పేరును ఆధునిక తెలుగు సహజ పదక్రమంలో ఉంచింది.
