id: 2SA.19.39
reference: 2 Samuel 19:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ אִתִּ/י֙ יַעֲבֹ֣ר כִּמְהָ֔ם וַ/אֲנִי֙ אֶעֱשֶׂה לּ֔/וֹ אֶת הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ וְ/כֹ֛ל אֲשֶׁר תִּבְחַ֥ר עָלַ֖/י אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: te
  text: అప్పుడు రాజు, “కింహాము నాతో కలిసి దాటిపోనివ్వండి. మీ దృష్టికి ఏది మంచిదనిపిస్తే, అది నేను అతనికోసం చేస్తాను; నాపై ఏ బాధ్యతను ఉంచాలని మీరు ఎంచుకున్నా, అది నేను మీకోసం చేస్తాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను ఏది అడిగినా, అది నేను మీకోసం చేస్తాను.” హీబ్రూ ప్రయోగం కొంత సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “నాపై మీరు ఏది ఎంచుకున్నా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని సూచిస్తుంది.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: కింహాము నాతో కలిసి నది దాటనివ్వు
  rationale: ఇక్కడ ఇంపర్‌ఫెక్ట్ జస్సివ్ భావంలో రాజు తీసుకున్న నిర్ణయాన్ని లేదా ఇచ్చిన ఆహ్వానాన్ని తెలియజేస్తుంది. సందర్భంలో యొర్దాను దాటడమే ఉద్దేశం కనుక తెలుగులో సహజమైన స్పష్టత కోసం ‘నది’ చేర్చబడింది.
- source_word: כִּמְהָם
  choice: కింహాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: నేను అతనికి చేస్తాను
  rationale: עשה అనే విస్తృతార్థక క్రియను, కింహాము మేలు కోసం రాజు చర్య తీసుకుంటాడనే సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా, మూలానికి దగ్గరగా ఉంచాం.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదనిపిస్తే అది
  rationale: ‘నీ కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారంలోని తీర్పు లేదా ఇష్ట భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, దృష్టి రూపకాన్ని నిలిపాం.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: నాపై నీవు ఏది ఉంచాలని కోరుకున్నా
  rationale: ‘నాపై’ అనే עלי పదాన్ని, స్వీకరించాల్సిన బాధ్యత భావాన్ని నిలుపుతూ అనువదించాం. హీబ్రూ ప్రయోగం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉన్నందున మరింత సహజమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: అది నీ కోసం చేస్తాను
  rationale: తెలుగులో వాక్యం సహజంగా ఉండేందుకు ముందటి అనిర్దిష్ట విషయాన్ని సూచించే ‘అది’ చేర్చి, బర్జిల్లయికి రాజు ఇచ్చిన వ్యక్తిగత హామీని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. రాజు బర్జిల్లయిని ఏకవచనంలో సంబోధిస్తున్నందున ‘నీ/నీవు’ రూపాలు వాడాం. మూలంలోని ‘దాటడం’ పదాన్ని నిలిపి, సందర్భ స్పష్టత కోసం ‘నది’ని చేర్చాం; సంక్షిప్తమైన హీబ్రూ చివరి ప్రయోగంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో కొంతవరకు నిలిపి, పాదటిప్పణిలో సహజమైన ప్రత్యామ్నాయాన్ని ఇచ్చాం.
