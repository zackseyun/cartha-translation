  naturalness: ‘నాపై నీవు ఏది ఉంచాలని కోరుకున్నా’ అనే ప్రయోగం ఆధునిక తెలుగులో సహజంగా లేదు. ‘నాపై ఏ బాధ్యతను ఉంచాలని మీరు ఎంచుకున్నా’ అనేది మూలంలోని అండర్‌స్పెసిఫికేషన్‌ను అతిగా విస్తరించకుండా స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది. బర్జిల్లయికి రాజు మాట్లాడుతున్న సందర్భంలో గౌరవార్థక ద్వితీయపురుష రూపాలు మరింత తగినవి.
