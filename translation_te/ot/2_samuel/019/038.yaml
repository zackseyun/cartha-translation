base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: te
  text: “నేను నా పట్టణంలో, నా తండ్రి తల్లి సమాధి దగ్గర చనిపోవడానికి దయచేసి నీ సేవకుడిని తిరిగి వెళ్లనివ్వు.[a] ఇదిగో, నీ సేవకుడైన కింహాము ఉన్నాడు. అతడు నా ప్రభువైన రాజుతో కలిసి దాటిపోనివ్వు. నీ దృష్టికి మంచిదనిపించినది అతనికి చేయి.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నా తండ్రి, నా తల్లి సమాధితో’ అని ఉంది. సందర్భంలో దీని భావం వారి సమాధి దగ్గర లేదా కుటుంబ సమాధి స్థలంలో ఉండడమని భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీకు ఏది మంచిదనిపిస్తే అది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא עַבְדְּךָ
  choice: దయచేసి నీ సేవకుడైన నన్ను తిరిగి వెళ్లనివ్వు
  rationale: שׁוּב తిరిగి వెళ్లడాన్ని సూచిస్తుంది; נָא విన్నపపు మర్యాదను తెలియజేస్తుంది. עַבְדְּךָ ఇక్కడ రాజుతో మాట్లాడుతున్న బర్జిల్లయి వినయపూర్వక స్వీయసూచన; అందువల్ల ‘సేవకుడు’ సహజంగా సరిపోతుంది.
- source_word: וְאָמֻת בְּעִירִי
  choice: నా సొంత పట్టణంలో ... నేను చనిపోతాను
  rationale: సంయోజకంతో కూడిన అసంపూర్ణ క్రియ ముందున్న అభ్యర్థనకు ఆశించిన ఫలితాన్ని తెలియజేస్తుంది. ‘సొంత పట్టణం’ అనేది మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: నా తండ్రి సమాధి, నా తల్లి సమాధి దగ్గర
  rationale: עִם యొక్క ప్రాథమిక అర్థం ‘తో/కలిసి’; అయితే కుటుంబ సమాధి సందర్భంలో స్థలసంబంధ భావం ఉద్దేశించబడింది. ‘దగ్గర’ సహజంగా ఆ భావాన్ని అందిస్తుంది; తండ్రి, తల్లి ఇద్దరినీ మూలంలోని విధంగానే విడిగా ఉంచుతుంది.
- source_word: וְהִנֵּה עַבְדְּךָ כִמְהָם
  choice: ఇదిగో, నీ సేవకుడైన కింహాము ఉన్నాడు
  rationale: הִנֵּה యొక్క ప్రత్యక్షంగా చూపించే భావాన్ని ‘ఇదిగో’ నిలుపుతుంది. כִמְהָם అనే పేరును తెలుగులో ‘కింహాము’గా లిప్యంతరీకరించాం.
- source_word: יַעֲבֹר עִם אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుతో కలిసి అతణ్ణి అవతలికి వెళ్లనివ్వు
  rationale: సందర్భంలో imperfectకు అభ్యర్థనాత్మక భావం ఉంది. ‘అవతలికి వెళ్లడం’ యొర్దాను దాటే కథన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నా ప్రభువైన రాజు’ రాజసభా గౌరవాన్ని నిలుపుతుంది.
- source_word: וַעֲשֵׂה לוֹ אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదో అది అతనికి చేయి
  rationale: עשה + ל యొక్క ‘అతని కొరకు చేయి’ భావాన్ని ‘అతనికి చేయి’ అందిస్తుంది. ‘నీ దృష్టికి మంచిది’ అనే రూపం మూలంలోని ‘నీ కళ్లలో మంచిది’ అనే నుడికారానికి దగ్గరగా ఉండి తెలుగులోనూ అర్థవంతంగా ఉంటుంది.
