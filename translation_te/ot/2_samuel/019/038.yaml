- from: “దయచేసి నీ సేవకుడైన నన్ను తిరిగి వెళ్లనివ్వు. నా సొంత పట్టణంలో, నా తండ్రి సమాధి, నా తల్లి సమాధి దగ్గర నేను చనిపోతాను.[a] ఇదిగో, నీ సేవకుడైన కింహాము ఉన్నాడు. నా ప్రభువైన రాజుతో కలిసి అతణ్ణి అవతలికి వెళ్లనివ్వు. నీ దృష్టికి ఏది మంచిదో అది అతనికి చేయి.[b]”
