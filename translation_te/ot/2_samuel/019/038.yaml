translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవభరితమైన రాజసభా సంభాషణగా మలిచాం. రాజును ఉద్దేశించిన ఏకవచన సంబోధనను మూలానికి అనుగుణంగా ఉంచి, ‘దయచేసి’ ద్వారా విన్నపపు మర్యాదను వ్యక్తం చేశాం. సమాధి స్థలానికి సంబంధించిన హీబ్రూ నుడికారంలోని స్వల్ప అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
