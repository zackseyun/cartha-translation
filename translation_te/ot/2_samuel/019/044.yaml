translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలితో రూపొందించబడింది. ప్రతినిధి వక్తల ఏకవచనాన్ని ప్రధాన సంభాషణలో నిలిపి, చివరి సమీక్షలోని సమూహార్థాన్ని బహువచనంగా వ్యక్తం చేసింది. మూలంలోని నుడికారాలను అర్థవంతంగా అనువదిస్తూ, సందిగ్ధ ప్రత్యామ్నాయాలను పాదసూచికల్లో భద్రపరిచింది.
