  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు ప్రతినిధి యూదా ప్రతినిధికి ఇలా జవాబిచ్చాడు: “రాజుపై నాకు పది వాటాల హక్కు ఉంది[a]; దావీదు విషయంలో కూడా నీకంటే నాకు ఎక్కువ హక్కు ఉంది[b]. అలాంటప్పుడు నన్నెందుకు చిన్నచూపు చూశావు? నా రాజును తిరిగి రప్పించాలనే మాట మొదట నాదే కాదా?[c]” అయితే ఇశ్రాయేలు వారి మాటలకంటే యూదా వారి మాటలు మరింత కఠినంగా ఉన్నాయి[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “రాజులో నాకు పది చేతులు.” ఇది పది భాగాలు లేదా వాటాలు ఉన్నాయని తెలిపే నుడికారం; బహుశా యూదాతో పోల్చితే ఉత్తరంలోని పది గోత్రాలకు ఉన్న హక్కును సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “దావీదు విషయంలో కూడా నీకంటే నాకు ఎక్కువ వాటా ఉంది.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉన్నా, తులనాత్మకమైన హక్కు లేదా వాటాను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నా రాజును తిరిగి రప్పించాలనే నా ప్రతిపాదనే మొదటిది కాదా?”
    reason: alternative_reading
  - marker: d
    text: లేదా, “ఇశ్రాయేలు వారి మాటలకంటే యూదా వారి మాటలు మరింత తీవ్రంగా ఉన్నాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: ఇశ్రాయేలు ప్రతినిధి / యూదా ప్రతినిధి
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, ఇక్కడ ఒక్కొక్క పక్షం తరఫున మాట్లాడే వ్యక్తి ఉద్దేశించబడినట్లు సహజమైన తెలుగులో తెలియజేస్తుంది; చివరి వాక్యంలో ఉన్న సమూహార్థాన్నీ వేరుగా నిలుపుతుంది.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: రాజులో నాకు పది వంతులు ఉన్నాయి
  rationale: ‘చేతులు’ అనే అక్షరార్థం ఇక్కడ భాగాలు లేదా హక్కులను సూచించే నుడికారం. ‘పది వంతులు’ ఉత్తరంలోని పది గోత్రాల ఆధారంగా చెప్పిన వాటాను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: దావీదు విషయంలో కూడా నీకంటే నాకు ఎక్కువ హక్కు ఉంది
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉన్నా, దావీదుపై తులనాత్మకమైన వాటా లేదా హక్కును తెలియజేస్తుంది. వ్యక్తిగత గొప్పతనంగా అపార్థం కాకుండా అంతర్లీన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הֱקִלֹּתַנִי
  choice: నన్ను చిన్నచూపు చూశావు
  rationale: קלל హిఫీల్ రూపం ఒకరిని అల్పంగా లేదా ప్రాముఖ్యం లేనివాడిగా చూడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చిన్నచూపు చూడు’ ఈ అవమాన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: నా రాజును తిరిగి తీసుకురావాలని మొదట చెప్పింది నేనే కాదా?
  rationale: కష్టమైన, సంక్షిప్తమైన మూలవాక్యంలో דָבָר ‘మాట/ప్రతిపాదన’ అని అర్థమవుతుంది. రాజు తిరిగిరావాలనే విషయాన్ని ముందుగా లేవనెత్తిన ఘనతను సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: מַלְכִּי
  choice: నా రాజు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం స్పష్టంగా ఉండి, వక్త వ్యక్తపరచే విధేయతను మరియు హక్కును బలపరుస్తుంది.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వారి మాటలకంటే యూదా వారి మాటలు మరింత కఠినంగా ఉన్నాయి
  rationale: קשׁה ఇక్కడ మాటల తీవ్రత లేదా కఠినత్వాన్ని సూచిస్తుంది. సమాపన వాక్యంలో אִישׁ సమూహార్థకంగా ఉన్నందున తెలుగులో బహువచన భావాన్ని ఉపయోగించడం సహజం.
