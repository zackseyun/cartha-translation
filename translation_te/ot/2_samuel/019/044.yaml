- from: 'అప్పుడు ఇశ్రాయేలు ప్రతినిధి యూదా ప్రతినిధికి ఇలా జవాబిచ్చాడు: “రాజులో నాకు పది వంతులు ఉన్నాయి[a]; దావీదు విషయంలో కూడా నీకంటే నాకు ఎక్కువ హక్కు ఉంది[b]. అలాంటప్పుడు నన్నెందుకు చిన్నచూపు చూశావు? నా రాజును తిరిగి తీసుకురావాలని మొదట చెప్పింది నేనే కాదా?[c]” అయితే ఇశ్రాయేలు వారి మాటలకంటే యూదా వారి మాటలు మరింత కఠినంగా ఉన్నాయి[d].'
  to: 'అప్పుడు ఇశ్రాయేలు ప్రతినిధి యూదా ప్రతినిధికి ఇలా జవాబిచ్చాడు: “రాజుపై నాకు పది వాటాల హక్కు ఉంది[a]; దావీదు విషయంలో కూడా నీకంటే నాకు ఎక్కువ హక్కు ఉంది[b]. అలాంటప్పుడు నన్నెందుకు చిన్నచూపు చూశావు? నా రాజును తిరిగి రప్పించాలనే మాట మొదట నాదే కాదా?[c]” అయితే ఇశ్రాయేలు వారి మాటలకంటే యూదా వారి మాటలు మరింత కఠినంగా ఉన్నాయి[d].'
  rationale: 'The revision makes two limited improvements: it renders Israel’s idiomatic claim in a more natural Telugu construction while retaining the reference to the king, and it restores the source’s emphasis on Israel’s prior ‘word’ or proposal concerning the king’s return. No doctrinal or historical interpretation has been added.'
