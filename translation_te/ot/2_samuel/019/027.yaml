  text: וַ/יֹּאמַ֕ר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ עַבְדִּ֣/י רִמָּ֑/נִי כִּֽי אָמַ֨ר עַבְדְּ/ךָ֜ אֶחְבְּשָׁה לִּ/י֩ הַ/חֲמ֨וֹר וְ/אֶרְכַּ֤ב עָלֶ֨י/הָ֙ וְ/אֵלֵ֣ךְ אֶת הַ/מֶּ֔לֶךְ כִּ֥י פִסֵּ֖חַ עַבְדֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “నా ప్రభువైన రాజా, నా సేవకుడు నా గురించి మీకు అపవాదు చెప్పాడు[a]. ఎందుకంటే నీ సేవకుడనైన నేను, ‘నాకోసం గాడిదకు జీను వేసుకొని, దానిపై స్వారీ చేస్తూ రాజుతో కలిసి వెళ్తాను’ అని చెప్పాను; నీ సేవకుడు కుంటివాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను మోసగించాడు,” లేదా “నాకు ద్రోహం చేశాడు.” హీబ్రూ క్రియ తప్పుదారి పట్టించడాన్ని లేదా ద్రోహపూర్వకంగా వ్యవహరించడాన్ని సూచించగలదు. ఇక్కడ రాజుకు తప్పుడు సమాచారం చెప్పడమే సందర్భం కాబట్టి “నా గురించి మీకు అపవాదు చెప్పాడు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: నాపై అపవాదు మోపాడు
  rationale: ఈ క్రియకు ‘మోసగించాడు’ లేదా ‘ద్రోహంగా వ్యవహరించాడు’ అనే అర్థాలు ఉండగలవు. అయితే తరువాతి సందర్భంలో సేవకుడు రాజుకు తప్పుడు సమాచారం అందించిన సంగతి ప్రధానంగా ఉన్నందున ‘నాపై అపవాదు మోపాడు’ సందర్భానికి తగినది.
- source_word: עַבְדִּי
  choice: నా సేవకుడు
  rationale: రాజగృహానికి సంబంధించిన ఈ సందర్భంలో వ్యక్తిగత పరిచారకుణ్ణి సూచించడానికి ఆధునిక తెలుగులో ‘సేవకుడు’ సహజంగా ఉంటుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజును నేరుగా సంబోధించే గౌరవపూర్వక ఆస్థాన ప్రయోగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: నేను నా కోసం గాడిదకు జీను కట్టి
  rationale: మొదటి పురుష సంకల్పార్థక రూపాన్ని ‘నేను ... కట్టి’ అని సహజంగా వ్యక్తం చేస్తూ, חבש అనే క్రియకు ఇక్కడ ఉన్న ‘స్వారీకి సిద్ధం చేయడం/జీను కట్టడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: దానిపై ఎక్కి
  rationale: గాడిదపై స్వారీ చేయాలనే ఉద్దేశాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: రాజుతో కలిసి వెళ్తాను
  rationale: הלך తో కూడిన את ఇక్కడ గమ్యాన్ని కాక సహవాసాన్ని సూచిస్తుంది; అందువల్ల ‘రాజుతో కలిసి’ మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: פִסֵּחַ
  choice: కుంటివాడు
  rationale: శారీరకంగా నడవలేని లేదా కుంటుతూ నడిచే స్థితిని నేరుగా సూచించే, ఆధునిక తెలుగులో అర్థమయ్యే పదం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడనైన నేను
  rationale: రాజు ఎదుట తనను తాను వినయంగా సూచించే ఆస్థాన ప్రయోగాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
