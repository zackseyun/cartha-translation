  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక ఆస్థాన సంబోధనను నిలిపి, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని ‘నీ సేవకుడు’ అనే వినయపూర్వక స్వీయసూచన స్పష్టత కోసం ‘నీ సేవకుడనైన నేను’గా ఇవ్వబడింది.
