id: 2SA.19.31
reference: 2 Samuel 19:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מְפִיבֹ֨שֶׁת֙ אֶל הַ/מֶּ֔לֶךְ גַּ֥ם אֶת הַ/כֹּ֖ל יִקָּ֑ח אַ֠חֲרֵי אֲשֶׁר בָּ֞א אֲדֹנִ֥/י הַ/מֶּ֛לֶך בְּ/שָׁל֖וֹם אֶל בֵּיתֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/031.yaml
  text: Mephibosheth said to the king[a], “Let him even take it all, since my lord the king has come safely to his own house.”
translation:
  language: te
  text: 'మెఫీబోషెతు రాజుతో ఇలా అన్నాడు: “అతడు అన్నిటినీ తీసుకోనివ్వండి; నా ప్రభువైన రాజు క్షేమంగా[a] తన ఇంటికి వచ్చారు గనుక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “శాంతితో.”
    reason: బְּשָׁלוֹם అనే పదబంధం సందర్భంలో క్షేమంగా లేదా సురక్షితంగా అనే భావాన్ని ఇస్తుంది; అక్షరార్థం “శాంతితో.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథనంలో אמר అనే సాధారణ మాటల క్రియకు సహజమైన తెలుగు రూపం.
- source_word: מְפִיבֹשֶׁת
  choice: మెఫీబోషెతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజుతో
  rationale: మూలంలో వ్యక్తినామం కాకుండా నిర్దిష్ట బిరుదే ఉంది; తెలుగు సంభాషణ సందర్భంలో ‘రాజుతో’ సహజంగా ఉంటుంది.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: అతడే మొత్తం తీసుకోనీ
  rationale: גַּם ఇచ్చే నొక్కిచెప్పే భావాన్ని ‘అతడే’ ద్వారా, యుస్సివ్ భావాన్ని ‘తీసుకోనీ’ ద్వారా వ్యక్తం చేస్తుంది; ఆస్తి మొత్తాన్ని సూచించే הַכֹּלను ‘మొత్తం’గా అందిస్తుంది.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: కదా
  rationale: 'ఇక్కడి కాల-కారణ సంబంధాన్ని తెలుగులో సహజమైన కారణాత్మక, భావోద్వేగపూర్వక వాక్యాంతంతో వ్యక్తం చేస్తుంది: రాజు క్షేమంగా చేరడమే ఆస్తిని వదులుకోవడానికి ఆధారం.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలోని గౌరవపూర్వక సంబోధనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: రాజు సురక్షితంగా, హాని లేకుండా చేరుకున్నాడనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: אֶל בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: మూలంలోని స్వాధీన సర్వనామాన్ని అతిశయింపకుండా నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. రాజును సూచించే క్రియకు ‘వచ్చారు’ అనే గౌరవ బహువచనం వాడి రాజసభ సందర్భాన్ని సహజంగా నిలిపాం; ‘తీసుకోనీ’ ద్వారా concessive jussive భావాన్ని సంక్షిప్తంగా ఉంచాం.
