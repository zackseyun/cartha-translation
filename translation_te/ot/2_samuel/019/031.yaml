  revision_rationale: The revision relocates the emphasis from the person to the totality of what may be taken, and renders the source’s temporal-causal clause explicitly and naturally. It retains the source’s title ‘the king,’ the deferential ‘my lord the king,’ and the lexical-alternative footnote.
