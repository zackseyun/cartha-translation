- from: మెఫీబోషెతు రాజుతో, “అతడే మొత్తం తీసుకోనీ. నా ప్రభువైన రాజు తన ఇంటికి క్షేమంగా[a] వచ్చారు కదా!” అన్నాడు.
  to: 'మెఫీబోషెతు రాజుతో ఇలా అన్నాడు: “అతడు అన్నిటినీ తీసుకోనివ్వండి; నా ప్రభువైన రాజు క్షేమంగా[a] తన ఇంటికి వచ్చారు గనుక.”'
  rationale: The revision relocates the emphasis from the person to the totality of what may be taken, and renders the source’s temporal-causal clause explicitly and naturally. It retains the source’s title ‘the king,’ the deferential ‘my lord the king,’ and the lexical-alternative footnote.
