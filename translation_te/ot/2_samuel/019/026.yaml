id: 2SA.19.26
reference: 2 Samuel 19:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: te
  text: అతడు రాజును కలుసుకోవడానికి యెరూషలేముకు వచ్చినప్పుడు, రాజు అతనితో, “మెఫీబోషెతూ, నువ్వు నాతో ఎందుకు వెళ్లలేదు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ మార్పును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అప్పుడు ఇలా జరిగింది’ అనే కృత్రిమ విస్తరణను నివారిస్తుంది.
- source_word: בָא יְרוּשָׁלַם
  choice: యెరూషలేముకు వచ్చినప్పుడు
  rationale: בוא యొక్క సాధారణ అర్థమైన ‘రావడం/చేరడం’ను, గమ్యస్థానాన్ని తెలిపే సహజ తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: రాజును కలుసుకోవడానికి
  rationale: לקראת ఇక్కడ ఒక వ్యక్తిని ఎదుర్కొని కలుసుకోవడానికి రావడాన్ని సూచిస్తుంది; సందర్భానుసారంగా సరళమైన తెలుగు ప్రయోగం.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: రాజు అతనితో … అని అడిగాడు
  rationale: ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అడిగాడు’ సహజం; రాజు అనే స్పష్టమైన కర్తను హీబ్రూ ప్రకారం నిలుపుతుంది.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: నువ్వు నాతో ఎందుకు వెళ్లలేదు?
  rationale: הלך యొక్క ‘వెళ్లు’ అనే దిశార్థాన్ని నిలుపుతూ, దావీదు గత ప్రయాణాన్ని సూచించే ప్రశ్నను సహజ తెలుగులో అందిస్తుంది.
- source_word: מְפִיבֹשֶׁת
  choice: మెఫీబోషెతూ
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చి, ప్రత్యక్ష సంబోధనకు తగిన సంబోధనా రూపాన్ని వాడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని ‘వెళ్లడం’ అనే దిశాభావాన్ని మార్చకుండా నిలుపుకుంది.
