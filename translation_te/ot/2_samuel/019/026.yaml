- from: అతడు రాజును కలుసుకోవడానికి యెరూషలేముకు వచ్చినప్పుడు, రాజు అతనితో, “మెఫీబోషెతూ, నువ్వు నాతో ఎందుకు వెళ్లలేదు?” అని అడిగాడు.
  to: అతడు రాజును కలుసుకోవడానికి యెరూషలేముకు వచ్చినప్పుడు, రాజు అతనితో, “మెఫీబోషెతూ, నువ్వు నాతో ఎందుకు వెళ్లలేదు?” అన్నాడు.
