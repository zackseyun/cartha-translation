source:
  edition: WLC
  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: te
  text: 'ఇదిగో, ఇశ్రాయేలు పురుషులందరూ[b] రాజు వద్దకు వచ్చి రాజుతో ఇలా అన్నారు: “యూదా పురుషులైన మా సహోదరులు నిన్ను ఎందుకు దొంగిలించి తీసుకెళ్లి[a], రాజును, ఆయన ఇంటివారిని, ఆయనతో ఉన్న దావీదు మనుషులందరినీ యొర్దాను దాటించారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిన్ను రహస్యంగా తీసుకెళ్లి.” ఇక్కడ హీబ్రూలో సాధారణంగా ‘దొంగిలించు’ అనే అర్థమిచ్చే క్రియ రూపకంగా వాడబడింది; ఇతర ఇశ్రాయేలీయులను భాగస్వాములను చేయకుండా యూదావారు రాజును తీసుకెళ్లారని ఇది ఆరోపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “ఇశ్రాయేలు పురుషులందరూ,” “యూదా పురుషులు” అనే పురుషవాచక సమూహ భాష ఉంది; ఇది ఆయా సమూహాలకు ప్రాతినిధ్యం వహించినవారిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: వావ్ సంధానాన్ని, హిన్నే అనే శ్రద్ధాకర్షక కథన సూచకాన్ని రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమూహార్థకం; మూలంలోని పురుషవాచక ప్రతినిధి భాషను నిలుపుతుంది.
- source_word: בָּאִים
  choice: వచ్చి
  rationale: కథన సందర్భంలోని కృదంతాన్ని తెలుగు వాక్యక్రమంలో సహజమైన సమాపక క్రియతో అనుసంధానిస్తుంది.
- source_word: גְּנָבוּךָ
  choice: నిన్ను దొంగిలించుకొని
  rationale: גנב అనే సాధారణ ‘దొంగిలించు’ క్రియలోని ఉద్దేశపూర్వక రాజకీయ రూపకాన్ని నిలుపుతుంది; దీనిని అక్షరార్థ అపహరణగా మార్చదు.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: యూదా పురుషులైన మా సహోదరులు
  rationale: అంతర్గోత్ర వివాదంలో ఉన్న కుటుంబ సంబంధ భాషను, సమూహార్థక పురుషవాచక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: וַיַּעֲבִרוּ
  choice: దాటించారు
  rationale: עבר హిఫీల్ రూపంలోని ‘దాటేలా చేశారు’ అనే కారణార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటివారిని
  rationale: ఈ సందర్భంలో భవనం కంటే రాజు కుటుంబం లేదా గృహపరివారాన్ని సూచిస్తుంది.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: హీబ్రూ స్థలనామానికి స్థిరపడిన తెలుగు రూపం; మూలంలో విడిగా ‘నది’ అనే పదం లేదు.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: అతనితో ఉన్న దావీదు మనుషులందరినీ
  rationale: దావీదు వెంట ఉన్న సమూహాన్నీ దాటించిన క్రియకు అనుసంధానిస్తూ, עִמּוֹ అనే ‘అతనితో’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
