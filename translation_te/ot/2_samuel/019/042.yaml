revisions:
- from: అప్పుడు ఇదిగో, ఇశ్రాయేలు పురుషులందరూ[b] రాజు దగ్గరికి వచ్చి, “యూదా పురుషులైన మా సహోదరులు నిన్ను ఎందుకు దొంగిలించుకొని[a], రాజును, అతని ఇంటివారిని, అతనితో ఉన్న దావీదు మనుషులందరినీ యొర్దాను దాటించారు?” అని రాజును అడిగారు.
  to: 'ఇదిగో, ఇశ్రాయేలు పురుషులందరూ[b] రాజు వద్దకు వచ్చి రాజుతో ఇలా అన్నారు: “యూదా పురుషులైన మా సహోదరులు నిన్ను ఎందుకు దొంగిలించి తీసుకెళ్లి[a], రాజును, ఆయన ఇంటివారిని, ఆయనతో ఉన్న దావీదు మనుషులందరినీ యొర్దాను దాటించారు?”'
  rationale: The revision removes the unnecessary temporal addition, uses a more standard narrative expression for approaching the king, and changes the theft idiom to a natural Telugu expression that preserves the Hebrew political metaphor. It retains the source's shift from direct address ('you') to the third-person designation ('the king'), the causal sense of 'brought across,' and both required footnote anchors.
