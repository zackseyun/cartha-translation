translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. రాజును నేరుగా సంబోధించే ‘నిన్ను’ నుంచి మళ్లీ ‘రాజును’ అనే మూడవ పురుష ప్రయోగానికి మారే మూల వాక్యంలోని ఉద్దేశపూర్వక మార్పును నిలిపాము. పునరుక్త ‘రాజు’ పదాన్నీ మూలానికి అనుగుణంగా ఉంచాము.
