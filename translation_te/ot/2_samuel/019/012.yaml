  to: 'రాజైన దావీదు యాజకులైన సాదోకు, అబ్యాతారులకు సందేశం పంపిస్తూ ఇలా చెప్పాడు: “యూదా పెద్దలతో ఇలా చెప్పండి: ‘రాజును తిరిగి తన ఇంటికి తీసుకురావడంలో మీరు చివరివారుగా ఎందుకు ఉండాలి? ఇశ్రాయేలు అంతటి మాట రాజు దగ్గరకు ఆయన ఇంటికే చేరింది కదా![a]’”'
