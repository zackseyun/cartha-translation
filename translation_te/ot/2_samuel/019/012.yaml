source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ דָּוִ֗ד שָׁ֠לַח אֶל צָד֨וֹק וְ/אֶל אֶבְיָתָ֥ר הַ/כֹּהֲנִים֮ לֵ/אמֹר֒ דַּבְּר֞וּ אֶל זִקְנֵ֤י יְהוּדָה֙ לֵ/אמֹ֔ר לָ֤/מָּה תִֽהְיוּ֙ אַֽחֲרֹנִ֔ים לְ/הָשִׁ֥יב אֶת הַ/מֶּ֖לֶךְ אֶל בֵּית֑/וֹ וּ/דְבַר֙ כָּל יִשְׂרָאֵ֔ל בָּ֥א אֶל הַ/מֶּ֖לֶךְ אֶל בֵּיתֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: te
  text: 'రాజైన దావీదు యాజకులైన సాదోకు, అబ్యాతారులకు సందేశం పంపిస్తూ ఇలా చెప్పాడు: “యూదా పెద్దలతో ఇలా చెప్పండి: ‘రాజును తిరిగి తన ఇంటికి తీసుకురావడంలో మీరు చివరివారుగా ఎందుకు ఉండాలి? ఇశ్రాయేలు అంతటి మాట రాజు దగ్గరకు ఆయన ఇంటికే చేరింది కదా![a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు అంతటి ప్రతిపాదన/సందేశం రాజు తన ఇంట్లో ఉండగా ఆయనకు చేరింది.” ‘ఇశ్రాయేలు అంతటి మాట’ అనే హెబ్రీ పదబంధం విస్తృతమైనది; దావీదును తిరిగి తీసుకురావడానికి గోత్రాల నుంచి వచ్చిన సమాచారం, ప్రతిపాదన లేదా విజ్ఞప్తిని అది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: కబురు పంపి
  rationale: పేర్లతో కూడిన אֶל ఇక్కడ వారిని పిలిపించడం కంటే వారికి సందేశం పంపడాన్ని సూచిస్తుంది. తెలుగులో కర్మను సూచించడానికి ‘కబురు’ సహజంగా చేర్చబడింది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: రాజైన దావీదు
  rationale: దావీదుకు ఉన్న రాజపదవిని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన రూపాన్ని ఇస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: సాదోకు, అబ్యాతారు నిర్వహించిన పదవిని పేర్లతో సహజంగా అనుసంధానిస్తుంది.
- source_word: דַּבְּרוּ אֶל זִקְנֵי יְהוּדָה
  choice: యూదా పెద్దలతో ఇలా చెప్పండి
  rationale: דבר אל యొక్క ‘వారితో మాట్లాడండి/వారికి చెప్పండి’ అనే భావాన్ని, రాజకీయ నాయకులైన זקניםను ‘పెద్దలు’గా స్పష్టంగా అందిస్తుంది.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: మీరు చివరివారుగా ఎందుకు ఉండాలి?
  rationale: ఇది కేవలం భవిష్యత్ ప్రశ్న కాకుండా వారిని చర్యకు పురికొల్పే అలంకారిక ప్రశ్న; ‘ఎందుకు ఉండాలి?’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהָשִׁיב אֶת הַמֶּלֶךְ
  choice: రాజును తిరిగి ... తీసుకురావడంలో
  rationale: שׁוב యొక్క హిఫీల్ రూపంలోని కారణార్థక భావాన్ని—రాజు తిరిగి వచ్చేలా చేయడం లేదా తీసుకురావడం—కాపాడుతుంది.
- source_word: אֶל בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: בַּיִת‌ను ‘రాజభవనం’ అని మరీ నిర్దిష్టం చేయకుండా, ఇల్లు లేదా నివాసం అనే మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి మాట
  rationale: דָּבָר ఇక్కడ మాట, సందేశం, ప్రతిపాదన లేదా విజ్ఞప్తి అనే విస్తృత అర్థాలను కలిగి ఉండవచ్చు. ‘మాట’ ఆ అస్పష్టతను అనవసరంగా పరిష్కరించదు.
- source_word: בָּא אֶל הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: రాజు దగ్గరికి, అతని ఇంటికి చేరింది
  rationale: ‘చేరింది’ సందేశం ఇప్పటికే అందిందనే భావాన్ని సహజంగా ఇస్తుంది; అదే సమయంలో హెబ్రీలో పునరుక్తిగా ఉన్న రాజు మరియు అతని ఇంటి సూచనలను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి వాడబడింది. ‘ఇల్లు’ మరియు ‘మాట’ వంటి విస్తృత పదాలను ఉంచి, ‘రాజభవనం’ లేదా ‘ప్రతిపాదన’ వంటి మరీ నిర్దిష్ట వ్యాఖ్యానాలను ప్రధాన పాఠ్యంలోకి తేవలేదు. హెబ్రీలోని చివరి ‘రాజు దగ్గరికి, అతని ఇంటికి’ అనే పునరుక్తి కొంత అసహజంగా ఉన్నా మూలంలోని నిజమైన నిర్మాణాన్ని కాపాడేందుకు నిలుపబడింది; సహజమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
