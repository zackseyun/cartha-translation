  text: וַ/תְּהִ֨י הַ/תְּשֻׁעָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא לְ/אֵ֖בֶל לְ/כָל הָ/עָ֑ם כִּֽי שָׁמַ֣ע הָ/עָ֗ם בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר נֶעֱצַ֥ב הַ/מֶּ֖לֶךְ עַל בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: te
  text: ఆ రోజు విజయం ప్రజలందరికీ శోకంగా మారింది[a]. ఎందుకంటే, “రాజు తన కుమారుని గురించి దుఃఖిస్తున్నాడు” అని ఆ రోజు ప్రజలు విన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రోజు విమోచనం శోకంగా మారింది.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ప్రజలు విన్నారు, ఇలా చెబుతూ”; అంటే ఒక వార్తను లేదా చెప్పబడిన మాటను విన్నారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: సాధించిన విజయం
  rationale: యుద్ధానంతర సందర్భంలో ఈ పదం యుద్ధంలో పొందిన విజయవంతమైన ఫలితాన్ని సూచిస్తుంది. ‘రక్షణ’ అనే పదం ఇక్కడ అనవసరంగా మతపరమైన భావాన్ని కలిగించవచ్చు; ‘విజయం’ సహజంగా ఉంది.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: దుఃఖదినంగా మారింది
  rationale: హీబ్రూ నిర్మాణంలోని ఫలితార్థాన్ని, విజయానందం ప్రజలకు శోకంగా మారిన వ్యతిరేక పరిణామాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵבֶל
  choice: దుఃఖదినం
  rationale: ఈ పదం సామూహిక శోకాన్ని సూచిస్తుంది. సందర్భంలో ఆ రోజు స్వభావమే మారిందనే భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో దావీదు పక్షాన పోరాడినవారు ప్రధానంగా ఉద్దేశించబడినా, మూలపాఠం సాధారణ పదమైన ‘ప్రజలు’నే ఉపయోగిస్తుంది.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: ఎందుకంటే ... అని ... ప్రజలు విన్నారు
  rationale: ‘విన్నారు, ఇలా చెబుతూ’ అనే హీబ్రూ జాతీయాన్ని నివేదిక విన్నారనే సహజ తెలుగు నిర్మాణంతో అందిస్తుంది.
- source_word: נֶעֱצַב
  choice: దుఃఖిస్తున్నాడు
  rationale: నిఫాల్ రూపం బాధపడడం లేదా దుఃఖించడం అనే స్థితిని సూచిస్తుంది; రాజు కుమారుని విషయంలో ఉన్న శోకానికి ఇది సహజమైన, గంభీరమైన తెలుగు.
- source_word: עַל בְּנוֹ
  choice: తన కుమారుని గురించి
  rationale: עַל ఇక్కడ దుఃఖానికి కారణం లేదా విషయం అయిన కుమారుణ్ణి సూచిస్తుంది. ‘గురించి’ మూలంలోని కొంత విస్తృత సంబంధార్థాన్ని నిలుపుతుంది.
