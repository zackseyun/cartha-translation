translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. మూలంలోని ‘ప్రజలు’ అనే సాధారణ పదాన్ని నిలుపుతూ, యుద్ధ సందర్భాన్ని ‘సాధించిన విజయం’ ద్వారా స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
