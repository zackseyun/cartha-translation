- from: కాబట్టి ఆ రోజు సాధించిన విజయం ప్రజలందరికీ దుఃఖదినంగా మారింది[a]. ఎందుకంటే, “రాజు తన కుమారుని గురించి దుఃఖిస్తున్నాడు” అని ఆ రోజు ప్రజలు విన్నారు[b].
  to: ఆ రోజు విజయం ప్రజలందరికీ శోకంగా మారింది[a]. ఎందుకంటే, “రాజు తన కుమారుని గురించి దుఃఖిస్తున్నాడు” అని ఆ రోజు ప్రజలు విన్నారు[b].
  rationale: 'The revision removes the added notion ‘day of sorrow’ and retains the Hebrew contrast directly: the day’s victory became mourning for all the people. It also removes the unnecessary intensifying/additional wording “సాధించిన” and avoids an overly inferential opening. Footnote markers remain correctly anchored in the text, and both notes preserve the audit-trail alternatives.'
