  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל בַּרְזִלָּ֑י אַתָּה֙ עֲבֹ֣ר אִתִּ֔/י וְ/כִלְכַּלְתִּ֥י אֹתְ/ךָ֛ עִמָּדִ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: te
  text: రాజు బర్జిల్లయితో, “నువ్వు నాతో కలిసి దాటి రా; యెరూషలేములో నా వద్ద నిన్ను పోషిస్తాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ అవసరాలు సమకూరుస్తాను” లేదా “నిన్ను ఆధరిస్తాను.” హీబ్రూ క్రియ ఒకరి అవసరాలకు కావలసినవి సమకూర్చి వారిని పోషించడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథనంలోని వరుస సంఘటనను సహజమైన ఆధునిక తెలుగు వాక్యాంత క్రియతో వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకం; సందర్భంలో దావీదును సూచిస్తున్నప్పటికీ మూలంలోని బిరుదునే నిలుపుతుంది.
- source_word: אֶל בַּרְזִלָּי
  choice: బర్జిల్లయితో
  rationale: మాట్లాడే వ్యక్తి ఎవరితో అన్నదాన్ని సహజమైన తెలుగులో సూచిస్తుంది; వ్యక్తినామం లిప్యంతరీకరించబడింది.
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: నువ్వు నాతో కలిసి దాటి రా
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నువ్వు’తో నిలిపి, యొర్దాను దాటే సందర్భంలోని עבר క్రియకు concrete అర్థమైన ‘దాటి రా’ను వాడింది.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: నిన్ను పోషిస్తాను
  rationale: כלכל ఇక్కడ ఒకరి అవసరాలు తీర్చి సంరక్షించడం, పోషించడం అనే భావాన్ని ఇస్తుంది; ‘పోషిస్తాను’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עִמָּדִי בִּירוּשָׁלִָם
  choice: యెరూషలేములో నా దగ్గర ఉంచుకొని
  rationale: ‘యెరూషలేములో నాతో’ అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూనే రాజు సంరక్షణలో ఉండే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన కథనశైలి. రాజు బర్జిల్లయిని ఏకవచనంలో సంబోధించినందున సహజమైన ‘నువ్వు’ వాడబడింది; ‘దాటి రా’ యొర్దాను దాటడాన్ని స్పష్టంగా ఉంచుతుంది.
