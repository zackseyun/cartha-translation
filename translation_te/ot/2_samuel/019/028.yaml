source:
  edition: WLC
  text: וַ/יְרַגֵּ֣ל בְּ/עַבְדְּ/ךָ֔ אֶל אֲדֹנִ֖/י הַ/מֶּ֑לֶךְ וַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים וַ/עֲשֵׂ֥ה הַ/טּ֖וֹב בְּ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: te
  text: అతడు నా యజమానియైన రాజు దగ్గర నీ సేవకునిపై అపనింద మోపాడు. అయితే నా యజమానియైన రాజు దేవుని దూతవంటివాడు; కాబట్టి నీ దృష్టికి ఏది మంచిదో అది చేయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: అపనింద మోపాడు
  rationale: ఈ సందర్భంలో ఈ క్రియకు ‘చాడీలు చెప్పాడు/అపవాదు చేశాడు’ అనే భావం ఉంది. గౌరవప్రదమైన ఆధునిక తెలుగులో ఆరోపణాత్మక భావాన్ని స్పష్టంగా తెలియజేయడానికి ఈ పదబంధం ఎంచుకోబడింది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకునిపై
  rationale: మефీబోషెతు తనను తాను వినయంగా మూడవ పురుషంలో సూచిస్తున్న రాజసభా ప్రయోగాన్ని నిలుపుతుంది.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూతవంటివాడు
  rationale: מַלְאַךְ యొక్క సాధారణ అర్థమైన ‘దూత’ను నిలిపి, రాజుకు అసాధారణ వివేచన ఉందనే ఉపమానాన్ని మతపరంగా అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: నీ దృష్టికి ఏది మంచిదో అది
  rationale: ‘నీ కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో, రాజు నిర్ణయానికి అప్పగించే భావంతో అందిస్తుంది.
theological_decisions:
- issue: రాజును ‘దేవుని దూత’తో పోల్చడం
  choice: దేవుని దూతవంటివాడు
  alternative: దేవదూతవంటివాడు
  rationale: మూలంలోని construct phrase ‘దేవుని దూత’ను ప్రత్యక్షంగా నిలుపుతుంది; రాజు నిజంగా దైవిక జీవి అని చెప్పకుండా ఉపమానాన్ని యథాతథంగా ఉంచుతుంది.
- issue: వాక్యాంత ఆజ్ఞకు కారణసూచక సంబంధం
  choice: కాబట్టి నీ దృష్టికి ఏది మంచిదో అది చేయి
  alternative: నీ దృష్టికి ఏది మంచిదో అది చేయి
  rationale: וַעֲשֵׂהలోని וַ సందర్భానుసారంగా ముందున్న రాజు వివేచనపై నమ్మకానికి ఫలితంగా వచ్చే విజ్ఞప్తిని సూచిస్తుంది; ‘కాబట్టి’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా గౌరవం, స్వీయవినయం నిలుపుతూ సాధారణ పాఠకుడికి సహజంగా ఉండే వాక్య నిర్మాణం. మూలంలోని ‘నా యజమానియైన రాజు’ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
