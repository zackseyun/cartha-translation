  yaml_path: translation/ot/2_samuel/002/020.yaml
  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: te
  text: అబ్నేరు వెనక్కి తిరిగి, “నువ్వు అసాహేలువేనా?” అన్నాడు. అతడు, “నేనే” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: తిరిగి
  rationale: פנה అనే క్రియకు సాధారణ అర్థం ‘తిరుగు’. వెంబడింపు సందర్భంలో సహజమైన తెలుగులో ‘వెనక్కి తిరిగి’ అని అనువదించడం చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרָיו
  choice: వెనక్కి
  rationale: ఈ పదబంధం అబ్నేరు తన వెనుకవైపుకు తిరిగాడనే స్థలార్థాన్ని ఇస్తుంది; తెలుగులో ‘వెనక్కి తిరిగి’ సహజంగా ఉంటుంది.
- source_word: הֲאַתָּה זֶה
  choice: నువ్వు ... వేనా?
  rationale: ప్రశ్నార్థక కణం, సర్వనామం, సూచనార్థక పదం కలిసి వ్యక్తిని గుర్తించే ప్రశ్నగా ఉన్నాయి. ‘నువ్వు ఆసాహేలువేనా?’ అనేది ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עֲשָׂהאֵל
  choice: ఆసాహేలు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామం ఇక్కడ సంపూర్ణ స్వీయ-గుర్తింపు సమాధానంగా పనిచేస్తుంది; తెలుగులో ‘నేనే’ సంక్షిప్తంగా, సహజంగా అదే బలాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త సంభాషణను నిలుపుతూ, హెబ్రీ గుర్తింపు ప్రశ్నను తెలుగు వాడుకకు తగినట్లుగా అందించాం.
