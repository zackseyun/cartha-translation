  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: te
  text: అప్పుడు అబ్నేరు యోవాబుతో, “ఆ యువకులు లేచి మన ఎదుట పోటీపడనివ్వండి” అన్నాడు. యోవాబు, “వారు లేవనివ్వండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: ఆ యువకులు
  rationale: సందర్భంలో ఇరు పక్షాల యువ యోధులను సూచిస్తుంది; మూలంలోని సాధారణ పదాన్ని అనవసరంగా ‘సైనికులు’ అని ప్రత్యేకీకరించలేదు.
- source_word: וִישַׂחֲקוּ
  choice: పోటీపడనివ్వు
  rationale: שׂחק సాధారణంగా ఆడడం లేదా వినోదించడం అని అర్థమివ్వగలదు; అయితే తరువాతి ప్రాణాంతక ముఖాముఖి పోరాటం దృష్ట్యా ఇక్కడ ‘పోటీపడు’ సందర్భోచితంగా ఉండి, ఆరంభ మాటలోని సంయమిత/వ్యంగ్య ఛాయను నిలుపుతుంది.
- source_word: לְפָנֵינוּ
  choice: మన ఎదుట
  rationale: స్థలార్థకమైన ‘మన సమక్షంలో/మన ఎదుట’ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יָקוּמוּ נָא
  choice: లేచి … నివ్వు
  rationale: נָא లోని అభ్యర్థన ఛాయను ఆజ్ఞకంటే మృదువైన అనుమతి/ప్రతిపాదన రూపంతో వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సహజమైన కథనశైలి. హెబ్రీ వాక్యంలోని సంక్షిప్త ప్రతిపాదన-అంగీకార నిర్మాణాన్ని నిలుపుతూ, ‘play’ అనే తేలిక భావానికి బదులు సందర్భంలోని పోటీ/పోరాట సూచనను తెలిపే పదాన్ని ఎంచుకున్నాం.
