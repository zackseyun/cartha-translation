  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. మూలంలోని సంఘటనల క్రమం, ప్రయాణపు చివరి హద్దు, భౌగోళిక సంబంధం నిలుపబడ్డాయి. ఈ వచనానికి అవసరమైన పాఠాంతర లేదా తాత్త్విక పాదటిప్పణి లేదు.
