  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: te
  text: యోవాబు మరియు అబీషై అబ్నేరును వెంబడించారు. సూర్యుడు అస్తమించాడు; వారు గిబియోను అరణ్యానికి వెళ్లే దారిలో[బి], గీయకు ఎదురుగా ఉన్న[ఎ] అమ్మా కొండవరకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: ఎ
    text: లేదా, “గీయకు ముందువైపున ఉన్న.” హీబ్రూ పదబంధం ఒక స్థలానికి ఎదురుగా లేదా దాని ముందుభాగంలో ఉన్న స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: బి
    text: లేదా, “గిబియోను అరణ్యపు మార్గం ద్వారా.” హీబ్రూ పదబంధం దిశను మాత్రమే కాక మార్గాన్ని కూడా ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: అబ్నేరును వెంబడించారు
  rationale: רדף సైనిక సందర్భంలో వెంటబడి తరుమడాన్ని సూచిస్తుంది. ‘వెంబడించారు’ సహజమైన ఆధునిక తెలుగు; אַחֲרֵי అనే సంబంధాన్ని తెలుగు కర్మవిభక్తిలో సహజంగా కలుపుతుంది.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: సూర్యుడు అస్తమించాడు
  rationale: అక్షరార్థంగా ‘సూర్యుడు వచ్చాడు’ అనే హీబ్రూ నుడికారం సూర్యాస్తమయాన్ని సూచిస్తుంది. తెలుగులో ‘అస్తమించాడు’ అర్థాన్ని స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: వారు ... కొండవరకు వచ్చారు
  rationale: עַד ప్రయాణం చేరిన హద్దును సూచిస్తుంది; ‘వరకు వచ్చారు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది. స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను తెలుగు వాక్యప్రవాహంలో అతిగా చూపలేదు.
- source_word: גִּבְעַת אַמָּה
  choice: అమ్మా కొండ
  rationale: స్థలనామంతో కూడిన హీబ్రూ construct chainను తెలుగులో సహజమైన ‘అమ్మా కొండ’గా ఇచ్చాం.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: గీయకు ఎదురుగా ఉన్న
  rationale: עַל־פְּנֵי ఇక్కడ ఒక ప్రదేశానికి ఎదురుగా లేదా దాని ముందువైపున ఉన్న స్థానాన్ని సూచించగలదు. ‘ఎదురుగా’ భౌగోళిక సంబంధాన్ని దిశను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: గిబియోను అరణ్యానికి వెళ్లే దారిలో
  rationale: דֶּרֶךְ మార్గం లేదా దారిని సూచిస్తుంది. ఈ రూపం గిబియోనుతో సంబంధమున్న అరణ్యానికి వెళ్లే మార్గాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: యోవాబు / అబీషై / అబ్నేరు / అమ్మా / గీయ / గిబియోను
  rationale: హీబ్రూ వ్యక్తి, స్థలనామాల ధ్వనులను తెలుగు బైబిలు పఠనానికి సహజంగా ఉండే విధంగా లిప్యంతరీకరించాం.
