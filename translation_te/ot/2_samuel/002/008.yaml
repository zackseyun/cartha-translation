translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అవతలికి’ అనే పదం మూలంలోని עבר క్రియాభావాన్ని కాపాడుతూ, దాటిన ప్రదేశాన్ని వచనం కంటే ఎక్కువగా నిర్దిష్టం చేయదు. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో సంబంధిత పేరుకు వెంటనే ఉంచబడింది.
