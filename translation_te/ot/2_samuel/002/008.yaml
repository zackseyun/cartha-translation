  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: te
  text: అయితే నేరు కుమారుడైన, సౌలు సైన్యాధిపతియైన అబ్నేరు సౌలు కుమారుడైన ఈష్బోషెతును[a] తీసుకొని మహనయీముకు తీసుకువెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 8:33; 9:39లో ఈష్బోషెతును ఎష్బయాలు అని పిలుస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: అయితే ... అబ్నేరు
  rationale: וְ సాధారణంగా ‘మరియు’ అని అర్థమైనా, మునుపటి వచనంలో యూదావారు దావీదును రాజుగా అభిషేకించిన దానికి ఇక్కడి చర్య వ్యతిరేక దిశలో సాగుతున్నందున ‘అయితే’ సహజమైన కథన వైరుధ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: בֶּן נֵר
  choice: నేరు కుమారుడు
  rationale: హీబ్రూ పుత్ర సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: సౌలు సైన్యాధిపతి
  rationale: שַׂר צָבָא అనేది సైన్యానికి అధిపతి లేదా ప్రధాన సేనాధికారిని సూచిస్తుంది; సౌలుతో ఉన్న సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలిపే ఆధునిక తెలుగు రూపం.
- source_word: לָקַח
  choice: తీసుకొని
  rationale: క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తీసుకొను’ను నిలిపింది; సందర్భం బలవంతంగా పట్టుకున్నాడని నిర్బంధించదు.
- source_word: אִישׁ בֹּשֶׁת
  choice: ఈష్బోషెతు
  rationale: మసొరెతిక్ పాఠంలోని వ్యక్తి పేరును అనువదించకుండా తెలుగు లిప్యంతరీకరణలో ఇచ్చింది; దినవృత్తాంతాలలోని ప్రత్యామ్నాయ నామరూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: అవతలికి తీసుకువెళ్లాడు
  rationale: עבר హిఫీల్ రూపంలోని ‘దాటింపజేయు/అవతలికి తీసుకువెళ్లు’ అనే కారక భావాన్ని నిలుపుతుంది; వచనం పేర్కొనని నిర్దిష్ట మార్గం లేదా నదిని చేర్చదు.
- source_word: מַחֲנָיִם
  choice: మహనయీము
  rationale: స్థల నామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చింది.
