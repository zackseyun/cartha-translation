  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సైనిక సందర్భాన్ని సూచించే అదనపు పదాలను చేర్చకుండా మూలపాఠంలోని సాధారణ పదజాలం, రెండు పక్షాల మధ్య స్థలవ్యత్యాసం నిలుపబడ్డాయి.
