  text: וְ/יוֹאָ֨ב בֶּן צְרוּיָ֜ה וְ/עַבְדֵ֤י דָוִד֙ יָֽצְא֔וּ וַֽ/יִּפְגְּשׁ֛וּ/ם עַל בְּרֵכַ֥ת גִּבְע֖וֹן יַחְדָּ֑ו וַ/יֵּ֨שְׁב֜וּ אֵ֤לֶּה עַל הַ/בְּרֵכָה֙ מִ/זֶּ֔ה וְ/אֵ֥לֶּה עַל הַ/בְּרֵכָ֖ה מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: te
  text: సెరూయా కుమారుడైన యోవాబు, దావీదు సేవకులు బయలుదేరి గిబియోను కొలను దగ్గర ఒకచోట వారిని కలుసుకున్నారు. వీరు కొలనుకు ఒక వైపున, వారు కొలనుకు మరో వైపున కూర్చున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గిబియోను జలాశయం’; హీబ్రూ పదం నిర్మించిన కొలను లేదా నీటి జలాశయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడు యోవాబు
  rationale: తెలుగులో సహజమైన బంధుత్వ నిర్మాణాన్ని అనుసరిస్తూ వ్యక్తి పేరును స్పష్టంగా ఉంచుతుంది; కథనారంభంలోని וְ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోవడం ఆధునిక తెలుగు కథనశైలికి సహజం.
- source_word: וְ/עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: עבדים అనే పదంలోని ‘సేవకులు’ భావాన్ని నిలుపుతుంది; సందర్భం సైనికమైనదైనా ‘సైనికులు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: יָצְאוּ
  choice: బయలుదేరి
  rationale: יצא యొక్క సాధారణ ‘బయటకు వెళ్లడం/బయలుదేరడం’ భావాన్ని సహజమైన తెలుగు కథనరూపంలో అందిస్తుంది.
- source_word: וַֽ/יִּפְגְּשׁ֛וּ/ם
  choice: వారిని కలుసుకున్నారు
  rationale: క్రియలోని బహువచన కర్మప్రత్యయం ‘వారిని’ను స్పష్టంగా వ్యక్తపరుస్తూ פגשׁ యొక్క కలుసుకోవడం/ఎదురుపడడం భావాన్ని ఇస్తుంది.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: గిబియోను కొలను దగ్గర
  rationale: בְּרֵכָהకు ‘కొలను’ సహజమైన ప్రధాన సమానార్థకం; עַל ఇక్కడ స్థలసంబంధంగా ‘దగ్గర’ అని సులభంగా వ్యక్తమవుతుంది.
- source_word: יַחְדָּו
  choice: వారంతా అక్కడ ఒకేచోట చేరారు
  rationale: రెండు పక్షాలు ఒకే ప్రదేశంలో ఎదురుపడ్డాయనే భావాన్ని తెలుగులో స్పష్టపరుస్తుంది; వారు ఒకే పక్షంగా కలిశారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: וַ/יֵּשְׁבוּ
  choice: కూర్చున్నారు
  rationale: ישׁב యొక్క సాధారణ అర్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: వీరు ... వారు
  rationale: హీబ్రూ పాఠంలోని రెండు పక్షాల సూచనాత్మక వ్యత్యాసాన్ని అదనపు నామవాచకాలు చేర్చకుండా నిలుపుతుంది.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: కొలనుకు ఒక వైపున ... కొలనుకు మరో వైపున
  rationale: ఒకే కొలనుకు ఎదురెదురు వైపులున్నారనే హీబ్రూ స్థలవాచక నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
