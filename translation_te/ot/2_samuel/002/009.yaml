revisions:
- from: అతడు ఇష్బోషెతును గిలాదుకు, అష్షూరీయులకు[a], యెజ్రెయేలుకు, ఎఫ్రాయిముకు, బెన్యామీనుకు, ఇశ్రాయేలు అంతటికీ రాజుగా నియమించాడు.
  to: అతడు అతనిని గిలాదు, అషూరీయులు[a], యెజ్రెయేలు, ఎఫ్రాయిము, బెన్యామీను, ఇశ్రాయేలు అంతటిమీద రాజుగా నియమించాడు.
  rationale: హీబ్రూ సర్వనామాలను పేర్లతో భర్తీ చేయకుండా నిలిపి, ‘రాజుగా నియమించాడు’ అనే కారణార్థాన్ని భద్రపరిచాం. రాజ్యాధికార సంబంధాన్ని తెలుగులో నిర్ద్వంద్వంగా తెలియజేయడానికి జాబితాకు ‘మీద’ను వాడాం. הָאֲשׁוּרִי యొక్క వివాదాస్పద గుర్తింపును పరిష్కరించకుండా, మసొరా పాఠానుసారమైన ప్రధాన అనువాదంతో పాటు ఆషేరు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
  reviewer_model: gpt-5.6-terra
