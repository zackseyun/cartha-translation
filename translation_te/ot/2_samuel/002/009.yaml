source:
  edition: WLC
  text: וַ/יַּמְלִכֵ֨/הוּ֙ אֶל הַ/גִּלְעָ֔ד וְ/אֶל הָ/אֲשׁוּרִ֖י וְ/אֶֽל יִזְרְעֶ֑אל וְ/עַל אֶפְרַ֨יִם֙ וְ/עַל בִּנְיָמִ֔ן וְ/עַל יִשְׂרָאֵ֖ל כֻּלֹּֽ/ה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: te
  text: అతడు అతనిని గిలాదు, అషూరీయులు[a], యెజ్రెయేలు, ఎఫ్రాయిము, బెన్యామీను, ఇశ్రాయేలు అంతటిమీద రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అషూరీయుడు’; ఇక్కడ సమూహార్థకంగా వాడబడింది. కొందరు దీనిని ఆషేరు గోత్రాన్ని లేదా ఆషేరు ప్రాంతాన్ని సూచించే ‘ఆషేరు’గా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: అతడు ఇష్బోషెతును ... రాజుగా నియమించాడు
  rationale: מלך హిఫీల్ రూపం ‘ఒకరిని రాజుగా చేయడం/నియమించడం’ అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు వాక్యం స్వతంత్రంగా సహజంగా ఉండేందుకు పూర్వవచన సందర్భంలోని కర్తను, కర్మను పేర్లతో స్పష్టం చేశాం.
- source_word: אֶל / עַל
  choice: -కు / -కీ
  rationale: రాజుగా నియమించబడిన పరిపాలనా ప్రాంతాలు, ప్రజలను తెలుగులో సహజంగా సూచించేందుకు సంప్రదానార్థక విభక్తిని వాడాం; ‘రాజుగా నియమించాడు’ అనే క్రియతో కలిపి వారి మీద రాజ్యాధికార భావం స్పష్టమవుతుంది.
- source_word: הַגִּלְעָד
  choice: గిలాదు
  rationale: ప్రాంతనామానికి తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: הָאֲשׁוּרִי
  choice: అష్షూరీయులు
  rationale: మసొరా పాఠంలోని నిర్దిష్ట జాతివాచక ఏకవచనాన్ని సమూహార్థకంగా తీసుకొని అనువదించాం. ‘ఆషేరు’ అనే పాఠార్థ సంభావ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: יִזְרְעֶאל
  choice: యెజ్రెయేలు
  rationale: స్థలనామానికి సాధారణ తెలుగు లిప్యంతరీకరణ.
- source_word: אֶפְרַיִם
  choice: ఎఫ్రాయిము
  rationale: గోత్రనామానికి సాధారణ తెలుగు బైబిలు రూపం.
- source_word: בִּנְיָמִן
  choice: బెన్యామీను
  rationale: గోత్రనామానికి సాధారణ తెలుగు బైబిలు రూపం.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: ఇశ్రాయేలు అంతటికీ
  rationale: כֻּלֹּה సూచించే సంపూర్ణ పరిధిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הָאֲשׁוּרִי అనే క్లిష్ట పదం గుర్తింపు
  choice: అష్షూరీయులు
  alternative: ఆషేరు గోత్రం లేదా ఆషేరు ప్రాంతం
  rationale: ప్రధాన పాఠంలో WLC/మసొరా స్వరచిహ్నిత రూపాన్ని అనుసరించి, పాఠంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో తెలియజేశాం; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ప్రాంతాలు/ప్రజల వరుసను నిలిపి, క్లిష్టమైన הָאֲשׁוּרִי పాఠాన్ని గుర్తుతో కూడిన పాదటిప్పణిలో వివరించాం.
