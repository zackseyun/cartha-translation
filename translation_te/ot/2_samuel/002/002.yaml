  text: וַ/יַּ֤עַל שָׁם֙ דָּוִ֔ד וְ/גַ֖ם שְׁתֵּ֣י נָשָׁ֑י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵלִ֔ית וַ/אֲבִיגַ֕יִל אֵ֖שֶׁת נָבָ֥ל הַֽ/כַּרְמְלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: te
  text: 'దావీదు అక్కడికి పైకి వెళ్లాడు; అతనితోపాటు అతని ఇద్దరు భార్యలు కూడా వెళ్లారు: యిజ్రెయేలీయురాలైన అహీనోయము, కర్మెలీయుడైన నాబాలు భార్య అబీగయీలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: అక్కడికి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశార్థం సందర్భంలో ప్రయాణాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అక్కడికి వెళ్లాడు’ సహజంగా ఉండి గమ్యస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది; భౌగోళిక ఎత్తును సందర్భం నిర్ధారించనందున ‘పైకి’ని బలవంతంగా చేర్చలేదు.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: అతనితోపాటు అతని ఇద్దరు భార్యలు కూడా వెళ్లారు
  rationale: וְגַם లోని చేర్పు భావాన్ని ‘కూడా’తో నిలిపి, హీబ్రూ వాక్యంలో అంతర్లీనంగా ఉన్న ప్రయాణ క్రియను తెలుగులో సహజత, స్పష్టత కోసం పునరుక్తి చేశాం.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: యిజ్రెయేలీయురాలైన అహీనోయము
  rationale: స్త్రీలింగ ప్రాంతీయ విశేషణం ఆమె యిజ్రెయేలు ప్రాంతానికి చెందినదని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా విశేషణాన్ని పేరుకు ముందు ఉంచాం.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: కర్మెలీయుడైన నాబాలు భార్య అబీగయీలు
  rationale: హీబ్రూ నిర్మాణంలో הַכַּרְמְלִי నాబాలును విశేషిస్తుంది. అబీగయీలు ఇప్పుడు దావీదు భార్య అయినప్పటికీ, మూలపాఠం ఆమెను నాబాలుతో ఉన్న పూర్వ సంబంధం ద్వారా గుర్తిస్తుంది; ఆ సాహిత్య సంబంధాన్ని అలాగే ఉంచాం.
theological_decisions:
- issue: అబీగయీలును ‘నాబాలు భార్య’గా పేర్కొనడం
  choice: మూలపాఠంలోని గుర్తింపు విధానాన్ని యథాతథంగా నిలిపాం
  alternative: ‘నాబాలు విధవరాలు’ లేదా ‘మునుపు నాబాలు భార్య’ అని స్పష్టీకరించడం
  rationale: మూల హీబ్రూలో ‘మునుపు’ లేదా ‘విధవరాలు’ అనే పదాలు లేవు. కథా సందర్భం ఆ విషయాన్ని తెలియజేసినా, అనువాదంలో దానిని చేర్చడం మూలంలోని వ్యక్తీకరణను వివరణాత్మకంగా మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి, ప్రాంత నామాలకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ రూపాలు ఉపయోగించబడ్డాయి. మూలంలో లేని వివరణను చేర్చకుండా, జాబితా నిర్మాణాన్ని స్పష్టంగా ఉంచాం.
