  text: וַ/יִּקְרָ֨א אַבְנֵ֜ר אֶל יוֹאָ֗ב וַ/יֹּ֨אמֶר֙ הֲ/לָ/נֶ֨צַח֙ תֹּ֣אכַל חֶ֔רֶב הֲ/ל֣וֹא יָדַ֔עְתָּה כִּֽי מָרָ֥ה תִהְיֶ֖ה בָּ/אַחֲרוֹנָ֑ה וְ/עַד מָתַי֙ לֹֽא תֹאמַ֣ר לָ/עָ֔ם לָ/שׁ֖וּב מֵ/אַחֲרֵ֥י אֲחֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: te
  text: అప్పుడు అబ్నేరు యోవాబును పిలిచి, “ఖడ్గం ఎప్పటికీ మింగుతూనే ఉండాలా? చివరికి ఫలితం చేదుగా ఉంటుందని నీకు తెలియదా? తమ సహోదరులను వెంబడించడం మాని వెనుదిరగమని ప్రజలకు చెప్పడానికి నీకు ఇంకా ఎంతకాలం పడుతుంది?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: ఎప్పటికీ
  rationale: అంతం లేకుండా కొనసాగడాన్ని ప్రశ్నించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תֹּאכַל חֶרֶב
  choice: ఖడ్గం మింగుతూనే ఉండాలా
  rationale: ఖడ్గాన్ని మింగే వ్యక్తిగా చిత్రించే హీబ్రూ రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: מָרָה
  choice: చేదుగా
  rationale: యుద్ధం కొనసాగితే కలిగే దుఃఖకరమైన అంతిమ ఫలితాన్ని సూచించే మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: בָּאַחֲרוֹנָה
  choice: చివరికి
  rationale: కొనసాగుతున్న పోరాటం యొక్క అంతిమ పరిణామాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: וְעַד מָתַי
  choice: ఇంకా ఎంతకాలం
  rationale: యోవాబు చర్య తీసుకోవడంలో జరుగుతున్న ఆలస్యాన్ని ప్రశ్నించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תֹאמַר לָעָם
  choice: ప్రజలకు చెప్పడానికి
  rationale: אמר యొక్క ‘చెప్పు’ అనే సాధారణ అర్థాన్ని నిలుపుతూ, మూలంలో లేనంతగా అధికారిక ఆజ్ఞ భావాన్ని చేర్చదు.
- source_word: לָשׁוּב
  choice: మానుకొని వెనుదిరగమని
  rationale: ఈ సందర్భంలో వెంబడింపును ఆపి తిరిగి వెళ్లడం ఉద్దేశ్యం; ‘వెనుదిరుగు’ మూలక్రియను, ‘మానుకొని’ సందర్భార్థాన్ని స్పష్టం చేస్తాయి.
- source_word: מֵאַחֲרֵי
  choice: వెంబడించడం
  rationale: అక్షరార్థంగా ‘వెనుక నుండి/వెనుక వెళ్లడం’; యుద్ధ సందర్భంలో ఇది సైనిక వెంబడింపును సహజంగా తెలియజేస్తుంది.
- source_word: אֲחֵיהֶם
  choice: తమ సహోదరులను
  rationale: ఇశ్రాయేలీయులు తమ సొంత ప్రజలతో పోరాడుతున్నారనే కుటుంబ, నిబంధన సంబంధిత తీవ్రతను మూలానికి దగ్గరగా నిలుపుతుంది.
