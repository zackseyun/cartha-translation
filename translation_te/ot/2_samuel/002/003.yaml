translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. భౌగోళిక ఆరోహణ భావాన్ని ‘పైకి’తో నిలిపి, పురాతన ‘ఇల్లు’ అనే సామూహిక భావాన్ని పాఠకులకు స్పష్టమైన ‘కుటుంబం’గా వ్యక్తం చేసింది.
