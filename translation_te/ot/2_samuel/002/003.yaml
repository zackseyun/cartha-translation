revisions:
- from: దావీదు తనతో ఉన్న మనుష్యులను కూడా తీసుకొని పైకి వెళ్లాడు; ప్రతి ఒక్కరూ తమ తమ కుటుంబంతో వెళ్లారు. వారు హెబ్రోను పట్టణాల్లో[a] నివాసమున్నారు.
  to: దావీదు తనతో ఉన్న మనుష్యులను, ఒక్కొక్కరిని వారి వారి కుటుంబాలతో కూడ, పైకి తీసుకువెళ్లాడు; వారు హెబ్రోను పట్టణాల్లో[a] నివసించారు.
  rationale: The revision restores David as the sole grammatical agent of ‘brought up’ and retains the distributive sense that each man was brought with his own household. It also renders the subsequent plural verb as the group’s settling/residing in Hebron’s towns without adding a separate journey.
