  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנָשָׁ֧י/ו אֲשֶׁר עִמּ֛/וֹ הֶעֱלָ֥ה דָוִ֖ד אִ֣ישׁ וּ/בֵית֑/וֹ וַ/יֵּשְׁב֖וּ בְּ/עָרֵ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: te
  text: దావీదు తనతో ఉన్న మనుష్యులను, ఒక్కొక్కరిని వారి వారి కుటుంబాలతో కూడ, పైకి తీసుకువెళ్లాడు; వారు హెబ్రోను పట్టణాల్లో[a] నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హెబ్రోను ప్రాంతంలోని పట్టణాల్లో.” హీబ్రూ పదబంధం హెబ్రోను అనే ఒకే పట్టణ కేంద్రాన్ని కాకుండా, దాని పరిసర ప్రాంతానికి చెందిన నివాసస్థలాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: తనతో ఉన్న మనుష్యులను
  rationale: ఈ పదబంధం దావీదుతో ఉన్న పురుష సహచరులను సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో స్వామ్యార్థం తరువాతి సంబంధవాక్యంతో స్పష్టమవుతుంది.
- source_word: הֶעֱלָה
  choice: తీసుకొని పైకి వెళ్లాడు
  rationale: హిఫిల్ రూపం ‘పైకి తీసుకువెళ్లడం’ అనే భావాన్ని ఇస్తుంది. హెబ్రోను కొండప్రాంతానికి జరిగిన భౌగోళిక ఆరోహణను ‘పైకి’ నిలుపుతుంది; తెలుగులో కర్త కూడా ప్రయాణించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ וּבֵיתוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ కుటుంబంతో
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు’ అని, בֵּיתוֹ గృహసభ్యులు లేదా కుటుంబం అని సూచిస్తుంది. ‘తమ తమ’ ప్రతి వ్యక్తికి చెందిన కుటుంబాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ
  choice: నివాసమున్నారు
  rationale: కొత్త ప్రదేశానికి వెళ్లి అక్కడ స్థిరంగా ఉండటం అనే సందర్భార్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: హెబ్రోను పట్టణాల్లో
  rationale: עָרֵי అనేది ‘పట్టణాలు/నగరాలు’ అనే బహువచన నిర్మాణం. ఇక్కడ హెబ్రోను ప్రాంతానికి చెందిన నివాసస్థలాలు ఉద్దేశించబడి ఉండవచ్చు; ‘పట్టణాలు’ ఆ పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించింది.
