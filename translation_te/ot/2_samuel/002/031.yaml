  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: te
  text: అయితే దావీదు సేవకులు బెన్యామీనీయులలోను అబ్నేరు మనుష్యులలోను మూడువందల అరవై మందిని కొట్టగా, వారు చనిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు దావీదు సేవకులు…” హీబ్రూ అనుసంధాన పదాన్ని సాధారణంగా “మరియు” అని కూడా అనువదించవచ్చు; అయితే ముందటి వచనంలోని మృతుల సంఖ్యతో ఉన్న వ్యత్యాసాన్ని చూపడానికి ప్రధాన పాఠంలో “అయితే” అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: అయితే దావీదు సేవకులు
  rationale: וְ సందర్భంలో ముందటి వచనంలోని దావీదు పక్షపు నష్టాలకు ఇక్కడి ప్రత్యర్థి పక్షపు నష్టాలను వ్యతిరేకంగా చూపుతుంది; అందువల్ల సహజమైన తెలుగులో ‘అయితే’ అని అనువదించాం. עַבְדֵי ఇక్కడ బానిసత్వాన్ని ప్రధానంగా సూచించకుండా దావీదు సేవలోని సైనికులను సూచిస్తుంది కాబట్టి ‘సేవకులు’ అని ఇచ్చాం.
- source_word: הִכּוּ
  choice: హతమార్చారు
  rationale: נכה యుద్ధ సందర్భంలో కొట్టి పడవేయడం లేదా చంపడం అనే భావాన్ని ఇస్తుంది; చివరి מֵתוּ మరణాన్ని స్పష్టం చేస్తుంది. తెలుగులో అనవసర పునరుక్తి లేకుండా రెండు భావాల ఫలితాన్ని ‘హతమార్చారు’ సహజంగా తెలియజేస్తుంది.
- source_word: מִ/בִּנְיָמִן
  choice: బెన్యామీనీయులలోనూ
  rationale: מִן నష్టపోయినవారు ఏ సమూహానికి చెందినవారో సూచిస్తుంది. గోత్రనామాన్ని వ్యక్తుల సమూహంగా సహజంగా వ్యక్తం చేయడానికి ‘బెన్యామీనీయులలో’ అని ఇచ్చాం.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: అబ్నేరు మనుష్యులలోనూ
  rationale: ఈ పదబంధం హతులైనవారిలోని మరో సమూహాన్ని గుర్తిస్తుంది. אַנְשֵׁי సందర్భానుసారం అబ్నేరు ఆధీనంలోని యోధులను సూచించినా, మూలంలోని సాధారణ పదాన్ని కాపాడేందుకు ‘మనుష్యులు’ అని అనువదించాం.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: మూడువందల అరవై మందిని
  rationale: సంఖ్యను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా ఇచ్చి, వ్యక్తులకు తగిన ‘మంది’ వర్గసూచకాన్ని ఉపయోగించాం.
- source_word: מֵתוּ
  choice: హతమార్చారు అనే క్రియలో అంతర్భూతం
  rationale: హీబ్రూ వాక్యంలో ‘కొట్టారు’ మరియు ‘చనిపోయారు’ రెండూ ఉన్నాయి. తెలుగులో ‘హతమార్చారు’ ప్రహారం మరియు మరణఫలితం రెండింటినీ సహజంగా కలుపుతుంది; ‘చనిపోయారు’ అని మళ్లీ చేర్చడం భారమైన పునరుక్తి అవుతుంది.
