id: 2SA.2.28
reference: 2 Samuel 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: te
  text: అప్పుడు యోవాబు బాకా[a] ఊదాడు. ప్రజలందరూ ఆగిపోయారు; వారు ఇక ఇశ్రాయేలును తరుమలేదు, పోరాటాన్ని కొనసాగించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొమ్ము బూర’; హీబ్రూ పదం שׁוֹפָר సంకేతమివ్వడానికి ఉపయోగించే కొమ్ము వాద్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: ఊదాడు
  rationale: שׁוֹפָר అనే సంకేత వాద్యంతో వాడినప్పుడు תקע అంటే దానిని ఊదడం లేదా మోగించడం. తెలుగులో ‘బాకా ఊదాడు’ సహజమైన ప్రయోగం.
- source_word: בַּשּׁוֹפָר
  choice: బాకా
  rationale: שׁוֹפָר అనేది సంకేతమివ్వడానికి ఊదే కొమ్ము వాద్యం. ‘బాకా’ ఆధునిక తెలుగు పాఠకులకు వాద్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; దాని కొమ్ము స్వరూపాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: ప్రజలందరూ ఆగిపోయారు
  rationale: עמד అక్షరార్థంగా ‘నిలబడ్డారు’ అయినా, ఈ సైనిక సందర్భంలో ముందుకు సాగడం లేదా వెంబడించడం ఆపారని సూచిస్తుంది. ‘ఆగిపోయారు’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలందరూ
  rationale: హీబ్రూ పాఠంలో ‘ప్రజలు’ అనే సాధారణ పదమే ఉంది. సందర్భంలో ఇది యోవాబు వెంటనున్న సైనికులను సూచించినా, మూలంలోని విస్తృత పదాన్ని నిలుపుకున్నాం.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: వారు ఇక ఇశ్రాయేలును తరుమలేదు
  rationale: רדף אחרי అంటే ‘వెంటబడడం/తరుమడం’; నిరాకరణతో కూడిన עוֹד ‘ఇక’ లేదా ‘ఇకపై కాదు’ అనే భావాన్నిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం ‘ఇశ్రాయేలు’ అనే పేరునే వాడుతుంది. సందర్భంలో అబ్నేరు నాయకత్వంలోని ఇశ్రాయేలు దళాన్ని సూచించినప్పటికీ, ప్రధాన పాఠంలో ఆ పేరునే నిలుపుకున్నాం.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: పోరాటాన్ని కొనసాగించలేదు
  rationale: יסף + క్రియాధాతురూపం ఒక పని మరింత చేయడం లేదా కొనసాగించడం అనే భావాన్నిస్తుంది. నిరాకరణతో ఇది పోరాటాన్ని ఇక కొనసాగించలేదని చెబుతుంది.
