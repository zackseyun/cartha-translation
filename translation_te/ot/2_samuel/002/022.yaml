source:
  edition: WLC
  text: וַ/יֹּ֧סֶף ע֣וֹד אַבְנֵ֗ר לֵ/אמֹר֙ אֶל עֲשָׂהאֵ֔ל ס֥וּר לְ/ךָ֖ מֵ/אַֽחֲרָ֑/י לָ֤/מָּה אַכֶּ֨/כָּה֙ אַ֔רְצָ/ה וְ/אֵיךְ֙ אֶשָּׂ֣א פָנַ֔/י אֶל יוֹאָ֖ב אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: te
  text: 'అబ్నేరు అసాహేలుతో మళ్లీ ఇలా అన్నాడు: “నన్ను వెంబడించడం మాని పక్కకు తప్పుకో. నేను నిన్ను నేలకూలేలా ఎందుకు కొట్టాలి? అప్పుడు నీ సహోదరుడైన యోవాబును నేను ముఖమెత్తి ఎలా చూడగలను?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సహోదరుడైన యోవాబును నేను ఎలా ఎదుర్కోగలను?” హీబ్రూలో అక్షరార్థంగా, “నీ సహోదరుడైన యోవాబు వైపు నా ముఖాన్ని ఎలా ఎత్తగలను?”
    reason: ‘ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారానికి సహజమైన అర్థాన్ని తెలియజేస్తూనే దాని అక్షరార్థ రూపాన్ని కూడా నమోదు చేయడం.
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... לֵאמֹר
  choice: మళ్లీ ఇలా అన్నాడు
  rationale: ‘మరల జోడించి చెప్పాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం; మరొకసారి మాట్లాడాడనే భావాన్ని నిలుపుతుంది.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: నన్ను వెంబడించడం మాని పక్కకు తప్పుకో
  rationale: סוּר లోని పక్కకు తొలగే భావాన్నీ, מֵאַחֲרָי లోని వెంబడించే భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: నేను నిన్ను నేలకూలేలా ఎందుకు కొట్టాలి?
  rationale: נכה ను ‘కొట్టు’గానూ, אַרְצָה ను ‘నేలకూలేలా’గానూ వ్యక్తం చేసి దృశ్యాన్ని నిలుపుతుంది; దీనిని నేరుగా ‘చంపు’ అని వ్యాఖ్యానించదు.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: అప్పుడు ... నేను ముఖమెత్తి ఎలా చూడగలను?
  rationale: ‘నా ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజమైన ‘ముఖమెత్తి చూడడం’ అనే నుడికారంతో నిలుపుతుంది; సిగ్గు లేదా అపరాధభావం వల్ల ఎదుర్కోలేని స్థితిని సూచిస్తుంది.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: నీ సహోదరుడైన యోవాబును
  rationale: ఎవరిని ఎదుర్కోవలసి వస్తుందో స్పష్టంగా తెలుపుతూ బంధుత్వాన్ని పూర్తిగా నిలుపుతుంది.
- source_word: אַבְנֵר / עֲשָׂהאֵל / יוֹאָב
  choice: అబ్నేరు / అసాహేలు / యోవాబు
  rationale: మూలభాష ఉచ్చారణను అనుసరించే, తెలుగులో సులభంగా చదవగల వ్యక్తినామ రూపాలు.
