translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. ‘ముఖమెత్తి చూడగలను’ అనే సహజ తెలుగు నుడికారం ద్వారా మూలంలోని రూపకాన్ని నిలుపుతూ, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
