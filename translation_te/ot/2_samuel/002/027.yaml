  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: te
  text: 'యోవాబు ఇలా అన్నాడు: “దేవుడు జీవిస్తున్నంత నిశ్చయంగా చెబుతున్నాను—నీవు మాట్లాడకపోయి ఉంటే, ప్రజలు ఉదయం నుంచే[a] ప్రతి ఒక్కరూ తన సహోదరుణ్ణి వెంబడించడం మానేసి వెనుదిరిగేవారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తెల్లవారినప్పటి నుంచే.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పైకి వెళ్లిపోయేవారు.” అంటే, ప్రతి ఒక్కరూ తన సహోదరుణ్ణి వెంబడించడం ఆపివేసేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: దేవుడు జీవిస్తున్నంత నిశ్చయంగా చెబుతున్నాను
  rationale: ఇది ప్రమాణాన్ని సూచించే హీబ్రూ సూత్రప్రయోగం. తెలుగులో సహజంగా, గంభీరంగా ఉండేలా దాని నిశ్చయార్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: నువ్వు మాట్లాడకపోయి ఉంటే
  rationale: జరిగిన వాస్తవానికి విరుద్ధమైన షరతును తెలిపే నిర్మాణాన్ని తెలుగులో సహజమైన భూతకాల ప్రతికల్పనగా అనువదించింది; ‘మాట్లాడు’ అనే క్రియకు మూలంలో లేని కర్మను చేర్చలేదు.
- source_word: כִּי אָז
  choice: అయితే/అప్పుడు అనే భావం వాక్య నిర్మాణంలో అంతర్లీనంగా
  rationale: ప్రతికల్పన ఫలితాన్ని తెలుగులోని ‘ఉంటే ... వెళ్లిపోయేవారు’ నిర్మాణమే స్పష్టంగా తెలియజేస్తుంది; కణాలను విడివిడిగా అతిగా అనువదించలేదు.
- source_word: מֵהַבֹּקֶר
  choice: ఉదయం నుంచే
  rationale: מן ఉపసర్గ సూచించే ఆరంభకాల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అందించింది.
- source_word: נַעֲלָה
  choice: వెళ్లిపోయేవారు
  rationale: עלה యొక్క ప్రాథమిక గమనార్థాన్ని నిలుపుతూ, ఈ సైనిక సందర్భంలో అసహజంగా వినిపించే ‘పైకి వెళ్లేవారు’ అనే పదబంధాన్ని నివారించింది. సందర్భానుసారమైన ‘వెనుదిరిగేవారు’ అనే భావాన్ని పాదటీపులో ఇచ్చింది.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: ప్రతి ఒక్కరూ తన సహోదరుణ్ణి వెంబడించడం మానేసేవారు
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కడు తన సహోదరుని వెనుకనుండి’ అనే నిర్మాణం ఇక్కడ వెంటపడటాన్ని విరమించడాన్ని సూచిస్తుంది. తెలుగులో అర్థవంతంగా ఉండేలా సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో తెలిపింది; ‘సహోదరుడు’ అనే ఇశ్రాయేలీయ సహజాతి భావచిత్రాన్ని నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ప్రమాణ సూత్రం యొక్క బలాన్ని నిలిపి, సైనిక సందర్భంలోని עלה పదానికి ఉన్న గమనార్థం మరియు వెనుదిరిగే సందర్భార్థం రెండింటినీ ప్రధాన పాఠ్యం–పాదటీపుల ద్వారా సంరక్షించింది.
