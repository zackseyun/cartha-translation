  text: וַ/יִּרְדֹּ֥ף עֲשָׂהאֵ֖ל אַחֲרֵ֣י אַבְנֵ֑ר וְ/לֹֽא נָטָ֣ה לָ/לֶ֗כֶת עַל הַ/יָּמִין֙ וְ/עַֽל הַ/שְּׂמֹ֔אול מֵ/אַחֲרֵ֖י אַבְנֵֽר־־־׃
