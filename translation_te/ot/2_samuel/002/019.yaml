  yaml_path: translation/ot/2_samuel/002/019.yaml
  text: Asahel pursued Abner[a], and he did not turn to the right or to the left from following Abner.
translation:
  language: te
  text: అసాహేలు అబ్నేరును వెంబడించాడు[a]; అబ్నేరు వెనుక వెళ్తూ అతడు కుడివైపుకైనా ఎడమవైపుకైనా మళ్లలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అసాహేలు అబ్నేరు వెనుక పరుగెత్తాడు; అబ్నేరు వెనుక నుంచి కుడివైపుకైనా ఎడమవైపుకైనా మళ్లలేదు.”
    reason: רדףకు ‘పరుగెత్తాడు/వెంటపడ్డాడు’ అనే పదప్రత్యామ్నాయం, అలాగే מֵאַחֲרֵי אַבְנֵר యొక్క మరింత అక్షరానువాదమైన ‘అబ్నేరు వెనుక నుంచి’ భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: వెంబడించాడు
  rationale: רדף ఇక్కడ చురుకుగా, కొనసాగిస్తూ వెంటపడటాన్ని సూచిస్తుంది; ‘వెంబడించాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אַחֲרֵי אַבְנֵר
  choice: అబ్నేరును
  rationale: ‘వెంబడించు’ అనే తెలుగు సకర్మక క్రియతో వ్యక్తిని ప్రత్యక్ష కర్మగా చెప్పడం సహజం; మూలంలోని ‘అబ్నేరు వెనుక’ అనే సంబంధం క్రియలోనే వ్యక్తమవుతుంది.
- source_word: וְלֹא נָטָה
  choice: తొలగలేదు
  rationale: נטה ఇక్కడ నిర్దిష్ట దారి లేదా గమనం నుంచి పక్కకు మళ్లడాన్ని సూచిస్తుంది; ‘తొలగలేదు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָלֶכֶת
  choice: వెంబడించడంలో
  rationale: לָלֶכֶת అక్షరార్థంగా ‘వెళ్లడానికి/వెళ్లడంలో’; ఈ సందర్భంలో పక్కకు మళ్లకుండా సాగిన చర్యను తెలుగులో సహజంగా తెలియజేయడానికి ‘వెంబడించడంలో’ అని అనువదించబడింది.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: కుడివైపుకుగానీ ఎడమవైపుకుగానీ
  rationale: దారి నుంచి ఏ వైపుకూ మళ్లలేదనే హెబ్రీ జాతీయాన్ని స్పష్టమైన, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: అబ్నేరును వెంబడించడంలో
  rationale: అక్షరార్థంగా ‘అబ్నేరు వెనుకనుంచి/అబ్నేరు వెనుక వెళ్లడం నుంచి’; సందర్భంలో అతని వెంబడి సాగిన మార్గం నుంచి తొలగకపోవడమే భావం.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: అసాహేలు / అబ్నేరు
  rationale: తెలుగు బైబిలు పఠన సంప్రదాయానికి అనుగుణంగా, మూల నామాల ధ్వనిని గుర్తించదగిన విధంగా లిప్యంతరీకరించాం.
