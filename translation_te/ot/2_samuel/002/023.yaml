base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: te
  text: కానీ అతడు పక్కకు తప్పుకోవడానికి నిరాకరించాడు. అందుచేత అబ్నేరు ఈటె వెనుక చివరతో అతని కడుపులో పొడిచాడు[a]. ఆ ఈటె అతని వెనుక నుంచి బయటికి వచ్చింది. అతడు అక్కడే పడిపోయి, అక్కడికక్కడే చనిపోయాడు. అశాహేలు పడిపోయి చనిపోయిన చోటికి వచ్చిన ప్రతి ఒక్కరూ ఆగి నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కడుపు” అని అనువదించిన హెబ్రీయ పదం חֹמֶשׁ యొక్క ఖచ్చితమైన శరీరభాగ సూచన స్పష్టంగా లేదు. కొన్ని పాత అనువాదాల్లో దీనిని “ఐదవ పక్కటెముక” అని అనువదించారు; ఇక్కడ ఇది సాధారణంగా ఉదరం లేదా కడుపు ప్రాంతాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: పక్కకు తప్పుకోవడానికి నిరాకరించాడు
  rationale: మָאֵן‌లోని స్పష్టమైన నిరాకరణ భావాన్ని, סוּר‌లోని దారి నుంచి పక్కకు తొలగే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיַּכֵּהוּ
  choice: పొడిచాడు
  rationale: నכה సాధారణంగా ‘కొట్టాడు’ అయినప్పటికీ, ఈటె శరీరాన్ని చీల్చుకొని వెనుక నుంచి బయటికి వచ్చిన సందర్భంలో తెలుగులో ‘పొడిచాడు’ చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: ఈటె వెనుక కొనతో
  rationale: ఈటె యొక్క వెనుక భాగాన్ని సూచించే హెబ్రీయ పదబంధాన్ని తెలుగులో అర్థమయ్యేలా చెబుతుంది; అది ముందరి మొన కాదనే భేదాన్ని కాపాడుతుంది.
- source_word: אֶל הַחֹמֶשׁ
  choice: అతని కడుపులో
  rationale: חֹמֶשׁ ఒక క్లిష్టమైన శరీరభాగ పదం. ఈ యుద్ధ సందర్భంలో ఉదరం లేదా కడుపు ప్రాంతం అనే విస్తృత అర్థం ఎక్కువ సంభావ్యమైనది; ‘ఐదవ పక్కటెముక’ అనే సంప్రదాయ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: ఆ ఈటె అతని వెనుక నుంచి బయటికి వచ్చింది
  rationale: ఈటె శరీరాన్ని దాటి వెనుక వైపు బయటికి వచ్చిన దృశ్యాన్ని హెబ్రీయ వాక్యానికి దగ్గరగా ఉంచుతుంది.
- source_word: וַיָּמָת תַּחְתָּו
  choice: అక్కడికక్కడే చనిపోయాడు
  rationale: תַּחְתָּו ఇక్కడ అతడు పడిన అదే చోట వెంటనే మరణించాడనే సందర్భోచిత భావాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: וַיַּעֲמֹדוּ
  choice: ఆగి నిలిచారు
  rationale: עמד ఇక్కడ కేవలం నిలబడటం కాక, ఆ స్థలానికి వచ్చి ఆగిపోవడాన్ని సూచిస్తుంది; రెండు భావాలను ఈ పదబంధం స్పష్టంగా వ్యక్తం చేస్తుంది.
