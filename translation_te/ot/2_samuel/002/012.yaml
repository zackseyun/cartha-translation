- from: అప్పుడు నేరు కుమారుడైన అబ్నేరు, సౌలు కుమారుడైన ఇష్బోషెతు[a] సేవకులు మహనయీము నుండి గిబియోనుకు బయలుదేరారు.
  to: అప్పుడు నేరు కుమారుడైన అబ్నేరు మరియు సౌలు కుమారుడైన ఇష్బోషెతు[a] సేవకులు మహనయీము నుండి గిబియోనుకు బయలుదేరారు.
