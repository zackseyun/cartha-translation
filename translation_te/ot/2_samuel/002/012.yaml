id: 2SA.2.12
reference: 2 Samuel 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: te
  text: అప్పుడు నేరు కుమారుడైన అబ్నేరు మరియు సౌలు కుమారుడైన ఇష్బోషెతు[a] సేవకులు మహనయీము నుండి గిబియోనుకు బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో ‘ఇష్-బోషెత్’; ఇదే వ్యక్తిని 1 దినవృత్తాంతాలు 8:33; 9:39లో ‘ఎష్బాాలు’ అని పిలుస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: అప్పుడు ... బయలుదేరారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి సహజమైన తెలుగు కథనశైలిలో ‘అప్పుడు’ అని అనువదించాం. హెబ్రీ క్రియ ఏకవచనంలో ఉన్నప్పటికీ, దాని తరువాత అబ్నేరు మరియు సేవకులు కలిపి కర్తలుగా ఉన్నందున తెలుగులో సహజంగా బహువచన క్రియ వాడాం.
- source_word: אַבְנֵר בֶּן נֵר
  choice: నేరు కుమారుడైన అబ్నేరు
  rationale: వ్యక్తినామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో తెలిపాం.
- source_word: וְעַבְדֵי
  choice: సేవకులు
  rationale: עֶבֶד అనే పదానికి సేవకుడు, అధికారి, అనుచరుడు వంటి భావాలు ఉండవచ్చు. ఇక్కడ సైనిక-రాజకీయ పరిసరమున్నా వారి నిర్దిష్ట హోదాను మూలపాఠం చెప్పదు; అందువల్ల విస్తృతమైన ‘సేవకులు’ అనే పదాన్ని నిలిపాం.
- source_word: אִישׁ בֹּשֶׁת
  choice: ఇష్బోషెతు
  rationale: మసొరెటిక్ పాఠంలోని పేరును తెలుగు లిపిలో ప్రతిబింబించాం; దినవృత్తాంతాలలో కనిపించే ప్రత్యామ్నాయ నామరూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: בֶּן שָׁאוּל
  choice: సౌలు కుమారుడైన
  rationale: ఇష్బోషెతును గుర్తించే పితృనామ సంబంధాన్ని నేరుగా, సహజమైన తెలుగు నిర్మాణంలో అనువదించాం.
- source_word: מִמַּחֲנַיִם
  choice: మహనయీము నుండి
  rationale: מִן అనే ఉపసర్గలోని బయలుదేరిన స్థల భావాన్ని ‘నుండి’తో తెలిపి, స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: גִּבְעֹנָה
  choice: గిబియోనుకు
  rationale: స్థలనామానికి జతచేసిన దిశాసూచక ה గిబియోను వైపు గమనాన్ని సూచిస్తుంది; సందర్భంలో గమ్యాన్ని సహజంగా తెలియజేయడానికి ‘గిబియోనుకు’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన కథనశైలిని ఉపయోగించాం. వ్యక్తి, స్థలనామాలకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలను అనుసరించాం.
