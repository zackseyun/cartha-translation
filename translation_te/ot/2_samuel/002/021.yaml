  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సైనిక సందర్భాన్ని స్పష్టం చేస్తూనే חֲלִצָתוֹ పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
