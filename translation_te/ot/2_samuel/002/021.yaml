source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ אַבְנֵ֗ר נְטֵ֤ה לְ/ךָ֙ עַל יְמִֽינְ/ךָ֙ א֣וֹ עַל שְׂמֹאלֶ֔/ךָ וֶ/אֱחֹ֣ז לְ/ךָ֗ אֶחָד֙ מֵֽ/הַ/נְּעָרִ֔ים וְ/קַח לְ/ךָ֖ אֶת חֲלִצָת֑/וֹ וְ/לֹֽא אָבָ֣ה עֲשָׂהאֵ֔ל לָ/ס֖וּר מֵ/אַחֲרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: te
  text: 'అప్పుడు అబ్నేరు అతనితో ఇలా అన్నాడు: “నీ కుడివైపునకో ఎడమవైపునకో తప్పుకో; యువకుల్లో ఒకణ్ణి పట్టుకో; అతని యుద్ధసామగ్రిని నీకోసం తీసుకో[a].” అయితే అశాహేలు అతని వెనుకనుండి తప్పుకోవడానికి ఇష్టపడలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని కవచాన్ని నీకోసం తీసుకో.” హీబ్రూ పదం బహుశా పడిపోయిన యోధుని నుంచి తీసిన సామగ్రిని సూచిస్తుంది; కచ్చితంగా ఏ వస్తువో పూర్తిగా స్పష్టం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  choice: పక్కకు తప్పుకొని
  rationale: వెంబడిస్తున్న ప్రస్తుత దారి నుంచి మరో వైపుకు మళ్లమనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: నీ కుడివైపుకో ఎడమవైపుకో
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయాలను నిలుపుతూ, రెండు ప్రత్యామ్నాయ దిశలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וֶאֱחֹז לְךָ
  choice: పట్టుకొని
  rationale: אחז అనే పదంలోని ‘పట్టుకోవడం/చిక్కించుకోవడం’ అనే బలమైన భావాన్ని సైనిక సందర్భంలో అందిస్తుంది; לְךָ యొక్క స్వప్రయోజన భావం తరువాతి ‘నీకోసం’లో స్పష్టమవుతుంది.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: యువకుల్లో ఒకణ్ణి
  rationale: נְעָרִים అనే పదానికి ఉన్న ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ‘సైనికుడు’ అని హోదాను అతిగా నిర్దిష్టం చేయదు.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: అతని యుద్ధ సామగ్రిని నీకోసం తీసుకో
  rationale: חֲלִצָתוֹ ఇక్కడ ఓడిన యోధుని నుంచి తీసే వస్తువులను సూచించే అవకాశం ఉంది. ‘యుద్ధ సామగ్రి’ సందర్భానికి సరిపోతూ, అది కవచమేనని అనవసరంగా నిర్ధారించదు.
- source_word: וְלֹא אָבָה
  choice: ఇష్టపడలేదు
  rationale: אבה లోని సమ్మతి లేదా సుముఖత లేకపోవడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: అతన్ని వెంబడించడం మానుకొని పక్కకు తప్పుకోవడానికి
  rationale: ‘అతని వెనుకనుంచి తొలగడం’ అనే మూల చిత్రాన్ని, కొనసాగుతున్న వెంబడింపు సందర్భంలో స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
