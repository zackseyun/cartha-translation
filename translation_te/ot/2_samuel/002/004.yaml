id: 2SA.2.4
reference: 2 Samuel 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: te
  text: యూదా పురుషులు వచ్చి, అక్కడ దావీదును యూదా వంశంపై రాజుగా అభిషేకించారు. వారు దావీదుకు, “సౌలును పాతిపెట్టినవారు యాబేషు-గిలాదు పురుషులే” అని తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే క్రియ ఇక్కడ యూదా పురుషులు హెబ్రోనుకు వచ్చి చేరిన కథన సంఘటనను సూచిస్తుంది; తెలుగులో తదుపరి చర్యతో సహజంగా అనుసంధానించడానికి ‘వచ్చి’ అని అనువదించాం.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: యూదా పురుషులు
  rationale: אַנְשֵׁי అనే పదంలోని పురుషలింగ అర్థాన్ని నిలుపుతూ, ఈ సందర్భంలోని యూదా ప్రతినిధులను స్పష్టంగా సూచిస్తుంది.
- source_word: וַיִּמְשְׁחוּ
  choice: అభిషేకించారు
  rationale: రాజును నూనెతో అభిషేకించి అధికారంలో నియమించే משׁח క్రియకు తెలుగు బైబిలు భాషలో సహజమైన, రాజకీయ-దైవిక భావాన్ని నిలిపే పదం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: మునుపటి వచనంలో పేర్కొన్న హెబ్రోనును సూచించే స్థలవాచక క్రియావిశేషణాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: అభిషేకం ద్వారా దావీదుకు కలిగిన రాజపదవిని తెలుగులో సహజమైన విధేయపూరక రూపంతో తెలియజేస్తుంది.
- source_word: עַל בֵּית יְהוּדָה
  choice: యూదా వంశం మీద
  rationale: బֵּית అనే ‘ఇల్లు/గృహం’ రూపకానికి ఇక్కడ ఉన్న సామూహిక గోత్రార్థాన్ని ‘వంశం’ సహజంగా అందిస్తుంది; కేవలం భూభాగమైన యూదాగా పరిమితం చేయదు.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: అని దావీదుకు తెలియజేశారు
  rationale: נגד హిఫీల్‌లో ‘తెలియజేయు/వార్త చెప్పు’ అని అర్థం; לֵאמֹר పరిచయం చేసే సమాచారాన్ని తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో ‘అని’ సహజంగా సూచిస్తుంది.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: యాబేష్గిలాదుకు చెందిన పురుషులు
  rationale: స్థలనామాన్ని ‘యాబేష్గిలాదు’గా ఉంచి, אַנְשֵׁי యొక్క పురుషలింగ సూచనను స్పష్టంగా నిలిపింది.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: సౌలును పాతిపెట్టినవారు … పురుషులే
  rationale: సౌలును పాతిపెట్టిన వారి గుర్తింపుపై ఉన్న వాక్యబలాన్ని తెలుగు ‘వారే’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אַנְשֵׁי అనే పురుషలింగ సామూహిక పదం
  choice: రెండు చోట్లా ‘పురుషులు’ అని అనువదించడం
  alternative: ‘ప్రజలు’ లేదా ‘వారు’
  rationale: మూలపదం స్పష్టంగా పురుషులను సూచిస్తుంది; దానిని లింగనిరపేక్షంగా మార్చకుండా కథనంలోని ప్రతినిధి పురుషుల భావాన్ని నిలిపాం.
- issue: בֵּית יְהוּדָה లోని ‘గృహం’ రూపకం
  choice: ‘యూదా వంశం’
  alternative: ‘యూదా గృహం’ లేదా కేవలం ‘యూదా’
  rationale: ‘యూదా గృహం’ తెలుగులో ఈ సందర్భంలో కృత్రిమంగా వినిపించవచ్చు; ‘వంశం’ గోత్రసంబంధ సామూహిక భావాన్ని నిలుపుతుంది, అయితే కేవలం ‘యూదా’గా చేసి భావాన్ని సన్నగా చేయదు.
- issue: אֲשֶׁר קָבְרוּ చివరి ఉపవాక్యంలోని గుర్తింపు బలం
  choice: ‘పాతిపెట్టినవారు … పురుషులే’
  alternative: ‘సౌలును పాతిపెట్టిన యాబేష్గిలాదు పురుషులు’
  rationale: హీబ్రూ వాక్యం అందిస్తున్న గుర్తింపును తెలుగులో సంపూర్ణమైన, సహజమైన ప్రత్యక్ష వాక్యంగా వ్యక్తం చేస్తుంది; సాధారణ విశేషణ ఉపవాక్యంగా మాత్రమే మార్చి వాక్యబలాన్ని తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వరుస వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా ‘వచ్చి’ మరియు ‘ఆ తర్వాత’తో ప్రవాహాన్ని సహజం చేశాం. మూలంలో స్పష్టమైన పురుషలింగ సూచనను నిలిపాం; ‘యూదా వంశం’ ద్వారా గోత్రసామూహిక భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా అందించాం.
