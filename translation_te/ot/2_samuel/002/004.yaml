revisions:
- from: యూదా పురుషులు వచ్చి, అక్కడ దావీదును యూదా వంశం మీద రాజుగా అభిషేకించారు. ఆ తర్వాత, “సౌలును పాతిపెట్టినవారు యాబేష్గిలాదుకు చెందిన పురుషులే” అని దావీదుకు తెలియజేశారు.
  to: యూదా పురుషులు వచ్చి, అక్కడ దావీదును యూదా వంశంపై రాజుగా అభిషేకించారు. వారు దావీదుకు, “సౌలును పాతిపెట్టినవారు యాబేషు-గిలాదు పురుషులే” అని తెలియజేశారు.
  rationale: 'The revision retains the Hebrew’s identificational emphasis (‘పురుషులే’), its explicit male collectives, and the corporate sense of ‘house of Judah,’ while using smoother Telugu syntax and a conventional rendering of the place name. No footnote is needed: the English audit-trail note concerns an English stylistic alternative and has no corresponding unresolved Telugu ambiguity.'
