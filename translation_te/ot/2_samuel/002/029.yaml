source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: te
  text: అబ్నేరు, అతని మనుషులు ఆ రాత్రంతా అరాబా గుండా ప్రయాణించి, యొర్దాను నదిని దాటి, బిత్రోను అంతటా వెళ్లి[a], మహనయీముకు చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోయ లేదా గండికొండల ప్రాంతమంతా.’ ‘బిత్రోను’ అనే హీబ్రూ పదం స్థలనామమో, భౌగోళిక వర్ణనో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: అరాబా గుండా
  rationale: ఇక్కడ עֲרָבָה సాధారణమైన మైదానాన్ని కాక యొర్దాను లోయకు సంబంధించిన భౌగోళిక ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ. అందువల్ల స్థలనామ భావాన్ని నిలిపి ఉంచేలా ‘అరాబా’ అని లిప్యంతరీకరించాం.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: ఆ రాత్రంతా
  rationale: ఆ నిర్దిష్ట రాత్రి మొత్తం ప్రయాణం కొనసాగిందనే కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: యొర్దాను నదిని దాటి
  rationale: עבר అనే క్రియ ఇక్కడ నదిని ఒక వైపు నుంచి మరొక వైపుకు దాటడాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం ‘నది’ని చేర్చాం.
- source_word: כָּל הַבִּתְרוֹן
  choice: బిత్రోను ప్రాంతమంతటి గుండా
  rationale: הַבִּתְרוֹן ఒక స్థలనామమో, లోయ లేదా కనుమల ప్రాంతాన్ని వర్ణించే పదమో స్పష్టంగా లేదు. ప్రధాన పాఠ్యంలో పేరును నిలిపి, ‘ప్రాంతం’ ద్వారా ప్రయాణ మార్గ భావాన్ని సహజంగా తెలియజేశాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מַחֲנָיִם
  choice: మహనయీము
  rationale: ఇది స్థలనామం కనుక అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: ప్రయాణించి … గుండా వెళ్లి … చేరుకున్నారు
  rationale: 'మూడు చలన క్రియల కథన క్రమాన్ని సహజమైన తెలుగులో నిలిపాం: దీర్ఘ ప్రయాణం, ఒక ప్రాంతం గుండా సాగడం, గమ్యానికి చేరడం.'
- source_word: וַאֲנָשָׁיו
  choice: అతని మనుషులు
  rationale: మూలంలోని ‘అతని మనుషులు’ అనే విస్తృత భావాన్ని అలాగే ఉంచాం. సందర్భం సైనికమైనదైనా ‘సైనికులు’ అని ప్రత్యేకంగా నిర్ధారించలేదు.
