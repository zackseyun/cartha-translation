translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును ఉపయోగించాం. కథన గమనాన్ని ఒకే సహజ వాక్యంలో ఉంచి, స్థలనామాలను గౌరవప్రదమైన బైబిలు తెలుగు రూపాల్లో ఇచ్చాం. బిత్రోను గురించిన మూలభాషా అనిశ్చితిని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదసూచికలో నిలిపాం.
