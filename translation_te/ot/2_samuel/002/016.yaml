  text: וַֽ/יַּחֲזִ֜קוּ אִ֣ישׁ בְּ/רֹ֣אשׁ רֵעֵ֗/הוּ וְ/חַרְבּ/וֹ֙ בְּ/צַ֣ד רֵעֵ֔/הוּ וַֽ/יִּפְּל֖וּ יַחְדָּ֑ו וַ/יִּקְרָא֙ לַ/מָּק֣וֹם הַ/ה֔וּא חֶלְקַ֥ת הַצֻּרִ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: te
  text: ప్రతి మనిషి తన ప్రత్యర్థి తలను పట్టుకున్నాడు; తన ఖడ్గం తన ప్రత్యర్థి ప్రక్కలో ఉంది. అలా వారు కలిసి పడిపోయారు. అందువల్ల గిబియోనులో ఉన్న ఆ స్థలాన్ని హెల్కత్-హత్స్సూరీమ్[a] అని పిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హెల్కత్-హత్స్సూరీమ్’ అనేది హీబ్రూ స్థలనామానికి లిప్యంతరీకరణ. దాని ఖచ్చితమైన అర్థం అనిశ్చితం. ‘ప్రక్కల పొలం,’ ‘పదునైన ఖడ్గాల పొలం’ వంటి అర్థాలు ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ
  choice: పట్టుకున్నాడు
  rationale: חזק ఇక్కడ యుద్ధంలో బలంగా పట్టుకోవడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘తలను పట్టుకున్నాడు’ అనే ప్రయోగమే హింసాత్మక చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కడూ
  rationale: 'ఇది పంపిణీయ అర్థంలో ఉంది: పోరాడిన ప్రతి వ్యక్తి తనకు ఎదురుగా ఉన్న వ్యక్తిపై అదే చర్య చేశాడు.'
- source_word: בְּרֹאשׁ רֵעֵהוּ
  choice: తన ఎదుటివాని తలను
  rationale: רֹאשׁ అంటే నేరుగా ‘తల’; רֵעַ ఇక్కడ స్నేహితుడు అనే అర్థంలో కాక, జతగా ఎదురుపడిన ప్రత్యర్థిని సూచిస్తుంది. ‘ఎదుటివాడు’ ఆ సందర్భాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: అతని ఖడ్గం తన ఎదుటివాని పక్కలో దిగింది
  rationale: హీబ్రూలో ఈ భాగం క్రియలేని సంక్షిప్త యుద్ధ వర్ణన. తెలుగులో పూర్తి వాక్యానికి అవసరమైన క్రియగా ‘దిగింది’ వాడటం దృశ్యాన్ని సహజంగా అందిస్తూనే, ‘పొడిచాడు’ వంటి మరింత నిర్దిష్ట చర్యను అనవసరంగా చేర్చదు. צַד ను ‘పక్క’గా అనువదించాం.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: అలా వారందరూ కలిసే కూలిపోయారు
  rationale: יַחְדָּו ఒకేసారి లేదా కలిసి పడిపోవడాన్ని బలపరుస్తుంది. పన్నెండు జతల సమూహాన్ని సందర్భానుసారంగా ‘వారందరూ’ తెలియజేస్తుంది; ‘అలా’ ఫలిత సంబంధాన్ని చూపుతుంది.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: అందువల్ల ... ఆ స్థలానికి ... అని పేరు పెట్టారు
  rationale: హీబ్రూ ఏకవచన కర్త నిర్దిష్టంగా చెప్పబడలేదు; తెలుగులో అనిర్దిష్ట బహువచన క్రియ సహజమైన నిష్క్రియార్థాన్ని ఇస్తుంది. ‘అందువల్ల’ ఆ సంఘటనకు, పేరుపెట్టడానికి మధ్య ఫలిత సంబంధాన్ని చూపుతుంది.
- source_word: חֶלְקַת הַצֻּרִים
  choice: హెల్కత్-హస్సూరీమ్
  rationale: ఇది స్థలనామం. దాని వ్యుత్పత్తి, ఖచ్చితమైన అర్థం వివాదాస్పదం కాబట్టి అర్థాన్ని నిర్ణయించకుండా లిప్యంతరీకరించి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: గిబియోనులో ఉన్న
  rationale: ఈ సంబంధ వాక్యభాగం పేరుపెట్టబడిన స్థలం గిబియోనులో ఉందని గుర్తిస్తుంది; ఈ నిర్మాణం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
