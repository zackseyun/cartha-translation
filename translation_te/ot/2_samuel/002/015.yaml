translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని రెండు సమాన పక్షాల నిర్మాణాన్ని అర్ధవిరామంతో స్పష్టపరిచాం. వ్యక్తులను సూచించేందుకు ‘పన్నెండుగురు’ వాడాం; సైనిక సందర్భం ఉన్నప్పటికీ עבדים ను వ్యాఖ్యానాత్మకంగా ‘సైనికులు’ చేయకుండా ‘సేవకులు’గా ఉంచాం.
