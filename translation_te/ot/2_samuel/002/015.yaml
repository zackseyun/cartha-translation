source:
  edition: WLC
  text: וַ/יָּקֻ֖מוּ וַ/יַּעַבְר֣וּ בְ/מִסְפָּ֑ר שְׁנֵ֧ים עָשָׂ֣ר לְ/בִנְיָמִ֗ן וּ/לְ/אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וּ/שְׁנֵ֥ים עָשָׂ֖ר מֵ/עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: te
  text: 'అప్పుడు వారు లేచి, లెక్కచొప్పున దాటారు[a]: బెన్యామీను, సౌలు కుమారుడైన ఈష్‌బోషెతు[c] పక్షాన పన్నెండుగురు[b], దావీదు సేవకులలోనుండి పన్నెండుగురు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాటి వెళ్లారు’ లేదా ‘వెళ్లారు.’ హెబ్రీ క్రియ ఒక స్థలాన్ని దాటడాన్ని లేదా అటువైపుకు కదలడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బెన్యామీనులోనుండి.’ హెబ్రీ ఉపసర్గ మూలాన్ని గానీ అనుబంధాన్ని గానీ సూచించవచ్చు; ఇక్కడ వారు బెన్యామీను మరియు ఈష్‌బోషెతు పక్షాన్ని ప్రాతినిధ్యం వహించారని అర్థం చేసుకోవడం సముచితం.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో ‘ఈష్‌బోషెతు’; పాత నిబంధనలో ఇతరచోట దీనికి సంబంధించిన ‘ఎష్బయలు’ అనే రూపం కనిపిస్తుంది.
    reason: alternative_reading
  - marker: d
    text: లేదా, ‘దావీదు సేవకులనుండి’ లేదా సందర్భానుసారంగా ‘దావీదు మనుషులనుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: వారు లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּעַבְרוּ
  choice: అవతలికి వెళ్లారు
  rationale: עבר ఇక్కడ ఒక వైపు నుంచి నిర్ణయించిన పోటీ స్థలానికి వెళ్లడాన్ని సూచిస్తుంది; ‘అవతలికి వెళ్లారు’ సందర్భానికి సహజంగా ఉండి, క్రియలోని దాటడం/వెళ్లడం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְמִסְפָּר
  choice: లెక్క ప్రకారం
  rationale: ఇరుపక్షాల నుంచి లెక్కించి సమాన సంఖ్యలో ఎంపిక చేసిన భావాన్ని హెబ్రీ పదబంధానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండుగురు
  rationale: వ్యక్తులను లెక్కిస్తున్నందున తెలుగు వ్యక్తివాచక సంఖ్యారూపం సహజంగా ఉంటుంది.
- source_word: לְבִנְיָמִן
  choice: బెన్యామీను పక్షాన
  rationale: לְ ఉపసర్గ ఇక్కడ కేవలం మూలాన్ని కాక అనుబంధాన్ని లేదా ప్రాతినిధ్యాన్ని సూచించవచ్చు; ‘పక్షాన’ ఆ భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: וּלְאִישׁ בֹּשֶׁת
  choice: ఈష్బోషెతు పక్షాన
  rationale: మసొరెటిక్ పాఠంలోని పేరును తెలుగు లిప్యంతరీకరణలో ఉంచి, కొనసాగుతున్న לְ అనుబంధ భావాన్ని ‘పక్షాన’తో వ్యక్తం చేస్తుంది.
- source_word: בֶּן שָׁאוּל
  choice: సౌలు కుమారుడైన
  rationale: హెబ్రీ వంశసంబంధ సూచనను సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: מֵעַבְדֵי דָוִד
  choice: దావీదు సేవకుల్లోనుండి
  rationale: עבדים యొక్క ప్రాథమిక ‘సేవకులు’ భావాన్ని నిలుపుతూ, מִן సూచించే మూలం/సమూహం నుంచి ఎంపికను స్పష్టంగా తెలుపుతుంది.
