source:
  edition: WLC
  text: וַ/יִּֽהְיוּ שָׁ֗ם שְׁלֹשָׁה֙ בְּנֵ֣י צְרוּיָ֔ה יוֹאָ֥ב וַ/אֲבִישַׁ֖י וַ/עֲשָׂהאֵ֑ל וַ/עֲשָׂהאֵל֙ קַ֣ל בְּ/רַגְלָ֔י/ו כְּ/אַחַ֥ד הַ/צְּבָיִ֖ם אֲשֶׁ֥ר בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: te
  text: 'సెరూయా ముగ్గురు కుమారులు అక్కడ ఉన్నారు: యోవాబు, అబీషై, అసాహేలు. అసాహేలు తన కాళ్లతో పొలంలోని లేళ్లలో ఒకదానివలె వేగవంతుడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొలంలోని గజెల్ జింకల్లో ఒకదానివలె.” హీబ్రూ צְבִי అనే పదం జింకను పోలిన అడవి జంతువును విస్తృతంగా సూచించవచ్చు; ఇక్కడ “గజెల్” మరింత నిర్దిష్టమైన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: అక్కడ ఉన్నారు
  rationale: ఈ పదబంధం వారు ఆ సంఘటన స్థలంలో ఉన్నారని తెలియజేస్తుంది. మూలంలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దాన్ని చేర్చలేదు.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: సెరూయా ముగ్గురు కుమారులు
  rationale: నిర్దిష్టంగా తెలిసిన ముగ్గురు కుమారులను సూచిస్తూ, తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించింది.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: యోవాబు, అబీషై, అసాహేలు
  rationale: వ్యక్తినామాలను ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: קַל בְּרַגְלָיו
  choice: కాళ్ల వేగంలో
  rationale: కַל ఇక్కడ బరువు తక్కువగా ఉండటాన్ని కాక పరుగులో చురుకుదనాన్ని సూచిస్తుంది; בְּרַגְלָיוలోని కాళ్ల ప్రతిమను కూడా ఈ రూపం నిలుపుతుంది.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: లేళ్లలో ఒకదానిలా
  rationale: צְבִי వేగానికి పేరుగాంచిన గజెల్ లేదా దానికి సమానమైన జింకజాతి అడవి జంతువును సూచిస్తుంది. ‘లేడి’ సాధారణ తెలుగు పాఠకునికి సహజంగా అర్థమయ్యే ఎంపిక; మరింత నిర్దిష్టమైన అర్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలోని
  rationale: మూలంలోని ‘పొలంలో ఉన్న’ అనే స్థలార్థాన్ని సంక్షిప్తంగా, అదనపు ‘బహిరంగ’ వంటి భావాన్ని చేర్చకుండా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కాళ్ల వేగం అనే శరీరాత్మక చిత్రాన్ని నిలిపి, జంతువు విషయంలో ఉన్న పదార్థ పరిధిని పాదసూచికలో సంరక్షించింది.
