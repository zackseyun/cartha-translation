id: 2SA.2.10
reference: 2 Samuel 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: te
  text: సౌలు కుమారుడైన ఇష్బోషెతు[a] ఇశ్రాయేలుపై రాజైనప్పుడు నలభై ఏళ్లవాడు. అతడు రెండు సంవత్సరాలు పరిపాలించాడు. అయితే యూదా ఇంటివారు[b] దావీదును అనుసరించారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంబంధిత ఇతర సంప్రదాయాల్లో ఈ పేరుకు ‘ఎష్బయలు’ అనే రూపం కనిపిస్తుంది; మసొరేటిక్ పాఠంలో ఇక్కడ ‘ఇష్బోషెతు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘యూదా ఇల్లు’; ఇది యూదా గోత్రాన్ని లేదా దాని ప్రజాసమూహాన్ని సూచించే సమష్టి ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: ‘దావీదు వెనుక ఉన్నారు’ అనే హీబ్రూ నుడికారం ఇక్కడ దావీదుపట్ల విధేయత చూపడం లేదా ఆయన పక్షాన ఉండడం అనే భావాన్నిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: నలభై ఏళ్లవాడు
  rationale: హీబ్రూలోని వయస్సును తెలిపే సాధారణ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אִישׁ בֹּשֶׁת
  choice: ఇష్బోషెతు
  rationale: మసొరేటిక్ పాఠంలో ఉన్న పేరునే తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది; సంబంధిత సంప్రదాయాల్లోని ఎష్బయలు రూపాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ ఉపసర్గతో ఉన్న ఈ రూపం అతని వయస్సు ఏ సమయంలోనిదో తెలుపుతుంది. ‘రాజైనప్పుడు’ అనేది సహజమైన రాజ్యారంభ సూత్రప్రయోగం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: రాజసంబంధ సందర్భంలో עַל ఒక ప్రజపై అధికారాన్ని సూచిస్తుంది.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: అతడు రెండు సంవత్సరాలు పరిపాలించాడు
  rationale: పాలనా కాలాన్ని తెలిపే హీబ్రూ సూత్రాన్ని స్పష్టంగా, నేరుగా అందిస్తుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: ఇష్బోషెతు ఇశ్రాయేలుపై రాజ్యంచేయడానికి, యూదా దావీదువైపు ఉండడానికి మధ్యనున్న వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: בֵּית יְהוּדָה
  choice: యూదా వంశంవారు
  rationale: అక్షరార్థమైన ‘యూదా ఇల్లు’ అనే సమష్టి భావాన్ని ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, గోత్ర-ప్రజా సమూహ భావంతో అందిస్తుంది.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: దావీదును అనుసరించారు
  rationale: ‘దావీదు వెనుక ఉన్నారు’ అనే హీబ్రూ నుడికారం విధేయత లేదా పక్షపాతాన్ని సూచిస్తుంది. ‘అనుసరించారు’ ఆ రాజకీయ విధేయతను అతిగా వివరణ చేయకుండా నిలుపుతుంది.
