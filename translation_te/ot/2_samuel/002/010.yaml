translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజ్యకాల సూత్రం సంక్షిప్తంగా ఉంచబడింది; ‘రెండు సంవత్సరాలు’ అనే పాఠంలోని కాలసంబంధ ఉద్రిక్తతను వివరణతో సమన్వయపరచకుండా యథాతథంగా నిలిపాం. పాదసూచిక సూచికలు ప్రధాన పాఠంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
