translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. కథన ప్రవాహం కోసం క్రియలను స్పష్టంగా ఉంచి, קֶבֶר మరియు וַיֵּאֹר לָהֶם లోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికల్లో సంరక్షించాం.
