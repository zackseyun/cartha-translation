base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: te
  text: వారు అసాహేలును మోసుకెళ్లి, బేత్లెహేములో ఉన్న అతని తండ్రి సమాధిలో[a] పాతిపెట్టారు. తరువాత యోవాబు, అతని మనుషులు రాత్రంతా ప్రయాణించారు; హెబ్రోనులో వారికి తెల్లవారింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని తండ్రి సమాధి గోతిలో.’ హీబ్రూ קֶבֶר అనే పదం సమాధి గోతిని గానీ, కుటుంబ సమాధి స్థలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘హెబ్రోనులో వారికి వెలుగైంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: మోసుకెళ్లి
  rationale: ఈ సందర్భంలో נשׂא అనేది అసాహేలు మృతదేహాన్ని పాతిపెట్టడానికి తీసుకెళ్లడాన్ని సూచిస్తుంది. ‘మోసుకెళ్లి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עֲשָׂהאֵל
  choice: అసాహేలు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: וַיִּקְבְּרֻהוּ
  choice: పాతిపెట్టారు
  rationale: קבר అనే సాధారణ సమాధి క్రియకు స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: בְּקֶבֶר אָבִיו
  choice: అతని తండ్రి సమాధిలో
  rationale: קֶבֶר అనేది గోతిని లేదా నిర్మిత/కుటుంబ సమాధిని సూచించవచ్చు. తెలుగు ‘సమాధి’ ఈ రెండింటికీ తగిన విస్తృత పదం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: బేత్లెహేములో ఉన్న
  rationale: హీబ్రూ సంబంధవాక్యాన్ని సహజమైన తెలుగులో స్థలాన్ని తెలిపే విశేషణ వాక్యంగా అందించాం.
- source_word: וַיֵּלְכוּ כָל הַלַּיְלָה
  choice: రాత్రంతా ప్రయాణించారు
  rationale: הלך ఇక్కడ నిరంతర కదలికను సూచిస్తుంది. ‘ప్రయాణించారు’ నడక లేదా సైనిక కవాతు అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: యోవాబు, అతని మనుషులు
  rationale: אֲנָשָׁיו యొక్క అక్షరార్థమైన ‘అతని మనుషులు’ను నిలుపుతూ సైనిక సందర్భాన్ని పాఠకుడు గ్రహించేలా చేశాం.
- source_word: וַיֵּאֹר לָהֶם
  choice: వారు హెబ్రోనుకు చేరేసరికి తెల్లవారింది
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘వారికి వెలుగైంది.’ ప్రయాణ ముగింపుతో ఉదయకాలాన్ని సహజ తెలుగులో అనుసంధానించాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనుకు
  rationale: సందర్భంలో హెబ్రోను గమ్యస్థానంగా కనిపిస్తున్నందున గమనార్థక విభక్తిని వాడాం; హీబ్రూ בְ సాధారణంగా ‘హెబ్రోనులో/వద్ద’ అని కూడా అర్థమవుతుంది.
