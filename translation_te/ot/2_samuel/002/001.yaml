    rationale: హీబ్రూ పాఠంలో దావీదు ప్రశ్న (הַאֶעֱלֶה) మరియు యాహ్వే జవాబు (עֲלֵה) ఒకే క్రియను పునరావృతం చేస్తాయి. ‘పైకి వెళ్లాలా?/పైకి వెళ్లు’ ఈ పునరుక్తినీ, సందర్భోచిత భౌగోళిక దిశనూ కాపాడుతుంది.
  - severity: low
