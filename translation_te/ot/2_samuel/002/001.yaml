id: 2SA.2.1
reference: 2 Samuel 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: te
  text: 'దీని తరువాత దావీదు యాహ్వేను[a] సంప్రదించి ఇలా అడిగాడు: “నేను యూదా పట్టణాలలోని ఒకదానికి పైకి వెళ్లాలా?” యాహ్వే అతనితో, “పైకి వెళ్లు” అన్నాడు. అప్పుడు దావీదు, “నేను ఎక్కడికి వెళ్లాలి?” అని అడిగాడు. యాహ్వే, “హెబ్రోనుకు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: హీబ్రూ కథనంలోని కాలసంబంధ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఇది జరిగిన తరువాత’ అనే మరింత పదానువాద రూపంలోని భారాన్ని నివారిస్తుంది.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: యాహ్వేను సంప్రదించి ... అడిగాడు
  rationale: ఈ నిర్మాణం సాధారణ ప్రశ్నకన్నా దేవుని మార్గదర్శకత్వం కోరడాన్ని సూచిస్తుంది. ‘సంప్రదించి’ ఆ భావాన్ని తెలుపుతుండగా, ‘అడిగాడు’ ప్రత్యక్ష ప్రశ్నను సహజంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని దైవిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: הַאֶעֱלֶה / עֲלֵה
  choice: వెళ్లాలా / వెళ్లు
  rationale: עלה కొండప్రాంతానికి పైకి వెళ్లడాన్ని సూచించగలిగినా, తెలుగులో గమ్యస్థానానికి ‘పైకి వెళ్లు’ అనడం ఇక్కడ అసహజంగా ఉంటుంది. ప్రశ్న-జవాబులోని క్రియాపునరుక్తిని ‘వెళ్లు’ రూపాలతో నిలిపింది.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: యూదా పట్టణాల్లో ఒకదానికి
  rationale: యూదాకు చెందిన పట్టణాల్లో ఏదో ఒక గమ్యస్థానాన్ని సూచించే అర్థాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אָנָה
  choice: ఎక్కడికి
  rationale: గమ్యాన్ని అడిగే హీబ్రూ క్రియావిశేషణానికి ఆధునిక తెలుగులో సహజ సమానం.
- source_word: חֶבְרֹנָה
  choice: హెబ్రోనుకు
  rationale: స్థలనామానికి జతైన దిశాసూచక హే గమనం హెబ్రోను వైపని సూచిస్తుంది; తెలుగు ‘-కు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా టెట్రాగ్రామటన్ అనే వ్యక్తినామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల ఆ పేరును తెలుగులో ‘యాహ్వే’గా ఉంచడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. సంభాషణ సహజంగా ఉండేలా ‘అని అడిగాడు/అన్నాడు’ వాడబడింది. హీబ్రూ עלה యొక్క భౌగోళిక ‘పైకి’ భావాన్ని సందర్భానికి అసహజంగా బలవంతం చేయకుండా, గమనం అనే ప్రధాన భావాన్ని అందించాం.
