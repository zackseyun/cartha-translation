  to: 'దీని తరువాత దావీదు యాహ్వేను[a] సంప్రదించి ఇలా అడిగాడు: “నేను యూదా పట్టణాలలోని ఒకదానికి పైకి వెళ్లాలా?” యాహ్వే అతనితో, “పైకి వెళ్లు” అన్నాడు. అప్పుడు దావీదు, “నేను ఎక్కడికి వెళ్లాలి?” అని అడిగాడు. యాహ్వే, “హెబ్రోనుకు” అన్నాడు.'
