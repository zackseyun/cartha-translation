language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יוֹאָ֗ב שָׁ֚ב מֵ/אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּקְבֹּ֖ץ אֶת כָּל הָ/עָ֑ם וַ/יִּפָּ֨קְד֜וּ מֵ/עַבְדֵ֥י דָוִ֛ד תִּשְׁעָֽה עָשָׂ֥ר אִ֖ישׁ וַ/עֲשָׂה אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: te
  text: యోవాబు అబ్నేరును వెంబడించడం మాని తిరిగి వచ్చి, ప్రజలందరినీ సమకూర్చాడు. వారిని లెక్కించినప్పుడు, దావీదు సేవకుల్లో అసాహేలును కాకుండా పందొమ్మిది మంది కనిపించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: అబ్నేరును వెంబడించడం మాని తిరిగి వచ్చి
  rationale: శబ్దార్థంగా ‘అబ్నేరు వెనుకనుండి తిరిగివచ్చాడు’; యుద్ధ సందర్భంలో వెంబడింపును ఆపి తిరిగివచ్చాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: ప్రజలందరినీ సమకూర్చాడు
  rationale: עָם అనే పదానికి దగ్గరగా ‘ప్రజలు’ అని ఉంచుతూ, సందర్భంలో అది యోవాబు వెంటనున్న యోధులను సూచిస్తుందని పాఠకుడు గ్రహించగలిగేలా అనువదించబడింది.
- source_word: וַיִּפָּקְדוּ
  choice: వారిని లెక్కించినప్పుడు
  rationale: నిఫాల్ రూపం ఇక్కడ సైనికులను లెక్కించడం లేదా హాజరు చూడడాన్ని సూచిస్తుంది; తెలుగు కథన ప్రవాహంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: מֵעַבְדֵי דָוִד
  choice: దావీదు సేవకుల్లో
  rationale: עֲבָדִים యొక్క ప్రాథమిక అర్థమైన ‘సేవకులు’ను నిలుపుతుంది; రాజసైనిక సందర్భంలో దావీదు సేవలోని యోధులు అనే భావమూ ఉంటుంది.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: పందొమ్మిది మంది
  rationale: సైనిక సందర్భంలోని పురుషుల సంఖ్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַעֲשָׂה אֵל
  choice: వారితోపాటు అసాహేలు
  rationale: ఇచ్చిన పాఠంలోని అక్షర విభజన అసాహేలు అనే వ్యక్తినామాన్ని ప్రతిబింబిస్తుంది. హెబ్రీలోని ‘పందొమ్మిది మంది, మరియు అసాహేలు’ అనే నిర్మాణం అసాహేలు పందొమ్మిది మందికి అదనమని సూచిస్తుంది.
- source_word: וַיִּפָּקְדוּ מֵעַבְדֵי דָוִד
  choice: దావీదు సేవకుల్లో ... కనబడలేదు
  rationale: פקד నిఫాల్‌కు సందర్భానుసారంగా ‘లెక్కలో లేకపోవడం/కనబడకపోవడం’ అనే భావం ఉంది; యుద్ధానంతర నష్టగణనను స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. మూలంలోని ‘ప్రజలు,’ ‘సేవకులు’ అనే పదాలకు దగ్గరగా ఉండి, సైనిక సందర్భాన్ని వాక్య నిర్మాణం ద్వారా తెలియజేస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
