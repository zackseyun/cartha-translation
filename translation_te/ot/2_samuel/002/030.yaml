  to: యోవాబు అబ్నేరును వెంబడించడం మాని తిరిగి వచ్చి, ప్రజలందరినీ సమకూర్చాడు. వారిని లెక్కించినప్పుడు, దావీదు సేవకుల్లో అసాహేలును కాకుండా పందొమ్మిది మంది కనిపించలేదు.
