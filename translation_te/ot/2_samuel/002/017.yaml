  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: te
  text: ఆ రోజున యుద్ధం ఎంతో భీకరంగా జరిగింది[a]. అబ్నేరు మరియు ఇశ్రాయేలు మనుషులు దావీదు సేవకుల[b] ఎదుట ఓడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రోజు యుద్ధం చాలా తీవ్రంగా జరిగింది.’
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదు సేవకులు’ అంటే ఇక్కడ దావీదు సైనికులు లేదా అతని సేవలో ఉన్న అనుచరులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: యుద్ధం
  rationale: ఈ సందర్భంలో ఈ పదం సుదీర్ఘమైన యుద్ధకాలాన్ని కాక, ఆ రోజు జరిగిన నిర్దిష్ట పోరాటాన్ని సూచిస్తుంది.
- source_word: קָשָׁה עַד מְאֹד
  choice: అత్యంత తీవ్రంగా
  rationale: קָשָׁה అంటే ‘కఠినమైన/తీవ్రమైన’; עַד מְאֹד దాని తీవ్రతను బలపరుస్తుంది. యుద్ధ సందర్భంలో ‘అత్యంత తీవ్రంగా’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: మూలంలోని సాధారణ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలిపే రూపం.
- source_word: וַיִּנָּגֶף
  choice: ఓడిపోయారు
  rationale: נָגַף నిఫల్ రూపం శత్రువు ఎదుట పరాజయం పొందడాన్ని సూచిస్తుంది. సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: אַבְנֵר
  choice: అబ్నేరు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మనుషులు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు మనుషులు’ అనే రూపం మూలంలోని אַנְשֵׁי భావాన్ని నిలుపుతుంది; సందర్భం వీరు యుద్ధంలో పాల్గొన్న వారని స్పష్టం చేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: సైనిక సందర్భంలో ప్రత్యర్థి ఎదుట ఓడిపోవడాన్ని తెలిపే హెబ్రీయ భావాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: עֶבֶד యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ, దావీదు సేవలో ఉన్న సైనికులు లేదా అనుచరులను సూచించే రాజకీయ-సైనిక సందర్భానికి సరిపోతుంది.
