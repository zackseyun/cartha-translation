  yaml_path: translation/ot/2_samuel/002/011.yaml
  text: The length of time that David was king in Hebron over the house of Judah was seven years and six months[a].
translation:
  language: te
  text: దావీదు హెబ్రోనులో యూదా ఇంటివారిపై రాజుగా ఉన్న కాలవ్యవధి ఏడు సంవత్సరాలు ఆరు నెలలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దినాల సంఖ్య.’ ఈ హీబ్రూ నుడికారం దావీదు హెబ్రోనులో రాజుగా ఉన్న కాలవ్యవధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్న
  rationale: ఇక్కడ ఈ రూపం కథలో జరిగిన కాలాన్ని సంక్షిప్తంగా తెలిపే వాక్యాన్ని ప్రవేశపెడుతుంది; తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని అనువదించకుండా వాక్య నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: מִסְפַּר הַיָּמִים
  choice: కాలం
  rationale: అక్షరార్థంగా ‘దినాల సంఖ్య’; సందర్భంలో ఇది దావీదు పరిపాలన కొనసాగిన కాలవ్యవధిని సూచిస్తుంది. ‘కాలం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: దావీదు ... రాజుగా ఉన్న
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంతో అందించి, దావీదు రాజుగా ఉన్న వ్యవధితో ప్రధాన వాక్యాన్ని అనుసంధానించింది.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ ఇక్కడ స్థలాన్ని సూచిస్తుంది; నగరంలో నివసిస్తూ పాలించిన భావానికి ‘హెబ్రోనులో’ సహజమైన అనువాదం.
- source_word: עַל בֵּית יְהוּדָה
  choice: యూదా వంశంవారిపై
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు/గృహం’; ఇక్కడ యూదాతో అనుబంధమైన సామూహిక వంశాన్ని సూచిస్తుంది. ‘వంశంవారు’ ఆ సమష్టి భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ఏడు సంవత్సరాల ఆరు నెలలు
  rationale: పేర్కొన్న కాలవ్యవధిని నేరుగా, సహజమైన తెలుగు రూపంలో అందిస్తుంది.
