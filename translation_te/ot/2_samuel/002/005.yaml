  to: 'అప్పుడు దావీదు యాబేషు-గిలాదు పురుషుల వద్దకు దూతలను పంపి, వారితో ఇలా అన్నాడు: “మీ ప్రభువైన సౌలుకు మీరు ఈ దయ[a] చూపి, అతన్ని పాతిపెట్టారు కాబట్టి యాహ్వే చేత మీరు ఆశీర్వదించబడినవారు.[b]”'
  rationale: హీబ్రూ ఆశీర్వాద సూత్రంలోని ప్రకటనా కృదంత రూపాన్ని ప్రధాన పాఠంలో పునరుద్ధరించాం; సహజమైన కోరికరూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం. חֶסֶדను ప్రధాన పాఠంలో ‘ఈ దయ’గా అనువదించి, దాని విస్తృత అర్థపరిధిని పాదసూచికలో భద్రపరిచాం. ఇతరార్థం మారలేదు.
