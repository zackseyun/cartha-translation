id: 2SA.2.5
reference: 2 Samuel 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אַנְשֵׁ֖י יָבֵ֣ישׁ גִּלְעָ֑ד וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם בְּרֻכִ֤ים אַתֶּם֙ לַֽ/יהוָ֔ה אֲשֶׁ֨ר עֲשִׂיתֶ֜ם הַ/חֶ֣סֶד הַ/זֶּ֗ה עִם אֲדֹֽנֵי/כֶם֙ עִם שָׁא֔וּל וַֽ/תִּקְבְּר֖וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: te
  text: 'అప్పుడు దావీదు యాబేషు-గిలాదు పురుషుల వద్దకు దూతలను పంపి, వారితో ఇలా అన్నాడు: “మీ ప్రభువైన సౌలుకు మీరు ఈ దయ[a] చూపి, అతన్ని పాతిపెట్టారు కాబట్టి యాహ్వే చేత మీరు ఆశీర్వదించబడినవారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ హెసెద్; సందర్భానుసారం ‘దయ,’ ‘విశ్వసనీయత,’ ‘నిబద్ధ ప్రేమ’ అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే మిమ్మల్ని ఆశీర్వదించుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ కథన సందర్భంలో ఇది దావీదు పంపిన మానవ సందేశవాహకులను సూచిస్తుంది; పరలోక దూతలను కాదు.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: యాబేషు-గిలాదు పురుషుల
  rationale: హీబ్రూ పదబంధం స్పష్టంగా పురుషులను సూచిస్తుంది; స్థలనామాన్ని గుర్తుపట్టేలా సంయుక్త రూపంలో ఉంచాం.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: యాహ్వే మిమ్మల్ని ఆశీర్వదించుగాక
  rationale: ఇది ఆశీర్వాద సూత్రంగా పనిచేస్తుంది. హీబ్రూలోని కృదంత రూపాన్ని తెలుగులో సహజమైన ఆశీర్వచనంగా వ్యక్తం చేశాం; స్థితివాచక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חֶסֶד
  choice: విశ్వసనీయ దయ
  rationale: ఇక్కడ సౌలును పాతిపెట్టడంలో చూపిన దయతో పాటు అతనిపట్ల నిబద్ధత కూడా భావంలో ఉంది; రెండు పార్శ్వాలనూ సంక్షిప్తంగా నిలిపే పదబంధం ఇది.
- source_word: אֲדֹנֵיכֶם
  choice: మీ ప్రభువైన
  rationale: సౌలు వారిపై అధికారమున్న రాజు అనే గౌరవార్థక, రాజకీయ భావాన్ని నిలుపుతుంది.
- source_word: עִם שָׁאוּל
  choice: సౌలుకు
  rationale: అక్షరార్థంగా ‘సౌలుతో’ అయినా, ‘దయ చూపు’ అనే తెలుగు ప్రయోగంలో సంప్రదానార్థక ‘సౌలుకు’ సహజంగా మూలభావాన్ని అందిస్తుంది.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని పాతిపెట్టారు
  rationale: వారు పూర్తి చేసిన అంత్యక్రియ చర్యను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: בְּרֻכִים אַתֶּם לַיהוָה యొక్క ఆశీర్వాద స్వరూపం
  choice: యాహ్వే మిమ్మల్ని ఆశీర్వదించుగాక
  alternative: యాహ్వే చేత మీరు ఆశీర్వదించబడినవారు
  rationale: హీబ్రూ రూపం ఆశీర్వదించబడిన స్థితిని వ్యాకరణపరంగా వ్యక్తం చేసినా, సందర్భంలో దావీదు పలికే ఆశీర్వచనంగా ఉంది. ప్రధాన పాఠంలో సహజమైన తెలుగు ఆశీర్వచనాన్ని, పాదసూచికలో మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘పురుషులు’ మూలంలోని లింగస్పష్టతను నిలుపుతుంది. ఆశీర్వచనం తెలుగులో సులభంగా వినిపించేలా ఉన్నప్పటికీ, హీబ్రూ కృదంతంలోని స్థితివాచక భావాన్ని పాదసూచికలో భద్రపరిచాం.
