  source_fidelity: హీబ్రూ వాక్యంలోని మూడు క్రియాత్మక కదలికలు—బెన్యామీనీయులు అబ్నేరు వెనుక కూడడం, ఒక ఐక్య సమూహం కావడం, ఒక కొండ శిఖరంపై నిలబడడం—క్రమంతోనూ అర్థంతోనూ సరిగ్గా ప్రతిబింబించబడ్డాయి. “అబ్నేరు వెనుక” అనే అనువాదం אַחֲרֵי యొక్క స్థానిక భావాన్ని నిలుపుతుంది; అనుసరణ/నాయకత్వ భావాన్ని పాదసూచిక సముచితంగా తెలియజేస్తుంది.
