  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని క్రమం, సైనిక సందర్భం, ‘వెనుక/అనుసరిస్తూ’ అనే నిజమైన అర్థసందిగ్ధత పాదసూచికతో నిలుపబడ్డాయి.
