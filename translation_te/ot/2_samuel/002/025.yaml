reference: 2 Samuel 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽתְקַבְּצ֤וּ בְנֵֽי בִנְיָמִן֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יִּהְי֖וּ לַ/אֲגֻדָּ֣ה אֶחָ֑ת וַ/יַּ֣עַמְד֔וּ עַ֥ל רֹאשׁ גִּבְעָ֖ה אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: te
  text: అప్పుడు బెన్యామీను కుమారులు అబ్నేరు వెనుక[a] సమకూడి, ఒకే దళంగా[b] ఏర్పడి, ఒక కొండ శిఖరంపై నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అబ్నేరును అనుసరిస్తూ.’ హీబ్రూ పదబంధం భౌతికంగా ‘వెనుక’ ఉండడాన్నిగానీ, నాయకుణ్ణి అనుసరించడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒకే గుంపుగా,’ ‘ఒకే బృందంగా.’ హీబ్రూ పదం ఐక్యంగా కూడిన సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: సమకూడి
  rationale: కבץ హిత్పయేల్ రూపం సమూహంగా ఒకచోట చేరడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలోని పునఃసమీకరణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: హీబ్రూ బంధుత్వ ప్రయోగాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన రూపం.
- source_word: אַחֲרֵי אַבְנֵר
  choice: అబ్నేరు వెనుక
  rationale: אַחֲרֵי ఇక్కడ భౌతికంగా ‘వెనుక’ అనే భావాన్నీ, నాయకుణ్ణి అనుసరించడం అనే భావాన్నీ ఇవ్వగలదు. ప్రధాన పాఠంలో హీబ్రూ దృశ్యరూపాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: ఒకే దళంగా
  rationale: אֲגֻדָּה ఐక్యంగా కూడిన బృందాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో ‘దళం’ సహజంగా ఉండి, אֶחָת లోని ఏకత్వాన్ని ‘ఒకే’ స్పష్టపరుస్తుంది.
- source_word: וַיַּעַמְדוּ
  choice: నిలబడ్డారు
  rationale: עמד యొక్క ప్రాథమిక భావాన్ని నిలుపుతుంది; సందర్భం వల్ల వారు యుద్ధస్థానాన్ని చేపట్టిన భావం సహజంగానే వ్యక్తమవుతుంది.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: ఒక కొండ శిఖరంపై
  rationale: భౌగోళిక ప్రయోగంలో רֹאשׁ అంటే కొండ పైభాగం లేదా శిఖరం. ‘ఒక’ అనే పదం אֶחָת ను ప్రతిబింబిస్తుంది.
