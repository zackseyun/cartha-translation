id: 2SA.2.7
reference: 2 Samuel 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: te
  text: ఇప్పుడు మీ చేతులు బలపడాలి[a]; మీరు పరాక్రమవంతులైన పురుషులుగా ఉండండి. ఎందుకంటే మీ ప్రభువైన సౌలు చనిపోయాడు. అంతేకాదు, యూదా వంశం నన్ను తమపై రాజుగా అభిషేకించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చేతులు బలపడాలి’ అనేది ధైర్యంగా, దృఢంగా కార్యానికి సిద్ధపడాలని చెప్పే హీబ్రూ నుడికారం.
    reason: హీబ్రూ రూపకంలోని అర్థాన్ని ఆధునిక పాఠకునికి స్పష్టం చేయడం.
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: וְעַתָּהలో స్పష్టమైన కాలసూచకమైన ‘ఇప్పుడు’ ఉంది; సందర్భంలో וְ ముందున్న మాటలనుంచి వచ్చే తార్కిక కొనసాగింపును సూచిస్తుంది. అందువల్ల ‘కాబట్టి ఇప్పుడు’ సహజంగా, మూలానికి నమ్మకంగా ఉంది.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: మీ చేతులు బలపడాలి
  rationale: చేతులు బలపడడం అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, తెలుగు exhortation భావాన్ని ‘బలపడాలి’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది. దీని భావం ధైర్యంగా, దృఢంగా ఉండడం.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: మీరు పరాక్రమవంతులైన పురుషులుగా ఉండండి
  rationale: בְּנֵי חַיִל యుద్ధ లేదా నాయకత్వ సందర్భంలో ధైర్యం, సామర్థ్యం, శౌర్యం గల పురుషులను సూచిస్తుంది. సందర్భంలోని పురుష సైనిక మద్దతుదారులను దృష్టిలో ఉంచి లింగాన్ని నిలుపుకుంది.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: ఎందుకంటే మీ ప్రభువైన సౌలు చనిపోయాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది. אֲדֹנֵיכֶם ఇక్కడ దేవుని బిరుదు కాదు; సౌలు వారి అధిపతి లేదా సార్వభౌముడు అన్న గౌరవార్థక రాజకీయ పదం.
- source_word: וְגַם אֹתִי
  choice: అంతేకాదు, ... నన్ను
  rationale: Davidను కర్మగా ముందుకు తెచ్చే హీబ్రూ ఉద్ఘాటనను తెలుగులో ‘అంతేకాదు’ మరియు ‘నన్ను’ ద్వారా సహజంగా వ్యక్తం చేసింది.
- source_word: מָשְׁחוּ
  choice: అభిషేకించింది
  rationale: ఈ క్రియ నూనెతో అభిషేకించి అధికార పదవికి నియమించే పూర్తయిన కార్యాన్ని సూచిస్తుంది.
- source_word: בֵּית יְהוּדָה
  choice: యూదా వంశం
  rationale: అక్షరార్థంగా ‘యూదా ఇల్లు’; ఇక్కడ యూదా గోత్ర సమూహాన్ని సూచించే సామూహిక పదం. ‘యూదా వంశం’ ఆధునిక తెలుగులో సహజంగా ఆ సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: తమ మీద రాజుగా
  rationale: దావీదు ఏ పదవికి అభిషేకించబడ్డాడో, ఆ ప్రజలపై అతనికున్న రాజాధికార సంబంధమేమిటో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לִבְנֵי חַיִלలోని పురుష లింగ రూపం
  choice: పరాక్రమవంతులైన పురుషులు
  alternative: ధైర్యవంతులు; పరాక్రమశాలులు
  rationale: ఇది కేవలం సాధారణ మానవ సమూహాన్ని సూచించే పదం కాకుండా, సందర్భంలో సౌలు పక్షానున్న పురుష యోధులు లేదా నాయకులను ఉద్దేశిస్తుంది. కాబట్టి మూలంలోని పురుష లింగాన్ని నిలుపుకుంది.
- issue: אֲדֹנֵיכֶם అనే బిరుదు
  choice: మీ ప్రభువు
  alternative: మీ యజమాని; మీ పాలకుడు
  rationale: ఇక్కడ ఈ పదం దేవునికి సంబంధించిన బిరుదు కాదు; సౌలుకు విధేయులైనవారితో అతనికున్న రాజకీయ అధిపత్య సంబంధాన్ని సూచిస్తుంది. ‘ప్రభువు’ గౌరవార్థకతను నిలుపుతుంది; సందర్భం దాని మానవ ప్రయోగాన్ని స్పష్టం చేస్తుంది.
- issue: దావీదు అభిషేకానికి సంబంధించిన వాక్యబలం
  choice: యూదా వంశం నన్ను తమ మీద రాజుగా అభిషేకించింది
  alternative: యూదా వంశం నన్ను తమ రాజుగా చేసుకుంది
  rationale: מָשַׁחలోని నిజమైన అభిషేక కార్యాన్ని నిలుపుకుంది; దానిని కేవలం రాజుగా చేసుకోవడం అని సాధారణీకరించలేదు. వాక్యం దైవ అనుమోదన గురించి మూలం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ ప్రకటనకు తగిన శైలి వాడబడింది. హీబ్రూ రూపకాన్ని ప్రధాన వచనంలో నిలుపుతూ పాదసూచికలో దాని నుడికార భావాన్ని వివరించింది. וְעַתָּהలోని స్పష్టమైన ‘ఇప్పుడు’ను అనువాదంలో ఉంచింది.
