  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: te
  text: ఇప్పుడు యెహోవా మీపట్ల నిలకడైన ప్రేమను, నమ్మకత్వాన్ని చూపించుగాక.[a] మీరు ఈ పని చేశారు కాబట్టి,[b] నేను కూడా మీకు ఈ మేలు చేస్తాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా మీపట్ల నిలకడైన ప్రేమను, నమ్మకత్వాన్ని చూపిస్తాడు.” హెబ్రీ క్రియను ఆశీర్వాదపూర్వక కోరికగా లేదా భవిష్యత్ ప్రకటనగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ఈ పని” అనేది ముందటి వచనంలో చెప్పిన సౌలును పాతిపెట్టడాన్ని సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: “ఈ మేలు”కు బదులుగా “ఈ ఉపకారం” అని కూడా అనువదించవచ్చు. హెబ్రీలో అక్షరార్థంగా “ఈ మేలు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יַעַשׂ
  choice: చూపించుగాక
  rationale: חֶסֶד וֶאֱמֶת అనే కర్మలతో తెలుగు సహజ వాడుకలో ‘చూపించు’ సరిపోతుంది; క్రియారూపం ఆశీర్వాదపూర్వక కోరికను వ్యక్తం చేస్తుంది.
- source_word: חֶסֶד
  choice: నిలకడైన ప్రేమ
  rationale: విశ్వసనీయమైన, నిబద్ధమైన ప్రేమ అనే సంబంధాత్మక భావాన్ని కాపాడుతుంది; దానిని కేవలం ‘దయ’గా కుదించదు.
- source_word: וֶאֱמֶת
  choice: నమ్మకత్వం
  rationale: ఈ పదజంటలో అమూర్తమైన ‘సత్యం’కన్నా విశ్వసనీయత, నమ్మదగిన ప్రవర్తన అనే భావం ప్రధానంగా ఉంది.
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: నేను కూడా మీకు ఈ మేలు చేస్తాను
  rationale: ‘మేలు’ ద్వారా הַטּוֹבָה యొక్క పదభేదాన్ని ముందున్న חֶסֶד నుండి వేరుగా ఉంచాం; ‘మీకు’ లబ్ధిదారుని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: మీరు ఈ పని చేశారు కాబట్టి
  rationale: ఈ ఉపవాక్యం దావీదు చేయబోయే మేలుకు కారణాన్ని తెలుపుతుంది; ‘ఈ పని’ మునుపటి వచనంలోని సౌలును పాతిపెట్టడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יַעַשׂ క్రియను ఆశీర్వాద కోరికగా లేదా భవిష్యత్ ప్రకటనగా అర్థం చేసుకోవడం
  choice: ‘చూపించుగాక’—ఆశీర్వాదపూర్వక కోరిక
  alternative: ‘చూపిస్తాడు’—భవిష్యత్ ప్రకటన
  rationale: సందర్భంలో దావీదు యాబేషు-గిలాదు ప్రజలను ఆశీర్వదిస్తున్నాడు; అయితే హెబ్రీ క్రియ భవిష్యత్ ప్రకటనగానూ చదవదగినందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హెబ్రీ వాక్యంలోని ఆశీర్వాద స్వరం, కారణ సంబంధం, חֶסֶד మరియు הַטּוֹבָה మధ్య పదభేదం కాపాడబడ్డాయి.
