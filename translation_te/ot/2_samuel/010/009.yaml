  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యుద్ధపంక్తిలో నిలిపాడు’ అనే పదబంధం సైనిక అమరికను సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడింది.
