reference: 2 Samuel 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: te
  text: యోవాబు తనకు ముందునుంచీ వెనుకనుంచీ యుద్ధం ఎదురై ఉందని చూసినప్పుడు, ఇశ్రాయేలీయులలోని శ్రేష్ఠ యోధులందరిలోనుంచి కొందరిని ఎంచుకొని[a], వారిని అరాముకు[b] ఎదురుగా యుద్ధపంక్తిలో నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానుసారంగా: “ఇశ్రాయేలులోని ఎంపికైన యోధులందరిలోనుంచి.”'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “అరాము” అనేది అరాము సైన్యాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘చూచుట’ను నిలుపుతూ, ఇక్కడ యోవాబు యుద్ధ పరిస్థితిని గమనించి గ్రహించిన భావాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: యుద్ధరంగం
  rationale: అక్షరార్థంగా ‘యుద్ధపు ముఖం’; ఈ సైనిక సందర్భంలో తనకు ఎదురుగా ఏర్పడిన యుద్ధముఖం లేదా సమరస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָיְתָה אֵלָיו
  choice: తనకు ... ఏర్పడి ఉందని
  rationale: యుద్ధముఖం యోవాబుకు ఎదురుగా అమర్చబడిన సైనిక స్థితిని వ్యక్తం చేస్తుంది.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: ముందూ వెనుకా
  rationale: రెండు వైపుల నుంచి ముట్టడి లేదా దాడి ఎదురైన స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని శ్రేష్ఠ యోధులందరిలోనుంచి కొందరిని ఎంపిక చేసుకొని
  rationale: בְּחוּרֵי అనేది ఎంపికైన, శ్రేష్ఠమైన పోరాట యోధులను సూచిస్తుంది; מִכֹּל వారి సమూహంలోనుంచి యోవాబు ఒక దళాన్ని ఎంపిక చేసిన భావాన్ని ఇస్తుంది. తెలుగులో వాక్యం అస్పష్టంగా కాకుండా ఉండేందుకు ‘కొందరిని’ స్పష్టీకరించబడింది; మరింత రూపసన్నిహిత పఠనం పాదసూచికలో ఉంది.
- source_word: וַיַּעֲרֹךְ
  choice: యుద్ధపంక్తిలో నిలిపాడు
  rationale: ערך సైనిక సందర్భంలో దళాలను క్రమబద్ధమైన యుద్ధవ్యవస్థలో అమర్చడాన్ని సూచిస్తుంది.
- source_word: לִקְרַאת אֲרָם
  choice: అరామును ఎదుర్కొనేలా
  rationale: לקראת ఇక్కడ ఎదుర్కోవడం లేదా సమరానికి ముఖాముఖి నిలవడం అనే భావాన్ని ఇస్తుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక నామమైన ‘సిరియా’ను పెట్టకుండా హెబ్రీ దేశనామాన్ని లిప్యంతరీకరించింది; ఈ సందర్భంలో అది అరాము సైన్యాన్ని సమష్టిగా సూచిస్తుంది.
