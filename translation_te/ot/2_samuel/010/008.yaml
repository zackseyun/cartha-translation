source:
  edition: WLC
  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: te
  text: అప్పుడు అమ్మోను కుమారులు[a] బయలుదేరి, ద్వారపు ముఖద్వారం వద్ద యుద్ధానికి సైన్యాన్ని అమర్చారు. అయితే సోబాకు చెందిన అరాము వారు, రెహోబు వారు, టోబు మనుషులు[b], మయకా వారు వేరుగా పొలంలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అమ్మోనీయులు.’ హీబ్రూలో అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇష్-టోబు వారు.’ హీబ్రూ אִישׁ טוֹב అనే పదబంధాన్ని ‘టోబు మనుషులు’ అని అనువదించవచ్చు; లేదా ‘ఇష్-టోబు’ అనే స్థలనామంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: బయలుదేరి
  rationale: יצא అనే క్రియ సైనిక సందర్భంలో నగరం నుంచి బయటికి రావడం/బయలుదేరడం సూచిస్తుంది; తెలుగులో ‘బయలుదేరి’ సహజంగా ఉంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోను కుమారులు
  rationale: హీబ్రూ జాతినామ నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది; సాధారణ తెలుగు పాఠకునికి అర్థమయ్యేలా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: యుద్ధానికి వ్యూహం పన్నారు
  rationale: ערך + מלחמה సైన్యాన్ని యుద్ధ క్రమంలో నిలబెట్టడాన్ని సూచించే సైనిక నుడికారం; ఈ తెలుగు ప్రయోగం ఆ కార్యార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פֶּתַח הַשָּׁעַר
  choice: ద్వార ప్రవేశం దగ్గర
  rationale: פתח అనేది తెరువు లేదా ప్రవేశాన్ని సూచిస్తుంది; ఇది నగర ద్వారం వద్దనున్న స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַאֲרַם צוֹבָא
  choice: అయితే సోబాకు చెందిన అరాము వారు
  rationale: אֲרַם ను ‘సిరియా’గా ఆధునీకరించకుండా ‘అరాము’గా ఉంచాం; ו conjunction ఇక్కడ రెండు దళాల స్థానాల మధ్య వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: וּרְחוֹב
  choice: రెహోబు వారు
  rationale: రెహోబు నుంచి వచ్చిన సైనిక దళాన్ని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: וְאִישׁ טוֹב
  choice: టోబు మనుషులు
  rationale: అక్షరార్థంగా ‘టోబు మనుషులు’ అని గ్రహించవచ్చు; ‘ఇష్-టోబు’ అనే స్థలనామ పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּמַעֲכָה
  choice: మయకా వారు
  rationale: మయకా నుంచి వచ్చిన దళాన్ని సందర్భానుసారంగా సూచించే సహజ తెలుగు రూపం.
- source_word: לְבַדָּם
  choice: వేరుగా
  rationale: అమ్మోనీయుల దళం నుంచి మిత్ర దళాలు విడిగా నిలిచాయని సూచిస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שָׂדֶה కు నేరమైన అర్థం ‘పొలం/బయలు’; అదనపు వివరణను చేర్చకుండా ‘పొలంలో’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ జాతినామ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత సామాన్య రూపాన్ని పాదసూచికలో ఇచ్చాం. స్థలనామాలు తెలుగు బైబిలు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
