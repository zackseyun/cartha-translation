- from: అప్పుడు అమ్మోను కుమారులు[a] బయలుదేరి, ద్వార ప్రవేశం దగ్గర యుద్ధానికి వ్యూహం పన్నారు. అయితే సోబాకు చెందిన అరాము వారు, రెహోబు వారు, టోబు మనుషులు[b], మయకా వారు వేరుగా పొలంలో ఉన్నారు.
