  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: te
  text: ఈ విషయం దావీదుకు తెలియజేయబడినప్పుడు, అతడు ఇశ్రాయేలీయులందరినీ సమకూర్చి, యొర్దాను నది దాటి, హేలాముకు వచ్చాడు. అప్పుడు అరామీయులు దావీదును ఎదుర్కొనేందుకు యుద్ధానికి సిద్ధంగా వరుసలు తీర్చి, అతనితో యుద్ధం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి వ్యతిరేకంగా యుద్ధం చేశారు.” హీబ్రూలో అక్షరార్థంగా “అతనితో యుద్ధం చేశారు” అని ఉంది; ఇక్కడ అది ప్రత్యర్థితో యుద్ధానికి దిగడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: ఈ సంగతి దావీదుకు తెలియజేయబడినప్పుడు
  rationale: కర్తను పేర్కొనని హీబ్రూ కర్మణి రూపాన్ని నిలుపుతూ, ముందటి సందర్భంలోని వార్తను ‘ఈ సంగతి’ అని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలీయులందరినీ సమకూర్చి
  rationale: אָסַף యొక్క ‘సమకూర్చు/సమావేశపరచు’ భావాన్ని ఇస్తుంది; మూలంలో లేని ‘సైన్యం’ అనే విశదీకరణను చేర్చదు.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: యొర్దాను నది దాటి
  rationale: నదిని దాటడమనే עָבַר భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא חֵלָמָה
  choice: హేలాముకు వచ్చాడు
  rationale: స్థలంవైపు గమనాన్ని సూచించే directional heను తెలుగులో ‘-కు వచ్చాడు’ అని సహజంగా అందిస్తుంది.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: అరామీయులు ... యుద్ధవ్యవస్థలో నిలబడి
  rationale: సమూహవాచకమైన ‘అరాము’ను ప్రజలను సూచించే ‘అరామీయులు’గా తెలుగులో స్పష్టం చేస్తూ, సైనిక సందర్భంలో עָרַךְకు ఉన్న యుద్ధానికి వ్యూహాత్మకంగా సిద్ధపడే భావాన్ని నిలుపుతుంది.
- source_word: לִקְרַאת דָּוִד
  choice: దావీదును ఎదుర్కోవడానికి
  rationale: לִקְרַאת యొక్క ఎదురుగా వచ్చి కలుసుకునే భావాన్ని యుద్ధ సందర్భానికి తగినట్లుగా ఇస్తుంది; ‘వ్యతిరేకంగా’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: అతనితో యుద్ధం చేశారు
  rationale: עִם యొక్క అక్షరార్థమైన ‘తో’ నిర్మాణాన్ని నిలుపుతుంది; యుద్ధ సందర్భంలో ఇది ప్రత్యర్థిగా పోరాడటాన్ని సూచిస్తుంది.
