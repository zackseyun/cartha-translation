translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ కథన క్రమం, కర్మణి భావం, స్థలనామాలు, ‘ఇశ్రాయేలు’ అనే సమూహ విస్తృతి కాపాడబడ్డాయి; అవసరం లేని ‘సైన్యం’ వంటి వివరణలు చేర్చలేదు.
