id: 2SA.10.4
reference: 2 Samuel 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: te
  text: అప్పుడు హానూను దావీదు సేవకులను తీసుకొని, వారి గడ్డాల్లో సగాన్ని గొరిగి, వారి వస్త్రాలను మధ్యలో, వారి పిరుదుల వరకు కత్తిరించి, వారిని పంపివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: పట్టుకొని
  rationale: לקח అనే సాధారణ క్రియకు ‘తీసుకొని’ అనే ప్రాథమిక భావం ఉన్నా, ఇక్కడ వారిని అవమానకర చర్యలకు లోబరచిన సందర్భంలో ‘పట్టుకొని’ సహజంగా సరిపోతుంది; ‘బంధించి’ లేదా ‘చెరపట్టి’ అనే మరింత బలమైన భావాన్ని చేర్చదు.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులను
  rationale: עבד సందర్భానుసారం సేవకుడు, దాసుడు, లేదా రాజోద్యోగి కావచ్చు. వీరు దావీదు రాజసేవలోని దౌత్య ప్రతినిధులు; ‘సేవకులు’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: వారి గడ్డాలలో సగభాగాన్ని గొరిగి
  rationale: ప్రతి వ్యక్తి గడ్డంలో సగాన్ని గొరిగి ఉద్దేశపూర్వకంగా అవమానించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּכְרֹת
  choice: కత్తిరించి
  rationale: כרת ఇక్కడ వస్త్రంలోని భాగాన్ని కోయడం లేదా తొలగించడాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘కత్తిరించి’ సహజమైన పదం.
- source_word: מַדְוֵיהֶם
  choice: వారి వస్త్రాలను
  rationale: ఈ పదం వస్త్రం లేదా దుస్తును సూచిస్తుంది. వస్త్ర రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘వస్త్రాలు’ మూలార్థాన్ని నిలుపుతుంది.
- source_word: בַּחֵצִי
  choice: మధ్యలో
  rationale: వస్త్రాలను మధ్యభాగం వద్ద కత్తిరించిన స్థలార్థాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: పిరుదుల వరకు
  rationale: అరుదైన שְׁתוֹת అనే పదం పిరుదులు, కూర్చునే భాగం, లేదా మర్మాంగాల సమీప ప్రాంతాన్ని సూచించవచ్చు. అవమానకరంగా వస్త్రాలను చాలా పొట్టిగా కత్తిరించిన సందర్భంలో ‘పిరుదుల వరకు’ ప్రత్యక్షమైనప్పటికీ అతిగా నిర్దిష్టం కాని అనువాదం.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని పంపివేశాడు
  rationale: అవమానించిన తరువాత వారిని వెళ్లగొట్టిన కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. అవమానకర చర్యను అస్పష్టమైన సభ్యోక్తితో దాచకుండా, అరుదైన హీబ్రూ శరీరపదంలోని అనిశ్చితిని పాదటిప్పణిలో నిలుపుకుంది.
