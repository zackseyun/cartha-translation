source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: te
  text: మిగిలిన సైనికులను[a] అతడు తన సోదరుడైన అబీషై ఆధీనంలో ఉంచి[b], అమ్మోనీయులను[c] ఎదుర్కొనేందుకు వారిని యుద్ధ పంక్తిలో నిలిపాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మిగిలిన ప్రజలను’; ఈ యుద్ధ సందర్భంలో మిగిలిన సైనిక దళం అని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అబీషై చేతిలో ఇచ్చాడు’; ఇది అతని అధికారానికి దళాలను అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘అమ్మోను కుమారులను.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘వారిని యుద్ధ క్రమంలో అమర్చాడు.’ హీబ్రూ క్రియ దళాలను పోరాటానికి పంక్తిగా సిద్ధపరచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: మిగిలిన సైనికులను
  rationale: יֶתֶר అంటే మిగిలిన భాగం; הָעָם అక్షరార్థంగా ‘ప్రజలు’ అయినా, ఇక్కడ యుద్ధ సందర్భంలో మిగిలిన పోరాట దళాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘మిగిలిన సైనికులను’ అని అనువదించబడింది.
- source_word: נָתַן בְּיַד
  choice: ఆధీనంలో ఉంచి
  rationale: అక్షరార్థంగా ‘చేతిలో ఇచ్చాడు’ అనే ఈ హీబ్రూ నుడికారం ఒకరి అధికారానికి లేదా బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది. ఇక్కడ సైనిక నాయకత్వాన్ని అప్పగించడం భావం.
- source_word: אַבְשַׁי
  choice: అబీషై
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אָחִיו
  choice: తన సోదరుడు
  rationale: హీబ్రూ ప్రత్యయం యోవాబు సోదరుడైన అబీషైని స్పష్టంగా సూచిస్తుంది; బంధుత్వ సంబంధం మూలపాఠంలో ఉన్నట్లే నిలుపబడింది.
- source_word: וַיַּעֲרֹךְ
  choice: యుద్ధ పంక్తిలో నిలిపాడు
  rationale: ערך అనే క్రియ సైనిక సందర్భంలో దళాలను యుద్ధ క్రమంలో అమర్చడాన్ని సూచిస్తుంది. ‘యుద్ధ పంక్తిలో నిలిపాడు’ అనే రూపం ఆ ప్రత్యేక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לִקְרַאת
  choice: ఎదుర్కొనేందుకు
  rationale: לִקְרַאת అంటే ఎదురుగా కలుసుకోవడం లేదా ఎదుర్కోవడం. యుద్ధ సందర్భంలోని ప్రతికూల సమాగమ భావాన్ని ‘ఎదుర్కొనేందుకు’ స్పష్టంగా అందిస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘అమ్మోను కుమారులు’ అని ఉన్నప్పటికీ, అది అమ్మోను జాతివారిని సూచించే సాధారణ జాతీయ నామరూపం. ఆధునిక తెలుగులో ‘అమ్మోనీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
