translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథనశైలి. సైనిక సందర్భం సాధారణ పాఠకులకు వెంటనే అర్థమయ్యేలా సందర్భార్థ రూపాలు ప్రధాన పాఠ్యంలో వాడబడి, హీబ్రూ అక్షరార్థాలు పాదసూచికల్లో నిలుపబడ్డాయి.
