source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: te
  text: 'అమ్మోనీయుల అధిపతులు తమ ప్రభువైన హానూనుతో ఇలా అన్నారు: “దావీదు నీ దగ్గరకు ఓదార్చేవారిని[a] పంపించాడు కాబట్టి, అతడు నీ తండ్రిని గౌరవిస్తున్నాడని నీవు అనుకుంటున్నావా? ఆ పట్టణాన్ని పరిశీలించి, దానిలో గూఢచర్యం చేసి, దాన్ని కూలదోయడానికే దావీదు తన సేవకులను నీ దగ్గరకు పంపించలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఓదార్చేవారు’ అంటే హానూను తండ్రి మరణించినందుకు సానుభూతి తెలిపి అతన్ని ఓదార్చడానికి పంపబడిన రాజదూతలు.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: అమ్మోనీయుల అధిపతులు
  rationale: שָׂרִים రాజసభలోని అధికారులు లేదా నాయకులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అధిపతులు’ రాజకీయ హోదాను సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנֵיהֶם
  choice: తమ ప్రభువైన
  rationale: ఇక్కడ אדון దైవనామం కాదు; మానవ పాలకుని పట్ల అధికారసంబంధమైన బిరుదు. ‘ప్రభువు’ ఆ రాజసభ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: הַמְכַבֵּד
  choice: గౌరవిస్తున్నాడని
  rationale: כבד ఇక్కడ దేవునికి మహిమ చెల్లించడం కాక, వ్యక్తికి గౌరవం చూపడాన్ని సూచిస్తుంది.
- source_word: בְּעֵינֶיךָ
  choice: నీవు అనుకుంటున్నావా
  rationale: అక్షరార్థంగా ‘నీ కళ్లలో’ అనే హీబ్రూ నుడికారం వ్యక్తిగత అంచనా లేదా అభిప్రాయాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מְנַחֲמִים
  choice: ఓదార్చేవారిని
  rationale: తండ్రి మరణించిన సందర్భంలో సానుభూతి తెలిపి ఓదార్చడానికి పంపబడిన ప్రతినిధులను ఈ కృదంత రూపం సూచిస్తుంది.
- source_word: הֲלוֹא
  choice: పంపించలేదా?
  rationale: సమ్మతిని ఆశించే అనుమానభరిత అలంకార ప్రశ్నను తెలుగు ప్రతికూల ప్రశ్న సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: ఈ పట్టణాన్ని పరిశీలించి
  rationale: חקר జాగ్రత్తగా శోధించడం లేదా పరిశీలించడం అనే భావాన్ని కలిగిస్తుంది; సందర్భంలో సైనిక ఉద్దేశంతో సమాచార సేకరణ సూచితమవుతుంది.
- source_word: וּלְרַגְּלָהּ
  choice: దానిలో గూఢచర్యం చేసి
  rationale: Piel రూపంలోని רגל రహస్యంగా గమనించడం లేదా గూఢచర్యం చేయడాన్ని సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం పట్టణాన్నే తిరిగి సూచిస్తుంది.
- source_word: וּלְהָפְכָהּ
  choice: దాన్ని కూలదోయడానికి
  rationale: הפך తలకిందులు చేయడం, కూలదోయడం అనే అర్థాలు కలిగి ఉంది. యుద్ధసంబంధ సందర్భంలో ‘కూలదోయడం’ ఉద్దేశించిన రాజకీయ విధ్వంసాన్ని అతిశయించకుండా తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: దావీదు అధికారంలో ఉన్న రాజదూతలు లేదా సేవకులను సూచించే సాధారణ పదం; మూలంలోని సేవాసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అధిపతుల అనుమానాన్ని వాస్తవమని కథకుడు ధ్రువీకరిస్తున్నాడా?
  choice: వారి ఆరోపణను సమ్మతిని ఆశించే అలంకార ప్రశ్నగా ఉంచడం
  alternative: దావీదు నిజంగా గూఢచర్యానికే పంపించాడని నేరుగా వాస్తవ ప్రకటనగా అనువదించడం
  rationale: మూలపాఠం హానూను సలహాదారుల మాటలను నివేదిస్తుంది; వారి అనుమానాన్ని కథకుని తీర్పుగా ప్రకటించదు. ప్రశ్నారూపం ఈ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; రాజసభ నేపథ్యానికి తగిన గౌరవభరిత శైలి. హీబ్రూ అలంకార ప్రశ్నలు మరియు ఆరోపణలోని అనిశ్చితి నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
