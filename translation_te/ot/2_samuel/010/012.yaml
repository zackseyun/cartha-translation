id: 2SA.10.12
reference: 2 Samuel 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִתְחַזַּק֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה יַעֲשֶׂ֥ה הַ/טּ֖וֹב בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: te
  text: “ధైర్యంగా ఉండు[a]. మన ప్రజల కోసం, మన దేవుని పట్టణాల కోసం మనం బలంగా నిలబడదాం. యెహోవా తన దృష్టికి మంచిదైనదే చేయుగాక[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బలంగా ఉండు.” తరువాతి మాటను “మనలను మనం బలపరచుకుందాం” లేదా “మన బలాన్ని చూపుదాం” అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియలో స్వయంగా బలపడటం లేదా బలాన్ని ప్రదర్శించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యెహోవా తన దృష్టికి మంచిదైనదే చేస్తాడు.” హీబ్రూ రూపాన్ని సాధారణ భవిష్యత్తుగా చదవవచ్చు; ప్రధాన పాఠంలో అది యెహోవా చిత్తానికి లోబడే కోరికగా అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: ధైర్యంగా ఉండు
  rationale: חזק అనే పుం. ఏకవచన ఆజ్ఞ యుద్ధ సందర్భంలో బలంగా, ధైర్యంగా ఉండమనే ప్రత్యక్ష ప్రోత్సాహం. సహజమైన ఆధునిక తెలుగులో ‘ధైర్యంగా ఉండు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְנִתְחַזַּק
  choice: మనం బలంగా నిలబడదాం
  rationale: హిత్పయేల్ కోహోర్టేటివ్ రూపంలో స్వయంగా బలపడటం లేదా బలాన్ని ప్రదర్శించడం అనే భావం ఉంది. ‘బలంగా నిలబడదాం’ ఆత్మప్రేరణను, సమూహ సంకల్పాన్ని, యుద్ధ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעַד
  choice: కోసం
  rationale: ఇక్కడ ప్రజలకూ పట్టణాలకూ రక్షణగా, వారి పక్షాన పోరాడటాన్ని సూచిస్తుంది. ‘కోసం’ సంక్షిప్తంగా, సహజంగా ఈ ప్రయోజనార్థక భావాన్ని అందిస్తుంది.
- source_word: עַמֵּנוּ
  choice: మన ప్రజలు
  rationale: עַם సాధారణంగా ‘ప్రజలు’ అని అర్థం; దానిని ‘సైన్యం’గా కుదించకుండా సమాజమంతటినీ సూచించే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: మన దేవుని పట్టణాలు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తూ, ఆ పట్టణాలు దేవునితో కలిగిన సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: మూలంలోని יהוה అనే ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించింది.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: తన దృష్టికి మంచిదైనదే చేయుగాక
  rationale: హీబ్రూ ‘తన కళ్లలో మంచిదైనది’ అనే నుడికారాన్ని సహజ తెలుగులో ‘తన దృష్టికి మంచిదైనది’గా అందిస్తూ, ఫలితాన్ని దేవుని చిత్తానికి అప్పగించే కోరిక భావాన్ని ‘చేయుగాక’తో నిలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: పాఠ్యంలో ప్రత్యేక దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఉపయోగించాం; ఉచ్చారణ పునర్నిర్మాణంలోని భేదాన్ని గమనించాం.
- issue: יַעֲשֶׂה యొక్క విధి భావం
  choice: కోరిక/సమర్పణ భావంతో ‘చేయుగాక’
  alternative: సాధారణ భవిష్యత్తుగా ‘చేస్తాడు’
  rationale: ముందున్న ఆజ్ఞ, కోహోర్టేటివ్ ప్రోత్సాహాల తరువాత ఈ యిక్టోల్ దేవుని చిత్తానికి ఫలితాన్ని అప్పగించే కోరికగా సహజంగా అర్థమవుతుంది. అయితే రూపం సాధారణ భవిష్యత్తుగానూ చదవవచ్చు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యుద్ధోద్బోధలోని సంక్షిప్తతను, సమూహ ధైర్యాన్ని, దేవుని చిత్తానికి సమర్పణను కాపాడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
