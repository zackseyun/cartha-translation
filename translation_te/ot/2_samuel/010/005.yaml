base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: te
  text: వారు దావీదుకు తెలియజేసినప్పుడు, ఆ మనుషులు ఎంతో అవమానానికి గురయ్యారు కాబట్టి అతడు వారిని కలుసుకోవడానికి పంపించాడు[a]. రాజు వారితో, “మీ గడ్డాలు పెరిగేంతవరకు యెరికోలో ఉండండి; ఆ తర్వాత తిరిగి రండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘అతడు వారిని కలుసుకోవడానికి పంపించాడు.’ ఎవరిని పంపించాడో స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: ఈ సంగతి దావీదుకు తెలియజేయబడినప్పుడు
  rationale: హీబ్రూలో చెప్పినవారు ఎవరో పేర్కొనబడలేదు. తెలుగు సహజత్వం కోసం కర్తలేని కర్మణి నిర్మాణం వాడి, సమాచారం దావీదుకు చేరిందనే భావాన్ని నిలిపాము.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: అతడు వారిని కలుసుకోవడానికి మనుషులను పంపించాడు
  rationale: అక్షరార్థంగా ‘వారిని ఎదుర్కొనడానికి/కలుసుకోవడానికి పంపించాడు.’ పంపబడినవారు వాక్యంలో స్పష్టంగా లేకపోయినా తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు ‘మనుషులను’ చేర్చాము; దానిని పాదటిప్పణిలో తెలియజేశాము.
- source_word: נִכְלָמִים מְאֹד
  choice: ఎంతో అవమానానికి గురయ్యారు
  rationale: כלם యొక్క నిఫాల్ రూపం బహిరంగంగా అవమానింపబడిన స్థితిని సూచిస్తుంది; מְאֹד తీవ్రతను తెలియజేస్తుంది.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: యెరికోలో ఉండి
  rationale: ఇక్కడ ישׁב తాత్కాలికంగా ఉండడం అనే భావంలో ఉంది. ఆధునిక తెలుగులో ‘ఉండండి’ సహజమైన ఎంపిక; తదుపరి ఆజ్ఞతో అనుసంధానించేందుకు ‘ఉండి’ వాడాము.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: మీ గడ్డాలు తిరిగి పెరిగేంతవరకు
  rationale: צמח అంటే మొలకెత్తడం లేదా పెరగడం. ముందటి సందర్భంలో గడ్డాలు కత్తిరించబడినందున ‘తిరిగి’ అనేది సందర్భంలో అంతర్లీనమైన పునర్వృద్ధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשַׁבְתֶּם
  choice: ఆ తర్వాత తిరిగి రండి
  rationale: שׁוב అంటే తిరిగి రావడం. ‘ఆ తర్వాత’ అనే పదాలు עַד నిర్మాణంలో ఉన్న కాలక్రమాన్ని తెలుగులో స్పష్టం చేస్తాయి.
