- from: ఈ సంగతి దావీదుకు తెలియజేయబడినప్పుడు, అతడు వారిని కలుసుకోవడానికి మనుషులను పంపించాడు[a]. ఆ మనుషులు ఎంతో అవమానానికి గురయ్యారు. రాజు వారితో, “మీ గడ్డాలు తిరిగి పెరిగేంతవరకు[b] యెరికోలో ఉండి, ఆ తర్వాత తిరిగి రండి” అని చెప్పాడు.
