translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాము. హీబ్రూ మూలంలోని పేర్కొనని కర్తను మొదటి వాక్యంలో కర్మణి రూపంతో నిలిపాము. ప్రధాన వాక్యంలో స్పష్టత కోసం చేర్చిన అంశాలను పాదటిప్పణుల్లో గుర్తించాము.
