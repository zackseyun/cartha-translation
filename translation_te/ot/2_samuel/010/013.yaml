translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని సైనిక సందర్భం స్పష్టంగా ఉండేలా చూసినప్పటికీ, ‘అరాము’ అనే రూపాన్ని ప్రధాన పాఠంలో నిలిపి దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
