  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: te
  text: అప్పుడు యోవాబు, అతనితో ఉన్న ప్రజలూ అరామీయులపై యుద్ధానికి ముందుకు సాగారు; అరామీయులు అతని ఎదుటనుండి పారిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అరాము’; ఇక్కడ అరామీయ సైన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: ముందుకు సాగారు
  rationale: נגשׁ అనే క్రియకు ప్రాథమికంగా ‘సమీపించు’ అనే అర్థం ఉంది; అయితే ‘యుద్ధం చేయడానికి’ అనే సందర్భంలో పోరాటానికి ముందుకు కదలడాన్ని ఇది సూచిస్తుంది.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ప్రజలు
  rationale: עָם అనే పదానికి దగ్గరగా ‘ప్రజలు’ అని ఉంచి, సందర్భంలో వారు యోవాబుతో ఉన్న పోరాట బలగమని పాఠకుడు గ్రహించేలా అనువదించబడింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: לְ ఉపసర్గతో కూడిన מִלְחָמָה ఇక్కడ యుద్ధంలో పాల్గొనే ఉద్దేశాన్ని లేదా దిశను తెలియజేస్తుంది.
- source_word: בַּאֲרָם
  choice: అరాముతో
  rationale: హీబ్రూ పాఠంలో ‘అరాము’ అనే ఏకవచన స్థలనామమే ఉంది. בְ ఇక్కడ ప్రతిద్వంద్వ పోరాటాన్ని సూచిస్తూ ‘తో’ అని సహజంగా అనువదించబడింది; సందర్భానుసారంగా ఇది అరామీయ సైన్యాన్ని సూచిస్తుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוּס అంటే ‘పారిపోవడం’; క్రమబద్ధమైన వెనుకంజను సూచించే పదం కంటే ఇది మూలంలోని బలమైన భావాన్ని నేరుగా అందిస్తుంది.
- source_word: מִפָּנָיו
  choice: అతని ఎదుట నిలువలేక
  rationale: అక్షరార్థంగా ‘అతని ముఖం ఎదుటనుండి’ అనే హీబ్రూ జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో పారిపోవడానికి సంబంధించిన భావంతో వ్యక్తం చేస్తుంది. ఏకవచన ప్రత్యయం యోవాబును సూచిస్తుంది.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
