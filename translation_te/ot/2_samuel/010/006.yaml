source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: te
  text: అమ్మోనీయులు తాము దావీదుకు అసహ్యులయ్యామని[a] గ్రహించినప్పుడు, వారు పంపి బేత్-రెహోబుకు చెందిన అరామీయులను, సోబాకు చెందిన అరామీయులను—ఇరవై వేలమంది కాల్బల సైనికులను—మయకా రాజును వెయ్యిమంది మనుషులతో, అలాగే టోబు మనుషులను[c]—పన్నెండు వేలమందిని—కూలికి నియమించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తాము దావీదుకు దుర్గంధంగా మారామని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఈష్-టోబు”; దీనిని స్థల లేదా వంశనామంగా తీసుకునే అవకాశం ఉంది. ఇక్కడ “టోబు మనుషులు” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: గ్రహించినప్పుడు
  rationale: ראה అనే క్రియకు ప్రాథమికంగా ‘చూడు’ అనే అర్థం ఉన్నా, ఇక్కడ పరిస్థితిని గుర్తించడం అనే భావం సహజంగా ఉంది; ఆధునిక తెలుగులో ‘గ్రహించారు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; అయితే జనసమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం ‘అమ్మోనీయులు’.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: దావీదుకు అసహ్యులయ్యామని
  rationale: באשׁ దుర్వాసన రూపకంతో ఎవరికైనా అసహ్యంగా లేదా అభ్యంతరకరంగా మారడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన భావానువాదం ఇచ్చి, అక్షరార్థ రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּשְׁלְחוּ
  choice: మనుషులను పంపి
  rationale: హీబ్రూలో పంపబడిన కర్మ స్పష్టంగా లేకపోయినా, వెంటనే వచ్చే ‘కూలికి పెట్టుకున్నారు’ అనే చర్యను తెలుగులో సహజంగా అనుసంధానించడానికి సాధారణమైన ‘మనుషులను’ చేర్చాం; నిర్దిష్టంగా ‘దూతలను’ అని చెప్పలేదు.
- source_word: וַיִּשְׂכְּרוּ
  choice: కూలికి పెట్టుకున్నారు
  rationale: సైనిక సహాయాన్ని పారితోషికానికి నియమించుకోవడం ఇక్కడి భావం; ‘కూలికి పెట్టుకున్నారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: బేత్-రెహోబుకు చెందిన అరామీయులు
  rationale: אֲרַםను చారిత్రక జాతినామమైన ‘అరామీయులు’గా ఇచ్చి, בית רחובను ప్రాంతనామంగా లిప్యంతరీకరించాం.
- source_word: אֲרַם צוֹבָא
  choice: సోబాకు చెందిన అరామీయులు
  rationale: అరాము జాతివారిని, సోబా ప్రాంత సంబంధాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు నిర్మాణం.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: ఇరవై వేలమంది కాల్బల సైనికులు
  rationale: רַגְלִי కాలినడకన పోరాడే సైన్యాన్ని సూచిస్తుంది; ‘కాల్బల సైనికులు’ ఖచ్చితమైన, ప్రస్తుత తెలుగు సైనిక పదప్రయోగం.
- source_word: מֶלֶךְ מַעֲכָה
  choice: మయకా రాజు
  rationale: ఇది మయకా ప్రాంతపు రాజును సూచించే సమాసం; వ్యక్తిపేరుగా కాక ప్రాంతాధిపతిగా అనువదించాం.
- source_word: אֶלֶף אִישׁ
  choice: అతని వెయ్యిమంది మనుషులు
  rationale: రాజుతో వచ్చిన దళాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి స్వామ్యసూచకమైన ‘అతని’ ఉపయోగించాం.
- source_word: אִישׁ טוֹב
  choice: టోబు మనుషులు
  rationale: సందర్భం మరియు 1 దినవృత్తాంతాలు 19:6లోని సమాంతర వచనం దీన్ని టోబు ప్రాంతపు మనుషులుగా అర్థం చేసుకోవడానికి మద్దతిస్తాయి; ‘ఈష్-టోబు’ అనే ప్రత్యామ్నాయ విభజనను పాదసూచికలో నిలిపాం.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: పన్నెండు వేలమంది
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సైనిక సందర్భంలో సహజంగా అనువదించాం.
