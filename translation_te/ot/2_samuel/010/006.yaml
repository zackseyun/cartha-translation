translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. జాతి, ప్రాంత నామాలను మూల హీబ్రూకు దగ్గరగా ఉంచాం. సంఖ్యలు మరియు దళాల నిర్మాణం స్పష్టంగా కనిపించేందుకు విరామచిహ్నాలను ఉపయోగించాం; మూలంలోని రూపకార్థం మరియు אִישׁ טוֹב పఠన సందిగ్ధతను పాదసూచికల్లో సంరక్షించాం.
