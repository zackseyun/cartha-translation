source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “నాహాషు కుమారుడైన హానూనుకు నేను దయ చూపిస్తాను; అతని తండ్రి నాకు దయ చూపించినట్లే.” కాబట్టి దావీదు అతని తండ్రి గురించి అతన్ని ఓదార్చడానికి[a] తన సేవకులను పంపించాడు. దావీదు సేవకులు అమ్మోనీయుల దేశానికి వచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అతని తండ్రి మరణం గురించి సానుభూతి తెలియజేయడానికి.
    reason: హీబ్రూ పదబంధం తండ్రి మరణం వల్ల శోకిస్తున్న హానూనుకు ఓదార్పు అందించడాన్ని సందర్భానుసారంగా సూచిస్తుంది.
lexical_decisions:
- source_word: חֶסֶד
  choice: దయ
  rationale: ఈ రాజకీయ, దౌత్య సందర్భంలో ఈ పదం పక్షాల మధ్య చూపే దయతో కూడిన విశ్వసనీయ మేలును సూచిస్తుంది. ‘దయ’ రెండు సందర్భాల్లోనూ సహజంగా ఉండి, నిబంధన సంబంధమైన ప్రత్యేక అర్థాన్ని అనవసరంగా జోడించదు.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: నాహాషు కుమారుడైన హానూను
  rationale: హీబ్రూ పుత్ర సంబంధాన్ని స్పష్టంగా నిలుపుతూ, పేర్లను తెలుగులో సహజంగా లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר
  choice: చూపించినట్లే
  rationale: పరస్పర స్పందనతో కూడిన పోలికను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָשָׂה ... חֶסֶד
  choice: దయ చూపించు
  rationale: హీబ్రూ పదబంధానికి సహజమైన తెలుగు క్రియాపదబంధం; భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְנַחֲמוֹ
  choice: అతన్ని ఓదార్చడానికి
  rationale: శోక సందర్భంలో ఓదార్పు అందించడాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל אָבִיו
  choice: అతని తండ్రి విషయమై
  rationale: తండ్రికి సంబంధించిన శోకం కారణంగా ఓదార్చడం అనే సంబంధాన్ని నిలుపుతుంది; మరణాన్ని ప్రధాన వాక్యంలో స్పష్టంగా చేర్చి మూలపాఠాన్ని మించి చెప్పదు.
- source_word: בְּיַד עֲבָדָיו
  choice: తన సేవకుల ద్వారా కబురు పంపించాడు
  rationale: ‘సేవకుల చేతి ద్వారా’ అనే హీబ్రూ కర్తృత్వ సాధనాన్ని సహజ తెలుగులో ‘సేవకుల ద్వారా’గా వ్యక్తం చేసింది. పంపినది ఓదార్పు కబురని సందర్భం తెలియజేస్తుంది.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల దేశం
  rationale: ‘అమ్మోను కుమారుల దేశం’ అనే అక్షరార్థ జాతినామానికి స్పష్టమైన, ప్రామాణిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్య క్రమం సాధ్యమైనంత వరకు నిలిపి, అసహజమైన ‘చేతి ద్వారా’కు బదులుగా ‘ద్వారా’ ఉపయోగించబడింది. మూలపాఠంలో అంతర్లీనంగా ఉన్న తండ్రి మరణాన్ని ప్రధాన వాక్యంలో నిర్దిష్టంగా చేర్చకుండా పాదసూచికలో వివరించబడింది.
