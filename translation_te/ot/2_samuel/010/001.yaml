  text: After this, the king of the Ammonites died, and Hanun his son became king in his place.
translation:
  language: te
  text: ఆ తర్వాత అమ్మోనీయుల రాజు చనిపోయాడు. అతని స్థానంలో అతని కుమారుడు హానూను రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: కథనంలో తరువాత జరిగిన సంఘటనను సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు
  rationale: ‘అమ్మోను కుమారులు’ అనే మూలభాషా జాతీయపదాన్ని తెలుగులో సాధారణంగా అర్థమయ్యే ప్రజానామ రూపంలో అందిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: హానూను పాలన ఆరంభించాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: తండ్రి తరువాత వారసుడిగా రాజైన భావాన్ని మూలానికి అనుగుణంగా వ్యక్తపరుస్తుంది.
