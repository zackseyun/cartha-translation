id: 2SA.10.11
reference: 2 Samuel 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק אֲרָם֙ מִמֶּ֔/נִּי וְ/הָיִ֥תָה לִּ֖/י לִֽ/ישׁוּעָ֑ה וְ/אִם בְּנֵ֤י עַמּוֹן֙ יֶחֱזְק֣וּ מִמְּ/ךָ֔ וְ/הָלַכְתִּ֖י לְ/הוֹשִׁ֥יעַֽ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “అరాము నాకంటే బలంగా ఉంటే[a], నువ్వు నాకు సహాయం చేయాలి[b]. అమ్మోనీయులు నీకంటే బలంగా ఉంటే[a], నేను వెళ్లి నీకు సహాయం చేస్తాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాపై పైచేయి సాధిస్తే” … “నీపై పైచేయి సాధిస్తే.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నాకు రక్షణగా ఉండాలి” … “నిన్ను రక్షించడానికి వెళ్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: బలంగా ఉంటే
  rationale: యుద్ధ సందర్భంలో חזק శత్రువు పైచేయి సాధించేంత బలంగా ఉండడం లేదా ప్రబలడం అనే భావాన్ని ఇస్తుంది. ‘బలంగా ఉంటే’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: אֲרָם
  choice: అరాము సైన్యం
  rationale: אֲרָם అనేది అరాము అనే రాజ్యాన్ని లేదా దాని ప్రజలను సూచిస్తుంది. ఈ యుద్ధ సందర్భంలో పోరాడుతున్న బలగమే ఉద్దేశమని స్పష్టం చేయడానికి ‘సైన్యం’ చేర్చబడింది; పేరును తరువాతి కాలపు ‘సిరియా’గా మార్చలేదు.
- source_word: מִמֶּנִּי / מִמְּךָ
  choice: నాకంటే / నీకంటే
  rationale: חזק తో వచ్చిన מִן పోలికను, పైచేయిని సూచిస్తుంది. తెలుగులో ‘నాకంటే/నీకంటే బలంగా’ మూలంలోని తులనాత్మక నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ‘అమ్మోను కుమారులు’ అనే అక్షరార్థ రూపానికి బదులు, ఆ జాతి-రాజకీయ సమూహాన్ని సూచించే సహజమైన తెలుగు రూపం వాడబడింది.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: నువ్వు నాకు సహాయం చేయాలి
  rationale: అక్షరార్థంగా ‘నాకు విమోచనగా ఉండాలి’ అనే నిర్మాణం ఇక్కడ యుద్ధరంగ సహాయాన్ని సూచిస్తుంది. ‘సహాయం చేయాలి’ ఆచరణాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: నేను వెళ్లి నీకు సహాయం చేస్తాను
  rationale: הלך తో కూడిన క్రియారూపం ఉద్దేశపూర్వకంగా వెళ్లడాన్ని, הושיע రక్షించడాన్ని సూచిస్తాయి. ఈ పరస్పర సైనిక సహాయ సందర్భంలో ‘వెళ్లి సహాయం చేస్తాను’ సహజంగా ఉంటుంది; కదలిక భావాన్ని కూడా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యుద్ధరంగంలో ఇద్దరు సేనాధిపతులు పరస్పర సహాయం చేసుకునే మాటగా సహజంగా రూపొందించబడింది. ‘రక్షణ/విమోచన’ పదాలకు ఉండగల మతపరమైన ప్రత్యేక ధ్వనిని ప్రధాన పాఠ్యంలో మోపకుండా, మూలంలోని అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
