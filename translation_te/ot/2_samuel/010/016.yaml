  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח הֲדַדְעֶ֗זֶר וַ/יֹּצֵ֤א אֶת אֲרָם֙ אֲשֶׁר֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וַ/יָּבֹ֖אוּ חֵילָ֑ם וְ/שׁוֹבַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: te
  text: హదదెజెరు పంపి, నదికి అవతల ఉన్న అరామీయులను బయలుదేరదీశాడు.[a] వారు హేలాముకు వచ్చారు; హదదెజెరు సైన్యాధిపతియైన షోబకు[b] వారి ముందు ఉన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యూఫ్రటీసు నదికి అవతల.
    reason: cultural_note
  - marker: b
    text: ఈ పేరును “షోబాఖు” అని కూడా ధ్వన్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “వారి ముందు ఉన్నాడు” అంటే, బహుశా అతడు వారికి నాయకత్వం వహిస్తూ వారి అగ్రభాగంలో ఉన్నాడని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: దూతలను పంపించి
  rationale: שלח యొక్క ప్రాథమిక భావం ‘పంపు.’ తెలుగులో కర్మ లేకుండా ‘పంపించాడు’ అనడం అసంపూర్ణంగా వినిపించవచ్చు; తరువాతి చర్యను సాధించేందుకు అతడు మనుషులను పంపాడనే సందర్భార్థాన్ని ‘దూతలను’ స్పష్టం చేస్తుంది.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: అరామీయులను బయలుదేరదీశాడు
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని ‘బయలుదేరదీశాడు’ కాపాడుతుంది. సందర్భంలో אֲרָם భూభాగం కన్నా అరామీయ ప్రజలను లేదా బలగాలను సూచిస్తుంది.
- source_word: אֲרָם
  choice: అరామీయులను
  rationale: హీబ్రూ జాతి-భౌగోళిక పదాన్ని నేరుగా ప్రతిబింబిస్తూ, ఆధునిక ‘సిరియనులు’ అనే కాలభ్రాంతిని నివారిస్తుంది.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: నదికి అవతల ఉన్న
  rationale: మూలంలోని అక్షరార్థమైన ‘నదికి అవతల’ను ప్రధాన పాఠ్యంలో ఉంచి, అది యూఫ్రటీసు అని పాదసూచికలో వివరిస్తుంది.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: వారు హేలాముకు వచ్చారు
  rationale: חֵילָם స్థలనామాన్ని తెలుగు ధ్వన్యంతరీకరణతో ఇచ్చి, బహువచన క్రియను సహజంగా అనువదిస్తుంది.
- source_word: וְשׁוֹבַךְ
  choice: షోబకు
  rationale: హీబ్రూ వ్యంజనరూపానికి దగ్గరైన తెలుగు ధ్వన్యంతరీకరణ; ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: שַׂר צְבָא
  choice: సైన్యాధిపతి
  rationale: సైనిక నాయకత్వాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలిపే సహజ ఆధునిక తెలుగు పదం.
- source_word: לִפְנֵיהֶם
  choice: వారికి ముందుగా ఉన్నాడు
  rationale: అక్షరార్థమైన ‘వారి ముందు’ అనే భావాన్ని కాపాడుతుంది; యుద్ధ సందర్భంలో అతడు వారికి నాయకత్వం వహిస్తూ అగ్రభాగంలో ఉన్నాడనే సంభావ్య భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘నది’ అనే మూలపాఠ్య అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, గుర్తింపును పాదసూచికకు పరిమితం చేశాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంది.
