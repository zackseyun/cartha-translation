    issue: ‘దూతలను’ has been added to the first clause.
    rationale: וַיִּשְׁלַח means ‘he sent,’ but the Hebrew supplies no object such as ‘messengers.’ The addition makes the Telugu more specific than the source.
  - severity: low
    issue: ‘వారికి ముందుగా ఉన్నాడు’ is potentially temporal and the Shobak alternative footnote is imprecise.
    rationale: לִפְנֵיהֶם is spatially ‘before them’; the military-leading sense remains an implication. ‘షోబాఖు’ better indicates the conventional alternative transliteration represented by Shobach.
