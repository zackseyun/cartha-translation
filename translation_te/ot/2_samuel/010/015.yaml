revisions:
- from: అరాము తాను ఇశ్రాయేలు ఎదుట ఓడిపోయినట్లు చూసినప్పుడు,[a] అరామీయులు సమకూడారు.
  to: అరాము ఇశ్రాయేలు ఎదుట ఓడిపోయిందని చూసినప్పుడు,[a] అరామీయులు కలిసి సమకూడారు.
  rationale: The revision explicitly renders יחד as కలిసి and improves the Telugu expression of the collective-singular construction. It retains the source sequence, the military sense of defeat, the non-agentive ‘before Israel’ wording, and the plural referent in the second clause. The footnote preserves the relevant Hebrew singular/plural feature and remains anchored at the point of the collective name.
