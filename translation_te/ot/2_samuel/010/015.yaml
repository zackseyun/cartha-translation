translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ప్రధాన వాక్యంలో ‘అరాము’ అనే అసలు పేరును నిలిపి, తరువాతి బహువచన చర్యను స్పష్టంచేయడానికి ‘అరామీయులు’ వాడాం. అడుగుసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
