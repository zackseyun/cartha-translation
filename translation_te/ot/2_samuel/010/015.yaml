source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲרָ֔ם כִּ֥י נִגַּ֖ף לִ/פְנֵ֣י יִשְׂרָאֵ֑ל וַ/יֵּאָסְפ֖וּ יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: te
  text: అరాము ఇశ్రాయేలు ఎదుట ఓడిపోయిందని చూసినప్పుడు,[a] అరామీయులు కలిసి సమకూడారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరాము ఇశ్రాయేలు ఎదుట ఓడిపోయిందని చూసింది; వారు కలిసి సమకూడారు.” హీబ్రూలో ఏకవచన రూపంలో ఉన్న ‘అరాము’ అనే పేరు అరామీయులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి చర్యతో ఉన్న కాలసంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘చూసినప్పుడు’ అని అనువదించాం.
- source_word: אֲרָם
  choice: అరాము
  rationale: హీబ్రూలోని ఏకవచన స్థలనామాన్ని పేరుగా నిలిపాం; సందర్భంలో అది అరామీయుల సమూహాన్ని సూచిస్తుంది.
- source_word: כִּי
  choice: '...అని/ట్లు'
  rationale: ఇది కారణాన్ని కాక, అరాము గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘ఓడిపోయినట్లు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: נִגַּף
  choice: ఓడిపోయిన
  rationale: నిఫాల్ రూపం యుద్ధంలో పరాజయం పొందడాన్ని సూచిస్తుంది; ‘ఓడిపోయిన’ అనేది స్పష్టమైన, అతివ్యాఖ్యానం లేని ఆధునిక తెలుగు ప్రయోగం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: యుద్ధ సందర్భంలో ‘సమక్షంలో/ఎదుట’ అనే భావాన్ని కాపాడుతుంది; నేరుగా ‘చేత’ అని మార్చి కర్తను స్పష్టీకరించలేదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: వ్యక్తినామ/జాతినామ సంప్రదాయ తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపంలోని ‘తమను తాము కూడగట్టుకోవడం, సమావేశమవడం’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘మళ్లీ సైన్యంగా ఏర్పడ్డారు’ వంటి సందర్భాధారిత అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: יָחַד
  choice: సమకూడారు
  rationale: ‘కలిసి’ అనే భావం తెలుగు ‘సమకూడారు’ అనే క్రియలో సహజంగానే ఇమిడి ఉంది; వేరుగా ‘కలిసి’ చేర్చడం పునరుక్తిగా అనిపించవచ్చు.
