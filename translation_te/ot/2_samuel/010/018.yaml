  source_fidelity: మూలంలోని ‘అరాము పారిపోయింది’ అనే సరళమైన యుద్ధవివరణను ‘ఎదుట నిలవలేక’ అనే అదనపు భావం లేకుండా అనువదించడం మరింత నిష్ఠావంతం. שַׂר־צְבָאוֹలో ఏకవచన ప్రత్యయాన్ని ప్రధాన పాఠంలో ‘అతని’గా ఉంచాలి. రథదళానికి సంబంధించిన సంఖ్యలోని కష్టమైన/అనిశ్చితమైన సూచనను పాదటిప్పణి ద్వారా నిలుపుతున్నాం.
