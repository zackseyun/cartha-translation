  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘రథం/రథదళం’ అనిశ్చితిని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలిపాం; సమాంతర వాక్యంలోని పాఠభేదాన్ని మూలపాఠంలో కలపలేదు.
