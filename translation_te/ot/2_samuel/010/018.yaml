reference: 2 Samuel 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: te
  text: అరాము ఇశ్రాయేలు ఎదుటనుండి పారిపోయింది. దావీదు అరామీయుల రథదళానికి చెందిన ఏడువందల మందిని[a], నలభై వేలమంది గుర్రపు రౌతులను చంపాడు. అతని సైన్యాధిపతి[b] షోబకును కూడా దెబ్బతీశాడు; అతడు అక్కడ చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా ‘ఏడువందల రథాలు/రథదళం’ అని ఉంది; ఇక్కడ రథదళంలోని మనుషులు ఉద్దేశించబడి ఉండవచ్చు. 1 దినవృత్తాంతాలు 19:18లో ‘ఏడువేల రథాలు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా ‘వారి సైన్యాధిపతి.’ హీబ్రూలోని ప్రత్యయం ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: అరాము ఇశ్రాయేలు ఎదుట నిలవలేక పారిపోయింది
  rationale: אֲרָם అనే దేశనామాన్ని ‘అరాము’గా ఉంచి, מִפְּנֵי అనే యుద్ధసందర్భపు భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఎదుట నిలవలేక’ అని వ్యక్తం చేశాం.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: దావీదు ... చంపాడు
  rationale: הרג అంటే నేరుగా ‘చంపడం’; తరువాత వచ్చే נכהతో పదభేదాన్ని నిలిపేందుకు ‘చంపాడు’ అని అనువదించాం.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: రథదళంలో ఏడువందల మందిని
  rationale: רֶכֶב అంటే ‘రథం/రథదళం.’ చంపబడినవారు మనుషులని సందర్భం సూచిస్తున్నా, మూలంలోని ఖచ్చితమైన మానవ పాత్ర స్పష్టంగా లేదు; కాబట్టి ‘రథసారథులు’ అని అతిగా నిర్దిష్టం చేయకుండా ‘రథదళంలో ... మందిని’ అని ఇచ్చాం.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: నలభై వేలమంది గుర్రపు రౌతులను
  rationale: פָּרָשִׁים అనేది గుర్రపు దళంలోని రౌతులను సూచిస్తుంది; ‘గుర్రపు రౌతులు’ సాధారణ పాఠకులకు స్పష్టమైన సైనిక పదప్రయోగం.
- source_word: וְאֵת שׁוֹבַךְ
  choice: షోబకు
  rationale: మసొరెటిక్ స్వరపఠనానికి దగ్గరగా పేరును తెలుగులో లిప్యంతరీకరించాం.
- source_word: שַׂר צְבָאוֹ
  choice: వారి సైన్యాధిపతి
  rationale: שַׂר צְבָא అంటే సైనిక సందర్భంలో ‘సైన్యాధిపతి.’ హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ఏకవచనం (‘అతని’); అయితే సందర్భంలో అరామీయుల సైన్యాన్ని సూచించే అవకాశాన్ని ప్రధాన పాఠంలో సహజంగా చూపించి, అసలు రూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הִכָּה
  choice: దెబ్బతీశాడు
  rationale: נכה విస్తృతంగా ‘కొట్టు/దెబ్బతీయు/హతమార్చు’ అనే అర్థాలు కలిగి ఉంది. వెంటనే ‘చనిపోయాడు’ అని ఉన్నందున ఫలితాన్ని ముందుగానే క్రియలో కలపకుండా ‘దెబ్బతీశాడు’ అని ఉంచాం.
- source_word: וַיָּמָת שָׁם
  choice: అతడు అక్కడే చనిపోయాడు
  rationale: శోబకు ఆ దెబ్బవల్ల అక్కడే మరణించాడనే వరుసను అదనపు వివరాలు లేకుండా సహజ తెలుగులో తెలిపాం.
