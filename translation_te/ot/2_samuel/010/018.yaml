  terminology: ‘అరాము,’ ‘ఇశ్రాయేలు,’ ‘దావీదు,’ ‘షోబకు,’ ‘సైన్యాధిపతి,’ ‘గుర్రపు రౌతులు’ అనే పదాలు స్థిరమైన, అర్థవంతమైన వాడుకలో ఉన్నాయి. ‘అతని సైన్యాధిపతి’ హీబ్రూ ఏకవచన ప్రత్యయాన్ని ప్రతిబింబిస్తుంది; దాని సంభావ్య సందర్భార్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
