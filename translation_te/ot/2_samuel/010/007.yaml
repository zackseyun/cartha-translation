  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: te
  text: దావీదు విని, యోవాబును, పరాక్రమశాలులైన యోధుల సైన్యమంతటినీ[a] పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైన్యమంతటినీ, అంటే పరాక్రమశాలులైన యోధులందరినీ.’ హీబ్రూ పదబంధాన్ని ‘పరాక్రమశాలులైన యోధులు’ అనే మాట ‘సైన్యం’ను వివరిస్తున్నట్లుగానీ, సైన్యాన్ని నిర్దిష్టపరుస్తున్నట్లుగానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: దావీదు అది విని
  rationale: שׁמע అనే క్రియకు ఇక్కడ స్పష్టమైన కర్మ లేదు. తెలుగు వాక్యం సహజంగా ఉండేందుకు ముందటి సందర్భాన్ని సూచించే ‘అది’ చేర్చబడింది; ‘విని’ వరుసగా జరిగిన కార్యాల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: שׁלח యొక్క సాధారణ అర్థమైన ‘పంపు’ను నిలుపుతూ, సైనిక సందర్భంలో వ్యక్తులను కార్యానికి పంపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת יוֹאָב
  choice: యోవాబును
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికను విడిగా అనువదించకుండా, పేరును తెలుగు లిపిలో ఇచ్చి కర్మ విభక్తిని జోడించాం.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: సైన్యమంతటిని
  rationale: צָבָא ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది. כָּל భావాన్ని ‘అంతటిని’ ద్వారా స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הַגִּבֹּרִים
  choice: పరాక్రమశాలుల
  rationale: גִּבּוֹרִים బలశౌర్యాలు గల యోధులను సూచిస్తుంది. ‘పరాక్రమశాలులు’ దాని గౌరవప్రదమైన భావాన్ని నిలుపుతుంది; ఈ పదానికి ముందున్న ‘సైన్యం’తో ఉన్న వ్యాకరణ సంబంధంలోని అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
