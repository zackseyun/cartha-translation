translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. హీబ్రూలో చెప్పని కర్మను నిర్దిష్ట సంఘటనగా విస్తరించకుండా ‘అది’తో సందర్భానుసారంగా సూచించాం. ‘సైన్యం—పరాక్రమశాలులు’ మధ్య ఉన్న నిజమైన వ్యాకరణ అస్పష్టతను ప్రధాన పాఠంలో ఒక సాధ్యమైన పఠనంతో, పాదసూచికలో ప్రత్యామ్నాయంతో నిలిపాం.
