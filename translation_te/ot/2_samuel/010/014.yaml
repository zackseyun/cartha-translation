source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: te
  text: అమ్మోను ప్రజలు అరామీయులు పారిపోయారని చూసి, అబీషై ఎదుటనుండి పారిపోయి పట్టణంలోకి వెళ్లారు. అప్పుడు యోవాబు అమ్మోను ప్రజలపై పోరాటం నుండి వెనుదిరిగి యెరూషలేముకు వచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: అక్షరార్థంగా ‘అమ్మోను కుమారులు’; ఆధునిక తెలుగులో ఆ జనసమూహాన్ని సహజంగా సూచించేందుకు ‘అమ్మోనీయులు’ అని అనువదించాం.
- source_word: רָאוּ כִּי נָס אֲרָם
  choice: అరాము పారిపోయినట్టు చూసినప్పుడు
  rationale: אֲרָם అనే భౌగోళిక-జాతీయ నామాన్ని ‘అరాము’గా నిలిపి, נָס సూచించే ముందరి చర్యను ‘పారిపోయినట్టు’గా తెలిపాం.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: వారు అబీషై ఎదుట నిలువలేక పారిపోయి
  rationale: מִפְּנֵי యొక్క సైనిక సందర్భార్థం అబీషై ఎదుట నుంచి వెనుదిరిగి పారిపోవడం. తెలుగులో సహజంగా ఉండేందుకు ‘ఎదుట నిలువలేక’ అని వ్యక్తీకరించాం.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: పట్టణంలోకి ప్రవేశించారు
  rationale: నిర్దిష్టమైన కోటగల పట్టణంలోకి వెళ్లిన భావాన్ని సహజంగా అందిస్తుంది; మూలంలో పట్టణం పేరు లేదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: యోవాబు అమ్మోనీయులతో యుద్ధం చేయడం మానుకొని వెనుదిరిగి
  rationale: מֵעַל అనే ప్రయోగం ఈ సైనిక సందర్భంలో వారి మీద సాగిస్తున్న పోరాటం నుంచి వైదొలగడాన్ని సూచిస్తుంది. కేవలం ‘వారి దగ్గరనుంచి’ అన్నదానికంటే ఈ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: యెరూషలేముకు వచ్చాడు
  rationale: בוא యొక్క సాధారణ గమనార్థాన్ని ‘వచ్చాడు’గా, స్థల నామాన్ని ప్రామాణిక తెలుగు రూపంలో అందించాం.
