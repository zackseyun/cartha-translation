  naturalness: The draft is fluent modern Telugu. The revised wording remains natural while avoiding unnecessary explanatory expansion.
  terminology: ‘అమ్మోను ప్రజలు’ transparently represents ‘sons of Ammon’ in natural Telugu. ‘అరామీయులు’ communicates the collective national sense of Hebrew Aram; a footnote preserves the Hebrew proper name. Names are rendered consistently as అబీషై, యోవాబు, and యెరూషలేము.
