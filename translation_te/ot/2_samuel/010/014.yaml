translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస చర్యలను సహజ తెలుగు ప్రవాహంతో అందించాం. వివరణ అవసరం లేని చోట పాదటిప్పణులు చేర్చలేదు.
