translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గంభీరమైన, సులభమైన శైలి. అరామ్ అనే ఏకవచన ప్రాంతనామం వెనుక ఉన్న సమూహార్థాన్ని ‘అరామీయులు’గా సహజీకరించాం. మూలంలోని వరుస సంఘటనల భావాన్ని ‘అప్పటినుంచి’తో స్పష్టం చేశాం.
