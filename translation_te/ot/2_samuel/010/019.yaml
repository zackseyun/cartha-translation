source:
  edition: WLC
  text: וַ/יִּרְא֨וּ כָֽל הַ/מְּלָכִ֜ים עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥מוּ אֶת יִשְׂרָאֵ֖ל וַ/יַּֽעַבְד֑וּ/ם וַ/יִּֽרְא֣וּ אֲרָ֔ם לְ/הוֹשִׁ֥יעַ ע֖וֹד אֶת בְּנֵ֥י עַמּֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: te
  text: హదదెజెరుకు లోబడి ఉన్న రాజులందరూ తాము ఇశ్రాయేలు ఎదుట ఓడిపోయినట్లు చూసినప్పుడు, వారు ఇశ్రాయేలుతో సమాధానం చేసుకొని వారికి లోబడ్డారు. అప్పుడు అరాము అమ్మోను ప్రజలను ఇక రక్షించడానికి భయపడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: హదదెజెరుకు లోబడి ఉన్న
  rationale: సందర్భంలో వీరు హదదెజెరు ఆధీనంలోని రాజులు; సహజమైన ఆధునిక తెలుగులో రాజకీయ విధేయతను వ్యక్తం చేస్తుంది.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఎదుట ఓడిపోయామని
  rationale: హీబ్రూ నిఫాల్ రూపం పరాజయాన్ని సూచిస్తుంది; ‘ఎదుట’ మూలంలోని לִפְנֵי భావాన్ని నిలుపుతుంది.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో సంధి చేసుకొని
  rationale: ఈ సందర్భంలో שלם నిర్మాణం శాంతి లేదా ఒప్పందం చేసుకోవడాన్ని సూచిస్తుంది; ‘సంధి’ రాజకీయ సందర్భానికి తగినది.
- source_word: וַיַּעַבְדוּם
  choice: వారికి సేవచేశారు
  rationale: బహువచన ప్రత్యయాన్ని ఇశ్రాయేలీయులను సూచించే ‘వారికి’గా సహజంగా వ్యక్తం చేస్తుంది; ఆధీన సేవ భావాన్ని అతిగా వివరించదు.
- source_word: לְהוֹשִׁיעַ
  choice: సహాయం చేయడానికి
  rationale: ישׁע హిఫీల్‌కు ‘రక్షించు’ అనే ప్రాథమిక భావం ఉన్నా, సైనిక మిత్రులకు తోడ్పడే ఈ సందర్భంలో ‘సహాయం చేయడం’ సహజంగా మరియు ఖచ్చితంగా ఉంటుంది.
- source_word: בְּנֵי עַמּוֹן
  choice: అమ్మోనీయులకు
  rationale: జాతిని సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ప్రజానామంతో అందిస్తుంది.
