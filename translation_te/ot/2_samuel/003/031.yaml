  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘అబ్నేరు ముందు’ అనే మూలంలోని భావసంక్షిప్తతను విస్తరించకుండా నిలిపి, అంత్యక్రియల వాహక పదానికి వివరణాత్మక పాదటిప్పణి ఇచ్చాం.
