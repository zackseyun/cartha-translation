source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל יוֹאָ֜ב וְ/אֶל כָּל הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ קִרְע֤וּ בִגְדֵי/כֶם֙ וְ/חִגְר֣וּ שַׂקִּ֔ים וְ/סִפְד֖וּ לִ/פְנֵ֣י אַבְנֵ֑ר וְ/הַ/מֶּ֣לֶךְ דָּוִ֔ד הֹלֵ֖ךְ אַחֲרֵ֥י הַ/מִּטָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: te
  text: 'అప్పుడు దావీదు యోవాబుతోనూ, అతనితో ఉన్న ప్రజలందరితోనూ ఇలా అన్నాడు: “మీ బట్టలు చింపుకోండి, గోనెపట్టలు కట్టుకోండి, అబ్నేరు ముందు విలపించండి.” రాజైన దావీదు శవపాడె[a] వెనుక నడుస్తూ ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి సాధారణంగా “మంచం” లేదా “పడక” అని అర్థం; ఇక్కడ అది అబ్నేరు దేహాన్ని మోసిన పాడెను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: మీ బట్టలు చింపుకొని
  rationale: శోకసందర్భంలో వస్త్రాలను చింపుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, బహువచన ఆజ్ఞను నిలుపుతుంది.
- source_word: חִגְרוּ שַׂקִּים
  choice: గోనెపట్టలు కట్టుకొని
  rationale: హీబ్రూ క్రియలోని నడుముకు కట్టుకోవడం లేదా చుట్టుకోవడం అనే భావాన్ని ‘ధరించండి’ కంటే స్పష్టంగా ప్రతిబింబిస్తుంది; ఇది శోకాచారాన్ని సూచిస్తుంది.
- source_word: וְסִפְדוּ
  choice: విలపించండి
  rationale: మృతుని కోసం ఆచారబద్ధంగా శోకించడం, విలపించడం అనే ספד భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי אַבְנֵר
  choice: అబ్నేరు ముందు
  rationale: మూలంలోని సంక్షిప్తమైన ‘అబ్నేరు ముందు’ అనే వ్యక్తీకరణను నిలుపుతుంది; సందర్భంలో ఇది అబ్నేరు దేహాన్ని మోసే పాడెకు ముందుగా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: వెనుక నడుస్తూ ఉన్నాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్నీ, అంత్యక్రియల ఊరేగింపులోని స్థలసంబంధాన్నీ నిలుపుతుంది.
- source_word: הַמִּטָּה
  choice: శవపాడె
  rationale: ఈ పదానికి సాధారణంగా మంచం లేదా పరుపు అనే అర్థం ఉన్నా, ఇక్కడ అంత్యక్రియల సందర్భంలో అబ్నేరు దేహాన్ని మోసే పాడెను సూచిస్తుంది.
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: దావీదును రాజుగా గుర్తించే మూలంలోని బిరుదును సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
