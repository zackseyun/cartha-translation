    text: లేదా, “అబ్నేరుకు ఏమీ బదులివ్వలేకపోయాడు.” హీబ్రూ నుడికారం అక్షరార్థంగా “అబ్నేరుకు ఒక మాట జవాబివ్వడం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל
  choice: జవాబివ్వలేకపోయాడు
  rationale: సామర్థ్యాన్ని సూచించే క్రియను నిరాకరణతో కలిపి, ఆధునిక తెలుగులో సహజంగా ‘లేకపోయాడు’ అని వ్యక్తపరిచాం.
- source_word: עוֹד
  choice: కూడా
  rationale: నిరాకరణ సందర్భంలో ఇకపై ఏ జవాబూ ఇవ్వలేని భావాన్ని ‘ఒక్క మాట కూడా ... లేకపోయాడు’ అనే సహజ తెలుగు నిర్మాణంలో వ్యక్తపరిచాం.
- source_word: לְהָשִׁיב
  choice: జవాబివ్వడం
  rationale: హిఫిల్ రూపం ఇక్కడ ‘జవాబు చెప్పడం/ప్రత్యుత్తరం ఇవ్వడం’ అనే సందర్భార్థాన్ని కలిగివుంది; ‘జవాబివ్వడం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אֶת־אַבְנֵר
  choice: అబ్నేరుకు
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ నిర్మాణాన్ని తెలుగు ‘జవాబివ్వు’ క్రియకు సహజమైన సంప్రదాన విభక్తితో అనువదించాం.
- source_word: דָּבָר
  choice: ఒక్క మాట
  rationale: హీబ్రూ నుడికారంలోని ‘ఒక మాట’ను నిలుపుతూ, నిరాకరణ బలాన్ని సహజ తెలుగులో చూపేందుకు ‘ఒక్క మాట కూడా’ అని ఇచ్చాం.
- source_word: מִיִּרְאָתוֹ
  choice: ఎందుకంటే అతడు ... భయపడ్డాడు
  rationale: מִן ఇక్కడ కారణాన్ని సూచిస్తుంది; నామవాచక నిర్మాణాన్ని స్పష్టమైన కారణవాక్యంగా మార్చడం తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֹתוֹ
  choice: అబ్నేరుకు
  rationale: సర్వనామం అబ్నేరునే సూచిస్తున్నందున, తెలుగు వాక్యంలో సూచన సందిగ్ధం కాకుండా పేరును పునరుక్తి చేశాం.
