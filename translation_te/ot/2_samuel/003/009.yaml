source:
  edition: WLC
  text: כֹּֽה יַעֲשֶׂ֤ה אֱלֹהִים֙ לְ/אַבְנֵ֔ר וְ/כֹ֖ה יֹסִ֣יף ל֑/וֹ כִּ֗י כַּ/אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לְ/דָוִ֔ד כִּֽי כֵ֖ן אֶֽעֱשֶׂה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: te
  text: దేవుడు అబ్నేరుకు[a] ఇలాగే చేయుగాక, మరింత కూడా చేయుగాక; యాహ్వే దావీదుకు ప్రమాణం చేసినట్టే, నేను అతని కోసం చేస్తాను—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, తనకే. అబ్నేరు తనపై శాపాన్ని ఆహ్వానిస్తూ తన పేరును మూడవ పురుషంగా పలుకుతున్నాడు.
    reason: సాంస్కృతికంగా అపరిచితమైన హీబ్రూ ప్రమాణ సూత్రాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים ... וְכֹה יֹסִיף
  choice: దేవుడు ... ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువే చేయుగాక
  rationale: ఇది తనపై దేవుని శిక్షను ఆహ్వానించే ప్రామాణిక హీబ్రూ ప్రమాణ సూత్రం. తెలుగులో సహజమైన శాపార్థక ప్రార్థనారూపాన్ని వాడుతూ, రెండో భాగంలోని తీవ్రతను ‘ఇంతకంటే ఎక్కువే’ అని నిలిపింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ ప్రమాణ సూత్రంలో పదం ఏకవచనంగా ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది; ‘దేవతలు’ అనే బహువచనార్థం సందర్భానికి సరిపోదు.
- source_word: לְאַבְנֵר
  choice: అబ్నేరుకు
  rationale: మూలంలో వక్త తన పేరునే మూడవ పురుషలో ఉపయోగించి తనపై శిక్షను ఆహ్వానిస్తున్నాడు. పేరును అలాగే ఉంచి, అర్థస్పష్టత కోసం పాదసూచిక ఇచ్చాం.
- source_word: כַּאֲשֶׁר
  choice: చేసినట్టే
  rationale: యాహ్వే చేసిన ప్రమాణానికీ అబ్నేరు చేయబోయే కార్యానికీ ఉన్న సమానత్వాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసిన
  rationale: హీబ్రూ పరిపూర్ణ క్రియ గతంలో చేసిన, ఇప్పటికీ వర్తించే ప్రమాణాన్ని సూచిస్తుంది; తెలుగు సంబంధక్రియారూపం సందర్భంలో సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: నేను అతనికి చేస్తాను
  rationale: అపూర్ణ క్రియకు ఇక్కడ భవిష్యత్/సంకల్ప బలం ఉంది. దావీదుకు యాహ్వే ప్రమాణం చేసిన దానిని నెరవేర్చేందుకు అబ్నేరు ప్రకటించిన దృఢసంకల్పాన్ని సహజమైన తెలుగు భవిష్యత్ రూపం వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: ప్రమాణ సూత్రంలోని స్వీయశాప భావం
  choice: దేవుడు అబ్నేరుకు ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువే చేయుగాక
  alternative: నేను అలా చేయకపోతే దేవుడు నన్ను తీవ్రంగా శిక్షించుగాక
  rationale: ప్రత్యామ్నాయం అంతర్లీన ఉద్దేశాన్ని స్పష్టపరుస్తుంది గాని మూలంలో లేని నిరాకరణను, ‘శిక్షించు’ అనే నిర్దిష్ట క్రియను చేర్చుతుంది. ఎంచుకున్న రూపం హీబ్రూ సూత్రంలోని ఉద్దేశపూర్వక అస్పష్టతను, గంభీరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే ప్రమాణ భాషను ఉపయోగించాం. మూలంలోని అసంపూర్ణ వాక్యప్రవాహం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ చిహ్నాన్ని నిలిపాం.
