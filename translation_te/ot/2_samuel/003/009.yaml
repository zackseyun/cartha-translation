revisions:
- from: దేవుడు అబ్నేరుకు[a] ఇలాగే చేయుగాక, ఇంతకంటే ఎక్కువే చేయుగాక! యాహ్వే దావీదుకు ప్రమాణం చేసినట్టే నేను అతనికి చేస్తాను—
  to: దేవుడు అబ్నేరుకు[a] ఇలాగే చేయుగాక, మరింత కూడా చేయుగాక; యాహ్వే దావీదుకు ప్రమాణం చేసినట్టే, నేను అతని కోసం చేస్తాను—
