source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: te
  text: అబ్నేరు దావీదుతో, “నేను లేచి వెళ్లి, ఇశ్రాయేలీయులందరినీ నా ప్రభువైన రాజు దగ్గరికి సమకూరుస్తాను. వారు నీతో నిబంధన చేసుకుంటారు[a]; అప్పుడు నీవు కోరినదంతటిమీద రాజ్యమేలుతావు[b]” అన్నాడు. తరువాత దావీదు అబ్నేరును పంపివేశాడు; అతడు క్షేమంగా వెళ్లిపోయాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీతో నిబంధన కోస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నీ ప్రాణం కోరిన వాటన్నిటిమీద.”
    reason: lexical_alternative
  - marker: c
    text: “క్షేమంగా వెళ్లిపోయాడు” అనేది హాని లేకుండా, శాంతియుత సంబంధాలతో వెళ్లడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: నేను లేచి వెళ్లి
  rationale: సహోత్సాహక రూపాలు అబ్నేరు ప్రకటిస్తున్న దృఢ సంకల్పాన్ని సూచిస్తాయి. తెలుగులో సహజమైన క్రమాన్ని ఉంచుతూ ‘లేచి వెళ్లి’ అని అనువదించాం.
- source_word: וְאֶקְבְּצָה ... אֶת כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ ... సమకూరుస్తాను
  rationale: קבץ ప్రజలను ఒకచోట రాజకీయంగా సమీకరించడాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలు అంతటినీ’ కంటే వ్యక్తులను సూచించే ‘ఇశ్రాయేలీయులందరినీ’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: రాజైన నా ప్రభువు దగ్గరికి
  rationale: దిశను సూచించే אֶל భావాన్ని ‘దగ్గరికి’ తెలియజేస్తుంది; ‘నా ప్రభువు’ రాజసభలో గౌరవపూర్వక సంబోధనను నిలుపుతుంది.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: వారు నీతో నిబంధన చేసుకుంటారు
  rationale: כרת ברית అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం ‘నిబంధన చేసుకోవడం.’ ‘కోయడం’ అనే అక్షరార్థాన్ని ప్రధాన వచనంలో పెట్టడం తెలుగులో అపార్థానికి దారితీస్తుంది.
- source_word: וּמָלַכְתָּ
  choice: రాజ్యమేలుతావు
  rationale: ఈ క్రియ రాజుగా పరిపాలించడాన్ని సూచిస్తుంది; ‘రాజ్యమేలు’ దాని సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: నీవు కోరినదంతటిమీద
  rationale: נפשׁ ఇక్కడ కోరికగల అంతరంగ వ్యక్తిని సూచిస్తుంది. ప్రధాన వచనంలో సహజమైన తెలుగు వాడి, హీబ్రూ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: దావీదు అబ్నేరును పంపివేశాడు
  rationale: సందర్భంలో שלח అతిథిని సాగనంపడం లేదా వెళ్లనివ్వడం అనే భావాన్ని ఇస్తుంది; ‘పంపివేశాడు’ ఆ నిష్క్రమణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: అతడు క్షేమంగా వెళ్లిపోయాడు
  rationale: בשלום శాంతియుతంగా, హాని లేకుండా వెళ్లడాన్ని సూచించే హీబ్రూ నుడికారం. ‘క్షేమంగా’ దాని సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నిబంధనకు సంబంధించిన నుడికారం
  choice: నీతో నిబంధన చేసుకుంటారు
  alternative: అక్షరార్థంగా, ‘నీతో నిబంధన కోస్తారు’
  rationale: ఇక్కడ రాజకీయ ఒడంబడిక ఉద్దేశించబడింది. తెలుగు పాఠకులకు స్పష్టంగా ఉండే సాధారణ నిబంధన పదజాలాన్ని వాడి, ఆచార నేపథ్యమున్న హీబ్రూ అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- issue: נפשׁ కలిగిన కోరిక వ్యక్తీకరణ
  choice: నీవు కోరినదంతటిమీద
  alternative: నీ ప్రాణం కోరినదంతటిమీద
  rationale: ‘నీ ప్రాణం కోరినది’ హీబ్రూ నిర్మాణానికి దగ్గరగా ఉన్నా ఆధునిక తెలుగులో అసహజంగా ఉండవచ్చు. అందువల్ల భావాన్ని ప్రధాన వచనంలో స్పష్టంగా ఇచ్చి, మూలంలోని మానవశాస్త్రీయ పదాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: בשלום యొక్క భావ పరిధి
  choice: క్షేమంగా వెళ్లిపోయాడు
  alternative: శాంతితో వెళ్లిపోయాడు
  rationale: ఈ నుడికారం కేవలం అంతరంగ శాంతిని కాక, శాంతియుత సంబంధాలతో సురక్షితంగా సాగనంపబడటాన్ని కూడా సూచించవచ్చు. ‘క్షేమంగా’ సందర్భానికి సరిపోతుంది; విస్తృత భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. రాజసభ సంబోధనను ‘రాజైన నా ప్రభువు’గా నిలిపి, హీబ్రూ నుడికారాల అక్షరార్థాలను ప్రధాన వచనాన్ని భారంగా చేయకుండా పాదసూచికల్లో ఇచ్చాం.
