base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: te
  text: కాబట్టి యోవాబు మరియు అతని సహోదరుడు అబీషై అబ్నేరును చంపారు, ఎందుకంటే అబ్నేరు గిబియోనులో జరిగిన యుద్ధంలో వారి సహోదరుడు అసాహేలును చంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోవాబు మరియు అతని సహోదరుడు అబీషై అబ్నేరును చంపారు.” హెబ్రీ సంధానపదాన్ని కేవలం “మరియు” అని కూడా అనువదించవచ్చు; ఇక్కడ “కాబట్టి” అనేది చుట్టుపక్కల సందర్భంతో ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ לְאַבְנֵר
  choice: అబ్నేరును చంపారు
  rationale: הרג క్రియ యొక్క సాధారణ అర్థాన్ని నేరుగా తెలిపే పదప్రయోగం. ‘హత్య చేశారు’ అని అనడం మూలపాఠంలో స్పష్టంగా లేని న్యాయపరమైన లేదా నైతిక తీర్పును అదనంగా చేర్చవచ్చు.
- source_word: עַל אֲשֶׁר
  choice: ఎందుకంటే
  rationale: యోవాబు, అబీషై చేసిన కార్యానికి కారణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵמִית
  choice: చంపాడు
  rationale: מות హిఫీల్ రూపం ఇక్కడ మరణానికి కారణమవడాన్ని సూచిస్తుంది. తెలుగు సందర్భక్రమమే ఇది ముందుగా జరిగిన కార్యమని స్పష్టం చేస్తుంది కాబట్టి ప్రత్యేక పూర్వభూత రూపం అవసరం లేదు.
- source_word: אָחִיו / אֲחִיהֶם
  choice: అతని సహోదరుడు / వారి సహోదరుడు
  rationale: మొదటిది అబీషైకి యోవాబుతో ఉన్న బంధాన్ని, రెండవది అసాహేలుకు వారిద్దరితో ఉన్న బంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోనులో
  rationale: పోరాటం జరిగిన ప్రదేశాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: בַּמִּלְחָמָה
  choice: జరిగిన యుద్ధంలో
  rationale: నిర్దిష్టమైన, కథనంలో ముందే తెలిసిన యుద్ధాన్ని సూచించే హెబ్రీ నిర్దిష్టతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְ / וַ
  choice: కాబట్టి
  rationale: ముందరి సందర్భంతో ఉన్న వివరణాత్మక లేదా ఫలిత సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; సాధారణ ‘మరియు’ కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. ‘సహోదరుడు’ కుటుంబ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘కలిసి’ అనే పదం బహువచన క్రియలో ఇద్దరూ కార్యంలో పాలుపంచుకున్నారని సహజ తెలుగులో తెలియజేస్తుంది.
