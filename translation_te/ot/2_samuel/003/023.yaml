  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: te
  text: 'యోవాబు, అతనితో ఉన్న సైన్యమంతా వచ్చారు. అప్పుడు వారు యోవాబుకు ఇలా తెలియజేశారు: “నేరు కుమారుడు అబ్నేరు రాజు దగ్గరికి వచ్చాడు. రాజు అతన్ని పంపివేశాడు; అతడు క్షేమంగా వెళ్లిపోయాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: తిరిగి వచ్చారు
  rationale: సందర్భంలో యోవాబు సైనిక దాడి నుండి తిరిగి రావడం సూచితమవుతోంది; తెలుగులో సహజంగా వ్యక్తమయ్యేలా అనువదించబడింది.
- source_word: כָל־הַצָּבָא
  choice: సైన్యమంతా
  rationale: צָבָא ఇక్కడ యోవాబుతో ఉన్న సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట రాజును సూచించే హీబ్రూ పదానికి సహజమైన తెలుగు సమానం.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: రాజు అతన్ని పంపివేశాడు
  rationale: హీబ్రూలో కర్త ముందు పేర్కొన్న రాజే; తెలుగులో సందిగ్ధత రాకుండా కర్తను పునరుక్తం చేశాం.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: అబ్నేరు హాని లేకుండా సురక్షితంగా వెళ్లిపోయాడనే భావాన్ని ఇక్కడ సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, సంఘటనల క్రమం మరియు భావాన్ని నిలిపాం.
