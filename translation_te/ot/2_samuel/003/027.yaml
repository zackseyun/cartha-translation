  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַבְנֵר֙ חֶבְר֔וֹן וַ/יַּטֵּ֤/הוּ יוֹאָב֙ אֶל תּ֣וֹךְ הַ/שַּׁ֔עַר לְ/דַבֵּ֥ר אִתּ֖/וֹ בַּ/שֶּׁ֑לִי וַ/יַּכֵּ֤/הוּ שָׁם֙ הַ/חֹ֔מֶשׁ וַ/יָּ֕מָת בְּ/דַ֖ם עֲשָׂה אֵ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: te
  text: అబ్నేరు హెబ్రోనుకు తిరిగి వచ్చినప్పుడు, యోవాబు అతనితో ఏకాంతంగా[a] మాట్లాడడానికి అతన్ని ద్వారపు మధ్య భాగానికి పక్కకు తీసుకెళ్లాడు. అక్కడ అతని కడుపులో[b] దెబ్బకొట్టాడు; తన సోదరుడైన అసాహేలు రక్తం కారణంగా అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి అరుదైన హీబ్రూ పదానికి ‘ప్రశాంతంగా,’ ‘రహస్యంగా,’ లేదా ‘ఏకాంతంగా’ అనే అర్థాలు ఉండవచ్చు.
    reason: మూలపదమైన בַּשֶּׁלִי అర్థం అనిశ్చితం; ప్రధాన అనువాదంలో ఒకే భావాన్ని ఖచ్చితంగా నిర్ణయించినట్లు చూపకుండా ప్రత్యామ్నాయాలను తెలియజేయడం.
  - marker: b
    text: 'సాంప్రదాయిక అనువాదం: ‘ఐదవ పక్కటెముక దగ్గర.’ ఈ హీబ్రూ పదం కడుపు లేదా పొత్తికడుపు ప్రాంతాన్ని సూచించే జాతీయ ప్రయోగంగా ఉండవచ్చు.'
    reason: חֹמֶשׁకు ఉన్న సాంప్రదాయిక పదార్థాన్ని, అలాగే మరణదెబ్బ సందర్భంలో దాని సాధ్యమైన శరీరభాగ సూచనను భద్రపరచడం.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చినప్పుడు
  rationale: שוב అనే క్రియ సందర్భంలో అబ్నేరు పంపివేయబడిన తరువాత హెబ్రోనుకు తిరిగి రావడాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహానికి అనుగుణంగా కాలసంబంధ ఉపవాక్యంగా అనువదించబడింది.
- source_word: וַיַּטֵּהוּ
  choice: అతన్ని ... పక్కకు తీసుకెళ్లాడు
  rationale: హిఫీల్ రూపంలోని נטה దారినుంచి పక్కకు మళ్లించడం లేదా తీసుకెళ్లడం అనే భావాన్ని ఇస్తుంది; యోవాబు అబ్నేరును ప్రత్యేక ప్రదేశంలోకి మళ్లించిన చర్యను ఈ పదబంధం సహజంగా తెలియజేస్తుంది.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: ద్వారపు లోపలి భాగంలోకి
  rationale: תוךְ అంతర్భాగాన్ని లేదా మధ్యను, שַׁעַר ద్వార నిర్మాణాన్ని లేదా ద్వారప్రాంతాన్ని సూచించగలవు. తెలుగులో అసహజంగా అనిపించే ‘ద్వారం మధ్యలోకి’ కంటే ఈ రూపం మూలభావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: అతనితో ఏకాంతంగా మాట్లాడడానికి
  rationale: בַּשֶּׁלִי అరుదైన, అర్థనిర్ణయం కష్టమైన రూపం; నెమ్మదిగా, ప్రశాంతంగా, రహస్యంగా లేదా ఏకాంతంగా అనే భావాలు ప్రతిపాదించబడ్డాయి. కథన సందర్భంలో ‘ఏకాంతంగా’ సహజమైన ఎంపిక; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: అక్కడ అతని కడుపులో దెబ్బకొట్టాడు
  rationale: חֹמֶשׁను సాంప్రదాయంగా ‘ఐదవ పక్కటెముక’ అని అనువదించినా, ఈ మరణకథనాల్లో అది పొత్తికడుపు లేదా కడుపు ప్రాంతాన్ని సూచించే అవకాశం ఎక్కువ. ‘దెబ్బకొట్టాడు’ అనే పదం మూలంలోని נכהను అనవసరంగా ఆయుధంతో పొడిచాడని నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: וַיָּמָת
  choice: అతడు చనిపోయాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలోని తదుపరి ఫలితాన్ని తెలియజేస్తుంది. తెలుగులో స్వతంత్ర వాక్యంగా ఇవ్వడం సహజంగానూ మూలానికి సమీపంగానూ ఉంటుంది.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: యోవాబు తన సోదరుడైన అసాహేలు రక్తం నిమిత్తం ఇలా చేశాడు
  rationale: בְּדַם ఇక్కడ రక్తపాతానికి సంబంధించిన కారణం లేదా ప్రతీకార ప్రేరణను సూచిస్తుంది. ‘ప్రతీకారంగా’ అని పూర్తిగా వివరణాత్మకం చేయకుండా ‘రక్తం నిమిత్తం’ అనే న్యాయ-ప్రతీకార ఛాయ గల మూలవ్యక్తీకరణను నిలిపాం; తెలుగులో సర్వనామ సూచన స్పష్టంగా ఉండేందుకు యోవాబు పేరు పునరుక్తమైంది.
theological_decisions:
- issue: అసాహేలు రక్తానికి సంబంధించిన యోవాబు చర్య స్వరూపం
  choice: ‘రక్తం నిమిత్తం’ అని అనువదించి రక్తప్రతీకార ఛాయను నిలిపాం
  alternative: ‘అసాహేలును చంపినందుకు ప్రతీకారంగా’
  rationale: మూలపాఠం యోవాబు చర్యకు కారణాన్ని సంక్షిప్తంగా చెబుతుంది; దానిని న్యాయసమ్మతమైనదిగా లేదా కేవలం వ్యక్తిగత ప్రతీకారంగా స్పష్టంగా తీర్పు చెప్పదు. అందువల్ల వివరణాత్మక ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ద్వారపు లోపలి భాగం,’ ‘ఏకాంతంగా,’ ‘రక్తం నిమిత్తం’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని స్థలవివరణ, పదార్థ అనిశ్చితి, రక్తప్రతీకార ఉద్రిక్తతలను నిలుపుతాయి.
