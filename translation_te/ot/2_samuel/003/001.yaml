  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథనశైలి. హెబ్రీ వాక్యంలోని క్రమంగా పెరుగుతున్న బలం–తగ్గుతున్న బలం అనే సమాంతర వ్యత్యాసాన్ని ‘అంతకంతకు’ అనే పునరుక్తితో నిలిపింది.
