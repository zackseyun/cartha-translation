  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: te
  text: సౌలు వంశానికీ[b] దావీదు వంశానికీ మధ్య యుద్ధం చాలాకాలం కొనసాగింది[a]. దావీదు అంతకంతకు బలపడుతూ ఉండగా, సౌలు వంశం అంతకంతకు బలహీనపడుతూ వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం దీర్ఘంగా సాగింది.” హెబ్రీ విశేషణానికి అక్షరార్థం “దీర్ఘమైనది”; ఇక్కడ అది యుద్ధం సాగిన కాలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “వంశం” అనే మాట కుటుంబాన్ని, వంశపరంపరను లేదా పాలక రాజవంశాన్ని సూచించవచ్చు; ఇక్కడ హెబ్రీ పదంలో కుటుంబ, రాజకీయ భావాలు రెండూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: యుద్ధం చాలాకాలం కొనసాగింది
  rationale: אֲרֻכָּה అక్షరార్థంగా ‘దీర్ఘమైనది’; యుద్ధకాల వ్యవధిని సహజమైన ఆధునిక తెలుగులో ‘చాలాకాలం కొనసాగింది’ అని వ్యక్తపరుస్తుంది.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: సౌలు వంశానికి, దావీదు వంశానికి మధ్య
  rationale: בֵּית అనే పదం ఇక్కడ కుటుంబరేఖతోపాటు రాజకీయ పాలకవర్గ భావాన్నీ కలిగి ఉంది. తెలుగు ‘వంశం’ ఈ రెండు భావాలనూ సందర్భానుసారంగా మోయగలదు.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: దావీదు అంతకంతకు బలపడుతూ ఉండగా
  rationale: הלך తో కూడిన నిర్మాణం నిరంతర పురోగతిని సూచిస్తుంది; ‘అంతకంతకు బలపడుతూ’ ఆ క్రమవృద్ధిని సహజంగా తెలియజేస్తుంది.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: సౌలు వంశం అంతకంతకు బలహీనపడుతూ వచ్చింది
  rationale: సౌలు వంశంలోని సభ్యులను సమూహంగా సూచించే హెబ్రీ బహువచన రూపాన్ని తెలుగులో సహజమైన ఏకవచన సమూహనామంతో ఇచ్చి, క్రమంగా తగ్గుతున్న శక్తిని నిలిపింది.
- source_word: דַלִּים
  choice: బలహీనపడుతూ
  rationale: ఈ సైనిక-రాజకీయ సందర్భంలో పదం పేదరికాన్ని కాక శక్తి, స్థితి క్షీణతను సూచిస్తుంది.
