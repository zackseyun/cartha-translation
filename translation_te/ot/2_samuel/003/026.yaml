translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తుల పేర్లకు తెలుగు విభక్తులు సహజంగా జోడించబడ్డాయి; మూలంలోని స్థలపదానికి ఉన్న సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
