source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יוֹאָב֙ מֵ/עִ֣ם דָּוִ֔ד וַ/יִּשְׁלַ֤ח מַלְאָכִים֙ אַחֲרֵ֣י אַבְנֵ֔ר וַ/יָּשִׁ֥בוּ אֹת֖/וֹ מִ/בּ֣וֹר הַסִּרָ֑ה וְ/דָוִ֖ד לֹ֥א יָדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: te
  text: అప్పుడు యోవాబు దావీదును విడిచి బయలుదేరి, అబ్నేరు వెంబడి దూతలను పంపాడు. వారు అతన్ని సీరా బావి నుండి వెనక్కి తీసుకొచ్చారు.[a] అయితే దావీదుకు ఈ విషయం తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, హీబ్రూ పదబంధాన్ని స్థలనామంగా తీసుకుంటే, ‘బోర్-సీరా నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: కథన క్రమంలోని יצא కదలికను సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מֵעִם דָּוִד
  choice: దావీదు దగ్గరనుంచి
  rationale: עִם తో కూడిన ఈ ప్రయోగం ఒకరి సమక్షం లేదా సాంగత్యం నుంచి వెళ్లడాన్ని సూచిస్తుంది; ‘దగ్గరనుంచి’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ సందర్భంలో מלאכים దేవదూతలను కాకుండా పంపబడిన మానవ సందేశవాహకులను సూచిస్తుంది.
- source_word: אַחֲרֵי אַבְנֵר
  choice: అబ్నేరు వెనుక
  rationale: אַחֲרֵי ఇక్కడ అనుసరించడం లేదా వెంబడించడాన్ని సూచిస్తుంది; ‘వెనుక’ మూలంలోని సంక్షిప్తతను, సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: వారు ... అతన్ని వెనక్కి తీసుకొచ్చారు
  rationale: שוב యొక్క హిఫిల్ రూపంలోని కారణార్థాన్ని ‘వెనక్కి తీసుకొచ్చారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִבּוֹר הַסִּרָה
  choice: సీరా బావి దగ్గరనుంచి
  rationale: בּוֹר అంటే గొయ్యి, నీటి తొట్టి లేదా బావి కావచ్చు; ఈ స్థలనామ ప్రయోగంలో ‘సీరా బావి’ సహజమైన ప్రధాన పాఠం. ప్రత్యామ్నాయ స్థలనామ పఠనం పాదసూచికలో ఉంచబడింది.
- source_word: וְדָוִד לֹא יָדָע
  choice: అయితే దావీదుకు ఈ విషయం తెలియదు
  rationale: వ్యతిరేక భావాన్ని ‘అయితే’ తెలియజేస్తుంది; ‘ఈ విషయం’ అనేది యోవాబు చేసిన చర్యను సూచిస్తూ తెలుగులో వాక్యాన్ని సహజంగా పూర్తి చేస్తుంది.
