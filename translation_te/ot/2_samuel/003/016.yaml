translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని కొనసాగుతున్న చర్యను, రెండు ఆజ్ఞారూపాలను సాధ్యమైనంత స్పష్టంగా నిలిపాం.
