  text: וַ/יֵּ֨לֶךְ אִתָּ֜/הּ אִישָׁ֗/הּ הָל֧וֹךְ וּ/בָכֹ֛ה אַחֲרֶ֖י/הָ עַד בַּֽחֻרִ֑ים וַ/יֹּ֨אמֶר אֵלָ֥י/ו אַבְנֵ֛ר לֵ֥ךְ שׁ֖וּב וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: te
  text: ఆమె భర్త ఆమెతోపాటు, ఆమె వెనుక[a] నడుస్తూ ఏడుస్తూ, బహూరీము వరకు వెళ్లాడు. అప్పుడు అబ్నేరు అతనితో, “వెళ్లు, తిరిగిపో[b]” అన్నాడు. అతడు తిరిగిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆమెను అనుసరిస్తూ.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “వెళ్లు, తిరిగిపో” అని రెండు ఆజ్ఞారూపాలు ఉన్నాయి; లేదా “వెనక్కి వెళ్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: ఆమె భర్త
  rationale: ఈ సందర్భంలో אִישׁ అనే పదానికి మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం చేరి, కేవలం ‘ఆమె మనిషి’ అని కాక ఆమె భర్తనే సూచిస్తుంది.
- source_word: הָלוֹךְ וּבָכֹה
  choice: నడుస్తూ ఏడుస్తూ వెళ్లాడు
  rationale: ఈ హెబ్రీ నిర్మాణం కొనసాగుతున్న ప్రయాణాన్నీ ఏడుపునూ చిత్రిస్తుంది; తెలుగు కథనంలో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִתָּהּ / אַחֲרֶיהָ
  choice: ఆమెతోపాటు / ఆమె వెనుక
  rationale: మొదటి పదబంధం ఆమెతో కలిసి వెళ్లడాన్ని, రెండవది ఆమెను అనుసరిస్తూ వెనుక నడవడాన్ని సూచిస్తుంది; మూలంలోని రెండు సంబంధాలనూ విడివిడిగా నిలుపుతుంది.
- source_word: עַד בַּחֻרִים
  choice: బహూరీము వరకు
  rationale: עַד స్థలంతో వచ్చినప్పుడు ప్రయాణపు చివరి హద్దును సూచిస్తుంది; ‘వరకు’ ఆధునిక తెలుగులో సహజం.
- source_word: בַּחֻרִים
  choice: బహూరీము
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לֵךְ שׁוּב
  choice: వెళ్లు, తిరిగిపో
  rationale: మూలంలో ఉన్న రెండు ఆజ్ఞారూపాలనూ నిలిపి, ఆ ఆజ్ఞలోని బలాన్ని కాపాడుతుంది.
- source_word: וַיָּשֹׁב
  choice: అతడు తిరిగిపోయాడు
  rationale: ఆజ్ఞకు వెంటనే వచ్చిన ప్రతిస్పందనను సరళమైన తెలుగు కథన క్రమంలో తెలియజేస్తుంది.
