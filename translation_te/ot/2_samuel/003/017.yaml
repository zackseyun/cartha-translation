source:
  edition: WLC
  text: וּ/דְבַר אַבְנֵ֣ר הָיָ֔ה עִם זִקְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר גַּם תְּמוֹל֙ גַּם שִׁלְשֹׁ֔ם הֱיִיתֶ֞ם מְבַקְשִׁ֧ים אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עֲלֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/017.yaml
  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: te
  text: 'అబ్నేరు ఇశ్రాయేలు పెద్దలతో ఇలా మాట్లాడాడు: “గత కొంతకాలంగా దావీదు మీకు రాజు కావాలని మీరు కోరుతున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: అబ్నేరు ... మాట్లాడాడు
  rationale: హీబ్రూ నామవాచక నిర్మాణం ‘అబ్నేరు మాట ... తో ఉండింది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంభాషణగా వ్యక్తపరుస్తుంది; సందర్భంలో ఇది ముందుగా జరిగిన సంప్రదింపును సూచిస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: సమాజానికి ప్రాతినిధ్యం వహించే నాయకులనే సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు పదబంధం.
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: గత కొంతకాలంగా
  rationale: పదశః ‘నిన్న కూడా, అంతకుముందు కూడా’; ఇది ఇక్కడ ఇటీవలి లేదా గత కాలవ్యవధిని సూచించే హీబ్రూ నానుడి. తెలుగులో కాలవ్యాప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ עֲלֵיכֶם
  choice: దావీదు మీకు రాజు కావాలని మీరు కోరుతున్నారు
  rationale: ‘దావీదును మీ మీద రాజుగా వెదకడం/కోరడం’ అనే భావాన్ని సహజంగా అందిస్తూ, వారి కొనసాగుతున్న ఆకాంక్షను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం. హీబ్రూ కాలనానుడిని పదశః కాక భావసహజంగా అనువదించాం.
