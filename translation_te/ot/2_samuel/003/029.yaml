id: 2SA.3.29
reference: 2 Samuel 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: te
  text: అది యోవాబు తలమీదికి, అతని తండ్రి కుటుంబమంతటిమీదికి రావాలి. యోవాబు కుటుంబంలో స్రావం ఉన్నవాడు గానీ, చర్మవ్యాధి ఉన్నవాడు గానీ[a], కుదురు పట్టుకునేవాడు గానీ[b], ఖడ్గానికి బలై పడిపోయేవాడు గానీ, ఆహారం కొరవడినవాడు గానీ ఎప్పుడూ కొదవ కాకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధినే కాక, ఆచారపరంగా అపవిత్రత కలిగించేదిగా పరిగణించిన వివిధ చర్మవ్యాధులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కర్రపై ఆనుకునేవాడు.” హీబ్రూ పదబంధాన్ని కొందరు ఈ విధంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: తలమీదికి రావాలి
  rationale: మునుపటి వచనంలోని రక్తదోషం లేదా దాని శిక్ష ఒకరి తలమీదికి రావడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בֵּית אָבִיו
  choice: అతని తండ్రి వంశమంతటిమీదికి
  rationale: కేవలం ఒకే ఇంటివారిని కాక పితృవంశ కుటుంబరేఖను సూచించే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: యోవాబు వంశంలో ... ఎన్నటికీ లేకుండా పోకూడదు
  rationale: యోవాబు వంశంలో ఈ బాధలు ఎప్పటికీ నిలిచిపోవాలనే ప్రతికూల శాపసూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָב
  choice: స్రావరోగి
  rationale: దీర్ఘకాలిక శరీరస్రావంతో బాధపడే వ్యక్తిని సంక్షిప్తంగా, గౌరవప్రదంగా సూచిస్తుంది.
- source_word: מְצֹרָע
  choice: తీవ్రమైన చర్మవ్యాధి ఉన్నవాడు
  rationale: ఈ హీబ్రూ పదాన్ని ఆధునిక హాన్సెన్ వ్యాధికే పరిమితం చేయకుండా దాని విస్తృత వ్యాధి పరిధిని కాపాడుతుంది.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: కుదురు పట్టుకునేవాడు
  rationale: פֶּלֶךְ అనే పదానికి సాధారణంగా ఉన్న నూలు వడికే కుదురు అనే స్పష్టమైన అర్థాన్ని అనువదిస్తూ, కర్ర అనే పాఠవ్యాఖ్యానాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: נֹפֵל בַּחֶרֶב
  choice: కత్తిచేత పడిపోయేవాడు
  rationale: కత్తివల్ల మరణించడాన్ని తెలిపే హీబ్రూ నుడికారాన్నీ శాపజాబితా గంభీరతనూ నిలుపుతుంది.
- source_word: חֲסַר לָחֶם
  choice: ఆహారం కొరవడినవాడు
  rationale: లֶחֶם అనే 'రొట్టె' రూపకం జీవనాహారాన్ని సూచిస్తున్నందున సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే విధంగా భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దావీదు మాటల స్వభావం
  choice: యోవాబు వంశంపై తీర్పు రావాలని పలికిన శాపకాంక్ష
  alternative: భవిష్యత్తులో జరిగేదాన్ని తెలిపే ప్రవచనాత్మక ప్రకటన
  rationale: జస్సివ్/శాపార్థక వాక్యనిర్మాణం సాధారణ భవిష్యద్వాణికన్నా తీర్పు రావాలనే కోరికను సూచిస్తుంది; అందుకే 'రావాలి', 'లేకుండా పోకూడదు' అని అనువదించబడింది.
- issue: מַחֲזִיק בַּפֶּלֶךְ యొక్క అస్పష్టత
  choice: కుదురు పట్టుకునేవాడు
  alternative: కర్రపై ఆనుకునేవాడు
  rationale: పదానికి ప్రత్యక్షంగా 'కుదురు' అనే అర్థం బలంగా ఉన్నప్పటికీ, సంప్రదాయంగా 'కర్ర' అని గ్రహించే అవకాశం ఉంది; ప్రధాన పాఠంలో ఒక అర్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన శాపవాక్య ధోరణిని ఉంచుతూ సాధారణ పాఠకునికి సహజంగా ఉండే పదజాలం వాడబడింది. వరుసలోని ప్రతి బాధిత వర్గానికి ‘గానీ’ ప్రయోగించి హీబ్రూ జాబితా లయను నిలిపాం.
