  source_fidelity: మూలంలోని శాపకాంక్ష, యోవాబు మరియు అతని పితృకుటుంబంపై తీర్పు, అలాగే బాధల జాబితా ప్రధానంగా సరిగానే ప్రతిఫలించాయి. అయితే בֵּית אָבִיוకు “తండ్రి వంశమంతా” అనడం పితృకుటుంబం/ఇంటివారి భావాన్ని అవసరానికి మించి విస్తరిస్తుంది; מְצֹרָעకు “తీవ్రమైన” అనే విశేషణం మూలంలో లేదు.
