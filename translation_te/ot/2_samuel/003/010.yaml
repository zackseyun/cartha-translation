base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: te
  text: సౌలు ఇంటి నుండి రాజ్యాన్ని బదిలీ చేసి, దావీదు సింహాసనాన్ని ఇశ్రాయేలు మీదా యూదా మీదా స్థాపించడానికి, దాను నుండి బెయేర్షెబా వరకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాను నుండి బెయేర్షెబా వరకు’ అనేది ఉత్తరం నుండి దక్షిణం వరకు దేశమంతటినీ సూచించే భౌగోళిక నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: బదిలీ చేసి
  rationale: హిఫీల్ రూపం రాజ్యాధికారాన్ని ఒక పాలక వంశం నుండి మరొకదానికి వెళ్లేలా చేయడాన్ని సూచిస్తుంది; ‘బదిలీ చేసి’ అనే మాట ఆ రాజకీయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యాన్ని
  rationale: ఈ పదం రాజ్యాన్నీ రాజాధికారాన్నీ సూచించగలదు; సందర్భంలో ‘రాజ్యం’ సహజంగా ఉండి, భావ విస్తృతిని నిలుపుతుంది.
- source_word: מִבֵּית שָׁאוּל
  choice: సౌలు ఇంటివారి చేతిలోనుండి
  rationale: ‘ఇల్లు’ అనే హీబ్రూ వంశపారంపర్య ప్రయోగాన్ని నిలుపుతూ, అధికారం వారి ఆధీనంలో ఉందనే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְהָקִים
  choice: స్థిరపరచడానికి
  rationale: రాజకీయ సందర్భంలో హిఫీల్ రూపం స్థాపించడం లేదా దృఢంగా నిలపడం అనే భావం ఇస్తుంది; సింహాసనంతో ‘స్థిరపరచడం’ సహజంగా సరిపోతుంది.
- source_word: אֶת כִּסֵּא דָוִד
  choice: దావీదు సింహాసనాన్ని
  rationale: మూలంలోని స్పష్టమైన రాజరిక రూపకాన్ని అమూర్తమైన ‘పాలన’గా మార్చకుండా నిలుపుతుంది.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: ఇశ్రాయేలు మీదా యూదా మీదా
  rationale: రెండుసార్లు వచ్చిన עַל‌ను ప్రతిబింబిస్తూ ఉత్తర ఇశ్రాయేలు, యూదా అనే రెండు రాజకీయ పరిధులనూ విడివిడిగా నొక్కిచెబుతుంది.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: దాను మొదలుకొని బెయేరు-షెబా వరకు
  rationale: దేశపు ఉత్తర అంచు నుండి దక్షిణ అంచు వరకు ఉన్న మొత్తం ప్రాంతాన్ని సూచించే భౌగోళిక ప్రయోగాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: בְּאֵר שָׁבַע
  choice: బెయేరు-షెబా
  rationale: హీబ్రూ పేరులోని రెండు భాగాలను కనిపించేలా ఉంచే, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘సౌలు ఇల్లు’ అనే వంశపారంపర్య భాష మరియు ‘దావీదు సింహాసనం’ అనే రాజరిక రూపకం
  choice: ‘సౌలు ఇంటివారు’, ‘దావీదు సింహాసనం’ అనే స్పష్టమైన రూపాలను నిలుపడం
  alternative: ‘సౌలు వంశం నుండి దావీదు పాలనకు’ అని అమూర్తంగా అనువదించడం
  rationale: వచనం రాజాధికార బదిలీని ఉద్దేశించినా, హీబ్రూ దాన్ని ‘ఇల్లు’, ‘సింహాసనం’ అనే వంశపారంపర్య-రాజరిక చిత్రాలతో వ్యక్తం చేస్తుంది. వాటిని నిలుపడం తరువాతి సిద్ధాంతార్థాలను జోడించకుండా మూలపు భావరూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది ముందు వచనంలోని ప్రమాణ వాక్యాన్ని కొనసాగించే ఉద్దేశార్థక ఖండం కాబట్టి వాక్యాంత నిర్మాణాన్ని ‘చేయడానికి’గా ఉంచాం. భౌగోళిక పదబంధం ప్రధాన పాఠ్యంలో ఇశ్రాయేలు, యూదా రెండింటి పాలనా పరిధిని సూచించేలా అమర్చబడింది.
