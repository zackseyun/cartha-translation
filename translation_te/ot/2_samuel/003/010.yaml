  to: సౌలు ఇంటి నుండి రాజ్యాన్ని బదిలీ చేసి, దావీదు సింహాసనాన్ని ఇశ్రాయేలు మీదా యూదా మీదా స్థాపించడానికి, దాను నుండి బెయేర్షెబా వరకు.[a]
