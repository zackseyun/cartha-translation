  text: וַ/יֵּדְע֧וּ כָל הָ/עָ֛ם וְ/כָל יִשְׂרָאֵ֖ל בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י לֹ֤א הָיְתָה֙ מֵֽ/הַ/מֶּ֔לֶךְ לְ/הָמִ֖ית אֶת אַבְנֵ֥ר בֶּן נֵֽר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: te
  text: ఆ రోజున ప్రజలందరూ, ఇశ్రాయేలీయులందరూ నేరు కుమారుడైన అబ్నేరును చంపించడం రాజు నుండి వచ్చినది కాదని తెలుసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది రాజు నుండి వచ్చినది కాదని”; లేదా, “రాజు దానికి ఆజ్ఞ ఇవ్వలేదని.” హీబ్రూ పదప్రయోగం ఆ కార్యం యొక్క మూలం లేదా ఆరంభాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: తెలుసుకున్నారు
  rationale: ידע అనే క్రియ ఇక్కడ ఒక వాస్తవాన్ని గ్రహించడం లేదా తెలుసుకోవడం అనే భావాన్ని ఇస్తుంది; కథన సందర్భంలో ‘తెలుసుకున్నారు’ సహజంగా ఉంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: עם ఇక్కడ సాధారణంగా ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సామూహిక జాతీయ సూచనను సహజమైన తెలుగు వ్యక్తివాచక బహువచనంతో వ్యక్తపరుస్తుంది; ముందున్న ‘ప్రజలందరూ’తో ఉన్న పునరుక్తి భావాన్ని నిలుపుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచక హీబ్రూ పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: כִּי
  choice: అని
  rationale: వారు తెలుసుకున్న విషయాన్ని తెలిపే పరోక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: రాజు నుండి వచ్చినది కాదని
  rationale: מן సూచించే మూలం లేదా ఆరంభస్థాన భావాన్ని నిలుపుతుంది; రాజు నిర్దోషి అనో, అతడు ఆజ్ఞ ఇవ్వలేదనో స్పష్టంగా విస్తరించదు.
- source_word: לְהָמִית
  choice: చంపించడం
  rationale: מות యొక్క హిఫిల్ రూపంలోని ‘చనిపోయేలా చేయడం’ అనే causative భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; న్యాయపరమైన ఉరిశిక్ష భావాన్ని అనవసరంగా చేర్చదు.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: నేరు కుమారుడైన అబ్నేరును
  rationale: పేర్లను తెలుగు లిపిలో ప్రతిలిపి చేసి, పితృనామ సంబంధాన్ని సాధారణ గౌరవప్రదమైన తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అబ్నేరు మరణంలో దావీదు బాధ్యత ఎంతవరకు లేదని వచనం చెబుతోంది
  choice: అబ్నేరును చంపించడం రాజు నుండి వచ్చినది కాదని
  alternative: రాజు అబ్నేరును చంపించమని ఆజ్ఞాపించలేదని / అబ్నేరు మరణంలో రాజు నిర్దోషి అని
  rationale: హీబ్రూ వాక్యం ఆ చర్యకు మూలం రాజు కాదని చెబుతుంది. అది నేరుగా ఆజ్ఞ లేకపోవడం లేదా సంపూర్ణ నైతిక-న్యాయ నిర్దోషిత్వం వంటి మరింత బలమైన నిర్ణయాలను పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ మూలంలోని ‘ప్రజలందరూ—ఇశ్రాయేలీయులందరూ’ అనే విస్తృత సామూహిక ఉద్ఘాటనను, అలాగే రాజు సంబంధమైన మూలం/ఆరంభం అనే ఉద్దేశపూర్వక అస్పష్టతను నిలుపుకున్నాం.
