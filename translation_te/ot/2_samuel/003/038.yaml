source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ אֶל עֲבָדָ֑י/ו הֲ/ל֣וֹא תֵדְע֔וּ כִּי שַׂ֣ר וְ/גָד֗וֹל נָפַ֛ל הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/038.yaml
  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: te
  text: 'అప్పుడు రాజు తన సేవకులతో ఇలా అన్నాడు: “ఈ రోజు ఇశ్రాయేలులో ఒక అధిపతి, గొప్ప వ్యక్తి పడిపోయాడని మీకు తెలియదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి నేరమైన అనువాదం; సందర్భంలో రాజు దావీదు అని స్పష్టంగా ఉన్నందున పేరును చేర్చలేదు.
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: రాజసభ సందర్భంలో עֶבֶד అనే పదం ప్రాథమికంగా ‘సేవకుడు’ అని అర్థమిస్తుంది; ‘అధికారులు’ అని అనువదిస్తే వారి హోదాను మూలపాఠం కంటే నిర్దిష్టంగా చెప్పినట్లవుతుంది.
- source_word: הֲלוֹא תֵדְעוּ
  choice: మీకు తెలియదా?
  rationale: నిరాకరణతో కూడిన ప్రశ్నార్థక రూపం శ్రోతల సమ్మతిని ఆశించే అలంకారిక ప్రశ్న; తెలుగు రూపం దాని బలాన్ని, సహజత్వాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: అని
  rationale: వారు తెలుసుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణార్థక ‘అని’ దీనికి సహజమైన సమానం.
- source_word: שַׂר
  choice: అధిపతి
  rationale: ఈ పదం నాయకుడు, సేనాధిపతి, పాలకుడు లేదా ఉన్నతాధికారిని సూచించగలదు. అబ్నేరు యొక్క ఉన్నత సైనిక-రాజకీయ స్థితిని తెలియజేస్తూ, ‘రాజకుమారుడు’ అనే అతినిర్దిష్ట భావాన్ని నివారించడానికి ‘అధిపతి’ ఎంచుకున్నాం.
- source_word: וְגָדוֹל
  choice: ఒక గొప్పవాడు
  rationale: గుణవాచకం ఇక్కడ వ్యక్తిని సూచించే నామవాచకార్థంలో వాడబడింది; ‘గొప్పవాడు’ అతని ప్రాముఖ్యతను, స్థాయిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָפַל
  choice: పడిపోయాడు
  rationale: మరణాన్ని గంభీరంగా సూచించే ‘పడిపోవడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; సందర్భం దాని మరణార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: ‘ఈ దినం’ అనే మూలభావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఈ మరణం సంభవించిన జాతీయ పరిధిని సూచించే בְּ ఉపసర్గకు నేరమైన, సహజమైన అనువాదం.
