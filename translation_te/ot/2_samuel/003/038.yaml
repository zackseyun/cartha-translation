  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజు పలికిన శోకపూరిత, గంభీర స్వరాన్ని నిలిపాం. ‘పడిపోయాడు’ అనే మరణరూపకాన్ని వివరణాత్మకంగా ‘చనిపోయాడు’ అని మార్చకుండా కాపాడాం.
