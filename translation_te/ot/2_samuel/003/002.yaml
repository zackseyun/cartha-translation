  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: te
  text: దావీదుకు హెబ్రోనులో కుమారులు పుట్టారు. అతని మొదటి కుమారుడు యెజ్రెయేలీయురాలైన అహీనోయముకు పుట్టిన అమ్నోను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ו/ילדו
  choice: పుట్టారు
  rationale: హీబ్రూ రూపం సందర్భంలో నిష్క్రియాత్మక భావాన్ని ఇస్తుంది; తల్లులను కర్తలుగా స్పష్టంగా చెప్పకుండా, దావీదుకు కుమారులు పుట్టిన సంఘటనపై దృష్టి నిలుపుతుంది.
- source_word: לְ/דָוִד
  choice: దావీదుకు
  rationale: לְ ఇక్కడ సంబంధాన్ని సూచిస్తుంది; వంశావళి సందర్భంలో ‘దావీదుకు ... పుట్టారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: בָּנִים
  choice: కుమారులు
  rationale: ఈ పదం సాధారణంగా పిల్లలు అనే అర్థం కాకుండా మగ సంతానాన్ని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: בְּ/חֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ యొక్క సాధారణ స్థానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַ/יְהִי
  choice: అతని ... కుమారుడు
  rationale: మొదటి కుమారుణ్ణి పరిచయం చేసే హీబ్రూ వాక్యనిర్మాణాన్ని తెలుగులో సహజంగా పునర్వ్యవస్థీకరించింది; సముచ్చయాన్ని వేరుగా అనువదించడం అవసరం లేదు.
- source_word: בְכוֹר/וֹ
  choice: అతని మొదటి కుమారుడు
  rationale: జనన క్రమాన్ని స్పష్టంగా తెలిపి, בכור లోని కుటుంబపరమైన భావాన్ని కాపాడుతుంది; ‘పెద్ద కుమారుడు’ కంటే ‘మొదటి కుమారుడు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: אַמְנוֹן
  choice: అమ్నోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: לַ/אֲחִינֹעַם
  choice: అహీనోయముకు పుట్టాడు
  rationale: ఈ జనన జాబితాలో לַ తల్లితో సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘ఆమెకు పుట్టాడు’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: యెజ్రెయేలీయురాలైన
  rationale: స్త్రీలింగ ప్రాంతీయ గుర్తింపును కాపాడుతూ, అహీనోయము యెజ్రెయేలుకు చెందిన స్త్రీ అని సంక్షిప్తంగా తెలియజేస్తుంది.
