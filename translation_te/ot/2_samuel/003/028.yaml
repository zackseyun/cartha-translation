  terminology: యְהוָהను “యాహ్వే”గా స్థిరంగా లిప్యంతరీకరించారు. దావీదు, అబ్నేరు, నేరు పేర్లు స్పష్టంగా ఉన్నాయి. “నిర్దోషులం” నָקִי యొక్క అపరాధరాహిత్య భావాన్ని సముచితంగా అందిస్తుంది; “నా రాజ్యం” מַמְלַכְתִּי యొక్క రాజకీయ-సామూహిక పరిధిని నిలుపుతుంది.
