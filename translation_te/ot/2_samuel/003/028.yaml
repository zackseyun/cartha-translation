source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: te
  text: ఆ తరువాత[a] దావీదు ఆ సంగతి విని, “నేనూ నా రాజ్యమూ నేరు కుమారుడైన అబ్నేరు రక్తం విషయంలో[b] యాహ్వే ఎదుట ఎప్పటికీ నిర్దోషులం” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దీని తరువాత’ లేదా ‘తర్వాత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘అబ్నేరు రక్తాల నుండి.’ ఇది అబ్నేరు రక్తపాతానికి బాధ్యులై ఉండడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ఈ కాలసూచక పదబంధం కథనంలోని మునుపటి సంఘటన తర్వాత జరిగినదాన్ని సూచిస్తుంది. ‘ఆ తరువాత’ సహజమైన ఆధునిక తెలుగు; ‘దీని తరువాత’, ‘తర్వాత’ కూడా సాధ్యమైన అర్థాలు.
- source_word: וַיִּשְׁמַע
  choice: దావీదు ఆ సంగతి విని
  rationale: క్రియకు ప్రాథమిక అర్థం ‘విన్నాడు.’ ముందు చెప్పిన హత్యావార్తను సూచించేందుకు తెలుగులో సహజంగా ‘ఆ సంగతి’ చేర్చబడింది; కొత్త సమాచారమేమీ జోడించలేదు.
- source_word: נָקִי
  choice: నిర్దోషులం
  rationale: ఈ పదం అపరాధ బాధ్యత లేకపోవడాన్ని సూచిస్తుంది. కర్త ‘నేనూ నా రాజ్యమూ’ అనే సంయుక్త రూపంలో ఉన్నందున తెలుగు విధేయపదం బహువచనంగా వచ్చింది.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: నేనూ నా రాజ్యమూ
  rationale: దావీదు వ్యక్తిగతంగా, అలాగే అతని పాలనలోని రాజ్యం కూడా ఈ రక్తపాత బాధ్యతకు అతీతమని ప్రకటిస్తున్నాడు. మూలంలోని రెండు అంశాలనూ నేరుగా నిలుపుతుంది.
- source_word: מֵעִם יְהוָה
  choice: యాహ్వే ఎదుట
  rationale: ఈ హీబ్రూ ప్రయోగం యాహ్వేను సాక్షిగా, న్యాయనిర్ణేతగా ఉంచి ఆయన సమక్షంలో నిర్దోషిత్వాన్ని ప్రకటిస్తుంది. ‘ఎదుట’ తెలుగులో సహజంగా ఆ న్యాయపరమైన భావాన్ని అందిస్తుంది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: నిరంతరమైన లేదా శాశ్వతమైన కాలవ్యాప్తిని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִדְּמֵי
  choice: రక్తం విషయంలో
  rationale: అక్షరార్థంగా బహువచన ‘రక్తాల నుండి’ అయినా, ఇది హత్య లేదా రక్తపాతానికి సంబంధించిన అపరాధ బాధ్యతను సూచించే హీబ్రూ నుడికారం. ‘రక్తం విషయంలో’ concrete imageryని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: אַבְנֵר בֶּן נֵר
  choice: నేరు కుమారుడైన అబ్నేరు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తూ వ్యక్తి పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: దావీదు నిర్దోషిత్వ ప్రకటన పరిధి
  choice: నేనూ నా రాజ్యమూ ... నిర్దోషులం
  alternative: నేనూ నా రాజవంశమూ ... నిర్దోషులం
  rationale: מַמְלַכְתִּי అనేది రాజ్యం, రాజరికం లేదా రాజ్యపాలనను సూచించగలదు. ఇక్కడ విస్తృతమైన రాజకీయ సముదాయాన్ని సూచించే ‘నా రాజ్యం’ను ఎంచుకుని, దానిని కేవలం దావీదు వంశానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని న్యాయపరమైన నిర్దోషిత్వ భావం, రక్తానికి సంబంధించిన స్పష్టమైన రూపకం, దైవనామం యథాశక్తి నిలుపబడ్డాయి.
