base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: te
  text: వారు అబ్నేరును హెబ్రోనులో పాతిపెట్టారు. రాజు తన స్వరాన్ని ఎత్తి అబ్నేరు సమాధి వద్ద[a] ఏడ్చాడు; ప్రజలందరూ ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబ్నేరు సమాధి వైపు.” హీబ్రూ ఉపసర్గను మరింత అక్షరార్థంగా ఇలా చదవవచ్చు; అయితే సందర్భంలో “సమాధి వద్ద” అనే అర్థం సహజంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: వారు ... పాతిపెట్టారు
  rationale: קבר అనే క్రియకు సమాధి చేయడం లేదా పాతిపెట్టడం అనే అర్థం ఉంది. ఆధునిక తెలుగు కథనంలో ‘పాతిపెట్టారు’ సహజంగా ఉండి అంత్యక్రియల సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; నగరంలో జరిగిన సమాధిని తెలుగులో సహజంగా ‘హెబ్రోనులో’ అని వ్యక్తం చేయవచ్చు.
- source_word: וַיִּשָּׂא ... אֶת־קוֹלוֹ
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఎత్తాడు’ అనే ఈ హీబ్రూ నుడికారం గట్టిగా వినిపించే విలాపాన్ని సూచిస్తుంది. తెలుగులో ‘బిగ్గరగా ఏడ్చాడు’ దాని సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיֵּבְךְּ
  choice: ఏడ్చాడు
  rationale: בכה అంత్యక్రియల సందర్భంలో ఏడుపు లేదా విలాపాన్ని సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో ‘ఏడ్చాడు’ గంభీరతను కోల్పోకుండా స్పష్టంగా ఉంటుంది.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: అబ్నేరు సమాధి దగ్గర
  rationale: אֶל సాధారణంగా ‘వైపు’ అని అర్థమిచ్చినా, ఇక్కడ సమాధి వద్ద చేసిన విలాపాన్ని సూచించే సందర్భోచిత భావం ఉంది. ‘సమాధి దగ్గర’ సహజమైన తెలుగు; దిశను అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: ప్రజలందరూ కూడా ఏడ్చారు
  rationale: పునరావృతమైన בכה ను ‘ఏడ్చారు’గా స్థిరంగా అనువదించాం. ‘కూడా’ రాజు ఏడుపుతో ప్రజల ఏడుపుకు ఉన్న కథన సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
