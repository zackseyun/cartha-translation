  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: te
  text: మరియు ఆరవవాడు ఇత్రెయాము, దావీదు భార్య[అ] ఎగ్లాకు పుట్టినవాడు. వీరందరూ హెబ్రోనులో దావీదుకు పుట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “దావీదు యొక్క భార్య.” హీబ్రూలో నేరంగా “దావీదు భార్య” అని ఉంది. సందర్భంలో ఇది ఎగ్లాను దావీదు భార్యలలో ఒకరిగా గుర్తిస్తుంది; ఆమె మాత్రమే ఆయన భార్య అని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: ఆరవవాడు
  rationale: సంయోజక అవ్యయంతో కూడిన క్రమసంఖ్య ముందటి వచనాల్లోని దావీదు కుమారుల జాబితాను కొనసాగిస్తుంది. తెలుగులో సందర్భం వల్ల పురుష కుమారుడు సూచితమవుతున్నందున ‘ఆరవవాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יִתְרְעָם
  choice: ఇత్రెయాము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְעֶגְלָה
  choice: ఎగ్లాకు పుట్టిన
  rationale: ఈ జనన జాబితా సూత్రంలో לְ తల్లిని సూచిస్తుంది. తెలుగులో ‘ఎగ్లాకు పుట్టిన’ అనేది మాతృసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵשֶׁת דָּוִד
  choice: దావీదు భార్య
  rationale: నిర్మాణబంధంలోని పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం. ఇది సందర్భంలో ఎగ్లాను దావీదు భార్యలలో ఒకరిగా గుర్తిస్తుంది; ఆమె ఒక్కరే భార్య అని తప్పనిసరిగా సూచించదు.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న కుమారుల సమూహాన్ని సంగ్రహంగా సూచించే, వ్యక్తులకు తగిన తెలుగు సర్వనామం.
- source_word: יֻלְּדוּ
  choice: పుట్టారు
  rationale: ילד క్రియ యొక్క హోఫల్ రూపం ఈ వంశావళి సూత్రంలో ‘పుట్టారు’ అనే భావాన్ని ఇస్తుంది; అనవసరంగా కార్యనిర్వాహకత్వాన్ని వివరించదు.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: జనన ప్రకటనల్లో ילד + לְ తల్లిదండ్రి సంబంధాన్ని సూచిస్తుంది; ‘దావీదుకు పుట్టారు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ ఇక్కడ జననం జరిగిన స్థలాన్ని సూచిస్తుంది.
theological_decisions:
- issue: אֵשֶׁת דָּוִד పదబంధం ఎగ్లా ఒక్కరే దావీదు భార్య అని సూచిస్తుందా?
  choice: దావీదు భార్య
  alternative: దావీదు భార్యలలో ఒకరు
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా నిలుపుతూ, సందర్భంలో దావీదుకు అనేక భార్యలు ఉన్నారనే విషయాన్ని అనవసరంగా మార్చకుండా ఉంచాం. ‘భార్యలలో ఒకరు’ సందర్భపరంగా నిజమైనా, మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. వ్యక్తిపేర్లకు గౌరవబహువచనం వాడకుండా, సమూహాన్ని సూచించే చోట సహజమైన ‘వీరు’ ఉపయోగించాం. మూలంలోని పేరుపదబంధ క్రమాన్ని తెలుగు పఠనసౌలభ్యం కోసం స్వల్పంగా పునర్వ్యవస్థీకరించాం.
