  text: וַ/יִּשְׁלַח֙ אִ֣ישׁ בֹּ֔שֶׁת וַ/יִּקָּחֶ֖/הָ מֵ֣/עִֽם אִ֑ישׁ מֵ/עִ֖ם פַּלְטִיאֵ֥ל בֶּן לוש־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: te
  text: అప్పుడు ఇష్బోషెతు పంపించి, ఆమెను ఆమె భర్త దగ్గరనుండి, లయీషు కుమారుడైన పల్తీయేలు దగ్గరనుండి తీసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో పదశః: “ఆ పురుషుని దగ్గరనుండి, లయీషు కుమారుడైన పల్తీయేలు దగ్గరనుండి.” సందర్భాన్ని బట్టి “ఆ పురుషుడు” అనే మాటను ప్రధాన పాఠ్యంలో “ఆమె భర్త” అని అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపించి
  rationale: మూలంలో పంపబడినవారి కర్మ స్పష్టంగా చెప్పబడలేదు; అయితే తరువాతి క్రియతో సహజంగా అనుసంధానించడానికి తెలుగులో ‘మనుషులను’ సందర్భానుసారంగా పూరించాం.
- source_word: אִישׁ בֹּשֶׁת
  choice: ఇష్బోషెతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: וַיִּקָּחֶהָ
  choice: ఆమెను తీసుకురప్పించాడు
  rationale: לקח అంటే ప్రాథమికంగా ‘తీసుకోవడం’; ఇక్కడ ఇష్బోషెతు పంపిన మనుషుల ద్వారా ఆమెను తన దగ్గరకు రప్పించిన భావాన్ని సహజమైన తెలుగులో తెలిపాం, బలవంతంగా పట్టుకున్నాడనే అదనపు భావం చేర్చలేదు.
- source_word: מֵעִם
  choice: దగ్గరనుండి
  rationale: ఒకరి సహవాసం లేదా ఆధీనంనుండి వేరుచేయడాన్ని సూచించే ఈ ఉపసర్గను సహజంగా ‘దగ్గరనుండి’ అని అనువదించి, మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: אִישׁ
  choice: ఆమె భర్త
  rationale: పదశః ‘మనిషి/పురుషుడు’; సందర్భంలో మీకాలు వివాహబంధంలో ఉన్న వ్యక్తిని సూచిస్తున్నందున ‘ఆమె భర్త’ అని స్పష్టం చేశాం.
- source_word: פַּלְטִיאֵל
  choice: పల్తీయేలు
  rationale: ఈ వచనంలోని మసొరా పాఠ్య రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶּן לוש
  choice: లయీషు కుమారుడు
  rationale: בֶּן అనే పుత్రసంబంధ పదాన్ని ‘కుమారుడు’గా, వ్యక్తినామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు రూపమైన ‘లయీషు’గా ఇచ్చాం.
theological_decisions:
- issue: మీకాలుతో పల్తీయేలు సంబంధం
  choice: ‘ఆమె భర్త’ అని సందర్భార్థాన్ని స్పష్టం చేయడం
  alternative: ‘ఆ పురుషుడు’ అని పదశః అనువదించడం
  rationale: అధ్యాయ సందర్భంలో אִישׁ ఆమెతో వివాహబంధంలో ఉన్న పల్తీయేలును సూచిస్తుంది. అయినప్పటికీ హీబ్రూ పదశః రూపాన్ని పాదటిప్పణిలో నమోదు చేసి సంబంధంలోని కథనాత్మక ఉద్రిక్తతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘పంపించి… తీసుకురప్పించాడు’ అనే నిర్మాణం హీబ్రూ వరుస క్రియలను తెలుగులో సహజంగా కలుపుతుంది. మూలంలోని ‘దగ్గరనుండి’ పునరుక్తిని డాష్‌లతో నిలిపి, పల్తీయేలు ఎవరో స్పష్టం చేశాం.
