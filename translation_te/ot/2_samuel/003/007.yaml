translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన కథన తెలుగు. మూలంలోని లైంగిక సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ పాఠకుడికి అర్థమయ్యేలా పాదటిప్పణిలో వివరించాం. ‘ఇష్బోషెతు’ అనే కర్త పూర్వసందర్భం ఆధారంగా స్పష్టీకరించబడింది.
