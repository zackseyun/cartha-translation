revisions:
- from: సౌలుకు రిస్పా అనే ఉపపత్ని ఉండేది. ఆమె అయ్యా కుమార్తె. ఇష్బోషెతు అబ్నేరుతో[a], “నువ్వెందుకు నా తండ్రి ఉపపత్ని దగ్గరికి వెళ్లావు?” అని అడిగాడు.
  to: సౌలుకు రిస్పా అనే ఉపపత్ని ఉండేది; ఆమె అయ్యా కుమార్తె. ఇష్బోషెతు అబ్నేరుతో[a], “నీవు నా తండ్రి ఉపపత్నితో ఎందుకు సంగమించావు?” అని అన్నాడు.
