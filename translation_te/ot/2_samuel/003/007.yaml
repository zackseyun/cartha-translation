source:
  edition: WLC
  text: וּ/לְ/שָׁא֣וּל פִּלֶ֔גֶשׁ וּ/שְׁמָ֖/הּ רִצְפָּ֣ה בַת אַיָּ֑ה וַ/יֹּ֨אמֶר֙ אֶל אַבְנֵ֔ר מַדּ֥וּעַ בָּ֖אתָה אֶל פִּילֶ֥גֶשׁ אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: te
  text: సౌలుకు రిస్పా అనే ఉపపత్ని ఉండేది; ఆమె అయ్యా కుమార్తె. ఇష్బోషెతు అబ్నేరుతో[a], “నీవు నా తండ్రి ఉపపత్నితో ఎందుకు సంగమించావు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “నీవు నా తండ్రి ఉపపత్నితో ఎందుకు లైంగిక సంబంధం పెట్టుకున్నావు?” హీబ్రూలో అక్షరార్థంగా, “లోపలికి వెళ్లావు” అని ఉంది; ఇది లైంగిక సంబంధాన్ని సూచించే సాధారణ సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: సౌలుకు ... ఉండేది
  rationale: లామెద్‌తో వ్యక్తమయ్యే స్వామ్యార్థక అస్తిత్వ నిర్మాణాన్ని సహజమైన తెలుగులో ‘సౌలుకు ... ఉండేది’గా అందించాం; వావ్‌ను ప్రత్యేక కాలసూచక పదంగా విస్తరించలేదు.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: ఉపపత్ని
  rationale: హీబ్రూ సామాజిక-కుటుంబ వర్గాన్ని సూచించే పదానికి ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంక్షిప్త సమానం.
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: రిస్పా అనే ... ఆమె అయ్యా కుమార్తె
  rationale: పేరు మరియు పితృవంశ పరిచయాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా అమర్చాం; వ్యక్తినామాలను మూలధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר אֶל אַבְנֵר
  choice: ఇష్బోషెతు అబ్నేరుతో ... అని అడిగాడు
  rationale: హీబ్రూలో కర్త అంతర్లీనంగా ఉన్నా పూర్వసందర్భం ఇష్బోషెతును సూచిస్తుంది. తెలుగులో అస్పష్టత నివారించేందుకు పేరును చేర్చి, ప్రశ్నాత్మక ప్రత్యక్ష వాక్యానికి సహజంగా ‘అడిగాడు’ వాడాం.
- source_word: מַדּוּעַ בָּאתָה אֶל
  choice: నువ్వెందుకు ... దగ్గరికి వెళ్లావు?
  rationale: బוא אל అనే ‘లోపలికి/దగ్గరికి వెళ్లడం’ రూపకం ఇక్కడ లైంగిక సంబంధానికి సభ్యోక్తి. ప్రధాన పాఠ్యంలో దాని పరోక్షతను నిలిపి, అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: నా తండ్రి ఉపపత్ని
  rationale: హీబ్రూ సంబంధబంధాన్ని సరళమైన తెలుగు స్వామ్య నిర్మాణంతో యథాతథంగా అందించాం.
