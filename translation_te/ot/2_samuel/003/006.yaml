  text: וַ/יְהִ֗י בִּֽ/הְיוֹת֙ הַ/מִּלְחָמָ֔ה בֵּ֚ין בֵּ֣ית שָׁא֔וּל וּ/בֵ֖ין בֵּ֣ית דָּוִ֑ד וְ/אַבְנֵ֛ר הָיָ֥ה מִתְחַזֵּ֖ק בְּ/בֵ֥ית שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/006.yaml
  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: te
  text: సౌలు వంశానికీ దావీదు వంశానికీ మధ్య యుద్ధం కొనసాగుతున్నప్పుడు, అబ్నేరు సౌలు వంశంలో తనను తాను బలపరచుకుంటూ ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సౌలు వంశంలో బలపడుతూ ఉన్నాడు.” హీబ్రూ క్రియ బలపడటాన్ని లేదా తనను తాను బలపరచుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: యుద్ధం కొనసాగుతున్నప్పుడు
  rationale: ב + היה అనే నిర్మాణం యుద్ధం కొనసాగుతున్న కాలాన్ని సూచిస్తుంది. తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అనువదించబడింది; וַיְהִיకి ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చడం అవసరం లేదు.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: సౌలు వంశానికీ దావీదు వంశానికీ మధ్య
  rationale: בֵּית ఇక్కడ కేవలం నివాసగృహాన్ని కాక కుటుంబ-రాజకీయ వర్గాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశం’ ఈ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְאַבְנֵר
  choice: అబ్నేరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הָיָה מִתְחַזֵּק
  choice: తనను తాను బలపరచుకుంటూ ఉన్నాడు
  rationale: חזק యొక్క హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని నిలుపుతూ, అబ్నేరు తన స్థానాన్ని లేదా ప్రభావాన్ని పటిష్ఠం చేసుకుంటున్న భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּבֵית שָׁאוּל
  choice: సౌలు వంశంలో
  rationale: בְּ ఇక్కడ అబ్నేరు బలపడుతున్న పరిధిని లేదా అధికార స్థావరాన్ని సూచిస్తుంది. ‘వంశంలో’ కుటుంబ, రాజకీయ భావాలకు రెండింటికీ చోటిస్తుంది.
theological_decisions:
- issue: מִתְחַזֵּק యొక్క భావం
  choice: తనను తాను బలపరచుకుంటూ ఉన్నాడు
  alternative: బలపడుతూ ఉన్నాడు
  rationale: క్రియారూపం బలపడటం అనే మధ్యమ/ఆత్మనేపద భావానికీ, తన అధికార స్థానాన్ని పటిష్ఠం చేసుకోవడం అనే భావానికీ వీలు కల్పిస్తుంది. ప్రధాన పాఠ్యంలో ఆత్మనేపద ఛాయను నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘వంశం’ అనే పదం హీబ్రూ ‘ఇల్లు’ అనే రాజకీయ-కుటుంబ రూపకాన్ని తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యాంతంలో ఉంచబడింది.
