  to: 'ఇప్పుడు అయితే[a] ఆ పని చేయండి; ఎందుకంటే యాహ్వే దావీదుకు ఇలా చెప్పాడు: “నా సేవకుడైన దావీదు ద్వారా నా ప్రజలైన ఇశ్రాయేలును ఫిలిష్తీయుల చేతిలోనుండి, వారి శత్రువులందరి చేతిలోనుండి నేను రక్షిస్తాను.”'
