id: 2SA.3.18
reference: 2 Samuel 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: te
  text: 'ఇప్పుడు అయితే[a] ఆ పని చేయండి; ఎందుకంటే యాహ్వే దావీదుకు ఇలా చెప్పాడు: “నా సేవకుడైన దావీదు ద్వారా నా ప్రజలైన ఇశ్రాయేలును ఫిలిష్తీయుల చేతిలోనుండి, వారి శత్రువులందరి చేతిలోనుండి నేను రక్షిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా సేవకుడైన దావీదు నా ప్రజలైన ఇశ్రాయేలును ఫిలిష్తీయుల చేతిలోనుండి, వారి శత్రువులందరి చేతిలోనుండి రక్షిస్తాడు.” హీబ్రూ రూపంలో దావీదును వ్యాకరణ కర్తగా కూడా గ్రహించవచ్చు; ప్రధాన పాఠ్యం యాహ్వేను అంతర్లీన వక్తగా, దావీదును ఆయన కార్యసాధనంగా గ్రహిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి సంభాషణ నుంచి తక్షణ కార్యాచరణకు మారే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲשׂוּ
  choice: ఆ పని చేయండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను ప్రత్యక్షంగా ఉంచి, సందర్భంలో ప్రతిపాదించిన కార్యాన్ని సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు ఆధారమైన కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో ఉంచుతుంది.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: దావీదును గురించి ఇలా చెప్పాడు
  rationale: ఈ సందర్భంలో אֶל דָּוִד‌ను దావీదుకు చేసిన ప్రత్యక్ష సంబోధనగా కాక, దావీదును గురించిన ప్రకటనగా గ్రహించడం తరువాతి ఉద్ధరణకు సహజంగా సరిపోతుంది; అయితే నిర్మాణానికి కొంత వ్యాఖ్యానావకాశం ఉంది.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: నా సేవకుడైన దావీదు ద్వారా
  rationale: בְּיַד అనే సాధనార్థక హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో ‘ద్వారా’గా వ్యక్తపరుస్తుంది; עַבְדִּיకి రాజసేవా సందర్భానుకూలంగా ‘నా సేవకుడు’ అని ఉంచుతుంది.
- source_word: הוֹשִׁיעַ
  choice: నేను రక్షిస్తాను
  rationale: యెహోవానే అంతర్లీన వక్తగా, దావీదు ఆయన సాధనంగా ఉన్న పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; దావీదు కర్తగా ఉండగల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలును
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే స్వామ్యార్థాన్ని, ఇశ్రాయేలు అనే వివరణాత్మక నామాన్ని సహజ తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: ఫిలిష్తీయుల చేతిలోనుండి, వారి శత్రువులందరి చేతిలోనుండి
  rationale: ‘చేతిలోనుండి’ అనే శక్తి లేదా ఆధీనతను సూచించే హీబ్రూ నుడికారాన్ని, దాని పునరుక్తితో సహా నిలుపుతుంది.
theological_decisions:
- issue: హוֹשִׁיעַలో రక్షించే కర్త ఎవరు?
  choice: యెహోవా అంతర్లీన వక్తగా ‘నేను రక్షిస్తాను’; దావీదు ఆయన సాధనం.
  alternative: ‘నా సేవకుడైన దావీదు నా ప్రజలైన ఇశ్రాయేలును రక్షిస్తాడు.’
  rationale: ఉద్ధరణలో ‘నా సేవకుడు’ అనే ప్రథమ పురుష స్వామ్యరూపం, ‘దావీదు ద్వారా’ అనే సాధనార్థక పదబంధం యెహోవా కార్యాన్ని ప్రధాన పఠనంగా సమర్థిస్తాయి. అయినా హీబ్రూ రూపం దావీదును వ్యాకరణ కర్తగా గ్రహించే అవకాశాన్ని కూడా ఇస్తుంది; అందువల్ల దానిని పాదటిప్పణిలో నమోదు చేశాం.
- issue: אֶל דָּוִד యొక్క సంబంధార్థం
  choice: ‘దావీదును గురించి’
  alternative: ‘దావీదుతో/దావీదుకు’
  rationale: అబ్నేరు ఇశ్రాయేలు పెద్దలకు దావీదును రాజుగా చేయమని ప్రోత్సహిస్తున్న సందర్భంలో, తరువాతి దైవవాక్యం దావీదును గురించిన ప్రకటనగా చదవడం సందర్భోచితం. అయినా אֶל సాధారణంగా ‘కు/తో’ అనే అర్థమూ కలిగి ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనా గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారమైన ‘చేతిలోనుండి’ని సాహిత్య పునరుక్తితో నిలిపి, సాధనార్థక בְּיַד‌ను మొదటి సందర్భంలో సహజమైన ‘ద్వారా’గా అనువదించాం.
