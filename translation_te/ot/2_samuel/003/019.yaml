id: 2SA.3.19
reference: 2 Samuel 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר גַּם אַבְנֵ֖ר בְּ/אָזְנֵ֣י בִנְיָמִ֑ין וַ/יֵּ֣לֶךְ גַּם אַבְנֵ֗ר לְ/דַבֵּ֞ר בְּ/אָזְנֵ֤י דָוִד֙ בְּ/חֶבְר֔וֹן אֵ֤ת כָּל אֲשֶׁר טוֹב֙ בְּ/עֵינֵ֣י יִשְׂרָאֵ֔ל וּ/בְ/עֵינֵ֖י כָּל בֵּ֥ית בִּנְיָמִֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: te
  text: అబ్నేరు బెన్యామీనీయులతో కూడా మాట్లాడాడు. తరువాత అబ్నేరు హెబ్రోనుకు వెళ్లి, ఇశ్రాయేలీయులకూ బెన్యామీను వంశమంతటికీ మంచిదిగా అనిపించినదంతా దావీదుతో కూడా మాట్లాడాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: తో
  rationale: ‘చెవుల్లో’ అనే హీబ్రూ నుడికారానికి ఇక్కడ సహజమైన తెలుగు భావం ‘వారితో/అతనితో మాట్లాడాడు.’ రెండు సందర్భాల్లోనూ సంభాషణ గ్రహీతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִנְיָמִין
  choice: బెన్యామీనీయులు
  rationale: ఇక్కడ వ్యక్తి బెన్యామీను కాక, అతని గోత్ర ప్రజలు సమష్టిగా ఉద్దేశించబడ్డారు; తెలుగులో బహువచన ప్రజానామం అపార్థాన్ని నివారిస్తుంది.
- source_word: לְדַבֵּר
  choice: మాట్లాడడానికి / మాట్లాడాడు
  rationale: דבר అనే సాధారణ క్రియను అనవసరంగా ‘ఒప్పించడానికి’ లేదా ‘చర్చించడానికి’ అని విశదీకరించకుండా, సందర్భానికి సహజంగా అనువదించబడింది.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనుకు వెళ్లి
  rationale: హీబ్రూ వాక్యంలో ‘వెళ్లాడు’ అనే గమనక్రియతో హెబ్రోను సమావేశ స్థలంగా వస్తుంది; తెలుగులో గమ్యార్థక రూపం సహజంగా ఉంటుంది.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: ఏది మంచిదిగా అనిపించిందో దానంతటి గురించి
  rationale: ‘కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారంలోని అభిప్రాయ/ఆమోద భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: దేశనామం ఇక్కడ ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగులో ప్రజానామం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: బెన్యామీను వంశమంతా
  rationale: ‘బెన్యామీను ఇంటివారందరూ’ అనే బంధుత్వ-గోత్ర భావాన్ని ‘వంశమంతా’ సహజంగా కాపాడుతుంది; కేవలం ఆధునిక పరిపాలనా ‘గోత్రం’గా కుదించదు.
- source_word: גַּם ... גַּם
  choice: కూడా ... కూడా
  rationale: అబ్నేరు చేసిన రెండు అదనపు చర్యలపై ఉన్న సమాంతర ఉద్ఘాటనను రెండు చోట్ల ‘కూడా’తో నిలిపింది.
- source_word: וַיְדַבֵּר ... וַיֵּלֶךְ
  choice: మాట్లాడాడు ... వెళ్లి ... మాట్లాడాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సాధారణ భూతకాల తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన కథన శైలి. హీబ్రూ నుడికారాలను పదశః కఠినంగా కాక భావసమానంగా అందిస్తూ, ఇశ్రాయేలు మరియు బెన్యామీను సమూహాల అభిప్రాయాన్ని వచనంలోని విధంగానే ఉంచింది.
