  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אִֽישׁ בֹּ֥שֶׁת בֶּן שָׁא֖וּל לֵ/אמֹ֑ר תְּנָ֤/ה אֶת אִשְׁתִּ/י֙ אֶת מִיכַ֔ל אֲשֶׁר֙ אֵרַ֣שְׂתִּי לִ֔/י בְּ/מֵאָ֖ה עָרְל֥וֹת פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: te
  text: 'అప్పుడు దావీదు సౌలు కుమారుడైన ఇష్‌బోషెతు వద్దకు దూతలను పంపి ఈ మాట చెప్పించాడు: “వందమంది ఫిలిష్తీయుల సున్నతి చర్మాలను ఇచ్చి నేను నిశ్చయించుకున్న[a] నా భార్య మీకాలును నాకు అప్పగించు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావానుసారంగా: “వందమంది ఫిలిష్తీయుల సున్నతి చర్మాలను ఇచ్చి నేను భార్యగా పొందిన మీకాలును.” హీబ్రూలో అక్షరార్థంగా, “నేను నాకు నిశ్చయించుకున్న” అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: సౌలు కోరిన వధూమూల్యంగా ఫిలిష్తీయుల సున్నతి చర్మాలను సమర్పించి దావీదు మీకాలును పొందిన వృత్తాంతం కోసం 1 సమూయేలు 18:25–27 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు దావీదు ... పంపి
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: మానవ ప్రతినిధుల సందర్భంలో ఈ పదానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం ‘దూతలు’.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: సౌలు కుమారుడైన ఇష్‌బోషెతు దగ్గరికి
  rationale: హీబ్రూ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో సహజమైన గమ్యప్రయోగాన్ని వాడింది.
- source_word: לֵאמֹר
  choice: అని చెప్పించాడు
  rationale: దూతల ద్వారా పంపిన ప్రత్యక్ష సందేశమని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תְּנָה
  choice: నాకు అప్పగించు
  rationale: ఇక్కడ נתן ఒక వ్యక్తిని తిరిగి తనకు ఇవ్వాలనే అధికారపూర్వక డిమాండ్; ‘అప్పగించు’ సందర్భానికి తగినది, అయితే మూలంలోని ‘ఇవ్వు’ భావాన్ని మించదు.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: నా భార్య మీకాలును
  rationale: రెండవ కర్మసూచకం మొదటి నామవాచకాన్ని వివరిస్తుంది; తెలుగులో ఈ సమాససదృశ నిర్మాణం సహజంగా ఉంది.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: నాకు నేను నిశ్చయించుకున్న
  rationale: ארשׂ వివాహ నిశ్చయాన్ని సూచిస్తుంది; לִי లోని స్వప్రయోజన భావాన్ని ‘నాకు నేను’ నిలుపుతుంది. అసాధారణత మూలంలోని న్యాయపరమైన హక్కుదావాను ప్రతిబింబిస్తుంది.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: వందమంది ఫిలిష్తీయుల సున్నతి చర్మాలను ఇచ్చి
  rationale: בְּ ఇక్కడ వధూమూల్య సాధనాన్ని సూచిస్తుంది. సంఖ్య మనుషులతో సంబంధించిందని 1 సమూయేలు 18 సందర్భం స్పష్టం చేస్తుంది; ‘సున్నతి చర్మాలు’ అసలు వాక్యంలోని నిర్దిష్టమైన, కఠినమైన దృశ్యాన్ని దాచదు.
theological_decisions:
- issue: మీకాలు పట్ల దావీదు వివాహ సంబంధ హోదా
  choice: ‘నా భార్య’తో పాటు ‘నాకు నేను నిశ్చయించుకున్న’ అని ఉంచడం
  alternative: ఉద్రిక్తతను సవరించి కేవలం ‘నేను పెళ్లి చేసుకున్న’ అని అనువదించడం
  rationale: హీబ్రూలో దావీదు ఆమెను తన భార్యగా పిలుస్తూనే, తన హక్కును పూర్వపు వివాహ నిశ్చయం/వధూమూల్యంపై ఆధారపరుస్తాడు. రెండు భావాలనూ నిలుపడం మూలంలోని న్యాయ-సంబంధ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘సున్నతి చర్మాలు’ అనే స్పష్టమైన పదబంధం మూలంలోని కఠినతను మృదువుచేయకుండా నిలుపుతుంది. [a], [b] సూచికలు ప్రధాన వచనంలో ఉన్నాయి.
