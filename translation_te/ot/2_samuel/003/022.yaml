base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: te
  text: ఇదిగో, దావీదు సేవకులూ యోవాబూ ఒక దండయాత్ర[a] నుండి తిరిగివచ్చి, విస్తారమైన దోపుడు సొమ్మును తమతో తీసుకొచ్చారు. అయితే అబ్నేరు దావీదుతో హెబ్రోనులో లేడు; ఎందుకంటే దావీదు అతణ్ణి పంపివేశాడు, అతడు క్షేమంగా[b] వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దండు నుండి.’ హీబ్రూ పదం దండును లేదా దాడికి వెళ్లిన బృందాన్ని సూచించగలదు; తరువాతి వాక్యభాగంలో దోపుడు సొమ్ము ప్రస్తావన ఉన్నందున ఇక్కడ ‘దండయాత్ర’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘శాంతితో వెళ్లిపోయాడు.’ అంటే అతడు హాని లేకుండా, సత్సంబంధాలతో వెళ్లిపోయాడు.
    reason: idiom
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా ఎదురైన కొత్త పరిణామాన్ని సజీవంగా పరిచయం చేసే హీబ్రూ సూచనాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַבְדֵי דָוִד
  choice: దావీదు సేవకులు
  rationale: ఇక్కడ ఈ పదం దావీదు సేవలో ఉన్న అనుచరులు లేదా సైనిక సహాయకులను సూచిస్తుంది; బానిసత్వాన్ని తప్పనిసరిగా సూచించదు.
- source_word: בָּא מֵהַגְּדוּד
  choice: ఒక దండయాత్ర నుండి తిరిగివచ్చి
  rationale: గְּדוּד అనే పదం దండును లేదా దాడికి వెళ్లిన బృందాన్ని సూచించగలదు. తరువాత దోపుడు సొమ్ము ప్రస్తావన రావడం వల్ల ‘దండయాత్ర’ సందర్భానికి సరిపోతుంది; గమనం తిరిగి కథాస్థలానికి రావడమని తెలుగులో స్పష్టం చేయబడింది.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: విస్తారమైన దోపుడు సొమ్మును తమతో తీసుకొచ్చారు
  rationale: שָׁלָל యుద్ధం లేదా దాడిలో స్వాధీనం చేసుకున్న సొమ్మును సూచిస్తుంది; רָב దాని అధిక పరిమాణాన్ని తెలియజేస్తుంది.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: అయితే అబ్నేరు దావీదుతో హెబ్రోనులో లేడు
  rationale: వచ్చిన యోవాబు బృందానికి వ్యతిరేకంగా అబ్నేరు అక్కడ లేకపోవడాన్ని చూపేందుకు וְ ను సందర్భానుసారంగా ‘అయితే’ అని అనువదించాం.
- source_word: כִּי שִׁלְּחוֹ
  choice: ఎందుకంటే దావీదు అతణ్ణి పంపివేశాడు
  rationale: హీబ్రూలో కర్త వ్యక్తంగా లేకపోయినా, సమీప సందర్భంలో కర్త దావీదేనని స్పష్టంగా ఉండటంతో సహజమైన తెలుగుకోసం అతని పేరును పేర్కొన్నాం.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: అతడు క్షేమంగా వెళ్లిపోయాడు
  rationale: ‘శాంతితో వెళ్లాడు’ అనే హీబ్రూ నుడికారం అతడు హాని లేకుండా, సత్సంబంధాలతో వెళ్లిపోయాడనే భావాన్ని ఇస్తుంది; ‘క్షేమంగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
