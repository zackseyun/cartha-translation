  to: 'ప్రజలందరూ ఇంకా పగలు ఉండగానే దావీదు రొట్టె తినేలా ప్రోత్సహించడానికి వచ్చారు. దావీదు ప్రమాణం చేసి ఇలా అన్నాడు: “దేవుడు నాకు అలా చేయుగాక, అంతకంటే ఎక్కువ చేయుగాక![b] సూర్యుడు అస్తమించకముందు నేను రొట్టెనుగానీ మరేదైనానుగానీ రుచి చూస్తే అలా జరగుగాక.”'
