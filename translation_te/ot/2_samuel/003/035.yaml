base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: te
  text: 'ప్రజలందరూ ఇంకా పగలు ఉండగానే దావీదు రొట్టె తినేలా ప్రోత్సహించడానికి వచ్చారు. దావీదు ప్రమాణం చేసి ఇలా అన్నాడు: “దేవుడు నాకు అలా చేయుగాక, అంతకంటే ఎక్కువ చేయుగాక![b] సూర్యుడు అస్తమించకముందు నేను రొట్టెనుగానీ మరేదైనానుగానీ రుచి చూస్తే అలా జరగుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ఇది స్వయంగా తన మీదికి శాపాన్ని ఆహ్వానించుకునే సంప్రదాయ ప్రమాణ సూత్రం. దేవుడు చేయబోయే నిర్దిష్ట శిక్ష ఏమిటో హీబ్రూ వాక్యం చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: దావీదుతో రొట్టె తినిపించాలని
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం దుఃఖంలో ఉన్న దావీదుకు ఆహారం ఇచ్చి తినేలా చేయాలనే ప్రజల ప్రయత్నాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘తినిపించాలని’ ఆ కార్యసాధక భావాన్ని నిలుపుతుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: לֶחֶם సాధారణంగా ‘ఆహారం’ అనే విస్తృతార్థం కలిగినా, ఇక్కడ మూలంలోని నిర్దిష్ట పదాన్ని నిలుపుతూ ‘రొట్టె’గా అనువదించబడింది.
- source_word: בְּעוֹד הַיּוֹם
  choice: ఇంకా పగలు ఉండగానే
  rationale: రోజు ఇంకా ముగియలేదనే కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి సూర్యాస్తమయ ప్రస్తావనకు అనుసంధానమవుతుంది.
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేస్తూ
  rationale: గంభీరమైన ప్రమాణ క్రియను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: దేవుడు నాకు అలా చేసి, అంతకంటే ఎక్కువే చేయుగాక
  rationale: హీబ్రూ సంప్రదాయ స్వీయశాప ప్రమాణ సూత్రాన్ని, పేర్కొనని శిక్షను ప్రత్యేకంగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: כִּי אִם
  choice: … రుచి చూస్తే
  rationale: ప్రమాణ సందర్భంలో స్వీయశాపానికి షరతును పరిచయం చేస్తుంది; తెలుగులో ‘చూస్తే’ నిర్మాణం సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించకముందే
  rationale: అక్షరార్థంలోని ‘సూర్యుడు రావడం’ అనే హీబ్రూ నుడికారానికి సందర్భానుగుణమైన అర్థం సూర్యాస్తమయం; తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֶטְעַם
  choice: రుచి చూస్తే
  rationale: טעם యొక్క ‘రుచి చూడడం’ అనే నిర్దిష్ట భావాన్ని నిలుపుతుంది; కొద్దిమాత్రమైనా తీసుకోననే ప్రమాణ తీవ్రతను తెలియజేస్తుంది.
- source_word: אוֹ כָל מְאוּמָה
  choice: మరేదైనా గానీ
  rationale: రొట్టెను మించి ఏ వస్తువునైనా పూర్తిగా నిరాకరించే విస్తృతిని తెలుగు జంట నిర్మాణం ‘గానీ … గానీ’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రమాణంలోని స్వీయశాపం
  choice: దేవుడు నాకు అలా చేసి, అంతకంటే ఎక్కువే చేయుగాక
  alternative: దేవుడు నన్ను తీవ్రంగా శిక్షించుగాక
  rationale: మూల హీబ్రూలో నిర్దిష్ట శిక్ష చెప్పబడలేదు. అందువల్ల దానిని వివరించి చెప్పకుండా, ప్రమాణ సూత్రంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రొట్టె’, ‘రుచి చూస్తే’ వంటి మూలంలోని స్పష్ట పదాలను నిలుపుతూ, హీబ్రూ ప్రమాణ సూత్రంలోని అస్పష్టతను వివరించి పరిష్కరించకుండా కాపాడాం.
