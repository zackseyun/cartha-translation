  text: וַ/יִּשְׁלַח֩ אַבְנֵ֨ר מַלְאָכִ֧ים אֶל דָּוִ֛ד תחת/ו לֵ/אמֹ֖ר לְ/מִי אָ֑רֶץ לֵ/אמֹ֗ר כָּרְתָ֤/ה בְרִֽיתְ/ךָ֙ אִתִּ֔/י וְ/הִנֵּה֙ יָדִ֣/י עִמָּ֔/ךְ לְ/הָסֵ֥ב אֵלֶ֖י/ךָ אֶת כָּל יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: te
  text: అబ్నేరు తన తరఫున[a] దావీదు దగ్గరికి దూతలను పంపి, “దేశం ఎవరిది?” అని చెప్పించాడు. “నాతో ఒప్పందం కుదుర్చుకో; ఇదిగో, ఇశ్రాయేలు అంతటినీ నీ వైపుకు తిప్పడానికి నా చేయి నీతో ఉంది[b]” అని కూడా చెప్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన స్థానంలో.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; ఇక్కడ అబ్నేరు తన ప్రతినిధులుగా దూతలను పంపించాడనే భావం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ: “నా చేయి నీతో ఉంది.” ఇది అబ్నేరు మద్దతు లేదా శక్తి దావీదు పక్షాన ఉంటుందని తెలిపే నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: తన తరఫున
  rationale: ఈ సందర్భంలో అబ్నేరు తన ప్రతినిధులుగా దూతలను పంపించాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అతని స్థానంలో’ అనే అక్షరార్థపు అస్పష్టతను నివారిస్తుంది.
- source_word: לְמִי אָרֶץ
  choice: దేశం ఎవరికి చెందుతుంది?
  rationale: భూమి లేదా రాజ్యంపై హక్కు ఎవరిదనే సంక్షిప్త రాజకీయ ప్రశ్నను, దాని సూచనను అతిగా విశదీకరించకుండా నిలుపుతుంది.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: నాతో నిబంధన చేసుకో
  rationale: כרת ברית అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: ఇదిగో ... నా చేయి నీకు తోడుగా ఉంటుంది
  rationale: ‘చేయి’ అనే మూలరూపకాన్ని కాపాడుతూ, అబ్నేరు మద్దతు మరియు ప్రభావం దావీదు పక్షాన ఉంటాయనే రాజకీయ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: నీ వైపుకు తిప్పడానికి
  rationale: ఇశ్రాయేలు విధేయతను దావీదు వైపుకు మళ్లించే కార్యసాధక భావాన్ని సమీపంగా నిలుపుతుంది.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటినీ
  rationale: మొత్తం జాతీయ సమూహాన్ని సూచించే సహజమైన సంక్షిప్త తెలుగు రూపం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఇక్కడ దేవదూతలు కాక మానవ సందేశవాహకులు లేదా ప్రతినిధులు ఉద్దేశించబడ్డారు; ‘దూతలు’ సందర్భానుసారంగా సహజం.
theological_decisions:
- issue: לְמִי אָרֶץ అనే అబ్నేరు ప్రశ్న యొక్క భావం
  choice: ‘దేశం ఎవరికి చెందుతుంది?’ అనే ప్రత్యక్ష ప్రశ్నగా నిలుపడం
  alternative: ‘దేశం నా చేతిలో ఉంది’ లేదా ‘దేశాన్ని ఎవరు పాలించాలి?’ అని వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది. ప్రత్యక్ష ప్రశ్న అబ్నేరు ఉద్దేశంలోని రాజకీయ ఉద్రిక్తతను నిలుపుతుంది; అతడు తన అధికారాన్ని ప్రకటిస్తున్నాడా లేక దావీదు హక్కును సూచిస్తున్నాడా అన్నది అనవసరంగా నిర్ణయించదు.
- issue: ‘నా చేయి నీతో ఉంది’ అనే రూపకం
  choice: చేయి రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో మద్దతు/శక్తి భావాన్ని వివరించడం
  alternative: ‘నేను నీకు మద్దతిస్తాను’ అని రూపకాన్ని పూర్తిగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని రాజకీయ శక్తి మరియు మద్దతు రెండింటినీ సూచించే రూపక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూ ప్రశ్నలోని సందిగ్ధతను నిలిపి, ‘చేయి’ అనే మూలరూపకాన్ని పాదసూచిక సహాయంతో సంరక్షించాం.
