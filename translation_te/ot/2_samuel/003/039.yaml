source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: te
  text: నేను ఈ రోజు ఇంకా బలహీనుడిని, రాజుగా అభిషేకించబడినప్పటికీ[a]. సెరూయా కుమారులైన ఈ మనుషులు నాకు చాలా కఠినంగా ఉన్నారు. చెడు చేసేవానికి యాహ్వే అతని చెడును బట్టి ప్రతిఫలం చెల్లించుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఈ రోజు ఇంకా మృదువుగా ఉన్నాను.” హీబ్రూ విశేషణానికి “మృదువైన/సున్నితమైన” అనే అర్థాలు కూడా ఉన్నాయి; ఈ సందర్భంలో అది బలహీనతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చెడు చేసేవానికి యాహ్వే అతని చెడును బట్టి ప్రతిఫలం చెల్లిస్తాడు.” హీబ్రూ క్రియను సాధారణ భవిష్యత్ వాక్యంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: బలహీనుడినే
  rationale: ఈ సందర్భంలో దావీదు తన రాజకీయ అశక్తతను, సెరూయా కుమారులను అదుపు చేయలేని స్థితిని తెలుపుతున్నాడు. మూలపదంలోని ‘మృదువు/లేత’ భావాన్ని [a]లో నిలిపి, ప్రధాన వాక్యంలో సహజమైన సందర్భార్థాన్ని ఇచ్చాం.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: రాజుగా అభిషేకించబడినప్పటికీ
  rationale: మూలంలో సంధానం మాత్రమే ఉన్నప్పటికీ, దావీదు బలహీనతకూ రాజుగా అభిషేకించబడిన హోదాకూ మధ్యనున్న వ్యత్యాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי צְרוּיָה
  choice: సెరూయా కుమారులు
  rationale: యోవాబు మరియు అతని సహోదరులను సూచించే హీబ్రూ కుటుంబ నిర్దేశాన్ని నేరుగా నిలుపుతుంది.
- source_word: קָשִׁים מִמֶּנִּי
  choice: నాకు మించిన కఠినులు
  rationale: קָשִׁים వారి కఠినత్వం లేదా నిర్దాక్షిణ్యాన్ని సూచించగలదు; מִמֶּנִּי తులనాత్మక భావాన్ని కలిగి ఉంది. ఈ రూపం వారి స్వభావాన్నీ, వారిని అదుపు చేయడంలో దావీదు అశక్తతనూ సూచిస్తుంది.
- source_word: יְשַׁלֵּם
  choice: ప్రతిఫలం చెల్లించుగాక
  rationale: ఈ సందర్భంలో దైవన్యాయాన్ని కోరే ఆశీర్వచనాత్మక/అభిలాషాత్మక బలాన్ని ప్రధాన పాఠ్యంలో చూపిస్తుంది; సాధారణ భవిష్యత్ భావాన్ని [b]లో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠనంలో విస్తృతంగా గుర్తించబడే రూపంలో దైవనామాన్ని పేరుగానే నిలుపుతుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: చెడు చేసినవాడికి
  rationale: దుష్కార్యం చేసే వ్యక్తిని సూచించే క్రియావిశేషణ రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּרָעָתוֹ
  choice: అతని చెడును బట్టి
  rationale: అతడు చేసిన చెడుకు తగిన ప్రతిఫలం అనే అనుపాత న్యాయభావాన్ని, మూలంలోని సంక్షిప్తతను అతిగా విప్పకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలిపాం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదు.
- issue: దావీదు చివరి మాటలో יְשַׁלֵּם బలం
  choice: 'కోరిక/న్యాయవిన్నపం: ‘ప్రతిఫలం చెల్లించుగాక’'
  alternative: 'సాధారణ భవిష్యత్: ‘ప్రతిఫలం చెల్లిస్తాడు’'
  rationale: సందర్భంలో దావీదు ప్రతీకారాన్ని దేవుని న్యాయానికి అప్పగిస్తున్నట్టు కోరికరూపం సహజంగా ఉంది. అయితే హీబ్రూ అసంపూర్ణ క్రియకు భవిష్యత్ పఠనం కూడా సాధ్యమైనందున దానిని [b]లో నిలిపాం.
- issue: దావీదు బలహీనత మరియు రాజాభిషేకం మధ్య సంబంధం
  choice: 'వ్యత్యాసార్థకం: ‘అభిషేకించబడినప్పటికీ’'
  alternative: 'సరళ సంధానం: ‘అభిషేకించబడిన రాజును’'
  rationale: మూలంలోని పక్కపక్కన ఉంచిన రెండు స్థితులు సందర్భంలో స్పష్టమైన వ్యత్యాసాన్ని కలిగిస్తాయి. ఈ అనుసంధానం దావీదు రాజాధికారాన్ని లేదా అతని అశక్తతను అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘బలహీనుడినే’లోని ‘నే’ దావీదు రాజుగా అభిషేకించబడిన స్థితికీ అతని ప్రస్తుత అశక్తతకీ మధ్య వ్యత్యాసాన్ని బలపరుస్తుంది. ‘నాకు మించిన కఠినులు’ మూలంలోని తులనాత్మక నిర్మాణాన్ని నిలుపుతూ, అసహజమైన పదప్రయోగాన్ని నివారిస్తుంది.
