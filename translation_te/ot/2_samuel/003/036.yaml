source:
  edition: WLC
  text: וְ/כָל הָ/עָ֣ם הִכִּ֔ירוּ וַ/יִּיטַ֖ב בְּ/עֵֽינֵי/הֶ֑ם כְּ/כֹל֙ אֲשֶׁ֣ר עָשָׂ֣ה הַ/מֶּ֔לֶךְ בְּ/עֵינֵ֥י כָל הָ/עָ֖ם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: te
  text: ప్రజలందరూ దానిని గుర్తించారు[a]; రాజు చేసిన ప్రతిదీ ప్రజలందరి దృష్టిలో మంచిగా ఉన్నట్లే, అదీ వారికి మంచిగా అనిపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరూ దానిని గ్రహించారు.” ఇక్కడి హెబ్రీ క్రియకు ‘గుర్తించారు,’ ‘గ్రహించారు,’ లేదా ‘తెలుసుకున్నారు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוּ
  choice: గ్రహించారు
  rationale: హిఫిల్ రూపంలోని נכר ఇక్కడ గుర్తించడం, గ్రహించడం, అవగతం చేసుకోవడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో అబ్నేరు మరణం విషయంలో రాజు వైఖరిని ప్రజలు గ్రహించారని సూచిస్తుంది; హెబ్రీలో స్పష్టమైన కర్మ లేకపోవడంతో తెలుగులో ‘దానిని’ సందర్భసూచకంగా ఉంచబడింది.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: అది వారికి మంచిగా అనిపించింది
  rationale: ‘వారి కళ్లలో మంచిగా ఉంది’ అనే హెబ్రీ నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం ఇది. ప్రజల ఆమోదం లేదా సంతోషం అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: రాజు చేసినదంతా
  rationale: כְּכֹל నిర్మాణం ఇక్కడ రాజు చేసిన సమస్త కార్యాలను సమగ్రంగా సూచిస్తుంది. సందర్భంలో వాక్యం ప్రజల సాధారణ ఆమోదాన్ని వివరిస్తున్నందున తెలుగులో సహజంగా సంక్షిప్తీకరించబడింది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలపాఠం వ్యక్తిపేరుకు బదులుగా బిరుదునే ఉపయోగిస్తుంది; అందువల్ల ‘దావీదు రాజు’ అని విస్తరించకుండా ‘రాజు’ అని ఉంచబడింది.
- source_word: בְּעֵינֵי כָל הָעָם טוֹב
  choice: ప్రజలందరి దృష్టిలో మంచిగానే ఉండేది
  rationale: మూలంలోని ‘కళ్లలో మంచిది’ అనే మూల్యాంకన నుడికారాన్ని తెలుగులో సహజమైన ‘దృష్టిలో’ ద్వారా నిలిపి, טוֹב మరియు וַיִּיטַב మధ్యనున్న ‘మంచి’ పదపునరుక్తిని కూడా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హెబ్రీ మూలంలోని ‘మంచి’ పదపునరుక్తి నిలుపబడింది; అయితే ‘వారి కళ్లలో’ అనే నుడికారం మొదటి చోట సహజ తెలుగులో ‘వారికి ... అనిపించింది’గా, రెండవ చోట ‘దృష్టిలో’గా వ్యక్తీకరించబడింది.
