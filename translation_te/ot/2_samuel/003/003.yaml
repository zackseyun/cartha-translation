  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: te
  text: రెండవవాడు కిలెయాబు; అతడు కర్మెలీయుడైన నాబాలు భార్య అబీగయీలు కనిన కుమారుడు. మూడవవాడు అబ్షాలోము; అతడు గెషూరు రాజైన తల్మయి కుమార్తె మయకా కనిన కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: రెండవవాడు
  rationale: పుత్రుల వరుసలో రెండవ వ్యక్తిని సూచించే హెబ్రీయ పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తీకరిస్తుంది.
- source_word: כִלְאָב
  choice: కిలెయాబు
  rationale: హెబ్రీయ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: לַאֲבִיגַל אֵשֶׁת נָבָל הַכַּרְמְלִי
  choice: కర్మెలీయుడైన నాబాలు భార్య అబీగయీలు కనిన కుమారుడు
  rationale: లְ సంబంధాన్ని సందర్భానుసారంగా మాతృత్వంగా స్పష్టం చేస్తూ, మూలంలోని అబీగయీలు–నాబాలు సంబంధాన్ని నిలుపుతుంది.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హెబ్రీయ నామంలోని వ్యంజన నిర్మాణాన్ని సాధ్యమైనంత సమీపంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: גְּשׁוּר
  choice: గెషూరు
  rationale: స్థలనామానికి మూలభాషకు సమీపమైన తెలుగు రూపం.
