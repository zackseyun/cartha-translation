source:
  edition: WLC
  text: יָדַ֨עְתָּ֙ אֶת אַבְנֵ֣ר בֶּן נֵ֔ר כִּ֥י לְ/פַתֹּתְ/ךָ֖ בָּ֑א וְ/לָ/דַ֜עַת אֶת מוֹצָֽאֲ/ךָ֙ וְ/אֶת מבוא/ך וְ/לָ/דַ֕עַת אֵ֛ת כָּל אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: te
  text: నేరు కుమారుడైన అబ్నేరు నీకు తెలుసు కదా! అతడు నిన్ను మోసగించడానికి[a], నీ రాకపోకలను[b] తెలుసుకోవడానికి, నీవు చేస్తున్నదంతా తెలుసుకోవడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిన్ను ప్రలోభపెట్టడానికి’ / ‘నిన్ను తన మాటకు ఒప్పించడానికి.’ హీబ్రూ క్రియ మభ్యపెట్టడం, ప్రలోభపెట్టడం లేదా ఒప్పించడం అనే భావాలను ఇవ్వగలదు; ఇక్కడి శత్రుత్వపూర్వక సందర్భంలో ‘మోసగించడానికి’ అనేది తగినది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ బయటికి వెళ్లడాన్ని, నీ లోపలికి రావడాన్ని’; ఇది ఒకరి కదలికలు లేదా కార్యకలాపాలన్నిటినీ సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: నీకు తెలుసు కదా
  rationale: Qal perfect ఇక్కడ ప్రస్తుత జ్ఞానస్థితిని సూచిస్తూ, యోవాబు దావీదును నిలదీసే ఆరోపణాత్మక స్వరాన్ని వ్యక్తం చేస్తుంది.
- source_word: אַבְנֵר בֶּן נֵר
  choice: నేరు కుమారుడైన అబ్నేరు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: כִּי
  choice: ప్రత్యేక పదంగా అనువదించకుండా తదుపరి వాక్యాన్ని తెలిసిన విషయంగా అనుసంధానించడం
  rationale: ఇది దావీదుకు తెలిసినదని యోవాబు వాదిస్తున్న విషయాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో విరామం తరువాత వచ్చే ప్రకటన సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: לְפַתֹּתְךָ
  choice: నిన్ను మోసగించడానికి
  rationale: פתה మభ్యపెట్టడం, ప్రలోభపెట్టడం లేదా ఒప్పించడం అనే అర్థాలను కలిగి ఉండవచ్చు; రాజకీయ-సైనిక అనుమాన సందర్భంలో శత్రుత్వపూర్వక ఉద్దేశాన్ని ‘మోసగించడానికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּא
  choice: వచ్చాడు
  rationale: కథన సందర్భానికి సరిపోయే సాధారణ భూతకాల రూపం.
- source_word: לָדַעַת
  choice: తెలుసుకోవడానికి
  rationale: ఇక్కడ సమాచారం సంపాదించే ఉద్దేశాన్ని సూచిస్తుంది; పునరుక్తి మూలపాఠంలో రెండుసార్లు ఉండటం వల్ల తెలుగులోనూ నిలిపింది.
- source_word: מוֹצָאֲךָ וְאֶת מְבוֹאֶךָ
  choice: నీ రాకపోకలను
  rationale: అక్షరార్థంలోని ‘నీ బయటికి వెళ్లడం, నీ లోపలికి రావడం’ అనే జంటను సహజమైన తెలుగు నానుడి ‘రాకపోకలు’గా అందించి, మొత్తం కదలికలు లేదా కార్యకలాపాల భావాన్ని నిలిపింది.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: నీవు చేస్తున్నదంతా
  rationale: עֹשֶׂה అనే participle కొనసాగుతున్న ప్రస్తుత కార్యాన్ని సూచిస్తుంది; ‘చేస్తున్నదంతా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
