translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘తెలుసు కదా!’ యోవాబు నిలదీసే స్వరాన్ని అందిస్తుంది. మూలంలోని రాక-పోక జంట భావాన్ని ‘రాకపోకలు’గా సహజీకరించి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం; ఉద్దేశాన్ని తెలిపే రెండు సమాంతర పదబంధాలను నిలిపాం.
