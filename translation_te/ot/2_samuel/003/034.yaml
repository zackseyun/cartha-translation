  text: יָדֶ֣/ךָ לֹֽא אֲסֻר֗וֹת וְ/רַגְלֶ֨י/ךָ֙ לֹא לִ/נְחֻשְׁתַּ֣יִם הֻגָּ֔שׁוּ כִּ/נְפ֛וֹל לִ/פְנֵ֥י בְנֵֽי עַוְלָ֖ה נָפָ֑לְתָּ וַ/יֹּסִ֥פוּ כָל הָ/עָ֖ם לִ/בְכּ֥וֹת עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: te
  text: 'నీ చేతులు కట్టబడలేదు;

    నీ కాళ్లు కంచు సంకెళ్లలో వేయబడలేదు.

    అన్యాయం చేసేవారి ముందు ఒకడు కూలినట్లు,

    నీవు కూలిపోయావు.[a]

    ప్రజలందరూ అతని గురించి ఇంకా ఎక్కువగా ఏడ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుర్మార్గుల ముందు ఒకడు కూలినట్లు, నీవు కూలిపోయావు.” హీబ్రూ అక్షరార్థంగా “అన్యాయపు కుమారుల ముందు” అని ఉంది.
    reason: హీబ్రూ నుడికారంలోని అక్షరార్థ రూపాన్నీ, సహజమైన తెలుగు ప్రత్యామ్నాయాన్నీ నమోదు చేయడానికి.
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: నీ చేతులు కట్టబడలేదు
  rationale: אָסַר యొక్క నిష్క్రియ రూపం ‘కట్టబడి ఉండడం’ను సూచిస్తుంది. ఖైదీలా బంధించబడలేదనే వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: నీ కాళ్లు కంచు సంకెళ్లలో వేయబడలేదు
  rationale: נְחֻשְׁתַּיִם కంచు లేదా రాగితో చేసిన జంట కాలి బంధాలను సూచిస్తుంది; ‘కంచు సంకెళ్లు’ పదార్థాన్నీ, బంధన స్వభావాన్నీ నిలుపుతుంది. הֻגָּשׁוּను ఈ సందర్భంలో ‘వేయబడలేదు’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: כִּנְפוֹל
  choice: ఒకడు కూలినట్లు
  rationale: כְּ ఉపసర్గతో కూడిన infinitive construct పోలికను తెలియజేస్తుంది. తెలుగులో పోలిక సహజంగా ఉండేందుకు ‘ఒకడు’ను చేర్చాం.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: అన్యాయం చేసేవారి ముందు
  rationale: బెనే అవ్లా అక్షరార్థంగా ‘అన్యాయపు కుమారులు’ అయినా, ఇది అన్యాయం చేసే దుష్టులను సూచించే హీబ్రూ నుడికారం. అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేసే రూపాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం.
- source_word: נָפָלְתָּ
  choice: నీవు కూలిపోయావు
  rationale: పూర్తయిన విషాదకర పరిణామాన్ని విలాప స్వరంలో తెలియజేస్తుంది. ‘కూలిపోయావు’ మరణాన్ని సూచించే భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: అప్పుడు ప్రజలందరూ అతని కోసం ఇంకా ఎక్కువగా ఏడ్చారు
  rationale: יָסַף + infinitive చర్య కొనసాగడాన్నో పెరగడాన్నో సూచించగలదు. దావీదు విలాపం తరువాతి సందర్భంలో ఏడుపు మరింత పెరిగిందనే భావాన్ని ఎంచుకున్నాం; ‘అప్పుడు’ కథన సంబంధాన్ని సహజంగా చూపుతుంది.
