translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాపానికి తగిన గంభీరతతో రూపొందించబడింది. కవితా పంక్తుల నిర్మాణం నిలుపబడింది; ప్రాచీన నుడికారాన్ని ప్రధాన పాఠ్యంలో అర్థస్పష్టంగా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
