source:
  edition: WLC
  text: וַ/יִּחַר֩ לְ/אַבְנֵ֨ר מְאֹ֜ד עַל דִּבְרֵ֣י אִֽישׁ בֹּ֗שֶׁת וַ/יֹּ֨אמֶר֙ הֲ/רֹ֨אשׁ כֶּ֥לֶב אָנֹ֘כִי֮ אֲשֶׁ֣ר לִֽ/יהוּדָה֒ הַ/יּ֨וֹם אֶֽעֱשֶׂה חֶ֜סֶד עִם בֵּ֣ית שָׁא֣וּל אָבִ֗י/ךָ אֶל אֶחָי/ו֙ וְ/אֶל מֵ֣רֵעֵ֔/הוּ וְ/לֹ֥א הִמְצִיתִ֖/ךָ בְּ/יַד דָּוִ֑ד וַ/תִּפְקֹ֥ד עָלַ֛/י עֲוֺ֥ן הָ/אִשָּׁ֖ה הַ/יּֽוֹם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: te
  text: 'అప్పుడు ఇష్బోషెతు మాటలను బట్టి అబ్నేరు ఎంతో కోపపడి ఇలా అన్నాడు: “నేను యూదాకు చెందిన కుక్క తలనా?[a] ఈ రోజు వరకు నేను నీ తండ్రి సౌలు ఇంటివారిపట్ల, అతని సోదరులపట్ల, అతని స్నేహితులపట్ల నమ్మకంగా వ్యవహరించాను; నిన్ను దావీదు చేతికి అప్పగించలేదు. అయినా ఈ రోజు ఈ స్త్రీ విషయంలో నాపై దోషం మోపుతున్నావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘యూదాకు చెందిన కుక్క తల.’ ఇది అర్థం కష్టమైన అవమాన నుడికారం. బహుశా ‘యూదా పక్షాన ఉన్న నీచమైన కుక్క’ వంటి భావం ఉండవచ్చు; అయితే అనువాదం రూపకాన్ని మరింత అక్షరార్థంగా నిలిపింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: అబ్నేరు ఎంతో కోపపడి
  rationale: חרה అనే ‘కోపం రగులుకోవడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, מְאֹד తెలిపే తీవ్రతను ‘ఎంతో’తో నిలిపింది.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: ఇష్బోషెతు మాటలను బట్టి
  rationale: עַל ఇక్కడ అబ్నేరు కోపానికి కారణాన్ని సూచిస్తుంది; דִּבְרֵי యొక్క ‘మాటలు’ అనే ప్రత్యక్ష భావాన్ని నిలిపింది.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: నేను యూదాకు చెందిన కుక్క తలనా?
  rationale: అర్థం కష్టమైన అవమాన నుడికారాన్ని వ్యాఖ్యానాత్మకంగా సులభీకరించకుండా, ‘కుక్క తల’ అనే రూపకాన్నీ యూదాతో సంబంధంలోని అస్పష్టతనూ నిలిపింది.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: ఈ రోజు వరకు ... నమ్మకంగా వ్యవహరించాను
  rationale: అబ్నేరు ఇప్పటివరకు చేసిన సేవను సమర్థించుకుంటున్న సందర్భంలో הַיּוֹם కు కాలవ్యాప్తి భావం ఉంది. חֶסֶד ఇక్కడ కేవలం దయకన్నా స్థిరమైన విధేయతను సూచిస్తుంది; సహజ తెలుగులో ‘నమ్మకంగా వ్యవహరించాను’ దానిని తెలియజేస్తుంది.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: నీ తండ్రి సౌలు ఇంటివారిపట్ల
  rationale: ‘సౌలు ఇల్లు’ అనే వంశ-కుటుంబ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపింది.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: అతని సోదరులపట్ల, అతని స్నేహితులపట్ల
  rationale: אֶחָיו మరియు מֵרֵעֵהוּ పదాల ప్రాథమిక అర్థాలైన సోదరులు/బంధువులు, స్నేహితులు/సహచరులు అనే భావాలను సాధారణ తెలుగులో అందించింది.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: నిన్ను దావీదు చేతికి అప్పగించలేదు
  rationale: ‘ఒకరి చేతిలో పెట్టడం’ అనే అధికారానికి లేదా ఆధీనానికి అప్పగించే హీబ్రూ నుడికారాన్ని తెలుగులో సమానమైన నుడికారంతో నిలిపింది.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: ఈ స్త్రీ విషయంలో నాపై దోషం మోపుతున్నావు
  rationale: פקד על + עָוֺן లోని జవాబుదారీ చేయడం లేదా అపరాధారోపణ భావాన్ని ‘దోషం మోపడం’ సహజంగా వ్యక్తం చేస్తుంది; స్త్రీని రిస్పా అని మూలంలో లేని విధంగా పేరుపెట్టి స్పష్టీకరించలేదు.
