  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడింది. కఠినమైన అవమాన రూపకాన్ని సులభీకరించకుండా పాదసూచికతో వివరించింది; חֶסֶד ను సందర్భానుగుణమైన నమ్మకమైన విధేయతగా సహజంగా వ్యక్తం చేసింది.
