  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤א יוֹאָב֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָה הִנֵּה בָ֤א אַבְנֵר֙ אֵלֶ֔י/ךָ לָ/מָּה זֶּ֥ה שִׁלַּחְתּ֖/וֹ וַ/יֵּ֥לֶךְ הָלֽוֹךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: te
  text: అప్పుడు యోవాబు రాజు దగ్గరకు వచ్చి, “నీవు చేసిన పని ఏమిటి? ఇదిగో, అబ్నేరు నీ దగ్గరకు వచ్చాడు. నీవు అతన్ని ఎందుకిలా పంపించేశావు? అతడు వెళ్లిపోయాడే![a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అతడు వెళ్లాడు—వెళ్తూ.” ఇది అతడు నిజంగానే లేదా పూర్తిగా వెళ్లిపోయాడని నొక్కిచెప్పే నిర్మాణం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చి
  rationale: ఈ వయ్యిక్టోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל הַמֶּלֶךְ
  choice: రాజు దగ్గరకు
  rationale: దిశను సూచించే ఈ పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מֶה עָשִׂיתָה
  choice: నీవు చేసిన పని ఏమిటి?
  rationale: పూర్తయిన చర్యను గురించి గద్దిస్తూ అడిగిన ప్రశ్న. తెలుగు వాడుకలో ఈ రూపం ఆశ్చర్యం, అభ్యంతరం రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఒక ముఖ్యమైన విషయంపై నిలిపే హీబ్రూ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: అబ్నేరు నీ దగ్గరకు వచ్చాడు
  rationale: యోవాబు అభ్యంతరానికి ఆధారమైన జరిగిన విషయాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: לָמָּה זֶּה
  choice: ఎందుకిలా
  rationale: సాధారణ ‘ఎందుకు’ కంటే ఎక్కువగా ఉన్న సూచనాత్మక, నిందాపూర్వక బలాన్ని సంక్షిప్తంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁלַּחְתּוֹ
  choice: అతన్ని ... పంపించేశావు
  rationale: పియేల్ రూపం ఇక్కడ పంపివేయడం లేదా వెళ్లనివ్వడం అనే భావం ఇస్తుంది. ‘పంపించేశావు’ దావీదు చేసిన చర్యను, యోవాబు అసమ్మతిని రెండింటినీ చూపుతుంది.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: అతడు వెళ్లిపోయాడే!
  rationale: క్రియతో కూడిన సంపూర్ణ క్రియావిశేష రూపం ప్రయాణం నిజంగా జరిగిపోయిందనే ఉద్ఘాటనను ఇస్తుంది. ‘వెళ్లిపోయాడే’ అనే తెలుగు రూపం ఆ పూర్తి చర్యను, యోవాబు ఆవేదనతో కూడిన బలాన్ని సహజంగా అందిస్తుంది; నిర్మాణ విశేషాన్ని పాదసూచిక వివరిస్తుంది.
