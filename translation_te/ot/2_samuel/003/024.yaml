translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సజీవమైన కథనశైలి వాడబడింది. యోవాబు మాటల్లోని ఆకస్మికత, నిందాపూర్వక స్వరం నిలుపబడ్డాయి; పురాతనంగా వినిపించే పదజాలం నివారించబడింది.
