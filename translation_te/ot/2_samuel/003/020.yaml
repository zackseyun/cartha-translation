translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. వ్యక్తుల పేర్లకు తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా విభక్తి రూపాలు ఇచ్చాం. ఈ వచనంలో వివరణ అవసరమైన గంభీరమైన పాఠాంతరం లేదా ధార్మిక సందిగ్ధత లేదు; అందువల్ల పాదటిప్పణి చేర్చలేదు.
