reference: 2 Samuel 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: te
  text: అబ్నేరు ఇరవై మంది మనుషులతో కలిసి హెబ్రోనులో ఉన్న దావీదు దగ్గరికి వచ్చాడు. దావీదు అబ్నేరు కోసం, అతనితో ఉన్న మనుషుల కోసం ఒక విందు ఏర్పాటు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే క్రియ సందర్భానుసారం ‘వచ్చు/వెళ్లు/చేరుకొను’ అని అర్థమవుతుంది. గమ్యస్థానమైన దావీదు కథన దృష్టిలో ఉన్నందున ‘వచ్చాడు’ సహజంగా ఉంది.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: హెబ్రోనులో ఉన్న దావీదు దగ్గరికి
  rationale: ‘హెబ్రోను’ ముందు ప్రత్యేక విభక్తి లేకపోయినా, సందర్భంలో అది దావీదు ఉన్న ప్రదేశాన్ని సూచిస్తుంది. ఈ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: ఇరవై మంది మనుషులతో కలిసి
  rationale: హీబ్రూ పదబంధం అబ్నేరుతో ఇరవై మంది పురుషులు ఉన్నారని చెబుతుంది. ‘మనుషులు’ మూలంలోని אֲנָשִׁיםను ప్రత్యక్షంగా ప్రతిబింబిస్తుంది; ‘కలిసి’ సహచర్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: ఒక విందు ఏర్పాటు చేశాడు
  rationale: עשה + משתה అనే ప్రయోగానికి అక్షరార్థంగా ‘విందు చేశాడు’ అనవచ్చును, కానీ ‘విందు ఏర్పాటు చేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, విందును సిద్ధం చేసి నిర్వహించిన భావాన్ని మితంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: מִשְׁתֶּה విందు లేదా భోజనసభను సూచిస్తుంది; పానీయం ఉండే సూచన పదవ్యుత్పత్తిలో ఉన్నా, ఈ సందర్భంలో దానిని ‘మద్యపాన విందు’గా ప్రత్యేకించడం మూలం చెప్పినదానికంటే ఎక్కువ అవుతుంది.
- source_word: לְאַבְנֵר וְלַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: అబ్నేరు కోసం, అతనితో ఉన్న మనుషుల కోసం
  rationale: పునరావృతమైన לְ నిర్మాణాన్ని రెండు చోట్లా ‘కోసం’ అని చూపించి, అబ్నేరు మరియు అతని సహచరులు విందు పొందినవారని స్పష్టంగా ఉంచింది.
