- from: 'అతడు ఇలా అన్నాడు: “మంచిది. నేను నీతో నిబంధన చేస్తాను. అయితే నేను నీ నుండి ఒక్క విషయం అడుగుతున్నాను: నీవు నన్ను చూడడానికి వచ్చినప్పుడు సౌలు కుమార్తె మీకాలును ముందుగా తీసుకొస్తే తప్ప నా ముఖం చూడవు.”[a]'
  to: 'అతడు ఇలా అన్నాడు: “మంచిది. నేను నీతో నిబంధన చేస్తాను. కానీ నీ నుండి నేను ఒక్క విషయం అడుగుతున్నాను: నీవు నా ముఖాన్ని చూడడానికి వచ్చినప్పుడు సౌలు కుమార్తె మీకాలును ముందుగా తీసుకొస్తే తప్ప నా ముఖాన్ని చూడవు.”[a]'
  rationale: మూల హీబ్రూలో రెండుసార్లు వచ్చే ‘నా ముఖం’ అనే పదబంధాన్ని ప్రధాన పాఠ్యంలో రెండుసార్లూ నిలిపాం. తెలుగు సహజత్వం కోసం ‘ముఖం’కు కర్మవిభక్తి జోడించాం; אַךְ యొక్క షరతు-మలుపును ‘కానీ’తో స్పష్టపరిచాం. పాదటిప్పణిలో హీబ్రూ అక్షరార్థ ఉటంకింపును వ్యాకరణపరంగా సరిచేశాం.
