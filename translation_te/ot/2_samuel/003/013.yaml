source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ט֔וֹב אֲנִ֕י אֶכְרֹ֥ת אִתְּ/ךָ֖ בְּרִ֑ית אַ֣ךְ דָּבָ֣ר אֶחָ֡ד אָנֹכִי֩ שֹׁאֵ֨ל מֵ/אִתְּ/ךָ֤ לֵ/אמֹר֙ לֹא תִרְאֶ֣ה אֶת פָּנַ֔/י כִּ֣י אִם לִ/פְנֵ֣י הֱבִיאֲ/ךָ֗ אֵ֚ת מִיכַ֣ל בַּת שָׁא֔וּל בְּ/בֹאֲ/ךָ֖ לִ/רְא֥וֹת אֶת פָּנָֽ/י־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “మంచిది. నేను నీతో నిబంధన చేస్తాను. కానీ నీ నుండి నేను ఒక్క విషయం అడుగుతున్నాను: నీవు నా ముఖాన్ని చూడడానికి వచ్చినప్పుడు సౌలు కుమార్తె మీకాలును ముందుగా తీసుకొస్తే తప్ప నా ముఖాన్ని చూడవు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నా సమక్షంలో కనిపించడానికి వచ్చినప్పుడు సౌలు కుమార్తె మీకాలును ముందుగా తీసుకొస్తే తప్ప నా సమక్షంలో కనిపించవు.” హీబ్రూలో అక్షరార్థంగా “నా ముఖాన్ని చూస్తావు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: మంచిది
  rationale: అబ్నేరు ప్రతిపాదనకు సంక్షిప్త సమ్మతిని తెలిపే హీబ్రూ పదాన్ని సహజమైన, సంక్షిప్త తెలుగు రూపంలో నిలుపుతుంది.
- source_word: אֶכְרֹת ... בְּרִית
  choice: నేను నీతో నిబంధన చేస్తాను
  rationale: అక్షరార్థంగా ‘నిబంధన కోయడం’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; అధికారిక నిబంధన భావాన్ని కాపాడుతుంది.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: అయితే నేను నీ నుండి ఒక్క విషయం అడుగుతున్నాను
  rationale: אַךְ యొక్క పరిమితి/మినహాయింపు భావాన్ని ‘అయితే’ ద్వారా, ఒక్క షరతును వర్తమాన అభ్యర్థనగా తెలిపే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: నా ముఖం చూడవు
  rationale: ‘నా ముఖాన్ని చూడడం’ అనే హీబ్రూ వ్యక్తీకరణను నిలిపి, దావీదు సమక్షంలో ప్రవేశించే రాజసభ సంబంధిత ఛాయను సంరక్షిస్తుంది.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: ముందుగా తీసుకొస్తే తప్ప
  rationale: మీకాలును తీసుకురావడం ముందస్తు షరతు అనే కాలసంబంధ మరియు మినహాయింపు భావాలను స్పష్టంగా అందిస్తుంది.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: సౌలు కుమార్తె మీకాలు
  rationale: హీబ్రూ గుర్తింపు పదబంధాన్ని తెలుగు సహజ పదక్రమంలో అందిస్తుంది.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: నీవు నన్ను చూడడానికి వచ్చినప్పుడు
  rationale: తెలుగులో సహజ ప్రవాహం కోసం మొదటి ప్రస్తావనలో ‘నన్ను చూడడానికి’ అని భావానువాదం చేస్తూ, తరువాతి ‘నా ముఖం చూడవు’లో మూల నుడికారాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నిబంధన’ అనే అధికారిక బైబిలు పదం నిలుపబడింది; హీబ్రూ ‘నా ముఖం చూడడం’ నుడికారంలోని ప్రత్యక్ష దర్శనం/రాజసమక్ష ప్రవేశం అనే ద్వంద్వసంభావ్యతను పాదటిప్పణిలో సంరక్షించాం.
