  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: te
  text: సౌలు కుమారుడైన యోనాతాను కుమారుడు మెఫీబోషెతు దావీదు దగ్గరకు వచ్చి, ముఖం నేలమీద పడేలా పడిపోయి నమస్కరించాడు. దావీదు, “మెఫీబోషెతూ!” అన్నాడు. అతడు, “ఇదిగో, మీ సేవకుణ్ణి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו וַיִּשְׁתָּחוּ
  choice: సాష్టాంగపడి నమస్కరించాడు
  rationale: ముఖం నేలకు ఆనేటట్లు పడడం, గౌరవంతో వంగి నమస్కరించడం అనే రెండు అనుసంధానిత చర్యలను సహజమైన ఆధునిక తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: ఇదిగో, మీ సేవకుణ్ణి
  rationale: ‘హిన్నే’లోని సమర్పణాత్మక ప్రత్యుత్తర భావాన్ని ‘ఇదిగో’ నిలుపుతుంది; ‘మీ సేవకుణ్ణి’ అనేది రాజుతో మాట్లాడే వినయపూర్వక స్వీయసూచన.
- source_word: אֶל־דָּוִד
  choice: దావీదు దగ్గరకు
  rationale: వ్యక్తి వద్దకు రావడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
