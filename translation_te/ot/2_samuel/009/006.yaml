  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. వంశక్రమం మూలంలోని క్రమానుసారంగా నిలుపబడింది; సంభాషణలో రాజుకు తగిన గౌరవబహువచనం వాడబడింది.
