source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֗לֶךְ הַ/אֶ֨פֶס ע֥וֹד אִישׁ֙ לְ/בֵ֣ית שָׁא֔וּל וְ/אֶעֱשֶׂ֥ה עִמּ֖/וֹ חֶ֣סֶד אֱלֹהִ֑ים וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ ע֛וֹד בֵּ֥ן לִ/יהוֹנָתָ֖ן נְכֵ֥ה רַגְלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: te
  text: అప్పుడు రాజు, “నేను అతనికి దేవుని దయను[a] చూపడానికి సౌలు కుటుంబంలో ఇంకా ఎవరైనా మిగిలి ఉన్నారా?” అని అడిగాడు. సీబా రాజుతో, “యోనాతానుకు ఇంకా ఒక కుమారుడు ఉన్నాడు; అతడు కాళ్లలో వైకల్యం ఉన్నవాడు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని విశ్వసనీయ ప్రేమ,” “దేవుని ఒడంబడిక నిబద్ధత.” హెబ్రీ పదబంధం దేవునికి చెందిన, దేవుని స్వభావాన్ని ప్రతిబింబించే, లేదా నిబద్ధతతో కూడిన దయను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతడు కుంటివాడు,” అక్షరార్థంగా “కాళ్లలో దెబ్బతిన్నవాడు/వైకల్యం ఉన్నవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: ఇంకా ఎవరైనా మిగిలి ఉన్నారా?
  rationale: ఈ ప్రశ్న సౌలు వంశంలో జీవించి ఉన్నవారు ఎవరైనా మిగిలారా అని విచారిస్తుంది. ప్రతికూల రూపాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగులో సహజంగా ప్రశ్నార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְבֵית שָׁאוּל
  choice: సౌలు ఇంటివారిలో
  rationale: ‘ఇల్లు’ ఇక్కడ భవనం కాదు, సౌలు కుటుంబం లేదా వంశాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆ కుటుంబ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: నేను అతనికి చూపాలి
  rationale: חֶסֶדతో కలిసినప్పుడు ‘చూపు’ తెలుగులో సహజ ప్రయోగం. హెబ్రీయ క్రియారూపంలోని సంకల్ప భావాన్ని ‘చూపాలి’ నిలుపుతుంది.
- source_word: חֶסֶד אֱלֹהִים
  choice: దేవుని విశ్వసనీయ ప్రేమ
  rationale: חֶסֶדలో దయ, ప్రేమ, నిబద్ధత అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ‘విశ్వసనీయ ప్రేమ’ ఆ సంబంధ నిబద్ధతను తెలియజేస్తూ, אֱלֹהִים అనే సంబంధాన్ని ‘దేవుని’గా తెరిచి ఉంచుతుంది.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: యోనాతానుకు ఒక కుమారుడు ఇంకా ఉన్నాడు
  rationale: యోనాతాను కుమారుల్లో ఒకడు జీవించి ఉన్నాడనే మిగిలి ఉండటం యొక్క భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נְכֵה רַגְלָיִם
  choice: అతని రెండు కాళ్లూ అవిటివి
  rationale: ద్వివచనమైన רַגְלָיִם రెండు కాళ్లను సూచిస్తుంది; נְכֵה చలనాన్ని ప్రభావితం చేసే శారీరక వైకల్యాన్ని సూచిస్తుంది. ‘అవిటివి’ సంక్షిప్తంగా మూలార్థాన్ని ఇస్తుంది; మరింత వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
theological_decisions:
- issue: חֶסֶד אֱלֹהִים యొక్క సంబంధం, పరిధి
  choice: దేవుని విశ్వసనీయ ప్రేమ
  alternative: దేవుని దయ; దేవునికి తగిన ప్రేమ; దేవుని ఒడంబడిక నిబద్ధత
  rationale: ఈ పదబంధం దేవునికి చెందిన ప్రేమను, దేవుని లక్షణాన్ని ప్రతిబింబించే ప్రేమను, లేదా దేవుని సాక్షిగా చేసిన నిబద్ధతతో కూడిన దయను సూచించవచ్చు. ప్రధాన పాఠం ‘దేవుని’ అనే సంబంధాన్ని అలాగే ఉంచి, חֶסֶדలోని విశ్వసనీయతను తెలియజేస్తుంది; ఒకే సిద్ధాంతపరమైన వివరణకు దానిని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. ‘సౌలు ఇంటివారు’ కుటుంబం/వంశం అనే అర్థాన్ని సహజంగా ఇస్తుంది. వైకల్యాన్ని తెలిపే భాష మూలపాఠానికి దగ్గరగా ఉండేలా ఉంచి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
