source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: te
  text: 'దావీదు అతనితో ఇలా అన్నాడు: “భయపడకు. నీ తండ్రి యోనాతాను నిమిత్తం నేను తప్పక నీకు విశ్వసనీయమైన దయ[a] చూపిస్తాను. నీ తండ్రి[b] సౌలుకు చెందిన భూమినంతటినీ నీకు తిరిగి అప్పగిస్తాను. నీవు ఎల్లప్పుడూ నా బల్ల దగ్గర భోజనం చేస్తావు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్వసనీయమైన దయ”కు మూల హీబ్రూ పదం హెసెద్; దీనిని “స్థిరమైన ప్రేమ,” “నమ్మకమైన ప్రేమ,” లేదా “నిబంధన నిబద్ధత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “నీ తండ్రి సౌలు” అని ఉంది. “తండ్రి” అనే పదం పూర్వీకుడిని కూడా సూచించగలదు; సౌలు మెఫీబోషెతుకు తాత.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “నా బల్ల దగ్గర ఎల్లప్పుడూ రొట్టె తింటావు”; ఇది నిరంతర పోషణను, రాజుతో బల్ల సహవాసాన్ని సూచించే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధార్థక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: నేను తప్పక ... చూపిస్తాను
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే బలమైన నిశ్చయాన్ని ‘తప్పక’ సహజంగా తెలియజేస్తుంది.
- source_word: חֶסֶד
  choice: విశ్వసనీయమైన దయ
  rationale: ఈ సందర్భంలోని కార్యరూప దయతోపాటు యోనాతానుతో ఉన్న బంధానికి నమ్మకంగా ఉండే భావాన్ని కూడా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: నీ తండ్రి యోనాతాను నిమిత్తం
  rationale: దయకు కారణమైన సంబంధపూర్వక ఉద్దేశాన్ని మూలానికి దగ్గరగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: నీకు తిరిగి అప్పగిస్తాను
  rationale: హిఫిల్ రూపంలోని ఆస్తిని తిరిగి చేర్చే లేదా పునరుద్ధరించే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: సౌలుకు చెందిన భూమినంతటినీ
  rationale: שָׂדֶה ఏకవచనమైనా ఇక్కడ పొలం లేదా ఆస్తి సముదాయాన్ని సూచించగలదు; ‘భూమి’ ఆ విస్తృత భావాన్ని అందిస్తుంది.
- source_word: שָׁאוּל אָבִיךָ
  choice: నీ తండ్రి సౌలు
  rationale: మూలంలోని బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇక్కడ అది పూర్వీకుడిని, ప్రత్యేకంగా తాతను, సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: నీవు ఎల్లప్పుడూ నా బల్ల దగ్గర భోజనం చేస్తావు
  rationale: ‘రొట్టె తినడం’ అనే హీబ్రూ నుడికారాన్ని దాని నిరంతర పోషణ, రాజబల్ల సహవాస భావాలతో సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: חֶסֶד లోని నిబంధనాత్మక విశ్వసనీయత భావం
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వసనీయమైన దయ’
  alternative: ‘దయ’, ‘స్థిరమైన ప్రేమ’, లేదా ‘నిబంధన నిబద్ధత’
  rationale: దావీదు యోనాతానుతో ఉన్న సంబంధానికి నమ్మకంగా మెఫీబోషెతుకు కార్యరూపంగా మేలు చేస్తున్న సందర్భం ఇది. ‘విశ్వసనీయమైన దయ’ సామాన్య పాఠకునికి అర్థమయ్యేలా దయ, నిబద్ధత అనే రెండు పార్శ్వాలనూ ఉంచుతుంది.
- issue: אָבִיךָ అనే బంధుత్వ పదం సౌలుకు వర్తించడం
  choice: మూలంలోని ‘నీ తండ్రి’ని ప్రధాన పాఠ్యంలో నిలిపి, పాదటిప్పణిలో తాత అని వివరించడం
  alternative: ప్రధాన పాఠ్యంలో ‘నీ తాత సౌలు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ אָב విస్తృతంగా పూర్వీకుడిని సూచించగల నిజమైన భాషా వినియోగాన్ని కాపాడుతూ, వంశ సంబంధంపై పాఠకునికి కలిగే సందేహాన్ని పాదటిప్పణి తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకునికి సులభమైన కథన శైలి. మూలంలోని బలమైన నిశ్చయం, బంధుత్వ భాష, రాజబల్ల సహవాసం నిలుపబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
