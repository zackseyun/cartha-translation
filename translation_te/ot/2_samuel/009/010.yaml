    rationale: The note concerning the Hebrew term for ‘bread/food’ needs an anchor at ‘ఆహారంగా’; separate anchors make both lexical alternatives traceable and avoid an unanchored note claim.
  - severity: low
    issue: ‘నా బల్ల దగ్గర’ is somewhat conversational for the verse’s narrative register.
    rationale: ‘నా బల్ల వద్ద’ is the more direct modern-standard Telugu equivalent of ‘at my table’ while retaining the royal-table image.
