  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: te
  text: నువ్వు, నీ కుమారులు, నీ దాసులు[a] అతని కోసం ఆ భూమిని సాగుచేసి దాని పంటను తీసుకురావాలి. అది నీ యజమాని కుమారునికి ఆహారంగా[b] ఉంటుంది, అతడు దాన్ని తింటాడు. అయితే నీ యజమాని కుమారుడైన మెఫీబోషెతు ఎల్లప్పుడూ నా బల్ల వద్ద భోజనం చేస్తాడు. సీబాకు పదిహేను మంది కుమారులు, ఇరవై మంది దాసులు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసులు’ అని అనువదించిన హీబ్రూ పదం యజమాని ఆధీనంలో ఉన్న గృహ దాసులను లేదా సేవకులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆహారం’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థం ‘రొట్టె’; సందర్భానుసారం అది సాధారణ ఆహారం లేదా సరఫరాను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: అతని కోసం ఆ భూమిని సాగుచేసి
  rationale: עבד అనే క్రియ אֲדָמָה అనే కర్మతో ఇక్కడ వ్యవసాయార్థాన్ని ఇస్తుంది. ‘సాగుచేయడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, పని మెఫీబోషెతు ప్రయోజనార్థమని కూడా నిలుపుతుంది.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ / עֲבָדִים
  choice: నువ్వు, నీ కుమారులు, నీ దాసులు / దాసులు
  rationale: עבד ఇక్కడ సీబా ఇంటి ఆధీన శ్రామికులను సూచిస్తుంది. ‘దాసులు’ వారి బంధిత సామాజిక స్థితిని ‘సేవకులు’ కంటే స్పష్టంగా ప్రతిబింబిస్తుంది; అయితే దాని పరిధి గురించి పాదసూచికలో వివరణ ఇచ్చాం.
- source_word: וְהֵבֵאתָ
  choice: దాని పంటను తీసుకురావాలి
  rationale: క్రియకు కర్మ పాఠ్యంలో వ్యక్తంగా లేకపోయినా వ్యవసాయ సందర్భం భూమి దిగుబడిని సూచిస్తుంది. తెలుగులో అర్థస్పష్టత కోసం ‘దాని పంటను’ చేర్చాం.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: అది నీ యజమాని కుమారునికి ఆహారంగా ఉంటుంది; అతడు దాన్ని తింటాడు
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినప్పటికీ ఇక్కడ విస్తృతంగా ఆహారం లేదా జీవనోపాధి సరఫరాను సూచించగలదు. వ్యవసాయ పంట సందర్భంలో ‘ఆహారం’ సహజం; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: అయితే ... మెఫీబోషెతు ఎల్లప్పుడూ నా బల్ల దగ్గర భోజనం చేస్తాడు
  rationale: ప్రారంభ ו ఇక్కడ ముందటి పొలపు సరఫరాతో రాజబల్లపై ప్రత్యక్ష పోషణను వ్యత్యాసపరుస్తుంది. ‘బల్ల దగ్గర భోజనం చేయడం’ తెలుగు వాడుకలో రాజసంబంధ పోషణ, సహవాసం అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: సీబాకు పదిహేను మంది కుమారులు, ఇరవై మంది దాసులు ఉన్నారు
  rationale: ఇది క్రియలేని నేపథ్య వాక్యం. తెలుగులో సహజ వాక్య నిర్మాణం కోసం ‘ఉన్నారు’ చేర్చాం.
