  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. దావీదు సీబాతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ రూపాన్ని నిలిపాం. హీబ్రూ పదపునరుక్తిని యాంత్రికంగా అనుసరించకుండా, పంట ద్వారా లభించే ఆహారం మరియు రాజబల్ల దగ్గర భోజనం అనే సందర్భభేదాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
