  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: te
  text: మెఫీబోషెతుకు ఒక చిన్న కుమారుడు ఉన్నాడు; అతని పేరు మీకా. సీబా ఇంట్లో నివసించే వారందరూ[a] మెఫీబోషెతుకు సేవకులుగా[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీబా ఇంటివారందరూ.”
    reason: lexical_alternative
  - marker: b
    text: “సేవకులు” అని అనువదించిన హెబ్రీయ పదానికి సందర్భాన్ని బట్టి “దాసులు” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְפִיבֹשֶׁת
  choice: మెఫీబోషెతుకు … ఉండేవాడు
  rationale: లְ ద్వారా వ్యక్తమయ్యే హెబ్రీయ ఉనికి–స్వామ్య ప్రయోగాన్ని తెలుగులో సహజంగా ‘మెఫీబోషెతుకు … ఉండేవాడు’ అని అందించింది.
- source_word: בֵּן קָטָן
  choice: ఒక చిన్న కుమారుడు
  rationale: קָטָן ఇక్కడ కుమారుని చిన్న వయసును సూచిస్తుంది. ‘చిన్న కుమారుడు’ మూలార్థానికి దగ్గరగా ఉండి సాధారణ తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: וּשְׁמוֹ מִיכָא
  choice: అతని పేరు మీకా
  rationale: పేరును పరిచయం చేసే హెబ్రీయ వాక్య నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపింది; מִיכָא ను ‘మీకా’గా లిప్యంతరీకరించింది.
- source_word: וְכֹל מוֹשַׁב בֵּית צִיבָא
  choice: సీబా ఇంట్లో నివసించే వారందరూ
  rationale: מוֹשַׁב యొక్క నివాస భావాన్ని ప్రత్యక్షంగా వ్యక్తం చేస్తుంది. సందర్భంలో సాధ్యమైన సమష్టి అర్థమైన ‘సీబా ఇంటివారందరూ’ను పాదటిప్పణిలో ఉంచింది.
- source_word: עֲבָדִים
  choice: సేవకులుగా
  rationale: ఈ సందర్భం ఇంటివారి సేవాసంబంధాన్ని ప్రధానంగా చెబుతోంది కాబట్టి ‘సేవకులు’ సహజమైన ఎంపిక. ఈ హెబ్రీయ పదానికి ‘దాసులు’ అనే అర్థం కూడా ఉండగలదని పాదటిప్పణి ద్వారా నిజమైన పదార్థ విస్తృతిని నిలిపింది.
- source_word: לִמְפִיבֹשֶׁת
  choice: మెఫీబోషెతుకు
  rationale: లְ ఇక్కడ సేవ ఎవరికి చేయబడుతుందో సూచిస్తుంది. ‘మెఫీబోషెతుకు’ యాజమాన్యాన్ని అనవసరంగా బలపరచకుండా ఆ సంబంధాన్ని తెలుపుతుంది.
