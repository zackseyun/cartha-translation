  yaml_path: translation/ot/2_samuel/009/005.yaml
  text: So King David sent and took him from the house of Machir son of Ammiel[a], from Lo-debar.
translation:
  language: te
  text: అప్పుడు దావీదు రాజు పంపి, లో-దెబారులోని అమ్మీయేలు కుమారుడైన మాకీరు ఇంటి నుండి అతణ్ణి తీసుకువచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “పంపి, అతణ్ణి తీసుకున్నాడు.” సందర్భానుసారంగా, “అతని కోసం పంపి, అతణ్ణి తీసుకువచ్చాడు” అని కూడా అనువదించవచ్చు. “ఇంటి” అనే పదానికి “ఇంటివారి” లేదా “కుటుంబపు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపి
  rationale: שׁלח అంటే ప్రాథమికంగా ‘పంపాడు.’ ఎవరిని పంపాడో హీబ్రూలో స్పష్టంగా లేకపోయినా, తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘మనుషులను’ సందర్భానుసారంగా చేర్చాం.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: హీబ్రూ బిరుదు-పేరు కలయికను సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
- source_word: וַיִּקָּחֵהוּ
  choice: అతణ్ణి తీసుకురప్పించాడు
  rationale: לקח ప్రాథమికంగా ‘తీసుకున్నాడు’; ఇక్కడ రాజు పంపినవారు అతణ్ణి రాజు వద్దకు తీసుకొచ్చారనే సందర్భార్థాన్ని సహజమైన తెలుగులో ‘తీసుకురప్పించాడు’ తెలియజేస్తుంది.
- source_word: מִבֵּית
  choice: ఇంటి నుండి
  rationale: בַּיִת ఇల్లు లేదా కుటుంబం/ఇంటివారిని సూచించగలదు. ఇక్కడ నివాసస్థల భావం సహజంగా సరిపోతుంది; అసలు పదంలోని స్వల్ప విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: అమ్మీయేలు కుమారుడు మాకీరు
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా తండ్రి-కొడుకు సంబంధాన్ని ముందుంచి, పేర్లను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִלּוֹ דְבָר
  choice: లో-దెబారులోని
  rationale: ఇది సందర్భంలో స్థలనామం. హీబ్రూలో ఉన్న מן సంబంధాన్ని తెలుగులో సహజమైన ‘లో-దెబారులోని ... ఇంటి నుండి’ నిర్మాణంతో వ్యక్తం చేశాం.
