id: 2SA.9.1
reference: 2 Samuel 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “యోనాతాను నిమిత్తం నేను అతనికి దయ[a] చూపడానికి, సౌలు ఇంటివారిలో ఇంకా ఎవరైనా మిగిలి ఉన్నారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మకమైన ప్రేమ” లేదా “ఒడంబడిక నిబద్ధత.” హీబ్రూ పదం కేవలం భావోద్వేగపూరితమైన దయనే కాక, సంబంధానికి నమ్మకంగా చూపే దయను కూడా తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר సాధారణ కథన క్రియగా ‘అన్నాడు’ అనే అర్థం ఇస్తుంది. తరువాత ప్రశ్న ఉన్నప్పటికీ, మాటల పరిచయానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: ఇంకా ఎవరైనా ... ఉన్నారా?
  rationale: ప్రశ్నార్థక నిర్మాణం మరియు కొనసాగుతున్న ఉనికిని సూచించే יֶשׁ עוֹד భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נוֹתַר
  choice: మిగిలి
  rationale: נותר జీవించి లేదా కుటుంబంలో శేషంగా మిగిలిన వ్యక్తిని సూచిస్తుంది; ‘మిగిలి’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְבֵית שָׁאוּל
  choice: సౌలు ఇంటివారిలో
  rationale: בית ఇక్కడ భవనాన్ని కాక కుటుంబం లేదా వంశాన్ని సూచిస్తుంది; ‘ఇంటివారు’ సాధారణ పాఠకులకు సహజంగా కుటుంబ-వంశ భావాన్ని అందిస్తుంది.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: నేను అతనికి నమ్మకమైన దయ చూపాలి
  rationale: עשה עם חסד అనే ప్రయోగం ‘దయ చూపడం’ అని అర్థం. సందర్భంలోని సంబంధ నిబద్ధతను ‘నమ్మకమైన’ సూచిస్తుంది; సంకల్పభావాన్ని తెలుగులో ‘చూపాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: యోనాతాను నిమిత్తం
  rationale: בעבור కారణం లేదా ఒకరి నిమిత్తం చేసే కార్యాన్ని సూచిస్తుంది; ఈ రూపం దావీదు చర్య యోనాతానుతో అతని సంబంధం వల్లనని తెలియజేస్తుంది.
theological_decisions:
- issue: חֶסֶד పదంలోని దయ మరియు నిబద్ధత భావాల సమన్వయం
  choice: ప్రధాన పాఠ్యంలో ‘నమ్మకమైన దయ’
  alternative: ‘దయ’; ‘విశ్వసనీయ ప్రేమ’; ‘ఒడంబడిక నిబద్ధత’
  rationale: ఇక్కడ సాధారణ కనికరం కంటే యోనాతానుతో ఉన్న సంబంధానికి నమ్మకంగా చేసే మేలు భావం ఉంది. ‘నమ్మకమైన దయ’ ఆ లోతును తెలియజేస్తూ, ‘ఒడంబడిక’ అనే పదాన్ని మూలంలో ప్రత్యక్షంగా లేని చోట ప్రధాన పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సౌలు ఇంటివారు’ అనే రూపం కుటుంబం/వంశం అనే భావాన్ని స్పష్టంగా అందిస్తుంది. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
