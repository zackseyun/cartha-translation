base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: te
  text: సౌలు ఇంటికి చెందిన సీబా అనే సేవకుడు ఉండేవాడు. వారు అతణ్ణి దావీదు దగ్గరకు పిలిచారు. రాజు అతనితో, “నువ్వేనా సీబా?” అని అడిగాడు. అతడు, “మీ సేవకుణ్ణి”[a] అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “నేను మీ సేవకుణ్ణి.” హీబ్రూలో సమాధానం సంక్షిప్తంగా, అక్షరార్థంగా “నీ సేవకుడు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: సౌలు ఇంటివారికి ... ఉండేవాడు
  rationale: లְ ఉపసర్గతో వచ్చిన ఈ నిర్మాణం ఉనికి లేదా స్వాధీనాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఇంటివారికి ... ఉండేవాడు’ అని చెప్పడం ద్వారా సౌలు గృహానికి చెందిన సేవకుడనే భావం నిలుస్తుంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: עֶבֶד అనే పదానికి ‘బానిస’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో సౌలు గృహానికి చెందిన పరిచారకుని సూచిస్తున్నందున ‘సేవకుడు’ సహజమైనది; అతని అధీనస్థితినీ వ్యక్తం చేస్తుంది.
- source_word: וּ/שְׁמ/וֹ צִיבָא
  choice: సీబా అనే
  rationale: ‘అతని పేరు సీబా’ అనే హీబ్రూ గుర్తింపు నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ‘సీబా అనే’ అని అందించాం.
- source_word: וַ/יִּקְרְאוּ ל/וֹ אֶל דָּוִד
  choice: వారు అతణ్ణి దావీదు దగ్గరికి పిలిపించారు
  rationale: קרא క్రియ ఇక్కడ ఒకరిని దావీదు సమక్షానికి రప్పించడాన్ని సూచిస్తుంది. కర్త బహువచనంగా ఉన్నందున అనిర్దిష్టమైన ‘వారు’ను నిలిపాం; ‘పిలిపించారు’ రాజసమక్షానికి రప్పించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַ/מֶּלֶךְ
  choice: రాజు
  rationale: కథనంలో ఇది దావీదును సూచించే నిర్దిష్ట బిరుదు; తెలుగులో ‘రాజు’ సరళమైన సమానార్థకం.
- source_word: הַ/אַתָּה צִיבָא
  choice: నువ్వేనా సీబా?
  rationale: ప్రశ్నార్థక ה మరియు సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నువ్వేనా’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עַבְדֶּךָ
  choice: మీ సేవకుణ్ణి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ సేవకుడు’ అనే సంక్షిప్త, వినయపూర్వక సమాధానం ఉంది. రాజును సంబోధించే గౌరవాన్ని తెలుగులో ‘మీ’తో చూపిస్తూ, మూలంలోని సంక్షిప్తతను నిలిపాం.
