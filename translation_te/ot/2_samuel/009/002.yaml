  to: సౌలు ఇంటికి చెందిన సీబా అనే సేవకుడు ఉండేవాడు. వారు అతణ్ణి దావీదు దగ్గరకు పిలిచారు. రాజు అతనితో, “నువ్వేనా సీబా?” అని అడిగాడు. అతడు, “మీ సేవకుణ్ణి”[a] అని జవాబిచ్చాడు.
