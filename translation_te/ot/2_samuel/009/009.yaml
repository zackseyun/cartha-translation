source:
  edition: WLC
  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: te
  text: 'అప్పుడు రాజు సౌలు సేవకుడైన సీబాను[a] పిలిపించి, అతనితో ఇలా అన్నాడు: “సౌలుకు, అతని ఇంటివారందరికీ ఉన్నదంతా[b] నీ యజమాని కుమారునికి[c] ఇచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సౌలు యువకుడు’ లేదా ‘సౌలు పరిచారకుడు’ అని కూడా అనువదించవచ్చు; ఇక్కడ ఇది బహుశా గృహసేవకుడు లేదా అనుచరుడిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “సౌలుకు, అతని ఇంటివారందరికీ ఉన్నదంతా.” ఇక్కడ ‘ఇల్లు’ అనే భావం సౌలు కుటుంబాన్ని, గృహస్థులను లేదా గృహాస్తిని సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: “నీ యజమాని కుమారుడు” అనేది మెఫీబోషెతును సూచిస్తుంది. అతడు సౌలు వంశస్థుడు మరియు సీబాకు సామాజికంగా ఉన్నతుడు.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: సేవకుడు
  rationale: ఈ పదానికి ‘యువకుడు’ లేదా ‘పరిచారకుడు’ అనే అర్థాలు ఉండవచ్చు; అయితే ఇక్కడ సౌలు రాజగృహంతో సీబాకు ఉన్న సేవాసంబంధ హోదాను ‘సేవకుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: సౌలుకు ... చెందినదంతా
  rationale: ‘సౌలుకు ఉన్నదంతా’ అనే హీబ్రూ స్వామ్యప్రయోగాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּלְכָל בֵּיתוֹ
  choice: అతని ఇంటివారందరికీ
  rationale: בַּיִת అనే పదం ఇక్కడ ఇల్లు అనే కట్టడాన్ని మాత్రమే కాక కుటుంబం, గృహస్థులు లేదా గృహాస్తిని సూచించవచ్చు. ‘ఇంటివారు’ కుటుంబ/గృహ పరిధిని సహజంగా తెలియజేస్తుంది; ఆస్తి భావం సందర్భంలో ‘చెందినదంతా’లో ఇమిడివుంది.
- source_word: נָתַתִּי
  choice: ఇచ్చాను
  rationale: పూర్తయిన బదలాయింపును, ఇప్పుడు అమల్లో ఉన్న ఫలితాన్ని తెలుగు భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: నీ యజమాని కుమారునికి
  rationale: אֲדוֹן ఇక్కడ దైవ బిరుదు కాక సామాజిక అధికారి లేదా యజమానిని సూచిస్తుంది. ‘నీ యజమాని కుమారుడు’ మూలంలోని సంబంధాన్ని అలాగే ఉంచుతుంది.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: అప్పుడు ... పిలిపించి ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది. రాజు తన సమక్షానికి పిలిచిన భావాన్ని ‘పిలిపించి’ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీ యజమాని కుమారుడు’ ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో సంబంధపదాన్ని యథాతథంగా ఉంచి, మెఫీబోషెతును సూచిస్తుందని పాదసూచికలో తెలిపింది.
  alternative: ప్రధాన పాఠంలో నేరుగా ‘మెఫీబోషెతుకు’ అని పెట్టడం.
  rationale: మూలంలోని సామాజిక సంబంధ భాషను కాపాడుతూ, కథన సందర్భానికి అవసరమైన స్పష్టతను పాదసూచిక అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ స్వామ్యప్రయోగం మరియు ‘ఇల్లు’ అనే పదంలోని కుటుంబం/గృహాస్తి విస్తృతార్థాన్ని పాదసూచికతో నిలిపింది.
