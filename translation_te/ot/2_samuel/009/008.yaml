source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֕חוּ וַ/יֹּ֖אמֶר מֶ֣ה עַבְדֶּ֑/ךָ כִּ֣י פָנִ֔יתָ אֶל הַ/כֶּ֥לֶב הַ/מֵּ֖ת אֲשֶׁ֥ר כָּמֽוֹ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/008.yaml
  text: And he bowed down and said[a], “What is your servant[b], that you have turned toward a dead dog like me?”
translation:
  language: te
  text: అతడు వంగి నమస్కరించి, “నా వంటి చనిపోయిన కుక్కవైపు[b] మీరు దృష్టి మళ్లించారంటే[a], మీ సేవకుడైన నేను ఎంతటివాడిని?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నావైపు తిరిగారంటే” / “నన్ను గమనించారంటే.” హీబ్రూలో అక్షరార్థంగా “వైపు తిరిగారు” అని ఉంది; ఇక్కడ అది దయతో గమనించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “చనిపోయిన కుక్క” అనేది తనను తాను అత్యంత అల్పుడిగా, విలువలేనివాడిగా తగ్గించుకొని చెప్పుకునే నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించి
  rationale: שׁחה అనే క్రియ గౌరవం లేదా విధేయతతో శరీరాన్ని వంచడాన్ని సూచిస్తుంది. ఇది ఆ భౌతిక చర్యను నిలుపుతూ, దానిని ఆరాధనగా అతిగా నిర్ధారించదు.
- source_word: מֶה עַבְדֶּךָ
  choice: మీ సేవకుడైన నేను ఎంతటివాడిని?
  rationale: హీబ్రూ మాటకు అక్షరార్థం ‘మీ సేవకుడు ఏమిటి?’ ఇది తీవ్రమైన వినయాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నేను ఎంతటివాడిని?’ అని ఇచ్చి, రాజసభ సంబంధమైన స్వీయ సంబోధనను ‘మీ సేవకుడు’గా నిలిపాం.
- source_word: כִּי
  choice: …అంటే
  rationale: ఇక్కడ כִּי అలంకారిక ప్రశ్నకు దారితీసే విషయాన్ని లేదా సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘…అంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פָנִיתָ אֶל
  choice: నావైపు మీరు తిరిగి చూశారు
  rationale: פנה אל అక్షరార్థంగా ‘వైపు తిరుగు’ అని అర్థం; సందర్భంలో అది ఉన్నతస్థానంలో ఉన్న వ్యక్తి దయతో గమనించడాన్ని సూచిస్తుంది. ‘తిరిగి చూశారు’ మూలంలోని దృశ్యరూపాన్ని, అంతర్లీనమైన ఆదరణ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: הַכֶּלֶב הַמֵּת
  choice: చచ్చిన కుక్కలాంటి
  rationale: ఇది తనను తాను అత్యంత అల్పుడిగా, విలువలేనివాడిగా చూపించుకునే బలమైన నుడికారం. దాని కఠినతను మృదువుచేయకుండా తెలుగులో నేరుగా నిలిపాం.
- source_word: אֲשֶׁר כָּמוֹנִי
  choice: నాలాంటి / నావైపు
  rationale: ఈ సంబంధవాచక పదబంధం ‘చచ్చిన కుక్క’ను మాట్లాడుతున్న వ్యక్తితో పోలుస్తుంది. తెలుగులో ‘చచ్చిన కుక్కలాంటి నావైపు’ అనే నిర్మాణం ఆ పోలికను సహజంగా వ్యక్తం చేస్తుంది.
