translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యక్రమాన్ని బలవంతంగా అనుసరించకుండా అర్థాన్ని స్పష్టంగా ఉంచి, పేర్లను మూలభాషకు సమీపంగా లిప్యంతరీకరించాం.
