  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: te
  text: రాజు అతనితో, “అతడు ఎక్కడ ఉన్నాడు?” అని అడిగాడు. సీబా రాజుతో, “ఇదిగో, అతడు లో-దెబారులో అమ్మీయేలు కుమారుడైన మాకీరు ఇంట్లో ఉన్నాడు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సీబా ఇచ్చే ప్రత్యక్ష సమాధానంలోని సూచనాత్మక బలాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: בֵּית מָכִיר
  choice: మాకీరు ఇంట్లో
  rationale: హెబ్రీ భాషలోని ‘మాకీరు ఇంటిలో’ అనే స్థానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּלוֹ דְבָר
  choice: లో-దెబారులో
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించి, בְ ఉపసర్గలోని స్థానార్థాన్ని ‘లో’ విభక్తితో చూపుతుంది.
