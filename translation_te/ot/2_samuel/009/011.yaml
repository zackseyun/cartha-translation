source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: te
  text: సీబా రాజుతో, “నా ప్రభువైన రాజు తన సేవకునికి ఆజ్ఞాపించే ప్రతిదానినీ మీ సేవకుడు అలాగే చేస్తాడు” అన్నాడు. మెఫీబోషెతు రాజు కుమారులలో ఒకనిలా నా బల్ల దగ్గర భోజనం చేసేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘నా బల్ల దగ్గర’ అని ఉంది. ఇక్కడ దావీదు దృక్కోణం వినిపిస్తున్నదని భావించవచ్చు. కొన్ని ప్రాచీన సాక్ష్యాలు, అనువాదాలు భావాన్ని సులభతరం చేస్తూ ‘రాజు బల్ల దగ్గర’ అని ఇస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר צִיבָא אֶל־הַמֶּלֶךְ
  choice: సీబా రాజుతో ... అన్నాడు
  rationale: సాధారణ హీబ్రూ కథన పరిచయాన్ని సహజమైన తెలుగు ప్రత్యక్షోక్తి నిర్మాణంలో అందిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: ఆజ్ఞాపించినదంతా
  rationale: כְּכֹל אֲשֶׁר యొక్క సమగ్ర భావాన్నీ, צוה యొక్క ఆజ్ఞార్థాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలోని గౌరవపూర్వక సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: తన సేవకునికి / మీ సేవకుడు
  rationale: ఇక్కడ עבד బానిసత్వాన్ని ప్రధానంగా సూచించకుండా, రాజు ఎదుట వినయపూర్వక స్వీయసూచనగా పనిచేస్తోంది.
- source_word: כֵּן יַעֲשֶׂה
  choice: అలాగే చేస్తాడు
  rationale: ఆజ్ఞకు విధేయత చూపుతాననే ప్రతిజ్ఞాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֹכֵל
  choice: భోజనం చేస్తూ ఉండేవాడు
  rationale: క్రియావిశేషణ రూపంలోని కొనసాగుతున్న లేదా అలవాటైన ఏర్పాటును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שֻׁלְחָנִי
  choice: నా బల్ల దగ్గర
  rationale: మసోరా పాఠంలోని మొదటి పురుష ఏకవచన ప్రత్యయాన్ని మార్చకుండా ఉంచుతూ, భోజన సందర్భంలో עַל‌కు సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: రాజకుమారుల్లో ఒకనిలా
  rationale: రాజు కుమారుల్లో ఒకరితో సమానమైన భోజన సహవాసం, హోదా అనే పోలికను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని ‘నా బల్ల’ ఎవరిది?
  choice: మసోరా పాఠంలోని మొదటి పురుష రూపాన్ని ‘నా బల్ల’గా నిలుపుట
  alternative: వక్త మార్పును సులభతరం చేయడానికి ‘రాజు బల్ల’ అని అనువదించడం
  rationale: హీబ్రూ שֻׁלְחָנִי నేరుగా ‘నా బల్ల’ అని ఉంది. వక్త లేదా దృక్కోణ మార్పులోని నిజమైన పాఠ్య ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవపూర్వక రాజసభా భాషను నిలిపి, అతిగా పురాతనమైన పదప్రయోగాలను నివారించాం. పేర్లు సాధారణ తెలుగు బైబిల్ లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
