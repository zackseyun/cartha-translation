  to: మెఫీబోషెతు యెరూషలేములో నివసించాడు, ఎందుకంటే అతడు ఎల్లప్పుడూ రాజు బల్ల వద్ద భోజనం చేసేవాడు. అతడు రెండు పాదాల్లోనూ కుంటివాడు.
