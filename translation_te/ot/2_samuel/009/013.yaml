  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ కారణ సంబంధం, అలవాటైన భోజన చర్య, రెండు పాదాల గురించిన స్పష్టత నిలుపబడ్డాయి.
