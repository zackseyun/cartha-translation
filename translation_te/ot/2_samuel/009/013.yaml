  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מְפִיבֹ֗שֶׁת יֹשֵׁב֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֣י עַל שֻׁלְחַ֥ן הַ/מֶּ֛לֶךְ תָּמִ֖יד ה֣וּא אֹכֵ֑ל וְ/ה֥וּא פִסֵּ֖חַ שְׁתֵּ֥י רַגְלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: te
  text: మెఫీబోషెతు యెరూషలేములో నివసించాడు, ఎందుకంటే అతడు ఎల్లప్పుడూ రాజు బల్ల వద్ద భోజనం చేసేవాడు. అతడు రెండు పాదాల్లోనూ కుంటివాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: నివసించాడు
  rationale: పట్టణనామంతో వచ్చిన ישׁב కృదంతం ఇక్కడ కూర్చోవడాన్ని కాక నివాసాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘నివసించాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మెఫీబోషెతు యెరూషలేములో నివసించడానికి గల కారణాన్ని ఈ సంధాయకం పరిచయం చేస్తుంది; దాని కారణార్థాన్ని స్పష్టంగా ఉంచాం.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: రాజు బల్ల దగ్గర
  rationale: హీబ్రూ పదబంధంలోని ‘రాజు బల్ల’ రూపకాన్ని నిలుపుతూ, అక్కడ భోజనం చేయడాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘దగ్గర’ చేర్చాం.
- source_word: תָּמִיד ... אֹכֵל
  choice: ఎల్లప్పుడూ ... భోజనం చేసేవాడు
  rationale: కృదంతం సూచించే అలవాటైన, నిరంతర చర్యను తెలుగు అలవాటు భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: פִסֵּחַ
  choice: కుంటివి
  rationale: ఈ విశేషణం నడకలోని శారీరక వైకల్యాన్ని సూచిస్తుంది; ‘కుంటి’ ప్రత్యక్షమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: שְׁתֵּי רַגְלָיו
  choice: అతని రెండు పాదాలూ
  rationale: ‘అతని రెండు పాదాలు’ అనే మూలపాఠంలోని నిర్దిష్ట శరీరభాగాన్ని, రెండింటినీ నొక్కిచెప్పే ‘-ఆ’తో నిలిపాం.
- source_word: וְהוּא
  choice: అతని
  rationale: హీబ్రూలోని ముగింపు వర్ణనను తెలుగులో సహజమైన స్వతంత్ర వాక్యంగా మార్చి, అదే వ్యక్తిని సర్వనామ సంబంధంతో కొనసాగించాం.
