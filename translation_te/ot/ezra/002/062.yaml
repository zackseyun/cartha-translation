source:
  edition: WLC
  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑אוּ וַֽ/יְגֹאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: te
  text: వీరు వంశావళి ప్రకారం నమోదైనవారి జాబితాలో తమ నమోదును వెదికారు, కానీ వారు అందులో కనబడలేదు; కాబట్టి వారు యాజకత్వం నుండి తొలగించబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు యాజకత్వానికి అనర్హులుగా పరిగణించబడ్డారు,” లేదా “యాజకత్వం విషయంలో వారు అపవిత్రులుగా పరిగణించబడ్డారు.” వారి వంశావళిని ధృవీకరించలేకపోవడం వల్ల యాజక హోదాకు తగనివారిగా పరిగణించబడ్డారనే భావం హీబ్రూ క్రియలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందటి వచనాల్లో పేర్కొన్న యాజక వంశపు హక్కుదారులను సూచించే బహువచన సర్వనామంగా సహజంగా ఉంది.
- source_word: בִּקְשׁוּ
  choice: వెదికారు
  rationale: בקשׁ అనే క్రియలోని వెదకడం లేదా అన్వేషించడం అనే సాధారణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְתָבָם
  choice: తమ వ్రాతపూర్వక ఆధారాన్ని
  rationale: כְּתָב అంటే వ్రాత లేదా పత్రం. ఈ పరిపాలనా సందర్భంలో వారి వంశాన్ని రుజువు చేసే వ్రాతపూర్వక నమోదు అనే భావాన్ని, పత్రం యొక్క ఖచ్చిత రూపాన్ని అతిగా నిర్దేశించకుండా తెలియజేస్తుంది.
- source_word: הַמִּתְיַחְשִׂים
  choice: వంశావళి ప్రకారం నమోదైనవారి మధ్య
  rationale: יחס హిత్పయేల్ రూపం వంశ సంబంధాన్ని నిర్ధారించుకోవడం లేదా వంశావళి ప్రకారం నమోదు కావడం అనే భావాన్ని కలిగి ఉంది; కృదంత రూపాన్నీ పరిపాలనా నేపథ్యాన్నీ ఈ పదబంధం నిలుపుతుంది.
- source_word: וְלֹא נִמְצָאוּ
  choice: కాని వారు అందులో కనిపించలేదు
  rationale: హీబ్రూలో క్రియ బహువచనంలో ఉండి వ్యక్తులనే సూచిస్తుంది. ‘అందులో’ అనేది వంశావళి నమోదును స్పష్టం చేస్తూ మూలంలోని సంక్షిప్తతను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיְגֹאֲלוּ
  choice: తొలగించబడ్డారు
  rationale: ఈ సందర్భంలో ధృవీకరించబడని వంశం కారణంగా యాజక హోదాకు అనర్హులుగా పరిగణించి దాని నుంచి వేరుచేసిన ఆచరణాత్మక ఫలితాన్ని తెలియజేస్తుంది; అపవిత్రత అనే మూల భావసాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: מִן הַכְּהֻנָּה
  choice: యాజకత్వం నుంచి
  rationale: כְּהֻנָּה అనే పదంలోని యాజకత్వం లేదా యాజక పదవి భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: וַיְגֹאֲלוּ పదం యాజక హోదాతో ఉన్న సంబంధం
  choice: వారు యాజకత్వం నుంచి తొలగించబడ్డారు
  alternative: వారు యాజకత్వానికి అపవిత్రులుగా లేదా అనర్హులుగా పరిగణించబడ్డారు
  rationale: హీబ్రూ క్రియ అపవిత్రత లేదా అనర్హతగా పరిగణించబడడం అనే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠం ధృవీకరించలేని వంశావళి వల్ల కలిగిన పరిపాలనా ఫలితాన్ని తెలుపుతుంది; పాదసూచిక మూలపదంలోని విస్తృత భావాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘వ్రాతపూర్వక ఆధారం,’ ‘వంశావళి ప్రకారం నమోదైనవారు’ అనే పదబంధాలు పురాతన పరిపాలనా సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తాయి. మూలంలోని బహువచన నిర్మాణాన్ని ‘వారు అందులో కనిపించలేదు’ అని నిలిపి, దాని సూచనను సహజంగా స్పష్టం చేసింది.
