  text: హారీము కుమారులు—మూడువందల ఇరవై మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: తిరిగివచ్చినవారి వంశాల జాబితాలో ఈ పదం ఒక కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. మూలంలోని బంధుత్వ రూపాన్ని నిలుపుతూ, జాబితా సందర్భంలో సహజంగా అర్థమయ్యే తెలుగు పదం.
- source_word: חָרִם
  choice: హారీము
  rationale: ఇది వ్యక్తి లేదా వంశ నామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: שְׁלֹשׁ מֵאוֹת וְעֶשְׂרִים
  choice: మూడువందల ఇరవై మంది
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది; వ్యక్తుల లెక్క కాబట్టి స్పష్టత కోసం ‘మంది’ చేర్చబడింది.
