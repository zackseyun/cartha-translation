translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. సంఖ్యకు ముందు దీర్ఘ విరామరేఖ జాబితా నిర్మాణాన్ని స్పష్టం చేస్తుంది.
