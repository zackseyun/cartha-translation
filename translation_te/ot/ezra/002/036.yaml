  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/036.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: te
  text: 'యాజకులు: యేషూవా[b] వంశానికి చెందిన యెదాయా కుమారులు[a]—973 మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెదాయా సంతతివారు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘యెదాయా కుమారులు’ అని ఉంది; ఇది వంశావళుల్లో సాధారణంగా వాడే వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: యేషూవా అనే పేరు నిర్బంధవాసానంతర కాలంలో కనిపించే వ్యక్తినామం; ఇది యెహోషువ అనే పేరుతో సంబంధం కలది.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి నేరమైన, సహజమైన తెలుగు రూపం; ఇక్కడ లెక్కించబడుతున్న యాజకుల వర్గాన్ని పరిచయం చేస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘కుమారులు’; వంశావళి జాబితాల్లో ఇది సంతతివారిని కూడా సూచించగలదు. ఆ విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: יְדַעְיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: לְבֵית
  choice: వంశానికి చెందిన
  rationale: ఇక్కడ לְבֵית కుటుంబ లేదా పితృవంశ అనుబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశానికి చెందిన’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: పునరావాసానంతర కాలపు హీబ్రూ వ్యక్తినామం יֵשׁוּעַను మూలరూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 973 మంది
  rationale: హీబ్రూ సంఖ్య మొత్తం 973; జనగణన జాబితాలో చదవడానికి సులభంగా అంకెలలో ఇచ్చి, వ్యక్తుల సంఖ్య అని స్పష్టం చేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి పాటించబడింది. మూలంలోని ‘కుమారులు’ అనే వంశావళి రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృతార్థాన్ని పాదసూచికలో ఇచ్చాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
