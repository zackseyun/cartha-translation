- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఇది అక్షరార్థంగా ‘కుమారులు’ అయినా, వంశావళి/జనగణన సందర్భంలో ఒక వంశానికి చెందిన వారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ ఈ భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
