translation:
  language: te
  text: 'గాయకులు: ఆసాపు కుమారులు నూట ఇరవై ఎనిమిది మంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: שׁיר ధాతువు నుంచి వచ్చిన ఈ కర్తరి రూపం పాడేవారిని సూచిస్తుంది. జాబితా సందర్భంలో ‘గాయకులు’ నేరుగా, సహజంగా ఉంది; ‘సంగీతకారులు’ అనడం భావాన్ని విస్తరిస్తుంది, ‘ఆలయ గాయకులు’ అనడం ఈ వచనంలో స్పష్టంగా లేని సందర్భ సమాచారాన్ని చేర్చుతుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశ లేదా సేవావర్గ జాబితాల్లో בְּנֵי ఒక కుటుంబ లేదా వర్గ పరంపరను పరిచయం చేస్తుంది. ‘కుమారులు’ హీబ్రూ రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; ‘వంశస్థులు’ కూడా సాధ్యమే కాని మూలపాఠంలోని బంధపదాన్ని సాధారణీకరిస్తుంది.
- source_word: אָסָף
  choice: ఆసాపు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: నూట ఇరవై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్యా క్రమం 100 + 20 + 8. ‘నూట ఇరవై ఎనిమిది’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; వ్యక్తుల లెక్క అని సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన/వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘కుమారులు’ అనే రూపం జీవసంబంధ కుమారులనే తప్పనిసరిగా నిర్ధారించకుండా కుటుంబ లేదా సేవావర్గ పరంపర అనే మూలపాఠపు సాధ్యమైన విస్తృతిని నిలుపుతుంది.
