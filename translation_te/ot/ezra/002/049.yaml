  text: the sons of Uzza[a], the sons of Paseah, the sons of Besai.
translation:
  language: te
  text: ఉజ్జా వంశస్థులు[a], పాసేయహ్ వంశస్థులు, బేసై వంశస్థులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలోని పదానికి అక్షరార్థం ‘కుమారులు’; ఇక్కడ అది ప్రత్యక్ష కుమారులనే కాక విస్తృత కుటుంబ శ్రేణిని లేదా వంశస్థులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి ఈ జాబితాలో ఇది ఆయా పేరుగల పూర్వికుని కుటుంబ శ్రేణి లేదా సంతతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది. హెబ్రీ పాఠంలోని పునరుక్త నిర్మాణాన్ని మూడు పేర్లతోనూ నిలిపింది.
- source_word: עֻזָּא
  choice: ఉజ్జా
  rationale: హెబ్రీ వ్యక్తిపేరును దాని ద్విత్వ వ్యంజన ధ్వనికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: פָסֵחַ
  choice: పాసేహ
  rationale: హెబ్రీ వ్యక్తిపేరును అనువదించకుండా తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: בֵסָי
  choice: బేసై
  rationale: హెబ్రీ వ్యక్తిపేరును, చివరి యోద్ సూచించే ద్విస్వరాన్ని నిలుపుతూ, తెలుగులో లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని పాటించింది. ‘కుమారులు’ అనే అక్షరార్థ రూపం కలిగించగల తక్షణ పుత్రుల భావాన్ని నివారిస్తూ, సందర్భోచితమైన ‘వంశస్థులు’ను ఎంచుకుంది; మూలంలోని పునరుక్తిని నిలిపింది.
