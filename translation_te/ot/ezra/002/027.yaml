translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని పురుషవాచక సూచనను నిలిపి ఉంచి, సంఖ్యను సహజ తెలుగు రూపంలో ఇచ్చాం.
