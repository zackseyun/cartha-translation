lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: אִישׁ పదం యొక్క బహువచన నిర్మిత రూపం. ఈ జనగణన జాబితా సందర్భంలో తదుపరి పేర్కొన్న స్థలానికి చెందిన పురుషులను సూచిస్తుంది; అందువల్ల మూలంలోని లింగ నిర్దిష్టతను నిలుపుతూ సహజంగా అనువదించబడింది.
- source_word: מִכְמָס
  choice: మిక్మాసు
  rationale: ఇది స్థలనామం; అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: నూట ఇరవై ఇద్దరు
  rationale: హీబ్రూ సంఖ్యా క్రమం 100 + 20 + 2. వ్యక్తులను లెక్కిస్తున్నందున ఆధునిక తెలుగులో సహజమైన వ్యక్తివాచక సంఖ్యారూపం వాడబడింది.
