  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని దీర్ఘ సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘పైకి వచ్చిన’ అనే మూలంలోని భౌగోళిక-నుడికార రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
