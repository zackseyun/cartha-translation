  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: te
  text: 'బబులోను రాజైన నెబుకద్నెజరు బబులోనుకు చెరగా తీసుకెళ్లిన నిర్వాసితుల చెరనుండి పైకి వచ్చిన[a] ఆ ప్రావిన్సుకు చెందినవారు[b] వీరే. వారు యెరూషలేముకు, యూదాకు తిరిగి వచ్చారు—తమ తమ పట్టణాలకు.


    [a] మూలభాషలో “పైకి వచ్చిన” అని ఉంది. యెరూషలేము వైపు ప్రయాణించడాన్ని ఇలా చెప్పడం హీబ్రూ భాషలో సాధారణం.


    [b] మూలభాషలో అక్షరార్థంగా “ఆ ప్రావిన్సు కుమారులు” అని ఉంది; ఇది ఆ ప్రావిన్సుకు చెందినవారిని సూచించే హీబ్రూ నుడికారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో “పైకి వచ్చిన” అని ఉంది. యెరూషలేము వైపు ప్రయాణించడాన్ని ఇలా చెప్పడం హీబ్రూ భాషలో సాధారణం.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా “ఆ ప్రావిన్సు కుమారులు” అని ఉంది; ఇది ఆ ప్రావిన్సుకు చెందినవారిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: ఆ ప్రాంత ప్రజలు
  rationale: בְּנֵי అనే ‘కుమారులు’ రూపాన్ని తెలుగులో అక్షరార్థంగా ఉంచితే సహజార్థం మసకబారుతుంది. ఇది ఒక సమూహానికి చెందినవారిని సూచించే హీబ్రూ నుడికారం. מְדִינָה ఇక్కడ పర్షియా పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి సహజంగా ఉండేందుకు ‘ప్రాంతం’ ఎంచుకుని, మూలరూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: הָעֹלִים
  choice: పైకి వచ్చిన
  rationale: ఈ కృదంతం అక్షరార్థంగా ‘పైకి వచ్చేవారు/వచ్చినవారు’ అని అర్థం. యెరూషలేముకు వెళ్లడాన్ని ఆరోహణగా వర్ణించే మూలభాషా రూపాన్ని నిలిపి, దాని నుడికార స్వభావాన్ని పాదసూచికలో వివరించాం.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: నిర్వాసితుల చెరనుండి
  rationale: שְׁבִי లోని ‘చెర’ భావాన్నీ, גּוֹלָה లోని ‘నిర్వాసితులు/నిర్వాసం’ భావాన్నీ రెండింటినీ నిలిపే సంక్షిప్తమైన తెలుగు రూపం.
- source_word: אֲשֶׁר הֶגְלָה
  choice: చెరగా తీసుకెళ్లిన
  rationale: గלה హిఫీల్ రూపం బలవంతంగా దేశం నుండి తరలించడాన్ని సూచిస్తుంది. ‘బహిష్కరించిన’ కంటే ‘చెరగా తీసుకెళ్లిన’ సందర్భానికి స్పష్టంగా, సాధారణ పాఠకునికి సహజంగా ఉంది.
- source_word: נבוכדנצור
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉపయోగించాం; ఇది మూలంలోని బబులోను రాజు పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וַיָּשׁוּבוּ
  choice: తిరిగి వచ్చారు
  rationale: שׁוב క్రియలోని స్పష్టమైన తిరుగు భావాన్ని నేరుగా తెలియజేస్తుంది; ముందు ఉన్న ‘పైకి వచ్చిన’ ఆరోహణ రూపంతో దీనిని కలపలేదు.
- source_word: אִישׁ לְעִירוֹ
  choice: ఎవరి పట్టణానికి వారు
  rationale: వ్యక్తివ్యక్తిగా తమ తమ పట్టణాలకు తిరిగిన పంపిణీ భావాన్ని సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
