lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: వారి గుర్రాలు
  rationale: סוּס అంటే ‘గుర్రం’; బహువచన నిర్మాణ రూపానికి మూడవ పురుష బహువచన ప్రత్యయం చేరి యాజమాన్యాన్ని సూచిస్తుంది. తెలుగులో ‘వారి గుర్రాలు’ సహజమైన, ఖచ్చితమైన అనువాదం.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: '736'
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 736ను సూచిస్తుంది. జాబితా సందర్భంలో అంకెల వాడకం స్పష్టంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: פִּרְדֵיהֶם
  choice: వారి కంచరగాడిదలు
  rationale: פֶּרֶד అనేది గుర్రం-గాడిద సంకరజాతి జంతువైన ‘కంచరగాడిద’ను సూచిస్తుంది; బహువచన ప్రత్యయం యాజమాన్యాన్ని తెలియజేస్తుంది.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: హీబ్రూ సంఖ్యా శ్రేణి మొత్తం 245ను సూచిస్తుంది. జాబితా సందర్భంలో అంకెల రూపం సులభంగా గ్రహించదగినది.
