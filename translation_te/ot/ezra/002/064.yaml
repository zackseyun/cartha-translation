lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: సమాజమంతా
  rationale: నిర్దిష్ట నామవాచకంతో ఉన్న כָּל మొత్తం సమూహాన్ని సూచిస్తుంది. הַקָּהָל ఇక్కడ తిరిగి వచ్చిన ప్రజల సమూహం; ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రత్యేక మతసంస్థ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: כְּאֶחָד
  choice: కలిపి
  rationale: అక్షరార్థంగా ‘ఒక్కటిగా/ఒకటిగా’ అయిన ఈ ప్రయోగం ఇక్కడ సమూహం యొక్క ఉమ్మడి మొత్తం సంఖ్యను పరిచయం చేస్తుంది. ‘కలిపి’ ఆ సంఖ్యాత్మక సందర్భాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: నలభై రెండు వేల మూడు వందల అరవై
  rationale: హీబ్రూ సంఖ్యా నిర్మాణంలోని నాలుగు పదివేలు, రెండువేలు, మూడు వందలు, అరవై అనే భాగాల మొత్తం 42,360; తెలుగులో సహజ సంఖ్యా క్రమంలో అందించబడింది.
- source_word: '[implicit counted persons]'
  choice: మంది
  rationale: హీబ్రూలో సంఖ్య తరువాత లెక్కించబడిన వ్యక్తులను సూచించే నామవాచకం స్పష్టంగా లేకపోయినా, సందర్భంలో ప్రజల సంఖ్య అని తెలుగులో సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన జనగణన శైలి. ‘కలిపి’ సహజ ప్రయోగాన్ని ఇస్తుండగా, మూలంలోని כְּאֶחָד అక్షరార్థం పాదసూచికలో నిలుపబడింది.
