  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఎజ్రాలోని తిరిగివచ్చినవారి జాబితాలో ఈ పదం సాధారణంగా ఒక కుటుంబం లేదా వంశ సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘కుమారులు’ అని అక్షరార్థంగా అనువదిస్తే ప్రత్యక్ష కుమారులు మాత్రమే అన్న భావం కలగవచ్చు; ‘వంశస్థులు’ జాబితా సందర్భంలోని సమూహార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זַתּוּא
  choice: జత్తూ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: תְּשַׁע מֵאוֹת וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: 945 మంది
  rationale: హీబ్రూ సంఖ్య 900 + 40 + 5ను తెలుగు అంకెల్లో స్పష్టంగా ఇచ్చాం; ఇది వ్యక్తుల సంఖ్య కాబట్టి సహజమైన తెలుగు కోసం ‘మంది’ చేర్చాం.
