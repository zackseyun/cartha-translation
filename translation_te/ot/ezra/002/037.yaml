  terminology: ‘కుమారులు’ హెబ్రీ వంశ/కుటుంబ-జాబితా నుడికారాన్ని నేరుగా నిలుపుతుంది. ‘ఇమ్మేరు’ పేరు సరైన లిప్యంతరీకరణగా ఉంది. ‘మంది’ వ్యక్తుల లెక్కను తెలుగులో స్పష్టపరుస్తుంది; మూలార్థానికి ఏమీ జోడించదు.
