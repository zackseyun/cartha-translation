  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని కుటుంబ/వంశ సంబంధ నుడికారాన్ని ‘కుమారులు’గా నిలిపాం.
