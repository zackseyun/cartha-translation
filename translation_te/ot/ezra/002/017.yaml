  rationale: తిరిగి వచ్చినవారి జాబితాలో ఈ పదం ఒక కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ అనేది కేవలం ప్రత్యక్ష కుమారులు అనే భావానికి పరిమితం కాకుండా మూలంలోని విస్తృత అర్థాన్ని సహజంగా తెలియజేస్తుంది.
