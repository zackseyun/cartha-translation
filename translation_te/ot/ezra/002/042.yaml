translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని పాటించాం. హీబ్రూ בְּנֵי నిర్మాణాన్ని ప్రతిసారి అక్షరార్థంగా ‘కుమారులు’ అని కాకుండా, ఈ జనగణన సందర్భంలో ఉద్దేశించిన వంశ అనుబంధాన్ని తెలిపే ‘వంశస్థులు’గా ఇచ్చాం. వ్యక్తి పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించబడ్డాయి.
