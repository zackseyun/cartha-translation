id: EZR.2.42
reference: Ezra 2:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: te
  text: 'ద్వారపాలకులు: షల్లూము వంశస్థులు, ఆటేరు వంశస్థులు, తల్మోను వంశస్థులు, అక్కూబు వంశస్థులు, హటీతా వంశస్థులు, షోబై వంశస్థులు—మొత్తం 139 మంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఈ వంశావళి-జాబితా సందర్భంలో ఈ పదం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా పూర్వికునికి చెందిన వంశ లేదా కుటుంబ సమూహాన్ని సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘వంశస్థులు’ అని అనువదించబడింది.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ ద్వారాలను కాపాడే లేదా వాటి వద్ద సేవచేసే నియమిత సేవకులను సూచిస్తుంది; ‘ద్వారపాలకులు’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: మసొరేతు పాఠంలోని వ్యక్తి పేరును తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָטֵר
  choice: ఆటేరు
  rationale: మూల హీబ్రూ పేరును తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: טַלְמוֹן
  choice: తల్మోను
  rationale: మూల హీబ్రూ పేరును తెలుగు ధ్వని రూపంలో లిప్యంతరీకరించాం.
- source_word: עַקּוּב
  choice: అక్కూబు
  rationale: ద్విత్వ వ్యంజన ధ్వనిని నిలుపుతూ పేరును తెలుగు లిపిలో సహజంగా ప్రతిబింబించాం.
- source_word: חֲטִיטָא
  choice: హటీతా
  rationale: మసొరేతు స్వరచిహ్నాలు సూచించే పేరును సాధ్యమైనంత సమీపంగా తెలుగు లిపిలో ప్రతిబింబించాం.
- source_word: שֹׁבָי
  choice: షోబై
  rationale: మసొరేతు పాఠంలో సూచితమైన స్వరరూపాన్ని అనుసరించి పేరును లిప్యంతరీకరించాం.
- source_word: הַכֹּל
  choice: మొత్తం
  rationale: జాబితాలో ముందుగా పేర్కొన్న సమూహాల కలిపిన సంఖ్యను తెలిపే గణనాత్మక ప్రయోగం కావడంతో ‘మొత్తం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: 139 మంది
  rationale: మూల సంఖ్యను యథాతథంగా ఉంచి, అది వ్యక్తుల లెక్క అని తెలుగులో స్పష్టమయ్యేలా ‘మంది’ చేర్చాం.
