source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: te
  text: కాబట్టి యాజకులు, లేవీయులు, ప్రజల్లో కొందరు, గాయకులు, ద్వారపాలకులు, దేవాలయ సేవకులు[a] తమ తమ పట్టణాల్లో నివసించారు. ఇశ్రాయేలు వారందరూ కూడా తమ తమ పట్టణాల్లో నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నెతీనీయులు’; దేవాలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గానికి వాడే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ఈ సందర్భంలో ישׁב ఒక చోట స్థిరంగా ఉండడాన్ని లేదా నివాసం ఏర్పరచుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసించారు’ సహజంగా ఉండి, వాక్యంలోని రెండు భాగాలకూ సరిపోతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: దేవాలయ ఆరాధనా సందర్భంలో כהניםకు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: యాజకుల నుండి ప్రత్యేకంగా ప్రస్తావించబడిన లేవి గోత్ర సంబంధిత సేవకుల సమూహాన్ని సూచించే సుపరిచిత రూపం.
- source_word: וּמִן הָעָם
  choice: ప్రజల్లో కొందరు
  rationale: מן ఇక్కడ భాగార్థకంగా ఉంది; మొత్తం ప్రజలను కాక వారిలో కొందరిని సూచిస్తుంది.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: దేవాలయ సేవలో పాటలు పాడే బాధ్యతగలవారిని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: הַשּׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాల వద్ద కాపలా మరియు పర్యవేక్షణ బాధ్యత నిర్వహించేవారిని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: ఇది దేవాలయ సేవకు నియమించబడిన ప్రత్యేక వర్గానికి సాంకేతిక నామం. కేవలం లిప్యంతరీకరణ చేయకుండా వారి విధిని పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; మూలపద రూపం పాదటిప్పణిలో ఉంచబడింది.
- source_word: בְּעָרֵיהֶם
  choice: తమ తమ పట్టణాల్లో
  rationale: సంబంధిత ప్రజలు తమకు చెందిన వేర్వేరు నివాస ప్రాంతాల్లో ఉండడాన్ని సహజ తెలుగులో తెలియజేస్తుంది. עירకు ఈ సందర్భంలో ‘పట్టణం’ విస్తృతంగా సరిపోతుంది.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వారందరూ కూడా
  rationale: సమాజాన్ని సమష్టిగా సూచించే ‘ఇశ్రాయేలు అంతా’ అనే హీబ్రూ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘కూడా’ రెండవ సమాంతర వాక్యాన్ని మొదటిదానితో కలుపుతుంది.
theological_decisions:
- issue: הַנְּתִינִים అనే సాంకేతిక పదం అనువాదం
  choice: దేవాలయ సేవకులు
  alternative: నెతీనీయులు
  rationale: ఈ పదం చెరానంతర కాలంలోని దేవాలయ సేవకు నియమించబడిన ప్రత్యేక వర్గాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో వారి విధిని తెలిపే అర్థవంతమైన పదబంధాన్ని ఉపయోగించి, సంప్రదాయ లిప్యంతరీకరణను పాదటిప్పణిలో భద్రపరచడం ద్వారా స్పష్టతతో పాటు మూలపద ప్రత్యేకతను కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. జాబితా నిర్మాణం మరియు చివరి సమాంతర వాక్యం నిలుపబడ్డాయి. పాదటిప్పణి గుర్తు సంబంధిత ‘దేవాలయ సేవకులు’ పదానికే జతచేయబడింది.
