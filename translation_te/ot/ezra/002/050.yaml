  text: the sons of Asnah[a], the sons of Meunim[b], the sons of Nephisim.
translation:
  language: te
  text: అస్నా వంశస్థులు, మెయూనీము[a] వంశస్థులు, నెఫీసీము[b] వంశస్థులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును కొన్ని సంప్రదాయాల్లో ‘మాయోనీము’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును కొన్ని సంప్రదాయాల్లో ‘నెఫూసీము’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి వంశాల జాబితాలో ఈ పదం సాధారణంగా తక్షణ కుమారులను మాత్రమే కాకుండా ఒక పూర్వికుడు లేదా వంశనామంతో గుర్తించబడే సమూహాన్ని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగానూ సందర్భోచితంగానూ ఉంది.
- source_word: אַסְנָה
  choice: అస్నా
  rationale: ఇది వ్యక్తి లేదా వంశానికి చెందిన ప్రత్యేక నామం; మసొరేటిక్ రూపానికి అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: מעינים
  choice: మెయూనీము
  rationale: వంశావళి జాబితాలోని ప్రత్యేక సమూహనామంగా పరిగణించి, సంప్రదాయ మసొరేటిక్ పఠనాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించబడింది.
- source_word: נפיסים
  choice: నెఫీసీము
  rationale: ఇది ప్రత్యేక సమూహనామం. మసొరేటిక్ పఠనాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది; ఇతర సంప్రదాయాల్లో కనిపించే భిన్న పఠనం పాదసూచికలో నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి-జాబితా శైలి పాటించబడింది. בְּנֵי అనే పదాన్ని ప్రతి సమూహం దగ్గర ‘వంశస్థులు’గా పునరావృతం చేసి మూలపాఠ నిర్మాణాన్ని నిలిపి, తక్షణ జీవసంబంధ కుమారులనే భావం అనవసరంగా కలగకుండా చూశాం. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పేర్ల వెంటనే ఉంచబడ్డాయి.
