  rationale: తిరిగి వచ్చిన వారి వంశాల జాబితాలో ఈ పదం వ్యక్తి యొక్క ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భానికి తగినట్లు ‘వంశస్థులు’ అని అనువదించబడింది.
