lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచనం; జనగణన జాబితాలో ఒక వంశ లేదా కుటుంబ సమూహాన్ని సూచిస్తుంది. మూలంలోని వంశావళి శైలిని నిలుపుతూ తెలుగులో సహజంగా ఉండేందుకు ‘కుమారులు’ అని అనువదించాం.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: వ్యక్తి లేదా వంశనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 మంది
  rationale: హీబ్రూ సంఖ్యా క్రమం మొత్తం 1,254ను సూచిస్తుంది. జనగణన జాబితాలో సులభంగా చదవడానికి అంకెలను వాడి, వ్యక్తుల సంఖ్య అని తెలుగులో స్పష్టంగా ఉండేందుకు ‘మంది’ చేర్చాం.
