  rationale: వంశావళి సంబంధమైన ఈ జాబితాలో בְּנֵי అనే పదం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబ లేదా వంశ సమూహానికి చెందినవారిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా అర్థాన్ని అందిస్తుంది.
