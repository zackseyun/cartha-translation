translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. ‘కుమారులు’ అనే అక్షరార్థ రూపం కన్నా వంశ సభ్యత్వాన్ని స్పష్టంగా తెలిపే ‘వంశస్థులు’ వాడబడింది; హీబ్రూ వాక్యంలోని వంశ సంబంధాల క్రమాన్ని డాష్‌లతో చదవడానికి సులభంగా ఉంచింది.
