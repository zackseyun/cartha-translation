source:
  edition: WLC
  text: הַ/לְוִיִּ֑ם בְּנֵי יֵשׁ֧וּעַ וְ/קַדְמִיאֵ֛ל לִ/בְנֵ֥י הוֹדַוְיָ֖ה שִׁבְעִ֥ים וְ/אַרְבָּעָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: te
  text: 'లేవీయులు: యేషూవ, కద్మీయేలు వంశస్థులు—హోదవీయా వంశానికి చెందినవారు—డెబ్బై నలుగురు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ ‘హోదవీయా’ అని ఉంది; నెహెమ్యా 7:43లోని సమాంతర జాబితాలో ‘హోదేవా’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: నిర్దిష్ట సమూహనామంగా జనగణనలోని తదుపరి వర్గాన్ని పరిచయం చేస్తుంది; తెలుగులో సహజమైన శీర్షికా రూపం.
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఈ వంశావళి/జనగణన సందర్భంలో בְּנֵי కుటుంబ లేదా వంశ సభ్యత్వాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపాన్ని అనుసరించిన లిప్యంతరీకరణ.
- source_word: וְקַדְמִיאֵל
  choice: కద్మీయేలు
  rationale: సంయోజకంతో కూడిన వ్యక్తినామాన్ని అనువదించకుండా ధ్వన్యనుసారంగా అందించింది.
- source_word: לִבְנֵי
  choice: వంశానికి చెందినవారు
  rationale: లామెద్ ఉపసర్గ ఇక్కడ వంశ సంబంధం లేదా వర్గీకరణను సూచిస్తుంది; తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוֹדַוְיָה
  choice: హోదవీయా
  rationale: ఈ వచనంలోని మసోరెటిక్ పాఠరూపాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: డెబ్బై నలుగురు
  rationale: వ్యక్తులను లెక్కిస్తున్నందున ఆధునిక తెలుగులో మానవవాచక సంఖ్యారూపం సహజం.
