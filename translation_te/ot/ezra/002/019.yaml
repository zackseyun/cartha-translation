translation_notes:
  register: వంశావళి జాబితికి తగిన సంక్షిప్త, గంభీరమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. సంఖ్యకు ముందు దీర్ఘ విరామచిహ్నం జాబితా నిర్మాణాన్ని స్పష్టపరుస్తుంది.
