  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగివచ్చినవారి ఈ జాబితాలో ఈ పదం ఒక పూర్వికుని పేరుతో గుర్తించబడే కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. ‘కుమారులు’ అని అనువదిస్తే వారంతా హాషూము ప్రత్యక్ష కుమారులనే అపార్థం కలగవచ్చు; ‘వంశస్థులు’ మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָשֻׁם
  choice: హాషూము
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించారు.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: రెండువందల ఇరవైముగ్గురు
  rationale: హీబ్రూ సంఖ్యాక్రమం 223 మందిని సూచిస్తుంది. వ్యక్తుల సంఖ్య కాబట్టి తెలుగులో సహజంగా ‘ముగ్గురు’ అనే మానవవాచక సంఖ్యారూపాన్ని వాడారు.
