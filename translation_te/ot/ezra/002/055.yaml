  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని వాడాం. పునరావృత నిర్మాణాన్ని నిలిపి, ‘వంశస్థులు’ ద్వారా కుటుంబ సమూహ భావాన్ని స్పష్టం చేశాం.
