id: EZR.2.55
reference: Ezra 2:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סֹטַ֥י בְּנֵי הַ/סֹּפֶ֖רֶת בְּנֵ֥י פְרוּדָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: te
  text: 'సొలొమోను సేవకుల వంశస్థులు: సోతయి వంశస్థులు, హస్సోఫెరెతు వంశస్థులు, పెరూదా[a] వంశస్థులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ఎజ్రా పాఠంలో ‘పెరూదా’ అని ఉంది; నెహెమ్యా 7:57లోని సమాంతర జాబితాలో ‘పెరీదా’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఈ వంశావళి జాబితాలో ఈ పదం తక్షణ కుమారులను మాత్రమే కాక కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. అందువల్ల ‘కుమారులు’ కంటే ‘వంశస్థులు’ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తూ, హీబ్రూ వాక్యంలోని పునరావృత లయను కూడా నిలుపుతుంది.
- source_word: עַבְדֵי
  choice: సేవకుల
  rationale: עֶבֶד అనే పదానికి ‘దాసులు’ అనే అర్థం కూడా ఉండగలిగినా, ఇక్కడ ఇది తిరిగి వచ్చినవారి జాబితాలోని ‘సొలొమోను సేవకులు’ అనే స్థిర వర్గనామం. బానిసత్వ స్థితిని ప్రత్యేకంగా నొక్కిచెప్పని ఈ సందర్భంలో ‘సేవకులు’ తగిన అనువాదం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: סֹטַי
  choice: సోతయి
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిని తెలుగులో సహజంగా సూచించే లిప్యంతరీకరణ.
- source_word: הַסֹּפֶרֶת
  choice: హస్సోఫెరెతు
  rationale: పేరుతో కలిసిన హీబ్రూ నిర్దేశక ఉపసర్గను విడిగా అనువదించకుండా, కుటుంబనామంలోని భాగంగా లిప్యంతరీకరించాం.
- source_word: פְרוּדָא
  choice: పెరూదా
  rationale: ఎజ్రాలోని మసొరెటిక్ పాఠం פְרוּדָא ను ప్రధాన పాఠ్యంలో అనుసరించాం; నెహెమ్యాలోని సమాంతర జాబితాలో ఉన్న భిన్న రూపాన్ని పాదసూచికలో ఇచ్చాం.
