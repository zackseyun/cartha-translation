source:
  edition: WLC
  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/057.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: te
  text: షెఫట్యా కుమారులు, హట్టీల్ కుమారులు, పోకెరెత్-హజ్జెబాయీమ్[a] కుమారులు, ఆమీ కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జెబాయీమ్‌కు చెందిన పోకెరెత్.” హెబ్రీలో దీనిని సంయుక్త వంశనామంగా గానీ, ఒక పేరుకు తరువాత దానిని విశేషించే పదంగా గానీ చదవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో ఈ పదం కుటుంబ లేదా వంశ సమూహాన్ని పరిచయం చేస్తుంది. హెబ్రీ వాక్య నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేలా ప్రతి పేరుకు తరువాత ‘కుమారులు’ అని ఉంచాం.
- source_word: שְׁפַטְיָה
  choice: షెఫట్యా
  rationale: వ్యక్తి లేదా వంశనామం; అర్థానువాదం చేయకుండా హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חַטִּיל
  choice: హట్టీల్
  rationale: వ్యక్తి లేదా వంశనామం; హెబ్రీ రూపాన్ని అనుసరించి లిప్యంతరీకరించాం.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: పోకెరెత్-హజ్జెబాయీమ్
  rationale: ఇది సంయుక్త వంశనామంగా పనిచేస్తుండవచ్చు. రెండు భాగాల మధ్య సన్నిహిత సంబంధాన్ని సూచించడానికి హైఫన్ వాడాం; అయితే రెండవ భాగం మొదటి పేరును విశేషించే అంశం కావచ్చనే అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אָמִי
  choice: ఆమీ
  rationale: వ్యక్తి లేదా వంశనామం; అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని పునరుక్త నిర్మాణాన్ని నిలిపాం. అందించిన ఆంగ్ల పాఠంలో పాదసూచిక గుర్తు ‘Shephatiah’ తరువాత ఉన్నప్పటికీ, పాదసూచిక విషయం פֹּכֶרֶת הַצְּבָיִים గురించినది కాబట్టి తెలుగులో ఆ పేరుకు తరువాత గుర్తును ఉంచాం.
