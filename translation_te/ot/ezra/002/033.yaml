  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: te
  text: 'లోదు[a], హాదీదు, ఓనోలకు చెందినవారు: ఏడు వందల ఇరవై ఐదుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “లోదు, హాదీదు, ఓనోల కుమారులు.” ఈ జాబితాలో “కుమారులు” అనే మాట ప్రత్యక్ష కుమారులనే కాకుండా, ఆ ప్రాంతాలకు చెందిన కుటుంబాలు లేదా సమూహాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: చెందినవారు
  rationale: తిరిగి వచ్చినవారి ఈ జాబితాలో בְּנֵי అనేది కేవలం ప్రత్యక్ష కుమారులను కాకుండా, పేర్కొన్న స్థలాలకు చెందిన కుటుంబాలు లేదా సమూహాలను సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భార్థాన్ని స్పష్టంగా తెలియజేసే ‘చెందినవారు’ను ఎంచుకున్నాం.
- source_word: לֹד
  choice: లోదు
  rationale: ఇది స్థలనామం; హెబ్రీ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించాం. తరువాతి కాలంలో ఈ పట్టణం ‘లుద్ద’ అనే పేరుతో కూడా ప్రసిద్ధి చెందింది.
- source_word: חָדִיד
  choice: హాదీదు
  rationale: ఇది స్థలనామం; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְאוֹנוֹ
  choice: ఓనో
  rationale: వావ్ సంయోజకాన్ని తెలుగు జాబితా నిర్మాణంలో విరామచిహ్నంతో సహజంగా వ్యక్తం చేసి, స్థలనామాన్ని ‘ఓనో’గా లిప్యంతరీకరించాం.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: ఏడు వందల ఇరవై ఐదుగురు
  rationale: హెబ్రీ సంఖ్యను సరిగ్గా 725గా నిలిపి, వ్యక్తుల లెక్క కావడంతో తెలుగు మానవవాచక ప్రత్యయం ‘గురు’ను చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని పాటించాం. స్థలనామాలను హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; בְּנֵי యొక్క విస్తృత సామూహిక భావాన్ని ప్రధాన పాఠంలో సహజంగా అందించి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
