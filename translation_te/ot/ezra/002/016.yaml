translation:
  language: te
  text: హిజ్కియాకు చెందిన ఆటేరు కుమారులు—తొంభై ఎనిమిది మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి/జనగణన జాబితాలో ఈ నిర్మాణం కుటుంబం లేదా వంశానికి చెందిన వారిని సూచిస్తుంది. ‘కుమారులు’ మూలంలోని రూపాన్ని నిలుపుతూ, సందర్భంలో వంశస్థులు అనే భావాన్ని అందిస్తుంది.
- source_word: אָטֵר
  choice: ఆటేరు
  rationale: ఇది వ్యక్తి లేదా కుటుంబ నామం; తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించబడింది.
- source_word: לִיחִזְקִיָּה
  choice: హిజ్కియా వంశానికి చెందిన
  rationale: ఇక్కడ ל ఉపసర్గ అనుబంధాన్ని లేదా ఉపవర్గాన్ని సూచిస్తుంది. ‘హిజ్కియాకు చెందిన’ అనే అస్పష్టమైన రూపం కంటే, తిరిగివచ్చిన కుటుంబాల జాబితా సందర్భంలో ‘హిజ్కియా వంశానికి చెందిన’ అనేది సహజంగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: తొంభై ఎనిమిది మంది
  rationale: సంఖ్యను ప్రామాణిక ఆధునిక తెలుగులో ఇచ్చి, లెక్కించబడినవారు మనుషులని స్పష్టం చేయడానికి ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, తిరిగివచ్చిన వారి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా, కుటుంబ అనుబంధాన్ని సహజంగా వ్యక్తం చేసింది.
