translation:
  language: te
  text: అదోనీకాము వంశస్థులు ఆరువందల అరవై ఆరుగురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి సంబంధమైన ఈ తిరిగివచ్చినవారి జాబితాలో בְּנֵי అనే పదం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజంగా, సందర్భార్థాన్ని స్పష్టంగా తెలిపేలా ‘వంశస్థులు’ అని అనువదించాం.
- source_word: אֲדֹנִיקָם
  choice: అదోనీకాము
  rationale: ఇది వ్యక్తి పేరు; దాని హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించాం.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁשָּׁה
  choice: ఆరువందల అరవై ఆరుగురు
  rationale: హీబ్రూ సంఖ్య నేరుగా 666ను సూచిస్తుంది. జాబితాలో మనుషుల సంఖ్య కాబట్టి తెలుగులో సహజమైన ‘గురు’ ప్రత్యయంతో పదరూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనగణన-జాబితా శైలిని నిలిపాం. ‘కుమారులు’ అనే అక్షరార్థ రూపం కంటే సందర్భానికి తగిన ‘వంశస్థులు’ను ఎంచుకున్నాం; గౌరవప్రదమైన సాధారణ వచనాన్ని ఉపయోగించాం.
