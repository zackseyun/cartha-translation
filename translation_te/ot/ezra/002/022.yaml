  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పట్టణానికి చెందిన పురుషులు
  rationale: אִישׁ పదం యొక్క బహువచన సమాసరూపం; ఈ జనగణన జాబితాలో ఒక ప్రాంతానికి చెందిన పురుషులను లేదా కుటుంబ ప్రతినిధులను సూచిస్తుంది. తెలుగులో స్థలనామంతో సహజంగా అనుసంధానించడానికి ‘పట్టణానికి చెందిన పురుషులు’ అని అనువదించాం.
- source_word: נְטֹפָה
  choice: నెతోఫా
  rationale: ఇది స్థలనామం; అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: חֲמִשִּׁים וְשִׁשָּׁה
  choice: యాభై ఆరుగురు
  rationale: అక్షరార్థంగా ‘యాభై మరియు ఆరు’; ఆధునిక సహజమైన తెలుగులో 56 అనే సంఖ్యను ‘యాభై ఆరు’గా, వ్యక్తుల లెక్క కావడంతో ‘గురు’ ప్రత్యయంతో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. ‘పురుషులు’ ద్వారా మూలంలోని వ్యాకరణపరమైన పుంలింగ సూచనను నిలిపాం; సంఖ్యను సహజ తెలుగు రూపంలో ఇచ్చాం.
