source:
  edition: WLC
  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: te
  text: పితృకుటుంబాల పెద్దలలో కొందరు యెరూషలేములోనున్న యాహ్వే మందిరానికి వచ్చినప్పుడు, దేవుని మందిరాన్ని దాని స్థలంలో స్థాపించడానికి స్వచ్ఛందంగా కానుకలు ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దాని పునాదిమీద” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం మందిరపు స్థిరమైన స్థలాన్నిగానీ దాని పునాదినిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలలో కొందరు
  rationale: מִן విభక్తి భాగార్థాన్ని సూచిస్తుంది; అందువల్ల పెద్దలందరూ కాక, వారిలో కొందరు అని అనువదించాం. הָאָבוֹת ఇశ్రాయేలు వంశాధారిత కుటుంబ విభాగాలను సూచిస్తుంది.
- source_word: בְּבוֹאָם
  choice: వారు ... వచ్చినప్పుడు
  rationale: בְּ + ప్రత్యయంతో కూడిన క్రియానామం ఇక్కడ కాలార్థకంగా ఉంది; ఆధునిక తెలుగులో సహజంగా కాల ఉపవాక్యంగా ఇచ్చాం.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో ఇచ్చాం.
- source_word: הִתְנַדְּבוּ
  choice: స్వచ్ఛందంగా కానుకలు ఇచ్చారు
  rationale: נדב హిత్పయేల్ రూపం ఇష్టపూర్వకమైన, స్వచ్ఛంద సమర్పణను సూచిస్తుంది; సందర్భంలోని దానార్థాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: לְהַעֲמִידוֹ
  choice: నిలబెట్టడానికి
  rationale: עמד హిఫీల్ ‘నిలిచేలా చేయడం, స్థాపించడం’ అనే భావాన్ని ఇస్తుంది; మందిర పునర్నిర్మాణ సందర్భానికి ‘నిలబెట్టడం’ తగినదిగా ఉంది.
- source_word: עַל מְכוֹנוֹ
  choice: దాని స్థలంలో
  rationale: מָכוֹן స్థిరస్థలం, అసలు చోటు లేదా పునాది అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన స్థలార్థాన్ని ఉంచి, పునాది అనే సాధ్యార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామ రూపంలో నిలిపాం; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: הָאָבוֹת సూచించే సామాజిక నిర్మాణం
  choice: పితృకుటుంబాలు
  alternative: కుటుంబాలు; వంశకుటుంబాలు
  rationale: ఇది కేవలం చిన్న కుటుంబాలను కాక, పూర్వికుని ఆధారంగా ఏర్పడిన ఇశ్రాయేలు బంధుత్వ విభాగాలను సూచిస్తుంది. మూలంలోని పితృవంశ భావాన్ని పూర్తిగా చెరపకుండా సహజమైన సమాసాన్ని వాడాం.
- issue: עַל מְכוֹנוֹ యొక్క భావం
  choice: దాని స్థలంలో
  alternative: దాని పునాదిమీద
  rationale: ఈ పదబంధం మందిరపు భౌతిక పునాదినీ, దాని నిర్దిష్టమైన అసలు స్థలాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ఒక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా విస్తృతార్థాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘మందిరం’ ద్వారా సందర్భాన్ని స్పష్టం చేస్తూనే ‘యెహోవా మందిరం / దేవుని మందిరం’ అనే మూలంలోని సమాంతరతను నిలిపాం. మూలంలో లేని ఆలయ నిర్మాణ దశను అతిగా నిర్దిష్టం చేయలేదు.
