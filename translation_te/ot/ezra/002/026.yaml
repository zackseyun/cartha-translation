lexical_decisions:
- source_word: בְּנֵי
  choice: నివాసులు
  rationale: ఈ జనగణన జాబితాలో בְּנֵי అనే పదం వ్యక్తుల తక్షణ కుమారులనే కాకుండా వంశం లేదా ప్రాంతానికి చెందిన సమూహాన్ని సూచించగలదు. ఇక్కడ రెండు ఊర్ల పేర్లు కలిసి రావడం వల్ల సహజమైన ఆధునిక తెలుగులో ‘నివాసులు’ అనేది సందర్భానుకూలం; ‘కుమారులు’ అనే మూలపద రూపాన్ని పాదసూచనలో ఉంచాం.
- source_word: הָרָמָה
  choice: రామా
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: וָגָבַע
  choice: గెబ
  rationale: వావ్ సంధిని తెలుగులో విరామచిహ్నంతో సహజంగా చూపించి, హీబ్రూ స్థలనామాన్ని ‘గెబ’గా లిప్యంతరీకరించాం.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: ఆరువందల ఇరవై ఒకరు
  rationale: జనుల సంఖ్యను తెలిపే సంఖ్యాపదాన్ని ఆధునిక, సహజమైన తెలుగు రూపంలో ఇచ్చాం.
