translation:
  language: te
  text: 'బేతేలు, హాయి పట్టణాలకు చెందిన పురుషులు: రెండు వందల ఇరవై ముగ్గురు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: אִישׁ పదపు బహువచన నిర్మాణరూపం ఈ జనగణన జాబితాలో ఆ ప్రాంతాలకు చెందిన పురుషులను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో స్థలపేర్ల తర్వాత ‘పురుషులు’ అని ఉంచడం సహజంగా, మూలానికి సమీపంగా ఉంటుంది.
- source_word: בֵית אֵל
  choice: బేతేలు
  rationale: స్థలపేరును అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: וְהָעָי
  choice: హాయి
  rationale: హీబ్రూలో నిర్దేశక ఉపపదం ఉన్నప్పటికీ, స్థిరమైన స్థలపేరుతో తెలుగులో దానిని ప్రత్యేకంగా వ్యక్తం చేయడం సహజం కాదు. వావ్ సంధిని రెండు స్థలపేర్ల మధ్య కామాతో సహజంగా వ్యక్తం చేశాం.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: రెండు వందల ఇరవై ముగ్గురు
  rationale: మూలంలోని 223 అనే సంఖ్యను స్పష్టమైన ఆధునిక తెలుగు పదరూపంలో ఇచ్చాం; వ్యక్తుల లెక్క కావడంతో ‘ముగ్గురు’ అనే మానవ గణనరూపాన్ని వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. ‘పట్టణాల’ అనే పదాన్ని స్థలపేర్లు వ్యక్తులను విశేషిస్తున్న సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి చేర్చాం.
