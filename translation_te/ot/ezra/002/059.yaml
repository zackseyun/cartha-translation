id: EZR.2.59
reference: Ezra 2:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: te
  text: తేల్-మెలహ్, తేల్-హర్షా, కెరూబ్, అద్దాన్, ఇమ్మేర్ నుండి పైకి వచ్చినవారు వీరు. అయితే, తమ పితృకుటుంబాన్ని, తమ సంతతిని[a] తాము ఇశ్రాయేలీయులమో కాదో వారు తెలియజేయలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ పితరుల ఇంటివారిని, తమ వంశస్థులను.’ ఈ హీబ్రూ పదబంధం తండ్రి వైపు నమోదైన వంశపరంపరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹלִים
  choice: పైకి వచ్చినవారు
  rationale: ప్రవాసం నుంచి దేశానికి తిరిగి రావడాన్ని సూచించే עלה అనే భౌగోళిక నుడికారాన్ని కాపాడుతూ, సందర్భంలో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: తేల్-మెలహ్, తేల్-హర్షా, కెరూబ్, అద్దాన్, ఇమ్మేర్ అనే స్థలాల నుంచి
  rationale: ఇవి స్థల లేదా వంశ నామాలుగా కనిపిస్తున్నందున అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. సందర్భం ప్రయాణ ఆరంభ ప్రాంతాలను సూచిస్తున్నందున ‘అనే స్థలాల’ అని స్పష్టం చేయబడింది.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: తెలియజేయలేకపోయారు
  rationale: పరిపాలనా-వంశావళి సందర్భంలో נגד అంటే వివరాన్ని తెలియజేయడం లేదా ప్రకటించడం. తెలుగు వాక్యప్రవాహంలో ‘తెలియజేయలేకపోయారు’ సహజంగా ఉండి, అసమర్థత భావాన్ని నిలుపుతుంది.
- source_word: בֵּית אֲבוֹתָם
  choice: తమ పితృగృహం
  rationale: ఇది తండ్రి వైపు పూర్వీకుల కుటుంబ/వంశ సమూహాన్ని సూచించే సాంకేతిక వంశావళి పదబంధం. ‘పితృగృహం’ మూలంలోని సామాజిక నిర్మాణాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: וְזַרְעָם
  choice: తమ వంశం
  rationale: זרע ఇక్కడ శారీరక ‘విత్తనం’ కంటే సంతతి లేదా వంశపరంపరను సూచిస్తుంది. ‘వంశం’ ఆధునిక తెలుగులో సహజంగా ఉండి వంశావళి సందర్భానికి సరిపోతుంది.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: ఇశ్రాయేలుకు చెందినవో కావో
  rationale: వారు ఇశ్రాయేలు సంతతికి చెందినవారా అనే అనిశ్చితిని ఇది వ్యక్తం చేస్తుంది. మూలంలోని ‘whether’ భావాన్ని ‘చెందినవో కావో’ స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన/వంశావళి నమోదు సందర్భానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. స్థలనామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; వంశ సంబంధమైన మూలపాఠ్య అనిశ్చితి పరిష్కరించకుండా నిలుపబడింది.
