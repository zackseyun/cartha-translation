translation_notes:
  register: జనగణన జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని పురుష లింగ సూచనను నిలిపి, సంఖ్యను అంకెలకు బదులు పదాలతో ఇచ్చాం.
