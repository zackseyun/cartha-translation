  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: పురుషులు
  rationale: ఇది אִישׁ పదపు బహువచన నిర్మాణ రూపం; జనగణన జాబితాలో ఒక ప్రాంతానికి చెందిన పురుషులను సూచిస్తుంది. అందువల్ల లింగ సూచనను నిలుపుతూ సహజమైన తెలుగులో ‘పురుషులు’ అని అనువదించాం.
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: ఇది స్థలనామం; అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: నూట ఇరవై ఎనిమిది మంది
  rationale: హీబ్రూ సంఖ్యాపదబంధాన్ని సహజమైన ఆధునిక తెలుగు పదరూపంలో ఇచ్చాం; లెక్కించబడినవారు పురుషులు కాబట్టి ‘మంది’ చేర్చాం.
