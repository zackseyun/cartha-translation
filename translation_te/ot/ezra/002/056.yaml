translation:
  language: te
  text: యయలా కుమారులు, దర్కోను కుమారులు, గిద్దేలు కుమారులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదం యొక్క బహువచన నిర్మిత రూపం. వంశావళి జాబితాలో కుటుంబం లేదా వంశానికి చెందినవారిని సూచించినప్పటికీ, హెబ్రీ రూపాన్ని సహజంగా నిలుపుతూ ‘కుమారులు’ అని అనువదించాం.
- source_word: יַעְלָה
  choice: యాలా
  rationale: వ్యక్తి లేదా వంశపూర్వికుని పేరుగా భావించి, హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: דַרְקוֹן
  choice: దార్కోను
  rationale: జాబితాలోని వ్యక్తి లేదా కుటుంబ నామం కాబట్టి అర్థానువాదం చేయకుండా హెబ్రీ రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: גִדֵּל
  choice: గిద్దేలు
  rationale: వ్యక్తి లేదా వంశపూర్వికుని పేరుగా నేరుగా లిప్యంతరీకరించాం; పునరుక్తమైన בְּנֵי ఈ పేరుతో సంబంధమున్న కుటుంబ సమూహాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. పేర్లకు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా పదాంత స్వరాలను ఉపయోగించాం; మూలంలోని మూడు సమాంతర పదబంధాల పునరుక్తిని అలాగే ఉంచాం.
