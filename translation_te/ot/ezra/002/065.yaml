  text: besides their male and female servants[a], these were 7,337; and they had 200 male and female singers.
translation:
  language: te
  text: వారి దాసదాసీలు[a] కాకుండా, వీరు 7,337 మంది; వారికి 200 మంది గాయకులు, గాయనులు కూడా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పురుష సేవకులు, స్త్రీ సేవకులు.’ హీబ్రూ పదాలు ఇంటి సేవకులను విస్తృతంగా సూచించగలవు; అయితే ఈ జనగణన సందర్భంలో ‘దాసదాసీలు’ వారి ఆధీన సామాజిక స్థితిని మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: కాకుండా
  rationale: ముందటి జనసంఖ్యకు అదనంగా లెక్కించబడిన వర్గాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: వారి దాసదాసీలు
  rationale: పురుష, స్త్రీ ఆధీన సేవకులను సూచించే జతపదాలను సంక్షిప్తంగా, సామాజిక స్థితిని మసకబార్చకుండా అందిస్తుంది.
- source_word: אֵלֶּה ... שִׁבְעָה
  choice: వీరు 7,337 మంది
  rationale: హీబ్రూ సంఖ్యా ప్రకటనను జనగణన సందర్భానికి తగిన సహజ తెలుగు రూపంలో, ఖచ్చిత సంఖ్యతో అందిస్తుంది.
- source_word: וְלָהֶם
  choice: వారికి ... ఉన్నారు
  rationale: హీబ్రూ స్వామ్యార్థక నిర్మాణాన్ని సహజమైన తెలుగు అస్తిత్వ నిర్మాణంగా అనువదిస్తుంది.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: గాయకులు, గాయనులు
  rationale: మూలంలోని పుంలింగ, స్త్రీలింగ రూపాల స్పష్టమైన భేదాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: מָאתָיִם
  choice: 200 మంది
  rationale: జనగణన జాబితాలో సులభంగా చదవడానికి అంకెలను ఉపయోగిస్తూ, వ్యక్తుల సంఖ్య అని స్పష్టం చేస్తుంది.
