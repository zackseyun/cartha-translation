lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ జనగణన జాబితాలో హెబ్రీ పదం అక్షరార్థంగా ‘కుమారులు’ అని ఉన్నప్పటికీ, అది ఒక వంశానికి చెందిన వారిని సూచించే ప్రామాణిక వంశపదం. ప్రధాన పాఠంలో మూల నిర్మాణాన్ని నిలిపి, విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: פַרְעֹשׁ
  choice: పరోషు
  rationale: ఇది వ్యక్తి లేదా వంశనామం; తెలుగు ఉచ్చారణకు సహజంగా ఉండేలా లిప్యంతరీకరించాం.
- source_word: אַלְפַּיִם מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: 2,172
  rationale: హెబ్రీ సంఖ్యా పదబంధం మొత్తం 2,172ను సూచిస్తుంది. జనగణన జాబితాలో స్పష్టత కోసం అంకెలతో ఇచ్చాం.
