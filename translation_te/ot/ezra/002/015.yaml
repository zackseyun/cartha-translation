lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఎజ్రాలోని తిరిగి వచ్చినవారి జాబితాల్లో ఈ పదం ఒక కుటుంబ లేదా వంశ సమూహాన్ని పరిచయం చేస్తుంది. ‘కుమారులు’ మూలంలోని వంశావళి ఆధారిత జాబితా రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భంలో ఇది విస్తృతంగా వంశస్థులను కూడా సూచించవచ్చు.
- source_word: עָדִין
  choice: ఆదీను
  rationale: ఇది వ్యక్తి పేరు; అనువదించకుండా తెలుగు ధ్వని, లిపి పద్ధతికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: אַרְבַּע מֵאוֹת חֲמִשִּׁים וְאַרְבָּעָה
  choice: 454 మంది
  rationale: మూలంలోని సంఖ్య 454ను యథాతథంగా అంకెలలో ఇచ్చి, లెక్కించబడిన మనుషులను తెలుగులో సహజంగా సూచించడానికి ‘మంది’ చేర్చబడింది.
