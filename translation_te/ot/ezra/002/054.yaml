lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఎజ్రాలోని తిరిగి వచ్చినవారి జాబితాలో ఈ పదం కుటుంబ లేదా వంశ సమూహాన్ని పరిచయం చేస్తుంది. ‘కుమారులు’ హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, జాబితా శైలిలో సహజంగా ఉంది; సందర్భానుసారం ‘వంశస్థులు’ అనే విస్తృత భావం కూడా ఉండవచ్చు.
- source_word: נְצִיחַ
  choice: నెజీయా
  rationale: ఇది వ్యక్తినామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: חֲטִיפָא
  choice: హతీఫా
  rationale: ఇది వ్యక్తినామం; సందర్భానికి సంబంధం లేని వ్యుత్పత్తి అర్థాన్ని రుద్దకుండా, హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
