  language: te
  text: మగ్బీషు వంశస్థులు నూట యాభై ఆరుగురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఎజ్రాలోని తిరిగివచ్చినవారి జాబితాలో ఈ పదం సాధారణంగా ఒక కుటుంబం లేదా వంశ సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘కుమారులు’ అనడం ప్రత్యక్ష కుమారులనే భావాన్ని కలిగించవచ్చు కాబట్టి, సమూహార్థాన్ని సహజంగా తెలియజేయడానికి ‘వంశస్థులు’ ఎంచుకున్నాం.
- source_word: מַגְבִּישׁ
  choice: మగ్బీషు
  rationale: ఇది వ్యక్తి పేరా స్థలపేరా అనేది నిర్ధిష్టంగా తెలియదు. అందువల్ల పేరుగానే లిప్యంతరీకరించి, హీబ్రూ రూపాన్ని సాధ్యమైనంత దగ్గరగా నిలిపాం.
- source_word: מֵאָה חֲמִשִּׁים וְשִׁשָּׁה
  choice: నూట యాభై ఆరుగురు
  rationale: హీబ్రూ సంఖ్య 156ను నేరుగా సూచిస్తుంది. వ్యక్తులను లెక్కిస్తున్నందున ఆధునిక సహజ తెలుగులో వ్యక్తివాచక రూపమైన ‘ఆరుగురు’ వాడాం.
