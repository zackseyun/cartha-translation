  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘మగ్బీషు’ ఎవరో లేదా ఏ ప్రదేశమో మూలంలో ఉన్న అనిశ్చితిని వివరణతో తొలగించకుండా అలాగే ఉంచాం.
