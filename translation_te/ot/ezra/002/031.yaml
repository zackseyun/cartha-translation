lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి–జనగణన జాబితాలో ఈ నిర్మిత బహువచనం అక్షరార్థంగా ‘కుమారులు’ అని కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఇది వ్యక్తి, వంశం లేదా స్థలానికి సంబంధించిన ప్రత్యేక నామం; తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: אַחֵר
  choice: మరొక
  rationale: ఈ అధ్యాయంలో ఇంతకుముందు పేర్కొన్న ఏలాము వంశం నుండి ఈ సమూహాన్ని వేరుచేస్తుంది. అయితే ఇది ‘మరొక ఏలాము’నో, ‘ఏలాముకు చెందిన మరొక సమూహం’నో సూచించవచ్చనే నిర్మాణాత్మక సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254 మంది
  rationale: హీబ్రూ సంఖ్య మొత్తం 1,254. జనగణన జాబితాలో చదవడానికి సులభంగా అంకెలను వాడి, వ్యక్తుల సంఖ్య అని తెలుపడానికి ‘మంది’ చేర్చాం.
