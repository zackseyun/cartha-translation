lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఇది בֵּן (‘కుమారుడు’) పదపు నిర్మాణ బహువచనం. ఈ జనగణన జాబితాలో ఒక స్థలానికి చెందిన సమూహాన్ని సూచిస్తుంది; తెలుగులో ‘కుమారులు’ అనడం సహజార్థాన్ని తప్పుదోవ పట్టించవచ్చు కాబట్టి ‘వంశస్థులు’ అని అనువదించబడింది.
- source_word: בֵית לָחֶם
  choice: బేత్లెహేము
  rationale: ఇది స్థలనామం; దాని అక్షరార్థమైన ‘రొట్టెల ఇల్లు’ అని అనువదించకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించబడింది.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: నూట ఇరవై ముగ్గురు
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 123 మందిని సూచిస్తుంది. వ్యక్తుల సంఖ్య కాబట్టి తెలుగులో సహజమైన వ్యక్తివాచక సంఖ్యారూపం ‘ముగ్గురు’ వాడబడింది.
