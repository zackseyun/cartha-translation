  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. చారిత్రక నాణెం, కొలమానాల పేర్లను లిప్యంతరీకరించి పాదసూచికల్లో వివరించాం; సంఖ్యలను సులభ పఠనార్థం అంకెలలో ఇచ్చాం.
