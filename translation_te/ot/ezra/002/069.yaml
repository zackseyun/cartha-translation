source:
  edition: WLC
  text: כְּ/כֹחָ֗/ם נָתְנוּ֮ לְ/אוֹצַ֣ר הַ/מְּלָאכָה֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שֵׁשׁ רִבֹּ֣אות וָ/אֶ֔לֶף וְ/כֶ֕סֶף מָנִ֖ים חֲמֵ֣שֶׁת אֲלָפִ֑ים וְ/כָתְנֹ֥ת כֹּהֲנִ֖ים מֵאָֽה־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: te
  text: 'వారు తమ సామర్థ్యానికి తగినట్లు నిర్మాణ పనికోసం ఖజానాకు ఇచ్చారు: 61,000 బంగారు దారికులు[a], వెండి 5,000 మినాలు[b], యాజకుల అంగీలు 100.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంగారు నాణేలు’; హెబ్రీ పదం ప్రత్యేకంగా పర్షియా దారికులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మినా అనేది ప్రాచీన కాలపు బరువు మరియు ద్రవ్య ప్రమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: తమ సామర్థ్యానికి తగినట్లు
  rationale: כְּ తో కూడిన כֹּחַ ఇక్కడ వారి శక్తి లేదా వనరుల పరిమాణానికి అనుగుణంగా ఇచ్చారనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: మూలంలోని సాధారణ ‘ఇవ్వు’ అనే అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా సహజంగా నిలుపుతుంది.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: నిర్మాణ పనికోసం ఖజానాకు
  rationale: אוֹצָר అంటే ఖజానా లేదా నిల్వగది; సందర్భంలో מְלָאכָה ఆలయ పునర్నిర్మాణ పనిని సూచిస్తుంది. తెలుగు వాక్యక్రమంలో ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: דַּרְכְּמוֹנִים
  choice: దారికులు
  rationale: ఇది పర్షియా బంగారు నాణేలైన దారికులను సూచించే చారిత్రక పదం; సాధారణ ‘నాణేలు’ కంటే మూలంలోని నిర్దిష్టతను కాపాడుతుంది.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000
  rationale: ‘ఆరు పదివేలు మరియు ఒక వెయ్యి’ అనే హెబ్రీ సంఖ్యకు స్పష్టమైన ఆధునిక సంఖ్యారూపం.
- source_word: מָנִים
  choice: మినాలు
  rationale: మినా ప్రాచీన బరువు మరియు ద్రవ్య ప్రమాణం; సరికాని ఆధునిక సమాన ప్రమాణంతో భర్తీ చేయకుండా చారిత్రక ప్రమాణాన్ని నిలుపుతుంది.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: విరాళాల జాబితాలో స్పష్టత కోసం సంఖ్యారూపాన్ని ఉపయోగించింది.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: యాజకుల కోసం ... అంగీలు
  rationale: כָתְנֹת ప్రత్యేకంగా పొడవైన లోదుస్తులు లేదా అంగీలను సూచిస్తుంది. హెబ్రీ సంబంధవాచకం స్వామ్యాన్ని గానీ ఉద్దేశాన్ని గానీ సూచించగలదు; సందర్భానికి సహజంగా ‘యాజకుల కోసం’ అని అనువదించబడింది.
- source_word: מֵאָה
  choice: '100'
  rationale: మిగతా పరిమాణాలతో శైలీ సమన్వయం కోసం సంఖ్యారూపాన్ని ఉపయోగించింది.
