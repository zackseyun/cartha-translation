  text: రెజీను కుమారులు[a], నెకోదా కుమారులు, గజ్జాము కుమారులు;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో మూడుసార్లు వచ్చే ‘కుమారులు’ అనే మాటకు ‘వంశస్థులు’ అని కూడా అర్థం కావచ్చు; ఈ హీబ్రూ ప్రయోగం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా ఒక కుటుంబ సమూహాన్ని లేదా వంశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచన రూపం. తిరిగివచ్చినవారి ఈ జాబితాలో కుటుంబం లేదా వంశానికి చెందినవారిని సూచించగలిగినా, హీబ్రూ పదరూపాన్ని సహజంగా నిలుపుతూ ‘కుమారులు’ అని అనువదించబడింది.
- source_word: רְצִין
  choice: రెజీను
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: נְקוֹדָא
  choice: నెకోదా
  rationale: వ్యక్తినామాన్ని మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: גַזָּם
  choice: గజ్జాము
  rationale: జాయిన్ అక్షరంలోని దాగేశ్ సూచించే ద్విత్వ ధ్వనిని ‘జ్జ’తో నిలిపి, పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని మరియు హీబ్రూ వాక్యంలోని పునరుక్త నిర్మాణాన్ని నిలిపాం. పేర్లకు తెలుగు బైబిలు శైలికి సరిపోయే సహజ పదాంతాలను ఉపయోగించాం.
