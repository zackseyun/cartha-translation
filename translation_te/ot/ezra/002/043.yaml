base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: te
  text: 'ఆలయ సేవకులు: సీహా వంశస్థులు[a], హసూపా వంశస్థులు, తబ్బాయోతు వంశస్థులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ప్రతి పేరుకు ముందు అక్షరార్థంగా ‘కుమారులు’ అని ఉంది; వంశావళి జాబితాల్లో అది ‘వంశస్థులు’ లేదా ‘కుటుంబానికి చెందినవారు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: ఆలయ సేవకులు
  rationale: ఇది దేవాలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గాన్ని సూచిస్తుంది. అపరిచితమైన ‘నెతీనీయులు’ అనే లిప్యంతరీకరణకు బదులు, సందర్భంలోని వారి విధిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి జాబితాల్లో ఈ పదం కేవలం ప్రత్యక్ష కుమారులనే కాకుండా ఒక కుటుంబం లేదా వంశానికి చెందిన వారిని కూడా సూచించగలదు; ఇక్కడ ‘వంశస్థులు’ సహజంగా, ఖచ్చితంగా సరిపోతుంది.
- source_word: צִיחָא
  choice: సీహా
  rationale: హీబ్రూ వ్యక్తి లేదా వంశనామాన్ని తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֲשׂוּפָא
  choice: హసూఫా
  rationale: హీబ్రూ వ్యక్తి లేదా వంశనామాన్ని దాని హల్లులు, అచ్చుల ఆధారంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: טַבָּעוֹת
  choice: తబ్బాయోతు
  rationale: ఈ జాబితాలో ఇది సాధారణ నామవాచకంగా కాక వ్యక్తి లేదా వంశనామంగా పనిచేస్తున్నందున అనువదించకుండా లిప్యంతరీకరించాం.
