translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా నిలిపి ఉంచాం. ‘ఆలయ సేవకులు’ అనే స్పష్టమైన కార్యార్థ పదాన్ని వాడి, పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
