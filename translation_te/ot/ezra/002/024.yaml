  language: te
  text: 'అజ్మావెత్ కుమారులు: నలభై ఇద్దరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అజ్మావెత్ వంశస్థులు.’ హీబ్రూలోని ‘కుమారులు’ అనే వ్యక్తీకరణ ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా, విస్తృత వంశానికి లేదా కుటుంబ సమూహానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదం యొక్క బహువచన నిర్మిత రూపం. వంశావళి లేదా జనగణన సందర్భంలో ఇది ప్రత్యక్ష కుమారులనే కాకుండా ఒక వంశానికి లేదా కుటుంబ సమూహానికి చెందిన వారిని కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని రూపాన్ని నిలుపుతూ ‘కుమారులు’ అని అనువదించి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: עַזְמָוֶת
  choice: అజ్మావెతు
  rationale: ఇది వ్యక్తి పేరు లేదా స్థలనామం కావచ్చు. మూల ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా చదవగలిగే విధంగా లిప్యంతరీకరించాం; ఇక్కడి అనిశ్చితిని అనువాదంలో ప్రత్యేకంగా పరిష్కరించలేదు.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: నలభై ఇద్దరు
  rationale: హీబ్రూ సంఖ్య ‘నలభై రెండు’ను వ్యక్తులను లెక్కించే సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, తిరిగి వచ్చినవారి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని వంశసంబంధ పదప్రయోగాన్ని ప్రధాన పాఠంలో నిలిపి, దాని విస్తృత భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
