  source_fidelity: మూల హీబ్రూ జాబితా నిర్మాణాన్ని మూడు సార్లు పునరావృతమైన బְּנֵיతో సహా అనువాదం సముచితంగా ప్రతిబింబిస్తుంది. ఈ సందర్భంలో బְּנֵי వంశ/కుటుంబ సమూహాన్ని సూచించగలదు; ‘వంశస్థులు’ ఆ జాబితా-సందర్భ భావాన్ని సహజంగా అందిస్తుంది. గిద్దేలు, గహరు, రెయాయా అనే నామరూపాలు వరుసగా גִדֵּל, גַחַר, רְאָיָהలకు తగిన తెలుగు లిప్యంతరీకరణలు.
