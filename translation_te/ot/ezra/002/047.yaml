translation:
  language: te
  text: గిద్దేలు వంశస్థులు, గహరు వంశస్థులు, రెయాయా వంశస్థులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగివచ్చిన వారి వంశాల జాబితాలో ఇది వ్యక్తి కుమారులను మాత్రమే కాక అతని కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: גִדֵּל
  choice: గిద్దేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, దాని ధ్వనిరూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: גַחַר
  choice: గహరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి అనుగుణంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: רְאָיָה
  choice: రెయాయా
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న హీబ్రూ రూపానికి దగ్గరగా ‘రెయాయా’ అని లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, తిరిగివచ్చిన వారి కుటుంబాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ప్రతి בְּנֵי పదాన్ని పునరుక్తి చేసి మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, ‘కుమారులు’ వల్ల కలగగల ప్రత్యక్ష సంతానార్థ అపోహను నివారించేందుకు ‘వంశస్థులు’ వాడాం.
