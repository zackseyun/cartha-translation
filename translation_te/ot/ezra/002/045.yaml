lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఈ తిరిగివచ్చిన వారి జాబితాలో ఈ పదం తక్షణ కుమారులను మాత్రమే కాకుండా కుటుంబ లేదా వంశ సమూహ సభ్యులను సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘వంశస్థులు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; మూడుసార్లు వచ్చిన హెబ్రీ నిర్మాణ పునరావృతిని కూడా నిలుపుతుంది.
- source_word: לְבָנָה
  choice: లెబానా
  rationale: హెబ్రీ స్వరరూపానికి దగ్గరగా ఉన్న లిప్యంతరీకరణ; ఇది అనువదించకుండా వ్యక్తి లేదా వంశనామంగా ఉంచబడింది.
- source_word: חֲגָבָה
  choice: హగాబా
  rationale: మసొరేటిక్ స్వరరూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; చివరి ה ఇక్కడ ప్రత్యేక వ్యంజనధ్వనిగా వినిపించదు.
- source_word: עַקּוּב
  choice: అక్కూబు
  rationale: హెబ్రీలోని బలమైన క్క ధ్వనిని, దీర్ఘ ఊ స్వరాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; తెలుగు ఉచ్చారణకు సహజంగా ఉండేందుకు చివర ‘ు’ చేర్చబడింది.
