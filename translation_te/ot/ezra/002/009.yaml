  register: ఆధునిక ప్రామాణిక తెలుగు; తిరిగివచ్చిన కుటుంబాల గణన జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘కుమారులు’ అనే రూపాన్ని యాంత్రికంగా అనుసరించకుండా, జాబితా సందర్భంలోని కుటుంబ/వంశ భావాన్ని సహజంగా వ్యక్తం చేసింది.
