lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: వంశావళి మరియు తిరిగివచ్చిన వారి జాబితా సందర్భంలో ఈ పదం కేవలం ప్రత్యక్ష కుమారులను కాకుండా ఒక కుటుంబానికి లేదా వంశానికి చెందినవారిని సూచించగలదు; అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘వంశస్థులు’ అని అనువదించాం.
- source_word: זַכָּי
  choice: జక్కయి
  rationale: హీబ్రూ పేరులోని వ్యంజనాలను, ముఖ్యంగా ద్విత్వ కఫ్ ధ్వనిని, తెలుగులో సమీపంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 760 మంది
  rationale: హీబ్రూ సంఖ్య ‘ఏడు వందల అరవై’; వ్యక్తుల గణన అని స్పష్టంగా, సంక్షిప్తంగా తెలియజేయడానికి ఆధునిక తెలుగు జాబితా శైలిలో అంకెలతో పాటు ‘మంది’ వాడాం.
