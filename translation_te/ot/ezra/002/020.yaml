translation:
  language: te
  text: గిబ్బారు కుమారులు—తొంభై ఐదుగురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘కుమారులు’; ఈ తిరిగివచ్చినవారి జాబితాలో ఇది కుటుంబం లేదా వంశానికి చెందినవారిని సూచించే సూత్రబద్ధమైన ప్రయోగం. ‘కుమారులు’ మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: גִבָּר
  choice: గిబ్బారు
  rationale: ఇది వ్యక్తి లేదా వంశపూర్వికుని పేరు. మసొరేటిక్ పాఠంలోని గిబ్బార్ రూపాన్ని తెలుగులో సహజంగా పలికేలా ‘గిబ్బారు’గా లిప్యంతరీకరించాం.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: తొంభై ఐదుగురు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తొంభై మరియు ఐదు’. ఆధునిక తెలుగులో సహజ సంఖ్యారూపమైన ‘తొంభై ఐదు’ను వాడి, లెక్కించబడుతున్నవారు మనుషులు కావడంతో ‘గురు’ ప్రత్యయాన్ని చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఎజ్రా వంశావళి/తిరిగివచ్చినవారి జాబితాకు తగిన సంక్షిప్త, గంభీర శైలి. మూలంలోని ‘కుమారులు’ అనే పునరావృత సూత్రాన్ని కాపాడుతూ, సంఖ్యను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందించాం.
