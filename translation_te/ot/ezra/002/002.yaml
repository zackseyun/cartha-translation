source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: te
  text: 'జెరుబ్బాబెలుతో కలిసి వచ్చినవారు: యేషువ, నెహెమ్యా, శెరాయా, రెయేలాయా[a], మొర్దెకై, బిల్షాను, మిస్పారు[b], బిగ్వయి, రెహూము[c], బఅనా. ఇశ్రాయేలు ప్రజల పురుషుల సంఖ్య[d]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: నెహెమ్యా 7:7లోని సమాంతర జాబితాలో ‘రెయేలాయా’కు బదులు ‘రఅమ్యా’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: నెహెమ్యా 7:7లోని సమాంతర జాబితాలో ‘మిస్పారు’కు బదులు ‘మిస్పెరెతు’ అని ఉంది.
    reason: alternative_reading
  - marker: c
    text: నెహెమ్యా 7:7లోని సమాంతర జాబితాలో ‘రెహూము’కు బదులు ‘నెహూము’ అని ఉంది.
    reason: alternative_reading
  - marker: d
    text: ఈ మాట తరువాతి వచనం నుంచి ఇవ్వబడే జనగణన సంఖ్యలను పరిచయం చేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ עִם
  choice: తో కలిసి వచ్చినవారు
  rationale: ముందటి వచనంలోని వ్యక్తులను కొనసాగిస్తూ, వెంట రావడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; בָּאוּ అనే క్రియకు ‘తిరిగి వచ్చినవారు’ అని సందర్భార్థాన్ని అదనంగా చేర్చలేదు.
- source_word: יֵשׁוּעַ
  choice: యేషువ
  rationale: నిర్బంధానంతర కాలంలోని ఈ హీబ్రూ నామరూపాన్ని నేరుగా లిప్యంతరీకరించి, ఇతర ‘యెహోషువ’ వ్యక్తుల నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: רְעֵלָיָה
  choice: రెయేలాయా
  rationale: WLC/మసొరా పాఠంలోని నామరూపాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తుంది; నెహెమ్యా 7:7లోని భిన్న రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: מִסְפָּר
  choice: మిస్పారు
  rationale: ఇక్కడ ఇది ‘సంఖ్య’ అనే సామాన్య నామవాచకం కాదు, వ్యక్తి పేరు; అందువల్ల పేరుగా లిప్యంతరీకరించబడింది.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలలోని పురుషుల సంఖ్య
  rationale: మూలంలోని ‘సంఖ్య,’ ‘పురుషులు,’ ‘ఇశ్రాయేలు ప్రజలు’ అనే అంశాలను నిలుపుతూ, తరువాతి వచనాల్లో వచ్చే జనగణన జాబితాకు సహజమైన తెలుగు పరిచయంగా రూపొందించబడింది.
