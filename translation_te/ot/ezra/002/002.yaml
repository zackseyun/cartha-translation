translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం. మూలంలోని వాక్య కొనసాగింపును, చివరనున్న జాబితా-పరిచయ నిర్మాణాన్ని నిలిపాం.
