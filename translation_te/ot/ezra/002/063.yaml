  to: అప్పుడు పాలకుడు[a] వారితో, ఊరీము తుమ్మీములతో విచారణ చేసే యాజకుడు వచ్చేవరకు వారు అతి పరిశుద్ధమైన అర్పణభాగాలను[b] తినకూడదని చెప్పాడు[c].
  rationale: పాలకుని ఆజ్ఞ, అతి పరిశుద్ధమైన అర్పణభాగాలపై నిషేధం, మరియు ఊరీము తుమ్మీముతో సంబంధమున్న భవిష్యత్ యాజకుని కోసం వేచి ఉండటం అనే మూలభావాలను నిలిపాం. అసహజమైన “ఉన్న యాజకుడు నిలిచే వరకు” స్థానంలో సందర్భానికి, తెలుగుకు సరిపోయే “విచారణ చేసే యాజకుడు వచ్చేవరకు”ని వాడాం. వివరణాత్మక పాదసూచికను సంబంధిత పదబంధం వద్దే గుర్తించాం; ‘నియమింపబడే’ అనే ఆధారరహిత నిర్దిష్టతను తొలగించాం.
