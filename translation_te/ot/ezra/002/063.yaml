id: EZR.2.63
reference: Ezra 2:63
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד כֹּהֵ֖ן לְ/אוּרִ֥ים וּ/לְ/תֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: te
  text: అప్పుడు పాలకుడు[a] వారితో, ఊరీము తుమ్మీములతో విచారణ చేసే యాజకుడు వచ్చేవరకు వారు అతి పరిశుద్ధమైన అర్పణభాగాలను[b] తినకూడదని చెప్పాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో “తిర్షాతా”; ఇది పర్షియా పరిపాలనా బిరుదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యాజకులకు కేటాయించిన అత్యంత పరిశుద్ధమైన అర్పణభాగాలు; “అతి పరిశుద్ధ స్థలం” కాదు.
    reason: cultural_note
  - marker: c
    text: “ఊరీము తుమ్మీములతో విచారణ చేసే యాజకుడు” అనే పదబంధం మూలంలో అక్షరార్థంగా ఊరీము తుమ్మీముల కొరకు నిలబడే యాజకుడని ఉంది. ఊరీము తుమ్మీము యాజకుడు దేవుని నిర్ణయం తెలుసుకోవడానికి ఉపయోగించిన పవిత్ర సాధనాలు; వాటి ఖచ్చితమైన రూపం, విధానం తెలియదు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: అధిపతి
  rationale: ఇది పర్షియా పరిపాలనా బిరుదు. ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా కార్యపదవిని అనువదించాం; మూల బిరుదును పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: వారు ... తినకూడదని
  rationale: అధిపతి చెప్పిన పరోక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధమైన అర్పణలలో నుంచి
  rationale: సందర్భం యాజకులకు కేటాయించిన, తినదగిన అత్యంత పవిత్ర అర్పణభాగాలకు సంబంధించినది; లోపలి పరిశుద్ధ స్థలానికి కాదు. ‘అర్పణలు’ అని చెప్పడం సందర్భార్థాన్ని స్పష్టం చేస్తూనే అత్యున్నత పరిశుద్ధత భావాన్ని కాపాడుతుంది.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: యాజకుడు నిలిచే వరకు
  rationale: עֲמֹד అనే క్రియ యొక్క మౌలిక ‘నిలుచు’ భావాన్ని నిలిపి, భవిష్యత్తులో ఆ నియమం ముగిసే బిందువును సహజంగా తెలియజేస్తుంది. దీని అర్థం ‘ప్రత్యక్షమగు/నియమింపబడును’ కావచ్చనే స్వల్ప అనిశ్చితిని పాదసూచికలో సూచించాం.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: ఊరీము తుమ్మీము ఉన్న
  rationale: ఇవి ప్రత్యేక యాజక సంబంధ సాంకేతిక పదాలు కాబట్టి లిప్యంతరీకరించాం. לְ ను సందర్భానుసారంగా యాజకుని వద్ద అవి ఉండడాన్ని సూచించేలా సహజ తెలుగులో ఇచ్చాం.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים యొక్క సందర్భార్థం
  choice: అతి పరిశుద్ధమైన యాజక అర్పణభాగాలు
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: వివాదాస్పదమైన యాజక వంశావళి మరియు పరిశుద్ధ ఆహారం తినే అర్హత ఈ సందర్భపు అంశాలు. కాబట్టి ఇది స్థలాన్ని కాక తినదగిన పవిత్ర అర్పణభాగాలను సూచిస్తుంది.
- issue: ఊరీము తుమ్మీము స్వభావం
  choice: సాంకేతిక పేర్లుగా లిప్యంతరీకరణ
  alternative: వెలుగులు మరియు సంపూర్ణతలు అని వ్యుత్పత్తి ఆధారంగా అనువదించడం
  rationale: వాటి ఖచ్చితమైన రూపం, వినియోగ విధానం అనిశ్చితం. అర్థానువాదం మూలంలో లేని నిశ్చితత్వాన్ని కలిగించవచ్చు.
- issue: עַד עֲמֹד כֹּהֵן యొక్క భావం
  choice: యాజకుడు నిలిచే వరకు
  alternative: యాజకుడు ప్రత్యక్షమయ్యే వరకు / నియమింపబడే వరకు
  rationale: మూల క్రియ యొక్క రూపక అస్పష్టతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలిపి, ప్రత్యామ్నాయ సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. పరిపాలనా బిరుదును అర్థానువదించి, అరుదైన మూలపదాన్ని పాదసూచికలో ఇచ్చాం. ఆచార సంబంధ సాంకేతిక పేర్లను లిప్యంతరీకరించాం; మూలంలోని భావ అనిశ్చితిని అతిగా పరిష్కరించలేదు.
