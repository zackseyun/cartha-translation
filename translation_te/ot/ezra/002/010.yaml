  rationale: ఈ జనగణన జాబితాలో ఈ నిర్మాణం ఒక కుటుంబం లేదా వంశానికి చెందిన వారిని సూచిస్తుంది. తెలుగులో ‘వంశస్థులు’ అనేది సహజంగా ఉండి, కేవలం ప్రత్యక్ష కుమారులనే సూచిస్తున్నట్టు కలిగే అపార్థాన్ని నివారిస్తుంది.
