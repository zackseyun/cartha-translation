  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: te
  text: యేషూవ మరియు యోవాబు వంశానికి చెందిన పహత్‌-మోయాబు వంశస్థులు—2,812 మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి వంశాల జాబితాలో ఈ పదం కుటుంబం లేదా వంశ సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פַחַת מוֹאָב
  choice: పహత్‌-మోయాబు
  rationale: ఇది వ్యక్తి లేదా వంశానికి సంబంధించిన సంయుక్త నామం; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: לִבְנֵי
  choice: వంశస్థులకు చెందినవారు
  rationale: లామెద్ ఉపసర్గతో కూడిన ఈ నిర్మాణం పహత్‌-మోయాబు వంశాన్ని యేషూవ, యోవాబు శాఖలతో అనుసంధానిస్తుంది. తెలుగులో సంబంధాన్ని స్పష్టంగా చూపేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: నిర్వాసానంతర కాలపు ఈ పేరును హీబ్రూ సంక్షిప్త రూపానికి దగ్గరగా లిప్యంతరీకరించి, యెహోషువ అనే దీర్ఘ రూపంతో అనవసర సమీకరణం చేయలేదు.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812 మంది
  rationale: హీబ్రూ సంఖ్యకు ఖచ్చితమైన విలువ. జనగణన తరహా జాబితాలో అంకెలు చదవడానికి సులభం; ‘మంది’ మనుషుల సంఖ్య అని తెలుగులో సహజంగా తెలియజేస్తుంది.
