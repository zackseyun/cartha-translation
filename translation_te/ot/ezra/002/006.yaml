translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైన గౌరవప్రద భాష వాడబడింది. ‘కుమారులు’ అనే అక్షరార్థ రూపం కంటే తరతరాల కుటుంబ సమూహాన్ని స్పష్టంగా తెలిపే ‘వంశస్థులు’ ఎంచుకోబడింది. హీబ్రూ వాక్యనిర్మాణంలోని వంశ-ఉపశాఖ సంబంధాన్ని డాష్‌లతో చదవదగిన రీతిలో నిలిపాం.
