  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను మరియు హీబ్రూ పునరుక్త నిర్మాణాన్ని నిలిపాం. పేర్లకు తెలుగు పఠనంలో సహజంగా ఉండే అంత్య అచ్చులను ఉపయోగించాం.
