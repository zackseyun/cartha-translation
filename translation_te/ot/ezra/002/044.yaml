translation:
  language: te
  text: కేరోసు కుమారులు[a], సీయహా కుమారులు, పాదోను కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళి జాబితాల్లో “కుమారులు” అనే మాట తక్షణ పురుష సంతానాన్నే కాకుండా, వంశస్థులను లేదా ఒక కుటుంబ వంశానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఎజ్రాలోని వంశ/కుటుంబ జాబితాలో ఇది ఒక పేరుగల కుటుంబ వంశానికి చెందినవారిని సూచించే స్థిరమైన సూత్రప్రయోగం. ‘కుమారులు’ హీబ్రూ నిర్మాణాన్ని నిలుపుతూ, సందర్భంలో ‘వంశస్థులు’ అనే విస్తృత అర్థాన్నీ అనుమతిస్తుంది; ఆ విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: קֵרֹס
  choice: కేరోసు
  rationale: ఇది వ్యక్తి లేదా కుటుంబ వంశపు పేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: סִיעֲהָא
  choice: సీయహా
  rationale: మసొరేటిక్ పాఠంలోని స్వరరూపాన్ని అనుసరించి పేరును తెలుగు ఉచ్చారణకు సహజంగా లిప్యంతరీకరించాం. సమాంతర సంప్రదాయాల్లోని సంక్షిప్త రూపాన్ని ఇక్కడ స్వీకరించలేదు.
- source_word: פָדוֹן
  choice: పాదోను
  rationale: హీబ్రూ స్వరరూపానికి దగ్గరగా ఉండేలా ఈ వ్యక్తి/కుటుంబ పేరును తెలుగు లిపిలో ప్రతిబింబించాం.
