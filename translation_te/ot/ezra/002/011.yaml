  text: బేబై వంశస్థులు—ఆరువందల ఇరవై ముగ్గురు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఇది తిరిగివచ్చినవారి వంశ/కుటుంబ జాబితా కాబట్టి, హెబ్రీ బహువచన నిర్మాణం కేవలం ప్రత్యక్ష కుమారులనే కాక బేబై కుటుంబానికి చెందిన వారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בֵבָי
  choice: బేబై
  rationale: వ్యక్తి లేదా కుటుంబనామాన్ని హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וּשְׁלֹשָׁה
  choice: ఆరువందల ఇరవై ముగ్గురు
  rationale: హెబ్రీ సంఖ్య 623ను యథాతథంగా ఉంచి, వ్యక్తులను లెక్కిస్తున్నందున తెలుగులో సహజమైన ‘ముగ్గురు’ రూపాన్ని వాడాం.
