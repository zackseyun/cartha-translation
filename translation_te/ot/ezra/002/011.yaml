translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని కుటుంబ-వంశ భావాన్ని స్పష్టంగా అందిస్తుంది.
