  source_fidelity: హీబ్రూ כָּל రెండు వర్గాల సమష్టిని సూచించడాన్ని ‘మొత్తం’ సరిగ్గా ప్రతిబింబిస్తుంది. הַנְּתִינִיםను ‘దేవాలయ సేవకులు’గా, וּבְנֵי עַבְדֵי שְׁלֹמֹהను ‘సొలొమోను సేవకుల కుమారులు’గా అనువదించడం మూలంలోని స్థిరమైన వర్గపేరును, సంబంధాన్ని నిలుపుతుంది. సంఖ్య మూడు వందల తొంభై ఇద్దరు (392) ఖచ్చితంగా ఉంది.
