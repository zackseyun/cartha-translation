  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: te
  text: దేవాలయ సేవకులూ, సొలొమోను సేవకుల కుమారులూ—మొత్తం మూడు వందల తొంభై ఇద్దరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో నెతీనీమ్; దేవాలయ సేవకు నియమించబడిన ఒక వర్గాన్ని సూచించే సాంకేతిక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: మొత్తం
  rationale: రెండు వర్గాల కలిపిన పూర్తి సంఖ్యను పరిచయం చేస్తున్నందున, తెలుగులో సహజంగా ‘మొత్తం’ అని అనువదించాం.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: ఇది దేవాలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గాన్ని సూచించే సాంకేతిక పదం. లిప్యంతరీకరణకన్నా వారి విధిని స్పష్టంగా తెలిపే ఈ రూపం ఆధునిక పాఠకులకు అర్థవంతంగా ఉంటుంది.
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: మూలంలోని ‘కుమారులు’ అనే వంశ/వర్గ సూచనను నిలుపుతూ, గుర్తించబడిన సమూహపేరుగా అనువదించాం.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: ఈ పరిపాలనా వంశావళి సందర్భంలో సంప్రదాయంగా గుర్తించబడిన వర్గాన్ని సూచిస్తోంది; ‘దాసులు’ అనే ప్రత్యామ్నాయంలోని బంధితత్వ భావం ఇక్కడ ముందుకు తేవబడలేదు.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: మూడు వందల తొంభై ఇద్దరు
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో సహజమైన సంఖ్యారూపంతో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘కుమారులు’ ద్వారా మూలంలోని వర్గ/వంశపరమైన రూపాన్ని నిలిపాం; విరామచిహ్నంతో రెండు వర్గాల కలిపిన మొత్తాన్ని స్పష్టం చేశాం.
