    text: హీబ్రూలో ప్రతిసారీ అక్షరార్థంగా ‘కుమారులు’ అని ఉంది; అయితే ఈ జాబితా సూత్రంలో అది ఒక కుటుంబం లేదా వంశ పరంపరకు చెందినవారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: తిరిగి వచ్చినవారి ఈ జాబితాలో ఈ పదం సాధారణంగా ఒక కుటుంబ లేదా వంశ పరంపరకు చెందినవారిని సూచిస్తుంది; కేవలం ప్రత్యక్ష కుమారులను మాత్రమే కాదు. అందువల్ల ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, సందర్భానికి తగినట్లుగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: בַצְלוּת
  choice: బత్స్లూతు
  rationale: హీబ్రూ హల్లులైన బేత్–త్సాదే–లామెద్–తావ్‌ను అనుసరించి అనువదించకుండా లిప్యంతరీకరించిన వ్యక్తి లేదా వంశనామం.
- source_word: מְחִידָא
  choice: మెహీదా
  rationale: పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా మరియు తెలుగు పాఠకులకు చదవడానికి సహజంగా లిప్యంతరీకరించబడింది.
- source_word: חַרְשָׁא
  choice: హర్షా
  rationale: చివరి అలెఫ్‌ను ప్రత్యేకంగా సూచించకుండా, హీబ్రూ పేరును సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
