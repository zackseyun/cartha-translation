  register: ఆధునిక ప్రామాణిక తెలుగులో, జనగణన/ఆస్తుల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని స్వామ్య సూచనను రెండు నామవాచకాల దగ్గర స్పష్టంగా నిలిపాం.
