lexical_decisions:
- source_word: גְּמַלֵּיהֶם
  choice: వారి ఒంటెలు
  rationale: גמל అనే నామవాచకపు బహువచన రూపానికి మూడవ పురుష బహువచన స్వామ్య ప్రత్యయం ఉంది; అందువల్ల ‘వారి ఒంటెలు’ అని సహజంగా అనువదించబడింది.
- source_word: אַרְבַּע מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: '435'
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 435ను సూచిస్తుంది. జాబితా సందర్భంలో స్పష్టత, సులభ పఠనం కోసం అంకెలలో ఇచ్చాం.
- source_word: חֲמֹרִים
  choice: గాడిదలు
  rationale: חמורకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, నేరమైన సమానార్థకం ‘గాడిద’.
- source_word: שֵׁשֶׁת אֲלָפִים שְׁבַע מֵאוֹת וְעֶשְׂרִים
  choice: 6,720
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 6,720ను సూచిస్తుంది. జాబితా శైలికి అనుగుణంగా అంకెలలో ఇచ్చాం.
