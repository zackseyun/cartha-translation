lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి/తిరిగివచ్చినవారి జాబితా సందర్భంలో ఈ నిర్మాణ రూపం ఒక కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. మూలంలోని రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండేందుకు ‘కుమారులు’ అని అనువదించబడింది.
- source_word: עַזְגָּד
  choice: అజ్గాదు
  rationale: ఇది వ్యక్తి లేదా కుటుంబానికి చెందిన స్వనామం; అర్థానువాదం చేయకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేయబడింది.
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: 1,222 మంది
  rationale: హీబ్రూ సంఖ్యా పదబంధం మొత్తం 1,222ను సూచిస్తుంది. జనగణన తరహా జాబితాలో సులభంగా చదవడానికి అంకెలను వాడి, లెక్కించబడినవారు మనుషులని తెలుగులో సహజంగా తెలియజేయడానికి ‘మంది’ చేర్చబడింది.
