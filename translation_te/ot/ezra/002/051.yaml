lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదం యొక్క బహువచన సమాసరూపం. వంశావళి/జాబితా సందర్భంలో ప్రామాణికంగా, మూలానికి సన్నిహితంగా ‘కుమారులు’ అని అనువదించాం; ఇక్కడ ఇది ప్రత్యక్ష కుమారులనే కాక వంశస్థులు లేదా కుటుంబవర్గ సభ్యులను కూడా సూచించవచ్చు.
- source_word: בַקְבּוּק
  choice: బక్బూకు
  rationale: వ్యక్తి లేదా కుటుంబనామం; హీబ్రూ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חֲקוּפָא
  choice: హకూఫా
  rationale: వ్యక్తి లేదా కుటుంబనామం; హీబ్రూ హటేఫ్-పతహ్ మరియు దీర్ఘ చివరి స్వరాన్ని ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חַרְחוּר
  choice: హర్హూరు
  rationale: వ్యక్తి లేదా కుటుంబనామం; హీబ్రూ రూపాన్ని తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
