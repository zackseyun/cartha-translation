lexical_decisions:
- source_word: בְּנֵי
  choice: వారి సంతతి
  rationale: తిరిగి వచ్చినవారి జాబితాలో ఈ పదం ఆయా పట్టణాలతో సంబంధమున్న ప్రజలను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా, వంశ లేదా సమూహ భావాన్ని నిలుపుతూ ‘వారి సంతతి’ అని అనువదించాం.
- source_word: קִרְיַת עָרִים
  choice: కిర్యత్-ఆరీము
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: כְּפִירָה
  choice: కెఫీరా
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּבְאֵרוֹת
  choice: బెయేరోతు
  rationale: సంయోజకార్థం జాబితా నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది; స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: שְׁבַע מֵאוֹת וְאַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 మంది
  rationale: జనగణన తరహా జాబితాలో సులభంగా చదవడానికి సంఖ్యను అంకెల్లో ఇచ్చాం; వ్యక్తుల సంఖ్య అని స్పష్టపడేందుకు ‘మంది’ చేర్చాం.
