  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని వాడాం. స్థలనామాలను అనువదించకుండా హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; సాధారణ పాఠకులకు సంఖ్య స్పష్టంగా ఉండేలా ‘మంది’ వాడాం.
