translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘కుమారులు’ అనే పదం ఇక్కడ వంశస్థులను సూచించే జాబితా ప్రయోగంగా నిలుపబడింది.
