  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: te
  text: 'యాజకుల కుమారులలోనుండి: హొబాయా కుమారులు, హక్కోజు కుమారులు, గిలాదీయుడైన బర్జిల్లయి కుమార్తెలలో ఒకరిని భార్యగా తీసుకొని వారి పేరు మీద పిలువబడ్డ బర్జిల్లయి కుమారులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “వారి పేరును స్వీకరించాడు.” హెబ్రీలో అక్షరార్థంగా, “వారి పేరు మీద పిలువబడ్డాడు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: యాజకుల కుమారులలో
  rationale: מִן ఇచ్చే సమూహంలోని కొందరు అనే భావాన్ని ‘లో’తో తెలియజేశాం. వంశావళి జాబితా శైలిని నిలుపుకోవడానికి בְּנֵיని ‘కుమారులు’గా అనువదించాం.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: హోబాయా కుమారులు ... హక్కోజు కుమారులు ... బర్జిల్లయి కుమారులు
  rationale: మూలంలోని పునరుక్త నిర్మాణాన్ని, వంశావళి ధోరణిని నిలిపాం; వ్యక్తినామాలను తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: కుమార్తెలలో ఒకరిని వివాహం చేసుకొని
  rationale: לקח ... אשה అనే హెబ్రీయ నుడికారానికి సహజమైన ఆధునిక తెలుగు ‘వివాహం చేసుకొని’; מִבְּנוֹתలోని విభాజక భావాన్ని ‘కుమార్తెలలో ఒకరిని’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: గిలాదీయుడైన బర్జిల్లయి
  rationale: הַגִּלְעָדִי అనే ప్రాంతసంబంధ విశేషణాన్ని సహజమైన తెలుగులో ‘గిలాదీయుడు’గా ఇచ్చాం.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: వారి పేరుతో పిలువబడ్డాడు
  rationale: నిఫల్ క్రియలోని కర్మణి భావాన్ని, బహువచన ప్రత్యయాన్ని మూలానికి దగ్గరగా నిలిపాం; పేరు స్వీకరించే సామాజిక విధానాన్ని అదనంగా నిర్ధారించలేదు.
