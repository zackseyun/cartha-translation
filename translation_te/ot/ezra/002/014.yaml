translation:
  language: te
  text: 'బిగ్వయి వంశస్థులు: రెండు వేల యాభై ఆరుగురు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: వంశస్థులు
  rationale: ఎజ్రా 2లోని వంశ/కుటుంబ జాబితా సందర్భంలో ఇది ప్రత్యక్ష కుమారులను మాత్రమే కాక, ఒక పూర్వికునికి చెందిన వంశసమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశస్థులు’ సహజంగా, స్పష్టంగా ఆ అర్థాన్ని తెలియజేస్తుంది.
- source_word: בִגְוָי
  choice: బిగ్వయి
  rationale: ఇది వ్యక్తి లేదా వంశనామం; అనువదించకుండా తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: אַלְפַּיִם
  choice: రెండు వేల
  rationale: ‘రెండు వేల’ అనే సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యారూపంలో ఇచ్చాం.
- source_word: חֲמִשִּׁים
  choice: యాభై
  rationale: ‘యాభై’ అనే మూల సంఖ్యార్థాన్ని తదుపరి సంఖ్యతో కలిపి తెలుగులో సహజంగా అందించాం.
- source_word: וְשִׁשָּׁה
  choice: ఆరు
  rationale: హీబ్రూ సంయోజక నిర్మాణంలోని ‘మరియు ఆరు’ను, తెలుగు లెక్కింపు శైలికి అనుగుణంగా ‘యాభై ఆరు’ అనే సమగ్ర సంఖ్యలో ఇచ్చాం.
