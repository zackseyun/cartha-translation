id: EZR.1.8
reference: Ezra 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: te
  text: పారసీక రాజు కోరెషు వాటిని కోశాధికారి మిత్రెదాతు చేత[a] బయటికి తెప్పించి, యూదా అధిపతి షేష్బస్సరుకు[b] లెక్కపెట్టి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కోశాధికారి మిత్రెదాతు ద్వారా.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘మిత్రెదాతు చేత’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యూదా నాయకుడు’ లేదా ‘యూదా పాలకుడు.’ హీబ్రూ పదం సాధారణంగా ప్రధానుడిని లేదా పాలకుడిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: వాటిని బయటికి తెప్పించి
  rationale: హిఫీల్ రూపం ‘బయటికి తీసుకురావడం/తెప్పించడం’ అనే కారణార్థాన్ని ఇస్తుంది. సందర్భంలో ఇవి ముందటి వచనంలోని ఆలయ పాత్రలు; మనుషులు కాదు.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజైన కోరెషు
  rationale: రాజు, రాజ్యాన్ని తెలుగులో సహజంగా గుర్తిస్తూ మూలంలోని పూర్తి బిరుదును నిలుపుతుంది.
- source_word: עַל יַד
  choice: మిత్రెదాతు చేత
  rationale: మూల జాతీయ ప్రయోగం అక్షరార్థంగా ‘చేతి ద్వారా’; ఇక్కడ కార్యనిర్వాహకత్వం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. తెలుగు ‘చేత’ దాని రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִתְרְדָת
  choice: మిత్రెదాతు
  rationale: పర్షియన్ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: הַגִּזְבָּר
  choice: కోశాధికారి
  rationale: ధనాగారం లేదా కోశానికి సంబంధించిన అధికారిని సూచిస్తుంది; పాత్రల నిర్వహణ సందర్భానికి సరిపోతుంది.
- source_word: וַיִּסְפְּרֵם
  choice: లెక్కపెట్టి అప్పగించాడు
  rationale: క్రియ ప్రాథమికంగా ‘వాటిని లెక్కించాడు’ అని అర్థం. לְతో వచ్చిన గ్రహీత సందర్భంలో లెక్కించి అతనికి అందించిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; లెక్కింపు స్పష్టంగా నిలిచింది.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: షేష్బస్సరుకు
  rationale: వ్యక్తినామాన్ని అనువదించకుండా లిప్యంతరీకరించి, לְ సూచించే గ్రహీతను ‘-కు’తో తెలిపింది.
- source_word: הַנָּשִׂיא
  choice: అధిపతి
  rationale: నాయకుడు, ప్రధానుడు, పాలకుడు వంటి విస్తృత అధికారార్థం గల పదం. వచనంలో లేని నిర్దిష్ట పర్షియన్ పరిపాలనా బిరుదైన ‘గవర్నరు’ను రుద్దకుండా ఉంటుంది.
- source_word: לִיהוּדָה
  choice: యూదా అధిపతి
  rationale: షేష్బస్సరుకు యూదాతో ఉన్న అధికార సంబంధాన్ని సహజ తెలుగు సమాసంతో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వాటిని’ అనే సర్వనామం ముందటి వచనంలోని ఆలయ పాత్రలను సూచిస్తుంది. మూలంలోని కార్యనిర్వాహక జాతీయ ప్రయోగం మరియు נָשִׂיא పదంలోని విస్తృతార్థం పాదసూచికల్లో సంరక్షించబడ్డాయి.
