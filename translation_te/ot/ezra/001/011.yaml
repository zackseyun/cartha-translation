source:
  edition: WLC
  text: כָּל כֵּלִים֙ לַ/זָּהָ֣ב וְ/לַ/כֶּ֔סֶף חֲמֵ֥שֶׁת אֲלָפִ֖ים וְ/אַרְבַּ֣ע מֵא֑וֹת הַ/כֹּ֞ל הֶעֱלָ֣ה שֵׁשְׁבַּצַּ֗ר עִ֚ם הֵעָל֣וֹת הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל לִ/ירוּשָׁלִָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: te
  text: బంగారు, వెండి వస్తువులన్నీ[a] కలిపి ఐదువేల నాలుగువందలు. ప్రవాసులను[b] బబులోను నుండి యెరూషలేముకు పైకి తీసుకువచ్చినప్పుడు, షేష్బజ్జరు వాటన్నిటినీ పైకి తీసుకొచ్చాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాత్రలన్నీ” లేదా “సామగ్రి అంతా.” హీబ్రూ పదం పాత్రలు, పనిముట్లు, సామగ్రి వంటి ఆలయ వస్తువులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ప్రవాస సమాజాన్ని.” హీబ్రూ పదం ప్రవాసంలో ఉన్న ప్రజాసమూహాన్ని లేదా ప్రవాస స్థితిని సూచించగలదు; ఇక్కడ ప్రజలే ఉద్దేశం.
    reason: lexical_alternative
  - marker: c
    text: ఈ వచనంలో హీబ్రూ మూలం “పైకి తీసుకురావడం” అనే క్రియను రెండుసార్లు ఉపయోగిస్తుంది. యెరూషలేముకు వెళ్లడాన్ని “పైకి వెళ్లడం”గా చెప్పే సంప్రదాయ వాడుక ఇది.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: వస్తువులన్నీ
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, సామగ్రి లేదా ఇతర వస్తువులను సూచించగల విస్తృత పదం. ఆలయ ఖజానా సందర్భంలో ‘వస్తువులు’ సహజంగా ఉండి, జాబితాలోని అన్నిరకాల ఆలయ సామగ్రినీ చేర్చగలదు.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: బంగారు, వెండి
  rationale: ఇక్కడ ל ఉపసర్గ వస్తువులను వాటి పదార్థం ప్రకారం వర్గీకరిస్తుంది. ‘బంగారు, వెండి వస్తువులు’ ఆధునిక తెలుగులో సహజమైన, సంక్షిప్తమైన రూపం.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: ఐదువేల నాలుగువందలు
  rationale: మూలంలోని సంఖ్యను గద్య పఠనానికి అనుకూలంగా అక్షరాల్లో ఇచ్చాం.
- source_word: הַכֹּל
  choice: అన్నీ కలిపి / వాటన్నిటినీ
  rationale: మొదటి వాక్యంలో ఇది మొత్తం సంఖ్యను సూచిస్తుంది; తరువాత క్రియతో సంబంధంలో సమస్త వస్తువులను సూచించే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הֶעֱלָה / הֵעָלוֹת
  choice: పైకి తీసుకొచ్చాడు / పైకి తీసుకువచ్చినప్పుడు
  rationale: עלה హిఫీల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే భావాన్ని రెండుచోట్లా నిలిపాం. ఇది యెరూషలేముకు వెళ్లడాన్ని ‘పైకి వెళ్లడం’గా చెప్పే మూలభాషా వాడుకను ప్రతిబింబిస్తుంది.
- source_word: שֵׁשְׁבַּצַּר
  choice: షేష్బజ్జరు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַגּוֹלָה
  choice: ప్రవాసులు
  rationale: ఈ సందర్భంలో ఈ పదం ప్రవాస స్థితికన్నా బబులోను నుండి తిరిగివస్తున్న ప్రజాసమూహాన్ని సూచిస్తుంది. ‘ప్రవాసులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: బబులోను నుండి యెరూషలేముకు
  rationale: స్థలనామాలను సంప్రదాయ తెలుగు రూపాల్లో ఇచ్చి, ప్రయాణ దిశను నేరుగా అనువదించాం.
theological_decisions:
- issue: యెరూషలేముకు వెళ్లడంలో עלה ఆరోహణ భాష
  choice: ‘పైకి తీసుకురావడం’ అనే భావాన్ని రెండుసార్లూ నిలిపివేయడం
  alternative: కేవలం ‘తీసుకురావడం’ లేదా ‘వెంట తీసుకురావడం’
  rationale: మూలంలో עלה రెండుసార్లు రావడం యెరూషలేముకు ప్రయాణాన్ని ‘పైకి’ వెళ్లడంగా చెప్పే భౌగోళిక, సాహిత్య వాడుకను ప్రతిబింబిస్తుంది. దీనిని నిలిపివేయడం అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: הַגּוֹלָה పదం సూచించేది
  choice: ప్రవాసంలో ఉన్న ప్రజలు—‘ప్రవాసులు’
  alternative: ‘ప్రవాసం’, ‘ప్రవాస సమాజం’, లేదా ‘చెరలోనివారు’
  rationale: ఇక్కడ బబులోను నుండి తిరిగి తీసుకురాబడుతున్న ప్రజలే ఉద్దేశం. అయితే సమూహార్థక నామవాచక ఛాయను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన గద్యాన్ని ఉపయోగించాం. ‘వస్తువులు’ విస్తృతమైన సాధారణ పదంగా ఎంచుకోగా, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం. మూలంలోని పునరుక్త ఆరోహణ భాష కొంత అసాధారణంగా అనిపించినా ఉద్దేశపూర్వకంగా నిలిపాం.
