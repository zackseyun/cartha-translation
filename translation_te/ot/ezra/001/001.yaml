  revised_text: 'పారసీక రాజైన కోరెషు పరిపాలన మొదటి సంవత్సరంలో, యిర్మీయా నోటి ద్వారా వచ్చిన[a] యాహ్వే మాట నెరవేరేలా[b], యాహ్వే పారసీక రాజైన కోరెషు ఆత్మను ప్రేరేపించాడు. అప్పుడు కోరెషు తన రాజ్యమంతటా ఒక ప్రకటన చేయించి[c], దానిని లిఖితపూర్వకంగాను జారీ చేసి, ఇలా అన్నాడు:'
