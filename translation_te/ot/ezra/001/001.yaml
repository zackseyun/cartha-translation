id: EZR.1.1
reference: Ezra 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: te
  text: 'పారసీక రాజైన కోరెషు పరిపాలన మొదటి సంవత్సరంలో, యిర్మీయా నోటి ద్వారా వచ్చిన[a] యాహ్వే మాట నెరవేరేలా[b], యాహ్వే పారసీక రాజైన కోరెషు ఆత్మను ప్రేరేపించాడు. అప్పుడు కోరెషు తన రాజ్యమంతటా ఒక ప్రకటన చేయించి[c], దానిని లిఖితపూర్వకంగాను జారీ చేసి, ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యిర్మీయా నోటి నుండి.’ యాహ్వే తన మాటను యిర్మీయా ద్వారా పలికించాడని ఈ హీబ్రూ నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘యాహ్వే మాట పూర్తికావడానికి.’ ఇక్కడ ప్రవచన వాక్యం సాకారం కావడాన్ని సందర్భం సూచిస్తున్నందున ప్రధాన పాఠంలో ‘నెరవేరేలా’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఒక ప్రకటనను వెళ్లేలా చేశాడు.’ అధికారిక సందేశాన్ని బహిరంగంగా రాజ్యమంతటా వ్యాప్తి చేయించడాన్ని ఈ హీబ్రూ నుడికారం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: పరిపాలన మొదటి సంవత్సరంలో
  rationale: రాజు పాలన ఆధారంగా కాలాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది. ప్రారంభ וְ ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగులో అసహజం.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజైన కోరెషు
  rationale: రాజు పేరు, బిరుదు రెండింటినీ సహజ తెలుగు పదక్రమంలో ఉంచుతుంది.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: యాహ్వే మాట నెరవేరేలా
  rationale: లִכְלוֹת లోని ‘పూర్తికి తీసుకురావడం’ అనే భావాన్ని, ప్రవచన వాక్యం చరిత్రలో సాకారం కావడాన్ని సూచించే సహజ తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: מִפִּי יִרְמְיָה
  choice: యిర్మీయా నోటి ద్వారా పలికిన
  rationale: ‘యిర్మీయా నోటి నుండి’ అనే మూలరూపాన్ని సమీపంగా నిలుపుతూ, యిర్మీయా మానవ ప్రవక్తగా వాక్యాన్ని పలికాడనే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: הֵעִיר אֶת רוּחַ כֹּרֶשׁ
  choice: కోరెషు ఆత్మను ప్రేరేపించాడు
  rationale: దేవుని చొరవను తెలియజేస్తూ, רוּחַ కు ఉన్న ఆత్మ, అంతరంగ వైఖరి, ప్రేరణ వంటి విస్తృత భావాన్ని ‘ఆత్మ’ నిలుపుతుంది.
- source_word: וַיַּעֲבֶר קוֹל
  choice: ఒక ప్రకటన చేయించి
  rationale: అధికారిక ప్రకటనను రాజ్యమంతటా వ్యాప్తి చేయించడం అనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: తన రాజ్యమంతటా
  rationale: ప్రకటన మొత్తం రాజ్యంలో వ్యాపించిందనే పరిధిని స్పష్టంగా అందిస్తుంది.
- source_word: וְגַם בְּמִכְתָּב
  choice: దాన్ని లిఖితపూర్వకంగా కూడా జారీ చేస్తూ
  rationale: మౌఖికంగా ప్రచారం చేయించడంతో పాటు అధికారికంగా రాతలోనూ ఇచ్చాడనే అదనపు అంశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి ప్రత్యక్ష ఉక్తిని పరిచయం చేసే సాధారణ హీబ్రూ సూత్రానికి సహజ తెలుగు రూపం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- issue: לִכְלוֹת דְּבַר יְהוָה లో నెరవేర్పు భావం
  choice: యాహ్వే మాట నెరవేరేలా
  alternative: యాహ్వే మాట పూర్తికావడానికి
  rationale: ఈ సందర్భం ప్రవచన వాక్యం చారిత్రకంగా సాకారం కావడాన్ని సూచిస్తుంది. ‘నెరవేరేలా’ ఆ సంబంధాన్ని తెలియజేస్తుంది; అయితే మూలంలోని ‘పూర్తి చేయడం’ భావాన్ని పాదటిప్పణి గుర్తిస్తుంది.
- issue: רוּחַ כֹּרֶשׁ అర్థపరిధి
  choice: కోరెషు ఆత్మను
  alternative: కోరెషు మనస్సును / కోరెషు అంతరంగాన్ని
  rationale: ‘ఆత్మ’ మూలపదంలోని ఉద్దేశం, వైఖరి, అంతరంగ ప్రేరణల మధ్య ఉన్న భావవిస్తృతిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి చదవడానికి సులభం చేశాం; ఉద్దేశం, కార్యాల క్రమం మారలేదు. ‘పారసీక’, ‘లిఖితపూర్వకంగా’, ‘ప్రేరేపించాడు’ వంటి పదాలు గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
