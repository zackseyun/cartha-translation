    rationale: వావ్-క్రమంలో ఉన్న ‘ప్రకటనను వ్యాపింపజేశాడు; వ్రాతలోను [చేశాడు], ఇలా చెప్పుతూ’ అనే చర్యలను తెలుగు కొనసాగుతున్న క్రియగా కాక, పూర్తయిన వరుస చర్యలుగా చెప్పడం సహజం మరియు మూలానికి సమీపం.
