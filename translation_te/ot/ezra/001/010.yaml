source:
  edition: WLC
  text: כְּפוֹרֵ֤י זָהָב֙ שְׁלֹשִׁ֔ים כְּפ֤וֹרֵי כֶ֨סֶף֙ מִשְׁנִ֔ים אַרְבַּ֥ע מֵא֖וֹת וַ/עֲשָׂרָ֑ה כֵּלִ֥ים אֲחֵרִ֖ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/010.yaml
  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: te
  text: బంగారు గిన్నెలు 30; రెండవ రకానికి చెందిన వెండి గిన్నెలు[a] 410; ఇతర పాత్రలు 1,000.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “వెండి గిన్నెలు, రెట్టింపు: 410.” ఇక్కడ “రెండవ రకానికి చెందిన” అని అనువదించిన హీబ్రూ పదం ఈ సామగ్రి జాబితా సందర్భంలో అనిశ్చితంగా ఉంది; అది రెండవ తరగతిని, జత ప్రతులను లేదా రెట్టింపు రూపాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: గిన్నెలు
  rationale: ఈ నామవాచకం ఒక రకమైన పాత్రను సూచిస్తుంది. ఆలయ సామగ్రి జాబితాలో ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం ‘గిన్నెలు’.
- source_word: זָהָב
  choice: బంగారు
  rationale: పాత్రలు ఏ పదార్థంతో చేసినవో తెలిపే సాధారణ విశేషణ రూపం.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: సామగ్రి లెక్కల జాబితాలో స్పష్టత కోసం అంకెలతో ఇచ్చాం.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: వెండి గిన్నెలు
  rationale: ముందటి పాత్రపదాన్ని ఒకే విధంగా అనువదిస్తూ, వాటి పదార్థాన్ని ‘వెండి’ అని తెలిపాం.
- source_word: מִשְׁנִים
  choice: రెండవ రకానికి చెందిన
  rationale: ఈ జాబితా సందర్భంలో పదార్థం అనిశ్చితం. ఇది రెండవ తరగతిని, జత ప్రతులను లేదా రెట్టింపు రూపాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో భేదాన్ని మాత్రమే సూచించే మితమైన అనువాదాన్ని ఎంచుకున్నాం.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: లెక్కల జాబితాలో సులభంగా చదవడానికి అంకెలతో ఇచ్చాం.
- source_word: כֵּלִים
  choice: పాత్రలు
  rationale: ఇది వస్తువులు లేదా ఉపకరణాలకు సంబంధించిన విస్తృత పదం; ఇక్కడ ఆలయ సామగ్రి సందర్భంలో ‘పాత్రలు’ సహజంగా సరిపోతుంది.
- source_word: אֲחֵרִים
  choice: ఇతర
  rationale: ముందుగా పేర్కొన్న వస్తువుల నుంచి వీటిని వేరుచేసే ప్రత్యక్ష విశేషణం.
- source_word: אָלֶף
  choice: 1,000
  rationale: జాబితాలోని మిగతా సంఖ్యలతో ఏకరీతిగా అంకెలతో ఇచ్చాం.
