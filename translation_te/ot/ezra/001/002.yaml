id: EZR.1.2
reference: Ezra 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: te
  text: 'పారసీక రాజు కోరెషు ఇలా ప్రకటిస్తున్నాడు: “ఆకాశపు దేవుడైన యహోవా భూమిమీద ఉన్న రాజ్యాలన్నిటినీ నాకు ఇచ్చాడు. యూదాలో ఉన్న యెరూషలేములో తన కోసం ఒక గృహం కట్టమని ఆయన నన్ను నియమించాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కోసం ఒక గృహం కట్టమని ఆయన నన్ను ఆజ్ఞాపించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: రాజాజ్ఞ ప్రకటన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వర్తమాన ప్రకటనగా నిలుపుతుంది.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజు కోరెషు
  rationale: రాజు పదవిని, వ్యక్తి పేరును తెలుగులో సహజమైన క్రమంలో ఇస్తుంది; కోరెషు అనే రూపం హెబ్రీ పేరుకు సమీపంగా ఉంటుంది.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: భూమిమీద ఉన్న రాజ్యాలన్నిటినీ
  rationale: మמְלָכוֹת అనే బహువచనాన్ని నిలుపుతూ, సామ్రాజ్య ప్రకటనలో הָאָרֶץకు ఉన్న విస్తృతమైన ‘భూమి’ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נָתַן לִי
  choice: నాకు ఇచ్చాడు
  rationale: గతంలో జరిగిన దానం వల్ల ప్రస్తుతం తనకు అధికారం ఉందనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగు సాధారణ భూతకాలం సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: ఆకాశ దేవుడు
  rationale: ఎజ్రాలో కనిపించే దైవబిరుదును సహజమైన తెలుగు ఏకవచన ప్రయోగంతో అందిస్తుంది.
- source_word: פָקַד עָלַי
  choice: నాకు అప్పగించిన బాధ్యత
  rationale: ఈ సందర్భంలో బాధ్యతతో కూడిన నియామకం లేదా ఆదేశం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ఆజ్ఞాపించాడు’ అనే బలమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ఆయన కోసం ఒక గృహం కట్టడం
  rationale: בַיִת యొక్క ప్రాథమిక అర్థమైన ‘గృహం’ను ప్రధాన పాఠ్యంలో ఉంచి, అది దేవాలయాన్ని సూచిస్తుందని పాదసూచికలో వివరిస్తుంది.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: యూదాలో ఉన్న యెరూషలేములో
  rationale: హెబ్రీ సంబంధవాక్యంలోని భౌగోళిక నిర్దేశాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుతో మార్చకుండా లిప్యంతరీకరించడం మూలభాషా ఆధారాన్ని కాపాడుతుంది.
- issue: בַיִתను ‘గృహం’గా ఉంచాలా, ‘దేవాలయం’గా వివరణాత్మకంగా అనువదించాలా
  choice: గృహం
  alternative: దేవాలయం
  rationale: మూలపదపు ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలోని దేవాలయ భావాన్ని పాదసూచికలో స్పష్టం చేయడం అనవసరమైన వ్యాఖ్యానాన్ని నివారిస్తుంది.
- issue: פָקַד עָלַיలో నియామకమా లేక ఆజ్ఞాపనా
  choice: నాకు అప్పగించిన బాధ్యత
  alternative: నన్ను ఆజ్ఞాపించాడు
  rationale: క్రియలో బాధ్యత అప్పగించడం, నియమించడం, ఆజ్ఞాపించడం వంటి భావపరిధి ఉంది. ప్రధాన పాఠ్యం ఆ విస్తృతిని సహజంగా ఉంచి, బలమైన ఆజ్ఞాపనా భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజప్రకటనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. తెలుగు పదక్రమం కారణంగా פָקַד עָלַיను నామవాచక నిర్మాణంగా అందించినా, దాని నియామక/ఆజ్ఞాపనా ఉద్వేగం పాదసూచికలో నిలుపబడింది.
