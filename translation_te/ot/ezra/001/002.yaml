revisions:
- from: 'పారసీక రాజు కోరెషు ఇలా అంటున్నాడు: “ఆకాశ దేవుడైన యహోవా భూమిమీద ఉన్న రాజ్యాలన్నిటినీ నాకు ఇచ్చాడు. ఆయన నాకు అప్పగించిన బాధ్యత[a], యూదాలో ఉన్న యెరూషలేములో ఆయన కోసం ఒక గృహం[b] కట్టడం.”'
