  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: te
  text: ఆయన ప్రజలందరిలో మీలో ఎవరైనా ఉంటే, అతని దేవుడు అతనితో ఉండుగాక; అతడు యూదాలో ఉన్న యెరూషలేముకు పైకి వెళ్లి, ఇశ్రాయేలు దేవుడైన యహ్వే మందిరాన్ని తిరిగి కట్టాలి[a]—ఆయనే యెరూషలేములో ఉన్న దేవుడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందిరాన్ని కట్టాలి.” హీబ్రూ క్రియకు అక్షరార్థం “కట్టు”; “తిరిగి కట్టు” అనేది పునరుద్ధరణ సందర్భాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనే దేవుడు, యెరూషలేములో ఉన్నవాడు.” హీబ్రూ వాక్యాన్ని మరింత సంక్షిప్తంగా అనువదించవచ్చు; అయితే ‘దేవుడు’ ముందు ఉన్న నిర్దిష్ట ఉపపదం ప్రస్తుత అనువాదానికి మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: మీ మధ్య ఉన్న ఆయన ప్రజలందరిలో ఎవడైనా సరే
  rationale: מִי ఇక్కడ కేవలం ప్రశ్న కాకుండా బహిరంగ ఆహ్వానాన్ని సూచిస్తుంది; ‘ఎవడైనా సరే’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది. ‘ఆయన ప్రజలు’ అనే రూపం 3వ పురుష ఏకవచన ప్రత్యయాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: అతని దేవుడు అతనికి తోడుగా ఉండుగాక
  rationale: జుస్సివ్ రూపంలోని ఆశీర్వాద/ఆకాంక్ష స్వరాన్ని ‘ఉండుగాక’ నిలుపుతుంది.
- source_word: וְיַעַל
  choice: అతడు ... వెళ్లి
  rationale: עלה యెరూషలేముకు ప్రయాణించడాన్ని సూచించే సాంప్రదాయ ‘పైకి వెళ్లడం’ ప్రయోగం. తెలుగులో ‘పైకి వెళ్లి’ అసహజంగా లేదా కేవలం భౌగోళికంగా వినిపించే అవకాశం ఉన్నందున, సందర్భానుకూలంగా ‘వెళ్లి’ వాడబడింది.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: యూదాలో ఉన్న యెరూషలేముకు
  rationale: సంబంధ వాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా మార్చి, భౌగోళిక గుర్తింపును పూర్తిగా నిలిపింది.
- source_word: וְיִבֶן
  choice: తిరిగి కట్టాలి
  rationale: בנה యొక్క మూలార్థం ‘కట్టు’; నిర్బంధానంతర పునరుద్ధరణ సందర్భం వల్ల ‘తిరిగి కట్టు’ ఉద్దేశిత భావాన్ని స్పష్టం చేస్తుంది. మూలార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘ఇల్లు’ అనే అక్షరార్థం కంటే దేవాలయాన్ని సూచించే సందర్భార్థమైన ‘మందిరం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; יְהוָה అనే నామం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన, నేరమైన తెలుగులో నిలుపుతుంది.
- source_word: הוּא הָאֱלֹהִים
  choice: దేవుడు ఆయనే
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న הָאֱלֹהִים మరియు ముందుంచిన הוּא కలిగించే ఉద్ఘాటనను ‘ఆయనే’ ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: యెరూషలేములో ఉన్న
  rationale: మసొరెటిక్ పాఠంలోని స్థానార్థాన్ని తగ్గించకుండా, ‘దేవుడు’ను విశేషించే సంబంధ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందించడం నామాన్ని నిలుపుతుంది.
- issue: ‘యెరూషలేములో ఉన్న దేవుడు’ అనే స్థానీకరణ వాక్యం
  choice: యెరూషలేములో ఉన్న దేవుడు ఆయనే
  alternative: ఆయనే దేవుడు; ఆయన మందిరం యెరూషలేములో ఉంది
  rationale: ప్రత్యామ్నాయం విస్తృత దైవశాస్త్ర దృక్పథంతో వాక్యాన్ని సవరించేది. కోరెషు ప్రకటనలోని చారిత్రక, దేవాలయ-కేంద్రీకృత భాషను దాని ఉద్రిక్తతతో సహా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజాజ్ఞకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. ‘ఉండుగాక’ ఆశీర్వాద స్వరాన్ని నిలుపుతుంది. ‘మందిరం’ సందర్భార్థ స్పష్టత కోసం, ‘యెహోవా’ దైవనామాన్ని ప్రత్యక్షంగా నిలుపుట కోసం ఎంచుకోబడ్డాయి.
