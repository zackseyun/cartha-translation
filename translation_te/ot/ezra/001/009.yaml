lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: వాటి సంఖ్య ఇలా ఉంది
  rationale: అక్షరార్థంగా ‘ఇవే వాటి సంఖ్య’; జాబితాను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తూ, బహువచన సూచనను ‘వాటి’లో నిలిపింది.
- source_word: אֲגַרְטְלֵי
  choice: పళ్లాలు
  rationale: ఆలయ సామగ్రిలోని పాత్రలను సూచించే పదం; ‘గిన్నెలు’ కూడా సాధ్యమే, అయితే జాబితా సందర్భంలో ‘పళ్లాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: זָהָב / כֶסֶף
  choice: బంగారు / వెండి
  rationale: పాత్రలు తయారైన పదార్థాన్ని తెలుగులో సహజమైన విశేషణ రూపాలతో తెలిపింది.
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: సామగ్రి లెక్కల జాబితాలో సులభంగా చదవడానికి అంకెలను ఉపయోగించింది.
- source_word: מַחֲלָפִים
  choice: కత్తులు
  rationale: అర్థం అనిశ్చితమైన ఈ పదానికి సంప్రదాయబద్ధమైన, సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సాధ్యతలను పాదటిప్పణిలో నిలిపింది.
