id: EZR.1.7
reference: Ezra 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: te
  text: కోరెషు రాజు యెహోవా ఆలయపు పాత్రలను బయటకు తీసుకువచ్చాడు. నెబుకద్నెజరు వాటిని యెరూషలేము నుండి బయటకు తీసుకువచ్చి తన దేవుని ఆలయంలో ఉంచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: కోరెషు రాజు
  rationale: తెలుగులో వ్యక్తిపేరు తరువాత రాజబిరుదును ఉంచడం సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הוֹצִיא
  choice: బయటికి తీయించాడు
  rationale: హిఫిల్ రూపంలోని ‘బయటికి రప్పించు/తీయించు’ అనే కారణార్థాన్ని వ్యక్తపరుస్తుంది; రాజు స్వయంగా కాక ఆజ్ఞ ద్వారా చేయించిన భావానికీ సరిపోతుంది.
- source_word: כְּלֵי
  choice: పాత్రలను
  rationale: మందిర సందర్భంలో ఆరాధనకు ఉపయోగించే సామగ్రిని సూచించే సహజమైన తెలుగు పదం; వాటి నిర్దిష్ట రూపాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: בֵית יְהוָה
  choice: యెహోవా మందిరపు
  rationale: ‘యెహోవా గృహం’ అనేది అక్షరార్థమైనప్పటికీ, ఇక్కడ ‘మందిరం’ ఆధునిక తెలుగు పాఠకునికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: యెరూషలేము నుండి తీసుకువచ్చి
  rationale: మూలంలోని ‘బయటికి తీసుకురావడం’ భావాన్ని గమ్యసందర్భానికి సహజమైన తెలుగులో అందిస్తుంది; నెబుకద్నెజరు చేసిన చర్య కోరెషు చర్యకు పూర్వమైందని వాక్యక్రమం తెలియజేస్తుంది.
- source_word: וַיִּתְּנֵם
  choice: వాటిని ... ఉంచాడు
  rationale: స్థలాన్ని సూచించే తరువాతి పదబంధంతో נתן ఇక్కడ ‘పెట్టాడు/ఉంచాడు’ అనే అర్థం ఇస్తుంది; ‘వాటిని’ అనే కర్మను స్పష్టంగా తెలిపింది.
- source_word: בְּבֵית אֱלֹהָיו
  choice: తన దేవుని మందిరంలో
  rationale: ఏకవచన దేవతను, నెబుకద్నెజరుకు సంబంధించిన స్వామ్యాన్ని అలాగే ఉంచుతుంది; ముందు వచ్చిన ‘యెహోవా మందిరం’తో ఉన్న భావసామ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలిపింది.
- issue: నెబుకద్నెజరు దేవత సంఖ్య
  choice: తన దేవుని
  alternative: తన దేవుళ్ల
  rationale: אֱלֹהָיו రూపం ఈ సందర్భంలో ఏకవచన భావంతో, మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉంది; బబులోను బహుదేవతారాధనపై బయటి సమాచారాన్ని వాక్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక-ఆధ్యాత్మిక సందర్భానికి తగిన గౌరవభరిత శైలి. మూలంలోని రెండు ‘గృహం’ పదాలకు సందర్భానుగుణంగా ‘మందిరం’ వాడి, యెహోవా మందిరం మరియు నెబుకద్నెజరు దేవుని మందిరం మధ్య సమాంతరతను నిలిపింది.
