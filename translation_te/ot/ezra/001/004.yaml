source:
  edition: WLC
  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: te
  text: ఏ చోట అతడు నివసిస్తున్నాడో అక్కడ మిగిలి ఉన్న ప్రతి ఒక్కరికీ[a], ఆ స్థలంలోని పురుషులు[b] వెండి, బంగారం, ఆస్తులు, పశువులు, అలాగే యెరూషలేములో ఉన్న దేవుని మందిరం కొరకు స్వచ్ఛంద అర్పణతో సహాయం చేయాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెనుక మిగిలిపోయిన ప్రతి ఒక్కరికి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని స్థలంలోని పురుషులు’; ఇది విస్తృతంగా స్థానిక నివాసులను లేదా పొరుగువారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘తోడ్పడాలి.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘ఎత్తడం/మోయడం’ అని అర్థం; ఇక్కడ ఆచరణాత్మక సహాయం అందించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: మిగిలి ఉన్న ప్రతి ఒక్కరూ
  rationale: నిఫాల్ కృదంతం ‘మిగిలి ఉండడం/వెనుక ఉండిపోవడం’ అనే భావాన్ని ఇస్తుంది. తిరిగి వెళ్లేవారితో వెంటనే చేరని యూదావారిని సందర్భం సూచిస్తుంది.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: తాము నివసిస్తున్న ఏ ప్రాంతంలోనైనా
  rationale: గּוּר ఇక్కడ తాత్కాలికంగా ఉండడం లేదా నివసించడం అనే భావాన్ని కలిగి ఉంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘నివసిస్తున్న’ అని ఇచ్చాం.
- source_word: יְנַשְּׂאֻהוּ
  choice: వారికి సహాయం చేయాలి
  rationale: నשׂא అక్షరార్థంగా ‘ఎత్తడం/మోయడం’; అయితే వెండి, బంగారం మొదలైన వాటితో కూడిన ఈ నిర్మాణంలో ప్రయాణానికి, కార్యానికి అవసరమైన భౌతిక సహాయం అందించడం అనే ప్రయోగార్థం ఉంది.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: వారి ప్రాంతపు మనుషులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అతని ప్రాంతపు మనుషులు/పురుషులు.’ తెలుగులో ‘మనుషులు’ మూలంలోని మానవ సమూహ సూచనను నిలుపుతూ, స్థానిక నివాసులు లేదా పొరుగువారు అనే విస్తృత సాధ్యతను కూడా అనుమతిస్తుంది.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: వెండితో, బంగారంతో
  rationale: విలువైన లోహాలను సూచించే సాధారణ పదాలను నేరుగా నిలుపుతుంది; ‘డబ్బు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: וּבִרְכוּשׁ
  choice: వస్తువులతో
  rationale: רְכוּשׁ కదిలించగల ఆస్తి లేదా సంపదను సూచిస్తుంది; జాబితాలో ‘వస్తువులు’ సహజమైన సమానార్థకం.
- source_word: וּבִבְהֵמָה
  choice: పశువులతో
  rationale: ఇక్కడ בְּהֵמָה పెంపుడు జంతువులను సమూహార్థంగా సూచిస్తుంది; ‘పశువులు’ సహజమైన తెలుగు పదం.
- source_word: עִם הַנְּדָבָה
  choice: అలాగే ... స్వచ్ఛంద అర్పణను కూడా
  rationale: נְדָבָה స్వచ్ఛందంగా ఇచ్చే కానుక లేదా అర్పణ. ‘అలాగే ... కూడా’ పదబంధం దాని అనుబంధ సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְבֵית הָאֱלֹהִים
  choice: దేవుని మందిరం కోసం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు.’ ఇక్కడ యెరూషలేము ఆలయమే స్పష్టమైన సూచ్యం; ఆధునిక తెలుగులో ‘దేవుని మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: యెరూషలేములో ఉన్న
  rationale: దేవుని మందిరం ఉన్న స్థలాన్ని తెలిపే సరళ సంబంధ వాక్యభాగం.
theological_decisions:
- issue: אַנְשֵׁי מְקֹמוֹ లో లింగ సూచన
  choice: వారి ప్రాంతపు మనుషులు
  alternative: వారి ప్రాంతపు పురుషులు / వారి పొరుగువారు
  rationale: మూలంలోని אַנְשֵׁי వ్యాకరణపరంగా పుంలింగ బహువచనం. అయితే ఈ సామాజిక ప్రయోగం స్థానిక నివాసులను విస్తృతంగా సూచించే అవకాశం ఉంది. ‘మనుషులు’ మూల రూపాన్ని పూర్తిగా లింగరహితం చేయకుండా, ఆ విస్తృతతను నిలుపుతుంది; పాదటిప్పణి ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
- issue: יְנַשְּׂאֻהוּ యొక్క సందర్భార్థం
  choice: వారికి సహాయం చేయాలి
  alternative: వారిని మోయాలి / వారికి తోడ్పడాలి
  rationale: అక్షరార్థమైన ‘మోయాలి’ ఈ సందర్భంలో అపార్థం కలిగించవచ్చు. వెండి, బంగారం, వస్తువులు, పశువులు ఇవ్వడం ద్వారా ఆచరణాత్మక సహాయం చేయడమే సందర్భార్థం.
- issue: בֵית הָאֱלֹהִים అనువాదం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: హీబ్రూ రూపం ‘దేవుని ఇల్లు’ అయినా, సందర్భంలో యెరూషలేము ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ తెలుగులో సహజంగా ఉండి కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఏకవచన పుంలింగ హీబ్రూ సూచనను తెలుగులో సహజమైన గౌరవ/సామాన్య బహువచనంతో వ్యక్తం చేశాం. దీర్ఘ జాబితాను రెండు వాక్యాలుగా విభజించి పఠనసౌలభ్యం కల్పించాం; అర్థసంబంధం నిలుపబడింది.
