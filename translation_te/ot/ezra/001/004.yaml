revisions:
- from: మిగిలి ఉన్న ప్రతి ఒక్కరూ[a] తాము నివసిస్తున్న ఏ ప్రాంతంలోనైనా, వారి ప్రాంతపు మనుషులు[b] వెండితో, బంగారంతో, వస్తువులతో, పశువులతో వారికి సహాయం చేయాలి[c]. అలాగే యెరూషలేములో ఉన్న దేవుని మందిరం కోసం స్వచ్ఛంద అర్పణను కూడా ఇవ్వాలి.
  to: ఏ చోట అతడు నివసిస్తున్నాడో అక్కడ మిగిలి ఉన్న ప్రతి ఒక్కరికీ[a], ఆ స్థలంలోని పురుషులు[b] వెండి, బంగారం, ఆస్తులు, పశువులు, అలాగే యెరూషలేములో ఉన్న దేవుని మందిరం కొరకు స్వచ్ఛంద అర్పణతో సహాయం చేయాలి[c].
  rationale: The revision restores the Hebrew’s distributive singular reference, retains the explicit masculine wording for the local men, and keeps the freewill offering within the coordinated list of provisions. It also uses ‘ఆస్తులు’ for possessions while preserving a clear, contemporary Telugu register.
