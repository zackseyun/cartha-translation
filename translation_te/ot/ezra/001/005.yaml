id: EZR.1.5
reference: Ezra 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: te
  text: అప్పుడు యూదా, బెన్యామీను పితృకుటుంబాల పెద్దలు, యాజకులు, లేవీయులు—వారిలో దేవుడు ఎవరి ఆత్మను కదిలించాడో వారందరూ[a]—యెరూషలేములో ఉన్న యాహ్వే మందిరాన్ని[b] కట్టడానికి పైకి వెళ్లేందుకు లేచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుడు ఎవరి ఆత్మను మేల్కొలిపాడో వారందరూ,’ లేదా ‘దేవుడు ఆత్మలో ఎవరిని ప్రేరేపించాడో వారందరూ.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే ఇల్లు’; అంటే దేవాలయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: లేచారు
  rationale: קום క్రియ ఇక్కడ దేవుని ప్రేరేపణకు ప్రతిస్పందనగా చర్య మొదలవడాన్ని సూచిస్తుంది. ‘లేచారు’ కథన గమనాన్ని నిలుపుతుంది; బయలుదేరడమే జరిగిపోయిందని ముందుగానే చెప్పదు.
- source_word: רָאשֵׁ֣י הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ఇది వంశాధారిత కుటుంబ విభాగాల నాయకులను సూచించే సామాజిక పదబంధం. ‘పితృకుటుంబాలు’ మూలంలోని బంధుత్వ నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לִֽיהוּדָה֙ וּבִנְיָמִ֔ן
  choice: యూదా, బెన్యామీను
  rationale: ל ఇక్కడ దిశను కాక అనుబంధాన్ని సూచిస్తుంది. తెలుగులో పితృకుటుంబాలతో కలిపిన నిర్మాణం ఈ గోత్ర అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִ֖ים
  choice: యాజకులు
  rationale: ఆరాధనా సేవలోని כהניםకు ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: הַלְוִיִּ֑ם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, దాని ఆరాధనా సేవకు చెందిన సమూహానికి సాధారణ తెలుగు రూపం.
- source_word: לְכֹ֨ל הֵעִ֤יר הָאֱלֹהִים֙ אֶת רוּח֔וֹ
  choice: వారిలో దేవుడు ఎవరి ఆత్మను కదిలించాడో వారందరూ
  rationale: మూలంలోని పంపిణీయ నిర్మాణాన్ని, దేవుడే వారి అంతరంగాన్ని చర్యకు కదిలించాడనే భావాన్ని నిలుపుతుంది. ‘వారిలో’ అనేది ఈ మాట ముందుగా పేర్కొన్న సమూహాలకు వర్తిస్తుందని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: רוּחַ
  choice: ఆత్మ
  rationale: ఇక్కడ ఈ పదం అంతరంగ ధోరణి లేదా ప్రేరణ పొందిన ఆత్మను సూచిస్తుంది. ‘మనసు’ కంటే ‘ఆత్మ’ మూలపదాన్నీ దాని దైవశాస్త్రీయ ప్రతిధ్వనినీ మెరుగ్గా కాపాడుతుంది.
- source_word: לַעֲלוֹת
  choice: అక్కడికి వెళ్లేందుకు
  rationale: ירושליםకు ‘పైకి వెళ్లడం’ అనే హీబ్రూ ప్రయాణ ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. గమ్యం అదే వాక్యంలో యెరూషలేముగా స్పష్టంగా ఉంది.
- source_word: לִבְנוֹת
  choice: కట్టడానికి
  rationale: మూల క్రియ సాధారణంగా ‘కట్టు’ అని మాత్రమే చెబుతుంది. సందర్భం పునర్నిర్మాణాన్ని సూచించినా, మూలంలో లేని ‘తిరిగి’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరాన్ని
  rationale: ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి ఉద్దేశించిన దేవాలయాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని అక్షరార్థమైన ‘యాహ్వే ఇల్లు’ను పాదసూచికలో నమోదు చేసింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా దేవుని ఒడంబడిక నామాన్ని తెలుగు లిపిలో ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁ֥ר בִּירוּשָׁלִָֽם
  choice: యెరూషలేములో ఉన్న
  rationale: సంబంధ వాక్యం మందిరం ఉన్న స్థలాన్ని గుర్తిస్తుంది. ‘ఉన్న’ అనేది శిథిల స్థితిని గురించి అవసరంలేని వ్యాఖ్యానం చేయకుండా మూల నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూల పాఠ్యంలో టెట్రాగ్రామాటన్ ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ దాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత ఒడంబడిక నామాన్ని నిలుపుతుంది.
- issue: הֵעִיר הָאֱלֹהִים אֶת רוּחוֹలో దైవ ప్రేరణ స్వభావం
  choice: దేవుడు ఎవరి ఆత్మను కదిలించాడో
  alternative: దేవుడు ఎవరిని ప్రేరేపించాడో
  rationale: మూలం చర్యకు దారితీసిన అంతరంగ కదలికను దేవునికే ఆపాదిస్తుంది; అయితే అది ఎలా జరిగిందో సిద్ధాంతపరంగా వివరించదు. ఎంపిక చేసిన రూపం ‘ఆత్మ’ను స్పష్టంగా ఉంచి ఆ దైవ-మానవ ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. గోత్ర, పితృకుటుంబ నిర్మాణం మరియు ‘ఆత్మ’ అనే మూలపదం కనిపించేలా ఉంచబడ్డాయి; ‘మళ్లీ కట్టడం’ వంటి సందర్భానుగతమైనా మూల క్రియలో ప్రత్యక్షంగా లేని వివరణను చేర్చలేదు.
