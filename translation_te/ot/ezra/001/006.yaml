source:
  edition: WLC
  text: וְ/כָל סְבִיבֹֽתֵי/הֶם֙ חִזְּק֣וּ בִֽ/ידֵי/הֶ֔ם בִּ/כְלֵי כֶ֧סֶף בַּ/זָּהָ֛ב בָּ/רְכ֥וּשׁ וּ/בַ/בְּהֵמָ֖ה וּ/בַ/מִּגְדָּנ֑וֹת לְ/בַ֖ד עַל כָּל הִתְנַדֵּֽב־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: te
  text: వారి చుట్టుపక్కల ఉన్నవారందరూ వెండి వస్తువులతో, బంగారంతో, సామగ్రితో, పశువులతో, విలువైన వస్తువులతో వారికి తోడ్పడ్డారు; స్వచ్ఛందంగా అర్పించబడిన వాటన్నిటికి అదనంగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి స్వచ్ఛంద అర్పణకు అదనంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: వారి చుట్టుపక్కల నివసించిన వారందరూ
  rationale: ఈ పదం వారి పరిసర ప్రాంతాల్లో ఉన్న ప్రజలను సూచిస్తుంది. ‘పొరుగువారు’ అని మరీ నిర్దిష్టం చేయకుండా సహజమైన ఆధునిక తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: వారికి సహాయం చేశారు
  rationale: అక్షరార్థంగా ‘వారి చేతులను బలపరిచారు’ అనే హీబ్రూ నుడికారం ఇక్కడ వస్తువులు ఇచ్చి ఆచరణాత్మకంగా తోడ్పడటాన్ని సూచిస్తుంది. తెలుగులో అక్షరానువాదం అసహజంగా ఉండటంతో భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చాం.
- source_word: בִּכְלֵי כֶסֶף
  choice: వెండి వస్తువులు
  rationale: כְּלִי అనేది పాత్రలు, ఉపకరణాలు లేదా వస్తువులు అనే విస్తృత అర్థం కలది. సందర్భం దాని రూపాన్ని నిర్దిష్టం చేయనందున ‘వస్తువులు’ మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: בַּזָּהָב
  choice: బంగారం
  rationale: మూలంలో ఉన్న నిరావరణ నామవాచకాన్ని అలాగే ఉంచి, బంగారు వస్తువులు అని అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: בָּרְכוּשׁ
  choice: సామగ్రి
  rationale: רְכוּשׁ చరాస్తి, సరకు లేదా సొత్తును సూచిస్తుంది. దానాల జాబితాలో ‘సామగ్రి’ సహజంగా ఉండి స్థిరాస్తి అనే భావాన్ని కలిగించదు.
- source_word: וּבַבְּהֵמָה
  choice: పశువులు
  rationale: ఇక్కడ సమష్టిగా గృహపాలిత జంతుసంపదను సూచిస్తుంది; ‘పశువులు’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וּבַמִּגְדָּנוֹת
  choice: విలువైన వస్తువులు
  rationale: מִגְדָּנוֹת విలువైన లేదా ప్రత్యేకమైన కానుకలను, కొన్ని సందర్భాల్లో రుచికర పదార్థాలను సూచించగలదు. ఇక్కడ విస్తృతమైన ‘విలువైన వస్తువులు’ అనవసర సంకుచితతను నివారిస్తుంది.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: ఇవే కాకుండా, స్వచ్ఛందంగా అర్పించినవన్నీ కూడా
  rationale: లְבַד עַל జాబితాకు అదనంగా ఉన్నదాన్ని సూచిస్తుంది; התנדב స్వచ్ఛందంగా ఇవ్వడం లేదా అర్పించడాన్ని తెలియజేస్తుంది. సంక్షిప్తమైన హీబ్రూ నిర్మాణంలోని భావాన్ని సహజ తెలుగులో తెలిపింది.
