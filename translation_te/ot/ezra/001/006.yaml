translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ నుడికారాన్ని అక్షరానువాదం చేయకుండా దాని సందర్భోచిత భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం; చివరి సంక్షిప్త నిర్మాణానికి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
