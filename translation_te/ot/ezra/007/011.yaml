source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: te
  text: 'రాజైన అర్తహషస్త యాజకుడైన, ఇశ్రాయేలుకు సంబంధించిన[b] యాహ్వే ఆజ్ఞల వాక్యాలకూ ఆయన విధులకూ శాస్త్రియైన ఎజ్రాకు ఇచ్చిన అధికారిక పత్రపు ప్రతిలిపి[a] ఇదే:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేఖలోని పాఠం,’ లేదా ‘పత్రపు నకలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలు కోసం,’ లేదా ‘ఇశ్రాయేలుపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: అధికార పత్రపు ప్రతిలిపి
  rationale: ఈ రెండు పదాలు అధికారికంగా రాసిన పత్రం యొక్క నకలు లేదా ప్రతిలిపిని సూచిస్తాయి. ‘అధికార పత్రం’ రాజసంబంధ సందర్భాన్ని తెలియజేస్తుంది; ‘ప్రతిలిపి’ మూలంలోని copy/transcript భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְזֶה
  choice: ఇదే
  rationale: ఇది తరువాత వచ్చే పత్రవివరాలను పరిచయం చేస్తుంది. తెలుగులో అనవసరమైన కాలసూచక పదాన్ని చేర్చకుండా ‘ఇదే’ సహజంగా సంధానిస్తుంది.
- source_word: נָתַן
  choice: ఇచ్చిన
  rationale: మూల క్రియ యొక్క సాధారణ ‘ఇవ్వడం’ అనే అర్థాన్ని నిలుపుతుంది; ‘జారీచేసిన’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: రాజైన అర్తహషస్త
  rationale: బిరుదును తెలుగులోకి అనువదించి, వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: యాజకుడూ శాస్త్రి అయిన
  rationale: ఎజ్రా యొక్క రెండు హోదాలను స్పష్టమైన సమానాధికార నిర్మాణంలో నిలుపుతుంది.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה וְחֻקָּיו
  choice: యాహ్వే ఆజ్ఞల మాటలనూ ఆయన కట్టడాలనూ లిఖించే శాస్త్రి
  rationale: ‘శాస్త్రి’ అనే పదం అధికారిక-లేఖన సంబంధ భావాన్ని నిలుపుతుంది. ‘లిఖించే’ అనేది తెలుగులో సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ఎజ్రాను కేవలం ఆధునిక భావంలోని పండితునిగా మార్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘Yahweh’గా లిప్యంతరీకరించింది.
- source_word: וְחֻקָּיו
  choice: ఆయన కట్టడాలు
  rationale: న్యాయ-బోధనా సందర్భంలో חֹק యొక్క స్థిరమైన నియమాలు లేదా statutes అనే భావాన్ని ‘కట్టడాలు’ నిలుపుతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం
  rationale: ఆజ్ఞలు, కట్టడాలు ఇశ్రాయేలుకు ఉద్దేశించబడినవి లేదా వర్తించేవి అనే సాధ్యమైన భావాన్ని సహజంగా ఇస్తుంది; ఇతర వ్యాకరణ అవకాశాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలభేదాన్ని నిలుపుతుంది.
- issue: עַל יִשְׂרָאֵל యొక్క సంబంధం
  choice: ఇశ్రాయేలు కోసం
  alternative: ఇశ్రాయేలును గురించి; ఇశ్రాయేలుపై
  rationale: సందర్భంలో ఆజ్ఞలు, కట్టడాలు ఇశ్రాయేలుకు వర్తిస్తాయని చెప్పడం సాధ్యమైన ప్రధాన పఠనం. అయితే ఉపసర్గకు ‘గురించి’ లేదా ‘పై’ అనే అర్థాలూ సాధ్యమైనందున వాటిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రాజపత్ర సందర్భానికి తగిన అధికారికతను ఉంచుతూ, మూలంలోని సమానాధికార పదబంధాన్ని రెండు వాక్యభాగాలుగా సహజీకరించింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల దగ్గరే ఉంచబడ్డాయి.
