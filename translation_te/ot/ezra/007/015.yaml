source:
  edition: WLC
  text: וּ/לְ/הֵיבָלָ֖ה כְּסַ֣ף וּ/דְהַ֑ב דִּֽי מַלְכָּ֣/א וְ/יָעֲט֗וֹ/הִי הִתְנַדַּ֨בוּ֙ לֶ/אֱלָ֣הּ יִשְׂרָאֵ֔ל דִּ֥י בִֽ/ירוּשְׁלֶ֖ם מִשְׁכְּנֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: te
  text: మరియు రాజు, అతని సలహాదారులు ఇశ్రాయేలు దేవునికి స్వచ్ఛందంగా అర్పించిన వెండిని, బంగారాన్ని తీసుకువెళ్లడానికి, ఆ దేవుని నివాసస్థలం యెరూషలేములో ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన యెరూషలేములో నివసిస్తున్నాడు.” అరామీయంలో అక్షరార్థంగా, “ఆయన నివాసస్థలం యెరూషలేములో ఉంది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: తీసుకువెళ్లాలి
  rationale: రాజాజ్ఞలోని ఉద్దేశాన్ని తెలిపే అరామీయ క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రవాణా విధానాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: כְּסַף וּדְהַב
  choice: వెండిబంగారాలను
  rationale: తదుపరి సంబంధవాక్యం నిర్దిష్టమైన వెండి, బంగారాన్ని సూచిస్తున్నందున సమాసరూపంలో సహజంగా అనువదించబడింది.
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: రాజు, అతని సలహాదారులు
  rationale: రాజసభకు చెందిన సలహాదారుల భావాన్ని సాధారణ ఆధునిక తెలుగు స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִתְנַדַּבוּ
  choice: స్వచ్ఛందంగా అర్పించిన
  rationale: వారు ఇష్టపూర్వకంగా సమర్పించిన కానుక అనే భావాన్ని, చర్య పూర్తయిన సంగతినీ నిలుపుతుంది.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి
  rationale: అర్పణను ఇశ్రాయేలు దేవునికి అంకితం చేసిన భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: ఆ దేవుని నివాసం యెరూషలేములో ఉంది
  rationale: క్రియాత్మకంగా ‘నివసిస్తున్నాడు’ అనకుండా, మూలంలోని నామవాచక నిర్మాణమైన ‘ఆయన నివాసం’ అనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మִשְׁכְּנֵהּలో దేవునికి యెరూషలేముతో ఉన్న సంబంధం
  choice: ఆ దేవుని నివాసం యెరూషలేములో ఉంది
  alternative: ఆయన యెరూషలేములో నివసిస్తున్నాడు
  rationale: మూలం సాధారణ నివాసక్రియకు బదులు ‘ఆయన నివాసం’ అనే నామవాచక వ్యక్తీకరణను ఉపయోగిస్తుంది. ఎంపిక చేసిన రూపం ఆలయకేంద్రిత భావాన్ని నిలుపుతూ, దేవుడు యెరూషలేముకే పరిమితుడని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. మూలంలోని ఉద్దేశార్థక నిర్మాణం తెలుగు రాజాజ్ఞ సందర్భానికి తగిన విధంగా ‘తీసుకువెళ్లాలి’గా ఇవ్వబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
