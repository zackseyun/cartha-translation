id: EZR.7.19
reference: Ezra 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: te
  text: నీ దేవుని మందిర సేవ కోసం నీకు ఇవ్వబడుతున్న పాత్రలను యెరూషలేము దేవుని సన్నిధిలో పూర్తిగా అప్పగించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తిగా సమర్పించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: పాత్రలను
  rationale: ఆరామీయ పదం ఉపకరణాలు లేదా పాత్రలను సూచిస్తుంది. మందిర సందర్భంలో ‘పాత్రలు’ సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: מִתְיַהֲבִין לָךְ
  choice: నీకు ఇవ్వబడుతున్న
  rationale: నిష్క్రియార్థక వర్తమాన కృదంత భావాన్ని నిలుపుతూ, ఆజ్ఞాపత్ర శైలికి సరిపోయే సహజమైన అనువాదం.
- source_word: לְפָלְחָן בֵּית אֱלָהָךְ
  choice: నీ దేవుని మందిర సేవ కోసం
  rationale: פְלָחָן ఇక్కడ ఆరాధనకు సంబంధించిన మందిర సేవను సూచిస్తుంది; ‘సేవ’ అనే పదం మూలంలోని విస్తృత భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: הַשְׁלֵם
  choice: పూర్తిగా అప్పగించు
  rationale: ‘సంపూర్ణంగా అందజేయు/అప్పగించు’ అనే ఆజ్ఞార్థాన్ని వ్యక్తం చేస్తుంది; పాత్రలన్నిటినీ లోటు లేకుండా అప్పగించాలనే భావాన్ని నిలుపుతుంది.
- source_word: קֳדָם
  choice: సన్నిధిలో
  rationale: ‘ఎదుట’ లేదా ‘సమక్షంలో’ అనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: యెరూషలేము దేవుని
  rationale: పర్షియా కాలపు పరిపాలనా శైలిలో దేవుణ్ణి యెరూషలేముతో సంబంధపరచే మూలపదబంధాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: మందిర సంబంధిత פְלָחָן పదార్థం
  choice: మందిర సేవ
  alternative: మందిర ఆరాధన
  rationale: ఈ సందర్భం ఆరాధనకు సంబంధించినదే అయినా, ఆరామీయ నామవాచకం ‘ఆరాధన’ కంటే విస్తృతమైన ‘సేవ’ భావాన్ని కూడా కలిగి ఉంది. అందువల్ల మూలంలోని అర్థవిస్తృతిని కాపాడటానికి ‘సేవ’ ఎంచుకోబడింది.
- issue: యెరూషలేముతో దేవుని సంబంధాన్ని తెలిపే పదబంధం
  choice: యెరూషలేము దేవుడు
  alternative: యెరూషలేములో ఉన్న దేవుడు
  rationale: మూలంలోని సంక్షిప్త పరిపాలనా పదబంధాన్ని ‘యెరూషలేము దేవుడు’ నేరుగా ప్రతిబింబిస్తుంది; దేవుడు భౌగోళికంగా అక్కడికే పరిమితమన్న అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞాపత్ర శైలి. ‘దేవాలయం’కు బదులు బైబిలు సందర్భంలో సాధారణమైన ‘మందిరం’, సాంకేతికంగా వినిపించే ‘ఉపకరణాలు’కు బదులు ‘పాత్రలు’ ఉపయోగించబడ్డాయి.
