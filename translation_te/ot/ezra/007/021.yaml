translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజాజ్ఞ శైలిని ఉపయోగించాం. మూలంలోని రాజు వ్యక్తిగత అధికార నొక్కింపును ‘నేను స్వయంగా’ అని సహజీకరించాం; పరిపాలనా పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచాం.
