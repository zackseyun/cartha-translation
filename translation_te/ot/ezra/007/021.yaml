source:
  edition: WLC
  text: וּ֠/מִנִּ/י אֲנָ֞ה אַרְתַּחְשַׁ֤סְתְּא מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/כֹל֙ גִּזַּֽבְרַיָּ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה דִּ֣י כָל דִּ֣י יִ֠שְׁאֲלֶנְ/כוֹן עֶזְרָ֨א כָהֲנָ֜/ה סָפַ֤ר דָּתָ/א֙ דִּֽי אֱלָ֣הּ שְׁמַיָּ֔/א אָסְפַּ֖רְנָא יִתְעֲבִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: te
  text: '“నదికి అవతల”[b] ఉన్న కోశాధికారులందరికీ రాజైన అర్తహషస్తనైన నేను స్వయంగా ఈ ఆజ్ఞ జారీ చేస్తున్నాను: పరలోక దేవుని ధర్మశాస్త్ర లేఖకుడైన యాజకుడు ఎజ్రా మీ దగ్గర ఏది కోరినా, అది ఖచ్చితంగా అమలు చేయబడాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జాగ్రత్తగా/వెంటనే”; అరామిక్ క్రియావిశేషణం ఆ ఆజ్ఞను సరిగ్గా, పూర్తిగా అమలు చేయాలని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “నదికి అవతల” అనేది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: నేను స్వయంగా
  rationale: రాజు వ్యక్తిగతంగా ఈ ఆజ్ఞకు అధికారమిస్తున్నాడనే అరామిక్ నొక్కిచెప్పడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׂים טְעֵם
  choice: ఈ ఆజ్ఞ జారీ చేస్తున్నాను
  rationale: అధికారిక ఆదేశాన్ని స్థాపించి ప్రకటించడాన్ని తెలిపే పరిపాలనా నుడికారాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: కోశాధికారులందరికీ
  rationale: రాజకోశానికి సంబంధించిన అధికారులను సూచించే పదానికి సంక్షిప్తమైన పరిపాలనా సమానార్థకం.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: “నదికి అవతల” ఉన్న
  rationale: యూఫ్రటీసుకు పశ్చిమాన ఉన్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరును భౌగోళిక అర్థంతో పాటు నిలుపుతుంది.
- source_word: יִשְׁאֲלֶנְכוֹן
  choice: మిమ్మల్ని ఏది అడిగినా
  rationale: అడగడం లేదా కోరడం అనే మూలార్థాన్ని నిలుపుతూ, రాజాజ్ఞలో లేని అదనపు బలవంతపు భావాన్ని క్రియలో చేర్చదు.
- source_word: עֶזְרָא כָהֲנָה סָפַר דָּתָא
  choice: ధర్మశాస్త్ర లేఖకుడైన యాజకుడు ఎజ్రా
  rationale: ఎజ్రా యాజకుడనీ, ధర్మశాస్త్ర సంబంధమైన పాండిత్య-అధికార హోదా గల లేఖకుడనీ తెలిపే రెండు గుర్తింపులను నిలుపుతుంది.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవుని
  rationale: ఇశ్రాయేలు దేవునికి సామ్రాజ్య కాలంలో వాడిన ‘ఆకాశాల దేవుడు’ అనే బిరుదును తెలుగులో సహజంగా, ఏకదేవుని సూచించే విధంగా అందిస్తుంది.
- source_word: אָסְפַּרְנָא
  choice: ఖచ్చితంగా
  rationale: పూర్తి శ్రద్ధతో, సరిగ్గా అమలు చేయాలనే అరామిక్ క్రియావిశేషణ భావాన్ని ప్రధానంగా వ్యక్తం చేస్తుంది; దాని అర్థవిస్తృతిని పాదసూచికలో నిలిపింది.
