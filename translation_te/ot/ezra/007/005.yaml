  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: te
  text: అబీషూవా కుమారుడు[a], ఫీనెహాసు కుమారుడు, ఎలియాజరు కుమారుడు, ముఖ్య యాజకుడైన అహరోను కుమారుడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంశస్థుడు.’ హెబ్రీ వంశావళుల్లో ‘కుమారుడు’ అనే పదం మధ్య తరాలను పేర్కొనకుండా విస్తృత వంశ సంబంధాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా, ‘మహాయాజకుడు.’ హెబ్రీలో అక్షరార్థంగా ‘యాజకుడు, ముఖ్యుడు/తల’ అని ఉంది; ‘మహాయాజకుడు’కు సాధారణంగా వాడే పదబంధం ఇక్కడ లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో ఈ పదం నేరుగా ‘కుమారుడు’ అని సూచిస్తుంది. అయితే హెబ్రీ వంశావళుల్లో మధ్య తరాలు విడిచిపెట్టబడవచ్చు కాబట్టి, విస్తృతంగా ‘వంశస్థుడు’ అనే భావం కూడా ఉండవచ్చు; ప్రధాన పాఠంలో పునరావృత మూలరూపాన్ని నిలిపాం.
- source_word: אֲבִישׁוּעַ
  choice: అబీషూవ
  rationale: హెబ్రీ వ్యక్తిపేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: פִּינְחָס
  choice: ఫీనెహాసు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉపయోగించాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో గుర్తుపట్టదగిన పేరురూపాన్ని ఉపయోగించాం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని ఉపయోగించాం.
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: ముఖ్య యాజకుడు
  rationale: పదబంధం అక్షరార్థంగా ‘యాజకుడు, ముఖ్యుడు/తల’ అని ఉంది. సాధారణ సాంకేతిక పదమైన הַכֹּהֵן הַגָּדוֹל వాడబడనందున, ‘ప్రధాన యాజకుడు’ కంటే ‘ముఖ్య యాజకుడు’ మూలంలోని ప్రత్యేక పదప్రయోగాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: అహరోను యాజక బిరుదు అనువాదం
  choice: ముఖ్య యాజకుడు
  alternative: ప్రధాన యాజకుడు
  rationale: ఇక్కడ హెబ్రీలో ‘గొప్ప యాజకుడు’ అనే సాధారణ సాంకేతిక పదబంధం కాకుండా, ‘యాజకుడు, ముఖ్యుడు/తల’ అనే నిర్మాణం ఉంది. అందువల్ల సంప్రదాయ బిరుదును నేరుగా దిగుమతి చేయకుండా మూలపాఠంలోని భేదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి పునరావృత నిర్మాణాన్ని నిలుపుతూ సంక్షిప్తంగా రూపొందించాం. పేర్లకు తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాలు ఎంచుకున్నాం; ‘ముఖ్య యాజకుడు’ అనే రూపం గౌరవప్రదంగా, సహజంగా ఉండి మూలంలోని పదభేదాన్ని కాపాడుతుంది.
