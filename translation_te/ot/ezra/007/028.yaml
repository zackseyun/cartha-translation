revisions:
- from: రాజు, అతని సలహాదారులు, రాజుకు చెందిన శక్తిమంతులైన అధికారులందరి ఎదుట ఆయన నా పట్ల నిబద్ధమైన ప్రేమ చూపించాడు.[a] నా దేవుడైన యాహ్వే హస్తం నా మీద ఉండడం వల్ల నేను ధైర్యం తెచ్చుకొని,[b] నాతో కలిసి వెళ్లడానికి ఇశ్రాయేలులోని ముఖ్యులను[c] సమకూర్చాను.
  to: నా దేవుడైన యాహ్వే రాజు, అతని సలహాదారులు, రాజు యొక్క శక్తిమంతులైన అధికారులందరి ఎదుట నా పట్ల నిబద్ధమైన ప్రేమను చూపించాడు.[a] నా దేవుడైన యాహ్వే హస్తం నా మీద ఉండడం వల్ల నేను ధైర్యం తెచ్చుకొని,[b] నాతో కలిసి పైకి వెళ్లడానికి ఇశ్రాయేలులోని ముఖ్యులను[c] సమకూర్చాను.
