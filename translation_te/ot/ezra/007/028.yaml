source:
  edition: WLC
  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: te
  text: నా దేవుడైన యాహ్వే రాజు, అతని సలహాదారులు, రాజు యొక్క శక్తిమంతులైన అధికారులందరి ఎదుట నా పట్ల నిబద్ధమైన ప్రేమను చూపించాడు.[a] నా దేవుడైన యాహ్వే హస్తం నా మీద ఉండడం వల్ల నేను ధైర్యం తెచ్చుకొని,[b] నాతో కలిసి పైకి వెళ్లడానికి ఇశ్రాయేలులోని ముఖ్యులను[c] సమకూర్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పట్ల అనుగ్రహం చూపించాడు.”
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “నా మీద ఉన్న నా దేవుడైన యాహ్వే హస్తానుసారంగా నేను నన్ను బలపరచుకున్నాను.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “తలలు”; అంటే ఇశ్రాయేలులోని ప్రధానులు లేదా నాయకులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: నిబద్ధమైన ప్రేమ చూపించాడు
  rationale: హీబ్రూ ప్రయోగంలోని కృపతో కూడిన స్థిరమైన విశ్వసనీయ ప్రేమ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; క్రియలోని అక్షరార్థమైన ‘వంచాడు/చాచాడు’ అనే రూపకాన్ని బలవంతంగా నిలుపలేదు.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: రాజసభ సందర్భంలో ‘సమక్షంలో/దృష్టిలో’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా ఇస్తుంది.
- source_word: יֹעֲצָיו
  choice: అతని సలహాదారులు
  rationale: రాజుకు సలహా ఇచ్చే సభాసభ్యులను ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: రాజుకు చెందిన శక్తిమంతులైన అధికారులు
  rationale: שָׂרִים అనే ఉన్నత పరిపాలకుల భావాన్నీ, הַגִּבֹּרִים అనే బలశాలి/ప్రభావశాలి విశేషణాన్నీ పర్షియా రాజసభ సందర్భానికి తగిన విధంగా నిలుపుతుంది.
- source_word: הִתְחַזַּקְתִּי
  choice: నేను ధైర్యం తెచ్చుకొని
  rationale: ఈ హిత్పయేల్ రూపం ఇక్కడ బలపరచబడటం లేదా సాహసం పొందటం అనే సందర్భార్థాన్ని ఇస్తుంది; తరువాతి దైవహస్త ప్రస్తావన కారణంగా అది స్వయంకృత బలమని సూచించదు.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: నా దేవుడైన యాహ్వే హస్తం నా మీద ఉండడం వల్ల
  rationale: దైవ సహాయం, శక్తి అనే ‘హస్తం’ రూపకాన్ని నిలుపుతూ, సందర్భంలో ఎజ్రా ధైర్యానికి అది ఆధారమని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: רָאשִׁים
  choice: ముఖ్యులు
  rationale: అక్షరార్థం ‘తలలు’; ఇక్కడ ఇశ్రాయేలులో గుర్తింపు పొందిన ప్రధాన పురుషులు లేదా నాయకులను సూచిస్తుంది.
- source_word: לַעֲלוֹת עִמִּי
  choice: నాతో కలిసి వెళ్లడానికి
  rationale: లక్ష్యస్థానం ముందటి సందర్భం ద్వారా తెలిసినా, ఈ ఒక్క వచనంలో ‘పైకి వెళ్లడం’ తెలుగులో అసహజంగా లేదా అస్పష్టంగా ఉండవచ్చు; ప్రయాణంలో తోడుగా వెళ్లే ఉద్దేశాన్ని సహజంగా ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, సాధ్యమైన హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: חֶסֶד యొక్క భావపరమైన విస్తృతి
  choice: నిబద్ధమైన ప్రేమ
  alternative: దయ / అనుగ్రహం
  rationale: ఈ పదంలో దయతో పాటు స్థిరత్వం, విశ్వసనీయత వంటి భావాలు ఉండవచ్చు. అయితే ఈ సందర్భంలో అది రాజు ద్వారా వ్యక్తమైన అనుకూలతను కూడా సూచించగలదని పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని ఉంచాం.
- issue: ఎజ్రా ధైర్యానికి దైవహస్తంతో ఉన్న సంబంధం
  choice: కారణార్థంగా ‘ఉండడం వల్ల’
  alternative: ‘నా మీద ఉన్న హస్తానికి అనుగుణంగా నేను నన్ను బలపరచుకున్నాను’
  rationale: כְּ అనే అవ్యయం అక్షరార్థంగా ‘ప్రకారం/వలె’ అని రావచ్చు; సందర్భంలో యాహ్వే సహాయం ఎజ్రాకు ధైర్యం కలిగించిన ఆధారంగా పనిచేస్తుంది. ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన శైలి వాడబడింది. మొదటి వాక్యంలోని ‘ఆయన’ మునుపటి వచనంలో ఉన్న యాహ్వేను సూచించే కొనసాగింపు; వచనాన్ని ఒంటరిగా చదివినప్పుడు స్పష్టత కోసం కర్తను తెలుగులో వ్యక్తం చేశాం. ‘హస్తం’ అనే బైబిలీయ దైవసహాయ రూపకాన్ని నిలిపాం.
