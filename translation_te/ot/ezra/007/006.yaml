source:
  edition: WLC
  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: te
  text: ఈ ఎజ్రా బబులోను నుండి పైకి వెళ్లాడు. అతడు ఇశ్రాయేలు దేవుడైన యాహ్వే ఇచ్చిన మోషే ధర్మశాస్త్రంలో నిపుణుడైన శాస్త్రి. అతని దేవుడైన యాహ్వే హస్తం అతనిపై ఉన్న ప్రకారం[a], రాజు అతడు కోరినదంతా అతనికి మంజూరు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని దేవుడైన యాహ్వే హస్తం అతనిపై ఉన్న ప్రకారం.” ఇది యాహ్వే అనుగ్రహం, శక్తి లేదా దైవసహాయాన్ని సూచించగల హీబ్రూ నానుడి.
    reason: హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని అర్థవ్యాప్తిని వివరించడం.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: బబులోను నుండి యెరూషలేముకు వచ్చాడు
  rationale: עלה מן ప్రయాణాన్ని, ముఖ్యంగా యెరూషలేమువైపు ‘పైకి వెళ్లడాన్ని’ సూచిస్తుంది. తెలుగు పాఠకునికి గమ్యం స్పష్టంగా ఉండేందుకు సందర్భంలో అంతర్లీనమైన ‘యెరూషలేముకు’ చేర్చబడింది; ‘వచ్చాడు’ సహజమైన కథన తెలుగు.
- source_word: סֹפֵר מָהִיר
  choice: నిపుణుడైన శాస్త్రి
  rationale: סֹפֵר ఇక్కడ మోషే ధర్మశాస్త్రంతో సంబంధమున్న లేఖకుడు/పండితుడు; מָהִיר వేగాన్ని మాత్రమే కాక నైపుణ్యాన్ని సూచిస్తుంది. ‘నిపుణుడైన శాస్త్రి’ ఈ రెండు భావాలను సహజంగా అందిస్తుంది.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రంలో
  rationale: ప్రవాసానంతర న్యాయ-నిబంధన సందర్భంలో תּוֹרָהకు ‘ధర్మశాస్త్రం’ సాధారణ తెలుగు బైబిలు పదజాలంలో స్పష్టమైన సమానార్థకం.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన యాహ్వే ఇచ్చిన
  rationale: సంబంధవాక్యం మోషే ధర్మశాస్త్రాన్ని విశేషిస్తుంది. יְהוָהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ ... כֹּל בַּקָּשָׁתוֹ
  choice: అతడు అడిగినదంతా రాజు అతనికి మంజూరు చేశాడు
  rationale: విన్నపానికి సంబంధించిన נתןను తెలుగులో సహజంగా ‘మంజూరు చేశాడు’ అని ఇచ్చాం; כֹּל בַּקָּשָׁתוֹ అతని అభ్యర్థన మొత్తం నెరవేరిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: అతని దేవుడైన యాహ్వే హస్తం అతనికి తోడుగా ఉన్నందున
  rationale: ‘హస్తం’ అనే మూల రూపకాన్ని నిలిపి, כְּ సూచించే ఆధారం/అనుగుణతను తెలుగులో సహజమైన కారణవాక్యంతో వ్యక్తం చేశాం. మూలంలో లేని ‘మంచి’ అనే విశేషణాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: ‘యాహ్వే హస్తం అతనిపై’ అనే దైవకార్య రూపకం
  choice: హస్తం అనే రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, అర్థవ్యాప్తిని పాదటిప్పణిలో వివరించడం
  alternative: యాహ్వే అతనిని అనుగ్రహించినందున; యాహ్వే శక్తి అతనికి తోడైనందున
  rationale: ఈ నానుడి అనుగ్రహం, శక్తి, సంరక్షణాత్మక సహాయం వంటి పరస్పర సంబంధిత భావాలను మోస్తుంది. ఒక్క భావానికే పరిమితం చేయకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శాస్త్రి,’ ‘ధర్మశాస్త్రం,’ ‘హస్తం’ వంటి స్థిరమైన బైబిలు పదాలను సహజ వాక్యనిర్మాణంతో ఉపయోగించాం.
