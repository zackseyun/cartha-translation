revisions:
- from: ఈ ఎజ్రా బబులోను నుండి యెరూషలేముకు వచ్చాడు. అతడు ఇశ్రాయేలు దేవుడైన యాహ్వే ఇచ్చిన మోషే ధర్మశాస్త్రంలో నిపుణుడైన శాస్త్రి. అతని దేవుడైన యాహ్వే హస్తం అతనికి తోడుగా ఉన్నందున[a], అతడు అడిగినదంతా రాజు అతనికి మంజూరు చేశాడు.
  to: ఈ ఎజ్రా బబులోను నుండి పైకి వెళ్లాడు. అతడు ఇశ్రాయేలు దేవుడైన యాహ్వే ఇచ్చిన మోషే ధర్మశాస్త్రంలో నిపుణుడైన శాస్త్రి. అతని దేవుడైన యాహ్వే హస్తం అతనిపై ఉన్న ప్రకారం[a], రాజు అతడు కోరినదంతా అతనికి మంజూరు చేశాడు.
  rationale: The revision removes the unstated destination, retains the ascent expression, and represents כְּיַד with “ఉన్న ప్రకారం” rather than an explicit causal conjunction. It preserves the Hebrew hand idiom and its ambiguity while maintaining modern, readable Telugu.
