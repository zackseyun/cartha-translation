translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని వాడాం. మూలంలోని పునరావృత నిర్మాణాన్ని, చివరనున్న కొనసాగింపు సూచక దీర్ఘరేఖను నిలిపాం.
