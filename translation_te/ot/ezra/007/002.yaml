  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళుల్లో ‘కుమారుడు’ అనే మాట కొన్నిసార్లు సంక్షిప్తంగా ఇచ్చిన తరాల వరుసలో దూరపు వంశస్థుడిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి వరుసలో בֶּן అనే నిర్మాణరూపానికి సహజమైన తెలుగు సమానం ‘కుమారుడు’. సంక్షిప్త వంశావళుల్లో ఇది కొన్నిసార్లు దూరపు వంశస్థుడిని కూడా సూచించగలదనే విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని శబ్దరూపానికి దగ్గరగా, తెలుగులో సహజంగా చదవగల విధంగా లిప్యంతరీకరించాం.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, తెలుగులో స్థిరంగా చదవదగిన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని శబ్దరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
