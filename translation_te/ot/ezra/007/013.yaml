source:
  edition: WLC
  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: te
  text: “నా రాజ్యంలో ఇశ్రాయేలు ప్రజలలోనుండి, వారి యాజకులలోనుండి[a], లేవీయులలోనుండి నీతో కలిసి యెరూషలేముకు వెళ్లడానికి స్వచ్ఛందంగా సిద్ధపడే ప్రతి వ్యక్తి వెళ్లవచ్చని నేను ఆజ్ఞ జారీ చేస్తున్నాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వారి యాజకులు” అనే చోట అరమేయ ప్రత్యయాన్ని వేరుగా అన్వయిస్తే “అతని యాజకులు” అని కూడా అనువదించవచ్చు; సందర్భం మాత్రం ఇశ్రాయేలు ప్రజలకు చెందిన యాజకులనే సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: నేను ఆజ్ఞ జారీ చేస్తున్నాను
  rationale: రాజాజ్ఞకు మూలం రాజేనని తెలిపే అరమేయ పరిపాలనా సూత్రాన్ని సహజమైన ఆధునిక తెలుగు అధికారిక శైలిలో వ్యక్తపరుస్తుంది.
- source_word: כָל מִתְנַדַּב
  choice: స్వచ్ఛందంగా ముందుకు వచ్చే ప్రతి వ్యక్తి
  rationale: హిత్పయేల్ కృదంతంలోని స్వచ్ఛందతను, వ్యక్తి తనంతట తానే సిద్ధపడే భావాన్ని నిలుపుతుంది.
- source_word: בְּמַלְכוּתִי
  choice: నా రాజ్యంలో ఉన్న
  rationale: రాజు పాలనాధికారంలో ఉన్న ప్రాంతం లేదా సామ్రాజ్య పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: ఇశ్రాయేలు ప్రజల్లోను, వారి యాజకుల్లోను, లేవీయుల్లోను
  rationale: స్వచ్ఛందంగా వెళ్లగల వర్గాల జాబితాను తెలుగులో సహజంగా చూపుతుంది; సర్వనామ ప్రత్యయం సందర్భానుసారంగా ఇశ్రాయేలు ప్రజలను సూచించేదిగా తీసుకోబడింది.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: నీతో కలిసి యెరూషలేముకు వెళ్లడానికి
  rationale: ఎజ్రాతో పాటు యెరూషలేముకు ప్రయాణించడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהָךְ
  choice: వెళ్లవచ్చు
  rationale: రాజాజ్ఞ సందర్భంలోని అనుమతి భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: וְכָהֲנוֹהִי లోని తృతీయ పురుష ప్రత్యయానికి పూర్వపదం
  choice: వారి యాజకులు—ఇశ్రాయేలు ప్రజలకు చెందిన యాజకులు
  alternative: అతని యాజకులు
  rationale: సందర్భంలో సమీప పూర్వపదమైన ఇశ్రాయేలు ప్రజలనే సూచించడం సహజం; అయినా అరమేయ ప్రత్యయ రూపం వల్ల వ్యాకరణపరమైన ప్రత్యామ్నాయం సాధ్యమే కాబట్టి పాదటిప్పణిలో నమోదు చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజాజ్ఞ శైలి ఉపయోగించబడింది. “స్వచ్ఛందంగా ముందుకు వచ్చే” అనే పదబంధం మూలంలోని స్వచ్ఛంద చర్యను నిలుపుతుంది. మూలంలో ఆజ్ఞ ప్రకటన ముందుగా వచ్చి, చివర అనుమతి ఇవ్వబడే నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం.
