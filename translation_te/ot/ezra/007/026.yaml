  source_fidelity: దైవ ధర్మశాస్త్రం, రాజు చట్టం అనే రెండు సమన్వయ న్యాయాధికారాలను ముసాయిదా సరిగ్గా ప్రతిబింబిస్తుంది; త్వరిత న్యాయ అమలు మరియు నాలుగు ప్రత్యామ్నాయ శిక్షలూ ఉన్నాయి. అయితే అరామీయంలోని అరుదైన לשרשו పదానికి ప్రధాన పాఠంలో ‘దేశబహిష్కరణ’ అనడం నివాసదేశం నుంచి బహిష్కరణకే అర్థాన్ని పరిమితం చేస్తుంది; మూలపదం స్థలం లేదా సమాజం నుంచి తొలగింపును కూడా సూచించవచ్చు.
