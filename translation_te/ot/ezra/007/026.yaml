id: EZR.7.26
reference: Ezra 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל דִּי לָא֩ לֶהֱוֵ֨א עָבֵ֜ד דָּתָ֣/א דִֽי אֱלָהָ֗/ךְ וְ/דָתָ/א֙ דִּ֣י מַלְכָּ֔/א אָסְפַּ֕רְנָא דִּינָ֕/ה לֶהֱוֵ֥א מִתְעֲבֵ֖ד מִנֵּ֑/הּ הֵ֤ן לְ/מוֹת֙ הֵ֣ן ל/שרשו הֵן לַ/עֲנָ֥שׁ נִכְסִ֖ין וְ/לֶ/אֱסוּרִֽין־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: te
  text: నీ దేవుని ధర్మశాస్త్రానికీ రాజు చట్టానికీ లోబడని ప్రతి వ్యక్తికి వెంటనే తీర్పు అమలు చేయాలి—మరణశిక్షగానీ, బహిష్కరణగానీ[a], ఆస్తి జప్తుగానీ, కారాగార శిక్షగానీ విధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరుతో పెకలించడం.’ అరామీయ పదం అరుదైనది; ఒకరిని వారి నివాసస్థలం లేదా సమాజం నుంచి తొలగించడాన్ని సూచించవచ్చు.
    reason: లשרשו అనే అరుదైన పదానికి ఉన్న నిఘంటు అనిశ్చితిని నిలుపుతూ, ప్రధాన పాఠంలోని ‘బహిష్కరణ’ను అతిగా నిర్దిష్టం కాకుండా వివరిస్తుంది.
lexical_decisions:
- source_word: וְכָל דִּי
  choice: ఎవరి మీదనైనా
  rationale: ఇది షరతుకు లోబడే ఏ వ్యక్తినైనా సూచించే అనిర్దిష్ట సంబంధార్థక ప్రయోగం; తెలుగు న్యాయ సందర్భంలో సహజమైన పంపిణీ భావాన్ని ఇస్తుంది.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: లోబడని
  rationale: అక్షరార్థంగా ‘చేయని/అమలు చేయని’ అయినా, ‘ధర్మశాస్త్రం/చట్టం’తో కలిసినప్పుడు విధేయత లేదా అనుసరణ భావం ప్రధానంగా ఉంటుంది.
- source_word: דָּתָא דִּי אֱלָהָךְ
  choice: నీ దేవుని ధర్మశాస్త్రం
  rationale: దేవునికి సంబంధించిన דָּתָאను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘ధర్మశాస్త్రం’గా ఇచ్చి, రాజు చట్టంతో ఉన్న సమన్వయాన్ని నిలిపింది.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: రాజు చట్టం
  rationale: రాజకీయ-న్యాయ నియమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దేవుని ధర్మశాస్త్రంతో సమన్వయ సంబంధం అలాగే ఉంది.
- source_word: אָסְפַּרְנָא
  choice: వెంటనే
  rationale: న్యాయ తీర్పు అమలులో త్వరితత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: వారి మీద తీర్పు అమలు చేయాలి
  rationale: అరామీయంలోని నిష్క్రియ న్యాయ ప్రయోగాన్ని తెలుగులో స్పష్టమైన అధికారిక ఆజ్ఞగా వ్యక్తపరుస్తుంది.
- source_word: לְמוֹת
  choice: మరణశిక్ష
  rationale: న్యాయపరమైన శిక్షల జాబితాలో ‘మరణం’ ఉద్దేశించిన దండనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לשרשו
  choice: దేశబహిష్కరణ
  rationale: అరుదైన పదం అక్షరార్థంగా ‘వేరుతో పెకలించడం’; సందర్భంలో నివాసస్థలం లేదా సమాజం నుంచి తొలగింపును సూచించే అవకాశముంది. ప్రధాన పాఠంలో న్యాయపరమైన అర్థాన్ని ఇచ్చి, అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: ఆస్తి జప్తు
  rationale: ఆస్తికి సంబంధించిన శిక్షను ఆధునిక న్యాయ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְלֶאֱסוּרִין
  choice: కారాగార శిక్ష
  rationale: అక్షరార్థమైన ‘బంధాలు’ ఈ న్యాయ సందర్భంలో నిర్బంధం లేదా చెరను సూచిస్తుంది.
theological_decisions:
- issue: దేవుని ధర్మశాస్త్రం మరియు రాజు చట్టం మధ్య సంబంధం
  choice: రెండింటినీ సమన్వయంగా ‘నీ దేవుని ధర్మశాస్త్రానికీ రాజు చట్టానికీ’ అని అనువదించడం
  alternative: రాజు చట్టాన్ని దేవుని ధర్మశాస్త్రానికి అధీనమైనదిగా లేదా దానిని అమలు చేసేదిగా వివరించడం
  rationale: అరామీయ పాఠం రెండు న్యాయ అధికారాలను సమన్వయంగా ఉంచుతుంది; వాటి మధ్య క్రమాన్ని లేదా అధీనతను వచనం స్పష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ-రాజకీయ శైలి. ‘ధర్మశాస్త్రం’ మరియు ‘చట్టం’ అనే భేదం దేవుని తోరా సందర్భాన్నీ పర్షియా రాజన్య న్యాయ సందర్భాన్నీ సహజంగా వ్యక్తపరుస్తుంది. శిక్షల జాబితాను సమాంతర ‘-గానీ’ నిర్మాణంతో పఠనసౌలభ్యంగా ఇచ్చాం.
