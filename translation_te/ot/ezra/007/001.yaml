source:
  edition: WLC
  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: te
  text: ఈ సంగతుల తరువాత, పారసీక రాజైన అర్తహషస్త పరిపాలన కాలంలో, శెరాయా కుమారుడు[a], అజర్యా కుమారుడు, హిల్కీయా కుమారుడు అయిన ఎజ్రా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళుల్లో హెబ్రీ ‘కుమారుడు’ అనే పదం ప్రత్యక్ష కుమారుణ్ణే కాకుండా, కొన్నిసార్లు తరువాతి తరానికి చెందిన వంశస్థుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: తరువాత
  rationale: వావ్ ముందటి వృత్తాంతంతో అనుసంధానిస్తుంది; తెలుగులో వాక్యప్రవాహం ద్వారా ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది. మూలంలో లేని ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు
  rationale: ఇది ముందుగా వివరించిన విషయాలు లేదా సంఘటనలను సూచించే సహజమైన తెలుగు ప్రయోగం; ‘సంఘటనలు’ అని మరీ నిర్దిష్టం చేయకుండా హెబ్రీ విస్తృతిని నిలుపుతుంది.
- source_word: בְּ/מַלְכוּת
  choice: పరిపాలన కాలంలో
  rationale: ఇక్కడ రాజ్యభూభాగం కాకుండా రాజు పాలించిన కాలం ఉద్దేశించబడింది; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: అర్తహషస్త
  rationale: హెబ్రీ రూపానికి దగ్గరగా ఉండి, తెలుగు బైబిలు నామరూప సంప్రదాయంలో గుర్తించదగిన రూపం.
- source_word: מֶלֶךְ פָּרָס
  choice: పారసీక రాజు
  rationale: పర్షియా దేశానికి సంబంధించిన రాజు అనే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֶזְרָא
  choice: ఎజ్రా
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి సూత్రంలోని సాధారణ అర్థాన్ని నిలుపుతుంది. ఇది ప్రతిసారి ప్రత్యక్ష తండ్రి–కొడుకు సంబంధాన్నే సూచించకపోవచ్చనే విస్తృతిని పాదటిప్పణిలో తెలిపాం.
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: మూల నామానికి సమీపమైన, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణ.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: మూల నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: חִלְקִיָּה
  choice: హిల్కీయా
  rationale: మూల నామానికి సమీపమైన, పరిచిత తెలుగు లిప్యంతరీకరణ.
