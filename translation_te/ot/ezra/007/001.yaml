translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వృత్తాంత శైలిని వాడాం. హెబ్రీ వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివరలో దీర్ఘవిరామ చిహ్నం ఉంచాం. వంశావళి వరుసలోని పునరుక్త ‘కుమారుడు’ నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలిపి, సంబంధాలను ‘మనుమడు/మునిమనుమడు’గా మార్చి మూలంలో లేని ఖచ్చితత్వాన్ని రుద్దలేదు.
