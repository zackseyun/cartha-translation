revisions:
- from: మన పితరుల దేవుడైన యెహోవా స్తుతింపబడుగాక! యెరూషలేములో ఉన్న యెహోవా మందిరాన్ని శోభాయమానంగా చేయాలనే ఈ సంకల్పాన్ని రాజు హృదయంలో ఉంచినవాడు ఆయనే.
  to: యెరూషలేములో ఉన్న యాహ్వే మందిరాన్ని శోభాయమానంగా చేయడానికి ఈ విషయాన్ని రాజు హృదయంలో ఉంచిన మన పితరుల దేవుడైన యాహ్వే స్తుతింపబడుగాక!
  rationale: The revision restores a direct Hebrew-style benediction, renders the divine name in line with the POB policy, avoids over-specifying the demonstrative, and retains the concrete sense of לְפָאֵר. The footnote supplies the same lexical alternatives recorded in the English audit trail.
