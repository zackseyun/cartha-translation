id: EZR.7.27
reference: Ezra 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: te
  text: యెరూషలేములో ఉన్న యాహ్వే మందిరాన్ని శోభాయమానంగా చేయడానికి ఈ విషయాన్ని రాజు హృదయంలో ఉంచిన మన పితరుల దేవుడైన యాహ్వే స్తుతింపబడుగాక!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దైవస్తుతి సూత్రంలో వాడిన కర్మణి భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు ఆశీర్వచన రూపంలో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: మన పితరుల దేవుడు
  rationale: మూలంలోని నిబంధనాత్మక, పితృసంబంధ వ్యక్తీకరణను నేరుగా కాపాడుతుంది.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: ఈ సంకల్పాన్ని రాజు హృదయంలో ఉంచినవాడు
  rationale: హీబ్రూ పదబంధం రాజులో కలిగించిన ఉద్దేశం లేదా తీర్మానాన్ని సూచిస్తుంది; తెలుగులో ‘ఈ సంకల్పం’ సందర్భార్థాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: לְפָאֵר
  choice: శోభాయమానంగా చేయాలని
  rationale: పియేల్ క్రియ యొక్క మందిరాన్ని అలంకరించి వైభవపరచే స్పష్టమైన భావాన్ని అందిస్తుంది; కేవలం నైరూప్యమైన ‘మహిమపరచు’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా గృహం’ అయినా, సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: యెరూషలేములో ఉన్న
  rationale: మందిరం ఉన్న స్థలాన్ని తెలిపే సంబంధవాక్యాన్ని సరళంగా అనువదిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన రూపం.
- issue: לְפָאֵר యొక్క భావవ్యాప్తి
  choice: శోభాయమానంగా చేయడం
  alternative: అలంకరించడం / మహిమపరచడం
  rationale: ఈ సందర్భంలో మందిరానికి వైభవం చేకూర్చే concrete భావాన్ని ప్రధానంగా ఉంచి, ‘మహిమపరచడం’ వల్ల కలగగల అతిగా నైరూప్యమైన ధార్మిక అర్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన దైవస్తుతి శైలి. మూలంలోని ఒక్క వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ఆశ్చర్యార్థక వాక్యంగా, దానికి అనుసంధానమైన ప్రకటనగా అమర్చినా భావసంబంధం పూర్తిగా నిలుపబడింది.
