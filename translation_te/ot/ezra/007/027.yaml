    reason: లְפָאֵר యొక్క సాధ్యమైన పదార్థ ప్రత్యామ్నాయాలను తెలియజేస్తుంది.
  revision_rationale: The revision restores a direct Hebrew-style benediction, renders the divine name in line with the POB policy, avoids over-specifying the demonstrative, and retains the concrete sense of לְפָאֵר. The footnote supplies the same lexical alternatives recorded in the English audit trail.
