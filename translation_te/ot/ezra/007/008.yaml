  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥א יְרוּשָׁלִַ֖ם בַּ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֑י הִ֛יא שְׁנַ֥ת הַ/שְּׁבִיעִ֖ית לַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/008.yaml
  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: te
  text: అతడు ఐదవ నెలలో యెరూషలేముకు వచ్చాడు; అది రాజు పరిపాలనలో ఏడవ సంవత్సరం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే సాధారణ గమన క్రియను కథన క్రమంలో సహజమైన ఆధునిక తెలుగులో ‘వచ్చాడు’గా అనువదించాం; ‘చేరుకున్నాడు’ కూడా సాధ్యమే గాని అది గమ్యస్థానానికి చేరడాన్ని కొంత ఎక్కువగా నొక్కిచెబుతుంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: ఐదవ నెలలో
  rationale: ב ఉపసర్గ ఇక్కడ కాలసూచకమైనది; ‘ఐదవ నెలలో’ మూలంలోని పంచాంగ సూచనను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: הִיא
  choice: అది
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ముందున్న కాలసూచనను తిరిగి సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘అది’ ఈ వివరణాత్మక అనుసంధానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: ఏడవ సంవత్సరం
  rationale: రాజు పాలనను బట్టి లెక్కించే క్రమసంఖ్యా సంవత్సరాన్ని సహజ తెలుగులో ‘ఏడవ సంవత్సరం’గా అందించాం.
- source_word: לַמֶּלֶךְ
  choice: రాజు పరిపాలనలో
  rationale: రాజ్యపాలనా సంవత్సరాన్ని సూచించే ל సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది. సందర్భంలోని రాజు పేరును మూల వచనంలో లేకపోవడంతో చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలో నెల సూచన తరువాత వచ్చే స్వతంత్ర వివరణాత్మక భాగాన్ని సెమికోలన్‌తో నిలిపాం. మూలంలోని భావాన్ని స్పష్టంచేయడానికి ‘రాజు పరిపాలనలో’ అన్న సహజ తెలుగు రాజ్యకాల ప్రయోగాన్ని వాడాం.
