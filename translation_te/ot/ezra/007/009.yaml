id: EZR.7.9
reference: Ezra 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֗י בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן ה֣וּא יְסֻ֔ד הַֽ/מַּעֲלָ֖ה מִ/בָּבֶ֑ל וּ/בְ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֗י בָּ֚א אֶל יְר֣וּשָׁלִַ֔ם כְּ/יַד אֱלֹהָ֖י/ו הַ/טּוֹבָ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: te
  text: ఎందుకంటే, మొదటి నెల మొదటి రోజున అతడు బబులోను నుండి పైకి వెళ్లే ప్రయాణాన్ని ప్రారంభించాడు; ఐదవ నెల మొదటి రోజున తన దేవుని కృపాహస్తం అతనిమీద ఉండడం వల్ల అతడు యెరూషలేముకు చేరుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: యెరూషలేముకు ప్రయాణం ప్రారంభించాడు
  rationale: యְסֻד అనే రూపం అక్షరార్థంగా ‘స్థాపించబడింది/పునాది వేయబడింది’ అనే భావాన్ని కలిగించినా, הַמַּעֲלָהతో కలిసి ఇక్కడ బబులోను నుండి పైకి వెళ్లే ప్రయాణాన్ని ప్రారంభించడాన్ని సూచిస్తుంది. గమ్యమైన యెరూషలేమును సందర్భానుసారంగా స్పష్టంచేశాం.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: తన దేవుని దయగల హస్తం అతనికి తోడుగా ఉన్నందున
  rationale: ‘మంచి హస్తం అతనిమీద’ అనే హీబ్రూ రూపకాన్ని ‘దయగల హస్తం’గా నిలుపుతూ, כְּ యొక్క సందర్భార్థమైన కారణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּא אֶל יְרוּשָׁלִַם
  choice: యెరూషలేముకు చేరుకున్నాడు
  rationale: ఇక్కడ בוא అనేది గమ్యస్థానానికి రావడం/చేరడం; ప్రయాణ సందర్భంలో ‘చేరుకున్నాడు’ సహజమైన తెలుగు.
theological_decisions:
- issue: దేవుని హస్తం అనే రూపకం
  choice: ‘దయగల హస్తం’ అనే రూపకాన్ని నిలుపుకున్నాం
  alternative: ‘దేవుని అనుగ్రహం వల్ల’
  rationale: మూలంలోని దేవుని ప్రత్యక్ష సహాయం, రక్షణ అనే భావాన్ని కలిగించే శరీరరూపకాన్ని తొలగించకుండా, ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా ఉంచాం.
- issue: כְּ యొక్క సంబంధం
  choice: కారణార్థంగా ‘ఉన్నందున’
  alternative: పద్ధతి/ప్రమాణార్థంగా ‘ప్రకారం’
  rationale: ప్రయాణం విజయవంతంగా పూర్తికావడానికి దేవుని అనుకూల హస్తమే కారణమని సందర్భం సూచిస్తుంది; అయితే మూలంలోని రూపకాన్ని కూడా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన వాక్య నిర్మాణం. హీబ్రూ ప్రయాణ వర్ణనను సహజ తెలుగు కాలక్రమంలో అందించాం.
