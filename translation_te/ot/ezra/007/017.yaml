  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రాజాజ్ఞలోని విధ్యర్థక బలానికి ‘కొనాలి’, ‘అర్పించాలి’ వాడబడ్డాయి. ‘వెండి’ అనే మూల పదచిత్రం అలాగే ఉంచబడింది; ‘ధాన్యార్పణలు’, ‘పానార్పణలు’ బలిసంబంధ పదజాలాన్ని స్పష్టంగా తెలియజేస్తాయి.
