  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: te
  text: కాబట్టి ఈ వెండితో ఎద్దులను, పొట్టేళ్లను, గొర్రెపిల్లలను, వాటికి సంబంధించిన ధాన్యార్పణాలను, వాటికి సంబంధించిన పానీయార్పణాలను జాగ్రత్తగా[a] కొనాలి. వాటిని యెరూషలేములో ఉన్న మీ దేవుని మందిరపు[b] బలిపీఠం మీద అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కచ్చితంగా’ లేదా ‘శ్రద్ధగా’ అని కూడా అనువదించవచ్చు; అరామీయ క్రియావిశేషణం ఆదేశాన్ని జాగ్రత్తగా, ఖచ్చితంగా అమలు చేయడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీ దేవుని ఇంటి బలిపీఠం.’ ఇక్కడ ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: కాబట్టి
  rationale: ఈ అరామీయ నుడికారం ముందున్న ఆదేశాల నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ‘కాబట్టి’ సహజంగా ఆ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: אָסְפַּרְנָא
  choice: జాగ్రత్తగా
  rationale: ఆదేశాన్ని శ్రద్ధతో, కచ్చితంగా అమలు చేయాలనే క్రియావిశేషణ బలాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִקְנֵא
  choice: కొనాలి
  rationale: మూల క్రియకు ‘కొను’ అనే ప్రత్యక్ష అర్థం ఉంది; రాజాజ్ఞలోని విధ్యర్థక బలాన్ని ‘కొనాలి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּכַסְפָּא דְנָה
  choice: ఈ వెండితో
  rationale: పరిపాలనా సందర్భంలో ఇది ధనాన్ని సూచించినా, మూలంలోని ‘వెండి’ అనే పదచిత్రాన్ని నిలుపుతుంది.
- source_word: תּוֹרִין
  choice: ఎద్దులను
  rationale: బలుల సందర్భంలో వయోజన మగ పశువులను సూచించే సహజమైన తెలుగు పదం.
- source_word: דִּכְרִין
  choice: పొట్టేళ్లను
  rationale: మగ గొర్రెలను సూచించే ప్రామాణిక, సాధారణ తెలుగు సమానార్థకం.
- source_word: אִמְּרִין
  choice: గొర్రెపిల్లలను
  rationale: బలుల జాబితాలోని చిన్న గొర్రెలను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: מִנְחָתְהוֹן
  choice: వాటికి సంబంధించిన ధాన్యార్పణలను
  rationale: బలులతో పాటు సమర్పించే ధాన్య నైవేద్యాలను సూచిస్తుంది; ‘వాటికి సంబంధించిన’ అనేది అరామీయ స్వామ్య ప్రత్యయ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: נִסְכֵּיהוֹן
  choice: పానార్పణలను
  rationale: పోయబడే ద్రవ అర్పణలకు సంక్షిప్తమైన, అర్థవంతమైన ఆరాధనా పదం.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: వాటిని ... అర్పించాలి
  rationale: ‘దగ్గరకు తీసుకురావడం/సమర్పించడం’ అనే బలిసంబంధ క్రియను సందర్భానుసారంగా ‘అర్పించాలి’ తెలియజేస్తుంది.
- source_word: עַל מַדְבְּחָה
  choice: బలిపీఠం మీద
  rationale: మూలంలోని స్థానార్థక సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: בֵּית אֱלָהֲכֹם
  choice: మీ దేవుని మందిరపు
  rationale: అక్షరార్థం ‘మీ దేవుని ఇల్లు’; ఇక్కడ దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ సహజంగా ఉంది, ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
