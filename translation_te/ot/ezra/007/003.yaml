translation:
  language: te
  text: అమర్యా కుమారుడు[a], అజర్యా కుమారుడు, మెరాయోతు కుమారుడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళుల్లో ‘కుమారుడు’ అనే మాట తక్షణ కుమారుణ్ణే కాకుండా, ఆ వంశంలోని తరువాతి తరానికి చెందిన వారసుణ్ణి కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి వరుసలో בֶּן‌కు సహజమైన, పాఠ్యానికి పారదర్శకమైన తెలుగు రూపం ‘కుమారుడు’. అయితే ఇది ప్రతి సందర్భంలోనూ తక్షణ తండ్రీకొడుకుల సంబంధాన్నే సూచించకపోవచ్చు; ఆ సాంస్కృతిక ప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: אֲמַרְיָה
  choice: అమర్యా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מְרָיוֹת
  choice: మెరాయోతు
  rationale: హీబ్రూ పేరులోని ధ్వనులను సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన భాషను ఉపయోగించాం. ఈ వచనం తరువాతి వంశావళి వరుసతో కొనసాగుతున్నందున ముగింపులో దీర్ఘవిరామ చిహ్నం ఉంచాం.
