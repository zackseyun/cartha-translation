  source_fidelity: హీబ్రూ మూలంలోని పునరావృతమైన בֶּן (“కుమారుడు”) వంశావళి నిర్మాణం, అలాగే అమర్యా, అజర్యా, మెరాయోతు అనే మూడు వ్యక్తిపేర్లు క్రమాన్ని మార్చకుండా సరిగ్గా ప్రతిఫలించబడ్డాయి. వచనం ముందున్న ప్రధాన వ్యక్తిని సూచించే అసంపూర్ణ వంశావళి వరుసగా ఉండటాన్ని చివరి దీర్ఘవిరామం సముచితంగా సూచిస్తుంది.
