id: EZR.7.24
reference: Ezra 7:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: te
  text: యాజకులు, లేవీయులు, గాయకులు, ద్వారపాలకులు, ఆలయ సేవకులు[a], ఈ దేవుని మందిరంలో సేవచేసేవారు—వీరిలో ఎవరి మీదా కప్పం, పన్ను లేదా సుంకం[b] విధించడానికి అనుమతి లేదని మీకు తెలియజేస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నెతీనీయులు’; ఇది נְתִינַיָּא అనే అరామీయ పదానికి సంప్రదాయ లిప్యంతరీకరణ.
    reason: lexical_alternative
  - marker: b
    text: ఈ మూడు రాజస్వ పదాలు బహుశా సామ్రాజ్యానికి చెల్లించే వేర్వేరు రకాల విధింపులను సూచిస్తాయి. ‘కప్పం, పన్ను లేదా సుంకం’ అనే పదబంధాన్ని ‘కప్పం, రుసుము లేదా రవాణా సుంకం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: మీకు తెలియజేస్తున్నాం
  rationale: అధికారిక ప్రకటనను సూచించే అరామీయ భాగధాతు రూపం; ఆధునిక తెలుగులో పరిపాలనా గంభీరతను సహజంగా నిలుపుతుంది.
- source_word: כָל
  choice: వీరిలో ఎవరి మీదా
  rationale: వ్యక్తుల వర్గాల జాబితాను అనుసరించే నిషేధ వాక్యంలో, జాబితాలోని ఒక్కరిపైనా విధించరాదనే సమగ్ర భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּהֲנַיָּא וְלֵוָיֵא זַמָּרַיָּא תָרָעַיָּא
  choice: యాజకులు, లేవీయులు, గాయకులు, ద్వారపాలకులు
  rationale: ఆలయ సంబంధిత ఆయా వర్గాలకు స్పష్టమైన, ప్రామాణిక ఆధునిక తెలుగు పదాలు.
- source_word: נְתִינַיָּא
  choice: ఆలయ సేవకులు
  rationale: అపరిచిత లిప్యంతరీకరణకన్నా ఈ వర్గపు ఆలయ సేవా పాత్రను పాఠకులకు నేరుగా తెలియజేస్తుంది; సంప్రదాయ నామాన్ని పాదసూచికలో ఉంచాం.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: ఈ దేవుని మందిరంలో సేవచేసేవారు
  rationale: మూలంలోని విస్తృతమైన సేవచేయడం/పరిచర్య చేయడం అనే భావాన్ని, ముందున్న ప్రత్యేక వర్గంతో కలపకుండా నిలుపుతుంది; మూలంలో లేని ‘ఇతర’ అనే పదాన్ని చేర్చదు.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: కప్పం, పన్ను లేదా సుంకం
  rationale: మూడు వేర్వేరు రాజస్వ విధాలున్న పరిపాలనా సూత్రాన్ని తెలుగులో మూడు ప్రత్యేక పదాలతో నిలుపుతుంది.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: వీరిలో ఎవరి మీదా … విధించడానికి అనుమతి లేదు
  rationale: అధికారం లేదా చట్టబద్ధ అనుమతి లేదనే న్యాయపరమైన నిషేధాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అధికారిక ప్రకటన శైలి. ఆలయ వర్గాల పేర్లు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఇచ్చాం; అరామీయ మూలంలోని జాబితా, న్యాయపరమైన నిషేధం, మూడు రకాల రాజస్వ పదాల భేదం నిలుపబడ్డాయి.
