  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: te
  text: మరియు బబులోను పరిపాలనా ప్రాంతమంతటిలో నీకు దొరికే వెండి బంగారమంతటినీ, యెరూషలేములో ఉన్న తమ దేవుని మందిరం[b] కోసం ప్రజలూ యాజకులూ స్వచ్ఛందంగా అర్పించే కానుకతో[a] కలిపి తీసుకెళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇష్టపూర్వక కానుకతో.” అరామిక్ పదం స్వచ్ఛందంగా ఇచ్చే కానుకను, ముఖ్యంగా ఆరాధనా సందర్భంలో ఇచ్చే కానుకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో “తమ దేవుని ఇల్లు.” ఇది యెరూషలేములోని దేవాలయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל
  choice: అలాగే … అంతటినీ
  rationale: ముందరి వాక్యంతో అనుసంధానాన్ని చూపుతూ, כֹל యొక్క సమగ్ర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּסַף וּדְהַב
  choice: వెండి బంగారమంతటినీ
  rationale: రెండు విలువైన లోహాలను సహజమైన తెలుగు జంటగా ఉంచి, כֹלతో ఉన్న సమగ్రతను ‘అంతటినీ’ ద్వారా తెలిపింది.
- source_word: דִּי תְהַשְׁכַּח
  choice: నీకు దొరికే
  rationale: ఎజ్రాను ఉద్దేశించిన ద్వితీయ పురుష రూపాన్ని స్పష్టంగా ఉంచి, క్రియ యొక్క సాధారణ ‘కనుగొను/పొందు’ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: బబులోను రాష్ట్రమంతటిలో
  rationale: מְדִינָהను సామ్రాజ్య పరిపాలనా ప్రాంతంగా ‘రాష్ట్రం’తో సూచించి, మొత్తం ప్రాంతమనే భావాన్ని నిలుపుతుంది.
- source_word: עִם
  choice: …తో కలిపి
  rationale: వెండి బంగారానికి మరొక మూలం నుంచి వచ్చిన కానుకను జతచేస్తున్న భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִתְנַדָּבוּת
  choice: స్వచ్ఛందంగా అర్పించే కానుక
  rationale: ఇష్టపూర్వకంగా ఇచ్చే, ముఖ్యంగా ఆరాధనా సందర్భంలోని కానుక అనే భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: ప్రజలు, యాజకులు
  rationale: అరామిక్ పదాల రెండు సమూహాలను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: מִתְנַדְּבִין
  choice: స్వచ్ఛందంగా అర్పించే
  rationale: కొనసాగుతున్న లేదా ఉద్దేశపూర్వక స్వచ్ఛంద చర్యను చూపుతూ, הִתְנַדָּבוּתతో ఉన్న ఒకే మూలపద సంబంధాన్ని భావపరంగా కాపాడుతుంది.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: తమ దేవుని మందిరం కోసం
  rationale: కానుక యొక్క గమ్యాన్ని ‘కోసం’తో స్పష్టం చేసింది; ‘మందిరం’ ఆలయార్థక ‘దేవుని ఇల్లు’ అనే నుడికారానికి సహజ తెలుగు సమానం.
- source_word: דִּי בִירוּשְׁלֶם
  choice: యెరూషలేములో ఉన్న
  rationale: మందిరం ఉన్న స్థలాన్ని తెలిపే సంబంధ వాక్యాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: לְבֵית אֱלָהֲהֹם లోని ‘దేవుని ఇల్లు’ అనే ఆలయ నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘తమ దేవుని మందిరం’
  alternative: ‘తమ దేవుని ఇల్లు’
  rationale: ‘మందిరం’ సందర్భంలోని ఆలయాన్ని అపార్థం లేకుండా తెలియజేస్తుంది; మూలంలోని రూపకాన్ని పాదసూచికలో వెల్లడించడం ద్వారా దాని సాంస్కృతిక స్వరూపాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఈ వాక్యం ముందరి ఆజ్ఞలోని జాబితాను కొనసాగిస్తున్నందున ‘అలాగే’తో అనుసంధానించబడింది; తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భంలో అంతర్భూతమైన ‘తీసుకెళ్లు’ను చివర చేర్చాం. ఆరాధనా సందర్భాన్ని అతిగా మతశాఖాపరంగా చేయకుండా ‘స్వచ్ఛందంగా అర్పించే కానుక’ అని అనువదించాం.
