    text: లేదా “ఇష్టపూర్వక కానుకతో.” అరామిక్ పదం స్వచ్ఛందంగా ఇచ్చే కానుకను, ముఖ్యంగా ఆరాధనా సందర్భంలో ఇచ్చే కానుకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
