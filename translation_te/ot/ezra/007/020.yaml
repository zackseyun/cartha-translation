- from: నీ దేవుని మందిరానికి ఇంకా ఏదైనా అవసరం ఉండి, దాన్ని సమకూర్చడం నీ బాధ్యతగా వస్తే, రాజు ఖజానాల గృహం నుండి[a] దాన్ని సమకూర్చాలి.
  to: నీ దేవుని మందిరానికి ఇంకా ఏదైనా అవసరాన్ని సమకూర్చే బాధ్యత నీపై పడితే, దానిని రాజు ఖజానాల గృహం నుండి[a] సమకూర్చాలి.
  rationale: The revision preserves every principal element of the Aramaic while making the obligation clause natural and precise in modern standard Telugu. It retains the formal treasury expression in the text and preserves the existing anchored lexical footnote.
