source:
  edition: WLC
  text: וּ/שְׁאָ֗ר חַשְׁחוּת֙ בֵּ֣ית אֱלָהָ֔/ךְ דִּ֥י יִפֶּל לָ֖/ךְ לְ/מִנְתַּ֑ן תִּנְתֵּ֕ן מִן בֵּ֖ית גִּנְזֵ֥י מַלְכָּֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: te
  text: నీ దేవుని మందిరానికి ఇంకా ఏదైనా అవసరాన్ని సమకూర్చే బాధ్యత నీపై పడితే, దానిని రాజు ఖజానాల గృహం నుండి[a] సమకూర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “రాజు ఖజానా నుండి.” అరామీలో మరింత అక్షరార్థంగా, “రాజు ఖజానాల గృహం నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: ఇంకా ఏదైనా అవసరం
  rationale: ‘మిగిలిన/అదనపు అవసరం’ అనే భావాన్ని సందర్భానికి తగిన సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అవసరాన్ని కేవలం ఖర్చుకే పరిమితం చేయదు.
- source_word: בֵּית אֱלָהָךְ
  choice: నీ దేవుని మందిరం
  rationale: అరామీ ‘నీ దేవుని ఇల్లు’ అనే ఆలయసూచక ప్రయోగాన్ని, ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ‘మందిరం’ అని అందిస్తుంది.
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: దాన్ని సమకూర్చడం నీ బాధ్యతగా వస్తే
  rationale: అక్షరార్థంలోని ‘నీ మీద పడితే’ అనే రూపకాన్ని పూర్తిగా తొలగించకుండా, ఇక్కడి బాధ్యత లేదా కర్తవ్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תִּנְתֵּן
  choice: దాన్ని సమకూర్చాలి
  rationale: ‘ఇవ్వాలి’ అనే మూలభావాన్ని పరిపాలనా, సరఫరా సందర్భంలో సహజంగా వ్యక్తం చేస్తూ, సందర్భంలో అంతర్లీనంగా ఉన్న కర్మను స్పష్టం చేస్తుంది.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: రాజు ఖజానాల గృహం నుండి
  rationale: ‘రాజు ఖజానాల/నిధిగదుల గృహం నుండి’ అనే మూల నిర్మాణాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; సహజమైన సంక్షిప్త రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాజ్ఞకు తగిన గౌరవప్రదమైన పరిపాలనా శైలిని ఉపయోగించాం. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’ ద్వారా నిలిపి, ఆజ్ఞార్థక బలాన్ని ‘సమకూర్చాలి’తో వ్యక్తం చేశాం.
