review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the additional unspecified need, the temple/house of the addressee’s God, the assigned obligation to supply it, and the royal treasury source. A slight syntactic revision more directly reflects the Aramaic relative-obligation construction ("which falls to you to provide") without introducing an awkward conditional sequence.
  naturalness: The current wording is understandable, but “ఉండి, దాన్ని సమకూర్చడం నీ బాధ్యతగా వస్తే” is somewhat cumbersome. “సమకూర్చే బాధ్యత నీపై పడితే” is more idiomatic modern Telugu and retains the source metaphor of an obligation falling upon someone.
  terminology: “మందిరం” is a suitable contextual rendering of the temple idiom. “ఖజానాల గృహం” appropriately retains the deliberately formal source expression; the footnote supplies the smoother alternative. “సమకూర్చు” fits the administrative provisioning context.
  issues:
  - severity: low
    issue: The obligation clause is syntactically awkward.
    rationale: The sequence “అవసరం ఉండి, దాన్ని సమకూర్చడం నీ బాధ్యతగా వస్తే” adds an unnecessary preliminary condition and is less natural than expressing directly that the responsibility falls upon the addressee.
  revised_text: నీ దేవుని మందిరానికి ఇంకా ఏదైనా అవసరాన్ని సమకూర్చే బాధ్యత నీపై పడితే, దానిని రాజు ఖజానాల గృహం నుండి[a] సమకూర్చాలి.
  revised_footnotes:
  - marker: a
    text: మరింత సహజంగా, “రాజు ఖజానా నుండి.” అరామీలో మరింత అక్షరార్థంగా, “రాజు ఖజానాల గృహం నుండి.”
    reason: lexical_alternative
  revision_rationale: The revision preserves every principal element of the Aramaic while making the obligation clause natural and precise in modern standard Telugu. It retains the formal treasury expression in the text and preserves the existing anchored lexical footnote.
