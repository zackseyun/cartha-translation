- from: ఎందుకంటే ఎజ్రా యెహోవా ధర్మశాస్త్రాన్ని పరిశోధించి[a], దాని ప్రకారం నడుచుకొని, ఇశ్రాయేలులో కట్టడలను, న్యాయవిధులను బోధించాలని తన హృదయాన్ని సిద్ధపరచుకున్నాడు[b].
  to: ఎజ్రా యెహోవా ధర్మశాస్త్రాన్ని పరిశోధించడానికి[a], దానిని ఆచరించడానికి, ఇశ్రాయేలులో కట్టడలను, న్యాయవిధులను బోధించడానికి తన హృదయాన్ని సిద్ధపరచుకున్నాడు[b].
