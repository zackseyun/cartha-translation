source:
  edition: WLC
  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: te
  text: ఎజ్రా యెహోవా ధర్మశాస్త్రాన్ని పరిశోధించడానికి[a], దానిని ఆచరించడానికి, ఇశ్రాయేలులో కట్టడలను, న్యాయవిధులను బోధించడానికి తన హృదయాన్ని సిద్ధపరచుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెదకి తెలుసుకోవడానికి,’ ‘అధ్యయనం చేయడానికి.’ హీబ్రూ పదం శ్రద్ధగా వెదకడం, విచారించడం అనే భావాలనూ కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన హృదయాన్ని స్థిరపరచుకున్నాడు’ లేదా ‘తన మనసును దృఢంగా నిర్ణయించుకున్నాడు.’ ఈ హీబ్రూ నుడికారం ఉద్దేశపూర్వకమైన అంతరంగ నిర్ణయాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో ఎజ్రాకు కలిగిన అనుగ్రహం, విజయానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֵכִין לְבָבוֹ
  choice: తన హృదయాన్ని సిద్ధపరచుకున్నాడు
  rationale: హిఫీల్ రూపంలోని כון మరియు ‘హృదయం’ కలిసిన ఈ నుడికారం ఉద్దేశపూర్వకమైన అంతరంగ నిర్ణయాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో మూడు క్రియలన్నింటినీ ఈ నిర్ణయానికి అనుసంధానిస్తుంది.
- source_word: לִדְרוֹשׁ
  choice: పరిశోధించి
  rationale: דרש కు వెదకడం, విచారించడం, అధ్యయనం చేయడం అనే విస్తృతి ఉంది. ధర్మశాస్త్ర సందర్భంలో ‘పరిశోధించడం’ శ్రద్ధగా తెలుసుకోవడాన్ని వ్యక్తం చేస్తూ, కేవలం విద్యాసంబంధ అధ్యయనానికే భావాన్ని పరిమితం చేయదు.
- source_word: תּוֹרַת יְהוָה
  choice: యెహోవా ధర్మశాస్త్రం
  rationale: ఈ యాజక-శాస్త్రి సందర్భంలో תּוֹרָה సాధారణ ఉపదేశం కంటే నిబంధన సంబంధమైన ధర్మశాస్త్రాన్ని సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా ప్రత్యక్షంగా ఉంచాం.
- source_word: וְלַעֲשֹׂת
  choice: దాని ప్రకారం నడుచుకొని
  rationale: హీబ్రూలో ప్రత్యక్ష కర్మ పేర్కొనకపోయినా ముందున్న ధర్మశాస్త్రమే భావిత కర్మ. ‘దాని ప్రకారం నడుచుకోవడం’ ఆచరణాత్మక విధేయతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּלְלַמֵּד
  choice: బోధించాలని
  rationale: Piel రూపం బోధించడం లేదా నేర్పించడం అనే సూటి భావాన్నిస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఎజ్రా బోధనా సేవ జరిగిన సమాజపరమైన పరిధిని నేరుగా సూచిస్తుంది.
- source_word: חֹק וּמִשְׁפָּט
  choice: కట్టడలను, న్యాయవిధులను
  rationale: ఏకవచన రూపాలు ఇక్కడ సమూహార్థంలో వాడబడ్డాయి. సహజ తెలుగులో బహువచనం పెట్టి, మొదటి పదంలోని నిర్దేశిత నియమ భావాన్నీ రెండవ పదంలోని న్యాయపరమైన తీర్పు/విధి భావాన్నీ వేరుగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణగా ఉంచడం మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని కాపాడుతుంది.
- issue: תּוֹרָה యొక్క పరిధి
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం / తోరా
  rationale: నిర్బంధంగా ‘చట్టం’ అనే సంకుచిత భావానికి పరిమితం కాకపోయినా, ఎజ్రా యొక్క యాజక-శాస్త్రి పరిచర్య సందర్భంలో ఇది ఇశ్రాయేలు నిబంధన ధర్మశాస్త్రాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ తెలుగు బైబిలు వాడుకలో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- issue: חֹק וּמִשְׁפָּט యొక్క సంఖ్య, సంబంధం
  choice: కట్టడలను, న్యాయవిధులను
  alternative: కట్టడను, న్యాయవిధిని
  rationale: హీబ్రూ ఏకవచనాలు సమూహార్థకంగా ఉండవచ్చు. తెలుగు పాఠకునికి బోధించబడే నియమాల సమాహారం సహజంగా అర్థమయ్యేలా బహువచనం వాడాం; రెండు న్యాయపదాల భేదాన్ని మాత్రం నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకునికి అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని మూడు దశలు—పరిశోధించడం, ఆచరించడం, బోధించడం—క్రమంగా నిలిపాం. ‘దాని ప్రకారం నడుచుకొని’ అనేది పదశః ‘దానిని చేసి’ కంటే సహజమైన తెలుగు; విధేయత భావాన్ని స్పష్టపరుస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
