source:
  edition: WLC
  text: כָּ/ל קֳבֵ֗ל דִּי֩ מִן קֳדָ֨ם מַלְכָּ֜/א וְ/שִׁבְעַ֤ת יָעֲטֹ֨/הִי֙ שְׁלִ֔יחַ לְ/בַקָּרָ֥א עַל יְה֖וּד וְ/לִֽ/ירוּשְׁלֶ֑ם בְּ/דָ֥ת אֱלָהָ֖/ךְ דִּ֥י בִ/ידָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: te
  text: ఎందుకంటే, నీ చేతిలో ఉన్న[b] నీ దేవుని ధర్మశాస్త్రం ప్రకారం యూదా, యెరూషలేముల విషయమై పరిశీలించడానికి రాజు మరియు అతని ఏడుగురు సలహాదారుల సన్నిధి నుండి[a] నీవు పంపబడ్డావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాజు మరియు అతని ఏడుగురు సలహాదారుల సమక్షం నుండి.’ ఈ అరామీయ ఆస్థాన ప్రయోగం ఎజ్రా నియామకం రాజాసన్నిధి నుండి వచ్చిందని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా ‘నీ అధీనంలో ఉన్నది’ లేదా ‘నీకు అప్పగించబడినది.’ అక్షరార్థం: ‘నీ చేతిలో ఉన్నది.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: ఎందుకంటే
  rationale: ఈ అరామీయ ఆచారప్రయోగం ఆజ్ఞాపత్రంలోని కారణాన్ని పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆధునిక తెలుగులో సహజంగా ఉండి కారణార్థాన్ని నిలుపుతుంది.
- source_word: מִן קֳדָם מַלְכָּא
  choice: రాజు ... సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘రాజు ఎదుటి నుండి/సన్నిధి నుండి.’ ఇది ఎజ్రా పొందిన అధికారిక రాజాజ్ఞ రాజసన్నిధి నుండే వచ్చిందని తెలిపే ఆస్థాన ప్రయోగం.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: అతని ఏడుగురు సలహాదారులు
  rationale: ఈ నామవాచకం రాజుకు సలహా ఇచ్చే అధికారులను సూచిస్తుంది; ‘సలహాదారులు’ ఆధునిక తెలుగులో స్పష్టమైన ఆస్థాన పదం.
- source_word: שְׁלִיחַ
  choice: నీవు పంపబడ్డావు
  rationale: ఇది ఎజ్రా అధికారికంగా పంపబడిన స్థితిని తెలిపే కర్మణి కృదంతం. ‘పంపబడ్డావు’ మూలంలోని కర్మణి రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְבַקָּרָא
  choice: విచారించడానికి
  rationale: ఈ క్రియ వెదికి తెలుసుకోవడం, పరిశీలించడం, విచారణ చేయడం అనే భావాలను కలిగి ఉంది. పరిపాలనా సందర్భంలో ‘విచారించడానికి’ తగిన విస్తృతార్థాన్ని ఇస్తుంది.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: యూదా, యెరూషలేముల గురించి
  rationale: ఇక్కడ ఉపసర్గ విచారణకు సంబంధించిన ప్రాంతం లేదా విషయాన్ని సూచిస్తుంది. ‘గురించి’ తెలుగులో సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: בְּדָת אֱלָהָךְ
  choice: నీ దేవుని ధర్మశాస్త్రం ప్రకారం
  rationale: విచారణకు ప్రమాణంగా దేవుని ధర్మశాస్త్రం ఉండాలని ఉపసర్గ సూచిస్తుంది. ‘ప్రకారం’ ఆ ప్రమాణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דִּי בִידָךְ
  choice: నీ చేతిలో ఉన్న
  rationale: అక్షరార్థాన్ని నిలుపుతూ, ధర్మశాస్త్రం ఎజ్రా అధీనంలో, సంరక్షణలో లేదా అతనికి అప్పగించబడి ఉందనే సాధ్యమైన భావాలను ఒకదానికే పరిమితం చేయదు.
