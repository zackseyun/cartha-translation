  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పరిపాలనా శైలిని ఉపయోగించాం. మూలంలోని కారణసూచక ఆరంభం, కర్మణి నిర్మాణం, రాజాస్థాన నుడికారం, ‘చేతిలో’ అనే బహుఅర్థక ప్రయోగం నిలుపబడ్డాయి.
