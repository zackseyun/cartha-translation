lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలోని హీబ్రూ నిర్మితరూపం בֶּן‌ను సహజమైన తెలుగు వంశావళి సూత్రంతో ‘కుమారుడు’గా అనువదించాం. వంశావళుల్లో తరాలు సంక్షిప్తం కావచ్చుగానీ, మూలంలోని బంధసూత్రాన్ని విస్తరించి ‘వంశస్థుడు’ అని మార్చలేదు.
- source_word: זְרַחְיָה
  choice: జెరహ్యా
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: హీబ్రూ వ్యక్తిపేరును ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; దాగేశ్ సూచించే ద్విత్వ వ్యంజనాన్ని ‘జ్జీ’తో ప్రతిబింబించాం.
- source_word: בֻּקִּי
  choice: బుక్కీ
  rationale: హీబ్రూ వ్యక్తిపేరును ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; దాగేశ్ సూచించే ద్విత్వ వ్యంజనాన్ని ‘క్కీ’తో ప్రతిబింబించాం.
