translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. ఇది ముందరి వచనం నుంచి కొనసాగి తరువాతి వచనంలో కొనసాగే పేర్ల పరంపర కాబట్టి చివర కామాను నిలిపాం.
