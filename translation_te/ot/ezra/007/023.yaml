id: EZR.7.23
reference: Ezra 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: te
  text: పరలోక దేవుడు ఆజ్ఞాపించినదంతా పరలోక దేవుని మందిరం కోసం[a] శ్రద్ధగా చేయబడాలి. రాజు రాజ్యంపై, అతని కుమారులపై ఉగ్రత ఎందుకు రావాలి?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరాలా, “పరలోక దేవుని ఇల్లు”; ఇది ఆలయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “రాజు రాజ్యంపై, అతని కుమారులపై ఉగ్రత రాకుండా.” మూలంలో ఇది అలంకార ప్రశ్నగా ఉంది.
    reason: translation_alternative
lexical_decisions:
- source_word: כָּל דִּי מִן טַעַם
  choice: ఆజ్ఞ ప్రకారం ఉన్నదంతా
  rationale: כָּל דִּי సమగ్ర భావాన్ని ఇస్తుంది; מִן טַעַם ఆజ్ఞకు మూలం లేదా ప్రమాణాన్ని సూచిస్తుంది. ఈ రూపం సహజమైన తెలుగులో ‘ఆజ్ఞాపించబడినదంతా’ అనే భావాన్ని నిలుపుతుంది.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవుడు
  rationale: ఎజ్రా అరామీయ భాషలోని స్థిరమైన దైవ బిరుదును గౌరవప్రదంగా, ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יִתְעֲבֵד
  choice: జరిగించాలి
  rationale: కర్మణి అసంపూర్ణ క్రియకు సందర్భంలో ఉన్న ఆదేశాత్మక బలాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אַדְרַזְדָּא
  choice: శ్రద్ధగా
  rationale: ఈ అరుదైన పరిపాలనా క్రియావిశేషణంలో ఉన్న జాగ్రత్త, తక్షణత, కచ్చితత్వ భావాలను అతిగా నిర్దిష్టం చేయకుండా సూచిస్తుంది.
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవుని మందిరం కోసం
  rationale: בֵית యొక్క మూలార్థం ‘ఇల్లు’ అయినా, ఇక్కడ అది స్పష్టంగా దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: דִּי לְמָה לֶהֱוֵא קְצַף
  choice: ఉగ్రత ఎందుకు రావాలి?
  rationale: అరామీయంలోని స్పష్టమైన ‘ఎందుకు?’ అనే అలంకార ప్రశ్నను కాపాడుతూ, קְצַף లోని కోపం/ఉగ్రత భావాన్ని నిలుపుతుంది.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: రాజు రాజ్యం మీదికి
  rationale: మూలంలోని ‘రాజు యొక్క రాజ్యం’ నిర్మాణాన్ని అర్థవంతమైన తెలుగులో సన్నిహితంగా నిలుపుతుంది.
- source_word: וּבְנוֹהִי
  choice: అతని కుమారుల మీదికి
  rationale: ‘అతని కుమారులు’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘వంశస్థులు’ అని విస్తరించదు.
theological_decisions:
- issue: בֵית אֱלָהּ שְׁמַיָּא అనే ఆలయ సూచన
  choice: పరలోక దేవుని మందిరం
  alternative: పరలోక దేవుని ఇల్లు
  rationale: ‘ఇల్లు’ మూలానికి మరింత పదశః సమీపమైనా, ఈ సందర్భంలో ఉద్దేశించిన దేవాలయాన్ని ‘మందిరం’ స్పష్టంగా తెలియజేస్తుంది; ఎలాంటి మతశాఖాపరమైన భావాన్నీ చేర్చదు.
- issue: דִּי לְמָה హెచ్చరిక వాక్య నిర్మాణం
  choice: ఉగ్రత ఎందుకు రావాలి?
  alternative: ఉగ్రత రాకుండా
  rationale: మూలంలోని అలంకార ప్రశ్నను ప్రధాన పాఠ్యంలో కాపాడటం ద్వారా నిజమైన వాక్య నిర్మాణం మరియు హెచ్చరిక స్వరం రెండూ నిలుస్తాయి; ప్రత్యామ్నాయం దాని ఉద్దేశ్యార్థాన్ని సహజంగా వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పరిపాలనా-రాజకీయ శైలిని ఉపయోగించాం. మూలంలోని అలంకార ప్రశ్నను నిలిపి, మరింత భావానువాదమైన హెచ్చరిక రూపాన్ని పాదటిప్పణిలో ఇచ్చాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
