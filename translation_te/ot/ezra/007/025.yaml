base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: te
  text: “ఎజ్రా, నీవు నీ వద్దనున్న నీ దేవుని జ్ఞానం ప్రకారం[a], నది అవతలి ప్రాంతంలో ఉన్న ప్రజలందరికీ—నీ దేవుని ధర్మశాసనాలు తెలిసిన వారందరికీ—న్యాయం తీర్చడానికి న్యాయాధికారులను, న్యాయమూర్తులను నియమించు. అవి తెలియనివారికి మీరు[c] బోధించాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ చేతిలో ఉన్న.” ఈ అరామీయ నుడికారం ఒకరి స్వాధీనంలో ఉన్నదాన్నిగానీ, వారికి అప్పగించబడిన అధికారాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ వాక్యం ఎజ్రాను ఏకవచనంలో సంబోధిస్తూ మొదలవుతుంది; అయితే ఇక్కడ మూలంలోని క్రియ బహువచనంలో ఉంది. అది ఎజ్రాతోపాటు అతని సహాయకులను ఉద్దేశించి ఉండవచ్చు.
    reason: textual_grammar
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ דִּי בִידָךְ
  choice: నీకు ఉన్న నీ దేవుని జ్ఞానం ప్రకారం
  rationale: כְּ అనుగుణతను సూచిస్తుంది. ‘నీ చేతిలో’ అనే అరామీయ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగులో ‘నీకు ఉన్న’ అని ఇచ్చి, దాని అక్షరార్థాన్నీ అప్పగించబడిన అధికారమనే సాధ్యమైన భావాన్నీ పాదసూచికలో ఉంచాం.
- source_word: מֶנִּי
  choice: నియమించు
  rationale: పరిపాలనా సందర్భంలో అధికారులను పదవిలో నియమించడమే భావం.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: న్యాయాధికారులను, న్యాయమూర్తులను
  rationale: మూలంలోని రెండు వేర్వేరు న్యాయపరమైన పదవులను ఒకే పదంగా కలపకుండా, తెలుగులో సహజంగా భేదాన్ని నిలిపాం.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: న్యాయం తీర్చేలా
  rationale: నియమించబడే అధికారుల విధి లేదా ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְכָל עַמָּה
  choice: ప్రజలందరికీ
  rationale: సమూహార్థక ఏకవచనాన్ని సహజ తెలుగు సమూహప్రయోగంగా అనువదించాం.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: నది అవతలి ప్రాంతంలో ఉన్న
  rationale: పర్షియా దృష్టిలో యూఫ్రటీసుకు పశ్చిమానున్న పరిపాలనా ప్రాంతాన్ని సూచించే స్థిర భౌగోళిక పదబంధం. ‘ప్రాంతం’ చేర్చడం తెలుగులో దాని పరిపాలనా భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: నీ దేవుని ధర్మశాసనాలు తెలిసిన వారందరికీ
  rationale: דָּתֵי బహువచనాన్ని ‘ధర్మశాసనాలు’గా నిలిపి, మతపరమైన మరియు న్యాయపరమైన సందర్భం రెండింటికీ సరిపోయే పదాన్ని ఎంచుకున్నాం.
- source_word: וְדִי לָא יָדַע
  choice: అవి తెలియనివారికి
  rationale: తెలియని విషయం ముందున్న దేవుని ధర్మశాసనాలేనని తెలుగులో సహజంగా స్పష్టం చేశాం.
- source_word: תְּהוֹדְעוּן
  choice: మీరు బోధించాలి
  rationale: ידע ధాతువు causative రూపానికి ‘తెలియజేయాలి/నేర్పాలి’ అనే భావం ఉంది; ధర్మశాసనాల సందర్భంలో ‘బోధించాలి’ సహజం. మూలంలోని బహువచన సంబోధనను ‘మీరు’తో నిలిపాం.
theological_decisions:
- issue: దేవుని జ్ఞానం ‘చేతిలో’ ఉండటం అనే నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘నీకు ఉన్న’ అని, పాదసూచికలో అక్షరార్థం మరియు అప్పగించబడిన అధికారమనే సాధ్యతను పేర్కొనడం
  alternative: ‘నీ చేతిలో ఉన్న’ లేదా ‘నీకు అప్పగించబడిన’
  rationale: ‘నీ చేతిలో ఉన్న’ తెలుగు పాఠకునికి కృత్రిమంగా అనిపించవచ్చు; ‘నీకు అప్పగించబడిన’ అనడం మాత్రం possession లేదా entrusted authority మధ్య ఉన్న అస్పష్టతను ముందుగానే పరిష్కరిస్తుంది. ఎంపిక చేసిన రూపం రెండింటికీ అవకాశం ఉంచుతుంది.
- issue: వాక్యాంతంలో ఏకవచనం నుంచి బహువచనానికి మార్పు
  choice: ‘నీవు’ తర్వాత మూలంలోని బహువచనాన్ని ‘మీరు’గా నిలిపి పాదసూచిక ఇవ్వడం
  alternative: వాక్యమంతా ‘నీవు’ అనే ఏకవచనంలో సమతలీకరించడం
  rationale: అరామీయ పాఠ్యంలో ఎజ్రాకు ఏకవచన సంబోధనతో మొదలై, చివరి క్రియ బహువచనంలో ఉంది. ఇది ఎజ్రాతోపాటు సహాయకులను చేర్చవచ్చుగాని, దానిని ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని మార్పును నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. రాజాజ్ఞలోని ప్రత్యక్ష ఏకవచన సంబోధనకు ‘నీవు’ను ఉంచాం; చివరి అరామీయ బహువచన క్రియను ఉద్దేశపూర్వకంగా ‘మీరు’గా నిలిపాం. ‘ధర్మశాసనాలు’ మతపరమైన ఆజ్ఞలు మరియు న్యాయపరమైన నియమాలు అనే రెండు ఛాయలను మోయగల పదంగా ఎంచుకున్నాం.
