source:
  edition: WLC
  text: וַ/יַּֽעֲל֣וּ מִ/בְּנֵֽי יִ֠שְׂרָאֵל וּ/מִן הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֜ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שֹּׁעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים אֶל יְרוּשָׁלִָ֑ם בִּ/שְׁנַת שֶׁ֖בַע לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: te
  text: అర్తహషస్త రాజు పాలనలో ఏడవ సంవత్సరంలో ఇశ్రాయేలీయులలో కొందరు[a], యాజకులలో కొందరు, లేవీయులు, గాయకులు, ద్వారపాలకులు, దేవాలయ సేవకులు[b] యెరూషలేముకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు కుమారులలో కొందరు.’ హీబ్రూలోని విభాగార్థం ఇశ్రాయేలు సంతానంలో ఒక భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నెతీనీయులు’; ఇది దేవాలయంలో సేవచేసే ఒక ప్రత్యేక వర్గానికి వాడిన పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: వెళ్లారు
  rationale: ירושלים వైపు ప్రయాణాన్ని సూచించే עלהకు అక్షరార్థంగా ‘ఎక్కి వెళ్లారు’ అనవచ్చు; అయితే ఆధునిక తెలుగులో సహజమైన ‘వెళ్లారు’ను ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో కొందరు
  rationale: מִן యొక్క విభాగార్థాన్ని ‘లో కొందరు’ స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఇశ్రాయేలు కుమారులలో కొందరు’ కన్నా ఇది ఆధునిక తెలుగులో సహజం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సేవకు సంబంధించిన כֹּהֲנִיםకు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, దేవాలయ సేవా వర్గానికి సంబంధించిన స్థిరమైన తెలుగు రూపం.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: దేవాలయ సేవలో పాటలు పాడేవారిని సూచించే పదానికి ‘గాయకులు’ ఖచ్చితమైన సహజ అనువాదం.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: దేవాలయ ద్వారాల బాధ్యత వహించే సేవకులను స్పష్టంగా సూచిస్తుంది.
- source_word: הַנְּתִינִים
  choice: దేవాలయ సేవకులు
  rationale: నెతీనీయులు అనే ప్రత్యేక సేవావర్గపు కార్యాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలిపే అనువాదం.
- source_word: אֶל יְרוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: గమ్యస్థానాన్ని సూచించే אֶלకు సహజమైన తెలుగు రూపం.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: ఏడవ సంవత్సరంలో
  rationale: కాలసూచక హీబ్రూ పదబంధానికి సహజమైన తెలుగు అనువాదం.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: అర్తహషస్త రాజు పాలనలో
  rationale: ‘రాజైన అర్తహషస్తకు ఏడవ సంవత్సరం’ అనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
