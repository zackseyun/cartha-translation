  naturalness: ‘యాజకుడును ఆకాశ దేవుని ధర్మశాస్త్ర లేఖకుడునైన ఎజ్రాకు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజపత్ర శైలికి సరిపోతుంది. ‘సంపూర్ణ శాంతి. ఇక—’ అనే సంక్షిప్త సూత్రాభివాదం, తదుపరి వచనంలో కొనసాగింపు రెండూ సహజంగా ఉంటాయి.
