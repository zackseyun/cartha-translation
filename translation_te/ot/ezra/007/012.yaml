source:
  edition: WLC
  text: אַ֨רְתַּחְשַׁ֔סְתְּא מֶ֖לֶךְ מַלְכַיָּ֑/א לְ/עֶזְרָ֣א כָ֠הֲנָ/א סָפַ֨ר דָּתָ֜/א דִּֽי אֱלָ֧הּ שְׁמַיָּ֛/א גְּמִ֖יר וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: te
  text: 'రాజులకు రాజైన అర్తహషస్త, యాజకుడును ఆకాశ దేవుని ధర్మశాస్త్ర[a] లేఖకుడునైన ఎజ్రాకు: సంపూర్ణ శాంతి[b]. ఇక—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశ దేవుని శాసన లేఖకుడు.’ అరామీయ దָּתָא పదానికి ‘ధర్మశాస్త్రం’ అనే అర్థంతోపాటు, విస్తృత పరిపాలనా భావంలో ‘శాసనం’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇది అరామీయ పత్రాల్లో వాడే సూత్రప్రాయ అభివాదం. ‘సంపూర్ణ శాంతి’ని ‘పూర్ణ శాంతి’ అని కూడా, భావానువాదంగా ‘శుభాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: అర్తహషస్త
  rationale: పర్షియా రాజు పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: రాజులకు రాజైన
  rationale: అరామీయ రాజబిరుదు భావాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలిపే ప్రయోగం.
- source_word: לְעֶזְרָ֣א כָ֠הֲנָא
  choice: యాజకుడు ఎజ్రాకు
  rationale: లామెద్ ఉత్తర గ్రహీతను సూచిస్తుంది; నిర్ణీత రూపంలోని ‘యాజకుడు’ ఎజ్రాకు సమానాధికరణంగా ఉంది.
- source_word: סָפַר דָּתָא
  choice: ధర్మశాస్త్రానికి లేఖకుడు
  rationale: סָפַר కు ‘లేఖకుడు’; דָּתָא కు ఈ సందర్భంలో దేవుని ధర్మశాస్త్రం అనే మత-న్యాయ భావం సరిపోతుంది. ‘శాసనానికి లేఖకుడు’ అనే పరిపాలనా అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవుని
  rationale: ‘ఆకాశముల దేవుడు’ అనే స్థిరమైన బైబిలు బిరుదు భావాన్ని ఆధునిక, సహజ తెలుగులో సంక్షిప్తంగా తెలిపే రూపం.
- source_word: גְּמִיר
  choice: సంపూర్ణ శాంతి
  rationale: పత్రారంభ అభివాద సూత్రంలోని ‘సంపూర్ణమైన/పూర్ణమైన’ భావాన్ని నిలిపి, సందర్భం సూచించే శాంతి అభివాదాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: וּכְעֶנֶת
  choice: ఇక—
  rationale: అభివాదం నుండి ఉత్తరపు ప్రధాన విషయానికి మార్పును సూచిస్తుంది; భావం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘ విరామచిహ్నం తెలియజేస్తుంది.
theological_decisions:
- issue: ఎజ్రా పాత్రను వివరించే דָּתָא పదానికి అర్థం
  choice: ధర్మశాస్త్రం
  alternative: శాసనం
  rationale: ఈ పదం రాజశాసనాన్ని కూడా సూచించగలిగినా, ఇక్కడ ‘పరలోక దేవుని’తో సంబంధించి యాజకుడైన ఎజ్రాను వర్ణిస్తున్నందున దైవ ధర్మశాస్త్రం అనే భావమే సందర్భానికి బాగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: גְּמִיר וּכְעֶנֶת అనే సంక్షిప్త పత్రసూత్రం
  choice: సంపూర్ణ శాంతి. ఇక—
  alternative: పూర్ణ శుభాలు. ఇక—
  rationale: అభివాదంలోని పూర్ణత భావాన్నీ, ఉత్తరపు ప్రధాన విషయానికి మార్పునీ విడివిడిగా నిలిపాం; తరువాతి వచనంతో వాక్యం కొనసాగడాన్ని దీర్ఘ విరామచిహ్నం సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజపత్రానికి తగిన గంభీరతను నిలిపాం. ‘రాజులకు రాజు,’ ‘యాజకుడు,’ ‘ధర్మశాస్త్రం’ వంటి సాధారణ బైబిలు పదజాలాన్ని ఉపయోగించాం; పత్రం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
