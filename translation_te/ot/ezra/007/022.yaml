  variant: modern standard Telugu
source:
  edition: WLC
  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: te
  text: వెండి వంద తలాంతుల వరకు, గోధుమలు వంద కోరుల వరకు, ద్రాక్షామద్యం వంద బాత్‌ల వరకు, నూనె వంద బాత్‌ల వరకు, అలాగే పరిమితి పేర్కొనకుండా[a] ఉప్పు ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వ్రాయబడని ఉప్పు”; అంటే, ఉప్పుకు నిర్ణీత పరిమాణం పేర్కొనబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: వరకు
  rationale: ఈ పరిపాలనా జాబితాలో ప్రతి వస్తువుకు అనుమతించిన గరిష్ఠ పరిమాణాన్ని సూచిస్తుంది.
- source_word: כְּסַף
  choice: వెండి
  rationale: తలాంతులలో కొలిచిన లోహాన్ని నేరుగా సూచిస్తుంది; సాధారణంగా ‘డబ్బు’ అని మార్చడం కంటే ఇది మూలానికి దగ్గరగా ఉంటుంది.
- source_word: כַּכְּרִין
  choice: తలాంతులు
  rationale: ప్రాచీన బరువు ప్రమాణాన్ని ఆధునిక అంచనాతో భర్తీ చేయకుండా దాని పేరునే నిలుపుతుంది.
- source_word: חִנְטִין
  choice: గోధుమలు
  rationale: ఈ పదం సాధారణ ధాన్యాన్ని కాక ప్రత్యేకంగా గోధుమలను సూచిస్తుంది.
- source_word: כֹּרִין
  choice: కోరులు
  rationale: ప్రాచీన ఘనపరిమాణ ప్రమాణానికి లిప్యంతరీకృత రూపం; ఊహాత్మక ఆధునిక మార్పిడిని నివారిస్తుంది.
- source_word: חֲמַר
  choice: ద్రాక్షారసం
  rationale: ఆలయ సరఫరాల సందర్భంలో మద్యపానీయమైన వైన్‌ను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదంతో సూచిస్తుంది.
- source_word: בַּתִּין
  choice: బాతులు
  rationale: ప్రాచీన ద్రవ పరిమాణ ప్రమాణమైన ‘బాత్’ బహువచనాన్ని నిలుపుతుంది.
- source_word: מְשַׁח
  choice: నూనె
  rationale: మూలం నూనెను మాత్రమే పేర్కొంటుంది; ఒలీవ నూనె అని మరింత నిర్దిష్టం చేయదు.
- source_word: מְלַח
  choice: ఉప్పు
  rationale: జాబితాలోని చివరి వస్తువుకు నేరమైన అనువాదం.
- source_word: דִּי לָא כְתָב
  choice: పరిమితి పేర్కొనకుండా
  rationale: అక్షరార్థంగా ‘వ్రాయబడనిది’ అయిన ఈ పరిపాలనా ప్రయోగం, ఉప్పుకు నిర్ణీత పరిమాణం నమోదు కాలేదనే భావాన్ని తెలియజేస్తుంది; అక్షరార్థ రూపం పాదటిప్పణిలో ఉంచబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాజ్ఞలోని కొలతల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రాచీన ప్రమాణాలైన తలాంతు, కోరు, బాతు పేర్లు నిలుపబడ్డాయి. వాక్యం ముందు సందర్భంలోని ఆజ్ఞకు అనుసంధానమవుతుందని తెలుగులో సహజత కోసం ‘ఇవ్వాలి’ చేర్చబడింది.
