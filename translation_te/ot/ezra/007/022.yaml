revisions:
- from: వెండి వంద తలాంతుల వరకు, గోధుమలు వంద కోరుల వరకు, ద్రాక్షారసం వంద బాతుల వరకు, నూనె వంద బాతుల వరకు, అలాగే పరిమితి పేర్కొనకుండా[a] ఉప్పు ఇవ్వాలి.
  to: వెండి వంద తలాంతుల వరకు, గోధుమలు వంద కోరుల వరకు, ద్రాక్షామద్యం వంద బాత్‌ల వరకు, నూనె వంద బాత్‌ల వరకు, అలాగే పరిమితి పేర్కొనకుండా[a] ఉప్పు ఇవ్వాలి.
