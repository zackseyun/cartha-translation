  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מָ֣ה דִי֩ עלי/ך וְ/עַל אחי/ך יֵיטַ֗ב בִּ/שְׁאָ֛ר כַּסְפָּ֥/א וְ/דַהֲבָ֖/ה לְ/מֶעְבַּ֑ד כִּ/רְע֥וּת אֱלָהֲ/כֹ֖ם תַּעַבְדֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: te
  text: మిగిలిన వెండి, బంగారాలతో ఏమి చేయడం నీకూ నీ సహోదరులకూ మంచిదనిపిస్తుందో[a], దాన్ని మీ దేవుని చిత్తప్రకారం[b] చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకూ నీ సహోదరులకూ ఏది మంచిదో.’ అరామీయ నుడికారాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ దేవుని కోరికప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: ఏమి
  rationale: ఈ అరామీయ పదబంధం అనిర్దిష్ట సంబంధార్థాన్ని ఇస్తుంది. తరువాత వచ్చే ‘...అనిపిస్తుందో’తో కలిసి ‘ఏమి...అనిపిస్తుందో’ అనేది తెలుగులో ‘ఏదైతే’ అనే విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עלי/ך וְ/עַל אחי/ך יֵיטַב
  choice: నీకూ నీ సహోదరులకూ మంచిదనిపిస్తుందో
  rationale: יטב + על అనే అరామీయ నుడికారం ఎవరికైనా మంచిగా లేదా సముచితంగా తోచడాన్ని సూచిస్తుంది. ‘మంచిదనిపిస్తుందో’ అనేది రాజాజ్ఞలో ఇచ్చిన నిర్ణయ స్వేచ్ఛను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אחי/ך
  choice: నీ సహోదరులు
  rationale: మూలపదానికి అక్షరార్థం ‘నీ సోదరులు.’ సందర్భంలో ఎజ్రాతో ఉన్న తోటి యూదులు లేదా సహచరులు ఉద్దేశించబడి ఉండవచ్చు; అయితే మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ గౌరవప్రదమైన ‘సహోదరులు’ వాడబడింది.
- source_word: בִּ/שְׁאָר כַּסְפָּ/א וְ/דַהֲבָ/ה
  choice: మిగిలిన వెండి బంగారంతో
  rationale: שְׁאָר మిగిలినదాన్ని సూచిస్తుంది; ב సాధనార్థంగా ఇక్కడ ‘తో’ అని సహజంగా అనువదించబడింది. ఇప్పటికే ప్రస్తావించిన వెండి బంగారం మిగులును ఇది సూచిస్తుంది.
- source_word: לְ/מֶעְבַּד
  choice: చేయడం
  rationale: עבד ఇక్కడ నిధులతో చేపట్టే కార్యాన్ని విస్తృతంగా సూచిస్తుంది. ‘చేయడం’ మూలంలోని సాధారణతను నిలుపుతుంది; నిర్దిష్ట వినియోగాన్ని అనవసరంగా చేర్చదు.
- source_word: כִּ/רְעוּת
  choice: చిత్తప్రకారం
  rationale: רעות అంటే చిత్తం, కోరిక, లేదా అభిలాష. రాజాజ్ఞ యొక్క గంభీర శైలికి ‘చిత్తప్రకారం’ సరిపోతూ, దేవుని ఉద్దేశానికి అనుగుణంగా చేయాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: אֱלָהֲ/כֹם
  choice: మీ దేవుడు
  rationale: ఇది ఎజ్రా మరియు అతని సహచరులు ఆరాధించే నిర్దిష్ట దేవుణ్ణి సూచిస్తుంది. తెలుగు వాక్యంలో సహజమైన సర్వనామ సంబంధంతో ‘మీ దేవుని’ అని వచ్చింది.
- source_word: תַּעַבְדוּן
  choice: చేయండి
  rationale: ఈ అసంపూర్ణ క్రియారూపం రాజాజ్ఞలో అనుమతితో కూడిన ఆదేశంగా పనిచేస్తుంది. గౌరవ బహువచన ఆజ్ఞారూపమైన ‘చేయండి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: אֱלָהֲכֹם అనే దైవసూచన యొక్క నిర్దిష్టత
  choice: మీ దేవుడు
  alternative: మీ దేవత
  rationale: ఈ మాటలు పారసీక రాజు పలికినవైనా, సూచించబడుతున్నది ఎజ్రా మరియు అతని సహచరులు ఆరాధించే ఇశ్రాయేలు దేవుడే; అందువల్ల సాధారణ దేవతను సూచించే పదం కాకుండా ‘దేవుడు’ వాడబడింది.
- issue: כִּרְעוּת లోని ‘చిత్తం/కోరిక’ భావం
  choice: మీ దేవుని చిత్తప్రకారం
  alternative: మీ దేవుని కోరికప్రకారం
  rationale: మూలపదం చిత్తం, కోరిక రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠ్యంలో గంభీరమైన ‘చిత్తప్రకారం’ ఎంచుకుని, భావ పరిధిని పాదసూచికలో నిలిపాం; దీనివల్ల ఏ ప్రత్యేక సిద్ధాంత వివరణనూ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. రాజాజ్ఞ శైలిని నిలుపుతూ అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. ‘సహోదరులు’ మూలంలోని బంధుత్వ పదాన్ని కాపాడుతుంది; ‘మంచిదనిపిస్తుందో’ అరామీయ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
