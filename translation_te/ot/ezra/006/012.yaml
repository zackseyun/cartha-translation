id: EZR.6.12
reference: Ezra 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: te
  text: తన నామాన్ని అక్కడ నివసింపజేసిన దేవుడు[a], ఈ ఆజ్ఞను మార్చడానికి గానీ, యెరూషలేములో ఉన్న ఈ దేవుని మందిరాన్ని నాశనం చేయడానికి గానీ ప్రయత్నించే ఏ రాజునైనా లేదా ఏ ప్రజలనైనా కూలదోయుగాక. దర్యావేషు అనే నేను ఈ ఆజ్ఞను జారీ చేశాను; అది ఆలస్యం లేకుండా, పూర్తి శ్రద్ధతో అమలు చేయబడుగాక.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన నామాన్ని అక్కడ ఉంచిన దేవుడు.” ఈ అరామీయ నుడికారం దేవుడు తన నామాన్ని ఆ మందిరంతో ప్రత్యేకంగా అనుబంధించాడని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “త్వరగా.” ఇక్కడి అరామీయ క్రియావిశేషణం ఆజ్ఞను జాప్యం లేకుండా, శ్రద్ధగా అమలు చేయడాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: తన నామం అక్కడ నివసించేలా చేసిన
  rationale: కారణార్థక క్రియాబలాన్ని, దేవుని నామం మందిరంతో నివసించేలా అనుబంధించబడినదనే మూలభాషా నుడికారాన్ని నిలుపుతుంది.
- source_word: יְמַגַּר
  choice: కూలదోయుగాక
  rationale: శాపరూప రాజాజ్ఞలో రాజునైనా ప్రజలనైనా తీర్పుగా పడగొట్టడం అనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: ఏ రాజునైనా, ఏ ప్రజలనైనా
  rationale: ఎవరైనా ఈ ఆజ్ఞను అతిక్రమిస్తే వర్తించే సమగ్ర, పంపిణీయ భావాన్ని సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: יִשְׁלַח יְדֵהּ
  choice: చేయి చాపే
  rationale: వ్యతిరేక చర్యకు పూనుకోవడం అనే సెమిటిక్ రూపకాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: לְהַשְׁנָיָה
  choice: దీన్ని మార్చడానికి
  rationale: ముందున్న రాజాజ్ఞ లేదా ఏర్పాటును మార్చడాన్ని సూచించే పరిపాలనా సందర్భానికి సరిపోతుంది; మూలంలో కర్మ స్పష్టంగా వ్యక్తం కాకపోయినా సందర్భసూచిత భావాన్ని తెలుగులో పూర్తి చేస్తుంది.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא
  choice: ఈ దేవుని మందిరాన్ని నాశనం చేయడానికి
  rationale: మందిరాన్ని పాడుచేయడం లేదా నాశనం చేయడం అనే తీవ్ర భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׂמֶת טְעֵם
  choice: ఈ ఆజ్ఞను జారీ చేశాను
  rationale: పర్షియా రాజపరిపాలనా సూత్రవాక్యానికి ఆధునిక, అధికారిక తెలుగు సమానార్థకం.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: ఇది అత్యంత శ్రద్ధతో అమలు చేయబడాలి
  rationale: ముగింపు ఆజ్ఞలోని అధికారిక బలాన్ని, జాప్యం లేకుండా శ్రద్ధగా అమలు చేయాలనే భావాన్ని కలిపి అందిస్తుంది; ‘త్వరగా’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
theological_decisions:
- issue: దేవుడు తన నామాన్ని మందిరంలో నివసింపజేయడం
  choice: ‘తన నామం అక్కడ నివసించేలా చేసిన’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘తన నామాన్ని అక్కడ ఉంచిన’ లేదా ‘అక్కడ నివసించే దేవుడు’
  rationale: మూలవాక్యం దేవుడే ఆ స్థలానికి పరిమితుడని చెప్పకుండా, తన నామాన్ని మందిరంతో ప్రత్యేకంగా అనుబంధించాడనే నిబంధనాత్మక-మందిర భావాన్ని వ్యక్తం చేస్తుంది. ‘అక్కడ నివసించే దేవుడు’ అని మార్చితే ‘నామం’ అనే ముఖ్యమైన భావం కనుమరుగవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజాజ్ఞ శైలిని వాడాం. ‘కూలదోయుగాక’ శాపరూప ప్రార్థనను, ‘జారీ చేశాను/అమలు చేయబడాలి’ పరిపాలనా స్వరాన్ని నిలుపుతాయి. సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతో మూలంలోని ‘నామం నివసించడం’ అనే ఉద్దేశపూర్వక theological నుడికారాన్ని పరిరక్షించాం.
