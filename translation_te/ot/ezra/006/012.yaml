revisions:
- from: 'తన నామం అక్కడ నివసించేలా చేసిన దేవుడు[a], దీన్ని మార్చడానికైనా, యెరూషలేములో ఉన్న ఈ దేవుని మందిరాన్ని నాశనం చేయడానికైనా చేయి చాపే ఏ రాజునైనా, ఏ ప్రజలనైనా కూలదోయుగాక. దర్యావేషు అనే నేను ఈ ఆజ్ఞను జారీ చేశాను; ఇది అత్యంత శ్రద్ధతో అమలు చేయబడాలి.[b]


    [a] లేదా, “తన నామాన్ని అక్కడ ఉంచిన దేవుడు.” ఈ అరామీయ నుడికారం దేవుడు తన నామాన్ని ఆ మందిరంతో ప్రత్యేకంగా అనుబంధించాడని సూచిస్తుంది.

    [b] లేదా, “ఇది త్వరగా అమలు చేయబడాలి.” ఇక్కడి అరామీయ క్రియావిశేషణం ఆజ్ఞను జాప్యం లేకుండా, శ్రద్ధగా అమలు చేయడాన్ని నొక్కిచెప్పవచ్చు.'
  to: తన నామాన్ని అక్కడ నివసింపజేసిన దేవుడు[a], ఈ ఆజ్ఞను మార్చడానికి గానీ, యెరూషలేములో ఉన్న ఈ దేవుని మందిరాన్ని నాశనం చేయడానికి గానీ ప్రయత్నించే ఏ రాజునైనా లేదా ఏ ప్రజలనైనా కూలదోయుగాక. దర్యావేషు అనే నేను ఈ ఆజ్ఞను జారీ చేశాను; అది ఆలస్యం లేకుండా, పూర్తి శ్రద్ధతో అమలు చేయబడుగాక.[b]
  rationale: సవరణలు అర్థాన్ని మార్చకుండా వాక్య నిర్మాణాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చేశాయి. ‘ఈ ఆజ్ఞను’ అనేది సందర్భంలో సూచితమైన మార్పు చేయరాని రాజాజ్ఞను స్పష్టం చేస్తుంది; ‘ప్రయత్నించే’ సెమిటిక్ ‘చేయి చాచడం’ నుడికారపు కార్యోన్ముఖ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘అమలు చేయబడుగాక’ మూలంలోని అధికారిక జుస్సివ్‌ను నిలుపుతుంది.
