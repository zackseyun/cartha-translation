source:
  edition: WLC
  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: te
  text: వారు యాజకులను తమ తమ విభాగాల్లో, లేవీయులను తమ తమ గుంపుల్లో[a] యెరూషలేములో జరిగే దేవుని సేవ కోసం, మోషే గ్రంథంలో వ్రాయబడినట్లుగా నియమించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యాజకులు, లేవీయులు—ఇద్దరి విషయంలోనూ ‘తమ తమ విభాగాల్లో’ అని అనువదించవచ్చు; అరామీయంలోని రెండు నామపదాలు సంస్థాగతంగా ఏర్పరచిన గుంపులను సూచించే దగ్గరి అర్థమున్న పదాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మోషే గ్రంథంలోని వ్రాత ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: నియమించారు
  rationale: అఫేల్ రూపంలోని קום ఇక్కడ వ్యక్తులను వారి బాధ్యతల స్థానాల్లో నిలబెట్టడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది. ఆలయ సేవకుల క్రమబద్ధమైన నియామకాన్ని ‘నియమించారు’ సహజంగా తెలియజేస్తుంది.
- source_word: כָהֲנַיָּא
  choice: యాజకులను
  rationale: అరామీయ పదానికి ప్రామాణికమైన, ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన అనువాదం.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: వారి వారి విభాగాల ప్రకారం
  rationale: పదం క్రమబద్ధంగా ఏర్పరచిన విభాగాలను సూచిస్తుంది. బְּ ఉపసర్గ ఇక్కడ ఏర్పాటు ఏ క్రమం ప్రకారం జరిగిందో తెలియజేస్తుంది.
- source_word: וְלֵוָיֵא
  choice: లేవీయులను
  rationale: లేవి వంశానికి చెందిన ఆలయ సేవకులను సూచించే స్థిరమైన తెలుగు రూపం.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: వారి వారి వర్గాల ప్రకారం
  rationale: ఈ పదం నియమిత గుంపులు లేదా విభాగాలను సూచిస్తుంది. ముందు వచ్చిన దగ్గరి అర్థమున్న పదంతో తేడాను పూర్తిగా చెరపకుండా ఉండేందుకు ‘వర్గాలు’ వాడబడింది; రెండింటినీ ‘విభాగాలు’ అని అనువదించే అవకాశం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: దేవుని సేవ చేయడానికి
  rationale: עַל తో కూడిన ఈ పదబంధం దేవుని సేవకు లేదా ఆ సేవపై బాధ్యతకు నియమించడాన్ని సూచిస్తుంది. తెలుగులో ఉద్దేశాన్ని సహజంగా తెలియజేసే రూపం ఎంచుకోబడింది.
- source_word: דִּי בִירוּשְׁלֶם
  choice: యెరూషలేములో
  rationale: సంబంధబోధక నిర్మాణం దేవుని సేవను యెరూషలేము ఆలయ సందర్భంతో అనుసంధానిస్తుంది. తెలుగులో సంక్షిప్త స్థానబోధక రూపమే సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כִּכְתָב
  choice: వ్రాయబడిన ప్రకారం
  rationale: ఈ అరామీయ ప్రయోగం లిఖిత నిర్దేశానికి అనుగుణంగా జరిగినదని తెలియజేస్తుంది. మూలంలోని ప్రమాణబద్ధతను ఈ రూపం నిలుపుతుంది.
- source_word: סְפַר מֹשֶׁה
  choice: మోషే గ్రంథం
  rationale: סְפַר గ్రంథం లేదా చుట్టను సూచించగలదు. ఈ సందర్భంలో ‘మోషే గ్రంథం’ స్పష్టమైన, స్థిరమైన తెలుగు ప్రయోగం; పద్యం చెప్పినదానికంటే అధికమైన రచయితత్వ వాదనను జోడించదు.
theological_decisions:
- issue: ఆలయ సేవా క్రమానికి మోషే గ్రంథంలోని లిఖిత నిర్దేశంతో ఉన్న సంబంధం
  choice: యాజకులు, లేవీయుల నియామకం మోషే గ్రంథంలో వ్రాయబడిన దానికి అనుగుణంగా జరిగిందని స్పష్టంగా అనువదించడం
  alternative: దీనిని కేవలం సంప్రదాయబద్ధమైన ఏర్పాటు అని సడలించి అనువదించడం
  rationale: ముగింపు పదబంధం ఈ ఏర్పాటును లిఖిత ప్రమాణంతో నేరుగా అనుసంధానిస్తుంది. అయితే గ్రంథసంపుటి పరిధి లేదా రచయితత్వం గురించి పద్యంలో లేని సిద్ధాంత వివరాలు జోడించబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘వారి వారి’ అనే ప్రయోగం ప్రతి వర్గానికి చెందిన నియమిత క్రమాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని రెండు దగ్గరి సంస్థాగత పదాలకు ‘విభాగాలు’, ‘వర్గాలు’ అని స్వల్ప భేదం ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
