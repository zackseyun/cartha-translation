base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: te
  text: అవసరమైనవన్నీ—ఆకాశ దేవునికి దహనబలులు అర్పించడానికి కోడెదూడలు, పొట్టేళ్లు, గొర్రెపిల్లలు, అలాగే గోధుమలు, ఉప్పు, ద్రాక్షామద్యం, నూనె—యెరూషలేములో ఉన్న యాజకుల మాట ప్రకారం[a], ఏ లోటూ లేకుండా[b] ప్రతిరోజూ వారికి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెరూషలేములో ఉన్న యాజకుల సూచన ప్రకారం.’ అరామీయ పదబంధానికి అక్షరార్థం ‘యాజకుల మాట ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తప్పకుండా.’ చివరి అరామీయ పదబంధం రోజువారీ సరఫరాలో లోటు గానీ విరామం గానీ ఉండకూడదని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: అవసరమైనవన్నీ
  rationale: ఈ అరామీయ పదబంధం అవసరమైన సమస్త సరఫరాలను సూచిస్తుంది. తెలుగులో ‘అవసరమైనవన్నీ’ సహజంగా ఉండి పరిపాలనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי תוֹרִין
  choice: కోడెదూడలు
  rationale: అక్షరార్థంగా ‘ఎద్దుల కుమారులు’; బలికి తగిన చిన్న వయసు మగ పశువులను సూచించే సహజమైన తెలుగు పదం.
- source_word: דִכְרִין
  choice: పొట్టేళ్లు
  rationale: మగ గొర్రెలను సూచించే ఈ పదానికి బలుల సందర్భంలో ‘పొట్టేళ్లు’ ఖచ్చితమైన తెలుగు సమానం.
- source_word: אִמְּרִין
  choice: గొర్రెపిల్లలు
  rationale: ఈ పదం గొర్రెపిల్లలను సూచిస్తుంది; బలి జంతువుల జాబితాలో ఇది సహజంగా సరిపోతుంది.
- source_word: לַעֲלָוָן
  choice: దహనబలులు అర్పించడానికి
  rationale: పూర్తిగా దహించబడే బలులను సూచించే ఆరాధనా పదం. తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలియజేయడానికి క్రియాత్మక రూపం వాడబడింది.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: ఆకాశ దేవునికి
  rationale: ఎజ్రా అరామీయ భాగంలో కనిపించే దేవుని బిరుదును నేరుగా, సహజంగా అందిస్తుంది.
- source_word: חִנְטִין
  choice: గోధుమలు
  rationale: ఈ పదం సాధారణ ధాన్యాన్ని కాక ప్రత్యేకంగా గోధుమలను సూచిస్తుంది.
- source_word: מְלַח חֲמַר וּמְשַׁח
  choice: ఉప్పు, ద్రాక్షారసం, నూనె
  rationale: సరఫరాల జాబితాను ఖచ్చితంగా అందిస్తుంది. ‘ద్రాక్షారసం’ ఈ సందర్భంలోని మద్యపానీయమైన ద్రాక్షారసాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: כְּמֵאמַר כָּהֲנַיָּא
  choice: యాజకుల మాట ప్రకారం
  rationale: అక్షరార్థంలోని ‘మాట ప్రకారం’ అనే రూపాన్ని నిలుపుతూ, వారి అధికారపూర్వక సూచన భావాన్ని సందర్భం ద్వారా వెల్లడిస్తుంది.
- source_word: יוֹם בְּיוֹם דִּי לָא שָׁלוּ
  choice: ఏ లోటూ లేకుండా ప్రతిరోజూ
  rationale: రోజువారీ సరఫరా ఆగకూడదని, ఏదీ విడిచిపెట్టకూడదని తెలిపే చివరి నిబంధనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
