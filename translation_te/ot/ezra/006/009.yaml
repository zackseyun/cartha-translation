  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పరిపాలనా శైలిని ఉపయోగించాం. జాబితా స్పష్టత కోసం డాష్‌లు వాడాం; మూలంలోని ‘యాజకుల మాట ప్రకారం’ అనే స్వల్ప ద్వంద్వార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
