source:
  edition: WLC
  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: te
  text: అప్పుడు దర్యావేషు రాజు ఒక ఆజ్ఞ జారీ చేశాడు[a]. బబులోనులో, నిధులు నిల్వచేయబడిన దస్తావేజుల భవనంలో[b] వారు వెదికారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దర్యావేషు రాజు ఒక ఆజ్ఞను ఉంచాడు.” ఇది రాజు ఆజ్ఞ జారీ చేశాడనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దస్తావేజుల భవనం” అక్షరార్థంగా “గ్రంథాలు/పత్రాల ఇల్లు”; ఇది అధికారిక దస్తావేజులు భద్రపరిచే చోటును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అరామీయంలో “వారు వెదికారు” అనే మూడవ పురుష బహువచన క్రియ ఉంది; ఇక్కడ అది నిర్దిష్టంగా చెప్పబడని అధికారులను సూచించవచ్చు. అందువల్ల “వెదకడం జరిగింది” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే అరామీయ కథన సంధాన పదానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: దర్యావేషు రాజు
  rationale: పేరును తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, బిరుదును మూలంలోని పదక్రమానికి దగ్గరగా ఉంచింది.
- source_word: שָׂם טְעֵם
  choice: ఒక ఆజ్ఞ జారీ చేశాడు
  rationale: అక్షరార్థంగా ‘ఆజ్ఞను ఉంచాడు’; రాజపరిపాలనా సందర్భంలో ‘జారీ చేశాడు’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: וּבַקַּרוּ
  choice: వారు వెదికారు
  rationale: మూలంలోని మూడవ పురుష బహువచన క్రియను క్రియాశీల రూపంలో నిలిపింది; కర్త నిర్దిష్టంగా చెప్పబడలేదు.
- source_word: בְּבֵית סִפְרַיָּא
  choice: గ్రంథాల భవనంలో
  rationale: అక్షరార్థంగా ‘గ్రంథాలు/పత్రాల ఇల్లు’; అధికారిక దస్తావేజులు ఉంచే భవనాన్ని సూచిస్తుంది.
- source_word: גִנְזַיָּא
  choice: నిధులు
  rationale: దాచిపెట్టిన ధనవస్తువులు లేదా నిల్వలను సూచించే పదం; సందర్భంలోని విస్తృత అర్థాన్ని పరిమితం చేయదు.
- source_word: מְהַחֲתִין
  choice: భద్రపరచబడిన
  rationale: అక్కడ ఉంచి నిల్వ చేసిన స్థితిని తెలిపే నిష్క్రియార్థక కృదంతాన్ని ప్రతిబింబిస్తుంది.
- source_word: תַּמָּה בְּבָבֶל
  choice: బబులోనులో
  rationale: ‘అక్కడ, బబులోనులో’ అనే స్థాన సూచనను తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా తెలిపింది.
