translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. ‘మందిరం’ సందర్భార్థాన్ని సహజంగా అందిస్తుండగా, మూలంలోని అక్షరార్థమైన ‘ఇల్లు’ పాదటిప్పణిలో నిలుపబడింది. తేదీకి సంబంధించిన అరామీయ עַד లోని సాధ్యమైన ద్వంద్వార్థం ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించబడింది.
