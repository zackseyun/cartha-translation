source:
  edition: WLC
  text: וְ/שֵׁיצִיא֙ בַּיְתָ֣/ה דְנָ֔ה עַ֛ד י֥וֹם תְּלָתָ֖ה לִ/ירַ֣ח אֲדָ֑ר דִּי הִ֣יא שְׁנַת שֵׁ֔ת לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מַלְכָּֽ/א־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: te
  text: ఈ మందిరం[a] అదారు నెల మూడవ రోజు నాటికి[b] పూర్తయింది. ఆ సంవత్సరం దర్యావేషు రాజు పాలనలో ఆరవ సంవత్సరం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఈ ఇల్లు’ లేదా ‘ఈ గృహం.’ ఎజ్రా గ్రంథంలో ‘ఇల్లు’ అనేది దేవాలయానికి సాధారణ సూచన.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అదారు నెల మూడవ రోజున.’ మందిరం పూర్తయిన ఖచ్చితమైన తేదీని ఈ మాటలు సూచిస్తున్నట్లు కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: పూర్తయింది
  rationale: ఈ సందర్భంలో అరామీయ క్రియ నిర్మాణ పని ముగింపుకు చేరినదని సూచిస్తుంది. కర్తను చేర్చకుండా, మందిరంపైనే దృష్టి నిలిపే సహజమైన తెలుగు నిష్క్రియార్థక రూపం ఇది.
- source_word: בַּיְתָה דְנָה
  choice: ఈ మందిరం
  rationale: అక్షరార్థంగా ‘ఈ ఇల్లు/గృహం.’ ఎజ్రాలో ఇది దేవాలయానికి సాధారణ సూచన. ‘మందిరం’ మూలంలోని భవనార్థాన్ని, సందర్భంలోని దేవాలయార్థాన్ని సహజంగా కలుపుతుంది; అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: עַד יוֹם תְּלָתָה
  choice: మూడవ రోజు నాటికి
  rationale: עַד అనే అవ్యయం పని ఆ తేదీ వరకూ సాగి అప్పటికి పూర్తయిందనే భావాన్ని ఇవ్వగలదు. ‘నాటికి’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; నిర్దిష్టంగా అదే రోజున పూర్తయిందనే అర్థం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచాం.
- source_word: לִירַח אֲדָר
  choice: అదారు నెల
  rationale: అరామీయ తేదీ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: דִּי הִיא
  choice: అది
  rationale: ముందు చెప్పిన పూర్తయిన తేదీని రాజ్యపాలనా సంవత్సరంతో అనుసంధానిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక వాక్యంగా ఉంచడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שְׁנַת שֵׁת
  choice: ఆరవ సంవత్సరం
  rationale: రాజ్యపాలనా సంవత్సరాన్ని తెలిపే అరామీయ ప్రయోగానికి ప్రామాణిక తెలుగు సమానం.
- source_word: לְמַלְכוּת
  choice: పరిపాలనలో
  rationale: ఇక్కడ రాజ్యం అనే భూభాగం కంటే రాజు పాలించిన కాలమే ఉద్దేశం. ‘పరిపాలనలో’ రాజ్యపాలనా సంవత్సర సూత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: దర్యావేషు రాజు
  rationale: అరామీయంలోని వ్యక్తి పేరును, రాజ బిరుదును రెండింటినీ స్పష్టంగా నిలుపుతుంది.
