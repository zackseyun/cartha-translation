source:
  edition: WLC
  text: כִּ֣י הִֽטַּהֲר֞וּ הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם כְּ/אֶחָ֖ד כֻּלָּ֣/ם טְהוֹרִ֑ים וַ/יִּשְׁחֲט֤וּ הַ/פֶּ֨סַח֙ לְ/כָל בְּנֵ֣י הַ/גּוֹלָ֔ה וְ/לַ/אֲחֵי/הֶ֥ם הַ/כֹּהֲנִ֖ים וְ/לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: te
  text: యాజకులూ లేవీయులూ ఒక్కటిగా తమను తాము శుద్ధి చేసుకున్నారు; వారందరూ శుద్ధులుగా ఉన్నారు. వారు ప్రవాసులందరి కోసం, తమ సహోదరులైన యాజకుల కోసం, తమ కోసం పస్కా బలిపశువును వధించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: ఒకే మనస్సుతో
  rationale: అక్షరార్థంగా ‘ఒకరివలె/ఒక్కటిగా’; ఇక్కడ యాజకులు, లేవీయులు సమిష్టిగా ఏకరీతిగా శుద్ధి చేసుకున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְנֵי הַגּוֹלָה
  choice: చెరనుంచి తిరిగివచ్చిన వారు
  rationale: అక్షరార్థం ‘చెరకు చెందినవారు/చెర సంతానం’; ఎజ్రా సందర్భంలో ప్రవాసం నుంచి తిరిగివచ్చిన సమాజాన్ని సూచిస్తుంది.
- source_word: הַפֶּסַח
  choice: పస్కా బలి
  rationale: ఇక్కడ క్రియ ‘వధించారు’ కావడంతో పండుగకన్నా వధించబడే పస్కా బలిపశువును సూచిస్తుంది; ‘బలి’ ఈ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: טְהוֹרִים
  choice: శుద్ధులుగా
  rationale: ఆచారపరమైన శుద్ధస్థితిని సూచించే పదం; సాధారణ పరిశుభ్రతగా అపార్థం కాకుండా ‘శుద్ధి’ పదకుటుంబాన్ని నిలుపుతుంది.
theological_decisions:
- issue: כְאֶחָד యొక్క భావం
  choice: ఒకే మనస్సుతో
  alternative: ఒక్కటిగా / ఒకరివలె
  rationale: సమూహ ఏకత్వాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది; అయితే దీనిని ప్రత్యేక సిద్ధాంతపరమైన ఏకత్వంగా విస్తరించలేదు.
- issue: పస్కాను వధించిన కర్తలు
  choice: యాజకులూ లేవీయులూ అనే సంయుక్త కర్తను కొనసాగించడం
  alternative: లేవీయులు మాత్రమే వధించారు
  rationale: హీబ్రూ వాక్య నిర్మాణంలో ముందున్న రెండు వర్గాలే బహువచన క్రియకు వ్యాకరణ కర్తలు; ఒక వర్గాన్ని మాత్రమే ఎంచుకోవడం మూలంలో స్పష్టంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ఆచారశుద్ధి, ప్రవాస సమాజం, పస్కా బలి అనే సందర్భార్థాలు స్పష్టంగా ఉంచబడ్డాయి.
