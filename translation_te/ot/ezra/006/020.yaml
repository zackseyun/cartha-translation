  source_fidelity: మూలంలోని כְאֶחָד ‘ఒక్కటిగా/ఒకరివలె’ అనే సమిష్టి భావాన్ని ఇస్తుంది; ముసాయిదాలోని ‘ఒకే మనస్సుతో’ అంతర్గత ఏకాభిప్రాయాన్ని కొంత ఎక్కువగా నిర్దేశిస్తుంది. הַפֶּסַח ఇక్కడ వధించబడే పస్కా బలిపశువునే సూచిస్తుంది; దానిని స్పష్టంగా పేర్కొనడం తగినది. בְנֵי הַגּוֹלָהకు ‘ప్రవాసులందరు’ సందర్భానుగుణంగా, మూలానికి మరింత దగ్గరగా ఉంటుంది.
