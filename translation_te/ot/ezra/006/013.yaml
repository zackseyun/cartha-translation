- from: అప్పుడు నదికి అవతల ప్రాంతపు అధిపతి తత్తెనయి[a], షెతర్-బోజెనయి, వారి సహచరులు—దర్యావేషు రాజు పంపిన ఆదేశం ప్రకారం—దానిని అచ్చంగా అలాగే అమలు చేశారు[b].
  to: అప్పుడు నదికి అవతలనున్న ప్రాంతపు అధిపతి[a] తత్తెనయి, షెతర్-బోజెనయి, వారి సహచరులు దర్యావేషు రాజు పంపిన దాని ప్రకారం సరిగ్గా అలాగే చేశారు[b].
