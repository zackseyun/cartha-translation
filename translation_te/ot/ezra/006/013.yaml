id: EZR.6.13
reference: Ezra 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: te
  text: అప్పుడు నదికి అవతలనున్న ప్రాంతపు అధిపతి[a] తత్తెనయి, షెతర్-బోజెనయి, వారి సహచరులు దర్యావేషు రాజు పంపిన దాని ప్రకారం సరిగ్గా అలాగే చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నదికి అవతలనున్న ప్రాంతం’ అనేది యూఫ్రటీసు నదికి పడమరనున్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘చాలా జాగ్రత్తగా చేశారు’ లేదా ‘పూర్తి కచ్చితత్వంతో చేశారు.’ అరామీయ పదబంధం రాజు పంపిన దానికి వారు కచ్చితంగా అనుగుణంగా వ్యవహరించారని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే సాధారణ అరామీయ కథన సూచకం; ఆధునిక తెలుగులో సహజమైన క్రమాన్ని నిలుపుతుంది.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: నదికి అవతల ప్రాంతపు అధిపతి
  rationale: פַּחַת ప్రాంతీయ పరిపాలకుణ్ణి సూచిస్తుంది; עֲבַר נַהֲרָה యూఫ్రటీసుకు పడమరనున్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు. మూలంలోని దృష్టికోణాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: שְׁתַר בּוֹזְנַי
  choice: షెతర్-బోజెనయి
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: וּכְנָוָתְהוֹן
  choice: వారి సహచరులు
  rationale: వారితో అధికారికంగా కలిసి పనిచేసినవారిని సూచించే సందర్భోచితమైన, సహజ తెలుగు పదబంధం.
- source_word: לָקֳבֵל דִּי שְׁלַח
  choice: పంపిన ఆదేశం ప్రకారం
  rationale: శబ్దార్థంగా ‘పంపిన దాని ప్రకారం’; సందర్భంలో రాజు పంపింది అధికారిక నిర్దేశం కావడంతో ‘ఆదేశం’ అనే అంతర్నిహిత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּנֵמָא אָסְפַּרְנָא עֲבַדוּ
  choice: దానిని అచ్చంగా అలాగే అమలు చేశారు
  rationale: ఈ క్రియావిశేషణ సముదాయం రాజు ఆదేశానికి కచ్చితమైన, శ్రద్ధగల అనుసరణను బలపరుస్తుంది. ‘అమలు చేశారు’ సందర్భంలో עֲבַדוּ యొక్క భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. పర్షియా పరిపాలనా పదబంధాన్ని ఆధునిక భౌగోళిక పేరుతో భర్తీ చేయకుండా మూలంలోని ‘నదికి అవతల’ అనే దృష్టికోణం నిలుపబడింది. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, భౌగోళిక సూచికను సంబంధిత ప్రాంతపదం వద్దவும், పదార్థ ప్రత్యామ్నాయ సూచికను సంబంధిత క్రియాపదబంధం వద్దவும் ఉంచాం.
