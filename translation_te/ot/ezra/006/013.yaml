    issue: The translation supplies ‘ఆదేశం’ and ‘దానిని అమలు చేశారు.’
    rationale: The Aramaic says, more literally, that they acted/did ‘in accordance with what King Darius sent,’ without explicitly naming the thing sent or the action as implementation. The broader Telugu wording retains the contextual sense without unnecessarily specifying it.
  - severity: low
    issue: Footnote marker a is attached to Tattenai rather than to ‘నదికి అవతల ప్రాంతం.’
    rationale: Its note explains the regional administrative designation, not the personal name. Marker b remains attached to the compliance expression it explains.
