source:
  edition: WLC
  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: te
  text: ఇప్పుడు నది అవతలి ప్రాంతపు అధిపతి తత్తెనై, షెతర్-బోజెనై, వారి సహచరులైన నది అవతలి ప్రాంతంలో ఉన్న అఫర్సకులారా[a], మీరు అక్కడి నుండి దూరంగా ఉండండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అఫర్సకులు” అనే అరామీయ పదం ఎవరికో ఖచ్చితంగా తెలియదు; ఇది పర్షియా పరిపాలనా అధికారులను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “అక్కడి నుండి దూరంగా ఉండండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: ఇప్పుడు
  rationale: రాజాజ్ఞలోని తదుపరి ఆదేశాన్ని పరిచయం చేసే అరామీయ సంభాషణా సూచికను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: నది అవతలి ప్రాంతానికి అధిపతి
  rationale: פַּחַת అనేది సామ్రాజ్య పరిపాలనా అధిపతిని సూచిస్తుంది; עֲבַר נַהֲרָה యూఫ్రటీసుకు పడమరగా ఉన్న పరిపాలనా ప్రాంతానికి వాడిన పేరు. మూలంలో లేని ‘పర్షియా’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וּכְנָוָתְהוֹן
  choice: వారి సహచరులు
  rationale: ప్రత్యయం మూడవ పురుష బహువచన స్వామ్యార్థాన్ని (‘వారి’) సూచిస్తుంది. ప్రత్యక్ష సంబోధనను సులభం చేయడానికి దాన్ని ‘మీ’గా మార్చకుండా మూలరూపాన్ని నిలిపాం.
- source_word: אֲפַרְסְכָיֵא
  choice: అఫర్సకులు
  rationale: ఈ అరుదైన పరిపాలనా లేదా జనసమూహ పదానికి ఖచ్చితమైన అర్థం అనిశ్చితమైనందున లిప్యంతరీకరించి, సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: మీరు అక్కడికి దూరంగా ఉండండి
  rationale: అక్షరార్థంగా ‘అక్కడి నుండి దూరంగా ఉండండి’; రాజాజ్ఞలో జోక్యం చేయవద్దనే ఆదేశబలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో రాజాజ్ఞకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘నది అవతలి ప్రాంతం’ అనేది పర్షియా సామ్రాజ్య దృష్టిలో యూఫ్రటీసు నదికి పడమరగా ఉన్న పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
