revisions:
- from: ఇప్పుడు, నది అవతలి ప్రాంతానికి అధిపతియైన తత్తెనై, షెతర్‌-బోజెనై, వారి సహచరులు, నది అవతలి ప్రాంతంలో ఉన్న అఫర్సకులు[a]—మీరు అక్కడికి దూరంగా ఉండండి.[b]
  to: ఇప్పుడు నది అవతలి ప్రాంతపు అధిపతి తత్తెనై, షెతర్-బోజెనై, వారి సహచరులైన నది అవతలి ప్రాంతంలో ఉన్న అఫర్సకులారా[a], మీరు అక్కడి నుండి దూరంగా ఉండండి.[b]
  rationale: The revision corrects the directional sense of the final prohibition, uses a more idiomatic administrative title, and clarifies that the Apharsachites are the associates being addressed. It retains transliteration and a cautious note for the uncertain Aramaic designation, and does not import ‘Persia’ into the main text.
