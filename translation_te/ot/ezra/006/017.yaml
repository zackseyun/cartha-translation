base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: te
  text: వారు ఈ దేవుని మందిరం ప్రతిష్ఠ కోసం వంద ఎద్దులను, రెండువందల పొట్టేళ్లను, నాలుగువందల గొర్రెపిల్లలను, సమస్త ఇశ్రాయేలు కోసం[a] పాపబలిగా పన్నెండు మగ మేకలను అర్పించారు; ఇవి ఇశ్రాయేలు గోత్రాల సంఖ్యకు అనుగుణంగా ఉన్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్త ఇశ్రాయేలు పక్షంగా.’
    reason: lexical_alternative
  - marker: b
    text: పన్నెండు మగ మేకలు ఇశ్రాయేలు పన్నెండు గోత్రాల సంఖ్యకు అనుగుణంగా ఉన్నాయి; దీనివల్ల ఈ బలి సమస్త ఇశ్రాయేలుకు ప్రాతినిధ్యం వహిస్తుందనే భావం వ్యక్తమవుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: అర్పించారు
  rationale: కారక రూపంలోని ఈ క్రియ బలిపశువులను దేవునికి సమర్పించడాన్ని సూచిస్తుంది; ఆరాధనా సందర్భంలో ‘అర్పించారు’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: לַחֲנֻכַּת
  choice: ప్రతిష్ఠ కోసం
  rationale: ఈ నామవాచకం అంకితం లేదా ప్రారంభ ప్రతిష్ఠా కార్యక్రమాన్ని సూచిస్తుంది; లామెద్ ఉపసర్గ తెలిపే ఉద్దేశాన్ని ‘కోసం’ నిలుపుతుంది.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: దేవుని ఈ మందిర
  rationale: మూలంలోని ‘ఈ దేవుని మందిరం/దేవుని ఈ మందిరం’ అనే భావాన్ని సహజమైన తెలుగు పదక్రమంలో ఇస్తుంది; సందర్భానికి తగినట్లు ‘ఇల్లు’కు బదులు ‘మందిరం’ వాడబడింది.
- source_word: תּוֹרִין
  choice: ఎద్దులు
  rationale: బలుల జాబితాలోని మగ గోవులను సూచించే సహజ తెలుగు పదం.
- source_word: דִּכְרִין
  choice: పొట్టేళ్లు
  rationale: మగ గొర్రెలను స్పష్టంగా సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: אִמְּרִין
  choice: గొర్రెపిల్లలు
  rationale: చిన్న గొర్రెలను సూచించే మూలపద భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּצְפִירֵי עִזִּין
  choice: మగ మేకలు
  rationale: మేకలలో మగవాటినే పేర్కొంటున్న మూలంలోని నిర్దిష్టతను ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: לחטיא
  choice: పాప బలిగా
  rationale: ఇది పాపం లేదా శుద్ధీకరణకు సంబంధించిన నిర్దిష్ట బలి పదం; సంప్రదాయ అర్థాన్ని అతిగా వివరించకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటి కోసం
  rationale: ప్రయోజనం లేదా ప్రాతినిధ్యాన్ని సూచించే ఉపసర్గ భావాన్ని, తిరిగి వచ్చినవారికే పరిమితం చేయకుండా, సమస్త ఇశ్రాయేలు పరిధిలో ఉంచుతుంది.
- source_word: תְּרֵי עֲשַׂר
  choice: పన్నెండు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాల సంఖ్యకు అనుగుణంగా
  rationale: మేకలు పన్నెండు ఎందుకు ఉన్నాయో తెలిపే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: చెరనుంచి తిరిగివచ్చిన అనంతర సందర్భంలో ‘ఇశ్రాయేలంతటి’ అనే మాట పరిధి
  choice: తిరిగివచ్చినవారికి మాత్రమే పరిమితం చేయకుండా ‘ఇశ్రాయేలంతటి కోసం’ అని ఉంచడం
  alternative: తిరిగివచ్చిన ఇశ్రాయేలీయులందరి కోసం
  rationale: మూలం స్పష్టంగా ‘ఇశ్రాయేలంతటి’ అని చెబుతూ వెంటనే పన్నెండు గోత్రాల సంఖ్యను ప్రస్తావిస్తుంది. అందువల్ల చారిత్రకంగా మరింత సంకుచితమైన అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా దాని సమగ్ర పరిధిని నిలుపుతుంది.
- issue: לחטיא అనే బలి పదంలో పాపం మరియు శుద్ధీకరణ భావాలు
  choice: పాప బలి
  alternative: శుద్ధీకరణ బలి
  rationale: మూలపదానికి పాప సంబంధిత బలి, శుద్ధీకరణ బలి అనే భావ పరిధి ఉంది. ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘పాప బలి’ని వాడుతూ, ఏ ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్నీ అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. పొడవైన జాబితాను రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యం కల్పించబడింది; ‘అలాగే’ మూలంలోని సంధానాన్ని సహజంగా కొనసాగిస్తుంది. సంఖ్యలు అక్షరరూపంలో ఇవ్వబడ్డాయి.
