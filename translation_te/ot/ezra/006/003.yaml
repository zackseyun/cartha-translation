  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲדָ֜ה לְ/כ֣וֹרֶשׁ מַלְכָּ֗/א כּ֣וֹרֶשׁ מַלְכָּ/א֮ שָׂ֣ם טְעֵם֒ בֵּית אֱלָהָ֤/א בִֽ/ירוּשְׁלֶם֙ בַּיְתָ֣/א יִתְבְּנֵ֔א אֲתַר֙ דִּֽי דָבְחִ֣ין דִּבְחִ֔ין וְ/אֻשּׁ֖וֹ/הִי מְסֽוֹבְלִ֑ין רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֥ין שִׁתִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: te
  text: 'కోరెషు రాజు పరిపాలన మొదటి సంవత్సరంలో కోరెషు రాజు ఈ ఆజ్ఞ జారీ చేశాడు: “యెరూషలేములోని దేవుని మందిరాన్ని—బలులు అర్పించే ఆ స్థలాన్ని—తిరిగి కట్టాలి; దాని పునాదులు వేయాలి.[a] దాని ఎత్తు అరవై మూరలు, వెడల్పు అరవై మూరలు ఉండాలి,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని పునాదులను నిలిపి ఉంచాలి/పైకి లేపాలి.” ఈ అరామీయ పదబంధం క్లిష్టమైనది; అనువాదాలు భిన్నంగా ఉన్నాయి. నిర్మాణ సందర్భానికి “దాని పునాదులు వేయాలి” అనేది బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: ఈ ఆజ్ఞ జారీ చేశాడు
  rationale: అక్షరార్థంగా ‘ఆజ్ఞను ఉంచాడు’ అనే అరామీయ పరిపాలనా నుడికారానికి ఆధునిక, అధికారిక తెలుగు సమానార్థకం.
- source_word: בֵּית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: మూలంలో ‘దేవుని ఇల్లు’ అని ఉన్నా, ఇక్కడ యెరూషలేము ఆలయమే ఉద్దేశం; సాధారణ ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יִתְבְּנֵא
  choice: తిరిగి కట్టాలి
  rationale: క్రియకు స్వతహాగా ‘కట్టబడాలి’ అనే అర్థం ఉన్నా, నాశనమైన మందిర పునర్నిర్మాణ సందర్భంలో ‘తిరిగి కట్టాలి’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: బలులు అర్పించే ఆ స్థలం
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన క్రియా-నామ పునరుక్తిని అసహజంగా అనుకరించకుండా, బలులు అర్పించే స్థలం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: దాని పునాదులు వేయాలి
  rationale: ఈ అరామీయ పదబంధం క్లిష్టమైనది. నిర్మాణ సందర్భంలో పునాదులు వేయడం ప్రధాన పాఠ్యానికి అత్యంత సహజమైన అర్థం; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలుపుకున్నాం.
- source_word: רוּמֵהּ
  choice: దాని ఎత్తు
  rationale: నిర్మాణ కొలతను తెలిపే నేరమైన ఆధునిక తెలుగు పదప్రయోగం.
- source_word: אַמִּין שִׁתִּין
  choice: అరవై మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక అంచనాగా మార్చకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’ అనే కొలమాన పదాన్ని నిలిపింది.
- source_word: פְּתָיֵהּ
  choice: వెడల్పు
  rationale: నిర్మాణ పరిమాణానికి సహజమైన ఆధునిక తెలుగు పదం.
