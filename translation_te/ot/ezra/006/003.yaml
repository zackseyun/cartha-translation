  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాజ్ఞకు తగిన గంభీరతతోను సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోను అనువదించబడింది. మూలంలోని రాజు పేరుని పునరుక్తిగా చెప్పడాన్ని నిలిపాం. క్లిష్టమైన పునాదుల పదబంధంలోని అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
