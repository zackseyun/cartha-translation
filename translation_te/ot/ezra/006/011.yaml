id: EZR.6.11
reference: Ezra 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: te
  text: '“నేను ఈ ఆజ్ఞ జారీ చేస్తున్నాను: ఎవరైనా ఈ శాసనాన్ని మార్చితే, అతని ఇంటి నుంచి ఒక దూలాన్ని పీకి తీసి, అతన్ని దానిపై గుచ్చి నిలబెట్టాలి[a]. అతని ఇంటిని దీనినిబట్టి చెత్తకుప్పగా[b] చేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని దానిపై వేలాడదీయాలి”; లేదా, “దానికి బిగించాలి.”
    reason: alternative_reading
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: “పెంటకుప్పగా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: నేను ఈ ఆజ్ఞ జారీ చేస్తున్నాను
  rationale: ‘ఆజ్ఞను పెట్టడం’ అనే అరామీయ పరిపాలనా నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన రాజాజ్ఞ ప్రకటనగా అందిస్తుంది; ‘నా నుండి’ అనే భావాన్ని ప్రథమ పురుష రూపం నిలుపుతుంది.
- source_word: יְהַשְׁנֵא
  choice: మార్చితే
  rationale: ఇక్కడ అధికారిక శాసనపు మాటలను మార్చడం లేదా వాటితో చెలగాటమాడడం ఉద్దేశం; కేవలం అవిధేయత చూపడం కాదు.
- source_word: פִּתְגָמָא דְנָה
  choice: ఈ శాసనాన్ని
  rationale: సామ్రాజ్య పరిపాలనా సందర్భంలో ఇది సాధారణ ‘మాట’ కాక అధికారికంగా ప్రకటించిన శాసనాన్ని సూచిస్తుంది.
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: అతని ఇంటి నుంచి ఒక దూలాన్ని పీకి తీసి
  rationale: శిక్షకు ఉపయోగించడానికి అపరాధి ఇంటి నిర్మాణంలోని కలప దూలాన్ని పెకలించే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: అతన్ని దానిపై గుచ్చి నిలబెట్టాలి
  rationale: తీసిన దూలంపై అతన్ని ఎత్తి బిగించడం లేదా గుచ్చి నిలబెట్టడం అనే ప్రాచీన శిక్షను వ్యక్తపరుస్తుంది; ఆధునిక ఉరి పద్ధతిని అనవసరంగా సూచించదు.
- source_word: נְוָלוּ
  choice: చెత్తకుప్పగా
  rationale: అవమానకరమైన అపవిత్ర స్థలం లేదా వ్యర్థాల కుప్ప అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִתְעֲבֵד
  choice: చేయాలి
  rationale: రాజాజ్ఞలోని విధికర్తవ్య భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָל אֱנָשׁ
  choice: ఎవరైనా
  rationale: మూలంలోని ఏ వ్యక్తికైనా వర్తించే సాధారణ భావాన్ని సహజమైన, సమగ్ర ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సామ్రాజ్య శిక్షా భాషలోని మరణశిక్ష స్వరూపం
  choice: ప్రధాన పాఠంలో ‘దానిపై గుచ్చి నిలబెట్టాలి’
  alternative: ‘దానిపై వేలాడదీయాలి’ లేదా ‘దానికి బిగించాలి’
  rationale: అరామీయ పదబంధం దూలంపై పైకెత్తి నిలపడం, బిగించడం లేదా గుచ్చడం అనే పరిధిని కలిగి ఉంది. ‘గుచ్చి నిలబెట్టాలి’ ప్రాచీన శిక్ష తీవ్రతను చూపుతుంది; అయినా ‘వేలాడదీయాలి’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని కొంత అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో రాజాజ్ఞకు తగిన గంభీరమైన, స్పష్టమైన శైలి వాడబడింది. ‘దూలం’, ‘శాసనం’, ‘చెత్తకుప్ప’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని కఠినమైన శిక్షా చిత్రాన్ని మృదువుపరచలేదు; దాని పదార్థ అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
