source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: te
  text: 'అంతేకాక, ఈ దేవుని మందిరాన్ని తిరిగి కడుతున్న ఈ యూదుల పెద్దల కోసం మీరు ఏమి చేయాలో నేను ఆజ్ఞ జారీ చేస్తున్నాను: వారి ఖర్చులు వెంటనే రాజ ఆదాయం నుండి—నది అవతల ప్రాంతంలో[a] వసూలైన పన్ను నుండి—చెల్లించాలి; పని ఆగిపోకుండా ఉండేందుకు ఇలా చేయాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నది అవతల ప్రాంతం’ అనేది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న భూభాగాలకు పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: అంతేకాక, ... నేను ఆజ్ఞ జారీ చేస్తున్నాను
  rationale: అధికారిక నిర్ణయాన్ని స్థాపించడమనే అరామిక్ పరిపాలనా నుడికారాన్ని, రాజే మాట్లాడుతున్నాడనే భావంతో సహజమైన క్రియాశీల రూపంలో అందిస్తుంది.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: ఈ యూదుల పెద్దలు
  rationale: యూద సమాజ నాయకులను సూచించే పదబంధాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: ఈ దేవుని మందిరాన్ని తిరిగి కడుతున్న
  rationale: דֵךְ ను స్వామ్యార్థకంగా కాకుండా ‘ఈ’ అనే నిర్దేశకంగా కాపాడుతుంది; సందర్భానుసారం నిర్మాణం పునర్నిర్మాణమని ‘తిరిగి కడుతున్న’ స్పష్టం చేస్తుంది.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: రాజ ఆదాయం నుండి—నది అవతల ప్రాంతంలో వసూలైన పన్ను నుండి
  rationale: מִדַּת ను ‘ప్రాంతం’గా కాక ‘పన్ను/కప్పం’గా గుర్తించి, ఆ పన్నే రాజ చెల్లింపుకు ఆర్థిక మూలమని చూపిస్తుంది.
- source_word: אָסְפַּרְנָא
  choice: వెంటనే
  rationale: ఈ పరిపాలనా సందర్భంలో వేగంగా, శ్రద్ధగా అమలు చేయాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: వారి ఖర్చులు ... చెల్లించాలి
  rationale: నిర్మాణ వ్యయాన్ని ఆ పెద్దలకు సమకూర్చాలనే నిష్క్రియ ఆజ్ఞను తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: דִּי לָא לְבַטָּלָא
  choice: అప్పుడు పని ఆగిపోదు
  rationale: సందర్భంలో అంతర్లీనంగా ఉన్న ‘పని’ని స్పష్టం చేస్తూ, నిలిపివేత జరగకూడదనే ఉద్దేశాన్ని కాపాడుతుంది.
