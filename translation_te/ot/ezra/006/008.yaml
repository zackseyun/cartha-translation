  to: 'అంతేకాక, ఈ దేవుని మందిరాన్ని తిరిగి కడుతున్న ఈ యూదుల పెద్దల కోసం మీరు ఏమి చేయాలో నేను ఆజ్ఞ జారీ చేస్తున్నాను: వారి ఖర్చులు వెంటనే రాజ ఆదాయం నుండి—నది అవతల ప్రాంతంలో[a] వసూలైన పన్ను నుండి—చెల్లించాలి; పని ఆగిపోకుండా ఉండేందుకు ఇలా చేయాలి.'
