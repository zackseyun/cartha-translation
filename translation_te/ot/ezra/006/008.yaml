  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజపరిపాలనా శైలి వాడబడింది. ‘దేవుని మందిరం’ మూలంలోని సాధారణ నిర్మాణాన్ని కాపాడుతుంది; ‘నీ దేవుడు’ వంటి మూలంలో లేని స్వామ్యార్థం చేర్చలేదు.
