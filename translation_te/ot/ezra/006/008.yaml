    rationale: దִּי לָא לְבַטָּלָא అనేది పని నిలిచిపోకుండా చూడాలనే ఉద్దేశాన్ని తెలియజేస్తుంది. ‘అప్పుడు పని ఆగిపోదు’ అర్థాన్ని ప్రధానంగా కాపాడినప్పటికీ, ‘పని ఆగిపోకుండా ఉండేందుకు’ మూల వాక్య సంబంధాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
