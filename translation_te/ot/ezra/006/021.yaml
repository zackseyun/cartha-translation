revisions:
- from: చెరనుంచి తిరిగి వచ్చిన ఇశ్రాయేలీయులు[a], వారితో చేరి ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకడానికి ఆ దేశ ప్రజల అపవిత్రతనుంచి[b] తమను తాము వేరుచేసుకున్న వారందరితో కలిసి భోజనం చేశారు[c].
  to: ప్రవాసం నుండి తిరిగివచ్చిన ఇశ్రాయేలీయులు[a], ఆ దేశపు ప్రజల అపవిత్రత నుండి తమను తాము వేరుచేసుకొని, తిరిగివచ్చిన ఇశ్రాయేలీయులతో చేరి ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకడానికి వచ్చిన వారందరితో కలిసి భోజనం చేశారు[c].
  rationale: సవరణ ‘ప్రవాసం’ అనే మరింత ఖచ్చితమైన పదాన్ని ఉపయోగించి, అֲלֵהֶם సూచించే తిరిగివచ్చిన సమాజంతో చేరడం అనే సంబంధాన్ని స్పష్టపరుస్తుంది. అదనపు పాల్గొనేవారు ఎవరో జాతిపరంగా నిర్దిష్టీకరించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది. ‘అపవిత్రత’కు ప్రత్యామ్నాయాలను సూచించే పూర్వపు b గమనిక ప్రధాన అనువాదంలో అటువంటి ప్రత్యామ్నాయ పదాన్ని ఎంచుకోనందున అవసరం లేదు; దాన్ని తొలగించడం పాఠ్యాన్ని, గమనికల సమితిని శుభ్రంగా ఉంచుతుంది.
