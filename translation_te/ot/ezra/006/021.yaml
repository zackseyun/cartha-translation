source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: te
  text: ప్రవాసం నుండి తిరిగివచ్చిన ఇశ్రాయేలీయులు[a], ఆ దేశపు ప్రజల అపవిత్రత నుండి తమను తాము వేరుచేసుకొని, తిరిగివచ్చిన ఇశ్రాయేలీయులతో చేరి ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకడానికి వచ్చిన వారందరితో కలిసి భోజనం చేశారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: c
    text: వారు తిన్నది ముందరి వచనంలో చెప్పిన పస్కా భోజనం.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: భోజనం చేశారు
  rationale: క్రియకు ప్రాథమిక అర్థం ‘తిన్నారు.’ ముందరి వచనంలోని పస్కా భోజనం సందర్భంలో ఉన్నప్పటికీ, మూలంలో కర్మను ప్రత్యేకంగా చెప్పలేదు; తెలుగులో గౌరవప్రదంగా, సహజంగా ‘భోజనం చేశారు’ అని ఇచ్చాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ అయితే ఇక్కడ సమాజమంతటినీ సూచిస్తుంది; ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం పురుషులనే సూచించే అపార్థాన్ని నివారిస్తుంది.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: చెరనుంచి తిరిగి వచ్చిన
  rationale: గלות స్థితినుంచి తిరిగి వచ్చిన సమూహాన్ని సూచించే కృదంత పదబంధం. ‘చెర’ తెలుగు బైబిలు సందర్భంలో ప్రవాసం/బంధిత స్థితి భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְכֹל הַנִּבְדָּל
  choice: తమను తాము వేరుచేసుకున్న వారందరితో కలిసి
  rationale: నిఫాల్ రూపం వేరుపడిన లేదా తమను వేరుచేసుకున్న వారిని సూచిస్తుంది. అదనంగా భోజనంలో పాల్గొన్న సమూహమని వాక్య నిర్మాణంలో స్పష్టంగా చూపించాం.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: ఆ దేశ ప్రజల అపవిత్రతనుంచి
  rationale: טֻמְאָה ఆచారపరమైనదీ నైతికమైనదీ అయిన అపవిత్రతను సూచించగలదు. ‘అపవిత్రత’ ఆ విస్తృతిని నిలుపుతుంది; גּוֹיֵי הָאָרֶץ ను సహజ తెలుగులో ‘ఆ దేశ ప్రజలు’గా ఇచ్చాం.
- source_word: אֲלֵהֶם
  choice: వారితో చేరి
  rationale: అక్షరార్థంగా ‘వారి వద్దకు/వారికి.’ సందర్భంలో తిరిగి వచ్చిన సమాజంతో అనుబంధాన్ని సూచిస్తుంది; ‘వారితో చేరి’ ఆ సంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִדְרֹשׁ
  choice: వెదకడానికి
  rationale: దేవుణ్ణి భక్తితో ఆశ్రయించడం, ఆయనవైపు తిరగడం అనే విస్తృత నిబంధనా భావాన్ని ‘వెదకడం’ నిలుపుతుంది; దాన్ని కేవలం ఆరాధన లేదా విచారణగా సంకుచితం చేయదు.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: దైవనామమైన יהוה ను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: ఇశ్రాయేలు దేవుడనే నిబంధనా గుర్తింపును సహజ తెలుగు విశేషణ నిర్మాణంలో నిలిపాం.
theological_decisions:
- issue: పస్కాలో పాల్గొన్న అదనపు సమూహం ఎవరు?
  choice: వారి జాతి గుర్తింపును నిర్దిష్టంగా నిర్ణయించకుండా, దేశ ప్రజల అపవిత్రతనుంచి వేరై తిరిగివచ్చిన సమాజంతో చేరిన వారిగా వర్ణించడం
  alternative: వారిని ప్రత్యేకంగా అన్యజన మతాంతరితులు లేదా దేశంలో మిగిలిన ఇశ్రాయేలీయులు అని గుర్తించడం
  rationale: హీబ్రూ వాక్యం వారి జాతి గుర్తింపును స్పష్టంగా నిర్ధారించదు. కాబట్టి మూలంలోని తెరవుదలనీ దైవశాస్త్రీయ ఉద్రిక్తతనీ అనువాదం నిలుపుతుంది.
- issue: אֲלֵהֶם యొక్క సంబంధ భావం
  choice: ‘వారితో చేరి’ అని సందర్భార్థాన్ని వ్యక్తీకరించడం
  alternative: ‘వారి వద్దకు/వారికి’ అని అక్షరార్థంగా ఉంచడం లేదా దాన్ని అనువాదంలో విడిచిపెట్టడం
  rationale: సర్వనామం మూలంలో స్పష్టంగా ఉంది. అది తిరిగివచ్చిన సమాజంతో అనుబంధాన్ని సూచిస్తుంది; అయితే అధికారిక మతమార్పిడి అనే భావాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సమూహ గుర్తింపు అస్పష్టతను నిలిపి, అనవసరమైన మతపరమైన వర్గీకరణను నివారించాం.
