  source_fidelity: మూల హీబ్రూలోని మూడు భాగాలు—ప్రవాసం నుండి తిరిగివచ్చిన ఇశ్రాయేలీయులు, దేశపు ప్రజల అపవిత్రత నుండి తమను వేరుచేసుకున్న ఇతరులు, యెహోవాను వెదకడం అనే ఉద్దేశం—అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే ‘చెర’ కంటే ‘ప్రవాసం’ గోలాహ్‌కు మరింత ఖచ్చితమైన ఆధునిక సమానార్థకం. అలాగే ప్రస్తుత పదక్రమంలో ‘వారితో చేరి’ ఎవరిని సూచిస్తుందో క్షణికంగా అస్పష్టంగా ఉంది; దానిని తిరిగివచ్చిన ఇశ్రాయేలీయులతో స్పష్టంగా అనుసంధానించాలి.
  naturalness: ‘భోజనం చేశారు,’ ‘అపవిత్రత,’ ‘వెదకడానికి’ సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. సవరించిన వాక్యక్రమం దీర్ఘమైన హీబ్రూ వాక్యాన్ని తెలుగు పాఠకునికి సులభంగా అర్థమయ్యేలా చేస్తుంది.
  terminology: ‘ఇశ్రాయేలీయులు,’ ‘అపవిత్రత,’ ‘యెహోవా,’ ‘ఇశ్రాయేలు దేవుడు’ పదాలు తగినవి. ‘ప్రవాసం’ అనేది גּוֹלָה యొక్క సందర్భోచిత అర్థాన్ని ‘చెర’ కంటే మెరుగ్గా అందిస్తుంది. ‘ఆ దేశపు ప్రజలు’ గּוֹיֵי הָאָרֶץ‌లోని బహువచన, స్థానిక సూచనలను నిలుపుతుంది.
