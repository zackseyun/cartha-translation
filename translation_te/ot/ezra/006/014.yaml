source:
  edition: WLC
  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: te
  text: యూదుల పెద్దలు కడుతూ, హగ్గయి ప్రవక్త మరియు ఇద్దో కుమారుడైన జెకర్యా ప్రవచనం ద్వారా వర్ధిల్లుతూ ఉన్నారు.[a] వారు ఇశ్రాయేలు దేవుని ఆజ్ఞ ప్రకారం[b], అలాగే కోరెషు, దర్యావేషు, పారసీక రాజైన అర్తహషస్త ఆజ్ఞ ప్రకారం కట్టి పూర్తి చేశారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సఫలమవుతూ ఉన్నారు”; లేదా, “పురోగమిస్తూ ఉన్నారు.”
    reason: lexical_alternative
  - marker: b
    text: “ఆజ్ఞ ప్రకారం” అనే మాటకు “శాసనం ప్రకారం” లేదా “ఉత్తర్వు ప్రకారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ వచనం పని పూర్తికావడాన్ని దేవుని ఆజ్ఞకూ పారసీక రాజుల ఆజ్ఞకూ ఆపాదిస్తుంది; దేవుని ఆజ్ఞను ముందుగా పేర్కొంటుంది.
    reason: cross_reference
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: యూదుల పెద్దలు
  rationale: సమాజంలోని నాయకత్వ బాధ్యతగల పెద్దలను సూచించే అరామీయ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; దానిని భౌగోళికంగా ‘యూదా పెద్దలు’ అని పరిమితం చేయదు.
- source_word: בָּנַיִן
  choice: కట్టిస్తూ ... ఉన్నారు
  rationale: అరామీయ వర్తమాన కృదంతంలోని కొనసాగుతున్న నిర్మాణక్రియను నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ అనే భావాన్ని చేర్చదు.
- source_word: וּמַצְלְחִין
  choice: వర్ధిల్లుతూ ఉన్నారు
  rationale: పని సఫలంగా సాగడం, అభివృద్ధి చెందడం అనే భావాన్ని తెలియజేస్తుంది; ‘సఫలమవుతూ’ లేదా ‘పురోగమిస్తూ’ అనే భావాలు కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: בִּנְבוּאַת
  choice: ప్రకటించిన ప్రవచనం ద్వారా
  rationale: ప్రవక్తల ప్రవచన పరిచర్య నిర్మాణకారుల విజయానికి సాధనంగా పనిచేసిందనే ఉపకరణార్థక భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַגַּי נביאה
  choice: హగ్గయి ప్రవక్త
  rationale: పేరు, బిరుదు కలిగిన అరామీయ సమాసాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: ఇద్దో కుమారుడు జెకర్యా
  rationale: అరామీయ ‘బర్’ అనే పుత్రసంబంధ సూచనను సహజమైన తెలుగు వంశపరిచయ రూపంలో అనువదిస్తుంది.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: కట్టి పూర్తి చేశారు
  rationale: ‘కట్టారు, పూర్తి చేశారు’ అనే రెండు సమన్విత క్రియల భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; పూర్తి చేసినది సందర్భానుసారం నిర్మాణమే.
- source_word: מִן טַעַם
  choice: ఆజ్ఞ ప్రకారం
  rationale: అధికారిక ఆజ్ఞ, శాసనం లేదా ఉత్తర్వు అనే సామ్రాజ్య అరామీయ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; దేవునికీ రాజులకీ వర్తించే పునరుక్త నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: మూలంలోని సంబంధార్థక దైవ బిరుదును నేరుగా నిలుపుతుంది.
- source_word: וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: కోరెషు, దర్యావేషు, అర్తహషస్తల ఆజ్ఞ ప్రకారం
  rationale: ముగ్గురు పారసీక రాజుల పేర్లను మూల క్రమంలో ఉంచి, తెలుగులో సహజంగా ఒకసారి ‘ఆజ్ఞ ప్రకారం’ అని అనుసంధానిస్తుంది.
- source_word: מֶלֶךְ פָּרָס
  choice: పారసీక రాజైన
  rationale: ఏకవచన బిరుదు వ్యాకరణరీత్యా చివరి పేరుతో అనుసంధానమయ్యే అవకాశాన్ని కాపాడేందుకు ‘రాజులైన’ అని బహువచనంగా మార్చకుండా అనువదించబడింది.
theological_decisions:
- issue: దైవిక ఆజ్ఞకు, సామ్రాజ్య ఆజ్ఞలకు మధ్య సంబంధం
  choice: ఆలయ నిర్మాణపు పూర్తి దేవుని ఆజ్ఞ ప్రకారం కూడా, పారసీక రాజుల ఆజ్ఞ ప్రకారం కూడా జరిగినట్లు అనువదించబడింది; దేవుని ఆజ్ఞ ముందుగా ఉంచబడింది.
  alternative: రాజుల ఆజ్ఞలు దేవుని ఆజ్ఞకు లోబడిన వ్యక్తీకరణలేనని వ్యాఖ్యానించడం.
  rationale: వచనం దైవిక, మానవ అధికారాలు రెండింటినీ స్పష్టంగా పేర్కొంటుంది; వాటి సంబంధాన్ని మూలం చెప్పినదానికంటే ఎక్కువగా సిద్ధాంతీకరించకుండా ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కట్టిస్తూ ... వర్ధిల్లుతూ ఉన్నారు’ అనే రూపం రెండు కొనసాగుతున్న అరామీయ కృదంతాలను నిలుపుతుంది. రాజబిరుదు ఏకవచనంలో ఉన్న మూల అస్పష్టతను బహువచన వివరణతో తొలగించకుండా ‘పారసీక రాజైన’ అని ఉంచబడింది.
