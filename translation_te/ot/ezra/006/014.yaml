revisions:
- from: యూదుల పెద్దలు కట్టిస్తూ, హగ్గయి ప్రవక్త మరియు ఇద్దో కుమారుడు జెకర్యా ప్రకటించిన ప్రవచనం ద్వారా వర్ధిల్లుతూ ఉన్నారు.[a] వారు ఇశ్రాయేలు దేవుని ఆజ్ఞ ప్రకారం[b], అలాగే పారసీక రాజైన కోరెషు, దర్యావేషు, అర్తహషస్తల ఆజ్ఞ ప్రకారం కట్టి పూర్తి చేశారు.[c]
  to: యూదుల పెద్దలు కడుతూ, హగ్గయి ప్రవక్త మరియు ఇద్దో కుమారుడైన జెకర్యా ప్రవచనం ద్వారా వర్ధిల్లుతూ ఉన్నారు.[a] వారు ఇశ్రాయేలు దేవుని ఆజ్ఞ ప్రకారం[b], అలాగే కోరెషు, దర్యావేషు, పారసీక రాజైన అర్తహషస్త ఆజ్ఞ ప్రకారం కట్టి పూర్తి చేశారు.[c]
  rationale: ప్రేరణార్థకమైన ‘కట్టిస్తూ’ స్థానంలో మూలంలోని కొనసాగుతున్న నిర్మాణక్రియను తెలిపే ‘కడుతూ’ ఉంచబడింది. అర్తహషస్త పేరును విభక్తి/బహువచన రూపం లేకుండా సరిచేసి, మూలంలోని ‘పారసీక రాజు’ అనే ఏకవచన బిరుదును చివరి పేరుతోనే ఉంచాం. పాదసూచిక గుర్తులు తమ సంబంధిత పదబంధాల వద్దనే కొనసాగించబడ్డాయి.
