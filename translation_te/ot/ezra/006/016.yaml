  text: וַ/עֲבַ֣דוּ בְנֵֽי יִ֠שְׂרָאֵל כָּהֲנַיָּ֨/א וְ/לֵוָיֵ֜/א וּ/שְׁאָ֣ר בְּנֵי גָלוּתָ֗/א חֲנֻכַּ֛ת בֵּית אֱלָהָ֥/א דְנָ֖ה בְּ/חֶדְוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు, చెరలోని వారిలో మిగిలినవారు ఈ దేవుని మందిర ప్రతిష్ఠను ఆనందంతో జరుపుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: జరుపుకున్నారు
  rationale: ఈ అరమేయ సందర్భంలో ప్రతిష్ఠ అనే ఆచార కార్యక్రమాన్ని నిర్వహించడం లేదా ఆచరించడం అనే భావం ఉంది; తెలుగులో ‘ప్రతిష్ఠను జరుపుకున్నారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ కంటే, సమస్త సమాజాన్ని సూచించే మూలభావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּהֲנַיָּא
  choice: యాజకులు
  rationale: యాజక వర్గానికి ప్రామాణికమైన, సాధారణ తెలుగు పదం.
- source_word: וְלֵוָיֵא
  choice: లేవీయులు
  rationale: దేవాలయ సేవతో సంబంధమున్న లేవి వంశస్థులకు ప్రామాణికమైన అనువాదం.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: చెరనుంచి తిరిగివచ్చిన మిగతావారు
  rationale: ‘చెర కుమారుల్లో మిగిలినవారు’ అనే మూలవ్యక్తీకరణ సూచించే, యాజకులు మరియు లేవీయులు కాకుండా చెరనుంచి తిరిగివచ్చిన మిగతా సమాజాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֲנֻכַּת
  choice: ప్రతిష్ఠ
  rationale: మందిరాన్ని ప్రత్యేక ఉపయోగానికి అంకితం చేసే కార్యక్రమాన్ని సూచించే సూటి, సందర్భోచిత పదం.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: ఈ దేవుని మందిరం
  rationale: మూలంలోని ‘ఈ దేవుని ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది; తెలుగులో ‘దేవుని మందిరం’ సహజంగా ఉండి ఉద్దేశిత స్థలాన్ని స్పష్టపరుస్తుంది.
- source_word: בְּחֶדְוָה
  choice: సంతోషంగా
  rationale: ఉపసర్గతో కూడిన నామవాచకాన్ని తెలుగులో సహజమైన క్రియావిశేషణ రూపంలో అందిస్తుంది.
