translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. జాబితా నిర్మాణాన్ని డ్యాష్‌లతో స్పష్టం చేసి, యాజకులు మరియు లేవీయులు ఇశ్రాయేలు సమాజంలో భాగమని మూల వాక్య నిర్మాణానికి అనుగుణంగా చూపించబడింది.
