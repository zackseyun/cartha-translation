id: EZR.6.22
reference: Ezra 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: te
  text: వారు పులియని రొట్టెల పండుగను ఏడు రోజులపాటు ఆనందంతో ఆచరించారు. ఎందుకంటే యాహ్వే వారిని సంతోషపరిచాడు[a]. ఇశ్రాయేలు దేవుని మందిరపు పనిలో వారి చేతులను బలపరచడానికి, అష్షూరు రాజు[b] హృదయాన్ని వారి వైపుకు తిప్పాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆనందించేలా చేశాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “అష్షూరు రాజు” అని ఉంది. ఎజ్రా కాలంలోని పాలకుడు పర్షియా రాజైనప్పటికీ, పూర్వ అష్షూరు సామ్రాజ్య ప్రాంతాలను కలిగిన విస్తృత సామ్రాజ్యానికి సంబంధించిన పాత బిరుదును ఇక్కడ ఉపయోగించి ఉండవచ్చు.
    reason: cultural_note
  - marker: c
    text: లేదా, “అష్షూరు రాజు హృదయాన్ని వారి పట్ల అనుకూలంగా మళ్లించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ఆచరించారు
  rationale: పండుగతో కూడిన עשה అనే ప్రయోగం దానిని జరుపుకోవడం లేదా ఆచరించడం అని సూచిస్తుంది; ‘ఆచరించారు’ మూలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חַג מַצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: ఇది ఇశ్రాయేలీయుల స్థిరమైన పండుగ పేరు; ‘మత్సోత్’ను సాధారణ పాఠకులకు స్పష్టంగా ‘పులియని రొట్టెలు’గా తెలిపింది.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה
  choice: ఏడు రోజులపాటు ఆనందంతో
  rationale: కాలవ్యవధినీ, పండుగను ఆచరించిన ఆనందభావాన్నీ సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: שִׂמְּחָם
  choice: వారిని సంతోషపరిచాడు
  rationale: పియేల్ క్రియలోని కారణార్థక భావాన్ని, అంటే యాహ్వే వారు సంతోషించేలా చేశాడనే భావాన్ని, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וְהֵסֵב לֵב
  choice: హృదయాన్ని ... వైపుకు తిప్పాడు
  rationale: రాజు అంతరంగ వైఖరి వారి పక్షంగా మళ్లించబడిందనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; ‘అనుకూలంగా మార్చాడు’ అని అర్థాన్ని మరీ స్పష్టీకరించదు.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: పర్షియా కాలపు సందర్భం ఉన్నప్పటికీ, మూలపాఠంలో ఉన్న ‘అష్షూరు రాజు’ అనే చారిత్రక బిరుదును మార్చకుండా ఉంచుతుంది.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: వారి చేతులను బలపరచడానికి
  rationale: పని చేయడానికి శక్తి లేదా సహాయం ఇవ్వడాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘చేతులు’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మందిరపు పనిలో
  rationale: ‘దేవుని మందిరం, ఇశ్రాయేలు దేవుడు’ అనే అన్వయాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తూ, మందిరం ఎవరిదో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: పర్షియా కాలంలో ‘అష్షూరు రాజు’ అనే designation
  choice: మూలపాఠంలోని ‘అష్షూరు రాజు’నే నిలుపడం
  alternative: పర్షియా రాజు / అష్షూరును ఏలిన రాజు
  rationale: హీబ్రూ స్పష్టంగా ‘అష్షూరు రాజు’ అంటుంది. చారిత్రక సమన్వయం కోసం ప్రధాన పాఠాన్ని మార్చకుండా, అవసరమైన నేపథ్యాన్ని పాదసూచికలో తెలిపింది.
- issue: రాజు హృదయాన్ని తిప్పడం
  choice: హృదయాన్ని వారి వైపుకు తిప్పాడు
  alternative: హృదయాన్ని వారికి అనుకూలంగా చేశాడు
  rationale: దేవుని కార్యాన్నీ రాజు వైఖరిలో వచ్చిన మార్పునీ మూలంలోని రూపకంతోనే ఉంచుతుంది; మార్పు ఎలా జరిగిందో అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘చేతులను బలపరచడం,’ ‘హృదయాన్ని తిప్పడం’ వంటి మూల రూపకాలను అర్థమయ్యేంత సహజంగా నిలిపింది. వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా పొడవైన హీబ్రూ నిర్మాణాన్ని తెలుగులో స్పష్టంగా చేసింది.
