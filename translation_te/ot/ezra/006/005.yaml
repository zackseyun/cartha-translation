source:
  edition: WLC
  text: וְ֠/אַף מָאנֵ֣י בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבֽוּכַדְנֶצַּ֗ר הַנְפֵּ֛ק מִן הֵיכְלָ֥/א דִי בִ/ירוּשְׁלֶ֖ם וְ/הֵיבֵ֣ל לְ/בָבֶ֑ל יַהֲתִיב֗וּן וִ֠/יהָךְ לְ/הֵיכְלָ֤/א דִי בִ/ירֽוּשְׁלֶם֙ לְ/אַתְרֵ֔/הּ וְ/תַחֵ֖ת בְּ/בֵ֥ית אֱלָהָֽ/א־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: te
  text: అంతేకాక, దేవుని మందిరానికి చెందిన బంగారు, వెండి పాత్రలను—నెబుకద్నెజరు యెరూషలేములోని ఆలయం నుంచి తీసి బబులోనుకు తెచ్చిన వాటిని—తిరిగి ఇవ్వాలి; వాటిని యెరూషలేములోని ఆలయానికి, వాటి వాటి స్థానాలకు చేర్చాలి[a]. నీవు వాటిని దేవుని మందిరంలో ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని తిరిగి ఇవ్వాలి; అవి యెరూషలేములోని ఆలయానికి, ప్రతి ఒక్కటీ దాని స్థానానికి వెళ్లాలి.” ఇక్కడ “వెళ్లాలి/చేర్చాలి” అనే భాగంలోని అరామీయ పదబంధం కొంత క్లిష్టంగా ఉంది. అయితే ఆలయ పాత్రలను యెరూషలేములో వాటి తగిన స్థానాలకు తిరిగి చేర్చాలనేదే భావం.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: అంతేకాక
  rationale: రాజాజ్ఞలో అదనంగా చేర్చిన అంశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מָאנֵי
  choice: పాత్రలు
  rationale: ఆరాధనలో లేదా ఆలయ సామగ్రిగా ఉపయోగించిన విభిన్న వస్తువులను సూచించే సంప్రదాయబద్ధమైన, విస్తృతార్థక పదం.
- source_word: בֵית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’; తెలుగులో పవిత్ర ఆలయాన్ని గౌరవప్రదంగా, సహజంగా సూచించేందుకు ‘మందిరం’ ఎంచుకోబడింది. הֵיכְלָא కోసం ‘ఆలయం’ వాడి మూలంలోని పదభేదం నిలుపబడింది.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: బంగారు, వెండి
  rationale: పాత్రలు ఏ పదార్థంతో చేసినవో సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: הַנְפֵּק
  choice: తీసి
  rationale: ఆలయం నుంచి బయటకు తీసుకెళ్లిన చర్యను సంక్షిప్తంగా, సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: הֵיכְלָא
  choice: ఆలయం
  rationale: ఇక్కడ యెరూషలేము దేవాలయాన్నే సూచిస్తుంది; ‘మందిరం’తో పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: וְהֵיבֵל
  choice: తెచ్చిన
  rationale: బబులోనుకు వస్తువులను రవాణా చేసిన కథన చర్యకు సహజమైన తెలుగు పదం.
- source_word: יַהֲתִיבוּן
  choice: తిరిగి అప్పగించి
  rationale: వాటిని తిరిగి ఇవ్వడం లేదా పునరుద్ధరించడం అనే రాజాజ్ఞ భావాన్ని తెలియజేస్తుంది.
- source_word: וִיהָךְ
  choice: చేర్చాలి
  rationale: రూపం కొంత క్లిష్టమైనదైనా, పాత్రలు యెరూషలేము ఆలయంలోని స్థానాలకు వెళ్లేలా చేయాలనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; సందిగ్ధతను పాదసూచికలో ఉంచింది.
- source_word: לְאַתְרֵהּ
  choice: వాటి వాటి స్థానాలకు
  rationale: ఏకవచన పంపిణీ భావాన్ని తెలుగులో ‘వాటి వాటి’ ద్వారా స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְתַחֵת
  choice: నీవు ... ఉంచాలి
  rationale: ద్వితీయ పురుష ఏకవచన రాజాజ్ఞను నేరుగా నిలుపుతుంది.
- source_word: בְּבֵית אֱלָהָא
  choice: దేవుని మందిరంలో
  rationale: మూలంలోని ‘దేవుని ఇల్లు’ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
