source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: te
  text: దీనివల్ల వారు పరలోక దేవునికి ప్రీతికరమైన సువాసనలను[a] అర్పిస్తూ, రాజు మరియు అతని కుమారుల జీవితం కోసం[b] ప్రార్థించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీపియైన సువాసనలు” లేదా “శాంతినిచ్చే సువాసనలు.” అరామీయ పదం దేవునికి ఆమోదయోగ్యమైన బలులతో సంబంధమున్న ప్రీతికరమైన సువాసనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రాజు మరియు అతని కుమారుల క్షేమం కోసం.” అక్షరార్థంగా, “రాజు మరియు అతని కుమారుల జీవితం కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי לֶהֱוֺן
  choice: వారు ... అర్పిస్తూ ... ప్రార్థించాలి
  rationale: דִּי ఉద్దేశాన్ని సూచిస్తుంది; לֶהֱוֺן తరువాతి కృదంతాలతో కలిసి ఆశించిన నిరంతర కార్యాన్ని తెలియజేస్తుంది. ఈ వచనం ముందు వాక్యంలోని రాజాజ్ఞకు కొనసాగింపు కాబట్టి తెలుగులో ‘చేయాలి’ సహజంగా ఆ ఉద్దేశాత్మక-ఆజ్ఞార్థ భావాన్ని అందిస్తుంది.
- source_word: מְהַקְרְבִין
  choice: అర్పిస్తూ
  rationale: קרב ధాతువు ఇక్కడ బలులను దేవునికి సమర్పించే ఆరాధనా సందర్భంలో ఉంది; ‘అర్పించు’ ఆధునిక తెలుగులో సహజమైన బలిసంబంధ పదం.
- source_word: נִיחוֹחִין
  choice: సువాసనగల బలులు
  rationale: ఈ బహువచన పదం దేవునికి ప్రీతికరమైన బలుల సువాసనను సూచిస్తుంది. కేవలం ‘సువాసనలు’ అనడం తెలుగులో ధూపాన్ని మాత్రమే సూచించవచ్చు కాబట్టి, బలి సందర్భాన్ని స్పష్టం చేస్తూనే సువాసన చిత్రణను నిలిపింది.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవునికి
  rationale: ఎజ్రాలోని ఈ దైవ బిరుదును సహజమైన, గౌరవప్రదమైన తెలుగులో నిలిపి, לְ ను ‘కి’గా అనువదించింది.
- source_word: וּמְצַלַּיִן
  choice: ప్రార్థించాలి
  rationale: ఈ కృదంతం ప్రార్థన చేయడాన్ని సూచిస్తుంది; ముందున్న ఉద్దేశాత్మక నిర్మాణంతో కలిపి తెలుగులో ‘ప్రార్థించాలి’ సహజంగా ఉంటుంది.
- source_word: לְחַיֵּי
  choice: ప్రాణం కోసం ... ప్రాణాల కోసం
  rationale: మూలంలోని ‘జీవితం/ప్రాణం’ అనే సూటి భావాన్ని నిలిపింది. కుమారులు బహువచనం కావడంతో తెలుగులో రెండవ ప్రయోగాన్ని ‘ప్రాణాల కోసం’గా సహజంగా మార్చింది.
- source_word: מַלְכָּא
  choice: రాజు
  rationale: మూల అరామీయ పదం సాధారణంగా ‘రాజు’; సందర్భంలోని పారసీక సామ్రాజ్యాధిపతిని సూచించినా పదాన్ని ‘చక్రవర్తి’గా విస్తరించలేదు.
- source_word: וּבְנוֹהִי
  choice: అతని కుమారులు
  rationale: మూలపదం ప్రత్యేకంగా కుమారులను సూచించే పుంలింగ బహువచనం; అందువల్ల ‘పిల్లలు’ అని లింగతటస్థం చేయలేదు.
theological_decisions:
- issue: నִיחוֹחִין అనే బలిసంబంధ వ్యక్తీకరణ
  choice: సువాసనగల బలులు
  alternative: ప్రీతికరమైన సువాసనలు; శాంతినిచ్చే సువాసనలు
  rationale: ఆమోదయోగ్యమైన బలుల సువాసన అనే ఆరాధనా చిత్రాన్ని నిలిపి, దానిని కేవలం ‘బలులు’గా చదును చేయలేదు; అదే సమయంలో తెలుగు పాఠకుడు దీనిని సాధారణ పరిమళంగా తప్పుగా అర్థం చేసుకోకుండా ‘బలులు’ను చేర్చింది.
- issue: రాజు సంబంధీకుల లింగనిర్దిష్ట పదం
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: మూల అరామీయంలోని పుంలింగ బహువచన నిర్దిష్టతను నిలిపింది.
- issue: לְחַיֵּי యొక్క రాజప్రార్థనా భావం
  choice: ప్రాణం కోసం
  alternative: క్షేమం కోసం
  rationale: సందర్భంలో ఇది రాజు క్షేమం లేదా ఆయురారోగ్యాన్ని సూచించగలిగినా, మూలంలోని ‘జీవితం/ప్రాణం’ అనే భావాన్ని ప్రధాన పాఠంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఇది ముందు వచనంలోని రాజాజ్ఞకు వాక్య కొనసాగింపు కావడంతో ‘చేయాలి’ రూపం ఎంచుకోబడింది. ‘సువాసనగల బలులు’ ద్వారా మూలంలోని బలిసంబంధ సువాసన చిత్రణను సహజంగా నిలిపింది.
