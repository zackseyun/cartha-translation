source:
  edition: WLC
  text: וְ/הִשְׁתְּכַ֣ח בְּ/אַחְמְתָ֗א בְּ/בִֽירְתָ֛/א דִּ֛י בְּ/מָדַ֥י מְדִינְתָּ֖/ה מְגִלָּ֣ה חֲדָ֑ה וְ/כֵן כְּתִ֥יב בְּ/גַוַּ֖/הּ דִּכְרוֹנָֽ/ה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: te
  text: 'మాదయ ప్రావిన్సులోనున్న ఎక్బతానా[a] కోటలో[b] ఒక గ్రంథపు చుట్ట దొరికింది. అందులో ఈ విధంగా వ్రాయబడి ఉంది: నమోదు[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అహ్మెతా”; ఇది ఎక్బతానాకు అరామీయ భాషలో ఉన్న పేరుకు మరింత దగ్గరైన లిప్యంతరీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దుర్గం”; అరామీయ పదం బలపరచబడిన రాజ లేదా పరిపాలనా సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “జ్ఞాపకపత్రం”; ఈ పదం అధికారికంగా భద్రపరచిన వ్రాతపూర్వక నమోదు లేదా పత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: దొరికింది
  rationale: అరామీయ క్రియలోని నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది; భాండాగారంలో వెదకగా పత్రం లభించిన సందర్భానికీ సరిపోతుంది.
- source_word: אַחְמְתָא
  choice: ఎక్బతానా
  rationale: మాదయి రాజధానికి విస్తృతంగా గుర్తించబడే చారిత్రక నామరూపం; అరామీయ రూపానికి దగ్గరైన పేరును పాదసూచికలో ఇచ్చాం.
- source_word: בִּירְתָא
  choice: కోట
  rationale: బలపరచబడిన రాజ లేదా పరిపాలనా సముదాయాన్ని సూచించే పదానికి సాధారణ పాఠకులకు స్పష్టమైన తెలుగు రూపం.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: మాదయి రాష్ట్రంలోని
  rationale: సంబంధవాక్యాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా మార్చి, పరిపాలనా ప్రాంతం అనే భావాన్ని నిలుపుతుంది.
- source_word: מְגִלָּה חֲדָה
  choice: ఒక గ్రంథపు చుట్ట
  rationale: חֲדָה ఇక్కడ అనిర్దిష్ట ‘ఒక’ అనే భావాన్ని ఇస్తుంది; מְגִלָּהకు ఆధునిక పాఠకుడు అర్థం చేసుకోగల వివరణాత్మక రూపం వాడబడింది.
- source_word: וְכֵן כְּתִיב
  choice: ఇలా రాసి ఉంది
  rationale: తరువాత వచ్చే అధికారిక పత్ర విషయాన్ని పరిచయం చేసే అరామీయ నిర్మాణాన్ని సహజంగా, దాని సూచనాత్మక బలంతో అందిస్తుంది.
- source_word: בְּגַוַּהּ
  choice: అందులో
  rationale: దొరికిన గ్రంథపు చుట్టలోనే వ్రాత ఉందని సంక్షిప్తంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: דִּכְרוֹנָה
  choice: నమోదుగా
  rationale: ఈ పరిపాలనా సందర్భంలో అధికారికంగా భద్రపరచిన నమోదు లేదా జ్ఞాపకపత్రం అనే భావాన్ని ఇస్తుంది; ‘స్మారకం’ అనే అనుచిత భావాన్ని నివారిస్తుంది.
