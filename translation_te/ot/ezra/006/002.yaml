translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. మూలంలోని స్థలవివరణను తెలుగులో సహజంగా ముందుకు తెచ్చాం; అధికారిక భాండాగార సందర్భం ‘నమోదుగా’ అనే పదంతో నిలుపబడింది.
