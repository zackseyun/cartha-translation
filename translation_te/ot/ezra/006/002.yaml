  naturalness: '‘గ్రంథపు చుట్ట’ మరియు ‘దొరికింది’ సహజంగా ఉన్నాయి. ‘నమోదుగా ఇలా రాసి ఉంది’ కంటే ‘ఈ విధంగా వ్రాయబడి ఉంది: నమోదు:’ మూలంలోని పత్ర-ప్రవేశికను, తెలుగులోని అధికారిక నమోదు శైలిని మరింత స్పష్టంగా తెలియజేస్తుంది.'
