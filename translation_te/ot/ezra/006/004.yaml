source:
  edition: WLC
  text: נִדְבָּכִ֞ין דִּי אֶ֤בֶן גְּלָל֙ תְּלָתָ֔א וְ/נִדְבָּ֖ךְ דִּי אָ֣ע חֲדַ֑ת וְ/נִ֨פְקְתָ֔/א מִן בֵּ֥ית מַלְכָּ֖/א תִּתְיְהִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: te
  text: చెక్కి తీర్చిన రాళ్లతో మూడు వరుసలు[a], కొత్త కలపతో ఒక వరుస ఉండాలి; ఆ ఖర్చు రాజగృహం నుండి సమకూర్చాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెక్కిన రాళ్లతో మూడు పొరలు.” అరామీయ పదబంధం యొక్క ఖచ్చితార్థం వివాదాస్పదం; అక్షరార్థంగా “దొర్లించిన రాళ్లు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “రాజగృహం” అనేది ఇక్కడ బహుశా రాజకోశాన్ని లేదా రాజనిధులను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: వరుసలు / ఒక వరుస
  rationale: నిర్మాణ సందర్భంలో ఇవి గోడలోని అడ్డ వరుసలను, అంటే నిర్మాణపు courses‌ను సూచిస్తాయి. ఆధునిక తెలుగులో ‘వరుస’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶבֶן גְּלָל
  choice: చెక్కి తీర్చిన రాళ్లు
  rationale: ఈ నిర్మాణ సందర్భంలో పదబంధం ఆకారం ఇచ్చి సిద్ధం చేసిన రాతి కట్టడపు రాళ్లను సూచించే అవకాశం ఎక్కువ. అక్షరార్థమైన ‘దొర్లించిన రాయి’ కంటే ఈ భావం సందర్భోచితం; నిజమైన పదార్థసందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: תְּלָתָא
  choice: మూడు
  rationale: ముందున్న నిర్మాణ వరుసల సంఖ్యను తెలిపే సంఖ్యావాచకం.
- source_word: אָע חֲדַת
  choice: కొత్త కలప
  rationale: భవన నిర్మాణ సందర్భంలో אָע కు ‘కలప’ సహజమైన తెలుగు సమానం; חֲדַת లోని ‘కొత్త’ భావాన్ని నిలిపాం.
- source_word: נִפְקְתָא
  choice: ఖర్చు
  rationale: వ్యయం లేదా ఖర్చు అనే పరిపాలనా భావాన్ని సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִן בֵּית מַלְכָּא
  choice: రాజగృహం నుండి
  rationale: మూలంలోని ‘రాజు గృహం నుండి’ అనే రూపకల్పనను నిలుపుతూ, ఇది రాజకోశాన్ని లేదా రాజనిధులను సూచించవచ్చనే సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: תִּתְיְהִב
  choice: ఇవ్వబడాలి
  rationale: ఆ ఖర్చును సమకూర్చవలసిందనే రాజాజ్ఞాపరమైన విధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
