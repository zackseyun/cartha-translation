  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చెర యొక్క కుమారులు’ అనే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో పదక్షరంగా ఉంచకుండా అర్థస్పష్టంగా అనువదించి, మూలరూపాన్ని పాదటీపులో సంరక్షించాం.
