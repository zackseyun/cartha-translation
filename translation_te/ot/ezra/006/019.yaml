  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: te
  text: చెరలోనుండి వచ్చినవారు మొదటి నెల పద్నాలుగవ రోజున పస్కాను ఆచరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చెర యొక్క కుమారులు’; అంటే చెర అనుభవించిన సమాజం లేదా చెరనుండి వచ్చినవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ఆచరించారు
  rationale: ‘చేశారు’ అనేది అక్షరార్థమైనా, పస్కా కర్మను పాటించడం అనే సందర్భార్థాన్ని ‘ఆచరించారు’ సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: בְנֵי הַגּוֹלָה
  choice: చెరలోనుండి వచ్చినవారు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘చెర యొక్క కుమారులు.’ ఇక్కడ అది చెర అనుభవించిన సమాజాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో అక్షరానువాదం అసహజంగా ఉండడంతో, చారిత్రక సందర్భంలో వారి సమూహ గుర్తింపును స్పష్టంగా తెలియజేసే రూపం ఎంచుకోబడింది.
- source_word: הַפָּסַח
  choice: పస్కాను
  rationale: ఈ పదం పస్కా ఆచరణను—బలి, భోజనం, పండుగ సందర్భాన్ని—విస్తృతంగా సూచించగలదు; వాటిలో ఒక్కదానికే పరిమితం చేయకుండా సంప్రదాయ తెలుగు బైబిలు పదమైన ‘పస్కా’ ఉంచబడింది.
- source_word: בְאַרְבָּעָה עָשָׂר
  choice: పద్నాలుగవ రోజున
  rationale: హీబ్రూలో ‘పద్నాలుగున’ అనే తేదీ ప్రయోగం ఉంది; తెలుగులో స్పష్టత, సహజత్వం కోసం ‘రోజు’ చేర్చబడింది.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ‘మొదటి నెల పద్నాలుగవ రోజున’గా అందించబడింది.
