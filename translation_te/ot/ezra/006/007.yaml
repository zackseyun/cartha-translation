source:
  edition: WLC
  text: שְׁבֻ֕קוּ לַ/עֲבִידַ֖ת בֵּית אֱלָהָ֣/א דֵ֑ךְ פַּחַ֤ת יְהוּדָיֵ/א֙ וּ/לְ/שָׂבֵ֣י יְהוּדָיֵ֔/א בֵּית אֱלָהָ֥/א דֵ֖ךְ יִבְנ֥וֹן עַל אַתְרֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: te
  text: ఈ దేవుని మందిరపు పనిని అడ్డుకోకండి. యూదుల పరిపాలకుడిని, యూదుల పెద్దలను ఈ దేవుని మందిరాన్ని దాని స్థలంలో తిరిగి కట్టనివ్వండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదులు’ అనే పదానికి బదులుగా ‘యూదయ ప్రజలు’ అని కూడా అనువదించవచ్చు. అరామీయ పదం యూదా ప్రాంతానికి చెందిన ప్రజలను జాతిపరమైన లేదా ప్రాంతీయమైన అర్థంలో సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: పనిని అడ్డుకోకండి
  rationale: שבק అనే బహువచన ఆజ్ఞ ఇక్కడ పనిలో జోక్యం చేసుకోవడం మానాలని ఆదేశిస్తుంది. తెలుగులో ‘అడ్డుకోకండి’ ఆ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: ఈ దేవుని మందిరం
  rationale: דֵךְ చర్చలో ఉన్న నిర్దిష్ట దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఈ నిర్మాణపు ఆరాధనా స్వరూపాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: פַּחַת
  choice: అధిపతి
  rationale: ఈ పదం ప్రాదేశిక పరిపాలకుణ్ణి సూచిస్తుంది. ‘అధిపతి’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పరిపాలనా పదం.
- source_word: יְהוּדָיֵא
  choice: యూదులు
  rationale: అరామీయ పదం యూదా ప్రాంతానికి చెందినవారిని జాతిపరంగా లేదా ప్రాంతీయంగా సూచించగలదు. ప్రధాన పాఠ్యంలో సంప్రదాయబద్ధంగా, సులభంగా అర్థమయ్యే ‘యూదులు’ వాడబడింది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: యూదుల పెద్దలు
  rationale: שָׂבֵי సమాజ నాయకులైన పెద్దలను సూచిస్తుంది; ‘పెద్దలు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: יִבְנוֹן
  choice: తిరిగి కట్టనివ్వండి
  rationale: శాసన శైలిలోని ఈ బహువచన అసంపూర్ణ క్రియకు అనుమతిని లేదా అధికారపూర్వక ఆదేశాన్ని తెలిపే భావం ఉంది. పునర్నిర్మాణ సందర్భాన్ని ‘తిరిగి కట్ట’ స్పష్టం చేస్తుంది.
- source_word: עַל אַתְרֵהּ
  choice: దాని స్థలంలోనే
  rationale: అసలు నిర్మాణం ఉన్న స్థలంలోనే కట్టాలనే స్థానార్థాన్ని ‘స్థలంలోనే’ సహజంగా, నొక్కి చెబుతుంది.
