translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజాజ్ఞకు తగిన స్పష్టమైన, గౌరవప్రదమైన శైలి. అరామీయ వాక్యంలోని అనుమతి/ఆదేశ భావం మరియు జాతి-ప్రాంత సంబంధ పదంలోని అస్పష్టత నిలుపబడ్డాయి.
