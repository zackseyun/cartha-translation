source:
  edition: WLC
  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: te
  text: ఎందుకంటే మేము బానిసలమే; అయినా మా బానిసత్వంలో మా దేవుడు మమ్మల్ని విడిచిపెట్టలేదు. పారసీక రాజుల ఎదుట ఆయన మాపట్ల నిబంధనకు కట్టుబడిన ప్రేమను[a] చూపించాడు—మాకు పునరుజ్జీవం కలిగించడానికి, మా దేవుని మందిరాన్ని పైకి లేపడానికి, దాని శిథిలాలను పునరుద్ధరించడానికి, యూదాలోనూ యెరూషలేములోనూ మాకు ఒక ప్రాకారాన్ని[b] ఇవ్వడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్థిరమైన ప్రేమ,” “దయ,” “అనుగ్రహం.” హెబ్రీయ חֶסֶד అనే పదం నమ్మకమైన, కృపగల నిబంధన ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రక్షణ కంచె.” ఈ చిత్రం అక్షరార్థమైన గోడనే కాకుండా, యూదాలోనూ యెరూషలేములోనూ లభించిన భద్రతను, సంరక్షణను మరింత విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: బానిసలం / మన బానిసత్వంలో
  rationale: సామ్రాజ్య పాలన కిందనున్న అధీనస్థితి బలాన్ని నిలుపుతూ, ఒకే మూలపదానికి సంబంధించిన హెబ్రీయ సమాంతరతను తెలుగులోనూ కాపాడుతుంది.
- source_word: עֲזָבָנוּ
  choice: మనలను విడిచిపెట్టలేదు
  rationale: ప్రార్థనా సందర్భానికి తగిన సహజమైన ఆధునిక తెలుగు; విడిచిపెట్టడం, పరిత్యజించడం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: మనపట్ల నిబంధనకు కట్టుబడిన ప్రేమను చూపించాడు
  rationale: חֶסֶדలోని విశ్వసనీయమైన, కృపగల, నిబంధన సంబంధ ప్రేమను ఒకే పలుచని పదానికి కుదించకుండా తెలియజేస్తుంది; נטה యొక్క కార్యోన్ముఖ అనుగ్రహాన్ని సహజ తెలుగులో ‘చూపించాడు’గా వ్యక్తపరుస్తుంది.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: పారసీక రాజుల ఎదుట
  rationale: לִפְנֵי యొక్క సమక్షం లేదా దృష్టిలో అనే సంబంధ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִחְיָה
  choice: పునరుజ్జీవం
  rationale: ప్రాణరక్షణతో పాటు చెర అనంతర సమాజానికి కలిగిన నూతన జీవం, పునరుద్ధరణ అనే రెండు భావాలను అందిస్తుంది.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరాన్ని పైకి లేపడానికి
  rationale: רום యొక్క ‘పైకి లేపు’ రూపకాన్ని కాపాడుతూ, ‘దేవుని ఇల్లు’ ఇక్కడ ఆలయమని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: దాని శిథిలాలను తిరిగి నిలబెట్టడానికి
  rationale: עמד హిఫిల్ రూపంలోని ‘నిలబడేలా చేయడం’ అనే మూలచిత్రాన్ని, శిథిలాల పునరుద్ధరణ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: גָדֵר
  choice: ఒక ప్రాకారం
  rationale: గోడ, కంచె, చుట్టూ రక్షణ కల్పించే నిర్మాణం అనే దృశ్యాన్ని నిలుపుతుంది; విస్తృతమైన రక్షణ భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: యూదాలోనూ యెరూషలేములోనూ
  rationale: హెబ్రీయ స్థలవాచక విభక్తిని నేరుగా అనుసరిస్తూ, ప్రాకారం తప్పనిసరిగా రెండు ప్రాంతాల చుట్టూ ఉందని అతివ్యాఖ్యానించదు.
theological_decisions:
- issue: חֶסֶד అనువాదం
  choice: నిబంధనకు కట్టుబడిన ప్రేమ
  alternative: స్థిరమైన ప్రేమ; దయ; అనుగ్రహం
  rationale: దేవుడు తన ప్రజలపట్ల చూపిన కృపగల, విశ్వసనీయ నిబంధన ప్రేమను వ్యక్తపరుస్తుంది. పదంలోని భావసంపదను ఒక్క అర్థానికే పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలుపుతుంది.
- issue: גָדֵר యొక్క రూపక భావం
  choice: ప్రాకారం
  alternative: రక్షణ కంచె; భద్రత లేదా సంరక్షణ
  rationale: మూలంలోని స్పష్టమైన నిర్మాణ దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది అక్షరార్థ గోడకన్నా విస్తృతమైన రాజకీయ రక్షణను సూచించవచ్చనే సందిగ్ధతను పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘బానిసలం,’ ‘పునరుజ్జీవం,’ ‘పైకి లేపడానికి,’ ‘తిరిగి నిలబెట్టడానికి’ అనే పదబంధాలు మూలంలోని పునరుక్తి, రూపకాలను సాధ్యమైనంతవరకు నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉన్నాయి. పాదటిప్పణి గుర్తులు అవి వివరిస్తున్న పదాలకే నేరుగా జోడించబడ్డాయి.
