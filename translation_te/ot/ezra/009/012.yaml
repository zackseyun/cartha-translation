revisions:
- from: కాబట్టి ఇప్పుడు, మీ కుమార్తెలను వారి కుమారులకు ఇవ్వకండి; వారి కుమార్తెలను మీ కుమారుల కోసం తీసుకోకండి. వారి క్షేమాన్నిగానీ వారి మేలునుగానీ ఎన్నటికీ కోరవద్దు.[a] అప్పుడు మీరు బలపడి, దేశంలోని మంచివాటిని తిని, దానిని మీ కుమారులకు శాశ్వత వారసత్వంగా అందిస్తారు.[b]
