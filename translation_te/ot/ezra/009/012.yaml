id: EZR.9.12
reference: Ezra 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, మీ కుమార్తెలను వారి కుమారులకు వివాహానికి ఇవ్వకండి; వారి కుమార్తెలను మీ కుమారులకు వివాహానికి తీసుకోకండి. వారి క్షేమాన్నిగానీ వారి మేలునుగానీ ఎన్నటికీ కోరవద్దు. మీరు బలపడి, దేశపు మేలును అనుభవించి, దానిని మీ కుమారులకు శాశ్వత వారసత్వంగా అందించగలిగేలా ఇలా చేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: మీ కుమార్తెలను వారి కుమారులకు ఇవ్వకండి
  rationale: హీబ్రూ నిర్మాణాన్ని నిలుపుతూ వివాహ సంబంధాన్ని సమాంతర వాక్యం ద్వారా స్పష్టంగా గ్రహించగల సహజ తెలుగు ప్రయోగం.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: వారి కుమార్తెలను మీ కుమారుల కోసం తీసుకోకండి
  rationale: נשא అనే వివాహార్థక నుడికారాన్ని, לִבְנֵיכֶם లోని ‘మీ కుమారుల కోసం’ అనే భావంతో సహా ప్రతిబింబిస్తుంది.
- source_word: תִדְרְשׁוּ
  choice: కోరవద్దు
  rationale: דרש ఇక్కడ వారి మేలును చురుకుగా వెదకడం లేదా కోరడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘కోరు’ సహజంగా ఆ ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: שְׁלֹמָם
  choice: వారి క్షేమం
  rationale: שָׁלוֹם యొక్క శాంతి, సౌఖ్యం, సమగ్ర శ్రేయస్సు అనే విస్తృత భావాన్ని సందర్భానుగుణంగా ‘క్షేమం’ అందిస్తుంది.
- source_word: וְטוֹבָתָם
  choice: వారి మేలు
  rationale: טוֹבָה ను నేరుగా ‘మేలు’గా అనువదించడం ద్వారా శ్రేయస్సు లేదా ప్రయోజనం అనే భావంలోని విస్తృతతను కాపాడుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎన్నటికీ
  rationale: నిషేధ వాక్యంలో నిరంతరమైన, సంపూర్ణమైన కాలబలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: అప్పుడు మీరు బలపడి
  rationale: לְמַעַן తెలిపే ఉద్దేశం/ఫలిత సంబంధాన్ని తెలుగులో సహజంగా చూపుతూ חזק యొక్క ‘బలపడు’ భావాన్ని నిలుపుతుంది.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: దేశంలోని మంచివాటిని తిని
  rationale: ‘దేశపు మంచిని తినడం’ అనే హీబ్రూ దృశ్యరూపాన్ని కాపాడుతూ తెలుగులో అర్థమయ్యేలా బహువచన రూపం వాడబడింది.
- source_word: וְהוֹרַשְׁתֶּם
  choice: దానిని ... శాశ్వత వారసత్వంగా అందిస్తారు
  rationale: ירש హిఫిల్ రూపంలోని వారసత్వంగా సంక్రమింపజేయడం అనే కారణార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘దానిని’ దేశాన్ని సూచిస్తుంది.
- source_word: לִבְנֵיכֶם
  choice: మీ కుమారులకు
  rationale: మూలంలోని పురుష బహువచన నిర్దిష్టతను ‘పిల్లలు’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: శాశ్వత
  rationale: తరతరాలకు కొనసాగే వారసత్వ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్వాసానంతర నిబంధన సందర్భంలోని జాతి/మత వేర్పాటు భాష
  choice: అంతర్వివాహ నిషేధాన్ని, చుట్టుపక్కల ప్రజల క్షేమం లేదా మేలు కోరకూడదనే ఆజ్ఞను ఈ ప్రత్యేక నిబంధన-చారిత్రక సందర్భంలో ఉన్నట్టుగానే సూటిగా అనువదించడం.
  alternative: దీనిని కేవలం ఆధ్యాత్మికంగా హానికరమైన సంబంధాలపై సాధారణ హెచ్చరికగా మృదువుచేయడం, లేదా బయటి వారందరితో సంబంధాలపై సర్వకాలిక ఆజ్ఞగా విస్తరించడం.
  rationale: వచనంలోని కఠినతను తగ్గించకుండానూ, మూలంలో లేని సార్వత్రిక సిద్ధాంత అన్వయాన్ని చేర్చకుండానూ, ఎజ్రా కాలపు నిబంధన విశ్వాస సందర్భాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణం, వివాహ సూచన, ‘క్షేమం/మేలు’ అనే రెండు భావాలు, దేశపు మంచిని తినడం అనే దృశ్యరూపం కాపాడబడ్డాయి. ప్రధాన పాఠ్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
