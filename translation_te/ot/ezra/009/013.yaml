revisions:
- from: మా చెడ్డ పనులవల్ల, మా అపరాధం ఎంతో గొప్పది కావడంవల్ల ఇదంతా మాపైకి వచ్చిన తరువాత కూడా—మా దేవా, నీవు మా దోషాలకు తగినంత శిక్షను మాకు విధించకుండా[a], మాకు ఇలాంటి శేషాన్ని ఇచ్చావు[b]—
  to: మా చెడ్డ పనులవల్లా, మా గొప్ప అపరాధంవల్లా మాపైకి వచ్చిన వీటన్నిటి తరువాత కూడా—మా దేవా, మా దోషాలకు తగినదానికంటే తక్కువగా నీవు మమ్మల్ని శిక్షించి, మాకు ఇలాంటి శేషాన్ని ఇచ్చావు—
  rationale: సవరించిన పాఠం హీబ్రూ కారణపదబంధాల సమాంతరతను పునరుద్ధరిస్తుంది; శిక్ష వారి దోషాలకు తగినదానికంటే తక్కువగా ఉందనే తులనాత్మక భావాన్ని స్పష్టపరుస్తుంది; మరియు פְּלֵיטָהకు సందర్భోచితమైన “శేషం”ను ఉంచి దాని ఇతర సమర్థనీయ అర్థాలను పాదసూచికలో ఇస్తుంది. వచనం తదుపరి వచనంలో కొనసాగుతున్నందున చివరి దీర్ఘవిరామాన్ని నిలిపాం.
