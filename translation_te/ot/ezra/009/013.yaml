id: EZR.9.13
reference: Ezra 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: te
  text: మా చెడ్డ పనులవల్లా, మా గొప్ప అపరాధంవల్లా మాపైకి వచ్చిన వీటన్నిటి తరువాత కూడా—మా దేవా, మా దోషాలకు తగినదానికంటే తక్కువగా నీవు మమ్మల్ని శిక్షించి, మాకు ఇలాంటి శేషాన్ని ఇచ్చావు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל הַבָּא עָלֵינוּ
  choice: ఇదంతా మాపైకి వచ్చిన తరువాత కూడా
  rationale: ‘మాపైకి వచ్చిన’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, ముందరి ప్రార్థనతో అనుసంధానాన్ని మరియు దేవుడు చూపిన కరుణతో ఉన్న వ్యత్యాసాన్ని ‘కూడా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: మా చెడ్డ పనులవల్ల
  rationale: ఇక్కడ בְּ కారణార్థకంగా ఉంది; సామాన్య పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో కారణాన్ని తెలియజేస్తుంది.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: మా అపరాధం ఎంతో గొప్పది కావడంవల్ల
  rationale: אַשְׁמָה కేవలం అపరాధ భావనను కాక నిజమైన దోషబాధ్యతను సూచిస్తుంది; ‘అపరాధం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: మా దోషాలకు తగినంత శిక్షను మాకు విధించకుండా
  rationale: חָשַׂךְ యొక్క ‘నిలిపివేయు/మినహాయించు’ భావాన్ని ప్రతికూల నిర్మాణంతో నిలుపుతూ, వారి దోషం కోరిన పూర్తి శిక్షను దేవుడు విధించలేదనే హీబ్రూ నుడికార భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עָוֺן
  choice: దోషాలు
  rationale: ఈ పదంలోని పాపకార్యం మరియు దాని వల్ల కలిగే బాధ్యత అనే రెండు భావాలకు ‘దోషాలు’ అనుకూలంగా ఉంది.
- source_word: וְנָתַתָּה לָּנוּ פְּלֵיטָה כָּזֹאת
  choice: మాకు ఇలాంటి శేషాన్ని ఇచ్చావు
  rationale: న్యాయతీర్పు నుండి తప్పించుకొని మిగిలిన సమూహాన్ని సూచించే פְּלֵיטָה పదానికి చెరానంతర సందర్భంలో ‘శేషం’ సంక్షిప్తమైన, సందర్భోచితమైన ఎంపిక; ప్రత్యామ్నాయ భావాలు పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: దోషానికి తగిన తీర్పు మరియు దేవుని కరుణ మధ్య సంబంధం
  choice: మా దోషాలకు తగినంత శిక్షను మాకు విధించకుండా
  alternative: మా దోషాలు అర్హమైనదానికంటే తక్కువగా మమ్మల్ని శిక్షించి
  rationale: ఎంచుకున్న రూపం దేవుడు తీర్పును పూర్తిగా అమలు చేయకుండా నిలిపాడనే మూల క్రియ భావాన్ని కాపాడుతుంది; అదే సమయంలో న్యాయం, కరుణ రెండింటినీ ఉంచుతుంది.
- issue: פְּלֵיטָה యొక్క సామూహిక లేదా భావవాచక అర్థం
  choice: శేషం
  alternative: తప్పించుకున్నవారు; తప్పించుకొనే అవకాశం
  rationale: చెరానంతర చారిత్రక సందర్భంలో సంరక్షించబడిన సమాజాన్ని ‘శేషం’ సముచితంగా సూచిస్తుంది; అయితే మూలపదంలోని ‘తప్పించుకోవడం/తప్పించుకున్నవారు’ అనే పరిధిని పాదసూచికలో నిలిపాం.
- issue: כִּי యొక్క వాక్యసంబంధ పాత్ర
  choice: ప్రత్యేక పదంగా అనువదించకుండా, ‘తరువాత కూడా—’ అనే వాక్యనిర్మాణంలో వ్యత్యాసార్థాన్ని వ్యక్తం చేయడం
  alternative: ఎందుకంటే; నిజానికి
  rationale: ఈ సందర్భంలో כִּי వివరణాత్మకంగా లేదా concessive సంబంధాన్ని బలపరచేదిగా గ్రహించవచ్చు. తెలుగు వాక్యనిర్మాణం కరుణతో ఉన్న వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది; ‘ఎందుకంటే’ అని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామ సూచికను ఉంచాం. ‘శేషం’ బైబిలు సందర్భానికి తగిన పదమైనప్పటికీ, దాని విస్తృత మూలార్థాన్ని పాదసూచిక వివరిస్తుంది.
