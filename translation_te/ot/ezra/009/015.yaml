id: EZR.9.15
reference: Ezra 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: te
  text: ఓ యహ్వే[a], ఇశ్రాయేలు దేవా, నీవు నీతిమంతుడవు. ఎందుకంటే నేటికీ మేము తప్పించుకొని మిగిలిన శేషంగా ఉన్నాం. ఇదిగో, మా అపరాధస్థితిలో నీ సన్నిధిలో ఉన్నాం; ఎందుకంటే దీనివల్ల నీ సన్నిధిలో నిలబడడం ఎవరికీ సాధ్యం కాదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూలో దేవుని ప్రత్యేక నామం.
    reason: divine_name
  - marker: c
    text: హీబ్రూలో, ‘దీనివల్ల నీ సన్నిధిలో నిలబడడం సాధ్యం కాదు’; ఇది అపరాధస్థితిలో దేవుని సన్నిధిలో నిలిచి తట్టుకోలేమనే భావాన్ని తెలిపే నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యంజనాలకు సాధారణంగా అంగీకరించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: ప్రత్యక్ష సంబోధనలో సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగిస్తూ మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడవు
  rationale: నైతికమైన సరిదనాన్ని, న్యాయమైన తీర్పును రెండింటినీ కలిగిన విస్తృత భావాన్ని కాపాడుతుంది; ‘న్యాయవంతుడవు’ కూడా సాధ్యమే.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: తప్పించుకుని మిగిలిన శేషంగా మేము మిగిలి ఉన్నాం
  rationale: నిఫాల్ రూపంలోని మిగిలి ఉండడం అనే భావాన్నీ, פְלֵיטָהలోని తీర్పు నుంచి తప్పించుకుని నిలిచిన సమూహ భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్టుగా
  rationale: ప్రస్తుత పరిస్థితి ప్రత్యక్షంగా కనిపిస్తున్నదనే హీబ్రూ కాలసూచక నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: ఇదిగో, ... నీ సన్నిధిలో ఉన్నాం
  rationale: הִנְנוּలోని ప్రత్యక్ష సమర్పణ, తక్షణత్వాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: మా అపరాధదోషంతో
  rationale: אשמה సూచించే అపరాధం మరియు దాని వల్ల కలిగిన దోషస్థితి రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: దీనివల్ల నీ సన్నిధిలో నిలబడడం ఎవరికీ సాధ్యం కాదు
  rationale: అవ్యక్త అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజంగా మార్చి, దేవుని సన్నిధిలో నిలిచి తట్టుకోలేని న్యాయస్థాన సంబంధ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా నేరుగా సూచిస్తుంది; పాదసూచిక దాని స్వరూపాన్ని వివరిస్తుంది.
- issue: దేవుని צַדִּיק గుణం
  choice: నీతిమంతుడవు
  alternative: న్యాయవంతుడవు
  rationale: ఈ సందర్భంలో దేవుని తీర్పు న్యాయాన్ని మాత్రమే కాక ఆయన సమగ్ర సరిదనాన్ని కూడా సూచించే విస్తృత పదాన్ని ఎంచుకుంది.
- issue: నీ సన్నిధిలో నిలబడలేకపోవడం
  choice: దీనివల్ల నీ సన్నిధిలో నిలబడడం ఎవరికీ సాధ్యం కాదు
  alternative: దీనివల్ల మేము నీ సన్నిధిలో నిలబడలేం
  rationale: హీబ్రూలో స్పష్టమైన ప్రథమ పురుష కర్త లేకుండా సాధారణ అస్తిత్వ నిర్మాణం ఉంది; అందువల్ల దాన్ని ‘మేము’కు మాత్రమే పరిమితం చేయలేదు. అదే సమయంలో సందర్భంలోని అపరాధం కారణమైన అసమర్థతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-ఒప్పుకోలు ధోరణి ఉంచబడింది. ‘ఇదిగో’, ‘నీ సన్నిధి’, ‘శేషం’ వంటి పరిచిత బైబిలు పదాలను సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణంతో కలిపాం; ప్రాచీన లేదా మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
