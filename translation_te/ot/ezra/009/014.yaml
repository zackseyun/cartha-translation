source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: te
  text: మేము మళ్లీ నీ ఆజ్ఞలను ఉల్లంఘించి, ఈ హేయకార్యాలు చేసే ప్రజలతో[a] వివాహ సంబంధాలు ఏర్పరచుకోవాలా? అప్పుడు నీవు మమ్మల్ని పూర్తిగా నాశనం చేసేంతవరకు మాపై కోపపడవా, శేషమైనవారుగానీ తప్పించుకున్నవారుగానీ ఎవరూ మిగలకుండా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఈ హేయకార్యాల ప్రజలతో.” హీబ్రూ పదబంధం బహుశా ఇలాంటి హేయకార్యాలతో గుర్తింపబడిన ప్రజలను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా: “శేషమూ తప్పించుకున్నవారూ లేకుండా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: మేము మళ్లీ ... పెట్టుకోవాలా?
  rationale: שוב యొక్క మూలార్థం ‘తిరిగి రావడం’; ఇక్కడ తరువాతి క్రియలతో కలిసి మునుపటి అవిధేయతను మళ్లీ చేయడాన్ని సూచిస్తుంది.
- source_word: לְהָפֵר מִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలను ఉల్లంఘించి
  rationale: הפר నిబంధనాత్మక లేదా న్యాయ సందర్భంలో ఆజ్ఞను అతిక్రమించడం, ఉల్లంఘించడం అనే బలాన్ని కలిగి ఉంది.
- source_word: וּלְהִתְחַתֵּן
  choice: వివాహ సంబంధాలు పెట్టుకోవడం
  rationale: חתן హిత్పయేల్ రూపం వేరొక సమూహంతో పరస్పర వివాహ బంధాల్లో ప్రవేశించడాన్ని సూచిస్తుంది; తెలుగు సామూహిక సందర్భంలో ఈ పదబంధం సహజంగా ఉంది.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: ఈ హేయకార్యాలు చేసే ప్రజలతో
  rationale: అక్షరార్థ నిర్మాణం ‘ఈ హేయకార్యాల ప్రజలతో.’ సందర్భానుసారంగా ప్రజల జాతితత్వాన్ని కాక వారి హేయమైన ఆచారాలను సూచించే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: నీవు మాపై కోపపడి ... చేయవా?
  rationale: אנף తీవ్రమైన కోపాన్ని సూచిస్తుంది; ప్రశ్నార్థక రూపం ఆశించబడిన అనుకూల సమాధానంతో కూడిన వాక్చాతుర్య ప్రశ్నను నిలుపుతుంది.
- source_word: עַד כַּלֵּה
  choice: మమ్మల్ని పూర్తిగా నాశనం చేయవా?
  rationale: כלה ఇక్కడ అంతం చేయడం లేదా సంపూర్ణంగా నాశనం చేయడం అనే భావం ఇస్తుంది. ‘పూర్తిగా’ עַד־כלה యొక్క పరాకాష్ఠను స్పష్టం చేస్తుంది.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: శేషంగానీ తప్పించుకున్నవారుగానీ ఎవరూ మిగలకుండా
  rationale: שארית యొక్క బైబిలీయ ‘శేషం’ భావాన్ని నిలుపుతూ, פליטה ను సందర్భానికి తగిన వ్యక్తివాచక అర్థమైన ‘తప్పించుకున్నవారు’గా అనువదించింది.
theological_decisions:
- issue: ప్రజలకు మరియు ‘హేయకార్యాలకు’ మధ్య సంబంధం
  choice: ‘ఈ హేయకార్యాలు చేసే ప్రజలు’ అని, వారి ఆచారాల ఆధారంగా వర్ణించడం
  alternative: ‘ఈ హేయకార్యాల ప్రజలు’
  rationale: హీబ్రూ సమాస నిర్మాణం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది. ప్రధాన పాఠం సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చి మూలంలోని నిర్మాణాన్ని దాచలేదు.
- issue: ‘శేషం’ అనే బైబిలీయ పదాన్ని నిలుపుకోవడం
  choice: ‘శేషం’ పదాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘మిగిలినవారు’
  rationale: తీర్పు తరువాత మిగిలే వారిని సూచించే שארית పదానికి ఉన్న గ్రంథాంతర ప్రతిధ్వనిని ‘శేషం’ కాపాడుతుంది; దానికి సమాంతరంగా פליטה యొక్క వ్యక్తివాచక భావమూ నిలిచింది.
- issue: దైవకోపం మరియు సంపూర్ణ నాశనం మధ్య సంబంధం
  choice: వాక్చాతుర్య ప్రశ్నగానే నిలుపుతూ ‘పూర్తిగా నాశనం చేయవా?’ అని అనువదించడం
  alternative: ‘అంతం వరకు మాపై కోపపడవా?’
  rationale: עַד כַּלֵּה ను కేవలం కోపం కొనసాగే కాలవ్యవధిగా కాక, ఆ కోపం సంపూర్ణ వినాశానికి తీసుకెళ్లే ఫలితంగా చదవడం సందర్భానికి సరిపోతుంది; అయినా ప్రశ్న రూపంలోని ఉద్రిక్తతను పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని పాటించాం. ‘ఉల్లంఘించడం,’ ‘వివాహ సంబంధాలు,’ ‘శేషం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, నిబంధనాత్మక మరియు బైబిలీయ స్వరాన్ని కాపాడుతాయి. మూలంలోని రెండు వాక్చాతుర్య ప్రశ్నలు నిలుపబడ్డాయి.
