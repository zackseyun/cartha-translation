id: EZR.9.11
reference: Ezra 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: te
  text: 'నీ సేవకులైన ప్రవక్తల ద్వారా నీవు ఆజ్ఞాపించినది ఇదే: “మీరు స్వాధీనం చేసుకోవడానికి ప్రవేశిస్తున్న దేశం, ఆ దేశాల ప్రజల అపవిత్రతవల్లను వారి అసహ్యకరమైన ఆచారాలవల్లను, అపవిత్రమైన దేశంగా ఉంది; వారు తమ అపవిత్రతతో దానిని ఒక చివర నుండి మరొక చివర వరకు[a] నింపారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నోటి నుండి నోటికి”; ఇది దేశమంతా పూర్తిగా నిండిపోయిందని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: ద్వారా
  rationale: హీబ్రూ భాషలోని ‘చేతి ద్వారా’ అనే కర్తృత్వ సూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘ద్వారా’ అని అందిస్తుంది.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: నీ సేవకులైన ప్రవక్తలు
  rationale: దేవుని ప్రతినిధులైన ప్రవక్తల గౌరవపూర్వక సేవాసంబంధాన్ని తెలుపుతుంది; బానిసత్వ భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: לְרִשְׁתָּהּ
  choice: స్వాధీనం చేసుకోవడానికి
  rationale: దేశాన్ని వారసత్వంగా పొందడం, అధీనంలోకి తీసుకోవడం అనే ירשׁ పదంలోని భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ נִדָּה
  choice: అపవిత్రమైన దేశం
  rationale: నִדָּהలోని అశుద్ధత/అపవిత్రత భావాన్ని సహజమైన తెలుగులో ఉంచి, దాన్ని కేవలం ఆచారపరమైనదిగా లేదా కేవలం నైతికమైనదిగా పరిమితం చేయదు.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: వివిధ దేశాల ప్రజల అపవిత్రతవల్ల
  rationale: בְּను ఇక్కడ కారణార్థకంగా తీసుకుంటూ, ‘దేశాల ప్రజలు’ అనే హీబ్రూ బహువచన విస్తృతిని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: వారి హేయకార్యాలవల్ల
  rationale: תּוֹעֵבָה సూచించే దేవునికి అసహ్యమైన ఆచారాలు/కార్యాల బలమైన నైతిక-మతపరమైన భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִפֶּה אֶל־פֶּה
  choice: ఒక చివర నుండి మరొక చివర వరకు
  rationale: అక్షరార్థంగా ‘నోటి నుండి నోటికి’ అయినా, దేశమంతటినీ పూర్తిగా నింపారనే స్థలవ్యాప్తి నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּטֻמְאָתָם
  choice: తమ అపవిత్రతతో
  rationale: טֻמְאָהలోని అశుద్ధత/కలుషితత్వ భావాన్ని నిలుపుతూ, వారు దేశాన్ని దేనితో నింపారో సాధనార్థకంగా తెలుపుతుంది.
theological_decisions:
- issue: దేశపు అపవిత్రత స్వభావం
  choice: ఆచారపరమైన మరియు నైతిక-నిబంధనాపరమైన భావాలు రెండూ సాధ్యమయ్యేలా ‘అపవిత్రత’ అనే పదాన్ని నిలుపుట
  alternative: దాన్ని పూర్తిగా ‘ఆచార అశుద్ధత’గా లేదా పూర్తిగా ‘నైతిక అవినీతి’గా అనువదించడం
  rationale: נִדָּה, טֻמְאָה, תּוֹעֵבָה పదాలు ఆచారపరమైన అశుద్ధతతో పాటు నైతిక, నిబంధనాపరమైన హేయతను కూడా సూచించగలవు; మూలంలోని భావ ఉద్రిక్తతను ఒకే వర్గానికి కుదించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా/గ్రంథ శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని అర్థస్పష్టత కోసం మూడు వాక్యాలుగా విభజించినా, కారణ సంబంధాలు మరియు అపవిత్రతకు సంబంధించిన పునరుక్తిని నిలిపాం.
