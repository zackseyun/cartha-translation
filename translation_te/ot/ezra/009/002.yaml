- from: ఎందుకంటే, వారు తమకోసం, తమ కుమారులకోసం ఆ ప్రజల కుమార్తెలలో కొందరిని తీసుకున్నారు[a]. అలా పరిశుద్ధ సంతానం[b] దేశదేశాల ప్రజలతో కలిసిపోయింది. ఈ నమ్మకద్రోహంలో అధికారుల, అధిపతుల హస్తమే ముందంజలో ఉంది[c].
