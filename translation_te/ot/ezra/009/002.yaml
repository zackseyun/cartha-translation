  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי נָשְׂא֣וּ מִ/בְּנֹֽתֵי/הֶ֗ם לָ/הֶם֙ וְ/לִ/בְנֵי/הֶ֔ם וְ/הִתְעָֽרְבוּ֙ זֶ֣רַע הַ/קֹּ֔דֶשׁ בְּ/עַמֵּ֖י הָ/אֲרָצ֑וֹת וְ/יַ֧ד הַ/שָּׂרִ֣ים וְ/הַ/סְּגָנִ֗ים הָֽיְתָ֛ה בַּ/מַּ֥עַל הַ/זֶּ֖ה רִאשׁוֹנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: te
  text: ఎందుకంటే, వారు తమకూ తమ కుమారులకూ ఆ ప్రజల కుమార్తెలలో కొందరిని తీసుకున్నారు[a]. మరియు పరిశుద్ధ సంతానం[b] వివిధ దేశాల ప్రజలతో కలిసిపోయింది. ఈ నమ్మకద్రోహంలో ఉన్నతాధికారుల, ఉపాధికారుల హస్తం ముందంజలో ఉంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ప్రజల కుమార్తెలలో కొందరిని వివాహం చేసుకున్నారు.’ హీబ్రూలో అక్షరార్థంగా, ‘వారి కుమార్తెలలోనుండి తీసుకున్నారు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిశుద్ధ సంతానం’ను ‘పరిశుద్ధ వంశం’ అని కూడా అనువదించవచ్చు. హీబ్రూ నిబంధనకు సంబంధించిన వంశపారంపర్య భాషను నిలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, ‘ఈ నమ్మకద్రోహంలో ఉన్నతాధికారుల, ఉపాధికారుల హస్తం మొదటిదిగా ఉంది.’ ఇది వారు ఇందులో ప్రధానంగా బాధ్యులని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: ఆ ప్రజల కుమార్తెలలో కొందరిని తీసుకున్నారు
  rationale: נשא యొక్క ప్రాథమిక ‘తీసుకొను’ భావాన్ని నిలుపుతూ, מן యొక్క భాగార్థాన్ని ‘కొందరిని’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో ఇది వివాహాన్ని సూచిస్తుంది.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: తమకోసం, తమ కుమారులకోసం
  rationale: లామెద్ సూచించే ప్రయోజనం లేదా స్వీకర్త భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִתְעָרְבוּ
  choice: కలిసిపోయింది
  rationale: హిత్పయేల్ రూపంలోని పరస్పర కలయిక భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: పరిశుద్ధ సంతానం
  rationale: ‘విత్తనం’ అనే అత్యక్షర రూపం తెలుగులో అపార్థానికి దారితీయవచ్చు; ‘సంతానం’ వంశపారంపర్య, నిబంధన-సమాజ భావాన్ని కాపాడుతుంది.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: దేశదేశాల ప్రజలతో
  rationale: אֲרָצוֹת బహువచనాన్ని నిలుపుతూ పరిసర ప్రాంతాల వివిధ జనసమూహాలను సహజంగా సూచిస్తుంది.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: అధికారులు, అధిపతులు
  rationale: రెండు పరిపాలనా నాయక వర్గాల మధ్య ఉన్న భేదాన్ని సాధ్యమైనంతగా నిలుపుతుంది; రాజకుమారులు అనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: מַעַל
  choice: నమ్మకద్రోహం
  rationale: సాధారణ అతిక్రమాన్ని మించి, నిబంధన సంబంధమైన విశ్వాసభంగం లేదా ద్రోహం అనే గంభీర భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְיַד ... רִאשׁוֹנָה
  choice: హస్తమే ముందంజలో ఉంది
  rationale: ‘చేయి/హస్తం’ అనే హీబ్రూ కర్తృత్వ రూపకాన్ని నిలుపుతూ, నాయకుల ప్రధాన బాధ్యతను ‘ముందంజలో’ ద్వారా తెలియజేస్తుంది.
theological_decisions:
- issue: అన్యజనులతో వివాహాల సందర్భంలో ‘పరిశుద్ధ సంతానం’ అర్థం
  choice: నిబంధనకు ప్రత్యేకించబడిన సమాజపు వంశభాషగా ‘పరిశుద్ధ సంతానం’ అని అనువదించడం
  alternative: జాతి పరిశుద్ధతగా విస్తరించి వ్యాఖ్యానించడం లేదా బలమైన వంశభాషను పూర్తిగా తొలగించడం
  rationale: మూలంలోని బలమైన నిబంధన-సమాజ భాషను నిలుపుతుంది; అదే సమయంలో పాఠ్యంలో లేని ఆధునిక జాతివాద భావనలను దిగుమతి చేయదు.
- issue: నాయకుల బాధ్యత
  choice: ‘హస్తమే ముందంజలో ఉంది’ అనే రూపకంతో వారి ప్రధాన ప్రమేయాన్ని చూపించడం
  alternative: వారు కాలక్రమంలో మొదటివారని మాత్రమే చెప్పడం
  rationale: רִאשׁוֹנָה ఇక్కడ కేవలం కాలక్రమాన్ని కాక, నాయకత్వస్థాయి ప్రమేయం మరియు ప్రధాన దోషభారాన్ని సూచిస్తుంది; రూపకాన్ని నిలుపడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పరిశుద్ధ సంతానం,’ ‘హస్తం,’ ‘నమ్మకద్రోహం’ వంటి పదాలు మూలంలోని నిబంధనాత్మక గంభీరతను నిలుపుతాయి. ప్రధాన వాక్యంలో ‘అలా’ ఫలిత సంబంధాన్ని సహజంగా చూపుతుంది; దానిని ఉద్దేశార్థంగా బలపరచదు.
