source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: te
  text: 'ఈ సంగతులు ముగిసినప్పుడు, అధికారులు నా దగ్గరకు వచ్చి ఇలా అన్నారు: “ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు కనానీయులు, హిత్తీయులు, పెరిజ్జీయులు, యెబూసీయులు, అమ్మోనీయులు, మోయాబీయులు, ఐగుప్తీయులు, అమోరీయులు వంటి ఆ దేశాల ప్రజల హేయమైన ఆచారాలకు[a] అనుగుణంగా, ఆ దేశాల ప్రజల నుండి తమను తాము వేరుగా ఉంచుకోలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి హేయకార్యాలకు అనుగుణంగా.” ఇక్కడి హెబ్రీ పదం బలమైనది; మతపరంగా అభ్యంతరకరమైన లేదా విగ్రహారాధనతో సంబంధమున్న ఆచారాలకు ఇది తరచుగా వాడబడుతుంది.
    reason: כְּతో కూడిన תועבות పదబంధంలోని అనుగుణత భావాన్నీ, ఆ పదానికి ఉన్న బలమైన మతపరమైన అర్థాన్నీ ప్రత్యామ్నాయంగా తెలియజేయడం.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: ఈ సంగతులు ముగిసినప్పుడు
  rationale: וְతో కూడిన כְּ + כלה infinitive construct కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. స్పష్టమైన ‘ఇప్పుడు’ అనే పదాన్ని చేర్చకుండా సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נִגְּשׁוּ אֵלַי
  choice: నా దగ్గరకు వచ్చి
  rationale: נגשׁ నిఫల్ రూపం ‘దగ్గరకు రావడం/సమీపించడం’ అనే భావాన్ని ఇస్తుంది. ‘నా దగ్గరకు వచ్చి’ సాధారణ పాఠకులకు సహజంగా ఉండి ఎజ్రావైపు జరిగిన కదలికను నిలుపుతుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: పర్షియా కాలపు పరిపాలనా సందర్భంలో שׂרים పాలనా బాధ్యతగల నాయకులను సూచిస్తుంది; ‘రాజకుమారులు’ అనే తప్పుదారి పట్టించే వంశపారంపర్య భావాన్ని నివారిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ ఉక్తిసూచక రూపాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: לֹא נִבְדְּלוּ
  choice: తమను తాము వేరుగా ఉంచుకోలేదు
  rationale: בדל నిఫల్ ఇక్కడ విభజన లేదా స్వీయ వేర్పాటు భావాన్ని కలిగిస్తుంది. చర్య వెనుక ఉద్దేశాన్ని అదనంగా నిర్ణయించకుండా ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు
  rationale: ఒకే ఆరోపణ కింద సమన్వయించబడిన మూడు వర్గాలనూ సమానంగా, సహజమైన తెలుగు జాబితాగా చూపుతుంది.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: ఆ దేశాల ప్రజలనుంచి
  rationale: మూలంలోని ‘ప్రజలు’, ‘దేశాలు’ అనే రెండు బహువచన భావాలనూ నిలుపుతూ ముందున్న సందర్భాన్ని సూచించే ‘ఆ’ను ఉపయోగిస్తుంది.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: వారి అసహ్య ఆచారాల విషయంలో
  rationale: כְּ ఇక్కడ పోలిక లేదా అనుగుణతను, תועבות బలమైన నైతిక-మతపరమైన హేయతను సూచిస్తాయి. తెలుగు వాక్యంలో ఈ పదబంధాన్ని వేర్పాటు ఏ విషయంలో జరగలేదో తెలిపే విధంగా ఉంచి, ఇశ్రాయేలీయులు ఆ ప్రజలతో జాతిపరంగా మాత్రమే కలిసిపోయారనే అపార్థాన్ని తగ్గిస్తుంది; మూలంలోని సంబంధాన్ని అతిగా వివరించదు.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: కనానీయులు, హిత్తీయులు, పెరిజ్జీయులు, యెబూసీయులు, అమ్మోనీయులు, మోయాబీయులు, ఐగుప్తీయులు, అమోరీయులు
  rationale: హెబ్రీలో ఏకవచన జాతివాచక రూపాలు ఉన్నప్పటికీ అవి సమూహాలను సూచిస్తున్నందున తెలుగులో సహజమైన బహువచన జాతిపేర్లుగా అనువదించబడ్డాయి.
theological_decisions:
- issue: תועבות అనే నిబంధన-నైతిక పదం యొక్క బలం
  choice: అసహ్య ఆచారాలు
  alternative: హేయకార్యాలు
  rationale: ఈ పదం సాధారణంగా ఇష్టంలేని అలవాట్లను మాత్రమే కాక మతపరంగా, నైతికంగా తీవ్రంగా అభ్యంతరకరమైన ఆచారాలను సూచిస్తుంది. ‘అసహ్య ఆచారాలు’ ఆ తీవ్రతను నిలుపుతూ ఆధునిక తెలుగు పాఠకుడికి అర్థమయ్యేలా ఉంది.
- issue: ఆరోపణ వర్తించే ఇశ్రాయేలీయ వర్గాల పరిధి
  choice: ప్రజలు, యాజకులు, లేవీయులు—మూడు వర్గాలూ ఒకే క్రియకు కర్తలు
  alternative: ప్రధానంగా సామాన్య ప్రజలకే ఆరోపణ వర్తించి, యాజకులు మరియు లేవీయులు ద్వితీయంగా చేర్చబడ్డారు
  rationale: హెబ్రీ వాక్యనిర్మాణం మూడు వర్గాలనూ ఒకే నిషేధాత్మక క్రియతో సమన్వయిస్తుంది. అందువల్ల అనువాదం ఆరోపణ పరిధిని సంకుచితం చేయదు.
- issue: వేర్పాటు స్వరూపం
  choice: ఆ దేశాల ప్రజల అసహ్య ఆచారాల విషయంలో తమను తాము వేరుగా ఉంచుకోకపోవడం
  alternative: ఆ ప్రజలతో ఏ విధమైన సామాజిక సంబంధమూ పెట్టుకోకపోవాల్సింది
  rationale: సందర్భంలోని תועבות పదం ఆరోపణకు మతపరమైన-నైతిక కేంద్రముందని చూపుతుంది. అనువాదం మూలం చెప్పనంత విస్తృతమైన సంపూర్ణ సామాజిక వేరుపాటును సిద్ధాంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. పరిపాలనా సందర్భానికి ‘అధికారులు’, ఆరాధనా వర్గాలకు సుపరిచితమైన ‘యాజకులు, లేవీయులు’ ఎంపికయ్యాయి. జాతిపేర్లు తెలుగు బైబిలు పఠనంలో గుర్తించదగిన రూపాల్లో ఉంచబడ్డాయి. మూలంలోని అస్పష్టమైన כְּ సంబంధాన్ని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుకున్నాం.
