review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal images and the communal first-person confession, but it relocates the second occurrence of “my God” to the opening and thus fails to represent the Hebrew's emphatic repetition in its clause. “Bowing my head in humiliation” adds an action not present in the source; “burden” likewise adds imagery to אַשְׁמָתֵנוּ. The rendering of רָבוּ as “spread” is weaker than the sense of becoming numerous/increasing.
  naturalness: The revised Telugu is modern, prayerful, and idiomatic. It retains the face/head/heavens imagery without forcing an unnatural literal construction.
  terminology: దోషాలు appropriately renders עֲוֺנֹתֵינוּ, while అపరాధం renders the distinct collective sense of אַשְׁמָתֵנוּ without adding “burden.” The direct address నా దేవా is retained twice, as in the Hebrew.
  issues:
  - severity: medium
    issue: The second “నా దేవా” is placed immediately after the first rather than corresponding to the second אֱלֹהַי later in the sentence.
    rationale: The Hebrew repeats “my God” after “to you.” The Telugu should retain the repetition without treating it as an opening double vocative.
  - severity: medium
    issue: “అవమానంతో తలవంచుకుంటున్నాను” adds head-bowing.
    rationale: וְנִכְלַמְתִּי expresses being humiliated/disgraced, but does not mention bowing the head.
  - severity: low
    issue: “అపరాధభారం” adds “burden,” and “విస్తరించాయి” does not clearly convey increase/multiplication.
    rationale: אַשְׁמָתֵנוּ denotes guilt/culpability here, and רָבוּ emphasizes becoming many or increasing.
