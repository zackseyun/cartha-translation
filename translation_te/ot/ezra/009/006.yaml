id: EZR.9.6
reference: Ezra 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: te
  text: 'నేను ఇలా అన్నాను: “నా దేవా, నీ వైపు నా ముఖాన్ని ఎత్తడానికి నేను సిగ్గుపడ్డాను, అవమానపడ్డాను. ఎందుకంటే, నా దేవా, మా దోషాలు మా తలలకంటే పైకి ఎంతో పెరిగాయి[a]; మా అపరాధం ఎంతో పెరిగి ఆకాశాల వరకు చేరింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మా తలకు పైగా.” హెబ్రీలో ‘తల’ ఏకవచనంలో ఉన్నా, ఇక్కడ సమూహాన్ని సూచిస్తుంది.
    reason: హెబ్రీ ఏకవచన రూపకాన్ని తెలియజేస్తూ, ప్రధాన పాఠంలో సహజమైన తెలుగు బహువచనాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: వావ్-కన్సెక్యూటివ్ కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: నేను సిగ్గుపడుతున్నాను, అవమానంతో తలవంచుకుంటున్నాను
  rationale: రెండు సమీపార్థక క్రియల తీవ్రతను నిలుపుతూ, రెండవ పదంలోని అవమానభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది తరువాతి ‘ముఖాన్ని ఎత్తడానికి’ అనే రూపకంతోనూ సరిపోతుంది.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: నీ వైపు నా ముఖాన్ని ఎత్తడానికి
  rationale: మూలంలోని ‘ముఖం’ను ‘కళ్ళు’గా మార్చకుండా, దేవుని ఎదుట నిలబడే ధైర్యం లేకపోవడాన్ని సూచించే హెబ్రీ రూపకాన్ని నిలుపుతుంది.
- source_word: עֲוֺנֹתֵינוּ
  choice: మా దోషాలు
  rationale: నైతిక వక్రతతో కూడిన పాపకార్యాల భావాన్ని ఇస్తూ, తరువాతి אַשְׁמָהకు ఎంచుకున్న ‘అపరాధభారం’తో భేదాన్ని కాపాడుతుంది.
- source_word: רָבוּ לְמַעְלָה רֹאשׁ
  choice: మా తలలకు మించి విస్తరించాయి
  rationale: దోషాలు అదుపు చేయలేనంతగా పైకి పెరిగిన రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘విస్తరించాయి’ అనేది అవి అధికమయ్యాయనే క్రియాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: אַשְׁמָתֵנוּ
  choice: మా అపరాధభారం
  rationale: ఇక్కడ బలిని కాక అపరాధస్థితి లేదా బాధ్యతను సూచిస్తుంది; ‘భారం’ను జోడించడం వల్ల దోషాల నుండి పదభేదం స్పష్టమై, బాధ్యత యొక్క తీవ్రత వ్యక్తమవుతుంది.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: ఆకాశాల వరకు పెరిగిపోయింది
  rationale: మూలంలోని అతిశయోక్తితో కూడిన నిలువు దృశ్యాన్ని, అలాగే שָׁמַיִם యొక్క రూపపరమైన బహువచనాన్ని నిలుపుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనను సహజంగా చూపుతుంది; మూలంలో రెండుసార్లు వచ్చిన పునరుక్తిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ఎజ్రా వ్యక్తిగతంగా సమూహపు పాపాన్ని ఒప్పుకోవడం
  choice: ‘మా దోషాలు’, ‘మా అపరాధభారం’ అని సమూహాత్మక ప్రథమ పురుషాన్ని యథాతథంగా ఉంచడం
  alternative: ‘వారి దోషాలు’ అని ఎజ్రాను ప్రజల నుండి వేరు చేయడం
  rationale: హెబ్రీ మూలం స్పష్టంగా ‘మా’ అని చెప్పి ఎజ్రాను సమాజపు ఒప్పుకోలులో భాగంగా చూపుతుంది; అతని వ్యక్తిగత దోషిత్వం గురించి దాని కంటే ఎక్కువగా తేల్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని ముఖం, తల, ఆకాశాలు అనే నిలువు రూపకాలను నిలుపుతూ, కృత్రిమ పదక్షర అనువాదాన్ని నివారించింది.
