id: EZR.9.8
reference: Ezra 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: te
  text: అయితే ఇప్పుడు, కొద్ది క్షణంపాటు, మనకు తప్పించుకున్న శేషాన్ని మిగిల్చడానికి, తన పరిశుద్ధ స్థలంలో మనకు ఒక మేకు[a] ఇవ్వడానికి, మన దేవుడు మన కళ్లకు వెలుగు ఇవ్వడానికి[b], మన దాస్యంలో[c] మనకు కొద్దిగా పునరుజ్జీవం ఇవ్వడానికి మన దేవుడైన యాహ్వే నుండి అనుగ్రహం లభించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్థిరమైన ఆధారం.’ హీబ్రూలో దృఢంగా నాటబడిన మేకు అనే స్పష్టమైన దృశ్యరూపం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మన కళ్లకు వెలుగు ఇవ్వడానికి.’ ఈ నుడికారం నూతన జీవం, ఆశ, లేదా ఉత్సాహం కలగడాన్ని సూచిస్తుంది.
    reason: idiom_explanation
  - marker: c
    text: లేదా, ‘మన పరాధీనతలో’ లేదా ‘మన బానిసత్వంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: అనుగ్రహం
  rationale: ఇక్కడ ఈ నామవాచకం మనుషుల విన్నపాన్ని కాక, యెహోవా నుండి లభించిన దయను సూచిస్తుంది; ‘అనుగ్రహం’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: פְּלֵיטָה
  choice: తప్పించుకున్న శేషం
  rationale: నిర్బంధం నుండి తప్పించుకొని నిలిచిన సమాజం అనే జీవించి మిగిలినవారి భావాన్నీ, ‘శేషం’ అనే భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: יָתֵד
  choice: మేకు
  rationale: స్థిరంగా నాటబడిన మేకు అనే హీబ్రూ దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; రూపకాలంకార భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: తన పరిశుద్ధ స్థలంలో
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, దేవాలయ సంబంధమైన భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: మన కళ్లకు వెలుగు కలిగించడానికి
  rationale: పునరుజ్జీవం, ఆశ, ఉత్సాహం అనే నుడికార భావాలను దృశ్యరూపంతో సహా నిలుపుతుంది.
- source_word: מִחְיָה
  choice: జీవం పోయడానికి
  rationale: జీవాన్ని కాపాడటం లేదా తిరిగి చేకూర్చటం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּעַבְדֻתֵנוּ
  choice: మన దాస్యంలో
  rationale: పరాయి సామ్రాజ్యాధీనంలో ఉన్న బలమైన పరాధీన స్థితిని ‘సేవ’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: כִּמְעַט רֶגַע
  choice: కొద్దికాలంపాటు
  rationale: లభించిన ఉపశమనం స్వల్పమైనదీ తాత్కాలికమైనదీ అనే కాలార్థాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָיְתָה ... מֵאֵת יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా నుండి మనకు ... లభించింది
  rationale: అనుగ్రహానికి మూలం యెహోవాయే అనే מֵאֵת భావాన్ని నిలుపుతూ తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలుపుతుంది; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: יָתֵד అనే రూపకాన్ని అర్థవివరణగా మార్చాలా
  choice: ‘మేకు’ అనే దృశ్యరూపాన్ని నిలుపడం
  alternative: స్థిరమైన ఆధారం
  rationale: దేవుడు సమాజానికి పరిశుద్ధ స్థలంలో స్థిరత్వం ఇచ్చాడనే భావం ఉన్నప్పటికీ, మూలంలోని స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలోనే నిలుపడం వ్యాఖ్యానాత్మక సంకుచితీకరణను నివారిస్తుంది.
- issue: עבדות యొక్క సామాజిక-రాజకీయ బలం
  choice: దాస్యం
  alternative: పరాధీనత
  rationale: ప్రజలు స్వదేశంలో ఉన్నప్పటికీ సామ్రాజ్యాధీనంలోనే ఉన్నారనే వాక్యంలోని ఉద్రిక్తతను మృదువుచేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవభరితమైన శైలి. మూలంలోని ‘మేకు’, ‘కళ్లకు వెలుగు’, ‘దాస్యం’ అనే బలమైన దృశ్యాలు మరియు ఉద్రిక్తతలు నిలుపబడ్డాయి.
