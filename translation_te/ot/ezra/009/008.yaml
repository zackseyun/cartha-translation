revisions:
- from: అయితే ఇప్పుడు, కొద్దికాలంపాటు మన దేవుడైన యెహోవా నుండి మనకు అనుగ్రహం లభించింది. తప్పించుకున్న శేషాన్ని మనకు మిగిల్చి, తన పరిశుద్ధ స్థలంలో మనకు ఒక మేకు[a] ఇచ్చి, మన దేవుడు మన కళ్లకు వెలుగు కలిగించడానికి[b], మన దాస్యంలో మనకు కొద్దిగా జీవం పోయడానికి[c] ఇలా చేశాడు.
  to: అయితే ఇప్పుడు, కొద్ది క్షణంపాటు, మనకు తప్పించుకున్న శేషాన్ని మిగిల్చడానికి, తన పరిశుద్ధ స్థలంలో మనకు ఒక మేకు[a] ఇవ్వడానికి, మన దేవుడు మన కళ్లకు వెలుగు ఇవ్వడానికి[b], మన దాస్యంలో[c] మనకు కొద్దిగా పునరుజ్జీవం ఇవ్వడానికి మన దేవుడైన యాహ్వే నుండి అనుగ్రహం లభించింది.
  rationale: 'సవరణ మూలంలోని ఉద్దేశార్థక క్రియల పరంపరను నిలుపుతుంది: యాహ్వే నుండి వచ్చిన అనుగ్రహం శేషాన్ని మిగిల్చడం, మేకు ఇవ్వడం, కళ్లకు వెలుగు ఇవ్వడం, దాస్యస్థితిలో స్వల్ప పునరుజ్జీవం ఇవ్వడం కోసం వచ్చింది. ‘పునరుజ్జీవం’ మִחְיָהకు సహజమైన, సందర్భానుకూలమైన తెలుగు సమానార్థకం. పాదసూచికలను వాటి సంబంధిత పదాలకు సరిగా జతచేశాం.'
