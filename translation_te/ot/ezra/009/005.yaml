  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/מִנְחַ֣ת הָ/עֶ֗רֶב קַ֚מְתִּי מִ/תַּֽעֲנִיתִ֔/י וּ/בְ/קָרְעִ֥/י בִגְדִ֖/י וּ/מְעִילִ֑/י וָֽ/אֶכְרְעָ/ה֙ עַל בִּרְכַּ֔/י וָ/אֶפְרְשָׂ֥/ה כַפַּ֖/י אֶל יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: te
  text: సాయంకాల అర్పణ సమయంలో[a] నేను నా ఉపవాసం నుండి లేచాను. నా వస్త్రమూ పైవస్త్రమూ చినిగిన స్థితిలోనే నేను మోకాళ్లపై వంగి, నా దేవుడైన యహ్వే వైపు నా చేతులు చాపాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “సాయంకాల ధాన్యార్పణ సమయంలో.” హీబ్రూ పదం తరచుగా ధాన్యార్పణను సూచిస్తుంది; అయితే ఇక్కడ అది సాధారణంగా సాయంకాల బలి సమయాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: సాయంకాల అర్పణ సమయంలో
  rationale: מִנְחָה కానుకను లేదా ప్రత్యేకంగా ధాన్యార్పణను సూచించగలదు. ఈ సందర్భంలో అది క్రమంగా జరిగే సాయంకాల బలి సమయాన్ని విస్తృతంగా సూచించవచ్చు; అందువల్ల ప్రధాన పాఠ్యంలో సహజమైన ‘అర్పణ’ను ఉంచి, మరింత నిర్దిష్టమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: నేను నా ఉపవాసం నుండి లేచాను
  rationale: קום అంటే లేవడం; תַּעֲנִית సాధారణంగా ఉపవాసం లేదా స్వయంగా తన్ను తగ్గించుకోవడాన్ని సూచిస్తుంది. సందర్భంలో కనిపించే శోకాచరణను దృష్టిలో ఉంచి ‘ఉపవాసం’ ఎంచుకున్నాం.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: నా వస్త్రమూ పైవస్త్రమూ చినిగిన స్థితిలోనే
  rationale: בֶּגֶד మరియు מְעִיל అనే రెండు వస్త్రపదాల భేదాన్ని ‘వస్త్రం’, ‘పైవస్త్రం’గా నిలిపాం. ఈ నిర్మాణం అతడు చినిగిన దుస్తులతోనే ఉన్న సహవర్తి పరిస్థితిని తెలియజేస్తుంది.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: నేను మోకాళ్లపై వంగి
  rationale: כרע మోకరించడం లేదా వంగడాన్ని సూచిస్తుంది. ‘మోకాళ్లపై వంగి’ శరీరభంగిమను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: నా చేతులు చాపాను
  rationale: פרשׂ + כף ప్రార్థనలో అరచేతులను విప్పి ముందుకు లేదా పైకి చాపే భంగిమను సూచిస్తుంది. తెలుగులో ‘చేతులు చాపాను’ సహజంగా ఆ దృశ్యాన్ని అందిస్తుంది.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యహ్వే వైపు
  rationale: אֶל దిశను సూచిస్తుండగా, יְהוָה అనే దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం; אֱלֹהָי ను ‘నా దేవుడు’గా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక పండితలోకంలో విస్తృతంగా అంగీకరించిన ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- issue: תַּעֲנִית యొక్క భావం
  choice: ఉపవాసం
  alternative: తన్ను తాను తగ్గించుకోవడం; శ్రమపరచుకోవడం
  rationale: ఈ పదానికి స్వీయదీనత అనే విస్తృత భావపరిధి ఉన్నా, ఇక్కడి శోకాచరణ సందర్భంలో ఉపవాసం అనే స్పష్టమైన ఆచారం అత్యంత సంభావ్యంగా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. వస్త్రాలకు సంబంధించిన రెండు హీబ్రూ పదాల భేదాన్ని నిలిపి, ప్రార్థనా భంగిమను సహజమైన తెలుగు పదబంధాలతో వ్యక్తం చేశాం. పాదటిప్పణి సూచికను దానికి సంబంధించిన ‘సాయంకాల అర్పణ’ పదబంధం వెంట ఉంచాం.
