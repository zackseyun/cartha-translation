source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: te
  text: ఇప్పుడు[a], మా దేవా, దీని తరువాత మేమేమి చెప్పగలం? ఎందుకంటే మేము నీ ఆజ్ఞలను విడిచిపెట్టాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేమేమి చెప్పాలి?’ హీబ్రూ అసంపూర్ణ క్రియను మరింత రూపానుగుణంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో తదుపరి ఆలోచనకు మార్పును సూచిస్తుంది. తెలుగులో వాక్యారంభంలోని ‘ఇప్పుడు’ సహజంగా ఈ సంధాన భావాన్ని మోస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: מַה נֹּאמַר
  choice: మేమేమి చెప్పగలం
  rationale: మొదటి పురుష బహువచన అసంపూర్ణ క్రియ ఇక్కడ ఆలోచనాత్మకమైన, అలంకారిక నిస్సహాయతను వ్యక్తం చేస్తుంది. ‘చెప్పగలం’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది; మరింత రూపానుగుణమైన ప్రత్యామ్నాయం పాదటీకలో ఉంచబడింది.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవా
  rationale: సంబోధనలోని ‘మన/మా దేవుడు’ భావాన్ని సహజమైన తెలుగు విభక్తితో ‘మా దేవా’గా వ్యక్తం చేస్తుంది.
- source_word: אַחֲרֵי זֹאת
  choice: దీని తరువాత
  rationale: ముందు వివరించిన పాపం, సంక్షోభాన్ని వెనక్కి సూచించే కాలసంబంధ పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎందుకు చెప్పలేని స్థితిలో ఉన్నారో తెలిపే కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָזַבְנוּ
  choice: విడిచిపెట్టాము
  rationale: దైవ ఆజ్ఞలను పాటించకుండా వదిలివేసిన ఒడంబడిక సంబంధమైన తీవ్రతను ఆధునిక, గంభీర తెలుగులో అందిస్తుంది.
- source_word: מִצְוֺתֶיךָ
  choice: నీ ఆజ్ఞలను
  rationale: దేవుని విధులను సూచించే מִצְוֹת‌కు సాధారణమైన, తగిన గంభీరత గల తెలుగు సమానం.
theological_decisions:
- issue: ఎజ్రా ఒప్పుకోలు యొక్క స్వరం
  choice: దేవుని ఎదుట అపరాధాన్ని ఒప్పుకుంటూ మాటలులేని నిస్సహాయతను తెలిపే అలంకారిక ప్రశ్న
  alternative: తరువాత ఏమి చెప్పాలో మార్గదర్శనం కోరే సాధారణ ప్రశ్న
  rationale: ‘మేము నీ ఆజ్ఞలను విడిచిపెట్టాము’ అనే కారణ వాక్యం ఇది తటస్థమైన విచారణ కాదని, పశ్చాత్తాపపూర్వకమైన మాటలేనితనమని చూపుతుంది. మూలానికి మించిన వివరణను జోడించకుండా ఆ ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు సహజంగా ఉండే శైలి. ‘మా దేవా’ అనే సంబోధన వినయపూర్వకమైన ప్రార్థనా స్వరాన్ని నిలుపుతుంది.
