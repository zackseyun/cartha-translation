source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: te
  text: మన పితరుల కాలం నుండి ఈ రోజు వరకు మనం గొప్ప అపరాధస్థితిలో ఉన్నాం. మన దోషాల కారణంగా మనమూ, మన రాజులూ, మన యాజకులూ ఇతర దేశాల రాజుల చేతికి, ఖడ్గానికి, చెరలోకి, దోపిడికి, బహిరంగ అవమానానికి[a] అప్పగించబడ్డాం—నేడు ఉన్నట్లుగానే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ముఖపు సిగ్గు”; లేదా “పరాభవం,” “అవమానం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: మన పితరుల కాలం మొదలుకొని
  rationale: מִן + יָמִים సూచించే గతకాల ఆరంభబిందువును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరతరాల చారిత్రక కొనసాగింపును నిలుపుతుంది.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: మనం గొప్ప అపరాధంలో ఉన్నాం
  rationale: אַשְׁמָה కేవలం సిగ్గుభావాన్ని కాక అపరాధస్థితిని సూచిస్తుంది. క్రియలేని హెబ్రీ వాక్యాన్ని, ‘ఈ రోజు వరకు’ అనే కాలవ్యాప్తికి సరిపోయే తెలుగులో ఇచ్చాం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: గతం నుంచి ప్రస్తుత క్షణం వరకు కొనసాగుతున్న స్థితిని నేరుగా తెలియజేస్తుంది.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: మన దోషాల కారణంగా
  rationale: ఇక్కడ בְּ కారణార్థకంగా ఉంది. עָוֹן యొక్క నైతిక వక్రత/దోష భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: נִתַּנּוּ
  choice: అప్పగించబడ్డాం
  rationale: נָתַן నిఫాల్ రూపంలోని కర్మణి భావాన్ని, శత్రువుల అధికారానికి అప్పగింపబడటాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  choice: ఇతర దేశాల రాజుల చేతికి
  rationale: ‘చేతికి’ అనే రూపం అధికారంలోకి అప్పగించబడటం అనే హెబ్రీ రూపకాన్ని తెలుగులో నిలుపుతుంది. הָאֲרָצוֹת ఇక్కడ చుట్టుపక్కల దేశాలను సూచించేందున ‘ఇతర దేశాలు’ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: בַּחֶרֶב
  choice: ఖడ్గానికి
  rationale: యుద్ధం ద్వారా మరణం లేదా నాశనాన్ని సూచించే సంక్షిప్త తీర్పు సూత్రాన్ని నిలుపుతుంది.
- source_word: בַּשְּׁבִי
  choice: చెరకు
  rationale: שְׁבִי సూచించే బందీ స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ‘ప్రవాసం’ అని అర్థాన్ని కుదించదు.
- source_word: וּבַבִּזָּה
  choice: దోపిడికి
  rationale: శత్రువులు ఆస్తిని కొల్లగొట్టడాన్ని సూచించే בִּזָּה భావానికి ఆధునిక, స్పష్టమైన తెలుగు పదం.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: బహిరంగ అవమానానికి
  rationale: అక్షరార్థంగా ‘ముఖపు సిగ్గు’ అనే పదబంధం ప్రజల ఎదుట కలిగే అవమానం/పరాభవాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన భావానువాదం ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: నేటి పరిస్థితి ఇదే
  rationale: ఇప్పుడున్న దుస్థితి ముందుగా వర్ణించిన తీర్పుకు ప్రత్యక్ష నిదర్శనమని తెలిపే హెబ్రీ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אַשְׁמָה మరియు עָוֹן అనే నైతిక పదాల భేదం
  choice: אַשְׁמָהను ‘అపరాధం’గా, עָוֹןను ‘దోషాలు’గా అనువదించడం
  alternative: రెండింటినీ సాధారణంగా ‘పాపం/పాపాలు’గా అనువదించడం
  rationale: ఎజ్రా సామూహిక ఒప్పుకోలులోని అపరాధస్థితి మరియు దోషకార్యాల మధ్య ఉన్న పదభేదాన్ని కాపాడుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ఒప్పుకోలులో సామూహిక సంఘీభావం
  choice: ‘మనమూ, మన రాజులూ, మన యాజకులూ’ అని సమూహాన్నీ నాయకులనూ కలిపి ఉంచడం
  alternative: నాయకుల బాధ్యతను వేరుచేసేలా లేదా సమాజపు గుర్తింపును తగ్గించేలా పునర్వ్యవస్థీకరించడం
  rationale: హెబ్రీ పాఠం సమాజాన్నీ దాని నాయకులనూ ఒకే తీర్పు కింద స్పష్టంగా కలుపుతుంది; ఆ చారిత్రక, ధార్మిక ఉద్రిక్తతను తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన ప్రార్థనా/ఒప్పుకోలు శైలిని వాడాం. ‘పితరులు,’ ‘యాజకులు,’ ‘ఖడ్గం,’ ‘చెర’ వంటి బైబిలు సందర్భానికి తగిన, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను నిలిపాం. పొడవైన హెబ్రీ వాక్యాన్ని రెండు వాక్యాలుగా విభజించినప్పటికీ కారణం, సామూహిక కర్తలు, తీర్పుల జాబితా, ప్రస్తుత దుస్థితి అన్న క్రమాన్ని కాపాడాం.
