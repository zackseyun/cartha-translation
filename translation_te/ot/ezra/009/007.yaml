- from: మన పితరుల కాలం మొదలుకొని ఈ రోజు వరకు మనం గొప్ప అపరాధంలో ఉన్నాం. మన దోషాల కారణంగా మనమూ, మన రాజులూ, మన యాజకులూ ఇతర దేశాల రాజుల చేతికి అప్పగించబడ్డాం—ఖడ్గానికి, చెరకు, దోపిడికి, బహిరంగ అవమానానికి[a] గురయ్యాం; నేటి పరిస్థితి ఇదే.
  to: మన పితరుల కాలం నుండి ఈ రోజు వరకు మనం గొప్ప అపరాధస్థితిలో ఉన్నాం. మన దోషాల కారణంగా మనమూ, మన రాజులూ, మన యాజకులూ ఇతర దేశాల రాజుల చేతికి, ఖడ్గానికి, చెరలోకి, దోపిడికి, బహిరంగ అవమానానికి[a] అప్పగించబడ్డాం—నేడు ఉన్నట్లుగానే.
  rationale: 'The revision corrects the erroneous rendering of captivity and slightly improves idiomatic expression of the ongoing state of corporate guilt. It preserves the Hebrew sequence: the community, kings, and priests are handed over to foreign kings’ power and to sword, captivity, plunder, and public shame, as the present situation demonstrates.'
