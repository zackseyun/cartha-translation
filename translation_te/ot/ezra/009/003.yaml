id: EZR.9.3
reference: Ezra 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: te
  text: ఈ విషయం వినగానే[a], నేను నా వస్త్రాన్నీ పైవస్త్రాన్నీ చింపుకొని, నా తల వెంట్రుకల్లోనుంచీ గడ్డంలోని వెంట్రుకల్లోనుంచీ కొన్నిటిని పీకి[b], దిగ్భ్రాంతితో కూర్చుండిపోయాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతి విన్నప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: వస్త్రాలను చింపుకోవడం, వెంట్రుకలను పీకుకోవడం దుఃఖం, భయవిస్మయం లేదా శోకాన్ని వ్యక్తం చేసే ఆచారాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: వినగానే
  rationale: కాలసంబంధమైన כְּ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, విన్న వెంటనే కలిగిన ప్రతిస్పందనను తెలియజేస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דָּבָר అనే పదంలోని ‘మాట/విషయం/సంగతి’ అనే విస్తృత భావాన్ని సందర్భానుగుణంగా, నివేదికకే పరిమితం చేయకుండా కాపాడుతుంది.
- source_word: קָרַעְתִּי
  choice: చింపుకొని
  rationale: దుఃఖం లేదా భయవిస్మయాన్ని వ్యక్తం చేసే వస్త్రచ్ఛేదన చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּגְדִי וּמְעִילִי
  choice: నా వస్త్రాన్నీ పైవస్త్రాన్నీ
  rationale: మొదటి సాధారణ వస్త్రపదానికీ, రెండవ బయటి అంగీ లేదా పైవస్త్రాన్ని సూచించే పదానికీ మధ్య తేడాను నిలుపుతుంది.
- source_word: וָאֶמְרְטָה
  choice: పీకి
  rationale: వెంట్రుకలను బలంగా తీసివేసే చర్యను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: నా తల వెంట్రుకల్లోనుంచీ గడ్డంలోని వెంట్రుకల్లోనుంచీ కొన్నిటిని
  rationale: מִן లోని భాగార్థాన్ని స్పష్టపరుస్తూ, మొత్తం వెంట్రుకలనన్నిటినీ పీకాడనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: וָאֵשְׁבָה מְשׁוֹמֵם
  choice: దిగ్భ్రాంతితో కూర్చుండిపోయాను
  rationale: కూర్చోవడం మాత్రమే కాక, తీవ్రంగా కలవరపడి స్తంభించిన స్థితిని מְשׁוֹמֵם సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆ స్థితిని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పైవస్త్రం’ ద్వారా בֶּגֶד మరియు מְעִיל మధ్య భేదం నిలుపబడింది; ‘దిగ్భ్రాంతితో కూర్చుండిపోయాను’ ద్వారా మְשׁוֹמֵם లోని తీవ్ర కలవరంతో స్తంభించిన భావం వ్యక్తమైంది.
