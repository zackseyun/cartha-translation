- from: అప్పుడు ఇశ్రాయేలు దేవుని మాటలకు భయభక్తులతో వణికిన వారందరూ, చెరనుంచి తిరిగివచ్చిన సమాజం చేసిన విశ్వాసఘాతుకాన్ని బట్టి, నా దగ్గరికి సమకూడారు.[a] నేను సాయంకాల నైవేద్య సమయం వరకు దిగ్భ్రాంతితో కూర్చుండిపోయాను.[b]
  to: అప్పుడు ఇశ్రాయేలు దేవుని మాటలకు వణికిన వారందరూ, ప్రవాసుల సమాజం చేసిన నమ్మకద్రోహం కారణంగా, నా దగ్గరకు సమకూడారు.[a] నేను సాయంకాల నైవేద్య సమయం వరకు దిగ్భ్రాంతితో కూర్చుండిపోయాను.[b]
  rationale: The revision preserves the Hebrew's collective “all who trembled,” its covenant-breach sense for מַעַל, and the personal sense of הַגּוֹלָה as the exile/returned-exile community. It also retains the stated cultic time marker without over-specifying minḥah as a sacrifice. Footnote anchors remain immediately after the relevant clauses.
