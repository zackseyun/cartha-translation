source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు దేవుని మాటలకు వణికిన వారందరూ, ప్రవాసుల సమాజం చేసిన నమ్మకద్రోహం కారణంగా, నా దగ్గరకు సమకూడారు.[a] నేను సాయంకాల నైవేద్య సమయం వరకు దిగ్భ్రాంతితో కూర్చుండిపోయాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవాసుల సమాజపు అపరాధం కారణంగా.’
    reason: lexical_alternative
  - marker: b
    text: ‘సాయంకాల నైవేద్యం’ అనేది ధాన్య నైవేద్యాన్ని కూడా సూచించగల మిన్హా అనే హెబ్రీ పదానికి అనువాదం; ఇక్కడ అది క్రమంగా అర్పించే సాయంకాల నైవేద్య సమయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: నా దగ్గరికి సమకూడారు
  rationale: నిఫల్ రూపం ఎజ్రా వద్దకు ప్రజలు కలిసివచ్చిన భావాన్ని ఇస్తుంది; కర్తృత్వాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజమైన తెలుగు ప్రయోగం.
- source_word: כֹּל חָרֵד
  choice: భయభక్తులతో వణికిన వారందరూ
  rationale: ఏకవచన విశేషణం כֹּל తరువాత సమూహార్థంలో ఉంది. חרד లోని భయం, దేవుని పట్ల గౌరవభావం రెండింటినీ ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని మాటలకు
  rationale: ב ఇక్కడ వణకడానికి కారణమైన లేదా దాని విషయమైన దేవుని మాటలను సూచిస్తుంది; హెబ్రీలోని బహువచనాన్ని నిలుపుకుంది.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: చెరనుంచి తిరిగివచ్చిన సమాజం చేసిన విశ్వాసఘాతుకాన్ని బట్టి
  rationale: מַעַל దేవునిపట్ల నమ్మకాన్ని భంగపరచే ద్రోహాన్ని సూచిస్తుంది. הַגּוֹלָה ను కేవలం స్థితిగా కాక చెరనుంచి తిరిగివచ్చిన సమాజంగా వ్యక్తం చేయడం సందర్భానికి స్పష్టత ఇస్తుంది.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: దిగ్భ్రాంతితో కూర్చుండిపోయాను
  rationale: కొనసాగిన కూర్చున్న స్థితితోపాటు, జరిగినదానివల్ల ఎజ్రా నిశ్చేష్టుడై తీవ్రంగా కలతచెందిన భావాన్ని తెలియజేస్తుంది.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: సాయంకాల నైవేద్య సమయం వరకు
  rationale: מִנְחָה ధాన్య నైవేద్యాన్ని సూచించగలదు; ఇక్కడ అది క్రమమైన సాయంకాల అర్పణ ద్వారా సమయాన్ని కూడా తెలియజేస్తోంది. ‘నైవేద్యం’ మూలపదాన్ని బలి అని విస్తరించదు.
theological_decisions:
- issue: నిబంధన సంబంధమైన పాప సందర్భంలో מַעַל అనువాదం
  choice: విశ్వాసఘాతుకం
  alternative: అపరాధం; అవిశ్వాసం
  rationale: ఇది సాధారణ తప్పుకంటే దేవునిపట్ల నమ్మకాన్ని భంగపరచడాన్ని సూచిస్తుంది. ‘విశ్వాసఘాతుకం’ ఆ నైతిక-నిబంధనాత్మక తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- issue: הַגּוֹלָה యొక్క అర్థం
  choice: చెరనుంచి తిరిగివచ్చిన సమాజం
  alternative: చెరలోని వారు; చెర; ప్రవాసుల సమాజం
  rationale: ఈ సందర్భంలో పదం చెరకు గురై ఇప్పుడు తిరిగివచ్చిన ప్రజాసమాజాన్ని సూచిస్తుంది; అమూర్తమైన ‘చెర’ కంటే వ్యక్తులను స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘భయభక్తులతో వణికిన’ అన్నది חרד లోని భయాన్నీ భక్తిపూర్వక గౌరవాన్నీ కలిపి తెలియజేస్తుంది. ప్రధాన వాక్యంలో ప్రతి పాదసూచిక గుర్తు సంబంధిత భాగం వెంట ఉంచబడింది.
