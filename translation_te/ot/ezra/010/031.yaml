  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: te
  text: 'హారీము కుమారులలోనివారు: ఎలీయెజెరు, ఇష్షీయా[a], మల్కీయా, షెమయా, షిమ్యోను[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును “యెషయా” లేదా “ఇషీయా” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: షిమ్యోను అనే పేరు సంప్రదాయంగా “సీమోను” అని కూడా ఇవ్వబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי חָרִם
  choice: హారిము కుమారులలో
  rationale: ఈ జాబితా సందర్భంలో హారిము వంశానికి చెందినవారిలో పేర్కొనబడిన వ్యక్తులను పరిచయం చేస్తుంది. తెలుగు జాబితా శైలిలో సంధిని ప్రత్యేకంగా అనువదించకపోయినా కొనసాగింపు భావం నిలుస్తుంది.
- source_word: אֱלִיעֶזֶר
  choice: ఎలీయెజెరు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: יִשִּׁיָּה
  choice: ఇష్షీయా
  rationale: హీబ్రూ ఉచ్చారణను సమీపంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; ఇతర లిప్యంతరీకరణలు సాధ్యమే.
- source_word: מַלְכִּיָּה
  choice: మల్కీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని సహజమైన తెలుగు అక్షరరూపంలో లిప్యంతరీకరించింది.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ שׁ ధ్వనిని ‘ష’తో ప్రతిబింబిస్తూ చేసిన లిప్యంతరీకరణ.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ పేరులోని ప్రారంభ שׁ ధ్వనిని, మధ్య వ్యంజన క్రమాన్ని సమీపంగా ప్రతిబింబిస్తుంది; సంప్రదాయ రూపం ‘సీమోను’ కూడా ప్రాచుర్యంలో ఉంది.
