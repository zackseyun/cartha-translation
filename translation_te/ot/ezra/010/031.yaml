  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశజుల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని పేర్లను హీబ్రూ ధ్వనులకు దగ్గరగా ఉంచుతూ తెలుగు పాఠకులకు పలకడానికి సహజంగా తీర్చిదిద్దాం.
