  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: te
  text: అప్పుడు సభ అంతా బిగ్గరగా జవాబిచ్చి ఇలా అన్నారు, “అవును, నీ మాటల ప్రకారం మేము చేయవలసి ఉంది.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత సహజంగా, “అవును, నీవు చెప్పినట్టే మేము చేయాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: జవాబిస్తూ ... అని అన్నారు
  rationale: హీబ్రూ వచనంలోని ‘జవాబిచ్చి అన్నారు’ అనే వరుసను తెలుగులో సహజమైన మాటల పరిచయ నిర్మాణంగా వ్యక్తపరుస్తుంది; జవాబు అనే సంభాషణ విధిని కూడా నిలుపుతుంది.
- source_word: כָל הַקָּהָל
  choice: సభ అంతా
  rationale: కָהָל్ సూచించే కూడివచ్చిన సమూహ భావాన్ని సహజంగా తెలియజేస్తుంది; כָל యొక్క సమగ్రతను ‘అంతా’ నిలుపుతుంది.
- source_word: קוֹל גָּדוֹל
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరంతో’; ఆధునిక తెలుగులో సమూహం గట్టిగా, బహిరంగంగా పలికిందనే భావాన్ని ‘బిగ్గరగా’ సహజంగా అందిస్తుంది.
- source_word: כֵּן
  choice: అవును
  rationale: ఇక్కడ ఎజ్రా చెప్పినదానికి సభ తెలిపిన ప్రత్యక్ష సమ్మతిని సూచిస్తుంది.
- source_word: כִדְבָרֶיךָ
  choice: నీ మాటల ప్రకారం
  rationale: ‘నీ మాటల ప్రకారం’ అని బహువచన రూపాన్నీ, రెండవ పురుష ఏకవచన సంబోధననూ నేరుగా నిలుపుతుంది.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: చేయవలసిన బాధ్యత మాపై ఉంది
  rationale: ‘చేయడం మాపై ఉంది’ అనే హీబ్రూ బాధ్యతా రూపకాన్ని తెలుగులో స్పష్టంగా, గౌరవప్రదంగా వ్యక్తపరుస్తూ ‘మాపై’ అనే రూపాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సమూహ సమ్మతి, గట్టిగా పలకడం, బాధ్యత తమపై ఉందనే భావం నిలుపబడ్డాయి.
