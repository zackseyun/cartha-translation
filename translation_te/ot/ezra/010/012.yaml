    issue: The participial wording “జవాబిస్తూ” weakens the completed verbal sequence.
    rationale: וַיַּעֲנוּ ... וַיֹּאמְרוּ means “they answered and said.” A conjunctive completed form in Telugu better reflects both verbs without adding a simultaneous-action nuance.
