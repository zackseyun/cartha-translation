source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: te
  text: అప్పుడు ఎజ్రా దేవుని మందిరం ఎదుటనుండి లేచి, ఎల్యాషీబు కుమారుడైన యెహోహానాను[a] గదికి వెళ్లాడు. అక్కడికి వెళ్లిన తరువాత, అతడు రొట్టె తినలేదు, నీళ్లు తాగలేదు; ఎందుకంటే చెరనుండి తిరిగివచ్చిన సమాజపు విశ్వాసద్రోహాన్ని[c] బట్టి అతడు దుఃఖిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యోహానాను’ అని కూడా పేరు రాయవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘విశ్వాసద్రోహం’ అనే పదాన్ని ‘ద్రోహం’ లేదా ‘విశ్వాసభంగం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం ఎదుటనుండి
  rationale: מִלִּפְנֵי అనే స్థలసూచక భావాన్ని ‘ఎదుటనుండి’ నిలుపుతూ, בֵּית הָאֱלֹהִים ఇక్కడ దేవాలయాన్ని సూచిస్తుందని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לִשְׁכַּת
  choice: గదికి
  rationale: దేవాలయ లేదా అధికార భవన సముదాయంలోని ప్రత్యేక గదిని సూచించే לשכה కు ‘గది’ సాధారణ ఆధునిక పాఠకులకు స్పష్టమైన, సహజమైన పదం.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: ఎల్యాషీబు కుమారుడైన యెహోహానాను
  rationale: హీబ్రూ వ్యక్తినామాల రూపాన్ని తెలుగులో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించింది; సాధారణంగా వినిపించే ప్రత్యామ్నాయ నామరూపాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: וַיֵּלֶךְ שָׁם
  choice: అతడు అక్కడికి వెళ్లి
  rationale: మూలంలోని ‘వెళ్లాడు/అక్కడికి వెళ్లాడు’ అనే పునరుక్తిని తొలగించకుండా నిలిపింది; ‘అక్కడ ఉండిపోయాడు’ లేదా ‘లోపలికి ప్రవేశించాడు’ అని అర్థాన్ని అనవసరంగా నిర్ధారించలేదు.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: రొట్టె తినలేదు, నీళ్లు తాగలేదు
  rationale: ఆహారానికి సూచకంగా ఉండగల ‘రొట్టె’ అనే నిర్దిష్ట మూలపదాన్నీ, ‘నీళ్లు’ అనే స్పష్టమైన కర్మనూ నిలిపి, సంపూర్ణ ఉపవాస భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: מִתְאַבֵּל
  choice: దుఃఖిస్తున్నాడు
  rationale: אבל యొక్క Hitpael రూపం గాఢమైన శోకాన్ని, దానికి సంబంధించిన ఉపవాస ఆచరణను సూచిస్తుంది; ‘దుఃఖిస్తున్నాడు’ ఆధునిక తెలుగులో ఈ సందర్భానికి సహజమైన గంభీర పదప్రయోగం.
- source_word: מַעַל
  choice: విశ్వాసద్రోహం
  rationale: מעל ఇక్కడ దేవునిపట్ల నిబంధనా విశ్వసనీయతను ఉల్లంఘించడాన్ని సూచిస్తుంది. ‘విశ్వాసద్రోహం’ దాని నైతిక, సంబంధపరమైన బరువును నిలుపుతుంది; కేవలం ‘పాపం’గా సాధారణీకరించదు.
- source_word: הַגּוֹלָה
  choice: చెరనుండి తిరిగివచ్చిన సమాజం
  rationale: ఈ పదం చెర అనుభవంతో గుర్తింపబడిన, తిరిగి వచ్చిన సమాజాన్ని సూచిస్తుంది. సందర్భార్థాన్ని స్పష్టం చేస్తూనే దాన్ని కేవలం వ్యక్తిగత ‘చెరబందీలు’గా పరిమితం చేయదు.
theological_decisions:
- issue: నిబంధనా వైఫల్య సందర్భంలో מַעַל అనువాదం
  choice: విశ్వాసద్రోహం
  alternative: ద్రోహం; నమ్మకంలేమి; అపరాధం
  rationale: సమాజం దేవునిపట్ల చూపిన నమ్మకభంగాన్ని ఈ పదం సూచిస్తుంది. ‘విశ్వాసద్రోహం’ ఆ నిబంధనా, నైతిక తీవ్రతను నిలుపుతూ దానిని కేవలం చట్టపరమైన అపరాధంగా కుదించదు.
- issue: בֵּית הָאֱלֹהִים ను పదశః ‘దేవుని ఇల్లు’గా లేదా సందర్భానుసారంగా ‘దేవుని మందిరం’గా అనువదించడం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు; దేవాలయం
  rationale: ఇక్కడ సూచించబడేది యెరూషలేము దేవాలయం. ‘దేవుని మందిరం’ మూలంలోని ఆరాధనా భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో అపార్థం లేకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. మూలంలోని కదలికా క్రియ పునరుక్తినీ, రొట్టె–నీళ్లు అనే స్పష్టమైన ఉపవాస జంటనూ నిలిపి, అర్థాన్ని మతశాఖాపరంగా విస్తరించలేదు.
