revisions:
- from: అప్పుడు ఎజ్రా దేవుని మందిరం ఎదుటనుండి లేచి, ఎల్యాషీబు కుమారుడైన యెహోహానాను[a] గదికి వెళ్లాడు. అతడు అక్కడికి వెళ్లి, రొట్టె తినలేదు, నీళ్లు తాగలేదు. ఎందుకంటే చెరనుండి తిరిగివచ్చిన సమాజం[b] చేసిన విశ్వాసద్రోహాన్ని[c] బట్టి అతడు దుఃఖిస్తున్నాడు.
  to: అప్పుడు ఎజ్రా దేవుని మందిరం ఎదుటనుండి లేచి, ఎల్యాషీబు కుమారుడైన యెహోహానాను[a] గదికి వెళ్లాడు. అక్కడికి వెళ్లిన తరువాత, అతడు రొట్టె తినలేదు, నీళ్లు తాగలేదు; ఎందుకంటే చెరనుండి తిరిగివచ్చిన సమాజపు విశ్వాసద్రోహాన్ని[c] బట్టి అతడు దుఃఖిస్తూ ఉన్నాడు.
  rationale: గతకాల కథనంతో సరిపడేలా శోకాన్ని ‘దుఃఖిస్తూ ఉన్నాడు’గా సవరించాను. הַגּוֹלָה మరియు מַעַל మధ్యనున్న సంబంధాన్ని ‘చెరనుండి తిరిగివచ్చిన సమాజపు విశ్వాసద్రోహం’గా నేరుగా వ్యక్తపరిచాను. పాఠ్యంలోని ‘చెరనుండి తిరిగివచ్చిన సమాజం’ ఇప్పటికే అర్థాన్ని స్పష్టం చేస్తున్నందున, దానిని పునరావృతం చేసే సాంస్కృతిక పాదసూచికను తొలగించాను. మిగిలిన పాదసూచిక గుర్తులు పాఠ్యంలో ఉన్న అంకర్లకే సరిపోతాయి.
