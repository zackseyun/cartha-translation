  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י עֵילָ֑ם מַתַּנְיָ֤ה זְכַרְיָה֙ וִ/יחִיאֵ֣ל וְ/עַבְדִּ֔י וִ/ירֵמ֖וֹת וְ/אֵלִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: te
  text: 'మరియు ఏలాము కుమారులలో నుండి: మత్తన్యా, జెకర్యా, యెహీయేలు, అబ్దీ, యెరేమోతు, ఏలీయా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారులలో
  rationale: వంశ లేదా కుటుంబ సభ్యుల జాబితాలో בְּנֵי అనేది వంశస్థులను సూచించే హీబ్రూ ప్రయోగం. ‘కుమారులు’ అనే రూపం మూలంలోని జాబితా సూత్రాన్ని నిలుపుతుంది; מִן ఇక్కడ ఆ సమూహం నుండి పేర్లు ఇవ్వబడుతున్నాయని సూచిస్తుంది.
- source_word: עֵילָם
  choice: ఏలాము
  rationale: ఈ సందర్భంలో కుటుంబ లేదా వంశ పూర్వికుని పేరు; తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: מַתַּנְיָה
  choice: మత్తన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో సహజంగా చదవగల లిప్యంతరీకరణ.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధారంగా తీసుకున్న తెలుగు లిప్యంతరీకరణ.
- source_word: וִ/יחִיאֵל
  choice: యెహీయేలు
  rationale: ముందున్న సంధికారకాన్ని జాబితా విరామచిహ్నాలతో వ్యక్తపరుస్తూ, వ్యక్తినామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְ/עַבְדִּי
  choice: అబ్దీ
  rationale: ఇది జాబితా నిర్మాణంలో వ్యక్తినామం; ‘నా సేవకుడు’ అనే సాధారణ నామార్థంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: וִ/ירֵמוֹת
  choice: యెరేమోతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ఉచ్చారణకు అనుకూలమైన లిప్యంతరీకరణ.
- source_word: וְ/אֵלִיָּה
  choice: ఏలీయా
  rationale: హీబ్రూ నామరూపాన్ని నేరుగా ప్రతిబింబించే, తెలుగులో పరిచితమైన లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశ జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని ప్రారంభ సంధికారకం తెలుగులో విడిగా ‘మరియు’ అని పెట్టకుండా సందర్భానుగుణంగా సహజీకరించబడింది.
