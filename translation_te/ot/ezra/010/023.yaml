translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలో క్రియ లేకపోయినా, తెలుగులో వాక్యం సహజంగా పూర్తవడానికి ‘ఉన్నారు’ చేర్చాం. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు యోజాబాదు తర్వాత ఉన్నప్పటికీ, ఆ పాదటిప్పణి కెలాయా–కెలీటా పేరురూపాలకు సంబంధించినందున మూలార్థానికి అనుగుణంగా దాన్ని అక్కడే ఉంచాం.
