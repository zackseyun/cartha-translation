  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם יוֹזָבָ֣ד וְ/שִׁמְעִ֗י וְ/קֵֽלָיָה֙ ה֣וּא קְלִיטָ֔א פְּתַֽחְיָ֥ה יְהוּדָ֖ה וֶ/אֱלִיעֶֽזֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: te
  text: 'లేవీయులలో: యోజాబాదు, షిమయి, కెలాయా (అంటే కెలీటా)[a], పెతహ్యా, యూదా, ఎలీయెజెరు ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కెలాయా, అతడే కెలీటా.” కెలీటా అనేది అదే వ్యక్తికి చెందిన మరో పేరు లేదా పేరుకు మరో రూపమని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: లేవీయులలో
  rationale: מִן యొక్క సమూహంలోనుండి కొందరిని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; జాబితా కొనసాగింపును వాక్య నిర్మాణమే స్పష్టం చేస్తుంది.
- source_word: יוֹזָבָד
  choice: యోజాబాదు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ధ్వని, లిపి సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְשִׁמְעִי
  choice: షిమయి
  rationale: హీబ్రూ Šimʿî పేరులోని ధ్వనిరూపాన్ని సాధ్యమైనంత దగ్గరగా ఉంచే తెలుగు లిప్యంతరీకరణ.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: కెలాయా (అంటే కెలీటా)[a]
  rationale: הוּא ఇక్కడ వివరణాత్మకంగా అదే వ్యక్తికి చెందిన మరో పేరురూపాన్ని గుర్తిస్తుంది. ‘అంటే’ ఈ సంబంధాన్ని స్పష్టంగా చూపుతూ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: פְּתַחְיָה
  choice: పెతహ్యా
  rationale: హీబ్రూ వ్యక్తి పేరుకు మూలాధారిత తెలుగు లిప్యంతరీకరణ.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇక్కడ గోత్రం లేదా ప్రాంతం కాక వ్యక్తిని సూచించే పేరుగా, తెలుగులో సుపరిచితమైన రూపాన్ని వాడాం.
- source_word: וֶאֱלִיעֶזֶר
  choice: ఎలీయెజెరు
  rationale: హీబ్రూ אֱלִיעֶזֶר స్వరరూపాన్ని అనుసరించి, ఎలియాజరు వంటి వేరే పేరుతో కలపకుండా లిప్యంతరీకరించాం.
