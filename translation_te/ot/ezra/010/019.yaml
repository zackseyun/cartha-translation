id: EZR.10.19
reference: Ezra 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: te
  text: వారు తమ భార్యలను పంపివేస్తామని మాట ఇచ్చారు[a]. దోషులైన వారు తమ అపరాధం నిమిత్తం మందలోని ఒక పొట్టేలును అర్పించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారు తమ చెయ్యి ఇచ్చారు’; ఇది వాగ్దానం చేయడాన్ని లేదా బద్ధమైన ఒప్పందం చేసుకోవడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: మరింత స్పష్టంగా, ‘తమ అపరాధం కోసం మందలోని ఒక పొట్టేలును అపరాధ పరిహారబలిగా అర్పించారు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: మాట ఇచ్చారు
  rationale: అక్షరార్థంగా ‘తమ చెయ్యి ఇచ్చారు’ అనే ఈ హీబ్రూ నుడికారం గంభీరమైన వాగ్దానం లేదా బద్ధమైన ఒప్పందాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మాట ఇచ్చారు’ దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְהוֹצִיא
  choice: పంపివేస్తామని
  rationale: יצא అనే ధాతువు హిఫీల్ రూపంలో ‘బయటికి వెళ్లేలా చేయడం’ అని అర్థం. ఈ వివాహ సందర్భంలో ‘పంపివేయడం’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: נְשֵׁיהֶם
  choice: తమ భార్యలను
  rationale: ఇక్కడ వివాహ సంబంధ సందర్భం ఉన్నందున సాధారణమైన ‘స్త్రీలు’ కంటే ‘భార్యలు’ అనే అర్థమే ఉద్దేశించబడింది.
- source_word: וַאֲשֵׁמִים
  choice: దోషులైన వారు
  rationale: ఈ విశేషణం వారి అపరాధస్థితిని సూచిస్తుంది. వారు అపరాధాన్ని ఒప్పుకున్నారని అదనంగా చెప్పకుండా, మూలంలోని దోషభావాన్ని నిలుపుతుంది.
- source_word: אֵיל צֹאן
  choice: మందలోని ఒక పొట్టేలును
  rationale: బలి కోసం ఉపయోగించే మందకు చెందిన మగ గొర్రెను ఈ పదబంధం సూచిస్తుంది. ‘మందలోని ఒక పొట్టేలు’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: עַל אַשְׁמָתָם
  choice: తమ అపరాధం నిమిత్తం
  rationale: עַל తో కూడిన నామవాచకం ఆ అర్పణకు కారణమైన అపరాధాన్ని సూచిస్తుంది. ఈ అనువాదం కారణ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రధాన పాఠంలో దీనిని సాంకేతికంగా ‘అపరాధ పరిహారబలి’ అని స్పష్టం చేయాలా
  choice: ‘తమ అపరాధం నిమిత్తం మందలోని ఒక పొట్టేలును అర్పించారు’ అని ఉంచడం
  alternative: ‘తమ అపరాధం కోసం మందలోని ఒక పొట్టేలును అపరాధ పరిహారబలిగా అర్పించారు’
  rationale: హీబ్రూ పాఠం పొట్టేలును, వారి అపరాధాన్ని ప్రత్యక్షంగా పేర్కొంటుంది; అయితే ఈ వాక్యభాగంలో ‘బలి’ అనే ప్రత్యేక నామవాచకం లేదు. సహజమైన వాక్యానికి ‘అర్పించారు’ అని పూరించడం సముచితం; పూర్తి సాంకేతిక పేరు మూలపాఠాన్ని మించి స్పష్టీకరించే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో సహజంగా అనువదించి, దాని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం; బలి సంబంధ సాంకేతిక స్పష్టీకరణను ప్రధాన పాఠంలో అతిగా చేర్చకుండా ప్రత్యామ్నాయంగా సూచించాం.
