source:
  edition: WLC
  text: וּ/מִֽ/יִּשְׂרָאֵ֑ל מִ/בְּנֵ֣י פַרְעֹ֡שׁ רַ֠מְיָה וְ/יִזִּיָּ֤ה וּ/מַלְכִּיָּה֙ וּ/מִיָּמִ֣ן וְ/אֶלְעָזָ֔ר וּ/מַלְכִּיָּ֖ה וּ/בְנָיָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: te
  text: 'ఇశ్రాయేలీయులలో, పరోషు కుమారులలో: రమ్యా, ఇజ్జీయా, మల్కీయా[a], మియ్యామీను, ఎలియాజరు, మల్కీయా, బెనాయా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘మల్కీయా’ అనే పేరు ఈ జాబితాలో రెండుసార్లు ఉంది; ఒకే పేరు గల ఇద్దరు వేర్వేరు వ్యక్తులను ఇది సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో
  rationale: ముందటి జాబితాకు కొనసాగింపుగా ఉన్న וּను తెలుగు వాక్యప్రవాహంలో విరామచిహ్నం ద్వారా సూచించాం; מִן ఇక్కడ సమూహంలోనివారిని పరిచయం చేస్తున్నందున ‘ఇశ్రాయేలీయులలో’ సహజంగా ఉంది.
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: పరోషు కుమారులలో
  rationale: בני యొక్క ‘కుమారులు’ అనే వంశ/కుటుంబ జాబితా రూపాన్ని నిలిపి, מן భావాన్ని ‘లో’తో తెలిపాం.
- source_word: רַמְיָה
  choice: రమ్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יִזִּיָּה
  choice: ఇజ్జీయా
  rationale: హీబ్రూ యిజ్జీయా రూపాన్ని ఆధారంగా తీసుకుని, తెలుగులో సహజంగా పలికే లిప్యంతరణను ఎంచుకున్నాం.
- source_word: מַלְכִּיָּה
  choice: మల్కీయా
  rationale: రెండు చోట్లా ఉన్న ఒకే హీబ్రూ నామరూపాన్ని ఒకే విధంగా లిప్యంతరీకరించాం.
- source_word: מִיָּמִן
  choice: మియ్యామీను
  rationale: మస్సొరెటిక్ స్వరరూపంలోని ద్విత్వ య్ ధ్వనిని, చివరి న్ ధ్వనిని తెలుగు నామరూపంలో ప్రతిబింబించాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని వాడుతూ మూలనామాన్ని గుర్తించగలిగేలా ఉంచాం.
- source_word: בְנָיָה
  choice: బెనాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
