translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశజాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని పాటించాం. హీబ్రూలో ప్రతి పేరుకు ముందు పునరావృతమయ్యే సంధికారకాలను తెలుగులో కామాలతో సహజ జాబితాగా మార్చాం; పాఠంలో పునరావృతమైన మల్కీయా పేరును యథాతథంగా నిలిపాం.
