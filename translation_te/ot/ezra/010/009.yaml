  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘దేవుని మందిరం’ సాధారణ పాఠకుడికి ‘దేవుని ఇల్లు’ కంటే ఆలయ సూచనను స్పష్టంగా ఇస్తుంది. వర్షానికి ‘భారీ’ అనే విశేషణం మూలంలో ప్రత్యక్షంగా లేకపోవడంతో చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
