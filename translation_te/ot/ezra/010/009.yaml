source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: te
  text: అప్పుడు యూదా, బెన్యామీనులకు చెందిన పురుషులందరూ[c] మూడు రోజుల గడువులోగా[a] యెరూషలేములో సమావేశమయ్యారు. అది తొమ్మిదవ నెలలో ఇరవయ్యవ రోజు. ప్రజలందరూ దేవుని మందిరం వద్దనున్న విశాలమైన బహిరంగ స్థలంలో[b] కూర్చుని, ఈ విషయం కారణంగాను వర్షాల కారణంగాను వణికిపోతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మూడు రోజులలోపే.’
    reason: కాలపరమైన పదబంధం ప్రకటించిన గడువులోపు చేరడాన్ని సూచిస్తుంది.
  - marker: b
    text: లేదా, ‘దేవుని మందిరం ఎదుటి విశాలమైన బహిరంగ స్థలంలో.’ హెబ్రీ పదం విశాలమైన బహిరంగ స్థలాన్ని లేదా కూడలిని సూచిస్తుంది; ఇది తప్పనిసరిగా మందిరపు అంతర్గత ఆవరణను సూచించదు.
    reason: רְחוֹב అనే పదం విశాలమైన బహిరంగ స్థలం లేదా కూడలిని సూచిస్తుంది; ఖచ్చితమైన నిర్మాణ సంబంధం అస్పష్టంగా ఉంది.
  - marker: c
    text: హెబ్రీలో ‘యూదా, బెన్యామీనుల పురుషులందరూ’ అనే పదబంధం వ్యాకరణపరంగా పురుషలింగంలో ఉంది; బహుశా సమావేశానికి పిలువబడిన పురుష సభ్యులను లేదా ప్రతినిధులను సూచిస్తుంది.
    reason: אַנְשֵׁי అనే పదం అక్షరార్థంగా ‘పురుషులు’ అని సూచిస్తుంది; సమూహానికి సంబంధించిన సందర్భానుగుణ పరిమితిని పాదసూచిక వివరిస్తుంది.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: సమావేశమయ్యారు
  rationale: నిఫాల్ రూపం సమకూడడం లేదా సమావేశమవడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో అధికారిక పిలుపుకు స్పందించి కూడిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను ప్రాంతాల పురుషులందరూ
  rationale: אַנְשֵׁי వ్యాకరణపరంగా ‘పురుషులు’ అని సూచిస్తుంది. యూదా, బెన్యామీను ఇక్కడ భూభాగాలు లేదా గోత్ర సముదాయాలను సూచించగలవు; ‘ప్రాంతాల’ అనేది ఆధునిక పాఠకుడికి సహజంగా ఉన్నా పురుషలింగ సూచనను నిలుపుతుంది.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: మూడు రోజుల గడువులోగా
  rationale: మునుపు ప్రకటించిన మూడు రోజుల కాలపరిమితిలోనే వారు చేరుకున్నారని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: అది తొమ్మిదో నెల ఇరవయ్యో రోజు
  rationale: హెబ్రీ కాలనిర్దేశాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు తేదీ వాక్యంగా అందిస్తుంది.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం దగ్గరున్న విశాల ప్రాంగణంలో
  rationale: רְחוֹב విశాలమైన బహిరంగ స్థలాన్ని సూచిస్తుంది; అది తప్పనిసరిగా మందిరపు అంతర్గత ఆవరణ కాదనే భౌగోళిక అస్పష్టతను ‘దగ్గరున్న’ కాపాడుతుంది.
- source_word: מַרְעִידִים
  choice: వణికిపోతున్నారు
  rationale: భయం లేదా ఆందోళనతో పాటు వర్షం వల్ల కలిగిన శారీరక వణుకును కూడా కలిపి వ్యక్తపరచగల సహజ తెలుగు రూపం.
- source_word: עַל הַדָּבָר
  choice: ఈ విషయం వల్ల
  rationale: నిర్దిష్టంగా ముందున్న సంక్షోభాన్ని సూచించే הַדָּבָר భావాన్ని ‘ఈ విషయం’ సహజంగా తెలియజేస్తుంది.
- source_word: וּמֵהַגְּשָׁמִים
  choice: వర్షాల వల్ల
  rationale: హెబ్రీ బహువచనాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘భారీ’ అనే తీవ్రతను చేర్చకుండా కారణార్థాన్ని తెలియజేస్తుంది.
