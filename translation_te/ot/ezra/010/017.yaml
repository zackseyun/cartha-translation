id: EZR.10.17
reference: Ezra 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְכַלּ֣וּ בַ/כֹּ֔ל אֲנָשִׁ֕ים הַ/הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת עַ֛ד י֥וֹם אֶחָ֖ד לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: te
  text: విదేశీ స్త్రీలను భార్యలుగా తీసుకున్న పురుషులందరి విషయాన్ని వారు మొదటి నెల మొదటి రోజుకల్లా[a] పరిష్కరించడం ముగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొదటి నెల మొదటి రోజు వరకు.’ హెబ్రీ కాలసూచక పదబంధాన్ని రెండు విధాలుగా అనువదించవచ్చు; ప్రధాన పాఠం ఆ తేదీకల్లా ప్రక్రియ పూర్తయిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: పరిష్కరించడం ముగించారు
  rationale: כלה అనే క్రియ ఇక్కడ ముందటి వచనాల్లో వివరించిన విచారణా ప్రక్రియ పూర్తయిందని సూచిస్తుంది. తెలుగులో కేవలం ‘ముగించారు’ అనడం అసంపూర్ణంగా వినిపించవచ్చు కాబట్టి, సందర్భానుగుణంగా ‘పరిష్కరించడం ముగించారు’ అని ఇచ్చాం.
- source_word: בַכֹּל אֲנָשִׁים
  choice: పురుషులందరి విషయాన్ని
  rationale: בַכֹּל మొత్తం పరిధిని సూచిస్తుంది; אֲנָשִׁים పుంలింగ బహువచనం. ‘పురుషులందరి విషయాన్ని’ అనే రూపం హెబ్రీయులోని ‘వారందరితో/వారందరి విషయంలో ముగించారు’ అనే ప్రక్రియాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַהֹשִׁיבוּ
  choice: భార్యలుగా తీసుకున్న
  rationale: ఈ రూపానికి అక్షరార్థంగా ‘నివసింపజేసిన’ అనే భావం ఉన్నా, ఎజ్రా 10 సందర్భంలో స్త్రీలను తమ గృహాల్లో భార్యలుగా చేర్చుకోవడాన్ని సూచిస్తుంది. ‘వివాహం చేసుకున్న’ కంటే ‘భార్యలుగా తీసుకున్న’ మూలంలోని నుడికారానికి దగ్గరగా ఉంటుంది.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: విదేశీ స్త్రీలను
  rationale: נָשִׁים అంటే స్త్రీలు/భార్యలు, נָכְרִיּוֹת అంటే విదేశీయులు. వెంటనే వచ్చే ‘భార్యలుగా’ అనే పదబంధంతో కలిపి, సందర్భంలోని వైవాహిక భావం స్పష్టంగా ఉంటుంది; అనవసరమైన మతపరమైన నిర్వచనాన్ని చేర్చదు.
- source_word: עַד יוֹם אֶחָד
  choice: మొదటి రోజుకల్లా
  rationale: עַד కాలపరమైన అంత్యబిందువును సూచిస్తుంది. పూర్తయిన చర్యతో ‘రోజుకల్లా’ సహజమైన తెలుగు; అయితే ‘రోజు వరకు’ అనే అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల
  rationale: ఇది క్యాలెండరులోని మొదటి నెలను సూచించే సూటి తేదీ ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సంక్షిప్త ప్రక్రియాత్మక ప్రయోగాన్ని తెలుగులో సహజంగా చేయడానికి ‘విషయాన్ని ... పరిష్కరించడం’ అని స్పష్టం చేశాం; తేదీ ప్రయోగంలోని నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
