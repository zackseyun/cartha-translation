  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: te
  text: 'హాషూము కుమారులలో: మత్తెనై, మత్తత్తా[a], జాబాదు, ఎలీఫెలెతు, యెరేమై, మనష్షే, షిమీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును “మత్తతా” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי חָשֻׁם
  choice: హాషూము కుమారులలో
  rationale: ఈ జాబితా సందర్భంలో מִן ఉపసర్గ కుటుంబ సమూహంలోనివారిని పరిచయం చేస్తుంది; ‘కుమారులలో’ అనేది సహజమైన తెలుగు ప్రయోగం, అలాగే వంశసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: מַתְּנַי
  choice: మత్తెనై
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מַתַּתָּה
  choice: మత్తత్తా
  rationale: హీబ్రూ రూపంలోని వ్యంజన ద్విత్వాన్ని వీలైనంతగా నిలుపుతూ పేరును లిప్యంతరీకరించాం.
- source_word: זָבָד
  choice: జాబాదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పేర్లకు సహజమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלִיפֶלֶט
  choice: ఎలీఫెలెతు
  rationale: పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: יְרֵמַי
  choice: యెరేమై
  rationale: హీబ్రూ అంత్యధ్వనిని నిలుపుతూ నేరుగా లిప్యంతరీకరించాం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ שּׁ ద్విత్వాన్ని సూచిస్తూ పేరును తెలుగు ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనులను సంక్షిప్తంగా, స్పష్టంగా తెలుగు లిపిలో ప్రతిబింబించాం.
