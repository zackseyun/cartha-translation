  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశజుల జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని ఉపయోగించాం. వ్యక్తినామాలను మూల హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం.
