id: EZR.10.1
reference: Ezra 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְ/הִתְפַּלֵּ֤ל עֶזְרָא֙ וּ/כְ֨/הִתְוַדֹּת֔/וֹ בֹּכֶה֙ וּ/מִתְנַפֵּ֔ל לִ/פְנֵ֖י בֵּ֣ית הָ/אֱלֹהִ֑ים נִקְבְּצוּ֩ אֵלָ֨י/ו מִ/יִּשְׂרָאֵ֜ל קָהָ֣ל רַב מְאֹ֗ד אֲנָשִׁ֤ים וְ/נָשִׁים֙ וִֽ/ילָדִ֔ים כִּֽי בָכ֥וּ הָ/עָ֖ם הַרְבֵּה בֶֽכֶה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: te
  text: ఎజ్రా దేవుని మందిరం ఎదుట ప్రార్థిస్తూ, ఒప్పుకుంటూ, ఏడుస్తూ, నేలపై పడుతూ ఉండగా, ఇశ్రాయేలీయులలోనుండి పురుషులు, స్త్రీలు, పిల్లలు కూడిన అతి పెద్ద సమూహం అతని దగ్గరికి చేరింది. ఎందుకంటే ప్రజలు ఎంతోగా ఏడ్చారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ప్రజలు చాలా ఏడుపుతో ఏడ్చారు.”'
    reason: హీబ్రూ הַרְבֵּה בֶכֶה లో “ఎంతో/చాలా” అనే ఉద్ఘాటనతో “ఏడుపు” అనే నామవాచకం కలసి ఉంది; ప్రధాన పాఠంలోని సహజ తెలుగు భావాన్ని పాదటిప్పణి మరింత సమీపంగా చూపిస్తుంది.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: ఎజ్రా ... ప్రార్థిస్తూ ... ఉండగా
  rationale: כְּ prefixed to the infinitive marks contemporaneous action. The Telugu construction “ప్రార్థిస్తూ ... ఉండగా” naturally presents Ezra’s prayer as the ongoing background action.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: పాపాలను ఒప్పుకుంటూ
  rationale: The hitpael of ידה denotes confession. In this penitential context, “పాపాలను ఒప్పుకుంటూ” is clearer and more natural in modern Telugu than the nominally literal but awkward “ఒప్పుకోలు చేస్తూ.”
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: ఏడుస్తూ, నేలపై పడి
  rationale: The paired participles portray continuing weeping and self-casting down. “నేలపై పడి” conveys the bodily abasement without specifying a more exact posture than the Hebrew does.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం ఎదుట
  rationale: Although the Hebrew literally says “house of God,” “దేవుని మందిరం” is the natural Telugu designation here and clearly refers to the temple; “ఎదుట” preserves לִפְנֵי.
- source_word: נִקְבְּצוּ אֵלָיו
  choice: అతని దగ్గరికి చేరింది
  rationale: The Niphal means to gather or assemble, and אֵלָיו indicates movement toward Ezra. The singular verb agrees naturally in Telugu with “సమూహం.”
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లోనుంచి
  rationale: The phrase refers to people from among the Israelite community rather than merely geographic departure from the land; this rendering makes that sense natural in Telugu.
- source_word: קָהָל רַב מְאֹד
  choice: అతి పెద్ద సమూహం
  rationale: קָהָל is a gathered assembly, while רַב מְאֹד emphasizes its size. “అతి పెద్ద సమూహం” is current, non-ecclesiastical Telugu.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: పురుషులు, స్త్రీలు, పిల్లలతో కూడిన
  rationale: The explicit three-part description is preserved and integrated naturally as a modifier of the assembly.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: Here כִּי introduces an explanatory reason. A separate sentence beginning with “ఎందుకంటే” keeps the causal relation clear in ordinary Telugu.
- source_word: הַרְבֵּה בֶכֶה
  choice: ఎంతోగా ఏడ్చారు
  rationale: The Hebrew intensifies the act of weeping by combining an adverbial expression with the noun “weeping.” This Telugu wording retains the intensity without adding the more specific emotional nuance of “bitterly.”
theological_decisions:
- issue: Content of Ezra’s confession
  choice: పాపాలను ఒప్పుకుంటూ
  alternative: ఒప్పుకుంటూ / ఒప్పుకోలు చేస్తూ
  rationale: The Hebrew verb itself means to confess but leaves the object unstated. The surrounding penitential setting makes sins the understood object; Telugu normally requires or strongly favors an expressed object here. This clarifies the idiom without identifying whose particular sins Ezra confessed.
- issue: Ezra’s bodily posture
  choice: నేలపై పడి
  alternative: సాష్టాంగపడి
  rationale: The reflexive form depicts casting oneself down, but it does not define a precise ritual posture. The chosen wording avoids importing the more specific posture suggested by “సాష్టాంగపడి.”
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి ఉపయోగించబడింది. “సమూహం” వంటి సాధారణ పదాలతో అనవసరమైన సంఘపరమైన భావసూచనలు నివారించబడ్డాయి; శరీర భంగిమను మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయలేదు.
