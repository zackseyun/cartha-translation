  text: 'From the sons of Bani: Maadai, Amram, and Uel.'
translation:
  language: te
  text: 'బానీ కుమారులలో: మాదయి, అమ్రాము, మరియు ఊయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי
  choice: కుమారులలో
  rationale: מִן‌తో కూడిన בְּנֵי ఇక్కడ పెద్ద కుటుంబ జాబితాలోని కొందరిని సూచించే భాగార్థక ప్రయోగం; ఆధునిక తెలుగులో ‘కుమారులలో’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: בָנִי
  choice: బానీ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: מַעֲדַי
  choice: మాదయి
  rationale: వ్యక్తి పేరు; మూల హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עַמְרָם
  choice: అమ్రాము
  rationale: వ్యక్తి పేరు; తెలుగులో చదవడానికి సహజంగా ఉండే ప్రామాణిక బైబిలు పేరురూపం ఉపయోగించబడింది.
- source_word: וְאוּאֵל
  choice: ఊయేలు
  rationale: וְ సంధి జాబితాలో విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమవుతుంది; אוּאֵל పేరు హీబ్రూ స్వరరూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
