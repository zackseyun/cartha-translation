translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశ/కుటుంబ జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లను అనువదించకుండా మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
