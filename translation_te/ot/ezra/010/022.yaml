source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י פַּשְׁח֑וּר אֶלְיוֹעֵינַ֤י מַֽעֲשֵׂיָה֙ יִשְׁמָעֵ֣אל נְתַנְאֵ֔ל יוֹזָבָ֖ד וְ/אֶלְעָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/022.yaml
  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: te
  text: 'మరియు పష్హూరు వంశస్థులలో: ఎల్యోయేనై, మయశేయా, ఇష్మాయేలు, నెతనేలు, యోజాబాదు, మరియు ఎలాసా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי פַּשְׁחוּר
  choice: పష్హూరు వంశస్థులలో
  rationale: ఈ జాబితాలోని మరో ఉపవర్గాన్ని సూచించే సంధి, విభక్తి, ‘కుమారులు’ అనే బహువచన నిర్మాణంలోని భాగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ఇక్కడ వ్యక్తిగత కుమారులకన్నా వంశానికి చెందినవారు అనే భావం సందర్భోచితం.
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: హీబ్రూ పేరును దాని ధ్వనికి సమీపంగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: מַעֲשֵׂיָה
  choice: మయశేయా
  rationale: హీబ్రూ పేరులోని ధ్వని నిర్మాణాన్ని సాధ్యమైనంత సహజంగా తెలుగు లిపిలో ప్రతిబింబిస్తుంది.
- source_word: יִשְׁמָעֵאל
  choice: ఇష్మాయేలు
  rationale: తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపాన్ని ఉంచుతూ హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: נְתַנְאֵל
  choice: నెతన్యేలు
  rationale: హీబ్రూ పేరును తెలుగు ఉచ్చారణకు అనువుగా లిప్యంతరీకరించింది.
- source_word: יוֹזָבָד
  choice: యోజాబాదు
  rationale: ప్రారంభ హీబ్రూ యోడ్ ధ్వనిని ‘యో’గా, మిగిలిన పేరును తెలుగు పఠనానికి అనుకూలంగా ప్రతిబింబించింది.
- source_word: וְ/אֶלְעָשָׂה
  choice: ఎల్యాశా
  rationale: హీబ్రూ పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించింది; జాబితా చివరి అంశాన్ని తెలుగులో కామాతో సహజంగా కలిపింది.
