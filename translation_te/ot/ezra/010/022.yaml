translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పేర్ల జాబితాకు తగిన సంక్షిప్త, గంభీర శైలి. హీబ్రూ వాక్యారంభంలోని ‘మరియు’ భావం కొనసాగుతున్న జాబితాలో తెలుగుకు సహజంగా ఉండేలా ప్రత్యేక పదంగా ఇవ్వలేదు.
