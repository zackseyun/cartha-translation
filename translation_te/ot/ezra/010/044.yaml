  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: te
  text: వీరందరూ పరదేశ స్త్రీలను పెళ్లి చేసుకున్నారు. వారిలో కొందరికి పిల్లలను కన్న భార్యలు ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'చివరి భాగానికి అక్షరార్థానికి దగ్గరైన అనువాదం: “వారిలో భార్యలు ఉన్నారు; వారు కుమారులను ఉంచారు.” ఇక్కడి హీబ్రూ వాక్యం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది; “పిల్లలు” అనే పదానికి హీబ్రూలో అక్షరార్థం “కుమారులు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י נָשִׁים
  choice: స్త్రీలను పెళ్లి చేసుకున్నారు
  rationale: נשׂא + נָשִׁים అనే ప్రయోగం ఈ సందర్భంలో వివాహం చేసుకోవడాన్ని సూచిస్తుంది; ‘తీసుకున్నారు’ అనే అక్షరార్థం కంటే ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: పరదేశ స్త్రీలు
  rationale: నָכְרִיּוֹת ఇశ్రాయేలు సమాజానికి వెలుపలివారైన స్త్రీలను సూచిస్తుంది. ‘పరదేశ స్త్రీలు’ జాతి/సమాజ భేదాన్ని తెలియజేస్తూ అవమానార్థాన్ని జోడించదు.
- source_word: וְיֵשׁ מֵהֶם נָשִׁים
  choice: వారిలో కొందరికి ... భార్యలు ఉన్నారు
  rationale: అస్తిత్వార్థక יֵשׁ మరియు מֵהֶם కలయికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; రెండవ నָשִׁיםకు సంబంధార్థమైన ‘భార్యలు’ అనువైనది.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: పిల్లలను కన్న
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. సందర్భంలో ఈ వివాహాల ద్వారా సంతానం కలిగిందనే భావాన్ని ‘పిల్లలను కన్న’ సహజంగా అందిస్తుంది; క్రియ యొక్క అసాధారణ రూపాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: בָּנִים
  choice: పిల్లలు
  rationale: పదానికి అక్షరార్థం ‘కుమారులు’; అయితే సందర్భంలో అది సంతానాన్ని విస్తృతంగా సూచించవచ్చు. లింగాన్ని అనవసరంగా పరిమితం చేయకుండా ‘పిల్లలు’ ఎంచుకున్నాం.
