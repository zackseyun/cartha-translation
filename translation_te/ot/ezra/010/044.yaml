translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని క్లిష్టమైన చివరి వాక్యభాగాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించి, దాని అక్షరార్థ రూపం మరియు ‘కుమారులు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
