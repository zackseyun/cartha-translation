translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పేర్ల జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. ‘కుమారులు’ కంటే సందర్భానుకూలమైన ‘వంశస్థులు’ వాడి కుటుంబ సమూహార్థాన్ని స్పష్టం చేశాం.
