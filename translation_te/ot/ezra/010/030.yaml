source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֛י פַּחַ֥ת מוֹאָ֖ב עַדְנָ֣א וּ/כְלָ֑ל בְּנָיָ֤ה מַעֲשֵׂיָה֙ מַתַּנְיָ֣ה בְצַלְאֵ֔ל וּ/בִנּ֖וּי וּ/מְנַשֶּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: te
  text: 'పహత్-మోయాబు వంశస్థులలో: అద్నా, కెలాలు, బెనాయా, మయశేయా, మత్తన్యా, బెసలేలు, బిన్నూయి, మనష్షే.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: వంశస్థులలో
  rationale: בְּנֵי అనే పదం ఈ వంశపట్టికలో కేవలం ప్రత్యక్ష కుమారులను కాక కుటుంబం లేదా వంశానికి చెందినవారిని సూచించగలదు; మִן‌ను ‘లో’ ద్వారా సహజమైన తెలుగులో వ్యక్తం చేశాం. వచనం జాబితాలో కొనసాగుతున్నందున ఆరంభ וּను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: פַּחַת מוֹאָב
  choice: పహత్-మోయాబు
  rationale: ఇది కుటుంబ లేదా వంశనామం; దాని సంయుక్త స్వరూపం కనిపించేలా లిప్యంతరీకరించాం.
- source_word: עַדְנָא
  choice: అద్నా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ఉచ్చారణకు అనుకూలమైన లిప్యంతరీకరణ.
- source_word: וּ/כְלָל
  choice: కెలాలు
  rationale: హీబ్రూ כְלָל పేరును ‘కె’ ధ్వనితో లిప్యంతరీకరించాం; ముందున్న సంధికారకాన్ని తెలుగు జాబితా శైలిలో విడిగా చూపలేదు.
- source_word: בְּנָיָה
  choice: బెనాయా
  rationale: హీబ్రూ పేరులోని ధ్వనులకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: מַעֲשֵׂיָה
  choice: మయశేయా
  rationale: హీబ్రూ పేరులోని ע ధ్వనిని తెలుగులో ప్రత్యేకంగా సూచించకుండా, మిగిలిన అక్షరధ్వనులను సహజంగా ప్రతిబింబించాం.
- source_word: מַתַּנְיָה
  choice: మత్తన్యా
  rationale: ద్విత్వ תּ ధ్వనిని ‘త్త’తో, చివరి יָהను ‘యా’తో ప్రతిబింబించాం.
- source_word: בְצַלְאֵל
  choice: బెసలేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: וּ/בִנּוּי
  choice: బిన్నూయి
  rationale: ద్విత్వ נּను ‘న్న’తో చూపిస్తూ పేరును లిప్యంతరీకరించాం; సంధికారకాన్ని జాబితా విరామచిహ్నంలో గ్రహించాం.
- source_word: וּ/מְנַשֶּׁה
  choice: మనష్షే
  rationale: שּׁ ధ్వనిని ‘ష్ష’తో ప్రతిబింబించాం; చివరి సంధికారకాన్ని తెలుగు జాబితాలో కామాతో సహజంగా సూచించాం.
