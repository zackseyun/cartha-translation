  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י בָּנִ֑י מְשֻׁלָּ֤ם מַלּוּךְ֙ וַ/עֲדָיָ֔ה יָשׁ֖וּב וּ/שְׁאָ֥ל ירמות׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: te
  text: 'మరియు బానీ కుమారులలోనుండి: మెషుల్లాము, మల్లూకు[a], అదాయా, యాషూబు, షెయాలు, యెరేమోతు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరు కొన్ని అనువాదాల్లో “మల్లూఖు” అనే రూపంలో కూడా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని పాఠ, అనువాద సంప్రదాయాల్లో ఈ పేరు “రామోతు” అనే రూపంలో కనిపిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: బానీ కుమారుల్లో
  rationale: సంయోజక అవ్యయం, ‘నుండి/లోనుండి’ అనే ఉపసర్గ, ‘కుమారులు’ అనే నిర్మాణరూపం కలిసిన హెబ్రీ పదబంధం. వంశజుల జాబితా సందర్భంలో ‘బానీ కుమారుల్లో’ అనేది సహజమైన ఆధునిక తెలుగు; అదే సమయంలో మూలంలోని జాబితా-వంశావళి భాషను నిలుపుతుంది.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: మసొరెతు స్వరచిహ్నాలతో ఉన్న హెబ్రీ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: מַלּוּךְ
  choice: మల్లూకు
  rationale: హెబ్రీ ఉచ్చారణను అనుసరించిన వ్యక్తినామ లిప్యంతరీకరణ; ఇతర భాషా సంప్రదాయాల్లో చివరి వ్యంజనాన్ని భిన్నంగా సూచించే రూపాలు ఉన్నాయి.
- source_word: וַ/עֲדָיָה
  choice: అదాయా
  rationale: సంయోజక అవ్యయంతో కూడిన వ్యక్తినామం. తెలుగు జాబితా శైలిలో సంయోజకాన్ని విడిగా పునరావృతం చేయకుండా విరామచిహ్నాలతో వరుసగా ఇచ్చాం.
- source_word: יָשׁוּב
  choice: యాషూబు
  rationale: మసొరెతు పాఠంలోని స్వరాలను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: וּ/שְׁאָל
  choice: షెయాలు
  rationale: మసొరెతు స్వరీకరణను అనుసరించిన వ్యక్తినామం; ముందున్న సంయోజక అవ్యయం తెలుగు జాబితా నిర్మాణంలో అంతర్భవించింది.
- source_word: ירמות
  choice: యెరేమోతు
  rationale: ఈ జాబితా సందర్భంలో ప్రాచీన అనువాద, నామసంప్రదాయాల్లో విస్తృతంగా గుర్తించబడిన పేరురూపాన్ని ఉపయోగించాం; స్వరచిహ్నాలు లేని ఈ లిఖితరూపానికి మరో పఠనం సాధ్యమని పాదటిప్పణిలో తెలిపాం.
