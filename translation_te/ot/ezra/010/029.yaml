translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సంక్షిప్తమైన, గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించాం. వ్యక్తినామాలను మూల హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం. జాబితా ప్రారంభంలోని וּ (‘మరియు’) తెలుగులో విడిగా అనువదిస్తే మునుపటి వచనంతో అనుసంధానం లేకుండా అసహజంగా అనిపించే అవకాశం ఉన్నందున, ‘బానీ కుమారుల్లో’ అనే కొనసాగింపు నిర్మాణంలో భావపరంగా ఉంచాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పేర్ల వెంటనే ఉంచాం.
