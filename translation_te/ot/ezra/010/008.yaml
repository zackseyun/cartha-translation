id: EZR.10.8
reference: Ezra 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: te
  text: అధికారులు, పెద్దలు చేసిన నిర్ణయం ప్రకారం మూడు రోజుల్లోగా రాని ప్రతి ఒక్కరి ఆస్తి అంతా జప్తు చేయబడుతుంది[a]; అతడు స్వయంగా ప్రవాసుల సభ నుండి వేరుచేయబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిషేధానికి అప్పగించబడుతుంది,’ లేదా ‘నాశనానికి అంకితం చేయబడుతుంది.’ ఇక్కడి హెబ్రీ క్రియ חרם అనే నిషేధం లేదా తిరుగులేని అంకితానికి సంబంధించినది; సందర్భానుసారం అది నాశనాన్ని లేదా ఆస్తి జప్తును సూచించవచ్చు.
    reason: חרם అనే పదంలోని జప్తు, నిషేధం, అంకితం, నాశనం అనే భావపరిధిని సంరక్షించడానికి.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: రాని ప్రతి ఒక్కరి
  rationale: సాధారణ షరతును, ప్రతి వ్యక్తికీ వర్తించే పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: మూడు రోజుల్లోగా
  rationale: హాజరు కావలసిన గడువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּעֲצַת הַשָּׂרִים וְהַזְּקֵנִים
  choice: అధికారులు, పెద్దలు చేసిన నిర్ణయం ప్రకారం
  rationale: עֵצָה ఇక్కడ నాయకుల అధికారిక నిర్ణయాన్ని సూచిస్తుంది; שָׂרִיםకు ప్రవాసానంతర పరిపాలనా సందర్భంలో ‘అధికారులు’ సహజంగా సరిపోతుంది.
- source_word: יָחֳרַם כָּל רְכוּשׁוֹ
  choice: అతని ఆస్తి అంతా జప్తు చేయబడుతుంది
  rationale: ఆస్తి విషయమైన ఈ న్యాయపరమైన సందర్భంలో חרם యొక్క ఆచరణాత్మక ఫలితాన్ని స్పష్టంగా అందిస్తుంది; ఆ పదంలోని నిషేధం/అంకితం/నాశనం అనే విస్తృత భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְהוּא יִבָּדֵל
  choice: అతడు స్వయంగా ... వేరుచేయబడతాడు
  rationale: ప్రత్యేకంగా ఉన్న וְהוּא యొక్క ఉద్ఘాటనను ‘స్వయంగా’ ద్వారా, בדל నిఫల్ యొక్క విభజన భావాన్ని ‘వేరుచేయబడతాడు’ ద్వారా కాపాడుతుంది.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: ప్రవాసుల సభ నుండి
  rationale: קהל యొక్క సమావేశం/సభ భావాన్ని, הַגּוֹלָה యొక్క ప్రవాస సమూహ సూచనను నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆస్తిపై חרם శిక్ష యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘జప్తు చేయబడుతుంది’; חרם యొక్క సాంకేతిక విస్తృతిని పాదసూచికలో పేర్కొనడం
  alternative: ‘నిషేధానికి అప్పగించబడుతుంది’ లేదా ‘నాశనానికి అంకితం చేయబడుతుంది’
  rationale: ఈ పరిపాలనా సందర్భంలో ఆస్తి కోల్పోవడం ప్రధాన ఆచరణాత్మక భావం. అయితే హెబ్రీ క్రియ సాధారణ జప్తుకంటే బలమైన నిషేధం లేదా తిరుగులేని అంకితం భావాన్ని మోయగలదు; అందువల్ల ఆ అనిశ్చితిని పాదసూచికలో ఉంచాం.
- issue: సమాజం నుండి వేరుచేయడం యొక్క స్వభావం
  choice: ‘వేరుచేయబడతాడు’
  alternative: ‘బహిష్కరించబడతాడు’
  rationale: మూలపాఠం ప్రవాసుల సభ నుండి వేరుచేయడాన్ని మాత్రమే చెబుతుంది; తరువాతి మతసంస్థలకు చెందిన ‘మతబహిష్కరణ’ వంటి ప్రత్యేక భావాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. ‘ప్రవాసుల సభ’ చారిత్రక సమూహాన్ని సూచిస్తుంది; తరువాతి సంఘపరమైన పదజాలాన్ని నివారించింది.
