source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֖י זַתּ֑וּא אֶלְיוֹעֵנַ֤י אֶלְיָשִׁיב֙ מַתַּנְיָ֣ה וִֽ/ירֵמ֔וֹת וְ/זָבָ֖ד וַ/עֲזִיזָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: te
  text: 'మరియు జత్తూ వంశస్థులలో: ఎల్యోయేనై, ఎల్యాషీబు, మత్తన్యా, యెరేమోతు, జాబాదు, మరియు అజీజా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: వంశస్థులలో
  rationale: జాబితా సందర్భంలో בְּנֵי అనే పదం ప్రత్యక్ష కుమారులనే కాక వంశానికి లేదా కుటుంబానికి చెందినవారిని కూడా సూచించగలదు. సహజమైన ఆధునిక తెలుగులో ఈ విస్తృత భావాన్ని ‘వంశస్థులు’ స్పష్టంగా తెలియజేస్తుంది; מִן‌కు ‘లో’ సరిపోతుంది. వావ్ ముందరి జాబితాను కొనసాగిస్తున్నా, ఒక్క వచనంగా చదివినప్పుడు తెలుగులో ప్రత్యేక ‘మరియు’ అవసరం లేదు.
- source_word: זַתּוּא
  choice: జత్తూ
  rationale: హీబ్రూ వ్యక్తి/కుటుంబ నామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: אֶלְיוֹעֵנַי
  choice: ఎల్యోయేనై
  rationale: హీబ్రూ నామంలోని ధ్వనులను సాధ్యమైనంత సమీపంగా తెలుగులో ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: אֶלְיָשִׁיב
  choice: ఎల్యాషీబు
  rationale: హీబ్రూ నామానికి ధ్వన్యనుసారమైన తెలుగు రూపం; చివరి వ్యంజనాన్ని సహజంగా పలకడానికి ‘ు’ చేర్చాం.
- source_word: מַתַּנְיָה
  choice: మత్తన్యా
  rationale: ద్విత్వ త్ మరియు చివరి యాహ్-సంబంధ రూపాన్ని ప్రతిబింబించే సంక్షిప్త తెలుగు లిప్యంతరీకరణ.
- source_word: וִֽ/ירֵמ֔וֹת
  choice: యెరేమోతు
  rationale: పేరును హీబ్రూ పాఠానికి దగ్గరగా లిప్యంతరీకరించాం; వావ్‌ను తెలుగు జాబితా విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: וְ/זָבָד
  choice: జాబాదు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వన్యనుసారంగా ఇచ్చాం; సంయోజక వావ్ జాబితా నిర్మాణంలో అంతర్భూతమైంది.
- source_word: וַ/עֲזִיזָא
  choice: అజీజా
  rationale: హీబ్రూ పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; చివరి అంశానికి ముందు పునరుక్త సంయోజకాన్ని పెట్టకుండా తెలుగు జాబితా శైలిని అనుసరించాం.
