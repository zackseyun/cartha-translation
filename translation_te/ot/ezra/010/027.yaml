translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. పేర్లు మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
