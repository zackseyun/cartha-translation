source:
  edition: WLC
  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: te
  text: మన నాయకులు సమాజమంతటి తరఫున నిలవనివ్వండి; మన పట్టణాల్లో అన్యజాతి స్త్రీలను భార్యలుగా ఇంటికి తెచ్చుకున్న[a] ప్రతి ఒక్కరూ నిర్ణయించిన సమయాల్లో రావాలి. వారితోపాటు ఒక్కొక్క పట్టణపు పెద్దలు, దాని న్యాయాధిపతులు కూడా రావాలి; ఈ విషయానికి సంబంధించి మన దేవుని మండే కోపం మనమీద నుండి తొలగిపోయే వరకు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్యజాతి స్త్రీలను పెళ్లి చేసుకున్న.’ హీబ్రూ నుడికారం అక్షరార్థంగా అన్యజాతి స్త్రీలను ‘నివసింపజేసిన’ లేదా ‘ఇంట్లో స్థిరపరచిన’ అని ఉంటుంది; ఇక్కడ వారిని భార్యలుగా కుటుంబంలోకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో చివరి ‘ఈ విషయం వరకు’ అనే పదబంధాన్ని, ‘ఈ విషయం పరిష్కారమయ్యే వరకు’ అనే అదనపు కాలపరమైన భావంతో కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: దయచేసి ... నిలబడాలి
  rationale: నָא కలిసిన ఈ రూపం కేవలం భవిష్యత్తును కాక మర్యాదపూర్వక ప్రతిపాదనను సూచిస్తుంది. ‘దయచేసి’ ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שָׂרֵינוּ
  choice: మన నాయకులు
  rationale: ఈ సందర్భంలో పరిపాలనా బాధ్యతగలవారిని సూచిస్తుంది; ‘అధిపతులు’ లేదా ‘రాజకుమారులు’ కంటే ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְכָל הַקָּהָל
  choice: సమాజమంతటి తరఫున
  rationale: నాయకులు మొత్తం సమాజానికి ప్రతినిధులుగా వ్యవహరించాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: అన్యజాతి స్త్రీలను భార్యలుగా ఇంటికి తెచ్చుకున్న
  rationale: హీబ్రూ ప్రయోగం అక్షరార్థంగా వారిని నివసింపజేయడాన్ని సూచించినా, సందర్భంలో వారిని భార్యలుగా కుటుంబంలోకి తీసుకోవడమే ఉద్దేశం. ఈ అనువాదం వివాహ సందర్భాన్నీ, ఇంటిలో చేర్చుకున్న భావాన్నీ నిలుపుతుంది.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: నిర్ణయించిన సమయాల్లో
  rationale: విచారణ కోసం అధికారికంగా కేటాయించిన సందర్భాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: వారితోపాటు ఒక్కొక్క పట్టణపు పెద్దలు, దాని న్యాయాధిపతులు
  rationale: עִיר וָעִיר యొక్క విభజనాత్మక భావాన్ని ‘ఒక్కొక్క పట్టణపు’గా, ప్రత్యయ సంబంధాన్ని ‘దాని న్యాయాధిపతులు’గా స్పష్టంగా ఉంచుతుంది.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: మన దేవుని మండే కోపం
  rationale: హీబ్రూలోని తీవ్రతనూ ‘మండే’ అనే రూపకాన్నీ తగ్గించకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִמֶּנּוּ
  choice: మనమీద నుంచి
  rationale: సమాజమంతటినీ సూచించే బహువచన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: ఈ విషయం కారణంగా ... వరకు
  rationale: చివరి హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి దాని సంబంధం కొంత అస్పష్టంగా ఉంది. ప్రధాన పాఠం దానిని దేవుని కోపానికి కారణమైన విషయంగా తీసుకుంటుంది; కాలపరమైన సాధ్యతను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కోపాన్ని సూచించే భాషను మృదువుచేయాలా
  choice: మన దేవుని మండే కోపం
  alternative: మన దేవుని ఉగ్రకోపం
  rationale: మూలపాఠం దేవుని తీవ్ర కోపాన్ని స్పష్టంగా చెబుతుంది. ‘మండే కోపం’ హీబ్రూ రూపకాన్ని నిలుపుతుంది; దానిపై అదనపు సిద్ధాంత వివరణను రుద్దదు.
- issue: చివరి עַד לַדָּבָר הַזֶּה పదబంధం సంబంధం
  choice: ఈ విషయం కారణంగా
  alternative: ఈ విషయం పరిష్కారమయ్యే వరకు
  rationale: ఈ పదబంధం కోపానికి సంబంధించిన విషయాన్ని సూచించవచ్చు; అదే సమయంలో దాన్ని మరో కాలపరమైన ‘వరకు’గా గ్రహించే అవకాశం ఉంది. ప్రధాన పాఠంలో సందర్భానుకూల పఠనాన్ని ఇచ్చి, నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పరిపాలనా సందర్భాన్ని స్పష్టంగా ఉంచుతూ, ‘అన్యజాతి,’ ‘పెద్దలు,’ ‘న్యాయాధిపతులు’ వంటి సందర్భోచిత పదాలను ఎంచుకున్నాం. మూలంలోని ప్రతిపాదనా స్వరాన్ని ‘దయచేసి’తో, దైవిక కోపపు తీవ్రతను ‘మండే కోపం’తో నిలిపాం.
