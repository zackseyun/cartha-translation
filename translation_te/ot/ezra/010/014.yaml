revisions:
- from: దయచేసి మన నాయకులు సమాజమంతటి తరఫున నిలబడాలి. మన పట్టణాల్లో అన్యజాతి స్త్రీలను భార్యలుగా ఇంటికి తెచ్చుకున్న[a] ప్రతి ఒక్కరూ నిర్ణయించిన సమయాల్లో రావాలి; వారితోపాటు ఒక్కొక్క పట్టణపు పెద్దలు, దాని న్యాయాధిపతులు కూడా రావాలి. ఈ విషయం కారణంగా మన దేవుని మండే కోపం మనమీద నుంచి తొలగిపోయే వరకు ఇలా జరగాలి.[b]
  to: మన నాయకులు సమాజమంతటి తరఫున నిలవనివ్వండి; మన పట్టణాల్లో అన్యజాతి స్త్రీలను భార్యలుగా ఇంటికి తెచ్చుకున్న[a] ప్రతి ఒక్కరూ నిర్ణయించిన సమయాల్లో రావాలి. వారితోపాటు ఒక్కొక్క పట్టణపు పెద్దలు, దాని న్యాయాధిపతులు కూడా రావాలి; ఈ విషయానికి సంబంధించి మన దేవుని మండే కోపం మనమీద నుండి తొలగిపోయే వరకు.[b]
  rationale: మూలంలోని ప్రతిపాదనా స్వరాన్ని, స్థానిక పెద్దలు మరియు న్యాయాధిపతుల భాగస్వామ్యాన్ని, అలాగే దేవుని తీవ్రమైన కోపం తొలగిపోవాలనే ఉద్దేశాన్ని నిలిపాం. చివరి పదబంధానికి కారణార్థాన్ని రుద్దకుండా ‘ఈ విషయానికి సంబంధించి’ అని అనువదించాం; నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో ఉంచాం. మూలంలో లేని ‘ఇలా జరగాలి’ను తొలగించాం.
