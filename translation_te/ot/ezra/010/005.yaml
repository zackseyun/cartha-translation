  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֡א וַ/יַּשְׁבַּ֣ע אֶת שָׂרֵי֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם וְ/כָל יִשְׂרָאֵ֗ל לַ/עֲשׂ֛וֹת כַּ/דָּבָ֥ר הַ/זֶּ֖ה וַ/יִּשָּׁבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: te
  text: అప్పుడు ఎజ్రా లేచి, యాజకుల నాయకులతోను, లేవీయులతోను, ఇశ్రాయేలీయులందరితోను ఈ మాట[a] ప్రకారం చేయాలని ప్రమాణం చేయించాడు; వారు ప్రమాణం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయం ప్రకారం” లేదా “ఈ ప్రతిపాదన ప్రకారం.” హీబ్రూ పదం పలికిన మాటను గానీ, చర్చలో ఉన్న విషయాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום క్రియ యొక్క కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; చర్యకు సిద్ధపడటాన్ని సూచిస్తుంది.
- source_word: וַיַּשְׁבַּע
  choice: ప్రమాణం చేయించాడు
  rationale: 'שׁבע హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది: ఎజ్రా వారిచేత ప్రమాణం చేయించాడు.'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: యాజకుల నాయకులు
  rationale: శబ్దబంధం యాజకులలోని ప్రధాన నాయకులను సూచిస్తుంది. 'యాజకుల నాయకులు' మూలంలోని సంబంధాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక పదవిని అనవసరంగా సూచించదు.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, ఆలయసేవకు సంబంధించిన సమూహానికి ప్రామాణిక తెలుగు రూపం.
- source_word: וְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరు
  rationale: సామూహికమైన 'ఇశ్రాయేలు అంతా' అనే భావాన్ని సహజమైన తెలుగు వ్యక్తివాచక బహువచనంతో తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: చేయాలని
  rationale: עשה యొక్క విస్తృతమైన 'చేయు/అమలు చేయు' భావాన్ని సందర్భానుకూలంగా, ప్రమాణం చేయించు అనే క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: כַּדָּבָר הַזֶּה
  choice: ఈ మాట ప్రకారం
  rationale: דָּבָר లోని 'మాట' అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; సందర్భంలో అది ముందుగా చెప్పబడిన విషయం లేదా ప్రతిపాదనను కూడా సూచించగలదనే సందిగ్ధతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: וַיִּשָּׁבֵעוּ
  choice: వారు ప్రమాణం చేశారు
  rationale: నిఫాల్ రూపంలోని ఫలితాన్ని సూటిగా తెలుపుతూ, హీబ్రూ వాక్యంలోని గంభీరమైన పునరుక్తిని నిలుపుతుంది.
