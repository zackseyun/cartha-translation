base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: te
  text: 'నెబో వంశస్థులలో: యెయీయేలు, మత్తిత్యా, జాబాదు, జెబీనా, యద్దయి[a], యోవేలు, బెనాయా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడున్న హీబ్రూ పేరురూపం అనిశ్చితంగా ఉంది; దీనిని ఇద్దో లేదా యేదో అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי נְבוֹ
  choice: నెబో వంశస్థులలో
  rationale: מִן ఉపసర్గతో కూడిన בְּנֵי పెద్ద జాబితాలోని ఒక వంశ సమూహాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘వంశస్థులలో’ అనేది జాబితా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְעִיאֵל
  choice: యెయీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా తెలుగు లిపిలో అందించాం.
- source_word: מַתִּתְיָה
  choice: మత్తిత్యా
  rationale: హీబ్రూ వ్యక్తినామపు రూపాన్ని సాధ్యమైనంతగా నిలిపే లిప్యంతరీకరణ.
- source_word: זָבָד
  choice: జాబాదు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ధ్వన్యనుకూల లిప్యంతరీకరణ.
- source_word: זְבִינָא
  choice: జెబీనా
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: ידו
  choice: యద్దయి
  rationale: వ్యంజన పాఠం క్లిష్టమైనది; మసొరేటిక్ సంప్రదాయాన్ని అనుసరించే సాధ్యమైన పేరురూపాన్ని ప్రధాన పాఠంలో ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: וְ/יוֹאֵל
  choice: యోవేలు
  rationale: וְ సంధికారకాన్ని తెలుగు జాబితా విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తం చేసి, పేరును లిప్యంతరీకరించాం.
- source_word: בְּנָיָה
  choice: బెనాయా
  rationale: హీబ్రూ వ్యక్తినామపు ధ్వనిరూపాన్ని నిలిపే తెలుగు లిప్యంతరీకరణ.
