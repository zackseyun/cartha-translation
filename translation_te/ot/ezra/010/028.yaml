  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: te
  text: 'మరియు బేబయి కుమారులలో[a]: యెహోహానాను[b], హనన్యా, జబ్బయి, అత్లయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘కుమారులు’ అనే మాట ఇక్కడ బేబయి కుటుంబ వంశానికి చెందినవారిని లేదా అతని సంతతివారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యెహోహానాను’ అనే పేరును కొన్ని అనువాదాల్లో సంక్షిప్తంగా ‘యోహానాను’ అని రాస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: మరియు … కుమారులలో
  rationale: సంయోజక అవ్యయం, ‘నుండి/లోనుండి’ అనే విభక్త్యర్థం, ‘కుమారులు’ అనే బహువచన నిర్మాణం—ఈ మూడింటినీ జాబితా సందర్భానికి సహజమైన తెలుగులో నిలుపుతుంది. ఇక్కడ ‘కుమారులు’ కుటుంబ వంశానికి చెందినవారినీ సూచించవచ్చు.
- source_word: בֵּבָי
  choice: బేబయి
  rationale: హీబ్రూ వ్యక్తి/కుటుంబ నామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יְהוֹחָנָן
  choice: యెహోహానాను
  rationale: దైవనామ సంబంధిత ఆరంభ భాగంతో సహా హీబ్రూ పేరులోని పూర్తి రూపాన్ని ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: חֲנַנְיָה
  choice: హనన్యా
  rationale: హీబ్రూ పేరుకు సమీపంగా, తెలుగులో సహజంగా పలికే రూపం.
- source_word: זַבַּי
  choice: జబ్బయి
  rationale: మధ్య వ్యంజన ద్విత్వాన్ని, చివరి ద్విస్వర ధ్వనిని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: עַתְלָי
  choice: అత్లయి
  rationale: హీబ్రూ పేరులోని వ్యంజన క్రమాన్ని వీలైనంత దగ్గరగా నిలిపే తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశపారంపర్య జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. మూలంలోని ‘కుమారులు’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని విస్తృత కుటుంబార్థాన్ని పాదటిప్పణిలో తెలిపాం. సంప్రదింపుల ఆంగ్ల పాఠ్యంలో పాదటిప్పణి సూచికల స్థానాలు విషయాలతో సరిపోలకపోవడంతో, [a]ను ‘కుమారులలో’ వద్ద, [b]ను ‘యెహోహానాను’ వద్ద మూలార్థానుసారం ఉంచాం.
