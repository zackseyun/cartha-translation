translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పరిపాలనా సందర్భానికి తగినట్లుగా ‘ప్రకటన చేయించారు’ ఎంచుకోబడింది; హెబ్రీ నుడికారంలోని అక్షరార్థం పాదటిప్పణిలో భద్రపరచబడింది.
