  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲבִ֨ירוּ ק֜וֹל בִּ/יהוּדָ֣ה וִ/ירֽוּשָׁלִַ֗ם לְ/כֹל֙ בְּנֵ֣י הַ/גּוֹלָ֔ה לְ/הִקָּבֵ֖ץ יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: te
  text: యూదా, యెరూషలేము అంతటా చెరనుండి వచ్చిన వారందరికీ[a] యెరూషలేములో సమావేశం కావాలని వారు ప్రకటన చేయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘చెర కుమారులందరికీ.’ దీన్ని ‘చెరలో ఉన్నవారందరికీ’ లేదా ‘చెరనుండి తిరిగివచ్చిన వారందరికీ’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: ప్రకటన చేయించారు
  rationale: עבר హిఫీల్ రూపం קוֹלతో కలిసి ఒక ప్రకటనను విస్తృతంగా తెలియజేయించడం అనే నుడికారార్థాన్ని ఇస్తుంది. ‘ప్రకటన చేయించారు’ అనేది దాని అధికారిక, కారక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  choice: యూదా, యెరూషలేము అంతటా
  rationale: ב ఇక్కడ ప్రకటన వ్యాపించిన ప్రాంతాన్ని సూచిస్తుంది; ‘అంతటా’ దాని విస్తరణ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: చెరలోనుండి తిరిగివచ్చిన వారందరూ
  rationale: అక్షరార్థంగా ‘చెర యొక్క కుమారులందరూ.’ సందర్భంలో ఇది చెరకు వెళ్లి తిరిగివచ్చిన సమాజాన్ని సూచించే నుడికారం. తెలుగులో ‘వారందరూ’ సహజంగా సమాజమంతటినీ సూచిస్తుంది; ‘తిరిగివచ్చిన’ అనేది ఎజ్రా సందర్భంలోని ఉద్దేశిత సమూహాన్ని స్పష్టం చేస్తుంది.
- source_word: לְהִקָּבֵץ
  choice: సమావేశం కావాలని
  rationale: నిఫాల్ క్రియారూపం కూడివచ్చి ఒకచోట చేరడాన్ని సూచిస్తుంది; לְ ప్రకటనలోని ఆదేశం లేదా ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: יְרוּשָׁלָם
  choice: యెరూషలేములో
  rationale: సమావేశం జరిగే స్థలాన్ని తెలుగులో సహజంగా స్థలవిభక్తితో వ్యక్తం చేశాం.
