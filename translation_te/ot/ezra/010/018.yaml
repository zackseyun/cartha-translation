source:
  edition: WLC
  text: וַ/יִּמָּצֵא֙ מִ/בְּנֵ֣י הַ/כֹּהֲנִ֔ים אֲשֶׁ֥ר הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת מִ/בְּנֵ֨י יֵשׁ֤וּעַ בֶּן יֽוֹצָדָק֙ וְ/אֶחָ֔י/ו מַֽעֲשֵׂיָה֙ וֶֽ/אֱלִיעֶ֔זֶר וְ/יָרִ֖יב וּ/גְדַלְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: te
  text: 'యాజకుల కుమారుల్లో విదేశీ స్త్రీలను భార్యలుగా చేసుకున్నవారు కనుగొనబడ్డారు: యోత్సాదాకు కుమారుడైన యేషూవా కుమారులలోను అతని సహోదరులలోను మయశేయా, ఎలీయెజెరు, యారీబు, గెదల్యా ఉన్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విదేశీ స్త్రీలను పెళ్లి చేసుకున్నవారు.’
    reason: హీబ్రూ ప్రయోగం విదేశీ స్త్రీలతో వివాహ సంబంధం చేసుకోవడాన్ని సూచిస్తుంది; ఈ ప్రత్యామ్నాయం అదే భావాన్ని ప్రత్యక్షమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: కనిపించారు
  rationale: హీబ్రూ క్రియ వ్యాకరణరీత్యా ఏకవచనంలో ఉన్నా, తరువాత పలువురి జాబితాను పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో బహువచనమైన ‘కనిపించారు’ సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: యాజకుల కుమారుల్లో
  rationale: ‘కుమారులు’ అనే వంశసంబంధ పదాన్ని నిలుపుతూ, מִן సూచించే సమూహంలోని సభ్యత్వాన్ని ‘లో’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: విదేశీ స్త్రీలను భార్యలుగా చేసుకున్నవారు
  rationale: ఈ సందర్భంలో పదబంధం వివాహ సంబంధాన్ని సూచిస్తుంది. ‘భార్యలుగా చేసుకున్నారు’ హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని ‘స్త్రీలు’ అనే పదరూపాన్నీ కనిపించేలా ఉంచుతుంది.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: విదేశీ స్త్రీలు
  rationale: మూలానికి దగ్గరగా ‘విదేశీ స్త్రీలు’ అని అనువదించి, వాక్యంలోని ‘భార్యలుగా చేసుకున్న’ అనే మాటతో వివాహ సందర్భాన్ని స్పష్టం చేసింది.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: యోజాదాకు కుమారుడైన యేషూవ కుమారుల నుండీ
  rationale: రెండవ מִבְּנֵי పదాన్ని ‘కుమారుల నుండి’గా నిలిపి వంశావళి నిర్మాణాన్ని సంరక్షించింది. పేర్లు తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: וְאֶחָיו
  choice: అతని సహోదరుల నుండీ
  rationale: సర్వనామ ప్రత్యయం యేషూవను సూచిస్తుంది. ‘సహోదరులు’ ప్రత్యక్ష అర్థాన్ని ఇస్తుంది; ముందున్న מִן ప్రభావం సమన్వయ నిర్మాణంలో దీనికీ వర్తించేలా ‘నుండీ’ చేర్చబడింది.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: మయశేయా, ఎలీయెజెరు, యారీబు, గెదల్యా
  rationale: వ్యక్తి పేర్లు అనువదించకుండా, హీబ్రూ రూపాలకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించబడ్డాయి.
