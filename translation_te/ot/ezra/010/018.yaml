  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వంశావళి భాషలోని ‘కుమారులు’, ‘సహోదరులు’ నిలుపబడ్డాయి; జాబితా స్పష్టత కోసం వాక్యం రెండుగా విభజించబడింది.
