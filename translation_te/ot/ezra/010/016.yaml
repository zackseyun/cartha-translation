  terminology: ‘యాజకుడైన ఎజ్రా,’ ‘పితృవంశాల పెద్దలైన పురుషులు,’ ‘పేరుపేరునా,’ మరియు ‘విచారించడానికి’ మూలపాఠంలోని పదజాలం, సామాజిక పదవులు, విచారణార్థక భావాన్ని తగిన విధంగా నిలుపుతాయి. ‘చెరనుంచి తిరిగివచ్చినవారు’కు అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
