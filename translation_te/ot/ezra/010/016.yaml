  source_fidelity: వాక్యంలోని וַיִּבָּדְלוּ క్రియ బహువచనంలో ఉంది. అది ఎజ్రాను మాత్రమే ‘పురుషులను ప్రత్యేకించినవాడు’గా చేయదు; ఎజ్రా మరియు పేరుపేరునా పేర్కొనబడిన పితృవంశాల పెద్దలు విచారణకు ప్రత్యేకంగా నియమించబడ్డారనే భావాన్ని ఇస్తుంది. ముసాయిదాలోని ఏకవచన క్రియ ‘ప్రత్యేకించాడు’ ఈ వ్యాకరణ సంబంధాన్ని మార్చింది.
