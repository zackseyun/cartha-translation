source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֮ בְּנֵ֣י הַ/גּוֹלָה֒ וַ/יִּבָּדְלוּ֩ עֶזְרָ֨א הַ/כֹּהֵ֜ן אֲנָשִׁ֨ים רָאשֵׁ֧י הָ/אָב֛וֹת לְ/בֵ֥ית אֲבֹתָ֖/ם וְ/כֻלָּ֣/ם בְּ/שֵׁמ֑וֹת וַ/יֵּשְׁב֗וּ בְּ/י֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י לְ/דַרְי֖וֹשׁ הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: te
  text: కాబట్టి చెరనుంచి తిరిగివచ్చినవారు అలాగే చేశారు.[a] యాజకుడైన ఎజ్రా, తమ తమ పితృవంశాల ప్రకారం పితృవంశాల పెద్దలైన పురుషులు—వారందరూ పేరుపేరునా—ప్రత్యేకంగా నియమించబడ్డారు.[b][c] వారు ఆ విషయాన్ని విచారించడానికి పదో నెల మొదటి రోజున కూర్చున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చెర యొక్క కుమారులు”; ఇది చెరనుంచి తిరిగివచ్చిన సమాజానికి సమష్టి పేరు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు “వేరుపరచబడ్డారు” లేదా “వేరుగా నియమించబడ్డారు” అనే అర్థాలూ ఉండవచ్చు; సందర్భంలో విచారణ కోసం ఎజ్రాను మరియు ప్రతినిధులను ప్రత్యేకంగా నియమించడం సూచితమవుతోంది.
    reason: alternative_reading
  - marker: c
    text: “పితృవంశాల పెద్దలు” అనేది వంశం లేదా విస్తృత కుటుంబ సమూహాల నాయకులను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: చెరనుంచి తిరిగివచ్చినవారు
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘చెర యొక్క కుమారులు’; సందర్భంలో ఇది చెరనుంచి తిరిగివచ్చిన సమాజానికి సమష్టి సూచన. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: וַיִּבָּדְלוּ
  choice: ప్రత్యేకించాడు
  rationale: בדל నిఫాల్ రూపం వేరుచేయడం లేదా ప్రత్యేకించడం అనే భావాన్ని కలిగి ఉంది. వాక్య నిర్మాణంలో ఎజ్రా పురుషులను విచారణ కోసం ప్రత్యేకించినట్లు గ్రహించి, మూలంలోని separation భావాన్ని నిలిపింది; క్రియారూపంలోని సాధ్యమైన అస్పష్టతను పాదటిప్పణిలో తెలిపింది.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: యాజకుడైన ఎజ్రా
  rationale: ఈ వచనంలో ఉన్న ‘యాజకుడు’ అనే బిరుదును మాత్రమే అనువదించింది; సమీప సందర్భం నుంచి ‘శాస్త్రి’ని చేర్చలేదు.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలైన పురుషులు
  rationale: אֲנָשִׁים అనే స్పష్టమైన పురుష సూచనను, רָאשֵׁי הָאָבוֹת అనే వంశ/కుటుంబ నాయకత్వ సామాజిక విభాగాన్ని రెండింటినీ నిలిపింది.
- source_word: לְבֵית אֲבֹתָם
  choice: తమ తమ పితృవంశాల ప్రకారం
  rationale: ఎంపికైనవారి వర్గీకరణ పితృసంబంధ వంశగృహాల ప్రకారం జరిగిందనే భావాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: వారందరినీ పేరుపేరునా
  rationale: ప్రతి వ్యక్తి పేరుతో గుర్తించబడ్డాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ
  choice: కూర్చున్నారు
  rationale: ישב యొక్క అక్షరార్థ చిత్రాన్ని నిలిపింది; ఈ పరిపాలనా సందర్భంలో విచారణ కోసం సమావేశమై కూర్చోవడం సూచితమవుతుంది.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: పదో నెల మొదటి రోజున
  rationale: ‘నెలలో ఒకటో రోజు’ అనే హీబ్రూ తేదీ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: ఆ విషయాన్ని విచారించడానికి
  rationale: דרש ఇక్కడ వెదకడం, విచారణ చేయడం అనే పరిపాలనా భావంలో ఉంది; ‘విచారించడానికి’ సందర్భానుకూలంగా స్పష్టంగా ఉంది.
