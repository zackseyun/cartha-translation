  text: 'And from the sons of Immer: Hanani and Zebadiah.'
translation:
  language: te
  text: 'మరియు ఇమ్మేరు కుమారులలో: హనానీ మరియు జెబద్యా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారుల్లో
  rationale: מִן‌తో కూడిన בְּנֵי ఈ జాబితాలో ఒక కుటుంబ వర్గానికి చెందినవారిని పరిచయం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘కుమారుల్లో’ అని ఇవ్వడం జాబితా నిర్మాణాన్నీ వంశ సంబంధాన్నీ నిలుపుతుంది.
- source_word: אִמֵּר
  choice: ఇమ్మేరు
  rationale: యాజక కుటుంబానికి చెందిన పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֲנָנִי
  choice: హనానీ
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וּ/זְבַדְיָה
  choice: జెబద్యా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; పేర్ల జాబితాలోని సంధానార్థం తెలుగులో విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశ/కుటుంబ జాబితా శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా రూపొందించబడింది. ముందు వచనాల కొనసాగింపును సూచించే హీబ్రూ וּ భావం ఈ విడి వచనంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా జాబితా నిర్మాణంలోనే ప్రతిఫలించింది.
