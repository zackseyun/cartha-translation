lexical_decisions:
- source_word: וּ/בָנִי
  choice: బానీ
  rationale: జాబితా కొనసాగింపును సూచించే וּను తెలుగులో ప్రతి పేరుకు ముందు విడిగా ‘మరియు’ అని పెట్టకుండా, సహజమైన జాబితా విరామచిహ్నంతో వ్యక్తం చేశాం; బָנִי అనే వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּ/בִנּוּי
  choice: బిన్నూయి
  rationale: וּ సూచించే జాబితా అనుసంధానం విరామచిహ్నంలో ప్రతిఫలిస్తుంది; בִנּוּי అనే వ్యక్తి పేరును దాని హీబ్రూ రూపానికి దగ్గరగా ‘బిన్నూయి’గా లిప్యంతరీకరించాం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: שִׁמְעִי వ్యక్తి పేరు; దానిని ఆంగ్ల సంప్రదాయ రూపం ద్వారా కాకుండా హీబ్రూ ఉచ్చారణ ఆధారంగా ‘షిమీ’గా లిప్యంతరీకరించాం.
