  to: అయితే ప్రజలు చాలామంది ఉన్నారు; ఇది వర్షాల సమయం, బయట నిలబడే శక్తి లేదు. ఈ పని ఒకటి రెండు రోజుల్లో పూర్తయ్యేది కాదు[a], ఎందుకంటే ఈ విషయంలో మనం ఎంతో అతిక్రమించాము[b].
