id: EZR.10.13
reference: Ezra 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: te
  text: అయితే ప్రజలు చాలామంది ఉన్నారు; ఇది వర్షాల సమయం, బయట నిలబడే శక్తి లేదు. ఈ పని ఒకటి రెండు రోజుల్లో పూర్తయ్యేది కాదు[a], ఎందుకంటే ఈ విషయంలో మనం ఎంతో అతిక్రమించాము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పని ఒకటి రెండు రోజుల పని కాదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ విషయంలో మనం ఎంతో పాపం చేశాము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: అయితే
  rationale: మునుపటి వచనంలోని ప్రతిపాదనకు అభ్యంతరాన్ని సూచించే సహజమైన తెలుగు సంధానపదం.
- source_word: הָעָם רָב
  choice: ప్రజలు చాలామంది ఉన్నారు
  rationale: సమకూడిన ప్రజల సంఖ్య అధికమనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: ఇది వర్షాకాలం
  rationale: అక్షరార్థమైన ‘ఇది వర్షాల సమయం’ అనే భావానికి సహజమైన తెలుగు రూపం.
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: బయట నిలబడే శక్తి లేదు
  rationale: హీబ్రూ నిరపేక్ష నిర్మాణాన్ని నిలుపుతూ, వర్షంలో బయట ఉండలేని పరిస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהַמְּלָאכָה
  choice: ఈ పని
  rationale: ఇక్కడ పరిశీలించి పరిష్కరించవలసిన కార్యాన్ని సూచిస్తుంది; కేవలం శారీరక శ్రమ అనే భావానికి పరిమితం కాదు.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: ఒకటో రెండో రోజుల్లో ముగిసేది కాదు
  rationale: హీబ్రూ వ్యవధి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, పని త్వరగా పూర్తికాదని స్పష్టం చేస్తుంది.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: ఎందుకంటే ... మనం ఘోరంగా అపరాధం చేశాము
  rationale: רבה యొక్క తీవ్రతను ‘ఘోరంగా’ తెలియజేస్తుంది; פשע లోని తీవ్రమైన అతిక్రమణ భావాన్ని ‘అపరాధం చేశాము’ సహజంగా అందిస్తుంది.
- source_word: בַּדָּבָר הַזֶּה
  choice: ఈ విషయంలో
  rationale: చర్చలో ఉన్న నిర్దిష్ట వ్యవహారాన్ని సూచించే సహజమైన తెలుగు నుడికారం.
theological_decisions:
- issue: לִפְשֹׁעַ సూచించే అపరాధ స్వభావం
  choice: ఘోరంగా అపరాధం చేశాము
  alternative: ఎంతో పాపం చేశాము; తీవ్రంగా తిరుగుబాటు చేశాము
  rationale: వాక్యం తెలిపే తీవ్రమైన ఒడంబడిక అతిక్రమణను నిలుపుతుంది; అయితే దానిని మరింత నిర్దిష్టమైన సిద్ధాంతపరమైన లేదా రాజకీయ తిరుగుబాటు వర్గంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గంభీరంగా రూపొందించబడింది. హీబ్రూ వాక్యంలోని వ్యతిరేకత, వ్యవధి, అపరాధ తీవ్రతలను కాపాడింది.
