source:
  edition: WLC
  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: te
  text: 'అప్పుడు యాజకుడైన ఎజ్రా లేచి వారితో ఇలా అన్నాడు: “మీరు విశ్వాసభంగం చేసి, విదేశీయ స్త్రీలను[a] భార్యలుగా చేసుకున్నారు; ఇశ్రాయేలు అపరాధాన్ని మరింత పెంచారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విదేశీయ భార్యలను.” హీబ్రూలో అక్షరార్థం “విదేశీయ స్త్రీలు”; ఈ సందర్భంలో అది భార్యలుగా తీసుకున్న స్త్రీలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి నిలబడి
  rationale: కום క్రియ ఇక్కడ సభలో ఎజ్రా బహిరంగంగా లేచి మాట్లాడడానికి నిలబడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘లేచి నిలబడి’ సహజంగా ఉండి శారీరక చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఎజ్రాను గుర్తించే బిరుదును సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: מְעַלְתֶּם
  choice: నమ్మకద్రోహంగా ప్రవర్తించి
  rationale: מעל నైతిక తప్పుతో పాటు నిబంధన సంబంధమైన విశ్వాసభంగాన్ని సూచిస్తుంది. ‘నమ్మకద్రోహంగా ప్రవర్తించి’ ఈ రెండు పార్శ్వాలను సాంకేతిక భాష లేకుండా తెలియజేస్తుంది.
- source_word: וַתֹּשִׁיבוּ
  choice: భార్యలుగా చేసుకున్నారు
  rationale: ישב యొక్క హిఫీల్ రూపానికి అక్షరార్థం ‘నివసింపజేయడం’; ఈ సందర్భంలో స్త్రీలను ఇంటిలో భార్యలుగా చేర్చుకోవడాన్ని సూచిస్తుంది. ‘భార్యలుగా చేసుకున్నారు’ వివాహ సందర్భాన్ని స్పష్టం చేస్తూనే మూలంలోని కార్యసూచక భావాన్ని కాపాడుతుంది.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: అన్యజాతి స్త్రీలను
  rationale: పదబంధానికి అక్షరార్థంగా ‘విదేశీ/పరాయి స్త్రీలు.’ చారిత్రక సందర్భంలో వేరే జనసమూహాలకు చెందిన స్త్రీలను సూచించేందుకే ‘అన్యజాతి స్త్రీలు’ ఎంచుకున్నాం; వారి వివాహ పాత్రను ప్రధాన వాక్యంలోని ‘భార్యలుగా’ తెలియజేస్తుంది.
- source_word: לְהוֹסִיף
  choice: మరింత పెంచారు
  rationale: ముందు చెప్పిన చర్య వల్ల కలిగిన అదనపు ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַשְׁמַת
  choice: అపరాధాన్ని
  rationale: ఇక్కడ אַשְׁמָה బలిని కాక దోషస్థితి లేదా అపరాధభారాన్ని సూచిస్తుంది. ‘అపరాధం’ సాధారణ పాఠకులకు సహజంగా ఉండి సామూహిక దోష భావాన్ని అందిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఇక్కడ స్థలం కంటే నిబంధన సమాజమైన ప్రజలను సమష్టిగా సూచించే పేరుగా యథాతథంగా ఉంచబడింది.
theological_decisions:
- issue: సామూహిక నిబంధన అపరాధం
  choice: ఇశ్రాయేలు అపరాధాన్ని మరింత పెంచారు
  alternative: ఇశ్రాయేలుకు ఉన్న అపరాధానికి మరింత చేర్చారు
  rationale: ఈ చర్య వ్యక్తిగత తప్పుగా మాత్రమే కాక మొత్తం ఇశ్రాయేలు సమాజపు అపరాధాన్ని పెంచేదిగా వచనం చిత్రిస్తుంది. ఎంపిక చేసిన రూపం ఆ సామూహిక పార్శ్వాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- issue: స్త్రీల సంబంధాన్ని వ్యక్తపరచడం
  choice: అన్యజాతి స్త్రీలను భార్యలుగా చేసుకున్నారు
  alternative: అన్యజాతి స్త్రీలను నివసింపజేశారు
  rationale: క్రియ అక్షరార్థంగా ‘నివసింపజేశారు’ అయినా, పరిసర సందర్భం వివాహ సంబంధాన్ని సూచిస్తుంది. ‘భార్యలుగా చేసుకున్నారు’ ఆ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అయితే ‘స్త్రీలు’ అనే మూలపదాన్ని ప్రధాన వాక్యంలోనే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘నమ్మకద్రోహం,’ ‘అపరాధం’ అనే పదాలు నిబంధనాత్మక గంభీరతను నిలుపుతాయి; మూలంలో లేని ప్రత్యేక మతశాఖా వ్యాఖ్యానాన్ని చేర్చలేదు.
