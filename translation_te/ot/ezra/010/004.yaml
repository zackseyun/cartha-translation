    rationale: This is not a defensible lexical alternative for קוּם; “కార్యానికి పూనుకో” imports the following exhortation and is substantially more interpretive. The source and English audit trail instead identify the responsibility idiom as the point requiring a note.
  - severity: low
    issue: “లేచి నిలబడు” slightly duplicates the force of the single imperative קוּם.
    rationale: The Hebrew calls Ezra to rise/act, but does not explicitly use two verbs. “లే” is concise, natural modern Telugu and retains the direct imperative.
  - severity: low
    issue: “ఈ విషయం నీ మీద ఉంది” is overly literal in Telugu.
    rationale: Although it reflects the Hebrew metaphor, it is less natural than an explicit responsibility expression. A footnote can retain the more literal formulation.
