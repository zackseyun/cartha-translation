  verdict: revise
  source_fidelity: The main sense is conveyed, including the imperatives, solidarity, and call to act. However, “లేచి నిలబడు” expands the single Hebrew imperative קוּם into two near-synonymous actions, and the footnote’s proposed alternative is not a lexical or idiomatic alternative for that word.
  naturalness: “ఈ విషయం నీ మీద ఉంది” is understandable but sounds like a literal calque in modern standard Telugu. “ఈ విషయపు బాధ్యత నీదే” naturally expresses the Hebrew idiom while preserving its sense of responsibility resting on Ezra.
  terminology: “ధైర్యంగా ఉండు” is an appropriate idiomatic contextual rendering of חֲזַק. “దాన్ని చేయి” appropriately carries the implied object of וַעֲשֵׂה without adding doctrinal interpretation.
  issues:
