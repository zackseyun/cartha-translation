  yaml_path: translation/ot/ezra/010/004.yaml
  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: te
  text: లే; ఈ విషయపు బాధ్యత నీదే[a], మేము నీతో ఉన్నాం. ధైర్యంగా ఉండు, దాన్ని చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయం నీపై ఉంది.” ఈ హీబ్రూ నుడికారం ఈ విషయాన్ని పరిష్కరించే బాధ్యత ఎజ్రాపై ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: లేచి నిలబడు
  rationale: తక్షణ చర్యకు పిలిచే ఏకవచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלֶיךָ הַדָּבָר
  choice: ఈ విషయం నీ మీద ఉంది
  rationale: బాధ్యత ఎజ్రాపై ఉందనే హీబ్రూ నుడికార భావాన్ని ఉంచుతూ, దాని రూపకాన్ని వీలైనంత వరకు కాపాడుతుంది.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: మేము నీతో ఉన్నాం
  rationale: తోడ్పాటు, సంఘీభావం రెండింటినీ సరళంగా వ్యక్తపరుస్తుంది.
- source_word: חֲזַק
  choice: ధైర్యంగా ఉండు
  rationale: ఈ ప్రోత్సాహక సందర్భంలో దృఢంగా, సాహసంగా వ్యవహరించాలనే ఆజ్ఞను సహజమైన తెలుగులో అందిస్తుంది; అక్షరార్థమైన ‘బలంగా ఉండు’ కంటే ఇక్కడ సులభంగా అర్థమవుతుంది.
- source_word: וַעֲשֵׂה
  choice: దాన్ని చేయి
  rationale: సందర్భంలో సూచితమైన ‘ఈ విషయం’ను ‘దాన్ని’తో సహజంగా తిరిగి సూచిస్తూ, కార్యాచరణకు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రత్యక్ష ప్రోత్సాహక శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త ఆజ్ఞల వరుసను నిలిపాం.
