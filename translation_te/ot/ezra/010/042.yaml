  rationale: ఇది వ్యక్తి పేరు. హీబ్రూ ఉచ్చారణను అనుసరిస్తూ, ఆధునిక తెలుగు బైబిలు పేర్ల శైలికి సహజంగా ఉండేలా లిప్యంతరీకరించబడింది.
- source_word: אֲמַרְיָה
  choice: అమర్యా
