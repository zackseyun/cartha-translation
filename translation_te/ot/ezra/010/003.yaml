id: EZR.10.3
reference: Ezra 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, స్త్రీలందరినీ[b], వారికి పుట్టిన వారినందరినీ పంపివేయడానికి మన దేవునితో నిబంధన చేసుకుందాం. నా ప్రభువు[a] మరియు మన దేవుని ఆజ్ఞకు వణికేవారి సలహా ప్రకారం, ధర్మశాస్త్రం ప్రకారం అది జరగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ప్రభువు” అనేది సందర్భంలో బహుశా ఎజ్రాను గౌరవంగా సూచిస్తుంది. హెబ్రీ వ్యంజనరూపాన్ని దైవ బిరుదైన “ప్రభువు”గానూ చదవవచ్చు.
    reason: אדני యొక్క సూచనాత్మక అస్పష్టతను కాపాడటానికి; ప్రధాన పాఠ్యం ఆంగ్ల POB పరిశీలనలో స్వీకరించిన “my lord” పఠనాన్ని అనుసరిస్తుంది.
  - marker: b
    text: ఇక్కడ “స్త్రీలు” అనే హెబ్రీ పదం సందర్భానుసారం “భార్యలు” అని కూడా అర్థమవుతుంది; ఈ అధ్యాయ సందర్భంలో విదేశీ భార్యలు ఉద్దేశించబడ్డారు.
    reason: ప్రధాన పాఠ్యంలో మూలపదం విస్తృతిని నిలుపుతూ సందర్భార్థాన్ని స్పష్టం చేయటానికి.
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: నిబంధన చేసుకుందాం
  rationale: హెబ్రీలో అక్షరార్థంగా ‘నిబంధన కోయడం’; ఆధునిక తెలుగులో సహజమైన నిబంధన ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: לְהוֹצִיא
  choice: పంపివేస్తామని
  rationale: హిఫీల్ రూపంలోని ‘బయటకు పంపడం/వెళ్లగొట్టడం’ భావాన్ని సందర్భానికి తగిన సహజ తెలుగులో తెలిపింది.
- source_word: כָל־נָשִׁים
  choice: స్త్రీలందరినీ
  rationale: נָשִׁים అనే పదం ‘స్త్రీలు’ లేదా సందర్భానుసారం ‘భార్యలు’ అని అర్థమవుతుంది; మూలంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: הַנּוֹלָד מֵהֶם
  choice: వారికి పుట్టినవారందరినీ
  rationale: మూలంలోని సమూహవాచక ఏకవచన నిర్మాణాన్ని లింగనిరపేక్షంగా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֲרֵדִים בְּמִצְוַת אֱלֹהֵינוּ
  choice: మన దేవుని ఆజ్ఞకు వణికేవారు
  rationale: ‘వణుకు/భయభక్తితో స్పందించడం’ అనే חָרֵד భావాన్ని, ఏకవచన ‘ఆజ్ఞ’ను యథాతథంగా ఉంచింది.
- source_word: כַתּוֹרָה
  choice: ధర్మశాస్త్రం ప్రకారం
  rationale: תּוֹרָהకు ఈ సందర్భంలో దేవుని నియమబోధ లేదా ధర్మశాస్త్రం అనే భావం ఉంది; తెలుగు బైబిలు పఠనానికి స్పష్టమైన పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: אֲדֹנָי ఎవరిని సూచిస్తుంది?
  choice: నా ప్రభువు
  alternative: ప్రభువు / యెహోవా
  rationale: సందర్భంలో షెకన్యా ఎజ్రాతో మాట్లాడుతూ అతనిని గౌరవంగా సంబోధిస్తున్నాడనే పఠనం వాక్యనిర్మాణానికి సరిపోతుంది; అయినా మసోరా స్వరచిహ్నాలతో ఉన్న రూపం దైవ బిరుదుగా కూడా చదవబడగలదనే అస్పష్టతను పాదసూచికలో నిలిపాం.
- issue: నָשִׁיםను ‘స్త్రీలు’గా లేదా ‘భార్యలు’గా అనువదించడం
  choice: స్త్రీలు
  alternative: భార్యలు
  rationale: విస్తృత సందర్భం విదేశీ భార్యలను సూచించినప్పటికీ, ఈ వచనంలోని మూలపదం సాధారణంగా ‘స్త్రీలు’ అని కూడా అర్థమవుతుంది. ప్రధాన పాఠ్యంలో మూలరూపాన్ని కాపాడి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘నిబంధన’, ‘ధర్మశాస్త్రం’ వంటి స్థిర బైబిలు పదజాలాన్ని ఉపయోగించి, మూలంలోని ఆజ్ఞ, సలహా, పంపివేత మధ్య సంబంధాన్ని సహజంగా కూర్చాం.
