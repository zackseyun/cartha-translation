revisions:
- from: కాబట్టి ఇప్పుడు, నా ప్రభువు[a], మన దేవుని ఆజ్ఞకు వణికేవారు ఇచ్చే సలహా ప్రకారం స్త్రీలందరినీ[b], వారికి పుట్టినవారందరినీ పంపివేస్తామని మన దేవునితో నిబంధన చేసుకుందాం. ధర్మశాస్త్రం ప్రకారం ఇది జరగాలి.
  to: కాబట్టి ఇప్పుడు, స్త్రీలందరినీ[b], వారికి పుట్టిన వారినందరినీ పంపివేయడానికి మన దేవునితో నిబంధన చేసుకుందాం. నా ప్రభువు[a] మరియు మన దేవుని ఆజ్ఞకు వణికేవారి సలహా ప్రకారం, ధర్మశాస్త్రం ప్రకారం అది జరగాలి.
