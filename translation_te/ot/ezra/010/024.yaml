  yaml_path: translation/ot/ezra/010/024.yaml
  text: 'And from the singers: Eliashib; and from the gatekeepers: Shallum, Telem, and Uri.'
translation:
  language: te
  text: గాయకులలో ఎల్యాషీబు; మరియు ద్వారపాలకులలో షల్లూము, టెలెము, ఊరీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: లో
  rationale: ఈ ఉపసర్గ విస్తృతమైన జాబితాలోని ఒక్కో వర్గానికి చెందిన వ్యక్తులను పరిచయం చేస్తుంది. తెలుగులో ‘లో’ అనేది ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; సెమిటిక్ సంధికారకాన్ని ప్రతి చోట విడిగా అనువదించడం అవసరం లేదు.
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: שׁיר మూలం నుంచి వచ్చిన ఈ రూపం ఆలయ ఆరాధనలో గానం చేసే సేవకులను సూచిస్తుంది. ‘గాయకులు’ ఆధునిక తెలుగులో సహజమైనదీ, తగినంత నిర్దిష్టమైనదీ.
- source_word: אֶלְיָשִׁיב
  choice: ఎల్యాషీబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ ద్వారాలను కాపాడే బాధ్యతగల సేవకులను ఈ పదం సూచిస్తుంది. ‘ద్వారపాలకులు’ గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: שַׁלֻּם
  choice: షల్లూము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: טֶלֶם
  choice: తెలెము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אוּרִי
  choice: ఊరీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. హీబ్రూ వాక్యంలోని రెండు సమాంతర వర్గాలను అర్థవిరామంతో వేరు చేసి, తెలుగు పఠనంలో సహజత్వాన్ని కాపాడాం.
