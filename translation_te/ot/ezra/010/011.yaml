id: EZR.10.11
reference: Ezra 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు మీ పితరుల దేవుడైన యెహోవాను స్తుతించండి[a]; ఆయన చిత్తాన్ని నెరవేర్చండి. దేశ ప్రజల నుండి, అన్య స్త్రీలనుండి[b] మిమ్మల్ని మీరు వేరుచేసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు ఒప్పుకోలు చేయండి.” హీబ్రూ ప్రయోగం ఈ సందర్భంలో స్తుతి లేదా ఒప్పుకోలు అనే భావాల్లో దేనినైనా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “అన్య భార్యలనుండి.” విస్తృత సందర్భం వివాహాల గురించి ఉన్నప్పటికీ, ఇక్కడి హీబ్రూ పాఠం అక్షరార్థంగా “అన్య స్త్రీలు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: స్తుతించండి
  rationale: ఈ హీబ్రూ ప్రయోగం కృతజ్ఞత లేదా స్తుతి చెల్లించడాన్ని, సందర్భానుసారంగా పాపాన్ని ఒప్పుకోవడాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘స్తుతించండి’ను ఉంచి, మరో భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: మూలంలోని పూర్వీకుల సంబంధాన్ని, ఒడంబడిక నేపథ్యాన్ని సంక్షిప్తంగా కాపాడే గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: ఆయన చిత్తాన్ని నెరవేర్చండి
  rationale: ‘ఆయన చిత్తాన్ని చేయండి’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, ఆజ్ఞ యొక్క కార్యరూప బలాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: וְהִבָּדְלוּ
  choice: మిమ్మల్ని మీరు వేరుచేసుకోండి
  rationale: నిఫల్ ఆజ్ఞారూపంలోని ఆత్మనేపద/ప్రతిబింబ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: ఈ దేశంలోని ప్రజలనుండి
  rationale: ‘దేశపు ప్రజలు’ అనే బహువచన సమూహాలను సహజ తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట జాతులను అదనంగా ఊహించదు.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: అన్య స్త్రీలనుండి
  rationale: ఈ వచనంలోని హీబ్రూ పదబంధం అక్షరార్థంగా ‘అన్య స్త్రీలు’ అంటుంది; సందర్భంలో భార్యలు ఉద్దేశించబడిన అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: תודה అనే పదబంధాన్ని స్తుతిగా అనువదించాలా, పాపాంగీకారంగా అనువదించాలా
  choice: స్తుతించండి
  alternative: మీ పాపాన్ని ఒప్పుకోండి
  rationale: పదబంధం రెండు భావాలను మోయగలదు. వెంట వచ్చే విధేయత, వేరుపడటం అనే ఆజ్ఞలు పాపాంగీకార భావానికి బలం ఇస్తున్నా, పదబంధపు సాధారణ స్తుతి/కృతజ్ఞత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి నిజమైన సందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
- issue: הַנָּשִׁים הַנָּכְרִיּוֹת అనేది స్త్రీలా లేక భార్యలా
  choice: అన్య స్త్రీలు
  alternative: అన్య భార్యలు
  rationale: ఈ వచనం స్వయంగా ‘స్త్రీలు’ అంటుంది; విస్తృత సందర్భం వివాహాలను గూర్చి ఉన్నందున ‘భార్యలు’ అనే సందర్భోచిత అర్థాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూలంలోని ఆజ్ఞారూపాలు మరియు వ్యాఖ్యాన సందిగ్ధతలు నిలుపబడ్డాయి.
