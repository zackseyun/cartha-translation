  source_fidelity: ప్రధాన పాఠ్యం హీబ్రూ ఆజ్ఞారూపాలను, దేవుని పేరును, ‘మీ పితరుల దేవుడు,’ ఆయన చిత్తాన్ని చేయడం, అలాగే స్వయంగా వేరుపడడం అనే భావాలను నమ్మకంగా ప్రతిబింబిస్తోంది. అయితే מֵעַמֵּי הָאָרֶץ లోని బహువచన ‘ప్రజల/జనసమూహాల’ భావాన్ని ‘ఈ దేశంలోని ప్రజలు’ కొంత మృదువుగా, ఏకసమూహంగా చేస్తోంది; ‘దేశ ప్రజల’ అనేది మూలానికి మరింత దగ్గరగా ఉంటుంది.
