source:
  edition: WLC
  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: te
  text: 'ఏలాము వంశస్థుల్లో ఒకడైన యెహీయేలు కుమారుడు షెకన్యా ఎజ్రాకు జవాబిస్తూ ఇలా అన్నాడు: “మేము మా దేవునిపట్ల విశ్వాసభంగం చేశాము[a]; దేశంలోని జనసమూహాల నుండి విదేశీ స్త్రీలను వివాహం చేసుకున్నాము[b]. అయినా, ఈ విషయంలో ఇశ్రాయేలుకు ఇప్పుడు ఆశ ఉంది[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా దేవునికి ద్రోహం చేశాము” లేదా “మా దేవునికి వ్యతిరేకంగా అవిశ్వాసంగా ప్రవర్తించాము.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేశంలోని జనసమూహాల నుండి విదేశీ స్త్రీలను భార్యలుగా తీసుకున్నాము.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇది జరిగినప్పటికీ ఇశ్రాయేలుకు ఇప్పుడు ఆశ ఉంది.”
    reason: ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ ప్రయోగాన్ని అర్థం కోల్పోకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִבְּנֵי עֵילָם
  choice: ఏలాము వంశస్థుడైన
  rationale: בני అనే కుటుంబ/వంశ సమూహ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఏలాము ఇక్కడ వ్యక్తి లేదా వంశనామం.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: మేము మా దేవునికి ద్రోహం చేసి
  rationale: מעל సాధారణంగా పాపం చేయడం మాత్రమే కాక, విశ్వాసాన్ని భంగపరచడం లేదా నమ్మకద్రోహం చేయడం అనే బలమైన భావాన్ని కలిగిస్తుంది.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: ఇతర జనాల స్త్రీలను పెళ్లి చేసుకున్నాం
  rationale: క్రియకు అక్షరార్థంగా ‘నివసింపజేశాం’ అనే రూపం ఉన్నా, ఈ సందర్భంలో స్త్రీలను భార్యలుగా స్వీకరించడమే ఉద్దేశం; ‘పెళ్లి చేసుకున్నాం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: ఈ దేశంలోని ఇతర జనాల
  rationale: עמים అనే బహువచనాన్ని ‘జనాలు’గా నిలుపుతూ, הארץ ను సందర్భానుసారంగా ‘ఈ దేశం’గా వ్యక్తం చేస్తుంది.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל־זֹאת
  choice: అయినా, ఈ విషయంలో ఇశ్రాయేలుకు ఇప్పటికీ ఆశ ఉంది
  rationale: ఒప్పుకోలు నుంచి ఆశవైపు వచ్చే మలుపును ‘అయినా’ తెలియజేస్తుంది. עַל־זֹאת లోని సంబంధార్థాన్ని ‘ఈ విషయంలో’గా ఉంచి, ‘ఇది జరిగినప్పటికీ’ అని పూర్తిగా నిర్ణయించలేదు.
theological_decisions:
- issue: מעל లోని దేవునిపట్ల విశ్వాసభంగ భావం
  choice: మా దేవునికి ద్రోహం చేసి
  alternative: మా దేవునికి విరోధంగా పాపం చేసి
  rationale: ఎంచుకున్న పదబంధం ఒడంబడిక లేదా సంబంధ నమ్మకాన్ని భంగపరచిన తీవ్రతను నిలుపుతుంది; అయితే ప్రత్యేక మతసిద్ధాంత పదజాలాన్ని చేర్చదు.
- issue: נָשִׁים נָכְרִיּוֹת అనే సామాజిక-జాతి సూచన
  choice: ఇతర జనాల స్త్రీలు
  alternative: విదేశీ స్త్రీలు / అన్య స్త్రీలు
  rationale: తదుపరి מֵעַמֵּי הָאָרֶץ తో ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచుతుంది. ‘అన్య’ అనే పదానికి ఆధునిక తెలుగులో కలగగల మతపరమైన అదనపు భావాన్ని నివారిస్తుంది.
- issue: עַל־זֹאת యొక్క సంబంధ లేదా concessive భావం
  choice: ఈ విషయంలో
  alternative: ఇది జరిగినప్పటికీ
  rationale: హీబ్రూ ఉపసర్గ ఇక్కడ ‘దీని గురించి/ఈ విషయంలో’ లేదా సందర్భానుసారంగా ‘ఇది ఉన్నప్పటికీ’ అనే భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠం తక్కువ వివరణాత్మకమైన సంబంధార్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటీకలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. హీబ్రూ ద్వంద్వ వాక్యసూత్రాన్ని తెలుగులో సహజీకరించగా, విశ్వాసభంగం, వివాహం, ఆశకు సంబంధించిన మూలపాఠ్య భావభేదాలను పాదటీకల్లో నిలుపుకున్నాం.
