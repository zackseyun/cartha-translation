source:
  edition: WLC
  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: te
  text: అసాహేలు కుమారుడైన యోనాతాను, తిక్వా కుమారుడైన యహ్జెయా[a] మాత్రమే దీనికి వ్యతిరేకంగా నిలిచారు.[b] మెషుల్లాము, లేవీయుడైన షబ్బెతై వారికి సహాయపడ్డారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహజ్యా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ విషయం మీద తమ స్థానం తీసుకున్నారు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారికి మద్దతిచ్చారు” లేదా “వారికి తోడ్పడ్డారు.” ఇక్కడ “వారికి” అనేది యోనాతాను, యహ్జెయాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే ... మాత్రమే
  rationale: సందర్భంలో విస్తృత సమ్మతికి మినహాయింపును సూచించే నిర్బంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: అసాహేలు కుమారుడు యోనాతాను
  rationale: తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా పేర్లను లిప్యంతరీకరించి, בֶּן‌ను సహజమైన వంశసూచక నిర్మాణంతో అనువదించింది.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: తిక్వా కుమారుడు యహ్జెయా
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న రూపాన్ని దగ్గరగా ప్రతిబింబించే లిప్యంతరీకరణను ఎంచుకుంది; మరో ప్రాచుర్యమైన రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: עָמְדוּ עַל זֹאת
  choice: దీనికి వ్యతిరేకంగా నిలిచారు
  rationale: మూలంలోని ‘నిలుచుట’ అనే దృశ్యరూపాన్ని నిలుపుతూ, సందర్భంలో ఉన్న వ్యతిరేకత భావాన్ని స్పష్టం చేస్తుంది; అయితే హీబ్రూ పదబంధంలోని విస్తృత సాధ్యతను పాదటిప్పణిలో సూచించింది.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: మెషుల్లాము, లేవీయుడైన షబ్బెతై
  rationale: హీబ్రూ పదక్రమం ప్రకారం ‘లేవీయుడు’ అనే విశేషణం షబ్బెతైకే వర్తించేలా అనువదించింది.
- source_word: עֲזָרֻם
  choice: వారికి సహాయపడ్డారు
  rationale: עזר యొక్క సాధారణ అర్థమైన ‘సహాయపడుట’ను నేరుగా అందిస్తుంది; ఇక్కడ అది వారి వైఖరికి మద్దతివ్వడమనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
