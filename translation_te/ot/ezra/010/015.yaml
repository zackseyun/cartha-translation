  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని విరోధార్థక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పదబంధానికి సాధ్యమైన తటస్థ అర్థాన్ని పాదటిప్పణిలో పరిరక్షించింది.
