  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా స్వభావాన్ని నిలుపుతూ సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించాం. ‘చివరివారు’లోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
