source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י אֲדֹנִיקָם֮ אַחֲרֹנִים֒ וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם אֱלִיפֶ֖לֶט יְעִיאֵ֣ל וּֽ/שְׁמַעְיָ֑ה וְ/עִמָּ/הֶ֖ם שִׁשִּׁ֥ים הַ/זְּכָרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: te
  text: 'అదోనీకాము కుమారులలో చివరివారు[a] వీరు; వారి పేర్లు ఇవి: ఎలీఫెలెతు, యెయీయేలు, షెమయా. వారితోపాటు అరవై మంది పురుషులు ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తరువాతివారు” లేదా “చివరివారు.” హెబ్రీయ పదం అదోనీకాము వంశానికి చెందిన చివరి బృందాన్ని సూచించే అవకాశం ఉంది; బహుశా ఇంతకుముందు పేర్కొన్న బృందానికి భిన్నంగా వీరిని గుర్తిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: అదోనీకాము కుమారులలో
  rationale: בְּנֵי అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థం; వంశావళి జాబితాలో అది వంశస్థులను కూడా సూచించగలదు. హెబ్రీయ రూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండేలా ‘కుమారులలో’ అని ఇచ్చాం.
- source_word: אֲדֹנִיקָם
  choice: అదోనీకాము
  rationale: వ్యక్తి పేరును తెలుగు బైబిల్ నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַחֲרֹנִים
  choice: చివరివారు
  rationale: ఈ పదానికి ‘చివరివారు,’ ‘తరువాతివారు’ అనే అర్థాలు సాధ్యపడతాయి. ఇక్కడ అదోనీకాము వంశం నుంచి వచ్చిన చివరి బృందాన్ని సూచించే అవకాశం ఉన్నందున ‘చివరివారు’ అని అనువదించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: వీరు; వారి పేర్లు
  rationale: హెబ్రీయ జాబితా పరిచయ సూత్రాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది; మూలంలో స్పష్టమైన క్రియ లేకపోవడాన్ని అనవసరంగా విస్తరించలేదు.
- source_word: אֱלִיפֶלֶט יְעִיאֵל וּשְׁמַעְיָה
  choice: ఎలీఫెలెతు, యెయీయేలు, షెమయా
  rationale: మూడు వ్యక్తి పేర్లను హెబ్రీయ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు
  rationale: עִם సహవాసం లేదా తోడును సూచిస్తుంది; ‘వారితోపాటు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: שִׁשִּׁים
  choice: అరవై మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, వ్యక్తుల లెక్కకు సహజమైన ‘మంది’ వర్గసూచకాన్ని చేర్చాం.
- source_word: הַזְּכָרִים
  choice: పురుషులు
  rationale: זְכָרִים లింగపరంగా మగవారిని సూచిస్తుంది. తెలుగులో వ్యక్తుల జాబితా సందర్భంలో ‘పురుషులు’ అనేది ‘మగవారు’ కంటే గౌరవప్రదంగా, సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
