  to: 'అదోనీకాము కుమారులలో చివరివారు[a] వీరు; వారి పేర్లు ఇవి: ఎలీఫెలెతు, యెయీయేలు, షెమయా. వారితోపాటు అరవై మంది పురుషులు ఉన్నారు.'
