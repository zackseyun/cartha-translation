translation:
  language: te
  text: ఫీనెహాసు కుమారులలో గేర్షోము; ఈతామారు కుమారులలో దానియేలు; దావీదు కుమారులలో హట్టూషు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: కుమారులలో
  rationale: מִן + בְּנֵי వంశసంబంధ సమూహం నుంచి ఒక వ్యక్తిని పేర్కొనే జాబితా సూత్రం. ‘కుమారులలో’ అనేది హెబ్రీ పునరావృత నిర్మాణాన్ని నిలుపుతూ, ఇక్కడ ‘వంశస్థులలో’ అనే విస్తృత భావాన్నీ సహజంగా మోయగలదు.
- source_word: פִֽינְחָס
  choice: ఫీనెహాసు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: వ్యక్తి పేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: אִיתָמָר
  choice: ఈతామారు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: דָּנִיֵּאל
  choice: దానియేలు
  rationale: వ్యక్తి పేరును తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: דָוִיד
  choice: దావీదు
  rationale: వ్యక్తి పేరును సుపరిచిత తెలుగు రూపంలో ఇచ్చాం; ఇక్కడ అది వంశశ్రేణిని సూచిస్తుంది.
- source_word: חַטּוּשׁ
  choice: హట్టూషు
  rationale: హెబ్రీ పేరులోని ద్విత్వ ట ధ్వనిని, దీర్ఘ ū ధ్వనిని సాధ్యమైనంత దగ్గరగా నిలుపుతూ లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి-జాబితా శైలిని నిలిపాం. మూలంలోని మూడు సమాంతర భాగాలను అర్ధవిరామాలతో వేరు చేశాం; మూలంలో లేని క్రియను చేర్చలేదు.
