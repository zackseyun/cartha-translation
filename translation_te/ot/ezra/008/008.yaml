  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: te
  text: షెఫట్యా కుమారులలోనుండి[a] మిఖాయేలు కుమారుడైన జెబద్యా, మరియు అతనితో ఎనభై మంది పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘కుమారులు’ అనే మాట ఇక్కడ నేరుగా పుట్టిన కుమారులనే కాకుండా, విస్తృతంగా ‘వంశస్థులు’ లేదా ఒక వంశశాఖకు చెందినవారు అనే అర్థాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారుల్లోనుంచి
  rationale: హీబ్రూ పదబంధంలోని ‘నుండి’ మరియు ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, జాబితా సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం. ఇది విస్తృత వంశశ్రేణిని కూడా సూచించగలదనే అంశాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: שְׁפַטְיָה
  choice: షెఫట్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: זְבַדְיָה
  choice: జెబద్యా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: పేరు చెప్పబడిన తండ్రితో ప్రత్యక్షంగా అనుసంధానమైన వంశావళి ప్రయోగంలో ‘కుమారుడు’ సహజమైన, నిర్దిష్టమైన అర్థం.
- source_word: מִיכָאֵל
  choice: మిఖాయేలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: וְ/עִמּוֹ
  choice: అతనితోపాటు
  rationale: జాబితాలో నాయకునితో వచ్చినవారి సంఖ్యను తెలిపే హీబ్రూ అనుసంధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁמֹנִים
  choice: ఎనభై
  rationale: మూలంలోని సంఖ్యకు నేరమైన తెలుగు సమానం.
- source_word: הַזְּכָרִים
  choice: మగవారు
  rationale: హీబ్రూ పదం వయస్సు లేదా సామాజిక హోదాకన్నా పురుష లింగాన్ని ప్రత్యేకంగా సూచిస్తుంది; ‘మగవారు’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
