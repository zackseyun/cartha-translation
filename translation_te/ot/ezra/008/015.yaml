id: EZR.8.15
reference: Ezra 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: te
  text: నేను వారిని అహవాకు వెళ్లే నది[a] వద్ద సమకూర్చాను. అక్కడ మేము మూడు రోజులు శిబిరం వేశాము. అప్పుడు నేను ప్రజలలోను యాజకులలోను పరిశీలించాను; అయితే లేవి కుమారుల్లో ఒక్కరినీ అక్కడ కనుగొనలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహవాకు వెళ్లే కాలువ.” ఇక్కడి హీబ్రూ పదం నదిని గానీ, మానవులు నిర్మించిన జలమార్గాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “లేవి కుమారులు” అంటే లేవీయులు, అనగా లేవి సంతతివారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: నేను వారిని ... సమకూర్చాను
  rationale: קבץ అంటే కూడగట్టడం లేదా సమకూర్చడం. ‘సమకూర్చాను’ ఎజ్రా స్వయంగా సమూహాన్ని ఒకచోట చేర్చాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: అహవాకు వెళ్లే నది
  rationale: נָהָר సాధారణంగా ‘నది’; ఈ చారిత్రక సందర్భంలో కాలువ లేదా జలమార్గం అనే అర్థమూ సాధ్యమే. הַבָּא אֶל అనే గమనార్థక సంబంధాన్ని ‘వెళ్లే’ అని సహజంగా వ్యక్తం చేశాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַנַּחֲנֶה
  choice: మేము ... శిబిరం వేశాము
  rationale: חנה యొక్క సందర్భోచిత అర్థం బసచేయడానికి శిబిరం వేయడం. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: יָמִים שְׁלֹשָׁה
  choice: మూడు రోజులు
  rationale: హీబ్రూ సంఖ్యా పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: וָאָבִינָה
  choice: నేను ... పరిశీలించాను
  rationale: בין యొక్క ఈ ప్రయోగం జాగ్రత్తగా గమనించి విచారించడం లేదా గుర్తించడం అనే భావాన్ని ఇస్తుంది. సమూహంలో ఎవరున్నారో ఎజ్రా తనిఖీ చేసిన సందర్భానికి ‘పరిశీలించాను’ సరిపోతుంది.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: ప్రజలనూ యాజకులనూ
  rationale: עָם మరియు כֹּהֲנִים అనే రెండు వర్గాలను హీబ్రూ ప్రకారం వేరుగా, నేరుగా అనువదించాం.
- source_word: וּמִבְּנֵי לֵוִי
  choice: లేవి కుమారుల్లో
  rationale: అక్షరార్థంగా ‘లేవి కుమారుల్లో/సంతతివారిలో.’ వంశసంబంధ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
- source_word: לֹא מָצָאתִי שָׁם
  choice: ఒక్కరినీ అక్కడ కనుగొనలేదు
  rationale: నిరాకరణతో సూచింపబడిన వ్యక్తులను తెలుగులో సహజంగా ‘ఒక్కరినీ ... కనుగొనలేదు’ అని వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. నది/కాలువ అనే నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం; ‘లేవి కుమారులు’ అనే వంశపరమైన హీబ్రూ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో కాపాడాం.
