id: EZR.8.29
reference: Ezra 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: te
  text: మీరు అప్రమత్తంగా ఉండి, వాటిని భద్రంగా కాపాడండి[a]; యెరూషలేములోని యాహ్వే మందిరపు గదుల్లో[c], యాజకుల అధిపతుల, లేవీయుల, ఇశ్రాయేలు పితృవంశాల పెద్దల[b] సమక్షంలో వాటిని తూచే వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాగ్రత్తగా ఉండి, వాటిని కాపాడండి.” ఈ రెండు హీబ్రూ ఆజ్ఞలు అప్పగించిన వస్తువుల విషయంలో నిరంతర జాగరూకతను నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “ఇశ్రాయేలు పితరుల గృహాల అధిపతులు”; అంటే పూర్వీకుల వంశాలకు లేదా వంశగృహాలకు నాయకులు.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో “యాహ్వే గృహం”; అంటే దేవాలయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ וְשִׁמְרוּ
  choice: అప్రమత్తంగా ఉండి, వాటిని భద్రంగా కాపాడండి
  rationale: మొదటి ఆజ్ఞ జాగరూకమైన శ్రద్ధను, రెండవది అప్పగించిన విలువైన వస్తువులను కాపాడడాన్ని సూచిస్తున్నాయి. ‘వాటిని’ అనేది ముందరి వచనంలోని వస్తువుల ఆధారంగా సందర్భం నుంచి చేర్చబడింది.
- source_word: עַד תִּשְׁקְלוּ
  choice: వాటిని తూచే వరకు
  rationale: వెండి, బంగారం వంటి అప్పగించిన వస్తువులను అధికారుల సమక్షంలో లెక్కచూసే ప్రక్రియలో తూచడాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సమక్షంలో
  rationale: అధికారిక సాక్షుల ఎదుట జరిగే చర్య అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: యాజకుల అధిపతులు
  rationale: שׂרים అనే పదంలోని నాయకత్వ భావాన్ని నిలుపుతుంది; తరువాతి కాలంలోని సాంకేతిక పదవిని అనవసరంగా ఆపాదించదు.
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: ఇది లేవి గోత్రానికి సంబంధించిన మతసేవకుల సంప్రదాయ నామానికి సహజమైన తెలుగు రూపం.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు పితృవంశాల పెద్దలు
  rationale: పూర్వీకుల గృహాలు లేదా వంశాల నాయకులను సూచించే హీబ్రూ సామాజిక నిర్మాణాన్ని అర్థమయ్యే రీతిలో కాపాడుతుంది.
- source_word: הַלִּשְׁכוֹת
  choice: గదులు
  rationale: ఆలయ ప్రాంగణంలోని గదులను సూచిస్తుంది. ‘నిల్వగదులు’ అని ప్రత్యేకీకరించకుండా మూలపదపు విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: పదశః ‘యాహ్వే గృహం’; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది. సహజ తెలుగుకోసం ‘మందిరం’ వాడి, దైవనామాన్ని ప్రత్యక్షంగా ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన శైలి వాడబడింది. పరిపాలనా సాక్ష్యభావం కోసం ‘సమక్షంలో’, ఆలయ నిర్మాణ సందర్భానికి సహజంగా ‘మందిరపు గదులు’ ఎంచుకున్నాం. మూలంలోని జాగరూకత మరియు కాపలా అనే రెండు సమీప భావాలను రెండింటినీ నిలిపాం.
