  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: te
  text: 'షెకన్యా వంశస్థులనుండి, పరోషు వంశస్థులనుండి: జెకర్యా; అతనితోపాటు వంశావళిలో నమోదు చేయబడిన[a] పురుషులు 150 మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వంశావళి ప్రకారం లెక్కించబడినవారు.’ హీబ్రూ క్రియ వంశపట్టికలో అధికారికంగా నమోదు చేయడం లేదా లెక్కించడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: వంశస్థులలో
  rationale: ఈ తిరిగివచ్చినవారి జాబితాలో בְּנֵי అనేది తక్షణ కుమారులనే కాక కుటుంబం లేదా వంశానికి చెందినవారిని సూచిస్తుంది. మִן ఉపసర్గ ఆ వంశంలోనుండి ఎంపికైన వ్యక్తిని పరిచయం చేస్తుంది.
- source_word: שְׁכַנְיָה
  choice: షెకన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే, తెలుగులో సహజమైన లిప్యంతరీకరణ.
- source_word: פַרְעֹשׁ
  choice: పరోషు
  rationale: ఎజ్రాలోని కుటుంబనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన రూపం.
- source_word: וְעִמּוֹ
  choice: అతనితోపాటు
  rationale: జెకర్యాతో కలిసి నమోదైన సమూహాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הִתְיַחֵשׂ
  choice: వంశావళి ప్రకారం నమోదు చేయబడ్డారు
  rationale: ఈ హిత్పయేల్ క్రియ కేవలం సంతతికి చెందడాన్ని కాక, వంశపట్టికలో అధికారికంగా నమోదు చేయడం లేదా లెక్కించడం అనే భావాన్ని ఇస్తుంది.
- source_word: לִזְכָרִים
  choice: పురుషులు
  rationale: మూలపదం లింగాన్ని స్పష్టంగా పేర్కొంటుంది; సందర్భంలో లెక్కించబడిన మగవారిని సహజ తెలుగు పదంతో సూచిస్తుంది.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: 150 మంది
  rationale: జాబితా శైలిలో ఖచ్చిత సంఖ్యను సులభంగా చదవగల అంకెల రూపంలో ఇచ్చింది.
theological_decisions:
- issue: షెకన్యా మరియు పరోషు అనే రెండు వంశ సూచనల మధ్య సంబంధం
  choice: రెండు పదబంధాలనూ విడిగా ఉంచుతూ దీర్ఘ విరామచిహ్నాలతో మూలంలోని సంక్షిప్త, అస్పష్ట నిర్మాణాన్ని నిలిపివేయడం
  alternative: జెకర్యాను పరోషు వంశానికి చెందిన షెకన్యా సంతతివాడిగా స్పష్టంగా కలిపి చెప్పడం
  rationale: హీబ్రూ పాఠంలో వరుసగా రెండుసార్లు מִבְּנֵי రావడం వల్ల వాటి ఖచ్చిత వాక్యనిర్మాణ సంబంధం స్పష్టంగా లేదు. అనువాదంలో ఒకే వంశ సంబంధాన్ని నిర్ణయించి మూలంలోని నిజమైన అస్పష్టతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని షెకన్యా–పరోషు నిర్మాణ అస్పష్టతను వివరణాత్మకంగా పరిష్కరించకుండా నిలిపివేసింది.
