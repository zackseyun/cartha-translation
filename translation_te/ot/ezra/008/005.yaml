  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: te
  text: షెకన్యా కుమారులలో యహజీయేలు కుమారుడు, మరియు అతనితో పాటు మూడువందల మంది మగవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పురుషులు.” హీబ్రూ పదం వయస్సు లేదా సామాజిక హోదా కంటే మగ లింగాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: కుమారులలో
  rationale: మִן + בְּנֵי ఈ జాబితాలోని ఒక వంశశాఖను పరిచయం చేస్తుంది. ‘కుమారులలో’ అనే రూపం వంశావళి సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁכַנְיָה
  choice: షెకన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: యహజీయేలుతో ఉన్న సంబంధాన్ని మూలంలోని ఏకవచన రూపానికి అనుగుణంగా తెలిపే పదం.
- source_word: יַחֲזִיאֵל
  choice: యహజీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: וְ/עִמּוֹ
  choice: అతనితో పాటు
  rationale: పేర్కొన్న నాయకునితో వచ్చిన సమూహాన్ని సహజంగా అనుసంధానిస్తూ హీబ్రూ సముచ్చయాన్ని నిలుపుతుంది.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: మూడువందల మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, వ్యక్తులను లెక్కించే సహజ తెలుగు రూపం కోసం ‘మంది’ చేర్చాం.
- source_word: הַזְּכָרִים
  choice: మగవారు
  rationale: ఈ పదం వయస్సు లేదా సామాజిక హోదా కంటే లింగాన్ని ప్రత్యేకంగా సూచిస్తుంది; అందువల్ల సాధారణమైన ‘పురుషులు’ కంటే ‘మగవారు’ మూలానికి మరింత సమీపం.
