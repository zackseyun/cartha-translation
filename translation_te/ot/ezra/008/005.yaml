translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడాం. మూలంలోని అసాధారణమైన, కొంత అసంపూర్ణంగా వినిపించే వాక్యనిర్మాణాన్ని పేరు లేదా సంబంధాన్ని ఊహించి పూరించకుండా నిలుపుకున్నాం.
