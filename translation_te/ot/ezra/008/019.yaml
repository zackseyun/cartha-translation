  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת חֲשַׁבְיָ֔ה וְ/אִתּ֥/וֹ יְשַֽׁעְיָ֖ה מִ/בְּנֵ֣י מְרָרִ֑י אֶחָ֥י/ו וּ/בְנֵי/הֶ֖ם עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: te
  text: హషబ్యాను, అతనితోపాటు మెరారి వంశస్థులలోని యెషయాను, అతని సహోదరులనూ వారి కుమారులనూ—మొత్తం ఇరవై మందిని తీసుకొచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని సహోదరులు’ అన్న మాట ఇక్కడ అతని సొంత అన్నదమ్ములను మాత్రమే కాకుండా, మెరారి వంశంలోని సమీప పురుష బంధువులను లేదా ఒకే వంశశాఖకు చెందినవారిని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: హషబ్యాను
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం; את అనే కర్మసూచకాన్ని తెలుగు ద్వితీయావిభక్తి ‘ను’తో వ్యక్తం చేశాం. ముందటి వచనం నుంచి కొనసాగుతున్న క్రియను సహజ తెలుగుకోసం ‘తీసుకొచ్చాను’గా స్పష్టంగా చేర్చాం.
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: అతనితోపాటు యెషయాను
  rationale: אִתּוֹలోని సహవాస భావాన్ని ‘అతనితోపాటు’ సహజంగా తెలియజేస్తుంది; יְשַׁעְיָהను ఈ వ్యక్తికి తగినట్లుగా ‘యెషయా’ అని లిప్యంతరీకరించాం.
- source_word: מִבְּנֵי מְרָרִי
  choice: మెరారి వంశస్థులలో
  rationale: అక్షరార్థం ‘మెరారి కుమారులలోనుంచి.’ ఇక్కడ בְּנֵי వంశపరమైన సమూహాన్ని సూచిస్తున్నందున ‘వంశస్థులు’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶחָיו
  choice: అతని సహోదరులను
  rationale: మూలంలోని సాధారణ పదమైన ‘అతని సోదరులు’ అనే భావాన్ని నిలిపి ఉంచాం. ఈ వంశావళి సందర్భంలో అది రక్తసంబంధ సోదరులకే పరిమితం కాకపోవచ్చనే అంశాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וּבְנֵיהֶם
  choice: వారి కుమారులను
  rationale: మూలంలోని పుంలింగ బహువచన భావాన్ని ‘కుమారులు’గా నిర్దిష్టంగా నిలిపాం; ‘వారి’ అనే బహువచన స్వామ్యాన్ని కూడా కాపాడాం.
- source_word: עֶשְׂרִים
  choice: మొత్తం ఇరవై మందిని
  rationale: సంఖ్య ఈ వాక్యభాగంలో పేర్కొన్న బృందం మొత్తాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తుల లెక్కను సహజంగా తెలియజేయడానికి ‘మంది’ని, సమూహ మొత్తం అని స్పష్టం చేయడానికి ‘మొత్తం’ను వాడాం.
