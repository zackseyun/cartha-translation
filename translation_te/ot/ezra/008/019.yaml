revisions:
- from: మెరారి వంశస్థులలో హషబ్యాను, అతనితోపాటు యెషయాను, అతని సహోదరులను, వారి కుమారులను—మొత్తం ఇరవై మందిని తీసుకొచ్చాను.[a]
  to: హషబ్యాను, అతనితోపాటు మెరారి వంశస్థులలోని యెషయాను, అతని సహోదరులనూ వారి కుమారులనూ—మొత్తం ఇరవై మందిని తీసుకొచ్చారు.[a]
  rationale: The revision restores the plural subject inherited from the preceding verse and attaches the Merarite designation directly to Jeshaiah, following the Hebrew word order and syntax more closely. It retains the source’s genealogical ambiguity in ‘అతని సహోదరులు’ and preserves the explanatory footnote.
  reviewer_model: gpt-5.6-terra
