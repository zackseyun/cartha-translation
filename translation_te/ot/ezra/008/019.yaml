translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వరూపాన్ని నిలిపేలా అయినా సులభంగా చదవగల వాక్యంగా రూపొందించాం. వచనం ముందటి వాక్యానికి కొనసాగింపు కావడంతో, తెలుగులో స్వతంత్రంగా అర్థమయ్యేందుకు సందర్భం నుంచి ‘తీసుకొచ్చాను’ అనే క్రియను పూరించాం. ‘మెరారి కుమారులలోనుంచి’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ‘మెరారి వంశస్థులలో’గా అనువదించాం.
