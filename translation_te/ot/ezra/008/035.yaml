source:
  edition: WLC
  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: te
  text: 'చెరనుండి వచ్చిన ప్రవాసులు[a] ఇశ్రాయేలు దేవునికి దహనబలులు అర్పించారు: సమస్త ఇశ్రాయేలు కొరకు పన్నెండు ఎద్దులు, తొంభై ఆరు పొట్టేళ్లు, డెబ్బై ఏడు గొర్రెపిల్లలు, పాపబలిగా పన్నెండు మగ మేకలు. ఇదంతా యాహ్వేకు దహనబలి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ప్రవాసపు కుమారులు”; ఇది చెరనుండి తిరిగివచ్చిన ప్రవాసులను సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: హెబ్రీలో, “ఇదంతా యాహ్వేకు దహనబలి.” ఇదే వచనంలో మగ మేకలను పాపబలిగా పేర్కొన్నప్పటికీ, మూలపాఠంలోని ఈ సంగ్రహప్రకటనను అలాగే ఉంచాం.
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי בְנֵי הַגּוֹלָה
  choice: చెరనుండి వచ్చిన ప్రవాసులు
  rationale: నిర్దిష్ట సమూహాన్ని సూచించే కర్తృవాచక కృదంతాన్ని సహజమైన భూతకాల కథనంగా అనువదించాం. בְנֵי הַגּוֹלָה అనే హెబ్రీ సంబంధవాచక నుడికారాన్ని తెలుగులో సహజంగా ‘ప్రవాసులు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: దహనబలులు అర్పించారు
  rationale: బలుల సందర్భంలో הקריב కు ‘అర్పించారు’, עֹלוֹת కు స్థిరమైన బైబిలు పదబంధం ‘దహనబలులు’ సహజంగా సరిపోతాయి.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి
  rationale: ל ఉపసర్గ బలి అందుకునే వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘దేవునికి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి పక్షంగా పన్నెండు ఎద్దులు
  rationale: బలుల సందర్భంలో עַל కు ఉన్న ప్రాతినిధ్య భావాన్ని ‘పక్షంగా’ స్పష్టంగా తెలియజేస్తుంది. ‘ఇశ్రాయేలీయులందరి’ అనేది ప్రజాసమూహాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: తొంభై ఆరు పొట్టేళ్లు
  rationale: אֵילִים అనేది మగ గొర్రెలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘పొట్టేళ్లు’ సంక్షిప్తమైన, సరైన పదం.
- source_word: כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: డెబ్బై ఏడు గొర్రెపిల్లలు
  rationale: బలుల జాబితాలో כְּבָשִׂים కు ‘గొర్రెపిల్లలు’ స్పష్టమైన సాధారణ తెలుగు సమానం.
- source_word: צְפִירֵי חַטָּאת שְׁנֵים עָשָׂר
  choice: పాపపరిహార బలిగా పన్నెండు మగ మేకలు
  rationale: צְפִירֵי మగ మేకలను, חַטָּאת ఇక్కడ పాపానికి సంబంధించిన బలి వర్గాన్ని సూచిస్తాయి. ‘పాపపరిహార బలి’ ఆ ఆచారపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: ఇదంతా యెహోవాకు దహనబలి
  rationale: క్రియారహితమైన హెబ్రీ సంగ్రహ వాక్యాన్ని సంక్షిప్తంగా నిలిపాం. ముందు పాపపరిహార బలి ప్రస్తావన ఉన్నప్పటికీ, మూలంలోని ‘అంతా దహనబలి’ అనే ఉద్రిక్తతను సవరించలేదు.
- source_word: יהוה
  choice: యెహోవా
  rationale: దైవ నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
theological_decisions:
- issue: పాపపరిహార బలి మేకలను పేర్కొన్న తరువాత ‘ఇదంతా దహనబలి’ అని చెప్పడంలో కనిపించే ఉద్రిక్తత
  choice: మూలవాక్యంలోని సంగ్రహ ప్రకటనను యథాతథ భావంతో నిలుపుట
  alternative: చివరి ప్రకటనను దహనబలులైన జంతువులకు మాత్రమే వర్తింపజేసి వివరణాత్మకంగా మార్చుట
  rationale: హెబ్రీ పాఠం రెండు అంశాలనూ పక్కపక్కనే ఉంచుతుంది. అనువాదం ఆ అస్పష్టతను లేదా ఉద్రిక్తతను మౌనంగా పరిష్కరించకూడదు; అందువల్ల పాదటిప్పణితో పారదర్శకంగా నిలిపాం.
- issue: יהוה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇక్కడ మూలపాఠంలో సాధారణ బిరుదు కాక ఒడంబడిక నామమైన יהוה నేరుగా ఉంది. అందువల్ల దాన్ని వ్యక్తిగత నామంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడాం. బలుల సాంకేతిక పదాలకు స్థిరమైన తెలుగు రూపాలు ఉంచి, హెబ్రీ నుడికారాన్ని ప్రధాన వాక్యంలో సహజీకరించి పాదటిప్పణిలో అక్షరార్థాన్ని ఇచ్చాం.
