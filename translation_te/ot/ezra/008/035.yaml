  to: 'చెరనుండి వచ్చిన ప్రవాసులు[a] ఇశ్రాయేలు దేవునికి దహనబలులు అర్పించారు: సమస్త ఇశ్రాయేలు కొరకు పన్నెండు ఎద్దులు, తొంభై ఆరు పొట్టేళ్లు, డెబ్బై ఏడు గొర్రెపిల్లలు, పాపబలిగా పన్నెండు మగ మేకలు. ఇదంతా యాహ్వేకు దహనబలి.[b]'
  rationale: సవరించిన పాఠం יהוהకు ప్రాజెక్టు నిర్ణయానుసారమైన ‘యాహ్వే’ను వాడుతుంది; ‘సమస్త ఇశ్రాయేలు’ అనే మూల గుర్తింపును కాపాడుతుంది; మరియు חטאתను అదనపు సిద్ధాంతపర వివరణ లేకుండా ‘పాపబలి’గా ఇస్తుంది. అంతిమ ‘ఇదంతా దహనబలి’ అనే మూలపాఠంలోని స్పష్టమైన ఉద్రిక్తతను పాదటిప్పణితో పారదర్శకంగా నిలిపింది.
