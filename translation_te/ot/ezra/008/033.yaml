  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: te
  text: నాలుగో రోజున, మా దేవుని మందిరంలో వెండి, బంగారం, పాత్రలు[b] తూకం వేయబడి, యాజకుడైన ఊరియా కుమారుడు మెరేమోతు సంరక్షణకు అప్పగించబడ్డాయి.[a] అతనితో ఫీనెహాసు కుమారుడు ఎలియాజరు ఉన్నాడు; వారితో లేవీయులైన యేషువ కుమారుడు యోజాబాదు, బిన్నూయి కుమారుడు నోయద్యా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాజకుడైన ఊరియా కుమారుడు మెరేమోతు చేతికి.’ ఇది అతని సంరక్షణ బాధ్యతకు అప్పగించడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆలయంలో ఉపయోగించే పాత్రలు లేదా ఇతర సామగ్రి.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: నాలుగో రోజున
  rationale: కథన క్రమాన్ని సహజంగా కొనసాగించే కాలసూచన; మూలంలో లేని ‘ఆ తర్వాత’ వంటి వివరాన్ని చేర్చలేదు.
- source_word: נִשְׁקַל
  choice: తూకం వేసి ... అప్పగించారు
  rationale: నిఫాల్ రూపంలోని తూకం వేయబడిన భావాన్ని తెలుగులో సహజమైన పరిపాలనా సందర్భానికి తగిన నిర్మాణంతో తెలిపింది; వస్తువులను లెక్కచూసి బాధ్యతకు అప్పగించే చర్య కూడా సందర్భానుసారంగా స్పష్టమవుతుంది.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: వెండిని, బంగారాన్ని, పాత్రలను
  rationale: כֵּלִים అనే పదానికి ఆలయ జాబితా సందర్భంలో ‘పాత్రలు’ స్పష్టమైన, concrete rendering; విస్తృతార్థం కోసం పాదసూచిక ఇచ్చింది.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: మా దేవుని మందిరంలో
  rationale: హెబ్రీలో అక్షరార్థం ‘మా దేవుని ఇంటిలో’; ఇక్కడ ఆలయమే ఉద్దేశం కాబట్టి ఆధునిక తెలుగులో సహజమైన ‘మందిరం’ వాడింది, ‘మా దేవుడు’ అనే covenantal first-person expressionను నిలిపింది.
- source_word: עַל יַד
  choice: బాధ్యతకు అప్పగించారు
  rationale: ‘చేతిలోకి’ అనే హెబ్రీ నుడికారం ఇక్కడ సంరక్షణ లేదా అధికార బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజార్థం, పాదసూచికలో అక్షరార్థం ఇచ్చింది.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: ఊరియా కుమారుడైన యాజకుడు మెరేమోతు
  rationale: ‘యాజకుడు’ అనే బిరుదు సందర్భానుసారంగా మెరేమోతును సూచించేలా, తెలుగులో సంబంధం సందిగ్ధం కాకుండా అమర్చింది.
- source_word: וְעִמּוֹ ... וְעִמָּהֶם
  choice: అతనితో ... ఉన్నాడు; వారితో ... ఉన్నారు
  rationale: ఏకవచన, బహువచన సర్వనామ భేదాన్ని నిలిపి, హెబ్రీ సమన్వయ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా తెలిపింది.
- source_word: יוֹזָבָד בֶּן יֵשׁוּעַ וְנֽוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: లేవీయులైన యేషువ కుమారుడు యోజాబాదు, బిన్నూయి కుమారుడు నోయద్యా
  rationale: చివరి బహువచన పదమైన ‘లేవీయులు’ చివర పేర్కొన్న ఇద్దరినీ సమష్టిగా గుర్తిస్తుందని స్పష్టంగా, సంక్షిప్తంగా తెలిపింది.
