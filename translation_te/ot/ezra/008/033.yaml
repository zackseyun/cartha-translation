translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. వ్యక్తుల పేర్లు మూలభాష ధ్వనులకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని దీర్ఘ సమన్వయ వాక్యాన్ని అర్థస్పష్టత కోసం రెండు భాగాలుగా విభజించినా, సమాచార క్రమం నిలిపివేయబడింది.
