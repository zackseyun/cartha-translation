source:
  edition: WLC
  text: וָ/אַבְדִּ֛ילָ/ה מִ/שָּׂרֵ֥י הַ/כֹּהֲנִ֖ים שְׁנֵ֣ים עָשָׂ֑ר לְ/שֵׁרֵֽבְיָ֣ה חֲשַׁבְיָ֔ה וְ/עִמָּ/הֶ֥ם מֵ/אֲחֵי/הֶ֖ם עֲשָׂרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: te
  text: 'అప్పుడు నేను యాజకుల అధిపతులలో పన్నెండు మందిని ప్రత్యేకించాను: షేరెబ్యా, హషబ్యా, వారితోపాటు వారి సహోదరులలో పది మందిని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అనే పదం ఇక్కడ విస్తృత అర్థంలో వారి బంధువులను లేదా సహచరులను కూడా సూచించవచ్చు; హీబ్రూ మూలంలో పురుష కుటుంబసంబంధ పదమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: అప్పుడు నేను ప్రత్యేకించాను
  rationale: בדל హిఫీల్ రూపం ‘వేరుచేయడం, ప్రత్యేకించడం’ అనే అర్థం ఇస్తుంది. అప్పగించబోయే పవిత్ర బాధ్యత కోసం వారిని నియమించే సందర్భానికి ‘ప్రత్యేకించాను’ సహజంగా సరిపోతుంది; וָ־ కథన క్రమాన్ని ‘అప్పుడు’గా వ్యక్తం చేస్తుంది.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: యాజకుల అధిపతులలో
  rationale: שָׂרֵי అంటే అధిపతులు, నాయకులు. מִן ఇక్కడ సమూహంలోనుండి ఎంపికను సూచిస్తుంది; అందువల్ల ‘యాజకుల అధిపతులలో’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండు మందిని
  rationale: వ్యక్తులను లెక్కిస్తున్నందున తెలుగు సహజ ప్రయోగానికి ‘మందిని’ జోడించబడింది.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: షేరెబ్యా, హషబ్యా
  rationale: వ్యక్తి పేర్లను తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం. לְ־ను పేర్ల జాబితాను పరిచయం చేసే సూచనగా అర్థం చేసుకున్నాం.
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు
  rationale: కలయికతో కూడిన అనుబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵאֲחֵיהֶם
  choice: వారి సహోదరులలో
  rationale: אָחִים యొక్క ప్రత్యక్ష కుటుంబపదాన్ని ‘సహోదరులు’గా నిలిపి, מִן సూచించే వారిలోనుండి ఎంపిక భావాన్ని ‘లో’ ద్వారా వ్యక్తం చేశాం. సందర్భంలో ఇది విస్తృతంగా బంధువులు లేదా సహచరులను సూచించే అవకాశం ఉంది.
- source_word: עֲשָׂרָה
  choice: పది మందిని
  rationale: వ్యక్తులను లెక్కిస్తున్నందున సహజ తెలుగు కోసం ‘మందిని’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. వాక్యంలోని సంఖ్యా నిర్మాణం—యాజకుల అధిపతులలో పన్నెండు మంది, వారితో వారి సహోదరులలో పది మంది—మూలంలో ఉన్నట్టే ఉంచబడింది. మూల వాక్య నిర్మాణంలో షేరెబ్యా, హషబ్యా పన్నెండు మంది జాబితాలో భాగమా లేక పన్నెండు మందికి అదనమా అన్న స్వల్ప అస్పష్టత ఉంది; తెలుగు పాఠంలో దానిని అనవసరంగా పరిష్కరించకుండా పేర్లను ద్విబిందువు తరువాత ఉంచాం.
