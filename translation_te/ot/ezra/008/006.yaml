  edition: WLC
  text: וּ/מִ/בְּנֵ֣י עָדִ֔ין עֶ֖בֶד בֶּן יוֹנָתָ֑ן וְ/עִמּ֖/וֹ חֲמִשִּׁ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/006.yaml
  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: te
  text: ఆదీను వంశస్థుల్లో యోనాతాను కుమారుడు ఏబెదు; అతనితో పాటు యాభై మంది పురుషులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ప్రత్యేకంగా “మగవారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי עָדִין
  choice: ఆదీను వంశస్థుల్లో
  rationale: జాబితా సందర్భంలో בְּנֵי అనేది ప్రత్యక్ష కుమారులకే పరిమితం కాకుండా వంశస్థులను లేదా వంశ కుటుంబాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వంశస్థుల్లో’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עֶבֶד
  choice: ఏబెదు
  rationale: ఇక్కడ ఇది ‘సేవకుడు’ అనే సామాన్య నామవాచకం కాదు, వ్యక్తి పేరు. హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: בֶּן יוֹנָתָן
  choice: యోనాతాను కుమారుడు
  rationale: వంశావళి సంబంధాన్ని తెలుగులో సహజమైన క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: וְעִמּוֹ
  choice: అతనితో పాటు
  rationale: పేరు చెప్పబడిన నాయకునితో వచ్చిన సమూహాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: חֲמִשִּׁים הַזְּכָרִים
  choice: యాభై మంది పురుషులు
  rationale: זְכָרִים లింగ-నిర్దిష్టంగా మగవారిని సూచిస్తుంది. మనుషుల జాబితాలో ‘పురుషులు’ అనేది తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండి ఆ నిర్దిష్టతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా శైలిని సంక్షిప్తంగా ఉంచుతూ, ‘వంశస్థులు’ మరియు ‘పురుషులు’ వంటి సాధారణంగా అర్థమయ్యే గౌరవప్రద పదాలను ఉపయోగించింది.
