  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: te
  text: అప్పుడు నేను అహవా నది దగ్గర ఉపవాసం ప్రకటించాను. మన దేవుని ఎదుట మనల్ని మనం తగ్గించుకొని[a], మాకూ మా చిన్నపిల్లలకూ మా ఆస్తులన్నిటికీ నేరైన మార్గాన్ని[b] ఆయన దగ్గర కోరుకోవడానికి అలా చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనల్ని మనం శ్రమపెట్టుకొని.’ ఉపవాస సందర్భంలో ఈ హీబ్రూ పదప్రయోగం స్వీయనిరాకరణతో దేవుని ఎదుట వినయంగా తగ్గించుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సరైన మార్గం,’ ‘సురక్షితమైన ప్రయాణం.’ హీబ్రూలో అక్షరార్థంగా ‘నేరైన మార్గం’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: అప్పుడు నేను ప్రకటించాను
  rationale: ఈ సందర్భంలో קרא బహిరంగంగా ప్రకటించడాన్ని సూచిస్తుంది. కథనంలోని వావ్‌ను సహజమైన తెలుగు క్రమసూచక పదమైన ‘అప్పుడు’తో వ్యక్తపరిచాం.
- source_word: צוֹם
  choice: ఉపవాసం
  rationale: ఈ నామవాచకం ఉపవాస ఆచరణను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఉపవాసం’ సహజమైన, స్పష్టమైన పదం.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: అహవా నది దగ్గర
  rationale: నదితో వాడిన עַל ఇక్కడ సమీప స్థానాన్ని సూచిస్తుంది. ‘అహవా’ను స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: לְהִתְעַנּוֹת
  choice: మనల్ని మనం తగ్గించుకొని
  rationale: ఉపవాస సందర్భంలో התענה స్వీయనిగ్రహంతో దేవుని ఎదుట వినయంగా తగ్గించుకోవడాన్ని సూచిస్తుంది. శారీరక హింస అనే అపార్థం రాకుండా, మూలంలోని ఆధ్యాత్మిక భంగిమను నిలిపే రూపాన్ని ఎంచుకున్నాం.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: మన దేవుని ఎదుట
  rationale: దేవుని సన్నిధిలోని భంగిమను తెలిపే మూలభాషా సంబంధపదబంధానికి ఇది సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: ఆయనను అడగడానికి
  rationale: בקש מן ఇక్కడ దేవుని వద్ద ప్రార్థనాపూర్వకంగా కోరడాన్ని సూచిస్తుంది. ‘అడగడానికి’ సాధారణ పాఠకులకు సహజంగా ఉండి, దేవునిపై ఆధారపడటాన్ని సందర్భం ద్వారా తెలియజేస్తుంది.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: నేరైన మార్గం
  rationale: మూలంలో అక్షరార్థంగా ‘నేరైన మార్గం’ ఉంది. ప్రయాణ భద్రతకే అర్థాన్ని పరిమితం చేయకుండా, సరైన నడిపింపు అనే విస్తృత భావాన్నీ నిలుపుతుంది.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: మాకూ మా చిన్నపిల్లలకూ మా ఆస్తి అంతటికీ
  rationale: טף ప్రధానంగా చిన్నపిల్లలను లేదా ప్రయాణబృందంలోని ఆధారితులను సూచిస్తుంది; ‘చిన్నపిల్లలు’ ఇక్కడ స్పష్టంగా ఉంది. רְכוּשׁ వారు వెంట తీసుకెళ్లిన సమస్త ఆస్తిని సూచిస్తుంది.
theological_decisions:
- issue: ఉపవాస సందర్భంలోని לְהִתְעַנּוֹת పదప్రయోగం
  choice: మనల్ని మనం తగ్గించుకొని
  alternative: మనల్ని మనం బాధించుకొని
  rationale: మూలప్రయోగంలో స్వీయనిరాకరణ లేదా బాధకు లోనుచేసుకోవడం అనే ఛాయ ఉన్నా, సందర్భం దేవుని ఎదుట ఉపవాసంతో వినయపడటాన్ని సూచిస్తుంది. ప్రత్యామ్నాయ రూపం శారీరక స్వహానిని సూచిస్తున్నట్లు అపార్థమయ్యే అవకాశం ఉన్నందున, ఆధ్యాత్మిక భంగిమను స్పష్టంగా తెలియజేసే అనువాదాన్ని ఎంచుకున్నాం.
- issue: דֶּרֶךְ יְשָׁרָה యొక్క భావపరిధి
  choice: నేరైన మార్గం
  alternative: సరైన మార్గం; సురక్షితమైన ప్రయాణం
  rationale: సందర్భం ప్రయాణానికి సంబంధించినదైనా, హీబ్రూ రూపకం కేవలం భౌతిక భద్రతకంటే విస్తృతంగా సరైన దారి లేదా దేవుని నడిపింపును సూచించగలదు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను పరిమితం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండో వాక్యంలోని ‘అలా చేశాను’ మొదటి వాక్యంలోని ఉపవాస ప్రకటనను ఉద్దేశిస్తుంది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
