  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/אוצא/ה אוֹתָ/ם֙ עַל אִדּ֣וֹ הָ/רֹ֔אשׁ בְּ/כָסִפְיָ֖א הַ/מָּק֑וֹם וָ/אָשִׂימָ/ה֩ בְּ/פִי/הֶ֨ם דְּבָרִ֜ים לְ֠/דַבֵּר אֶל אִדּ֨וֹ אָחִ֤י/ו ה/נתונים בְּ/כָסִפְיָ֣א הַ/מָּק֔וֹם לְ/הָֽבִיא לָ֥/נוּ מְשָׁרְתִ֖ים לְ/בֵ֥ית אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: te
  text: కాసిఫ్యా అనే స్థలంలో ప్రధానుడైన ఇద్దో దగ్గరకు నేను వారిని పంపాను. మన దేవుని మందిరం కోసం మాకు పరిచారకులను[b] తీసుకురావాలని, కాసిఫ్యా అనే స్థలంలో ఉన్న ఇద్దోతోను అతని సహోదరులైన ఆలయ సేవకులతోను[a] మాట్లాడటానికి నేను వారికి మాటలు ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆలయ సేవకులు” అనేది మూలభాషలో “నెతీనీయులు” అని పిలువబడే, దేవాలయ సేవకు నియమించబడిన ఒక ప్రత్యేక వర్గాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పరిచారకులు” అంటే దేవుని మందిరంలో సేవ చేసేవారు; తరువాతి కాలంలో ఏర్పడిన ఏదైనా అధికారిక మతపదవిని ఇది తప్పనిసరిగా సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַוֶּה אוֹתָם עַל־אִדּוֹ
  choice: ఇద్దో దగ్గరకు వెళ్లమని నేను వారికి ఆజ్ఞాపించాను
  rationale: Masoretic wording is naturally understood as Ezra commissioning or directing the men concerning Iddo. Telugu expresses the contextual direction explicitly and idiomatically.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: నాయకుడైన ఇద్దో
  rationale: הָרֹאשׁ is literally ‘the head’ and here denotes the person in charge; ‘నాయకుడు’ is clear, current Telugu without over-specifying the office.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: కాసిఫ్యా అనే స్థలంలో
  rationale: This preserves both the proper name and the explicit noun מָקוֹם (‘place’) in natural Telugu.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים לְדַבֵּר
  choice: ఏమి మాట్లాడాలో కూడా వారికి చెప్పాను
  rationale: The Hebrew idiom literally puts words in their mouths. The Telugu rendering communicates that Ezra supplied the message they were to deliver, without sounding artificial.
- source_word: אֶל־אִדּוֹ אָחִיו
  choice: ఇద్దోతో, అతని సహోదరులతో
  rationale: The form אָחִיו can denote ‘his brother’ or ‘his brothers.’ The following plural expression and the wider context favor a plural group associated with Iddo, while the wording does not force a narrower kinship category.
- source_word: הַנְּתוּנִים
  choice: ఆలయ సేవకులు
  rationale: In Ezra-Nehemiah this names the Nethinim, a recognized group assigned to sanctuary service. A functional Telugu translation is more transparent, with the traditional designation retained in a footnote.
- source_word: מְשָׁרְתִים
  choice: సేవకులు
  rationale: The word denotes persons who perform service for God’s house. ‘సేవకులు’ is natural Telugu and does not import the idea of a later ordained ecclesiastical office.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరం కోసం
  rationale: Although בַּיִת literally means ‘house,’ in this context it refers to the temple. ‘మందిరం’ communicates that referent clearly and dignifiedly in Telugu.
theological_decisions:
- issue: How to render הַנְּתוּנִים as a temple-service class
  choice: ఆలయ సేవకులు
  alternative: నెతీనీయులు
  rationale: The functional rendering makes the historical role understandable while the footnote preserves the recognized class name. This is a lexical-historical distinction, not a denominational claim.
- issue: How to distinguish מְשָׁרְתִים from הַנְּתוּנִים
  choice: సేవకులు
  alternative: పరిచారకులు
  rationale: The verse uses a broader service term for those being sought and a technical class term for the Nethinim already at Casiphia. The footnote warns against reading a later formal religious office into the term.
- issue: Whether אָחִיו is singular or plural
  choice: అతని సహోదరులు
  alternative: అతని సహోదరుడు
  rationale: The Hebrew form allows either number, but the plural context favors ‘brothers.’ The translation preserves the familial/associational wording without identifying them more narrowly.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. Hebrew idiom ‘put words in their mouths’ is rendered idiomatically as telling them what to say. ‘దేవుని మందిరం’ clarifies the contextual sense of ‘house of our God.’ Footnote markers are attached directly to the terms they explain.
