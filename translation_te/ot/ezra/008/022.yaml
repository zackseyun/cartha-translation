source:
  edition: WLC
  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: te
  text: దారిలో శత్రువు నుండి మమ్మల్ని రక్షించడానికి రాజు వద్ద సైన్యాన్ని, గుర్రపు రౌతులను అడగడానికి నేను సిగ్గుపడ్డాను.[a] ఎందుకంటే, “మన దేవుని హస్తం ఆయనను వెదికేవారందరి మేలుకోసం వారిమీద ఉంది; అయితే ఆయన బలం, ఆయన కోపం ఆయనను విడిచిపెట్టే వారందరి మీద ఉన్నాయి” అని మేము రాజుతో చెప్పాము.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రయాణంలో శత్రువుకు వ్యతిరేకంగా మాకు సహాయం చేయడానికి.” హీబ్రూ ప్రయోగం శత్రువు నుండి రక్షణ అనే భావాన్నీ, శత్రువుకు వ్యతిరేకంగా సైనిక సహాయం అనే భావాన్నీ అనుమతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మన దేవుని హస్తం” అనేది దేవుని క్రియాశీల శక్తిని లేదా అనుగ్రహాన్ని సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: నేను సిగ్గుపడ్డాను
  rationale: ఈ క్రియ కేవలం ఇబ్బందిగా అనిపించడాన్ని కాక, తాను ముందుగా ప్రకటించిన విశ్వాసానికి విరుద్ధంగా అడగడంవల్ల కలిగే సిగ్గును సూచిస్తుంది.
- source_word: חַיִל וּפָרָשִׁים
  choice: సైన్యాన్ని, గుర్రపు రౌతులను
  rationale: חַיִל ఇక్కడ రాజు సమకూర్చగల సైనిక బలగాన్ని సూచిస్తుంది; פָרָשִׁים అనేది గుర్రాలపై యుద్ధం చేసే రౌతులను స్పష్టంగా సూచిస్తుంది.
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: దారిలో శత్రువునుంచి మాకు సహాయం చేయడానికి
  rationale: מִן యొక్క సహజమైన ‘నుంచి’ భావాన్ని నిలుపుతూ, ప్రయాణంలో శత్రువు నుంచి రక్షణకై కోరే సైనిక సహాయాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַד אֱלֹהֵינוּ
  choice: మన దేవుని హస్తం
  rationale: దేవుని క్రియాశీల శక్తి, అనుగ్రహాన్ని సూచించే హీబ్రూ రూపకాన్ని వ్యాఖ్యానించి కుదించకుండా నిలుపుతుంది.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: ఆయనను వెదికే వారందరికీ మేలు కలిగేలా వారిమీద ఉంటుంది
  rationale: עַל మరియు לְטוֹבָה రెండింటి భావాలను నిలుపుతూ, దేవుని హస్తం వెదికేవారిపై వారి మేలుకోసం ఉందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: ఆయన బలం, ఆయన కోపం
  rationale: హీబ్రూలో ఉన్న రెండు సమన్విత నామవాచకాలను కలిపివేయకుండా వేర్వేరుగా నిలుపుతుంది.
- source_word: עַל כָּל עֹזְבָיו
  choice: ఆయనను విడిచిపెట్టే వారందరి మీద
  rationale: עזב యొక్క సంబంధాత్మకమైన ‘విడిచిపెట్టు’ భావాన్ని నిలుపుతుంది; ‘వదిలివెళ్లు’ కంటే ఇది సందర్భానికి తగినది.
theological_decisions:
- issue: יַד אֱלֹהֵינוּ అనే దైవ మానవరూప వర్ణన
  choice: ‘మన దేవుని హస్తం’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మన దేవుని శక్తి’ లేదా ‘మన దేవుని అనుగ్రహం’
  rationale: మూలంలోని శరీరరూపక భాష దేవుని క్రియాశీల అనుకూలతను సూచిస్తుంది; దానిని ఒకే అమూర్త భావంగా పరిమితం చేయకుండా వాక్యపు ధార్మిక వైవిధ్యాన్ని నిలుపుతుంది.
- issue: וְעֻזּוֹ וְאַפּוֹ లోని దైవిక ప్రతిఘటన
  choice: ‘ఆయన బలం, ఆయన కోపం’ అని రెండు అంశాలనూ వేరుగా అనువదించడం
  alternative: ‘ఆయన ఉగ్రశక్తి’ అని ఒకే భావంగా కలపడం
  rationale: హీబ్రూ రెండు సమన్విత పదాలను ఉపయోగిస్తుంది. వాటిని వేరుగా ఉంచడం దేవుని ప్రతిఘటనలో శక్తి, కోపం రెండూ ఉన్నాయనే ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘హస్తం’ అనే బైబిలు సందర్భానికి సుపరిచితమైన రూపక పదాన్ని నిలుపుతూ, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాము.
