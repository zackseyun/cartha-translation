revisions:
- from: దారిలో శత్రువునుంచి మాకు సహాయం చేయడానికి సైన్యాన్ని, గుర్రపు రౌతులను రాజును అడగడానికి నేను సిగ్గుపడ్డాను.[a] ఎందుకంటే, “మన దేవుని హస్తం ఆయనను వెదికే వారందరికీ మేలు కలిగేలా వారిమీద ఉంటుంది; అయితే ఆయనను విడిచిపెట్టే వారందరి మీద ఆయన బలం, ఆయన కోపం ఉంటాయి” అని మేము రాజుతో చెప్పాము.[b]
  to: దారిలో శత్రువు నుండి మమ్మల్ని రక్షించడానికి రాజు వద్ద సైన్యాన్ని, గుర్రపు రౌతులను అడగడానికి నేను సిగ్గుపడ్డాను.[a] ఎందుకంటే, “మన దేవుని హస్తం ఆయనను వెదికేవారందరి మేలుకోసం వారిమీద ఉంది; అయితే ఆయన బలం, ఆయన కోపం ఆయనను విడిచిపెట్టే వారందరి మీద ఉన్నాయి” అని మేము రాజుతో చెప్పాము.[b]
  rationale: రాజు వద్ద సైనిక బలాన్ని అడగడాన్ని స్పష్టంగా చేయడానికి వాక్యక్రమాన్ని సవరించాము. ప్రయాణంలోని శత్రు ముప్పు సందర్భంలో మూలంలోని ‘సహాయం’ ఉద్దేశాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి ‘మమ్మల్ని రక్షించడానికి’ వాడాము. దేవుని హస్తం అనే రూపకాన్ని నిలుపుతూ, వెదికేవారిపై దాని మేలుకరమైన ఉనికిని మరింత సహజంగా రూపొందించాము. బలం మరియు కోపం అనే రెండు సమన్విత అంశాలను వేరుగా ఉంచాము.
