- from: కాబట్టి యాజకులు, లేవీయులు వెండిని, బంగారాన్ని, పాత్రలను తూకం ప్రకారం స్వీకరించారు[a]—వాటిని యెరూషలేములోని మన దేవుని మందిరానికి తీసుకువెళ్లడానికి[b].
  to: కాబట్టి యాజకులు, లేవీయులు వెండి, బంగారం, పాత్రల తూకాన్ని స్వీకరించారు[a]; వాటిని యెరూషలేముకు, మన దేవుని గృహానికి తీసుకువెళ్లడానికి[b].
  rationale: The revision makes ‘తూకాన్ని’ the object received, accurately representing מִשְׁקַל and retaining its lexical ambiguity in footnote a. It also restores the Hebrew’s two coordinated destination expressions, while preserving the literal ‘house of our God’ in the text and offering ‘temple’ as a contextual alternative.
