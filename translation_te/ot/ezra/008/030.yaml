id: EZR.8.30
reference: Ezra 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/קִבְּלוּ֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מִשְׁקַ֛ל הַ/כֶּ֥סֶף וְ/הַ/זָּהָ֖ב וְ/הַ/כֵּלִ֑ים לְ/הָבִ֥יא לִ/ירוּשָׁלִַ֖ם לְ/בֵ֥ית אֱלֹהֵֽי/נוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: te
  text: కాబట్టి యాజకులు, లేవీయులు వెండి, బంగారం, పాత్రల తూకాన్ని స్వీకరించారు[a]; వాటిని యెరూషలేముకు, మన దేవుని గృహానికి తీసుకువెళ్లడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూచి నిర్ణయించిన వెండి, బంగారం, పాత్రల పరిమాణాన్ని.” హీబ్రూ పదం తూకాన్ని లేదా తూచి నిర్ణయించిన పరిమాణాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మన దేవుని మందిరానికి.” అక్షరార్థంగా, “మన దేవుని గృహానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: స్వీకరించారు
  rationale: కబల్ అనే క్రియ ఇక్కడ ఎజ్రా తదితరుల నుంచి విలువైన వస్తువులను తమ బాధ్యతలోకి తీసుకోవడాన్ని సూచిస్తుంది; ‘స్వీకరించారు’ సహజంగాను, సందర్భానికి తగినట్లుగాను ఉంది.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులు, లేవీయులు
  rationale: నిర్దిష్ట బహువచన నామాలకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాలు.
- source_word: מִשְׁקַל
  choice: తూకం ప్రకారం
  rationale: ఈ పదం తూకాన్ని లేదా తూచి నిర్ణయించిన పరిమాణాన్ని సూచించగలదు. తెలుగులో ‘తూకం ప్రకారం’ వస్తువుల కొలిచిన పరిమాణాన్ని సహజంగా తెలియజేస్తూ, మూలంలోని పరిపాలనా ఖచ్చితత్వాన్ని కాపాడుతుంది.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: వెండిని, బంగారాన్ని, పాత్రలను
  rationale: వెండి, బంగారం ప్రత్యక్ష సమానార్థాలు. כלים విస్తృతార్థకమైనా ఆలయ సంబంధ సందర్భంలో ‘పాత్రలు’ సముచితంగా, సహజంగా ఉంది.
- source_word: לְהָבִיא
  choice: తీసుకువెళ్లడానికి
  rationale: ל తో కూడిన క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది. గమ్యం యెరూషలేము కాబట్టి తెలుగులో ‘తీసుకువెళ్లడానికి’ సహజమైన ప్రయోజనార్థక అనువాదం.
- source_word: לִירוּשָׁלַם לְבֵית אֱלֹהֵינוּ
  choice: యెరూషలేములోని మన దేవుని మందిరానికి
  rationale: రెండు గమ్య సూచనలను తెలుగులో సహజంగా ఒకే నిర్మాణంగా కలిపింది. בית అక్షరార్థంగా ‘ఇల్లు/గృహం’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ స్పష్టమైన ఆధునిక తెలుగు రూపం; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఉద్దేశార్థాన్ని స్పష్టంగా ఉంచి, ‘మందిరం’ అనే సందర్భోచిత పదానికి అక్షరార్థమైన ‘గృహం’ను పాదసూచికలో ఇచ్చాం.
