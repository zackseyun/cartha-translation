  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: te
  text: 'ఏలాము కుమారులలోనుండి కూడా: అతల్యా కుమారుడైన యెషయా, అతనితో పాటు డెబ్బై మంది మగవారు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “డెబ్బై మంది పురుషులు” అని కూడా అనువదించవచ్చు. హెబ్రీలో మరింత నిర్దిష్టంగా “మగవారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עֵילָם
  choice: ఏలాము కుమారులలో
  rationale: జాబితాలోని వంశ సమూహాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. “కుమారులు” ఇక్కడ తక్షణ సంతానానికే పరిమితం కాకుండా వంశస్థులను సూచించవచ్చు.
- source_word: יְשַׁעְיָה
  choice: యెషయా
  rationale: హెబ్రీ వ్యక్తి పేరును తెలుగు ధ్వనిరీతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עֲתַלְיָה
  choice: అతల్యా కుమారుడు
  rationale: తండ్రి-కొడుకు సంబంధాన్ని తెలిపే హెబ్రీ నామనిర్మాణానికి ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: וְ/עִמּוֹ
  choice: అతనితోపాటు
  rationale: పేరు చెప్పబడిన నాయకునితో కలిసి వచ్చినవారిని సూచించే సహవాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁבְעִים
  choice: డెబ్బై మంది
  rationale: సంఖ్యను సహజమైన తెలుగు వ్యక్తుల లెక్కింపు రూపంలో అందిస్తుంది.
- source_word: הַזְּכָרִים
  choice: మగవారు
  rationale: సాధారణంగా “మనుషులు” లేదా “పురుషులు” అనే పదం కాకుండా, హెబ్రీలో ఉన్న లింగనిర్దిష్టమైన “మగవారు” అనే అర్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని పాటించాం. హెబ్రీ వాక్యంలోని జాబితా క్రమాన్ని నిలుపుతూ తెలుగు సహజత్వం కోసం “అతనితోపాటు” మరియు వ్యక్తుల లెక్కింపుకు “మంది” వాడాం.
