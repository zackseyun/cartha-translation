  rationale: The revision restores the directional/list sense of מִבְּנֵי by changing ‘కుమారులలో’ to ‘కుమారులలోనుండి’ and renders הַזְּכָרִים more precisely as ‘మగవారు.’ It preserves the Masoretic singular ‘అతనితో’ and retains both correctly anchored footnotes.
