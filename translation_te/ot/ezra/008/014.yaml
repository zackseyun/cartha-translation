  yaml_path: translation/ot/ezra/008/014.yaml
  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: te
  text: 'బిగ్వయి కుమారులలోనుండి: ఊతై, జబ్బూదు[b]; అతనితో[a] డెబ్బై మంది మగవారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘అతనితో’ అని ఏకవచనంలో ఉంది. ముందు రెండు పేర్లు ఉన్నందున కొన్ని అనువాదాలు దీనిని ‘వారితో’ అని పేర్కొంటాయి.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని పాఠసంప్రదాయాలు, ప్రాచీన అనువాదాలు ఇక్కడ రెండవ పేరును భిన్నంగా ఇస్తాయి; మసొరెటిక్ పాఠంలో ‘జబ్బూదు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారులలో
  rationale: מִן + בְּנֵי జాబితాలో బిగ్వయి వంశానికి చెందిన తదుపరి బృందాన్ని పరిచయం చేస్తుంది. ‘కుమారులు’ మూలంలోని వంశావళి రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది విస్తృతంగా ‘వారసులు/వంశస్థులు’ అని కూడా సూచించవచ్చు.
- source_word: בִגְוַי
  choice: బిగ్వయి
  rationale: వ్యక్తి లేదా వంశపేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עוּתַי
  choice: ఊతై
  rationale: వ్యక్తిపేరు; హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: ו/זבוד
  choice: జబ్బూదు
  rationale: మసొరెటిక్ పాఠంలోని זבוד అనే పేరును లిప్యంతరీకరించింది. ఇతర పాఠసంప్రదాయాల్లో భిన్నమైన రెండవ పేరు కనిపించడాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וְ/עִמּ/וֹ
  choice: అతనితో
  rationale: עִמּוֹ లోని మూడవ పురుష ఏకవచన ప్రత్యయం ‘అతనితో’ అని స్పష్టంగా సూచిస్తుంది. ముందు ఇద్దరి పేర్లు ఉన్నప్పటికీ మూలంలోని ఏకవచనాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: שִׁבְעִים
  choice: డెబ్బై
  rationale: మూలంలోని సంఖ్యకు నేరమైన సమానార్థకం.
- source_word: הַ/זְּכָרִים
  choice: పురుషులు
  rationale: זְכָרִים ప్రత్యేకంగా మగవారిని సూచిస్తుంది. జనగణన తరహా జాబితా సందర్భంలో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘పురుషులు’ ఎంచుకున్నాం.
