  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశజాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. మూలంలోని ఏకవచన అస్పష్టతను సరిచేయకుండా ప్రధాన పాఠంలోనే నిలిపి, పాదటిప్పణిలో వివరించాం.
