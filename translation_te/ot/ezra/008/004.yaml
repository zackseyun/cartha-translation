base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/004.yaml
  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: te
  text: 'పహత్-మోయాబు కుమారుల నుండి: జెరహ్యా కుమారుడు ఎల్యెహోయేనై; అతనితోపాటు రెండువందల మంది పురుషులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మగవారు.” హీబ్రూ పదం సాధారణంగా ప్రజలను సూచించే పదం కాకుండా, లింగపరంగా మగవారినే ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: కుమారులలో
  rationale: మִן ఉపసర్గను ‘లో/నుండి’ భావంతో, בְּנֵי అనే వంశసూచక పదాన్ని ‘కుమారులు’గా నిలుపుతుంది; జాబితా సందర్భంలో ఇది ఆ వంశానికి చెందినవారిని సూచిస్తుంది.
- source_word: פַּחַת מוֹאָב
  choice: పహత్-మోయాబు
  rationale: ఇది కుటుంబం లేదా వంశం పేరు; అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: אֶלְיְהוֹעֵינַי
  choice: ఎల్యెహోయేనై
  rationale: మసొరా పాఠంలోని హల్లులు, అచ్చులకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן זְרַחְיָה
  choice: జెరహ్యా కుమారుడు
  rationale: స్పష్టమైన తండ్రీకొడుకుల సంబంధాన్ని సహజ తెలుగు నామక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: וְעִמּוֹ
  choice: అతనితోపాటు
  rationale: పేరుపొందిన నాయకునితో వచ్చిన వారి సంఖ్యను సహజంగా తెలుపుతూ, హీబ్రూ సంయోజక భావాన్ని నిలుపుతుంది.
- source_word: מָאתַיִם
  choice: రెండువందల
  rationale: మూలంలోని సంఖ్యకు ప్రత్యక్ష అనువాదం.
- source_word: הַזְּכָרִים
  choice: పురుషులు
  rationale: ఈ జనగణనాత్మక జాబితాలో మగవారిని ప్రత్యేకంగా సూచించే పదం; తెలుగులో సహజంగా ‘పురుషులు’ అని ఇచ్చి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. వ్యక్తి, వంశ పేర్లు మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; ‘కుమారులు’ అనే సాంప్రదాయ వంశసూచక పదం నిలుపబడింది.
