source:
  edition: WLC
  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: te
  text: వారు రాజు శాసనాలను రాజు క్షత్రపులకు, నది అవతలి ప్రాంతపు పాలకులకు అందజేశారు.[a] వారు ప్రజలకు, దేవుని మందిరానికి[b] సహాయం చేశారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నది అవతలి ప్రాంతం” అనేది యూఫ్రటీసు నదికి పడమరనున్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా “దేవుని ఇల్లు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “తోడ్పడ్డారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “ఎత్తారు” లేదా “మోశారు” అనే భావం ఉంది; ఇక్కడ సహాయం చేయడం అనే అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: అందజేశారు
  rationale: అధికారిక శాసనాలను సామ్రాజ్య అధికారులకు అప్పగించిన సందర్భంలో, సాధారణ ‘ఇచ్చారు’ కంటే ‘అందజేశారు’ అధికారిక బదిలీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: రాజు శాసనాలు
  rationale: పర్షియా కాలపు పరిపాలనా సందర్భంలో דָּתֵי అనేది అధికారిక ఆదేశాలు లేదా శాసనాలను సూచిస్తుంది; ‘శాసనాలు’ పూర్తి న్యాయసంహిత అనే భావాన్ని అనవసరంగా రుద్దదు.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: క్షత్రపులు
  rationale: పర్షియా సామ్రాజ్యంలోని ప్రాదేశిక పాలకులకు వాడిన చారిత్రక బిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: פַחֲוֹת
  choice: అధిపతులు
  rationale: ప్రాంతీయ పాలకులు లేదా పరిపాలకులను సూచించే పదం; ‘అధిపతులు’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: עֵבֶר הַנָּהָר
  choice: నది అవతల ప్రాంతం
  rationale: యూఫ్రటీసుకు పడమరనున్న పర్షియా పరిపాలనా ప్రాంతానికి వాడిన సాంకేతిక భౌగోళిక నామాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וְנִשְּׂאוּ
  choice: సహాయం చేశారు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘ఎత్తడం/మోయడం’ ఉన్నా, ఇక్కడ ప్రజలకు మరియు దేవుని మందిరానికి ఆచరణాత్మక తోడ్పాటు అందించడం అనే సందర్భార్థం ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: హీబ్రూ పాఠం కేవలం ‘ప్రజలు’ అని చెబుతుంది; ‘ఇశ్రాయేలు ప్రజలు’ వంటి మరింత నిర్దిష్ట గుర్తింపును చేర్చలేదు.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; సందర్భంలో అది ఆలయాన్నే సూచిస్తుంది. ‘మందిరం’ తెలుగులో సహజంగా ఉండి, పవిత్ర ఆరాధనా స్థల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים ను అక్షరార్థంగా ‘దేవుని ఇల్లు’గా లేదా సందర్భార్థంగా ‘దేవుని మందిరం’గా అనువదించడం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: ఈ వచనంలోని చారిత్రక సందర్భంలో పదబంధం ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఆ సూచనను సాధారణ తెలుగు పాఠకునికి స్పష్టంగా చేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. పర్షియా పరిపాలనా బిరుదైన ‘క్షత్రపులు’ను చారిత్రక ఖచ్చితత్వం కోసం నిలిపి, ‘నది అవతల ప్రాంతం’ అనే సాంకేతిక నామానికి పాదసూచికలో వివరణ ఇచ్చాం. హీబ్రూ వాక్యంలోని కర్త కొనసాగింపును తెలుగులో స్పష్టంచేయడానికి రెండో వాక్యంలో ‘అప్పుడు’ వాడాం; ఇది కాలక్రమాన్ని బలంగా నిర్ధారించదు.
