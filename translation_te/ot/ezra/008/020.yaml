source:
  edition: WLC
  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: te
  text: లేవీయుల సేవ కోసం దావీదు మరియు అధికారులు నియమించిన ఆలయ సేవకులలో 220 మంది ఉన్నారు; వారందరూ పేరుపేరునా నమోదు చేయబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో నెతీనీమ్; ఆలయ సేవకు నియమించబడిన ఒక ప్రత్యేక సేవక వర్గానికి వాడే సాంకేతిక పదం. లేదా, ‘వారందరూ పేరుపేరునా పేర్కొనబడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: ఆలయ సేవకులు
  rationale: ఇది సాధారణ సేవకులను కాకుండా ఆలయ సేవకు అనుబంధమైన ఒక నిర్దిష్ట వర్గాన్ని సూచించే సాంకేతిక పదం. ఆధునిక తెలుగు పాఠకులకు వారి విధిని స్పష్టంగా తెలియజేయడానికి ‘ఆలయ సేవకులు’ అని అనువదించాం.
- source_word: שֶׁנָּתַן
  choice: నియమించిన
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఇచ్చిన’ అయినప్పటికీ, వ్యక్తులను లేవీయుల సేవ కోసం కేటాయించిన ఈ పరిపాలనా సందర్భంలో ‘నియమించిన’ సహజంగా భావాన్ని తెలియజేస్తుంది.
- source_word: וְהַשָּׂרִים
  choice: అధికారులు
  rationale: పాలనాపరమైన నాయకత్వ స్థానాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ప్రభువులు’ లేదా ‘రాజకుమారులు’ అనే పదాలు ఇక్కడ అనవసరమైన వంశపారంపర్య భావాన్ని కలిగించవచ్చు.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: లేవీయుల సేవ కోసం
  rationale: עֲבֹדָה లోని పని/సేవ భావాన్ని నిలుపుతూ, వీరు లేవీయులకు సంబంధించిన సేవకు కేటాయించబడ్డారని చెబుతుంది; వారి ఖచ్చితమైన అధీన సంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: 220 మంది
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను ఆధునిక పఠనానికి అనుకూలంగా అంకెలలో ఇచ్చి, వ్యక్తుల సంఖ్య కనుక ‘మంది’ చేర్చాం.
- source_word: כֻּלָּם
  choice: వారందరూ
  rationale: మూలంలోని సమగ్రతను, వ్యక్తులను సూచించే బహువచన ప్రత్యయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: పేరుపేరునా పేర్కొనబడ్డారు
  rationale: ప్రతి వ్యక్తి పేరుతో ప్రత్యేకంగా గుర్తించబడ్డాడనే అధికారిక భావాన్ని నిలుపుతుంది; ఇది పేర్ల జాబితాలో నమోదు చేయబడ్డారనే అర్థాన్నీ అనుమతిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆలయ సేవకులు’ అనే పదబంధం సాంకేతిక హీబ్రూ పదాన్ని పాఠకులకు అర్థమయ్యేలా చేస్తుంది; ప్రత్యామ్నాయ రూపం పాదసూచికలో నిలుపబడింది. మూల వాక్యంలోని పరిపాలనా ధోరణి, లేవీయుల సేవతో ఉన్న సంబంధం అతివ్యాఖ్యానం లేకుండా సంరక్షించబడ్డాయి.
