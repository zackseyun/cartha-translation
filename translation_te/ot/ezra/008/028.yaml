id: EZR.8.28
reference: Ezra 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה אֲלֵ/הֶ֗ם אַתֶּ֥ם קֹ֨דֶשׁ֙ לַ/יהוָ֔ה וְ/הַ/כֵּלִ֖ים קֹ֑דֶשׁ וְ/הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ נְדָבָ֔ה לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: te
  text: 'అప్పుడు నేను వారితో ఇలా అన్నాను: “మీరు యాహ్వేకు ప్రతిష్ఠితులు; పాత్రలు కూడా ప్రతిష్ఠితమైనవి. వెండి, బంగారం మీ పితరుల దేవుడైన యాహ్వేకు స్వచ్ఛంద అర్పణ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: అప్పుడు నేను వారితో ఇలా అన్నాను
  rationale: వయ్యిక్తోల్ రూపం కథన క్రమాన్ని కొనసాగిస్తూ ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యెహోవాకు ప్రతిష్ఠితులు
  rationale: ఇక్కడ קֹדֶשׁ వ్యక్తులు యెహోవాకు ప్రత్యేకంగా సమర్పించబడి, ఆయనకు చెందినవారనే ఆరాధనా సంబంధ స్థితిని సూచిస్తుంది. వ్యక్తుల విషయంలో ‘పరిశుద్ధులు’ కంటే ‘ప్రతిష్ఠితులు’ ఈ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הַכֵּלִים
  choice: ఈ పాత్రలు
  rationale: ఆలయ సందర్భంలో כֵּלִים పవిత్ర సేవకు ఉపయోగించే పాత్రలు లేదా సామగ్రిని సూచిస్తుంది. సమీపంలోని నిర్దిష్ట వస్తువులను చూపుతున్న సందర్భానికి ‘ఈ పాత్రలు’ సహజమైన తెలుగు.
- source_word: קֹדֶשׁ
  choice: ప్రతిష్ఠితమైనవి
  rationale: వ్యక్తులకు వాడిన అదే సమర్పిత స్థితిని పాత్రలకూ వర్తింపజేస్తూ హీబ్రూ సమాంతరతను నిలుపుతుంది.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: ఈ వెండి, బంగారం
  rationale: రెండు నిర్దిష్ట విలువైన లోహాలను సూచించే హీబ్రూ భావాన్ని సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద అర్పణ
  rationale: బలవంతం లేకుండా ఇష్టపూర్వకంగా ఇచ్చిన అర్పణ అనే పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనమైన אֲבֹתֵיכֶםను, నిబంధనాత్మక పూర్వీకుల సూత్రాన్ని నిలుపుతూ ‘మీ పితరులు’గా అనువదించాం.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: קֹדֶשׁ యొక్క ఆరాధనా సంబంధ భావం
  choice: ప్రతిష్ఠితులు / ప్రతిష్ఠితమైనవి
  alternative: పరిశుద్ధులు / పరిశుద్ధమైనవి
  rationale: ఈ సందర్భంలో నైతిక పరిపూర్ణతకంటే యెహోవాకు ప్రత్యేకంగా సమర్పించబడిన స్థితి ముందుంటుంది. అందువల్ల ‘ప్రతిష్ఠిత’ అనే పదం సందర్భార్థాన్ని స్పష్టంగా చూపుతుంది; అయినా ‘పరిశుద్ధ’ అనేది సాధ్యమైన సంప్రదాయ ప్రత్యామ్నాయం.
- issue: אֱלֹהֵי אֲבֹתֵיכֶם అనే నిబంధనాత్మక పదబంధం
  choice: మీ పితరుల దేవుడు
  alternative: మీ పూర్వీకుల దేవుడు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్నీ, ఇశ్రాయేలు పితరులతో సంబంధమున్న సంప్రదాయ నిబంధన సూత్రాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆలయ సంబంధ కర్మకాండ భావాన్ని స్పష్టంచేయడానికి ‘ప్రతిష్ఠిత’ మరియు ‘స్వచ్ఛంద అర్పణ’ పదాలను వాడాం. ప్రత్యక్ష సంభాషణలో ‘వారితో ఇలా అన్నాను’ సహజ తెలుగు ప్రవాహాన్ని ఇస్తుంది.
