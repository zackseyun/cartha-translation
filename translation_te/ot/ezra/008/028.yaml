revisions:
- from: 'అప్పుడు నేను వారితో ఇలా అన్నాను: “మీరు యెహోవాకు ప్రతిష్ఠితులు; ఈ పాత్రలు కూడా ప్రతిష్ఠితమైనవి. ఈ వెండి, బంగారం మీ పితరుల దేవుడైన యెహోవాకు స్వచ్ఛంద అర్పణ.”'
