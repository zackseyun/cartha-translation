  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י עַזְגָּ֔ד יוֹחָנָ֖ן בֶּן הַ/קָּטָ֑ן וְ/עִמּ֕/וֹ מֵאָ֥ה וַ/עֲשָׂרָ֖ה הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: te
  text: అజ్గాదు కుమారులలో[a] హక్కాతాను[b] కుమారుడైన యోహానాను; అతనితోపాటు 110 మంది పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అజ్గాదు వంశస్థులలో.’ హీబ్రూ భాషలో ‘కుమారులు’ అనే మాట తక్షణ కుమారులనే కాక విస్తృతమైన వంశపరంపరను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదాన్ని వ్యక్తినామంగా కాక వర్ణనాత్మకంగా తీసుకుంటే, ‘చిన్నవాని కుమారుడు’ లేదా ‘యువకుని కుమారుడు’ అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారులలో
  rationale: מִן + בְּנֵי జాబితాలో మరో వంశగుంపును పరిచయం చేస్తుంది. ‘కుమారులు’ మూలంలోని వంశావళి రూపాన్ని నిలుపుతుంది; ఇక్కడ అది విస్తృతంగా వంశస్థులను కూడా సూచించగలదు.
- source_word: עַזְגָּד
  choice: అజ్గాదు
  rationale: వ్యక్తి లేదా వంశనామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: יוֹחָנָן
  choice: యోహానాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామశైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן הַ/קָּטָן
  choice: హక్కాతాను కుమారుడైన
  rationale: ఈ పేర్ల జాబితాలో הַקָּטָן తండ్రి పేరుగా పనిచేస్తున్నట్లు గ్రహించి, నిర్దిష్ట ఉపపదంతో కూడిన రూపాన్ని ‘హక్కాతాను’గా లిప్యంతరీకరించాం; వర్ణనాత్మక అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְ/עִמּוֹ
  choice: అతనితోపాటు
  rationale: పేర్కొన్న నాయకునితో వచ్చిన గుంపు సంఖ్యను తెలిపే ఎజ్రా 8లోని సాధారణ జాబితా సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: 110 మంది
  rationale: హీబ్రూ సంఖ్య ‘నూట పది’ని ఆధునిక పఠన సౌలభ్యం కోసం అంకెలలో ఇచ్చాం.
- source_word: הַ/זְּכָרִים
  choice: పురుషులు
  rationale: זְכָרִים లింగాన్ని ప్రత్యేకంగా సూచిస్తుంది. తెలుగు సందర్భంలో ‘పురుషులు’ సహజంగా ఉండి, మూలంలోని పురుష లింగ సూచనను నిలుపుతుంది.
