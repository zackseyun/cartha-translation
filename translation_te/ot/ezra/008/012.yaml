translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా మరియు గౌరవప్రదంగా నిలిపాం. వ్యక్తినామాలను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; వంశసంబంధమైన మరియు పేరుకు సంబంధించిన నిజమైన సందిగ్ధతలను పాదసూచికల్లో సంరక్షించాం.
