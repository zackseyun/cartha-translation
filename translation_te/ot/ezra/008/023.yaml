revisions:
- from: కాబట్టి మేము ఉపవాసముండి, ఈ విషయం గురించి మా దేవుణ్ణి వేడుకున్నాము; ఆయన మా మొరను ఆలకించాడు.[a]
  to: కాబట్టి మేము ఉపవాసముండి, ఈ విషయం గురించి మా దేవుని దగ్గర వేడుకున్నాము; ఆయన మా విన్నపానికి స్పందించాడు.[a]
  rationale: The revision makes the divine-response verb more faithful to its favorable-entreaty sense and expresses the Hebrew prepositional relation in natural Telugu. It does not specify how God answered or whether every requested outcome was granted.
