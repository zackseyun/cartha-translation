  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: te
  text: కాబట్టి మేము ఉపవాసముండి, ఈ విషయం గురించి మా దేవుని దగ్గర వేడుకున్నాము; ఆయన మా విన్నపానికి స్పందించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మా విన్నపాన్ని ఆలకించాడు.” మరింత అక్షరార్థంగా, “ఆయన మా చేత వేడుకోబడ్డాడు.”
    reason: וַיֵּעָתֵר לָנוּ నిఫ్అల్ రూపం విన్నపానికి అనుకూల స్పందనను సూచిస్తుంది; అక్షరార్థ నిష్క్రియ రూపాన్ని ప్రధాన పాఠ్యంలో యాంత్రికంగా ఉపయోగించకుండా ప్రత్యామ్నాయంగా సూచించబడింది.
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: మేము ఉపవాసముండి
  rationale: צוּם అనే క్రియ నేరుగా ‘ఉపవాసముండు’ అని అర్థం. ఇక్కడ ఉపవాసాన్ని ప్రకటించామని కాక, సమూహం ఉపవాసముందని చెబుతోంది.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: మా దేవుణ్ణి వేడుకున్నాము
  rationale: בקשׁ కు ‘వెదకు, అడుగు, వేడుకొను’ అనే అర్థాలున్నాయి. מן తో కూడిన ఈ ప్రార్థనా సందర్భంలో దేవుని నుండి సహాయం కోరడం భావం; ఆధునిక తెలుగులో ‘దేవుణ్ణి వేడుకొను’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עַל זֹאת
  choice: ఈ విషయం గురించి
  rationale: అక్షరార్థంగా ‘దీనిని గురించి/దీనికోసం’; ఇది ముందు ప్రస్తావించిన ప్రయాణ భద్రత విషయాన్ని సూచిస్తుంది. ‘ఈ విషయం గురించి’ మూలంలోని సూచనను స్పష్టంగా, అతివ్యాఖ్య లేకుండా ఉంచుతుంది.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: ఆయన మా మొరను ఆలకించాడు
  rationale: עתר నిఫ్అల్ రూపం విన్నపానికి అనుకూలంగా స్పందించడాన్ని సూచిస్తుంది. ‘మా మొరను ఆలకించాడు’ అనేది తెలుగులో సహజంగా ఉండి, కేవలం వినడం కాక అనుకూల స్పందన భావాన్ని అందిస్తుంది; మూలంలోని అపురూపమైన నిష్క్రియ నిర్మాణాన్ని యాంత్రికంగా అనుసరించదు.
theological_decisions:
- issue: וַיֵּעָתֵר అనే దైవిక స్పందన క్రియను ఎలా అనువదించాలి
  choice: ఆయన మా మొరను ఆలకించాడు
  alternative: ఆయన మా విన్నపానికి స్పందించాడు; మరింత అక్షరార్థంగా, ఆయన మా చేత వేడుకోబడ్డాడు
  rationale: హీబ్రూ క్రియ దేవుడు వారి విన్నపానికి అనుకూలంగా స్పందించాడని తెలియజేస్తుంది. ‘ఆలకించాడు’ ఆ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; అయితే దేవుడు ఏ విధంగా సమాధానం ఇచ్చాడో పాఠ్యంలో లేనందున అదనపు వివరాలు చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మొరను ఆలకించాడు’ ప్రార్థనా సందర్భానికి తగిన ఉన్నతమైన కానీ సులభమైన ప్రయోగం.
