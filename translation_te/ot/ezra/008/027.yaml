  yaml_path: translation/ot/ezra/008/027.yaml
  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: te
  text: వెయ్యి దారికుల విలువైన ఇరవై బంగారు గిన్నెలను[a], బంగారమంత విలువైన ఉత్తమ మెరుపుగల కంచు పాత్రలు రెండింటిని[b] కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెయ్యి దారికులకు ఇరవై బంగారు గిన్నెలు.” హెబ్రీ వాక్యాన్ని ఈ ఇరవై గిన్నెల మొత్తం విలువ వెయ్యి దారికులని తెలిపేదిగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మేలైన మెరుగుపెట్టిన కంచు పాత్రలు రెండు.” కంచును వర్ణించే అరుదైన హెబ్రీ పదబంధం ప్రత్యేకంగా నాణ్యమైన, మెరుస్తున్న పనితనాన్ని సూచించే అవకాశముంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: గిన్నెలు
  rationale: బంగారం వంటి విలువైన పదార్థంతో చేసిన, ఆలయ సామగ్రి జాబితాలోని గుండ్రని పాత్రలను సూచించడానికి ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: వెయ్యి దారికుల విలువగల
  rationale: ‘దారికు’ అనే చారిత్రక పారసీక నాణెం/బరువు పేరును నిలిపి ఉంచుతూ, ל ఉపసర్గ ఇక్కడ విలువను సూచిస్తుందనే సంభావ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలిగినా, తయారుచేసిన విలువైన పాత్రల సందర్భంలో కంచు అనేది తగిన ఎంపిక.
- source_word: מֻצְהָב טוֹבָה
  choice: ఉత్తమమైన మెరుస్తున్న
  rationale: అరుదైన ఈ వర్ణన ఉన్నత నాణ్యతతో, కాంతివంతంగా తయారైన కంచును సూచించే అవకాశముంది. పాత్రలు నిజంగా బంగారు పూత పూయబడినవని నిర్ధారించకుండా ఈ భావాన్ని నిలుపుతుంది.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: బంగారమంత విలువైన
  rationale: పాత్రల అధిక విలువను బంగారంతో చేసిన స్పష్టమైన పోలికగా సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆలయ ధనసామగ్రి జాబితాకు తగిన గంభీరతను ఉంచుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఉపయోగించాం. ఈ వచనం ముందున్న క్రియపై ఆధారపడే జాబితా భాగమైనప్పటికీ, విడిగా చదివినప్పుడు స్పష్టత కోసం ‘తీసుకువచ్చారు’ అని చేర్చాం.
