id: EZR.8.18
reference: Ezra 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֨יאּוּ לָ֜/נוּ כְּ/יַד אֱלֹהֵ֨י/נוּ הַ/טּוֹבָ֤ה עָלֵ֨י/נוּ֙ אִ֣ישׁ שֶׂ֔כֶל מִ/בְּנֵ֣י מַחְלִ֔י בֶּן לֵוִ֖י בֶּן יִשְׂרָאֵ֑ל וְ/שֵׁרֵֽבְיָ֛ה וּ/בָנָ֥י/ו וְ/אֶחָ֖י/ו שְׁמֹנָ֥ה עָשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: te
  text: మా దేవుని అనుగ్రహకరమైన హస్తం మాపై ఉండగా[a], వారు ఇశ్రాయేలు కుమారుడైన లేవి కుమారుడైన మహలీ వంశస్థులలోనుండి వివేకం గల ఒక వ్యక్తిని, అంటే షేరెబ్యాను, అతని కుమారులను, అతని సహోదరులను మా దగ్గరకు తీసుకొచ్చారు—పద్దెనిమిది మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా దేవుని మంచి హస్తం మాపై ఉన్న ప్రకారం.” ఈ హీబ్రూ నుడికారం దేవుని అనుకూలమైన దయా సహాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: వారు ... మా దగ్గరకు తీసుకొచ్చారు
  rationale: בוא ధాతువు హిఫీల్ రూపం ఈ కథన సందర్భంలో ‘తీసుకురావడం’ అనే అర్థం ఇస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా క్రియను చివర ఉంచాం.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: మా దేవుని దయగల హస్తం మాపై ఉన్నందున
  rationale: దేవుని అనుకూలమైన కార్యనిర్వహణను సూచించే ‘హస్తం’ అనే హీబ్రూ రూపకాన్ని నిలిపి, הַטּוֹבָה భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘దయగల’ అని వ్యక్తపరిచాం.
- source_word: אִישׁ שֶׂכֶל
  choice: వివేకంగల ఒక వ్యక్తి
  rationale: שׂכל ఇక్కడ కేవలం నైపుణ్యాన్ని కాక అవగాహన, విచక్షణ, వివేకాన్ని సూచిస్తుంది.
- source_word: מִבְּנֵי מַחְלִי
  choice: మహలి కుమారుల్లోనుండి
  rationale: בני అనే వంశావళి పదంలోని ‘కుమారులు/వంశస్థులు’ భావాన్ని సాధ్యమైనంత ప్రత్యక్షంగా నిలిపాం; తరువాతి వాక్యభాగం ఇది వంశసంబంధమని స్పష్టం చేస్తుంది.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుడైన లేవి కుమారుడు
  rationale: రెండుసార్లు వచ్చిన בן వంశావళి నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో నిలిపాం.
- source_word: וְשֵׁרֵבְיָה
  choice: అంటే ... షేరెబ్యాను
  rationale: וְ ఇక్కడ ముందుగా పేర్కొన్న వివేకంగల వ్యక్తి ఎవరో వివరిస్తున్న సమానాధికార సంబంధంగా అర్థమవుతుంది; ‘అంటే’ దాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבָנָיו וְאֶחָיו
  choice: అతని కుమారులతో, సహోదరులతో కలిపి
  rationale: షేరెబ్యాతో వచ్చిన కుటుంబ సభ్యుల రెండు వర్గాలనూ నిలిపి, మొత్తం సంఖ్యతో వాటి సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: שְׁמֹנָה עָשָׂר
  choice: మొత్తం పద్దెనిమిది మంది
  rationale: హీబ్రూలో నామవాచకం పునరుక్తం కాకపోయినా, తెలుగులో సంఖ్య ఎవరిని లెక్కిస్తుందో స్పష్టంగా ఉండేందుకు ‘మంది’ చేర్చాం; ‘మొత్తం’ షేరెబ్యా, అతని కుమారులు, సహోదరులు కలిసిన సంఖ్యగా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని హస్తాన్ని గురించి ఉన్న అనుగ్రహకరమైన దైవపరిపాలన రూపకం
  choice: మా దేవుని దయగల హస్తం మాపై ఉన్నందున
  alternative: మా దేవుని మంచి హస్తం మాపై ఉన్న ప్రకారం
  rationale: ‘హస్తం’ అనే మూల రూపకాన్ని తొలగించకుండా ఉంచుతూ, దేవుని అనుకూల కార్యాన్ని సూచించే ఈ నుడికారాన్ని సహజ తెలుగులో అందించాం. దీన్ని సాధారణ ‘ఆశీర్వాదం’గా మార్చి భావాన్ని కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘హస్తం’ అనే బైబిలీయ రూపకాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే ‘దయగల’ అనే విశేషణంతో కలిపాం. వంశావళి నిర్మాణాన్ని నిలిపినా, తెలుగు పఠనసౌలభ్యం కోసం పదక్రమాన్ని సవరించాం.
