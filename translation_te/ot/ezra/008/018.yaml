    text: లేదా, “మా దేవుని మంచి హస్తం మాపై ఉన్న ప్రకారం.” ఈ హీబ్రూ నుడికారం దేవుని అనుకూలమైన దయా సహాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
