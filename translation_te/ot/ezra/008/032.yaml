  text: So we came to Jerusalem and stayed there three days.
translation:
  language: te
  text: మేము యెరూషలేముకు వచ్చి, అక్కడ మూడు రోజులు ఉన్నాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּבוֹא
  choice: మేము ... వచ్చి
  rationale: בוא అనే క్రియకు ప్రాథమిక అర్థం ‘వచ్చు’. వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; తెలుగులో సంయుక్త క్రియారూపమైన ‘వచ్చి’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేముకు
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చి, గమ్యాన్ని సూచించడానికి ‘కు’ విభక్తిని చేర్చాం.
- source_word: וַנֵּשֶׁב
  choice: ఉన్నాము
  rationale: ישב కు కూర్చోవడం, నివసించడం, ఉండడం అనే అర్థపరిధి ఉంది. ప్రయాణం ముగిసిన తర్వాత తాత్కాలికంగా అక్కడ గడిపిన సందర్భంలో ‘ఉన్నాము’ సహజమైన, అతిగా వ్యాఖ్యానించని ఎంపిక.
- source_word: שָׁם
  choice: అక్కడ
  rationale: యెరూషలేమును తిరిగి సూచించే సాధారణ స్థలవాచక క్రియావిశేషణం.
- source_word: יָמִים שְׁלֹשָׁה
  choice: మూడు రోజులు
  rationale: ఇది కాలవ్యవధిని సూచిస్తుంది. తెలుగులో ‘మూడు రోజులు ఉన్నాము’ అనే నిర్మాణమే వ్యవధిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని సంఘటనల క్రమాన్ని సహజమైన తెలుగు సంయుక్త వాక్యంగా నిలిపాం.
