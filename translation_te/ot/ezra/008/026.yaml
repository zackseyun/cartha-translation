translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి వాడబడింది. ‘వారి చేతికి’ అనే రూపం మూలభాషలోని స్పష్టమైన చేతి రూపకాన్ని నిలుపుతుంది; ‘తూచి అప్పగించాను’ బాధ్యతగా అందజేయడాన్ని సహజంగా తెలియజేస్తుంది.
