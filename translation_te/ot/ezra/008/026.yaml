language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁקֲלָ֨/ה עַל יָדָ֜/ם כֶּ֗סֶף כִּכָּרִים֙ שֵֽׁשׁ מֵא֣וֹת וַ/חֲמִשִּׁ֔ים וּ/כְלֵי כֶ֥סֶף מֵאָ֖ה לְ/כִכָּרִ֑ים זָהָ֖ב מֵאָ֥ה כִכָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: te
  text: అప్పుడు నేను ఆరువందల యాభై తలాంతుల వెండిని, వంద తలాంతుల వెండి పాత్రలను[a], వంద తలాంతుల బంగారాన్ని వారి చేతుల్లోకి తూచి అప్పగించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో ఈ పదబంధం సంక్షిప్తంగా ఉంది: అక్షరార్థంగా, ‘వెండి పాత్రలు—తలాంతులకు వంద.’ ఈ పాత్రలు మొత్తంగా వంద తలాంతులకు సమానమని సూచిస్తుంది; అది వాటి బరువునో విలువనో సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: తూచి అప్పగించాను
  rationale: ఈ సందర్భంలో క్రియ విలువైన వస్తువులను బరువు చూసి బాధ్యతగా అప్పగించడాన్ని సూచిస్తుంది. ‘తూచి అప్పగించాను’ అనే ప్రయోగం కొలవడం, అందజేయడం అనే రెండు భావాలనూ సహజంగా తెలియజేస్తుంది.
- source_word: עַל יָדָם
  choice: వారి చేతికి
  rationale: హీబ్రూ భాషలోని ‘వారి చేతిమీద/చేతికి’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, వారి బాధ్యతకు అప్పగించాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ నాణేలుగా ఉన్న డబ్బు కాకుండా, బరువుతో కొలిచిన విలువైన లోహం ఉద్దేశించబడింది.
- source_word: כִּכָּרִים
  choice: తలాంతులు
  rationale: כִּכָּר అనేది పెద్ద బరువు ప్రమాణం. బైబిలు సందర్భంలో సుపరిచితమైన ‘తలాంతు’ రూపాన్ని ఉపయోగించడం సముచితం.
- source_word: שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: ఆరువందల యాభై
  rationale: వెండి తలాంతుల సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యారూపంలో అనువదిస్తుంది.
- source_word: וּכְלֵי כֶסֶף
  choice: వెండి పాత్రలను
  rationale: כְּלִי అనే పదానికి పాత్రలు, సామగ్రి, ఉపకరణాలు అనే విస్తృత అర్థాలున్నాయి. ఆలయ ధనసామగ్రి జాబితాలో ‘పాత్రలు’ సహజమైన, గౌరవప్రదమైన ఎంపిక.
- source_word: מֵאָה לְכִכָּרִים
  choice: వంద తలాంతుల బరువుగల
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది. సందర్భానుసారం ఇది వెండి పాత్రల మొత్తం బరువు లేదా విలువ వంద తలాంతులు అని సూచిస్తుంది; తెలుగులో వాక్యం అర్థవంతంగా ఉండేందుకు ‘బరువుగల’ అని వ్యక్తం చేయబడింది, అలాగే మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలిపాం.
- source_word: זָהָב
  choice: బంగారం
  rationale: విలువైన లోహమైన బంగారానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: מֵאָה כִכָּר
  choice: వంద తలాంతులు
  rationale: బంగారం పరిమాణాన్ని సూచించే సంఖ్య, బరువు ప్రమాణాన్ని నేరుగా అనువదిస్తుంది.
