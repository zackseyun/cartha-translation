  text: וְ/אֵ֛לֶּה רָאשֵׁ֥י אֲבֹתֵי/הֶ֖ם וְ/הִתְיַחְשָׂ֑/ם הָ/עֹלִ֣ים עִמִּ֗/י בְּ/מַלְכ֛וּת אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ מִ/בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: te
  text: 'అర్తహషస్త రాజు పరిపాలన కాలంలో బబులోను నుండి నాతో కలిసి వచ్చినవారి పితృకుటుంబాల పెద్దలు, వారి వంశావళి నమోదు[a] ఇవి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి వంశావళి” లేదా “వంశావళి ప్రకారం నమోదైనవారు.” హెబ్రీ పదం కేవలం పూర్వీకుల పరంపరను మాత్రమే కాక, వంశావళి ఆధారంగా చేసిన నమోదు లేదా దాని పట్టికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: కొత్త జాబితాను పరిచయం చేసే సూచనార్థక రూపం. హెబ్రీ సంధానకారకాన్ని తెలుగులో వాక్య నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: వారి పితృకుటుంబాల పెద్దలు
  rationale: ఇక్కడ ‘తండ్రులు’ అనేది వ్యక్తిగత పూర్వికులను మాత్రమే కాక పితృవంశ కుటుంబ విభాగాలను సూచిస్తుంది; ‘పెద్దలు’ ఆయా కుటుంబాల ప్రధాన ప్రతినిధులను సహజంగా తెలియజేస్తుంది.
- source_word: וְהִתְיַחְשָׂם
  choice: వారి వంశావళి నమోదు
  rationale: ఈ పదం కేవలం వంశపరంపర అనే భావం కాక, వంశక్రమం ప్రకారం చేసిన నమోదు లేదా పట్టికను సూచిస్తుంది.
- source_word: הָעֹלִים עִמִּי
  choice: నాతో కలిసి వచ్చినవారు
  rationale: עלה తిరిగి యూదా/యెరూషలేముకు వెళ్లడాన్ని సూచించే సంప్రదాయ క్రియ. గమ్యస్థానం ఈ వచనంలో స్పష్టంగా లేకపోవడం వల్ల తెలుగులో అసహజమైన ‘పైకి వచ్చిన’కు బదులు సందర్భానుగుణమైన ‘వచ్చిన’ను వాడాం.
- source_word: בְּמַלְכוּת ... הַמֶּלֶךְ
  choice: అర్తహషస్త రాజు పరిపాలన కాలంలో
  rationale: రాజు పాలించిన కాలాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: అర్తహషస్త
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరించాం.
- source_word: מִבָּבֶל
  choice: బబులోను నుండి
  rationale: మూలంలోని ప్రయాణ ఆరంభస్థలాన్ని నేరుగా తెలియజేస్తుంది.
