  text: Everything was counted by number and by weight, and the total weight was recorded at that time.
translation:
  language: te
  text: అన్నిటినీ లెక్కపెట్టి తూచారు; ఆ సమయంలో మొత్తం బరువు నమోదు చేయబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: లెక్క ప్రకారం
  rationale: מִסְפָּר అంటే సంఖ్య లేదా లెక్క. విలువైన వస్తువుల జాబితా పరిశీలన సందర్భంలో, తెలుగు సహజత్వంతో పాటు మూలంలోని నామవాచక నిర్మాణాన్ని ఇది నిలుపుతుంది.
- source_word: בְּמִשְׁקָל
  choice: బరువు ప్రకారం
  rationale: מִשְׁקָל అంటే బరువు. ముందున్న ‘లెక్క ప్రకారం’తో సమాంతరంగా మూలంలోని విధాన సూచనను కాపాడుతుంది.
- source_word: לַכֹּל
  choice: అన్నిటినీ
  rationale: ఈ పదబంధం అప్పగించిన సమస్త వస్తువులకూ లెక్కించడం, తూచడం వర్తించిందని సూచిస్తుంది. ‘అన్నిటినీ’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: וַיִּכָּתֵב
  choice: నమోదు చేశారు
  rationale: כתב నిఫ్అల్ రూపం అక్షరార్థంగా ‘వ్రాయబడింది.’ పరిపాలనా సందర్భంలో ‘నమోదు చేశారు’ అధికారికంగా రికార్డు చేయడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; తెలుగు కర్తరహిత బహువచన ప్రయోగం మూలంలోని కర్తను పేర్కొనని భావాన్ని కాపాడుతుంది.
- source_word: כָּל הַמִּשְׁקָל
  choice: మొత్తం బరువును
  rationale: అక్షరార్థంగా ‘బరువు అంతటినీ.’ ఈ జాబితా సందర్భంలో ‘మొత్తం బరువు’ కూడిన సంపూర్ణ పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఈ కాలసూచక పదబంధం అప్పగింత, పరిశీలన జరిగిన నిర్దిష్ట సమయాన్ని సూచిస్తుంది. ‘ఆ సమయంలో’ సూచనార్థాన్ని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన పరిపాలనా శైలి. ‘లెక్క ప్రకారం, బరువు ప్రకారం’ అనే సమాంతర నిర్మాణం హీబ్రూ వాక్య నిర్మాణాన్ని ప్రతిబింబిస్తుంది. మూలంలోని పారా విభాగ సూచికను వచనంలోకి అనువదించలేదు.
