base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: te
  text: రాజు, అతని సలహాదారులు, అతని అధికారులు, అక్కడ ఉన్న ఇశ్రాయేలీయులందరూ మన దేవుని మందిరం కోసం సమర్పించిన కానుకను[a]—వెండిని, బంగారాన్ని, పాత్రలను—నేను తూచి వారికి ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అర్పణను.” హీబ్రూ పదం పవిత్ర వినియోగం కోసం వేరుచేసి ఇచ్చిన దానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה
  choice: నేను తూచి ... అప్పగించాను
  rationale: שקל యొక్క ప్రాథమిక భావం ‘తూచుట.’ לָהֶםతో కూడిన ఈ సందర్భంలో, కొలిచిన విలువైన వస్తువులను వారి బాధ్యతకు ఇవ్వడం ఉద్దేశం; అందుకే సహజమైన తెలుగులో ‘తూచి వారికి అప్పగించాను’ అని ఇచ్చాం.
- source_word: לָהֶם
  choice: వారికి
  rationale: ל ఉపసర్గ ఇక్కడ స్వీకర్తలను సూచిస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: బంగారం, పాత్రలతో పాటు ఆలయ విలువైన వస్తువుల జాబితాలో ఉన్నందున ‘డబ్బు’ కంటే లోహమైన ‘వెండి’ సరిపోతుంది.
- source_word: הַזָּהָב
  choice: బంగారం
  rationale: విలువైన లోహాన్ని నేరుగా సూచించే సహజ తెలుగు పదం.
- source_word: הַכֵּלִים
  choice: పాత్రలు
  rationale: כֵּלִים అనేది వస్తువులు లేదా ఉపకరణాలకు విస్తృత పదం; ఆలయ సందర్భంలో ‘పాత్రలు’ సహజమైనది, సంప్రదాయబద్ధమైనది.
- source_word: תְּרוּמַת
  choice: కానుక
  rationale: పవిత్ర వినియోగం కోసం వేరుచేసి ఇచ్చిన విరాళాన్ని సూచిస్తుంది. ‘కానుక’ దానం భావాన్ని సులభంగా తెలియజేస్తూ, ప్రత్యేక బలివిధిని అనవసరంగా సూచించదు.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: మన దేవుని మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మన దేవుని ఇల్లు.’ ఆధునిక తెలుగులో ఇక్కడ ఉద్దేశించిన ఆలయాన్ని ‘మందిరం’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֵרִימוּ
  choice: సమర్పించిన
  rationale: అక్షరార్థంగా ‘పైకెత్తారు’ అయినా, ఈ సందర్భంలో పవిత్ర ప్రయోజనం కోసం కానుకగా సమర్పించడాన్ని సూచించే ఆచార సంబంధ ప్రయోగం.
- source_word: יֹעֲצָיו
  choice: అతని సలహాదారులు
  rationale: రాజుకు సలహా ఇచ్చేవారిని స్పష్టంగా సూచిస్తుంది.
- source_word: שָׂרָיו
  choice: అతని అధికారులు
  rationale: పర్షియా పరిపాలనా సందర్భంలో ‘అధికారులు’ వారి విధిని తెలియజేస్తుంది; రాజవంశీయులనే భావాన్ని రుద్దదు.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: అక్కడ ఉన్న ఇశ్రాయేలీయులందరూ
  rationale: సమర్పణ సమయంలో అక్కడ ఉన్న ఇశ్రాయేలు సమూహాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆలయ కానుక సందర్భంలో תְּרוּמָה అనువాదం
  choice: కానుక
  alternative: అర్పణ
  rationale: ఈ వాక్యం మందిరం కోసం ఇచ్చిన వెండి, బంగారం, పాత్రలను గురించి చెబుతోంది. ‘కానుక’ పవిత్ర వినియోగం కోసం ఇచ్చిన దానాన్ని తెలియజేస్తుంది; ఒక నిర్దిష్ట బలివిధిని ఇందులోకి తీసుకురాదు. ‘అర్పణ’ కూడా సాధ్యమైనందున పాదటిప్పణిలో ఉంచాం.
- issue: בֵּית אֱלֹהֵינוּ అనువాదం
  choice: మన దేవుని మందిరం
  alternative: మన దేవుని ఇల్లు
  rationale: ‘ఇల్లు’ మూలపాఠ రూపకాన్ని అక్షరార్థంగా నిలుపుతుంది; అయితే ఈ సందర్భంలో అది ఆలయాన్నే సూచిస్తున్నందున ఆధునిక సాధారణ తెలుగులో ‘మందిరం’ స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని కానుక–వెండి–బంగారం–పాత్రలు అనే సమానాధికార సంబంధాన్ని గీతలతో నిలిపాం. తెలుగులో సహజ వాక్యక్రమం కోసం దాతలను ముందుకు తెచ్చాం; שקל మరియు לָהֶם కలిపి సూచించే తూచి బాధ్యతగా ఇవ్వడాన్ని ‘తూచి వారికి అప్పగించాను’గా వ్యక్తం చేశాం.
