source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֥י שְׁלוֹמִ֖ית בֶּן יוֹסִפְיָ֑ה וְ/עִמּ֕/וֹ מֵאָ֥ה וְ/שִׁשִּׁ֖ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: te
  text: షెలోమీతు కుమారుల నుండి[a], యోసిఫ్యా కుమారుడైన షెలోమీతు, అతనితో పాటు 160 మంది మగవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెలోమీతు వంశస్థుల నుండి”; హీబ్రూలో అక్షరార్థంగా “షెలోమీతు కుమారుల నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: కుమారులలో
  rationale: ఈ వంశావళి జాబితాలో ‘కుమారులు’ అనేది వంశస్థులు లేదా కుటుంబ సభ్యులను సూచించే సంప్రదాయ వంశపదం; ‘లో’ అనే రూపం హీబ్రూలోని విభాగార్థక מִן భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁלוֹמִית
  choice: షెలోమీతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: בֶּן יוֹסִפְיָה
  choice: యోసిఫ్యా కుమారుడొకడు
  rationale: మసొరెటిక్ పాఠంలో నాయకుని వ్యక్తిగత పేరు కనిపించకుండా ‘యోసిఫ్యా కుమారుడు’ మాత్రమే ఉంది. తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు ‘ఒకడు’ చేర్చినా, మూలంలోని అనిశ్చితిని తొలగించే పేరును ఊహించి చేర్చలేదు.
- source_word: וְ/עִמּוֹ
  choice: అతనితోపాటు
  rationale: పేరు చెప్పబడని యోసిఫ్యా కుమారునితో వచ్చిన సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: 160 మంది
  rationale: ఆధునిక పఠనసౌలభ్యం కోసం సంఖ్యను అంకెలలో ఇచ్చి, వ్యక్తుల లెక్కకు తగిన ‘మంది’ వాడింది.
- source_word: הַזְּכָרִים
  choice: పురుషులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా మగవారిని సూచిస్తుంది. జాబితా సందర్భంలో గౌరవప్రదమైన, సాధారణ తెలుగు పదంగా ‘పురుషులు’ ఎంచుకుంది; ఇది తప్పనిసరిగా వయోజనులనే సూచిస్తుందని నిర్ణయించదు.
