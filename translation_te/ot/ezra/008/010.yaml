  to: షెలోమీతు కుమారుల నుండి[a], యోసిఫ్యా కుమారుడైన షెలోమీతు, అతనితో పాటు 160 మంది మగవారు.
  rationale: The revision restores the explicit WLC apposition, “Shelomith, son of Josiphiah,” rather than supplying an unnamed son. It also renders the partitive/listing preposition with “నుండి” and retains the source’s concise census-list form.
