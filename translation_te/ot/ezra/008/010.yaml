translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి పాటించబడింది. WLC పాఠంలో షెలోమీతును ‘యోసిఫ్యా కుమారుడు’గా నేరుగా కలపడం వ్యాకరణపరంగా క్లిష్టం; సమాంతర జాబితా నిర్మాణం ప్రకారం పేరు లుప్తమైన యోసిఫ్యా కుమారుడు నాయకుడని భావించే పాఠ్య ఉద్రిక్తతను అనువాదం కాపాడింది.
