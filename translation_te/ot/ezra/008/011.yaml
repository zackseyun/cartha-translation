  text: 'And from the sons of Bebai: Zechariah son of Bebai[a], and with him twenty-eight males.'
translation:
  language: te
  text: బేబయి కుమారులలోనుండి[a] బేబయి కుమారుడైన జెకర్యా; అతనితో పాటు ఇరవై ఎనిమిది మంది పురుషులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బేబయి కుమారులు” అనే హీబ్రూ పదబంధం విస్తృతార్థంలో బేబయి వంశస్థులను లేదా అతని కుటుంబవర్గానికి చెందినవారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: కుమారులలో
  rationale: హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; ఈ వంశావళి సందర్భంలో ఇది విస్తృతంగా వంశస్థులను లేదా కుటుంబవర్గ సభ్యులను కూడా సూచించవచ్చు.
- source_word: בֵבַי
  choice: బేబయి
  rationale: వ్యక్తి/వంశ నామాన్ని ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా, మూలరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: ఇక్కడ తండ్రి-కొడుకు సంబంధాన్ని తెలిపే ప్రత్యక్ష నామనిర్మాణం కావడంతో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: וְעִמּוֹ
  choice: అతనితో పాటు
  rationale: జెకర్యాతో కలిసి వచ్చినవారిని సూచించే హీబ్రూ సంయుక్త ఉపసర్గ పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: ఇరవై ఎనిమిది
  rationale: హీబ్రూ సంఖ్యకు నేరమైన తెలుగు సమానం.
- source_word: הַזְּכָרִים
  choice: మంది పురుషులు
  rationale: హీబ్రూ పదం లింగాన్ని ప్రత్యేకంగా సూచిస్తుంది. తెలుగు వ్యక్తుల లెక్కింపులో సహజమైన 'మంది'తో కలిసి 'పురుషులు' అని అనువదించడం ఖచ్చితత్వాన్నీ సహజత్వాన్నీ కాపాడుతుంది.
