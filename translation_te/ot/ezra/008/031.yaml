source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: te
  text: మొదటి నెల పన్నెండో రోజున మేము యెరూషలేముకు వెళ్లడానికి అహవా నది నుండి బయలుదేరాము. మా దేవుని చేయి మాపై ఉంది; శత్రువు చేతి నుండి, దారిలో మాటువేసి ఉన్నవాడి నుండి[a] ఆయన మమ్మల్ని విడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాటుదాడి నుండి.’ హీబ్రూ పదం మాటువేసి ఉన్న వ్యక్తిని సూచించవచ్చు; సందర్భంలో మాటుదాడి అనే ప్రమాదాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: మేము బయలుదేరాము
  rationale: נסע ఇక్కడ శిబిరాన్ని ఎత్తి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘బయలుదేరాము’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִנְּהַר אֲהֲוָא
  choice: అహవా నది దగ్గరనుంచి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది. నదిలోనుంచి బయలుదేరినట్లు అపార్థం రాకుండా తెలుగులో సహజమైన ‘నది దగ్గరనుంచి’ వాడబడింది.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల పన్నెండో రోజున
  rationale: హీబ్రూలో ‘రోజు’ అధ్యాహారంగా ఉంది; తెలుగులో కాలసూచన స్పష్టంగా ఉండేందుకు దాన్ని చేర్చాం.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: యెరూషలేముకు వెళ్లడానికి
  rationale: הלך క్రియార్థక రూపం ప్రయోజనాన్ని తెలియజేస్తుంది; ఈ అనువాదం దానిని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: మా దేవుని చెయ్యి మాకు తోడుగా ఉంది
  rationale: దేవుని క్రియాశీల అనుగ్రహం, రక్షణను తెలిపే ‘చెయ్యి’ అనే మూలభాషా రూపకాన్ని నిలిపి, עלינו భావాన్ని తెలుగులో సహజమైన ‘మాకు తోడుగా’తో తెలిపాం.
- source_word: וַיַּצִּילֵנוּ
  choice: ఆయన మమ్మల్ని విడిపించాడు
  rationale: נצל ప్రమాదం లేదా శత్రు ఆధిపత్యం నుంచి కాపాడి విడిపించడాన్ని సూచిస్తుంది; ‘విడిపించాడు’ తరువాతి ‘చేతినుంచి’తో సహజంగా సరిపోతుంది.
- source_word: מִכַּף אוֹיֵב
  choice: శత్రువు చేతినుంచి
  rationale: כף అక్షరార్థంగా అరచెయ్యి/చెయ్యి, ఇక్కడ అధికారం లేదా పట్టు అనే భావం. ‘చేతినుంచి’ మూలరూపకాన్ని, దేవుని చెయ్యితో ఉన్న సాహిత్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וְאוֹרֵב
  choice: మాటువేసి ఉన్నవాడి నుంచి
  rationale: אֹרֵב పుం. ఏకవచన కర్తృవాచక కృదంతం; అందువల్ల వ్యక్తిని సూచించే పఠనాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ప్రమాదం/మాటుదాడి అనే సమూహార్థం కూడా సాధ్యమని పాదటిప్పణిలో తెలిపాం.
- source_word: עַל הַדָּרֶךְ
  choice: దారిలో
  rationale: అక్షరార్థం ‘దారి మీద’; ప్రయాణమధ్యంలో ఎదురైన ముప్పును ఆధునిక తెలుగులో ‘దారిలో’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక రక్షణకు మానవరూపకమైన ‘దేవుని చెయ్యి’
  choice: మూలంలోని ‘మా దేవుని చెయ్యి’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మా దేవుడు మమ్మల్ని కాపాడాడు’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: ఎజ్రా–నెహెమ్యాలో దేవుని అనుగ్రహం, క్రియాశీల రక్షణకు ‘చెయ్యి’ పునరావృతమయ్యే ముఖ్య రూపకం. దాన్ని తొలగించకుండా, తెలుగులో అర్థమయ్యే విధంగా ‘మాకు తోడుగా ఉంది’ అన్నాం.
- issue: אֹרֵב వ్యక్తినా లేక మాటుదాడి ప్రమాదమా
  choice: ‘మాటువేసి ఉన్నవాడు’ అనే వ్యక్తివాచక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘మాటుదాడి’ లేదా ‘మాటుదాడుల నుంచి’
  rationale: హీబ్రూ రూపం కర్తృవాచక కృదంతంగా వ్యక్తిని నేరుగా సూచించగలదు; అయితే సందర్భంలో సమూహ ముప్పు లేదా మాటుదాడి అనే భావం సాధ్యమే. ఆ సందిగ్ధతను పాదటిప్పణితో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘దేవుని చెయ్యి’ మరియు ‘శత్రువు చెయ్యి’ అనే మూలభాషా సమాంతర రూపకాలు నిలుపబడ్డాయి.
