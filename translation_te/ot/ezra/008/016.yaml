  terminology: “ప్రధానులు” is an appropriate contextual rendering of רָאשִׁים, with the literal Hebrew image supplied in the footnote. “వివేకవంతులు” faithfully represents מְבִינִים without imposing a more specific office such as teachers. The transliterated names are consistent and readable.
