id: EZR.8.16
reference: Ezra 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֡/ה לֶ/אֱלִיעֶ֡זֶר לַ/אֲרִיאֵ֡ל לִֽ֠/שְׁמַעְיָה וּ/לְ/אֶלְנָתָ֨ן וּ/לְ/יָרִ֜יב וּ/לְ/אֶלְנָתָ֧ן וּ/לְ/נָתָ֛ן וְ/לִ/זְכַרְיָ֥ה וְ/לִ/מְשֻׁלָּ֖ם רָאשִׁ֑ים וּ/לְ/יוֹיָרִ֥יב וּ/לְ/אֶלְנָתָ֖ן מְבִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: te
  text: అప్పుడు నేను ఎలీయెజెరు, అరీయేలు, షెమయా, ఎల్నాతాను, యారీబు, ఎల్నాతాను, నాతాను, జెకర్యా, మెషుల్లాము అనే ప్రధానులను[a], అలాగే వివేకవంతులైన[b] యోయారీబు, ఎల్నాతానులను పిలిపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘తలలు’; అంటే నాయకులు లేదా ప్రముఖులు.
    reason: lexical_alternative
  - marker: b
    text: ‘వివేకవంతులు’ అనే మాటను ‘అవగాహనగలవారు’ లేదా ‘పాండిత్యంగలవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: అప్పుడు ... పిలిపించాను
  rationale: ఈ సందర్భంలో שׁלח అనేది తదుపరి కథన చర్యను సూచిస్తుంది. జాబితాలోని వ్యక్తులకు కేవలం సందేశం పంపడం కాక, వారిని తన దగ్గరకు రప్పించడమే భావం కాబట్టి సహజమైన తెలుగులో ‘పిలిపించాను’ అని అనువదించబడింది.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: ఎలీయెజెరు ... ఎల్నాతానులను
  rationale: పునరావృతమయ్యే ל సమన్లు పంపబడిన వ్యక్తులను సూచిస్తుంది. తెలుగులో ‘పిలిపించాను’ అనే క్రియతో కర్మవిభక్తిని పేర్ల చివర సహజంగా జోడించాం.
- source_word: רָאשִׁים
  choice: ప్రధానులు
  rationale: హీబ్రూలో అక్షరార్థం ‘తలలు’; సందర్భంలో నాయకత్వ స్థానం లేదా ప్రముఖ హోదా గలవారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రధానులు’ సహజంగా ఈ భావాన్ని అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מְבִינִים
  choice: వివేకవంతులు
  rationale: בין ధాతువు నుంచి వచ్చిన ఈ రూపం అవగాహన, వివేచన లేదా పాండిత్యం గల వ్యక్తులను వర్ణిస్తుంది. అధికారికంగా ‘బోధకులు’ అని అతిగా నిర్దిష్టీకరించకుండా ‘వివేకవంతులు’ మూల భావాన్ని నిలుపుతుంది.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: వివేకవంతులైన యోయారీబు, ఎల్నాతానులను
  rationale: చివరి విశేషణ పదం సహజంగా చివరి ఇద్దరి పేర్లనే వర్ణిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఆ సంబంధం స్పష్టంగా ఉండేందుకు విశేషణాన్ని పేర్ల ముందు ఉంచాం.
- source_word: יוֹיָרִיב
  choice: యోయారీబు
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: אֶלְנָתָן
  choice: ఎల్నాతాను
  rationale: ఈ పేరు వచనంలో మూడుసార్లు ఉన్నందున, వేర్వేరు వ్యక్తులు ఒకే పేరు కలిగి ఉండే అవకాశాన్ని తొలగించకుండా ప్రతిసారీ అలాగే నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. పేర్ల జాబితాను మూలంలోని క్రమంలోనే ఉంచి, ఎల్నాతాను అనే పేరు మూడుసార్లు రావడాన్ని యథాతథంగా నిలిపాం.
