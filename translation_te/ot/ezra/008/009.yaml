  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/בְּנֵ֣י יוֹאָ֔ב עֹבַדְיָ֖ה בֶּן יְחִיאֵ֑ל וְ/עִמּ֕/וֹ מָאתַ֛יִם וּ/שְׁמֹנָ֥ה עָשָׂ֖ר הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: te
  text: 'యోవాబు వంశస్థుల నుండి: యెహీయేలు కుమారుడు ఓబద్యా, అతనితో పాటు 218 మంది మగవారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי יוֹאָב
  choice: యోవాబు వంశస్థులలో
  rationale: ఈ జాబితాలో בְּנֵי ఒక వంశానికి లేదా కుటుంబ సమూహానికి చెందినవారిని సూచిస్తుంది; ప్రత్యక్ష కుమారులు అనే భావాన్ని అనవసరంగా పరిమితం చేయకుండా ‘వంశస్థులు’ అని అనువదించాం.
- source_word: עֹבַדְיָה בֶּן יְחִיאֵל
  choice: యెహీయేలు కుమారుడు ఓబద్యా
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, వ్యక్తి పేర్లను ప్రామాణికంగా లిప్యంతరీకరించాం.
- source_word: וְעִמּוֹ
  choice: అతనితోపాటు
  rationale: పేర్కొన్న నాయకునితో కలిసి వచ్చినవారిని సూచించే హీబ్రూ సమన్వయ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: 218 మంది
  rationale: జాబితాలో సులభంగా చదవడానికి సంఖ్యను అంకెల్లో ఇచ్చాం; ‘మంది’ వ్యక్తుల లెక్కను సహజంగా సూచిస్తుంది.
- source_word: הַזְּכָרִים
  choice: మగవారు
  rationale: ఈ హీబ్రూ పదం వయోజన పురుషులకే పరిమితం కాకుండా మగ లింగానికి చెందినవారిని సూచిస్తుంది; అందువల్ల ‘పురుషులు’ కంటే ‘మగవారు’ మూలార్థాన్ని మరింత ఖచ్చితంగా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని, గౌరవప్రదమైన సహజ భాషను ఉపయోగించాం. ఆంగ్ల సంప్రదింపుల పాఠంలో [a] గుర్తు ‘యెహీయేలు’ తర్వాత ఉండగా, దాని పాదటిప్పణి సంఖ్యకు ప్రత్యామ్నాయం చెబుతూ అసంబద్ధంగా ఉంది; మూల హీబ్రూలో ఎలాంటి పాఠభేదం లేదా అవసరమైన ప్రత్యామ్నాయం లేనందున దాన్ని తెలుగు ముసాయిదాలో చేర్చలేదు.
