- from: యోవాబు వంశస్థులలో యెహీయేలు కుమారుడు ఓబద్యా; అతనితోపాటు 218 మంది మగవారు.
  to: 'యోవాబు వంశస్థుల నుండి: యెహీయేలు కుమారుడు ఓబద్యా, అతనితో పాటు 218 మంది మగవారు.'
