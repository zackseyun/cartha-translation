source:
  edition: WLC
  text: וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בֶּ/עָרִ֑ים וַ/יֵּאָסְפ֥וּ הָ/עָ֛ם כְּ/אִ֥ישׁ אֶחָ֖ד אֶל יְרוּשָׁלִָֽםס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: te
  text: ఏడవ నెల రాగానే, ఇశ్రాయేలు కుమారులు పట్టణాల్లో ఉండగా, ప్రజలు ఒక్క మనిషిలా యెరూషలేముకు కూడివచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక్క మనిషిలా’ అనేది వారందరూ ఏకమై, ఒకే సంకల్పంతో చర్య తీసుకున్నారని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: రాగానే
  rationale: కాలాన్ని సూచించే సందర్భంలో נגע అనే క్రియ ‘చేరడం/రావడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు కాలవాక్యంలో ‘ఏడవ నెల రాగానే’ సహజంగా ఉంది.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల
  rationale: హీబ్రూ కాలపదబంధాన్ని నెలకు తరువాతి పేరును చేర్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: బְּנֵי అనే పురుష బహువచన రూపాన్ని స్పష్టంగా నిలుపుతూ, మూలంలోని వంశసంబంధ వ్యక్తీకరణను ప్రతిబింబిస్తుంది.
- source_word: בֶּעָרִים
  choice: పట్టణాల్లో ఉన్నప్పుడు
  rationale: హీబ్రూలో క్రియ లేకుండా ఉన్న స్థలవాచక నిర్మాణాన్ని సహజమైన తెలుగులో ‘ఉన్నప్పుడు’ అని స్పష్టం చేస్తుంది; మూలంలో లేని ‘వారి’ని చేర్చలేదు.
- source_word: וַיֵּאָסְפוּ
  choice: సమావేశమయ్యారు
  rationale: నిఫాల్ రూపం ప్రజలు ఒకచోట కూడడాన్ని సూచిస్తుంది; ‘సమావేశమయ్యారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: הָעָם
  choice: ప్రజలంతా
  rationale: הָעָם సమాజాన్ని సమష్టిగా సూచిస్తుంది. ‘ప్రజలంతా’ ఆ సమష్టి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּאִישׁ אֶחָד
  choice: ఒక్క మనిషిలా
  rationale: ‘ఒక మనిషివలె’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ వారి ఏకీకృత చర్యను వ్యక్తపరుస్తుంది.
- source_word: אֶל יְרוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: אֶל సాధారణంగా గమ్యాన్ని సూచించినా, ‘సమావేశమవడం’తో తెలుగు వాడుకలో సమావేశ స్థలాన్ని ‘యెరూషలేములో’ అని చెప్పడం సహజం; గమ్యభావం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל మరియు כְּאִישׁ אֶחָד లోని లింగసూచక సమష్టి భాష
  choice: ‘ఇశ్రాయేలు కుమారులు’, ‘ఒక్క మనిషిలా’ అని మూలంలోని పురుష రూపాలను నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’, ‘ఒక్కటిగా/ఏకమనస్సుతో’
  rationale: హీబ్రూ సమష్టి ప్రయోగాల్లోని పురుష రూపాలను ప్రధాన పాఠ్యంలో పారదర్శకంగా ఉంచుతుంది; ‘ఒక్క మనిషిలా’ అనే రూపకం ఐక్యచర్యను సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే హీబ్రూ రూపకం మరియు లింగసూచక సమష్టి పదబంధాలు నిలుపబడ్డాయి.
