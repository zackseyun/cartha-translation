  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: te
  text: అప్పుడు వారు రాళ్లు చెక్కేవారికి, నిపుణులైన పనివారికి డబ్బు[a] ఇచ్చారు. లెబానోను నుండి దేవదారు కలపను యొప్పా సముద్రతీరానికి[b] తీసుకురావడానికి సీదోనీయులకు, తూరీయులకు ఆహారం, పానీయం, నూనె ఇచ్చారు. పారసీక రాజైన కోరెషు వారికి ఇచ్చిన అనుమతి[c] ప్రకారమే వారు ఇలా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెండి.’ హీబ్రూ పదం లోహమైన వెండిని లేదా చెల్లింపులో ఉపయోగించే డబ్బును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘యొప్పా సముద్రానికి’; ‘యొప్పా రేవుకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘పారసీక రాజైన కోరెషు వారికి చేసిన మంజూరు ప్రకారం.’ హీబ్రూ పదం అనుమతి లేదా అధికారిక మంజూరును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: అప్పుడు వారు ... ఇచ్చారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כֶסֶף
  choice: డబ్బు
  rationale: మూలపదానికి ‘వెండి’ అనే లోహార్థం ఉన్నప్పటికీ, చెల్లింపు సందర్భంలో ‘డబ్బు’ అనే ఆర్థిక అర్థం సహజం; ప్రత్యక్షార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַחֹצְבִים
  choice: రాళ్లు చెక్కేవారికి
  rationale: חצב ధాతువు రాయిని కొట్టడం, చెక్కడం లేదా గనిలో తవ్వడం సూచిస్తుంది; ఆలయ నిర్మాణ సందర్భంలో ఈ రూపం స్పష్టంగా ఉంది.
- source_word: וְלֶחָרָשִׁים
  choice: నిపుణులైన పనివారికి
  rationale: חָרָשׁ వివిధ పదార్థాలతో పనిచేసే నైపుణ్యంగల శిల్పి లేదా పనివాడిని సూచించగలదు; నిర్దిష్ట వృత్తిని అనవసరంగా నిర్ణయించకుండా నైపుణ్యాన్ని నిలుపుతుంది.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: ఆహారం, పానీయం, నూనె
  rationale: ఇవి సరఫరాగా ఇచ్చిన వస్తువుల జాబితా; משתה ఇక్కడ విందు అనే సంఘటనకన్నా పానీయాన్ని సూచిస్తుంది.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: సీదోనీయులకు, తూరీయులకు
  rationale: సీదోను, తూరు ప్రాంతాల ప్రజలను సూచించే జననామాలకు ప్రామాణిక తెలుగు రూపాలు.
- source_word: לְהָבִיא
  choice: తీసుకురావడానికి
  rationale: సరఫరాలు ఇవ్వడంలోని ఉద్దేశాన్ని తెలిపే హీబ్రూ ఉద్దేశార్థక క్రియారూపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲצֵי אֲרָזִים
  choice: దేవదారు కలపను
  rationale: నిర్మాణ సందర్భంలో దేవదారు చెట్లనుంచి సిద్ధమయ్యే నిర్మాణ కలపను సూచించే సహజమైన తెలుగు రూపం; ‘దుంగలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: מִן הַלְּבָנוֹן
  choice: లెబానోను నుండి
  rationale: దేవదారు కలప వచ్చిన భౌగోళిక మూలాన్ని నేరుగా అనువదిస్తుంది.
- source_word: אֶל יָם יָפוֹא
  choice: యొప్పా సముద్రతీరానికి
  rationale: అక్షరార్థంగా ‘యొప్పా సముద్రానికి’; సందర్భంలో యొప్పా సముద్రతీరం లేదా రేవు ఉద్దేశించబడింది. ‘సముద్రతీరం’ మూలరూపానికి దగ్గరగా ఉంటూనే తెలుగులో అర్థవంతంగా ఉంది.
- source_word: כְּרִשְׁיוֹן ... עֲלֵיהֶם
  choice: వారికి ఇచ్చిన అనుమతి ప్రకారం
  rationale: రాజు మంజూరు చేసిన అధికారిక అనుమతిని సహజ తెలుగులో వ్యక్తపరుస్తుంది; עֲלֵיהֶם యొక్క సంబంధార్థాన్ని ‘వారికి’గా అందిస్తుంది.
