translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పొడవైన హీబ్రూ వాక్యాన్ని మూడు తెలుగు వాక్యాలుగా విభజించి సంబంధాలను స్పష్టపరిచాం. వ్యక్తి, స్థలనామాలకు ‘కోరెషు, పారసీక, లెబానోను, యొప్పా, సీదోనీయులు, తూరీయులు’ రూపాలు వాడాం.
