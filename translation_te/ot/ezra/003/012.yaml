translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇల్లు’ అనే అక్షరార్థానికి బదులు సందర్భస్పష్టత కోసం ‘మందిరం’ వాడినా, ‘మొదటి/మునుపటి’ అనే భావసంభావ్యతను పాదటిప్పణిలో నిలిపాం. రెండు సమూహాల విరుద్ధ భావోద్వేగాలను ఏదీ తగ్గించకుండా సమాంతరంగా వ్యక్తం చేశాం.
