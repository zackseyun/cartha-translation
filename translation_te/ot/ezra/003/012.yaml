  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: te
  text: అయితే యాజకుల్లో, లేవీయుల్లో, పితృవంశాల నాయకుల్లో[a] చాలామంది—మొదటి మందిరాన్ని[b] చూసిన వృద్ధులు—ఈ మందిరానికి తమ కళ్లముందే పునాది వేయబడినప్పుడు[c] బిగ్గరగా ఏడ్చారు; చాలామంది ఆనందంతో గొంతెత్తి ఆనందధ్వని చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితృవంశాల నాయకులు’ అంటే పూర్విక కుటుంబ సమూహాలకు లేదా వంశాలకు నాయకులుగా ఉన్నవారు.
    reason: cultural_note
  - marker: b
    text: ‘మొదటి మందిరం’ అని ఉన్న హీబ్రూ మాటను ‘మునుపటి మందిరం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఈ మందిరం స్థాపించబడినప్పుడు.’ హీబ్రూ పదం పునాది వేయడాన్ని లేదా స్థాపించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: అయితే యాజకుల్లో, లేవీయుల్లో, పితృవంశాల నాయకుల్లో చాలామంది
  rationale: מִן‌ను భాగవాచకంగా ‘ల్లో చాలామంది’ అని అనువదించాం. ముందరి వచనంలోని ఆనందధ్వనికి ఇక్కడి ఏడుపు వ్యతిరేకంగా ఉండటంతో וְకు సందర్భానుసారంగా ‘అయితే’ వాడాం. רָאשֵׁי הָאָבוֹת అనేది పూర్విక కుటుంబ లేదా వంశ సమూహాల నాయకులను సూచిస్తుంది.
- source_word: הַזְּקֵנִים אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: మొదటి మందిరాన్ని చూసిన వృద్ధులు
  rationale: ఈ సందర్భంలో הַזְּקֵנִים అధికార పదవికన్నా వయస్సును ప్రధానంగా సూచిస్తుంది; వారు మునుపటి మందిరాన్ని చూసేంత వయస్సుగలవారు. בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ స్పష్టంగా దేవాలయాన్ని సూచిస్తున్నందున సహజమైన తెలుగులో ‘మందిరం’ అని ఇచ్చాం.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת בְּעֵינֵיהֶם
  choice: ఈ మందిరానికి తమ కళ్లముందే పునాది వేయబడినప్పుడు
  rationale: יסד రూపం పునాది వేయడాన్ని లేదా స్థాపించడాన్ని సూచిస్తుంది. నిర్మాణ సందర్భాన్ని స్పష్టంగా ఉంచుతూ, בְּעֵינֵיהֶםలోని ప్రత్యక్ష సాక్ష్య భావాన్ని ‘తమ కళ్లముందే’ అని నిలిపాం.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: బిగ్గరగా ఏడ్చారు
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న చర్యను చూపుతుంది. తెలుగు కథన శైలిలో ‘బిగ్గరగా ఏడ్చారు’ సహజంగా ఉండి, గొప్ప స్వరంతో రోదించిన భావాన్ని కాపాడుతుంది.
- source_word: וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: మరోవైపు చాలామంది ఆనందంతో గొంతెత్తి జయధ్వని చేశారు
  rationale: రెండు సమూహాల ఏకకాల విరుద్ధ స్పందనను ‘మరోవైపు’ తెలియజేస్తుంది. תְּרוּעָה యొక్క ఘోష లేదా జయధ్వని భావం, שִׂמְחָה యొక్క ఆనంద భావం, לְהָרִים קוֹלలోని గొంతెత్తడం అన్నీ నిలిపాం.
