  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని ‘కేక’ పదమూల పునరుక్తిని ప్రధాన పాఠ్యంలో కొంత సహజీకరించి, పాదటిప్పణిలో అక్షరార్థ నిర్మాణాన్ని చూపించాం.
