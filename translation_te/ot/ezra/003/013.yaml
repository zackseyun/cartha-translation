source:
  edition: WLC
  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: te
  text: ఆనంద కేకల శబ్దాన్నీ ప్రజల ఏడుపు శబ్దాన్నీ ప్రజలు వేరుచేసి గుర్తించలేకపోయారు[a]. ఎందుకంటే ప్రజలు గొప్ప కేకలు వేస్తున్నారు[b], ఆ శబ్దం చాలా దూరం వరకు వినిపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆనంద కేకల శబ్దాన్ని ప్రజల ఏడుపు శబ్దం నుంచి వేరుచేసి గుర్తించలేకపోయారు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘గొప్ప కేకతో కేకలు వేస్తున్నారు’; దీనిని ‘బిగ్గరగా కేకలు వేస్తున్నారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: తేడాను ... గుర్తించలేకపోయారు
  rationale: హిఫిల్ రూపం ఇక్కడ రెండు శబ్దాలను వేరుచేసి గుర్తించే సామర్థ్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קוֹל
  choice: శబ్దం
  rationale: ఇక్కడ మాటల విషయంకన్నా వినిపించే ధ్వనులే ప్రధానమైనందున ‘శబ్దం’ సముచితం.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: ఆనంద కేకల శబ్దం
  rationale: תְּרוּעָה లోని బిగ్గర కేక భావాన్నీ, הַשִּׂמְחָה లోని ఆనంద భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: ప్రజల ఏడుపు శబ్దం
  rationale: రెండు వినిపించే ధ్వనుల మధ్య పోలికను నిలుపుతూ, בְּכִי యొక్క భావోద్వేగ బలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְרִיעִים
  choice: కేకలు వేస్తున్నారు
  rationale: కొనసాగుతున్న బిగ్గర కేకల చర్యను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּרוּעָה גְדוֹלָה
  choice: గొప్పగా కేకలు
  rationale: మూలంలోని ‘గొప్ప కేక’ భావాన్ని తెలుగులో సహజమైన క్రియావిశేషణ నిర్మాణంతో అందిస్తుంది; సందర్భంలో శబ్ద తీవ్రతను సూచిస్తుంది.
- source_word: נִשְׁמַע
  choice: వినిపించింది
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עַד לְמֵרָחוֹק
  choice: చాలా దూరం వరకు
  rationale: శబ్దం సుదూర ప్రాంతం వరకు చేరిందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
