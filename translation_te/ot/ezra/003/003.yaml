id: EZR.3.3
reference: Ezra 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: te
  text: వారు బలిపీఠాన్ని దాని పునాదులపై[a] స్థాపించారు; చుట్టుపక్కల దేశాల ప్రజలవల్ల వారికి భయం కలిగింది[b]. వారు దానిమీద యాహ్వేకు దహనబలులు అర్పించారు—ఉదయం, సాయంత్రం దహనబలులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని ఆధారంపై” లేదా “దాని నిర్దేశిత స్థలంలో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “దేశాల ప్రజల నుండి వారికి భయం ఉండెను,” అంటే చుట్టుపక్కల ప్రజల కారణంగా వారు భయపడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: నిలిపారు
  rationale: כון హిఫీల్ రూపం ఇక్కడ బలిపీఠాన్ని తగిన చోట ఏర్పాటు చేసి వినియోగానికి సిద్ధం చేయడాన్ని సూచిస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠాన్ని
  rationale: బలి సందర్భంలో מזבחకు సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: עַל מְכ֣וֹנֹתָיו
  choice: దాని పునాదుల మీద
  rationale: מְכוֹנוֹת అనే బహువచనం పునాదులు, ఆధారాలు లేదా స్థిరస్థానాన్ని సూచించగలదు; ప్రధాన పాఠం దాని దృశ్యరూపాన్ని నిలుపుతుంది, పాదటిప్పణి ప్రత్యామ్నాయాలను తెలియజేస్తుంది.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם מֵעַמֵּי הָאֲרָצוֹת
  choice: ఎందుకంటే చుట్టుపక్కల దేశాల ప్రజలవల్ల వారికి భయం పట్టుకుంది
  rationale: హీబ్రూ వాక్యంలోని ‘వారిమీద భయం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, מִן సూచించే మూలం/కారణాన్ని ‘ప్రజలవల్ల’గా ఉంచింది. సందర్భానుసారంగా ‘చుట్టుపక్కల’ అని స్పష్టీకరించబడింది.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: వారు దానిమీద దహనబలులు అర్పించారు
  rationale: עלה హిఫీల్ + עֹלוֹת అనేది దహనబలులు అర్పించడానికి వాడే స్థిరమైన బైబిలీయ ప్రయోగం. మసొరెటిక్ పాఠంలోని క్రియ ఏకవచనంగా ఉన్నా, సందర్భంలోని సమూహ కర్తను తెలుగులో సహజంగా బహువచనంతో కొనసాగించాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన ప్రత్యక్ష రూపం ‘యెహోవా’గా ఇచ్చాం.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: ఉదయం, సాయంత్రం దహనబలులు
  rationale: మూలంలోని దహనబలుల పునరుక్తిని నిలుపుతూ, క్రమమైన రెండు అర్పణ సమయాలను సహజ తెలుగులో తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగు బైబిల్ వినియోగంలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ అనే ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
- issue: ప్రజల భయమే బలిపీఠ నిర్మాణానికి కారణమా, లేక భయమున్నప్పటికీ నిర్మించారా?
  choice: మూలంలోని కారణసూచక అనుసంధానాన్ని అలాగే ఉంచడం
  alternative: భయపడినప్పటికీ వారు బలిపీఠాన్ని నిలిపారు
  rationale: כִּי సాధారణంగా కారణాన్ని సూచిస్తుంది; వాక్యంలో ఉన్న ఉద్రిక్తతను వివరణాత్మకంగా ‘అయినప్పటికీ’గా మార్చకుండా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడాం. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, ‘వారికి భయం పట్టుకుంది’ వంటి సహజ ప్రయోగాన్ని ఎంచుకున్నాం; అయితే పునాదులు, దహనబలుల పునరుక్తి, కారణసూచక సంబంధం వంటి మూలపాఠ లక్షణాలను నిలుపుకున్నాం.
