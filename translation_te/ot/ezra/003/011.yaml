source:
  edition: WLC
  text: וַֽ֠/יַּעֲנוּ בְּ/הַלֵּ֨ל וּ/בְ/הוֹדֹ֤ת לַֽ/יהוָה֙ כִּ֣י ט֔וֹב כִּֽי לְ/עוֹלָ֥ם חַסְדּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/כָל הָ/עָ֡ם הֵרִיעוּ֩ תְרוּעָ֨ה גְדוֹלָ֤ה בְ/הַלֵּל֙ לַֽ/יהוָ֔ה עַ֖ל הוּסַ֥ד בֵּית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: te
  text: 'వారు యాహ్వేను స్తుతిస్తూ, ఆయనకు కృతజ్ఞతలు చెల్లిస్తూ ప్రతిస్పందనగా పాడారు[a]: “ఆయన మంచివాడు, ఎందుకంటే ఇశ్రాయేలు పట్ల ఆయన స్థిరమైన ప్రేమ శాశ్వతమైనది[b].” యాహ్వే మందిరం స్థాపించబడినందుకు[c], ప్రజలందరూ యాహ్వేను స్తుతిస్తూ పెద్ద కేక వేశారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు జవాబిచ్చారు.” ఇక్కడి హీబ్రూ క్రియకు “జవాబిచ్చారు” లేదా “ప్రతిస్పందించారు” అనే అర్థం రావచ్చు; ఈ ఆరాధనా సందర్భంలో బృందాలు ఒకదానికి మరొకటి ప్రతిస్పందిస్తూ పాడినట్లు భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలు పట్ల ఆయన స్థిరమైన ప్రేమ ఎన్నటికీ నిలుస్తుంది.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “యాహ్వే మందిరం స్థాపించబడినందుకు.” ఈ సందర్భంలో ఇది దేవాలయ పునాది వేయబడటాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: ప్రతిస్పందనగా పాడారు
  rationale: ఆరాధనా సందర్భంలో ענה పరస్పరంగా లేదా ప్రతిస్పందనగా పాడడాన్ని సూచించగలదు. తెలుగు పాఠకులకు ఆ భావం సహజంగా అర్థమయ్యేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: స్తుతిస్తూ, ఆయనకు కృతజ్ఞతలు చెల్లిస్తూ
  rationale: స్తుతి, కృతజ్ఞత అనే రెండు వేర్వేరు ఆరాధనా క్రియలనూ సహజమైన తెలుగు క్రియారూపాల్లో నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరించింది.
- source_word: כִּי טוֹב
  choice: ఆయన మంచివాడు
  rationale: హీబ్రూ స్తుతి సూత్రంలోని సంక్షిప్త భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַסְדּוֹ
  choice: ఆయన స్థిరమైన ప్రేమ
  rationale: חסדలోని విశ్వసనీయత, నిలకడ, కృపతో కూడిన ప్రేమ అనే విస్తృత భావాన్ని మతపరమైన అదనపు వివరణ లేకుండా అందిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పట్ల
  rationale: ఇక్కడ עַל ప్రేమ ఎవరిపట్ల ఉందో సూచిస్తుంది; ‘పట్ల’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: గొప్పగా కేకలు వేశారు
  rationale: హీబ్రూలోని ఒకే ధాతువుతో ఏర్పడిన బలమైన వ్యక్తీకరణను అసహజమైన పునరుక్తి లేకుండా తీవ్రతతో అందిస్తుంది.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: యాహ్వే మందిరం స్థాపించబడినందుకు
  rationale: Hophal రూపంలోని ‘స్థాపించబడింది’ అనే భావాన్ని నేరుగా నిలుపుతూ, సందర్భంలోని దేవాలయాన్ని ‘మందిరం’గా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా గుర్తించగల తెలుగు లిప్యంతరీకరణలో ఉంచింది.
- issue: חסד యొక్క ఒడంబడిక సంబంధ భావవ్యాప్తి
  choice: స్థిరమైన ప్రేమ
  alternative: కృప / కనికరం / నిబంధన ప్రేమ
  rationale: ఈ పదాన్ని కేవలం కనికరానికి పరిమితం చేయకుండా దాని నిలకడైన, విశ్వసనీయమైన ప్రేమ భావాన్ని ఉంచుతుంది; ‘నిబంధన ప్రేమ’ అని అనువదించి మూలంలో అంత స్పష్టంగా లేని వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: సామాన్య ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన వచనశైలిని ఉపయోగించాం. ఆరాధనా భాషలో సహజమైన ‘స్తుతిస్తూ’, ‘కృతజ్ఞతలు చెల్లిస్తూ’ వంటి పదబంధాలను ఎంచుకున్నాం; హీబ్రూ కవితాత్మక బలం మరియు సాధ్యమైన సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
