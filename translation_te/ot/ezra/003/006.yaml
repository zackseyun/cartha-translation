  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: te
  text: ఏడవ నెల మొదటి రోజు నుండి వారు యహ్వేకు దహనబలులను అర్పించడం మొదలుపెట్టారు; అయితే యహ్వే ఆలయపు పునాది ఇంకా వేయబడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మరియు యహ్వే ఆలయపు పునాది ఇంకా వేయబడలేదు.” హీబ్రూ సంధిపదాన్ని సాధారణంగా “మరియు” అని లేదా వ్యతిరేకార్థంలో “అయితే” అని అనువదించవచ్చు. ఆలయ పునాది వేయబడకముందే బలుల అర్పణ మొదలైందన్నది భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల మొదటి రోజు నుండి
  rationale: מִן కాలారంభ బిందువును సూచిస్తుంది; ‘నుండి’ అనే రూపం ఆ రోజు మొదలైన చర్యను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵחֵלּוּ
  choice: మొదలుపెట్టారు
  rationale: హిఫీల్ రూపం ‘ప్రారంభించారు’ అనే భావాన్ని ఇస్తుంది; ఇది సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: దహనబలులు అర్పించడం
  rationale: బలి పూర్తిగా దహించబడే ఆచారార్థాన్ని ‘దహనబలులు’ నిలుపుతుంది; ‘అర్పించడం’ హీబ్రూ బలిసంబంధ ప్రయోగానికి సహజ తెలుగు సమానం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం; לְ బలిని అందుకునే వ్యక్తిని సూచిస్తుంది.
- source_word: וְהֵיכַל יְהוָה
  choice: అయితే యహ్వే ఆలయానికి
  rationale: הֵיכָלకు ఈ పునర్నిర్మాణ సందర్భంలో ‘ఆలయం’ తగినది. וְ యొక్క సందర్భసిద్ధమైన వ్యతిరేక సంబంధాన్ని ‘అయితే’ వ్యక్తపరుస్తుంది.
- source_word: לֹא יֻסָּד
  choice: ఇంకా పునాది వేయబడలేదు
  rationale: יסד యొక్క నిష్క్రియ రూపం పునాది వేయడాన్ని సూచిస్తుంది. హీబ్రూలో అంతర్భూతమైన ‘పునాది’ని తెలుగులో సహజ వాక్యనిర్మాణం కోసం స్పష్టంగా పేర్కొన్నాం; సందర్భంలోని కాలభావాన్ని ‘ఇంకా’ తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం.
- issue: ఆలయ పునాది పడకముందే బలులు అర్పించడం
  choice: వ్యతిరేక భావాన్ని ‘అయితే’తో వ్యక్తపరచడం
  alternative: సాధారణ సంధిగా ‘మరియు’ అనడం
  rationale: హీబ్రూ וְ రెండు విధాలుగా అర్థమవగలదు. సందర్భంలో బలులు మొదలయ్యాయి, ఆలయ పునాది మాత్రం పడలేదు అనే వ్యత్యాసం ప్రధానంగా కనిపిస్తుంది; అయినా మూలంలోని నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. బలిసంబంధ పదజాలానికి ‘దహనబలులు’, దేవాలయ సందర్భానికి ‘ఆలయం’ వాడబడ్డాయి.
