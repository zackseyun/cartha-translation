  to: అప్పుడు యోజాదాకు కుమారుడైన యేషూవా, యాజకులైన తన సహోదరులతో[a] కూడ, షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలు తన సహోదరులతో కూడ లేచారు. దేవుని మనిషి మోషే ధర్మశాస్త్రంలో[b] వ్రాయబడిన ప్రకారం, దానిమీద దహనబలులు అర్పించడానికి వారు ఇశ్రాయేలు దేవుని బలిపీఠాన్ని కట్టారు.
  rationale: “యేషూవా”గా పేరు సవరించబడింది, ఎందుకంటే అది హీబ్రూ יֵשׁוּעַ రూపాన్ని మరింత విశ్వసనీయంగా ప్రతిబింబిస్తుంది. రెండు నాయక-వర్గాలు లేచిన తరువాత వారందరూ బలిపీఠాన్ని కట్టారని తెలుగు వాక్యనిర్మాణంలో స్పష్టమయ్యేలా పునర్వ్యవస్థీకరించబడింది. మూలంలోని అర్థం, కాలం, బలిపదజాలం, మరియు పాదసూచికలలోని అర్థవికల్పాలు యథాతథంగా నిలుపబడ్డాయి.
