source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: te
  text: అప్పుడు యోజాదాకు కుమారుడైన యేషూవా, యాజకులైన తన సహోదరులతో[a] కూడ, షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలు తన సహోదరులతో కూడ లేచారు. దేవుని మనిషి మోషే ధర్మశాస్త్రంలో[b] వ్రాయబడిన ప్రకారం, దానిమీద దహనబలులు అర్పించడానికి వారు ఇశ్రాయేలు దేవుని బలిపీఠాన్ని కట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అని అనువదించిన హీబ్రూ పదానికి ‘బంధువులు’ లేదా ‘సహచరులు’ అనే అర్థాలు కూడా ఉండవచ్చు. వెంట వచ్చే మాట యేషూవాతో ఉన్నవారిని ‘యాజకులు’గా గుర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ధర్మశాస్త్రం’ అని అనువదించిన హీబ్రూ పదం తోరా; దీనికి ‘ఉపదేశం’ అనే అర్థం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ నిర్ణయాత్మక చర్య ప్రారంభాన్ని సూచిస్తుంది. ‘లేచి’ అనే రూపం శారీరకంగా నిలబడటానికే పరిమితం చేయకుండా కథన కదలికను సహజంగా నిలుపుతుంది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, ఎజ్రా–నెహెమ్యా సందర్భంలోని రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: యాజకులైన తన సహోదరులతో
  rationale: אָחִים యొక్క ప్రాథమిక అర్థమైన ‘సహోదరులు’ నిలుపబడింది; వెంట వచ్చే ‘యాజకులు’ అనే పదం యేషూవతో ఉన్న వర్గాన్ని స్పష్టపరుస్తుంది.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: షయల్తీయేలు కుమారుడైన జెరుబ్బాబెలు
  rationale: వ్యక్తినామాలు హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిపిలో ఇవ్వబడ్డాయి.
- source_word: וַיִּבְנוּ
  choice: కట్టారు
  rationale: בנה యొక్క సాధారణ అర్థం ‘కట్టు.’ చారిత్రకంగా ఇది పునర్నిర్మాణం కావచ్చునైనా, మూలక్రియ స్వయంగా ‘మళ్లీ’ అనే భావాన్ని స్పష్టంగా చెప్పదు.
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుని బలిపీఠాన్ని
  rationale: హీబ్రూ సంబంధపదబంధాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: దానిమీద దహనబలులు అర్పించడానికి
  rationale: עלה హిఫీల్ రూపం మరియు עֹלוֹת కలిసిన బలిసంబంధిత నుడికారాన్ని స్పష్టంగా తెలుపుతూ, עָלָיו లోని బలిపీఠ సూచనను కూడా నిలుపుతుంది.
- source_word: כַּכָּתוּב
  choice: వ్రాయబడిన ప్రకారం
  rationale: లిఖిత ఆజ్ఞకు అనుగుణంగా చేసిన చర్యను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תּוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రంలో
  rationale: ఈ సందర్భంలో లిఖిత బలివిధి ప్రధానంగా ఉన్నందున ‘ధర్మశాస్త్రం’ తగిన అర్థాన్ని ఇస్తుంది; పదానికి ఉన్న విస్తృత ‘ఉపదేశం’ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషియైన
  rationale: హీబ్రూ బిరుదును వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రతినిధి వర్గంలో אחים బంధుత్వపదం
  choice: సహోదరులు
  alternative: బంధువులు / సహచరులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘సహోదరులు’; సందర్భంలో అది యాజక సహచరులను లేదా విస్తృత బంధువర్గాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో మూలపదాన్ని నిలిపి, అర్థవిస్తృతిని పాదసూచికలో ఇచ్చాం.
- issue: బలివిధి సందర్భంలో תּוֹרָה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం / తోరా
  rationale: వ్రాయబడిన బలివిధికి లోబడటమే ఈ సందర్భపు ప్రధాన భావం. అందువల్ల ‘ధర్మశాస్త్రం’ సహజంగా సరిపోతుంది; అయితే ‘ఉపదేశం’ అనే విస్తృత అర్థాన్ని నిరాకరించకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యథాతథంగా అనుసరించడం వల్ల కలిగే భారాన్ని తగ్గిస్తూ, ‘లేచి ... కట్టారు’ అనే ప్రధాన క్రియాసంబంధాన్ని నిలిపాం. బలిపదజాలంలో సాధారణంగా అర్థమయ్యే ‘బలిపీఠం,’ ‘దహనబలులు,’ ‘ధర్మశాస్త్రం’ రూపాలు ఎంచుకున్నాం.
