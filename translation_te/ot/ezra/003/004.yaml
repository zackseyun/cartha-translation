source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: te
  text: వారు వ్రాయబడినట్లు పర్ణశాలల పండుగను ఆచరించారు; నియమం ప్రకారం, ప్రతి రోజుకు నిర్ణయించబడిన సంఖ్యలో రోజువారీ దహనబలులను అర్పించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: పర్ణశాలల పండుగ
  rationale: ఇశ్రాయేలీయులు కొమ్మలు, ఆకులతో తాత్కాలిక నివాసాలు నిర్మించి ఆచరించే పండుగను సూచించే స్థిరమైన, సహజమైన తెలుగు పదబంధం.
- source_word: כַּכָּתוּב
  choice: రాసి ఉన్న ప్రకారం
  rationale: లిఖిత ధర్మశాస్త్రపు నిర్దేశానికి అనుగుణంగా చేశారనే భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: ప్రతి రోజుకు ... దహనబలులను
  rationale: עֹלָהను పూర్తిగా దహనం చేసే బలిగా చూపుతూ, יוֹם בְּיוֹם యొక్క రోజువారీ పంపిణీ భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בְּמִסְפָּר
  choice: నియమించబడిన లెక్క చొప్పున
  rationale: ప్రతి రోజూ అర్పించవలసిన బలుల నిర్దిష్ట సంఖ్యను సూచిస్తుంది; ఆ సంఖ్య వాక్యంలో ఇవ్వబడనందున 'నియమించబడిన' అనేది సందర్భస్పష్టీకరణ.
- source_word: כְּמִשְׁפַּט
  choice: నియమించబడిన
  rationale: ఇక్కడ ధర్మశాస్త్రంలో నిర్దేశించిన విధి లేదా క్రమాన్ని సూచిస్తుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ఆ రోజు అవసరానికి తగిన
  rationale: రోజువారీగా నిర్ణయించబడిన భాగం లేదా కర్తవ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పండుగ బలుల ధర్మశాస్త్రబద్ధత
  choice: రాసి ఉన్న ప్రకారం ... నియమించబడిన లెక్క చొప్పున
  alternative: ఆచారం ప్రకారం
  rationale: మూలంలోని כַּכָּתוּב మరియు כְּמִשְׁפַּט రెండింటినీ నిలుపుతూ, ఇది కేవలం సంప్రదాయం కాక లిఖిత నిర్దేశానికి విధేయత అని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రోజువారీ లెక్క, నియమం, ప్రతి రోజుకు తగిన భాగం అనే పునరుక్త భావాలను అతిగా భారంగా కాకుండా నిలిపింది.
