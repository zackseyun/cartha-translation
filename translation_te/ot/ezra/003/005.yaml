  verdict: revise
  source_fidelity: ముసాయిదా ప్రధానంగా హీబ్రూ జాబితా నిర్మాణాన్ని, ముందటి వచనం నుండి కొనసాగుతున్న ‘అర్పించారు’ అనే క్రియను, మరియు యహ్వే దైవనామాన్ని సరిగానే ప్రతిబింబిస్తుంది. అయితే ‘...ప్రతి ఒక్కరి అర్పణను అర్పించారు’ అనే ముగింపు అనవసర పునరుక్తి కలిగిస్తుంది; స్వచ్ఛందంగా అర్పించినవారి అర్పణలను సూచించేలా సవరించడం మరింత నమ్మదగినది. ‘అమావాస్యలు’ కంటే మూలంలోని cultic ‘new moons’కు ‘కొత్తచంద్ర దినాలు’ మరింత స్పష్టమైన సమానార్థకం.
  naturalness: ‘అర్పించాల్సిన బలులు’ అనేది ఆజ్ఞ లేదా భవిష్యత్ కర్తవ్య భావాన్ని కలిగించవచ్చు; ఇక్కడ గతంలో అర్పించిన బలుల జాబితా కాబట్టి ‘కోసం అర్పించిన బలులు’ సహజం. చివరి భాగంలోని పదపునరుక్తిని తొలగించి ఆధునిక ప్రామాణిక తెలుగులో ప్రవాహాన్ని మెరుగుపరిచాం.
  terminology: ‘నిరంతర దహనబలి’ תָּמִידకు తగినది; పాదటిప్పణిలో ‘రోజువారీ’ని సందర్భానుగుణ ప్రత్యామ్నాయంగా ఉంచవచ్చు. ‘కొత్తచంద్ర దినాలు’ חֳדָשִׁיםకు, ‘నియమిత పర్వదినాలు’ מוֹעֲדִיםకు, ‘స్వచ్ఛంద అర్పణ’ נְדָבָהకు అనుకూలమైన పదాలు. הַמְקֻדָּשִׁים యొక్క నిష్క్రియ ‘పవిత్రపరచబడిన’ ద్వారా నిలుపబడింది.
