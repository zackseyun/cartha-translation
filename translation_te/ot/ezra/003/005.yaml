    rationale: హీబ్రూలో ‘కొత్త చంద్రులు’ అని ఉంది. ‘అమావాస్య’ భారతీయ వాడుకలో సంబంధితమైనప్పటికీ, చంద్రుడు కనబడని దశను ప్రధానంగా సూచించవచ్చు; ‘కొత్తచంద్ర దినాలు’ మూలపదాన్నీ ఆచారార్థాన్నీ నేరుగా తెలియజేస్తుంది.
