  to: ఆ తరువాత వారు నిరంతర దహనబలిని[a], కొత్తచంద్ర దినాల[b] కోసం అర్పించిన బలులను, పవిత్రపరచబడిన యహ్వే నియమిత పర్వదినాలన్నిటి[c] కోసం అర్పించిన బలులను, అలాగే యహ్వేకు స్వచ్ఛంద అర్పణ అర్పించిన ప్రతి ఒక్కరి అర్పణలను అర్పించారు.
  rationale: హీబ్రూ వచనం 4వ వచనంలోని అర్పణక్రియను కొనసాగిస్తూ దహనబలి, కొత్తచంద్ర ఆచారాలు, పవిత్రపరచబడిన నియమిత పర్వదినాలు, స్వచ్ఛంద అర్పణలు అనే వరుసను ఇస్తుంది. సవరణ ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది; ‘కొత్త చంద్రులు’ను స్పష్టంగా అనువదిస్తుంది; కర్తవ్యభావం కలిగించే రూపాన్ని తొలగిస్తుంది; చివరి స్వచ్ఛంద అర్పణ భాగాన్ని సహజంగా రూపొందిస్తుంది. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
