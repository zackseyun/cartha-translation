id: EZR.3.5
reference: Ezra 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: te
  text: ఆ తరువాత వారు నిరంతర దహనబలిని[a], కొత్తచంద్ర దినాల[b] కోసం అర్పించిన బలులను, పవిత్రపరచబడిన యహ్వే నియమిత పర్వదినాలన్నిటి[c] కోసం అర్పించిన బలులను, అలాగే యహ్వేకు స్వచ్ఛంద అర్పణ అర్పించిన ప్రతి ఒక్కరి అర్పణలను అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రమంగా అర్పించే దహనబలి’; ఆచార సందర్భంలో ఇది ‘రోజువారీ దహనబలి’ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘కొత్త చంద్రులు’; ఇది ప్రతి నెల ప్రారంభంలో జరిగే పవిత్ర ఆచారాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘యహ్వే నియమిత కాలాలన్నీ’ లేదా ‘యహ్వే పండుగలన్నీ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ముందటి వచనంలోని బలుల అర్పణకు అనుసంధానంగా కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלַת תָּמִיד
  choice: క్రమంగా అర్పించే దహనబలి
  rationale: עֹלָהను సంపూర్ణంగా దహనం చేసే బలిగా సూచించే స్థిర పదమైన ‘దహనబలి’తో, תָּמִידలోని క్రమమైన లేదా నిరంతర పునరావృత భావాన్ని అతిగా ‘రోజువారీ’గా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: וְלֶחֳדָשִׁים
  choice: అమావాస్యల కోసం అర్పించాల్సిన బలులు
  rationale: חֹדֶשׁ ఇక్కడ సాధారణ నెలలను కాక, నెలారంభంలో జరిగే అమావాస్య ఆరాధనా సందర్భాలను సూచిస్తుంది; హీబ్రూలో సందర్భం వల్ల అవగతమయ్యే ‘బలులు’ను తెలుగులో స్పష్టత కోసం పూరించింది.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה הַמְקֻדָּשִׁים
  choice: యహ్వేకు ప్రతిష్ఠితమైన నియమిత పండుగలన్నిటి కోసం
  rationale: מוֹעֵדలోని నిర్ణయించబడిన పవిత్ర కాలం మరియు పండుగ అనే రెండు భావాలను ‘నియమిత పండుగలు’ తెలియజేస్తుంది; הַמְקֻדָּשִׁים వాటిని పవిత్ర ఉపయోగం కోసం ప్రత్యేకించినవిగా సూచిస్తుంది.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: స్వచ్ఛంద అర్పణ చేయడానికి ఇష్టపూర్వకంగా ముందుకు వచ్చిన ప్రతి ఒక్కరి అర్పణ
  rationale: సంబంధిత క్రియారూపం మరియు నామవాచకంలో ఉన్న స్వచ్ఛందతను నిలుపుతూ, తెలుగులో అనవసరమైన పదపునరుక్తి తగ్గేలా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: మునుపటి వచనం నుండి ఊహించాల్సిన ప్రధాన క్రియ
  choice: అర్పించారు
  alternative: క్రియలేని నామపద వరుసను యథాతథంగా ఉంచడం
  rationale: హీబ్రూ వాక్యం 4వ వచనంలోని అర్పణ క్రియను కొనసాగిస్తూ ఇక్కడ దాన్ని విడిచిపెడుతుంది. స్వతంత్ర తెలుగు వచనం అర్థవంతంగా ఉండేందుకు ఆ క్రియను పూరించడం జరిగింది; ఇది కొత్త కార్యాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలో ముందటి సందర్భం నుండి ఊహించబడే ‘అర్పించారు’ అనే క్రియను, అలాగే అమావాస్యలు మరియు పండుగలతో సంబంధమున్న బలులను తెలుగులో స్పష్టంగా పూరించాం. [a], [b], [c] గుర్తులన్నీ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉన్నాయి.
