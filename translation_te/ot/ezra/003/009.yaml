  terminology: యేషూవ, కద్మీయేలు, హేనాదాదు అనే వ్యక్తినామాల లిప్యంతరీకరణను ఉంచాం. בְּנֵי ని ‘కుమారులు’గా అనువదించడం మూలంలోని పురుష బంధుత్వ పదాన్ని కాపాడుతుంది. ‘దేవుని మందిరం,’ ‘పర్యవేక్షించడానికి,’ మరియు ‘లేవీయులు’ సందర్భానుగుణంగా సరైన పదాలు.
