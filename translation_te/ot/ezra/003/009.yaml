reference: Ezra 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: te
  text: అప్పుడు యేషూవ, అతని కుమారులు, అతని సహోదరులు, కద్మీయేలు మరియు అతని కుమారులు, యూదా కుమారులు[a], ఏకముగా నిలబడి దేవుని మందిరంలో పని చేసేవారిని పర్యవేక్షించడానికి సిద్ధమయ్యారు; హేనాదాదు కుమారులు, వారి కుమారులు, వారి సహోదరులైన లేవీయులు కూడా వారితో కలిసి నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం: “యూదా కుమారులు.” కొన్ని ప్రాచీన అనువాదాలు మరియు ఆధునిక అనువాదాలు “హోదవ్యా కుమారులు” అని చదువుతాయి.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడి
  rationale: עמד అనే క్రియ యొక్క ‘నిలబడు/స్థానం చేపట్టు’ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, పర్యవేక్షణ బాధ్యత చేపట్టిన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: יֵשׁוּעַ
  choice: యేషూవ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בָּנָיו וְאֶחָיו
  choice: అతని కుమారులు, అతని సహోదరులు
  rationale: మూలంలోని పురుషవాచక బంధుత్వ పదాలను స్పష్టంగా, యథాతథంగా నిలుపుతుంది.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: కద్మీయేలు, అతని కుమారులు
  rationale: యేషూవ కుటుంబ సమూహానికి సమాంతరంగా ఉన్న రెండవ కుటుంబ సమూహాన్ని మూల క్రమంలో అందిస్తుంది.
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థులు
  rationale: బెనె అనే పదబంధం వంశ/కుటుంబ సమూహాన్ని సూచించే ఈ సందర్భంలో సహజమైన తెలుగు; మసొరెటిక్ పాఠంలోని ‘యూదా’ను నేరుగా అనుసరిస్తుంది.
- source_word: כְּאֶחָד
  choice: అందరూ ఒక్కటిగా
  rationale: సమైక్యంగా చేసిన చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְנַצֵּחַ
  choice: పర్యవేక్షించారు
  rationale: ఈ సందర్భంలో נצח పియేల్ రూపం పనివారిపై దర్శకత్వం లేదా పర్యవేక్షణ చేయడాన్ని సూచిస్తుంది.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: పని చేస్తున్నవారిని
  rationale: ఏకవచన సమూహార్థక కృదంతాన్ని సహజమైన తెలుగు బహువచనంగా వ్యక్తపరుస్తూ దాని క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: ‘దేవుని గృహం’ అనే ఆలయార్థక హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: హేనాదాదు వంశస్థులు, వారి కుమారులు, వారి సహోదరులైన లేవీయులు కూడా వారితో ఉన్నారు
  rationale: చివరి లేవీయ కుటుంబ సమూహం పర్యవేక్షకులతో కలిసివున్న భావాన్ని స్పష్టం చేస్తూ, మూలంలోని కుటుంబ జాబితాను నిలుపుతుంది.
theological_decisions:
- issue: בְּנֵי יְהוּדָה లోని పాఠభేదం
  choice: మసొరెటిక్ పాఠాన్ని అనుసరించి ‘యూదా వంశస్థులు’ అని అనువదించడం
  alternative: ‘హోదవ్యా వంశస్థులు’
  rationale: అందించిన WLC పాఠంలో ‘యూదా’ ఉంది. కొన్ని ప్రాచీన అనువాద సంప్రదాయాలలోని భిన్న నామాన్ని ప్రధాన పాఠంలో చేర్చకుండా, పాఠభేదాన్ని పాదటిప్పణిలో భద్రపరచడం మూలభాషా ప్రాధాన్యాన్నీ పాఠ్య అనిశ్చితినీ రెండింటినీ గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడింది. కుటుంబ జాబితా స్పష్టత కోసం విరామచిహ్నాలు, ‘అంటే’, ‘కూడా వారితో ఉన్నారు’ అనే సహజ అనుసంధానాలను ఉపయోగించింది; మూలంలోని ఏకత్వం, పర్యవేక్షణ, లేవీయ గుర్తింపును నిలుపుకుంది.
