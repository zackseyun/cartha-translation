  to: అప్పుడు యేషూవ, అతని కుమారులు, అతని సహోదరులు, కద్మీయేలు మరియు అతని కుమారులు, యూదా కుమారులు[a], ఏకముగా నిలబడి దేవుని మందిరంలో పని చేసేవారిని పర్యవేక్షించడానికి సిద్ధమయ్యారు; హేనాదాదు కుమారులు, వారి కుమారులు, వారి సహోదరులైన లేవీయులు కూడా వారితో కలిసి నిలబడ్డారు.
