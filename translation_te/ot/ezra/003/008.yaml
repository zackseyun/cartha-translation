  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: te
  text: 'వారు యెరూషలేములోని దేవుని మందిరానికి వచ్చిన రెండవ సంవత్సరపు రెండవ నెలలో, షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు, యోజాదాకు కుమారుడు యెషూవ, వారి మిగిలిన సహోదరులైన యాజకులూ లేవీయులూ, చెరనుండి[a] యెరూషలేముకు వచ్చిన వారందరూ ప్రారంభించి, ఇరవై సంవత్సరాల వయసు నుండి అంతకంటే ఎక్కువ వయసున్న లేవీయులను యెహోవా మందిరపు పనిని పర్యవేక్షించడానికి నియమించారు.


    [a] లేదా, “ప్రవాసం నుంచి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవాసం నుంచి.”
    reason: మֵהַשְּׁבִי అనే పదం ‘చెర’తో పాటు ‘ప్రవాసం’ అనే భావంలోనూ సహజంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: వారు వచ్చిన
  rationale: לְ తో కూడిన infinitive construct ఇక్కడ కాలసూచకంగా ఉంది; సహజమైన తెలుగులో ‘వారు వచ్చిన రెండో సంవత్సరంలో’ అని అనువదించబడింది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: ఇది దేవాలయ స్థలాన్ని సూచించినా, మూలంలోని ‘దేవుని ఇల్లు’ అనే సంబంధాన్ని గౌరవిస్తూ సాధారణ తెలుగు బైబిలు వాడుకలో సహజమైన ‘మందిరం’ ఎంచుకోబడింది.
- source_word: הֵחֵלּוּ
  choice: ఆ పనిని ప్రారంభించారు
  rationale: మూలంలో క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు. సందర్భంలో మందిరపు పని ఉద్దేశించబడినందున తెలుగులో వాక్యం అసంపూర్ణంగా వినిపించకుండా ‘ఆ పనిని’ చేర్చబడింది.
- source_word: וַיַּעֲמִידוּ
  choice: నియమించారు
  rationale: עמד హిఫీల్ రూపం ఒక బాధ్యతలో నిలబెట్టడం లేదా నియమించడం అనే పరిపాలనా భావాన్ని ఇక్కడ ఇస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు, అంతకంటే ఎక్కువ వయసున్న
  rationale: వయోపరిమితిని సూచించే హెబ్రీ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְנַצֵּחַ
  choice: పర్యవేక్షించడానికి
  rationale: ఈ నిర్మాణ సందర్భంలో ఈ పదం సంగీత నాయకత్వాన్ని కాకుండా పనిపై పర్యవేక్షణ బాధ్యతను సూచిస్తుంది.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: యెహోవా మందిరపు పని
  rationale: מְלֶאכֶת అనేది పని లేదా శ్రమను సూచిస్తుంది; genitive సంబంధాన్ని తెలుగులో ‘మందిరపు పని’గా ఉంచబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని లింగనిర్దిష్టతతో నిలిపాం.
- source_word: מֵהַשְּׁבִי
  choice: చెరనుండి
  rationale: ఈ నామవాచకం చెర లేదా ప్రవాస స్థితిని సూచిస్తుంది. ప్రధాన పాఠంలో మూలానికి దగ్గరైన ‘చెరనుండి’ ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలిపాం.
- issue: בֵּית הָאֱלֹהִים యొక్క అర్థవ్యాప్తి
  choice: దేవుని మందిరం
  alternative: దేవుని ఆలయం
  rationale: నిర్మాణంలో ఉన్న దేవాలయాన్ని సూచిస్తున్నప్పటికీ, మూలంలోని ‘దేవుని ఇల్లు’ భావాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా తెలుగు పాఠకులకు సహజమైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. దీర్ఘమైన హెబ్రీ వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం; వ్యక్తినామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
