  to: 'వారు యెరూషలేములోని దేవుని మందిరానికి వచ్చిన రెండవ సంవత్సరపు రెండవ నెలలో, షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు, యోజాదాకు కుమారుడు యెషూవ, వారి మిగిలిన సహోదరులైన యాజకులూ లేవీయులూ, చెరనుండి[a] యెరూషలేముకు వచ్చిన వారందరూ ప్రారంభించి, ఇరవై సంవత్సరాల వయసు నుండి అంతకంటే ఎక్కువ వయసున్న లేవీయులను యెహోవా మందిరపు పనిని పర్యవేక్షించడానికి నియమించారు.


