- from: 'యెరూషలేములోని దేవుని మందిరానికి వారు వచ్చిన రెండో సంవత్సరంలో, రెండో నెలలో, షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు, యోజాదాకు కుమారుడు యేషూవ, వారి సహోదరుల్లో మిగిలిన యాజకులు, లేవీయులు, చెరనుండి[a] యెరూషలేముకు వచ్చిన వారందరూ ఆ పనిని ప్రారంభించారు. యెహోవా మందిరపు పనిని పర్యవేక్షించడానికి ఇరవై ఏళ్లు, అంతకంటే ఎక్కువ వయసున్న లేవీయులను వారు నియమించారు.


