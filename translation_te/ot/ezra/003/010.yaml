reference: Ezra 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: te
  text: నిర్మాణకారులు యెహోవా ఆలయానికి పునాది వేసినప్పుడు, వారు వస్త్రాలు ధరించిన యాజకులను బాకాలతోను, ఆసాపు కుమారులైన లేవీయులను తాళాలతోను, ఇశ్రాయేలు రాజైన దావీదు నిర్దేశించిన ప్రకారం యెహోవాను స్తుతించడానికి నిలబెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు రాజైన దావీదు చేతి ద్వారా.” ఇక్కడ ఇది దావీదు నిర్దేశం లేదా ఏర్పాటు ప్రకారం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: నిర్మాణకారులు ... పునాది వేసినప్పుడు
  rationale: יסד అనే క్రియ భవనానికి పునాది వేయడాన్ని సూచిస్తుంది; substantival participle הַבֹּנִיםను సహజమైన ఆధునిక తెలుగులో ‘నిర్మాణకారులు’గా ఇచ్చాం.
- source_word: הֵיכַל יְהוָה
  choice: యెహోవా ఆలయం
  rationale: హేיכל ఇక్కడ దేవాలయ నిర్మాణాన్ని సూచిస్తుంది; దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיַּעֲמִידוּ
  choice: నిలబెట్టారు
  rationale: హిఫిల్ రూపం ఆరాధనా సేవ కోసం ఆయా వ్యక్తులను వారి స్థానాల్లో నిలబెట్టడాన్ని సూచిస్తుంది.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: యాజకులను తమ వస్త్రాలు ధరించి
  rationale: మూలంలో కేవలం ‘వస్త్రాలు ధరించినవారు’ అనే భావమే స్పష్టంగా ఉంది; ‘యాజక వస్త్రాలు’ అని వివరణను ప్రధాన పాఠ్యంలో అధికంగా జోడించలేదు.
- source_word: בַּחֲצֹצְרוֹת
  choice: బాకాలతో
  rationale: חצצרות ఆరాధనలో వాడే నేరుగా ఉండే లోహ వాద్యాలు; సాధారణ తెలుగు బైబిలు మరియు ఆరాధనా సందర్భంలో ‘బాకాలు’ సహజంగా అర్థమవుతుంది.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: ఆసాపు వంశస్థులైన లేవీయులను
  rationale: ‘ఆసాపు కుమారులు’ అనేది వంశ లేదా గోత్ర సంబంధాన్ని సూచించగల హీబ్రూ ప్రయోగం; ఆధునిక పాఠకునికి భావం స్పష్టంగా ఉండేలా ‘వంశస్థులు’ వాడాం.
- source_word: בַּמְצִלְתַּיִם
  choice: తాళాలతో
  rationale: מצלתים అనేది ఒకదానితో ఒకటి మోగించే లోహ వాద్యజోడును సూచిస్తుంది; తెలుగులో ‘తాళాలు’ సహజమైన సంగీతపదం.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: యెహోవాను స్తుతించడానికి
  rationale: లామెద్‌తో కూడిన infinitive ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: עַל יְדֵי דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన దావీదు నిర్దేశించిన ప్రకారం
  rationale: ‘దావీదు చేతి ద్వారా’ అనే అక్షరార్థపు నుడికారం ఈ సందర్భంలో దావీదు చేసిన ఏర్పాట్లు లేదా నిర్దేశాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: עַל יְדֵי דָּוִיד యొక్క ఆరాధనా సందర్భార్థం
  choice: దావీదు నిర్దేశించిన ప్రకారం
  alternative: దావీదు చేతి ద్వారా
  rationale: అక్షరార్థ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా విప్పి చెప్పినా, దాని మూలరూపాన్ని పాదసూచికలో నిలిపి genuine idiomatic ambiguityని చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ఆరాధనా పదజాలంలో ‘యాజకులు,’ ‘లేవీయులు,’ ‘స్తుతించడం’ వంటి స్థిరమైన పదాలను ఉపయోగించాం.
