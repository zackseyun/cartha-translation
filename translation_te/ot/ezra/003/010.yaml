- from: నిర్మాణకారులు యెహోవా ఆలయానికి పునాది వేసినప్పుడు, యాజకులను తమ వస్త్రాలు ధరించి బాకాలతో, ఆసాపు వంశస్థులైన లేవీయులను తాళాలతో నిలబెట్టారు. ఇశ్రాయేలు రాజైన దావీదు నిర్దేశించిన ప్రకారం యెహోవాను స్తుతించడానికి వారు అలా చేశారు.[a]
