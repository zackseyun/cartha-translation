revisions:
- from: రాజుకు తెలియజేయవలసినదేమంటే, మేము యూదా పరగణానికి, మహా దేవుని మందిరానికి వెళ్లాము. అది పెద్ద పెద్ద రాళ్లతో[a] కట్టబడుతోంది; గోడల్లో కలప అమర్చబడుతోంది. ఈ పని శ్రద్ధగా[b] జరుగుతూ, వారి చేతుల్లో వర్ధిల్లుతోంది.
  to: రాజుకు తెలియవలసిన విషయం ఏమంటే, మేము యూదా ప్రావిన్సుకు, మహా దేవుని మందిరానికి వెళ్లాము. అది భారీ రాళ్లతో[a] కట్టబడుతోంది, గోడల్లో కలప అమర్చబడుతోంది. ఈ పని శ్రద్ధగా[b] జరుగుతోంది, వారి చేతులలో విజయవంతమవుతోంది.
  rationale: చారిత్రక పరిపాలనా పదమైన מְדִינְתָּאను ‘ప్రావిన్సు’గా కచ్చితపరచాం. నిర్మాణ రాళ్లకు అధికారిక సందర్భంలో సహజమైన ‘భారీ రాళ్లు’ను వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం. చివరి క్రియను పనియొక్క సమర్థవంతమైన విజయాన్ని స్పష్టంగా తెలిపేలా సవరించాం; ‘వారి చేతులలో’ ద్వారా మూల రూపకాన్ని కాపాడాం. పాదసూచిక గుర్తులు వరుసగా రాళ్లు మరియు ‘శ్రద్ధగా’ వద్దనే ఉన్నాయి.
