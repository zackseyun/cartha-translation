id: EZR.5.8
reference: Ezra 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְדִ֣יעַ לֶהֱוֵ֣א לְ/מַלְכָּ֗/א דִּֽי אֲזַ֜לְנָא לִ/יה֤וּד מְדִֽינְתָּ/א֙ לְ/בֵית֙ אֱלָהָ֣/א רַבָּ֔/א וְ/ה֤וּא מִתְבְּנֵא֙ אֶ֣בֶן גְּלָ֔ל וְ/אָ֖ע מִתְּשָׂ֣ם בְּ/כֻתְלַיָּ֑/א וַ/עֲבִ֥ידְתָּ/א דָ֛ךְ אָסְפַּ֥רְנָא מִתְעַבְדָ֖א וּ/מַצְלַ֥ח בְּ/יֶדְ/הֹֽם׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: te
  text: రాజుకు తెలియవలసిన విషయం ఏమంటే, మేము యూదా ప్రావిన్సుకు, మహా దేవుని మందిరానికి వెళ్లాము. అది భారీ రాళ్లతో[a] కట్టబడుతోంది, గోడల్లో కలప అమర్చబడుతోంది. ఈ పని శ్రద్ధగా[b] జరుగుతోంది, వారి చేతులలో విజయవంతమవుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెద్ద రాళ్లతో.’ అరామీయ పదబంధం సాధారణంగా చాలా పెద్ద నిర్మాణ రాళ్లను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శ్రద్ధగా’కు బదులుగా ‘జాగ్రత్తగా’ లేదా బహుశా ‘వేగంగా’ అని కూడా అనువదించవచ్చు. అరామీయ క్రియావిశేషణపు సూక్ష్మార్థం వివాదాస్పదమైనా, పని సమర్థంగా సాగుతోందని అది స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: రాజుకు తెలియజేయవలసినదేమంటే
  rationale: అధికారిక నివేదికను ప్రారంభించే అరామీయ పరిపాలనా సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు శైలిలో వ్యక్తపరుస్తుంది.
- source_word: אֲזַלְנָא לִיהוּד מְדִינְתָּא
  choice: మేము యూదా పరగణానికి వెళ్లాము
  rationale: క్రియ యొక్క ‘వెళ్లాము’ అనే దిశాభావాన్ని నిలుపుతూ, మְדִינְתָּאను సామ్రాజ్య పరిపాలనా ప్రాంతాన్ని సూచించే ‘పరగణం’గా అనువదిస్తుంది.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: మహా దేవుని మందిరానికి
  rationale: ‘ఇల్లు’ అనే మూలార్థం ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని స్పష్టంగా, గౌరవంగా తెలియజేస్తుంది.
- source_word: אֶבֶן גְּלָל
  choice: పెద్ద పెద్ద రాళ్లతో
  rationale: ఈ వివాదాస్పద పదబంధం నిర్మాణంలో ఉపయోగించే భారీ రాళ్లను సూచిస్తుంది; ‘పెద్ద పెద్ద రాళ్లు’ సహజంగా ఉండి పరిమాణ భావాన్ని అందిస్తుంది.
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: గోడల్లో కలప అమర్చబడుతోంది
  rationale: నిర్మాణ సందర్భంలోని కలపను మరియు గోడలలో దాన్ని ఉంచుతున్న నిరంతర నిష్క్రియ చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: אָסְפַּרְנָא
  choice: శ్రద్ధగా
  rationale: పదం శ్రద్ధ, జాగ్రత్త లేదా వేగాన్ని సూచించవచ్చు; ‘శ్రద్ధగా’ సమర్థంగా కొనసాగుతున్న పనిని వేగం గురించి అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: వారి చేతుల్లో వర్ధిల్లుతోంది
  rationale: ‘వారి చేతిలో విజయవంతంగా ముందుకు సాగుతోంది’ అనే రూపకాన్ని నిలుపుతూ, మూలంలోని చేతుల ప్రస్తావనను కాపాడుతుంది.
theological_decisions:
- issue: אֱלָהָא רַבָּאలో దేవునికి ఇచ్చిన విశేషణం
  choice: మహా దేవుడు
  alternative: గొప్ప దేవుడు
  rationale: ‘మహా’ మూలంలోని రַבָּאకు సన్నిహితంగా ఉండి అధికారిక నివేదికలోని గౌరవభావాన్ని నిలుపుతుంది; ఏ ప్రత్యేక మతపరమైన వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో అధికారిక నివేదిక ధోరణి మరియు గౌరవప్రదమైన వాక్యశైలిని పాటించాం. నిష్క్రియ నిర్మాణాలను సాధ్యమైనంతవరకు నిలిపి, అసలు అరామీయంలోని కొనసాగుతున్న నిర్మాణ భావాన్ని వ్యక్తపరిచాం.
