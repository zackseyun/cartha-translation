base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: te
  text: 'వారు అతనికి ఒక నివేదికను పంపారు[a]. అందులో ఇలా వ్రాయబడి ఉంది: “దర్యావేషు రాజుకు: సంపూర్ణ క్షేమం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అధికారిక సందేశాన్ని” లేదా “పత్రాన్ని.” అరమేయ పదం פִּתְגָמָא అధికారిక సందేశం, నివేదిక లేదా పత్రాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “సంపూర్ణ క్షేమం” అనేది సంపూర్ణమైన శాంతి, సౌఖ్యం కలగాలని కోరే అధికారిక పత్రాభివందనం.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: నివేదిక
  rationale: ఈ అరమేయ పదం అధికారిక సందేశం, నివేదిక లేదా పత్రాన్ని సూచించగలదు. రాజుకు పంపిన పరిపాలనా సమాచారమనే సందర్భంలో ‘నివేదిక’ సహజంగా సరిపోతుంది; ఇతర అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: שְׁלַחוּ
  choice: పంపారు
  rationale: పెయల్ సంపూర్ణ క్రియ యొక్క బహువచన భావాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲלוֹהִי
  choice: అతనికి
  rationale: שׁלח క్రియతో వచ్చిన על మరియు సర్వనామ ప్రత్యయం ఇక్కడ స్వీకర్తవైపు దిశను సూచిస్తున్నాయి.
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: అందులో ఇలా వ్రాయబడి ఉంది
  rationale: పత్రంలోని అసలు వాక్యాలను పరిచయం చేసే అరమేయ నిర్మాణాన్ని సహజమైన తెలుగులో, దాని సూచక మరియు కర్మణి భావాలను నిలుపుతూ అనువదిస్తుంది.
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: దర్యావేషు రాజుకు
  rationale: לְ సంబోధింపబడిన వ్యక్తిని సూచిస్తుంది; మַלְכָּא పేరుకు బిరుదుగా ఉంది. తెలుగు పత్రశీర్షికలో ‘దర్యావేషు రాజుకు’ సహజమైన క్రమం.
- source_word: שְׁלָמָא כֹלָּא
  choice: సంపూర్ణ క్షేమం
  rationale: שְׁלָמָא లోని శాంతి, క్షేమం, సౌఖ్యం అనే శుభాకాంక్ష భావాన్ని ‘క్షేమం’ అందిస్తుంది; כֹלָּא దాని సంపూర్ణతను బలపరుస్తుంది. మూలంలోని సంక్షిప్త నామవాచక శుభాభివందన రూపాన్ని అలాగే ఉంచాం.
