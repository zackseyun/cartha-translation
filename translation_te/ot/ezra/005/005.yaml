revisions:
- from: అయితే వారి దేవుని కన్ను యూదుల పెద్దల మీద ఉంది[a]. అందువల్ల, ఈ విషయం దర్యావేషు దగ్గరికి వెళ్లి[b], దాని గురించి వారు లేఖ ద్వారా జవాబు పంపేంతవరకు[c] అధికారులు వారి పనిని ఆపించలేదు.
  to: అయితే వారి దేవుని కన్ను యూదుల పెద్దల మీద ఉంది[a]. దర్యావేషు వద్దకు ఒక ఆదేశం వెళ్లేవరకు[b] అధికారులు వారి పనిని ఆపించలేదు. ఆ తర్వాత వారు ఈ విషయం గురించి ఒక లేఖను తిరిగి పంపేవారు[c].
  rationale: 'మూల అరామీయంలోని క్రమాన్ని నిలుపడానికి వాక్యాన్ని మూడు స్పష్టమైన దశలుగా సవరించాం: దేవుని అనుకూల దృష్టి, దర్యావేషునకు ఆదేశం వెళ్లేవరకు అధికారులు పని నిలిపివేయించకపోవడం, ఆ తరువాత లేఖను తిరిగి పంపడం. ‘వారి పనిని’ అనేది పూర్వసందర్భంలోని ఆలయనిర్మాణ కార్యకలాపాన్ని తెలుగులో సహజంగా సూచిస్తుంది; చివరి ‘వారు’ అనే కర్తను మూలంలోని అస్పష్టతకు అనుగుణంగా నిర్దిష్టీకరించలేదు.'
