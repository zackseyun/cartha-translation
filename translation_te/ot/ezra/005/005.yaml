  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: te
  text: అయితే వారి దేవుని కన్ను యూదుల పెద్దల మీద ఉంది[a]. దర్యావేషు వద్దకు ఒక ఆదేశం వెళ్లేవరకు[b] అధికారులు వారి పనిని ఆపించలేదు. ఆ తర్వాత వారు ఈ విషయం గురించి ఒక లేఖను తిరిగి పంపేవారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి దేవుడు యూదుల పెద్దలను గమనిస్తూ ఉన్నాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒక నిర్ణయం దర్యావేషు వద్దకు వెళ్లేవరకు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆ తర్వాత వారు ఈ విషయం గురించి లిఖితపూర్వక సమాధానం పంపేవారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: అయితే వారి దేవుని కన్ను ... మీద ఉంది
  rationale: మునుపటి అధికారుల ప్రశ్నకు వ్యతిరేకంగా వచ్చే భావాన్ని ‘అయితే’ తెలియజేస్తుంది. దేవుని సంరక్షణను సూచించే ‘కన్ను ... మీద ఉంది’ అనే స్పష్టమైన రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; ‘వారి’ అనే ప్రత్యయం కూడా స్పష్టంగా ఉంచబడింది.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: యూదుల పెద్దలు
  rationale: שָׂבֵי అనే పదం సాధారణ నాయకులను కాకుండా సమాజపు పెద్దలను సూచిస్తుంది.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: అధికారులు వారి పనిని ఆపించలేదు
  rationale: Pael రూపంలోని కారణార్థక భావాన్ని ‘ఆపించలేదు’ తెలియజేస్తుంది. సందర్భంలో ముందటి వచనంలో పేర్కొన్న అధికారులే కర్తలు; తెలుగులో అస్పష్టమైన వరుస సర్వనామాలను నివారించేందుకు ‘అధికారులు’ అని సందర్భార్థాన్ని వ్యక్తం చేశాం. ‘వారి పనిని’ అనడం నిర్మాణపు పనిని ఆపించడమే ఉద్దేశమని సహజంగా తెలుపుతుంది.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: ఈ విషయం దర్యావేషు దగ్గరికి వెళ్లి
  rationale: టַעְמָא పరిపాలనా సందర్భంలో విషయం, నిర్ణయం లేదా ఆదేశాన్ని సూచించగలదు. దర్యావేషు వైపు ‘వెళ్లడం’ అనే క్రియతో ఇక్కడ ‘విషయం’ సహజంగా సరిపోతుంది; నిర్ణయం/ఆదేశం అనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: దాని గురించి వారు లేఖ ద్వారా జవాబు పంపేంతవరకు
  rationale: יְתִיבוּן యొక్క తిరిగి పంపడం/జవాబివ్వడం అనే భావాన్ని, נִשְׁתְּוָנָא అనే లిఖిత సమాచార సాధనంతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. కర్తను మూలంలోని విధంగానే ‘వారు’ అని ఉంచి దాని గుర్తింపును అతిగా నిర్ధారించలేదు.
theological_decisions:
- issue: దేవుని పర్యవేక్షణను మానవరూపకంగా వర్ణించడం
  choice: ‘వారి దేవుని కన్ను ... మీద ఉంది’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వారి దేవుడు యూదుల పెద్దలను కాపాడుతూ ఉన్నాడు’
  rationale: మూలపాఠం దేవుని అనుకూల పర్యవేక్షణను ‘కన్ను’ అనే సజీవ రూపకంతో చెబుతుంది. దానిని నిలుపడం సాహిత్య బలాన్ని కాపాడుతుంది; ‘కాపాడుతూ ఉన్నాడు’ అనేది భావాన్ని వివరిస్తుంది గాని రూపకాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ‘దేవుని కన్ను’ అనే మూల రూపకం నిలుపబడింది. పరిపాలనా పదమైన טַעְמָא లోని అర్థవిస్తృతిని ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిపి ప్రతిబింబిస్తాయి.
