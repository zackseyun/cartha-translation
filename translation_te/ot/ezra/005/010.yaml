  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: te
  text: మీకు తెలియజేయడానికి[a], వారిలో నాయకులుగా ఉన్న[b] మనుషుల పేర్లను మేము రాసేందుకు, మేము వారిని వారి పేర్లు కూడా ఏమిటని అడిగాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వాటిని మీకు తెలియజేయడానికి”; అంటే, వారి పేర్లను మీకు తెలియజేయడానికి.
    reason: lexical_alternative
  - marker: b
