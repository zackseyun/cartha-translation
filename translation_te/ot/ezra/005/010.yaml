lexical_decisions:
- source_word: וְאַף
  choice: కూడా
  rationale: అధికారుల నివేదికలో మరో చర్యను జోడిస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁמָהָתְהֹם
  choice: వారి పేర్లు
  rationale: బహువచన నామవాచకానికి మూడవ పురుష బహువచన ప్రత్యయం ఉంది; తెలుగులో స్వాభావికమైన స్వామ్య నిర్మాణం.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: వారిని ... అడిగాము
  rationale: అరామీయ క్రియకు ‘అడుగు/విచారించు’ అనే అర్థం ఉంది; సాధారణ ఆధునిక తెలుగులో ‘అడిగాము’ స్పష్టంగా ఉంటుంది.
- source_word: לְהוֹדָעוּתָךְ
  choice: మీకు తెలియజేయడానికి
  rationale: ידע ధాతువు causative infinitive రూపంలో, రెండవ పురుష ఏకవచన ప్రత్యయంతో, ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. ‘మీకు తెలియజేయడానికి’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: דִּי נִכְתֻּב
  choice: మేము రాసి పంపేలా
  rationale: రాజుకు పంపే అధికారిక నివేదిక సందర్భంలో ‘రాయడం’ యొక్క పత్రసంబంధ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘-ేలా’ ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: మనుషుల పేర్లను
  rationale: שֻׁם రూపానికి ఏకవచన ఆకారం ఉన్నప్పటికీ ఇక్కడ బహువచన సమూహాన్ని సూచిస్తుంది; ముందున్న ‘వారి పేర్లు’ మరియు ‘మనుషులు’ కారణంగా బహువచనం తగినది.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: వారిలో నాయకులుగా ఉన్న
  rationale: అక్షరార్థంగా ‘వారి తలల వద్ద/వారి శిరస్సులపై ఉన్న’ అనే ఈ నుడికారం సమూహంలోని ప్రముఖులను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు నుడికారంతో నాయకత్వ భావాన్ని ఇస్తూ, అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
