  revised_text: 'వారు మాకు ఇచ్చిన జవాబు ఇలా ఉంది[a]: “మేము ఆకాశానికీ భూమికీ దేవుడైన దేవుని సేవకులం. ఎన్నో సంవత్సరాల క్రితం నిర్మించబడిన ఆ మందిరాన్ని[b] మేము తిరిగి కడుతున్నాం. ఇశ్రాయేలుకు చెందిన ఒక గొప్ప రాజు దాన్ని కట్టి పూర్తి చేశాడు.”'
