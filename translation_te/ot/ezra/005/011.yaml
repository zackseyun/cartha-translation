  revision_rationale: సవరణలు అర్థాన్ని మార్చవు. అవి అరామీయ ప్రత్యుత్తర-ప్రయోగాన్ని సహజ తెలుగు నివేదిక-శైలిలో వ్యక్తపరుస్తాయి మరియు దేవునితో సేవకుల సంబంధాన్ని స్పష్టమైన ఆధునిక వాక్యనిర్మాణంలో అందిస్తాయి. ‘తిరిగి కడుతున్నాం’ అనే సందర్భాధారిత వివరణను పాదసూచికలోని అక్షరసన్నిహిత ప్రత్యామ్నాయం సమతుల్యం చేస్తుంది.
