id: EZR.5.11
reference: Ezra 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: te
  text: 'వారు మాకు ఇచ్చిన జవాబు ఇలా ఉంది[a]: “మేము ఆకాశానికీ భూమికీ దేవుడైన దేవుని సేవకులం. ఎన్నో సంవత్సరాల క్రితం నిర్మించబడిన ఆ మందిరాన్ని[b] మేము తిరిగి కడుతున్నాం. ఇశ్రాయేలుకు చెందిన ఒక గొప్ప రాజు దాన్ని కట్టి పూర్తి చేశాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు మాకు పంపిన సందేశం ఇలా ఉంది.”
    reason: పִתְגָם అనే అరామీయ పదానికి సందర్భానుసారంగా ‘జవాబు’, ‘మాట’, ‘సందేశం’ అనే అర్థాలు ఉండవచ్చు.
  - marker: b
    text: లేదా, “ఆ మందిరాన్ని మేము కడుతున్నాం.” అరామీయ కృదంతం కొనసాగుతున్న నిర్మాణాన్ని సూచిస్తుంది; అది ఇంతకు ముందు ఉన్న మందిరం కావడం వల్ల “తిరిగి కడుతున్నాం” అని అనువదించవచ్చు.
    reason: మూలంలోని కొనసాగుతున్న కార్యాన్ని మరియు సందర్భం సూచించే పునర్నిర్మాణ భావాన్ని రెండింటినీ నిలుపుతుంది.
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: వారు మాకు తిరిగి ఇచ్చిన జవాబు ఇదే
  rationale: ఈ అరామీయ పదబంధం ప్రత్యుత్తరంలోని విషయాన్ని పరిచయం చేస్తుంది. ‘తిరిగి ఇచ్చిన జవాబు’ అనేది మూలంలోని ‘తిరిగి ఇవ్వడం’ అనే క్రియారూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: לְמֵמַר
  choice: ప్రత్యక్ష ఉల్లేఖనంతో వ్యక్తీకరించబడింది
  rationale: ఇది ప్రత్యక్ష మాటలను పరిచయం చేసే సాధారణ అరామీయ ఉల్లేఖన పదం. తెలుగులో ‘అంటూ’ అని అదనంగా పెట్టకుండా ద్విబిందువు, ఉల్లేఖన చిహ్నాలతో సహజంగా తెలియజేయబడింది.
- source_word: עַבְדוֹהִי
  choice: సేవకులం
  rationale: ఈ సందర్భంలో బానిసత్వం కంటే దేవునికి విధేయతతో చేసే సేవ ప్రధాన భావం; అందువల్ల ‘సేవకులు’ సముచితం.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: ఆకాశానికీ భూమికీ దేవుడైనవాని
  rationale: ఈ బిరుదు దేవుని సార్వభౌమాధికారాన్ని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో సేవకులతో సంబంధాన్ని సహజంగా చూపేందుకు ‘దేవుడైనవాని’ అని ఇచ్చాం.
- source_word: וּבָנַיִן
  choice: మేము తిరిగి కడుతున్నాం
  rationale: కృదంత రూపం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. ఆలయం ఇంతకుముందే ఉండి ధ్వంసమైన సందర్భం వల్ల ‘తిరిగి’ అనేది సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అక్షరార్థమైన ‘కడుతున్నాం’ను పాదసూచికలో నిలిపాం.
- source_word: בַּיְתָא
  choice: మందిరం
  rationale: అక్షరార్థం ‘ఇల్లు’ అయినా, ఇక్కడ స్పష్టమైన సూచన దేవాలయానికే. ఆధునిక తెలుగు పాఠకుడికి ‘మందిరం’ సహజంగా, నిర్దిష్టంగా ఉంటుంది.
- source_word: דִּי הֲוָא בְנֵה
  choice: నిర్మించబడిన
  rationale: మునుపటి కాలంలో జరిగిన నిర్మాణాన్ని ఈ సంబంధ వాక్యం సూచిస్తుంది; తెలుగు కర్మణి రూపం మూల నిర్మాణాన్ని సముచితంగా ప్రతిబింబిస్తుంది.
- source_word: מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: ఎన్నో సంవత్సరాల క్రితం
  rationale: అక్షరార్థంగా ‘దీనికి ముందు అనేక సంవత్సరాలు’; ‘ఎన్నో సంవత్సరాల క్రితం’ ఆధునిక తెలుగులో సహజమైన కాలవ్యక్తీకరణ.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: ఇశ్రాయేలుకు చెందిన ఒక గొప్ప రాజు
  rationale: రాజును పేరు పెట్టకుండా మూలం అతని ఘనతను సూచిస్తుంది. ‘ఇశ్రాయేలుకు చెందిన’ అనేది సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: దాన్ని కట్టి పూర్తి చేశాడు
  rationale: రెండు క్రియలు నిర్మాణాన్ని ప్రారంభించడం మరియు దాన్ని పూర్తికి తీసుకురావడం అనే దశలను వేరుగా నిలుపుతాయి.
theological_decisions:
- issue: సామ్రాజ్య అధికారులకు ఇచ్చిన జవాబులో దేవుని బిరుదు
  choice: ఆకాశానికీ భూమికీ దేవుడు
  alternative: ఆకాశాలకూ భూమికీ దేవుడు
  rationale: ఈ బిరుదు ఇశ్రాయేలు దేవుణ్ణి స్థానిక దేవతగా పరిమితం చేయకుండా ఆయన సార్వత్రిక అధికారాన్ని నేరుగా ప్రకటిస్తుంది. అరామీయ బహువచన రూపాన్ని తెలుగులో సహజమైన ఏకవచన ‘ఆకాశం’తో అందించాం.
- issue: ప్రస్తుత నిర్మాణ కార్య స్వరూపం
  choice: తిరిగి కడుతున్నాం
  alternative: కడుతున్నాం
  rationale: మందిరం ఇంతకు ముందు నిర్మించబడిందని వెంటనే వచ్చే వాక్యభాగమే చెబుతుంది. అందువల్ల పునర్నిర్మాణ సందర్భాన్ని స్పష్టం చేశాం; అయితే అరామీయ కృదంతం స్వయంగా ‘తిరిగి’ అనే భావాన్ని తప్పనిసరి చేయనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘గృహం’ కంటే సందర్భాన్ని స్పష్టం చేసే ‘మందిరం’, ‘నిర్మిస్తున్నాం’ కంటే మాట్లాడే జవాబులో సహజమైన ‘కడుతున్నాం’ ఎంచుకున్నాం. మూలంలోని ప్రత్యక్ష వాక్య స్వరాన్ని ఉల్లేఖన చిహ్నాలతో నిలిపాం.
