id: EZR.5.16
reference: Ezra 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: te
  text: అప్పుడు ఈ షేష్బజ్జరు వచ్చి యెరూషలేములో ఉన్న దేవుని ఇంటి పునాదులు వేశాడు[a]. అప్పటినుండి ఇప్పటివరకు అది కట్టబడుతూ ఉంది[b], కాని ఇంకా పూర్తికాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత పదశఃగా, “పునాదులను ఏర్పాటు చేశాడు.” అరామీయ నుడికారం అక్షరార్థంగా “పునాదులు ఇచ్చాడు” అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అది కట్టబడుతోంది.” అరామీయ క్రియ కొనసాగుతున్న కర్మణి ప్రక్రియను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: కథనంలోని కాలక్రమాన్ని సూచించే అరామీయ క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: ఈ షేష్బజ్జరు
  rationale: వ్యక్తిపేరును లిప్యంతరీకరించి, ముందుగా ప్రస్తావించిన వ్యక్తిని సూచించే demonstrative భావాన్ని ‘ఈ’తో నిలిపింది.
- source_word: אֲתָא
  choice: వచ్చి
  rationale: సరళమైన కథన క్రియను తెలుగులో తదుపరి చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: יְהַב אֻשַּׁיָּא
  choice: పునాదులు వేశాడు
  rationale: అక్షరార్థంగా ‘పునాదులు ఇచ్చాడు’ అనే అరామీయ నుడికారానికి నిర్మాణ సందర్భంలో సహజమైన తెలుగు సమానం.
- source_word: בֵית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: ‘దేవుని ఇల్లు’ అనే మూలపదబంధాన్ని సందర్భానుసారంగా, ఆధునిక తెలుగులో ఆరాధనా భవనాన్ని స్పష్టంగా సూచించేలా అందిస్తుంది.
- source_word: דִּי בִירוּשְׁלֶם
  choice: యెరూషలేములో ఉన్న
  rationale: స్థలాన్ని తెలిపే సంబంధ వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో నిలిపింది.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: అప్పటి నుండి ఇప్పటి వరకు
  rationale: పునాది వేసిన సమయం నుంచి వక్తల వర్తమానం వరకు సాగిన కాలవ్యవధిని నేరుగా తెలియజేస్తుంది.
- source_word: מִתְבְּנֵא
  choice: కట్టబడుతూనే ఉంది
  rationale: అరామీయ క్రియలోని కర్మణి రూపాన్నీ, గతంలో మొదలై ప్రస్తుతం కొనసాగుతున్న ప్రక్రియనూ నిలుపుతుంది.
- source_word: וְלָא שְׁלִם
  choice: కాని ఇంకా పూర్తికాలేదు
  rationale: ప్రస్తుత సమయానికి నిర్మాణం ముగియలేదనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
