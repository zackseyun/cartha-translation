  to: అయితే, బబులోను రాజైన కోరెషు మొదటి సంవత్సరంలో, కోరెషు రాజు దేవుని ఈ మందిరాన్ని కట్టమని ఒక ఆజ్ఞ జారీ చేశాడు.[a]
  rationale: The revision preserves the Aramaic sequence and its explicit repetition of Cyrus's name and title, uses a natural Telugu royal-decree construction, and keeps 'build' in the main text. The footnote preserves 'rebuild' only as a contextually possible rendering rather than treating it as the verb's lexical meaning.
