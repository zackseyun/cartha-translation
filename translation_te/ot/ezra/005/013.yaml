source:
  edition: WLC
  text: בְּרַם֙ בִּ/שְׁנַ֣ת חֲדָ֔ה לְ/כ֥וֹרֶשׁ מַלְכָּ֖/א דִּ֣י בָבֶ֑ל כּ֤וֹרֶשׁ מַלְכָּ/א֙ שָׂ֣ם טְעֵ֔ם בֵּית אֱלָהָ֥/א דְנָ֖ה לִ/בְּנֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: te
  text: అయితే, బబులోను రాజైన కోరెషు మొదటి సంవత్సరంలో, కోరెషు రాజు దేవుని ఈ మందిరాన్ని కట్టమని ఒక ఆజ్ఞ జారీ చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తిరిగి కట్టమని.’ అరామీయ క్రియకు స్వతహాగా ‘కట్టు’ అని అర్థం; ఆలయ పునరుద్ధరణ సందర్భం వల్ల ‘తిరిగి కట్టు’ అనే భావం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: בִּשְׁנַת חֲדָה
  choice: పరిపాలనలో మొదటి సంవత్సరంలో
  rationale: ఇది రాజ్యపాలనా సంవత్సరాన్ని సూచించే కాలనిర్ణయ ప్రయోగం; తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘పరిపాలనలో’ చేర్చబడింది.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: బబులోను రాజైన కోరెషు
  rationale: రాజు పేరు, అతని రాజబిరుదు రెండింటినీ మూలంలోని సంబంధంతో సహజంగా తెలియజేస్తుంది.
- source_word: שָׂם טְעֵם
  choice: ఒక ఆజ్ఞ జారీ చేశాడు
  rationale: అక్షరార్థంగా ‘ఆజ్ఞను ఉంచాడు’; రాజపాలనా సందర్భంలో అధికారిక ఆజ్ఞను ప్రకటించడం అనే సంయుక్తార్థాన్ని ఈ ప్రయోగం అందిస్తుంది.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: దేవుని ఈ మందిరాన్ని
  rationale: అక్షరార్థం ‘దేవుని ఈ ఇల్లు’; ఇక్కడ సూచించబడేది దేవాలయం కాబట్టి సాధారణ ఆధునిక తెలుగు పాఠకునికి ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לִבְנֵא
  choice: కట్టించాలని
  rationale: అరామీయ క్రియ యొక్క ప్రాథమిక అర్థం ‘కట్టు’; ఆజ్ఞతో కూడిన ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ప్రేరణార్థక రూపం వాడబడింది.
