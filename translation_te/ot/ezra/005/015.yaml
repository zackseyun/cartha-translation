id: EZR.5.15
reference: Ezra 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַר לֵ֓/הּ אלה מָֽאנַיָּ֔/א שֵׂ֚א אֵֽזֶל אֲחֵ֣ת הִמּ֔וֹ בְּ/הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/בֵ֥ית אֱלָהָ֖/א יִתְבְּנֵ֥א עַל אַתְרֵֽ/הּ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: te
  text: “ఈ పాత్రలను తీసుకొని వెళ్లి, యెరూషలేములో ఉన్న దేవాలయంలో వాటిని ఉంచు; దేవుని మందిరం దాని స్థలంలో తిరిగి కట్టబడాలి[a]” అని అతనితో చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాని స్థలంలో కట్టబడాలి.” అరామీయ పదబంధం దేవుని మందిరం దాని స్థలంలోనే నిర్మించబడాలని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: అని అతనితో చెప్పాడు
  rationale: అరామీయ కథన శైలిలోని తృతీయ పురుష ఏకవచన క్రియను, పరోక్ష కర్మను స్పష్టంగా ఉంచుతూ తెలుగులో సహజమైన ఉద్ధరణ ముగింపు క్రమంలో అనువదించబడింది.
- source_word: אֵלֶּה מָאנַיָּא
  choice: ఈ పాత్రలను
  rationale: ఇక్కడ ఈ పదం యెరూషలేము దేవాలయం నుండి తీసుకెళ్లబడిన పవిత్ర ఉపకరణాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పాత్రలు’ సందర్భోచితమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: שֵׂא אֵזֶל אֲחֵת הִמּוֹ
  choice: తీసుకొని వెళ్లి ... వాటిని ఉంచు
  rationale: వరుస ఆజ్ఞలను తెలుగులో సహజమైన సంయుక్త క్రియా నిర్మాణంతో అందిస్తూ, తీసుకోవడం, వెళ్లడం, ఉంచడం అనే మూడు చర్యల భావాన్ని నిలిపింది.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: యెరూషలేములో ఉన్న దేవాలయంలో
  rationale: הֵיכְלָא ఇతర సందర్భాల్లో రాజభవనాన్ని సూచించగలిగినా, ఇక్కడ పవిత్ర పాత్రల సందర్భం వల్ల దేవాలయమే ఉద్దేశ్యం. דִּי సంబంధ వాక్య భావాన్ని ‘ఉన్న’ ద్వారా నిలిపింది.
- source_word: וּבֵית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: ‘దేవుని ఇల్లు’ అనే మూలరూప భావాన్ని గౌరవిస్తూ, దేవాలయాన్ని సూచించే గంభీరమైన సహజ తెలుగు పదబంధంగా ‘దేవుని మందిరం’ ఎంచుకోబడింది.
- source_word: יִתְבְּנֵא
  choice: తిరిగి కట్టబడాలి
  rationale: క్రియ యొక్క నిష్క్రియార్థాన్ని నిలిపి, ధ్వంసమైన మందిర పునర్నిర్మాణ సందర్భాన్ని ‘తిరిగి’ ద్వారా స్పష్టం చేసింది; మూలంలో సాధారణంగా ‘కట్టబడాలి’ అనే రూపమూ సాధ్యమే.
- source_word: עַל אַתְרֵהּ
  choice: దాని స్థలంలో
  rationale: మందిరం తన మునుపటి లేదా తగిన స్థలంలోనే నిర్మించబడాలనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘దాని’ దేవుని మందిరాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఉద్ధరణలోని ఆజ్ఞల క్రమం సహజ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అమర్చబడింది.
