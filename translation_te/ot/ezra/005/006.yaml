translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అధికారిక పత్ర శైలిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను వాడింది. ‘అధికారులు’ అనే వివాదాస్పద పదానికి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది. తరువాత ఉత్తర పాఠ్యం మొదలవుతుందని సూచించేందుకు చివర ద్విబిందువు ఉంచింది.
