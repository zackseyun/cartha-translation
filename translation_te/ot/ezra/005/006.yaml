  text: פַּרְשֶׁ֣גֶן אִ֠גַּרְתָּ/א דִּֽי שְׁלַ֞ח תַּתְּנַ֣י פַּחַ֣ת עֲבַֽר נַהֲרָ֗/ה וּ/שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָ֣וָתֵ֔/הּ אֲפַ֨רְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה עַל דָּרְיָ֖וֶשׁ מַלְכָּֽ/א־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: te
  text: 'నది అవతలి ప్రాంతపు అధిపతి అయిన తత్తెనై, షెతర్-బోజెనై, అతని సహచరులైన నది అవతలి ప్రాంతంలోని అధికారులు[a] దర్యావేషు రాజుకు పంపిన ఉత్తరం ప్రతిలిపి ఇది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అఫర్సకాయులు.” ఈ పదం అధికారుల హోదాను కాక ఒక జనసమూహం లేదా పరిపాలనా వర్గం పేరును సూచిస్తే ఇలా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: ప్రతిలిపి
  rationale: అధికారిక పత్రానికి చేసిన వ్రాతప్రతిని సూచించే అరామీయ నామవాచకానికి ఆధునిక తెలుగు పరిపాలనా సందర్భంలో సహజమైన పదం.
- source_word: אִגַּרְתָּא
  choice: ఉత్తరం
  rationale: ఇది అధికారికంగా పంపిన లిఖిత సమాచారమైనప్పటికీ, సాధారణ పాఠకులకు స్పష్టమైన ‘ఉత్తరం’ సందర్భానికి సరిపోతుంది.
- source_word: שְׁלַח
  choice: పంపిన
  rationale: ఉత్తరాన్ని పంపిన సాధారణ క్రియను సహజమైన తెలుగు సంబంధ విశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: תַּתְּנַי
  choice: తత్తెనై
  rationale: వ్యక్తి పేరును మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: פַּחַת
  choice: అధిపతి
  rationale: పర్షియా పరిపాలనా సందర్భంలోని ప్రాంతీయ పాలక పదవిని సులభంగా అర్థమయ్యే గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֲבַר נַהֲרָה
  choice: నది అవతలి ప్రాంతం
  rationale: యూఫ్రటీసుకు పడమరనున్న పర్షియా పరిపాలనా ప్రాంతానికి వాడిన స్థిర నామాన్ని అనవసర వివరణ లేకుండా ప్రతిబింబిస్తుంది.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: షెతర్‌-బోజెనై
  rationale: సంయుక్త వ్యక్తి పేరును తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וּכְנָוָתֵהּ
  choice: వారి సహచరులు
  rationale: మూలంలో ఏకవచన ప్రత్యయమున్నా జాబితాలోని ఇద్దరితో సహజంగా అనుసంధానమయ్యే తెలుగు ప్రయోగాన్ని ఎంచుకుంది; అధికారిక సహవర్గ భావాన్ని నిలుపుతుంది.
- source_word: אֲפַרְסְכָיֵא
  choice: అధికారులు
  rationale: అర్థం అనిశ్చితమైన ఈ పదాన్ని సందర్భానుసారంగా పరిపాలనా వర్గాన్ని సూచించే కార్యాత్మక పదంగా అనువదించింది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: עַל
  choice: కు
  rationale: ‘పంపు’ అనే క్రియతో గ్రహీతను సూచించే సహజమైన తెలుగు విభక్తి.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: దారయవేషు రాజు
  rationale: పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, రాజ బిరుదును సహజ తెలుగు క్రమంలో ఉంచింది.
