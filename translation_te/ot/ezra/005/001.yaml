source:
  edition: WLC
  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: te
  text: ప్రవక్త హగ్గయి, ఇద్దో కుమారుడైన జెకర్యా—ఈ ప్రవక్తలు—యూదాలోను యెరూషలేములోను ఉన్న యూదులకు[a], వారిపై ఉన్న ఇశ్రాయేలు దేవుని నామంలో[b] ప్రవచించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదా ప్రజలకు.’ అరామీయ పదం యూద ప్రజలను సూచించవచ్చు; లేదా భౌగోళికంగా యూదా ప్రాంత ప్రజలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలు దేవుని అధికారంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: ప్రవచించారు
  rationale: అరామీయ భాషలోని ఈ క్రియ కథనంలోని చర్యను తెలియజేస్తుంది. హగ్గయి, జెకర్యా ఇద్దరూ కర్తలు కాబట్టి తెలుగులో గౌరవార్థక బహువచన క్రియ సహజంగా ఉంటుంది; ప్రారంభ וְ కు ప్రత్యేకంగా ‘అప్పుడు’ అనే కాలార్థం జోడించలేదు.
- source_word: חַגַּי נביאה
  choice: ప్రవక్త హగ్గయి
  rationale: నిర్ణీత రూపంలోని ‘ప్రవక్త’ హగ్గయికి అన్వయపదంగా ఉంది. ఆధునిక తెలుగులో ‘ప్రవక్త హగ్గయి’ సహజమైన క్రమం.
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: ఇద్దో కుమారుడైన జెకర్యా
  rationale: בַר అంటే ‘కుమారుడు’; వ్యక్తుల పేర్లు ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
- source_word: נביאיא
  choice: ఈ ప్రవక్తలు
  rationale: మూలంలోని బహువచన అన్వయపదం హగ్గయి, జెకర్యా ఇద్దరినీ సమష్టిగా సూచిస్తుంది. పునరుక్తి అనిపించినా మూల నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל
  choice: యూదులకు
  rationale: ‘ప్రవచించు’ అనే క్రియతో ఇది సందేశం అందుకున్న వారిని సూచిస్తుంది. ఈ సందర్భంలో ‘వారికి విరోధంగా’ అనే భావం అవసరం లేదు.
- source_word: יְהוּדָיֵא
  choice: యూదులు
  rationale: ఈ పదం యూద ప్రజలను లేదా భౌగోళికంగా యూదా ప్రాంత ప్రజలను సూచించవచ్చు. ప్రధాన పాఠంలో సాధారణ పాఠకులకు పరిచితమైన ‘యూదులు’ వాడి, ‘యూదా ప్రజలు’ అనే సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: యూదాలోను యెరూషలేములోను ఉన్న
  rationale: דִּי సాపేక్ష ఉపవాక్యాన్ని పరిచయం చేస్తుంది. చెర అనంతర పాత నిబంధన సందర్భానికి ‘యూదా’ సరిపోతుంది.
- source_word: בְּשֻׁם
  choice: నామంలో
  rationale: ఈ నుడికారం దేవుని ప్రతినిధులుగా, ఆయన అధికారంతో మాట్లాడడాన్ని సూచిస్తుంది. ‘నామంలో’ మూల రూపకాన్ని నిలుపుతుంది; అధికార భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో నేరుగా అనువదించింది.
- source_word: עֲלֵיהוֹן
  choice: వారిపైన ఉన్న
  rationale: ఈ మాటను ‘ఇశ్రాయేలు దేవుడు’ అనే పదబంధానికి అనుసంధానించి, దేవుడు వారిపై ఉన్నాడనే మూలంలోని సంక్షిప్త భావాన్ని అధికంగా విశదీకరించకుండా నిలిపింది.
theological_decisions:
- issue: చివరి עֲלֵיהוֹן పదబంధం దేనికి అన్వయించాలి, దాని భావం ఏమిటి?
  choice: ‘ఇశ్రాయేలు దేవుడు’ అనే పదబంధానికి అన్వయించి ‘వారిపైన ఉన్న’ అని అనువదించాం.
  alternative: దీనిని ప్రవచించే చర్యతో మరింత సడలుగా అనుసంధానించి ‘వారిమీదికి’ అని, లేదా దేవుని అధికారాన్ని స్పష్టం చేస్తూ ‘వారికి అధిపతిగా ఉన్న’ అని అనువదించవచ్చు.
  rationale: వాక్య నిర్మాణం ప్రకారం ఇది సమీపంలోని ‘ఇశ్రాయేలు దేవుడు’ అనే పదబంధాన్నే విశేషించడం అత్యంత సంభావ్యం. ‘వారిపైన ఉన్న’ అనేది దేవుని పర్యవేక్షణ, అధికారం లేదా సన్నిధి మధ్య ఉన్న భావ విస్తృతిని పూర్తిగా ఒకే అర్థానికి కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఈ ప్రవక్తలు’ అనే అన్వయపదాన్ని డాష్‌ల మధ్య ఉంచడం ద్వారా మూలంలోని పునరుక్త నిర్మాణాన్ని సహజంగా నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాలైన ‘యూదులకు’ మరియు ‘నామంలో’ వెంట ఉంచాం.
