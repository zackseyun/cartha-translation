  text: אֱדַ֗יִן שְׁאֵ֨לְנָא֙ לְ/שָׂבַיָּ֣/א אִלֵּ֔ךְ כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לְ/מִבְנְיָ֔ה וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: te
  text: 'అప్పుడు మేము ఆ పెద్దలను ఇలా అడిగాము: “ఈ ఇంటిని కట్టడానికి, ఈ నిర్మాణాన్ని పూర్తి చేయడానికి మీకు ఆజ్ఞ ఇచ్చినవారు ఎవరు?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఇల్లు” దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిర్మాణం” అని అనువదించిన అరామీయ పదం కట్టడం యొక్క నిర్మిత భాగాన్ని, చట్రాన్ని లేదా దానికి సంబంధించిన నిర్మాణ పనిని మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సూచించే అరామీయ క్రియావిశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: שְׁאֵלְנָא לְשָׂבַיָּא אִלֵּךְ כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: మేము ఆ పెద్దలను ఇలా అడిగాము
  rationale: మూలంలోని ‘అడిగాము’ మరియు ‘వారితో ఇలా చెప్పాము’ అనే ద్వంద్వ వాక్యప్రయోగాన్ని తెలుగు సహజ శైలిలో ఒకే ఉద్ధరణ పరిచయంగా అందిస్తుంది; ప్రశ్నించిన భావం నిలుస్తుంది.
- source_word: מַן
  choice: ఎవరు
  rationale: అధికారాన్ని ఇచ్చిన వ్యక్తి లేదా పక్షం ఎవరని ప్రశ్నించే సూటి రూపం.
- source_word: שָׂם לְכֹם טְעֵם
  choice: మీకు ఆజ్ఞ ఇచ్చినవారు
  rationale: టְעֵם అధికారిక ఆదేశం లేదా రాజాజ్ఞను సూచిస్తుంది. ‘ఆజ్ఞ’ పరిపాలనా భావాన్ని ఉంచుతూ సహజంగా ఉంది.
- source_word: בַּיְתָא דְנָה
  choice: ఈ మందిరాన్ని
  rationale: పదశః ‘ఈ ఇల్లు’; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ‘మందిరం’ ఉద్దేశిత సూచనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִבְנְיָה
  choice: కట్టడానికి
  rationale: మూల క్రియ సాధారణంగా నిర్మించడాన్ని సూచిస్తుంది; సందర్భానుసారమైన ‘తిరిగి కట్టడానికి’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: ఈ నిర్మాణాన్ని
  rationale: అరుదైన నామవాచకం కట్టడం యొక్క నిర్మిత భాగం, కట్టడం లేదా చట్రాన్ని సూచించవచ్చు. ‘నిర్మాణం’ ఆ పరిధిని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: לְשַׁכְלָלָה
  choice: పూర్తి చేయడానికి
  rationale: పనిని సంపూర్ణ స్థితికి తీసుకురావడం అనే భావాన్ని, నివేదికకు తగిన గౌరవప్రదమైన శైలిలో ఇస్తుంది.
