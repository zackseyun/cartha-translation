  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పరిపాలనా-కథన శైలి. మూలంలోని ప్రశ్నను నేరుగా ఉంచి, అరుదైన నిర్మాణ సంబంధ పదంలోని అనిశ్చితిని పాదసూచికలో కాపాడింది.
