source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: te
  text: అందువల్ల, మా పూర్వీకులు పరలోక దేవునికి కోపం పుట్టించారు కాబట్టి, ఆయన వారిని కల్దీయుడైన బబులోను రాజు నెబుకద్నెజరు చేతికి అప్పగించాడు. అతడు ఈ మందిరాన్ని[a] పడగొట్టి, ప్రజలను బబులోనుకు చెరగా తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అరామీయంలో అక్షరార్థంగా ‘ఈ ఇంటిని’; ఇక్కడ దేవాలయం ఉద్దేశించబడింది.
    reason: మూలపదం యొక్క అక్షరార్థాన్ని మరియు సందర్భంలోని సూచ్యార్థాన్ని రెండింటినీ తెలియజేయడం.
lexical_decisions:
- source_word: לָהֵן
  choice: అయితే
  rationale: ఈ అరామీయ సంధానపదం సందర్భంలో ముందటి మాటకు భిన్నమైన పరిణామాన్ని పరిచయం చేస్తుంది. ‘అయితే’ దాని వ్యతిరేకతతో కూడిన సంధాన బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִן דִּי
  choice: కాబట్టి
  rationale: ఇది కారణాన్ని సూచించే అరామీయ పదబంధం. తెలుగు వాక్య నిర్మాణంలో కారణ వాక్యాంతాన వచ్చే ‘కాబట్టి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַרְגִּזוּ
  choice: కోపం పుట్టించారు
  rationale: רגז ధాతువు యొక్క కారణార్థక రూపం దేవునికి కోపం కలిగించడాన్ని సూచిస్తుంది. ఈ ఎంపిక కారణార్థాన్ని నిలుపుతూ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אֲבָהֳתַנָא
  choice: మా పూర్వీకులు
  rationale: అక్షరార్థంగా ‘మా తండ్రులు’; ఇక్కడ గత తరాల వారిని సూచిస్తున్నందున ‘మా పూర్వీకులు’ ఆధునిక తెలుగులో అపార్థం లేకుండా భావాన్ని అందిస్తుంది.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: పరలోక దేవునికి
  rationale: ఇది చెర అనంతర కాలపు ప్రామాణిక దైవ బిరుదు. ‘పరలోక దేవుడు’ గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: వారిని … చేతికి అప్పగించాడు
  rationale: ఒకరి అధికారానికి మరొకరిని అప్పగించడాన్ని తెలిపే సెమిటిక్ నుడికారాన్ని ‘చేతికి అప్పగించాడు’ స్పష్టంగా నిలుపుతుంది.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: కల్దీయుడైన బబులోను రాజు నెబుకద్నెజరు
  rationale: כסדיא ఏకవచనంలో నెబుకద్నెజరుకు అన్వయించే జాతివాచకం. ‘కల్దీయుడైన’ అని అనువదించడం దానిని ‘బబులోనీయుడు’గా వ్యాఖ్యానించకుండా మూల రూపాన్ని కాపాడుతుంది.
- source_word: וּבַיְתָה דְנָה
  choice: ఈ మందిరాన్ని
  rationale: అక్షరార్థం ‘ఈ ఇంటిని’ అయినా సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకుడికి సూచిత స్థలాన్ని స్పష్టం చేయడానికి ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: סַתְרֵהּ
  choice: పడగొట్టి
  rationale: నిర్మాణాన్ని కూల్చడం లేదా ధ్వంసం చేయడం ఈ క్రియ భావం. ‘పడగొట్టి’ ఆ నిర్మాణ సంబంధిత చర్యను ‘నాశనం చేసి’ కంటే నిర్దిష్టంగా తెలుపుతుంది.
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: ప్రజలను బబులోనుకు చెరగా తీసుకెళ్లాడు
  rationale: కారణార్థక גלה బలవంతంగా దేశం నుండి తీసుకెళ్లి ప్రవాసంలో ఉంచడాన్ని సూచిస్తుంది. ‘చెరగా తీసుకెళ్లాడు’ ప్రయాణం మరియు నిర్బంధ ప్రవాసం అనే రెండు భావాలనూ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవ తీర్పులో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: ఆయన వారిని … నెబుకద్నెజరు చేతికి అప్పగించాడు
  alternative: ఆయన వారిని నెబుకద్నెజరు చేతిలో పడనిచ్చాడు
  rationale: మూలపాఠం దేవుడు కేవలం అనుమతించాడని కాక, వారిని అప్పగించాడని నేరుగా చెబుతుంది. అందువల్ల దైవ తీర్పు యొక్క ప్రత్యక్ష కారణత్వాన్ని మృదువుపరచలేదు.
- issue: దేవాలయానికి ‘ఇల్లు’ అనే మూలపదం
  choice: ఈ మందిరాన్ని, అక్షరార్థం పాదసూచికలో
  alternative: ఈ ఇంటిని
  rationale: ‘ఇల్లు’ అనే మూల రూపానికి దైవశాస్త్ర సంబంధిత ప్రతిధ్వని ఉన్నప్పటికీ, ఆధునిక తెలుగులో ‘ఈ ఇంటిని’ సాధారణ నివాస గృహంగా అపార్థమయ్యే అవకాశం ఉంది. అందువల్ల సందర్భార్థాన్ని ప్రధాన పాఠంలోనూ అక్షరార్థాన్ని పాదసూచికలోనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పూర్వీకులు,’ ‘చేతికి అప్పగించాడు,’ ‘చెరగా తీసుకెళ్లాడు’ వంటి పదబంధాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండడంతో పాటు మూలంలోని గంభీరతను నిలుపుతాయి.
