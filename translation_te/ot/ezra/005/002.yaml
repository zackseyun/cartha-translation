  variant: modern standard Telugu
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: te
  text: అప్పుడు షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు, యోజాదాకు కుమారుడు యేషూవ లేచి, యెరూషలేములో ఉన్న దేవుని ఇంటిని[a] కట్టడం మొదలుపెట్టారు. దేవుని ప్రవక్తలు వారితో కలిసి వారికి తోడ్పడుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని మందిరం.’ అరామీయంలో పదశః, ‘దేవుని ఇల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే అరామీయ కథన సూచికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קָמוּ
  choice: లేచి
  rationale: పదశః ‘లేచారు’ అనే భావాన్ని ఉంచుతూ, కార్యానికి పూనుకోవడాన్ని తెలిపే తెలుగు కథన ప్రయోగంగా సహజంగా ఉంది.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు
  rationale: అరామీయ వంశసూచకమైన ‘బర్’ను ‘కుమారుడు’గా అనువదించి, వ్యక్తినామాలను లిప్యంతరీకరించింది.
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: యోజాదాకు కుమారుడు యేషూవ
  rationale: మూలంలోని సంక్షిప్త నామరూపం యేషూవను నిలిపి, ‘బర్’ను నేరుగా ‘కుమారుడు’గా అనువదించింది.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: కట్టడం మొదలుపెట్టారు
  rationale: ‘వారు ప్రారంభించారు’ అనే సహాయక క్రియను దాని క్రియాపూరకంతో సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: בֵּית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: పదశః ‘దేవుని ఇల్లు’; ఈ సందర్భంలో ఆలయాన్ని సూచిస్తున్నందున సాధారణ తెలుగు పాఠకుడికి స్పష్టమైన ‘మందిరం’ను ప్రధాన పాఠ్యంలో వాడి, పదశః రూపాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: דִּי בִירוּשְׁלֶם
  choice: యెరూషలేములో ఉన్న
  rationale: దేవుని మందిరం ఉన్న ప్రదేశాన్ని గుర్తించే సంబంధ వాక్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נביאיא די אלהא מסעדין להון
  choice: దేవుని ప్రవక్తలు ... వారికి తోడ్పడుతున్నారు
  rationale: ‘తోడ్పడుతూ/సహాయం చేస్తూ’ అనే క్రియాశీల వర్తమాన భాగధాతు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని ఇల్లు’ అనే పదబంధపు సూచన
  choice: సందర్భార్థమైన ‘దేవుని మందిరం’ను ప్రధాన పాఠ్యంలో ఉంచి, పదశః రూపాన్ని పాదసూచికలో ఇవ్వడం
  alternative: దేవుని ఇల్లు
  rationale: అరామీయ మూలం పదశః ‘దేవుని ఇల్లు’ అని ఉన్నా, సందర్భంలో అది యెరూషలేము ఆలయాన్నే సూచిస్తుంది. ‘మందిరం’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; పాదసూచిక మూల రూపాన్ని పారదర్శకంగా కాపాడుతుంది.
- issue: ప్రవక్తల పాత్ర
  choice: వారితో ఉండి వారికి తోడ్పడుతున్నారు
  alternative: వారికి సహాయం చేస్తున్నారు
  rationale: ప్రవక్తలు కేవలం అక్కడ ఉన్నారని కాక, నిర్మాణకార్యానికి క్రియాశీలంగా మద్దతిచ్చారని భాగధాతువు తెలియజేస్తుంది; మద్దతు స్వరూపాన్ని అంతకంటే నిర్దిష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే కథనశైలి. పేర్లకు తెలుగు బైబిల్ సంప్రదాయానికి దగ్గరైన లిప్యంతరీకరణలు వాడబడ్డాయి; మూలంలోని యేషూవ నామరూపం నిలుపబడింది.
