  to: అప్పుడు షయల్తీయేలు కుమారుడు జెరుబ్బాబెలు, యోజాదాకు కుమారుడు యేషూవ లేచి, యెరూషలేములో ఉన్న దేవుని ఇంటిని[a] కట్టడం మొదలుపెట్టారు. దేవుని ప్రవక్తలు వారితో కలిసి వారికి తోడ్పడుతూ ఉన్నారు.
