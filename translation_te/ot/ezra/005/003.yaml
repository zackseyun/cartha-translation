translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పాతకాలపు క్రియాంతాలను నివారించి, అధికారిక సందర్భానికి తగిన ‘అధిపతి’, ‘ఉత్తర్వు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని అనిశ్చితమైన నిర్మాణ పదాన్ని ప్రధాన పాఠ్యంలో విస్తృతంగా ఉంచి పాదసూచికలో ప్రత్యామ్నాయాలను తెలిపాం.
