source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ/א֩ אֲתָ֨א עֲלֵי/ה֜וֹן תַּ֠תְּנַי פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה וּ/שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן וְ/כֵן֙ אָמְרִ֣ין לְ/הֹ֔ם מַן שָׂ֨ם לְ/כֹ֜ם טְעֵ֗ם בַּיְתָ֤/א דְנָה֙ לִ/בְּנֵ֔א וְ/אֻשַּׁרְנָ֥/א דְנָ֖ה לְ/שַׁכְלָלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: te
  text: ఆ సమయంలో, ‘నదికి అవతల’నున్న ప్రాంతపు[b] అధిపతి తత్తెనయి, షెతర్-బోజెనయి, వారి సహచరులు వారి దగ్గరికి వచ్చి, “ఈ మందిరాన్ని కట్టడానికి, ఈ నిర్మాణాన్ని[c] పూర్తి చేయడానికి మీకు ఉత్తర్వు[a] ఇచ్చినవారెవరు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఉత్తర్వు’గా అనువదించిన అరామిక్ పదం అధికారిక ఆజ్ఞను లేదా శాసనాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నదికి అవతల’ అనేది యూఫ్రటీసు నదికి పశ్చిమాన ఉన్న ప్రాంతానికి పర్షియా పరిపాలనలో వాడిన పేరు.
    reason: cultural_note
  - marker: c
    text: ‘నిర్మాణం’గా అనువదించిన పదం దేవాలయ నిర్మాణ పనిని మరింత నిర్దిష్టంగా సూచించవచ్చు; కొందరు దాన్ని ‘గోడ’ లేదా ‘చట్రం’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: ఆ సమయంలో
  rationale: అరామిక్ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: వారి దగ్గరికి వచ్చి
  rationale: యూదా నిర్మాణకారుల వద్దకు వారు చేరుకున్నారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּתְּנַי
  choice: తత్తెనయి
  rationale: వ్యక్తి పేరును అరామిక్ రూపానికి దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: ‘నదికి అవతల’ ప్రాంతపు అధిపతి
  rationale: פַּחַת అనే పదంలోని ప్రాంతీయ పాలకుని భావాన్నీ, עֲבַר נַהֲרָה అనే పర్షియా పరిపాలనా ప్రాంతనామపు అక్షరార్థాన్నీ నిలుపుతుంది.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: షెతర్-బోజెనయి
  rationale: సంయుక్త వ్యక్తి పేరును తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: וּכְנָוָתְהוֹן
  choice: వారి సహచరులు
  rationale: వారితో అనుబంధంగా ఉన్న అధికారులను లేదా సహాయకులను సూచించే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: ఇలా ... అని అడిగారు
  rationale: ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే అరామిక్ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: మీకు ఉత్తర్వు ఇచ్చింది ఎవరు?
  rationale: Imperial Aramaic సందర్భంలో טְעֵם అధికారిక ఆజ్ఞ లేదా శాసనాన్ని సూచిస్తుంది; ‘ఉత్తర్వు’ ఆ అధికారిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: ఈ మందిరాన్ని కట్టడానికి
  rationale: בַּיְתָא అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ తెలుగు పాఠకునికి ఆ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది. ‘కట్టడానికి’ మూలంలోని సాధారణ నిర్మాణ క్రియను నిలుపుతుంది; ‘తిరిగి కట్టడానికి’ అని విస్తరించదు.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: ఈ నిర్మాణాన్ని
  rationale: ఈ అరుదైన పదం గోడ, కట్టడం, లేదా నిర్మాణపు పనిని సూచించవచ్చు; ‘నిర్మాణం’ అనవసరమైన నిర్దిష్టతను రుద్దకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לְשַׁכְלָלָה
  choice: పూర్తి చేయడానికి
  rationale: నిర్మాణాన్ని ముగింపుకు తీసుకురావడం అనే క్రియార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
