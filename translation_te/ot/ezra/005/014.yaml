translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. దీర్ఘమైన అరామీయ సంబంధ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి స్పష్టత పెంచాం. ప్రధాన పాఠ్యంలో సహజమైన గుర్తింపు సూత్రాన్ని వాడి, మరింత పదానుసార రూపాన్ని [a] పాదటిప్పణిలో ఇచ్చాం.
