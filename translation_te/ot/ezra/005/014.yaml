  to: అంతేకాక, దేవుని మందిరపు బంగారు, వెండి పాత్రలను నెబుకద్నెజరు యెరూషలేములోని ఆలయం నుండి బయటకు తీసి బబులోను ఆలయానికి తీసుకువచ్చాడు. రాజైన కోరెషు వాటిని బబులోను ఆలయం నుండి బయటకు తీసి, తాను గవర్నరుగా నియమించిన షేష్బజ్జరు అనే వ్యక్తికి ఇచ్చాడు.[a]
