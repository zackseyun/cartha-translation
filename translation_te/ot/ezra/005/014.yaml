  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: te
  text: అంతేకాక, దేవుని మందిరపు బంగారు, వెండి పాత్రలను నెబుకద్నెజరు యెరూషలేములోని ఆలయం నుండి బయటకు తీసి బబులోను ఆలయానికి తీసుకువచ్చాడు. రాజైన కోరెషు వాటిని బబులోను ఆలయం నుండి బయటకు తీసి, తాను గవర్నరుగా నియమించిన షేష్బజ్జరు అనే వ్యక్తికి ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “వాటిని షేష్బజ్జరుకు ఇచ్చాడు—అతని పేరు షేష్బజ్జరు; అతనిని గవర్నరుగా నియమించాడు.”'
    reason: మూలంలోని שְׁמֵהּ (‘అతని పేరు’) అనే గుర్తింపు సూత్రాన్నీ, షేష్బజ్జరును గవర్నరుగా నియమించిన సంబంధ వాక్యాన్నీ మరింత పదానుసారంగా చూపుతుంది.
lexical_decisions:
- source_word: וְאַף
  choice: అంతేకాక
  rationale: అరామీయ భాషలోని అనుసంధాన, జోడింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָאנַיָּא
  choice: పాత్రలు
  rationale: ఆలయానికి సంబంధించిన బంగారు, వెండి ఉపకరణాలను సూచించే సందర్భోచితమైన, సుపరిచితమైన పదం.
- source_word: בֵית אֱלָהָא
  choice: దేవుని మందిరం
  rationale: అక్షరార్థమైన ‘దేవుని ఇల్లు’ భావాన్ని గౌరవప్రదంగా ఉంచుతూ, తరువాతి הֵיכְלָאకు వాడిన ‘ఆలయం’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: బంగారు, వెండి
  rationale: పాత్రలు ఏ పదార్థంతో చేయబడ్డాయో తెలుగులో సహజంగా విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: הַנְפֵּק
  choice: బయటకు తీసి
  rationale: మూలంలోని causative క్రియను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵיכְלָא
  choice: ఆలయం
  rationale: యెరూషలేము మరియు బబులోనులోని ఆరాధనా భవనాలను ఈ సందర్భంలో సరిగ్గా సూచిస్తుంది.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: వాటిని ... తీసుకువచ్చాడు
  rationale: క్రియతో పాటు పాత్రలను సూచించే బహువచన కర్మ సర్వనామాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: రాజైన కోరెషు
  rationale: అరామీయ పదక్రమపు భావాన్ని సహజమైన తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: షేష్బజ్జరు అనే వ్యక్తికి ఇచ్చాడు
  rationale: ‘అతని పేరు షేష్బజ్జరు’ అనే గుర్తింపు సూత్రాన్ని అర్థనష్టం లేకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֶחָה
  choice: అధిపతి
  rationale: పర్షియా పరిపాలనా పదవిని సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదంతో సూచిస్తుంది; ‘గవర్నరు’ కూడా సాధ్యమే.
- source_word: שָׂמֵהּ
  choice: నియమించిన
  rationale: ఒక అధికార పదవిలో ఉంచడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
