  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱדַ֥יִן כְּנֵ֖מָא אֲמַ֣רְנָא לְּ/הֹ֑ם מַן אִנּוּן֙ שְׁמָהָ֣ת גֻּבְרַיָּ֔/א דִּֽי דְנָ֥ה בִנְיָנָ֖/א בָּנַֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/004.yaml
  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: te
  text: 'అప్పుడు మేము వారితో ఇలా అన్నాం: “ఈ కట్టడాన్ని నిర్మిస్తున్న పురుషుల పేర్లు ఏమిటి?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అప్పుడు మేము వారితో ఈ విధంగా అన్నాం: ‘ఈ కట్టడాన్ని నిర్మిస్తున్న పురుషుల పేర్లు ఏమిటి?’”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి చర్యను సూచించే కాలక్రమ అవ్యయంగా సహజంగా ఉంది.
- source_word: כְּנֵמָא
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తూ ‘ఈ విధంగా’ అనే భావాన్ని నిలుపుతుంది.
- source_word: אֲמַרְנָא לְּהֹם
  choice: మేము వారితో … అన్నాం
  rationale: మసోరా పాఠంలోని ప్రథమ పురుష బహువచనాన్ని నిలుపుతూ, ‘చెప్పాము’ అనే మూల క్రియకు సన్నిహితంగా ఉంది; ప్రశ్న ఉన్నందున ‘అడిగాం’ అనడం సాధ్యమైనా అది మూలంలో లేని ప్రత్యేక క్రియాభావాన్ని చేర్చుతుంది.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: పేర్లు ఏమిటి?
  rationale: పేర్లను తెలుసుకోవడానికి వేసిన ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גֻּבְרַיָּא
  choice: మనుషుల
  rationale: మూలంలోని పురుషవాచక బహువచనాన్ని వ్యక్తులనే భావంలో సాధారణ తెలుగులో తెలియజేస్తుంది; ‘వారి’ అని మాత్రమే అనడం కంటే మూల నామవాచకాన్ని నిలుపుతుంది.
- source_word: דְנָה בִנְיָנָא
  choice: ఈ కట్టడాన్ని
  rationale: సూచక సర్వనామాన్నీ, నిర్మించబడుతున్న భౌతిక నిర్మాణాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: בָּנַיִן
  choice: కడుతున్న
  rationale: అరామీయ భాగధాతువు సూచించే కొనసాగుతున్న చర్యను తెలుగు వర్తమాన కొనసాగింపు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ప్రశ్న వేసినవారి గుర్తింపు
  choice: మసోరా పాఠం ప్రకారం ‘మేము … అన్నాం’
  alternative: ‘వారు మమ్మల్ని అడిగారు’
  rationale: కొన్ని అనువాదాలు సందర్భం లేదా ఇతర పాఠసాక్ష్యాల ఆధారంగా వక్తలను తారుమారు చేసినా, ఇచ్చిన WLC పాఠం స్పష్టంగా ప్రథమ పురుష బహువచన రూపాన్ని కలిగి ఉంది; దానిని సవరించకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అన్నాం’ మూలంలోని సాధారణ ‘చెప్పు/అను’ క్రియను నిలుపుతుంది; ‘అడిగాం’ అని వివరణాత్మకంగా మార్చలేదు.
