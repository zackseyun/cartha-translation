  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజసభా-పరిపాలనా శైలి పాటించబడింది. పొడవైన అరామీయ వాక్య నిర్మాణాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినా, విచారణ మరియు రాజ నిర్ణయం కోరడం అనే తార్కిక క్రమం నిలుపబడింది.
