  source_fidelity: 'అరామీయ మూలంలోని అభ్యర్థన క్రమం సరిగ్గా నిలిచింది: రాజుకు అనుకూలమైతే బబులోనులోని రాజ ఖజానాలో శోధన చేయించాలి; కోరెషు రాజు యెరూషలేములోని ఈ దేవుని మందిరాన్ని కట్టమని ఆజ్ఞ జారీ చేశాడో లేదో నిర్ధారించాలి; ఆపై రాజు తన నిర్ణయాన్ని వారికి తెలియజేయాలి. “కట్టడానికి” అనే ప్రధాన పాఠ్య ఎంపిక לְמִבְנֵא యొక్క సాధారణ అర్థానికి నమ్మకంగా ఉంది.'
