source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: te
  text: ఇప్పుడు రాజుకు మంచిదనిపిస్తే, యెరూషలేములో ఉన్న ఈ దేవుని మందిరాన్ని కట్టడానికి[a] రాజైన కోరెషు ఆజ్ఞ జారీ చేశాడన్న విషయం నిజమో కాదో బబులోనులోని రాజ ఖజానాలో వెదకనివ్వండి. ఈ విషయం గురించి రాజు తన నిర్ణయాన్ని మాకు తెలియజేయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరిగి కట్టడానికి.” అరామీయ క్రియకు సాధారణంగా “కట్టడం” అని అర్థం; మందిర పునరుద్ధరణ సందర్భాన్ని బట్టి “తిరిగి కట్టడం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈ విషయం గురించి రాజు తన చిత్తాన్ని మా వద్దకు పంపాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: ఇప్పుడు
  rationale: అభ్యర్థనలో తదుపరి దశను పరిచయం చేసే అరామీయ సంభాషణా సూచికను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: రాజుకు మంచిదనిపిస్తే
  rationale: రాజును ఉద్దేశించిన వినయపూర్వక పరిపాలనా భాషను సహజంగా నిలుపుతుంది.
- source_word: יִתְבַּקַּר
  choice: వెదకనివ్వండి
  rationale: ఆజ్ఞాపూర్వక భావంగల కర్మణి రూపాన్ని తెలుగు మర్యాదపూర్వక అభ్యర్థనగా వ్యక్తపరుస్తూ, పత్రాల కోసం చేసే అన్వేషణను సూచిస్తుంది.
- source_word: בְּבֵית גִּנְזַיָּא
  choice: రాజ ఖజానాలో
  rationale: అక్షరార్థంగా ‘నిధుల గృహం’; రాజ పత్రాలు కూడా భద్రపరచబడే స్థలాన్ని సూచించే సంక్షిప్తమైన పరిపాలనా పదప్రయోగం.
- source_word: הֵן אִיתַי דִּי
  choice: అన్న విషయం నిజమో కాదో
  rationale: ఆజ్ఞ నిజంగా జారీ అయిందా అని ధృవీకరించాల్సిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: రాజైన కోరెషు ఆజ్ఞ జారీ చేశాడు
  rationale: Imperial Aramaic పరిపాలనా సందర్భంలో טְעֵם అధికారిక ఆజ్ఞను, שִׂים దానిని జారీ చేయడాన్ని సూచిస్తాయి.
- source_word: לְמִבְנֵא
  choice: కట్టడానికి
  rationale: మూల క్రియ యొక్క ప్రాథమిక అర్థమైన ‘కట్టు’ను నిలుపుతుంది; పునర్నిర్మాణ సందర్భార్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: ఈ దేవుని మందిరాన్ని
  rationale: ‘ఈ’ అనే సూచనార్థాన్ని నిలుపుతూ, తెలుగు బైబిలు సందర్భంలో దేవుని గృహాన్ని సహజంగా ‘మందిరం’గా వ్యక్తపరుస్తుంది.
- source_word: וּרְעוּת מַלְכָּא
  choice: రాజు తన నిర్ణయాన్ని
  rationale: రాజు చిత్తం, అభిప్రాయం లేదా అధికారిక నిర్ణయం అనే పరిపాలనా భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: మాకు తెలియజేయాలి
  rationale: అక్షరార్థంగా ‘మా వద్దకు పంపాలి’; సందర్భంలో రాజు తన నిర్ణయాన్ని సందేశంగా పంపాలనే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
