translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘దేవుని గృహం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘ఆలయం’ను పాదటిప్పణిలో ఇచ్చాం. తొలి ఆగిపోవడం మరియు ఆ స్థితి కొనసాగడం మధ్య ఉన్న భేదాన్ని స్పష్టంగా ఉంచాం.
