- from: అప్పుడు యెరూషలేములో ఉన్న దేవుని గృహానికి[b] సంబంధించిన పని ఆగిపోయింది[a]; అది పారసీక రాజైన దర్యావేషు పరిపాలనలో రెండవ సంవత్సరం వరకు ఆగిపోయిన స్థితిలోనే ఉండింది[c].
