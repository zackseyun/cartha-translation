  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: te
  text: అప్పుడు యెరూషలేములో ఉన్న దేవుని గృహపు[b] పని ఆగిపోయింది[a]; అది పారసీక రాజైన దర్యావేషు పరిపాలన రెండవ సంవత్సరం వరకు ఆగి ఉండింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిలిచిపోయింది’ / ‘ఆపబడింది.’ అరామీయ בטל మూలానికి ఆగడం, నిలిచిపోవడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేవుని ఆలయం.’ అక్షరార్థంగా, ‘దేవుని గృహం.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఆగి ఉండింది’ అనే మాటలు పని ఆగిన స్థితి కొనసాగిందని తెలియజేస్తాయి; అవి కేవలం ఆగిపోవడాన్ని రెండోసారి చెప్పడం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: అప్పుడు
  rationale: ముందటి కథనంతో కాలక్రమ సంబంధాన్ని చూపే అరామీయ క్రియావిశేషణానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּטֵלַת
  choice: ఆగిపోయింది
  rationale: בטל మూలంలోని ‘ఆగడం, నిలిచిపోవడం’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తరువాత వచ్చే కొనసాగుతున్న స్థితి వాక్యభాగం నుండి తొలి ఆగిపోవడాన్ని వేరుచేస్తుంది.
- source_word: עֲבִידַת
  choice: పని
  rationale: మూలంలోని సాధారణ ‘పని/సేవ’ అనే అర్థాన్ని నిలుపుతుంది; సందర్భం అది దేవుని గృహానికి సంబంధించిన పని అని నిర్దిష్టం చేస్తుంది.
- source_word: בֵּית אֱלָהָא
  choice: దేవుని గృహం
  rationale: మూలపదబంధాన్ని పారదర్శకంగా నిలుపుతుంది; ‘దేవుని ఆలయం’ సందర్భానుసారమైన ప్రత్యామ్నాయం.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: యెరూషలేములో ఉన్న
  rationale: సంబంధవాచక కణం మరియు స్థల సూచనను సహజమైన తెలుగు విశేషణ వాక్యభాగంగా అందిస్తుంది.
- source_word: וַהֲוָת בָּטְלָא
  choice: ఆగిపోయిన స్థితిలోనే ఉండింది
  rationale: ఇది కేవలం ఆగిపోవడాన్ని మళ్లీ చెప్పడం కాక, ఆ నిలిచిన స్థితి కొనసాగిందనే durative భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: రెండవ సంవత్సరం వరకు
  rationale: రాజ్యపాలన కాలగణనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: దర్యావేషు పరిపాలనలో
  rationale: రాజు పరిపాలనా సంవత్సరాన్ని సూచించే అరామీయ నిర్మాణాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מֶלֶךְ פָּרָס
  choice: పారసీక రాజైన
  rationale: దర్యావేషుకు సంబంధించిన రాజబిరుదును సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
