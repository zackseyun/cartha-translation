source:
  edition: WLC
  text: וּ/בְ/מַלְכוּת֙ אֲחַשְׁוֵר֔וֹשׁ בִּ/תְחִלַּ֖ת מַלְכוּת֑/וֹ כָּתְב֣וּ שִׂטְנָ֔ה עַל יֹשְׁבֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: te
  text: అహష్వేరోషు పాలన ఆరంభంలో, వారు యూదా, యెరూషలేము నివాసులకు వ్యతిరేకంగా నిందారోపణ[a] రాశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫిర్యాదు’ లేదా ‘విరోధపూర్వక ఆరోపణ.’ హీబ్రూ పదం అధికారిక అభియోగ రూపంలో వ్యక్తమయ్యే వ్యతిరేకత భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמַלְכוּת
  choice: పాలనలో
  rationale: ఈ పదబంధం రాజు పరిపాలించిన కాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పాలనలో’ సహజంగా ఉండి కాలసూచనను స్పష్టంగా అందిస్తుంది; ఆరంభంలోని וְ కథన అనుసంధానంగా ఉన్నందున ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: అహష్వేరోషు
  rationale: హీబ్రూ వ్యక్తినామ రూపాన్ని లిప్యంతరీకరించాం; చారిత్రక గుర్తింపును ముందుగానే నిర్ణయిస్తూ ‘క్షయర్ష’ వంటి పేరును పెట్టలేదు.
- source_word: בִּתְחִלַּת מַלְכוּתוֹ
  choice: అతని పాలన ఆరంభంలో
  rationale: అతని రాజ్యపాలన మొదటి దశను తెలిపే నిర్మాణాన్ని సహజమైన, స్పష్టమైన తెలుగులో నిలిపింది.
- source_word: כָּתְבוּ
  choice: వారు … రాసిచ్చారు
  rationale: హీబ్రూలో కర్త స్పష్టంగా పేర్కొనబడలేదు; ‘వారు’ అని అదే అనిర్దిష్టతను నిలిపాం. సందర్భంలోని అధికారిక లిఖిత ఆరోపణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘రాసిచ్చారు’ ఎంచుకున్నాం.
- source_word: שִׂטְנָה
  choice: నిందారోపణ
  rationale: ఈ నామవాచకం ప్రతికూలతతో కూడిన అధికారిక ఆరోపణ లేదా ఫిర్యాదు భావాన్ని కలిగి ఉంది. ‘నిందారోపణ’ ఆ లిఖితపూర్వక విరోధ భావాన్ని అందిస్తుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: עַל
  choice: పై
  rationale: ఆరోపణ లక్ష్యంగా ఉన్న ప్రజలను సూచిస్తున్నందున ‘పై’ సహజమైన తెలుగు సమానం.
- source_word: יֹשְׁבֵי יְהוּדָה וִירוּשָׁלִָם
  choice: యూదా, యెరూషలేము నివాసులు
  rationale: ‘నివసించేవారు’ అనే క్రియాత్మక భావాన్ని సంక్షిప్తంగా, ఆధునిక ప్రామాణిక తెలుగులో ‘నివాసులు’ అందిస్తుంది. రెండు ప్రదేశాల పేర్లను మూలంలోని విధంగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని అనిర్దిష్ట కర్తను ‘వారు’గా అలాగే ఉంచి, పరిపాలనా సందర్భాన్ని అతిగా వివరించకుండా నిలిపాం.
