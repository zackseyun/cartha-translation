translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా శైలిని ఉపయోగించాం. అరామీయ మూలంలోని అధికారిక ఉత్తర నిర్మాణాన్ని నిలుపుతూ, ఖచ్చితంగా తెలియని హోదాను అతినిర్దిష్టంగా అనువదించలేదు. ‘నది’ అనేది యూఫ్రటీసు నదిని, ‘నది అవతల’ అనేది పర్షియా పరిపాలనా దృష్టిలో యూఫ్రటీసుకు పడమరనున్న ప్రాంతాన్ని సూచిస్తుంది.
