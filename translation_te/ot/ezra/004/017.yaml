source:
  edition: WLC
  text: פִּתְגָמָ֞/א שְׁלַ֣ח מַלְכָּ֗/א עַל רְח֤וּם בְּעֵל טְעֵם֙ וְ/שִׁמְשַׁ֣י סָֽפְרָ֔/א וּ/שְׁאָר֙ כְּנָוָ֣תְ/ה֔וֹן דִּ֥י יָתְבִ֖ין בְּ/שָֽׁמְרָ֑יִן וּ/שְׁאָ֧ר עֲבַֽר נַהֲרָ֛/ה שְׁלָ֖ם וּ/כְעֶֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: te
  text: 'రాజు రెహూము అనే అధికారి[a]కి, లేఖకుడైన షిమ్షయికి, సమరయలో నివసిస్తున్న వారి మిగిలిన సహచరులకు, నది అవతల ఉన్న మిగిలినవారికి జవాబు పంపించాడు: “శాంతి[b]. ఇక—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన పరిపాలకుడు.’ ఈ అరామీయ హోదా యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శుభాభినందనలు.’ ఇది ఉత్తరారంభ అభివాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: జవాబు
  rationale: ఇది అధికారిక సందేశాన్ని సూచించగల పదం; ఇక్కడ ముందటి ఉత్తరానికి రాజు పంపిన ప్రతిస్పందన కావడంతో ‘జవాబు’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: שְׁלַח
  choice: పంపిన
  rationale: అరామీయ క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, వాక్యాన్ని తెలుగులో సహజమైన శీర్షికాత్మక నిర్మాణంగా మలిచింది.
- source_word: מַלְכָּא
  choice: రాజు
  rationale: సందర్భంలో ఇప్పటికే ప్రస్తావించబడిన పర్షియా రాజును సూచిస్తుంది.
- source_word: עַל
  choice: కు
  rationale: ‘పంపు’ అనే క్రియ తర్వాత గ్రహీతలను సూచించే సందర్భోచిత తెలుగు విభక్తి.
- source_word: בְּעֵל טְעֵם
  choice: అధికారి
  rationale: పదబంధం ఒక పరిపాలనా పదవిని సూచిస్తుంది; ఖచ్చితమైన హోదా అనిశ్చితమైనందున ‘సేనాధిపతి’ లేదా ‘కులపతి’ వంటి అతినిర్దిష్ట పదాలకన్నా ‘అధికారి’ సురక్షితమైనది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: סָפְרָא
  choice: లేఖకుడు
  rationale: లిఖిత, పరిపాలనా బాధ్యత కలిగిన అధికారిక హోదాను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: వారి మిగిలిన సహచరులు
  rationale: పేరు చెప్పబడిన అధికారులతో కలిసి ఉన్న లేదా వారికి అనుబంధమైన వారిని విస్తృతంగా సూచిస్తుంది.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: సమరయలో నివసిస్తున్న
  rationale: వర్తమాన కృదంత నిర్మాణంలోని స్థిర నివాస భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: నది అవతల ఉన్న మిగిలినవారు
  rationale: మూలంలో ‘ప్రాంతం/సంస్థానం’ అనే ప్రత్యేక నామవాచకం లేదు; అందువల్ల దానిని చేర్చకుండా భౌగోళిక-పరిపాలనా సూచనను నిలిపింది.
- source_word: שְׁלָם
  choice: శాంతి
  rationale: ఉత్తరారంభ అభివాదమైనప్పటికీ మూలపదంలోని ‘శాంతి’ భావాన్ని నేరుగా నిలుపుతుంది; సహజ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: וּכְעֶת
  choice: ఇక—
  rationale: రాజు జవాబు ప్రధాన విషయానికి మారే ఉత్తర సూత్రాన్ని సూచిస్తుంది; భావం తదుపరి వచనంలో కొనసాగుతుందని దీర్ఘవిరామం తెలియజేస్తుంది.
