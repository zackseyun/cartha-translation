translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుకు పంపిన అధికారిక నివేదికకు తగిన గంభీరమైన లేఖా శైలిని ఉపయోగించాం. మూలంలో లేని ‘రాష్ట్రం’ లేదా ‘ప్రావిన్స్’ అనే పదాన్ని ప్రధాన వాక్యంలో చేర్చకుండా, పరిపాలనా నేపథ్యాన్ని పాదసూచికలో ఇచ్చాం. ‘భాగం’ అనే పదం మూలంలోని రాజకీయ, ఆర్థిక అర్థసాధ్యతను తెరిచి ఉంచుతుంది.
