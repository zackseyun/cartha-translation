  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: te
  text: 'మేము రాజుకు తెలియజేసేదేమనగా: ఈ పట్టణం నిర్మించబడి, దాని ప్రాకారాలు పూర్తి చేయబడితే, దీని కారణంగా నదికి అవతల ప్రాంతంలో[b] మీకు ఏ భాగమూ[a] ఉండదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భాగం’ అని అనువదించిన అరామీయ పదానికి ‘వాటా’ లేదా ‘పాలు’ అని కూడా అర్థం కావచ్చు; ఈ సందర్భంలో అది మరింత నిర్దిష్టంగా ‘ఆదాయం’ను సూచించే అవకాశమూ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నదికి అవతల’ అనేది యూఫ్రటీసు నదికి పడమరగా ఉన్న పర్షియా పరిపాలనా ప్రాంతానికి అధికారికంగా వాడిన పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה לְמַלְכָּא
  choice: మేము రాజుకు తెలియజేస్తున్నదేమంటే
  rationale: అధికారిక లేఖా శైలిలో ఉన్న అరామీయ క్రియారూపాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דִּי הֵן
  choice: 'అంటే: … అయితే'
  rationale: నివేదికలోని విషయాన్ని పరిచయం చేస్తూ షరతును సూచించే రెండు కణాల భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: קִרְיְתָא דָךְ
  choice: ఈ పట్టణం
  rationale: సూచనార్థక సర్వనామాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: תִּתְבְּנֵא
  choice: తిరిగి నిర్మించబడి
  rationale: సందర్భంలోని పునర్నిర్మాణ భావాన్ని, అరామీయ నిష్క్రియ రూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: దాని ప్రాకారాలు పూర్తి చేయబడితే
  rationale: నగర రక్షణ కట్టడాలను సూచించడానికి ‘ప్రాకారాలు’ సరైన పదం; నిర్మాణం పూర్తికావడమనే భావాన్ని నిష్క్రియ రూపంలో నిలుపుతుంది.
- source_word: לָקֳבֵל דְּנָה
  choice: దీని కారణంగా
  rationale: ముందున్న షరతు వల్ల కలిగే పరిణామాన్ని స్పష్టంగా చూపిస్తుంది; మూలంలోని సూచనార్థక భావాన్ని కూడా ఉంచుతుంది.
- source_word: חֲלָק
  choice: భాగం
  rationale: ‘వాటా,’ ‘భాగం,’ సందర్భానుసారంగా ‘ఆదాయం’ అనే విస్తృత అర్థసాధ్యతను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
- source_word: בַּעֲבַר נַהֲרָא
  choice: నదికి అవతల ప్రాంతంలో
  rationale: భౌగోళిక పదబంధాన్ని సహజ తెలుగులో ఇస్తూ, అది పర్షియా పరిపాలనా ప్రాంతనామమని పాదసూచికలో వివరిస్తుంది.
- source_word: לָא אִיתַי לָךְ
  choice: మీకు ఏ … ఉండదు
  rationale: దత్తివాచక స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య వాక్యంగా అందిస్తుంది.
