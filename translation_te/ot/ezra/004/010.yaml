source:
  edition: WLC
  text: וּ/שְׁאָ֣ר אֻמַּיָּ֗/א דִּ֤י הַגְלִי֙ אָסְנַפַּר֙ רַבָּ֣/א וְ/יַקִּירָ֔/א וְ/הוֹתֵ֣ב הִמּ֔וֹ בְּ/קִרְיָ֖ה דִּ֣י שָׁמְרָ֑יִן וּ/שְׁאָ֥ר עֲבַֽר נַהֲרָ֖/ה וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: te
  text: గొప్పవాడూ ఘనుడూ అయిన ఓస్నప్పరు చెరగా తరలించి సమరయ పట్టణంలో వారిని స్థిరపరచిన మిగిలిన జనాలు[a], నది అవతల ఉన్న ప్రాంతంలోని మిగిలినవారు[b]—ఇప్పుడు:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఓస్నప్పరును సాధారణంగా అష్షూరు రాజైన అష్షూర్బానిపాల్‌తో గుర్తిస్తారు. అయితే మూలపాఠంలోని అరామీయ పేరురూపాన్నే ఇక్కడ ఉంచాం.
    reason: cross_reference
  - marker: b
    text: అక్షరార్థంగా, “నది అవతల.” ఇది యూఫ్రటీసు నదికి పడమరగా ఉన్న ప్రాంతానికి పారసీకులు వాడిన పరిపాలనా పేరు.
    reason: cultural_note
  - marker: c
    text: ఇది అరామీయ లేఖల్లో వాడే సూత్రప్రాయమైన పదం. “ఇత్యాది” లేదా “ఆ సమయంలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: మిగిలిన జనాలు
  rationale: ఈ పదబంధం ముందటి జాబితాలో ఇంకా మిగిలిన ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, జాతి/ప్రజాసమూహ భావాన్ని నిలుపుతుంది.
- source_word: הַגְלִי
  choice: చెరగా తీసుకువచ్చి
  rationale: సామ్రాజ్య పాలకులు ప్రజలను బలవంతంగా స్వదేశం నుంచి తరలించిన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָסְנַפַּר
  choice: ఓస్నప్పరు
  rationale: చారిత్రక గుర్తింపును ప్రధాన పాఠ్యంలో నిర్ణయించకుండా, అరామీయ పాఠంలోని పేరురూపాన్నే తెలుగు లిపిలో నిలుపుతుంది.
- source_word: רַבָּא וְיַקִּירָא
  choice: మహానుభావుడూ ఘనుడూ అయిన
  rationale: ఇవి ఓస్నప్పరుకు ఇచ్చిన రాజాస్థాన గౌరవ విశేషణాలు; ఈ అనువాదం వాటి ఉన్నతమైన, ప్రశంసాత్మక ధోరణిని సహజ తెలుగులో కాపాడుతుంది.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: నివాసం ఏర్పరచిన
  rationale: కారణార్థక క్రియ ప్రజలను అక్కడ స్థిరపరచడాన్ని సూచిస్తుంది; ‘నివాసం ఏర్పరచిన’ అనే రూపం ఆ పరిపాలనా చర్యను స్పష్టం చేస్తుంది.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: సమరయ పట్టణంలో
  rationale: మూలపాఠంలోని ఏకవచన ‘పట్టణం’ను నిలుపుతూ, తెలుగు స్థలనామ సంప్రదాయానికి అనుగుణంగా ‘సమరయ’ను వాడుతుంది.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: నది అవతల ప్రాంతంలోని మిగిలినవారు
  rationale: ఇది యూఫ్రటీసుకు పడమరగా ఉన్న పారసీక పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజంగా చదవబడేలా అనువదించి, పరిపాలనా అర్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: וּכְעֶנֶת
  choice: 'ఇప్పుడు:'
  rationale: ఉత్తరంలోని ప్రధాన విషయానికి మార్పును సూచించే అరామీయ లేఖా సూత్రంగా గ్రహించి, దాని సంభాషణాత్మక కార్యాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన లేఖా శైలిని పాటించాం. మూలంలోని జాబితా కొనసాగింపు భావం వల్ల వాక్యం ఖండంలా ఉండటాన్ని అలాగే నిలిపాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట సహజ క్రమంలో ఉంచాం.
