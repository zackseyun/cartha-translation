translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి వాడాం. ఈ వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నాన్ని ఉంచాం. అనిశ్చిత సమూహనామాలను ఊహాత్మకంగా పరిష్కరించకుండా లిప్యంతరీకరించి, ముఖ్యమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో తెలిపాం.
