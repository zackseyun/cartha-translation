id: EZR.4.9
reference: Ezra 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱדַ֜יִן רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א וּ/שְׁאָ֖ר כְּנָוָתְ/ה֑וֹן דִּ֠ינָיֵ/א וַ/אֲפַרְסַתְכָיֵ֞/א טַרְפְּלָיֵ֣/א אֲפָֽרְסָיֵ֗/א ארכוי בָבְלָיֵ/א֙ שֽׁוּשַׁנְכָיֵ֔/א ד/הוא עֵלְמָיֵֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: te
  text: అప్పుడు అధికారి అయిన రెహూము[a], లేఖకుడు షిమ్షయి, వారి మిగతా సహచరులు—దీనాయులు[b], అఫర్సత్కాయులు[c], తర్పెలాయులు, పారసీకులు, ఎరెకువారు, బబులోనీయులు, షూషనువారు, అంటే ఏలామీయులు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ అరామీయ బిరుదును ‘ఆజ్ఞాపనల అధిపతి,’ ‘ప్రధాన అధికారి,’ లేదా ‘పాలనాధికారి’ అని కూడా అర్థం చేసుకోవచ్చు; పదవి యొక్క ఖచ్చిత స్వరూపం తెలియదు.
    reason: lexical_ambiguity
  - marker: b
    text: లేదా ‘న్యాయాధిపతులు.’ అరామీయ పదాన్ని సంప్రదాయంగా ఒక ప్రజాసమూహం పేరుగా కూడా చదివారు.
    reason: alternative_reading
  - marker: c
    text: ఈ అరామీయ పదం అర్థం అనిశ్చితం. కొందరు దీన్ని ఒక ప్రజాసమూహం పేరుగా, మరికొందరు పరిపాలనా అధికారులను సూచించే పదంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: కథనం లేదా పత్రపు తదుపరి దశను సూచించే సహజమైన తెలుగు క్రమసూచక పదం.
- source_word: רְחוּם
  choice: రెహూము
  rationale: వ్యక్తి పేరును తెలుగులో ధ్వన్యనుసారంగా రాశాం.
- source_word: בְּעֵל טְעֵם
  choice: అధికారి
  rationale: ఇది సామ్రాజ్య పరిపాలనలోని ఒక పదవి; ఆ పదవి యొక్క ఖచ్చిత విధి వివాదాస్పదం కాబట్టి అతిగా నిర్దిష్టం చేయకుండా సాధారణ అధికార బిరుదుగా అనువదించాం.
- source_word: שִׁמְשַׁי סָפְרָא
  choice: లేఖకుడు షిమ్షయి
  rationale: סָפְרָא పరిపాలనా సందర్భంలో లేఖకుడు లేదా కార్యదర్శిని సూచించగలదు; మూలానికి సమీపంగా, బైబిలు పాఠకులకు సుపరిచితంగా ఉండేందుకు ‘లేఖకుడు’ ఎంచుకున్నాం.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: వారి మిగతా సహచరులు
  rationale: ఆ ఇద్దరితో కలిసి ఉన్న మిగిలిన సమూహాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דִּינָיֵא
  choice: దీనాయులు
  rationale: చుట్టూ ఉన్న పదాలన్నీ ప్రజా లేదా ప్రాంతీయ సమూహాల పేర్లుగా ఉండటంతో, అనిశ్చిత పదాన్ని జాతి/సమూహ నామంగా లిప్యంతరీకరించాం; ‘న్యాయాధిపతులు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲפַרְסַתְכָיֵא
  choice: అఫర్సత్కాయులు
  rationale: గుర్తింపు అనిశ్చితమైన సమూహనామం కావచ్చని భావించి ఊహాత్మక పరిపాలనా అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా లిప్యంతరీకరించాం.
- source_word: טַרְפְּלָיֵא
  choice: తర్పెలాయులు
  rationale: ఖచ్చితంగా గుర్తించలేని ప్రజా సమూహనామాన్ని ధ్వన్యనుసారంగా రాశాం.
- source_word: אֲפָרְסָיֵא
  choice: పారసీకులు
  rationale: పర్షియా ప్రజలను సూచించే స్పష్టమైన సమూహనామానికి తెలుగులో స్థిరమైన రూపం.
- source_word: ארכוי
  choice: ఎరెకువారు
  rationale: ఎరెకు/ఊరుకు ప్రాంతానికి చెందినవారిని సూచించే పేరును పారదర్శకంగా వ్యక్తపరుస్తుంది.
- source_word: בָבְלָיֵא
  choice: బబులోనీయులు
  rationale: బబులోను ప్రజలను సూచించే సాధారణ తెలుగు రూపం.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: షూషను పట్టణవారు, అంటే ఏలామీయులు
  rationale: మొదటి పదం షూషను/సూసా నివాసులను సూచిస్తుంది; మూలంలోని వివరణాత్మక సంబంధాన్ని ‘అంటే’తో సహజంగా నిలిపాం.
