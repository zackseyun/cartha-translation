source:
  edition: WLC
  text: יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֣י יְהוּדָיֵ֗/א דִּ֤י סְלִ֨קוּ֙ מִן לְוָתָ֔/ךְ עֲלֶ֥י/נָא אֲת֖וֹ לִ/ירוּשְׁלֶ֑ם קִרְיְתָ֨/א מָֽרָדְתָּ֤/א ו/באישת/א בָּנַ֔יִן ו/שורי אשכללו וְ/אֻשַּׁיָּ֖/א יַחִֽיטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: te
  text: 'రాజుకు ఈ విషయం తెలియాలి: మీ దగ్గరనుండి మా దగ్గరకు వచ్చిన యూదులు[a] యెరూషలేముకు చేరుకున్నారు. వారు ఆ తిరుగుబాటుదారైన దుష్ట పట్టణాన్ని తిరిగి కడుతున్నారు; నగర గోడలను పూర్తి చేస్తున్నారు, పునాదులను బాగుచేస్తున్నారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ ప్రాంతవాసులు.” అరామీయ పదం యూదా/యూదయ ప్రాంత ప్రజలను, అలాగే విస్తృతంగా యూదులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పునాదులను వేస్తున్నారు/అమర్చుతున్నారు.” ఇక్కడి అరామీయ పదబంధం కొంత క్లిష్టమైనది; అది ఉన్న పునాదులను బాగుచేయడాన్నో, పునాదులను వేయడాన్నో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: రాజుకు ఈ విషయం తెలియాలి
  rationale: రాజుకు సమాచారం అందించే అరామీయ అధికారిక లేఖా సూత్రాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוּדָיֵא
  choice: యూదులు
  rationale: ఈ పదం యూదులను లేదా యూదా ప్రాంత ప్రజలను సూచించగలదు. ప్రధాన పాఠంలో సాధారణంగా అర్థమయ్యే ‘యూదులు’ ఉంచి, భౌగోళిక ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: మీ దగ్గరనుండి మా దగ్గరకు వచ్చిన
  rationale: సלק లోని పైకి వెళ్లడం/రావడం అనే భావాన్ని తెలుగులో బలవంతంగా చేర్చకుండా, లేఖకుల దృష్టికోణం మరియు ప్రయాణ గమ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: తిరుగుబాటు చేసే ఆ దుష్ట పట్టణాన్ని
  rationale: ఇవి ఆరోపణదారులు యెరూషలేమును రాజకీయంగానూ నైతికంగానూ నిందిస్తూ వాడిన పదాలు; వారి విరోధభావాన్ని అనువాదం నిలుపుతుంది.
- source_word: בָּנַיִן
  choice: తిరిగి కడుతున్నారు
  rationale: క్రియకు ‘కడుతున్నారు’ అనే అర్థం ఉన్నప్పటికీ, ముందే ఉనికిలో ఉన్న యెరూషలేము పునర్నిర్మాణ సందర్భాన్ని ‘తిరిగి’ స్పష్టం చేస్తుంది.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: ప్రాకారాలను పూర్తి చేస్తున్నారు
  rationale: שׁוּרַיָּא నగర రక్షణ గోడలను సూచిస్తుంది; ‘ప్రాకారాలు’ ఈ సందర్భానికి తగిన సహజ పదం. క్రియలో పూర్తి చేయడం అనే భావాన్ని నిలిపాం.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: పునాదులను బాగుచేస్తున్నారు
  rationale: అరామీయ పదబంధం క్లిష్టమైనది. పునరుద్ధరణ సందర్భంలో ఉన్న పునాదులను మరమ్మతు చేయడం ప్రధాన పాఠానికి సరిపోతుంది; ‘పునాదులు వేయడం/అమర్చడం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
