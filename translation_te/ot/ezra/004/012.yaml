translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుకు పంపిన అధికారిక ఫిర్యాదు స్వరాన్ని గౌరవప్రదంగా ఉంచాం. ఆరోపణదారుల ప్రతికూల వర్ణనను వారి మాటగానే నిలిపాం; మూలంలోని క్లిష్టమైన పునాదుల పదబంధాన్ని పాదసూచిక ద్వారా ఉద్దేశపూర్వకంగా అనిశ్చితంగా ఉంచాం.
