id: EZR.4.1
reference: Ezra 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: te
  text: యూదా, బెన్యామీనుల విరోధులు, చెరనుండి వచ్చిన సమాజానికి చెందినవారు ఇశ్రాయేలు దేవుడైన యాహ్వేకు ఆలయం నిర్మిస్తున్నారని విన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నారు
  rationale: שׁמע అనే క్రియ ఇక్కడ గతకాల కథనంలోని సాధారణ సంఘటనను తెలియజేస్తుంది. మూలంలో ప్రత్యేకంగా ‘ఇప్పుడు’ అనే కాలసూచక పదం లేదు.
- source_word: צָרֵי
  choice: విరోధులు
  rationale: צר యొక్క బహువచన నిర్మాణరూపం ప్రతికూలంగా ఎదిరించే వర్గాలను సూచిస్తుంది; ‘విరోధులు’ అనేది సైనిక శత్రుత్వాన్ని అనవసరంగా చేర్చకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీనులు
  rationale: ఇవి గోత్ర లేదా ప్రాంత నామాలు కాబట్టి పేర్లుగానే లిప్యంతరీకరించబడ్డాయి; సంబంధార్థం ‘యూదా, బెన్యామీనుల’ రూపంలో వ్యక్తమైంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי వారు విన్న విషయం ఏమిటో పరిచయం చేస్తుంది; కారణార్థకమైన ‘ఎందుకంటే’ కంటే తెలుగు పరోక్ష వాక్యంలోని ‘అని’ సరిపోతుంది.
- source_word: בְנֵי הַגּוֹלָה
  choice: చెరప్రజలు[a]
  rationale: పదశః ‘చెర యొక్క కుమారులు’ అనే సమూహపదం చెరకు వెళ్లినవారితో గుర్తింపు పొందిన సమాజాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ‘చెరప్రజలు’ అని ఇచ్చి, హీబ్రూ నుడికారాన్ని పాదసూచికలో నిలిపాము.
- source_word: בּוֹנִים
  choice: నిర్మిస్తున్నారు
  rationale: వర్తమాన కృదంతం గత కథన సందర్భంలో కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. తెలుగు పరోక్ష వాక్యంలో ‘నిర్మిస్తున్నారని’ ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది; మూలక్రియలో స్పష్టంగా లేని ‘పునర్నిర్మిస్తున్నారు’ అనే భావాన్ని చేర్చలేదు.
- source_word: הֵיכָל
  choice: ఆలయం
  rationale: היכל కొన్నిచోట్ల రాజభవనాన్ని సూచించగలిగినా, ఇక్కడ అది ఇశ్రాయేలు దేవుడైన యాహ్వే కోసం కట్టబడుతున్నందున ‘ఆలయం’ సందర్భోచిత అర్థం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל అనే ఉపసర్గ ఇక్కడ ఎవరి కోసం ఆలయం నిర్మిస్తున్నారో సూచిస్తుంది. יְהוָה అనే దైవనామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: ఇది యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే సాధారణ సంబంధపదబంధం; తెలుగులో ‘ఇశ్రాయేలు దేవుడైన యాహ్వే’ అని సహజంగా అమర్చబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలవచనంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథనశైలిలో అనువదించబడింది. ‘చెరప్రజలు’ సమూహ గుర్తింపును సంక్షిప్తంగా తెలుపుతుంది; ‘పునర్నిర్మిస్తున్నారు’ వంటి మూలంలో స్పష్టంగా లేని వివరణను చేర్చలేదు.
