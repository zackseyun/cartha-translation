  to: యూదా, బెన్యామీనుల విరోధులు, చెరనుండి వచ్చిన సమాజానికి చెందినవారు ఇశ్రాయేలు దేవుడైన యాహ్వేకు ఆలయం నిర్మిస్తున్నారని విన్నారు.
  rationale: The revision replaces an ambiguous Telugu compound with a natural expression for the exilic community. It preserves the ongoing sense of ‘were building,’ does not add ‘rebuilding,’ and retains the Hebrew idiom and explanatory nuance in the footnote.
