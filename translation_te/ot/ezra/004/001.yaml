    text: హీబ్రూలో పదశః, ‘చెర యొక్క కుమారులు’; అంటే చెరకు వెళ్లి తిరిగి వచ్చినవారితో కూడిన సమాజం.
    reason: మూల హీబ్రూ నుడికారాన్ని తెలియజేస్తూ, ప్రధాన వాక్యంలో ఆ పదబంధం సూచించే సమాజాన్ని స్పష్టంగా వ్యక్తపరచడానికి.
  revision_rationale: The revision replaces an ambiguous Telugu compound with a natural expression for the exilic community. It preserves the ongoing sense of ‘were building,’ does not add ‘rebuilding,’ and retains the Hebrew idiom and explanatory nuance in the footnote.
