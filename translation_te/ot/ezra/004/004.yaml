  text: וַ/יְהִי֙ עַם הָ/אָ֔רֶץ מְרַפִּ֖ים יְדֵ֣י עַם יְהוּדָ֑ה ו/מבלהים אוֹתָ֖/ם לִ/בְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/004.yaml
  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: te
  text: అప్పుడు దేశ ప్రజలు యూదా ప్రజల చేతులను బలహీనపరుస్తూ[a], యూదా ప్రజలు నిర్మించకుండా ఉండేలా వారిని భయపెడుతూ వచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “చేతులను బలహీనపరుస్తూ”; ఇది నిరుత్సాహపరచడం లేదా కార్యసంకల్పాన్ని దెబ్బతీయడం అనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిర్మాణకార్యం చేయకుండా వారిని భయపెడుతూ వచ్చారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు
  rationale: వావ్-క్రమరూపం కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: ఆ దేశ ప్రజలు
  rationale: చుట్టుపక్కల నివసిస్తూ తిరిగివచ్చిన యూదులకు విరోధంగా ఉన్న ప్రజలను సూచించే హీబ్రూ పదబంధాన్ని గుర్తించగల రూపంలో నిలుపుతుంది.
- source_word: מְרַפִּים יְדֵי
  choice: చేతులను బలహీనపరుస్తూ
  rationale: ధైర్యాన్ని లేదా కార్యసంకల్పాన్ని దెబ్బతీయడం అనే భావమున్న హీబ్రూ నుడికారపు రూపకాన్ని నిలుపుతుంది; కొనసాగుతున్న చర్యను క్రియారూపం తెలియజేస్తుంది.
- source_word: עַם יְהוּדָה
  choice: యూదా ప్రజలు
  rationale: నిర్మాణంలో పాల్గొన్న యూదా సమాజాన్ని సూచించే సరళమైన అనువాదం.
- source_word: וּמְבַלְהִים
  choice: భయపెడుతూ వచ్చారు
  rationale: בהל రూపం కలవరపరచడం లేదా భయానికి గురిచేయడం అనే కారణార్థాన్ని కలిగి ఉంది; తెలుగు రూపం చర్య కొనసాగిందనే భావాన్నీ అందిస్తుంది.
- source_word: אוֹתָם
  choice: వారిని
  rationale: ముందు పేర్కొన్న యూదా ప్రజలను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: לִבְנוֹת
  choice: కట్టకుండా
  rationale: లామెద్‌తో ఉన్న క్రియానామం సందర్భంలో వారు నిర్మాణం చేయకుండా నిరోధించబడిన కార్యాన్ని సూచిస్తుంది; తెలుగులో ‘కట్టకుండా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
