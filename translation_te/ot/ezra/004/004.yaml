translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠంలో హీబ్రూ నుడికారాన్ని నిలిపి, దాని భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం; לִבְנוֹת‌కు సందర్భసిద్ధమైన నిరోధార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, నిర్మాణపరంగా దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
