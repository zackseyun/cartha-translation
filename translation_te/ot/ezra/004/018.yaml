  language: en
  yaml_path: translation/ot/ezra/004/018.yaml
  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: te
  text: మీరు మాకు పంపిన పత్రం నా సమక్షంలో స్పష్టంగా చదవబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మాకు పంపిన ఉత్తరం నా సమక్షంలో స్పష్టంగా చదవబడింది.”
    reason: నִשְׁתְּוָנָא అనే పదానికి ‘ఉత్తరం’ అనే అర్థం కూడా సాధ్యం; అయితే పరిపాలనా సందర్భంలో ‘పత్రం’ కొంత విస్తృతమైన పదం.
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: పత్రం
  rationale: ఇది అధికారికంగా రాసి పంపిన సమాచారాన్ని సూచించే సామ్రాజ్య అరామీయ పదం. పరిపాలనా సందర్భంలో ‘పత్రం’ సహజంగా ఉండి, ‘ఉత్తరం’కంటే కొంత విస్తృతమైన అర్థాన్ని నిలుపుతుంది.
- source_word: דִּי
  choice: మీరు మాకు పంపిన
  rationale: సంబంధార్థక అవ్యయాన్ని తెలుగులో ప్రత్యేకంగా ‘అది’ అని పెట్టకుండా, ‘పంపిన పత్రం’ అనే సహజమైన సంబంధ కృదంత నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: שְׁלַחְתּוּן
  choice: మీరు ... పంపిన
  rationale: రెండవ పురుష బహువచన సంపూర్ణ క్రియ. సందర్భానుసారంగా పూర్తయిన గత చర్యను తెలుగు సంబంధ కృదంతంతో సహజంగా వ్యక్తం చేశాం.
- source_word: עֲלֶינָא
  choice: మాకు
  rationale: ఈ లేఖా వ్యవహార సందర్భంలో రాజసభకు పంపడాన్ని సూచిస్తుంది; ‘మాకు’ అనేది సహజమైన అర్థం. ‘మాకు వ్యతిరేకంగా’ అనే భావం ఇక్కడ తగదు.
- source_word: מְפָרַשׁ
  choice: స్పష్టంగా
  rationale: చదవడం స్పష్టంగా లేదా అర్థమయ్యే విధంగా జరిగిందనే భావాన్ని నిలుపుతుంది; అనువదించబడిందా, వివరించబడిందా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: קֱרִי
  choice: చదివి వినిపించబడింది
  rationale: సందర్భంలో పత్రం రాజు ఎదుట గళంగా చదవబడిన నిష్క్రియ భావం ఉంది. సాధారణ తెలుగు వాడుకలో ‘చదివి వినిపించబడింది’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קָדָמָי
  choice: నా సమక్షంలో
  rationale: రాజు ఎదుట, అతని సన్నిధిలో చర్య జరిగిందని తెలిపే రాజసభా ప్రయోగానికి ఇది సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పరిపాలనా శైలి వాడబడింది. ‘పత్రం’ అధికారిక సందర్భాన్ని నిలుపుతుంది; ‘నా సమక్షంలో’ రాజసభా భావాన్ని సహజంగా అందిస్తుంది.
