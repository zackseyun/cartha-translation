revisions:
- from: మీరు మాకు పంపిన పత్రం నా సమక్షంలో స్పష్టంగా చదివి వినిపించబడింది.[a]
  to: మీరు మాకు పంపిన పత్రం నా సమక్షంలో స్పష్టంగా చదవబడింది.[a]
  rationale: కֱרִי యొక్క నిష్క్రియ ‘చదవబడింది’ను ప్రధాన పాఠంలో ఉంచి, గళంగా చదివి వినిపించారనే సందర్భసంభవమైన కానీ అదనపు భావాన్ని తొలగించాం. నִשְׁתְּוָנָאకు సాధ్యమైన ‘ఉత్తరం’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
