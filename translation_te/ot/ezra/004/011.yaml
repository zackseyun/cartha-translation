    rationale: The source is a conventional and somewhat disputed epistolary formula, but its most immediate lexical sense is “and now.” “ఇప్పుడు—” retains that sense while the footnote responsibly records the alternative traditional interpretations.
  - severity: low
    issue: The self-designation is awkwardly ordered and uses non-honorific “నీ.”
    rationale: The present wording makes “మనుషులమైన” modify “సేవకులం” in a cumbersome way. “మీ సేవకులైన నది అవతలి ప్రాంతపు మనుషులు” is a natural appositional rendering. Telugu honorific second-person usage is appropriate in royal address.
  revised_text: 'వారు అర్తహషస్త రాజుకు పంపిన ఉత్తరపు నకలు ఇది: “మీ సేవకులైన నది అవతలి ప్రాంతపు మనుషులు[a], ఇప్పుడు[b]—”'
