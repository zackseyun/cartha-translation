translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన అధికారిక శైలిని వాడాం. రాజును ఉద్దేశించే ఆస్థాన సంభాషణలో ‘మీ’ కంటే ఏకవచన ‘నీ’ మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని, సేవకుల వినయపూర్వక స్వీయవర్ణనను నేరుగా ప్రతిబింబిస్తుంది. చివరి సూత్రం యొక్క అనిశ్చితిని పాఠ్యంలో అతిగా విప్పకుండా పాదసూచికలో వివరించాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో సూచికల స్థానాలు వివరణలతో సరిపోలకపోవడంతో, [a]ను ప్రాంతీయ పదబంధం వద్ద, [b]ను ముగింపు సూత్రం వద్ద ఉంచాం.
