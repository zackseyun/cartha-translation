  variant: modern standard Telugu
source:
  edition: WLC
  text: דְּנָה֙ פַּרְשֶׁ֣גֶן אִגַּרְתָּ֔/א דִּ֚י שְׁלַ֣חוּ עֲל֔וֹ/הִי עַל אַרְתַּחְשַׁ֖שְׂתְּא מַלְכָּ֑/א עַבְדָ֛י/ךְ אֱנָ֥שׁ עֲבַֽר נַהֲרָ֖/ה וּ/כְעֶֽנֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: te
  text: 'వారు అర్తహషస్త రాజుకు పంపిన ఉత్తరపు నకలు ఇది: “మీ సేవకులైన నది అవతలి ప్రాంతపు మనుషులు[a], ఇప్పుడు[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నది అవతల” అనేది యూఫ్రటీసు నదికి పడమరనున్న పారసీక పరిపాలనా ప్రాంతపు పేరు; దీనిని “యూఫ్రటీసు అవతలి ప్రాంతం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి అరామీయ పదబంధం ఉత్తరాల్లో వాడే అధికారిక సూత్రం. దీనిని సాంప్రదాయంగా “ఇలాంటి సమయంలో” అని, లేదా “ఇత్యాది” అనే భావంలో కూడా అర్థం చేసుకున్నారు. వాక్యం తరువాతి వచనంలో కొనసాగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: ఇది
  rationale: పత్రంలోని ఉల్లేఖనాన్ని పరిచయం చేసే అరామీయ సూచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: פַּרְשֶׁגֶן
  choice: నకలు
  rationale: అధికారిక పత్రం యొక్క ప్రతిని లేదా లిఖిత నకలును సూచిస్తుంది; ఆధునిక తెలుగులో ‘నకలు’ స్పష్టంగా ఉంటుంది.
- source_word: אִגַּרְתָּא
  choice: ఉత్తరం
  rationale: ఇది అధికారికంగా పంపిన లిఖిత సమాచారాన్ని సూచిస్తుంది; సందర్భానికి ‘ఉత్తరం’ సహజమైన పదం.
- source_word: דִּי
  choice: పంపిన
  rationale: తెలుగు సంబంధవాచక నిర్మాణంలో ప్రత్యేకంగా ‘అది/ఏదైతే’ అనకుండా క్రియావిశేషణ రూపంతో సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁלַחוּ
  choice: వారు ... పంపిన
  rationale: బహువచన కర్తతో పత్రాన్ని పంపడాన్ని సరళంగా, మూలానికి నిబద్ధంగా తెలియజేస్తుంది.
- source_word: עֲלוֹהִי / עַל
  choice: అర్తహషస్త రాజుకు
  rationale: ఈ పత్రవ్యవహార సందర్భంలో రాజును ఉత్తర గ్రహీతగా సూచిస్తున్నందున దిశార్థక ‘కు’ విభక్తి వాడబడింది; ‘విరోధంగా’ అనే భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: అర్తహషస్త
  rationale: రాజు పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: מַלְכָּא
  choice: రాజు
  rationale: వ్యక్తిపేరుతో కూడిన రాజబిరుదును సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: עַבְדָיךְ
  choice: నీ సేవకులం
  rationale: రాజును ఉద్దేశించి అధీనులు తమను తాము వినయంగా పేర్కొనే ఆస్థాన భాషను నిలుపుతుంది; ‘అధికారులం’ అనే వ్యాఖ్యానాత్మక అర్థాన్ని చేర్చదు.
- source_word: אֱנָשׁ
  choice: మనుషులమైన
  rationale: సమూహార్థంలో ఉన్న నామవాచకాన్ని ప్రతిబింబిస్తూ, తెలుగులో ‘నీ సేవకులం’తో సహజంగా అనుసంధానిస్తుంది.
- source_word: עֲבַר נַהֲרָה
  choice: నది అవతల ప్రాంతంలోని
  rationale: యూఫ్రటీసుకు పడమరనున్న పారసీక పరిపాలనా ప్రాంతానికి వాడిన అక్షరార్థ భౌగోళిక బిరుదును నిలుపుతుంది; పాఠ్యంలో నది పేరును అదనంగా చేర్చదు.
- source_word: וּכְעֶנֶת
  choice: ఇక—
  rationale: ఉత్తరపు అధికారిక ప్రారంభ సూత్రాన్ని సంక్షిప్తంగా ఉంచి, వాక్యం తరువాతి వచనంలో కొనసాగుతున్న అసంపూర్ణతను దీర్ఘవిరామంతో చూపిస్తుంది.
