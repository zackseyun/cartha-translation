reference: Ezra 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: te
  text: అప్పుడు వారు జెరుబ్బాబెలు దగ్గరికీ, పితృకుటుంబాల పెద్దల దగ్గరికీ వచ్చి, “మేమూ మీతో కలిసి కడదాం. ఎందుకంటే మీలాగే మేము కూడా మీ దేవుణ్ణి వెదకుతున్నాం; మమ్మల్ని ఇక్కడికి తీసుకువచ్చిన అష్షూరు రాజు ఏసర్హద్దోను రోజులనుంచి మేము ఆయనకు బలులు అర్పిస్తున్నాం[a]” అని వారితో అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ లిఖిత పాఠంలో, “మేము బలులు అర్పించడం లేదు” అని ఉంది. అయితే సంప్రదాయ పఠనం, “మేము ఆయనకు బలులు అర్పిస్తున్నాం” అని చదువుతుంది; సందర్భాన్ని బట్టి ప్రధాన వాక్యంలో ఈ పఠనాన్నే అనుసరించాం.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: దగ్గరికి వచ్చి
  rationale: నגשׁ అనే క్రియలోని సమీపించే కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ఎజ్రాలోని వంశ-కుటుంబ సామాజిక నిర్మాణాన్ని నిలుపుతూ, ‘తండ్రుల ఇళ్ల పెద్దలు’ కంటే ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: נִבְנֶה עִמָּכֶם
  choice: మేమూ మీతో కలిసి కట్టనివ్వండి
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక ప్రతిపాదనను తెలియజేస్తుంది; ‘సహాయం చేస్తాం’ అని మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: כִּי כָכֶם
  choice: ఎందుకంటే మీలాగే మేము కూడా
  rationale: సహకారానికి వారు చెప్పిన కారణాన్ని స్పష్టంగా, సహజంగా అనుసంధానిస్తుంది.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: మీ దేవుణ్ణి వెదకుతున్నాం
  rationale: דרשׁ క్రియలోని ‘వెదకడం, ఆశ్రయించడం, ఆరాధనార్థంగా అన్వేషించడం’ అనే విస్తృతిని ‘ఆరాధిస్తున్నాం’ అని ముందుగానే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: మేము ఆయనకు బలులు అర్పిస్తున్నాం[a]
  rationale: లిఖిత పాఠంలోని కఠినమైన לא (‘కాదు’)కు బదులు సందర్భానుకూలమైన సంప్రదాయ పఠనం לו (‘ఆయనకు’)ను ప్రధాన వాక్యంలో ప్రతిబింబించి, పాఠ్య సమస్యను పాదసూచికలో వెల్లడిస్తుంది.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: ఏసర్హద్దోను రోజులనుంచి
  rationale: గత కాలంలోని ఒక దశనుంచి ఇప్పటివరకు కొనసాగుతున్న కాలార్థాన్ని సహజంగా తెలుపుతుంది.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: మమ్మల్ని ఇక్కడికి తీసుకొచ్చిన
  rationale: హిఫీల్ కారణార్థాన్ని నిలుపుతుంది; తెలుగులో అనవసరంగా దిశార్థకమైన ‘పైకి’ని చేర్చకుండా సహజంగా ఉంటుంది.
theological_decisions:
- issue: స్థిరనివాసుల మతపరమైన వాదన
  choice: వారి మాటను ‘మీ దేవుణ్ణి వెదకుతున్నాం’, ‘ఆయనకు బలులు అర్పిస్తున్నాం’ అని తటస్థంగా నివేదించడం
  alternative: ‘మీ దేవుణ్ణి ఆరాధిస్తున్నాం’ లేదా వారి వాదన అసత్యమని వాక్యంలోనే సూచించడం
  rationale: వారి వాదన యొక్క నిజాయితీని లేదా ఆచారశుద్ధిని ఈ వాక్యం తేల్చదు. కథనంలోని ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక-వంశ సంబంధ పదజాలానికి తగిన గౌరవప్రదమైన శైలి. దేవుని సూచించే సర్వనామానికి గౌరవార్థక రూపం వాడబడింది.
