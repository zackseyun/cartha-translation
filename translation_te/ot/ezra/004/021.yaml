  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: te
  text: ఇప్పుడు, ఈ మనుషులను ఆపివేయడానికి ఆజ్ఞ జారీ చేయండి[a]. ఈ పట్టణం నా నుండి ఆజ్ఞ జారీ అయ్యే వరకు[b] తిరిగి కట్టబడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆజ్ఞను పెట్టండి’; లేదా, ‘ఉత్తర్వు ఇవ్వండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను ఆజ్ఞ జారీ చేసే వరకు.’ అక్షరార్థంగా, ‘నా నుండి ఆజ్ఞ పెట్టబడే వరకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: కాబట్టి ఇప్పుడు
  rationale: రాజు వెంటనే అమలు చేయాల్సిన ఆదేశాన్ని ప్రవేశపెట్టే అరామీయ అవ్యయం; సందర్భంలోని అన్వయాన్ని, తక్షణత్వాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: שִׂימוּ טְּעֵם
  choice: ఆజ్ఞ జారీ చేయండి
  rationale: అక్షరార్థంగా ‘ఆజ్ఞను నిలపండి/పెట్టండి’ అనే రాజపాలనా నుడికారం; ఆధునిక తెలుగు పరిపాలనా వాడుకలో ‘ఆజ్ఞ జారీ చేయండి’ సహజమైన సమానార్థకం.
- source_word: לְבַטָּלָא
  choice: ఆపివేయాలని
  rationale: పని నిలిచేలా చేయడం అనే కారక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ఈ మనుషులను
  rationale: మూలంలోని ‘ఈ పురుషులు/మనుషులు’ అనే నిర్దిష్ట సూచనను కాపాడుతుంది.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: ఈ పట్టణాన్ని తిరిగి కట్టకూడదు
  rationale: నిషేధాత్మక రాజాజ్ఞ భావాన్నీ, పునర్నిర్మాణాన్ని సూచించే సందర్భార్థాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: నా నుండి ఆజ్ఞ జారీ అయ్యే వరకు
  rationale: అక్షరార్థంలోని ‘నా నుండి ఆజ్ఞ పెట్టబడే వరకు’ అనే కర్మణి నిర్మాణాన్ని, ఆజ్ఞ రాజు నుండే రావాలనే భావాన్ని నిలుపుతుంది.
