  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజపాలనా శైలిని వాడాం. మూలంలోని ఆజ్ఞాపూర్వకత, కర్మణి నిర్మాణం, రాజు నుండి వచ్చే తదుపరి ఆజ్ఞ వరకు ఉండే నిషేధం కాపాడబడ్డాయి.
