source:
  edition: WLC
  text: כְּעַ֗ן יְדִ֨יעַ֙ לֶהֱוֵ֣א לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן מִנְדָּֽה בְל֤וֹ וַ/הֲלָךְ֙ לָ֣א יִנְתְּנ֔וּן וְ/אַפְּתֹ֥ם מַלְכִ֖ים תְּהַנְזִֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: te
  text: 'ఇప్పుడు రాజుకు ఈ విషయం తెలియజేయబడునుగాక: ఈ పట్టణం నిర్మించబడి, దాని ప్రాకారాల నిర్మాణం పూర్తయితే, వారు కప్పం, పన్ను, సుంకం చెల్లించరు; చివరికి అది రాజుల ఆదాయానికి నష్టం కలిగిస్తుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చివరికి అది రాజులకు నష్టం కలిగిస్తుంది.” అరామీయ పదబంధం సంక్షిప్తంగా ఉంది; నష్టం రాజుల ఆదాయానికి సంబంధించినదనే భావం, కప్పం, పన్ను, సుంకం చెల్లించకపోవడం అనే సందర్భం నుంచి గ్రహించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: ఇప్పుడు
  rationale: హెచ్చరికను లేదా ముగింపును పరిచయం చేసే అరామీయ సంభాషణా అవ్యయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: రాజు ఈ విషయం తెలుసుకోవాలి
  rationale: అధికారిక ఉత్తరంలోని ‘రాజుకు తెలియబడుగాక’ అనే భావాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: קִרְיְתָא דָךְ
  choice: ఈ పట్టణం
  rationale: రచయితల దృష్టిలో యెరూషలేమును సూచించే అరామీయ నిర్దేశక పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: תִּתְבְּנֵא
  choice: తిరిగి కట్టబడి
  rationale: షరతు సందర్భంలోని నిష్క్రియ క్రియను, ముందుగా ధ్వంసమైన పట్టణం పునర్నిర్మాణమనే సందర్భానుసార భావంతో వ్యక్తం చేస్తుంది.
- source_word: שׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: దాని ప్రాకారాలు పూర్తి చేయబడితే
  rationale: పట్టణ రక్షణ కట్టడాలను సూచించే బహువచన నామవాచకాన్నీ, వాటిని పూర్తి చేయడాన్ని సూచించే క్రియనూ స్పష్టంగా అందిస్తుంది.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: కప్పం, పన్ను, సుంకం
  rationale: పర్షియా పరిపాలనా సందర్భంలోని మూడు వేర్వేరు ఆర్థిక విధులను తెలుగులో వేరువేరు పదాలతో నిలుపుతుంది.
- source_word: לָא יִנְתְּנוּן
  choice: వారు ... చెల్లించరు
  rationale: అక్షరార్థమైన ‘ఇవ్వరు’కు బదులుగా పన్నుల సందర్భానికి తగిన ‘చెల్లించరు’ను వాడింది; బహువచన కర్తను అలాగే ఉంచింది.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: చివరికి అది రాజుల ఆదాయానికి నష్టం కలిగిస్తుంది
  rationale: చెల్లించని కప్పం, పన్ను, సుంకం అనే సందర్భంలో రాజులకు కలిగే ఆర్థిక నష్టాన్ని తెలియజేస్తూ, అరామీయ పదబంధంలోని సంక్షిప్తతను పాదసూచికలో గుర్తించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుకు పంపిన అధికారిక హెచ్చరికకు తగిన గంభీరతతో అనువదించబడింది. పన్నులకు సంబంధించిన మూడు పరిపాలనా పదాల మధ్య తేడాను ‘కప్పం, పన్ను, సుంకం’గా నిలుపుతూ, అతిగా పురాతనమైన వాక్య నిర్మాణాన్ని నివారించింది.
