source:
  edition: WLC
  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: te
  text: మేము రాజభవనపు ఉప్పు తింటున్నాము[a] గనుక, రాజుకు కలిగే అవమానాన్ని[b] చూడటం మాకు తగదు. అందుచేత ఈ విషయాన్ని రాజుకు పంపి తెలియజేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాజభవనపు ఉప్పు తినడం’ అంటే రాజు పోషణలో ఉండి, అతనికి సేవ చేయడం లేదా విధేయులుగా ఉండడం.
    reason: మూల భాషలోని రాజసేవకు సంబంధించిన నుడికారాన్ని నిలిపి, దాని భావాన్ని పాఠకునికి వివరిస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, ‘రాజు నగ్నతను’; ఇక్కడ రాజుకు కలిగే అవమానం, పరాభవం లేదా నష్టాన్ని సూచించే రూపకం.
    reason: అరామీయ పదంలోని అక్షరార్థాన్ని మరియు సందర్భానుసార రూపకార్థ పరిధిని రెండింటినీ సంరక్షిస్తుంది.
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: మేము రాజభవనపు ఉప్పు తింటున్నాము
  rationale: మూలంలోని ‘రాజభవనపు ఉప్పు తినడం’ అనే రూపకాన్ని నిలుపుతూ, రాజసేవ వల్ల కలిగిన విధేయత లేదా ఋణబద్ధత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶרְוַת מַלְכָּא
  choice: రాజుకు జరిగే అవమానం
  rationale: עֶרְוָה అక్షరార్థంగా ‘నగ్నత’ అయినప్పటికీ, ఇక్కడ రాజుకు కలిగే పరాభవం లేదా నష్టం అనే రూపకాలంకార భావం సందర్భానికి తగినది; ‘అవమానం’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: మేము ఈ సమాచారం రాజుకు పంపుతున్నాము
  rationale: అక్షరార్థంగా ‘మేము పంపి రాజుకు తెలియజేశాము’; అయితే ఇది లేఖలో ప్రస్తుతం చేస్తున్న సమాచార నివేదనను సూచిస్తుంది. సహజ తెలుగు లేఖాశైలిలో ‘ఈ సమాచారం ... పంపుతున్నాము’ అని ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన అధికారిక లేఖాశైలి వాడబడింది. మూలంలోని ఉప్పు రూపకం అలాగే ఉంచబడింది; అస్పష్టమైన ‘నగ్నత’ రూపకాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘అవమానం’గా ఇచ్చి పాదటిప్పణిలో అక్షరార్థం తెలిపబడింది. వాక్యారంభంలోని כְּעַן‌ను ప్రత్యేక కాలసూచక ‘ఇప్పుడు’గా కాక, సందర్భాన్ని కలిపే సంధానార్థక ప్రవేశంగా గ్రహించి తెలుగులో విడిగా అనువదించలేదు.
