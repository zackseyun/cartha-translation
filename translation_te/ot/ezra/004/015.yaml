  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుకు పంపిన అధికారిక ఫిర్యాదు పత్రానికి తగిన గౌరవప్రదమైన పరిపాలనా శైలిని ఉపయోగించాం. మూలంలోని పునరుక్తి, ఆరోపణల క్రమం, కర్మణి ముగింపును సాధ్యమైనంతవరకు నిలిపాం.
