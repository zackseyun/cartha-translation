  to: 'మీ పూర్వీకుల[a] దస్తావేజుల గ్రంథాన్ని పరిశీలించనివ్వండి. అప్పుడు ఆ దస్తావేజుల గ్రంథంలో మీరు కనుగొని తెలుసుకోగలరు: ఈ నగరం తిరుగుబాటుదనమున్న నగరమని, రాజులకు, ప్రాంతాలకు హాని కలిగించేదని, పురాతన కాలం నుంచే దానిలో విద్రోహం ప్రేరేపించబడిందని[b]. ఈ కారణంగానే ఈ నగరం పాడుచేయబడింది.'
