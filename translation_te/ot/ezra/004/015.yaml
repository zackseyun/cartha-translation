source:
  edition: WLC
  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: te
  text: 'మీ పూర్వీకుల[a] దస్తావేజుల గ్రంథాన్ని పరిశీలించనివ్వండి. అప్పుడు ఆ దస్తావేజుల గ్రంథంలో మీరు కనుగొని తెలుసుకోగలరు: ఈ నగరం తిరుగుబాటుదనమున్న నగరమని, రాజులకు, ప్రాంతాలకు హాని కలిగించేదని, పురాతన కాలం నుంచే దానిలో విద్రోహం ప్రేరేపించబడిందని[b]. ఈ కారణంగానే ఈ నగరం పాడుచేయబడింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “మీ తండ్రులు”; సందర్భంలో ఇది మీ పూర్వీకులను లేదా మీకు ముందున్న పాలకులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “విద్రోహం ప్రేరేపించబడింది” అని అనువదించిన అరమేయ పదబంధం, నగరంలో తిరుగుబాటు లేదా విద్రోహం ప్రేరేపించబడిందనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: పరిశీలించమని ఆజ్ఞాపించండి
  rationale: ఈ పరిపాలనా పత్రంలోని వినయపూర్వక అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; అరమేయ భాషలోని కర్తను స్పష్టంగా పేర్కొనని భావాన్ని కార్యనిర్వాహక ఆజ్ఞగా అందిస్తుంది.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: జ్ఞాపక గ్రంథం
  rationale: అధికారికంగా భద్రపరచిన గత సంఘటనల లిఖిత నమోదును సూచించే మూలపదబంధంలోని 'జ్ఞాపకము/నమోదు' మరియు 'గ్రంథము' అనే రూపకాలను నిలుపుతుంది.
- source_word: אֲבָהָתָךְ
  choice: మీ పూర్వీకులు
  rationale: అక్షరార్థంగా 'మీ తండ్రులు'; సందర్భంలో రాజుకు ముందున్న పాలకులు లేదా రాజవంశ పూర్వీకులను సూచిస్తుంది. తెలుగు పాఠకునికి అపార్థం కాకుండా విస్తృత సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం.
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: మీరు కనుగొని తెలుసుకునేది
  rationale: పరిశీలన ఫలితంగా నమోదు దొరకడం, దాని ద్వారా విషయం నిర్ధారించుకోవడం అనే వరుస భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קִרְיָא מָרָדָא
  choice: తిరుగుబాటు చేసే నగరం
  rationale: సామ్రాజ్య అధికారానికి లోబడని నగరమనే ఆరోపణను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: రాజులకు, ప్రాంతాలకు హాని కలిగించేది
  rationale: క్రియాత్మక భాగరూపంలోని నిరంతర హానికర స్వభావాన్ని, పాలకులు మరియు వారి పరిపాలనా ప్రాంతాలు అనే రెండు అంశాలను నిలుపుతుంది.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: రాజద్రోహం జరుగుతూ వచ్చింది
  rationale: కఠినమైన అరమేయ పదబంధం నగరంలో రాజ్యాధికారానికి వ్యతిరేకమైన విద్రోహ కార్యకలాపాలు సాగాయని సూచిస్తుంది. 'రాజద్రోహం' పరిపాలనా సందర్భానికి సరిపోతూ, పదబంధంలోని విస్తృత తిరుగుబాటు భావాన్ని తెలియజేస్తుంది.
- source_word: מִן יוֹמָת עָלְמָא
  choice: పురాతన కాలం నుంచి
  rationale: ఇది తాత్త్విక నిత్యత్వాన్ని కాక సుదీర్ఘమైన గతకాలాన్ని సూచించే నానుడి.
- source_word: הָחָרְבַת
  choice: నాశనం చేయబడింది
  rationale: నగరం పాడుచేయబడినదనే కర్మణి భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
