  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: te
  text: 'అయితే జెరుబ్బాబెలు, యెషూవా, ఇశ్రాయేలు పితృకుటుంబాల మిగతా పెద్దలు వారితో ఇలా అన్నారు: “మా దేవునికి మందిరం[b] కట్టడంలో మాతో మీకు భాగం లేదు. మేమే కలిసి[a] ఇశ్రాయేలు దేవుడైన యెహోవా కోసం దాన్ని కడతాం; రాజైన కోరెషు, పర్షియా రాజు, మాకు ఆజ్ఞాపించినట్లే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మేము కలిసి కడతాం.” ఇక్కడ సందర్భాన్ని బట్టి, సహాయం అందించడానికి వచ్చిన వారిని చేర్చుకోకుండా ఈ ఇశ్రాయేలీయుల సమూహమే కడుతుందని భావం.
    reason: lexical_alternative
  - marker: b
    text: “మందిరం” అనే చోట హీబ్రూలో అక్షరార్థంగా “ఇల్లు” అని ఉంది; ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: జెరుబ్బాబెలు, యేషూవ
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగులో సహజంగా లిప్యంతరీకరించాం; יֵשׁוּעַ యొక్క ఇక్కడి రూపాన్ని ‘యేషూవ’గా నిలిపాం.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు పితృకుటుంబాల మిగతా పెద్దలు
  rationale: ఇది కుటుంబ లేదా వంశ సమూహాల నాయకులను సూచిస్తుంది; ‘పితృకుటుంబాలు’ హీబ్రూ సామాజిక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: మాతో మీకు భాగం లేదు
  rationale: కలిసి చేసే పనిలో వారికి హక్కు లేదా పాలుపంచుకోవడం లేదనే హీబ్రూ ప్రయోగంలోని నిరాకరణ బలాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: בַּיִת לֵאלֹהֵינוּ
  choice: మా దేవునికి మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున సాధారణ తెలుగు పాఠకునికి స్పష్టమైన ‘మందిరం’ను ప్రధాన పాఠ్యంలో వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: మేమే కలిసి దాన్ని కడతాం
  rationale: יַחַד యొక్క అక్షరార్థమైన ‘కలిసి’ను నిలిపి, విరుద్ధ సందర్భంలోని స్వీయ-పరిమితిని ‘మేమే’ ద్వారా వ్యక్తం చేశాం; ఇలా అసలు పదంలోని భావసూక్ష్మతను పూర్తిగా ‘మేము మాత్రమే’గా మార్చకుండా కాపాడాం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: పర్షియా రాజైన కోరెషు రాజు
  rationale: హీబ్రూలోని ‘రాజు’ పునరుక్తిని నిలుపుతూ, తెలుగులో అర్థమయ్యే అన్వయంతో రాజబిరుదును అందించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠ్యంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: יַחַדలోని ‘కలిసి’ మరియు సందర్భంలోని ప్రత్యేకత
  choice: మేమే కలిసి
  alternative: మేము మాత్రమే
  rationale: సందర్భం బయటివారిని మినహాయిస్తున్నప్పటికీ, మూలపదం అక్షరార్థంగా ‘కలిసి’ అని చెబుతుంది. ‘మేమే కలిసి’ రెండు అంశాలనూ నిలిపి అనవసరంగా భావాన్ని ఒకే దిశలో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘పితృకుటుంబాలు’ వంటి పదంతో ప్రాచీన సామాజిక నిర్మాణాన్ని నిలిపి, వాక్యాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా తీర్చిదిద్దాం. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
