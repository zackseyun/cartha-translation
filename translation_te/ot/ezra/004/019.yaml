  register: ఆధునిక ప్రామాణిక తెలుగు; రాజపత్రానికి తగిన గంభీరమైన పరిపాలనా శైలి. మూలంలోని రాజకీయ పదాల పునరుక్తి వంటి అర్థసామీప్యాన్ని పూర్తిగా తొలగించకుండా, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది.
