base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: te
  text: “నేను ఒక ఆజ్ఞ జారీ చేశాను. వారు వెదికి, ఈ నగరం పూర్వకాలం నుంచే రాజులకు వ్యతిరేకంగా తలెత్తుతూ వచ్చిందని[a], దానిలో తిరుగుబాటు, విద్రోహం[b] జరుగుతూ వచ్చాయని కనుగొన్నారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజులపై తనను తాను హెచ్చించుకుంటూ వచ్చిందని.” అరామీయ క్రియలో స్వీయోన్నతి భావం ఉండవచ్చు; ఈ రాజకీయ సందర్భంలో అది రాజులకు వ్యతిరేకంగా తలెత్తడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తిరుగుబాటు, విప్లవం.” ఈ రెండు అరామీయ పదాల అర్థక్షేత్రాలు కొంతవరకు ఒకదానితో ఒకటి కలుస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: నా ద్వారా ఒక ఆజ్ఞ జారీ చేయబడింది
  rationale: ‘ఆజ్ఞను ఉంచడం’ అనే అరామీయ పరిపాలనా నుడికారాన్ని సహజమైన అధికారిక తెలుగులో వ్యక్తపరుస్తూ, ఆ ఆజ్ఞ రాజునుంచి వచ్చిందనే భావాన్ని నిలుపుతుంది.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: వారు దస్తావేజులను వెదికి ... కనుగొన్నారు
  rationale: ఇది అధికారిక పాత రికార్డుల పరిశోధన. తెలుగులో సందర్భం స్పష్టంగా ఉండేందుకు అంతర్భావంగా ఉన్న దస్తావేజులను పేర్కొనడం సహజం.
- source_word: קִרְיְתָא דָךְ
  choice: ఈ నగరం
  rationale: రాజపత్రంలో చర్చలో ఉన్న నగరాన్ని సూచించే సామీప్య నిర్దేశకాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: מִן יוֹמָת עָלְמָא
  choice: పూర్వకాలం నుంచే
  rationale: సుదీర్ఘమైన గతాన్ని సూచించే అరామీయ నుడికారానికి సహజమైన, గంభీరమైన ఆధునిక తెలుగు సమానం.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: రాజులకు వ్యతిరేకంగా తలెత్తుతూ వచ్చిందని
  rationale: క్రియలోని ‘తనను తాను హెచ్చించుకోవడం’ మరియు రాజకీయంగా ఎదిరించడం అనే రెండు ఛాయలను పూర్తిగా ‘తిరుగుబాటు చేసింది’గా కుదించకుండా కాపాడుతుంది.
- source_word: וּמְרַד
  choice: తిరుగుబాటు
  rationale: రాజాధికారానికి వ్యతిరేకమైన రాజకీయ ప్రతిఘటనకు సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וְאֶשְׁתַּדּוּר
  choice: విద్రోహం
  rationale: ముందున్న ‘తిరుగుబాటు’తో అర్థపరంగా దగ్గరగా ఉన్నప్పటికీ, రాజ్యాన్ని కూలదోయే కల్లోలకర చర్య అనే ప్రత్యేక రాజకీయ ఛాయను నిలుపుతుంది.
- source_word: מִתְעֲבֶד בַּהּ
  choice: ఇందులో ... జరుగుతూ వచ్చాయని
  rationale: నగరంలో ఇటువంటి చర్యలు పదేపదే చోటుచేసుకున్నాయనే అపరోక్ష/కర్మణి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
