  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ వాక్యంలోని కొనసాగుతున్న చర్యను తెలుగులో ‘వారు అలా చేశారు’ అని స్పష్టం చేసి, కాలవ్యాప్తిని సహజంగా వ్యక్తపరిచింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
