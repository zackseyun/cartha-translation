source:
  edition: WLC
  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: te
  text: వారి పథకాన్ని[a] భగ్నం చేయడానికి వారికి వ్యతిరేకంగా సలహాదారులను వేతనం ఇచ్చి నియమించుకున్నారు. పారసీక రాజైన కోరెషు కాలమంతటా, పారసీక రాజైన దర్యావేషు పరిపాలన వరకు వారు ఇలా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి సలహాను భగ్నం చేయడానికి.’ హీబ్రూ עֲצָה అనే పదానికి ‘సలహా,’ ‘ఆలోచన,’ లేదా ‘పథకం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: కూలికి పెట్టుకున్నారు
  rationale: שׂכר రూపం సేవల కోసం పారితోషికం ఇచ్చి నియమించడాన్ని సూచిస్తుంది. అవినీతిగా లంచమిచ్చారని మూలంలో స్పష్టంగా లేనందున ‘లంచమిచ్చారు’ కంటే ఈ ఎంపిక సముచితం.
- source_word: עֲלֵיהֶם
  choice: వారికి వ్యతిరేకంగా
  rationale: వ్యతిరేకతను తెలిపే సందర్భం, వెంటనే వచ్చే భగ్నం చేయాలనే ఉద్దేశం దృష్ట్యా עַל ఇక్కడ ప్రతికూల భావాన్ని కలిగిస్తుంది.
- source_word: יוֹעֲצִים
  choice: సలహాదారులను
  rationale: יעץ మూలానికి చెందిన పదం సలహా ఇచ్చేవారిని సూచిస్తుంది; పరిపాలనా-రాజకీయ సందర్భంలో ‘సలహాదారులు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לְהָפֵר
  choice: భగ్నం చేయడానికి
  rationale: הפר అంటే విరగగొట్టడం, రద్దుచేయడం లేదా విఫలం చేయడం. ఆలోచనను అమలు కాకుండా అడ్డుకోవడం అనే భావాన్ని ‘భగ్నం చేయడం’ ఇక్కడ తెలియజేస్తుంది.
- source_word: עֲצָתָם
  choice: వారి ఆలోచనను
  rationale: עֵצָהకు సలహా, ఆలోచన, పథకం అనే అర్థాలు ఉన్నాయి. పునర్నిర్మాణ ప్రయత్న సందర్భంలో ‘ఆలోచన’ సహజంగా ఉండి, మూలంలోని అర్థ విస్తృతిని కొంత కాపాడుతుంది.
- source_word: כָּל יְמֵי
  choice: కాలమంతటిలోనూ
  rationale: ఈ కాలసూచక నుడికారం పేర్కొన్న వ్యక్తి పరిపాలించిన కాలమంతటినీ సూచిస్తుంది.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజైన కోరెషు
  rationale: వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించి, రాజ బిరుదును మరియు దేశనామాన్ని సహజ తెలుగు క్రమంలో అనువదించింది.
- source_word: וְעַד
  choice: వరకు
  rationale: కోరెషు కాలం నుండి దర్యావేషు పరిపాలన దాకా కొనసాగిన కాలపరిమితిని స్పష్టంగా సూచిస్తుంది.
- source_word: מַלְכוּת
  choice: పరిపాలన
  rationale: ఈ కాలసూచక నిర్మాణంలో מַלְכוּת రాజ్యం అనే భూభాగాన్ని కాక రాజు పాలించిన కాలాన్ని సూచిస్తుంది.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: పారసీక రాజైన దర్యావేషు
  rationale: పేరును తెలుగులో లిప్యంతరీకరించి, బిరుదును సహజంగా అనువదించింది.
