  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: te
  text: ఈ విషయంలో నిర్లక్ష్యం చేయకుండా జాగ్రత్తపడండి.[a] రాజులకు నష్టం కలిగించే ఈ హాని ఎందుకు మరింత పెరగాలి?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఈ విషయాన్ని అమలు చేయడంలో అలసత్వం చూపవద్దని హెచ్చరికగా తీసుకోండి.”'
    reason: lexical_alternative
  - marker: b
    text: అరామీయ మూలంలో “రాజులు” అని బహువచనం ఉంది. ఇది రాజవంశాన్ని లేదా సామ్రాజ్య పాలకుల ప్రయోజనాన్ని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: జాగ్రత్తగా ఉండండి
  rationale: విశేషణం మరియు సహాయక క్రియ కలిసి ఆజ్ఞార్థక హెచ్చరికను ఇస్తాయి; ఈ తెలుగు ప్రయోగం సహజంగా ఉండి అప్రమత్తత భావాన్ని నిలుపుతుంది.
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: ఈ పని చేయడంలో ఏమాత్రం నిర్లక్ష్యం వహించకుండా
  rationale: שָׁלוּ లోని నిర్లక్ష్యం లేదా అలక్ష్య భావాన్ని, לְמֶעְבַּד עַל דְּנָה సూచించే ఆదేశాన్ని అమలు చేయడం అనే సందర్భంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמָה יִשְׂגֵּא חֲבָלָא
  choice: హాని ఎందుకు పెరగాలి?
  rationale: మూలంలోని అలంకారిక ప్రశ్నను, ‘పెరుగు’ అనే క్రియతో కూడిన హాని భావాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לְהַנְזָקַת מַלְכִין
  choice: రాజులకు నష్టం కలిగేలా
  rationale: ల ఉపసర్గ సూచించే ప్రతికూల ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, అరామీయ మూలంలోని బహువచనమైన ‘రాజులు’ను నిలుపుతుంది.
