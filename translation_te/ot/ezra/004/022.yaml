translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాజ్ఞకు తగిన గంభీరమైన పరిపాలనా శైలిని ఉపయోగించాం. మూలంలోని హెచ్చరిక, అలంకారిక ప్రశ్న, ‘రాజులు’ అనే బహువచనం నిలుపబడ్డాయి.
