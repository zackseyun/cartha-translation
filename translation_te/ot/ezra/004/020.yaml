  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పొడవైన అరామిక్ సమన్వయ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం; పాలనా, పన్నుల పదజాలంలోని భేదాలను నిలిపాం.
