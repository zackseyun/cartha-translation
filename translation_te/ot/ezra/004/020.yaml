source:
  edition: WLC
  text: וּ/מַלְכִ֣ין תַּקִּיפִ֗ין הֲווֹ֙ עַל יְר֣וּשְׁלֶ֔ם וְ/שַׁ֨לִּיטִ֔ין בְּ/כֹ֖ל עֲבַ֣ר נַהֲרָ֑/ה וּ/מִדָּ֥ה בְל֛וֹ וַ/הֲלָ֖ךְ מִתְיְהֵ֥ב לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: te
  text: యెరూషలేమును పరిపాలించిన శక్తిమంతులైన రాజులు ఉండేవారు. వారు నది అవతల ఉన్న ప్రాంతమంతటిపై[a] అధికారం చెలాయించారు. కప్పం, పన్ను, సుంకం[b] వారికి చెల్లించబడేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నది అవతల అంతటిపై.” “నది అవతల” అనేది యూఫ్రటీసు నదికి పశ్చిమానున్న సామ్రాజ్య పాలనా భూభాగానికి అధికారిక పేరు.
    reason: cultural_note
  - marker: b
    text: “కప్పం, పన్ను, సుంకం” అనే మూడు పదాలు సామ్రాజ్య ఆదాయంలోని వేర్వేరు రకాలను సూచిస్తాయి. వీటిని “కప్పం, రుసుము, సుంకం” లేదా “కప్పం, పన్ను, సుంకపు రుసుము” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: శక్తిమంతులైన రాజులు
  rationale: బలమూ రాజకీయ అధికారమూ గల రాజులను సూచించే అరామిక్ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל יְרוּשְׁלֶם
  choice: యెరూషలేమును పరిపాలించిన
  rationale: ఇక్కడ עַל కేవలం స్థలాన్ని కాక యెరూషలేముపై అధికారాన్ని సూచిస్తుంది; తరువాతి పాలన భావంతో కలిపి తెలుగులో సహజంగా అనువదించబడింది.
- source_word: שַׁלִּיטִין
  choice: అధికారం చెలాయించారు
  rationale: ఆ ప్రాంతంపై ఆధిపత్యం లేదా పాలన నిర్వహించారనే భాగధాతు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: నది అవతల ఉన్న ప్రాంతమంతటిపై
  rationale: యూఫ్రటీసుకు పశ్చిమానున్న సామ్రాజ్య పాలనా భూభాగానికి వాడిన అధికారిక భౌగోళిక పదబంధాన్ని పాఠకులకు అర్థమయ్యేలా అందిస్తుంది; 'ప్రాంతం' భావస్పష్టత కోసం జోడించబడింది.
- source_word: מִדָּה בְלוֹ וַהֲלָךְ
  choice: కప్పం, పన్ను, సుంకం
  rationale: సామ్రాజ్య ఆదాయానికి చెందిన మూడు వేర్వేరు వర్గాలను తెలుగులో సంక్షిప్తంగా, భిన్న పదాలతో నిలుపుతుంది.
- source_word: מִתְיְהֵב לְהוֹן
  choice: వారికి చెల్లించబడేవి
  rationale: ఆ ఆదాయాలు రాజులకు ఇవ్వబడేవని తెలిపే అరామిక్ కర్మణి రూపాన్ని నిలుపుతుంది.
