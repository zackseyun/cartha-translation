translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. రాజపేరు, వ్యక్తిపేర్లు లిప్యంతరీకరించబడ్డాయి. మూలంలోని చివరి భాగపు నిజమైన భాషా సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి నిలుపుతున్నాయి.
