source:
  edition: WLC
  text: וּ/בִ/ימֵ֣י אַרְתַּחְשַׁ֗שְׂתָּא כָּתַ֨ב בִּשְׁלָ֜ם מִתְרְדָ֤ת טָֽבְאֵל֙ וּ/שְׁאָ֣ר כנות/ו עַל ארתחששתא מֶ֣לֶךְ פָּרָ֑ס וּ/כְתָב֙ הַֽ/נִּשְׁתְּוָ֔ן כָּת֥וּב אֲרָמִ֖ית וּ/מְתֻרְגָּ֥ם אֲרָמִֽית־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: te
  text: అర్తహషస్త కాలంలో బిష్లాము, మిత్రెదాతు, తాబెయేలు, మరియు అతని మిగతా సహచరులు[a] పారసీక రాజైన అర్తహషస్తకు వ్రాశారు. ఆ పత్రం అరామీయ లిపిలో వ్రాయబడి, అరామీయ భాషలో అనువదించబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మిగతా సహచరులు.’ ‘అతని’ అని అనువదించిన ప్రత్యయం మూలంలో ఏకవచన రూపంలో ఉన్నప్పటికీ, అది ఈ సమూహాన్ని సమష్టిగా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ పత్రం అరామీయంలో వ్రాయబడి, అరామీయం నుంచి అనువదించబడింది.’ మూలంలోని పదబంధం కఠినమైనది. ఇక్కడ లిపికీ భాషకీ మధ్య తేడా చూపించబడిందా, లేక వ్రాయడానికీ అనువదించడానికీ మధ్య తేడా చూపించబడిందా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు వేర్వేరుగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: పరిపాలన కాలంలో
  rationale: ‘దినాల్లో’ అనే మూలభాషా కాలసూచక నుడికారాన్ని రాజు పరిపాలించిన కాలమనే సహజమైన ఆధునిక తెలుగు భావంతో అందిస్తుంది.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: అర్తహషస్త
  rationale: రాజు పేరుకు తెలుగులో వాడుకలో ఉన్న లిప్యంతరీకరణ.
- source_word: כָּתַב
  choice: వ్రాశారు
  rationale: మూలంలోని సాధారణ ‘వ్రాయడం’ అనే అర్థాన్నే ఉంచి, ఈ వచనంలో స్పష్టంగా లేని ‘నిందారోపణ చేశారు’ వంటి భావాన్ని చేర్చలేదు.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: బిష్లాము, మిత్రెదాతు, తాబెయేలు
  rationale: వ్యక్తుల పేర్లను తెలుగు ధ్వనిరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וּשְׁאָר כנותו
  choice: అతని మిగతా సహచరులు
  rationale: שְׁאָר అనే ‘మిగిలినవారు’ భావాన్ని, కష్టమైన כנותו అనే పదంలోని ‘సహచరులు’ భావాన్ని, ఏకవచన ప్రత్యయాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది.
- source_word: עַל
  choice: కు
  rationale: పరిపాలనా పత్రవ్యవహార సందర్భంలో వ్రాత అందుకునే వ్యక్తిని సూచించే సహజమైన తెలుగు విభక్తి; ఈ వచనం మాత్రమే చెప్పనిది అయిన విరోధ భావాన్ని బలవంతంగా చేర్చదు.
- source_word: מֶלֶךְ פָּרָס
  choice: పారసీక రాజైన
  rationale: అర్తహషస్తను గుర్తించే రాజబిరుదును సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: ఆ ఉత్తరపు పాఠం
  rationale: כְתָב యొక్క ‘వ్రాత/పాఠం’ భావాన్నీ, నִּשְׁתְּוָן సూచించే లిఖిత పత్రం లేదా ఉత్తరం భావాన్నీ కలిపి స్పష్టంగా అందిస్తుంది.
- source_word: כָּתוּב אֲרָמִית
  choice: అరామీయ లిపిలో వ్రాయబడి
  rationale: మొదటి ‘అరామీయంగా’ అనే పదాన్ని లిపికి సంబంధించినదిగా అర్థం చేసుకునే ప్రాచీన, సందర్భోచిత పఠనాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది; భాషగా అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: וּמְתֻרְגָּם אֲרָמִית
  choice: అరామీయ భాషలో అనువదించబడింది
  rationale: మూలంలోని ‘అనువదించు/వివరించు’ క్రియను నిలుపుతూ రెండో ‘అరామీయంగా’ అనే పదాన్ని భాషగా చూపుతుంది; కష్టమైన నిర్మాణంలోని ఇతర అర్థసాధ్యతలను పాదసూచిక తెలియజేస్తుంది.
