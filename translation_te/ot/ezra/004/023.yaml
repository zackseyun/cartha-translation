translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పేర్లకు సాధారణ తెలుగు బైబిల్ రూపాలు తీసుకోబడ్డాయి; మూలంలోని కారణార్థక క్రియను, עַל లోని సందర్భసిద్ధమైన శత్రుత్వ భావాన్ని, బలప్రయోగాన్ని సూచించే జంట పదాలను నిలుపుతూ సహజ పఠనీయతకు ప్రాధాన్యం ఇచ్చాం.
