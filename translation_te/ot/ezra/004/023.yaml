  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: te
  text: అప్పుడు అర్తక్షస్త రాజు ఉత్తరపు ప్రతిని రెహూము, లేఖకుడైన షిమ్షయి, వారి సహచరుల ఎదుట చదివిన వెంటనే, వారు హుటాహుటిన యెరూషలేములోని యూదుల మీదికి[a] వెళ్లి వారిని బలప్రయోగంతో, శక్తితో[b] ఆపివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదుల దగ్గరకు’; అరామీయ పూర్వప్రత్యయం గమ్యాన్ని లేదా శత్రుత్వంతో ఒకరి మీదికి వెళ్లడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బాహుబలంతోనూ శక్తితోనూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: అప్పుడు
  rationale: తరువాతి సంఘటనను సూచించే అరామీయ కథన అవ్యయానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: ఉత్తరపు ప్రతి
  rationale: మొదటి పదం ప్రతి లేదా నకలును, రెండవది అధికారిక లిఖిత ఉత్తరాన్ని సూచిస్తాయి.
- source_word: קֱרִי קֳדָם
  choice: ఎదుట చదివిన
  rationale: అధికారుల సమక్షంలో పత్రం చదవబడిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: రెహూము, లేఖకుడైన షిమ్షయి, వారి సహచరులు
  rationale: పేర్లను లిప్యంతరీకరించి, סָפְרָא అనే పదవిని ‘లేఖకుడు’గా, సహోద్యోగులను ‘సహచరులు’గా ఇచ్చింది.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: హుటాహుటిన వెళ్లి
  rationale: వెళ్లడం మరియు అత్యవసరమైన వేగం అనే రెండు భావాలనూ సహజమైన సంక్షిప్త తెలుగులో నిలుపుతుంది.
- source_word: עַל יְהוּדָיֵא
  choice: యూదుల మీదికి
  rationale: עַל ఇక్కడ గమ్యాన్ని సూచించగలిగినా, వెంటనే వచ్చే బలవంతపు చర్య దాని శత్రుత్వ భావాన్ని బలపరుస్తుంది; ‘మీదికి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: వారిని ఆపించారు
  rationale: క్రియలోని కారణార్థక భావాన్ని నిలుపుతుంది; మూలంలో ‘పని’ అనే నామవాచకం స్పష్టంగా లేకపోవడంతో దాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: בְּאֶדְרָע וְחָיִל
  choice: బలప్రయోగంతోనూ శక్తితోనూ
  rationale: బలవంతంగా నిలిపివేసిన భావాన్ని స్పష్టంగా తెలుపుతూ, జంట పదాల నిర్మాణాన్ని కూడా సాధ్యమైనంతవరకు నిలుపుతుంది.
