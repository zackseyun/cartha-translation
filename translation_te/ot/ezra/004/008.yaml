  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పరిపాలనా బిరుదును అతిగా నిర్దిష్టీకరించకుండా ‘అధికారి’గా అనువదించి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
