source:
  edition: WLC
  text: רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א כְּתַ֛בוּ אִגְּרָ֥ה חֲדָ֖ה עַל יְרוּשְׁלֶ֑ם לְ/אַרְתַּחְשַׁ֥שְׂתְּא מַלְכָּ֖/א כְּנֵֽמָא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: te
  text: 'అధికారి[a] రెహూము, లేఖకుడు షిమ్షయి యెరూషలేముకు వ్యతిరేకంగా అర్తహషస్త రాజుకు ఒక ఉత్తరం ఇలా రాశారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన పరిపాలనాధికారి.’ అరామీయంలోని בְּעֵל טְעֵם ఒక అధికారిక బిరుదు; దానికి సమానమైన ఖచ్చితమైన పారసీక పరిపాలనా హోదా ఏమిటో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: అధికారి
  rationale: ఇది అరామీయ పరిపాలనా బిరుదు. దాని ఖచ్చితమైన పారసీక అధికార హోదా తెలియనందున, అధికార బాధ్యతను తెలియజేస్తూ అతిగా నిర్దిష్టం కాని సహజ తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: סָפְרָא
  choice: లేఖకుడు
  rationale: ఈ పదం లేఖన, కార్యదర్శి సంబంధిత అధికారిని సూచిస్తుంది. ‘లేఖకుడు’ మూలపద భావాన్ని నిలుపుతూ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כְּתַבוּ
  choice: రాశారు
  rationale: మూలంలోని సాధారణ భూతకాల క్రియను సహజమైన గౌరవ బహువచన తెలుగు రూపంలో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אִגְּרָה חֲדָה
  choice: ఒక ఉత్తరం
  rationale: ఇంపీరియల్ అరామీయంలో חֲדָה ‘ఒకటి’ అని లేదా అనిర్దిష్ట సూచకంగా పనిచేయవచ్చు. ‘ఒక ఉత్తరం’ ఈ రెండింటినీ సహజంగా ప్రతిబింబిస్తుంది; సంఖ్యను అనవసరంగా నొక్కిచెప్పదు.
- source_word: עַל יְרוּשְׁלֶם
  choice: యెరూషలేముకు వ్యతిరేకంగా
  rationale: చుట్టుపక్కల సందర్భంలో ఉత్తరం ఆరోపణాత్మకమైనది, ప్రతికూలమైనది. అందువల్ల తటస్థమైన ‘గురించి’ కంటే ‘వ్యతిరేకంగా’ సందర్భంలోని భావాన్ని మెరుగ్గా అందిస్తుంది.
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: అర్తహషస్త రాజుకు
  rationale: రాజబిరుదును, వ్యక్తి పేరును రెండింటినీ నిలుపుతూ సహజ తెలుగు పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: כְּנֵמָא
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే ఉత్తర విషయాన్ని పరిచయం చేసే సంభాషణ సూచకాన్ని సహజంగా వ్యక్తపరుస్తుంది; ముగింపు ద్విబిందువు ఆ పరిచయ కార్యాన్ని స్పష్టం చేస్తుంది.
- source_word: רְחוּם
  choice: రెహూము
  rationale: మూల వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: שִׁמְשַׁי
  choice: షిమ్షయి
  rationale: మూల వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: అర్తహషస్త
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రాజనామ రూపాన్ని ఉపయోగించాం.
