source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: te
  text: ఆ తరువాత ఇశ్రాయేలు కుమారులందరూ[a] దగ్గరికి వచ్చారు. సీనాయి కొండ మీద యాహ్వే మోషేతో చెప్పినదంతా మోషే వారికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు.’ ఇది ఇశ్రాయేలు ప్రజలను సూచించే జాతీయ ప్రయోగం; ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ముందటి సంఘటన అనంతరం జరిగిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִגְּשׁוּ
  choice: దగ్గరికి వచ్చారు
  rationale: నגשׁ నిఫాల్ రూపంలోని సమీపించడమనే స్పష్టమైన కదలికను కాపాడుతుంది; మోషే ముఖకాంతి కారణంగా వారు ముందుగా వెనుకంజ వేసిన కథా సందర్భానికీ సరిపోతుంది.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: హీబ్రూ జాతీయ సంజ్ఞను రూపపరంగా దగ్గరగా నిలుపుతుంది. ఇది ఇశ్రాయేలు ప్రజలను సూచించే స్థిర ప్రయోగమని పాదసూచిక వివరిస్తుంది.
- source_word: וַיְצַוֵּם
  choice: మోషే వారికి ఆజ్ఞాపించాడు
  rationale: צוה యొక్క ఆజ్ఞాపించే బలాన్ని నిలుపుతుంది. హీబ్రూలో కర్త సర్వనామరూపంలో అంతర్లీనంగా ఉన్నా, తెలుగులో సూచ్యపాత్ర స్పష్టత కోసం సందర్భానుసారం ‘మోషే’ అని పేర్కొనబడింది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: చెప్పినదంతా
  rationale: తదనంతర వాక్యంలోని సంపూర్ణ విషయాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: యాహ్వే తనతో చెప్పినదంతా
  rationale: אִתּוֹ లోని ‘అతనితో’ అనే సంభాషణాత్మక భావాన్ని ‘తనతో’గా కాపాడుతుంది; తెలుగు సందర్భంలో ముందుగా జరిగిన మాటను సహజంగానే సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: בְּהַר סִינָי
  choice: సీనాయి కొండ మీద
  rationale: కొండపై జరిగిన దైవసంభాషణ స్థలాన్ని తెలుగులో సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో మార్చకుండా, ‘Yahweh’కు దగ్గరైన రూపం నిలుపబడింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతీయ సంజ్ఞ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, అది జాతీయ సమూహాన్ని సూచించే స్థిర ప్రయోగమనే విషయాన్ని పాదసూచికలో స్పష్టం చేయబడింది.
- issue: వַיְצַוֵּם లో అంతర్లీన కర్త
  choice: మోషే
  alternative: అతడు / ఆయన
  rationale: హీబ్రూ క్రియలో కర్త ‘అతడు’గా అంతర్లీనంగా ఉంది; సందర్భం మోషేను స్పష్టంగా సూచిస్తుంది. తెలుగులో అయోమయం రాకుండా పేరును వాడటం భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని క్రమం, సమీపించడమనే కదలిక, ఆజ్ఞ యొక్క బలం, దైవనామం కాపాడబడ్డాయి; దీర్ఘమైన ఒకే వాక్యానికి బదులు పఠనసౌలభ్యం కోసం రెండు వాక్యాలు ఉపయోగించబడ్డాయి.
