source:
  edition: WLC
  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: te
  text: నేడు నేను నీకు ఆజ్ఞాపిస్తున్నదాన్ని పాటించు[a]. ఇదిగో, నేను నీ ఎదుటనుండి[b] అమోరీయులను, కనానీయులను, హిత్తీయులను, పెరిజ్జీయులను, హివ్వీయులను, యెబూసీయులను వెళ్లగొడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేడు నేను నీకు ఆజ్ఞాపిస్తున్నదాన్ని గమనించి ఆచరించు’; లేదా ‘దాని విషయంలో జాగ్రత్తగా ఉండు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీ ముఖం ఎదుటనుండి’; అంటే నీ ముందునుండి లేదా నీ సన్నిధిలోనుండి తొలగించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: పాటించు
  rationale: שׁמר అనే ఆజ్ఞారూపం కాపాడడం, గమనించడం, పాటించడం అనే భావాలను కలిగి ఉంది. ఇక్కడ ఆజ్ఞాపించిన విషయాన్ని విధేయతతో ఆచరించాలనే నిబంధన సందర్భానికి ‘పాటించు’ సహజంగా సరిపోతుంది; לְךָను అసహజంగా విడిగా అనువదించకుండా ఆ హెచ్చరికాత్మక బలాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: నేడు నేను నీకు ఆజ్ఞాపిస్తున్నదాన్ని
  rationale: హీబ్రూ సంబంధవాక్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ, מְצַוְּךָలోని కొనసాగుతున్న వర్తమాన భావాన్ని ‘ఆజ్ఞాపిస్తున్నదాన్ని’ ద్వారా తెలిపింది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దేవుడు చేయబోయే నిశ్చితమైన కార్యంపై శ్రద్ధను మళ్లించే హీబ్రూ ఉద్ఘాటనను ఆధునిక గౌరవప్రద తెలుగు పదమైన ‘ఇదిగో’ నిలుపుతుంది.
- source_word: גֹרֵשׁ
  choice: వెళ్లగొడుతున్నాను
  rationale: גרשకు వెళ్లగొట్టు లేదా బహిష్కరించు అనే భావం ఉంది. הִנְנִי తరువాతి కృదంతం సూచించే సజీవమైన, సమీప లేదా నిశ్చిత కార్యభావాన్ని వర్తమాన కొనసాగింపు రూపం నిలుపుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: ముఖం లేదా సన్నిధి ఎదుటనుండి తొలగించడం అనే హీబ్రూ రూపకాన్ని సాధ్యమైనంత ప్రత్యక్షంగా, అయినా సహజమైన తెలుగులో తెలిపింది.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: అమోరీయులను, కనానీయులను, హిత్తీయులను, పెరిజ్జీయులను, హివ్వీయులను, యెబూసీయులను
  rationale: హీబ్రూలో ఏకవచన సమూహనామాలుగా ఉన్న ఆరు జనసమూహాలను తెలుగులో సహజమైన బహువచన కర్మరూపాల్లో ఇచ్చాం.
theological_decisions:
- issue: నిబంధన సందర్భంలో שׁמר ఆజ్ఞ యొక్క భావం
  choice: ఆజ్ఞాపించినదాన్ని ‘పాటించు’ అని అనువదించడం
  alternative: ‘ఆజ్ఞాపిస్తున్నదాని విషయంలో జాగ్రత్తగా ఉండు’ లేదా ‘దాన్ని కాపాడుకో’
  rationale: ఈ వాక్యం నిబంధన బాధ్యతలను పరిచయం చేస్తుంది. మూలపదంలో కాపాడటం, జాగ్రత్త వహించడం, ఆచరించడం అనే భావ విస్తృతి ఉన్నప్పటికీ, ‘పాటించు’ సందర్భోచిత ప్రధాన భావాన్ని ఇస్తుంది; ‘చేయడానికి జాగ్రత్తపడు’ వంటి మూలంలో స్పష్టంగా లేని విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: దైవ కార్యాన్ని సూచించే הִנְנִי + కృదంతం యొక్క కాలభావం
  choice: ‘ఇదిగో, ... వెళ్లగొడుతున్నాను’
  alternative: ‘ఇదిగో, ... వెళ్లగొడతాను’
  rationale: ఈ నిర్మాణం సమీపంలో జరగబోయే లేదా నిశ్చయంగా జరిగే దైవ కార్యాన్ని సజీవంగా చూపగలదు. వర్తమాన కొనసాగింపు రూపం ఆ ఉద్ఘాటనను నిలుపుతూ, కేవలం భవిష్యత్తుగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇదిగో’ శాస్త్రోచిత గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యే పదం. జనసమూహాల పేర్లు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణలకు అనుగుణంగా ఇవ్వబడ్డాయి.
