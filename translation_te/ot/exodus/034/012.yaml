source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: te
  text: నీవు ప్రవేశించబోతున్న ఆ దేశ నివాసులతో నిబంధన చేసుకోకుండా జాగ్రత్తపడు[a]; లేకపోతే అది నీ మధ్య ఉచ్చుగా మారుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను నీవు కాపాడుకో’ లేదా ‘అప్రమత్తంగా ఉండు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఉచ్చు’ అనే పదాన్ని ‘పాశం’ లేదా ‘వల’ అని కూడా అనువదించవచ్చు. ‘అది’ అనే సూచన ప్రధానంగా నిబంధనను సూచించినట్లు కనిపిస్తుంది; సందర్భానుసారంగా దేశ నివాసులను లేదా ఏర్పడే పరిస్థితిని కూడా సూచించవచ్చని అర్థం చేసుకోవచ్చు.
    reason: ambiguity
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్తపడు
  rationale: నిఫాల్ ఆజ్ఞార్థక రూపం మరియు לְךָ కలిపి వ్యక్తిగత అప్రమత్తతను సూచిస్తాయి. ఆధునిక తెలుగులో ‘జాగ్రత్తపడు’ సహజంగా ఆ హెచ్చరిక బలాన్ని తెలియజేస్తుంది.
- source_word: פֶּן ... פֶּן
  choice: చేసుకోకుండా ... లేకపోతే
  rationale: రెండుసార్లు వచ్చిన פֶּן ప్రతికూల హెచ్చరికను, దాని ప్రమాదకర ఫలితాన్ని వరుసగా సూచిస్తుంది. తెలుగులో ఒకే పదాన్ని కృత్రిమంగా పునరావృతం చేయకుండా ఈ నిర్మాణం భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תִּכְרֹת בְּרִית
  choice: నిబంధన చేసుకో
  rationale: అక్షరార్థంగా ‘నిబంధన కోయు’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం ‘నిబంధన చేసుకో.’
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: దేశ నివాసులతో
  rationale: ఏకవచన కృదంతం సమూహార్థంలో ఉంది; అందువల్ల బహువచనమైన ‘నివాసులతో’ మూల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: నీవు ప్రవేశించబోతున్న
  rationale: בוא + על ఇక్కడ ఇశ్రాయేలు ఆ దేశంలోకి వెళ్లడాన్ని సూచిస్తుంది. ‘ప్రవేశించబోతున్న’ గమనం మరియు సమీప భవిష్యత్తు రెండింటినీ స్పష్టపరుస్తుంది.
- source_word: לְמוֹקֵשׁ
  choice: ఉచ్చుగా
  rationale: מוֹקֵשׁ భౌతిక ఉచ్చు లేదా రూపకాలంకారంగా చిక్కును సూచిస్తుంది. ‘ఉచ్చు’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: בְּקִרְבֶּךָ
  choice: నీ మధ్య
  rationale: ఈ పదబంధం సమాజం మధ్యలో ఉన్న ప్రమాదాన్ని సూచిస్తుంది; ‘నీ మధ్య’ సామూహిక సందర్భాన్ని నిలుపుతూ మూలానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: చివరి ఏకవచన క్రియకు కర్త ఏమిటి?
  choice: నిబంధనే ఉచ్చుగా మారుతుంది
  alternative: దేశ నివాసులు లేదా మొత్తం పరిస్థితి ఉచ్చుగా మారుతుంది
  rationale: సమీపంలోని వ్యాకరణపరమైన పూర్వపదం ‘నిబంధన’; అందువల్ల దానినే స్పష్టంగా పునరుక్తి చేశాం. అయితే మూలంలోని ఏకవచన నిర్మాణం కొంత సూచనాత్మకంగా ఉండటంతో ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘నిబంధన,’ ‘ఉచ్చు’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా మార్చాం.
