source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే అతని ఎదుటగా వెళ్లి ఇలా ప్రకటించాడు: “యాహ్వే, యాహ్వే—కనికరముగల, కృపగల దేవుడు; కోపించడంలో నిదానమైనవాడు; స్థిరమైన ప్రేమలోను విశ్వసనీయతలోను[a] సమృద్ధిగా ఉన్నవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్థిరమైన ప్రేమలోను సత్యంలోను.”
    reason: אֱמֶת అనే పదానికి ఈ సందర్భంలో ‘విశ్వసనీయత’తో పాటు ‘సత్యం’ అనే అర్థమూ సాధ్యమవుతుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం; మూలంలోని రెండుసార్ల పునరుక్తిని నిలిపాం.
- source_word: וַיַּעֲבֹר ... עַל־פָּנָיו
  choice: అతని ఎదుటగా వెళ్లి
  rationale: עבר అనే గమన క్రియను, עַל־פָּנָיו సూచించే మోషే ఎదుట/ముందుగా వెళ్లే స్థల సంబంధంతో కలిపి సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא
  choice: ఇలా ప్రకటించాడు
  rationale: ఈ సందర్భంలో קרא గంభీరమైన దైవ స్వప్రకటనను సూచిస్తుంది; ‘పిలిచాడు’ కంటే ‘ప్రకటించాడు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: పునరుక్త దైవ నామం తరువాత ఇది సమానాధికార వర్ణనగా వచ్చి, తరువాతి లక్షణాలను పరిచయం చేస్తుంది.
- source_word: רַחוּם
  choice: కనికరము గల
  rationale: లోతైన జాలి, దయ అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: חַנּוּן
  choice: కృప గల
  rationale: అనుగ్రహం చూపే స్వభావాన్ని సూచించే חנוןకు సంక్షిప్తమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: אֶרֶךְ אַפַּיִם
  choice: కోపించడానికి ఆలస్యపడేవాడు
  rationale: అక్షరార్థంగా ‘ముక్కులు పొడవైనవాడు’ అనే హెబ్రీయ నుడికారానికి భావసమానమైన, సులభంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: רַב
  choice: సమృద్ధిగా ఉన్నవాడు
  rationale: తరువాత వచ్చే అమూర్త గుణాలు విస్తారంగా ఉన్నాయనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֶסֶד
  choice: స్థిరమైన ప్రేమ
  rationale: חסדలోని ప్రేమ, దయ, నిలకడైన నిబద్ధత అనే సమృద్ధ భావాల్లో ప్రేమతో కూడిన స్థిరత్వాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֱמֶת
  choice: నమ్మకత్వం
  rationale: חסדతో జతగా వచ్చినప్పుడు దేవుని విశ్వసనీయమైన, ఆధారపడదగిన స్వభావాన్ని సూచిస్తుంది; ‘సత్యం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటీకలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం రెండుసార్లు రావడం
  choice: యాహ్వే, యాహ్వే
  alternative: ప్రభువు దేవుడు
  rationale: మూల హెబ్రీ పాఠంలోని దైవ నామ పునరుక్తిని యథాతథంగా నిలిపి, తరువాతి אֵלను నామపదబంధంలో కలిపివేయకుండా వర్ణనాత్మకంగా ఉంచాం.
- issue: חֶסֶד וֶאֱמֶתలో אֱמֶת భావం
  choice: నమ్మకత్వం
  alternative: సత్యం
  rationale: ఈ జంటలో దేవుని ఆధారపడదగిన స్థిర స్వభావం ప్రధానంగా కనిపిస్తుంది. అయినా אֱמֶתకు ‘సత్యం’ అనే ప్రత్యక్ష, సంప్రదాయార్థం కూడా సాధ్యమే కాబట్టి పాదటీకలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవ స్వప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. హెబ్రీ వాక్యంలోని లక్షణాల వరుసను అర్ధవిరామాలతో స్పష్టపరిచాం; నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటీకలో నిలిపాం.
