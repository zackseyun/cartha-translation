  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: te
  text: ఆ దేశ నివాసులతో ఒడంబడిక చేసుకోకు; లేకపోతే వారు తమ దేవుళ్లను వెంబడిస్తూ వ్యభిచరిస్తారు[a], తమ దేవుళ్లకు బలులు అర్పిస్తారు. వారిలో ఒకడు నిన్ను ఆహ్వానిస్తాడు[b], నీవు అతని బలి అర్పణలోనిది తింటావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో విగ్రహారాధనను లైంగిక అవిశ్వాసపు రూపకంతో వర్ణిస్తుంది; అక్షరార్థానికి దగ్గరగా, ‘తమ దేవుళ్లను వెంబడిస్తూ వేశ్యాచారం చేస్తారు’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు నిన్ను పిలుస్తాడు’; ఇక్కడ ఏకవచనం వారిలో ఎవరో ఒకరిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, అతడు అర్పించిన బలికి సంబంధించిన ఆహారంలో కొంత తింటావు.
    reason: lexical_clarification
lexical_decisions:
- source_word: פֶּן
  choice: చేసుకోకు; లేకపోతే
  rationale: ఇది సంభవించగల ప్రమాదాన్ని హెచ్చరించే పదం. ముందున్న సందర్భంపై ఆధారపడే ‘చేయకుండునట్లు’ అనే నిర్మాణాన్ని ఒంటరి వచనంలో సహజమైన తెలుగు హెచ్చరికగా వ్యక్తం చేస్తుంది.
- source_word: תִּכְרֹת בְּרִית
  choice: ఒడంబడిక చేసుకోకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఒడంబడిక కోయు’ అనే నుడికారం ఉంది. తెలుగులో ‘ఒడంబడిక చేసుకో’ దాని స్థిరమైన, సహజమైన సమానార్థకం.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: ఆ దేశ నివాసులతో
  rationale: సామూహిక ఏకవచన భావాన్ని తెలుగులో సహజమైన బహువచనంగా వ్యక్తం చేస్తూ, నిర్దిష్టమైన ‘ఆ దేశం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: వారు తమ దేవుళ్ల వెంట వ్యభిచారులుగా పోయి
  rationale: זנה విగ్రహారాధనను లైంగిక అవిశ్వాసపు రూపకంతో వర్ణిస్తుంది. ఆ ఉద్దేశపూర్వకంగా తీవ్రమైన రూపకాన్ని కేవలం ‘వెంట వెళ్లి’ అని మృదువుచేయకుండా నిలుపుతుంది.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: తమ దేవుళ్లకు బలులు అర్పిస్తారు
  rationale: క్రియలోని బలియర్పణ ఆరాధన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְקָרָא לְךָ
  choice: వారిలో ఒకడు నిన్ను ఆహ్వానిస్తాడు
  rationale: బహువచన కర్తల తర్వాత వచ్చే హీబ్రూ ఏకవచనం ఇక్కడ పంపిణీ భావంలో, వారిలో ఎవరో ఒకరిని సూచిస్తుంది. ‘ఆహ్వానిస్తాడు’ భోజన సందర్భంలో קרא ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: నీవు అతని బలిలోనిది తింటావు
  rationale: బలిగా అర్పించిన దానిలోనుంచి తినడాన్ని సూచించే מן భావాన్ని నిలుపుతూ, ‘బలి విందు’ అని మరింత వ్యాఖ్యానాత్మకంగా మార్చదు.
theological_decisions:
- issue: విగ్రహారాధనకు లైంగిక అవిశ్వాసపు రూపకం
  choice: ‘వ్యభిచారులుగా పోయి’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘తమ దేవుళ్ల వెంట వెళ్లి’ లేదా ‘విగ్రహారాధన చేసి’
  rationale: హీబ్రూ పాఠ్యం విగ్రహారాధనను ఒడంబడిక అవిశ్వాసంగా చూపేందుకు ఉద్దేశపూర్వకంగా తీవ్రమైన లైంగిక రూపకాన్ని వాడుతుంది; దాన్ని తొలగించడం మూలపాఠ్యపు సాహిత్య, వేదాంత బలాన్ని తగ్గిస్తుంది.
- issue: బహువచన పూర్వపదం తర్వాత ఏకవచన ఆహ్వానకర్త
  choice: ‘వారిలో ఒకడు’ అని పంపిణీ భావంతో అనువదించడం
  alternative: ‘అతడు నిన్ను పిలుస్తాడు’ లేదా ‘వారు నిన్ను ఆహ్వానిస్తారు’
  rationale: హీబ్రూ ఏకవచనాన్ని నిలుపుతూనే అది దేశ నివాసుల్లో ఎవరో ఒకరిని సూచిస్తుందనే సందర్భార్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ఒడంబడిక,’ ‘బలులు అర్పించడం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అరుదైన లేదా ప్రాచీన నుడికారాలను నివారించాం. మూలంలోని వ్యభిచార రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని స్వభావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
