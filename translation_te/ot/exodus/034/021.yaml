  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: te
  text: ఆరు రోజులు నీవు పని చేయాలి. అయితే ఏడవ రోజున పని మానాలి; దున్నే కాలంలోనూ కోతకాలంలోనూ పని మానాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విరమించాలి’ లేదా ‘విశ్రాంతి తీసుకోవాలి.’ హెబ్రీ క్రియకు ప్రధానంగా ‘ఆపడం, విరమించడం’ అనే అర్థం ఉంది; విస్తృతార్థంగా ‘విశ్రాంతి తీసుకోవడం’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: కాలవ్యవధిని సూచించే హెబ్రీ నిర్మాణాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תַּעֲבֹד
  choice: నీవు పని చేయాలి
  rationale: ద్వితీయ పురుష ఏకవచనంలోని ఒడంబడిక ఆదేశ భావాన్ని కాపాడుతుంది; కేవలం అనుమతి అనే భావానికి పరిమితం చేయదు.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: అయితే ఏడవ రోజున
  rationale: వావ్ సంధి ఇక్కడ ఆరు పని దినాలకు ఏడవ రోజును వ్యతిరేకంగా నిలుపుతుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: תִּשְׁבֹּת
  choice: పని మానాలి
  rationale: שׁבת అనే క్రియ యొక్క ప్రధాన భావం ఆపడం లేదా విరమించడం. తెలుగులో కేవలం ‘మానాలి’ అనడం అసంపూర్ణంగా వినిపించవచ్చు కాబట్టి, సందర్భంలో అంతర్లీనమైన పనిని స్పష్టంగా పేర్కొంది.
- source_word: בֶּחָרִישׁ
  choice: దున్నే కాలంలోనూ
  rationale: חרישׁ దున్నడం లేదా దున్నే కాలాన్ని సూచిస్తుంది; వ్యవసాయ ఋతువు అనే కాలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבַקָּצִיר
  choice: కోతకాలంలోనూ
  rationale: קציר కోతను లేదా కోతకాలాన్ని సూచిస్తుంది; ముందున్న పదబంధంతో సమాంతరతను కాపాడుతుంది.
- source_word: תִּשְׁבֹּת (second occurrence)
  choice: పని మానాలి
  rationale: హెబ్రీ మూలంలోని పునరుక్తిని నిలుపుతూ, అత్యవసరమైన వ్యవసాయ కాలాల్లో కూడా ఏడవ రోజు పని నిలిపివేయాలని నొక్కి చెబుతుంది.
theological_decisions:
- issue: విశ్రాంతిదినానికి సంబంధించిన שׁבת క్రియ అనువాదం
  choice: రెండు చోట్లా ‘పని మానాలి’
  alternative: ‘విశ్రాంతి తీసుకోవాలి’
  rationale: ఈ వచనం అనుభూతిపరమైన విశ్రాంతికంటే పనిని నిలిపివేయడాన్ని ప్రధానంగా చెబుతుంది. ‘పని మానాలి’ మూలక్రియలోని cessation భావాన్ని నిలుపుతుంది; అయినా ‘విశ్రాంతి తీసుకోవాలి’ అనే విస్తృతార్థాన్ని పాదసూచికలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఏకవచన ఆదేశాన్ని ‘నీవు’తో నిలిపి, మూలంలోని పునరుక్తి మరియు వ్యవసాయ కాలాల ప్రాధాన్యాన్ని కాపాడింది.
