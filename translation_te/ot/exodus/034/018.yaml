id: EXO.34.18
reference: Exodus 34:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: te
  text: “నీవు పులియని రొట్టెల పండుగను[a] ఆచరించాలి. నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆబీబు నెలలో నియమిత సమయంలో నీవు ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి. ఎందుకంటే ఆబీబు నెలలో నీవు ఐగుప్తు నుండి బయటికి వచ్చావు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పులియని రొట్టెల ఉత్సవం.’ హెబ్రీ పదం పవిత్రంగా నియమించబడిన పండుగ లేదా ఉత్సవాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: חַג అనేది నియమితమైన పవిత్ర పండుగను సూచిస్తుంది; מַצּוֹת పులియబెట్టని రొట్టెలను సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా, శీర్షికసదృశంగా ఉండే రూపం ఎంచుకోబడింది.
- source_word: תִּשְׁמֹר
  choice: ఆచరించాలి
  rationale: పండుగకు సంబంధించిన సందర్భంలో שׁמר అంటే కేవలం కాపాడడం కాదు, విధిగా పాటించడం లేదా ఆచరించడం.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి
  rationale: కాలవ్యవధిని స్పష్టంగా చూపుతూ, హెబ్రీ వాక్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: నేను నీకు ఆజ్ఞాపించిన ప్రకారం
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ దైవాజ్ఞ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: לְמוֹעֵד
  choice: నియమిత సమయంలో
  rationale: מוֹעֵד దేవుడు నిర్ణయించిన సమయం లేదా కాలాన్ని సూచిస్తుంది; ‘నియమిత సమయంలో’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ఆబీబు నెల
  rationale: אָבִיבను ఇక్కడ నెలకు సంబంధించిన ప్రాచీన నామం/నిర్దేశంగా లిప్యంతరీకరించడం చారిత్రక సందర్భాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు ఆధారమైన కారణాన్ని כִּי పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: నీవు ఐగుప్తు నుండి బయలుదేరి వచ్చావు
  rationale: יצא యొక్క ‘బయటకు వెళ్లడం/రావడం’ భావాన్ని, నిర్గమన సంఘటనను అతివ్యాఖ్యానించకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధన సంబంధమైన పండుగ పదజాలం
  choice: ‘పులియని రొట్టెల పండుగ’ను అధికారిక పవిత్ర ఆచరణ పేరుగా ఉపయోగించడం
  alternative: ‘పులియని రొట్టెల ఉత్సవం’
  rationale: ఈ సందర్భం దేవుడు నియమించిన, ఐగుప్తు నిర్గమనంతో ముడిపడిన పవిత్ర ఆచరణకు సంబంధించినది. ‘పండుగ’ దాని ఆధ్యాత్మిక, సామూహిక ప్రాధాన్యాన్ని అదనపు సిద్ధాంత భావాలు చేర్చకుండా నిలుపుతుంది.
- issue: రెండవ పురుష ఏకవచనంలో ఇశ్రాయేలుకు సంబోధన
  choice: ‘నీకు’, ‘నీవు’ అనే ఏకవచన రూపాలను నిలుపడం
  alternative: బహువచనంగా ‘మీకు’, ‘మీరు’ అని అనువదించడం
  rationale: హెబ్రీ మూలంలో పురుష ఏకవచనం ఉంది; అది ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది. మూలరూపాన్ని నిలుపుతూ తెలుగులోనూ అర్థవంతంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం ఉపయోగించబడింది. మూలంలోని రెండవ పురుష ఏకవచనం నిలుపబడింది. ‘ఆబీబు’ చారిత్రక నెలపేరుగా లిప్యంతరీకరించబడింది; పాఠ్యానికి అవసరం లేని వివరణాత్మక విస్తరణ చేయలేదు.
