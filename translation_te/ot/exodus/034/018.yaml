- from: “పులియని రొట్టెల పండుగను[a] ఆచరించాలి. నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆబీబు నెలలో నియమిత సమయంలో ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి. ఎందుకంటే ఆబీబు నెలలోనే నీవు ఐగుప్తు నుండి బయలుదేరి వచ్చావు.”
  to: “నీవు పులియని రొట్టెల పండుగను[a] ఆచరించాలి. నేను నీకు ఆజ్ఞాపించిన ప్రకారం, ఆబీబు నెలలో నియమిత సమయంలో నీవు ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి. ఎందుకంటే ఆబీబు నెలలో నీవు ఐగుప్తు నుండి బయటికి వచ్చావు.”
  rationale: మూలంలోని రెండవ పురుష ఏకవచన ఆజ్ఞారూపాలను స్పష్టపరచి, కాలనిర్దేశక పదబంధాన్ని హెబ్రీ వాక్యనిర్మాణానికి దగ్గరగా ఉంచాం. ‘బయటికి వచ్చావు’ అనేది יָצָאתָ యొక్క నేరమైన భావాన్ని సహజంగా ఇస్తుంది. పండుగ పేరు, ఆబీబు లిప్యంతరీకరణ, మరియు మతపరమైన రిజిస్టర్‌ను యథాతథంగా నిలిపాం. పాఠ్యంలో గమనిక a మాత్రమే ఉన్నందున, b గమనికను పాఠ్యంలో కొత్త గుర్తు చేర్చకుండా అందించడం నిర్మాణపరంగా అసంబద్ధం అవుతుంది; అందువల్ల పూర్తి ఉపయోగానికి పాఠ్యంలో [b] గుర్తు చేర్చాలి.
