  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: te
  text: ఉదయానికల్లా సిద్ధంగా ఉండు. ఉదయాన్నే సీనాయి పర్వతం మీదికి ఎక్కి వచ్చి,[a] అక్కడ పర్వత శిఖరంపై నా ఎదుట నిలబడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీనాయి పర్వతం మీదికి ఎక్కి వెళ్లి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అక్కడ పర్వత శిఖరంపై నా సమక్షంలో నిలబడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: సిద్ధంగా ఉండు
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన విశేషణ పదబంధం; ఆధునిక తెలుగులో సహజంగా ‘సిద్ధంగా ఉండు’ అని అర్థమిస్తుంది.
- source_word: לַבֹּקֶר
  choice: ఉదయానికల్లా
  rationale: రాబోయే ఉదయాన్ని గడువుగా సూచిస్తుంది; తరువాతి בַבֹּקֶרతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: וְעָלִיתָ בַבֹּקֶר
  choice: ఉదయాన్నే ... ఎక్కి వచ్చి
  rationale: עלה పైకి ఎక్కడాన్ని సూచిస్తుంది; దేవుని వైపు రావాలనే వక్త-కేంద్రిత దిశను ‘ఎక్కి వచ్చి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הַר סִינַי
  choice: సీనాయి పర్వతం మీదికి
  rationale: గమ్యాన్ని తెలిపే אֶלను, పర్వతారోహణ సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేసే రూపంతో అనువదించింది.
- source_word: וְנִצַּבְתָּ לִי
  choice: నా ఎదుట నిలబడు
  rationale: נצב నిఫాల్ రూపం ‘నిలబడు/స్థానం తీసుకో’ అనే భావం ఇస్తుంది; לִיతో కలిపి దేవుని సన్నిధిలో నిలబడటాన్ని స్పష్టంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: שָׁם עַל רֹאשׁ הָהָר
  choice: అక్కడ పర్వత శిఖరంపై
  rationale: רֹאשׁ యొక్క స్థలసూచక భావం ‘శిఖరం’; שָׁםను ‘అక్కడ’గా ప్రత్యక్షంగా నిలిపింది.
theological_decisions:
- issue: עלהలో వక్త-కేంద్రిత దిశ
  choice: ఎక్కి వచ్చి
  alternative: ఎక్కి వెళ్లి
  rationale: హీబ్రూ క్రియ స్వయంగా ‘వచ్చి/వెళ్లి’ అనే దిశను ఖచ్చితంగా నిర్దేశించదు. పర్వతంపై దేవుని వద్దకు మోషే రావాలనే సందర్భాన్ని ప్రధాన పాఠం ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- issue: וְנִצַּבְתָּ לִי యొక్క సంబంధ భావం
  choice: నా ఎదుట నిలబడు
  alternative: నా కోసం అక్కడ నిలబడు / నాకు నిన్ను నీవు సమర్పించుకో
  rationale: ‘నా ఎదుట నిలబడు’ అనేది నצב యొక్క నిలబడే భావాన్నీ, לִי ద్వారా సూచితమైన దేవుని సమక్షాన్నీ నిలుపుతుంది; ఆచారపరమైన ‘సమర్పణ’ భావాన్ని అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే ఆజ్ఞారూపాలు వాడబడ్డాయి. లַבֹּקֶר మరియు בַבֹּקֶר మధ్య కాలసూచక భేదం ‘ఉదయానికల్లా’ / ‘ఉదయాన్నే’గా నిలుపబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
