base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: te
  text: ఇశ్రాయేలీయులు[a] మోషే ముఖాన్ని చూసేవారు; ఆయన ముఖచర్మం కాంతి వెదజల్లుతుండేది.[b] మోషే ఆయనతో[c] మాట్లాడడానికి లోపలికి వెళ్లేవరకు తన ముఖంపై ముసుగును మళ్లీ వేసుకునేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది సాధారణంగా ఇశ్రాయేలు ప్రజలను, అంటే ఇశ్రాయేలీయులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు ‘ప్రకాశించడం’ లేదా ‘కిరణాలను వెదజల్లడం’ అనే అర్థం ఉంది. ‘కొమ్ములు కలిగి ఉండడం’ అనే సంప్రదాయ అనువాదం ఈ పదానికి సంబంధించిన పాత అపార్థం వల్ల వచ్చింది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయనతో’ అనేది సమీప సందర్భం ప్రకారం యెహోవాను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: కనిపించేది
  rationale: ఈ సందర్భం మోషే ప్రజల ముందుకు వచ్చినప్పుడల్లా జరిగే అలవాటైన చర్యను సంక్షిప్తంగా వివరిస్తోంది; అందువల్ల తెలుగు పునరావృత భావాన్ని సహజంగా వ్యక్తం చేసే రూపం వాడబడింది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఆధునిక తెలుగులో మొత్తం ఇశ్రాయేలు ప్రజలను సూచించడానికి ‘ఇశ్రాయేలీయులు’ సహజంగాను సమగ్రంగాను ఉంటుంది. అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: ఆయన ముఖచర్మం
  rationale: עוֹר అనే పదంలోని నిర్దిష్టమైన ‘చర్మం’ భావాన్ని నిలుపుతూ, తెలుగులో అనవసరంగా మోషే పేరును మళ్లీ పలకకుండా సహజంగా అనువదించబడింది.
- source_word: קָרַן
  choice: కాంతి వెదజల్లుతుండడం
  rationale: ఈ క్రియ కిరణాలు లేదా కాంతిని వెలువరించడాన్ని సూచిస్తుంది. ఈ ఎంపిక ప్రకాశ భావాన్ని స్పష్టంగా నిలుపుతుంది; తప్పుదారి పట్టించే ‘కొమ్ములు కలిగి ఉండడం’ అనే పాత అన్వయాన్ని నివారిస్తుంది.
- source_word: וְהֵשִׁיב
  choice: మళ్లీ వేసుకునేవాడు
  rationale: హిఫిల్ రూపం ఇక్కడ ముసుగును తిరిగి తన స్థానంలో ఉంచడాన్ని సూచిస్తుంది; సందర్భంలోని పునరావృత చర్యను ‘వేసుకునేవాడు’ తెలియజేస్తుంది.
- source_word: הַמַּסְוֶה
  choice: ముసుగు
  rationale: ముఖాన్ని కప్పే వస్తువుకు ఆధునిక ప్రామాణిక తెలుగులో ‘ముసుగు’ స్పష్టమైన, సహజమైన పదం.
- source_word: עַד בֹּאוֹ לְדַבֵּר אִתּוֹ
  choice: ఆయనతో మాట్లాడడానికి లోపలికి వెళ్లేవరకు
  rationale: עַד పరిమితిని, בֹּאוֹ లోపలికి ప్రవేశించడాన్ని, אִתּוֹ వ్యక్తివాచక సర్వనామాన్ని సూచిస్తున్నాయి; మూలంలోని సర్వనామాన్ని ప్రధాన పాఠ్యంలో నిలుపుకున్నాం.
theological_decisions:
- issue: ‘ఆయనతో’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో సర్వనామాన్ని నిలుపుతూ ‘ఆయనతో’ అని అనువదించడం
  alternative: స్పష్టత కోసం ‘యెహోవాతో’ అని నేరుగా పేర్కొనడం
  rationale: హీబ్రూ పాఠ్యంలో దైవనామం కాక సర్వనామమే ఉంది. సమీప సందర్భం అది యెహోవాను సూచిస్తుందని తెలియజేస్తుంది; అందువల్ల మూల రూపాన్ని నిలుపుతూ పాదసూచికలో సూచనను స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మొదటి వాక్యాన్ని సహజమైన తెలుగు గ్రహణ నిర్మాణంగా మలుస్తూనే ‘ముఖచర్మం’ మరియు కాంతి వెదజల్లే భావాలు నిలుపబడ్డాయి. సందర్భంలోని పునరావృత చర్యలను ‘కనిపించేది’, ‘వేసుకునేవాడు’ రూపాలు తెలియజేస్తాయి.
