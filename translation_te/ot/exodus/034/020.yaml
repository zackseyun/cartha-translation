  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: te
  text: గాడిదకు పుట్టిన తొలిచూలు పిల్లను మందలోని ఒక జంతువుతో[a] విమోచించాలి. దాన్ని విమోచించకపోతే, దాని మెడ విరగగొట్టాలి. నీ ప్రతి తొలిచూలు కుమారుణ్ణి విమోచించాలి. ఎవరూ నా సన్నిధికి వట్టి చేతులతో[b] రాకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం గొర్రె లేదా మేక మందలోని ఒక జంతువును సూచించగలదు; దీనిని ‘గొర్రెపిల్లతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, కానుక లేదా అర్పణ లేకుండా.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: గాడిదకు పుట్టిన తొలిచూలు పిల్ల
  rationale: פֶטֶר గర్భాన్ని మొదట తెరిచేదాన్ని సూచిస్తుంది. ఈ ధర్మశాస్త్ర సందర్భంలో సహజమైన తెలుగులో ‘తొలిచూలు పిల్ల’ అని ఇవ్వడం భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: תִּפְדֶּה
  choice: విమోచించాలి
  rationale: פדה ఇక్కడ ప్రత్యామ్నాయ బలి లేదా చెల్లింపు ద్వారా విడిపించడాన్ని సూచించే ఆరాధనా-న్యాయపదం. ‘విమోచించాలి’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: בְשֶׂה
  choice: మందలోని ఒక పిల్లతో
  rationale: שֶׂה గొర్రె లేదా మేక మందలోని ఒక్క జంతువును సూచించగలదు. కేవలం ‘గొర్రెపిల్ల’ అని సంకుచితం చేయకుండా మూలంలోని విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: וַעֲרַפְתּוֹ
  choice: దాని మెడ విరగగొట్టాలి
  rationale: ערף ఇక్కడ మెడను విరిచి చంపడాన్ని నిర్దిష్టంగా సూచిస్తుంది; తెలుగు వాక్యం ఆ చర్యను నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: నీ కుమారులలో ప్రతి తొలిచూలు కుమారుణ్ణి
  rationale: మూలంలోని בָּנֶיךָ ‘నీ కుమారులు’ అనే పుంలింగ సూచనను సాధారణీకరించకుండా నిలిపి, ప్రతి ప్రథమజాత కుమారుడనే న్యాయపరమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: יֵרָאוּ פָנַי
  choice: నా సన్నిధికి రాకూడదు
  rationale: ‘నా ముఖం ఎదుట కనబడటం’ అనే హెబ్రీయ నుడికారం దేవుని సన్నిధిలో ఆరాధనకు హాజరవడాన్ని సూచిస్తుంది. ‘నా సన్నిధికి రావడం’ సహజమైన ఆధునిక తెలుగు.
- source_word: רֵיקָם
  choice: వట్టి చేతులతో
  rationale: రֵיקָם ఇక్కడ కానుక లేదా అర్పణ లేకుండా రావడాన్ని సూచిస్తుంది. ‘వట్టి చేతులతో’ అనే తెలుగు నుడికారం అంతర్లీన భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో దేవుని ప్రథమపురుష సూచన
  choice: నా సన్నిధికి
  alternative: నా ముఖం ఎదుట
  rationale: פָנַי అక్షరార్థంగా ‘నా ముఖం’ అయినా, ఇక్కడ దేవుని సమక్షంలో ప్రత్యక్షమవడాన్ని తెలిపే నుడికారం. ‘నా సన్నిధికి’ ప్రత్యక్ష దైవవాక్యాన్ని, ఆరాధనా సందర్భాన్ని రెండింటినీ కాపాడుతుంది.
- issue: בָּנֶיךָ లోని లింగ సూచన
  choice: నీ కుమారులలో ప్రతి తొలిచూలు కుమారుణ్ణి
  alternative: నీ పిల్లలలో ప్రతి తొలిచూలు బిడ్డను
  rationale: హెబ్రీ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; దాన్ని లింగతటస్థంగా విస్తరించకుండా మూలంలోని న్యాయపరమైన పరిధిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాస్త్ర శైలిని ఉపయోగించాం. ఆజ్ఞలను ‘చేయాలి/రాకూడదు’ రూపంలో సహజంగా అందించాం. ‘తొలిచూలు’ అనే సుపరిచిత బైబిలీయ-న్యాయపదాన్ని ఉంచి, שֶׂה యొక్క నిజమైన పదార్థ విస్తృతిని ప్రధాన పాఠ్యం మరియు పాదసూచికలో సంరక్షించాం.
