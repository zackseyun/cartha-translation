base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: te
  text: యాహ్వే ఆ మేఘంలో దిగివచ్చి, అక్కడ అతనితో నిలబడి, యాహ్వే నామాన్ని ప్రకటించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే నామాన్ని పిలుచుకున్నాడు’; లేదా, ‘యాహ్వే నామంలో ప్రకటించాడు.’ హీబ్రూ పదబంధంలో ‘నామం’ ముందు ‘లో/ద్వారా’ అనే భావాన్నిచ్చే విభక్తి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיֵּרֶד
  choice: దిగివచ్చి
  rationale: ירד లోని కిందికి వచ్చే స్పష్టమైన కదలికను సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: בֶּעָנָן
  choice: ఆ మేఘంలో
  rationale: ב స్థలాన్ని సూచిస్తుంది; హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని, సందర్భంలో ఇప్పటికే తెలిసిన దైవసన్నిధి మేఘాన్ని, ‘ఆ’ ద్వారా ప్రతిబింబించాం.
- source_word: וַיִּתְיַצֵּב
  choice: నిలబడి
  rationale: יצב హిత్పయేల్ రూపం తన స్థానాన్ని తీసుకొని నిలబడటాన్ని సూచిస్తుంది; ‘నిలబడి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: עִמּוֹ
  choice: అతనితో
  rationale: עם మరియు ఏకవచన పురుష ప్రత్యయం నేరుగా ‘అతనితో’ అని అర్థమిస్తుంది; సందర్భంలో అతడు మోషే.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే హీబ్రూ క్రియావిశేషణాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וַיִּקְרָא
  choice: ప్రకటించాడు
  rationale: తరువాతి వచనంలో వచ్చే ప్రకటనను దృష్టిలో ఉంచితే, קרא యొక్క బహిరంగంగా ప్రకటించే భావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְשֵׁם יְהוָה
  choice: యాహ్వే నామాన్ని
  rationale: హీబ్రూలో ב ఉన్నప్పటికీ, ‘ప్రకటించాడు’తో తెలుగులో కర్మరూపం సహజంగా ఉంటుంది. మూలంలోని విభక్తి వల్ల సాధ్యమయ్యే ఇతర అర్థాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో అందించడం నామం యొక్క ప్రత్యేకతను కాపాడుతుంది.
- issue: וַיִּקְרָא యొక్క కర్త, భావం
  choice: ముందటి వాక్యక్రమం ప్రకారం యాహ్వేనే కర్త; ‘ప్రకటించాడు’
  alternative: మోషే కర్తగా ‘యాహ్వే నామాన్ని పిలిచాడు’; లేదా ‘యాహ్వే నామంలో ప్రకటించాడు’
  rationale: 'అనుక్రమ వావ్ క్రియలలో సహజంగా అదే కర్త కొనసాగుతాడు: యాహ్వే దిగివచ్చాడు, నిలబడ్డాడు, ప్రకటించాడు. తరువాతి వచనం దైవ స్వప్రకటనను ఇస్తుంది. అయితే בְשֵׁם నిర్మాణంలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో నిలిపాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఆ మేఘంలో’ మూలంలోని నిర్దిష్టతను చూపుతుంది. పురాతన లేదా మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
