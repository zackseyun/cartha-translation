    text: లేదా, “పోతపోసిన దేవుళ్లను”; “కరిగించిన లోహంతో చేసిన దేవుళ్లను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: దేవుళ్లను
  rationale: ఇది אֱלֹהִים పదపు బహువచన నిర్మాణ రూపం. విగ్రహారాధన నిషేధ సందర్భంలో స్పష్టమైన బహువచనమైన ‘దేవుళ్లు’ సహజంగా సరిపోతుంది.
- source_word: מַסֵּכָה
  choice: పోతపోసిన లోహంతో
  rationale: ఈ నామవాచకం కరిగించిన పదార్థాన్ని అచ్చులో పోసి చేసిన వస్తువును, ముఖ్యంగా లోహ విగ్రహాన్ని సూచిస్తుంది. తెలుగులో ‘పోతపోసిన లోహంతో’ అనేది తయారీ విధానాన్నీ పదార్థాన్నీ స్పష్టంగా తెలియజేస్తుంది; హెబ్రీలోని ‘దేవుళ్లు’కు అదనంగా ‘విగ్రహాలు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: לֹא
  choice: చేసుకోకూడదు
  rationale: న్యాయపరమైన ఆజ్ఞ సందర్భంలోని నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תַעֲשֶׂה
  choice: చేసుకోకూడదు
  rationale: ద్వితీయ పురుష ఏకవచన క్రియారూపం నిషేధంతో కలిసి ఆజ్ఞార్థక బలాన్ని కలిగిస్తుంది. ‘చేసుకోకూడదు’ ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לָּךְ
  choice: నీ కోసం
  rationale: వ్యక్తిగత ప్రయోజనం లేదా స్వాధీన భావాన్ని సూచించే ఉపసర్గ-సర్వనామ రూపాన్ని ‘నీ కోసం’ నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: నిషేధించబడిన వస్తువు స్వభావం
  choice: పోతపోసిన లోహంతో చేసిన దేవుళ్లను తయారు చేయడాన్ని వాక్యం నిషేధిస్తుంది.
  alternative: పోతపోసిన విగ్రహాలను నీ కోసం చేసుకోకూడదు.
  rationale: హెబ్రీ పదబంధం ‘దేవుళ్లు’ అనే పదాన్ని పోతపోసిన వస్తువు/లోహం అనే భావంతో కలుపుతుంది. ప్రధాన పాఠ్యంలో ‘దేవుళ్లు’ను నిలిపి, లోహపు పోత తయారీ భావాన్ని స్పష్టపరచడం మూలంలోని విగ్రహారాధన వ్యతిరేక బలాన్ని కాపాడుతుంది; అదే సమయంలో ‘విగ్రహాలు’ అని మాత్రమే అనువదించి ‘దేవుళ్లు’ అనే అంశాన్ని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన నిషేధ వాక్య నిర్మాణం వాడబడింది. ‘పోతపోసిన లోహంతో’ తయారీ ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది. మూలంలోని ఏకవచన సంబోధనను ‘నీ కోసం’తో నిలిపాము; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
