source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఈ మాటలను నీ కోసం రాసుకో. ఎందుకంటే ఈ మాటల ప్రకారం నేను నీతోనూ ఇశ్రాయేలుతోనూ నిబంధన చేశాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధన కోశాను.”
    reason: హీబ్రూ כרת ברית నుడికారంలోని అక్షరార్థ చిత్రాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య పరిచయంతో తెలియజేస్తుంది.
- source_word: כְּתָב לְךָ
  choice: నీ కోసం రాసుకో
  rationale: ఆజ్ఞారూపంలోని ప్రత్యక్షతను, לְךָ సూచించే మోషే వ్యక్తిగత ప్రమేయాన్ని నిలుపుతుంది.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: వ్రాయమనే ఆజ్ఞకూ నిబంధన సందర్భానికీ ‘మాటలు’ సహజంగా సరిపోతుంది; వాక్యంలోని పునరుక్తినీ నిలుపుతుంది.
- source_word: כִּי עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: ఎందుకంటే ఈ మాటల ప్రకారమే
  rationale: כִּי యొక్క కారణార్థాన్ని, עַל־פִּי యొక్క ‘అనుగుణంగా/ప్రకారం’ అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘ఏ’ అవధారణ నిబంధనకు ఈ మాటలే ఆధారమన్న బలాన్ని సూచిస్తుంది.
- source_word: כָּרַתִּי ... בְּרִית
  choice: నిబంధన చేశాను
  rationale: ‘నిబంధన కోయడం’ అనే హీబ్రూ నుడికారానికి సాధారణ పాఠకులకు సహజమైన తెలుగు సమానార్థకం; అక్షరార్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: אִתְּךָ וְאֶת־יִשְׂרָאֵל
  choice: నీతోనూ ఇశ్రాయేలుతోనూ
  rationale: మోషే మరియు ఇశ్రాయేలు ఇద్దరితోనూ నిబంధన సంబంధం ఉందని సమాంతర నిర్మాణంతో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా మూలపాఠంలోని పేరును నిలుపుతుంది; ‘యాహ్వే’ దాని విస్తృతంగా అంగీకరించిన పండితీయ స్వరూపానికి తెలుగు లిప్యంతరీకరణ.
- issue: כרת ברית అనే నిబంధన నుడికారం
  choice: నిబంధన చేశాను
  alternative: నిబంధన కోశాను
  rationale: అక్షరార్థ రూపం తెలుగులో తప్పుదారి పట్టించవచ్చు. సహజమైన అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, మూల నుడికారాన్ని పాదసూచికలో సంరక్షించింది.
- issue: మోషే మరియు ఇశ్రాయేలు నిబంధనలో భాగస్వాములుగా పేర్కొనబడటం
  choice: నీతోనూ ఇశ్రాయేలుతోనూ
  alternative: నీతో, ఇశ్రాయేలుతో
  rationale: మూలంలోని రెండు సంబంధ పదబంధాల సమాంతరతను నిలిపి, మోషేకు మరియు ఇశ్రాయేలుకు ఉన్న సంబంధాన్ని పాఠం చెప్పిన మేరకే వ్యక్తం చేస్తుంది; దాని ధార్మిక స్వరూపాన్ని అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మాటలు,’ ‘నిబంధన’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ, అసహజమైన పదానువాదాన్ని ప్రధాన పాఠంలో నివారించింది.
