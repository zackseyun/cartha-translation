  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఈ మాటలను నీ కోసం రాసుకో. ఎందుకంటే ఈ మాటల ప్రకారం నేను నీతోనూ ఇశ్రాయేలుతోనూ నిబంధన చేశాను[a].”'
  rationale: ప్రధాన పాఠం నుంచి ప్రకారమే లోని అదనపు అవధారణను తొలగించాం. మిగిలిన అనువాదం మూల హీబ్రూ భావానికీ, ఆంగ్ల POB audit trail‌లోని “according to these words” అనే ఎంపికకూ సహజమైన ఆధునిక తెలుగు వాడుకకూ అనుగుణంగా ఉంది.
