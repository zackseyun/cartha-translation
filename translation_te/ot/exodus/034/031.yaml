translation:
  language: te
  text: అయితే మోషే వారిని పిలిచాడు. అప్పుడు అహరోనూ సమాజంలోని నాయకులందరూ అతని దగ్గరికి తిరిగి వచ్చారు; మోషే వారితో మాట్లాడాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: వారిని పిలిచాడు
  rationale: קרא తో אֶל వచ్చినప్పుడు వారిని ఉద్దేశించి పిలవడం అనే భావం వస్తుంది. ‘పిలిచాడు’ సహజమైన ఆధునిక తెలుగు; ‘రమ్మని పిలిచాడు’ అనేది మూలంలో స్పష్టంగా లేని ఉద్దేశాన్ని కొంత విస్తరిస్తుంది.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: అతని దగ్గరికి తిరిగి వచ్చారు
  rationale: שׁוב యొక్క ‘తిరిగి రావడం’ అనే భావాన్ని నిలుపుతూ, אֵלָיו సూచించే మోషే వైపు/దగ్గరికి రావడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנְּשִׂאִים בָּעֵדָה
  choice: సమాజంలోని నాయకులు
  rationale: נָשִׂיא ఇక్కడ ప్రజాసమూహపు నాయకులను సూచిస్తుంది. בָּעֵדָה ను ‘సమాజంలోని’గా తీసుకోవడం హెబ్రీ ప్రయోగానికి అనుగుణంగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר యొక్క సాధారణ భావాన్ని స్పష్టంగా అందిస్తుంది. తరువాతి వచనాలే ఆయన చెప్పిన విషయాన్ని వివరించేందున ఇక్కడ అదనపు విషయాన్ని చేర్చలేదు.
- source_word: וַ
  choice: అయితే / అప్పుడు
  rationale: మొదటి waw మునుపటి వచనంలోని భయానికి స్వల్ప వ్యతిరేకతను సూచించేలా ‘అయితే’గా, తరువాతి కథన క్రమాన్ని తెలిపే waw ‘అప్పుడు’గా సహజీకరించబడింది.
