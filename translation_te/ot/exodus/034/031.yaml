translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమాజం’ అనే పదం עֵדָה యొక్క ఇశ్రాయేలు ప్రజాసమూహ భావాన్ని అందిస్తుంది; అనవసరమైన సంఘపరమైన ప్రత్యేకార్థాన్ని నివారిస్తుంది.
