revisions:
- from: నా బలి రక్తాన్ని పులిసిన పదార్థంతో కలిపి వధించకూడదు; పస్కా పండుగ బలి ఉదయం వరకు మిగిలి ఉండకూడదు.
  to: నా బలి రక్తాన్ని పులిసినదానితో కలిపి అర్పించకూడదు; పస్కా పండుగ బలి[a] ఉదయం వరకు మిగిలి ఉండకూడదు.
  rationale: The revision resolves the impossible Telugu collocation of slaughtering blood by expressing the sacrificial presentation intended by the Hebrew idiom, while keeping “నా బలి రక్తం” explicit. It also uses a natural broad equivalent for leavened matter and supplies a correctly placed lexical-alternative footnote for the compact Passover phrase.
