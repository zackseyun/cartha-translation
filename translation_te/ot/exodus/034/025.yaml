source:
  edition: WLC
  text: לֹֽא תִשְׁחַ֥ט עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹא יָלִ֣ין לַ/בֹּ֔קֶר זֶ֖בַח חַ֥ג הַ/פָּֽסַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: te
  text: నా బలి రక్తాన్ని పులిసినదానితో కలిపి అర్పించకూడదు; పస్కా పండుగ బలి[a] ఉదయం వరకు మిగిలి ఉండకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పస్కా బలి” లేదా “పస్కా పండుగ యొక్క బలి.” హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: వధించకూడదు
  rationale: שׁחט బలిగా అర్పించే జంతువును విధిపూర్వకంగా వధించడాన్ని సూచిస్తుంది. ‘చంపకూడదు’ కంటే ‘వధించకూడదు’ బలి సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל חָמֵץ
  choice: పులిసిన పదార్థంతో కలిపి
  rationale: עַל ఇక్కడ ఆచార సంబంధ నిషేధంలో ‘తో/కలిపి’ అనే భావాన్ని ఇస్తుంది. חָמֵץ పులిసినది లేదా పులిసే పదార్థాన్ని సూచించగలదు; అందువల్ల ప్రత్యేకంగా రొట్టె అని పరిమితం చేయలేదు.
- source_word: דַּם זִבְחִי
  choice: నా బలి రక్తాన్ని
  rationale: మూలంలోని ‘రక్తం’ అనే బలి చిత్రాన్ని, అలాగే זִבְחִי లోని ప్రథమ పురుష ఏకవచన స్వామ్యార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: יָלִין
  choice: మిగిలి ఉండకూడదు
  rationale: לין రాత్రంతా ఉండిపోవడాన్ని సూచిస్తుంది. వెంటనే వచ్చే ‘ఉదయం వరకు’ కాలపరిమితిని సహజమైన తెలుగులో పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: זֶבַח חַג הַפָּסַח
  choice: పస్కా పండుగ బలి
  rationale: మూడు నామపదాల సంక్షిప్త హెబ్రీ నిర్మాణంలోని బలి, పండుగ, పస్కా అనే మూడు అంశాలనూ సహజమైన తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: הַפָּסַח
  choice: పస్కా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పండుగ పేరు; మూలంలోని ఇశ్రాయేలు ఆచార సందర్భాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా సూచిస్తుంది.
theological_decisions:
- issue: నిబంధన పండుగ పదజాలాన్ని తరువాతి సిద్ధాంత సంబంధాలు చేర్చకుండా అనువదించడం
  choice: పస్కా
  alternative: దాటిపోవు పండుగ
  rationale: ‘పస్కా’ తెలుగు బైబిలు పాఠకులకు పరిచితమైన సాంప్రదాయ నామం; ఈ వచనంలోని మోషే ధర్మశాస్త్ర సంబంధ సందర్భాన్ని కాపాడుతూ వివరణాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి. హెబ్రీ వాక్యంలోని రెండు సమాంతర నిషేధాలను సెమికోలన్‌తో వేరు చేశాం. మూలంలోని సంక్షిప్తతను కాపాడుతూ అవసరంలేని సిద్ధాంత వివరణను చేర్చలేదు.
