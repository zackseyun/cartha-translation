review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the divine promise to drive out nations, enlarge Israel’s boundary, and protect its land during the three annual appearances before Yahweh. However, ‘ఆశించడు’ can mean ‘hope for’ and does not adequately convey the wrongful, acquisitive force of חמד (‘covet’). ‘దేశం’ is somewhat narrower and more political than אַרֶץ (‘land’), and the singular ‘border’ should be retained. The pilgrimage idiom is more naturally rendered as appearing/being present before Yahweh, while retaining ‘go up.’
  naturalness: The existing Telugu is generally clear, but ‘సన్నిధిలో కనిపించడానికి’ is less idiomatic in this context and can suggest merely becoming visible in God’s presence. ‘సన్నిధికి హాజరుకావడానికి’ clearly communicates the worship/pilgrimage sense. The revised word order is natural modern standard Telugu.
  terminology: ‘యాహ్వే’ appropriately represents יהוה. ‘జాతులు,’ ‘సరిహద్దు,’ and ‘భూమి’ more closely reflect the source terms in this territorial context. ‘ఏ పురుషుడూ’ appropriately retains the grammatically masculine singular representative noun, with the explanatory footnote preserved.
  issues:
  - severity: medium
    issue: ‘ఆశించడు’ weakens the force of חמד.
    rationale: The Hebrew verb denotes coveting or wrongful acquisitive desire, not simply hoping for something. ‘కాంక్షించడు’ more adequately expresses the sense in natural Telugu.
  - severity: low
    issue: ‘నీ దేశాన్ని’ and plural ‘సరిహద్దులను’ are less precise than the Hebrew.
    rationale: אַרֶץ is ‘land’ in this covenant-territory context, and גְּבוּלֶךָ is singular, ‘your border/boundary.’
  - severity: low
    issue: ‘సన్నిధిలో కనిపించడానికి’ is awkward for the pilgrimage idiom.
    rationale: The Hebrew literally says ‘to see the face of,’ an idiom for appearing before God. ‘సన్నిధికి హాజరుకావడానికి’ is natural and clear; the literal wording remains in the footnote.
  revised_text: ఎందుకంటే నేను నీ ఎదుటనుండి జాతులను వెళ్లగొట్టి, నీ సరిహద్దును విస్తరిస్తాను; నీవు సంవత్సరానికి మూడుసార్లు[b] యాహ్వే, నీ దేవుని సన్నిధికి హాజరుకావడానికి[a] పైకి వెళ్లినప్పుడు, ఏ పురుషుడూ[c] నీ భూమిని కాంక్షించడు.
