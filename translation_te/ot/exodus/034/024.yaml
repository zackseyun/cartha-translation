base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: te
  text: ఎందుకంటే నేను నీ ఎదుటనుండి జాతులను వెళ్లగొట్టి, నీ సరిహద్దును విస్తరిస్తాను; నీవు సంవత్సరానికి మూడుసార్లు[b] యాహ్వే, నీ దేవుని సన్నిధికి హాజరుకావడానికి[a] పైకి వెళ్లినప్పుడు, ఏ పురుషుడూ[c] నీ భూమిని కాంక్షించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో పదశఃగా, ‘యాహ్వే, నీ దేవుని ముఖాన్ని చూడడానికి.’ ఇది ఆరాధన కోసం ఆయన సన్నిధిలో హాజరుకావడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏడాదిలో మూడుసార్లు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘పురుషుడు’ అనే పుంలింగ ఏకవచన పదం ఉంది; అది ఇక్కడ ప్రతినిధ్యార్థంలో వాడబడింది. యాత్రా పండుగల కోసం ఇశ్రాయేలు పురుషులు వెళ్లినప్పుడు వారి భూమిని ఎవరూ కాంక్షించరన్నది భావం.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న యాత్రా పండుగల ఆజ్ఞకు ఈ వాగ్దానం కారణాన్ని తెలియజేస్తోంది.
- source_word: אוֹרִישׁ
  choice: వెళ్లగొట్టి
  rationale: హిఫీల్ రూపం ఇక్కడ జనాలను దేశం నుండి తొలగించడం లేదా వెళ్లగొట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: גּוֹיִם
  choice: జనాలను
  rationale: దేశాధికార సందర్భంలో విదేశీ ప్రజాసమూహాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: మూలంలోని ‘నీ ముఖం/సన్నిధి ఎదుటనుండి’ అనే స్థానార్థక నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: నీ సరిహద్దులను విస్తరిస్తాను
  rationale: భూభాగపు హద్దులను వెడల్పు చేయడం అనే స్పష్టమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֹא יַחְמֹד
  choice: ఆశించడు
  rationale: חמד అంటే ఇతరునిదాన్ని తనదిగా చేసుకోవాలనే బలమైన కోరిక. ‘ఆశించడు’ సందర్భంలో ఆ అనుచిత ఆకాంక్షను సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఏ పురుషుడూ
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, నిరాకరణతో ప్రతినిధ్యార్థాన్ని వ్యక్తపరుస్తుంది.
- source_word: אַרְצְךָ
  choice: నీ దేశాన్ని
  rationale: ఇక్కడ ఇశ్రాయేలుకు చెందిన భూభాగాన్ని సూచిస్తుంది; ‘దేశం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: בַּעֲלֹתְךָ
  choice: నీవు వెళ్లినప్పుడు
  rationale: ఆరాధనా స్థలానికి ‘పైకి వెళ్లడం’ అనే యాత్రా నుడికారాన్ని తెలుగులో భారంగా కాకుండా సహజంగా అందిస్తుంది.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: సన్నిధిలో కనిపించడానికి
  rationale: దేవుని సమక్షంలో ఆరాధనార్థం హాజరుకావడం అనే యాత్రా నుడికార భావాన్ని వ్యక్తపరుస్తుంది; పదశః రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: ఇది బిరుదు కాదు, హీబ్రూ దైవనామం; దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: సంవత్సరానికి మూడుసార్లు
  rationale: హీబ్రూ కాలవ్యవహారానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి దగ్గరైన లిప్యంతరీకరణను ఉంచాం.
- issue: אִישׁ లోని పుంలింగ ప్రతినిధ్య రూపం
  choice: ఏ పురుషుడూ
  alternative: ఎవరూ
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; అదే సమయంలో సందర్భంలో ప్రతినిధ్యార్థం ఉంది. ప్రధాన పాఠంలో రూపాన్ని నిలిపి, దాని విస్తృత భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
- issue: לֵרָאוֹת אֶת־פְּנֵי అనే ఆరాధనా నుడికారం
  choice: సన్నిధిలో కనిపించడానికి
  alternative: ముఖాన్ని చూడడానికి; సన్నిధికి హాజరుకావడానికి
  rationale: ఆరాధనా యాత్రలో దేవుని సమక్షంలో హాజరుకావడమే సందర్భార్థం. మూలంలోని ముఖం/చూడడం సంబంధిత భాషను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘నీ/నీవు’ అనే ఏకవచన రూపాలు హీబ్రూ రెండవ పురుష ఏకవచనాన్ని నిలుపుతాయి. ‘యాహ్వే’ను వ్యక్తిగత దైవనామంగా లిప్యంతరీకరించాం.
