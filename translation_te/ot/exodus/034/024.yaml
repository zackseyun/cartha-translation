- from: ఎందుకంటే, నేను నీ ఎదుటనుండి జనాలను వెళ్లగొట్టి, నీ సరిహద్దులను విస్తరిస్తాను. సంవత్సరానికి మూడుసార్లు[b] నీ దేవుడైన యాహ్వే సన్నిధిలో కనిపించడానికి[a] నీవు వెళ్లినప్పుడు, ఏ పురుషుడూ[c] నీ దేశాన్ని ఆశించడు.
  to: ఎందుకంటే నేను నీ ఎదుటనుండి జాతులను వెళ్లగొట్టి, నీ సరిహద్దును విస్తరిస్తాను; నీవు సంవత్సరానికి మూడుసార్లు[b] యాహ్వే, నీ దేవుని సన్నిధికి హాజరుకావడానికి[a] పైకి వెళ్లినప్పుడు, ఏ పురుషుడూ[c] నీ భూమిని కాంక్షించడు.
  rationale: The revision strengthens the rendering of ‘covet,’ aligns ‘land,’ singular ‘border,’ and ‘nations’ more closely with the Hebrew, and improves the Telugu expression of the worship-pilgrimage idiom without losing the source’s ‘go up’ language. Footnote markers remain correctly attached and all footnotes are retained in revised form.
