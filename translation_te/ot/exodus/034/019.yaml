  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: te
  text: గర్భాన్ని తెరిచే ప్రతి తొలి సంతానం నాది[a]. నీ పశుసంపదలోని ప్రతి మగ తొలి సంతానం—ఎద్దుదైనా గొర్రెదైనా—నాది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గర్భాన్ని తెరిచేది.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం పశుసంపదలోని మగ తొలి సంతానాన్ని నిర్దేశిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ప్రతి
  rationale: ఏకవచన నిర్మాణాలతో పంపిణీ భావంలో వాడబడింది; ‘ప్రతి’ విశ్వవ్యాప్త పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פֶּטֶר רֶחֶם
  choice: గర్భాన్ని మొదట తెరచే ప్రతి సంతానం
  rationale: అక్షరార్థంగా ‘గర్భాన్ని తెరచేది’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, అది తొలి సంతానాన్ని సూచిస్తుందని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִי
  choice: నాది
  rationale: ఈ పదబంధం యెహోవా యొక్క స్వామ్యహక్కు లేదా హక్కుదావాను సూచిస్తుంది; ‘నాది’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מִקְנְךָ
  choice: నీ పశుసంపదలో
  rationale: సొంత మందలు, పశువులను సమష్టిగా సూచించే విస్తృత పదం; ‘పశుసంపద’ ఆధునిక ప్రామాణిక తెలుగులో తగిన సమానార్థకం.
- source_word: תִּזָּכָר
  choice: ప్రతి మగది
  rationale: ఇక్కడ זכר యొక్క నిఫాల్ రూపం పశుసంపదలో మగ సంతానాన్ని నిర్దేశిస్తుంది; తప్పుదారి పట్టించే ‘జ్ఞాపకం చేయబడుతుంది’ అనే అర్థాన్ని నివారిస్తుంది.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: మొదట పుట్టినది—ఎద్దైనా గొర్రెైనా
  rationale: ఇది ముందున్న మగ పశుసంతానాన్ని వివరిస్తూ, ఎద్దు మరియు గొర్రె అనే వర్గాలను పేర్కొంటుంది; తెలుగులో సహజంగా ఉండేలా ‘ఎద్దైనా గొర్రెైనా’ అని ఇచ్చాం.
theological_decisions:
- issue: తొలి సంతానంపై దేవుని స్వామ్యహక్కు
  choice: తొలి సంతానం యెహోవాదని తెలిపే న్యాయపరమైన హక్కుదావాను మాత్రమే వ్యక్తం చేయడం
  alternative: ప్రతిష్ఠ లేదా బలి అర్హతను ప్రధాన వాక్యంలో మరింత స్పష్టంగా చేర్చడం
  rationale: హీబ్రూ పాఠం నేరుగా ‘నాది’ అని స్వామ్యాన్ని ప్రకటించి, పశుసంపదలో మగ తొలి సంతానాన్ని గుర్తిస్తుంది. తరువాతి ఆచార లేదా బలి వివరణలను ఈ వాక్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘గర్భాన్ని తెరచే’ అనే మూల నుడికారాన్ని ప్రధాన పాఠంలోనే నిలిపి, ‘మొదట’ మరియు ‘సంతానం’ ద్వారా దాని భావాన్ని స్పష్టం చేశాం. రెండో భాగంలో హీబ్రూ వాక్యంలోని అర్థానుసారంగా ‘నాది’ని పునరుక్తి చేసి తెలుగు వాక్యాన్ని సంపూర్ణంగా చేశాం.
