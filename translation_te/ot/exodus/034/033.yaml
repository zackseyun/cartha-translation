  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: te
  text: మోషే వారితో మాట్లాడడం ముగించిన తర్వాత తన ముఖం మీద ముసుగు పెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారితో మాట్లాడడం ఆపిన తర్వాత.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: ముగించినప్పుడు
  rationale: כלה క్రియ ఇక్కడ మోషే మాట్లాడే కార్యం పూర్తయినదని సూచిస్తుంది. కాలసంబంధ ఉపవాక్యంలో ‘ముగించినప్పుడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִדַּבֵּר
  choice: మాట్లాడడం
  rationale: כלה తరువాత מִ־తో వచ్చిన דבר క్రియారూపం మాట్లాడే కార్యం ముగియడాన్ని వ్యక్తపరుస్తుంది; తెలుగులో క్రియానామ రూపం సహజంగా సరిపోతుంది.
- source_word: אִתָּם
  choice: వారితో
  rationale: אֵת అనే సంబంధబోధకం ప్రత్యయంతో కలిసి అత్యంత నేరుగా ‘వారితో’ అని అర్థమిస్తుంది; సందర్భంలో సంభాషణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וַיִּתֵּן
  choice: వేసుకున్నాడు
  rationale: נתן + עַל ఇక్కడ ముఖంపై ఆవరణాన్ని ఉంచడాన్ని సూచిస్తుంది. తెలుగులో ధరించే లేదా కప్పుకునే వస్తువుకు ‘వేసుకున్నాడు’ సహజంగా ఉండి, కర్త తన ముఖంపై పెట్టుకున్నాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: עַל פָּנָיו
  choice: తన ముఖం మీద
  rationale: ప్రతిబింబ స్వామ్యాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తన’ వాడబడింది; עַל యొక్క స్థానార్థం ‘మీద’గా నిలుపబడింది.
- source_word: מַסְוֶה
  choice: ముసుగు
  rationale: ఈ అరుదైన నామవాచకం సందర్భంలో ముఖాన్ని కప్పే ఆవరణాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘ముసుగు’ స్పష్టమైన, గౌరవప్రదమైన పదం.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును, కథనానికి తగిన గంభీరతను ఉపయోగించాం. ‘వారితో’ ద్వారా హీబ్రూ సంబంధబోధకంలోని సహచర్య భావాన్ని నిలిపాం; כלה లోని ‘ముగించడం/ఆపడం’ అనే సాధ్యమైన భేదాన్ని పాదసూచికలో ఉంచాం.
