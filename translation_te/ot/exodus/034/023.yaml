source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: te
  text: సంవత్సరంలో మూడుసార్లు నీ పురుషులందరూ ఇశ్రాయేలు దేవుడైన ప్రభువైన యాహ్వే[b] సమక్షంలో[a] హాజరు కావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ముఖం ఎదుట’; భావం ‘సమక్షంలో.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘ప్రభువు’ అనే బిరుదు, దాని తరువాత యాహ్వే అనే దైవనామం ఉన్నాయి. అందుకే ఇక్కడ ‘ప్రభువైన యాహ్వే’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: సంవత్సరానికి మూడుసార్లు
  rationale: హీబ్రూ పదబంధం వార్షికంగా మూడు సందర్భాలను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֵרָאֶה
  choice: హాజరు కావాలి
  rationale: ఇక్కడ నిఫాల్ రూపం దేవుని సన్నిధిలో ఆరాధనార్థం ప్రత్యక్షమవడాన్ని సూచించే ఆచార సంబంధమైన ప్రయోగం. ‘హాజరు కావాలి’ ఆ బాధ్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל זְכוּרְךָ
  choice: నీ పురుషులందరూ
  rationale: మూలంలో పురుష లింగం స్పష్టంగా ఉంది; దానిని లింగతటస్థంగా మార్చకుండా నిలుపుతుంది.
- source_word: אֶת פְּנֵי
  choice: సన్నిధిలో
  rationale: అక్షరార్థంగా ‘ముఖం ఎదుట’ అనే హీబ్రూ నుడికారం ఒకరి సమక్షంలో ఉండడాన్ని సూచిస్తుంది; ‘సన్నిధిలో’ గౌరవప్రదమైన, సహజమైన తెలుగు సమానం.
- source_word: הָאָדֹן
  choice: ప్రభువైన
  rationale: ఇది దైవిక బిరుదు; వెంటనే వచ్చే వ్యక్తిగత నామంతో సహజమైన తెలుగు విశేషణ బంధంగా కలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని కేవలం ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో ప్రత్యేకంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తూ, తెలుగులో తరువాతి దైవబిరుదు-నామ శ్రేణితో సహజంగా అనుసంధానమవుతుంది.
theological_decisions:
- issue: הָאָדֹן יְהוָה అనే బిరుదు-దైవనామ శ్రేణి
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన యాహ్వే; ప్రభువైన దేవుడు
  rationale: మూలంలోని ‘ప్రభువు’ అనే బిరుదును, యహ్వే అనే దైవనామాన్ని రెండింటినీ వేర్వేరుగా నిలుపుతూ తెలుగులో సహజమైన నిర్మాణాన్ని ఇస్తుంది. ‘దేవుడు’ అని మార్చడం మూలంలోని దైవనామాన్ని మరుగుపరుస్తుంది.
- issue: పండుగలకు హాజరయ్యే వారి లింగ సూచన
  choice: నీ పురుషులందరూ
  alternative: నీ మనుషులందరూ; మీ అందరూ
  rationale: זְכוּרְךָ పురుషులను స్పష్టంగా సూచిస్తుంది; కాబట్టి విస్తృతమైన లేదా లింగతటస్థమైన పదంతో ఆ పరిమితిని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఏకవచన ‘నీ’ మూలంలోని రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది. ‘హాజరు కావాలి’ ఆచారపరమైన ప్రత్యక్షతతో కూడిన విధిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
