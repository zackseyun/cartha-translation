- from: అతడు అక్కడ యెహోవాతో నలభై పగళ్లు, నలభై రాత్రులు ఉన్నాడు; రొట్టె తినలేదు, నీళ్లు తాగలేదు. అతడు పలకల మీద నిబంధన మాటలను—ఆ పది మాటలను—రాశాడు.[a][b]
