reference: Exodus 34:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: te
  text: అతడు అక్కడ యెహోవాతో నలభై రోజులు, నలభై రాత్రులు ఉన్నాడు; రొట్టె తినలేదు, నీళ్లు తాగలేదు. అతడు పలకల మీద నిబంధన మాటలను—ఆ పది మాటలను—రాశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా రాశాడు.” ఎందుకంటే ఇతర చోట్ల పలకల మీద రాయడం యెహోవాకే ఆపాదించబడింది (నిర్గమకాండము 34:1; ద్వితీయోపదేశకాండము 10:4 చూడండి).
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ: “పది మాటలు”; సంప్రదాయంగా, “పది ఆజ్ఞలు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హీబ్రూ వ్యంజనాలను పేరుగా సూచిస్తూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగించింది.
- source_word: וַיְהִי שָׁם עִם
  choice: అతడు అక్కడ ... తో ... ఉన్నాడు
  rationale: మోషే అక్కడ యెహోవా సన్నిధిలో ఉన్నాడనే స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నిలిచాడు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: హీబ్రూ పదబంధంలోని పగలు–రాత్రి సమాంతరతను స్పష్టంగా నిలుపుతుంది.
- source_word: לֶחֶם לֹא אָכַל
  choice: రొట్టె తినలేదు
  rationale: లֶחֶם అనే నిర్దిష్ట పదాన్ని ‘ఆహారం’ అని సాధారణీకరించకుండా, దాని స్పష్టమైన అర్థాన్ని నిలుపుతుంది.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: నీళ్లు తాగలేదు
  rationale: మూలంలోని ప్రత్యక్ష భావాన్ని, ముందున్న వాక్యభాగంతో సమాంతరంగా, సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: וַיִּכְתֹּב
  choice: అతడు ... రాశాడు
  rationale: క్రియ తృతీయ పురుష ఏకవచనంలో ఉంది; తక్షణ వాక్యప్రవాహంలో మోషే కొనసాగుతున్న కర్తగా సహజంగా అర్థమవుతాడు. విస్తృత సందర్భంలో ఉన్న కర్తసంబంధ సందిగ్ధతను పాదసూచికలో ఉంచింది.
- source_word: עַל הַלֻּחֹת
  choice: పలకల మీద
  rationale: రాతి నిబంధన పలకలను సూచించే సరళమైన, స్థిరమైన తెలుగు పదప్రయోగం.
- source_word: דִּבְרֵי הַבְּרִית
  choice: నిబంధన మాటలు
  rationale: ‘నిబంధనకు సంబంధించిన మాటలు’ అనే హీబ్రూ సమాస సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: ఆ పది మాటలు
  rationale: హీబ్రూ వాచ్యార్థాన్ని నిలుపుతుంది; సంప్రదాయ రూపమైన ‘పది ఆజ్ఞలు’ను పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: చివరి వాక్యంలోని ‘రాశాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘అతడు ... రాశాడు’ అని ఉంచి, తక్షణ వాక్యప్రవాహం ప్రకారం మోషేను సహజ కర్తగా చదవనిచ్చింది.
  alternative: ‘యెహోవా రాశాడు’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూలో కర్తను మళ్లీ పేరుతో చెప్పలేదు. ఈ వచనంలోని వరుస క్రియలకు మోషే తక్షణ కర్తగా కనిపిస్తాడు; అయితే నిర్గమకాండము 34:1, ద్వితీయోపదేశకాండము 10:4 పలకలపై రాయడాన్ని యెహోవాకు ఆపాదిస్తాయి. ఈ నిజమైన సందర్భ సంబంధ ఉద్రిక్తతను పాదసూచికలో కాపాడింది.
- issue: עֲשֶׂרֶת הַדְּבָרִים పదబంధం
  choice: పది మాటలు
  alternative: పది ఆజ్ఞలు
  rationale: మూల హీబ్రూ వాచ్యంగా ‘పది మాటలు’ అని ఉంది. సుపరిచితమైన వ్యాఖ్యాత్మక సంప్రదాయ రూపం ‘పది ఆజ్ఞలు’ను ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘రొట్టె,’ ‘నీళ్లు,’ ‘పలకలు,’ ‘మాటలు’ వంటి స్పష్టమైన సాధారణ పదాలతో మూలంలోని సమాంతరతను, పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది. రెండు పాదసూచిక సూచికలను అవి వివరిస్తున్న ‘రాశాడు’ మరియు ‘పది మాటలు’ ఉన్న వాక్యాంతంలో ఉంచింది.
