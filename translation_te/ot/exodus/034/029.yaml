  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: te
  text: మోషే సీనాయి పర్వతం నుంచి దిగివస్తున్నప్పుడు, సాక్ష్యపు రెండు పలకలు మోషే చేతిలో ఉన్నాయి. అతడు పర్వతం నుంచి దిగివస్తుండగా, తాను ఆయనతో మాట్లాడినందువల్ల తన ముఖచర్మం ప్రకాశించిందని[a] మోషేకు తెలియలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రకాశించింది’ అనే హీబ్రూ క్రియకు ‘కిరణాలను వెలువరించింది’ అని కూడా అర్థం కావచ్చు. చారిత్రక ప్రత్యామ్నాయంగా దీనిని ‘కొమ్ములుగలది’ అని కూడా అనువదించారు; అయితే ఈ సందర్భానికి అది అంతగా సరిపోదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన’ అంటే యెహోవా. ‘తాను ఆయనతో మాట్లాడినందువల్ల’ అనే మాటలను ‘తాను ఆయనతో మాట్లాడినప్పుడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేకంగా అనువదించకుండా కాలసూచక వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హీబ్రూ కథనంలోని וַיְהִי కొత్త దృశ్యాన్ని ప్రవేశపెడుతుంది. తెలుగులో ‘జరిగింది’ అని యాంత్రికంగా చేర్చడం అసహజం; ‘దిగివస్తున్నప్పుడు’ అనే నిర్మాణం దాని కథన కార్యాన్ని సహజంగా నెరవేర్చుతుంది.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: దిగివస్తున్నప్పుడు ... దిగివస్తూ
  rationale: మూలంలోని రెండు కాలసూచక infinitive నిర్మాణాల పునరుక్తిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מֵהַר סִינַי
  choice: సీనాయి పర్వతం నుంచి
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన స్థలనామ రూపం.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: సాక్ష్యపు రెండు పలకలు
  rationale: עֵדוּת యొక్క నిబంధనసంబంధ ‘సాక్ష్యం’ భావాన్ని అతివ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: తన చేతిలో పట్టుకొని
  rationale: మూలంలోని ఏకవచన ‘చేతిలో’ అనే స్పష్టమైన చిత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יָדַע
  choice: తెలియలేదు
  rationale: నిరాకరణతో ఉన్న ידע కు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: קָרַן
  choice: ప్రకాశిస్తోందని
  rationale: ఈ సందర్భంలో కాంతిని లేదా కిరణాలను వెలువరించడం అనే భావాన్ని తెలుపుతుంది; ‘కొమ్ములు కలిగింది’ అనే చారిత్రక ప్రత్యామ్నాయం సందర్భానికి తక్కువ అనుకూలం.
- source_word: עוֹר פָּנָיו
  choice: తన ముఖచర్మం
  rationale: మూలంలో కేవలం ‘ముఖం’ కాక ‘ముఖపు చర్మం’ అని స్పష్టంగా ఉన్నందున దాన్ని నిలుపుతుంది.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: తనతో ఆయన మాట్లాడినందువల్ల
  rationale: בְּ + infinitive నిర్మాణానికి ఇక్కడ కారణార్థక పఠనం సందర్భోచితం; అయినా కాలార్థక పఠనం సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
- source_word: אִתּוֹ
  choice: తనతో ఆయన
  rationale: హీబ్రూలోని సర్వనామ స్వరూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్యంలో వక్త దేవుడని సందర్భం ద్వారా సూచించేందుకు గౌరవ ఏకవచన ‘ఆయన’ వాడబడింది.
theological_decisions:
- issue: మోషే ముఖానికి సంబంధించి קָרַן యొక్క అర్థం
  choice: ప్రకాశించడం
  alternative: కిరణాలను వెలువరించడం; కొమ్ములు కలిగి ఉండడం
  rationale: తదుపరి సందర్భం మోషే ముఖంపై కనిపించిన మహిమను వివరిస్తుంది. ‘ప్రకాశించడం’ సందర్భానికి సరిపోతూ తప్పుదారి పట్టించే శారీరక కొమ్ముల చిత్రాన్ని నివారిస్తుంది.
- issue: בְּדַבְּרוֹ యొక్క కారణార్థక లేదా కాలార్థక సంబంధం
  choice: ఆయన మాట్లాడినందువల్ల
  alternative: ఆయన మాట్లాడినప్పుడు
  rationale: సందర్భంలో మోషే ముఖప్రకాశం దేవునితో సంభాషణ ఫలితంగా కనిపిస్తుంది; అయితే హీబ్రూ నిర్మాణం కాలార్థాన్ని కూడా అనుమతిస్తుంది కాబట్టి దాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: אִתּוֹ లోని సర్వనామ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అని ఉంచడం
  alternative: ‘యెహోవా’ లేదా ‘దేవుడు’ అని స్పష్టీకరించడం
  rationale: సందర్భం సూచించే వ్యక్తి యెహోవాయే అయినా, హీబ్రూ మూలం నామాన్ని కాక సర్వనామాన్ని ఉపయోగిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో సర్వనామాన్ని నిలిపి, పాదటిప్పణిలో సూచనను స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని దిగివచ్చే చర్య పునరుక్తిని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం.
