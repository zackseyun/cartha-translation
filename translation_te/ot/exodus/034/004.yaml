  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: te
  text: అప్పుడు అతడు మొదటివాటివంటి రెండు రాతి పలకలను చెక్కాడు[a]. మోషే తెల్లవారుజామునే లేచి, యాహ్వే తనకు ఆజ్ఞాపించినట్టే సీనాయి కొండ ఎక్కాడు. అతడు ఆ రెండు రాతి పలకలను తన చేతిలో[b] తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోసి మలిచాడు’ లేదా ‘చెక్కి తయారుచేశాడు.’
    reason: פסל అనే క్రియ రాతిని కోసి లేదా చెక్కి ఆకారమివ్వడాన్ని సూచించగలదు.
  - marker: b
    text: హీబ్రూలో ‘తన చేతిలో’; ఈ ఏకవచన ప్రయోగం నుడికారంగా ఉండవచ్చు.
    reason: రెండు పలకలను ఒకే చేతిలో పట్టుకున్నాడని తప్పనిసరిగా నిర్ణయించకుండా మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: చెక్కాడు
  rationale: פסל ఇక్కడ రాతిని కోసి ఆకారమివ్వడాన్ని సూచిస్తుంది. ‘చెక్కాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, పలకలను రూపొందించిన స్పష్టమైన చర్యను నిలుపుతుంది.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: రెండు రాతి పలకలు
  rationale: నిబంధన పలకలకు స్పష్టమైన, ప్రామాణిక తెలుగు వ్యక్తీకరణ.
- source_word: כָּרִאשֹׁנִים
  choice: మొదటివాటివంటి
  rationale: సమానతను సూచించే כ మరియు మునుపటి పలకలను సూచించే רִאשֹׁנִים భావాలను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: ఉదయాన్నే లేవడం అనే హీబ్రూ నుడికారాన్ని, దానిలోని త్వరితకాల భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: సీనాయి కొండ ఎక్కాడు
  rationale: עלה లోని పైకి వెళ్లే కదలికను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: యెహోవా తనకు ఆజ్ఞాపించినట్టే
  rationale: మునుపటి ఆజ్ఞకు మోషే సరిగ్గా అనుగుణంగా ప్రవర్తించాడనే correspondence భావాన్ని నిలుపుతుంది.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: తన చేతిలో తీసుకున్నాడు
  rationale: హీబ్రూలోని ఏకవచన ‘చేతిలో’ను అలాగే నిలిపి, తెలుగులో సహజమైన నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం; సంఘటనల క్రమం, పునరుక్తి, మూలార్థం నిలిపాం.
