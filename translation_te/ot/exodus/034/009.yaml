source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ప్రభువా, నీ దృష్టిలో నాకు దయ లభించినట్లయితే, ప్రభువు దయచేసి మా మధ్య నడవాలి[a]. మేము మెడ వంచని ప్రజలమైనప్పటికీ[b], మా దోషాన్నీ మా పాపాన్నీ క్షమించి, మమ్మల్ని నీ స్వాస్థ్యంగా స్వీకరించు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మా మధ్య సంచరించాలి’; భావానువాదంగా ‘మాతో రావాలి.’ హీబ్రూ అక్షరార్థం ‘మా మధ్య నడవాలి.’
    reason: lexical_alternative
  - marker: b
    text: ‘అయినప్పటికీ’ అని సందర్భానుసారంగా అనువదించాం; హీబ్రూ పదాన్ని ‘ఎందుకంటే’ అని కూడా అనువదించవచ్చు.
    reason: ambiguity
  - marker: c
    text: లేదా ‘మమ్మల్ని నీ సొత్తుగా చేసుకో.’ హీబ్రూ క్రియ స్వాస్థ్యంగా లేదా సొత్తుగా తీసుకోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: దయ
  rationale: ‘నీ దృష్టిలో దయ లభించడం’ అనే హీబ్రూ సంబంధపూర్వక నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; తరువాతి కాలపు ప్రత్యేక సిద్ధాంతార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: בְּעֵינֶיךָ
  choice: నీ దృష్టిలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ కళ్లలో’; తెలుగులో అదే భావాన్ని సహజంగా తెలిపే స్థిర నుడికారం ‘నీ దృష్టిలో’.
- source_word: אֲדֹנָי
  choice: ప్రభువు / ప్రభువా
  rationale: ఇక్కడ ఇది యెహోవా అనే దైవనామం కాదు, సంబోధనాత్మక బిరుదు. మొదటి చోట సంబోధనగా ‘ప్రభువా’, రెండవ చోట మూలంలోని మూడవ పురుష నిర్మాణాన్ని నిలుపుతూ ‘ప్రభువు’ అని ఇచ్చాం.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: ప్రభువు దయచేసి మా మధ్య నడవాలి
  rationale: הלך మరియు בקרב కలిసి ప్రజల మధ్య దేవుని చలనమూ సన్నిధీ అనే చిత్రాన్ని ఇస్తాయి. ‘మాతో రావాలి’ కంటే ‘మా మధ్య నడవాలి’ మూలచిత్రాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: קְשֵׁה עֹרֶף
  choice: మెడ వంచని
  rationale: అక్షరార్థమైన ‘గట్టి మెడగల’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే రూపకంగా నిలుపుతుంది; కేవలం ‘మొండివారు’ అని చెప్పి చిత్రాన్ని తొలగించదు.
- source_word: עַם
  choice: ప్రజలు
  rationale: ఇక్కడ భౌగోళిక దేశం కంటే ఒడంబడిక సమాజమైన ఇశ్రాయేలును సూచిస్తుంది.
- source_word: עָוֹן
  choice: దోషం
  rationale: నైతిక అపరాధభారాన్ని తెలియజేస్తూ, వెంట వచ్చే חַטָּאת (‘పాపం’)తో కొంత పదభేదాన్ని కాపాడుతుంది.
- source_word: חַטָּאת
  choice: పాపం
  rationale: సాధారణమైన ప్రత్యక్ష సమానార్థకం; עָוֹןతో ఉన్న సమాంతరతలో సహజంగా ఉంటుంది.
- source_word: וּנְחַלְתָּנוּ
  choice: మమ్మల్ని నీ స్వాస్థ్యంగా స్వీకరించు
  rationale: దేవుడు ప్రజలను తన వారసత్వ భాగంగా లేదా సొత్తుగా తీసుకోవడం అనే ఒడంబడిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రార్థనలో אֲדֹנָי అనువాదం
  choice: ప్రభువా / ప్రభువు
  alternative: నా ప్రభువా / యెహోవా ప్రభువు
  rationale: మూలంలో దైవనామమైన יהוה కాక אֲדֹנָי అనే బిరుదే ఉంది. కాబట్టి దైవనామాన్ని చేర్చకుండా ‘ప్రభువు’ అనే బిరుదును నిలిపాం.
- issue: כִּי యొక్క సంబంధం
  choice: అయినప్పటికీ
  alternative: ఎందుకంటే / నిజానికి
  rationale: כִּי సాధారణంగా కారణార్థకంగా ఉండగలిగినా, ఈ ప్రార్థన సందర్భంలో ప్రజల మొండితనం దేవుడు వారి మధ్య ఉండడానికి అడ్డంకి అయినప్పటికీ క్షమించాలని మోషే వేడుకుంటున్న concessive భావం బలంగా ఉంది. మూలపదంలోని సాధ్యమైన కారణార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: וּנְחַלְתָּנוּ యొక్క ఒడంబడిక భావం
  choice: మమ్మల్ని నీ స్వాస్థ్యంగా స్వీకరించు
  alternative: మమ్మల్ని నీ సొత్తుగా చేసుకో
  rationale: ఇది భూసంబంధమైన వారసత్వాన్ని మాత్రమే కాక, దేవుడు ఇశ్రాయేలును తన ప్రత్యేక భాగంగా స్వీకరించడాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భావాన్ని అతిగా విశదీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన శైలి. ‘మెడ వంచని’ అనే సులభంగా గ్రహించగల రూపకాన్ని ఉంచి, అతిగా పురాతనమైన పదబంధాలను నివారించాం. మూలంలోని సంబోధన బిరుదు, దోషం–పాపం పదభేదం, స్వాస్థ్య భావం కాపాడబడ్డాయి.
