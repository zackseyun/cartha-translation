id: EXO.34.22
reference: Exodus 34:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: te
  text: గోధుమల కోతలోని ప్రథమఫలాల పండుగైన వారాల పండుగను నీవు ఆచరించాలి; సంవత్సరపు చక్రం తిరిగే సమయంలో పంట సమకూర్పు పండుగను కూడా ఆచరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంవత్సరం చివరలో.” హీబ్రూ పదబంధం అక్షరార్థంగా సంవత్సరపు తిరుగుదలను లేదా దాని చక్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: పండుగ
  rationale: యాత్రికులు కూడి ఆచరించే నిర్దిష్ట ఆరాధనా ఉత్సవాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పండుగ’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: שָׁבֻעֹת
  choice: వారాలు
  rationale: పండుగ పేరులోని హీబ్రూ అర్థాన్ని నేరుగా నిలుపుతుంది; తరువాతి కాలపు ‘పెంతెకొస్తు’ అనే పేరును మూలపాఠ్యంలోకి తీసుకురాదు.
- source_word: תַּעֲשֶׂה לְךָ
  choice: నీవు ఆచరించాలి
  rationale: అక్షరార్థంగా ‘నీ కోసం చేసుకోవాలి’; పండుగ సందర్భంలో ఇది పండుగను పాటించడం లేదా ఆచరించడం అనే భావం. తెలుగులో ‘ఆచరించాలి’ ఆజ్ఞను సహజంగా తెలియజేస్తుంది; לְךָ భావం కర్తను స్పష్టంగా ఉంచడం ద్వారా అతిగా పదానువాదం చేయకుండా ప్రతిబింబించబడింది.
- source_word: בִּכּוּרֵי
  choice: ప్రథమఫలాలు
  rationale: కోతలో మొదట లభించి అర్పించబడే ఫలాన్ని సూచించే ఖచ్చితమైన ఆరాధనా పదం.
- source_word: קְצִיר חִטִּים
  choice: గోధుమ కోత
  rationale: గోధుమలను కోయడం లేదా వాటి పంటకాలాన్ని సూచించే సమాసాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הָאָסִיף
  choice: పంట సమకూర్చడం
  rationale: పొలాల దిగుబడిని లోపలికి చేర్చి సమకూర్చే కాలాన్ని సూచిస్తుంది. ‘పంట సమకూర్చే పండుగ’ సాధారణ పాఠకులకు అర్థమయ్యేలా పండుగ స్వభావాన్ని వెల్లడిస్తుంది.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: సంవత్సరం మలుపులో
  rationale: సంవత్సరపు తిరుగు లేదా ఋతుచక్రంలోని మలుపును ప్రతిబింబిస్తుంది; తప్పనిసరిగా చివరి క్యాలెండర్ దినాన్ని సూచించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని రెండు పండుగల సమాంతర నిర్మాణాన్ని స్పష్టంగా చూపేందుకు రెండవ వాక్యంలో ‘అలాగే’ మరియు సందర్భానుసారంగా ‘ఆచరించాలి’ పునరుక్తం చేయబడ్డాయి. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] గుర్తు ‘వారాల పండుగ’ తరువాత ఉన్నప్పటికీ, దాని గమనిక תְּקוּפַת הַשָּׁנָה గురించి కావడంతో తెలుగులో సంబంధిత ‘సంవత్సరం మలుపులో’ తరువాత ఉంచబడింది.
