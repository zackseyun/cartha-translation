id: EXO.34.1
reference: Exodus 34:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה פְּסָל לְ/ךָ֛ שְׁנֵֽי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וְ/כָתַבְתִּי֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “మొదటి పలకలలాంటి రెండు రాతి పలకలను నీ కోసం చెక్కు[a]. నీవు పగులగొట్టిన మొదటి పలకల మీద ఉన్న మాటలను నేను ఈ పలకల మీద రాస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీ కోసం రెండు రాతి పలకలను తొలిచి తయారుచేయి.”'
    reason: פְּסָל అనే క్రియ రాతిని కోసి, తొలిచి లేదా చెక్కి ఆకారంలోకి తేవడాన్ని సూచించగలదు.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణ ప్రవేశంతో వ్యక్తపరుస్తుంది.
- source_word: פְּסָל
  choice: చెక్కు
  rationale: రాతిని మలిచి పలకలు సిద్ధం చేయాలనే ఆజ్ఞను ‘చెక్కు’ సహజంగా తెలియజేస్తుంది; ఇది అలంకార చెక్కడాన్ని తప్పనిసరిగా సూచించదు.
- source_word: לְךָ
  choice: నీ కోసం
  rationale: మోషే స్వయంగా తన కోసం పలకలను సిద్ధం చేయాలనే దత్తార్థక సర్వనామాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: రెండు రాతి పలకలు
  rationale: వస్తువు, పదార్థం రెండింటినీ స్పష్టంగా తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כָּרִאשֹׁנִים
  choice: మొదటివాటిలాంటి
  rationale: మునుపటి పలకలతో పోలికను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְכָתַבְתִּי
  choice: నేను ... రాస్తాను
  rationale: మొదటి పురుష భవిష్య క్రియను దేవుని వాగ్దానంగా నేరుగా అందిస్తుంది.
- source_word: עַל הַלֻּחֹת
  choice: ఈ పలకల మీద
  rationale: శాసనం వ్రాయబడే ఉపరితలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఈ’ అనేది కొత్తగా సిద్ధం చేయబోయే పలకల సూచనను స్పష్టం చేస్తుంది.
- source_word: הַדְּבָרִים
  choice: మాటలు
  rationale: హీబ్రూ పదం యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; సందర్భార్థాన్ని ముందుగానే ‘ఆజ్ఞలు’గా వ్యాఖ్యానించదు.
- source_word: אֲשֶׁר הָיוּ עַל הַלֻּחֹת הָרִאשֹׁנִים
  choice: మొదటి పలకల మీద ఉన్న
  rationale: తిరిగి వ్రాయబోయే మాటలను గుర్తించే సంబంధవాక్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: నువ్వు పగులగొట్టిన
  rationale: שבר యొక్క సాధారణ అర్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; ‘ముక్కలు చేసిన’ కంటే తటస్థంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలిని వాడాం. దేవుడు మోషేతో నేరుగా మాట్లాడుతున్న సందర్భంలో సహజమైన ఏకవచన ‘నువ్వు’ రూపాన్ని ఉంచాం. మూలంలోని ‘మాటలు’ అనే విస్తృత పదాన్ని ‘ఆజ్ఞలు’గా సంకుచితం చేయలేదు.
