  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: te
  text: బదులుగా[a] మీరు వారి బలిపీఠాలను పడగొట్టాలి, వారి పూజా స్తంభాలను ముక్కలు చేయాలి, వారి అషేరా స్తంభాలను[b] నరికివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే మీరు వారి బలిపీఠాలను పడగొట్టాలి…” హెబ్రీ సంధిపదానికి “ఎందుకంటే” అనే అర్థం కూడా రావచ్చు; అయితే ఇక్కడ ముందటి నిషేధానికి విరుద్ధంగా చేయవలసిన చర్యను సూచించే భావం సందర్భానికి సహజంగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: “అషేరా స్తంభాలు” అంటే అషేరాతో సంబంధమున్న పూజా వస్తువులు. వాటిని “అషేరీమ్” అని కూడా పిలవవచ్చు; వాటి ఖచ్చిత రూపం నిర్ధారితం కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: దానికి బదులుగా
  rationale: ముందటి వచనంలోని నిషేధానికి విరుద్ధంగా ఇశ్రాయేలీయులు చేయవలసిన చర్యను ఇది సూచిస్తుంది. హెబ్రీ సంధిపదానికి ‘ఎందుకంటే’ అనే అర్థమూ సాధ్యమే; ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִזְבְּחֹתָם
  choice: వారి బలిపీఠాలను
  rationale: ఆరాధనా సందర్భంలోని מִזְבֵּחַ పదానికి సహజమైన ప్రామాణిక తెలుగు రూపం; బహువచనాన్ని, తృతీయ పురుష బహువచన సంబంధాన్ని నిలుపుతుంది.
- source_word: תִּתֹּצוּן
  choice: పడగొట్టాలి
  rationale: נתץ నిర్మాణాలను కూల్చడం లేదా పడగొట్టడం అనే బలమైన చర్యను సూచిస్తుంది; బలిపీఠాల సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: מַצֵּבֹתָם
  choice: వారి పూజా స్తంభాలను
  rationale: מַצֵּבָה నిలబెట్టిన రాతి పూజా చిహ్నాన్ని సూచిస్తుంది. ‘పూజా స్తంభాలు’ దాని ఆరాధనా స్వభావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; అవి తప్పనిసరిగా నిర్మాణ స్తంభాలు కావు.
- source_word: תְּשַׁבֵּרוּן
  choice: ముక్కలు చేయాలి
  rationale: שׁבר పియేల్ రూపం బలంగా పగులగొట్టడాన్ని సూచిస్తుంది; ‘ముక్కలు చేయాలి’ ఆ తీవ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֵׁרָיו
  choice: వారి అషేరా స్తంభాలను
  rationale: ఈ పదం అషేరాతో సంబంధమున్న పూజా వస్తువులను సూచిస్తుంది. ‘అషేరా స్తంభాలు’ వ్యక్తినామ సంబంధాన్ని, భౌతిక పూజా వస్తువు భావాన్ని రెండింటినీ నిలుపుతుంది; ఖచ్చితమైన రూపంపై ఉన్న అనిశ్చితిని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: תִּכְרֹתוּן
  choice: నరికివేయాలి
  rationale: כרת ఇక్కడ అషేరా పూజా వస్తువులను నరికి తొలగించడాన్ని సూచిస్తుంది; ఇది అవి చెక్కతో లేదా వృక్షరూపంతో సంబంధమున్నవని సూచించే క్రియకు తగిన తెలుగు.
theological_decisions:
- issue: אֲשֵׁרָיו యొక్క నిర్దిష్ట సూచన
  choice: అషేరాతో సంబంధమున్న పూజా వస్తువులు—‘అషేరా స్తంభాలు’
  alternative: ‘అషేరీమ్’ అని లిప్యంతరీకరించడం, లేదా అషేరా ప్రతిమలు/పూజా చిహ్నాలు అని అనువదించడం
  rationale: వచనం నాశనం చేయవలసిన భౌతిక పూజా వస్తువులను వరుసగా పేర్కొంటుంది; ‘నరికివేయాలి’ అనే క్రియ చెక్క లేదా వృక్ష సంబంధమైన వస్తువులను సూచిస్తుంది. అయినా ఆ వస్తువుల ఖచ్చిత రూపం నిర్ధారితం కానందున పాదటిప్పణిలో విస్తృత అర్థాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ఆజ్ఞారూపాన్ని వాడాం. మూడు సమాంతర క్రియలను ‘పడగొట్టాలి… ముక్కలు చేయాలి… నరికివేయాలి’గా నిలిపి హెబ్రీ వాక్యంలోని లయను కాపాడాం.
