  naturalness: వాక్యనిర్మాణం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంది. ‘శిక్షించకుండా మాత్రం విడిచిపెట్టడు’ మరియు ‘లెక్క అడుగుతాడు’ రెండూ సందర్భానికి తగిన సులభమైన న్యాయసంబంధ భాషను ఇస్తాయి.
