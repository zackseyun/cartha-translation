id: EXO.34.7
reference: Exodus 34:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: te
  text: వేలమందికి[a] అచంచల ప్రేమను నిలుపుతూ, దోషాన్ని, అతిక్రమాన్ని, పాపాన్ని క్షమిస్తూ ఉంటాడు. అయితే శిక్షించకుండా మాత్రం విడిచిపెట్టడు[b]. తండ్రుల దోషాన్ని బట్టి పిల్లలనూ, పిల్లల పిల్లలనూ[c] మూడో, నాలుగో తరం వరకు లెక్క అడుగుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేల తరాల వరకు.’ హీబ్రూలో అక్షరార్థంగా ‘వేలకు’ అని మాత్రమే ఉంది. ఇది దేవుని దీర్ఘకాల అచంచల ప్రేమను ‘మూడో, నాలుగో తరం వరకు’ ఉన్న తీర్పుతో పోల్చుతున్నట్లు ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఎంతమాత్రమూ నిర్దోషిగా ఎంచడు’; లేదా, ‘తప్పకుండా శిక్షిస్తాడు.’ హీబ్రూ నిర్మాణం నిరాకరణను బలంగా నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘కుమారులు, కుమారుల కుమారులు’ అనే పురుషలింగ రూపాలు ఉన్నాయి; సందర్భంలో భావం తరతరాల సంతానం.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: నిలుపుతూ
  rationale: ఈ కృదంతం కాపాడటం, కొనసాగించడం అనే భావాలను వ్యక్తం చేస్తుంది. ప్రేమను నిరంతరం చూపడం అనే భావంలో ‘నిలుపుతూ’ సహజంగా ఉంది.
- source_word: חֶסֶד
  choice: అచంచల ప్రేమ
  rationale: ప్రేమతోపాటు స్థిరమైన నమ్మకత్వాన్ని కూడా సూచించే ఈ గంభీర పదానికి, సాధారణ పాఠకులకు అర్థమయ్యేలా ‘అచంచల ప్రేమ’ అని అనువదించాం.
- source_word: לָאֲלָפִים
  choice: వేలమందికి
  rationale: హీబ్రూ వాక్యంలో ‘వేలకు’ అని మాత్రమే ఉంది; ‘తరాలు’ అని స్పష్టంగా లేదు. తెలుగులో వ్యక్తులను సూచించే సహజ రూపాన్ని వాడినా, తరాల భావం ఉండగలదని పాదటిప్పణిలో ఉంచాం.
- source_word: נֹשֵׂא
  choice: క్షమిస్తూ
  rationale: మూల అర్థం ‘మోయడం’ అయినా, దోషం మొదలైన పదాలతో కలిసినప్పుడు క్షమించడం అనే నుడికారార్థం వస్తుంది.
- source_word: עָוֺן
  choice: దోషం
  rationale: ఈ పదం తప్పును, దానివల్ల కలిగే అపరాధభారాన్ని లేదా పర్యవసానాన్ని సూచించగలదు. ‘దోషం’ ఆ విస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: פֶשַׁע
  choice: అతిక్రమం
  rationale: హద్దు మీరడం, తిరుగుబాటు చేయడం అనే భావాలు ఇందులో ఉన్నాయి; మూడు పాపపదాల వరుసలో ‘అతిక్రమం’ సరిపోతుంది.
- source_word: חַטָּאָה
  choice: పాపం
  rationale: సూటిగా, సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: అయితే శిక్షించకుండా మాత్రం విడిచిపెట్టడు
  rationale: హీబ్రూలోని బలమైన నిరాకరణను ‘మాత్రం ... విడిచిపెట్టడు’ తెలియజేస్తుంది. మూలంలో స్పష్టంగా లేని ‘దోషిని’ అనే కర్మను ప్రధాన పాఠంలో చేర్చకుండా, న్యాయసంబంధ భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: פֹּקֵד
  choice: లెక్క అడుగుతాడు
  rationale: ఈ క్రియకు పట్టించుకోవడం, విచారించడం, చర్య తీసుకోవడం వంటి విస్తృత భావాలు ఉన్నాయి. తీర్పు సందర్భంలో ‘లెక్క అడుగుతాడు’ బాధ్యతను సూచిస్తూనే ‘శిక్షిస్తాడు’ అనే ఒక్క అర్థానికే పరిమితం చేయదు.
- source_word: עֲוֺן אָבוֹת
  choice: తండ్రుల దోషం
  rationale: మూలంలోని పురుషలింగ బహువచనాన్ని యథాతథంగా నిలిపి, ముందటి עָוֺןకు వాడిన ‘దోషం’తో పదసామ్యాన్ని కాపాడాం.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: పిల్లలనూ, పిల్లల పిల్లలనూ
  rationale: తరతరాల సంతానాన్ని సూచించే సహజ ఆధునిక తెలుగు రూపం; హీబ్రూ రూపం వ్యాకరణపరంగా పురుషలింగంలో ఉందని పాదటిప్పణి వివరిస్తుంది.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: మూడో, నాలుగో తరం వరకు
  rationale: హీబ్రూలో ‘తరం’ అధ్యాహారంగా ఉంది. కుటుంబ వరుస వల్ల స్పష్టమైన ఆ పదాన్ని తెలుగులో ఒకసారి చేర్చడం భావాన్ని సహజంగా చేస్తుంది.
theological_decisions:
- issue: దైవ క్షమాపణకూ న్యాయానికీ మధ్య ఉన్న ఉద్రిక్తత
  choice: పాపాలను పూర్తిగా క్షమిస్తాడనే వాక్యాన్నీ, శిక్షించకుండా విడిచిపెట్టడనే బలమైన నిరాకరణనూ రెండింటినీ నిలిపాం.
  alternative: ‘దోషిని ఎంతమాత్రమూ నిర్దోషిగా ఎంచడు’ అని మరింత న్యాయస్థాన భాషలో అనువదించడం.
  rationale: వాక్యం కరుణను, న్యాయాన్ని పక్కపక్కనే ఉంచుతుంది. ఒకదానితో మరొకదాన్ని తగ్గించి చెప్పకుండా ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: לָאֲלָפִיםలో ‘తరాలు’ అని స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠంలో ‘వేలమందికి’ అని ఉంచి, తరాల పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
  alternative: ‘వెయ్యి తరాల వరకు’ లేదా ‘వేల తరాల వరకు’.
  rationale: ఈ వాక్యంలో ‘తరాలు’ అనే నామవాచకం ప్రత్యక్షంగా లేదు. సమాంతర వాక్యాల పదాలను ఇక్కడికి దిగుమతి చేయకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
- issue: పూర్వీకుల దోషం తరువాతి తరాలపై విచారించబడటం
  choice: ‘దోషాన్ని బట్టి ... లెక్క అడుగుతాడు’ అని అనువదించాం.
  alternative: ‘దోషానికి శిక్షను ... మీదికి రప్పిస్తాడు’ లేదా ‘దోషాన్ని ... మీద మోపుతాడు’.
  rationale: פּקד యొక్క విస్తృతిని నిలిపి, వారసత్వ అపరాధం గురించి మూలం చెప్పినదానికంటే నిర్దిష్టమైన సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదాలను వాడాం. అతిగా ప్రాచీనమైన ‘కృపాతిశయం’, ‘అపరాధము’, ‘దర్శించుట’ వంటి రూపాలను నివారించాం; మూలంలోని కరుణ–న్యాయం ఉద్రిక్తతను సరళీకరించలేదు.
