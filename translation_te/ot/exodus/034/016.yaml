  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: te
  text: నీవు అతని కుమార్తెలలో కొందరిని నీ కుమారుల కోసం తీసుకుంటావు; అతని కుమార్తెలు తమ దేవుళ్ల వెంట వ్యభిచరిస్తారు[a], తమ దేవుళ్ల వెంట నీ కుమారులను కూడా వ్యభిచరింపజేస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వేశ్యలా ప్రవర్తిస్తారు’ అని కూడా అనువదించవచ్చు. ఇతర దేవుళ్ల వెంట వెళ్లడాన్ని హెబ్రీ పాఠం లైంగిక అవిశ్వాస భాషతో రూపకంగా వర్ణిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ కుమార్తెలు తమ దేవుళ్లను అనుసరించేలా నీ కుమారులను ప్రేరేపించి, వారిని విగ్రహారాధనలోకి నడిపిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: అప్పుడు నీవు ... తీసుకుంటావు
  rationale: సంయోజకంతో వచ్చిన Qal పరిపూర్ణ రూపం ఈ హెచ్చరికల క్రమంలో భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. ‘పెళ్లి చేసుకుంటావు’ అనడం సందర్భార్థాన్ని నేరుగా చేర్చుతుంది కాబట్టి, మూలంలోని ‘తీసుకోవడం’ భావాన్ని నిలిపాం.
- source_word: מִבְּנֹתָיו
  choice: అతని కుమార్తెలలో కొందరిని
  rationale: מִן యొక్క విభాగార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבָנֶיךָ
  choice: నీ కుమారుల కోసం
  rationale: వివాహ ఏర్పాట్ల సందర్భంలో לְ సూచించే ప్రయోజనం/గమ్య సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְזָנוּ
  choice: వ్యభిచారం చేస్తారు
  rationale: విగ్రహారాధనను సూచించే లైంగిక అవిశ్వాస రూపకాన్ని ‘విగ్రహారాధన చేస్తారు’ అని చదును చేయకుండా నిలుపుతుంది.
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: తమ దేవుళ్ల వెంట వెళ్లి
  rationale: ఇతర దేవుళ్లను అనుసరించడాన్ని సూచించే హెబ్రీయ ‘వెంట’ రూపకాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది.
- source_word: וְהִזְנוּ
  choice: వ్యభిచారం చేసేలా చేస్తారు
  rationale: Hiphil రూపంలోని కారణార్థక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת בָּנֶיךָ
  choice: నీ కుమారులను
  rationale: ప్రత్యక్ష కర్మను, రెండవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని యథార్థంగా అనువదిస్తుంది.
- source_word: אֱלֹהֵיהֶן
  choice: ఆ దేవుళ్ల
  rationale: స్త్రీల దేవుళ్లనే మళ్లీ సూచిస్తున్న సంగతి తెలుగులో సందిగ్ధం కాకుండా ‘ఆ దేవుళ్ల’ అని తెలిపింది; బహువచన భావం నిలిచింది.
theological_decisions:
- issue: విగ్రహారాధన సందర్భంలో זנה అనువాదం
  choice: ‘వ్యభిచారం చేస్తారు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘విగ్రహారాధన చేస్తారు’ లేదా ‘నమ్మకద్రోహం చేస్తారు’
  rationale: హెబ్రీ పాఠం ఒడంబడికపరమైన, ఆరాధనాపరమైన ద్రోహాన్ని లైంగిక అవిశ్వాస భాషలో ఉద్దేశపూర్వకంగా చిత్రిస్తుంది. ఆ రూపకాన్ని నిలపడం హెచ్చరికలోని దైవశాస్త్రీయ తీవ్రతను కాపాడుతుంది.
- issue: בנותיו / בניך లోని లింగనిర్దిష్ట భాష
  choice: ‘కుమార్తెలు’, ‘కుమారులు’
  alternative: ‘పిల్లలు’ లేదా ‘సంతానం’
  rationale: వివాహ సందర్భంలో మూలపాఠం కుమార్తెలను, కుమారులను ప్రత్యేకంగా పేర్కొంటుంది; అందువల్ల లింగనిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని కారణ–ఫలిత క్రమం, కుమార్తెలు/కుమారులు అనే లింగనిర్దిష్ట పదాలు, అలాగే זנה యొక్క ఉద్దేశపూర్వక లైంగిక-అవిశ్వాస రూపకం నిలుపబడ్డాయి.
