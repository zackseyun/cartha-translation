id: EXO.34.34
reference: Exodus 34:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: te
  text: కానీ మోషే యాహ్వే సన్నిధిలోకి ఆయనతో మాట్లాడడానికి వెళ్లినప్పుడల్లా, బయటికి వచ్చేవరకు తన ముఖముసుగును తీసివేసేవాడు. ఆ తరువాత అతడు బయటికి వచ్చి, తనకు ఆజ్ఞాపించబడినదానిని ఇశ్రాయేలు కుమారులకు చెప్పేవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹא
  choice: వెళ్లినప్పుడల్లా
  rationale: ב + infinitive construct recurring circumstanceను సూచిస్తోంది; సందర్భంలోని అలవాటుగా పునరావృతమైన చర్యను ‘వెళ్లినప్పుడల్లా’ సహజంగా తెలియజేస్తుంది. וְ మునుపటి వాక్యంతో స్వల్ప వ్యత్యాసాన్ని చూపేందుకే ‘కానీ’ వాడబడింది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా ... ఆయన సన్నిధిలోకి
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’; వెళ్లడం అనే క్రియతో ‘సన్నిధిలోకి’ సహజమైన తెలుగు. יְהוָה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לְדַבֵּר אִתּוֹ
  choice: యెహోవాతో మాట్లాడడానికి
  rationale: లక్ష్యార్థక infinitiveను ‘మాట్లాడడానికి’గా, אִתּוֹలోని పరస్పర సంభాషణ భావాన్ని ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: יָסִיר אֶת הַמַּסְוֶה
  choice: తన ముఖముసుగును తీసివేసేవాడు
  rationale: Imperfect ఇక్కడ అలవాటుగా జరిగే గత చర్యను సూచిస్తుంది. מַסְוֶה మోషే ముఖాన్ని కప్పిన వస్తువు కాబట్టి స్పష్టమైన ఆధునిక తెలుగులో ‘ముఖముసుగు’ అని అనువదించాం.
- source_word: עַד צֵאתוֹ
  choice: బయటికి వచ్చేవరకు
  rationale: עַד + infinitive construct మోషే బయటికి వచ్చేంతవరకు కొనసాగే కాలపరిమితిని సూచిస్తుంది.
- source_word: וְיָצָא וְדִבֶּר
  choice: ఆ తరువాత అతడు బయటికి వచ్చి ... తెలియజేసేవాడు
  rationale: ఈ క్రియలు పునరావృతమైన క్రమాన్ని కొనసాగిస్తున్నాయి. ‘ఆ తరువాత’ క్రమాన్ని, ‘తెలియజేసేవాడు’ ఇశ్రాయేలుకు ఆజ్ఞను ప్రకటించే భావాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులకు’ అయినా, ఇది మొత్తం ఒడంబడిక సమాజాన్ని సూచించే స్థిర హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ లింగపరంగా అనవసరంగా పరిమితం చేయకుండా ఉద్దేశిత సమూహాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: తనకు ఆజ్ఞాపించబడినదాన్ని
  rationale: Pual passive మోషే స్వీకరించిన ఆజ్ఞను సూచిస్తుంది; తరువాత అతడు దానిని ప్రజలకు తెలియజేశాడు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: పదబంధం వ్యాకరణపరంగా పుంలింగమైనా, సందర్భంలో అది ఒడంబడిక సమాజాన్ని సమష్టిగా సూచిస్తుంది. ‘ప్రజలు’ ఆ సందర్భార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; పదశః రూపాన్ని ప్రత్యామ్నాయంగా గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యంలోని పునరావృత చర్యల భావాన్ని ‘వెళ్లినప్పుడల్లా’, ‘తీసివేసేవాడు’, ‘తెలియజేసేవాడు’ ద్వారా నిలిపాం. ప్రధాన పాఠంలో ‘యెహోవా’ వాడి, మూల దైవనామాన్ని వ్యక్తినామంగానే సంరక్షించాం.
