source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: te
  text: ఎందుకంటే నీవు మరొక దేవునికి సాష్టాంగ నమస్కారం చేయకూడదు[a]; యాహ్వే పేరు అసూయాపరుడు[b], ఆయన అసూయగల దేవుడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరొక దేవుణ్ణి ఆరాధించకూడదు.’ హీబ్రూ క్రియ అక్షరార్థంగా వంగి నమస్కరించడం లేదా సాష్టాంగ నమస్కారం చేయడాన్ని సూచిస్తుంది; అది తరచుగా ఆరాధనా చర్యగా ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్యనిర్మాణం: ‘యాహ్వే—అసూయాపరుడు ఆయన పేరు—ఆయన అసూయగల దేవుడు.’'
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘అసూయగల’ అనేది పాపపూరితమైన ఈర్ష్యను కాదు; తన ప్రజల ఆరాధనపై యాహ్వేకు ఉన్న ప్రత్యేక నిబంధన హక్కును, ప్రత్యర్థి ఆరాధనను ఆయన సహించకపోవడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: సాష్టాంగపడకూడదు
  rationale: שׁחה అనే క్రియ ఆరాధనలో వంగి నమస్కరించడం లేదా సాష్టాంగపడడం అనే దృశ్యమైన చర్యను సూచిస్తుంది. ‘ఆరాధించకూడదు’ కంటే ఈ అనువాదం మూలంలోని స్పష్టమైన శారీరక చర్యను నిలుపుతుంది.
- source_word: לְאֵל אַחֵר
  choice: వేరొక దేవునికి
  rationale: אֵל అంటే ‘దేవుడు,’ אַחֵר అంటే ‘వేరొక/ఇతర.’ అందువల్ల ఇది నేరుగా మూలపాఠాన్ని ప్రతిబింబిస్తుంది; ‘అన్యదేవుడు’ అనే పదం సందర్భంలో సరిపోయినా ‘విదేశీ’ అనే అదనపు భావాన్ని కలిగించవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: קַנָּא
  choice: రోషంగలవాడు / రోషంగల
  rationale: קַנָּא ఇక్కడ తన ప్రజల ఆరాధనపై యెహోవాకు ఉన్న ప్రత్యేకమైన హక్కును, ప్రత్యర్థి ఆరాధనను సహించకపోవడాన్ని సూచిస్తుంది. పేరుగా వచ్చినప్పుడు ‘రోషంగలవాడు,’ గుణవాచకంగా వచ్చినప్పుడు ‘రోషంగల’ అని ఇచ్చి హీబ్రూ పునరుక్తిని నిలిపాం.
- source_word: שְׁמוֹ
  choice: పేరు
  rationale: ‘రోషంగలవాడు ఆయన పేరు’ అనే హీబ్రూ నామకరణ వాక్యాన్ని సహజమైన తెలుగులో ‘యెహోవా పేరు రోషంగలవాడు’గా అందించాం.
- source_word: אֵל קַנָּא הוּא
  choice: ఆయన రోషంగల దేవుడు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామాన్ని ‘ఆయన’గా స్పష్టంగా ఉంచి, ముందున్న దైవనామాన్ని ఈ వాక్యభాగం వివరిస్తుందనే నిర్మాణాన్ని కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామంగానే ఉంచాం; ఆధునిక తెలుగులో సాధారణ పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: קַנָּאను దైవనామంగానూ గుణంగానూ అనువదించడం
  choice: రోషంగలవాడు / రోషంగల
  alternative: అసూయగలవాడు / ఉత్సాహంగలవాడు
  rationale: ‘అసూయ’ ఆధునిక తెలుగులో తరచుగా పాపపూరితమైన ఈర్ష్యను సూచించవచ్చు; ‘ఉత్సాహం’ మాత్రం ప్రత్యర్థి ఆరాధనను సహించని నిబంధనాత్మక ప్రత్యేక హక్కును బలహీనపరుస్తుంది. ‘రోషం’ ఈ సందర్భంలోని తీవ్రతను మెరుగ్గా మోస్తుంది; దాని ఉద్దేశాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ఏకవచన సంబోధనకు ‘నీవు’ను నిలిపాం. మూలంలోని concrete worship gesture, దైవనామం, అలాగే קַנָּא పదపు నామ–గుణ పునరుక్తిని సాధ్యమైనంత స్పష్టంగా కాపాడాం.
