lexical_decisions:
- source_word: וַיְמַהֵר
  choice: వెంటనే
  rationale: מהר త్వరపడి, ఆలస్యం చేయకుండా కార్యం చేయడాన్ని సూచిస్తుంది. సందర్భంలో మోషే తక్షణ స్పందనను సహజమైన ఆధునిక తెలుగులో ‘వెంటనే’ తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיִּקֹּד
  choice: వంగి
  rationale: קדד శరీరాన్ని కిందికి వంచడాన్ని సూచిస్తుంది. తరువాతి క్రియతో కలిపి ‘నేలవరకు వంగి నమస్కరించాడు’ అనడం రెండు క్రియల క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: אַרְצָה
  choice: నేలవరకు
  rationale: దిశను సూచించే రూపం కిందికి, నేలవైపు జరిగిన కదలికను తెలియజేస్తుంది; ‘నేలవరకు’ ఆ భంగిమను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁתָּחוּ
  choice: నమస్కరించాడు
  rationale: שחה యొక్క ఈ రూపం భక్తిపూర్వకంగా సాగిలపడటం లేదా ఆరాధనలో నమస్కరించడాన్ని సూచించగలదు. ‘నమస్కరించాడు’ శారీరక చర్యనూ భక్తిపూర్వక గౌరవాన్నీ ఉద్దేశపూర్వకంగా కలిపి ఉంచుతుంది.
theological_decisions:
- issue: చివరి క్రియను కేవలం శారీరకంగా సాగిలపడటంగా అనువదించాలా, ఆరాధనగా అనువదించాలా
  choice: నమస్కరించాడు
  alternative: ఆరాధించాడు; సాగిలపడ్డాడు
  rationale: యెహోవా స్వయంప్రకటనకు మోషే స్పందిస్తున్నందున క్రియకు ఆరాధనా భావం ఉంది; అయితే హీబ్రూ పదం శారీరక సాగిలపడటాన్నీ సూచిస్తుంది. ‘నమస్కరించాడు’ ఈ రెండు భావాల మధ్యనున్న నిజమైన అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గంభీరతను నిలుపుతూ సంక్షిప్త వాక్య నిర్మాణం వాడబడింది. ‘వెంటనే’ తక్షణ స్పందనను, ‘నేలవరకు వంగి నమస్కరించాడు’ శరీర భంగిమతో కూడిన భక్తిపూర్వక చర్యను తెలియజేస్తుంది.
