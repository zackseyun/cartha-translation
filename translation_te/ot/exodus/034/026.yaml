source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: te
  text: నీ నేలలో పండిన ప్రథమ ఫలాలలో మొదటి భాగాన్ని నీ దేవుడైన యాహ్వే గృహానికి తీసుకురావాలి.[a] మేకపిల్లను దాని తల్లి పాలలో ఉడకబెట్టకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొదటి భాగాన్ని’ అనే పదబంధాన్ని ‘శ్రేష్ఠమైన భాగాన్ని’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: రֵאשִׁית ప్రధానంగా మొదటి భాగాన్ని సూచిస్తుంది; అయితే ప్రథమఫలాల సందర్భంలో ఉత్తమమైన/ఎంపికైన భాగమనే ఛాయ కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ప్రథమ ఫలాల్లో మొదటివాటిని
  rationale: רֵאשִׁית యొక్క ప్రాథమిక భావమైన ‘మొదటి భాగం’ను, బִּכּוּרֵי అనే అర్పణకు సంబంధించిన ‘ప్రథమ ఫలాలు’తో కలిపి ప్రతిబింబిస్తుంది. మూలంలోని పునరుక్తి భావాన్ని పూర్తిగా తొలగించకుండా సహజమైన తెలుగులో చెబుతుంది.
- source_word: אַדְמָתְךָ
  choice: నీ భూమి
  rationale: ఇక్కడ పదం పంటను పండించే నేల/భూమిని సూచిస్తుంది; ‘నీ భూమి’ సాధారణ పాఠకులకు సహజంగా ఉండి వ్యవసాయ సందర్భాన్ని నిలుపుతుంది.
- source_word: תָּבִיא
  choice: తీసుకురావాలి
  rationale: న్యాయవాక్యంలోని ఆజ్ఞార్థక అసంపూర్ణ క్రియను ఆధునిక తెలుగు నియమ భాషలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే గృహానికి
  rationale: בֵּית అనే ‘గృహం’ భావాన్ని నిలుపుతూ, తరువాతి కాలపు నిర్మిత దేవాలయాన్ని అనవసరంగా సూచించే ‘మందిరం’ను నివారిస్తుంది. יְהוָהను వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
- source_word: לֹא תְבַשֵּׁל
  choice: ఉడకబెట్టకూడదు
  rationale: בשל ఇక్కడ ఉడకబెట్టడం/వండడం అనే భావం కలిగివుంది; పాలలో చేయబడే క్రియకు ‘ఉడకబెట్టు’ మరింత నిర్దిష్టం, మరియు నిషేధాన్ని ఆధునిక తెలుగు న్యాయశైలిలో తెలియజేస్తుంది.
- source_word: גְּדִי
  choice: మేకపిల్లను
  rationale: పిల్లమేకను సూచించే పదానికి స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: దాని తల్లి పాలలో
  rationale: హీబ్రూ సంబంధాన్ని మరియు స్పష్టమైన చిత్రాన్ని సహజమైన తెలుగు పదక్రమంలో యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న దైవ వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: మేకపిల్లను తల్లి పాలలో ఉడకబెట్టకూడదనే నిషేధం యొక్క పరిధి
  choice: మూలంలోని నిర్దిష్ట నిషేధాన్నే అనువదించడం
  alternative: అన్ని మాంసం-పాల కలయికలను నిషేధిస్తున్నట్లు విస్తరించడం
  rationale: వాక్యం చెప్పిన స్పష్టమైన చర్యను మాత్రమే అందిస్తుంది; దాని వెనుక కారణాన్ని గానీ, తరువాత ఏర్పడిన విస్తృత ఆచార ప్రయోగాన్ని గానీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నియమశైలిని ఉపయోగించాం. ‘తీసుకురావాలి’, ‘ఉడకబెట్టకూడదు’ రూపాలు స్పష్టంగా ఉండి అతి ప్రాచీన శైలిని నివారిస్తాయి. ‘యాహ్వే గృహం’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘మందిరం’ అనే చారిత్రకంగా మరింత నిర్దిష్ట పదాన్ని ఉపయోగించలేదు.
