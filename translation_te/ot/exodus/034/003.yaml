translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞాత్మక నిషేధాలను సహజమైన ‘కూడదు’ రూపంతో వ్యక్తపరిచాం. గంభీరతను నిలుపుతూ సామాన్య పాఠకులకు స్పష్టంగా ఉండే పదజాలాన్ని వాడాం. మూలంలోని మూడు నిషేధాలను వేర్వేరు వాక్యాలుగా ఇచ్చి స్పష్టత పెంచాం.
