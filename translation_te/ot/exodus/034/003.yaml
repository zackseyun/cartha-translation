- from: నీతో పాటు ఎవరూ పైకి ఎక్కకూడదు[a]. అంతేకాదు, ఆ కొండలో ఎక్కడా ఎవరూ కనిపించకూడదు[b]. గొర్రెల మందలుగానీ పశువుల మందలుగానీ ఆ కొండ ఎదురుగా మేయకూడదు.
  to: నీతో పాటు ఎవరూ పైకి ఎక్కకూడదు[a]. అంతేకాదు, ఆ కొండలో ఎక్కడా ఎవరూ కనిపించకూడదు[b]. గొర్రెల మందలూ పశువుల మందలూ ఆ కొండ ఎదుట మేయకూడదు.
