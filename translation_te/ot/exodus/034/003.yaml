source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: te
  text: నీతో పాటు ఎవరూ పైకి ఎక్కకూడదు[a]. అంతేకాదు, ఆ కొండలో ఎక్కడా ఎవరూ కనిపించకూడదు[b]. గొర్రెల మందలూ పశువుల మందలూ ఆ కొండ ఎదుట మేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎవరూ’ అని అనువదించిన హీబ్రూ పదం వ్యాకరణరీత్యా పురుష ఏకవచనంలో ఉన్నా, ఇక్కడ ఏ మానవ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎవరూ ప్రత్యక్షం కాకూడదు.’ ఈ హీబ్రూ క్రియారూపానికి ‘కనిపించు’ లేదా ‘ప్రత్యక్షమవు’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ఎవరూ
  rationale: ఇక్కడ వ్యాకరణరీత్యా పురుష ఏకవచన నామవాచకమైనా, నిషేధం ఏ మానవ వ్యక్తికైనా వర్తించే సాధారణార్థంలో ఉంది; ఆధునిక తెలుగులో ‘ఎవరూ’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יַעֲלֶה עִמָּךְ
  choice: నీతో పాటు ... పైకి ఎక్కకూడదు
  rationale: עלה లోని పైకి వెళ్లే దిశను ‘పైకి ఎక్కు’ స్పష్టంగా నిలుపుతుంది; עִמָּךְ ను ‘నీతో పాటు’గా అనువదించాం.
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ఈ సంధాయక అవ్యయం కొనసాగింపుతో పాటు రెండవ నిషేధాన్ని బలపరుస్తుంది.
- source_word: אַל יֵרָא
  choice: కనిపించకూడదు
  rationale: ראה నిఫాల్ రూపానికి ‘కనిపించు/దర్శనమివ్వు’ అనే భావాలు సాధ్యం. ప్రధాన పాఠంలో సహజమైన ‘కనిపించకూడదు’ను ఎంచుకొని, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בְּכָל הָהָר
  choice: ఆ కొండలో ఎక్కడా
  rationale: కొండ ప్రాంతమంతటిలో ఏ చోటనూ అనే పంపిణీ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: గొర్రెల మందలు ... పశువుల మందలు
  rationale: చిన్న పశువుల మందలు మరియు పెద్ద పశువుల మందలు అనే రెండు వర్గాల భేదాన్ని పాఠకులకు సులభంగా అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: אַל יִרְעוּ
  choice: మేయకూడదు
  rationale: జంతువులు కర్తలుగా ఉన్నప్పుడు רעה అంటే మేయడం; తెలుగు నిషేధార్థంలో ‘మేయకూడదు’ సహజం.
- source_word: אֶל מוּל
  choice: ఎదురుగా
  rationale: స్థల సంబంధమైన ‘ముందర/ఎదురుగా’ అనే భావంలో, కొండకు అభిముఖంగా ఉన్న ప్రాంతాన్ని ‘ఎదురుగా’ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הָהָר הַהוּא
  choice: ఆ కొండ
  rationale: హీబ్రూ సూచనార్థక పదం తెలిపే నిర్దిష్టతను, దూరసూచనను ‘ఆ’ నిలుపుతుంది.
