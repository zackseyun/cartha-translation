source:
  edition: WLC
  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: te
  text: అహరోనూ, ఇశ్రాయేలు కుమారులందరూ మోషేను చూడగా, ఇదిగో, అతని ముఖపు చర్మం ప్రకాశిస్తోంది[a]. వారు అతని దగ్గరికి రావడానికి భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెరుస్తోంది,’ ‘కిరణాలు వెదజల్లుతోంది.’ ఈ హీబ్రూ క్రియ అరుదైనది; చారిత్రకంగా దీనిని ‘కొమ్ములుగలది’ అని కూడా అనువదించారు. అయితే ఈ సందర్భం ప్రకాశాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియ ఇక్కడ కథనంలో సాధారణంగా ‘చూశారు’ అనే భావాన్నే ఇస్తుంది; తరువాతి దృశ్యాన్ని సహజమైన తెలుగు కాలవాక్యంగా అనుసంధానించడానికి ‘చూసినప్పుడు’ అని అనువదించాం.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: మూలంలోని కుటుంబసంబంధమైన, వ్యాకరణపరంగా పుంలింగమైన בְּנֵי יִשְׂרָאֵל పదబంధాన్ని యథాశక్తి నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా గమనించిన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచకపు ఆశ్చర్యభావాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: קָרַן
  choice: ప్రకాశిస్తూ ఉంది
  rationale: అరుదైన ఈ క్రియ ఇక్కడ కిరణాలు వెలువరించడం లేదా ప్రకాశించడం అనే భావాన్ని సూచిస్తుంది. సందర్భం నిరంతరంగా కనిపిస్తున్న ప్రకాశస్థితిని తెలియజేస్తుంది.
- source_word: עוֹר פָּנָיו
  choice: అతని ముఖచర్మం
  rationale: మూలంలో కేవలం ‘ముఖం’ అని కాకుండా ‘అతని ముఖపు చర్మం’ అని స్పష్టంగా ఉంది; ఆ దృశ్యాత్మక నిర్దిష్టతను నిలిపాం.
- source_word: וַיִּירְאוּ
  choice: వారు ... భయపడ్డారు
  rationale: భయాన్ని తెలిపే క్రియకు ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: అతని దగ్గరికి రావడానికి
  rationale: מן తో కూడిన క్రియానామం అతని వద్దకు చేరడానికి వెనుకాడిన భావాన్ని తెలుపుతుంది; ‘దగ్గరికి రావడానికి భయపడ్డారు’ తెలుగులో సహజంగా అదే అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ కుటుంబపదాన్ని తటస్థీకరించకుండా నిలిపింది; ఈ సందర్భంలో సమూహానికి చెందిన పురుషులను వ్యాకరణపరంగా సూచించే మూలరూపాన్ని అనుసరిస్తుంది.
- issue: మోషే ముఖానికి సంబంధించి קָרַן అర్థం
  choice: ప్రకాశిస్తూ ఉంది
  alternative: మెరుస్తూ ఉంది / కిరణాలు వెదజల్లుతోంది / కొమ్ములు కలిగి ఉంది
  rationale: సీనాయి సందర్భం, ప్రజల ప్రతిస్పందన, తదుపరి వచనాలు ప్రకాశాన్ని బలపరుస్తాయి. అయినప్పటికీ అరుదైన క్రియలోని చారిత్రక ‘కొమ్ములు’ అనువాదాన్ని పాఠ్యంలో స్వీకరించకుండా పాదసూచికలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృశ్య ఆశ్చర్యాన్ని, ‘ముఖచర్మం’ ద్వారా దాని స్పష్టమైన శరీరసంబంధ పదప్రయోగాన్ని నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
