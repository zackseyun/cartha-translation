source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “ఇదిగో, నేను ఒక నిబంధన చేస్తున్నాను. భూమి అంతటిలోగానీ, ఏ జనాంగంలోగానీ ఎన్నడూ సృష్టించబడని అద్భుతాలను నీ ప్రజలందరి ఎదుట చేస్తాను. నీవు వారి మధ్య ఉన్న ఆ ప్రజలందరూ యెహోవా కార్యాన్ని చూస్తారు; ఎందుకంటే నేను నీతో చేస్తున్నది భయభక్తులు కలిగించేది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించి రాబోయే ప్రకటన ప్రాముఖ్యతను సూచించే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: כֹּרֵת בְּרִית
  choice: ఒక నిబంధన చేస్తున్నాను
  rationale: అక్షరార్థంగా ‘నిబంధనను కోస్తున్నాను’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక రూపం.
- source_word: נִפְלָאֹת
  choice: అద్భుతాలు
  rationale: సాధారణ మానవ కార్యాలకు మించిన ఆశ్చర్యకరమైన దేవుని క్రియలను సూచిస్తుంది.
- source_word: לֹא נִבְרְאוּ
  choice: ఎన్నడూ సృష్టించబడని
  rationale: నִבְרָא అనే నిఫాల్ రూపంలోని ‘సృష్టించబడటం’ భావాన్ని నిలుపుతూ, సందర్భంలోని అపూర్వతను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מַעֲשֵׂה יְהוָה
  choice: యెహోవా కార్యం
  rationale: దైవనామాన్ని వ్యక్తినామంగా లిప్యంతరీకరించి, מַעֲשֵׂה యొక్క ఏకవచన రూపాన్ని ‘కార్యం’గా నిలుపుతుంది.
- source_word: נוֹרָא
  choice: భయభక్తులు పుట్టించేది
  rationale: ఈ పదంలోని భయంకరత, విస్మయం, గౌరవభయం అనే మిశ్రమ భావాన్ని కేవలం ‘భయంకరమైనది’గా కుదించకుండా వ్యక్తపరుస్తుంది.
- source_word: עֹשֶׂה עִמָּךְ
  choice: నేను నీతో చేయబోయేది
  rationale: עִם యొక్క సంబంధార్థక అస్పష్టతను ‘నీ కోసం’ లేదా ‘నీకు’ అని పరిమితం చేయకుండా ‘నీతో’గా నిలుపుతుంది; ప్రస్తుత కృదంతం సందర్భానుసారంగా సమీప భవిష్యత్ క్రియను సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని ప్రత్యేక వ్యక్తినామాన్ని బిరుదుతో మార్చకుండా స్పష్టంగా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్ని దిగుమతి చేయదు.
- issue: అద్భుతాలు ‘సృష్టించబడని’వి అనే అసాధారణ వాక్యరూపం
  choice: ఎన్నడూ సృష్టించబడని అద్భుతాలు
  alternative: ఎన్నడూ జరగని అద్భుతాలు
  rationale: మూలంలోని ברא (‘సృష్టించు’) అనే బలమైన పదాన్ని మృదువుచేయకుండా, దైవకార్యాల అపూర్వతను నిలుపుతుంది.
- issue: נוֹרָא లోని భయం–విస్మయం ఉద్రిక్తత
  choice: భయభక్తులు పుట్టించేది
  alternative: విస్మయం కలిగించేది
  rationale: పదంలోని గంభీరమైన భయాంశాన్ని తొలగించకుండా, అది కేవలం భయానకత మాత్రమే అన్న భావనను కూడా నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘నిబంధన’, ‘యెహోవా’, ‘భయభక్తులు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. మూలంలోని ద్వితీయ పురుష ఏకవచన సంబోధనను ‘నీ/నీవు’గా ఉంచి, మోషేను ఉద్దేశించిన మాటగా స్పష్టత కాపాడబడింది.
