id: EXO.30.16
reference: Exodus 30:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: te
  text: నీవు ఇశ్రాయేలు కుమారుల నుండి ప్రాయశ్చిత్తపు వెండిని తీసుకొని, దానిని సమావేశ గుడారపు సేవ కొరకు ఇవ్వాలి. అది యాహ్వే సన్నిధిలో ఇశ్రాయేలు కుమారులకు జ్ఞాపకార్థంగా ఉండి, మీ ప్రాణాల కొరకు ప్రాయశ్చిత్తం చేయడానికి ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మీ నెఫెష్‌ల కొరకు’; ఈ సందర్భంలో భావం ‘మీ ప్రాణాల కొరకు’ లేదా ‘మీ కొరకు.’
    reason: נֶפֶשׁ ఇక్కడ శరీరానికి వేరైన ఆత్మ అనే భావంలో కాక, వ్యక్తుల ప్రాణాలను లేదా వ్యక్తులనే సూచిస్తుంది.
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్త ధనం
  rationale: כֶּסֶף అంటే వెండి లేదా ధనం; ఇక్కడ ముందటి వచనాల్లో నిర్దేశించిన జనగణన చెల్లింపును సూచిస్తుంది. הַכִּפֻּרִים లోని כפר ఆచార సంబంధమైన ప్రాయశ్చిత్త భావాన్ని కలిగి ఉంది.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల దగ్గర
  rationale: బְּנֵי יִשְׂרָאֵל అనే మూలంలోని పుంలింగ బహువచన రూపాన్ని, నిబంధన ప్రజలను సమష్టిగా సూచించే విధంగా స్పష్టంగా నిలిపింది.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారపు సేవ కోసం
  rationale: עַל ఇక్కడ కేటాయింపు లేదా ఉద్దేశాన్ని సూచిస్తుంది; עֲבֹדָה పరిశుద్ధస్థల సందర్భంలో పని కంటే ‘సేవ’గా సహజంగా ఉంటుంది. אֹהֶל מוֹעֵדకు ప్రాచుర్యంలో ఉన్న గౌరవప్రదమైన తెలుగు పదబంధం ‘ప్రత్యక్ష గుడారం’.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: జ్ఞాపకార్థంగా ఉండి
  rationale: זִכָּרוֹן దేవుని సన్నిధిలో నిలిచే జ్ఞాపక చిహ్నం లేదా స్మారకాన్ని సూచిస్తుంది; ‘జ్ఞాపకార్థంగా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనేది ఇక్కడ దేవుని సమక్షాన్ని సూచించే ఆచార సంబంధమైన ప్రయోగం; తెలుగు భాషలో ‘సన్నిధిలో’ గౌరవప్రదమూ సహజమూ.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేస్తుంది
  rationale: כפר యొక్క పియేల్ రూపం యాజక సంబంధ సందర్భంలో ప్రాయశ్చిత్తం చేయడాన్ని సూచిస్తుంది. వాక్య నిర్మాణంలో జ్ఞాపకార్థమైన ఆ ధనాన్నే కర్తగా కొనసాగించడం మూలంలోని ఉద్దేశార్థ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: మీ ప్రాణాల కోసం
  rationale: נֶפֶשׁ ఇక్కడ శరీరానికి వేరైన ‘ఆత్మలు’ అనే తరువాతి ద్వైత భావం కాకుండా వ్యక్తుల ప్రాణాలు లేదా జీవాలను సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’ను వాడి, సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చలేదు; మూల దైవనామాన్ని సూచించే ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో తెలిపింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధన సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని నిలిపి, అది నిబంధన ప్రజలను సమష్టిగా సూచిస్తుందనే రూపాన్ని అనవసరంగా లింగతటస్థం చేయలేదు.
- issue: ప్రాయశ్చిత్త ధనం మరియు ప్రాయశ్చిత్త క్రియ మధ్య సంబంధం
  choice: అది ... మీ ప్రాణాల కోసం ప్రాయశ్చిత్తం చేస్తుంది
  alternative: మీ ప్రాణాల కోసం ప్రాయశ్చిత్తం చేయడానికి అది ... జ్ఞాపకార్థంగా ఉంటుంది
  rationale: హీబ్రూ לְכַפֵּר ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగు ప్రధాన వాక్యం ధనం/జ్ఞాపకార్థం యొక్క ప్రాయశ్చిత్త పాత్రను స్పష్టంగా ఉంచుతుంది; ఖచ్చితమైన కార్యవిధానంపై అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ప్రాయశ్చిత్తం’, ‘ప్రత్యక్ష గుడారం’, ‘సన్నిధి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది. మూలంలోని ఏకవచన ఆజ్ఞ ‘నీవు’గా, సమాజాన్ని ఉద్దేశించిన బహువచనం ‘మీ’గా భేదించింది.
