  to: నీవు ఇశ్రాయేలు కుమారుల నుండి ప్రాయశ్చిత్తపు వెండిని తీసుకొని, దానిని సమావేశ గుడారపు సేవ కొరకు ఇవ్వాలి. అది యాహ్వే సన్నిధిలో ఇశ్రాయేలు కుమారులకు జ్ఞాపకార్థంగా ఉండి, మీ ప్రాణాల కొరకు ప్రాయశ్చిత్తం చేయడానికి ఉంటుంది.[a]
