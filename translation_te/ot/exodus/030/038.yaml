revisions:
- from: దాని వంటిదాన్ని వాసన చూడటానికి తయారుచేసే వ్యక్తి తన ప్రజల్లో నుండి తొలగించబడాలి[a][b].
  to: దాని వంటి ధూపాన్ని వాసన చూడటానికి తయారుచేసే ఎవరైనా తన ప్రజలలోనుండి తొలగించబడాలి[a][b].
  rationale: The revision makes the antecedent of “like it” explicit as incense, improves the idiomatic Telugu rendering of “from his people,” and refines the explanatory footnote. It retains the source’s generic legal subject, purpose clause, and ambiguity concerning the mechanism of being cut off.
