  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: te
  text: దాని వంటి ధూపాన్ని వాసన చూడటానికి తయారుచేసే ఎవరైనా తన ప్రజలలోనుండి తొలగించబడాలి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని సువాసనను ఆస్వాదించడానికి.” హీబ్రూ క్రియారూపం వ్యక్తిగతంగా వాసన చూడటం లేదా సువాసనను ఆస్వాదించడం కోసం అలాంటి ధూపాన్ని తయారుచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తన ప్రజలలోనుండి తొలగించబడాలి” అనేది స్థిరమైన హీబ్రూ న్యాయసంబంధ సూత్రవాక్యం. సందర్భాన్ని బట్టి ఇది మరణాన్ని, సమాజం నుండి బహిష్కరణను, లేదా దేవుని తీర్పుచేత తొలగింపును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: తయారుచేసే వ్యక్తి
  rationale: ఈ న్యాయపరమైన నిర్మాణంలో אִישׁ సాధారణంగా ఎవరైనా వ్యక్తిని సూచిస్తుంది; లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తీకరించబడింది.
- source_word: יַעֲשֶׂה
  choice: తయారుచేసే
  rationale: עשה ప్రాథమికంగా ‘చేయు/తయారుచేయు’; ఇక్కడ ధూపమిశ్రమాన్ని రూపొందించే సందర్భంలో ‘తయారుచేయు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: כָמֹהָ
  choice: దాని వంటిదాన్ని
  rationale: ముందటి వచనాల్లో చెప్పిన పవిత్ర ధూపాన్ని పోలిన మిశ్రమాన్ని సూచిస్తుంది; అది పూర్తిగా అదే మిశ్రమమా లేక పోలినదా అనే పరిమాణాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: לְהָרִיחַ בָּהּ
  choice: వాసన చూడటానికి
  rationale: హిఫీల్ infinitive ఉద్దేశాన్ని తెలియజేస్తుంది. వ్యక్తిగతంగా దాని సువాసనను ఆస్వాదించేందుకు వాసన చూడటం అనే భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంచుతుంది.
- source_word: וְנִכְרַת
  choice: తొలగించబడాలి
  rationale: నిఫాల్ న్యాయసూత్రంలోని తీవ్రమైన వేరుచేయబడటాన్ని తెలుపుతుంది. మరణం, సమాజబహిష్కరణ లేదా దైవిక తొలగింపు అని ముందుగానే నిర్ణయించకుండా ఉంచుతుంది.
- source_word: מֵעַמָּיו
  choice: తన ప్రజల్లో నుండి
  rationale: עם ఇక్కడ వ్యక్తికి చెందిన ప్రజలను లేదా సమాజాన్ని సూచిస్తుంది; హీబ్రూ న్యాయసూత్రపు సంబంధపరమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘తన ప్రజల్లో నుండి తొలగించబడాలి’ అనే శిక్షాసూత్రం యొక్క అర్థం
  choice: శిక్ష అమలయ్యే విధానాన్ని నిర్వచించకుండా ‘తన ప్రజల్లో నుండి తొలగించబడాలి’ అని ఉంచడం
  alternative: ‘చంపబడాలి’ లేదా ‘సమాజం నుండి బహిష్కరించబడాలి’ లేదా ‘దేవుని తీర్పుచేత తొలగించబడాలి’
  rationale: హీబ్రూ וְנִכְרַת מֵעַמָּיו తీవ్రమైన నిబంధనాత్మక శిక్షను సూచించినా, దాని అమలు విధానం ప్రతి సందర్భంలో స్పష్టంగా ఒకటే కాదు. అందువల్ల అసలు పాఠ్యంలోని న్యాయపరమైన, వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘కొట్టివేయబడాలి’ వంటి అసహజమైన పదక్షరానువాదాన్ని నివారించి, శిక్ష స్వరూపంపై ఉన్న అసలు సందిగ్ధతను ‘తొలగించబడాలి’ ద్వారా నిలిపాం.
