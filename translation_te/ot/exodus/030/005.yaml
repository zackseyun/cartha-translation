translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. హీబ్రూ వాక్యంలోని వరుస ఆజ్ఞను ఒక సహజ తెలుగు సంయుక్త వాక్యంగా అందించాం.
