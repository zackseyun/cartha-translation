translation:
  language: te
  text: నీవు ఆ మోయు కర్రలను తుమ్మచెక్కతో చేయాలి, వాటికి బంగారు పూత పూయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేసి
  rationale: వరుసగా ఇచ్చిన నిర్మాణ ఆదేశంలో సంయోజకంతో కూడిన ఖల్ పర్ఫెక్ట్ ఆజ్ఞార్థక భావాన్ని కలిగిస్తుంది; తెలుగులో ‘చేసి ... పూయాలి’ అనే నిర్మాణం ఆ వరుస ఆదేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోయు కర్రలను
  rationale: పరిశుద్ధ సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది. కేవలం ‘కర్రలు’ కంటే ‘మోయు కర్రలు’ వాటి పనిని స్పష్టంగా చెబుతుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఇది అకేసియా జాతి చెక్కను సూచించే నిర్మాణ పదబంధం. ఆధునిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించదగిన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וְצִפִּיתָ
  choice: పూత పూయాలి
  rationale: ఈ చేతివృత్తి సందర్భంలో క్రియ ఒక పదార్థంతో పైపొర కప్పడాన్ని సూచిస్తుంది; ‘పూత పూయాలి’ సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: אֹתָם
  choice: వాటికి
  rationale: ఈ సర్వనామం ముందున్న మోయు కర్రలను తిరిగి సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘వాటికి’ అని ఇచ్చాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పైపూతకు ఉపయోగించే పదార్థం బంగారం అని తెలుపుతుంది; ‘బంగారు పూత’ అనే రూపం తెలుగులో సహజంగా ఉంటుంది.
