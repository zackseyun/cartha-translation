  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: te
  text: దాని పొడవు ఒక మూర, దాని వెడల్పు ఒక మూర ఉండాలి; అది చతురస్రంగా ఉండాలి. దాని ఎత్తు రెండు మూరలు ఉండాలి. దాని కొమ్ములు దాని నుండే ఉండాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా, ‘దాని నుండి’; అంటే కొమ్ములు విడిగా జోడించినవి కాక, బలిపీఠంతో ఒకే నిర్మాణంగా ఉండాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה
  choice: మూర
  rationale: ప్రాచీన పొడవు ప్రమాణాన్ని ఆధునిక ప్రమాణంలోకి మార్చి కృత్రిమ ఖచ్చితత్వం కలిగించకుండా, తెలుగులో సాంప్రదాయంగా వాడే ‘మూర’ను ఉంచింది.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: 3వ పురుష ఏకవచన ప్రత్యయం సందర్భంలోని బలిపీఠాన్ని సూచిస్తుంది.
- source_word: רָחְבּוֹ
  choice: దాని వెడల్పు
  rationale: కొలతను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָבוּעַ
  choice: చతురస్రంగా
  rationale: నాలుగు సమాన భుజాలుగల ఆకారాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: గుడార నిర్మాణ సూచనల సందర్భంలో ఈ అసంపూర్ణ క్రియ ఆజ్ఞాత్మక నిర్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: אַמָּתַיִם
  choice: రెండు మూరలు
  rationale: ద్వివచన రూపం రెండు మూరలను స్పష్టంగా సూచిస్తుంది.
- source_word: קֹמָתוֹ
  choice: దాని ఎత్తు
  rationale: నిర్మాణ సందర్భంలో సహజమైన తెలుగు కొలత పదం.
- source_word: מִמֶּנּוּ
  choice: దానిలో నుండే
  rationale: అక్షరార్థమైన ‘దాని నుండి’ అనే భావాన్ని కాపాడుతూ, కొమ్ములు విడిగా అతికించినవి కాక బలిపీఠంతో సమగ్రంగా ఉండాలనే నిర్మాణ భావాన్ని సూచిస్తుంది.
- source_word: קַרְנֹתָיו
  choice: దాని కొమ్ములు
  rationale: బలిపీఠపు మూలల వద్దనున్న కొమ్ములవంటి పొడిగింపులకు వాడే ఆరాధనా పదజాలాన్ని, ఇతర వచనాలతో సంబంధాన్ని కాపాడుతుంది.
