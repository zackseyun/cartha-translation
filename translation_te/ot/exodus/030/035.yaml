id: EXO.30.35
reference: Exodus 30:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: te
  text: దానిని సుగంధద్రవ్యాలను కలిపే నిపుణుడి పనితనం ప్రకారం ధూపంగా[a] తయారుచేయాలి; అది ఉప్పు కలిపినదీ[b], శుద్ధమైనదీ, పరిశుద్ధమైనదీ[c] కావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సుగంధ మిశ్రమంగా” లేదా “సువాసన ద్రవ్యాల సమ్మేళనంగా.” హెబ్రీ పదబంధం నైపుణ్యంగా కలిపి తయారుచేసిన సుగంధ తయారీని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఉప్పుతో మేళవించినది” లేదా “ఉప్పు వేసినది.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “పవిత్రమైనది.” హెబ్రీలో ఇక్కడ “పరిశుద్ధమైనది” అనే భావమే ఉంది; “అతి పరిశుద్ధమైనది” కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: దానిని ... చేయాలి
  rationale: ముందటి వచనంలోని పదార్థాల మిశ్రమాన్ని సూచించే స్త్రీలింగ కర్మ సర్వనామాన్ని సహజమైన తెలుగులో ‘దానిని’గా, ఆదేశార్థక నిర్మాణాన్ని ‘చేయాలి’గా అందించింది.
- source_word: קְטֹרֶת רֹקַח
  choice: తయారుచేసిన ధూపంగా
  rationale: קְטֹרֶתకు సందర్భోచితమైన ‘ధూపం’ను ఉంచి, רֹקַח సూచించే నైపుణ్యంతో కలిపి తయారుచేసిన సుగంధ మిశ్రమ భావాన్ని తరువాతి వృత్తి పదబంధంతో కలిపి తెలిపింది.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: సుగంధ ద్రవ్యాలు కలిపేవాని పనితనంతో
  rationale: అక్షరార్థంగా ‘కలిపేవాని/సుగంధ ద్రవ్యాలు సిద్ధం చేసేవాని పని’; నిపుణుని వృత్తి నైపుణ్యాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מְמֻלָּח
  choice: ఉప్పు కలిపినది
  rationale: ఉప్పుతో సంబంధమున్న నిష్క్రియ కృదంతానికి అత్యంత సహజమైన ప్రత్యక్ష అర్థాన్ని ఎంచుకుంది; పదం గురించి ప్రతిపాదించబడిన ఇతర అర్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: טָהוֹר
  choice: పవిత్రమైనది
  rationale: ఆరాధనా మరియు పదార్థ శుద్ధి సందర్భంలో ‘శుభ్రమైనది’ కంటే ‘పవిత్రమైనది’ సహజంగా ఉంటుంది; తదనంతర קֹדֶשׁతో తేడా నిలవడానికి వేరే పదాన్ని వాడింది.
- source_word: קֹדֶשׁ
  choice: పరిశుద్ధమైనది
  rationale: దేవుని సేవకు ప్రత్యేకపరచబడిన స్థితిని తెలిపే ప్రత్యక్ష తెలుగు సమానార్థకం; ‘అతి పరిశుద్ధమైనది’ అని మూలంలో లేని అధికతను చేర్చదు.
theological_decisions:
- issue: ధూపపు ఆరాధనాపరమైన స్థితి
  choice: పరిశుద్ధమైనది
  alternative: అతి పరిశుద్ధమైనది
  rationale: ఈ వచనంలో కֹדֶשׁ మాత్రమే ఉంది; ‘అతి పరిశుద్ధమైనది’ అనే అధికతా నిర్మాణం లేదు. కాబట్టి సందర్భం దాని ప్రత్యేక పవిత్రతను సూచించినా, మూలపాఠం చెప్పినదానికంటే బలమైన ఆరాధనాపరమైన వర్గాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆదేశాత్మకమైనప్పటికీ సహజంగా వినిపించే ‘చేయాలి/ఉండాలి’ నిర్మాణాలు వాడబడ్డాయి. ‘పవిత్రమైనది’ మరియు ‘పరిశుద్ధమైనది’ ద్వారా טָהוֹר, קֹדֶשׁ మధ్యనున్న శుద్ధి–ప్రత్యేకీకరణ భేదాన్ని సాధ్యమైనంతవరకు నిలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
