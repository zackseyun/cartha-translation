base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా మాట్లాడాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: דבר యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు తీసుకెళ్లి మాటల ఆరంభాన్ని సూచిస్తుంది. తెలుగులో తరువాతి לֵאמֹרతో కలిపి ‘ఇలా అన్నాడు’ అనడం సహజంగా ఉండి మూలంలోని పలుకుబడి సూత్రాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసి ప్రసంగం ఎవరిని ఉద్దేశించిందో తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరపడిన ఆధునిక తెలుగు రూపం.
- source_word: לֵּאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజమైన ‘ఇలా అన్నాడు’ నిర్మాణంతో వ్యక్తం చేస్తుంది; తదుపరి వచనంలో వచ్చే మాటలకు సిద్ధం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా పేరుగా ఉంచాం; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ ‘మాట్లాడి, చెబుతూ’ అనే పునరుక్త సూత్రాన్ని పదేపదే అనుకరించకుండా, దాని కార్యాన్ని ‘ఇలా అన్నాడు’లో నిలిపాం.
