translation:
  language: te
  text: కాసియా ఐదువందల షెకెలులు, పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం, మరియు ఒలీవ నూనె ఒక హీను[a] తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీను అనేది ప్రాచీన ద్రవ కొలమానం; అది సుమారు 3.5 నుంచి 4 లీటర్లు ఉండేదని చాలామంది అంచనా వేస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: కాసియా సుగంధపు చెక్క
  rationale: ఈ పదం పరిమళ ద్రవ్యంగా ఉపయోగించే కాసియా చెట్టు సుగంధపు బెరడును సూచిస్తుంది. సాధారణ పాఠకునికి పదార్థం స్పష్టమయ్యేలా పేరుతో పాటు దాని స్వభావాన్ని తెలిపాం.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: ఐదువందల
  rationale: మూలంలోని సంఖ్యను నేరుగా, సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది బరువును లెక్కించే ప్రత్యేక ప్రమాణాన్ని సూచిస్తుంది. ప్రాచీన కొలమానమైన ‘షెకెలు’ను నిలిపి, ప్రమాణార్థాన్ని తెలుగులో స్పష్టం చేశాం.
- source_word: שֶׁמֶן זַיִת
  choice: ఒలీవ నూనె
  rationale: మూలంలోని నిర్మాణానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం.
- source_word: הִין
  choice: ఒక హీను
  rationale: ఇది నిర్దిష్టమైన ప్రాచీన ద్రవ కొలమానం కాబట్టి సుమారు ఆధునిక పరిమాణంతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: మరియు
  rationale: ఈ పదార్థాన్ని ముందున్న జాబితాతో కలిపే సంధానాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన భాషను వాడాం. ఇది ముందటి వచనంలో మొదలైన ఆజ్ఞకు కొనసాగింపు కావడంతో, తెలుగులో వాక్యం సహజంగా పూర్తయ్యేందుకు ‘తీసుకోవాలి’ అనే క్రియను సందర్భానుసారంగా పూరించాం.
