  terminology: ‘పవిత్రస్థల షెకెలు ప్రమాణం’, ‘అర షెకెలు’, ‘గేరాలు’, ‘అర్పణ’ తగినవి. దైవనామాన్ని ‘యాహ్వే’గా సవరించాం. పాదటిప్పణిని కొలమాన వివరణకన్నా మూలంలోని జనగణన నుడికారం కోసం ఉపయోగించాం; కొలమాన వివరణ ప్రధాన పాఠ్యంలోనే ఉంది.
  issues:
  - severity: medium
    issue: దైవనామం ‘యెహోవా’గా ఉంది.
    rationale: మూలంలోని יְהוָהను ప్రాజెక్టు నిర్ణయం ప్రకారం ‘Yahweh’గా ఇవ్వాలి. తెలుగులో ‘యాహ్వే’ ఆ నిర్దేశిత రూపానికి సమీపమైన లిప్యంతరీకరణ; ‘యెహోవా’ ‘Jehovah’ సంప్రదాయాన్ని ప్రతిబింబిస్తుంది.
