reference: Exodus 30:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: te
  text: 'లెక్కలో చేర్చబడే ప్రతి ఒక్కరూ[a] ఇవ్వవలసింది ఇదే: పవిత్రస్థల షెకెలు ప్రమాణం ప్రకారం అర షెకెలు (ఒక షెకెలు ఇరవై గేరాలు), యాహ్వేకు అర్పణగా అర షెకెలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమోదైనవారి మధ్యగా వెళ్లే ప్రతి ఒక్కరూ”; హీబ్రూ నుడికారం జనగణనలో అధికారిక లెక్కలో చేర్చబడటాన్ని సూచిస్తుంది.
    reason: హీబ్రూ జనగణన నుడికారంలోని పదశః ప్రత్యామ్నాయాన్ని, సందర్భార్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: ఇవ్వవలసింది ఇదే
  rationale: న్యాయవిధిలోని నిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, హీబ్రూ ప్రదర్శక సూత్రాన్ని నిలుపుతుంది.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: లెక్కలో నమోదయ్యే ప్రతి ఒక్కరూ
  rationale: పదశః ‘లెక్కించబడినవారి మీదుగా/మధ్యగా వెళ్లే ప్రతి ఒక్కరూ’; జనగణనలో అధికారిక లెక్కలో చేరడాన్ని సూచించే నుడికారాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: అర షెకెలు
  rationale: మూలంలోని ధన/బరువు ప్రమాణాన్ని అనువదించకుండా, మొత్తాన్ని సంక్షిప్తంగా మరియు స్పష్టంగా తెలుపుతుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పవిత్రస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: בְּ ఇక్కడ కొలత ప్రమాణాన్ని సూచిస్తుంది; ‘పవిత్రస్థలపు షెకెలు’ అనేది సాంకేతిక ప్రమాణమని స్పష్టం చేస్తుంది.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: ఒక షెకెలు ఇరవై గేరాలు
  rationale: షెకెలు విలువను నిర్వచించే వివరణాత్మక ఉపవాక్యాన్ని సహజంగా అందిస్తుంది.
- source_word: תְּרוּמָה לַיהוָה
  choice: యెహోవాకు అర్పణగా
  rationale: תְּרוּמָה దేవునికోసం ప్రత్యేకించిన సమర్పణను సూచిస్తుంది; ‘అర్పణ’ ఆరాధనా సందర్భాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపబడింది.
- issue: תְּרוּמָה యొక్క ఆరాధనా భావం
  choice: అర్పణ
  alternative: కానుక; సమర్పణ
  rationale: ఇది సాధారణ విరాళం మాత్రమే కాక దేవునికి ప్రత్యేకించిన కానుకను సూచిస్తుంది; ‘అర్పణ’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవిధి శైలి. జనగణన నుడికారాన్ని పదశః అసహజంగా అనువదించకుండా దాని సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చాం; ప్రాచీన కొలమానాల పేర్లను లిప్యంతరీకరించాం.
