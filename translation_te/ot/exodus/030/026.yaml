lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకించాలి
  rationale: సూచనల వరుసలో వావ్‌తో కూడిన Qal perfect 2ms ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. משׁח అనే ఆరాధనా సంబంధిత క్రియకు ‘అభిషేకించు’ సహజమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: בּוֹ
  choice: దానితో
  rationale: ముందటి సందర్భంలోని అభిషేక తైలాన్ని సూచించే సాధనార్థక ప్రయోగాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారానికి తెలుగులో స్థిరపడిన బైబిలు సంబంధిత నామం; మూలంలోని construct phrase‌ను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲרוֹן
  choice: మందసం
  rationale: పరిశుద్ధ వస్తువును ఉంచే పెట్టెకు ఆరాధనా సందర్భంలో గుర్తింపున్న, గౌరవప్రదమైన తెలుగు పదం.
- source_word: הָעֵדֻת
  choice: సాక్ష్యం
  rationale: మూలంలోని עדות‌కు నేరమైన సమానార్థకం; ‘నిబంధన’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలపదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת పదబంధం అనువాదం
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన మందసం
  rationale: హీబ్రూ పాఠంలో ఇక్కడ ‘సాక్ష్యం’ అనే పదమే ఉంది; ‘నిబంధన’ అనేది సంప్రదాయంగా పరిచయమైన భావవ్యాఖ్య అయినప్పటికీ ఈ వచనంలోని మూలపదం కాదు. అందువల్ల ప్రధాన పాఠంలో మూలంలోని పదభేదాన్ని కాపాడి, పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని వాడాం. ‘ప్రత్యక్షపు గుడారం’, ‘మందసం’, ‘అభిషేకించు’ వంటి స్థిరపడిన బైబిలు పదజాలాన్ని కొనసాగిస్తూ, మూలంలోని ‘సాక్ష్యం’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
