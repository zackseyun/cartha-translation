revisions:
- from: దానితో ప్రత్యక్షపు గుడారాన్ని, సాక్ష్యపు మందసాన్ని అభిషేకించాలి.[a]
  to: దానితో సమాగమపు గుడారాన్ని, సాక్ష్యపు మందసాన్ని అభిషేకించాలి.[a]
  rationale: The revision replaces the more interpretive traditional label for the tent with a direct rendering of “tent of meeting,” while retaining the formal cultic terminology and the source-based distinction between “testimony” and the traditional “covenant” in the footnote.
