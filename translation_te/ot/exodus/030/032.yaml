id: EXO.30.32
reference: Exodus 30:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: te
  text: అది మానవ శరీరంపై పోయకూడదు; దాని మిశ్రమ నిష్పత్తి ప్రకారం దానివంటిది మీరు తయారుచేయకూడదు. అది పవిత్రమైనది; అది మీకు పవిత్రంగా ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִיסָךְ
  choice: పోయకూడదు
  rationale: నָסַךְ క్రియ యొక్క నిష్క్రియ రూపాన్ని, ఈ సందర్భంలో నూనెను శరీరంపై పోయడం లేదా పూయడం అనే భావాన్ని, ఆచారపరమైన ఫలితంగా విస్తరించకుండా తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: עַל בְּשַׂר אָדָם
  choice: మానవ శరీరంపై
  rationale: בָּשָׂר అక్షరార్థంగా ‘మాంసం’ అయినా ఇక్కడ సజీవ మానవ దేహాన్ని సూచిస్తుంది; אָדָם సాధారణంగా మానవులను సూచిస్తుంది. ‘మానవ శరీరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: దాని మిశ్రమ నిష్పత్తి ప్రకారం
  rationale: מַתְכֻּנֶת కొలిచిన కూర్పు లేదా పదార్థాల నిష్పత్తిని సూచిస్తుంది. కేవలం ‘మిశ్రమం’ కంటే ‘మిశ్రమ నిష్పత్తి’ ప్రత్యేక సూత్రాన్ని పునరుత్పత్తి చేయరాదనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: దానివంటిది మీరు తయారుచేయకూడదు
  rationale: ప్రత్యేక అభిషేక తైలంతో సమానమైన మరొక మిశ్రమాన్ని తయారు చేయడాన్ని నిషేధించే తులనాత్మక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קֹדֶשׁ הוּא
  choice: అది పవిత్రమైనది
  rationale: קֹדֶשׁ యొక్క ప్రధాన బైబిలు భావమైన పవిత్రతను నిలుపుతుంది.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: అది మీకు పవిత్రంగా ఉండాలి
  rationale: ఇశ్రాయేలీయుల సంబంధంలో అది ప్రత్యేకంగా ప్రతిష్ఠించబడినదిగా పరిగణించబడాలనే ఒడంబడిక సంబంధిత బలాన్ని, భవిష్యత్తు/విధి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אָדָם యొక్క సాధారణ మానవార్థక ప్రయోగం
  choice: మానవ
  alternative: మనిషి యొక్క
  rationale: ఇక్కడ אָדָם ఒక నిర్దిష్ట పురుషుణ్ణి కాక మానవులను సాధారణంగా సూచిస్తుంది. తెలుగు ‘మానవ’ ఈ సాధారణార్థాన్ని లింగ అపార్థం లేకుండా ఖచ్చితంగా తెలియజేస్తుంది.
- issue: కֹדֶשׁ యొక్క పునరుక్తి
  choice: రెండు వాక్యాల్లోనూ ‘పవిత్ర’ను నిలుపడం
  alternative: రెండవ దాన్ని ‘ప్రతిష్ఠితమైనది’గా వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని ఉద్దేశపూర్వక పునరుక్తి—దాని స్వభావం పవిత్రమైనది, ప్రజలు దానిని పవిత్రంగా పరిగణించాలి—అనే theological tensionను సరళీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ఆజ్ఞాత్మక గంభీరతతో రూపొందించబడింది. మూలంలోని రెండు నిషేధాలు మరియు ‘పవిత్ర’ అనే పునరుక్తి కాపాడబడ్డాయి.
