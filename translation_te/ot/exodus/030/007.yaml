  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: te
  text: అహరోను ప్రతి ఉదయం[a] దానిమీద సుగంధ ధూపం వేయాలి. అతడు దీపాలను సరిచేసేటప్పుడు[b] ఆ ధూపం వేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఉదయం ఉదయం.” హీబ్రూ పదపునరుక్తి ప్రతిరోజూ క్రమంగా చేయడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దీపాల వత్తులను కత్తిరించి వాటిని క్రమపరచేటప్పుడు.” హీబ్రూ క్రియ దీపాలను సిద్ధం చేసి సక్రమంగా ఉంచడాన్ని మరింత నిర్దిష్టంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: ధూపం వేయాలి
  rationale: కర్మకాండ సందర్భంలో కטר హిఫీల్ రూపం ధూపద్రవ్యాన్ని బలిపీఠంపై కాల్చి పొగగా పైకి లేవనివ్వడాన్ని సూచిస్తుంది. తెలుగులో ‘ధూపం వేయాలి’ సహజమైన ఆరాధనా ప్రయోగం.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: ముందటి సందర్భంలోని ధూపబలిపీఠాన్ని సూచించే స్థానార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: קְטֹרֶת סַמִּים
  choice: సుగంధ ధూపం
  rationale: కְטֹרֶת ధూపాన్ని, סַמִּים సుగంధ ద్రవ్యాల స్వభావాన్ని సూచిస్తాయి; ‘సుగంధ ధూపం’ సంక్షిప్తంగా, సహజంగా రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ప్రతి ఉదయం
  rationale: హీబ్రూ పదపునరుక్తి నిత్యంగా జరిగే పంపిణీయ భావాన్ని తెలియజేస్తుంది. ‘ప్రతి ఉదయం’ ఆధునిక తెలుగులో స్పష్టమైన రూపం; అక్షరార్థ పునరుక్తిని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּהֵיטִיבוֹ
  choice: అతడు … సరిచేసేటప్పుడు
  rationale: ఇక్కడ יטב హిఫీల్ రూపం దీపాలను సేవించి, వత్తులు తదితరాలను క్రమపరచి సిద్ధం చేయడాన్ని సూచిస్తుంది. ‘సరిచేసేటప్పుడు’ ఈ విస్తృత చర్యను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: הַנֵּרֹת
  choice: దీపాలను
  rationale: పరిశుద్ధస్థలంలోని దీపాలను సూచిస్తుంది; సందర్భంలో ‘దీపాలు’ మాత్రమే సరిపోతుంది.
- source_word: יַקְטִירֶנָּה
  choice: ఆ ధూపం వేయాలి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం קְטֹרֶתను తిరిగి సూచిస్తుంది. తెలుగులో అస్పష్టమైన ‘దాన్ని’ కంటే ‘ఆ ధూపం’ సహజంగా, స్పష్టంగా ఉంటుంది.
