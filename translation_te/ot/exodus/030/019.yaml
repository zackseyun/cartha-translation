  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: te
  text: అహరోనూ అతని కుమారులూ దానినుండి[a] తమ చేతులనూ కాళ్లనూ కడుక్కోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, “దానిలోని నీటితో.” ఇక్కడ “దాని” చుట్టుపక్కల సందర్భంలో చెప్పిన గంగాళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: కడుక్కోవాలి
  rationale: ఆదేశాత్మక సందర్భంలో ఈ క్రియకు విధి భావం ఉంది. ఆధునిక తెలుగులో ‘కడుక్కోవాలి’ సహజంగా ఉండి ఆ నిర్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: ఈ యాజక సేవా సందర్భంలో בנים అహరోను కుమారులనే సూచిస్తుంది; లింగనిర్దిష్టతను నిలుపుతుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుండి
  rationale: מן ప్రత్యయంతో కూడిన రూపానికి నేరమైన అర్థం ‘దానిలోనుండి.’ సమీప సందర్భంలోని గంగాళాన్ని ఇది సూచిస్తుంది; ‘దానిలోని నీటితో’ అనే స్పష్టీకరణను ప్రధాన వచనంలో చేర్చకుండా పాదటిప్పణిలో ఉంచాం.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులను
  rationale: కడుక్కునే మొదటి శరీర భాగాన్ని నేరుగా సూచిస్తుంది; కర్తలతో అన్వయాన్ని తెలుగులో ‘తమ’ సహజంగా చూపుతుంది.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: కాళ్లను
  rationale: రెండవ ప్రత్యక్ష కర్మను సమన్వయంగా చూపుతుంది; רגל యొక్క సందర్భానుకూల సాధారణ అర్థం ‘కాలు/పాదం,’ ఇక్కడ సహజ తెలుగు బహువచనం ‘కాళ్లు.’
theological_decisions:
- issue: లింగనిర్దిష్ట యాజక ప్రస్తావన
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: వచనం అహరోనుతోపాటు యాజక సేవలో ఉన్న అతని పురుష సంతానాన్ని సూచిస్తుంది. అందువల్ల విస్తృతార్థకమైన ‘పిల్లలు’ కంటే ‘కుమారులు’ మూలంలోని నిర్దిష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆదేశ శైలిని ఉపయోగించాం. మూలంలోని ‘దానిలోనుండి’ అనే సంక్షిప్త నిర్మాణాన్ని ప్రధాన వచనంలో నిలిపి, సందర్భం ద్వారా అర్థమయ్యే నీటి సూచనను పాదటిప్పణిలో స్పష్టం చేశాం.
