- from: అహరోను సంధ్యవేళలో[a] దీపాలను వెలిగించేటప్పుడు, ఆ ధూపాన్ని యహ్వే సన్నిధిలో వేయాలి. అది మీ తరతరాలూ క్రమంగా అర్పించాల్సిన ధూపం[b].
  to: అహరోను సంధ్యవేళలో[a] దీపాలను వెలిగించేటప్పుడు, మీ తరతరాల కోసం యహ్వే సన్నిధిలో నిత్య ధూపాన్ని అర్పించాలి[b].
