source:
  edition: WLC
  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: te
  text: అహరోను సంధ్యవేళలో[a] దీపాలను వెలిగించేటప్పుడు, మీ తరతరాల కోసం యహ్వే సన్నిధిలో నిత్య ధూపాన్ని అర్పించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘రెండు సాయంకాలాల మధ్య’; ఇది సాయంకాలపు సంధ్యకాలాన్ని సూచించే జాతీయ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎడతెగని ధూపం.’ ఇక్కడి హెబ్రీ పదం నిర్ణీత క్రమంలో కొనసాగించే ధూపార్పణాన్నీ, శాశ్వతంగా పాటించాల్సిన ఏర్పాటునీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: వెలిగించేటప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసూచక ఉపవాక్యాన్ని ఇస్తుంది. עלה హిఫీల్ రూపం దీపాల సందర్భంలో మంటను పైకి లేపడం, అంటే దీపాలను వెలిగించడం లేదా వెలిగేలా సిద్ధం చేయడం అనే భావం ఇస్తుంది; ఆధునిక తెలుగులో ‘వెలిగించేటప్పుడు’ సహజంగా ఉంది.
- source_word: הַנֵּרֹת
  choice: దీపాలను
  rationale: నివాస మందిరపు దీపస్తంభానికి సంబంధించిన నూనెదీపాలను సూచించే సాధారణ పదం.
- source_word: בֵּין הָעַרְבַּיִם
  choice: సంధ్యవేళలో
  rationale: అక్షరార్థంగా ‘రెండు సాయంకాలాల మధ్య’ అనే హెబ్రీ జాతీయ ప్రయోగం; సాయంకాలపు సంధ్యకాలాన్ని సూచిస్తుంది. అక్షరార్థం పాదసూచికలో ఉంచబడింది.
- source_word: יַקְטִירֶנָּה
  choice: ఆ ధూపాన్ని ... వేయాలి
  rationale: קטר హిఫీల్ బలులు లేదా ధూపం సందర్భంలో పొగ పైకి లేచేలా కాల్చి అర్పించడాన్ని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం קְטֹרֶתను తిరిగి సూచిస్తుంది; తెలుగులో సహజత కోసం ‘ఆ ధూపాన్ని వేయాలి’ అని స్పష్టం చేయబడింది.
- source_word: קְטֹרֶת
  choice: ధూపం
  rationale: కాల్చి సువాసనగల పొగను అర్పించే ధూపపదార్థాన్ని సూచిస్తుంది.
- source_word: תָּמִיד
  choice: క్రమంగా అర్పించాల్సిన
  rationale: ఆరాధనా నియమాల సందర్భంలో תמיד ప్రతి క్షణం నిరంతరంగా జరగడమే కాక, నిర్ణీత సమయాల్లో ఎడతెగకుండా కొనసాగించే క్రమాన్ని కూడా సూచిస్తుంది. ఉదయం, సాయంకాలం చేసే ఆచారానికి ‘క్రమంగా’ సరిపోతుంది; ‘నిత్య’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో, ఆరాధనా స్థలంలో జరిగే కార్యాన్ని సూచిస్తుంది; לפני యొక్క స్థల–సాన్నిధ్య భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలూ
  rationale: ఇశ్రాయేలు తరువాతి తరాలన్నిటిలో కొనసాగాల్సిన నియమాన్ని సంక్షిప్తంగా, సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, హెబ్రీ ఉచ్చారణకు సమీపమైన ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: תָּמִיד సూచించే కొనసాగింపు స్వభావం
  choice: క్రమంగా అర్పించాల్సిన
  alternative: నిత్య ధూపం; నిరంతర ధూపం
  rationale: ఈ ధూపార్పణం నిర్ణీత ఉదయ–సాయంకాల సమయాల్లో పునరావృతమవుతుంది. కాబట్టి ప్రతి క్షణం ఆగకుండా కాలుతుందనే అర్థాన్ని బలవంతంగా మోపకుండా, నియమిత కొనసాగింపును ప్రధాన పాఠంలో వ్యక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా శైలి వాడబడింది. ‘ధూపం వేయడం,’ ‘సన్నిధిలో,’ ‘తరతరాలూ’ వంటి సహజ బైబిలీయ పదబంధాలను ఉంచుతూ, హెబ్రీ జాతీయ ప్రయోగం మరియు תמיד యొక్క భావవ్యాప్తిని పాదసూచికల్లో కాపాడింది.
