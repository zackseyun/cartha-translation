  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: te
  text: “ధూపం వేయడానికి ఒక బలిపీఠాన్ని[a] చేయాలి; దాన్ని తుమ్మచెక్కతో చేయాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా సంక్షిప్తంగా, “ధూప బలిపీఠాన్ని.” హెబ్రీలో మరింత అక్షరార్థంగా, “ధూపం వేయడానికి ఒక బలిపీఠాన్ని” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: సూచనల వరుసలో ఉన్న సంయుక్త క్రియారూపం ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘చేయాలి’ సహజంగా, గౌరవప్రదంగా ఆ నిర్దేశాన్ని తెలియజేస్తుంది.
- source_word: מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని
  rationale: బలులు లేదా అర్పణలకు సంబంధించిన పీఠాన్ని సూచించే ఈ నామవాచకానికి ‘బలిపీఠం’ ప్రామాణిక తెలుగు పదం; ఇక్కడ వస్తువు మొదటిసారి పరిచయమవుతున్నందున ‘ఒక’ చేర్చబడింది.
- source_word: מִקְטַר קְטֹרֶת
  choice: ధూపం వేయడానికి
  rationale: ఈ నిర్మాణం ధూపం కాల్చే లేదా అర్పించే కార్యాన్ని సూచిస్తుంది. ‘ధూపం వేయడానికి’ అనేది పీఠం యొక్క ఉద్దేశాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఇది షిట్టీమ్/అకేసియా జాతి చెట్టు కలపను సూచించే హెబ్రీ నుడికారం. తెలుగు బైబిలు పరిభాషలో సుపరిచితమైన ‘తుమ్మచెక్క’ను ఉపయోగించాం.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: దాన్ని … చేయాలి
  rationale: వస్తువుపై మళ్లీ దృష్టి నిలిపే హెబ్రీ పునరుక్తిని తెలుగులోనూ ‘దాన్ని … చేయాలి’ అని నిలుపుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఆరాధనా సామగ్రికి తగిన గౌరవప్రదమైన శైలిలో అనువదించాం. మూలంలోని ‘చేయు’ అనే క్రియ పునరుక్తిని నిలిపి, వాక్యాన్ని సహజంగా ఉంచాం.
