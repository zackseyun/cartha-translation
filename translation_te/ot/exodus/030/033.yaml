source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: te
  text: ఎవరైనా దాని వంటిదాన్ని తయారుచేసినా, దానిలో కొంతను అనధికార వ్యక్తిపై[a] పూసినా, అతడు తన ప్రజలలోనుండి తొలగించబడతాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అనధికార వ్యక్తి’ అనే చోట ‘పరదేశి,’ ‘బయటివాడు,’ లేదా ‘సామాన్యుడు’ అని కూడా అనువదించవచ్చు. ఈ పవిత్ర సేవా సందర్భంలో హీబ్రూ זָר సాధారణంగా పవిత్ర తైలాన్ని పొందడానికి అధికారం లేని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ప్రజలలోనుండి తొలగించబడతాడు’ అనేది ఒడంబడిక సంబంధ న్యాయసూత్రం. ఈ శిక్ష ఏ విధంగా అమలవుతుందో ఈ వచనం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: ఎవరైనా ... వాడైనా
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఏ మనిషి అయితే’ అని ఉన్నా, ఈ న్యాయసూత్రంలో అది ఎవరినైనా సూచిస్తుంది. తెలుగులో ‘...వాడైనా’ అనే నిర్మాణం ఆ సాధారణ, న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִרְקַח
  choice: తయారుచేసే
  rationale: רקח పరిమళద్రవ్యాన్ని నిపుణంగా కలిపి తయారుచేయడాన్ని సూచిస్తుంది. తెలుగులో ‘తయారుచేయు’ అన్నది కేవలం కలపడమే కాక, నిర్దిష్ట మిశ్రమాన్ని రూపొందించే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: כָּמֹהוּ
  choice: దాని వంటిదాన్ని
  rationale: ఇది ముందటి సందర్భంలో వివరించిన పవిత్ర అభిషేక తైలాన్ని సూచిస్తూ, అదే విధమైన దానిని చేయడాన్ని నిషేధిస్తుంది. ‘దాని వంటిదాన్ని’ మూలంలోని పోలికను అలాగే ఉంచుతుంది.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: దానిలో కొంతను ... పూసే
  rationale: ఈ సందర్భంలో נתן על అనేది తైలంలో కొంతను ఒక వ్యక్తి మీద ఉంచడం లేదా పూయడం. అభిషేక తైలం సందర్భంలో ‘పూయు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל זָר
  choice: అనధికార వ్యక్తికి
  rationale: యాజక సంబంధ పవిత్ర సందర్భంలో זָר జాతిపరమైన విదేశీయుడిని తప్పనిసరిగా సూచించదు; పవిత్ర తైలాన్ని పొందడానికి నియమించబడని లేదా అధికారం లేని వ్యక్తిని సూచిస్తుంది. అందువల్ల ‘అనధికార వ్యక్తి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנִכְרַת
  choice: తొలగించబడతాడు
  rationale: כרת నిఫాల్ రూపం సమాజం నుండి తీవ్రమైన వేరుచేయడాన్ని తెలిపే ఒడంబడిక-న్యాయ సూత్రం. ‘తొలగించబడతాడు’ ఫలితాన్ని తెలియజేస్తూ, దాని అమలు విధానాన్ని నిర్దిష్టంగా నిర్ణయించదు.
- source_word: מֵעַמָּיו
  choice: తన ప్రజల్లోనుండి
  rationale: ఈ పదబంధం వ్యక్తి తన ఒడంబడిక సమాజం నుండి తొలగించబడడాన్ని సూచిస్తుంది. ‘తన ప్రజల్లోనుండి’ మూలానికి దగ్గరగా ఉండి తెలుగులో అర్థవంతంగా ఉంది.
theological_decisions:
- issue: యాజక పవిత్రత నియమంలో זָר భావం
  choice: అనధికార వ్యక్తి
  alternative: పరదేశి / అపరిచితుడు / సామాన్యుడు
  rationale: ఇక్కడ ప్రధాన భేదం జాతి లేదా పరిచయం కాదు; పవిత్ర అభిషేక తైలాన్ని పొందడానికి వ్యక్తికి అధికారం ఉందా లేదా అన్నదే. ‘అనధికార వ్యక్తి’ ఈ పవిత్రత హద్దును అనవసరమైన జాతిపరమైన అర్థం లేకుండా తెలియజేస్తుంది.
- issue: וְנִכְרַת מֵעַמָּיו అనే శిక్షాసూత్రం యొక్క పరిధి
  choice: తన ప్రజల్లోనుండి తొలగించబడతాడు
  alternative: తన ప్రజల నుండి వెలివేయబడతాడు / మరణశిక్ష పొందుతాడు
  rationale: మూలంలోని సూత్రం తీవ్రమైన తొలగింపును చెబుతుంది గాని, అది ఎలా అమలవుతుందో ఈ వచనంలో నిర్దిష్టంగా చెప్పదు. కాబట్టి అనిశ్చితిని నిలుపుతూ మరణశిక్షగా గాని, కేవలం సామాజిక బహిష్కరణగా గాని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి వాడబడింది. ‘తయారుచేయు,’ ‘పూయు’ వంటి సాధారణ పదాలతో వాక్యం సులభంగా అర్థమయ్యేలా ఉంచి, ‘తన ప్రజల్లోనుండి తొలగించబడతాడు’ అనే సూత్రంలో ఉన్న న్యాయ-దైవశాస్త్ర అనిశ్చితిని నిలుపుకున్నాం.
