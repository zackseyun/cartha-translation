source:
  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: te
  text: దానిమీద అనుమతి లేని ధూపాన్నిగానీ,[a] దహనబలినిగానీ, ధాన్యార్పణనుగానీ అర్పించకూడదు; దానిమీద పానార్పణను పోయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వింత ధూపం,’ ‘పరాయి ధూపం.’ ఇక్కడి హీబ్రూ విశేషణం ఆరాధనా సందర్భంలో అనుమతించబడని లేదా నిర్దేశించబడని దానిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: అర్పించకూడదు
  rationale: עלה హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకి ఎక్కించుట’ అనే భావం ఉన్నా, బలిపీఠ సంబంధ సందర్భంలో అది ‘అర్పించుట’ అనే ఆచారార్థాన్ని ఇస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: సందర్భంలోని ధూపవేదికను సూచిస్తుంది; స్థలసంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: קְטֹרֶת
  choice: ధూపం
  rationale: ఈ నామవాచకం ధూపాన్ని సూచిస్తుంది; అర్పణ భావం క్రియలోనే వ్యక్తమవుతుంది.
- source_word: זָרָה
  choice: అనుమతి లేని
  rationale: యాజక-ఆరాధనా సందర్భంలో నిర్దేశించబడని లేదా అనుమతించబడని దానిని సూచిస్తుంది. ‘వింత’ లేదా ‘విదేశీ’ కంటే ఆధునిక పాఠకులకు నియమాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעֹלָה
  choice: దహనబలి
  rationale: עֹלָהకు ఆచార సంబంధమైన ప్రామాణిక తెలుగు పదం; నిషేధిత అంశాల వరుసను ‘గానీ’తో సహజంగా కలిపాం.
- source_word: וּמִנְחָה
  choice: ధాన్యార్పణ
  rationale: యాజక సంబంధ సందర్భంలో מִנְחָה సాధారణంగా ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: וְנֵסֶךְ
  choice: పానార్పణ
  rationale: పోయబడే ద్రవ అర్పణను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִסְּכוּ
  choice: పోయకూడదు
  rationale: ఈ సందర్భంలో נסך పానార్పణను పోయడాన్ని సూచిస్తుంది; నిషేధ ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ధూపాన్ని విశేషించే זָרָה యొక్క ఆరాధనా సంబంధ స్థితి
  choice: అనుమతి లేని ధూపం
  alternative: వింత ధూపం; పరాయి ధూపం
  rationale: వాక్యం ధూపవేదికపై సముచిత ఆరాధనను నియంత్రిస్తోంది. ఈ అనువాదం జాతిపరమైన ‘విదేశీ’ భావాన్ని అనవసరంగా చేర్చకుండా, నిర్దేశిత విధానానికి వెలుపల ఉన్న ధూపం అనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా పదజాలం వాడబడింది. వరుస నిషేధాలను సహజంగా చూపేందుకు ‘గానీ’ నిర్మాణం ఉపయోగించబడింది; మూలంలోని రెండు క్రియాత్మక నిషేధాలు నిలుపబడ్డాయి.
