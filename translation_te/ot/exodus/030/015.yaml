source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: te
  text: ధనవంతుడు అర షెకెలు కంటే ఎక్కువ ఇవ్వకూడదు; పేదవాడు అర షెకెలు కంటే తక్కువ ఇవ్వకూడదు. మీ ప్రాణాల[a] కోసం ప్రాయశ్చిత్తం చేయడానికి యాహ్వేకు కానుకను ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ వ్యక్తుల కోసం” లేదా “మీ జీవితాల కోసం.” హీబ్రూ నెఫెష్ అనే పదానికి ప్రాణం, జీవితం, వ్యక్తి, లేదా స్వయం అనే అర్థాలు ఉండవచ్చు. ఈ జనగణన చెల్లింపు సందర్భంలో లెక్కించబడిన ప్రజల ప్రాణాలు లేదా వ్యక్తులే ఉద్దేశంగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: ధనవంతుడు
  rationale: నిర్దిష్ట విశేషణం ఇక్కడ ఒక వర్గానికి ప్రతినిధిగా వాడబడింది; ఆధునిక తెలుగులో ఏకవచన రూపం సహజంగా ఆ వర్గాన్ని సూచిస్తుంది.
- source_word: יַרְבֶּה
  choice: ఎక్కువ ఇవ్వకూడదు
  rationale: నిర్ణయించబడిన చెల్లింపు సందర్భంలో ‘పెంచకూడదు’ అనే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הַדַּל
  choice: పేదవాడు
  rationale: ఆర్థికంగా తక్కువ స్థితిలో ఉన్న వ్యక్తిని సూచిస్తూ ‘ధనవంతుడు’ అనే పదానికి సమతుల్యమైన వ్యతిరేక పదంగా నిలుస్తుంది.
- source_word: יַמְעִיט
  choice: తక్కువ ఇవ్వకూడదు
  rationale: ముందటి ‘ఎక్కువ ఇవ్వకూడదు’ అనే న్యాయసూత్రానికి సమాంతరంగా, నిర్ణీత మొత్తాన్ని తగ్గించకూడదనే భావాన్ని ఇస్తుంది.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: అర షెకెలు కంటే
  rationale: హీబ్రూ తులనార్థక నిర్మాణాన్ని తెలుగులో సహజంగా తెలియజేసి, నిర్ణీత మొత్తం అర షెకెలు అని స్పష్టం చేస్తుంది.
- source_word: תְּרוּמַת יְהוָה
  choice: యాహ్వేకు కానుక
  rationale: తెరూమా అనేది పవిత్ర ప్రయోజనం కోసం వేరుచేసి ఇచ్చే కానుక/సమర్పణ; ఈ జనగణన చెల్లింపు సందర్భంలో ‘కానుక’ సులభంగా అర్థమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సమీప లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: ఆరాధనా సందర్భంలోని כפר పదానికి ఉన్న ధార్మిక విస్తృతిని నిలుపుతూ, ఏకైక ప్రాయశ్చిత్త సిద్ధాంతాన్ని బలవంతంగా చొప్పించదు.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: మీ ప్రాణాల కోసం
  rationale: జనగణన-విమోచన సందర్భంలో నెఫెష్ లెక్కించబడిన వ్యక్తుల జీవితం లేదా వ్యక్తిత్వాన్ని సూచిస్తుంది; కేవలం దేహరహిత ఆత్మను కాదు.
- source_word: לָתֵת
  choice: ఇచ్చేటప్పుడు
  rationale: నిర్ణీత మొత్తాన్ని యాహ్వేకు కానుకగా సమర్పించే సందర్భాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అనుసంధానిస్తుంది.
theological_decisions:
- issue: YHWH దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైనంత సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: נֶפֶשׁ పద భావం
  choice: మీ ప్రాణాల కోసం
  alternative: మీ ఆత్మల కోసం; మీ కోసం
  rationale: ఈ జనగణన-విమోచన సందర్భంలో పదం వ్యక్తుల ప్రాణాలు/జీవితాలను సూచిస్తుంది; మానవ స్వభావంపై తరువాతి సిద్ధాంతాన్ని ఇందులోకి దిగుమతి చేయదు.
- issue: כפר పద భావం
  choice: ప్రాయశ్చిత్తం చేయడానికి
  alternative: పరిహారం చేయడానికి; విమోచన వెల చెల్లించడానికి
  rationale: ఆరాధనా సంబంధమైన మూలపద విస్తృతిని కాపాడుతూ, ప్రాయశ్చిత్తం ఎలా పనిచేస్తుందనే ఒక నిర్దిష్ట సిద్ధాంతాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. సమాంతర నిషేధ నిర్మాణాన్ని నిలుపుతూ, అర షెకెలు అనే నిర్ణీత మొత్తం రెండు వర్గాలకూ వర్తిస్తుందని స్పష్టంచేయడానికి చివర ‘అందరూ అంతే ఇవ్వాలి’ అని భావస్పష్టీకరణ చేయబడింది.
