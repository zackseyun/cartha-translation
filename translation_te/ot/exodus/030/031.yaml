language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר שֶׁ֠מֶן מִשְׁחַת קֹ֨דֶשׁ יִהְיֶ֥ה זֶ֛ה לִ֖/י לְ/דֹרֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: te
  text: 'నీవు ఇశ్రాయేలీయులతో ఇలా చెప్పాలి: ‘ఇది మీ తరతరాలంతటా నాకు పవిత్ర అభిషేక తైలంగా ఉండాలి.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఆధునిక తెలుగులో మొత్తం ఇశ్రాయేలు సమాజాన్ని సహజంగా, సమగ్రంగా సూచించడానికి ‘ఇశ్రాయేలీయులు’ అని అనువదించాం.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: పవిత్ర అభిషేక తైలం
  rationale: సమాసంలోని భావాన్ని స్పష్టంగా నిలుపుతూ, పవిత్రీకరించబడిన అభిషేక నూనె అనే ఆచార సంబంధిత అర్థాన్ని గౌరవప్రదమైన తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: హెబ్రీలోని ప్రత్యక్ష సంబంధ సూచనను కాపాడుతుంది; ‘నా కోసం’ అని ఉద్దేశాన్ని అధికంగా నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల వరకు
  rationale: తరాల పరంపర అంతటా కొనసాగాల్సిన నియమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: లִי అనే పదంలో దేవునితో సంబంధం
  choice: నాకు
  alternative: నా కోసం
  rationale: ‘నాకు’ అనేది మూలంలోని విస్తృత సంబంధార్థాన్ని అలాగే ఉంచుతుంది; ప్రయోజనం లేదా వినియోగం అనే ఒకే భావానికి దాన్ని పరిమితం చేయదు.
- issue: יִהְיֶה యొక్క నియమాత్మక బలం
  choice: ఉండాలి
  alternative: ఉంటుంది
  rationale: ఈ సందర్భం దైవ ఆజ్ఞను తెలియజేస్తున్నందున ‘ఉండాలి’ అనేది సందర్భానుగుణమైన నియమాత్మక భావాన్ని వ్యక్తం చేస్తుంది; అయినా తైలపు స్థిర హోదా అనే భావాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ‘తైలం’ ఆచార సంబంధిత సందర్భానికి తగిన గంభీరతను ఇస్తుంది; అనవసర మతపరమైన విశిష్ట వ్యాఖ్యానాన్ని చేర్చలేదు.
