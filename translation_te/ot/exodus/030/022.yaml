base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/022.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు మూలరూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవిక ప్రసంగాన్ని ప్రారంభించే ఈ సాధారణ హీబ్రూ కథన సూత్రానికి ఆధునిక తెలుగులో ‘చెప్పాడు’ సహజంగా, స్పష్టంగా ఉంటుంది; వాక్యంలోని לֵאמֹר భావాన్ని ‘ఇలా’ ద్వారా ముందున్న ఉద్ధరణతో అనుసంధానిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కలిసి హీబ్రూ אֶל సూచించే సంభాషణ లక్ష్యాన్ని ఆధునిక తెలుగులో సహజమైన ‘తో’ విభక్తి తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి వచనంలో వచ్చే మాటల విషయాన్ని పరిచయం చేసే హీబ్రూ అవ్యయార్థక క్రియారూపాన్ని తెలుగులో సహజంగా ‘ఇలా’తో వ్యక్తం చేశాం.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనంలోని తదుపరి దశను సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా YHWH అనే వ్యక్తిగత దైవనామం ఉంది. దానిని ‘ప్రభువు’గా మార్చకుండా నామరూపంలో నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తదుపరి వచనంలోని ప్రత్యక్ష వాక్యానికి మార్గం సిద్ధం చేయడానికి చివర కోలన్ వాడబడింది; మూలంలోని పునరుక్త ‘మాట్లాడి—అంటూ’ సూత్రాన్ని తెలుగులో సహజంగా కుదించి ‘ఇలా చెప్పాడు’గా ఇచ్చాం.
