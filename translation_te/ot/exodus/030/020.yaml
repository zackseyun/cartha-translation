source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: te
  text: వారు సమావేశ గుడారంలోకి ప్రవేశించినప్పుడు, వారు చనిపోకుండా ఉండటానికి నీళ్లతో కడుక్కోవాలి; లేదా బలిపీఠం దగ్గరికి సేవ చేయడానికి, యాహ్వేకు అగ్ని ద్వారా అర్పించే అర్పణను దహనం చేయడానికి వచ్చినప్పుడు కూడా,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: వారు ... ప్రవేశించినప్పుడు
  rationale: ב + క్రియానామ రూపం కాలసూచకంగా ‘వారు ప్రవేశించినప్పుడు’ అనే అర్థం ఇస్తుంది; గుడారంలోకి జరిగే కదలికను ‘ప్రవేశించడం’ సహజంగా తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: దేవుడు ఇశ్రాయేలీయులతో కలుసుకునే పవిత్ర గుడారానికి ఇది స్థిరమైన, సులభంగా అర్థమయ్యే పేరు.
- source_word: יִרְחֲצוּ מַיִם
  choice: నీళ్లతో కడుక్కోవాలి
  rationale: హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, నీటితో శుద్ధిగా కడుక్కోవాలనే ఆచారపరమైన ఆజ్ఞను సహజ తెలుగు ప్రతిఫలిస్తుంది.
- source_word: וְלֹא יָמֻתוּ
  choice: చనిపోకుండా
  rationale: వ్యాకరణపరంగా ‘మరియు వారు చనిపోరు’ అని కూడా తీసుకోవచ్చు; సందర్భంలో కడుక్కోవడానికి ఉద్దేశం లేదా హెచ్చరికగా ఉన్న భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది. ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אוֹ
  choice: అలాగే ... వచ్చినప్పుడు కూడా
  rationale: ఇది కడుక్కోవలసిన రెండవ సందర్భాన్ని సూచిస్తుంది. పదశః ‘లేదా’ అయినా, తెలుగులో రెండు సందర్భాలకూ ఒకే ఆజ్ఞ వర్తిస్తుందని ఈ నిర్మాణం స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరికి ... వచ్చినప్పుడు
  rationale: נגשׁ ఆచార సంబంధ సందర్భంలో సమీపించడం లేదా దగ్గరికి రావడం అనే భావాన్ని ఇస్తుంది.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: యాజకులు నిర్వహించే పవిత్ర సేవను సాధారణ ఆధునిక తెలుగులో గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַקְטִיר
  choice: దహనం చేయడానికి
  rationale: కטר హిఫీల్ రూపం అర్పణను బలిపీఠంపై కాల్చి పొగగా పైకి వెళ్లేలా చేయడాన్ని సూచిస్తుంది; ‘దహనం చేయడం’ ఆ క్రియను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: אִשֶּׁה
  choice: అగ్నిలో అర్పించే అర్పణ
  rationale: ఈ బలిసంబంధ పదం అగ్ని ద్వారా అర్పించేదాన్ని సూచిస్తుంది. దీన్ని ‘దహనబలి’ అని అనువదిస్తే వేరే ప్రత్యేక బలిరకమైన עֹלָהతో కలిసిపోయే ప్రమాదం ఉంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ పాఠంలోని దేవుని ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: וְלֹא יָמֻתוּ అనే పరిణామ వాక్యభాగం
  choice: చనిపోకుండా
  alternative: లేదా, ‘లేకపోతే వారు చనిపోతారు’; పదశః, ‘మరియు వారు చనిపోరు.’
  rationale: కడుక్కోవాలనే ఆజ్ఞకు అనుసంధానమైన మరణశిక్ష తీవ్రతను నిలుపుతూ, సమన్వయ వాక్యమా, ఉద్దేశ/పరిణామ భావమా అనే హీబ్రూ సందిగ్ధతను పాదసూచికలో భద్రపరుస్తుంది.
- issue: దైవనామం יהוה
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందిస్తుంది.
- issue: אִשֶּׁה యొక్క బలిసంబంధ అర్థం
  choice: అగ్నిలో అర్పించే అర్పణ
  alternative: అగ్ని అర్పణ; ఆహార అర్పణ
  rationale: ఈ పదాన్ని ప్రత్యేకమైన ‘దహనబలి’గా నిర్ధారించకుండా, అగ్ని ద్వారా అర్పించే భావాన్ని ప్రధాన పాఠంలో ఉంచి, సాధ్యమైన పదప్రయోగాన్ని పాదసూచికలో చూపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూల వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచాం. రెండవ సందర్భంలోనూ కడుక్కోవాలనే ఆజ్ఞ వర్తిస్తుందని తెలుగులో స్పష్టత కోసం ‘కూడా కడుక్కోవాలి’ను పునరుక్తం చేశాం.
