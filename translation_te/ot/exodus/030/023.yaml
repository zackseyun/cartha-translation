source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: te
  text: '“నీవు అత్యుత్తమమైన సుగంధ ద్రవ్యాలను తీసుకో: సహజంగా కారే బోళం[a] ఐదువందల షెకెల్లు, సువాసనగల దాల్చినచెక్క దానిలో సగం, అంటే రెండువందల యాభై షెకెల్లు, సువాసనగల రెల్లు[b] రెండువందల యాభై షెకెల్లు,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్వచ్ఛమైన బోళం.” హీబ్రూ పదబంధం సహజ స్థితిలో స్వేచ్ఛగా కారే బోళాన్ని సూచించే అవకాశముంది.
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా “సువాసనగల వస.” హీబ్రూ పదం మరింత సాధారణంగా సువాసనగల రెల్లు లేదా కాండాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: అత్యుత్తమమైన సుగంధ ద్రవ్యాలు
  rationale: בְּשָׂמִים సుగంధ పదార్థాలను సూచిస్తుంది; רֹאשׁ ఇక్కడ ‘ప్రధానమైన/శ్రేష్ఠమైన’ అనే గుణార్థంలో ఉంది. ఈ అనువాదం ఆ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מָר דְּרוֹר
  choice: స్వచ్ఛంగా కారే బోళం
  rationale: מָר అంటే బోళం; דְּרוֹר సహజ స్థితిలో స్వేచ్ఛగా కారే, కల్తీలేని ద్రవాన్ని సూచించే అవకాశముంది. ‘స్వచ్ఛంగా కారే’ అనే పదబంధం ప్రవాహం మరియు స్వచ్ఛత రెండింటి భావసంభావ్యతను అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: ఐదువందల షెకెల్లు
  rationale: హీబ్రూలో ఇక్కడ సంఖ్య మాత్రమే ఉన్నా, ఈ జాబితా సందర్భం మరియు 24వ వచనం కొలమానం షెకెల్ అని స్పష్టం చేస్తాయి. పరిమాణం అస్పష్టంగా ఉండకుండా తెలుగులో కొలమానాన్ని చేర్చాం.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: సువాసనగల దాల్చినచెక్క
  rationale: קִנְּמָן దాల్చినచెక్కను, בֶּשֶׂם దాని సుగంధ గుణాన్ని సూచిస్తాయి. ‘తియ్యని’ అనడం రుచిని సూచించవచ్చు కాబట్టి ‘సువాసనగల’ అనేది మరింత కచ్చితమైనది.
- source_word: מַחֲצִיתוֹ
  choice: దానిలో సగం
  rationale: ప్రత్యయం ముందు చెప్పిన ఐదువందల పరిమాణాన్ని తిరిగి సూచిస్తుంది. హీబ్రూ నిర్మాణాన్ని స్పష్టమైన తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: రెండువందల యాభై షెకెల్లు
  rationale: సగం ఎంతవుతుందో హీబ్రూ స్పష్టంగా సంఖ్యతో చెబుతుంది. తెలుగులో ‘అంటే’ ద్వారా వివరణాత్మక సంబంధాన్ని సహజంగా చూపించాం; సందర్భానుసార కొలమానాన్ని కూడా చేర్చాం.
- source_word: קְנֵה בֹשֶׂם
  choice: సువాసనగల రెల్లు
  rationale: קָנֶה అంటే రెల్లు లేదా కాండం; בֹשֶׂם దాని సువాసనను సూచిస్తుంది. నిర్దిష్ట వృక్షజాతిని ఖరారు చేసే ‘వస’ వంటి పదం కంటే ‘సువాసనగల రెల్లు’ మూలంలోని సాధారణ వృక్షపదాన్ని కాపాడుతుంది.
