translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఆజ్ఞారూపంలోని ఏకవచన ‘నీవు’ నిలుపబడింది. వచనం తరువాతి వాక్యానికి కొనసాగుతున్నందున ముగింపులో కామా ఉంచబడింది. ‘బోళం’ బైబిలు సందర్భంలో స్థిరపడిన పదం; తక్కువ పరిచయమున్న వృక్షపదానికి పాదసూచిక ఇచ్చాం.
