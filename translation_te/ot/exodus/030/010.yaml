id: EXO.30.10
reference: Exodus 30:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: te
  text: అహరోను సంవత్సరానికి ఒకసారి దాని కొమ్ముల మీద ప్రాయశ్చిత్తం చేయాలి.[a] ప్రాయశ్చిత్తార్థమైన పాపపరిహార బలి రక్తంతో అతడు మీ తరతరాలన్నిటిలో సంవత్సరానికి ఒకసారి దాని కోసం ప్రాయశ్చిత్తం చేయాలి. అది యెహోవాకు అతి పరిశుద్ధమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాయశ్చిత్తాల పాపపరిహార బలి రక్తంతో.” హెబ్రీ పదబంధం అక్షరార్థంగా “ప్రాయశ్చిత్తాల పాపపరిహార బలి రక్తం నుండి” అని ఉంది.
    reason: హెబ్రీ నిర్మాణంలోని బహువచన రూపాన్నీ, מִן అనే విభక్తి పదం అక్షరార్థాన్నీ చూపిస్తూ ప్రత్యామ్నాయ పఠనాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక బలి ఆచార సందర్భంలో כפר ఒక నిర్దిష్ట ప్రాయశ్చిత్త క్రియను సూచిస్తుంది. తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన ఈ పదబంధం ఆ ఆచారార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קַרְנֹתָיו
  choice: దాని కొమ్ముల మీద
  rationale: సర్వనామ ప్రత్యయం ముందటి సందర్భంలోని ధూపవేదికను సూచిస్తుంది; అందువల్ల తెలుగులో జడవస్తువుకు సహజమైన ‘దాని’ వాడబడింది.
- source_word: אַחַת בַּשָּׁנָה
  choice: సంవత్సరానికి ఒకసారి
  rationale: హెబ్రీ పంపిణీ భావాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִדַּם
  choice: రక్తంతో
  rationale: מִן అక్షరార్థంగా ‘నుండి’ అయినా, ఇక్కడ బలి ఆచారంలో ఉపయోగించే సాధనాన్ని సూచిస్తుంది; తెలుగులో కరణార్థక ‘తో’ సహజం.
- source_word: חַטַּאת
  choice: పాపపరిహార బలి
  rationale: ఈ యాజక సందర్భంలో పదం పాపం అనే భావనకన్నా బలిని సూచిస్తుంది. ‘పాపపరిహార బలి’ సాధారణ పాఠకునికి ఆ బలి స్వభావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్తార్థమైన
  rationale: హెబ్రీలోని బహువచన రూపాన్ని తెలుగులో కృత్రిమంగా అనుకరించకుండా, ఈ బలి ప్రాయశ్చిత్త దినపు లేదా ప్రాయశ్చిత్తానికి సంబంధించిన బలి అనే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలన్నిటిలో
  rationale: నియమం వరుస తరాలకు వర్తిస్తుందనే నిరంతర భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనది
  rationale: హెబ్రీ అత్యున్నత స్థాయి సూచించే నిర్మాణాన్ని స్థలమైన ‘అతి పరిశుద్ధ స్థలం’తో గందరగోళం కలగకుండా గుణవాచకంగా అనువదిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవ నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా పరిచయమైన రూపంలో సూచిస్తుంది; לְ అంకితం లేదా సంబంధ భావాన్ని ‘కు’ తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హెబ్రీ పాఠంలోని వ్యక్తిగత నామాన్ని పాఠ్యంలో కనిపించేలా ఉంచుతూ, సాధారణ తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం. ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉండవచ్చు; ‘ప్రభువు’ గౌరవప్రద సంప్రదాయ పఠనం అయినా, అది నామాన్ని బిరుదుగా మార్చుతుంది.
- issue: כפר యొక్క బలి ఆచార భావం
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: శుద్ధి చేయడం
  rationale: ఈ క్రియ వేదికకు సంబంధించిన ఆచార శుద్ధిని కూడా సూచించవచ్చు. అయితే విస్తృతమైన బలి-సంబంధ భావాన్ని ముందుగానే ఒక్క ‘శుద్ధి’ అర్థానికి పరిమితం చేయకుండా ‘ప్రాయశ్చిత్తం’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ప్రాయశ్చిత్తం’, ‘పాపపరిహార బలి’, ‘అతి పరిశుద్ధమైనది’ వంటి స్థిరమైన ఆచార పదాలు నిలుపబడ్డాయి. [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
