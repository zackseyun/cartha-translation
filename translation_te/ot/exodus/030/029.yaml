source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: te
  text: వాటిని ప్రతిష్ఠించు; అవి అత్యంత పరిశుద్ధమైనవి అవుతాయి. వాటిని తాకే ఏదైనా పరిశుద్ధమవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “పరిశుద్ధమైనదిగా ఉంటుంది” లేదా “ప్రతిష్ఠితమవుతుంది.” స్పర్శ ద్వారా పరిశుద్ధ స్థితిలోకి రావడాన్ని హెబ్రీ క్రియ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: ప్రతిష్ఠించాలి
  rationale: קדשׁ పియేల్ రూపం ఆరాధనా సందర్భంలో దేనినైనా పరిశుద్ధమైనదిగా ప్రత్యేకించడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రతిష్ఠించాలి’ ఈ ఆచారపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: సమీప సందర్భంలో చెప్పబడిన ప్రత్యక్ష గుడారపు సామగ్రినీ సంబంధిత వస్తువులనీ సూచించే బహువచన కర్మ సర్వనామం.
- source_word: וְהָיוּ
  choice: అవి ... ఉంటాయి
  rationale: ప్రతిష్ఠించే చర్య తరువాత కలిగే స్థితిని తెలిపే సాధారణ సంధాన వాక్యం.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అతి పరిశుద్ధమైనవిగా
  rationale: ‘పరిశుద్ధతల పరిశుద్ధత’ అనే హెబ్రీయ అతిశయోక్తి నిర్మాణం అత్యున్నత స్థాయి పరిశుద్ధతను సూచిస్తుంది; తెలుగులో ‘అతి పరిశుద్ధమైనవి’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: כָּל הַנֹּגֵעַ
  choice: తాకేదేదైనా
  rationale: ‘తాకేది అంతా’ అనే సాధారణ, విస్తృత పరిధిని ఇది నిలుపుతుంది; తాకేది వ్యక్తేనా వస్తువేనా అని అనవసరంగా పరిమితం చేయదు.
- source_word: בָּהֶם
  choice: వాటిని
  rationale: ఇప్పుడే ప్రతిష్ఠించబడిన వస్తువులను సూచించే పూర్వప్రత్యయ సహిత బహువచన సర్వనామం.
- source_word: יִקְדָּשׁ
  choice: పరిశుద్ధమవుతుంది
  rationale: קדשׁ కాల్ అసంపూర్ణ రూపం ఇక్కడ స్థితి మార్పును సూచించగలదు. ‘పరిశుద్ధమవుతుంది’ అనే పదబంధం తాకడం వల్ల కలిగే ఫలితాన్ని వ్యక్తం చేస్తూ మూలంలోని భావ సందిగ్ధతను కాపాడుతుంది.
theological_decisions:
- issue: స్పర్శ ద్వారా కలిగే పరిశుద్ధత స్వభావం
  choice: ప్రతిష్ఠిత వస్తువులను తాకేది పరిశుద్ధమవుతుందని మాత్రమే వాక్యం చెబుతుంది; ఆ పరిశుద్ధత ఆశీర్వాదకరమా, ప్రమాదకరమా, లేక ప్రత్యేక నియమాలకు లోబరుస్తుందా అనేది నిర్ధారించదు.
  alternative: దీనిని సానుకూల ప్రతిష్ఠగా మాత్రమే అర్థం చేసుకోవడం, లేదా పరిశుద్ధ పరిధిలోకి వచ్చి దాని ప్రమాదాలకు లేదా నియంత్రణలకు లోబడటంగా స్పష్టీకరించడం.
  rationale: హెబ్రీ మూలం కేవలం ‘పరిశుద్ధమవుతుంది/పరిశుద్ధంగా ఉంటుంది’ అని చెబుతుంది. విస్తృత ఆచార సిద్ధాంతాన్ని వాక్యంలోకి చేర్చకుండా దాని ధార్మిక ఉద్వేగాన్నీ భావ సందిగ్ధతనూ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ఆరాధనా సందర్భానికి తగిన ‘ప్రతిష్ఠించాలి,’ ‘అతి పరిశుద్ధమైనవి’ అనే పదాలను వాడుతూ, సాధారణ పాఠకులకు అర్థమయ్యే సరళ వాక్య నిర్మాణాన్ని పాటించాం.
