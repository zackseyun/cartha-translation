  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: te
  text: సాక్ష్యపు మందసం[a] ఎదుటనున్న తెర ముందు, సాక్ష్యంపై ఉన్న ప్రాయశ్చిత్త మూత[b] ముందు దానిని ఉంచాలి. అక్కడ నేను నిన్ను కలుసుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘సాక్ష్యపు మందసం’ అనే ఉంది; సంప్రదాయంగా కొన్నిసార్లు ‘నిబంధన మందసం’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కరుణాపీఠం.’ ఇది సాక్ష్యపు మందసం మీదనున్న బంగారు మూత.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: దానిని ఉంచాలి
  rationale: נתן ఇక్కడ ఆరాధనా సామగ్రిని నిర్దిష్ట స్థలంలో పెట్టడాన్ని సూచిస్తుంది. ‘ఉంచాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞార్థాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: ముందు
  rationale: రెండుసార్లు వచ్చిన ఈ పదబంధంలోని స్థానసూచక భావాన్ని ఒకే విధంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַפָּרֹכֶת
  choice: తెర
  rationale: ఇది పరిశుద్ధ స్థలాలను వేరుచేసే లోపలి తెరను సూచిస్తుంది. ‘తెర’ సాధారణ ఆధునిక పాఠకులకు స్పష్టమైన పదం.
- source_word: אֲרֹן הָעֵדֻת
  choice: సాక్ష్యపు మందసం
  rationale: మూలంలోని עֵדוּתకు ‘సాక్ష్యం’ అనే అర్థాన్ని నిలుపుతూ, ఇక్కడ లేని ‘నిబంధన’ అనే పదాన్ని చేర్చలేదు.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసం మీదనున్న బంగారు మూతను, దాని ప్రాయశ్చిత్త సంబంధిత విధిని సూచిస్తుంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువును ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: అక్కడ నేను నిన్ను కలుసుకుంటాను
  rationale: יעד నిఫాల్ రూపం ఇక్కడ నియమిత కలయికను సూచిస్తుంది. ‘కలుసుకుంటాను’ సహజంగా ఉండి దేవుడు మోషేతో అక్కడ కలిసే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הַכַּפֹּרֶת అనే ఆరాధనా పదం అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం
  rationale: మూలపదం మందసం మీదనున్న మూతను సూచిస్తూ ప్రాయశ్చిత్త భావాన్నీ కలిగి ఉంది. ప్రధాన పాఠ్యంలో వస్తువు మరియు విధి రెండూ అర్థమయ్యే రూపాన్ని ఉపయోగించి, సంప్రదాయ పదాన్ని పాదసూచికలో నిలిపాం.
- issue: עֵדוּת పదాన్ని మందసం పేరులో అనువదించడం
  choice: సాక్ష్యం
  alternative: నిబంధన
  rationale: ఈ వచనంలో హెబ్రీ పదం ‘సాక్ష్యం’; ‘నిబంధన’ అనేది పరిచితమైన సంప్రదాయ పదబంధమైనా, ఇక్కడి మూలపదానికి నేర అనువాదం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. לפני పునరుక్తిని ‘ముందు’ అని నిలిపి వచనంలోని స్థాన నిర్మాణాన్ని స్పష్టంగా ఉంచాం. మూలంలోని ఏకవచన సంబోధనను క్రియారూపాల ద్వారా వ్యక్తం చేశాం.
