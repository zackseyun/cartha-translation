revisions:
- from: “నీవు ఇశ్రాయేలు కుమారుల జనసంఖ్యను లెక్కించేటప్పుడు[a], వారిలో లెక్కించబడిన ప్రతి పురుషుడు, వారిని లెక్కించే సమయంలో తన ప్రాణానికి పరిహారధనంగా యెహోవాకు చెల్లించాలి[b]. అప్పుడు వారిని లెక్కించేటప్పుడు వారిలో తెగులు రాదు.”
  to: “నీవు ఇశ్రాయేలు కుమారుల జనగణనను నిర్వహించేటప్పుడు[a], ప్రతి పురుషుడు వారిని లెక్కించే సమయంలో తన ప్రాణం కోసం యాహ్వేకు పరిహారధనం చెల్లించాలి[b]; వారిని లెక్కించేటప్పుడు వారిలో తెగులు ఉండదు.”
  rationale: The revision keeps the repeated census timing, the individual payment, and the plague warning, while making the Telugu syntax direct and natural. It also aligns the transliteration of יהוה with the POB decision to render the name as Yahweh. The wording does not force a distinction between purpose and result in the final clause.
