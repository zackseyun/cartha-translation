  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: te
  text: “నీవు ఇశ్రాయేలు కుమారుల జనగణనను నిర్వహించేటప్పుడు[a], ప్రతి పురుషుడు వారిని లెక్కించే సమయంలో తన ప్రాణం కోసం యాహ్వేకు పరిహారధనం చెల్లించాలి[b]; వారిని లెక్కించేటప్పుడు వారిలో తెగులు ఉండదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల తలను ఎత్తినప్పుడు.” ఇది జనగణన చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “తన ప్రాణం కోసం పరిహారధనం” అనే మాటను “తనకోసం పరిహారధనం” అని కూడా అనువదించవచ్చు. ఇక్కడ హీబ్రూ నెఫెష్ అనే పదం ‘ఆత్మ’ మాత్రమే కాకుండా ‘ప్రాణం’ లేదా ‘వ్యక్తి’ అని కూడా అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: లెక్కించేటప్పుడు
  rationale: న్యాయసంబంధమైన ఈ ఆదేశంలో ఇది ఎదురుచూసే సందర్భాన్ని సూచిస్తుంది; షరతుకన్నా కాలసంబంధ భావం సహజంగా సరిపోతుంది.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: జనసంఖ్యను లెక్కించు
  rationale: అక్షరార్థంగా ‘తలను ఎత్తు’ అయిన ఈ హీబ్రూ నుడికారం ఇక్కడ జనగణన చేయడాన్ని సూచిస్తుంది; తెలుగులో భావాన్ని సహజంగా తెలిపే రూపం ఎంచుకోబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధమైన, పుంలింగ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: לִפְקֻדֵיהֶם
  choice: వారిలో లెక్కించబడిన
  rationale: פקד ధాతువులోని జనగణన లేదా నమోదుచేయడం అనే పరిపాలనా భావాన్ని సందర్భానుసారంగా తెలుపుతుంది.
- source_word: וְנָתְנוּ אִישׁ
  choice: ప్రతి పురుషుడు ... చెల్లించాలి
  rationale: אִישׁ యొక్క విభజక ఏకవచన భావాన్ని, లెక్కించబడే ప్రతి పురుషునిపై విడివిడిగా వర్తించే బాధ్యతను తెలుపుతుంది.
- source_word: כֹּפֶר
  choice: పరిహారధనం
  rationale: తీర్పు లేదా ప్రాణనష్టాన్ని నివారించేందుకు చెల్లించే ప్రత్యామ్నాయ మూల్యాన్ని సూచిస్తుంది; తెలుగు పాఠకునికి ‘విమోచన వెల’ కంటే ఈ న్యాయపరమైన భావం స్పష్టంగా ఉంటుంది.
- source_word: נַפְשׁוֹ
  choice: తన ప్రాణానికి
  rationale: נפש ఇక్కడ అమూర్తమైన ‘ఆత్మ’ను తప్పనిసరిగా సూచించదు; వ్యక్తి జీవితం లేదా తనను తానే సూచించే సందర్భార్థాన్ని ‘ప్రాణం’ నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచి, לְ ఉపసర్గను చెల్లింపును స్వీకరించేవాడిని సూచించే ‘కు’గా అనువదించింది.
- source_word: בִּפְקֹד אֹתָם
  choice: వారిని లెక్కించే సమయంలో
  rationale: బెత్ ఉపసర్గతో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; మూలంలోని లెక్కింపు పదపునరుక్తిని నిలుపుతుంది.
- source_word: נֶגֶף
  choice: తెగులు
  rationale: దైవిక దెబ్బ లేదా మరణకర వ్యాధి వ్యాప్తి భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: అప్పుడు ... వారిలో తెగులు రాదు
  rationale: పరిహారధనం చెల్లించడం వల్ల కలిగే ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, హీబ్రూ వావ్ సంబంధాన్ని అతిగా నిర్దిష్టమైన ఉద్దేశ్యార్థంగా మార్చదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా ఉంచబడింది; ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ఇది పూర్తిగా పరిష్కరించినట్లు ప్రకటించదు.
- issue: נַפְשׁוֹ యొక్క సందర్భార్థం
  choice: తన ప్రాణానికి
  alternative: తనకోసం; తన ఆత్మకోసం
  rationale: జనగణనకు సంబంధించిన పరిహార చెల్లింపు సందర్భంలో נפש జీవితం లేదా వ్యక్తిని సూచిస్తుంది. ‘ఆత్మ’ అని అనువదిస్తే మూలం తప్పనిసరిగా చెప్పని శరీరరహిత ఆత్మసంబంధ సిద్ధాంతం దిగుమతి కావచ్చు.
- issue: בְּנֵי יִשְׂרָאֵל మరియు אִישׁ లోని లింగ సూచన
  choice: ఇశ్రాయేలు కుమారులు ... ప్రతి పురుషుడు
  alternative: ఇశ్రాయేలీయులు ... ప్రతి వ్యక్తి
  rationale: మూలంలోని పుంలింగ రూపాలను, ముఖ్యంగా చెల్లింపుదారునిగా אִישׁ అనే ఏకవచన పురుషుని సూచనను, లింగతటస్థంగా సమతలీకరించకుండా నిలుపుతుంది.
- issue: పరిహార చెల్లింపు మరియు తెగులు మధ్య సంబంధం
  choice: అప్పుడు ... తెగులు రాదు
  alternative: తెగులు రాకుండా
  rationale: వాక్యం చెల్లింపును తెగులు లేకపోవడంతో అనుసంధానిస్తుంది. అయితే ఉద్దేశ్యం, ఫలితం రెండింటిలో ఒక్కదానినే వ్యాకరణపరంగా కఠినంగా నిర్ణయించకుండా సాధారణ ఫలిత సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన శైలి, కానీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం. పరిపాలనా జనగణన భావానికి ‘జనసంఖ్యను లెక్కించు’, כפר కు న్యాయపరమైన ‘పరిహారధనం’, נגף కు సహజమైన ‘తెగులు’ వాడబడ్డాయి. మూలంలోని లెక్కింపు పదపునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
