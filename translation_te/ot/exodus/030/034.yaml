revisions:
- from: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “నీ కోసం సుగంధ ద్రవ్యాలు తీసుకో: నాటాఫు, షెహెలెతు[a], గల్బాను అనే సుగంధ ద్రవ్యాలనూ, స్వచ్ఛమైన సాంబ్రాణినీ తీసుకో. అవన్నీ సమాన భాగాల్లో ఉండాలి.”'
  to: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “నీ కోసం సుగంధ ద్రవ్యాలు తీసుకో: నాటాఫు, షెహెలెతు, గల్బాను అనే సుగంధ ద్రవ్యాలు, అలాగే స్వచ్ఛమైన సాంబ్రాణి. ఇవన్నీ సమాన భాగాలుగా ఉండాలి.”'
  rationale: The revision preserves every listed ingredient and the equal-proportion instruction, while making the repeated “spices” phrase and the coordination with pure frankincense clearer and more idiomatic in modern standard Telugu. The uncertainty footnote remains correctly anchored to షెహెలెతు and continues to cover both uncertain terms named in the text.
