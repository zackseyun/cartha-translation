id: EXO.30.34
reference: Exodus 30:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “నీ కోసం సుగంధ ద్రవ్యాలు తీసుకో: నాటాఫు, షెహెలెతు, గల్బాను అనే సుగంధ ద్రవ్యాలు, అలాగే స్వచ్ఛమైన సాంబ్రాణి. ఇవన్నీ సమాన భాగాలుగా ఉండాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపే క్రమార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קַח לְךָ
  choice: నీ కోసం ... తీసుకో
  rationale: ఆజ్ఞారూపంతో ఉన్న לְךָ లోని వ్యక్తిగత లేదా ప్రతిఫలార్థ ఛాయను స్పష్టంగా నిలిపాం.
- source_word: סַמִּים
  choice: సుగంధ ద్రవ్యాలు
  rationale: ధూపం తయారీలో ఉపయోగించే పరిమళ పదార్థాలకు ఇది సాధారణంగా అర్థమయ్యే విస్తృత తెలుగు పదబంధం.
- source_word: נָטָף
  choice: నాటాఫు
  rationale: ఈ నిర్దిష్ట సుగంధ పదార్థపు గుర్తింపు అనిశ్చితమైనందున, ఊహాత్మక వృక్షశాస్త్ర సమానార్థాన్ని పెట్టకుండా హెబ్రీ పదాన్ని తెలుగు లిపిలో ఇచ్చాం.
- source_word: שְׁחֵלֶת
  choice: షెహెలెతు
  rationale: ఈ పదార్థపు ఖచ్చితమైన గుర్తింపు అనిశ్చితం; అందువల్ల సంప్రదాయ ఆంగ్ల పదాన్ని ఆధారంగా చేసుకోకుండా హెబ్రీ రూపాన్ని తెలుగు లిపిలో నిలిపాం.
- source_word: חֶלְבְּנָה
  choice: గల్బాను
  rationale: ఇది సాధారణంగా galbanum అనే సుగంధ జిగురుగా గుర్తించబడుతుంది; తెలుగులో గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לְבֹנָה זַכָּה
  choice: స్వచ్ఛమైన సాంబ్రాణి
  rationale: లెబోనా అనే ధూప పదార్థాన్ని ‘సాంబ్రాణి’గా, זַכָּה లోని స్వచ్ఛత భావాన్ని విశేషణంతో తెలిపాం.
- source_word: בַּד בְּבַד
  choice: సమాన భాగాల్లో
  rationale: పదార్థాలు సమాన నిష్పత్తిలో ఉండాలనే హెబ్రీ జాతీయార్థాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה
  choice: అవన్నీ ... ఉండాలి
  rationale: హెబ్రీ క్రియ ఏకవచనంలో ఉన్నా, జాబితాలోని పదార్థాలను సమిష్టిగా సూచిస్తున్న భావాన్ని తెలుగులో సహజమైన బహువచనంతో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. తెలియని ప్రాచీన సుగంధ పదార్థాలకు నిర్ధారణలేని తెలుగు సమానార్థాలు ఇవ్వకుండా లిప్యంతరీకరణ చేసి, అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
