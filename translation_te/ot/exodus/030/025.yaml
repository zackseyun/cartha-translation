source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ אֹת֗/וֹ שֶׁ֚מֶן מִשְׁחַת קֹ֔דֶשׁ רֹ֥קַח מִרְקַ֖חַת מַעֲשֵׂ֣ה רֹקֵ֑חַ שֶׁ֥מֶן מִשְׁחַת קֹ֖דֶשׁ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: te
  text: నీవు దానిని పరిమళ ద్రవ్యాల తయారీదారుని పనితనంతో చేసిన సుగంధ మిశ్రమమైన పవిత్ర అభిషేక తైలంగా తయారుచేయాలి[a]. అది పవిత్ర అభిషేక తైలంగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నైపుణ్యంగా కలిపిన సుగంధ తైలంగా’ లేదా ‘సమ్మేళనం చేసిన పరిమళ ద్రవ్యంగా’; హీబ్రూ పదాలు సుగంధ పదార్థాలను నిపుణుడు కలిపి చేసిన తయారీని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... తయారుచేయాలి
  rationale: ఆదేశాల సందర్భంలో సంయోజకంతో వచ్చిన ఖల్ సంపూర్ణ క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘తయారుచేయాలి’ ఆ నిర్దేశక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: ఈ కర్మ సర్వనామం ముందటి వచనంలో పేర్కొన్న పదార్థాలు లేదా వాటి మిశ్రమాన్ని సూచిస్తుంది.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: పవిత్ర అభిషేక తైలం
  rationale: ‘పవిత్రతకు చెందిన అభిషేక తైలం’ అనే నిర్మాణ భావాన్ని తెలుగులో సహజమైన, గౌరవప్రదమైన పదబంధంతో అందిస్తుంది; వచనం చివర కూడా అదే పదబంధాన్ని పునరావృతం చేసి మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: רֹקַח מִרְקַחַת
  choice: పరిమళభరిత మిశ్రమం
  rationale: ఒకే మూలానికి సంబంధించిన ఈ పదాలు సుగంధ పదార్థాలను నైపుణ్యంగా కలిపి చేసిన తయారీని సూచిస్తాయి. ‘పరిమళభరిత మిశ్రమం’ దాని సుగంధ, సమ్మేళన స్వభావాలను రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: సుగంధ ద్రవ్యాలు కలిపే నిపుణుని పనితనంతో
  rationale: అక్షరార్థంగా ‘కలిపేవాని/సుగంధ మిశ్రమాలు చేసేవాని పని.’ కేవలం వృత్తిపేరును వాడటంకంటే ఈ రూపం నైపుణ్యంతో చేసిన సుగంధ సమ్మేళనమనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: తయారైన తైలం పొందవలసిన స్థితిని ఈ అసంపూర్ణ క్రియ తెలియజేస్తుంది; నియమాత్మక సందర్భంలో ‘ఉండాలి’ సహజమైన తెలుగురూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన శాసన శైలిని ఉపయోగించాం. ‘తైలం,’ ‘అభిషేకం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచుతూ, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. మూలంలోని ‘పవిత్ర అభిషేక తైలం’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
