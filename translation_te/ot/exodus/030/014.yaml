source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: te
  text: లెక్కించబడినవారిలో చేరే, ఇరవై సంవత్సరాల వయసు నుండి పైబడిన ప్రతి ఒక్కరూ[a] యాహ్వేకు అర్పణ ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లెక్కించబడినవారి మధ్యగా వెళ్లే.” హెబ్రీ నుడికారం అక్షరార్థంగా లెక్కించబడినవారికి సంబంధించి ఒక వ్యక్తి “వెళ్లడం” లేదా “దాటడం” గురించి చెబుతుంది; ఇది బహుశా జనగణన ప్రక్రియను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: ప్రతి ఒక్కరూ
  rationale: తరువాతి కృదంత పదబంధంతో కలిసి ఇది సమూహంలోని ప్రతి వ్యక్తినీ విడివిడిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరూ’ సహజంగా ఆ పంపిణీ భావాన్ని తెలియజేస్తుంది.
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: లెక్కించబడినవారి మధ్యకు వెళ్లే
  rationale: עבר అనే క్రియలోని కదలిక భావాన్ని పూర్తిగా తొలగించకుండా, జనగణనలో లెక్కించబడిన వారి సమూహంలోకి చేరే ప్రక్రియను తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది. עַל సంబంధం సందర్భంలో ప్రయోగాత్మకంగా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: ఇరవై సంవత్సరాల వయసు మొదలుకొని అంతకంటే పైబడినవారు
  rationale: ఇది వయోపరిమితిని తెలిపే సాధారణ హెబ్రీ సూత్రం; ప్రారంభ హద్దైన ఇరవై సంవత్సరాలను కూడా చేర్చే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יִתֵּן
  choice: ఇవ్వాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపానికి నియమాత్మక లేదా ఆజ్ఞాత్మక బలం ఉంది; ఆధునిక తెలుగు న్యాయశైలిలో ‘ఇవ్వాలి’ సహజంగా ఆ బాధ్యతను తెలియజేస్తుంది.
- source_word: תְּרוּמַת
  choice: అర్పణ
  rationale: యాహ్వే కోసం ప్రత్యేకంగా కేటాయించి ఇచ్చే దానాన్ని సూచిస్తుంది. ‘అర్పణ’ ధార్మిక సందర్భాన్ని నిలుపుతూ, మూలంలో లేని ప్రత్యేక కర్మకాండార్థాన్ని జోడించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠ భేదాన్ని కాపాడుతుంది.
- issue: జనగణనకు సంబంధించిన עבר על הפקדים ప్రయోగాన్ని ఎంత స్పష్టీకరించాలి
  choice: లెక్కించబడినవారి మధ్యకు వెళ్లే
  alternative: లెక్కించబడినవారిలో చేరే / లెక్కించబడినవారి మధ్యగా వెళ్లే
  rationale: ఎవరైనా కేవలం ‘లెక్కించబడ్డారు’ అని సరళీకరించకుండా, హెబ్రీలోని వెళ్లడం లేదా దాటడం అనే ప్రక్రియాత్మక చిత్రాన్ని నిలుపుతుంది; అదే సమయంలో తెలుగులో జనగణన సందర్భం గ్రహించగలిగేలా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నియమాత్మక శైలిని వాడాం. వాక్య మధ్యంలోని దీర్ఘ విరామ చిహ్నాలు వయోపరిమితి పదబంధాన్ని స్పష్టంగా అనుసంధానిస్తాయి; మూలంలోని జనగణన నుడికారాన్ని పూర్తిగా సరళీకరించకుండా పాదసూచికతో దాని అస్పష్టతను నిలిపాం.
