id: EXO.30.30
reference: Exodus 30:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֥ן וְ/אֶת בָּנָ֖י/ו תִּמְשָׁ֑ח וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם לְ/כַהֵ֥ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: te
  text: నీవు అహరోనును, అతని కుమారులను అభిషేకించి, నాకు యాజకులుగా సేవ చేయడానికి వారిని ప్రతిష్ఠించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: అభిషేకించి
  rationale: משׁח అనే క్రియ పవిత్ర నియామకంలో నూనెతో అభిషేకించడాన్ని సూచిస్తుంది. ‘అభిషేకించు’ ఆ ఆచారపరమైన, దైవారాధన సంబంధమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְקִדַּשְׁתָּ
  choice: ప్రతిష్ఠించాలి
  rationale: Piel రూపంలోని קדשׁ ఇక్కడ ఒక పవిత్ర బాధ్యత కోసం ప్రత్యేకించడాన్ని సూచిస్తుంది. యాజక నియామక సందర్భంలో ‘ప్రతిష్ఠించాలి’ సహజంగా ఉండి, వారిని పవిత్ర సేవకు ప్రత్యేకించే భావాన్ని తెలియజేస్తుంది.
- source_word: לְכַהֵן
  choice: యాజకులుగా సేవ చేయడానికి
  rationale: כהן క్రియారూపం యాజక బాధ్యతను నిర్వర్తించడాన్ని సూచిస్తుంది. ‘యాజకులుగా సేవ చేయడానికి’ పాత్రను, క్రియాశీల సేవను రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న לְ, సేవ దేవునికి ఉద్దేశించబడిందని నేరుగా సూచిస్తుంది; ‘నాకు’ దీనిని సంక్షిప్తంగా, సమీపంగా అందిస్తుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులను
  rationale: మూలపాఠం నిర్దిష్టంగా కుమారులను సూచిస్తుంది; యాజక వంశ సందర్భానికి అనుగుణంగా లింగ నిర్దిష్టతను నిలుపుతుంది.
- source_word: וְאֶת ... וְאֶת
  choice: అహరోనును, అతని కుమారులను
  rationale: పునరుక్త కర్మసూచకం రెండు ప్రత్యక్ష కర్మలను గుర్తిస్తుంది. తెలుగులో విభక్తి ప్రత్యయాలతో వాటిని స్పష్టంగా చూపిస్తూ, సహజ వాక్య నిర్మాణం కోసం సమన్వయంగా అందించబడింది.
theological_decisions:
- issue: קדשׁ మరియు כהן పదాల ఆరాధనాచార సందర్భం
  choice: ‘ప్రతిష్ఠించాలి’, ‘యాజకులుగా సేవ చేయడానికి’ అని అనువదించడం
  alternative: ‘పరిశుద్ధపరచాలి’, ‘యాజక పరిచర్య చేయడానికి’
  rationale: ఈ వాక్యం అహరోనును, అతని కుమారులను పవిత్ర యాజక బాధ్యతకు నియమించడం గురించి చెబుతుంది. ఎంచుకున్న పదాలు తరువాతి కాలపు సంఘ పదజాలాన్ని రుద్దకుండా, యాజక నియామక సందర్భాన్ని ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతాయి.
- issue: בָּנָיו పదంలోని లింగ నిర్దిష్టత
  choice: ‘అతని కుమారులను’
  alternative: ‘అతని పిల్లలను’
  rationale: హీబ్రూ మూలపాఠం పురుష సంతానాన్నే నిర్దిష్టంగా సూచిస్తుంది; సందర్భంలో అహరోను కుమారుల యాజక సేవ ఉద్దేశించబడింది. అందువల్ల లింగ నిర్దిష్టతను సాధారణీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞారూప శైలిని ఉపయోగించాం. ‘అభిషేకించి … ప్రతిష్ఠించాలి’ అనే నిర్మాణం హీబ్రూలోని అనుసంధానిత ఆదేశాలను సహజంగా కలుపుతుంది; ఆచారపరమైన గంభీరతను కూడా కాపాడుతుంది.
