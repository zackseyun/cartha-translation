id: EXO.30.36
reference: Exodus 30:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: te
  text: దానిలో కొంతను బాగా సన్నని పొడిగా నూరాలి. నేను అక్కడ నిన్ను కలుసుకొనే సమావేశ గుడారంలో సాక్ష్యం ఎదుట దానిలో కొంతను ఉంచాలి. అది మీకు అత్యంత పరిశుద్ధమైనదిగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “పరిశుద్ధాలలో పరిశుద్ధమైనది.”
    reason: హీబ్రూ קֹדֶשׁ קָדָשִׁים నిర్మాణానికి మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: నూరాలి
  rationale: ధూపద్రవ్య మిశ్రమాన్ని మెత్తని పొడిగా చేయడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘దంచాలి’ కంటే ‘నూరాలి’ ఈ సందర్భానికి మరింత తగినది.
- source_word: מִמֶּנָּה
  choice: దానిలో కొంత
  rationale: ఇక్కడ מן + సర్వనామం భాగార్థకంగా ఉంది; మొత్తం మిశ్రమం కాక దానిలో కొంత భాగం ఉద్దేశించబడింది.
- source_word: הָדֵק
  choice: అతి మెత్తని పొడిగా
  rationale: క్రియను బలపరుస్తూ, ధూపద్రవ్యాన్ని అత్యంత సన్నని స్థితికి తీసుకురావాలని సూచిస్తుంది.
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: ఆచార సంబంధమైన నిర్దిష్ట స్థానంలో పెట్టడాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הָעֵדֻת
  choice: సాక్ష్యం ఎదుట
  rationale: హీబ్రూ పాఠంలోని ‘సాక్ష్యం’ అనే ఆరాధనా సంబంధ పదాన్నే నిలుపుతుంది; దానిని ‘సాక్ష్యపు మందసం’ లేదా ‘నిబంధన పలకలు’ అని వివరణాత్మకంగా విస్తరించదు.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: దేవుడు తన ప్రజలను నియమితంగా కలుసుకునే గుడారం అనే భావాన్ని ప్రత్యక్షంగా, ఆధునిక తెలుగులో అర్థమయ్యేలా అందిస్తుంది.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: నేను నిన్ను కలుసుకునే చోట
  rationale: יעד నిఫాల్ రూపంలోని నియమిత సమావేశ భావాన్ని సహజంగా తెలియజేస్తుంది; ఏకవచన సంబోధనను ‘నిన్ను’గా నిలుపుతుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పరిశుద్ధమైనది
  rationale: హీబ్రూ బలవర్ధక నిర్మాణం సూచించే అత్యున్నత పరిశుద్ధతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: תִּהְיֶה לָכֶם
  choice: అది మీకు ... ఉండాలి
  rationale: ఇశ్రాయేలీయులతో లేదా యాజకులతో ధూపద్రవ్యానికి ఉన్న సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది; బహువచనాన్ని ‘మీకు’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘సాక్ష్యం’ అనే పదం యొక్క నిర్దిష్ట సూచన
  choice: ‘సాక్ష్యం’ అనే ఆరాధనా సంబంధ పదాన్ని యథాతథంగా నిలుపడం
  alternative: ‘సాక్ష్యపు మందసం ఎదుట’ లేదా ‘నిబంధన పలకల ఎదుట’
  rationale: హీబ్రూ పాఠం మందసాన్ని గానీ పలకలను గానీ ఇక్కడ స్పష్టంగా పేర్కొనదు. అందువల్ల సాధ్యమైన సూచనను అనువాదంలో సంకుచితం చేయలేదు.
- issue: పరిశుద్ధతను తెలిపే బలవర్ధక నిర్మాణం
  choice: ప్రధాన పాఠంలో ‘అత్యంత పరిశుద్ధమైనది’
  alternative: ‘పరిశుద్ధాలలో పరిశుద్ధమైనది’
  rationale: ప్రధాన పాఠంలో హీబ్రూ బలవర్ధక భావాన్ని సహజ తెలుగులో అందిస్తూ, మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఆజ్ఞారూపాన్ని ‘-ాలి’తో సహజంగా వ్యక్తం చేశాం. దేవుడు మోషేతో మాట్లాడుతున్నందున ‘నిన్ను’ ఏకవచనంగా, చివరి సంబంధ వాక్యంలో לָכֶם ప్రకారం ‘మీకు’ బహువచనంగా నిలిపాం. పాదసూచిక గుర్తు అది వివరిస్తున్న పరిశుద్ధత పదబంధం తరువాతే ఉంచబడింది.
