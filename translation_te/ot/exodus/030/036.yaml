revisions:
- from: దానిలో కొంత తీసుకొని అతి మెత్తని పొడిగా నూరాలి. సమావేశ గుడారంలో నేను నిన్ను కలుసుకునే చోట, సాక్ష్యం ఎదుట దానిలో కొంత ఉంచాలి. అది మీకు అత్యంత పరిశుద్ధమైనదిగా ఉండాలి.[a]
  to: దానిలో కొంతను బాగా సన్నని పొడిగా నూరాలి. నేను అక్కడ నిన్ను కలుసుకొనే సమావేశ గుడారంలో సాక్ష్యం ఎదుట దానిలో కొంతను ఉంచాలి. అది మీకు అత్యంత పరిశుద్ధమైనదిగా ఉండాలి.[a]
  rationale: The revision removes an added action, uses a more accurate modern Telugu expression for grinding the incense to a fine powder, and clarifies the syntactic connection of the divine meeting clause to the tent of meeting. It otherwise retains the draft’s faithful terminology, number distinctions, and footnote anchor.
