    rationale: מַתְכֻּנֶת may refer to the prescribed composition, formula, or proportions. ‘దాని కూర్పు ప్రకారం’ preserves this range; proportions and formula can remain footnoted alternatives.
  revised_text: నీవు తయారుచేసే ధూపాన్ని దాని కూర్పు ప్రకారం[a] మీ కోసం మీరు తయారుచేసుకోకూడదు[b]; అది యాహ్వే కోసం నీకు పవిత్రమైనదిగా ఉండాలి.
