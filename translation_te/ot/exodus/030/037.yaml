base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: te
  text: నీవు తయారుచేసే ధూపాన్ని దాని కూర్పు ప్రకారం[a] మీ కోసం మీరు తయారుచేసుకోకూడదు[b]; అది యాహ్వే కోసం నీకు పవిత్రమైనదిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని తయారీ సూత్రం ప్రకారం’ లేదా ‘దాని నిష్పత్తుల ప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఈ పవిత్ర ధూప మిశ్రమాన్ని సాధారణ వ్యక్తిగత వినియోగం కోసం మళ్లీ తయారుచేసుకోకూడదు.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: ధూపం
  rationale: ఇది ముందటి సందర్భంలో నిర్దేశించిన పవిత్ర ధూప మిశ్రమాన్ని సూచిస్తుంది. ‘ధూపం’ ఆధునిక తెలుగులో సహజమైన, నేరమైన సమానార్థకం.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు తయారుచేసే
  rationale: ఏకవచన క్రియను నిలుపుతూ సంబంధవాచక వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: దాని మిశ్రమ నిష్పత్తి ప్రకారం
  rationale: ఈ సందర్భంలో పదం నిర్దేశిత కూర్పు, నిష్పత్తి లేదా తయారీ సూత్రాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ భావాలను అతిగా ఆధునిక సాంకేతిక పదజాలం లేకుండా అందిస్తుంది.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: మీ కోసం మీరు తయారుచేసుకోకూడదు
  rationale: క్రియలోని బహువచనాన్ని, לָכֶם లోని స్వప్రయోజన భావాన్ని నిలుపుతుంది; సాధారణ వ్యక్తిగత వినియోగం కోసం అదే మిశ్రమాన్ని చేయడాన్ని నిషేధిస్తుంది.
- source_word: קֹדֶשׁ
  choice: పవిత్రంగా
  rationale: పవిత్రమైనదిగా ప్రత్యేకింపబడిన స్థితిని తెలిపే ప్రామాణికమైన, ధార్మికంగా గంభీరమైన తెలుగు పదం; ‘అతి పవిత్రం’ అనే అధిక భావాన్ని చేర్చదు.
- source_word: תִּהְיֶה לְךָ
  choice: నీకు ... ఉండాలి
  rationale: ఇశ్రాయేలు దానిని పవిత్రమైనదిగా పరిగణించాలనే సంబంధ భావాన్ని, హెబ్రీలోని ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: దైవనామాన్ని పేరుగా వ్యక్తం చేస్తూ, לְ ఉపసర్గలోని అంకితం లేదా ప్రత్యేక కేటాయింపు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హెబ్రీ పాఠంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచింది. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
- issue: ఏకవచన, బహువచన సంబోధనల మధ్య మార్పు
  choice: ‘నీవు’ మరియు ‘మీరు’ రెండింటినీ నిలుపడం
  alternative: తెలుగులో అంతటా బహువచనంగా లేదా ఏకవచనంగా సమతలీకరించడం
  rationale: మూలంలో אֲשֶׁר תַּעֲשֶׂה, לְךָ ఏకవచనంగా ఉండగా, לֹא תַעֲשׂוּ לָכֶם బహువచనంగా ఉన్నాయి. ఈ ఉద్రిక్తతను నిశ్శబ్దంగా తొలగించకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఏకవచన ‘నీవు/నీకు’ మరియు బహువచన ‘మీ కోసం మీరు’ మార్పును ఉద్దేశపూర్వకంగా నిలిపాం. ‘మిశ్రమ నిష్పత్తి’ నిర్దేశిత కూర్పు భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
