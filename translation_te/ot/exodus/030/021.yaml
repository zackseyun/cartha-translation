source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: te
  text: వారు తమ చేతులను, కాళ్లను కడుక్కోవాలి, వారు చనిపోకుండా ఉండటానికి. ఇది వారికి శాశ్వతమైన నియమంగా[a] ఉండాలి—అతనికీ[b], అతని సంతానానికీ, వారి తరతరాలకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిరంతరమైన నియమం’ లేదా ‘ఎల్లకాలం నిలిచే నియమం’ అని కూడా అనువదించవచ్చు. חָק עוֹלָם అనేది దీర్ఘకాలం నిలిచే విధిని సూచించే సాధారణ హీబ్రూ న్యాయసూత్రం.
    reason: lexical_alternative
  - marker: b
    text: ‘అతనికి’ అనేది తక్షణ సందర్భంలో అహరోనును సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: కడుక్కోవాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలో ఈ క్రియకు విధి లేదా ఆజ్ఞ భావం ఉంది. ఆధునిక తెలుగులో ‘కడుక్కోవాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: తమ చేతులను, కాళ్లను
  rationale: రెండు శరీర భాగాలనూ స్పష్టంగా ఉంచి, కర్మ కర్తకే సంబంధించినదని ‘తమ’ ద్వారా సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: וְלֹא יָמֻתוּ
  choice: అప్పుడు వారు చనిపోరు
  rationale: కడుక్కోవడం వల్ల కలిగే ఫలితాన్ని లేదా దానితో ముడిపడిన ప్రాణహెచ్చరికను ఈ సందర్భంలో వ్యక్తం చేస్తుంది. ‘లేకపోతే చనిపోతారు’ అని ప్రతికూల షరతుగా మార్చకుండా మూలంలోని సానుకూల నిర్మాణాన్ని నిలిపింది.
- source_word: חָק
  choice: నియమం
  rationale: ఆరాధనకు సంబంధించిన స్థిరమైన విధిని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేసే న్యాయపరమైన పదం.
- source_word: עוֹלָם
  choice: శాశ్వత
  rationale: ఈ న్యాయసూత్రంలో దీర్ఘకాలం, తరతరాలపాటు నిలిచే విధి అనే బలాన్ని తెలియజేస్తుంది; పదానికి ఉండగల ‘నిరంతరమైన’ లేదా ‘ఎల్లకాలం నిలిచే’ భావాలను పాదటిప్పణి సూచిస్తుంది.
- source_word: לּוֹ
  choice: అతనికి
  rationale: మూలంలోని ఏకవచన సర్వనామాన్ని అలాగే నిలిపింది; తక్షణ సందర్భంలో అది అహరోనును సూచిస్తుంది.
- source_word: וּלְזַרְעוֹ
  choice: అతని సంతానానికి
  rationale: זֶרַע ఇక్కడ వంశపారంపర్య సంతతిని సమూహార్థకంగా సూచిస్తుంది. ‘సంతానం’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְדֹרֹתָם
  choice: వారి తరతరాల పాటు
  rationale: తరాల పరంపరలో నియమం కొనసాగుతుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חָק עוֹלָם అనే ఆరాధనా నియమపు కాలవ్యాప్తి
  choice: శాశ్వత నియమం
  alternative: నిరంతరమైన నియమం; ఎల్లకాలం నిలిచే నియమం
  rationale: హీబ్రూ సూత్రం ఒడంబడిక మరియు ఆరాధనా వ్యవస్థలో నిలిచే విధిని బలంగా సూచిస్తుంది. ‘శాశ్వత’ ఆ బలాన్ని నిలుపుతుంది; దాని ఖచ్చిత కాలపరిమితిపై ఒక ప్రత్యేక సిద్ధాంతాన్ని పాఠ్యంలో చొప్పించకుండా ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచింది.
- issue: బహువచనమైన ‘వారికి’ తరువాత ఏకవచనమైన ‘అతనికి’ రావడం
  choice: సర్వనామ మార్పును పాఠ్యంలో నిలపడం
  alternative: ‘అహరోనుకూ అతని సంతానానికీ’ అని పేరును నేరుగా చేర్చడం
  rationale: మూలంలోని బహువచన–ఏకవచన మార్పును చెరపకుండా ఉంచి, ఏకవచన సర్వనామం అహరోనును సూచిస్తుందని పాదటిప్పణిలో వివరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలిని ఉపయోగించింది. మూలంలోని వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, బహువచనం నుంచి ఏకవచనానికి జరిగే సర్వనామ మార్పును సవరించకుండా ఉంచింది.
