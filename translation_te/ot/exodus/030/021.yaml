  rationale: సవరణ కేవలం తెలుగు వాక్యనిర్మాణాన్ని, ముఖ్యంగా చివరి ‘తరతరాల’ పదబంధం యొక్క అనుసంధానాన్ని స్పష్టం చేస్తుంది. మరణించకుండా ఉండేందుకు కడుక్కోవాలనే మూల ఉద్దేశార్థాన్ని ‘వారు చనిపోకుండా ఉండటానికి’ ద్వారా మరింత ప్రత్యక్షంగా ఇచ్చింది. ఏకవచన సర్వనామంలోని సందర్భపరమైన అస్పష్టతను తొలగించలేదు; పాదటిప్పణిలోనే అహరోను సూచనగా ఉంచింది.
