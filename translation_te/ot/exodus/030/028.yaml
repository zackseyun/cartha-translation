  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: te
  text: దహనబలి బలిపీఠాన్ని, దాని ఉపకరణాలన్నిటినీ, గంగాళాన్ని, దాని పీటను[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని ఆధారాన్ని.’
    reason: כֵּן అనే పదాన్ని సందర్భానుసారం ‘పీట’ లేదా ‘ఆధారం’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: מִזְבַּח అంటే ‘బలిపీఠం’; הָעֹלָה పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది. ‘దహనబలి బలిపీఠం’ బలిసంబంధ పదజాలాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని ఉపకరణాలన్నీ
  rationale: כְּלִי ఇక్కడ బలిపీఠ సేవలో ఉపయోగించే పాత్రలు లేదా పనిముట్లను విస్తృతంగా సూచిస్తుంది. ‘ఉపకరణాలు’ ఆ పరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఏకవచన ప్రత్యయం బలిపీఠాన్ని సూచిస్తుంది.
- source_word: הַכִּיֹּר
  choice: గంగాళం
  rationale: כִּיּוֹר పరిశుద్ధస్థల సేవలో కడుక్కోవడానికి ఉపయోగించిన పెద్ద పాత్రను సూచిస్తుంది. ‘గంగాళం’ ఆలయ సందర్భానికి తగిన, తెలుగులో సుపరిచితమైన పదం.
- source_word: כַּנּוֹ
  choice: దాని పీట
  rationale: כֵּן ఇక్కడ గంగాళాన్ని మోసే ఆధార నిర్మాణాన్ని సూచిస్తుంది. ‘పీట’ దాని పనిని స్పష్టంగా తెలియజేస్తుంది; ‘ఆధారం’ కూడా సాధ్యమైన అనువాదం.
- source_word: וְאֶת
  choice: జాబితాలో కామాలతో అనుసంధానం
  rationale: పునరావృతమైన וְאֶת సంయోజకంతో కూడిన నిర్దిష్ట కర్మ సూచిక. తెలుగులో కర్మప్రత్యయం ప్రతి అంశానికి జోడించబడగా, కామాలతో జాబితా సహజంగా అనుసంధానించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సరళమైన జాబితా శైలి వాడబడింది. ఇది ముందున్న వాక్యానికి కొనసాగింపైన పదబంధం కావడంతో చివర సెమీకోలన్ ఉంచబడింది.
