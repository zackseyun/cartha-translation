- from: నీవు దానిని స్వచ్ఛమైన బంగారంతో పొదిగించాలి—దాని పైభాగాన్ని, చుట్టూ ఉన్న దాని ప్రక్కలను, దాని కొమ్ములను కూడా పొదిగించాలి. దాని చుట్టూ బంగారు అంచును[a] చేయాలి.
  to: దాని పైభాగానికీ, దాని చుట్టూ ఉన్న ప్రక్కలన్నిటికీ, దాని కొమ్ములకూ స్వచ్ఛమైన బంగారు తాపడం వేయాలి. దాని చుట్టూ బంగారు అంచును[a] చేయాలి.
  rationale: The revision replaces an inlaying verb with an idiomatic term for gold plating, clarifies that every surrounding side is included, and retains the source’s sequence, repeated encircling language, literal ‘horns,’ and the lexical ambiguity of זֵר.
