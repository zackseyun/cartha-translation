source:
  edition: WLC
  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: te
  text: దాని పైభాగానికీ, దాని చుట్టూ ఉన్న ప్రక్కలన్నిటికీ, దాని కొమ్ములకూ స్వచ్ఛమైన బంగారు తాపడం వేయాలి. దాని చుట్టూ బంగారు అంచును[a] చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చుట్టూ బంగారు కిరీటం.’ హెబ్రూ పదమైన జేర్ అంచు, పట్టీ లేదా కిరీటం వంటి అలంకారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: పొదిగించాలి
  rationale: ఈ నిర్మాణంలో צפה అనేది ఒక వస్తువు ఉపరితలానికి లోహపు పూత వేయడాన్ని సూచిస్తుంది. ‘పొదిగించాలి’ అనేది కేవలం కప్పడం కాకుండా బంగారంతో పైపూత వేయడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: ఈ పదబంధం అధిక శుద్ధిగల బంగారాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘స్వచ్ఛమైన బంగారం’ స్పష్టమైన సమానార్థకం.
- source_word: גַּגּוֹ
  choice: దాని పైభాగం
  rationale: גג సాధారణంగా ‘కప్పు’ అని అర్థమైనా, ఇక్కడ చిన్న ధూపవేదిక యొక్క పై ఉపరితలం ఉద్దేశించబడింది; అందువల్ల ‘పైభాగం’ సందర్భోచితం.
- source_word: קִירֹתָיו
  choice: దాని ప్రక్కలు
  rationale: అక్షరార్థంగా ‘దాని గోడలు’; అయితే చిన్న వేదిక యొక్క నిలువు ఉపరితలాలను తెలుగులో ‘ప్రక్కలు’ అని చెప్పడం సహజంగా ఉంటుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: వేదికను అన్ని వైపులా ఆవరించే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని రెండు చోట్లా నిలుపుతుంది.
- source_word: קַרְנֹתָיו
  choice: దాని కొమ్ములు
  rationale: వేదిక మూలలలో పైకి పొడుచుకొచ్చే ఆరాధనా సంబంధిత భాగాలకు వాడిన పదాన్ని రూపకాలంకారంగా మార్చకుండా యథార్థంగా నిలుపుతుంది.
- source_word: זֵר זָהָב
  choice: బంగారు అంచు
  rationale: זֵר పవిత్ర సామగ్రి చుట్టూ ఉండే పట్టీ, అంచు లేదా కిరీటం వంటి అలంకారాన్ని సూచిస్తుంది. ‘బంగారు అంచు’ దాని భౌతిక రూపాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆరాధనా సామగ్రికి సంబంధించిన పదాల అనువాదం
  choice: קַרְנֹתָיו ను ‘కొమ్ములు’గా, זֵר ను ‘అంచు’గా అనువదించడం
  alternative: זֵר ను ‘కిరీటం’గా అనువదించడం
  rationale: ఈ వచనం రాజరిక భావాన్ని బోధించడం కాకుండా ప్రత్యక్ష గుడారపు సామగ్రి నిర్మాణాన్ని వివరిస్తోంది. ‘కొమ్ములు’ అనే స్థిరమైన ఆరాధనా పదాన్ని నిలుపుతూ, ‘అంచు’ అనేది భౌతిక లక్షణాన్ని స్పష్టంగా చూపుతుంది. ‘కిరీటం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన నిర్మాణ ఆజ్ఞగా అనువదించబడింది. మూలంలోని రెండవ పురుష ఏకవచన ఆజ్ఞను ‘నీవు ... చేయాలి’ రూపంలో, ‘చుట్టూ’ అనే పునరుక్తిని, వేదిక ‘కొమ్ములు’ అనే ప్రత్యేక పదాన్ని నిలిపాం.
