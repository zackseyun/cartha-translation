  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన ఆజ్ఞా శైలిని వాడాం. మూలంలోని ‘అక్కడ’ అనే స్వల్ప అనిశ్చితిని నిలుపుకున్నాం; ‘దానిలో’ అని వివరణాత్మకంగా మార్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
