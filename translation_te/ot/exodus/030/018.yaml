base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: te
  text: కడగడానికి కంచుతో[b] ఒక గంగాళాన్ని[a], దానికి కంచుతో ఒక ఆధారాన్ని[c] చేయాలి. దానిని సమావేశ గుడారానికి, బలిపీఠానికి మధ్య ఉంచాలి; అక్కడ నీరు పోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గంగాళం’కు బదులుగా ‘కడిగే తొట్టి’ అని కూడా అనువదించవచ్చు; ఇది ఆరాధనా గుడారం వద్ద కడగడానికి ఉపయోగించే పెద్ద నీటి పాత్ర.
    reason: lexical_alternative
  - marker: b
    text: ‘కంచు’కు బదులుగా ‘రాగి’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదం సందర్భాన్ని బట్టి రాగిని లేదా రాగి మిశ్రమాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆధారం’కు బదులుగా ‘పీఠం’ లేదా ‘అడుగు భాగం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: గంగాళం
  rationale: ఆరాధనా స్థలంలో కడుక్కోవడానికి నీళ్లు ఉంచే పెద్ద పాత్రను సూచిస్తుంది. ‘గంగాళం’ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే, లోహంతో చేసిన పెద్ద నీటి పాత్రకు తగిన పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ హెబ్రీ పదం రాగిని లేదా రాగి మిశ్రమాన్ని సూచించవచ్చు. గుడార సంబంధ వస్తువుల సందర్భంలో ‘కంచు’ సహజమైన, సంప్రదాయానికి దగ్గరైన ఆధునిక తెలుగు ఎంపిక; ‘ఇత్తడి’ అనే పాత అనువాదం లోహశాస్త్రపరంగా మరింత నిర్దిష్టమైన మిశ్రమాన్ని సూచించగలదు.
- source_word: כַּן
  choice: పీఠం
  rationale: గంగాళాన్ని మోసే ఆధార నిర్మాణాన్ని సూచిస్తుంది. ‘పీఠం’ సంక్షిప్తంగా, సహజంగా దాని సహాయక పనిని తెలియజేస్తుంది.
- source_word: לְרָחְצָה
  choice: కడుక్కోవడానికి
  rationale: హెబ్రీ ఉద్దేశార్థక రూపాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది; ఈ వచనంలో స్పష్టంగా లేని కర్తను లేదా శరీర భాగాన్ని జోడించదు.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: దేవునితో నియమిత సమావేశానికి సంబంధించిన గుడారాన్ని సూచించే పదబంధానికి పారదర్శకమైన ఆధునిక తెలుగు రూపం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: ఈ సందర్భంలో బలులు అర్పించే వేదికను సూచించే సహజమైన తెలుగు పదం.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: మూలంలోని స్థలవాచక క్రియావిశేషణాన్ని అలాగే ఉంచుతుంది. ‘దానిలో’ అని మార్చి దాని సూచనను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: సాధారణ ఆధునిక తెలుగులో సహజంగా వినిపించే సామూహిక నామరూపం.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: చేయాలి ... ఉంచి ... పోయాలి
  rationale: ఆరాధనా గుడార నిర్మాణ సూచనలలోని ఆజ్ఞాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
