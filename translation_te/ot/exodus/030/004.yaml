base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: te
  text: దాని అలంకారపు అంచుకు[a] దిగువన దానికి రెండు బంగారు ఉంగరాలు చేయాలి. దాని రెండు పక్క భాగాలపై, దాని ఇరువైపులా[b] వాటిని చేయాలి. అవి మోయు కర్రలకు ఆధారాలుగా ఉండాలి; వాటితో దానిని మోయాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని అంచుకు దిగువన,’ ‘దాని అంచుపట్టీ కింద’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ పదం బలిపీఠం చుట్టూ ఉన్న అలంకారపు అంచును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘దాని రెండు పక్క నిర్మాణాలపై ... దాని రెండు వైపులపై’ అని పునరుక్తిగా ఉంది; ఉంగరాలను ఇరువైపులా అమర్చాలని ఇది నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అవి కర్రలకు ఇళ్లుగా ఉండాలి’; అంటే మోయు కర్రలను ఉంచే లేదా దూర్చే ఆధారాలుగా ఉండాలి. చివరి మాటలు ఆ కర్రలతో బలిపీఠాన్ని మోయాలని సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: బంగారు ఉంగరాలు
  rationale: టַבַּעַת ఇక్కడ వస్తువుకు అమర్చే ఉంగరాన్ని సూచిస్తుంది; పదార్థాన్ని తెలిపే ‘బంగారు’తో కూడిన ఈ రూపం సహజమైన ఆధునిక తెలుగు.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: దాని అంచు అలంకరణకు దిగువన
  rationale: זֵר బలిపీఠం చుట్టూ చేసిన అలంకారపు అంచును సూచిస్తుంది. ‘అంచు అలంకరణ’ దాని నిర్మాణాత్మక, అలంకార స్వభావాలు రెండింటినీ స్పష్టం చేస్తుంది.
- source_word: צַלְעֹתָיו
  choice: దాని రెండు పక్క పలకలు
  rationale: צֵלָע నిర్మాణ సందర్భంలో పక్క భాగాన్ని లేదా పక్క పలకను సూచించగలదు; ‘పక్క పలకలు’ తయారు చేసిన వస్తువు యొక్క నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: దాని ఇరువైపులా
  rationale: צַד అంటే ‘వైపు’; ఈ పదబంధం ఉంగరాలు రెండు వైపులా ఉండాలని పునరుద్ఘాటిస్తుంది.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: వాటిలో ... కర్రలను దూర్చాలి
  rationale: ‘కర్రలకు ఇళ్లుగా ఉండాలి’ అనే హీబ్రూ నుడికారాన్ని, ఉంగరాలు మోయు కర్రలను ఉంచే ఆధారాలుగా పనిచేస్తాయనే భావంతో సహజ తెలుగులో తెలిపింది.
- source_word: בַדִּים
  choice: మోయడానికి ఉపయోగించే కర్రలు
  rationale: గుడారపు సామగ్రి రవాణా సందర్భంలో בַּדִּים మోయు కర్రలను సూచిస్తుంది; ఈ ఎంపిక ఆధునిక పాఠకునికి వాటి పని స్పష్టం చేస్తుంది.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: వాటిలో మోయడానికి ఉపయోగించే కర్రలను దూర్చాలి
  rationale: బలిపీఠాన్ని ఆ కర్రల ద్వారా మోయాలనే ఉద్దేశం, సాధనార్థం సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: చేయాలి ... చేయాలి
  rationale: ఆజ్ఞాత్మక నిర్దేశాన్ని ఆధునిక ప్రామాణిక తెలుగులో ‘చేయాలి’ సహజంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని నిలిపింది.
