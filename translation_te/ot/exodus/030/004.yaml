revisions:
- from: దాని అంచు అలంకరణకు[a] దిగువన దానికి రెండు బంగారు ఉంగరాలు చేయాలి. వాటిని దాని రెండు పక్క పలకల మీద, అంటే దాని ఇరువైపులా[b] చేయాలి. వాటిలో మోయడానికి ఉపయోగించే కర్రలను దూర్చాలి[c].
  to: దాని అలంకారపు అంచుకు[a] దిగువన దానికి రెండు బంగారు ఉంగరాలు చేయాలి. దాని రెండు పక్క భాగాలపై, దాని ఇరువైపులా[b] వాటిని చేయాలి. అవి మోయు కర్రలకు ఆధారాలుగా ఉండాలి; వాటితో దానిని మోయాలి[c].
  rationale: The revision keeps the directive style and the source’s repeated bilateral placement while avoiding an unnecessarily specific ‘panels.’ Most importantly, it restores the distinction between the rings’ function as pole-holders and the purpose of carrying the altar by means of those poles.
