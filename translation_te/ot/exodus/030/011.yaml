  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH.’ ఈ దైవనామాన్ని ‘యెహోవా’ అని కూడా ప్రతిలిపి చేస్తారు; సంప్రదాయ అనువాదాల్లో దీనిని ‘ప్రభువు’గా ఇస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దైవ వాక్యాన్ని పరిచయం చేసే ఈ సాధారణ కథన సూత్రంలో דברకు సహజమైన ఆధునిక తెలుగు రూపం; తరువాతి לֵאמֹרతో కలిసి ఉన్నప్పుడు ‘మాట్లాడాడు’ కంటే ‘ఇలా చెప్పాడు’ తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామం יהוהను తెలుగు బైబిల్ వాడుకలో విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపంలో ప్రతిలిపి చేస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో వ్యక్తిని సూచించే אֶל‌ను తెలుగులో సహజంగా ‘తో’ విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ద్విరుక్తమైన ‘చెప్పుతూ చెప్పాడు’ను నివారిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో బిరుదు కాక వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచి, ప్రత్యామ్నాయ ప్రతిలిపిని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
