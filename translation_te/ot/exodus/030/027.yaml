  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: te
  text: బల్లను, దాని సామగ్రినంతటినీ, దీపస్తంభాన్ని, దాని సామగ్రిని, ధూపపు బలిపీఠాన్ని[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధూపవేదికను.”
    reason: హెబ్రీ מִזְבַּח הַקְּטֹרֶת సమాసానికి సాధ్యమైన పదక్రమ ప్రత్యామ్నాయం; ఆంగ్ల POB ఆడిట్ ట్రెయిల్‌లోని lexical-alternative పాదటిప్పణిని ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: ఇక్కడి నామవాచకం సాధారణంగా ‘బల్ల’ అని అర్థమిస్తుంది. సందర్భంలో ఇది పరిశుద్ధ మందిరపు ప్రత్యేక బల్ల అయినప్పటికీ, ఈ వచనంలో హెబ్రీ పాఠం దాని పూర్తి పేరును మళ్లీ చెప్పలేదు.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రినంతటినీ
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు, ఉపకరణాలు మొదలైన వాటిని సూచించే విస్తృత పదం. ఈ సందర్భంలో ‘సామగ్రి’ సహజంగా ఉండి, మొత్తం భావాన్ని సమగ్రంగా తెలియజేస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభాన్ని
  rationale: మְנוֹרָהను లిప్యంతరీకరించకుండా దాని ఆకృతి-ప్రయోజనాన్ని స్పష్టంగా తెలిపే సాధారణ తెలుగు పదంతో అనువదించాం.
- source_word: כֵּלֶיהָ
  choice: దాని సామగ్రిని
  rationale: స్త్రీలింగ ప్రత్యయం దీపస్తంభాన్ని సూచిస్తుంది. ముందున్న כְּלִי పదంతో ఏకరూపతను నిలుపుతూ ‘సామగ్రి’ అని అనువదించాం.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదికను
  rationale: ఇది ధూపానికి సంబంధించిన బలిపీఠం/వేదికను సూచించే సమాస నిర్మాణం. ‘ధూపవేదిక’ సంక్షిప్తంగా, సహజంగా, సందర్భానికి తగినట్లు ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని ఉపయోగించాం. ఇది కొనసాగుతున్న జాబితాలోని భాగం కాబట్టి చివర అర్ధవిరామ చిహ్నం ఉంచాం.
