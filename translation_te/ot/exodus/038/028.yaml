revisions:
- from: మిగిలిన వెయ్యి ఏడువందల డెబ్బై అయిదు షెకెల్ల వెండితో అతడు స్తంభాలకు కొక్కాలు చేశాడు; వాటి పైభాగాలకు వెండి పూత పూసి, వాటికి పట్టీలు అమర్చాడు.[a]
  to: వెయ్యి ఏడువందల డెబ్బై ఐదు షెకెల్ల వెండితో అతడు స్తంభాలకు కొక్కాలు చేశాడు; వాటి పైభాగాలకు వెండి పూత వేసి, వాటికి పట్టీలు అమర్చాడు.[a]
  rationale: The revision removes the unsupported interpretive addition “మిగిలిన” while retaining the contextually explicit “షెకెల్ల వెండి.” It also makes the expression for metal overlaying more natural in modern standard Telugu. The footnote remains correctly anchored to the lexical alternative for the final verb.
  reviewer_model: gpt-5.6-terra
