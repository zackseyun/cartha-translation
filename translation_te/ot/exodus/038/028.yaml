  register: ఆధునిక ప్రామాణిక తెలుగు; నిర్మాణ పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ గంభీరమైన వచన శైలిని పాటించాం. సందర్భపూరణగా ‘మిగిలిన’, ‘షెకెల్ల వెండి’ చేర్చబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
