  text: וְ/אֶת הָ/אֶ֜לֶף וּ/שְׁבַ֤ע הַ/מֵּאוֹת֙ וַ/חֲמִשָּׁ֣ה וְ/שִׁבְעִ֔ים עָשָׂ֥ה וָוִ֖ים לָ/עַמּוּדִ֑ים וְ/צִפָּ֥ה רָאשֵׁי/הֶ֖ם וְ/חִשַּׁ֥ק אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/028.yaml
  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: te
  text: వెయ్యి ఏడువందల డెబ్బై ఐదు షెకెల్ల వెండితో అతడు స్తంభాలకు కొక్కాలు చేశాడు; వాటి పైభాగాలకు వెండి పూత వేసి, వాటికి పట్టీలు అమర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని పట్టీలతో కలిపాడు.” ఇక్కడి హీబ్రూ క్రియ స్తంభాలకు కలిపే పట్టీలు లేదా బంధకాలు అమర్చడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: మిగిలిన వెయ్యి ఏడువందల డెబ్బై అయిదు షెకెల్ల వెండితో
  rationale: మునుపటి వచనంలోని వెండి లెక్కను ఈ వాక్యం కొనసాగిస్తోంది. మూలంలో ‘షెకెల్లు’, ‘వెండి’ పదాలు ప్రత్యక్షంగా లేకపోయినా సందర్భం వాటిని స్పష్టం చేస్తుంది; సహజమైన తెలుగుకోసం వాటిని వ్యక్తం చేశాం.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: నిర్మాణ సందర్భంలో సాధారణమైన, సహజమైన భూతకాల క్రియ.
- source_word: וָוִים
  choice: కొక్కాలు
  rationale: గుడార నిర్మాణ సందర్భంలో స్తంభాలకు అమర్చే లోహపు hooks అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָעַמּוּדִים
  choice: స్తంభాలకు
  rationale: עַמּוּדִים అనే నిర్మాణ భాగాలకు సహజమైన తెలుగు పదం ‘స్తంభాలు’.
- source_word: וְצִפָּה
  choice: వెండి పూత పూసి
  rationale: పీయేల్ రూపంలోని צפה లోహంతో కప్పడం లేదా పూత పూయడం అనే అర్థం ఇస్తుంది. వెండి అనే పదం తక్షణ సందర్భం ద్వారా నిర్ధారితమవుతుంది.
- source_word: רָאשֵׁיהֶם
  choice: వాటి పైభాగాలకు
  rationale: అక్షరార్థంగా ‘వాటి తలలు’; ఇక్కడ స్తంభాల పై భాగాలను సూచిస్తుంది.
- source_word: וְחִשַּׁק אֹתָם
  choice: వాటికి పట్టీలు అమర్చాడు
  rationale: חִשַּׁק ఇక్కడ స్తంభాలకు లోహపు పట్టీలు లేదా బంధకాలు అమర్చడాన్ని సూచిస్తుంది. ‘అమర్చాడు’ తయారు చేయడం కంటే మూల క్రియ భావాన్ని నేరుగా తెలియజేస్తుంది.
