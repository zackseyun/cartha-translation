translation:
  language: te
  text: అతడు ప్రాంగణాన్ని చేశాడు. దక్షిణ దిక్కున, దక్షిణం వైపుగా, ప్రాంగణపు తెరలు[a] మెలితిప్పిన సన్నని నారతో చేయబడ్డాయి; వాటి పొడవు వంద మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాంగణపు వేలాడే వస్త్రాలు.”
    reason: కְלָעִים పదానికి సందర్భానుసారమైన పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను తెలియజేస్తుంది; తెలుగులో సహజమైన సరళ భూతకాలాన్ని వాడాం.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: ఇక్కడ חָצֵר ప్రత్యక్ష గుడారాన్ని చుట్టిన బయటి ఆవరణను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రాంగణం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: దక్షిణ దిక్కున, దక్షిణం వైపుగా
  rationale: మూలంలోని రెండు దక్షిణ దిశాసూచక పదబంధాల సంపూర్ణతను కుదించకుండా నిలిపింది.
- source_word: קַלְעֵי הֶחָצֵר
  choice: ప్రాంగణపు తెరలు
  rationale: గుడార సంబంధ సందర్భంలో קְלָעִים ప్రాంగణపు హద్దును ఏర్పరచే వేలాడే వస్త్రాలను సూచిస్తుంది; ‘తెరలు’ సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ యొక్క నాణ్యమైన నార భావాన్ని, מָשְׁזָר యొక్క పేనిన లేదా మెలితిప్పిన తయారీ భావాన్ని రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: מֵאָה בָּאַמָּה
  choice: వాటి పొడవు వంద మూరలు
  rationale: కొలత యొక్క సందర్భోచిత పరిమాణాన్ని ‘పొడవు’ అని స్పష్టం చేస్తూ, ప్రాచీన కొలమానమైన మూరను నిలిపింది.
