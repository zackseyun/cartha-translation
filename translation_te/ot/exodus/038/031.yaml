  text: the bases of the surrounding courtyard[a], the bases of the gate of the courtyard, all the pegs of the tabernacle[b], and all the pegs of the surrounding courtyard.
translation:
  language: te
  text: ప్రాంగణం చుట్టూ ఉన్న అడుగుపీఠాలను[a], ప్రాంగణ ద్వారపు అడుగుపీఠాలను, నివాస గుడారపు గుంజలన్నిటిని[b], ప్రాంగణం చుట్టూ ఉన్న గుంజలన్నిటిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాకెట్లను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మేకులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: పాదులు
  rationale: నిలువు స్తంభాలు లేదా పలకలు అమర్చబడే లోహపు ఆధార భాగాలను సూచించే నిర్మాణపరమైన పదం. ‘పాదులు’ సంక్షిప్తంగా, సహజంగా ఉండి ఆధార భాగాల భావాన్ని నిలుపుతుంది.
- source_word: חָצֵר
  choice: ప్రాంగణం
  rationale: పరిశుద్ధ గుడారం చుట్టూ ఆవరించబడిన బయటి స్థలాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ ఉన్న
  rationale: ప్రాంగణ పరిధి అంతటినీ సూచించే పంపిణీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שַׁעַר
  choice: ద్వారం
  rationale: ప్రాంగణంలోకి ప్రవేశించే ద్వారాన్ని నేరుగా, గౌరవప్రదమైన సాధారణ పదంతో సూచిస్తుంది.
- source_word: יִתְדֹת
  choice: మేకులు
  rationale: గుడారాన్ని, ప్రాంగణపు తెరలను బిగించడానికి నేలలో దించే పెగ్‌లు లేదా స్టేక్‌లను సూచించే సుపరిచిత తెలుగు పదం.
- source_word: מִּשְׁכָּן
  choice: మందిర గుడారం
  rationale: దేవుని పవిత్ర నివాస గుడారమనే ప్రత్యేక భావాన్ని నిలుపుతూ, సాధారణ పాఠకునికి ‘గుడారం’ మాత్రమే కంటే స్పష్టతనిస్తుంది.
- source_word: כָּל
  choice: అన్నిటిని
  rationale: బహువచనంలోని మేకుల సమగ్రతను సహజమైన తెలుగు కర్మరూపంలో తెలియజేస్తుంది.
- source_word: וְאֵת / וְאֶת
  choice: జాబితా సమన్వయం
  rationale: హీబ్రూలో పునరావృతమయ్యే సంధి-సహిత ప్రత్యక్ష కర్మ సూచికను తెలుగులో కర్మప్రత్యయంతో కూడిన వరుస జాబితాగా సహజంగా ప్రతిబింబించాం.
