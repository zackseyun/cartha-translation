translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ జాబితా శైలిని సంక్షిప్తంగా నిలిపాం. ‘మందిర గుడారం’ నిర్గమకాండంలోని పవిత్ర నివాస గుడారానికి స్థిరమైన, సాధారణ పాఠకునికి అర్థమయ్యే పదబంధంగా వాడబడింది; అడుగుభాగపు లోహ ఆధారాలకు ‘పాదులు’ వాడి సాంకేతిక భావాన్ని అతిగా క్లిష్టం చేయలేదు. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
