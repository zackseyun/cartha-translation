  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: te
  text: నివాస గుడారానికీ, దాని చుట్టూ ఉన్న ఆవరణానికీ సంబంధించిన మేకులన్నీ కంచుతో చేయబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాగితో.’ హీబ్రూ పదం נְחֹשֶׁת సందర్భాన్ని బట్టి రాగిని లేదా కంచును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: అన్నీ
  rationale: బహువచన నామవాచకంతో కూడిన సమష్టి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వాక్యారంభంలోని וְ భావం తెలుగు వాక్య నిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండానే నిలుస్తుంది.
- source_word: הַיְתֵדֹת
  choice: మేకులు
  rationale: గుడారం లేదా ఆవరణ నిర్మాణాన్ని బిగించడానికి నేలలో పాతే pegs/stakes అనే భావానికి సాధారణ ఆధునిక తెలుగు పదం.
- source_word: לַמִּשְׁכָּן
  choice: మందిరపు గుడారానికి
  rationale: מִשְׁכָּן యొక్క ‘నివాసస్థలం’ భావాన్ని, నిర్గమకాండంలోని ప్రత్యేక పవిత్ర గుడార సూచనను పాఠకులకు స్పష్టంగా ఉంచుతుంది.
- source_word: וְלֶחָצֵר סָבִיב
  choice: దాని చుట్టూ ఉన్న ప్రాంగణానికి
  rationale: חָצֵר ను ‘ప్రాంగణం’గా, סָבִיב ను గుడారాన్ని చుట్టుముట్టిన స్థల సంబంధంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పవిత్ర గుడార సామగ్రి సందర్భంలో సంప్రదాయంగా bronze అని అర్థం చేసుకునే లోహాన్ని సహజమైన తెలుగులో సూచిస్తుంది; మూలపదం రాగిని కూడా సూచించగలదనే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందిరపు గుడారం’ అనే రూపం నిర్గమకాండంలోని పవిత్ర నివాస గుడారాన్ని సాధారణ పాఠకునికి స్పష్టంగా గుర్తించేందుకు ఉపయోగించబడింది.
