  text: קְלָעִ֛ים חֲמֵשׁ עֶשְׂרֵ֥ה אַמָּ֖ה אֶל הַ/כָּתֵ֑ף עַמּוּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה־־׃
base_translation:
