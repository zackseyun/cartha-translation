  yaml_path: translation/ot/exodus/038/014.yaml
  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: te
  text: పదిహేను మూరల పొడవున్న తెరలు ఒక వైపున ఉన్నాయి; వాటికి మూడు స్తంభాలు, మూడు పీఠాలు[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
