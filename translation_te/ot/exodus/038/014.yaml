    text: లేదా, ‘వాటి స్తంభాల పాదాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టి ఆవరణగా నిలిచిన నార తెరలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెరలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: పదిహేను మూరల పొడవైన
  rationale: హీబ్రూలో కొలత మాత్రమే ఉన్నా, తెలుగులో అది తెరల పొడవని స్పష్టంగా తెలియజేయడానికి ‘పొడవైన’ చేర్చడం సహజం.
- source_word: אֶל הַכָּתֵף
  choice: ఒక వైపున
  rationale: כָּתֵף అక్షరార్థంగా ‘భుజం’, ఇక్కడ ద్వారప్రాంతంలోని ఒక పక్క భాగాన్ని సూచిస్తుంది; ‘ఒక వైపున’ స్థలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַמּוּדֵיהֶם
  choice: వాటి స్తంభాలు
  rationale: బహువచన ప్రత్యయం ముందున్న తెరలకు లేదా ఆ విభాగానికి సంబంధించిన స్తంభాలను సూచిస్తుంది; ‘స్తంభాలు’ ఈ నిర్మాణ సందర్భానికి తగిన పదం.
- source_word: אַדְנֵיהֶם
  choice: వాటి దిమ్మలు
  rationale: స్తంభాలు నిలబడే లోహపు ఆధార భాగాలను సూచిస్తుంది; ‘దిమ్మలు’ నిర్మాణాత్మక ఆధారాల భావాన్ని తెలుగులో సంక్షిప్తంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్గమకాండంలోని ప్రత్యక్ష గుడార నిర్మాణ వర్ణనకు తగిన సరళమైన, గౌరవప్రదమైన శైలి. ‘మూర’ను సంప్రదాయ బైబిలు కొలతపదంగా నిలిపి, కొలత తెరల పొడవని సహజంగా స్పష్టం చేశాము.
