translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా అనువదించబడింది. హీబ్రూ వాక్యంలోని వరుస సమన్వయాన్ని నిలుపుతూ అనవసరమైన వ్యతిరేక భావాన్ని చేర్చలేదు. ‘పట్టీలు’ అనే పదాన్ని నామవాచకంలోను సంబంధిత క్రియార్థంలోను ఉపయోగించి మూలంలోని పదసంబంధాన్ని కాపాడింది.
