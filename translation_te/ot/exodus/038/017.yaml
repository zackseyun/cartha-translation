  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: te
  text: స్తంభాల పునాదులు[a] కంచుతో చేయబడ్డాయి; స్తంభాల కొక్కెలు, వాటి పట్టీలు వెండితో చేయబడ్డాయి; వాటి పైభాగాలపై వెండి తొడుగు వేయబడింది. ప్రాంగణంలోని స్తంభాలన్నిటికీ వెండి పట్టీలు అమర్చబడ్డాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దిమ్మలు.’ ఇవి స్తంభాలను నిలబెట్టే ఆధార భాగాలు.
    reason: lexical_alternative
  - marker: b
    text: ‘పట్టీలు’ అని అనువదించిన హీబ్రూ పదం సూచించే ఖచ్చితమైన నిర్మాణ భాగం స్పష్టంగా తెలియదు; అది స్తంభాలకు అమర్చిన వెండి బిగింపు భాగాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: పునాదులు
  rationale: గుడార నిర్మాణ సందర్భంలో స్తంభాలను నిలబెట్టే ఆధార భాగాలను సూచిస్తుంది. ‘పునాదులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; ‘దిమ్మలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: עַמֻּדִים
  choice: స్తంభాలు
  rationale: నిలువుగా ఉండే నిర్మాణ ఆధారాలను సూచించే సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ నిర్మాణ సందర్భంలో రాగి లేదా రాగి మిశ్రమాన్ని సూచించవచ్చు; బైబిలు లోహశిల్ప సందర్భానికి ‘కంచు’ సహజమైన ఎంపిక.
- source_word: וָוֵי
  choice: కొక్కెములు
  rationale: స్తంభాలకు అమర్చిన వంకర బిగింపు భాగాలను సూచిస్తుంది; ‘కొక్కెములు’ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణ పదం.
- source_word: חֲשׁוּקֵיהֶם
  choice: వాటి పట్టీలు
  rationale: ఖచ్చితమైన నిర్మాణ రూపం అనిశ్చితమైనా, స్తంభాలకు సంబంధించిన చుట్టుబిగించే లేదా అమర్చే వెండి భాగాలను సూచిస్తుంది. ‘పట్టీలు’ అతిగా నిర్దిష్టీకరించకుండా భావాన్ని అందిస్తుంది.
- source_word: צִפּוּי
  choice: తొడుగు
  rationale: లోహంతో ఉపరితలాన్ని కప్పే పొరను సూచిస్తుంది; ‘వెండి తొడుగు వేయబడింది’ తెలుగులో సహజంగా ఉంది.
- source_word: רָאשֵׁיהֶם
  choice: వాటి పైభాగాలు
  rationale: అక్షరార్థంగా ‘వాటి తలలు’; ఇక్కడ స్తంభాల ఎగువ భాగాలను సూచిస్తుంది. సాంకేతిక పదాన్ని రుద్దకుండా స్పష్టంగా అనువదిస్తుంది.
- source_word: מְחֻשָּׁקִים
  choice: వెండి పట్టీలు అమర్చబడ్డాయి
  rationale: חֲשׁוּקֵיהֶםతో ఉన్న పదసంబంధాన్ని ‘పట్టీలు’ ద్వారా నిలుపుతూ, తెలుగులో సహజమైన కర్మణి నిర్మాణాన్ని వాడుతుంది.
- source_word: חָצֵר
  choice: ప్రాంగణం
  rationale: గుడారం చుట్టూ ఉన్న ఆవరణను సూచించడానికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన పదం.
