lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు తయారుచేశాడు
  rationale: కథనాన్ని ముందుకు నడిపించే క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగు భూతకాలంలో వ్యక్తపరుస్తుంది.
- source_word: לַמִּזְבֵּחַ
  choice: బలిపీఠం కోసం
