  text: అతడు బలిపీఠం కోసం కంచుతో, వల అల్లికతో చేసిన ఒక జాలిని తయారుచేశాడు; అది దాని అంచు[b] కిందనుండి దాని మధ్య వరకు[c] ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
