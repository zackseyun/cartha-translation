source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: te
  text: ఆ కంచుతో అతడు సమావేశపు గుడారం ప్రవేశద్వారానికి అడుగు పీఠాలను[a], కంచు బలిపీఠాన్ని, దానికి ఉన్న కంచు జాలకాన్ని[b], బలిపీఠపు సామగ్రి అంతటినీ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమావేశపు గుడారం ప్రవేశద్వారానికి సాకెట్లను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దానికి ఉన్న కంచు జల్లెడను” లేదా “కంచు వలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: సాధారణ కథన సందర్భంలో עשהకు సహజమైన, విస్తృతార్థాన్ని నిలిపే అనువాదం.
- source_word: בָּהּ
  choice: ఆ కంచుతో
  rationale: మునుపటి వచనంలో లెక్కించబడిన కంచును సూచిస్తుంది; తయారీకి ఉపయోగించిన పదార్థం అనే సాధనార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַדְנֵי
  choice: పీఠాలు
  rationale: గుడార నిర్మాణంలో నిలువు భాగాలకు ఆధారంగా ఉండే లోహపు అడుగు భాగాలను సూచిస్తుంది; సాంకేతికమైన ‘గుంటలు/సాకెట్లు’ కంటే సాధారణ పాఠకులకు సహజం.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం ప్రవేశద్వారం
  rationale: פֶּתַח యొక్క ప్రవేశం/ద్వారం భావాన్ని సహజమైన తెలుగు సమాసంలో వ్యక్తం చేస్తుంది; אֹהֶל מוֹעֵדకు స్థిరంగా అర్థమయ్యే ‘ప్రత్యక్ష గుడారం’ వాడబడింది.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: నెహోషెత్ లోహపదానికి ఈ సందర్భంలో సంప్రదాయబద్ధమైన ‘కంచు’, altarకు సహజమైన ‘బలిపీఠం’ సరిపోతాయి.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: కంచు జాలి
  rationale: బలిపీఠానికి సంబంధించిన lattice/network ఆకృతిగల వస్తువును ‘జాలి’ సంక్షిప్తంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: אֲשֶׁר לוֹ
  choice: దానికి చెందిన
  rationale: జాలి బలిపీఠంతో కలిగిన సంబంధాన్ని చూపుతుంది; అది ఖచ్చితంగా ఎక్కడ అమర్చబడిందో అనవసరంగా నిర్ధారించదు.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: బలిపీఠపు సామగ్రి అంతా
  rationale: כְּלֵי అనే విస్తృత పదంలో పాత్రలు, పనిముట్లు మొదలైన ఉపకరణాలన్నీ చేరేలా ‘సామగ్రి’ సహజంగా ఉంటుంది.
