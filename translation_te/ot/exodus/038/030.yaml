  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల నిర్మాణం. మూలంలోని వరుస జాబితా నిర్మాణం నిలుపబడింది. ‘దానికి చెందిన’ అనే పదబంధం אֲשֶׁר לוֹలోని సంబంధార్థాన్ని స్థానం గురించి అతిగా నిర్ధారించకుండా కాపాడుతుంది.
