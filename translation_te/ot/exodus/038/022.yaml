id: EXO.38.22
reference: Exodus 38:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: te
  text: యూదా గోత్రానికి చెందిన హూరు కుమారుడైన ఊరీ కుమారుడు బెసలేలు, యాహ్వే[a] మోషేకు ఆజ్ఞాపించినదంతా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “YHWH”; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: దైవనామపు హీబ్రూ మూలరూపాన్ని, దానికి సంప్రదాయంగా వాడే ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: బెసలేలు
  rationale: ముందున్న సందర్భంతో వావ్ సంధి కలిగించే అనుసంధానాన్ని తెలుగులో సహజ వాక్యప్రవాహం ద్వారా తెలియజేశాం; వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిల్ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: హూరు కుమారుడైన ఊరీ కుమారుడు
  rationale: వంశావళి క్రమాన్ని—బెసలేలు ఊరీ కుమారుడు, ఊరీ హూరు కుమారుడు—తెలుగులో సందిగ్ధత లేకుండా నిలిపే సహజ నిర్మాణం.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: మַטֶּה ఇక్కడ ‘గోత్రం’ అని, לְ సంబంధం లేదా అనుబంధాన్ని సూచిస్తుందని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: עשה అనే విస్తృత క్రియ ఈ సందర్భంలో ఆజ్ఞాపించిన పనులన్నిటిని నెరవేర్చడాన్ని సూచిస్తుంది; ‘తయారుచేశాడు’ కంటే ‘చేశాడు’ మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: ‘ఏదంతయితే’ అనే కృత్రిమ నిర్మాణం లేకుండా, మొత్తం పరిధిని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: హీబ్రూ సంపూర్ణ క్రియను సందర్భానుసారంగా భూతకాల సంబంధక్రియగా అనువదించాం; ఆజ్ఞ పని చేయడానికి ముందే ఇవ్వబడిందనే క్రమం వాక్యానికే స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా లిప్యంతరీకరించాం.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: צוה + אֶת + వ్యక్తి అనే హీబ్రూ నిర్మాణం ఆజ్ఞ అందుకున్న వ్యక్తిని సూచిస్తుంది; తెలుగులో దత్తివిభక్తి ‘మోషేకు’ సహజంగా ఆ సంబంధాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం; పాదటిప్పణిలో మూల హీబ్రూ రూపాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. వంశక్రమం స్పష్టంగా ఉండేలా తెలుగు పదక్రమం మార్చబడింది. పాదటిప్పణి సూచిక దైవనామం వెంట ఉంచబడింది.
