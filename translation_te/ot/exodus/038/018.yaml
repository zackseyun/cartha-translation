source:
  edition: WLC
  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: te
  text: ప్రాంగణ ద్వారపు తెర రంగుల నమూనాల పనిలో నిపుణుడి చేతిపని; అది నీలం, ఊదా, కెంపు నూలుతోను, సన్నని మెలికలు తిప్పిన నారతోను తయారైంది[a]. దాని పొడవు ఇరవై మూరలు; ఎత్తు ఐదు మూరలు, వెడల్పు విషయములో ప్రాంగణపు పరదాలకు అనుగుణంగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంబ్రాయిడరీ నిపుణుడి పనిగా.” హెబ్రీ మַעֲשֵׂה רֹקֵם అనేది ఎంబ్రాయిడరీ పనినో, రంగులతో నమూనాలు నేసే నిపుణుని పనినో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, “వెడల్పులో ఎత్తు ఐదు మూరలు, ప్రాంగణపు పరదాలకు అనుగుణంగా” అని ఉంది. ‘వెడల్పులో’ అనే పదం ఈ కొలత ప్రయోగంతో ఎలా సంబంధించిందో అసాధారణంగా ఉంది; తెర ఎత్తు ప్రాంగణపు పరదాల ఎత్తుకు సరిపోయిందని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: ప్రాంగణ ద్వారానికి ఉన్న తెర
  rationale: ప్రవేశాన్ని కప్పే వస్త్ర అవరోధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; שַׁעַר యొక్క ద్వార భావాన్నీ నిలుపుతుంది.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: నైపుణ్యంగా అల్లబడింది
  rationale: రంగురంగుల నమూనాలు రూపొందించే నిపుణ వస్త్రకారుని పనిని సూచిస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం కర్తృనామాన్ని క్రియావిశేషణాత్మకంగా వ్యక్తపరచింది; ఎంబ్రాయిడరీ లేదా రంగుల నేత అనే సాధ్యమైన భావభేదాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: నీలం, ఊదా, ఎర్రని నూలు
  rationale: మూడు రంగు/రంగువేసిన వస్త్ర పదార్థాలను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది; సందర్భం వల్ల అంతర్లీనంగా ఉన్న నూలు భావాన్ని తెలుగులో పేర్కొంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: నాణ్యమైన నారపోగులు మెలిపెట్టి తయారుచేసిన వస్త్ర పదార్థాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: పొడవు ఇరవై మూరలు
  rationale: ప్రాచీన కొలమానాన్ని సాంప్రదాయ తెలుగు బైబిలు పదమైన ‘మూర’తో నిలుపుతుంది.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: ఎత్తు ఐదు మూరలు; అది ప్రాంగణపు పరదాల ఎత్తుకు సమానంగా ఉంది
  rationale: క్లిష్టమైన హెబ్రీ కొలత ప్రయోగాన్ని సందర్భానుసారంగా తెర ఎత్తు చుట్టూ ఉన్న పరదాల ఎత్తుతో సరిపోలిందని వ్యక్తపరుస్తుంది; పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి. ‘ప్రాంగణం,’ ‘ద్వారం,’ ‘తెర,’ ‘పరదాలు’ అనే పదాలతో ప్రవేశ తెరను చుట్టుపక్కల వేలాడే వస్త్రాల నుండి వేరు చేశాం. కొలమానానికి ‘మూర’ వాడి ప్రాచీన ప్రమాణాన్ని మార్చకుండా ఉంచాం.
