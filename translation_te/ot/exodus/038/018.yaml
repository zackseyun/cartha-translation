- from: ప్రాంగణ ద్వారానికి ఉన్న తెర నీలం, ఊదా, ఎర్రని నూలుతో, సన్నగా పేనిన నారతో నైపుణ్యంగా అల్లబడింది[a]. దాని పొడవు ఇరవై మూరలు, ఎత్తు ఐదు మూరలు; అది ప్రాంగణపు పరదాల ఎత్తుకు సమానంగా ఉంది[b].
  to: ప్రాంగణ ద్వారపు తెర రంగుల నమూనాల పనిలో నిపుణుడి చేతిపని; అది నీలం, ఊదా, కెంపు నూలుతోను, సన్నని మెలికలు తిప్పిన నారతోను తయారైంది[a]. దాని పొడవు ఇరవై మూరలు; ఎత్తు ఐదు మూరలు, వెడల్పు విషయములో ప్రాంగణపు పరదాలకు అనుగుణంగా ఉంది[b].
