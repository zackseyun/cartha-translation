base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: te
  text: వాటి స్తంభాలు నాలుగు; వాటి కంచు ఆధారాలు[a] నాలుగు. వాటి కొక్కాలు వెండివి; వాటి పైభాగాల పూత, వెండితో చేసిన వాటి పట్టీలు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడుగు దిమ్మలు.’ హీబ్రూ పదం స్తంభాల అడుగున వాటికి మద్దతిచ్చే లోహ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: సాంప్రదాయంగా ‘ఫిల్లెట్లు’ అని అనువదిస్తారు. ఈ వెండి భాగాల ఖచ్చితమైన ఆకారం అనిశ్చితం; ‘పట్టీలు’ అనేది స్పష్టమైన ఆధునిక అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: వాటి స్తంభాలు
  rationale: עַמּוּד గుడార నిర్మాణ సందర్భంలో నిలువుగా ఉండే స్తంభాన్ని సూచిస్తుంది; ‘స్తంభాలు’ సహజమైన, స్థిరపడిన నిర్మాణ పదం.
- source_word: אַדְנֵיהֶם
  choice: వాటి ఆధారాలు
  rationale: אֶדֶן స్తంభాల అడుగున వాటికి మద్దతిచ్చే లోహ భాగాలను సూచిస్తుంది. ఆధునిక పాఠకులకు ‘ఆధారాలు’ స్పష్టంగా ఉంటుంది; ‘గుంటలు/దిమ్మలు’ అని రూపాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: నివాస గుడారపు లోహ సామగ్రి జాబితాల్లో נְחֹשֶׁתను సాధారణంగా కంచుగా అర్థం చేసుకుంటారు; ఈ సందర్భానికి ఇదే సహజమైన తెలుగు పదం.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కాలు
  rationale: וָו ఇక్కడ తెరలను లేదా ఇతర భాగాలను తగిలించే అమరికలను సూచిస్తుంది; ‘కొక్కాలు’ వాటి కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఈ పదం ఇక్కడ లోహమైన వెండిని నేరుగా సూచిస్తుంది.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: వాటి పైభాగాల పూత
  rationale: צִפּוּי అనేది కప్పిన పొర లేదా పూత; רָאשֵׁיהֶם అక్షరార్థంగా ‘వాటి తలలు’, నిర్మాణ సందర్భంలో ‘వాటి పైభాగాలు’. మూలంలోని నామవాచక నిర్మాణాన్ని తెలుగులో సహజంగా నిలిపింది.
- source_word: חֲשֻׁקֵיהֶם
  choice: వాటి బిగింపు పట్టీలు
  rationale: ఈ అరుదైన నిర్మాణ పదం యొక్క ఖచ్చిత రూపం అనిశ్చితం. ‘బిగింపు పట్టీలు’ స్తంభాలకు సంబంధించిన వెండి అమరికల పనిని సూచిస్తుంది, అయితే వాటి ఆకారాన్ని అతిగా నిర్దిష్టం చేయదు.
