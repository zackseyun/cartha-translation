translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరాన్ని సాధారణ పాఠకుడు సులభంగా గ్రహించేలా సంక్షిప్త వాక్యాలుగా ఇచ్చాం. మూలంలోని పదార్థ సంబంధాలను నిలుపుతూ, చివరి ‘వెండి’ అనే విధేయాన్ని పైభాగాల పూతకూ బిగింపు పట్టీలకూ వర్తింపజేశాం. అరుదైన సాంకేతిక పదాల అనిశ్చితిని పాదసూచికల్లో వెల్లడించాం.
