  terminology: ‘కంచు,’ ‘తలాంతులు,’ and ‘షెకెల్లు’ are appropriate. ‘ఊపి సమర్పించిన అర్పణ’ transparently conveys the technical ritual term; the note preserves the broader translation alternatives.
