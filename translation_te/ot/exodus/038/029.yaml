source:
  edition: WLC
  text: וּ/נְחֹ֥שֶׁת הַ/תְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְ/אַלְפַּ֥יִם וְ/אַרְבַּע מֵא֖וֹת שָֽׁקֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: te
  text: ఊపి సమర్పించిన అర్పణ[b]కు చెందిన కంచు[a] డెబ్బై తలాంతులు, రెండువేల నాలుగువందల షెకెల్లు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగి’; హీబ్రూ נְחֹשֶׁת సందర్భానుసారం రాగిని లేదా కంచును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఊపి సమర్పించిన అర్పణ’ అనేది యెహోవా సన్నిధిలో ఒక వస్తువును ఆచారబద్ధంగా ఊపి సమర్పించడాన్ని సూచించే సాంకేతిక పదం. దీన్ని మరింత సాధారణంగా ‘సమర్పించిన అర్పణ’ లేదా ‘కానుక’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం సందర్భానుసారం రాగిని లేదా కంచును సూచించగలదు. ప్రత్యక్ష గుడారపు సామగ్రికి ఉపయోగించిన పనికొచ్చే లోహాన్ని సూచిస్తున్న ఈ సందర్భంలో ‘కంచు’ సహజమైన, సాంప్రదాయక ఎంపిక.
- source_word: הַתְּנוּפָה
  choice: ఊపార్పణ
  rationale: యెహోవా సన్నిధిలో ఆచారబద్ధంగా ఊపి సమర్పించే అర్పణను సూచించే సాంకేతిక పదం. సంక్షిప్తమైన ‘ఊపార్పణ’ మూలపదంలోని ఆచార భావాన్ని నిలుపుతుంది.
- source_word: שִׁבְעִים כִּכָּר
  choice: డెబ్బై తలాంతులు
  rationale: כִּכָּר ఒక ప్రాచీన పెద్ద బరువు ప్రమాణం; ఆధునిక బరువుగా మార్చకుండా పారదర్శకంగా ‘తలాంతు’ అని ఉంచబడింది.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: రెండువేల నాలుగువందల షెకెల్లు
  rationale: שֶׁקֶל ప్రాచీన బరువు ప్రమాణం. మూలంలోని సంఖ్యను పూర్తిగా పదాలతో సహజమైన తెలుగు రూపంలో ఇచ్చి, ప్రమాణాన్ని ‘షెకెల్లు’గా నిలుపుకున్నాం.
- source_word: וְ
  choice: (తెలుగులో ప్రత్యేకంగా అనువదించలేదు)
  rationale: హీబ్రూ సంధాన అవ్యయం ముందున్న లెక్కలతో ఈ వాక్యాన్ని కలుపుతుంది. అయితే ఒంటరి తెలుగు వచనంలో ప్రారంభ ‘మరియు’ అసహజంగా ఉండటంతో, అనుసంధానం సందర్భం ద్వారా గ్రహించబడేలా వదిలివేయబడింది.
