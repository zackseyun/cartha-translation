translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రాచీన బరువు ప్రమాణాలను ఆధునిక ప్రమాణాలుగా మార్చకుండా ‘తలాంతులు’, ‘షెకెల్లు’గా ఉంచాం. ఆచార సంబంధిత మూలార్థాన్ని కాపాడటానికి ‘ఊపార్పణ’ అనే సంక్షిప్త సాంకేతిక పదాన్ని ఉపయోగించి, దాని వివరణను పాదటిప్పణిలో ఇచ్చాం.
