  yaml_path: translation/ot/exodus/038/005.yaml
  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: te
  text: అతడు కంచు జాలకపు నాలుగు మూలల్లో[a] నాలుగు ఉంగరాలను పోతపోశాడు; అవి మోయు కర్రల కోసం అమరికలుగా[b] ఉండేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కంచు జాలకపు నాలుగు చివరల్లో.”
    reason: lexical_alternative
  - marker: b
    text: పదశః, “మోయు కర్రలకు ఇళ్లుగా”; అంటే వాటిని చొప్పించి ఉంచే గూళ్లు లేదా అమరికలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: పోతపోశాడు
  rationale: יצק ఇక్కడ లోహాన్ని పోసి ఆకారం చేయడాన్ని సూచిస్తుంది; ‘పోతపోశాడు’ ఆధునిక తెలుగులో లోహపు ఉంగరాల తయారీని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַרְבַּע טַבָּעֹת
  choice: నాలుగు ఉంగరాలు
  rationale: טַבָּעֹת అనేది సామగ్రిని మోయడానికి అమర్చే లోహపు ఉంగరాలను సూచిస్తుంది; ఇది నేరమైన, సహజమైన సమానం.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: నాలుగు మూలల్లో
  rationale: קצה అంటే చివర, అంచు లేదా కొన; దీర్ఘచతురస్రాకార జల్లెడ సందర్భంలో ‘మూలల్లో’ వాటి అమరికను సహజంగా తెలియజేస్తుంది. ‘నాలుగు చివరల్లో’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: కంచు జల్లెడ
  rationale: מִכְבָּר అనేది జాలకపు పని లేదా జల్లెడను సూచిస్తుంది; נְחֹשֶׁתకు ఈ సందర్భంలో ‘కంచు’ సరైన ఆధునిక లోహపదం.
- source_word: בָּתִּים
  choice: కుదురులు
  rationale: పదశః ‘ఇళ్లు’; ఇక్కడ కర్రలను చొప్పించి నిలిపే అమరికలు లేదా గూళ్లను సూచిస్తుంది. ‘కుదురులు’ ఆ క్రియాత్మక భావాన్ని సంక్షిప్తంగా అందిస్తుంది; పదశః రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: לַבַּדִּים
  choice: మోతకర్రలను
  rationale: בדים అనేవి మందిర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలు; ‘మోతకర్రలు’ వాటి ప్రత్యేక ప్రయోజనాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
