    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially misleading “జల్లెడ” with “జాలకం,” uses the more transparent modern expression “మోయు కర్రలు,” and reconnects the rings’ function directly to the casting action. The corner/end ambiguity and the literal sense of בָּתִּים are retained in anchored footnotes.
