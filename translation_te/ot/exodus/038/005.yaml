  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణం వాడబడింది. సాంకేతిక భావాన్ని స్పష్టం చేయడానికి ‘మోతకర్రలు’, ‘కుదురులు’ ఎంచుకోగా, హెబ్రీ మూలంలోని ‘మూలలు/చివరలు’ సందిగ్ధతను మరియు בָּתִּים యొక్క పదశః రూపాన్ని పాదసూచికల్లో నిలిపాం.
