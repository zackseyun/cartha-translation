- from: అతడు బలిపీఠానికి కావలసిన ఉపకరణాలన్నిటినీ—కుండలను[a], పారలను, గిన్నెలను, ముళ్ల కొక్కెములను, నిప్పు పాత్రలను—చేశాడు. దాని ఉపకరణాలన్నిటినీ కంచుతో[b] చేశాడు.
  to: అతడు బలిపీఠపు ఉపకరణాలన్నిటినీ—కుండలను[a], పారలను, గిన్నెలను, ముళ్ల ఫోర్కులను, నిప్పు పాత్రలను—చేశాడు. దాని ఉపకరణాలన్నిటినీ కంచుతో[b] చేశాడు.
