source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: te
  text: అతడు బలిపీఠపు ఉపకరణాలన్నిటినీ—కుండలను[a], పారలను, గిన్నెలను, ముళ్ల ఫోర్కులను, నిప్పు పాత్రలను—చేశాడు. దాని ఉపకరణాలన్నిటినీ కంచుతో[b] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇవి బలిపీఠం నుండి బూడిదను తొలగించడానికి ఉపయోగించే పాత్రలు అయి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాగితో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: బలిపీఠానికి కావలసిన ఉపకరణాలు
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు, సామగ్రి అన్న విస్తృత భావాన్ని కలిగి ఉంది. ఇక్కడ వరుసగా పేర్కొన్న సేవా సామగ్రికి ఆధునిక తెలుగులో ‘ఉపకరణాలు’ సహజంగా సరిపోతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే నిర్మాణాన్ని సూచించే מִזְבֵּחַకు స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: הַסִּירֹת
  choice: కుండలు
  rationale: סִירוֹת సాధారణంగా కుండలు లేదా పెద్ద పాత్రలను సూచిస్తుంది. బలిపీఠ సందర్భంలో ఇవి బూడిదను తొలగించడానికి ఉపయోగించి ఉండవచ్చు; అయితే మూలపాఠం బూడిదను స్పష్టంగా పేర్కొనదు.
- source_word: הַיָּעִים
  choice: పారలు
  rationale: יַע తోడడానికి లేదా ఎత్తడానికి ఉపయోగించే సాధనాన్ని సూచిస్తుంది; బలిపీఠ సేవ సందర్భంలో ‘పారలు’ స్పష్టమైన ఆధునిక పదం.
- source_word: הַמִּזְרָקֹת
  choice: గిన్నెలు
  rationale: מִזְרָקֹת ద్రవాలను, ముఖ్యంగా ఆచార సంబంధమైన ద్రవాలను, పట్టే పాత్రలు. ‘గిన్నెలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని పాత్ర భావాన్ని నిలుపుతుంది.
- source_word: הַמִּזְלָגֹת
  choice: ముళ్ల కొక్కెములు
  rationale: מִזְלָגֹת ముళ్లు గల, ఫోర్కు వంటి పనిముట్లను సూచిస్తుంది. ‘ముళ్ల కొక్కెములు’ వాటి ఆకారాన్నీ బలిపీఠ సేవలోని ఉపయోగాన్నీ సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַמַּחְתֹּת
  choice: నిప్పు పాత్రలు
  rationale: מַחְתָּה నిప్పు లేదా నిప్పుకణికలను మోయడానికి ఉపయోగించే పాత్ర. ‘నిప్పు పాత్రలు’ అనేది ‘ధూపపాత్రలు’ కంటే తక్కువ వ్యాఖ్యాత్మకంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: כָּל כֵּלָיו
  choice: దాని ఉపకరణాలన్నీ
  rationale: ఏకవచన ప్రత్యయం బలిపీఠాన్ని సూచిస్తుంది. ముందటి כְּלֵיతో పదసామ్యాన్ని నిలుపుతూ ‘ఉపకరణాలు’ అని పునరావృతం చేయబడింది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: నివాసమందిరపు సామగ్రి సందర్భంలో נְחֹשֶׁתను సాధారణంగా కంచుగా అర్థం చేసుకోవచ్చు. ‘రాగి’ కూడా సాధ్యమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: చేశాడు ... చేశాడు
  rationale: మూలపాఠంలో עשה రెండుసార్లు రావడాన్ని నిలిపి, మొదట జాబితాను పరిచయం చేసి తరువాత లోహాన్ని తెలిపే ముగింపు వాక్యంగా సహజ తెలుగులో పునరావృతం చేయబడింది.
