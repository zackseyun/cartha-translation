  yaml_path: translation/ot/exodus/038/006.yaml
  text: He made the poles of acacia wood and overlaid them with bronze[a].
translation:
  language: te
  text: అతడు మోయు కర్రలను తుమ్మ చెక్కతో చేసి, వాటిని కంచుతో పొదిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాగి.”
    reason: హెబ్రీయ నְחֹשֶׁת పదం సందర్భానుసారం కంచు లేదా రాగిని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేసి
  rationale: עשה అనే క్రియ యొక్క కథన క్రమరూపం. తెలుగులో తరువాతి క్రియతో అనుసంధానించిన ‘చేసి’ సహజంగా వరుస చర్యను తెలియజేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోయు కర్రలను
  rationale: పరిశుద్ధ సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది. కేవలం ‘కర్రలు’ కంటే ‘మోయు కర్రలు’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטָּה అకేషియా జాతి చెట్టును సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన సహజ వృక్షనామంగా ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וַיְצַף
  choice: పూత పూశాడు
  rationale: లోహంతో పైపొర కప్పడాన్ని సూచించే צפה క్రియకు, పనితన సందర్భంలో సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: אֹתָם
  choice: వాటికి
  rationale: ఈ సర్వనామం ముందున్న మోయు కర్రలను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘వాటికి ... పూత పూశాడు’ సహజం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ హీబ్రూ పదం రాగి లేదా కంచును సూచించగలదు. గుడారపు సామగ్రి సందర్భంలో సంప్రదాయబద్ధమైన ‘కంచు’ను ప్రధాన పాఠంలో ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పనితన భాషను వాడాం. ‘మోయు కర్రలు’ ద్వారా సామగ్రిని రవాణా చేసే వాటి పనిని స్పష్టం చేశాం; మూలంలోని నְחֹשֶׁת పదానికి ఉన్న పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
