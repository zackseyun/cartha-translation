source:
  edition: WLC
  text: כָּל הַ/זָּהָ֗ב הֶֽ/עָשׂוּי֙ לַ/מְּלָאכָ֔ה בְּ/כֹ֖ל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ וַ/יְהִ֣י זְהַ֣ב הַ/תְּנוּפָ֗ה תֵּ֤שַׁע וְ/עֶשְׂרִים֙ כִּכָּ֔ר וּ/שְׁבַ֨ע מֵא֧וֹת וּ/שְׁלֹשִׁ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: te
  text: పరిశుద్ధస్థలానికి సంబంధించిన పనులన్నిటి కోసం ఉపయోగించిన బంగారమంతా—అంటే ఊపి సమర్పించిన బంగారం[a]—పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం ఇరవై తొమ్మిది తలాంతులు, ఏడు వందల ముప్పై షెకెలులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది యెహోవా సన్నిధిలో ఆచారబద్ధంగా ఊపి లేదా కదిలించి సమర్పించే అర్పణను సూచించే హీబ్రూ పదం.
    reason: cultural_note
  - marker: b
    text: తలాంతు, షెకెలు ప్రాచీన తూకపు ప్రమాణాలు; ఇక్కడ షెకెలు బరువు పరిశుద్ధస్థలంలో అంగీకరించిన ప్రమాణం ప్రకారం లెక్కించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: పనులన్నిటిలో ఉపయోగించిన
  rationale: עשה అనే క్రియ యొక్క కర్మణి అసమాపక రూపం ఇక్కడ నిర్మాణ పనిలో బంగారం వినియోగించబడిందని సూచిస్తుంది; బంగారమే ‘తయారు చేయబడింది’ అనే అపార్థాన్ని నివారించడానికి ‘ఉపయోగించిన’ అని అనువదించబడింది.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు పనులన్నిటిలో
  rationale: ఈ సందర్భంలో מְלָאכָה నిర్మాణానికి సంబంధించిన పని మొత్తాన్ని, הַקֹּדֶשׁ పరిశుద్ధస్థలాన్ని సూచిస్తాయి. ఆధునిక తెలుగులో సహజంగా ఉండేలా పదబంధం అమర్చబడింది.
- source_word: זְהַב הַתְּנוּפָה
  choice: ఊపి సమర్పించిన అర్పణగా వచ్చిన బంగారం
  rationale: תְּנוּפָה యెహోవా సన్నిధిలో ఆచారబద్ధంగా కదిలించి లేదా ఊపి సమర్పించే అర్పణను సూచిస్తుంది. పాత సాంకేతిక పదాన్ని మాత్రమే వాడకుండా, ఆ చర్య సాధారణ పాఠకునికి అర్థమయ్యేలా చెప్పబడింది.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: ఇరవై తొమ్మిది తలాంతులు, ఏడు వందల ముప్పై షెకెలులు
  rationale: హీబ్రూ సంఖ్యలను ఆధునిక తెలుగు క్రమంలో ఇచ్చి, ప్రాచీన తూకపు ప్రమాణాల పేర్లను లిప్యంతరీకరించాం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: בְּ ఇక్కడ కొలతకు ఉపయోగించిన ప్రమాణాన్ని సూచిస్తుంది. ‘ప్రమాణం ప్రకారం’ అనే రూపం తెలుగులో అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ, సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం వాడబడింది. ‘తలాంతు,’ ‘షెకెలు’ అనే చారిత్రక తూకపు పేర్లు నిలుపబడి, వాటి స్వభావం పాదసూచికలో వివరించబడింది.
