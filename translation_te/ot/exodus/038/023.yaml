translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వృత్తి పదాల వరుసను నిలిపి, వస్త్రకళకు సంబంధించిన పదార్థాలను సహజమైన తెలుగు వాక్య నిర్మాణంలో ఇచ్చాం. “ఎంబ్రాయిడరీ” అనేది ఆధునిక పాఠకులకు విస్తృతంగా తెలిసిన సాంకేతిక పదం; అస్పష్టమైన లేదా పాతకాలపు ప్రత్యామ్నాయం కంటే స్పష్టత కోసం ఎంచుకున్నాం.
