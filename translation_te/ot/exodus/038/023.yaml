source:
  edition: WLC
  text: וְ/אִתּ֗/וֹ אָהֳלִיאָ֞ב בֶּן אֲחִיסָמָ֛ךְ לְ/מַטֵּה דָ֖ן חָרָ֣שׁ וְ/חֹשֵׁ֑ב וְ/רֹקֵ֗ם בַּ/תְּכֵ֨לֶת֙ וּ/בָֽ/אַרְגָּמָ֔ן וּ/בְ/תוֹלַ֥עַת הַ/שָּׁנִ֖י וּ/בַ/שֵּֽׁשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: te
  text: 'అతనితోపాటు దాను గోత్రానికి చెందిన అహీసామాఖు కుమారుడు అహోలీయాబు ఉన్నాడు. అతడు చెక్కే కళాకారుడు, కళాత్మక నమూనాలు రూపొందించేవాడు, నీలం, ఊదా, ఎర్రని నూలు[a], సన్నని నారతో అలంకార కుట్టుపని చేసేవాడు.


    [a] మూలభాషలోని పదబంధం ఎర్రని రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; దీనిని “ఎర్రని వస్త్రం” అని కూడా అనువదించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని పదబంధం ఎర్రని రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; దీనిని “ఎర్రని వస్త్రం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: అతనితోపాటు ... కూడా ఉన్నాడు
  rationale: మునుపటి వచనంలోని బెసలేలుతో అహోలీయాబు కలిసి పనిచేశాడనే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలో క్రియ లేని నిర్మాణానికి “ఉన్నాడు” సరఫరా చేయబడింది.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: అహీసామాకు కుమారుడు అహోలీయాబు
  rationale: వ్యక్తుల పేర్లను తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, హీబ్రూ పితృనామ సంబంధాన్ని నిలిపింది.
- source_word: לְמַטֵּה דָן
  choice: దాను గోత్రానికి చెందిన
  rationale: దాను గోత్రంతో అతని అనుబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָרָשׁ
  choice: శిల్పి
  rationale: ఈ పదం నైపుణ్యంగల చేతిపనివాణ్ణి సూచిస్తుంది. సందర్భం నిర్దిష్టంగా చెక్కడానికే పరిమితం చేయనందున విస్తృతమైన “శిల్పి”ని ఎంచుకున్నాం.
- source_word: וְחֹשֵׁב
  choice: కళాత్మక నమూనాలు రూపొందించేవాడు
  rationale: గుడారపు వస్త్రాల సందర్భంలో కళాత్మక రూపకల్పన లేదా నమూనాల సృష్టిని సూచించే భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: וְרֹקֵם
  choice: ఎంబ్రాయిడరీ చేసేవాడు
  rationale: వస్త్రంపై రంగుల నూలుతో అలంకార కుట్టుపని చేసే నైపుణ్యాన్ని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: నీలం, ఊదా
  rationale: గుడారపు వస్త్రాలకు సంబంధించిన రెండు రంగు పదాలను సహజమైన తెలుగు రంగు పేర్లతో అనువదిస్తుంది; పదార్థం వాక్యంలోని “నూలు” ద్వారా సందర్భానుసారంగా స్పష్టమవుతుంది.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ హీబ్రూ పదబంధం ఎర్రని రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది. “నూలు” అనడం వస్త్రకళ సందర్భాన్ని స్పష్టం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבַשֵּׁשׁ
  choice: సన్నని నారతో
  rationale: గుడారం మరియు యాజక వస్త్రాల సందర్భంలో שֵׁשׁ నాణ్యమైన సన్నని నారబట్ట లేదా నార పదార్థాన్ని సూచిస్తుంది.
