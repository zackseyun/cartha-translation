source:
  edition: WLC
  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: te
  text: వంద తలాంతుల వెండి పరిశుద్ధ గుడారపు అడుగు ఆధారాలను, తెర అడుగు ఆధారాలను పోయడానికి ఉపయోగపడ్డాయి; వంద తలాంతులకు వంద ఆధారాలు—ప్రతి ఆధారానికి ఒక తలాంతు చొప్పున.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అడుగు ఆధారాలు’కు బదులుగా ‘దిమ్మలు’ లేదా ‘పునాదులు’ అని కూడా అనువదించవచ్చు; ఇవి గుడారపు పలకలు, తెర స్తంభాల కింద అమర్చిన లోహపు ఆధార భాగాలు.
    reason: lexical_alternative
  - marker: b
    text: ఈ ‘తెర’ పరిశుద్ధ స్థలాన్ని అతి పరిశుద్ధ స్థలం నుండి వేరుచేసిన లోపలి తెర.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מְאַת כִּכַּר הַכֶּסֶף
  choice: ఆ వంద తలాంతుల వెండితో
  rationale: లెక్కల సందర్భంలో וַיְהִי వెండి వినియోగాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో సాధనార్థకమైన ‘వెండితో’ సహజంగా ఉండి, నిర్దిష్టమైన వంద తలాంతుల పరిమాణాన్ని నిలుపుతుంది.
- source_word: לָצֶקֶת
  choice: పోతపోశారు
  rationale: లోహాన్ని అచ్చుల్లో పోసి వస్తువులను తయారు చేయడాన్ని సూచించే יצק భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַדְנֵי
  choice: పునాదులు
  rationale: గుడారపు పలకలు, తెర స్తంభాల కింద ఉండే లోహపు ఆధార భాగాలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ‘దిమ్మలు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ మందిరం
  rationale: ఇక్కడ తెరకు భిన్నంగా మొత్తం పవిత్ర గుడార నిర్మాణాన్ని సూచిస్తుంది; కేవలం లోపలి ‘పరిశుద్ధ స్థలం’గా పరిమితం చేయకుండా భావాన్ని నిలుపుతుంది.
- source_word: הַפָּרֹכֶת
  choice: తెర
  rationale: పరిశుద్ధ స్థలాన్ని అతి పరిశుద్ధ స్థలం నుండి వేరుచేసే లోపలి విభజన తెరను సూచించే సహజ తెలుగు పదం.
- source_word: מְאַת אֲדָנִים לִמְאַת הַכִּכָּר
  choice: వంద తలాంతులతో వంద పునాదులు
  rationale: వంద పునాదులకు వంద తలాంతులు ఉపయోగించారనే సంఖ్యాత్మక అనురూపతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כִּכָּר לָאָדֶן
  choice: ఒక్కో పునాదికి ఒక్క తలాంతు చొప్పున
  rationale: మూలంలోని పంపిణీ నిష్పత్తిని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే లెక్కల శైలిని ఉపయోగించాం. కొలమానమైన ‘తలాంతు’ను సంప్రదాయ బైబిలు పదంగా నిలిపాం; అసలు వచనంలోని సంఖ్యా పునరుక్తిని కూడా కాపాడాం.
