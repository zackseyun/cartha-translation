  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: te
  text: వాటి స్తంభాలు ఇరవై; వాటి ఇరవై ఆధారాలు కంచువి. స్తంభాల కొక్కేలూ వాటి పట్టీలూ వెండివి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పట్టీలు” అని అనువదించిన హీబ్రూ పదం స్తంభాలకు సంబంధించిన పట్టీలను లేదా అనుసంధాన భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: వాటి స్తంభాలు
  rationale: עַמּוּדִים నిర్మాణానికి ఆధారమైన స్తంభాలను సూచిస్తుంది. పుంలింగ బహువచన ప్రత్యయం సందర్భంలోని తెరలు లేదా ఆ వైపు ఏర్పాటును తిరిగి సూచిస్తుంది; తెలుగులో సహజంగా ‘వాటి’ అని అనువదించాం.
- source_word: עֶשְׂרִים
  choice: ఇరవై
  rationale: రెండు చోట్లా ఉన్న సాధారణ సంఖ్యావాచకానికి నేర అనువాదం.
- source_word: אַדְנֵיהֶם
  choice: వాటి ఇరవై పీఠాలు
  rationale: గుడార నిర్మాణ సందర్భంలో אֶדֶן స్తంభాన్ని నిలబెట్టే అడుగు భాగం లేదా ఆధారపు గూటిని సూచిస్తుంది. ఆధునిక తెలుగులో స్పష్టంగా ఉండేందుకు ‘పీఠాలు’ ఎంచుకున్నాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా రాగి మిశ్రమమైన కంచును సూచించగలదు. గుడార సామగ్రి సందర్భంలో సాంప్రదాయికంగానూ సందర్భోచితంగానూ ‘కంచు’ సరిపోతుంది.
- source_word: וָוֵי
  choice: కొక్కేలు
  rationale: స్తంభాలకు తెరలను తగిలించడానికి లేదా అనుసంధానించడానికి ఉపయోగించిన వంకర అమరికలను సూచిస్తుంది; ‘కొక్కేలు’ వాటి సాధ్యమైన పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעַמֻּדִים
  choice: స్తంభాల
  rationale: וָוֵיతో నిర్మాణ సంబంధంలో ఉండి, కొక్కేలు స్తంభాలకు చెందినవని సూచిస్తుంది.
- source_word: חֲשֻׁקֵיהֶם
  choice: వాటి బిగింపు పట్టీలు
  rationale: ఈ అరుదైన గుడార నిర్మాణ పదం స్తంభాలకు అమర్చిన పట్టీలు లేదా అనుసంధాన భాగాలను సూచించే అవకాశం ఉంది. ‘బిగింపు పట్టీలు’ ఆధునిక పాఠకునికి అర్థమయ్యేలా ఉండి, ఖచ్చిత రూపంపై ఉన్న అనిశ్చితిని అతిగా పరిష్కరించదు.
- source_word: כָּסֶף
  choice: వెండి
  rationale: లోహాన్ని సూచించే పదానికి నేరమైన తెలుగు సమానార్థకం.
