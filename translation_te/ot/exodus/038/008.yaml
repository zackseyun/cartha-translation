  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: te
  text: సమావేశ గుడారం ప్రవేశద్వారం వద్ద సేవచేసిన స్త్రీల అద్దాల నుండి[a][b] అతడు కంచు గంగాళాన్ని, దాని కంచు పీఠాన్ని చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమావేశ గుడారం ప్రవేశద్వారం వద్ద కూడివచ్చిన స్త్రీలు.” హీబ్రూ పదప్రయోగం క్రమబద్ధంగా కూడడాన్నీ, సేవచేయడాన్నీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: పూర్వకాలపు అద్దాలు సాధారణంగా గాజుతో కాకుండా మెరుగుపెట్టిన కంచు వంటి లోహంతో తయారయ్యేవి.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: గంగాళం
  rationale: సమావేశ గుడారపు సేవలో కడుక్కోవడానికి ఉపయోగించిన పెద్ద పాత్రను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: כַּן
  choice: పీఠం
  rationale: గంగాళానికి ఆధారంగా ఉన్న నిలువు మద్దతు లేదా అడుగు భాగాన్ని సూచిస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: గుడారపు ఉపకరణాల సందర్భంలో ఈ లోహపదానికి సంప్రదాయబద్ధమైన, సందర్భోచితమైన తెలుగు సమానం; మూలపదం రాగి లేదా రాగి మిశ్రమాన్ని విస్తృతంగా సూచించగలదు.
- source_word: בְּמַרְאֹת
  choice: అద్దాలతో
  rationale: ఇక్కడ בְ పదార్థం లేదా మూలసామగ్రిని సూచిస్తుంది; ఆ అద్దాల లోహంతో గంగాళం, పీఠం చేయబడ్డాయని భావం.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: సేవ చేసిన స్త్రీలు
  rationale: צבא ధాతువు క్రమబద్ధంగా కూడడం లేదా సేవకు హాజరవడం అనే భావాలను కలిగి ఉంది; యాజక పరిచర్యను ప్రత్యేకంగా ఆపాదించకుండా ఉద్దేశపూర్వక సేవను తెలియజేస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం ప్రవేశద్వారం దగ్గర
  rationale: స్థలసూచనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: హీబ్రూ కథనంలోని ఏకవచన కర్తను, పూర్తయిన క్రియను సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ అనే పదబంధంలో స్త్రీల పాత్ర
  choice: సేవ చేసిన స్త్రీలు
  alternative: కూడివచ్చిన స్త్రీలు
  rationale: మూలంలోని צבא క్రమబద్ధంగా కూడడం, సేవ చేయడం అనే రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో ‘సేవ చేసిన’ అని ఉంచి, అధికారిక యాజక హోదాను సూచించకుండా సందర్భంలోని ఉద్దేశపూర్వక కార్యకలాపాన్ని తెలియజేసి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సమావేశ గుడారం’ అనే పరిచిత బైబిలు పదబంధాన్ని ఉంచుతూ, ‘గంగాళం’, ‘పీఠం’ వంటి స్పష్టమైన వస్తు పదాలను వాడాం. రెండు పాదటిప్పణి సూచికలూ సంబంధిత ‘అద్దాలతో’ అన్న పదం వెంట ప్రధాన పాఠంలో ఉన్నాయి.
