  to: సమావేశ గుడారం ప్రవేశద్వారం వద్ద సేవచేసిన స్త్రీల అద్దాల నుండి[a][b] అతడు కంచు గంగాళాన్ని, దాని కంచు పీఠాన్ని చేశాడు.
