revisions:
- from: ప్రాంగణ ద్వారానికి ఈ వైపున, ఆ వైపున ఉన్న మరొక పక్కభాగానికి[a] పదిహేను మూరల తెరలు ఉన్నాయి; వాటి స్తంభాలు మూడు, వాటి దిమ్మలు[b] మూడు.
  to: ప్రాంగణ ద్వారానికి ఈ వైపునా ఆ వైపునా ఉన్న మరొక పక్క భాగంలో పదిహేను మూరల తెరలు ఉన్నాయి; వాటి స్తంభాలు మూడు, వాటి ఆధారాలు మూడు.[a]
  rationale: The revision clarifies the spatial phrase while retaining “ఈ వైపునా ఆ వైపునా,” which reflects מִזֶּה וּמִזֶּה, and preserves the Hebrew inventory-like statement of measurements and counts. “ఆధారాలు” is substituted for “దిమ్మలు” to represent the pillars’ bases more accurately in modern Telugu. The displaced footnote anchor is placed on the term it qualifies; no footnote is needed for the straightforward spatial wording.
