base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: te
  text: ప్రాంగణ ద్వారానికి ఈ వైపునా ఆ వైపునా ఉన్న మరొక పక్క భాగంలో పదిహేను మూరల తెరలు ఉన్నాయి; వాటి స్తంభాలు మూడు, వాటి ఆధారాలు మూడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి గూటులు మూడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: మరొక పక్కభాగానికి
  rationale: כָּתֵף అక్షరార్థంగా ‘భుజం’; ఇక్కడ ద్వారాన్ని ఆనుకొని ఉన్న పక్కభాగాన్ని సూచిస్తుంది. ‘మరొక పక్కభాగం’ నిర్మాణ సంబంధమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఈ వైపున, ఆ వైపున
  rationale: ద్వారానికి ఇరువైపులా ఉన్న భాగాలను సూచించే పంపిణీ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: ప్రాంగణ ద్వారానికి
  rationale: లామెద్ సూచించే ద్వారంతో గల స్థలసంబంధాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ప్రాంగణపు ఆవరణను ఏర్పరచే వేలాడే వస్త్రాలను సూచిస్తుంది; ఆధునిక పాఠకులకు ‘తెరలు’ సులభంగా అర్థమవుతుంది.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: పదిహేను మూరల
  rationale: ప్రాచీన కొలమానాన్ని మార్పిడి చేయకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’తో అందిస్తుంది.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: వాటి స్తంభాలు మూడు
  rationale: హీబ్రూ భాషలోని క్రియారహిత, జాబితా తరహా నిర్మాణాన్ని తెలుగులోనూ సహజంగా నిలుపుతుంది.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: వాటి దిమ్మలు మూడు
  rationale: אֶדֶן స్తంభాన్ని నిలబెట్టే ఆధారపు దిమ్మ లేదా గూటిని సూచించవచ్చు. ‘దిమ్మలు’ నిర్మాణాత్మక ఆధారాల భావాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
