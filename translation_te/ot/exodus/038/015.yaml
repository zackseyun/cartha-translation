translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణ పదజాలం వాడబడింది. హీబ్రూ వాక్యంలోని కొలతలు-స్తంభాలు-దిమ్మల జాబితా శైలి సాధ్యమైనంతవరకు నిలుపబడింది.
