  to: సమాజంలోని లెక్కించబడినవారి వెండి మొత్తం వంద తలాంతులు, పరిశుద్ధస్థల షెకెలు ప్రమాణం ప్రకారం వెయ్యి ఏడు వందల డెబ్బై ఐదు షెకెలులు[a].
