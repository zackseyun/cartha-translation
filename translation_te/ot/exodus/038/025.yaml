source:
  edition: WLC
  text: וְ/כֶ֛סֶף פְּקוּדֵ֥י הָ/עֵדָ֖ה מְאַ֣ת כִּכָּ֑ר וְ/אֶלֶף֩ וּ/שְׁבַ֨ע מֵא֜וֹת וַ/חֲמִשָּׁ֧ה וְ/שִׁבְעִ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: te
  text: సమాజంలోని లెక్కించబడినవారి వెండి మొత్తం వంద తలాంతులు, పరిశుద్ధస్థల షెకెలు ప్రమాణం ప్రకారం వెయ్యి ఏడు వందల డెబ్బై ఐదు షెకెలులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పరిశుద్ధస్థలానికి సంబంధించిన ప్రామాణిక బరువు కొలత ప్రకారం.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: వెండి
  rationale: ఈ లెక్కల సందర్భంలో ఇది ధనాన్ని సాధారణంగా కాకుండా సేకరించిన వెండి లోహాన్ని సూచిస్తుంది.
- source_word: פְּקוּדֵי הָעֵדָה
  choice: సమాజంలో లెక్కించబడినవారి
  rationale: జనగణనలో నమోదు చేసి లెక్కించిన వ్యక్తులను సూచించే పరిపాలనా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְאַת כִּכָּר
  choice: వంద తలాంతులు
  rationale: ככר అనే ప్రాచీన పెద్ద బరువు ప్రమాణానికి తెలుగులో స్థిరపడిన బైబిలు పదం ‘తలాంతు’; మూలంలోని సంఖ్యను నేరుగా నిలుపుతుంది.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: వెయ్యి ఏడు వందల డెబ్బై ఐదు షెకెలులు
  rationale: హీబ్రూ కూడిక సంఖ్యాక్రమం మొత్తం 1,775 షెకెలులను ఇస్తుంది; దానిని స్పష్టమైన ఆధునిక తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది ఉపయోగించిన బరువు ప్రమాణాన్ని సూచిస్తుంది; ‘ప్రమాణం ప్రకారం’ అనే మాట ఆ కొలత భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లెక్కల సందర్భానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ప్రాచీన బరువు ప్రమాణాలైన ‘తలాంతు’, ‘షెకెలు’లను అనువదించకుండా లిప్యంతరీకరించాం; షెకెలు ప్రమాణం భావాన్ని పాదసూచికలో వివరించాం.
