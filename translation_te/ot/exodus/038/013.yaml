  text: וְ/לִ/פְאַ֛ת קֵ֥דְמָ/ה מִזְרָ֖חָ/ה חֲמִשִּׁ֥ים אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/013.yaml
  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: te
  text: తూర్పు వైపున[a] యాభై మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “తూర్పు వైపున, సూర్యోదయ దిశగా.”
    reason: మూలంలోని קֵדְמָה מִזְרָחָה అనే జత దిశాసూచక ప్రయోగాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: వైపున
  rationale: పֵאָה అనే పదం ‘వైపు, అంచు, సరిహద్దు’ అనే అర్థాలను ఇస్తుంది. ప్రాకారపు కొలతల సందర్భంలో ‘వైపున’ సహజంగా ఉంటుంది; לְ ఉపసర్గ సంబంధిత వైపును సూచిస్తోంది.
- source_word: קֵדְמָ/ה מִזְרָחָ/ה
  choice: తూర్పు
  rationale: ఈ రెండు దిశాసూచక రూపాలు తూర్పును, అక్షరార్థంగా సూర్యోదయ దిశను, బలపరుస్తూ సూచిస్తున్నాయి. తెలుగులో ‘తూర్పు వైపున’ సహజంగా ఉండగా, మూలంలోని జతపద ప్రయోగాన్ని పాదసూచికలో నిలిపాం.
- source_word: חֲמִשִּׁים
  choice: యాభై
  rationale: సంఖ్యకు నేరమైన ఆధునిక తెలుగు రూపం.
- source_word: אַמָּה
  choice: మూరలు
  rationale: అమ్మా అనే ప్రాచీన పొడవు ప్రమాణానికి తెలుగులో స్థిరపడిన బైబిలు కొలమాన పదం ‘మూర’; బహువచనంలో ‘మూరలు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కొలత వాక్యంగా రూపొందించాం. ‘మూరలు’ అనే సాంప్రదాయ బైబిలు కొలమాన పదాన్ని నిలిపి, మూలంలోని పునరుక్త దిశా వ్యక్తీకరణను అసహజంగా ప్రధాన వాక్యంలో పునరావృతం చేయకుండా పాదసూచికలో ఇచ్చాం.
