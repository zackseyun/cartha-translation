- from: అతడు దాని నాలుగు మూలలపై కొమ్ములను చేశాడు. ఆ కొమ్ములు దానిలో భాగంగానే ఉన్నాయి[a]. దానిని కంచుతో[b] తాపడం చేశాడు.
  to: అతడు దాని నాలుగు మూలలపై దాని కొమ్ములను చేశాడు. ఆ కొమ్ములు దానితో ఒకే భాగంగా ఉన్నాయి[a]. దానికి కంచుతో తాపడం వేశాడు[b].
