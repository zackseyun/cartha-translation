source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ קַרְנֹתָ֗י/ו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔י/ו מִמֶּ֖/נּוּ הָי֣וּ קַרְנֹתָ֑י/ו וַ/יְצַ֥ף אֹת֖/וֹ נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: te
  text: అతడు దాని నాలుగు మూలలపై దాని కొమ్ములను చేశాడు. ఆ కొమ్ములు దానితో ఒకే భాగంగా ఉన్నాయి[a]. దానికి కంచుతో తాపడం వేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “దాని నుంచే దాని కొమ్ములు ఉన్నాయి.” అంటే అవి విడిగా చేసి అమర్చినవి కాకుండా దానితో ఏకంగా రూపొందాయి.
    reason: lexical_alternative
  - marker: b
    text: నెహోషెత్ అనే హెబ్రీ పదం కంచును లేదా రాగిని సూచించవచ్చు; పరిశుద్ధ గుడారపు సామగ్రి సందర్భంలో “కంచు” సాంప్రదాయక అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה అనే సాధారణ నిర్మాణ క్రియను ఆధునిక తెలుగు కథనశైలిలో సహజంగా వ్యక్తపరుస్తుంది; వావ్-క్రమ కథన సంబంధాన్ని ప్రత్యేకంగా ‘మరియు’ అని చూపడం తెలుగులో అవసరం లేదు.
- source_word: קַרְנֹתָיו
  choice: దాని ... కొమ్ములను
  rationale: קֶרֶן యొక్క మౌలిక అర్థం ‘కొమ్ము.’ బలిపీఠపు మూలలపై ఉన్న కొమ్ములాంటి పొడిగింపులకు వాడే ఆరాధనా నిర్మాణ పదచిత్రాన్ని ఇది నిలుపుతుంది.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: దాని నాలుగు మూలలపై
  rationale: עַל అనే స్థానసూచక అవ్యయాన్నీ, నాలుగు మూలలన్న స్పష్టమైన నిర్మాణ వివరాన్నీ దగ్గరగా, సహజంగా అందిస్తుంది.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: ఆ కొమ్ములు దానిలో భాగంగానే ఉన్నాయి
  rationale: అక్షరార్థంగా ‘దాని నుంచే దాని కొమ్ములు ఉన్నాయి.’ కొమ్ములు విడిగా జోడించినవి కాక బలిపీఠంతో సమగ్రంగా రూపొందినవనే నిర్మాణ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: וַיְצַף אֹתוֹ
  choice: దానిని ... తాపడం చేశాడు
  rationale: צפה అనే క్రియ ఇక్కడ లోహంతో పైపొరగా కప్పడం లేదా పొదగడం అనే నిర్మాణార్థంలో ఉంది. ‘తాపడం చేశాడు’ అనేది లోహపు ఆవరణను సూచించే స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: נְחֹשֶׁת రాగి లేదా కంచును సూచించగలదు. ప్రత్యక్ష గుడారపు సామగ్రి సందర్భంలో ‘కంచు’ స్థిరమైన, సందర్భోచిత అనువాదం; పదార్థ సంబంధ అనిశ్చితిని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన నిర్మాణశైలి వాడబడింది. ‘కొమ్ములు’ అనే స్పష్టమైన హెబ్రీ రూపకం నిలుపబడింది; ‘తాపడం’ లోహంతో కప్పే పనిని ఖచ్చితంగా సూచిస్తుంది. మూలపాఠంలోని రెండు పదార్థ/నిర్మాణ అనిశ్చితులు పాదసూచికల్లో భద్రపరచబడ్డాయి.
