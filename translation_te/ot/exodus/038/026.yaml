translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం ఉపయోగించాం. ప్రాచీన కొలమానాలైన ‘బేకా’, ‘షెకెలు’ పదాలను నిలిపి, వాటి సంబంధాన్ని ప్రధాన వాక్యం మరియు పాదటిప్పణిలో వివరించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
