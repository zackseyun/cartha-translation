source:
  edition: WLC
  text: בֶּ֚קַע לַ/גֻּלְגֹּ֔לֶת מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ לְ/כֹ֨ל הָ/עֹבֵ֜ר עַל הַ/פְּקֻדִ֗ים מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: te
  text: లెక్కింపబడినవారిలో చేరిన, ఇరవై సంవత్సరాల వయస్సు నుంచీ అంతకంటే పైబడిన ప్రతి ఒక్కరికి తలకు ఒక బేకా[a] చొప్పున—అంటే పరిశుద్ధస్థలపు షెకెలు ప్రకారం అర షెకెలు—మొత్తం 6,03,550 మంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక బేకా పరిశుద్ధస్థలపు ప్రమాణం ప్రకారం అర షెకెలుకు సమానం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘లెక్కింపబడినవారి మధ్యగా దాటిన ప్రతి ఒక్కరికి.’ జనగణనలో నమోదు కావడాన్ని సూచించడానికి హీబ్రూ ‘దాటడం’ అనే ప్రతిమను ఉపయోగిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: బేకా
  rationale: ఇది నిర్దిష్టమైన ప్రాచీన బరువు ప్రమాణం. తరువాతి సమానార్థక వివరణ దాని విలువ అర షెకెలు అని స్పష్టం చేస్తున్నందున సాంకేతిక పదాన్ని లిప్యంతరీకరించాం.
- source_word: לַגֻּלְגֹּלֶת
  choice: తలకు
  rationale: అక్షరార్థంగా ‘పుర్రెకు’; జనగణనలో ఒక్కొక్క వ్యక్తిని సూచించే హీబ్రూ నుడికారం. తెలుగులో ‘తలకు’ అదే లెక్కింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: అర షెకెలు
  rationale: బేకా విలువను నేరుగా తెలిపే పదబంధం.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలపు షెకెలు ప్రమాణం ప్రకారం
  rationale: ఇది చెల్లింపు జరిగిన ప్రదేశాన్ని కాక, పరిశుద్ధ స్థలంలో అనుసరించిన ప్రామాణిక బరువును సూచిస్తుంది; ‘ప్రమాణం ప్రకారం’ ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: లెక్కలో నమోదైన వారిలో ... ప్రతి ఒక్కరి నుండి
  rationale: మూలంలోని ‘లెక్కింపబడినవారి మీదుగా/మధ్యగా దాటిన’ జనగణన నుడికారాన్ని సహజ తెలుగులో నమోదు భావంతో అందించాం; ప్రత్యక్ష ‘దాటడం’ రూపకాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై సంవత్సరాలు మొదలుకొని అంతకంటే ఎక్కువ వయస్సుగల
  rationale: జనగణనకు వర్తించే వయోపరిమితిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 6,03,550 మంది
  rationale: హీబ్రూ సంఖ్యను భారతీయ అంకెల విభజన పద్ధతిలో స్పష్టంగా చూపించి, ఇది వ్యక్తుల మొత్తం అని ‘మంది’తో తెలిపాం.
