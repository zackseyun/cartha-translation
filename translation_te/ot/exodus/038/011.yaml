  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: te
  text: ఉత్తరం వైపున దాని పొడవు వంద మూరలు. దాని స్తంభాలు ఇరవై, వాటి కంచు పీఠాలు ఇరవై. స్తంభాల కొక్కాలు, వాటి బిగింపు పట్టీలు[a] వెండివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటి చుట్టుపట్టీలు వెండివి.’ హీబ్రూ పదం స్తంభాలకు సంబంధించిన వెండి నిర్మాణ అమరికలను సూచిస్తుంది; వాటి ఖచ్చితమైన రూపం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: ఉత్తరం వైపున
  rationale: పאה అనేది వైపు లేదా అంచును సూచిస్తుంది; צפוןతో కలిసి ప్రాంగణపు ఉత్తర వైపును సూచిస్తోంది.
- source_word: מֵאָה בָאַמָּה
  choice: పొడవు వంద మూరలు
  rationale: హీబ్రూ పదబంధం కొలతను సంక్షిప్తంగా ఇస్తుంది. తెలుగులో భావం సహజంగా స్పష్టమయ్యేలా ‘పొడవు’ చేర్చబడింది; ‘మూర’ అम्मా అనే ప్రాచీన కొలమానానికి సాధారణ తెలుగు సమానం.
- source_word: עַמּוּדֵיהֶם
  choice: దాని స్తంభాలు ఇరవై
  rationale: עַמּוּדִים నిర్మాణాన్ని నిలబెట్టే స్తంభాలు. హీబ్రూలోని బహువచన ప్రత్యయాన్ని సందర్భానుసారంగా ఉత్తర వైపు ఏర్పాటును సూచించే ఏకవచన ‘దాని’గా సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: אַדְנֵיהֶם
  choice: వాటి కంచు పీఠాలు ఇరవై
  rationale: אדן ఇక్కడ స్తంభాలను నిలబెట్టే అడుగు ఆధారాలను సూచిస్తుంది. ‘పీఠాలు’ ఆధునిక పాఠకులకు ‘సాకెట్లు’ కంటే స్పష్టంగా ఉంటుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: గుడారపు సామగ్రి సందర్భంలో ఈ లోహపదానికి సంప్రదాయంగా, సందర్భోచితంగా ‘కంచు’ వాడబడుతుంది; మూలపదం రాగి లేదా రాగి మిశ్రమాన్నీ సూచించగలదు.
- source_word: וָוֵי הָעַמּוּדִים
  choice: స్తంభాల కొక్కాలు
  rationale: וָוִים ఇక్కడ స్తంభాలకు అమర్చిన కొక్కాలను సూచిస్తుంది; గుడారపు మేకులను కాదు.
- source_word: חֲשֻׁקֵיהֶם
  choice: వాటి బిగింపు పట్టీలు
  rationale: ఈ పదం స్తంభాలకు సంబంధించిన వెండి బిగింపు అమరికలను సూచిస్తుంది. వాటి ఖచ్చితమైన ఆకారం అనిశ్చితమైనందున చదవడానికి సహజమైన పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: כָּסֶף
  choice: వెండి
  rationale: ఇది కొక్కాలు, బిగింపు పట్టీలు ఏ లోహంతో చేయబడ్డాయో తెలిపే సాధారణ పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణ పదజాలం వాడబడింది. మూలంలోని జాబితా ధోరణిని నిలుపుకుంటూ, తెలుగులో కొలత స్పష్టత కోసం ‘పొడవు’ చేర్చబడింది. పాదసూచిక గుర్తు సంబంధిత సందిగ్ధ పదమైన ‘బిగింపు పట్టీలు’ వద్ద ఉంచబడింది.
