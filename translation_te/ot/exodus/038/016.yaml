translation:
  language: te
  text: ప్రాంగణాన్ని చుట్టుముట్టిన తెరలన్నీ మెలిపెట్టిన నారతో చేసినవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాంగణం చుట్టూ ఉన్న పరదాలన్నీ మెలిపెట్టిన నారతో చేసినవి.”
    reason: קַלְעֵיకి ‘తెరలు’ లేదా ‘పరదాలు’ అనే సమీప సందర్భానుకూల ప్రత్యామ్నాయాలు సాధ్యమైనందున.
lexical_decisions:
- source_word: כָּל
  choice: అన్నీ
  rationale: ప్రాంగణపు తెరల సంపూర్ణ సమూహాన్ని సూచించే పరిమాణపదం; సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: קַלְעֵי
  choice: తెరలు
  rationale: మందిర ప్రాంగణాన్ని చుట్టుముట్టి ఆవరణగా నిలిచిన వస్త్రాలను సూచిస్తుంది; తెలుగులో ‘తెరలు’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: ఇక్కడ ప్రత్యక్ష గుడారం వెలుపల ఉన్న ఆవరిత స్థలాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన స్థలార్థాన్ని ఇస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అన్ని వైపులా ఉన్న పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֵׁשׁ
  choice: నార
  rationale: మందిర వస్త్రాల సందర్భంలో నారతో చేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; మూలంలో లేని అదనపు గుణవిశేషాన్ని చేర్చకుండా పదార్థాన్ని తెలుపుతుంది.
- source_word: מָשְׁזָר
  choice: సన్నగా పేనిన
  rationale: దారాలను మెలిపెట్టి లేదా కలిపి పేనిన నైపుణ్యాన్ని సూచిస్తుంది; ‘సన్నగా పేనిన నార’ తెలుగులో సహజమైన వస్త్రవర్ణన.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే ఆరాధనా నిర్మాణ సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో ఉంచబడింది. మూలంలోని సంక్షిప్త నామవాక్య స్వరూపాన్ని తెలుగులో స్పష్టత కోసం ‘చేసినవి’తో పూర్తి చేశాం.
