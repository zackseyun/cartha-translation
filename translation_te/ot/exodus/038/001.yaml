translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కొలతల క్రమం, బలిపీఠపు చతురస్ర ఆకారం నిలుపబడ్డాయి. ఈ వచనానికి పాఠ్య లేదా తాత్త్విక సందిగ్ధతను వివరించే పాదటిప్పణి అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు లేవు.
