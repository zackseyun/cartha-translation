source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: te
  text: అతడు అకేషియా చెక్కతో దహనబలి బలిపీఠాన్ని చేశాడు; దాని పొడవు ఐదు మూరలు, వెడల్పు ఐదు మూరలు—అది చతురస్రం—దాని ఎత్తు మూడు మూరలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సెక్యూటివ్‌తో కూడిన עשה గత కథనక్రియను సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అతడు ... చేశాడు’ సహజంగా ఉంటుంది.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి అర్పించే బలిపీఠం
  rationale: ఈ నిర్మాణబంధం పూర్తిగా దహించబడే బలితో సంబంధమున్న బలిపీఠాన్ని సూచిస్తుంది. ‘అర్పించే’ అనే సంబంధరూపం తెలుగులో ప్రయోజనాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్క
  rationale: שִׁטָּה అకేషియా జాతి చెట్టును సూచిస్తుంది; తెలుగు వాడుకలో దానికి సహజమైన సమానార్థకం ‘తుమ్మ’. ‘చెక్క’ నిర్మాణ పదార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: חָמֵשׁ אַמּוֹת
  choice: ఐదు మూరలు
  rationale: אַמָּה ప్రాచీన మోచేతి-ఆధారిత కొలమానం. గుడారపు కొలతల ఏకరూపతను నిలుపుతూ, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’ను ఉపయోగించాం; ఆధునిక ప్రమాణంలోకి మార్చలేదు.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: ప్రత్యయం బలిపీఠాన్ని సూచిస్తుంది. ‘దాని పొడవు’ తెలుగు కొలతల వర్ణనలో సహజం.
- source_word: רָחְבּוֹ
  choice: వెడల్పు
  rationale: నిర్మాణ కొలత సందర్భంలో רחבకు ఆధునిక తెలుగులో ‘వెడల్పు’ స్పష్టమైన సమానార్థకం.
- source_word: רָבוּעַ
  choice: చతురస్రంగా
  rationale: ఈ విశేషణం నాలుగు సమాన భుజాలుగల ఆకారాన్ని సూచిస్తుంది. ‘చతురస్రంగా’ ఖచ్చితమైన, సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: קֹמָתוֹ
  choice: దాని ఎత్తు
  rationale: నిర్మాణ సందర్భంలో קוֹמָה అంటే ఎత్తు. ‘దాని ఎత్తు’ స్పష్టంగా, సహజంగా ఉంది.
