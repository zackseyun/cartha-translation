translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ జాబితా స్వభావాన్ని నిలుపుకుంటూనే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘మూర’ సంప్రదాయ బైబిలు కొలమాన పదంగా ఉంచబడింది; సాంకేతికంగా అనిశ్చితమైన חֲשׁוּקֵיהֶםకు ప్రధాన పాఠంలో సులభమైన పదాన్ని ఇచ్చి, ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
