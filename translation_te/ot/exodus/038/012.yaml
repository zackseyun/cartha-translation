source:
  edition: WLC
  text: וְ/לִ/פְאַת יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֥ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשׁוּקֵי/הֶ֖ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: te
  text: పడమటి వైపున యాభై మూరల పొడవైన తెరలు ఉండేవి; వాటికి పది స్తంభాలు, పది ఆధారాలు ఉండేవి. స్తంభాల కొండీలు, వాటి పట్టీలు[a] వెండివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని కలిపే కడ్డీలు.” ఈ హీబ్రూ సాంకేతిక పదం స్తంభాలకు అమర్చిన పట్టీలు, కడ్డీలు లేదా అలంకార కలుపు భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: పడమటి వైపున
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’ అయినా, ఈ సందర్భంలో పడమటిని సూచించే దిక్సూచి పదం; פְאַת అంటే వైపు లేదా అంచు.
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టి ఏర్పరచిన వస్త్రపు ఆవరణలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెరలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: యాభై మూరల పొడవైన
  rationale: אַמָּה ప్రాచీన పొడవు ప్రమాణమైన మూర; సందర్భంలో తెరల విస్తీర్ణం కాక పొడవు ఉద్దేశించబడింది.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: వాటికి పది స్తంభాలు
  rationale: హీబ్రూ జాబితా శైలిని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: పది దిమ్మలు
  rationale: אֶדֶן స్తంభాన్ని నిలబెట్టే అడుగు భాగం లేదా ఆధారపు దిమ్మను సూచిస్తుంది; ‘దిమ్మలు’ నిర్మాణ సందర్భంలో సంక్షిప్తంగా అర్థమవుతుంది.
- source_word: וָוֵי הָעַמֻּדִים
  choice: స్తంభాల కొక్కేలు
  rationale: וָוִים స్తంభాలకు అమర్చిన వంకర పట్టింపు భాగాలను, అంటే కొక్కేలను సూచిస్తుంది.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: వాటి కడ్డీలు
  rationale: ఈ సాంకేతిక నిర్మాణ పదానికి ఖచ్చితమైన ఆకృతి అనిశ్చితం; స్తంభాలకు అమర్చిన లేదా వాటిని కలిపిన లోహపు భాగాలు అనే సాధారణ భావాన్ని ‘కడ్డీలు’ తెలియజేస్తుంది.
- source_word: כָּסֶף
  choice: వెండితో చేసినవి
  rationale: చివరి నామవాచకం కొక్కేలు మరియు సంబంధిత అమరికల పదార్థాన్ని విధేయంగా తెలియజేస్తుంది.
