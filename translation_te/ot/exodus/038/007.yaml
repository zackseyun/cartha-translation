translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మోతకర్రలు,’ ‘బలిపీఠం,’ ‘పలకలు’ వంటి స్పష్టమైన నిర్మాణ పదాలు వాడబడ్డాయి. మూలంలోని సంక్షిప్తమైన ‘נְבוּב לֻחֹת’ నిర్మాణానికి సంబంధించిన సందిగ్ధతను [b] పాదసూచికలో నిలుపుకున్నాం.
