source:
  edition: WLC
  text: וַ/יָּבֵ֨א אֶת הַ/בַּדִּ֜ים בַּ/טַּבָּעֹ֗ת עַ֚ל צַלְעֹ֣ת הַ/מִּזְבֵּ֔חַ לָ/שֵׂ֥את אֹת֖/וֹ בָּ/הֶ֑ם נְב֥וּב לֻחֹ֖ת עָשָׂ֥ה אֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: te
  text: బలిపీఠాన్ని వాటితో మోయడానికి, దాని పక్కలున్న ఉంగరాల్లో మోయు కర్రలను పెట్టాడు.[a] పలకలతో దానిని లోపల ఖాళీగా ఉండేలా నిర్మించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోయు కర్రలను ఉంగరాల్లోకి తీసుకొచ్చాడు.’ హీబ్రూ క్రియను అక్షరార్థంగా ‘తీసుకొచ్చాడు’ అని అనువదించవచ్చు; అయితే ఈ సందర్భంలో వాటిని ఉంగరాల్లో పెట్టి అమర్చడం భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బోలు, పలకలు.’ ఈ సంక్షిప్త హీబ్రూ పదబంధం బలిపీఠం పలకలతో చేసిన, లోపల ఖాళీగా ఉన్న నిర్మాణమని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: దూర్చాడు
  rationale: בוא యొక్క హిఫీల్ రూపం ఇక్కడ కర్రలను ఉంగరాల్లోకి ప్రవేశపెట్టి అమర్చడాన్ని సూచిస్తుంది; ‘దూర్చాడు’ ఆధునిక తెలుగులో ఈ కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోతకర్రలను
  rationale: నివాసగుడారపు సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది; ‘మోతకర్రలు’ వాటి ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּטַּבָּעֹת
  choice: ఉంగరాల్లో
  rationale: కర్రలు ఉంగరాల లోపలికి పెట్టబడిన స్థానాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కలున్న
  rationale: צלעות ఇక్కడ బలిపీఠపు పక్క భాగాలను సూచిస్తుంది; ఉంగరాల స్థానం స్పష్టమయ్యేలా సంబంధవాచక నిర్మాణం వాడబడింది.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: బలిపీఠాన్ని వాటితో మోయడానికి
  rationale: ఈ క్రియార్థక రూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ‘వాటితో’ మోతకర్రలను సూచిస్తుంది. అస్పష్ట సర్వనామం బదులు ‘బలిపీఠాన్ని’ పునరుక్తి చేయడం తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: נְבוּב
  choice: లోపల ఖాళీగా
  rationale: బలిపీఠం ఘనంగా కాకుండా బోలు నిర్మాణంగా ఉందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֻחֹת
  choice: పలకలతో
  rationale: לֻחֹת అనగా పలకలు; వాటితో నిర్మించబడిన బోలు ఆకృతిని సూచించేలా సాధనార్థక రూపం వాడబడింది.
- source_word: עָשָׂה אֹתוֹ
  choice: దాన్ని ... చేశాడు
  rationale: హీబ్రూ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజమైన కర్త-కర్మ-క్రియ క్రమంలో అనువదించబడింది.
