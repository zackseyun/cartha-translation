id: EXO.38.21
reference: Exodus 38:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: te
  text: ఇవి నివాసమందిరానికి సంబంధించిన లెక్కలు[a]—అంటే సాక్ష్యపు నివాసమందిరపు లెక్కలు[b]. మోషే ఆజ్ఞ ప్రకారం, యాజకుడైన అహరోను కుమారుడు ఈతామారు పర్యవేక్షణలో[c] లేవీయుల సేవ ద్వారా వీటిని లెక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సామగ్రి పట్టిక’ లేదా ‘ఖాతాలు’; హీబ్రూ పదం అధికారిక లెక్కింపును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సాక్ష్యం’ బహుశా నిబంధనకు సంబంధించిన సాక్ష్యాన్ని, ముఖ్యంగా మందసంలో ఉంచిన రాతి పలకలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, ‘ఈతామారు చేతి ద్వారా’; ఇది కార్యనిర్వహణను లేదా పర్యవేక్షణను సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: లెక్కలు
  rationale: ఈ పరిపాలనా సందర్భంలో అధికారికంగా లెక్కించి నమోదు చేసిన సామగ్రి వివరాలను సూచిస్తుంది; ‘లెక్కలు’ సహజంగా ఉండి లెక్కింపు, ఖాతా అనే రెండు భావ ఛాయలను నిలుపుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: దేవుడు తన ప్రజల మధ్య నివసించడానికి ఏర్పాటు చేసిన పరిశుద్ధ గుడార నిర్మాణాన్ని సూచించే מִשְׁכָּן పదంలోని ‘నివాసం’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: సాక్ష్యపు నివాసమందిరం
  rationale: హీబ్రూ సమాసాన్ని అతిగా వ్యాఖ్యానించకుండా ‘సాక్ష్యం’ అనే పదాన్ని నిలుపుతూ, ముందున్న నివాసమందిరాన్ని మరింత నిర్దిష్టంగా గుర్తిస్తుంది.
- source_word: פֻּקַּד
  choice: లెక్కించారు
  rationale: פְקוּדֵיతో ఉన్న పదప్రయోగ సంబంధాన్ని తెలుగులోనూ నిలుపుతుంది; అధికారిక లెక్కింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל פִּי מֹשֶׁה
  choice: మోషే ఆజ్ఞ ప్రకారం
  rationale: అక్షరార్థంగా ‘మోషే నోటి ప్రకారం’ అయిన హీబ్రూ నుడికారంలో ఆదేశం లేదా అధికారపూర్వక మాట అనే భావం ఉంది.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: లేవీయులు ఈ పని చేశారు
  rationale: నివాసమందిరానికి సంబంధించిన వారికి అప్పగించిన సేవ లేదా పనిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד אִיתָמָר
  choice: ఈతామారు పర్యవేక్షణలో
  rationale: ‘ఈతామారు చేతిలో’ అనే నుడికారం ఇక్కడ కార్యనిర్వహణ లేదా పర్యవేక్షణను సూచిస్తుంది; సందర్భంలో పర్యవేక్షణ భావం సుస్పష్టం.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: అహరోనును అతని ఆరాధనా పదవితో గుర్తించే సాధారణ, స్థిరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: הָעֵדֻת అనే ‘సాక్ష్యం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘సాక్ష్యం’ అనే విస్తృత పదాన్ని నిలుపుట
  alternative: ‘నిబంధన పలకలు’ లేదా ‘నిబంధన పత్రం’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో ఇది మందసంలో ఉంచిన నిబంధన సాక్ష్యాన్ని, ముఖ్యంగా రాతి పలకలను సూచించే అవకాశం ఉన్నా, హీబ్రూ పాఠ్యం ఇక్కడ దానిని అంత నిర్దిష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం; పరిపాలనా లెక్కింపు, లేవీయుల పని, ఈతామారు పర్యవేక్షణ అనే సంబంధాలను స్పష్టంగా ఉంచాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
