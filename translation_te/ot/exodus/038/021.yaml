revisions:
- from: ఇవి నివాసమందిరానికి సంబంధించిన లెక్కలు[a]—అంటే సాక్ష్యపు నివాసమందిరపు లెక్కలు[b]. మోషే ఆజ్ఞ ప్రకారం వీటిని లెక్కించారు. యాజకుడైన అహరోను కుమారుడు ఈతామారు పర్యవేక్షణలో లేవీయులు ఈ పని చేశారు.[c]
  to: ఇవి నివాసమందిరానికి సంబంధించిన లెక్కలు[a]—అంటే సాక్ష్యపు నివాసమందిరపు లెక్కలు[b]. మోషే ఆజ్ఞ ప్రకారం, యాజకుడైన అహరోను కుమారుడు ఈతామారు పర్యవేక్షణలో[c] లేవీయుల సేవ ద్వారా వీటిని లెక్కించారు.
  rationale: చివరి ఉపవాక్యాన్ని సవరించి, మూలంలోని ‘లేవీయుల సేవ’ను స్పష్టంగా నిలిపాము; ఈతామారు పాత్రను పర్యవేక్షణగా ఉంచాము. పాదసూచిక c గుర్తును అది వివరించే పదబంధానికి తరలించాము. మిగిలిన పదప్రయోగాలు, మూలంలోని ‘సాక్ష్యం’ విస్తృతతతో సహా, యథాతథంగా కాపాడబడ్డాయి.
