translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యపు హెచ్చరికాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని రెండవ పురుష ఏకవచన సంబోధనను ‘నీ’ రూపాలతో కాపాడాం; స్థలాల వరుసలో పునరావృతమయ్యే చొరబాటు భావాన్ని సహజ తెలుగు విభక్తులతో వ్యక్తం చేశాం.
