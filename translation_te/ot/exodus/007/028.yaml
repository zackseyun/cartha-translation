  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁרַ֣ץ הַ/יְאֹר֮ צְפַרְדְּעִים֒ וְ/עָלוּ֙ וּ/בָ֣אוּ בְּ/בֵיתֶ֔/ךָ וּ/בַ/חֲדַ֥ר מִשְׁכָּבְ/ךָ֖ וְ/עַל מִטָּתֶ֑/ךָ וּ/בְ/בֵ֤ית עֲבָדֶ֨י/ךָ֙ וּ/בְ/עַמֶּ֔/ךָ וּ/בְ/תַנּוּרֶ֖י/ךָ וּ/בְ/מִשְׁאֲרוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: te
  text: నైలు నది కప్పలతో కిటకిటలాడుతుంది. అవి నదిలోనుండి పైకి వచ్చి నీ ఇంట్లోకి, నీ పడకగదిలోకి, నీ మంచం మీదికి, నీ సేవకుల ఇళ్లలోకి, నీ ప్రజల మధ్యకు, నీ పొయ్యిలలోకి, నీ పిండి కలిపే గిన్నెలలోకి[a] వస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిండి పిసికే తొట్టెలలోకి.”
    reason: מִשְׁאֲרוֹת అనే పదం పిండి సిద్ధం చేసే గిన్నెలను లేదా తొట్టెలను సూచించవచ్చు; పాత్ర యొక్క ఖచ్చిత ఆకారం స్పష్టంగా లేదు.
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: కిటకిటలాడుతుంది
  rationale: ఈ క్రియ చిన్న జీవులు విపరీతంగా విస్తరించి గుంపులుగా నిండిపోవడాన్ని సజీవంగా సూచిస్తుంది. ‘కిటకిటలాడుతుంది’ మూలంలోని సమృద్ధి, కదలిక రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: నిర్గమకాండంలోని ఐగుప్తు సందర్భంలో ఈ పదం ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది; కేవలం ‘నది’ అనడం కంటే ఇది స్పష్టమైనది.
- source_word: צְפַרְדְּעִים
  choice: కప్పలు
  rationale: బహువచన నామవాచకానికి నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: וְעָלוּ
  choice: నదిలోనుండి పైకి వచ్చి
  rationale: కప్పలు నైలు నదినుండి నేలమీదికి, నివాస ప్రాంతాల్లోకి కదలడాన్ని సందర్భం స్పష్టం చేస్తుంది. తెలుగులో సహజత కోసం ‘నదిలోనుండి’ స్పష్టీకరించబడింది.
- source_word: וּבָאוּ
  choice: వస్తాయి
  rationale: తదనంతర స్థలసూచక పదబంధాలతో కలిసి కప్పలు ఆయా ప్రదేశాల్లోకి చేరడాన్ని సూచిస్తుంది. వరుసలోని ‘లోకి/మీదికి/మధ్యకు’ రూపాలు ప్రవేశ భావాన్ని స్పష్టంగా నిలుపుతాయి.
- source_word: בְּבֵיתֶךָ
  choice: నీ ఇంట్లోకి
  rationale: ఇక్కడ ఫరో యొక్క భౌతిక నివాసమే ఉద్దేశం; ‘కుటుంబం’ అనే భావం కాదు.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: నీ పడకగదిలోకి
  rationale: అక్షరార్థంగా ‘నీ నిద్రించే గది’; ‘పడకగది’ ఆధునిక, స్పష్టమైన సమానం.
- source_word: וְעַל מִטָּתֶךָ
  choice: నీ మంచం మీదికి
  rationale: עַל లోని ‘మీద’ భావాన్ని స్పష్టంగా నిలుపుతూ కప్పల చొరబాటును సజీవంగా తెలియజేస్తుంది.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: నీ సేవకుల ఇళ్లలోకి
  rationale: ఏకవచన నిర్మాణపదం బహువచన సంబంధపదంతో పంపిణీ భావంలో వాడబడింది; అందువల్ల ప్రతి సేవకుని నివాసాన్ని సూచించే బహువచనం తెలుగులో సహజం.
- source_word: וּבְעַמֶּךָ
  choice: నీ ప్రజల మధ్యకు
  rationale: בְ ఉపసర్గకు ఇక్కడ ‘ప్రజల మధ్య’ అనే భావం సహజం; కప్పలు ప్రజలలోకి ప్రవేశిస్తాయని అసహజంగా చెప్పకుండా మూలార్థాన్ని కాపాడుతుంది.
- source_word: וּבְתַנּוּרֶיךָ
  choice: నీ పొయ్యిలలోకి
  rationale: తַּנּוּרִים గృహాల్లో రొట్టెలు కాల్చేందుకు వాడే పొయ్యులను సూచిస్తుంది; ‘పొయ్యిలు’ సాధారణ పాఠకులకు సులభమైన పదం.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: నీ పిండి కలిపే గిన్నెలలోకి
  rationale: ఈ పదం రొట్టెపిండిని కలపడానికి లేదా పిసకడానికి వాడే పాత్రలను సూచిస్తుంది. ‘గిన్నెలు’ ఆధునికంగా సులభంగా అర్థమవుతుంది; పాత్ర ఆకారం ఖచ్చితంగా నిర్ధారించలేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
