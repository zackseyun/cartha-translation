  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: te
  text: నేను ఐగుప్తుకు విరోధంగా నా చేయి చాపి, ఇశ్రాయేలు కుమారులను[a] వారి మధ్యనుంచి బయటకు తీసుకొచ్చినప్పుడు, నేనే యాహ్వే[b] అని ఐగుప్తీయులు తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులను” లేదా “ఇశ్రాయేలు సంతానాన్ని.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులను” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలోని దైవనామం YHWH; అనేక అనువాదాల్లో సంప్రదాయంగా దీనిని “ప్రభువు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: తెలుసుకుంటారు
  rationale: రాబోయే కార్యాల ద్వారా ఐగుప్తీయులు దేవుని గుర్తిస్తారనే భావాన్ని సందర్భానుగుణమైన భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: ‘తెలుసుకుంటారు’ అనే బహువచన క్రియను బట్టి ఇక్కడ దేశం కంటే ఆ దేశ ప్రజలే ఉద్దేశించబడ్డారు.
- source_word: כִּי אֲנִי יְהוָה
  choice: నేనే యాహ్వే అని
  rationale: כִּי తెలిసికొనే విషయాన్ని పరిచయం చేస్తుంది; אֲנִי వాక్యంలోని స్వీయ గుర్తింపును తెలుగులో సహజంగా ‘నేనే’ అని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: בִּנְטֹתִי אֶת יָדִי
  choice: నా చేయి చాపి ... చేసినప్పుడు
  rationale: בְּ + క్రియానామ నిర్మాణానికి కాలార్థం ఉంది. ‘చేయి’ అనే స్పష్టమైన మానవరూపక చిత్రాన్ని నిలుపుకుంది.
- source_word: עַל מִצְרָיִם
  choice: ఐగుప్తుకు విరోధంగా
  rationale: తీర్పు సందర్భంలో עַל సూచించే ప్రతికూల దిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהוֹצֵאתִי
  choice: బయటకు తీసుకొచ్చినప్పుడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, ముందున్న చర్యతో కలిపి కాలవాచక ఉపవాక్యంగా సహజంగా అమర్చింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ పదబంధాన్ని నేరుగా నిలుపుతుంది; పాదసూచికలో సహజ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: מִתּוֹכָם
  choice: వారి మధ్యనుంచి
  rationale: ఐగుప్తీయుల మధ్యనుంచి వేరుచేసి వెలుపలికి తీసుకురావడం అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న నాలుగు హీబ్రూ అక్షరాల దైవనామాన్ని బిరుదుగా మార్చకుండా నామరూపంలో ఉంచింది. సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని పుంలింగ బహువచన కుటుంబసంబంధ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, సాధారణ ప్రజాసమూహార్థాన్ని పాదసూచికలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘చేయి చాపడం’ అనే రూపకాన్ని అలాగే ఉంచి, తీర్పు భావాన్ని ‘విరోధంగా’ ద్వారా స్పష్టం చేసింది. రెండు పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
