id: EXO.7.1
reference: Exodus 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా చెప్పాడు: “చూడు, ఫరోకు నిన్ను దేవునిగా[a] చేశాను; నీ సోదరుడు అహరోను నీ ప్రవక్తగా ఉంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఫరోకు నిన్ను దేవునిగా చేశాను” అని ఉంది. ఇది మోషే దేవుడనే అర్థం కాదు; ఫరో ఎదుట దేవుని అధికారాన్ని ప్రతినిధిగా వినియోగించే పాత్రను సూచిస్తుంది. “దేవునివలె” అని కూడా భావించవచ్చు.
    reason: మూలంలోని ప్రత్యక్ష ‘దేవునిగా’ అనే పదబంధాన్ని నిలిపి, సందర్భంలో సూచితమైన ప్రతినిధి-అధికార భావాన్ని వివరిస్తూ, సాధ్యమైన వివరణాత్మక అనువాదాన్ని సూచించడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని వరుస భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רְאֵה
  choice: చూడు
  rationale: తరువాత చెప్పబోయే విషయంపై మోషే దృష్టిని నిలిపే ఏకవచన ఆజ్ఞార్థక రూపం.
- source_word: נְתַתִּיךָ
  choice: నిన్ను ... ఉంచాను
  rationale: మూల క్రియకు అక్షరార్థంగా ‘ఇచ్చాను’ అనే భావం ఉన్నా, విధి లేదా స్థానంలో నియమించడాన్ని తెలిపే ఈ నిర్మాణంలో ‘ఉంచాను’ సహజంగా ఉండి ఫలితార్థాన్ని కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవునిగా
  rationale: మూలంలోని ప్రత్యక్ష విధేయ పదాన్ని ఉపమానంగా మార్చకుండా నిలిపాం. ఫరోతో సంబంధంలో మోషేకు ఇవ్వబడిన దేవుని ప్రతినిధి అధికారాన్ని సందర్భం సూచిస్తుంది; సంభవించే ‘దేవునివలె’ అనే భావవ్యాఖ్యను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לְפַרְעֹה
  choice: ఫరోకు
  rationale: లామెద్ విభక్తి ఇక్కడ ఫరోతో ఉన్న సంబంధాన్ని సూచిస్తుంది; ‘ఫరోకు’ మూల నిర్మాణానికి దగ్గరగా, తెలుగులో సంక్షిప్తంగా ఉంది.
- source_word: אָחִיךָ
  choice: నీ సోదరుడు
  rationale: బంధుత్వాన్ని తెలిపే మూలపదాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అనువదించాం.
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: నీ ప్రవక్తగా ఉంటాడు
  rationale: נָבִיא అనే ప్రామాణిక ‘ప్రవక్త’ పదాన్ని ‘ప్రతినిధి’ లేదా ‘మాట్లాడేవాడు’గా కుదించకుండా నిలిపి, అసంపూర్ణ క్రియ యొక్క భవిష్య భావాన్ని ‘ఉంటాడు’తో తెలిపాం.
theological_decisions:
- issue: ఫరోకు సంబంధించి మోషేను אֱלֹהִים అని పేర్కొనడం
  choice: దేవునిగా
  alternative: దేవునివలె
  rationale: హీబ్రూ పాఠంలో ఉపమాన సూచక పదం లేకుండా ‘దేవునిగా’ అని ఉంది. అందువల్ల ప్రధాన పాఠంలో దాని బలమైన, ఉద్దేశపూర్వక రూపాన్ని నిలిపాం. అదే సమయంలో అహరోను మోషేకు ‘ప్రవక్త’గా ఉండటం మోషే యొక్క ప్రతినిధి అధికారాన్ని సూచిస్తుంది; ఆ భావవ్యాఖ్యను పాదటిప్పణిలో స్పష్టం చేశాం, కానీ ప్రధాన పాఠంలోని ఉద్వేగాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘యాహ్వే,’ ‘ప్రవక్త’ వంటి కీలక బైబిలు పదాలను నిలిపి, ప్రధాన వాక్యాన్ని సాధారణ పాఠకుడికి సహజంగా ఉండేలా నిర్మించాం.
