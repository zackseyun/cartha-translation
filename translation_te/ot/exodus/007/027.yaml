source:
  edition: WLC
  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת כָּל גְּבוּלְ/ךָ֖ בַּֽ/צְפַרְדְּעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: te
  text: కానీ వారిని వెళ్లనివ్వడానికి నీవు నిరాకరిస్తే, ఇదిగో, నేను కప్పల ద్వారా నీ దేశమంతటినీ దెబ్బతీయబోతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కానీ వారిని వెళ్లనివ్వడానికి నీవు నిరాకరిస్తే, ఇదిగో, నేను కప్పల ద్వారా నీ దేశమంతటినీ దెబ్బతీస్తాను.” హీబ్రూ కృదంతాన్ని సమీప భవిష్యత్తుగా (“దెబ్బతీయబోతున్నాను”) లేదా సాధారణ భవిష్యత్తుగా (“దెబ్బతీస్తాను”) అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కానీ ... అయితే
  rationale: ముందు చేసిన ఆజ్ఞకు విరుద్ధంగా నిలిచే షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָאֵן
  choice: నిరాకరిస్తే
  rationale: అసమర్థతను కాకుండా ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడాన్ని సూచిస్తుంది.
- source_word: לְשַׁלֵּחַ
  choice: వారిని వెళ్లనివ్వడానికి
  rationale: నిర్గమకాండ సందర్భంలో ఇశ్రాయేలీయులను బంధం నుంచి విడుదల చేయడాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: రాబోయే తీర్పుపై శ్రద్ధ నిలిపే హెచ్చరికాత్మక, గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామంలోని కర్తృప్రాధాన్యాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: נֹגֵף
  choice: దెబ్బతీయబోతున్నాను
  rationale: హిన్నేకు అనుసరించిన కృదంతం సూచించే సమీప భవిష్యత్ చర్యను, దెబ్బ లేదా తీర్పు అనే మూల చిత్రాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: כָּל גְּבוּלְךָ
  choice: నీ దేశమంతటినీ
  rationale: ఇక్కడ సరిహద్దు రేఖను మాత్రమే కాక ఫరో అధీనంలోని భూభాగమంతటినీ సూచిస్తుంది; సాధారణ పాఠకునికి 'దేశమంతటినీ' సహజంగా ఉంటుంది.
- source_word: בַּצְפַרְדְּעִים
  choice: కప్పలతో
  rationale: బేత్ విభక్తి తెలిపే సాధనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
