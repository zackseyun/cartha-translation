source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “అహరోనుతో ఇలా చెప్పు: ‘నీ కర్రను తీసుకుని, ఐగుప్తు జలాల మీద—వారి నదుల మీద, వారి నైలు కాలువల మీద, వారి చెరువుల మీద, వారి నీళ్లు కూడిన ప్రతి ప్రదేశంపైనా—నీ చెయ్యి చాపు; ఆ నీళ్లన్నీ రక్తంగా మారాలి. ఐగుప్తు దేశమంతటా రక్తం ఉంటుంది; చెక్క పాత్రల్లోనూ రాతి పాత్రల్లోనూ కూడా ఉంటుంది[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చెక్కలోను రాతిలోను.” సందర్భాన్ని బట్టి, చెక్కతోనూ రాతితోనూ చేసిన పాత్రల్లో నిల్వ ఉంచిన నీరు ఉద్దేశమై ఉండవచ్చు.
    reason: హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి పాత్రలను ప్రత్యక్షంగా పేర్కొనదు; ప్రధాన అనువాదంలో స్పష్టీకరించిన భావానికి అక్షరార్థ ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מַטְּךָ
  choice: నీ కర్రను
  rationale: מַטֶּה చేతిలో పట్టుకునే కర్ర లేదా దండాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి సహజమైన ‘కర్ర’ను ఎంచుకున్నాం.
- source_word: וּנְטֵה יָדְךָ
  choice: నీ చెయ్యి చాపు
  rationale: హీబ్రూ ఆజ్ఞను సహజమైన తెలుగులోనూ, దాని ప్రతీకాత్మక చర్యను నిలుపుతూ అనువదించాం.
- source_word: נַהֲרֹתָם
  choice: వారి నదుల మీద
  rationale: సాధారణ నదులు లేదా ప్రవాహాలను సూచించే పదాన్ని, తరువాతి నైలు సంబంధిత జలమార్గాల నుంచి వేరుగా ఉంచాం.
- source_word: יְאֹרֵיהֶם
  choice: వారి నైలు కాలువల మీద
  rationale: ఐగుప్తు సందర్భంలో יְאֹר నైలు నదికి సంబంధించిన జలమార్గాలను సూచిస్తుంది; ‘నైలు కాలువలు’ ఆ స్థానిక ప్రత్యేకతను స్పష్టం చేస్తుంది.
- source_word: אַגְמֵיהֶם
  choice: వారి చెరువుల మీద
  rationale: నిలిచిన లేదా చేరిన నీటి ప్రదేశాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: వారి నీరు చేరిన ప్రతి చోటు మీద
  rationale: מִקְוֶה యొక్క ‘సమకూడిన/చేరిన నీరు’ అనే విస్తృత భావాన్ని ‘జలాశయం’ వంటి అతినిర్దిష్ట పదంతో కుదించకుండా వ్యక్తం చేస్తుంది.
- source_word: וְיִהְיוּ דָם
  choice: ఆ నీళ్లన్నీ రక్తంగా మారాలి
  rationale: ఆజ్ఞకు ఉద్దేశించిన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, బహువచన జలాల సూచనను స్పష్టం చేశాం.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: చెక్క పాత్రల్లోనూ రాతి పాత్రల్లోనూ కూడా
  rationale: సందర్భం నీటి నిల్వల గురించి కావడంతో, ‘చెక్కలోను రాతిలోను’ అనే సంక్షిప్త హీబ్రూ ప్రయోగాన్ని ఆ పదార్థాలతో చేసిన పాత్రలకు సూచనగా ప్రధాన పాఠ్యంలో స్పష్టం చేశాం; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఒక ప్రత్యేక మతసంప్రదాయపు ప్రత్యామ్నాయ ఉచ్చారణను బలవంతంగా రుద్దదు.
- issue: וּבָעֵצִים וּבָאֲבָנִים యొక్క సంక్షిప్త భావం
  choice: చెక్క, రాతి పాత్రల్లో ఉన్న నీటికి సూచన
  alternative: అక్షరార్థంగా ‘చెక్కలోను రాతిలోను’
  rationale: మొత్తం వాక్యం ఐగుప్తులోని నీటి గురించి మాట్లాడుతోంది. అందువల్ల పదార్థాల పేర్లు వాటితో చేసిన పాత్రలను సూచించే లక్షణార్థక ప్రయోగమని ప్రధాన పాఠ్యంలో తెలిపాం; హీబ్రూ సంక్షిప్తత వల్ల ఉన్న అనిశ్చితిని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనా సాధారణ పాఠకునికి సులభంగా ఉండే శైలి వాడాం. ప్రత్యక్ష సంభాషణలో దేవుడు మోషేతో ఏకవచనంగా మాట్లాడుతున్నందున ‘నువ్వు/నీ’ రూపాలు సహజంగా ఉంచాం. జలవనరుల జాబితా, పునరుక్తి, తీర్పు యొక్క విస్తృతి నిలిచేలా వాక్య నిర్మాణాన్ని కాపాడాం.
