source:
  edition: WLC
  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: te
  text: ఫరో మీతో, “మీ కోసం ఒక సూచన చూపించండి” అని చెప్పినప్పుడు, నీవు అహరోనుతో, “నీ కర్రను తీసుకొని ఫరో ఎదుట పడవేయి; అది సర్పంగా[a] మారుగాక” అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహాసర్పం” లేదా “భారీ సరీసృపం.” హెబ్రూ తన్నీన్ పదం సందర్భాన్ని బట్టి సర్పాన్ని, సముద్రజీవిని, లేదా మహాసర్పంలాంటి జీవిని సూచించవచ్చు.
    reason: తַנִּין పదానికి ఉన్న విస్తృత అర్థపరిధిని తెలియజేస్తూ, ఈ సందర్భంలో ప్రధాన పాఠంలోని ‘సర్పం’ అనే సందర్భోచిత అర్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: כִּי
  choice: చెప్పినప్పుడు
  rationale: ఇక్కడ ఈ పదం కారణాన్ని కాక, భవిష్యత్తులో ఎదురయ్యే సందర్భాన్ని పరిచయం చేస్తోంది.
- source_word: יְדַבֵּר אֲלֵכֶם
  choice: ఫరో మీతో ... చెప్పినప్పుడు
  rationale: హెబ్రూ బహువచన సంబోధనను ‘మీతో’ అని నిలిపి, కాలసూచక వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: מוֹפֵת
  choice: సూచకకార్యం
  rationale: ఇది కేవలం గుర్తు మాత్రమే కాక, అసాధారణమైన రుజువుగా చూపే కార్యాన్ని సూచిస్తుంది; ‘సూచకకార్యం’ ఆ రెండు భావాలనూ అందిస్తుంది.
- source_word: תְּנוּ לָכֶם
  choice: మీ కోసం ... చూపించండి
  rationale: అక్షరార్థమైన ‘మీ కోసం ఇవ్వండి’ తెలుగులో అసహజం; ఫరో కోరుతున్న ప్రదర్శనాత్మక రుజువును ‘చూపించండి’ సహజంగా తెలియజేస్తూ לָכֶם భావాన్ని ‘మీ కోసం’గా నిలుపుతుంది.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: నీవు అహరోనుతో ... అని చెప్పాలి
  rationale: ఏకవచన ఆజ్ఞ మోషేకు ఉద్దేశించబడిందని తెలుపుతూ, తదుపరి చర్యను సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: מַטְּךָ
  choice: నీ కర్ర
  rationale: మోసుకెళ్లే staff/rod అనే సాధారణ అర్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే పదం.
- source_word: וְהַשְׁלֵךְ
  choice: పడవేయి
  rationale: కర్రను ఫరో ఎదుట విసిరి కింద వేయాలనే చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట
  rationale: ఫరో సమక్షంలో జరిగే కార్యాన్ని గంభీరమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהִי
  choice: మారాలి
  rationale: హెబ్రూ జస్సివ్‌లోని ఉద్దేశిత ఫలిత భావాన్ని సాధారణ భవిష్యద్వాక్యంగా మార్చకుండా నిలుపుతుంది.
- source_word: תַנִּין
  choice: పెద్ద సర్పం
  rationale: ఈ పదానికి సాధారణ ‘పాము’కన్నా విస్తృతమైన అర్థపరిధి ఉంది. సందర్భంలో సర్పాకార జీవి సరిపోతుంది; ‘పెద్ద’ అనే విశేషణం נָחָשׁతో ఉన్న పదభేదాన్ని కొంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: కర్రగా మారిన జీవికి תַנִּין అనే పదం వాడుక
  choice: పెద్ద సర్పం
  alternative: భారీ సరీసృపం; సముద్రజీవి; మహాసర్పం వంటి జీవి
  rationale: నిర్గమకాండము 7లోని సందర్భం సర్పాకార జీవిని సూచించినా, హెబ్రూ పదాన్ని సాధారణ ‘పాము’ అనే అర్థానికే పరిమితం చేయకూడదు. అందువల్ల ప్రధాన పాఠంలో సందర్భోచిత అర్థాన్ని ఇచ్చి, విస్తృత పదార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. ఫరో మోషే, అహరోనులిద్దరితో మాట్లాడుతున్నందున ‘మీతో/మీ కోసం’ అనే బహువచనం, మోషేకు ఇచ్చిన ఆజ్ఞలో ‘నీవు’ అనే ఏకవచనం జాగ్రత్తగా నిలుపబడ్డాయి. ప్రత్యక్ష ప్రసంగానికి తెలుగు వంకర ఉద్ధరణ చిహ్నాలు వాడబడ్డాయి.
