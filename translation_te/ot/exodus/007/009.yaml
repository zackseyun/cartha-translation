review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the temporal/conditional force of כִּי, Pharaoh's plural address (‘మీతో’), the singular command directed to Moses, Aaron's staff, and the setting before Pharaoh. However, ‘పెద్ద సర్పం’ adds ‘large’ to the main text more explicitly than the immediate context requires, and ‘మారాలి’ conveys obligation (‘must become’) more readily than the Hebrew jussive's intended-result sense.
  naturalness: ‘సూచకకార్యం’ is intelligible but somewhat bureaucratic and less natural than ‘సూచన’ in this direct demand. The revised wording is modern standard Telugu while retaining a suitably formal biblical register.
  terminology: ‘సూచన’ represents מוֹפֵת clearly in context without overstating a technical meaning. ‘సర్పం’ is contextually appropriate for תַנִּין, while the footnote preserves its wider lexical range. ‘కర్ర’ is a natural rendering of מַטֶּה.
  issues:
  - severity: medium
    issue: ‘పెద్ద సర్పం’ in the main text over-specifies תַנִּין.
    rationale: Although tannin can denote a large reptilian or dragon-like creature, this verse itself does not explicitly state size. ‘సర్పం’ fits the narrative context, and the broader range belongs in the footnote.
  - severity: medium
    issue: ‘అది ... మారాలి’ can sound obligatorily prescriptive rather than jussive.
    rationale: The Hebrew יְהִי expresses the intended outcome of Aaron's action. ‘మారుగాక’ better preserves this nuance.
  - severity: low
    issue: ‘సూచకకార్యం’ is stylistically cumbersome in Pharaoh's direct speech.
    rationale: ‘ఒక సూచన చూపించండి’ is more idiomatic modern Telugu and adequately communicates a requested demonstrative sign.
  revised_text: ఫరో మీతో, “మీ కోసం ఒక సూచన చూపించండి” అని చెప్పినప్పుడు, నీవు అహరోనుతో, “నీ కర్రను తీసుకొని ఫరో ఎదుట పడవేయి; అది సర్పంగా[a] మారుగాక” అని చెప్పాలి.
