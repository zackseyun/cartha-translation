revisions:
- from: ఫరో మీతో, “మీ కోసం ఒక సూచకకార్యాన్ని చూపించండి” అని చెప్పినప్పుడు, నీవు అహరోనుతో, “నీ కర్రను తీసుకొని ఫరో ఎదుట పడవేయి; అది పెద్ద సర్పంగా[a] మారాలి” అని చెప్పాలి.
  to: ఫరో మీతో, “మీ కోసం ఒక సూచన చూపించండి” అని చెప్పినప్పుడు, నీవు అహరోనుతో, “నీ కర్రను తీసుకొని ఫరో ఎదుట పడవేయి; అది సర్పంగా[a] మారుగాక” అని చెప్పాలి.
