source:
  edition: WLC
  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: te
  text: అయితే ఫరో హృదయం కఠినమైంది[a]; యెహోవా చెప్పినట్లే అతడు వారి మాట వినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఫరో హృదయం మొండిగా మారింది.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘బలపడింది’ లేదా ‘దృఢమైంది’ అనే భావం ఉంది; ఇక్కడ అది లొంగని కఠినత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: కఠినమైంది
  rationale: חזק అనే క్రియ ఇక్కడ ఫరో అంతరంగ సంకల్పం దృఢంగా, లొంగనిదిగా మారిన భావాన్ని ఇస్తుంది. ‘కఠినమైంది’ సహజమైన తెలుగు ప్రయోగం; ఈ వాక్యంలో పేర్కొనని కర్తను చేర్చకుండా ఫలితస్థితిని తెలియజేస్తుంది.
- source_word: לֵב
  choice: హృదయం
  rationale: לֵב అనేది భావోద్వేగాలను మాత్రమే కాక ఆలోచన, సంకల్పం, నిర్ణయశక్తి గల అంతరంగ వ్యక్తిని సూచిస్తుంది; ‘హృదయం’ తెలుగు బైబిలు భాషలో సహజమైన సమానార్థకం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: అతడు వారి మాట వినలేదు
  rationale: שׁמע אֶל అంటే కేవలం శబ్దం వినడం కాక ఎవరి మాటకైనా చెవియొగ్గడం లేదా లోబడడం. ‘వారి మాట వినలేదు’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లే
  rationale: ముందుగా పలికిన యెహోవా మాటకు జరిగినది సరిగ్గా అనుగుణంగా ఉందని తెలియజేస్తుంది.
- source_word: דִּבֶּר
  choice: చెప్పిన
  rationale: తెలుగు సంబంధక క్రియారూపం సందర్భంలో ముందుగా పలికిన మాటను సహజంగా సూచిస్తుంది; ప్రత్యేకంగా భూతపూర్వకాల రూపాన్ని బలవంతంగా చేర్చాల్సిన అవసరం లేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంతో అందిస్తుంది.
theological_decisions:
- issue: ఫరో హృదయం కఠినమవడంలో కర్తృత్వం
  choice: ‘ఫరో హృదయం కఠినమైంది’ అని, ప్రత్యక్ష కర్తను పేర్కొనకుండా అనువదించడం
  alternative: ‘దేవుడు ఫరో హృదయాన్ని కఠినపరిచాడు’ లేదా ‘ఫరో తన హృదయాన్ని కఠినపరచుకున్నాడు’
  rationale: హీబ్రూ రూపం ఇక్కడ హృదయం బలపడిన లేదా కఠినమైన స్థితిని తెలియజేస్తుంది; దానికి కారణమైన కర్తను స్పష్టంగా పేర్కొనదు. కాబట్టి నిర్గమకాండంలోని దైవ కర్తృత్వం–మానవ బాధ్యత మధ్య ఉన్న ఉద్రిక్తతను ఈ వచనంలో ముందుగానే పరిష్కరించకుండా ఉంచబడింది.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘వారి మాట వినలేదు’ అనే సహజ ప్రయోగం విధేయత చూపకపోవడాన్ని తెలియజేస్తుంది. మూలంలోని పేరా ముగింపు గుర్తు అనువాద వచనంలో విడిగా సూచించబడలేదు.
