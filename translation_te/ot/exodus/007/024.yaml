  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: te
  text: ఈజిప్టీయులందరూ తాగడానికి నీళ్ల కోసం నైలు నది[a] చుట్టుపక్కల తవ్వారు; ఎందుకంటే వారు నైలు నది నీళ్లను తాగలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నది’ (యెఓర్); నిర్గమకాండంలో ఈ పదం ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: తవ్వారు
  rationale: חפר అనే క్రియ సాధారణంగా ‘తవ్వడం’ అని అర్థం. మూలంలో బావులు అని స్పష్టంగా లేకపోవడంతో ‘బావులు తవ్వారు’ అనే వివరణాత్మక భావాన్ని చేర్చలేదు.
- source_word: כָל מִצְרַיִם
  choice: ఈజిప్టీయులందరూ
  rationale: అక్షరార్థంగా ‘ఈజిప్టు అంతా’ అని ఉండగల ఈ సమష్టి ప్రయోగం, సందర్భంలో నీటి కోసం తవ్విన ఈజిప్టు ప్రజలను సూచిస్తుంది.
- source_word: סְבִיבֹת הַיְאֹר
  choice: నైలు నది చుట్టుపక్కల
  rationale: סְבִיבֹת పరిసర ప్రాంతాలను సూచిస్తుంది; ‘చుట్టుపక్కల’ సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: יְאֹר సాధారణంగా ‘నది’ అనే పదమైనా, నిర్గమకాండంలోని ఈ సందర్భంలో ప్రత్యేకంగా నైలు నదినే సూచిస్తుంది.
- source_word: מַיִם לִשְׁתּוֹת
  choice: తాగడానికి నీళ్ల కోసం
  rationale: లక్ష్యార్థక క్రియారూపాన్ని నిలుపుతూ, నీటిని వెదుకుతూ తవ్వారనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי לֹא יָכְלוּ
  choice: ఎందుకంటే వారు ... తాగలేకపోయారు
  rationale: כִּי ఇక్కడ తవ్వడానికి కారణాన్ని తెలియజేస్తుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: నైలు నది నీళ్లను తాగలేకపోయారు
  rationale: מִן మూలం లేదా వనరును సూచించినా, తెలుగులో ద్రవాన్ని తాగే సందర్భంలో ‘నీళ్లను తాగడం’ సహజంగా ఉంటుంది; నైలు నీరే తాగలేకపోయారనే భావం యథాతథంగా ఉంటుంది.
