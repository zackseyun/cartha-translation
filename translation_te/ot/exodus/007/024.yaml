  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘నీళ్లు’ అనే సహజ రూపాన్ని ఎంచుకున్నాం; మూలంలో లేని ‘బావులు’ అనే భావాన్ని చేర్చలేదు.
