id: EXO.7.14
reference: Exodus 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఫరో హృదయం బరువుగా ఉంది[a]; అతడు ప్రజలను వెళ్లనివ్వడానికి నిరాకరిస్తున్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బరువుగా’ అనేది ఫరో మొండితనాన్ని లేదా స్పందించని వైఖరిని సూచించే రూపకం. “ఫరో హృదయం కఠినమైంది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: హెబ్రీయులో అక్షరార్థంగా ‘మోషేకు’; మాటల క్రియతో తెలుగులో ‘మోషేతో ... అన్నాడు’ సహజమైన ప్రయోగం.
- source_word: כָּבֵד לֵב פַּרְעֹה
  choice: ఫరో హృదయం మొద్దుబారింది
  rationale: כָּבֵד ప్రాథమికంగా ‘బరువైనది’ అని అర్థమైనా, హృదయానికి సంబంధించి ఇక్కడ స్పందించని, మొండిగా ఉన్న స్థితిని సూచిస్తుంది. ‘మొద్దుబారింది’ రూపకం యొక్క మందత్వం/స్పందనలేమిని సహజ తెలుగులో నిలుపుతుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: מֵאֵן
  choice: నిరాకరిస్తున్నాడు
  rationale: ఈ రూపం కొనసాగుతున్న నిరాకరణ వైఖరిని తెలియజేస్తుంది; వర్తమాన ప్రగతిశీల రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשַׁלַּח
  choice: వెళ్లనివ్వడానికి
  rationale: నిర్గమకాండ సందర్భంలో ప్రజలు బయలుదేరేందుకు అనుమతించడాన్ని సూచిస్తుంది; ‘పంపివేయడానికి’ కంటే ఇది సందర్భానుకూలమైన సహజ తెలుగు.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: మూలంలో కేవలం ‘ప్రజలు’ అని ఉంది; సందర్భం ఇశ్రాయేలీయులను సూచించినా, ప్రధాన వచనంలో ఆ వివరణను చేర్చలేదు.
theological_decisions:
- issue: ఫరో హృదయ స్థితిని తెలిపే కఠినపరచుట-సంబంధిత పదజాలం
  choice: ఫరో హృదయం మొద్దుబారింది
  alternative: ఫరో హృదయం బరువుగా ఉంది / ఫరో హృదయం కఠినమైంది
  rationale: ఈ వచనంలో హెబ్రీయు כָּבֵד (‘బరువుగా ఉండడం’) వాడబడింది. ‘కఠినమైంది’ అని మాత్రమే అనువదిస్తే నిర్గమకాండలో హృదయ స్థితికి వాడిన భిన్న హెబ్రీయు పదాల ప్రత్యేకత చెరిగిపోతుంది. ‘మొద్దుబారింది’ స్పందనలేమి, మొండితనం అనే సందర్భార్థాన్ని తెలియజేస్తూ, అక్షరార్థ రూపకాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యెహోవా’ అనే దైవనామాన్ని నిలిపి, మూలంలోని సంక్షిప్తతను కాపాడింది. ‘హృదయం మొద్దుబారింది’ సాధారణ పాఠకునికి అర్థమయ్యేలా సందర్భార్థాన్ని ఇస్తుంది; ‘బరువు’ అనే మూల రూపకం పాదటిప్పణిలో స్పష్టంగా ఉంచబడింది.
