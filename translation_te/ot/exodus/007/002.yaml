reference: Exodus 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: te
  text: నేను నీకు ఆజ్ఞాపించేదంతా నీవు చెప్పాలి; నీ సహోదరుడైన అహరోను ఫరోతో మాట్లాడాలి; అతడు ఇశ్రాయేలు కుమారులను[a] తన దేశం నుండి పంపివేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులను.” హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక పదబంధం.
    reason: בְּנֵי יִשְׂרָאֵל యొక్క అక్షరార్థ వంశసంబంధ రూపాన్ని మరియు దాని సామూహిక అర్థాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: תְדַבֵּר
  choice: చెప్పాలి
  rationale: పియేల్ రూపం ఇక్కడ మాట్లాడడం లేదా తెలియజేయడం అనే సాధారణ అర్థాన్ని ఇస్తుంది; సందర్భంలోని ఆదేశ స్వరాన్ని సహజమైన ఆధునిక తెలుగులో ‘చెప్పాలి’ నిలుపుతుంది.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: నేను నీకు ఆజ్ఞాపించేదంతా
  rationale: సమగ్రతను సూచించే ‘అంతా’ను నిలుపుతూ, కొనసాగుతున్న దైవ ఆదేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַהֲרֹן אָחִיךָ
  choice: నీ సహోదరుడైన అహరోను
  rationale: హీబ్రూ సంబంధాన్ని స్పష్టంగా నిలుపుతూ, గౌరవప్రదమైన ఆధునిక తెలుగు వాక్యనిర్మాణాన్ని అనుసరిస్తుంది.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: ఫరోతో మాట్లాడాలి
  rationale: דבר אל అనే నిర్మాణం ఉద్దేశించిన వ్యక్తితో మాట్లాడడాన్ని సూచిస్తుంది; ‘చెప్పాలి’ అని అనువదిస్తే సందేశపు విషయాన్ని అవసరానికి మించి నిర్దిష్టం చేస్తుంది.
- source_word: וְשִׁלַּח
  choice: అప్పుడు అతడు … పంపివేస్తాడు
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ అహరోను మాటల తరువాత ఆశించిన ఫలితం లేదా క్రమాన్ని సూచించగలదు. ‘అప్పుడు’ ఆ సంబంధాన్ని సహజంగా చూపుతుంది; అయితే ఉద్దేశార్థ పఠనం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ అనే వంశసంబంధ పదబంధాన్ని నిలుపుతుంది; ఇది సమస్త ఇశ్రాయేలీయులను సూచించే సామూహిక నామమని పాదటిప్పణి వివరిస్తుంది.
- source_word: מֵאַרְצוֹ
  choice: తన దేశం నుండి
  rationale: מִן సూచించే బయలుదేరే మూలస్థానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘తన’ అనే పదం ఫరోను సూచిస్తుంది.
theological_decisions:
- issue: וְשִׁלַּח లో ఫలితం, క్రమం, లేదా ఉద్దేశం
  choice: అప్పుడు అతడు … పంపివేస్తాడు
  alternative: అతడు … పంపివేసేలా
  rationale: హీబ్రూ సంధి నిర్మాణం సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు. ప్రధాన పాఠ్యంలో సహజమైన క్రమం/ఫలిత భావాన్ని ఇచ్చి, ఉద్దేశార్థ అవకాశాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఆదేశ స్వరాన్ని ‘చెప్పాలి/మాట్లాడాలి’తో నిలిపి, మూలంలోని వంశసంబంధ రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడాం.
