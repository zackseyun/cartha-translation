revisions:
- from: నేను నీకు ఆజ్ఞాపించేదంతా నీవు చెప్పాలి; నీ సహోదరుడైన అహరోను ఫరోతో మాట్లాడాలి, అప్పుడు అతడు ఇశ్రాయేలు కుమారులను తన దేశం నుండి పంపివేస్తాడు.[a]
  to: నేను నీకు ఆజ్ఞాపించేదంతా నీవు చెప్పాలి; నీ సహోదరుడైన అహరోను ఫరోతో మాట్లాడాలి; అతడు ఇశ్రాయేలు కుమారులను[a] తన దేశం నుండి పంపివేయాలి.
