  text: 'అప్పుడు యెహోవా మోషేతో, అహరోనుతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, తరువాత ప్రత్యక్ష వాక్యం రానున్నదని సూచిస్తుంది.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరినీ ఉద్దేశించి మాట్లాడిన భావాన్ని సహజమైన తెలుగు ప్రయోగంతో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా నిలిపాం; ఈ ఎంపిక ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి ప్రత్యక్ష వాక్యానికి దారితీయడానికి చివరలో ద్విబిందువు వాడబడింది.
