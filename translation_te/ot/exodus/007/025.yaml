  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: te
  text: యాహ్వే నైలు నదిని కొట్టిన తరువాత ఏడు రోజులు పూర్తయ్యాయి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడు రోజులు గడిచాయి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “నైలు”; దీనిని మరింత సాధారణంగా “నది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: గడిచాయి
  rationale: కాలవ్యవధి పూర్తయిందనే నిఫాల్ రూప భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; మరింత రూపసామ్యమైన ‘పూర్తయ్యాయి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: ఏడు రోజుల కాలవ్యవధిని సూచించే సూటి సంఖ్యా-నామవాచక నిర్మాణం.
- source_word: אַחֲרֵי
  choice: తరువాత
  rationale: తరువాతి కాలాన్ని సూచించే సాధారణ కాలసంబంధ అవ్యయం.
- source_word: הַכּוֹת
  choice: కొట్టిన
  rationale: נכה క్రియ యొక్క ‘కొట్టు/దెబ్బతీయు’ భావాన్ని, తెగులు-తీర్పు సందర్భానికి తగినట్లుగా, సహజమైన తెలుగు భూతకాల అసమాపక రూపంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: నిర్గమకాండ సందర్భంలో יְאֹר సాధారణ నదిని కాక ప్రత్యేకంగా నైలు నదినే సూచిస్తుంది; తెలుగులో స్పష్టతకోసం ‘నది’ చేర్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ఉచ్చారణపై పండితుల పునర్నిర్మాణాన్ని గౌరవిస్తూ ‘యాహ్వే’ను పాదసూచికలో ఇచ్చి, తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. హీబ్రూ వాక్యంలోని కాలవ్యవధి పూర్తయిన భావాన్ని ‘గడిచాయి’తో అందించి, రూపసామ్య ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
