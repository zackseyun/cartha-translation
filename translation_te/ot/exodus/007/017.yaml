id: EXO.7.17
reference: Exodus 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: te
  text: 'యాహ్వే ఇలా చెబుతున్నాడు: “దీనివల్ల నేనే యాహ్వేనని నీవు తెలుసుకుంటావు: ఇదిగో, నా చేతిలో ఉన్న కర్రతో నైలు నదిలోని నీళ్లను కొట్టబోతున్నాను; అవి రక్తంగా మారతాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: హీబ్రూ ప్రవక్తీయ సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: בְּזֹאת תֵּדַע
  choice: దీనివల్ల నీవు తెలుసుకుంటావు
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ సాధనార్థకంగా ఉంది; రాబోయే సూచన ద్వారానే ఫరో తెలుసుకుంటాడనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כִּי אֲנִי יְהוָה
  choice: నేనే యెహోవానని
  rationale: אָנִי పై ఉన్న గుర్తింపు బలాన్ని తెలుగులో ‘నేనే’ ద్వారా సహజంగా తెలియజేసి, ఒడంబడిక దైవనామాన్ని నిలుపుతుంది.
- source_word: הִנֵּה אָנֹכִי מַכֶּה
  choice: ఇదిగో, ... కొడుతున్నాను
  rationale: הִנֵּה యొక్క నాటకీయ తక్షణతను ‘ఇదిగో’ నిలుపుతుంది; participle సమీపిస్తున్న చర్యను సజీవ వర్తమాన రూపంలో చూపుతుంది.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: నా చేతిలో ఉన్న కర్రతో
  rationale: מַטֶּה కు సందర్భానుకూలమైన సాధారణ తెలుగు ‘కర్ర’; సంబంధవాచక నిర్మాణం మరియు సాధనార్థం రెండూ నిలుస్తాయి.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: నైలు నదిలోని నీళ్లను
  rationale: יְאֹר ఇక్కడ ప్రత్యేకంగా నైలును సూచిస్తుంది. עַל ను తెలుగు ‘కొట్టు’ క్రియకు సహజమైన కర్మ నిర్మాణంలో వ్యక్తం చేస్తుంది; מַיִם యొక్క బహువచన రూపభావాన్ని ‘నీళ్లు’ నిలుపుతుంది.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: అవి రక్తంగా మారిపోతాయి
  rationale: బహువచన క్రియను ‘నీళ్లు’తో సరిపోల్చి, రూపాంతర ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచబడింది. ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: אָנֹכִי מַכֶּה యొక్క కాలభావం
  choice: కొడుతున్నాను
  alternative: కొట్టబోతున్నాను
  rationale: హీబ్రూ participle చర్యను సజీవంగా, సమీపంగా ప్రదర్శిస్తుంది. భవిష్యత్ ఉద్దేశంగా మాత్రమే మార్చకుండా దాని నాటకీయ ఉద్వేగాన్ని నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘నీళ్లు ... అవి’ అనే బహువచన అన్వయాన్ని తెలుగు సహజంగానే మోయగలందున పాదటిప్పణి అవసరం లేదు.
