revisions:
- from: 'యెహోవా ఇలా అంటున్నాడు: “నేనే యెహోవానని దీనివల్ల నీవు తెలుసుకుంటావు. ఇదిగో, నా చేతిలో ఉన్న కర్రతో నైలు నదిలోని నీళ్లను కొడుతున్నాను; అవి రక్తంగా మారిపోతాయి.”'
  to: 'యాహ్వే ఇలా చెబుతున్నాడు: “దీనివల్ల నేనే యాహ్వేనని నీవు తెలుసుకుంటావు: ఇదిగో, నా చేతిలో ఉన్న కర్రతో నైలు నదిలోని నీళ్లను కొట్టబోతున్నాను; అవి రక్తంగా మారతాయి.”'
  rationale: 'The revision aligns the divine-name rendering with the stated POB convention and adjusts the Telugu verbal form to communicate the Hebrew participle’s imminent, vivid force. No footnote is needed: Telugu naturally retains the plural agreement of ‘నీళ్లు ... అవి.’'
