  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: te
  text: మోషే, అహరోను యాహ్వే ఆజ్ఞాపించినట్టే చేశారు. అతడు దండాన్ని పైకెత్తి, ఫరో కళ్ల ఎదుటా అతని సేవకుల కళ్ల ఎదుటా నైలు నది[a]లో ఉన్న నీటిని కొట్టాడు. నైలు నదిలోని నీరంతా రక్తంగా మారిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నది’; నిర్గమకాండలో ఈ పదం సాధారణంగా నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు అనుగుణంగా వారు చేసినట్లు తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞకు సరిగ్గా అనుగుణంగా చేసిన భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: וַיָּרֶם בַּמַּטֶּה
  choice: కర్రను పైకెత్తి
  rationale: మַטֶּהకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘కర్ర’; హిఫిల్ క్రియలోని పైకెత్తే చర్యను నేరుగా తెలుపుతుంది.
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: నీటిని కొట్టారు
  rationale: נכה క్రియలోని కొట్టడం అనే ప్రాథమిక అర్థాన్ని స్పష్టంగా నిలుపుతుంది; తెలుగులో ముందున్న సంయుక్త కర్తకు అనుగుణంగా బహువచన క్రియ సహజంగా ఉంది.
- source_word: הַיְאֹר
  choice: నైలు నది
  rationale: నిర్గమకాండ సందర్భంలో ఈ పదం సాధారణంగా నైలు నదినే సూచిస్తుంది; మూలంలోని ‘నది’ అనే రూపాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: לְעֵינֵי פַרְעֹה וּלְעֵינֵי עֲבָדָיו
  choice: ఫరో కళ్ల ఎదుట, అతని సేవకుల కళ్ల ఎదుట
  rationale: మూలంలోని పునరుక్తిని నిలుపుతూ ఈ కార్యం బహిరంగంగా వారి సమక్షంలో జరిగిందనే ఉద్ఘాటనను కాపాడుతుంది.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: రక్తంగా మారిపోయింది
  rationale: ఫలితంగా నీరంతా రక్తమైందనే భావాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో ఉన్న టెట్రాగ్రామటన్‌ను ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: కర్రను పైకెత్తి నీటిని కొట్టిన వ్యక్తి గుర్తింపు
  choice: తెలుగు వాక్యంలో ప్రత్యేకంగా పేరు చెప్పకుండా సంయుక్త కర్తతో కొనసాగించడం
  alternative: అహరోను కర్రను పైకెత్తి కొట్టాడు
  rationale: హీబ్రూ క్రియలు ఏకవచనంలో ఉన్నప్పటికీ ఈ వాక్యంలో కర్త పేరు స్పష్టంగా లేదు; మునుపటి ఆజ్ఞ ఆధారంగా అహరోను అని నిర్ధారించి చేర్చకుండా మూలంలోని స్వల్ప అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. ‘కళ్ల ఎదుట’ అనే పునరుక్తిని మూలంలోని బహిరంగ సాక్ష్య ఉద్ఘాటన కోసం నిలిపాం.
