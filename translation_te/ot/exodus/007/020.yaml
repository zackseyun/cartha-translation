revisions:
- from: మోషే, అహరోనులు అలాగే చేశారు. యాహ్వే ఆజ్ఞాపించినట్టే, కర్రను పైకెత్తి ఫరో కళ్ల ఎదుట, అతని సేవకుల కళ్ల ఎదుట నైలు నది[a]లోని నీటిని కొట్టారు. అప్పుడు నైలు నదిలోని నీరంతా రక్తంగా మారిపోయింది.
  to: మోషే, అహరోను యాహ్వే ఆజ్ఞాపించినట్టే చేశారు. అతడు దండాన్ని పైకెత్తి, ఫరో కళ్ల ఎదుటా అతని సేవకుల కళ్ల ఎదుటా నైలు నది[a]లో ఉన్న నీటిని కొట్టాడు. నైలు నదిలోని నీరంతా రక్తంగా మారిపోయింది.
  rationale: The revision corrects Aaron’s name and preserves the Hebrew singular verbs without resolving the actor’s identity. It also retains the repeated public-witness expression and the explanatory footnote for ‘the river’/Nile.
