  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం. మూలంలోని మూడు సమాంతర పదబంధాలను నిలిపి, ‘ఎక్కివస్తాయి’ ద్వారా కప్పలు పైకి వచ్చి మీదపడే దృశ్యాన్ని స్పష్టంగా ఉంచాం.
