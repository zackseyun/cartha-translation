  text: కప్పలు నీ మీదికి, నీ ప్రజల మీదికి, నీ సేవకులందరి మీదికి ఎక్కివస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָה / וּבְעַמְּךָ / וּבְכָל עֲבָדֶיךָ
  choice: నీ మీదికి, నీ ప్రజల మీదికి, నీ సేవకులందరి మీదికి
  rationale: మూడు పదబంధాల్లోనూ పునరావృతమైన בְּ ఉపసర్గను ఒకే విధంగా అనువదించి సమాంతర నిర్మాణాన్ని నిలిపాం. తెగులు ఫరోనూ అతని రాజ్యంలోని వారినీ ముంచెత్తే భావాన్ని ‘మీదికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲלוּ
  choice: ఎక్కివస్తాయి
  rationale: עָלָה యొక్క పైకి రావడం అనే ప్రాథమిక భావాన్ని, కప్పలు నీటి నుంచి బయలుదేరి ప్రజల మీదికి రావడం అనే సందర్భాన్ని రెండింటినీ ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: הַצְפַרְדְּעִים
  choice: కప్పలు
  rationale: హెబ్రీ definite article ముందుగా ప్రకటించబడిన కప్పల తెగులును సూచిస్తుంది; తెలుగులో బహువచన నామానికి ప్రత్యేక నిర్దేశక పదం చేర్చకుండా ‘కప్పలు’ అనడమే సహజం.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: עֶבֶד అనే పదానికి సేవకులు, దాసులు, రాజోద్యోగులు అనే భావాలు ఉండవచ్చు. ఇక్కడ రాజసభ సందర్భంలో విస్తృతమైన అర్థాన్ని కాపాడేందుకు ‘సేవకులు’ ఎంచుకున్నాం; ‘అధికారులు’ లేదా ‘బానిసలు’ అనడం అవసరానికి మించిన నిర్దిష్టతను కలిగిస్తుంది.
