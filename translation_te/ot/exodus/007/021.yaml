base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: te
  text: నైలు నదిలోని చేపలు చనిపోయాయి. నైలు నది దుర్వాసన కొట్టింది; అందువల్ల ఐగుప్తీయులు నైలు నది నుండి నీరు తాగలేకపోయారు. ఐగుప్తు దేశమంతటా రక్తం ఏర్పడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: చేపలు
  rationale: ఏకవచన రూపంలో ఉన్న సమూహవాచక పదాన్ని తెలుగులో సహజంగా బహువచనమైన ‘చేపలు’గా ఇచ్చాం.
- source_word: יְאֹר
  choice: నైలు నది
  rationale: ఈ నిర్గమకాండ సందర్భంలో ఈ పదం సాధారణ నదిని కాక ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది; తెలుగు పాఠకునికి సూచ్యం స్పష్టంగా ఉండేలా పేరును ఇచ్చాం.
- source_word: מֵתָה
  choice: చనిపోయాయి
  rationale: కథన క్రమంలోని పూర్తయిన సంఘటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּבְאַשׁ
  choice: దుర్వాసన కొట్టింది
  rationale: నది కుళ్లిన దుర్గంధాన్ని వెదజల్లిందనే బలమైన భావాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: וְלֹא יָכְלוּ
  choice: తాగలేకపోయారు
  rationale: అసమర్థతను తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: నైలు నది నీళ్లు తాగలేకపోయారు
  rationale: మూలంలోని ‘తాగడం,’ ‘నీరు,’ ‘నది నుండి’ అనే అంశాలను నిలుపుతూ తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని వాడాం.
- source_word: וַיְהִי הַדָּם
  choice: రక్తం ఉంది
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణాన్ని అతిశయించకుండా సరళంగా ప్రతిబింబిస్తుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: בְּכָל యొక్క విస్తారార్థాన్ని సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
