  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: te
  text: వారు ఫరోతో మాట్లాడినప్పుడు, మోషేకు ఎనభై ఏళ్లు, అహరోనుకు ఎనభై మూడు ఏళ్లు ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మోషే ఎనభై సంవత్సరాల కుమారుడు, అహరోను ఎనభై మూడు సంవత్సరాల కుమారుడు; వారు ఫరోతో మాట్లాడినప్పుడు.”'
    reason: హీబ్రూ వయస్సు నుడికారం అక్షరార్థంగా ‘... సంవత్సరాల కుమారుడు’ అని ఉంటుంది.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: '...కు ... ఏళ్లు ఉన్నప్పుడు'
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; అక్షరార్థమైన ‘... సంవత్సరాల కుమారుడు’ తెలుగు వాడుకకు అసహజం.
- source_word: שְׁמֹנִים שָׁנָה
  choice: ఎనభై ఏళ్లు
  rationale: వయస్సును సూచించే సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: ఎనభై మూడు ఏళ్లు
  rationale: హీబ్రూలోని ‘మూడు మరియు ఎనభై’ సంఖ్యాక్రమాన్ని సహజమైన తెలుగు సంఖ్యాక్రమంలో అందిస్తుంది.
- source_word: בְּדַבְּרָם
  choice: వారు ... మాట్లాడారు
  rationale: בְּ + క్రియానామ రూపం, బహువచన ప్రత్యయంతో కలిసి ఇక్కడ కాలసంబంధ పరిస్థితిని సూచిస్తుంది; వయస్సు వాక్యంలో ‘ఉన్నప్పుడు’ ద్వారా ఆ సంబంధం సహజంగా వ్యక్తమైంది.
- source_word: אֶל
  choice: తో
  rationale: ఒక వ్యక్తిని ఉద్దేశించి మాట్లాడటాన్ని తెలుగులో సహజంగా ‘ఫరోతో మాట్లాడారు’ అని అంటారు; సందర్భంలో దిశాసంబంధ భావం నిలుస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: וּ
  choice: ప్రత్యేక పదం లేకుండా వాక్య అనుసంధానం
  rationale: ఆరంభ వావ్ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ‘ఇప్పుడు’ అని చేర్చితే మూలంలో లేని కాలార్థం రావచ్చు, కాగా సందర్భమే అనుసంధానాన్ని తెలియజేస్తుంది.
