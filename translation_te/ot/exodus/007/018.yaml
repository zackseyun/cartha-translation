translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గంభీరమైన కాని సహజమైన శైలి వాడబడింది. సమాంతర హీబ్రూ వాక్య నిర్మాణాన్ని అర్ధవిరామాలతో నిలుపుతూ, וְנִלְאוּలోని అలసట–అసమర్థత అర్థసందిగ్ధతను పాదసూచికలో భద్రపరచాం.
