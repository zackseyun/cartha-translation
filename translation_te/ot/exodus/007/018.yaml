source:
  edition: WLC
  text: וְ/הַ/דָּגָ֧ה אֲשֶׁר בַּ/יְאֹ֛ר תָּמ֖וּת וּ/בָאַ֣שׁ הַ/יְאֹ֑ר וְ/נִלְא֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: te
  text: నైలు నదిలోని[a] చేపలు చనిపోతాయి; నైలు నది దుర్వాసన కొడుతుంది; ఐగుప్తీయులు నైలు నది నుండి నీళ్లు తాగలేకపోతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘నది’; ఈ సందర్భంలో అది ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఐగుప్తీయులు నైలు నది నుండి నీళ్లు తాగడానికి ప్రయత్నించి అలసిపోతారు.’ హీబ్రూ క్రియకు అలసిపోవడం లేదా అలసటవల్ల చేయలేకపోవడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: చేపలు
  rationale: హీబ్రూలో ఇది ఏకవచన రూపంలో ఉన్న సమూహవాచకం. తెలుగులో ‘చేపలు’ అని బహువచనంగా చెప్పడం సహజంగా ఉండి, నదిలోని చేపలన్నిటినీ సూచిస్తుంది.
- source_word: יְאֹר
  choice: నైలు నది
  rationale: ఈ నిర్గమకాండ సందర్భంలో ఈ పదం సాధారణంగా ఏదో ఒక నదిని కాక నైలు నదినే సూచిస్తుంది. అందువల్ల సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘నైలు నది’ అని అనువదించబడింది.
- source_word: תָּמוּת
  choice: చనిపోతాయి
  rationale: מות క్రియకు ఇక్కడ సరళమైన భవిష్యదర్థం ఉంది. చేపలకు సంబంధించి ‘చనిపోతాయి’ అనేది సహజమైన, ప్రత్యక్షమైన తెలుగు ప్రయోగం.
- source_word: וּבָאַשׁ
  choice: దుర్వాసన కొడుతుంది
  rationale: באש అంటే దుర్వాసన రావడం లేదా కంపు కొట్టడం. ‘దుర్వాసన కొడుతుంది’ అనే ప్రయోగం మూలంలోని బలాన్ని తగ్గించకుండా సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְנִלְאוּ
  choice: తాగలేకపోతారు
  rationale: לאה నిఫల్ రూపం అలసిపోవడం లేదా శక్తి చాలకపోవడం వల్ల సాధ్యం కాకపోవడం అనే భావాన్ని ఇవ్వగలదు. ఈ సందర్భంలో కలిగే ఆచరణాత్మక అసమర్థతను ‘తాగలేకపోతారు’ స్పష్టంగా తెలియజేస్తుంది; అలసట అనే సాధ్యమైన సూక్ష్మార్థం పాదసూచికలో నిలుపబడింది.
- source_word: לִשְׁתּוֹת מַיִם
  choice: నీళ్లు తాగడం
  rationale: మూలంలో ‘తాగడం’తో పాటు ‘నీళ్లు’ అనే కర్మ స్పష్టంగా ఉంది. పూర్తి భావాన్ని, తాగునీరు కోల్పోవడంపై ఉన్న ఉద్దేశాన్ని నిలుపడానికి రెండూ అనువదించబడ్డాయి.
- source_word: מִן הַיְאֹר
  choice: నైలు నది నుండి
  rationale: מן ఉపసర్గకు ‘నుండి’ సహజమైన తెలుగు సమానం; సందర్భంలోని నైలు నదిని స్పష్టంగా సూచిస్తుంది.
