id: EXO.7.15
reference: Exodus 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: te
  text: ఉదయం ఫరో దగ్గరికి వెళ్లు. ఇదిగో, అతడు నీటి వైపుకు వెళ్తున్నాడు. నీవు నైలు నది ఒడ్డున అతన్ని కలుసుకోవడానికి నిలబడు. పాముగా మారిన ఆ దండాన్ని నీ చేతిలో పట్టుకో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వెళ్లు
  rationale: హీబ్రూ ఆజ్ఞను సహజమైన ఆధునిక తెలుగు ఏకవచన ఆజ్ఞారూపంలో అందిస్తుంది; אֶל వ్యక్తివైపు గమనాన్ని సూచిస్తుంది.
- source_word: בַּבֹּקֶר
  choice: ఉదయాన్నే
  rationale: కాలసూచక పదబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: יֹצֵא הַמַּיְמָה
  choice: నీళ్ల దగ్గరికి బయలుదేరుతున్నాడు
  rationale: יֹצֵא లోని కొనసాగుతున్న/సమీప చర్య భావాన్ని, దిశాసూచక ה ముగింపుతో ఉన్న הַמַּיְמָה యొక్క నీటివైపు గమనాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: అతనికి ఎదురుగా నిలబడు
  rationale: נצב యొక్క స్థానం తీసుకొని నిలబడే భావాన్నీ, לקראת యొక్క ఎదుర్కొనే లేదా కలుసుకునే దిశాభావాన్నీ సందర్భానుగుణంగా నిలుపుతుంది.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: నైలు నది ఒడ్డున
  rationale: שְׂפַת ఇక్కడ నది ఒడ్డును సూచిస్తుంది; నిర్గమకాండ సందర్భంలో יְאֹר ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది.
- source_word: הַמַּטֶּה
  choice: ఆ కర్ర
  rationale: మోషే చేతిలో పట్టుకునే מַטֶּהను సాధారణ పాఠకుడికి సహజంగా అర్థమయ్యే ‘కర్ర’గా అందిస్తుంది; నిర్దిష్ట ఉపపదం ముందే తెలిసిన వస్తువును సూచిస్తుంది.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: పాముగా మారిన
  rationale: נהפך యొక్క మార్పు భావాన్ని నేరుగా తెలుపుతుంది; נָחָשׁకు సహజమైన ఆధునిక తెలుగు పదం ‘పాము’.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: నీ చేతిలో పట్టుకో
  rationale: ఆజ్ఞాత్మక సందర్భాన్ని స్పష్టమైన తెలుగు ఆజ్ఞగా అందిస్తూ, ‘నీ చేతిలో’ అనే హీబ్రూ దృశ్య స్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: יְאֹר యొక్క నిర్దిష్ట సూచన
  choice: నైలు నది
  alternative: నది
  rationale: నిర్గమకాండలో ఈ పదం సాధారణ నదికన్నా ఐగుప్తులోని నైలు నదిని సూచిస్తుంది; ఇది కథన స్థలాన్ని స్పష్టం చేసే భాషా-చారిత్రక నిర్ణయం.
- issue: לִקְרָאתוֹ యొక్క సందర్భార్థం
  choice: అతనికి ఎదురుగా
  alternative: అతన్ని కలుసుకోవడానికి
  rationale: ఈ సందర్భంలో మోషే ఫరో వచ్చే చోట తన స్థానాన్ని తీసుకోవడం ప్రధానంగా ఉంది. ‘ఎదురుగా’ అనేది కలుసుకోవడం మరియు ఎదుర్కొనడం రెండింటికీ ఉన్న స్వల్ప ఉద్వేగాన్ని అతిగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూలోని ఆజ్ఞల వరుసను తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞలుగా ఇచ్చాం. మూలంలో పాదటిప్పణి అవసరమయ్యే ముఖ్య పాఠభేదం లేదు; అందువల్ల గుర్తులు లేదా పాదటిప్పణులు చేర్చలేదు.
