  terminology: “మంత్రగాళ్లు” for מְכַשְּׁפִים and “మాంత్రికులు” for חַרְטֻמֵּי מִצְרַיִם appropriately preserves the source-level distinction. “గూఢవిద్యలతో” is a suitable broad rendering of בְּלַהֲטֵיהֶם, and the footnote responsibly preserves the lexical uncertainty without doctrinal elaboration.
