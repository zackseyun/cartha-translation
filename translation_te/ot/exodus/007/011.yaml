  source_fidelity: 'The Telugu accurately represents the Hebrew sequence and emphases: Pharaoh in turn summons the wise men and sorcerers; the Egyptian magicians likewise do the same; and they do so by means denoted by the lexically uncertain לַהֲטֵיהֶם. The two Hebrew practitioner terms are kept distinct without defining the nature of their power.'
