id: EXO.7.11
reference: Exodus 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ גַּם פַּרְעֹ֔ה לַֽ/חֲכָמִ֖ים וְ/לַֽ/מְכַשְּׁפִ֑ים וַ/יַּֽעֲשׂ֨וּ גַם הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּ/לַהֲטֵי/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: te
  text: అప్పుడు ఫరో కూడా జ్ఞానులను, మంత్రగాళ్లను పిలిపించాడు. ఐగుప్తు మాంత్రికులైన వారు కూడా తమ గూఢవిద్యలతో[a] అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ మంత్రవిద్యలతో.’ హీబ్రూ పదం గూఢకళలను లేదా మంత్రప్రయోగాలను సూచించవచ్చు; దాని ఖచ్చితమైన భావఛాయ అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించాడు
  rationale: ఈ సందర్భంలో క్రియ వ్యక్తులను తన సమక్షానికి రప్పించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పిలిపించాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానులను
  rationale: ఇది రాజాస్థానంలోని జ్ఞానవంతులు లేదా నిపుణులను సూచిస్తుంది; ‘జ్ఞానులు’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: מְכַשְּׁפִים
  choice: మంత్రగాళ్లను
  rationale: כשׁף మూలానికి చెందిన ఈ పదం మంత్రవిద్యను ఆచరించేవారిని సూచిస్తుంది; తరువాతి חַרְטֻמִּים నుండి పదభేదాన్ని నిలుపుతుంది.
- source_word: גַם הֵם
  choice: వారు కూడా
  rationale: ఫరో నిపుణులు సైతం ముందు జరిగిన కార్యాన్ని అనుకరించారని తెలిపే ఉద్ఘాటనను సహజ తెలుగులో నిలుపుతుంది.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ఐగుప్తు మాంత్రికులు
  rationale: నిర్గమకాండంలో ఫరోకు చెందిన ఆచార నిపుణులకు వాడిన ప్రత్యేక పదానికి సందర్భోచితమైన, సులభంగా అర్థమయ్యే అనువాదం.
- source_word: בְּלַהֲטֵיהֶם
  choice: తమ గూఢవిద్యలతో
  rationale: వారు ఉపయోగించిన రహస్యమైన లేదా మంత్రసంబంధ కళలను సూచిస్తుంది; నిర్దిష్ట విధానాన్ని అనవసరంగా ఖరారు చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందు జరిగిన సూచకకార్యాన్ని వారు అనుకరించారని సహజంగా వెనుకకు సూచిస్తుంది.
theological_decisions:
- issue: ఐగుప్తు మాంత్రికుల శక్తి స్వభావం
  choice: ‘తమ గూఢవిద్యలతో అలాగే చేశారు’ అనే ఘటనావర్ణన మాత్రమే ఇవ్వడం
  alternative: అది నిజమైన అతీంద్రియ శక్తి అనీ, దయ్యసంబంధ శక్తి అనీ, లేదా కేవలం మోసం అనీ స్పష్టీకరించడం
  rationale: హీబ్రూ వచనం వారు చేసిన పనిని, దానికి ఉపయోగించిన గూఢకళలను పేర్కొంటుంది గాని అది ఎలా సాధ్యమైందో తాత్త్వికంగా వివరించదు. అందువల్ల అనువాదం ఆ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా కథన గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘మంత్రగాళ్లు’ మరియు ‘మాంత్రికులు’ అనే వేర్వేరు పదాలతో మూలంలోని מְכַשְּׁפִים / חַרְטֻמִּים భేదం కాపాడబడింది.
