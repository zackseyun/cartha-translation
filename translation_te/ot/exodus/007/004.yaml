  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: te
  text: ఫరో మీ మాట వినడు; నేను ఐగుప్తు మీద నా చెయ్యి మోపి, గొప్ప తీర్పులతో నా దళాలను[a]—నా ప్రజలైన ఇశ్రాయేలు కుమారులను[b]—ఐగుప్తు దేశం నుండి బయటకు తీసుకొస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సేనలను.’ హీబ్రూ పదం క్రమబద్ధమైన సమూహాలను సూచిస్తుంది; దీనికి సైనిక భావఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయులైన నా ప్రజలను.’ అక్షరార్థంగా, ‘నా ప్రజలు, ఇశ్రాయేలు కుమారులు.’ ఈ పదబంధం ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గొప్ప న్యాయతీర్పు కార్యాల ద్వారా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: మీ మాట వినడు
  rationale: שׁמע אֶל అంటే ఇక్కడ ‘వినడం/లక్ష్యపెట్టడం.’ ‘మీ మాట వినడు’ అనేది సహజమైన తెలుగు; విధేయత చూపడు అనే భావాన్ని సందర్భం సూచించినా, దాన్ని పాఠ్యంలో అతిగా స్పష్టీకరించదు.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: ఐగుప్తుమీద నా చెయ్యి మోపి
  rationale: హీబ్రూ ‘నా చెయ్యి ఉంచుతాను’ అనే దైవిక చర్యను సూచించే రూపకాన్ని నిలుపుతూ, తీర్పు కోసం దేవుడు నిర్ణయాత్మకంగా జోక్యం చేసుకుంటాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צִבְאֹתַי
  choice: నా దళాలను
  rationale: צָבָא అనేది సైన్యం, సమూహం, క్రమబద్ధమైన విభాగం అనే అర్థాలు కలిగి ఉంటుంది. ‘దళాలు’ క్రమబద్ధమైన సామూహిక భావాన్ని, కొంత సైనిక ఛాయను రెండింటినీ నిలుపుతుంది; ‘సైన్యాలు’ కంటే తక్కువగా యుద్ధార్థాన్ని బలవంతపెడుతుంది.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులైన నా ప్రజలను
  rationale: ‘నా ప్రజలు’ మరియు ‘ఇశ్రాయేలు కుమారులు’ అనే సమానాధికార గుర్తింపును నిలుపుతుంది. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని కుటుంబ-వంశ పదబంధానికి సన్నిహితమైన రూపం.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: గొప్ప తీర్పుల ద్వారా
  rationale: బహువచనాన్ని, న్యాయతీర్పు భావాన్ని నిలుపుతూ, ఇవి ఐగుప్తుపై అమలు చేయబడే దైవిక తీర్పు కార్యాలని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును צִבְאֹתַי అని పేర్కొనడం
  choice: నా దళాలను
  alternative: నా సేనలను / నా క్రమబద్ధమైన సమూహాలను
  rationale: ఇశ్రాయేలు యెహోవా అధికారంలో బయటకు తీసుకురాబడే క్రమబద్ధమైన సమూహమని పాఠ్యం చిత్రిస్తుంది. ‘దళాలు’ సామూహిక-సైనిక ఛాయను నిలుపుతుంది గాని, వారిని నేరుగా యుద్ధసైన్యంగా మాత్రమే నిర్వచించదు.
- issue: בְנֵי יִשְׂרָאֵל లోని వంశసంబంధ పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది ప్రజలందరినీ సూచించే సంప్రదాయ వంశనామమని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నా చెయ్యి మోపి’ అనే రూపకం మూలభాష చిత్రాన్ని నిలుపుతుంది. ఎమ్-డాష్ మధ్యనున్న వివరణ ‘నా దళాలు’ ఎవరో స్పష్టపరుస్తూ హీబ్రూ సమానాధికార నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
