  naturalness: The revised wording is natural modern standard Telugu. Using a semicolon better reflects the Hebrew clause progression without inserting an explicit temporal sequence. ‘ఐగుప్తు మీద’ is spaced normally.
  terminology: ‘నా దళాలను’ suitably retains the organized, potentially military sense of צִבְאֹתַי without forcing a full-scale military reading. ‘నా ప్రజలైన ఇశ్రాయేలు కుమారులను’ clearly preserves the Hebrew apposition. ‘గొప్ప తీర్పులతో’ retains the plural judicial sense of בִּשְׁפָטִים גְּדֹלִים.
