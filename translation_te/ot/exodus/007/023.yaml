    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: వెనుదిరిగి
  rationale: פנה ఇక్కడ తిరగడం లేదా అక్కడి నుండి మరలిపోవడం అనే కథన కదలికను సూచిస్తుంది. తరువాత వచ్చే ‘వెళ్లిపోయాడు’తో సహజంగా కలిసేలా ‘వెనుదిరిగి’ అని అనువదించాం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: నిర్గమకాండంలో ఈజిప్టు రాజుకు వాడే బిరుదుకు ప్రామాణిక తెలుగు రూపం.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: తన ఇంటిలోకి వెళ్లిపోయాడు
  rationale: בוא తో కూడిన אֶל అతని నివాసంలోకి ప్రవేశించే కదలికను సూచిస్తుంది. కథన దృష్టికోణానికి అనుగుణంగా ‘ఇంటిలోకి వెళ్లిపోయాడు’ సహజంగా ఉంది.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: అతడు హృదయంలో పెట్టుకోలేదు
  rationale: ఈ హీబ్రూ నుడికారం ఒక విషయాన్ని మనసులో ఉంచుకొని గంభీరంగా పట్టించుకోవడాన్ని సూచిస్తుంది. ‘హృదయంలో పెట్టుకోలేదు’ మూలంలోని హృదయ భాషను నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: גַּם לָזֹאת
  choice: దీనిని కూడా
  rationale: גַּם ఇక్కడ ‘కూడా/సైతం’ అనే బలాన్ని ఇస్తుంది; לָזֹאת ప్రస్తుత సూచన లేదా తీర్పును సూచిస్తుంది. ‘దీనిని కూడా’ మూలంలోని సూచనను, ఉద్ఘాటనను నిలుపుతుంది.
