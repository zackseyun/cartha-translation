review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Pharaoh’s turning, entering his house, and his failure to respond seriously even to this event. However, the Telugu rendering of the Hebrew idiom is less natural than a standard Telugu idiom, and the footnote’s literal alternative needs correction.
  naturalness: “హృదయంలో పెట్టుకోలేదు” is understandable but somewhat calqued and not idiomatic in modern standard Telugu in this context. “మనసుకు తీసుకోలేదు” is natural and conveys ‘did not take to heart.’
  terminology: “ఫరో” is standard. “వెనుతిరిగి” suitably expresses וַיִּפֶן without adding interpretive detail. “మనసుకు తీసుకోలేదు” preserves the serious-attention sense of שָׁת לִבּוֹ; the footnote retains a closer heart/mind-setting alternative.
  issues:
  - severity: medium
    issue: The main-text idiom “హృదయంలో పెట్టుకోలేదు” is unnatural in contemporary Telugu narrative.
    rationale: It is a close structural imitation of the Hebrew/English expression but does not read as the usual Telugu way of saying that someone did not take a matter seriously or to heart.
  - severity: low
    issue: The footnote phrase “తన హృదయాన్ని నిలపలేదు” does not naturally or precisely render the Hebrew idiom.
    rationale: The underlying idiom means ‘set one’s heart/mind to [a matter],’ better expressed in Telugu as “దీనిపై తన మనసు పెట్టలేదు.”
  revised_text: ఫరో వెనుతిరిగి తన ఇంట్లోకి వెళ్లాడు; దీనిని కూడా అతడు మనసుకు తీసుకోలేదు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “దీనిపై కూడా తన మనసు పెట్టలేదు”; అంటే, “దీనిని కూడా పట్టించుకోలేదు.”
    reason: lexical_alternative
  revision_rationale: The revision keeps the Hebrew narrative sequence and the emphatic ‘even this,’ while using idiomatic modern Telugu for the heart-setting expression. The note supplies a closer lexical alternative without imposing a theological interpretation.
