source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: te
  text: అయితే ఐగుప్తు మాంత్రికులు కూడా తమ రహస్య విద్యలతో[a] అలాగే చేశారు. ఫరో హృదయం కఠినపడింది[b]; యెహోవా చెప్పినట్లుగానే అతడు వారి మాట వినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ మంత్రాలతో,’ లేదా ‘తమ గూఢ విద్యలతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఫరో హృదయం గట్టిపడింది.’ ఈ వచనంలోని హీబ్రూ హృదయాన్ని కఠినపరిచిన కర్తను స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ‘వారు అలా చేశారు’ అనే హీబ్రూ ప్రయోగం ముందటి సూచకక్రియను వారు అనుకరించారని సందర్భంలో తెలియజేస్తుంది; ‘అలాగే చేశారు’ సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: ఐగుప్తు మాంత్రికులు
  rationale: ఈ పదం ఫరో ఆస్థానంలోని మంత్రవిద్యా నిపుణులను సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘మాంత్రికులు’ స్పష్టంగా, సందర్భోచితంగా ఉంటుంది.
- source_word: בְּלָטֵיהֶם
  choice: తమ రహస్య విద్యలతో
  rationale: ఈ పదం రహస్యమైన లేదా గూఢమైన మంత్ర పద్ధతులను సూచిస్తుంది. ‘తో’ సాధనార్థాన్ని, ‘రహస్య విద్యలు’ దాచిన మాంత్రిక ప్రక్రియ భావాన్ని నిలుపుతాయి.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ఫరో హృదయం కఠినపడింది
  rationale: హీబ్రూ వాక్యంలో హృదయాన్ని కఠినపరిచిన కర్తను స్పష్టంగా పేర్కొనలేదు. అకర్మక రూపం ఫలిత స్థితిని తెలియజేస్తూ ఆ అనిశ్చితిని కాపాడుతుంది.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: అతడు వారి మాట వినలేదు
  rationale: שׁמע אֶל అంటే ‘వినడం/లెక్కచేయడం.’ తెలుగులో ‘వారి మాట వినలేదు’ అనేది సహజంగా ఉండి, సందర్భంలో మోషే అహరోనులను సూచిస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా చెప్పినట్లుగానే
  rationale: ఈ సూత్రప్రాయమైన మాట యెహోవా ముందుగా పలికిన ప్రకటనను సూచిస్తుంది; తెలుగు వాక్యక్రమంలో ఇది సహజంగా ఆ ముందస్తు మాట నెరవేరిన భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ‘యెహోవా’గా అందించబడింది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడటంలో కర్తృత్వం
  choice: ‘ఫరో హృదయం కఠినపడింది’ అని కర్తను నిర్దేశించకుండా అనువదించడం
  alternative: ‘ఫరో తన హృదయాన్ని కఠినపరచుకున్నాడు’ లేదా ‘దేవుడు ఫరో హృదయాన్ని కఠినపరిచాడు’
  rationale: ఈ వచనంలోని హీబ్రూ నిర్మాణం కఠినపరిచిన కర్తను స్పష్టంగా చెప్పదు. అందువల్ల సమీప వచనాల ఆధారంగా దేవునికో ఫరోకో కర్తృత్వాన్ని ఆపాదించకుండా మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఐగుప్తు’ మరియు ‘యెహోవా’ బైబిలు తెలుగు సంప్రదాయంలో సుపరిచిత రూపాలు; మిగతా వాక్యనిర్మాణం సాధారణ ఆధునిక వాడుకకు దగ్గరగా ఉంచబడింది.
