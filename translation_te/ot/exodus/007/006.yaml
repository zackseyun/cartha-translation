id: EXO.7.6
reference: Exodus 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: te
  text: మోషే మరియు అహరోను యాహ్వే[a] వారిద్దరికీ ఆజ్ఞాపించినట్లే చేశారు; వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశారు
  rationale: עשה అనే క్రియకు ‘చేయు/నిర్వర్తించు’ అనే విస్తృత అర్థం ఉంది. ఆజ్ఞకు విధేయత చూపిన ఈ సందర్భంలో ‘చేశారు’ సహజంగా ఉండి, వచనాంతంలోని క్రియ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోనులు
  rationale: వ్యక్తినామాలకు ప్రామాణిక తెలుగు రూపాలు వాడి, ఇద్దరినీ కలిపి సూచించే సహజమైన బహువచన నిర్మాణం ఉపయోగించబడింది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞకూ వారి కార్యానికీ ఉన్న ఖచ్చితమైన అనుగుణతను ‘-ట్టే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה అధికారపూర్వకంగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; తెలుగు కథన క్రమంలో ముందుగా ఇచ్చిన ఆజ్ఞను ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణ అయిన ‘యాహ్వే’గా ఇచ్చాం.
- source_word: אֹתָם
  choice: తమకు
  rationale: మూలంలో ఇది ‘వారిని’ అనే ప్రత్యక్ష కర్మ సూచన అయినప్పటికీ, తెలుగులో ‘వారిని ఆజ్ఞాపించాడు’ కంటే ‘తమకు ఆజ్ఞాపించాడు’ సహజం. కర్తలైన మోషే, అహరోనులనే తిరిగి సూచించేందుకు ‘తమకు’ వాడబడింది.
- source_word: כֵּן עָשׂוּ
  choice: వారు అలాగే చేశారు
  rationale: ‘అలా/ఆ విధంగా’ అనే כֵּן భావాన్నీ, עשה క్రియ పునరుక్తినీ నిలుపుతూ సహజమైన తెలుగు వాక్యంగా ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని עשה క్రియ పునరుక్తిని ‘చేశారు ... అలాగే చేశారు’గా ఉద్దేశపూర్వకంగా నిలిపాం.
