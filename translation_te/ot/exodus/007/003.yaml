source:
  edition: WLC
  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: te
  text: అయితే నేను ఫరో హృదయాన్ని కఠినపరుస్తాను[a], ఐగుప్తు దేశంలో నా సూచక క్రియలనూ నా అద్భుత కార్యాలనూ అనేకం చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరో హృదయాన్ని కఠినంగా చేస్తాను,’ లేదా ‘ఫరో హృదయాన్ని మొండిపరుస్తాను.’ హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది; కఠినపరచడం దేవుని నేరమైన చర్యగా చెప్పబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: ముందటి ఆజ్ఞాపన నేపథ్యంలో సంధానంతో కూడిన స్పష్ట సర్వనామం వ్యత్యాసాన్ని, ఉద్ఘాటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే నేను’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַקְשֶׁה
  choice: కఠినపరుస్తాను
  rationale: קשׁה అనే క్రియ హిఫీల్ రూపంలో నేరమైన కారణార్థాన్ని—‘కఠినంగా చేస్తాను’—తెలియజేస్తుంది. ‘కఠినపరుస్తాను’ ఆ కారణార్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: לֵב פַּרְעֹה
  choice: ఫరో హృదయాన్ని
  rationale: హీబ్రూ నిర్మిత పదబంధాన్ని తెలుగులో సహజమైన సంబంధార్థ రూపంలో ఇచ్చాం. ‘హృదయం’ అంతరంగ సంకల్పం/మనస్సును సూచించగలిగినా, మూలంలోని రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా నిలిపాం.
- source_word: וְהִרְבֵּיתִי
  choice: విస్తారంగా జరిగిస్తాను
  rationale: רבה హిఫీల్ రూపం ‘అధికం చేయడం/విస్తరింపజేయడం’ అనే భావాన్ని ఇస్తుంది. సూచక క్రియలు, అద్భుత కార్యాలతో ‘విస్తారంగా జరిగిస్తాను’ సహజమైన తెలుగు ప్రయోగం; దేవుడే వాటిని అధికంగా చేయించే కారణార్థమూ నిలుస్తుంది.
- source_word: אֹתֹתַי
  choice: నా సూచక క్రియలను
  rationale: אוֹת ఇక్కడ దేవుని శక్తిని, సందేశాన్ని సూచించే కార్యాన్ని తెలియజేస్తుంది. కేవలం ‘సూచనలు’ కంటే ‘సూచక క్రియలు’ సందర్భార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מוֹפְתַי
  choice: నా అద్భుత కార్యాలను
  rationale: מוֹפֵת అద్భుతం లేదా ఆశ్చర్యకరమైన సంకేతాన్ని సూచిస్తుంది. ‘అద్భుత కార్యాలు’ క్రియాత్మక సందర్భానికి సహజంగా సరిపోతూ ఆశ్చర్యార్థాన్ని కాపాడుతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలో אֶרֶץ (‘దేశం’) స్పష్టంగా ఉన్నందున దానిని నిలిపి, తెలుగులో సహజమైన స్థానవాచక రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడడంలో దేవుని చర్య
  choice: నేను ఫరో హృదయాన్ని కఠినపరుస్తాను
  alternative: ఫరో హృదయం కఠినపడడానికి నేను అనుమతిస్తాను
  rationale: హీబ్రూ హిఫీల్ రూపం దేవుని చర్యను నేరమైన కారణార్థంలో చూపుతుంది. దానిని కేవలం అనుమతిగా మార్చడం మూలంలోని భావాన్ని మృదువుచేసి దైవశాస్త్ర ఉద్రిక్తతను ముందుగానే పరిష్కరిస్తుంది; అందువల్ల ప్రధాన పాఠంలో ప్రత్యక్ష కారణార్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని పాటించాం. ‘హృదయం’ అనే మూల రూపకాన్ని నిలిపి, దైవ చర్యను అనుమతిగా మృదువుచేయలేదు. ‘సూచక క్రియలు—అద్భుత కార్యాలు’ అనే జత సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉండి మూలంలోని אותות/מופתים భేదాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
