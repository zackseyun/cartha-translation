source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “ఫరో దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పు: ‘యాహ్వే ఇలా అంటున్నాడు: నా ప్రజలను వెళ్లనివ్వు, వారు నన్ను సేవించడానికి.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నన్ను ఆరాధించడానికి” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ దేవునికి చేసే సేవను సూచిస్తుంది; అందులో ఆరాధన కూడా ఇమిడి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వెళ్లి
  rationale: בוא సందర్భానుసారంగా రావడం, వెళ్లడం లేదా సమక్షంలో ప్రవేశించడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ మోషే ఫరో సమక్షానికి వెళ్లాలనే ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: అతనితో ఇలా చెప్పు
  rationale: వరుసగా ఇచ్చిన ఆజ్ఞను స్పష్టమైన ఆజ్ఞార్థక రూపంలో నిలుపుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: అధికారపూర్వక దూతవాక్య సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: నా ప్రజలు ... వారిని వెళ్లనివ్వు
  rationale: ఇది కేవలం పంపించడం కాకుండా బంధితులైన ప్రజలను విడుదల చేయాలనే డిమాండును తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో సర్వనామ పునరుక్తి స్పష్టతను ఇస్తుంది.
- source_word: וְיַעַבְדֻנִי
  choice: నన్ను సేవించడానికి
  rationale: עבד దేవునికి చేసే సేవను సూచిస్తూ ఆరాధనను కూడా కలిగి ఉండవచ్చు. ‘సేవించడానికి’ అనే రూపం విస్తృతమైన మూలార్థాన్ని నిలుపుతూ, విడుదల ఉద్దేశాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: וְיַעַבְדֻנִי లో ఇశ్రాయేలు విడుదల ఉద్దేశం
  choice: నన్ను సేవించడానికి
  alternative: నన్ను ఆరాధించడానికి
  rationale: హీబ్రూ క్రియ దేవునికి చేసే ఆరాధనాత్మక సేవను సూచించగలిగినా, దాని భావాన్ని కేవలం ఆరాధనకే పరిమితం చేయకుండా విస్తృతమైన ‘సేవ’ అర్థాన్ని ప్రధాన పాఠంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ వాక్య నిర్మాణం, దూతవాక్యానికి తగిన గంభీరత. పాదసూచిక గుర్తు ప్రధాన పాఠంలోని సంబంధిత వాక్యం చివర ఉంచబడింది.
