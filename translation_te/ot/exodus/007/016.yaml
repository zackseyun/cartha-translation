id: EXO.7.16
reference: Exodus 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: te
  text: 'నీవు అతనితో ఇలా చెప్పాలి: “హెబ్రీయుల దేవుడైన యాహ్వే నన్ను నీ దగ్గరకు పంపి, ‘నా ప్రజలను వెళ్లనివ్వు; వారు అరణ్యంలో నన్ను సేవించాలి[a]’ అని చెప్పాడు. అయితే ఇదిగో, ఇప్పటివరకు నీవు వినలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు అరణ్యంలో నన్ను ఆరాధించాలి.” హీబ్రూ క్రియ సాధారణ సేవను గానీ, మతపరమైన ఆరాధనా సేవను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: హెబ్రీయుల దేవుడు
  rationale: మూలంలోని జాతి సూచనను ‘ఇశ్రాయేలీయులు’గా మార్చకుండా ‘హెబ్రీయులు’గానే నిలిపాం.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: నన్ను నీ దగ్గరకు పంపి
  rationale: పూర్తయిన పంపుదలను, దాని వెంట వచ్చే సందేశ పరిచయంతో సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: నా ప్రజలను వెళ్లనివ్వు
  rationale: ఇక్కడ שׁלח ఫరో ప్రజలను విడుదల చేసి వెళ్లనివ్వాలనే ఆజ్ఞను సూచిస్తుంది; అనవసరమైన వివరణ లేకుండా సందర్భార్థాన్ని అందిస్తుంది.
- source_word: וְיַעַבְדֻנִי
  choice: వారు నన్ను సేవించాలి
  rationale: עבד అనే క్రియలో సాధారణ సేవతో పాటు ఆరాధనా సేవ కూడా అంతర్భవిస్తుంది; ‘సేవించాలి’ ఆ విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసానికి వెలుపల ఉన్న అరణ్యప్రాంతాన్ని సూచిస్తుంది; ‘అరణ్యం’ దానిని కేవలం ఇసుక ఎడారిగా పరిమితం చేయదు.
- source_word: וְהִנֵּה
  choice: అయితే ఇదిగో
  rationale: הִנֵּה ప్రస్తుత పరిస్థితిపై దృష్టి నిలిపే సూచక పదం; సందర్భంలోని వ్యతిరేకతను ‘అయితే’ తెలియజేస్తుంది.
- source_word: לֹא שָׁמַעְתָּ
  choice: నీవు వినలేదు
  rationale: שׁמע ఇక్కడ వినడం, ఆలకించడం, విధేయత చూపడం మధ్య ఉద్దేశపూర్వక అర్థవిస్తృతిని కలిగి ఉంది; ‘వినలేదు’ దానిని ‘విధేయత చూపలేదు’గా పూర్తిగా నిర్ధారించదు.
- source_word: עַד כֹּה
  choice: ఇప్పటివరకు
  rationale: వర్తమాన క్షణం దాకా అనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని భేదాన్ని కాపాడుతుంది.
- issue: וְיַעַבְדֻנִי యొక్క అర్థపరిధి
  choice: నన్ను సేవించాలి
  alternative: నన్ను ఆరాధించాలి
  rationale: ఈ క్రియ ఆరాధనను కలిగి ఉండగలిగినా, దాని అర్థం దానికే పరిమితం కాదు. ‘సేవించాలి’ విస్తృతమైన ఒడంబడిక సంబంధ సేవను, ఆరాధనా భావాన్ని రెండింటినీ అనుమతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. దైవవాక్యంలోని అంతర్గత ఉద్ధరణలను స్పష్టంగా చూపించాం; שׁמע మరియు עבד పదాల అర్థవిస్తృతిని అతిగా నిర్ధారించకుండా నిలిపాం.
