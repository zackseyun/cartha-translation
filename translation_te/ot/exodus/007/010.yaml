revisions:
- from: మోషే, అహరోను ఫరో దగ్గరికి వెళ్లి, యెహోవా తమకు ఆజ్ఞాపించినట్లే చేశారు. అహరోను తన చేతికర్రను ఫరో ఎదుట, అతని సేవకుల ఎదుట పడవేశాడు; అది మహాసర్పంగా[a] మారింది.
