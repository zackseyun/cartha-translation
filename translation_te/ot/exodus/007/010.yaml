  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יַּ֣עַשׂוּ כֵ֔ן כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַ/יַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת מַטֵּ֗/הוּ לִ/פְנֵ֥י פַרְעֹ֛ה וְ/לִ/פְנֵ֥י עֲבָדָ֖י/ו וַ/יְהִ֥י לְ/תַנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: te
  text: మోషే, అహరోను ఫరో దగ్గరకు వచ్చి, యాహ్వే వారికి ఆజ్ఞాపించినట్లే చేశారు. అహరోను తన కర్రను ఫరో ఎదుట, అతని సేవకుల ఎదుట విసిరివేశాడు; అది సర్పమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ తన్నీన్ అనే పదం డ్రాగన్‌లాంటి జీవిని లేదా పెద్ద సరీసృపాన్ని కూడా సూచించవచ్చు; ఇక్కడ ఫరో ఎదుట జరిగిన ఈ సూచక క్రియలో అది సర్పాన్నే సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: దగ్గరికి వెళ్లి
  rationale: క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ, తరువాత వచ్చే సంయుక్త కర్త ‘మోషే, అహరోను’ను సమిష్టిగా సూచిస్తుంది. ఫరో సమక్షానికి వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: ఆజ్ఞను యథాతథంగా అమలు చేశారనే హీబ్రూ నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినట్లే
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు వారి చర్య సరిగ్గా అనుగుణంగా ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: וַיַּשְׁלֵךְ
  choice: పడవేశాడు
  rationale: ప్రదర్శనాత్మక సూచక క్రియలో చేతికర్రను కిందికి విసిరిన చర్యను స్పష్టమైన ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: מַטֵּהוּ
  choice: తన చేతికర్రను
  rationale: మַטֶּה అనే చేతిలో పట్టుకునే కర్రను సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: ఎదుట ... ఎదుట
  rationale: హీబ్రూలోని పునరుక్తిని నిలిపి, ఈ సూచక క్రియ ఫరోకూ అతని సేవకులకూ బహిరంగంగా చూపబడిందని నొక్కి చెబుతుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: మూలపదపు సాధారణ అర్థాన్ని నిలుపుతుంది; రాజసభ సందర్భంలో వీరు అధికారులనూ పరిచారకులనూ సూచించవచ్చు.
- source_word: וַיְהִי לְתַנִּין
  choice: అది మహాసర్పంగా మారింది
  rationale: תַנִּין సాధారణ పాముకంటే విస్తృతమైన అర్థపరిధి కలిగి ఉండటంతో ‘మహాసర్పం’ దాని అస్పష్టతను కొంత నిలుపుతుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: תַנִּין అర్థం
  choice: మహాసర్పం
  alternative: సర్పం; భీకర జీవి; పెద్ద సరీసృపం
  rationale: ఈజిప్టు రాజసభలో జరిగిన సూచక క్రియ సందర్భంలో సర్పజాతి జీవి ఉద్దేశించబడినట్లు కనిపిస్తుంది; అయితే పదానికి ఉన్న విస్తృతమైన, కొన్నిసార్లు భీకర లేదా జలజీవిని సూచించే అర్థపరిధిని పూర్తిగా సాధారణీకరించకుండా ‘మహాసర్పం’గా అనువదించి పాదసూచికలో ప్రత్యామ్నాయాలను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘ఫరో ఎదుట, అతని సేవకుల ఎదుట’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది; תַנִּין పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికతో సంరక్షించాం.
