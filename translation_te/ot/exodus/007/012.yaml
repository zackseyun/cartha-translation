translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని విభజనార్థక భావం, ఏకవచన-బహువచన వ్యత్యాసాలు, తన్నీన్ పదంలోని నిజమైన అర్థవిస్తృతి నిలుపబడ్డాయి.
