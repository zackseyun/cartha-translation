  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁלִ֨יכוּ֙ אִ֣ישׁ מַטֵּ֔/הוּ וַ/יִּהְי֖וּ לְ/תַנִּינִ֑ם וַ/יִּבְלַ֥ע מַטֵּֽה אַהֲרֹ֖ן אֶת מַטֹּתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/012.yaml
  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: te
  text: ప్రతి ఒక్కరూ తమ తమ కర్రను కింద పడవేశారు; అవి సర్పాలుగా[a] మారాయి. అయితే అహరోను కర్ర వారి కర్రలను మింగివేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘డ్రాగన్లుగా’ లేదా ‘భీకర సరీసృపాలుగా’; ఇక్కడి హీబ్రూ పదం తన్నీన్ సాధారణంగా ‘పాము’ అని అనువదించే పదం కంటే విస్తృతార్థం కలిగినది; అది సర్పాకార జీవిని లేదా పెద్ద సరీసృపాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: కింద పడవేశారు
  rationale: שׁלך ఇక్కడ ఒక వస్తువును కిందికి విసరడం లేదా పడవేయడం సూచిస్తుంది. ‘కింద పడవేశారు’ అనేది దిశను నిలుపుతూ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: אִישׁ מַטֵּהוּ
  choice: వారిలో ప్రతి ఒక్కరూ తమ తమ కర్రను
  rationale: 'אִישׁ ఇక్కడ విభజనార్థకంగా వాడబడింది: ప్రతి వ్యక్తి తన సొంత కర్రను పడవేశాడు. తెలుగు సహజత్వం కోసం ‘వారిలో ప్రతి ఒక్కరూ తమ తమ’ అని అనువదించబడింది.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: కర్ర / కర్ర / కర్రలను
  rationale: מַטֶּה అంటే చేతికర్ర లేదా దండం కావచ్చు. ఈ కథనంలోని చేతిలో పట్టుకుని ఉపయోగించే వస్తువుకు ‘కర్ర’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; ఏకవచన-బహువచన భేదాలు నిలుపబడ్డాయి.
- source_word: וַיִּהְיוּ
  choice: మారాయి
  rationale: היה ఇక్కడ పరివర్తన ఫలితాన్ని తెలియజేస్తుంది. ‘మారాయి’ అనే రూపం వస్తువులు మరో రూపం పొందినట్లు సహజంగా తెలియజేస్తుంది.
- source_word: לְתַנִּינִם
  choice: మహాసర్పాలుగా
  rationale: תַּנִּין సాధారణ పాము అనే పదం కంటే విస్తృతమైనది; సందర్భాన్ని బట్టి పెద్ద సర్పాకార జీవి, ఘోర సరీసృపం లేదా సముద్ర మహాజీవిని సూచించవచ్చు. ఈ సూచకక్రియ సందర్భంలో సర్పాకార జీవులు తగినవి; పదంలోని విస్తృతతను కొంత నిలుపడానికి ‘మహాసర్పాలు’ ఎంచుకోబడింది, ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וַיִּבְלַע
  choice: మింగివేసింది
  rationale: בלע అంటే మింగడం లేదా పూర్తిగా లోనికి తీసుకోవడం. ‘మింగివేసింది’ పూర్తి వినియోగాన్ని బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దానికి విడిగా సమాన పదం అవసరం లేదు, విభక్తి ద్వారా భావం వ్యక్తమవుతుంది.
