  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: te
  text: అప్పుడు మోషే ఫరో సమక్షం నుండి బయటికి వెళ్లి, యాహ్వేకు మనవి చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వేకు మనఃపూర్వకంగా ప్రార్థించాడు,” లేదా “యాహ్వేను వేడుకున్నాడు.” హీబ్రూ క్రియ గాఢమైన మనవిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא అనే క్రియ ఇక్కడ ఫరో సమక్షం నుంచి బయటికి వెళ్లడాన్ని సూచిస్తుంది; కథన క్రమాన్నీ స్పష్టమైన కదలికనూ ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: מֵעִם
  choice: ఫరో దగ్గరనుంచి
  rationale: מֵעִם అక్షరార్థంగా ‘తో ఉండటం నుంచి’ అనే భావాన్ని కలిగి, ఫరో సమక్షాన్ని విడిచిపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరనుంచి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు సంబంధించిన బిరుదుకు తెలుగులో ప్రామాణిక రూపం.
- source_word: וַיֶּעְתַּר
  choice: మనవి చేశాడు
  rationale: עתר ఇక్కడ దేవునికి చేసే గాఢమైన ప్రార్థన లేదా వేడుకోలును సూచిస్తుంది. ‘మనవి చేశాడు’ గౌరవప్రదమైన, సహజమైన తెలుగులో ఆ అర్థాన్ని అందిస్తుంది; గాఢతను పాదటిప్పణి వివరిస్తుంది.
- source_word: אֶל
  choice: యెహోవాకు
  rationale: אֶל ప్రార్థన ఎవరిని ఉద్దేశించి చేయబడిందో సూచిస్తుంది. తెలుగులో దత్తివిభక్తి ‘-కు’ సహజంగా ఆ దిశను వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగులో సుపరిచితమైన నామరూపం ‘యెహోవా’ను వాడటం ద్వారా దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: עתר క్రియలోని ప్రార్థన స్వభావం
  choice: మనవి చేశాడు
  alternative: మనఃపూర్వకంగా ప్రార్థించాడు; వేడుకున్నాడు
  rationale: ఈ క్రియ గాఢమైన వేడుకోలును సూచించినా, దాని తీవ్రతను ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా సహజమైన పదబంధాన్ని ఎంచుకుని, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. వచనంలోని కర్తను సందర్భానుసారం స్పష్టంచేయడానికి ‘మోషే’ అని పేర్కొంది; హీబ్రూలో కర్త సర్వనామాత్మక క్రియారూపంలో మాత్రమే ఉంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
