  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַל הָֽ/אַרְבֶּ֗ה עַ֚ל כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יָּ֕נַח בְּ/כֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠/פָנָי/ו לֹא הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔/הוּ וְ/אַחֲרָ֖י/ו לֹ֥א יִֽהְיֶה כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: te
  text: మిడతలు ఐగుప్తు దేశమంతటిమీదికి వచ్చి, ఐగుప్తు దేశపు ప్రతి ప్రాంతంలో[a] వాలాయి. అవి ఎంతో తీవ్రమైనవి; వాటికి ముందెన్నడూ వాటివంటి మిడతలు లేవు, వాటి తరువాత కూడా అలాంటివి ఉండవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఐగుప్తు ప్రతి గెబూల్‌లో’ అని ఉంది. ‘గెబూల్’ అంటే సరిహద్దు లేదా పరిధి అని అర్థం కావచ్చు; ఇక్కడ అది ఐగుప్తు దేశపు ప్రాంతమంతటినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: మీదికి వచ్చి
  rationale: עלה అనే క్రియలోని ‘పైకి రావడం’ అనే దృశ్యాన్ని నిలుపుతూ, మిడతలు దేశాన్ని కమ్మిన సందర్భానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: הָאַרְבֶּה
  choice: మిడతలు
  rationale: హీబ్రూలో ఏకవచన రూపం సమూహార్థకంగా ఉంది; ఆధునిక తెలుగులో ఈ దండును సహజంగా బహువచనంతో వ్యక్తం చేయవచ్చు.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటిమీదికి
  rationale: దేశపు సమస్త విస్తీర్ణాన్ని సూచించే עַל כָּל భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיָּנַח
  choice: వాలాయి
  rationale: మిడతలు వచ్చి నేలమీద లేదా మొక్కలమీద దిగివాలిన భావాన్ని נוח సందర్భానుగుణంగా తెలుపుతుంది.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: ఐగుప్తు సరిహద్దులన్నిటిలో
  rationale: גְּבוּל అనే పదంలోని ‘సరిహద్దు/పరిధి’ భావాన్ని నిలుపుతుంది; ఇక్కడ దేశపు పరిధి అంతటినీ సూచిస్తుంది.
- source_word: כָּבֵד מְאֹד
  choice: ఎంతో భారమైనవిగా
  rationale: హీబ్రూ ‘చాలా భారమైన’ అనే రూపకాన్ని తొలగించకుండా తెలుగులో నిలుపుతుంది; ఇది మిడతల దండు తీవ్రతను, విస్తారతను సూచిస్తుంది.
- source_word: לְפָנָיו ... וְאַחֲרָיו
  choice: వాటికి ముందు ... వాటి తరువాత
  rationale: సమూహార్థకమైన ‘మిడతలు’ను తెలుగులో బహువచన సర్వనామంతో అనుసంధానిస్తూ, కాలపరమైన పోలికను యథాతథంగా ఉంచుతుంది.
- source_word: לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: వాటివంటి మిడతలు ఎన్నడూ లేవు
  rationale: అంతకుముందు అలాంటి మిడతల దండు లేదనే అసమానత వాదనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵן
  choice: వాటి తరువాత కూడా అలాంటివి ఉండవు
  rationale: భవిష్యత్తులోనూ ఇలాంటిది ఉండదనే హీబ్రూ వాక్యపు బలాన్ని, ముందు–తరువాత నిర్మాణాన్ని కాపాడుతుంది.
