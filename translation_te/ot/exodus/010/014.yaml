translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ‘భారమైనవి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, దాని తీవ్రతాభావాన్ని సందర్భమే తెలియజేసేలా ఉంచబడింది.
