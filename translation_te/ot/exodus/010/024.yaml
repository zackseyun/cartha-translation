id: EXO.10.24
reference: Exodus 10:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: te
  text: అప్పుడు ఫరో మోషేను పిలిచి, “మీరు వెళ్లి యాహ్వేను సేవించండి. అయితే మీ మందలు, పశువులు మాత్రం వెనుకే మిగలాలి[a]. మీ చిన్నపిల్లలు[b] కూడా మీతో వెళ్లవచ్చు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విడిచిపెట్టబడాలి.”
    reason: יצג హోఫల్ రూపం పశువులను వెనుక వదిలివేయడం లేదా అవి మిగిలి ఉండడం అనే నిష్క్రియార్థాన్ని తెలియజేస్తుంది.
  - marker: b
    text: లేదా, “మీ పిల్లలు.”
    reason: טַף అనే పదం చిన్నపిల్లలను, విస్తృతంగా ఆధారపడిన పిల్లలను సూచించవచ్చు.
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: ఫరో మోషేను పిలిచి
  rationale: קרא ... אל అనే నిర్మాణం ఈ సందర్భంలో మోషేను పిలిపించి అతనితో మాట్లాడడాన్ని సూచిస్తుంది. సహజమైన తెలుగు కథనశైలిలో ‘మోషేను పిలిచి’ అని అనువదించాం.
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: మీరు వెళ్లి యాహ్వేను సేవించండి
  rationale: עבד యొక్క ప్రాథమిక ‘సేవించు’ భావాన్ని నిలుపుతూ, ఇశ్రాయేలు ఫరోకు కాక యాహ్వేకు సేవ చేయాలనే నిర్గమకాండంలోని పునరావృత అంశాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: רַק
  choice: అయితే ... మాత్రం
  rationale: ఫరో ఇచ్చిన అనుమతిపై విధించిన పరిమితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: మీ మందలు, పశువులు
  rationale: צֹאן చిన్న పశువుల మందలను, בקר పెద్ద పశువులను సూచిస్తాయి. తెలుగు పాఠకులకు సహజంగా ఉండే జంట పదాలను ఎంచుకున్నాం.
- source_word: יֻצָּג
  choice: ఇక్కడే ఉంచబడాలి
  rationale: יצג హోఫల్ రూపంలోని ‘ఉంచబడాలి/వదిలిపెట్టబడాలి’ అనే నిష్క్రియార్థాన్ని నిలుపుతుంది; ‘ఇక్కడే’ సందర్భంలోని వెనుక విడిచి వెళ్లే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גַּם
  choice: కూడా
  rationale: పిల్లలు సైతం వెళ్లడానికి ఫరో అనుమతిస్తున్న అదనపు అంశాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలు
  rationale: טַף సాధారణంగా కుటుంబంలోని చిన్నపిల్లలను లేదా ఆధారపడిన పిల్లలను సూచిస్తుంది; ‘చిన్నపిల్లలు’ ఆ భావాన్ని నేరుగా అందిస్తుంది.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: మీతో వెళ్లవచ్చు
  rationale: రూపపరంగా భవిష్యత్ క్రియ అయినా, ఫరో ఇచ్చే అనుమతి సందర్భంలో తెలుగులో ‘వెళ్లవచ్చు’ సహజంగా ఆ అనుమతి భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా ధ్వన్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: עבד యొక్క ఆరాధనా సందర్భార్థం
  choice: సేవించండి
  alternative: ఆరాధించండి
  rationale: ఈ సందర్భంలో సేవ మరియు ఆరాధన భావాలు రెండూ సాధ్యమైనప్పటికీ, ‘సేవించండి’ అనే పదం మూల క్రియకు దగ్గరగా ఉండి, ఫరో సేవ నుండి యాహ్వే సేవకు మార్పు అనే నిర్గమకాండపు ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ఫరో మాటల్లో బహువచన ఆజ్ఞను ‘మీరు ... సేవించండి’గా, అతని పరిమితిని ‘అయితే ... మాత్రం’గా వ్యక్తం చేశాం. మూలంలోని నిష్క్రియ రూపాన్ని ‘ఉంచబడాలి’తో నిలిపి, అస్పష్టతను పాదటిప్పణిలో సూచించాం.
