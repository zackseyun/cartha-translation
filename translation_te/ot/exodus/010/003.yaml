  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: te
  text: 'మోషే మరియు అహరోను ఫరో సమక్షానికి వెళ్లి అతనితో ఇలా అన్నారు: “హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘నా ఎదుట నిన్ను నీవు తగ్గించుకోవడానికి[a] ఇంకా ఎంతకాలం నిరాకరిస్తావు? నా ప్రజలు నన్ను సేవించడానికి[b] వారిని వెళ్లనివ్వు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు లోబడడానికి.” హీబ్రూ క్రియ దేవుని ఎదుట తగ్గించబడడం లేదా తనను తాను తగ్గించుకోవడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను ఆరాధించడానికి.” హీబ్రూ క్రియలో సేవ చేయడంతోపాటు ఆరాధనాత్మక సేవ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: దగ్గరకు వెళ్లి
  rationale: בוא + אֶל ఇక్కడ ఒకరి సన్నిధికి వెళ్లడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ఫరో గమ్యంగా ఉన్నందున ‘దగ్గరకు వెళ్లి’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: అతనితో ఇలా అన్నారు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ ప్రయోగం; హీబ్రూలోని బహువచన కర్తను నిలుపుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దైవ సందేశాన్ని పరిచయం చేసే దూత సూత్రాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: హెబ్రీయుల దేవుడు
  rationale: ఈజిప్టు సందర్భంలో యాహ్వేను హెబ్రీయులతో సంబంధపెట్టి గుర్తించే నిర్మాణాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: עַד מָתַי
  choice: ఇంకా ఎంతకాలం
  rationale: కొనసాగుతున్న నిరాకరణను సవాలు చేసే హీబ్రూ కాలప్రశ్నకు సహజ తెలుగు సమానం.
- source_word: מֵאַנְתָּ
  choice: నిరాకరిస్తావు
  rationale: రూపపరంగా పూర్తిక్రియ అయినప్పటికీ, పునరావృతమవుతున్న ప్రస్తుత ధిక్కారాన్ని ‘ఎంతకాలం’ అనే ప్రశ్నతో కలిసి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵעָנֹת
  choice: నిన్ను నీవు తగ్గించుకోవడానికి
  rationale: దేవుని ఎదుట తనను తాను తగ్గించుకోవడం అనే సందర్భార్థాన్ని నిలుపుతుంది; కేవలం బాహ్య విధేయతకు పరిమితం చేయదు.
- source_word: מִפָּנַי
  choice: నా ఎదుట
  rationale: ‘నా ముఖము నుండి/నా సన్నిధిలో’ అనే హీబ్రూ ప్రయోగానికి సంక్షిప్తమైన సహజ తెలుగు రూపం.
- source_word: שַׁלַּח
  choice: వెళ్లనివ్వు
  rationale: నిర్గమకాండంలోని పునరావృత విడుదల ఆజ్ఞకు సహజమైన తెలుగు రూపం.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: యాహ్వే తన ప్రజలపై ప్రకటించే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; తెలుగు వాక్యనిర్మాణం కోసం కర్మార్థం తరువాతి ‘వారిని’లో వ్యక్తమైంది.
- source_word: וְיַעַבְדֻנִי
  choice: నన్ను సేవించడానికి
  rationale: עבד యొక్క విస్తృత ‘సేవ చేయడం’ భావాన్ని నిలుపుతూ, ఈ సందర్భంలోని ఆరాధనాత్మక సేవను కూడా కలిగి ఉంటుంది; వావ్ ఇక్కడ సూచించే ఉద్దేశాన్ని ‘చడానికి’ నిర్మాణం తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: לֵעָנֹת యొక్క భావం
  choice: నిన్ను నీవు తగ్గించుకోవడానికి
  alternative: నాకు లోబడడానికి; తగ్గించబడడానికి
  rationale: ఈ క్రియలో తనను తాను తగ్గించుకోవడం లేదా లోబడడం అనే భావపరిధి ఉంది. ప్రధాన పాఠం స్వీయ-తగ్గింపును ఎంచుకుంటూ, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- issue: וְיַעַבְדֻנִי యొక్క భావం
  choice: నన్ను సేవించడానికి
  alternative: నన్ను ఆరాధించడానికి
  rationale: עבד ఆరాధనాత్మక సేవను కలిగి ఉన్నప్పటికీ దాని భావం ‘ఆరాధించు’ కంటే విస్తృతం. అందువల్ల ప్రధాన పాఠంలో ‘సేవించు’ను ఉంచి, ఆరాధన భావాన్ని పాదటిప్పణిలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. దైవ సందేశ సూత్రానికి ‘ఇలా అంటున్నాడు’ను, నిర్గమకాండపు విడుదల ఆజ్ఞకు ‘వెళ్లనివ్వు’ను ఎంచుకున్నాం. పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
