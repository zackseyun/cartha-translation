revisions:
- from: 'మోషే, అహరోనులు ఫరో దగ్గరకు వెళ్లి అతనితో ఇలా అన్నారు: “హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘నా ఎదుట నిన్ను నీవు తగ్గించుకోవడానికి[a] ఇంకా ఎంతకాలం నిరాకరిస్తావు? నా ప్రజలు నన్ను సేవించడానికి[b] వారిని వెళ్లనివ్వు.’”'
  to: 'మోషే మరియు అహరోను ఫరో సమక్షానికి వెళ్లి అతనితో ఇలా అన్నారు: “హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘నా ఎదుట నిన్ను నీవు తగ్గించుకోవడానికి[a] ఇంకా ఎంతకాలం నిరాకరిస్తావు? నా ప్రజలు నన్ను సేవించడానికి[b] వారిని వెళ్లనివ్వు.’”'
  rationale: అహరోను పేరును బహువచనం నుండి ఏకవచనానికి సరిచేసి మూలపాఠంలోని ఇద్దరు నిర్దిష్ట వ్యక్తులను ఖచ్చితంగా చూపించాం. ‘ఫరో సమక్షానికి’ ద్వారా రాజు ఎదుట ప్రవేశించి మాట్లాడిన సందర్భభావాన్ని సహజ తెలుగు శైలిలో వ్యక్తం చేశాం. అర్థం, పాదటిప్పణి గుర్తులు, మరియు పదార్థ ప్రత్యామ్నాయాలు మారలేదు.
