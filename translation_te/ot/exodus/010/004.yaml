source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: te
  text: ఎందుకంటే, నా ప్రజలను వెళ్లనివ్వడానికి నీవు నిరాకరిస్తే, ఇదిగో, రేపు మిడతలను[a] నీ భూభాగంలోకి తీసుకువస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “మిడత” అనే పదం ఏకవచన రూపంలో ఉన్నప్పటికీ, ఇక్కడ అది సమూహార్థకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ఎందుకంటే, ... నిరాకరిస్తే
  rationale: ముందటి హెచ్చరికకు కొనసాగింపుగా ఉన్న కారణార్థక-షరతు సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָאֵן
  choice: నిరాకరిస్తే
  rationale: అసమర్థతను లేదా సంకోచాన్ని కాక, ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడాన్ని సూచిస్తుంది.
- source_word: לְשַׁלֵּחַ
  choice: వెళ్లనివ్వడానికి
  rationale: నిర్గమకాండ సందర్భంలో ప్రజలను విడుదల చేసి వెళ్లనివ్వడమనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַמִּי
  choice: నా ప్రజలను
  rationale: మూలంలోని స్వామ్య ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: రాబోయే చర్యపై గంభీరమైన తక్షణ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: מֵבִיא
  choice: రప్పిస్తాను
  rationale: הִנְנִיతో కూడిన కృదంతం సమీప భవిష్యత్ చర్యను సూచిస్తుంది; మిడతలు ప్రాంతంలోకి వచ్చేలా చేయడమనే కారక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָחָר
  choice: రేపు
  rationale: శిక్ష సంభవించే సమయాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: אַרְבֶּה
  choice: మిడతలను
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నా ఇది సమూహార్థకంగా వాడబడింది; తెలుగులో బహువచనం సహజం.
- source_word: בִּגְבֻלֶךָ
  choice: నీ ప్రాంతంలోకి
  rationale: సరిహద్దులతో నిర్వచితమైన ఆధీన ప్రాంతం అనే భావాన్నీ, రప్పించడం వల్ల కలిగే లోనికి ప్రవేశించే దిశనూ తెలియజేస్తుంది.
