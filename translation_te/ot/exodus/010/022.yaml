source:
  edition: WLC
  text: וַ/יֵּ֥ט מֹשֶׁ֛ה אֶת יָד֖/וֹ עַל הַ/שָּׁמָ֑יִם וַ/יְהִ֧י חֹֽשֶׁךְ אֲפֵלָ֛ה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: te
  text: అప్పుడు మోషే ఆకాశం వైపు[a] తన చెయ్యి చాపాడు. దాంతో ఐగుప్తు దేశమంతటా మూడు రోజులపాటు కటిక చీకటి[b] అలుముకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకం వైపు.’ హీబ్రూ שָּׁמַיִם అనే పదానికి సందర్భాన్ని బట్టి ‘ఆకాశం’ లేదా ‘పరలోకం/పరలోకాలు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గాఢాంధకారం.’ ఇక్కడి హీబ్రూ పదబంధంలో ‘చీకటి’తో పాటు గాఢమైన చీకటిని సూచించే మరో పదం కూడా ఉండి, దాని తీవ్రతను నొక్కిచెబుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: చాపాడు
  rationale: נטה అనే క్రియ చేతిని ఒక దిశగా చాపే చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చెయ్యి చాపాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: יָד యొక్క సాధారణ అర్థం ‘చెయ్యి’; సందర్భంలో ‘చేయి’ కంటే ‘చెయ్యి’ సాధారణ ఆధునిక వాడుకకు అనుకూలం.
- source_word: עַל הַשָּׁמַיִם
  choice: ఆకాశం వైపు
  rationale: చేతిని చాపే ఈ సందర్భంలో עַל దిశను సూచిస్తుంది; שָׁמַיִם ఇక్కడ కనిపించే ఆకాశాన్ని సూచించవచ్చు, అయితే ‘పరలోకం వైపు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַיְהִי
  choice: దాంతో ... అలుముకుంది
  rationale: ఈ రూపం ముందటి చర్య ఫలితంగా ఏర్పడిన స్థితిని ప్రవేశపెడుతుంది; ‘దాంతో’ సంబంధాన్ని సహజంగా చూపుతుంది, ‘అలుముకుంది’ చీకటి వ్యాపించిన భావాన్ని అందిస్తుంది.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: కటిక చీకటి
  rationale: రెండు చీకటి-సంబంధ పదాల కలయిక తీవ్రతను బలపరుస్తుంది; ‘కటిక చీకటి’ సాధారణ పాఠకులకు సహజంగా ఉండి గాఢతను నిలుపుతుంది.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: בְּכָל విస్తృతిని సూచిస్తుంది; ‘దేశమంతటా’ తెలుగులో సహజంగా ‘దేశమంతటిలో/అంతటా’ అనే భావాన్ని ఇస్తుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులపాటు
  rationale: హీబ్రూ కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘పాటు’ జోడించబడింది.
