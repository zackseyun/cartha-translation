  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని ఫలితసంబంధం, చీకటి తీవ్రత, మూడు రోజుల కాలవ్యవధి నిలుపబడ్డాయి.
