- from: 'అతడు వారితో ఇలా అన్నాడు[a]: “నేను మిమ్మల్ని, మీ చిన్నపిల్లలను పంపివేస్తే, యెహోవా నిజంగా మీకు తోడుగా ఉండుగాక! చూడండి[b], కీడు మీ ముఖాల ఎదుటే ఉంది.”'
  to: 'అతడు వారితో ఇలా అన్నాడు[a]: “నేను మిమ్మల్ని, మీ చిన్నపిల్లలను ఎప్పుడైనా పంపివేస్తే, యాహ్వే నిజంగా మీకు తోడుగా ఉండుగాక! చూడండి[b], కీడు మీ ఎదుట ఉంది.”'
