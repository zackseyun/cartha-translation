id: EXO.10.10
reference: Exodus 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు[a]: “నేను మిమ్మల్ని, మీ చిన్నపిల్లలను ఎప్పుడైనా పంపివేస్తే, యాహ్వే నిజంగా మీకు తోడుగా ఉండుగాక! చూడండి[b], కీడు మీ ఎదుట ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మిమ్మల్ని, మీ చిన్నపిల్లలను పంపివేసినప్పుడు యాహ్వే మీకు తోడుగా ఉండుగాక”; ఇది బహుశా వ్యంగ్యంగా పలికిన మాట.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ వాక్యం ద్వంద్వార్థకంగా ఉంది: దీనికి “విపత్తు మీ ఎదుట ఉంది” లేదా “మీ దృష్టిలో—మీ ఉద్దేశంలో—కీడు ఉంది” అనే అర్థాలు ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: యెహోవా నిజంగా మీకు తోడుగా ఉండుగాక
  rationale: జస్సివ్ రూపంలోని ఆశీర్వాద వాక్యబలాన్ని నిలుపుతూ, సందర్భంలో ఫరో పలికిన వ్యంగ్యాన్ని పాఠకుడు గ్రహించగలిగేలా అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచింది.
- source_word: כַּאֲשֶׁר אֲשַׁלַּח
  choice: నేను ... పంపివేస్తే
  rationale: ఈ శత్రుత్వభరిత సందర్భంలో כַּאֲשֶׁר వ్యంగ్య షరతు భావాన్ని కలిగిస్తుంది; తెలుగు ‘పంపివేస్తే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: טַפְּכֶם
  choice: మీ చిన్నపిల్లలను
  rationale: טַף సాధారణంగా చిన్నపిల్లలను సూచిస్తుంది; విస్తృతార్థం గల ‘పిల్లలు’ లేదా ‘ఆధారితులు’ కంటే ఈ సూక్ష్మార్థాన్ని నిలుపుతుంది.
- source_word: רְאוּ
  choice: చూడండి
  rationale: మూలంలోని సాధారణ ఆజ్ఞారూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది హెచ్చరికగా కూడా వినిపిస్తుంది.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: కీడు మీ ముఖాల ఎదుటే ఉంది
  rationale: רָעָה లోని కీడు/హాని/విపత్తు అర్థవ్యాప్తిని పూర్తిగా ఒక దిశలో నిర్ణయించకుండా, נֶגֶד פְּנֵיכֶם అనే స్పష్టమైన శరీరరూపకాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా సూచించింది.
- issue: ఫరో చివరి హెచ్చరికలోని ద్వంద్వార్థం
  choice: కీడు మీ ముఖాల ఎదుటే ఉంది
  alternative: విపత్తు మీ ఎదుట ఉంది / మీ మనసులో కీడు ఉంది
  rationale: హీబ్రూ వాక్యం రాబోయే అపాయం లేదా వారి దుష్ట ఉద్దేశం అనే రెండు దిశలలో అర్థమయ్యే అవకాశం ఉంది; ప్రధాన పాఠం దానిని ఒకే దిశలో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ఫరో వ్యంగ్యాన్ని అతిగా వివరించకుండా సందర్భం ద్వారా వినిపించేలా ఉంచి, చివరి వాక్యంలోని మూలభాషా అస్పష్టతను ప్రధాన పాఠం మరియు పాదటిప్పణిలో సంరక్షించింది.
