id: EXO.10.1
reference: Exodus 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఫరో దగ్గరికి వెళ్లు. ఎందుకంటే నేను అతని హృదయాన్ని, అతని సేవకుల హృదయాలను కఠినపరిచాను[a], నేను ఈ నా సూచకాలను అతని మధ్యలో[b] ఉంచేందుకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: “అతని హృదయాన్ని భారంగా చేశాను.” ఈ నుడికారం యాహ్వే ఫరోను స్పందించని విధంగా కఠినపరిచాడని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థం: “అతని మధ్యలో.” ఇది ప్రత్యేకంగా ఫరోను సూచించవచ్చు; లేదా ఫరోతోపాటు అతని సేవకులు, రాజసభ వర్గాన్ని సూచించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ క్రమాన్ని, ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యానికి సహజమైన పరిచయాన్ని ఇస్తాయి.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వెళ్లు
  rationale: בוא సందర్భానుసారం ‘రా/వెళ్లు/ప్రవేశించు’ అనే దిశార్థాన్ని కలిగి ఉంటుంది. ఫరోను ఎదుర్కొనే ఈ సందర్భంలో ‘దగ్గరికి వెళ్లు’ సహజమైన తెలుగు.
- source_word: הִכְבַּדְתִּי
  choice: కఠినపరిచాను
  rationale: כבד హిఫీల్ రూపం అక్షరార్థంగా ‘భారంగా చేశాను’; హృదయంతో వాడినప్పుడు స్పందించనివిధంగా కఠినపరచడాన్ని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: అతని హృదయాన్ని, అతని సేవకుల హృదయాలను
  rationale: హీబ్రూ ‘హృదయం’ అంతరంగ సంకల్పం, ఆలోచన, స్పందనల కేంద్రాన్ని సూచిస్తుంది. ఏకవచన సమూహప్రయోగాన్ని తెలుగులో సహజంగా బహువచనంగా వ్యక్తం చేశాం.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: ఈ రాజసభ సందర్భంలో పదం ఫరో సేవలో ఉన్నవారిని లేదా అధికారులను సూచించగలదు; ‘సేవకులు’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: ఉంచడానికే
  rationale: ఈ అవ్యయం ఉద్దేశాన్ని తెలియజేస్తుంది. ‘-డానికే’ ప్రయోజనార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹתֹתַי אֵלֶּה
  choice: నా ఈ సూచక క్రియలు
  rationale: స్వామ్యప్రత్యయం, నిర్దేశక పదం రెండింటినీ నిలిపి, అద్భుతమైన దైవ కార్యాలను సూచించే אות భావాన్ని ‘సూచక క్రియలు’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּקִרְבּוֹ
  choice: అతని మధ్యలో
  rationale: మసొరెటిక్ రూపంలోని ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అది ఫరోను మాత్రమేనా, లేక అతని రాజసభ వర్గాన్నంతటినీనా సూచిస్తుందనే సందర్భసిద్ధ అస్పష్టతను పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: ఫరో హృదయాన్ని దేవుడు కఠినపరచడం
  choice: నేను ... హృదయాలను కఠినపరిచాను
  alternative: నేను ... హృదయాలను భారంగా చేశాను / మొండిగా చేశాను
  rationale: క్రియను నేరుగా యాహ్వేకే ఆపాదించే మూలపాఠ్యాన్ని మృదువుచేయలేదు. దైవాధిపత్యం, మానవ బాధ్యతల సంబంధాన్ని ఈ వచనం చెప్పినదానికంటే మించి పరిష్కరించకుండా దాని వేదాంత ఉద్రిక్తతను నిలిపాం.
- issue: בְּקִרְבּוֹ యొక్క ఏకవచన సూచన
  choice: అతని మధ్యలో
  alternative: వారి మధ్యలో / అతని పరివారంలో
  rationale: వ్యాకరణపరమైన ఏకవచనాన్ని నిలిపి, అది ఫరో వ్యక్తిని గానీ అతనితో కూడిన రాజసభ వర్గాన్ని గానీ సూచించవచ్చనే అస్పష్టతను పాదసూచికకు వదిలాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి వాడాం. దైవ నామాన్ని ‘యాహ్వే’గా నిలిపాం; మూలంలోని కారణం–ఉద్దేశం సంబంధం, దైవ కర్తృత్వం, చివరి ఏకవచనంలోని అస్పష్టతలను కాపాడాం.
