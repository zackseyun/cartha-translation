  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: te
  text: కాని యాహ్వే ఫరో హృదయాన్ని కఠినపరిచాడు[a], మరియు అతడు ఇశ్రాయేలు కుమారులను[b] వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరో హృదయాన్ని దృఢపరిచాడు’ లేదా ‘ఫరో హృదయాన్ని బలపరిచాడు’; హెబ్రీయ క్రియకు అక్షరార్థంగా ‘బలంగా/దృఢంగా చేయడం’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలీయులు’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానం’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: కఠినపరిచాడు
  rationale: חזק అనే క్రియకు మూలంగా ‘బలపరచడం/దృఢపరచడం’ అనే భావం ఉన్నా, నిర్గమకాండంలోని ఫరో హృదయానికి సంబంధించిన పునరావృత సూత్రంలో ‘కఠినపరిచాడు’ అనేది సహజమైన తెలుగు ప్రయోగం; అది అతని ప్రతిఘటన స్థిరపడిన కథనార్థాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: לֵב
  choice: హృదయం
  rationale: లేబ్ అనేది సంకల్పం, మనోవైఖరి, అంతరంగ నిర్ణయం వంటి భావాలను కలిగిన హెబ్రీయ idiom; ‘హృదయం’ దాని రూపకాన్ని కాపాడుతుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు వాడే బిరుదుకు తెలుగులో సాధారణమైన లిప్యంతరీకరణ.
- source_word: וְלֹא שִׁלַּח
  choice: వెళ్లనివ్వలేదు
  rationale: שלח మూలార్థం ‘పంపడం’ అయినా, ఇశ్రాయేలీయుల విడుదల సందర్భంలో ‘వెళ్లనివ్వలేదు’ సహజమైన, సందర్భోచితమైన తెలుగు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీయ కుటుంబసంబంధ పదబంధాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడటంలో దేవుని క్రియ
  choice: యెహోవా ఫరో హృదయాన్ని కఠినపరిచాడు
  alternative: యెహోవా ఫరో హృదయాన్ని దృఢపరిచాడు / బలపరిచాడు
  rationale: హెబ్రీయ వాక్యం ఈ క్రియను యెహోవాకే స్పష్టంగా ఆపాదిస్తుంది. దైవ క్రియను మృదువుగా మార్చకుండా, మానవ బాధ్యతతో దాని సంబంధాన్ని ఈ వచనానికి మించి పరిష్కరించకుండా ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘అందువల్ల’ అనేది వరుసగా కలిసిన హెబ్రీయ క్రియల మధ్య సందర్భసిద్ధ ఫలిత సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది; దైవ క్రియకు సంబంధించిన మూలపాఠంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
