id: EXO.10.2
reference: Exodus 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: te
  text: మీ కుమారునికీ మీ మనుమనికీ, నేను ఐగుప్తుతో ఎంత కఠినంగా వ్యవహరించానో[a], వారి మధ్య నేను ఉంచిన నా సూచకాలను మీరు చెప్పడానికి, అలాగే నేనే యహ్వే అని మీరు తెలుసుకోవడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఐగుప్తును ఎలా ఎగతాళిపాలు చేశానో.” హీబ్రూ క్రియ కఠినంగా వ్యవహరించడంతోపాటు ఐగుప్తును అవమానపరచడాన్ని కూడా నొక్కి చెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అప్పుడు నేనే యహ్వే అని మీరు తెలుసుకుంటారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: చెప్పడానికి ... తెలుసుకోవడానికి
  rationale: ముందున్న దైవ కార్యాల ఉద్దేశాన్ని తెలిపే హీబ్రూ ప్రయోజనార్థక భావాన్ని తెలుగులో సహజమైన క్రియార్థక రూపాలతో కొనసాగించింది.
- source_word: תְּסַפֵּר
  choice: వివరించి చెప్పడానికి
  rationale: పీఏల్ రూపం తరువాతి తరాలకు జరిగిన సంగతులను కథనంగా చెప్పడం లేదా వివరించడం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּאָזְנֵי
  choice: వినిపించేలా
  rationale: అక్షరార్థంగా ‘చెవుల్లో’ అనే హీబ్రూ నుడికారాన్ని అసహజంగా అనువదించకుండా, వారు వినేలా చెప్పడం అనే భావాన్ని సహజ తెలుగులో నిలిపింది.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: మీ కుమారునికీ మీ మనుమనికీ
  rationale: ‘మీ కుమారుడు, మీ కుమారుని కుమారుడు’ అనే తరాల భావాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: הִתְעַלַּלְתִּי
  choice: నేను ... ఎంత కఠినంగా వ్యవహరించానో
  rationale: ఐగుప్తుపై దేవుని తీవ్రమైన, అవమానకరమైన తీర్పు చర్యను ప్రధాన పాఠంలో స్పష్టంగా తెలుపుతుంది; ఎగతాళిపాలు చేయడం అనే సాధ్యమైన ఛాయను పాదటిప్పణిలో ఉంచింది.
- source_word: בְּמִצְרַיִם
  choice: ఐగుప్తుతో
  rationale: ఎంచుకున్న తెలుగు క్రియతో సహజంగా సరిపోతూ, దేవుని చర్యకు ఐగుప్తు లక్ష్యమని తెలియజేస్తుంది.
- source_word: אֹתֹתַי
  choice: నా సూచక కార్యాలు
  rationale: אות యొక్క ‘సూచన/గుర్తు’ భావాన్ని నిలుపుతూ, ఇక్కడ దేవుడు చేసిన కార్యాలను సూచించే సహజ తెలుగు పదబంధాన్ని ఉపయోగించింది.
- source_word: שַׂמְתִּי בָם
  choice: వారి మధ్య నేను ఉంచిన
  rationale: ‘ఉంచాను/నిలిపాను’ అనే మూల క్రియ యొక్క స్పష్టమైన రూపకాన్ని నిలిపింది; బహువచన ప్రత్యయం ఐగుప్తీయులను సూచిస్తుందని సందర్భానుసారంగా ‘వారి’ అని ఇచ్చింది.
- source_word: וִידַעְתֶּם
  choice: మీరు తెలుసుకోవడానికి
  rationale: ప్రారంభంలోని ప్రయోజనార్థక నిర్మాణాన్ని కొనసాగించే పఠనాన్ని ప్రధాన పాఠంలో నిలిపింది; భవిష్యత్ ఫలితార్థక పఠనాన్ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: ఐగుప్తుపట్ల దేవుని చర్యను తెలిపే הִתְעַלַּלְתִּי
  choice: నేను ఐగుప్తుతో ఎంత కఠినంగా వ్యవహరించానో
  alternative: నేను ఐగుప్తును ఎలా ఎగతాళిపాలు చేశానో
  rationale: ఈ క్రియ తెగుళ్ల ద్వారా జరిగిన కఠిన తీర్పునూ అవమానాన్నీ సూచించగలదు. ప్రధాన పాఠం తీర్పు తీవ్రతను ముందుకు తెస్తుంది; అవమాన ఛాయను పాదటిప్పణి కాపాడుతుంది.
- issue: וִידַעְתֶּם లోని ప్రయోజనం లేదా ఫలితం
  choice: నేనే యహ్వే అని మీరు తెలుసుకోవడానికి
  alternative: అప్పుడు నేనే యహ్వే అని మీరు తెలుసుకుంటారు
  rationale: לְמַעַן ప్రారంభించిన ప్రయోజన నిర్మాణం చివరి ఉపవాక్యానికీ వర్తించడం సహజం; అయితే దీనిని భవిష్యత్ ఫలితంగా గ్రహించే అవకాశం కూడా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడింది. ‘చెవుల్లో’ అనే యాంత్రిక అనువాదానికి బదులు ‘వినిపించేలా’ అని సహజీకరించింది; దైవనామాన్ని ‘యహ్వే’గా నిలిపింది.
