revisions:
- from: మీ కుమారునికీ మీ మనుమనికీ వినిపించేలా, నేను ఐగుప్తుతో ఎంత కఠినంగా వ్యవహరించానో[a], వారి మధ్య నేను ఉంచిన నా సూచక కార్యాలనూ మీరు వివరించి చెప్పడానికి, అలాగే నేనే యహ్వే అని మీరు తెలుసుకోవడానికి[b].
  to: మీ కుమారునికీ మీ మనుమనికీ, నేను ఐగుప్తుతో ఎంత కఠినంగా వ్యవహరించానో[a], వారి మధ్య నేను ఉంచిన నా సూచకాలను మీరు చెప్పడానికి, అలాగే నేనే యహ్వే అని మీరు తెలుసుకోవడానికి[b].
  rationale: 'The revision removes the displaced ‘వినిపించేలా’ construction and makes the two objects of ‘recount’ clear and parallel: God’s harsh treatment of Egypt and his signs among them. It also renders אות more directly as ‘సూచకాలు,’ without adding an interpretive noun. The purposeful reading of the final clause and both existing footnote alternatives are retained.'
