id: EXO.10.12
reference: Exodus 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “మిడతల విషయమై[a] ఐగుప్తు దేశం మీద నీ చెయ్యి చాపు; అప్పుడు అవి ఐగుప్తు దేశం మీదికి వచ్చి, వడగండ్లు మిగిల్చిన దేశంలోని ప్రతి మొక్కనూ తినివేస్తాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా ‘మిడత విషయంలో/మిడతను ఉద్దేశించి’ అని గ్రహించవచ్చు. ఇక్కడి ఉపసర్గ భావం కష్టమైనది; ‘మిడతల మీదికి’ లేదా ‘మిడతలకు విరోధంగా’ అనే అనువాదాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: נְטֵה יָדְךָ
  choice: నీ చెయ్యి చాపు
  rationale: נטה అనే ఆజ్ఞారూపానికి ‘చాపు’ సహజమైన తెలుగు సమానార్థకం; יָדְךָను నేరుగా ‘నీ చెయ్యి’గా అనువదించాం.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం మీద
  rationale: עַל యొక్క ప్రాదేశిక భావాన్నీ, אֶרֶץ అనే ‘దేశం/భూమి’ భావాన్నీ నిలిపి, వాక్యంలో పునరావృతమైన పదబంధాన్ని ఒకే విధంగా అనువదించాం.
- source_word: בָּאַרְבֶּה
  choice: మిడతల విషయంగా
  rationale: ב ఉపసర్గ ఇక్కడ అసాధారణంగా, అర్థనిర్ణయం కష్టంగా ఉంది. సంజ్ఞకు సంబంధించిన లక్ష్యం లేదా విషయాన్ని సూచించే విస్తృత భావాన్ని ‘విషయంగా’ నిలుపుతుంది; ‘మిడతలకు విరోధంగా’ వంటి అతినిర్ణయాన్ని నివారిస్తుంది.
- source_word: אַרְבֶּה ... וְיַעַל ... וְיֹאכַל
  choice: మిడతలు ... అవి ... వచ్చి ... తినివేయాలి
  rationale: హీబ్రూలో నామవాచకమూ క్రియలూ ఏకవచనంలో ఉన్నా, אַרְבֶּה ఇక్కడ మిడతల గుంపును సమష్టిగా సూచిస్తుంది. తెలుగులో సహజంగా బహువచనం వాడాం.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: దేశంలోని ప్రతి మొక్కనూ
  rationale: עֵשֶׂב ఇక్కడ గడ్డి మాత్రమే కాకుండా వృక్షసంపదను విస్తృతంగా సూచిస్తుంది; ‘ప్రతి మొక్క’ సాధారణ పాఠకులకు స్పష్టంగా, సందర్భానికి తగినట్లు ఉంటుంది.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: వడగండ్లు మిగిల్చినదంతా
  rationale: הִשְׁאִיר యొక్క ‘మిగిల్చు/వదిలిపెట్టు’ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, ముందటి వడగండ్ల విపత్తుతో సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక నామం יהוה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఇది మూలపాఠం చెప్పేదానికంటే అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఐగుప్తు’ బైబిలు సందర్భంలో స్థిరపడిన తెలుగు స్థలనామం. మూలంలోని మిడతల సమష్టి ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంగా వ్యక్తపరిచాం; క్లిష్టమైన בָּאַרְבֶּהను పాదటిప్పణితో తెరిచి ఉంచాం.
