  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని సరళమైన ఫలిత వాక్యాన్ని నిలుపుతూ ‘చూడలేకపోయారు’ వంటి అదనపు వ్యాఖ్యానాన్ని నివారించాం. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
