source:
  edition: WLC
  text: לֹֽא רָא֞וּ אִ֣ישׁ אֶת אָחִ֗י/ו וְ/לֹא קָ֛מוּ אִ֥ישׁ מִ/תַּחְתָּ֖י/ו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽ/לְ/כָל בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּ/מוֹשְׁבֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: te
  text: వారు ఒకరినొకరు చూడలేదు[a]; మూడు రోజులపాటు ఎవ్వరూ తమ చోటు నుండి లేవలేదు. అయితే ఇశ్రాయేలీయులందరి నివాసాల్లో వెలుగు ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో అక్షరార్థంగా, “ఒకడు తన సహోదరుణ్ణి చూడలేదు.” ఇది పరస్పరార్థక ప్రయోగం: “వారు ఒకరినొకరు చూడలేదు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: ఒకరినొకరు చూడలేదు
  rationale: אִישׁ אֶת־אָחִיו అనే హీబ్రూ ప్రయోగం పరస్పరార్థకమైనది. సందర్భంలో ‘సోదరుణ్ణి’ అని అక్షరార్థంగా కాకుండా, ఒకరినొకరు చూడలేదనే భావం సహజంగా వ్యక్తమవుతుంది; ‘చూడలేకపోయారు’ అనేది మూలంలో స్పష్టంగా లేని సామర్థ్య భావాన్ని చేర్చుతుంది.
- source_word: אִישׁ ... לֹא קָמוּ
  choice: ఎవ్వరూ ... లేవలేదు
  rationale: אִישׁ ఇక్కడ పంపిణీ మరియు సాధారణార్థంలో ఉంది. ‘ఎవ్వరూ’ అనేది లింగాన్ని అనవసరంగా పరిమితం చేయకుండా ప్రతివ్యక్తినీ సూచిస్తుంది.
- source_word: קָמוּ
  choice: లేవలేదు
  rationale: קום యొక్క సాధారణ భావం ‘లేచుట’. తెలుగు కథన శైలిలో ‘లేవలేదు’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: מִתַּחְתָּיו
  choice: తమ చోటు నుండి
  rationale: అక్షరార్థంగా ‘తన కిందనుండి’ అయినా, ఇది వ్యక్తి ఉన్న స్థలం నుండి కదలడాన్ని సూచించే ప్రయోగం. బహువచన తెలుగు వాక్యంలో ‘తమ చోటు నుండి’ సహజంగా సరిపోతుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా తెలియజేయడానికి ‘రోజులపాటు’ వాడబడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరికీ
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది వయస్సు లేదా పురుషులను మాత్రమే కాకుండా జాతి-సమాజ సమూహాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం. לְכָל లోని సమగ్రతను ‘అందరికీ’ నిలుపుతుంది.
- source_word: הָיָה אוֹר
  choice: వెలుగు ఉంది
  rationale: హీబ్రూ నిర్మాణం వారికి వెలుగు అందుబాటులో ఉండడాన్ని సూచిస్తుంది. తెలుగులో ‘వెలుగు ఉంది’ మూల రూపానికీ సందర్భానికీ సన్నిహితంగా ఉంటుంది.
- source_word: בְּמֹשְׁבֹתָם
  choice: వారి నివాస స్థలాల్లో
  rationale: מוֹשָׁב నివాసస్థలం లేదా స్థావరాన్ని సూచించగలదు. ఈ సందర్భంలో బహువచన ‘నివాస స్థలాల్లో’ అర్థాన్ని స్పష్టంగా ఉంచుతూ, ఇళ్లు మాత్రమే అని అనవసరంగా కుదించదు.
