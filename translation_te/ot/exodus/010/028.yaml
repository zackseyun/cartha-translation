source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: te
  text: 'అప్పుడు ఫరో అతనితో ఇలా అన్నాడు: “నా దగ్గర నుంచి వెళ్లిపో. జాగ్రత్తగా ఉండు; ఇక మళ్లీ నా ముఖం చూడకు. ఎందుకంటే నీవు నా ముఖం చూసే రోజున చనిపోతావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: అప్పుడు ఫరో అతనితో ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. לוֹను ‘అతనితో’గా స్పష్టంగా ఉంచింది.
- source_word: לֵךְ מֵעָלָי
  choice: నా దగ్గర నుంచి వెళ్లిపో
  rationale: తీవ్రమైన పంపివేత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నా సన్నిధి నుంచి’ అనడం మూలంలోని సాధారణ ప్రత్యక్ష బెదిరింపును అనవసరంగా మతపరమైన శైలికి మళ్లించవచ్చు.
- source_word: הִשָּׁמֶר לְךָ
  choice: జాగ్రత్త!
  rationale: నిఫాల్ ఆజ్ఞారూపం మరియు నైతిక దత్తివు కలిగిన హెచ్చరికను సంక్షిప్తంగా, బెదిరింపు ధోరణితో అందిస్తుంది.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: ఇక మళ్లీ నా ముఖం చూడకు
  rationale: יסף + క్రియానామం అనే హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానం. పదక్షరంగా ‘చూడటానికి మరింత చేర్చకు’ అనడం తెలుగులో అసహజం.
- source_word: פָּנַי
  choice: నా ముఖం
  rationale: ‘సన్నిధి’ అనే భావం సాధ్యమైనప్పటికీ, వాక్యంలో రెండుసార్లు వచ్చే ‘ముఖం’ అనే రూపకాన్ని మరియు వాక్చాతుర్య పునరుక్తిని నిలుపుతుంది.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: నీవు నా ముఖం చూసే రోజున
  rationale: בְּיוֹםను ‘రోజున’గా నిలుపుతూ, క్రియానామ నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా మార్చింది.
- source_word: תָּמוּת
  choice: తప్పకుండా చనిపోతావు
  rationale: హెబ్రీ అసంపూర్ణ క్రియ ఇక్కడ ప్రత్యక్ష మరణ బెదిరింపును వ్యక్తం చేస్తుంది; ‘తప్పకుండా’ దాని నిశ్చితమైన హెచ్చరిక స్వరాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ ప్రత్యక్షమైన కథన శైలి. ఫరో బెదిరింపు తీవ్రతను కాపాడుతూ పురాతన లేదా కృత్రిమ పదక్షర నిర్మాణాలను నివారించింది. ‘ముఖం’ అనే హెబ్రీ ప్రతిమను రెండు చోట్లా నిలిపింది.
