id: EXO.10.13
reference: Exodus 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: te
  text: అప్పుడు మోషే ఐగుప్తు దేశంపై తన కర్రను చాపాడు. యాహ్వే ఆ రోజంతా, ఆ రాత్రంతా తూర్పు గాలిని దేశం మీదుగా నడిపించాడు[a]. తెల్లవారేసరికి ఆ తూర్పు గాలి మిడతలను మోసుకొచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తూర్పు నుండి వీచే గాలి.’
    reason: רוּחַ קָדִים అనే హీబ్రూ పదబంధం సాధారణంగా ‘తూర్పు గాలి’ అని అర్థం; ‘తూర్పు నుండి వీచే గాలి’ దిశను స్పష్టంగా తెలిపే సముచిత ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיֵּט
  choice: చాపాడు
  rationale: נטה అనే క్రియకు ‘చాపడం/విస్తరించడం’ అనే భావం ఉంది; చేతికర్రతో చేసిన సంకేతానికి ‘చాపాడు’ సహజమైన తెలుగు.
- source_word: מַטֵּהוּ
  choice: తన చేతికర్రను
  rationale: מַטֶּה ఇక్కడ మోషే ఉపయోగించిన కర్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చేతికర్ర’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం మీదికి
  rationale: చేతికర్రను ఒక దేశం వైపు దాని మీదుగా చాపిన కదలికను ‘మీదికి’ సహజంగా తెలియజేస్తుంది.
- source_word: נִהַג
  choice: వీచేలా చేశాడు
  rationale: נהג యొక్క నడిపించడం/తోలడం అనే కారణార్థక భావాన్ని గాలికి సహజమైన తెలుగులో ‘వీచేలా చేశాడు’గా అందించింది.
- source_word: רוּחַ קָדִים
  choice: తూర్పు గాలి
  rationale: ఈ పదబంధం తూర్పు దిశ నుంచి వచ్చే గాలిని సూచిస్తుంది; ‘తూర్పు గాలి’ సంక్షిప్తమైన సహజ తెలుగు ప్రయోగం.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה
  choice: ఆ రోజంతా, రాత్రంతా
  rationale: రెండు కాలవ్యవధుల సంపూర్ణతను పునరుక్తితో నిలుపుతూ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַבֹּקֶר הָיָה
  choice: తెల్లవారేసరికి
  rationale: ఉదయం వచ్చినప్పటి కథన మార్పును సహజంగా తెలియజేస్తూ, రాత్రంతా జరిగిన చర్య ఫలితాన్ని తరువాతి వాక్యంతో కలుపుతుంది.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: మిడతలను మోసుకొచ్చింది
  rationale: נשא యొక్క ‘మోయడం’ భావాన్నీ, గాలి వాటిని అక్కడికి తీసుకువచ్చిన ఫలితాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: הָאַרְבֶּה
  choice: మిడతలను
  rationale: హీబ్రూలో ఏకవచన రూపం సమూహార్థకంగా ఉంది; తెలుగులో తెగులుగా వచ్చిన కీటక సమూహానికి బహువచనం సహజం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; దీనివల్ల మూలంలోని ప్రత్యేక నామ స్వభావం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, కార్య-ఫలిత సంబంధాన్ని స్పష్టంగా ఉంచింది; ‘తెల్లవారేసరికి’ అనే రూపం రాత్రంతా వీచిన గాలి ఉదయానికి మిడతలను తెచ్చిన కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
