revisions:
- from: అప్పుడు మోషే తన చేతికర్రను ఐగుప్తు దేశం మీదికి చాపాడు. యాహ్వే ఆ రోజంతా, రాత్రంతా దేశం మీద తూర్పు గాలి[a] వీచేలా చేశాడు. తెల్లవారేసరికి ఆ తూర్పు గాలి మిడతలను మోసుకొచ్చింది.
