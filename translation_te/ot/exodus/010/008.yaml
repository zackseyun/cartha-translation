id: EXO.10.8
reference: Exodus 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: te
  text: మోషేను, అహరోనును తిరిగి ఫరో వద్దకు తీసుకువచ్చారు.[a] అతడు వారితో, “వెళ్లి మీ దేవుడైన యాహ్వేను సేవించండి. వెళ్లేవారు ఎవరు ఎవరు?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో, “ఎవరు మరియు ఎవరు వెళ్లేవారు?”—వెళ్లడానికి అనుమతించబడే వ్యక్తులు ఎవరో కచ్చితంగా గుర్తించమనే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: తిరిగి తీసుకొచ్చారు
  rationale: שׁוב హోఫల్ రూపంలోని కారణార్థక నిష్క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కర్తను మూలపాఠంలాగే పేర్కొనదు.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి
  rationale: אֶל సూచించే గమ్యదిశను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְכוּ עִבְדוּ
  choice: వెళ్లి ... సేవించండి
  rationale: రెండు ఆజ్ఞార్థక క్రియల భావాన్ని నిలుపుతుంది. עבד యొక్క విస్తృతమైన సేవాభావాన్ని ‘ఆరాధించండి’ అని సంకుచితం చేయకుండా ‘సేవించండి’గా అనువదించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన స్వామ్యార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִי וָמִי הַהֹלְכִים
  choice: వెళ్లేవారు ఎవరెవరు?
  rationale: అక్షరార్థంగా ‘ఎవరు మరియు ఎవరు’ అనే హెబ్రీ ప్రయోగం వెళ్లబోయే వ్యక్తుల ఖచ్చితమైన గుర్తింపును అడుగుతుంది. ‘ఎవరెవరు?’ తెలుగులో అదే పంపిణీ/వివరణ కోరే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా పేరుగానే ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: עבד యొక్క ఆరాధనా సందర్భార్థం
  choice: సేవించండి
  alternative: ఆరాధించండి
  rationale: ఈ సందర్భంలో దేవునికి చేసే సేవలో ఆరాధన ఉన్నప్పటికీ, మూలపదం యొక్క విస్తృత భావాన్ని నిలుపుటకు ‘సేవించండి’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హెబ్రీ వాక్యంలోని నిష్క్రియ నిర్మాణం, దైవనామం, ‘ఎవరు మరియు ఎవరు’ అనే ప్రశ్న యొక్క ప్రత్యేకత సాధ్యమైనంత సహజంగా నిలుపబడ్డాయి.
