revisions:
- from: కాబట్టి మోషేను, అహరోనును ఫరో దగ్గరికి తిరిగి తీసుకొచ్చారు. అతడు వారితో, “వెళ్లి మీ దేవుడైన యెహోవాను సేవించండి. వెళ్లేవారు ఎవరెవరు?” అని అడిగాడు.
  to: మోషేను, అహరోనును తిరిగి ఫరో వద్దకు తీసుకువచ్చారు.[a] అతడు వారితో, “వెళ్లి మీ దేవుడైన యాహ్వేను సేవించండి. వెళ్లేవారు ఎవరు ఎవరు?” అన్నాడు.
  rationale: The revision removes added logical emphasis, renders the divine name in accordance with the POB Yahweh policy, and follows the Hebrew speech verb more closely. It retains the indefinite passive construction, the broad sense of serving God, and the plural/distributive inquiry of מִי וָמִי. An adapted footnote preserves the underlying Hebrew idiom and its audit-trail anchor.
