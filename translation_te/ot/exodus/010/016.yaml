id: EXO.10.16
reference: Exodus 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: te
  text: అప్పుడు ఫరో తొందరగా మోషేను అహరోనును పిలిపించాడు. అతడు, “నేను మీ దేవుడైన యాహ్వేకు విరోధంగాను, మీకు విరోధంగాను పాపం చేశాను” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: తొందరపడి
  rationale: מהר అనే క్రియ త్వరగా చర్య తీసుకోవడాన్ని సూచిస్తుంది. ‘తొందరపడి’ సందర్భంలోని అత్యవసరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לִקְרֹא
  choice: పిలిపించడానికి
  rationale: ఇక్కడ ఫరో మోషే, అహరోనులను తన సమక్షానికి రప్పించమని ఆజ్ఞాపించిన భావం ఉంది; ‘పిలిపించడానికి’ ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: నిర్గమకాండమంతటా ఈజిప్టు రాజుకు వాడే బిరుదుకు ప్రామాణిక తెలుగు రూపం.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: మోషేను, అహరోనును
  rationale: తెలుగులో ‘పిలిపించు’ అనే సకర్మక క్రియతో కర్మవిభక్తి సహజం; ఇద్దరి పేర్లనూ స్పష్టంగా ఉంచుతుంది.
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని ముగించే సహజమైన ఆధునిక తెలుగు కథన నిర్మాణం.
- source_word: חָטָאתִי
  choice: నేను … పాపం చేశాను
  rationale: חטא యొక్క నైతిక, ఆధ్యాత్మిక బలాన్ని తగ్గించకుండా నేరుగా అనువదిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు … విరోధంగా
  rationale: חטא తరువాత ל బాధిత పక్షాన్ని సూచిస్తుంది. తెలుగులో ‘విరోధంగా పాపం చేయడం’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా మార్చకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష రూపమైన ‘యెహోవా’గా అందిస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: రెండవ పురుష బహువచన ప్రత్యయాన్ని నిలుపుతూ, యెహోవా మోషే మరియు అహరోనుల దేవుడని ఫరో చెప్పిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְלָכֶם
  choice: మీకు విరోధంగా
  rationale: బహువచన ‘మీకు’ మోషే, అహరోను ఇద్దరినీ సూచిస్తుంది; ముందున్న ‘పాపం చేశాను’తో కలిపి అపరాధం చేసిన పక్షాన్ని తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు పరిచితమైన దైవనామ రూపాన్ని ఉంచాం.
- issue: ఫరో ఒప్పుకోలు—ל అనే విభక్తి సంబంధం
  choice: యెహోవాకు, మీకు విరోధంగా పాపం చేశాను
  alternative: యెహోవాకు, మీకు పాపం చేశాను
  rationale: חטאతో వచ్చిన ל అపరాధం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది. ‘విరోధంగా’ అనే పదం ఆ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; ‘మీ దేవుడు’ అనే రెండవ పురుష బహువచనాన్ని ‘మన దేవుడు’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని వేగం, ఫరో ఒప్పుకోలు, ‘మీ దేవుడు’ అనే దూరభావం నిలుపబడ్డాయి.
