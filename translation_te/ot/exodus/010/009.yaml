id: EXO.10.9
reference: Exodus 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “మా చిన్నవారితోను మా పెద్దవారితోను వెళ్తాం; మా కుమారులతోను మా కుమార్తెలతోను, మా చిన్న పశువుల మందలతోను మా పెద్ద పశువుల మందలతోను వెళ్తాం. ఎందుకంటే మేము యెహోవాకు పండుగ జరపాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: మా యువకులతో, మా వృద్ధులతో
  rationale: వయస్సు పరంగా సమాజమంతటినీ సూచించే జతపదాలను సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: మా గొర్రెల మందలతో, మా పశువుల మందలతో
  rationale: צֹאן చిన్న పశువుల మందను, בָּקָר పెద్ద పశువులను సూచిస్తాయి; సందర్భంలో స్పష్టంగా, సహజంగా ఉండేందుకు ఈ భేదాన్ని వ్యక్తం చేసింది.
- source_word: חַג
  choice: పండుగ జరపాలి
  rationale: హీబ్రూ పదం యెహోవా గౌరవార్థం జరిపే ధార్మిక పండుగను సూచిస్తుంది; తెలుగు క్రియతో కలిపి సహజంగా అనువదించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ప్రతిబింబించింది.
theological_decisions:
- issue: כִּי חַג יְהוָה לָנוּ యొక్క భావం
  choice: ఎందుకంటే మేము యెహోవాకు పండుగ జరపాలి
  alternative: ఎందుకంటే యెహోవాకు మాకు పండుగ ఉంది
  rationale: హీబ్రూ నామవాచక వాక్యంలోని బాధ్యత/అవసర భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో తెలిపింది; ఇది పండుగ యెహోవాకు అంకితమైనదనే సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూలోని పునరుక్త ‘వెళ్తాం’ నిర్మాణాన్ని వాక్యలయంతో సహా నిలిపింది.
