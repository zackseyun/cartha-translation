  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: te
  text: యాహ్వే అతి బలమైన సముద్రపు గాలిని మళ్లించాడు.[a] అది మిడతలను ఎత్తుకుపోయి రెల్లుల సముద్రంలోకి[b] తోసివేసింది. ఐగుప్తు దేశమంతటిలో ఒక్క మిడత కూడా మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సముద్రపు గాలి’; ఐగుప్తు సందర్భంలో ఇది పడమటి గాలిని సూచించి ఉండవచ్చు.
    reason: మూలపాఠ్యంలోని ‘సముద్రపు గాలి’ అనే పదబంధాన్ని నిలుపుతూ, సందర్భానుసారమైన దిశా అర్థాన్ని తెలియజేయడానికి.
  - marker: b
    text: సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదిస్తారు.
    reason: సుపరిచితమైన సంప్రదాయ స్థలనామాన్ని పాఠకులకు సూచించడానికి.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יְהוָה
  choice: యెహోవా గాలి దిశను మార్చి... రప్పించాడు
  rationale: הפך అంటే ‘తిప్పు/మార్చు’. గాలి సందర్భంలో తెలుగులో సహజంగా ఉండేందుకు ‘గాలి దిశను మార్చి’ అని, తరువాతి గాలి పదబంధంతో కలిపి ‘రప్పించాడు’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: רוּחַ יָם חָזָק מְאֹד
  choice: అతి బలమైన పడమటి గాలి
  rationale: רוּחַ יָם అక్షరార్థంగా ‘సముద్రపు గాలి’; ఐగుప్తు భౌగోళిక సందర్భంలో సముద్రం వైపు నుంచి వచ్చే పడమటి గాలిని సూచిస్తుంది. పాఠకునికి దిశ స్పష్టంగా ఉండేందుకు ప్రధాన పాఠ్యంలో ‘పడమటి గాలి’ అని ఇచ్చి, మూల రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: అది మిడతలను ఎత్తుకుపోయి
  rationale: గాలి మిడతల దండును పైకెత్తి తీసుకుపోయిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְקָעֵהוּ
  choice: తోసివేసింది
  rationale: תקע ఇక్కడ బలవంతంగా ఒక చోటికి నెట్టడం లేదా తోలడం అనే భావంలో ఉంది. ఏకవచన ప్రత్యయం మిడతల దండును సమష్టిగా సూచించినా, తెలుగులో ‘మిడతలను’ అనుసరించి బహువచన భావాన్ని కొనసాగించాం.
- source_word: יָמָּה סּוּף
  choice: రెల్లుల సముద్రంలోకి
  rationale: ים סוף అనే హీబ్రూ స్థలనామంలోని ‘సూఫ్’కు ‘రెల్లు’ అనే అర్థాన్ని ప్రతిబింబిస్తుంది; సంప్రదాయ ‘ఎర్ర సముద్రం’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: ఒక్క మిడత కూడా మిగలలేదు
  rationale: ‘ఒకటి కూడా మిగలలేదు’ అనే మూలంలోని సంపూర్ణతా ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: ఐగుప్తు ప్రాంతమంతటిలో
  rationale: גבול ఇక్కడ కేవలం సరిహద్దు రేఖను కాక దేశపు మొత్తం పరిధిని సూచిస్తుంది; అందువల్ల ‘ప్రాంతమంతటిలో’ సరైన సహజ రూపం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: יָם סוּף స్థలనామం
  choice: రెల్లుల సముద్రం
  alternative: ఎర్ర సముద్రం
  rationale: మూల హీబ్రూ పేరును పారదర్శకంగా ప్రతిబింబించే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ పేరును పాఠకుల అవగాహన కోసం పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా, గంభీరంగా ఉండే కథన శైలి. ‘అతి బలమైన’, ‘ఒక్క మిడత కూడా’ వంటి రూపాలు హీబ్రూ ఉద్ఘాటనను సహజంగా నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
