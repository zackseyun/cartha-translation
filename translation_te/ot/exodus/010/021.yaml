language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “నీ చెయ్యి ఆకాశం వైపు చాపు. అప్పుడు ఐగుప్తు దేశం మీద చీకటి కమ్ముకొంటుంది; ఆ చీకటి స్పృశించగలిగేంతగా ఉంటుంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో చివరి మాటను “చీకటి అనుభూతి చెందబడుతుంది” లేదా “ఒకడు చీకటిని స్పృశించగలుగుతాడు” అని కూడా అర్థం చేసుకోవచ్చు. ఇక్కడ వాడిన క్రియ అరుదైనది; చీకటి తాకదగినంత వాస్తవంగా ఉన్నట్లు దాని భావం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి దగ్గరైన ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: נְטֵה יָדְךָ
  choice: నీ చెయ్యి ... చాపు
  rationale: נטה అనే ఆజ్ఞారూపానికి ‘చాపు’ సహజమైన తెలుగు; יָדְךָలోని ఏకవచన సంబోధనను అలాగే ఉంచుతుంది.
- source_word: עַל הַשָּׁמַיִם
  choice: ఆకాశం వైపు
  rationale: చేతిని పైకి చాపే సందర్భంలో עַל దిశను సూచిస్తుంది; ‘ఆకాశం వైపు’ తెలుగు వాడుకలో సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: וִיהִי חֹשֶׁךְ
  choice: చీకటి కమ్ముతుంది
  rationale: జస్సివ్ నిర్మాణంలోని ఉద్దేశిత ఫలితాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తూ, చీకటి దేశం మీదికి రావడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం మీద
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ పదాన్ని విడిచిపెట్టకుండా భౌగోళిక పరిధిని స్పష్టంగా ఉంచుతుంది.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: ఆ చీకటి స్పర్శకు కూడా తెలిసేంత దట్టంగా ఉంటుంది
  rationale: అరుదైన ימש క్రియను, చేతితో తాకినట్లు అనిపించే గాఢమైన చీకటి అనే సందర్భోచిత భావంతో సహజ తెలుగులో అందిస్తుంది; మూలంలోని అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా ప్రత్యక్షంగా లిప్యంతరీకరించాం.
- issue: చివరి ఉపవాక్యంలో చీకటి స్వభావం
  choice: స్పర్శకు కూడా తెలిసేంత దట్టమైన చీకటి
  alternative: చీకటి అనుభూతి చెందబడాలి; ఒకడు చీకటిని తడవగలగాలి
  rationale: అరుదైన క్రియ వల్ల కలిగే అర్థసందిగ్ధతను ఒక ఖచ్చితమైన అద్భుత వివరణగా మార్చకుండా, చీకటి స్పృశించగలిగినంత గాఢంగా ఉందనే ప్రధాన భావాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘మోషే’, ‘ఐగుప్తు’ వంటి స్థిరమైన తెలుగు బైబిలు నామరూపాలను ఉంచి, అసహజమైన పదానుపద నిర్మాణాన్ని నివారించాం.
