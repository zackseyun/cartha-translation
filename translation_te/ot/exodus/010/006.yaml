source:
  edition: WLC
  text: וּ/מָלְא֨וּ בָתֶּ֜י/ךָ וּ/בָתֵּ֣י כָל עֲבָדֶי/ךָ֮ וּ/בָתֵּ֣י כָל מִצְרַיִם֒ אֲשֶׁ֨ר לֹֽא רָא֤וּ אֲבֹתֶ֨י/ךָ֙ וַ/אֲב֣וֹת אֲבֹתֶ֔י/ךָ מִ/יּ֗וֹם הֱיוֹתָ/ם֙ עַל הָ֣/אֲדָמָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּ֥פֶן וַ/יֵּצֵ֖א מֵ/עִ֥ם פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: te
  text: “అవి నీ ఇళ్లను, నీ సేవకులందరి ఇళ్లను, ఐగుప్తు దేశమంతటిలోని ఇళ్లను నింపివేస్తాయి. నీ పూర్వికులూ, నీ పూర్వికుల పూర్వికులూ భూమిమీద ఉన్న నాటి నుంచి ఈ రోజు వరకు ఇలాంటిది చూడలేదు[a][b].” అప్పుడు అతడు వెనుదిరిగి ఫరో దగ్గర నుంచి బయటికి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో, “నీ పూర్వికులూ, నీ పూర్వికుల పూర్వికులూ చూడనిది” అని మరింత అక్షరార్థంగా అనువదించవచ్చు. ఈ మాట ముందుగా వర్ణించిన అపూర్వమైన మిడతల విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “భూమి” అనే పదాన్ని సందర్భానుసారం “నేల” లేదా “దేశం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: అవి ... నింపివేస్తాయి
  rationale: ముందరి వచన సందర్భంలో మిడతలే అంతర్లీన కర్తలు. సంయుక్త సంపూర్ణ క్రియకు కొనసాగుతున్న భవిష్యత్ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: నీ ఇళ్లను, నీ సేవకులందరి ఇళ్లను, ఐగుప్తీయులందరి ఇళ్లను
  rationale: మూలంలోని బహువచన పునరుక్తినీ, ఫరో ఇంటి నుంచి సేవకులకూ ఆపై ఐగుప్తు అంతటికీ విస్తరించే తీవ్రతనీ నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: రాజసభ సందర్భంలో ఇది ఫరోకు సేవచేసే వారిని లేదా అధికారులను సూచించగలదు. ‘సేవకులు’ మూలానికి సమీపంగా ఉండి వారి సామాజిక స్థితిని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: నీ పూర్వికులూ, వారి ముందు తరాలవారూ
  rationale: హీబ్రూ తరతరాల వ్యక్తీకరణను ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; కేవలం తండ్రులు, తాతలు అనే సంకుచిత అర్థాన్ని నివారిస్తుంది.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: వారు నేలమీద ఉన్న నాటి నుంచి
  rationale: వారి ఉనికి లేదా నివాసం ఆరంభమైన కాలం నుంచి అనే భావాన్ని సరళంగా నిలుపుతుంది; ‘జన్మించినప్పటి నుంచి’ వంటి అవసరానికి మించిన వివరణను జోడించదు.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: ఇలాంటిది చూడలేదు
  rationale: సాపేక్ష వాక్యం ముందుగా చెప్పిన అపూర్వమైన మిడతల విపత్తును సూచిస్తుంది. తెలుగులో సహజత కోసం ‘ఇలాంటిది’ ఉపయోగించబడింది.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: అతడు వెనుదిరిగి ఫరో దగ్గర నుంచి బయటికి వెళ్లిపోయాడు
  rationale: వరుస కథన క్రియలనూ ఫరో సమక్షం నుంచి మోషే నిష్క్రమించడాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అపూర్వమైనదిగా చెప్పబడిన దాని సూచన
  choice: ‘ఇలాంటిది’ అని మొత్తం మిడతల విపత్తును సూచించడం
  alternative: సాపేక్ష వాక్యాన్ని నేరుగా ‘వాటిని చూడలేదు’ అని మిడతలకు అన్వయించడం
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణానికి సూచ్యాంశంలో కొంత సడలింపు ఉంది. సందర్భం అపూర్వమైన విపత్తును ప్రధానంగా చూపుతుంది; అనిశ్చితిని పాదసూచికలో తెలియజేశారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే శైలి. తరాల హీబ్రూ నుడికారాన్ని ‘పూర్వికులు, వారి ముందు తరాలవారు’గా సహజీకరించాం. పాదసూచిక గుర్తులు సంబంధిత భావాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
