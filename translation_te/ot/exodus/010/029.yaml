  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: te
  text: అప్పుడు మోషే, “నీవు చెప్పినట్టే[a], ఇక మళ్లీ నేను నీ ముఖం చూడను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అన్నట్లే”; “నీవు చెప్పిన ప్రకారమే జరగనివ్వు” అనే సమ్మతి భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “నీ ముఖాన్ని చూడడాన్ని ఇక మళ్లీ చేర్చను”; ఇది “ఇక మళ్లీ నీ ముఖం చూడను” అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో ప్రామాణికంగా వాడే వ్యక్తినామ రూపం.
- source_word: כֵּן דִּבַּרְתָּ
  choice: నీవు చెప్పినట్టే
  rationale: ఫరో మాటకు మోషే తెలిపిన సమ్మతిని సహజంగా వ్యక్తం చేస్తూ, ‘నీవు అన్నట్లే/నీవు చెప్పినట్లే’ అనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: לֹא אֹסִף עוֹד
  choice: ఇక ... చూడను
  rationale: ‘మళ్లీ చేయడానికి మరింత చేర్చను’ అనే హెబ్రీ నుడికారానికి సహజమైన తెలుగు సమానం; ఆ క్రియ ఇక పునరావృతం కాదనే భావాన్ని ఇస్తుంది.
- source_word: רְאוֹת פָּנֶיךָ
  choice: నీ ముఖం చూడను
  rationale: ‘నీ ముఖాన్ని చూడడం’ అనే స్పష్టమైన హెబ్రీ వ్యక్తీకరణను కాపాడుతుంది; ‘నీ సన్నిధికి రాను’ అని వివరణాత్మకంగా మార్చదు.
theological_decisions:
- issue: మోషే ఇక ఫరోను చూడనని చెప్పిన మాట యొక్క సంపూర్ణత
  choice: ఇక నేను నీ ముఖం చూడను
  alternative: నేను ఎన్నటికీ మళ్లీ నీ ముఖం చూడను
  rationale: లֹא אֹסִף עוֹדలో పునరావృతం కాదనే దృఢ భావం ఉన్నా, మూలంలో లేని అదనపు తీవ్రతను ‘ఎన్నటికీ’ ద్వారా చేర్చకుండా నుడికారాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నీ ముఖం’ అనే మూలభాషా రూపాన్ని నిలిపి, హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో సులభంగా అర్థమయ్యే తెలుగులో ఇచ్చాం.
