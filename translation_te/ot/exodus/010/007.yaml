  rationale: 'తెలుగు సహజత్వం, వాక్యస్పష్టత కోసం మాత్రమే స్వల్ప సవరణ చేశాం: రెండవ ఆజ్ఞలో ‘వారిని’ని చేర్చాం. మూలపాఠంలోని వ్యక్తుల సంఖ్య, లింగనిర్దిష్ట పదం, దైవనామం, రూపకం, మరియు ప్రశ్న యొక్క మందలింపు ధోరణి మారలేదు.'
