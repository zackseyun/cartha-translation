id: EXO.10.7
reference: Exodus 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: te
  text: 'అప్పుడు ఫరో సేవకులు[a] అతనితో ఇలా అన్నారు: “ఇతడు[b] ఎంతకాలం మనకు ఉచ్చుగా[c] ఉంటాడు? ఆ పురుషులను[d] పంపివేయి; వారిని తమ దేవుడైన యాహ్వేను[e] సేవించనివ్వు. ఐగుప్తు నాశనమైందని నీకు ఇంకా తెలియలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఫరో అధికారులు”; సందర్భంలో రాజసభకు చెందిన అధికారులు ఉద్దేశింపబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “ఇతడు” లేదా “ఇది”; సందర్భంలో మోషే ఉద్దేశించబడ్డాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “వలగా.”
    reason: lexical_alternative
  - marker: d
    text: హెబ్రీలో “ఆ పురుషులను”; కొన్ని అనువాదాలు సందర్భాన్ని బట్టి “ఆ ప్రజలను” అని విస్తరించి చెబుతాయి.
    reason: lexical_alternative
  - marker: e
    text: “సేవించు” అనే హెబ్రీ క్రియ దేవుని సందర్భంలో సేవ చేయడం, ఆరాధించడం—రెండు భావాలనూ కలిగి ఉండవచ్చు. “యాహ్వే” అనేది יהוה (YHWH) అనే దైవనామానికి లిప్యంతరీకరణ; సంప్రదాయంగా దీనిని “ప్రభువు” అని కూడా సూచిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי פַרְעֹה
  choice: ఫరో సేవకులు
  rationale: ‘సేవకులు’ అనేది నేరుగా సరిపోయే అర్థం; సందర్భంలో వీరు రాజసభకు చెందిన అధికారులు లేదా పరిచారకులు అయి ఉండవచ్చు.
- source_word: עַד מָתַי
  choice: ఎంతకాలం
  rationale: హెబ్రీ కాలప్రశ్న యొక్క సహజమైన తెలుగు రూపం.
- source_word: זֶה
  choice: ఇతడు
  rationale: సూచనాసర్వనామం సందర్భంలో మోషేను సూచిస్తుంది; ‘ఇతడు’ మూలంలోని సంక్షిప్తతను నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: לְמוֹקֵשׁ
  choice: ఉచ్చుగా
  rationale: మూలంలోని ఉచ్చు లేదా వల అనే రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שַׁלַּח
  choice: పంపివేయి
  rationale: ఫరో వారిని వెళ్లనివ్వాలి లేదా విడుదల చేయాలి అనే ఆజ్ఞను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הָאֲנָשִׁים
  choice: ఆ పురుషులను
  rationale: మూలపదం సాధారణ ‘ప్రజలు’ అనే పదం కాకుండా పురుషులను సూచించే బహువచనం.
- source_word: וְיַעַבְדוּ
  choice: వారు ... సేవించనివ్వు
  rationale: దేవునికి చేసే సేవను సూచించే עבד క్రియను నేరుగా అనువదిస్తుంది; ఇందులో ఆరాధన భావం కూడా ఉండవచ్చు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: הֲטֶרֶם תֵּדַע
  choice: నీకు ఇంకా తెలియలేదా?
  rationale: సందర్భంలోని మందలింపు భావాన్ని సహజమైన తెలుగు ప్రశ్నగా తెలియజేస్తుంది.
- source_word: אָבְדָה מִצְרָיִם
  choice: ఐగుప్తు నాశనమైంది
  rationale: తెగుళ్లవల్ల దేశం ఇప్పటికే శిథిలస్థితికి చేరిందనే ఫలితస్థితిని తెలుపుతుంది; సంపూర్ణ అంతమైపోయిందని అతిశయంగా చెప్పదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: הָאֲנָשִׁים లోని లింగనిర్దిష్టత
  choice: ఆ పురుషులను
  alternative: ఆ ప్రజలను
  rationale: మూలనామవాచకం వ్యాకరణపరంగానే కాక అర్థపరంగానూ పురుష బహువచనం; విస్తృత సందర్భంలో ఇశ్రాయేలు ప్రజలు ఉద్దేశింపబడినా, ఈ వచనంలోని నిర్దిష్ట పదాన్ని నిలిపాం.
- issue: עבד క్రియలో సేవ–ఆరాధన భావసమ్మేళనం
  choice: సేవించనివ్వు
  alternative: ఆరాధించనివ్వు
  rationale: ‘సేవించు’ మూలక్రియ యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది; దేవుని సందర్భంలో ఆ సేవ ఆరాధనను కూడా కలిగి ఉండవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇతడు’, ‘ఉచ్చు’, ‘నాశనమైంది’ వంటి సాధారణ పదాలు మూలంలోని సంక్షిప్తతను, తీవ్రతను నిలుపుతాయి; దైవనామం ‘యాహ్వే’గా ఉంచబడింది.
