source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: te
  text: అయితే యెహోవా ఫరో హృదయాన్ని కఠినపరిచాడు[a]; అతడు వారిని వెళ్లనివ్వడానికి ఇష్టపడలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఫరో హృదయాన్ని దృఢపరిచాడు/బలపరిచాడు.’ హీబ్రూ క్రియకు ‘బలపరచు’ లేదా ‘దృఢపరచు’ అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో ‘హృదయం’తో కలిసినప్పుడు ‘కఠినపరచు’ అనే భావం వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతడు వారిని వెళ్లనివ్వడానికి నిరాకరించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: కఠినపరిచాడు
  rationale: חזק అనే క్రియకు ప్రాథమికంగా ‘బలపరచు/దృఢపరచు’ అనే అర్థాలు ఉన్నా, నిర్గమకాండలో ‘హృదయం’తో వచ్చే పునరావృత సందర్భంలో సంకల్పాన్ని కఠినపరచడం అనే భావాన్ని ఇస్తుంది. ‘కఠినపరిచాడు’ ఆధునిక తెలుగులో ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: לֵב
  choice: హృదయాన్ని
  rationale: హీబ్రూ לֵב ఇక్కడ భావోద్వేగాలకే కాక సంకల్పం, అంతరంగ వైఖరిని కూడా సూచిస్తుంది. ‘హృదయం’ బైబిలు నుడికారాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే పదం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో ప్రామాణికంగా, విస్తృతంగా వాడే రూపం.
- source_word: לֹא אָבָה
  choice: ఇష్టపడలేదు
  rationale: אָבָה సమ్మతి లేదా సుముఖతను సూచిస్తుంది. నిషేధంతో కలిపి ‘ఇష్టపడలేదు’ అనడం ఫరో సంకల్పపూర్వకంగా సుముఖంగా లేకపోవడాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘నిరాకరించాడు’ కూడా సందర్భోచిత ప్రత్యామ్నాయం.
- source_word: לְשַׁלְּחָם
  choice: వారిని వెళ్లనివ్వడానికి
  rationale: నిర్గమకాండ సందర్భంలో שׁלח ఇశ్రాయేలీయులు బయలుదేరడానికి అనుమతించడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లనివ్వడం’ సహజమైన తెలుగు నుడికారం.
theological_decisions:
- issue: దేవుడు హృదయాన్ని కఠినపరచడం మరియు ఫరో స్వీయ సంకల్పం
  choice: ‘యెహోవా ఫరో హృదయాన్ని కఠినపరిచాడు; అతడు ... ఇష్టపడలేదు’ అని రెండు వాక్యభాగాలనూ నేరుగా అనువదించాం.
  alternative: ‘యెహోవా ఫరో హృదయాన్ని దృఢపరిచాడు, కాబట్టి అతడు వారిని పంపడానికి నిరాకరించాడు.’
  rationale: హీబ్రూ పాఠం కఠినపరచడాన్ని యెహోవాకు ఆపాదిస్తూ, వెంటనే ఫరో ఇష్టపడలేదని కూడా చెబుతుంది. కారణార్థక సంబంధాన్ని అదనంగా చేర్చకుండా, దైవిక చర్యకూ మానవ సంకల్పానికీ మధ్య ఉన్న పాఠ్య ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన బైబిలు శైలిని నిలుపుతూ అనువదించాం. ‘హృదయం’ అనే మూల నుడికారాన్ని కాపాడాం; రెండు స్వతంత్ర వాక్యభాగాల మధ్య కారణార్థక పదాన్ని చేర్చలేదు.
