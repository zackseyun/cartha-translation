id: EXO.10.25
reference: Exodus 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: te
  text: 'అయితే మోషే ఇలా అన్నాడు: “నువ్వు కూడా మా చేతుల్లోకి బలులనూ దహనబలులనూ ఇవ్వాలి; మేము వాటిని మా దేవుడైన యహోవాకు అర్పిస్తాము.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి వచనానికి ప్రతిస్పందనను సహజ తెలుగు కథనశైలిలో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: גַּם אַתָּה
  choice: నువ్వే
  rationale: גַּםతో కూడిన స్వతంత్ర సర్వనామం ఫరోనే అవసరమైన బలులను ఇవ్వాలనే ఉద్ఘాటనను సూచిస్తుంది; తెలుగులో ‘నువ్వే’ దాన్ని సహజంగా అందిస్తుంది.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: మాకు ఇవ్వాలి
  rationale: అక్షరార్థంగా ‘మా చేతుల్లో ఇవ్వాలి’; తెలుగులో ‘మాకు ఇవ్వాలి’ బదిలీ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: זְבָחִים
  choice: బలులు
  rationale: వధతో కూడిన సాధారణ బలుల విస్తృత భావాన్ని ఆధునిక తెలుగు బైబిలు పదజాలంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעֹלֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా కాల్చే అర్పణకు స్థిరమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: וְעָשִׂינוּ
  choice: అర్పించడానికి
  rationale: అక్షరార్థం ‘చేస్తాము’; బలుల సందర్భంలో ‘అర్పించడం’ అనే ఆచారార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: మా దేవుడైన యహోవాకు
  rationale: לְ గ్రహీతను సూచిస్తుంది; దేవుని వ్యక్తిగత నామమైన יהוהను ‘యహోవా’గా లిప్యంతరీకరించి, אֱלֹהֵינוּను సహజ తెలుగు సంబంధ నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా నామాన్ని తెలుగులో ‘యహోవా’గా నిలుపుతుంది.
- issue: ఫరో బలులను ఇవ్వాలనే వాక్యబలం
  choice: నువ్వే ... ఇవ్వాలి
  alternative: నువ్వు కూడా ... ఇస్తావు
  rationale: అసంపూర్ణ క్రియారూపం సందర్భంలో మోషే యొక్క పట్టుదలగల ఆవశ్యకతను వ్యక్తం చేస్తుంది; కేవలం భవిష్యద్వాక్యంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ ప్రత్యక్ష సంభాషణలోని ఏకవచన ఉద్ఘాటనను నిలిపింది. మూలంలోని ‘మా చేతుల్లో’ అనే రూపకాన్ని సహజత కోసం ‘మాకు’గా సంక్షిప్తం చేసింది; బలుల ఉద్దేశాన్ని ‘అర్పించడానికి’తో స్పష్టం చేసింది.
