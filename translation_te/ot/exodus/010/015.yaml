source:
  edition: WLC
  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: te
  text: అవి దేశమంతటి ఉపరితలాన్ని[a] కప్పివేశాయి; దేశం చీకటిపడింది. వడగండ్లు మిగిల్చిన దేశంలోని ప్రతి మొక్కను, చెట్ల పండ్లన్నిటినీ అవి తిన్నాయి. ఐగుప్తు దేశమంతటా చెట్లమీదగానీ పొలంలోని మొక్కలమీదగానీ పచ్చనిదేదీ మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేశమంతటి కన్ను”; ఇది దేశపు కనిపించే ఉపరితలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: అవి ... కప్పివేయడంతో
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నా, సందర్భంలోని మిడతల సమూహాన్ని సూచిస్తుంది. తెలుగులో మిడతలను సహజంగా బహువచన సర్వనామంతో సూచించాం; తరువాతి చీకటికి ఫలిత సంబంధాన్ని ‘-డంతో’ తెలియజేస్తుంది.
- source_word: עֵין כָּל הָאָרֶץ
  choice: దేశమంతటి ఉపరితలాన్ని
  rationale: అక్షరార్థంగా ‘దేశమంతటి కన్ను’; ఇక్కడ కనిపించే భూఉపరితలాన్ని సూచించే హీబ్రూ నుడికారం. ‘ఉపరితలం’ ఆధునిక తెలుగులో అర్థాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: దేశం చీకటిపడింది
  rationale: క్రియకు ‘చీకటిగా మారింది’ అనే భావం ఉంది. ‘చీకటిపడింది’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
- source_word: וַיֹּאכַל
  choice: అవి తినివేశాయి
  rationale: మూలంలో సాధారణ అర్థం ‘తిన్నది’; తెలుగులో ‘తినివేశాయి’ పూర్తిగా తినబడిన సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది, అయితే ‘నాశనం చేశాయి’ అనే మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: దేశంలోని ప్రతి మొక్కను
  rationale: עֵשֶׂב గడ్డి మాత్రమే కాక విస్తృతంగా మొక్కలు లేదా వృక్షసంపదను సూచించగలదు. ‘ప్రతి మొక్క’ దాని విస్తృత పరిధిని నిలుపుతుంది.
- source_word: כָּל פְּרִי הָעֵץ
  choice: చెట్ల పండ్లన్నిటినీ
  rationale: మూలంలోని ‘చెట్టు’ రూపం సమష్టి అర్థంలో ఉంది. తెలుగులో ‘చెట్ల పండ్లన్నీ’ సహజంగా ఆ పంపిణీ భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: వడగండ్లు మిగిల్చిన
  rationale: మునుపటి తెగులు తరువాత మిగిలిన వాటిని సూచించే సంబంధ వాక్యాన్ని సంక్షిప్తంగా, నేరుగా అనువదిస్తుంది.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: పచ్చనిదేదీ మిగలలేదు
  rationale: బలమైన నిరాకరణతో కూడిన విస్తృత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘పచ్చని వస్తువు’ వంటి కృత్రిమ పదబంధాన్ని నివారిస్తుంది.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: చెట్లమీదగానీ పొలంలోని మొక్కలమీదగానీ
  rationale: సమష్టి ఏకవచనాలను తెలుగులో సహజ బహువచనాలుగా ఇచ్చి, ‘గానీ ... గానీ’ నిర్మాణంతో ఏ విభాగంలోనూ ఏదీ మిగలలేదనే నిరాకరణను స్పష్టం చేశాం.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: ప్రాంతమంతటినీ సూచించే ప్రామాణిక భౌగోళిక వ్యక్తీకరణ; ఆధునిక తెలుగు బైబిలు శైలికి సరిపోతుంది.
