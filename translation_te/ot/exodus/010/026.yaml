id: EXO.10.26
reference: Exodus 10:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: te
  text: మా పశువులు కూడా మాతో వస్తాయి; ఒక్క డెక్క కూడా వెనుక మిగలదు. ఎందుకంటే మన దేవుడైన యహ్వేను సేవించడానికి[a] వాటిలో నుంచే మేము తీసుకోవాలి. అక్కడికి చేరుకునే వరకు యహ్వేను దేనితో సేవించాలో మాకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన దేవుడైన యహ్వేను ఆరాధించడానికి’ / ‘యహ్వేను దేనితో ఆరాధించాలో.’ హీబ్రూ క్రియకు ‘సేవించు’ లేదా ఈ సందర్భంలో ‘ఆరాధించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: మా పశువులు
  rationale: మִקְנֶה పెంపుడు జంతువులన్నిటినీ సమష్టిగా సూచిస్తుంది; ‘పశువులు’ అనే పదం తెలుగు పాఠకులకు సహజంగా ఉండి ఈ విస్తృత భావాన్ని అందిస్తుంది.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: మాతో వస్తాయి
  rationale: గమ్యస్థానం వైపు తమతో పాటు జంతువులు రావడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: ఒక్క డెక్క కూడా వెనుక మిగలదు
  rationale: פַּרְסָה అనే ‘డెక్క’ను అక్షరార్థంగా నిలుపుతూ, నిరాకరణలోని బలాన్ని ‘ఒక్క…కూడా’ తెలియజేస్తుంది; ‘వెనుక’ అనేది సందర్భంలో సూచితమైన విడిచిపెట్టడాన్ని స్పష్టం చేస్తుంది.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: ఎందుకంటే … వాటిలో నుంచే మేము తీసుకోవాలి
  rationale: హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు. తెలుగులోనూ దానిని నింపకుండా, పశువులలో నుంచి బలి లేదా ఆరాధనకు కావలసినవి తీసుకోవాలనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యహ్వేను సేవించడానికి
  rationale: עבד పదానికి ‘సేవించు’ మరియు సందర్భానుసారంగా ‘ఆరాధించు’ అనే భావాలు ఉన్నాయి. ‘సేవించు’ మూలపదపు విస్తృత భావాన్నీ, వచనంలోని పునరుక్తినీ కాపాడుతుంది.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: యహ్వేను దేనితో సేవించాలో
  rationale: ఇక్కడ מַה సాధనార్థకంగా గ్రహించవచ్చు. ‘దేనితో’ అనేది ఏ జంతువులు లేదా అర్పణలు అవసరమో ఇంకా తెలియదనే నిర్దిష్ట సందర్భాన్ని నిలుపుతుంది.
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: అక్కడికి చేరుకునే వరకు
  rationale: గమ్యస్థానానికి చేరడాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
theological_decisions:
- issue: బలి/ఆరాధన సందర్భంలో עבד పదం అనువాదం
  choice: సేవించు
  alternative: ఆరాధించు
  rationale: ఈ సందర్భంలో ‘ఆరాధించు’ సాధ్యమే అయినప్పటికీ, ‘సేవించు’ హీబ్రూ పదపు విస్తృత నిబంధనాత్మక భావాన్ని, రెండు ప్రయోగాల మధ్య పునరుక్తిని నిలుపుతుంది; ఆరాధన భావాన్ని నిరాకరించదు.
- issue: מַה అనే ప్రశ్నార్థక పదం యొక్క భావం
  choice: దేనితో
  alternative: ఎలా
  rationale: మోషేకు ఏ పశువులు లేదా అర్పణలు అవసరమో గమ్యస్థానానికి చేరేవరకు తెలియదనే సందర్భంలో సాధనార్థక పఠనం బలంగా ఉంది; అయినా ‘ఎలా’ అనే విస్తృత పఠనం వ్యాకరణపరంగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని బలమైన ‘ఒక్క డెక్క కూడా’ ప్రయోగాన్ని నిలిపి, עבד పదంలోని సేవ/ఆరాధన అర్థసంభావ్యతను పాదటిప్పణిలో భద్రపరిచాం.
