- from: “అలా కాదు![a] పురుషులైన మీరు[b] ఇప్పుడు వెళ్లి యెహోవాను సేవించండి; ఎందుకంటే మీరు కోరుతున్నది అదే.” తరువాత ఫరో వారిని తన సమక్షం నుంచి వెళ్లగొట్టాడు.
