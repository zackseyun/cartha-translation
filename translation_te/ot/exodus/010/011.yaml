source:
  edition: WLC
  text: לֹ֣א כֵ֗ן לְכֽוּ נָ֤א הַ/גְּבָרִים֙ וְ/עִבְד֣וּ אֶת יְהוָ֔ה כִּ֥י אֹתָ֖/הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַ/יְגָ֣רֶשׁ אֹתָ֔/ם מֵ/אֵ֖ת פְּנֵ֥י פַרְעֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: te
  text: “కాదు, అలా కాదు![a] పురుషులు మాత్రమే[b] ఇప్పుడు వెళ్లి యాహ్వేను సేవించండి; ఎందుకంటే మీరు కోరుతున్నది అదే.” తరువాత ఫరో వారిని తన సమక్షం నుండి వెళ్లగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాదు!”—ఫరో చెప్పిన హఠాత్తు తిరస్కారాన్ని సంక్షిప్తంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ప్రజలందరినీ కాక, ప్రత్యేకంగా పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: అలా కాదు!
  rationale: ముందు ప్రతిపాదించిన దానిని ఫరో హఠాత్తుగా తిరస్కరించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కాదు!’ అని మాత్రమే అనడం కంటే హీబ్రూ పదబంధ నిర్మాణాన్ని కొంత ఎక్కువగా నిలుపుతుంది.
- source_word: לְכוּ נָא
  choice: ఇప్పుడు వెళ్లి
  rationale: బహువచన ఆజ్ఞను నిలుపుతూ, נָא ఇక్కడ మర్యాదపూర్వకమైన ‘దయచేసి’ కంటే తక్షణతను సూచిస్తున్నదని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: הַגְּבָרִים
  choice: పురుషులైన మీరు
  rationale: ఫరో అందరినీ కాక పురుషులను మాత్రమే వెళ్లనివ్వాలనుకున్న పరిమితిని స్పష్టంగా ఉంచుతుంది; అదే సమయంలో לְכוּ అనే రెండవ పురుష బహువచన ఆజ్ఞతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: యెహోవాను సేవించండి
  rationale: עבד దేవునికి సంబంధించి సేవించడమూ ఆరాధించడమూ అనే భావాలను కలిగి ఉండగలదు. ‘సేవించండి’ దాని విస్తృత నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన వ్యక్తినామ రూపంలో అందిస్తుంది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: ఎందుకంటే మీరు కోరుతున్నది అదే
  rationale: స్త్రీలింగ సర్వనామానికి తెలుగులో నిర్దిష్ట పూర్వపదాన్ని ఊహించి చేర్చకుండా, హీబ్రూలో ఉన్న సూచనాత్మక అస్పష్టతను సహజంగా నిలుపుతుంది.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: తరువాత ఫరో వారిని ... వెళ్లగొట్టాడు
  rationale: ఏకవచన క్రియకు సందర్భంలో ఫరో సహజ కర్త. ‘వెళ్లగొట్టాడు’ బలవంతపు పంపివేతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: తన సమక్షం నుంచి
  rationale: ‘ఫరో ముఖము ఎదుటనుండి’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; వాక్యంలో ఫరోను కర్తగా పేర్కొనడం వల్ల ‘తన’ అనడం పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న నిబంధనాత్మక వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది. తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని వాడింది.
- issue: ఫరో అనుమతించిన వర్గంలోని లింగ-నిర్దిష్ట పరిమితి
  choice: పురుషులైన మీరు
  alternative: మీరందరూ / ప్రజలు
  rationale: הַגְּבָרִים పురుషులను ప్రత్యేకంగా సూచిస్తుంది. దానిని లింగతటస్థంగా చేయడం ఫరో ఇచ్చిన పాక్షిక అనుమతిలోని కథన ఉద్రిక్తతను తొలగిస్తుంది.
- issue: వారిని వెళ్లగొట్టిన వ్యక్తి
  choice: ఫరో వారిని వెళ్లగొట్టాడు
  alternative: వారిని వెళ్లగొట్టారు
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉంది; తక్షణ సందర్భంలో ఫరోనే సహజ కర్త. అయినప్పటికీ క్రియలో కర్త పేరు ప్రత్యక్షంగా లేకపోవడం వల్ల ప్రత్యామ్నాయంగా అనిర్దిష్ట కర్తతోనూ అర్థం చేసుకోవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఫరో మాటల్లోని హఠాత్తు తిరస్కారం, తక్షణత, పురుషులకు మాత్రమే ఇచ్చిన పరిమిత అనుమతి నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో [a], [b] సూచికలు రెండూ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
