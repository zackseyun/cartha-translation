  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: te
  text: ఇప్పుడు, దయచేసి ఈ ఒక్కసారికి మాత్రమే నా పాపాన్ని క్షమించండి[a]; నా మీదనుండి ఈ మరణాన్ని మాత్రమే[b] తొలగించేలా మీ దేవుడైన యెహోవాను వేడుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పాపాన్ని ఎత్తివేయండి” లేదా “నా పాపాన్ని మన్నించండి.” హెబ్రీ నుడికారంలో ‘పాపం’ను కర్మగా తీసుకుని ‘ఎత్తు/మోయు’ అనే క్రియ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “ఈ మరణం.” ఫరో ప్రస్తుతం ఉన్న ప్రాణాంతక విపత్తును, దాని ప్రభావాలను ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: వావ్ సంధానార్థాన్నీ, עַתָּה కాలార్థాన్నీ సహజమైన తెలుగు సంభాషణా ప్రవాహంలో తెలియజేస్తుంది.
- source_word: שָׂא נָא חַטָּאתִי
  choice: నా పాపాన్ని క్షమించండి
  rationale: ‘ఎత్తు/మోయు’ అనే మూలార్థంగల נָשָׂא, ‘పాపం’ కర్మగా వచ్చినప్పుడు క్షమించడం లేదా దోషాన్ని తొలగించడం అనే నుడికారార్థాన్ని ఇస్తుంది; נָא లోని వినయపూర్వక విన్నపం సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: אַךְ הַפַּעַם
  choice: ఈ ఒక్కసారికి మాత్రమే
  rationale: ఫరో తన క్షమాపణ విన్నపాన్ని ఈ సందర్భానికే పరిమితం చేస్తున్న భావాన్ని నిలుపుతుంది.
- source_word: וְהַעְתִּירוּ
  choice: వేడుకోండి
  rationale: దేవునికి చేసే గాఢమైన విన్నపాన్ని సూచించే హిఫిల్ రూపానికి ఆధునిక, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: మూలపాఠంలోని יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ఫరో ‘మీ దేవుడు’ అని పలికిన దూరీకరణ భావాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וְיָסֵר מֵעָלַי
  choice: నా మీదినుంచి ... తొలగించమని
  rationale: మధ్యవర్తిత్వ విన్నపం యొక్క ఉద్దేశాన్ని సహజమైన తెలుగు పరోక్ష ఆజ్ఞా నిర్మాణంలో తెలియజేస్తుంది.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: ఈ మరణాన్ని మాత్రమే
  rationale: רַק యొక్క పరిమితి భావాన్నీ, ‘ఈ మరణం’ అనే మూలపాఠంలోని కఠినమైన కానీ ఉద్దేశపూర్వక పదప్రయోగాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇక్కడ మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది; అందువల్ల సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం.
- issue: ‘ఈ మరణం’ యొక్క సూచన
  choice: ఈ మరణం
  alternative: ఈ ప్రాణాంతక తెగులు
  rationale: సందర్భంలో ఇది మిడతల విపత్తు మరియు దాని ప్రాణాంతక ఫలితాలను సూచించే అవకాశం ఉన్నా, హెబ్రీ పాఠం ‘మరణం’ అనే పదాన్నే ఉపయోగిస్తుంది; దానిని వివరణాత్మకంగా ‘తెగులు’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విన్నప శైలి. బహువచన క్రియారూపాలు మోషే మరియు అహరోనులను ఉద్దేశించిన హెబ్రీ బహువచనాన్ని నిలుపుతాయి. మూలంలోని ‘ఈ మరణం’ అనే అస్పష్టమైన పదప్రయోగాన్ని ప్రధాన పాఠంలో అలాగే ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో మాత్రమే సూచించాం.
