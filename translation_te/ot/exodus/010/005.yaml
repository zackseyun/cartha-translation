  terminology: ‘వడగండ్ల దెబ్బ,’ ‘పొలం,’ ‘చెట్టు,’ మరియు ‘ఉపరితలం’ సందర్భానుకూలమైన పదాలు. పాదసూచికలు మూల నుడికారం మరియు ప్రత్యామ్నాయ పఠనసంభావ్యతను సరిగ్గా తెలియజేస్తున్నాయి.
