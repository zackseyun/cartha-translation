id: EXO.10.5
reference: Exodus 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: te
  text: అది నేల ఉపరితలమంతా[a] కప్పివేస్తుంది; అందువల్ల నేల కనిపించదు. వడగండ్ల దెబ్బనుండి తప్పించుకొని మీకు మిగిలినదంతా[b] అది తినివేస్తుంది; పొలంలో మీ కోసం పెరుగుతున్న ప్రతి చెట్టునూ తినివేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘నేల కన్ను’; ఇది కనిపించే నేల ఉపరితలాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: ‘వడగండ్ల దెబ్బనుండి తప్పించుకొని మీకు మిగిలిన శేషమంతా.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: అది ... కప్పివేస్తుంది
  rationale: כסּה అంటే ‘కప్పడం, మరుగుచేయడం.’ రాబోయే మిడతల దండును సమష్టిగా ఏకవచనంలో సూచిస్తున్న సందర్భాన్ని తెలుగు ఏకవచన ‘అది’ నిలుపుతుంది.
- source_word: עֵין הָאָרֶץ
  choice: నేల ఉపరితలమంతా
  rationale: అక్షరార్థంగా ‘దేశపు/నేల యొక్క కన్ను’ అయిన ఈ హీబ్రూ నుడికారం కనిపించే భూ ఉపరితలాన్ని సూచిస్తుంది. ‘ఉపరితలం’ భావాన్ని సహజంగా తెలియజేస్తుంది; כָּל యొక్క సమగ్ర భావాన్ని సందర్భానుసారంగా ‘అంతా’ వ్యక్తపరుస్తుంది.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: అందువల్ల నేల కనిపించదు
  rationale: హీబ్రూలోని అనిర్దిష్ట ఏకవచన కర్త (‘ఎవరూ/ఒకడు చూడలేడు’) యొక్క ఫలితార్థాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంలో తెలిపింది; నేల పూర్తిగా కనబడకుండా పోవడమే భావం.
- source_word: וְאָכַל
  choice: అది తినివేస్తుంది
  rationale: אכל యొక్క సాధారణ అర్థం ‘తినడం.’ విధ్వంస తీవ్రతను సందర్భోచితంగా ‘తినివేయడం’ తెలియజేస్తుంది; సమష్టి ఏకవచనం నిలిచింది.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: వడగండ్ల దెబ్బనుండి తప్పించుకొని మీకు మిగిలినదంతా
  rationale: ‘తప్పించుకున్న శేషంలో మీకు మిగిలినది’ అనే పొరలుగల హీబ్రూ భావాన్ని పంట వంటి నిర్జీవ వస్తువులకు సహజంగా వర్తించే తెలుగు నిర్మాణంలో నిలిపింది. ‘బతికినవారు’ అని అనువదిస్తే మనుషులను సూచిస్తున్నట్టు తప్పుగా అర్థమయ్యే అవకాశం ఉంది.
- source_word: כָּל הָעֵץ
  choice: ప్రతి చెట్టునూ
  rationale: עץ ఇక్కడ చెట్టును సూచిస్తుంది; כל యొక్క విభజక భావాన్ని ‘ప్రతి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: పొలంలో మీ కోసం పెరుగుతున్న
  rationale: צמח అంటే ‘మొలకెత్తడం/పెరగడం.’ מן మూలాన్ని సూచించినా తెలుగులో పొలం నుండి పైకి పెరుగుతున్న చెట్టును ‘పొలంలో పెరుగుతున్న’ అనడం సహజం. לָכֶם లోని ప్రయోజన లేదా స్వామ్య భావాన్ని ‘మీ కోసం’ నిలుపుతుంది.
