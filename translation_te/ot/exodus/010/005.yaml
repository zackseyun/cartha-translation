  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. మిడతల దండును సూచించే హీబ్రూ సమష్టి ఏకవచనాన్ని ‘అది’గా నిలిపింది. ‘కనిపించదు’ అనే సహజ నిర్మాణం హీబ్రూ అనిర్దిష్ట కర్త భావాన్ని అతిగా వివరించకుండా అందిస్తుంది.
