id: EXO.11.4
reference: Exodus 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: te
  text: 'అప్పుడు మోషే ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘సుమారు అర్ధరాత్రి[a] నేను ఐగుప్తు మధ్యలోకి వెళ్తాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అర్ధరాత్రి.” హీబ్రూ పదబంధంలో ఉన్న ఉపసర్గ సుమారుతనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; హీబ్రూ క్రియ రూపం భూతకాలమైనా, ప్రత్యక్ష సందేశ పరిచయంలో వర్తమాన భావం సముచితం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించి నిలుపుతుంది.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: సుమారు అర్ధరాత్రి
  rationale: ముందున్న כְּ ఉపసర్గ ఇక్కడ సుమారుతనాన్ని సూచించగలదు; అందువల్ల ఖచ్చిత సమయాన్ని అతిగా నిర్ధారించకుండా మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: אֲנִי
  choice: నేను
  rationale: మూలంలో స్పష్టంగా ఉన్న ప్రథమ పురుష సర్వనామాన్ని, దాని ఉద్ఘాటనతో సహా నిలుపుతుంది.
- source_word: יוֹצֵא
  choice: బయలుదేరుతాను
  rationale: వర్తమాన కృదంతం సందర్భంలో సమీప భవిష్యత్ చర్యను సూచిస్తుంది; ‘బయలుదేరుతాను’ సహజమైన తెలుగు రూపం.
- source_word: בְּתוֹךְ
  choice: మధ్యలోకి
  rationale: కేవలం స్థితిని కాకుండా ఐగుప్తు అంతర్భాగంలోకి జరిగే కదలికను తెలుపుతుంది.
- source_word: מִצְרָיִם
  choice: ఐగుప్తు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇవ్వడం మూలానికి సమీపంగా ఉంటుంది.
- issue: כַּחֲצֹת הַלַּיְלָה లోని కాలసూచక సూక్ష్మభావం
  choice: సుమారు అర్ధరాత్రి
  alternative: అర్ధరాత్రి
  rationale: כְּ ఉపసర్గ సుమారుతనాన్ని సూచించగలందున, మూలంలో ఉన్న భావాన్ని ఖచ్చిత సమయంగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ప్రవక్తీయ సందేశ పరిచయాన్ని స్పష్టంగా చూపేందుకు ద్వితీయ ఉద్ధరణ చిహ్నాలు వాడబడ్డాయి. ప్రచురణ పాఠ్యంలో పాదటిప్పణి అవసరం లేకుండా ‘సుమారు’ అనే భావాన్ని నేరుగా ప్రధాన వాక్యంలో ఉంచాం.
