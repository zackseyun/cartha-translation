  to: 'అప్పుడు మోషే ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘సుమారు అర్ధరాత్రి[a] నేను ఐగుప్తు మధ్యలోకి వెళ్తాను.’”'
