id: EXO.11.1
reference: Exodus 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నేను ఫరో మీదికి, ఐగుప్తు మీదికి ఇంకొక తెగులు[a] రప్పిస్తాను. ఆ తర్వాత అతడు మిమ్మల్ని ఇక్కడి నుంచి పంపివేస్తాడు. అతడు మిమ్మల్ని పంపివేసేటప్పుడు, మిమ్మల్ని ఇక్కడి నుంచి పూర్తిగా తరిమివేస్తాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెగులు’ అని అనువదించిన హీబ్రూ పదానికి ‘దెబ్బ,’ ‘ప్రహారం,’ లేదా ‘బాధ’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తరిమివేస్తాడు’ అనే హీబ్రూ వ్యక్తీకరణ గట్టి ఉద్ఘాటనతో ఉంది; అక్షరార్థంగా, ‘తరిమివేస్తూ తరిమివేస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమబద్ధతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עוֹד נֶגַע אֶחָד
  choice: ఇంకొక తెగులు
  rationale: עוֹד ఇక్కడ అదనంగా మరొకటి అనే భావాన్ని ఇస్తుంది; ఐగుప్తుపై వచ్చిన దైవిక విపత్తుల సందర్భంలో נֶגַעకు ‘తెగులు’ స్పష్టమైన సందర్భోచిత సమానం.
- source_word: אָבִיא עַל
  choice: మీదికి ... రప్పిస్తాను
  rationale: హిఫిల్ రూపం ‘మీదికి తీసుకురావడం/రప్పించడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; రాబోయే చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: మిమ్మల్ని ఇక్కడి నుంచి పంపివేస్తాడు
  rationale: שׁלח యొక్క పంపివేయడం లేదా వెళ్లనివ్వడం అనే భావాన్ని ఉంచుతూ, తరువాతి బలమైన ‘తరిమివేయడం’తో ఉన్న తీవ్రతాభేదాన్ని కాపాడుతుంది.
- source_word: כְּשַׁלְּחוֹ
  choice: అతడు మిమ్మల్ని పంపివేసేటప్పుడు
  rationale: כְּ ఇక్కడ కాలసంబంధమైన ‘ఎప్పుడు/అప్పుడు’ భావంలో ఉంది; ముందున్న שׁלח క్రియతో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: כָּלָה
  choice: పూర్తిగా
  rationale: ఇక్కడ క్రియావిశేషణంగా వచ్చి పంపివేత సంపూర్ణంగా జరుగుతుందని సూచిస్తుంది; ‘పూర్తిగా’ ఆ సమగ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: తరిమివేస్తాడు
  rationale: అనంతక్రియారూపం మరియు సమాపక క్రియ కలయిక చర్యకు గట్టి నిశ్చయాన్నీ తీవ్రతనూ ఇస్తుంది. ప్రధాన పాఠంలో బలమైన ‘తరిమివేస్తాడు’ను ఉపయోగించి, రూపంలోని ప్రత్యేక ఉద్ఘాటనను పాదటిప్పణిలో వివరించాం.
- source_word: מִזֶּה
  choice: ఇక్కడి నుంచి
  rationale: ప్రస్తుత స్థలమైన ఐగుప్తును సూచించే సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: గట్టి ఉద్ఘాటనతో కూడిన బహిష్కరణ
  choice: పూర్తిగా తరిమివేస్తాడు
  alternative: తప్పకుండా తరిమివేస్తాడు; పూర్తిగా వెళ్లనిస్తాడు
  rationale: כָּלָה సంపూర్ణతను, גָּרֵשׁ יְגָרֵשׁ ఉద్ఘాటనను సూచిస్తాయి. ‘పూర్తిగా తరిమివేస్తాడు’ పంపివేతకన్నా బలమైన చర్యను నిలుపుతూ, ఫరో స్వచ్ఛందంగా కేవలం అనుమతిస్తాడనే భావానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘పంపివేస్తాడు’ నుంచి ‘తరిమివేస్తాడు’కు మార్పు ద్వారా మూలంలోని తీవ్రత పెరుగుదలను కాపాడాం. పాదటిప్పణి సూచికలను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
