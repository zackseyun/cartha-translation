source:
  edition: WLC
  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: te
  text: '“ఇప్పుడు ప్రజలకు వినిపించేలా చెప్పు: ప్రతి పురుషుడు తన పొరుగువాని దగ్గర నుండి, ప్రతి స్త్రీ తన పొరుగు స్త్రీ దగ్గర నుండి వెండి వస్తువులను, బంగారు వస్తువులను అడగాలి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుగా తీసుకోవాలి.” హీబ్రూ క్రియకు “అడుగు” లేదా “కోరు” అని అర్థం; ఆ వస్తువులను తిరిగి ఇవ్వాలని అది స్వయంగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: ఇప్పుడు ... చెప్పు
  rationale: దבר పియేల్ ఆజ్ఞార్థక రూపం నేరుగా మాట్లాడమనే ఆజ్ఞను ఇస్తుంది; נא ఇక్కడ అభ్యర్థన లేదా తక్షణతను సూచించగలదు. దేవుడు మోషేతో మాట్లాడుతున్న సందర్భంలో సహజమైన తెలుగులో తక్షణతను చూపేందుకు ‘ఇప్పుడు’ ఎంచుకున్నాం.
- source_word: בְּאָזְנֵי הָעָם
  choice: ప్రజలకు వినిపించేలా
  rationale: అక్షరార్థంగా ‘ప్రజల చెవుల్లో’ అనే ఈ హీబ్రూ నుడికారం, వారు వినేలా బహిరంగంగా చెప్పడాన్ని సూచిస్తుంది. తెలుగు నుడికారానికి అనుగుణంగా భావాన్ని నిలుపుతుంది.
- source_word: וְיִשְׁאֲלוּ
  choice: అడగాలి
  rationale: ఆజ్ఞార్థక క్రియను అనుసరించే ఈ ఇంపర్‌ఫెక్ట్ రూపానికి ఆదేశాత్మక బలం ఉంది. שאל ప్రాథమికంగా ‘అడుగు/కోరు’ అని అర్థం; తిరిగి ఇవ్వాలనే భావం క్రియలో అంతర్గతంగా లేదు.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: ప్రతి పురుషుడు తన పొరుగువాని దగ్గర
  rationale: איש ఇక్కడ పంపిణీ భావంలో ఏకవచన పుంలింగం; తరువాతి ‘స్త్రీ’తో సమాంతరంగా ఉంది. רֵעַ విస్తృతంగా తోటి వ్యక్తి లేదా పొరుగువానిని సూచిస్తుంది.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: ప్రతి స్త్రీ తన పొరుగుస్త్రీ దగ్గర
  rationale: పుంలింగ వాక్యభాగానికి సమాంతరమైన స్త్రీలింగ నిర్మాణం. רְעוּתָהּ స్త్రీలింగ సహచరిని లేదా పొరుగుస్త్రీని సూచిస్తుంది; మూలంలోని లింగ భేదాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: వెండి వస్తువులను, బంగారు వస్తువులను
  rationale: כְּלִי పాత్ర, పరికరం, వస్తువు వంటి విస్తృత అర్థాలను కలిగి ఉంది. ఏ ప్రత్యేక వస్తురకాన్నీ అనవసరంగా నిర్ధారించకుండా ‘వస్తువులు’ ఆ విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: ఐగుప్తీయుల దగ్గర విలువైన వస్తువులను తీసుకోవడం అనే సందర్భంలో שאל అనువాదం
  choice: అడగాలి
  alternative: అప్పుగా అడగాలి
  rationale: హీబ్రూ שאל స్వతహాగా తిరిగి ఇవ్వవలసిన అప్పును సూచించదు; సాధారణంగా అడగడం లేదా కోరడాన్ని సూచిస్తుంది. అందువల్ల ప్రధాన పాఠంలో ‘అడగాలి’ ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ప్రజలకు వినిపించేలా’ హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది. పురుషుడు–స్త్రీ, పొరుగువాడు–పొరుగుస్త్రీ అనే సమాంతర నిర్మాణాన్ని మూలానికి అనుగుణంగా నిలిపాం.
