id: EXO.11.5
reference: Exodus 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: te
  text: ఈజిప్టు దేశంలో ప్రతి మొదటి సంతానం చనిపోతుంది—సింహాసనంపై కూర్చున్న ఫరో యొక్క మొదటి సంతానం నుండి తిరగలి వెనుకనున్న బానిస స్త్రీ[a] యొక్క మొదటి సంతానం వరకు; పశువుల ప్రతి మొదటి సంతానం కూడా చనిపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బానిస స్త్రీ’ అని అనువదించిన హీబ్రూ పదం బానిసత్వంలో ఉన్న స్త్రీని సూచిస్తుంది; దీనిని ‘దాసి’ లేదా ‘సేవకురాలు’ అని కూడా అనువదించవచ్చు. ‘తిరగలి వెనుక’ అనే మాట ధాన్యాన్ని రుబ్బే తక్కువ హోదా గల శ్రమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: చనిపోతుంది
  rationale: ఇది రూపరీత్యా సంపూర్ణ క్రియ అయినప్పటికీ, రాబోయే తెగులును నిశ్చయంగా ప్రకటించే సందర్భంలో ఉంది; అందువల్ల తెలుగులో భవిష్యదర్థాన్ని సహజంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: כָּל בְּכוֹר
  choice: ప్రతి తొలిచూలు సంతానం
  rationale: כָּל యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ తెలియజేస్తుంది. בְּכוֹר లింగాన్ని స్పష్టంగా పరిమితం చేయనందున ‘తొలిచూలు కుమారుడు’ అని కాక ‘తొలిచూలు సంతానం’ అని అనువదించాం.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఈజిప్టు దేశంలోని
  rationale: మూలంలోని భౌగోళిక పదబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: తొలిచూలు సంతానం మొదలుకొని ... తొలిచూలు సంతానం వరకు
  rationale: అత్యున్నత స్థాయి నుంచి అత్యల్ప సామాజిక స్థాయి వరకు వ్యాపించే పరిధిని తెలుగు ‘మొదలుకొని ... వరకు’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: సింహాసనం మీద కూర్చున్న ఫరో
  rationale: హీబ్రూ కృదంత పదబంధంలోని కొనసాగుతున్న రాజస్థితిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: הַשִּׁפְחָה
  choice: బానిస స్త్రీ
  rationale: ఈ పదం సేవకత్వంలో, బానిస స్థితిలో ఉన్న స్త్రీని సూచిస్తుంది. ఫరోతో ఉద్దేశపూర్వకంగా చూపిన సామాజిక వ్యత్యాసాన్ని మృదువుపరచకుండా ‘బానిస స్త్రీ’ నిలుపుతుంది.
- source_word: אַחַר הָרֵחָיִם
  choice: తిరగలి వెనుక పనిచేసే
  rationale: అక్షరార్థంలోని ‘తిరగలి వెనుక’ అనే దృశ్యాన్ని నిలుపుతూ, అది ధాన్యం విసిరే శ్రమస్థానమని తెలుగు పాఠకునికి స్పష్టం చేయడానికి ‘పనిచేసే’ చేర్చాం.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: పశువుల తొలిచూలులన్నీ కూడా
  rationale: בְּהֵמָה సాధారణంగా పెంపుడు జంతువులను సూచిస్తుంది; ‘పశువులు’ తెలుగులో సహజమైన సమూహపదం. ‘కూడా’ మానవ తొలిచూలులతో వాటి చేర్పును స్పష్టం చేస్తుంది.
theological_decisions:
- issue: שִׁפְחָה అనే సామాజిక-స్థితి పదం
  choice: బానిస స్త్రీ
  alternative: దాసి / పనిమనిషి
  rationale: వచనం రాజసింహాసనం నుంచి బానిస శ్రమ వరకు ఉన్న పూర్తి సామాజిక పరిధిని చూపుతుంది. ‘పనిమనిషి’ బంధిత స్థితిని మృదువుపరచవచ్చు; ‘దాసి’ కొందరికి పాతకాలపు లేదా భక్తిపరమైన భావాన్ని కలిగించవచ్చు. ‘బానిస స్త్రీ’ మూలంలోని కఠిన సామాజిక వాస్తవాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: בְּכוֹר యొక్క లింగ పరిధి
  choice: తొలిచూలు సంతానం
  alternative: తొలిచూలు కుమారుడు
  rationale: మూలపదం ఈ వాక్యంలో ‘కుమారుడు’ అని ప్రత్యేకంగా చెప్పదు; అదే పదం పశువులకూ వాడబడింది. అందువల్ల మూలంలోని విస్తృతతను పరిష్కరించకుండా ‘సంతానం’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తొలిచూలు సంతానం’ మూలంలోని లింగ అస్పష్టతను నిలుపుతుంది; ‘బానిస స్త్రీ’ సామాజిక వ్యత్యాసాన్ని మృదువుపరచదు. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పదబంధం తర్వాత ఉంచబడింది.
