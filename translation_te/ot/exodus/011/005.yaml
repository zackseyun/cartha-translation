- from: ఈజిప్టు దేశంలోని ప్రతి తొలిచూలు సంతానం చనిపోతుంది—సింహాసనం మీద కూర్చున్న ఫరో తొలిచూలు సంతానం మొదలుకొని, తిరగలి వెనుక పనిచేసే బానిస స్త్రీ తొలిచూలు సంతానం వరకు; పశువుల తొలిచూలులన్నీ కూడా చనిపోతాయి.[a]
