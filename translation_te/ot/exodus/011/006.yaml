id: EXO.11.6
reference: Exodus 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָֽיְתָ֛ה צְעָקָ֥ה גְדֹלָ֖ה בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֤ר כָּמֹ֨/הוּ֙ לֹ֣א נִהְיָ֔תָה וְ/כָמֹ֖/הוּ לֹ֥א תֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: te
  text: ఐగుప్తు దేశమంతటా గొప్ప రోదన[a] ఉంటుంది. అలాంటి రోదన ఇంతకు ముందు ఎన్నడూ కలగలేదు, ఇక మీదట ఎన్నడూ కలగదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొప్ప మొర” లేదా “గొప్ప విలాపం.” హెబ్రీ పదం צְעָקָה ఆపదలో వెలువడే బిగ్గర కేకను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: అప్పుడు ... పుడుతుంది
  rationale: సంయోజక అవ్యయంతో వచ్చిన Qal perfect ఇక్కడ ప్రవచనాత్మక భవిష్యత్తును సూచిస్తుంది. తెలుగులో ‘అప్పుడు ... పుడుతుంది’ సహజంగా ఉండి, తదుపరి సంభవాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: צְעָקָה
  choice: రోదన
  rationale: ఈ నామవాచకం ఆపదవల్ల వెలువడే పెద్ద కేకను లేదా మొరను సూచిస్తుంది. సందర్భంలో మరణాల కారణంగా దేశవ్యాప్తంగా కలిగే విలాపభరితమైన కేకను ‘రోదన’ సహజంగా వ్యక్తపరుస్తుంది; ఇతర అర్థసంభావ్యతలను పాదటిప్పణిలో ఉంచాం.
- source_word: גְדֹלָה
  choice: గొప్ప
  rationale: ఈ విశేషణం రోదన యొక్క తీవ్రతను, విస్తృతిని పెంచి చెబుతుంది. ‘గొప్ప’ హెబ్రీయ idiom‌ను దగ్గరగా కాపాడుతుంది; ‘భయంకరమైన’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: בְּ + כָל నిర్మాణం మొత్తం భూభాగమంతటి వ్యాప్తిని సూచిస్తుంది. ‘దేశమంతటా’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ సంపూర్ణ పరిధిని తెలియజేస్తుంది.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: అలాంటి రోదన ఇంతకు ముందు ఎన్నడూ కలగలేదు
  rationale: సాపేక్ష వాక్యం గతంలో దానికి సమానమైనది ఏదీ సంభవించలేదని పోల్చుతుంది. ‘కలగలేదు’ היה యొక్క సంఘటనార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: ఇక మీదట ఎన్నడూ కలగదు
  rationale: నిరాకరణతో వచ్చిన יסף రూపం ‘మళ్లీ జరగదు/కలగదు’ అనే భావాన్ని ఇస్తుంది. ‘ఇక మీదట ఎన్నడూ’ దాని సంపూర్ణ భవిష్యత్ నిరాకరణను స్పష్టంగా వ్యక్తపరుస్తుంది.
