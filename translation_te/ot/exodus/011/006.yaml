translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘రోదన’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి సందర్భంలోని తీవ్ర దుఃఖాన్ని తెలియజేస్తుంది. పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
