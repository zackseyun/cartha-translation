- from: అప్పుడు ఐగుప్తు దేశమంతటా గొప్ప రోదన[a] పుడుతుంది. అలాంటి రోదన ఇంతకు ముందు ఎన్నడూ కలగలేదు, ఇక మీదట ఎన్నడూ కలగదు.
  to: ఐగుప్తు దేశమంతటా గొప్ప రోదన[a] ఉంటుంది. అలాంటి రోదన ఇంతకు ముందు ఎన్నడూ కలగలేదు, ఇక మీదట ఎన్నడూ కలగదు.
  rationale: Opening ‘అప్పుడు’ has been removed so that no unexpressed temporal nuance is introduced. ‘పుడుతుంది’ has been adjusted to the more idiomatic ‘ఉంటుంది,’ while retaining the source’s predictive force. The footnote’s explanation was lightly polished; its alternatives and meaning remain unchanged.
