base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: te
  text: మోషే, అహరోను ఫరో ఎదుట ఈ సూచక కార్యాలన్నిటినీ చేశారు[a]; మరియు యహ్వే ఫరో హృదయాన్ని కఠినపరిచాడు[b], మరియు ఫరో ఇశ్రాయేలు కుమారులను[c] తన దేశం నుండి వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ అద్భుతాలన్నిటినీ.” హీబ్రూ పదం అద్భుతమైన సూచక కార్యాలను లేదా ఆశ్చర్యకార్యాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యహ్వే ఫరో హృదయాన్ని బలపరిచాడు” లేదా “దృఢపరిచాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఇశ్రాయేలీయులను” లేదా “ఇశ్రాయేలు ప్రజలను.” అక్షరార్థంగా “ఇశ్రాయేలు కుమారులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోనులు
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చి, ఇద్దరూ కలిసి చేసిన చర్యను సహజమైన బహువచన రూపంతో వ్యక్తం చేశాం.
- source_word: עָשׂוּ אֶת כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: ఈ సూచక కార్యాలన్నిటినీ చేశారు
  rationale: מוֹפֵת అనే పదానికి అద్భుతమైన సూచన లేదా ఆశ్చర్యకార్యం అనే భావాలు ఉన్నాయి. ఇక్కడ దేవుని శక్తిని ఫరో ఎదుట వెల్లడించే కార్యాలు కాబట్టి ‘సూచక కార్యాలు’ అని ఇచ్చాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట
  rationale: లִפְנֵי యొక్క సమక్షత భావాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో ఇచ్చాం.
- source_word: וַיְחַזֵּק
  choice: కఠినపరిచాడు
  rationale: חזק యొక్క మూలభావం బలపరచడం లేదా దృఢపరచడం అయినప్పటికీ, ఫరో హృదయానికి సంబంధించిన నిర్గమకాండపు పునరావృత సందర్భంలో మొండితనంలో స్థిరపడే ఫలితాన్ని ‘కఠినపరిచాడు’ స్పష్టంగా తెలియజేస్తుంది. మూలపద చిత్రాన్ని పాదసూచికలో నిలిపాం.
- source_word: לֵב פַּרְעֹה
  choice: ఫరో హృదయాన్ని
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధరూపంలో నేరుగా వ్యక్తం చేశాం.
- source_word: וְלֹא שִׁלַּח
  choice: వెళ్లనివ్వలేదు
  rationale: שׁלח అంటే పంపడం లేదా పంపివేయడం. ఇశ్రాయేలు ప్రజలను విడుదల చేసే ఈ సందర్భంలో ‘వెళ్లనివ్వలేదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలిపి, అది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే విషయాన్ని పాదసూచికలో తెలిపాం.
- source_word: מֵאַרְצוֹ
  choice: తన దేశం నుంచి
  rationale: ఫరోకు చెందిన దేశం లేదా భూభాగం నుంచి బయలుదేరే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఫరో హృదయంపై యహ్వే చేసిన చర్య
  choice: యహ్వే ఫరో హృదయాన్ని కఠినపరిచాడు
  alternative: యహ్వే ఫరో హృదయాన్ని బలపరిచాడు / దృఢపరిచాడు
  rationale: దైవ చర్యను తగ్గించకుండా మూలవాక్యంలోని ప్రత్యక్ష కర్తృత్వాన్ని నిలిపాం. అదే సమయంలో חזק పదంలోని ‘బలపరచు/దృఢపరచు’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చి, దైవ సార్వభౌమత్వం మరియు ఫరో బాధ్యత మధ్యనున్న ఉద్రిక్తతను పరిష్కరించినట్లు చూపలేదు.
- issue: וְלֹא שִׁלַּח లో వ్యక్తం కాని కర్త
  choice: అతడు ... వెళ్లనివ్వలేదు
  alternative: మళ్లీ ‘ఫరో’ అని స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూలో కర్త సర్వనామంగా విడిగా కనిపించదు; సందర్భంలో ఫరోనే ఇశ్రాయేలును వెళ్లనివ్వని వ్యక్తి. ‘అతడు’ మూలంలోని సంక్షిప్త కథన ప్రవాహాన్ని కాపాడుతూ సందర్భానుసార అర్థాన్ని నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమష్టి భావం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని బంధుత్వపూర్వక పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అది మొత్తం ప్రజాసమూహాన్ని సూచించగలదని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఫరో ఎదుట,’ ‘తన దేశం నుంచి వెళ్లనివ్వలేదు’ వంటి రూపాలు సాధారణ పాఠకులకు సహజంగా ఉంటాయి. మూలంలోని వరుస וְ సంధులను తెలుగులో మూడు చిన్న వాక్యాలుగా విభజించి పఠనసౌలభ్యం కల్పించాం; సంఘటనల క్రమం మరియు భావసంబంధం మారలేదు.
