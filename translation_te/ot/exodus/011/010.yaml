- from: మోషే, అహరోనులు ఫరో ఎదుట ఈ సూచక కార్యాలన్నిటినీ చేశారు[a]. యహ్వే ఫరో హృదయాన్ని కఠినపరిచాడు[b]. అతడు ఇశ్రాయేలు కుమారులను[c] తన దేశం నుంచి వెళ్లనివ్వలేదు.
