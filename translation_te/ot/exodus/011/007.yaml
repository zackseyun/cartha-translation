source:
  edition: WLC
  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: te
  text: కాని ఇశ్రాయేలీయులందరిలో, మనిషి మొదలుకొని పశువు వరకు ఎవరి మీదైనా ఏ కుక్కా తన నాలుకను పదును పెట్టదు[a]. యాహ్వే ఐగుప్తుకూ ఇశ్రాయేలుకూ మధ్య వ్యత్యాసం చేస్తాడని మీరు తెలుసుకునేలా ఇలా జరుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ కుక్కా వారిమీద మొరగదు.” ఇది ఇశ్రాయేలీయులకు సంపూర్ణ ప్రశాంతత, భద్రత ఉంటాయని తెలిపే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: కాని ఇశ్రాయేలు ప్రజల్లో
  rationale: וּ సందర్భంలో ముందటి వాక్యంలోని ఐగుప్తు తీర్పుకు వ్యతిరేకమైన పరిస్థితిని సూచిస్తుంది. בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ జాతీయపదాన్ని ఆధునిక తెలుగులో సహజంగా, అందరినీ కలుపుకునేలా ‘ఇశ్రాయేలు ప్రజలు’ అని ఇచ్చాం.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: ఒక్క కుక్క కూడా తన నాలుకను పదును పెట్టదు
  rationale: חרץ యొక్క ‘పదును పెట్టు’ అనే సజీవ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. మొత్తం పదబంధం కుక్క మొరగడం లేదా శత్రుత్వ సూచన చేయడం కూడా జరగదనే నానుడి; స్పష్టత కోసం ఆ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: మనిషిమీద గానీ పశువుమీద గానీ
  rationale: మనుషులనుంచి పశువులవరకు ఎవరికీ హాని లేదా బెదిరింపు ఉండదనే సంపూర్ణ పరిధిని సహజమైన తెలుగు జత నిర్మాణంతో తెలిపాం.
- source_word: לְמַעַן תֵּדְעוּן
  choice: దీనివల్ల ... మీరు తెలుసుకుంటారు
  rationale: ఈ ప్రయోజన వాక్యం ఫలితంతో కూడిన ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; תֵּדְעוּן లోని బహువచన సంబోధనను ‘మీరు’గా నిలిపాం.
- source_word: יַפְלֶה
  choice: తేడా చూపిస్తాడు
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం అద్భుతం చేయడం కంటే రెండు వర్గాలను వేరుచేసి చూడడాన్ని సూచిస్తుంది. భవిష్య సందర్భానికి అనుగుణంగా ‘చూపిస్తాడు’ అన్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: ఐగుప్తుకూ ఇశ్రాయేలుకూ మధ్య
  rationale: హీబ్రూలో ఉన్న దేశ/జన సమూహాల పేర్లనే నిలిపి, రెండు పక్షాల మధ్య వ్యత్యాసాన్ని తెలుగు విభక్తులతో స్పష్టంగా తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. బిరుదైన ‘ప్రభువు’తో దాన్ని మార్చకుండా, యాహ్వే అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: ఐగుప్తు–ఇశ్రాయేలు మధ్య దేవుని చర్య స్వరూపం
  choice: తేడా చూపిస్తాడు
  alternative: వేరుచేస్తాడు; అద్భుతంగా వ్యవహరిస్తాడు
  rationale: יַפְלֶה ఇక్కడ రెండు సమూహాలకు కలిగే భిన్న ఫలితాన్ని సూచిస్తుంది. ‘తేడా చూపిస్తాడు’ అనేది దేవుని చర్యను స్పష్టంగా ఉంచుతూ, అది కేవలం భౌతిక విభజనే అని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని వాడుతూ, ‘నాలుకను పదును పెట్టదు’ అనే మూలంలోని సజీవ రూపకాన్ని నిలిపాం. ‘ఇశ్రాయేలు ప్రజలు’ సాధారణ పాఠకులకు ‘ఇశ్రాయేలు కుమారులు’ కంటే స్పష్టంగా, సమగ్రంగా ఉంటుంది. ‘ఐగుప్తు’ బైబిలు తెలుగు సంప్రదాయంలో సుపరిచితమైన దేశనామం; భాష మిగతా భాగంలో అనవసరంగా ప్రాచీన శైలిని వాడలేదు.
