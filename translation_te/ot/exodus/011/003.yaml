id: EXO.11.3
reference: Exodus 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: te
  text: యాహ్వే ఆ ప్రజలకు ఐగుప్తీయుల దృష్టిలో అనుకూలత కలిగేలా చేశాడు.[a] అంతేకాక, మోషే అనే మనిషి[b] ఐగుప్తు దేశంలో చాలా గొప్పవాడిగా ఉన్నాడు—ఫరో సేవకుల[c] దృష్టిలోనూ, ప్రజల దృష్టిలోనూ.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఐగుప్తీయుల కళ్లలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘మోషే అనే మనిషి’ అనే హీబ్రూ పదప్రయోగం మోషేను ప్రత్యేకంగా ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఫరో అధికారులు’ అని కూడా అనువదించవచ్చు; హీబ్రూలో అక్షరార్థంగా ‘ఫరో సేవకులు.’
    reason: lexical_alternative
  - marker: d
    text: చివర ఉన్న ‘ప్రజలు’ అనే మాట, ఫరో సేవకులకు భిన్నంగా ఐగుప్తులోని విస్తృత జనసమూహాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు దగ్గరైన రూపంగా ఇచ్చాం.
- source_word: וַיִּתֵּן ... חֵן
  choice: అనుకూలత కలిగేలా చేశాడు
  rationale: ఇక్కడ חֵן సామాజిక సందర్భంలో ఇతరుల సానుకూల ఆదరణను సూచిస్తుంది. ‘కృప’ అనేది అవసరానికి మించి మతపరమైన భావాన్ని కలిగించవచ్చు; ఈ తెలుగు ప్రయోగం ‘అనుగ్రహం పొందేలా చేశాడు’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ఆ ప్రజలు
  rationale: మూలంలో ‘ప్రజలు’ అని మాత్రమే ఉంది; సందర్భానుసారం ఇశ్రాయేలీయులని స్పష్టమైనా, మూలంలో లేని పేరును ప్రధాన వచనంలో చేర్చలేదు.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: ఐగుప్తీయుల దృష్టిలో
  rationale: ‘కళ్లలో’ అనే అక్షరార్థ రూపం కన్నా, దృక్పథం లేదా అంచనాను సూచించే హీబ్రూ నుడికారానికి ‘దృష్టిలో’ సహజమైన తెలుగు సమానార్థకం.
- source_word: גַּם
  choice: అంతేకాక
  rationale: మోషే స్థానం గురించి మరొక, కొంత ఉద్ఘాటితమైన విషయాన్ని చేర్చే సంధానార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָאִישׁ מֹשֶׁה
  choice: మోషే అనే మనిషి
  rationale: మూలంలో మోషే పేరుకు ముందు ‘మనిషి/వ్యక్తి’ అనే పదం ఉద్దేశపూర్వకంగా ఉంది. తెలుగులో చదవదగిన విధంగా దాని ప్రత్యేక ఉద్ఘాటనను నిలిపాం.
- source_word: גָּדוֹל מְאֹד
  choice: చాలా గొప్పవాడు
  rationale: గొప్పతనం, ప్రాముఖ్యత, ప్రతిష్ఠ వంటి విస్తృత భావసాధ్యతను సంకుచితం చేయకుండా మూలంలోని సాధారణమైనా బలమైన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలోని ‘ఐగుప్తు దేశంలో’ అనే పూర్తి భౌగోళిక పదబంధాన్ని నిలిపాం.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: ఫరో సేవకుల దృష్టిలో
  rationale: עֲבָדִים పదానికి ప్రత్యక్ష సమానార్థమైన ‘సేవకులు’ వాడాం; రాజసభ సందర్భంలో వారు అధికారులు కూడా కావచ్చు.
- source_word: וּבְעֵינֵי הָעָם
  choice: ప్రజల దృష్టిలోనూ
  rationale: మూలం తిరిగి ‘ప్రజలు’ అనే సాధారణ పదాన్నే వాడుతుంది. అది విస్తృత ఐగుప్తు జనాభాను సూచించే అవకాశం ఉన్నా, ప్రధాన వచనంలో ఆ అర్థాన్ని నిర్బంధించలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; దీనివల్ల మూలపాఠంలోని నామ స్వరూపం నిలుస్తుంది.
- issue: מֹשֶׁה ... גָּדוֹל מְאֹד లో మోషే గొప్పతనం యొక్క స్వభావం
  choice: చాలా గొప్పవాడు
  alternative: చాలా ప్రాముఖ్యమైనవాడు; ఎంతో గౌరవం పొందినవాడు
  rationale: మూలపాఠం గొప్పతనం రాజకీయమా, సామాజిక ప్రతిష్ఠా, లేక రెండూ కలిసినదా అని స్పష్టంగా పరిమితం చేయదు; అందువల్ల ఆ విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. హీబ్రూ నుడికారాన్ని తెలుగులో ‘దృష్టిలో’గా ఇచ్చి, మూలంలోని పునరుక్తిని నిలిపాం. మోషే గొప్పతనం ఏ రకమైనదో అవసరానికి మించి వివరించలేదు.
