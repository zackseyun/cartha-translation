source:
  edition: WLC
  text: וְ/יָרְד֣וּ כָל עֲבָדֶי/ךָ֩ אֵ֨לֶּה אֵלַ֜/י וְ/הִשְׁתַּֽחֲוּוּ לִ֣/י לֵ/אמֹ֗ר צֵ֤א אַתָּה֙ וְ/כָל הָ/עָ֣ם אֲשֶׁר בְּ/רַגְלֶ֔י/ךָ וְ/אַחֲרֵי כֵ֖ן אֵצֵ֑א וַ/יֵּצֵ֥א מֵֽ/עִם פַּרְעֹ֖ה בָּ/חֳרִי אָֽף־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: te
  text: “అప్పుడు నీ సేవకులైన[a] వీరందరూ నా దగ్గరకు దిగివచ్చి, నా ముందు సాగిలపడి, ‘నువ్వూ, నీ వెంట వచ్చే[b] ప్రజలందరూ బయలుదేరండి’ అని చెబుతారు. ఆ తర్వాత నేను బయలుదేరుతాను.” తరువాత అతడు మండే కోపంతో ఫరో దగ్గర నుంచి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సేవకులు” అనే హెబ్రీ పదం ఈ రాజసభ సందర్భంలో “అధికారులు” లేదా “రాజ పరివార సేవకులు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ పాదాల దగ్గర ఉన్న ప్రజలందరూ”; ఇది నీతో వచ్చే లేదా నిన్ను అనుసరించే వారిని సూచించే నానుడి.
    reason: idiom
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: దిగివచ్చి
  rationale: ירד అనే క్రియలోని ‘దిగడం’ అనే దిశార్థాన్ని నిలుపుతూ, మోషే దృష్టికోణం నుంచి వారు అతని దగ్గరకు రావడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులైన
  rationale: עבד అనే పదానికి సేవకులు, దాసులు, రాజసభ అధికారులు అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన ‘సేవకులు’ ఉంచి, ఈ రాజసభ సందర్భంలోని ‘అధికారులు’ అనే భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: నా ముందు సాగిలపడి
  rationale: శరీరాన్ని వంచి ప్రణమిల్లే చర్యను స్పష్టంగా తెలియజేస్తుంది; ఈ రాజసభ సందర్భంలో దానిని ఆరాధనగా అతిగా నిర్దిష్టం చేయదు.
- source_word: צֵא אַתָּה
  choice: నువ్వూ … బయలుదేరండి
  rationale: ఆజ్ఞ యొక్క బలాన్ని, אַתָּה అనే ఉద్ఘాటిత సర్వనామాన్ని నిలుపుతుంది. తెలుగులో తరువాత వచ్చే సమూహ కర్తతో సహజంగా సరిపడేలా బహువచన గౌరవేతర ఆజ్ఞారూపం వాడబడింది.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: నీ వెంట వచ్చే ప్రజలందరూ
  rationale: అక్షరార్థంగా ‘నీ పాదాల దగ్గర ఉన్న’ అనే హెబ్రీ నానుడి, ఒకరితో వెళ్లే లేదా అతనిని అనుసరించే వారిని సూచిస్తుంది. సహజమైన భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: ఆ తర్వాత నేను బయలుదేరుతాను
  rationale: కాలక్రమాన్ని నేరుగా తెలియజేస్తూ, ముందున్న יצא క్రియతో తెలుగు పదసామ్యాన్ని కొనసాగిస్తుంది.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: తరువాత అతడు … ఫరో దగ్గర నుంచి వెళ్లిపోయాడు
  rationale: హెబ్రీ పాఠంలో ఉన్న సర్వనామసూచిత కర్తను ‘అతడు’గా ఉంచి, సందర్భం ద్వారా అది మోషే అని గ్రహించేలా చేశాం; పేరును పాఠంలో అదనంగా చేర్చలేదు.
- source_word: בָּחֳרִי אָף
  choice: మండే కోపంతో
  rationale: కోపపు వేడి లేదా మండుట అనే హెబ్రీ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
