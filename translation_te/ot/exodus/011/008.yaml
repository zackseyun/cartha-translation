  source_fidelity: 'హెబ్రీ వచనంలోని క్రమం, అర్థం, మరియు ప్రధాన అంశాలు విశ్వసనీయంగా ప్రతిఫలించాయి: ఫరో సేవకులు మోషే దగ్గరకు దిగివచ్చుట, అతని ముందు సాగిలపడుట, ఫరోతో పాటు అతనిని అనుసరించే ప్రజలు బయలుదేరమని చెప్పుట, ఆపై మోషే బయలుదేరుట, కోపంతో ఫరోను విడిచి వెళ్లుట అన్నీ నిలిచాయి. “నీ వెంట వచ్చే ప్రజలందరూ” అనేది బְּרַגְלֶיךָ అనే నానుడికి సహజమైన, సముచితమైన భావానువాదం; పాదసూచిక అక్షరార్థాన్నీ అందిస్తుంది.'
