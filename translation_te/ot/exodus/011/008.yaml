translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. రాజసభ సందర్భానికి తగిన ‘సాగిలపడి’ అనే పదాన్ని ఎంచుకుని, హెబ్రీ దిశార్థం కోసం ‘దిగివచ్చి,’ నిర్గమన చర్యలో పదసామ్యం కోసం ‘బయలుదేరండి/బయలుదేరుతాను’ ఉంచాం. పాదసూచిక గుర్తులు [a], [b] సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
