source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు[c]: “నా అద్భుతాలు ఐగుప్తు దేశంలో మరింత ఎక్కువ కావడానికి ఫరో మీ మాట వినడు[a].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మాట ఆలకించడు” లేదా “మీ మాటకు చెవి ఇవ్వడు.” ఇక్కడ “మీ” అనేది మోషేను, అహరోనును కలిపి సూచించే బహువచనం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా సూచకాలు.” హీబ్రూ పదం అద్భుతాలు, సూచకాలు లేదా శకునాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని అనువాదాలు, ముందున్న కథన సందర్భంతో దీనిని కలపడానికి, “యాహ్వే మోషేతో ఇంతకుముందే ఇలా చెప్పాడు” అని అనువదిస్తాయి. అయితే హీబ్రూ క్రియారూపం స్వతహాగా సాధారణ కథన భూతకాలమే.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వయ్యిక్తోల్ రూపం సాధారణ కథన భూతకాలాన్ని సూచిస్తుంది; సందర్భాన్ని సులభతరం చేయడానికి పూర్వభూతకాలాన్ని చేర్చలేదు.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: మీ మాట వినడు
  rationale: שׁמע אֶל అంటే వినడం లేదా ఆలకించడం; ‘మీ మాట వినడు’ అనే సహజ తెలుగు ప్రయోగం తిరస్కార భావాన్ని ఉంచుతుంది, కానీ ‘లోబడడు’ అని అతిగా నిర్దిష్టం చేయదు. బహువచన ప్రత్యయం మోషే, అహరోనులను కలిపి సూచిస్తుంది.
- source_word: לְמַעַן
  choice: అందువల్ల
  rationale: ఈ సందర్భంలో ఉద్దేశం/ఫలితం రెండింటి ఛాయ ఉన్నప్పటికీ, దైవ ఉద్దేశాన్ని పూర్తిగా తొలగించకుండా సహజంగా అనుసంధానిస్తుంది.
- source_word: רְבוֹת
  choice: విస్తరిస్తాయి
  rationale: רבה అనే క్రియ ఇక్కడ సంఖ్య లేదా పరిమాణం పెరగడాన్ని సూచిస్తుంది; తెలుగులో ‘అద్భుతాలు విస్తరిస్తాయి’ సహజంగా ఆ పెరుగుదలను తెలియజేస్తుంది.
- source_word: מוֹפְתַי
  choice: నా అద్భుతాలు
  rationale: מוֹפֵת అద్భుతం, సూచకక్రియ, శకునం వంటి అర్థాలు ఇవ్వగలదు; నిర్గమకాండ సందర్భంలో అసాధారణ దైవకార్యాలను సూచించేందుకు ‘అద్భుతాలు’ సరిపోతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: אֶרֶץ అనే పదాన్ని ప్రతిబింబిస్తూ, సహజమైన తెలుగు రూపంలో పూర్తి పదబంధాన్ని నిలుపుకుంది.
theological_decisions:
- issue: ఫరో తిరస్కారంలో దైవ ఉద్దేశం
  choice: ఫరో వినకపోవడం ద్వారా ఐగుప్తులో దేవుని అద్భుతాలు విస్తరించనున్నాయని వాక్యం చెబుతుంది.
  alternative: ఫరో వినకపోవడం కేవలం అద్భుతాలు పెరగడానికి దారితీసే ఫలితమని మాత్రమే చదవడం.
  rationale: לְמַעַן సాధారణంగా ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; అయినా తెలుగు పాఠ్యంలో కారణ-ఫలిత ఛాయను కూడా పూర్తిగా మూసివేయకుండా, ఫరో బాధ్యత మరియు దేవుని ఉద్దేశం మధ్యనున్న ఉద్రిక్తతను వివరించి పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘మీ మాట’ ద్వారా హీబ్రూ బహువచనాన్ని స్పష్టంగా ఉంచింది. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది; పద్యంలోని ఉద్దేశం-ఫలితం ఉద్రిక్తతను పాదటిప్పణి మరియు నిర్ణయ వివరణలో సంరక్షించింది.
