revisions:
- from: 'యెహోవా మోషేతో ఇలా అన్నాడు: “ఫరో మీ మాట వినడు[a]. అందువల్ల ఐగుప్తు దేశంలో నా అద్భుతాలు విస్తరిస్తాయి[b].”[c]'
  to: 'యాహ్వే మోషేతో ఇలా అన్నాడు[c]: “నా అద్భుతాలు ఐగుప్తు దేశంలో మరింత ఎక్కువ కావడానికి ఫరో మీ మాట వినడు[a].”[b]'
  rationale: The revision aligns the divine name with the POB audit trail, restores the Hebrew purposive force of לְמַעַן, and uses a more natural Telugu expression for the increase of the wonders. Footnote anchors are retained and placed directly after the words to which they pertain.
