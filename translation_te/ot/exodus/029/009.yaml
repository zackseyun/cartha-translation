    issue: “తలపాగాలు” for מִגְבָּעוֹת
    rationale: This can suggest a turban. In the priestly vestment context, מִגְבָּעוֹת refers to the ordinary priests’ caps/head coverings, distinct from the high priest’s headpiece.
