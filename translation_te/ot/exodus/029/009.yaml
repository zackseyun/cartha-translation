  text: וְ/חָגַרְתָּ֩ אֹתָ֨/ם אַבְנֵ֜ט אַהֲרֹ֣ן וּ/בָנָ֗י/ו וְ/חָבַשְׁתָּ֤ לָ/הֶם֙ מִגְבָּעֹ֔ת וְ/הָיְתָ֥ה לָ/הֶ֛ם כְּהֻנָּ֖ה לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מִלֵּאתָ֥ יַֽד אַהֲרֹ֖ן וְ/יַד בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: te
  text: నీవు వారికి—అహరోనుకు, అతని కుమారులకు—నడికట్లు కట్టి, వారికి తలకప్పులు పెట్టాలి. యాజకత్వం శాశ్వతమైన శాసనంగా వారికి చెందుతుంది. ఈ విధంగా నీవు అహరోనును, అతని కుమారులను యాజకులుగా ప్రతిష్ఠించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అహరోను చేతిని, అతని కుమారుల చేతులను నింపాలి.” ఇది వారిని యాజక సేవలో నియమించి ప్రతిష్ఠించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: నడికట్లు కట్టి
  rationale: חגר అనే క్రియ, אַבְנֵט అనే యాజక వస్త్రంతో కలిసి, నడుము చుట్టూ కట్టి బిగించడాన్ని సూచిస్తుంది. ‘నడికట్లు కట్టి’ ఆధునిక తెలుగులో సహజంగా ఉండి వస్త్రధారణ చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַהֲרֹן וּבָנָיו
  choice: అంటే అహరోనుకు, అతని కుమారులకు
  rationale: ఈ సమానాధికార పదబంధం ‘వారికి’ ఎవరిని సూచిస్తుందో వివరిస్తుంది. ‘అంటే’ చేర్చడం హీబ్రూ వాక్య నిర్మాణంలోని వివరణాత్మక సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: వారికి తలపాగాలు చుట్టాలి
  rationale: חבש తలపై చుట్టడం లేదా కట్టడాన్ని సూచిస్తుంది; מִגְבָּעוֹת సాధారణ యాజకుల తల కప్పులను సూచిస్తుంది. ‘తలపాగాలు చుట్టాలి’ ఆ చర్యను, వస్త్ర స్వరూపాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: యాజకత్వం ... వారికి చెందుతుంది
  rationale: היתה להם అనే స్వామ్య ప్రయోగాన్ని ‘వారికి చెందుతుంది’ సహజంగా, నేరుగా వ్యక్తపరుస్తుంది; ఇది వారికి యాజక పదవి అప్పగించబడుతుందని తెలియజేస్తుంది.
- source_word: לְחֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֻקָּה స్థిరమైన శాసనాన్ని, עוֹלָם నిరంతర లేదా తరతరాల కాలవ్యాప్తిని సూచిస్తుంది. ‘శాశ్వతమైన శాసనం’ మూలపాఠంలోని బలాన్ని నిలుపుతూ దాని తాత్త్విక పరిమితులను అదనంగా నిర్ణయించదు.
- source_word: וּמִלֵּאתָ יַד
  choice: యాజకులుగా ప్రతిష్ఠించాలి
  rationale: ‘చేతిని నింపడం’ అనే హీబ్రూ సాంకేతిక నుడికారం యాజక సేవలో నియమించి ప్రతిష్ఠించడాన్ని సూచిస్తుంది. తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలియజేసేందుకు ‘యాజకులుగా ప్రతిష్ఠించాలి’ అని అనువదించి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: לְחֻקַּת עוֹלָם అనే ఆరాధనా-చట్ట సంబంధ కాలవ్యాప్తి పదబంధం
  choice: శాశ్వతమైన శాసనంగా
  alternative: నిరంతర శాసనంగా; తరతరాలకు శాసనంగా
  rationale: ఈ పదబంధం ఇశ్రాయేలు నిబంధనా వ్యవస్థలో యాజకత్వ నియామకానికి కొనసాగుతున్న స్థిరత్వాన్ని సూచిస్తుంది. ‘శాశ్వతమైన’ మూలంలోని עוֹלָם బలాన్ని కాపాడుతుంది; తరువాతి వేదాంత నిర్ణయాన్ని వాక్యంలోకి చేర్చదు.
- issue: וּמִלֵּאתָ יַד అనే యాజక ప్రతిష్ఠాపన నుడికారం
  choice: అహరోనును, అతని కుమారులను యాజకులుగా ప్రతిష్ఠించాలి
  alternative: అహరోను చేతిని, అతని కుమారుల చేతులను నింపాలి; వారిని యాజక సేవలో నియమించాలి
  rationale: అక్షరార్థం తెలుగులో ఉద్దేశాన్ని తెలియజేయదు. ‘యాజకులుగా ప్రతిష్ఠించాలి’ సాంకేతిక ఆరాధనా భావాన్ని స్పష్టంగా అందిస్తుంది; మూల నుడికారాన్ని పారదర్శకత కోసం పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ఆజ్ఞార్థక భావానికి ‘చేయాలి’ రూపం వాడబడింది. యాజక వస్త్రాలు, పదవి, ప్రతిష్ఠాపనకు సంబంధించిన సాంకేతిక భావాలు సాధ్యమైనంత స్పష్టంగా ఉంచబడ్డాయి.
