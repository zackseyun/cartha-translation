  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: te
  text: అతని కుమారులను దగ్గరకు తీసుకొచ్చి,[a] వారికి అంగీలు తొడిగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని కుమారులను ఆచారపూర్వకంగా ముందుకు తీసుకురావాలి.” హీబ్రూ క్రియ ఒకరిని ఆచారపూర్వక ప్రదర్శన కోసం ముందుకు తీసుకురావడం అనే భావాన్ని కూడా కలిగించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ఆరోను కుమారులను
  rationale: వావ్ సంధి ముందున్న ఆజ్ఞల క్రమాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా క్రియాక్రమంతో సహజంగా వ్యక్తమవుతుంది. ‘అతని’ అనే సర్వనామానికి సందర్భానుసార పూర్వపదమైన ఆరోనును స్పష్టంచేయడం సాధారణ పాఠకుడికి సహాయకరం.
- source_word: בָּנָיו
  choice: ఆరోను కుమారులను
  rationale: ఈ నామవాచకం పురుష సంతానాన్ని సూచిస్తుంది; యాజక ప్రతిష్ఠ సందర్భంలో ఆరోను కుమారులనే ఉద్దేశిస్తుంది.
- source_word: תַּקְרִיב
  choice: దగ్గరకు తీసుకొచ్చి
  rationale: קרב హిఫిల్ రూపం ‘దగ్గరకు తీసుకురావడం’ లేదా ఆచారపూర్వకంగా ‘సమర్పణకు ముందుకు తీసుకురావడం’ అనే భావాలను కలిగిస్తుంది. ప్రధాన పాఠం మూలంలోని స్థల/ఆచార భావాన్ని కాపాడుతుంది.
- source_word: וְהִלְבַּשְׁתָּם
  choice: వారికి … తొడిగించాలి
  rationale: ఈ సందర్భంలో వస్త్రాలు ధరింపజేయడాన్ని సూచిస్తుంది. తెలుగు ఆజ్ఞారూప క్రమంలో ‘తొడిగించాలి’ సహజంగాను గంభీరంగాను ఉంటుంది.
- source_word: כֻּתֳּנֹת
  choice: అంగీలు
  rationale: כֻּתֹּנֶת శరీరంపై ధరించే పొడవైన అంతర్వస్త్రం/ట్యూనిక్‌ను సూచిస్తుంది. ‘అంగీలు’ ఆధునిక తెలుగులో అర్థమయ్యే సమీప వస్త్రపదం; ‘వస్త్రాలు’ కంటే నిర్దిష్టమైనది, ‘అంగరఖాలు’ కంటే సహజమైనది.
