translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని వాడాం. హీబ్రూ వాక్యంలో కర్త ‘నీవు’ ఏకవచనం; సందర్భంలో మోషేకు ఇచ్చిన ఆజ్ఞ. తెలుగులో ‘తీసుకొచ్చి… తొడిగించాలి’ అనే నిర్మాణం ఆ కర్తను సహజంగా అంతర్లీనంగా ఉంచుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
