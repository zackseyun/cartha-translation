  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: te
  text: తర్వాత ఆ పొట్టేలును దాని ముక్కలుగా నరకాలి. దాని పేగులను[a], కాళ్లను కడిగి, వాటిని దాని ముక్కల మీద, దాని తల మీద ఉంచాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని లోపలి భాగాలను.’ హీబ్రూ పదం జంతువు లోపలి భాగాలను సాధారణంగా సూచించగలదు; అయితే బలి సందర్భంలో ‘పేగులు’ అనే నిర్దిష్ట అర్థం సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వాటిని దాని ముక్కల మీద, దాని తల మీద ఉంచాలి.’ ఈ మాటలు కడిగిన భాగాలను కోసిన ముక్కలు, తలతో కలిపి బలికి అమర్చడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ఆ పొట్టేలు
  rationale: బలి సందర్భంలో אַיִל మగ గొర్రెను, అంటే పొట్టేలును సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, నిర్దిష్టమైన పదం.
- source_word: תְּנַתֵּחַ
  choice: ముక్కలుగా నరకాలి
  rationale: పీయేల్ రూపంలోని נתח బలి కోసం జంతువును భాగాలుగా కోయడాన్ని సూచిస్తుంది; ‘నరకాలి’ ఆ ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִנְתָחָיו / נְתָחָיו
  choice: దాని ముక్కలు
  rationale: נְתָחִים కోసిన జంతువు భాగాలను సూచిస్తుంది; ‘ముక్కలు’ సులభంగా అర్థమయ్యే సహజ తెలుగు.
- source_word: קִרְבּוֹ
  choice: దాని పేగులు
  rationale: קֶרֶב సాధారణంగా లోపలి భాగాలను సూచించగలిగినా, బలి సందర్భంలో కడగవలసిన అంతర్భాగాలు లేదా పేగులను సూచిస్తుంది; ప్రధాన పాఠంలో ‘పేగులు’ స్పష్టంగా ఉంటుంది, విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כְרָעָיו
  choice: దాని కాళ్లు
  rationale: כְּרָעַיִם జంతువు కాళ్లను, ముఖ్యంగా కింది కాలి భాగాలను సూచిస్తుంది; ‘కాళ్లు’ ఆధునిక పాఠకులకు సహజమైన పదం.
- source_word: וְנָתַתָּ עַל
  choice: వాటిని ... మీద ... ఉంచాలి
  rationale: עַל యొక్క సాధారణ స్థలార్థమైన ‘మీద’ను నిలుపుతూ, కడిగిన భాగాలను కోసిన ముక్కలు మరియు తలపై అమర్చే బలి చర్యను యథాతథంగా వ్యక్తం చేస్తుంది.
- source_word: רֹאשׁוֹ
  choice: దాని తల
  rationale: మూలంలోని శరీర భాగాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: וְ
  choice: తర్వాత / -ి,
  rationale: వరుస ఆజ్ఞల క్రమాన్ని మొదట ‘తర్వాత’తో, తరువాత తెలుగు సంయుక్త క్రియ నిర్మాణంతో సహజంగా వ్యక్తం చేశాం.
