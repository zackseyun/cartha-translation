translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞాత్మక శైలిని వాడాం. హీబ్రూ ఏకవచన రెండవ పురుష ఆజ్ఞను తెలుగులో సహజమైన విధి సూచక ‘-ాలి’ రూపంతో అందించాం; עַל అనే పదంలోని ‘మీద’ భావాన్ని ప్రధాన పాఠంలో నిలిపాం.
