source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/יָצַקְתָּ֖ עַל רֹאשׁ֑/וֹ וּ/מָשַׁחְתָּ֖ אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/007.yaml
  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: te
  text: తర్వాత అభిషేక తైలాన్ని తీసుకొని, అతని తలపై పోసి, అతన్ని అభిషేకించాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తర్వాత ... తీసుకొని
  rationale: సూచనల క్రమంలో వావ్‌తో కూడిన క్రియ తదుపరి చర్యను తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘తర్వాత’ క్రమాన్ని సహజంగా చూపుతుంది; ‘తీసుకొని’ తరువాతి సమన్విత చర్యలతో సాఫీగా కలుస్తుంది.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలాన్ని
  rationale: ఈ నిర్మాణం అభిషేకానికి ఉపయోగించే ప్రత్యేక తైలాన్ని సూచిస్తుంది. ‘అభిషేక తైలం’ ఆచారపరమైన భావాన్ని కాపాడే సహజమైన, గౌరవప్రదమైన తెలుగు పదబంధం.
- source_word: וְיָצַקְתָּ
  choice: పోసి
  rationale: יצק యొక్క సాధారణ అర్థం ‘పోయడం.’ ‘పోసి’ అనే రూపం చర్యల క్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַל רֹאשׁוֹ
  choice: అతని తలపై
  rationale: మూలంలోని ఉపసర్గ మరియు శరీర భాగాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: అతన్ని అభిషేకించాలి
  rationale: משׁח అనే క్రియకు ఆచారపరమైన నిర్దిష్ట అర్థం ‘అభిషేకించడం.’ ‘ప్రతిష్ఠించాలి’ వంటి వివరణాత్మక ప్రత్యామ్నాయాన్ని వాడకుండా మూలంలోని చర్యను నిలుపుతుంది; ‘చాలి’ ఆదేశ స్వరాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తైలం పోయడం మరియు అభిషేకించడం అనే ఆచార క్రమం
  choice: ‘అతని తలపై పోసి, అతన్ని అభిషేకించాలి’ అంటూ రెండు చర్యలనూ వేర్వేరుగా నిలుపడం
  alternative: ‘అతని తలపై పోసి అతన్ని అభిషేకించాలి’ అనే చర్యను అభిషేక విధానానికి వివరణగా మాత్రమే కుదించడం
  rationale: హీబ్రూ మూలం ‘పోయడం,’ ‘అభిషేకించడం’ అనే రెండు సమన్విత క్రియలను ఉపయోగిస్తుంది. రెండింటినీ ఉంచడం ద్వారా భౌతిక చర్యతో పాటు ప్రతిష్ఠాపక ఆచార చర్య కూడా స్పష్టంగా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘తైలం,’ ‘అభిషేకించాలి’ అనే పదాలు బైబిలు ఆచారార్థాన్ని కాపాడుతాయి.
