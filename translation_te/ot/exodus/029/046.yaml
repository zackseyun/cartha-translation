  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: te
  text: తమ దేవుడైన యెహోవానైన నేనే, వారి మధ్య నివసించడానికి[a] వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చానని వారు తెలుసుకుంటారు. నేనే యెహోవాను, వారి దేవుడను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారి మధ్యలో నేను నివసించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: వారు తెలుసుకుంటారు
  rationale: సందర్భంలో ఈ రూపం ముందున్న వాగ్దానాల ఫలితంగా భవిష్యత్తులో కలిగే గుర్తింపును సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన భవిష్యత్ వ్యక్తీకరణను వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֵיהֶם
  choice: వారి దేవుడు
  rationale: రూపం బహువచనాకారంలో ఉన్నప్పటికీ, యెహోవాను సూచించే ఈ నిబంధన సందర్భంలో అర్థం ఏకవచనం.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: నేనే వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను
  rationale: నిర్గమ సంఘటనను స్పష్టంగా తెలిపే మూలభాషా నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం; ‘నేనే’ వక్తను ఉద్ఘాటిస్తుంది.
- source_word: לְשָׁכְנִי
  choice: నివసించడానికి
  rationale: לְ తో కూడిన క్రియానామ రూపం ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది; ‘నివసించడానికి’ ఆ ప్రయోజనార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְתוֹכָם
  choice: వారి మధ్య
  rationale: అక్షరార్థంగా ‘వారి నడుమ/మధ్యలో’; ‘వారి మధ్య’ ఆధునిక తెలుగులో సహజంగా ఉండి దేవుని సన్నిధి వారి సమాజంలో ఉండడాన్ని తెలియజేస్తుంది.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: నేనే యెహోవాను, వారి దేవుడను
  rationale: హీబ్రూ నిబంధన సూత్రంలోని ఉద్ఘాటనను ‘నేనే’ ద్వారా, దైవనామం మరియు సంబంధాన్ని వేరుచేసే విరామంతో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. తెలుగులో సాధారణ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన పాండిత్యపరమైన రూపం.
- issue: నిర్గమానికి ఉద్దేశాన్ని తెలిపే వాక్యభాగం
  choice: వారి మధ్య నివసించడానికి
  alternative: వారి మధ్య నేను నివసించేలా
  rationale: לְשָׁכְנִי లోని ఉద్దేశార్థాన్ని స్పష్టంగా నిలిపాం; విమోచన దేవుడు తన ప్రజల మధ్య నివసించాలనే ఉద్దేశంతో జరిగిందని మూలపాఠమే చెబుతుంది.
- issue: అనుబంధ వాక్యం ఎవరిని విశేషిస్తుందనే నిర్మాణాత్మక అస్పష్టత
  choice: మొదటి వాక్యాన్ని ముగించి, ‘నేనే వారిని...’ అని స్వతంత్ర వాక్యంగా ఇచ్చాం
  alternative: ‘ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన యెహోవానైన నేనే వారి దేవుడనని...’
  rationale: אֲשֶׁר భాగం ముందున్న ‘యెహోవా వారి దేవుడు’ అనే మొత్త భావాన్ని విశేషించవచ్చు. తెలుగులో స్వతంత్ర వాక్యం మూలార్థాన్ని స్పష్టంగా అందిస్తూనే అనవసరంగా ఒక్క పదానికే సంబంధింపజేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా నిబంధన ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. దైవనామం ‘యెహోవా’గా నిలిపి, ‘నేనే’ ద్వారా హీబ్రూ אֲנִי యొక్క ఉద్ఘాటనను వ్యక్తం చేశాం.
