  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: te
  text: అహరోనును, అతని కుమారులను సమాగమపు గుడారం ప్రవేశద్వారం దగ్గరకు తీసుకురా[a]; వారిని నీళ్లతో కడుగు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహరోనును, అతని కుమారులను హాజరుపరచు.” హీబ్రూ క్రియ ఆచారక్రియ కొరకు ఒకరిని అధికారికంగా ముందుకు తీసుకురావడం అనే భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: దగ్గరికి తీసుకువచ్చి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరికి తీసుకురావడం’ లేదా ఆచారక్రియ కోసం ‘సమర్పించడం’ అనే భావాలను కలిగి ఉంటుంది. సందర్భంలోని సమీపింపజేసే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: గమ్యస్థానం వైపు కదలికను సూచిస్తుంది; ‘ప్రవేశద్వారం దగ్గరికి’ అనేది తెలుగులో సహజంగా ఉంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: ఇది తెరువు లేదా ప్రవేశస్థలాన్ని సూచిస్తుంది; తప్పనిసరిగా బిగించిన తలుపు ఉందనే భావాన్ని కలిగించదు.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: దేవుడు నియమిత స్థలంలో తన ప్రజలను కలుసుకునే ఆరాధనా గుడారానికి తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పేరు.
- source_word: וְרָחַצְתָּ
  choice: కడుగు
  rationale: רחץ అంటే కడగడం లేదా స్నానం చేయించడం. వరుస ఆదేశాన్ని తెలుగులో సహజమైన ఏకవచన ఆజ్ఞారూపంతో తెలియజేస్తుంది.
- source_word: בַּמָּיִם
  choice: నీళ్లతో
  rationale: בְּ ఇక్కడ సాధనార్థకంగా అర్థం కావచ్చు; ‘నీళ్లతో కడుగు’ ఆధునిక తెలుగులో సహజంగా ఉండి సాధనాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తిపేరును లిప్యంతరీకరించింది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ఇక్కడ పురుష సంతానాన్ని ప్రత్యేకంగా సూచిస్తుంది; యాజక ప్రతిష్ఠ సందర్భంలో ఈ నిర్దిష్టత ముఖ్యమైనది.
theological_decisions:
- issue: యాజక ప్రతిష్ఠ సందర్భంలో קרב పదంలోని ఆరాధనా భావం
  choice: అహరోనును, అతని కుమారులను ... దగ్గరికి తీసుకువచ్చి
  alternative: అహరోనును, అతని కుమారులను ... సమర్పించి
  rationale: ‘దగ్గరికి తీసుకురావడం’ మూలంలోని సమీపింపజేసే భావాన్ని నిలుపుతుంది; ‘సమర్పించడం’ ఆచార సంబంధ భావాన్ని స్పష్టం చేసినా కొంత ఎక్కువ వ్యాఖ్యానాత్మకంగా ఉంటుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం అసలు పదంలోని అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘ప్రత్యక్షపు గుడారం’ అనే పరిచిత ఆరాధనా పదబంధాన్ని నిలిపి, క్రియలోని ఆచార సంబంధ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో చూపించాం.
