source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: te
  text: నేను ఇశ్రాయేలు కుమారుల[a] మధ్య[b] నివసిస్తాను; వారి దేవుడిగా ఉంటాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల.’ హీబ్రూ అక్షరార్థం ‘ఇశ్రాయేలు కుమారుల.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నడుమ.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారికి దేవుడిగా ఉంటాను.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: నేను … నివసిస్తాను
  rationale: שׁכן ఇక్కడ ఒక సమాజం మధ్య స్థిరంగా నివసించడాన్ని సూచిస్తుంది. ‘నివసిస్తాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, దేవుని సన్నిధి అనే భావాన్ని అనవసరంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్య
  rationale: ప్రజాసమూహంతో వచ్చిన בְּתוֹךְ వారి నడుమ లేదా వారిలో ఉండడాన్ని సూచిస్తుంది. ‘మధ్య’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ మూలంలోని కుటుంబసంబంధ రూపకాన్నీ పుంలింగ బహువచన రూపాన్నీ ప్రధాన పాఠ్యంలో నిలుపుతూ, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְהָיִיתִי
  choice: ఉంటాను
  rationale: היה ఇక్కడ స్థితిమార్పుకన్నా నిబంధనాత్మక సంబంధాన్ని తెలియజేస్తుంది; అందువల్ల ‘అవుతాను’ కంటే ‘ఉంటాను’ తగినది.
- source_word: לָהֶם לֵאלֹהִים
  choice: వారి దేవుడిగా
  rationale: అక్షరార్థ నిర్మాణం ‘వారికి దేవుడిగా’ అయినా, ‘వారి దేవుడిగా’ తెలుగులో సహజమైన నిబంధన సూత్రాన్ని వ్యక్తం చేస్తూ సంబంధార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: నిబంధన సూత్రం అనువాదం
  choice: వారి దేవుడిగా ఉంటాను
  alternative: వారికి దేవుడిగా ఉంటాను
  rationale: ప్రధాన పాఠ్యంలోని రూపం తెలుగులో సహజంగా ఉండి దేవునికీ ఇశ్రాయేలుకీ మధ్య నిబంధన సంబంధాన్ని వ్యక్తం చేస్తుంది; దత్తివాచక హీబ్రూ నిర్మాణానికి దగ్గరైన రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ప్రజాసమూహానికి లింగసూచక సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలపాఠ్యంలో ఉన్న ‘కుమారులు’ అనే పుంలింగ కుటుంబసంబంధ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత సాధారణమైన సమూహనామాన్ని ప్రత్యామ్నాయంగా సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు సమాంతర భవిష్యత్ క్రియలను అర్ధవిరామంతో అనుసంధానించి, తెలుగులో భారంగా వినిపించే పునరుక్త సంధిని నివారించాం.
