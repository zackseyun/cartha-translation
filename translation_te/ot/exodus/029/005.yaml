translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆదేశాత్మక సందర్భానికి తగిన గౌరవప్రదమైన, సులభమైన శైలి. సాంకేతిక యాజక పదమైన ‘ఏఫోదు’ను లిప్యంతరీకరించి, ఇతర వస్త్ర భాగాలను సాధారణ పాఠకులకు అర్థమయ్యే పదాలతో ఇచ్చాం. హీబ్రూ వాక్యంలోని పొడవైన జాబితాను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
