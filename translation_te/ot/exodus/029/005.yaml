source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/בְּגָדִ֗ים וְ/הִלְבַּשְׁתָּ֤ אֶֽת אַהֲרֹן֙ אֶת הַ/כֻּתֹּ֔נֶת וְ/אֵת֙ מְעִ֣יל הָ/אֵפֹ֔ד וְ/אֶת הָ/אֵפֹ֖ד וְ/אֶת הַ/חֹ֑שֶׁן וְ/אָפַדְתָּ֣ ל֔/וֹ בְּ/חֵ֖שֶׁב הָ/אֵפֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: te
  text: తర్వాత నీవు ఆ వస్త్రాలను తీసుకొని అహరోనుకు అంగీని, ఏఫోదు పైవస్త్రాన్ని, ఏఫోదును, వక్షపటకాన్ని[b] తొడిగించాలి. ఏఫోదును అతనికి ఏఫోదుకు చెందిన కళాత్మకంగా నేసిన నడికట్టుతో బిగించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దానితో అతనికి కట్టాలి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ అరుదైనది; ఏఫోదును అహరోనుకు కట్టడం లేదా బిగించి అమర్చడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయ అనువాదాల్లో కొన్నిసార్లు ‘వక్షకవచం’ అని ఉంటుంది. అయితే హీబ్రూ పదం యుద్ధకవచం కంటే ఛాతీపై ధరించే ప్రత్యేక పటకాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తర్వాత నీవు ... తీసుకొని
  rationale: ఆదేశాల వరుసలో వావ్‌కు ఉన్న తదుపరి చర్య భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తర్వాత’ తెలియజేస్తుంది.
- source_word: הַבְּגָדִים
  choice: ఆ వస్త్రాలు
  rationale: యాజక సంబంధ సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదం; తరువాతి సంఘ సంబంధ ‘ఆచార వస్త్రాలు’ వంటి భావాన్ని చేర్చదు.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: అహరోనుకు తొడిగించాలి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַכֻּתֹּנֶת
  choice: అంగీ
  rationale: శరీరానికి దగ్గరగా ధరించే ప్రాథమిక పొడవాటి వస్త్రాన్ని సూచించే, సాధారణ పాఠకులకు అర్థమయ్యే పదం.
- source_word: מְעִיל הָאֵפֹד
  choice: ఏఫోదు పైవస్త్రం
  rationale: ఏఫోదుతో అనుబంధమైన మేయీల్ అనే వస్త్రాన్ని సాంకేతికత కోల్పోకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֵפֹד
  choice: ఏఫోదు
  rationale: ఖచ్చితమైన తెలుగు సమానార్థకం లేని ప్రత్యేక యాజక వస్త్రానికి లిప్యంతరీకరణను నిలుపుతుంది.
- source_word: הַחֹשֶׁן
  choice: వక్షపటకం
  rationale: ఛాతీపై ధరించే ప్రత్యేక భాగాన్ని సూచిస్తుంది; యుద్ధకవచం అనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: וְאָפַדְתָּ לוֹ
  choice: దానిని అతనికి బిగించాలి
  rationale: అరుదైన אפד క్రియకు ఉన్న ధరింపజేయడం/కట్టడం/బిగించడం అనే పరిధిలో, సందర్భంలోని ఏఫోదును నడికట్టుతో అమర్చే చర్యను స్పష్టంగా తెలుపుతుంది.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: ఏఫోదుకు చెందిన నైపుణ్యంగా నేసిన నడికట్టుతో
  rationale: חֵשֶׁב ఇక్కడ ఏఫోదుతో అనుసంధానమైన కళాత్మకంగా నేసిన బిగింపు పట్టాను సూచిస్తుంది; ‘నడికట్టు’ దాని ఉపయోగాన్ని సహజంగా తెలియజేస్తుంది.
