source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: te
  text: అది అహరోనుకూ అతని కుమారులకూ ఇశ్రాయేలీయుల నుండి శాశ్వతమైన వాటాగా చెందాలి; ఎందుకంటే అది ప్రత్యేక కానుక. అది ఇశ్రాయేలీయుల సమాధాన బలుల[a] నుండి యెహోవాకు వారి ప్రత్యేక కానుకగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సమాధాన బలులు’ అనే హీబ్రూ పదాన్ని ‘సహవాస బలులు’ లేదా ‘క్షేమ బలులు’ అని కూడా అనువదించవచ్చు; అది సమాధానం, సంపూర్ణ క్షేమం, పునరుద్ధరించబడిన సంబంధం వంటి భావాలను కలిగి ఉంది.
    reason: శְׁלָמִים అనే ఆరాధనా పదంలోని విస్తృత భావపరిధిని సూచించడం.
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: అది అహరోనుకూ అతని కుమారులకూ ... చెందాలి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఉండాలి’ అయినా, ఇక్కడ యాజకులకు కేటాయించిన భాగంపై హక్కును సూచిస్తుంది; ‘చెందాలి’ తెలుగు న్యాయ-ఆరాధనా సందర్భంలో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְחָק עוֹלָם
  choice: శాశ్వతమైన నియమం ప్రకారం
  rationale: חֹק ఒక నిర్దేశిత నియమం లేదా కట్టడను, עוֹלָם నిరంతరంగా అమలులో ఉండే స్వభావాన్ని సూచిస్తాయి. ‘శాశ్వతమైన నియమం’ మూలంలోని న్యాయబలాన్ని నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం కంటే ప్రజాసమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תְרוּמָה
  choice: ప్రతిష్ఠిత భాగం
  rationale: ఈ పదం దేవునికి ప్రత్యేకంగా వేరుచేసి సమర్పించిన భాగాన్ని సూచిస్తుంది. ‘అర్పణ’ మాత్రమే అంటే విస్తృతార్థం వస్తుంది; ‘ప్రతిష్ఠిత భాగం’ ఈ వచనంలోని కేటాయించిన బలి భాగాన్ని స్పష్టపరుస్తుంది.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: వారి సమాధాన బలుల నుండి
  rationale: זִבְחֵי యొక్క బలి భావాన్ని ‘బలులు’లో నిలుపుతూ, שְׁלָמִיםకు సంప్రదాయబద్ధమైన ‘సమాధాన బలులు’ వాడబడింది; దాని విస్తృత భావపరిధి పాదసూచికలో ఇవ్వబడింది.
- source_word: תְּרוּמָתָם לַיהוָה
  choice: యెహోవాకు వారు అర్పించే ప్రతిష్ఠిత భాగం
  rationale: స్వామ్యార్థక ప్రత్యయం ఇశ్రాయేలీయుల సమర్పణను సూచిస్తుంది; לַיהוָה ఆ సమర్పణ దేవునికి ఉద్దేశించబడిందని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో దైవనామాన్ని స్పష్టంగా సూచించే సుపరిచిత రూపం; మూలంలోని వ్యక్తిగత నామాన్ని సాధారణ బిరుదుగా మార్చదు.
theological_decisions:
- issue: שְׁלָמִים అనే ఆరాధనా పదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ పదంలో సమాధానం, సంపూర్ణ క్షేమం, దేవునితో సహవాసం వంటి భావాలు ఉన్నాయి. ప్రధాన పాఠంలో స్థిరపడిన పదాన్ని ఉంచి, దాని భావపరిధిని పాదసూచికలో సంరక్షించాం.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచడం మూలపాఠానికి పారదర్శకంగా ఉంటుంది; ప్రత్యామ్నాయ ఉచ్చారణను పాదసూచికలో సూచించాం.
- issue: עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన
  alternative: నిరంతరమైన
  rationale: ఆరాధనా-న్యాయ సందర్భంలో ఇది తరతరాలపాటు కొనసాగే స్థిర నియమాన్ని సూచిస్తుంది; తాత్వికంగా అంతంలేని కాలమనే వివరణను పాఠంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ న్యాయపరమైన పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, అసహజమైన పదక్రమాన్ని సహజ తెలుగు వాక్య నిర్మాణంగా మార్చాం.
