  text: ఆ పొట్టేలును వధించి, దాని రక్తాన్ని తీసుకొని బలిపీఠం మీద చుట్టూ చల్లాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: వధించాలి
  rationale: ఆచారబలి సందర్భంలోని జంతు సంహారాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאַיִל
  choice: ఆ పొట్టేలు
  rationale: నిర్దిష్టమైన మగ గొర్రెను సూచించే పదం; హీబ్రూ నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ ద్వారా నిలుపుతుంది.
- source_word: וְזָרַקְתָּ
  choice: చల్లాలి
  rationale: బలిపీఠం వైపు రక్తాన్ని విసరడం/చిమ్మడం అనే ఆచార చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; కేవలం పోయడం అనే భావాన్ని ఇవ్వదు.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: బలిపీఠం చుట్టూ దాని మీద
  rationale: రక్తం బలిపీఠం మీద పడేలా దాని అన్ని వైపులా చేయాలనే స్థల సంబంధాన్ని నిలుపుతుంది.
