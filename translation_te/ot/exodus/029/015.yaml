lexical_decisions:
- source_word: וְ/אֶת
  choice: తర్వాత
  rationale: సూచనల వరుసలో తదుపరి చర్యను పరిచయం చేసే సంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָ/אַיִל
