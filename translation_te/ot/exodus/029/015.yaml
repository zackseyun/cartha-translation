  rationale: אַיִל అనేది మగ గొర్రెను, ముఖ్యంగా బలి సందర్భంలో పొట్టేలును సూచిస్తుంది.
- source_word: הָ/אֶחָד
  choice: ఆ ఒక
  rationale: హీబ్రూ పదబంధంలోని నిర్దిష్టతను నిలుపుతూ, దీన్ని ముందుగానే ‘మొదటి’ అనే క్రమసంఖ్యగా వ్యాఖ్యానించకుండా మరో పొట్టేలు నుండి వేరు చేస్తుంది.
- source_word: תִּקָּח
  choice: తీసుకోవాలి
  rationale: మోషేను ఉద్దేశించిన ఏకవచన ఆదేశ భావాన్ని ఆధునిక తెలుగు విధాయక శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְ/סָמְכוּ
  choice: ఉంచాలి
  rationale: సమర్పణ జంతువు తలపై చేతులు ఉంచే ఆచార చర్యను స్పష్టంగా తెలియజేస్తుంది; మూల క్రియలో ఒత్తి ఆనించే భావం ఉండగలిగినా దాన్ని అతిగా వివరించదు.
- source_word: אַהֲרֹן וּ/בָנָיו
  choice: అహరోను, అతని కుమారులు
  rationale: యాజక ప్రతిష్ఠ సందర్భంలో బָּנִים అహరోను కుమారులనే సూచిస్తుంది.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులను
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, కర్తలవైపు తిరిగి సూచించే సహజ తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- source_word: עַל רֹאשׁ
  choice: తల మీద
  rationale: స్థాన సంబంధాన్ని స్పష్టమైన సాధారణ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָ/אָיִל
  choice: ఆ పొట్టేలు
  rationale: అదే నిర్దిష్ట జంతువును తిరిగి సూచిస్తూ మూలంలోని నామపద పునరుక్తిని స్పష్టత కోసం నిలుపుతుంది.
theological_decisions:
- issue: బలి ప్రతిష్ఠాచారంలో చేతులు ఉంచడాన్ని సూచించే పదప్రయోగం
  choice: తమ చేతులను ఆ పొట్టేలు తల మీద ఉంచాలి
  alternative: తమ చేతులను ఆ పొట్టేలు తల మీద ఆనించాలి
  rationale: סמך క్రియలో ఆనించడం లేదా బరువు మోపడం అనే ఛాయ ఉండవచ్చు. అయితే ఈ వచనం చెప్పే ఆచార చర్యను మాత్రమే అనువదించి, దాని ప్రతీకార్థం గురించి వచనంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే విధాయక శైలి. ‘ఆ ఒక’ అనే కొద్దిగా గుర్తించదగిన నిర్మాణాన్ని మూలంలోని నిజమైన నిర్దిష్టత మరియు ‘ఒకటి/మొదటిది’ మధ్య ఉన్న వ్యాఖ్యాన అవకాశాన్ని కాపాడటానికి ఉద్దేశపూర్వకంగా ఉంచి పాదటిప్పణితో వివరించబడింది.
