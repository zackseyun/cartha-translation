source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: te
  text: నీవు అతని తలపై తలపాగాను ఉంచి, ఆ తలపాగాపై పవిత్ర కిరీటాన్ని[a] పెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్ర శిరోభూషణం.’ హీబ్రూ נֵזֶר (నేజెర్) ప్రతిష్ఠకు గుర్తుగా ధరించే కిరీటసదృశ అలంకారాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: నీవు … ఉంచి
  rationale: שׂים అంటే ‘పెట్టు, ఉంచు.’ ఆచార సంబంధమైన క్రమబద్ధ చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘ఉంచి’ అని అనువదించాం; ఏకవచన ద్వితీయ పురుష ఆదేశ భావాన్ని ‘నీవు … పెట్టాలి’ అనే వాక్య నిర్మాణంలో నిలిపాం.
- source_word: הַמִּצְנֶפֶת
  choice: తలపాగా
  rationale: מִצְנֶפֶת యాజకుడు ధరించే చుట్టిన శిరోవస్త్రాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండే ‘తలపాగా’ను ఎంచుకున్నాం; మతసంప్రదాయ ప్రత్యేకార్థాలు కలిగించే పదాలను నివారించాం.
- source_word: עַל רֹאשׁוֹ
  choice: అతని తలపై
  rationale: స్థానాన్ని తెలిపే హీబ్రూ పదబంధాన్ని నేరుగా, సహజంగా అనువదించాం.
- source_word: וְנָתַתָּ
  choice: పెట్టాలి
  rationale: נתן ఇక్కడ ఒక వస్తువును నిర్దిష్ట స్థానంలో పెట్టడాన్ని సూచిస్తుంది. తెలుగులో ఆదేశాత్మక విధానాన్ని సహజంగా వ్యక్తం చేయడానికి ‘పెట్టాలి’ అని ఇచ్చాం.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: పవిత్ర కిరీటం
  rationale: נֵזֶר ప్రతిష్ఠకు లేదా అంకితస్థితికి గుర్తుగా ధరించే కిరీటసదృశ అలంకారాన్ని సూచించగలదు. ‘పవిత్ర కిరీటం’ మూలంలోని పవిత్రత భావాన్ని స్పష్టంగా ఉంచుతుంది; అది సాధారణ రాజకిరీటమేననే అపార్థాన్ని తగ్గించేందుకు పాదసూచికలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
- source_word: עַל הַמִּצְנָפֶת
  choice: ఆ తలపాగాపై
  rationale: עַל తెలిపే స్థాన సంబంధాన్ని ‘పై’తో నిలిపాం. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు పునరుక్త నామవాచకానికి ‘ఆ’ చేర్చాం.
