  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: te
  text: నీవు ఆ పొట్టేలును మొత్తంగా బలిపీఠం మీద దహింపవలెను. అది యహ్వేకు దహనబలి; యహ్వేకు సువాసనగల పరిమళం[a], యహ్వేకు అగ్నిచే అర్పించే బలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాంతినిచ్చే సువాసన.” ఇది యహ్వేకు ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన హీబ్రూ బలి సంబంధ పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆహార అర్పణ.” ఈ హీబ్రూ బలి పదాన్ని సంప్రదాయంగా “అగ్నితో అర్పించే బలి” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: దహించాలి
  rationale: קטר హిఫీల్ రూపం బలిని బలిపీఠంపై పొగగా పైకి లేపేలా కాల్చడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దహించాలి’ సహజంగా ఉండి బలి సందర్భాన్ని నిలుపుతుంది.
- source_word: כָּל הָאַיִל
  choice: ఆ పొట్టేలును మొత్తంగా
  rationale: אַיִל మగ గొర్రెను, అంటే పొట్టేలును సూచిస్తుంది; כָּל ఇక్కడ దానిలో ఏ భాగాన్నీ మినహాయించకుండా మొత్తం అర్పించాలని నొక్కిచెబుతుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశను సూచించే ־ָה అంత్యప్రత్యయం ఉన్నప్పటికీ, బలి అక్కడ కాల్చబడుతున్నందున తెలుగులో ‘బలిపీఠం మీద’ సందర్భానుకూలమైన సహజ రూపం.
- source_word: עֹלָה
  choice: దహనబలి
  rationale: మొత్తం బలిని కాల్చి అర్పించే ఈ బలివిధానికి ‘దహనబలి’ తెలుగు బైబిలు వాడుకలో స్థిరమైన, అర్థవంతమైన పదం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: לְ అర్పణ యొక్క గ్రహీతను లేదా అంకితభావాన్ని సూచిస్తుంది. יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: רֵיחַ נִיחוֹחַ
  choice: ఇంపైన సువాసన
  rationale: ఇది దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన బలి సంబంధ పదబంధం. ‘ఇంపైన సువాసన’ ఆమోదభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אִשֶּׁה
  choice: అగ్న్యర్పణ
  rationale: ఈ అరుదైన బలి పదం అగ్నిలో అర్పించిన అర్పణను సూచిస్తుంది. ‘అగ్న్యర్పణ’ సంక్షిప్తంగా బలి వర్గాన్ని తెలియజేస్తుంది; ‘ఆహార అర్పణ’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הוּא
  choice: అది
  rationale: మొదటి הוּא పొట్టేలు/అర్పణను దహనబలిగా గుర్తిస్తుంది. చివరి הוּא బలి వివరణను బలపరుస్తుంది; తెలుగులో దానిని మళ్లీ వ్యక్తంగా అనువదించకుండానే వాక్య నిర్మాణంలో దాని నిర్ధారణ భావం నిలుస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామమైన יהוה నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, Jehovah ఆధారిత రూపానికి బదులు హీబ్రూ నామానికి దగ్గరైన ‘యహ్వే’గా ఇచ్చాం.
- issue: רֵיחַ נִיחוֹחַ దేవుని పట్ల సూచించే భావం
  choice: ఇంపైన సువాసన
  alternative: శాంతినిచ్చే సువాసన
  rationale: ఈ స్థిర బలి సూత్రం అర్పణ దేవునికి ఆమోదయోగ్యమని తెలుపుతుంది. దేవుడు కోపం నుంచి తప్పనిసరిగా శాంతింపబడ్డాడనే సిద్ధాంతార్థాన్ని చేర్చకుండా ఆమోదభావాన్ని ప్రధాన పాఠంలో ఉంచాం.
- issue: אִשֶּׁה యొక్క బలి సంబంధ భావం
  choice: అగ్న్యర్పణ
  alternative: ఆహార అర్పణ
  rationale: పదపు ఖచ్చితమైన వ్యుత్పత్తి, భావవ్యాప్తిపై అనిశ్చితి ఉంది. సందర్భంలోని దహనక్రియకు స్పష్టంగా సరిపోయే సంప్రదాయ భావాన్ని ప్రధాన పాఠంలో ఉంచి, ‘ఆహార అర్పణ’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆరాధనా సందర్భానికి తగిన గంభీరతను నిలిపాం. ఆజ్ఞారూప హీబ్రూను తెలుగులో సహజమైన విధి సూచక ‘దహించాలి’గా ఇచ్చాం. రెండు పాదటిప్పణి గుర్తులు [a], [b] ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
