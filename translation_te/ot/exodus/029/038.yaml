  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: te
  text: '“బలిపీఠం మీద నీవు చేయవలసింది ఇదే: ప్రతిరోజూ క్రమం తప్పకుండా ఒక సంవత్సరం వయసున్న రెండు గొర్రెపిల్లలను అర్పించాలి[a][b][c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిపీఠం మీద నీవు చేయవలసినది.” హీబ్రూ క్రియకు సాధారణంగా “చేయు/తయారుచేయు” అని అర్థం; ఇక్కడ అది బలి అర్పించే కార్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “ఒక సంవత్సరపు పిల్లలు”; అంటే, ఒక సంవత్సరం వయసున్న గొర్రెపిల్లలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ప్రతి రోజూ నిరంతరం.” ఈ పదబంధం రోజువారీ బలిని క్రమంగా కొనసాగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר
  choice: అర్పించవలసినది ఇదే
  rationale: ఈ పదబంధం తదుపరి ఆజ్ఞను పరిచయం చేస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో సంబంధార్థాన్ని క్రియతో కలిపి వ్యక్తపరచింది; וְ అనే అనుసంధానాన్ని సందర్భమే సూచిస్తున్నందున ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: תַּעֲשֶׂה
  choice: అర్పించవలసినది / అర్పించాలి
  rationale: עשה యొక్క ప్రాథమిక అర్థం ‘చేయు/తయారుచేయు’; అయితే బలిపీఠం మరియు బలి జంతువుల సందర్భంలో ఉద్దేశించిన ఆచారక్రియను సహజంగా తెలియజేయడానికి ‘అర్పించు’ ఎంచుకుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి సందర్భంలో ఈ పూర్వప్రత్యయ పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: כְּבָשִׂים
  choice: గొర్రెపిల్లలు
  rationale: ఈ పదం చిన్న గొర్రెలను సూచిస్తుంది; వెంట ఉన్న వయస్సు నిర్దేశంతో ‘గొర్రెపిల్లలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְּנֵי שָׁנָה
  choice: ఒక సంవత్సరం వయసున్న
  rationale: అక్షరార్థమైన ‘ఒక సంవత్సరపు కుమారులు’ అనే హీబ్రూ వయస్సు నుడికారానికి సహజ తెలుగు సమానార్థకం.
- source_word: שְׁנַיִם
  choice: రెండు
  rationale: సంఖ్యకు నేరమైన అనువాదం.
- source_word: לַיּוֹם תָּמִיד
  choice: ప్రతి రోజూ క్రమం తప్పకుండా
  rationale: לַיּוֹם దినదిన పంపిణీ భావాన్ని, תָּמִיד నిరంతరంగా కొనసాగించే నియమిత ఆచరణను సూచిస్తాయి. ‘క్రమం తప్పకుండా’ అనేది ఒక్క క్షణం కూడా ఆగని చర్యగా అపార్థం కాకుండా నియమిత దైనందిన బలిని తెలియజేస్తుంది.
theological_decisions:
- issue: תָּמִיד యొక్క బలి-ఆచార భావం
  choice: క్రమం తప్పకుండా
  alternative: నిరంతరం
  rationale: ఇక్కడ రెండు బలులు ప్రతి రోజు అర్పించబడతాయి; కాబట్టి పదం విరామంలేని చర్యకన్నా నిరంతరంగా కొనసాగించే నియమిత దినచర్యను సూచిస్తుంది. అయినప్పటికీ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘బలిపీఠం’, ‘అర్పించు’ వంటి స్థిరమైన ఆరాధనా పదజాలాన్ని ఉపయోగిస్తూ, హీబ్రూ నుడికారాలను సహజ తెలుగులో అందించింది. మూలంలోని ‘నీవు’ ఏకవచన ఆజ్ఞాభావాన్ని నిలిపింది.
