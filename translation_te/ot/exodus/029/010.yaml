  to: “నీవు ఎద్దును ప్రత్యక్షపు గుడారం ఎదుటికి తీసుకురావాలి[a]. అహరోను, అతని కుమారులు తమ చేతులను ఆ ఎద్దు తలపై ఉంచాలి.”
