  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/פָּ֔ר לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הַ/פָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: te
  text: “నీవు ఎద్దును ప్రత్యక్షపు గుడారం ఎదుటికి తీసుకురావాలి[a]. అహరోను, అతని కుమారులు తమ చేతులను ఆ ఎద్దు తలపై ఉంచాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎద్దును ప్రత్యక్షపు గుడారం ఎదుట సమర్పించాలి’ లేదా ‘దగ్గరకు తీసుకురావాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: తీసుకురావాలి
  rationale: קרב ధాతువు హిఫీల్ రూపంలో బలి సందర్భంలో ‘దగ్గరకు తీసుకురావడం’ లేదా ‘సమర్పించడం’ అనే భావాన్ని ఇస్తుంది. ‘ప్రత్యక్ష గుడారం ఎదుటికి’ అనే పదబంధం దిశను, ఆచార సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; సహజమైన ఆధునిక తెలుగుకు ‘తీసుకురావాలి’ అనుకూలం.
- source_word: הַפָּר
  choice: ఎద్దును
  rationale: פַּר బలి సందర్భంలో మగ పశువును, తరచుగా కోడెను సూచించవచ్చు. వయస్సును మూలపాఠం ఇక్కడ స్పష్టంగా నిర్దేశించనందున సాధారణమైన ‘ఎద్దు’ను ఎంచుకున్నాం.
- source_word: לִפְנֵי
  choice: ఎదుటికి
  rationale: ఈ సందర్భంలో స్థానం మాత్రమే కాక తీసుకురావాల్సిన దిశ కూడా ఉంది. అందువల్ల ‘ఎదుటికి’ సహజంగా ఉండి, గుడారం సన్నిధికి తీసుకురావడాన్ని తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనా స్థలానికి వాడే స్థిరమైన తెలుగు బైబిలు పదబంధాన్ని నిలుపుతూ, దేవుడు తన ప్రజలను కలుసుకునే నియమిత స్థలమనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְסָמַךְ
  choice: ఉంచాలి
  rationale: סמך ఇక్కడ బలి జంతువు తలపై చేతులు ఉంచే నిర్దిష్ట ఆచార చర్యను సూచిస్తుంది. ‘ఉంచాలి’ చర్యను స్పష్టంగా తెలుపుతుంది; వాలడం లేదా ఒత్తిడి చేయడం అనే అదనపు భావాన్ని బలవంతంగా చేర్చదు.
- source_word: אַהֲרֹן וּבָנָיו
  choice: అహరోను, అతని కుమారులు
  rationale: בָנָיו ఈ యాజక ప్రతిష్ఠ సందర్భంలో అహరోను కుమారులనే సూచిస్తుంది. వ్యక్తి పేరుకు తెలుగు బైబిలు సంప్రదాయ రూపమైన ‘అహరోను’ వాడబడింది.
- source_word: יְדֵיהֶם
  choice: తమ చేతులను
  rationale: హీబ్రూ బహువచనాన్ని నిలుపుతూ, కర్తలైన అహరోను మరియు అతని కుమారులకే చేతులు చెందుతాయని ‘తమ’ స్పష్టం చేస్తుంది.
- source_word: עַל רֹאשׁ הַפָּר
  choice: ఆ ఎద్దు తల మీద
  rationale: ఆచార చర్య జరిగిన ఖచ్చితమైన శరీర భాగాన్ని మూలపాఠానికి దగ్గరగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: బలి జంతువుపై చేతులు ఉంచే ఆచారం
  choice: తమ చేతులను ఆ ఎద్దు తల మీద ఉంచాలి
  alternative: తమ చేతులను ఆ ఎద్దు తలపై ఆనించాలి
  rationale: వచనం ఆచార చర్యను మాత్రమే పేర్కొంటుంది; దాని సంకేతార్థాన్ని వివరించదు. కాబట్టి పాపబదిలీ వంటి తరువాతి సిద్ధాంత వివరణను అనువాదంలో చేర్చకుండా చర్యను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రత్యక్ష గుడారం’ అనే పరిచిత ఆరాధనా పదబంధాన్ని నిలిపి, వాక్య సంబంధాన్ని సహజం చేయడానికి రెండో ఉపవాక్యానికి ‘అప్పుడు’ చేర్చబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చూపబడ్డాయి.
