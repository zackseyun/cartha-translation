  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: te
  text: యాజక ప్రతిష్ఠాపన బలి[a] మాంసంలోనైనా, రొట్టెలోనైనా ఏదైనా ఉదయం వరకు మిగిలితే, మిగిలినదాన్ని అగ్నిలో కాల్చివేయాలి. అది పరిశుద్ధమైనది కాబట్టి దాన్ని తినకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాజక దీక్షా బలి.’ హీబ్రూ పదం యాజకులను వారి సేవలో నియమించే ప్రతిష్ఠాపన ఆచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: మిగిలితే
  rationale: నిఫల్ రూపం ఏదైనా మిగిలిపోవడాన్ని సూచిస్తుంది; షరతుతో కూడిన వాక్యంలో ‘మిగిలితే’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּשַׂר
  choice: మాంసం
  rationale: బలి సందర్భంలో శరీరంలోని తినదగిన భాగాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הַמִּלֻּאִים
  choice: యాజక ప్రతిష్ఠాపన బలి
  rationale: ఈ యాజక ఆచార సందర్భంలో ఈ పదం సేవలో నియమించే ప్రతిష్ఠాపనను సూచిస్తుంది; మాంసం ప్రస్తావన వల్ల సందర్భంలో అంతర్లీనంగా ఉన్న ‘బలి’ని తెలుగులో స్పష్టం చేశాం.
- source_word: לֶּחֶם
  choice: రొట్టె
  rationale: మూలపదానికి సూటిగా సరిపోయే, సాధారణంగా అర్థమయ్యే పదం.
- source_word: עַד הַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: עַד తెలిపే కాలపరిమితిని యథాతథంగా నిలుపుతుంది.
- source_word: וְשָׂרַפְתָּ
  choice: కాల్చివేయాలి
  rationale: షరతుకు అనుసరించే ఆజ్ఞను సహజమైన తెలుగు న్యాయశైలిలో తెలియజేస్తుంది; ‘వేయాలి’ పూర్తిగా దహనం చేయాలనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַנּוֹתָר
  choice: మిగిలినదాన్ని
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בָּאֵשׁ
  choice: అగ్నిలో
  rationale: దహన సాధనాన్ని మరియు సందర్భాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: לֹא יֵאָכֵל
  choice: తినకూడదు
  rationale: హీబ్రూ కర్మణి నిషేధంలోని న్యాయబలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קֹדֶשׁ
  choice: పరిశుద్ధమైనది
  rationale: ఆరాధనా సంబంధమైన ప్రత్యేకతను, దేవునికి ప్రత్యేకించిన స్థితిని తెలిపే ప్రామాణిక పదం.
theological_decisions:
- issue: యాజక ఆచార సందర్భంలో הַמִּלֻּאִים పదానికి అనువాదం
  choice: యాజక ప్రతిష్ఠాపన బలి
  alternative: యాజక దీక్షా బలి; ప్రతిష్ఠాపన అర్పణ
  rationale: నిర్గమకాండము 29లో ఇది యాజకులను వారి సేవలో నియమించే ఆచారాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠాపన’ ఆ ఆచార స్వభావాన్ని స్పష్టంగా ఉంచుతుంది; ‘బలి’ అనేది మాంసం ప్రస్తావన నుండి సందర్భానుసారంగా సరఫరా చేయబడింది. ప్రత్యామ్నాయ పదప్రయోగాన్ని పాదసూచికలో నమోదు చేసి భావపరిధిని అనవసరంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. షరతు–ఫలిత నిర్మాణం స్పష్టంగా ఉంది; మూలంలోని కర్మణి నిషేధాన్ని తెలుగులో సహజమైన ‘తినకూడదు’గా అందించాం.
