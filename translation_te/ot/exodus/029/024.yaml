    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘అహరోను అరచేతులపై, అతని కుమారుల అరచేతులపై’ అని ఉంది. కొన్ని అనువాదాలు దీనిని విస్తృతార్థంలో ‘చేతులపై’ అని అనువదిస్తాయి.
    reason: lexical_alternative
