id: EXO.29.24
reference: Exodus 29:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: te
  text: వాటన్నిటినీ అహరోను అరచేతులపై, అతని కుమారుల అరచేతులపై ఉంచి,[a] యెహోవా సన్నిధిలో వాటిని ఊపే అర్పణగా ఊపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘అహరోను అరచేతులపై, అతని కుమారుల అరచేతులపై’ అని ఉంది. కొన్ని అనువాదాలు దీనిని విస్తృతార్థంలో ‘చేతులపై’ అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: ఉంచి
  rationale: ఆచారానికి సంబంధించిన వరుస ఆదేశంలో ఇది ఆజ్ఞార్థాన్ని ఇస్తుంది; తెలుగులో తరువాతి ప్రధాన క్రియతో కలిపిన కృదంత రూపం సహజంగా ఉంటుంది.
- source_word: הַכֹּל
  choice: వాటన్నిటినీ
  rationale: ముందటి వచనంలో పేర్కొన్న అనేక అర్పణ భాగాలన్నిటినీ సమష్టిగా సూచిస్తుంది.
- source_word: עַל כַּפֵּי
  choice: అరచేతుల మీద
  rationale: כַּף సాధారణంగా చేతిని సూచించగలిగినా, ఇక్కడ వస్తువులను ఉంచే అరచేతి అనే స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בָנָיו
  choice: అతని కుమారుల
  rationale: యాజక ప్రతిష్ఠలో పాల్గొనే అహరోను కుమారులను సందర్భానుసారంగా, లింగపరంగా ఖచ్చితంగా సూచిస్తుంది.
- source_word: וְהֵנַפְתָּ ... תְּנוּפָה
  choice: ప్రతిష్ఠార్పణగా ఊపాలి
  rationale: נוף హిఫీల్ మరియు תְּנוּפָה కలిసి యెహోవా సన్నిధిలో అర్పణ భాగాలను ఆచారరీతిగా ఊపి సమర్పించే చర్యను సూచిస్తాయి; ‘ఊపాలి’ చర్యను, ‘ప్రతిష్ఠార్పణగా’ దాని ఆచార స్వభావాన్ని తెలియజేస్తాయి.
- source_word: אֹתָם
  choice: వాటిని
  rationale: పుంలింగ బహువచన కర్మసర్వనామం ముందుగా పేర్కొన్న అనేక అర్పణ భాగాలను సూచిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క సన్నిధి భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, יהוה అనే నిబంధన నామాన్ని లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: תְּנוּפָה అనే ఆచార పదం
  choice: ప్రతిష్ఠార్పణ
  alternative: అల్లాడించే అర్పణ; ఊపే అర్పణ
  rationale: ఇది సాధారణంగా వస్తువును ఊపడం మాత్రమే కాక, దేవుని సన్నిధిలో ఆచారరీతిగా సమర్పించడం. క్రియలో ‘ఊపాలి’ అని స్పష్టంగా ఉంచి, నామంలో సమర్పణాత్మక ఉద్దేశాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘అరచేతులు’ అనే స్పష్టమైన శరీరావయవ పదాన్ని నిలిపి, ప్రధాన ఆజ్ఞను సహజమైన తెలుగు వాక్యక్రమంలో ఇచ్చాం.
