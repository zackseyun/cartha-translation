source:
  edition: WLC
  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: te
  text: అక్కడ నేను ఇశ్రాయేలు కుమారులను[a] కలుసుకుంటాను; అది నా మహిమవల్ల పవిత్రపరచబడుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులను.’ హీబ్రూలో ‘ఇశ్రాయేలు కుమారులను’ అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ నిబంధనాత్మక పదబంధం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పవిత్రపరచబడేది ఏమిటో స్పష్టంగా చెప్పబడలేదు. సందర్భంలో ఇది సాధారణంగా పరిశుద్ధ స్థల పరిధిని, మరింత నిర్దిష్టంగా ప్రత్యక్ష సన్నిధి గుడారాన్ని లేదా బలిపీఠాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: నేను ... కలుసుకుంటాను
  rationale: యעד ధాతువు నిఫల్ రూపంలో, ప్రత్యక్ష సన్నిధి గుడారం సందర్భంలో నియమితమైన దైవిక కలయికను సూచిస్తుంది. ‘కలుసుకుంటాను’ అనేది భావాన్ని అతిగా విస్తరించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: ముందు పేర్కొన్న ప్రత్యక్ష సన్నిధి స్థలాన్ని సూచించే స్థానవాచక క్రియావిశేషణం.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: యעדతో వచ్చిన לְ కలయికను తెలుగులో ‘కలుసుకొను’ క్రియకు సహజమైన కర్మరూపంతో వ్యక్తం చేశాం. ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం హీబ్రూ నిబంధనాత్మక జాతినామాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: וְנִקְדַּשׁ
  choice: అది ... పవిత్రపరచబడుతుంది
  rationale: קדש నిఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతుంది. హీబ్రూలో కర్త స్పష్టంగా లేకపోవడంతో తెలుగులో ‘అది’ అని ఉంచి, గుడారం/బలిపీఠం/పరిశుద్ధ స్థల పరిధిలోని సూచనాత్మక అస్పష్టతను కాపాడాం.
- source_word: בִּכְבֹדִי
  choice: నా మహిమవల్ల
  rationale: בְ ఇక్కడ సాధనార్థకంగా ఉంది; దేవుని మహిమ పవిత్రపరచే సాధనం లేదా కారణమని ‘మహిమవల్ల’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘పవిత్రపరచబడుతుంది’ అనే క్రియకు అంతర్నిహిత కర్త
  choice: ‘అది’ అని అనిర్దిష్టంగా ఉంచడం
  alternative: ప్రత్యక్ష సన్నిధి గుడారం, బలిపీఠం, లేదా పరిశుద్ధ స్థలం అని నిర్దిష్టంగా పేర్కొనడం; లేక అహరోనును సూచించే ‘అతడు’ అని తీసుకోవడం
  rationale: హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉన్నా, ఈ వాక్యంలో స్పష్టమైన కర్త లేదు. సందర్భం ఆరాధనా స్థలానికి సంబంధించిన అనేక సాధ్య సూచనలను అనుమతిస్తుంది; కాబట్టి ఒకదానిని మాత్రమే నిర్ణయించడం తగదు.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని రూపకల్పనను ప్రధాన పాఠ్యంలో నిలిపి, దాని సామూహిక జాతినామ భావాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పవిత్రపరచబడుతుంది’ ద్వారా మూలంలోని కర్మణి రూపాన్ని నిలిపాం; పాఠ్యంలో ఉన్న రెండు పాదటిప్పణి గుర్తులను సంబంధిత పదబంధాల వెంట ఉంచాం.
