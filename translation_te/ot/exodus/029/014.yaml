  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: te
  text: కాని ఆ ఎద్దు మాంసాన్ని, దాని చర్మాన్ని, దాని పేడను శిబిరం వెలుపల అగ్నితో కాల్చాలి. అది పాపపరిహార బలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధీకరణ బలి.’ హీబ్రూ חַטָּאת అనే పదం ‘పాపం’నూ, పాపానికి సంబంధించి అర్పించే బలినీ సూచించగలదు. ఇలాంటి బలి సందర్భాల్లో చాలామంది ‘పాపపరిహార బలి’ అని అనువదిస్తారు; మరికొందరు ఈ ఆచారం శుద్ధి చేసే కార్యాన్ని నొక్కిచెప్పడానికి ‘శుద్ధీకరణ బలి’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: మాంసం
  rationale: బలి సందర్భంలో జంతువు శరీరంలోని మాంసభాగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: הַפָּר
  choice: ఆ ఎద్దు
  rationale: పַּר బలి కోసం ఉపయోగించే ఎద్దును సూచిస్తుంది; ఈ సందర్భంలో వయస్సును ప్రత్యేకంగా పేర్కొనాల్సిన అవసరం లేదు.
- source_word: עֹרוֹ
  choice: దాని చర్మం
  rationale: జంతువు వెలుపలి చర్మాన్ని తెలుగులో నేరుగా, సహజంగా సూచించే పదం.
- source_word: פִּרְשׁוֹ
  choice: దాని పేడ
  rationale: పֶּרֶשׁ యొక్క స్పష్టమైన అర్థం విసర్జిత మలం; ‘పేగులు’ లేదా సాధారణ వ్యర్థం అని మృదువుగా మార్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: תִּשְׂרֹף
  choice: కాల్చాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలోని ద్వితీయ పురుష ఏకవచన క్రియకు ఆధునిక తెలుగులో సహజమైన నిర్దేశక రూపం.
- source_word: בָּאֵשׁ
  choice: అగ్నితో
  rationale: ఇక్కడ בְּ సాధనార్థకంగా ఉండి, కాల్చే సాధనాన్ని సూచిస్తుంది.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: ఇశ్రాయేలీయుల శిబిర సరిహద్దులకు బయట అనే స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలి సందర్భంలో ఇది కేవలం ‘పాపం’ అనే భావాన్ని కాక, పాపానికి సంబంధించి అర్పించే బలిని సూచిస్తుంది; శుద్ధీకరణ కార్యాన్ని సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הוּא
  choice: అది
  rationale: ముందు పేర్కొన్న ఎద్దు/బలి విధిని గుర్తిస్తూ హీబ్రూ సర్వనామాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: మాంసాన్ని, దాని చర్మాన్ని, దాని పేడను
  rationale: హీబ్రూ జాబితాలోని ప్రతి భాగాన్ని విడివిడిగా ఉంచుతూ, తెలుగులో అనవసరమైన పునరుక్తి లేకుండా సమన్వయాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బలి నియమాలలో חַטָּאת అనువాదం
  choice: పాపపరిహార బలి
  alternative: శుద్ధీకరణ బలి; పాపం
  rationale: తక్షణ ఆరాధనా సందర్భం బలి అనే అర్థాన్ని ప్రధానంగా చేస్తుంది. ఈ బలి శుద్ధీకరణ కార్యాన్ని నొక్కిచెప్పే ‘శుద్ధీకరణ బలి’ కూడా సాధ్యమైన అనువాదమే; ఆ నిజమైన భావవ్యాప్తిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, బలి నియమానికి తగిన గంభీరతతో రూపొందించబడింది. ‘పేడ’ అనే పదం మూలంలోని స్పష్టమైన శారీరక అర్థాన్ని దాచకుండా ఉంచుతుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
