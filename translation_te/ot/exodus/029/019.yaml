id: EXO.29.19
reference: Exodus 29:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֵ֖ת הָ/אַ֣יִל הַ/שֵּׁנִ֑י וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: te
  text: అప్పుడు నీవు రెండవ పొట్టేలును తీసుకోవాలి; అహరోను, అతని కుమారులు ఆ పొట్టేలు తలమీద తమ చేతులను ఉంచాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తర్వాత నువ్వు ... తీసుకోవాలి
  rationale: సూచనల క్రమంలో సంధితో కూడిన ఈ క్రియ తదుపరి ఆజ్ఞను సూచిస్తుంది. ‘తర్వాత’ ప్రక్రియలోని క్రమాన్ని, ‘తీసుకోవాలి’ ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తాయి.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: రెండో పొట్టేలు
  rationale: אַיִל అంటే మగ గొర్రె, అంటే ‘పొట్టేలు’; הַשֵּׁנִי క్రమసంఖ్యగా ‘రెండో’ అని స్పష్టంగా సూచిస్తుంది.
- source_word: וְסָמַךְ
  choice: ఉంచాలి
  rationale: బలి ఆచార సందర్భంలో סמך జంతువు మీద చేతులు మోపడం లేదా ఆనించడం అనే క్రియను సూచిస్తుంది. ‘ఉంచాలి’ ఆ ఆచార చర్యను సహజంగా తెలుపుతుంది; దాని ప్రతీకార్థాన్ని అనువాదంలో చేర్చదు.
- source_word: אַהֲרֹן וּבָנָיו
  choice: అహరోను, అతని కుమారులు
  rationale: ఈ యాజక ప్రతిష్ఠ సందర్భంలో בָּנִים అహరోను పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ సందర్భోచితమైనది.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులు
  rationale: మూలంలో ‘చేతులు’ బహువచనంలో ఉంది. ‘తమ’ అనే ఆత్మవాచక రూపం చేతులు అహరోను మరియు అతని కుమారులవేనని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: ఆ పొట్టేలు తలపై
  rationale: ‘తలపై’ స్థల సంబంధాన్ని నేరుగా తెలుపుతుంది. నిర్దిష్ట పదబంధాన్ని తెలుగు సందర్భంలో సహజంగా ‘ఆ పొట్టేలు’ అని ఇచ్చాం.
theological_decisions:
- issue: చేతులు ఉంచే ఆచారానికి వచనంలో లేని తదనంతర వేదాంత వివరణను జోడించకపోవడం
  choice: ఆ పొట్టేలు తలపై తమ చేతులు ఉంచాలి
  alternative: ఆ పొట్టేలు తలపై తమ చేతులు ఆనించాలి
  rationale: మూలవచనం ఆచార చర్యను మాత్రమే వర్ణిస్తుంది; అపరాధ బదిలీ, తాదాత్మ్యం లేదా ప్రతిష్ఠ వంటి ప్రతీకార్థాన్ని ఇక్కడ వివరించదు. అందువల్ల అనువాదం చర్యను మాత్రమే స్పష్టంగా చెబుతూ వేదాంత ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. మోషేతో ఏకవచన సంబోధనను ‘నువ్వు’తో నిలిపి, ఆచార చర్యకు సాంకేతిక లేదా మతశాఖాపరమైన అదనపు అర్థాలను చేర్చలేదు.
