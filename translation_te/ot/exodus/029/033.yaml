revisions:
- from: వారి ప్రతిష్ఠాపన కోసం, వారిని పవిత్రపరచడం కోసం ప్రాయశ్చిత్తం చేయడానికి ఉపయోగించిన వాటిని వారు తినాలి; అయితే యాజకవర్గానికి చెందని వ్యక్తి వాటిని తినకూడదు,[a] ఎందుకంటే అవి పవిత్రమైనవి.
  to: వారిని యాజకులుగా ప్రతిష్ఠించడానికీ వారిని పవిత్రపరచడానికీ, వాటి ద్వారా ప్రాయశ్చిత్తం చేయబడిన ఆ పదార్థాలను వారు తినాలి; అయితే యాజకవర్గానికి చెందని వ్యక్తి వాటిని తినకూడదు,[a] ఎందుకంటే అవి పవిత్రమైనవి.
