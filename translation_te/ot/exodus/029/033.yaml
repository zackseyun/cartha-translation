id: EXO.29.33
reference: Exodus 29:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: te
  text: వారిని యాజకులుగా ప్రతిష్ఠించడానికీ వారిని పవిత్రపరచడానికీ, వాటి ద్వారా ప్రాయశ్చిత్తం చేయబడిన ఆ పదార్థాలను వారు తినాలి; అయితే యాజకవర్గానికి చెందని వ్యక్తి వాటిని తినకూడదు,[a] ఎందుకంటే అవి పవిత్రమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యాజకవర్గానికి చెందని వ్యక్తి’ అంటే జాతిపరంగా విదేశీయుడు అని తప్పనిసరిగా కాదు; ఈ యాజక ఆచారంలో పాల్గొనే అధికారం లేని వ్యక్తి అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: వాటిని వారు తినాలి
  rationale: క్రియకు ఈ ఆచార క్రమంలో ఆదేశార్థక భావం ఉంది. సర్వనామం ముందటి వచనంలో చెప్పిన బలి పదార్థాలను సూచిస్తుంది.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: ప్రాయశ్చిత్తం చేయడానికి ఉపయోగించిన
  rationale: כפר యొక్క పుయల్ రూపం, ב ఉపసర్గతో కలిసి, ఆ పదార్థాలు ప్రాయశ్చిత్తానికి సాధనంగా ఉపయోగించబడ్డాయని తెలియజేస్తుంది. హెబ్రీలో ఈ ఉపవాక్యంలో ‘వారి కోసం’ అని స్పష్టంగా లేదు కాబట్టి దానిని చేర్చలేదు.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: వారి ప్రతిష్ఠాపన కోసం
  rationale: అక్షరార్థంగా ‘వారి చేతిని నింపడం’; ఇక్కడ ఇది యాజక సేవలో నియమించే ప్రతిష్ఠాపనను సూచించే సాంకేతిక హెబ్రీ నుడికారం.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: వారిని పవిత్రపరచడం కోసం
  rationale: యాజక ఆచార సందర్భంలో పవిత్ర సేవ కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది.
- source_word: וְזָר
  choice: అయితే యాజకవర్గానికి చెందని వ్యక్తి
  rationale: זר ఇక్కడ జాతిపరంగా విదేశీయుడిని కాక, ఈ యాజక ఆచారంలో పాల్గొనే అధికారం లేని వ్యక్తిని సూచిస్తుంది.
- source_word: לֹא יֹאכַל
  choice: వాటిని తినకూడదు
  rationale: సందర్భంలో అర్థమయ్యే కర్మను తెలుగులో స్పష్టంగా తెలిపి, నిషేధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: ఎందుకంటే అవి పవిత్రమైనవి
  rationale: ఈ నిషేధానికి కారణాన్ని తెలియజేస్తూ, మూలంలోని పవిత్రత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బలి సందర్భంలో כפר పదం
  choice: ప్రాయశ్చిత్తం చేయడానికి
  alternative: పాపపరిహారం చేయడానికి
  rationale: ‘ప్రాయశ్చిత్తం’ సాధారణ బైబిలు-తెలుగు వాడుకలో మూలపదపు ఆచారపరమైన, దేవునితో సంబంధ పునరుద్ధరణకు సంబంధించిన విస్తృత భావాన్ని నిలుపుతుంది; ‘పాపపరిహారం’ భావాన్ని కొంత సంకుచితం చేయవచ్చు.
- issue: מִלֵּא יָד అనే యాజక నుడికారం
  choice: ప్రతిష్ఠాపన
  alternative: చేతిని నింపడం; యాజక సేవలో నియమించడం
  rationale: అక్షరార్థం తెలుగులో ఉద్దేశిత భావాన్ని ఇవ్వదు. ‘ప్రతిష్ఠాపన’ యాజక సేవలో అధికారికంగా నియమించడాన్ని తెలుపుతూ, తరువాతి ఏ ప్రత్యేక సంఘ సంప్రదాయాన్నీ దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే ఆచార-న్యాయ శైలి. మూలంలోని సాధనార్థక అస్పష్టతను అతిగా సిద్ధాంతీకరించకుండా నిలుపుతూ, హెబ్రీ నుడికారాన్ని సహజ తెలుగులో అందించింది.
