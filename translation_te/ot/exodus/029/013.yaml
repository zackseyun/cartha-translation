source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֗ אֶֽת כָּל הַ/חֵלֶב֮ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּרֶב֒ וְ/אֵ֗ת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֖לֶב אֲשֶׁ֣ר עֲלֵי/הֶ֑ן וְ/הִקְטַרְתָּ֖ הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: te
  text: అప్పుడు నీవు లోపలి అవయవాలను కప్పి ఉన్న కొవ్వంతటినీ, కాలేయం మీద ఉన్న అనుబంధ భాగాన్ని[a], రెండు మూత్రపిండాలను, వాటి మీద ఉన్న కొవ్వును తీసుకోవాలి; వాటిని బలిపీఠం మీద దహించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ పదం కాలేయానికి అనుబంధంగా ఉన్న ఒక నిర్దిష్ట భాగాన్ని సూచిస్తుంది; అయితే ఆధునిక శరీర నిర్మాణశాస్త్రం ప్రకారం అది ఖచ్చితంగా ఏ భాగమో అనిశ్చితం. కొందరు దీనిని ‘కాలేయపు లోబు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: అప్పుడు నీవు ... తీసుకొని
  rationale: సూచనల వరుసలో ఈ క్రియ ఆజ్ఞార్థక భావాన్ని కలిగిస్తుంది. తరువాతి ప్రధాన క్రియతో సహజమైన ఆధునిక తెలుగు వాక్యంగా కలపడానికి ‘తీసుకొని’ అని అనువదించాం.
- source_word: כָּל הַחֵלֶב
  choice: కొవ్వంతటినీ
  rationale: బలి జంతువులో ప్రత్యేకంగా వేరు చేసే కొవ్వు భాగాలను సూచిస్తుంది; సాధారణ పాఠకులకు ‘కొవ్వు’ స్పష్టంగా ఉంటుంది.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: లోపలి అవయవాలను కప్పి ఉన్న
  rationale: ఇక్కడ קֶרֶב జంతువు లోపలి భాగాలను లేదా అవయవాలను సూచిస్తుంది. ‘లోపలి అవయవాలు’ అనేది ‘పేగులు’ కంటే విస్తృతంగా ఉండి మూలంలోని భావాన్ని అతిగా పరిమితం చేయదు.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: కాలేయం మీద ఉన్న అనుబంధ భాగం
  rationale: ఈ పదం కాలేయంతో సంబంధమున్న ఒక నిర్దిష్ట భాగాన్ని సూచించినా, దాని ఖచ్చితమైన శరీర నిర్మాణ గుర్తింపు అనిశ్చితం. ‘అనుబంధ భాగం’ ఆ అనిశ్చితిని నిలుపుతూ עַל అనే సంబంధాన్ని ‘మీద ఉన్న’ అని ప్రతిబింబిస్తుంది.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: రెండు మూత్రపిండాలు
  rationale: ఇది స్పష్టమైన శరీర భాగ సూచన; ఆధునిక ప్రామాణిక తెలుగు పదాన్ని ఉపయోగించాం.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: వాటి మీద ఉన్న కొవ్వు
  rationale: మూత్రపిండాలతో సంబంధమున్న కొవ్వును సూచించే మూలంలోని ‘వాటి మీద’ అనే ప్రత్యక్ష భావాన్ని నిలిపాం.
- source_word: וְהִקְטַרְתָּ
  choice: దహించాలి
  rationale: קטר యొక్క హిఫిల్ రూపం బలిపీఠం మీద బలిగా కాల్చడాన్ని సూచిస్తుంది. ‘దహించాలి’ విధి లేదా ఆజ్ఞ భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠం మీద
  rationale: దిశను సూచించే రూపం వస్తువులను బలిపీఠం మీద ఉంచి కాల్చడాన్ని తెలియజేస్తుంది; తెలుగులో ‘బలిపీఠం మీద’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బలి విధులకు తగిన గౌరవప్రదమైన సూచనా శైలిని ఉపయోగించాం. అతి ప్రాచీన పదజాలాన్ని నివారిస్తూ, శరీర నిర్మాణానికి సంబంధించిన మూలంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
