  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: te
  text: అహరోను, అతని కుమారులు సమావేశపు గుడారం ప్రవేశద్వారం వద్ద పొట్టేలు మాంసాన్ని[a], బుట్టలో ఉన్న రొట్టెను తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పొట్టేలు మాంసం’; బలి సందర్భంలో ఇది తినదగిన మాంసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: తినాలి
  rationale: ఆచార సంబంధమైన ఈ నిర్దేశంలో సంయోజక అవ్యయంతో కూడిన Qal perfect విధి లేదా నిర్దేశ భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘తినాలి’ ఆ నిర్దేశక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన హెబ్రీ వ్యక్తినామ రూపం.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: ఈ యాజక ప్రతిష్ఠా సందర్భంలో בנים అహరోను కుమారులనే సూచిస్తుంది; సాధారణమైన ‘పిల్లలు’ కంటే ఇది మూలంలోని లింగ నిర్దిష్టతను కాపాడుతుంది.
- source_word: בְּשַׂר
  choice: మాంసాన్ని
  rationale: בשר అక్షరార్థంగా ‘శరీరం/మాంసం’; బలి జంతువును ఆహారంగా తినే ఈ సందర్భంలో సహజమైన తెలుగు పదం ‘మాంసం’. ‘శరీరం’ ఇక్కడ అపార్థానికి దారితీయవచ్చు.
- source_word: הָאַיִל
  choice: పొట్టేలు
  rationale: אַיִל మగ గొర్రెను, ఇక్కడ ప్రతిష్ఠా బలిగా అర్పించిన పొట్టేలును సూచిస్తుంది.
- source_word: הַלֶּחֶם
  choice: రొట్టెను
  rationale: לחם సాధారణంగా రొట్టెను సూచిస్తుంది. ముందు సందర్భంలో బుట్టలో ఉంచిన పులియని రొట్టె పదార్థాలకు ఇది సమష్టి ఏకవచనంగా వాడబడింది.
- source_word: אֲשֶׁר בַּסָּל
  choice: బుట్టలో ఉన్న
  rationale: సంబంధ వాక్యం ఆ రొట్టె ఉన్న స్థానాన్ని గుర్తిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం దగ్గర
  rationale: פתח అంటే ప్రవేశం లేదా ద్వారం. స్థలార్థాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ప్రవేశద్వారం దగ్గర’ ఎంచుకున్నాం.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే ఆరాధనా గుడారాన్ని సూచించే హెబ్రీ సంయుక్త పదబంధానికి స్పష్టమైన, స్థిరమైన తెలుగు రూపం.
theological_decisions:
- issue: యాజక సందర్భంలోని లింగ నిర్దిష్ట కుటుంబ పదం
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: ఈ వచనం అహరోనుతో కలిసి ప్రతిష్ఠ పొందుతున్న అతని కుమారులను సూచిస్తుంది. మూలపాఠంలోని నిర్దిష్ట పురుష సూచనను విస్తరించకుండా ఉంచాం.
- issue: ఆచార నిర్దేశంలోని క్రియాబలం
  choice: తినాలి
  alternative: తింటారు
  rationale: హెబ్రీ క్రియారూపం ఈ నియమావళి సందర్భంలో జరిగిన కార్యాన్ని వర్ణించదు; చేయవలసిన ఆచారాన్ని నిర్దేశిస్తుంది. ‘తినాలి’ ఆ విధిబలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హెబ్రీ పదక్రమాన్ని కఠినంగా అనుకరించకుండా, స్థల సూచనను ప్రధాన క్రియకు సహజంగా అనుసంధానించాం; బలి సందర్భంలోని స్పష్టత కోసం בשר ను ‘మాంసం’గా అనువదించి అక్షరార్థ భేదాన్ని పాదటిప్పణిలో ఉంచాం.
