source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: te
  text: నేను సమావేశపు గుడారాన్ని, బలిపీఠాన్ని పవిత్రపరుస్తాను[a]; అహరోనును, అతని కుమారులను నాకు యాజకులుగా సేవ చేయడానికి[b] పవిత్రపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండు చోట్లా ‘ప్రతిష్ఠిస్తాను.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నాకు యాజకత్వం వహించడానికి’ లేదా ‘నాకు యాజకులుగా పరిచర్య చేయడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: ప్రతిష్ఠిస్తాను
  rationale: పియేల్ రూపంలోని קדשׁ ఇక్కడ వ్యక్తులను, వస్తువులను పవిత్ర సేవ కోసం ప్రత్యేకంగా ఉంచడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రతిష్ఠిస్తాను’ ఆ ఆరాధనాపరమైన అర్థాన్ని సహజంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి హెబ్రీ పునరుక్తిని నిలిపింది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: מוֹעֵד నియమిత కలయిక లేదా సమావేశాన్ని సూచిస్తుంది. ‘సమావేశపు గుడారం’ మూలపదానికి పారదర్శకంగా ఉండి, అర్థాన్ని ముందుగానే ‘ప్రత్యక్షత’గా నిర్ధారించదు.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే ఆరాధనా పీఠాన్ని తెలిపే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హెబ్రీ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; యాజక సేవ సందర్భంలో ఆ లింగ నిర్దిష్టతను నిలిపింది.
- source_word: לְכַהֵן לִי
  choice: నాకు యాజకులుగా సేవచేయడానికి
  rationale: כהן క్రియ యాజకునిగా సేవ చేయడాన్ని, לִי ఆ సేవ దేవునికి చెందడాన్ని సూచిస్తాయి. ఈ రూపం రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆరాధనాపరమైన పవిత్రీకరణ భాష
  choice: ప్రతిష్ఠిస్తాను
  alternative: పవిత్రపరుస్తాను
  rationale: ఈ సందర్భంలో గుడారం, బలిపీఠం, యాజకులు పవిత్ర సేవ కోసం ప్రత్యేకపరచబడుతున్నారు. ‘ప్రతిష్ఠిస్తాను’ ఆ ఆరాధనాపరమైన అంకితాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయంలోని ప్రత్యక్ష ‘పవిత్రం చేయు’ భావాన్ని పాదసూచికలో నిలిపింది.
- issue: యాజక సేవలో లింగ నిర్దిష్టత
  choice: అతని కుమారులు
  alternative: అతని పిల్లలు
  rationale: మూలంలోని בָּנָיו పురుష సంతానాన్ని స్పష్టంగా సూచిస్తుంది; అందువల్ల దాన్ని సాధారణీకరించలేదు.
- issue: לְכַהֵן לִי యొక్క సంబంధం
  choice: నాకు యాజకులుగా సేవచేయడానికి
  alternative: నా కోసం యాజకత్వం వహించడానికి
  rationale: హెబ్రీ నిర్మాణం యాజక సేవను దేవునికి చేసే సేవగా చూపుతుంది. ఎవరికి ప్రయోజనం అనే భావం మాత్రమే కాక సేవ ఎవరికి అర్పించబడుతుందో కూడా సహజంగా వ్యక్తం చేయడానికి ‘నాకు’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ఆరాధనా శైలి. హెబ్రీ వాక్యంలోని రెండు קדשׁ క్రియల పునరుక్తిని నిలిపి, మూలంలో లేని ‘కూడా’ను చేర్చలేదు. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
