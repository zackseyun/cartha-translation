revisions:
- from: నేను సమావేశపు గుడారాన్ని, బలిపీఠాన్ని ప్రతిష్ఠిస్తాను[a]; అహరోనును, అతని కుమారులను నాకు యాజకులుగా సేవచేయడానికి[b] ప్రతిష్ఠిస్తాను.
  to: నేను సమావేశపు గుడారాన్ని, బలిపీఠాన్ని పవిత్రపరుస్తాను[a]; అహరోనును, అతని కుమారులను నాకు యాజకులుగా సేవ చేయడానికి[b] పవిత్రపరుస్తాను.
  rationale: The revision renders the two occurrences of קדשׁ with the same direct Telugu holiness/consecration term, preserving the Hebrew repetition and its application to both sacred objects and priests. It retains the transparent rendering of אֹהֶל מוֹעֵד and the source-specific masculine ‘కుమారులు,’ while making the priestly-service phrase idiomatic and preserving its direction to God. Footnote anchors remain attached to their relevant expressions.
