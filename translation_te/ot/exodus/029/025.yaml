source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: te
  text: తర్వాత నీవు వాటిని వారి చేతుల్లోనుండి తీసుకొని, బలిపీఠం మీదనున్న దహనబలిపై వాటిని పొగగా అర్పించాలి. యెహోవా సన్నిధిలో అది ఇంపైన సువాసనగా ఉంటుంది. అది యెహోవాకు అగ్నిచేత అర్పించబడే అర్పణ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాకు అగ్ని అర్పణ.”
    reason: אִשֶּׁה అనే బలిసంబంధ పదానికి సాధ్యమైన సంక్షిప్త ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తర్వాత నీవు ... తీసుకొని
  rationale: ఆచారక్రమంలో తదుపరి చర్యను ఆదేశించే సంయుక్త క్రియారూపం; ‘తర్వాత’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֹתָם מִיָּדָם
  choice: వాటిని వారి చేతుల్లోనుండి
  rationale: మునుపటి వచనంలో యాజకుల చేతుల్లో ఉంచిన బలి భాగాలను సూచించే సర్వనామాన్ని, ఆచారంలోని శారీరక చర్యను యథాతథంగా నిలుపుతూ అనువదించింది.
- source_word: וְהִקְטַרְתָּ
  choice: పొగగా అర్పించాలి
  rationale: బలిసంబంధ సందర్భంలో קטר హిఫీల్ రూపం బలిపీఠంపై కాల్చి పొగ పైకి వెళ్లేలా అర్పించడాన్ని సూచిస్తుంది; కేవలం ‘కాల్చాలి’ కంటే బల్యర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: దహనబలి మీద బలిపీఠంపై
  rationale: దహనబలి పైన ఉంచి బలిపీఠంపై అర్పించే స్థలసంబంధాన్ని దగ్గరగా అనుసరిస్తుంది.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: ఆయనకు ఇంపైన సువాసనగా
  rationale: దైవ అంగీకారాన్ని సూచించే స్థిరమైన బలిసంబంధ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי యొక్క ‘ముందు/సన్నిధిలో’ అనే సంబంధార్థాన్ని, యెహోవా అనే నిబంధన నామంతో వ్యక్తం చేస్తుంది.
- source_word: אִשֶּׁה הוּא לַיהוָה
  choice: అది యెహోవాకు అగ్నితో అర్పించే అర్పణ
  rationale: אִשֶּׁה యొక్క అగ్నిసంబంధ బల్యర్థాన్ని నిలుపుతూ, దానిని దేవుని ‘ఆహారం’ అని అవసరానికి మించి నిర్ధారించకుండా అనువదిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ప్రతిబింబించింది.
- issue: אִשֶּׁה బలిపదం యొక్క భావం
  choice: అగ్నితో అర్పించే అర్పణ
  alternative: ఆహార అర్పణ; అగ్ని అర్పణ
  rationale: ఈ పదం యొక్క వ్యుత్పత్తి, ప్రయోగంపై ఉన్న చర్చను దృష్టిలో ఉంచి, తక్షణ సందర్భంలోని అగ్నిపై కాల్చి అర్పించే చర్యను ప్రధాన పాఠంలో తెలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పొగగా అర్పించాలి’ అనే పదబంధం బలిని కేవలం నాశనం చేయడం కాక, బలిపీఠంపై కాల్చి అర్పించడం అనే ఆచారార్థాన్ని స్పష్టం చేస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
