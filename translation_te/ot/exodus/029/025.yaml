revisions:
- from: తర్వాత నీవు వాటిని వారి చేతుల్లోనుండి తీసుకొని, దహనబలి మీద బలిపీఠంపై వాటిని పొగగా అర్పించాలి. యెహోవా సన్నిధిలో అది ఆయనకు ఇంపైన సువాసనగా ఉంటుంది. అది యెహోవాకు అగ్నితో అర్పించే అర్పణ.[a]
  to: తర్వాత నీవు వాటిని వారి చేతుల్లోనుండి తీసుకొని, బలిపీఠం మీదనున్న దహనబలిపై వాటిని పొగగా అర్పించాలి. యెహోవా సన్నిధిలో అది ఇంపైన సువాసనగా ఉంటుంది. అది యెహోవాకు అగ్నిచేత అర్పించబడే అర్పణ.[a]
  rationale: The revision corrects the spatial relation between the altar and the burnt offering, removes an unnecessary explicit pronoun from the pleasing-aroma formula, and retains a careful nonsectarian rendering of the disputed sacrificial term אִשֶּׁה. The footnote anchor and its corresponding note are retained.
