id: EXO.29.11
reference: Exodus 29:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁחַטְתָּ֥ אֶת הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: te
  text: నీవు ఆ ఎద్దును యహ్వే[a] సన్నిధిలో, సమావేశ గుడారపు ప్రవేశద్వారం దగ్గర వధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ‘యెహోవా’ అనే రూపం కూడా వాడుకలో ఉంది.
    reason: దైవనామానికి సంబంధించిన సంప్రదాయ అనువాదం మరియు ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: వధించాలి
  rationale: బోధనా క్రమంలో సంధితో కూడిన Qal perfect ఆజ్ఞాత్మక భావాన్ని ఇస్తుంది. బలి సందర్భంలో సాధారణ ‘చంపాలి’ కంటే ‘వధించాలి’ మరింత ఖచ్చితంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַפָּר
  choice: ఆ ఎద్దును
  rationale: פַּר బలి సందర్భంలో ఎద్దును సూచిస్తుంది. నిర్దిష్ట సూచనను తెలుగులో సహజంగా తెలియజేయడానికి ‘ఆ ఎద్దును’ అని అనువదించబడింది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే అక్షరార్థంగా ‘ముందు’; ఇక్కడ దేవుని సమక్షంలో జరిగే ఆచార చర్యను తెలుగులో సహజంగా తెలిపేందుకు ‘సన్నిధిలో’ అని ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి సాధారణ పునర్నిర్మిత ఉచ్చారణ అయిన ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח ప్రవేశం లేదా ద్వారస్థానాన్ని సూచిస్తుంది. స్థలాన్ని ఆధునిక తెలుగులో స్పష్టంగా చెప్పేందుకు ఈ రూపం సహజంగా ఉంటుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: ఈ స్థిరమైన పరిశుద్ధస్థల నామంలోని ‘గుడారం’ మరియు ‘సమావేశం’ భావాలను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- issue: לִפְנֵי యొక్క స్థల/సాన్నిధ్య భావం
  choice: సన్నిధిలో
  alternative: ముందు
  rationale: ‘ముందు’ అనే స్థలార్థం సాధ్యమే; అయితే బలి ఆచార సందర్భంలో ‘సన్నిధిలో’ దేవుని సమక్ష భావాన్ని సహజంగా తెలియజేస్తుంది, భౌతిక దిశను అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. బలి సంబంధిత ఖచ్చితత్వం కోసం ‘వధించాలి’, పరిశుద్ధస్థల నామానికి చదవడానికి సులభమైన ‘సమావేశ గుడారం’ ఎంచుకున్నాం.
