  edition: WLC
  text: וְ/אֵ֛ת אֵ֥יל הַ/מִּלֻּאִ֖ים תִּקָּ֑ח וּ/בִשַּׁלְתָּ֥ אֶת בְּשָׂר֖/וֹ בְּ/מָקֹ֥ם קָדֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: te
  text: ప్రతిష్ఠాపన పొట్టేలును తీసుకొని, దాని మాంసాన్ని పవిత్రమైన స్థలంలో ఉడికించు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రీకరణకు సంబంధించిన పొట్టేలు.” హీబ్రూ పదం యాజకులను సేవలో ప్రతిష్ఠించే ఆచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గుడారంలోని పరిశుద్ధ స్థలంలో.” అయితే హీబ్రూ మరింత అక్షరార్థంగా “పవిత్రమైన స్థలంలో” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: పొట్టేలు
  rationale: బలి సందర్భంలో మగ గొర్రెను సూచించే సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపనకు సంబంధించిన
  rationale: యాజకులను అధికారికంగా సేవలో నియమించి ప్రతిష్ఠించే ఆచారాన్ని ఈ సాంకేతిక పదం సూచిస్తుంది. ‘ప్రతిష్ఠాపన’ ఆ ఆచారార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּקָּח
  choice: తీసుకొని
  rationale: ఏకవచన సంబోధనలో ఇచ్చిన వరుస ఆదేశాన్ని తెలుగులో సహజంగా తదుపరి క్రియతో అనుసంధానిస్తుంది.
- source_word: וּבִשַּׁלְתָּ
  choice: ఉడికించాలి
  rationale: בשׁל ఇక్కడ నీటిలో ఉడికించడాన్ని సూచిస్తుంది; సాధారణమైన ‘వండాలి’ కంటే ఇది మరింత నిర్దిష్టం.
- source_word: בְּשָׂרוֹ
  choice: దాని మాంసాన్ని
  rationale: బలి జంతువు సందర్భంలో ‘మాంసం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: పవిత్రమైన స్థలంలో
  rationale: మూలంలోని నామవాచకానికీ విశేషణానికీ నిర్దిష్టతను చూపే ఉపపదం లేదు; కాబట్టి ప్రత్యేక మందిర విభాగాన్ని సూచించకుండా అనిర్దిష్ట భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజక ప్రతిష్ఠాపన సందర్భంలోని సాంకేతిక పదం הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపనకు సంబంధించిన పొట్టేలు
  alternative: అభిషేకానికి సంబంధించిన పొట్టేలు; సమర్పణకు సంబంధించిన పొట్టేలు
  rationale: ఈ పదం అక్షరార్థంగా ‘చేతులను నింపడం’ అనే ఆచారపరమైన భావం నుంచి వచ్చి, యాజకులను సేవలో నియమించే ప్రతిష్ఠాపనను సూచిస్తుంది. ‘ప్రతిష్ఠాపన’ కార్యనియామక భావాన్ని తెలియజేస్తూ పవిత్రీకరణ భావాన్ని నిరాకరించదు.
- issue: בְּמָקוֹם קָדֹשׁ సాధారణ పవిత్ర స్థలమా, లేక ‘పరిశుద్ధ స్థలం’ అనే నిర్దిష్ట మందిర గదా
  choice: పవిత్రమైన స్థలంలో
  alternative: పరిశుద్ధ స్థలంలో
  rationale: హీబ్రూ పదబంధం నిర్దిష్ట ఉపపదం లేకుండా ఉంది. అందువల్ల గుడారంలోని ‘పరిశుద్ధ స్థలం’ అనే ప్రత్యేక గదిని తప్పనిసరిగా సూచించినట్లు అనువదించకుండా మూలంలోని స్థల అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ఏకవచన ఆదేశాన్ని తెలుగులో సహజమైన ‘తీసుకొని ... ఉడికించాలి’ నిర్మాణంతో వ్యక్తం చేశాం.
