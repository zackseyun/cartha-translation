source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: te
  text: “ఆ పొట్టేలు నుండి కొవ్వును, కొవ్వు తోకను, అంతర్భాగాలను కప్పే కొవ్వును, కాలేయపు భాగాన్ని, రెండు మూత్రపిండాలను, వాటిమీద ఉన్న కొవ్వును, కుడి తొడను నీవు తీసుకోవాలి. ఎందుకంటే అది ప్రతిష్ఠాపన ఆచారపు పొట్టేలు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంకితీకరణ పొట్టేలు,” లేదా “సేవలో నియమించే పొట్టేలు.” హెబ్రీ పదబంధం యాజకులను వారి సేవలో ప్రతిష్ఠించే ఆచారంలో ఉపయోగించే పొట్టేలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: బలి సందర్భంలో అర్పణకు ప్రత్యేకంగా ఉంచిన జంతువు కొవ్వు భాగాలను సూచిస్తుంది; ‘కొవ్వు’ ప్రత్యక్షమైన, సహజమైన తెలుగు పదం.
- source_word: אַלְיָה
  choice: కొవ్వుతో నిండిన తోక
  rationale: ఇది గొర్రె లేదా పొట్టేలు యొక్క సాధారణ తోకను కాక, ప్రత్యేకంగా కొవ్వు అధికంగా ఉండే తోకను సూచిస్తుంది; శరీర నిర్మాణ సంబంధమైన విశిష్టతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: పేగులను కప్పే కొవ్వు
  rationale: అంతర్గత అవయవాలను కప్పి ఉండే కొవ్వును సూచించే బలి సంబంధమైన సహజ తెలుగు వ్యక్తీకరణ.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: కాలేయపు పొర
  rationale: ఖచ్చితమైన శరీర భాగం ఏదో చర్చనీయమైనప్పటికీ, కాలేయానికి అనుబంధంగా ఉండే అర్పణ భాగాన్ని ‘కాలేయపు పొర’ సంక్షిప్తంగా, సంప్రదాయ బలి భాషకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: כְּלָיֹת
  choice: మూత్రపిండాలు
  rationale: ఇక్కడ ఈ పదం నేరుగా మూత్రపిండాలనే సూచిస్తుంది; రూపకాలంకార భావం లేదు.
- source_word: שׁוֹק הַיָּמִין
  choice: కుడి తొడ
  rationale: బలి జంతువు భాగాల పంపిణీ సందర్భంలో కాలులోని తొడ భాగాన్ని సూచిస్తుంది; ‘కుడి కాలు’ కంటే ‘కుడి తొడ’ మరింత నిర్దిష్టం.
- source_word: אֵיל מִלֻּאִים
  choice: ప్రతిష్ఠాపన పొట్టేలు
  rationale: యాజకులను వారి సేవలో నియమించి ప్రతిష్ఠించే ఆచారంలో ఉపయోగించే పొట్టేలును సూచిస్తుంది; తరువాతి మతసంస్థల ప్రత్యేక భావాలను రుద్దకుండా ఆచార సంబంధమైన భావాన్ని తెలియజేస్తుంది.
- source_word: וְלָקַחְתָּ
  choice: నీవు తీసుకోవాలి
  rationale: ఆదేశాల వరుసలోని హెబ్రీ పరిపూర్ణ క్రియ ఇక్కడ విధిని తెలిపే ఆజ్ఞార్థక భావం కలిగి ఉంది; తెలుగు ప్రక్రియాత్మక సూచనలో ‘తీసుకోవాలి’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֵיל מִלֻּאִים లోని యాజక ప్రతిష్ఠాపన పరిభాష
  choice: ప్రతిష్ఠాపన పొట్టేలు
  alternative: అంకితీకరణ పొట్టేలు; సేవలో నియమించే పొట్టేలు
  rationale: ఈ పదబంధం అహరోను, అతని కుమారులను యాజక సేవలో అధికారికంగా నిలిపే ఆచారానికి సంబంధించినది. ‘ప్రతిష్ఠాపన’ ఆ ఆచార భావాన్ని స్పష్టంగా తెలియజేస్తుంది; హెబ్రీ నుడికారానికి సాధ్యమైన ఇతర భావవ్యక్తీకరణలను పాదసూచికలో ఉంచడం ద్వారా దాని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆచార వివరణ శైలి వాడబడింది. మూలంలోని రెండవ పురుష ఏకవచన ఆదేశాన్ని ‘నీవు ... తీసుకోవాలి’గా నిలిపి, జాబితా నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘ప్రతిష్ఠాపన పొట్టేలు’ వద్దే ఉంచాం.
