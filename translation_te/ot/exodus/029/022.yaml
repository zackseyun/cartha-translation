review_pass:
  verdict: revise
  source_fidelity: The draft preserves the instruction, the sacrificial portions, and the concluding rationale. However, ‘కాలేయపు పొర’ makes a specific anatomical claim (‘membrane’) not warranted by the debated Hebrew יֹתֶרֶת; a more neutral ‘కాలేయపు భాగం’ better preserves the source ambiguity. ‘పేగులను’ is somewhat narrower than the Hebrew term for the inner parts/entrails.
  naturalness: The Telugu is generally clear and appropriately formal. ‘కొవ్వుతో నిండిన తోక’ is understandable but less idiomatic and more periphrastic than ‘కొవ్వు తోక.’ ‘ప్రతిష్ఠాపన ఆచారపు పొట్టేలు’ reads more naturally than the compressed compound ‘ప్రతిష్ఠాపన పొట్టేలు.’
  terminology: ‘కొవ్వు,’ ‘మూత్రపిండాలు,’ and ‘కుడి తొడ’ are suitable. ‘అంతర్భాగాలను కప్పే కొవ్వు’ represents the Hebrew sacrificial anatomy without limiting it to intestines. The ordination terminology is retained without importing a denominational office concept.
  issues:
  - severity: medium
    issue: ‘కాలేయపు పొర’ for יֹתֶרֶת הַכָּבֵד
    rationale: The exact anatomical referent is disputed and is conventionally rendered ‘lobe/appendage of the liver’; ‘membrane’ is overly specific and lacks clear source support. A neutral expression preserves the ambiguity.
  - severity: low
    issue: ‘పేగులను కప్పే కొవ్వు’ narrows הַקֶּרֶב
    rationale: The Hebrew denotes the inner parts/entrails broadly, not necessarily only the intestines.
  - severity: low
    issue: ‘కొవ్వుతో నిండిన తోక’ is unnecessarily periphrastic
    rationale: ‘కొవ్వు తోక’ directly conveys the anatomically distinctive fat tail in natural Telugu.
  revised_text: “ఆ పొట్టేలు నుండి కొవ్వును, కొవ్వు తోకను, అంతర్భాగాలను కప్పే కొవ్వును, కాలేయపు భాగాన్ని, రెండు మూత్రపిండాలను, వాటిమీద ఉన్న కొవ్వును, కుడి తొడను నీవు తీసుకోవాలి. ఎందుకంటే అది ప్రతిష్ఠాపన ఆచారపు పొట్టేలు[a].”
