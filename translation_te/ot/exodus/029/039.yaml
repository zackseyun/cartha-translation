source:
  edition: WLC
  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: te
  text: ఒక గొర్రెపిల్లను ఉదయం అర్పించాలి; రెండవ గొర్రెపిల్లను రెండు సంధ్యల మధ్య[a] అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రెండు సంధ్యల మధ్య.’ ఇది సాధారణంగా సాయంసంధ్య వేళగా, లేదా మధ్యాహ్నం తరువాతి భాగం నుంచి సూర్యాస్తమయం వరకు ఉండే కాలంగా అర్థం చేసుకునే సంప్రదాయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: గొర్రెపిల్ల
  rationale: బలి సందర్భంలో ఈ పదం అర్పణకు తగిన చిన్న గొర్రెను సూచిస్తుంది; ఆధునిక తెలుగులో ‘గొర్రెపిల్ల’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָאֶחָד
  choice: ఒక
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘ఒకటి/ఒక’; తరువాత వచ్చే ‘రెండవ’ అనే పదంతో జతను, క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: అర్పించాలి
  rationale: అక్షరార్థం ‘చేయాలి’ అయినా, బలి ఆదేశాల సందర్భంలో బలిని నిర్వహించడం లేదా అర్పించడం అనే భావం వస్తుంది; ‘అర్పించాలి’ ఆ ఆచారార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַבֹּקֶר
  choice: ఉదయం
  rationale: కాలాన్ని సూచించే ఈ పదబంధానికి ఇది సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: הַשֵּׁנִי
  choice: రెండవ
  rationale: రెండు దైనందిన అర్పణల క్రమాన్ని నేరుగా నిలుపుతుంది.
- source_word: בֵּין הָעַרְבָּיִם
  choice: రెండు సంధ్యల మధ్య
  rationale: హీబ్రూ వివాదాస్పద సంప్రదాయ నుడికారంలోని ‘మధ్య’ భావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని సాధారణ కాలార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆదేశ శైలిని ఉపయోగించాం. హీబ్రూ నుడికారంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
