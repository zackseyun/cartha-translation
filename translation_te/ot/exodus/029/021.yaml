id: EXO.29.21
reference: Exodus 29:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: te
  text: అప్పుడు బలిపీఠం మీద ఉన్న రక్తంలో కొంత, అభిషేక తైలంలో కొంత తీసుకొని, అహరోను మీద, అతని వస్త్రాల మీద, అతని కుమారుల మీద, అతనితో పాటు ఉన్న అతని కుమారుల వస్త్రాల మీద చిలకరించాలి. అప్పుడు అతడూ, అతని వస్త్రాలూ, అతనితో పాటు అతని కుమారులూ, వారి వస్త్రాలూ పవిత్రంగా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిష్ఠించబడతారు.’ హీబ్రూ వాచ్యంగా ‘పవిత్రంగా ఉంటారు’ అని చెబుతూ, ఈ ఆచార చర్య తర్వాత కలిగే పవిత్ర స్థితిని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: తీసుకొని
  rationale: వావ్‌తో కూడిన ఖాల్ పర్ఫెక్ట్ ఇక్కడ క్రమబద్ధమైన ఆచార సూచనగా పనిచేస్తుంది. తెలుగులో తరువాతి ప్రధాన క్రియతో కలిపిన ‘తీసుకొని ... చిలకరించాలి’ సహజంగా ఆ ఆదేశార్థాన్ని తెలియజేస్తుంది.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీద ఉన్న రక్తంలో కొంత
  rationale: מִן మొత్తం నుంచి ఒక భాగాన్ని తీసుకోవడాన్ని సూచిస్తుంది; ‘రక్తంలో కొంత’ ఈ భావాన్ని స్పష్టంగా ఉంచుతుంది. אֲשֶׁר עַל అనే సంబంధ వాక్యాన్ని ‘మీద ఉన్న’గా నిలిపింది.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: అభిషేకానికి ఉపయోగించే నూనెను సూచించే నిర్మాణ పదబంధం. ‘అభిషేక తైలం’ ఆధునిక తెలుగు బైబిలు సందర్భంలో సహజమైనదీ గౌరవప్రదమైనదీ.
- source_word: הִזֵּיתָ
  choice: చిలకరించాలి
  rationale: హిఫిల్ రూపంలోని נזה ఆచార సందర్భంలో ద్రవాన్ని చిలకరించడాన్ని సూచిస్తుంది. ముందుగా చెప్పిన రక్తం, తైలం రెండింటినీ పునరుక్తి చేయకుండా క్రియ సహజంగా వర్తిస్తుంది.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: అతని వస్త్రాలు / అతని కుమారుల వస్త్రాలు
  rationale: בגד సాధారణంగా వస్త్రాలను సూచిస్తుంది. ‘వస్త్రాలు’ యాజక సందర్భానికి సరిపోతూ, మూలంలో లేని తరువాతి మతపరమైన ప్రత్యేక పదజాలాన్ని చేర్చదు.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: మూలంలోని పురుష బహువచనం సందర్భంలో అహరోను కుమారులనే నిర్దిష్టంగా సూచిస్తుంది.
- source_word: אִתּוֹ
  choice: అతనితో ఉన్న
  rationale: అహరోనుతో కలిసి ఉన్న అతని కుమారుల సంబంధాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְקָדַשׁ
  choice: పవిత్రంగా ఉంటారు
  rationale: ఈ ఆచార చర్య ఫలితంగా ఏర్పడే పవిత్ర స్థితిని ఖాల్ రూపం సూచిస్తుంది. ‘పవిత్రంగా ఉంటారు’ קדשׁ మూల భావాన్ని ఉంచి, ప్రక్రియను అవసరానికి మించి సాంకేతికంగా నిర్వచించదు.
- source_word: הוּא
  choice: అతడు
  rationale: మూలంలోని సర్వనామాన్ని నిలిపి, ముందుగా పేర్కొన్న అహరోనునే స్పష్టంగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: ఆచార సంబంధమైన పవిత్రీకరణ ఫలితాన్ని అనువదించడం
  choice: పవిత్రంగా ఉంటారు
  alternative: ప్రతిష్ఠించబడతారు
  rationale: వచనం రక్తం, తైలం చిలకరించిన ఫలితాన్ని קדשׁ అనే పవిత్రత పదంతో వ్యక్తం చేస్తుంది. ‘పవిత్రంగా ఉంటారు’ మూలంలోని స్థితి భావాన్ని నిలుపుతుంది; ‘ప్రతిష్ఠించబడతారు’ సాధ్యమైన భావానువాదమైనా, ప్రక్రియను మరింత సాంకేతికంగా చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆచార భాషను ఉపయోగించింది. మూలంలోని వరుస నిర్మాణం, ‘అతనితో’ అనే సంబంధం, పవిత్రత ఫలితం సాధ్యమైనంత స్పష్టంగా నిలిపాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
