  terminology: ‘బలిపీఠం,’ ‘అభిషేక తైలం,’ ‘వస్త్రాలు,’ ‘పవిత్రంగా ఉంటారు’ అనే పదాలు సందర్భానుకూలంగా ఉన్నాయి. ‘పవిత్రంగా ఉంటారు’ קדשׁ యొక్క ఫలిత-స్థితి భావాన్ని సంరక్షిస్తుంది; పాదసూచికలోని ‘ప్రతిష్ఠించబడతారు’ సముచిత ప్రత్యామ్నాయం.
