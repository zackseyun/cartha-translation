  source_fidelity: మూల హీబ్రూ క్రమాన్ని, బలిపీఠంపైని రక్తం మరియు అభిషేక తైలంలో కొంత తీసుకొని చిలకరించే చర్యను, అలాగే దాని ఫలితమైన పవిత్ర స్థితిని ముసాయిదా నమ్మకంగా తెలియజేస్తుంది. అయితే אִתּוֹ (‘అతనితో/అతనితో పాటు’) చివరి జాబితాలో కుమారులు మరియు వారి వస్త్రాలు రెండింటికీ సంబంధించేలా ఉంచడం మరింత స్పష్టంగా ఉండాలి.
