source:
  edition: WLC
  text: וְ/לֶ֣חֶם מַצּ֗וֹת וְ/חַלֹּ֤ת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן סֹ֥לֶת חִטִּ֖ים תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: te
  text: పులియని రొట్టెను, నూనె కలిపిన పులియని రొట్టెలను[a], నూనె పూసిన పులియని పలుచని రొట్టెలను[b] సిద్ధం చేయాలి; వాటిని మెత్తగా పట్టిన గోధుమపిండితో చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పులియని రొట్టెలు’ అని అనువదించిన హీబ్రూ పదం గుండ్రని రొట్టెను లేదా కేకువంటి రొట్టె పదార్థాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నూనె పూసిన’ అని అనువదించిన హీబ్రూ క్రియ సాధారణంగా ‘నూనెతో అభిషేకించిన’ అని కూడా అర్థమవుతుంది; ఇక్కడ అది పలుచని రొట్టెల తయారీ విధానాన్ని వివరిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: పొంగని రొట్టె
  rationale: మత్సోత్ అనే పదం పులియబెట్టని, అందువల్ల పొంగని రొట్టెను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేలా, ఆచార సంబంధమైన ప్రత్యేకతను నిలిపే అనువాదం.
- source_word: חַלֹּת מַצֹּת
  choice: పొంగని రొట్టెలు
  rationale: חַלָּה గుండ్రని రొట్టె లేదా రొట్టెవంటి వంటకాన్ని సూచించగలదు. సాధారణ לֶחֶם నుంచి దీనిని వేరుచేసేది ఇక్కడ నూనె కలిపిన తయారీ విధానం; కాబట్టి అస్పష్టమైన ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘రొట్టెలు’ అని ఇచ్చాం.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: నూనె కలిపిన
  rationale: בלל యొక్క కర్మణి రూపం పదార్థంలో నూనెను కలపడం లేదా మేళవించడం సూచిస్తుంది. ‘నూనె కలిపిన’ అనేది స్పష్టమైన సహజ తెలుగు.
- source_word: רְקִיקֵי מַצּוֹת
  choice: పొంగని పలుచని రొట్టెలు
  rationale: רָקִיק పలుచని రొట్టెవంటి పదార్థాన్ని సూచిస్తుంది. ‘పలుచని రొట్టెలు’ మందమైన חַלּוֹתతో వ్యత్యాసాన్ని చూపిస్తూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: నూనె పూసిన
  rationale: משׁח సాధారణంగా అభిషేకించడం అని అర్థమైనా, ఇక్కడ ఆహార తయారీ సందర్భంలో రొట్టెలపై నూనె పూయడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సందర్భోచిత సహజ అర్థాన్ని ఇచ్చి, మూలపద సంబంధాన్ని పాదసూచికలో నిలిపాం.
- source_word: סֹלֶת חִטִּים
  choice: సన్నని గోధుమ పిండి
  rationale: סֹלֶת మెత్తగా లేదా సన్నగా చేసిన ఉత్తమ పిండిని, חִטִּים గోధుమలను సూచిస్తాయి. ‘సన్నని గోధుమ పిండి’ రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: వాటిని ... చేయాలి
  rationale: ఈ ఆచార నియమ సందర్భంలో అసంపూర్ణ క్రియ ఆదేశాత్మక బలాన్ని కలిగి ఉంది. తెలుగు నియమశైలిలో ‘చేయాలి’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מְשֻׁחִים అనే పదంలోని ‘అభిషేకం’ భావసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘నూనె పూసిన’
  alternative: ‘నూనెతో అభిషేకించిన’
  rationale: ఇది రొట్టెల తయారీ వివరణ కావడంతో ‘పూసిన’ సందర్భానికి సహజం. అయితే ఆ క్రియ సాధారణంగా ‘అభిషేకించు’ అని కూడా అర్థమవుతుందనే మూలపద సంబంధాన్ని పాదసూచికలో వెల్లడించాం; తద్వారా ఆచార సంబంధ ప్రతిధ్వనిని పూర్తిగా దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార నియమానికి తగిన గౌరవప్రదమైన సరళ శైలి. మూడు రకాల రొట్టె పదార్థాల మధ్య వ్యత్యాసాన్ని క్రమం, తయారీ విధానం, మందం ద్వారా స్పష్టపరిచాం. వచనం ముందటి వాక్యంలోని ఆజ్ఞా నిర్మాణానికి అనుసంధానమైనప్పటికీ, తెలుగులో చదవడానికి సహజంగా రెండు వాక్యాలుగా ఇచ్చాం.
