  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: te
  text: ఏడు రోజులపాటు నీవు బలిపీఠం కోసం ప్రాయశ్చిత్తం చేసి, దాన్ని ప్రతిష్ఠించాలి. అప్పుడు ఆ బలిపీఠం అత్యంత పరిశుద్ధమైనదిగా ఉంటుంది. బలిపీఠాన్ని తాకేదేదైనా పరిశుద్ధమవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలిపీఠాన్ని తాకేది పరిశుద్ధమైనదై ఉండాలి.” హీబ్రూ వాక్యాన్ని, తాకడం వల్ల పరిశుద్ధత కలుగుతుందని గానీ, పరిశుద్ధమైన వ్యక్తి లేదా వస్తువు మాత్రమే దాన్ని తాకాలని గానీ అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ వాక్యంలో స్పర్శ ద్వారా పరిశుద్ధత కలుగుతుందా, లేక తాకేవారికి పరిశుద్ధత అవసరమని నియమించబడిందా అనే నిజమైన అర్థసందిగ్ధతను, వ్యక్తి/వస్తువు విస్తృతిని కాపాడుతూ భద్రపరచడం.
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయాలి
  rationale: యాజక ఆచార సందర్భంలో כפר బలిపీఠం కోసం ప్రాయశ్చిత్త లేదా శుద్ధీకరణ కర్మను చేయడాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్తం చేయాలి’ అనేది ఆచార విధానాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా స్థిరమైన తెలుగు పదప్రయోగాన్ని ఇస్తుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం కోసం
  rationale: כפר తో కలిసిన עַל ఇక్కడ ప్రాయశ్చిత్త కర్మ ఏ వస్తువు నిమిత్తం చేయబడుతుందో సూచిస్తుంది; అందువల్ల ‘బలిపీఠం కోసం’ సహజంగా ఉండి హీబ్రూ ఆచారపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: దాన్ని ప్రతిష్ఠించాలి
  rationale: కిద్దష్ ఇక్కడ బలిపీఠాన్ని పరిశుద్ధ ఉపయోగం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించాలి’ ఆరాధనా సందర్భానికి సహజంగా సరిపోతూ, తరువాతి ‘పరిశుద్ధమైనది’ అనే స్థితి వర్ణనతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పరిశుద్ధమైనది
  rationale: ఈ హీబ్రూ నిర్మాణం పరిశుద్ధతలో అత్యున్నత స్థాయిని సూచిస్తుంది. ‘అత్యంత పరిశుద్ధమైనది’ ఆధునిక తెలుగులో స్పష్టమైన అతిశయార్థక వ్యక్తీకరణ.
- source_word: כָּל הַנֹּגֵעַ
  choice: తాకేదేదైనా
  rationale: כָּל తో ఉన్న కర్తృవాచక రూపం వ్యక్తిని లేదా వస్తువును సూచించగలదు. ‘తాకేదేదైనా’ ఆ విస్తృతిని కాపాడి, అర్థాన్ని కేవలం వ్యక్తులకు పరిమితం చేయదు.
- source_word: יִקְדָּשׁ
  choice: పరిశుద్ధమవుతుంది
  rationale: ఇక్కడ క్రియ స్పర్శ ఫలితంగా పరిశుద్ధ స్థితిలోకి రావడాన్ని సూచించగలదు. ‘పరిశుద్ధమవుతుంది’ ఆ ఫలితార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: బలిపీఠాన్ని తాకడం వల్ల పరిశుద్ధత కలగడం అనే భావం
  choice: ప్రతిష్ఠించబడిన బలిపీఠాన్ని తాకేది పరిశుద్ధమవుతుంది.
  alternative: పరిశుద్ధమైన వ్యక్తి లేదా వస్తువు మాత్రమే బలిపీఠాన్ని తాకాలి; లేదా దాన్ని తాకే వ్యక్తి పరిశుద్ధుడై ఉండాలి.
  rationale: יִקְדָּשׁ యొక్క సందర్భానుసారమైన సాధారణ భావం తాకినది పరిశుద్ధమవుతుందని సూచిస్తుంది. అయినా, అది తాకేవారికి అవసరమైన పరిశుద్ధ స్థితిని నిర్దేశిస్తుందని కూడా హీబ్రూను అర్థం చేసుకోవచ్చు; అందువల్ల ప్రధాన పాఠంలో మొదటి భావాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆచారపరమైన శైలి ఉపయోగించబడింది. ‘బలిపీఠం,’ ‘ప్రాయశ్చిత్తం,’ ‘ప్రతిష్ఠించాలి,’ ‘పరిశుద్ధమైనది’ వంటి సాధారణ బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
