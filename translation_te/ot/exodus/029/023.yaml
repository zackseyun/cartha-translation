- from: మరియు యహ్వే[a] సన్నిధిలో ఉన్న పులియని రొట్టెల గంపలోనుంచి ఒక రొట్టెను, నూనెతో చేసిన ఒక రొట్టెను, ఒక పలుచని రొట్టెను తీసుకో.
  to: యహ్వే[a] సన్నిధిలో ఉన్న పులియని రొట్టెల గంపలోనుండి గుండ్రని రొట్టె ఒకటి, నూనె కలిపిన రొట్టె ఒకటి, పలుచని రొట్టె ఒకటి తీసుకో.
  rationale: The revision retains the inherited imperative ‘తీసుకో,’ which is required by the preceding Hebrew syntax and is supplied for a complete Telugu instruction. It restores the round-loaf distinction of כִּכַּר, renders the oil bread more precisely, and corrects the wording of the divine-name footnote. No disputed textual ambiguity has been resolved beyond what the Hebrew wording supports.
