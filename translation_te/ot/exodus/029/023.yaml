id: EXO.29.23
reference: Exodus 29:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: te
  text: యహ్వే[a] సన్నిధిలో ఉన్న పులియని రొట్టెల గంపలోనుండి గుండ్రని రొట్టె ఒకటి, నూనె కలిపిన రొట్టె ఒకటి, పలుచని రొట్టె ఒకటి తీసుకో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH”; “యెహోవా” అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామానికి ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ తెలుగు రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: ఒక రొట్టె
  rationale: כִּכַּר ఇక్కడ గుండ్రని రొట్టె లేదా రొట్టె ముద్దను సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేందుకు ‘రొట్టె’ అని అనువదించాం; తరువాతి రెండు రకాలతో దీనిని వేరు చూపించాం.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: నూనెతో చేసిన ఒక రొట్టె
  rationale: חַלָּה ఒక రొట్టె లేదా కేకులాంటి రొట్టెను సూచిస్తుంది; שֶׁמֶן దాని నూనె సంబంధాన్ని తెలియజేస్తుంది. నూనెను తప్పనిసరిగా పిండిలో కలిపారని మూలపాఠం స్పష్టంగా చెప్పనందున ‘నూనెతో చేసిన’ అనే విస్తృతమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: רָקִיק
  choice: ఒక పలుచని రొట్టె
  rationale: רָקִיק పలుచగా చేసిన రొట్టెను సూచిస్తుంది. ‘పలుచని రొట్టె’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; ‘అప్పడం’ వంటి మరింత నిర్దిష్టమైన స్థానిక ఆహారపదాన్ని నివారించాం.
- source_word: מִסַּל הַמַּצּוֹת
  choice: పులియని రొట్టెల గంపలోనుంచి
  rationale: מִן మూలం లేదా తీసుకునే స్థలాన్ని, סַל గంపను, מַצּוֹת పులియని రొట్టెలను సూచిస్తాయి. తెలుగు వాక్యక్రమానికి అనుగుణంగా ఈ పదబంధాన్ని ముందుకు తెచ్చాం.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో ఉన్న
  rationale: לִפְנֵי అనే పదానికి ‘ముందు’ లేదా ‘సన్నిధిలో’ అనే భావం ఉంది. ఆరాధనా సందర్భంలోని స్థానిక భావాన్ని సహజంగా తెలియజేయడానికి ‘సన్నిధిలో ఉన్న’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే ‘యహ్వే’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది; ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: నూనె రొట్టె తయారీ విధానం
  choice: నూనెతో చేసిన ఒక రొట్టె
  alternative: నూనె కలిపిన ఒక రొట్టె
  rationale: לֶחֶם שֶׁמֶן నూనెతో సంబంధమున్న రొట్టెను సూచిస్తుంది గాని, ఈ పదబంధం మాత్రమే నూనెను పిండిలో కలిపిన విధానాన్ని నిర్బంధంగా నిర్ణయించదు. అందువల్ల విస్తృత భావాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ఈ వచనం ముందున్న ఆజ్ఞకు కొనసాగింపుగా ఉన్నప్పటికీ, తెలుగులో స్వతంత్రంగా అర్థమయ్యేలా సందర్భం నుంచి గ్రహించబడే ‘తీసుకో’ అనే క్రియను చివర చేర్చాం. ప్రతి వస్తువుకు ఉన్న ‘ఒక’ అనే సంఖ్యను ఆచారపరమైన ఖచ్చితత్వం కోసం నిలిపాం.
