base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: te
  text: నీవు కోడె రక్తంలో కొంత[a] తీసుకొని, నీ వేలితో బలిపీఠపు కొమ్ముల[b] మీద అద్దాలి. రక్తమంతటినీ బలిపీఠపు పునాది దగ్గర[c] కుమ్మరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘కోడె రక్తం నుండి.’ ఇక్కడ హీబ్రూ వ్యక్తీకరణ బలిపీఠానికి అద్దడానికి రక్తంలో ఒక భాగాన్ని తీసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కొమ్ములు’ అంటే బలిపీఠపు మూలల దగ్గర పైకి పొడుచుకొని ఉండే కొమ్ము ఆకారపు భాగాలు.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘బలిపీఠపు పునాది వద్దకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: నీవు ... తీసుకొని
  rationale: సూచనల వరుసలో సంధితో కూడిన Qal perfect ఆజ్ఞార్థక విధిని కలిగి ఉంది. తెలుగులో తరువాతి ప్రధాన క్రియతో కలిపిన ‘తీసుకొని’ సహజంగా ఆ క్రమాన్ని చూపుతుంది.
- source_word: מִדַּם הַפָּר
  choice: కోడె రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది—మొత్తం రక్తంలో ఒక భాగాన్ని తీసుకోవడం. ‘కోడె’ బలికి సంబంధించిన మగ పశువును స్పష్టంగా సూచిస్తుంది.
- source_word: וְנָתַתָּה
  choice: అద్దాలి
  rationale: נתן యొక్క ప్రాథమిక భావం ‘పెట్టు/ఉంచు’; రక్తాన్ని బలిపీఠపు కొమ్ముల మీద వేలితో పెట్టే ఈ సందర్భంలో ‘అద్దాలి’ సహజమైన తెలుగు ప్రయోగం, అయితే సాంకేతిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ముల మీద
  rationale: కַרְנוֹת అనే స్పష్టమైన బలిపీఠ సంబంధ రూపకల్పనను ‘కొమ్ములు’గా నిలుపుతుంది; వాటిని సాధారణంగా ‘మూలలు’ అని మార్చదు.
- source_word: בְּאֶצְבָּעֶךָ
  choice: నీ వేలితో
  rationale: בְּ ఇక్కడ సాధనార్థకం. నిర్దేశించిన ఆచార విధానాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: రక్తమంతటినీ ... కుమ్మరించాలి
  rationale: שׁפך ఉద్దేశపూర్వకంగా ద్రవాన్ని కుమ్మరించడాన్ని సూచిస్తుంది. మూలంలోని ‘రక్తమంతటినీ’ అనే సంపూర్ణ వ్యక్తీకరణను ‘మిగిలిన’ అని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: బలిపీఠపు పునాది దగ్గర
  rationale: יְסוֹד అంటే పునాది/అడుగు భాగం. אֶל యొక్క దిశాత్మక ఛాయను సందర్భానుసారంగా ఆ ప్రదేశం వద్ద కుమ్మరించడంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బలిపీఠ నిర్మాణానికి సంబంధించిన ఆచార పదాల నిర్దిష్టత
  choice: ‘కొమ్ములు,’ ‘పునాది’ అనే స్పష్టమైన పదాలను నిలుపడం
  alternative: ‘మూలలు,’ ‘అడుగు భాగం’ అని సాధారణీకరించడం
  rationale: ఈ వచనం ప్రతిష్ఠాపన ఆచారంలోని నిర్దిష్ట చర్యను వివరిస్తుంది. బలిపీఠపు భౌతిక లక్షణాలను నిలుపడం బలి వ్యవస్థలోని ఆచారపరమైన స్వరూపాన్ని కాపాడుతుంది; తరువాతి సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞార్థక శైలిని వాడాం. ఆచార సంబంధ నిర్దిష్ట పదాలను కాపాడుతూ, వాక్యాన్ని సహజమైన రెండు తెలుగు వాక్యాలుగా విభజించాం.
