source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: te
  text: రెండవ గొర్రెపిల్లను సంధ్యవేళలో[a] అర్పించాలి. ఉదయపు ధాన్యార్పణ ప్రకారమూ, దానికోసం నిర్ణయించిన పానార్పణ ప్రకారమూ దానికోసం చేయాలి. అది యహ్వేకు ఇంపైన సువాసన కలిగించే అగ్న్యర్పణ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘రెండు సాయంకాలాల మధ్య’; ఇది మధ్యాహ్నం తరువాతి భాగాన్ని లేదా సంధ్యాకాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆహారార్పణ’. ఈ హీబ్రూ బలి పదాన్ని ‘అగ్నితో అర్పించే అర్పణ’ అని కూడా విస్తరించి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: రెండో గొర్రెపిల్ల
  rationale: כֶּבֶשׂ బలికి తగిన గొర్రెపిల్లను సూచిస్తుంది; ముందటి దినబలి తరువాతి క్రమాన్ని הַשֵּׁנִי స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: అర్పించాలి
  rationale: పదశః ‘చేయాలి’ అయినా, బలి సందర్భంలో తెలుగు సహజ ప్రయోగం ‘అర్పించాలి’.
- source_word: בֵּין הָעַרְבָּיִם
  choice: సంధ్యవేళలో
  rationale: పదశః ‘రెండు సాయంకాలాల మధ్య’; ఇది మధ్యాహ్నం తరువాతి భాగం లేదా సంధ్యాకాలాన్ని సూచించే హీబ్రూ కాలవాచక నుడికారం. దాని పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: ఉదయం అర్పించినట్లే ... ధాన్యార్పణను
  rationale: బలి ధర్మశాస్త్ర సందర్భంలో מִנְחָה జంతుబలితో కూడిన ధాన్యార్పణను సూచిస్తుంది; తెలుగు వాక్యక్రమంలో పోలికను ముందుగా ఉంచడం సహజంగా ఉంది.
- source_word: וּכְנִסְכָּהּ
  choice: పానార్పణను
  rationale: נֶסֶךְ పోసి అర్పించే ద్రవార్పణను సూచిస్తుంది; ‘పానార్పణ’ సంక్షిప్తంగా, స్పష్టంగా బలి సంబంధిత భావాన్ని అందిస్తుంది.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: ఇంపైన సువాసనగా
  rationale: దేవునికి ఆమోదయోగ్యమైన బలిని సూచించే స్థిరమైన బలి సూత్రభాషను, దాని సువాసన రూపకాన్ని నిలిపి ఉంచుతూ సహజ తెలుగులో ఇచ్చాం.
- source_word: אִשֶּׁה
  choice: అగ్ని అర్పణ
  rationale: ఈ బలి సంబంధిత పదం సాధారణంగా అగ్నితో అర్పించే అర్పణను సూచిస్తుంది. ‘ఆహార అర్పణ’ అనే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో నిలిపాం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం ఇక్కడ దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని ఇవ్వడం మూలరూపానికి దగ్గరగా ఉంటుంది.
- issue: אִשֶּׁה అనే బలి పదం
  choice: అగ్ని అర్పణ
  alternative: ఆహార అర్పణ
  rationale: ఈ పదానికి అగ్నితో అర్పించే బలి అనే సాంప్రదాయ అవగాహన ఉంది; కొందరు దాన్ని దేవునికి సమర్పించే ఆహార కానుక వర్గంగా గ్రహిస్తారు. ప్రధాన పాఠంలో మొదటి భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. బలి సంబంధిత సాంకేతిక పదాలకు ‘ధాన్యార్పణ’, ‘పానార్పణ’, ‘అగ్ని అర్పణ’ అనే సమాంతర రూపాలు ఎంచుకున్నాం; మూలంలోని కాలనుడికారం మరియు אִשֶּׁה పదంలోని భావభేదాన్ని పాదసూచికల్లో నిలిపాం.
