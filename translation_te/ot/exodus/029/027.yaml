review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal ritual terms and the wave/raise verbal links, but ‘ప్రతిష్ఠిత అర్పణ’ renders תְּרוּמָה as ‘consecrated offering’ and thereby obscures its contribution/raised-offering sense. The final possessive phrases are also presented as ‘parts,’ an interpretive addition not expressed in the Hebrew.
  naturalness: The wording is generally understandable, but placing the Aaron-and-sons phrases between dashes after ‘తొడను’ makes their syntactic relation unclear. A closer ordering and explicit parallel phrasing read more naturally.
  terminology: ‘ఊపార్పణ’ and ‘ప్రతిష్ఠాపన పొట్టేలు’ are suitable cultic renderings. ‘ఎత్తి అర్పణ’ better reflects תְּרוּמָה than ‘ప్రతిష్ఠిత అర్పణ,’ while retaining the ritual connection with ‘పైకెత్తబడిన.’
  issues:
  - severity: medium
    issue: ‘ప్రతిష్ఠిత అర్పణ’ for תְּרוּמָה
    rationale: This means a consecrated offering and overlaps semantically with the verse’s verb ‘ప్రతిష్ఠించాలి’; it does not adequately represent the contribution/raised-offering category signaled by תְּרוּמָה and הוּרָם.
  - severity: medium
    issue: Addition of ‘భాగం’ in the final possessive phrases
    rationale: The Hebrew says ‘from what was for/belonged to Aaron’ and ‘from what was for/belonged to his sons.’ Although portions are contextually involved, ‘భాగం’ adds an explicit noun and is unnecessary.
  - severity: low
    issue: Unclear attachment of the final phrases
    rationale: The dash-enclosed phrases after the object can sound as though they modify only the thigh. Reordering them with the source’s ‘from the ram’ construction makes the relationship clearer.
  revised_text: నీవు ప్రతిష్ఠాపన పొట్టేలు నుండి, అహరోనుకు చెందిన దానినుండీ అతని కుమారులకు చెందిన దానినుండీ, ఊపబడిన ఊపార్పణ రొమ్మును, పైకెత్తబడిన ఎత్తి అర్పణ తొడను ప్రతిష్ఠించాలి.[a][b]
