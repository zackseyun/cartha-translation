revisions:
- from: నీవు ప్రతిష్ఠాపన పొట్టేలు నుండి ఊపబడిన ఊపార్పణ రొమ్మును, పైకెత్తబడిన ప్రతిష్ఠిత అర్పణ తొడను—అహరోనుకు చెందిన భాగం నుండి, అతని కుమారులకు చెందిన భాగం నుండి—ప్రతిష్ఠించాలి.[a][b]
  to: నీవు ప్రతిష్ఠాపన పొట్టేలు నుండి, అహరోనుకు చెందిన దానినుండీ అతని కుమారులకు చెందిన దానినుండీ, ఊపబడిన ఊపార్పణ రొమ్మును, పైకెత్తబడిన ఎత్తి అర్పణ తొడను ప్రతిష్ఠించాలి.[a][b]
  rationale: The revision replaces the misleading ‘ప్రతిష్ఠిత అర్పణ’ with a Telugu expression that retains the raised/contribution sense of תְּרוּמָה, removes the unstated noun ‘భాగం,’ and reorders the phrase so that the source syntax and the two possessive expressions are clearer. The ritual terminology and the Hebrew noun–verb links are retained.
