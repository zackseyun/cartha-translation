source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: te
  text: నీవు ప్రతిష్ఠాపన పొట్టేలు నుండి, అహరోనుకు చెందిన దానినుండీ అతని కుమారులకు చెందిన దానినుండీ, ఊపబడిన ఊపార్పణ రొమ్మును, పైకెత్తబడిన ఎత్తి అర్పణ తొడను ప్రతిష్ఠించాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎత్తి అర్పణ తొడ’ను ‘పైకెత్తే అర్పణ తొడ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘నింపుదలల పొట్టేలు’; యాజకులను పదవిలో ప్రతిష్ఠించే ఆచారంలో ఉపయోగించిన పొట్టేలు అని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: ప్రతిష్ఠించాలి
  rationale: పీయేల్ రూపం ‘పవిత్రమైనదిగా ప్రత్యేకించు’ అనే ఆచార సంబంధ భావాన్ని ఇస్తుంది; ఆధునిక తెలుగు యాజక ప్రతిష్ఠ సందర్భంలో ‘ప్రతిష్ఠించాలి’ సహజంగా ఉంది.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ఊపార్పణ రొమ్ము
  rationale: జంతువు రొమ్ము భాగాన్నీ, యెహోవా సన్నిధిలో ఊపే నిర్దిష్ట ఆచారాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ప్రతిష్ఠిత అర్పణ తొడ
  rationale: שׁוֹק ను బలి జంతువు తొడగా అనువదించి, תְּרוּמָה లోని పైకెత్తి ప్రత్యేకించే అర్పణ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ప్రత్యక్ష ఆచారార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הוּנַף
  choice: ఊపబడిన
  rationale: נוף క్రియకు, ‘ఊపార్పణ’ అనే నామపదానికి మధ్యనున్న ఉద్దేశపూర్వక పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: הוּרָם
  choice: పైకెత్తబడిన
  rationale: רום యొక్క హోఫల్ రూపంలోని ప్రత్యక్ష ఆచార చర్యను అనువదిస్తుంది.
- source_word: אֵיל הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపన పొట్టేలు
  rationale: అక్షరార్థంగా ‘నింపుదలల పొట్టేలు’; ఇక్కడ యాజకులను పదవిలో ప్రతిష్ఠించే ఆచారంలో వాడిన పొట్టేలును సూచిస్తుంది.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: అహరోనుకు చెందిన భాగం నుండి, అతని కుమారులకు చెందిన భాగం నుండి
  rationale: హీబ్రూ సంబంధ-స్వామ్య నిర్మాణాన్ని సహజ తెలుగులో చూపుతూ, అహరోను భాగాన్నీ అతని కుమారుల భాగాన్నీ వేరు చేస్తుంది.
theological_decisions:
- issue: బలి ఆచారంలోని సాంకేతిక పదాల అనువాదం
  choice: ‘ఊపార్పణ,’ ‘ఊపబడిన,’ ‘పైకెత్తబడిన’ వంటి ప్రత్యక్ష ఆచార భాషను నిలుపుట
  alternative: ‘సమర్పణ’ లేదా ‘ప్రత్యేక భాగం’ వంటి సాధారణీకరించిన పదాలు వాడుట
  rationale: హీబ్రూ పాఠం నామపదాలు, వాటికి సంబంధించిన ఆచార క్రియల మధ్య ఉద్దేశపూర్వక సంబంధాన్ని ఉంచుతుంది. దాన్ని నిలపడం మూలపాఠానికి పారదర్శకంగా ఉండి, తరువాతి మతశాఖల వివరణలను చేర్చకుండా ఉంటుంది.
- issue: תְּרוּמָה యొక్క అర్థ పరిధి
  choice: ప్రధాన పాఠంలో ‘ప్రతిష్ఠిత అర్పణ,’ పాదసూచికలో ‘పైకెత్తే అర్పణ’ ప్రత్యామ్నాయం
  alternative: సంప్రదాయబద్ధమైన కానీ ఆధునిక తెలుగులో అస్పష్టమైన సాంకేతిక పదాన్ని మాత్రమే వాడుట
  rationale: ఈ నామవాచకం ప్రత్యేకంగా సమర్పించిన కానుకను సూచించగలదు; ఈ వచనంలోని הוּרָם దాని పైకెత్తే ఆచార సంబంధాన్ని కూడా స్పష్టం చేస్తుంది. రెండు కోణాలనూ తెలియజేయడం అస్పష్టతను అనవసరంగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలి ఆచారంలోని సాంకేతికతను నిలుపుతూ, అరుదైన భావాలకు పాదసూచికలు ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
