source:
  edition: WLC
  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: te
  text: ఇది మీ తరతరాలన్నిటిలో క్రమంగా అర్పించే దహనబలి[a]. యాహ్వే సన్నిధిలో, సమావేశపు గుడారం ప్రవేశద్వారం వద్ద దీన్ని అర్పించాలి. అక్కడ నేను మీతో కలుసుకుని, అక్కడే నీతో మాట్లాడతాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎల్లప్పుడూ అర్పించే దహనబలి’; లేదా ‘నిత్య దహనబలి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం ఇక్కడ ‘మీతో’ అనే బహువచనం నుంచి ‘నీతో’ అనే ఏకవచనానికి మారుతుంది. మొదటిది విస్తృత సమూహాన్ని, రెండవది ప్రత్యేకంగా మోషేను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: క్రమంగా అర్పించాల్సిన దహనబలి
  rationale: עֹלָהను ఆరాధనా సందర్భంలోని ‘దహనబలి’గా, תָּמִידను నిర్ణీతంగా కొనసాగుతూ ఉండే అర్పణ అనే భావంలో ‘క్రమంగా అర్పించాల్సిన’ అని అనువదించాం. ఇది విరామం లేకుండా నిరంతరం దహించడమనే అనవసర భావాన్ని కలిగించదు.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలన్నిటిలో
  rationale: వరుసగా వచ్చే తరాలన్నిటికీ ఈ ఆజ్ఞ వర్తిస్తుందనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అనేది ప్రవేశస్థలాన్ని సూచిస్తుంది. אֹהֶל מוֹעֵדకు దేవుడు తన ప్రజలను నియమితంగా కలుసుకునే గుడారం అనే భావాన్ని మోసే, తెలుగులో పరిచితమైన ‘ప్రత్యక్ష గుడారం’ను ఎంచుకున్నాం.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లִפְנֵי యొక్క స్థలపరమైన, ఆరాధనాపరమైన భావాన్ని ‘సన్నిధిలో’ సహజంగా వ్యక్తం చేస్తుంది; יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: అక్కడ నేను మీతో కలుసుకొని
  rationale: Niphal రూపమైన אִוָּעֵד ఇక్కడ నియమిత స్థలంలో కలుసుకోవడాన్ని సూచిస్తుంది. לָכֶםలోని బహువచనాన్ని ‘మీతో’గా నిలిపాం.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: నీతో మాట్లాడతాను
  rationale: మాట్లాడడమే కలుసుకోవడంలోని ఉద్దేశమని వాక్య నిర్మాణం తెలియజేస్తుంది. אֵלֶיךָ ఏకవచనం కాబట్టి మోషేను ఉద్దేశించిన ‘నీతో’ను నిలిపాం; שָׁם భావం ముందు ఉన్న ‘అక్కడ’లో వ్యక్తమైంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించాం.
- issue: రెండవ పురుష బహువచనం నుంచి ఏకవచనానికి మార్పు
  choice: ‘మీతో’ అనే బహువచనాన్ని, ‘నీతో’ అనే ఏకవచనాన్ని రెండింటినీ నిలపడం
  alternative: రెండింటినీ బహువచనంగా లేదా ఏకవచనంగా సమన్వయపరచడం
  rationale: హీబ్రూలో לָכֶם బహువచనం కాగా אֵלֶיךָ ఏకవచనం. ఇది విస్తృత సమూహంతో దేవుడు కలుసుకోవడం, ప్రత్యేకంగా మోషేతో మాట్లాడడం మధ్య తేడాను సూచించవచ్చు; ఆ ఉద్రిక్తతను అనువాదంలో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించినా, స్థలం, నిరంతర ఆచరణ, కలుసుకోవడం, మాట్లాడడం అనే భావసంబంధాలను నిలిపాం. ‘మీతో/నీతో’ అనే సంఖ్యా మార్పును ఉద్దేశపూర్వకంగా కాపాడాం.
