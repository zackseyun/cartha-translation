source:
  edition: WLC
  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: te
  text: ప్రాయశ్చిత్తం కోసం ప్రతిరోజూ ఒక ఎద్దును పాపపరిహార బలిగా[a] అర్పించాలి. బలిపీఠానికి ప్రాయశ్చిత్తం చేసేటప్పుడు దానిని శుద్ధి చేయాలి; దానిని పవిత్రపరచడానికి అభిషేకించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధీకరణ బలిగా.’ హీబ్రూ పదం חַטָּאת ‘పాపం’ను సూచించగలదు; బలుల సందర్భంలో పాపం లేదా అపవిత్రత నుంచి శుద్ధి చేయడానికి అర్పించే బలిని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: ఒక ఎద్దు
  rationale: ఈ పదం ఎద్దును సూచిస్తుంది; ఇక్కడ వయస్సును ప్రత్యేకంగా చెప్పనందున ‘ఎద్దు’ సహజమైన, ఖచ్చితమైన అనువాదం.
- source_word: חַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల సందర్భంలో ఇది అమూర్తమైన ‘పాపం’ను కాక, పాపం లేదా అపవిత్రత తొలగింపుతో సంబంధమున్న బలిని సూచిస్తుంది. తెలుగులో స్థిరంగా అర్థమయ్యే ‘పాపపరిహార బలి’ని ప్రధాన పాఠంలో ఉంచి, ‘శుద్ధీకరణ బలి’ అనే భావఛాయను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לַיּוֹם
  choice: ప్రతిరోజూ
  rationale: పునరావృతమయ్యే ప్రతిష్ఠా క్రమంలో ఇది రోజువారీ చర్యను సూచిస్తుంది.
- source_word: עַל הַכִּפֻּרִים
  choice: ప్రాయశ్చిత్తం కోసం
  rationale: బహువచన రూపం ఇక్కడ ప్రాయశ్చిత్త ఆచారాలను సూచిస్తుంది; సహజమైన తెలుగులో అమూర్త ఏకవచన ప్రయోగం తగినది.
- source_word: וְחִטֵּאתָ
  choice: శుద్ధిచేయాలి
  rationale: חטא పియేల్ రూపం పవిత్ర వస్తువును ఆచారపరంగా శుద్ధిచేయడాన్ని సూచిస్తుంది; బలిపీఠం పాపం చేసిందనే తప్పుదోవను ఇది నివారిస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే పవిత్ర నిర్మాణానికి సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: బలిపీఠం కోసం ప్రాయశ్చిత్తం చేసినప్పుడు
  rationale: בְּ + క్రియానామ రూపానికి కాలార్థం లేదా సాధనార్థం రెండూ సాధ్యమే. ఇక్కడ ‘చేసినప్పుడు’ అనే కాలార్థాన్ని ఎంచుకున్నాం; עָלָיוను సందర్భానుసారం బలిపీఠాన్ని సూచించేలా స్పష్టంచేశాం.
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకించాలి
  rationale: ప్రతిష్ఠ కోసం నూనె పూసే ఆచారక్రియకు ‘అభిషేకించు’ సరైన, పరిచితమైన పదం.
- source_word: לְקַדְּשׁוֹ
  choice: దాన్ని ప్రతిష్ఠించడానికి
  rationale: బలిపీఠాన్ని పవిత్ర సేవ కోసం ప్రత్యేకపరచడమే ఇక్కడ భావం; ‘ప్రతిష్ఠించు’ ఆధునిక తెలుగులో స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన శుద్ధి, ప్రాయశ్చిత్త భాషను తరువాతి సిద్ధాంతార్థాలతో విస్తరించకుండా అనువదించడం
  choice: ‘పాపపరిహార బలి,’ ‘శుద్ధిచేయాలి,’ ‘ప్రాయశ్చిత్తం చేయాలి’ అనే గుడార-ఆరాధన సంబంధ పదాలను ఉపయోగించడం
  alternative: חַטָּאתను ‘శుద్ధీకరణ బలి’గా, וְחִטֵּאתָను ‘పాపాన్ని తొలగించాలి’గా అనువదించడం
  rationale: వాక్యం బలిపీఠ ప్రతిష్ఠకు సంబంధించిన బలి ఆచారాలను వివరిస్తుంది. బలిపీఠానికి నైతిక క్షమాపణ అవసరమన్న భావం రాకుండా, దాని ఆచారపరమైన శుద్ధిని ప్రధానంగా నిలిపాం.
- issue: בְּכַפֶּרְךָ עָלָיוలో కాలార్థం మరియు సాధనార్థం మధ్య ఉన్న అస్పష్టత
  choice: ‘ప్రాయశ్చిత్తం చేసినప్పుడు’ అనే కాలార్థం
  alternative: ‘ప్రాయశ్చిత్తం చేయడం ద్వారా’ అనే సాధనార్థం
  rationale: హీబ్రూ నిర్మాణం రెండింటినీ అనుమతిస్తుంది. ఆచారక్రియల క్రమాన్ని సహజంగా తెలిపే కాలార్థాన్ని ప్రధాన పాఠంలో ఎంచుకున్నాం; శుద్ధి మరియు ప్రాయశ్చిత్తం మధ్య సంబంధాన్ని మాత్రం నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. ఆజ్ఞారూపాన్ని గౌరవప్రదమైన ‘అర్పించాలి/శుద్ధిచేయాలి/అభిషేకించాలి’ నిర్మాణాలతో అందించాం; ‘దాన్ని’ అనే సర్వనామం బలిపీఠాన్నే సూచిస్తుంది.
