  text: וְ/לָקַחְתָּ֣ אֶת הֶֽ/חָזֶ֗ה מֵ/אֵ֤יל הַ/מִּלֻּאִים֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן וְ/הֵנַפְתָּ֥ אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֥ה לְ/ךָ֖ לְ/מָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: te
  text: అహరోనుకు సంబంధించిన ప్రతిష్ఠాపన పొట్టేలు నుండి రొమ్ముభాగాన్ని తీసుకొని, దానిని యాహ్వే సన్నిధిలో ఊపే అర్పణగా ఊపాలి. అది నీ వాటాగా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతిష్ఠా పొట్టేలు.’ హీబ్రూ సాంకేతిక పదం యాజకుని పదవిలో ప్రతిష్ఠించే ఆచారంలో ఉపయోగించే పొట్టేలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: రొమ్ముభాగం
  rationale: బలి ఆచార సందర్భంలో ఇది జంతువు రొమ్ములో యాజకులకు కేటాయించే నిర్దిష్ట భాగాన్ని సూచిస్తుంది.
- source_word: אֵיל הַמִּלֻּאִים
  choice: ప్రతిష్ఠాపన పొట్టేలు
  rationale: ఇది అహరోనును యాజక పదవిలో నియమించే ఆచారంలో ఉపయోగించే పొట్టేలుకు సంబంధించిన సాంకేతిక పదబంధం; ‘ప్రతిష్ఠాపన’ పవిత్రపరచడం మరియు పదవిలో నిలపడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: అహరోనుకు సంబంధించిన
  rationale: ఈ సంబంధ నిర్మాణం పొట్టేలు అహరోనుతో ప్రత్యేకంగా అనుబంధించబడినదని తెలుపుతుంది; యాజమాన్యాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: దాన్ని ఊపే అర్పణగా ఊపాలి
  rationale: క్రియ మరియు దానికి సమానమూలమైన నామవాచకంతో ఏర్పడిన స్థిర ఆచారవ్యక్తీకరణను తెలుగులో స్పష్టంగా, పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో ‘సన్నిధిలో’ సహజమైన తెలుగు; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: అది నీ వంతు అవుతుంది
  rationale: מָנָה కేటాయించబడిన భాగం లేదా వాటాను సూచిస్తుంది; ‘నీ వంతు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది; మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: הַמִּלֻּאִים అనే యాజక ప్రతిష్ఠాపన సాంకేతిక పదం
  choice: ప్రతిష్ఠాపన
  alternative: అభిషేకం / సమర్పణ
  rationale: ఈ ఆచారం అహరోనును యాజక పదవిలో నిలపడానికి సంబంధించినది. ‘ప్రతిష్ఠాపన’ ఆ పదవి-నియామక కోణాన్ని తెలియజేస్తుంది; కేవలం నూనెతో అభిషేకించడానికే అర్థాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే ఆజ్ఞాత్మక శైలి వాడబడింది. ఆచార సంబంధ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ సంబంధ నిర్మాణంలోని స్వల్ప అస్పష్టతను ‘సంబంధించిన’ ద్వారా నిలిపింది.
