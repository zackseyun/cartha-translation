id: EXO.29.1
reference: Exodus 29:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: te
  text: '“వారిని నాకు యాజకులుగా సేవ చేయడానికి ప్రతిష్ఠించడానికి నీవు వారికోసం చేయవలసినది ఇదే: మందలోని ఒక ఎద్దును[a], లోపంలేని రెండు పొట్టేళ్లను[b] తీసుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక కోడెదూడను.” హీబ్రూ పదబంధం అక్షరార్థంగా “ఒక ఎద్దు, పశువుల మంద కుమారుడు” అని ఉంటుంది; ఇది మందకు చెందిన మగ పశువును సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఏ దోషమూ లేని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: చేయవలసినది
  rationale: ఈ ఆచారవిధి సందర్భంలో ‘విషయం/కార్యం’ అనే నామవాచక భావాన్ని సహజమైన తెలుగు నిర్దేశక వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: నీవు ... చేయవలసినది
  rationale: హీబ్రూ అసంపూర్ణ క్రియకు ఇక్కడ ఉన్న ఆదేశార్థక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לְקַדֵּשׁ
  choice: ప్రతిష్ఠించేందుకు
  rationale: పవిత్ర సేవ కోసం ప్రత్యేకంగా నియమించడం అనే యాజక సంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: לְכַהֵן לִי
  choice: నాకు యాజకులుగా సేవచేయడానికి
  rationale: యాజక పదవిలో దేవునికి సేవ చేయడమనే క్రియాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְקַח
  choice: తీసుకో
  rationale: అవసరమైన బలి జంతువులను తీసుకోవాలనే ప్రత్యక్ష ఆజ్ఞను సహజంగా అనువదిస్తుంది.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: మందలోనుండి ఒక కోడెదూడను
  rationale: పదబంధంలోని పశువుల మందకు చెందిన మగ పశువు అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; వయస్సు సూచన ఎంత నిర్దిష్టమో పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: אֵילִם שְׁנַיִם
  choice: రెండు పొట్టేళ్లను
  rationale: మగ గొర్రెలను సూచించే పదాన్నీ స్పష్టమైన సంఖ్యనూ నేరుగా అందిస్తుంది.
- source_word: תְּמִימִם
  choice: లోపంలేని
  rationale: బలికి అర్హమైన జంతువులు శారీరక దోషం లేకుండా ఉండాలనే ఆచారపరమైన భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: యాజక సేవను సూచించే భాష
  choice: నాకు యాజకులుగా సేవచేయడానికి
  alternative: నాకు యాజకత్వం నిర్వహించడానికి
  rationale: హీబ్రూ క్రియ సూచించే యాజక పదవిలో సేవచేయడం అనే భావాన్ని కాపాడుతూ, తరువాతి మతసంస్థల ప్రత్యేక పారిభాషిక భావాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆచారవిధికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. ప్రధాన పాఠంలోని రెండు పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
