- from: '“వారిని నాకు యాజకులుగా సేవచేయడానికి ప్రతిష్ఠించేందుకు నీవు వారికి చేయవలసినది ఇదే: మందలోనుండి ఒక కోడెదూడను[a], లోపంలేని రెండు పొట్టేళ్లను[b] తీసుకో.”'
  to: '“వారిని నాకు యాజకులుగా సేవ చేయడానికి ప్రతిష్ఠించడానికి నీవు వారికోసం చేయవలసినది ఇదే: మందలోని ఒక ఎద్దును[a], లోపంలేని రెండు పొట్టేళ్లను[b] తీసుకో.”'
