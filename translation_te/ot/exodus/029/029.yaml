  edition: WLC
  text: וּ/בִגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן יִהְי֥וּ לְ/בָנָ֖י/ו אַחֲרָ֑י/ו לְ/מָשְׁחָ֣ה בָ/הֶ֔ם וּ/לְ/מַלֵּא בָ֖/ם אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: te
  text: అహరోనుకు చెందిన పవిత్ర వస్త్రాలు అతని తరువాత అతని కుమారులకు చెందాలి. వారు వాటిని ధరించి అభిషేకించబడుటకును, యాజకులుగా ప్రతిష్ఠించబడుటకును[a] అవి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘వారి చేతులను నింపడానికి’ అని ఉంది. ఇది వారిని యాజక పదవిలో నియమించడం లేదా ప్రతిష్ఠించడం అనే ఆచారపరమైన నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: ఈ పదబంధం యాజక సేవ కోసం ప్రత్యేకపరచబడిన వస్త్రాలను సూచిస్తుంది; ‘పవిత్ర వస్త్రాలు’ సహజమైనదీ మూలార్థానికి సమీపమైనదీ.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: అహరోనుకు చెందిన
  rationale: ఇక్కడ לְ స్వామ్యాన్ని లేదా కేటాయింపును సూచిస్తుంది.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: అతని తరువాత అతని కుమారులకు చెందాలి
  rationale: అహరోను తరువాత యాజక వారసులైన అతని కుమారులకు ఈ వస్త్రాలు సంక్రమించాలనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמָשְׁחָה בָהֶם
  choice: వాటిని ధరించి అభిషేకించబడడానికి
  rationale: בָהֶם వస్త్రాలను అభిషేక సాధనంగా కాక, వాటిని ధరించిన స్థితిలో అభిషేకం పొందడాన్ని సూచిస్తుంది.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: వాటిని ధరించి యాజకులుగా ప్రతిష్ఠించబడడానికి
  rationale: מלא את־ידם అనేది యాజక పదవిలో నియమించడం లేదా ప్రతిష్ఠించడం అనే సాంకేతిక ఆచారపరమైన నుడికారం. సహజమైన తెలుగులో దాని కార్యార్థాన్ని ఇచ్చి, మూలంలోని రూపకాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: מלא את־יד అనే యాజక ప్రతిష్ఠాపన నుడికారాన్ని అనువదించడం
  choice: యాజకులుగా ప్రతిష్ఠించబడడానికి
  alternative: వారి చేతులను నింపడానికి
  rationale: అక్షరార్థమైన ‘చేతులను నింపడం’ ఆధునిక తెలుగులో ఉద్దేశించిన యాజక నియామక భావాన్ని తెలియజేయదు. ‘యాజకులుగా ప్రతిష్ఠించడం’ ఆచారపరమైన కార్యాన్ని స్పష్టంగా చెబుతుంది; మూల రూపకం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వాటిని ధరించి’ అని రెండుసార్లు చెప్పడం ద్వారా בָהֶם యొక్క సందర్భార్థాన్ని స్పష్టం చేశాం; వస్త్రాలతో అభిషేకం చేస్తారనే అపార్థాన్ని నివారించాం.
