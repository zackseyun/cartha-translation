  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బలి-ఆరాధనా శైలిని ఉపయోగించాం. హీను, ఏఫా వంటి పురాతన కొలతలను మార్చకుండా ఉంచి అవసరమైన వివరణను పాదసూచికల్లో ఇచ్చాం. ఈ వాక్యంలో క్రియ సందర్భం నుంచి పూరించబడుతున్నందున తెలుగులో సంపూర్ణ వాక్యంగా ఉండేందుకు ‘అర్పించాలి’ చేర్చాం.
