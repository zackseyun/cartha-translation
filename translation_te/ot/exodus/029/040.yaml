source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֨ן סֹ֜לֶת בָּל֨וּל בְּ/שֶׁ֤מֶן כָּתִית֙ רֶ֣בַע הַ/הִ֔ין וְ/נֵ֕סֶךְ רְבִעִ֥ית הַ/הִ֖ין יָ֑יִן לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: te
  text: ఒక్క గొర్రెపిల్లకు[c] పావు హీను దంచి తీసిన నూనెతో[b] కలిపిన పదోవంతు సన్నని పిండిని,[a] పానార్పణగా పావు హీను ద్రాక్షామద్యాన్ని అర్పించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఏఫాలో పదోవంతు. బలి అర్పణల సందర్భంలో హీబ్రూ పాఠం ‘పదోవంతు’ అనే ప్రామాణిక కొలతను ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దంచి తీసిన నూనె’ అంటే ఒలీవ పండ్లను దంచి లేదా నలగగొట్టి తీసిన నూనె; దీనిని ‘నొక్కి తీసిన నూనె’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఒక గొర్రెపిల్లకు.’ సందర్భంలో ఇది ప్రతిరోజూ అర్పించే రెండు గొర్రెపిల్లల్లో మొదటిదాన్ని సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹון
  choice: పదోవంతు
  rationale: బలి అర్పణల సందర్భంలో עִשָּׂרוֹן అనేది సాధారణంగా ఏఫాలో పదోవంతు అనే ప్రమాణాన్ని సూచిస్తుంది. మూలపాఠంలో పెద్ద ప్రమాణం పేరు చెప్పకుండా ‘పదోవంతు’ అని మాత్రమే ఉన్నందున దానినే ప్రధాన పాఠంలో నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: ఇది బలి అర్పణలకు ఉపయోగించే మెత్తగా మిల్లులో పట్టిన ఉత్తమమైన పిండిని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘సన్నని పిండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בָּלוּל בְּשֶׁמֶן
  choice: నూనెతో కలిపిన
  rationale: నిష్క్రియార్థక కృదంతం పిండిని నూనెతో కలిపినట్లు తెలియజేస్తుంది. ‘నూనెతో కలిపిన’ అనేది హీబ్రూ నిర్మాణానికి నమ్మకంగా ఉండి తెలుగులో సహజంగా ఉంటుంది.
- source_word: כָּתִית
  choice: దంచి తీసిన
  rationale: ఈ విశేషణం ఒలీవ పండ్లను దంచడం లేదా నలగగొట్టడం ద్వారా తీసిన నూనెను సూచిస్తుంది. కేవలం ‘నొక్కి తీసిన’ కంటే ‘దంచి తీసిన’ మూలపదంలోని తయారీ విధానాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: רֶבַע הַהִין / רְבִעִית הַהִין
  choice: పావు హీను
  rationale: రెండు రూపాలూ హీను అనే ద్రవ ప్రమాణంలో నాలుగో వంతును సూచిస్తాయి. పురాతన ప్రమాణాన్ని ఆధునిక ప్రమాణంగా ఊహాత్మకంగా మార్చకుండా అలాగే ఉంచాం.
- source_word: נֵסֶךְ
  choice: పానార్పణ
  rationale: ఇది బలితో పాటు పోసి అర్పించే ద్రాక్షారస అర్పణకు వాడే సాంకేతిక పదం. ‘పానార్పణ’ సంక్షిప్తంగా, గౌరవప్రదంగా, అర్థవంతంగా ఉంటుంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ఈ సాధారణ హీబ్రూ పదం ఇక్కడ పానార్పణగా ఉపయోగించే ద్రాక్షతో చేసిన పానీయాన్ని సూచిస్తుంది. ‘ద్రాక్షారసం’ ఆధునిక తెలుగు బైబిల్ శైలిలో సులభంగా అర్థమవుతుంది; దాని స్వభావాన్ని మరింత నిర్దిష్టంగా నిర్ణయించదు.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: ఒక్క గొర్రెపిల్లతో పాటు
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన సంఖ్యావాచకం అక్షరార్థంగా ‘ఆ ఒక్క గొర్రెపిల్లకు’ అని ఉంటుంది. సందర్భంలో రెండు రోజువారీ గొర్రెపిల్లల్లో ఒకదాన్ని సూచించినా, ‘మొదటి’ అని ప్రధాన పాఠంలో చేర్చకుండా మూలంలోని స్వల్ప సందిగ్ధతను నిలిపాం.
