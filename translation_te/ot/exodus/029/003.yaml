revisions:
- from: వాటిని ఒకే గంపలో పెట్టాలి[a]. ఆ గంపలో ఉన్న వాటిని, ఆ కోడెను, ఆ రెండు పొట్టేళ్లను నా సన్నిధికి తీసుకురావాలి[b].
  to: వాటిని ఒక గంపలో పెట్టాలి[a]. వాటిని ఆ గంపలోనే, ఎద్దును, ఆ రెండు పొట్టేళ్లను దగ్గరకు తీసుకురావాలి[b].
  rationale: The revision removes the unsupported phrase “నా సన్నిధికి,” corrects the animal term from “కోడె” to “ఎద్దు,” and keeps the basketed items, bull, and two rams as coordinated objects of the same instruction. The footnote wording has been adjusted to explain the lexical range without claiming an explicit divine destination.
