  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֤ אוֹתָ/ם֙ עַל סַ֣ל אֶחָ֔ד וְ/הִקְרַבְתָּ֥ אֹתָ֖/ם בַּ/סָּ֑ל וְ/אֶ֨ת הַ/פָּ֔ר וְ/אֵ֖ת שְׁנֵ֥י הָ/אֵילִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: te
  text: వాటిని ఒక గంపలో పెట్టాలి[a]. వాటిని ఆ గంపలోనే, ఎద్దును, ఆ రెండు పొట్టేళ్లను దగ్గరకు తీసుకురావాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక గంపలో.’ హీబ్రూలో అక్షరార్థంగా ‘ఒక గంప మీద’ అని ఉన్నా, పాత్ర సందర్భంలో వస్తువులను గంపలో పెట్టడం అనే అర్థమే సహజం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సమర్పించాలి’ లేదా ‘అర్పించాలి.’ హీబ్రూ క్రియకు ప్రాథమిక అర్థం ‘దగ్గరకు తీసుకురావాలి’; బలి సందర్భంలో దీనికి ‘సమర్పించు’ అనే సాంకేతిక అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: వాటిని ... పెట్టాలి
  rationale: נתן అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే సాధారణ అర్థం ఉంది. ముందు వచనంలో చెప్పిన రొట్టె పదార్థాలను సూచించే אוֹתָםను ‘వాటిని’గా అనువదించాం.
- source_word: עַל סַל אֶחָד
  choice: ఒకే గంపలో
  rationale: עַל సాధారణంగా ‘మీద’ అని అర్థమైనా, వస్తువులను పాత్రలో పెట్టే ఈ సందర్భంలో ‘లో’ సహజమైన భావం. אֶחָד ఇక్కడ అన్నిటినీ ఒకే గంపలో పెట్టాలని సూచిస్తుంది.
- source_word: וְהִקְרַבְתָּ
  choice: నా సన్నిధికి తీసుకురావాలి
  rationale: హిఫీల్ הקריבకు అక్షరార్థంగా ‘దగ్గరకు తీసుకురా’ అనే భావం, బలుల సందర్భంలో ‘సమర్పించు’ అనే సాంకేతిక భావం ఉన్నాయి. దేవుని సమక్షానికి తీసుకురావడాన్ని తెలుగులో సహజంగా తెలియజేస్తూనే, ఈ దశనే పూర్తయిన అర్పణగా నిర్ధారించకుండా ‘నా సన్నిధికి తీసుకురావాలి’ అని ఇచ్చాం.
- source_word: בַּסָּל
  choice: ఆ గంపలో ఉన్న
  rationale: בְּ ఇక్కడ రొట్టె పదార్థాలు గంపలోనే ఉండగా తీసుకురావాలని సూచిస్తుంది. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘ఆ గంపలో ఉన్న వాటిని’ అని ఇచ్చాం.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: ఆ కోడెను, ఆ రెండు పొట్టేళ్లను
  rationale: పునరుక్త ప్రత్యక్ష కర్మ సూచకాలు ఇవి కూడా ‘తీసుకురావాలి’ అనే క్రియకు కర్మలని చూపుతాయి. פַּרను ‘కోడె’, אֵילִםను ‘పొట్టేళ్లు’గా సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
theological_decisions:
- issue: הקריב యొక్క బలిసంబంధ అర్థం
  choice: నా సన్నిధికి తీసుకురావాలి
  alternative: సమర్పించాలి / అర్పించాలి
  rationale: ఈ క్రియ బలిసంబంధ సందర్భంలో సమర్పణను సూచించగలదు; అయితే ఇక్కడ గంపలోని పదార్థాలతో పాటు జంతువులను కూడా దగ్గరకు తీసుకురావడం ప్రధాన దృశ్యం. కాబట్టి ప్రక్రియలోని ఈ చర్యను ముందుగానే ‘అర్పించాలి’గా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆచార విధానానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. ‘గంప,’ ‘కోడె,’ ‘పొట్టేళ్లు’ వంటి సాధారణ పదాలు వాడబడ్డాయి. హీబ్రూలో ప్రత్యక్షంగా లేని మొదటి పురుష సూచనను ‘నా సన్నిధికి’లో చేర్చడం వక్త దేవుడనే సందర్భాన్ని సహజంగా తెలియజేస్తుంది; అయితే దీనివల్ల ‘దగ్గరకు’ అనే మూల అస్పష్టత కొంత వివరణాత్మకమవుతుంది.
