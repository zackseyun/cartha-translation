revisions:
- from: అతని కుమారుల్లో అతని తరువాత యాజకుడయ్యేవాడు[b], పరిశుద్ధ స్థలంలో[c] సేవ చేయడానికి సన్నిధి గుడారంలోకి ప్రవేశించినప్పుడు, ఏడు రోజులపాటు ఆ వస్త్రాలను ధరించాలి[a].
  to: అతని కుమారుల్లో అతని స్థానాన్ని చేపట్టే యాజకుడు[b], పరిశుద్ధ స్థలంలో[c] సేవ చేయడానికి సమావేశపు గుడారంలోకి ప్రవేశించినప్పుడు, ఏడు రోజులపాటు ఆ వస్త్రాలను ధరించాలి[a].
  rationale: మూలంలోని ఆరాధనా-స్థల నామాన్ని ‘సమావేశపు గుడారం’గా, యాజక పదవీ వారసత్వాన్ని ‘అతని స్థానాన్ని చేపట్టే’గా సవరించాం. గుడార సందర్భంలో ‘మందిరం’ అనే అనవసరమైన కాలానుకూల సూచన రాకుండా అడుగుసూచిక cను మార్చాం. మిగిలిన అర్థం, కాలవ్యవధి, మరియు వస్త్రాలను ధరించే భావం యథాతథంగా ఉన్నాయి.
