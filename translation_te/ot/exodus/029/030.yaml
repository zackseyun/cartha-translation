id: EXO.29.30
reference: Exodus 29:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: te
  text: అతని కుమారుల్లో అతని స్థానాన్ని చేపట్టే యాజకుడు[b], పరిశుద్ధ స్థలంలో[c] సేవ చేయడానికి సమావేశపు గుడారంలోకి ప్రవేశించినప్పుడు, ఏడు రోజులపాటు ఆ వస్త్రాలను ధరించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ వస్త్రాలను వేసుకోవాలి.’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి ‘వేసుకోవడం’ లేదా ‘ధరించడం’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని కుమారుల్లో అతని స్థానంలో ఉన్న యాజకుడు’; అంటే అతని తరువాత యాజక పదవిని చేపట్టేవాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పవిత్రస్థలంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יִלְבָּשָׁם
  choice: ఆ వస్త్రాలను ధరించాలి
  rationale: לבש అనే క్రియకు ‘వేసుకోవడం’ లేదా ‘ధరించడం’ అనే భావాలు ఉన్నాయి. ఏడు రోజుల కాలవ్యవధి ఉన్నందున ‘ధరించాలి’ సహజంగా ఉంది; ‘ఆ వస్త్రాలను’ అనడం ద్వారా సర్వనామం ముందటి వచనంలోని యాజక వస్త్రాలను సూచిస్తుందని స్పష్టమవుతుంది.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: అతని కుమారుల్లో అతని తరువాత యాజకుడయ్యేవాడు
  rationale: తַּחְתָּיו అనే పదబంధం అక్షరార్థంగా ‘అతని స్థానంలో’ అని ఉన్నా, ఈ సందర్భంలో యాజక పదవిలో వారసత్వాన్ని సూచిస్తుంది. అనువాదం ఆ భావాన్ని సహజంగా తెలియజేస్తూ కుమారుల్లో ఒకడనే భాగస్వామ్య భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר יָבֹא
  choice: ప్రవేశించినప్పుడు
  rationale: రూపరీత్యా ఇది సంబంధవాచక ప్రయోగమైనా, సందర్భంలో యాజక సేవ కోసం ప్రవేశించే సందర్భాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కాలార్థకంగా అనువదించడం సహజంగా ఉంటుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సన్నిధి గుడారం
  rationale: దేవునితో నిర్ణీతంగా కలుసుకునే ఆరాధనా స్థలాన్ని సూచించే పేరును ఆధునిక తెలుగులో గౌరవప్రదంగా, అర్థవంతంగా అందిస్తుంది.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: గుడార సంబంధిత పవిత్ర సేవను సూచిస్తుంది. సందర్భమే యాజక సేవ అని స్పష్టం చేస్తున్నందున సులభమైన ‘సేవ చేయడానికి’ సరిపోతుంది.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: కֹדֶשׁ ఇక్కడ గుడారంలోని పవిత్ర సేవాస్థలాన్ని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ దాని స్థలసంబంధమైన, ఆరాధనాపరమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యాజక పదవిలో వారసత్వం
  choice: అతని కుమారుల్లో అతని తరువాత యాజకుడయ్యేవాడు
  alternative: అతని కుమారుల్లో అతని స్థానంలో ఉన్న యాజకుడు
  rationale: హీబ్రూ వాక్యం కేవలం స్థలంలో మరొకరు నిలబడటాన్ని కాక, అహరోను వంశంలోని యాజక పదవిని తరువాత చేపట్టడాన్ని సూచిస్తుంది. అనువాదం తరువాతి సిద్ధాంతపరమైన భావాలను చేర్చకుండా ఆ వారసత్వాన్ని తెలియజేస్తుంది.
- issue: בַּקֹּדֶשׁ సూచించే పవిత్ర స్థలం
  choice: పరిశుద్ధ స్థలంలో
  alternative: పరిశుద్ధ మందిరంలో
  rationale: మూలపదం నిర్దిష్ట పవిత్ర ప్రదేశాన్ని సూచించినా, ‘పరిశుద్ధ స్థలం’ మరియు ‘పరిశుద్ధ మందిరం’ రెండూ సందర్భానుసారంగా సాధ్యమే. ప్రధాన పాఠం స్థలార్థాన్ని నేరుగా నిలుపుతుంది; ప్రత్యామ్నాయం అడుగుసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘యాజకుడు,’ ‘సన్నిధి గుడారం,’ ‘పరిశుద్ధ స్థలం’ వంటి పదాలు ఆరాధనా సందర్భాన్ని నిలుపుతాయి. హీబ్రూ వాక్యంలోని వారసత్వ భావాన్ని స్పష్టం చేసినా, ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ చేర్చలేదు.
