  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
