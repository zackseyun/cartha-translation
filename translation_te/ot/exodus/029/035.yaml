  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: te
  text: నీవు నేను నీకు ఆజ్ఞాపించినదంతటి ప్రకారం అహరోనుకూ అతని కుమారులకూ ఈ విధంగా చేయాలి. ఏడు రోజులపాటు వారిని యాజకసేవకు ప్రతిష్ఠించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి చేతిని నింపాలి.” ఇది ఒకరిని యాజకసేవలో నియమించి ప్రతిష్ఠించడాన్ని సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: ఆచారనిర్దేశాల సందర్భంలో సంయోజకంతో వచ్చిన క్రియకు ఆజ్ఞాత్మక భావం ఉంది; ఆధునిక తెలుగులో ‘చేయాలి’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: పునరుక్త ל ఆచారం ఎవరి విషయంగా నిర్వహించాలో సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి దీనిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: כָּכָה
  choice: ఈ విధంగా
  rationale: ఇంతకుముందు వివరించిన ఆచారక్రమాన్ని తిరిగి సూచించే నిర్దేశక క్రియావిశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: నేను నీకు ఆజ్ఞాపించినదంతా అనుసరించి
  rationale: כְּכֹל ముందటి ఆజ్ఞలన్నిటికీ సంపూర్ణ అనుగుణతను సూచిస్తుంది; ‘అంతా’ ఆ సమగ్రతను నిలుపుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: ఇది కాలవ్యవధిని సూచించే ప్రయోగం; ‘రోజులపాటు’ ఆధునిక తెలుగులో వ్యవధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּמַלֵּא יָדָם
  choice: వారిని యాజకసేవకు ప్రతిష్ఠించాలి
  rationale: అక్షరార్థంగా ‘వారి చేతిని నింపాలి’ అయిన ఈ హెబ్రీయ ఆచారిక నుడికారం, యాజక పదవిలో నియమించి సేవకు ప్రతిష్ఠించడాన్ని సూచిస్తుంది. ‘యాజకసేవకు ప్రతిష్ఠించాలి’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తూ తరువాతి సంఘపరమైన ప్రత్యేకార్థాలను మోపదు.
theological_decisions:
- issue: מלא יד అనే యాజకసంబంధ నుడికారాన్ని అనువదించడం
  choice: వారిని యాజకసేవకు ప్రతిష్ఠించాలి
  alternative: వారి చేతిని నింపాలి; వారిని యాజకులుగా నియమించాలి
  rationale: హెబ్రీయ పదబంధం అక్షరార్థంగా ‘వారి చేతిని నింపాలి’ అని ఉన్నా, ఈ ఆచారసందర్భంలో అహరోనును, అతని కుమారులను యాజకసేవలో అధికారికంగా ప్రవేశపెట్టడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సందర్భార్థాన్ని ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా పారదర్శకతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆచారనిర్దేశానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ప్రతిష్ఠించాలి’ అనే పదానికి ‘యాజకసేవకు’ అని జోడించి భావాన్ని నిర్దిష్టం చేశాం. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో సంబంధిత నుడికారం తరువాత ఉంచబడింది.
