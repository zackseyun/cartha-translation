source:
  edition: WLC
  text: וְ/שָׁחַטְתָּ֣ אֶת הָ/אַ֗יִל וְ/לָקַחְתָּ֤ מִ/דָּמ/וֹ֙ וְ/נָֽתַתָּ֡ה עַל תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְ/עַל תְּנ֨וּךְ אֹ֤זֶן בָּנָי/ו֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וְ/זָרַקְתָּ֧ אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: te
  text: తర్వాత ఆ పొట్టేలును వధించి, దాని రక్తంలో కొంత తీసుకుని, అహరోను కుడి చెవితమ్మెపై[a], అతని కుమారుల కుడి చెవితమ్మెలపై, వారి కుడిచేతి బొటనవేళ్లపై, వారి కుడికాలి బొటనవేళ్లపై పూయాలి. ఆ రక్తాన్ని బలిపీఠం మీద అన్ని వైపులా చిమ్మాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహరోను కుడి చెవి కొనపై … అతని కుమారుల కుడి చెవుల కొనలపై.’ హీబ్రూ పదం చెవి చివరి భాగాన్ని మరింత సాధారణంగా సూచించవచ్చు; అయితే ఈ ఆచార సందర్భంలో ‘చెవితమ్మె’ అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ రక్తాన్ని బలిపీఠం మీద అన్ని వైపులా బలంగా చిమ్మాలి.’ హీబ్రూ క్రియ సున్నితంగా జల్లడాన్ని కాక, రక్తాన్ని బలంగా ప్రయోగించే ఆచార చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: వధించు
  rationale: బలి సందర్భంలో సాధారణమైన ‘చంపు’ కంటే ‘వధించు’ మరింత నిర్దిష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: אַיִל
  choice: పొట్టేలు
  rationale: బలిగా అర్పించే మగ గొర్రెను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: מִדָּמוֹ
  choice: దాని రక్తంలో కొంత
  rationale: מן ఇక్కడ రక్తంలో ఒక భాగాన్ని తీసుకోవడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ఈ భావం స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: תְּנוּךְ אֹזֶן
  choice: చెవి తమ్మె
  rationale: యాజక ప్రతిష్ఠాపన ఆచార సందర్భంలో చెవి దిగువ మృదుభాగాన్ని సూచించే అత్యంత సంభావ్య, సహజమైన తెలుగు పదబంధం; ‘చెవి కొన’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַיְמָנִית
  choice: కుడి
  rationale: చెవి, చెయ్యి, కాలు అన్నింటికీ కుడివైపు అవయవాన్ని సహజంగా విశేషిస్తుంది.
- source_word: בֹּהֶן יָד
  choice: చేతి బొటనవేలు
  rationale: చేతికి సంబంధించిన בֹּהֶן‌ను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: בֹּהֶן רֶגֶל
  choice: కాలి బొటనవేలు
  rationale: పాదంలోని పెద్ద వేలును ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: זָרַק
  choice: చిమ్ము
  rationale: బలిపీఠం మీదికి రక్తాన్ని బలంగా ప్రయోగించే ఆచార చర్యను సూచిస్తుంది; తేలికగా నీరు జల్లే భావం కలిగించే పదాన్ని నివారిస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: బలిపీఠం అన్ని వైపులా రక్తాన్ని ప్రయోగించాలనే పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְ
  choice: తర్వాత / మరియు భావంతో వరుస క్రియలు
  rationale: మొదటి వరుసక్రియను ‘తర్వాత’తో సూచించి, మిగిలిన చర్యలను తెలుగు వాక్య నిర్మాణంలో క్రమంగా కలిపి ఆచార ప్రక్రియ ప్రవాహాన్ని నిలిపాం.
