translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆచారభాషను ఉపయోగించాం. మూలంలోని వరుస ఆదేశ నిర్మాణాన్ని సహజమైన తెలుగు ప్రవాహంతో నిలిపి, స్పష్టంగా లేని చెవి భాగానికి సంబంధించిన అర్థ పరిధిని పాదసూచికలో భద్రపరిచాం.
