revisions:
- from: తర్వాత ఆ పొట్టేలును వధించి, దాని రక్తంలో కొంత తీసుకుని, అహరోను కుడి చెవి తమ్మె మీద[a], అతని కుమారుల కుడి చెవి తమ్మెల మీద, వారి కుడిచేతి బొటనవేళ్ల మీద, వారి కుడికాలి బొటనవేళ్ల మీద పూయాలి. ఆ రక్తాన్ని బలిపీఠం మీద చుట్టూ చిమ్మాలి[b].
