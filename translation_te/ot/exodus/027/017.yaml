  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: te
  text: ప్రాంగణం చుట్టూ ఉన్న స్తంభాలన్నిటికీ వెండి పట్టీలు బిగించి ఉండాలి[a]. వాటి కొంకీలు వెండివి, వాటి పీఠాలు[b] కంచువి[c] అయి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వెండి కడ్డీలతో కలిపి ఉండాలి.” ఈ హీబ్రూ పదం స్తంభాలపై ఉండే వెండి పట్టీలను లేదా వాటిని కలిపే వెండి పనిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వాటి సాకెట్లు.” ఈ హీబ్రూ పదం స్తంభాలను నిలబెట్టే లోహపు పీఠాలను లేదా సాకెట్లను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “కంచు” అని అనువదించిన హీబ్రూ పదం ప్రాచీన వాడుకలో రాగిని లేదా రాగి మిశ్రమ లోహాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: ప్రాంగణం చుట్టూ ఉన్న స్తంభాలన్నిటికీ
  rationale: ప్రాంగణాన్ని అన్ని వైపులా చుట్టుముట్టిన నిలువు నిర్మాణ ఆధారాల సమగ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מְחֻשָּׁקִים
  choice: పట్టీలు బిగించి ఉండాలి
  rationale: స్తంభాలకు అమర్చిన వెండి బంధనపు లేదా అనుసంధానపు పనిని సూచిస్తుంది. ప్రాచీన సాంకేతిక పదాన్ని వాడకుండా, మూలంలోని నిష్క్రియ భావాన్ని నిలుపుతుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: పట్టీలు లేదా అనుసంధాన భాగాలు ఏ లోహంతో చేసినవో నేరుగా తెలియజేస్తుంది.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కాలు
  rationale: ప్రాంగణపు తెరలను తగిలించే అమరికలను సూచించే సందర్భోచితమైన, సాధారణ తెలుగు పదం.
- source_word: אַדְנֵיהֶם
  choice: వాటి ఆధారాలు
  rationale: స్తంభాలను నిలబెట్టే లోహపు పాదభాగాలు లేదా గుంటలుగల దిమ్మలను సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది; మరింత సాంకేతిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: గుడార నిర్మాణ సందర్భంలో ఈ ప్రాచీన లోహపదానికి వాడుకలో స్థిరపడిన అనువాదం; అది రాగిని లేదా రాగి మిశ్రమాన్ని సూచించే అవకాశాన్ని పాదసూచికలో నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిర్మాణ పదాలను వాడాం. వాక్యానికి గంభీరతను నిలుపుతూ ప్రాచీన సాంకేతిక పదజాలాన్ని నివారించాం; మూలంలోని లోహపదం మరియు అనుసంధాన నిర్మాణానికి సంబంధించిన అనిశ్చితులను పాదసూచికల్లో భద్రపరిచాం.
