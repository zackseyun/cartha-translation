  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: te
  text: దాని మోసే కర్రలను ఉంగరాల్లోకి చొప్పించాలి; బలిపీఠాన్ని మోసేటప్పుడు ఆ కర్రలు బలిపీఠం రెండు పక్కలపై[a] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలిపీఠం రెండు పార్శ్వాలపై.’ హీబ్రూ పదానికి పక్కలు, పార్శ్వాలు లేదా పక్కభాగాలు అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: చొప్పించాలి
  rationale: హొఫాల్ రూపంలోని నిష్క్రియార్థాన్ని తెలుగులో సహజమైన విధి ప్రయోగంతో తెలియజేస్తుంది; రవాణా కోసం కర్రలను ఉంగరాల్లో అమర్చడమే సందర్భార్థం.
- source_word: בַּדָּיו / הַבַּדִּים
  choice: దాని మోతకర్రలు / ఆ కర్రలు
  rationale: బַּדּים పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది. ‘మోతకర్రలు’ వాటి పనిని స్పష్టంగా తెలియజేస్తుంది; పునరుక్తిలో ‘ఆ కర్రలు’ సహజంగా ఉంది.
- source_word: בַּטַּבָּעֹת
  choice: ఉంగరాల్లోకి
  rationale: בְּ ఇక్కడ కర్రలు ప్రవేశించే స్థానాన్ని సూచిస్తుంది; ‘ఉంగరాల్లోకి’ చొప్పించే చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: ఆదేశ పరంపరలో కర్రలు ఉండవలసిన స్థితిని తెలిపే సరళమైన విధ్యర్థక అనువాదం.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: రెండు పక్కల
  rationale: צלעות అనే పదానికి పక్కలు, పార్శ్వాలు లేదా పక్కభాగాలు అనే అర్థాలు రావచ్చు. ఇక్కడ ‘రెండు పక్కల’ సహజంగా ఉండి స్థల సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలి అర్పించే నిర్మాణాన్ని సూచించే מזבחకు ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: బలిపీఠాన్ని మోసేటప్పుడు
  rationale: בְּ + נשׂא infinitive construct సందర్భం లేదా కాలాన్ని సూచిస్తుంది. సర్వనామపు సూచ్యాన్ని తెలుగులో స్పష్టత కోసం ‘బలిపీఠం’గా పునరుక్తి చేశాము.
