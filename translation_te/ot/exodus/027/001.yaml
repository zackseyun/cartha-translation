language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: te
  text: “నీవు తుమ్మ చెక్కతో బలిపీఠాన్ని చేయాలి. అది ఐదు మూరల పొడవు, ఐదు మూరల వెడల్పు ఉండాలి; బలిపీఠం చతురస్రంగా ఉండాలి; దాని ఎత్తు మూడు మూరలు ఉండాలి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు … చేయాలి
  rationale: నిర్దేశాల సందర్భంలో ఈ క్రియ ఆజ్ఞార్థక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘చేయాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠాన్ని
  rationale: మִזְבֵּחַకు ప్రమాణికమైన తెలుగు సమానార్థకం; నిర్దిష్టమైన గుడారపు బలిపీఠాన్ని సూచిస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మ చెక్కతో
  rationale: ఈ నిర్మాణం తయారీ పదార్థాన్ని సూచిస్తుంది. שִׁטָּהను సాధారణంగా అకేసియా జాతికి చెందిన తుమ్మగా గుర్తిస్తారు; ‘తుమ్మ చెక్క’ సామాన్య పాఠకులకు సహజమైన ఆధునిక రూపం.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: ఐదు మూరల పొడవు
  rationale: אַמָּה అనే ప్రాచీన కొలతకు తెలుగులో స్థిరపడిన ‘మూర’ను వాడి, పరిమాణాన్ని సహజంగా తెలిపింది.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: ఐదు మూరల వెడల్పు
  rationale: ముందటి కొలతకు సమాంతరంగా మూలంలోని వెడల్పు పరిమాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רָבוּעַ יִהְיֶה
  choice: చతురస్రంగా ఉండాలి
  rationale: רָבוּעַ నాలుగు సమాన భుజాలుగల ఆకారాన్ని సూచిస్తుంది; ‘చతురస్రంగా’ ఖచ్చితమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: దాని ఎత్తు మూడు మూరలు ఉండాలి
  rationale: కֹמָהలోని ఎత్తు భావాన్నీ, ప్రత్యయంలోని ‘దాని’ అనే స్వామ్య సంబంధాన్నీ స్పష్టంగా కాపాడుతుంది.
