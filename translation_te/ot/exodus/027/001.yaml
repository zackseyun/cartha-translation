translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణం వాడబడింది. మూలంలోని రెండవ పురుష ఏకవచన ఆదేశం, కొలతల క్రమం, చతురస్ర ఆకారం యథాతథంగా నిలుపబడ్డాయి. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] గుర్తు ‘acacia wood’ తరువాత ఉన్నప్పటికీ, దాని గమనిక ‘foursquare’కు సంబంధించినది; మూల హీబ్రూలో ఈ చోట ప్రత్యేక పాఠభేదం లేకపోవడం వల్ల తప్పుదారి పట్టించే ఆ గమనికను తెలుగు ముసాయిదాలో చేర్చలేదు.
