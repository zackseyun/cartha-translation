  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: te
  text: ఒక వైపున పదిహేను మూరల పొడవున్న తెరలు ఉండాలి. వాటికి మూడు స్తంభాలూ మూడు ఆధారాలూ[a] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూడు స్తంభాల గూటులు.” హీబ్రూ పదం స్తంభాలను నిలబెట్టే గూటి-వంటి ఆధారాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: పదిహేను మూరల పొడవైన
  rationale: సంఖ్యను, ప్రామాణిక రేఖీయ కొలతను యథాతథంగా ఉంచుతూ, తెలుగులో సహజంగా పొడవును సూచించడానికి ‘పొడవైన’ అని స్పష్టం చేశాం.
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టుముట్టే వేలాడే వస్త్రాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לַכָּתֵף
  choice: ఒక వైపున
  rationale: మూలపదానికి అక్షరార్థంగా ‘భుజం’ అనే భావం ఉన్నా, ఈ నిర్మాణ సందర్భంలో ప్రవేశద్వారానికి ఆనుకుని ఉన్న ఒక పక్కను సూచిస్తుంది; తరువాతి వచనంలోని ఎదురువైపుతోనూ ఇది సరిపోతుంది.
- source_word: עַמֻּדֵיהֶם
  choice: వాటికి మూడు స్తంభాలు
  rationale: ప్రత్యయాన్ని తెరలకు అన్వయించి, గుడార ప్రాంగణ నిర్మాణ సందర్భానికి తగిన ‘స్తంభాలు’ అనే పదాన్ని వాడాం.
- source_word: אַדְנֵיהֶם
  choice: మూడు ఆధారాలు
  rationale: స్తంభాలను నిలబెట్టే అడుగు భాగాలను సూచించడానికి స్పష్టమైన సాధారణ పదాన్ని ఎంచుకున్నాం; ‘దిమ్మలు’ లేదా ‘గూటులు’ అనే నిర్మాణార్థాలూ సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ వర్ణనగా అనువదించాం. మూలంలోని సంక్షిప్త నామవాచక నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి సందర్భానుసారంగా ‘ఉండాలి’ చేర్చాం.
