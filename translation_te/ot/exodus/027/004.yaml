  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: te
  text: దాని కోసం కంచుతో వల అల్లిక రూపంలో ఒక జాలకాన్ని[a] చేయాలి. ఆ వల అల్లికపై దాని నాలుగు మూలల వద్ద నాలుగు కంచు ఉంగరాలు చేయాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కంచు, వల పని గల జాలకం.” “కంచు వల” లేదా “కంచు అల్లిక” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దాని నాలుగు కొనల్లో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: వల అల్లికగా ఒక జాలకం
  rationale: מִכְבָּר బలిపీఠానికి అమర్చే జాలకాన్ని సూచిస్తుంది; מַעֲשֵׂה רֶשֶׁת దాని వలలాంటి నిర్మాణాన్ని వివరిస్తుంది. సహజమైన తెలుగులో రెండు భావాలనూ నిలుపుతుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ సందర్భంలో రాగి లేదా రాగి మిశ్రమాన్ని సూచించే పదానికి గుడారపు సామగ్రి వర్ణనలో సహజమైన సంప్రదాయ తెలుగు పదం.
- source_word: עַל הָרֶשֶׁת
  choice: ఆ జాలకపు ... మూలల్లో
  rationale: עַל యొక్క స్థానసంబంధ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, రֶשֶׁת‌కు ఎంచుకున్న ‘జాలకం’ అనే పదాన్ని కొనసాగిస్తుంది.
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: మోసే కర్రలు లేదా అమరికల కోసం ఉపయోగించే లోహపు rings‌ను స్పష్టంగా సూచించే సాధారణ తెలుగు పదం.
- source_word: קְצוֹתָיו
  choice: దాని నాలుగు మూలలు
  rationale: పదానికి అక్షరార్థంగా ‘కొన్లు/చివరలు’ అనే విస్తృత భావం ఉన్నప్పటికీ, చతురస్రాకార జాలకానికి ‘మూలలు’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: לּוֹ
  choice: దాని కోసం
  rationale: పుంలింగ ఏకవచన సర్వనామం ముందున్న బలిపీఠాన్ని సూచిస్తుంది; తెలుగులో నిర్జీవ వస్తువుకు ‘దాని కోసం’ సహజం.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: కొనసాగుతున్న దైవ ఆదేశాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజమైన విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
