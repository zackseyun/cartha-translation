  text: with its twenty pillars and their twenty bronze bases[b][a], and the hooks of the pillars and their bands shall be silver.
translation:
  language: te
  text: దానికి ఇరవై స్తంభాలు, వాటికి ఇరవై కంచు పీఠాలు[a] ఉండాలి. స్తంభాల కొక్కేలూ వాటి పట్టీలూ[b] వెండివి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గూటులు”; ఇవి స్తంభాలను నిలిపే ఆధారాలు.
    reason: lexical_alternative
  - marker: b
    text: “పట్టీలు” అని అనువదించిన హీబ్రూ పదం సూచించే నిర్మాణ భాగం ఖచ్చితంగా తెలియదు; “కలుపు కడ్డీలు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: దానికి ఇరవై స్తంభాలు
  rationale: עַמּוּד అంటే స్తంభం. ఏకవచన పుంలింగ ప్రత్యయం ముందటి వచనంలో చెప్పిన ప్రాకారపు దక్షిణ వైపును సూచిస్తుంది; తెలుగులో సహజంగా ‘దానికి’ అని వ్యక్తం చేశాం.
- source_word: אַדְנֵיהֶם
  choice: వాటికి ఇరవై కంచు దిమ్మలు
  rationale: గుడార నిర్మాణ సందర్భంలో אֶדֶן స్తంభాన్ని నిలిపే అడుగు దిమ్మ లేదా గూటిని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘దిమ్మలు’ను ప్రధాన పాఠంలో ఉంచి, ‘గూటులు’ను పాదసూచికలో ఇచ్చాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగి లేదా కంచును సూచించగలదు; ప్రత్యక్ష గుడార సామగ్రి సందర్భంలో సంప్రదాయబద్ధమైన, సహజమైన ‘కంచు’ను ఎంచుకున్నాం.
- source_word: וָוֵי
  choice: కొక్కేలు
  rationale: וָו సాధారణంగా గుడార నిర్మాణంలో వస్త్రాలను లేదా భాగాలను తగిలించే కొక్కేలను సూచిస్తుంది.
- source_word: חֲשֻׁקֵיהֶם
  choice: వాటి బిగింపు పట్టీలు
  rationale: ఈ నిర్మాణ భాగం ఖచ్చితంగా ఏమిటో అనిశ్చితం. ‘బిగింపు పట్టీలు’ దాని సంభావ్య కార్యాన్ని సహజ తెలుగులో తెలియజేస్తూనే అతిగా నిర్దిష్టం చేయదు; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: כָּסֶף
  choice: వెండితో చేయాలి
  rationale: כָּסֶף అంటే వెండి. తెలుగులో రెండు నిర్మాణ భాగాల పదార్థాన్ని సహజంగా తెలిపేందుకు ‘వెండితో చేయాలి’ అన్నాం.
- source_word: וְ
  choice: మరియు / -ూ
  rationale: మొదటి సంధి మునుపటి వచనంలోని వివరణను కొనసాగిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఆ అనుసంధానం ‘దానికి’ ద్వారా స్పష్టమవుతుంది. తరువాతి సమన్వయాలను ‘-ూ’తో సహజంగా వ్యక్తం చేశాం.
