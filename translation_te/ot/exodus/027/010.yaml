translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణ పదాలను వాడాం. మూలంలోని జాబితా స్వభావాన్ని నిలుపుతూ తెలుగు వాక్యాన్ని రెండు భాగాలుగా విభజించాం; అనిశ్చిత పదాలకు పాదసూచికలు జోడించాం.
