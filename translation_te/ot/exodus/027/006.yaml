    text: లేదా ‘రాగి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు … చేయాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో కూడిన Qal perfect 2ms ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַדִּים / בַּדֵּי
  choice: మోతకర్రలు / కర్రలు
  rationale: ఇవి బలిపీఠాన్ని మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ వాటి పనిని స్పష్టంగా తెలియజేస్తుంది; రెండో ప్రస్తావనలో సహజమైన తెలుగు కోసం ‘కర్రలు’ అని వాడబడింది.
- source_word: לַמִּזְבֵּחַ
  choice: బలిపీఠానికి
  rationale: మూలంలో ఉన్న ‘బలిపీఠానికి’ అనే సాధారణ సూచననే ఉంచి, సందర్భం ద్వారా తెలిసే ‘దహనబలి బలిపీఠం’ అనే అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטִּים అనే చెట్టుకు తెలుగులో సాధారణ బైబిలు వాడుకలో ఉన్న ‘తుమ్మ’ను ఎంచుకున్నాం; నిర్మాణ పదార్థాన్ని సహజంగా తెలపడానికి ‘తుమ్మచెక్కతో’ అని ఇచ్చాం.
- source_word: וְצִפִּיתָ
  choice: తొడగాలి
  rationale: గుడారపు సామగ్రి సందర్భంలో Piel రూపం లోహంతో పైపూత వేయడం లేదా కప్పడం అనే శిల్పార్థాన్ని ఇస్తుంది. ‘తొడగాలి’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֹתָם
  choice: వాటికి
  rationale: ఈ సర్వనామం ముందున్న మోతకర్రలను సూచిస్తుంది; తెలుగులో క్రియతో సహజంగా కలిసే విధంగా ‘వాటికి’ అని ఇచ్చాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: నివాస గుడారపు సామగ్రి సందర్భంలో సంప్రదాయంగా అర్థం చేసుకునే bronze భావానికి ‘కంచు’ సరిపోతుంది. మూలపదానికి ‘రాగి’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
