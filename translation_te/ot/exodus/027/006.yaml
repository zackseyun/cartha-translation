- from: నీవు బలిపీఠానికి మోతకర్రలు చేయాలి. అవి తుమ్మచెక్కతో చేసిన కర్రలై ఉండాలి; వాటికి కంచు[a] తొడగాలి.
  to: నీవు బలిపీఠానికి మోతకర్రలు చేయాలి. అవి తుమ్మచెక్కతో చేసిన కర్రలై ఉండాలి; వాటిని కంచు[a]తో పొదగాలి.
  rationale: Only the final clause has been adjusted for a clearer and more faithful expression of overlaying the poles with bronze. The source’s repeated reference to poles, its instructional register, and the lexical ambiguity of נְחֹשֶׁת are retained.
