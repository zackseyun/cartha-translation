  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: te
  text: నీవు బలిపీఠానికి మోతకర్రలు చేయాలి. అవి తుమ్మచెక్కతో చేసిన కర్రలై ఉండాలి; వాటిని కంచు[a]తో పొదగాలి.
  philosophy: optimal-equivalence
  footnotes:
