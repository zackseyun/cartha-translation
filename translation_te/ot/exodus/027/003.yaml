source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: te
  text: దాని బూడిదను తొలగించడానికి కుండలను[a], పారలను, గిన్నెలను, ఫోర్కులను, నిప్పుపాత్రలను చేయాలి. దాని ఉపకరణాలన్నిటినీ కంచుతో[b] చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా అనువదిస్తే, ‘దాని కొవ్వుతో కూడిన బూడిదను తొలగించడానికి.’ ఇది బలిపీఠంపై అర్పణల వల్ల ఏర్పడిన బూడిదను తీసివేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రాగితో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్మాణ ఆదేశాల సందర్భంలో ఈ రూపం విధిని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఆదేశ భావాన్ని తెలియజేస్తుంది.
- source_word: סִּירֹתָיו
  choice: దాని ... కుండలను
  rationale: సִירֹת అనేది పాత్రలు లేదా కుండలను సూచిస్తుంది. వాటి ఉపయోగాన్ని తరువాతి పదబంధం తెలుపుతున్నందున ‘బూడిద కుండలు’ అని అర్థాన్ని నామవాచకంలోనే చేర్చలేదు.
- source_word: לְדַשְּׁנוֹ
  choice: దాని బూడిదను తొలగించడానికి
  rationale: పీఏల్ రూపంలోని דשן ఇక్కడ బలిపీఠంపై ఏర్పడిన, బలి కొవ్వుతో కూడిన బూడిదను తీసివేయడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ప్రయోజనార్థక పదబంధాన్ని వాడి, పదశః భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: יָעָיו
  choice: పారలను
  rationale: బూడిద లేదా నిప్పును కదిలించడానికి ఉపయోగించే పనిముట్లను సూచించే ఈ పదానికి ‘పారలు’ స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: מִזְרְקֹתָיו
  choice: గిన్నెలను
  rationale: ద్రవాలను, ముఖ్యంగా బలి రక్తాన్ని, పట్టుకోవడానికి లేదా చల్లడానికి ఉపయోగించే పాత్రలను ఈ పదం సూచిస్తుంది. ‘గిన్నెలు’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే విస్తృత పదం.
- source_word: מִזְלְגֹתָיו
  choice: ముళ్లగరిటెలను
  rationale: ఇవి ముళ్లు గల గరిటెవంటి పనిముట్లు. ‘ముళ్లగరిటెలు’ ఆకారాన్నీ ఉపయోగ స్వభావాన్నీ స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘ఫోర్కులు’ అన్నదానికంటే సందర్భోచితం.
- source_word: מַחְתֹּתָיו
  choice: నిప్పుపాత్రలను
  rationale: నిప్పు లేదా నిప్పుకణాలను మోయడానికి ఉపయోగించే పాత్రలను సూచిస్తుంది. ‘నిప్పుపాత్రలు’ సంక్షిప్తంగా, సందర్భానికి తగినట్లు ఉంది.
- source_word: לְכָל־כֵּלָיו
  choice: దాని ఉపకరణాలన్నిటినీ
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు మొదలైన వాటిని కలుపుకునే విస్తృత పదం. ఇప్పుడే పేర్కొన్న బలిపీఠ సామగ్రి మొత్తానికి ‘ఉపకరణాలు’ సరిపోతుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన గుడారపు సామగ్రి సందర్భంలో ఈ లోహపదానికి సంప్రదాయబద్ధమైన, సంభావ్యమైన అర్థం ‘కంచు’. ‘రాగి’ కూడా సాధ్యమైనందున ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
