translation:
  language: te
  text: దానిని బలిపీఠపు అంచు కిందనుండి అమర్చాలి[a]; ఆ జాలం బలిపీఠపు సగం ఎత్తు వరకు ఉండాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అంచు’కు బదులుగా ‘చట్రం’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం బలిపీఠంపై పొడుచుకొచ్చిన అంచు లేదా చట్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆ జాలం బలిపీఠపు మధ్య వరకు ఉండాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: దాన్ని ... అమర్చాలి
  rationale: נתן అనే క్రియకు ఇక్కడ ఒక వస్తువును నిర్దిష్ట స్థానంలో ఉంచడం అనే భావం ఉంది. ముందటి వచనంలోని కంచు వలను సూచించే స్త్రీలింగ ఏకవచన సర్వనామాన్ని తెలుగులో సహజంగా ‘దాన్ని’ అని ఇచ్చాం.
- source_word: תַּחַת
  choice: కింద
  rationale: బలిపీఠపు అంచుకు దిగువన ఉన్న స్థానాన్ని నేరుగా సూచిస్తుంది.
- source_word: כַּרְכֹּב הַמִּזְבֵּחַ
  choice: బలిపీఠపు అంచు
  rationale: כַּרְכֹּב బలిపీఠం నుంచి పొడుచుకొచ్చిన అంచు లేదా చట్రాన్ని సూచించే అరుదైన నిర్మాణ పదం. ఆధునిక తెలుగులో ‘అంచు’ స్పష్టంగా, సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִלְּמָטָּה
  choice: దిగువ వైపున
  rationale: ఈ రూపం దిగువ భాగం లేదా క్రింది వైపు నుంచి ఉన్న స్థానాన్ని సూచిస్తుంది. ఖచ్చితమైన నిర్మాణ పద్ధతిని ఊహించకుండా స్థల సంబంధాన్ని నిలుపుతుంది.
- source_word: וְהָיְתָה הָרֶשֶׁת
  choice: ఆ వల ... ఉండాలి
  rationale: היה + עד నిర్మాణం వల యొక్క స్థానం లేదా వ్యాప్తి ఎక్కడివరకు ఉండాలో తెలుపుతుంది. హెబ్రీ క్రమంలోని సమన్వయ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఇచ్చాం.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: బలిపీఠపు సగం ఎత్తు వరకు
  rationale: అక్షరార్థంగా ‘బలిపీఠపు సగం/మధ్య వరకు.’ సందర్భం నిలువు స్థానాన్ని సూచిస్తున్నందున ‘సగం ఎత్తు వరకు’ స్పష్టంగా ఉంటుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
