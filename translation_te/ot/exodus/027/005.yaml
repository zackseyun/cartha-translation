  register: ఆధునిక ప్రామాణిక తెలుగులో, గుడార నిర్మాణ ఆదేశాలకు తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘అమర్చాలి’ నిర్మాణ సందర్భంలో సహజంగా ఉండగా, అరుదైన నిర్మాణ పదంలోని అనిశ్చితిని పాదసూచికలో కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
