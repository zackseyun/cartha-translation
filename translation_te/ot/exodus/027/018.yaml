translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనదిగానూ సాధారణ పాఠకుడికి సులభంగానూ రూపొందించబడింది. హీబ్రూ నామవాచక శైలిని తెలుగులో స్పష్టంచేయడానికి సందర్భానుసారంగా ‘ఆవరణపు తెరలు’ మరియు ‘చేయాలి’ చేర్చబడ్డాయి. మూలంలోని חֲמִשִּׁים בַּחֲמִשִּׁים అసాధారణతను ప్రధాన వాక్యంలో సహజంగా అందించి, పాదటిప్పణిలో అక్షరార్థ రూపాన్ని నిలిపాం.
