reference: Exodus 27:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֹ֣רֶךְ הֶֽ/חָצֵר֩ מֵאָ֨ה בָֽ/אַמָּ֜ה וְ/רֹ֣חַב חֲמִשִּׁ֣ים בַּ/חֲמִשִּׁ֗ים וְ/קֹמָ֛ה חָמֵ֥שׁ אַמּ֖וֹת שֵׁ֣שׁ מָשְׁזָ֑ר וְ/אַדְנֵי/הֶ֖ם נְחֹֽשֶׁת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: te
  text: ఆవరణం పొడవు వంద మూరలు, వెడల్పు యాభై మూరలు[a], ఎత్తు అయిదు మూరలు ఉండాలి. ఆవరణపు తెరలు మెలిపెట్టిన సన్నని నారబట్టతో చేయాలి; దాని స్తంభాల ఆధారాలు[b] కంచుతో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “యాభైకి యాభై.” ఈ అసాధారణ పదబంధం ఇక్కడ యాభై మూరల వెడల్పును సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “వాటి సాకెట్లు.” ఇవి స్తంభాలను నిలబెట్టే లోహపు ఆధారాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: ఆవరణం పొడవు
  rationale: గుడారాన్ని చుట్టిన ప్రాంగణాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం; కొలతల సందర్భంలో אֹרֶךְకు ‘పొడవు’ సూటిగా సరిపోతుంది.
- source_word: מֵאָה בָאַמָּה
  choice: వంద మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా నిలుపుతుంది; ‘మూర’ తెలుగు బైబిలు వాడుకలో cubitకు సాధారణ సమానం.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: వెడల్పు యాభై మూరలు[a]
  rationale: సందర్భం సూచించే కొలతను సహజ తెలుగులో ఇస్తూ, అసాధారణమైన ‘యాభైకి యాభై’ అనే హీబ్రూ రూపాన్ని పాదటిప్పణిలో పారదర్శకంగా భద్రపరుస్తుంది.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: ఎత్తు అయిదు మూరలు
  rationale: ఆవరణపు తెరల నిలువు కొలతను స్పష్టంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: పేనిన సన్నని నార
  rationale: שֵׁשׁ సూచించే నాణ్యమైన నారబట్టను, מָשְׁזָר సూచించే పేనిన లేదా మెలిపెట్టిన పనితనాన్ని సహజ తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וְאַדְנֵיהֶם
  choice: వాటి అడుగుదిమ్మలు[b]
  rationale: స్తంభాలను నిలబెట్టే లోహపు ఆధారాలను సాధారణ పాఠకుడికి అర్థమయ్యేలా తెలుపుతుంది; సాంకేతిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: గుడార నిర్మాణ సందర్భాల్లో ఈ లోహానికి సంప్రదాయబద్ధమైన, సులభంగా అర్థమయ్యే తెలుగు సమానం.
