source:
  edition: WLC
  text: וְ/עָשִׂ֕יתָ אֵ֖ת חֲצַ֣ר הַ/מִּשְׁכָּ֑ן לִ/פְאַ֣ת נֶֽגֶב תֵּ֠ימָנָ/ה קְלָעִ֨ים לֶ/חָצֵ֜ר שֵׁ֣שׁ מָשְׁזָ֗ר מֵאָ֤ה בָֽ/אַמָּה֙ אֹ֔רֶךְ לַ/פֵּאָ֖ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: te
  text: నీవు నివాసగుడారపు ఆవరణాన్ని చేయాలి. దక్షిణపు వైపుకు, దక్షిణ దిశగా, ఆవరణానికి సన్నగా పేనిన నారబట్టతో చేసిన తెరలు[a] ఉండాలి; ఆ ఒక వైపుకు వాటి పొడవు వంద మూరలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేలాడే వస్త్రాలు.’ హీబ్రూ పదం ఆవరణ హద్దును ఏర్పరచే వస్త్రపు భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: ఆవరణం
  rationale: మందిరానికి సంబంధించిన, చుట్టూ తెరలతో ఏర్పరచిన బహిరంగ ప్రదేశాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: నిర్గమకాండంలోని పవిత్ర గుడార నివాసాన్ని సూచించే స్థిరమైన, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు పదం.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: దక్షిణం వైపున, దక్షిణ దిశగా
  rationale: హీబ్రూలోని వైపు మరియు దిశ అనే ద్వంద్వ దక్షిణ సూచనను కుదించకుండా నిలుపుతుంది.
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ఆవరణ హద్దును ఏర్పరచే వేలాడే వస్త్రపు పలకలను సహజంగా సూచిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: నాణ్యమైన నారను పేని చేసిన వస్త్ర పదార్థం మరియు దాని పనితనాన్ని రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: מֵאָה בָאַמָּה
  choice: వంద మూరలు
  rationale: పురాతన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే కొలత పదంతో నిలుపుతుంది.
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: కొలత వాక్యంతో సహజంగా కలిసే ప్రత్యక్ష అర్థం.
- source_word: לַפֵּאָה הָאֶחָת
  choice: ఆ ఒక్క వైపు
  rationale: ఆవరణ చుట్టుకొలతలో పేర్కొన్న ఒక వైపును సూచించే ఏకవచన భావాన్ని నిలుపుతుంది.
