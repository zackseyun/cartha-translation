  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన నిర్మాణం వాడబడింది. హీబ్రూ మూలంలోని దక్షిణ దిశ ద్వంద్వ సూచనను ఉద్దేశపూర్వకంగా నిలిపాం; కొలమానాన్ని మార్చలేదు.
