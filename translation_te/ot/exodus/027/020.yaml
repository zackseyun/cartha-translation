  source_fidelity: మూల హీబ్రూకు ప్రధానంగా నమ్మకమైన అనువాదం. అయితే ప్రస్తుత సెమికోలన్ తర్వాతి “దీపం నిరంతరం వెలుగుతూ ఉండేలా చేయాలి” అనే భాగం వాక్యనిర్మాణంలో ‘వారు’కే నేరుగా ఆజ్ఞగా అనిపించవచ్చు. హీబ్రూలో అది నూనెను తీసుకురావడపు ఉద్దేశాన్ని తెలిపే అనంతరూపం. దానిని ఉద్దేశార్థకంగా స్పష్టీకరించాం.
