  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: te
  text: నీవు ఇశ్రాయేలు కుమారులకు[a] ఆజ్ఞాపించాలి; వారు వెలుగు కోసం స్వచ్ఛమైన, దంచి తీసిన[b] ఒలీవ నూనెను నీ దగ్గరకు తీసుకురావాలి, దీపం నిరంతరం[c] వెలిగేలా చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు,” “ఇశ్రాయేలు ప్రజలు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; ఇక్కడ ఈ స్థిర వాడుక ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దంచి తీసిన” అనే మాటను “నలగగొట్టి తీసిన” అని కూడా అనువదించవచ్చు. ఇది ఒలీవ పండ్లను సాధారణంగా ఒత్తడం కాకుండా దంచడం ద్వారా పొందిన మంచి నాణ్యమైన నూనెను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గుడార ఆరాధనా సందర్భంలో “నిరంతరం” అనేది ఒక్క క్షణం కూడా ఆగకుండా అనే అర్థం మాత్రమే కాకుండా, క్రమంగా కొనసాగించే నిర్వహణను కూడా సూచించవచ్చు; నిర్గమకాండం 27:21; లేవీయకాండం 24:2–4 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవు
  rationale: స్వతంత్ర సర్వనామం మోషేను నేరుగా, ఉద్ఘాటనతో సంబోధిస్తోంది. తెలుగులో సహజంగా ఉండేందుకు సంధికార్థాన్ని ప్రత్యేకంగా అనువదించకుండా, ఉద్ఘాటిత కర్తను నిలిపాం.
- source_word: תְּצַוֶּה
  choice: ఆజ్ఞాపించాలి
  rationale: צוה పియేల్ రూపం ‘ఆజ్ఞాపించు’ అనే నిర్దేశాత్మక భావాన్ని ఇస్తుంది; ‘ఆజ్ఞాపించాలి’ ధర్మశాస్త్ర సూచన శైలిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబపరమైన స్థిర వాడుకను ప్రధాన పాఠ్యంలో రూపపరంగా నిలిపాం. సందర్భంలో ఇది ఒడంబడిక సమాజమైన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: వారు నీ దగ్గరకు తీసుకురావాలి
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’ అయినా, אֶל (‘దగ్గరకు’)తో కూడిన ఈ సరఫరా సందర్భంలో మోషే దగ్గరకు తెచ్చే భావం ఉంది.
- source_word: שֶׁמֶן זַיִת
  choice: ఒలీవ నూనె
  rationale: ఈ నిర్మాణ పదబంధం ఒలీవ పండ్ల నుంచి తీసిన నూనెను నేరుగా సూచిస్తుంది; ఇది ఆధునిక తెలుగులో స్పష్టమైన రూపం.
- source_word: זָךְ
  choice: స్వచ్ఛమైన
  rationale: ఆరాధనా ఉపయోగానికి తగిన నూనె యొక్క మలినరహితత్వం, నిర్మలత్వం రెండింటినీ ఈ పదం సూచించగలదు; ‘స్వచ్ఛమైన’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: כָּתִית
  choice: దంచి తీసిన
  rationale: సాధారణంగా ఒత్తి తీయడం కంటే ఒలీవ పండ్లను దంచి లేదా నలగగొట్టి పొందిన నూనెను సూచిస్తుంది. తెలుగులో ప్రక్రియ స్పష్టంగా తెలియడానికి ‘దంచి తీసిన’ అని ఇచ్చాం.
- source_word: לַמָּאוֹר
  choice: వెలుగు కోసం
  rationale: מָאוֹר అనే నామవాచకంలోని వెలుగు లేదా ప్రకాశం భావాన్ని నిలుపుతూ, సందర్భంలో లేని నిర్దిష్ట ఉపకరణాన్ని చేర్చలేదు.
- source_word: לְהַעֲלֹת נֵר
  choice: దీపం ... వెలుగుతూ ఉండేలా చేయాలి
  rationale: అక్షరార్థంగా దీపాన్ని ‘పైకి రప్పించడం’ అనే హిఫీల్ ప్రయోగం, దీపాన్ని వెలిగించి మండేలా చేయడాన్ని సూచించే నుడికారం. తెలుగు వాక్యంలో కారణార్థక భావాన్ని సహజంగా నిలిపాం.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: తంబూ ఆరాధనా సందర్భంలో ఇది క్రమంగా కొనసాగించే నిర్వహణను సూచించవచ్చు; తప్పనిసరిగా ఒక్క క్షణం కూడా ఆగని చర్యనే సూచించదు. ప్రధాన పాఠ్యంలో సాంప్రదాయ విస్తృతార్థం గల ‘నిరంతరం’ను ఉంచి, సూక్ష్మతను పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక ఒడంబడిక సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని స్పష్టమైన కుటుంబపరమైన పురుషలింగ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపాం. అయితే ఈ స్థిర సంబోధన సందర్భంలో మొత్తం ఒడంబడిక సమాజాన్ని సూచిస్తుంది; స్త్రీలను మినహాయించే సిద్ధాంత ప్రకటనగా దాన్ని వివరించలేదు.
- issue: תָּמִיד సూచించే కొనసాగింపు స్వభావం
  choice: నిరంతరం
  alternative: క్రమంగా / ఎప్పటికప్పుడు
  rationale: ఈ పదం నిరంతర కొనసాగింపుతో పాటు ఆరాధనా విధిలో క్రమంగా కొనసాగించే సేవను కూడా సూచించగలదు. ప్రధాన పాఠ్యం ఆ ఉద్వేగాన్ని పరిష్కరించకుండా విస్తృతమైన పదాన్ని వాడుతుంది; పాదసూచిక సాధ్యమైన సందర్భార్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే ఆజ్ఞాత్మక శైలిని వాడాం. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని ఒడంబడికపరమైన కుటుంబ సంబోధనను నిలుపుతుంది; పాదసూచిక దాని సామూహిక పరిధిని స్పష్టం చేస్తుంది. ‘దంచి తీసిన,’ ‘వెలుగుతూ ఉండేలా’ వంటి ప్రయోగాలు సాంకేతిక భావాన్ని సహజ తెలుగులో తెలియజేస్తాయి.
