  terminology: “ఇశ్రాయేలు కుమారులు,” “స్వచ్ఛమైన,” “ఒలీవ నూనె,” “నిరంతరం” మూలపాఠ్య భావాన్ని తగిన విధంగా నిలుపుతున్నాయి. “దంచి తీసిన” כָּתִית యొక్క తయారీ-విధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
