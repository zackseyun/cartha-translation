  to: నీవు ఇశ్రాయేలు కుమారులకు[a] ఆజ్ఞాపించాలి; వారు వెలుగు కోసం స్వచ్ఛమైన, దంచి తీసిన[b] ఒలీవ నూనెను నీ దగ్గరకు తీసుకురావాలి, దీపం నిరంతరం[c] వెలిగేలా చేయడానికి.
