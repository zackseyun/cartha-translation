  yaml_path: translation/ot/exodus/027/013.yaml
  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: te
  text: ప్రాంగణం వెడల్పు తూర్పు వైపున, సూర్యోదయ దిశలో, యాభై మూరలు ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  choice: వెడల్పు
  rationale: רֹחַב కొలతలో వెడల్పును సూచిస్తుంది. తెలుగు వాక్యంలో సహజత్వం కోసం ఆరంభ ו ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు; నిర్దేశాల పరంపరలోని అనుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: ఇక్కడ חָצֵר ప్రత్యక్ష గుడారాన్ని చుట్టుముట్టిన ఆవరణను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రాంగణం’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: לִפְאַת קֵדְמָה
  choice: తూర్పు వైపున
  rationale: దిక్కుతో కూడిన פֵאָה నిర్మాణం ‘వైపు/పక్క’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘తూర్పు వైపున’ సహజంగా ఆ దిశలోని పక్కను తెలియజేస్తుంది.
- source_word: מִזְרָחָה
  choice: సూర్యోదయ దిశగా
  rationale: מִזְרָחָה తూర్పు, అంటే సూర్యోదయ దిశను సూచిస్తుంది. ముందు వచ్చిన ‘తూర్పు’తో హెబ్రీలోని ద్విగుణ దిశా వ్యక్తీకరణను నిలుపుతూ అనవసర పదపునరుక్తిని నివారిస్తుంది.
- source_word: חֲמִשִּׁים
  choice: యాభై
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: אַמָּה
  choice: మూరలు
  rationale: אַמָּה ప్రాచీన పొడవు ప్రమాణమైన cubit. తెలుగు బైబిలు కొలత వాడుకలో ‘మూర’ దానికి సముచితమైన సంప్రదాయ పదం; యాభైతో బహువచనం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన నిర్దేశ వాక్యం. హెబ్రీ మూలంలోని ‘తూర్పు—సూర్యోదయ దిశ’ అనే ద్విగుణ దిశా సూచనను నిలిపింది. కొలతను ఆధునిక ప్రమాణంలోకి మార్చకుండా మూలంలోని ప్రాచీన ప్రమాణాన్నే ఉంచింది.
