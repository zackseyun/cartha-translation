  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకుడికి అర్థమయ్యే నిర్మాణ పదజాలంతో, ఆజ్ఞాత్మక గౌరవశైలిని పాటించాం. కొలతకు సంప్రదాయ బైబిలు పదమైన ‘మూర’ను నిలిపి, వస్త్రకళకు సంబంధించిన అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
