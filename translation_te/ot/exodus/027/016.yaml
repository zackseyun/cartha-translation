source:
  edition: WLC
  text: וּ/לְ/שַׁ֨עַר הֶֽ/חָצֵ֜ר מָסָ֣ךְ עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֣ה רֹקֵ֑ם עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֖ם אַרְבָּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: te
  text: ప్రాంగణ ద్వారం కోసం ఇరవై మూరల పొడవుగల తెర[a][b] ఉండాలి. అది నీలి, ఊదా, ఎర్రని నూలుతో, మెలిపెట్టిన సన్నని నారవస్త్రంతో రంగుల అల్లిక పనిగా[c] చేయాలి. దానికి నాలుగు స్తంభాలు, వాటికి నాలుగు పాదదిమ్మలు[d] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెర’కు బదులు ‘ప్రవేశాన్ని కప్పే వేలాడే వస్త్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇరవై మూరలు’; సందర్భ స్పష్టత కోసం ‘పొడవుగల’ అని చేర్చబడింది.
    reason: supplied_for_clarity
  - marker: c
    text: ‘రంగుల అల్లిక పని’ అనే హీబ్రూ పదబంధాన్ని ‘నైపుణ్యంగల కుట్టుపని’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_ambiguity
  - marker: d
    text: ‘పాదదిమ్మలు’కు బదులు ‘స్తంభపు గాడులు’ లేదా ‘ఆధారాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: ప్రాంగణ ద్వారం కోసం
  rationale: שַׁעַר ఇక్కడ ప్రాంగణంలోకి ప్రవేశించే ద్వారాన్ని సూచిస్తుంది; חָצֵרను ఆధునిక తెలుగులో స్పష్టమైన ‘ప్రాంగణం’గా అనువదించాం.
- source_word: מָסָךְ
  choice: తెర
  rationale: ఇది ఘనమైన తలుపు కాకుండా ప్రవేశాన్ని కప్పే వేలాడే వస్త్రాన్ని సూచిస్తుంది. ‘తెర’ సాధారణ పాఠకుడికి సహజంగా ఉండి దాని పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֶשְׂרִים אַמָּה
  choice: ఇరవై మూరల పొడవుగల
  rationale: మూలంలో అక్షరార్థంగా ‘ఇరవై మూరలు’ అని మాత్రమే ఉంది; నిర్మాణ సందర్భంలో కొలత తెర పొడవును సూచిస్తుండటంతో తెలుగులో ‘పొడవుగల’ చేర్చాం.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: నీలం, ఊదా, ఎర్రని నూలు
  rationale: ఇవి గుడార వస్త్రాలలో ఉపయోగించిన రంగు వేసిన పదార్థాలు. వస్త్ర నిర్మాణ సందర్భాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘నూలు’ను సమిష్టిగా వాడాం.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: మెలిపెట్టిన సన్నని నార
  rationale: שֵׁשׁ సన్నని నారవస్త్ర పదార్థాన్ని, מָשְׁזָר మెలిపెట్టి లేదా పేని చేసిన నిర్మాణాన్ని సూచిస్తాయి.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: రంగుల అల్లిక పనిగా
  rationale: ఈ పదబంధం నైపుణ్యంతో చేసిన రంగురంగుల వస్త్రపనిని సూచిస్తుంది. కేవలం సూదితో చేసిన ఆధునిక ఎంబ్రాయిడరీకే అర్థాన్ని పరిమితం చేయకుండా ‘రంగుల అల్లిక పని’ అని ఇచ్చాం.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: దానికి నాలుగు స్తంభాలు
  rationale: ప్రవేశ తెర ఏర్పాటుకు చెందిన నాలుగు ఆధార స్తంభాలను సహజ తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలోని సంబంధార్థక సర్వనామ భావాన్ని ‘దానికి’ నిలుపుతుంది.
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: వాటికి నాలుగు పాదదిమ్మలు
  rationale: אֶדֶן స్తంభాన్ని నిలబెట్టే అడుగు భాగంలోని ఆధారాన్ని లేదా గాడిగల దిమ్మను సూచిస్తుంది. ‘పాదదిమ్మలు’ నిర్మాణ పనిని స్పష్టంగా తెలియజేస్తుంది.
