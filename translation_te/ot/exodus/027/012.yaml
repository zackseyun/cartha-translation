  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆజ్ఞకు తగిన గంభీరమైన కానీ సులభమైన శైలి. మూలంలోని స్వామ్య ప్రత్యయాలు ‘వాటి’గా నిలుపబడ్డాయి; ‘మూర’ సంప్రదాయ బైబిలు కొలమాన పదంగా వాడబడింది.
