- from: ప్రాంగణం వెడల్పున, పడమటి వైపున[a], యాభై మూరల పొడవున్న తెరలు ఉండాలి; వాటి స్తంభాలు పది, వాటి దిమ్మలు పది.[b]
  to: ప్రాంగణపు పడమటి వైపున[a] వెడల్పున యాభై మూరల మేరకు తెరలు ఉండాలి; వాటి స్తంభాలు పది, వాటి పీఠాలు పది.[b]
  rationale: The revision removes an added dimensional label, preserves the Hebrew construction’s focus on the court’s western width, and replaces an unclear term for the pillars’ bases with a clearer modern Telugu architectural term. Footnote anchors and their lexical purposes are retained.
