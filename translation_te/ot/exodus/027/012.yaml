source:
  edition: WLC
  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: te
  text: ప్రాంగణపు పడమటి వైపున[a] వెడల్పున యాభై మూరల మేరకు తెరలు ఉండాలి; వాటి స్తంభాలు పది, వాటి పీఠాలు పది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సముద్రం వైపున’; ఇది పడమటి దిశను సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ‘పీఠాలు’ అనే పదాన్ని ‘సాకెట్లు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: ప్రాంగణం వెడల్పున
  rationale: רֹחַב అంటే ‘వెడల్పు’; חָצֵר ఇక్కడ మందిర గుడారాన్ని చుట్టిన ప్రాంగణాన్ని సూచిస్తుంది. తెలుగు నిర్మాణ సూచనల శైలిలో ‘ప్రాంగణం వెడల్పున’ సహజంగా ఉంటుంది.
- source_word: לִ/פְאַת יָ֔ם
  choice: పడమటి వైపున
  rationale: יָם అక్షరార్థంగా ‘సముద్రం’; హీబ్రూ దిశా ప్రయోగంలో ఇది సాధారణంగా పడమటిని సూచిస్తుంది. פֵאָה వైపు లేదా అంచు అనే భావాన్ని ఇస్తుంది.
- source_word: קְלָעִ֖ים
  choice: తెరలు
  rationale: ఈ సందర్భంలో కְלָעִים ప్రాంగణాన్ని చుట్టి ఏర్పరచే వేలాడే వస్త్రాలను సూచిస్తుంది. ‘తెరలు’ ఆధునిక పాఠకులకు స్పష్టమైన, సహజమైన పదం.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: యాభై మూరల పొడవున్న
  rationale: కొలత నేరుగా ‘యాభై మూరలు.’ తెలుగులో అది తెరల విస్తారాన్ని తెలుపుతోందని స్పష్టంచేయడానికి ‘పొడవున్న’ చేర్చబడింది.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: వాటి స్తంభాలు పది
  rationale: మూలంలోని 3వ పురుష బహువచన స్వామ్య ప్రత్యయాన్ని ‘వాటి’గా నిలిపి, సంఖ్యను హీబ్రూ వాక్య నిర్మాణానికి సమీపంగా అనుసరించాం.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: వాటి దిమ్మలు పది
  rationale: אֶדֶן నిర్మాణ స్తంభాన్ని నిలబెట్టే base/socket‌ను సూచిస్తుంది. ‘దిమ్మలు’ తెలుగు బైబిలు నిర్మాణ సందర్భంలో అర్థవంతమైన పదం; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
