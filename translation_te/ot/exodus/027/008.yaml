source:
  edition: WLC
  text: נְב֥וּב לֻחֹ֖ת תַּעֲשֶׂ֣ה אֹת֑/וֹ כַּ/אֲשֶׁ֨ר הֶרְאָ֥ה אֹתְ/ךָ֛ בָּ/הָ֖ר כֵּ֥ן יַעֲשֽׂוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: te
  text: నీవు దానిని పలకలతో లోపల ఖాళీగా ఉండేలా చేయాలి.[a] పర్వతం మీద నీకు చూపించబడిన ప్రకారమే వారు దానిని చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పలకలతో చేసిన ఖాళీ నిర్మాణంగా.” బలిపీఠం ఘనమైన నిర్మాణం కాకుండా పలకలతో చేసిన ఖాళీ నిర్మాణమని హీబ్రూ పదాలు సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב
  choice: లోపల ఖాళీగా
  rationale: ఈ విశేషణం బలిపీఠం ఘనంగా కాకుండా లోపల ఖాళీగా నిర్మించబడాలని సూచిస్తుంది.
- source_word: לֻחֹת
  choice: పలకలతో
  rationale: బహువచన నామవాచకం నిర్మాణానికి ఉపయోగించే పలకలను సూచిస్తుంది; సాధనార్థక రూపం తెలుగులో సహజంగా ఉంది.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: దానిని ... చేయాలి
  rationale: మోషేను ఉద్దేశించిన ఏకవచన ఆదేశ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ప్రకారమే
  rationale: చూపించబడిన నమూనాకూ నిర్మాణానికీ మధ్య ఉన్న పోలికను, అనుసరణను తెలియజేస్తుంది.
- source_word: הֶרְאָה אֹתְךָ
  choice: నీకు చూపించబడిన
  rationale: హీబ్రూ హోఫల్ కర్మణి రూపాన్ని నిలుపుతూ, చూపించిన దైవిక కర్తను మూలపాఠంలాగే ప్రత్యక్షంగా పేర్కొనదు.
- source_word: בָּהָר
  choice: పర్వతం మీద
  rationale: ప్రకటన జరిగిన స్థలాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: כֵּן יַעֲשׂוּ
  choice: వారు దానిని చేయాలి
  rationale: బహువచన క్రియను నిలుపుతూ, నిర్మాణాన్ని అమలు చేసే పనివారిని సహజంగా సూచిస్తుంది; ముందున్న ‘ప్రకారమే’ పోలిక-ఫలిత సంబంధాన్ని వ్యక్తం చేస్తుంది.
