translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన ఆదేశ శైలి వాడబడింది. కర్మణి ప్రయోగం ద్వారా మూలంలోని వ్యక్తపరచని కర్తను అలాగే ఉంచాం; ‘వారు’ అనే బహువచనాన్ని కూడా నిలిపాం.
