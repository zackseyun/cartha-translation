  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית חְמֵ֥שׁ עֶשְׂרֵ֖ה קְלָעִ֑ים עַמֻּדֵי/הֶ֣ם שְׁלֹשָׁ֔ה וְ/אַדְנֵי/הֶ֖ם שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: te
  text: రెండవ పక్కకు పదిహేను మూరల[a] పొడవైన తెరలు ఉండాలి. వాటికి మూడు స్తంభాలు, ఆ స్తంభాలకు మూడు పీఠాలు[b] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రూ పాఠంలో అక్షరార్థంగా ‘పదిహేను’ అని మాత్రమే ఉంది; ‘మూరలు’ అనే కొలమానం ముందున్న వచనంలోని సమాంతర వాక్యం నుంచి గ్రహించబడింది.
    reason: textual_ellipsis
  - marker: b
    text: లేదా ‘అడుగు గాడులు’. ఇవి స్తంభాలు నిలబడే ఆధార భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף֙ הַ/שֵּׁנִ֔ית
  choice: రెండవ పక్కకు
  rationale: כָּתֵף అనే పదానికి అక్షరార్థం ‘భుజం’; ప్రాంగణ నిర్మాణ సందర్భంలో అది ఒక పక్కను లేదా పార్శ్వాన్ని సూచిస్తుంది. הַשֵּׁנִית ను నేరుగా ‘రెండవ’ అని అనువదించాం.
- source_word: חְמֵ֥שׁ עֶשְׂרֵ֖ה
  choice: పదిహేను మూరల
  rationale: హెబ్రూ పాఠంలో ‘పదిహేను’ మాత్రమే ఉన్నా, ముందు వచనంలోని సమాంతర నిర్మాణం ప్రకారం ఇది తెరల సంఖ్యను కాక వాటి పొడవును సూచిస్తుంది; అందువల్ల సందర్భంలో అంతర్లీనంగా ఉన్న ‘మూరల’ అనే కొలమానాన్ని చేర్చాం.
- source_word: קְלָעִ֑ים
  choice: తెరలు
  rationale: ఈ పదం ప్రాంగణాన్ని చుట్టుముట్టే నేసిన వస్త్రపు తెరలను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘తెరలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַמֻּדֵי/הֶ֣ם
  choice: వాటికి మూడు స్తంభాలు
  rationale: עַמּוּד నిర్మాణానికి ఆధారంగా నిలిచే స్తంభాన్ని సూచిస్తుంది. బహువచన స్వామ్య ప్రత్యయాన్ని తెలుగులో ‘వాటికి’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: וְ/אַדְנֵי/הֶ֖ם
  choice: మూడు అడుగు దిమ్మలు
  rationale: אֶדֶן స్తంభం నిలబడే పునాది భాగాన్ని లేదా గాడి గల ఆధారాన్ని సూచిస్తుంది. ‘అడుగు దిమ్మలు’ దాని నిర్మాణపరమైన పనిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
