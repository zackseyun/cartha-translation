translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ సూచనలకు తగిన సరళమైన గంభీర శైలిని వాడాం. హెబ్రూలో అంతర్లీనంగా ఉన్న కొలమానాన్ని ప్రధాన పాఠంలో స్పష్టీకరించి, దాని లుప్తతను పాదటిప్పణిలో నిలిపాం.
