  to: రెండవ పక్కకు పదిహేను మూరల[a] పొడవైన తెరలు ఉండాలి. వాటికి మూడు స్తంభాలు, ఆ స్తంభాలకు మూడు పీఠాలు[b] ఉండాలి.
