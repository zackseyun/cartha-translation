  yaml_path: translation/ot/exodus/027/002.yaml
  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: te
  text: దాని నాలుగు మూలలపై కొమ్ములను చేయాలి. ఆ కొమ్ములు దానితో ఒకే ముక్కగా ఉండాలి[a]. దానిపై కంచు పొర వేయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దాని కొమ్ములు దానినుండే ఉండాలి’; అంటే వాటిని విడిగా జోడించకుండా బలిపీఠంతో ఒకే భాగంగా రూపొందించాలి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం కంచును లేదా రాగిని సూచించవచ్చు; ఈ నిర్మాణ సందర్భంలో ‘కంచు’ అత్యంత సంభావ్యమైన అర్థంగా ఎంచుకోబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్మాణ నిర్దేశాల సందర్భంలో సంయోగంతో వచ్చిన ఖాల్ సంపూర్ణ క్రియ ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קַרְנֹתָיו
  choice: దాని కొమ్ములు
  rationale: קֶרֶן యొక్క ప్రాథమిక అర్థం ‘కొమ్ము’; బలిపీఠ సందర్భంలో కొమ్ములవంటి పొడుచుకొచ్చిన భాగాలను సూచిస్తుంది. ‘కొమ్ములు’ ఆ దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: దాని నాలుగు మూలలపై
  rationale: עַל ఇక్కడ ‘మీద/పై’ అనే స్థానార్థాన్ని ఇస్తుంది. ‘నాలుగు మూలలపై’ మూలభాషకు దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: ఆ కొమ్ములు దానితో ఒకే ముక్కగా ఉండాలి
  rationale: అక్షరార్థంగా ‘దానినుండే దాని కొమ్ములు ఉండాలి.’ నిర్మాణ సందర్భంలో అవి విడిగా జోడించినవి కాక, బలిపీఠంతో సమగ్రంగా రూపొందించబడాలని ఇది సూచిస్తుంది. ‘ఒకే ముక్కగా’ ఆ భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: దానికి … తొడగాలి
  rationale: పీయేల్ రూపంలోని צפה ఒక వస్తువుపై లోహపు పొర వేయడాన్ని సూచిస్తుంది. ‘తొడగాలి’ ఈ నిర్మాణ ప్రక్రియకు తెలుగులో సహజమైన పదప్రయోగం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఈ పదం రాగిని గానీ కంచును గానీ సూచించవచ్చు. ప్రాచీన నిర్మాణ, లోహవిద్య సందర్భంలో ‘కంచు’ అత్యంత సంభావ్యమైన అర్థం; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
