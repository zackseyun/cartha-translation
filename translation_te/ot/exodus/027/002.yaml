translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన నిర్మాణ-నిర్దేశ శైలి వాడబడింది. మూలంలోని ఏకవచన సంబోధన తెలుగులో సహజంగా అంతర్లీనంగా ఉండేలా ‘చేయాలి/తొడగాలి’ రూపాలు ఎంచుకున్నాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
