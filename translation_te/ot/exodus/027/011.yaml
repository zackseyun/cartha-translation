  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణ పదజాలం వాడబడింది. హీబ్రూ వాక్యంలోని క్రియారహిత జాబితాను తెలుగులో స్పష్టత కోసం ‘ఉండాలి/చేయాలి’తో సహజీకరించాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా చేర్చబడ్డాయి.
