language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: te
  text: అలాగే ఉత్తర వైపున పొడవునా నూరు మూరల[a] తెరలు ఉండాలి; వాటికి ఇరవై స్తంభాలు, వాటి ఇరవై కంచు అడుగుదిమ్మలు ఉండాలి. స్తంభాల కొక్కాలు, వాటి పట్టీలు[b] వెండివి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘నూరు పొడవు’ అని మాత్రమే ఉంది; ఈ సందర్భంలోని కొలతల ఆధారంగా ‘మూరల’ అని పూరించబడింది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘వాటి కలుపు కడ్డీలు’; హీబ్రూ పదం స్తంభాలకు సంబంధించిన కలిపే లేదా చుట్టే భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: అలాగే
  rationale: ముందటి వైపు ఏర్పాటుతో దీనికి ఉన్న సమానత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: ఉత్తర వైపున పొడవునా
  rationale: పאה అనే ‘వైపు’ భావాన్నీ, אֹרֶךְ అనే పొడవు సూచననూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קְלָעִים
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టుముట్టే వేలాడే వస్త్రాలను సాధారణ పాఠకునికి స్పష్టంగా సూచించే సహజమైన పదం.
- source_word: מֵאָה אֹרֶךְ
  choice: నూరు మూరల
  rationale: హీబ్రూలో కొలమాన పదం లుప్తమైనా సమీప సందర్భం ఆధారంగా ‘మూరలు’ అని పూరించబడింది; దీనిని పాదసూచికలో తెలిపాం.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: వాటికి ఇరవై స్తంభాలు
  rationale: సర్వనామ సంబంధాన్ని తెరల ఏర్పాటుతో సహజంగా అనుసంధానిస్తూ సంఖ్యను యథాతథంగా ఉంచుతుంది.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: వాటి ఇరవై కంచు దిమ్మలు
  rationale: אדן అనేది స్తంభాన్ని నిలిపే అడుగు దిమ్మ లేదా ఆధారం; ‘కంచు దిమ్మలు’ నిర్మాణ సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: וָוֵי הָעַמֻּדִים
  choice: స్తంభాల కొక్కాలు
  rationale: וָוִים సూచించే స్తంభాలకు అమర్చిన hooks అనే భావాన్ని తెలుగులో ఖచ్చితంగా అందిస్తుంది.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: వాటి పట్టీలు
  rationale: స్తంభాలకు సంబంధించిన చుట్టే లేదా కలిపే భాగాల భావాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలిపే సాధారణ పదం.
- source_word: כָּסֶף
  choice: వెండి
  rationale: పదార్థాన్ని నేరుగా సూచించే ప్రామాణిక తెలుగు పదం.
