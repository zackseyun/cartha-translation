  text: בְּ/אֹ֣הֶל מוֹעֵד֩ מִ/ח֨וּץ לַ/פָּרֹ֜כֶת אֲשֶׁ֣ר עַל הָ/עֵדֻ֗ת יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֧ן וּ/בָנָ֛י/ו מֵ/עֶ֥רֶב עַד בֹּ֖קֶר לִ/פְנֵ֣י יְהוָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹ֣רֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: te
  text: సమావేశపు గుడారంలో, సాక్ష్యానికి ఎదురుగా ఉన్న తెరకు వెలుపల,[b] అహరోను మరియు అతని కుమారులు సాయంకాలం నుండి ఉదయం వరకు యహ్వే సన్నిధిలో దాన్ని క్రమంగా అమర్చాలి.[a] ఇశ్రాయేలీయులు తమ తరతరాల్లో పాటించాల్సిన శాశ్వత నియమం ఇది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాన్ని క్రమంగా అమర్చాలి’ అనే మాటను ‘దాన్ని క్రమంలో ఉంచాలి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ దీపసేవను సక్రమంగా నిర్వహించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సాక్ష్యం’ అనేది మందసంలో ఉంచిన ఒడంబడిక పలకలను సూచించే అవకాశం ఉంది. ‘ఎదురుగా’ అనే హీబ్రూ స్థలసంబంధాన్ని ‘పైగా’ లేదా ‘దగ్గర’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
  - marker: c
    text: ‘శాశ్వత నియమం’ అని అనువదించిన హీబ్రూ పదబంధాన్ని ‘నిరంతర నియమం’ అని కూడా అనువదించవచ్చు; ఇక్కడ తరతరాలుగా కొనసాగే బాధ్యత ప్రధాన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారంలో
  rationale: మోయేద్ అనే పదంలోని దేవునితో సమావేశమయ్యే స్థలమనే ఆరాధనా సంబంధ సాంకేతిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: తెరకు వెలుపల
  rationale: పారోఖెత్ పరిశుద్ధ స్థలాన్ని అతి పరిశుద్ధ స్థలం నుండి వేరుచేసే అంతర్గత తెరను సూచిస్తుంది; ‘తెర’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: సాక్ష్యానికి ఎదురుగా ఉన్న
  rationale: עַל అనే సంబంధసూచక పదానికి ‘పైగా/దగ్గర/ఎదురుగా’ అనే స్థలార్థాలు సాధ్యం. ఇక్కడ మందసంలోని సాక్ష్యానికి సంబంధించి తెర ఉన్న స్థానాన్ని ‘ఎదురుగా’ సహజంగా వ్యక్తం చేస్తుంది; ‘సాక్ష్యం’ అనే మూలపదాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా ఉంచుతుంది.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: దాన్ని క్రమంగా అమర్చాలి
  rationale: ערך అంటే క్రమంలో ఉంచడం లేదా అమర్చడం. ఏకవచన కర్మప్రత్యయం ‘దాన్ని’ మునుపటి సందర్భంలోని దీపసేవను సూచించే విధంగా, దాని నిర్దిష్ట సూచనను అతిగా తీర్మానించకుండా నిలుపుతుంది.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: సాయంకాలం నుండి ఉదయం వరకు
  rationale: రాత్రంతా కొనసాగాల్సిన యాజక బాధ్యతను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי యొక్క ఆరాధనా సందర్భ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది.
- source_word: חֻקַּת עוֹלָם
  choice: నిరంతర నియమం
  rationale: ఆరాధనా చట్టంలో עוֹלָם సూచించే తరతరాల కొనసాగింపును తెలియజేస్తుంది; సందర్భం కంటే మించి తాత్త్వికమైన కాలాతీతతను బలవంతంగా ఆపాదించదు.
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు తమ తరతరాల్లో పాటించాల్సిన
  rationale: నియమం ఇశ్రాయేలీయుల నుండి కోరబడే తరతరాల బాధ్యత అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో ఉంచింది.
- issue: חֻקַּת עוֹלָם యొక్క కాలవ్యాప్తి
  choice: నిరంతర నియమం
  alternative: శాశ్వత నియమం
  rationale: ఈ న్యాయ-ఆరాధనా పదబంధంలోని నిలకడైన తరతరాల బాధ్యతను కాపాడుతూ, అది తప్పనిసరిగా తాత్త్వికంగా అంతులేని కాలాన్ని సూచిస్తుందని నిర్ణయించదు.
- issue: אֲשֶׁר עַל הָעֵדֻת లోని స్థల సంబంధం
  choice: సాక్ష్యానికి ఎదురుగా
  alternative: సాక్ష్యంపై / సాక్ష్యం దగ్గర
  rationale: తెర మందసం ముందు ఉన్న సందర్భానికి ‘ఎదురుగా’ సరిపోతుంది; అయినా עַל యొక్క విస్తృత స్థలార్థాన్ని పాదసూచికలో గుర్తించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆరాధనా సాంకేతిక పదాలను అతిగా వివరణాత్మకంగా మార్చలేదు. మూలంలోని ఏకవచన ‘దాన్ని’, עַל యొక్క స్థల సంబంధం, עוֹלָם యొక్క కాలవ్యాప్తి విషయంలో ఉన్న భావసూక్ష్మతలను పాఠంలో లేదా పాదసూచికల్లో నిలిపాం.
