  source_fidelity: మూలంలోని స్థలసంబంధం, దీపసేవను సూచించే ఏకవచన కర్మం, యహ్వే నామం, అలాగే ఇశ్రాయేలీయులకు తరతరాలుగా వర్తించే నియమం అన్న భావాలు నిలిచాయి. అయితే ‘నిరంతర నియమం’ కంటే חֻקַּת עוֹלָם‌కు ‘శాశ్వత నియమం’ మరింత నేరమైన, స్థిరపడిన తెలుగు సమానం.
