  terminology: ‘సమావేశపు గుడారం,’ ‘తెర,’ ‘సాక్ష్యం,’ ‘యహ్వే’ అనేవి సందర్భానుకూలమైన ఆధునిక ప్రామాణిక తెలుగు పదాలు. ‘శాశ్వత నియమం’కు పాదసూచికలో సందర్భానుగుణ తరతరాల కొనసాగింపు వివరణ ఇవ్వబడింది; ఇది పదబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
