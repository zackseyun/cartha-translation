- from: సమావేశపు గుడారంలో, సాక్ష్యానికి ఎదురుగా ఉన్న తెరకు వెలుపల, అహరోను, అతని కుమారులు సాయంకాలం నుండి ఉదయం వరకు యహ్వే సన్నిధిలో దాన్ని క్రమంగా అమర్చాలి.[a][b] ఇశ్రాయేలీయులు తమ తరతరాల్లో పాటించాల్సిన నిరంతర నియమం ఇది.[c]
  to: సమావేశపు గుడారంలో, సాక్ష్యానికి ఎదురుగా ఉన్న తెరకు వెలుపల,[b] అహరోను మరియు అతని కుమారులు సాయంకాలం నుండి ఉదయం వరకు యహ్వే సన్నిధిలో దాన్ని క్రమంగా అమర్చాలి.[a] ఇశ్రాయేలీయులు తమ తరతరాల్లో పాటించాల్సిన శాశ్వత నియమం ఇది.[c]
  rationale: సమన్వయ కర్తలను తెలుగులో స్పష్టంగా చేశాం; חֻקַּת עוֹלָם‌ను చట్టపరమైన సందర్భానికి తగిన ‘శాశ్వత నియమం’గా మార్చాం; పాదసూచిక గుర్తులను వాటి సంబంధిత పదబంధాల వద్ద ఉంచాం. ఇతర అనిశ్చితులను—ప్రత్యేకంగా ‘సాక్ష్యం’తో తెర స్థలసంబంధాన్ని, ‘దాన్ని’ అనే ఏకవచన సూచనను—మూలానికి దగ్గరగా అలాగే ఉంచాం.
