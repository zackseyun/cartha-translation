source:
  edition: WLC
  text: לְ/כֹל֙ כְּלֵ֣י הַ/מִּשְׁכָּ֔ן בְּ/כֹ֖ל עֲבֹדָת֑/וֹ וְ/כָל יְתֵדֹתָ֛י/ו וְ/כָל יִתְדֹ֥ת הֶ/חָצֵ֖ר נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: te
  text: గుడారం యొక్క సమస్త సేవాకార్యానికి సంబంధించిన సామగ్రి అంతా, దాని మేకులన్నీ, ప్రాంగణపు మేకులన్నీ కంచుతో ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగితో’; హీబ్రూ పదం נְחֹשֶׁת రాగిని లేదా రాగి ఆధారిత లోహాన్ని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: సామగ్రి
  rationale: ఈ సందర్భంలో כְּלִי అనేది సేవలో ఉపయోగించే వివిధ పరికరాలు, వస్తువులను విస్తృతంగా సూచిస్తుంది. ‘సామగ్రి’ వాటిని పాత్రలకు మాత్రమే పరిమితం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: గుడారం
  rationale: మִשְׁכָּן దేవుని పవిత్ర నివాస గుడారాన్ని సూచిస్తుంది. నిర్గమకాండపు సందర్భంలో ‘గుడారం’ సహజమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: గుడారపు సేవ అంతటిలో ఉపయోగించే
  rationale: עֲבֹדָה ఇక్కడ గుడారానికి సంబంధించిన సేవా కార్యాలన్నిటిని సూచిస్తుంది. తెలుగు వాక్యంలో సామగ్రి యొక్క ప్రయోజనాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ఈ నిర్మాణం వాడబడింది.
- source_word: יְתֵדֹתָיו
  choice: దాని మేకులన్నీ
  rationale: יָתֵד నిర్మాణాన్ని బిగించడానికి నేలలో పాతే మేకు లేదా కొయ్యను సూచిస్తుంది. ‘మేకు’ గుడారపు సందర్భంలో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: יִתְדֹת הֶחָצֵר
  choice: ప్రాంగణపు మేకులన్నీ
  rationale: חָצֵר గుడారం చుట్టూ ఆవరించిన ప్రాంగణాన్ని సూచిస్తుంది. ‘ప్రాంగణం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: నְחֹשֶׁת రాగిని లేదా రాగి ఆధారిత మిశ్రలోహాన్ని సూచించగలదు. గుడారపు సామగ్రి జాబితాలో సంప్రదాయంగా భావించే bronze భావానికి ‘కంచు’ సహజమైన తెలుగు సమానం; మూలపదపు విస్తృతిని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమగ్రతను సూచించే כֹל పునరావృతిని ‘అంతటిలో’, ‘అంతా’, ‘అన్నీ’ ద్వారా నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
