source:
  edition: WLC
  text: הֵ֗ם הַֽ/מְדַבְּרִים֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులను ఈజిప్టు నుండి బయటకు తీసుకురావడానికి ఈజిప్టు రాజైన ఫరోతో మాట్లాడినవారు వీరే—వీరే మోషే మరియు అహరోను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈజిప్టు రాజైన ఫరోతో మాట్లాడుతూ ఉన్నవారు వీరే.” హీబ్రూలో కొనసాగుతున్న లేదా లక్షణంగా నిలిచే చర్యను సూచించగల కృదంత రూపం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: వీరే
  rationale: ముందు పేర్కొన్న వ్యక్తులను బలంగా తిరిగి గుర్తించే స్వతంత్ర సర్వనామ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמְדַבְּרִים
  choice: మాట్లాడినవారు
  rationale: ఈ కృదంతం మోషే, అహరోనులను ఫరోతో మాట్లాడిన చర్య ద్వారా గుర్తిస్తుంది; తెలుగు కథనంలో ఈ రూపం సహజంగా ఉంటుంది, కొనసాగుతున్న లక్షణార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: אֶל
  choice: తో
  rationale: ‘మాట్లాడు’ అనే తెలుగు క్రియతో వ్యక్తిని సూచించడానికి ‘తో’ సహజమైన విభక్తి; హీబ్రూలోని సంబోధన దిశను సందర్భానుగుణంగా అందిస్తుంది.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజైన ఫరో
  rationale: ఫరోకు సంబంధించిన రాజబిరుదును స్పష్టమైన, సహజమైన తెలుగు అన్వయంతో నిలుపుతుంది.
- source_word: לְהוֹצִיא
  choice: బయటకు తీసుకురావడానికి
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని—బయటకు వచ్చేలా చేయడం—సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: హీబ్రూ పురుష బహువచన నిర్మాణాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది; సంప్రదాయ విస్తృతార్థమైన ‘ఇశ్రాయేలీయులు’ పాదసూచికలో సూచించబడింది.
- source_word: מִמִּצְרָיִם
  choice: ఈజిప్టు నుండి
  rationale: బయటకు తీసుకురావడం అనే క్రియతో మూలస్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: వీరే
  rationale: హీబ్రూలో ఏకవచన సర్వనామం ఉన్నప్పటికీ, మోషే మరియు అహరోను అనే సంయుక్త గుర్తింపును తెలుగులో సహజంగా, ఉద్ఘాటనతో వ్యక్తం చేస్తుంది; రూపసంబంధ అసమానత పాదసూచికలో నిలుపబడింది.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోను
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన బైబిల్ వ్యక్తినామ రూపాలను ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు కుమారులు’ అనే పదబంధపు పరిధి
  choice: మూలంలోని లింగ-నిర్దిష్ట నిర్మాణాన్ని ప్రధాన పాఠ్యంలో ‘ఇశ్రాయేలు కుమారులు’గా ఉంచడం
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతానం’
  rationale: మూలపాఠానికి రూపపరమైన పారదర్శకతను కాపాడుతూ, ఈ పదబంధం సందర్భంలో ఇశ్రాయేలు ప్రజలను సూచించగలదనే విషయాన్ని పాదసూచికలో స్పష్టం చేస్తుంది; పరిధిని సిద్ధాంతపరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ఉద్ఘాటన కోసం ‘వీరే’ను రెండుసార్లు ఉంచి హీబ్రూ గుర్తింపు నిర్మాణాన్ని ప్రతిబింబించింది. ‘ఫరోతో మాట్లాడినవారు’ సహజ తెలుగు ప్రయోగం; కృదంతపు కొనసాగింపు భావం మరియు చివరి ఏకవచన సర్వనామంలోని అసాధారణత పాదసూచికల్లో భద్రపరచబడ్డాయి.
