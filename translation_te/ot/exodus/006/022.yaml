source:
  edition: WLC
  text: וּ/בְנֵ֖י עֻזִּיאֵ֑ל מִֽישָׁאֵ֥ל וְ/אֶלְצָפָ֖ן וְ/סִתְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/022.yaml
  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: te
  text: 'ఉజ్జీయేలు కుమారులు: మీషాయేలు, ఎల్జాఫాను, సిత్రీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో בְנֵי అనే నిర్మాణ రూపానికి సహజమైన తెలుగు సమానం. ముందున్న జాబితా కొనసాగింపును తెలుగులో విరామచిహ్నం, వాక్యసందర్భం స్పష్టపరుస్తున్నందున ו־ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: מִישָׁאֵל
  choice: మీషాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని దీర్ఘ స్వరాలు, చివరి ‘ఏలు’ భాగం గుర్తించదగినట్లుగా తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: וְ/אֶלְצָפָן
  choice: ఎల్జాఫాను
  rationale: సంయోజక అవ్యయాన్ని తెలుగు జాబితా నిర్మాణంలో ప్రత్యేకంగా పునరావృతం చేయకుండా, పేరును హీబ్రూ రూపానికి దగ్గరగా ధ్వన్యనుకరించాం.
- source_word: וְ/סִתְרִי
  choice: సిత్రీ
  rationale: హీబ్రూ samekh ధ్వనిని ‘స’తో ప్రతిబింబిస్తూ పేరును నేరుగా ధ్వన్యనుకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన జాబితా శైలిని ఉపయోగించాం. వ్యక్తినామాలను అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
