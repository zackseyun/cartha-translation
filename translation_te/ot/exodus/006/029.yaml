  source_fidelity: ముఖ్య భావం, దైవనామం, కథన-పురోగతి, మరియు దేవుడు మోషేతో చెప్పే విషయమంతటినీ ఫరోకు తెలియజేయమనే ఆజ్ఞ సరిగానే ఉన్నాయి. అయితే ‘ఫరోతో చెప్పు’ అనేది సహజ తెలుగులో ఫరోతో కలిసి/ఫరోతో మాట్లాడటం అనే భావాన్ని కలిగించవచ్చు; హీబ్రూ אֶל (‘కు’) సూచించే ఉద్దేశిత స్వీకర్తను స్పష్టంగా చూపడానికి ‘ఫరోకు చెప్పు’ అవసరం.
