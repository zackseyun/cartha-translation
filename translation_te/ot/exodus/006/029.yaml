id: EXO.6.29
reference: Exodus 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నేనే యాహ్వేను. నేను నీతో చెప్పేదంతా[a] ఈజిప్టు రాజైన ఫరోకు చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీతో చెబుతున్నదంతా.”
    reason: דֹּבֵר అనే వర్తమాన కృదంతం కొనసాగుతున్న క్రియగా కూడా అర్థమవుతుంది.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది. ఈ సందర్భంలో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘అన్నాడు’ సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ క్రియారూపం ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; ‘ఇలా అన్నాడు’ ఆధునిక తెలుగులో సహజమైన సమానార్థక నిర్మాణం.
- source_word: אֲנִי יְהוָה
  choice: నేనే యాహ్వేను
  rationale: హీబ్రూ నామవాచక వాక్యంలోని స్వీయ-గుర్తింపును, ‘నేనే’ అనే ఉద్ఘాటనతో సహజమైన తెలుగులో నిలిపాం.
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: ఫరోకు దేవుని సందేశమంతటినీ తెలియజేయాలనే ఆజ్ఞను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; వచనంలో דבר మూలపద పునరావృతిని ‘చెప్పేదంతా ... చెప్పు’ ద్వారా నిలిపాం.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజైన ఫరోతో
  rationale: హీబ్రూ సమానాధికరణ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంగా అందిస్తుంది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: అంతా
  rationale: తెలియజేయవలసిన విషయ సమగ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: నేను నీతో చెప్పేది
  rationale: వర్తమాన కృదంతం సాధారణ లేదా కొనసాగుతున్న మాటను సూచించగలదు. ప్రధాన పాఠంలో సహజమైన సాధారణ వర్తమాన భావాన్ని ఉంచి, కొనసాగుతున్న క్రియ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించిన ‘యాహ్వే’ లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపాం.
- issue: אֲנִי יְהוָה లోని స్వీయ-గుర్తింపు
  choice: నేనే యాహ్వేను
  alternative: నేను యాహ్వేను
  rationale: అధ్యాయ సందర్భంలో దైవ స్వీయ-గుర్తింపుకు ఉన్న బలాన్ని ‘నేనే’ సహజంగా తెలియజేస్తుంది; పాఠ్యంలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చెప్పేదంతా ... చెప్పు’ అనే పునరుక్తి ద్వారా హీబ్రూలోని דבר మూలపద పునరావృతిని సాధ్యమైనంతవరకు నిలిపాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న చివరి క్రియాభాగం వద్ద ఉంచాం.
