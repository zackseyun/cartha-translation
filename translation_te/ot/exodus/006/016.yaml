  text: וְ/אֵ֨לֶּה שְׁמ֤וֹת בְּנֵֽי לֵוִי֙ לְ/תֹ֣לְדֹתָ֔/ם גֵּרְשׁ֕וֹן וּ/קְהָ֖ת וּ/מְרָרִ֑י וּ/שְׁנֵי֙ חַיֵּ֣י לֵוִ֔י שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: te
  text: 'లేవి కుమారుల పేర్లు వారి వంశాల ప్రకారం ఇవి: గెర్షోను, కెహాతు, మెరారి. లేవి జీవించిన సంవత్సరాలు నూట ముప్పై ఏడు సంవత్సరాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: תולדות అనే పదం ఇక్కడ కుటుంబ వంశ విభాగాలను సూచిస్తుంది; ‘వారి వంశాల ప్రకారం’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: లేవి జీవించిన సంవత్సరాలు
  rationale: హీబ్రూ పదబంధంలోని ‘లేవి జీవిత సంవత్సరాలు’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: నూట ముప్పై ఏడు
  rationale: హీబ్రూ సంఖ్య 137ను ఆధునిక తెలుగు సంఖ్యా ప్రయోగంలో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. వ్యక్తి పేర్లు సాధారణ తెలుగు బైబిల్ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని రెండు వాక్యభాగాల క్రమం నిలుపబడింది.
