id: EXO.6.12
reference: Exodus 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: te
  text: 'అయితే మోషే యాహ్వే సన్నిధిలో ఇలా అన్నాడు: “ఇదిగో, ఇశ్రాయేలు కుమారులు[a] నా మాట వినలేదు; అలాంటప్పుడు ఫరో నా మాట ఎలా వింటాడు? నేను సున్నతి లేని పెదవులు గలవాణ్ణి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఇశ్రాయేలీయులు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘సున్నతి లేని పెదవులు.’ ఇది మాట్లాడటంలో ఆటంకం లేదా లోపాన్ని సూచించే రూపకం; నిర్గమకాండం 4:10తో పోల్చండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అయితే మోషే ... అన్నాడు
  rationale: వావ్ వరుస కథనాన్ని కొనసాగిస్తూనే, ముందున్న దైవాజ్ఞకు మోషే చెప్పిన అభ్యంతరంతో ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా ‘అయితే’ తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనే ‘ముందు/సన్నిధిలో’ భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో నిలుపుతుంది; יְהוָהను వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్ఘాటనను గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే హీబ్రూ కుటుంబ సంబంధ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: నా మాట వినలేదు
  rationale: שׁמע యొక్క వినడం-పట్టించుకోవడం అనే విస్తృత భావాన్ని ‘వినలేదు’ సహజంగా కాపాడుతుంది; ‘లోబడలేదు’ అని మరింత బలంగా వ్యాఖ్యానించదు.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי
  choice: అలాంటప్పుడు ... నా మాట ఎలా వింటాడు?
  rationale: ముందటి వాక్యం ఆధారంగా మోషే చేస్తున్న తార్కిక ప్రశ్నను సహజమైన తెలుగులో చూపిస్తూ, రెండు చోట్లా שׁמעకు ఒకే భావాన్ని ఉంచుతుంది.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: నేనేమో సున్నతి లేని పెదవులు గలవాణ్ణి
  rationale: వావ్ ఇక్కడ మోషే అభ్యంతరానికి కారణమైన తన స్థితిని చూపుతుంది. హీబ్రూలోని ఉద్దేశపూర్వకమైన ‘సున్నతి లేని పెదవులు’ రూపకాన్ని ఆధునిక వ్యాధినిర్ణయంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- issue: עֲרַל שְׂפָתָיִם అనే రూపకం
  choice: సున్నతి లేని పెదవులు గలవాణ్ణి
  alternative: మాట నేర్పు లేనివాణ్ణి; మాటకు ఆటంకం ఉన్నవాణ్ణి
  rationale: మోషే తన మాట సామర్థ్యాన్ని అనర్హతగా లేదా ఆటంకంగా వర్ణిస్తున్నాడు; అయితే ఆ మాట ఖచ్చితంగా ఏ లోపాన్ని సూచిస్తుందో మూలపాఠ్యం నిర్ధారించదు. అందువల్ల రూపకాన్నే ప్రధాన పాఠ్యంలో ఉంచి వివరణను పాదసూచికకు పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘యాహ్వే సన్నిధిలో,’ ‘ఇదిగో’ వంటి పదబంధాలు మూలంలోని గంభీరతను నిలుపుతాయి. హీబ్రూ రూపకంలోని అస్పష్టతను తొలగించకుండా, దాని అర్థ పరిధిని పాదసూచికలో వివరించింది.
