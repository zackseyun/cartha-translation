source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: te
  text: దేవుడు మోషేతో మాట్లాడాడు. ఆయన అతనికి, “నేను యాహ్వేను[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవ నామపు హీబ్రూ అక్షరరూపాన్ని, అలాగే ప్రత్యామ్నాయ లిప్యంతరీకరణను సూచించడానికి.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడి
  rationale: దైవ ప్రసంగాన్ని పరిచయం చేసే సాధారణ హీబ్రూ కథన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచనమైనప్పటికీ ఇక్కడ ఏకవచన క్రియతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడుట అనే తెలుగు క్రియతో సహజంగా సరిపోతూ, ప్రసంగం మోషేను ఉద్దేశించిందని తెలియజేస్తుంది.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: అతనితో ... అని అన్నాడు
  rationale: రెండవ ప్రసంగ క్రియను, దాని పరోక్ష కర్మను విడిచిపెట్టకుండా తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: אֲנִי
  choice: నేను ... ను
  rationale: హీబ్రూ నామవాచక వాక్యంలో అంతర్లీనంగా ఉన్న వర్తమాన సమానత్వ భావాన్ని తెలుగు విధేయ నామ నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం; ఉచ్చారణ పూర్తిగా నిర్ధారితం కానందున ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని రెండు ప్రసంగ క్రియలనూ నిలిపి ఉంచి, అనవసరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
