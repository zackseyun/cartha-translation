id: EXO.6.1
reference: Exodus 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నేను ఫరోకు ఏమి చేస్తానో ఇప్పుడు నీవు చూస్తావు. ఎందుకంటే బలమైన చేతి వల్ల అతడు వారిని వెళ్లనిస్తాడు; బలమైన చేతి వల్ల అతడు వారిని తన దేశం నుండి వెళ్లగొడతాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలవంతం వల్ల అతడు వారిని వెళ్లనిస్తాడు; బలవంతం వల్ల అతడు వారిని తన దేశం నుండి వెళ్లగొడతాడు.” రెండుసార్లు వచ్చిన “బలమైన చేతి వల్ల” అనే మాట, ఫరో అపారమైన శక్తికి—చివరికి దేవుని శక్తికి—లోబడి ఇలా చేస్తాడనే భావాన్ని సూచించవచ్చు.
    reason: ‘బలమైన చేయి’ అనే హీబ్రూ రూపకంలో ఉన్న బలవంతం/శక్తి అనే ప్రత్యామ్నాయ భావాన్ని వివరిస్తూ, ప్రధాన పాఠ్యంలోని అస్పష్టతను కాపాడుతుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపే వరుసను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַתָּה תִרְאֶה
  choice: ఇప్పుడు నువ్వు చూస్తావు
  rationale: עַתָּה లోని కాలసంబంధమైన ఉద్ఘాటనను, תִרְאֶה లోని సమీప భవిష్యత్ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: నేను ఫరోకు ఏమి చేయబోతున్నానో
  rationale: లְ ను ‘ఫరోకు’గా ఉంచి, దానిని ప్రధాన పాఠ్యంలో తప్పనిసరిగా ‘ఫరోకు వ్యతిరేకంగా’ అని వ్యాఖ్యానించలేదు; imminent action ను సహజ తెలుగులో ‘చేయబోతున్నానో’గా తెలిపింది.
- source_word: בְיָד חֲזָקָה
  choice: బలమైన చేతివల్ల
  rationale: రెండుసార్లు వచ్చే హీబ్రూ రూపకాన్ని అలాగే నిలిపి, అది ఫరో ప్రయోగించే బలమా లేక అతనిపై పనిచేసే బలవంతమా అనే అంతర్లీన అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: יְשַׁלְּחֵם
  choice: అతడు వారిని వెళ్లనిస్తాడు
  rationale: నిర్గమకాండ సందర్భంలో שׁלח ఇశ్రాయేలీయులను విడుదల చేయడాన్ని సూచిస్తుంది; ‘వెళ్లనిస్తాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: יְגָרְשֵׁם
  choice: అతడు వారిని ... వెళ్లగొడతాడు
  rationale: גרש లోని బలవంతపు బహిష్కరణ భావాన్ని ‘వెళ్లగొడతాడు’ స్పష్టంగా అందిస్తుంది; ఇది కేవలం పంపించడం కంటే బలమైనది.
- source_word: מֵאַרְצוֹ
  choice: తన దేశం నుండి
  rationale: ప్రస్తుత సందర్భంలో אֶרֶץ ఫరో పాలించే దేశాన్ని సూచిస్తుంది; తెలుగులో ‘తన దేశం నుండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: దేవుని నిబంధనాత్మక వ్యక్తిగత నామాన్ని నిలుపుతూ, దానిని బిరుదుతో భర్తీ చేయదు; ఏ ప్రత్యేక సంఘపరమైన వ్యాఖ్యానాన్నీ దిగుమతి చేయదు.
- issue: ‘బలమైన చెయ్యి’ ఎవరి శక్తిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘బలమైన చేతివల్ల’ అనే రూపకాన్ని రెండుసార్లు నిలుపడం
  alternative: బలవంతం వల్ల అతడు వారిని వెళ్లనిస్తాడు; దేవుని బలమైన చెయ్యి కారణంగా అతడు వారిని వెళ్లనిస్తాడు
  rationale: హీబ్రూ పదబంధం ఫరో తీవ్రమైన బలవంతానికి లోబడి చర్య తీసుకుంటాడనే భావాన్ని సూచించవచ్చు; అయితే ఆ బలం ఎవరిదో వాక్యమే ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల ప్రధాన పాఠ్యం ఆ ధార్మిక ఉద్వేగాన్ని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘నువ్వు’ ఏకవచన సంబోధన హీబ్రూ రూపానికి అనుగుణంగా ఉంది. పునరుక్తమైన ‘బలమైన చేతివల్ల’ను ఉద్దేశపూర్వకంగా రెండుసార్లు ఉంచి హీబ్రూ సమాంతరతను కాపాడింది.
