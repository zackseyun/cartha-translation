  revised_text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నేను ఫరోకు ఏమి చేస్తానో ఇప్పుడు నీవు చూస్తావు. ఎందుకంటే బలమైన చేతి వల్ల అతడు వారిని వెళ్లనిస్తాడు; బలమైన చేతి వల్ల అతడు వారిని తన దేశం నుండి వెళ్లగొడతాడు.”[a]'
