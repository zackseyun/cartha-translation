source:
  edition: WLC
  text: וַ/יִּקַּ֨ח עַמְרָ֜ם אֶת יוֹכֶ֤בֶד דֹּֽדָת/וֹ֙ ל֣/וֹ לְ/אִשָּׁ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶֽת אַהֲרֹ֖ן וְ/אֶת מֹשֶׁ֑ה וּ/שְׁנֵי֙ חַיֵּ֣י עַמְרָ֔ם שֶׁ֧בַע וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: te
  text: అమ్రాము తన అత్తయైన యోకెబెదును[a] భార్యగా చేసుకున్నాడు. ఆమె అతనికి అహరోనును, మోషేను కనింది. అమ్రాము జీవించిన సంవత్సరాలు నూట ముప్పై ఏడు సంవత్సరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “తన తండ్రి సహోదరి అయిన యోకెబెదును.”
    reason: బంధుత్వ పదమైన דֹּדָתוֹను ఈ సందర్భంలో మరింత నిర్దిష్టంగా అర్థం చేసుకునే అవకాశాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: భార్యగా చేసుకున్నాడు
  rationale: לקח అనే క్రియకు అక్షరార్థంగా ‘తీసుకున్నాడు’ అనే భావం ఉన్నా, לְאִשָּׁהతో కలిసి ఇది వివాహ సంబంధాన్ని సూచిస్తుంది. ‘భార్యగా చేసుకున్నాడు’ హీబ్రూ నిర్మాణాన్ని ప్రతిబింబిస్తూ సహజమైన తెలుగుగా ఉంది.
- source_word: דֹּדָתוֹ
  choice: తన అత్తయైన
  rationale: ఈ స్త్రీలింగ బంధుత్వ పదం ‘అత్త’ను సూచిస్తుంది; సందర్భానుసారం ‘తండ్రి సహోదరి’ అని మరింత నిర్దిష్టంగా అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో సంక్షిప్తమైన బంధుత్వ పదాన్ని ఉంచి, నిర్దిష్ట అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ విభక్తి ప్రయోగం వివాహ సంబంధాన్ని తెలియజేస్తుంది. ‘భార్యగా’ అనేది ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి … కనింది
  rationale: ילד క్రియకు ఇక్కడ ‘కనింది/జన్మనిచ్చింది’ అనే అర్థం. לוֹలోని పరోక్ష కర్మను ‘అతనికి’ అని నిలిపాం.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: అమ్రాము జీవించిన సంవత్సరాలు
  rationale: హీబ్రూ ఆయుష్కాల సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: నూట ముప్పై ఏడు
  rationale: హీబ్రూ సంఖ్యా భాగాల ఖచ్చితమైన మొత్తం 137ను తెలుగు పదరూపంలో స్పష్టంగా ఇచ్చాం.
- source_word: יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה / עַמְרָם
  choice: యోకెబెదు / అహరోను / మోషే / అమ్రాము
  rationale: హీబ్రూ పేర్లకు దగ్గరగా ఉండే, తెలుగు బైబిలు పఠనంలో సులభంగా గుర్తించగల లిప్యంతరీకరణలను ఉపయోగించాం.
theological_decisions:
- issue: తరువాతి ధర్మశాస్త్రంలో నిషేధించబడిన సమీప బంధువుల వివాహాన్ని తెలిపే బంధుత్వ పదం
  choice: తన అత్తయైన
  alternative: తన తండ్రి సహోదరి అయిన
  rationale: వచనం వంశావళి విషయాన్ని ఎలాంటి నైతిక వ్యాఖ్య లేకుండా తెలియజేస్తుంది. కాబట్టి సంబంధాన్ని మృదువుపరచకుండానూ, మూలపదం కంటే ఎక్కువ నిర్దిష్టతను ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండానూ ‘అత్త’ అని అనువదించాం; సందర్భానుకూలమైన నిర్దిష్ట అర్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన వంశావళి శైలిని వాడాం. ‘తీసుకున్నాడు’ అనే అసహజ అక్షరానువాదానికి బదులు ‘భార్యగా చేసుకున్నాడు’ అని, ఆయుష్కాల సూత్రాన్ని ‘జీవించిన సంవత్సరాలు’ అని సహజంగా అందించాం.
