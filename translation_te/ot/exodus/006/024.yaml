translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి ఉపయోగించబడింది. పేర్లు తెలుగులో సులభంగా చదవగల సంప్రదాయ రూపాల్లో ఇవ్వబడ్డాయి. మూలంలోని ‘కుమారులు’ మరియు బహువచన ‘వంశాలు’ యథాతథంగా నిలుపబడ్డాయి.
