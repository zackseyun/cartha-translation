base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: te
  text: 'కోరహు కుమారులు: అస్సీరు, ఎల్కానా, మరియు అబీయాసాపు. ఇవి కోరహీయుల వంశాలు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కుటుంబాలు.” ఇక్కడి హీబ్రూ పదం ఒక గోత్రంలోని విస్తృత బంధుత్వ సమూహాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: కోరహు కుమారులు
  rationale: בְנֵי అనే నిర్మాణ బహువచనం నేరుగా ‘కుమారులు’ అని అర్థమిస్తుంది. ఇక్కడ వెంటనే ముగ్గురు వ్యక్తుల పేర్లు రావడం వల్ల ‘సంతతివారు’ కంటే ‘కుమారులు’ సరైనది. వాక్యారంభంలోని וּ సంధిని సహజమైన తెలుగు వంశావళి శైలిలో ప్రత్యేకంగా అనువదించలేదు.
- source_word: אַסִּיר
  choice: అస్సీరు
  rationale: ఇది ఇక్కడ వ్యక్తి పేరు; సాధారణ నామవాచక అర్థాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: וְאֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం; జాబితాలోని సంధిని తెలుగు విరామచిహ్నాలు సహజంగా వ్యక్తపరుస్తాయి.
- source_word: וַאֲבִיאָסָף
  choice: అబీయాసాపు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా, మూల ఉచ్చారణను గుర్తించగల విధంగా లిప్యంతరీకరించాం.
- source_word: אֵלֶּה מִשְׁפְּחֹת
  choice: ఇవి … వంశాలు
  rationale: אֵלֶּה గుర్తింపును తెలిపే బహువచన సూచకపదం. מִשְׁפְּחֹת గోత్ర సంబంధ వంశావళి సందర్భంలో విస్తృత బంధుత్వ సమూహాలను సూచిస్తుంది; అందువల్ల ‘వంశాలు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: הַקָּרְחִי
  choice: కోరహీయుల
  rationale: ఈ జాతివాచక రూపం కోరహు వంశానికి చెందినవారిని సమూహంగా సూచిస్తుంది; ‘కోరహీయులు’ అనే రూపం ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
