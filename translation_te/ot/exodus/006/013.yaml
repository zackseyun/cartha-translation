reference: Exodus 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతోను అహరోనుతోను పలికి, ఇశ్రాయేలీయులను గూర్చి, ఐగుప్తు రాజైన ఫరోను గూర్చి వారికి ఆజ్ఞాపించాడు[a]: ఇశ్రాయేలీయులను ఐగుప్తు దేశం నుండి బయటకు తీసుకురావాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులకు, ఐగుప్తు రాజైన ఫరోకు ఆజ్ఞాపించాడు.” హీబ్రూ విభక్తి ఆజ్ఞను అందుకున్నవారిని సూచించవచ్చు; అయితే సందర్భంలో ఆ ఆజ్ఞ ఇశ్రాయేలీయులను, ఫరోను ఉద్దేశించినదని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... మాట్లాడి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా అందించాం.
- source_word: וַיְצַוֵּם
  choice: వారికి ఆజ్ఞాపించాడు
  rationale: צוה లోని అధికారపూర్వక ఆజ్ఞ భావాన్ని నిలుపుతుంది; బహువచన ప్రత్యయం మోషే, అహరోనులను సూచిస్తుంది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה
  choice: ఇశ్రాయేలీయులను గూర్చి, ... ఫరోను గూర్చి
  rationale: ఇక్కడ אֶל ఆజ్ఞ యొక్క ప్రత్యక్ష గ్రహీతలను కాక, అది ఎవరిని ఉద్దేశించిందో సూచించే అవకాశముంది. ప్రధాన అనువాదంలో సందర్భానికి తగిన ఈ భావాన్ని తీసుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది మొత్తం జాతిని సూచించే స్థిరమైన హీబ్రూ నామప్రయోగం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా అదే సమూహార్థాన్ని తెలియజేస్తుంది.
- source_word: לְהוֹצִיא
  choice: బయటకు తీసుకురావాలని
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: אֶרֶץ అనే భూభాగ సూచనను ‘దేశం’ అని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యమున్న ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇది కేవలం పురుష సంతానాన్ని కాక ఇశ్రాయేలు జనసమూహాన్ని సూచించే జాతీయ నామప్రయోగం; ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో అర్థవంతంగా, సహజంగా ఉంది.
- issue: ఆజ్ఞ ఎవరికి ఇవ్వబడింది అనే వాక్యనిర్మాణ సందిగ్ధత
  choice: మోషే, అహరోనులకు ఇశ్రాయేలు మరియు ఫరోను గూర్చి ఆజ్ఞ ఇచ్చాడు
  alternative: ఇశ్రాయేలీయులకు, ఫరోకు ఆజ్ఞ ఇచ్చాడు
  rationale: וַיְצַוֵּם లోని ‘వారిని/వారికి’ మోషే, అహరోనులను సూచిస్తుంది; తదుపరి אֶל పదబంధాలు ఆజ్ఞకు సంబంధించిన వర్గాలను సూచించవచ్చు. అయినా ‘వారికి’ అనే ప్రత్యక్ష గ్రహీత భావం వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరానువాదం కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘ఇశ్రాయేలీయులు’ను ఎంచుకున్నాం. మూలంలోని אֶל నిర్మాణ సందిగ్ధతను ప్రధాన పాఠ్యంలో సందర్భానుకూలంగా అనువదించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
