  to: 'అప్పుడు యెహోవా మోషేతోను అహరోనుతోను పలికి, ఇశ్రాయేలీయులను గూర్చి, ఐగుప్తు రాజైన ఫరోను గూర్చి వారికి ఆజ్ఞాపించాడు[a]: ఇశ్రాయేలీయులను ఐగుప్తు దేశం నుండి బయటకు తీసుకురావాలని.'
  rationale: మూల వాక్యంలోని ప్రసంగ గ్రహీతలు మోషే, అహరోనులనే స్పష్టంగా ఉంచుతూ, తరువాతి אֶל పదబంధాల సందర్భానుకూలమైన ‘గూర్చి’ భావాన్ని అలాగే నిలిపాం. ఆజ్ఞను అమలు చేయవలసిన విషయం—ఇశ్రాయేలీయులను ఐగుప్తు దేశం నుండి బయటకు తీసుకురావడం—స్పష్టంగా అనుసంధానించబడింది. పాదసూచిక ప్రత్యామ్నాయ వ్యాకరణ విశ్లేషణను మార్పు లేకుండా, మరింత సహజమైన పదక్రమంతో సంరక్షిస్తుంది.
