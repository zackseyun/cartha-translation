  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: te
  text: మోషే ఇశ్రాయేలు కుమారులకు ఈ విధంగా చెప్పాడు. కానీ వారు నిరుత్సాహం వల్లా, కఠినమైన వెట్టిచాకిరి వల్లా మోషే మాట వినలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆత్మ యొక్క సంకుచితత్వం.” ఈ నుడికారం నిరుత్సాహం, మనస్సు కుంగిపోవడం, లేదా తీవ్రమైన ఒత్తిడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... כֵּן
  choice: ఈ విధంగా చెప్పాడు
  rationale: כֵּן ముందున్న దేవుని సందేశంలోని విషయాన్ని సూచిస్తుంది. ‘ఈ విధంగా చెప్పాడు’ అనేది హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని అధికారికంగా పుంలింగ బహువచన నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది యాకోబు సంతతిని సమూహంగా సూచిస్తుంది.
- source_word: שָׁמְעוּ אֶל
  choice: మాట వినలేదు
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం శబ్దం వినకపోవడం కాక, ఒకరి మాట ఆలకరించడం లేదా పట్టించుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘మాట వినలేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מִקֹּצֶר רוּחַ
  choice: మనోవేదన వల్ల
  rationale: అక్షరార్థంగా ‘ఆత్మ/ఊపిరి కుదించుకుపోవడం’ అనే ఈ నుడికారం తీవ్ర నిరుత్సాహం, అంతరంగ నలిగిపోవడం లేదా ఊపిరాడనంత వేదనను సూచిస్తుంది. ‘మనోవేదన’ సందర్భానుకూలంగా సహజమైనది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: కఠినమైన వెట్టిచాకిరి వల్ల
  rationale: עֲבֹדָה సాధారణంగా పని లేదా సేవను సూచించగలిగినా, ఐగుప్తులో ఇశ్రాయేలీయుల సందర్భంలో అది బలవంతపు బానిస శ్రమ. ‘వెట్టిచాకిరి’ ఆ నిర్బంధ స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: עֲבֹדָה קָשָׁה లో ఐగుప్తు కింద ఇశ్రాయేలీయుల స్థితి
  choice: కఠినమైన వెట్టిచాకిరి
  alternative: కఠినమైన పని
  rationale: ‘పని’ మూలపద విస్తృత అర్థానికి దగ్గరగా ఉన్నా, నిర్గమకాండ సందర్భం బలవంతపు బానిస శ్రమను స్పష్టంగా చూపుతుంది. ‘వెట్టిచాకిరి’ ఆ చారిత్రక అణచివేతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- issue: מִקֹּצֶר רוּחַ యొక్క భావం
  choice: మనోవేదన
  alternative: ఆత్మ కుంచించుకుపోవడం / నిరుత్సాహం / ఓపికలేమి
  rationale: ఈ నుడికారం శారీరక ఊపిరాడకపోవడం, మానసిక నలిగిపోవడం, నిరుత్సాహం వంటి పరస్పర సంబంధిత భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘మనోవేదన’ను ఎంచుకొని, మూలంలోని రూపకాన్ని మరియు సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వెట్టిచాకిరి’ బలవంతపు బానిస శ్రమను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యాంతంలో ఉంచబడింది.
