  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. వంశావళి సంబంధాలను స్పష్టంగా ఉంచి, మూలంలోని వివాహ ప్రయోగాన్ని అతిగా వివరణ చేయకుండా సహజంగా అందించాం.
