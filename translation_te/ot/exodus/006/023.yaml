source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן אֶת אֱלִישֶׁ֧בַע בַּת עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֣לֶד ל֗/וֹ אֶת נָדָב֙ וְ/אֶת אֲבִיה֔וּא אֶת אֶלְעָזָ֖ר וְ/אֶת אִֽיתָמָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: te
  text: అహరోను అమ్మీనాదాబు కుమార్తె, నహషోను సహోదరి అయిన ఎలీషెబాను తన భార్యగా తీసుకున్నాడు. ఆమె అతనికి నాదాబు, అబీహు, ఎలియాజరు, ఇతామారులను కన్నది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తనకు భార్యగా చేసుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకున్నాడు’ అనే అర్థం ఉన్నా, לְאִשָּׁה (‘భార్యగా’)తో కలిసి ఇది వివాహాన్ని సూచిస్తుంది. తెలుగులో ‘తనకు భార్యగా చేసుకున్నాడు’ మూలంలోని నిర్మాణాన్నీ వివాహార్థాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: אֱלִישֶׁבַע
  choice: ఎలీషెబ
  rationale: హీబ్రూ పేరును దాని మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: בַּת עַמִּינָדָב
  choice: అమ్మీనాదాబు కుమార్తె
  rationale: సంబంధవాచక construct రూపాన్ని తెలుగులో సహజమైన ‘కుమార్తె’ ప్రయోగంతో అందించాం.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: నయస్సోను సహోదరి
  rationale: אֲחוֹת నేరుగా సహోదరి సంబంధాన్ని సూచిస్తుంది. נַחְשׁוֹן పేరులోని חְשׁ ధ్వనిసముదాయాన్ని తెలుగు పఠన సంప్రదాయానికి అనుగుణంగా ‘నయస్సోను’గా ఇచ్చాం.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి ... కనింది
  rationale: ילד క్రియతో వ్యక్తిగత పరోక్ష కర్మ కలిసిన భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘అతనికి ... కనింది’ అని వ్యక్తపరిచాం.
- source_word: נָדָב
  choice: నాదాబు
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: אֲבִיהוּא
  choice: అబీహు
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: వ్యక్తిపేరును హీబ్రూ రూపాన్ని ప్రతిబింబించేలా, తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరణ చేశాం.
- source_word: אִיתָמָר
  choice: ఈతామారు
  rationale: వ్యక్తిపేరును హీబ్రూ దీర్ఘ స్వరానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
