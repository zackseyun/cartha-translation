  yaml_path: translation/ot/exodus/006/017.yaml
  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: te
  text: 'గెర్షోను కుమారులు: లిబ్నీ, షిమీ—వారి వంశాల ప్రకారం.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి కుటుంబాల ప్రకారం.’ ఇక్కడి హెబ్రీ పదం గోత్రంలో భాగమైన విస్తృత కుటుంబ సమూహాలను లేదా వంశాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచనం; ఇక్కడ ప్రత్యక్ష కుమారుల వంశావళి జాబితాను పరిచయం చేస్తుంది. అందువల్ల ‘కుమారులు’ సహజమైన, సూటియైన అనువాదం.
- source_word: גֵרְשׁוֹן
  choice: గేర్షోను
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לִבְנִי
  choice: లిబ్నీ
  rationale: వ్యక్తి పేరు; అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: וְשִׁמְעִי
  choice: లిబ్నీ, షిమీ
  rationale: హెబ్రీ సంధికారకంతో కూడిన రెండవ వ్యక్తి పేరు. తెలుగు జాబితా శైలిలో కామాతో సహజంగా కలిపి చూపబడింది.
- source_word: לְמִשְׁפְּחֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: మִשְׁפָּחָה గోత్రంలోని విస్తృత కుటుంబ సమూహాన్ని లేదా వంశశాఖను సూచించగలదు. ‘వంశాల ప్రకారం’ వంశావళి సందర్భంలో సహజంగా ఉండి, కేవలం చిన్న కుటుంబం అనే ఆధునిక భావానికి పరిమితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలి ఉపయోగించబడింది. వ్యక్తుల పేర్లు హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; ‘వంశాలు’ అనే పదం సామాజిక-గోత్ర సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
