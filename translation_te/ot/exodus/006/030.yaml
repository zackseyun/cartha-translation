  to: అయితే మోషే యెహోవా సన్నిధిలో, “ఇదిగో, నేను సున్నతిలేని పెదవులు గలవాణ్ణి; అలాంటప్పుడు ఫరో నా మాట ఎలా వింటాడు?” అన్నాడు.
