  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: te
  text: అయితే మోషే యెహోవా సన్నిధిలో, “ఇదిగో, నేను సున్నతిలేని పెదవులు గలవాణ్ణి; అలాంటప్పుడు ఫరో నా మాట ఎలా వింటాడు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘యెహోవా ఎదుట/సన్నిధిలో’ అనే స్థల-సంబంధ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: הֵן
  choice: చూడండి
  rationale: వక్త తన పరిస్థితిపై దృష్టి పెట్టించడానికి వాడిన ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲרַל שְׂפָתַיִם
  choice: సున్నతిలేని పెదవులవాణ్ణి
  rationale: మూలంలోని అసాధారణ రూపకాన్ని వివరణతో భర్తీ చేయకుండా యథాతథంగా నిలుపుతుంది; దాని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: יִשְׁמַע אֵלַי
  choice: నా మాట వింటాడు
  rationale: హీబ్రూ ప్రయోగంలోని ‘నా వైపు వినడం’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వినడం/లెక్కచేయడం అనే భావవ్యాప్తిని పూర్తిగా మూసివేయదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా ప్రతిబింబిస్తుంది; ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని జోడించదు.
- issue: ‘సున్నతిలేని పెదవులు’ అనే రూపక వివరణ
  choice: రూపకాన్ని నేరుగా నిలుపడం
  alternative: నేను సరిగా మాట్లాడలేను
  rationale: మూలపాఠం మాటతీరు లోపమా, అనర్హత భావమా, మరేదైనా అవరోధమా అన్నది స్పష్టంగా నిర్ణయించదు; అందువల్ల ఆ భావ ఉద్వేగం మరియు అస్పష్టతను అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన సంభాషణా శైలి. మూలంలోని రూపక తీవ్రతను నిలుపుతూ, ప్రశ్నను సహజ తెలుగు వాక్యక్రమంలో ఇచ్చాం.
