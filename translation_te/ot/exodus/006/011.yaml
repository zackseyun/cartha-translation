source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: te
  text: “వెళ్లి, ఐగుప్తు రాజైన ఫరోతో ఇశ్రాయేలు కుమారులను[a] తన దేశం నుండి పంపివేయమని మాట్లాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులను,” లేదా “ఇశ్రాయేలు సంతతివారిని.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులను” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: వెళ్లి
  rationale: בוא అనే ఆజ్ఞారూపానికి సందర్భానుసారంగా ‘వెళ్లు’ అనే భావం సరిపోతుంది. మోషే తన ప్రస్తుత స్థానం నుండి ఫరో దగ్గరకు వెళ్లాలని ఆజ్ఞ ఇవ్వబడుతోంది; తెలుగులో సంయుక్త ఆజ్ఞగా ‘వెళ్లి’ సహజంగా ఉంటుంది.
- source_word: דַבֵּר אֶל
  choice: తో మాట్లాడు
  rationale: דבר అనే పీయేల్ ఆజ్ఞారూపం, אֶל సూచించే సంబోధితునితో కలిపి, తెలుగులో సహజంగా ‘తో మాట్లాడు’ అవుతుంది. ఇది ‘చెప్పు’ కంటే మూలంలోని మాటలాడే చర్యను నేరుగా నిలుపుతుంది.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: ఐగుప్తు రాజైన ఫరో
  rationale: మూలంలోని విశేషణాత్మక సమాసాన్ని ఆధునిక తెలుగులో సహజమైన సంబంధరూపంతో వ్యక్తం చేస్తుంది; ఫరో ఐగుప్తు రాజు అని స్పష్టంగా నిలుపుతుంది.
- source_word: וִישַׁלַּח
  choice: అతడు … పంపివేయాలి
  rationale: ఆజ్ఞ తర్వాత వచ్చిన అసంపూర్ణ క్రియ ఇక్కడ మోషే ఫరోతో చెప్పవలసిన నిర్దేశాన్ని లేదా ఉద్దేశిత ఫలితాన్ని సూచిస్తుంది. ‘పంపివేయాలి’ విడుదల చేసి దేశం నుండి వెళ్లనివ్వాలనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబసంబంధ పదబంధాన్ని అక్షరార్థానికి దగ్గరగా నిలుపుతుంది. సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: מֵאַרְצוֹ
  choice: తన దేశం నుండి
  rationale: אֶרֶץ ఇక్కడ ఫరో పాలించే దేశాన్ని సూచిస్తుంది. కర్త ఫరోనే కాబట్టి తెలుగులో ‘తన దేశం నుండి’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం యొక్క అనువాదం
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలీయులను / ఇశ్రాయేలు సంతతివారిని
  rationale: మూలంలోని పురుషలింగ కుటుంబసంబంధ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించే జాతివాచక ప్రయోగమనే విషయాన్ని పాదసూచికలో తెలియజేస్తుంది. దీనివల్ల మూలరూపం చెరిగిపోకుండా సందర్భార్థం కూడా స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ‘ఐగుప్తు’ మరియు ‘ఫరో’ అనే బైబిలు వాడుకలో స్థిరపడిన రూపాలను నిలిపాం. సెమికోలన్ మొదటి ఆజ్ఞకు మరియు ఫరోకు తెలియజేయవలసిన నిర్దేశానికి మధ్య ఉన్న మూల సంబంధాన్ని స్పష్టంగా చూపుతుంది.
