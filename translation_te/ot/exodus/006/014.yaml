  text: אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבֹתָ֑/ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּ/פַלּוּא֙ חֶצְר֣וֹן וְ/כַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: te
  text: 'వారి పితృకుటుంబాల పెద్దలు వీరు: ఇశ్రాయేలు జ్యేష్ఠుడైన రూబేను కుమారులు[a] హనోకు, పల్లు, హెస్రోను, కర్మీ. వీరు రూబేను వంశాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రూబేను వంశస్థులు.”
    reason: בְּנֵי అనే పదం వంశావళి సందర్భంలో ప్రత్యక్ష కుమారులతో పాటు విస్తృతంగా వంశస్థులను కూడా సూచించగలదు.
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  choice: వారి పితృ కుటుంబాల పెద్దలు వీరు
  rationale: వంశావళి సందర్భంలోని పితృసంబంధిత విస్తృత కుటుంబ విభాగాలనూ వాటి నాయకులనూ తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי רְאוּבֵן
  choice: రూబేను కుమారులు
  rationale: ఇక్కడ వెంటనే పేర్లతో పేర్కొన్న సంతానాన్ని పరిచయం చేస్తున్నందున ‘కుమారులు’ అనేది నేరుగా మూలపాఠానికి సరిపోతుంది; విస్తృతార్థమైన ‘వంశస్థులు’ను ప్రధాన పాఠంలో పెట్టలేదు.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు మొదట పుట్టిన కుమారుడు
  rationale: రూబేను జన్మక్రమ స్థితిని స్పష్టంగా వ్యక్తం చేస్తూ, సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే భాషను ఉపయోగిస్తుంది.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: హనోకు, పల్లు, హెస్రోను, కర్మీ
  rationale: హీబ్రూ వ్యక్తినామాలకు దగ్గరగా ఉండే, తెలుగులో సులభంగా పలకగల రూపాలు.
- source_word: מִשְׁפְּחֹת רְאוּבֵן
  choice: రూబేను వంశంలోని కుటుంబ శాఖలు
  rationale: מִשְׁפְּחֹת ఇక్కడ సాధారణ చిన్న కుటుంబాలకన్నా గోత్రంలోని బంధుత్వ విభాగాలను సూచిస్తుంది; ‘కుటుంబ శాఖలు’ ఆ స్థాయిని స్పష్టంగా తెలియజేస్తుంది.
