  text: וּ/בְנֵ֣י קְהָ֔ת עַמְרָ֣ם וְ/יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵ֑ל וּ/שְׁנֵי֙ חַיֵּ֣י קְהָ֔ת שָׁלֹ֧שׁ וּ/שְׁלֹשִׁ֛ים וּ/מְאַ֖ת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: te
  text: 'కెహాతు కుమారులు: అమ్రాము, ఇశ్హారు, హెబ్రోను, ఉజ్జీయేలు. కెహాతు జీవితకాలం నూట ముప్పైమూడు సంవత్సరాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే construct plural. ఇక్కడ వెంటనే కహాతు యొక్క నలుగురు కుమారుల పేర్లు వస్తున్నందున ‘వంశస్థులు’ కంటే ‘కుమారులు’ ఖచ్చితమైనది. ప్రారంభంలోని וּ సంధిని తెలుగు జాబితా శైలిలో విడిగా ‘మరియు’ అని ఇవ్వడం అవసరం లేదు.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: అమ్రాము, ఇస్హారు, హెబ్రోను, ఉజ్జీయేలు
  rationale: నాలుగు వ్యక్తినామాలను తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించి, హీబ్రూ సంధులను సహజమైన తెలుగు జాబితా విరామచిహ్నాలతో చూపించాం.
- source_word: וּשְׁנֵי חַיֵּי
  choice: జీవించిన సంవత్సరాలు
  rationale: ‘జీవిత సంవత్సరాలు’ అనే మూల నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ‘జీవించిన సంవత్సరాలు’గా వ్యక్తం చేశాం; ఇది జీవితకాలాన్ని సూచిస్తుంది, కానీ మూలంలోని ‘సంవత్సరాలు’ భావాన్ని నిలుపుతుంది.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: నూట ముప్పై మూడు
  rationale: హీబ్రూ సంఖ్యాక్రమాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం. ‘సంవత్సరాలు’ ఇప్పటికే వాక్యంలో ఉన్నందున సంఖ్య తర్వాత మళ్లీ పునరుక్తి చేయలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. వ్యక్తినామాలు తెలుగు బైబిలు పాఠకులకు సుపరిచితంగా ఉండే రూపాల్లో ఇవ్వబడ్డాయి; మూలంలోని సమాచారం ఏదీ చేర్చలేదు లేదా తొలగించలేదు.
