id: EXO.6.3
reference: Exodus 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: te
  text: నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు సర్వశక్తిమంతుడైన దేవునిగా[a] ప్రత్యక్షమయ్యాను. కాని ‘యాహ్వే’ అనే నా పేరుతో నేను వారికి తెలియబడలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ఏల్ షద్దాయ్; సంప్రదాయంగా “సర్వశక్తిమంతుడైన దేవుడు” అని అనువదిస్తారు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే అనే నా పేరుతో నన్ను నేను వారికి తెలియజేయలేదు.” ఇక్కడ పితరులకు ఆ దైవనామమే తెలియదని తప్పనిసరిగా అర్థం కాకపోవచ్చు; ఆ పేరులోని నిబంధనా ప్రాముఖ్యతను వారు ఇంకా సంపూర్ణంగా తెలుసుకోలేదనే భావం కూడా హీబ్రూలో సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: ప్రత్యక్షమయ్యాను
  rationale: ראה ధాతువు నిఫాల్ రూపానికి ఇక్కడ నేరమైన భావం ‘ప్రత్యక్షమయ్యాను’; పితరులకు దేవుడు కనబడిన సందర్భాలకు ఇది సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు వచ్చిన אֶל ను తెలుగులో ప్రతి పేరుకు ‘-కు’ విభక్తిని జోడించడం ద్వారా లయతోనూ స్పష్టతతోనూ ప్రతిబింబించాం.
- source_word: בְּאֵל שַׁדָּי
  choice: సర్వశక్తిమంతుడైన దేవునిగా
  rationale: בְּ ను ఇక్కడ ‘గా’ అనే నామ/పాత్ర భావంలో తీసుకున్నాం. אֵל שַׁדָּי అనే బిరుదును సాధారణ పాఠకులకు అర్థమయ్యే సంప్రదాయ భావానువాదంతో ఇచ్చి, మూలరూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּשְׁמִי יְהוָה
  choice: కాని ‘యాహ్వే’ అనే నా పేరుతో
  rationale: వాక్యంలోని వ్యత్యాసాన్ని తెలుగులో ‘కాని’ స్పష్టం చేస్తుంది. యాహ్వే అనే వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ‘నా పేరుతో’ అనే హీబ్రూ నిర్మాణాన్ని నిలిపాం.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: నేను వారికి తెలియబడలేదు
  rationale: ידע నిఫాల్ రూపంలోని స్థితి/కర్మణి భావాన్ని నేరుగా నిలిపే అనువాదం ఇది. ‘నన్ను నేను తెలియజేసుకోలేదు’ అనే సాధ్యమైన ప్రతిబింబార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: పితరులకు యాహ్వే అనే పేరు తెలియలేదని చెప్పే వాక్యభాగం యొక్క అర్థం
  choice: ‘నేను వారికి తెలియబడలేదు’ అనే మూలానికి సన్నిహితమైన, ఉద్దేశపూర్వకంగా వివరణకు తెరిచి ఉన్న రూపాన్ని ఉంచడం
  alternative: ‘యాహ్వే అనే నా పేరుతో నన్ను నేను వారికి తెలియజేసుకోలేదు’ లేదా ఆ పేరుకు సంబంధించిన నిబంధనా ప్రాముఖ్యతను వారు ఇంకా పూర్తిగా అనుభవపూర్వకంగా తెలుసుకోలేదు
  rationale: హీబ్రూ రూపం సంపూర్ణ నామ-అజ్ఞానాన్నిగానీ, దేవుడు ఆ పేరులో తన స్వభావం మరియు నిబంధనా కార్యాన్ని ఇంకా సంపూర్ణంగా వెల్లడించలేదన్న భావాన్నిగానీ సందర్భానుసారం అనుమతిస్తుంది. ఆదికాండంలోని పితరుల కథల్లో ఈ నామం కనిపించడం వల్ల ఏర్పడే ఉద్రిక్తతను ప్రధాన పాఠ్యం మౌనంగా పరిష్కరించదు.
- issue: יהוה అనే దైవనామం యొక్క ప్రతిపాదన
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వ్యక్తిగత దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం ఉపయోగించాం. ‘ప్రత్యక్షమయ్యాను,’ ‘తెలియబడలేదు’ వంటి పదాలు మూలంలోని రూపాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. హీబ్రూ వాక్యంలోని వ్యత్యాసాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి స్పష్టం చేశాం.
