  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. పేర్లను ఆంగ్ల సంప్రదాయ రూపాల ద్వారా కాకుండా హీబ్రూ మూలానికి దగ్గరగా లిప్యంతరీకరించాం; తెలుగులో అసహజమైన ప్రతి-item ‘మరియు’ పునరుక్తిని కామాలతో వ్యక్తం చేశాం.
