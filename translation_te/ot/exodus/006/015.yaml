source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֨ל וְ/יָמִ֤ין וְ/אֹ֨הַד֙ וְ/יָכִ֣ין וְ/צֹ֔חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִ֑ית אֵ֖לֶּה מִשְׁפְּחֹ֥ת שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: te
  text: 'షిమ్యోను కుమారులు: యెమూయేలు, యామీను, ఓహదు, యాకీను, సోహరు, కనానీయ స్త్రీకి పుట్టిన షావూలు[a]. ఇవే షిమ్యోను వంశాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: షావూలును సంప్రదాయంగా ‘సౌలు’ అని కూడా రాస్తారు. ఇక్కడి హీబ్రూ రూపం שָׁאוּל (షావూల్).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే construct plural. ఇది కొనసాగుతున్న వంశావళి జాబితా అయినప్పటికీ, తెలుగులో వాక్యారంభ ‘మరియు’ సహజంగా అవసరం లేదు.
- source_word: יְמוּאֵל
  choice: యెమూయేలు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వన్యనుకరణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְיָמִין
  choice: యామీను
  rationale: జాబితాలోని waw సంధిని తెలుగు విరామచిహ్నాలతో సహజంగా వ్యక్తం చేస్తూ, పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וְאֹהַד
  choice: ఓహదు
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְיָכִין
  choice: యాకీను
  rationale: ఆదిలోని హీబ్రూ yod ధ్వనిని ‘య’గా నిలిపి, పేరును తెలుగులో సహజంగా లిప్యంతరీకరించింది.
- source_word: וְצֹחַר
  choice: సోహరు
  rationale: צֹחַר పేరును ఆధునిక తెలుగు పాఠకునికి పలకదగిన రూపంలో, మూల ధ్వనికి సమీపంగా ఇచ్చింది.
- source_word: וְשָׁאוּל
  choice: షావూలు
  rationale: שָׁאוּל అనే హీబ్రూ రూపాన్ని నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ; సంప్రదాయ ‘సౌలు’ రూపం కంటే మూల ధ్వనిని స్పష్టంగా నిలుపుతుంది.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: కనానీయ స్త్రీ కుమారుడైన
  rationale: הַכְּנַעֲנִית స్త్రీలింగ ఏకవచనం కావడంతో ‘కనానీయ స్త్రీ’ అని స్పష్టంగా అనువదించింది; బంధాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: వీరు షిమ్యోను వంశాలు
  rationale: మానవ సమూహాలను సూచిస్తున్నందున אֵלֶּהను ‘వీరు’గా ఇచ్చింది. מִשְׁפְּחֹת ఇక్కడ గోత్రంలోని బంధుత్వ విభాగాలను సూచిస్తుంది కాబట్టి ‘వంశాలు’ అనేది ‘కుటుంబాలు’ కంటే సందర్భోచితం.
