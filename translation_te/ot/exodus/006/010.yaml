  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; דבר ఇక్కడ మాటలాడడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు ... చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సన్నిహిత లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట మోషేను ఉద్దేశించి పలికినదని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ ఆఖ్యాన సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది; వేరొక ప్రాచుర్యమైన రూపాన్ని పాదటిప్పణిలో సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే సంక్షిప్త కథనశైలి. ఈ చిన్న వాక్యంలో ‘యహ్వే’కు ప్రత్యామ్నాయ లిప్యంతరీకరణను తప్పనిసరిగా పాదటిప్పణిలో ఇవ్వాల్సిన పాఠ్య సందిగ్ధత లేదు.
