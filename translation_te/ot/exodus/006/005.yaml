source:
  edition: WLC
  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: te
  text: ఐగుప్తీయులు బానిసలుగా చేసుకుంటున్న ఇశ్రాయేలు ప్రజల[a] మూలుగును నేను కూడా విన్నాను; నా నిబంధనను జ్ఞాపకం చేసుకున్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు’; ఈ మాట ఇక్కడ ఇశ్రాయేలు ప్రజలందరినీ సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘జ్ఞాపకం చేసుకున్నాను’ అనేది నిబంధనకు సంబంధించిన భాష. దేవుడు దానిని మరచిపోయాడని కాదు; తన నిబంధనకు అనుగుణంగా చర్య తీసుకోవడానికి దానివైపు తిరిగాడనే భావం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: నేను కూడా
  rationale: ముందటి దైవ ప్రసంగంతో ఉన్న అనుబంధాన్ని, స్పష్టంగా ఉన్న ‘నేను’ అనే సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׁמַעְתִּי
  choice: విన్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను తెలుగు సందర్భంలో సహజమైన భూతకాల రూపంతో అందిస్తుంది; వినడం వల్ల ఏర్పడిన ప్రస్తుత సంబంధాన్ని మొత్తం వాక్యసందర్భం తెలియజేస్తుంది.
- source_word: נַאֲקַת
  choice: మూలుగును
  rationale: పీడనలో నుంచి వెలువడే వేదనాభరితమైన నిట్టూర్పు లేదా ఆర్తనాద భావాన్ని గంభీరంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ అది పురుషులను మాత్రమే కాక నిబంధన సమాజమంతటినీ సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో ఆ సమష్టి భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థం పాదటిప్పణిలో ఉంచబడింది.
- source_word: מִצְרַיִם מַעֲבִדִים
  choice: ఐగుప్తీయులు బానిసలుగా పనిచేయిస్తున్న
  rationale: మూలంలోని causative భావాన్ని, అంటే బలవంతంగా సేవ చేయించడాన్ని, సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וָאֶזְכֹּר
  choice: జ్ఞాపకం చేసుకున్నాను
  rationale: ‘జ్ఞాపకం చేసుకోవడం’ అనే మూల బైబిలు నిబంధనాభాషను పరాభాష చేయకుండా నిలుపుతుంది. ఇది దేవుడు మరచిపోయాడని తప్పనిసరిగా సూచించదని పాదటిప్పణి వివరిస్తుంది.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: నిబంధన సంబంధిత సందర్భాల్లో בְּרִית పదానికి స్థిరమైన, గంభీరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమష్టి భావం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుష బహువచన రూపం ఇక్కడ నిబంధన ప్రజలందరినీ సమష్టిగా సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సమగ్ర భావాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరచాం.
- issue: దేవుడు నిబంధనను ‘జ్ఞాపకం చేసుకోవడం’
  choice: నా నిబంధనను జ్ఞాపకం చేసుకున్నాను
  alternative: నా నిబంధన ప్రకారం చర్య తీసుకోవడానికి తిరిగాను
  rationale: మూలంలోని నిబంధనాత్మక జ్ఞాపక భాషను యథాతథంగా నిలిపి, దాని భావాన్ని ముందుగానే ఒకే విధంగా పరిష్కరించలేదు. చర్యవైపు తిరగడం అనే సందర్భార్థాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘మూలుగు,’ ‘నిబంధన,’ ‘జ్ఞాపకం చేసుకున్నాను’ వంటి పదాలు బైబిలు సందర్భపు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
