    text: అక్షరార్థంగా, “దానిని ఇవ్వడానికి నేను నా చేయి ఎత్తిన.” చేయి ఎత్తడం ప్రమాణం చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: మూలంలోని ప్రమాణ నుడికారపు పదచిత్రాన్ని వివరించడానికి.
