revisions:
- from: నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు ఇస్తానని చేయెత్తి ప్రమాణం చేసిన[a] దేశానికి మిమ్మల్ని తీసుకొస్తాను. దాన్ని మీకు స్వాస్థ్యంగా ఇస్తాను. నేనే యెహోవాను.
  to: నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు దానిని ఇస్తానని చేయి ఎత్తి ప్రమాణం చేసిన[a] దేశంలోకి మిమ్మల్ని తీసుకొస్తాను. దాన్ని మీకు స్వాస్థ్యంగా ఇస్తాను. నేనే యాహ్వేను.
