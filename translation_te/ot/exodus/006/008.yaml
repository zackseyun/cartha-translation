id: EXO.6.8
reference: Exodus 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: te
  text: నేను అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు దానిని ఇస్తానని చేయి ఎత్తి ప్రమాణం చేసిన[a] దేశంలోకి మిమ్మల్ని తీసుకొస్తాను. దాన్ని మీకు స్వాస్థ్యంగా ఇస్తాను. నేనే యాహ్వేను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దానిని ఇవ్వడానికి నేను నా చేయి ఎత్తిన.” చేయి ఎత్తడం ప్రమాణం చేయడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: మూలంలోని ప్రమాణ నుడికారపు పదచిత్రాన్ని వివరించడానికి.
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: మిమ్మల్ని తీసుకొస్తాను
  rationale: בוא హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘తీసుకొస్తాను’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశానికి
  rationale: ఈ నిబంధన వాగ్దాన సందర్భంలో אֶרֶץ భూమి అంతటినీ కాక, దేవుడు వాగ్దానం చేసిన నిర్దిష్ట దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: చేయెత్తి ప్రమాణం చేసిన
  rationale: హీబ్రూ పదచిత్రమైన ‘చేయెత్తడం’ను నిలిపి ఉంచుతూ, అది ప్రమాణం చేయడాన్ని సూచించే నుడికారమని తెలుగు పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: לָתֵת אֹתָהּ
  choice: ఇస్తానని
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను, ప్రమాణ వాక్య నిర్మాణానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: మూడు పేర్లతోనూ పునరుక్తమైన హీబ్రూ విభక్తి సంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: దాన్ని మీకు ఇస్తాను
  rationale: హీబ్రూ వాగ్దానంలోని ప్రత్యక్షతను, సరళమైన భవిష్యత్ క్రియతో కాపాడుతుంది.
- source_word: מוֹרָשָׁה
  choice: స్వాస్థ్యంగా
  rationale: מוֹרָשָׁה శాశ్వతంగా పొందిన లేదా వారసత్వ హక్కుతో కలిగిన ఆస్తిని సూచిస్తుంది; ‘స్వాస్థ్యం’ ఈ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచి, గంభీరమైన స్వీయ గుర్తింపును ‘నేనే’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రమాణ నుడికారం נָשָׂאתִי אֶת יָדִי అనువాదం
  choice: చేయెత్తి ప్రమాణం చేసిన
  alternative: ప్రమాణం చేసిన
  rationale: మూలంలోని స్పష్టమైన చేయెత్తే పదచిత్రాన్ని కోల్పోకుండా, దాని ప్రమాణార్థాన్ని ప్రధాన పాఠ్యంలోనే తెలియజేస్తుంది; అడుగుసూచన అక్షరార్థాన్ని వివరిస్తుంది.
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని నిబంధన నామాన్ని సాధారణ బిరుదుగా మార్చకుండా ఉంచుతుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నప్పటికీ, ‘యాహ్వే’ సాధ్యమైన లిప్యంతరీకరణ.
- issue: מוֹרָשָׁה యొక్క భావం
  choice: స్వాస్థ్యంగా
  alternative: వారసత్వ సంపదగా
  rationale: ఇక్కడ ప్రధానంగా దేవుడు ఇశ్రాయేలుకు దేశాన్ని నిలకడైన హక్కుగల ఆస్తిగా ఇవ్వడం ఉద్దేశం; మానవ పూర్వికుని మరణానంతర వారసత్వ భావాన్ని అవసరానికి మించి ముందుకు తేవడం నివారించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే నిబంధన వాగ్దానానికి తగిన గౌరవప్రదమైన శైలి. ‘చేయెత్తి ప్రమాణం చేసిన’ రూపం మూల పదచిత్రం మరియు దాని భావం రెండింటినీ నిలుపుతుంది.
