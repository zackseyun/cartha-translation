  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: te
  text: అహరోను కుమారుడైన ఎలియాజరు పూతీయేలు కుమార్తెలలోనుండి తనకు భార్యను తీసుకున్నాడు[a]. ఆమె అతనికి ఫీనెహాసును కన్నది. వారి వంశాల ప్రకారం లేవీయుల పితృకుటుంబాల పెద్దలు[b] వీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూతీయేలు కుమార్తెలలో ఒకరిని.” హీబ్రూ పదబంధం పూతీయేలు కుటుంబంతో వైవాహిక సంబంధం ఏర్పరచుకున్నాడని సూచించవచ్చు; ఏ కుమార్తె అని పేర్కొనదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పితృకుటుంబాల పెద్దలు.” ఇది లేవీయుల వంశాలలోని పూర్వీకుల కుటుంబ విభాగాలకు నాయకులైన వారిని సూచించే బంధుత్వ పదబంధం.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: తనకు భార్యగా తీసుకున్నాడు
  rationale: హీబ్రూ వివాహ నుడికారంలోని ‘తనకొరకు ... భార్యగా తీసుకున్నాడు’ అనే రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: పూతీయేలు కుమార్తెలలో ఒకరిని
  rationale: מִן సమూహంలోనుంచి ఎంపికను సూచించగలదు; వివాహ సందర్భంలో ఒక కుమార్తె ఉద్దేశించబడిందని తెలుగులో సహజంగా తెలియజేస్తుంది. కుటుంబంలో వివాహం చేసుకున్నాడనే విస్తృత భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: ఆమె అతనికి ఫీనెహాసును కన్నది
  rationale: స్త్రీలింగ ఏకవచన క్రియలో భార్యే కర్తగా ఉన్నదాన్ని, అలాగే לוֹ లోని సంబంధాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: רָאשֵׁי אֲבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: ఇది కేవలం తండ్రులను కాకుండా పూర్వీకుల ఆధారంగా ఏర్పడిన కుటుంబ విభాగాలకు నాయకులైన వారిని సూచించే వంశావళి సంబంధ పదబంధం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి సంతతి గోత్రసమూహానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రమాణ రూపం.
- source_word: לְמִשְׁפְּחֹתָם
  choice: తమ వంశాల ప్రకారం
  rationale: వంశావళి సందర్భంలో מִשְׁפָּחָה విస్తృత వంశ లేదా కుల విభాగాన్ని సూచిస్తుంది; ‘వంశాల ప్రకారం’ సమూహీకరణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: ఎలియాజరు / అహరోను / పూతీయేలు / ఫీనెహాసు
  rationale: వ్యక్తినామాలను అనువదించకుండా, ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. ‘తనకు భార్యగా తీసుకున్నాడు’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, అసహజమైన పదక్రమాన్ని నివారించాం. రెండవ పాదసూచికను అది వివరిస్తున్న ‘పితృకుటుంబాల పెద్దలు’ అన్న పదబంధం వద్ద ఉంచాం.
