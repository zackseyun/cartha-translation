id: EXO.6.21
reference: Exodus 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י יִצְהָ֑ר קֹ֥רַח וָ/נֶ֖פֶג וְ/זִכְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/021.yaml
  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: te
  text: 'ఇశ్హారు కుమారులు: కోరహు, నెఫెగు, జిక్రీ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారుడు’ అనే పదానికి నిర్మాణ బహువచన రూపం. ఇక్కడ వెంటనే ముగ్గురు పురుషుల పేర్లు ఇవ్వబడుతున్నందున ‘వంశస్థులు’ కంటే ‘కుమారులు’ సహజంగా, నిర్దిష్టంగా ఉంది. ఆరంభంలోని ו genealogical జాబితాను అనుసంధానిస్తుంది; తెలుగులో ఈ చిన్న జాబితా అంశానికి ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: יִצְהָר
  choice: ఇస్హారు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం; చివరి వ్యంజనాన్ని సహజ తెలుగు పఠనానికి ‘రు’తో సూచించాం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హెబ్రీ వ్యక్తి పేరు קֹרַחను, చివరి గొంతు ధ్వనిని ‘హు’ ద్వారా సమీపంగా సూచిస్తూ తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: וָ/נֶפֶג
  choice: నెఫెగు
  rationale: వ్యక్తి పేరు נֶפֶגను మూలధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం. జాబితాలోని సముచ్చయార్థం తెలుగులో కామాలతో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְ/זִכְרִי
  choice: జిఖ్రీ
  rationale: వ్యక్తి పేరు זִכְרִיను హెబ్రీ ధ్వనులకు దగ్గరగా ‘జిఖ్రీ’గా లిప్యంతరీకరించాం; ముందు ఉన్న ו యొక్క సముచ్చయ భావం జాబితా నిర్మాణంలో అంతర్భూతంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని ఉపయోగించాం. మూలంలోని నామవాచక వాక్య నిర్మాణాన్ని ద్విబిందువుతో నిలిపి, వ్యక్తి పేర్లను మూల హెబ్రీ ధ్వనులకు వీలైనంత దగ్గరగా, సాధారణ తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
