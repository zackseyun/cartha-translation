id: EXO.6.4
reference: Exodus 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: te
  text: నేను వారితో నా నిబంధనను కూడా స్థిరపరిచాను—వారు పరదేశులుగా నివసించిన కనాను దేశాన్ని వారికి ఇవ్వడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారి పరదేశ నివాసాల దేశాన్ని—వారు అందులో పరదేశులుగా నివసించారు.”
    reason: మూలంలోని מְגֻרֵיהֶם మరియు גָּרוּ అనే సంబంధిత నామవాచక-క్రియ పునరుక్తిని, పరదేశ నివాస భావాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి వాక్యంతో అనుసంధానిస్తూ, וְతో కూడిన גַם యొక్క జోడింపు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֲקִמֹתִי
  choice: స్థిరపరిచాను
  rationale: בְּרִיתతో వచ్చిన קום అనే నిబంధనాపరమైన ప్రయోగానికి ఇది సహజమైన, గంభీరమైన తెలుగు; నిబంధనను నెలకొల్పడం లేదా ధృవీకరించడం రెండింటి ఛాయనూ అతిగా విడదీయకుండా ఉంచుతుంది.
- source_word: בְּרִיתִי אִתָּם
  choice: వారితో నా నిబంధనను
  rationale: దైవసంబంధ స్వామ్యాన్ని, పితరులతోనున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָתֵת לָהֶם
  choice: వారికి ఇవ్వడానికి
  rationale: ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֶרֶץ כְּנָעַן
  choice: కనాను దేశాన్ని
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ భావాన్నీ, כְּנָעַן అనే స్థలనామాన్నీ నిలుపుతుంది.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: వారు పరదేశులుగా నివసించిన ... దేశాన్ని
  rationale: מָגוּר మరియు גור సూచించే తాత్కాలిక పరదేశ నివాస స్థితిని చదవడానికి సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని నామవాచక-క్రియ పునరుక్తిని పాదటిప్పణిలో చూపిస్తుంది.
theological_decisions:
- issue: קום + ברית అనే నిబంధనా ప్రయోగం
  choice: నా నిబంధనను స్థిరపరిచాను
  alternative: నా నిబంధనను నెలకొల్పాను / ధృవపరిచాను
  rationale: దేవుడు పితరులతో చేసిన బద్ధమైన నిబంధనను సూచించే మూలప్రయోగ గంభీరతను కాపాడుతూ, అది తొలిసారి చేయబడిందా లేక ధృవీకరించబడిందా అనే అంశాన్ని అనవసరంగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర వచనం. ‘పరదేశులుగా నివసించిన’ అనేది మూలంలోని విదేశీయ/తాత్కాలిక నివాస స్థితిని కాపాడుతుంది; పాదటిప్పణి అక్షరార్థ నిర్మాణాన్ని అందిస్తుంది.
