id: EXO.6.6
reference: Exodus 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: te
  text: 'కాబట్టి ఇశ్రాయేలు ప్రజలతో[a] ఇలా చెప్పు: ‘నేనే యాహ్వేను[b]. నేను మిమ్మల్ని ఐగుప్తు భారాల కిందనుండి బయటకు తీసుకొస్తాను; వారి బానిసత్వం నుండి మిమ్మల్ని విడిపిస్తాను[c]; చాచిన బాహువుతోను గొప్ప తీర్పులతోను మిమ్మల్ని విమోచిస్తాను[d].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులతో’; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: YHWH. దీనిని సాంప్రదాయంగా ‘యెహోవా’ అని కూడా పలుకుతారు.'
    reason: alternative_reading
  - marker: c
    text: లేదా ‘వారి వెట్టిచాకిరి నుండి.’ హీబ్రూ పదానికి సేవ, పని అనే అర్థాలు కూడా ఉన్నాయి; ఇక్కడ అది బలవంతపు దాస్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘గొప్ప తీర్పు కార్యాలతో.’ ఇది ఐగుప్తుపై అమలుచేసే గొప్ప న్యాయ తీర్పులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి దైవవాక్యం నుండి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం నిబంధన సమాజాన్ని సూచిస్తున్నందున ‘ప్రజలు’ సహజంగా, సమగ్రంగా అర్థాన్ని అందిస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: దైవ స్వపరిచయంలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; יהוה అనే నిబంధన నామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וְהוֹצֵאתִי
  choice: బయటకు తీసుకొస్తాను
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థక భావాన్ని, నిర్గమన ఇతివృత్తాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: ఐగుప్తీయులు మోపిన భారాల కిందనుండి
  rationale: ‘కిందనుండి’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘ఐగుప్తు భారాలు’ అనే అసహజ తెలుగుకు బదులు భారాలను మోపినవారు ఐగుప్తీయులని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִצַּלְתִּי
  choice: విడిపిస్తాను
  rationale: ఆధిపత్యం మరియు ప్రమాదం నుండి రక్షించి విడుదల చేయడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעֲבֹדָתָם
  choice: వారి బానిసత్వం నుండి
  rationale: עֲבֹדָה సాధారణంగా సేవ లేదా పని కావచ్చుగాని, ఈ సందర్భంలో ఐగుప్తీయుల బలవంతపు దాస్యాన్ని సూచిస్తుంది.
- source_word: וְגָאַלְתִּי
  choice: విమోచిస్తాను
  rationale: గోయేలు సంబంధిత తిరిగి స్వాధీనపరచడం/విడిపించడం అనే భావాన్ని, తెలుగులోని బైబిలు-గంభీరమైన కానీ గ్రాహ్యమైన పదంతో అందిస్తుంది.
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: చాచిన బాహువుతో
  rationale: దేవుని శక్తివంతమైన జోక్యాన్ని సూచించే మానవరూపకాన్ని మూలానికి దగ్గరగా నిలుపుతుంది.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: గొప్ప తీర్పు కార్యాలతో
  rationale: שְׁפָטִים ను కేవలం న్యాయ నిర్ణయాలుగా కాక, ఐగుప్తుపై అమలుచేసే దైవిక తీర్పు చర్యలుగా స్పష్టపరుస్తుంది; ‘గొప్ప తీర్పులతో’ అనే ప్రత్యామ్నాయం కూడా సాధ్యం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించింది. తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి, పండితుల్లో సాధారణమైన ‘యాహ్వే’ ఉచ్చారణను పాదసూచికలో తెలిపింది.
- issue: לִבְנֵי יִשְׂרָאֵל యొక్క సామూహిక పరిధి
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: వ్యాకరణ రూపం పుంలింగ బహువచనమైనా సందర్భంలో నిబంధన సమాజమంతటినీ సూచిస్తుంది. కుటుంబ రూపకాన్ని చెరపకుండా అక్షరార్థాన్ని పాదసూచికలో సంరక్షించింది.
- issue: עֲבֹדָה యొక్క సందర్భార్థం
  choice: బానిసత్వం
  alternative: సేవ / వెట్టిచాకిరి
  rationale: ఇక్కడ తటస్థ సేవను కాక బలవంతపు దాస్యాన్ని సూచిస్తున్నందున అణచివేత వాస్తవాన్ని మృదువుచేయకుండా ‘బానిసత్వం’ ఎంచుకుంది.
- issue: שְׁפָטִים యొక్క భావం
  choice: తీర్పు కార్యాలు
  alternative: తీర్పులు
  rationale: ఈ పదం ఐగుప్తుపై దేవుడు అమలుచేసే న్యాయ చర్యలను సూచించవచ్చు. ‘కార్యాలు’ చేర్చడం అమలైన తీర్పు భావాన్ని తెలుపుతుంది, అయితే మూలంలోని బహువచన నామవాచకానికి దగ్గరైన ‘తీర్పులు’ కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజ వాక్యనిర్మాణం వాడబడింది. ‘బాహువు,’ ‘విమోచిస్తాను’ వంటి పదాలు వాక్య గాంభీర్యాన్ని నిలుపుతాయి కానీ అతిగా ప్రాచీన శైలికి వెళ్లవు. మూలంలోని వరుస దైవ వాగ్దానాలను స్పష్టమైన క్రియలుగా, దైవ స్వపరిచయంలోని ఉద్ఘాటనను ‘నేనే’గా నిలుపుకుంది.
