id: EXO.6.19
reference: Exodus 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/תֹלְדֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: te
  text: మెరారి కుమారులు మహలి, మూషి. ఇవి వారి తరాల ప్రకారం లేవి వంశాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేవీయుని కుటుంబాలు” లేదా “లేవీయుల వంశాలు.” హీబ్రూలో “లేవీయుడు” అనే ఏకవచన రూపం ఇక్కడ లేవి వంశరేఖను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: మెరారి కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మిత బహువచనానికి ‘కుమారులు’ సహజమైన, ఖచ్చితమైన అనువాదం. ఆరంభ וְ జాబితా కొనసాగింపును సూచిస్తుంది; తెలుగులో దాన్ని విడిగా ‘మరియు’ అని పెట్టకుండానే వాక్యక్రమం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: మహలి, మూషి
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; జాబితాలోని సంధిని తెలుగులో విరామచిహ్నంతో సహజంగా చూపించాం.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న వ్యక్తులతో సంబంధం కలిగిన వంశాలను గుర్తించే నిర్దేశక రూపంగా తెలుగులో ‘వీరు’ సహజంగా పనిచేస్తుంది.
- source_word: מִשְׁפְּחֹת
  choice: వంశాలు
  rationale: గోత్ర సంబంధ వంశావళి సందర్భంలో ఈ పదం కుటుంబాలకన్నా విస్తృతమైన బంధుత్వ విభాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంశాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַ/לֵּוִי
  choice: లేవి
  rationale: హీబ్రూలో వ్యాసంతో కూడిన ఏకవచన రూపం సమష్టిగా లేవీయ వంశరేఖను సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో సహజమైన ‘లేవి’ని ఉంచి, రూపంలోని సందిగ్ధతను పాదసూచికలో తెలిపాం.
- source_word: לְ/תֹלְדֹתָם
  choice: తమ తమ తరాల ప్రకారం
  rationale: תּוֹלְדוֹת వంశపరంపరలను లేదా తరాలను సూచిస్తుంది. బహువచన స్వామ్యప్రత్యయాన్ని స్పష్టంగా ఉంచుతూ వంశావళి శైలిని కాపాడుతుంది.
theological_decisions:
- issue: הַלֵּוִי అనే ఏకవచన రూపం వ్యక్తినామమా, సమష్టి వంశసూచకమా
  choice: ప్రధాన పాఠంలో ‘లేవి’
  alternative: ‘లేవీయుని’ లేదా ‘లేవీయుల’
  rationale: సందర్భం లేవి సంతతిలోని వంశాలను సమగ్రంగా పేర్కొంటుంది. ‘లేవి’ తెలుగు పాఠకునికి వంశమూలపురుషుని పేరుగా సహజంగా అర్థమవుతుంది; అయితే హీబ్రూ ఏకవచన రూపంలోని సమష్టి భావాన్ని పాదసూచిక ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. వ్యక్తినామాలను హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం; ‘కుటుంబాలు’ కంటే గోత్ర ఉపవిభాగ భావాన్ని మెరుగ్గా తెలిపే ‘వంశాలు’ను ఎంచుకున్నాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
