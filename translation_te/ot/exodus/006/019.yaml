revisions:
- from: మెరారి కుమారులు మహలి, మూషి. వీరు తమ తమ తరాల ప్రకారం లేవి వంశాలు.[a]
  to: మెరారి కుమారులు మహలి, మూషి. ఇవి వారి తరాల ప్రకారం లేవి వంశాలు.[a]
  rationale: The revision changes the demonstrative to neuter plural so that it correctly identifies “clans,” retains the source’s genealogical formula in natural Telugu, and preserves the lexical ambiguity of הַלֵּוִי in the footnote without forcing an individual-Levite reading.
  reviewer_model: gpt-5.6-terra
