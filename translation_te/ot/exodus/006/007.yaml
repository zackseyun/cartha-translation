base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: te
  text: నేను మిమ్మల్ని నా ప్రజగా చేసుకుంటాను; నేను మీ దేవుడిగా ఉంటాను. ఐగుప్తు భారాల[b] కిందనుండి మిమ్మల్ని బయటికి తీసుకొచ్చే[a] మీ దేవుడైన యహ్వేను నేనే అని మీరు తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయటికి తీసుకొచ్చిన.’ హీబ్రూలో ఇక్కడ కృదంతం ఉంది; అది కొనసాగుతున్న లేదా యహ్వేను విమోచకునిగా గుర్తించే కార్యాన్ని సూచించవచ్చు, లేక వాగ్దానం నెరవేరిన స్థానం నుండి ఆ కార్యాన్ని పూర్తయినదిగా చూపవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఐగుప్తు వెట్టిచాకిరి.’ ఈ హీబ్రూ పదం మోయవలసిన భారాలను లేదా అణచివేసే బలవంతపు శ్రమను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: నేను మిమ్మల్ని నా ప్రజగా చేసుకుంటాను
  rationale: ‘తీసుకుంటాను’ అనే అక్షరార్థ రూపం తెలుగులో ఈ సంబంధార్థంలో అసహజంగా ఉంటుంది. ‘నా ప్రజగా చేసుకుంటాను’ అనేది దేవుడు ఇశ్రాయేలును తనకు చెందిన ప్రజగా స్వీకరించే నిబంధన సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: నేను మీ దేవుడిగా ఉంటాను
  rationale: హీబ్రూ నిబంధన సూత్రంలోని సంబంధార్థాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: וִידַעְתֶּם
  choice: మీరు తెలుసుకుంటారు
  rationale: భవిష్యత్తులో అనుభవం ద్వారా కలిగే గుర్తింపును సూచించగల సాధారణ భవిష్యత్ రూపం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: הַמּוֹצִיא
  choice: బయటికి తీసుకొచ్చే
  rationale: హీబ్రూ కృదంత రూపాన్ని తెలుగు సంబంధ కృదంతంతో ప్రతిబింబించి, కొనసాగుతున్న లేదా యహ్వేను విమోచకునిగా నిర్వచించే కార్యార్థాన్ని నిలుపుతుంది.
- source_word: מִתַּחַת
  choice: కిందనుండి
  rationale: అణచివేతకు లోబడిన స్థితిని చూపించే ‘కిందనుండి’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: סִבְלֹת מִצְרָיִם
  choice: ఐగుప్తు భారాలు
  rationale: సִבְלֹת పదంలోని మోయవలసిన బరువులు మరియు అణచివేసే శ్రమ అనే రెండు భావాలకు చోటిస్తూ, ‘వెట్టిచాకిరి’ అనే సంకుచిత వివరణను ప్రధాన పాఠ్యంలో నిర్బంధించదు.
theological_decisions:
- issue: నిబంధన సూత్రం
  choice: నేను మిమ్మల్ని నా ప్రజగా చేసుకుంటాను; నేను మీ దేవుడిగా ఉంటాను
  alternative: మిమ్మల్ని నాకు ప్రజగా తీసుకుంటాను; మీకు దేవుడనై ఉంటాను
  rationale: దేవుడు–ప్రజల పరస్పర సంబంధాన్ని నిలుపుతూ, తరువాతి ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ పాఠ్యంలోకి చేర్చదు.
- issue: దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న יהוה అనే వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా అందిస్తుంది.
- issue: הַמּוֹצִיא కృదంతపు కాలార్థం
  choice: బయటికి తీసుకొచ్చే
  alternative: బయటికి తీసుకొచ్చిన
  rationale: హీబ్రూ కృదంతం కాలాన్ని పూర్తిగా నిర్దిష్టం చేయదు. ప్రధాన పాఠ్యం దాని లక్షణాత్మక/క్రియాశీల భావాన్ని నిలుపుతుంది; భవిష్యత్ ఫలితస్థానం నుండి పూర్తయిన కార్యంగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. సమాంతర నిబంధన వాక్యాలను స్పష్టంగా ఉంచి, హీబ్రూ కృదంతంలోని నిజమైన కాల అస్పష్టతను పాదసూచికలో భద్రపరచింది.
