source:
  edition: WLC
  text: ה֥וּא אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם הוֹצִ֜יאוּ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: te
  text: “ఇశ్రాయేలు కుమారులను ఐగుప్తు దేశం నుండి వారి వ్యవస్థీకృత గుంపుల ప్రకారం బయటకు తీసుకురండి” అని యాహ్వే[a] ఎవరితో చెప్పాడో, వీరే ఆ అహరోను మోషేలు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే’ అనేది హీబ్రూ దైవనామానికి లిప్యంతరీకరణ; ‘యెహోవా’ అనేది మరో సంప్రదాయ రూపం.
    reason: lexical_alternative
  - marker: b
    text: ‘వీరే ఆ అహరోను మోషేలు’ అనే మాట ముందుగా పేర్కొన్న వారినే నొక్కిచెప్పి గుర్తిస్తోంది. ‘ఇశ్రాయేలు కుమారులు’ సందర్భంలో ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. ‘వారి వ్యవస్థీకృత గుంపుల ప్రకారం’ అనే మాటను ‘వారి దళాల ప్రకారం’ లేదా ‘వారి సమూహాల ప్రకారం’ అని కూడా అర్థం చేసుకోవచ్చు; హీబ్రూ పదం సైనిక శైలిలో ఏర్పాటైన సమూహాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: వారు ఈ అహరోను, మోషేనే
  rationale: ఏకవచన సర్వనామమైన הוּא ఇక్కడ ముందుగా పేర్కొన్న ఇద్దరిని నొక్కిచెప్పి గుర్తిస్తోంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘వారు ఈ ... నే’ అనే రూపం ఆ గుర్తింపు మరియు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֲשֶׁר ... אָמַר ... לָהֶם
  choice: ఎవరితో ... చెప్పాడో
  rationale: సంబంధవాచక అణువు אֲשֶׁר మరియు לָהֶם లోని సంబోధిత సంబంధాన్ని సహజమైన తెలుగు సంబంధ వాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రత్యక్ష నామరూపంతో అందించింది; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- source_word: הוֹצִיאוּ
  choice: బయటికి తీసుకురండి
  rationale: יצא యొక్క హిఫీల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని, అంటే ‘బయటికి వచ్చేలా చేయండి’, సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబసంబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే వ్యక్తీకరణను పారదర్శకంగా నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: ‘దేశం’ అనే మూలపదాన్ని ఉంచుతూ బయలుదేరే స్థలాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: עַל צִבְאֹתָם
  choice: వారి సైన్యాలవారీగా
  rationale: צְבָאוֹת లోని వ్యవస్థీకృత సమూహాలు లేదా సైన్యాలు అనే భావాన్ని, עַל సూచించే విభాగాల ప్రకారమైన బయలుదేరడాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దీనిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తిగత దైవనామంగానే ఉంచాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో వాడి, మరో సాధారణ లిప్యంతరీకరణను పాదటిప్పణిలో ఇచ్చాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క పరిధి
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పితృవంశ సంబంధ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపాం; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుందని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: עַל צִבְאֹתָם యొక్క భావం
  choice: వారి సైన్యాలవారీగా
  alternative: వారి విభాగాలవారీగా
  rationale: ఈ పదంలోని సైనిక లేదా వ్యవస్థీకృత సమూహాల భావాన్ని అణచివేయకుండా ఉంచాం; అయితే ఇక్కడ తప్పనిసరిగా యుద్ధం చేస్తున్న సైన్యాలనే సూచిస్తుందని తేల్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని చివరి గుర్తింపు-ఉద్ఘాటనను తెలుగులో సహజంగా ఉండేందుకు వాక్యాంతంలో ఉంచాం. పేర్లకు తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన ‘అహరోను’, ‘మోషే’, ‘ఇశ్రాయేలు’, ‘ఐగుప్తు’ రూపాలు వాడాం.
