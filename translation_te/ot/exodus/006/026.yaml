revisions:
- from: యెహోవా[a] “ఇశ్రాయేలు కుమారులను ఐగుప్తు దేశం నుండి వారి సైన్యాలవారీగా బయటికి తీసుకురండి” అని ఎవరితో చెప్పాడో, వారు ఈ అహరోను, మోషేనే.[b]
  to: “ఇశ్రాయేలు కుమారులను ఐగుప్తు దేశం నుండి వారి వ్యవస్థీకృత గుంపుల ప్రకారం బయటకు తీసుకురండి” అని యాహ్వే[a] ఎవరితో చెప్పాడో, వీరే ఆ అహరోను మోషేలు.[b]
