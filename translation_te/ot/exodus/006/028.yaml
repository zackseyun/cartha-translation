  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: te
  text: యాహ్వే ఐగుప్తు దేశంలో మోషేతో మాట్లాడిన రోజున ఇలా జరిగింది—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మరియు ఇలా జరిగింది” / “ఇలా సంభవించింది.”'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “YHWH”; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు. “యెహోవా” అనేది మరో లిప్యంతరీకరణ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హయా క్రియ యొక్క వావ్-అనుక్రమ రూపం కథనంలోని మార్పును పరిచయం చేస్తుంది. ‘ఇలా జరిగింది’ దాని కథన విధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని స్పష్టమైన ‘ఇప్పుడు’ను చేర్చదు.
- source_word: בְּיוֹם
  choice: రోజున
  rationale: ‘ఆ రోజున’ అనే కాలార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; తరువాతి ఉపవాక్యం ఏ రోజో వివరిస్తుంది.
- source_word: דִּבֶּר ... אֶל מֹשֶׁה
  choice: మోషేతో మాట్లాడిన
  rationale: דבר తో אֶל కలిసిన నిర్మాణం ‘మోషేతో మాట్లాడాడు’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘మోషేతో మాట్లాడిన’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలోని אֶרֶץ (‘దేశం/భూమి’) పదాన్ని నిలుపుతూ, గౌరవప్రదమైన ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది; పాదటిప్పణి ‘యాహ్వే’ లిప్యంతరీకరణను, సంప్రదాయ ‘ప్రభువు’ ప్రతిరూపాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నట్లు చూపడానికి మూలంలోని విభాగాంత విరామాన్ని అనుసరించి దీర్ఘ గీతను ఉంచాం.
