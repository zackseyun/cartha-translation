translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరాలకు తగిన గౌరవప్రదమైన సరళ శైలిని వాడాం. హీబ్రూ వాక్యంలో ముందరి వచనం నుంచి కొనసాగుతున్న క్రియను తెలుగులో స్పష్టత కోసం ‘చేశాడు’ అని పూరించాం; పదార్థాన్ని అతిగా సాంకేతికీకరించలేదు.
