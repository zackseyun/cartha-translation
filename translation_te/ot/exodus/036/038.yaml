translation:
  language: te
  text: దానికి ఐదు స్తంభాలను, వాటి కొక్కేలను చేశాడు; వాటి పైభాగాలకు, వాటి పట్టీలకు[a] బంగారు పూత పూశాడు. వాటి ఐదు పీఠాలు కంచుతో చేసినవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పట్టీలు” అని అనువదించిన హీబ్రూ పదం స్తంభాలపై ఉండే చుట్టుపట్టీలను లేదా వాటిని అనుసంధానించే భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: దాని ఐదు స్తంభాలు
  rationale: עַמּוּד అనేది నిలువుగా ఉండే ఆధార స్తంభాన్ని సూచిస్తుంది; సందర్భంలోని తెరకు చెందినవిగా ఏకవచన ప్రత్యయ భావాన్ని ‘దాని’ ద్వారా నిలిపాం.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కేలు
  rationale: గుడార నిర్మాణ సందర్భంలో וָו అనేది వస్త్రాన్ని తగిలించడానికి స్తంభాలకు అమర్చిన కొక్కేలను సూచిస్తుంది.
- source_word: וְצִפָּה
  choice: బంగారు పూత పూశాడు
  rationale: צפה అనే క్రియ లోహంతో పైపూత వేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన నిర్మాణ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: רָאשֵׁיהֶם
  choice: వాటి పైభాగాలు
  rationale: అక్షరార్థంగా ‘వాటి తలలు’; ఇక్కడ స్తంభాల పైభాగాలను సూచిస్తుంది. ‘శీర్షాలు’ కంటే ఇది సాధారణ పాఠకులకు స్పష్టం.
- source_word: חֲשֻׁקֵיהֶם
  choice: వాటి పట్టీలు
  rationale: ఈ అరుదైన నిర్మాణ పదం స్తంభాలకు సంబంధించిన చుట్టుపట్టీలు లేదా అనుసంధాన భాగాలను సూచించవచ్చు; ఖచ్చిత రూపాన్ని అతిగా నిర్ధారించకుండా ‘పట్టీలు’ అని ఇచ్చాం.
- source_word: אַדְנֵיהֶם
  choice: వాటి ఐదు దిమ్మలు
  rationale: אֶדֶן స్తంభాన్ని నిలబెట్టే అడుగు ఆధారం లేదా గాడిగల దిమ్మను సూచిస్తుంది; గుడార నిర్మాణ సందర్భంలో ‘దిమ్మలు’ సహజంగా ఉంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన లోహపు ఖచ్చిత మిశ్రమం అనిశ్చితమైనప్పటికీ, పరిశుద్ధ గుడార సందర్భంలో נְחֹשֶׁתకు సంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు పదం ‘కంచు’.
