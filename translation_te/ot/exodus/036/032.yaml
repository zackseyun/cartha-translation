translation:
  language: te
  text: నివాసగుడారం రెండవ వైపు పలకలకు ఐదు అడ్డకమ్మీలు, పడమటి వైపున ఉన్న నివాసగుడారం సుదూర వెనుక భాగపు పలకలకు[a] ఐదు అడ్డకమ్మీలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పడమటి వైపున నివాసగుడారం చివరి భాగంలోని పలకలకు.”
    reason: יַרְכָתַיִם అనే పదం వెనుక భాగాన్ని లేదా చివరి భాగాన్ని సూచించగల స్థలార్థ వైవిధ్యాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: בְרִיחִם
  choice: అడ్డకమ్మీలు
  rationale: నివాసగుడారం పలకలను కలిపి నిలిపే అడ్డంగా అమర్చిన కమ్మీలను సూచిస్తుంది; సాధారణ ‘కమ్మీలు’ కంటే నిర్మాణపరమైన పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קַרְשֵׁי
  choice: పలకలు
  rationale: నివాసగుడారం నిర్మాణంలో ఉపయోగించిన చెక్క నిర్మాణ భాగాలకు సహజమైన, సంప్రదాయబద్ధమైన తెలుగు పదం; ‘చట్రాలు’ అనే పునర్నిర్మాణాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: నివాసగుడారం రెండవ వైపు
  rationale: צֶלַעను ‘వైపు’గా, הַשֵּׁנִיתను దాని అక్షరార్థమైన ‘రెండవ’గా ఉంచి, ముందటి వైపుతో ఉన్న క్రమసంబంధాన్ని కాపాడింది.
- source_word: הַמִּשְׁכָּן
  choice: నివాసగుడారం
  rationale: మూలపదంలోని ‘నివసించడం’ అనే భావాన్ని నిలుపుతూ, నిర్గమకాండంలోని పవిత్ర గుడారాన్ని సహజంగా సూచిస్తుంది.
- source_word: לַיַּרְכָתַיִם
  choice: సుదూర వెనుక భాగంలో
  rationale: ఈ పదంలోని వెనుక భాగం మరియు అంత్యస్థానం/సుదూరత్వం అనే స్థలార్థాలను రెండింటినీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: יָמָּה
  choice: పడమటి దిశలో
  rationale: సముద్రం వైపు అనే మూల దిశార్థం ఈ సందర్భంలో పడమటిని సూచిస్తుంది; తెలుగు పాఠకులకు స్పష్టమైన దిశాపదాన్ని వాడింది.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: ఐదు ... ఐదు
  rationale: రెండు నిర్మాణ విభాగాలకు సంబంధించిన సమాంతర గణనను యథాతథంగా నిలుపుతుంది.
