  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: te
  text: ఆ పని చేస్తున్నవారిలో నైపుణ్యం గల పనివారందరూ[a] నివాసమందిరం కోసం పది తెరలను తయారుచేశారు. వాటిని పేనిన సన్నని నారనూలుతో, నీలం, ఊదా, క్రిమ్సన్ రంగు నూలుతో తయారుచేశారు; కళాత్మక రూపకల్పనతో చేసిన కెరూబులతో అతడు వాటిని చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘హృదయ జ్ఞానులు’; ఇది నైపుణ్యం గల శిల్పులను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనం బహువచన కర్తతో మొదలైనా, హీబ్రూ పాఠం చివర ‘అతడు వాటిని చేశాడు’ అనే ఏకవచన క్రియ ఉంది. కొన్ని అనువాదాలు దీనిని ‘వారు చేశారు’ అని సవరించి అనువదిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: నైపుణ్యం గల పనివారు
  rationale: అక్షరార్థంగా ‘హృదయ జ్ఞానులు’; ఈ సందర్భంలో చేతిపనిలో నేర్పుగల శిల్పులను సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో వృత్తి నైపుణ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: ఆ పని చేస్తున్నవారిలో
  rationale: పనిలో నిమగ్నమైన సమూహంలో వీరు భాగమనే בְּ భావాన్ని నిలుపుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: దేవుడు తన ప్రజల మధ్య నివసించే పవిత్ర గుడార నిర్మాణాన్ని సూచిస్తుంది; కేవలం సాధారణ నివాస స్థలమనే భావం రాకుండా ‘మందిరం’ను జోడించింది.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: నివాసమందిర నిర్మాణంలో ఉపయోగించిన పెద్ద వస్త్రపు భాగాలకు సహజమైన తెలుగు పదం.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: పేనిన సన్నని నారనూలు
  rationale: నాణ్యమైన నారనూలు పేని లేదా మెలిపెట్టి సిద్ధం చేసిన వస్త్ర పదార్థమనే వివరాన్ని నిలుపుతుంది.
- source_word: תְכֵלֶת
  choice: నీలం నూలు
  rationale: ప్రతిష్ఠాత్మక నీలిరంగు అద్దిన నూలు లేదా వస్త్ర పదార్థాన్ని సూచిస్తుంది; వాక్యంలో ‘నూలు’ సమష్టిగా వర్తిస్తుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా నూలు
  rationale: నివాసమందిర వస్త్రాల సందర్భంలో ప్రామాణికమైన ఊదారంగు పదార్థాన్ని సూచిస్తుంది.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: స్కార్లెట్ రంగు అద్దిన నూలును సాధారణ ఆధునిక తెలుగు పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּרֻבִים
  choice: కెరూబుల ఆకృతులు
  rationale: ఆ వస్త్రాలపై రూపొందించిన కెరూబులను సూచించేందుకు స్థిరమైన బైబిలు పదాన్ని ఉంచి, వస్త్ర నమూనా భావాన్ని ‘ఆకృతులు’తో స్పష్టం చేసింది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యం గల రూపకర్త పనితనంతో
  rationale: కళాత్మక ప్రణాళికతో చేసిన నిపుణమైన నేత లేదా రూపకల్పన పనిని సూచిస్తుంది; ‘ఎంబ్రాయిడరీ’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: עָשָׂה אֹתָם
  choice: వాటిమీద ... అతడు చేశాడు
  rationale: వచనం చివర ఉన్న ఏకవచన క్రియను బహువచనంగా సవరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: חֲכַם לֵב లోని వ్యాకరణపరమైన పుంలింగ ఏకవచనాన్ని సామూహిక సందర్భంలో ఎలా వ్యక్తపరచాలి
  choice: నైపుణ్యం గల పనివారందరూ
  alternative: నైపుణ్యం గల ప్రతి పనివాడూ
  rationale: హీబ్రూలో ‘ప్రతి/సమస్త నైపుణ్యంగలవాడు’ అనే పంపిణీ భావం ఉన్నా, ఆరంభ క్రియ బహువచనంలో ఉంది. తెలుగులో సహజమైన సామూహిక బహువచనం ఆ భావాన్ని తెలియజేస్తుంది; లింగాన్ని సిద్ధాంతపరంగా విస్తరించదు.
- issue: వచనం చివర ఏకవచన క్రియ, ఆరంభంలో బహువచన కర్త మధ్య ఉన్న ఉద్రిక్తత
  choice: అతడు చేశాడు
  alternative: వారు చేశారు
  rationale: మసొరెటిక్ పాఠంలోని ఏకవచనాన్ని సమన్వయపరచి తొలగించకుండా నిలిపి, పాఠ్య అసమానతను పాదటిప్పణిలో వెల్లడించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వస్త్రనిర్మాణ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, హీబ్రూ వాక్యంలోని చివరి ఏకవచన క్రియను ఉద్దేశపూర్వకంగా నిలిపింది.
