revisions:
- from: ఆ పని చేస్తున్నవారిలో నైపుణ్యం గల పనివారందరూ[a] పది తెరలతో నివాసమందిరాన్ని తయారుచేశారు. ఆ తెరలను పేనిన సన్నని నారనూలుతోను, నీలం, ఊదా, ఎర్రని నూలుతోను తయారుచేశారు; నైపుణ్యం గల రూపకర్త పనితనంతో వాటిమీద కెరూబుల ఆకృతులను అతడు చేశాడు[b].
  to: ఆ పని చేస్తున్నవారిలో నైపుణ్యం గల పనివారందరూ[a] నివాసమందిరం కోసం పది తెరలను తయారుచేశారు. వాటిని పేనిన సన్నని నారనూలుతో, నీలం, ఊదా, క్రిమ్సన్ రంగు నూలుతో తయారుచేశారు; కళాత్మక రూపకల్పనతో చేసిన కెరూబులతో అతడు వాటిని చేశాడు[b].
  rationale: The revision directly presents the ten curtains as the items made for the tabernacle, removes the unintended repetition, and makes ‘the curtains’ the object of the Hebrew’s final singular verb. It retains the textual singular explicitly and preserves the explanatory footnote. The material list and cherubim are expressed as features of the curtains’ artistic workmanship.
