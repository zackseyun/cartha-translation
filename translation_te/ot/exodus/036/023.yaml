id: EXO.36.23
reference: Exodus 36:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קְרָשִׁ֔ים לִ/פְאַ֖ת נֶ֥גֶב תֵּימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: te
  text: 'అతడు నివాసమందిరం కోసం చట్రాలను చేశాడు: దక్షిణపు ప్రక్కకు, దక్షిణ దిశవైపు ఇరవై చట్రాలను చేశాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దక్షిణపు ప్రక్కకు, దక్షిణ దిశవైపు ఇరవై పలకలను.” హీబ్రూలో దక్షిణ దిశను సూచించే రెండు పదాలు కలిసి వచ్చాయి; అవి నొక్కిచెప్పడానికి లేదా దిశను మరింత నిర్దిష్టంగా తెలియజేయడానికి కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: עשה అనే క్రియ యొక్క Qal wayyiqtol రూపం కథనంలోని గత కార్యాన్ని సూచిస్తుంది; సందర్భం ప్రకారం కర్త ఏకవచనంలో ఉన్నాడు.
- source_word: הַקְּרָשִׁים
  choice: చట్రాలను
  rationale: కֶרֶשׁ ఇక్కడ నివాసమందిర నిర్మాణంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది. ‘చట్రాలు’ వాటి నిర్మాణపరమైన పనిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘పలకలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַמִּשְׁכָּן
  choice: నివాసమందిరం కోసం
  rationale: מִשְׁכָּן నిర్గమకాండలో పరిశుద్ధ నివాస నిర్మాణానికి వాడే స్థిరపదం. ‘నివాసమందిరం’ దాని నివాస భావాన్నీ, ఆరాధనా నిర్మాణ సందర్భాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: ఇరవై చట్రాలను
  rationale: సంఖ్యతో పాటు నామవాచకాన్ని పునరుక్తి చేయడం ద్వారా హీబ్రూ జాబితా శైలిని నిలిపాం.
- source_word: לִפְאַת
  choice: వైపున
  rationale: פֵּאָה ఇక్కడ నిర్మాణపు పక్కను లేదా దిశవైపును సూచిస్తుంది; తెలుగులో ‘వైపున’ ఈ సందర్భానికి సహజం.
- source_word: נֶגֶב
  choice: దక్షిణం
  rationale: ఇక్కడ נֶגֶב ‘నెగెవు’ అనే ప్రాంతనామంగా కాక దిక్సూచకంగా వాడబడింది.
- source_word: תֵּימָנָה
  choice: దక్షిణ దిశగా
  rationale: ఈ దిశాసూచక రూపం ముందున్న נֶגֶב భావాన్ని మళ్లీ నొక్కి చెబుతుంది. ‘దక్షిణ దిశగా’ అని అనువదించడం ఆ పునరుక్తిని పూర్తిగా తొలగించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరాల జాబితా శైలిని నిలుపుతూ అనువదించాం. ‘నివాసమందిరం’ మరియు ‘చట్రాలు’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద పదాలు. హీబ్రూలోని దక్షిణ దిశ పునరుక్తిని ప్రధాన వచనంలో సహజంగా నిలిపి, దాని భావసంభావ్యతను పాదసూచికలో వివరించాం.
