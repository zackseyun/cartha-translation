  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూల హీబ్రూలోని ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా నిలిపాం; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
