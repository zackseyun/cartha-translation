  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
translation:
  language: te
  text: 'వాటి నలభై వెండి పీఠాలు: ఒక పలక కింద రెండు పీఠాలు, ఒక పలక కింద రెండు పీఠాలు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక చట్రం కింద రెండు పీఠాలు, ఒక చట్రం కింద రెండు పీఠాలు.” హీబ్రూ రెండు భాగాల్లోనూ ఒకే విధంగా “ఒక పలక/చట్రం” అని పునరుక్తి చేస్తుంది; రెండవదాన్ని “మరొక పలక” అని చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: నలభై
  rationale: సంఖ్యను నేరుగా అనువదించాం; వాక్యారంభంలోని וְ మునుపటి నిర్మాణ జాబితా కొనసాగింపును సూచిస్తుంది, తెలుగులో సందర్భానుసారంగా ప్రత్యేకంగా ‘మరియు’ అనకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: אַדְנֵי/הֶם
  choice: వాటి ... పీఠాలు
  rationale: గుడారపు పలకలను నిలబెట్టే ఆధార భాగాలను సూచించే אֲדָנִיםకు ఆధునిక తెలుగులో స్పష్టమైన నిర్మాణపదంగా ‘పీఠాలు’ ఎంచుకున్నాం; సర్వనామ ప్రత్యయం ‘వాటి’గా నిలిపాం.
- source_word: כָּסֶף
  choice: వెండి
  rationale: పీఠాలు తయారైన పదార్థాన్ని సూచించే నామవాచకాన్ని తెలుగులో సహజమైన విశేషణప్రయోగంగా ‘వెండి పీఠాలు’ అని ఇచ్చాం.
- source_word: שְׁנֵי אֲדָנִים
  choice: రెండు పీఠాలు
  rationale: ముందటి పద ఎంపికతో ఏకరీతిని కాపాడుతూ సంఖ్యతో కూడిన పదబంధాన్ని నేరుగా అనువదించాం.
- source_word: תַּחַת
  choice: కింద
  rationale: ప్రతి పలకకు దిగువన పీఠాల అమరికను సూచించే సహజమైన ఆధునిక తెలుగు స్థలసూచక పదం.
- source_word: הַ/קֶּרֶשׁ
  choice: పలక
  rationale: కֶרֶשׁ గుడారపు నిలువు నిర్మాణ భాగాన్ని సూచిస్తుంది. ‘పలక’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ‘చట్రం’ కంటే మూలంలోని ఘన నిర్మాణ భాగ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: הָ/אֶחָד
  choice: ఒక
  rationale: రెండు చోట్లా మూలంలోని ‘ఆ ఒకటి’ అనే పునరుక్తిని తెలుగులో సహజంగా ‘ఒక పలక’గా నిలిపాం; రెండవదాన్ని ‘మరొక పలక’గా మార్చి మూలంలో లేని వ్యత్యాసాన్ని చేర్చలేదు.
