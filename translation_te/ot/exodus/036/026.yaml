  naturalness: '‘వాటి నలభై వెండి పీఠాలు: ఒక పలక కింద రెండు పీఠాలు, ఒక పలక కింద రెండు పీఠాలు’ అనేది నిర్మాణ-జాబితా సందర్భానికి సరిపోయే సంక్షిప్త, ఆధునిక ప్రామాణిక తెలుగు. పునరుక్తి తెలుగులో కొంత భారంగా ఉన్నా, ఇది ఉద్దేశపూర్వక మూల-పునరుక్తిని కాపాడుతుంది.'
