  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: te
  text: గుడారపు రెండవ వైపుకోసం, ఉత్తర దిక్కువైపు, అతడు ఇరవై పలకలను[a] తయారుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రాలను.’ ఈ హీబ్రూ పదం నిర్మాణ పలకలను లేదా చట్రాలను సూచించవచ్చు; గుడారంలోని ఈ భాగాల కచ్చితమైన ఆకృతి వివాదాస్పదంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: వైపున
  rationale: గుడార నిర్మాణ సందర్భంలో צֶלַע శరీరంలోని ‘పక్కటెముక’ను కాక, నిర్మాణపు ‘వైపు’ను సూచిస్తుంది. ఉపసర్గల భావం తెలుగులో విభక్తితో సహజంగా వ్యక్తమవుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు
  rationale: మִשְׁכָּן అరణ్యంలోని పవిత్ర నివాస గుడారాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘మందిరం’ ఈ ప్రత్యేక ఆరాధనా నిర్మాణాన్ని గౌరవప్రదంగా, సులభంగా తెలియజేస్తుంది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: ఇది వరుసలో దానికి సరిపోలే రెండవ వైపును స్పష్టంగా సూచిస్తుంది; ‘మరో’ కంటే ‘రెండవ’ మూలపాఠానికి దగ్గరగా ఉంది.
- source_word: לִפְאַת צָפוֹן
  choice: అంటే ఉత్తరం వైపున
  rationale: పֵאָה ఇక్కడ వైపు లేదా దిశను, צָפוֹן ఉత్తరాన్ని సూచిస్తాయి. ‘అంటే’ అనే అనుసంధానం రెండవ వైపు ఏదో సహజంగా స్పష్టం చేస్తుంది.
- source_word: עָשָׂה
  choice: అతడు ... చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను నిర్మాణ నివేదికలో సరళంగా ‘చేశాడు’ అని అందించాం.
- source_word: עֶשְׂרִים
  choice: ఇరవై
  rationale: మూలంలోని సంఖ్యకు నేరమైన తెలుగు సమానం.
- source_word: קְרָשִׁים
  choice: పలకలను
  rationale: కְרָשִׁים మందిరపు నిర్మాణ భాగాలను సూచిస్తుంది. ‘పలకలు’ సాధారణ పాఠకులకు స్పష్టమైన సంప్రదాయ పదం; అవి ఘన పలకలా లేక చట్రాలా అన్నది అనిశ్చితంగా ఉన్నందున ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
