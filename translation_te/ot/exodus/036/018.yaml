  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణం వాడబడింది. మూలంలోని ‘గుడారం’ అనే ప్రత్యక్ష పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారమైన ‘నివాసమందిరం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
