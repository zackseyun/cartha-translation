source:
  edition: WLC
  text: וַ/יְחַבֵּר֙ אֶת חֲמֵ֣שׁ הַ/יְרִיעֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת וְ/חָמֵ֤שׁ יְרִיעֹת֙ חִבַּ֔ר אַחַ֖ת אֶל אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/010.yaml
  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: te
  text: అతడు ఐదు తెరలను ఒకదానితో ఒకటి కలిపాడు; మిగిలిన ఐదు తెరలను కూడా ఒకదానితో ఒకటి కలిపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో రెండవ భాగం అక్షరార్థంగా, “మరియు ఐదు తెరలను ఒకదానితో ఒకటి కలిపాడు” అని ఉంది. ఇది రెండవ ఐదు తెరల సమూహమని స్పష్టం చేయడానికి “మిగిలిన” అనే మాట చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: కలిపాడు
  rationale: חבר అంటే కలపడం లేదా అనుసంధానించడం. గుడార నిర్మాణ సందర్భంలో కలిపాడు సహజమైన ఆధునిక తెలుగు; కలిపిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: గుడార సందర్భంలో ఈ పదం పెద్ద వస్త్రపు తెరలను సూచిస్తుంది. తెరలు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, సందర్భోచితమైన పదం.
- source_word: חֲמֵשׁ
  choice: ఐదు
  rationale: మూలంలోని సంఖ్యను నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אַחַת אֶל אֶחָת
  choice: ఒకదానితో ఒకటి
  rationale: ప్రతి సమూహంలోని తెరలను పరస్పరం కలిపిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: మిగిలిన ఐదు తెరలను కూడా
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మరియు ఐదు తెరలు’ అని ఉంది. సమాంతర నిర్మాణం రెండవ ఐదు తెరల సమూహాన్ని సూచిస్తున్నందున, తెలుగులో స్పష్టత కోసం ‘మిగిలిన’ మరియు సమాంతరత కోసం ‘కూడా’ వాడబడ్డాయి.
