translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పునరుక్తి, సమాంతరత నిలిచేలా రెండు భాగాల్లోనూ ‘ఒకదానితో ఒకటి కలిపాడు’ ఉంచాం.
