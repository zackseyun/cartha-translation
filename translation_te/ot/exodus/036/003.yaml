source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: te
  text: వారు మోషే సమక్షం నుండి[a] పవిత్రస్థల సేవా పనిని చేయడానికి ఇశ్రాయేలు ప్రజలు[b] తీసుకొచ్చిన విరాళమంతటినీ తీసుకున్నారు. ఇశ్రాయేలు ప్రజలు ఇంకా స్వచ్ఛంద కానుకలను ఆయన దగ్గరికి ప్రతి ఉదయం[c] తీసుకొస్తూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే ఎదుటి నుండి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు.” ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సామూహిక ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, “ఉదయం ఉదయం,” అంటే ఉదయం తర్వాత ఉదయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח అనే క్రియ యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, పనివారు మోషే వద్దనున్న సామగ్రిని తీసుకున్నారనే సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: మోషే ఎదుటనుంచి
  rationale: ‘మోషే ఎదుటి నుంచి/సమక్షం నుంచి’ అనే హీబ్రూ స్థానచిత్రాన్ని నిలుపుతుంది; ఆయన ఆధీనంలో ఉన్న విరాళాలను పనివారు తీసుకున్నారనే భావం సందర్భంలో స్పష్టమవుతుంది.
- source_word: הַתְּרוּמָה
  choice: విరాళం
  rationale: గుడార నిర్మాణం కోసం ప్రజలు సమర్పించిన వస్తుసామగ్రి ఇక్కడ ఉద్దేశం; అందువల్ల బలిని సూచించే పదం కంటే ‘విరాళం’ సహజమూ స్పష్టమూ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే సంప్రదాయ సామూహిక ప్రయోగం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ ఆ అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: పవిత్రస్థల సేవా పని
  rationale: ‘పని,’ ‘సేవ,’ ‘పవిత్రస్థలం’ అనే హీబ్రూ భావాంశాలను కాపాడుతూ, తెలుగులో భారంగా కాకుండా ఒక సహజ పదబంధంగా అమర్చింది.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: పనిని నిర్వహించడానికి
  rationale: స్త్రీలింగ ప్రత్యయం ముందున్న పని/కార్యాన్ని సూచిస్తుందని సందర్భం తెలియజేస్తుంది. ‘నిర్వహించడానికి’ అనేది עשה యొక్క ‘చేయడం/నెరవేర్చడం’ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְהֵם הֵבִיאוּ
  choice: ఇశ్రాయేలు ప్రజలైతే … ఇంకా తీసుకొస్తూనే ఉన్నారు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘ప్రజలైతే’ ద్వారా, సందర్భంలోని కొనసాగుతున్న చర్యను ‘ఇంకా తీసుకొస్తూనే ఉన్నారు’ ద్వారా వ్యక్తం చేసింది; హీబ్రూ వావ్‌కు అనవసరంగా కఠినమైన వ్యతిరేకార్థం మోపలేదు.
- source_word: אֵלָיו
  choice: ఆయన దగ్గరికి
  rationale: సర్వనామం సహజంగా మోషేను సూచిస్తుంది. తెలుగులో ‘ఆయన దగ్గరికి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద కానుకలు
  rationale: ఈ పదం స్వచ్ఛందంగా ఇచ్చే అర్పణలను సూచిస్తుంది. కొనసాగుతున్న పలుమార్ల సమర్పణను తెలుగులో సహజంగా చూపేందుకు బహువచనం వాడబడింది.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ప్రతి ఉదయం
  rationale: పదబంధంలోని పునరుక్తి క్రమంగా మళ్లీ మళ్లీ జరిగే చర్యను సూచిస్తుంది; ‘ప్రతి ఉదయం’ ఆధునిక తెలుగులో అదే భావాన్ని సహజంగా అందిస్తుంది.
