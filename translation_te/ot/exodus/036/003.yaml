translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘పని–సేవ–పవిత్రస్థలం’ భావసంబంధాన్ని నిలుపుతూ అతిగా అక్షరానువాదంగా మారకుండా చూసింది. రెండో వాక్యంలో స్వతంత్ర సర్వనామ ఉద్ఘాటనను ‘ప్రజలైతే’ ద్వారా, చర్య కొనసాగింపును ‘ఇంకా తీసుకొస్తూనే ఉన్నారు’ ద్వారా వ్యక్తం చేసింది.
