  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל בְּצַלְאֵ֘ל וְ/אֶל אָֽהֳלִיאָב֒ וְ/אֶל֙ כָּל אִ֣ישׁ חֲכַם לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה חָכְמָ֖ה בְּ/לִבּ֑/וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣/וֹ לִבּ֔/וֹ לְ/קָרְבָ֥ה אֶל הַ/מְּלָאכָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: te
  text: అప్పుడు మోషే బెసలేలును, ఒహోలీయాబును, యాహ్వే తమ హృదయాల్లో జ్ఞానాన్ని ఉంచిన జ్ఞాన హృదయం గల ప్రతి వ్యక్తినీ[a]—ఆ పనివద్దకు వచ్చి దానిని చేయడానికి తమ హృదయం వారిని ప్రేరేపించిన ప్రతి ఒక్కరినీ[b]—పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘జ్ఞాన హృదయం గలవాడు’; ఈ సందర్భంలో జ్ఞానం, పనినైపుణ్యం కలవాడు అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ హృదయం వారిని ప్రేరేపించిన’ అనే హీబ్రూ నుడికారం అంతరంగ సిద్ధతను లేదా స్వచ్ఛంద ప్రేరణను సూచిస్తుంది. ‘హృదయం వారిని కదిలించిన’ లేదా ‘హృదయం వారిని పైకెత్తిన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא אל ఇక్కడ ఒక పనికి వ్యక్తులను పిలవడం లేదా రప్పించడం అనే భావాన్ని ఇస్తుంది; ‘పిలిచాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: బెసలేలు, ఒహోలీయాబులను
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, తెలుగు కర్మవిభక్తితో అందించాం.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: జ్ఞానహృదయులందరినీ
  rationale: ‘హృదయజ్ఞాని’ అనే హీబ్రూ రూపకాన్ని కాపాడుతూ, సందర్భంలో ఉన్న జ్ఞానం మరియు నైపుణ్యం రెండింటికీ చోటిచ్చే సంక్షిప్త రూపం.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: హృదయంలో యెహోవా జ్ఞానాన్ని ఉంచిన
  rationale: జ్ఞానం దేవుడు అనుగ్రహించినదనే భావాన్నీ, హీబ్రూలోని ‘హృదయం’ రూపకాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించాం.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: హృదయం ప్రేరేపించిన ప్రతి ఒక్కరినీ
  rationale: נשא + לב అనే నుడికారం అంతరంగ సిద్ధత, పురికొల్పు లేదా స్వచ్ఛంద ఉత్సాహాన్ని సూచిస్తుంది; ‘ప్రేరేపించిన’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: ఆ పని చేయడానికి దాని దగ్గరకు రావాలని
  rationale: קרב యొక్క ‘దగ్గరకు రావడం’ అనే చిత్రాన్ని నిలుపుతూ, מלאכהను సందర్భానుసారంగా ‘పని’గా అనువదించాం.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: ఆ పని చేయడానికి
  rationale: స్త్రీలింగ ప్రత్యయం מלאכהను సూచిస్తుంది; తెలుగులో పునరుక్తి లేకుండా లక్ష్యాన్ని స్పష్టంగా తెలిపే సహజ నిర్మాణం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ఆధునిక ప్రామాణిక తెలుగులో పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: חֲכַם לֵב లో జ్ఞానం మరియు వృత్తినైపుణ్యం
  choice: జ్ఞానహృదయులు
  alternative: నైపుణ్యంగలవారు
  rationale: సందర్భం శిల్పనైపుణ్యాన్ని సూచించినా, మూలపాఠం ‘హృదయం’ మరియు ‘జ్ఞానం’ అనే భాషను ఉద్దేశపూర్వకంగా వాడుతుంది. అందువల్ల దాన్ని కేవలం సాంకేతిక నైపుణ్యంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘హృదయం’ రూపకాలను సాధ్యమైనంతవరకు నిలిపి, ద్వితీయ వివరణను విరామచిహ్నాలతో స్పష్టంచేశాం.
