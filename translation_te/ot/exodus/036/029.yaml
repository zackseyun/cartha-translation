  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: te
  text: అవి కింది భాగంలో ఒకదానికొకటి జతగా ఉండి[a], పై కొన వరకు, ఒక్క ఉంగరం వరకు, రెండూ కలిసి సంపూర్ణంగా ఉండేవి[b]. రెండు మూలల కోసం ఉన్న ఆ రెండింటినీ అతడు అలాగే చేశాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కింది భాగంలో ఒకదానికొకటి సరిపోయేలా.’ హెబ్రీయ పదం ఆ రెండు భాగాలు నిర్మాణపరంగా పరస్పరం సరిపోవడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పై కొన వరకు రెండూ కలిసి పూర్తిగా ఉండేవి.’ ఇక్కడి పదం ‘సంపూర్ణమైనవి’ లేదా ‘పూర్తిగా ఉన్నవి’ అనే భావాన్ని ఇస్తుంది; నిర్మాణ సందర్భంలో అవి కింది నుంచి పైవరకు పూర్తిగా సరిపోయి ఉన్నాయని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మూలల్లోని రెండు పలకలను.’ హెబ్రీయ పాఠం అక్షరార్థంగా ‘రెండు మూలల కోసం’ అని చెబుతుంది; సందర్భంలో ఇది మూల పలకలను లేదా చట్రాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: ఒకదానికొకటి జతగా
  rationale: ఈ పదం రెండు నిర్మాణ భాగాలు పరస్పరం సరిపోయే జతగా ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో నిర్మాణ సంబంధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִלְּמַטָּה
  choice: కింది భాగంలో
  rationale: జత చేయడం ఎక్కడ జరిగిందో తెలిపే స్థానార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַחְדָּו
  choice: రెండూ కలిసి
  rationale: మూలంలోని ‘కలిసి’ అనే ఉద్ఘాటనను నిలుపుతూ, దేనిని సూచిస్తుందో తెలుగులో స్పష్టం చేస్తుంది.
- source_word: תַמִּים
  choice: సంపూర్ణంగా కలిశాయి
  rationale: ఇక్కడ నిర్మాణ భాగాలు పైవరకు పూర్తిగా కలిపి ముగించబడ్డాయనే సందర్భార్థాన్ని ఇస్తుంది; ‘సంపూర్ణం’ అనే మూలభావాన్నీ నిలుపుతుంది.
- source_word: אֶל רֹאשׁוֹ
  choice: పైకొన వరకు
  rationale: కింది భాగం నుంచి పై అంచు దాకా ఉన్న నిర్మాణ విస్తారాన్ని, אֶל లోని దిశ/హద్దు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: ఒకే ఉంగరం దగ్గర
  rationale: ‘ఆ ఒక్క ఉంగరం’ అనే హెబ్రీయ పదబంధాన్ని అధిక వ్యాఖ్యానం లేకుండా తెలుగులో సహజంగా అందిస్తుంది; ‘మొదటి ఉంగరం’ అని అర్థాన్ని నిర్ణయించదు.
- source_word: כֵּן עָשָׂה
  choice: అతడు అలాగే చేశాడు
  rationale: ముందు వివరించిన నిర్మాణ విధానాన్ని సంక్షిప్తంగా తిరిగి సూచించే హెబ్రీయ వాక్యరూపాన్ని నిలుపుతుంది.
- source_word: לִשְׁנֵיהֶם
  choice: ఆ రెండింటినీ
  rationale: రెండు సంబంధిత నిర్మాణ భాగాలను సహజమైన తెలుగు సర్వనామంతో సూచిస్తుంది.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: రెండు మూలల కోసం
  rationale: మూలపాఠంలోని ‘రెండు మూలలు’ అనే పదప్రయోగాన్ని నిలుపుతూ వాటి నిర్మాణ ప్రయోజనాన్ని తెలుగులో తెలియజేస్తుంది.
