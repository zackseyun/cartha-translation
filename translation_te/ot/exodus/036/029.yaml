translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వివరణను ఉపయోగించాం. ‘పైకొన వరకు’ అనే రూపంతో మూలంలోని దిశార్థాన్ని నిలిపాం; ‘సంపూర్ణంగా కలిశాయి’ ద్వారా תַמִּים పదంలోని సంపూర్ణత మరియు నిర్మాణ కలయిక రెండింటినీ వ్యక్తం చేశాం. అస్పష్టమైన ‘మూలలు/మూల పలకలు’ భావాన్ని ప్రధాన పాఠంలో నిర్ణయాత్మకంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
