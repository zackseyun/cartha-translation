  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: te
  text: అతడు కలిపిన తెరల మొదటి సమూహం చివరనున్న మొదటి తెర అంచున నీలి నూలుతో ఉచ్చులు చేశాడు[a]. అలాగే రెండవ కలిపిన తెరల సమూహం చివరనున్న తెర అంచున అటువంటి ఉచ్చులనే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలయిక దగ్గర” లేదా “కలిపిన అమరికలో.” హీబ్రూ పదం తెరలు కలిసే స్థలాన్ని లేదా వాటిని కలిపిన అమరికను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: ఉచ్చులు
  rationale: తెరలను ఒకదానితో ఒకటి బిగించడానికి ఉపయోగించే వస్త్రపు లూపులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉచ్చులు’ సహజమైన, స్పష్టమైన పదం.
- source_word: תְּכֵלֶת
  choice: నీలి నూలు
  rationale: ఇక్కడ కేవలం రంగు కాక, ఆ రంగుతో అద్దిన వస్త్రపు నూలు ఉద్దేశించబడింది.
- source_word: שְׂפַת הַיְרִיעָה
  choice: తెర అంచు
  rationale: శబ్దార్థమైన ‘పెదవి’ కంటే నిర్మాణ సందర్భంలో ‘అంచు’ సహజంగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: הָאֶחָת
  choice: మొదటి
  rationale: అక్షరార్థంగా ‘ఒకటి’ అయినా, తరువాతి ‘రెండవ’ సమూహంతో ఉన్న వ్యత్యాసం వల్ల ఇక్కడ క్రమసంఖ్య భావం ఉంది.
- source_word: מִקָּצָה
  choice: చివర ఉన్న
  rationale: ఉచ్చులు కలయిక జరిగే చివరి తెర అంచుపై ఉన్నాయని స్థలార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בַּמַּחְבָּרֶת
  choice: కలిపిన సమూహం
  rationale: ఈ పదం తెరలు కలిపిన అమరికను లేదా కలయికను సూచిస్తుంది; సందర్భంలో తెరల సమూహం భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַקִּיצוֹנָה
  choice: చివరి
  rationale: సమూహం చివరన ఉన్న తెరను సూచిస్తుంది; ‘చివరి’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: כֵּן עָשָׂה
  choice: అలాగే ... కూడా చేశాడు
  rationale: రెండవ సమూహంలోనూ అదే చర్యను చేసిన సమాంతర భావాన్ని సహజంగా నిలుపుతుంది.
