  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: te
  text: ఆ సామగ్రి చేయవలసిన పని అంతటికీ సరిపోయింది; ఇంకా మిగిలింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవసరమైన దానికంటే ఎక్కువగా ఉంది.” హెబ్రీ క్రియ అవసరానికి మించిన సామగ్రి మిగిలిందనే భావాన్ని తెలియజేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: ఆ సామగ్రి
  rationale: מְלָאכָה సాధారణంగా ‘పని’ అని అర్థమిచ్చినా, ఇక్కడ ప్రజలు తెచ్చిన వస్తువుల గురించి సందర్భం చెబుతోంది. అందువల్ల మొదటి ప్రయోగాన్ని సహజంగా ‘సామగ్రి’ అని అనువదించాం.
- source_word: הָיְתָה דַיָּם
  choice: సరిపోయింది
  rationale: דַּי sufficiencyని సూచిస్తుంది; బహువచన ప్రత్యయం తెచ్చిన సామగ్రికి తిరిగి సూచిస్తుంది. తెలుగులో ‘సరిపోయింది’ ఈ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לְכָל הַמְּלָאכָה
  choice: పని అంతటినీ
  rationale: ఇక్కడ מְלָאכָה చేయవలసిన మొత్తం పనిని సూచిస్తుంది. ‘పని అంతటినీ’ అనే ప్రయోగం כָּל యొక్క సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: చేయడానికి
  rationale: עשה యొక్క క్రియార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కర్మగా ముందున్న ‘పని అంతటినీ’ స్పష్టంగా ఉన్నందున ప్రత్యేక సర్వనామం అవసరం లేదు.
- source_word: וְהוֹתֵר
  choice: ఇంకా మిగిలింది
  rationale: יתר హిఫీల్ రూపం అవసరానికి మించినది మిగలడాన్ని లేదా అధికంగా ఉండడాన్ని సూచిస్తుంది. ‘ఇంకా మిగిలింది’ మూలంలోని మిగులు భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఒకే హెబ్రీ నామవాచకం సందర్భానుసారం మొదట ‘సామగ్రి’గా, తరువాత ‘పని’గా అనువదించబడింది.
