translation:
  language: te
  text: అతడు నివాసగుడారం కోసం తుమ్మచెక్కతో[a] నిటారుగా నిలిచే పలకలను చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాసగుడారం కోసం నిటారుగా నిలిచే తుమ్మచెక్క పలకలను.”
    reason: హెబ్రీ పదబంధంలోని కలప మరియు నిలువు-అమరిక వివరణల అనుసంధానానికి పదక్రమ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపించే సాధారణ భూతకాల చర్యను సూచిస్తుంది. కర్త సందర్భం ద్వారా తెలిసే ఏకవచన పుంలింగంగా ఉంది.
- source_word: הַקְּרָשִׁים
  choice: పలకలను
  rationale: కֶרֶשׁ ఇక్కడ మందసం నిర్మాణానికి ఉపయోగించిన నిలువు నిర్మాణ పలకలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పలకలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לַמִּשְׁכָּן
  choice: మందసం కోసం
  rationale: מִשְׁכָּן నిర్గమకాండంలో దేవుని పవిత్ర నివాస నిర్మాణానికి స్థిరమైన పదం. తెలుగు బైబిలు వాడుకలో ‘మందసం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఈ నిర్మాణ పదబంధం అకేషియా జాతి కలపను సూచిస్తుంది. తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన ‘తుమ్మచెక్క’ను ఉపయోగించడం సాధారణ పాఠకులకు అందుబాటులో ఉంటుంది.
- source_word: עֹמְדִים
  choice: నిలువుగా ఉండే
  rationale: పుంలింగ బహువచన కృదంతం పలకల అమరికను వివరిస్తుంది. ‘నిలువుగా ఉండే’ అనే రూపం వాటి నిర్మాణ దిశను సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన నిర్మాణ వర్ణన. హెబ్రీ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, విశేషణ సంబంధాలను స్పష్టంగా ఉంచుతూ మూలార్థాన్ని కాపాడింది.
