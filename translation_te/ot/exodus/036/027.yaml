translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణనను ఉపయోగించాం. మూలంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో దిశను స్పష్టంగా చూపేందుకు ‘పడమటి వైపున’ అన్నాం.
