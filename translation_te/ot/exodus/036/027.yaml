  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: te
  text: గుడారం యొక్క వెనుక భాగం కోసం, పడమటి వైపున, అతడు ఆరు చట్రాలను[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పలకలను.’ హెబ్రీ పదం నిర్మాణంలో ఉపయోగించే పలకలను లేదా చట్రాలను సూచించవచ్చు; గుడారం నిర్మాణ స్వరూపానికి ‘చట్రాలు’ మరింత సరిపోవచ్చని ఇక్కడ దానిని ఎంచుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: వెనుక భాగానికి
  rationale: ఈ నిర్మాణ సందర్భంలో יַרְכְּתֵי మందిరపు దూరపు లేదా వెనుక భాగాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా, ఉపసర్గతో కలిపి ‘వెనుక భాగానికి’ అని అనువదించాం.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: మִשְׁכָּן ఇక్కడ ఇశ్రాయేలీయుల ఆరాధనా గుడార నిర్మాణాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే స్థిరమైన సందర్భోచిత పదంగా ‘మందిరం’ వాడాం.
- source_word: יָמָּה
  choice: పడమటి వైపున
  rationale: ఈ పదానికి అక్షరార్థంగా ‘సముద్రం వైపు’ అనే భావం ఉన్నా, బైబిలు హెబ్రీ దిక్సూచిలో ఇది ‘పడమటి వైపు’ అనే అర్థంలో వాడబడింది.
- source_word: עָשָׂה
  choice: అతడు ... చేశాడు
  rationale: సాధారణ క్రియ עשהను నేరుగా ప్రతిబింబిస్తూ, నిర్మాణ వృత్తాంతంలోని పునరుక్త శైలిని నిలిపాం.
- source_word: שִׁשָּׁה
  choice: ఆరు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదించాం.
- source_word: קְרָשִׁים
  choice: చట్రాలు
  rationale: ఈ పదం మందిర నిర్మాణంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది. అవి పలకలా లేక చట్రంలా ఉండేవా అనే అనిశ్చితిని దృష్టిలో ఉంచుకుని ప్రధాన పాఠంలో ‘చట్రాలు’ ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
