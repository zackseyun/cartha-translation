  text: אֹ֜רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּֽ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: te
  text: ప్రతి తెర పొడవు ఇరవై ఎనిమిది మూరలు[a]; ప్రతి తెర వెడల్పు నాలుగు మూరలు. అన్ని తెరలకూ ఒకే కొలత ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక మూరను సాధారణంగా సుమారు 45 సెం.మీ.గా అంచనా వేస్తారు.
    reason: ప్రాచీన కొలమాన వివరణ
lexical_decisions:
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: భౌతిక పరిమాణాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: יְרִיעָה
  choice: తెర
  rationale: మందిరపు గుడారానికి ఉపయోగించిన వస్త్రపు భాగాన్ని సందర్భానుకూలంగా, సులభంగా తెలియజేస్తుంది.
- source_word: הָאַחַת / הָאֶחָת
  choice: ప్రతి
  rationale: అక్షరార్థంగా ‘ఒకటి’ అయినా, ఇక్కడ ఒక్కొక్క తెరకు ఈ కొలతలు వర్తిస్తాయని తెలిపే పంపిణీయ భావం ఉంది; తెలుగులో ‘ప్రతి’ సహజం.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: ఇరవై ఎనిమిది
  rationale: సంఖ్యకు నేరమైన ఆధునిక తెలుగు రూపం.
- source_word: אַמָּה
  choice: మూరలు
  rationale: ప్రాచీన హీబ్రూ పొడవు ప్రమాణమైన cubit‌కు తెలుగులో ప్రాచుర్యంలో ఉన్న సమాన పదం; ఆధునిక పాఠకుడి కోసం అడుగుసూచనలో సుమారు విలువ ఇవ్వబడింది.
- source_word: רֹחַב
  choice: వెడల్పు
  rationale: పొడవుకు జతగా వచ్చే పరిమాణాన్ని తెలిపే సహజమైన తెలుగు పదం.
- source_word: אַרְבַּע
  choice: నాలుగు
  rationale: సంఖ్యకు నేరమైన అనువాదం.
- source_word: מִדָּה אַחַת
  choice: కొలత ఒకటే
  rationale: అక్షరార్థంలోని ‘ఒక కొలత’ భావాన్ని సహజమైన తెలుగులో ఉంచి, అన్ని తెరల పరిమాణాలు ఒకేలా ఉన్నాయని తెలియజేస్తుంది.
- source_word: לְכָל הַיְרִיעֹת
  choice: అన్ని తెరల
  rationale: ఒకే కొలత వర్తించే పరిధిని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
