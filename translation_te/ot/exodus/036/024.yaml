revisions:
- from: ఇరవై పలకల కింద ఉంచడానికి అతడు నలభై వెండి దిమ్మలను చేశాడు—ఒక పలకకు ఉన్న రెండు మొనల కింద రెండు దిమ్మలు, మరొక పలకకు ఉన్న రెండు మొనల కింద రెండు దిమ్మలు.
  to: అతడు ఇరవై పలకల కింద నలభై వెండి అడుగుదిమ్మలను చేశాడు—ఒక పలకకు దానికున్న రెండు పొడిగింపుల కింద రెండు అడుగుదిమ్మలు, మరొక పలకకు దానికున్న రెండు పొడిగింపుల కింద రెండు అడుగుదిమ్మలు.
  rationale: The revision follows the Hebrew’s direct assertion that forty silver bases were made under the twenty boards, retains the repeated ‘one board ... another board’ allocation, and uses clearer terminology for bases and tenon-like projections. No footnote is needed because the structural sense can be conveyed in the text without resolving any disputed reading.
