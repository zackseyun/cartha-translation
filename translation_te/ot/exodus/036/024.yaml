base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: te
  text: అతడు ఇరవై పలకల కింద నలభై వెండి అడుగుదిమ్మలను చేశాడు—ఒక పలకకు దానికున్న రెండు పొడిగింపుల కింద రెండు అడుగుదిమ్మలు, మరొక పలకకు దానికున్న రెండు పొడిగింపుల కింద రెండు అడుగుదిమ్మలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: దిమ్మలు
  rationale: మందిరపు పలకలను నిలబెట్టే వెండి ఆధార భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో నిర్మాణ సందర్భానికి సహజమైన పదం.
- source_word: הַקְּרָשִׁים
  choice: పలకలు
  rationale: నివాస మందిరపు నిర్మాణంలో నిలువుగా అమర్చిన చెక్క భాగాలను సూచించే సరళమైన, సహజమైన అనువాదం.
- source_word: יְדֹתָיו
  choice: దానికి ఉన్న మొనలు
  rationale: పలక అడుగున దిమ్మల్లో అమరే పొడిగింపు భాగాలను సూచిస్తుంది; అక్షరార్థమైన ‘చేతులు’ కంటే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరాన్ని స్పష్టంగా మరియు గౌరవప్రదంగా అందించాం. హెబ్రీ మూలంలోని ఏకవచన–మరొకటి అనే పంపిణీ భావాన్ని ‘ఒక పలక… మరొక పలక’గా నిలిపాం.
