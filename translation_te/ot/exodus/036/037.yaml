source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: te
  text: అతడు గుడారపు ప్రవేశద్వారం కోసం నీలం, ఊదా, ఎర్రటి నూలుతోను, మెలితిప్పిన సన్నని నారతోను, అలంకార కుట్టుపని నిపుణుని పనిగా ఒక తెరను[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడ్డతెర.’ ఇక్కడి హీబ్రూ పదం ప్రవేశద్వారం వద్ద వేలాడే తెరను సూచిస్తుంది; లోపలి ‘విభజన తెర’కు వాడే פָּרֹכֶת అనే పదానికి ఇది భిన్నమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు వాక్యప్రవాహంలో ‘అతడు ... చేశాడు’ సహజంగా ఉండి క్రియ యొక్క సాధారణ అర్థాన్ని కాపాడుతుంది.
- source_word: מָסָךְ
  choice: తెర
  rationale: ఇది ప్రవేశద్వారానికి వేలాడదీసే తెరను సూచిస్తుంది; లోపలి విభజనకు వాడే פָּרֹכֶת అనే పదానికి భిన్నమైనది. తెలుగులో ‘తెర’ సహజమైన పదం; తేడాను పాదటిప్పణి వివరిస్తుంది.
- source_word: לְפֶתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారం కోసం
  rationale: פֶּתַח ప్రవేశం లేదా ద్వారపు తెరువును, אֹהֶל సాధారణంగా గుడారాన్ని సూచిస్తాయి. ‘గుడారపు ప్రవేశద్వారం’ స్పష్టంగా, సహజంగా ఉంది; ‘మందిరం’ వంటి విస్తరణను నివారిస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: గుడారపు వస్త్రాల సందర్భంలో నీలి రంగు వేసిన నూలు లేదా పదార్థాన్ని సూచిస్తుంది; జాబితాలోని ‘నూలుతో’ అనే పదం వస్త్రార్థాన్ని తెలియజేస్తుంది.
- source_word: וְאַרְגָּמָן
  choice: ఊదా
  rationale: ఊదా రంగు వేసిన వస్త్ర పదార్థాన్ని సూచించే సంప్రదాయ, ఖచ్చితమైన తెలుగు రంగుపేరు.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ పదబంధం స్కార్లెట్/క్రిమ్సన్ రంగు పదార్థాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకునికి ‘ఎర్రని నూలు’ స్పష్టంగా ఉండి సందర్భంలోని వస్త్రార్థాన్ని నిలుపుతుంది.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ నాణ్యమైన సన్నని నారవస్త్ర పదార్థాన్ని, מָשְׁזָר పేనిన లేదా మెలితిప్పిన తయారీని సూచిస్తాయి. ఈ అనువాదం పదార్థాన్నీ తయారీ విధానాన్నీ కాపాడుతుంది.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ఎంబ్రాయిడరీ పనివాని పని
  rationale: నానా రంగుల దారాలతో అలంకార కుట్టుపని చేసే నిపుణుని పనిని సూచిస్తుంది. ‘ఎంబ్రాయిడరీ’ ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా అర్థమయ్యే పదం; నిర్మాణంలోని శిల్పి-కేంద్రిత భావాన్ని నిలుపుతుంది.
