translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరానికి తగిన సరళమైన గౌరవప్రద శైలి. మూలంలోని పునరుక్తిని ప్రధానంగా నిలిపి, וַ־ సంబంధాన్ని సహజంగా చూపడానికి రెండవ వాక్యభాగంలో ‘కూడా’ చేర్చాం. వచనంలో పాఠాంతర లేదా తప్పనిసరి వివరణాత్మక పాదటిప్పణి అవసరం లేదు.
