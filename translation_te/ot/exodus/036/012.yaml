  text: חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֮ בַּ/יְרִיעָ֣ה הָ/אֶחָת֒ וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ בִּ/קְצֵ֣ה הַ/יְרִיעָ֔ה אֲשֶׁ֖ר בַּ/מַּחְבֶּ֣רֶת הַ/שֵּׁנִ֑ית מַקְבִּילֹת֙ הַ/לֻּ֣לָאֹ֔ת אַחַ֖ת אֶל אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: te
  text: అతడు ఒక తెరకు యాభై కొలికెలు చేశాడు; రెండవ జతలోని తెర అంచుకు కూడా యాభై కొలికెలు చేశాడు. ఆ కొలికెలు ఒకదానికొకటి ఎదురెదురుగా ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: కొలికెలు
  rationale: తెరలను కలపడానికి అంచుల వెంట చేసిన దారపు లేదా వస్త్రపు ఉచ్చులను సూచిస్తుంది. లోహపు కొక్కేలతో గందరగోళం కలగకుండా ‘కొలికెలు’ను ఎంచుకున్నాం.
- source_word: יְרִיעָה
  choice: తెర
  rationale: నివాసమందిర నిర్మాణ సందర్భంలో పెద్ద వస్త్రపు భాగాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: בִּקְצֵה
  choice: అంచుకు
  rationale: కొలికెలు తెర సరిహద్దున అమర్చబడ్డాయని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַחְבֶּרֶת
  choice: జత
  rationale: కలిపిన తెరలతో ఏర్పడిన విభాగాన్ని సాధారణ పాఠకునికి సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: హీబ్రూ క్రమసంఖ్యార్థాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: מַקְבִּילֹת
  choice: ఎదురెదురుగా ఉన్నాయి
  rationale: కొలికెలు కలపడానికి వీలుగా పరస్పరం సరైన అమరికలో, ఒకదానికి ఎదురుగా మరొకటి ఉన్నాయనే భావాన్ని కాపాడుతుంది.
- source_word: אַחַת אֶל אֶחָת
  choice: ఒకదానికొకటి
  rationale: ప్రతి కొలికె దానికి జతపడే మరొక కొలికెతో పరస్పర సంబంధంలో ఉందనే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: సాధారణ క్రియను సరళంగా అనువదిస్తూ నిర్మాణ ప్రక్రియకు తగిన అర్థాన్ని ఇస్తుంది.
