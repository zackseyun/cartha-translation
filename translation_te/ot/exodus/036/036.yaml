  to: అతడు దానికోసం[a] తుమ్మచెక్కతో నాలుగు స్తంభాలను చేసి, వాటిని బంగారంతో పొదిగించాడు; వాటి కొక్కేలు బంగారంతో చేసినవి; వాటికోసం నాలుగు వెండి పునాదులను పోసి తయారుచేశాడు.
