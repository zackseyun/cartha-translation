source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ לָ֗/הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַ/יְצַפֵּ֣/ם זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וַ/יִּצֹ֣ק לָ/הֶ֔ם אַרְבָּעָ֖ה אַדְנֵי כָֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: te
  text: అతడు దానికోసం[a] తుమ్మచెక్కతో నాలుగు స్తంభాలను చేసి, వాటిని బంగారంతో పొదిగించాడు; వాటి కొక్కేలు బంగారంతో చేసినవి; వాటికోసం నాలుగు వెండి పునాదులను పోసి తయారుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాని’ అంటే ముందరి వచనంలో ప్రస్తావించిన తెర.
    reason: cross_reference
lexical_decisions:
- source_word: עַמּוּדֵי שִׁטִּים
  choice: తుమ్మచెక్కతో నాలుగు స్తంభాలు
  rationale: עַמּוּדֵי అనేది నిలువుగా ఉండే నిర్మాణ ఆధారాలను సూచిస్తుంది; שִׁטִּים గుడార నిర్మాణంలో వాడిన అకేషియా జాతి కలప. సాధారణ తెలుగు పాఠకులకు సహజమైన సంప్రదాయ వృక్షపేరుగా ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וַיְצַפֵּם זָהָב
  choice: వాటికి బంగారు పూత పూశాడు
  rationale: צפה లోహంతో ఒక వస్తువును కప్పడం లేదా పూత వేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ నిర్మాణ సందర్భానికి ‘బంగారు పూత పూశాడు’ స్పష్టంగా ఉంటుంది.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కాలు
  rationale: וָוִים ఇక్కడ స్తంభాలకు అమర్చిన కలుపు లేదా వేలాడదీయు కొక్కాలను సూచిస్తుంది; ‘కొక్కాలు’ నిర్మాణ సందర్భంలో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אַדְנֵי כָסֶף
  choice: వెండి దిమ్మలు
  rationale: אֲדָנִים స్తంభాలు నిలిచే లోహపు పునాది భాగాలు లేదా సాకెట్లను సూచిస్తుంది. ‘దిమ్మలు’ వాటి ఆధార స్వభావాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּצֹק
  choice: పోత పోశాడు
  rationale: יצק లోహ వస్తువులను అచ్చులో పోసి తయారు చేయడాన్ని సూచిస్తుంది; ‘పోత పోశాడు’ ఆ లోహనిర్మాణ ప్రక్రియను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָהּ
  choice: దాని కోసం
  rationale: స్త్రీలింగ ఏకవచన సర్వనామాన్ని మూలంలోని విధంగానే ఉంచి, ముందు వచనంలోని తెరను సూచించే సంబంధాన్ని అతిగా స్పష్టీకరించకుండా కాపాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కాని సులభంగా అర్థమయ్యే నిర్మాణ పదజాలాన్ని వాడాం. మూల వాక్యంలోని వరుస చర్యలను సెమీకోలన్లతో నిలిపాం. అందించిన ఆంగ్ల పాదసూచికల్లో ‘four silver sockets’ అనే ప్రత్యామ్నాయం ప్రధాన పాఠ్యానికే సమానార్థకంగా ఉండి, ‘gold’ తరువాత ఉంచిన గుర్తుతో సరిపోలలేదు; అందువల్ల మూలాధారానికి అనుగుణంగా దాన్ని స్వీకరించకుండా, సర్వనామ సూచనను మాత్రమే సరైన స్థానంలో పాదసూచికగా ఇచ్చాం.
