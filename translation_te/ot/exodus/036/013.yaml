source:
  edition: WLC
  text: וַ/יַּ֕עַשׂ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וַ/יְחַבֵּ֨ר אֶת הַ/יְרִעֹ֜ת אַחַ֤ת אֶל אַחַת֙ בַּ/קְּרָסִ֔ים וַֽ/יְהִ֥י הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: te
  text: అతడు యాభై బంగారు కొక్కెములను చేసి, ఆ కొక్కెములతో తెరలను ఒకదానితో ఒకటి కలిపాడు. అలా నివాస గుడారం ఒక్కటిగా అయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాస గుడారం ఒక్కటిగా ఉంది.” హీబ్రూ వాక్యాన్ని మరింత నేరుగా ఇలా అనువదించవచ్చు; “ఒక్కటిగా అయింది” అనేది తెరలను కలిపిన ఫలితాన్ని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేసి
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను సందర్భానికి సహజంగా ‘చేసి’ అని అనువదించాం.
- source_word: חֲמִשִּׁים
  choice: యాభై
  rationale: మూలంలోని సంఖ్యను నేరుగా తెలిపే సాధారణ తెలుగు రూపం.
- source_word: קַרְסֵי זָהָב
  choice: బంగారు కొక్కెములు
  rationale: కెరెస్ అనేది తెరలను కలిపే లోహపు బిగింపు భాగం. దాని కలిపే పనిని, సాధ్యమైన ఆకారాన్ని తెలుగులో ‘కొక్కెములు’ సహజంగా తెలియజేస్తుంది; అయితే ఆకారాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיְחַבֵּר
  choice: కలిపాడు
  rationale: חבר యొక్క ‘కలుపు/జతచేయు’ భావాన్ని ఈ భౌతిక సందర్భంలో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֶת הַיְרִעֹת
  choice: తెరలను
  rationale: యెరీఓత్ ఇక్కడ మందిరపు వస్త్రపు తెరలను సూచిస్తుంది; ‘తెరలు’ స్పష్టమైన, సాధారణ పదం.
- source_word: אַחַת אֶל אַחַת
  choice: ఒకదానితో ఒకటి
  rationale: స్త్రీలింగ ఏకవచన పునరుక్తిలోని పరస్పర కలయిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַּקְּרָסִים
  choice: ఆ కొక్కెములతో
  rationale: ב ఉపసర్గ ఇక్కడ సాధనార్థకం; కొక్కెముల ద్వారా తెరలు కలపబడ్డాయని తెలియజేస్తుంది.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: అలా మందిరం ఒక్కటిగా అయింది
  rationale: తెరలను కలిపిన ఫలితంగా మందిరం ఏకమైన నిర్మాణంగా ఏర్పడిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. హీబ్రూ వాక్యాన్ని ‘మందిరం ఒక్కటిగా ఉంది’ అని మరింత రూపనిష్ఠంగా కూడా అనువదించవచ్చు; ఆ అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: మిష్కాన్ ఇక్కడ దేవుని నివాస గుడార నిర్మాణాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో సందర్భానికి అర్థమయ్యే సంక్షిప్త పదంగా ‘మందిరం’ను ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతతో కూడిన సులభ శైలిని వాడాం. కలపడం వల్ల ఏర్పడిన ఫలితాన్ని తెలపడానికి వాక్యాన్ని సహజమైన రెండు వాక్యాలుగా నిర్మించాం; మూలంలోని ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో భద్రపరిచాం.
