translation:
  language: te
  text: అతడు మందిరం ఒక వైపున ఉన్న చట్రాల[a] కోసం అకేషియా చెక్కతో ఐదు అడ్డకమ్మీలు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పలకలు’; మందిరంలో నిలువుగా అమర్చిన నిర్మాణ భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: ఈ వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను తెలియజేస్తుంది; తెలుగులో సహజమైన వాక్యక్రమంతో అనువదించబడింది.
- source_word: בְּרִיחֵי
  choice: అడ్డకమ్మీలు
  rationale: మందిరపు నిలువు చట్రాలను కలిపి నిలిపే అడ్డంగా అమర్చిన కమ్మీలను ఈ పదం సూచిస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: షిట్టీమ్ చెట్టు కలపను సూచించే నిర్మాణాన్ని, బైబిలు తెలుగు వాడుకలో పరిచితమైన ‘తుమ్మచెక్క’గా ఇచ్చాం.
- source_word: חֲמִשָּׁה
  choice: ఐదు
  rationale: అడ్డకమ్మీల సంఖ్యను నేరుగా తెలియజేసే సంఖ్యావాచకం.
- source_word: לְקַרְשֵׁי
  choice: చట్రాల కోసం
  rationale: కֶרֶשׁ ఇక్కడ మందిరపు నిలువు నిర్మాణ భాగాలను సూచిస్తుంది; వాటి నిర్మాణపరమైన పనిని ‘చట్రాలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: צֶלַע
  choice: వైపు
  rationale: నిర్మాణ సందర్భంలో ఈ పదం శరీరంలోని ‘ప్రక్కెముక’ను కాక, కట్టడం యొక్క ఒక పార్శ్వాన్ని సూచిస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు
  rationale: నిర్గమకాండంలోని ఈ తరలించగల పరిశుద్ధ నివాస నిర్మాణానికి సహజమైన, సంక్షిప్త తెలుగు పదప్రయోగం.
- source_word: הָאֶחָת
  choice: ఒక
  rationale: ఇది ‘వైపు’తో లింగ-వచన సమన్వయం కలిగి, రెండు పార్శ్వాల్లో ఒకదాన్ని సూచిస్తుంది; ‘మొదటి’ అనే క్రమార్థాన్ని బలవంతంగా చేర్చదు.
