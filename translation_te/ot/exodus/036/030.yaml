  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֤י אֲדָנִים֙ שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: te
  text: ఆ పలకలు[a] ఎనిమిది; వాటి వెండి అడుగుదిమ్మలు[b] పదహారు—ఒక్కొక్క పలక కింద రెండేసి అడుగుదిమ్మలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రాలు’; హీబ్రూ పదం గుడారపు నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆధారపు గూళ్లు.’ ఇవి పలకలను కిందనుంచి పట్టి నిలబెట్టే లోహపు భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: ఉన్నాయి / సంఖ్యను తెలిపే వాక్య నిర్మాణం
  rationale: నిర్మాణ సామగ్రి జాబితాలో ఉన్న వస్తువుల సంఖ్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూ సంధాన అవ్యయాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయలేదు.
- source_word: קְרָשִׁים
  choice: పలకలు
  rationale: మందిరపు గుడారం నిర్మాణంలో నిలువుగా అమర్చిన నిర్మాణ భాగాలను సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం. ‘చట్రాలు’ కూడా సాధ్యమే గాని, మూలపదంలోని దృఢమైన పలక స్వరూపాన్ని ‘పలకలు’ మరింత నేరుగా తెలియజేస్తుంది.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: అడుగుదిమ్మలు
  rationale: ప్రతి నిలువు పలకను కిందనుంచి పట్టి నిలబెట్టే లోహపు ఆధార భాగాలను సూచిస్తుంది. సాధారణ ‘ఆధారాలు’ కంటే నిర్మాణ సందర్భం స్పష్టంగా ఉంటుంది; ‘గూళ్లు’ అనే సాకెట్ భావమూ సాధ్యమే.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: అడుగుదిమ్మలు తయారైన పదార్థాన్ని నేరుగా సూచిస్తుంది.
- source_word: שִׁשָּׁה עָשָׂר
  choice: పదహారు
  rationale: మూలంలోని సంఖ్యకు సాధారణ తెలుగు రూపం.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים
  choice: రెండేసి అడుగుదిమ్మలు
  rationale: హీబ్రూలోని ‘రెండు దిమ్మలు, రెండు దిమ్మలు’ అనే పునరుక్తికి ఉన్న విభజనార్థాన్ని సహజమైన తెలుగు ‘రెండేసి’తో వ్యక్తం చేస్తుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: నిర్మాణ భాగాల స్థాన సంబంధాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ఒక్కొక్క పలక
  rationale: ఏకవచనంతో కూడిన హీబ్రూ ప్రయోగానికి సందర్భంలో ఉన్న విభజనార్థాన్ని తెలుగులో సహజంగా నిలుపుతుంది; ఎనిమిది పలకల్లో ప్రతి పలక ఉద్దేశించబడిందని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. ‘ఒక్కొక్క’ మరియు ‘రెండేసి’ రూపాలు మూలంలోని విభజనార్థక పునరుక్తిని సహజంగా తెలియజేస్తాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉంచబడ్డాయి.
