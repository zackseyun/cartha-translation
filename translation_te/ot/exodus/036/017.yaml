translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ పదజాలం వాడబడింది. మూలంలోని రెండు సమాంతర ఉపవాక్యాలు, ‘యాభై కొలుకులు’ అనే పునరుక్తి నిలుపబడ్డాయి.
