  text: וַ/יַּ֜עַשׂ לֻֽלָאֹ֣ת חֲמִשִּׁ֗ים עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּיצֹנָ֖ה בַּ/מַּחְבָּ֑רֶת וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ עַל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: te
  text: జతచేసిన తెరల మొదటి సమూహంలో చివరనున్న తెర అంచున అతడు యాభై కొలుకులు చేశాడు; జతచేసిన రెండవ సమూహంలోని తెర అంచున కూడా యాభై కొలుకులు చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: కొలుకులు
  rationale: తెరలను ఒకదానితో ఒకటి కలపడానికి చేసిన వస్త్రపు లూపులను సూచించే సహజమైన తెలుగు పదం; ఈ వచనంలో లేని ‘నీలి’ అనే వివరాన్ని చేర్చలేదు.
- source_word: שְׂפַת
  choice: అంచు
  rationale: వస్త్రం లేదా తెర సందర్భంలో దాని చివరి అంచును సహజంగా సూచిస్తుంది.
- source_word: יְרִיעָה
  choice: తెర
  rationale: గుడార నిర్మాణ సందర్భంలో పెద్ద వస్త్రపు తెరను సూచించే స్పష్టమైన, సాధారణ పదం.
- source_word: הַקִּיצֹנָה
  choice: చివరనున్న
  rationale: సమూహం చివరి స్థానంలో ఉన్న తెర అనే స్థలార్థాన్ని ‘బయటి’ కంటే ఈ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמַּחְבָּרֶת
  choice: మొదటి సమూహంలో
  rationale: మూలపదం కలిపిన తెరల సముదాయాన్ని లేదా కలయికను సూచిస్తుంది. ‘మొదటి’ అనేది సందర్భానుసారంగా పూరించబడినందున పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: రెండవ సమూహానికి చెందిన తెర
  rationale: ఇది రెండవ కలిపిన సముదాయానికి సంబంధించిన తెర అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియావిశేషణ రూపంలోని కలయిక భావాన్ని ‘సమూహం’ ద్వారా నిలుపుతుంది.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: చేశాడు ... చేశాడు
  rationale: హీబ్రూ మూలంలోని క్రియ పునరుక్తిని రెండు ఉపవాక్యాల్లోనూ నిలిపింది.
