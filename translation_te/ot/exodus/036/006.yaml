source:
  edition: WLC
  text: וַ/יְצַ֣ו מֹשֶׁ֗ה וַ/יַּעֲבִ֨ירוּ ק֥וֹל בַּֽ/מַּחֲנֶה֮ לֵ/אמֹר֒ אִ֣ישׁ וְ/אִשָּׁ֗ה אַל יַעֲשׂוּ ע֛וֹד מְלָאכָ֖ה לִ/תְרוּמַ֣ת הַ/קֹּ֑דֶשׁ וַ/יִּכָּלֵ֥א הָ/עָ֖ם מֵ/הָבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: te
  text: 'అప్పుడు మోషే ఆజ్ఞాపించాడు. వారు శిబిరమంతటా ప్రకటన చేయించారు[a]: “పరిశుద్ధస్థలానికి ఇచ్చే అర్పణ[b] కోసం ఇక ఏ పురుషుడుగానీ స్త్రీగానీ ఏ పనీ చేయవద్దు.” దాంతో ప్రజలు ఇక తీసుకురాకుండా నిలువరించబడ్డారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు శిబిరంలో ఒక ప్రకటన చేశారు.” హెబ్రీ పదబంధానికి అక్షరార్థం “వారు ఒక స్వరాన్ని వెళ్లేలా చేశారు.”
    reason: lexical_alternative
  - marker: b
    text: “పరిశుద్ధస్థలానికి ఇచ్చే అర్పణ” అనే మాటను “పరిశుద్ధ అర్పణ” లేదా “పరిశుద్ధస్థలం కోసం ఇచ్చే కానుక” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ మోషే అధికారంతో ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది; అందువల్ల ‘ఆజ్ఞాపించాడు’ దాని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: ప్రకటన చేయించారు
  rationale: అక్షరార్థంగా ‘ఒక స్వరాన్ని వెళ్లేలా చేశారు’ అనే హిఫీల్ పదబంధం శిబిరమంతటా బహిరంగ ప్రకటనను వ్యాపింపజేయడాన్ని సూచిస్తుంది. ‘ప్రకటన చేయించారు’ కారణార్థక భావాన్ని నిలుపుతుంది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరమంతటా
  rationale: בְּ అక్షరార్థంగా ‘శిబిరంలో’ అయినప్పటికీ, ప్రకటన ప్రజల మధ్య వ్యాపించిన సందర్భార్థాన్ని ‘శిబిరమంతటా’ సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ וְאִשָּׁה
  choice: ఏ పురుషుడుగానీ స్త్రీగానీ
  rationale: నిషేధ వాక్యంలో ఈ జంట పురుషులనూ స్త్రీలనూ స్పష్టంగా చేర్చుతుంది; తెలుగు ‘గానీ…గానీ’ నిర్మాణం ‘ఎవరూ’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: ఇక ... ఏ పనీ చేయవద్దు
  rationale: מְלָאכָה పని లేదా నైపుణ్యంతో చేసే తయారీని సూచించగలదు. విరాళం కోసం ఇక అదనపు పని చేయకూడదనే విస్తృత భావాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలానికి ఇచ్చే అర్పణ కోసం
  rationale: תְּרוּמָה పవిత్ర వినియోగం కోసం ప్రత్యేకంగా ఇచ్చే అర్పణ లేదా విరాళం; הַקֹּדֶשׁ ఈ సందర్భంలో పరిశుద్ధస్థలాన్ని సూచిస్తుంది. ఈ రూపం రెండింటి సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּכָּלֵא
  choice: నిలువరించబడ్డారు
  rationale: כלא నిఫాల్ రూపం ఆపబడడం లేదా నిరోధించబడడం అనే కర్మణి భావాన్ని కలిగి ఉంది. ‘నిలువరించబడ్డారు’ ప్రజలు ఇవ్వడానికి ఇష్టపడలేదనే భావాన్ని చేర్చకుండా ఆ కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: מֵהָבִיא
  choice: ఇక తీసుకురాకుండా
  rationale: מן తో కూడిన క్రియానామం ఆ చర్య జరగకుండా నిరోధించబడిన భావాన్ని ఇస్తుంది; సందర్భం ప్రకారం అదనంగా తీసుకురావడం ఆపబడిందని ‘ఇక’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: הַקֹּדֶשׁ యొక్క సూచన
  choice: పరిశుద్ధస్థలం
  alternative: పరిశుద్ధమైన అర్పణ
  rationale: నివాసమందిర నిర్మాణ సందర్భంలో ఈ పదం పరిశుద్ధస్థలం లేదా దానికి సంబంధించిన పవిత్ర కార్యాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ‘పరిశుద్ధస్థలం’ ఎంచుకొని, నిర్మాణ సంబంధాన్ని స్పష్టపరుస్తూనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హెబ్రీ కారణార్థక ప్రకటన పదబంధం, పురుషుడు–స్త్రీ అనే స్పష్టమైన జంట, చివరి కర్మణి నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
