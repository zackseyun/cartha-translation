translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. వస్త్రనిర్మాణ సందర్భాన్ని స్పష్టంచేయడానికి రంగుల జాబితాతో ‘నూలు’ను సమూహార్థంగా చేర్చాం; హీబ్రూలోని కళాత్మక పనికి ఉన్న స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
