source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: te
  text: అతడు నీలి, ఊదా, కెంపు రంగు నూలుతోను, మెలితిప్పిన సన్నని నారతోను తెరను చేశాడు.[a] దానిలో కెరూబుల ఆకృతులను కళాత్మక నమూనా పనితో చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముసుగు తెరను.’ ఇది పరిశుద్ధ స్థలాన్నీ అతి పరిశుద్ధ స్థలాన్నీ వేరుచేసే లోపలి తెర.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నైపుణ్యంగల పనివాని కళాత్మక పనితో’ లేదా ‘ఎంబ్రాయిడరీ పనితో.’ హీబ్రూ పదబంధం కళాత్మకంగా నమూనాలు రూపొందించిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: తెరను
  rationale: ఇది గుడారంలోని అంతర్భాగాలను వేరుచేసే తెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ సహజంగా, స్పష్టంగా ఉంది; ‘ముసుగు తెర’ ప్రత్యామ్నాయంగా పాదసూచికలో ఇవ్వబడింది.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: నీలి, ఊదా, ఎర్రని నూలుతో
  rationale: ఈ రంగు పదాలు ఇక్కడ రంగు వేసిన వస్త్రనూలును సూచిస్తాయి. తెలుగు వాక్యంలో ‘నూలు’ను సమూహార్థంగా ఒక్కసారి చేర్చడం సహజంగా ఉంటుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: పేనిన సన్నని నారతో
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר పేనిన లేదా మెలితిప్పిన గుణాన్ని సూచిస్తాయి; రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంగల రూపకర్త పనిగా
  rationale: ఈ పదబంధం యోచనతో చేసిన కళాత్మక నమూనా పనిని సూచిస్తుంది. కేవలం చేతిపనిగా పరిమితం చేయకుండా రూపకల్పనలోని నైపుణ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: כְּרֻבִים
  choice: కెరూబులను
  rationale: ఈ పరలోక జీవులకు వాడే స్థిరమైన బైబిలు పేరును నిలుపుతూ, తెలుగు విభక్తితో సహజంగా ఇచ్చాం.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: దానిలో కెరూబులను ... నేయించాడు
  rationale: కెరూబుల ఆకృతులు తెర రూపకల్పనలో భాగంగా చేయబడ్డాయని సందర్భం సూచిస్తుంది. హీబ్రూ క్రియకు అనుగుణంగా ప్రధాన కర్త పని చేయించాడనే సహజ తెలుగు నిర్మాణాన్ని వాడాం.
