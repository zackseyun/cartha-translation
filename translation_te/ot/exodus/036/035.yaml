- from: అతడు నీలి, ఊదా, ఎర్రని నూలుతో, పేనిన సన్నని నారతో తెరను[a] చేశాడు. దానిలో కెరూబులను నైపుణ్యంగల రూపకర్త పనిగా నేయించాడు.[b]
  to: అతడు నీలి, ఊదా, కెంపు రంగు నూలుతోను, మెలితిప్పిన సన్నని నారతోను తెరను చేశాడు.[a] దానిలో కెరూబుల ఆకృతులను కళాత్మక నమూనా పనితో చేశాడు.[b]
