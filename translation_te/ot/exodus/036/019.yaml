translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రెండు ‘కప్పు’ పదాలను నిలిపి, תְּחָשִׁים పదంలోని నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
