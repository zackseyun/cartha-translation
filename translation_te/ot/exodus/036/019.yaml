  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: te
  text: అతడు గుడారానికి ఎరుపు రంగు వేసిన పొట్టేళ్ల తోళ్లతో ఒక కప్పే పొరను, దాని పైన తహష్ తోళ్లతో[a] ఒక కప్పే పొరను చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం תְּחָשִׁים (తెహాషీమ్) అర్థం నిర్ధారణగా తెలియదు. దీనిని ‘సముద్ర ఆవుల తోళ్లు,’ ‘పోర్పస్ చర్మాలు,’ ‘డుగాంగ్ చర్మాలు’ లేదా సాంప్రదాయంగా ‘బ్యాడ్జర్ చర్మాలు’ అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క wayyiqtol రూపం కథన క్రమంలో జరిగిన గత కార్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన వాక్యక్రమం కోసం క్రియను చివర ఉంచాం.
- source_word: מִכְסֶה
  choice: ఒక కప్పు
  rationale: ఈ నామవాచకం కప్పే పొరను సూచిస్తుంది. ‘కప్పు’ గుడారాన్ని కప్పే వస్తువును స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לָאֹהֶל
  choice: గుడారం కోసం
  rationale: אֹהֶל సాధారణంగా ‘గుడారం’ అని అర్థం. సందర్భాన్ని బట్టి ప్రత్యేక మతపరమైన పదాన్ని చేర్చకుండా మూలపదానికే ప్రాధాన్యం ఇచ్చాం.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: ఎర్రగా రంగువేసిన పొట్టేళ్ల తోళ్లతో
  rationale: עֹרֹת అంటే తోళ్లు, אֵלִים అంటే పొట్టేళ్లు, מְאָדָּמִים అంటే ఎర్రగా చేయబడినవి లేదా రంగువేయబడినవి. ఈ అనువాదం పదబంధంలోని ప్రతి అంశాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּמִכְסֵה
  choice: ఒక కప్పును
  rationale: హీబ్రూలో ‘కప్పు’ అనే పదం మళ్లీ వస్తుంది. ‘మరొకటి’ లేదా ‘రెండవది’ అని వివరణాత్మకంగా చేర్చకుండా ఆ పునరుక్తిని నిలిపాం.
- source_word: עֹרֹת תְּחָשִׁים
  choice: మేలురకం తోళ్లతో[a]
  rationale: תְּחָשִׁים ఏ జంతువును లేదా ఏ రకమైన తోలును సూచిస్తుందో నిర్ధారణ లేదు. ఊహాజనిత జంతు గుర్తింపును ప్రధాన పాఠ్యంలో పెట్టకుండా, ఉపయోగకరమైన బయటి తోలు అనే భావాన్ని ‘మేలురకం తోళ్లు’ ద్వారా తెలిపి, అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
- source_word: מִלְמָעְלָה
  choice: దాని పైన
  rationale: ఈ పదం పైభాగంలో ఉన్న పొరను సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ‘దాని పైన’ అని అనువదించాం.
