- from: అతడు గుడారం కోసం ఎర్రగా రంగువేసిన పొట్టేళ్ల తోళ్లతో ఒక కప్పును, దాని పైన మేలురకం తోళ్లతో[a] ఒక కప్పును చేశాడు.
  to: అతడు గుడారానికి ఎరుపు రంగు వేసిన పొట్టేళ్ల తోళ్లతో ఒక కప్పే పొరను, దాని పైన తహష్ తోళ్లతో[a] ఒక కప్పే పొరను చేశాడు.
  rationale: The uncertain term תְּחָשִׁים is transliterated as “తహష్,” preserving source ambiguity and leaving the lexical alternatives in the footnote. “కప్పే పొర” provides a clear, natural rendering of each occurrence of מִכְסֶה. No theological interpretation has been introduced.
