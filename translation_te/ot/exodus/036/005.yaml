source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: te
  text: 'వారు మోషేతో ఇలా అన్నారు: “యాహ్వే చేయమని ఆజ్ఞాపించిన పనికోసం అవసరమైనదానికంటే ప్రజలు చాలా ఎక్కువగా తెస్తున్నారు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలు పనికోసం మరీ ఎక్కువగా తెస్తున్నారు.” హీబ్రూ పదబంధం వారు తెస్తున్న కానుకలు అవసరాన్ని మించిపోయాయని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: వారు మోషేతో ఇలా అన్నారు
  rationale: హీబ్రూ కథన సూత్రంలోని ‘చెప్పుతూ’ అనే పునరుక్తిని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయంగా ‘ఇలా అన్నారు’ అని వ్యక్తం చేశాం.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: అవసరమైనదానికంటే ... ఎంతో ఎక్కువగా తీసుకొస్తున్నారు
  rationale: ప్రజలు ఇంకా వస్తువులను తెస్తూనే ఉన్నారని వర్తమాన కొనసాగింపు భావాన్ని, అలాగే అవసరాన్ని మించిన పరిమాణాన్ని ఈ పదబంధం స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే సహజమైన తెలుగు పదం.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: పని కోసం
  rationale: రెండు హీబ్రూ పదాలు సేవ/శ్రమ మరియు చేయవలసిన పని అనే సమీప భావాలను కలిగి ఉన్నాయి. తెలుగులో ‘పని యొక్క కార్యం’ అనడం కృత్రిమంగా ఉండటంతో సందర్భానుసారంగా సంక్షిప్తంగా ఇచ్చాం.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: యెహోవా చేయమని ఆజ్ఞాపించిన పని
  rationale: ఆ పని దైవాజ్ఞ ప్రకారం చేయవలసినదనే భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ నాలుగు అక్షరాల దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘తీసుకొస్తున్నారు’ కొనసాగుతున్న చర్యను సూచిస్తుంది; ‘అవసరమైనదానికంటే ఎంతో ఎక్కువగా’ మూలంలోని సమృద్ధి మరియు మించిపోవడం అనే రెండు భావాలను నిలుపుతుంది.
