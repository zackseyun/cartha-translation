translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కొలత వాక్యం. పురాతన కొలతను ఆధునిక ప్రమాణంలోకి మార్చకుండా ‘మూర’గా నిలిపింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
