translation:
  language: te
  text: ప్రతి చట్రం పది మూరల పొడవు, ఒకటిన్నర మూరల వెడల్పు కలిగి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చట్రం’ అని అనువదించిన హెబ్రీ పదం קֶרֶשׁకు ‘పలక’ లేదా ‘చెక్కబల్ల’ అని కూడా అర్థం కావచ్చు; ఇక్కడ అది గుడారపు నిర్మాణ భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת אֹרֶךְ
  choice: పొడవు పది మూరలు
  rationale: సంఖ్యను, కొలత ప్రమాణాన్ని యథాతథంగా ఉంచుతూ తెలుగు వాక్యనిర్మాణానికి సహజంగా కొలతను తెలిపింది. పురాతన אַמָּה ప్రమాణానికి సంప్రదాయ తెలుగు సమానార్థకంగా ‘మూర’ వాడబడింది.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: చట్రం
  rationale: గుడారపు నిర్మాణంలో నిలువుగా అమర్చే నిర్మాణ భాగాన్ని సూచించే קֶרֶשׁకు ‘చట్రం’ సందర్భోచితంగా ఉంది; ‘పలక’ కూడా సాధ్యమైన అర్థమని పాదసూచనలో ఉంచాం.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: ఒకటిన్నర మూరలు
  rationale: అక్షరార్థంగా ‘ఒక మూర మరియు అర మూర’ అనే హెబ్రీ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఒకటిన్నర మూరలు’గా తెలిపింది.
- source_word: רֹחַב
  choice: వెడల్పు
  rationale: కొలతలోని breadth/width భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ఒక్కొక్క చట్రం
  rationale: అక్షరార్థంగా ‘ఒక చట్రం’ అయినా, ఈ కొలత సందర్భంలో పంపిణీయ భావం ఉంది; అందువల్ల ప్రతి నిర్మాణ భాగానికీ ఇదే కొలత వర్తిస్తుందని ‘ఒక్కొక్క’ సహజంగా తెలియజేస్తుంది.
