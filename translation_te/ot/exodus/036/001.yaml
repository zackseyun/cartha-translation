source:
  edition: WLC
  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: te
  text: యెహోవా జ్ఞానవివేకాలను అనుగ్రహించి, పరిశుద్ధస్థల సేవకు సంబంధించిన పనులన్నిటినీ ఎలా చేయాలో తెలిసేలా చేసిన బెసలేలు, ఒహోలీయాబు, నైపుణ్యంగల ప్రతి వ్యక్తి[a], యెహోవా ఆజ్ఞాపించినదంతా అనుసరించి పని చేయాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హృదయంలో జ్ఞానంగల ప్రతి మనిషి”; ఈ సందర్భంలో దేవుడు శిల్పపనికి తగిన జ్ఞానం, నైపుణ్యం ఇచ్చిన ప్రతి పనివాడిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ వాక్య నిర్మాణాన్ని మరింత దగ్గరగా అనుసరిస్తే: “బెసలేలు, ఒహోలీయాబు, హృదయంలో జ్ఞానంగల ప్రతి మనిషి—యెహోవా వారిలో జ్ఞానవివేకాలను ఉంచి, పరిశుద్ధస్థల సేవకు సంబంధించిన పనులన్నిటినీ ఎలా చేయాలో తెలుసుకునేలా చేసిన వారందరూ—యెహోవా ఆజ్ఞాపించినదంతా అనుసరించి పని చేయాలి.”'
    reason: source_structure
lexical_decisions:
- source_word: וְעָשָׂה
  choice: పని చేయాలి
  rationale: సందర్భంలో ఈ క్రియ ముందున్న ఆదేశాలను కొనసాగిస్తూ విధి/ఫలిత భావాన్ని తెలియజేస్తుంది. తెలుగు ‘పని చేయాలి’ సహజంగా ఆ నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: బెసలేలు, ఒహోలీయాబు
  rationale: హీబ్రూ వ్యక్తినామాలకు సమీపంగా, తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించబడిన రూపాలు.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: నైపుణ్యంగల ప్రతి వ్యక్తి
  rationale: అక్షరార్థంగా ‘హృదయంలో జ్ఞానంగల ప్రతి మనిషి’; ఈ శిల్పకళా సందర్భంలో అది దేవుడు ప్రసాదించిన నైపుణ్యాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా అందించడానికి ఈ రూపం ఎంచుకోబడింది; అక్షరార్థపు నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: యెహోవా జ్ఞానవివేకాలను అనుగ్రహించి
  rationale: హీబ్రూలో ‘వారిలో జ్ఞానాన్ని, వివేకాన్ని ఉంచిన’ అనే బహువచన సమూహ సూచన ఉంది. తెలుగులో సమూహానికంతటికీ వర్తించేలా ‘అనుగ్రహించి’ అని సహజంగా వ్యక్తీకరించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: חָכְמָה וּתְבוּנָה
  choice: జ్ఞానవివేకాలు
  rationale: జతగా ఉన్న ‘జ్ఞానం, అవగాహన/వివేకం’ అనే భావాలను సంక్షిప్తమైన సహజ తెలుగు సమాసంతో నిలుపుతుంది; ఇక్కడ శిల్పనైపుణ్యం కూడా వాటిలో భాగమే.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: ఎలా చేయాలో తెలిసేలా
  rationale: కేవలం సమాచార జ్ఞానం కాక, పనిని నిర్వహించే ప్రాయోగిక సామర్థ్యాన్ని ఈ రెండు క్రియారూపాలు సూచిస్తున్నాయి.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: పరిశుద్ధస్థల సేవకు సంబంధించిన పనులన్నిటినీ
  rationale: מְלֶאכֶת (‘పని/పనితనం’), עֲבֹדַת (‘సేవ/శ్రమ’), הַקֹּדֶשׁ (‘పరిశుద్ధస్థలం’) అనే పొరలన్నింటినీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: యెహోవా ఆజ్ఞాపించినదంతా అనుసరించి
  rationale: לְ ఉపసర్గ ఇక్కడ అనుగుణతను సూచిస్తుంది; పని యెహోవా ఇచ్చిన ఆజ్ఞలన్నిటికి అనుగుణంగా జరగాలి.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: אִישׁ חֲכַם לֵב లో లింగం మరియు నుడికారం
  choice: నైపుణ్యంగల ప్రతి వ్యక్తి
  alternative: హృదయజ్ఞానంగల ప్రతి పురుషుడు
  rationale: అక్షరార్థంలో אִישׁ పురుషలింగ ఏకవచనం అయినా, כֹל తో కూడిన ఈ శిల్పకారుల వర్గసూచన సందర్భంలో సాధారణ సభ్యుడిని సూచిస్తుంది. తెలుగులో ‘ప్రతి వ్యక్తి’ సహజంగా వర్గవ్యాప్తిని తెలియజేస్తుంది; అక్షరార్థపు లింగం, నుడికారం పాదసూచికలో వెల్లడించబడ్డాయి.
- issue: దేవుడు ఇచ్చిన జ్ఞానం మరియు మానవ కార్యనిర్వహణ మధ్య సంబంధం
  choice: దైవానుగ్రహం సామర్థ్యాన్ని ఇస్తుంది; వారు ఆజ్ఞ ప్రకారం పని చేయాలి
  alternative: దైవజ్ఞానం ఉన్నందున పని స్వయంచాలకంగా నెరవేరుతుంది
  rationale: వాక్యం జ్ఞానవివేకాల మూలాన్ని యెహోవాలో ఉంచుతూ, పనిని చేయాల్సిన బాధ్యతను శిల్పులపై ఉంచుతుంది. ఈ రెండింటినీ పరిష్కరించి కలపకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా వాక్యక్రమాన్ని సహజీకరించాం. ‘పరిశుద్ధస్థలం’, ‘జ్ఞానవివేకాలు’, ‘ఆజ్ఞాపించినదంతా’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని ఉంచుతూ, క్లిష్టమైన హీబ్రూ సంబంధవాక్యాన్ని పఠనసౌలభ్యానికి పునర్వ్యవస్థీకరించాం.
