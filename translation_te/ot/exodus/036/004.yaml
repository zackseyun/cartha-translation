  yaml_path: translation/ot/exodus/036/004.yaml
  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: te
  text: అప్పుడు పవిత్రస్థలానికి సంబంధించిన పనంతా చేస్తున్న నైపుణ్యం గల పురుషులందరూ, ఒక్కొక్కరు తాము చేస్తున్న పని నుంచి వచ్చారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మనిషి మనిషి, వారు చేస్తున్న తన పని నుంచి” అని ఉంది. ఇది “ఒక్కొక్కరు తాము చేస్తున్న పని నుంచి” అనే విభజనార్థక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; సాధారణ భూతకాల రూపమైన ‘వచ్చారు’ సహజంగానూ మూలానికి దగ్గరగానూ ఉంది.
- source_word: כָּל הַחֲכָמִים
  choice: నైపుణ్యంగల పురుషులందరూ
  rationale: ఈ సందర్భంలో חכמים మేధోపరమైన జ్ఞానులకన్నా పవిత్ర నివాస నిర్మాణానికి తగిన నైపుణ్యం పొందిన పనివారిని సూచిస్తుంది; పుంలింగ బహువచనాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: הָעֹשִׂים
  choice: చేస్తున్న
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ‘చేస్తున్న’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: పవిత్రస్థలానికి సంబంధించిన పనంతా
  rationale: מְלֶאכֶת పని లేదా వృత్తిపరమైన కృషిని సూచిస్తుంది; ఈ సందర్భంలో הַקֹּדֶשׁ అమూర్తమైన పవిత్రతకన్నా పవిత్ర నివాసాన్ని సూచిస్తుంది.
- source_word: אִישׁ אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: పదపునరుక్తి విభజనార్థకంగా ఉండి ‘ఒక్కొక్కరు’ లేదా ‘ప్రతి ఒక్కరు’ అనే భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ‘ప్రతి ఒక్కరూ’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: מִמְּלַאכְתּוֹ
  choice: తాము చేస్తున్న పని నుంచి
  rationale: מן ప్రతి వ్యక్తి నిమగ్నమై ఉన్న పని నుంచి రావడాన్ని సూచిస్తుంది; తెలుగు గౌరవ/బహువచన అన్వయంతో ‘తాము’ సహజంగా ఉంది.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: తాము చేస్తున్న
  rationale: మూలంలో చివరి సర్వనామం, క్రియ బహువచనంలో ఉన్నా, ముందు ఉన్న אִישׁ אִישׁ వల్ల భావం విభజనార్థకంగా ఉంటుంది; తెలుగు రూపం సామూహిక వ్యాకరణాన్నీ వ్యక్తిగత భావాన్నీ కలిపి నిలుపుతుంది.
