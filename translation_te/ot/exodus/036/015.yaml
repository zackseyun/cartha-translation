  language: te
  text: ఒక్కో తెర పొడవు ముప్పై మూరలు; ఒక్కో తెర వెడల్పు నాలుగు మూరలు. పదకొండు తెరలన్నింటికీ ఒకే కొలత ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: తెర
  rationale: నివాస మందిరాన్ని కప్పే వస్త్రపు భాగాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: אַמָּה / אַמּוֹת
  choice: మూర / మూరలు
