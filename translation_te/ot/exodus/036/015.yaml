- source_word: מִדָּה אַחַת
  choice: కొలత ఒక్కటే
  rationale: పదకొండు తెరల పరిమాణం ఏకరీతిగా ఉందనే హీబ్రూ వ్యక్తీకరణను దాని సంక్షిప్త రూపంలో నిలుపుతుంది.
