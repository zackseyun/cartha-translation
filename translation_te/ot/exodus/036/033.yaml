  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: te
  text: అతడు మధ్య అడ్డకర్రను పలకల మధ్యలో ఒక చివర నుండి మరొక చివర వరకు సాగేలా చేశాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కేంద్ర అడ్డకర్రను ... ఒక చివర నుండి మరొక చివర వరకు సాగేలా చేశాడు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సాగేలా” అని అనువదించిన హీబ్రూ క్రియను ఈ నిర్మాణ సందర్భంలో “మధ్యలో వెళ్లేలా” లేదా “మధ్యలో విస్తరించేలా” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה అనే క్రియ యొక్క Qal wayyiqtol రూపం సాధారణ కథనంలో ‘అతడు చేశాడు’ అనే భావాన్ని ఇస్తుంది. తెలుగు కథనశైలిలో వాక్యారంభంలోని సంధికారకాన్ని తప్పించడం సహజం.
- source_word: הַבְּרִיחַ
  choice: అడ్డకర్రను
  rationale: గుడార నిర్మాణ సందర్భంలో בְּרִיחַ పలకలను కలిపి నిలిపే అడ్డంగా అమర్చిన కర్రను సూచిస్తుంది; ‘అడ్డకర్ర’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: הַתִּיכֹן
  choice: మధ్య
  rationale: ఈ విశేషణం మధ్యలో లేదా కేంద్రంలో ఉన్నదాన్ని సూచిస్తుంది. నిర్మాణంలోని స్థానాన్ని ‘మధ్య’ సహజంగా తెలియజేస్తుంది.
- source_word: לִבְרֹחַ
  choice: చొచ్చుకుపోయేలా
  rationale: ఈ నిర్మాణ సందర్భంలో ברח యొక్క infinitive పలకల మధ్యగా అడ్డకర్ర సాగడాన్ని సూచిస్తుంది. ‘చొచ్చుకుపోయేలా’ అనేది దాని గుండా వెళ్లే భావాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: בְּתוֹךְ
  choice: మధ్యగా
  rationale: בְּתוֹךְ ఇక్కడ పలకల లోపలి భాగం లేదా వాటి మధ్యగుండా అనే స్థలసంబంధ భావాన్ని ఇస్తుంది. ‘మధ్యగా’ తెలుగు వాక్యంలో సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: הַקְּרָשִׁים
  choice: పలకల
  rationale: గుడార నిర్మాణంలోని קֶרֶשׁ అనే నిర్మాణ భాగాలకు ‘పలకలు’ స్పష్టమైన, సంప్రదాయబద్ధమైన తెలుగు సమానం; ‘చట్రాలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: ఒక చివరి నుండి మరో చివరి వరకు
  rationale: ఈ హీబ్రూ నుడికారం మొత్తం పొడవునా విస్తరించడాన్ని సూచిస్తుంది. ‘ఒక చివరి నుండి మరో చివరి వరకు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
