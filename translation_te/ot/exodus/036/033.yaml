translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే నిర్మాణ వివరణకు తగిన గంభీరతతో అనువదించబడింది. హీబ్రూ వాక్యంలోని స్థలసంబంధ భావం, పూర్తి పొడవునా విస్తరించే భావం కాపాడబడ్డాయి; క్రియలోని నిజమైన పదార్థ ప్రత్యామ్నాయాలు పాదసూచికల్లో ఇవ్వబడ్డాయి.
