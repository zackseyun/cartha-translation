lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: కలిపాడు
  rationale: חָבַר అంటే కలపడం లేదా జతచేయడం. నిర్మాణ సందర్భంలో విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘కలిపాడు’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: הַיְרִיעֹת
  choice: తెరలను
  rationale: గుడార నిర్మాణ సందర్భంలో יְרִיעָה పెద్ద వస్త్రపు తెరలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెరలు’ సులభంగా అర్థమయ్యే సందర్భోచిత పదం.
- source_word: לְבָד
  choice: ఒక సమూహంగా … మరో సమూహంగా
  rationale: ఇక్కడ לְבָד విడివిడిగా ఉన్న రెండు ప్రత్యేక జట్లను సూచిస్తుంది. ఐదు తెరలు ఒక జట్టుగా, ఆరు తెరలు మరొక జట్టుగా కలపబడ్డాయని ఈ రూపం స్పష్టంగా తెలుపుతుంది; ‘విడిగా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: חֲמֵשׁ
  choice: ఐదు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: שֵׁשׁ
  choice: ఆరు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: אֶת ... וְאֶת
  choice: రెండు సమన్విత కర్మలుగా నిర్మాణం
  rationale: పునరావృతమైన కర్మ సూచకం ఐదు తెరల జట్టును, ఆరు తెరల జట్టును వేర్వేరు సమన్విత కర్మలుగా చూపుతుంది; తెలుగులో పదక్రమం మరియు ‘మరో’ ద్వారా ఇది వ్యక్తమవుతుంది.
