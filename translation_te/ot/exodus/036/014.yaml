  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: te
  text: అతడు నివాసమందిరంపై గుడారంగా ఉండేలా మేక వెంట్రుకల తెరలను చేశాడు[a]; పదకొండు తెరలను చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేకల తెరలను.” మూలపదం మేకల నుండి వచ్చిన పదార్థాన్ని మాత్రమే సూచిస్తుంది; ఈ వస్త్రాల సందర్భంలో “మేక వెంట్రుకల” అనే అర్థం సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను సహజంగా అందిస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: మందస నిర్మాణ సందర్భంలో పెద్ద వస్త్రపు తెరలను సూచించే సహజమైన, స్థిరమైన పదం.
- source_word: עִזִּים
  choice: మేక వెంట్రుకలతో
  rationale: పదశః ‘మేకలు’ అని ఉన్నా, ఈ వస్త్ర సందర్భంలో నేయబడిన మేక వెంట్రుకలు ఉద్దేశించబడ్డాయని స్పష్టం చేస్తుంది; అసలు పదంలోని సంక్షిప్తతను పాదటిప్పణిలో సూచించాం.
- source_word: לְאֹהֶל
  choice: గుడారంగా ఉండేందుకు
  rationale: לְ ఉపసర్గ ఇక్కడ ప్రయోజనం లేదా కార్యాన్ని సూచిస్తుంది; ప్రత్యేకమైన మరో గుడారాన్ని పరిచయం చేయకుండా ఈ తెరల పనిని తెలియజేస్తుంది.
- source_word: עַל
  choice: పై
  rationale: మందసాన్ని కప్పే పొరగా దాని మీద అమర్చడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందసం
  rationale: నిర్గమకాండలోని పరిశుద్ధ నివాస నిర్మాణానికి వాడే సాంకేతిక పదానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన సమానార్థకం.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: పదకొండు
  rationale: సంఖ్యను నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: אֹתָם
  choice: తెరలను
  rationale: సర్వనామపు సూచనను తెలుగులో నామవాచకాన్ని పునరుక్తి చేసి స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
