translation:
  language: te
  text: అతడు నివాసమందిరం వెనుకనున్న మూలల కోసం రెండు పలకలను చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివాసమందిరం వెనుకనున్న రెండు వైపులలోని మూల పలకల కోసం.’ హీబ్రూ పదాలు నిర్మాణపు వెనుక అంచులను లేదా మూలలను సూచిస్తాయి; అవి మూల స్థానాన్ని గానీ, ప్రత్యేకంగా కలిపిన మూల పలకలను గానీ ప్రధానంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: రెండు
  rationale: సంయోజక వావ్ ముందటి నిర్మాణ వర్ణనను కొనసాగిస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, ‘రెండు’ను స్పష్టంగా ఉంచాం.
- source_word: קְרָשִׁים
  choice: పలకలను
  rationale: మందస నిర్మాణంలో ఉపయోగించిన నిర్మాణాత్మక చెక్క పలకలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పలకలు’ స్పష్టమైన, సహజమైన పదం.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను నిర్మాణ సందర్భానికి తగిన సరళమైన రూపంలో అనువదించాం.
- source_word: לִ/מְקֻצְעֹת
  choice: మూలల కోసం
  rationale: ఈ పదం మూల ప్రాంతాలను లేదా ప్రత్యేకంగా అమర్చిన మూల పలకలను సూచించవచ్చు; ప్రధాన పాఠంలో స్థలార్థాన్ని సహజంగా ఇచ్చి, ప్రత్యామ్నాయ నిర్మాణార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַ/מִּשְׁכָּן
  choice: మందసం
  rationale: నిర్గమకాండంలోని పవిత్ర నివాస నిర్మాణాన్ని సూచించే מִשְׁכָּןకు స్థిరమైన, గౌరవప్రదమైన తెలుగు బైబిలు పదంగా ‘మందసం’ను ఎంచుకున్నాం.
- source_word: בַּ/יַּרְכָתָיִם
  choice: వెనుకవైపు
  rationale: ద్వివచన రూపం నిర్మాణపు వెనుకనున్న రెండు అంచులు లేదా వైపులను సూచిస్తుంది. ‘వెనుకవైపు’ ప్రధాన భావాన్ని సహజంగా తెలుపుతుంది; ద్వివచనంలోని రెండు వెనుక వైపుల భావాన్ని పాదసూచికలో నిలిపాం.
