translation:
  language: te
  text: ప్రతి పలకకు రెండు కలుపు మొనలు[a], ఒకదానికొకటి సరిపోయేలా[b] ఉన్నాయి; నివాసమందిరపు పలకలన్నిటినీ అతడు ఇలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘చేతులు’; ఇక్కడ ప్రతి పలక నుంచి పొడుచుకొచ్చే కలుపు భాగాలు అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒకదానికొకటి ఎదురుగా’; ఇది రెండు మొనల అనురూప అమరికను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: రెండు బిగింపు మొనలు
  rationale: יָדֹת అక్షరార్థంగా ‘చేతులు’; అయితే ఇక్కడ పలకల నుంచి పొడుచుకొచ్చి వాటిని అమర్చడానికి ఉపయోగపడే నిర్మాణ భాగాలను సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యేలా ‘బిగింపు మొనలు’ అని అనువదించాం.
- source_word: קֶּרֶשׁ
  choice: పలక
  rationale: మందిర నిర్మాణంలో ఉపయోగించిన చెక్క నిర్మాణ భాగాన్ని సహజమైన ఆధునిక తెలుగులో ‘పలక’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְשֻׁלָּבֹת
  choice: సరిపోయేలా ఉన్నాయి
  rationale: రెండు మొనలు పరస్పరం అనురూపంగా అమర్చబడిన స్థితిని ఈ పదం సూచిస్తుంది; వాటినే ఒకదానితో ఒకటి కలిపారని అపార్థం కలగకుండా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: אַחַת אֶל אֶחָת
  choice: ఒకదానికొకటి
  rationale: రెండు మొనల మధ్య పరస్పర అనురూపతను తెలియజేస్తూ, వాటి ఖచ్చిత స్థాన విన్యాసాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: כֵּן עָשָׂה
  choice: అతడు ఇలాగే చేశాడు
  rationale: చెప్పిన నమూనాను పలకలన్నిటికీ అనుసరించాడనే హీబ్రూ భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: מִּשְׁכָּן
  choice: మందిరం
  rationale: ఇక్కడ ఇశ్రాయేలీయుల సంచార పరిశుద్ధ నివాస నిర్మాణాన్ని సూచిస్తుంది; తెలుగు బైబిల్ వాడుకలో ‘మందిరం’ సుపరిచితమైన సందర్భోచిత పదం.
