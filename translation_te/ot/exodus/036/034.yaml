  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: te
  text: అతడు ఆ చట్రాలకు బంగారం పొదిగించాడు[a]. వాటి ఉంగరాలను అడ్డకర్రలకు ధారకాలుగా[b] బంగారంతో తయారుచేశాడు; అడ్డకర్రలను బంగారంతో పొదిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పలకలకు.’ హీబ్రూ పదం గుడారపు నిర్మాణంలో ఉపయోగించిన నిలువు చెక్క భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అడ్డకర్రలకు ఇళ్లు’; అంటే అడ్డకర్రలను పట్టి ఉంచే ధారకాలు లేదా స్వీకరణ భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: ఆ చట్రాలు
  rationale: గుడారపు నిలువు నిర్మాణ భాగాలను సూచించే పదం. ఆధునిక తెలుగులో వాటి నిర్మాణ పాత్రను స్పష్టంగా తెలిపేందుకు ‘చట్రాలు’ ఎంచుకున్నాం; ‘పలకలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచనలో ఉంచాం.
- source_word: צִפָּה / וַיְצַף
  choice: పొదిగించాడు
  rationale: ఒక వస్తువుపై బంగారం వంటి పదార్థపు పొరను కప్పడాన్ని ఈ సందర్భంలో సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడాం.
- source_word: זָהָב
  choice: బంగారం
  rationale: సూటి పదార్థనామం. మూలంలో ఉన్న పునరుక్తిని సాధ్యమైనంతగా నిలిపాం.
- source_word: טַבְּעֹתָם
  choice: వాటి ఉంగరాలు
  rationale: చట్రాలకు అమర్చిన లోహపు ఉంగరాలను సూచిస్తుంది; బహువచన ప్రత్యయం ‘వాటి’గా సహజంగా అనువదించబడింది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: ‘చేయడం/తయారుచేయడం’ అనే సాధారణ అర్థాన్ని సందర్భానుగుణంగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בָּתִּים
  choice: ఆధారాలు
  rationale: అక్షరార్థంగా ‘ఇళ్లు’; ఇక్కడ అడ్డకర్రలను స్వీకరించి నిలిపే అమరికలను సూచించే రూపకప్రయోగం. ‘ఆధారాలు’ వాటి కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַבְּרִיחִם
  choice: అడ్డకర్రలకు
  rationale: చట్రాలను కలిపి నిలిపే అడ్డంగా అమర్చిన కర్రలు కావడంతో ‘అడ్డకర్రలు’ స్పష్టమైన, సహజమైన తెలుగు పదం.
