id: EXO.3.19
reference: Exodus 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: te
  text: కానీ ఐగుప్తు రాజు మిమ్మల్ని వెళ్లనివ్వడని నాకు తెలుసు[a]—బలమైన చేయి అతన్ని బలవంతం చేస్తే తప్ప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తు రాజు మిమ్మల్ని వెళ్లనివ్వడు—బలమైన చేయి వల్ల కూడా కాదు”; లేదా, “శక్తిమంతమైన చేయి వల్ల తప్ప.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉంది; అపారమైన బలప్రయోగం మాత్రమే ఫరోను ఒప్పిస్తుందని ఇది నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: కానీ ... నాకు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి సందర్భంలో వ్యత్యాసాన్ని, ఉద్ఘాటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కానీ ... నాకు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יָדַעְתִּי
  choice: తెలుసు
  rationale: పూర్తయిన క్రియారూపం ఇక్కడ దేవుని స్థిరమైన, నిశ్చయమైన జ్ఞానాన్ని సూచిస్తుంది; తెలుగులో వర్తమాన స్థితిని తెలిపే ‘తెలుసు’ సహజం.
- source_word: כִּי
  choice: అని
  rationale: తెలిసిన విషయాన్ని పరిచయం చేసే పూరక సంధిగా అనువదించబడింది.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: మిమ్మల్ని వెళ్లనివ్వడు
  rationale: נתן + ధాతురూపం ఇక్కడ అనుమతించడం అనే నుడికారార్థంలో ఉంది; ‘వెళ్లనివ్వడు’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు
  rationale: హీబ్రూ సంబంధ నిర్మాణానికి నేరుగా, గౌరవప్రదంగా సరిపడే తెలుగు రూపం.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: బలమైన చెయ్యి అతన్ని బలవంతం చేస్తే తప్ప
  rationale: హీబ్రూ వాక్యభాగం అధ్యాహారంగా ఉంది. తదుపరి వచన సందర్భానికి అనుగుణంగా, బలప్రయోగం లేకుండా ఫరో ఒప్పుకోడనే భావాన్ని స్పష్టం చేస్తూనే ‘బలమైన చెయ్యి’ అనే నిర్గమకాండంలోని ముఖ్య రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: וְלֹא בְּיָד חֲזָקָה అనే అధ్యాహార వాక్యభాగపు భావం
  choice: బలమైన చెయ్యి అతన్ని బలవంతం చేస్తే తప్ప ఫరో ఇశ్రాయేలీయులను వెళ్లనివ్వడు.
  alternative: ఫరో బలమైన చెయ్యి చేత కూడా వారిని వెళ్లనివ్వడు; లేదా, బలమైన/శక్తిమంతమైన చెయ్యి వల్ల తప్ప వెళ్లనివ్వడు.
  rationale: 20వ వచనంలో దేవుడు ఐగుప్తును తన అద్భుత కార్యాలతో కొడతానని చెప్పడం, అపారమైన దైవిక బలవంతం వల్లనే ఫరో తలొగ్గుతాడనే పఠనానికి మద్దతిస్తుంది. అయినా మూలంలోని వ్యాకరణ సంక్షిప్తత వల్ల ఇతర పఠనాలు సాధ్యమైనందున వాటిని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘బలమైన చెయ్యి’ అనే మూల రూపకాన్ని నిలిపి, అధ్యాహార వాక్యభాగాన్ని సహజ తెలుగులో కనిష్ఠంగా పూరించాం.
