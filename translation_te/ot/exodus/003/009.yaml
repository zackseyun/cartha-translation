id: EXO.3.9
reference: Exodus 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: te
  text: ఇప్పుడు, ఇదిగో, ఇశ్రాయేలు కుమారుల మొర నా వద్దకు వచ్చింది; వారిపై ఐగుప్తీయులు చేస్తున్న అణచివేతను కూడా నేను చూశాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సందర్భంలోని కొనసాగింపుతో కూడిన కాలసూచక మార్పును తెలుగులో సహజంగా తెలియజేస్తుంది; వాక్యారంభంలో ‘మరియు ఇప్పుడు’ అనడం అనవసరంగా కృత్రిమంగా ఉంటుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయ బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: צַעֲקַת
  choice: మొర
  rationale: బాధలో సహాయం కోసం చేసే కేకను ‘మొర’ సంక్షిప్తంగా, సందర్భోచితంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూలోని కుటుంబపరమైన, పురుషలింగ బహువచన నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בָּאָה אֵלַי
  choice: నా దగ్గరికి వచ్చింది
  rationale: ‘వచ్చింది’ అనే మూల క్రియారూపాన్ని అనవసర వివరణ లేకుండా సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וְגַם
  choice: కూడా
  rationale: మునుపటి ప్రకటనకు అదనంగా దేవుడు చూసినదాన్ని సూచించే బలాన్ని సహజ పదక్రమంలో ఉంచుతుంది.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో అందిస్తుంది; సందర్భం దాని ప్రస్తుత ప్రాముఖ్యతను తెలియజేస్తుంది.
- source_word: הַלַּחַץ
  choice: అణచివేత
  rationale: బలవంతపు ఒత్తిడి, పీడన అనే సామాజిక భావాన్ని సందర్భానికి తగినట్లు వ్యక్తం చేస్తుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: ఇక్కడ బహువచన కర్తృకృదంతంతో అన్వయించే ప్రజలను సూచిస్తున్నందున దేశనామంలోని సమూహార్థాన్ని తెలుగులో వ్యక్తుల బహువచనంగా స్పష్టం చేస్తుంది.
- source_word: לֹחֲצִים
  choice: అణచివేస్తున్న
  rationale: కొనసాగుతున్న చర్యను కృదంత రూపంలో చూపుతూ, సంబంధిత నామవాచకంతో ఉన్న మూలంలోని పదపునరుక్తిని నిలుపుతుంది.
- source_word: אֹתָם
  choice: వారిని
  rationale: ఇశ్రాయేలు కుమారులను సూచించే సజీవ బహువచన కర్మప్రత్యయాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక సంబంధిత లింగసూచక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని కుటుంబపరమైన రూపకాన్నీ పురుషలింగ బహువచనాన్నీ కాపాడుతుంది; దాని ప్రతినిధిత్వ పరిధిని అనువాదంలో ముందుగానే విస్తరించదు లేదా కుదించదు.
- issue: הִנֵּה యొక్క సంభాషణాత్మక బలం
  choice: ఇదిగో
  alternative: చూడండి / నిశ్చయంగా
  rationale: దేవుడు మోషే దృష్టిని విషయంపై నిలిపే సూచనను ఉంచుతుంది; దీనిని కేవలం నిశ్చయార్థక పదంగా మార్చదు.
- issue: మొర దేవుని దగ్గరికి రావడం
  choice: నా దగ్గరికి వచ్చింది
  alternative: నాకు చేరింది
  rationale: మూలంలోని ‘రావడం’ అనే రూపకాన్ని నిలుపుతూ, దేవునికి ఇంతకు ముందు తెలియలేదనే సిద్ధాంతపరమైన నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకుడికి సులభమైన శైలి. మూలంలోని ‘అణచివేత/అణచివేస్తున్నారు’ అనే జ్ఞాతిపద పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు లేనందున గుర్తులు అవసరం లేదు.
