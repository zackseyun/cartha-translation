source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: te
  text: '“నీవు వెళ్లి ఇశ్రాయేలు పెద్దలను సమకూర్చి వారితో ఇలా చెప్పు: ‘మీ పితరుల దేవుడైన యహ్వే—అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడు—నాకు ప్రత్యక్షమై ఇలా అన్నాడు: “నేను మీ పట్ల, ఐగుప్తులో మీకు చేయబడినదాని పట్ల తప్పక శ్రద్ధ చూపాను[a].”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తప్పక శ్రద్ధ చూపాను’ అని అనువదించిన హీబ్రూ పదబంధాన్ని ‘నిశ్చయంగా గమనించాను’ లేదా ‘తప్పక సందర్శించాను’ అని కూడా అనువదించవచ్చు. ఈ పదబంధం క్రియను బలపరుస్తుంది; ఇది కేవలం చూడడం లేదా సామాజికంగా కలవడం కాక, చర్యకు దారితీయగల నిర్ణయాత్మక దైవ శ్రద్ధను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: నువ్వు వెళ్లి … సమకూర్చి
  rationale: ఆజ్ఞారూపాన్ని నేరుగా ఉంచుతూ, వ్యక్తులను ఒకచోట చేర్చడం అనే אָסף భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలను
  rationale: ఇది కేవలం వృద్ధులను కాక సమాజ నాయకులను సూచించే స్థిరమైన సామాజిక-రాజకీయ పదబంధం; ‘పెద్దలు’ తెలుగులో ఆ రెండు భావాలనూ సహజంగా మోస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: తరువాత అబ్రాహాము, ఇస్సాకు, యాకోబులను స్పష్టంగా పేర్కొనడం వల్ల పితృపరంపర భావాన్ని ‘పితరులు’ సరిగ్గా నిలుపుతుంది.
- source_word: נִרְאָה אֵלַי
  choice: నాకు ప్రత్యక్షమై
  rationale: నిఫల్ రూపం ఇక్కడ దైవ ప్రత్యక్షతకు వాడే సాధారణ హీబ్రూ ప్రయోగం; ‘ప్రత్యక్షమై’ సహజంగాను మూలానికి సమీపంగాను ఉంది.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: తప్పక పట్టించుకున్నాను
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ బలమైన నిశ్చయాన్ని తెలియజేస్తుంది. פקד ఇక్కడ కేవలం చూడడాన్ని కాక చర్యకు దారితీసే ఉద్దేశపూర్వక శ్రద్ధను సూచిస్తుంది.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: ఐగుప్తులో మీకు చేయబడుతున్నదాన్ని
  rationale: కర్తను పేర్కొనని హీబ్రూ కర్మణి వర్తమాన కృదంత భావాన్ని నిలుపుతూ, బాధ కొనసాగుతున్న సందర్భాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం పాఠంలోని నామప్రకటన సందర్భాన్ని నిలుపుతుంది.
- issue: פקד క్రియలోని దైవ శ్రద్ధ మరియు జోక్యం
  choice: తప్పక పట్టించుకున్నాను
  alternative: తప్పక సందర్శించాను / నిశ్చయంగా గమనించాను
  rationale: ‘సందర్శించాను’ తెలుగులో సాధారణ రాకను సూచించి భావాన్ని తప్పుదోవ పట్టించవచ్చు; ‘గమనించాను’ చర్యాత్మక శ్రద్ధను బలహీనపరచవచ్చు. ఎంచుకున్న పదబంధం దైవ శ్రద్ధను తెలియజేస్తూ, జోక్యం ఎలా జరుగుతుందో ముందుగానే నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. దేవుడు మోషేతో ఏకవచనంగా మాట్లాడుతున్నందున ‘నువ్వు’ ఉంచబడింది. ఉద్ధరణల పొరలను స్పష్టంగా చూపేందుకు తెలుగు విరామచిహ్నాలు వాడబడ్డాయి.
