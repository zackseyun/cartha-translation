- from: యహ్వే[a] అతడు చూడడానికి పక్కకు తిరిగినట్టు చూసినప్పుడు, దేవుడు ఆ పొద[b] మధ్యనుండి అతనిని పిలిచి, “మోషే, మోషే!” అన్నాడు. అతడు, “ఇదిగో, నేనున్నాను” అన్నాడు.
  to: యహ్వే[a] అతడు చూడడానికి పక్కకు తప్పుకొని వెళ్లాడని చూసినప్పుడు, దేవుడు ఆ పొద[b] మధ్యనుండి అతనిని పిలిచి, “మోషే, మోషే!” అన్నాడు. అతడు, “ఇదిగో, నేను ఇక్కడ ఉన్నాను” అన్నాడు.
