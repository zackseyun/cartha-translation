  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: te
  text: యహ్వే[a] అతడు చూడడానికి పక్కకు తప్పుకొని వెళ్లాడని చూసినప్పుడు, దేవుడు ఆ పొద[b] మధ్యనుండి అతనిని పిలిచి, “మోషే, మోషే!” అన్నాడు. అతడు, “ఇదిగో, నేను ఇక్కడ ఉన్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూ దైవిక నామం יהוה యొక్క లిప్యంతరీకరణ. సంప్రదాయంగా దీనిని ‘యెహోవా’ లేదా ‘ప్రభువు’ అని కూడా అందిస్తారు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం ముళ్ల పొదను మరింత నిర్దిష్టంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה యొక్క సాధారణ దృశ్యార్థాన్ని ఉంచుతూ, כִּיతో కలిసి వచ్చే వాక్యాన్ని సహజమైన తెలుగు కాలవాక్యంగా మలిచాం.
- source_word: כִּי סָר לִרְאוֹת
  choice: అతడు చూడడానికి పక్కకు తిరిగినట్టు
  rationale: כִּיని యహ్వే గమనించిన విషయాన్ని పరిచయం చేసేదిగా, סורను ప్రధాన దారి లేదా దిశనుంచి పక్కకు తిరగడంగా, לִרְאוֹתను ఉద్దేశార్థకంగా అనువదించాం.
- source_word: וַיִּקְרָא אֵלָיו
  choice: అతనిని పిలిచి
  rationale: తెలుగులో సహజంగా వినిపించే రూపాన్ని ఎంచుకున్నాం; సందర్భంలో దేవుడు మోషేను ఉద్దేశించి పిలిచాడనే అర్థం స్పష్టంగా ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ పద్యంలోని יְהוָה మరియు אֱלֹהִים మధ్య ఉన్న మూలపాఠ భేదాన్ని చెరపకుండా రెండవదాన్ని సాధారణ తెలుగు పదమైన ‘దేవుడు’గా ఇచ్చాం.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: ఆ పొద మధ్యనుండి
  rationale: מִתּוֹךְ తెలిపే అంతర్భాగం లేదా మధ్య స్థల భావాన్ని నిలుపుతూ, ఇప్పటికే సందర్భంలో తెలిసిన పొదను ‘ఆ పొద’గా సహజంగా సూచించాం.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: మోషే, మోషే!
  rationale: పేరును రెండుసార్లు పిలిచిన మూలపాఠ రూపాన్ని అలాగే ఉంచి, వ్యక్తిగతమైన గంభీర పిలుపును వ్యక్తం చేశాం.
- source_word: הִנֵּנִי
  choice: ఇదిగో, నేనున్నాను
  rationale: మాట్లాడుతున్నవాని సమక్షతతో పాటు స్పందించడానికి సిద్ధంగా ఉన్న భావాన్ని ఉంచుతుంది; ‘నేను సేవకు సిద్ధం’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ఒకే పద్యంలో יְהוָה మరియు אֱלֹהִים వాడుక
  choice: יְהוָהను ‘యహ్వే’గా, אֱלֹהִיםను ‘దేవుడు’గా వేర్వేరుగా అనువదించాం.
  alternative: రెండింటినీ ‘దేవుడు’గా అనువదించడం లేదా יְהוָהను ‘ప్రభువు’గా ప్రతిస్థాపించడం.
  rationale: మూలపాఠం రెండు దైవిక సూచనలను సమీపంగా వాడినందున, వాటి పదభేదాన్ని నిలుపుకోవడం పాఠ్యపారదర్శకతకు అనుకూలం; ఈ భేదం ఇద్దరు వేర్వేరు వ్యక్తులను సూచిస్తుందని మాత్రం అనువాదం చెప్పదు.
- issue: చివరి וַיֹּאמֶר యొక్క కర్త
  choice: ‘అతడు ... అన్నాడు’ అని ఇచ్చి, సందర్భం ద్వారా మోషేను సూచించాం.
  alternative: స్పష్టత కోసం ‘మోషే ... అన్నాడు’ అని పేరును మళ్లీ చేర్చడం.
  rationale: దైవిక పిలుపుకు జవాబిచ్చేది మోషే అని సంభాషణలో స్పష్టంగా ఉన్నందున, మూలంలోని అంతర్నిహిత కర్తను సహజమైన సర్వనామంతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘పక్కకు తిరిగినట్టు’, ‘పొద మధ్యనుండి’, ‘ఇదిగో, నేనున్నాను’ వంటి రూపాలు మూలంలోని దృశ్య, స్థల, ప్రతిస్పందన భావాలను సహజంగా నిలుపుతాయి.
