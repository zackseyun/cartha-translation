revisions:
- from: అప్పుడు మోషే, “నేను అటు తిరిగి వెళ్లి ఈ గొప్ప దృశ్యాన్ని చూస్తాను; ఈ పొద ఎందుకు కాలిపోవడం లేదో చూస్తాను” అని అనుకున్నాడు.[a]
  to: 'అప్పుడు మోషే ఇలా అన్నాడు: “నేను అటు తిరిగి వెళ్లి ఈ గొప్ప దృశ్యాన్ని చూస్తాను; ఈ పొద ఎందుకు కాలిపోవడం లేదో[a].”'
  rationale: The revision restores the source’s explicit speech verb, keeps Moses’ voluntary intention in idiomatic Telugu, removes the redundant second “చూస్తాను,” and corrects both the placement and wording of the lexical-alternative footnote. It retains the source’s contextual ambiguity between burning and being consumed.
