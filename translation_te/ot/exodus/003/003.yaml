language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה נָּ֣א וְ/אֶרְאֶ֔ה אֶת הַ/מַּרְאֶ֥ה הַ/גָּדֹ֖ל הַ/זֶּ֑ה מַדּ֖וּעַ לֹא יִבְעַ֥ר הַ/סְּנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇలా అన్నాడు: “నేను అటు తిరిగి వెళ్లి ఈ గొప్ప దృశ్యాన్ని చూస్తాను; ఈ పొద ఎందుకు కాలిపోవడం లేదో[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పొద ఎందుకు మండడం లేదు?” లేదా “ఈ పొద ఎందుకు దహించిపోవడం లేదు?”
    reason: హీబ్రూ בער క్రియకు ప్రాథమికంగా ‘మండు/కాలు’ అనే భావం ఉంది. సందర్భంలో పొద మంటలో ఉన్నప్పటికీ దహించిపోకపోవడమే ఆశ్చర్యం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అనుకున్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో మోషే తనలో తాను పలికిన మాట కావడంతో ఆధునిక తెలుగులో ‘అనుకున్నాడు’ సహజంగా ఉంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אָסֻרָה נָּא
  choice: నేను అటు తిరిగి వెళ్లి
  rationale: కోహోర్టేటివ్ రూపం మోషే ఉద్దేశాన్ని తెలియజేస్తుంది. נָא ఇక్కడ సంకల్పాన్ని మృదువుగా వ్యక్తం చేస్తుంది; తెలుగులో వేరుగా ‘దయచేసి’ అని అనువదించడం అసహజం.
- source_word: וְאֶרְאֶה
  choice: చూస్తాను
  rationale: ראה ఇక్కడ దగ్గరకు వెళ్లి పరిశీలనగా చూడడాన్ని సూచిస్తుంది; ‘చూస్తాను’ స్పష్టమైన సహజ సమానార్థకం.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: ఈ గొప్ప దృశ్యాన్ని
  rationale: מַרְאֶה అంటే కనిపిస్తున్న దృశ్యం; גָּדֹל దాని అసాధారణతను ‘గొప్ప’గా నిలుపుతుంది.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సాధారణ ప్రశ్నార్థక పదానికి నేరమైన తెలుగు సమానార్థకం.
- source_word: לֹא יִבְעַר
  choice: కాలిపోవడం లేదు
  rationale: בער Qal యొక్క ప్రాథమిక భావం ‘మండు/కాలు’. సందర్భంలో పొద మంటలో ఉన్నా పూర్తిగా కాలిపోకపోవడమే ఆశ్చర్యం; ‘కాలిపోవడం లేదు’ ఆ ఫలితభావాన్ని సహజంగా తెలియజేస్తుంది, అయితే మూలంలోని భావసాధ్యతలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: הַסְּנֶה
  choice: ఈ పొద
  rationale: סְנֶה ఒక పొదను, బహుశా ముళ్లపొదను, సూచిస్తుంది. మూలం నిర్దిష్ట జాతిని చెప్పనందున ‘పొద’ అతిగా నిర్దిష్టం కాని అనువాదం.
theological_decisions:
- issue: మంటలో ఉన్న పొదకు సంబంధించిన క్రియ యొక్క భావం
  choice: ఈ పొద ఎందుకు కాలిపోవడం లేదో
  alternative: ఈ పొద ఎందుకు మండిపోవడం లేదు / ఎందుకు దహించబడిపోవడం లేదు
  rationale: హీబ్రూ క్రియ నేరుగా ‘మండు/కాలు’ అనే భావాన్ని ఇస్తుంది; సందర్భం పొద పూర్తిగా కాలిపోకపోవడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యం సహజమైన సందర్భార్థాన్ని ఇస్తూ, క్రియలోని నిజమైన ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మోషే తనలో తాను పలికిన మాటను ‘అనుకున్నాడు’గా వ్యక్తం చేశాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
