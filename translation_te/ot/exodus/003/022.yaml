source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: te
  text: ప్రతి స్త్రీ తన పొరుగింటి స్త్రీ దగ్గర నుండి, తన ఇంటిలో నివసిస్తున్న స్త్రీ దగ్గర నుండి వెండి వస్తువులు, బంగారు వస్తువులు[a], బట్టలు అడగాలి[b]. వాటిని మీరు మీ కుమారులకూ కుమార్తెలకూ వేయాలి. అలా మీరు ఐగుప్తును దోచుకుంటారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెండి పాత్రలు, బంగారు పాత్రలు’; హీబ్రూ పదం సాధారణంగా వస్తువులు, సామగ్రి లేదా పాత్రలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన ఇంటిలో తాత్కాలికంగా నివసిస్తున్న/పరదేశిగా ఉన్న స్త్రీ దగ్గర నుండి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఐగుప్తును కొల్లగొడతారు’ లేదా ‘ఐగుప్తును వట్టిగా చేస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: అడగాలి
  rationale: שׁאל అనే క్రియకు ప్రాథమికంగా ‘అడుగు, కోరుకొను’ అనే అర్థం ఉంది. తిరిగి ఇవ్వాలనే భావాన్ని సూచించే ‘అరువు అడుగు’ అని అనువదించకుండా, సందర్భానికి తగిన సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה
  choice: ప్రతి స్త్రీ
  rationale: ఏకవచన నిర్దిష్టతలేని రూపం ఇక్కడ విభజనార్థకంగా ఉంది; ఆధునిక తెలుగులో ‘ప్రతి స్త్రీ’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: తన పొరుగింటి స్త్రీని
  rationale: హీబ్రూ నామవాచకం స్త్రీలింగంలో ఉండి స్త్రీ పొరుగువారిని సూచిస్తుంది; ‘పొరుగింటి స్త్రీ’ ఈ వివరాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: తన ఇంట్లో నివసిస్తున్న స్త్రీని
  rationale: גור ధాతువు నుంచి వచ్చిన ఈ రూపం నివసిస్తున్న లేదా పరదేశిగా ఉంటున్న స్త్రీని సూచించగలదు. ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా నివాస భావాన్ని అందిస్తుంది.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: వెండి వస్తువులు, బంగారు వస్తువులు
  rationale: כְּלִי విస్తృతార్థక పదం; పాత్రలు లేదా నగలకే పరిమితం చేయకుండా ‘వస్తువులు’ అస్పష్టతను నిలుపుతుంది.
- source_word: וּשְׂמָלֹת
  choice: బట్టలు
  rationale: వస్త్రాలకు వాడే సాధారణ పదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְשַׂמְתֶּם עַל
  choice: వాటిని ... వేయాలి
  rationale: שׂים + עַל లోని ‘మీద పెట్టు/వేయు’ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: మీ కుమారులకూ కుమార్తెలకూ
  rationale: మూలంలో కుమారులు, కుమార్తెలు విడిగా పేర్కొనబడ్డారు; రెండింటినీ అలాగే నిలుపుతుంది.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: అలా మీరు ఐగుప్తును దోచుకుంటారు
  rationale: నצל యొక్క పియేల్ రూపం ఇక్కడ దోచుకోవడం లేదా కొల్లగొట్టడం అనే బలమైన భావాన్ని ఇస్తుంది; దానిని మృదువుచేయకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఐగుప్తీయుల వస్తువులను తీసుకోవడంలోని నైతిక/దైవశాస్త్రీయ తీవ్రతను మృదువుచేసే అవకాశం
  choice: అలా మీరు ఐగుప్తును దోచుకుంటారు
  alternative: అలా మీరు ఐగుప్తును కొల్లగొడతారు / వట్టిగా చేస్తారు
  rationale: హీబ్రూ దీనిని కేవలం అరువుగా తీసుకోవడంగా చూపదు; అణచివేతకు ప్రతిఫలంగా జరిగే దోపిడి మరియు స్థితి తారుమారును సూచించే נצל బలాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అరువు అడగాలి’ అనే సంప్రదాయ భావాన్ని నివారించి మూలంలోని ‘అడగాలి’ అనే విస్తృత అర్థాన్ని నిలిపాం. ‘ఐగుప్తును దోచుకుంటారు’ అనే పదబంధం మూలంలోని బలాన్ని మృదువుచేయదు.
