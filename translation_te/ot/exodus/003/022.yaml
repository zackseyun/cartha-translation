revisions:
- from: ప్రతి స్త్రీ తన పొరుగింటి స్త్రీని, తన ఇంట్లో నివసిస్తున్న స్త్రీని వెండి వస్తువులు, బంగారు వస్తువులు[a], బట్టలు అడగాలి. వాటిని మీరు మీ కుమారులకూ కుమార్తెలకూ వేయాలి. అలా మీరు ఐగుప్తును దోచుకుంటారు[b].
  to: ప్రతి స్త్రీ తన పొరుగింటి స్త్రీ దగ్గర నుండి, తన ఇంటిలో నివసిస్తున్న స్త్రీ దగ్గర నుండి వెండి వస్తువులు, బంగారు వస్తువులు[a], బట్టలు అడగాలి[b]. వాటిని మీరు మీ కుమారులకూ కుమార్తెలకూ వేయాలి. అలా మీరు ఐగుప్తును దోచుకుంటారు[c].
  rationale: మూలంలోని రెండు మిన్ (‘నుండి’) సంబంధాలను తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి ‘దగ్గర నుండి’ చేర్చబడింది. దీనివల్ల అర్థభ్రంశం తొలగి, పాఠం సహజమవుతుంది. ఇతర పదాల బలం, ముఖ్యంగా ఐగుప్తును ‘దోచుకుంటారు’ అనే ముగింపు, మార్చబడలేదు. నివసించే స్త్రీకి సంబంధించిన సంభావ్య ‘తాత్కాలిక నివాసి/పరదేశి’ సూక్ష్మతను పాదటిప్పణిలో కాపాడాం.
