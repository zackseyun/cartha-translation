  terminology: ‘తోడుగా ఉంటాను,’ ‘ఐగుప్తు,’ ‘దేవుణ్ణి సేవిస్తారు,’ ‘ఈ పర్వతం మీద’ తగినవి. עבד యొక్క విస్తృతార్థాన్ని ప్రధాన పాఠంలోని ‘సేవిస్తారు’ మరియు పాదసూచికలోని ‘ఆరాధిస్తారు’ సముచితంగా కాపాడుతున్నాయి.
