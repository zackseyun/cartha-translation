  source_fidelity: 'ప్రధాన భావం హీబ్రూ మూలానికి నమ్మకంగా ఉంది: దేవుని తోడ్పాటు వాగ్దానం, పంపబడినదానికి భవిష్యత్‌లో నెరవేరే గుర్తు, మోషే ఏకవచన కర్తగా ప్రజలను ఐగుప్తు నుండి తీసుకురావడం, ఆపై ప్రజల బహువచన సేవ/ఆరాధన అన్నీ సరిగ్గా ప్రతిఫలించాయి. అయితే הָאוֹתకు ‘సూచన’ కంటే సందర్భంలోని నిర్ధారక ‘గుర్తు’ మరింత ఖచ్చితమైనది.'
