source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ כִּֽי אֶֽהְיֶ֣ה עִמָּ֔/ךְ וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת כִּ֥י אָנֹכִ֖י שְׁלַחְתִּ֑י/ךָ בְּ/הוֹצִֽיאֲ/ךָ֤ אֶת הָ/עָם֙ מִ/מִּצְרַ֔יִם תַּֽעַבְדוּ/ן֙ אֶת הָ֣/אֱלֹהִ֔ים עַ֖ל הָ/הָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నేను తప్పకుండా నీకు తోడుగా ఉంటాను. నేనే నిన్ను పంపాననడానికి నీకు గుర్తు ఇదే: నీవు ప్రజలను ఐగుప్తు నుండి బయటకు తీసుకొచ్చినప్పుడు, మీరు ఈ పర్వతం మీద దేవుణ్ణి సేవిస్తారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు ఈ పర్వతం మీద దేవుణ్ణి ఆరాధిస్తారు.” హీబ్రూ క్రియకు ‘సేవించడం’ అనే అర్థమూ, దేవునికి సంబంధించి ‘ఆరాధించడం’ అనే అర్థమూ ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: నేను తప్పకుండా నీకు తోడుగా ఉంటాను
  rationale: ఈ సందర్భంలో כִּי భరోసాను బలపరుస్తుంది; אֶהְיֶה భవిష్యత్తుకు సంబంధించిన దైవసన్నిధి వాగ్దానం. సహజమైన తెలుగులో ‘తోడుగా ఉంటాను’ అనేది సహవాసం, సహాయం రెండింటినీ వ్యక్తపరుస్తుంది.
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: నీకు సూచన ఇదే
  rationale: אוֹת అనేది నిర్ధారించే సూచన లేదా గుర్తును సూచిస్తుంది. ‘సూచన’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, వాక్యంలోని ముందుచూపును కాపాడుతుంది.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: నిన్ను పంపింది నేనే అనడానికి
  rationale: אָנֹכִי అనే స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’ కాపాడుతుంది. ఈ ఉపవాక్యం సూచన నిర్ధారించే విషయాన్ని తెలియజేస్తుంది.
- source_word: בְּהוֹצִיאֲךָ אֶת־הָעָם מִמִּצְרַיִם
  choice: నీవు ప్రజలను ఐగుప్తు నుండి బయటకు తీసుకొచ్చినప్పుడు
  rationale: בְּ + infinitive construct కాలార్థకంగా ‘...చేసినప్పుడు’ అని అర్థమవుతుంది; 2ms ప్రత్యయం ప్రకారం ప్రజలను బయటకు తీసుకొచ్చే కార్యంలో మోషే కర్తగా ఉన్నాడు.
- source_word: תַּעַבְדוּן אֶת־הָאֱלֹהִים
  choice: మీరు దేవుణ్ణి సేవిస్తారు
  rationale: עבד దేవునికి సంబంధించి ‘సేవించడం’ మరియు ‘ఆరాధించడం’ అనే భావాలను కలిగి ఉంటుంది. ‘సేవిస్తారు’ అనే ప్రధాన పాఠం దాని విస్తృతార్థాన్ని కాపాడుతుంది; ఆరాధనా భావాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל הָהָר הַזֶּה
  choice: ఈ పర్వతం మీద
  rationale: עַל యొక్క స్థానార్థాన్ని నేరుగా కాపాడుతూ, కథనంలోని నిర్దిష్టమైన పర్వత స్థలాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన ‘సూచన’ స్వభావం
  choice: నిర్గమం తరువాత ఇదే పర్వతంపై దేవుణ్ణి సేవించడం భవిష్యత్తులో నెరవేరే సూచనగా పాఠంలో ఉంచబడింది.
  alternative: ఈ సూచన దేవుడు ప్రస్తుతం మోషేతో ఉంటానని ఇచ్చిన వాగ్దానం కావచ్చు; లేదా ప్రస్తుత భరోసా, భవిష్యత్తు నెరవేర్పు రెండింటినీ కలిగి ఉండవచ్చు.
  rationale: హీబ్రూ వాక్యనిర్మాణం తరువాతి ఉపవాక్యాన్ని సూచన యొక్క విషయంగా గ్రహించడానికి అనుకూలంగా ఉంది. అయినప్పటికీ సూచనకు దైవసన్నిధి వాగ్దానంతో ఉన్న సంబంధాన్ని పాఠం పూర్తిగా తొలగించదు; అందువల్ల ఆ ఉద్రిక్తతను వివరణతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దేవుని ప్రత్యక్ష వాక్యంలో ఏకవచన ‘నీకు/నిన్ను/నీవు’ నుండి ప్రజలతో కూడిన బహువచన ‘మీరు’కి మారే హీబ్రూ సంఖ్యాభేదం స్పష్టంగా కాపాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
