id: EXO.3.17
reference: Exodus 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: te
  text: 'నేను ఇలా చెప్పాను[a]: ‘మిమ్మల్ని ఐగుప్తులోని బాధ నుండి పైకి తీసుకువచ్చి, కనానీయులు, హిత్తీయులు, అమోరీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు నివసించే దేశానికి, అంటే పాలు తేనె ప్రవహించే దేశానికి తీసుకువెళ్తాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చెప్పాను.” హీబ్రూ క్రియ రూపరీత్యా భూతకాలంలో ఉంది; సందర్భంలో ఇది దేవుడు ముందే చేసిన, ఇప్పుడు కూడా ప్రాసంగికమైన ప్రకటనను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: నేను ఇలా చెప్పాను
  rationale: హీబ్రూ క్రియ రూపరీత్యా భూతకాలంలో ఉంది. సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘నేను ఇలా చెప్పాను’ దానిని నేరుగా నిలుపుతుంది; ఆ ప్రకటనకు సందర్భంలో కొనసాగుతున్న ప్రాసంగికత ఉంది.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: మిమ్మల్ని పైకి తీసుకువచ్చి ... చేర్చుతాను
  rationale: హిఫీల్ రూపంలోని עלה ‘పైకి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. తెలుగులో గమ్యాన్ని సహజంగా కలపడానికి ‘చేర్చుతాను’తో వాక్యం పూర్తిచేయబడింది; ‘పైకి’ అనే నిర్గమన చిత్రణ నిలుపబడింది.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: ఐగుప్తులోని అణచివేత నుండి
  rationale: עֳנִי బాధ, దురవస్థ, అణచివేత అనే అర్థాలను కలిగి ఉంది. ఇక్కడ ఇశ్రాయేలీయుల పరిస్థితికి కారణమైన పీడనను ‘అణచివేత’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: కనానీయులు ... యెబూసీయులు నివసించే దేశానికి
  rationale: హీబ్రూలో ఏకవచన జాతినామాలు ఉన్నా, అవి ఆయా ప్రజలను సూచిస్తున్నాయి. తెలుగులో బహువచన జాతినామాలతో ‘నివసించే దేశం’ అనడం భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశానికి
  rationale: సమృద్ధి, సారవంతతను సూచించే మూలభాష రూపకాన్ని అర్థవంతమైన సంప్రదాయ తెలుగు పదబంధంతో యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక ప్రకటనలోని וָאֹמַר కాలరూపం
  choice: నేను ఇలా చెప్పాను
  alternative: నేను ఇలా చెప్పి ఉన్నాను / నేను సంకల్పించాను
  rationale: మూలంలోని రూపరీత్యా భూతకాలాన్ని ప్రధాన పాఠం నిలుపుతుంది. సందర్భం దీనిని దేవుని స్థిరమైన, ఇంకా ప్రాసంగికమైన ప్రకటనగా చూపుతున్నప్పటికీ, ‘సంకల్పించాను’ అని అనువదించడం మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. జాతినామాలకు విస్తృతంగా గుర్తించదగిన తెలుగు బైబిలు రూపాలు వాడబడ్డాయి. మూలంలోని ‘పైకి తీసుకురావడం’ మరియు ‘పాలు తేనెలు ప్రవహించడం’ అనే చిత్రణలు నిలుపబడ్డాయి.
