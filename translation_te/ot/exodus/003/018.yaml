revisions:
- from: 'వారు నీ మాట వింటారు. అప్పుడు నువ్వు, ఇశ్రాయేలు పెద్దలు కలిసి ఐగుప్తు రాజు దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పాలి: ‘హెబ్రీయుల దేవుడైన యెహోవా మమ్మల్ని కలుసుకున్నాడు.[a] కాబట్టి ఇప్పుడు దయచేసి మమ్మల్ని అరణ్యంలోకి మూడు రోజుల ప్రయాణం వెళ్లనివ్వండి; అక్కడ మా దేవుడైన యెహోవాకు బలి అర్పిస్తాం.’'
  to: 'వారు నీ మాట వింటారు. అప్పుడు నువ్వు, ఇశ్రాయేలు పెద్దలు కలిసి ఐగుప్తు రాజు దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పాలి: ‘హెబ్రీయుల దేవుడైన యాహ్వే మమ్మల్ని కలుసుకున్నాడు.[a] ఇప్పుడు, దయచేసి, మమ్మల్ని మూడు రోజుల ప్రయాణం అరణ్యంలోకి వెళ్లనివ్వండి, మా దేవుడైన యాహ్వేకు బలి అర్పించడానికి.’'
  rationale: The revision aligns the divine name with the POB’s specified “Yahweh” rendering, retains the divine-encounter ambiguity with its alternative in the footnote, removes an unwarranted inferential connector, and expresses the final cohortative’s purposive relation in idiomatic Telugu.
