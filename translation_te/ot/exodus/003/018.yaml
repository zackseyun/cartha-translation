  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: te
  text: 'వారు నీ మాట వింటారు. అప్పుడు నువ్వు, ఇశ్రాయేలు పెద్దలు కలిసి ఐగుప్తు రాజు దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పాలి: ‘హెబ్రీయుల దేవుడైన యాహ్వే మమ్మల్ని కలుసుకున్నాడు.[a] ఇప్పుడు, దయచేసి, మమ్మల్ని మూడు రోజుల ప్రయాణం అరణ్యంలోకి వెళ్లనివ్వండి, మా దేవుడైన యాహ్వేకు బలి అర్పించడానికి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు ఎదురయ్యాడు.” హెబ్రీయ పదబంధం యాహ్వే వారిని కలుసుకోవడం లేదా వారికి ఎదురుపడడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: వారు నీ మాట వింటారు
  rationale: שׁמע పదం వినడం, ఆలకించడం, అనుసరించడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ ‘నీ స్వరానికి’ అనే హెబ్రీయ భాషాప్రయోగాన్ని సహజమైన తెలుగులో ‘నీ మాట వింటారు’ అని ఇచ్చి, సందేశాన్ని వినడమూ అంగీకరించడమూ రెండింటి ఛాయను నిలిపాం.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: నువ్వు, ఇశ్రాయేలు పెద్దలు కలిసి ... వెళ్లి
  rationale: ఏకవచన క్రియ తరువాత మోషేను, పెద్దలను స్పష్టంగా పేర్కొన్న మూల నిర్మాణాన్ని తెలుగులో సహజమైన సమన్వయ కర్తగా ఇచ్చాం; ‘కలిసి’ వారి సంయుక్తంగా వెళ్లడాన్ని స్పష్టం చేస్తుంది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు
  rationale: మూలంలోని construct phrase‌కు స్పష్టమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఇచ్చాం; ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: హెబ్రీయుల దేవుడు
  rationale: జాతి సూచనను, సంబంధ నిర్మాణాన్ని నేరుగా నిలిపే సహజ తెలుగు రూపం.
- source_word: נִקְרָה עָלֵינוּ
  choice: మమ్మల్ని కలుసుకున్నాడు
  rationale: קרא Niphal + על ఇక్కడ ఎదురుపడటం లేదా కలుసుకోవడం అనే భావం ఇస్తుంది. ‘కలుసుకున్నాడు’ దైవసందర్శనను తెలిపినా, ‘పిలిచాడు’ అనే మరింత నిర్దిష్ట భావాన్ని బలవంతంగా చేర్చదు.
- source_word: נֵלֲכָה נָּא
  choice: దయచేసి మమ్మల్ని ... వెళ్లనివ్వండి
  rationale: cohortative మరియు נָא కలిపి ఫరోకు చేసిన మర్యాదపూర్వక అభ్యర్థనను సూచిస్తాయి. తెలుగు సందర్భంలో బహువచన గౌరవ ఆజ్ఞారూపం సహజంగా ఉంటుంది.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల ప్రయాణం
  rationale: ప్రయాణ కాలం లేదా దూరాన్ని సూచించే హెబ్రీయ నుడికారానికి స్పష్టమైన తెలుగు సమానం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోకి
  rationale: చలన క్రియతో ఉన్నందున గమ్యాన్ని సూచించే ‘లోకి’ వాడాం; מִדְבָּר కు ‘అరణ్యం’ విస్తృతమైన బైబిలు సందర్భాన్ని నిలుపుతుంది.
- source_word: וְנִזְבְּחָה
  choice: అక్కడ ... బలి అర్పిస్తాం
  rationale: ముందటి ప్రయాణ అభ్యర్థన ఉద్దేశం బలి అర్పించడమే. తెలుగులో ‘అక్కడ’తో ఈ ఉద్దేశ సంబంధం సహజంగా స్పష్టమవుతుంది; cohortative భావాన్ని సందర్భానుగుణంగా భవిష్యత్ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. బిరుదైన ‘ప్రభువు’తో మార్చకుండా పేరు గానే ఉంచాం; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: נִקְרָה עָלֵינוּ లోని దైవసందర్శన భావం
  choice: మమ్మల్ని కలుసుకున్నాడు
  alternative: మాకు ఎదురయ్యాడు
  rationale: ఈ పదబంధం దైవంతో జరిగిన encounter‌ను తెలియజేస్తుంది; అది తప్పనిసరిగా ‘పిలుపు’ అనే ప్రత్యేక సిద్ధాంతార్థాన్ని నిర్దేశించదు. ప్రధాన పాఠం సహజ రూపాన్ని ఇస్తూ, ప్రత్యామ్నాయ ఛాయను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. దేవుడు మోషేతో మాట్లాడుతున్న సందర్భంలో ‘నువ్వు’ సహజంగా ఉంచి, రాజుతో చేసే అభ్యర్థనలో మర్యాదార్థక ‘వెళ్లనివ్వండి’ వాడాం. ‘నీ స్వరం’ అనే కృత్రిమ అనువాదానికి బదులు ‘నీ మాట’ అని సహజీకరించాం.
