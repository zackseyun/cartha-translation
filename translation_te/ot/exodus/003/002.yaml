source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: te
  text: అప్పుడు యెహోవా దూత[a] పొద మధ్యనుండి అగ్నిజ్వాలలో అతనికి ప్రత్యక్షమయ్యాడు. అతడు చూశాడు; ఇదిగో, ఆ పొద అగ్నిలో మండుతోంది, అయినా అది కాలిపోవడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెహోవా దేవదూత.’ హీబ్రూ పదానికి ‘దూత,’ ‘సందేశవాహకుడు,’ లేదా సందర్భానుసారం ‘దేవదూత’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమయ్యాడు
  rationale: నిఫాల్ రూపం ఇక్కడ ‘కనిపించాడు/ప్రత్యక్షమయ్యాడు’ అనే అర్థాన్ని ఇస్తుంది; దైవ ప్రత్యక్షత సందర్భంలో ‘ప్రత్యక్షమయ్యాడు’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్నీ, కథనంలోని theological ambiguityనూ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని సాధారణ తెలుగు లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చి, ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: సందర్భంలో ఈ సర్వనామం మోషేను సూచిస్తుంది; హీబ్రూ ఉపసర్గతో కూడిన రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּלַבַּת אֵשׁ
  choice: అగ్నిజ్వాలలో
  rationale: లబּת־אשׁలోని ‘అగ్నిజ్వాల’ చిత్రాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉండే రూపం.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: పొద మధ్యనుండి
  rationale: מִתּוֹךְలోని ‘మధ్యనుండి/లోపలినుండి’ భావాన్ని స్పష్టంగా నిలుపుతుంది; סְנֶהకు ‘పొద’ సరైన సాధారణ పదం.
- source_word: וַיַּרְא
  choice: అతడు చూశాడు
  rationale: హీబ్రూ క్రియకు నేరమైన అనువాదం; మోషే గమనించిన తరువాత వచ్చే ఆశ్చర్యకర దృశ్యాన్ని పరిచయం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన దృశ్యంపై దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచిక బలాన్ని కాపాడుతుంది.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: అగ్నిలో మండుతోంది
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను ‘మండుతోంది’ తెలియజేస్తుంది; అగ్ని అనే స్పష్టమైన మూలపదాన్ని కూడా నిలుపుతుంది.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: అది కాలిపోవడం లేదు
  rationale: אכל యొక్క పాసివ్ భావం ఇక్కడ అగ్నిచేత పూర్తిగా దహించబడటం. ‘కాలిపోవడం లేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సూచకంలోని విరోధాభాసాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణలో ఉంచింది.
- issue: దైవ ప్రత్యక్షత సందర్భంలో מַלְאַךְ
  choice: దూత
  alternative: దేవదూత
  rationale: మూలపదం ‘దూత/సందేశవాహకుడు’ అనే విస్తృత అర్థాన్ని కలిగి ఉంది. ‘దూత’ అని ఉంచడం పరలోక సంబంధాన్ని నిరాకరించదు, అలాగే ఆ వ్యక్తి స్వరూపం గురించి కథనం తరువాత సృష్టించే theological tensionను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘ప్రత్యక్షమయ్యాడు,’ ‘ఇదిగో’ వంటి పదాలు బైబిలు కథన గంభీరతను నిలుపుతాయి; వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచబడింది.
