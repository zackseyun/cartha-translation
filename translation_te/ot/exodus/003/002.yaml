  terminology: యְהוָהకు ‘యెహోవా’ అనే స్థిరమైన లిప్యంతరీకరణ, מַלְאָךְకు ‘దూత’ అనే ప్రధాన అనువాదం అనుకూలంగా ఉన్నాయి. పాదటిప్పణిలో ‘దేవదూత’ ప్రత్యామ్నాయం ఇవ్వడం మూలపదం కలిగిన సందర్భోచిత విస్తృతిని తెలియజేస్తుంది; నిర్దిష్ట దైవశాస్త్రీయ గుర్తింపును బలవంతం చేయదు.
