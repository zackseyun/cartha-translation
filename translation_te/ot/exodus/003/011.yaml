source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: te
  text: అయితే మోషే దేవునితో, “ఫరో దగ్గరికి వెళ్లడానికీ, ఇశ్రాయేలు కుమారులను[a] ఐగుప్తులోనుంచి బయటకు తీసుకురావడానికీ నేనెంతటివాడిని?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులను”; సంప్రదాయంగా “ఇశ్రాయేలు సంతానాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన శైలిలో אמר అనే క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; ప్రత్యక్ష సంభాషణకు ‘అన్నాడు’ సరిపోతుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవునితో
  rationale: హీబ్రూలో విభక్తి అర్థం ‘దేవునితో/దేవునికి’; తెలుగు సంభాషణ సందర్భంలో ‘దేవునితో ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: מִי אָנֹכִי
  choice: నేనెంతటివాడిని?
  rationale: మోషే తన అర్హతను ప్రశ్నించే అలంకారప్రశ్నను విస్తరించకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי אֵלֵךְ
  choice: వెళ్లడానికి
  rationale: ‘నేనెంతటివాడిని?’ అనే ప్రశ్నకు సంబంధించిన ఉద్దేశ్య/సంభావ్య కార్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וְכִי אוֹצִיא
  choice: బయటకు తీసుకురావడానికి
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థక భావాన్ని ‘బయటకు తీసుకురావడం’ స్పష్టంగా వ్యక్తం చేస్తుంది; ‘-కీ ... -కీ’ నిర్మాణం రెండు కార్యాల సమాంతరతను కాపాడుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబ/వంశ సంబంధమైన, వ్యాకరణపరంగా పుంలింగ రూపాన్ని స్పష్టంగా నిలుపుతుంది; మరింత సామూహికమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుంచి
  rationale: ‘బయటకు తీసుకురావడం’ అనే క్రియతో కలిసి, ఆ దేశం లోపలి నుంచి వెలుపలికి తీసుకురావడం అనే మూలభావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం
  choice: ఇశ్రాయేలు కుమారులను
  alternative: ఇశ్రాయేలీయులను; ఇశ్రాయేలు సంతానాన్ని
  rationale: మూలంలోని పుంలింగ, వంశావళి సంబంధమైన రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, అది కేవలం చిన్నపిల్లలను సూచిస్తుందనే అపార్థం రాకుండా సామూహిక ప్రత్యామ్నాయాలను పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని రెండు సమాంతర కార్యాలను ‘వెళ్లడానికీ ... తీసుకురావడానికీ’ అనే నిర్మాణంతో నిలిపి, మోషే వ్యక్తం చేసిన అనర్హత భావాన్ని ‘నేనెంతటివాడిని?’ ద్వారా సంక్షిప్తంగా కాపాడాం. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ఇశ్రాయేలు కుమారులను’ అనే పదబంధానికే జతచేయబడింది.
