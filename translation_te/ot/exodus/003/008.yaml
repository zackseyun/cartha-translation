source:
  edition: WLC
  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: te
  text: ఐగుప్తు చేతిలోనుండి[a] అతణ్ణి[b] విడిపించడానికి, ఆ దేశం నుండి అతణ్ణి పైకి తీసుకువెళ్లడానికి, మంచి, విశాలమైన దేశానికి[c]—పాలూ తేనె ప్రవహించే దేశానికి—కనానీయుల, హిత్తీయుల, అమోరీయుల, పెరిజ్జీయుల, హివ్వీయుల, యెబూసీయుల స్థలానికి తీసుకువెళ్లడానికి నేను దిగి వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఐగుప్తు చేతిలోనుండి’ అనేది ఐగుప్తు అధికారం లేదా నియంత్రణ నుండి అని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘విడిపించడానికి,’ ‘పైకి తీసుకువెళ్లడానికి’ అనే రెండు సందర్భాల్లోనూ హీబ్రూ మూలంలో ఏకవచన ప్రత్యయం ఉంది; అది ఇశ్రాయేలు ప్రజలందరినీ ఒక సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మంచి, విస్తారమైన దేశానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: నేను దిగి వచ్చాను
  rationale: దైవిక కదలికను సూచించే ירד అనే స్థలసంబంధ రూపకాన్ని యథాతథంగా నిలుపుతూ, సందర్భానికి సహజమైన పూర్తయిన చర్యగా అనువదించబడింది.
- source_word: לְהַצִּילוֹ
  choice: అతణ్ణి విడిపించడానికి
  rationale: נצל హిఫీల్ రూపంలోని ప్రమాదకరమైన ఆధిపత్యం నుండి రక్షించి బయటకు తేవడం అనే భావాన్ని ‘విడిపించడానికి’ సహజంగా తెలియజేస్తుంది.
- source_word: מִיַּד מִצְרַיִם
  choice: ఐగుప్తు చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే ‘చేతి’ అనే హీబ్రూ నుడికార చిత్రాన్ని తెలుగు పాఠ్యంలో నిలిపింది.
- source_word: וּלְהַעֲלֹתוֹ
  choice: అతణ్ణి పైకి తీసుకువచ్చి
  rationale: עלה హిఫీల్‌లోని ‘పైకి తీసుకురావడం’ అనే భౌగోళిక, కథనాత్మక భావాన్ని కాపాడింది; ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: ఆ దేశం నుండి
  rationale: ముందు ప్రస్తావించిన ఐగుప్తును సూచించే నిర్దేశక పదబంధానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: మంచిదీ విశాలమైనదీ అయిన దేశానికి
  rationale: טובה లోని ‘మంచి’ భావాన్నీ רחבה లోని విస్తారత భావాన్నీ స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశానికి
  rationale: సమృద్ధిని చిత్రించే హీబ్రూ భాగధేయ రూపాన్ని తెలుగు బైబిలు శైలిలో సహజంగా నిలుపుతుంది.
- source_word: אֶל מְקוֹם
  choice: స్థలానికి
  rationale: מקום అనే మూలపదంలోని ‘స్థలం’ భావాన్ని ‘దేశం’ లేదా ‘భూభాగం’గా విస్తరించకుండా కాపాడింది.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: కనానీయుల, హిత్తీయుల, అమోరీయుల, పెరిజ్జీయుల, హివ్వీయుల, యెబూసీయుల
  rationale: హీబ్రూలోని ఏకవచన జాతినామాలు సమష్టి అర్థంలో ఉన్నాయి. తెలుగులో ఒక్కొక్క వ్యక్తిని సూచిస్తున్నట్టు అపార్థం కాకుండా, ఆయా ప్రజాసమూహాలను సహజమైన బహువచన రూపాల్లో ఇచ్చింది.
theological_decisions:
- issue: ‘నేను దిగి వచ్చాను’ అనే దైవిక స్థలసంబంధ కదలిక
  choice: స్థలసంబంధ భాషను యథాతథంగా నిలపడం
  alternative: ‘నేను జోక్యం చేసుకోవడానికి వచ్చాను’ లేదా ‘చర్య తీసుకోవాలని నిర్ణయించాను’ అని భావానువాదం చేయడం
  rationale: మూలపాఠం దేవుని చర్యను సజీవమైన మానవరూప స్థలభాషలో వర్ణిస్తుంది. దానిని భావవివరణగా మార్చకుండా నిలపడం పాఠ్యంలోని ఉద్దేశపూర్వక చిత్రణను గౌరవిస్తుంది.
- issue: ఇశ్రాయేలును సూచించే సమష్టి ఏకవచన ప్రత్యయాలు
  choice: రెండుచోట్లా ‘అతణ్ణి’ అనే ఏకవచనాన్ని నిలపడం
  alternative: ఆధునిక స్పష్టత కోసం ‘వారిని’ అనే బహువచనం వాడడం
  rationale: హీబ్రూ ప్రత్యయాలు ఏకవచనంలో ఉండి, ఇశ్రాయేలు ప్రజలను ఒక సమష్టిగా చూపుతున్నాయి. ఏకవచనాన్ని నిలపడం ఆ సమష్టి చిత్రణను మౌనంగా మార్చకుండా కాపాడుతుంది.
- issue: జాతినామాల హీబ్రూ సమష్టి ఏకవచనం
  choice: తెలుగులో సహజమైన జాతి బహువచన రూపాలు వాడడం
  alternative: ‘కనానీయుడు, హిత్తీయుడు’ మొదలైన వ్యాకరణ ఏకవచన రూపాలు వాడడం
  rationale: హీబ్రూ ఏకవచన జాతినామాలు ప్రజాసమూహాలను సమష్టిగా సూచిస్తాయి. తెలుగులో ఏకవచనం ఒక్కొక్క వ్యక్తిని సూచించే ప్రమాదం ఉన్నందున, బహువచనం మూలంలోని సమష్టి ఉద్దేశాన్ని మరింత ఖచ్చితంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. హీబ్రూ స్థలరూపకాలు, సమష్టి ఏకవచనం, సమృద్ధిని తెలిపే కవితాత్మక చిత్రం నిలుపబడ్డాయి.
