id: EXO.3.7
reference: Exodus 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “ఐగుప్తులో ఉన్న నా ప్రజల బాధను నేను నిశ్చయంగా చూశాను[a]. వారిని అణచివేసేవారి కారణంగా వారి మొరను విన్నాను[b][c]. ఎందుకంటే వారి వేదనలు నాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఉద్ఘాటన కోసం క్రియార్థక నామంతో పాటు అదే క్రియను ఉపయోగించారు; “నేను నిజంగా చూశాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారి ఆక్రందనను విన్నాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “వారిని కఠినంగా పని చేయించేవారి కారణంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించాం.
- source_word: רָאֹה רָאִיתִי
  choice: నేను నిశ్చయంగా చూశాను
  rationale: క్రియార్థక నామం–సమాపక క్రియ కలయికలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עֳנִי
  choice: బాధ
  rationale: దాస్యపు కఠిన పరిస్థితుల వల్ల కలిగిన దుస్థితి, శ్రమ, వేదన అనే విస్తృత భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: దేవునికి ఇశ్రాయేలుతో ఉన్న సంబంధాన్ని సూచించే సహజమైన సమానార్థకం.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో ఉన్న
  rationale: సంబంధ వాక్యంతో ‘నా ప్రజలు’ అనే పదబంధాన్ని సహజంగా విశేషిస్తుంది.
- source_word: צַעֲקָתָם
  choice: వారు పెట్టిన మొర
  rationale: తీవ్ర బాధలో సహాయం కోసం చేసే కేక అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: వారిని అణచివేసేవారి కారణంగా
  rationale: నిర్బంధంగా పని చేయించి వేధించేవారిని సూచించే נֹגְשָׂיו పదాన్నీ, మొరకు కారణాన్ని సూచించే מִפְּנֵי పదబంధాన్నీ కలిపి స్పష్టంగా అందిస్తుంది.
- source_word: כִּי
  choice: వాక్య విభజన ద్వారా కారణార్థ సంబంధం
  rationale: హీబ్రూ כִּי వివరణాత్మకంగా లేదా కారణార్థకంగా చదవవచ్చు; తెలుగులో ప్రత్యేక సంధాయకాన్ని బలవంతంగా చేర్చకుండా తదుపరి వాక్యాన్ని ముందరి ప్రకటనకు ఆధారంగా ఉంచాం.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: వ్యాకరణపరంగా సంపూర్ణ క్రియారూపమైనా, సందర్భంలో దేవుని ప్రస్తుత, వ్యక్తిగత అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: מַכְאֹבָיו
  choice: వారి వేదనలు
  rationale: శారీరక, మానసిక బాధల విస్తృతిని సూచించే బహువచన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: YHWH అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలుపుతూ, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: దేవుని జ్ఞానాన్ని తెలిపే మానవానురూప భాష
  choice: వారి వేదనలు నాకు తెలుసు
  alternative: వారి వేదనలను నేను గమనించాను
  rationale: దేవుని జ్ఞానాన్ని కేవలం నిర్లిప్తమైన అవగాహనగా తగ్గించకుండా, హీబ్రూ వాక్యంలోని వ్యక్తిగతమైన, సన్నిహితమైన భావాన్ని నిలుపుతుంది.
- issue: כִּי యొక్క సంబంధం
  choice: ప్రత్యేక సంధాయకం లేకుండా వివరణాత్మక కొనసాగింపు
  alternative: ఎందుకంటే వారి వేదనలు నాకు తెలుసు
  rationale: כִּי కారణార్థకంగానూ వివరణాత్మకంగానూ ఉండగల అస్పష్టతను అతిగా నిర్ణయించకుండా, తెలుగులో సహజమైన వాక్యక్రమంతో సంబంధాన్ని పాఠకునికి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే సరళమైన వాక్యనిర్మాణం. హీబ్రూ ఉద్ఘాటనను ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘నిర్బంధంగా పని చేయించేవారు’ అనే సందర్భార్థం ‘అణచివేసేవారు’లో సహజంగా సమీకరించబడింది.
