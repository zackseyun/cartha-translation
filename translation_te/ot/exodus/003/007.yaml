revisions:
- from: 'అప్పుడు యెహోవా ఇలా అన్నాడు: “ఐగుప్తులో ఉన్న నా ప్రజల బాధను నేను నిశ్చయంగా చూశాను[a]. వారిని అణచివేసేవారి కారణంగా వారు పెట్టిన మొరను విన్నాను[b]. వారి వేదనలు నాకు తెలుసు.”'
  to: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “ఐగుప్తులో ఉన్న నా ప్రజల బాధను నేను నిశ్చయంగా చూశాను[a]. వారిని అణచివేసేవారి కారణంగా వారి మొరను విన్నాను[b][c]. ఎందుకంటే వారి వేదనలు నాకు తెలుసు.”'
  rationale: ప్రాజెక్టు నిర్ణయించిన దైవనామ లిప్యంతరీకరణను అమలు చేశాను. כִּי యొక్క వాక్యసంబంధాన్ని ‘ఎందుకంటే’తో ప్రతిఫలింపజేశాను; ఇది మూలంలోని ఆధార/వివరణ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది. ఆంగ్ల audit trail‌లో ఉన్న ‘taskmasters’ ప్రత్యామ్నాయానికి ప్రత్యేక పాదటిప్పణి గుర్తును జతచేశాను. ఇతర పదప్రయోగాలు మూలార్థానికీ ఆధునిక ప్రామాణిక తెలుగు వాడుకకీ సరిపోతాయి.
