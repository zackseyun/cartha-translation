revisions:
- from: 'దేవుడు మోషేతో, “నేను ఉన్నవాడనే ఉన్నాను”[a] అని చెప్పాడు. ఇంకా ఆయన, “నువ్వు ఇశ్రాయేలీయులతో[b] ఇలా చెప్పాలి: ‘నేను ఉన్నవాడను’ అనేవాడు నన్ను మీ దగ్గరికి పంపించాడు” అన్నాడు.'
  to: 'దేవుడు మోషేతో, “నేను ఎవరో నేనే”[a] అని చెప్పాడు. ఆయన, “నువ్వు ఇశ్రాయేలు కుమారులకు ఇలా చెప్పాలి: ‘నేను ఉన్నాను’ అనే వాడు నన్ను మీ దగ్గరికి పంపించాడు” అన్నాడు.'
  rationale: The revision corrects the recipient relation, renders the first clause as an idiomatic Telugu equivalent of the repeated self-reference, and preserves the Hebrew imperfect’s possible future sense in a footnote. The shortened designation remains in first-person form and is minimally nominalized for grammatical Telugu.
