  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: te
  text: 'దేవుడు మోషేతో, “నేను ఎవరో నేనే”[a] అని చెప్పాడు. ఆయన, “నువ్వు ఇశ్రాయేలు కుమారులకు ఇలా చెప్పాలి: ‘నేను ఉన్నాను’ అనే వాడు నన్ను మీ దగ్గరికి పంపించాడు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఏమై ఉంటానో అదే ఉంటాను,” లేదా “నేను ఎవరుగా ఉంటానో వారుగానే ఉంటాను.” ఇక్కడి హీబ్రూ క్రియకు వర్తమాన భావంతోపాటు భవిష్యత్ భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో రూపం వ్యాకరణపరంగా బహువచన ఆకృతిలో ఉన్నప్పటికీ ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది; అందువల్ల సహజమైన తెలుగు రూపం ‘దేవుడు’.
- source_word: אֶהְיֶה
  choice: నేను ఉన్నవాడను
  rationale: היה ధాతువు Qal imperfect ప్రథమ పురుష ఏకవచన రూపం వర్తమాన లేదా భవిష్యత్ భావాన్ని మోయగలదు. ఇక్కడ ఇది స్వీయ పరిచయంగా, తరువాత నామంలా మళ్లీ వాడబడుతున్నందున ప్రధాన పాఠ్యంలో వర్తమాన భావం ఉంచబడింది; భవిష్యత్ భావం పాదటిప్పణిలో నిలిపాం.
- source_word: אֲשֶׁר
  choice: -నే
  rationale: אֶהְיֶה אֲשֶׁר אֶהְיֶה అనే పునరుక్త స్వీయ ప్రకటనను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఉన్నవాడనే ఉన్నాను’ అని చెప్పాం. ఇందులోని ‘-నే’ ఆ సంబంధపదం కలిగించే ‘ఎవరైతే/ఏమైతే అదే’ అనే నిర్దిష్టతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כֹּה
  choice: ఇలా
  rationale: తరువాత పలకవలసిన మాటలను పరిచయం చేసే నివేదన సూత్రానికి ఆధునిక తెలుగులో ‘ఇలా’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: תֹאמַר
  choice: నువ్వు ... చెప్పాలి
  rationale: రెండవ పురుష ఏకవచన imperfect ఇక్కడ మోషేకు ఇచ్చిన ఆదేశం. ‘చెప్పాలి’ దాని నిర్దేశక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ జాతీయ సంజ్ఞకు ఆధునిక తెలుగులో సహజమైన సమూహపేరు ‘ఇశ్రాయేలీయులు’. పదశః రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: שְׁלָחַנִי
  choice: నన్ను ... పంపించాడు
  rationale: మూడవ పురుష ఏకవచన perfect రూపం, ప్రథమ పురుష కర్మ ప్రత్యయంతో, పూర్తయిన పంపడాన్ని సూచిస్తుంది. తెలుగులో ‘పంపించాడు’ సందర్భానికి సహజమైన పూర్తిక్రియ.
- source_word: וַיֹּאמֶר
  choice: చెప్పాడు / అన్నాడు
  rationale: వావ్-క్రమ కథనాన్ని తెలుగులో సహజమైన వరుస వాక్యాలుగా కొనసాగిస్తూ, పునరుక్తిని తగ్గించడానికి సమానార్థక నివేదన క్రియలు వాడబడ్డాయి.
theological_decisions:
- issue: దైవ స్వీయ ప్రకటన אֶהְיֶה אֲשֶׁר אֶהְיֶה అనువాదం
  choice: నేను ఉన్నవాడనే ఉన్నాను
  alternative: నేను ఎవరుగా ఉంటానో వారుగా ఉంటాను / నేను ఎలా ఉంటానో అలాగే ఉంటాను
  rationale: హీబ్రూ imperfect‌కు వర్తమాన, భవిష్యత్ భావాలు రెండూ సాధ్యమే. సందర్భంలో ఇది స్వీయ ప్రకటనగా, వెంటనే సంక్షిప్త దైవ సంజ్ఞగా వాడబడుతున్నందున ప్రధాన పాఠ్యంలో నామసదృశ వర్తమాన భావాన్ని ఉంచాం. అయితే భవిష్యత్ దిశలోని నిజమైన అర్థసంభావ్యతను పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
- issue: אֶהְיֶה అనే ప్రథమ పురుష రూపాన్ని రెండో వాక్యంలో నామసదృశంగా చూపడం
  choice: ‘నేను ఉన్నవాడను’ అనేవాడు
  alternative: ‘నేను ఉన్నవాడను’ నన్ను పంపించాడు
  rationale: హీబ్రూలో ప్రథమ పురుష వాక్యభాగమే పంపినవాని సంజ్ఞగా పనిచేస్తుంది. తెలుగులో ఉటంకించిన పూర్తి వాక్యాన్ని కర్తగా నేరుగా ఉంచడం అసహజంగా ఉండటంతో ‘అనేవాడు’ చేర్చి నామసదృశ ప్రయోగాన్ని స్పష్టం చేశాం; దాని ప్రథమ పురుష రూపాన్ని మాత్రం మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దైవ ప్రకటనకు తగిన గంభీరతను కాపాడాం. మోషేను ఉద్దేశించిన ఏకవచనాన్ని ‘నువ్వు’తో, ఇశ్రాయేలీయుల బహువచనాన్ని ‘మీ’తో స్పష్టంగా వేరు చేశాం. దైవ సంజ్ఞను ప్రత్యేక ఆంగ్ల పెద్దక్షరాల సంప్రదాయంతో కాకుండా ఉటంకింపు మరియు వాక్యనిర్మాణం ద్వారా గుర్తించాం.
