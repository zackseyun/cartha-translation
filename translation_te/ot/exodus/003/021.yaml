  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: te
  text: నేను ఈ ప్రజలకు ఐగుప్తీయుల దృష్టిలో మన్నన కలిగిస్తాను[a]. మీరు వెళ్లేటప్పుడు వట్టి చేతులతో వెళ్లరు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఐగుప్తీయుల కళ్లలో.’ అంటే, ఐగుప్తీయులు ఈ ప్రజలను అనుకూలంగా చూసేలా చేస్తాను.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏమీ లేకుండా బయలుదేరరు.’ ఇక్కడి హీబ్రూ నుడికారం వస్తువులు లేకుండా వెళ్లడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: నేను ... కలిగిస్తాను
  rationale: נתן యొక్క మౌలిక భావం ‘ఇవ్వడం’; అయితే חֵן మరియు ‘దృష్టిలో’ అనే నిర్మాణంతో తెలుగులో ‘అనుగ్రహం కలిగిస్తాను’ అనడం సహజంగా ఉండి, దేవుడే ఐగుప్తీయుల వైఖరిని అనుకూలంగా చేస్తాడనే భావాన్ని నిలుపుతుంది.
- source_word: חֵן
  choice: అనుగ్రహం
  rationale: ఇక్కడ חֵן సామాజిక సందర్భంలోని అనుకూలత, ఆదరణను సూచిస్తుంది. ‘అనుగ్రహం’ గౌరవప్రదమైన ఆధునిక తెలుగు పదం; దీనిని కేవలం రక్షణసంబంధమైన ప్రత్యేక పారిభాషిక అర్థానికి పరిమితం చేయకూడదు.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: עָם సమూహంగా ఇశ్రాయేలీయులను సూచిస్తుంది. తెలుగులో సహజమైన బహువచన అన్వయంతో ‘ఈ ప్రజలు’ అని అనువదించబడింది.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: ఐగుప్తీయుల దృష్టిలో
  rationale: అక్షరార్థంగా ‘ఐగుప్తీయుల కళ్లలో’; ఈ హీబ్రూ నుడికారం వారు ఈ ప్రజలను ఎలా చూస్తారో సూచిస్తుంది. ‘దృష్టిలో’ ఆ రూపకాన్ని, భావాన్ని రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: וְהָיָה כִּי
  choice: మీరు వెళ్లేటప్పుడు
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేసే సాధారణ హీబ్రూ నిర్మాణం. తెలుగులో ‘వెళ్లేటప్పుడు’ సంక్షిప్తంగా, సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: మీరు వెళ్లేటప్పుడు / వెళ్లరు
  rationale: הלך యొక్క సరళమైన ‘వెళ్లు’ భావాన్ని ఉంచుతుంది. సందర్భం ఐగుప్తు నుండి బయలుదేరడాన్ని స్పష్టం చేస్తున్నా, మూలంలో లేని అదనపు పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: רֵיקָם
  choice: వట్టి చేతులతో
  rationale: רֵיקָם ఇక్కడ వస్తువులు లేదా సరఫరా ఏమీ లేకుండా బయలుదేరడాన్ని సూచిస్తుంది. తెలుగు నుడికారం ‘వట్టి చేతులతో’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఐగుప్తీయులు’ అనే సుపరిచిత బైబిలు భౌగోళిక-జాతి పదాన్ని ఉంచి, హీబ్రూ నుడికారాలను ప్రధాన పాఠ్యంలో అర్థవంతమైన తెలుగుగా ఇచ్చి, అక్షరార్థ రూపాలను పాదటిప్పణుల్లో సూచించాం.
