  source_fidelity: The draft accurately conveys the future divine action, the Egyptians’ favorable regard toward Israel, and the assurance that Israel will not depart empty-handed. ‘వెళ్లేటప్పుడు’ appropriately renders the future circumstance introduced by וְהָיָה כִּי.
