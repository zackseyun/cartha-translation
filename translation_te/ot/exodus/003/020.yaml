  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: te
  text: నేను నా చెయ్యి చాపి, ఐగుప్తు మధ్యలో నేను చేయబోయే నా అద్భుత కార్యాలన్నిటితో ఐగుప్తును దెబ్బతీస్తాను; ఆ తర్వాత అతడు మిమ్మల్ని పంపివేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు మిమ్మల్ని వెళ్లనిస్తాడు.’ హీబ్రూలో మరింత అక్షరార్థంగా, ‘అతడు మిమ్మల్ని పంపివేస్తాడు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: నేను నా చెయ్యి చాపి
  rationale: శబ్దార్థంగా ‘నా చెయ్యిని పంపి’ అయినప్పటికీ, ఇది చర్యకోసం లేదా శక్తిని ప్రదర్శించడానికి చెయ్యి చాపడాన్ని సూచించే హీబ్రూ నుడికారం. ‘నా చెయ్యి చాపి’ మూలంలోని మానవరూపక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהִכֵּיתִי
  choice: దాన్ని దెబ్బతీస్తాను
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం. రాబోయే తెగుళ్లను దృష్టిలో ఉంచుకొని, మరణం లేదా సంపూర్ణ నాశనాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా ‘దెబ్బతీస్తాను’ అనే పదం భావాన్ని అందిస్తుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: ఇక్కడ వ్యక్తులకన్నా దేశం లేదా రాజ్యం సమష్టిగా కర్మగా ఉంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ఐగుప్తు’ను ఎంచుకున్నాం.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: నా అద్భుత కార్యాలన్నిటితో
  rationale: נפלאות ఆశ్చర్యం కలిగించే అసాధారణ కార్యాలను సూచిస్తుంది. ‘అద్భుత కార్యాలు’ ఆధునిక పాఠకునికి స్పష్టంగా ఉండి, ఇవి దేవుడు చేసే కార్యాలని తెలియజేస్తుంది.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: నేను చేయబోయే
  rationale: సంబంధ వాక్యాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తూ, עשה అనే సాధారణ క్రియ యొక్క సరళతను కాపాడుతుంది.
- source_word: בְּקִרְבּוֹ
  choice: ఐగుప్తు మధ్యలో
  rationale: ఏకవచన ప్రత్యయం సమష్టిగా భావించిన ఐగుప్తును సూచిస్తుంది. తెలుగు వాక్యంలో అస్పష్టమైన సర్వనామాన్ని నివారించడానికి నామాన్ని పునరుక్తి చేసి, దేశం లోపల జరిగే కార్యాల స్థలభావాన్ని నిలిపాం.
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: సంఘటనల క్రమాన్ని సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: అతడు మిమ్మల్ని పంపివేస్తాడు
  rationale: కర్త సందర్భానుసారంగా ఫరో. ‘పంపివేస్తాడు’ అనేది שׁלח యొక్క ప్రాథమిక భావాన్ని, విడుదలతో పాటు అక్కడి నుంచి పంపివేయబడే ఛాయను నిలుపుతుంది; ‘వెళ్లనిస్తాడు’ అనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దేవుని చర్యకు మానవరూపక భాష
  choice: ‘నా చెయ్యి చాపి’ అనే శరీరరూపకాన్ని నిలుపడం
  alternative: ‘నా శక్తిని ప్రదర్శించి’ అని అమూర్తంగా అనువదించడం
  rationale: మూల హీబ్రూ దేవుని జోక్యాన్ని స్పష్టమైన శరీరరూపకంతో వర్ణిస్తుంది. దాన్ని నిలపడం మూలంలోని సాధారణ భావాన్ని గౌరవిస్తుంది; ఏ ప్రత్యేక సిద్ధాంత వివరణనూ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘చెయ్యి చాపి’ అనే మూల రూపకం, ‘ఐగుప్తు మధ్యలో’ అనే స్థలభావం, చివరి క్రియలోని పంపివేత భావం నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
