source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “ఇటు దగ్గరకు రావద్దు.[a] నీ పాదాలనుండి నీ చెప్పులను తీసివేయి. ఎందుకంటే నీవు నిలబడి ఉన్న స్థలం పవిత్రమైన నేల.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇటు సమీపించవద్దు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పవిత్రత యొక్క నేల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ఆయన ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: ఇటు దగ్గరకు రావద్దు
  rationale: నిషేధార్థక రూపం సమీపించవద్దనే ఆజ్ఞను ఇస్తుంది; הֲלֹם ఈ ప్రదేశం వైపు అనే దిశాభావాన్ని కలిగి ఉంది. ‘ఇటు దగ్గరకు’ ఈ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁל
  choice: తీసివేయి
  rationale: ఆజ్ఞారూప క్రియకు తీసివేయడం లేదా విప్పివేయడం అనే భావం ఉంది. పాదరక్షల సందర్భంలో ‘తీసివేయి’ సహజమైన సమానార్థకం.
- source_word: נְעָלֶיךָ
  choice: నీ ... చెప్పులను
  rationale: ఈ పదం ప్రాచీన కాలపు పాదరక్షలను, సాధారణంగా చెప్పులను సూచిస్తుంది. ‘చెప్పులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి సాంస్కృతిక దృశ్యాన్ని నిలుపుతుంది.
- source_word: מֵעַל רַגְלֶיךָ
  choice: నీ కాళ్లకున్న
  rationale: మూలంలోని ‘నీ కాళ్ల మీదినుంచి’ అనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; తీసివేయి అనే క్రియతో తొలగింపు భావం స్పష్టమవుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తీసివేయాలనే ఆజ్ఞకు కారణాన్ని పరిచయం చేసే కారణార్థక బంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: నీవు నిలబడి ఉన్న స్థలం
  rationale: మోషే ప్రస్తుతం నిలిచి ఉన్న నిర్దిష్ట ప్రదేశాన్ని సహజమైన తెలుగు సంబంధవాక్యంతో తెలియజేస్తుంది.
- source_word: אַדְמַת קֹדֶשׁ
  choice: పవిత్రమైన నేల
  rationale: నిర్మాణ సంబంధ పదబంధం అక్షరార్థంగా ‘పవిత్రతగల నేల.’ ‘పవిత్రమైన నేల’ దాని భావాన్ని స్పష్టంగా, గంభీరంగా, సహజంగా అందిస్తుంది.
- source_word: הוּא
  choice: స్థలం ... నేల
  rationale: హీబ్రూ సర్వనామం నామవాచక వాక్యంలో అనుసంధాన పాత్ర పోషిస్తుంది. తెలుగులో ప్రత్యేక అనుసంధాన క్రియ లేకుండానే ‘స్థలం పవిత్రమైన నేల’ అని సహజంగా చెప్పవచ్చు.
theological_decisions:
- issue: ఆ ప్రదేశపు పవిత్రత స్వభావం
  choice: ‘నీవు నిలబడి ఉన్న స్థలం పవిత్రమైన నేల’ అని వివరణ జోడించకుండా వర్ణనాత్మకంగా అనువదించడం
  alternative: ఆ పవిత్రత దేవుని సన్నిధివల్ల కలిగిందని అనువాదంలోనే స్పష్టంగా చెప్పడం
  rationale: వచనం ఆ నేల పవిత్రమైనదని ప్రకటిస్తుంది; అయితే ఈ వచనంలోనే దాని విధానాన్ని వివరణాత్మకంగా నిర్ధారించదు. అందువల్ల మూలపాఠంలోని ప్రకటనను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. దేవుని ప్రసంగానికి అనవసరమైన వ్యాఖ్యానాత్మక విస్తరణలు చేర్చలేదు; ‘చెప్పులు,’ ‘నేల’ వంటి సులభమైన పదాలతో మూలంలోని దృశ్య స్పష్టతను నిలిపాం.
