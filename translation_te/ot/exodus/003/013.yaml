id: EXO.3.13
reference: Exodus 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: te
  text: 'అప్పుడు మోషే దేవునితో ఇలా అన్నాడు: “ఇదిగో, నేను ఇశ్రాయేలీయుల దగ్గరికి వెళ్లి, ‘మీ పితరుల దేవుడు నన్ను మీ దగ్గరికి పంపాడు’ అని వారితో చెప్పినప్పుడు, వారు నన్ను, ‘ఆయన పేరు ఏమిటి?’ అని అడిగితే, నేను వారికి ఏమని చెప్పాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: మోషే ప్రతిపాదిస్తున్న పరిస్థితిపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ సమూహ ప్రజలను సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన జాతివాచక రూపం వాడబడింది.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: పూర్వీకుల ఒడంబడిక సంబంధాన్ని సూచించే మూలపాఠ నిర్మాణాన్ని దగ్గరగా కాపాడుతుంది; ‘పితరులు’ బైబిలు సందర్భానికి తగిన గౌరవప్రద పదం.
- source_word: מַה שְּׁמוֹ
  choice: ఆయన పేరు ఏమిటి?
  rationale: దైవనామాన్ని గురించి అడిగే ప్రత్యక్ష ప్రశ్నను ఎటువంటి అదనపు వ్యాఖ్యానమూ లేకుండా నిలుపుతుంది.
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: నేను వారికి ఏమని చెప్పాలి?
  rationale: హీబ్రూ అసంపూర్ణ క్రియలోని ఆలోచనాత్మక/కర్తవ్య భావాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన పేరు ఏమిటి?’ అనే ప్రశ్న యొక్క భావం
  choice: ప్రశ్నను యథాతథంగా, వివరణ జోడించకుండా అనువదించడం
  alternative: ‘ఆయన స్వభావం ఏమిటి?’ లేదా ‘ఆయన ఎవరు?’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: שֵׁם అనే పదం పేరు, ఖ్యాతి లేదా వ్యక్తిత్వాన్ని సూచించగలిగినా, ఈ సందర్భంలో ప్రత్యక్షంగా దైవనామాన్ని అడుగుతుంది; తదుపరి వచనం ఇచ్చే సమాధానాన్ని ముందుగానే తీర్మానించకూడదు.
- issue: ‘మీ పితరుల దేవుడు’లో ఒడంబడిక సూచన
  choice: మూలపాఠంలోని సంబంధపూర్వక వాక్యరూపాన్ని నిలుపడం
  alternative: ‘మీ పూర్వీకులు ఆరాధించిన దేవుడు’ అని విస్తరించడం
  rationale: విస్తృత రూపం ఆరాధన అనే భావాన్ని మూలంలో లేనంత స్పష్టంగా చేర్చుతుంది; సంక్షిప్త రూపం చారిత్రక, వంశపారంపర్య మరియు ఒడంబడిక సంబంధాల మధ్య ఉన్న భావసంపదను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా వాక్యక్రమాన్ని సహజీకరించగా, సంభాషణలోని గంభీరతను మరియు మూలపాఠపు ప్రత్యక్ష ప్రశ్నలను కాపాడింది. ‘పితరులు’ అనే పదం బైబిలు సందర్భానికి తగిన గౌరవప్రద శైలిని నిలుపుతుంది.
