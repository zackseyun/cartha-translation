id: EXO.3.6
reference: Exodus 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నేను నీ తండ్రి దేవుడను, అబ్రాహాము దేవుడను, ఇస్సాకు దేవుడను, యాకోబు దేవుడను.” మోషే తన ముఖాన్ని దాచుకున్నాడు, ఎందుకంటే దేవునివైపు చూడడానికి అతడు భయపడ్డాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ఆయన ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; ‘ఇలా అన్నాడు’ తరువాతి ప్రత్యక్ష వాక్యాన్ని సునిశితంగా పరిచయం చేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర సర్వనామం ఉద్ఘాటన కలిగినది. తెలుగులో నామవాచక విధేయ వాక్యంలో వర్తమాన అనుసంధాన క్రియను విడిచిపెట్టి ‘నేను ... దేవుణ్ణి’ అనడం సహజంగా ఉండి ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: నీ తండ్రి దేవుణ్ణి
  rationale: ఏకవచన ప్రత్యయాన్ని యథాతథంగా నిలిపి, హీబ్రూ నిర్మాణంలోని సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి
  rationale: మూలంలో ప్రతి పితరుని పేరుతో ‘దేవుడు’ పునరుక్తమవుతుంది. దాని వాక్చాతుర్య, నిబంధనాత్మక బరువును తగ్గించకుండా తెలుగులోనూ పునరుక్తిని నిలిపాం.
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: తన ముఖాన్ని దాచుకున్నాడు
  rationale: హిఫిల్ క్రియ యొక్క ‘దాచు/మరుగుచేయు’ అర్థాన్ని, פָּנָיו యొక్క ప్రత్యక్ష ‘అతని ముఖం’ అర్థాన్ని సహజమైన తెలుగు ప్రతిబింబక నిర్మాణంతో అందిస్తుంది.
- source_word: כִּי יָרֵא
  choice: భయపడి
  rationale: 'కారణ సంబంధాన్ని తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో తెలియజేస్తుంది: దేవునివైపు చూడటానికి భయపడినందువల్ల ముఖాన్ని దాచుకున్నాడు.'
- source_word: מֵהַבִּיט אֶל
  choice: వైపు చూడడానికి
  rationale: יָרֵא తరువాత מן కలిగిన క్రియానామం భయపడిన కార్యాన్ని సూచిస్తుంది. ‘వైపు చూడడానికి’ అనేది אֶל యొక్క దిశాత్మక ఛాయను నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో పొదలోనుండి మాట్లాడుతున్న పితరుల దేవుడే నిర్దిష్ట సూచ్యుడు; అందువల్ల సాధారణ దైవసత్త కంటే ‘దేవుడు’ సరైనది.
theological_decisions:
- issue: ప్రత్యక్ష దైవ స్వపరిచయంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దైవసత్త
  rationale: మాట్లాడుతున్నవాడు అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడని సందర్భమే స్పష్టంగా గుర్తిస్తోంది. ‘దేవుడు’ మూలంలోని నిర్దిష్ట నిబంధనాత్మక గుర్తింపును నిలుపుతుంది; అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: పితరుల సూత్రంలో ‘దేవుడు’ అనే పద పునరుక్తి
  choice: అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి
  alternative: అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుణ్ణి
  rationale: సంక్షిప్త రూపం తెలుగులో సహజమైనదైనా, మూలంలోని మూడుసార్ల పునరుక్తి ప్రతి పితరుతోనున్న సంబంధాన్ని ప్రత్యేకంగా ఉద్ఘాటిస్తుంది; అందువల్ల దానిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘దేవుణ్ణి’ అనే వ్యవహారిక-ప్రామాణిక ద్వితీయావిభక్తి రూపం పునరుక్త నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది. మూలంలో లేని వివరణను చేర్చలేదు; ఈ వచనానికి పాఠాంతర లేదా అవసరమైన వివరణాత్మక పాదటిప్పణి లేదు.
