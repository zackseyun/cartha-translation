id: EXO.3.1
reference: Exodus 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: te
  text: మోషే తన మామయైన మిద్యాను యాజకుడు యిత్రోకు చెందిన మందను మేపుతూ ఉండేవాడు. అతడు మందను అరణ్యం దాటి[a] నడిపిస్తూ వెళ్లి, దేవుని పర్వతమైన హోరేబుకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యానికి అవతలి వైపునకు.’
    reason: אַחַר הַמִּדְבָּר అనే స్థలసంబంధ పదబంధానికి సాధ్యమైన మరింత పదక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: మోషే
  rationale: వావ్ ఇక్కడ కొత్త కథా దృశ్యాన్ని ప్రారంభిస్తుంది. తెలుగులో కృత్రిమంగా ‘మరియు’ లేదా మూలంలో లేని ‘ఇప్పుడు’ చేర్చకుండా సహజంగా వ్యక్తి పేరుతో వాక్యాన్ని ప్రారంభించాం.
- source_word: הָיָה רֹעֶה
  choice: మేపుతూ ఉండేవాడు
  rationale: కొనసాగుతున్న గతకాల క్రియను, పశువుల మందను మేపే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: צֹאן
  choice: మంద
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమూహంగా సూచించగలదు. ‘మంద’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: తన మామయైన … యిత్రో
  rationale: חֹתְנוֹ వివాహబంధంలోని పురుష బంధువును సూచిస్తుంది; సందర్భంలో యిత్రో మోషే భార్య తండ్రి కాబట్టి ‘మామ’ సహజమైన, సందర్భోచితమైన ఎంపిక.
- source_word: כֹּהֵן מִדְיָן
  choice: మిద్యాను యాజకుడు
  rationale: యిత్రోను గుర్తించే సమాసపదబంధాన్ని సంక్షిప్తంగా, నేరుగా అందిస్తుంది.
- source_word: וַיִּנְהַג
  choice: తోలుకొని వెళ్లి
  rationale: נהג మందను నడిపించడం లేదా తోలడం అనే భావాన్ని ఇస్తుంది. మంద కదలికకు ‘తోలుకొని వెళ్లి’ సహజంగా సరిపోతుంది.
- source_word: אַחַר הַמִּדְבָּר
  choice: అరణ్యం దాటి
  rationale: స్థలసంబంధ సందర్భంలో అరణ్యానికి అవతల లేదా దాని వెనుకవైపు వెళ్లిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַר הָאֱלֹהִים
  choice: దేవుని పర్వతం
  rationale: హీబ్రూ సమాసాన్ని నేరుగా అనువదించి, ఆ పర్వతం అప్పటికే పవిత్రంగా గుర్తించబడిందా లేక కథనం ముందుగానే అలా పిలుస్తుందా అనే సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: חֹרֵבָה
  choice: హోరేబుకు
  rationale: స్థలదిశను తెలిపే ה־ָה ప్రత్యయాన్ని తెలుగులో ‘కు’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: הַר הָאֱלֹהִים అనే పదబంధం పర్వతం అప్పటికే పవిత్రమైనదని సూచిస్తుందా, లేక తరువాతి ప్రాముఖ్యతను ముందుగానే పేరుగా వాడుతుందా?
  choice: దేవుని పర్వతం
  alternative: పవిత్ర పర్వతం
  rationale: మూలంలోని ‘దేవుని’ అనే సంబంధాన్ని నేరుగా నిలుపుతూ, పర్వత పవిత్రతకు సంబంధించిన కథనాత్మక, కాలసంబంధ ప్రశ్నను అనువాదంలో తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన బైబిలు కథన శైలిని నిలుపుతూ రూపొందించబడింది. వ్యక్తిపేర్లు ప్రాచుర్యంలో ఉన్న తెలుగు రూపాల్లో ఇవ్వబడ్డాయి.
