- from: కాబట్టి ఇప్పుడు వెళ్లు; నేను నిన్ను ఫరో దగ్గరికి పంపుతాను. నా ప్రజలైన ఇశ్రాయేలు కుమారులను[a] ఐగుప్తు నుండి బయటకు తీసుకురా.
  to: ఇప్పుడు వెళ్లు; నేను నిన్ను ఫరో వద్దకు పంపుతాను; నా ప్రజలైన ఇశ్రాయేలు కుమారులను[a] ఐగుప్తు నుండి బయటకు తీసుకురా.
