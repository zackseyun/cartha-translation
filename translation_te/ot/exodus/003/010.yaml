  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: te
  text: ఇప్పుడు వెళ్లు; నేను నిన్ను ఫరో వద్దకు పంపుతాను; నా ప్రజలైన ఇశ్రాయేలు కుమారులను[a] ఐగుప్తు నుండి బయటకు తీసుకురా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా, “ఇశ్రాయేలీయులను.” హీబ్రూలో: “ఇశ్రాయేలు కుమారులను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: వావ్ సంధానార్థాన్ని, עַתָּה సూచించే ప్రస్తుత దశకు మార్పును సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: לְכָה
  choice: వెళ్లు
  rationale: הלך ఆజ్ఞారూపం ఇక్కడ మోషేను ఫరో దగ్గరికి వెళ్లమని పంపే సందర్భంలో ఉంది; లక్ష్యస్థానం దేవుని సమక్షానికి వెలుపల ఉన్నందున తెలుగులో ‘వెళ్లు’ సహజం.
- source_word: וְאֶשְׁלָחֲךָ
  choice: నేను నిన్ను ... పంపుతాను
  rationale: మొదటి పురుష ఏకవచన అసంపూర్ణ క్రియను, రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తూ దైవిక నియామకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి
  rationale: దిశను సూచించే אֶל భావాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהוֹצֵא
  choice: బయటకు తీసుకురా
  rationale: יצא హిఫీల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని—వారిని బయటికి వచ్చేలా చేయడం—సహజంగా నిలుపుతుంది.
- source_word: עַמִּי
  choice: నా ప్రజలైన
  rationale: ‘నా ప్రజలు’ అనే ఒడంబడిక సంబంధ భాషను నిలుపుతూ, తరువాతి ‘ఇశ్రాయేలు కుమారులు’ అదే ప్రజలను వివరిస్తున్న సమానాధికార నిర్మాణాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని పుంలింగ కుటుంబ సంబంధ పదబంధాన్ని, దాని వంశపారంపర్య మరియు ఒడంబడిక భావంతో సహా నిలుపుతుంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: מִן యొక్క మూలస్థాన భావాన్ని, הוֹצֵא తో కలిసిన బయలుదేరే కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక ప్రజల పేరును ఎలా అనువదించాలి
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ, వంశపారంపర్య రూపాన్ని లింగనిర్దిష్టతతో నిలుపుతుంది; సాధారణ జాతి పేరు అయిన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దైవిక ఆజ్ఞలో ఏకవచన సంబోధనను ఉపయోగించి, మూలంలోని సంక్షిప్తతను మరియు వరుస ఆజ్ఞలను నిలిపింది.
