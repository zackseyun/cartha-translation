reference: Exodus 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: te
  text: 'దేవుడు మోషేతో ఇంకా ఇలా అన్నాడు: “నీవు ఇశ్రాయేలు కుమారులతో ఇలా చెప్పాలి: ‘మీ పితరుల దేవుడైన యాహ్వే[a]—అబ్రాహాము దేవుడు, ఇస్సాకు దేవుడు, యాకోబు దేవుడు—నన్ను మీ వద్దకు పంపించాడు.’ ఇదే ఎప్పటికీ నా పేరు; తరతరాలకు ఇదే నా జ్ఞాపకార్థ నామం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఈ దైవనామం יהוה (YHWH) అనే నాలుగు హల్లులతో వ్రాయబడుతుంది; దాని ఉచ్చారణ సాధారణంగా “యాహ్వే” అని పునర్నిర్మించబడింది. సంప్రదాయంగా “ప్రభువు” లేదా “యెహోవా” అని కూడా అనువదించారు.
    reason: దైవనామపు మూలరూపం, పునర్నిర్మిత ఉచ్చారణ, సంప్రదాయ ప్రత్యామ్నాయాలను తెలియజేయడం.
  - marker: b
    text: లేదా “నా జ్ఞాపకం,” లేక “నన్ను స్మరించే పేరు.”
    reason: זִכְרִי అనే హీబ్రూ పదం జ్ఞాపకం, స్మరణ, లేదా స్మరించబడే నామం అనే భావాలను సందర్భానుసారం సూచించగలదు.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ బంధుత్వ పదంలోని పుంలింగ రూపాన్ని నిలుపుతూ, తెలుగులో స్పష్టంగా అర్థమయ్యే విధంగా అనువదించింది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: మూలంలోని ‘పితరులు’ అనే స్పష్టమైన పుంలింగ బంధుత్వ పదాన్ని కాపాడింది.
- source_word: שְׁלָחַנִי
  choice: నన్ను మీ దగ్గరకు పంపించాడు
  rationale: పూర్తయిన దైవ నియామకాన్ని సహజమైన ఆధునిక తెలుగు వాక్యరూపంలో వ్యక్తం చేస్తుంది.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: ఇదే ఎప్పటికీ నా పేరు
  rationale: לְעֹלָם సూచించే నిరంతర కాలవ్యాప్తిని సహజంగా ‘ఎప్పటికీ’ అని అందించింది.
- source_word: זִכְרִי
  choice: నా స్మరణ నామం
  rationale: ‘జ్ఞాపకం/స్మరణ’ అనే మూలభావాన్ని, సందర్భంలో దేవుడు ఏ నామంతో స్మరించబడతాడనే భావాన్ని కలిపి వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְדֹר דֹּר
  choice: తరతరాలకు
  rationale: తరాల పరంపర అంతటా కొనసాగడాన్ని సంక్షిప్తమైన సహజ తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: כֹּה תֹאמַר
  choice: ఇలా చెప్పాలి
  rationale: దైవ ఆదేశపు బలాన్ని నిలుపుతూ, కృత్రిమంగా పురాతనంగా అనిపించని ఆధునిక తెలుగు రూపాన్ని ఉపయోగించింది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: దేవుని ప్రసంగం కొనసాగుతోందనే సంభాషణాత్మక అర్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָהను ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం ఇక్కడ వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతోంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం ప్రకటనలోని నామప్రాధాన్యాన్ని కాపాడుతుంది.
- issue: ఇశ్రాయేలు సమాజాన్ని సూచించే పుంలింగ బంధుత్వ పదాలు
  choice: ఇశ్రాయేలు కుమారులు / మీ పితరులు
  alternative: ఇశ్రాయేలీయులు / మీ పూర్వీకులు
  rationale: మూలంలో ఉన్న స్పష్టమైన పుంలింగ బంధుత్వ రూపాలను ప్రధాన పాఠంలో నిలిపింది; ఇవి సందర్భంలో సమూహాన్ని ప్రతినిధిగా సూచిస్తాయి.
- issue: זִכְרִי యొక్క భావవ్యాప్తి
  choice: నా స్మరణ నామం
  alternative: నా జ్ఞాపకం; నన్ను స్మరించే పేరు
  rationale: ఈ పదం ‘జ్ఞాపకం’తో పాటు దేవుడు ఏ నామంతో తరతరాలకు స్మరించబడతాడనే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠం రెండింటినీ సూచించేలా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. దైవ ప్రసంగానికి తగిన గంభీరతను నిలిపి, అతిగా పురాతనమైన క్రియారూపాలను నివారించింది. గీతలు దేవుని వివరణాత్మక బిరుదులను స్పష్టంగా విభజిస్తాయి.
