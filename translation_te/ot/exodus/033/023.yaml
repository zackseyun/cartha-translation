id: EXO.33.23
reference: Exodus 33:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: te
  text: అప్పుడు నేను నా చేతిని తొలగిస్తాను; నీవు నా వెనుక భాగాన్ని[a] చూస్తావు. అయితే నా ముఖం కనిపించదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా వెనుక ఉన్నదాన్ని.” హీబ్రూ పదం వెనుక భాగాన్ని లేదా వెనుకవైపు ఉన్నదాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: అప్పుడు నేను తొలగిస్తాను
  rationale: సוּר ధాతువు హిఫీల్ రూపంలో ‘తొలగించు/వెనక్కి తీసుకో’ అనే భావం ఇస్తుంది. ముందటి వాక్యంలోని క్రమాన్ని వావ్ కొనసాగిస్తున్నందున ‘అప్పుడు’ సహజంగా ఆ వరుసను తెలియజేస్తుంది.
- source_word: כַּפִּי
  choice: నా చేతిని
  rationale: כַּף అంటే ‘అరచేయి’ లేదా విస్తృతంగా ‘చెయ్యి.’ ముందటి వచనంలోని కప్పి ఉంచే దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో ‘చేతిని’ నిలుపుతుంది.
- source_word: וְרָאִיתָ
  choice: నీవు ... చూస్తావు
  rationale: భవిష్యత్ సందర్భాన్ని కొనసాగించే ఈ రూపం ఫలితంగా జరిగే దర్శనాన్ని సూచిస్తుంది; అందువల్ల భవిష్యత్ భావంతో అనువదించబడింది.
- source_word: אֲחֹרָי
  choice: నా వెనుక భాగాన్ని
  rationale: ఈ పదం వెనుక భాగాన్ని లేదా వెనుక ఉన్నదాన్ని సూచించగలదు. ప్రధాన పాఠంలో శరీరరూపకాన్ని నిలిపి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో తెలియజేశాము.
- source_word: וּפָנַי
  choice: అయితే నా ముఖం
  rationale: వావ్ ఇక్కడ చూడగల దానికీ చూడలేని ముఖానికీ మధ్య వ్యతిరేకతను సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לֹא יֵרָאוּ
  choice: కనిపించదు
  rationale: రָאָה నిఫాల్ రూపం క్రియను కర్మణి భావంలో ‘చూడబడదు/కనిపించదు’ అని తెలియజేస్తుంది. ‘ముఖం’ ఏకవచన భావానికి తెలుగులో ‘కనిపించదు’ సహజమైన రూపం.
theological_decisions:
- issue: దేవుని గురించి మానవరూప పదప్రయోగం
  choice: ‘చెయ్యి,’ ‘వెనుక భాగం,’ ‘ముఖం’ అనే స్పష్టమైన రూపకాలను ప్రధాన పాఠంలో నిలిపాము.
  alternative: శరీరార్థ సూచనను తగ్గించేందుకు ‘సన్నిధి,’ ‘వెనుక మిగిలిన మహిమ’ వంటి అమూర్త పదాలను వాడటం.
  rationale: హీబ్రూ మూలపాఠమే ఈ మానవరూప చిత్రణను ఉపయోగిస్తుంది. దానిని అమూర్తంగా మార్చకుండా ఉంచడం ద్వారా దేవుని స్వీయప్రత్యక్షతలోని వేదాంతపరమైన ఉద్వేగం చెదరకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన దైవవాక్య శైలిని ఉపయోగించాము. మూలంలోని క్రమం, వ్యతిరేకత, మానవరూప చిత్రణ, అలాగే אֲחֹרָי పదంలోని సందిగ్ధతను నిలిపాము.
