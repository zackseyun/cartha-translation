source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אִם אֵ֤ין פָּנֶ֨י/ךָ֙ הֹלְכִ֔ים אַֽל תַּעֲלֵ֖/נוּ מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఆయనతో ఇలా అన్నాడు: “నీ సన్నిధి[a] మాతో వెళ్లకపోతే, మమ్మల్ని ఇక్కడి నుండి పైకి తీసుకువెళ్లవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “నీ ముఖం.” హీబ్రూలో “ముఖం” అనే పదం తరచుగా వ్యక్తిగత సన్నిధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమబద్ధమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: ఆయనతో
  rationale: ముందు ప్రస్తావించబడిన దేవుని ఉద్దేశించి పలికిన మాటను తెలుగులో సహజంగా చూపిస్తుంది; దేవునికి గౌరవార్థక ఏకవచనం వాడబడింది.
- source_word: אִם אֵין
  choice: రాకపోతే
  rationale: నిషేధార్థక షరతును తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: פָּנֶיךָ
  choice: నీ సన్నిధి
  rationale: పదశః ‘నీ ముఖం’; ఈ సందర్భంలో దేవుని వ్యక్తిగత, తోడుగా ఉండే సన్నిధిని సూచించే హీబ్రూ ప్రయోగం. మూలంలోని రూపకాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הֹלְכִים
  choice: మాతో రా
  rationale: కొనసాగుతూ తోడుగా వెళ్లే భావాన్ని సందర్భానుసారంగా ‘మాతో రావడం’గా సహజ తెలుగులో వ్యక్తపరుస్తుంది. ‘మాతో’ అనేది సందర్భంలో అంతర్భూతమైన సహచర్యాన్ని స్పష్టం చేస్తుంది.
- source_word: אַל תַּעֲלֵנוּ
  choice: మమ్మల్ని ... పైకి తీసుకువెళ్లవద్దు
  rationale: నిషేధాత్మక విజ్ఞప్తిని, అలాగే עלה హిఫిల్ రూపంలోని ‘పైకి తీసుకువెళ్లు’ అనే కారణార్థక ప్రయాణ భావాన్ని నిలుపుతుంది.
- source_word: מִזֶּה
  choice: ఇక్కడి నుండి
  rationale: ప్రస్తుత స్థలాన్ని సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: దేవునికి సంబంధించి פָּנֶיךָ పదాన్ని అనువదించడం
  choice: నీ సన్నిధి
  alternative: నీ ముఖం
  rationale: హీబ్రూలో పదశః ‘నీ ముఖం’ అయినా, ఈ సందర్భంలో ఇశ్రాయేలుతో పాటు వచ్చే దేవుని వ్యక్తిగత సన్నిధిని సూచిస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టంగా ఇచ్చి, మూల రూపకాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: దేవుని సన్నిధి తోడుగా వెళ్లే భావం
  choice: నీ సన్నిధి మాతో రాకపోతే
  alternative: నీ సన్నిధి వెళ్లకపోతే
  rationale: ‘మాతో’ మూల సందర్భంలోని సహచర్య భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; దేవుని సన్నిధిని కేవలం ముందుకు వెళ్లే నిర్జీవ భావంగా చూపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవునికి గౌరవార్థక ‘ఆయనతో’ వాడినా, ప్రత్యక్ష సంభాషణలో మూలంలోని రెండవ పురుష ఏకవచనాన్ని ‘నీ’గా నిలిపాం. ‘పైకి తీసుకువెళ్లవద్దు’ అనే రూపం నిర్గమ ప్రయాణానికి సంబంధించిన మూల క్రియలోని దిశాత్మక, కారణార్థక భావాన్ని కాపాడుతుంది.
