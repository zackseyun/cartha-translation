review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional request, God's accompanying presence (פָּנֶיךָ הֹלְכִים), the negative plea, the causative force of תַּעֲלֵנוּ, and the departure from the present location. The explicit ‘మాతో’ appropriately expresses the contextual accompaniment implicit in the idiom. Revising ‘రాకపోతే’ to ‘వెళ్లకపోతే’ better follows the forward movement expressed by הֹלְכִים in this setting.
  naturalness: The Telugu is clear, modern, and suitably reverent. ‘నీ సన్నిధి మాతో వెళ్లకపోతే’ is more idiomatic for onward travel from the present place than ‘మాతో రాకపోతే.’
  terminology: ‘సన్నిధి’ is an appropriate rendering of פָּנֶיךָ here, and the footnote responsibly retains the literal ‘ముఖం.’ ‘పైకి తీసుకువెళ్లవద్దు’ preserves the causative and directional sense of the Hiphil.
