  to: 'అప్పుడు అతడు ఆయనతో ఇలా అన్నాడు: “నీ సన్నిధి[a] మాతో వెళ్లకపోతే, మమ్మల్ని ఇక్కడి నుండి పైకి తీసుకువెళ్లవద్దు.”'
