id: EXO.33.22
reference: Exodus 33:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: te
  text: నా మహిమ దాటిపోతున్నప్పుడు, నేను నిన్ను ఆ బండలోని చీలికలో ఉంచి, నేను దాటిపోయే వరకు నా చేతిని నీ మీద కప్పుతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: దాటిపోతున్నప్పుడు
  rationale: היהతో కూడిన ב + infinitive construct తరువాతి చర్యలకు కాలసంబంధ నేపథ్యాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘దాటిపోతున్నప్పుడు’ సహజంగా ఉండి, ఆ సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: כְּבֹדִי
  choice: నా మహిమ
  rationale: దైవ ప్రత్యక్షత సందర్భంలో כבוד దేవుని ప్రత్యక్ష మహిమను సూచిస్తుంది; ‘మహిమ’ స్థిరమైనదీ సందర్భోచితమైనదీ.
- source_word: וְשַׂמְתִּיךָ
  choice: నేను నిన్ను ... ఉంచి
  rationale: שׂים యొక్క ‘పెట్టు/ఉంచు’ భావాన్ని తెలుగులో గౌరవప్రదంగా, సహజంగా ‘ఉంచి’ తెలియజేస్తుంది.
- source_word: בְּנִקְרַת הַצּוּר
  choice: ఆ బండ చీలికలో
  rationale: נקרה అంటే చీలిక లేదా పగులు; הצורలోని నిర్దిష్టతను తెలుగు నిర్దేశకమైన ‘ఆ’తో వ్యక్తం చేశాం. సందర్భంలోని ఆశ్రయస్థానానికి ‘బండ చీలిక’ సహజమైన పదబంధం.
- source_word: וְשַׂכֹּתִי
  choice: కప్పుతాను
  rationale: סכךలోని కప్పడం లేదా అడ్డుగా రక్షించడం అనే దృశ్యరూపాన్ని ‘కప్పుతాను’ నేరుగా నిలుపుతుంది.
- source_word: כַּפִּי
  choice: నా అరచేతితో
  rationale: כף ప్రత్యేకంగా అరచేయి లేదా అరచేతిని సూచించగలదు. తెలుగు వాక్యంలో ‘అరచేతితో’ మూలంలోని స్పష్టమైన శరీరరూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: עָלֶיךָ
  choice: నిన్ను
  rationale: על యొక్క సంబంధం తెలుగు ‘కప్పు’ క్రియలో కర్మరూపంగా సహజంగా వ్యక్తమవుతుంది; ‘నీ మీద నిన్ను కప్పుతాను’ అనవసర పునరుక్తి అవుతుంది.
- source_word: עַד עָבְרִי
  choice: నేను దాటిపోయే వరకు
  rationale: עַדతో కూడిన infinitive construct కప్పి ఉంచే చర్యకు ముగింపు బిందువును సూచిస్తుంది. ‘దాటిపోయే వరకు’ క్రమాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని గురించి శరీరరూపక భాష (‘నా అరచేతి’)
  choice: ‘నా అరచేతితో’ అనే స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నా రక్షణతో’ లేదా ‘నా శక్తితో’
  rationale: హీబ్రూ పాఠ్యం శరీరానికి సంబంధించిన దృశ్యభాషను నేరుగా ఉపయోగిస్తుంది. దానిని అమూర్తమైన వేదాంత వివరణగా మార్చకుండా కథనంలోని ఉద్వేగాన్ని, అసలు రూపకాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ పాఠ్యంలో ఉన్న దైవ ప్రత్యక్షత దృశ్యాన్ని, శరీరరూపకాన్ని వ్యాఖ్యానాత్మకంగా పలుచన చేయకుండా నిలిపింది.
