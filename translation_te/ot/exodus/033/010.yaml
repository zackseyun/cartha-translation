- from: ప్రజలందరూ మేఘస్తంభం గుడారపు ప్రవేశద్వారం దగ్గర నిలిచి ఉండడం చూసినప్పుడు, వారందరూ లేచి, ప్రతి ఒక్కరూ తమ తమ గుడారపు ప్రవేశద్వారం దగ్గర సాష్టాంగపడి ఆరాధించారు.[a]
