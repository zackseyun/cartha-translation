source:
  edition: WLC
  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: te
  text: ప్రజలందరూ మేఘస్తంభం గుడారపు ప్రవేశద్వారం దగ్గర నిలిచి ఉండడాన్ని చూసినప్పుడు, వారందరూ లేచి, ప్రతి ఒక్కరూ తమ తమ గుడారపు ప్రవేశద్వారం దగ్గర ఆరాధించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వంగి నమస్కరించారు,” లేదా “సాష్టాంగపడ్డారు.” హీబ్రూ క్రియ గౌరవాన్ని చూపే శారీరక చర్యను సూచిస్తుంది; తరచుగా అది ఆరాధనా చర్యగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה כָל הָעָם
  choice: ప్రజలందరూ ... చూసినప్పుడు
  rationale: వావ్‌తో కూడిన క్రియ కథనాన్ని ముందుకు నడిపిస్తూ, తరువాతి చర్యలకు కాలసంబంధ నేపథ్యాన్ని ఇస్తుంది. తెలుగులో ‘చూసినప్పుడు’ సహజంగా ఈ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַמּוּד הֶעָנָן
  choice: మేఘస్తంభం
  rationale: నిర్దిష్టమైన దృశ్యరూపాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עֹמֵד פֶּתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారం దగ్గర నిలిచి ఉండడం
  rationale: హీబ్రూ కృదంతం మేఘస్తంభం అక్కడ ఉన్న స్థితిని సూచిస్తుంది; ‘నిలిచి ఉండడం’ ఆ కొనసాగుతున్న దృశ్యాన్ని తెలియజేస్తుంది. సందర్భంలో ఇది ప్రత్యక్షపు గుడారం అయినప్పటికీ, ఈ వచనంలో ఉన్నట్టే ‘గుడారం’ అని మాత్రమే ఉంచబడింది.
- source_word: וְקָם
  choice: లేచి
  rationale: ప్రజలు తమ స్థానంలోనుంచి లేచిన చర్యను సంక్షిప్తంగా, గౌరవప్రదమైన కథన శైలిలో తెలియజేస్తుంది.
- source_word: וְהִשְׁתַּחֲווּ
  choice: సాష్టాంగపడి ఆరాధించారు
  rationale: ఈ క్రియ శరీరాన్ని వంచి లేదా నేలకు వాలి గౌరవం చూపే చర్యను సూచిస్తుంది; ఇక్కడ యెహోవా సన్నిధికి ప్రతిస్పందన కావడంతో ఆరాధనా భావం కూడా స్పష్టంగా ఉంది. తెలుగు పదబంధం శారీరక చర్యను, ఆరాధనా ఉద్దేశాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: ఏకవచన పంపిణీ భావాన్ని తెలుగులో సహజమైన ‘ప్రతి ఒక్కరూ తమ తమ’ రూపంతో వ్యక్తం చేస్తుంది; ప్రతి వ్యక్తి తన గుడారం వద్ద ఉన్న దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవసన్నిధి సూచనకు ప్రజల ప్రతిస్పందనను ఎలా అనువదించాలి
  choice: సాష్టాంగపడి ఆరాధించారు
  alternative: వంగి నమస్కరించారు; సాష్టాంగపడ్డారు
  rationale: హీబ్రూ క్రియ శారీరకంగా వంగడం లేదా నేలకు వాలడాన్ని సూచించగలదు; ఈ సందర్భంలో అది యెహోవా ప్రత్యక్ష సన్నిధికి చూపిన భక్తిపూర్వక ప్రతిస్పందన. ప్రధాన పాఠం శారీరక భంగిమను, ఆరాధనా భావాన్ని రెండింటినీ తెలియజేస్తుంది; ప్రత్యామ్నాయాలు పాదసూచికలో నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘ప్రతి ఒక్కరూ తమ తమ’ అనే సహజ తెలుగు నిర్మాణం హీబ్రూ పంపిణీ భావాన్ని లింగాన్ని అనవసరంగా ముందుకు తేయకుండా వ్యక్తం చేస్తుంది.
