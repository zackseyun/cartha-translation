id: EXO.33.1
reference: Exodus 33:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా అన్నాడు: “నువ్వూ, ఐగుప్తు దేశం నుంచి నువ్వు బయటకు తీసుకొచ్చిన ప్రజలూ ఇక్కడి నుంచి బయలుదేరి పైకి వెళ్లండి; అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు నేను ప్రమాణం చేసి, ‘నీ సంతానానికి[b] దాన్ని ఇస్తాను’ అని చెప్పిన ఆ దేశానికి వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని పేరు ‘YHWH’; ఇక్కడ దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం. సంప్రదాయంగా ‘యెహోవా’ అని, అనేక అనువాదాల్లో ‘ప్రభువు’ అని ఇస్తారు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పదానికి అక్షరార్థం ‘విత్తనం’; ఇక్కడ అది సమూహార్థక ఏకవచనంగా సంతానం లేదా వంశస్థులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రత్యక్ష సంభాషణను సహజమైన ఆధునిక తెలుగులో పరిచయం చేయడానికి ఈ రూపం తగినది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: ఇక్కడి నుంచి బయలుదేరి ... వెళ్లండి
  rationale: జతగా ఉన్న ఆజ్ఞలు ఈ స్థలాన్ని విడిచి వాగ్దాన దేశం వైపు వెళ్లడాన్ని సూచిస్తాయి. భౌగోళిక ‘పైకి’ భావాన్ని అతిగా ముందుకు తేవకుండా గమనం, నిష్క్రమణ రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַתָּה וְהָעָם
  choice: నువ్వూ ... ప్రజలూ
  rationale: మోషే మరియు ప్రజలు ఇద్దరూ ఆజ్ఞకు కర్తలని తెలుగు సముచ్చయ నిర్మాణం స్పష్టంగా చూపుతుంది; మూలంలో లేని ‘ఈ ప్రజలు’ అనే సూచనను చేర్చలేదు.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: నువ్వు బయటకు తీసుకొచ్చిన
  rationale: హిఫీల్ రూపం ‘పైకి తీసుకురావడం/బయటకు నడిపించడం’ అనే కారణార్థాన్ని కలిగి ఉంది; ఐగుప్తు నిర్గమన సందర్భంలో ఈ తెలుగు పదబంధం సహజంగా ఉంది.
- source_word: אֶל הָאָרֶץ
  choice: ఆ దేశానికి
  rationale: నిర్దిష్టమైన, ముందే వాగ్దానం చేయబడిన దేశాన్ని సూచించే హీబ్రూ నిర్దేశకాన్ని ‘ఆ’ ద్వారా సహజంగా ప్రతిబింబించింది.
- source_word: נִשְׁבַּעְתִּי
  choice: నేను ప్రమాణం చేసి
  rationale: దేవుడు చేసిన గంభీరమైన శపథాన్ని సంక్షిప్తంగా, నేరుగా తెలియజేస్తుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: అబ్రాహాముకు, ఇస్సాకుకు, యాకోబుకు
  rationale: ప్రతి పితరుని పేరుతో హీబ్రూలో పునరావృతమైన సంబంధ విభక్తిని తెలుగులోనూ నిలిపి, ప్రమాణ సూత్రపు లయను కాపాడింది.
- source_word: לֵאמֹר
  choice: అని చెప్పిన
  rationale: ప్రమాణంలోని మాటలను పరిచయం చేసే మూల వాక్యనిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తుంది.
- source_word: לְזַרְעֲךָ
  choice: నీ సంతానానికి
  rationale: זֶרַע యొక్క సమూహార్థక ఏకవచనాన్ని ‘సంతానం’ సహజంగా నిలుపుతుంది; ‘విత్తనం’ అనే అక్షరార్థం ఈ సందర్భంలో అసహజం.
- source_word: אֶתְּנֶנָּה
  choice: దాన్ని ఇస్తాను
  rationale: స్త్రీలింగ ప్రత్యయానికి పూర్వపదమైన ‘దేశం’ సూచ్యార్థం; తెలుగులో దాన్ని సర్వనామంతో స్పష్టంగా, సంక్షిప్తంగా తెలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా ఉంచడం మూలానికి నిబద్ధం; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది.
- issue: ‘నువ్వు బయటకు తీసుకొచ్చిన ప్రజలు’ అనే దేవుని సంబోధన
  choice: మూలంలోని ద్వితీయ పురుష నిర్దేశాన్ని యథాతథంగా నిలిపింది
  alternative: ‘నేను బయటకు తీసుకొచ్చిన ప్రజలు’ అని సందర్భానుసారంగా మార్చడం
  rationale: ఈ మాట బంగారు దూడ సంఘటన తరువాతి ఉద్రిక్తతను కలిగి ఉండవచ్చు. దానిని సవరించి దేవునే తీసుకొచ్చాడని మార్చితే మూలంలోని వాక్చాతుర్యం, ధార్మిక ఉద్వేగం తొలగిపోతాయి.
- issue: זֶרַע యొక్క ఏకవచన-సమూహార్థం
  choice: సంతానం
  alternative: వారసులు; విత్తనం
  rationale: ‘సంతానం’ ఒక వ్యక్తినీ వంశసమూహాన్నీ సూచించగలదు; అందువల్ల మూలంలోని సంఖ్యాపరమైన తెరచిన భావాన్ని అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. దేవుడు మోషేతో ఏకవచన సన్నిహిత సంబోధనలో మాట్లాడుతున్నందున ‘నువ్వు’ వాడబడింది; మోషే మరియు ప్రజలను కలిపిన ఆజ్ఞకు సహజంగా బహువచన క్రియ ‘వెళ్లండి’ వాడబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
