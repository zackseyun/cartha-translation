source:
  edition: WLC
  text: אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּ/קִרְבְּ/ךָ֗ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ אַ֔תָּה פֶּן אֲכֶלְ/ךָ֖ בַּ/דָּֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: te
  text: పాలు, తేనె ప్రవహించే దేశానికి. ఎందుకంటే నేను మీ మధ్యలోకి[a] రాను; మీరు మెడ వంచని ప్రజలు కాబట్టి, దారిలో నేను మిమ్మల్ని నాశనం చేసివేస్తానేమో[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిమ్మల్ని అంతం చేసివేస్తానేమో’ లేదా ‘మిమ్మల్ని నిర్మూలం చేసివేస్తానేమో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశానికి వెళ్లు
  rationale: ‘పాలు తేనెలు ప్రవహించే దేశం’ అనే రూపకం సమృద్ధిని సహజంగా తెలియజేస్తుంది. ఈ వచనం ముందరి వాక్యాన్ని కొనసాగిస్తున్నందున, తెలుగులో స్వతంత్రంగా సులభంగా చదవడానికి సందర్భంలో అంతర్భూతమైన ‘వెళ్లు’ను చేర్చాం.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: అయితే నేను ... వెళ్లను
  rationale: עלה అనే క్రియకు ఇక్కడ ప్రయాణార్థకమైన ‘వెళ్లు’ సహజమైన తెలుగు. మొదటి వాక్యంలోని గమ్యంతో దేవుని నిరాకరణకు ఉన్న వ్యత్యాసాన్ని ‘అయితే’ స్పష్టంగా చూపుతుంది.
- source_word: בְּקִרְבְּךָ
  choice: నీ మధ్యలో
  rationale: ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే ఏకవచన ప్రత్యయాన్ని నిలిపి, దేవుని సన్నిధి ప్రజల మధ్య ఉండడమనే స్థలాత్మక, నిబంధనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: మెడ వంచని ప్రజవు
  rationale: హీబ్రూ నుడికారంలోని మెడకు సంబంధించిన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపి, మొండితనంతో లొంగని స్వభావాన్ని తెలియజేస్తుంది.
- source_word: פֶּן אֲכֶלְךָ
  choice: లేకపోతే ... నిన్ను నిర్మూలం చేస్తాను
  rationale: פֶּן హెచ్చరించే ప్రమాదకర పరిణామాన్ని ‘లేకపోతే’ సహజంగా వ్యక్తం చేస్తుంది. כלה పియేల్ రూపం పూర్తిగా అంతం చేయడం లేదా నాశనం చేయడం అనే తీవ్రమైన భావాన్ని కలిగి ఉంది.
- source_word: בַּדָּרֶךְ
  choice: దారిలోనే
  rationale: ప్రయాణం కొనసాగుతుండగానే ఆ పరిణామం సంభవించవచ్చనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవసన్నిధిని సూచించే בְּקִרְבְּךָ అనువాదం
  choice: నీ మధ్యలో
  alternative: నీతో / మీ మధ్య
  rationale: దేవుడు కేవలం తోడుగా రాడనే భావం కంటే, తిరుగుబాటు చేసే ప్రజల మధ్య ఆయన పరిశుద్ధ సన్నిధి ఉండడంలో గల ప్రమాదాన్ని ఈ రూపం బలంగా నిలుపుతుంది.
- issue: אֲכֶלְךָ లోని దైవతీర్పు తీవ్రత
  choice: నిన్ను నిర్మూలం చేస్తాను
  alternative: నిన్ను అంతం చేస్తాను / నిన్ను నాశనం చేస్తాను
  rationale: హీబ్రూ క్రియ ప్రజలను పూర్తిగా అంతం చేసే ప్రమాదాన్ని సూచిస్తుంది. తీర్పు విధానాన్ని అదనంగా నిర్దిష్టం చేయకుండా దాని తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని ఉపయోగించాం. ఇశ్రాయేలును సమష్టిగా ఉద్దేశించిన హీబ్రూ ఏకవచనాన్ని ‘నీ/నీవు/ప్రజవు’ రూపాలతో నిలిపాం. మూలంలోని రూపకం మరియు దైవసన్నిధి వల్ల ఏర్పడే వేదాంతపరమైన ఉద్రిక్తతను సులభీకరించలేదు.
