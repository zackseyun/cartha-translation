source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “ఇశ్రాయేలీయులతో[a] ఇలా చెప్పు: ‘మీరు మెడబిరుసైన ప్రజలు. నేను ఒక్క క్షణమైనా మీ మధ్యకు వచ్చానంటే[b], మిమ్మల్ని పూర్తిగా నాశనం చేసేవాణ్ణి[c]. కాబట్టి ఇప్పుడు మీ ఆభరణాలను తీసివేయండి[d]; అప్పుడు మీకు ఏమి చేయాలో నేను తెలుసుకుంటాను[e].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అంటే ఇశ్రాయేలు ప్రజలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను ఒక్క క్షణం మీ మధ్యకు వెళ్లినా.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లడం’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మిమ్మల్ని పూర్తిగా అంతం చేసేవాణ్ణి.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘మీ అలంకారాలను ఒంటిమీద నుంచి తీసివేయండి.’
    reason: lexical_alternative
  - marker: e
    text: హీబ్రూ అక్షరార్థంగా ‘మీకు ఏమి చేయాలో నేను తెలుసుకుంటాను.’ ‘నిర్ణయిస్తాను’ అని సవరించకుండా మూలంలోని మానవరూప వర్ణనను నిలిపాం.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం సమాజాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన సమూహనామాన్ని వాడాం.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: మెడ వంచని ప్రజలు
  rationale: మొండితనాన్ని సూచించే మూలభాషా రూపకాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: నేను ఒక్క క్షణమైనా మీ మధ్యకు వచ్చానంటే
  rationale: ‘ఒక్క క్షణం’ అనే స్వల్పకాల భావాన్ని, సందర్భంలోని షరతు/ఊహాత్మక హెచ్చరికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పైకి వెళ్లు’ అనే క్రియ సందర్భానుసారంగా గమనం/సన్నిధిని సూచించేందున ‘మధ్యకు వచ్చు’గా ఇచ్చాం.
- source_word: וְכִלִּיתִיךָ
  choice: మిమ్మల్ని పూర్తిగా నాశనం చేసేవాణ్ణి
  rationale: כלה ఇక్కడ తీర్పులో పూర్తిగా అంతం చేయడాన్ని సూచిస్తుంది; ‘పూర్తిగా’ దాని సమగ్రతను వెల్లడిస్తుంది.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: మీ ఆభరణాలను తీసివేయండి
  rationale: עֲדִי అలంకార వస్తువులు లేదా నగలను సూచిస్తుంది; ఈ సందర్భంలో ‘ఆభరణాలు’ విస్తృతమైన, సహజమైన పదం.
- source_word: וְאֵדְעָה
  choice: అప్పుడు ... నేను తెలుసుకుంటాను
  rationale: ‘తెలుసుకొను’ అనే మూలక్రియను అలాగే నిలిపి, దైవజ్ఞానానికి సంబంధించిన మానవరూప వర్ణనను ‘నిర్ణయిస్తాను’ అని మార్చలేదు.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: మీకు ఏమి చేయాలో
  rationale: לְ ఉపసర్గను ‘మీకు’గా ఉంచడం వల్ల చర్య అనుకూలమా ప్రతికూలమా అన్న మూలంలోని విపులత నిలుస్తుంది.
theological_decisions:
- issue: దేవుడు ‘తెలుసుకోవడం’ అనే మానవరూప వర్ణన
  choice: ‘నేను తెలుసుకుంటాను’ అని ప్రధాన పాఠ్యంలో నిలిపాం
  alternative: ‘నేను ఏమి చేయాలో నిర్ణయించుకుంటాను’
  rationale: హీబ్రూ ידע (‘తెలుసుకొను’) అనే క్రియనే వాడుతుంది. దైవ సర్వజ్ఞత్వంపై తలెత్తే ఉద్వేగాన్ని వ్యాఖ్యానంతో తొలగించకుండా మూలంలోని సంబంధాత్మక, మానవరూప భాషను కాపాడాం.
- issue: ఇశ్రాయేలును ఉద్దేశించిన సమష్టి ఏకవచన ప్రత్యయాలు
  choice: తెలుగులో గౌరవ/బహువచన రూపమైన ‘మీరు/మిమ్మల్ని/మీకు’ వాడాం
  alternative: ఏకవచన ‘నీవు/నిన్ను/నీకు’
  rationale: మూలంలో ఇశ్రాయేలు ఒక సమష్టిగా ఏకవచనంలో సంబోధించబడినా, తెలుగులో మొత్తం ప్రజలను ఉద్దేశించిన భావం సహజంగా స్పష్టమయ్యేందుకు బహువచన రూపాలు అనుకూలం.
- issue: దేవుని సన్నిధి మరియు తక్షణ తీర్పు మధ్య సంబంధం
  choice: ఊహాత్మక హెచ్చరికగా ‘వచ్చానంటే ... నాశనం చేసేవాణ్ణి’
  alternative: నిశ్చిత భవిష్యత్తుగా ‘వస్తాను ... నాశనం చేస్తాను’
  rationale: సందర్భం దేవుడు వారి మధ్యకు వెళ్లకపోవడానికి కారణాన్ని వివరిస్తుంది. అందువల్ల హీబ్రూ అసంపూర్ణ క్రియల సందర్భోచిత షరతు భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘మెడ వంచని’ అనే రూపకం మూలంలోని చిత్రాన్ని నిలుపుతుంది. సంభాషణలో సమాజాన్ని ఉద్దేశించినందున బహువచన సంబోధన వాడాం; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
