source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: te
  text: మోషే ఆ గుడారం[a] వైపుకు వెళ్లినప్పుడల్లా, ప్రజలందరూ లేచి, ప్రతి ఒక్కరూ తమతమ గుడారపు ద్వారం దగ్గర నిలబడేవారు[b]. మోషే ఆ గుడారంలోకి ప్రవేశించే వరకు వారు ఆయన వెళ్లిన వైపే చూస్తూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమావేశ గుడారం’; పరిసర సందర్భంలో ఈ గుడారం సమావేశ గుడారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఎబ్రీలో అక్షరార్థంగా ‘ఒక్కొక్క పురుషుడు’; ఏకవచన పుంలింగ రూపం ఇక్కడ ప్రజలలోని ఒక్కొక్కరిని విభజనాత్మకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּצֵאת
  choice: బయలుదేరినప్పుడల్లా
  rationale: వావ్ + కతల్‌తో కూడిన కాలసూచక క్రియారూపం కథనంలో పునరావృతమయ్యే సందర్భాన్ని సూచిస్తుంది. ‘అప్పుడల్లా’ ఆ అలవాటైన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; יצא లోని బయటికి వెళ్లే భావాన్ని ‘బయలుదేరు’ నిలుపుతుంది.
- source_word: מֹשֶׁה אֶל הָאֹהֶל
  choice: మోషే గుడారం దగ్గరికి
  rationale: ఎబ్రీ పాఠంలో ‘గుడారం’ అనే సాధారణ నామమే ఉంది; పరిసర సందర్భంలో ఇది సమావేశ గుడారాన్ని సూచిస్తుంది. אֶל గమ్యాన్ని సూచిస్తున్నందున తెలుగులో సహజంగా ‘దగ్గరికి’ అని అనువదించబడింది.
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: లేచి ... నిలబడేవారు
  rationale: ఈ అసంపూర్ణ క్రియారూపాలు పునరావృత చర్యను సూచిస్తున్నాయి. נצב కేవలం నిలుచోవడమే కాక ఒక స్థానంలో నిలబడడాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘లేచి ... నిలబడేవారు’ సహజంగా ఉంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: సమూహంగా ఉన్న సమస్త ప్రజలను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: ప్రతి ఒక్కరూ తమతమ గుడారపు ద్వారం దగ్గర
  rationale: אִישׁ ఏకవచన పుంలింగ రూపమైనా ఇక్కడ విభజనాత్మకంగా సమూహంలోని ఒక్కొక్కరిని సూచిస్తుంది. ‘ప్రతి ఒక్కరూ తమతమ’ అనే తెలుగు ప్రయోగం ఆ విభజనాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; దీనిని పాదసూచికలో తెలియజేశారు.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: మోషే ... ఆయన వెళ్లిన వైపే చూస్తూ ఉండేవారు
  rationale: אַחֲרֵי ఇక్కడ మోషే వెళ్తుండగా ఆయన వెనుక వైపు చూపు నిలిపి చూడడాన్ని సూచిస్తుంది. ‘వెళ్లిన వైపే చూస్తూ’ అనేది వెంబడించడం అనే అపార్థం లేకుండా ఆ దృశ్య భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: ఆ గుడారంలోకి ప్రవేశించే వరకు
  rationale: దిశాసూచక ה మరియు בוא కలసి గుడారం లోపలికి వెళ్లడాన్ని సూచిస్తున్నాయి. ‘ప్రవేశించే వరకు’ సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. పునరావృత చర్యలను ‘అప్పుడల్లా’ మరియు ‘నిలబడేవారు/చూస్తూ ఉండేవారు’ ద్వారా వ్యక్తం చేశాం. ‘గుడారం’ అనే మూలపదంలోని సాధారణతను నిలుపుతూ సందర్భసూచనను పాదసూచికలో ఇచ్చాం.
