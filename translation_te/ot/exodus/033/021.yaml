  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: te
  text: 'యెహోవా ఇలా అన్నాడు: “ఇదిగో, నా వద్ద ఒక స్థలం ఉంది; నీవు ఆ బండపై నిలబడాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగు పాఠకులకు పరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ సూచన పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: מָקוֹם אִתִּי
  choice: నా దగ్గర ఒక స్థలం ఉంది
  rationale: అక్షరార్థంగా ‘నాతో/నా వద్ద ఒక స్థలం’; ఇక్కడ సమీపార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנִצַּבְתָּ
  choice: నువ్వు ... నిలబడాలి
  rationale: వావ్‌తో కూడిన సంపూర్ణ క్రియ ఇక్కడ తరువాత చేయవలసిన చర్యను సూచిస్తుంది; సందర్భానుగుణంగా ఆదేశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: עַל הַצּוּר
  choice: ఆ బండ మీద
  rationale: నిర్దిష్టమైన ‘the rock’ను సందర్భంలో గుర్తించబడే బండగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: מָקוֹם אִתִּי లో దేవుని స్థలసంబంధ భాష
  choice: నా దగ్గర ఒక స్థలం ఉంది
  alternative: నా వద్ద ఒక స్థలం ఉంది
  rationale: మూలంలోని స్థలసంబంధ వ్యక్తీకరణను దాని భావతీవ్రతతోనే ఉంచుతుంది; దేవుని స్వరూపం గురించి అదనపు వివరణతో ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రత్యక్ష వాక్యశైలి. దేవుడు మోషేతో ఏకవచనంలో మాట్లాడుతున్నందున ‘నువ్వు’ వాడబడింది; కృత్రిమమైన పురాతన శైలి నివారించబడింది.
