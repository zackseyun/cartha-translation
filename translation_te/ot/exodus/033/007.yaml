source:
  edition: WLC
  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: te
  text: మోషే ఆ గుడారాన్ని[a] తీసుకొని, తన కోసం శిబిరం వెలుపల—శిబిరానికి చాలా దూరంగా—దాన్ని వేసేవాడు[b]. దానికి “సమావేశపు గుడారం” అని పిలిచేవాడు. యాహ్వేను వెదికే ప్రతి ఒక్కరూ శిబిరం వెలుపల ఉన్న ఆ సమావేశపు గుడారానికి వెళ్లేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో “ఆ గుడారం” అని ఉంది. అది “అతని గుడారం” అని స్పష్టంగా చెప్పలేదు; కొందరు దాన్ని మోషే సొంత గుడారంగా లేదా ఈ ప్రయోజనం కోసం అతడు ఉపయోగించిన ప్రత్యేక గుడారంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: “తీసుకొని ... వేసేవాడు,” “పిలిచేవాడు,” “వెళ్లేవారు” అని అనువదించిన హీబ్రూ క్రియారూపాలు ఇక్కడ అలవాటుగా లేదా పదేపదే జరిగే చర్యను సూచించే అవకాశం ఉంది. మరో విధంగా వాటిని సాధారణ భూతకాల క్రియలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: తీసుకొని ... వేసేవాడు
  rationale: ఈ సందర్భంలో yiqtol రూపం అలవాటుగా లేదా పదేపదే జరిగే క్రియను సూచించే అవకాశం ఉంది; అందువల్ల సాధారణ భూతకాలానికి బదులు ‘వేసేవాడు’ అని అనువదించబడింది.
- source_word: הָאֹהֶל
  choice: ఆ గుడారం
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదంతో ‘ఆ గుడారం’ అని ఉంది. అది మోషే సొంత గుడారమని మూలపాఠం స్పష్టంగా చెప్పదు; కాబట్టి ఆ అనిశ్చితిని నిలిపి ఉంచుతుంది.
- source_word: וְנָטָה לוֹ
  choice: తన కోసం ... దాన్ని వేసేవాడు
  rationale: గుడారం సందర్భంలో נטה అంటే గుడారాన్ని వేయడం లేదా నిలపడం. לוֹ అనే పదంలోని భావాన్ని ‘తన కోసం’ అని నిలిపి ఉంచాం.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల
  rationale: గుడారం ఇశ్రాయేలీయుల శిబిరానికి బయట ఉన్నదనే స్థానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: శిబిరానికి చాలా దూరంగా
  rationale: మూలపాఠం శిబిరం నుండి ఉన్న వేరుపాటును బలంగా నొక్కిచెబుతుంది; ‘చాలా దూరంగా’ ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: וְקָרָא לוֹ אֹהֶל מוֹעֵד
  choice: దానికి ‘సమావేశపు గుడారం’ అని పేరు పెట్టాడు
  rationale: קרא לוֹ ఇక్కడ పేరు పెట్టడాన్ని సూచిస్తుంది. ‘సమావేశపు గుడారం’ అనేది అర్థవంతమైన, సహజమైన తెలుగు రూపం.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: מוֹעֵד నియమిత సమావేశ సమయాన్ని లేదా స్థలాన్ని సూచించగలదు; సందర్భంలో దేవునితో సమావేశమయ్యే గుడారం అనే భావం ఉంది.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: యాహ్వేను వెదికే ప్రతి ఒక్కరూ
  rationale: מבקש దేవుణ్ణి వెదకడం లేదా ఆయనను విచారించడం అనే రెండు ఛాయలను కలిగి ఉంటుంది. ‘వెదికే’ అనే పదం ఈ విస్తృత భావాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: יֵצֵא
  choice: వెళ్లేవారు
  rationale: 'ముందటి yiqtol రూపంలాగే ఇది కూడా అలవాటుగా జరిగే క్రియను సూచిస్తుంది: యాహ్వేను వెదికేవారు ఆ గుడారానికి వెళ్లడం ఆనవాయితీగా ఉండేది.'
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: శిబిరం వెలుపల ఉన్న
  rationale: ఈ సంబంధవాచక వాక్యభాగం సమావేశపు గుడారం ఉన్న ప్రదేశాన్ని గుర్తిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దాన్ని బిరుదుగా మార్చకుండా, పేరుగానే నిలుపుతుంది.
- issue: ‘ఆ గుడారం’ యొక్క గుర్తింపు
  choice: మోషే సొంత గుడారమని స్పష్టీకరించకుండా ఉంచడం
  alternative: మోషే గుడారం; ఈ ప్రయోజనం కోసం వాడిన ప్రత్యేక గుడారం
  rationale: హీబ్రూ మూలపాఠం ‘ఆ గుడారం’ అని మాత్రమే చెబుతుంది. దాని ఖచ్చితమైన గుర్తింపును నిర్ణయించడం పాఠంలోని నిజమైన అనిశ్చితిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘సమావేశపు గుడారం’ అనే రూపం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని నియమిత సమావేశ భావాన్ని కాపాడుతుంది. దీర్ఘ విరామ చిహ్నాలు శిబిరం నుండి గుడారం ఉన్న దూరంపై మూలపాఠం ఉంచిన ఉద్ఘాటనను స్పష్టంగా చూపిస్తాయి.
