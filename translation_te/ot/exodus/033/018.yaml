  text: Then he said[a], “Please show me your glory.”
translation:
  language: te
  text: అప్పుడు అతడు, “దయచేసి, నీ మహిమను నాకు చూపించు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ వైభవాన్ని నాకు చూపించు.” హీబ్రూ క్రియకు అక్షరార్థంగా “నాకు కనిపించేలా చేయి” అని అర్థం; “మహిమ” అనే పదం ప్రత్యక్షమైన వైభవాన్ని లేదా ఘనతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ వరుసక్రమ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַרְאֵנִי
  choice: నాకు చూపించు
  rationale: ראה ధాతువు హిఫిల్ ఆజ్ఞార్థక రూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో, అక్షరార్థంగా ‘నన్ను చూడేలా చేయి.’ తెలుగులో ‘నాకు చూపించు’ కారణార్థక విజ్ఞప్తిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: נא వినయపూర్వకమైన వేడుకోలును సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దయచేసి’ దానికి స్పష్టమైన సమానార్థకం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించని ప్రత్యక్ష కర్మ సూచిక]'
  rationale: אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: כְּבֹדֶךָ
  choice: నీ మహిమను
  rationale: כבוד మహిమ, ఘనత, ప్రత్యక్ష వైభవం అనే విస్తృత భావాలను కలిగి ఉంటుంది. ఈ సందర్భంలో ‘నీ మహిమ’ ఆ భావవ్యాప్తిని అనవసరంగా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: మోషే కోరిన ‘నీ మహిమ’ యొక్క భావం
  choice: నీ మహిమను
  alternative: నీ వైభవాన్ని; నీ సన్నిధి సంపూర్ణతను
  rationale: హీబ్రూ పదం మోషే దేవుని దృశ్య తేజస్సునా, దైవిక ఔన్నత్యాన్నా, లేక దేవుని సన్నిధి ప్రత్యక్షతనంతటినీ చూడాలని కోరాడా అన్నది స్పష్టంగా పరిమితం చేయదు. ‘మహిమ’ ఆ ఉద్దేశపూర్వక భావవిస్తృతిని, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. సంభాషణలోని ప్రత్యక్ష, వినయపూర్వక విజ్ఞప్తి నిలుపబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
