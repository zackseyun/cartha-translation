translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘దుర్వార్త’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుండగా, ‘మాట/విషయం’ అనే మూలంలోని పదార్థ పరిధిని పాదసూచికలో భద్రపరిచాం. ‘ఎవ్వరూ’ మూలంలోని אִישׁ యొక్క పంపిణీ భావాన్ని లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
