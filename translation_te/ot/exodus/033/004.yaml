source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: te
  text: ప్రజలు ఈ దుర్వార్తను[a] విన్నప్పుడు దుఃఖించారు; ఎవ్వరూ తమ ఆభరణాలు[b] ధరించుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ చెడ్డ మాటను” లేదా “ఈ దుఃఖకరమైన విషయాన్ని.” హీబ్రూ పదం అక్షరార్థంగా ‘మాట’ లేదా ‘విషయం’ అని అర్థం; సందర్భంలో అది వారికి వినిపించిన దుర్వార్తను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అలంకరణ వస్తువులు.” హీబ్రూ పదం నగలతో పాటు అలంకరించుకోవడానికి ఉపయోగించే వస్తువులను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: ప్రజలు ... విన్నప్పుడు
  rationale: הָעָם సమూహవాచక ఏకవచనమైనా భావంలో ప్రజల సమూహాన్ని సూచిస్తుంది. తెలుగులో బహువచన క్రియతో చెప్పడం సహజం; שמע ఇక్కడ ఒక ప్రకటనను వినడాన్ని సూచిస్తుంది.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: ఈ దుర్వార్తను[a]
  rationale: דָּבָר అక్షరార్థంగా ‘మాట/విషయం’; ఇక్కడ ముందుగా ప్రకటించిన బాధాకరమైన సమాచారాన్ని సూచిస్తుంది. ‘దుర్వార్త’ సహజమైన ఆధునిక తెలుగు; మూలంలోని విస్తృతమైన పదప్రయోగాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּתְאַבָּלוּ
  choice: దుఃఖించారు
  rationale: אבל హిత్పయేల్ రూపం శోకంలోకి వెళ్లడం లేదా శోకించడం అనే భావం ఇస్తుంది. ‘దుఃఖించారు’ భావోద్వేగాన్నీ శోకస్థితినీ సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: ఎవ్వరూ ... ధరించుకోలేదు
  rationale: అక్షరార్థంగా ‘ఒక్క మనిషీ పెట్టుకోలేదు’ అనే పంపిణీ భావం ఉంది. తెలుగులో ‘ఎవ్వరూ’ అదే సమగ్ర నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֶדְיוֹ עָלָיו
  choice: తమ ఆభరణాలు[b] ధరించుకోలేదు
  rationale: עֲדִי నగలు మాత్రమే కాక అలంకరణకు ఉపయోగించే వస్తువులను విస్తృతంగా సూచించగలదు. שׁית ... עליו అనే ‘తన మీద పెట్టుకోవడం’ భావాన్ని తెలుగులో సహజంగా ‘ధరించుకోవడం’ అని అనువదించాం.
