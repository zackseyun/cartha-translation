  terminology: “దుర్వార్త,” “దుఃఖించారు,” and “ఆభరణాలు” are appropriate, accessible choices. Footnote b correctly notes that עֲדִי can include adornments more broadly than jewelry alone. The footnote markers are correctly anchored in the Telugu text.
