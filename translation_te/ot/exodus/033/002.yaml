source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: te
  text: నీ ముందుగా ఒక దేవదూతను[a] పంపుతాను; కనానీయులను, అమోరీయులను, హిత్తీయులను, పెరిజ్జీయులను, హివ్వీయులను, యెబూసీయులను తరిమివేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సందేశవాహకుణ్ణి.’ హీబ్రూ పదం మానవ సందేశవాహకుణ్ణి లేదా దేవదూతను సూచించగలదు; ఇక్కడి సందర్భంలో దేవదూత అనే అర్థం తగినదిగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: పంపి
  rationale: దైవిక వాగ్దానంలో భవిష్యత్ భావాన్ని కలిగిన క్రియ; తరువాతి సమాపక క్రియ ‘వెళ్లగొడతాను’తో సహజమైన తెలుగు వాక్య నిర్మాణం కోసం అసమాపక రూపం వాడబడింది.
- source_word: לְפָנֶיךָ
  choice: నీకు ముందుగా
  rationale: ‘నీ ముఖానికి ముందు’ అనే హీబ్రూ నుడికారానికి, మార్గంలో ముందుగా వెళ్లే భావాన్ని తెలిపే సహజ తెలుగు రూపం.
- source_word: מַלְאָךְ
  choice: ఒక దూతను
  rationale: ఈ పదం దేవదూతను లేదా మానవ సందేశవాహకుణ్ణి సూచించగలదు. సందర్భంలో దేవదూత భావం తగినదైనా, ‘దూత’ అనే తెలుగు పదం మూలంలోని కొంత అస్పష్టతను నిలుపుతుంది; ‘ఒక’ అనిర్దిష్టతను ప్రతిబింబిస్తుంది.
- source_word: וְגֵרַשְׁתִּי
  choice: వెళ్లగొడతాను
  rationale: దేశ నివాసులను బలవంతంగా తొలగించడం అనే גרשׁ క్రియ యొక్క భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: కనానీయులను ... యెబూసీయులను
  rationale: హీబ్రూలో ఏకవచన సమూహవాచకాలుగా ఉన్న జాతిపేర్లను, తెలుగులో మొత్తం ప్రజాసమూహాలను సహజంగా సూచించే బహువచన కర్మరూపాల్లో అనువదించాం.
theological_decisions:
- issue: ఈ వచనంలోని מַלְאָךְ గుర్తింపు
  choice: ‘ఒక దూత’ అని సాధారణంగా అనువదించడం
  alternative: ‘ఆ దూత’, ‘ఒక దేవదూత’ లేదా ‘ఒక సందేశవాహకుడు’
  rationale: వచనం ఈ దూతను ‘యెహోవా దూత’గా గానీ, సృష్టించబడిన దేవదూతగా గానీ స్పష్టంగా గుర్తించదు. కాబట్టి పాఠ్యంలో లేని నిర్దిష్ట ధార్మిక గుర్తింపును చేర్చకుండా, మూలపదంలోని భావవిస్తృతిని కొంతవరకు నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. జాతిపేర్లు తెలుగు బైబిలు వాడుకకు సన్నిహితంగా ఉంచబడ్డాయి; పొడవైన జాబితా సహజంగా చదవడానికి బహువచన రూపాలు వాడబడ్డాయి.
