reference: Exodus 33:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: te
  text: యాహ్వే మోషేతో, ఒక మనిషి తన స్నేహితునితో మాట్లాడినట్లు, ముఖాముఖిగా[a] మాట్లాడేవాడు. తరువాత మోషే శిబిరానికి తిరిగి వచ్చేవాడు. అయితే అతని సహాయకుడైన నూను కుమారుడు యెహోషువ—ఒక యువకుడు—ఆ గుడారం[b] లోపలినుంచి వెళ్లిపోకుండా ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేరుగా,’ ‘వ్యక్తిగతంగా.’ ‘ముఖాముఖిగా’ అనే హీబ్రూ నుడికారం అసాధారణంగా ప్రత్యక్షమైన సన్నిహిత సంభాషణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, సమావేశ గుడారం.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: మాట్లాడేవాడు
  rationale: ఈ సందర్భంలో పునరావృతంగా జరిగే అలవాటైన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: פָּנִים אֶל־פָּנִים
  choice: ముఖాముఖిగా
  rationale: హీబ్రూ నుడికారాన్ని నిలుపుతూ ప్రత్యక్షమైన, సన్నిహిత సంభాషణ భావాన్ని తెలియజేస్తుంది; దేవుణ్ణి అక్షరార్థంగా చూశాడనే నిర్ణయాన్ని బలవంతంగా రుద్దదు.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: ఒక మనిషి తన స్నేహితునితో మాట్లాడినట్లు
  rationale: హీబ్రూ ఉపమానంలోని ఏకవచన రూపాన్నీ స్నేహపూర్వక సంబంధాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְשָׁב אֶל־הַמַּחֲנֶה
  choice: తరువాత మోషే శిబిరానికి తిరిగి వచ్చేవాడు
  rationale: కర్తలో సందిగ్ధత రాకుండా మోషే పేరును స్పష్టంగా పేర్కొని, సందర్భంలోని అలవాటైన చర్యను కొనసాగిస్తుంది.
- source_word: וּמְשָׁרְתוֹ
  choice: అతని సహాయకుడు
  rationale: యెహోషువ మోషేకు తోడుగా సేవచేసే పాత్రను తెలియజేస్తుంది; గృహదాస్య భావాన్ని అనవసరంగా కలిగించదు.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: నూను కుమారుడు యెహోషువ
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి పేరుతో గుర్తింపును సహజంగా అందిస్తుంది.
- source_word: נַעַר
  choice: ఒక యువకుడు
  rationale: ఈ పదానికి ఇక్కడ సహజమైన వయస్సు-సంబంధిత అర్థాన్ని ఇస్తుంది; సేవాపాత్ర భావం ఇప్పటికే ‘సహాయకుడు’లో వ్యక్తమైంది.
- source_word: לֹא יָמִישׁ
  choice: వెళ్లేవాడు కాదు
  rationale: అక్కడి నుంచి తొలగకపోవడం లేదా విడిచి వెళ్లకపోవడం అనే భావాన్ని, అలవాటైన చర్యకు సరిపోయే తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: ఆ గుడారం లోపలినుంచి
  rationale: ‘గుడారం మధ్యనుండి’ అనే కృత్రిమ పదబంధానికి బదులుగా, మూలంలోని లోపలి ప్రదేశ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యాహ్వే మోషేతో ‘ముఖాముఖిగా’ మాట్లాడాడనే మానవరూప వర్ణన
  choice: ప్రధాన పాఠ్యంలో ‘ముఖాముఖిగా’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘నేరుగా’ లేదా ‘వ్యక్తిగతంగా’ అని భావానువాదం చేయడం
  rationale: ఈ హీబ్రూ నుడికారం దైవ-మానవ సంభాషణలోని అసాధారణ ప్రత్యక్షతను, సాన్నిహిత్యాన్ని వ్యక్తం చేస్తుంది. దేవుణ్ణి చూడడం గురించి ఇతర వచనాలతో ఉన్న ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకుండా మూలంలోని భాషను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. పునరావృత చర్యలను ‘మాట్లాడేవాడు,’ ‘వచ్చేవాడు,’ ‘వెళ్లేవాడు కాదు’ అనే రూపాలతో వ్యక్తం చేశాం. రెండో పాదంలో కర్త స్పష్టత కోసం ‘మోషే’ పేరును పునరుక్తి చేశాం; [b] సూచికను దాని వివరణకు సంబంధించిన ‘గుడారం’ పదంపైనే ఉంచాం.
