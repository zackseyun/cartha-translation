source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: te
  text: 'అయితే ఆయన ఇలా అన్నాడు: “నీవు నా ముఖాన్ని[a] చూడలేవు; ఎందుకంటే మానవుడు[b] నన్ను చూసి బ్రతకలేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా సన్నిధిని.’ హీబ్రూలో అక్షరార్థంగా ‘నా ముఖాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మానవుడు’ అనే పదం ఏ ఒక్క పురుషుణ్ణి మాత్రమే కాక, సాధారణంగా మానవులందరినీ సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ఆయన ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు వచనంలో మోషే చేసిన అభ్యర్థనకు వ్యతిరేక స్పందనను సందర్భం సూచిస్తున్నందున ‘అయితే’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: לֹא תוּכַל
  choice: చూడలేవు
  rationale: יכל ఇక్కడ అనుమతిని కాక సామర్థ్యం లేదా సాధ్యత లేకపోవడాన్ని సూచిస్తుంది. ‘చూడలేవు’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: לִרְאֹת
  choice: చూడ
  rationale: ראה ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది; ‘చూడ’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: אֶת־פָּנַי
  choice: నా ముఖాన్ని
  rationale: פָּנִים యొక్క ప్రత్యక్ష అర్థం ‘ముఖం.’ ఇది దేవుని సన్నిధిని కూడా సూచించగలిగినా, మూలంలోని సజీవమైన మానవరూప వర్ణనను ప్రధాన పాఠ్యంలో నిలిపి ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇది ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: לֹא יִרְאַנִי
  choice: నన్ను చూసి బ్రతకలేడు
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ సాధారణ సూత్రాన్ని తెలియజేస్తుంది. తరువాతి וָחָיతో కలిసి, దేవుణ్ణి చూసి సజీవంగా కొనసాగడం అసాధ్యమనే ఫలితాన్ని తెలుగు వాక్యం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאָדָם
  choice: మానవుడు
  rationale: ఏకవచన నామవాచకం ఇక్కడ మానవజాతికి సాధారణ ప్రతినిధిగా ఉంది. ‘మానవుడు’ లింగపరంగా విస్తృతమైన భావాన్ని, వ్యాకరణ ఏకవచనాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: וָחָי
  choice: బ్రతకలేడు
  rationale: ఇది దేవుణ్ణి చూసిన తరువాత జీవించి ఉండలేడనే ఫలితం లేదా పర్యవసానాన్ని సూచిస్తుంది. ‘బ్రతకలేడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: ‘నా ముఖం’ అనే దేవునికి సంబంధించిన మానవరూప భాష
  choice: ప్రధాన పాఠ్యంలో ‘నా ముఖాన్ని’ అని నిలిపి ఉంచడం
  alternative: నా సన్నిధిని
  rationale: హీబ్రూ పాఠ్యం స్పష్టంగా ‘ముఖం’ అనే రూపకాత్మకంగా విస్తరించగల దృశ్య పదాన్ని ఉపయోగిస్తుంది. దానిని వ్యాఖ్యానాత్మకమైన అమూర్త పదంగా మార్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపి, ‘సన్నిధి’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: הָאָדָם యొక్క సాధారణ మానవజాతి భావం
  choice: ‘మానవుడు’ అని అనువదించడం
  alternative: ఏ మనిషైనా / మానవజాతి
  rationale: మూలపదం వ్యాకరణపరంగా ఏకవచనమైనా, ఇక్కడ మానవులందరికీ వర్తించే సాధారణ ప్రకటనగా ఉంది. ‘మానవుడు’ రెండు లక్షణాలనూ నిలుపుతుంది; పరిధిని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యం నిలిచేలా రచించబడింది. ‘ముఖం’ అనే మూలంలోని స్పష్టమైన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని భావవిస్తారాన్ని పాదటిప్పణిలో తెలిపాం.
