source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: te
  text: అయితే, నేను నీ దృష్టిలో అనుగ్రహం పొందానని, నేను నీ ప్రజలతో కూడి, దేనివల్ల తెలుస్తుంది? నీవు మాతో వెళ్లడం వల్లనే కదా? అలా నేనూ నీ ప్రజలూ భూమిమీద ఉన్న ఇతర ప్రజలందరి నుండి ప్రత్యేకంగా గుర్తించబడతాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వేరుగా ఉంచబడతాం” లేదా “విశిష్టులుగా చేయబడతాం.” హీబ్రూ క్రియ ఇతరుల నుండి అసాధారణంగా లేదా ప్రత్యేకంగా గుర్తించబడే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה
  choice: అయితే ... దేనివల్ల
  rationale: సంధానార్థక వావ్‌తో కూడిన ప్రశ్నార్థక పదం ముందటి వాక్యంతో సంబంధాన్ని, ఏ సాధనం వల్ల ఇది తెలియగలదనే ప్రశ్నను వ్యక్తం చేస్తుంది.
- source_word: יִוָּדַע אֵפוֹא
  choice: తెలుస్తుంది
  rationale: నిఫ్అల్ రూపంలోని పరోక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, אֵפוֹא యొక్క నిర్ధారణాత్మక భావాన్ని ‘అయితే’ ద్వారా వ్యక్తం చేశాం.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో అనుగ్రహం పొందామని
  rationale: హీబ్రూ నుడికారంలోని అనుకూల ఆదరణ భావాన్ని ‘అనుగ్రహం పొందడం’ సహజంగా తెలియజేస్తుంది; వెంట వచ్చే ‘నేనూ నీ ప్రజలూ’ రెండింటినీ భావపరంగా కలుపుతుంది.
- source_word: אֲנִי וְעַמֶּךָ
  choice: నేనూ నీ ప్రజలూ
  rationale: మోషే తనతోపాటు ప్రజలను స్పష్టంగా చేర్చిన జోడింపును నిలిపాం.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: నీవు మాతో రావడం వల్లనే కదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకార ప్రశ్నను ‘కదా?’ నిలుపుతుంది; בְּ ఉపసర్గ సూచించే సాధనార్థాన్ని ‘వల్లనే’ స్పష్టం చేస్తుంది.
- source_word: וְנִפְלֵינוּ
  choice: ప్రత్యేకంగా గుర్తించబడతాం
  rationale: פלא నిఫ్అల్ ఇక్కడ ఇతరుల నుంచి విశిష్టంగా లేదా వేరుగా గుర్తింపబడే భావాన్ని ఇస్తుంది. తెలుగు పదబంధం ఆ భావాన్ని అతిగా సిద్ధాంతీకరించకుండా తెలియజేస్తుంది.
- source_word: מִכָּל הָעָם
  choice: ఇతర ప్రజలందరి నుండి
  rationale: ఏకవచన సమూహవాచక עָם యొక్క విభజనాత్మక భావాన్ని సహజ తెలుగులో ‘ప్రజలందరి’గా ఇచ్చాం; పోలికను స్పష్టం చేయడానికి ‘ఇతర’ చేర్చాం.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: భూమిమీద ఉన్న
  rationale: లోకమంతట నివసించే ప్రజలను సూచించే సాధారణ హీబ్రూ వ్యక్తీకరణకు సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: ఇశ్రాయేలు ప్రజల ప్రత్యేకతకు ఆధారం
  choice: దేవుడు వారితో రావడమే వారిని ఇతర ప్రజల నుండి ప్రత్యేకంగా గుర్తింపజేస్తుంది.
  alternative: ధర్మశాస్త్రం, దేశం లేదా జాతి గుర్తింపే వారి ప్రత్యేకతకు ప్రధాన ఆధారం.
  rationale: ఈ వచనం ప్రజల ప్రత్యేకతను దేవుని సన్నిధితో—ఆయన వారితో వెళ్లడంతో—నేరుగా అనుసంధానిస్తుంది; అనువాదం ఆ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ అలంకార ప్రశ్నలను నిలిపి, ‘నేనూ నీ ప్రజలూ’ అనే పునరుక్తికి సహజమైన తెలుగు రూపం ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
