  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నేనే నా మంచితనమంతటినీ నీ ముందుగా దాటివెళ్లేలా చేస్తాను. నీ ఎదుట యాహ్వే నామాన్ని ప్రకటిస్తాను. నేను ఎవరికి కృప చూపుతానో వారికి కృప చూపుతాను; ఎవరిపై కనికరం చూపుతానో వారిపై కనికరం చూపుతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరిపై కరుణ చూపుతానో వారిపై కరుణ చూపుతాను.”
    reason: רחם అనే హీబ్రూ క్రియకు ‘కనికరం చూపు’తో పాటు ‘కరుణ చూపు’ అనే అర్థం కూడా సాధ్యమైనందున పదార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
lexical_decisions:
- source_word: אַעֲבִיר
  choice: వెళ్లేలా చేస్తాను
  rationale: עבר క్రియ హిఫీల్ రూపంలో ఉన్నందున కారణార్థాన్ని వ్యక్తం చేస్తుంది. ‘వెళ్లేలా చేస్తాను’ అనేది ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל טוּבִי
  choice: నా మంచితనమంతటినీ
  rationale: טוּב అనేది మంచితనం, మేలు చేసే స్వభావం, సౌఖ్యకరత అనే భావాలను కలిగి ఉంటుంది. దేవుని స్వప్రత్యక్షత, కృప, కనికరం అనే సందర్భంలో ‘మంచితనం’ ఆయన శ్రేయస్కరమైన స్వభావాన్ని విస్తృతంగా తెలియజేస్తుంది.
- source_word: עַל־פָּנֶיךָ
  choice: నీ ఎదుటగా
  rationale: అక్షరార్థంగా ముఖానికి ఎదురుగా లేదా ముందుగా అనే స్థలభావం ఉంది. ‘నీ ఎదుటగా’ దైవ ప్రత్యక్షత మోషే ముందు సాగిపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: ‘యాహ్వే’ అనే నామాన్ని ప్రకటిస్తాను
  rationale: ఈ సందర్భంలో קרא בשם అనేది ప్రార్థనగా పిలవడం కంటే నామాన్ని ప్రకటించడం లేదా వెల్లడించడం. నిర్గమకాండం 34లో వచ్చే దేవుని స్వప్రకటనతో ఇది సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన ఆధునిక లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: మోషే సమక్షంలో దేవుని నామప్రకటన జరుగుతుందనే స్థల, సాన్నిధ్య భావాలను ఈ పదబంధం నిలుపుతుంది.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: నేను ఎవరికి కృప చూపుతానో వారికి కృప చూపుతాను
  rationale: హీబ్రూలో ఒకే మూలపదం పునరుక్తమై నొక్కిచెప్పబడింది. తెలుగులో ‘కృప చూపు’ అనే పదబంధాన్ని రెండుసార్లు ఉంచడం ద్వారా ఆ పునరుక్తి, దాని దైవశాస్త్ర బరువు నిలుస్తాయి.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: ఎవరిపై కనికరం చూపుతానో వారిపై కనికరం చూపుతాను
  rationale: רחם కనికరం కలిగి ఉండడం లేదా దయ చూపడం అనే భావాన్ని ఇస్తుంది. ‘కనికరం చూపు’ మూలంలోని భావోద్వేగపూర్వక కరుణను తెలియజేస్తూ, పునరుక్తిని కూడా కాపాడుతుంది.
- source_word: אֲנִי
  choice: నేనే
  rationale: క్రియలోనే కర్త సూచించబడినా ప్రత్యేక సర్వనామం రావడం వల్ల ఉన్న ఉద్ఘాటనను ‘నేనే’ సహజంగా వ్యక్తం చేస్తుంది; ‘నేను మాత్రమే’ అన్నంత ప్రత్యేకతను అనవసరంగా చేర్చదు.
theological_decisions:
- issue: కృప, కనికరం గురించి దేవుని స్వతంత్ర స్వప్రకటన
  choice: ‘ఎవరికి కృప చూపుతానో వారికి కృప చూపుతాను; ఎవరిపై కనికరం చూపుతానో వారిపై కనికరం చూపుతాను’ అనే ప్రథమ పురుష పునరుక్తిని యథాతథ భావంతో నిలిపాం.
  alternative: దీనిని దేవుని దయ గురించిన సాధారణ సూత్రంగా స్వేచ్ఛగా వివరణ చేయడం, లేదా తరువాతి కాలపు నిర్ణయవాద దైవశాస్త్ర సూత్రాలను స్పష్టంగా చేర్చడం.
  rationale: హీబ్రూ వాక్యం కృప, కనికరం చూపడంలో దేవుని స్వేచ్ఛను ఉద్ఘాటనతో తెలియజేస్తుంది. తరువాతి సిద్ధాంత వివాదాలను పరిష్కరించకుండా, మూలంలోని దైవశాస్త్ర ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ పునరుక్తులు, కారణార్థక క్రియ, స్పష్టమైన ‘నేనే’ ఉద్ఘాటన నిలుపుతూ, అతి అక్షరానువాదపు అసహజతను నివారించాం. దైవ నామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
