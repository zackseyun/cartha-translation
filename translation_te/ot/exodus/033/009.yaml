source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: te
  text: మోషే గుడారంలోకి ప్రవేశించినప్పుడల్లా, మేఘస్తంభం దిగివచ్చి గుడారపు ప్రవేశద్వారం దగ్గర నిలిచేది; ఆయన మోషేతో మాట్లాడేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత స్పష్టంగా, “యెహోవా మోషేతో మాట్లాడేవాడు.” ఈ ఉపవాక్యంలో హీబ్రూ కర్తను స్పష్టంగా చెప్పదు; అయితే సందర్భం అది యెహోవా అని తెలియజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: ప్రవేశించినప్పుడల్లా
  rationale: ఈ నిర్మాణం గతకాలంలో పదేపదే జరిగే సందర్భాన్ని సూచిస్తుంది. ‘ప్రవేశించినప్పుడల్లా’ ఆ అలవాటైన పునరావృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: గుడారం / గుడారపు
  rationale: హీబ్రూ వచనంలో ఇక్కడ ‘గుడారం’ మాత్రమే ఉంది; ‘సమావేశ గుడారం’ అనే పూర్తి పేరు లేదు. అందువల్ల సందర్భంలో ఇప్పటికే గుర్తించబడిన గుడారాన్ని మూలానికి దగ్గరగా ఉంచాం.
- source_word: יֵרֵד
  choice: దిగివచ్చి
  rationale: ఈ క్రియ ఇక్కడ పునరావృత గతచర్యలో భాగం. వాక్యాంతంలోని ‘నిలిచేది’తో కలిసి ‘దిగివచ్చి ... నిలిచేది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עַמּוּד הֶעָנָן
  choice: మేఘస్తంభం
  rationale: నిర్దిష్టమైన దృశ్యరూపాన్ని సంక్షిప్తంగా, సహజంగా నిలబెట్టే ప్రామాణిక తెలుగు సమాసం.
- source_word: וְעָמַד
  choice: నిలిచేది
  rationale: ప్రారంభంలోని పునరావృత సందర్భానికి అనుగుణంగా, ఇది ప్రతిసారి జరిగే గతచర్య అని తెలుపుతుంది.
- source_word: פֶּתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారం దగ్గర
  rationale: פתח ఇక్కడ గుడారంలోకి ప్రవేశించే తెరువు లేదా ద్వారస్థానాన్ని సూచిస్తుంది. ‘ప్రవేశద్వారం దగ్గర’ ఆధునిక తెలుగులో సహజమైన స్థలవ్యక్తీకరణ.
- source_word: וְדִבֶּר
  choice: ఆయన ... మాట్లాడేవాడు
  rationale: హీబ్రూలో కర్త స్పష్టంగా చెప్పబడలేదు; క్రియ పుంలింగ ఏకవచనంలో ఉంది. ‘ఆయన’ ఆ అంతర్నిహిత కర్తను నిలుపుతూ, సందర్భం ద్వారా దేవుడిని సూచించనిస్తుంది.
- source_word: עִם מֹשֶׁה
  choice: మోషేతో
  rationale: עִם యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతూ పరస్పర సంభాషణ యొక్క సంబంధాత్మక నుడికారాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘మోషేతో మాట్లాడేవాడు’ అనే క్రియకు అంతర్నిహిత కర్త
  choice: ‘ఆయన’ అని ఉంచి, కర్తను సందర్భం ద్వారా గ్రహించేలా చేయడం
  alternative: ‘యెహోవా మోషేతో మాట్లాడేవాడు’ అని స్పష్టంగా చేర్చడం; లేదా తక్కువ సంభావ్యతతో మేఘస్తంభాన్నే కర్తగా గ్రహించడం
  rationale: సందర్భం కర్త యెహోవా అని తెలియజేస్తుంది, కాని ఈ హీబ్రూ ఉపవాక్యంలో ఆయన పేరు స్పష్టంగా లేదు. అందువల్ల మూలంలోని అంతర్నిహితత్వాన్ని నిలుపుతూ, పాదసూచికలో స్పష్టమైన ప్రత్యామ్నాయాన్ని అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. పునరావృత గతచర్యను ‘ప్పుడల్లా’ మరియు ‘నిలిచేది/మాట్లాడేవాడు’ రూపాలతో వ్యక్తం చేశాం. మూలంలోని అస్పష్ట కర్తను ప్రధాన పాఠ్యంలో అతిగా నిర్ధారించకుండా నిలిపి, అవసరమైన వివరణను పాదసూచికలో ఇచ్చాం.
