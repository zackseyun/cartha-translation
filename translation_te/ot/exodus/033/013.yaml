id: EXO.33.13
reference: Exodus 33:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, నీ దృష్టిలో నాకు అనుగ్రహం దొరికినట్లయితే, దయచేసి నీ మార్గాలను నాకు తెలియజేయుము; తద్వారా నేను నిన్ను తెలుసుకొని, నీ దృష్టిలో అనుగ్రహం పొందగలను.[a] ఈ జనము నీ ప్రజలేనని గమనించుము.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తద్వారా నేను నిన్ను తెలుసుకొని’ అనే మాటను ‘నేను నిన్ను తెలుసుకొనేలా’ అని కూడా అనువదించవచ్చు. హీబ్రూ వాక్యసంబంధం ఉద్దేశం లేదా ఫలితం అనే రెండు ఛాయలకు చోటిస్తుంది.
    reason: grammatical_ambiguity
  - marker: b
    text: 'అక్షరార్థంగా, ‘చూడు.’ ఇక్కడ భావం: ‘గమనించు’ లేదా ‘పరిగణనలోకి తీసుకో.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి సందర్భం నుంచి వచ్చే తార్కిక మలుపును, అలాగే ‘ఇప్పుడు’ అనే కాలసూచనను వ్యక్తం చేస్తుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: వినయపూర్వకమైన వేడుకోలును ఆధునిక సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో నాకు అనుగ్రహం దొరికినట్లయితే
  rationale: ‘నీ కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘నీ దృష్టిలో’గా ఇచ్చి, חֵןను ఈ సందర్భంలో దైవశాస్త్రీయ సాంకేతిక పదంగా కాక ఆదరణ/అనుకూలత భావమున్న ‘అనుగ్రహం’గా అనువదిస్తుంది.
- source_word: הוֹדִעֵנִי
  choice: నాకు తెలియజేయి
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలిసేలా చేయు/తెలియజేయు’ అనే కారణార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: דְּרָכֶךָ
  choice: నీ మార్గాన్ని
  rationale: ఇచ్చిన WLC పాఠంలో ఈ రూపం ఏకవచనం; అందువల్ల బహువచన ‘మార్గాలను’ కాక ఏకవచనం వాడబడింది. ఇది దేవుడు వ్యవహరించే విధానాన్ని కూడా సూచించగలదు.
- source_word: וְאֵדָעֲךָ
  choice: అప్పుడు నేను నిన్ను తెలుసుకొని
  rationale: వ్యక్తిగతంగా దేవుణ్ణి తెలుసుకోవడం అనే సంబంధాత్మక భావాన్ని ఉంచుతుంది; వాక్యప్రవాహంలో ఫలితం/ఉద్దేశం రెండింటికీ చోటు ఉండేలా చేసింది.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: నీ దృష్టిలో అనుగ్రహం పొందేలా చేయి
  rationale: לְמַעַן యొక్క ఉద్దేశార్థాన్ని వ్యక్తం చేస్తూ, మొదటి భాగంలోని ‘నీ దృష్టిలో… అనుగ్రహం’ అనే పునరుక్తిని నిలుపుతుంది.
- source_word: וּרְאֵה
  choice: గమనించు
  rationale: ראה యొక్క అక్షరార్థం ‘చూడు’; ఇక్కడ అది శారీరకంగా చూడటం కంటే విషయాన్ని పరిగణనలోకి తీసుకోమనే విజ్ఞప్తిగా వాడబడింది.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: ఈ జనమే నీ ప్రజ
  rationale: גּוֹי మరియు עַם అనే రెండు వేరు పదాలను వరుసగా ‘జనం’ మరియు ‘ప్రజ’తో సూచించి, జాతీయ మరియు ఒడంబడిక సంబంధ భావాలను ఒకే పదంగా కలిపివేయలేదు.
theological_decisions:
- issue: మోషే దేవుణ్ణి ‘తెలుసుకోవడం’ అనే మాట యొక్క భావం
  choice: వ్యక్తిగత-సంబంధాత్మక అర్థాన్ని తెరిచి ఉంచడం
  alternative: కేవలం దేవుని ప్రణాళికను లేదా సమాచారాన్ని తెలుసుకోవడం
  rationale: וְאֵדָעֲךָ నేరుగా ‘నేను నిన్ను తెలుసుకొందును’ అని చెబుతుంది; దాన్ని కేవలం బౌద్ధిక సమాచారం లేదా ఏదైనా ప్రత్యేక దైవశాస్త్రీయ సిద్ధాంతంగా కుదించకూడదు.
- issue: చివరి వాక్యభాగంలోని ప్రజా-ఒడంబడిక భావం
  choice: ‘ఈ జనమే నీ ప్రజ’
  alternative: ‘ఈ ప్రజలు నీవారు’
  rationale: హీబ్రూలోని גּוֹי (‘జనం/జనము’) మరియు עַם (‘ప్రజ’) రెండింటినీ నిలిపి, మోషే విజ్ఞప్తిలోని ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సులభంగా అర్థమయ్యే శైలి. దేవునితో ప్రత్యక్ష సంభాషణలో తెలుగు బైబిల్ సంప్రదాయానికి అనుగుణంగా ఏకవచన సంబోధన వాడబడింది. మూలపాఠంలోని పునరుక్తి, వినయపూర్వక విజ్ఞప్తి, ‘జనం/ప్రజ’ భేదం నిలుపబడ్డాయి.
