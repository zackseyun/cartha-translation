  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలీయులు హోరేబు కొండ నుండి ఇకపై తమ ఆభరణాలను తీసివేసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు హోరేబు కొండ దగ్గర తమ ఆభరణాలను తీసివేసుకున్నారు.” హీబ్రూ పదబంధాన్ని ఆ చర్య జరిగిన స్థలంగా గానీ, హోరేబు కొండ నుండి ఆ తరువాతి కాలాన్ని సూచించేదిగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: తీసివేసుకున్నారు
  rationale: హిత్పయేల్ రూపం తమ మీద ఉన్నవాటిని తామే తొలగించుకున్నారనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ఈ ఆత్మార్థక ప్రయోగం సహజంగా ఉండి, ఉద్దేశపూర్వక తొలగింపును తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అనవచ్చును; అయితే ఇది ఇశ్రాయేలు ప్రజలను సూచించే స్థిర హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, స్పష్టంగా అదే సమూహార్థాన్ని అందిస్తుంది.
- source_word: עֶדְיָם
  choice: తమ ఆభరణాలను
  rationale: עֲדִי అలంకరణకు ధరించే వస్తువులను విస్తృతంగా సూచిస్తుంది. ‘ఆభరణాలు’ అనేది పదార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా సందర్భానికి తగిన విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: מֵהַר חוֹרֵב
  choice: హోరేబు కొండ మొదలుకొని
  rationale: 'מִן‌ను ఇక్కడ ఆ స్థితి ప్రారంభమైన కాల-స్థల బిందువుగా తీసుకున్నాం: హోరేబు దగ్గర మొదలుకొని ఇకపై వారు ఆభరణాలు ధరించలేదు. అయితే ‘హోరేబు కొండ దగ్గర’ అనే స్థానార్థం కూడా సాధ్యమే; దానిని పాదసూచికలో నిలిపాం.'
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే హీబ్రూ నుడికారానికి బదులుగా సహజమైన ‘ఇశ్రాయేలీయులు’ వాడబడింది; మూలంలోని మֵהַר חוֹרֵב అస్పష్టత పాదసూచికలో సంరక్షించబడింది.
