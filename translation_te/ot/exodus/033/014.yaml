    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నా ముఖం.” ఇక్కడ అది యెహోవా వ్యక్తిగత సన్నిధిని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the contextual sense of ‘presence’ while restoring the Hebrew verb’s ‘go’ sense and avoiding the unexpressed phrase ‘with you.’ The footnote preserves the underlying anthropomorphic wording without overexplaining the verse.
