source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నా సన్నిధి[a] వెళ్తుంది; నేను నీకు విశ్రాంతి ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నా ముఖం.” ఇక్కడ అది యెహోవా వ్యక్తిగత సన్నిధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అప్పుడు ఆయన ఇలా అన్నాడు
  rationale: వయ్యిక్తోల్ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన ప్రవాహంలో చూపిస్తుంది; కాలక్రమాన్ని అతిగా నిర్దిష్టం చేయకుండా సందర్భానుసారంగా ‘అప్పుడు’ వాడబడింది.
- source_word: פָּנַי
  choice: నా సన్నిధి
  rationale: అక్షరార్థంగా ‘నా ముఖం’; ఇక్కడ యెహోవా స్వయంగా తోడుగా ఉండే వ్యక్తిగత సన్నిధిని సూచించే హీబ్రూ నుడికారం. తెలుగు పాఠకులకు ‘నా సన్నిధి’ సహజంగా ఉండగా, మూలంలోని ముఖ-రూపకం పాదసూచికలో నిలుపబడింది.
- source_word: יֵלֵכוּ
  choice: నీతో వస్తుంది
  rationale: మూలంలో ‘వెళ్తుంది’ అనే భావం ఉంది. అయితే ఎవరితో వెళ్తుందో సందర్భం ద్వారా అర్థమవుతుంది; తెలుగులో తోడుగా ఉండే వాగ్దానాన్ని సహజంగా వ్యక్తం చేయడానికి ‘నీతో వస్తుంది’ ఎంచుకోబడింది. ఏకవచన ‘వస్తుంది’ అనేది ‘సన్నిధి’తో వ్యాకరణపరంగా సరిపోతుంది.
- source_word: וַהֲנִחֹתִי
  choice: నేను నీకు విశ్రాంతి ఇస్తాను
  rationale: נוח హిఫీల్ రూపంలోని ‘విశ్రాంతి కలిగించడం/ఇవ్వడం’ అనే కారణార్థాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָךְ
  choice: నీకు
  rationale: ఇది రెండవ పురుష ఏకవచన ప్రత్యయం; మోషేను ఉద్దేశించిన ఏకవచనాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: פָּנַי అనే మానవరూపక వ్యక్తీకరణ
  choice: నా సన్నిధి
  alternative: నా ముఖం; నేనే స్వయంగా
  rationale: ‘సన్నిధి’ యెహోవా స్వయంగా తోడుగా వెళ్లడాన్ని తెలియజేస్తుంది; దానిని కేవలం అమూర్త శక్తిగా మార్చదు. అదే సమయంలో మూలంలోని ‘ముఖం’ అనే గాఢమైన రూపకాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: לָךְ లోని ఏకవచన సంబోధన మరియు దాని విస్తృత సందర్భం
  choice: నీతో / నీకు అనే ఏకవచనం
  alternative: మీతో / మీకు అనే బహువచనం
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా మోషేను ఉద్దేశించిన ఏకవచనం. ఈ వాగ్దానం ప్రజల ప్రయాణానికీ సంబంధించినదైనా, అనువాదంలో మూలంలోని ఏకవచనాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సన్నిధి’ బైబిలు సందర్భంలో పరిచితమైన పదం; పాదసూచిక మూల రూపకాన్ని వెల్లడిస్తుంది.
