revisions:
- from: 'అప్పుడు ఆయన ఇలా అన్నాడు: “నా సన్నిధి[a] నీతో వస్తుంది; నేను నీకు విశ్రాంతి ఇస్తాను.”'
  to: 'ఆయన ఇలా అన్నాడు: “నా సన్నిధి[a] వెళ్తుంది; నేను నీకు విశ్రాంతి ఇస్తాను.”'
  rationale: The revision retains the contextual sense of ‘presence’ while restoring the Hebrew verb’s ‘go’ sense and avoiding the unexpressed phrase ‘with you.’ The footnote preserves the underlying anthropomorphic wording without overexplaining the verse.
