- from: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవు చెప్పిన ఈ విషయాన్ని[a] కూడా నేను చేస్తాను. ఎందుకంటే నా దృష్టిలో నీకు అనుగ్రహం లభించింది[b]; నిన్ను పేరుపెట్టి ఎరుగుదును.”'
  to: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవు చెప్పిన ఈ విషయాన్ని[a] కూడా నేను చేస్తాను. ఎందుకంటే నీవు నా దృష్టిలో అనుగ్రహం పొందావు[b]; నీవు నాకు పేరుపేరునా తెలుసు.”'
