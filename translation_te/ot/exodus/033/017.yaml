  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవు చెప్పిన ఈ విషయాన్ని[a] కూడా నేను చేస్తాను. ఎందుకంటే నీవు నా దృష్టిలో అనుగ్రహం పొందావు[b]; నీవు నాకు పేరుపేరునా తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతి” లేదా “ఈ మాట.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా కళ్లలో నీవు అనుగ్రహం పొందావు”; అంటే అనుకూల ఆదరణ పొందడం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: גַּם
  choice: కూడా
  rationale: మునుపటి సందర్భంలో మోషే చేసిన విన్నపానికి ఇది అదనంగా సంబంధించినదని తెలిపే సంకలన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయాన్ని
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘సంగతి’ అనే విస్తృత అర్థాలున్నాయి. ఇక్కడ మోషే చెప్పిన విన్నపాన్ని, దానికి అనుగుణంగా చేయబోయే కార్యాన్ని కలిపి సూచించడానికి ‘విషయం’ సరిపోతుంది.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు చెప్పిన
  rationale: మోషే పలికిన మాటతో వాగ్దానానికి ఉన్న ప్రత్యక్ష సంబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶעֱשֶׂה
  choice: నేను చేస్తాను
  rationale: עשה అనే సాధారణ క్రియకు సందర్భానుసారమైన సూటి సమానం; మోషే విన్నపాన్ని నెరవేర్చుతాననే వాగ్దానాన్ని తెలియజేస్తుంది.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: నా దృష్టిలో నీకు అనుగ్రహం లభించింది
  rationale: హీబ్రూ నుడికారంలోని అనుకూల ఆదరణ భావాన్ని సహజ తెలుగులో అందిస్తూనే ‘నా దృష్టిలో’ అనే దృశ్యరూపాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: וָאֵדָעֲךָ
  choice: నిన్ను ... ఎరుగుదును
  rationale: ידע ఇక్కడ కేవలం సమాచారం తెలుసుకోవడం కాక, దేవుని వ్యక్తిగత గుర్తింపు మరియు సంబంధపూర్వక జ్ఞానాన్ని సూచిస్తుంది; ‘ఎరుగుదును’ ఆ గంభీరతను నిలుపుతుంది.
- source_word: בְּשֵׁם
  choice: పేరుపెట్టి
  rationale: దేవుడు మోషేను నిర్దిష్టంగా, వ్యక్తిగతంగా ఎరుగుతున్నాడనే భావాన్ని హీబ్రూ రూపకానికి దగ్గరగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచింది. ‘యాహ్వే’ అనేది ఆధునిక పాండిత్యంలో విస్తృతంగా అంగీకరించిన ఉచ్చారణకు తెలుగు లిప్యంతరీకరణ.
- issue: ‘నిన్ను పేరుపెట్టి ఎరుగుదును’ అనే మాటలోని సంబంధపూర్వక భావం
  choice: వ్యక్తిగత జ్ఞానం అనే భావాన్ని ఉంచడం
  alternative: ‘నిన్ను అంగీకరించాను’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ידע మరియు בְּשֵׁם కలయిక వ్యక్తిగత గుర్తింపును సూచించినప్పటికీ, ‘ఎరుగుదును’ అనే విస్తృత పదం మూలంలోని భావసాంద్రతను, సాధ్యమైన సంబంధపూర్వక అర్థాన్ని ముందే ఒకే విధంగా నిర్ణయించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, దైవవాక్యానికి తగిన గౌరవభరిత శైలిని నిలిపాం. ‘ఎరుగుదును’ సాధారణ సంభాషణలో కొంత అరుదైనా, ఇక్కడి వ్యక్తిగత-సంబంధపూర్వక భావాన్ని ‘తెలుసు’ కంటే స్పష్టంగా, గంభీరంగా అందిస్తుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
