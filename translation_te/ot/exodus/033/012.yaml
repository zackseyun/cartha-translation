id: EXO.33.12
reference: Exodus 33:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: te
  text: 'అప్పుడు మోషే యాహ్వేతో ఇలా అన్నాడు: “చూడు, ‘ఈ ప్రజలను పైకి తీసుకువెళ్లు’ అని నువ్వు నాతో చెబుతున్నావు. కానీ నాతో ఎవరిని పంపుతావో నాకు తెలియజేయలేదు. అయినా నువ్వు, ‘నేను నిన్ను పేరుతో తెలుసుకున్నాను[a]; అంతేకాక, నా దృష్టిలో నీకు అనుగ్రహం లభించింది[b]’ అని చెప్పావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిన్ను పేరుతో తెలుసుకున్నాను’ అనేది వ్యక్తిగతంగా తెలుసుకోవడాన్ని, ఆదరణ చూపడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నా దృష్టిలో నీకు కృప లభించింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగు లిపిలో దాని సాధారణ ఉచ్చారణానుసార రూపాన్ని నిలిపింది.
- source_word: רְאֵה
  choice: చూడు
  rationale: మోషే విజ్ఞప్తిని నేరుగా ప్రారంభించే ఆజ్ఞార్థక సంభాషణ సూచికను సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: הַעַל אֶת־הָעָם הַזֶּה
  choice: ఈ ప్రజలను పైకి తీసుకువెళ్లు
  rationale: హిఫిల్ రూపంలోని ‘పైకి తీసుకువెళ్లు’ అనే దిశాత్మక భావాన్ని, ‘ఈ ప్రజలు’ అనే కొంత దూరం చూపే ప్రయోగాన్ని కాపాడుతుంది.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: నాకు తెలియజేయలేదు
  rationale: ידע హిఫిల్‌లోని ‘తెలియజేయు’ అనే కారణార్థక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: నాతో ఎవరిని పంపుతావో
  rationale: సహవాసాన్ని సూచించే עִם భావాన్ని ‘నాతో’గా, వ్యక్తిని సూచించే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో ‘ఎవరిని’గా అందిస్తుంది.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: నేను నిన్ను పేరుతో తెలుసుకున్నాను
  rationale: వ్యక్తిగత ఎరుకను, ఆదరణను సూచించే హెబ్రీ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ‘పేరుతో’ అనే అంశంతో సహా నిలిపింది.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: నా దృష్టిలో నీకు అనుగ్రహం లభించింది
  rationale: ‘నా కళ్లలో’ అనే హెబ్రీ రూపకాన్ని తెలుగులో అర్థమయ్యే ‘నా దృష్టిలో’గా ఉంచి, חֵן‌ను సందర్భానుగుణంగా ‘అనుగ్రహం’గా అనువదించింది.
- source_word: וְגַם
  choice: అంతేకాక
  rationale: దేవుడు ఇంతకుముందు పలికిన మాటలోని అదనపు నొక్కిచెప్పే భావాన్ని స్పష్టంగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ‘నేను నిన్ను పేరుతో తెలుసుకున్నాను’ అనే మాట బలం
  choice: సంబంధపూర్వక నుడికారాన్ని యథాతథంగా నిలపడం
  alternative: ‘నేను నిన్ను వ్యక్తిగతంగా తెలుసుకున్నాను’ లేదా ‘నేను నిన్ను ఎన్నుకున్నాను’
  rationale: ఈ నుడికారం వ్యక్తిగత ఎరుకను, ఆదరణను సూచిస్తుంది; అయితే ‘ఎన్నుకున్నాను’ వంటి మరింత నిర్దిష్టమైన సిద్ధాంతార్థాన్ని హెబ్రీ పాఠం ఇక్కడ స్పష్టంగా చెప్పదు.
- issue: חֵן యొక్క భావం
  choice: అనుగ్రహం
  alternative: కృప లేదా ఆదరణ
  rationale: దేవుని దృష్టిలో లభించిన అనుకూలతను ‘అనుగ్రహం’ సహజంగా తెలియజేస్తుంది; ‘కృప’ కూడా సాధ్యమే గనుక దాన్ని పాదటీపులో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే సంభాషణ శైలి వాడబడింది. దేవునితో మోషే నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నువ్వు’ రూపం నిలిపబడింది. హెబ్రీలో పునరుక్తమైన וְאַתָּה కలిగించే వ్యత్యాసాన్ని ‘కానీ’, ‘అయినా’లతో సహజంగా వ్యక్తం చేసింది.
