  source_fidelity: హెబ్రీ పాఠంలోని సంభాషణ నిర్మాణం, ‘ఈ ప్రజలను పైకి తీసుకువెళ్లు’ అనే హిఫిల్ దిశాభావం, నాతో పంపబడబోయే వ్యక్తి గురించిన ప్రశ్న, అలాగే ‘పేరుతో తెలుసుకున్నాను’ మరియు ‘నా దృష్టిలో అనుగ్రహం’ అనే నుడికారాలు విశ్వసనీయంగా ప్రతిఫలించబడ్డాయి. וְאַתָּה యొక్క వ్యతిరేక/నొక్కిచెప్పే బలం ‘కానీ,’ ‘అయినా’ల ద్వారా సహజంగా వచ్చింది.
