  terminology: యְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించడం నిర్ణయానికి అనుగుణం. ‘అనుగ్రహం,’ ‘పేరుతో తెలుసుకున్నాను,’ ‘నా దృష్టిలో’ అనే పదబంధాలు మూల నుడికారాన్ని అతిగా సిద్ధాంతీకరించకుండా కాపాడుతున్నాయి. పాదటీపుల గుర్తులు వచనంలోని [a], [b]లకు సరిగ్గా సరిపోతున్నాయి.
