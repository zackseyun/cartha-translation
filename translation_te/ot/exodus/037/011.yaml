  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: te
  text: అతడు దానిపై స్వచ్ఛమైన బంగారం పొర పూశాడు; దాని చుట్టూ బంగారు అలంకార అంచును[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బంగారు అంచు”; సంప్రదాయ అనువాదంలో “బంగారు కిరీటం.”
    reason: זֵר అనే పదానికి ఉన్న అలంకారపు అంచు/రిమ్ అనే అర్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, సంప్రదాయ ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: וַיְצַף
  choice: పొదిగించి
  rationale: צפה అనే క్రియ ఇక్కడ ఒక వస్తువు ఉపరితలంపై లోహపు పొరను కప్పడాన్ని సూచిస్తుంది. గుడారపు సామగ్రి తయారీ సందర్భంలో ‘పొదిగించి’ సహజంగానూ నిర్దిష్టంగానూ ఉంది.
- source_word: אֹתוֹ
  choice: దానికి
  rationale: ఈ సర్వనామం మునుపటి వచనంలోని బల్లను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘దానికి ... పొదిగించి’ అని చెప్పడం సహజం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: ఈ పదబంధం అధిక శుద్ధిగల బంగారాన్ని సూచిస్తుంది. ‘స్వచ్ఛమైన బంగారం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַיַּעַשׂ לוֹ
  choice: దాని ... చేశాడు
  rationale: לֹו లోని సంబంధాన్ని తెలుగులో ‘దాని చుట్టూ’ అనే నిర్మాణం ద్వారా స్పష్టంగా నిలిపాం; అతడు బల్లనే చేయలేదు, దాని కోసం అంచును చేశాడు.
- source_word: זֵר
  choice: అంచు
  rationale: ఇక్కడ זֵר బల్ల చుట్టూ ఉన్న పైకి లేచిన లేదా అలంకారపు అంచును సూచిస్తుంది. ‘కిరీటం’ అనే సంప్రదాయ అక్షరార్థం ఆధునిక పాఠకునికి తప్పుదారి పట్టించవచ్చు; ‘అంచు’ సందర్భానికి సహజం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పదార్థాన్ని తెలిపే సాధారణ పదం; తెలుగులో విశేషణ రూపమైన ‘బంగారు’ సహజంగా సరిపోతుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అంచు వస్తువును అన్ని వైపులా ఆవరించిన భావాన్ని ‘చుట్టూ’ సహజంగా తెలియజేస్తుంది.
