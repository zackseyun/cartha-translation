translation:
  language: te
  text: బల్లను మోయడానికి కర్రలను చొప్పించే చోటులుగా, ఆ ఉంగరాలు చట్రం పక్కనే ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: చట్రం పక్కనే
  rationale: לְעֻמַּת సందర్భానుసారం ‘ఎదురుగా/దగ్గరగా/పక్కన’ అనే సంబంధాన్ని సూచించగలదు. బల్ల నిర్మాణ సందర్భంలో ఉంగరాలు చట్రానికి ఆనుకుని ఉన్న స్థానాన్ని సహజంగా తెలియజేయడానికి ‘పక్కనే’ ఎంచుకున్నాం.
- source_word: בָּתִּים לַבַּדִּים
  choice: మోతకర్రలకు ఆధారాలుగా
  rationale: బָּתִּים అక్షరార్థంగా ‘ఇళ్లు/చొప్పించే చోటులు’ అయినా, ఇక్కడ కర్రలను ఉంచి పట్టే అమరికను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆధారాలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: బల్లను మోయడానికి
  rationale: ఉద్దేశాన్ని సూచించే మూలభాషా నిర్మాణాన్ని సంక్షిప్తమైన సహజ తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్గమకాండంలోని వస్తు నిర్మాణ వివరణకు తగిన సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని స్థానసంబంధ పదానికి ఉన్న స్వల్ప విస్తృతిని సందర్భానుసారంగా ‘పక్కనే’ అని అందించాం.
