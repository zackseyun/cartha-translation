    rationale: ఈ సందర్భంలో కడ్డీలు మోయడానికి వాడేవేనని తెలిసినా, హెబ్రీ పదం ఈ వచనంలో ఆ ప్రయోజనాన్ని ప్రత్యేకంగా చెప్పదు. ‘కడ్డీలు’ మూలానికి మరింత సన్నిహితంగా ఉంటుంది.
