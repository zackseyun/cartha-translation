translation:
  language: te
  text: అతడు తుమ్మచెక్కతో కడ్డీలను తయారుచేశాడు; వాటిని బంగారంతో పొదిగించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: తయారుచేసి
  rationale: עשה అనే క్రియ యొక్క కథన రూపం ‘చేశాడు/తయారుచేశాడు’ అనే అర్థాన్ని ఇస్తుంది. తరువాతి క్రియతో సహజంగా కలపడానికి ‘తయారుచేసి’ అని అనువదించాం.
- source_word: בַּדֵּי
  choice: మోసే కడ్డీలను
  rationale: మందసాన్ని మోయడానికి ఉపయోగించే పొడవైన కడ్డీలను సూచిస్తుంది. సందర్భంలో వాటి ఉపయోగం స్పష్టంగా ఉండేందుకు ‘మోసే కడ్డీలు’ అని ఇచ్చాం.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטָּה ఎడారి ప్రాంతపు అకేషియా జాతి చెట్టును సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וַיְצַף
  choice: రేకు పొదిగించాడు
  rationale: ఈ పనితనపు సందర్భంలో צפה అంటే ఒక వస్తువుపై లోహపు పొరను కప్పడం. బంగారంతో చేసిన పనిని సహజంగా తెలియజేయడానికి ‘రేకు పొదిగించాడు’ అని అనువదించాం.
- source_word: אֹתָם
  choice: వాటికి
  rationale: బహువచనమైన కడ్డీలనే తిరిగి సూచించే కర్మ సర్వనామం; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ‘వాటికి’ అని ఇచ్చాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పొదిగించిన పదార్థం బంగారం. ‘బంగారు రేకు’ అనే సహజ తెలుగు ప్రయోగం ద్వారా పదార్థాన్ని స్పష్టం చేశాం.
