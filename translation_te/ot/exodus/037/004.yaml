translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని రెండు వరుస క్రియలను తెలుగు సహజ వాక్యప్రవాహంలో ఒక సంయుక్త వాక్యంగా అందించాం.
