  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: te
  text: అతడు అకేసియా చెక్కతో ఆ బల్లను చేశాడు. దాని పొడవు రెండు మూరలు, వెడల్పు ఒక మూర, ఎత్తు ఒకటిన్నర మూరలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “ఒక మూరా మరియు సగం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: వావ్-కన్సిక్యూటివ్‌తో ఉన్న עשה గతంలో జరిగిన వరుస కార్యాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘అతడు చేశాడు’ సహజంగా ఉండి మూల క్రియ యొక్క సరళ భావాన్ని కాపాడుతుంది.
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: ఈ నామవాచకం ఇక్కడ ప్రత్యక్ష గుడారంలోని నిర్దిష్టమైన బల్లను సూచిస్తుంది; తెలుగు కర్మవిభక్తి సందర్భంలో నిర్దిష్టత సహజంగా వ్యక్తమవుతుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఈ నిర్మాణ పదబంధం షిట్టీమ్/అకేసియా జాతి చెక్కను సూచిస్తుంది. ‘తుమ్మచెక్క’ ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన, సహజమైన సమానార్థకం.
- source_word: אַמָּתַיִם
  choice: రెండు మూరలు
  rationale: אַמָּה ప్రాచీన మోచేయి-ఆధారిత కొలమానం. దానికి తెలుగులో సంప్రదాయంగా వాడే ‘మూర’ను ఎంచుకొని చారిత్రక కొలమానాన్ని నిలిపాం.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం బల్లను సూచిస్తుంది; ‘దాని పొడవు’ సహజమైన తెలుగు రూపం.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: వెడల్పు ఒక మూర
  rationale: రెండవ కొలతను మూలంలోని సంక్షిప్త నామవాచక నిర్మాణానికి దగ్గరగా, కానీ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూరలు
  rationale: మూలంలోని ‘ఒక మూర మరియు సగం’ అనే ఖచ్చిత విలువను ఆధునిక తెలుగులో సహజమైన సంఖ్యారూపంతో వ్యక్తపరుస్తుంది.
- source_word: קֹמָתוֹ
  choice: ఎత్తు
  rationale: వస్తువు యొక్క నిలువు కొలతను సూచించే ఈ సందర్భంలో ‘ఎత్తు’ సరైన సహజ సమానార్థకం.
