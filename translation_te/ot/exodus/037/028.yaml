translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని రెండు వరుస కార్యాలను సహజమైన తెలుగు సంయుక్త వాక్యంగా ఉంచాం.
