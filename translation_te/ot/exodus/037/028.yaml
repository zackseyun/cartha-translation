  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: te
  text: అతడు ఆ మోయు దండాలను తుమ్మచెక్కతో చేసి, వాటిని బంగారంతో పొదిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియ యొక్క కథన భూతకాల రూపం; సందర్భంలో సహజమైన తెలుగు భూతకాల క్రియగా అనువదించబడింది.
- source_word: הַבַּדִּים
  choice: మోసే కర్రలను
  rationale: మందిరపు సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తున్నందున, కేవలం ‘కర్రలు’ కంటే వాటి పనిని స్పష్టం చేసే ఈ రూపం ఎంచుకోబడింది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטָּה అనే చెట్టు కలపను సూచించే నిర్మాణ పదబంధం; తెలుగు బైబిలు వాడుకలో పరిచయమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וַיְצַף
  choice: పూత పూశాడు
  rationale: చేతిపని సందర్భంలో צפה అంటే ఒక వస్తువును లోహంతో కప్పడం లేదా దానిపై లోహపు పూత వేయడం; ఆధునిక తెలుగులో సహజంగా ‘పూత పూశాడు’ అని ఇచ్చాం.
- source_word: אֹתָם
  choice: వాటికి
  rationale: ఈ సర్వనామం ముందున్న మోసే కర్రలను సూచిస్తుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ‘వాటికి’ అని మార్చబడింది.
- source_word: זָהָב
  choice: బంగారు
  rationale: పూతకు ఉపయోగించిన పదార్థం బంగారం; ‘బంగారు పూత’ అనే సహజ తెలుగు పదబంధంలో విశేషణ రూపం వాడబడింది.
