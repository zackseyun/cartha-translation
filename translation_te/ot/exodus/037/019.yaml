source:
  edition: WLC
  text: שְׁלֹשָׁ֣ה גְ֠בִעִים מְֽשֻׁקָּדִ֞ים בַּ/קָּנֶ֣ה הָ/אֶחָד֮ כַּפְתֹּ֣ר וָ/פֶרַח֒ וּ/שְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בְּ/קָנֶ֥ה אֶחָ֖ד כַּפְתֹּ֣ר וָ/פָ֑רַח כֵּ֚ן לְ/שֵׁ֣שֶׁת הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִן הַ/מְּנֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: te
  text: ఒక కొమ్మపై బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు[a], ఒక గుండ్రని ఉబ్బెత్తు అలంకార భాగం[b] మరియు ఒక పువ్వు ఉండేవి; మరో కొమ్మపై కూడా బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు, ఒక గుండ్రని ఉబ్బెత్తు అలంకార భాగం మరియు ఒక పువ్వు ఉండేవి. దీపస్తంభం నుండి వెలువడిన ఆరు కొమ్మలన్నిటికీ అలాగే ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాదంపువ్వుల మాదిరిగా చేసిన మూడు గిన్నెలు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం దీపస్తంభంపై ఉన్న గుండ్రని ఉబ్బెత్తు అలంకార భాగాన్ని సూచిస్తుంది; దీనిని “బొడిపె” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: గిన్నెలు
  rationale: దీపస్తంభంలోని గిన్నెవంటి అలంకార రూపాలను సూచించే సాధారణ, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: מְשֻׁקָּדִים
  choice: బాదంపువ్వుల ఆకారంలో
  rationale: బాదం చెట్టుతో సంబంధమున్న అలంకార నమూనాను సూచిస్తుంది; ఈ సందర్భంలో పుష్పాకృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָנֶה
  choice: కొమ్మ
  rationale: దీపస్తంభం నుంచి పక్కలకు విస్తరించే భాగాన్ని సందర్భానుకూలంగా, చిత్రాత్మకంగా తెలియజేస్తుంది.
- source_word: כַּפְתֹּר
  choice: మొగ్గలాంటి ఉబ్బెత్తు అలంకారం
  rationale: ఈ పదం సూచించే గుండ్రని అలంకార భాగాన్ని తెలుగులో స్పష్టంగా వివరిస్తుంది; ‘బొడిపె’ కూడా సాధ్యమే కాని తక్కువ గౌరవప్రదంగా వినిపించవచ్చు.
- source_word: פֶרַח
  choice: పువ్వు
  rationale: పుష్పాకార అలంకారాన్ని సరళంగా, నేరుగా తెలియజేస్తుంది.
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందు వివరించిన నమూనా ఆరు కొమ్మలన్నిటికీ వర్తించిందని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: దీపస్తంభం నుంచి బయలుదేరిన
  rationale: కొమ్మలు ప్రధాన దీపస్తంభం నుంచి వెలువడుతున్న నిర్మాణ చిత్రాన్ని నిలుపుతుంది.
- source_word: מְנֹרָה
  choice: దీపస్తంభం
  rationale: ప్రత్యేక హీబ్రూ పదాన్ని లిప్యంతరీకరించకుండా, వస్తువు అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యంలో రెండుసార్లు ‘ఒక కొమ్మ’ అని ఉన్నా, తెలుగులో వరుస వివరణ స్పష్టంగా ఉండేందుకు రెండవదాన్ని ‘మరొక కొమ్మ’గా ఇచ్చాం. చివరి క్రియ హీబ్రూలో స్పష్టంగా లేకపోయినా సందర్భంలోని నిర్మాణ వర్ణనను బట్టి ‘చేశాడు’ అని సహజంగా పూరించాం.
