    rationale: హీబ్రూ כֵּן לְשֵׁשֶׁת הַקָּנִים అనేది ఆరు కొమ్మలకూ ఈ విధంగానే ఉన్నదని తెలియజేస్తుంది; కర్తను, తయారుచేసే క్రియను స్పష్టంగా చెప్పదు.
