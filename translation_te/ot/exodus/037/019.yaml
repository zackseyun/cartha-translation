revisions:
- from: ఒక కొమ్మపై బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు[a], వాటితో మొగ్గలాంటి ఉబ్బెత్తు అలంకారం[b], పువ్వు ఉన్నాయి; మరొక కొమ్మపై కూడా బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు, వాటితో మొగ్గలాంటి ఉబ్బెత్తు అలంకారం, పువ్వు ఉన్నాయి. దీపస్తంభం నుంచి బయలుదేరిన ఆరు కొమ్మలన్నిటికీ అలాగే చేశాడు.
  to: ఒక కొమ్మపై బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు[a], ఒక గుండ్రని ఉబ్బెత్తు అలంకార భాగం[b] మరియు ఒక పువ్వు ఉండేవి; మరో కొమ్మపై కూడా బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు, ఒక గుండ్రని ఉబ్బెత్తు అలంకార భాగం మరియు ఒక పువ్వు ఉండేవి. దీపస్తంభం నుండి వెలువడిన ఆరు కొమ్మలన్నిటికీ అలాగే ఉండేవి.
  rationale: మూలంలోని అలంకార వివరాలను నిలుపుతూ, మూలంలో లేని “చేశాడు” అనే క్రియను తొలగించాం. כַּפְתֹּר‌కు ఉన్న విస్తృతమైన అలంకార-రూప అర్థాన్ని కాపాడేందుకు “మొగ్గలాంటి” స్థానంలో తటస్థమైన వివరణను వాడాం. “మరో కొమ్మపై” అనేది హీబ్రూ సమన్వయ వాక్యంలోని రెండవ కొమ్మను తెలుగులో సహజంగా సూచిస్తుంది; చివరి వాక్యం ఆ నమూనా ఆరు కొమ్మలకూ వర్తిస్తుందని స్పష్టం చేస్తుంది.
