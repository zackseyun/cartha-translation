  text: וְ/כַפְתֹּ֡ר תַּחַת֩ שְׁנֵ֨י הַ/קָּנִ֜ים מִמֶּ֗/נָּה וְ/כַפְתֹּר֙ תַּ֣חַת שְׁנֵ֤י הַ/קָּנִים֙ מִמֶּ֔/נָּה וְ/כַפְתֹּ֕ר תַּֽחַת שְׁנֵ֥י הַ/קָּנִ֖ים מִמֶּ֑/נָּה לְ/שֵׁ֨שֶׁת֙ הַ/קָּנִ֔ים הַ/יֹּצְאִ֖ים מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/021.yaml
  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: te
  text: దాని నుండి వచ్చిన రెండు కొమ్మల కింద ఒక గుండ్రని అలంకార భాగం[a], దాని నుండి వచ్చిన రెండు కొమ్మల కింద ఒక గుండ్రని అలంకార భాగం, దాని నుండి వచ్చిన రెండు కొమ్మల కింద ఒక గుండ్రని అలంకార భాగం—దాని నుండి బయలుదేరిన ఆరు కొమ్మల కొరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బుడిపె.’ హీబ్రూ పదం దీపస్తంభంపై ఉన్న గుండ్రని అలంకార భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: గుండ్రని అలంకారం
  rationale: దీపస్తంభంపై ఉన్న గుండ్రని అలంకార భాగాన్ని సూచించే పదం. ఆధునిక తెలుగు పాఠకులకు రూపమూ ఉపయోగమూ స్పష్టంగా ఉండేందుకు ‘గుండ్రని అలంకారం’ అని అనువదించాం; సంప్రదాయ ప్రత్యామ్నాయం ‘బుడిపె’ను పాదసూచికలో ఇచ్చాం.
- source_word: תַּחַת
  choice: కింద
  rationale: జత కొమ్మలకు దిగువన ఉన్న స్థానాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: שְׁנֵי הַקָּנִים
  choice: రెండు కొమ్మలు
  rationale: ఇక్కడ קנה నిజమైన రెల్లును కాక దీపస్తంభం నుండి విస్తరించే పక్క భాగాలను సూచిస్తుంది. దీపస్తంభంలోని మొక్కలాంటి రూపకల్పనను ‘కొమ్మలు’ నిలుపుతుంది.
- source_word: מִמֶּנָּה
  choice: దాని నుండి
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం సందర్భంలోని దీపస్తంభాన్ని సూచిస్తుంది; మూలంలోని సర్వనామ సూచనను అధికంగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ఆరు కొమ్మలకూ
  rationale: మూడు జతల కింద ఉన్న మూడు అలంకారాల అమరిక మొత్తం ఆరు పక్క కొమ్మలకు సంబంధించినదని తెలిపే సంక్షిప్త సమాపన భావాన్ని అందిస్తుంది.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: దాని నుండి బయలుదేరిన
  rationale: కొమ్మలు మధ్య కాండం నుండి వెలుపలికి విస్తరించడాన్ని సూచించే హీబ్రూ కృదంత భావాన్ని నిలుపుతుంది.
