translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూలోని మూడుసార్ల పునరుక్తిని నిలుపుతూ, జతల క్రమం స్పష్టమయ్యేలా ‘మరో’, ‘మిగిలిన’ అనే సహజ తెలుగు పదాలను వాడాం. సందర్భం కోరే నిర్మాణ క్రియను తెలుగులో పూర్తి వాక్యంగా ‘ఉండేలా చేశాడు’ అని వ్యక్తపరిచాం.
