  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: te
  text: అతడు దాని నాలుగు పాదాల[a]పై నాలుగు బంగారు ఉంగరాలను పోతపోశాడు—ఒక వైపున రెండు ఉంగరాలు, మరో వైపున రెండు ఉంగరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని నాలుగు మూలలపై’ లేదా ‘దాని నాలుగు ఆధార భాగాలపై’; హీబ్రూ పదం పాదాలను, దిగువ భాగాలను లేదా ఆధార స్థానాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: పోతపోసి
  rationale: లోహపు పనికి సంబంధించిన సందర్భంలో יצק కరిగిన లోహాన్ని అచ్చులో పోసి తయారుచేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పోతపోయడం’ సూటిగా, సహజంగా ఉంటుంది.
- source_word: לוֹ
  choice: దానికి
  rationale: సందర్భంలోని మందసాన్ని సూచించే పుంలింగ ఏకవచన సర్వనామాన్ని తెలుగులో జడవస్తువుకు సహజంగా ‘దానికి’ అని అనువదించాం.
- source_word: טַבְּעֹת זָהָב
  choice: బంగారు ఉంగరాలు
  rationale: బంగారంతో చేసిన వలయాలను తెలుగులో సహజంగా ‘బంగారు ఉంగరాలు’ అంటారు.
- source_word: פַּעֲמֹתָיו
  choice: దాని నాలుగు పాదాలు
  rationale: పదం పాదాలు, దిగువ అంచులు లేదా ఆధార బిందువులను సూచించగలదు. సామగ్రి నిర్మాణ సందర్భంలో ‘పాదాలు’ అత్యంత సూటి ఎంపిక; అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- source_word: צַלְעוֹ
  choice: వైపు
  rationale: వస్తువు యొక్క పక్కను సూచించే צלעకు సాధారణ ఆధునిక తెలుగు సమానార్థకం ‘వైపు’.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ఒక వైపున ... మరో వైపున
  rationale: అక్షరార్థంగా ‘ఒకటి ... రెండవది’; తెలుగులో అర్థాన్ని మార్చకుండా సహజంగా ‘ఒక వైపున ... మరో వైపున’ అని చెప్పవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ప్రక్రియను స్పష్టంగా తెలిపే గౌరవప్రదమైన సాధారణ శైలి. హీబ్రూ వాక్యంలోని రెండు వైపుల సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
