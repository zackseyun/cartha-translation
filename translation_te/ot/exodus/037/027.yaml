  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: te
  text: అతడు దాని అంచు[a] కింద, దాని రెండు పక్క పలకల మీద, దాని రెండు వైపులా[b], దాన్ని మోయడానికి ఉపయోగించే మోతకర్రలను ఉంచే తొడుగులుగా రెండు బంగారు ఉంగరాలు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని అలంకారపు పట్టీ కింద.” హీబ్రూ זֵר అనే పదం పైభాగం చుట్టూ ఉన్న అలంకారపు అంచు లేదా పట్టీని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో పరస్పర సంబంధమున్న రెండు పదబంధాలు ఉన్నాయి: “దాని రెండు పక్క పలకల మీద, దాని రెండు వైపులా.” వాటిని ఒకే పదబంధంగా మార్చకుండా ఇక్కడ రెండింటినీ నిలిపాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: రెండు బంగారు ఉంగరాలు
  rationale: కథన క్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో కొనసాగిస్తూ, లోహంతో చేసిన వలయాకార అమరికలను స్పష్టంగా సూచిస్తుంది.
- source_word: עָשָׂה ל/וֹ
  choice: దానికి ... చేశాడు
  rationale: సర్వనామ ప్రత్యయం సందర్భంలోని ధూపవేదికను సూచిస్తుంది; వ్యక్తిని కాదు.
- source_word: מִ/תַּחַת לְ/זֵר/וֹ
  choice: దాని అంచు కింద
  rationale: זֵר ఇక్కడ పైభాగం చుట్టూ ఉన్న అలంకారపు అంచును సూచిస్తుంది; 'కిరీటం' అనే పదం తప్పుదారి పట్టించవచ్చు.
- source_word: עַל שְׁתֵּי צַלְעֹתָי/ו
  choice: దాని రెండు పక్క పలకల మీద
  rationale: צלע యొక్క 'పక్క భాగం/నిర్మాణ పలక' భావాన్ని తెలియజేస్తూ, తరువాతి సాధారణ 'వైపులు' అనే పదబంధం నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: עַל שְׁנֵי צִדָּי/ו
  choice: దాని రెండు వైపులా
  rationale: మూలంలోని సంబంధిత రెండు పక్క-సూచక పదబంధాల పునరుక్తిని తొలగించకుండా నిలుపుతుంది.
- source_word: לְ/בָתִּים לְ/בַדִּים
  choice: మోతకర్రలను ఉంచే తొడుగులుగా
  rationale: బైబిలు సామగ్రి సందర్భంలో בָּתִּים అనేది కర్రలు దూరే గూళ్లు లేదా తొడుగులను సూచిస్తుంది; 'తొడుగులు' వాటి నిర్మాణాత్మక పనిని సహజంగా తెలియజేస్తుంది.
- source_word: לָ/שֵׂאת אֹת/וֹ בָּ/הֶם
  choice: దాన్ని మోయడానికి ఉపయోగించే
  rationale: అనంత క్రియ యొక్క ప్రయోజన భావాన్నీ, కర్రల సాధనార్థక పాత్రనూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
