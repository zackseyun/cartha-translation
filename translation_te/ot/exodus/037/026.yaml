translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సామగ్రి-నిర్మాణ పదజాలాన్ని వీలైనంత స్పష్టంగా నిలిపాం; పాదసూచిక గుర్తును అది వివరిస్తున్న ‘అంచు’ పదం వెంట ఉంచాం.
