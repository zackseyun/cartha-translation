  text: וַ/יְצַ֨ף אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: te
  text: దాని పైభాగానికి, చుట్టూ ఉన్న దాని ప్రక్కలకు, దాని కొమ్ములకు స్వచ్ఛమైన బంగారంతో తాపడం చేశాడు. దాని చుట్టూ బంగారు అంచు[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చుట్టూ బంగారు కిరీటం.” ఇక్కడి హీబ్రూ పదం వస్తువు చుట్టూ ఉండే అలంకారపు పట్టీని లేదా అంచును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: పొదిగించాడు
  rationale: చెక్కతో చేసిన వస్తువుపై లోహపు పూతను అమర్చడాన్ని సూచించే צפה క్రియకు, పరిశుద్ధ గుడారపు సామగ్రి తయారీ సందర్భంలో ‘పొదిగించాడు’ సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: బంగారం యొక్క నిర్మలతను, నాణ్యతను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: גַּגּוֹ
  choice: దాని పైభాగం
  rationale: גג సాధారణంగా ‘పైకప్పు’ అని అర్థమైనా, ఈ చిన్న బలిపీఠం విషయంలో దాని పై ఉపరితలాన్ని సూచిస్తుంది; అందువల్ల ‘పైభాగం’ సందర్భోచితం.
- source_word: קִירֹתָיו
  choice: దాని పక్కలు
  rationale: పదశః ‘గోడలు’ అని అనువదించవచ్చు; అయితే మోసుకెళ్లగల ఈ సామగ్రి నిలువు ఉపరితలాలకు ‘పక్కలు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: వస్తువును అన్ని వైపులా ఆవరించిన విస్తృతిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קַרְנֹתָיו
  choice: దాని కొమ్ములు
  rationale: బలిపీఠపు మూలల్లో పైకి పొడుచుకొచ్చిన భాగాలకు వాడే ఆరాధనా సామగ్రి పదాన్ని రూపకాలంకారం చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: זֵר
  choice: అంచు
  rationale: వస్తువు చుట్టూ చేసిన అలంకారపు పట్టీ లేదా అంచును సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘కిరీటం’ అనే సాంప్రదాయ ప్రత్యామ్నాయం అపార్థానికి దారితీయవచ్చు కాబట్టి పాదసూచికలో ఉంచబడింది.
