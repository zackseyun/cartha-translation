translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిర్మాణం వాడబడింది. ‘పోతపోసి’ లోహాన్ని అచ్చులో పోసి తయారుచేసే భావాన్ని ఇస్తుంది; ‘అమర్చాడు’ వస్తువును నిర్దిష్ట స్థానంలో బిగించి ఉంచడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
