  yaml_path: translation/ot/exodus/037/013.yaml
  text: He cast four gold rings for it and put the rings on the four corners at its four feet[a].
translation:
  language: te
  text: అతడు దానికోసం నాలుగు బంగారు ఉంగరాలను పోతపోసి, ఆ ఉంగరాలను దాని నాలుగు కాళ్ల వద్దనున్న నాలుగు మూలలపై అమర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని నాలుగు కాళ్లకు చెందిన నాలుగు మూలలపై.”
    reason: అసలు భాషలోని לְ పదబంధం స్థానం (‘కాళ్ల వద్ద’) లేదా సంబంధం (‘కాళ్లకు చెందిన’) అనే రెండు విధాలుగా అర్థం కావచ్చు.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: పోతపోసి
  rationale: లోహపు పనికి సంబంధించిన ఈ సందర్భంలో, కరిగిన బంగారాన్ని అచ్చులో పోసి ఉంగరాలను తయారుచేయడాన్ని ఈ పదం సూచిస్తుంది.
- source_word: לוֹ
  choice: దాని కోసం
  rationale: ఈ ఏకవచన సర్వనామం ముందున్న బల్లను సూచిస్తుంది; తెలుగులో నిర్జీవ వస్తువుకు ‘దాని’ సహజమైన రూపం.
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: మోసే కర్రలను దూర్చేందుకు ఉపయోగించే వలయాకార లోహపు బిగింపులకు సాధారణంగా అర్థమయ్యే పదం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పదార్థాన్ని నేరుగా, సహజమైన విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: וַיִּתֵּן
  choice: అమర్చాడు
  rationale: ఉంగరాలను బల్లకు నిర్దిష్ట స్థానాల్లో బిగించి ఉంచడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: నాలుగు మూలల్లో
  rationale: עַל ఇక్కడ స్థాన సంబంధాన్ని సూచిస్తుంది; פֵּאֹת బల్ల యొక్క నాలుగు అంచు స్థానాలను, అంటే మూలలను సూచిస్తుంది.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: దాని నాలుగు కాళ్ల దగ్గర ఉన్న
  rationale: ఈ సంబంధ వాక్యం మూలలను బల్ల నాలుగు కాళ్లకు సంబంధించిన స్థానంలో ఉంచుతుంది; హెబ్రీయులోని సంబంధంలో కొంత అస్పష్టత ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
