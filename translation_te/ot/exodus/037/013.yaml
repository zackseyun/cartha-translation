  text: וַ/יִּצֹ֣ק ל֔/וֹ אַרְבַּ֖ע טַבְּעֹ֣ת זָהָ֑ב וַ/יִּתֵּן֙ אֶת הַ/טַּבָּעֹ֔ת עַ֚ל אַרְבַּ֣ע הַ/פֵּאֹ֔ת אֲשֶׁ֖ר לְ/אַרְבַּ֥ע רַגְלָֽי/ו־׃
