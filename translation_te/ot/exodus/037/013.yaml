- from: అతడు దాని కోసం నాలుగు బంగారు ఉంగరాలను పోతపోసి, ఆ ఉంగరాలను దాని నాలుగు కాళ్ల దగ్గర ఉన్న నాలుగు మూలల్లో అమర్చాడు.[a]
  to: అతడు దానికోసం నాలుగు బంగారు ఉంగరాలను పోతపోసి, ఆ ఉంగరాలను దాని నాలుగు కాళ్ల వద్దనున్న నాలుగు మూలలపై అమర్చాడు.[a]
