source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶת שֶׁ֤מֶן הַ/מִּשְׁחָה֙ קֹ֔דֶשׁ וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: te
  text: అతడు పవిత్ర అభిషేక తైలాన్నీ, స్వచ్ఛమైన సుగంధ ధూపాన్నీ[a], సుగంధ ద్రవ్యాలు మేళవించే నిపుణుని పనివిధానంలో[b] తయారుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సుగంధ ద్రవ్యాల ధూపం’ లేదా ‘సుగంధ ద్రవ్యాలు కలిపిన ధూపం.’ హీబ్రూ పదబంధం అక్షరార్థంగా సుగంధ పదార్థాలతో చేసిన ధూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సుగంధ ద్రవ్యాలు మేళవించే నిపుణుని పని’ లేదా ‘సుగంధ ద్రవ్యాలు మేళవించే నిపుణుడు తయారుచేసినది.’ హీబ్రూ పదబంధం ఒక ప్రత్యేక నిపుణుని నైపుణ్యపూర్వక తయారీని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... తయారుచేశాడు
  rationale: עשה అనే క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలో పూర్తయిన గత కార్యాన్ని సూచిస్తుంది. సందర్భంలోని తయారీ పనికి ‘తయారుచేశాడు’ సహజంగా సరిపోతుంది.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: పవిత్ర అభిషేక తైలం
  rationale: ఈ పదబంధం అభిషేకానికి ఉపయోగించేందుకు పవిత్రంగా ప్రత్యేకించిన తైలాన్ని సూచిస్తుంది; ఈ అనువాదం ఆరాధనా సందర్భాన్నీ పదబంధ నిర్మాణాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపం
  rationale: అక్షరార్థంగా ఇది సుగంధ పదార్థాలతో చేసిన ధూపాన్ని సూచిస్తుంది. ‘సుగంధ ధూపం’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని పరిమళ స్వభావాన్ని నిలుపుతుంది.
- source_word: טָהוֹר
  choice: స్వచ్ఛమైన
  rationale: ఆరాధనా మరియు పదార్థ సంబంధ సందర్భంలో ఈ పదం కల్తీ లేదా అపవిత్రత లేని స్వభావాన్ని సూచిస్తుంది; ‘స్వచ్ఛమైన’ తెలుగు వాక్యంలో సహజంగా సరిపోతుంది.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: సుగంధ ద్రవ్యాలు కలిపే నిపుణుని పనిగా
  rationale: ఈ నామవాచక పదబంధం సుగంధ పదార్థాలను నైపుణ్యంగా మిశ్రమం చేసే ప్రత్యేక పనివాని తయారీని తెలియజేస్తుంది. ఈ రూపం నైపుణ్యాన్నీ ‘పని’ అనే మూల నిర్మాణాన్నీ నిలుపుతుంది.
