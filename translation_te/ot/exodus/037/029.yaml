- from: అతడు పవిత్ర అభిషేక తైలాన్ని, స్వచ్ఛమైన సుగంధ ధూపాన్ని[a] సుగంధ ద్రవ్యాలు కలిపే నిపుణుని పనిగా[b] తయారుచేశాడు.
  to: అతడు పవిత్ర అభిషేక తైలాన్నీ, స్వచ్ఛమైన సుగంధ ధూపాన్నీ[a], సుగంధ ద్రవ్యాలు మేళవించే నిపుణుని పనివిధానంలో[b] తయారుచేశాడు.
