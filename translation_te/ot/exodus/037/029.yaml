translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ఆరాధనా సందర్భానికి ‘పవిత్ర,’ ‘అభిషేక తైలం,’ ‘ధూపం’ వంటి సుపరిచిత పదాలు ఉంచబడ్డాయి; అరుదైన వృత్తిపేరుకు బదులుగా అర్థవంతమైన వివరణాత్మక పదబంధం వాడబడింది.
