  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: te
  text: దాని మొగ్గలూ దాని కొమ్మలూ దానినుండే ఒకే ముక్కగా మలచబడ్డాయి[a]; అదంతా స్వచ్ఛమైన బంగారంతో ఒకే ముక్కగా సుత్తితో మలచబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దానినుండి’; మొగ్గలూ కొమ్మలూ దీపస్తంభానికి విడిగా జతచేయబడకుండా, దానితోనే ఏకంగా మలచబడ్డాయని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘స్వచ్ఛమైన బంగారంతో సుత్తితో మలిచిన ఒకే పని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: వాటి మొగ్గలు
  rationale: దీపస్తంభపు పుష్పాలంకరణ సందర్భంలో ఈ పదం గుండ్రని అలంకార భాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మొగ్గలు’ సహజంగా ఉండి పుష్ప రూపకల్పనను నిలుపుతుంది.
- source_word: וּקְנֹתָם
  choice: వాటి కొమ్మలు
  rationale: קָנֶה మూలార్థం రెల్లు లేదా కాండం; దీపస్తంభ సందర్భంలో బయటకు విస్తరించే భుజాలను సూచిస్తున్నందున ‘కొమ్మలు’ సహజమైన అనువాదం.
- source_word: מִמֶּנָּה הָיוּ
  choice: దానితోనే ఒకే ముక్కగా చేయబడ్డాయి
  rationale: అక్షరార్థంగా ‘దానినుండి ఉండేవి’; ఇక్కడ మొగ్గలు, కొమ్మలు దీపస్తంభం నుంచే విడివిడిగా జతచేయకుండా సమగ్రంగా రూపొందించబడ్డాయని భావం.
- source_word: כֻּלָּהּ
  choice: అది మొత్తమంతా
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం దీపస్తంభం మొత్తాన్ని సూచిస్తూ సమగ్రతను నొక్కి చెబుతుంది.
- source_word: מִקְשָׁה אַחַת
  choice: సుత్తితో మలిచిన ఏకరూపమైన పని
  rationale: מִקְשָׁה లోహాన్ని కొట్టి మలిచిన పనిని, אַחַת దాని ఏకత్వాన్ని సూచిస్తాయి; ఈ తెలుగు పదబంధం రెండు భావాలనూ నిలుపుతుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: గుడార నిర్మాణ వర్ణనల్లో శుద్ధమైన పదార్థాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
