  terminology: ‘మొగ్గలు,’ ‘కొమ్మలు,’ and ‘స్వచ్ఛమైన బంగారం’ are suitable modern-standard Telugu choices. ‘సుత్తితో మలచబడింది’ adequately conveys the hammered-work sense without importing interpretive detail.
  issues:
