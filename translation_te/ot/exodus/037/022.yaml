  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. లోహకళకు సంబంధించిన ‘సుత్తితో మలిచిన’ అనే స్పష్టమైన ప్రయోగంతో పాటు మూలంలోని ఏకత్వ భావాన్ని నిలిపాం.
