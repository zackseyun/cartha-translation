  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: te
  text: దీపస్తంభంపై బాదంపువ్వుల ఆకారంలో చేసిన నాలుగు కప్పులు[a], దాని మొగ్గలు, దాని పువ్వులు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాదంపువ్వుల ఆకారంలోని నాలుగు కప్పులు, దాని బొడిపెలు, దాని పువ్వులు.”
    reason: מְשֻׁקָּדִים మరియు כַּפְתֹּרֶיהָ పదాల అలంకార ఆకృతి సంబంధమైన ప్రత్యామ్నాయ అనువాదాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: దీపస్తంభంపై ... ఉన్నాయి
  rationale: בְּ ఇక్కడ దీపస్తంభానికి అమర్చిన అలంకార భాగాల స్థానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పై’ సహజంగా ఉంటుంది.
- source_word: אַרְבָּעָה
  choice: నాలుగు
  rationale: గְבִעִים అనే బహువచన నామవాచకాన్ని విశేషించే సాధారణ సంఖ్య.
- source_word: גְבִעִים
  choice: కప్పులు
  rationale: ఇది కప్పు వంటి ఆకారం గల అలంకార భాగాలను సూచిస్తుంది; ‘కప్పులు’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: מְשֻׁקָּדִים
  choice: బాదంపువ్వుల ఆకారంలో చేసిన
  rationale: ఈ రూపం బాదంపువ్వు నమూనాలో రూపొందించబడిన కప్పులను సూచిస్తుంది; అలంకార ఆకృతిని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כַּפְתֹּרֶיהָ
  choice: దాని మొగ్గలు
  rationale: దీపస్తంభంలోని గుండ్రని ఉబ్బెత్తు అలంకార భాగాలను సూచించే పదం; పుష్పరూపక సందర్భంలో ‘మొగ్గలు’ అనుకూలం, అయితే ‘బొడిపెలు’ అనే ఆకారాధారిత అర్థమూ సాధ్యం.
- source_word: וּפְרָחֶיהָ
  choice: దాని పువ్వులు
  rationale: పుష్పాలు లేదా వికసించిన పువ్వులను సూచిస్తుంది; ‘మొగ్గలు’తో సహజంగా జతకడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని అనుబంధ జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో వాక్యం పూర్తి కావడానికి చివర ‘ఉన్నాయి’ చేర్చబడింది.
