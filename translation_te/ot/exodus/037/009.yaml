  text: וַ/יִּהְי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹֽכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת הָי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: te
  text: కెరూబులు తమ రెక్కలను పైకి చాపి, వాటితో ప్రాయశ్చిత్తపు మూతను[a] కప్పుతూ ఉన్నాయి. వాటి ముఖాలు ఒకదానికొకటి ఎదురుగా ఉన్నాయి; కెరూబుల ముఖాలు ప్రాయశ్చిత్తపు మూతవైపు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూత”; సంప్రదాయంగా “కరుణాపీఠం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: కెరూబులు
  rationale: పరలోక సంబంధమైన ఈ ఆకృతులకు వాడే స్థిరమైన లిప్యంతరీకృత పదాన్ని నిలుపుతూ, హెబ్రీ బహువచన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: తమ రెక్కలను పైకి చాపి
  rationale: రెక్కలు పై దిశగా విస్తరించి ఉన్న భంగిమను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: סֹכְכִים
  choice: కప్పుతూ ఉన్నాయి
  rationale: పైనుండి ఆవరించడం అనే క్రియాభావాన్ని తెలియజేస్తుంది; పూర్తిగా కనబడకుండా మూసివేశాయని అనవసరంగా సూచించదు.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసపు మూత అనే భౌతిక అర్థాన్నీ, ఆరాధనా సందర్భంలోని ప్రాయశ్చిత్త సంబంధమైన పాత్రనూ ఒకేసారి స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּכַנְפֵיהֶם
  choice: వాటితో
  rationale: రెక్కల ద్వారా కప్పుతున్నారనే సాధనార్థక בְ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ముందున్న ‘రెక్కలను’ అనే పదానికి స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: వాటి ముఖాలు ఒకదానికొకటి ఎదురుగా ఉన్నాయి
  rationale: ‘ఒక్కొక్కటి తన సహోదరునివైపు’ అనే హెబ్రీ పరస్పరార్థక నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: కెరూబుల ముఖాలు ప్రాయశ్చిత్త మూతవైపు ఉన్నాయి
  rationale: ముఖాలపై ఉన్న హెబ్రీ వాక్య ప్రాధాన్యాన్ని, అలాగే ప్రాయశ్చిత్త మూత ప్రస్తావన పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: గుడార ఆరాధనా సందర్భంలో הַכַּפֹּרֶת అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: మూత; కరుణాపీఠం
  rationale: హెబ్రీ పదం మందసపు మూతను సూచించినా, దాని ఆరాధనా విధిలోని ప్రాయశ్చిత్త సంబంధాన్ని ‘ప్రాయశ్చిత్త మూత’ పారదర్శకంగా నిలుపుతుంది. సంప్రదాయ ‘కరుణాపీఠం’ రూపకార్థాన్ని ముందుకు తెస్తుంది; ‘మూత’ మాత్రమే అయితే ఆరాధనా ప్రత్యేకత తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా పదజాలం వాడబడింది. హెబ్రీ వాక్యంలోని ముఖాల పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
