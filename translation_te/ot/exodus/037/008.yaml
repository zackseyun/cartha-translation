revisions:
- from: ఒక కెరూబును ఈ వైపు ఒక చివర నుండి, మరో కెరూబును ఆ వైపు ఒక చివర నుండి చేశాడు; కరుణాపీఠం[a] నుండే ఆ కెరూబులను దాని రెండు చివరలలో చేశాడు.
  to: ఈ వైపు ఒక చివర నుండి ఒక కెరూబును, ఆ వైపు ఒక చివర నుండి ఒక కెరూబును చేశాడు; కరుణాపీఠం[a] నుండే, దాని రెండు చివరల నుండి కెరూబులను చేశాడు.
  rationale: ‘దాని రెండు చివరలలో’ స్థానంలో ‘దాని రెండు చివరల నుండి’ ఉంచి, కెరూబులు కరుణాపీఠంలో భాగంగా, దాని చివరల నుండే రూపొందించబడ్డాయనే హీబ్రూ భావాన్ని కాపాడాం. మొదటి రెండు భాగాల్లో పదక్రమాన్ని సవరించి జత నిర్మాణాన్ని సహజ తెలుగులో స్పష్టపరిచాం. పాదసూచికలో అర్థం మార్చకుండా భాషను మెరుగుపరిచాం.
