  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: te
  text: ఈ వైపు ఒక చివర నుండి ఒక కెరూబును, ఆ వైపు ఒక చివర నుండి ఒక కెరూబును చేశాడు; కరుణాపీఠం[a] నుండే, దాని రెండు చివరల నుండి కెరూబులను చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మూత’ లేదా ‘ప్రాయశ్చిత్తపు మూత’; హీబ్రూ కప్పోరెత్ అనే పదం మందసపు బంగారు మూతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: కెరూబు
  rationale: మందసం దగ్గరనున్న ప్రత్యేక సింహాసన-కాపలా జీవిని సూచించే హీబ్రూ సాంకేతిక పదాన్ని ఊహాత్మకంగా వివరించకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో ఉంచింది.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ఈ వైపు ఒక చివర నుండి ... ఆ వైపు ఒక చివర నుండి
  rationale: కָצֶה అనే పదంలోని ‘చివర’ భావాన్నీ, జతగా వచ్చిన నిర్దేశక పదాలు చూపే ఎదురెదురు వైపులనూ స్పష్టంగా నిలుపుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: కరుణాపీఠం
  rationale: మందసం బంగారు మూతకు వాడిన ఆరాధనా సాంకేతిక పదానికి తెలుగులో పరిచితమైన సంక్షిప్త రూపం; ఇది కేవలం సాధారణ మూత కాదనే ఆరాధనా ప్రాధాన్యాన్ని నిలుపుతుంది. పదార్థ సంబంధ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: సాధారణ హీబ్రూ క్రియకు సహజమైన, అలంకారరహిత తెలుగు సమానం.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: దాని రెండు చివరలలో
  rationale: కెరూబులు కరుణాపీఠానికి సంబంధించి ఉన్న స్థానాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ముందున్న ‘నుండే’ అవి దానిలో భాగంగానే రూపొందించబడ్డాయని సూచిస్తుంది.
theological_decisions:
- issue: మందసం సందర్భంలో הַכַּפֹּרֶת పదం అనువాదం
  choice: కరుణాపీఠం
  alternative: మూత; ప్రాయశ్చిత్తపు మూత
  rationale: ఈ పదం మందసం యొక్క ఆరాధనా ప్రాధాన్యమున్న బంగారు మూతను సూచిస్తుంది. ‘కరుణాపీఠం’ దాని సంప్రదాయ ధార్మిక అనుబంధాన్ని నిలుపుతుండగా, హీబ్రూ పదంలోని భౌతిక ‘మూత’ భావాన్ని పాదసూచిక పారదర్శకంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని పునరుక్త స్థల నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, ‘నుండే’ ద్వారా కెరూబులు కరుణాపీఠంతో ఏకభాగంగా చేయబడ్డ భావాన్ని వ్యక్తం చేసింది.
