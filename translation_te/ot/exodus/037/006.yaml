source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: te
  text: 'అతడు శుద్ధమైన బంగారంతో కరుణాపీఠాన్ని[a] చేశాడు. దాని పొడవు రెండున్నర మూరలు, వెడల్పు ఒకటిన్నర మూరలు.


    [a] లేదా, “ప్రాయశ్చిత్తపు మూత.” ఈ హెబ్రీ పదం మందసపు బంగారు మూతను సూచిస్తుంది; దీనికి ప్రాయశ్చిత్తంతో సంబంధం ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాయశ్చిత్తపు మూత.” ఈ హెబ్రీ పదం మందసపు బంగారు మూతను సూచిస్తుంది; దీనికి ప్రాయశ్చిత్తంతో సంబంధం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క వయిక్టోల్ రూపం గతకాల కథనంలో వరుసగా జరిగిన కార్యాన్ని తెలియజేస్తుంది. తెలుగులో సహజమైన కథనశైలికి ప్రారంభ సంధికార్థాన్ని ప్రత్యేకంగా వ్యక్తం చేయకుండా క్రియను గతకాలంలో అనువదించాం.
- source_word: כַּפֹּרֶת
  choice: కరుణాపీఠం
  rationale: ఇది మందసపు బంగారు మూతకు సంబంధించిన ఆరాధనా పదం. ‘కరుణాపీఠం’ దాని సంప్రదాయ ఆరాధనా-వేదాంత గుర్తింపును నిలుపుతుంది; వస్తురూపాన్ని మరింత స్పష్టంగా తెలిపే ‘ప్రాయశ్చిత్తపు మూత’ను పాదసూచికలో ఇచ్చాం.
- source_word: זָהָב טָהוֹר
  choice: శుద్ధమైన బంగారంతో
  rationale: వస్తువు ఏ పదార్థంతో చేయబడిందో తెలిపే హెబ్రీ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; טָהוֹר యొక్క ‘శుద్ధమైన’ భావాన్ని నిలుపుతుంది.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: రెండున్నర మూరలు
  rationale: రెండు మూరలు మరియు అర మూర అనే హెబ్రీ కొలతను సంక్షిప్తమైన, సహజమైన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
- source_word: אָרְכָּהּ
  choice: దాని పొడవు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం కరుణాపీఠాన్ని సూచిస్తుంది. హెబ్రీలోని క్రియలేని కొలత వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూరలు
  rationale: ఒక మూర మరియు అర మూర అనే కొలతను ఆధునిక తెలుగులో సహజంగా ‘ఒకటిన్నర మూరలు’ అని ఇచ్చాం.
- source_word: רָחְבָּהּ
  choice: వెడల్పు
  rationale: רֹחַב సూచించే అడ్డకొలతకు ‘వెడల్పు’ స్పష్టమైన ఆధునిక తెలుగు పదం; ప్రత్యయం అదే వస్తువును సూచిస్తుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో כַּפֹּרֶת పదం అనువాదం
  choice: కరుణాపీఠం
  alternative: ప్రాయశ్చిత్తపు మూత
  rationale: ఈ పదం మందసపు మూతను సూచించడంతో పాటు ఇశ్రాయేలు ఆరాధనలో ప్రాయశ్చిత్తంతో ప్రత్యేక సంబంధం కలిగి ఉంది. ‘కరుణాపీఠం’ ఆ ఆరాధనా-వేదాంత ప్రాముఖ్యతను నిలుపుతుంది; అయితే అది భౌతికంగా మూత అనే విషయాన్ని, ప్రాయశ్చిత్త సంబంధాన్ని స్పష్టపరిచే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని భావపరిధిని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొలతకు బైబిలు తెలుగులో పరిచితమైన ‘మూర’ను ఉంచాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘కరుణాపీఠం’ పదానికే జోడించాం.
