  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. శిల్పకళా సందర్భంలోని లోహపు పొర భావాన్ని నిలుపుకోవడానికి ‘తాపడం’ను, זֵר యొక్క కొంత విస్తృత భావపరిధిని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా ‘అంచు’ను ఎంచుకున్నాం.
