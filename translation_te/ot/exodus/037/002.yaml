  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: te
  text: అతడు దాని లోపలా వెలుపలా స్వచ్ఛమైన బంగారంతో తాపడం చేసి, దాని చుట్టూ బంగారు అంచును[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని చుట్టూ బంగారు అలంకారపు పట్టీని’ లేదా ‘దాని చుట్టూ బంగారు పట్టీని.’ హీబ్రూ זֵר అనే పదం వస్తువు చుట్టూ ఉండే అలంకారపు అంచును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: దానికి … బంగారంతో తాపడం చేసి
  rationale: పీయేల్ రూపంలోని צפה ఇక్కడ చెక్క వస్తువుపై లోహపు పొరను అమర్చడాన్ని సూచిస్తుంది. ‘తాపడం’ సాధారణంగా అర్థమయ్యే శిల్పకళా పదం; కేవలం కప్పడం లేదా రంగు పూయడం అనే భావాన్ని నివారిస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: טָהוֹר బంగారం యొక్క స్వచ్ఛతను సూచిస్తుంది; ‘స్వచ్ఛమైన బంగారం’ ఆధునిక తెలుగులో సహజమైన, స్థిరమైన ప్రయోగం.
- source_word: מִבַּיִת וּמִחוּץ
  choice: లోపలా వెలుపలా
  rationale: వస్తువు లోపలి, వెలుపలి ఉపరితలాలు రెండింటినీ స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיַּעַשׂ לוֹ
  choice: దాని … చేశాడు
  rationale: לֹו అంచు ఆ వస్తువు కోసం లేదా దానికి చేయబడిందని సూచిస్తుంది. తెలుగులో ‘దాని చుట్టూ … చేశాడు’ అని చెప్పడం ఈ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זֵר זָהָב
  choice: బంగారు అంచును
  rationale: గుడారపు సామగ్రి సందర్భంలో זֵר వస్తువు చుట్టూ ఉండే అలంకారపు అంచును సూచిస్తుంది. ‘అంచు’ సులభంగా అర్థమవుతుంది; ‘కిరీటం’ అనే మూలార్థాన్ని ఇక్కడ అనుచితంగా రుద్దదు.
- source_word: סָבִיב
  choice: దాని చుట్టూ
  rationale: అంచు వస్తువును చుట్టుముట్టి ఉందనే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
