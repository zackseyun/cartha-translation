translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ వర్ణన. ఒకే వాక్యంలోని రెండు నిర్మాణ చర్యలను స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చినా, హీబ్రూ క్రమం మరియు భావం నిలుపబడ్డాయి.
