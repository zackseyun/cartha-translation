  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: te
  text: దాని చుట్టూ ఒక అరచేతి వెడల్పున్న చట్రాన్ని[a] చేశాడు. ఆ చట్రం చుట్టూ బంగారు అలంకారపు అంచును[b] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అంచు,’ ‘సరిహద్దు పట్టీ.’
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయికంగా ‘బంగారు కిరీటం’; ఇక్కడ చట్రం చుట్టూ ఉన్న అలంకారపు అంచు ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: చట్రం
  rationale: బల్లకు చుట్టూ అమర్చిన నిర్మాణాత్మక అంచు లేదా చట్రాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చట్రం’ స్పష్టంగా ఉండి, సందర్భానికి సరిపోతుంది.
- source_word: טֹפַח
  choice: ఒక అరచేతి వెడల్పు
  rationale: ఇది అరచేతి వెడల్పును ఆధారంగా చేసుకున్న కొలత. తెలుగులో కొలత సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ‘వెడల్పు’ అని చెప్పబడింది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అన్ని వైపులా పరివేష్టించి ఉండే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זֵר
  choice: అలంకారపు అంచు
  rationale: గుడారపు సామగ్రి సందర్భంలో ఇది చుట్టూ అమర్చిన పైకి లేచిన లేదా అలంకారాత్మక అంచును సూచిస్తుంది. అక్షరార్థమైన ‘కిరీటం’ ఆధునిక పాఠకులను తప్పుదారి పట్టించవచ్చు.
- source_word: זָהָב
  choice: బంగారు
  rationale: అంచు ఏ పదార్థంతో చేయబడిందో సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: לְמִסְגַּרְתּוֹ
  choice: ఆ చట్రం చుట్టూ
  rationale: ముందు ప్రస్తావించిన చట్రంతో అలంకారపు అంచుకు ఉన్న సంబంధాన్ని, దాని చుట్టూ అమర్చబడిన సందర్భార్థంతో సహజంగా వ్యక్తం చేస్తుంది.
