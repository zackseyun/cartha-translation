source:
  edition: WLC
  text: וַ/יָּבֵ֤א אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֖את אֶת הָ/אָרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/005.yaml
  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: te
  text: మందసాన్ని మోయడానికి, అతడు దాని పక్కలున్న ఉంగరాల్లో మోయు కర్రలను చొప్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: దూర్చాడు
  rationale: בוא అనే క్రియకు ప్రాథమికంగా ‘తెచ్చు/ప్రవేశింపజేయు’ అనే భావం ఉన్నా, కర్రలను ఉంగరాల్లో ఉంచే ఈ సందర్భంలో ‘దూర్చాడు’ భౌతిక చర్యను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోతకర్రలను
  rationale: בַּדִּים అనేది పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది. ‘మోతకర్రలు’ వాటి ప్రయోజనాన్ని స్పష్టంగా తెలియజేసే సహజమైన పదం.
- source_word: בַּטַּבָּעֹת
  choice: ఉంగరాల్లో
  rationale: ב ఉపసర్గ ఇక్కడ కర్రలను ఉంగరాల లోపలికి చొప్పించడాన్ని సూచిస్తుంది; ‘ఉంగరాల్లో’ తెలుగు వాక్యనిర్మాణంలో సహజంగా సరిపోతుంది.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: దాని పక్కలున్న
  rationale: צלעות ఇక్కడ మందసం పక్కలను లేదా పక్క పలకలను సూచించగలదు. ‘పక్కలున్న’ అనేది స్థానం స్పష్టంగా తెలియజేస్తూ, అవసరానికి మించిన నిర్మాణ వివరాన్ని చేర్చదు.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: אָרוֹן అనేది గుడారపు పవిత్ర సామగ్రిలోని ప్రత్యేక పెట్టెను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మందసం’ గౌరవప్రదమైన, సందర్భోచితమైన పదం.
- source_word: לָשֵׂאת
  choice: మోయడానికి
  rationale: 'נשא యొక్క ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది: కర్రలను అమర్చింది మందసాన్ని మోయడానికే. ‘మోయడానికి’ సహజమైన ఆధునిక తెలుగు.'
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా అనువదించబడింది. హీబ్రూ వాక్యంలోని ఉద్దేశ సంబంధాన్ని ముందుకు తెచ్చి తెలుగు వాక్యం సహజంగా నిర్మించబడింది; మూలార్థంలో కొత్త వివరణ ఏదీ చేర్చలేదు.
