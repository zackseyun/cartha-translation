id: EXO.37.25
reference: Exodus 37:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: te
  text: అతడు ధూపవేదికను తుమ్మచెక్కతో చేశాడు. దాని పొడవు ఒక మూర, వెడల్పు ఒక మూర; అది చతురస్రాకారంగా ఉంది. దాని ఎత్తు రెండు మూరలు. దాని కొమ్ములు దానితో ఏకఖండంగా ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సెక్యూటివ్ రూపం గతంలో జరిగిన వరుస కార్యాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగు కథనంలో ప్రారంభ సంధానపదం లేకుండానే క్రమం స్పష్టంగా ఉంటుంది.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదిక
  rationale: మూలంలోని నిర్మాణబంధం ‘ధూపపు బలిపీఠం’ అనే భావాన్ని ఇస్తుంది. ఆరాధనాసంబంధ సందర్భంలో ‘ధూపవేదిక’ సహజంగా, సంక్షిప్తంగా దాని ప్రత్యేక కార్యాన్ని తెలియజేస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטִּים సూచించే అకేసియా జాతి కలపకు సాధారణ తెలుగు బైబిలు వాడుకలో అర్థమయ్యే సమానార్థకం ‘తుమ్మచెక్క’.
- source_word: אַמָּה
  choice: మూర
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక కొలతగా మార్చకుండా నిలుపుతుంది; దీనివల్ల మూలంలోని కొలత స్వభావం, దాని సహజ అనిశ్చితి కాపాడబడతాయి.
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: దాని పొడవు ... వెడల్పు
  rationale: ప్రత్యయాలు వేదికను సూచిస్తున్నందున తెలుగు కొలత వాక్యనిర్మాణంలో సహజమైన స్వామ్యరూపాన్ని వాడాం.
- source_word: רָבוּעַ
  choice: అది చతురస్రాకారంగా ఉంది
  rationale: వేదిక ఆకారాన్ని తెలిపే విధేయ విశేషణాన్ని ఆధునిక తెలుగులో స్పష్టమైన వాక్యంగా వ్యక్తం చేశాం.
- source_word: וְאַמָּתַיִם קֹמָתוֹ
  choice: దాని ఎత్తు రెండు మూరలు
  rationale: మూలంలోని కొలతను కాపాడుతూ సహజ తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: దాని కొమ్ములు దానితో ఏకఖండంగా ఉన్నాయి
  rationale: కొమ్ములు విడిగా జోడించబడకుండా వేదికలోనే భాగంగా రూపొందించబడ్డాయని నిర్మాణార్థాన్ని ‘ఏకఖండంగా’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. కొలమానాన్ని ‘మూర’గా నిలిపి, సాంకేతిక నిర్మాణ భావానికి ‘ఏకఖండంగా’ అనే పదాన్ని ఉపయోగించాం. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘cubit’ తరువాత ఉన్నప్పటికీ దాని గమనిక ‘incense altar’ అనే ప్రత్యామ్నాయానికి సంబంధించినదిగా అసంగతంగా ఉంది; హెబ్రీ మూలంలో ప్రచురణకు అవసరమైన ప్రత్యేక పాఠాంతర లేదా అర్థసందిగ్ధత లేకపోవడంతో గమనిక చేర్చలేదు.
