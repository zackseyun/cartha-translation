source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָֽ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: te
  text: దాని ప్రక్కల నుండి ఆరు కొమ్మలు వెలువడుతున్నాయి:[a] దీపస్తంభపు మూడు కొమ్మలు దాని ఒక ప్రక్క నుండి, దీపస్తంభపు మూడు కొమ్మలు దాని రెండో ప్రక్క నుండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బయటికి విస్తరించాయి’; హెబ్రీ కృదంతం ఆ ఆరు కొమ్మలు దీపస్తంభం నుండి బయటికి వస్తున్నట్లు వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘దాని ఒక ప్రక్క నుండి ... దాని రెండో ప్రక్క నుండి’; తెలుగులో దీనిని ‘ఒక ప్రక్క నుండి ... మరో ప్రక్క నుండి’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: కొమ్మలు
  rationale: దీపస్తంభ నిర్మాణంలో బయటికి విస్తరించే శాఖాకార భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కొమ్మలు’ సహజంగా ఉండి మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: יֹצְאִים
  choice: వెలువడుతున్నాయి
  rationale: ఈ వర్తమాన కృదంతం కొమ్మలు దీపస్తంభం నుండి బయటికి వస్తున్నట్లుగా వర్ణిస్తుంది; కేవలం వాటి ఉనికిని చెప్పకుండా మూలంలోని చలనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: దాని ప్రక్కల నుండి / దాని ... ప్రక్క నుండి
  rationale: צד అనే పదానికి ‘ప్రక్క’ అనే ప్రత్యక్ష అర్థం సరిపోతుంది; మొదట బహువచనాన్ని, తరువాత ఒక్కో ప్రక్కను పేర్కొనే హెబ్రీ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מְנֹרָה
  choice: దీపస్తంభం
  rationale: మందిర గుడారంలోని దీపాలను మోసే నిర్మాణాన్ని స్పష్టంగా తెలిపే సహజ తెలుగు సాధారణ నామవాచకం; లిప్యంతరీకరణ అవసరం లేదు.
- source_word: הָאֶחָד
  choice: దాని ఒక ప్రక్క
  rationale: ‘ఒకటి’ అనే మూలపదాన్ని, దీపస్తంభంతో దాని సంబంధాన్ని, తరువాత వచ్చే ‘రెండో’ అనే జత నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הַשֵּׁנִי
  choice: దాని రెండో ప్రక్క
  rationale: మూలంలోని ‘రెండవది’ అనే పదబంధానికి సన్నిహితంగా ఉండి, రెండు ప్రక్కల సమతుల్య వర్ణనను కాపాడుతుంది; ‘మరో ప్రక్క’ అనేది సహజ ప్రత్యామ్నాయం.
