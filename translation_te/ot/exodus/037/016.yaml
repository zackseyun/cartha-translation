reference: Exodus 37:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶֽת הַ/כֵּלִ֣ים אֲשֶׁ֣ר עַל הַ/שֻּׁלְחָ֗ן אֶת קְעָרֹתָ֤י/ו וְ/אֶת כַּפֹּתָי/ו֙ וְ/אֵת֙ מְנַקִּיֹּתָ֔י/ו וְ/אֶת הַ/קְּשָׂוֺ֔ת אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֖ב טָהֽוֹר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: te
  text: అతడు బల్ల మీద ఉన్న ఉపకరణాలను—దాని పళ్లెములను[a], దాని గిన్నెలను, దాని పోసే పాత్రలను, పానార్పణాన్ని పోయడానికి వాడే దాని పాత్రలను—మేలిమి బంగారంతో చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని పళ్లెాలను, దాని చిన్న గిన్నెలను, దాని పోసే పాత్రలను, దాని పానార్పణ పాత్రలను.’ ఈ వచనంలోని అనేక పాత్రపదాలు అరుదైనవి లేదా ప్రత్యేక సందర్భానికి చెందినవి; కాబట్టి వాటి ఖచ్చిత రూపం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: ఉపకరణాలు
  rationale: ఇది పాత్రలు, పనిముట్లు రెండింటినీ సూచించగల విస్తృత పదం; బల్లకు సంబంధించిన వస్తువులన్నిటికీ సహజమైన సమగ్ర పదం.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: బల్ల మీద ఉన్న
  rationale: హీబ్రూ పదబంధంలోని స్థలార్థాన్ని నేరుగా నిలుపుతుంది; వాటి ఉపయోగాన్ని అనవసరంగా ఊహించదు.
- source_word: קְעָרֹתָיו
  choice: దాని పళ్లెములు
  rationale: ఈ పదం సాధారణంగా వెడల్పైన పళ్లెం లేదా పాత్రను సూచిస్తుంది; బల్ల సందర్భంలో ‘పళ్లెములు’ సహజం.
- source_word: כַּפֹּתָיו
  choice: దాని గిన్నెలు
  rationale: చేతి అర లేదా చెంచాతో సంబంధమున్న పదమైనా, ఇక్కడ చిన్న పాత్రలను సూచిస్తుంది; ‘గిన్నెలు’ ఖచ్చితత్వాన్ని అతిగా ప్రకటించకుండా అర్థవంతంగా ఉంటుంది.
- source_word: מְנַקִּיֹּתָיו
  choice: దాని పోయు పాత్రలు
  rationale: అరుదైన ఈ పాత్రపదానికి ఖచ్చిత రూపం అనిశ్చితం; ద్రవం పోయడానికి వాడే పాత్ర అనే సాధ్యమైన కార్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַקְּשָׂוֹת
  choice: దాని పాత్రలు
  rationale: ఇది పానార్పణంతో అనుసంధానమైన మరొక పాత్రపదం; ముందున్న అరుదైన పదంతో కృత్రిమంగా భేదం కల్పించకుండా సాధారణ పదాన్ని ఉపయోగించింది.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: పానార్పణం పోయడానికి ఉపయోగించే
  rationale: నָסַךְ క్రియలోని ఆచారసంబంధ ద్రవార్పణ భావాన్ని ‘పానార్పణం’ స్పష్టం చేస్తుంది; హోఫల్ రూపంలోని నిష్క్రియ భావాన్ని సహజ తెలుగులో ప్రయోజనార్థక నిర్మాణంగా అందిస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: మేలిమి బంగారంతో
  rationale: పాత్రల పదార్థాన్ని సూచించే ముగింపు పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పాత్రపదాల అరుదుదనాన్ని ప్రధాన వచనంలో అతిగా నిర్దిష్టం చేయకుండా, పాదటిప్పణిలో నిజమైన పదార్థ అనిశ్చితిని నిలిపింది.
