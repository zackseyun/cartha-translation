  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: te
  text: ఒక తలాంతు స్వచ్ఛమైన బంగారంతో దానిని, దాని ఉపకరణాలన్నిటిని చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని పాత్రలన్నిటినీ’ లేదా ‘దాని పనిముట్లన్నిటినీ.’ హీబ్రూ పదం כֵּלִים దీపస్తంభానికి సంబంధించిన వస్తువులు లేదా ఉపకరణాలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: ఒక తలాంతు
  rationale: నివాస మందిర నిర్మాణ సందర్భంలో ఇది బరువు కొలమానమైన ‘తలాంతు’ను సూచిస్తుంది; మూలంలోని కొలమానాన్ని యథాతథంగా ఉంచాం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: పదార్థపు శుద్ధతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: సాధారణ ‘చేయు/తయారుచేయు’ భావాన్ని నేరుగా అందిస్తుంది; బంగారం అనే పదార్థంతో చేసినట్లు వాక్య నిర్మాణం తెలియజేస్తుంది.
- source_word: אֹתָהּ
  choice: దానిని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న దీపస్తంభాన్ని సూచిస్తుంది; సందర్భంలో పూర్వపదం స్పష్టంగా ఉన్నందున సహజమైన సర్వనామాన్ని వాడాం.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: దాని ఉపకరణాలన్నిటిని
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, అనుబంధ వస్తువులు అనే విస్తృతార్థ పదం; దీపస్తంభానికి సంబంధించిన వస్తువులన్నిటిని సూచించేందుకు ‘ఉపకరణాలు’ సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడాం. హీబ్రూ కొలమానం ‘తలాంతు’ను నిలిపి ఉంచాం; విస్తృతార్థమున్న כֵּלִים కోసం ప్రధాన పాఠ్యంలో ‘ఉపకరణాలు’ను ఎంచుకుని ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
