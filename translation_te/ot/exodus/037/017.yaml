  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/מְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת הַ/מְּנֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: te
  text: అతడు స్వచ్ఛమైన బంగారంతో దీపస్తంభాన్ని చేశాడు. సుత్తితో కొట్టి మలిచి ఆ దీపస్తంభాన్ని చేశాడు[a]. దాని పీఠం, దాని కాండం, దాని కప్పులు, దాని మొగ్గలు[b], దాని పువ్వులు—ఇవన్నీ దానితో ఒకే ముక్కగా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుత్తితో కొట్టి చేసినది.’ హీబ్రూ పదం లోహాన్ని సుత్తితో కొట్టి మలచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని గుబ్బలు.’ హీబ్రూ పదం ఉబ్బెత్తైన అలంకార భాగాలను సూచిస్తుంది; దీపస్తంభపు వృక్షాకార రూపకల్పన కారణంగా ప్రధాన పాఠంలో ‘మొగ్గలు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: దీపస్తంభం
  rationale: ఇది ఒకే దీపాన్ని కాక, పరిశుద్ధ స్థలంలోని శాఖలుగల దీపాధారాన్ని సూచిస్తుంది; ‘దీపస్తంభం’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: వస్తు వివరణలో טָהוֹר బంగారం మలినరహితంగా, శుద్ధి చేయబడినదని సూచిస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో మలిచిన ఏకఖండం
  rationale: ఈ పదం లోహాన్ని సుత్తితో కొట్టి ఒకే ముక్కగా మలిచే పనిని సూచిస్తుంది; తయారీ విధానాన్నీ సమగ్ర నిర్మాణాన్నీ ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: יְרֵכָהּ
  choice: దాని పీఠం
  rationale: అక్షరార్థంగా ‘తొడ/పక్క’ అనే భావం ఉన్నా, ఇక్కడ దీపస్తంభాన్ని నిలబెట్టే దిగువ భాగాన్ని సూచిస్తుంది.
- source_word: קָנָהּ
  choice: దాని కాండం
  rationale: ఏకవచన రూపం దీపస్తంభపు మధ్య ప్రధాన భాగాన్ని సూచిస్తుంది; మొక్కను పోలిన రూపకల్పనతో ‘కాండం’ సహజంగా సరిపోతుంది.
- source_word: גְּבִיעֶיהָ
  choice: దాని పాత్రలు
  rationale: ఇవి గిన్నె లేదా కప్పు ఆకారంలో ఉన్న అలంకార భాగాలు; ఆధునిక తెలుగులో ‘పాత్రలు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: כַּפְתֹּרֶיהָ
  choice: దాని మొగ్గలు
  rationale: ఈ పదం ఉబ్బెత్తైన అలంకార భాగాలను సూచిస్తుంది; దీపస్తంభపు వృక్షాకార రూపకల్పనలో ‘మొగ్గలు’ సందర్భోచితం, అయితే ‘గుబ్బలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: פְרָחֶיהָ
  choice: దాని పువ్వులు
  rationale: పుష్పాకార అలంకారాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; ‘మొగ్గలు’తో భావసామ్యం నిలుస్తుంది.
- source_word: מִמֶּנָּה הָיוּ
  choice: దానితోనే ఏకఖండంగా ఉన్నాయి
  rationale: ఈ భాగాలు విడిగా జోడించినవి కాక దీపస్తంభంతో ఒకే ముక్కగా రూపొందించబడ్డాయని స్పష్టం చేస్తుంది.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: చేశాడు ... చేశాడు
  rationale: హీబ్రూ మూలంలోని עשה క్రియ పునరుక్తిని సరళంగా నిలుపుతుంది.
