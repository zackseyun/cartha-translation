  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని తయారీ విధానం, భాగాల వరుస, క్రియా పునరుక్తి నిలుపబడ్డాయి. ‘ఏకఖండం’ అనే పదం విడిగా అమర్చని సమగ్ర లోహ నిర్మాణాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
