  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. మూలంలోని వస్తు-పదాల అనిశ్చితిని ప్రధాన పాఠంలో అతిగా వివరించకుండా పాదసూచికల్లో సంరక్షించాం.
