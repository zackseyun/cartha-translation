  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: te
  text: అతడు దాని ఏడు దీపాలను, దాని వత్తుల పటకారులను[a], దాని నిప్పుపాత్రలను[b] స్వచ్ఛమైన బంగారంతో చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వత్తుల కత్తెరలను’; హీబ్రూ పదం దీపాల వత్తులను పట్టుకోవడానికి లేదా సవరించడానికి ఉపయోగించే పనిముట్టును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పళ్లెరాలను’; ఈ సందర్భంలో ఈ పదం దీపస్తంభానికి సంబంధించిన చిన్న పాత్రలు లేదా పళ్లెరాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క వయ్యిక్తోల్ రూపాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించాం; וַ సంధిని ప్రత్యేకంగా ‘మరియు’ అని చూపకుండా కథన ప్రవాహంలో ఇమిడ్చాం.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: దాని ఏడు దీపాలను
  rationale: נֵרוֹת అంటే దీపాలు; స్త్రీలింగ ఏకవచన ప్రత్యయం సందర్భంలోని దీపస్తంభాన్ని సూచిస్తుంది. సంఖ్యను తెలుగులో సహజంగా నామవాచకానికి ముందు ఉంచాం.
- source_word: מַלְקָחֶיהָ
  choice: దాని వత్తుల కత్తెరలను
  rationale: ఈ పదం దీపాల వత్తులను పట్టుకోవడానికి లేదా సవరించడానికి ఉపయోగించే పనిముట్టును సూచిస్తుంది. సాధారణ ‘పటకారు’ కంటే సందర్భాన్ని స్పష్టపరచే ‘వత్తుల కత్తెరలు’ను ఎంచుకున్నాం; ఖచ్చిత ఆకృతి నిర్ధారితం కానందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מַחְתֹּתֶיהָ
  choice: దాని పళ్లెరాలను
  rationale: מַחְתָּה అగ్నికణాలు, బూడిద లేదా వత్తి అవశేషాలు ఉంచే పాత్రను సూచించవచ్చు. దీపస్తంభ సందర్భంలో ‘పళ్లెరాలు’ సహజంగా ఉండి, బలిపీఠ సంబంధమైన అర్థాన్ని అనవసరంగా రుద్దదు; ‘నిప్పుపాత్రలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: వస్తువులు ఏ పదార్థంతో చేయబడ్డాయో తెలిపే పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
