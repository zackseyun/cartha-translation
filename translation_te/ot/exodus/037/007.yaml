source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: te
  text: అతడు బంగారంతో రెండు కెరూబులను చేశాడు; ప్రాయశ్చిత్త మూత[a] యొక్క రెండు చివరల నుండి వాటిని సుత్తితో కొట్టి తయారుచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణాపీఠం.” హీబ్రూ పదం మందసం యొక్క మూతను సూచిస్తుంది; అది ప్రాయశ్చిత్తంతో సంబంధం కలిగినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-కన్సిక్యూటివ్ వరుసగా జరిగిన కార్యాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ప్రతి వాక్యంలో ‘మరియు’ అని చేర్చకుండానే కథన క్రమం సహజంగా వ్యక్తమవుతుంది.
- source_word: שְׁנֵי כְרֻבִים
  choice: రెండు కెరూబులను
  rationale: כְרֻבִים అనేది కెరూబు అనే ప్రత్యేక పరలోక జీవి పేరుకు హీబ్రూ బహువచనం. తెలుగులో సంఖ్యతో కూడిన నామవాచకానికి ప్రత్యేక బహువచన రూపం అవసరం లేకపోవడంతో ‘రెండు కెరూబులను’ సహజంగా ఉంది.
- source_word: זָהָב
  choice: బంగారంతో
  rationale: ఇది కెరూబులు తయారైన పదార్థాన్ని సూచిస్తుంది; కరణార్థక ‘తో’ ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో సాగగొట్టి
  rationale: ఈ పదం లోహాన్ని కొట్టి లేదా సుత్తితో సాగగొట్టి రూపొందించిన పనిని సూచిస్తుంది. ‘ఒకే ముక్కగా’ అనేది సందర్భసిద్ధమైన భావం కావచ్చుగాని పదం యొక్క ప్రత్యక్ష అర్థం కాదు.
- source_word: עָשָׂה אֹתָם
  choice: వాటిని ... చేశాడు
  rationale: మూలంలో עשה పదం పునరుక్తమైంది. తయారీ విధానంపై ఉన్న ఉద్ఘాటనను నిలుపుతూ తెలుగులోనూ ‘చేశాడు’ అనే క్రియను మళ్లీ ఉంచాం.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: రెండు చివరల నుండి
  rationale: מִן ఉపసర్గ మూలం లేదా ఉద్భవస్థానాన్ని సూచిస్తుంది. కెరూబులు మూత చివరల నుండే రూపొందించబడ్డాయనే భావాన్ని ‘నుండి’ కాపాడుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఈ పదం నిబంధన మందసం మీదున్న బంగారు మూతను, ప్రాయశ్చిత్తంతో దాని సంబంధాన్ని సూచిస్తుంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువునూ దాని ఆరాధనా సందర్భాన్నీ పారదర్శకంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మందసం సందర్భంలో הַכַּפֹּרֶת పదం అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం; మూత
  rationale: వచనం కెరూబులు కలిగిన మందసం మూతను గురించి చెబుతుంది. ‘ప్రాయశ్చిత్త మూత’ హీబ్రూ పదానికి సంబంధించిన ప్రాయశ్చిత్త భావాన్నీ, అది నిజంగా ఒక మూత అనే విషయాన్నీ స్పష్టంగా ఉంచుతుంది. సంప్రదాయ ‘కరుణాపీఠం’ రూపాన్ని పాదసూచికలో ఇచ్చి, ఏ ప్రత్యేక సిద్ధాంతాన్నీ అనువాదం ద్వారా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ మూలంలోని ‘చేశాడు’ అనే పునరుక్తిని నిలిపి, తయారీ విధానాన్ని సహజమైన ‘సుత్తితో సాగగొట్టి’ అనే రూపంలో వ్యక్తం చేశాం. పాదసూచిక సూచిక [a] సంబంధిత పదం వెంటనే ఉంచబడింది.
