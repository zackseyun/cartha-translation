source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: te
  text: బెసలేలు తుమ్మ చెక్కతో మందసాన్ని[a] చేశాడు. దాని పొడవు రెండున్నర మూరలు, వెడల్పు ఒకటిన్నర మూరలు, ఎత్తు ఒకటిన్నర మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పెట్టెను.’ హీబ్రూ పదం సాధారణంగా పెట్టెను లేదా మందసాన్ని సూచించవచ్చు; సన్నిధి గుడారపు ఈ సందర్భంలో ‘మందసం’ అనేది మరింత నిర్దిష్టమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను అదనపు శిల్పనైపుణ్య భావం చేర్చకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּצַלְאֵל
  choice: బెసలేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: הָאָרֹן
  choice: మందసాన్ని
  rationale: אָרוֹן సాధారణంగా పెట్టె లేదా మందసం అని అర్థమవుతుంది; ఇక్కడ ప్రత్యక్ష గుడారపు పవిత్ర వస్తువును సూచిస్తున్నందున ‘మందసం’ సందర్భోచితమైన, గౌరవప్రదమైన పదం.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: హీబ్రూ నిర్మాణం ‘షిట్టీము చెక్క’ను సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘తుమ్మచెక్క’ను పదార్థాన్ని సహజంగా తెలిపేలా వాడాం.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: రెండున్నర మూరలు
  rationale: ప్రాచీన కొలమానమైన אַמָּהను ఆధునిక ప్రమాణంలోకి మార్చకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’తో అనువదించాం.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: సర్వనామ ప్రత్యయంతో ఉన్న కొలతను స్పష్టమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూరలు
  rationale: ‘ఒక మూరన్నర’ అనే అర్థాన్ని ఆధునిక తెలుగులో సులభంగా చదివే సంఖ్యారూపంలో తెలిపింది.
- source_word: רָחְבּוֹ
  choice: వెడల్పు
  rationale: వస్తువు అడ్డ కొలతకు సహజమైన ఆధునిక తెలుగు పదం.
- source_word: קֹמָתוֹ
  choice: ఎత్తు
  rationale: వస్తువు నిలువు కొలతను సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
