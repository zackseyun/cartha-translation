  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: te
  text: బల్లను మోయడానికి తుమ్మచెక్కతో మోతకర్రలను చేసి, వాటికి బంగారు పూత పూశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేసి
  rationale: వావ్-వరుస కథనంలోని తదుపరి చర్యను సూచిస్తుంది. తెలుగులో తరువాతి సమాపక క్రియతో కలిపిన అసమాపక రూపం సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: הַבַּדִּים
  choice: మోతకర్రలను
  rationale: ఇవి పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ వాటి ఆకారంతోపాటు ఉపయోగాన్ని కూడా ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఈ నిర్మాణ పదబంధం అకేసియా జాతి చెక్కను సూచిస్తుంది. బైబిలు తెలుగులో పరిచయమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: వాటికి బంగారు పూత పూశాడు
  rationale: కళాకృతి సందర్భంలో צפה లోహంతో పైపూత వేయడాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం సహజంగా, స్పష్టంగా ఉంది.
- source_word: לָשֵׂאת
  choice: మోయడానికి
  rationale: 'ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది: ఆ కర్రలు బల్లను మోయడం కోసం చేయబడ్డాయి.'
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: హీబ్రూ పాఠం సందర్భంలోని పవిత్ర గుడారపు బల్లను కేవలం ‘బల్ల’ అని పేర్కొంటుంది; అనవసర వివరణను చేర్చకుండా అదే సరళతను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణం. మూలంలోని చర్యల క్రమం, సామగ్రి, ఉద్దేశం స్పష్టంగా నిలిచాయి; పాదటిప్పణులు అవసరం లేదు.
