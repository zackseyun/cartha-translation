- from: అతడు లేచి, తన చేతికర్రను ఆధారంగా చేసుకొని[a] బయట నడవగలిగితే, అతణ్ణి కొట్టినవాడు శిక్షాబాధ్యత నుంచి విడుదలవుతాడు. అయితే గాయపడినవాడు పని చేయలేకపోయిన కాలానికి నష్టపరిహారం చెల్లించి[b], అతడు పూర్తిగా కోలుకునేలా చూడాలి[c].
  to: అతడు లేచి, తన చేతికర్రను ఆధారంగా చేసుకొని బయట నడిస్తే[a], అతణ్ణి కొట్టినవాడు శిక్ష నుండి విముక్తుడవుతాడు; అయితే, గాయపడినవాడు పని చేయలేకపోయిన కాలానికి అతడు పరిహారం చెల్లించాలి[b], గాయపడినవాడు పూర్తిగా కోలుకునేలా చూడాలి[c].
  rationale: షరతులోని వాస్తవ నడకను సామర్థ్యార్థం కాకుండా అనువదించబడింది. పరిహారం చెల్లించడం మరియు పూర్తిగా కోలుకునేలా చూడడం అనే రెండు కొనసాగుతున్న బాధ్యతల కర్త కొట్టినవాడేనని వాక్యనిర్మాణంలో స్పష్టం చేయబడింది. పాదసూచికల గుర్తులు సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
