source:
  edition: WLC
  text: אִם יָק֞וּם וְ/הִתְהַלֵּ֥ךְ בַּ/ח֛וּץ עַל מִשְׁעַנְתּ֖/וֹ וְ/נִקָּ֣ה הַ/מַּכֶּ֑ה רַ֥ק שִׁבְתּ֛/וֹ יִתֵּ֖ן וְ/רַפֹּ֥א יְרַפֵּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: te
  text: అతడు లేచి, తన చేతికర్రను ఆధారంగా చేసుకొని బయట నడిస్తే[a], అతణ్ణి కొట్టినవాడు శిక్ష నుండి విముక్తుడవుతాడు; అయితే, గాయపడినవాడు పని చేయలేకపోయిన కాలానికి అతడు పరిహారం చెల్లించాలి[b], గాయపడినవాడు పూర్తిగా కోలుకునేలా చూడాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన చేతికర్రపై వాలి.” హీబ్రూ మాట అక్షరార్థంగా “తన కర్రపై” అని ఉంది; ఆధారంతో నడవడం కొంతవరకు కోలుకున్నాడనడానికి సాక్ష్యం.
    reason: lexical_alternative
  - marker: b
    text: ఇది గాయం వల్ల సాధారణ పని చేయలేకపోయిన కాలంలో కలిగిన నష్టానికి ఇచ్చే పరిహారాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: 'హీబ్రూలో “స్వస్థపరచడం, స్వస్థపరచాలి” అనే బలపరిచే ప్రయోగం ఉంది. భావం: గాయపడినవాడు పూర్తిగా కోలుకునేందుకు అవసరమైన చికిత్స బాధ్యతను కొట్టినవాడు వహించాలి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: అతడు లేచి … నడవగలిగితే
  rationale: ఈ షరతుతో కూడిన న్యాయవాక్యంలో, గాయపడిన వ్యక్తి మంచం నుంచి లేచి కొంతవరకు కోలుకున్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: బయట నడవగలిగితే
  rationale: హిత్‌పయేల్ రూపం తిరుగుతూ లేదా సంచరిస్తూ నడవడాన్ని సూచిస్తుంది; సందర్భంలో తిరిగి నడిచే సామర్థ్యం వచ్చిందనే సాక్ష్యమే ప్రధాన భావం.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: తన చేతికర్రను ఆధారంగా చేసుకొని
  rationale: అక్షరార్థంగా ‘తన ఆధారకర్రపై’; గాయపడినవాడు ఆధారంతో నడుస్తున్నాడనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: అతణ్ణి కొట్టినవాడు శిక్షాబాధ్యత నుంచి విడుదలవుతాడు
  rationale: నిఫ్అల్ రూపమైన נקה న్యాయసందర్భంలో శిక్ష లేదా ప్రధాన నేరబాధ్యత నుంచి విముక్తిని సూచిస్తుంది. తరువాతి పరిహార బాధ్యత కొనసాగుతుంది కాబట్టి ‘నిర్దోషి’ అని అనలేదు.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: అయితే … పని చేయలేకపోయిన కాలానికి నష్టపరిహారం చెల్లించి
  rationale: שִׁבְתּוֹ అక్షరార్థంగా కూర్చోవడం లేదా పనిలేక ఉండడాన్ని సూచించినా, ఈ గాయపరిహార సందర్భంలో పని చేయలేని కాలానికి కలిగిన నష్టమే ఉద్దేశం. נתן ఇక్కడ చట్టబద్ధమైన చెల్లింపును సూచిస్తుంది.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: అతడు పూర్తిగా కోలుకునేలా చూడాలి
  rationale: క్రియానామం మరియు సమాప్త క్రియ కలయిక వైద్యపరమైన బాధ్యతను బలంగా తెలియజేస్తుంది. కొట్టినవాడే స్వయంగా వైద్యుడు అన్న భావం రాకుండా, సంపూర్ణ స్వస్థతకు బాధ్యత వహించాలనే అర్థాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘నిర్దోషి’ అనే పదం మిగిలిన పరిహార బాధ్యతను తప్పుగా తొలగించే అవకాశం ఉన్నందున ‘శిక్షాబాధ్యత నుంచి విడుదల’ అని అనువదించబడింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
