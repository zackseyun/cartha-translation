translation:
  language: te
  text: కంటికి కన్ను[a], పంటికి పన్ను, చేతికి చెయ్యి, పాదానికి పాదం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కన్నుకు బదులుగా కన్ను, పన్నుకు బదులుగా పన్ను, చేతికి బదులుగా చెయ్యి, పాదానికి బదులుగా పాదం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: కన్ను
  rationale: ఇది శరీరంలోని కన్నును సూచిస్తుంది. సంక్షిప్తమైన న్యాయసూత్ర శైలిని నిలుపుకోవడానికి తెలుగు విభక్తి రూపంలో సహజంగా అనువదించబడింది.
- source_word: תַּחַת
  choice: -కి / -కు
  rationale: ఈ న్యాయసందర్భంలో ఇది స్థలార్థమైన ‘కింద’ను కాకుండా ప్రతిగా లేదా దానికి సరితూగేదిగా అనే సంబంధాన్ని సూచిస్తుంది. ‘కంటికి కన్ను’ అనే తెలుగు నిర్మాణం ఆ సమాన ప్రతిఫల భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שֵׁן
  choice: పన్ను
  rationale: ఈ పదం శరీరంలోని పన్నును సూచిస్తుంది; సమాంతరమైన సంక్షిప్త నిర్మాణం అలాగే ఉంచబడింది.
- source_word: יָד
  choice: చెయ్యి
  rationale: సాధారణ శారీరక అర్థమైన చెయ్యి ఉద్దేశించబడింది. ‘చేతికి చెయ్యి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని లయను నిలుపుతుంది.
- source_word: רֶגֶל
  choice: పాదం
  rationale: ఈ సందర్భంలో ‘పాదం’ సరైన నిర్దిష్ట సమానార్థకం; ‘కాలు’ అనే విస్తృత అర్థం కంటే మూలంలోని శరీరభాగ సూచనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: న్యాయసూత్ర స్వభావం
  choice: ‘కంటికి కన్ను ... పాదానికి పాదం’ అనే సంక్షిప్త, సమాన ప్రతిఫల సూత్రం
  alternative: ‘గాయానికి తగిన శిక్ష విధించాలి’ అనే వివరణాత్మక అనువాదం
  rationale: హీబ్రూ వాక్యం תַּחַתతో జతచేయబడిన శరీరభాగాల పేర్లనే ఇస్తుంది. దాని అమలు విధానాన్ని వివరించే భావానువాదం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది; అందువల్ల సంక్షిప్తత మరియు వ్యాఖ్యానానికి తెరచి ఉన్న ఉద్వేగం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కాని సామాన్య పాఠకులకు సులభమైన న్యాయసూత్ర శైలి. మూలంలోని నాలుగు సమాంతర జతలు మరియు సంక్షిప్తత నిలుపబడ్డాయి.
