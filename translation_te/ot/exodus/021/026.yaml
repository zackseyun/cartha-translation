revisions:
- from: ఒకడు తన దాసుని కన్నునైనా, తన దాసి కన్నునైనా కొట్టి దానిని పనికిరాకుండా చేస్తే,[a] ఆ కన్నుకు పరిహారంగా[b] అతనిని గాని ఆమెను గాని స్వతంత్రంగా వెళ్లనివ్వాలి.[c]
  to: ఒకడు తన దాసుని కన్నునైనా తన దాసి కన్నునైనా కొట్టి, ఆ కన్ను పనికిరాకుండా అయ్యేలా చేస్తే,[a] ఆ కన్నుకు కలిగిన హానికి పరిహారంగా[b] అతనిని గాని ఆమెను గాని స్వేచ్ఛగా విడిచిపెట్టాలి.[c]
  rationale: The revision retains the source's legal force and its broad description of disabling injury, while making emancipation explicit and correcting the grammatical description in footnote c. It preserves the text's application to both the male and female slave without adding doctrinal interpretation.
