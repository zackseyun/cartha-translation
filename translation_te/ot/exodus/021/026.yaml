  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: te
  text: ఒకడు తన దాసుని కన్నునైనా తన దాసి కన్నునైనా కొట్టి, ఆ కన్ను పనికిరాకుండా అయ్యేలా చేస్తే,[a] ఆ కన్నుకు కలిగిన హానికి పరిహారంగా[b] అతనిని గాని ఆమెను గాని స్వేచ్ఛగా విడిచిపెట్టాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని నాశనం చేస్తే” లేదా “దాని చూపును పోగొడితే.” హీబ్రూ క్రియ కన్నుకు శాశ్వతమైన హాని కలగడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆ కన్నుకు బదులుగా.” ఆ కన్నుకు కలిగించిన హానికి ప్రతిఫలంగా విడుదల ఇవ్వబడుతుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘విడిచిపెట్టాలి’ అనే క్రియకు పురుష ఏకవచన కర్మప్రత్యయం ఉంది; అయినా, ఈ నియమం ముందుగా పేర్కొన్న దాసునికీ దాసికీ వర్తిస్తుంది.
    reason: translation_clarity
lexical_decisions:
- source_word: וְכִי
  choice: ఒకడు ... చేస్తే
  rationale: ఇది షరతుతో కూడిన న్యాయవిధిని పరిచయం చేస్తుంది. తెలుగులో ‘చేస్తే’ అనే నిర్మాణం సహజంగా ఆ న్యాయ షరతును తెలియజేస్తుంది; ప్రారంభంలోని ו ప్రత్యేకంగా అనువదించకపోయినా వాక్యసంబంధం నిలుస్తుంది.
- source_word: יַכֶּה
  choice: కొట్టి
  rationale: נכה యొక్క ప్రాథమిక భావం ‘కొట్టు’. ఇది ఒక్క దెబ్బను లేదా కొట్టే చర్యను సూచించగలదు; పదేపదే హింసించాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ పదం పురుష ఏకవచనం. న్యాయవిధి శైలిలో సహజమైన, లింగాన్ని నిలిపే తెలుగు రూపం.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: తన దాసుని / తన దాసి
  rationale: ఈ యాజమాన్య, విమోచన న్యాయ సందర్భంలో దాస్యస్థితి స్పష్టంగా ఉంది. ‘సేవకుడు/సేవకురాలు’ కంటే ‘దాసుడు/దాసి’ సామాజిక-న్యాయ వాస్తవాన్ని మెరుగ్గా తెలియజేస్తాయి.
- source_word: וְשִׁחֲתָהּ
  choice: దానిని పనికిరాకుండా చేస్తే
  rationale: שחת ఇక్కడ కన్నుకు శాశ్వతమైన, దాని ఉపయోగాన్ని నాశనం చేసే హానిని సూచిస్తుంది. ఈ అనువాదం సంపూర్ణ అంధత్వానికే అర్థాన్ని పరిమితం చేయకుండా ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: స్వతంత్రంగా వెళ్లనివ్వాలి
  rationale: ఈ న్యాయ సందర్భంలో שלח + חפשי దాస్యస్థితి నుండి విడుదల చేయడాన్ని సూచిస్తుంది. తెలుగు విధినిర్దేశ శైలిలో ‘వెళ్లనివ్వాలి’ తప్పనిసరి న్యాయ ఫలితాన్ని సహజంగా తెలుపుతుంది.
- source_word: תַּחַת עֵינוֹ
  choice: ఆ కన్నుకు పరిహారంగా
  rationale: תחת న్యాయ సందర్భంలో ‘బదులుగా/పరిహారంగా’ అనే ప్రతిఫల భావాన్ని కలిగిస్తుంది. ‘పరిహారంగా’ విడుదలకు కారణమైన న్యాయ సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయ న్యాయవిధిలో దాస్య పదజాలం
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు
  rationale: వచనంలో యజమాని గాయపరచడం, దానికి ప్రతిఫలంగా విడుదల చేయడం ప్రస్తావించబడినందున బంధిత సామాజిక స్థితి ప్రధానంగా ఉంది. అందువల్ల మృదువైన ‘సేవకుడు’ కంటే ‘దాసుడు’ మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: పురుష సర్వనామం మరియు రెండు లింగాల అన్వయం
  choice: అతనిని గాని ఆమెను గాని
  alternative: అతనిని
  rationale: హీబ్రూలో క్రియకు పురుష ఏకవచన ప్రత్యయం ఉన్నా, ముందున్న న్యాయ షరతు దాసునికీ దాసికీ సమానంగా వర్తిస్తుంది. తెలుగులో కేవలం ‘అతనిని’ అంటే దాసిని మినహాయించినట్టు అపార్థం కలగవచ్చు; అందువల్ల రెండింటినీ స్పష్టం చేశాం.
- issue: కన్నుకు కలిగిన హాని స్వరూపం
  choice: పనికిరాకుండా చేస్తే
  alternative: నాశనం చేస్తే / గుడ్డిదానిగా చేస్తే
  rationale: మూల క్రియ కన్ను శాశ్వతంగా చెడిపోవడాన్ని సూచిస్తుంది; అయితే అది కేవలం సంపూర్ణ అంధత్వమేనని పాఠం నిర్బంధంగా చెప్పదు. అనిశ్చితిని నిలిపేందుకు విస్తృతమైన ప్రయోజనహాని భావాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయవిధి శైలిని ఉపయోగించాం. ‘దాసుడు/దాసి’ ద్వారా మూలంలోని బంధిత స్థితిని దాచకుండా తెలిపాం. ‘పనికిరాకుండా’ సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉండి, హాని సంపూర్ణ అంధత్వమేనా అనే మూలంలోని విస్తృతిని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
