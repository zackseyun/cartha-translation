  rationale: ‘పురుషులు’ అֲנָשִׁים యొక్క లింగ-నిర్దిష్ట సూచనను నిలుపుతుంది. ‘బయటికి వచ్చేలా చేస్తే’ దెబ్బ తగలడం వల్ల పిల్లలు బయటికి రావడం అనే మూల వాక్యంలోని ఫలితసంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ఇది అకాల ప్రసవమా గర్భస్రావమా అని నిర్ణయించదు. అపాయం ఎవరికి సంబంధించినదనే సందిగ్ధతను ప్రధాన పాఠ్యమూ పాదటిప్పణీ అలాగే ఉంచుతున్నాయి.
