source:
  edition: WLC
  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: te
  text: పురుషులు ఒకరితో ఒకరు పోట్లాడుకుంటూ గర్భవతియైన స్త్రీని కొట్టి, ఆమె పిల్లలు బయటికి వచ్చేలా చేస్తే[a], ఏ అపాయం కలగకపోతే[b], ఆ స్త్రీ భర్త అతనిపై విధించిన జరిమానాను అతడు తప్పకుండా చెల్లించాలి; న్యాయాధికారుల నిర్ణయం ప్రకారం చెల్లించాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమె పిల్లలు బయటికి వస్తారు.” ఇది అకాల ప్రసవాన్ని సూచించవచ్చు; కొందరు దీనిని గర్భస్రావంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యం ఈ అపాయం తల్లికి, పిల్లలకు, లేక వారిలో ఎవరికైనా సంబంధించినదో ఈ వచనంలో మాత్రమే స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: లేదా “న్యాయస్థాన తీర్పు ప్రకారం” / “న్యాయాధికారుల సమక్షంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: చేసినప్పుడు
  rationale: న్యాయనియమంలోని ఊహాత్మక సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; ‘చేస్తే’ కూడా సాధ్యమే.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: మనుషులు ఒకరితో ఒకరు పోట్లాడుకుంటూ
  rationale: పురుషుల మధ్య జరిగే శారీరక ఘర్షణను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְנָגְפוּ
  choice: కొట్టినప్పుడు
  rationale: గాయం తీవ్రతను ముందుగానే నిర్ణయించకుండా భౌతికంగా తగిలిన దెబ్బను సూచిస్తుంది.
- source_word: אִשָּׁה הָרָה
  choice: గర్భవతియైన స్త్రీని
  rationale: మూలంలోని స్త్రీ స్థితిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: ఆమె పిల్లలు బయటికి వచ్చినా
  rationale: ‘ఆమె పిల్లలు బయటికి వచ్చారు’ అనే మూలభాషా రూపాన్ని నిలుపుతూ, అకాల ప్రసవమా గర్భస్రావమా అనే వివాదాస్పద అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: אָסוֹן
  choice: అపాయం
  rationale: విపత్తు, తీవ్రమైన హాని లేదా ప్రాణనష్టం వంటి అర్థవిస్తృతిని పూర్తిగా ఒకే రకమైన గాయానికి పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: జరిమానాను ... తప్పకుండా చెల్లించాలి
  rationale: హీబ్రూ తీవ్రతా నిర్మాణాన్ని ‘తప్పకుండా’తో చూపిస్తూ, తదుపరి ఆర్థిక చెల్లింపు సందర్భానికి తగిన న్యాయపరమైన అర్థాన్ని ఇస్తుంది.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו
  choice: అతనిపై విధించినంత
  rationale: దోషిపై నిర్ణీత మొత్తాన్ని మోపడం అనే న్యాయపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּעַל הָאִשָּׁה
  choice: ఆ స్త్రీ భర్త
  rationale: ఈ సందర్భంలో בַּעַל‌కు సహజమైన సంబంధార్థం ‘భర్త’; యజమాని అనే అర్థం ఇక్కడ తగదు.
- source_word: וְנָתַן בִּפְלִלִים
  choice: న్యాయాధికారుల నిర్ణయం ప్రకారం అతడు దానిని చెల్లించాలి
  rationale: చెల్లింపుకు న్యాయపరమైన పర్యవేక్షణ లేదా నిర్ణయం ఉందనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: గర్భవతిపై దెబ్బ పడిన తరువాత పిల్లలు బయటికి రావడం మరియు అపాయం ఎవరికి కలుగుతుందనే అంశం
  choice: గర్భస్రావమని లేదా సజీవ అకాల ప్రసవమని నిర్ణయించకుండా ‘ఆమె పిల్లలు బయటికి వచ్చినా’ అని అనువదించి, ‘అపాయం’ ఎవరికి సంబంధించినదో ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
  alternative: ‘ఆమెకు గర్భస్రావమైనా’ అని అనువదించడం; లేదా అపాయం తల్లికే, లేక తల్లి లేదా పిల్లలకు వర్తిస్తుందని స్పష్టీకరించడం.
  rationale: ఈ వచనంలోని హీబ్రూ పదాలు ప్రసవ ఫలితాన్ని లేదా అపాయం పొందిన వ్యక్తిని స్వతంత్రంగా స్పష్టంగా నిర్దేశించవు. అందువల్ల అసలైన సందిగ్ధతను, దానితో కూడిన నైతిక-వేదాంత ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. మూలంలోని వివాదాస్పద పదబంధాలను అతిగా వివరణాత్మకం చేయకుండా, పాదటిప్పణుల్లో ప్రధాన ప్రత్యామ్నాయాలను ఇచ్చాం.
