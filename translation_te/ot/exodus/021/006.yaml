source:
  edition: WLC
  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: te
  text: అప్పుడు అతని యజమాని అతన్ని దేవుని దగ్గరకు[a] తీసుకురావాలి. తరువాత అతన్ని తలుపు దగ్గరకు గానీ తలుపు నిలువు కమ్మి దగ్గరకు గానీ తీసుకురావాలి. అతని యజమాని మొనదేలిన పనిముట్టుతో అతని చెవిని గుచ్చాలి. అప్పుడు అతడు ఎప్పటికీ అతనికి సేవ చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయాధికారుల దగ్గరకు.’ హీబ్రూ אֱלֹהִים అనే పదం కొన్ని న్యాయ సందర్భాల్లో మానవ న్యాయాధికారులను లేదా న్యాయ అధికారాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: అతన్ని ... తీసుకురావాలి
  rationale: హిఫిల్ రూపం ఒక వ్యక్తిని అధికారి సమక్షానికి లేదా నిర్దిష్ట స్థలానికి తీసుకురావడాన్ని సూచిస్తుంది; తెలుగు న్యాయ సందర్భంలో ఇది సహజంగా ఉంటుంది.
- source_word: אֲדֹנָיו
  choice: అతని యజమాని
  rationale: ఇక్కడ దాసునితో ఉన్న సామాజిక-న్యాయ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; దైవార్థం కలిగించగల ‘ప్రభువు’ను నివారిస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుని సమక్షానికి
  rationale: మూలపదపు ప్రాథమిక అర్థమైన ‘దేవుడు’ను ప్రధాన పాఠ్యంలో నిలుపుతూ, సమక్షానికి తీసుకురావడం అనే న్యాయ-ఆచార భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַדֶּלֶת
  choice: తలుపు
  rationale: ఇంటి తలుపును సూచించే సరళమైన, ప్రత్యక్ష సమానార్థకం.
- source_word: הַמְּזוּזָה
  choice: తలుపు నిలువు కమ్మి
  rationale: నిర్మాణ సందర్భంలో מזוזה సూచించే doorpost‌ను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָצַע
  choice: గుచ్చాలి
  rationale: చెవిని మొనగల పరికరంతో రంధ్రం చేయడాన్ని సహజంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: אָזְנוֹ
  choice: అతని చెవి
  rationale: మూలంలోని శరీర భాగ సూచనను నేరుగా నిలుపుతుంది.
- source_word: בַּמַּרְצֵעַ
  choice: ముల్లు సూదితో
  rationale: రంధ్రం చేయడానికి ఉపయోగించే మొనగల awl‌కు సామాన్య పాఠకులకు అర్థమయ్యే తెలుగు పదబంధం.
- source_word: וַעֲבָדוֹ
  choice: అతనికి సేవ చేయాలి
  rationale: עבד క్రియలోని కొనసాగుతున్న సేవ భావాన్ని నేరుగా నిలుపుతుంది; వ్యక్తి స్థితికి కొత్త పేరు పెట్టదు.
- source_word: לְעֹלָם
  choice: జీవితాంతం
  rationale: ఈ న్యాయ సందర్భంలో సేవకుని జీవితకాలమంతా కొనసాగే స్థితిని సూచిస్తుంది; తెలుగులో ‘ఎప్పటికీ’ కలిగించగల అంతులేని కాల భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: న్యాయ సందర్భంలో הָאֱלֹהִים అర్థం
  choice: దేవుడు
  alternative: న్యాయాధికారులు
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘దేవుడు’; నిబంధన సంబంధ న్యాయ ఆచారంలో దేవుని సమక్షానికి తీసుకురావడం సహజంగా అర్థమవుతుంది. అయితే మానవ న్యాయాధికారులను లేదా న్యాయస్థానాన్ని సూచించే పఠనం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: לְעֹלָם యొక్క కాలవ్యాప్తి
  choice: జీవితాంతం
  alternative: ఎప్పటికీ
  rationale: ఈ సేవా-న్యాయ సందర్భంలో వ్యక్తి జీవితమంతా కొనసాగే శాశ్వత బంధాన్ని సూచిస్తుంది; తాత్త్వికంగా అంతులేని కాలాన్ని నిర్బంధంగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని స్పష్టత కోసం చిన్న వాక్యాలుగా విభజించాం.
