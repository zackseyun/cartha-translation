revisions:
- from: అయితే ఒక ఎద్దుకు నిన్న మొన్నటి నుంచే కుమ్మే అలవాటు ఉండి[a], దాని యజమానికి హెచ్చరిక చేయబడినా[b] దానిని కట్టడి చేయకపోవడం వల్ల అది ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ చంపితే, ఆ ఎద్దును రాళ్లతో కొట్టి చంపాలి; దాని యజమానికి కూడా మరణశిక్ష విధించాలి.
  to: అయితే, ఒక ఎద్దుకు ఇంతకుముందు నుంచీ కుమ్మే అలవాటు ఉండి[a], దాని యజమానికి హెచ్చరిక చేయబడినప్పటికీ అతడు దానిని అదుపులో ఉంచక, అది ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ చంపితే, ఆ ఎద్దును రాళ్లతో కొట్టి చంపాలి; దాని యజమానికి కూడా మరణశిక్ష విధించాలి.
  rationale: The revision removes the unstated causal connector, explicitly identifies the owner as the one failing to restrain the ox, and avoids a modern Telugu idiom that may suggest merely recent behavior. Footnote a retains the literal Hebrew temporal imagery and explains its idiomatic force. Footnote b is retained as supplied, although its anchor is not required in the revised main text.
