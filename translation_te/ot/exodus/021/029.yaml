id: EXO.21.29
reference: Exodus 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: te
  text: అయితే, ఒక ఎద్దుకు ఇంతకుముందు నుంచీ కుమ్మే అలవాటు ఉండి[a], దాని యజమానికి హెచ్చరిక చేయబడినప్పటికీ అతడు దానిని అదుపులో ఉంచక, అది ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ చంపితే, ఆ ఎద్దును రాళ్లతో కొట్టి చంపాలి; దాని యజమానికి కూడా మరణశిక్ష విధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్నటి నుంచీ, మొన్నటి నుంచీ.” ఇది ఎద్దుకు ముందే కుమ్మే అలవాటు ఉన్నట్లు తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: ఈ న్యాయ సందర్భంలో పెంపుడు గోవును సూచించే సాధారణ ఏకవచన పదంగా ‘ఎద్దు’ సహజంగా, సంప్రదాయబద్ధంగా ఉంటుంది.
- source_word: נַגָּח
  choice: కుమ్మే అలవాటు ఉండి
  rationale: ఈ కృదంతం ఒక్కసారి కుమ్మడాన్ని కాక, పదేపదే కుమ్మే స్థిర స్వభావాన్ని లేదా అలవాటును తెలియజేస్తుంది.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: నిన్న మొన్నటి నుంచే
  rationale: హీబ్రూ పదబంధంలోని గత రోజుల రూపకాన్ని నిలుపుతూ, ముందే స్థిరపడిన ప్రవర్తనను సహజమైన తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: దాని యజమానికి హెచ్చరిక చేయబడినా
  rationale: ఈ న్యాయ సందర్భంలో ప్రమాదకరమైన ప్రవర్తన గురించి యజమానికి సాక్ష్యపూర్వకంగా లేదా అధికారికంగా తెలియజేయబడిన భావం ఉంది; ‘హెచ్చరిక చేయబడినా’ దానిని స్పష్టంగా అందిస్తుంది.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: దానిని కట్టడి చేయకపోవడం వల్ల
  rationale: కాపాడడం అనే మూలభావం ఇక్కడ ప్రమాదకరమైన జంతువును అదుపులో లేదా నిర్బంధంలో ఉంచడాన్ని సూచిస్తుంది.
- source_word: וְהֵמִית
  choice: చంపితే
  rationale: ఎద్దు కారణంగా సంభవించిన మరణాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ
  rationale: మూలపాఠం పురుషుడు, స్త్రీ ఇద్దరినీ స్పష్టంగా పేర్కొంటుంది; ఆ ప్రత్యేకతను అనువాదం నిలుపుతుంది.
- source_word: יִסָּקֵל
  choice: రాళ్లతో కొట్టి చంపాలి
  rationale: నిర్దేశిత శిక్ష రాళ్లతో కొట్టడం మాత్రమే కాక మరణదండన కావడం తెలుగులో స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: దాని యజమానికి కూడా మరణశిక్ష విధించాలి
  rationale: హోఫల్ రూపం సహజ మరణాన్ని కాక న్యాయపరంగా విధించే మరణదండనను సూచిస్తుంది; విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ న్యాయబలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యజమానికి విధించే శిక్ష యొక్క న్యాయబలం
  choice: దాని యజమానికి కూడా మరణశిక్ష విధించాలి
  alternative: దాని యజమాని కూడా చనిపోవాలి
  rationale: יוּמָת అనేది సాధారణంగా న్యాయపరంగా అమలు చేసే మరణదండనను సూచిస్తుంది; కేవలం ‘చనిపోవాలి’ అనడం ఆ న్యాయార్థాన్ని బలహీనపరుస్తుంది.
- issue: బాధితుని లింగాన్ని తెలిపే భాష
  choice: ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ
  alternative: ఎవరినైనా
  rationale: మూలపాఠం రెండు లింగాలనూ స్పష్టంగా పేర్కొన్నందున ఆ రూపాన్ని నిలుపుకోవడం మూలానికి మరింత నమ్మకమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయవాక్యానికి తగిన గంభీరతను ఉంచుతూ, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘నిన్న మొన్నటి నుంచే’ మూలంలోని నుడికారాన్ని సహజంగా నిలుపుతుంది; ‘కట్టడి చేయడం’ సందర్భానుసారంగా జంతువును అదుపులో ఉంచే బాధ్యతను స్పష్టం చేస్తుంది.
