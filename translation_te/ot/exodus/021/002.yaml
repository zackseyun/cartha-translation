id: EXO.21.2
reference: Exodus 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: te
  text: నీవు ఒక హెబ్రీ దాసుణ్ణి కొంటే[a], అతడు ఆరు సంవత్సరాలు సేవ చేయాలి; కానీ ఏడవ సంవత్సరంలో ఏమీ చెల్లించకుండా స్వతంత్రుడిగా వెళ్లిపోవాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీవు ఒక హెబ్రీ దాసుణ్ణి కొన్నప్పుడు’ అని కూడా అనువదించవచ్చు. హెబ్రీలోని ఈ పదం షరతుతో కూడిన న్యాయనియమాన్ని ‘ఒకవేళ’ లేదా ‘ఎప్పుడు’ అనే భావంతో పరిచయం చేయగలదు. ‘దాసుడు’కు బదులుగా ‘సేవకుడు’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఏమీ చెల్లించకుండా స్వేచ్ఛలోకి వెళ్లాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: కొంటే
  rationale: ఇది షరతుతో కూడిన న్యాయనియమాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘కొంటే’ సహజంగా ‘if’ భావాన్ని ఇస్తుంది; సందర్భానుసారం ‘కొన్నప్పుడు’ అనే భావమూ సాధ్యమే.
- source_word: תִקְנֶה
  choice: కొంటే
  rationale: קנה అనే క్రియకు ఈ వాణిజ్య-న్యాయ సందర్భంలో ‘కొను/సంపాదించు’ అనే అర్థం ఉంది; వ్యక్తిని కొనుగోలు చేయడం ఇక్కడ స్పష్టంగా చెప్పబడింది.
- source_word: עֶבֶד עִבְרִי
  choice: హెబ్రీ దాసుణ్ణి
  rationale: עֶבֶד కొనబడిన బంధిత స్థితిని సూచిస్తున్నందున ‘సేవకుడు’ కంటే ‘దాసుడు’ మూలంలోని సామాజిక-న్యాయ వాస్తవాన్ని స్పష్టంగా తెలియజేస్తుంది. עִבְרִי కి నిర్దిష్టమైన ‘హెబ్రీ’ పదాన్నే నిలిపాం.
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: అతడు ఆరు సంవత్సరాలు సేవ చేయాలి
  rationale: עבד క్రియలోని ‘పని చేయు/సేవ చేయు’ భావాల్లో, దాస్యస్థితి ఇప్పటికే నామవాచకంలో స్పష్టమైనందున ‘సేవ చేయాలి’ సహజమైన న్యాయభాషగా ఉంది.
- source_word: וּבַשְּׁבִעִת
  choice: కానీ ఏడవ సంవత్సరంలో
  rationale: వావ్ సంధి ఇక్కడ ఆరు సంవత్సరాల సేవకు విరుద్ధంగా విడుదలను ప్రవేశపెడుతుంది; తెలుగులో ‘కానీ’ ఆ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘ఏడవది’లో అంతర్భూతమైన ‘సంవత్సరం’ను స్పష్టత కోసం చేర్చాం.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: స్వతంత్రుడిగా వెళ్లిపోవాలి
  rationale: ‘బయటికి వెళ్లడం’ అనే హెబ్రీ నుడికారాన్ని తెలుగులో అర్థవంతంగా ఉంచుతూ, לַחָפְשִׁי సూచించే స్వేచ్ఛా స్థితిని ‘స్వతంత్రుడిగా’ వెల్లడిస్తుంది.
- source_word: חִנָּם
  choice: ఏమీ చెల్లించకుండా
  rationale: విడుదల పొందడానికి విమోచనధనం లేదా మరే చెల్లింపూ అవసరం లేదనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన దాస్య సందర్భంలో עֶבֶד అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ వాక్యం కొనబడిన, నిర్ణీతకాలం బంధిత సేవలో ఉన్న వ్యక్తిని గూర్చి చెబుతుంది. ‘సేవకుడు’ అని మృదూకరించకుండా, మూలపాఠంలోని బంధిత స్థితిని ‘దాసుడు’ స్పష్టంగా నిలుపుతుంది.
- issue: విడుదల స్వరూపం
  choice: ఏమీ చెల్లించకుండా స్వతంత్రుడిగా వెళ్లిపోవాలి
  alternative: ఉచితంగా బయటికి వెళ్లాలి
  rationale: ఈ పదబంధం యజమానికి పారితోషికం ఇవ్వాలనే భావం కాకుండా, దాసుడు తన విడుదల కోసం చెల్లించాల్సిన అవసరం లేదనే అర్థాన్ని సందర్భం సూచిస్తుంది; అయితే మూలంలోని సంక్షిప్త నుడికారాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘దాసుడు’ మూలంలోని బంధిత స్థితిని దాచకుండా తెలియజేస్తుంది; ‘స్వతంత్రుడిగా వెళ్లిపోవాలి’ హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
