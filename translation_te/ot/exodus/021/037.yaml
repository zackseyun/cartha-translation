  text: כִּ֤י יִגְנֹֽב אִישׁ֙ שׁ֣וֹר אוֹ שֶׂ֔ה וּ/טְבָח֖/וֹ א֣וֹ מְכָר֑/וֹ חֲמִשָּׁ֣ה בָקָ֗ר יְשַׁלֵּם֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/אַרְבַּע צֹ֖אן תַּ֥חַת הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: te
  text: ఒకడు ఎద్దునైనా, గొర్రెను గానీ మేకను గానీ[a] దొంగిలించి, దానిని వధించినా లేదా అమ్మినా, ఎద్దుకు బదులుగా ఐదు పశువులను, గొర్రెకు లేదా మేకకు బదులుగా నాలుగు చిన్న పశువులను పరిహారంగా చెల్లించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం గొర్రెను గానీ మేకను గానీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నష్టపరిహారం చెల్లించాలి.” హీబ్రూ క్రియకు న్యాయపరమైన ప్రతిపూరణ భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִגְנֹב אִישׁ
  choice: ఒకడు ... దొంగిలించి ... అయితే
  rationale: కాసూయిస్టిక్ న్యాయనియమంలోని షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; אִישׁ ఇక్కడ సాధారణ ప్రతినిధి ఏకవచనం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: న్యాయపరమైన పశుసంపద సందర్భంలో సాధారణంగా అర్థమయ్యే ప్రత్యక్ష సమానార్థకం; సందర్భం అవసరపడనంతగా లింగం లేదా వయస్సును మరింత నిర్దిష్టం చేయదు.
- source_word: שֶׂה
  choice: గొర్రె లేదా మేక
  rationale: హీబ్రూ పదం గొర్రె లేదా మేకలలో ఒక చిన్న పశువును సూచించగలదు; ఒక్క 'గొర్రె'గా పరిమితం చేయకుండా మూలంలోని వ్యాప్తిని కాపాడుతుంది.
- source_word: וּטְבָחוֹ
  choice: దానిని వధించినా
  rationale: טבח సాధారణంగా చంపడం కంటే మాంసం కోసం లేదా వినియోగార్థం జంతువును వధించడాన్ని సూచిస్తుంది.
- source_word: אוֹ מְכָרוֹ
  choice: లేదా అమ్మినా
  rationale: 3 పురుష ఏకవచన ప్రత్యయంతో ఉన్న מכר క్రియను సహజంగా, నేరుగా అందిస్తుంది.
- source_word: חֲמִשָּׁה בָקָר
  choice: ఐదు పశువులు
  rationale: בקר పశువుల సమూహవాచకం; తెలుగులో లెక్కతో 'పశువులు' సహజంగా ఉండి, అవన్నీ మగ ఎద్దులేనని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְשַׁלֵּם
  choice: పరిహారంగా చెల్లించాలి
  rationale: ఈ న్యాయసందర్భంలో שלם సాధారణ చెల్లింపుకన్నా నష్టపరిహారం లేదా ప్రతిపూరణ భావాన్ని కలిగి ఉంది.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ప్రత్యామ్నాయం లేదా ప్రతిపూరణ అనే మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְאַרְבַּע צֹאן
  choice: నాలుగు గొర్రెలు లేదా మేకలు
  rationale: צֹאן చిన్న పశువుల సమూహాన్ని, ముఖ్యంగా గొర్రెలు మరియు మేకలను సూచిస్తుంది; మూలంలోని వర్గవ్యాప్తిని కాపాడుతుంది.
