translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతోనూ సామాన్య పాఠకుడికి స్పష్టంగానూ రూపొందించబడింది. שֶׂה మరియు צֹאן పదాల వ్యాప్తిని ఒక్క 'గొర్రె'కు పరిమితం చేయకుండా మూలంలోని నిజమైన అర్థపరిధి నిలుపబడింది.
