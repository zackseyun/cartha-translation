source:
  edition: WLC
  text: אִם אַחֶ֖רֶת יִֽקַּֽח ל֑/וֹ שְׁאֵרָ֛/הּ כְּסוּתָ֥/הּ וְ/עֹנָתָ֖/הּ לֹ֥א יִגְרָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: te
  text: అతడు మరొక స్త్రీని భార్యగా చేసుకుంటే, ఆమెకు ఇవ్వవలసిన ఆహారాన్ని, వస్త్రాలను, దాంపత్య హక్కును[a] తగ్గించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెతో దాంపత్య సాన్నిహిత్యాన్ని.” హీబ్రూ పదం భర్త నెరవేర్చవలసిన వైవాహిక సాన్నిహిత్య బాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేసుకుంటే
  rationale: ఇది కేసు-చట్టంలోని షరతును సూచిస్తుంది; తెలుగులో ‘చేసుకుంటే’ సహజంగా ఆ షరతు భావాన్ని నిలుపుతుంది.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: అతడు మరొక స్త్రీని భార్యగా చేసుకుంటే
  rationale: אַחֶרֶת అక్షరార్థంగా ‘మరొక స్త్రీ’; ఈ వివాహ సందర్భంలో לקח לוֹ ఆమెను తనకు భార్యగా తీసుకోవడాన్ని సూచిస్తుంది. ‘భార్యగా చేసుకుంటే’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: שְׁאֵרָהּ
  choice: ఆమె ఆహారాన్ని
  rationale: ఈ మూడు వైవాహిక బాధ్యతల జాబితాలో ఈ పదం జీవనపోషణను, ముఖ్యంగా ఆహారాన్ని సూచిస్తుంది. ‘ఆహారం’ సాధారణ పాఠకులకు స్పష్టమైన సమానార్థకం.
- source_word: כְּסוּתָהּ
  choice: వస్త్రాలను
  rationale: ఈ నామవాచకం కప్పుకునేది లేదా దుస్తులను సూచిస్తుంది; ‘వస్త్రాలు’ గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: וְעֹנָתָהּ
  choice: దాంపత్య హక్కును[a]
  rationale: అరుదైన ఈ పదం భర్త నెరవేర్చవలసిన దాంపత్య సాన్నిహిత్య బాధ్యతను సూచిస్తుంది. ‘దాంపత్య హక్కు’ చట్టపరమైన భావాన్ని నిలుపుతూ అతిగా ప్రత్యక్షంగా గానీ అస్పష్టంగా గానీ ఉండదు; పదంలోని క్లిష్టతను పాదటిప్పణి వివరిస్తుంది.
- source_word: לֹא יִגְרָע
  choice: తగ్గించకూడదు
  rationale: క్రియ తగ్గించడం లేదా కొరత చేయడం అనే భావం కలిగి, జాబితాలోని మూడు బాధ్యతలన్నిటికీ వర్తిస్తుంది. ‘తగ్గించకూడదు’ తెలుగు నియమవాక్యానికి సహజం.
theological_decisions:
- issue: ఈ నియమం బహుభార్యత్వాన్ని ఆమోదిస్తుందా లేక ఉన్న పరిస్థితిని నియంత్రిస్తుందా?
  choice: అటువంటి వివాహ పరిస్థితి ఏర్పడితే మొదటి స్త్రీ హక్కులను తగ్గించరాదనే షరతుగానే అనువదించబడింది.
  alternative: వాక్యాన్ని బహుభార్యత్వానికి ప్రత్యక్ష అనుమతిగా వ్యక్తీకరించడం.
  rationale: హీబ్రూ వాక్యం కేసు-చట్ట రూపంలో బాధ్యతను నిర్దేశిస్తుంది; ఆ ఆచారంపై అదనపు నైతిక లేదా సిద్ధాంతపరమైన తీర్పును ఈ వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చట్టపరమైన శైలిని ఉపయోగించాం. హీబ్రూ పదం עֹנָהలోని అరుదైన భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంచి, పాదటిప్పణిలో స్పష్టం చేశాం.
