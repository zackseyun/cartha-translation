  edition: WLC
  text: וְ/אִם לִ/בְנ֖/וֹ יִֽיעָדֶ֑/נָּה כְּ/מִשְׁפַּ֥ט הַ/בָּנ֖וֹת יַעֲשֶׂה לָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: te
  text: అయితే అతడు ఆమెను తన కుమారునికోసం నియమిస్తే, కుమార్తెలకు ఉండే హక్కుల ప్రకారం ఆమె పట్ల వ్యవహరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమార్తెల విషయంలో పాటించే ఆచారం ప్రకారం.” హీబ్రూ పదబంధం స్థాపిత న్యాయపద్ధతిని గానీ, ఆనవాయితీ ప్రకారం చేసే వ్యవహారాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ... చేస్తే
  rationale: ఇది న్యాయనియమాల వరుసలో ప్రత్యామ్నాయ షరతును ప్రవేశపెడుతూ, ముందటి సందర్భంతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִבְנוֹ
  choice: తన కుమారునికోసం
  rationale: లְ ఉపసర్గ ఇక్కడ వివాహ సంబంధ ఏర్పాటులో ఎవరికోసం నియమించడాన్ని సూచిస్తుంది; ‘తన కుమారునికి’ కంటే ‘తన కుమారునికోసం’ ఉద్దేశాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִיעָדֶנָּה
  choice: ఆమెను ... నియమిస్తే
  rationale: יעד ఇక్కడ ఆ అమ్మాయిని వివాహ సంబంధం కోసం అధికారికంగా కేటాయించడం లేదా నియమించడం సూచిస్తుంది. ‘నిశ్చితార్థం చేస్తే’ అని అనువదించడం సందర్భానుకూలమైనా, మూలపదం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: כְּמִשְׁפַּט
  choice: హక్కుల ప్రకారం
  rationale: న్యాయ సందర్భంలో מִשְׁפָּט స్థాపిత నియమం, న్యాయబద్ధమైన హక్కు లేదా రావలసిన దానిని సూచించగలదు. ఇక్కడ ‘హక్కులు’ అనే పదం న్యాయపరమైన బలాన్ని నిలుపుతుంది.
- source_word: הַבָּנוֹת
  choice: కుమార్తెలకు
  rationale: మూలంలో నిర్దిష్టంగా ‘కుమార్తెలు’ అని ఉంది; కుటుంబంలో కుమార్తెలకు లభించవలసిన స్థానం, రక్షణలను ఈ పదం నేరుగా తెలియజేస్తుంది.
- source_word: יַעֲשֶׂה לָּהּ
  choice: ఆమె పట్ల వ్యవహరించాలి
  rationale: עשה + ל నిర్మాణం ఒకరి విషయంలో చేయవలసిన చర్యను సూచిస్తుంది. ‘వ్యవహరించాలి’ న్యాయ సందర్భానికి తగినదిగా ఉండి, అంతర్లీన బాధ్యతలను అనవసరంగా పరిమితం చేయదు.
theological_decisions:
- issue: కుమారునికోసం నియమించబడిన అమ్మాయి పట్ల ఉండే బాధ్యత స్వరూపం
  choice: ఆమెను కుమార్తెలకు ఉండే న్యాయబద్ధమైన హక్కులకు అనుగుణంగా చూడాలి.
  alternative: కుమార్తెల వివాహానికి సంబంధించిన ఆనవాయితీ ప్రకారం ఆమె విషయంలో ఏర్పాట్లు చేయాలి.
  rationale: כמשפט הבנות అనే పదబంధం న్యాయబద్ధమైన హక్కులు లేదా స్థాపిత ఆచారం అనే రెండు భావాలను అనుమతిస్తుంది. ప్రధాన పాఠ్యంలో న్యాయపరమైన బలాన్ని ప్రతిబింబిస్తూ ‘హక్కులు’ అని ఉంచి, ‘ఆచారం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘నియమిస్తే’ మూలంలోని అధికారిక భావాన్ని నిలుపుతుంది; ‘హక్కుల ప్రకారం’ న్యాయబలాన్ని వ్యక్తం చేస్తుంది. ప్రత్యామ్నాయమైన ఆచార భావాన్ని పాదటిప్పణిలో ఉంచాం.
