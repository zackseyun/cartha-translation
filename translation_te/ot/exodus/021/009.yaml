  source_fidelity: హీబ్రూ వాక్యంలోని షరతు (וְאִם), కుమారునికోసం నియమించడం (לִבְנוֹ יִיעָדֶנָּה), మరియు కుమార్తెలకు వర్తించే న్యాయసూత్రం/హక్కుల ప్రకారం ఆమెతో వ్యవహరించవలసిన బాధ్యత (כְּמִשְׁפַּט הַבָּנוֹת יַעֲשֶׂה לָּהּ) విశ్వసనీయంగా ప్రతిఫలించాయి. ‘హక్కుల ప్రకారం’ అనేది משפט యొక్క న్యాయబద్ధ భావాన్ని సముచితంగా ఇస్తుంది; పాదటిప్పణి ‘ఆచారం’ అనే సాధ్యమైన విస్తృత అర్థాన్ని కాపాడుతుంది.
