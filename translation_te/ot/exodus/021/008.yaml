- from: ఆమె తన యజమాని దృష్టికి ఇంపుగా లేకపోతే, అతడు ఆమెను తనకోసం నియమించుకోకపోయినట్లయితే[a], ఆమెను వెల చెల్లించి విడిపించడానికి అతడు అనుమతించాలి. ఆమె పట్ల అతడు నమ్మకద్రోహంగా ప్రవర్తించాడు కాబట్టి, ఆమెను పరాయి ప్రజలకు అమ్మే హక్కు అతనికి లేదు.[b]
  to: ఆమె తన యజమానికి నచ్చకపోతే, అతడు ఆమెను తనకోసం నియమించుకోనివాడైతే[a], ఆమెను విమోచించడానికి అతడు అనుమతించాలి. ఆమె పట్ల అతడు నమ్మకద్రోహంగా ప్రవర్తించినందున[b], ఆమెను విదేశీ ప్రజలకు అమ్మే హక్కు అతనికి లేదు.
  rationale: ముసాయిదా యొక్క మూలభావాన్ని నిలుపుతూ, విమోచన ధర చెల్లింపును స్పష్టంగా జోడించిన పదబంధాన్ని తొలగించాం. వాక్యనిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా ఉండేలా సవరించాం; వివాదాస్పదమైన ‘నియమించు/వివాహానికి నిశ్చయించు’ భావసందిగ్ధతను పాదటిప్పణిలోనే నిలిపాం. b సూచికను అది వివరిస్తున్న పదబంధం వద్దకు మార్చాం.
