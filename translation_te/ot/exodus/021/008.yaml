  source_fidelity: మూలంలోని నిషేధార్థ పఠనం (‘తనకోసం నియమించుకోలేదు’)ను, విమోచనకు అనుమతించాల్సిన న్యాయపరమైన ఫలితాన్ని, విదేశీ ప్రజలకు అమ్మడంపై నిషేధాన్ని, ఆమెపట్ల ద్రోహంగా ప్రవర్తించడాన్ని ముసాయిదా మొత్తంగా విశ్వసనీయంగా తెలియజేస్తోంది. అయితే ‘వెల చెల్లించి’ అనేది మూలపాఠం స్పష్టంగా చెప్పని ధర చెల్లింపును జోడిస్తుంది.
