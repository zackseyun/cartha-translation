id: EXO.21.8
reference: Exodus 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: te
  text: ఆమె తన యజమానికి నచ్చకపోతే, అతడు ఆమెను తనకోసం నియమించుకోనివాడైతే[a], ఆమెను విమోచించడానికి అతడు అనుమతించాలి. ఆమె పట్ల అతడు నమ్మకద్రోహంగా ప్రవర్తించినందున[b], ఆమెను విదేశీ ప్రజలకు అమ్మే హక్కు అతనికి లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆమెను తనకోసం నియమించుకున్నవాడైతే”; లేదా, “అతడు ఆమెను తనకోసం వివాహానికి నిశ్చయించుకోనివాడైతే.” ఈ హీబ్రూ వాక్యభాగం పాఠపరంగానూ భావపరంగానూ క్లిష్టమైనది.
    reason: textual_variant
  - marker: b
    text: “నమ్మకద్రోహంగా” అనే మాటకు “విశ్వాసఘాతకంగా” లేదా “మోసపూరితంగా” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: తన యజమాని దృష్టికి ఇంపుగా లేకపోతే
  rationale: ఈ హీబ్రూ నుడికారం నైతికంగా ‘చెడ్డది’ అని కాక, ఒకరికి నచ్చకపోవడం లేదా ఆమోదయోగ్యంగా లేకపోవడం అనే భావాన్ని ఇస్తుంది; ‘దృష్టికి’ అనే రూపం మూల నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲדֹנֶיהָ
  choice: ఆమె యజమాని
  rationale: ఈ న్యాయ సందర్భంలో ఇది ఆ బాలికను కొనుగోలు చేసిన పురుష అధికారిని సూచిస్తుంది; ‘యజమాని’ సామాజిక-న్యాయ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְעָדָהּ
  choice: ఆమెను తనకోసం నియమించుకోకపోయినట్లయితే
  rationale: ఈ క్రియ వివాహ సంబంధ ఉద్దేశంతో ఆమెను తనకోసం కేటాయించడం లేదా నియమించుకోవడం సూచించగలదు. ప్రధాన పాఠంలో విస్తృతార్థాన్ని ఉంచి, ‘వివాహానికి నిశ్చయించుకోవడం’ అనే సందర్భోచిత అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְהֶפְדָּהּ
  choice: ఆమెను వెల చెల్లించి విడిపించడానికి అతడు అనుమతించాలి
  rationale: పదంలోని హిఫిల్ రూపం విమోచనను అనుమతించడం లేదా జరిగేలా చేయడం అనే భావాన్ని ఇక్కడ ఇస్తుంది; యజమానే విమోచన వెల చెల్లిస్తాడని చెప్పకుండా న్యాయపరమైన ఫలితాన్ని స్పష్టం చేస్తుంది.
- source_word: לְעַם נָכְרִי
  choice: పరాయి ప్రజలకు
  rationale: మూలంలోని పదబంధం ఒక వ్యక్తిని కాక సామూహికంగా పరాయి ప్రజలను సూచిస్తుంది; ఈ ఎంపిక ఆ సామాజిక-ఒడంబడిక భేదాన్ని నిలుపుతుంది.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: ఆమెను ... అమ్మే హక్కు అతనికి లేదు
  rationale: משל ఇక్కడ అధికారం లేదా న్యాయబద్ధమైన హక్కును సూచిస్తుంది; ‘హక్కు లేదు’ అనేది ఆధునిక తెలుగులో ఆ న్యాయబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּבִגְדוֹ בָהּ
  choice: ఆమె పట్ల అతడు నమ్మకద్రోహంగా ప్రవర్తించాడు కాబట్టి
  rationale: בגד మోసపూరితంగా, విశ్వాసఘాతకంగా లేదా ద్రోహంగా ప్రవర్తించడాన్ని సూచిస్తుంది; ‘నమ్మకద్రోహంగా’ అతడు తన బాధ్యతను నిలబెట్టుకోలేదనే నైతిక-న్యాయ ఆరోపణను తెలియజేస్తుంది.
theological_decisions:
- issue: יְעָדָהּ ఉన్న వాక్యభాగంలోని మసొరెతిక్ పాఠభేదం మరియు భావసందిగ్ధత
  choice: అతడు ఆమెను తనకోసం నియమించుకోకపోయినట్లయితే
  alternative: అతడు ఆమెను తనకోసం నియమించుకున్నట్లయితే; లేదా అతడు ఆమెను తనకు వివాహానికి నిశ్చయించుకోకపోయినట్లయితే
  rationale: మసొరెతిక్ సంప్రదాయంలో ఈ వాక్యభాగం పాఠపరంగా క్లిష్టమైనది; ప్రాచీన అనువాదాలు, పాఠక సంప్రదాయాలు నిషేధార్థం/అంగీకారార్థం విషయంలోను, ‘నియమించు’/‘వివాహానికి నిశ్చయించు’ విషయంలోను భిన్నంగా ఉన్నాయి. ప్రధాన పాఠం అందించిన వ్యంజన-రూప విశ్లేషణలోని నిషేధార్థాన్ని అనుసరిస్తూ, నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘వెల చెల్లించి విడిపించడం’ విమోచన ధర భావాన్ని స్పష్టం చేస్తుంది. రెండు పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో [a], [b]గా ఉన్నాయి.
