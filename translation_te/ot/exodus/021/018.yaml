revisions:
- from: మనుషులు గొడవపడి, ఒకడు తన తోటి వ్యక్తిని రాయితో గానీ పిడికిలితో గానీ కొట్టినప్పుడు, అతడు చనిపోకుండా మంచాన పడితే,[a]
  to: పురుషులు గొడవపడగా, వారిలో ఒకడు తన తోటి పురుషుణ్ణి రాయితో గానీ పిడికిలితో గానీ కొట్టి, దెబ్బతిన్నవాడు చనిపోకుండా మంచాన పడితే,[a]
  rationale: The revision preserves the Hebrew case-law condition, masculine plural reference, and the sequence of quarrel, blow, nonfatal outcome, and being laid up. It replaces the ambiguous pronoun with “దెబ్బతిన్నవాడు” solely to make clear the antecedent already determined by the source context. The footnote remains correctly anchored to “మంచాన పడితే” and explains the literal idiom.
