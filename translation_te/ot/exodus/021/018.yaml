  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి సహజమైన పదప్రయోగం. మూలంలోని షరతు నిర్మాణాన్ని తెలుగు ‘...పడితే’ రూపంలో నిలిపింది. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
