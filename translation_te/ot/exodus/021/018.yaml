id: EXO.21.18
reference: Exodus 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יְרִיבֻ֣/ן אֲנָשִׁ֔ים וְ/הִכָּה אִישׁ֙ אֶת רֵעֵ֔/הוּ בְּ/אֶ֖בֶן א֣וֹ בְ/אֶגְרֹ֑ף וְ/לֹ֥א יָמ֖וּת וְ/נָפַ֥ל לְ/מִשְׁכָּֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: te
  text: పురుషులు గొడవపడగా, వారిలో ఒకడు తన తోటి పురుషుణ్ణి రాయితో గానీ పిడికిలితో గానీ కొట్టి, దెబ్బతిన్నవాడు చనిపోకుండా మంచాన పడితే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మంచానికి పడిపోతే”—అంటే గాయం వల్ల మంచానికే పరిమితమైతే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: కొట్టినప్పుడు
  rationale: ఇది షరతుతో కూడిన న్యాయసందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో మొత్తం వాక్యాన్ని ‘...కొట్టినప్పుడు’ అనే నిర్మాణంతో చెప్పడం సహజంగా ఉండి, ‘ఒకవేళ’ అనే భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: יְרִיבֻן
  choice: గొడవపడి
  rationale: ריב వాదించడం, కలహించడం అనే అర్థాలను కలిగి ఉంది; ఇక్కడ అది దెబ్బకొట్టే స్థాయికి పెరిగిన పరస్పర గొడవను సూచిస్తుంది. ‘గొడవపడి’ ఈ పరిధిని అతిశయోక్తి లేకుండా అందిస్తుంది.
- source_word: אֲנָשִׁים
  choice: మనుషులు
  rationale: మూలంలో పురుష బహువచనం ఉంది. ‘మనుషులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, న్యాయసందర్భంలోని వ్యక్తులను సూచిస్తుంది.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: ఒకడు తన తోటి వ్యక్తిని ... కొట్టినప్పుడు
  rationale: אִישׁ ఒక పాల్గొనేవాణ్ణి ప్రత్యేకంగా చూపిస్తుంది; רֵעֵהוּ ఇక్కడ అతని సహచరుడు లేదా ఎదుటి వ్యక్తిని సూచిస్తుంది. ‘తోటి వ్యక్తి’ అనేది ‘పొరుగువాడు’ అనే అనవసర ప్రాదేశిక భావాన్ని నివారిస్తుంది.
- source_word: בְּאֶבֶן
  choice: రాయితో
  rationale: ఉపకరణార్థక בְּ ను ‘తో’తో సహజంగా వ్యక్తపరచబడింది; אֶבֶן కు సాధారణ అర్థం ‘రాయి’.
- source_word: אוֹ בְאֶגְרֹף
  choice: గానీ పిడికిలితో గానీ
  rationale: אֶגְרֹף అంటే పిడికిలి. తెలుగు ప్రత్యామ్నాయ సమన్వయానికి ‘...తో గానీ ...తో గానీ’ సహజమైన నిర్మాణం.
- source_word: וְלֹא יָמוּת
  choice: అతడు చనిపోకుండా
  rationale: దెబ్బతిన్న వ్యక్తి మరణించలేదనే ఫలితాన్ని తెలుపుతుంది. తెలుగు వాక్యనిర్మాణంలో తదుపరి స్థితితో అనుసంధానించేందుకు ‘చనిపోకుండా’ సహజంగా ఉంది.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: మంచాన పడితే
  rationale: అక్షరార్థంగా ‘మంచానికి పడిపోవడం’; గాయం వల్ల మంచానికే పరిమితమవడం అనే నుడికార భావం. ‘మంచాన పడితే’ మూల రూపకాన్ని నిలుపుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
