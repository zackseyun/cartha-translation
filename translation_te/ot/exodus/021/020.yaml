source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: te
  text: ఒకవేళ ఒకడు తన పురుష బానిసనైనా స్త్రీ బానిసనైనా కర్రతో కొట్టి, ఆ బానిస అతని చేతికిందనే చనిపోతే, ఆ బానిసకు తప్పక ప్రతీకారం తీర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొట్టినవాడికి తప్పక శిక్ష విధించాలి.” హెబ్రీలో మరింత అక్షరార్థంగా, “అతనికోసం తప్పక ప్రతీకారం తీర్చబడాలి” అని ఉంది; ఇది బలాన్ని సూచించే న్యాయసూత్ర ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: ఒకవేళ
  rationale: ఇది నియమావళిలో షరతును పరిచయం చేసే పదబంధం. తెలుగు వాక్య నిర్మాణంలో ‘ఒకవేళ ... చనిపోతే’ అనేది సంధానార్థంతో సహా షరతును సహజంగా తెలియజేస్తుంది.
- source_word: יַכֶּה
  choice: కొట్టి
  rationale: נכה సాధారణంగా కొట్టడాన్ని సూచిస్తుంది; దాని పద్ధతిని అతిగా నిర్దిష్టం చేయకుండా, తరువాత వచ్చే కర్ర అనే సాధనంతో సహజంగా సరిపోతుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హెబ్రీ పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; న్యాయసూత్ర శైలిని ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עַבְדּוֹ
  choice: తన పురుష బానిసను
  rationale: ఈ న్యాయ సందర్భంలో עבד బంధిత బానిస స్థితిని సూచిస్తుంది; సాధారణ సేవకుడనే మృదువైన భావం రాకుండా ‘బానిస’ను, స్త్రీ బానిసతో ఉన్న స్పష్టమైన జతను నిలుపుటకు ‘పురుష’ను వాడాం.
- source_word: אֲמָתוֹ
  choice: స్త్రీ బానిసను
  rationale: אָמָה స్త్రీ బానిసను సూచిస్తుంది. ‘స్త్రీ బానిస’ ఆధునికంగా స్పష్టంగా ఉండి, ‘పురుష బానిస’తో సమాంతరతను కాపాడుతుంది.
- source_word: בַּשֵּׁבֶט
  choice: కర్రతో
  rationale: שבט సందర్భానుసారం కర్ర, దండం, రాజదండం అనే అర్థాలు కలిగి ఉంటుంది; ఇక్కడ కొట్టే సాధనం కావడంతో ‘కర్ర’ సహజమైన ఎంపిక.
- source_word: וּמֵת
  choice: చనిపోతే
  rationale: తెలుగు షరతు వాక్యంలో ఫలితంగా సంభవించే మరణాన్ని సహజంగా వ్యక్తం చేస్తుంది; తరువాతి న్యాయపరిణామానికి అనుసంధానిస్తుంది.
- source_word: תַּחַת יָדוֹ
  choice: అతని చేతిలోనే
  rationale: ‘అతని చేతికింద’ అనే హెబ్రీ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా దగ్గరగా నిలుపుతూ, యజమాని తక్షణ దెబ్బ లేదా అధీనంలోనే మరణించాడనే న్యాయ భావాన్ని కాపాడుతుంది.
- source_word: נָקֹם יִנָּקֵם
  choice: ఆ బానిస కోసం తప్పక ప్రతీకారం తీర్చాలి
  rationale: క్రియావిశేషక ధాతురూపం మరియు సమాపక క్రియ కలయికలోని బలమైన నిశ్చయాన్ని ‘తప్పక’ చూపిస్తుంది. నిఫాల్ రూపంలోని ‘ప్రతీకారం చేయబడాలి’ అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, శిక్ష యొక్క ఖచ్చిత రూపాన్ని నిర్ణయించదు.
theological_decisions:
- issue: נָקֹם יִנָּקֵםలోని న్యాయపరిణామ స్వభావం
  choice: ‘ఆ బానిస కోసం తప్పక ప్రతీకారం తీర్చాలి’ అని అనువదించడం
  alternative: ‘అతడు తప్పక శిక్షించబడాలి’
  rationale: హెబ్రీ వాక్యం ప్రతీకార న్యాయం తప్పక జరగాలని బలంగా చెబుతుంది; అయితే ఈ వచనంలోనే ఖచ్చితమైన శిక్షా విధానాన్ని పేర్కొనదు. అందువల్ల మూలంలోని తీవ్రతను నిలుపుతూ, దాని కంటే నిర్దిష్టమైన శిక్షను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయసూత్ర శైలిని ఉపయోగించాం. ‘సేవకుడు/సేవకురాలు’ అనే పదాలు బంధిత స్థితిని మసకబార్చవచ్చని ‘పురుష బానిస/స్త్రీ బానిస’ను ఎంచుకున్నాం. బాధితుని లింగాన్ని ఒకే సర్వనామంతో నిర్ణయించకుండా ‘ఆ బానిస’ అని పునరుక్తి చేశాం.
