revisions:
- from: ఒకవేళ ఒకడు తన పురుష బానిసనైనా స్త్రీ బానిసనైనా కర్రతో కొట్టి, ఆ బానిస అతని చేతిలోనే చనిపోతే, ఆ బానిస కోసం తప్పక ప్రతీకారం తీర్చాలి.[a]
