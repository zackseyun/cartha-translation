base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: te
  text: అయితే ఒకడు తన పొరుగువానికి విరోధంగా ఉద్దేశపూర్వకంగా ప్రవర్తించి, అతణ్ణి కపటంగా చంపడానికి ప్రయత్నిస్తే,[a][b] అతణ్ణి మరణానికి నా బలిపీఠం దగ్గరనుంచి కూడా తీసుకుపోవాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పొరుగువానికి విరోధంగా అహంకారంతో ప్రవర్తిస్తే.” హీబ్రూ క్రియ ఉద్దేశపూర్వకమైన, తెగించిన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కుటిలంగా” లేదా “మోసపూర్వకంగా.”
    reason: lexical_alternative
  - marker: c
    text: అంటే, అతడు బలిపీఠం వద్ద ఆశ్రయం కోరినా, మరణశిక్ష కోసం అక్కడనుంచి తీసుకుపోవాలి.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: అయితే ... పన్నితే
  rationale: ముందటి నియమానికి భిన్నమైన షరతును సూచించే అనుసంధానాన్ని సహజమైన తెలుగు న్యాయశైలిలో వ్యక్తం చేస్తుంది.
- source_word: יָזִד
  choice: పన్నాగం పన్నితే
  rationale: ఈ సందర్భంలో హిఫీల్ రూపం ఉద్దేశపూర్వకమైన, ముందుగా తలపెట్టిన చర్యను సూచిస్తుంది; ప్రమాదవశాత్తు జరిగిన హత్యతో దీనిని స్పష్టంగా వేరు చేస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ న్యాయసూత్ర రూపాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עַל רֵעֵהוּ
  choice: తన పొరుగువాణ్ణి ... అతనికి విరోధంగా
  rationale: רֵעַ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది; עַל చర్య అతనికి విరోధంగా మళ్లిందని తెలియజేస్తుంది.
- source_word: לְהָרְגוֹ
  choice: చంపడానికి
  rationale: הרג యొక్క ప్రత్యక్ష అర్థాన్ని ఇస్తుంది; అపరాధ స్వభావాన్ని క్రియలోనే ముందుగా 'హత్య చేయడం'గా తీర్మానించకుండా, ఉద్దేశం మరియు కపటాన్ని మిగతా పదాలు తెలియజేయనిస్తుందని ఈ ఎంపిక.
- source_word: בְעָרְמָה
  choice: కపటంతో
  rationale: తెలివైన మోసం, కుటిల ఉద్దేశం అనే భావాన్ని సంక్షిప్తంగా, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעִם מִזְבְּחִי
  choice: నా బలిపీఠం దగ్గరనుంచి కూడా
  rationale: מֵעִם బలిపీఠం సమీపం నుండి తొలగించడాన్ని సూచిస్తుంది; 'కూడా' అనే పదం పవిత్ర స్థలం అతనికి రక్షణ ఇవ్వదనే సందర్భోచిత బలాన్ని సహజంగా వెల్లడిస్తుంది.
- source_word: תִּקָּחֶנּוּ
  choice: అతణ్ణి తీసుకుపోవాలి
  rationale: రెండవ పురుష ఏకవచన న్యాయాజ్ఞ యొక్క బలాన్ని ఆధునిక తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది; సందర్భంలో ఇది బలిపీఠం వద్దనుండి తొలగించడాన్ని సూచిస్తుంది.
- source_word: לָמוּת
  choice: అతడు చనిపోయేలా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే హీబ్రూ క్రియావిశేష రూపానికి దగ్గరగా ఉంటుంది; ప్రధాన పాఠ్యంలోనే 'ఉరితీయడానికి' అని వ్యాఖ్యానాత్మకంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ఉద్దేశపూర్వకంగా చంపినవానికి బలిపీఠం ఆశ్రయ రక్షణ ఇస్తుందా?
  choice: ముందుగా పన్నాగం పన్ని, కపటంతో చంపినవాణ్ణి బలిపీఠం దగ్గరనుంచి కూడా తీసుకుపోవాలని వచనం చెబుతుంది.
  alternative: బలిపీఠం కేవలం నిందితుణ్ణి విచారణకు తీసుకెళ్లే స్థలమని, ఆశ్రయ హక్కు విషయంపై వచనం ప్రత్యేకంగా దృష్టి పెట్టడం లేదని అర్థం చేసుకోవచ్చు.
  rationale: '''నా బలిపీఠం దగ్గరనుంచి'' అనే మాటలు ఈ న్యాయ సందర్భంలో పవిత్ర స్థలం ఉద్దేశపూర్వక హంతకుణ్ణి కాపాడదని బలంగా సూచిస్తాయి; అనువాదం ఆ సూచనను నిలుపుతూ ప్రధాన పాఠ్యంలో అదనపు సిద్ధాంత వివరణను చేర్చదు.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలి ఉపయోగించబడింది. 'పన్నాగం పన్నితే' ఉద్దేశపూర్వకతను, 'కపటంతో' మోసపూరిత విధానాన్ని వేరువేరుగా నిలుపుతాయి. పాదసూచికల గుర్తులు సంబంధిత భావాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
