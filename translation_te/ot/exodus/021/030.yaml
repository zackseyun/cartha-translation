source:
  edition: WLC
  text: אִם כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑י/ו וְ/נָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔/וֹ כְּ/כֹ֥ל אֲשֶׁר יוּשַׁ֖ת עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: te
  text: అతనిపై విమోచన ధనం విధించబడితే,[a] అతనిపై ఎంత విధించబడుతుందో అంత మొత్తాన్ని తన ప్రాణానికి విమోచన వెలగా అతడు చెల్లించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అతనిపై విమోచన చెల్లింపు విధించబడితే ... తన ప్రాణానికి విమోచన వెలను చెల్లించాలి.” హెబ్రీలో పరస్పర సంబంధమున్నా వేర్వేరు రెండు పదాలు ఉన్నాయి: כֹּפֶר (‘విమోచన ధనం’) మరియు פִּדְיֹן (‘విమోచన వెల’).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: విధించబడితే
  rationale: ఇది ముందున్న మరణశిక్ష బాధ్యతకు ప్రత్యామ్నాయమైన షరతును పరిచయం చేస్తుంది; తెలుగు ‘-తే’ రూపం సహజమైన న్యాయపరమైన షరతును తెలియజేస్తుంది.
- source_word: כֹּפֶר
  choice: విమోచన ధనం
  rationale: శిక్షను తప్పించి విడుదల పొందేందుకు చెల్లించే మొత్తాన్ని సూచిస్తుంది. ‘పరిహారం’ కంటే విడుదల భావాన్ని కాపాడుతూ, ఆరాధనా సంబంధమైన ప్రాయశ్చిత్త భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יוּשַׁת עָלָיו
  choice: అతనిపై ... విధించబడితే
  rationale: שׁית యొక్క కర్మణి రూపం మరియు עַל కలసి న్యాయబద్ధమైన బాధ్యతను ఒకరిపై విధించడాన్ని సూచిస్తాయి.
- source_word: וְנָתַן
  choice: అతడు చెల్లించాలి
  rationale: న్యాయ నియమంలోని తప్పనిసరి పరిణామాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ఇవ్వాలి’ కన్నా ధన చెల్లింపు సందర్భానికి ఇది స్పష్టంగా సరిపోతుంది.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: తన ప్రాణ విమోచన వెలగా
  rationale: פִּדְיֹן అనే విడుదలకు చెల్లించే వెల భావాన్ని కాపాడుతుంది; נֶפֶשׁ ఈ న్యాయ సందర్భంలో అమూర్తమైన ఆత్మను కాక వ్యక్తి ప్రాణాన్ని సూచిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: అతనిపై ఎంత విధించబడుతుందో అంత మొత్తాన్ని
  rationale: విధించిన మొత్తం పూర్తిగా చెల్లించాలనే כֹּל యొక్క సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పునరుక్త న్యాయపరమైన ‘విధించు’ పదబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: మరణశిక్ష బాధ్యత సందర్భంలో చెల్లింపు స్వభావం
  choice: כֹּפֶר ను ‘విమోచన ధనం’గా, פִּדְיֹן ను ‘ప్రాణ విమోచన వెల’గా వేరు చేసి అనువదించడం
  alternative: రెండు పదాలనూ కేవలం ‘జరిమానా’ లేదా ‘పరిహారం’గా అనువదించడం; లేదా బలమైన ప్రాయశ్చిత్త పరిభాషను ఉపయోగించడం
  rationale: ఇక్కడ చెల్లింపు, వర్తించవలసిన మరణశిక్షకు బదులుగా దోషి ప్రాణాన్ని విడిపించే న్యాయపరమైన మొత్తం. హెబ్రీ పదాల మధ్య ఉన్న సంబంధాన్నీ స్వల్ప భేదాన్నీ నిలుపుతూ, నైతిక నిర్దోషిత్వం లేదా ఆరాధనా సంబంధమైన ప్రాయశ్చిత్త సిద్ధాంతాన్ని వచనంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయపరమైన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఆత్మ’కు బదులుగా సందర్భానుసారంగా ‘ప్రాణం’ వాడబడింది. మూలంలోని రెండు విమోచన పదాల భేదాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలుపుతూ, ‘చెల్లించాలి’ ద్వారా విధి భావం స్పష్టం చేయబడింది.
