  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: te
  text: ఒకవేళ అతని యజమాని అతనికి ఒక భార్యను ఇస్తే, ఆమె అతనికి కుమారులనైనా కుమార్తెలనైనా కనితే, ఆ భార్యా ఆమె పిల్లలూ ఆమె యజమానికే చెందుతారు; అతడు ఒక్కడే బయటికి వెళ్లాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, తన సేవాకాలంలో యజమాని ఇచ్చిన భార్యను, ఆమె పిల్లలను వెంట తీసుకెళ్లకుండా అతడు ఒక్కడే బయటికి వెళ్లాలి.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: అయితే (షరతును తెలిపే ‘కంటే’ నిర్మాణం)
  rationale: న్యాయపరమైన షరతును తెలుగులో సహజంగా ‘ఇచ్చి... కంటే’ అనే నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנָיו
  choice: అతని యజమాని
  rationale: ఈ బానిసత్వపు న్యాయ సందర్భంలో అధికార, యాజమాన్య సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; దైవసంబంధమైన ‘ప్రభువు’ భావాన్ని రానివ్వదు.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: అతనికి ఒక భార్యను ఇచ్చి
  rationale: אִשָּׁה అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉన్నా, ఇక్కడి దాంపత్య సంబంధం మరియు సంతానం ప్రస్తావన కారణంగా ‘భార్య’ సరైనది.
- source_word: וְיָלְדָה לוֹ
  choice: ఆమె అతనికి ... కంటే
  rationale: పిల్లలను కనడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, לוֹ లోని ‘అతనికి’ భావాన్ని నిలుపుతుంది.
- source_word: בָנִים אוֹ בָנוֹת
  choice: కుమారులనైనా కుమార్తెలనైనా
  rationale: మూలంలోని మగ, ఆడ సంతానాల స్పష్టమైన ప్రస్తావనను సాధారణ ‘పిల్లలు’గా కుదించకుండా నిలుపుతుంది.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: ఆ భార్యా ఆమె పిల్లలూ
  rationale: ముందటి ‘భార్య’ పదంతో అనుగుణతను కాపాడి, ఇద్దరినీ వాక్య కర్తలుగా స్పష్టంగా చూపుతుంది.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: ఆమె యజమానికే చెందుతారు
  rationale: న్యాయపరమైన స్వాధీన/యాజమాన్య సంబంధాన్ని మెత్తబరచకుండా స్పష్టంగా తెలుపుతుంది. సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: וְהוּא יֵצֵא
  choice: అతడు ... వెళ్లిపోవాలి
  rationale: ఈ న్యాయ సందర్భంలో సేవాకాలం ముగిసినప్పుడు అతని నిష్క్రమణను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בְגַפּוֹ
  choice: ఒక్కడే
  rationale: భార్యాపిల్లలు తోడులేకుండా ఒంటరిగా వెళ్లడం అనే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: బానిసత్వ సంబంధిత న్యాయ పరిభాష
  choice: ‘యజమాని’, ‘చెందుతారు’ అనే స్పష్టమైన యాజమాన్య భాషను ఉపయోగించడం
  alternative: ‘ప్రభువు’, ‘ఆమె యజమాని దగ్గరే ఉంటారు’ వంటి భాషను ఉపయోగించడం
  rationale: మూలపాఠంలోని కఠినమైన న్యాయ, యాజమాన్య వాస్తవాన్ని మెత్తబరచకుండా ప్రతిబింబిస్తుంది; అదే సమయంలో అదనపు నైతిక లేదా మతపరమైన వ్యాఖ్యానాన్ని వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, న్యాయవాక్యానికి తగిన గంభీరతతోనూ ఉంది. ‘చెందుతారు’ అనే పదం మూలంలోని యాజమాన్య సంబంధాన్ని ఉద్దేశపూర్వకంగా మెత్తబరచదు. ప్రధాన వచనంలోని [a] గుర్తు సంబంధిత పాదటిప్పణికి సరిపోతుంది.
