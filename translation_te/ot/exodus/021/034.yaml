id: EXO.21.34
reference: Exodus 21:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: te
  text: గోతి యజమాని పరిహారంగా ఆ పశువు యజమానికి డబ్బు చెల్లించాలి; చనిపోయిన పశువు గోతి యజమానిదవుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: ఆ గోతికి యజమాని
  rationale: ఈ న్యాయ సందర్భంలో బַּעַל బాధ్యతగల యజమానిని, הַבּוֹר పశువు పడిన గోతిని సూచిస్తాయి. ‘గోతికి యజమాని’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יְשַׁלֵּם
  choice: నష్టపరిహారం చెల్లించాలి
  rationale: שׁלם పియేల్ రూపం ఇక్కడ నష్టాన్ని భర్తీ చేయడమనే న్యాయార్థాన్ని కలిగిస్తుంది; కేవలం ‘చెల్లించాలి’ కంటే ఈ ఎంపిక ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: పదశః ‘వెండి’ అయినప్పటికీ, ఈ న్యాయ సందర్భంలో ఇది ద్రవ్య చెల్లింపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘డబ్బు’ సహజంగా అర్థమవుతుంది.
- source_word: יָשִׁיב לִבְעָלָיו
  choice: ఆ పశువు యజమానికి ... చెల్లించాలి
  rationale: יָשִׁיב పదశః తిరిగి ఇవ్వడం లేదా పునరుద్ధరించడం అనే భావం కలిగినా, ఇక్కడ నష్టపోయిన పశువు విలువను దాని యజమానికి చెల్లించడాన్ని సూచిస్తుంది. సూచ్యమైన పశువును తెలుగులో స్పష్టం చేశాం.
- source_word: וְהַמֵּת
  choice: చనిపోయిన పశువు
  rationale: హీబ్రూలో పదశః ‘చనిపోయినది’; పూర్వసందర్భం ప్రకారం అది ఎద్దు లేదా గాడిద వంటి పశువు. ‘పశువు’ను చేర్చడం సూచ్యార్థాన్ని మాత్రమే స్పష్టం చేస్తుంది.
- source_word: יִהְיֶה לוֹ
  choice: అతనిదవుతుంది
  rationale: ఈ వాక్యభాగం చనిపోయిన పశువు గోతికి యజమానికే చెందుతుందని సూచిస్తుంది. ‘అతనిదవుతుంది’ సంక్షిప్తంగా, సహజంగా స్వామ్యాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יִהְיֶה לוֹ లోని పురుష ఏకవచన సర్వనామపు పూర్వపదం
  choice: ‘అతను’ గోతికి యజమానిని సూచించేలా అనువదించాం.
  alternative: సర్వనామాన్ని మరింత స్పష్టంగా ‘గోతి యజమానిదవుతుంది’ అని పునరుక్తి చేయవచ్చు.
  rationale: వాక్య నిర్మాణం మరియు పరిహార నియమపు తర్కం ప్రకారం మృత పశువు డబ్బు చెల్లించిన గోతి యజమానికి చెందుతుంది; అయినప్పటికీ మూలంలోని సంక్షిప్త సర్వనామ రూపాన్ని అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. విధ్యర్థక హీబ్రూ అసంపూర్ణ క్రియలను ‘చెల్లించాలి’గా వ్యక్తం చేశాం. ఈ వచనానికి అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత పాదటీపులు లేవు.
