revisions:
- from: ఆ గోతికి యజమాని నష్టపరిహారం చెల్లించాలి; ఆ పశువు యజమానికి డబ్బు చెల్లించాలి, చనిపోయిన పశువు అతనిదవుతుంది.
  to: గోతి యజమాని పరిహారంగా ఆ పశువు యజమానికి డబ్బు చెల్లించాలి; చనిపోయిన పశువు గోతి యజమానిదవుతుంది.
  rationale: 'The revision joins restitution and monetary payment into one legally coherent expression and makes the final ownership assignment explicit. It retains the Hebrew''s plain legal meaning: the pit owner pays the animal''s owner, while the dead animal becomes the pit owner''s property.'
  reviewer_model: gpt-5.6-terra
