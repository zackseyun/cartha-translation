  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: te
  text: ఒక ఎద్దు ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ కొమ్ములతో పొడిచి, ఆ వ్యక్తి చనిపోతే, ఆ ఎద్దును తప్పకుండా రాళ్లతో కొట్టి చంపాలి; దాని మాంసాన్ని తినకూడదు. అయితే ఎద్దు యజమాని నిర్దోషిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాధ్యుడు కాడు,” లేదా “శిక్షకు పాత్రుడు కాడు.” ఇక్కడి హీబ్రూ పదం נָקִי (నాకీ) ఈ సందర్భంలో యజమాని దోషం లేదా శిక్షాభారం నుంచి విముక్తుడని మాత్రమే చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ఒకవేళ అనే భావాన్ని సహజమైన షరతు వాక్య నిర్మాణంతో వ్యక్తపరచడం
  rationale: ఇది ఒక సందర్భాధారిత న్యాయనిబంధనను పరిచయం చేస్తుంది. తెలుగులో ‘ఒక ఎద్దు... పొడిచి... చనిపోతే’ అనే నిర్మాణం ఆ షరతును సహజంగా తెలియజేస్తుంది.
- source_word: יִגַּח
  choice: కొమ్ములతో పొడిచి
  rationale: ఈ క్రియ సాధారణంగా కొట్టడాన్ని కాక, జంతువు కొమ్ములతో కుమ్మడం లేదా పొడవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘కొమ్ములతో పొడిచి’ అని అనువదించబడింది.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: న్యాయ సందర్భంలోని ఏకవచన పశువును తెలుగులో సహజంగా, సంప్రదాయబద్ధంగా సూచించే పదం.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: ఒక పురుషుణ్ణిగానీ స్త్రీనిగానీ
  rationale: హీబ్రూ మూలం రెండు లింగాలనూ స్పష్టంగా పేర్కొంటుంది; ఆ ప్రత్యేకతను నిలుపుకుంది.
- source_word: וָמֵת
  choice: ఆ వ్యక్తి చనిపోతే
  rationale: హీబ్రూ ఏకవచన క్రియ కొమ్ములతో పొడవబడిన మనిషిని సూచిస్తుంది. పురుషుడు లేదా స్త్రీ ఇద్దరికీ వర్తించేలా తెలుగులో ‘ఆ వ్యక్తి’ అని స్పష్టీకరించబడింది.
- source_word: סָקוֹל יִסָּקֵל
  choice: తప్పకుండా రాళ్లతో కొట్టి చంపాలి
  rationale: అనంతక్రియతో కూడిన పరిమిత క్రియ ఆజ్ఞను బలపరుస్తుంది. ‘తప్పకుండా’ ఆ ఉద్ఘాటనను, ‘చంపాలి’ శిక్ష యొక్క ఫలితాన్ని స్పష్టంగా తెలియజేస్తాయి.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: దాని మాంసాన్ని తినకూడదు
  rationale: హీబ్రూ నిషేధాత్మక కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగు న్యాయనిషేధంగా అందిస్తుంది.
- source_word: וּבַעַל הַשּׁוֹר
  choice: అయితే ఎద్దు యజమాని
  rationale: בעל ఇక్కడ చట్టపరమైన యజమానిని సూచిస్తుంది. ముందు ఉన్న జంతుశిక్షకు భిన్నంగా యజమాని స్థితిని చూపేందుకు ‘అయితే’ సహజమైన విరుద్ధ సంబంధాన్ని ఇస్తుంది.
- source_word: נָקִי
  choice: నిర్దోషిగా ఉంటాడు
  rationale: ఈ న్యాయ సందర్భంలో శిక్ష లేదా బాధ్యత నుంచి విముక్తుడనే భావం ఉంది. ‘నిర్దోషి’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది; పదం సూచించే బాధ్యతరాహిత్య విస్తృతిని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో ఎద్దు యజమాని యొక్క న్యాయస్థితి
  choice: యజమాని ‘నిర్దోషిగా ఉంటాడు’ అని పేర్కొని, ఈ సందర్భంలో శిక్ష లేదా బాధ్యత నుంచి విముక్తుడనే భావాన్ని ఉంచడం
  alternative: యజమాని ‘బాధ్యుడు కాడు’ లేదా ‘శిక్షకు పాత్రుడు కాడు’ అని మరింత నిర్దిష్టంగా చెప్పడం
  rationale: నָקִי అనే హీబ్రూ న్యాయపదం నైతిక నిర్దోషిత్వం, పౌర బాధ్యత లేకపోవడం, లేదా ఒక నిర్దిష్ట శిక్ష నుంచి మినహాయింపు—వీటిలో ఒక్కదానికే పరిమితం చేయదు. తరువాతి వచనాల్లో నిర్లక్ష్యానికి సంబంధించిన అర్హతలు వస్తాయి కాబట్టి, ఇక్కడ మూలంలోని విస్తృతిని పాదసూచికతో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే న్యాయశైలిని వాడింది. ‘రాళ్లతో కొట్టి చంపాలి’ ఆజ్ఞ తీవ్రతను స్పష్టంగా తెలియజేస్తుంది; ‘ఆ వ్యక్తి’ పురుషుడు లేదా స్త్రీ అనే రెండు అవకాశాలకూ సరిపోతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
