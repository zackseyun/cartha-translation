source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: te
  text: అయితే, అతడు ఒకటి రెండు రోజులు బ్రతికి ఉంటే, అతని కోసం ప్రతీకారం తీర్చకూడదు[a]; ఎందుకంటే అతడు అతని యజమాని సొమ్ము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యజమానిని శిక్షించకూడదు.” హీబ్రూ పదం మరింత నిర్దిష్టంగా ప్రతీకారం లేదా న్యాయపరమైన ప్రతిచర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతడు అతని సొమ్ము.” ఇది దాసుడు తన యజమానికి కలిగిన ఆర్థిక విలువను వ్యక్తం చేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి న్యాయనియమానికి మినహాయింపు లేదా పరిమితిని సూచించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: ఒకటి రెండు రోజులు
  rationale: హీబ్రూ కాలవ్యవధిని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: יַעֲמֹד
  choice: బ్రతికి ఉంటే
  rationale: అక్షరార్థంగా ‘నిలిచి ఉంటే’; ఈ న్యాయసందర్భంలో దెబ్బల తర్వాత సజీవంగా కొనసాగడాన్ని సూచిస్తుంది, పూర్తిగా కోలుకోవడాన్ని కాదు.
- source_word: לֹא יֻקַּם
  choice: అతని కోసం ప్రతీకారం తీర్చకూడదు
  rationale: נקם హోఫల్ రూపంలోని ప్రతీకార లేదా న్యాయపరమైన ప్రతిచర్య భావాన్ని సాధారణ ‘శిక్షించకూడదు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי כַסְפּוֹ הוּא
  choice: ఎందుకంటే అతడు అతని యజమాని సొమ్ము
  rationale: ‘అతడు అతని వెండి/సొమ్ము’ అనే కఠినమైన ఆర్థిక కారణాన్ని మృదువుపరచకుండా అందిస్తుంది; తెలుగులో సర్వనామ సందిగ్ధత తగ్గేందుకు ‘యజమాని’ని స్పష్టం చేసింది.
theological_decisions:
- issue: దాసత్వ న్యాయంలోని ఆర్థిక కారణం
  choice: ‘అతడు అతని యజమాని సొమ్ము’ అనే కఠినమైన కారణాన్ని నిలుపడం
  alternative: ‘అతడు అతని ఆస్తి’ లేదా ‘నష్టం యజమానిదే’
  rationale: మూల హీబ్రూ వ్యక్తి యొక్క ఆర్థిక విలువను నిర్దాక్షిణ్యంగా పేర్కొంటుంది. నైతిక అసౌకర్యాన్ని తగ్గించేందుకు దానిని మృదువుగా పునర్వ్యాఖ్యానించలేదు.
- issue: לֹא יֻקַּם యొక్క న్యాయపరమైన భావం
  choice: ‘అతని కోసం ప్రతీకారం తీర్చకూడదు’
  alternative: ‘యజమానిని శిక్షించకూడదు’
  rationale: మూలపదం సాధారణ శిక్షకన్నా ప్రతీకారం లేదా న్యాయపరమైన ప్రతిచర్యను సూచిస్తుంది. కర్తను అనవసరంగా నిర్దిష్టం చేయకుండా బాధితుని తరఫున ప్రతీకారం జరగదనే భావాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలి. ‘దాసుడు’ అనే నామవాచకం ఈ వచనంలో మళ్లీ చేర్చకుండా, ముందటి సందర్భంలోని పురుష ఏకవచన సూచనను ‘అతడు’గా నిలిపింది. ‘యజమాని’ని అర్థస్పష్టత కోసం చేర్చినా, మూలంలోని కఠినమైన ‘సొమ్ము’ రూపకాన్ని అలాగే ఉంచింది.
