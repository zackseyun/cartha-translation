id: EXO.21.36
reference: Exodus 21:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: te
  text: లేదా, ఆ ఎద్దుకు ఇంతకుముందు నుంచే పొడిచే అలవాటు ఉందని తెలిసి ఉండి[a], దాని యజమాని దానిని అదుపులో ఉంచకపోతే, అతడు ఆ ఎద్దుకు బదులుగా ఒక ఎద్దును తప్పకుండా చెల్లించాలి; చనిపోయిన ఎద్దు అతనిదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’; ఆ ఎద్దు ఇంతకుముందే ఇలా పొడిచే స్వభావాన్ని చూపిందని సూచించే నుడికారం.'
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  choice: లేదా
  rationale: మునుపటి వచనంలోని పరిస్థితికి ప్రత్యామ్నాయమైన న్యాయపరిస్థితిని పరిచయం చేసే వియోజక పదంగా అనువదించబడింది.
- source_word: נוֹדַע כִּי
  choice: అని తెలిసినా
  rationale: נוֹדַע యొక్క నిఫాల్ నిష్క్రియార్థాన్ని ‘తెలిసింది’ అనే భావంతో నిలుపుతూ, తరువాతి యజమాని నిర్లక్ష్యంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: שׁוֹר נַגָּח
  choice: ఆ ఎద్దుకు … పొడిచే అలవాటు ఉంది
  rationale: నַגָּח ఒక్కసారి పొడిచినదాన్ని కాక, పొడిచే స్వభావం లేదా పూర్వపు అలవాటు కలిగిన ఎద్దును సూచిస్తుంది.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: ఇంతకుముందు నుంచే
  rationale: అక్షరార్థంగా ‘నిన్నటి నుంచీ మొన్నటి నుంచీ’ అనే హీబ్రూ నుడికారం; ఆధునిక తెలుగులో పూర్వం నుంచే ఈ ప్రవర్తన కనిపించిందనే న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: దాన్ని అదుపులో ఉంచకపోతే
  rationale: కేవలం కాపలా చూడటం కంటే, ప్రమాదకరమైన ఎద్దు ఇతరులకు హాని చేయకుండా నిరోధించాలనే సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: తప్పకుండా చెల్లించాలి
  rationale: క్రియానామం-క్రియ కలయికలోని బలమైన, తప్పనిసరి న్యాయబాధ్యతను ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: ఎద్దుకు బదులుగా ఎద్దును
  rationale: תַּחַת లోని ప్రత్యామ్నాయ పరిహార భావాన్ని మూలంలోని న్యాయసూత్ర రూపానికి దగ్గరగా ఉంచుతుంది.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: చనిపోయిన ఎద్దు అతనిదవుతుంది
  rationale: ‘చనిపోయినది’ అని మాత్రమే ఉంచితే తెలుగులో అస్పష్టత కలగవచ్చు; సందర్భానుసారం ఎద్దును స్పష్టంచేస్తూ, అది బాధ్యుడైన యజమానికి చెందుతుందనే ఏకవచన నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి స్వరాన్ని గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. ‘అదుపులో ఉంచడం,’ ‘తప్పకుండా చెల్లించాలి’ వంటి పదబంధాలు మూలంలోని నిర్లక్ష్యం మరియు తప్పనిసరి పరిహార భావాలను సహజంగా వ్యక్తపరుస్తాయి.
