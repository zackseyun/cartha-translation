id: EXO.21.17
reference: Exodus 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: te
  text: తన తండ్రిని గానీ తన తల్లిని గానీ శపించేవాడు తప్పకుండా మరణశిక్ష పొందాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: శపించేవాడు
  rationale: מְקַלֵּל అనే క్రియావిశేషణ రూపం న్యాయవాక్యంలో ఒక సాధారణ నేరస్థుని వర్గాన్ని సూచిస్తుంది. పియేల్ రూపంలోని קלל ఇక్కడ దూషించడం కంటే శాపం పలకడం అనే భావాన్ని ప్రధానంగా ఇస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రిని
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని తెలుగులో కర్తను తిరిగి సూచించే సహజమైన ‘తన’తో వ్యక్తం చేశాం.
- source_word: וְאִמּוֹ
  choice: గానీ తన తల్లిని గానీ
  rationale: హీబ్రూ וְ రూపపరంగా ‘మరియు’ అయినా, ఈ న్యాయసూత్రంలో తండ్రి లేదా తల్లి—వారిలో ఎవరికైనా వర్తించే విభాజక భావం ఉంది. తెలుగులో ‘గానీ ... గానీ’ ఆ పరిధిని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  rationale: క్రియానామక సంపూర్ణరూపం మరియు హోఫాల్ క్రియ కలయిక నిశ్చితమైన, విధించబడే మరణదండనను సూచిస్తుంది. ‘మరణశిక్ష పొందాలి’ అనేది కేవలం చనిపోవడం కాక న్యాయపరమైన శిక్ష అని స్పష్టం చేస్తుంది; ‘తప్పకుండా’ హీబ్రూ ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: తల్లిదండ్రుల జంటకు వర్తించే న్యాయపరమైన పరిధి
  choice: తండ్రిని గానీ తల్లిని గానీ శపించడం—వారిలో ఎవరి విషయంలోనైనా ఈ నేరం వర్తించేలా అనువదించడం.
  alternative: రూపపరంగా ‘తన తండ్రిని మరియు తన తల్లిని’ అని అనువదించడం.
  rationale: హీబ్రూ సంధి ‘మరియు’ అయినప్పటికీ, సందర్భంలోని న్యాయసూత్రం తల్లిదండ్రులలో ప్రతి ఒక్కరినీ విడివిడిగా రక్షిత వర్గంగా చూస్తుంది. ‘గానీ ... గానీ’ ఈ విభాజక భావాన్ని తెలుగులో తప్పుదారి పట్టించకుండా తెలియజేస్తుంది.
- issue: మరణదండన సూత్రాన్ని వ్యక్తం చేయడం
  choice: ‘తప్పకుండా మరణశిక్ష పొందాలి’ అని న్యాయపరమైన విధింపుగా అనువదించడం.
  alternative: ‘తప్పకుండా చనిపోవాలి’ లేదా ‘నిశ్చయంగా చనిపోతాడు.’
  rationale: מוֹת יוּמָת లోని హోఫాల్ రూపం విధించబడే శిక్షను సూచిస్తుంది; ఇది సహజ మరణం గురించిన ప్రకటన కాదు. ఎంపిక చేసిన రూపం న్యాయసంబంధమైన బలాన్నీ ఉద్ఘాటననూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘శపించేవాడు’ మూలంలోని నేర స్వభావాన్ని నిలుపుతుంది; ‘మరణశిక్ష పొందాలి’ న్యాయ తీర్పును స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠంలోనే విభాజక భావం స్పష్టంగా ఉన్నందున పాదటిప్పణి అవసరం లేదు.
