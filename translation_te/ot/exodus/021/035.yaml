source:
  edition: WLC
  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: te
  text: ఒకరి ఎద్దు అతని పొరుగువాని ఎద్దును పొడిచి[a], అది చనిపోతే, వారు బతికివున్న ఎద్దును అమ్మి, దాని అమ్మకపు సొమ్మును[b] పంచుకోవాలి; చనిపోయిన దానిని[c] కూడా పంచుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొట్టి”; హీబ్రూ క్రియ ఎద్దు బలంగా కొట్టడాన్ని లేదా పొడవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దాని వెండిని/సొమ్మును”; అంటే బతికివున్న ఎద్దును అమ్మగా వచ్చిన సొమ్మును.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “చనిపోయిన దానిని”; అంటే చనిపోయిన ఎద్దును.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ఒకరి… చనిపోతే
  rationale: హీబ్రూ న్యాయనియమంలోని షరతును తెలుగులో సహజమైన ‘-తే’ నిర్మాణంతో వ్యక్తం చేస్తుంది; వాక్యారంభంలోని וְ ను విడిగా ‘మరియు’ అని అనువదించడం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: יִגֹּף
  choice: పొడిచి
  rationale: ఎద్దు మరో ఎద్దుపై చేసే బలమైన దాడిని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది; హీబ్రూ క్రియకు ‘కొట్టడం’ అనే విస్తృత అర్థం కూడా ఉండగలదని పాదటిప్పణి సూచిస్తుంది.
- source_word: שׁוֹר אִישׁ
  choice: ఒకరి ఎద్దు
  rationale: యాజమాన్యాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שׁוֹר רֵעֵהוּ
  choice: అతని పొరుగువాని ఎద్దు
  rationale: רֵעַ లోని పొరుగువాడు/తోటివాడు అనే సంబంధార్థాన్ని నిలుపుతూ, న్యాయసందర్భంలో యాజమాన్యాన్ని స్పష్టపరుస్తుంది.
- source_word: וָמֵת
  choice: అది చనిపోతే
  rationale: దెబ్బకు అనుసరించే ఫలితాన్ని షరతు వాక్యంలో సహజంగా కలుపుతుంది; కారణత్వాన్ని మూలం కంటే ఎక్కువగా నిర్ధారించదు.
- source_word: וּמָכְרוּ
  choice: వారు… అమ్మి
  rationale: షరతు నెరవేరిన తర్వాత అనుసరించాల్సిన న్యాయపద్ధతిని తెలుగులో వరుసక్రియగా సహజంగా అందిస్తుంది.
- source_word: הַשּׁוֹר הַחַי
  choice: బతికివున్న ఎద్దు
  rationale: దాడి తరువాత జీవించి ఉన్న జంతువును స్పష్టంగా సూచించే సహజ తెలుగు రూపం.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: దాని అమ్మకపు సొమ్మును పంచుకోవాలి
  rationale: כַּסְפּוֹ అక్షరార్థంగా ‘దాని వెండి/సొమ్ము’; ఇక్కడ అమ్మిన ఎద్దుకు వచ్చిన సొమ్మును సూచిస్తుందని సందర్భం స్పష్టం చేస్తుంది.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: చనిపోయిన దానిని కూడా పంచుకోవాలి
  rationale: ‘శవం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, హీబ్రూలోని ‘చనిపోయినది’ అనే సంక్షిప్త రూపాన్ని నిలుపుతుంది; సందర్భం అది చనిపోయిన ఎద్దని తెలియజేస్తుంది.
