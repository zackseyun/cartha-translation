  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: te
  text: అతడు ఒంటరిగా వస్తే[a], ఒంటరిగానే బయటికి వెళ్లాలి; అతడు వివాహితుడైతే[b], అతని భార్య అతనితో పాటు బయటికి వెళ్లాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది ఒక జాతీయ ప్రయోగం; తోడు ఎవరూ లేకుండా ఒంటరిగా వచ్చాడనే అర్థం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఒక స్త్రీకి భర్తగా ఉన్నవాడైతే’; భావం ‘వివాహితుడైతే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: ఒంటరిగా
  rationale: ఈ హీబ్రూ జాతీయ ప్రయోగం తోడు ఎవరూ లేకుండా, తనంతట తానుగా ఉండడాన్ని సూచిస్తుంది. తెలుగు న్యాయ సందర్భంలో ‘ఒంటరిగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יָבֹא
  choice: సేవలోకి వస్తే
  rationale: క్రియకు ప్రాథమికంగా ‘వస్తే’ అనే అర్థం ఉంది; సందర్భం హెబ్రీయ దాసుడు సేవలో ప్రవేశించడమైనందున ‘సేవలోకి’ అని స్పష్టం చేయడం తెలుగు పాఠకునికి న్యాయ నియమాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది.
- source_word: יֵצֵא
  choice: బయటికి వెళ్లాలి
  rationale: ఈ సందర్భంలో సేవ నుండి వెళ్లిపోవడం, అంటే విడుదల కావడం ఉద్దేశం. ‘బయటికి వెళ్లాలి’ అనే రూపం ‘సేవలోకి వస్తే’తో ఉన్న మూలభాషా సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בַּעַל אִשָּׁה
  choice: వివాహితుడైతే
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీకి భర్త’ అనే సంబంధపదబంధమైనా, ఇది వివాహమైన పురుషుణ్ణి సూచించే హీబ్రూ ప్రయోగం. ‘వివాహితుడైతే’ ఆధునిక తెలుగులో సహజమైన, ఖచ్చితమైన రూపం.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: అతని భార్య అతనితో పాటు బయటికి వెళ్లాలి
  rationale: స్త్రీలింగ ఏకవచన క్రియ ‘అతని భార్య’తో సరిపోతుంది. ‘అతనితో పాటు’ సహవెళ్లడాన్ని స్పష్టంగా తెలియజేస్తూ మూలంలోని న్యాయ ప్రకటనను నిలుపుతుంది.
