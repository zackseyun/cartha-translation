  edition: WLC
  text: אִם בְּ/גַפּ֥/וֹ יָבֹ֖א בְּ/גַפּ֣/וֹ יֵצֵ֑א אִם בַּ֤עַל אִשָּׁה֙ ה֔וּא וְ/יָצְאָ֥ה אִשְׁתּ֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
