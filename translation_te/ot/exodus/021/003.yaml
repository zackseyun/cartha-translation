  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ శైలి వాడబడింది. ‘వస్తే—వెళ్లాలి’ అనే మూలంలోని సమాంతర నిర్మాణం సాధ్యమైనంత వరకు నిలుపబడింది; సందర్భ స్పష్టత కోసం ‘సేవలోకి’ చేర్చబడింది.
