  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: te
  text: ఎవరైనా తన దాసుని పన్నును గానీ, తన దాసి పన్నును గానీ ఊడగొడితే, ఆ పన్నుకు బదులుగా ఆ దాసుణ్ణి లేదా దాసిని స్వేచ్ఛగా విడుదల చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘విడుదల చేయాలి’ అనే క్రియకు పురుష ఏకవచన కర్మప్రత్యయం ఉంది; అయితే ముందున్న నియమం దాసునికైనా దాసికైనా వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ఒకడు … ఊడగొడితే
  rationale: మునుపటి న్యాయనియమాన్ని కొనసాగించే షరతును తెలుగులో సహజమైన ‘ఒకడు … అయితే’ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: שֵׁן
  choice: పన్ను
  rationale: హీబ్రూ ఏకవచన శరీరావయవ పదాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: עַבְדּוֹ
  choice: తన దాసుని
  rationale: ఈ నిబంధనలోని బంధిత సామాజిక-చట్టపరమైన స్థితిని ‘సేవకుడు’ కంటే ‘దాసుడు’ స్పష్టంగా తెలియజేస్తుంది; పురుషలింగాన్ని కూడా నిలుపుతుంది.
- source_word: אֲמָתוֹ
  choice: తన దాసి
  rationale: పురుష దాసునికి జతగా ఉన్న స్త్రీలింగ బంధిత వ్యక్తిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: יַפִּיל
  choice: కొట్టి ఊడగొడితే
  rationale: నఫల్ హిఫీల్ రూపంలోని ‘రాలిపోయేలా చేయడం’ అనే భావాన్ని గాయం సందర్భంలో సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לַחָפְשִׁי
  choice: స్వతంత్రునిగా
  rationale: బంధిత స్థితి నుంచి స్వేచ్ఛా స్థితిలోకి విడుదలను చట్టపరంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְשַׁלְּחֶנּוּ
  choice: విడుదల చేయాలి
  rationale: ఈ న్యాయసందర్భంలో שלח సూచించే విడుదలను, విధిని తెలిపే తెలుగు శైలిలో వ్యక్తపరుస్తుంది.
- source_word: תַּחַת
  choice: పరిహారంగా
  rationale: గాయానికి ప్రతిఫలంగా లేదా నష్టపరిహారంగా ఇచ్చే విడుదల అనే న్యాయభావాన్ని స్పష్టం చేస్తుంది.
- source_word: שִׁנּוֹ
  choice: ఆ పన్నుకు
  rationale: గాయపడిన దాసుడు లేదా దాసి పన్నును సూచిస్తుంది; తెలుగులో అస్పష్టమైన లింగ సర్వనామాన్ని తప్పిస్తూ మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన గ్రంథంలోని దాసత్వ పదజాలం
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు
  rationale: ఈ వాక్యం బంధిత వ్యక్తికి కలిగిన గాయం మరియు దానికి చట్టపరమైన పరిహారం గురించి చెబుతుంది. కాబట్టి సామాజిక-చట్టపరమైన వాస్తవాన్ని మృదూకరించకుండా ‘దాసుడు / దాసి’ అని అనువదించడం సముచితం.
- issue: పురుష ఏకవచన కర్మప్రత్యయం వర్తించే పరిధి
  choice: ఆ వ్యక్తిని … విడుదల చేయాలి
  alternative: అతనిని … విడుదల చేయాలి
  rationale: హీబ్రూ క్రియకు పురుష ఏకవచన కర్మప్రత్యయం ఉన్నప్పటికీ, ముందున్న షరతు దాసుని లేదా దాసిని రెండింటినీ పేర్కొంటుంది. ‘ఆ వ్యక్తిని’ అనేది ఆ సాధారణ వర్తింపును తెలుగులో సహజంగా తెలియజేస్తూ, మూలంలోని వ్యాకరణ వివరాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. ‘దాసుడు/దాసి’ మూలంలోని బంధిత స్థితిని స్పష్టంగా నిలుపుతుంది; ‘ఆ వ్యక్తిని’ లింగభేదం లేకుండా నియమం వర్తించడాన్ని సహజంగా తెలియజేస్తుంది.
