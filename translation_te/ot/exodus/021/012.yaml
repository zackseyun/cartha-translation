  yaml_path: translation/ot/exodus/021/012.yaml
  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: te
  text: ఎవరైనా ఒక మనిషిని కొట్టి, ఆ మనిషి చనిపోతే, ఆ కొట్టినవానికి తప్పకుండా మరణశిక్ష విధించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానువాదంగా: “ఒక మనిషిని కొట్టేవాడు—ఆ మనిషి చనిపోతే—తప్పకుండా చంపబడాలి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: కొట్టి
  rationale: 'נכה ధాతువు నుంచి వచ్చిన కృదంత రూపం న్యాయవిధిలో ఒక సందర్భాన్ని పరిచయం చేస్తుంది: ‘కొట్టేవాడు/కొట్టినవాడు.’ ‘కొట్టి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; దెబ్బ ఫలితాన్ని క్రియలోనే ముందుగా నిర్ధారించదు.'
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: אִישׁ సాధారణంగా ‘మనిషి’ లేదా ‘పురుషుడు’ అని అర్థం. ఇక్కడ అది దెబ్బ తిన్న మానవ వ్యక్తిని సూచిస్తుంది; ‘ఒక మనిషిని’ మూలంలోని ఏకవచన వ్యక్తి సూచనను నిలుపుతుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోతే
  rationale: వావ్‌తో కూడిన מות క్రియారూపం దెబ్బకొట్టడం వల్ల సంభవించిన మరణాన్ని తెలియజేస్తుంది. తెలుగు న్యాయవాక్య నిర్మాణంలో ‘చనిపోతే’ ఆ ఫలిత-షరతు సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్ష విధించాలి
  rationale: క్రియానామ అవ్యయం మరియు కర్మణి అసంపూర్ణ క్రియ కలయిక శిక్ష యొక్క నిశ్చయాన్ని బలపరుస్తుంది. ‘తప్పకుండా’ ఆ బలాన్ని, ‘మరణశిక్ష విధించాలి’ కర్మణి స్వభావంగల అధికారిక న్యాయ తీర్పును తెలుగులో స్పష్టంగా తెలియజేస్తాయి.
theological_decisions:
- issue: ఈ నియమం ఉద్దేశపూర్వక హత్యకే పరిమితమా అనే ప్రశ్న
  choice: ఈ వాక్యంలో లేనందున ఉద్దేశాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు
  alternative: ‘ఉద్దేశపూర్వకంగా కొట్టి చంపినవాడు’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం ఇక్కడ కొట్టడం మరియు మరణ ఫలితాన్ని మాత్రమే చెబుతుంది; ఉద్దేశపూర్వకతకు సంబంధించిన భేదాలు తరువాతి వచనాల్లో వస్తాయి. అందువల్ల ఈ వచనంలోనే ఆ పరిమితిని చేర్చడం మూలంలోని న్యాయపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయవాక్య శైలిని ఉపయోగించాం. ప్రధాన పాఠ్యంలో ‘మరణశిక్ష విధించాలి’ అనేది మూలంలోని కర్మణి శిక్షా సూత్రాన్ని స్పష్టంగా అందిస్తుంది; పాదటిప్పణి హీబ్రూ పదక్రమానికీ ‘చంపబడాలి’ అనే మరింత రూపసన్నిహిత వ్యక్తీకరణకీ చోటిస్తుంది.
