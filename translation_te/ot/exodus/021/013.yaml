id: EXO.21.13
reference: Exodus 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: te
  text: అయితే అతడు మాటువేయక, దేవుడు అది అతని చేతి ద్వారా జరిగేలా చేస్తే, అతడు అక్కడికి పారిపోవడానికి నేను నీకు ఒక స్థలాన్ని నిర్ణయిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: అయితే ... చేసినట్లయితే
  rationale: మునుపటి వచనంలోని ఉద్దేశపూర్వక హత్యకు భిన్నమైన షరతును సహజమైన తెలుగు న్యాయశైలిలో తెలియజేస్తుంది.
- source_word: לֹא צָדָה
  choice: మాటువేయకపోయి
  rationale: צדה ఇక్కడ వేటాడడం కంటే ముందుగా పన్నాగం పన్ని పొంచి ఉండడాన్ని సూచిస్తుంది; ‘మాటువేయడం’ ఆ న్యాయపరమైన వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְהָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో אֱלֹהִים న్యాయాధిపతులను కాక, యాదృచ్ఛికంగా కనిపించే ఘటన వెనుకనున్న దైవిక కార్యసాధకత్వాన్ని సూచిస్తుంది.
- source_word: אִנָּה לְיָדוֹ
  choice: అది అతని చేతి ద్వారా జరిగేలా చేసినట్లయితే
  rationale: హెబ్రీయ నుడికారంలోని దైవిక కారణత్వాన్నీ, మనిషి సాధనంగా వ్యవహరించడాన్నీ నిలుపుతూ, ముందస్తు ఉద్దేశం లేదనే సందర్భానికి సరిపోయే సహజమైన తెలుగు రూపం.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: నేను నీకు ఒక స్థలాన్ని నియమిస్తాను
  rationale: అధికారికంగా ఆశ్రయస్థలాన్ని ఏర్పాటు చేయడాన్ని ‘నియమిస్తాను’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: అతడు పారిపోవడానికి
  rationale: యָנוּסలోని ఆశ్రయం కోసం పారిపోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆ స్థలం యొక్క ఉద్దేశాన్ని కూడా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: అనుద్దేశపూర్వక మరణంలో దైవిక కార్యసాధకత్వం
  choice: దేవుడు అది అతని చేతి ద్వారా జరిగేలా చేసినట్లయితే
  alternative: దేవుడు దానిని అతని చేతికి అప్పగించినట్లయితే
  rationale: ఎంచుకున్న రూపం దేవుని కార్యసాధకత్వాన్ని తగ్గించకుండా, హంతకునికి ముందస్తు ఉద్దేశం లేదనే వాక్యంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది. ‘చేతికి అప్పగించాడు’ అనేది యుద్ధం లేదా శిక్షార్థకంగా అప్పగించడం అనే అపార్థానికి దారితీయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయశైలి. మూలంలో లేని వివరణను పాదసూచికగా చేర్చలేదు; దైవిక కారణత్వం మరియు మానవ సాధనత్వం రెండింటినీ ప్రధాన పాఠ్యంలోనే నిలిపాం.
