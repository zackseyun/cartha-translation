  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: te
  text: ఒక మనిషిని అపహరించినవాడు అతణ్ణి అమ్మినా, లేక ఆ మనిషి అతని అధీనంలో దొరికినా, అతనికి తప్పకుండా మరణశిక్ష విధించాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక మనిషిని దొంగిలించినవాడు.’ ఈ సందర్భంలో ఇది మనిషిని దొంగిలించడం, అంటే అపహరించడం అనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని చేతిలో దొరికితే.’ ‘చేతిలో’ అనేది స్వాధీనం లేదా నియంత్రణను సూచించే హీబ్రూ నుడికారం. హీబ్రూ సంధికి సాధారణ అర్థం ‘మరియు’; ఇక్కడ అమ్మడం లేదా బాధితుడు ఇంకా అపహరణకుడి అధీనంలో దొరకడం అనే న్యాయపరమైన ప్రత్యామ్నాయంగా ‘లేక’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: అపహరించి
  rationale: గנב అనే పదానికి మూలార్థం ‘దొంగిలించడం.’ అయితే ఇక్కడ దాని కర్మ אִישׁ (‘మనిషి’), తరువాత అమ్మడం లేదా అధీనంలో ఉంచుకోవడం ప్రస్తావించబడినందున, ఇది మనిషిని దొంగిలించడం, అంటే అపహరించడం అనే భావాన్ని సూచిస్తుంది.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: וּמְכָרוֹ
  choice: అతణ్ణి అమ్మివేసినవాడు
  rationale: మూడవ పురుష ఏకవచన పుంలింగ కర్మప్రత్యయం అపహరించబడిన వ్యక్తినే సూచిస్తుంది. ‘అమ్మివేయడం’ విక్రయ చర్యను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: లేదా అతడు అతని అధీనంలో దొరికినవాడు
  rationale: ‘అతని చేతిలో’ అనే హీబ్రూ నుడికారం స్వాధీనం లేదా నియంత్రణను సూచిస్తుంది. తెలుగులో ‘అధీనంలో’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; సంధిని ‘లేదా’గా అనువదించడం అమ్మివేయడం లేదా ఇంకా అధీనంలో ఉంచడం అనే న్యాయపరమైన ప్రత్యామ్నాయాలను వ్యక్తం చేస్తుంది.
- source_word: מֹות יוּמָת
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  rationale: క్రియావిశేష బలవర్ధక నిర్మాణం శిక్ష యొక్క నిశ్చితత్వాన్ని సూచిస్తుంది. ఇది కేవలం మరణిస్తాడనే అంచనా కాక, న్యాయపరమైన మరణదండన అని ఈ తెలుగు ప్రయోగం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: న్యాయ అపరాధం యొక్క పరిధి
  choice: బాధితుణ్ణి ఇప్పటికే అమ్మివేసినా, ఇంకా అపహరించినవాని అధీనంలో ఉంచుకున్నా, మనిషిని అపహరించే అపరాధానికి ఈ శిక్ష వర్తిస్తుంది.
  alternative: రెండవ ఉపవాక్యాన్ని ప్రత్యామ్నాయంగా కాక, ‘మరియు అతడు అతని చేతిలో దొరికితే’ అనే అదనపు పరిస్థితిగా చదవవచ్చు.
  rationale: హీబ్రూ וְ సంధి ‘మరియు’ లేదా సందర్భానుసారం ‘లేదా’ అనే సంబంధాన్ని సూచించగలదు. న్యాయవాక్య నిర్మాణంలో అమ్మివేయడం, ఇంకా అధీనంలో దొరకడం అనే రెండు పరిస్థితులను ‘లేదా’ సహజంగా వ్యక్తం చేస్తుంది; అయినా ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘అపహరించడం,’ ‘అధీనంలో,’ ‘మరణశిక్ష’ అనే పదాలు మూలంలోని అపరాధం, స్వాధీనం, న్యాయదండనలను స్పష్టంగా తెలియజేస్తాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
