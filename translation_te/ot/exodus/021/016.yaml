    rationale: ‘లేదా అతడు అతని అధీనంలో దొరికినవాడు’లో దొరికేది అపహరణకుడా లేక అపహరించబడిన మనిషా అనేది స్పష్టపడదు. హీబ్రూలో బాధితుడు అపహరణకుడి ‘చేతిలో’/స్వాధీనంలో దొరకడమే ఉద్దేశం. దానిని ప్రధాన పాఠ్యంలో స్పష్టపరచాలి.
