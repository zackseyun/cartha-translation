  to: ఒక మనిషిని అపహరించినవాడు అతణ్ణి అమ్మినా, లేక ఆ మనిషి అతని అధీనంలో దొరికినా, అతనికి తప్పకుండా మరణశిక్ష విధించాలి.[a][b]
