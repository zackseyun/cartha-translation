lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: וְ సందర్భంలో మునుపటి భాగంతో అనుసంధానాన్ని సూచిస్తుంది. అయితే ఆధునిక తెలుగులో వాక్యారంభంలో ‘మరియు ఇవి’ అనడం కృత్రిమంగా ఉంటుంది; ‘ఇవి’ సహజంగా ఉండి సందర్భానుసంధానాన్ని నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: מִשְׁפָּטִים అనే పదంలో న్యాయతీర్పులు, చట్టపరమైన నిర్ణయాలు, అమలుచేయవలసిన విధులు అనే భావాలు ఉన్నాయి. తరువాత వచ్చే ఉదాహరణాధారిత చట్టాలకు ‘న్యాయవిధులు’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר
  choice: -వలసిన
  rationale: హీబ్రూ సంబంధవాచకాన్ని తెలుగులో సహజమైన విశేషణ క్రియారూపంతో వ్యక్తపరచడం ద్వారా ‘నీవు ఉంచవలసిన’ అనే సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: תָּשִׂים
  choice: నీవు … ఉంచవలసిన
  rationale: שׂים అంటే ‘పెట్టు, ఉంచు, స్థాపించు.’ ఇక్కడ మోషే ప్రజల ముందు నియమాలను సమర్పించాలనే ఆదేశాన్ని ‘ఉంచవలసిన’ సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵיהֶם
  choice: వారి ఎదుట
  rationale: ఈ హీబ్రూ ప్రయోగం ‘వారి ముందు/వారి సమక్షంలో’ అని అర్థం. ‘వారి ఎదుట’ ప్రజలకు అధికారికంగా సమర్పించడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: నిబంధన చట్టాల సందర్భంలో מִשְׁפָּטִים అనువాదం
  choice: న్యాయవిధులు
  alternative: తీర్పులు; విధులు; నియమాలు; చట్టాలు
  rationale: ఇది ప్రధానంగా పదార్థం మరియు చట్టసాహిత్య శైలికి సంబంధించిన నిర్ణయం. ‘న్యాయవిధులు’ అనే రూపం న్యాయపరమైన భావాన్ని, తరువాత వచ్చే నిర్దిష్ట కేసు-చట్టాల స్వభావాన్ని రెండింటినీ నిలుపుతుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంబంధ నిర్మాణాన్ని తెలుగుకు సహజమైన ‘ఉంచవలసిన’ రూపంలో ఇచ్చాం; వాక్యారంభంలోని וְ కోసం అసహజమైన ‘మరియు’ను బలవంతంగా చేర్చలేదు.
