source:
  edition: WLC
  text: וְ/אִם שְׁלָ֨שׁ אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑/הּ וְ/יָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: te
  text: అయితే, అతడు ఈ మూడు బాధ్యతలను ఆమె పట్ల నెరవేర్చకపోతే[a], ఆమె ఏ ధనమూ చెల్లించకుండా స్వేచ్ఛగా వెళ్లిపోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు ఈ మూడింటినీ ఆమెకు సమకూర్చకపోతే.’ హీబ్రూలో అక్షరార్థంగా, ‘ఈ మూడింటిని ఆమెకు చేయకపోతే’ అని ఉంది. ఇది ముందటి వచనంలో చెప్పిన ఆహారం, వస్త్రం, దాంపత్య హక్కులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అతడు ... చేయకపోతే
  rationale: ముందటి న్యాయనియమానికి కొనసాగింపుగా వచ్చే షరతును తెలుగులో సహజమైన ‘చేయకపోతే’ రూపంలో వ్యక్తం చేసింది; వావ్‌ యొక్క అనుసంధాన భావం సందర్భంలో నిలుస్తుంది.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ఈ మూడు విషయాలను
  rationale: ముందటి వచనంలో పేర్కొన్న ఆహారం, వస్త్రం, దాంపత్య హక్కులు అనే మూడు బాధ్యతలను సూచిస్తుంది; ‘విషయాలను’ చేర్చడం తెలుగులో స్పష్టతనిస్తుంది.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: ఆమెకు చేయకపోతే
  rationale: עשה యొక్క విస్తృతమైన ‘చేయు’ అర్థాన్ని నిలుపుతూ, ఆమె పట్ల మూడు బాధ్యతలను నెరవేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చకపోతే’ అనేది సాధ్యమైన సందర్భార్థ ప్రత్యామ్నాయం.
- source_word: וְיָצְאָה
  choice: వెళ్లిపోవాలి
  rationale: బానిసత్వ స్థితి నుంచి బయటకు వెళ్లడాన్ని సూచించే న్యాయపరమైన వాడుక. తరువాతి ‘స్వతంత్రురాలిగా’ అనే పదం విడుదల భావాన్ని స్పష్టం చేస్తుంది.
- source_word: חִנָּם
  choice: స్వతంత్రురాలిగా
  rationale: ఈ న్యాయసందర్భంలో ఎటువంటి మూల్యం చెల్లించకుండా విడుదల కావడాన్ని సూచిస్తుంది; స్త్రీని ఉద్దేశించినందున స్త్రీలింగ రూపం వాడబడింది.
- source_word: אֵין כָּסֶף
  choice: ఏ డబ్బూ చెల్లించకుండా
  rationale: ఆమె విడుదల కోసం ధనం చెల్లించవలసిన అవసరం లేదనే న్యాయ-ఆర్థిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
