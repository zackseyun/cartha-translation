  text: కాలిన గాయానికి కాలిన గాయం, గాయానికి గాయం, కమురుకు కమురు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దెబ్బవల్ల ఏర్పడిన వాతకు వాత” లేదా “దెబ్బమచ్చకు దెబ్బమచ్చ.” హీబ్రూ పదం దెబ్బవల్ల ఏర్పడే వాతను, కమురును లేదా మచ్చను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: కాలిన గాయం
  rationale: ఈ నామవాచకం కాలిన గాయాన్ని లేదా దాని మచ్చను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కాలిన గాయం’ స్పష్టంగా ఉండి, న్యాయపరమైన గాయం-ప్రతిగాయం క్రమాన్ని నిలుపుతుంది.
- source_word: תַּחַת
  choice: …కు …
  rationale: ఈ న్యాయ సందర్భంలో ఇది సమాన ప్రతిఫలం లేదా పరిహారాన్ని సూచిస్తుంది. తెలుగులో ‘గాయానికి గాయం’ అనే నిర్మాణం సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: פֶּצַע
  choice: గాయం
  rationale: ఇది శరీరానికి కలిగిన గాయాన్ని విస్తృతంగా సూచిస్తుంది. ‘గాయం’ సహజమైన, నిర్దిష్టతను అతిగా చేర్చని తెలుగు పదం.
- source_word: חַבּוּרָה
  choice: దెబ్బ మచ్చ
  rationale: ఈ పదం దెబ్బవల్ల ఏర్పడిన కమురు, వాత లేదా మచ్చను సూచించగలదు. ‘దెబ్బ మచ్చ’ మూలంలోని దెబ్బతో ఏర్పడిన గుర్తు అనే అంశాన్ని నిలుపుతుంది; ‘కమురు’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
