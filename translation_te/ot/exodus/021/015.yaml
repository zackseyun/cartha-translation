  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: te
  text: తన తండ్రినిగాని తన తల్లినిగాని కొట్టేవాడు తప్పకుండా మరణశిక్ష పొందాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘తన తండ్రిని మరియు తన తల్లిని’; అయితే ఈ న్యాయవాక్యం తల్లిదండ్రుల్లో ఎవ్వరినైనా కొట్టడాన్ని సూచిస్తున్నందున ఇక్కడ ‘-నిగాని … -నిగాని’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: కొట్టేవాడు
  rationale: נכה ధాతువు నుంచి వచ్చిన కర్తరి అసమాపక రూపం; శారీరకంగా కొట్టే చర్యను సూచిస్తుంది. ‘కొట్టేవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘చితకబాదేవాడు’ వంటి అతిశయార్థాన్ని చేర్చదు.
- source_word: אָבִיו
  choice: తన తండ్రిని
  rationale: హీబ్రూ పదం ఏకవచనంలో ప్రత్యేకంగా ‘అతని తండ్రి’ని సూచిస్తుంది; తెలుగు వాక్యంలో కర్తను తిరిగి సూచించడానికి ‘తన’ సహజమైనది.
- source_word: אִמּוֹ
  choice: తన తల్లిని
  rationale: హీబ్రూ పదం ప్రత్యేకంగా ‘అతని తల్లి’ని సూచిస్తుంది; తండ్రి, తల్లి ఇద్దరినీ విడివిడిగా పేర్కొన్న మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  rationale: క్రియావిశేషక infinitive absoluteతో కూడిన passive finite verb శిక్ష యొక్క నిశ్చితత్వాన్ని బలపరుస్తుంది. ఈ తెలుగు రూపం కేవలం ‘చనిపోవాలి’ అని కాక, న్యాయపరంగా విధించబడే మరణదండనను తెలియజేస్తుంది.
- source_word: וּ / וְ
  choice: -నిగాని … -నిగాని
  rationale: మూలంలో సంధికార్థక ‘మరియు’ ఉన్నప్పటికీ, న్యాయవాక్య భావం తండ్రి లేదా తల్లి—వారిలో ఎవ్వరినైనా—కొట్టడాన్ని ఉద్దేశిస్తుంది. తెలుగులో ‘-నిగాని … -నిగాని’ ఆ ప్రత్యామ్నాయ న్యాయార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన మరణదండన సూత్రాన్ని అనువదించడం
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  alternative: నిశ్చయంగా చంపబడాలి
  rationale: ఈ వాక్యం సాధారణ మరణాన్ని కాక న్యాయపరంగా అమలు చేసే శిక్షను ప్రకటిస్తుంది. ఎంచుకున్న రూపం మూలంలోని నిష్క్రియాత్మక న్యాయబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘మరణశిక్ష పొందాలి’ అనే రూపం మూలంలోని న్యాయపరమైన నిష్క్రియ భావాన్ని స్పష్టంగా ఉంచుతుంది; పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
