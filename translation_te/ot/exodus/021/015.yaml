  source_fidelity: 'The Telugu accurately represents the Hebrew participial legal formulation: one who strikes either his father or mother is subject to the death penalty. ‘కొట్టేవాడు’ preserves the physical-act sense of מַכֵּה without adding severity, and ‘తప్పకుండా మరణశిక్ష పొందాలి’ appropriately conveys the emphatic judicial passive formula מוֹת יוּמָת.'
  naturalness: The wording is clear, idiomatic modern standard Telugu, with an appropriately formal legal register. The paired ‘తండ్రినిగాని … తల్లినిగాని’ naturally communicates the distributive legal sense intended in context.
  terminology: ‘తండ్రి,’ ‘తల్లి,’ ‘కొట్టేవాడు,’ and ‘మరణశిక్ష’ are accurate and accessible. The footnote responsibly identifies the formal Hebrew conjunction and explains the Telugu distributive rendering without overstating a textual issue.
