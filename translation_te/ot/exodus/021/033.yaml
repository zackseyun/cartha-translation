source:
  edition: WLC
  text: וְ/כִֽי יִפְתַּ֨ח אִ֜ישׁ בּ֗וֹר א֠וֹ כִּֽי יִכְרֶ֥ה אִ֛ישׁ בֹּ֖ר וְ/לֹ֣א יְכַסֶּ֑/נּוּ וְ/נָֽפַל שָׁ֥מָּ/ה שּׁ֖וֹר א֥וֹ חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: te
  text: ఎవరైనా ఒక గుంతను తెరిస్తే[a], లేదా ఎవరైనా ఒక గుంతను తవ్వి దానిని కప్పకపోతే, అందులో ఎద్దు లేదా గాడిద పడితే,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇప్పటికే ఉన్న గుంతపై ఉన్న కప్పును తొలగిస్తే.’ హీబ్రూ క్రియకు అక్షరార్థం ‘తెరచు’; ఇది కొత్తగా గుంత తవ్వడాన్ని కాకుండా, ఇప్పటికే ఉన్న గుంతను తెరవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎవరైనా’ అనేది హీబ్రూ ఏకవచన పుంలింగ న్యాయసూత్ర పదమైన אִישׁ ను ఈ సందర్భంలో సాధారణ వ్యక్తి అనే అర్థంలో అనువదిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ఒకడు … తెరిచినా
  rationale: ముందటి న్యాయనియమాలకు అనుసంధానంగా ఒక షరతుతో కూడిన న్యాయసందర్భాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘-ఇనా’ నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יִפְתַּח
  choice: తెరిచినా
  rationale: మూల క్రియకు అక్షరార్థంగా ‘తెరచు’ అనే భావం ఉంది; తరువాతి ‘తవ్వు’ క్రియతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది. ఇది ఇప్పటికే ఉన్న గోతిపై కప్పును తొలగించడాన్ని సూచించవచ్చు.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ న్యాయసూత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఇక్కడ ఇది సాధారణ న్యాయవ్యక్తిని సూచిస్తుంది.
- source_word: בּוֹר
  choice: గోతి
  rationale: పశువులు పడిపోయే ప్రమాదకరమైన తవ్వకానికి సందర్భానుకూలమైన విస్తృత పదం; ‘నీటి తొట్టి’ వంటి మరీ నిర్దిష్టమైన భావాన్ని రుద్దదు.
- source_word: א֠וֹ כִּי
  choice: లేక
  rationale: మొదటి న్యాయసందర్భానికి సమాంతరమైన ప్రత్యామ్నాయ పరిస్థితిని సహజ తెలుగులో సూచిస్తుంది.
- source_word: יִכְרֶה
  choice: తవ్వి
  rationale: కొత్త గోతిని తవ్వడాన్ని స్పష్టంగా తెలిపి, ముందటి ‘తెరవడం’ నుంచి వేరుచేస్తుంది.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: దానిని కప్పకుండా ఉంచినా
  rationale: భౌతికంగా గోతిని కప్పకపోవడాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְ/נָפַל
  choice: పడితే
  rationale: హీబ్రూ న్యాయసందర్భంలోని షరతుల క్రమాన్ని తెలుగులో సహజమైన షరతు రూపంతో కొనసాగిస్తుంది.
- source_word: שָׁמָּה
  choice: అందులో
  rationale: దిశాసూచక భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, జంతువు గోతిలో పడిందని స్పష్టం చేస్తుంది.
- source_word: שּׁוֹר
  choice: ఎద్దు
  rationale: న్యాయసందర్భంలో పేర్కొన్న ఏకవచన గోవర్గపు పశువుకు సాధారణ, సులభమైన తెలుగు పదం.
- source_word: א֥וֹ חֲמוֹר
  choice: గాడిదగాని
  rationale: ఆ కాలపు సాధారణ పెంపుడు భారవాహక జంతువును ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
