source:
  edition: WLC
  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: te
  text: అయితే, ఆ బానిస, “నేను నా యజమానిని, నా భార్యను, నా పిల్లలను[b] ప్రేమిస్తున్నాను; నేను స్వేచ్ఛగా వెళ్లను” అని స్పష్టంగా చెబితే[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశ్చయంగా చెబితే.” హీబ్రూలో ఒకే మూలానికి చెందిన అవ్యయ క్రియారూపం, పరిమిత క్రియారూపంతో కలిసి వచ్చి ప్రకటనను బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా కుమారులను.” హీబ్రూ పదం పుంలింగ బహువచనంలో ఉంది; అయితే ఈ కుటుంబ సందర్భంలో అది పిల్లలందరినీ సాధారణంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … చెబితే
  rationale: ముందటి నియమానికి భిన్నమైన షరతును ప్రవేశపెడుతుంది. ‘అయితే’ సందర్భంలోని వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָמֹר יֹאמַר
  choice: స్పష్టంగా చెబితే
  rationale: క్రియకు ముందు అదే మూలానికి చెందిన infinitive absolute రావడం ఉద్దేశపూర్వకమైన, నిశ్చయమైన ప్రకటనను బలపరుస్తుంది. ‘స్పష్టంగా’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: הָעֶבֶד
  choice: ఆ బానిస
  rationale: ఇది బంధిత సేవనుంచి విడుదలను గురించిన న్యాయ సందర్భం; కాబట్టి వ్యక్తి స్వేచ్ఛ పరిమితమైన స్థితిని ‘బానిస’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָהַבְתִּי
  choice: ప్రేమిస్తున్నాను
  rationale: హీబ్రూ perfect ఇక్కడ గత చర్యకన్నా ప్రస్తుతం కొనసాగుతున్న స్థిరమైన ప్రేమను సూచిస్తుంది; తెలుగు వర్తమాన రూపం సహజంగా ఉంటుంది.
- source_word: אֲדֹנִי
  choice: నా యజమానిని
  rationale: గృహ-న్యాయ సందర్భంలోని అధికార సంబంధాన్ని ‘యజమాని’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אִשְׁתִּי
  choice: నా భార్యను
  rationale: మూలంలోని ఏకవచన స్వామ్యరూపానికి నేరమైన, సహజమైన అనువాదం.
- source_word: בָּנָי
  choice: నా పిల్లలను
  rationale: రూపపరంగా ‘నా కుమారులు’ అయినప్పటికీ, కుటుంబ సందర్భంలో సంతానాన్ని సాధారణంగా సూచించవచ్చు. ఆ సాధ్యమైన విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לֹא אֵצֵא
  choice: నేను … వెళ్లను
  rationale: సేవనుంచి బయటికి వెళ్లడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: חָפְשִׁי
  choice: స్వతంత్రుడిగా
  rationale: అతడు వెళ్లే స్థితిని తెలిపే predicate adjective. ‘స్వతంత్రుడిగా’ విడుదలైన వ్యక్తిగా వెళ్లడాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలీయుల బంధిత సేవా న్యాయంలో עבד పదానికి అనువాదం
  choice: బానిస
  alternative: సేవకుడు; దాసుడు
  rationale: ఈ వచనం బంధిత సేవనుంచి లభించే స్వేచ్ఛను స్వీకరించకుండా ఉండడం గురించి మాట్లాడుతుంది. అందువల్ల బంధిత స్థితి భావం ప్రధానమైనది; ‘బానిస’ దానిని ఆధునిక పాఠకునికి అస్పష్టత లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ప్రత్యక్ష ప్రసంగం సహజమైన తెలుగు వాక్యక్రమంలో అమర్చబడింది; మూలంలోని ఉద్ఘాటన మరియు ‘కుమారులు/పిల్లలు’ అనే నిజమైన అర్థసంభావ్యత పాదటిప్పణుల్లో నిలుపబడ్డాయి.
