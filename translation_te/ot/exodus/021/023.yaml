translation:
  language: te
  text: కాని హాని జరిగితే[a], ప్రాణానికి బదులుగా ప్రాణం ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తీవ్రమైన గాయం’ లేదా ‘మరణం’; హెబ్రీ పదం తీవ్రమైన హాని లేదా విపత్తును సూచించగలదు. ఈ సందర్భంలో అది గాయాన్ని మాత్రమే సూచిస్తుందా, ప్రత్యేకంగా మరణాన్ని సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు భిన్నంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: కాని … జరిగితే
  rationale: ముందరి వాక్యంలోని పరిస్థితికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָסוֹן
  choice: హాని
  rationale: ఈ పదం తీవ్రమైన హాని, విపత్తు లేదా మరణాన్ని సూచించగలదు. ఏ ఫలితాన్ని ఉద్దేశించిందో అనవసరంగా కుదించకుండా విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: יִהְיֶה
  choice: జరిగితే
  rationale: హాని సంభవించడాన్ని తెలిపే హెబ్రీ అస్తిత్వ క్రియను తెలుగులో సహజమైన షరతు రూపంలో అందిస్తుంది.
- source_word: וְנָתַתָּה
  choice: ఇవ్వాలి
  rationale: ‘ఇవ్వు’ అనే మూలార్థాన్ని నిలుపుతూ, న్యాయపరమైన విధిని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘చెల్లించాలి’ అనడం ధనపరిహార భావాన్ని అనవసరంగా కలిగించవచ్చు.
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: ప్రాణానికి ప్రాణం
  rationale: న్యాయసూత్రంలోని సమాన ప్రతిఫల నిర్మాణాన్ని, పదపునరుక్తిని సంక్షిప్తంగా నిలుపుతుంది; ఇక్కడ נֶפֶשׁ అంటే ‘ఆత్మ’ కంటే ‘ప్రాణం’ సముచితం.
theological_decisions:
- issue: ఈ న్యాయంలో אָסוֹן సూచించే హాని యొక్క పరిధి
  choice: ఎవరికి హాని జరిగిందో లేదా అది తప్పనిసరిగా మరణమేనో నిర్దిష్టం చేయకుండా ‘హాని’ అని విస్తృతంగా అనువదించడం.
  alternative: ‘తీవ్రమైన గాయం’ లేదా ‘మరణం’ అని అనువదించడం.
  rationale: ఈ వచనం స్వయంగా హాని ఎవరికి జరిగిందో, దాని తీవ్రత ఏమిటో స్పష్టంగా పరిమితం చేయదు. అందువల్ల చర్చనీయమైన భావాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘ప్రాణానికి ప్రాణం’ అనే సమాంతర నిర్మాణం హెబ్రీ న్యాయసూత్రపు సంక్షిప్తతను నిలుపుతుంది.
