id: EXO.21.7
reference: Exodus 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: te
  text: ఒక పురుషుడు తన కుమార్తెను దాసిగా అమ్మితే, పురుష దాసులు విడుదలయ్యే విధంగా ఆమె విడుదల పొందదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, పురుష దాసులు విడుదలయ్యే అవే షరతుల ప్రకారం ఆమె సేవ నుంచి విడుదల పొందదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ఒకవేళ … అయితే
  rationale: న్యాయవిధుల్లో ఒక షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన షరతార్థ నిర్మాణాన్ని ఉపయోగించాం; సందర్భ సంబంధం వల్ల וְను విడిగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: יִמְכֹּר
  choice: అమ్మితే
  rationale: సాధారణ న్యాయపరమైన సందర్భంలో జరిగే అమ్మకాన్ని నేరుగా తెలియజేస్తుంది; మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: వ్యాకరణపరంగా పురుష ఏకవచనం; ఇక్కడ తన కుమార్తెను అమ్మే పురుష కుటుంబాధిపతిని సూచిస్తుంది.
- source_word: בִּתּוֹ
  choice: తన కుమార్తెను
  rationale: మూడవ పురుష ఏకవచన సంబంధాన్ని తెలుగులో సహజంగా ‘తన’తో వ్యక్తం చేస్తుంది.
- source_word: לְאָמָה
  choice: దాసిగా
  rationale: אָמָה స్త్రీకి సంబంధించిన బంధిత సేవా స్థితిని సూచిస్తుంది. ‘పనిమనిషి’ వంటి మృదువైన పదం కంటే ‘దాసి’ న్యాయపరమైన బానిస స్థితిని స్పష్టంగా చూపుతుంది.
- source_word: לֹא תֵצֵא
  choice: ఆమె విడుదల కాదు
  rationale: ఇక్కడ ‘బయటికి వెళ్లడం’ సేవాబంధం నుంచి విడుదల కావడాన్ని సూచించే న్యాయపరమైన ప్రయోగం. తెలుగులో ఉద్దేశాన్ని సహజంగా, స్పష్టంగా అందించేందుకు ‘విడుదల కాదు’ అని అనువదించాం.
- source_word: כְּצֵאת
  choice: విడుదలైనట్లుగా
  rationale: తులనాత్మక భావాన్ని నిలుపుతూ, ముందున్న విడుదల భావంతో సహజమైన తెలుగు సమాంతరాన్ని ఏర్పరుస్తుంది.
- source_word: הָעֲבָדִים
  choice: పురుష దాసులు
  rationale: ముందటి న్యాయవిధిలోని పురుష దాసులతో ఈ కుమార్తె స్థితిని పోలుస్తున్నందున, లింగభేదాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో దాసత్వ పదజాలం
  choice: ‘దాసి’, ‘పురుష దాసులు’
  alternative: ‘పనిమనిషి’, ‘సేవకులు’
  rationale: ఈ వాక్యం అమ్మకం మరియు విడుదలకు సంబంధించిన న్యాయస్థితిని నియంత్రిస్తుంది. అందువల్ల బంధిత స్థితిని మృదువుగా మార్చకుండా స్పష్టంగా తెలిపే పదాలను ఎంచుకున్నాం.
- issue: לֹא תֵצֵא యొక్క భావం
  choice: ‘ఆమె విడుదల కాదు’
  alternative: ‘ఆమె బయటికి వెళ్లదు’
  rationale: మూలంలోని ‘వెళ్లడం’ ఈ సందర్భంలో సేవ నుంచి విడుదల కావడానికి న్యాయపరమైన పరిభాష. తెలుగు పాఠకునికి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ, ఆమె ఎన్నటికీ విడుదల కాదనే భావం రాకుండా తులనాత్మక వాక్యంతో కలిపి అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. దాసత్వ వాస్తవాన్ని మృదువుగా చేయకుండా, మూలంలోని లింగాధారిత న్యాయభేదాన్ని స్పష్టంగా నిలిపాం.
