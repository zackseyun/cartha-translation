translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. ‘దాసుడు/దాసి’ మూలంలోని బానిసత్వ సంబంధాన్ని ‘సేవకుడు/సేవకురాలు’ కంటే స్పష్టంగా నిలుపుతుంది. ప్రధాన పాఠంలో ‘తులాలు’ పాఠకసౌలభ్యానికి ఎంచుకోబడింది.
