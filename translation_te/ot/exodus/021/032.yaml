id: EXO.21.32
reference: Exodus 21:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם עֶ֛בֶד יִגַּ֥ח הַ/שּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽ/אדֹנָ֔י/ו וְ/הַ/שּׁ֖וֹר יִסָּקֵֽל־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: te
  text: ఎద్దు ఒక దాసుణ్ణిగాని దాసినిగాని[a] కొమ్ములతో పొడిస్తే, దాని యజమాని ఆ దాసుని లేదా దాసి యజమానికి ముప్పై షెకెల్ల వెండి ఇవ్వాలి; ఆ ఎద్దును రాళ్లతో కొట్టి చంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మగ బానిసనుగాని ఆడ బానిసనుగాని.” హీబ్రూ పాఠం మగ దాసుణ్ణి (עֶבֶד), ఆడ దాసిని (אָמָה) వేర్వేరు పదాలతో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: దాసుడు
  rationale: ఈ న్యాయసందర్భంలో బానిసత్వపు సామాజిక-చట్టపరమైన స్థితి ప్రధానమైనది; אָמָהతో ఉన్న జంట వ్యత్యాసాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: אָמָה
  choice: దాసి
  rationale: עֶבֶדకు స్త్రీలింగ జతగా, బానిసత్వ స్థితినీ స్త్రీలింగాన్నీ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִגַּח
  choice: కొమ్ములతో పొడిస్తే
  rationale: ఎద్దుల గురించిన న్యాయసందర్భంలో נגח కొమ్ములతో కుమ్మడం లేదా పొడవడాన్ని సూచిస్తుంది; తెలుగులో చర్యను స్పష్టంగా చెప్పే సహజ రూపం ఇది.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: ముప్పై తులాల వెండి
  rationale: షెకెలు ఇక్కడ వెండి బరువు ప్రమాణం. సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే సంప్రదాయ బైబిలు బరువు పదంగా ‘తులాలు’ వాడబడింది; ఖచ్చితమైన మూల ప్రమాణం కోసం పాదసూచిక ఇవ్వబడింది.
- source_word: יִתֵּן
  choice: ఇవ్వాలి
  rationale: ఈ షరతాధార న్యాయవాక్యంలో అసంపూర్ణ క్రియ చట్టపరమైన బాధ్యతను వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘ఇవ్వాలి’ సహజమైన విధ్యర్థకం.
- source_word: לַאדֹנָיו
  choice: ఆ దాసుని లేదా దాసి యజమానికి
  rationale: ప్రత్యయం తాజాగా ప్రస్తావించిన దాసుడు లేదా దాసినే సూచించడం అత్యంత సహజం. తెలుగులో సంభావ్య అస్పష్టతను నివారించేందుకు సంబంధాన్ని స్పష్టంగా తెలిపింది.
- source_word: יִסָּקֵל
  choice: రాళ్లతో కొట్టి చంపాలి
  rationale: סקל నిఫల్ రూపం రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది; తెలుగులో కేవలం ‘రాళ్లతో కొట్టాలి’ అనడం మరణఫలితాన్ని తగినంత స్పష్టంగా చెప్పదు.
