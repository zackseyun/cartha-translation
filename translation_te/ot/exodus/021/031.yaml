translation:
  language: te
  text: అది కుమారుడిని గానీ కుమార్తెను గానీ కొమ్ములతో పొడిస్తే, అతనికి కూడా ఇదే న్యాయవిధానం అమలు చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఎద్దు కుమారుడిని లేదా కుమార్తెను కొమ్ములతో పొడిచిన సందర్భంలో కూడా, ముందటి వచనంలో చెప్పిన అదే న్యాయపరమైన శిక్ష దాని యజమానికి వర్తిస్తుంది. “ఈ న్యాయవిధానం” అనే మాటను “ఈ తీర్పు,” “ఈ నియమం,” లేదా “ఈ శాసనం” అని కూడా అనువదించవచ్చు.
