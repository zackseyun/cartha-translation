lexical_decisions:
- source_word: אוֹ
  choice: పొడిచినా
  rationale: ఇక్కడ אוֹ ప్రత్యామ్నాయ న్యాయపరిస్థితులను కలుపుతుంది. తెలుగులో ‘-ఇనా ... -ఇనా’ నిర్మాణం ‘కుమారుడైనా కుమార్తెయైనా’ అనే రెండు సందర్భాలను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בֵן
  choice: కుమారుణ్ణి
  rationale: בן యొక్క లింగ-నిర్దిష్ట అర్థమైన ‘కుమారుడు’ను నిలుపుతూ, בתతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: יִגָּח
  choice: పొడిచినా
  rationale: נגח అంటే కొమ్ములతో పొడవడం. ముందు వచనంలోని ఎద్దే కర్త కాబట్టి తెలుగులో ‘అది’ అని స్పష్టపరచబడింది.
- source_word: בַת
  choice: కుమార్తెను
  rationale: בת యొక్క ప్రత్యక్ష అర్థమైన ‘కుమార్తె’ను నిలుపుతూ, ‘కుమారుడు’తో ఉన్న న్యాయపరమైన సమాంతరతను కాపాడుతుంది.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: ఈ నియమం ప్రకారమే
  rationale: משפט ఇక్కడ ముందటి వచనంలో నిర్దేశించిన న్యాయనియమం లేదా తీర్పును సూచిస్తుంది. ‘నియమం’ ఆధునిక తెలుగులో సహజంగా ఉండి, న్యాయసందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יֵעָשֶׂה לּוֹ
  choice: దాని యజమానికి చేయాలి
  rationale: హీబ్రూ నిష్క్రియ నిర్మాణమైన ‘అతనికి చేయబడాలి’ భావాన్ని సహజమైన తెలుగు న్యాయశైలిలో అందిస్తుంది. సందర్భానుసారం לו సూచించేది ఎద్దు యజమానినే కావడంతో అస్పష్టమైన పురుష సర్వనామానికి బదులు అతనిని స్పష్టంగా పేర్కొంది.
