source:
  edition: WLC
  text: וְ/הִגְבַּלְתָּ֤ אֶת הָ/עָם֙ סָבִ֣יב לֵ/אמֹ֔ר הִשָּׁמְר֥וּ לָ/כֶ֛ם עֲל֥וֹת בָּ/הָ֖ר וּ/נְגֹ֣עַ בְּ/קָצֵ֑/הוּ כָּל הַ/נֹּגֵ֥עַ בָּ/הָ֖ר מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: te
  text: 'ప్రజల చుట్టూ హద్దులు నిర్ణయించి, వారితో ఇలా చెప్పు: ‘మీరు కొండ ఎక్కకుండా, దాని అంచును తాకకుండా జాగ్రత్తపడండి. కొండను తాకే ప్రతి వ్యక్తి తప్పకుండా చంపబడాలి.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తప్పకుండా చనిపోవాలి.” హీబ్రూలో ఇది మరణం నిశ్చయమని నొక్కిచెప్పే ప్రయోగం. ఇక్కడ నిష్క్రియ క్రియారూపాన్ని, తరువాతి వచనంలో ఇతరులు అమలు చేసే మరణశిక్ష సందర్భాన్ని ప్రతిబింబించడానికి “తప్పకుండా చంపబడాలి” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: హద్దులు ఏర్పరచి
  rationale: גבל హిఫిల్ రూపం ఒక పరిమితిని లేదా సరిహద్దును నిర్దేశించడాన్ని సూచిస్తుంది. సందర్భంలో కొండ చుట్టూ ప్రవేశ పరిమితి ఏర్పాటు చేయడం ఉద్దేశం.
- source_word: הָעָם סָבִיב
  choice: ప్రజలు చుట్టూ
  rationale: עם సమకూడిన ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది; סביב హద్దు వారిని చుట్టుముట్టేలా ఉండాలని తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: వారితో ఇలా చెప్పు
  rationale: ఈ క్రియారూపం తరువాత వచ్చే ఆజ్ఞలోని మాటలను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యక్ష సంభాషణకు ఇది సహజమైన రూపం.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: జాగ్రత్తపడండి
  rationale: שׁמר నిఫాల్ ఆజ్ఞారూపం לָכֶםతో కలిసి తమను తాము కాపాడుకుంటూ అప్రమత్తంగా ఉండాలనే బలమైన హెచ్చరికను ఇస్తుంది.
- source_word: עֲלוֹת בָּהָר
  choice: కొండ ఎక్కకుండా
  rationale: עלה మరియు בָּהָר కలయిక కొండపైకి ఎక్కడాన్ని సూచిస్తుంది; నిషేధ భావం ముందున్న హెచ్చరిక ద్వారా వస్తుంది.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: దాని అంచును తాకకుండా
  rationale: נגע ‘తాకు’ అని, קצהו ‘దాని అంచు/చివర’ అని అర్థం. ఏర్పాటు చేసిన హద్దుకు సంబంధించిన స్థలార్థాన్ని ‘అంచు’ నిలుపుతుంది.
- source_word: כָּל הַנֹּגֵעַ בָּהָר
  choice: కొండను తాకే ప్రతి వ్యక్తి
  rationale: ఈ నిర్మాణం ఎవరినీ మినహాయించని సాధారణ, పంపిణీ భావాన్ని ఇస్తుంది. ‘ప్రతి వ్యక్తి’ ఆ విశ్వవ్యాప్త హెచ్చరికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా చంపబడాలి
  rationale: క్రియావిశేషక infinitive absoluteతో కూడిన హోఫాల్/నిష్క్రియ క్రియారూపం మరణశిక్ష యొక్క నిశ్చయాన్ని బలపరుస్తుంది. తరువాతి వచనంలో ఇతరులచేత శిక్ష అమలు కావడం వల్ల నిష్క్రియ భావాన్ని నిలిపాం.
theological_decisions:
- issue: מוֹת יוּמָת అనే మరణ సూత్రం సహజ మరణాన్నా లేక విధించబడే మరణశిక్షనానా సూచిస్తుంది?
  choice: తప్పకుండా చంపబడాలి
  alternative: తప్పకుండా చనిపోవాలి
  rationale: హీబ్రూ రూపం నిష్క్రియగా ఉంది; తదుపరి వచనం శిక్షను సమాజం అమలు చేయడాన్ని వివరిస్తుంది. అయినా ఈ సూత్రానికి ‘నిశ్చయంగా మరణిస్తాడు’ అనే విస్తృత భావసాధ్యత ఉన్నందున దాన్ని పాదటీకలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘హద్దులు ఏర్పరచి’ భౌతిక పరిమితిని స్పష్టపరుస్తుంది; ‘జాగ్రత్తపడండి’ హెచ్చరిక బలాన్ని సహజంగా అందిస్తుంది. పాదటీక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత మరణ సూత్రం తరువాత ఉంచబడింది.
