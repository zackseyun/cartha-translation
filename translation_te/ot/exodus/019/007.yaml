  text: וַ/יָּבֹ֣א מֹשֶׁ֔ה וַ/יִּקְרָ֖א לְ/זִקְנֵ֣י הָ/עָ֑ם וַ/יָּ֣שֶׂם לִ/פְנֵי/הֶ֗ם אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: te
  text: మోషే వచ్చి, ప్రజల పెద్దలను పిలిచి[a], యెహోవా తనకు ఆజ్ఞాపించిన ఈ మాటలన్నిటినీ[b] వారి ఎదుట ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజల పెద్దలను పిలవడానికి పంపి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ విషయాలన్నిటినీ’ లేదా ‘ఈ సంగతులన్నిటినీ.’ హెబ్రీ పదం పలికిన మాటలను గానీ, చర్చలో ఉన్న విషయాలను గానీ సూచించగలదు; ఇక్కడ మోషే సందేశాన్ని తెలియజేస్తున్నందున ‘మాటలు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא సందర్భానుసారంగా ‘రావడం’ లేదా ‘వెళ్లడం’ అని అర్థమవుతుంది. ఇక్కడ మోషే యెహోవా సన్నిధి నుండి ప్రజల దగ్గరకు తిరిగి రావడాన్ని కథన దృష్టికోణంలో ‘వచ్చి’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: ప్రజల పెద్దలను పిలిపించి
  rationale: קרא + לְ అనేది పిలవడం, పిలిపించడం అనే భావాలను ఇవ్వగలదు. సందేశం వినేందుకు ప్రతినిధులను సమకూర్చే సందర్భంలో ‘పిలిపించి’ సహజంగా ఉంది; హెబ్రీలో ఉన్నదానికంటే అధిక అధికారబలాన్ని చేర్చదు.
- source_word: זִקְנֵי הָעָם
  choice: ప్రజల పెద్దలు
  rationale: זקנים అనేది వయస్సులో పెద్దవారే కాక, సమాజంలో గుర్తింపు పొందిన సీనియర్ ప్రతినిధులను సూచిస్తుంది. ‘పెద్దలు’ అనే తెలుగు పదం ఆ రెండు ఛాయలనూ నిలుపుతుంది.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: వారి ఎదుట ఉంచాడు
  rationale: שׂים + לפני అనే పదబంధం అక్షరార్థంగా ‘ఎదుట ఉంచడం.’ మాటలను అధికారపూర్వకంగా వారి ముందుంచడం అనే హెబ్రీ నుడికారాన్ని ఈ రూపం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటినీ
  rationale: דברים అనే పదానికి ‘మాటలు,’ ‘విషయాలు,’ ‘సంగతులు’ అనే అర్థాలు ఉండవచ్చు. ముందటి వచనాల్లోని దైవసందేశాన్ని మోషే తెలియజేస్తున్నందున ప్రధాన పాఠ్యంలో ‘మాటలు’ సరిపోతుంది; విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: యెహోవా తనకు ఆజ్ఞాపించిన
  rationale: సంబంధవాచక ఉపవాక్యం ఈ సందేశానికి మూలమూ అధికారమూ యెహోవాయేనని తెలియజేస్తుంది. ‘తనకు’ అన్నది -הוּ లోని మోషేను సూచించే కర్మప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ప్రతిలిపి చేశాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో సాధారణ బిరుదు కాకుండా టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. కాబట్టి నిబంధన సంబంధ దైవనామాన్ని కనిపించేలా ఉంచి, దానిని ‘ప్రభువు’గా మార్చలేదు.
- issue: דברים యొక్క మాటలు/విషయాలు అనే అర్థవిస్తృతి
  choice: ప్రధాన పాఠ్యంలో ‘మాటలు’
  alternative: ‘విషయాలు’ లేదా ‘సంగతులు’
  rationale: సీనాయి సందర్భంలో మోషే యెహోవా పలికిన సందేశాన్ని అందిస్తున్నాడు కాబట్టి ‘మాటలు’ సముచితం. అయినప్పటికీ హెబ్రీ పదంలోని విస్తృత భావాన్ని పాదటిప్పణి ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించాం. ‘ప్రజల పెద్దలు,’ ‘వారి ఎదుట ఉంచాడు’ వంటి బైబిలు సందర్భానికి తగిన, సాధారణ పాఠకులకు అర్థమయ్యే పదబంధాలు వాడాం. మూలంలోని వరుస క్రియలను తెలుగు ప్రవాహానికి అనుగుణంగా అసమాపక క్రియలతో కలిపాం; దైవనామాన్ని ‘యెహోవా’గా నిలిపాం.
