  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: te
  text: వారు మూడవ రోజు కోసం సిద్ధంగా ఉండాలి, ఎందుకంటే మూడవ రోజున యాహ్వే ప్రజలందరి కళ్ల ఎదుట సీనాయి పర్వతంపైకి దిగివస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ נְכֹנִים
  choice: వారు ... సిద్ధంగా ఉండాలి
  rationale: ముందున్న ఆదేశాల సందర్భంలో ఈ రూపానికి ఆజ్ఞాత్మక భావం ఉంది. ‘సిద్ధంగా ఉండాలి’ ఆధునిక తెలుగులో సహజంగా ఉండి, అవసరమైన సిద్ధతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజు కోసం
  rationale: ל ఇక్కడ సిద్ధత ఉద్దేశించిన రోజును సూచిస్తుంది. ‘కోసం’ అనేది గడువును మాత్రమే సూచించకుండా, ఆ రోజు నిమిత్తమైన సిద్ధతను తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆదేశానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יֵרֵד
  choice: దిగివస్తాడు
  rationale: ירד యొక్క దిగివచ్చే కదలికను, ప్రజల వైపు జరిగే దైవ ప్రత్యక్షత సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: לְעֵינֵי כָל הָעָם
  choice: ప్రజలందరి కళ్ల ఎదుట
  rationale: హీబ్రూ పదబంధంలోని దృశ్యాత్మకతను నిలుపుతూ, ప్రజలందరికీ ప్రత్యక్షంగా కనిపించే విధంగా అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל הַר סִינָי
  choice: సీనాయి పర్వతం మీదికి
  rationale: ירדతో కలిసి עַל పర్వతాన్ని దిగివచ్చే గమ్యస్థానంగా సూచిస్తుంది; ‘మీదికి’ ఆ కదలికను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలభాషా సాక్ష్యాన్ని కాపాడుతుంది; ‘యెహోవా’ వేరొక సంప్రదాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని కారణ సంబంధం మరియు ప్రత్యక్ష దృశ్యభావం నిలుపబడ్డాయి.
