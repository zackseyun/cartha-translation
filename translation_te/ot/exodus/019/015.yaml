source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: te
  text: అప్పుడు అతడు ప్రజలతో, “మూడు రోజులపాటు సిద్ధంగా ఉండండి; స్త్రీ దగ్గరకు వెళ్లకండి[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “స్త్రీ దగ్గరకు వెళ్లకండి.” ఈ సందర్భంలో ఇది సిద్ధపడే కాలంలో లైంగిక సంబంధాలకు దూరంగా ఉండాలనే సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... చెప్పాడు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో తెలియజేస్తుంది; కాలసూక్ష్మతను అతిగా నిర్ధారించదు.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ సమకూడిన ఇశ్రాయేలీయులను సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ సహజమైన ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: הֱיוּ נְכֹנִים
  choice: సిద్ధంగా ఉండండి
  rationale: היהతో נכון కలయిక సిద్ధతకు ఇచ్చిన ఆజ్ఞను సూచిస్తుంది; ఈ సందర్భంలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులపాటు
  rationale: హీబ్రూ పదబంధాన్ని సిద్ధత కొనసాగే మూడు రోజుల కాలంగా ప్రతిబింబిస్తుంది; ‘మూడవ రోజుకు’ అని మార్చి సందర్భాన్ని అతిగా స్పష్టీకరించదు.
- source_word: אַל תִּגְּשׁוּ
  choice: దగ్గరకు వెళ్లకండి
  rationale: אַלతో వచ్చిన క్రియ నిషేధాన్ని సూచిస్తుంది; נגשׁ యొక్క ‘సమీపించు’ భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֶל אִשָּׁה
  choice: స్త్రీ దగ్గరకు
  rationale: మూలంలోని ‘ఒక స్త్రీ దగ్గరకు’ అనే సభ్యోక్తిని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: శుద్ధీకరణ సిద్ధత సమయంలో లైంగిక సంబంధాలకు దూరంగా ఉండాలనే భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చెప్పాలా
  choice: హీబ్రూ సభ్యోక్తిని ‘స్త్రీ దగ్గరకు వెళ్లకండి’గా ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘స్త్రీతో లైంగిక సంబంధం పెట్టుకోకండి’ లేదా ‘మీ భార్యల దగ్గరకు వెళ్లకండి’
  rationale: మూలం స్పష్టమైన లైంగిక క్రియాపదాన్ని కాక సభ్యోక్తిని ఉపయోగిస్తుంది. దానిని నిలుపడం మూలంలోని భాషా మితిని, భావ ఉద్వేగాన్ని కాపాడుతుంది; పాదసూచిక సందర్భార్థాన్ని పారదర్శకంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని సభ్యోక్తి ప్రధాన పాఠ్యంలో ఉంచబడింది.
