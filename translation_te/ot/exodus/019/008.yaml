source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: te
  text: 'ప్రజలందరూ కలిసి ఇలా జవాబిచ్చారు: “యహ్వే చెప్పినదంతా మేము చేస్తాం.” అప్పుడు మోషే ప్రజల మాటలను యహ్వేకు తిరిగి తెలియజేశాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల మాటలను యహ్వేకు తిరిగి తీసుకెళ్లాడు.”
    reason: וַיָּשֶׁב అనే హిఫీల్ క్రియకు మాటలను ‘తిరిగి తీసుకెళ్లడం’ అనే రూపక భావమూ, వాటిని ‘తిరిగి తెలియజేయడం/నివేదించడం’ అనే సందర్భార్థమూ ఉన్నాయి.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: జవాబిస్తూ
  rationale: ఈ సంభాషణ సందర్భంలో ענה మాటలతో స్పందించడాన్ని సూచిస్తుంది; తరువాత వచ్చే ప్రత్యక్ష ఉక్తితో సహజంగా కలుస్తుంది.
- source_word: כָל הָעָם יַחְדָּו
  choice: ప్రజలందరూ ఏకంగా
  rationale: כָל הָעָם యొక్క సమూహార్థాన్నీ, יַחְדָּו నొక్కిచెప్పే ఐక్య స్పందననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: చెప్పినదంతా
  rationale: ‘చెప్పిన సమస్తం’ అనే భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: נַעֲשֶׂה
  choice: మేము చేస్తాం
  rationale: עשה అనే క్రియ యొక్క ప్రత్యక్ష ‘చేయు’ అర్థాన్ని నిలుపుతుంది; సందర్భంలో విధేయత అంతర్లీనంగా ఉన్నా ‘లోబడతాం’ అనే వివరణాత్మక భావాన్ని చేర్చదు.
- source_word: וַיָּשֶׁב
  choice: తిరిగి తెలియజేశాడు
  rationale: שוב హిఫీల్ రూపంలోని ‘తిరిగి తీసుకెళ్లడం/నివేదించడం’ భావాలను తెలుగులో స్పష్టంగా కలిపి తెలియజేస్తుంది.
- source_word: דִּבְרֵי הָעָם
  choice: ప్రజల మాటలను
  rationale: ‘మాటలు’ అనే స్పష్టమైన నామవాచకాన్ని నిలుపుతుంది; ‘స్పందన’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: אֶל יְהוָה
  choice: యహ్వేకు
  rationale: אֶל సూచించే దిశ లేదా గ్రహీతను తెలుగు సంప్రదాన విభక్తితో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన రూపంలో లిప్యంతరీకరించబడింది.
- issue: נַעֲשֶׂהను విధేయత పదజాలంతో అనువదించాలా
  choice: మేము చేస్తాం
  alternative: మేము లోబడతాం
  rationale: నిబంధన సందర్భం విధేయతను సూచించినప్పటికీ, హీబ్రూ క్రియ నేరుగా ‘చేస్తాం’ అని చెబుతుంది. మూలంలోని సరళతను నిలుపుతూ వ్యాఖ్యానాన్ని నివారించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఏకంగా’ ప్రజల సమైక్య స్పందనను తెలియజేస్తుంది; ‘తిరిగి తెలియజేశాడు’ హీబ్రూ క్రియ యొక్క దిశాత్మక భావాన్నీ నివేదిక భావాన్నీ సమతుల్యం చేస్తుంది.
