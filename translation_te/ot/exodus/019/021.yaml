  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “కిందికి వెళ్లి ప్రజలను హెచ్చరించు; వారు చూడడానికి యాహ్వే దగ్గరకు చొచ్చుకొని రాకూడదు, లేకపోతే వారిలో చాలామంది పడిపోతారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారిలో చాలామంది పడిపోతారు.” ఈ సందర్భంలో “పడిపోవడం” మరణాన్ని సూచించవచ్చు; అయితే హెబ్రీ మూలం దాన్ని మరింత స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: רֵד
  choice: కిందికి వెళ్లి
  rationale: ירד ఆజ్ఞారూపంలోని దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָעֵד בָּעָם
  choice: ప్రజలను హెచ్చరించు
  rationale: ఈ సందర్భంలో Hifil రూపం ప్రజలకు గంభీరమైన హెచ్చరిక ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: פֶּן
  choice: రాకూడదు; అలా వస్తే
  rationale: హెచ్చరికలోని ప్రతికూల ఉద్దేశం మరియు సంభవించగల పరిణామం తెలుగులో సహజంగా వ్యక్తమవుతాయి.
- source_word: יֶהֶרְסוּ אֶל־יְהוָה
  choice: యెహోవాను ... హద్దు దాటి చొచ్చుకొని రాకూడదు
  rationale: הרס ఇక్కడ ఏర్పరచిన సరిహద్దును బలవంతంగా అతిక్రమించి దేవుని సన్నిధివైపు రావడాన్ని సూచిస్తుంది; సందర్భంలో అంతర్లీనమైన హద్దును స్పష్టపరచడం తెలుగులో భావాన్ని సహజంగా చేస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה క్రియకు ఇక్కడ ఉద్దేశార్థక భావం ఉంది; ‘చూడడానికి’ అనేది ‘చూచుటకు/తిలకించుటకు’ కంటే సాధారణమైనది, మూలంలోని చూడటం/కనటం అనే విస్తృతిని నిలుపుతుంది.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: వారిలో చాలామంది పడిపోతారు
  rationale: נפל అనే ‘పడిపోవు’ మాటను మరణం అని స్పష్టీకరించకుండా ఉంచి, తీర్పు సందర్భంలోని అంతర్లీన తీవ్రతను కాపాడాం; מִמֶּנּוּ רָבను సహజంగా ‘వారిలో చాలామంది’గా ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగులో దీర్ఘకాలంగా స్థిరపడిన, సాధారణ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: ‘పడిపోతారు’ అనే పరిణామం మరణాన్ని సూచిస్తుందా
  choice: పడిపోతారు
  alternative: చనిపోతారు
  rationale: సందర్భంలో మరణం సూచితమై ఉండవచ్చు; అయితే హెబ్రీ మూలం నేరుగా ‘పడిపోవు’ అనే క్రియనే వాడుతుంది. అందువల్ల వచనంలో అస్పష్టతను నిలిపి, పాదటీపులో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ఆజ్ఞ, హెచ్చరిక, మరియు ‘పడిపోవు’ అనే ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి. అన్ని పాదటీపు గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
