- from: 'యెహోవా మోషేతో ఇలా అన్నాడు: “కిందికి వెళ్లి ప్రజలను హెచ్చరించు. వారు యెహోవాను చూడడానికి హద్దు దాటి చొచ్చుకొని రాకూడదు; అలా వస్తే వారిలో చాలామంది పడిపోతారు.[a]”'
  to: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “కిందికి వెళ్లి ప్రజలను హెచ్చరించు; వారు చూడడానికి యాహ్వే దగ్గరకు చొచ్చుకొని రాకూడదు, లేకపోతే వారిలో చాలామంది పడిపోతారు.[a]”'
