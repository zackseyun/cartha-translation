source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: te
  text: 'మోషే దేవుని వద్దకు ఎక్కి వెళ్లాడు. అప్పుడు యాహ్వే పర్వతం నుండి అతన్ని పిలిచి ఇలా అన్నాడు: “యాకోబు ఇంటివారికి ఇలా చెప్పు; ఇశ్రాయేలు కుమారులకు[a] తెలియజేయి:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు పిల్లలకు,” “ఇశ్రాయేలు ప్రజలకు.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులకు” అని ఉంది; ఇది పుంలింగ సామూహిక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה אֶל הָאֱלֹהִים
  choice: దేవుని దగ్గరికి ఎక్కి వెళ్లాడు
  rationale: עָלָהలోని పైకి వెళ్లే స్థలార్థాన్ని ‘ఎక్కి వెళ్లాడు’ సహజంగా నిలుపుతుంది; אֶל‌ను ‘దగ్గరికి’గా అనువదించడం గమ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేవుడు’ సహజమైన సమానార్థకం.
- source_word: וַיִּקְרָא אֵלָיו
  choice: అతన్ని పిలిచి
  rationale: קרא אֶל అనేది ఒకరి వైపు పిలవడాన్ని సూచిస్తుంది. తెలుగులో ‘అతన్ని పిలిచి’ సహజంగా ఉండి, తరువాతి ప్రత్యక్ష వాక్యానికి అనుసంధానమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన రూపాన్ని లిప్యంతరీకరించింది.
- source_word: מִן הָהָר
  choice: పర్వతం మీద నుంచి
  rationale: הַר ఇక్కడ సందర్భానుసారం సీనాయి పర్వతాన్ని సూచిస్తుంది; מִן మూలస్థానాన్ని తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: ఈ క్రియారూపం ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా అన్నాడు’ స్పష్టమైన, సహజమైన నిర్మాణం.
- source_word: כֹּה תֹאמַר
  choice: ఇలా చెప్పు
  rationale: దైవసందేశాన్ని యథాతథంగా అందించాలనే ఆదేశసూత్రాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: לְבֵית יַעֲקֹב
  choice: యాకోబు ఇంటివారితో
  rationale: ‘యాకోబు ఇల్లు’ అనే సామూహిక, నిబంధనాత్మక భావాన్ని తెలుగులో సహజమైన ‘ఇంటివారు’ రూపంతో నిలుపుతుంది.
- source_word: וְתַגֵּיד
  choice: తెలియజేయి
  rationale: נגד హిఫీల్ రూపంలోని ‘తెలియపరచు/ప్రకటించు’ భావాన్ని, ‘చెప్పు’తో ఉన్న సమాంతరతను కోల్పోకుండా కొద్దిగా వేరైన పదంతో అందిస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులకు
  rationale: בְּנֵי యొక్క పదరూపమైన ‘కుమారులు’ను నిలుపుతూ, ‘యాకోబు ఇంటివారు’తో ఉన్న సమాంతర సామూహిక వ్యక్తీకరణను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత నిబంధన నామాన్ని నేరుగా వాడుతుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- issue: לִבְנֵי יִשְׂרָאֵלలోని పుంలింగ సామూహిక వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు పిల్లలు; ఇశ్రాయేలు ప్రజలు
  rationale: ప్రధాన పాఠంలో హెబ్రీ పదరూపాన్ని నిలిపి, అది సామూహికంగా మొత్తం ప్రజలను సూచించగలదనే విషయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. హెబ్రీ వాక్యంలోని రెండు సమాంతర ఆదేశాలను ‘చెప్పు; … తెలియజేయి’గా నిలిపింది; ప్రత్యక్ష వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర ద్విబిందువు ఉంచింది.
