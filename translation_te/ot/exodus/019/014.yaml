  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: te
  text: అప్పుడు మోషే పర్వతం నుండి ప్రజల వద్దకు దిగివచ్చాడు. అతడు ప్రజలను పవిత్రపరిచాడు[a]; వారు తమ వస్త్రాలను ఉతుక్కున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధపరిచాడు,’ లేదా ‘పవిత్రమైన ఉద్దేశం కోసం ప్రత్యేకపరిచాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివచ్చాడు
  rationale: ירד కిందికి కదలడాన్ని సూచిస్తుంది. పర్వతం నుంచి ప్రజల దగ్గరికి మోషే వెళ్లిన సందర్భంలో ‘దిగివచ్చాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִן הָהָר
  choice: పర్వతం మీద నుంచి
  rationale: సందర్భంలో הַר సీనాయి పర్వతాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో కిందికి రావడాన్ని సహజంగా తెలియజేయడానికి ‘పర్వతం మీద నుంచి’ అని అనువదించబడింది.
- source_word: אֶל הָעָם
  choice: ప్రజల దగ్గరికి
  rationale: עָם అంటే సాధారణంగా ‘ప్రజలు.’ אֶל గమ్యాన్ని సూచిస్తున్నందున ‘ప్రజల దగ్గరికి’ సహజంగా ఉంది; ‘సమాజం’ అనడం మూలపాఠం కంటే నిర్దిష్టమైన భావాన్ని చేర్చుతుంది.
- source_word: וַיְקַדֵּשׁ
  choice: ప్రతిష్ఠించాడు
  rationale: పీయేల్ రూపంలోని קדשׁ ఇక్కడ దేవునితో భేటీ కోసం ప్రజలను పవిత్ర ప్రయోజనానికి సిద్ధపరచడం లేదా ప్రత్యేకపరచడం సూచిస్తుంది. ‘ప్రతిష్ఠించాడు’ ఆ ఆచారపరమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: హీబ్రూ మూలంలోని పునరుక్తిని స్పష్టత కోసం నిలిపి, అదే ‘ప్రజలు’ అనే పదాన్ని వాడింది.
- source_word: וַיְכַבְּסוּ
  choice: ఉతుక్కున్నారు
  rationale: כבס ప్రత్యేకంగా వస్త్రాలను ఉతకడాన్ని సూచిస్తుంది. కర్తల సొంత వస్త్రాలు కావడంతో ‘ఉతుక్కున్నారు’ సహజమైన తెలుగు రూపం.
- source_word: שִׂמְלֹתָם
  choice: తమ వస్త్రాలను
  rationale: שִׂמְלָה దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. ఆచారపరమైన గంభీర సందర్భానికి ‘వస్త్రాలు’ సరిపోతుంది; స్వామ్యాన్ని తెలుగు సహజరీతిలో ‘తమ’ తెలియజేస్తుంది.
theological_decisions:
- issue: సీనాయి దేవదర్శనానికి సిద్ధపడే సందర్భంలోని పవిత్రతకు సంబంధించిన ఆచార భాష
  choice: ప్రజలను ప్రతిష్ఠించాడు
  alternative: ప్రజలను పవిత్రపరిచాడు; ప్రజలను పవిత్రమైన ఉద్దేశం కోసం ప్రత్యేకపరిచాడు
  rationale: ఈ వాక్యం ప్రధానంగా దేవునితో భేటీకి ఆచారపరమైన సిద్ధతను వివరిస్తుంది; నైతిక అంతరంగ పరివర్తనను స్పష్టంగా పేర్కొనదు. ‘ప్రతిష్ఠించాడు’ ప్రత్యేకపరచడం, సిద్ధపరచడం అనే భావాలను నిలుపుతూ తరువాతి సిద్ధాంతపరమైన భావాలను అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘ప్రతిష్ఠించాడు’ అనే ఆచారపరమైన పదానికి సాధారణ పాఠకునికి భావవిస్తృతి తెలియజేయడానికి పాదసూచిక జోడించబడింది.
