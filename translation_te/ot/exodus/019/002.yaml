  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: te
  text: వారు రెఫీదీము నుండి బయలుదేరి సీనాయి అరణ్యానికి వచ్చి, ఆ అరణ్యంలో మకాం వేశారు. అక్కడ ఇశ్రాయేలు పర్వతానికి ఎదురుగా[a] మకాం వేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పర్వతం ఎదుట.’ హీబ్రూ పదం ఏదైనా వస్తువుకు ఎదురుగా లేదా దాని ముందు ఉన్న స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵרְפִידִים
  choice: వారు రెఫీదీము నుండి బయలుదేరి
  rationale: נסע ప్రయాణ కథనంలో మకాం ఎత్తి బయలుదేరడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బయలుదేరి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; స్థలనామాన్ని ‘రెఫీదీము’గా లిప్యంతరీకరించాం.
- source_word: וַיָּבֹאוּ מִדְבַּר סִינַי
  choice: సీనాయి అరణ్యానికి వచ్చారు
  rationale: בוא అనే విస్తృతార్థక క్రియకు సందర్భానుసారంగా ‘వచ్చారు’ సహజం. מִדְבַּר‌ను నివాసరహిత అరణ్యప్రాంతం అనే భావంలో ‘అరణ్యం’గా, סִינַיను ‘సీనాయి’గా ఇచ్చాం.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: వారు ఆ అరణ్యంలో మకాం వేశారు
  rationale: חנה అంటే శిబిరం లేదా మకాం వేయడం. ‘మకాం వేశారు’ సాధారణ ఆధునిక తెలుగు; పునరుక్తమైన מִדְבָּר‌ను మూలంలోని కథన నిర్మాణాన్ని నిలుపుతూ మళ్లీ పేర్కొన్నాం.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: అక్కడ ఇశ్రాయేలు ... మకాం వేసింది
  rationale: శָׁם స్థానానికి ఉన్న స్వల్ప ప్రాధాన్యాన్ని ‘అక్కడ’తో ముందుంచాం. ఏకవచన క్రియతో ఉన్న יִשְׂרָאֵל‌ను జాతిసమూహాన్ని సూచించే సమష్టి ఏకవచనంగా ‘ఇశ్రాయేలు ... వేసింది’ అని ఉంచాం.
- source_word: נֶגֶד הָהָר
  choice: పర్వతం ఎదురుగా
  rationale: נֶגֶד ఏదైనా వస్తువుకు ఎదురుగా, ఎదుట, లేదా ముందు ఉన్న స్థానాన్ని సూచించగలదు. ‘పర్వతం ఎదురుగా’ spatial relationను సహజ తెలుగులో తెలియజేస్తూ దిశను అతిగా నిర్దిష్టం చేయదు.
