  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ‘అరణ్యం’ మరియు ‘మకాం’ పునరుక్తిని నిలిపాం. ఇశ్రాయేలును సమష్టి ఏకవచనంగా పరిగణించి తెలుగు క్రియను ఏకవచనంలో ఉంచాం.
