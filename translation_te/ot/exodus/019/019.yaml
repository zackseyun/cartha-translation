  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ ק֣וֹל הַ/שּׁוֹפָ֔ר הוֹלֵ֖ךְ וְ/חָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְ/הָ/אֱלֹהִ֖ים יַעֲנֶ֥/נּוּ בְ/קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: te
  text: బూర ధ్వని అంతకంతకూ బలపడుతూ వచ్చింది[a]. మోషే మాట్లాడేవాడు, దేవుడు అతనికి స్వరంతో[b] జవాబిచ్చేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతకంతకూ బిగ్గరగా వినిపించింది.” హెబ్రీలో అక్షరార్థంగా బూర ధ్వని “కొనసాగుతూ, చాలా బలంగా అవుతోంది” అని వర్ణించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఉరుముతో” లేదా “వినిపించేలా.” హెబ్రీలో “స్వరంతో” లేదా “ధ్వనితో” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చింది
  rationale: ఈ రూపం కథనంలోని తదుపరి పరిణామాన్ని పరిచయం చేస్తుంది. దాని భావాన్ని తరువాతి కొనసాగుతున్న చర్యతో కలిపి సహజమైన తెలుగు వాక్యంగా అందించాం.
- source_word: קוֹל הַשּׁוֹפָר
  choice: బూర ధ్వని
  rationale: קוֹל ఇక్కడ శబ్దం లేదా ధ్వని అని, שׁוֹפָר ఊదే కొమ్ము వాద్యమని సూచిస్తాయి. ఆధునిక తెలుగులో ‘బూర ధ్వని’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: అంతకంతకు మరింత బలపడుతూ వచ్చింది
  rationale: హెబ్రీ పదబంధం నిరంతరంగా పెరుగుతున్న తీవ్రతను తెలియజేస్తుంది. ‘బలపడుతూ’ అనేది కేవలం శబ్ద పరిమాణానికే పరిమితం కాకుండా మూలంలోని ‘బలంగా కావడం’ అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: మోషే మాట్లాడేవాడు
  rationale: అసంపూర్ణ క్రియారూపం ఈ దృశ్యంలో కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను సూచించగలదు. ‘మాట్లాడేవాడు’ తరువాతి ప్రతిస్పందనతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
- source_word: וְהָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో నిర్దిష్టంగా ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; తెలుగులో అదనపు నిర్దేశక పదం అవసరం లేదు.
- source_word: יַעֲנֶנּוּ
  choice: అతనికి ... జవాబిచ్చేవాడు
  rationale: ప్రత్యయంతో కూడిన క్రియకు ‘అతనికి జవాబివ్వడం’ అనే అర్థం ఉంది. అసంపూర్ణ క్రియారూపంలోని కొనసాగుతున్న లేదా పునరావృత భావాన్ని ‘జవాబిచ్చేవాడు’ నిలుపుతుంది.
- source_word: בְּקוֹל
  choice: స్వరంతో
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘స్వరంతో/ధ్వనితో’ అని ఉంటుంది. దానిని ‘ఉరుముతో’ అని నిర్దిష్టంగా వ్యాఖ్యానించకుండా మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సీనాయి వద్ద దేవుని జవాబు స్వభావం
  choice: దేవుడు మోషేకు ‘స్వరంతో’ జవాబిచ్చాడు
  alternative: దేవుడు అతనికి ఉరుములో జవాబిచ్చాడు; లేదా వినిపించేలా జవాబిచ్చాడు
  rationale: בְּקוֹל అనే హెబ్రీ పదబంధం ‘స్వరంతో’ లేదా ‘ధ్వనితో’ అనే విస్తృతార్థాన్ని కలిగి ఉంది; ఈ వచనం ఉరుము అని స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠం మూలంలోని అనిశ్చితిని నిలుపుతుంది; సాధ్యమైన వివరణలు పాదసూచికలో ఉన్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడబడింది. ‘బలపడుతూ’ మూలంలోని తీవ్రత పెరుగుదలను కాపాడుతుంది; ‘స్వరంతో’ దేవుని జవాబు ఉరుమా, వేరే వినిపించే స్వరమా అనే అంశాన్ని అనవసరంగా పరిష్కరించదు.
