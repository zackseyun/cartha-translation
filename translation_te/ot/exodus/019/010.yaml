    text: లేదా “వారిని పవిత్రులుగా ప్రత్యేకించు.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a potentially misleading installation/dedication term with the direct modern Telugu equivalent for ritual sanctification. It retains the source’s imperative sequence, its two-day preparation period, and the command that the people wash their garments. The footnote preserves the semantic aspect of being set apart as holy without importing doctrinal interpretation.
