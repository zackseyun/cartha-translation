revisions:
- from: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల దగ్గరికి వెళ్లి, నేడు రేపు వారిని ప్రతిష్ఠించు[a]. వారు తమ వస్త్రాలను ఉతుక్కోవాలి.”'
  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల దగ్గరికి వెళ్లి, ఈ రోజు, రేపు వారిని పవిత్రపరచు[a]. వారు తమ వస్త్రాలను ఉతుక్కోవాలి.”'
  rationale: The revision replaces a potentially misleading installation/dedication term with the direct modern Telugu equivalent for ritual sanctification. It retains the source’s imperative sequence, its two-day preparation period, and the command that the people wash their garments. The footnote preserves the semantic aspect of being set apart as holy without importing doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sequential speech, Yahweh’s command to Moses, the two-day period, and the washing of garments. However, “ప్రతిష్ఠించు” normally means install/dedicate or consecrate an object/person into office in modern Telugu and can suggest an act of installation rather than the required ritual sanctification/preparation of the people. “పవిత్రపరచు” more directly represents the Piel of קדשׁ here while retaining its ritual sense.
  naturalness: The sentence is clear and modern. “నేడు రేపు” is natural, though “ఈ రోజు, రేపు” is slightly more explicit in a formal translation. “వారు ... ఉతుక్కోవాలి” is acceptable as the commanded result.
  terminology: “యాహ్వే,” “మోషే,” “ప్రజలు,” and “వస్త్రాలు” are appropriate. Revising the central ritual term to “పవిత్రపరచు” improves semantic precision. The footnote should then offer “పవిత్రులుగా ప్రత్యేకించు” as the explanatory alternative rather than treating the direct translation as only an alternative.
  issues:
  - severity: medium
    issue: ‘వారిని ప్రతిష్ఠించు’ for וְקִדַּשְׁתָּם
    rationale: In modern standard Telugu, ‘ప్రతిష్ఠించు’ commonly denotes installing, inaugurating, or dedicating, especially an image, structure, or office-holder. The Hebrew here commands Moses to sanctify the people for Yahweh’s coming, not to install or inaugurate them. ‘వారిని పవిత్రపరచు’ is more direct and preserves the ritual-preparatory force.
  revised_text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల దగ్గరికి వెళ్లి, ఈ రోజు, రేపు వారిని పవిత్రపరచు[a]. వారు తమ వస్త్రాలను ఉతుక్కోవాలి.”'
  revised_footnotes:
