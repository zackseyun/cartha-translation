id: EXO.19.10
reference: Exodus 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల దగ్గరికి వెళ్లి, ఈ రోజు, రేపు వారిని పవిత్రపరచు[a]. వారు తమ వస్త్రాలను ఉతుక్కోవాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని పవిత్రులుగా ప్రత్యేకించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపే క్రమార్థాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: לֵךְ אֶל־הָעָם
  choice: ప్రజల దగ్గరికి వెళ్లి
  rationale: ఆజ్ఞార్థకమైన ‘వెళ్లు’ అనే భావాన్నీ, ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే ‘ప్రజలు’ అనే భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: וְקִדַּשְׁתָּם
  choice: వారిని ప్రతిష్ఠించు
  rationale: దైవసన్నిధిని ఎదుర్కొనేందుకు ప్రజలను పవిత్రంగా సిద్ధపరచి ప్రత్యేకించాలనే పియేల్ రూపంలోని ఆచారసంబంధ భావాన్ని ‘ప్రతిష్ఠించు’ నిలుపుతుంది.
- source_word: הַיּוֹם וּמָחָר
  choice: నేడు రేపు
  rationale: రెండు రోజుల సిద్ధపాటు కాలాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: వారు తమ వస్త్రాలను ఉతుక్కోవాలి
  rationale: బహువచన క్రియకు ప్రజలనే కర్తలుగా ఉంచి, ఆదేశిత ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘వస్త్రాలు’ ఆచారసందర్భానికి తగిన గౌరవభరిత పదం.
theological_decisions:
- issue: קדשׁ పదంలోని ఆచారపరమైన సిద్ధపాటు భావం
  choice: ప్రతిష్ఠించు
  alternative: పవిత్రపరచు; పవిత్రమైనవారిగా ప్రత్యేకించు
  rationale: ఇక్కడ ప్రధానంగా సీనాయి వద్ద దేవుని సన్నిధికి ప్రజలను సిద్ధపరచడం ఉద్దేశం. ‘ప్రతిష్ఠించు’ ఆచారపరమైన, ఒడంబడికసంబంధ భావాన్ని నిలుపుతూ, కేవలం అంతరంగ నైతిక మార్పుగా అర్థాన్ని పరిమితం చేయదు.
- issue: יְהוָה దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే సీనాయి సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ప్రతిష్ఠించు’కు సంబంధించిన ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచి మూలంలోని పవిత్రీకరణ–ప్రత్యేకీకరణ భావవ్యాప్తిని కాపాడాం.
