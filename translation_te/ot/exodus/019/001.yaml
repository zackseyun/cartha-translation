base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] ఐగుప్తు దేశం నుండి బయలుదేరిన తరువాత మూడవ నెలలో, సరిగ్గా ఇదే రోజున[b] వారు సీనాయి అరణ్యానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఈ రోజున.’ ఈ పదబంధం వారు వచ్చిన ఖచ్చితమైన రోజును నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: మూడవ నెలలో
  rationale: కాలనిర్ణయ సందర్భంలో חֹדֶשׁ సాధారణంగా ‘నెల’ను సూచిస్తుంది; ఈ అనువాదం సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: לְצֵאת
  choice: బయలుదేరిన తరువాత
  rationale: ל తో కూడిన క్రియార్థక నామరూపం తరువాతి కాలసూచనకు నిర్గమనాన్ని ఆధారబిందువుగా చూపుతుంది; తెలుగులో ‘బయలుదేరిన తరువాత’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది ఒడంబడిక ప్రజలకు సంప్రదాయ జాతీయ నామంగా ఉపయోగించబడింది. సాధారణ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలో אֶרֶץ ‘దేశం/భూమి’ స్పష్టంగా ఉంది; ‘ఐగుప్తు దేశం నుండి’ పూర్తి పదబంధాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בַּיּוֹם הַזֶּה
  choice: సరిగ్గా ఇదే రోజున
  rationale: ‘ఈ’ అనే సూచనార్థకం మూలంలో స్పష్టంగా ఉంది; ‘సరిగ్గా ఇదే రోజున’ అనేది ఆ పదబంధంలోని దృష్టిపాతాన్ని వ్యక్తం చేస్తుంది, అయితే సరళమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: בוא యొక్క ప్రత్యక్ష సాధారణ అర్థం ‘వచ్చు’; గౌరవ బహువచన రూపం ప్రజాసమూహాన్ని సూచించే సహజ ఆధునిక తెలుగు.
- source_word: מִדְבַּר סִינָי
  choice: సీనాయి అరణ్యానికి
  rationale: מִדְבָּר జనావాసం తక్కువైన అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; ‘సీనాయి అరణ్యం’ నిర్మాణ సంబంధాన్ని కాపాడుతూ పరిచితమైన, గౌరవప్రదమైన తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: ఒడంబడిక ప్రజల designation בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: ఇది సిద్ధాంత వివాదాన్ని పరిష్కరించాల్సిన పదబంధం కాదు; అయినప్పటికీ మూలంలోని పితృనామాధారిత జాతీయ designation‌ను పారదర్శకంగా నిలుపుతుంది. తెలుగులో సాధారణమైన జాతినామ ప్రత్యామ్నాయాన్ని పాదసూచికలో అందించడం ద్వారా అర్థస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘ఇశ్రాయేలు కుమారులు’ మూలరూప పారదర్శకతను కాపాడుతుంది; ‘సరిగ్గా ఇదే రోజున’ హీబ్రూ దృష్టిపాతాన్ని తెలియజేస్తుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
