source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: te
  text: మీరు నాకు యాజకుల రాజ్యంగా, పవిత్ర జాతిగా ఉంటారు.[a] నీవు ఇశ్రాయేలు కుమారులతో[b] చెప్పవలసిన మాటలు ఇవే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాజక స్వభావంగల రాజ్యం.” హీబ్రూ పదబంధాన్ని యాజకులతో కూడిన రాజ్యంగా లేదా యాజక లక్షణం గల రాజ్యంగా అర్థం చేసుకోవచ్చు. 1 పేతురు 2:9లో దీనికి సంబంధించిన “రాజసంబంధమైన యాజకత్వం” అనే మాటను పోల్చండి.
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారులు” అనేది హీబ్రూ భాషలో ఇశ్రాయేలు ప్రజలందరినీ సూచించే పదబంధం; ఇది పురుషులను మాత్రమే సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: ఉంటారు
  rationale: היה అనే క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం ఇక్కడ నిబంధన ప్రకటనలో భవిష్యత్తు స్థితిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఉంటారు’ సహజంగా ఉండి, వాగ్దానాత్మక గంభీరతను నిలుపుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: ל ఉపసర్గకు ప్రథమ పురుష ఏకవచన ప్రత్యయం చేరి సంబంధం లేదా చెందినతనాన్ని సూచిస్తుంది; ‘నాకు’ మూలంలోని నిబంధనాత్మక దిశను సంక్షిప్తంగా కాపాడుతుంది.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: యాజకుల రాజ్యం
  rationale: ఈ construct పదబంధానికి నేరమైన అర్థం ‘యాజకుల రాజ్యం.’ ఇది ‘రాజ్యం’ అనే నామవాచకాన్ని నిలుపుతూ, తరువాతి గ్రంథంలోని ‘రాజసంబంధమైన యాజక సమూహం’ అనే రూపాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: גּוֹי קָדוֹשׁ
  choice: పవిత్ర జనం
  rationale: ‘పవిత్రమైన జాతి’ కూడా సాధ్యమే; అయితే ఇక్కడ గּוֹי ఒడంబడిక ప్రజాసమూహాన్ని సూచిస్తున్నందున ‘పవిత్ర జనం’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: మాటలు ఇవే
  rationale: ప్రత్యక్షంగా చెప్పవలసిన సందేశ సందర్భంలో דְּבָרִים కు ‘మాటలు’ సరైన అర్థం; తెలుగు వాక్యక్రమంలో ‘మాటలు ఇవే’ సహజం.
- source_word: תְּדַבֵּר
  choice: చెప్పవలసిన
  rationale: మోషేను ఉద్దేశించిన పియేల్ అసంపూర్ణ ద్వితీయ పురుష ఏకవచన రూపం ఇక్కడ ఆదేశాన్ని వ్యక్తం చేస్తుంది. ‘చెప్పవలసిన’ దాని నిర్దేశక బలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుత్రత్వ రూపాన్ని పారదర్శకంగా నిలుపుతుంది; సందర్భంలో ఇది కేవలం పురుషులను కాక ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: నిబంధన పిలుపులో ఇశ్రాయేలు సమష్టి స్వరూపం
  choice: యాజకుల రాజ్యం
  alternative: యాజక స్వభావంగల రాజ్యం
  rationale: 'మూలంలోని construct పదబంధం ఒకే విధంగా మాత్రమే అర్థం కావాల్సినది కాదు: యాజకులతో కూడిన రాజ్యం లేదా యాజక స్వభావం కలిగిన రాజ్యం అనే భావాలు సాధ్యం. ప్రధాన పాఠం నేరమైన రూపాన్ని ఉంచి, సందిగ్ధతను పాదటిప్పణిలో తెలియజేస్తుంది.'
- issue: లింగరూపంతో ఉన్న నిబంధన సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు
  rationale: మూలపదబంధం వ్యాకరణపరంగా పుంలింగ బహువచన పుత్రత్వ రూపంలో ఉన్నప్పటికీ, వాడుకలో మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ప్రధాన పాఠం రూపాన్ని నిలుపుతూ పాదటిప్పణి పరిధిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన నిబంధన ప్రకటన శైలిని ఉపయోగించాం. బహువచన ‘మీరు/ఉంటారు’ నుంచి మోషేను ఉద్దేశించిన ఏకవచన ‘నీవు’కు మూలంలో ఉన్న మార్పును కాపాడాం. ప్రధాన పాఠంలో మూలంలోని పుత్రత్వ రూపాన్ని ఉంచి, దాని సమగ్ర సామూహిక అర్థాన్ని పాదటిప్పణిలో వివరించాం.
