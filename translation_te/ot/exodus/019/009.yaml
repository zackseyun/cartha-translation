source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: te
  text: 'యెహోవా మోషేతో ఇలా అన్నాడు: “ఇదిగో, ప్రజలు నేను నీతో మాట్లాడడం విని, నిన్ను కూడా ఎప్పటికీ నమ్మేలా నేను దట్టమైన మేఘంలో నీ దగ్గరికి వస్తున్నాను[a].” తరువాత మోషే ప్రజల మాటలను యెహోవాకు తెలియజేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మీద కూడా ఎప్పటికీ విశ్వాసం ఉంచేలా.” ఇక్కడి హీబ్రూ పదబంధం, దేవుడు నియమించిన ప్రతినిధిగా మోషే విశ్వసనీయుడని ప్రజలు నమ్మడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: הִנֵּה אָנֹכִי בָּא
  choice: ఇదిగో, నేను ... వస్తున్నాను
  rationale: הִנֵּה యొక్క దృష్టి ఆకర్షించే గంభీరతను, participle בָּא సూచించే సమీపిస్తున్న కార్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּעַב הֶעָנָן
  choice: దట్టమైన మేఘంలో
  rationale: మేఘపు సాంద్రతను సూచించే హీబ్రూ రూపకాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בַּעֲבוּר
  choice: '...లా ఇలా'
  rationale: తరువాతి రెండు క్రియలకు ఉద్దేశార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: నేను నీతో మాట్లాడేటప్పుడు
  rationale: בְּ + infinitive construct యొక్క కాలసంబంధ భావాన్ని, עִם యొక్క ‘తో’ భావాన్ని కాపాడుతుంది.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: నిన్ను కూడా ... నమ్మేలా
  rationale: אמן Hiphil + ב వ్యక్తపరచే విశ్వాసం లేదా నమ్మకాన్ని సహజమైన తెలుగులో ఇస్తుంది; మోషే దేవుని ధృవీకరించబడిన ప్రతినిధి అనే సందర్భానికి సరిపోతుంది.
- source_word: לְעוֹלָם
  choice: ఎల్లప్పుడూ
  rationale: దీర్ఘకాలికంగా నిలిచే నమ్మకాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּגֵּד ... אֶת דִּבְרֵי הָעָם
  choice: తరువాత మోషే ప్రజల మాటలను ... తెలియజేశాడు
  rationale: కథన క్రమాన్ని ముందుకు తీసుకెళ్లే wayyiqtol ను ‘తరువాత’తో, నివేదించడాన్ని ‘తెలియజేశాడు’తో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
- issue: בְּךָ יַאֲמִינוּ లో మోషేపట్ల నమ్మకం
  choice: నిన్ను కూడా ఎల్లప్పుడూ నమ్మేలా
  alternative: నీమీద కూడా ఎల్లప్పుడూ విశ్వాసముంచేలా
  rationale: ప్రజలు మోషే మాటలను, దేవుని ప్రతినిధిగా అతని విశ్వసనీయతను అంగీకరించాలనే భావాన్ని ఇస్తుంది; ఆ నమ్మకాన్ని ఆరాధనాత్మక విశ్వాసంగా అతిశయింపజేయదు. ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచి హీబ్రూ పదబంధంలోని విస్తృతిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఇదిగో’ మూలంలోని సంభాషణ సూచక గంభీరతను నిలుపుతుంది. ఉద్దేశార్థక వాక్య నిర్మాణం తెలుగులో సహజంగా ఉండేందుకు కారణ వాక్యాన్ని చివర ‘ఇలా వస్తున్నాను’తో ముగించింది; మూలంలోని రెండు సమాంతర ఉద్దేశాలను కాపాడింది.
