- from: ఎవరూ అతణ్ణి చేతితో తాకకూడదు[a]. అతణ్ణి తప్పకుండా రాళ్లతో కొట్టి చంపాలి లేదా బాణంతో కొట్టి చంపాలి[b]. పశువైనా మనిషైనా అది బతకకూడదు. పొట్టేలు కొమ్ము దీర్ఘంగా మోగినప్పుడు[c], వారు కొండపైకి ఎక్కవచ్చు.
  to: ఎవరూ అతణ్ణి చేతితో తాకకూడదు[a]. అతణ్ణి తప్పకుండా రాళ్లతో కొట్టి చంపాలి లేదా బాణాలతో చంపాలి[b]. పశువైనా మనిషైనా, అది ప్రాణంతో ఉండకూడదు. పొట్టేలు కొమ్ము దీర్ఘనాదం వినబడినప్పుడు[c], వారు కొండపైకి ఎక్కవచ్చు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. బాణంతో శిక్షించడాన్ని తెలుగులో సహజంగా చెప్పేందుకు, అలాగే పశువు లేదా మనిషి అనే సమగ్ర సూచనను సజావుగా ఉంచేందుకు స్వల్ప శైలీ సవరణలు చేశాం. యోబేల్‌కు సంబంధించిన సాంస్కృతిక, పదార్థ సందిగ్ధత పాదటిప్పణిలోనే భద్రపరచబడింది.
