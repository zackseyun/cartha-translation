id: EXO.19.13
reference: Exodus 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: te
  text: ఎవరూ అతణ్ణి చేతితో తాకకూడదు[a]. అతణ్ణి తప్పకుండా రాళ్లతో కొట్టి చంపాలి లేదా బాణాలతో చంపాలి[b]. పశువైనా మనిషైనా, అది ప్రాణంతో ఉండకూడదు. పొట్టేలు కొమ్ము దీర్ఘనాదం వినబడినప్పుడు[c], వారు కొండపైకి ఎక్కవచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సర్వనామ ప్రత్యయాన్ని మరింత సాధారణంగా తీసుకుంటే, “ఎవరూ దానిని చేతితో తాకకూడదు.” భావం: హద్దు దాటినదాన్ని నేరుగా తాకకుండా దూరం నుంచే చంపాలి.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “గుచ్చి చంపాలి.” హీబ్రూ క్రియ బాణం వంటి ఆయుధాన్ని ప్రయోగించడాన్ని సూచించగలదు; ఈ సందర్భంలో బాణాలతో చంపడం భావ్యమైనది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదబంధానికి అక్షరార్థం “యోబేల్ సాగదీయబడినప్పుడు”; ఇది పొట్టేలు కొమ్ముతో చేసిన దీర్ఘనాదాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: ఎవరూ అతణ్ణి చేతితో తాకకూడదు
  rationale: ‘ఒక చెయ్యి అతణ్ణి/దానిని తాకకూడదు’ అనే హీబ్రూ న్యాయప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. పురుష ఏకవచన ప్రత్యయం కొండ హద్దు దాటిన అపరాధిని సూచిస్తున్నదని ప్రధాన పాఠం తీసుకుంటుంది.
- source_word: סָקוֹל יִסָּקֵל
  choice: అతణ్ణి తప్పకుండా రాళ్లతో కొట్టి చంపాలి
  rationale: క్రియానామం మరియు సమాపక క్రియ కలయిక శిక్ష యొక్క నిశ్చయతను బలపరుస్తుంది; ‘తప్పకుండా’ ఆ తీవ్రతను, ‘చంపాలి’ మరణశిక్ష భావాన్ని స్పష్టం చేస్తాయి.
- source_word: יָרֹה יִיָּרֶה
  choice: బాణంతో కొట్టి చంపాలి
  rationale: ירה ఇక్కడ దూరం నుంచి ప్రయోగించే ఆయుధంతో కొట్టడాన్ని, సందర్భానుసారం బాణంతో కొట్టడాన్ని సూచించవచ్చు. మరణశిక్ష సందర్భాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘గుచ్చి చంపాలి’ అనే విస్తృతార్థం పాదటిప్పణిలో ఉంచబడింది.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: పశువైనా మనిషైనా
  rationale: రెండు వర్గాలలో ఏదైనా అదే శిక్షకు లోబడుతుందనే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לֹא יִחְיֶה
  choice: అది బతకకూడదు
  rationale: ముందున్న ‘పశువైనా మనిషైనా’ అనే రెండు వర్గాలనూ కలిపి సూచించడానికి తెలుగు నపుంసక ఏకవచనాన్ని వాడి, న్యాయవాక్యపు కఠినతను కాపాడుతుంది.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: పొట్టేలు కొమ్ము దీర్ఘంగా మోగినప్పుడు
  rationale: యోబేల్ అనేది పొట్టేలు కొమ్మును లేదా దాని నాదాన్ని సూచించవచ్చు; משׁך ఆ నాదం సాగదీయబడటాన్ని సూచిస్తుంది. ఆధునిక పాఠకునికి సంకేతం స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: వారు కొండపైకి ఎక్కవచ్చు
  rationale: దీర్ఘ నాదం తరువాత ముందున్న నిషేధం తొలగి అనుమతి లభిస్తుందనే సందర్భార్థాన్ని ‘ఎక్కవచ్చు’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘అతణ్ణి చేతితో తాకకూడదు’లోని పురుష ఏకవచన ప్రత్యయ సూచన
  choice: కొండను తాకి హద్దు దాటిన అపరాధిని సూచిస్తుంది
  alternative: కొండతో సంబంధం వల్ల నిషిద్ధమైన దానిని సాధారణంగా సూచిస్తుంది
  rationale: తక్షణ సందర్భం హద్దు దాటిన మనిషి లేదా పశువు గురించి మాట్లాడుతుంది; అపరాధిని నేరుగా తాకకుండా దూరం నుంచి మరణశిక్ష విధించాలనే వాక్య తర్కానికి వ్యక్తిగత సూచన సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన న్యాయశైలిని పాటించాం. ‘రాళ్లతో కొట్టి చంపాలి’ మరియు ‘బాణంతో కొట్టి చంపాలి’ మరణశిక్షను అసందిగ్ధంగా తెలియజేస్తాయి. ‘పొట్టేలు కొమ్ము’ పురాతన సాంస్కృతిక వస్తువును సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచుతుంది; మూలంలోని సందిగ్ధతలను పాదటిప్పణుల్లో సంరక్షించాం.
