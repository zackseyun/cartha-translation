source:
  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: te
  text: “ఐగుప్తుపై నేను చేసినదాన్ని మీరే చూశారు. నేను మిమ్మల్ని గద్దల రెక్కల మీద[a][b] మోసి నా దగ్గరకు తీసుకొచ్చాను[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గద్దల రెక్కలపై.” ఇది శక్తివంతంగా, సురక్షితంగా విడిపించడాన్ని తెలిపే సజీవ రూపకం.
    reason: lexical_alternative
  - marker: b
    text: “గద్దలు” అని అనువదించిన హీబ్రూ పదం పెద్ద వేటపక్షులను మరింత విస్తృతంగా కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నా వైపుకు.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: మీరే చూశారు
  rationale: స్వతంత్ర సర్వనామమైన אַתֶּם ఇచ్చే ఉద్ఘాటనను ‘మీరే’ సహజంగా వ్యక్తం చేస్తుంది; పూర్తయిన సంఘటనకు ప్రత్యక్ష సాక్షులైన అనుభవాన్ని ‘చూశారు’ తెలుపుతుంది.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: నేను ఐగుప్తుకు చేసినదాన్ని
  rationale: לְמִצְרָיִם ఇక్కడ దేవుని చర్యల ప్రభావానికి గురైన దేశాన్ని సూచిస్తుంది. ‘ఐగుప్తుకు’ అనే రూపం జాతి/దేశ సమిష్టి భావాన్ని నిలుపుతుంది.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: నేను మిమ్మల్ని ... మోసి
  rationale: נשא యొక్క మోయడం/భరించడం అనే ప్రాథమిక భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మోసి’ వ్యక్తం చేస్తుంది.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: గద్దల రెక్కల మీద
  rationale: ఈ రూపకం శక్తివంతమైన, రక్షణాత్మక విమోచనను చిత్రిస్తుంది. נְשָׁרִיםకు సందర్భానుకూలమైన సంప్రదాయ తెలుగు పదంగా ‘గద్దలు’ ఎంచుకున్నాం; మూలపదం పెద్ద వేటపక్షులను విస్తృతంగా సూచించగలదనే అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: నా దగ్గరకు తీసుకొచ్చాను
  rationale: אֵלָי యొక్క ప్రత్యక్ష భావమైన ‘నా దగ్గరకు/నా వైపుకు’ను సహజమైన తెలుగులో నిలుపుతుంది. దేవునితో సంబంధంలోకి తీసుకురావడమనే సందర్భార్థాన్ని బలవంతంగా విస్తరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: దేవుని విమోచనలోని సంబంధపరమైన ఉద్దేశం
  choice: నా దగ్గరకు తీసుకొచ్చాను
  alternative: నాకోసం తీసుకొచ్చాను / నా సన్నిధికి తీసుకొచ్చాను
  rationale: మూలంలోని אֵלָי సూటిగా ‘నా దగ్గరకు/నా వైపుకు’ అని అర్థం. నిబంధన సంబంధం సందర్భంలో సూచితమైనప్పటికీ, ‘నాకోసం’ లేదా ‘నా సన్నిధికి’ అని అనువదించడం మూలానికి మించిన ప్రత్యేక భావాన్ని జోడించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. אַתֶּם యొక్క ఉద్ఘాటనకు ‘మీరే’ వాడాం. కవితాత్మక రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పక్షి పదంలోని విస్తృతార్థాన్ని పాదసూచికలో తెలిపాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
