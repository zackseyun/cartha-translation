id: EXO.19.24
reference: Exodus 19:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా అతనితో ఇలా అన్నాడు: “వెళ్లు, కిందికి దిగు. ఆ తర్వాత నీవు, నీతో పాటు అహరోను పైకి రండి. అయితే యాజకులుగానీ ప్రజలుగానీ యెహోవా దగ్గరికి పైకి రావడానికి హద్దు దాటి చొచ్చుకొని రాకూడదు[a]; లేకపోతే ఆయన వారిమీద విరుచుకుపడతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హద్దును బలవంతంగా ఛేదించి పైకి రాకూడదు; లేకపోతే ఆయన వారిమధ్య విరుచుకుపడతాడు.” ప్రజలు హద్దును ఛేదించడానికీ, యెహోవా తీర్పుగా విరుచుకుపడడానికీ హీబ్రూలో పరస్పర సంబంధమున్న ‘బద్దలుకొట్టి దూసుకుపోవడం’ అనే చిత్రణగల క్రియలు వాడబడ్డాయి.
    reason: హీబ్రూ మూలంలోని సంబంధిత పదచిత్రాన్ని, అలాగే בָּם కు సాధ్యమైన ‘వారిమధ్య’ అనే ప్రత్యామ్నాయాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించాం.
- source_word: לֶךְ רֵד
  choice: వెళ్లు, కిందికి దిగు
  rationale: రెండు ఆజ్ఞారూపాలనూ నిలుపుతూ, పర్వతం దిగిపోవాలనే తక్షణ ఆదేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָלִיתָ
  choice: ఆ తర్వాత … పైకి రండి
  rationale: ఆజ్ఞల వరుసలో ఈ perfect రూపానికి ఉన్న ఆదేశాత్మక భావాన్ని, ముందు దిగిపోయి తిరిగి పైకి రావాలనే క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: నీవు, నీతో పాటు అహరోను
  rationale: ప్రత్యేక సర్వనామంలోని ఉద్ఘాటనను, עִמָּךְ తెలిపే సహవాసాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: యాజకులుగానీ ప్రజలుగానీ
  rationale: ఈ రెండు వర్గాల్లో ఎవరికీ మినహాయింపు లేదనే నిషేధ భావాన్ని సహజమైన తెలుగు సముచ్చయంతో తెలియజేస్తుంది.
- source_word: אַל יֶהֶרְסוּ
  choice: హద్దు దాటి చొచ్చుకొని రాకూడదు
  rationale: הרס ఇక్కడ నిర్ణయించిన సరిహద్దును బలవంతంగా ఛేదించి ప్రవేశించడాన్ని సూచిస్తుంది; సందర్భంలోని హద్దును స్పష్టపరుస్తూ దృశ్యాత్మక బలాన్ని నిలుపుతుంది.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: యెహోవా దగ్గరికి పైకి రావడానికి
  rationale: దేవుని పర్వత సన్నిధిని సమీపించడమనే భావంతో పాటు పైకి ఎక్కే స్థలదిశను కూడా నిలుపుతుంది.
- source_word: פֶּן יִפְרָץ בָּם
  choice: లేకపోతే ఆయన వారిమీద విరుచుకుపడతాడు
  rationale: దైవిక తీర్పు అకస్మాత్తుగా వారిపై ఉప్పొంగి పడే פרץ చిత్రణను సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: బిరుదైన ‘ప్రభువు’తో మార్చకుండా వ్యక్తిగత దైవనామాన్ని నిలిపాం. తెలుగు బైబిల్ వాడుకలో విస్తృతంగా పరిచయమున్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై తుది నిర్ణయం ప్రకటించడం లేదు.
- issue: יִפְרָץ క్రియలో తీర్పు కర్త
  choice: ఆయన వారిమీద విరుచుకుపడతాడు
  alternative: వారిమధ్య విరుచుకుపడతాడు
  rationale: హీబ్రూ క్రియ ఏకవచన కర్తను సూచిస్తుంది; సమీప సందర్భంలో అది యెహోవాను సూచిస్తుంది. בָּם యొక్క పరిధిని ‘వారిమీద’గా అందించినా, ‘వారిమధ్య’ అనే సాధ్యమైన స్థలార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించాం. ‘పైకి రండి’ అనే బహువచన గౌరవరహిత రూపం ఇక్కడ మోషే, అహరోను ఇద్దరినీ ఉద్దేశించే సంఖ్యాబహుత్వం వల్ల వచ్చింది. ప్రధాన వాక్యంలో అర్థస్పష్టత కోసం ‘హద్దు’ చేర్చబడింది; అది ముందటి సందర్భంలో నిర్ణయించిన సరిహద్దును సూచిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
