source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: te
  text: 'మోషే యాహ్వేతో ఇలా అన్నాడు: “ప్రజలు సీనాయి కొండపైకి ఎక్కలేరు; ఎందుకంటే, ‘కొండ చుట్టూ సరిహద్దు నిర్ణయించి, దానిని పవిత్రపరచు’[b] అని నీవే మమ్మల్ని హెచ్చరించావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాకు గట్టిగా ఆజ్ఞాపించావు’ లేదా ‘మాకు సాక్ష్యమిచ్చావు.’ హీబ్రూ క్రియ అధికారపూర్వక హెచ్చరిక లేదా సాక్ష్యం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కొండకు హద్దు నిర్ణయించి, దానిని పవిత్రపరచు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לֹא יוּכַל הָעָם
  choice: ప్రజలు ... ఎక్కలేరు
  rationale: ఇక్కడ יכל అనుమతి లేకపోవడంకన్నా అసమర్థతను లేదా సాధ్యం కాకపోవడాన్ని తెలియజేస్తుంది; ‘ఎక్కలేరు’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: సీనాయి కొండపైకి ఎక్కడం
  rationale: עלה లోని పైకి వెళ్లే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మోషే చెప్పిన మాటకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: క్రియలో ఇప్పటికే ఉన్న ద్వితీయ పురుష భావానికి అదనంగా వచ్చిన స్పష్ట సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: మమ్మల్ని హెచ్చరించావు
  rationale: ఈ సందర్భంలో Hiphil రూపం అధికారపూర్వకంగా హెచ్చరించడం లేదా గట్టిగా ఆదేశించడం అనే భావం ఇస్తుంది; ప్రధాన పాఠ్యంలో ‘హెచ్చరించావు’ అత్యంత సహజం.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: కొండ చుట్టూ హద్దు పెట్టి
  rationale: గבל యొక్క causative ఆజ్ఞారూపం హద్దు లేదా పరిమితిని ఏర్పాటు చేయడాన్ని సూచిస్తుంది; సందర్భానుసారంగా ఆ హద్దు కొండ చుట్టూ ఉండటం తెలుగులో స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: וְקִדַּשְׁתּוֹ
  choice: దాన్ని పవిత్రంగా ప్రత్యేకించు
  rationale: קדשׁ యొక్క Piel రూపంలో ఉన్న పవిత్ర ప్రయోజనం కోసం వేరుచేసే భావాన్ని, కేవలం నైతిక పవిత్రతగా పరిమితం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: קדשׁ క్రియలోని పవిత్రీకరణ భావం
  choice: పవిత్రంగా ప్రత్యేకించు
  alternative: పవిత్రపరచు
  rationale: కొండను పవిత్రమైనదిగా వేరుచేసే ఆచార సంబంధ భావాన్ని ప్రధాన పాఠ్యం స్పష్టంగా ఉంచుతుంది; అది కొండ స్వభావంలో నైతిక మార్పును సూచిస్తున్నట్లు చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ప్రత్యక్ష సంభాషణను సహజ తెలుగు పదక్రమంలో ఉంచి, ‘నీవే’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి పదాలకు సరిపోని స్థానాల్లో కనిపించినందున, [a]ను ‘హెచ్చరించావు’ తర్వాత, [b]ను సరిహద్దు–పవిత్రీకరణ ఆజ్ఞ తర్వాత ఉంచాం.
