  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగానే ఉంది: మోషే ప్రజలు సీనాయి కొండకు ఎక్కలేరని, యాహ్వే స్వయంగా హెచ్చరించి హద్దు నిర్ణయించి కొండను పవిత్రపరచమని చెప్పాడని పేర్కొంటాడు. అయితే ‘పవిత్రంగా ప్రత్యేకించు’ అనే ప్రయోగం తెలుగులో కొద్దిగా భారంగా ఉంది; קדשׁ యొక్క ఆచారపరమైన భావానికి ‘పవిత్రపరచు’ సహజమైన, స్థిరమైన సమానం.'
  naturalness: ‘కొండ చుట్టూ హద్దు పెట్టి’ కంటే ‘కొండ చుట్టూ సరిహద్దు నిర్ణయించి’ మరింత సహజంగా, అధికారిక ఆజ్ఞ సందర్భానికి తగినట్లుగా ఉంటుంది. వాక్య నిర్మాణాన్ని కూడా సంభాషణ ప్రారంభంలో ‘ఇలా అన్నాడు’తో సులభంగా చేశాం.
