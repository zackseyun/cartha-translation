id: EXO.19.22
reference: Exodus 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: te
  text: యాహ్వేను సమీపించే యాజకులు కూడా తమను తాము పవిత్రపరచుకోవాలి; లేకపోతే యాహ్వే వారిమీద విరుచుకుపడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే వారిమీద అకస్మాత్తుగా విరుచుకుపడతాడు.” హీబ్రూ క్రియ యాహ్వే తీర్పు హఠాత్తుగా ప్రబలడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి ఆజ్ఞలతో అనుసంధానిస్తూ, యాజకులు సైతం ఈ హెచ్చరికకు లోబడతారని తెలిపే అదనపు ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన, సాధారణ పాఠకులకు సుపరిచితమైన తెలుగు పదం.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: యెహోవా దగ్గరికి వచ్చే
  rationale: נגשׁ కృదంతంలోని సమీపించడం లేదా దేవుని సన్నిధికి చేరడం అనే ఆరాధనా భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన రూపంలో ఉంచుతుంది.
- source_word: יִתְקַדָּשׁוּ
  choice: తమను తాము పవిత్రపరచుకోవాలి
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని స్పష్టంగా నిలుపుతూ, ఆరాధనకు తగిన పవిత్ర సిద్ధతను సూచిస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ప్రతికూల ఫలితాన్ని సూచించే హెచ్చరికను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יִפְרֹץ בָּהֶם
  choice: వారిమీద విరుచుకుపడతాడు
  rationale: פרץ సూచించే ఆకస్మికమైన, శక్తివంతమైన దైవిక తీర్పు దాడి చిత్రాన్ని నిలుపుతుంది; నిర్దిష్ట శిక్షా విధానాన్ని అదనంగా చేర్చదు.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో ప్రసిద్ధమైన నామరూపంతో ఉంచాం.
- issue: יִפְרֹץ בָּהֶם יְהוָהలోని హెచ్చరిక స్వభావం
  choice: యెహోవా వారిమీద విరుచుకుపడతాడు
  alternative: యెహోవా వారిమీదికి చొచ్చుకొస్తాడు
  rationale: సీనాయి సందర్భంలో ఇది హద్దు ఉల్లంఘన లేదా అపవిత్రతపై ఆకస్మిక దైవిక తీర్పు హెచ్చరిక. ప్రతికూల దిశను స్పష్టం చేస్తూనే, మూలంలో లేని ప్రత్యేక శిక్షను పేర్కొనలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. ‘దగ్గరికి వచ్చే’ అనే మాట ఆరాధనా సమీపత భావాన్ని సహజంగా అందిస్తుంది; ‘పవిత్రపరచుకోవాలి’ ఆత్మనేపద రూపాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
