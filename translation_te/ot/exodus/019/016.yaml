  to: మూడవ రోజు ఉదయం కాగానే, ఉరుములు[a], మెరుపులు వచ్చాయి; పర్వతంపై దట్టమైన మేఘం కమ్ముకుంది; బూరధ్వని[b] చాలా గట్టిగా[c] వినిపించింది. శిబిరంలో ఉన్న ప్రజలందరూ వణికిపోయారు.
