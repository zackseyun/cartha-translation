id: EXO.19.16
reference: Exodus 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: te
  text: మూడవ రోజు ఉదయం కాగానే, ఉరుములు[a], మెరుపులు వచ్చాయి; పర్వతంపై దట్టమైన మేఘం కమ్ముకుంది; బూరధ్వని[b] చాలా గట్టిగా[c] వినిపించింది. శిబిరంలో ఉన్న ప్రజలందరూ వణికిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధ్వనులు’ లేదా ‘స్వరాలు.’ హీబ్రూ పదానికి ఈ అర్థాలు కూడా ఉన్నాయి; అయితే ఇక్కడ మెరుపులతో కలిసి రావడం వల్ల ‘ఉరుములు’ అనే అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొమ్ము బూర ధ్వని.’ హీబ్రూ శోఫార్ అనేది సాధారణంగా జంతువు కొమ్ముతో చేసిన బూర.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘చాలా బలంగా.’ ధ్వని విషయంలో ఇది చాలా గట్టిగా వినిపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: మూడవ రోజు ఉదయం అయినప్పుడు
  rationale: హీబ్రూ కథన ప్రారంభాన్ని తెలుగులో సహజమైన కాలవాక్యంగా వ్యక్తం చేస్తూ, మూడవ రోజు మరియు ఉదయకాలం రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: קֹלֹת
  choice: ఉరుములు
  rationale: ఈ పదానికి ‘స్వరాలు/ధ్వనులు’ అనే విస్తృత అర్థం ఉన్నా, మెరుపులతో జతగా ఉన్న ఈ సందర్భంలో ఉరుములు ప్రధాన భావం.
- source_word: וּבְרָקִים
  choice: మెరుపులు
  rationale: హీబ్రూ బహువచనంలోని దృశ్య తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עָנָן כָּבֵד
  choice: దట్టమైన మేఘం
  rationale: כָּבֵד అక్షరార్థంగా ‘బరువైనది’; మేఘాన్ని వర్ణించినప్పుడు దాని సాంద్రతను సూచించే ‘దట్టమైన’ అనేది సహజమైన తెలుగు.
- source_word: קֹל שֹׁפָר
  choice: బూరధ్వని
  rationale: שׁוֹפָר అనేది సాధారణంగా జంతువు కొమ్ముతో చేసిన ఊదే వాద్యం; ‘బూరధ్వని’ పాఠకునికి అందుబాటులో ఉండి, ఇక్కడ వాద్యం కంటే వినిపించిన ధ్వనిపై ఉన్న దృష్టిని కాపాడుతుంది.
- source_word: חָזָק מְאֹד
  choice: అత్యంత బలంగా
  rationale: ‘చాలా బలమైనది’ అనే మూలపద భావాన్ని నిలుపుతూ, ధ్వనికి సంబంధించిన తెలుగులో సహజంగా క్రియావిశేషణ రూపంలో ఇస్తుంది; సందర్భంలో అది అత్యంత గట్టిగా వినిపించిందనే భావం.
- source_word: וַיֶּחֱרַד
  choice: వణికిపోయారు
  rationale: భయం లేదా తీవ్రమైన కలవరంతో శారీరకంగా వణకడం అనే భావాన్ని, కేవలం ‘భయపడ్డారు’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: శిబిరంలో ఉన్న ప్రజలందరూ
  rationale: మూలంలోని సంబంధ వాక్య భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
theological_decisions:
- issue: సీనాయి దైవప్రత్యక్షతలోని קֹלֹת భావం
  choice: ‘ఉరుములు’ అని ప్రధాన పాఠ్యంలో అనువదించి, ‘ధ్వనులు’ లేదా ‘స్వరాలు’ అనే సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచడం
  alternative: ‘స్వరాలు’ అని అనువదించి పరలోక స్వరాలుగా సూచించడం
  rationale: మెరుపులతో కలిసి రావడం వల్ల వాతావరణ సంబంధమైన ఉరుముల భావమే సందర్భానికి అత్యంత సముచితం. అయినా హీబ్రూ పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో కాపాడాలి; పరలోక స్వరాలు అనే తరువాతి వ్యాఖ్యానాన్ని పాఠ్యంలోకి తేవకూడదు.
- issue: శోఫార్ స్వరూపం
  choice: అందుబాటులో ఉండే ‘బూరధ్వని’ని పాఠ్యంలో వాడి, కొమ్ము బూర అనే నిర్దిష్టతను పాదసూచికలో తెలియజేయడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘పొట్టేలు కొమ్ము బూర ధ్వని’ అని ఇవ్వడం
  rationale: మూలం שׁוֹפָר అనే ప్రత్యేక వాద్యాన్ని సూచిస్తుంది; అయితే అది తప్పనిసరిగా పొట్టేలు కొమ్మే అని ఈ వచనం చెప్పదు. అందువల్ల పాఠ్యంలో అతినిర్దిష్టతను నివారించి, సాంస్కృతిక వివరాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ సంయోజక శ్రేణిని యాంత్రికంగా అనుకరించకుండా సంఘటనల క్రమం, దృశ్య-శ్రవ్య తీవ్రత, చివరలో ప్రజల ప్రతిస్పందనను నిలిపింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
