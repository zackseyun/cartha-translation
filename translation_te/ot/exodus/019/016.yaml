    rationale: హీబ్రూలో వాక్యం సాధారణంగా “మరియు/అప్పుడు” అని కొనసాగుతుంది. ప్రజల వణుకుకు సందర్భం కారణమై ఉండవచ్చునైనా, “దాంతో” స్పష్టమైన కారణసంబంధాన్ని వ్యాకరణపరంగా బలపరుస్తుంది.
