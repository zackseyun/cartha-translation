revisions:
- from: అప్పుడు మోషే దేవుణ్ణి కలుసుకోవడానికి ప్రజలను శిబిరం నుండి బయటికి తీసుకొచ్చాడు. వారు పర్వతం దిగువన నిలబడ్డారు.[a]
  to: అప్పుడు మోషే దేవుణ్ణి కలుసుకోవడానికి ప్రజలను శిబిరం నుండి బయటికి తీసుకొచ్చాడు. వారు పర్వతపు అడుగుభాగంలో నిలబడ్డారు.[a]
  rationale: The revision replaces the potentially broad “పర్వతం దిగువన” with “పర్వతపు అడుగుభాగంలో,” which more clearly reflects the contextual sense of בְּתַחְתִּית הָהָר as the mountain’s base or lower part. All other wording is retained.
