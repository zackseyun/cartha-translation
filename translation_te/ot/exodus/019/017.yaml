source:
  edition: WLC
  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: te
  text: అప్పుడు మోషే దేవుణ్ణి కలుసుకోవడానికి ప్రజలను శిబిరం నుండి బయటికి తీసుకొచ్చాడు. వారు పర్వతపు అడుగుభాగంలో నిలబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పర్వతపు పాదం వద్ద.” హెబ్రీ పదబంధం పర్వతపు కింది లేదా దిగువ భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: బయటికి తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ప్రజలు బయటికి వచ్చేలా మోషే చేశాడనే కారణార్థక భావాన్ని తెలియజేస్తుంది. ‘బయటికి తీసుకొచ్చాడు’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఈ నిర్మాణం ఒకరిని కలుసుకునే దిశగా వెళ్లడాన్ని సూచిస్తుంది. ‘కలుసుకోవడానికి’ సందర్భానికి సహజంగా సరిపోతుంది; ఎదుర్కోవడం అనే ప్రతికూల భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הָאֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఇక్కడ ఈ పదం సీనాయి వద్ద ప్రత్యక్షమవుతున్న ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది. తెలుగులో కర్మవిభక్తితో ‘దేవుణ్ణి’ సహజమైన రూపం.
- source_word: מִן הַמַּחֲנֶה
  choice: శిబిరం నుండి బయటికి
  rationale: ప్రజలు బయలుదేరిన స్థలాన్ని מן సూచిస్తుంది. క్రియతో కలిపి ‘శిబిరం నుండి బయటికి తీసుకొచ్చాడు’ అని చెప్పడం నిష్క్రమణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּתְיַצְּבוּ
  choice: నిలబడ్డారు
  rationale: יצב హిత్‌పయేల్ రూపం తమ స్థానాన్ని స్వీకరించి నిలబడడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘నిలబడ్డారు’ సహజంగా ఉండి, ఉద్దేశపూర్వకంగా అక్కడ నిలిచిన భావాన్ని సందర్భమే అందిస్తుంది.
- source_word: בְּתַחְתִּית
  choice: దిగువన
  rationale: పర్వత సందర్భంలో ఈ పదం దాని కింది లేదా దిగువ భాగాన్ని సూచిస్తుంది. ‘దిగువన’ మూలంలోని స్థలసూచక భావాన్ని నిలుపుతూ, ‘పర్వత పాదం దగ్గర’ అనే అర్థాన్ని పాదసూచికలో స్పష్టం చేయడానికి వీలు కల్పిస్తుంది.
- source_word: הָהָר
  choice: పర్వతం
  rationale: సీనాయి సందర్భంలో הַר కు ‘పర్వతం’ సరైన ఆధునిక తెలుగు పదం; నిర్దిష్టమైన పర్వతం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: సీనాయి దైవప్రత్యక్షత సందర్భంలో הָאֱלֹהִים అనువాదం
  choice: దేవుణ్ణి
  alternative: ఆ దేవుణ్ణి
  rationale: నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ ఇక్కడ ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు. తెలుగులో ‘ఆ దేవుణ్ణి’ అనడం అనవసరమైన వ్యత్యాసాన్ని లేదా ఇతర దేవుళ్లతో పోలికను సూచించవచ్చు; ‘దేవుణ్ణి’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘బయటికి తీసుకొచ్చాడు’ కారణార్థక క్రియను, ‘దిగువన’ స్థలసూచక మూలార్థాన్ని సహజంగా నిలుపుతాయి. పాదసూచిక గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
