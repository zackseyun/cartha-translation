  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: te
  text: ఇప్పుడు, మీరు నా స్వరాన్ని నిజంగా విని నా నిబంధనను పాటిస్తే, అన్ని ప్రజలలోనుండి మీరు నాకు అమూల్యమైన సొత్తుగా[b][c] ఉంటారు; ఎందుకంటే భూమంతా నాదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘నా ప్రత్యేక సొత్తుగా’ లేదా ‘నాకే చెందిన సొత్తుగా.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, అన్ని ప్రజల మధ్య నుంచి. తరువాతి వాక్యం భూమంతా దేవునికే చెందుతుందని స్పష్టం చేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి సందర్భం నుంచి వచ్చే అనుసంధానాన్ని, ప్రస్తుత నిబంధనాత్మక పిలుపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: నా మాటను నిజంగా విని
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియలోని ఉద్ఘాటనను ‘నిజంగా’ తెలియజేస్తుంది. ‘నా మాటను వినడం’ తెలుగులో శ్రద్ధగా విని లోబడే భావాన్ని సహజంగా మోస్తుంది; తరువాతి ‘పాటిస్తే’ విధేయతను మరింత స్పష్టం చేస్తుంది.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: నా నిబంధనను పాటిస్తే
  rationale: నిబంధన సందర్భంలో שׁמר విశ్వసనీయంగా ఆచరించడం లేదా కాపాడడం అనే భావాన్ని కలిగి ఉంది; ‘పాటించడం’ ఆధునిక తెలుగులో సహజమైన నిబంధనాత్మక ప్రయోగం.
- source_word: סְגֻלָּה
  choice: అమూల్యమైన సొత్తు
  rationale: ప్రత్యేకంగా స్వంతం చేసుకున్న, ఎంతో విలువైన రాజసంబంధమైన ఆస్తి అనే రెండు భావాలను ఈ పదబంధం తెలియజేస్తుంది.
- source_word: מִכָּל הָעַמִּים
  choice: ప్రజలందరిలో నుంచి
  rationale: ఇక్కడ מִן ఇతర ప్రజలపై అధికతను కాక, వారిలో నుంచి ప్రత్యేకంగా ఎంపిక చేయబడటాన్ని సూచిస్తుంది.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: ఎందుకంటే భూమంతా నాదే
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; ‘భూమంతా’ దేవుని సార్వత్రిక యాజమాన్యాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో שמעను ‘వినడం’గా అనువదించాలా, ‘లోబడడం’గా అనువదించాలా
  choice: నా మాటను నిజంగా విని
  alternative: నాకు నిజంగా లోబడి
  rationale: హీబ్రూ పదబంధంలో విధేయత అంతర్భాగమైనా, మూలపాఠం వినడాన్ని ప్రత్యక్షంగా ముందుకు తెస్తుంది. ‘విని’ దానిని నిలుపుతుంది; ‘నా నిబంధనను పాటిస్తే’ విధేయతను స్పష్టం చేస్తుంది.
- issue: సְגֻלָּה ద్వారా ఇశ్రాయేలు ప్రత్యేక స్థితిని అతిశయోక్తి లేకుండా వ్యక్తపరచడం
  choice: ప్రజలందరిలో నుంచి మీరు నాకు అమూల్యమైన సొత్తుగా ఉంటారు
  alternative: ప్రజలందరికంటే పైగా మీరు నా ప్రత్యేక సొత్తుగా ఉంటారు
  rationale: ‘లో నుంచి’ ఎంపికను తెలియజేస్తుంది; ఇతర ప్రజలు దేవునికి చెందరనే భావాన్ని కలిగించదు. తరువాతి వాక్యం భూమంతా దేవునిదేనని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘నిబంధన,’ ‘అమూల్యమైన సొత్తు’ వంటి పదాలు మూలంలోని నిబంధనాత్మక మరియు యాజమాన్య భావాలను సామాన్య పాఠకులకు అర్థమయ్యేలా నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
