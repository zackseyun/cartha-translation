id: EXO.19.20
reference: Exodus 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: te
  text: యాహ్వే సీనాయి కొండపై, ఆ కొండ శిఖరానికి దిగివచ్చాడు. అప్పుడు యాహ్వే మోషేను కొండ శిఖరానికి పిలిచాడు; మోషే పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివచ్చాడు
  rationale: ירד అంటే ‘కిందికి వెళ్లడం/రావడం, దిగడం.’ సందర్భంలోని దిశను సహజమైన ఆధునిక తెలుగులో ‘దిగివచ్చాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన నామరూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הַר סִינַי
  choice: సీనాయి కొండ
  rationale: స్థలనామాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తపరచే ప్రామాణిక రూపం.
- source_word: אֶל רֹאשׁ הָהָר
  choice: కొండ శిఖరానికి
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’; ఇక్కడ కొండ పైభాగం లేదా శిఖరాన్ని సూచించే స్థలవాచక ప్రయోగం. ‘కొండ శిఖరానికి’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: קרא ఇక్కడ ఒక వ్యక్తిని తన దగ్గరకు పిలవడాన్ని సూచిస్తుంది. ‘పిలిచాడు’ ప్రత్యక్షమైనది; ‘రమ్మని ఆదేశించాడు’ అనడం మూలంలో ఉన్నదానికంటే ఎక్కువ వ్యాఖ్యానాత్మకం.
- source_word: לְמֹשֶׁה
  choice: మోషేను
  rationale: క్రియతో సహజ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తినామాన్ని కర్మరూపంలో ఇచ్చాం.
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అంటే ‘పైకి వెళ్లడం.’ ఇది ముందున్న ‘దిగివచ్చాడు’తో దిశాపరమైన వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. హెబ్రీ వాక్యంలోని వరుస కదలికలు—దిగివచ్చాడు, పిలిచాడు, పైకి వెళ్లాడు—స్పష్టంగా నిలుపబడ్డాయి. ‘కొండ శిఖరం’ అనే సహజ తెలుగు ప్రయోగం హెబ్రీ ‘కొండ తల’ అనే నుడికారానికి సమానార్థకంగా వాడబడింది.
