revisions:
- from: సీనాయి పర్వతమంతా పొగతో కమ్ముకుంది. ఎందుకంటే యహ్వే అగ్నిలో దానిమీదికి దిగివచ్చాడు. దాని పొగ కొలిమి[a] పొగలా పైకి లేచింది; పర్వతమంతా ఎంతో తీవ్రంగా కంపించింది.
  to: సీనాయి పర్వతమంతా పొగతో కమ్ముకుంది. ఎందుకంటే యహ్వే అగ్నిలో దానిమీద దిగివచ్చాడు. దాని పొగ కొలిమి[a] పొగలా పైకి లేచింది; పర్వతమంతా ఎంతో బలంగా కంపించింది.
