id: EXO.19.18
reference: Exodus 19:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: te
  text: సీనాయి పర్వతమంతా పొగతో కమ్ముకుంది. ఎందుకంటే యహ్వే అగ్నిలో దానిమీద దిగివచ్చాడు. దాని పొగ కొలిమి[a] పొగలా పైకి లేచింది; పర్వతమంతా ఎంతో బలంగా కంపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బట్టీ పొగలా.’
    reason: כִּבְשָׁן అనే పదం కొలిమిని లేదా బట్టీని సూచించగలదు; ఈ పదార్థ ప్రత్యామ్నాయాన్ని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: וְהַר סִינַי עָשַׁן כֻּלּוֹ
  choice: సీనాయి పర్వతమంతా పొగతో కమ్ముకుంది
  rationale: עָשַׁן అనే క్రియతో కూడిన כֻּלּוֹ పర్వతమంతా పొగలో ఆవరించబడిన దృశ్యాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, కానీ పర్వతమంతటికీ వర్తించే భావాన్ని నిలుపుతూ ‘పొగతో కమ్ముకుంది’ అని అనువదించాం.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ఈ హీబ్రూ ప్రయోగం తరువాత చెప్పబడే కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టమైన సహజ సమానార్థకం.
- source_word: יָרַד עָלָיו יְהוָה בָּאֵשׁ
  choice: యహ్వే అగ్నిలో దానిమీదికి దిగివచ్చాడు
  rationale: יָרַד యొక్క దిగివచ్చే కదలికను, עָלָיו యొక్క పర్వతంపైకి అనే సంబంధాన్ని, בָּאֵשׁ యొక్క ‘అగ్నిలో’ అనే విధానాన్ని నేరుగా నిలిపాం.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: దాని పొగ ... పైకి లేచింది
  rationale: ప్రత్యయం పర్వతాన్ని సూచిస్తున్నందున ‘దాని పొగ’ అని, עָלָה సూచించే పైకి కదలికను ‘పైకి లేచింది’ అని అనువదించాం.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: కొలిమి పొగలా
  rationale: כִּבְשָׁן వేడి కలిగించే కొలిమి లేదా బట్టీని సూచించవచ్చు. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే ‘కొలిమి’ని వాడి, ‘బట్టీ’ని పాదసూచికలో నిలిపాం.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: పర్వతమంతా ఎంతో తీవ్రంగా కంపించింది
  rationale: חָרַד ఇక్కడ భౌతికంగా కంపించడాన్ని సూచిస్తుంది; מְאֹד ఇచ్చే బలాన్ని ‘ఎంతో తీవ్రంగా’ నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. హీబ్రూ వాక్యంలోని వరుస సంధులను యాంత్రికంగా పునరావృతం చేయకుండా, కారణం మరియు దృశ్యక్రమం స్పష్టంగా ఉండేందుకు మూడు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తును దానికి సంబంధించిన כִּבְשָׁן పదం తరువాత ఉంచాం.
