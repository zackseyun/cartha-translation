  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: te
  text: 'నీ అపారమైన వైభవంతో[a]

    నీకు ఎదిరించి లేచేవారిని కూలదోస్తావు;

    నీ మండే కోపాన్ని[b] పంపుతావు;

    అది వారిని ఎండిన గడ్డిలా దహిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ మహోన్నత వైభవంతో.’ హీబ్రూ పదబంధం వైభవం యొక్క అపారతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ ఉగ్రతను పంపుతావు.’ హీబ్రూ పదం అక్షరార్థంగా మండే కోపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: నీ మహోన్నత వైభవ సమృద్ధితో
  rationale: בְּ అనే ఉపసర్గ సాధనాన్ని లేదా పరిధిని సూచించగలదు; רֹב పరిమాణ సమృద్ధిని, גָּאוֹן మహోన్నత వైభవాన్ని సూచిస్తాయి. ఈ అనువాదం ఆ భావాలన్నిటినీ గంభీరమైన, సహజ తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: תַּהֲרֹס
  choice: కూలదోస్తావు
  rationale: הרס యొక్క ‘కూల్చివేయడం, నాశనం చేయడం’ అనే బలమైన భావాన్ని వ్యక్తులపై ప్రయోగించడానికి సహజంగా సరిపడే క్రియ.
- source_word: קָמֶיךָ
  choice: నీ మీదికి లేచేవారిని
  rationale: קום ధాతువు నుంచి వచ్చిన కృదంతంలోని ‘ఎదిరిస్తూ లేచేవారు’ అనే క్రియాత్మక భావాన్ని ‘శత్రువులు’ అని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: תְּשַׁלַּח
  choice: పంపుతావు
  rationale: שׁלח అనే సాధారణ ‘పంపు’ భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అందిస్తుంది.
- source_word: חֲרֹנְךָ
  choice: నీ మండే కోపాన్ని
  rationale: חָרוֹן లోని వేడి లేదా మండుట అనే రూపకాన్ని కేవలం ‘ఉగ్రత’గా మార్చకుండా సంరక్షిస్తుంది.
- source_word: יֹאכְלֵמוֹ
  choice: అది వారిని ... కబళిస్తుంది
  rationale: ‘తినివేయు, మింగివేయు’ అనే క్రియ యొక్క బలాన్ని కవితాత్మకంగా వ్యక్తం చేస్తూ, ఏకవచన క్రియను ముందున్న ‘కోపం’తో అనుసంధానిస్తుంది.
- source_word: כַּקַּשׁ
  choice: ఎండిన పంటకాడల్లా
  rationale: קַשׁ పంట కోసిన తరువాత మిగిలే పొడి కాడలు లేదా గడ్డిని సూచిస్తుంది; త్వరగా కాలిపోయే పదార్థమనే కవితా చిత్రాన్ని ఈ పదబంధం స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు భాషలోని విధ్వంసక రూపకాన్ని మృదుపరచకపోవడం
  choice: నీ మండే కోపాన్ని పంపుతావు; అది వారిని ఎండిన పంటకాడల్లా కబళిస్తుంది
  alternative: నీ ఉగ్రతను విడిచిపెడతావు; అది వారిని గడ్డిలా దహించివేస్తుంది
  rationale: హీబ్రూ కవిత దేవుని కోపాన్నే విధ్వంసానికి కారణంగా నేరుగా చూపుతుంది. తరువాతి సిద్ధాంత వివరణను చేర్చకుండా ఆ తీవ్రతను, వేడి రూపకాన్ని నిలుపుతుంది.
- issue: దేవునికి ప్రత్యక్ష ద్వితీయ పురుష సంబోధన
  choice: నీ ... నీ ... పంపుతావు ... కూలదోస్తావు
  alternative: ఆయన ... ఆయన ... పంపుతాడు ... కూలదోస్తాడు
  rationale: ఈ గీతం దేవుని గురించి పరోక్షంగా చెప్పకుండా ఆయనను నేరుగా సంబోధిస్తుంది; ద్వితీయ పురుష రూపం దాని ఆరాధనా, సాక్ష్య స్వభావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని ఉపయోగించాం. ‘నీ మీదికి లేచేవారు’ మూలంలోని క్రియాత్మక శత్రుత్వాన్ని నిలుపుతుంది; ‘ఎండిన పంటకాడలు’ అనే రూపం పట్టణ, గ్రామీణ పాఠకులిద్దరికీ అర్థమయ్యేలా קַשׁ చిత్రాన్ని స్పష్టం చేస్తుంది. కవితా సమాంతరత కోసం పాద విభజనను ఉంచాం.
