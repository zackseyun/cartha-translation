  rationale: 'The revision improves modern Telugu idiom while retaining the Hebrew poetic sequence and imagery: abundant divine grandeur, overthrow of those who rise in opposition, dispatch of burning anger, and fire-like consumption as dry stubble. Footnote a is corrected to present a lexical alternative without adding a causal interpretation.'
