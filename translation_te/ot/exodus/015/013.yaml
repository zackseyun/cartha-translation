source:
  edition: WLC
  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: te
  text: నీ స్థిరమైన ప్రేమచేత నీవు విమోచించిన ఈ ప్రజలను నడిపించావు[a]; నీ బలంతో వారిని నీ పరిశుద్ధ నివాసానికి దారి చూపించావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘ఈ ప్రజలను’ అని ఉంది; సందర్భానుసారం ‘నీవు విమోచించిన ప్రజలను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ పరిశుద్ధ నివాసం’ అనేది దేవుని పరిశుద్ధ సన్నిధి ఉన్న స్థలాన్ని విస్తృతంగా సూచించవచ్చు. దీనిని సీనాయి, వాగ్దాన దేశం, లేదా సీయోను/దేవాలయం అని వివిధంగా అర్థం చేసుకుంటారు. ‘దారి చూపించావు’ అనే క్రియలో శ్రద్ధగా నడిపించే భావం కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: నడిపించావు
  rationale: హిఫీల్ రూపంలోని נחה ‘నడిపించడం, దారి చూపడం’ అనే అర్థాన్ని ఇస్తుంది. ఇక్కడ నిర్గమ కార్యాన్ని కవితాత్మకంగా పూర్తయిన చర్యగా వర్ణిస్తున్నందున ‘నడిపించావు’ సహజంగా ఉంది.
- source_word: בְחַסְדְּךָ
  choice: నీ స్థిరమైన ప్రేమలో
  rationale: חֶסֶדలో ప్రేమ, కరుణ, విశ్వసనీయ నిబద్ధత అనే భావాలు కలిసి ఉన్నాయి. ‘స్థిరమైన ప్రేమ’ దాని నిలకడను, ప్రేమపూర్వక స్వభావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; בְను ఇక్కడ ‘లో’గా ఉంచడం కవితా సమాంతరతను కాపాడుతుంది.
- source_word: עַם זוּ
  choice: ఈ ప్రజలను
  rationale: זוּకు ఉన్న సూచనార్థాన్ని తొలగించకుండా ‘ఈ’గా స్పష్టంగా అనువదించాం. గీతంలోని వక్తలు తమతో గుర్తించుకునే సమూహాన్ని సూచిస్తున్న సందర్భానికి ఇది సరిపోతుంది.
- source_word: גָּאָלְתָּ
  choice: విమోచించిన
  rationale: גאל అనేది బంధం లేదా అధీనత నుంచి విడిపించి స్వంత ప్రజలుగా తిరిగి పొందే కార్యాన్ని సూచించే ముఖ్య పదం. ‘విమోచించిన’ దాని ధార్మిక బరువును, రక్షణ భావాన్ని నిలుపుతుంది.
- source_word: נֵהַלְתָּ
  choice: నడిపించావు
  rationale: נהל శ్రద్ధగా దారి చూపడం లేదా కాపరిలా నడిపించడం అనే భావాన్ని కలిగి ఉంటుంది. తెలుగులో సహజత కోసం ‘నడిపించావు’ వాడినా, మొదటి క్రియతో పోల్చితే దీనిలోని శ్రద్ధగల మార్గదర్శక భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: בְעָזְּךָ
  choice: నీ బలంతో
  rationale: עֹז అంటే బలం లేదా శక్తి. సాధనార్థక בְను తెలుగులో సహజంగా ‘తో’ అని అనువదించడం దేవుని శక్తి ద్వారా జరిగిన నడిపింపును స్పష్టం చేస్తుంది.
- source_word: אֶל
  choice: నివాసానికి
  rationale: אֶל గమ్యం వైపు కదలికను సూచిస్తుంది. తెలుగు విభక్తి ‘-కి’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది; చేరికను అతిగా నిర్దిష్టం చేయదు.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: నీ పరిశుద్ధ నివాసం
  rationale: נָוֶהకు నివాసస్థలం, వాసస్థానం, మేతభూమి వంటి అర్థాలు ఉండవచ్చు. సందర్భంలో దేవుని పరిశుద్ధ సన్నిధి గల స్థలాన్ని సూచించడానికి ‘పరిశుద్ధ నివాసం’ స్పష్టంగా ఉండి, నిర్దిష్ట భౌగోళిక గుర్తింపును బలవంతంగా విధించదు.
theological_decisions:
- issue: ‘నీ పరిశుద్ధ నివాసం’ దేనిని సూచిస్తుంది?
  choice: దేవుని పరిశుద్ధ సన్నిధి గల స్థలాన్ని విస్తృతంగా సూచించే పదబంధంగా ఉంచడం
  alternative: సీనాయి, వాగ్దాన దేశం, లేదా సీయోను/దేవాలయం అని ప్రత్యేకంగా గుర్తించడం
  rationale: హీబ్రూ పదబంధం ఒక్క ప్రదేశాన్ని నిస్సందేహంగా నిర్దేశించదు. సముద్ర గీతం దేవుని రక్షణ కార్యాన్ని దాని అంతిమ గమ్యంవరకు కవితాత్మకంగా ముందుకు చూడవచ్చు; అందువల్ల ప్రధాన పాఠంలో ఆ ఉద్దేశపూర్వక విస్తృతతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘స్థిరమైన ప్రేమ’, ‘విమోచించిన’, ‘పరిశుద్ధ నివాసం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని ఒడంబడిక నిబద్ధత, రక్షణ, పరిశుద్ధ సన్నిధి భావాలను నిలుపుతాయి. రెండు హీబ్రూ నాయకత్వ క్రియలకు తెలుగులో ఒకే సహజ క్రియ వచ్చినందున రెండవదానిలోని శ్రద్ధగల మార్గదర్శక భావాన్ని పాదటిప్పణిలో తెలిపాం.
