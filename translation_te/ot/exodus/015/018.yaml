  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: te
  text: యాహ్వే యుగయుగాలూ రాజ్యమేలుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: ‘YHWH.’ సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ అనువాదాన్ని, ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: יִמְלֹךְ
  choice: పరిపాలిస్తాడు
  rationale: מלך క్రియలోని రాజుగా ఏలే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇక్కడి అసంపూర్ణ క్రియారూపాన్ని సందర్భానుసారం భవిష్యత్ ప్రకటనగా అనువదించాం.
- source_word: לְעֹלָם וָעֶד
  choice: యుగయుగాలూ
  rationale: ఈ స్థిరమైన హెబ్రీ పదబంధం అంతులేని కాలాన్ని బలంగా ప్రకటిస్తుంది. ‘యుగయుగాలూ’ దాని పునరుక్తి బలాన్నీ గీతాత్మక శైలినీ సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని నేరుగా వాడుతుంది. తెలుగులో సంప్రదాయంగా స్థిరపడిన లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: మోషే విజయగీతంలోని సంక్షిప్తమైన, మహిమాన్వితమైన ప్రకటనశైలిని నిలిపేలా ఆధునిక ప్రామాణిక తెలుగు వాడాం. ‘యుగయుగాలూ’ గీతాత్మక గాంభీర్యంతోపాటు మూలంలోని కాలవ్యాప్తి బలాన్ని అందిస్తుంది.
