  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: te
  text: 'యాహ్ నా బలమూ నా గానమూ;

    ఆయనే నాకు రక్షణగా అయ్యాడు.


    ఈయనే నా దేవుడు; నేను ఆయనను స్తుతిస్తాను[a].

    నా తండ్రియొక్క దేవుడు; నేను ఆయనను ఉన్నతపరుస్తాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఆయన కోసం నివాసస్థలం సిద్ధం చేస్తాను.” ఇక్కడున్న హెబ్రీయ క్రియ అర్థం క్లిష్టమైనది; అది నివాసస్థలం ఏర్పాటు చేయడం లేదా అలంకరించడం, మహిమపరచడం అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: నా బలం
  rationale: עֹז్ అనే నామవాచకం బలం లేదా శక్తిని సూచిస్తుంది. కవితాత్మక సందర్భంలో సహజంగా, స్పష్టంగా ఉండేందుకు ‘నా బలం’ అని అనువదించాం.
- source_word: וְזִמְרָת יָהּ
  choice: నా గానం ... యాహ్
  rationale: זִמְרָה గానం లేదా సంగీత స్తుతిని సూచించగలదు. ‘నా బలం, నా గానం’ అనే కవితాత్మక జంటను నిలుపుతూ, יָהּను దైవనామపు సంక్షిప్త రూపంగా ‘యాహ్’ అని ఇచ్చాం.
- source_word: יָהּ
  choice: యాహ్
  rationale: ఇది יהוה అనే నాలుగు అక్షరాల దైవనామం కాకుండా దాని సంక్షిప్త రూపం יָהּ. మూలంలోని ప్రత్యేక రూపాన్నీ కవితాత్మక ప్రభావాన్నీ నిలుపేందుకు ‘యాహ్’ అని లిప్యంతరీకరించాం.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: ఆయనే నాకు రక్షణ అయ్యాడు
  rationale: היה + ל అనే హెబ్రీయ నిర్మాణం ఎవరికైనా ఏదోగా కావడం లేదా ఉండడం అనే భావాన్ని ఇస్తుంది. ఫలిత భావాన్నీ యాహ్‌తో సంబంధాన్నీ సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: זֶה אֵלִי
  choice: ఈయనే నా దేవుడు
  rationale: సూచనార్థకమైన זֶהలోని ఉద్ఘాటనను ‘ఈయనే’ నిలుపుతుంది; వాక్యం సహజమైన ఆధునిక తెలుగులోనూ ఉంటుంది.
- source_word: וְאַנְוֵהוּ
  choice: నేను ఆయనను స్తుతిస్తాను
  rationale: ఈ క్రియ అర్థం వివాదాస్పదం. కవితలోని సమాంతర నిర్మాణం, ఆరాధనా సందర్భం ఆధారంగా ‘స్తుతిస్తాను’ను ప్రధాన పాఠంలో ఎంచుకున్నాం; నివాసస్థలం సిద్ధం చేయడం అనే ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלֹהֵי אָבִי
  choice: నా తండ్రి దేవుడు
  rationale: ఏకవచన సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ కుటుంబపరమైన నిబంధన సూచనను నిలుపుతుంది.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: నేను ఆయనను ఘనపరుస్తాను
  rationale: רומם అంటే ఎత్తడం లేదా ఉన్నతపరచడం. దేవుని స్తుతించే సందర్భంలో ‘ఘనపరుస్తాను’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, ఉన్నతపరచే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יָהּ అనే దైవనామాన్ని ఎలా ఇవ్వాలి
  choice: యాహ్
  alternative: ప్రభువు
  rationale: మూలంలో יהוהకు బదులు దాని సంక్షిప్త రూపమైన יָהּ ఉంది. మూలభాషలోని భేదాన్ని చెరపకుండా ఉండేందుకు ‘యాహ్’ను నిలిపాం.
- issue: וְאַנְוֵהוּ అర్థనిర్ణయం
  choice: నేను ఆయనను స్తుతిస్తాను
  alternative: నేను ఆయన కోసం నివాసస్థలం సిద్ధం చేస్తాను
  rationale: క్రియకు ఒకటి కంటే ఎక్కువ సాధ్యమైన వ్యుత్పత్తి సంబంధాలు ఉన్నాయి. సమీప కవితాత్మక సమాంతరత, ఆరాధనా సందర్భం ‘స్తుతిస్తాను’కు మద్దతిస్తాయి; అయితే నివాసస్థల భావాన్ని పాదసూచికలో భద్రపరిచి అనిశ్చితిని స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. హెబ్రీయ పాదాల సమాంతరతను చిన్న వాక్యాలు, పునరుక్త ‘ఈయనే’ ద్వారా నిలిపాం. దైవనామపు సంక్షిప్త రూపాన్ని ‘యాహ్’గా ఉంచాం.
