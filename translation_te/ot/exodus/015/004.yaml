  variant: modern standard Telugu
source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: te
  text: ఫరో రథాలను, అతని సైన్యాన్ని ఆయన సముద్రంలోకి విసిరివేశాడు; అతని శ్రేష్ఠ సైన్యాధికారులు రెల్లుల సముద్రంలో[a] మునిగిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా “ఎర్ర సముద్రం” అని అనువదిస్తారు. హీబ్రూ పాఠంలో “రెల్లుల సముద్రం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: రథాలను
  rationale: ఈ బహువచన నామవాచకం ఫరో యుద్ధ రథాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘రథాలు’ సహజమైన, స్పష్టమైన పదం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈ రాజబిరుదుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וְחֵילוֹ
  choice: అతని సైన్యాన్ని
  rationale: ఇక్కడ חַיִל సంపద లేదా సాధారణ బలాన్ని కాక సైనిక దళాన్ని సూచిస్తుంది.
- source_word: יָרָה
  choice: విసిరివేశాడు
  rationale: మూల క్రియకు విసరడం లేదా ప్రయోగించడం అనే బలమైన భావం ఉంది; కవితాత్మక దైవ తీర్పు సందర్భంలో ఈ రూపం సహజంగా ఆ బలాన్ని నిలుపుతుంది.
- source_word: בַיָּם
  choice: సముద్రంలోకి
  rationale: ‘విసిరివేశాడు’ అనే చలన క్రియతో గమ్యాన్ని సూచించడానికి ‘లోకి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: וּמִבְחַר
  choice: శ్రేష్ఠ
  rationale: ఎంపికైనవారు లేదా అత్యుత్తములు అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלִשָׁיו
  choice: అతని సైన్యాధికారులు
  rationale: ఈ పదం ఉన్నతస్థాయి లేదా ప్రత్యేక సైనిక అధికారులను సూచించగలదు; ‘రథాధికారులు’ అని అతిగా నిర్దిష్టపరచకుండా హోదాను తెలియజేస్తుంది.
- source_word: טֻבְּעוּ
  choice: మునిగిపోయారు
  rationale: ముంచబడటం లేదా నీటిలో దిగిపోవడం అనే మూల చిత్రాన్ని సహజ తెలుగులో ఇస్తుంది; మరణాన్ని మాత్రమే ముందుకు తెచ్చే ‘మునిగి చనిపోయారు’ అనే విస్తరణను నివారిస్తుంది.
- source_word: בְיַם סוּף
  choice: రెల్లుల సముద్రంలో
  rationale: יַם סוּף పదబంధంలోని סוּף‌కు రెల్లు లేదా జలవృక్షం అనే మూలార్థాన్ని ప్రతిబింబిస్తుంది; సంప్రదాయ పేరును పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: יַם סוּף అనువాదం
  choice: రెల్లుల సముద్రం
  alternative: ఎర్ర సముద్రం
  rationale: మూల హీబ్రూ పదబంధపు ప్రత్యక్ష అర్థానికి ప్రాధాన్యం ఇచ్చి ప్రధాన పాఠ్యంలో ‘రెల్లుల సముద్రం’ ఉంచబడింది; పాఠకుల పరిచయార్థం సంప్రదాయ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ కవిత్వంలోని సమాంతర నిర్మాణం రెండు ఉపవాక్యాల ద్వారా కాపాడబడింది; దైవ కర్తను తెలుగులో అవసరమైన ‘ఆయన’తో స్పష్టం చేసినా పేరు చేర్చలేదు.
