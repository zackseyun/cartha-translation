translation:
  language: te
  text: 'అప్పుడు ప్రజలు మోషేపై సణిగారు, ఇలా అన్నారు: “మేమేమి తాగాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: సణుగుతూ
  rationale: అరణ్య ప్రయాణ వృత్తాంతాల్లో నాయకునికి విరోధంగా సమూహంగా అసంతృప్తి వ్యక్తం చేయడాన్ని ఈ క్రియ సూచిస్తుంది. ‘సణుగు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రతికూలమైన సామూహిక ఫిర్యాదు భావాన్ని నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עם అనే నామవాచకానికి నేరుగా ‘ప్రజలు’ అని అర్థం. ‘ఇశ్రాయేలు ప్రజలు’ అనడం సందర్భానికి అనుగుణమైనా మూలపాఠంలో లేని వివరణను చేర్చినట్లవుతుంది.
- source_word: עַל
  choice: మోషేకు విరోధంగా
  rationale: ఫిర్యాదు లేదా సణుగును సూచించే క్రియతో על, ఆ ఫిర్యాదు ఎవరిని లక్ష్యంగా చేసుకుందో తెలియజేస్తూ ప్రతికూల భావాన్ని ఇస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לֵאמֹר
  choice: అన్నారు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ప్రధాన క్రియతో కలిపి వ్యక్తం చేసింది.
- source_word: מַה
  choice: ఏమి
  rationale: ప్రశ్నను పరిచయం చేసే సరళ ప్రశ్నార్థక సర్వనామం.
- source_word: נִּשְׁתֶּה
  choice: మేమేమి తాగాలి
  rationale: שׁתה క్రియ యొక్క ప్రథమ పురుష బహువచన అసంపూర్ణ రూపం. ఇక్కడ తక్షణ అవసరం, ఆందోళన కలిసిన ప్రశ్నను ‘మేమేమి తాగాలి?’ సహజంగా తెలియజేస్తుంది.
