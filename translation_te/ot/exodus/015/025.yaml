id: EXO.15.25
reference: Exodus 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: te
  text: అప్పుడు అతడు యెహోవాకు మొరపెట్టాడు. యెహోవా అతనికి ఒక చెట్టును చూపించాడు. అతడు దానిని నీళ్లలో వేయగా, ఆ నీళ్లు తియ్యగా మారాయి. అక్కడ వారికి ఒక శాసనాన్ని, ఒక న్యాయాన్ని నిర్దేశించాడు; అక్కడే వారిని పరీక్షించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: మొరపెట్టాడు
  rationale: తీవ్రమైన సహాయవిన్నపాన్ని సూచించే హెబ్రీయ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో నిలుపుతుంది.
- source_word: עֵץ
  choice: ఒక చెట్టు
  rationale: మూలపదానికి ‘చెట్టు’ లేదా ‘కలప’ అనే అర్థాలు సాధ్యమైనా, ఈ సందర్భంలో మసొరెటిక్ పాఠానికి నేరుగా సరిపడే ‘చెట్టు’ను ఎంచుకున్నాం; పదార్థాన్ని కేవలం ‘చెక్కముక్క’గా పరిమితం చేయలేదు.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: ఆ నీళ్లు తియ్యగా మారాయి
  rationale: చేదుతనానికి వ్యతిరేకంగా నీరు తాగదగినదిగా మారిన భావాన్ని, మూలంలోని ‘తియ్యబడుట’ రూపకాన్ని కాపాడుతూ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: חֹק וּמִשְׁפָּט
  choice: ఒక శాసనాన్ని, ఒక న్యాయవిధిని
  rationale: రెండు వేర్వేరు న్యాయపదాలను కలిపివేయకుండా వాటి జతను నిలుపుతుంది.
- source_word: נִסָּהוּ
  choice: వారిని పరీక్షించాడు
  rationale: హెబ్రీయ ఏకవచన సర్వనామం సమూహమైన ఇశ్రాయేలును సూచిస్తుంది; తెలుగులో సందర్భానుగుణంగా బహువచనం సహజం.
theological_decisions:
- issue: ‘అక్కడ అతడు వారికి ఏర్పాటు చేశాడు’ మరియు ‘అక్కడ అతడు వారిని పరీక్షించాడు’ అనే వాక్యాల్లో కర్త ఎవరు?
  choice: ‘ఆయన’ ద్వారా యెహోవానే కర్తగా సూచించబడేలా అనువదించాం.
  alternative: మోషే కర్తగా భావించి ‘అతడు’ అని అనువదించడం.
  rationale: సమీపంలోని స్పష్ట కర్త యెహోవా; తరువాతి సందర్భంలో పరీక్షించేవాడు దేవుడే. అయినా మూలంలో ఈ రెండు క్రియలకు కర్త మళ్లీ పేరుతో చెప్పబడలేదు.
- issue: עֵץ యొక్క స్వరూపం
  choice: చెట్టు
  alternative: చెక్కముక్క / కలప
  rationale: పదానికి రెండూ సాధ్యమే; మూలపాఠం ఆ వస్తువు ఆకారం లేదా పరిమాణాన్ని నిర్దిష్టం చేయదు. అందువల్ల ప్రత్యేక అద్భుతసిద్ధాంతం లేదా సంకేతార్థాన్ని జోడించకుండా ప్రాథమిక అర్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని సంఘటనల క్రమం, ‘శాసనం—న్యాయవిధి’ అనే జత, పరీక్ష అనే ధార్మిక ఉద్వేగం నిలుపబడ్డాయి.
