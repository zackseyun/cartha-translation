  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: te
  text: ప్రజలు విని వణికారు; ఫిలిష్తీయుల దేశ నివాసులను వేదన పట్టుకుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలు విన్నారు; వారు వణుకుతున్నారు. ఫిలిష్తీయుల దేశ నివాసులను వణుకు పట్టుకుంది.” హీబ్రూ కవిత్వం దీనిని గత సంఘటనగానూ, కళ్లముందు జరుగుతున్నట్లుగా సజీవ వర్తమాన లేదా భవిష్య భావంతోనూ వ్యక్తపరచగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: విని
  rationale: שׁמע క్రియ యొక్క ఖచ్చిత భూతకాల రూపం. తెలుగు కవితా ప్రవాహంలో తరువాతి క్రియతో కలిపి ‘విని వణికారు’ అని చెప్పడం సహజంగా ఉంటుంది.
- source_word: עַמִּים
  choice: ప్రజలు
  rationale: עם పదం బహువచనంలో చుట్టుపక్కల జనసమూహాలను సూచిస్తుంది. ‘ప్రజలు’ దాని సామూహిక, బహువచన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יִרְגָּזוּ/ן
  choice: వణికారు
  rationale: רגז భయంతో వణకడం, కంపించడం లేదా కలవరపడడం అనే భావాలను ఇస్తుంది. సందర్భంలో భయంతో శరీరంగా వణికే భావం ప్రధానంగా కనిపిస్తుంది.
- source_word: חִיל
  choice: వేదన
  rationale: חיל వేదన, మెలికలు తిరిగే బాధ, ప్రసవవేదనవంటి బాధ లేదా వణుకు అనే విస్తృత భావపరిధి కలిగిన పదం. ‘వేదన’ ప్రసవ రూపకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా శారీరక-మానసిక బాధను వ్యక్తపరుస్తుంది.
- source_word: אָחַז
  choice: పట్టుకుంది
  rationale: אחז అంటే పట్టుకోవడం లేదా బలంగా ఆవరించడం. అమూర్త కర్త అయిన ‘వేదన’తో ‘పట్టుకుంది’ ఆధునిక తెలుగులో సహజంగా, బలంగా వినిపిస్తుంది.
- source_word: יֹשְׁבֵי
  choice: నివాసులను
  rationale: ישׁב కృదంతం ఇక్కడ ఒక ప్రాంతంలో నివసించేవారిని సూచించే నామవాచకంగా వాడబడింది. ‘నివాసులను’ సంక్షిప్తమైన, సహజమైన అనువాదం.
- source_word: פְּלָשֶׁת
  choice: ఫిలిష్తీయ దేశ
  rationale: ఇది ఫిలిష్తీయుల భూభాగానికి చెందిన స్థలనామం. తెలుగులో అంతగా పరిచయం లేని ‘ఫిలిష్తియా’ అనే లిప్యంతరీకరణకన్నా ‘ఫిలిష్తీయ దేశ’ అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: 'క్రియల కాలం: గత సంఘటనలా లేక సజీవ వర్తమాన/భవిష్య భావంతోనా'
  choice: 'ప్రధాన పాఠ్యంలో భూతకాల భావం: ‘విని వణికారు ... పట్టుకుంది’'
  alternative: ‘ప్రజలు వింటున్నారు; వణుకుతున్నారు ... వేదన పట్టుకుంది’ లేదా భవిష్య భావం
  rationale: మొదటి, మూడవ క్రియలు ఖచ్చిత భూతకాల రూపాల్లో ఉండగా మధ్య క్రియ అసంపూర్ణ రూపంలో ఉంది. గీతంలోని కవితా-ప్రవచన దృష్టి కాలభావాన్ని సజీవంగా చేయగలదు; ప్రధాన పాఠ్యంలో సహజమైన భూతకాల క్రమాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతానికి తగిన సంక్షిప్తమైన రెండు భాగాల వాక్య నిర్మాణం వాడబడింది. ‘వేదన పట్టుకుంది’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలంలోని బలమైన ఆవరించే భావాన్ని నిలుపుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
