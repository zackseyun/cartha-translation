source:
  edition: WLC
  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: te
  text: 'నీవు వారిని తీసుకువచ్చి,

    నీ స్వాస్థ్యపు పర్వతంలో[b] వారిని నాటుతావు[a]—

    యెహోవా, నీ నివాసం కొరకు నీవు చేసిన స్థలంలో,

    ప్రభువా,[c] నీ చేతులు స్థాపించిన పవిత్రస్థలంలో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని స్థిరపరుస్తావు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ అక్షరార్థంగా ‘వారిని నాటుతావు’; అది సురక్షితంగా స్థిరపడే చిత్రాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ స్వాస్థ్యపు పర్వతం’ అనేది దేవుడు తన ప్రజలకు ఇచ్చే దేశాన్ని విస్తృతంగా సూచించవచ్చు; లేదా దేవుని పవిత్రస్థలం ఉన్న పర్వతాన్ని మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ఈ వచనంలోని హీబ్రూ పాఠంలో ‘యెహోవా’ అనే దైవిక వ్యక్తినామం, ‘ప్రభువు’ అనే బిరుదు రెండూ ఉన్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: వారిని తీసుకొచ్చి
  rationale: హిఫీల్ రూపం ఒక ప్రదేశంలోకి తీసుకురావడం అనే కారణార్థక భావాన్ని ఇస్తుంది. తెలుగు కవితా ప్రవాహంలో గమ్యం తరువాత స్పష్టమవుతుంది కాబట్టి ‘తీసుకొచ్చి’ సహజంగా ఉంది.
- source_word: וְתִטָּעֵמוֹ
  choice: వారిని నాటుతావు
  rationale: נטע యొక్క ప్రత్యక్ష అర్థం ‘నాటు’. ఇక్కడ ప్రజలను స్థిరంగా నివసింపజేయడం అనే రూపకం ఉన్నప్పటికీ, కవితలోని సజీవమైన మొక్క రూపకాన్ని నిలుపుతుంది.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: నీ స్వాస్థ్య పర్వతం మీద
  rationale: ఈ పదబంధం యెహోవాకు స్వాస్థ్యంగా చెందిన పర్వతాన్ని సూచిస్తుంది. ‘మీద’ పర్వతంతో సహజమైన తెలుగు ప్రయోగం; విస్తృత దేశాన్నా, ప్రత్యేక పవిత్ర పర్వతాన్నా సూచిస్తుందనే సందిగ్ధతను అనువాదం పరిష్కరించదు.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: నీ నివాసం కోసం ... స్థలంలో
  rationale: מָכוֹן స్థిరపరచబడిన ప్రదేశం లేదా స్థలాన్ని సూచిస్తుంది. ‘స్థలం’ సామాన్య పాఠకులకు స్పష్టంగా ఉండి, దేవుని నివాసార్థం సిద్ధమైన ప్రదేశ భావాన్ని అందిస్తుంది.
- source_word: פָּעַלְתָּ
  choice: నీవు చేసిన
  rationale: פעל చేయడం లేదా నిర్మించడం అనే విస్తృత భావం గల క్రియ. ఇక్కడ ‘చేసిన’ మూలంలోని సరళతను కాపాడుతుంది; ‘సిద్ధం చేసిన’ అనేది సాధ్యమైనా కొంత వ్యాఖ్యానాత్మకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామాన్ని తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చి, దానిని ‘ప్రభువు’ అనే బిరుదుతో కలపకుండా వేరుగా నిలిపాం.
- source_word: מִקְּדָשׁ
  choice: పవిత్రస్థలం
  rationale: מקדש పవిత్రమైన స్థలం లేదా పరిశుద్ధాలయాన్ని సూచిస్తుంది. ‘పవిత్రస్థలం’ ఆలయం అని ముందుగానే మరీ నిర్దిష్టం చేయకుండా మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: ఇది దేవునికి వాడిన బిరుదు. సంబోధన నిర్మాణాన్ని తెలుగులో ‘ప్రభువా’ అని చూపడం సహజం; ముందున్న వ్యక్తినామం ‘యెహోవా’తో ఉన్న తేడా కూడా నిలుస్తుంది.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: నీ చేతులు స్థాపించిన
  rationale: כון ఇక్కడ స్థిరంగా నెలకొల్పడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. ‘నీ చేతులు’ అనే మానవరూపక చిత్రణను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఒకే వచనంలో יְהוָה మరియు אֲדֹנָי పేర్ల/బిరుదుల అనువాదం
  choice: יְהוָה ను ‘యెహోవా’గా, אֲדֹנָי ను ‘ప్రభువా’గా అనువదించడం
  alternative: రెండింటినీ ‘ప్రభువు’గా అనువదించడం
  rationale: హీబ్రూ పాఠంలో వ్యక్తినామం, బిరుదు రెండూ వేర్వేరుగా ఉన్నాయి. తెలుగు అనువాదంలో కూడా ఆ తేడాను నిలుపడం మూలపాఠానికి న్యాయం చేస్తుంది.
- issue: ‘నీ స్వాస్థ్య పర్వతం’ మరియు ‘పవిత్రస్థలం’ యొక్క భౌగోళిక సూచన
  choice: వాగ్దాన దేశం/పర్వతం మరియు దేవుని పవిత్రస్థలం మధ్య ఉన్న కవితాత్మక విస్తృతిని అలాగే ఉంచడం
  alternative: దీనిని నేరుగా సీయోను లేదా ఆలయ పర్వతంగా, లేక కనాను దేశమంతటిగా స్పష్టీకరించడం
  rationale: ఈ కవిత ఇశ్రాయేలు స్థిరనివాసాన్ని విస్తృతంగా, దేవుని పవిత్రస్థలాన్ని ప్రత్యేకంగా ముందుచూపుతో సూచించవచ్చు. మూలపాఠం ఖచ్చితంగా నిర్ధారించని భౌగోళిక గుర్తింపును అనువాదం బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మకమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి వాడబడింది. పాద విభజన హీబ్రూ కవితలోని సమాంతర నిర్మాణాన్ని స్పష్టపరుస్తుంది; ‘నాటు’, ‘నీ చేతులు’ వంటి మూల చిత్రణలు నిలుపబడ్డాయి.
