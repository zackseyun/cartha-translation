id: EXO.15.11
reference: Exodus 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: te
  text: 'యెహోవా, దేవుళ్లలో నీ వంటివాడెవడు?


    పరిశుద్ధతలో మహిమాన్వితుడవై,


    స్తుతులలో భయంకరుడవై,


    అద్భుతం చేసేవాడవైన నీ వంటివాడెవడు?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: దేవుళ్లలో
  rationale: אֵלִם అనే బహువచన రూపానికి నేరమైన అర్థం ‘దేవుళ్లు/దైవిక శక్తులు’. మూలంలోని తులనాత్మక ప్రశ్నను సిద్ధాంతపరంగా ముందే పరిష్కరించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: పరిశుద్ధతలో మహిమాన్వితుడవై
  rationale: נֶאְדָּר యొక్క మహిమ/ఘనత భావాన్ని, בַּקֹּדֶשׁ యొక్క ‘పరిశుద్ధతలో’ అనే భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: נוֹרָא תְהִלֹּת
  choice: స్తుతులలో భయభక్తులు పుట్టించేవాడవై
  rationale: נוֹרָא లోని భయానకమైన మహిమ, విస్మయభరిత భక్తి రెండింటినీ సూచిస్తుంది; కేవలం ‘భయపడబడేవాడు’ అన్న అసహజ రూపాన్ని నివారిస్తూ, תְהִלֹּת అనే బహువచనాన్ని నిలిపింది.
- source_word: עֹשֵׂה פֶלֶא
  choice: అద్భుతాలు చేసేవాడవైన
  rationale: అద్భుత కార్యాలు చేసే వాడనే క్రియాశీల భావాన్ని సహజంగా అందిస్తుంది; హీబ్రూలో פֶלֶא ఏకవచన సామూహిక భావంతో ఉండగలదు.
theological_decisions:
- issue: ‘దేవుళ్లలో’ అనే పదబంధం యొక్క భావం
  choice: మూలంలోని ‘దేవుళ్లలో’ అనే తులనను యథాతథంగా ఉంచడం
  alternative: ‘దైవిక శక్తులలో’ లేదా ‘బలవంతులలో’ అని స్పష్టీకరించడం
  rationale: ఈ పదం దేవతలు, దైవిక జీవులు, శక్తిమంతులు అనే పరిధిలో అర్థమవగలదు. వచనం ప్రకటించే యెహోవా అసమానత్వాన్ని నిలుపుతూ, మూలంలోని భావపరిధిని ఒకే సిద్ధాంత వివరణకు కుదించలేదు.
- issue: נוֹרָא యొక్క భావం
  choice: ‘భయభక్తులు పుట్టించేవాడవై’
  alternative: ‘భయంకరుడవై’ లేదా ‘భయపడబడేవాడవై’
  rationale: దైవమహిమ ఎదుట కలిగే భయం, విస్మయం, భక్తి అనే ఉద్వేగాలను కలిపి వ్యక్తం చేస్తుంది; మూలంలోని theological tensionను కేవలం భీతి లేదా కేవలం ప్రశంసగా తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కవిత్వానికి తగిన గంభీరతతో, అయితే సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతో నాలుగు పాదాలుగా అమర్చబడింది. సంబోధనను మొదట ఉంచి తెలుగు వాక్యప్రవాహాన్ని సహజం చేశాం.
