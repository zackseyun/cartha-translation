  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: te
  text: 'అప్పుడు ఎదోము నాయకులు భయభ్రాంతులయ్యారు;

    మోయాబు ప్రముఖులను[a] వణుకు పట్టుకుంది;

    కనాను నివాసులందరూ కరిగిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోయాబు బలవంతులు.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘మోయాబు బలవంతులు/పొట్టేళ్లు’ అని ఉంటుంది; ఇక్కడ అది ప్రముఖులైన లేదా నాయకులైన పురుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందు వర్ణించిన యెహోవా రక్షణ కార్యానికి పర్యవసానంగా వచ్చిన ప్రతిస్పందనను సూచించే సహజమైన కాలవాచకం.
- source_word: נִבְהֲלוּ
  choice: భయభ్రాంతులయ్యారు
  rationale: భయంతో కలవరపడడం, దిగ్భ్రాంతి చెందడం అనే నిఫల్ రూపపు తీవ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: ఎదోము నాయకులు
  rationale: אַלּוּף అనేది వంశాధిపతి లేదా ముఖ్య నాయకుణ్ణి సూచించగలదు; నిర్దిష్టమైన రాజపదవిని ఆపాదించకుండా నాయకత్వ భావాన్ని నిలుపుతుంది.
- source_word: אֵילֵי מוֹאָב
  choice: మోయాబు ప్రముఖులు
  rationale: మూలపదంలో బలం అనే భావంతో పాటు సమాజంలోని శక్తిమంతులైన ప్రముఖుల సూచన ఉంది. సమాంతర పాదంలోని ఎదోము నాయకులకు అనుగుణంగా ‘ప్రముఖులు’ సహజంగా ఉంది; అక్షరార్థ సంబంధాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: వణుకు పట్టుకుంది
  rationale: వణుకు వారిని పట్టుకుందనే మూలంలోని సజీవ వ్యక్తీకరణను సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: נָמֹגוּ
  choice: కరిగిపోయారు
  rationale: భయంతో ధైర్యం పూర్తిగా క్షీణించడాన్ని సూచించే ‘కరిగిపోవడం’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: కనాను నివాసులందరూ
  rationale: కనానులో నివసించే వారందరినీ సూచించే సమష్టి పరిధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
