source:
  edition: WLC
  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: te
  text: నీవు నీ కుడిచేతిని చాపావు; భూమి వారిని మింగివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేల వారిని మింగివేసింది.’
    reason: אָרֶץ అనే పదానికి సందర్భానుసారం ‘భూమి’ లేదా ‘నేల’ అనే అర్థాలు ఉండవచ్చు.
lexical_decisions:
- source_word: נָטִיתָ
  choice: నీవు … చాపావు
  rationale: נטה యొక్క Qal సంపూర్ణరూపం, రెండవ పురుష ఏకవచనం; దేవుణ్ణి నేరుగా సంబోధిస్తోంది. ‘చాపావు’ అనే పదం స్పష్టమైన శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְמִינְךָ
  choice: నీ కుడిచేతిని
  rationale: అక్షరార్థంగా ‘నీ కుడిచేయి.’ కవిత్వంలో ఇది శక్తిని సూచించినా, మూలంలోని సజీవమైన అవయవ రూపకాన్ని వ్యాఖ్యానించి ‘నీ శక్తి’గా మార్చకుండా నిలుపుతుంది.
- source_word: תִּבְלָעֵמוֹ
  choice: వారిని మింగివేసింది
  rationale: בלע అంటే ‘మింగు, కబళించు.’ క్రియలోని స్త్రీలింగ ఏకవచన కర్త తరువాత వచ్చే אָרֶץ; బహువచన కర్మప్రత్యయం ‘వారిని.’ ‘మింగివేసింది’ మూలంలోని ఉజ్జ్వల రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אָרֶץ
  choice: భూమి
  rationale: אֶרֶץకు ‘భూమి,’ ‘దేశం/నేల’ అనే అర్థాలు సాధ్యం. శత్రువులు కబళించబడిన ఈ కవితాత్మక దృశ్యంలో ‘భూమి’ విస్తృతమైన, నాటకీయ భావాన్ని ఇస్తుంది; అయినా ‘నేల’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: దైవిక చర్యకు మానవరూప వర్ణన
  choice: ‘నీ కుడిచేతిని’ అనే స్పష్టమైన రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ శక్తిని’ లేదా ‘నీ బలమైన చేతిని’
  rationale: హీబ్రూ కవితాత్మక స్తుతిలో దేవుని చర్యను మానవ అవయవ రూపకంతో వర్ణిస్తుంది. దానిని అమూర్తమైన ‘శక్తి’గా మార్చకుండా ఉంచడం సాహిత్య, ధార్మిక బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను మరియు దేవునికి చేసే ప్రత్యక్ష సంబోధనను నిలిపాం. ‘మింగివేసింది’ అనే సహజమైన పదబంధం హీబ్రూ రూపకంలోని తీవ్రతను వ్యక్తం చేస్తుంది.
