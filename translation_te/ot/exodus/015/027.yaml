language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵילִ֔מָ/ה וְ/שָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְ/שִׁבְעִ֣ים תְּמָרִ֑ים וַ/יַּחֲנוּ שָׁ֖ם עַל הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: te
  text: తరువాత వారు ఏలీముకు వచ్చారు. అక్కడ పన్నెండు నీటి ఊటలు, డెబ్బై ఖర్జూరపు చెట్లు ఉన్నాయి. వారు అక్కడ నీటి దగ్గర శిబిరం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: తరువాత వారు వచ్చారు
  rationale: వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘తరువాత’ ఆ వరుస భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵילִמָה
  choice: ఏలీముకు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, చివరనున్న దిశాసూచక ה భావాన్ని ‘-కు’తో వ్యక్తం చేశాం.
- source_word: שָׁם
  choice: అక్కడ
  rationale: మూలంలోని స్థలసూచక క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: עֵינֹת מַיִם
  choice: నీటి ఊటలు
  rationale: עַיִן ఇక్కడ నీరు ఉబికి వచ్చే సహజ ఊటను సూచిస్తుంది; ఎడారి ప్రయాణ సందర్భంలో ‘నీటి ఊటలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: డెబ్బై ఖర్జూరపు చెట్లు
  rationale: תָּמָר సాధారణంగా ఖర్జూరపు తాటిని సూచిస్తుంది. ‘ఖర్జూరపు చెట్లు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; విస్తృతమైన ‘తాటి చెట్లు’ను పాదసూచికలో ఉంచాం.
- source_word: וַיַּחֲנוּ
  choice: శిబిరం వేశారు
  rationale: חנה అంటే ఒక చోట మకాం లేదా శిబిరం వేయడం. ‘శిబిరం వేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రయాణ సందర్భాన్ని కాపాడుతుంది.
- source_word: עַל הַמָּיִם
  choice: నీటి దగ్గర
  rationale: עַל ఇక్కడ నీటి మీద అని కాక, నీటి సమీపంలో అని సూచిస్తుంది. מַיִם రూపపరంగా బహువచనమైనా సమష్టి అర్థంలో వాడబడుతుంది; తెలుగులో ఏకవచన సమష్టి ‘నీరు’ సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస సంఘటనలను తెలుగులో చిన్న వాక్యాలుగా విభజించడం ద్వారా స్పష్టతను పెంచాం; భావాన్ని మార్చలేదు.
