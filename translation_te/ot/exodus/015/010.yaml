source:
  edition: WLC
  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: te
  text: 'నీ గాలితో నీవు ఊదావు;

    సముద్రం వారిని కప్పివేసింది.[a]

    ప్రబలమైన జలాల్లో వారు సీసంలా మునిగిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ శ్వాసతో.’ హీబ్రూ పదానికి ‘గాలి,’ ‘శ్వాస,’ లేదా ‘ఆత్మ’ అనే అర్థాలు రావచ్చు; ఇక్కడ సముద్రం దాటిన సందర్భం ‘గాలి’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: నీవు ఊదావు
  rationale: נשׁף అంటే ఊదడం లేదా శ్వాసను వెలువరించడం. సముద్రంపై దేవుని చర్యను వర్ణించే ఈ కవితాత్మక సందర్భంలో ‘ఊదావు’ సహజంగా ఉండి మూల చిత్రణను నిలుపుతుంది.
- source_word: בְרוּחֲךָ
  choice: నీ గాలితో
  rationale: רוּחַ అనే పదానికి గాలి, శ్వాస, ఆత్మ అనే అర్థాలు ఉండవచ్చు. ‘ఊదావు’ అనే క్రియతోనూ సముద్రం దాటిన సందర్భంతోనూ ‘గాలి’ ప్రధాన పాఠ్యంలో అత్యంత సహజం; ‘శ్వాస’ను పాదసూచికలో నిలిపాం.
- source_word: כִּסָּמוֹ יָם
  choice: సముద్రం వారిని కప్పివేసింది
  rationale: כסה యొక్క ప్రాథమిక భావం ‘కప్పడం’. ఈ అనువాదం 3వ పురుష బహువచన కర్మప్రత్యయాన్ని స్పష్టంగా చూపిస్తూ, ‘ముంచివేసింది’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: צָלֲלוּ
  choice: వారు మునిగిపోయారు
  rationale: ఇక్కడ צלל జలాల్లో కిందికి మునిగిపోవడాన్ని సూచిస్తుంది. వెంట వచ్చే సీసపు ఉపమానంతో ‘మునిగిపోయారు’ స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: כָּעוֹפֶרֶת
  choice: సీసంలా
  rationale: עוֹפֶרֶת అంటే సీసం అనే లోహం. ‘సీసంలా’ మూల ఉపమానాన్నీ బరువు భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּמַיִם אַדִּירִים
  choice: ప్రబలమైన జలాల్లో
  rationale: אַדִּירִים బలం, మహత్వం, ప్రభావం వంటి భావాలను ఇస్తుంది. ‘ప్రబలమైన’ ఇక్కడ జలాల శక్తిని తెలియజేస్తూ, మూలంలో లేని ‘లోతైన’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: దైవిక-కవితాత్మక సందర్భంలో רוּחַ యొక్క అర్థం
  choice: గాలి
  alternative: శ్వాస; ఆత్మ
  rationale: సముద్రం వద్ద ఐగుప్తీయుల ఓటమి అనే భౌతిక సందర్భం, అలాగే ‘నీవు ఊదావు’ అనే జతక్రియ ‘గాలి’ లేదా ‘శ్వాస’ భావాన్ని బలపరుస్తాయి; పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తున్నట్లు ప్రధాన పాఠ్యం నిర్ణయించదు. ‘శ్వాస’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా భావ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. హీబ్రూ పాదాల క్రమాన్ని వీలైనంతవరకు నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం వాడబడింది; ‘ప్రబలమైన జలాలు’ మూలంలోని శక్తి/మహత్వ భావాన్ని కాపాడుతుంది.
