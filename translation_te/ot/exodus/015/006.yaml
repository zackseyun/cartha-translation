source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: te
  text: 'యాహ్వే[a], నీ కుడిచేయి శక్తిలో మహోన్నతమైనది;

    యాహ్వే, నీ కుడిచేయి శత్రువును ఛిన్నాభిన్నం చేస్తుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శత్రువును నలిపివేస్తుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: నీ కుడిచేయి
  rationale: యָמִין అనే పదానికి అక్షరార్థంగా ‘కుడిచేయి’ లేదా ‘కుడివైపు’ అని అర్థం. విజయగీతంలోని దేవుని శక్తివంతమైన కార్యాన్ని సూచించే స్పష్టమైన కవితా రూపకాన్ని ‘నీ కుడిచేయి’ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ అనే రూపంలో అందించాం.
- source_word: נֶאְדָּרִי
  choice: మహిమాన్వితమైంది
  rationale: אדר మూలం మహిమ, వైభవం, ఘనత అనే భావాలను ఇస్తుంది. ఇక్కడ స్త్రీలింగమైన ‘కుడిచేయి’కి అనుగుణంగా, కవితా గంభీరతను నిలిపే విధంగా ‘మహిమాన్వితమైంది’ అని అనువదించాం.
- source_word: בַּכֹּחַ
  choice: శక్తిలో
  rationale: כֹּחַ అంటే శక్తి, బలం. ב ఉపసర్గను సమీపంగా ప్రతిబింబిస్తూ, దేవుని కుడిచేయి శక్తి విషయంలో మహిమాన్వితమని తెలిపేందుకు ‘శక్తిలో’ వాడాం.
- source_word: תִּרְעַץ
  choice: తుత్తునియలు చేస్తుంది
  rationale: רָעַץ అనే క్రియ పగులగొట్టడం, చిదిమేయడం, నలగగొట్టడం వంటి తీవ్రమైన భావాన్ని ఇస్తుంది. విజయగీతంలోని నిర్ణాయకమైన దెబ్బను సహజమైన, సజీవమైన తెలుగులో ‘తుత్తునియలు చేస్తుంది’ వ్యక్తం చేస్తుంది.
- source_word: אוֹיֵב
  choice: శత్రువును
  rationale: ఈ పదం రూపంలో ఏకవచనమైనప్పటికీ సమూహార్థంలోనూ వాడవచ్చు. ‘శత్రువును’ అనే ఏకవచన రూపం మూలపాఠానికి దగ్గరగా ఉండి, ఐగుప్తు అనే విరోధ శక్తికి కూడా సందర్భోచితంగా సరిపోతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత నామాన్ని కాపాడేందుకు ‘యెహోవా’ అని ఇచ్చి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: దేవుని ‘కుడిచేయి’ అనే మానవరూప వర్ణన
  choice: నీ కుడిచేయి
  alternative: నీ శక్తి
  rationale: మూలంలోని శరీరాంగ రూపకాన్ని నేరుగా ఉంచాం. దాన్ని కేవలం ‘నీ శక్తి’ అని వివరణాత్మకంగా మార్చడం కవితా దృశ్యాన్ని, పదపునరుక్తిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు పాదాల్లోని ‘యెహోవా, నీ కుడిచేయి’ అనే పునరుక్తిని మూల విజయగీతం ప్రకారమే నిలిపాం; మొదటి పాదంలో స్థితిని, రెండవ పాదంలో కార్యాన్ని స్పష్టంగా చూపించాం.
