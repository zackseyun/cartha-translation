  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీళ్లు’ వంటి సహజమైన బహువచన రూపం ఎంపికైంది; స్థలనామం ‘షూరు’గా లిప్యంతరీకరించబడింది.
