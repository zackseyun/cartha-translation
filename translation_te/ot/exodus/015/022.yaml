  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: te
  text: తరువాత మోషే ఇశ్రాయేలీయులను రెల్లుల సముద్రం[a] నుండి ముందుకు నడిపించాడు. వారు షూరు అరణ్యంలోకి వెళ్లారు. వారు అరణ్యంలో మూడు రోజులు ప్రయాణించి, వారికి నీరు దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదిస్తారు; హీబ్రూలో ‘రెల్లుల సముద్రం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: ముందుకు నడిపించాడు
  rationale: נסע హిఫీల్ రూపం మోషే ఇశ్రాయేలీయులను అక్కడి నుంచి ప్రయాణం కొనసాగించేలా చేశాడనే కారణార్థక భావాన్ని ఇస్తుంది. ‘ముందుకు నడిపించాడు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִיַּם סוּף
  choice: రెల్లుసముద్రం
  rationale: యామ్ సూఫ్ అనే హీబ్రూ పదబంధానికి ‘రెల్లుల సముద్రం’ అనే మూలార్థం ఉంది. తెలుగులో సహజమైన సమాసరూపంగా ‘రెల్లుసముద్రం’ వాడబడింది; సంప్రదాయ అనువాదం పాదసూచికలో ఉంచబడింది.
- source_word: מִדְבַּר שׁוּר
  choice: షూరు అరణ్యం
  rationale: מִדְבָּר అనేది తప్పనిసరిగా ఇసుక ఎడారినే కాక, జనావాసం తక్కువగా ఉన్న అరణ్యప్రాంతాన్ని కూడా సూచిస్తుంది. అందువల్ల సాధారణ బైబిలు సందర్భానికి సరిపోయే ‘అరణ్యం’ ఎంచుకోబడింది.
- source_word: וַיֵּצְאוּ
  choice: వెళ్లారు
  rationale: יצא అంటే బయటికి వెళ్లడం. సముద్ర ప్రాంతం నుంచి షూరు అరణ్యంలోకి సాగిన కథన గమనాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘వెళ్లారు’ సరిపోతుంది.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజులు
  rationale: ఇది కాలవ్యవధిని నేరుగా సూచిస్తుంది. ‘మూడు రోజుల ప్రయాణం’ అని విస్తరించడం మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చవచ్చు.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: בְּ ఉపసర్గకు ఇక్కడ ‘లో’ అనే సూటి భావం ఉంది. ‘అరణ్యంలో’ మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: לֹא מָצְאוּ מָיִם
  choice: వారికి నీళ్లు దొరకలేదు
  rationale: ‘నీటిని కనుగొనలేదు’ అనే అక్షరార్థం కంటే ‘నీళ్లు దొరకలేదు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి మూలభావాన్ని కాపాడుతుంది.
