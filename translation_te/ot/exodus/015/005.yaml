  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. హెబ్రీ కవిత్వంలోని జలాగాధం, కిందికి దిగడం, రాయి వంటి చిత్రాలను నిలిపి, రెండు వేరు హెబ్రీ లోతు-పదాలకు ‘అగాధ జలాలు’ మరియు ‘సముద్రపు లోతులు’ అనే వేరు తెలుగు రూపాలు ఇచ్చాం.
