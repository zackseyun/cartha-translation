    reason: תְּהֹמֹתను ‘జలాగాధాలు’ అని, יָרְדוּను సందర్భానుసారంగా ‘మునిగిపోయారు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: అగాధ జలాలు
  rationale: תְּהוֹם బహువచనం లోతైన జలాలను లేదా జలాగాధాలను సూచిస్తుంది. ‘అగాధ జలాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, కవితాత్మక జలచిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְכַסְיֻמוּ
  choice: వారిని కప్పివేశాయి
  rationale: כסה అనే మూలానికి ‘కప్పుట’ అనే ప్రత్యక్ష అర్థం ఉంది; 3 పురుష బహువచన కర్మప్రత్యయం ‘వారిని’గా వ్యక్తమవుతుంది. ‘కప్పివేశాయి’ సందర్భంలోని సంపూర్ణ ముంపును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יָרְדוּ
  choice: దిగిపోయారు
  rationale: ירד యొక్క ప్రాథమిక భావం ‘దిగుట/కిందికి వెళ్లుట.’ ‘దిగిపోయారు’ మూలంలోని అవరోహణ చిత్రాన్ని నిలుపుతుంది; ‘మునిగిపోయారు’ అనేది సందర్భానుకూలమైనప్పటికీ కొంత వ్యాఖ్యాత్మకం.
- source_word: בִמְצוֹלֹת
  choice: సముద్రపు లోతుల్లోకి
  rationale: מְצוֹלָה ముఖ్యంగా సముద్రంలోని లోతైన ప్రదేశాలను సూచిస్తుంది. చలన క్రియతో కూడిన ב ను తెలుగులో సహజంగా ‘లోతుల్లోకి’ అని ఇచ్చి, మొదటి పాదంలోని תְּהֹמֹתతో ఉన్న సంబంధాన్ని నిలుపుతూ వేరు పదప్రయోగాన్ని వాడాం.
- source_word: כְּמוֹ
  choice: లా
  rationale: సమానతను తెలిపే సాధారణ కణం; ఆధునిక తెలుగులో ‘రాయిలా’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: אָבֶן
  choice: రాయి
  rationale: సాధారణ నామవాచకం ‘రాయి.’ తెలుగు ఉపమాన నిర్మాణంలో ‘రాయిలా’ సహజమైన రూపం.
