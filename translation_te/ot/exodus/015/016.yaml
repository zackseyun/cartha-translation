source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: te
  text: 'భీతి, భయం వారిమీద పడతాయి;

    నీ బాహువు గొప్పతనం వల్ల

    వారు రాయిలా నిశ్చలంగా ఉంటారు[a]—

    యాహ్వే, నీ ప్రజలు దాటిపోయే వరకు[b],

    నీవు నీ సొంతం చేసుకున్న[c] ఈ ప్రజలు దాటిపోయే వరకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మౌనంగా ఉంటారు’ లేదా ‘కదలకుండా ఉంటారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ ప్రజలు అవతలికి దాటే వరకు ... ఈ ప్రజలు అవతలికి దాటే వరకు.’
    reason: lexical_alternative
  - marker: c
    text: ‘నీ సొంతం చేసుకున్న’ అనే మాటను ‘సంపాదించుకున్న’ లేదా ‘కొనుకున్న’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל
  choice: పడతాయి
  rationale: స్త్రీవాచక ఏకవచన క్రియను, తరువాత వచ్చే జంట భావపదాలకు సరిపోయే సహజ తెలుగు బహువచన నిర్మాణంగా అనువదించాం; గీతంలోని భావి ప్రకటనను నిలుపుకున్నాం.
- source_word: אֵימָתָה וָפַחַד
  choice: భీతి, భయం
  rationale: దగ్గర అర్థాలున్న రెండు పదాల కవితాత్మక తీవ్రతను పునరుక్తిగా కాకుండా, సహజమైన తెలుగు జంట పదాలతో నిలిపాం.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: నీ బాహువు గొప్పతనం వల్ల
  rationale: ‘బాహువు’ అనే శక్తి రూపకాన్ని అలాగే ఉంచి, ב యొక్క కారణం/సాధనం భావాన్ని ‘వల్ల’తో వ్యక్తం చేశాం.
- source_word: יִדְּמוּ
  choice: నిశ్చలంగా ఉంటారు
  rationale: మౌనం, కదలికలేమి రెండింటినీ సూచించగల మూలపద విస్తృతిని ‘నిశ్చలంగా’ కొంతవరకు నిలుపుతుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: כָּאָבֶן
  choice: రాయిలా
  rationale: హీబ్రూ ఉపమానాన్ని సహజమైన, ప్రత్యక్షమైన తెలుగు రూపంలో నిలిపాం.
- source_word: עַד יַעֲבֹר
  choice: దాటిపోయే వరకు
  rationale: ప్రజలు ముందుకు సాగి దాటడం అనే సందర్భార్థాన్ని ఇస్తుంది; నిర్దిష్టంగా జలాన్ని దాటడమేనని పరిమితం చేయదు.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: దేవునికీ ఇశ్రాయేలుకీ ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: עַם זוּ
  choice: ఈ ప్రజలు
  rationale: זוּ లోని సూచనార్థాన్ని ‘ఈ’తో స్పష్టంగా నిలిపాం.
- source_word: קָנִיתָ
  choice: నీవు నీ సొంతం చేసుకున్న
  rationale: సంపాదించడం/కొనడం/స్వాధీనం చేసుకోవడం అనే విస్తృత భావాన్ని, అవసరానికి మించి విమోచన సంబంధమైన సాంకేతిక అర్థాన్ని చేర్చకుండా, సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో ఇచ్చాం.
- issue: కావ్య సందర్భంలో קָנִיתָ అర్థం
  choice: నీవు నీ సొంతం చేసుకున్న
  alternative: నీవు సంపాదించుకున్న; నీవు కొనుకున్న
  rationale: ఇది దేవుడు ఈ ప్రజలను తనవారిగా చేసుకున్నాడనే సంబంధార్థాన్ని నిలుపుతుంది; అయితే మూలపదం చెప్పేదానికంటే నిర్దిష్టమైన విమోచన సిద్ధాంతాన్ని వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మక పంక్తి విభజనతో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘బాహువు’ అనే బైబిలీయ రూపకాన్ని నిలిపి, అర్థసందిగ్ధతలను పాదటిప్పణుల్లో భద్రపరిచాం.
