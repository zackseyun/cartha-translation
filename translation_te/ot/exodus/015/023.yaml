  naturalness: The narrative is modern and readily understandable. The revised wording is equally natural while more explicitly connecting the water with Marah.
  terminology: “మారా” appropriately transliterates the place name, and “చేదు” correctly renders the wordplay’s descriptive element. The footnote appropriately signals the Hebrew wordplay without making an unwarranted lexical claim.
