source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ מָרָ֔תָ/ה וְ/לֹ֣א יָֽכְל֗וּ לִ/שְׁתֹּ֥ת מַ֨יִם֙ מִ/מָּרָ֔ה כִּ֥י מָרִ֖ים הֵ֑ם עַל כֵּ֥ן קָרָֽא שְׁמָ֖/הּ מָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: te
  text: తరువాత వారు మారాకు[a] వచ్చారు. అయితే మారాలోని నీళ్లు చేదుగా ఉండడంతో వారు వాటిని తాగలేకపోయారు. అందుకే ఆ చోటుకు మారా అని పేరు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మారా” అనే పేరు హీబ్రూలో “చేదు” అనే పదాన్ని పోలి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: తరువాత వారు వచ్చారు
  rationale: వయ్యిక్టోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘తరువాత’ దాని క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מָרָתָה
  choice: మారాకు
  rationale: దిశను సూచించే הతో ఉన్న స్థలనామం; తెలుగులో గమ్యాన్ని ‘-కు’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: וְלֹא יָכְלוּ לִשְׁתֹּת
  choice: అయితే ... తాగలేకపోయారు
  rationale: וְ ఇక్కడ చేరుకోవడం మరియు తాగలేకపోవడం మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: מַיִם מִמָּרָה
  choice: మారా నీళ్లు
  rationale: מן మూలాన్ని సూచిస్తుంది. ‘మారా నీళ్లు’ అనే సహజ తెలుగు ప్రయోగం ఆ ప్రదేశంలోని లేదా అక్కడి నుంచి లభించిన నీళ్లనే సూచిస్తుంది.
- source_word: כִּי מָרִים הֵם
  choice: నీళ్లు చేదుగా ఉండడంతో
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది. మַיִםకు అనుగుణమైన హీబ్రూ బహువచన భావాన్ని తెలుగులో సహజమైన ‘నీళ్లు ... ఉండడంతో’గా ఉంచాం.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: పేరు పెట్టడానికి కారణాన్ని సూచించే నిర్ధారణాత్మక పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: ఆ చోటుకు మారా అని పేరు వచ్చింది
  rationale: క్రియకు స్పష్టమైన కర్త లేదు; ఏ వ్యక్తిని కర్తగా చేర్చకుండా, పేరుపడిన భావాన్ని సహజ తెలుగు అకర్మక నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: מָרָה / מָרִים
  choice: మారా / చేదు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, విశేషణాన్ని అనువదించడం ద్వారా పేరుకూ నీటి చేదుతనానికీ ఉన్న పదబంధ సంబంధాన్ని పాదసూచికతో తెలియజేశాం.
