  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘నీళ్లు’ అనే సహజ బహువచన రూపం మూలంలోని వ్యాకరణ అన్వయాన్ని కూడా నిలుపుతుంది.
