base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: te
  text: అప్పుడు ప్రవక్తురాలైన అహరోను సోదరి మిర్యాము తన చేతిలో చేతి డప్పును తీసుకుంది. స్త్రీలందరూ చేతి డప్పులతో, నాట్యాలతో[a] ఆమె వెంట బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నృత్యంతో.” హెబ్రీ పదాన్ని క్రియాభావంలో “నృత్యం చేస్తూ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: అప్పుడు ... తీసుకుంది
  rationale: వావ్-వరుస రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో సహజమైన కాలక్రమాన్ని “అప్పుడు” తెలియజేస్తుంది.
- source_word: מִרְיָם הַנְּבִיאָה
  choice: ప్రవక్తురాలైన మిర్యాము
  rationale: స్త్రీలింగ రూపమైన הַנְּבִיאָהను సహజమైన ఆధునిక తెలుగు పదం “ప్రవక్తురాలు”తో స్పష్టంగా నిలిపి, పేరును తెలుగు బైబిలు సంప్రదాయానుసారం “మిర్యాము”గా లిప్యంతరీకరించాం.
- source_word: אֲחוֹת אַהֲרֹן
  choice: అహరోను సోదరి
  rationale: హెబ్రీ పాఠం మిర్యామును ప్రత్యేకంగా అహరోను సోదరిగా గుర్తిస్తున్నందున ఆ సంబంధాన్ని యథాతథంగా ఉంచాం.
- source_word: הַתֹּף
  choice: చేతి డప్పు
  rationale: תֹף అనేది చేతితో పట్టుకొని వాయించే చట్రపు వాద్యం. భారతీయ సందర్భంలో తీగ వాద్యాన్ని సూచించగల “తంబురా” అనే పదం వల్ల కలిగే అపార్థాన్ని నివారించడానికి “చేతి డప్పు” ఎంచుకున్నాం.
- source_word: בְּיָדָהּ
  choice: తన చేతిలో
  rationale: స్వామ్య సంబంధాన్ని తెలుగులో సహజంగా తెలిపే ప్రతిబింబ సర్వనామంతో మూలంలోని స్థానార్థక పదబంధాన్ని నిలిపాం.
- source_word: וַתֵּצֶאןָ כָל הַנָּשִׁים אַחֲרֶיהָ
  choice: స్త్రీలందరూ ... ఆమె వెంట బయలుదేరారు
  rationale: יצא యొక్క బయటకు వెళ్లడం/బయలుదేరడం అనే కథన భావాన్ని, אַחֲרֶיהָలోని అనుసరణ భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేశాం.
- source_word: בְּתֻפִּים
  choice: చేతి డప్పులతో
  rationale: ముందటి ఏకవచన వాద్యపదానికి అనుగుణంగా బహువచనాన్ని ఇచ్చి, בְּ యొక్క సహచర్య లేదా సాధన భావాన్ని “తో” ద్వారా నిలిపాం.
- source_word: וּבִמְחֹלֹת
  choice: నాట్యాలతో
  rationale: బహువచన నామవాచక రూపాన్ని నిలిపేలా “నాట్యాలతో” అని అనువదించాం; సందర్భంలో ఇది ఉత్సవపూర్వక సామూహిక నృత్యాన్ని సూచిస్తుంది.
