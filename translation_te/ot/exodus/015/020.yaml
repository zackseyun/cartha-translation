translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. మూలంలోని స్త్రీలింగ ప్రవక్త పదాన్ని స్పష్టంగా ఉంచి, ప్రాచీన వాద్యాన్ని అపార్థం లేకుండా “చేతి డప్పు”గా తెలిపాం. అడుగుటిప్పణి సూచికను దానికి సంబంధించిన “నాట్యాలతో” పదం వద్ద ఉంచాం.
