lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אִישׁ מִלְחָמָה
  choice: యుద్ధవీరుడు
  rationale: అక్షరార్థంగా ‘యుద్ధపు మనిషి’ అయిన ఈ హీబ్రూ పదబంధం సందర్భంలో యుద్ధంలో పోరాడే వీరుణ్ణి సూచిస్తుంది; ‘యుద్ధవీరుడు’ సహజమైన, గంభీరమైన తెలుగు.
- source_word: שְׁמוֹ
  choice: అనేది ఆయన పేరు
  rationale: క్రియలేని ‘యెహోవా—ఆయన పేరు’ అనే హీబ్రూ వాక్యాన్ని, దైవనామంపై ఉన్న ఉద్ఘాటనను నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగానే ఉంచాం; ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదటిప్పణిలో సూచించాం.
- issue: אִישׁ מִלְחָמָהను అక్షరార్థంగా లేదా నుడికారార్థంగా అనువదించడం
  choice: యుద్ధవీరుడు
  alternative: యుద్ధపు మనిషి
  rationale: అక్షరార్థ రూపం తెలుగులో అసహజంగా, తప్పుగా అర్థమయ్యే అవకాశం ఉంది. ‘యుద్ధవీరుడు’ హీబ్రూ రూపకంలోని యుద్ధసామర్థ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కవితాత్మక శైలిని పాటించాం. ‘యుద్ధవీరుడు’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలంలోని బలమైన యుద్ధరూపకాన్ని నిలుపుతుంది.
