    text: హీబ్రూలో YHWH అనే దైవనామం; దీనిని ‘యాహ్వే’ అని లిప్యంతరీకరించారు. సంప్రదాయంగా ‘యెహోవా’ లేదా ‘ప్రభువు’ అని కూడా అందిస్తారు.
