revisions:
- from: యెహోవా యుద్ధవీరుడు; యెహోవా అనేది ఆయన పేరు.[a]
  to: యాహ్వే[a] యుద్ధవీరుడు; యాహ్వే ఆయన పేరు.
  rationale: The revision aligns the Telugu divine-name rendering with the POB decision for YHWH, preserves its repetition in the Hebrew, and replaces the less natural ‘అనేది ఆయన పేరు’ with the compact, emphatic ‘ఆయన పేరు.’ The idiomatic ‘యుద్ధవీరుడు’ is retained as an accurate and natural rendering of ‘man of war.’
