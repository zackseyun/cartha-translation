id: EXO.15.21
reference: Exodus 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: te
  text: 'మిర్యాము వారికి ఇలా ప్రతిస్పందించింది[a]: “యాహ్వేకు పాడండి; ఎందుకంటే ఆయన మహోన్నతంగా విజయం సాధించాడు[b]. గుర్రాన్నీ, దాని రౌతునీ సముద్రంలోకి విసిరివేశాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిర్యాము వారికి ప్రతిగానంగా పాడుతూ ప్రతిస్పందించింది.” ఇక్కడి హీబ్రూ క్రియకు ప్రాథమిక అర్థం “జవాబిచ్చింది/ప్రతిస్పందించింది”; గాన సందర్భంలో అది ప్రతిగానాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “ఆయన ఎంతో ఉన్నతుడయ్యాడు” లేదా “తన ఔన్నత్యాన్ని ఘనంగా కనబరిచాడు.” విజయగీత సందర్భంలో ఇది ఆయన మహిమాన్విత విజయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: ప్రతిస్పందిస్తూ ఇలా పాడింది
  rationale: ענה అనే క్రియ ప్రాథమికంగా ‘జవాబిచ్చింది/ప్రతిస్పందించింది’ అని అర్థం. ఈ గాన సందర్భంలో ప్రతిగానంగా స్పందించడాన్ని సూచించవచ్చు; సహజమైన తెలుగులో ఆ సందర్భార్థాన్ని వ్యక్తం చేస్తూనే మూల భావాన్ని నిలుపుతుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: హీబ్రూ పురుష బహువచన ప్రత్యయాన్ని లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజమైన తెలుగు బహువచన రూపంతో అనువదించాం.
- source_word: מִרְיָם
  choice: మిర్యాము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: שִׁירוּ
  choice: పాడండి
  rationale: ఇది שׁיר క్రియ యొక్క బహువచన ఆజ్ఞార్థకం; ‘స్తుతి పాడండి’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నేరుగా అనువదించాం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: యెహోవా నామచతుష్టయం יְהוָהను వ్యక్తిగత నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: גָאֹה גָּאָה
  choice: మహోన్నతంగా విజయం సాధించాడు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియారూపం తీవ్రతను సూచిస్తుంది. సముద్ర విజయగీత సందర్భంలో దైవిక ఔన్నత్యం మరియు ఘనవిజయం రెండింటినీ ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סוּס
  choice: గుర్రాన్ని
  rationale: ఏకవచన సామూహిక/ప్రాతినిధ్య నామాన్ని తెలుగులో ఏకవచన కర్మరూపంగా ఉంచాం.
- source_word: וְרֹכְבוֹ
  choice: దాని రౌతును
  rationale: ప్రత్యయం గుర్రాన్ని సూచిస్తుంది; ‘దాని’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది. רֹכֵבకు సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదంగా ‘రౌతు’ వాడాం.
- source_word: רָמָה
  choice: పడవేశాడు
  rationale: క్రియలోని విసరడం/పడవేయడం అనే భావాన్ని సహజమైన తెలుగులో తెలిపింది; విజయగీతంలోని పూర్తయిన కార్యాన్ని భూతకాలంలో ఉంచాం.
- source_word: בַיָּם
  choice: సముద్రంలో
  rationale: హీబ్రూ בְּ యొక్క స్థాన/గమ్య భావాన్ని తెలుగులో ‘సముద్రంలో’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం నామచతుష్టయాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. బిరుదుతో భర్తీ చేయకుండా ఒడంబడిక నామాన్ని ‘యాహ్వే’గా నిలిపాం.
- issue: גָאֹה גָּאָהలో విజయం మరియు ఔన్నత్యం మధ్య భావ ఉద్రిక్తత
  choice: మహోన్నతంగా విజయం సాధించాడు
  alternative: ఎంతో ఉన్నతుడయ్యాడు / ఘనంగా విజయం పొందాడు
  rationale: ఈ పదబంధం అక్షరార్థంగా ఉన్నతమవడం లేదా తన ఔన్నత్యాన్ని కనబరచడం అని ఉండగలదు; విజయగీత సందర్భం విజయాన్ని ముందుకు తెస్తుంది. ‘మహోన్నతంగా’ అనే పదం ఔన్నత్య భావాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గీతశైలిని అనుసరించాం. ఆజ్ఞార్థక బహువచనాన్ని నిలిపి, హీబ్రూ కవిత్వంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం; సందిగ్ధతలను పాదటిప్పణుల్లో నమోదు చేశాం.
