source:
  edition: WLC
  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: te
  text: ఎందుకంటే ఫరో గుర్రాలు, అతని రథాలు, అతని గుర్రపు రౌతులు[a] సముద్రంలోకి వెళ్లాయి కాబట్టి, యాహ్వే సముద్ర జలాలను వారి మీదికి తిరిగి రప్పించాడు; అయితే ఇశ్రాయేలు ప్రజలు సముద్రం మధ్యలో ఎండిన నేల మీద నడిచారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఫరో గుర్రం … అతని రథం’; ఇక్కడ ఏకవచన రూపాలు ఫరో గుర్రాల దళాన్ని, రథదళాన్ని సమూహార్థంలో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అయితే’ స్థానంలో ‘మరియు’ అని కూడా అనువదించవచ్చు; హీబ్రూలో సాధారణ సంధాన పదమే ఉంది. సందర్భంలోని వ్యత్యాసాన్ని స్పష్టం చేయడానికి ప్రధాన పాఠంలో ‘అయితే’ వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి గీత పల్లవికి ఈ వాక్యం వివరణాత్మక కారణాన్ని ఇస్తుంది; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేందుకు కాలసూచక ఉపవాక్యంతో కలిపి వాడబడింది.
- source_word: בָא ... בַּיָּם
  choice: సముద్రంలోకి వెళ్లినప్పుడు
  rationale: సముద్రంలోకి ప్రవేశించిన చలనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో జరిగిన సంఘటనను కారణవాక్యంతో అనుసంధానిస్తుంది.
- source_word: סוּס פַּרְעֹה
  choice: ఫరో గుర్రాలు
  rationale: హీబ్రూలో ఏకవచనం ఉన్నప్పటికీ, సందర్భంలో అది ఫరోకు చెందిన గుర్రాల దళాన్ని సమూహార్థంలో సూచిస్తుంది.
- source_word: בְּרִכְבּוֹ
  choice: అతని రథాలు
  rationale: రూపపరంగా ఏకవచనమైనా רכב ఇక్కడ రథదళాన్ని సమూహార్థంలో సూచించగలదు; బహువచనం సందర్భానికి, సహజ తెలుగుకు సరిపోతుంది.
- source_word: וּבְפָרָשָׁיו
  choice: అతని గుర్రపు రౌతులు
  rationale: గుర్రాలపై యుద్ధం చేసే సవారీలను స్పష్టంగా సూచించే సాధారణ తెలుగు పదబంధం.
- source_word: וַיָּשֶׁב יְהוָה
  choice: యెహోవా ... తిరిగి రప్పించాడు
  rationale: שׁוב హిఫిల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, జలాలు మళ్లీ వచ్చేటట్లు చేసిన దేవుని కార్యాన్ని స్పష్టంగా చెబుతుంది.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: సముద్ర జలాలను వారి మీదికి
  rationale: జలాలు వారిని కప్పివేసిన భౌతిక దృశ్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు ప్రజలు
  rationale: బני ישראל అనే జాతిసూచక పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది; 'అయితే' సందర్భంలోని వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָלְכוּ בַיַּבָּשָׁה
  choice: ఆరిన నేల మీద నడిచారు
  rationale: సాధారణ క్రియ 'నడిచారు'ను నిలుపుతూ, సముద్రపు అడుగు నీరు లేక ఆరిన స్థితిలో ఉందనే అర్థాన్ని స్పష్టపరుస్తుంది.
- source_word: בְּתוֹךְ הַיָּם
  choice: సముద్రం మధ్యలో
  rationale: ఇశ్రాయేలీయులు సముద్రం నడుమ ప్రయాణించారనే స్థలార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన దైవనామ రూపాన్ని వాడుతూ, మూలంలోని ప్రత్యేక నామాన్ని సాధారణ బిరుదుతో మార్చకుండా ఉంచుతుంది.
- issue: וּבְנֵי יִשְׂרָאֵל లోని సంధాన పదం
  choice: అయితే ఇశ్రాయేలు ప్రజలు
  alternative: మరియు ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ వావ్ సాధారణంగా 'మరియు' అయినప్పటికీ, ఫరో దళాల వినాశనానికి ఇశ్రాయేలు ప్రజల సురక్షిత నడకకు మధ్య ఉన్న సందర్భసిద్ధ వ్యత్యాసాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని సాధారణ సంధానం పాదటిప్పణిలో నమోదు చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. సైనిక పదజాలంలో అతిగా సాంకేతికమైన రూపాలను నివారించి, మూలంలోని సమూహార్థ ఏకవచనాలను పాదటిప్పణితో సంరక్షించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
