source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: te
  text: నీ నాసికల ఊపిరికి జలాలు కుప్పగా పోగయ్యాయి[a]; ప్రవహించే నీళ్లు రాశిలా నిలిచాయి[b]; సముద్రం నడిబొడ్డున[d] అగాధ జలాలు ఘనీభవించాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ నాసికల నుంచి వీచిన గాలికి.’
    reason: lexical_alternative
  - marker: b
    text: ‘రాశిలా’ అనేది హీబ్రూ నామవాచకపు సహజ భావం; సంబంధిత సముద్రదాటే వర్ణనల దృష్ట్యా కొందరు ‘గోడలా’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గడ్డకట్టాయి.’ హీబ్రూ క్రియ చిక్కగా కావడం, ఘనీభవించడం లేదా గడ్డకట్టడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘సముద్ర హృదయంలో,’ అంటే సముద్రం మధ్యలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: నీ నాసికల ఊపిరికి
  rationale: רוּחַ అంటే గాలి లేదా ఊపిరి; אַפֶּיךָ ఇక్కడ నాసికలను సూచిస్తుంది. ఈ ఎంపిక దేవుని శక్తివంతమైన ఉచ్ఛ్వాసాన్ని చిత్రించే మానవరూపక కవిత్వాన్ని నిలుపుతుంది.
- source_word: נֶעֶרְמוּ מַיִם
  choice: జలాలు కుప్పగా పోగయ్యాయి
  rationale: నֶעֶרְמוּ జలాలు ఒకచోట రాశిగా కూడిన భావాన్ని ఇస్తుంది; ‘కుప్పగా పోగయ్యాయి’ ఆధునిక తెలుగులో సహజంగా ఆ దృశ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: נִצְּבוּ
  choice: నిలిచాయి
  rationale: ఈ క్రియ నిలబడడం లేదా స్థిరంగా ఉండడం అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది.
- source_word: כְמוֹ נֵד
  choice: రాశిలా
  rationale: נֵד ప్రధానంగా కుప్ప లేదా పోగైన రాశిని సూచిస్తుంది; సమాంతర వర్ణన ప్రభావంతో ‘గోడలా’ అని మార్చకుండా హీబ్రూ పదచిత్రాన్ని కాపాడుతుంది.
- source_word: נֹזְלִים
  choice: ప్రవహించే నీళ్లు
  rationale: ప్రవహించడం అనే క్రియనుంచి వచ్చిన ఈ కృదంత రూపాన్ని వివరణాత్మకంగా అనువదించడం ద్వారా దాని చలన భావం నిలుస్తుంది.
- source_word: קָפְאוּ
  choice: చిక్కబడ్డాయి
  rationale: ఈ క్రియ గడ్డకట్టడం మాత్రమే కాక చిక్కబడడం లేదా ఘనీభవించడం అనే భావాన్నీ ఇవ్వగలదు. ‘చిక్కబడ్డాయి’ ఆధునిక శాస్త్రీయ అర్థంలో మంచుగా మారాయని నిర్బంధించదు.
- source_word: תְהֹמֹת
  choice: అగాధ జలాలు
  rationale: బహువచన రూపం సముద్రపు లోతైన జలరాశులను సూచిస్తుంది; ‘అగాధ జలాలు’ స్పష్టతతోపాటు కవితా గాంభీర్యాన్ని నిలుపుతుంది.
- source_word: בְּלֶב יָם
  choice: సముద్రం నడిబొడ్డున
  rationale: అక్షరార్థంగా ‘సముద్ర హృదయంలో’; తెలుగులో ‘నడిబొడ్డున’ అనేది మధ్యభాగాన్ని సూచించే సజీవమైన, సహజమైన రూపకం.
theological_decisions:
- issue: సముద్ర గీతంలో దేవుని మానవరూపక చిత్రణ
  choice: ‘నీ నాసికల ఊపిరికి’ అనే స్పష్టమైన శరీరరూపక చిత్రణను నిలుపడం
  alternative: ‘నీ కోపానికి’ అని అమూర్తంగా అనువదించడం
  rationale: హీబ్రూ పాఠం దేవుని శక్తిమంతమైన చర్యను నాసికల ఊపిరి అనే కవితాత్మక మానవరూపకంతో చిత్రిస్తుంది. దానిని అమూర్తమైన ‘కోపం’గా మార్చడానికి ఈ సందర్భం నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గీతాత్మక గాంభీర్యం కలిగిన శైలి. ‘జలాలు,’ ‘అగాధ జలాలు’ కవితా స్వరాన్ని నిలుపుతాయి; ‘నడిబొడ్డున’ మూలంలోని ‘హృదయంలో’ అనే రూపకాన్ని తెలుగులో సజీవంగా వ్యక్తం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
