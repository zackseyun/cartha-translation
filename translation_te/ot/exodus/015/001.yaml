- from: 'అప్పుడు మోషే, ఇశ్రాయేలు కుమారులు యెహోవా[a]కు ఈ గీతం పాడారు. వారు ఇలా అన్నారు:


    “నేను యెహోవాకు పాడుతాను;

    ఎందుకంటే ఆయన మహోన్నతంగా విజయం సాధించాడు[b].

