  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: te
  text: 'అప్పుడు మోషే మరియు ఇశ్రాయేలు కుమారులు యాహ్వేకు[a] ఈ గీతాన్ని పాడారు. వారు ఇలా అన్నారు:


    “నేను యాహ్వేకు పాడుతాను;

    ఎందుకంటే ఆయన ఎంతో ఘనంగా విజయం సాధించాడు[b].

    గుర్రాన్ని, దాని రౌతును

    ఆయన సముద్రంలోకి విసిరివేశాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה); సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు. “యెహోవా” అనేది సంప్రదాయ ఉచ్చారణ రూపం.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన అత్యున్నతుడిగా ఉన్నాడు.” హీబ్రూలో ఒకే ధాతువు పునరుక్త రూపంలో వచ్చి భావాన్ని తీవ్రం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: సముద్రం దాటిన తరువాత జరిగిన కార్యాన్ని పరిచయం చేసే కాలసూచక పదంగా సహజంగా, క్రమాన్ని కాపాడుతూ అనువదించబడింది.
- source_word: יָשִׁיר
  choice: పాడారు
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినప్పటికీ, אָזతో కూడిన కథన సందర్భంలో ఇది భూతకాల సంఘటనను సూచిస్తుంది.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ఇది ఇశ్రాయేలు సంతతివారిని సమూహంగా సూచిస్తుంది.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ఈ గీతం
  rationale: అదనపు వివరణను చేర్చకుండా మూలంలోని నిర్దేశక పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చి, దానికి దిశార్థక విభక్తిని జతచేసింది.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: వారు ఇలా అన్నారు
  rationale: హీబ్రూ మాట-పరిచయ సూత్రంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘అని చెబుతూ అన్నారు’ వంటి అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: אָשִׁירָה
  choice: నేను ... పాడుతాను
  rationale: మొదటి పురుష ఏకవచన cohortative వ్యక్తపరచే సంకల్పాన్ని నిలుపుతూ, సమూహ పరిచయం నుంచి ఏకవచన కవితా స్వరానికి వచ్చే మార్పును కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పాడటానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: גָאֹה גָּאָה
  choice: మహోన్నతంగా విజయం సాధించాడు
  rationale: అదే ధాతువు యొక్క infinitive absolute మరియు finite verb కలయికలోని తీవ్రతను కాపాడుతూ, సముద్ర విజయ సందర్భంలోని ఘన విజయం మరియు ఉన్నతత్వం రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: סוּס וְרֹכְבוֹ
  choice: గుర్రాన్ని, దాని రౌతును
  rationale: కవితాత్మక సమూహార్థ ఏకవచనాన్ని, గుర్రానికి చెందిన రౌతు అనే సర్వనామ సంబంధాన్ని నిలుపుతుంది.
- source_word: רָמָה
  choice: పడవేశాడు
  rationale: బలంగా విసరడం లేదా పడవేయడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַיָּם
  choice: సముద్రంలో
  rationale: హీబ్రూ בְּ ఉపసర్గకు సహజమైన స్థలార్థాన్ని ఇస్తుంది; ‘పడవేశాడు’ అనే క్రియతో గమ్య భావం సందర్భం నుంచే స్పష్టమవుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సుపరిచిత రూపం; పాదటిప్పణి మూల అక్షరరూపం మరియు ప్రత్యామ్నాయ ఉచ్చారణను తెలియజేస్తుంది.
- issue: גָאֹה גָּאָהలో విజయం మరియు మహోన్నతత్వం మధ్య భావ ఉద్రిక్తత
  choice: మహోన్నతంగా విజయం సాధించాడు
  alternative: అత్యున్నతంగా మహిమ పొందాడు
  rationale: సముద్రంలో శత్రువును కూల్చిన సందర్భం విజయ భావాన్ని బలపరుస్తుంది; అయినా ధాతువులోని పైకెగసిన లేదా ఉన్నతమైన భావాన్ని ‘మహోన్నతంగా’ ద్వారా నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి ఉపయోగించబడింది. ఉద్ధరణను పంక్తులుగా అమర్చి గీత స్వరూపాన్ని చూపించాం; మూలంలోని ఏకవచన కవితా స్వరం కాపాడబడింది.
