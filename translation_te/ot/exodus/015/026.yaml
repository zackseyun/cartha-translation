id: EXO.15.26
reference: Exodus 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “నీ దేవుడైన యాహ్వే మాటను నీవు శ్రద్ధగా విని, ఆయన దృష్టిలో సరైనది చేసి, ఆయన ఆజ్ఞలకు చెవియొగ్గి, ఆయన నియమాలన్నిటినీ పాటిస్తే, నేను ఐగుప్తుపై ఉంచిన వ్యాధుల్లో దేనినీ నీపై ఉంచను. ఎందుకంటే నేను నిన్ను స్వస్థపరిచే యాహ్వేను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే నేను నీ స్వస్థపరిచేవాడనైన యాహ్వేను.”
    reason: רֹפְאֶךָ అనే కర్తృవాచక రూపాన్ని ‘నిన్ను స్వస్థపరిచేవాడు’ లేదా ‘నీ స్వస్థపరిచేవాడు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: శ్రద్ధగా విని
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ వినడాన్ని బలపరుస్తుంది. ‘శ్రద్ధగా విని’ అనేది వినికిడి భావాన్నీ, విధేయతతో కూడిన శ్రద్ధనూ సహజంగా నిలుపుతుంది.
- source_word: לְקוֹל
  choice: మాటను
  rationale: קוֹל అక్షరార్థంగా ‘స్వరం’; అయితే ‘యాహ్వే స్వరాన్ని వినడం’ అనే హీబ్రూ ప్రయోగం తెలుగులో సహజంగా ‘యాహ్వే మాటను వినడం’ అని వస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని ప్రత్యేక నామాన్ని లిప్యంతరీకరించి, నిబంధన సంబంధిత నామాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: ఆయన దృష్టిలో సరైనది
  rationale: ‘ఆయన కళ్లలో న్యాయమైనది’ అనే మూలభాషా నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో, దాని నైతిక భావాన్ని మార్చకుండా అందిస్తుంది.
- source_word: וְהַאֲזַנְתָּ
  choice: జాగ్రత్తగా విని
  rationale: אזן హిఫీల్ రూపం శ్రద్ధగా చెవియొగ్గడాన్ని సూచిస్తుంది. ముందున్న שׁמעతో స్వల్ప భేదాన్ని ‘జాగ్రత్తగా’ అనే పదం చూపిస్తుంది.
- source_word: לְמִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: מִצְוֹתకు నిబంధనాత్మక, న్యాయపరమైన సందర్భంలో ‘ఆజ్ఞలు’ సహజమైన, ఖచ్చితమైన పదం.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: ఆయన నియమాలన్నిటినీ పాటిస్తే
  rationale: שׁמרను న్యాయసందర్భంలో ‘పాటించు’ అని, חֻקִּיםను సాధారణ పాఠకులకు అర్థమయ్యేలా ‘నియమాలు’ అని అనువదించింది.
- source_word: כָּל הַמַּחֲלָה
  choice: వ్యాధుల్లో దేనినీ
  rationale: ఏకవచన సమూహార్థక రూపాన్ని తెలుగులో సహజమైన బహువచన నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם ... לֹא אָשִׂים עָלֶיךָ
  choice: నేను ఐగుప్తు మీదికి రప్పించిన ... దేనినీ నీ మీదికి రప్పించను
  rationale: రెండు చోట్ల ఉన్న שׂים క్రియకు ఒకే తెలుగు పదబంధాన్ని వాడి మూలంలోని పదసామ్యాన్ని నిలిపింది; ‘రప్పించు’ తెలుగులో వ్యాధి లేదా విపత్తు మీదికి రావడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רֹפְאֶךָ
  choice: నిన్ను స్వస్థపరిచేవాడను
  rationale: పురుష ఏకవచన ప్రత్యయంతో ఉన్న కర్తృవాచక రూపాన్ని క్రియాత్మకంగా అనువదించింది; దేవుడు స్వస్థపరిచేవాడనే కొనసాగుతున్న లక్షణాన్ని ఇది నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దేవుని నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలోని ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్షంగా నిలుపుతుంది.
- issue: వ్యాధి గురించిన వాగ్దానం స్వభావం
  choice: ఐగుప్తు మీదికి రప్పించిన వ్యాధులను ఇశ్రాయేలు మీదికి రప్పించననే షరతుతో కూడిన నిబంధన వాగ్దానం
  alternative: ప్రతి వ్యక్తికీ అన్ని పరిస్థితుల్లో సంపూర్ణ శారీరక స్వస్థత లభిస్తుందనే సార్వత్రిక హామీ; కేవలం ఆధ్యాత్మిక రూపకం
  rationale: వాక్యం విధేయతను షరతుగా ఉంచి, చారిత్రకంగా ఐగుప్తుకు వచ్చిన వ్యాధులతో వాగ్దానాన్ని అనుసంధానిస్తుంది. అనువాదం దీనికి మించిన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: רֹפְאֶךָ యొక్క నామవాచక లేదా క్రియాత్మక భావం
  choice: నిన్ను స్వస్థపరిచేవాడను
  alternative: నీ స్వస్థపరిచేవాడను
  rationale: హీబ్రూ కర్తృవాచక రూపం రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన క్రియాత్మక రూపాన్ని తీసుకొని, నామవాచక ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు స్పష్టమైన శైలి. రెండో పురుష ఏకవచనాన్ని మూలానికి అనుగుణంగా నిలిపింది. మూలంలోని షరతుల వరుసను సహజమైన తెలుగు వాక్యనిర్మాణంలో కొనసాగించింది.
