    rationale: వ్యాధులను సందర్భంలో ‘పై ఉంచు’ అనేది హీబ్రూ పదసామ్యాన్ని రెండు చోట్లా నిలుపుతూ సహజంగా ఉంటుంది.
  revised_text: 'ఆయన ఇలా అన్నాడు: “నీ దేవుడైన యాహ్వే మాటను నీవు శ్రద్ధగా విని, ఆయన దృష్టిలో సరైనది చేసి, ఆయన ఆజ్ఞలకు చెవియొగ్గి, ఆయన నియమాలన్నిటినీ పాటిస్తే, నేను ఐగుప్తుపై ఉంచిన వ్యాధుల్లో దేనినీ నీపై ఉంచను. ఎందుకంటే నేను నిన్ను స్వస్థపరిచే యాహ్వేను.”[a]'
