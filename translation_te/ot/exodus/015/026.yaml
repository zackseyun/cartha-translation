  revision_rationale: సవరణ ప్రధానంగా చివరి దైవిక స్వీయ-గుర్తింపును ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అలాగే హీబ్రూ కర్తృవాచక భావానికి నమ్మకంగా చేయడానికి జరిగింది. శׂים క్రియ రెండు సందర్భాల్లోనూ ‘ఉంచు’గా ఉంచి మూలంలోని పదసామ్యాన్ని కాపాడింది. వాక్యపు షరతుతో కూడిన స్వభావాన్ని లేదా వ్యాధుల వాగ్దానపు పరిమిత చారిత్రక సందర్భాన్ని విస్తరించలేదు.
