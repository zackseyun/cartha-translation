reference: Exodus 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַ֥ר אוֹיֵ֛ב אֶרְדֹּ֥ף אַשִּׂ֖יג אֲחַלֵּ֣ק שָׁלָ֑ל תִּמְלָאֵ֣/מוֹ נַפְשִׁ֔/י אָרִ֣יק חַרְבִּ֔/י תּוֹרִישֵׁ֖/מוֹ יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: te
  text: 'శత్రువు ఇలా అన్నాడు: ‘నేను వెంటాడుతాను, తరిమి పట్టుకుంటాను, దోపుడు సొమ్మును పంచుకుంటాను; వారితో నా కోరిక తీరుతుంది.[a] నా ఖడ్గాన్ని దూస్తాను; నా చేతి బలం వారిని స్వాధీనం చేసుకుంటుంది.’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారితో నా ప్రాణం నిండుతుంది’; అంటే, ‘వారివల్ల నా కోరిక పూర్తిగా తీరుతుంది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా చేయి వారిని వెళ్లగొడుతుంది’ లేదా ‘నా చేయి వారిని నాశనం చేస్తుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: శత్రువు ఇలా అన్నాడు
  rationale: గీతంలోని శత్రువు ప్రగల్భాన్ని పరిచయం చేసే సాధారణ భూతకాల వాక్యంగా అనువదించబడింది; ఏకవచన ‘శత్రువు’ ఐగుప్తు సైన్యాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: నేను వెంటాడుతాను, అందుకుంటాను
  rationale: ఈ అసంపూర్ణ క్రియారూపాలు శత్రువు ఉద్దేశించిన రాబోయే చర్యలను తెలియజేస్తాయి; ‘అందుకుంటాను’ వెంటాడి చేరుకోవడం అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: אֲחַלֵּק שָׁלָל
  choice: దోపుడుసొమ్ము పంచుకుంటాను
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న సొమ్మును పంచుకోవడాన్ని సూచించే ప్రయోగం; ఆధునిక పాఠకులకు స్పష్టమైన పదబంధం.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: వారితో నా కోరిక తీరుతుంది
  rationale: అక్షరార్థంగా ‘వారితో నా నెఫెష్ నిండుతుంది’; ఇక్కడ נֶפֶשׁ అంతరంగ కోరిక లేదా తృప్తికాంక్షను సూచిస్తుంది. శత్రువు హింసాత్మక ఆశను సహజంగా వ్యక్తపరుస్తూ మూలంలోని సంబంధాన్ని కాపాడుతుంది.
- source_word: אָרִיק חַרְבִּי
  choice: నా ఖడ్గాన్ని దూస్తాను
  rationale: ריק హిఫీల్ రూపం ‘ఖడ్గం’తో కలిసి ఒరనుండి ఖడ్గాన్ని తీయడాన్ని సూచించే నానుడి; ‘దూస్తాను’ తెలుగు యుద్ధవర్ణనలో సహజంగా ఆ చర్యను తెలియజేస్తుంది.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: నా చెయ్యి వారిని నిర్మూలిస్తుంది
  rationale: ירשׁ హిఫీల్‌కు స్వాధీనత తొలగించడం, వెళ్లగొట్టడం, సందర్భానుసారంగా నాశనం చేయడం వంటి భావాలు ఉన్నాయి. సముద్రంలో వెంబడిస్తున్న శత్రువు ప్రగల్భ సందర్భంలో ‘నిర్మూలిస్తుంది’ సహజమైన ప్రధాన పఠనం; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచి మూలంలోని అర్థ విస్తృతిని కాపాడాం.
theological_decisions:
- issue: תּוֹרִישֵׁמוֹలోని చర్య ఎంత తీవ్రంగా అర్థం చేసుకోవాలి
  choice: ప్రధాన పాఠంలో ‘నిర్మూలిస్తుంది’
  alternative: ‘వారిని వెళ్లగొడుతుంది’ లేదా ‘వారి స్వాధీనాన్ని తొలగిస్తుంది’
  rationale: వెంబడింపు, ఖడ్గం, దోపుడుసొమ్ము అనే యుద్ధ సందర్భం వినాశన భావానికి బలం ఇస్తుంది; అయినా ירשׁ హిఫీల్ యొక్క స్థానభ్రంశ/స్వాధీనహరణ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గీతాత్మకమైన వేగాన్ని నిలుపుకోవడానికి వరుస ప్రగల్భ క్రియలను సంక్షిప్తంగా ఉంచాం. ‘ఖడ్గం’, ‘నిర్మూలిస్తుంది’ వంటి పదాలు గంభీరమైన యుద్ధ సందర్భానికి తగినవిగా ఉన్నా సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
