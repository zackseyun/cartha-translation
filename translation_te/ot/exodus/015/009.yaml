revisions:
- from: 'శత్రువు ఇలా అన్నాడు: ‘నేను వెంటాడుతాను, అందుకుంటాను, దోపుడుసొమ్ము పంచుకుంటాను; వారితో నా కోరిక తీరుతుంది.[a] నా ఖడ్గాన్ని దూస్తాను; నా చెయ్యి వారిని నిర్మూలిస్తుంది.’[b]'
  to: 'శత్రువు ఇలా అన్నాడు: ‘నేను వెంటాడుతాను, తరిమి పట్టుకుంటాను, దోపుడు సొమ్మును పంచుకుంటాను; వారితో నా కోరిక తీరుతుంది.[a] నా ఖడ్గాన్ని దూస్తాను; నా చేతి బలం వారిని స్వాధీనం చేసుకుంటుంది.’[b]'
  rationale: The revision makes the pursuit verb explicit and replaces the overly determinate ‘నిర్మూలిస్తుంది’ with a Telugu rendering of dispossession/taking possession. The footnote preserves both driving out and destruction as defensible contextual alternatives. Footnote markers remain anchored immediately after their relevant clauses.
