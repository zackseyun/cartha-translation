  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו מִ֣י שָׂ֣ם פֶּה֮ לָֽ/אָדָם֒ א֚וֹ מִֽי יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲ/לֹ֥א אָנֹכִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: te
  text: 'యెహోవా అతనితో ఇలా అన్నాడు: “మనిషికి నోరు ఇచ్చింది ఎవరు? మూగవానిగా గాని, చెవిటివానిగా గాని, చూపుగలవానిగా గాని, గుడ్డివానిగా గాని చేసేది ఎవరు? యెహోవానైన నేనే కాదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: మనిషికి నోరు ఇచ్చింది
  rationale: అక్షరార్థంగా ‘మనిషికి నోరు ఉంచింది’; సహజమైన ఆధునిక తెలుగులో దేవుడు మాట సామర్థ్యానికి మూలమని తెలిపే విధంగా ‘నోరు ఇచ్చింది’ అని అనువదించాం.
- source_word: אִלֵּם
  choice: మూగవానిగా
  rationale: మాట్లాడలేని స్థితిని సూచించే సాధారణ, మూలానికి దగ్గరైన తెలుగు పదప్రయోగం.
- source_word: חֵרֵשׁ
  choice: చెవిటివానిగా
  rationale: వినలేని వ్యక్తిని సూచించే మూలపదానికి నేరమైన సమానార్థకం.
- source_word: פִקֵּחַ
  choice: చూపుగలవానిగా
  rationale: ఈ సందర్భంలో ‘కళ్లు తెరచిన/చూడగల’ అనే భావం; ‘చూచేవానిగా’ కంటే సహజంగా, ‘తెలివైన’ అనే వేరొక అర్థం రాకుండా ఎంపిక చేశాం.
- source_word: עִוֵּר
  choice: గుడ్డివానిగా
  rationale: చూడలేని స్థితిని సూచించే సాధారణ తెలుగు సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: మాట, వినికిడి, చూపు సంబంధిత సామర్థ్యాలు మరియు వైకల్యాల విషయంలో దేవుని కార్యసాధకత్వం
  choice: ‘చేసేది ఎవరు? యెహోవానైన నేనే కాదా?’ అని మూలంలోని ప్రత్యక్ష వాక్యాన్నీ ఉద్వేగాన్నీ నిలిపాం.
  alternative: దేవుడు వీటిని కేవలం అనుమతిస్తాడని లేదా పరోక్షంగా నియంత్రిస్తాడని మృదువుగా అనువదించడం.
  rationale: హీబ్రూ יָשׂוּם (‘చేస్తాడు/నియమిస్తాడు’) మరియు అలంకారప్రశ్న దేవుని ప్రత్యక్ష సార్వభౌమత్వాన్ని గట్టిగా చెబుతాయి; దాని తాత్త్విక ఉద్వేగాన్ని అనువాదంలో తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. వరుస అలంకారప్రశ్నల నిర్మాణం మరియు చివరి దైవనామ పునరుక్తి నిలుపబడ్డాయి.
