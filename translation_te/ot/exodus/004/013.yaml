  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר בִּ֣י אֲדֹנָ֑/י שְֽׁלַֽח נָ֖א בְּ/יַד תִּשְׁלָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: te
  text: అయితే అతడు, “దయచేసి, నా ప్రభువా, నీవు ఎవరిని పంపుతావో, వారి ద్వారా పంపు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “దయచేసి, నా ప్రభువా, వేరొకరిని పంపు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే అతడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపించినా, దేవుడు ఇచ్చిన సమాధానాల తర్వాత కూడా మోషే వెనుకాడుతున్న సందర్భంలో వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: בִּי ... נָא
  choice: దయచేసి
  rationale: בִּי గౌరవపూర్వక విజ్ఞప్తిని సూచిస్తుంది; נָא ఆజ్ఞార్థక క్రియను మృదువుచేస్తుంది. తెలుగులో రెండింటి విజ్ఞాపన భావాన్ని సహజంగా ఒకే ‘దయచేసి’ తెలియజేస్తుంది; అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: אֲדֹנָי
  choice: నా ప్రభువా
  rationale: ఇది దేవునికి చేసిన గౌరవపూర్వక ప్రత్యక్ష సంబోధన; ఏకవచన ప్రథమ పురుష ప్రత్యయ భావాన్ని ‘నా’ నిలుపుతుంది. ఇది יהוה అనే దైవనామం కాదు.
- source_word: שְׁלַח
  choice: పంపు
  rationale: שלח ఆజ్ఞార్థక రూపానికి స్పష్టమైన, సాధారణ తెలుగు సమానం; వాక్యంలో పునరావృతమైన అదే మూలక్రియను కూడా నిలుపుతుంది.
- source_word: בְּיַד
  choice: వారి చేతనే
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘చేతి ద్వారా’ అని ఉండి, ఇక్కడ వ్యక్తి ద్వారా కార్యం జరగడాన్ని సూచిస్తుంది. ‘వారి చేత’ ఆ కర్తృత్వ భావాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘నే’ మోషే తనను తప్పించుకోవాలనే సందర్భబలాన్ని సూచించినా, ‘వేరొకరిని’ అని స్పష్టంగా చేర్చదు.
- source_word: תִּשְׁלָח
  choice: నీవు ఎవరి చేత పంపుతావో
  rationale: అసంపూర్ణ క్రియారూపాన్ని సంబంధార్థక నిర్మాణంలో సహజ తెలుగుగా అందిస్తుంది. దేవుడు ఎవరిని పంపనున్నాడో అనే హీబ్రూ అస్పష్టతను నిలుపుతూ, ప్రధాన పాఠ్యంలో ‘వేరొకరిని’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించదు.
theological_decisions:
- issue: మోషే తప్పించుకునే విజ్ఞప్తి యొక్క అర్థం
  choice: ‘నీవు ఎవరి చేత పంపుతావో వారి చేతనే పంపు’ అని హీబ్రూ అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘దయచేసి వేరొకరిని పంపు.’
  rationale: సందర్భంలో మోషే తనకు బదులుగా మరొకరిని పంపమని కోరుతున్నట్లు స్పష్టమైన సూచన ఉంది; అయినా హీబ్రూ పాఠ్యంలో ‘వేరొకరు’ అనే పదం ప్రత్యక్షంగా లేదు. కాబట్టి వ్యాఖ్యానాత్మక అర్థాన్ని పాదసూచికలో ఇచ్చి, ప్రధాన పాఠ్యంలో అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నా ప్రభువా’ అనే సంబోధన భక్తిపూర్వక స్వరాన్ని నిలుపుతుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
