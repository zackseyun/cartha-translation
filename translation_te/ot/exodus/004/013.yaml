revisions:
- from: అయితే అతడు, “దయచేసి, నా ప్రభువా, నీవు ఎవరి చేత పంపుతావో వారి చేతనే పంపు” అన్నాడు.[a]
  to: అయితే అతడు, “దయచేసి, నా ప్రభువా, నీవు ఎవరిని పంపుతావో, వారి ద్వారా పంపు” అన్నాడు.[a]
  rationale: 'The revision makes only a small source-fidelity and style correction: it removes the added emphatic ‘నే’ and uses a natural Telugu agency expression. The main text continues to retain the Hebrew''s ambiguous formulation; the contextual interpretation that Moses asks for another person remains confined to the footnote.'
