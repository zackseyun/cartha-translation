id: EXO.4.25
reference: Exodus 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַ/תִּכְרֹת֙ אֶת עָרְלַ֣ת בְּנָ֔/הּ וַ/תַּגַּ֖ע לְ/רַגְלָ֑י/ו וַ/תֹּ֕אמֶר כִּ֧י חֲתַן דָּמִ֛ים אַתָּ֖ה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: te
  text: అప్పుడు సిప్పోరా ఒక చెకుముకి రాయిని తీసుకొని, తన కుమారుని ముందోలు కోసి, అతని పాదాలను తాకి[a], “నిశ్చయంగా నీవు నాకు రక్తపు పెండ్లికుమారుడివి” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని పాదాలు.’ ‘పాదాలు’ అనేది జననాంగాలకు సభ్యోక్తి కావచ్చు; ‘అతని’ అనే సర్వనామం మోషేను గానీ ఆమె కుమారుణ్ణి గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: చెకుముకి రాయి
  rationale: ఈ నామవాచకం కోయడానికి ఉపయోగించే చెకుముకి రాయిని సూచిస్తుంది; సున్నతి సందర్భంలో ఇది సహజమైన, నిర్దిష్టమైన అనువాదం.
- source_word: עָרְלַת בְּנָהּ
  choice: తన కుమారుని ముందోలు
  rationale: హీబ్రూ నిర్మాణాన్ని శరీర నిర్మాణపరంగా స్పష్టంగా, అనవసరమైన సభ్యోక్తి లేకుండా అందిస్తుంది.
- source_word: וַתַּגַּע
  choice: తాకి
  rationale: נגע క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, తాకించిన ఖచ్చితమైన విధానాన్ని నిర్ణయించదు.
- source_word: לְרַגְלָיו
  choice: అతని పాదాలను
  rationale: పదబద్ధమైన అర్థం ‘అతని పాదాలు.’ ఇది జననాంగాలకు సభ్యోక్తి కావచ్చనే అవకాశాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదటిప్పణిలో ఉంచాం; సర్వనామం ఎవరిని సూచిస్తుందో కూడా నిర్ణయించలేదు.
- source_word: כִּי
  choice: నిశ్చయంగా
  rationale: ఇక్కడ సిప్పోరా పలికిన ఉద్ఘాటనలోని బలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: חֲתַן דָּמִים
  choice: రక్తపు పెండ్లికుమారుడు
  rationale: అసాధారణమైన ఈ హీబ్రూ పదబంధంలోని రూపకాన్ని, అర్థసందిగ్ధతను వ్యాఖ్యానాత్మకంగా సరళీకరించకుండా నిలుపుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: వ్యక్తిగత సంబంధాన్ని సూచించే విభక్తిని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘అతని పాదాలు’ అనేది సభ్యోక్తా, అలాగే ‘అతని’ అనేది మోషేను సూచిస్తుందా లేక కుమారుణ్ణి సూచిస్తుందా అన్న సందిగ్ధత
  choice: ప్రధాన పాఠ్యంలో ‘అతని పాదాలను’ అని ఉంచి, సూచిత వ్యక్తిని నిర్దిష్టంగా చెప్పలేదు
  alternative: ‘అతని జననాంగాలను’; ‘మోషే పాదాలను/జననాంగాలను’; ‘కుమారుని పాదాలను/జననాంగాలను’
  rationale: హీబ్రూ వాక్యం ఉద్దేశపూర్వకంగానో సందర్భపరంగానో సందిగ్ధంగా ఉంది. ఒక వ్యాఖ్యానాన్ని పాఠ్యంలో స్థిరపరచకుండా, పదబద్ధమైన రూపాన్ని ఉంచి ప్రధాన ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ముందోలు’ శరీర నిర్మాణపరంగా స్పష్టమైన పదం; ‘రక్తపు పెండ్లికుమారుడు’ మూలంలోని అసాధారణ రూపకాన్నీ వ్యాఖ్యాన భేదాన్నీ నిలుపుతుంది.
