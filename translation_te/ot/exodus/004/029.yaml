  yaml_path: translation/ot/exodus/004/029.yaml
  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను వెళ్లి ఇశ్రాయేలు కుమారుల పెద్దలందరినీ సమకూర్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయుల పెద్దలందరినీ”; సాంప్రదాయంగా, “ఇశ్రాయేలు సంతానంలోని పెద్దలందరినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తూ సాధారణంగా ‘వెళ్లాడు/వెళ్లారు’ అనే అర్థాన్నిస్తుంది. హెబ్రీలో క్రియ ఏకవచనంలో ఉన్నా, మోషే మరియు అహరోను అనే సంయుక్త కర్తను తెలుగులో సహజంగా బహువచనార్థంతో వ్యక్తం చేశాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וַיַּאַסְפוּ
  choice: సమకూర్చారు
  rationale: אסף ఇక్కడ వ్యక్తులను ఒకచోట చేర్చడం అనే అర్థంలో ఉంది; ‘సమకూర్చారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు పదప్రయోగం.
- source_word: אֵת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: כָּל
  choice: అందరినీ
  rationale: כָּל సూచించే సంపూర్ణతను, వ్యక్తులను సూచించే ప్రత్యక్ష కర్మతో సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: זקנים ఇక్కడ కేవలం వృద్ధులను కాక సమాజంలో గుర్తింపు పొందిన నాయకులను సూచిస్తుంది; ‘పెద్దలు’ వయస్సు మరియు సామాజిక బాధ్యత రెండింటి భావాన్నీ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీలోని పుత్రసంబంధ పదబంధాన్ని స్పష్టంగా నిలుపుతూ, ఇశ్రాయేలు/యాకోబు సంతతితో ఉన్న వంశపారంపర్య గుర్తింపును కాపాడుతుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: ప్రధాన సిద్ధాంత వివాదం లేకపోయినా, మూలంలో ఉన్న స్పష్టమైన బంధుత్వ రూపం ఇశ్రాయేలు/యాకోబు నుండి వచ్చిన వంశ, నిబంధన గుర్తింపును మోస్తుంది. అందువల్ల దాన్ని కేవలం జాతినామంగా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస క్రియలను తెలుగులో ‘వెళ్లి … సమకూర్చారు’గా అనుసంధానించాం. ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం మూలంలోని బంధుత్వ భావాన్ని నిలుపుతుంది; మరింత సహజమైన జాతినామ, సమూహార్థ రూపాలు పాదసూచికలో ఉన్నాయి.
