translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గాంభీర్యాన్ని కాపాడే శైలి. ఈ వచనంలో పాఠ్యార్థానికి అవసరమైన నిజమైన ప్రత్యామ్నాయం లేదా సందిగ్ధతను సూచించే పాదటిప్పణి అవసరం లేదు.
