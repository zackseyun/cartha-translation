source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַשְׁלִיכֵ֣/הוּ אַ֔רְצָ/ה וַ/יַּשְׁלִיכֵ֥/הוּ אַ֖רְצָ/ה וַ/יְהִ֣י לְ/נָחָ֑שׁ וַ/יָּ֥נָס מֹשֶׁ֖ה מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: te
  text: ఆయన, “దాన్ని నేలమీదికి విసిరేయి” అన్నాడు. అప్పుడు మోషే దాన్ని నేలమీదికి విసిరేశాడు; అది పాముగా మారింది. మోషే దానినుండి పారిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ఆయన … అన్నాడు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది; కర్తను ముందరి సందర్భం ఆధారంగా ‘ఆయన’గా ఉంచింది.
- source_word: הַשְׁלִיכֵהוּ
  choice: దాన్ని … పడవేయి
  rationale: పూర్వ వచనంలోని కర్రను సూచించే 3 పురుష ఏకవచన ప్రత్యయాన్ని ‘దాన్ని’గా వ్యక్తం చేస్తూ, ఆజ్ఞను సహజంగా అందిస్తుంది.
- source_word: אַרְצָה
  choice: నేలమీద
  rationale: దిశార్థక ה కలిగిన ‘భూమి/నేల వైపు’ అనే రూపం ఈ సందర్భంలో నేలపైకి వేయడాన్ని సూచిస్తుంది; ‘నేలమీద’ సహజమైన తెలుగు.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: మోషే దాన్ని … పడవేశాడు
  rationale: హీబ్రూ కథన క్రమాన్ని స్పష్టంగా కొనసాగిస్తూ, తెలుగులో అస్పష్టత రాకుండా కర్త ‘మోషే’ను సందర్భానుసారంగా వ్యక్తం చేసింది.
- source_word: וַיְהִי לְנָחָשׁ
  choice: అది పాముగా మారింది
  rationale: נָחָשׁ సాధారణంగా పాము/సర్పాన్ని సూచిస్తుంది; ‘పాము’ ఆధునిక సాధారణ తెలుగులో స్పష్టమైన పదం.
- source_word: וַיָּנָס
  choice: పారిపోయాడు
  rationale: ‘పారిపోవడం’ అనే బలమైన అర్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִפָּנָיו
  choice: దాని దగ్గరనుండి
  rationale: అక్షరార్థంగా ‘దాని ముఖము/సన్నిధి ఎదుటనుండి’; ఇక్కడ ప్రత్యయం పామును సూచించడం సహజం. ‘దాని దగ్గరనుండి’ హీబ్రూ స్థలసంబంధ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
