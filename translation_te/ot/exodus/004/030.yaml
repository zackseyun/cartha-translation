source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: te
  text: అహరోను యాహ్వే మోషేతో చెప్పిన మాటలన్నిటినీ చెప్పాడు. ఆ సూచక క్రియలను ప్రజల కళ్లముందు[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలు చూస్తుండగా.”
    reason: లְעֵינֵי הָעָם అనే హీబ్రూ నుడికారానికి సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וַיְדַבֵּר אַהֲרֹן
  choice: అహరోను ... చెప్పాడు
  rationale: దిబ్బేర్ అనే క్రియకు ఇక్కడ ‘మాట్లాడాడు/చెప్పాడు’ అనే భావం ఉంది. ‘మాటలన్నిటినీ చెప్పాడు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, హీబ్రూ పదబంధాన్నీ నిలుపుతుంది.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: మాటలన్నిటినీ
  rationale: ‘అంతా’ అని సంక్షిప్తం చేయకుండా, హీబ్రూలోని ‘మాటలు’ అనే స్పష్టమైన నామవాచకాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: యాహ్వే మోషేతో చెప్పిన
  rationale: ముందుగా యాహ్వే మోషేతో పలికిన మాటలను సూచించే సంబంధవాక్యాన్ని తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיַּעַשׂ הָאֹתֹת
  choice: ఆ సూచక క్రియలను ... చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియను ‘చేశాడు’గా ఉంచి, אותותను సందర్భానుసారంగా ‘సూచక క్రియలు’గా అందించింది; ‘అద్భుతాలు’ అని మరింత వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
- source_word: לְעֵינֵי הָעָם
  choice: ప్రజల కళ్లముందు
  rationale: హీబ్రూ నుడికారంలోని దృశ్య స్పష్టతను నిలుపుతూ తెలుగులో సహజంగా వినిపిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- issue: సూచక క్రియలను చేసిన వ్యక్తి ఎవరు?
  choice: ప్రధాన పాఠ్యంలో కర్తను మళ్లీ పేరుపెట్టి నిర్ధారించకుండా ఉంచడం
  alternative: అహరోను చేశాడు / మోషే చేశాడు
  rationale: హీబ్రూ క్రియ ఏకవచన పుంలింగంలో ఉన్నప్పటికీ కర్తను పేరుతో చెప్పదు. ముందున్న అహరోను వ్యాకరణపరంగా సహజమైన కర్త; విస్తృత సందర్భం వల్ల మోషే అని కూడా గ్రహించవచ్చు. అందువల్ల ఈ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మాటలన్నిటినీ,’ ‘సూచక క్రియలు,’ ‘కళ్లముందు’ అనే పదబంధాలు మూలానికి దగ్గరగా ఉంటూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
