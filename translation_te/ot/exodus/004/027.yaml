source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: te
  text: 'యాహ్వే అహరోనుతో ఇలా అన్నాడు: “మోషేను కలుసుకోవడానికి అరణ్యంలోకి వెళ్లు[a].” అప్పుడు అతడు వెళ్లి దేవుని పర్వతం వద్ద మోషేను కలుసుకొని అతనిని ముద్దుపెట్టుకున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరణ్యంలో మోషేను కలుసుకోవడానికి వెళ్లు.” హీబ్రూ పదబంధాన్ని అరణ్యాన్ని కలుసుకునే స్థలంగా నొక్కిచెప్పేదిగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: הלך ఆజ్ఞార్థక రూపానికి సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: לִקְרַאת מֹשֶׁה
  choice: మోషేను కలుసుకోవడానికి
  rationale: לִקְרַאת తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַמִּדְבָּרָה
  choice: అరణ్యంలోకి
  rationale: దిశను సూచించే -ה ప్రత్యయాన్ని గౌరవిస్తూ, అరణ్యం వైపు కదలికను స్పష్టంగా తెలుపుతుంది; వాక్య నిర్మాణంలో కొంత అస్పష్టత ఉన్నందున ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చింది.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: మోషేను కలుసుకొని
  rationale: פגשׁ యొక్క కథన సందర్భానికి ‘కలుసుకొను’ సహజం; తెలుగు వాక్య స్పష్టత కోసం సర్వనామం స్థానంలో మోషే పేరును పునరుక్తి చేసింది.
- source_word: בְּהַר הָאֱלֹהִים
  choice: దేవుని పర్వతం దగ్గర
  rationale: హీబ్రూ సంబంధ పదబంధాన్ని నిలుపుతూ, בְ యొక్క స్థలార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘పర్వతం మీద’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיִּשַּׁק לוֹ
  choice: అతనికి ముద్దుపెట్టాడు
  rationale: נשׁק యొక్క ప్రత్యక్ష అర్థాన్ని వివరణాత్మక విస్తరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘అరణ్యం,’ ‘దేవుని పర్వతం’ వంటి మూలపాఠానికి సమీపమైన పదబంధాలు నిలుపబడ్డాయి; హీబ్రూ స్థల/దిశ సంబంధ అస్పష్టతను పాదసూచికలో సంరక్షించింది.
