source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: te
  text: 'మిద్యానులో యాహ్వే మోషేతో ఇలా అన్నాడు: “వెళ్లు, ఐగుప్తుకు తిరిగి వెళ్లు[a]. ఎందుకంటే నీ ప్రాణాన్ని తీయాలని వెదుకుతున్న ఆ పురుషులందరూ చనిపోయారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఐగుప్తుకు తిరిగి వెళ్లు.” హీబ్రూలో అక్షరార్థంగా “వెళ్లు, తిరిగి వెళ్లు” అనే రెండు ఆజ్ఞారూప క్రియలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన యహ్వే అనే నాలుగు అక్షరాల నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలో సాధారణంగా వచ్చే ‘అన్నాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמִדְיָן
  choice: మిద్యానులో
  rationale: בְ అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది.
- source_word: לֵךְ שֻׁב
  choice: వెళ్లు, ... తిరిగి వెళ్లు
  rationale: మూలంలోని రెండు ఆజ్ఞారూప క్రియలను నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా రెండవ క్రియకు గమ్యస్థానాన్ని జతచేశాం.
- source_word: מִצְרָיִם
  choice: ఐగుప్తుకు
  rationale: తిరిగి వెళ్లే గమ్యస్థానాన్ని తెలుగులో సహజంగా సూచించడానికి ‘కు’ విభక్తిని ఉపయోగించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: מֵתוּ
  choice: చనిపోయారు
  rationale: పూర్తయిన చర్యను, దాని ప్రస్తుత ఫలితంతో సహా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הָאֲנָשִׁים
  choice: మనుషులందరూ
  rationale: אֲנָשִׁים ఇక్కడ మోషే ప్రాణాన్ని వెదికిన వ్యక్తులను సూచిస్తుంది; ‘మనుషులందరూ’ మూలంలోని సమగ్రతను నిలుపుతుంది.
- source_word: הַמְבַקְשִׁים
  choice: వెదుకుతున్న
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను ప్రతిబింబిస్తుంది.
- source_word: אֶת נַפְשֶׁךָ
  choice: నీ ప్రాణాన్ని తీయాలని
  rationale: ‘ఒకరి ప్రాణాన్ని వెదకడం’ అనే హీబ్రూ నుడికారం వారిని చంపాలని ప్రయత్నించడాన్ని సూచిస్తుంది; తెలుగులో దాని ఉద్దేశాన్ని స్పష్టంగా, సహజంగా తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రెండు ఆజ్ఞారూప క్రియలను ప్రధాన పాఠ్యంలో నిలిపి, మరింత సహజమైన సంక్షిప్త రూపాన్ని పాదసూచికలో ఇచ్చాం.
