revisions:
- from: అప్పుడు మోషే తన మామ యిత్రో దగ్గరికి తిరిగి వెళ్లి అతనితో[a], “దయచేసి, ఐగుప్తులో ఉన్న నా సహోదరుల దగ్గరికి తిరిగి వెళ్లి, వారు ఇంకా సజీవంగా ఉన్నారో లేదో చూసి రావడానికి నాకు అనుమతి ఇవ్వండి” అన్నాడు. యిత్రో మోషేతో, “క్షేమంగా వెళ్లు” అన్నాడు.
