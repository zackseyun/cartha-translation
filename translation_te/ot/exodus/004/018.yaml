  text: וַ/יֵּ֨לֶךְ מֹשֶׁ֜ה וַ/יָּ֣שָׁב אֶל יֶ֣תֶר חֹֽתְנ֗/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ אֵ֣לֲכָה נָּ֗א וְ/אָשׁ֨וּבָה֙ אֶל אַחַ֣/י אֲשֶׁר בְּ/מִצְרַ֔יִם וְ/אֶרְאֶ֖ה הַ/עוֹדָ֣/ם חַיִּ֑ים וַ/יֹּ֧אמֶר יִתְר֛וֹ לְ/מֹשֶׁ֖ה לֵ֥ךְ לְ/שָׁלֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: te
  text: అప్పుడు మోషే తన మామగారైన యిత్రో[a] వద్దకు తిరిగి వెళ్లి, “దయచేసి, నన్ను ఐగుప్తులో ఉన్న నా సహోదరుల[b] దగ్గరికి తిరిగి వెళ్లి, వారు ఇంకా బ్రతికి ఉన్నారో లేదో చూడనివ్వండి” అన్నాడు. యిత్రో మోషేతో, “క్షేమంగా వెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ పాఠంలో ఇక్కడ పేరు ‘యెతెర్’ అని, వాక్యం చివరలో ‘యిత్రో’ అని ఉంది; ఒకే వ్యక్తి ఉద్దేశించబడినందున ప్రధాన పాఠంలో రెండుచోట్లా ‘యిత్రో’ అని ఇచ్చాం.
    reason: textual_variant
  - marker: b
    text: ‘నా సహోదరులు’ అనే పదానికి ‘నా స్వజనులు’ లేదా ‘నా బంధువులు’ అనే విస్తృతార్థం కూడా ఉండవచ్చు. హీబ్రూలో అక్షరార్థం ‘నా సోదరులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: అప్పుడు ... తిరిగి వెళ్లి
  rationale: వయ్యిక్తోల్ క్రియలు కథనాన్ని ముందుకు నడిపిస్తాయి; שׁוּב యొక్క ‘తిరిగి వెళ్లడం’ అనే భావాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: יֶתֶר / יִתְרוֹ
  choice: యిత్రో
  rationale: మూలపాఠంలో మొదట ‘యెతెర్’, తరువాత ‘యిత్రో’ అనే రూపాలు ఉన్నాయి. ఒకే వ్యక్తి ఉద్దేశించబడ్డందున ప్రధాన పాఠంలో సుపరిచితమైన ‘యిత్రో’ వాడి, రూపభేదాన్ని పాదసూచికలో ఉంచాం.
- source_word: חֹתְנוֹ
  choice: తన మామ
  rationale: సందర్భంలో ఇతడు మోషే భార్య తండ్రి. ఆధునిక తెలుగులో ‘మామ’ సహజమైన, సంక్షిప్తమైన సంబంధపదం.
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: దయచేసి ... తిరిగి వెళ్లి ... రావడానికి నాకు అనుమతి ఇవ్వండి
  rationale: కోహోర్టేటివ్ రూపాలు మరియు נָא కలసి మర్యాదపూర్వక అనుమతి అభ్యర్థనను సూచిస్తాయి; తెలుగు వాక్యనిర్మాణంలో దానిని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: אַחַי
  choice: నా సహోదరులు
  rationale: అక్షరార్థం ‘నా సోదరులు’; సందర్భంలో విస్తృత బంధువర్గం లేదా స్వజనులను కూడా సూచించవచ్చు. ప్రధాన పాఠం మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: וְאֶרְאֶה
  choice: చూసి రావడానికి
  rationale: ఇక్కడ మోషే తిరిగి వెళ్లే ఉద్దేశాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘చూసి రావడానికి’ ఆ ప్రయోజనభావాన్ని అందిస్తుంది.
- source_word: הַעוֹדָם חַיִּים
  choice: వారు ఇంకా సజీవంగా ఉన్నారో లేదో
  rationale: ప్రశ్నార్థక అనిశ్చితిని, עוֹד యొక్క ‘ఇంకా’ భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לֵךְ לְשָׁלוֹם
  choice: క్షేమంగా వెళ్లు
  rationale: ఇది ఆశీర్వాదంతో కూడిన ప్రశాంతమైన వీడ్కోలు. ‘క్షేమంగా వెళ్లు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
