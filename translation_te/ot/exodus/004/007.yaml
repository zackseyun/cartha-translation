source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הָשֵׁ֤ב יָֽדְ/ךָ֙ אֶל חֵיקֶ֔/ךָ וַ/יָּ֥שֶׁב יָד֖/וֹ אֶל חֵיק֑/וֹ וַ/יּֽוֹצִאָ/הּ֙ מֵֽ/חֵיק֔/וֹ וְ/הִנֵּה שָׁ֖בָה כִּ/בְשָׂרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: te
  text: ఆయన, “నీ చెయ్యిని మళ్లీ నీ రొమ్ము దగ్గర ఉన్న వస్త్రపు మడతలో[a] పెట్టు” అన్నాడు. అతడు తన చెయ్యిని మళ్లీ తన వస్త్రపు మడతలో పెట్టి, దాన్ని బయటికి తీశాడు; ఇదిగో, అది అతని శరీరంలోని మిగతా భాగంలా మళ్లీ అయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఛాతీ దగ్గర అంగీ లేదా పైవస్త్రం ఏర్పరచే మడతలో.
    reason: cultural_note
  - marker: b
    text: అంటే, అతని చెయ్యి మళ్లీ సాధారణ స్థితికి వచ్చింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: మళ్లీ ... పెట్టు
  rationale: שוב పదం హిఫిల్ ఆజ్ఞారూపంలో చెయ్యిని మునుపటి చోటికి తిరిగి చేర్చడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మళ్లీ ... పెట్టు’ సహజంగా ఉండి, చర్య పునరావృతమవుతున్న భావాన్ని నిలుపుతుంది.
- source_word: חֵיק
  choice: రొమ్ము దగ్గర ఉన్న వస్త్రపు మడత
  rationale: חֵיק ఇక్కడ చెయ్యిని దూర్చగలిగేలా ఛాతీ దగ్గర ఏర్పడే వస్త్రపు మడతను సూచిస్తుంది. కేవలం ‘రొమ్ము’ అని అనడం కంటే ఈ ఎంపిక చర్యను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּשֶׁב
  choice: మళ్లీ ... పెట్టి
  rationale: ముందటి ఆజ్ఞలోని שוב క్రియనే కథన రూపంలో పునరావృతం చేస్తుంది; అందువల్ల అదే తెలుగు పదబంధాన్ని కొనసాగించడం మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: וַיּוֹצִאָהּ
  choice: దాన్ని ... బయటికి తీశాడు
  rationale: יצא హిఫిల్ రూపం ‘బయటికి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. వస్త్రపు మడతలో నుంచి చెయ్యి తీసే చర్యకు ‘బయటికి తీశాడు’ సహజమైన తెలుగు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన ఫలితంపై పాఠకుని దృష్టిని నిలిపే మూలపదపు కథన బలాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: שָׁבָה
  choice: తిరిగి అయింది
  rationale: ఈ స్త్రీలింగ ఏకవచన క్రియ ‘చెయ్యి’ని సూచిస్తూ అది మునుపటి స్థితికి తిరిగిందని చెబుతుంది. ‘స్వస్థపడింది’ అని వివరణాత్మకంగా మార్చకుండా తిరిగి మారిన భావాన్ని ఉంచింది.
- source_word: כִּבְשָׂרוֹ
  choice: అతని శరీరంలా
  rationale: כְּ ఉపసర్గ పోలికను, בָּשָׂר అతని శరీరపు సహజ స్థితిని సూచిస్తున్నాయి. ‘అతని శరీరంలా’ మూలంలోని సంక్షిప్త పోలికను కాపాడుతుంది; సాధారణ స్థితికి పునరుద్ధరణ అనే అంతర్భావాన్ని గమనిక వివరిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ఆజ్ఞ–అమలు పునరుక్తిని నిలిపి, וְהִנֵּה యొక్క దృష్టి ఆకర్షించే బలాన్ని ‘ఇదిగో’తో వ్యక్తం చేశాం. חֵיק అనే సాంస్కృతిక పదానికి ప్రధాన వాక్యంలో స్పష్టమైన భావానువాదం ఇచ్చి, గమనికలో మరింత వివరణ అందించాం.
