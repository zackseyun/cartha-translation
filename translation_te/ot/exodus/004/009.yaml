reference: Exodus 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: te
  text: వారు ఈ రెండు సూచకాలను కూడా నమ్మకపోయి, నీ మాట వినకపోతే[a], నీవు నైలు నది నీళ్లలో కొంత నీటిని తీసుకొని పొడి నేల మీద పోయాలి. నైలు నది నుండి నీవు తీసుకున్న ఆ నీళ్లు పొడి నేల మీద రక్తంగా మారుతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ స్వరాన్ని వినకపోతే”; దీనికి “నీ మాటను లెక్కచేయకపోతే” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రక్తమైపోతాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: అయితే / ...పోతే
  rationale: ఈ పదబంధం షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన షరతు వాక్య నిర్మాణంతో అందించబడింది.
- source_word: יַאֲמִינוּ
  choice: నమ్మకపోతే
  rationale: ఇక్కడ అర్థం సూచకక్రియల సాక్ష్యాన్ని నమ్మడం; కథన సందర్భంలో ‘నమ్ము’ సహజమైన ఎంపిక.
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: ఈ రెండు సూచకక్రియలను కూడా
  rationale: గַּם తెలియజేసే అధికతను ‘కూడా’ నిలుపుతుంది; ముందుగా ఇచ్చిన రెండు అద్భుత సూచనలను ఇది నిర్దిష్టంగా సూచిస్తుంది.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: నీ మాట వినకపోతే
  rationale: అక్షరార్థంగా ‘నీ స్వరాన్ని వినడం’; ఆధునిక తెలుగులో ‘నీ మాట వినడం’ అనేది వినడమూ విధేయత చూపడమూ అనే భావాలను సహజంగా మోస్తుంది.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: నైలు నది నీళ్లలో కొంత
  rationale: מִן యొక్క భాగార్థాన్ని ‘కొంత’ స్పష్టంగా తెలియజేస్తుంది; יְאֹרను నిర్దిష్టంగా నైలు నదిగా అనువదించాం.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: పొడి నేల మీద
  rationale: నీటికి వ్యతిరేకంగా ఉన్న పొడి నేలనే పదం సూచిస్తుంది; మూలంలోని పునరుక్తిని రెండు చోట్లా నిలిపాం.
- source_word: וְשָׁפַכְתָּ
  choice: పోయాలి
  rationale: నీటిని నేల మీద పోయే చర్యకు ఇది స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וְהָיוּ ... לְדָם
  choice: రక్తంగా మారుతాయి
  rationale: היה + לְ నిర్మాణం పరివర్తన లేదా ఫలితాన్ని తెలియజేస్తుంది; ‘రక్తంగా మారుతాయి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: דָם
  choice: రక్తం
  rationale: మూలపదానికి ప్రత్యక్ష అర్థం ‘రక్తం’; దాన్ని రూపకాలంకారంగా లేదా రంగుగా బలహీనపరచడానికి సందర్భంలో ఆధారం లేదు.
theological_decisions:
- issue: నైలు నీళ్లు రక్తంగా కావడం అనే సూచకక్రియ స్వభావం
  choice: ప్రత్యక్ష పరివర్తనగా ‘రక్తంగా మారుతాయి’
  alternative: రక్తంలా కనిపిస్తాయి / రక్తవర్ణంగా మారుతాయి
  rationale: హీబ్రూ היה + לדם ఎలాంటి పరిమితి లేకుండా రక్తంగా మారడాన్ని చెబుతుంది. మూలంలో లేని సహజవాద వివరణను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సూచకక్రియ’ అద్భుతమైన sign అనే భావాన్ని నిలుపుతుంది; ‘నీ మాట వినడం’ హీబ్రూ నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది. మూలంలోని ‘పొడి నేల’ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
