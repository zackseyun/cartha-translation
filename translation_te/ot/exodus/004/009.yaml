revisions:
- from: వారు ఈ రెండు సూచకక్రియలను కూడా నమ్మక, నీ మాట వినకపోతే[a], నీవు నైలు నది నీళ్లలో కొంత తీసుకొని పొడి నేల మీద పోయాలి. నైలు నది నుండి నీవు తీసుకున్న ఆ నీళ్లు పొడి నేల మీద రక్తంగా మారుతాయి[b].
  to: వారు ఈ రెండు సూచకాలను కూడా నమ్మకపోయి, నీ మాట వినకపోతే[a], నీవు నైలు నది నీళ్లలో కొంత నీటిని తీసుకొని పొడి నేల మీద పోయాలి. నైలు నది నుండి నీవు తీసుకున్న ఆ నీళ్లు పొడి నేల మీద రక్తంగా మారుతాయి[b].
