    text: అక్షరార్థంగా, “నీ స్వరాన్ని వినకపోతే”; దీనికి “నీ మాటను లెక్కచేయకపోతే” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రక్తమైపోతాయి.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural term for ‘signs’ with standard Telugu ‘సూచకాలు,’ improves the idiomatic alternative in footnote a, and makes footnote b a meaningful alternative phrasing. It preserves the Hebrew conditional structure, the escalation expressed by ‘కూడా,’ the repeated ‘పొడి నేల,’ and the direct claim that the Nile water becomes blood.
