id: EXO.4.5
reference: Exodus 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: te
  text: “వారు తమ పితరుల[b] దేవుడైన యాహ్వే[a]—అబ్రాహాము దేవుడు, ఇస్సాకు దేవుడు, యాకోబు దేవుడు—నీకు ప్రత్యక్షమయ్యాడని నమ్మేలా.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’ (יהוה); ఇక్కడ ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది. సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యెహోవా’ అనే రూపం కూడా వాడుకలో ఉంది.'
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘తమ పూర్వీకుల.’ హీబ్రూ పదం అక్షరార్థంగా ‘తమ పితరుల’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: నమ్మేలా
  rationale: ఇది ఉద్దేశాన్ని లేదా ఆశించిన ఫలితాన్ని తెలియజేస్తుంది. ముందు వచనంలోని సూచకక్రియతో ఈ వాక్యాన్ని సహజంగా అనుసంధానిస్తూ హీబ్రూ భావాన్ని నిలుపుతుంది.
- source_word: יַאֲמִינוּ
  choice: నమ్మేలా
  rationale: ఇక్కడ אמן క్రియ మోషే చెప్పిన విషయాన్ని సూచకక్రియ ఆధారంగా నిజమని అంగీకరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నమ్ము’ సహజమైన పదం.
- source_word: כִּי
  choice: అని
  rationale: వారు నమ్మవలసిన విషయాన్ని పరిచయం చేసే పూరక అవ్యయంగా ఉంది; కారణార్థకంగా కాదు.
- source_word: נִרְאָה
  choice: ప్రత్యక్షమయ్యాడు
  rationale: ראה నిఫాల్ రూపం ఇక్కడ ‘కనిపించాడు/ప్రత్యక్షమయ్యాడు’ అనే అర్థం ఇస్తుంది. దేవుని ప్రత్యక్షతను తెలిపే గౌరవప్రదమైన, స్థిరమైన తెలుగు ప్రయోగం ‘ప్రత్యక్షమయ్యాడు’.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: రెండవ పురుష ఏకవచన పుంలింగాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: తమ పితరుల దేవుడు
  rationale: אֲבֹתָם లోని మూడవ పురుష బహువచన సంబంధాన్ని ‘తమ’ ద్వారా, మూలంలోని పుంలింగ పూర్వీకుల సూచనను ‘పితరులు’ ద్వారా నిలుపుతుంది.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: అబ్రాహాము దేవుడు, ఇస్సాకు దేవుడు, యాకోబు దేవుడు
  rationale: ప్రతి పితామహుని ముందు ‘దేవుడు’ అనే నిర్మాణాన్ని పునరావృతం చేసి హీబ్రూ వాక్యంలోని ఉద్ఘాటనను, గంభీర లయను కాపాడింది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదైన ‘ప్రభువు’గా మార్చకుండా తెలుగులో లిప్యంతరీకరించాం; సంప్రదాయ రూపాలను పాదటిప్పణిలో తెలియజేశాం.
- issue: אֲבֹתָם లోని పుంలింగ పూర్వీకుల పదం
  choice: తమ పితరులు
  alternative: తమ పూర్వీకులు
  rationale: ఈ సందర్భం వెంటనే అబ్రాహాము, ఇస్సాకు, యాకోబులను పేర్కొంటుంది. కాబట్టి మూలంలోని పుంలింగ కుటుంబ-ఒడంబడిక ప్రయోగాన్ని ‘పితరులు’గా నిలుపుతూ, విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ప్రతి పితామహునితో ‘దేవుడు’ అనే పదం పునరావృతం
  choice: అబ్రాహాము దేవుడు, ఇస్సాకు దేవుడు, యాకోబు దేవుడు
  alternative: అబ్రాహాము, ఇస్సాకు, యాకోబుల దేవుడు
  rationale: హీబ్రూలో אֱלֹהֵי ప్రతి పేరుకు ముందు పునరావృతమవుతుంది. దాని ప్రత్యేక ఉద్ఘాటనను సంక్షిప్తం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఇది ముందున్న సూచకక్రియకు ఉద్దేశాన్ని తెలిపే ఆధార వాక్యం కాబట్టి, స్వతంత్ర పూర్తి వాక్యంగా మార్చకుండా ‘నమ్మేలా’తో ముగించాం. దైవనామం మరియు పితరుల పదానికి సంబంధించిన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో స్పష్టంగా ఉంచాం.
