  to: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “నీవు ఈజిప్టుకు తిరిగి వెళ్ళినప్పుడు, నేను నీ చేతిలో ఉంచిన అద్భుత కార్యాలన్నిటినీ[a] ఫరో ఎదుట చేయడానికి జాగ్రత్తపడు. అయితే నేను అతని హృదయాన్ని కఠినపరుస్తాను[b]; అతడు ప్రజలను వెళ్లనివ్వడు.”'
