source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “నీవు ఈజిప్టుకు తిరిగి వెళ్ళినప్పుడు, నేను నీ చేతిలో ఉంచిన అద్భుత కార్యాలన్నిటినీ[a] ఫరో ఎదుట చేయడానికి జాగ్రత్తపడు. అయితే నేను అతని హృదయాన్ని కఠినపరుస్తాను[b]; అతడు ప్రజలను వెళ్లనివ్వడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సూచక కార్యాలన్నిటినీ” లేదా “మహత్కార్యాలన్నిటినీ.” హీబ్రూ పదం దైవశక్తిని ప్రదర్శిస్తూ సూచనలుగా పనిచేసే అసాధారణ కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతని హృదయాన్ని బలపరుస్తాను” లేదా “అతని హృదయాన్ని దృఢపరుస్తాను.” హీబ్రూ క్రియకు బలపరచడం లేదా స్థిరపరచడం అనే భావం ఉండవచ్చు; ఇక్కడ ఫరో తన మొండి నిరాకరణలో దృఢపడడాన్ని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో సూచిస్తుంది.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: నీవు ఈజిప్టుకు తిరిగి వెళ్తున్నప్పుడు
  rationale: హీబ్రూ కాలసూచక infinitive నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; directional ending భావాన్ని ‘కు’ తెలియజేస్తుంది.
- source_word: רְאֵה
  choice: తప్పక చేయి
  rationale: ఇక్కడి ఆజ్ఞ కేవలం చూడమని కాక, తరువాత చెప్పిన కార్యాలన్నీ శ్రద్ధగా జరిగేలా చూసుకోమనే భావాన్ని ఇస్తుంది. తెలుగులో ‘తప్పక’ ఆ ఆజ్ఞాబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמֹּפְתִים
  choice: అద్భుత కార్యాలు
  rationale: అసాధారణమైన దైవశక్తి ప్రదర్శనల భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అవి సూచనలుగా పనిచేసే భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: నేను నీ చేతిలో ఉంచిన
  rationale: మోషేకు అప్పగించి, చేయగల శక్తిని ఇచ్చినట్లు సూచించే హీబ్రూ ‘చేతిలో ఉంచడం’ రూపకాన్ని నిలుపుతుంది.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట తప్పక చేయి
  rationale: ‘చేయడం’ అనే మూల క్రియను, ఫరో సమక్షంలో బహిరంగంగా జరిగే సందర్భాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: మోషే చేయవలసిన కార్యాల నుంచి యెహోవా చేయబోయే కార్యానికి వచ్చే వ్యత్యాసాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֲחַזֵּק אֶת־לִבּוֹ
  choice: నేను అతని హృదయాన్ని కఠినపరుస్తాను
  rationale: חזק causative రూపం ప్రాథమికంగా బలపరచడం లేదా స్థిరపరచడం అనే భావాన్ని కలిగి ఉన్నా, ఫరో మొండి నిరాకరణలో దృఢపడే ఈ కథా సందర్భంలో ‘కఠినపరుస్తాను’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְלֹא יְשַׁלַּח אֶת־הָעָם
  choice: అతడు ప్రజలను వెళ్లనివ్వడు
  rationale: నిర్గమ సందర్భంలో ప్రజలు బయలుదేరడానికి అనుమతించకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఫరో హృదయాన్ని దేవుడు కఠినపరచడం
  choice: నేను అతని హృదయాన్ని కఠినపరుస్తాను
  alternative: నేను అతని హృదయాన్ని బలపరుస్తాను / దృఢపరుస్తాను
  rationale: దైవ చర్యను మృదువుగా మార్చకుండా మూలపాఠంలోని కారణక భావాన్ని నిలుపుతుంది. అదే సమయంలో హీబ్రూ క్రియకు ‘బలపరచడం, దృఢపరచడం’ అనే సాధ్యమైన అర్థాలు ఉన్నాయని పాదసూచిక తెలియజేస్తుంది; దైవాధికారం మరియు ఫరో బాధ్యత మధ్య ఉన్న పాఠ్య ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీ చేతిలో ఉంచిన’ అనే హీబ్రూ రూపకం నిలుపబడింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట సరిగా అమర్చబడ్డాయి.
