source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇలా జవాబిచ్చాడు: “కానీ, చూడండి, వారు నన్ను నమ్మరు; నా మాట వినరు[a]. ఎందుకంటే, ‘యాహ్వే[b] నీకు ప్రత్యక్షం కాలేదు’ అని వారు అంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “నా స్వరం వినరు”; ఈ నుడికారం “నా మాట వినరు” లేదా “నా మాట పట్టించుకోరు” అని కూడా అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “ప్రభువు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: అప్పుడు మోషే ఇలా జవాబిచ్చాడు
  rationale: రెండు హీబ్రూ క్రియల సంభాషణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది; ‘జవాబిచ్చి అన్నాడు’ అనే అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: וְהֵן
  choice: కానీ
  rationale: ఇక్కడ ఈ పదం మోషే అభ్యంతరాన్ని ప్రవేశపెడుతుంది. ‘ఇదిగో’ అనే అక్షరార్థ రూపం ఈ సందర్భంలో తెలుగులో కృత్రిమంగా వినిపిస్తుంది; ‘కానీ’ సందర్భంలోని వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: వారు నన్ను నమ్మరు
  rationale: మోషే చెప్పే విషయాన్ని వారు విశ్వసించరనే భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: నా మాట వినరు
  rationale: హీబ్రూ నుడికారంలోని ‘నా స్వరం వినరు’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; ‘నాకు విధేయులు కారు’ అని అనువదించడం ఈ సందర్భంలో అర్థాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మోషే ఆందోళనకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: నీకు ప్రత్యక్షం కాలేదు
  rationale: నిఫాల్ రూపంలోని ‘ప్రత్యక్షమగు/కనిపించు’ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, వారు చేయబోయే నిరాకరణను యథాతథంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో ప్రధాన పాఠంలో భర్తీ చేయకుండా పేరు రూపంలో ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో సూచించాం.
- issue: שׁמע בקול అనే వ్యక్తీకరణలో వినడం లేదా విధేయత చూపడం
  choice: నా మాట వినరు
  alternative: నాకు విధేయులు కారు
  rationale: ఈ సందర్భంలో మోషే సందేశాన్ని అంగీకరించి ఆలకించడమే ముందున్న భావం. ‘విధేయత’ అని మాత్రమే నిర్దిష్టం చేయకుండా మూలంలోని వినడం/పట్టించుకోవడం మధ్య ఉన్న భావవ్యాప్తిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సంభాషణ ప్రవాహాన్ని నిలిపాం; అయినప్పటికీ మోషే అభ్యంతరం, అతని అంచనా, దైవనామం స్పష్టంగా సంరక్షించబడ్డాయి.
