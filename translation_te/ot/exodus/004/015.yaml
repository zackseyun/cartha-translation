  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֣ אֵלָ֔י/ו וְ/שַׂמְתָּ֥ אֶת הַ/דְּבָרִ֖ים בְּ/פִ֑י/ו וְ/אָנֹכִ֗י אֶֽהְיֶ֤ה עִם פִּ֨י/ךָ֙ וְ/עִם פִּ֔י/הוּ וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: te
  text: నీవు అతనితో మాట్లాడి, ఆ మాటలను అతని నోటిలో ఉంచు; నేను నీ నోటితోను అతని నోటితోను ఉంటాను; మీరిద్దరూ చేయవలసినదేమిటో మీకు బోధిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీరిద్దరూ,’ ‘మీకు,’ ‘చేయవలసినది’ అనే రూపాలు మోషేను, అహరోనును కలిపి సూచిస్తున్నాయి.
    reason: మూల హీబ్రూలో చివరి సర్వనామం, క్రియ రెండూ బహువచనంలో ఉన్నాయని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: నీవు అతనితో మాట్లాడి
  rationale: ఈ ఆదేశ సందర్భంలో సంయోజక వావుతో వచ్చిన క్రియ ఆజ్ఞాత్మక భావాన్ని ఇస్తుంది. דבר + אל అనే నిర్మాణానికి సహజమైన తెలుగు ‘అతనితో మాట్లాడు’.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: ఆ మాటలను అతని నోటిలో ఉంచాలి
  rationale: שׂים అంటే ‘ఉంచు/పెట్టు.’ ‘మాటలను నోటిలో ఉంచడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, మోషే అహరోనుకు పలకవలసిన మాటలను అందించాలనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַדְּבָרִים
  choice: ఆ మాటలను
  rationale: నిర్దిష్ట బహువచన నామవాచకాన్ని సందర్భానుసారంగా ‘ఆ మాటలు’ అని అనువదించడం సహజం; ‘సందేశం’ అనే విస్తృత వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: నేను నీ నోటికి, అతని నోటికి తోడుగా ఉండి
  rationale: మూలంలోని ‘నీ నోటితో, అతని నోటితో ఉంటాను’ అనే శరీరాంగ రూపకాన్ని తెలుగు సహజత్వంతో ‘నోటికి తోడుగా’ అని నిలిపింది. ఇది దేవుడు వారి మాటలకు ప్రత్యక్షంగా సహాయం చేస్తాడనే భావాన్ని అతిగా వివరణ చేయకుండా కాపాడుతుంది.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: మీకు బోధిస్తాను
  rationale: ירה హిఫిల్ రూపానికి ‘బోధించు/నేర్పు’ అనే అర్థం ఉంది. אֶתְכֶם బహువచనం కాబట్టి గౌరవ ఏకవచనంగా అపార్థం కాకుండా సందర్భంలో ‘మీరిద్దరూ’ కూడా చేర్చబడింది.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: మీరిద్దరూ ఏమి చేయాలో
  rationale: תַּעֲשׂוּן రెండవ పురుష బహువచనం; ఇది మోషే, అహరోను ఇద్దరినీ సూచిస్తుంది. తెలుగులో సంఖ్యను స్పష్టంగా చూపేందుకు ‘మీరిద్దరూ’ వాడబడింది.
theological_decisions:
- issue: మాట్లాడటంలో దేవుని సహాయాన్ని తెలిపే శరీరాంగ రూపకం
  choice: ‘నేను నీ నోటికి, అతని నోటికి తోడుగా ఉండి’ అనే స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలపడం.
  alternative: ‘నీవు మాట్లాడేటప్పుడు, అతడు మాట్లాడేటప్పుడు నేను మీకు సహాయం చేస్తాను.’
  rationale: హీబ్రూ పాఠం దేవుని సన్నిధి మరియు మాటలలో ఆయన ఇచ్చే సామర్థ్యాన్ని ‘నోరు’ అనే రూపకంతో తెలియజేస్తుంది. దాన్ని పూర్తిగా వివరణాత్మక వాక్యంగా మార్చకుండా మూలపాఠపు స్వరూపాన్ని కాపాడడం సముచితం.
- issue: చివరి సర్వనామం మరియు క్రియ యొక్క బహువచనం
  choice: ‘మీరిద్దరూ ఏమి చేయాలో మీకు’ అని మోషే, అహరోను ఇద్దరినీ స్పష్టంగా సూచించడం.
  alternative: ‘మీరు ఏమి చేయాలో మీకు.’
  rationale: אֶתְכֶם మరియు תַּעֲשׂוּן రెండూ స్పష్టమైన బహువచన రూపాలు. తెలుగులో ‘మీరు’ గౌరవ ఏకవచనంగానూ ఉండగలదు కాబట్టి, ‘మీరిద్దరూ’ మూలంలోని సంఖ్యను సందిగ్ధత లేకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించింది. ‘మాటలను అతని నోటిలో ఉంచడం,’ ‘నోటికి తోడుగా ఉండడం’ అనే మూల హీబ్రూ రూపకాలను అర్థమయ్యే తెలుగు నిర్మాణంలో నిలిపింది. తెలుగు ‘మీరు’లో ఉండే సంఖ్యాసందిగ్ధతను ‘మీరిద్దరూ’తో తొలగించింది.
