revisions:
- from: నీవు అతనితో మాట్లాడి, ఆ మాటలను అతని నోటిలో ఉంచాలి. నేను నీ నోటికి, అతని నోటికి తోడుగా ఉండి, మీరిద్దరూ ఏమి చేయాలో మీకు బోధిస్తాను.[a]
  to: నీవు అతనితో మాట్లాడి, ఆ మాటలను అతని నోటిలో ఉంచు; నేను నీ నోటితోను అతని నోటితోను ఉంటాను; మీరిద్దరూ చేయవలసినదేమిటో మీకు బోధిస్తాను.[a]
  rationale: సవరణ హీబ్రూ వాక్యంలోని మూడు సమన్వయిత క్రియలను—మాట్లాడు/ఉంచు, ఉంటాను, బోధిస్తాను—తెలుగులో స్వతంత్రంగా, స్పష్టంగా నిలుపుతుంది. ‘నోటితోను ... నోటితోను ఉంటాను’ అనేది దేవుని మాటల సహాయాన్ని సూచించే శరీరాంగ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా భద్రపరుస్తుంది. చివరి బహువచనాన్ని ప్రధాన పాఠ్యంగానూ గమనికలోనూ స్పష్టంగా ఉంచబడింది.
