id: EXO.4.23
reference: Exodus 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/ךָ שַׁלַּ֤ח אֶת בְּנִ/י֙ וְ/יַֽעַבְדֵ֔/נִי וַ/תְּמָאֵ֖ן לְ/שַׁלְּח֑/וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת בִּנְ/ךָ֖ בְּכֹרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: te
  text: నేను నీతో, ‘నా కుమారుణ్ణి పంపివేయి; అతడు నన్ను సేవించేందుకు’ అని చెప్పాను. అయితే నీవు అతణ్ణి పంపివేయడానికి నిరాకరించావు. ఇదిగో, నేను నీ కుమారుణ్ణి, నీ తొలిపుట్టిన కుమారుణ్ణి, చంపబోతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: పంపివేయి
  rationale: పీయేల్ ఆజ్ఞారూపంలోని ‘విడిచిపంపు/పంపివేయి’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఫరో తన ఆధీనంలో ఉంచుకున్న ఇశ్రాయేలును వెళ్లనివ్వాలనే సందర్భానికి సరిపోతుంది.
- source_word: וְיַעַבְדֵנִי
  choice: అతడు నన్ను సేవించాలి
  rationale: עבד అనే క్రియలోని సేవ చేయడం అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; సందర్భంలో ఆరాధన భావం ఉన్నప్పటికీ దానికే పరిమితం చేయదు.
- source_word: וַתְּמָאֵן
  choice: నిరాకరించావు
  rationale: సాధారణ అసమ్మతికన్నా ఉద్దేశపూర్వకంగా ఒప్పుకోకపోవడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తదుపరి దైవిక ప్రకటనపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక పదబలాన్ని గౌరవప్రదమైన తెలుగు రూపంలో కాపాడుతుంది.
- source_word: הֹרֵג
  choice: చంపబోతున్నాను
  rationale: హీబ్రూ వర్తమాన కృదంతం ఇక్కడ సమీప భవిష్యత్తులో నిశ్చయంగా జరగబోయే చర్యను సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּכֹרֶךָ
  choice: నీ జ్యేష్ఠ కుమారుణ్ణి
  rationale: ‘నీ మొదటిపుట్టినవాణ్ణి’ అనే భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలిపే ప్రామాణిక తెలుగు పదబంధం.
theological_decisions:
- issue: ‘నా కుమారుడు’ అనే ఏకవచన సమూహపదం
  choice: నా కుమారుణ్ణి
  alternative: నా ప్రజలైన కుమారులను
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ, ముందరి వచనంలో ఇశ్రాయేలు దేవుని కుమారుడిగా పేర్కొనబడిన సమూహాత్మక రూపకాన్ని వ్యాఖ్యానంతో విస్తరించకుండా కాపాడుతుంది.
- issue: ‘సేవించు’లో ఆరాధన భావం
  choice: నన్ను సేవించాలి
  alternative: నన్ను ఆరాధించాలి
  rationale: עבד పదానికి సందర్భంలో ఆరాధన భావం ఉండవచ్చు; అయినా మూలంలోని విస్తృతమైన ‘సేవ’ భావాన్ని కుదించకుండా ఉంచడం సముచితం.
- issue: దేవుని చర్య యొక్క నిశ్చయత మరియు కాలభావం
  choice: నేను ... చంపబోతున్నాను
  alternative: నేను ... చంపుతాను
  rationale: కృదంత రూపం సూచించే సమీపించి ఉన్న, నిశ్చిత చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది; కారణం లేదా విధానాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ఏకవచన సర్వనామాలు, దైవిక హెచ్చరికలోని తీవ్రత, ‘కుమారుడు/జ్యేష్ఠ కుమారుడు’ మధ్య ఉద్దేశిత సమాంతరత అన్నీ నిలుపబడ్డాయి.
