id: EXO.4.10
reference: Exodus 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: te
  text: 'అప్పుడు మోషే యాహ్వేతో ఇలా అన్నాడు: “దయచేసి, ప్రభువా, నేను మాట్లాడటంలో నేర్పరి కాను[a]—నిన్నగానీ మొన్నగానీ కాదు, నీవు నీ సేవకునితో మాట్లాడినప్పటి నుంచీ కూడా కాదు. ఎందుకంటే నేను నోరు బరువుగా, నాలుక బరువుగా ఉన్నవాడిని[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, అక్షరార్థంగా, “నేను మాటల మనిషిని కాను.” హీబ్రూ ప్రయోగం మాట్లాడే సామర్థ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “నోరు బరువుగా, నాలుక బరువుగా.” ఇది మాట్లాడటంలో ఇబ్బందిని సూచించే రూపకం; అది వాక్చాతుర్య లోపాన్నో, మాటకు సంబంధించిన ఏదైనా ఇబ్బందినో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בִּי אֲדֹנָי
  choice: దయచేసి, ప్రభువా!
  rationale: בִּי ఇక్కడ వినయపూర్వక విన్నపాన్ని సూచిస్తుంది; אֲדֹנָי సంబోధనను ‘ప్రభువా’గా సహజంగా అందించింది.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: నేను మాటల మనిషిని కాను
  rationale: ‘మాటల మనిషి’ అనే హీబ్రూ రూపకాన్ని నిలిపి, దానిని కేవలం ‘వాక్చాతుర్యం లేనివాడిని’ అని ముందుగానే వ్యాఖ్యానించకుండా ఉంచింది.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: నిన్నగానీ మొన్నగానీ కాదు
  rationale: సమీప గతాన్ని సూచించే జత కాలపదాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: నీవు నీ సేవకునితో మాట్లాడినప్పటి నుంచీ కూడా కాదు
  rationale: దేవుడు మోషేతో మాట్లాడిన సమయం మొదలుకొని ఇప్పటివరకు పరిస్థితి మారలేదనే కాలసంబంధాన్ని కాపాడుతుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: దేవునితో నేరుగా మాట్లాడేటప్పుడు మోషే చూపే వినయపూర్వక స్వీయసూచనను సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మోషే తన వాదనకు చెప్పే కారణాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: నా నోరు బరువు, నా నాలుక బరువు
  rationale: మాట్లాడటంలోని కష్టాన్ని తెలిపే హీబ్రూ సమాంతర రూపకాన్ని నిలిపి, అది వాక్చాతుర్య లోపమా లేక శారీరక మాట సమస్యా అన్నది నిర్ణయించకుండా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- issue: మోషే మాట సమస్య స్వరూపాన్ని స్పష్టంగా నిర్ధారించాలా
  choice: ‘నా నోరు బరువు, నా నాలుక బరువు’ అనే రూపకాన్ని నిలిపివేయడం
  alternative: ‘నాకు వాక్చాతుర్యం లేదు’ లేదా ‘నత్తిగా మాట్లాడుతాను’ అని వ్యాఖ్యానించడం
  rationale: మూల హీబ్రూ సమస్యను ఖచ్చితంగా నిర్ధారించదు; అది వాక్చాతుర్య లోపం, ఆత్మవిశ్వాస లోపం, లేదా మాటకు సంబంధించిన శారీరక ఇబ్బంది కావచ్చు. అనిశ్చితిని అలాగే ఉంచడం మూలపాఠానికి నమ్మకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. హీబ్రూ రూపకాలైన ‘మాటల మనిషి’ మరియు ‘నోరు/నాలుక బరువు’లను ఉద్దేశపూర్వకంగా నిలిపింది; వాటి భావవ్యాప్తిని పాదటిప్పణుల్లో తెలిపింది.
