revisions:
- from: 'అప్పుడు మోషే మీద యాహ్వే కోపం రగులుకుంది. ఆయన ఇలా అన్నాడు: “లేవీయుడైన నీ సహోదరుడు అహరోను ఉన్నాడు కదా? అతడు బాగా మాట్లాడగలడని నాకు తెలుసు.[a] అంతేకాదు, ఇదిగో, అతడు నిన్ను కలుసుకోవడానికి బయలుదేరి వస్తున్నాడు. నిన్ను చూసి అతడు తన హృదయంలో సంతోషిస్తాడు.”'
  to: 'అప్పుడు మోషే మీద యాహ్వే కోపం రగులుకుంది. ఆయన ఇలా అన్నాడు: “లేవీయుడైన నీ సహోదరుడు అహరోను ఉన్నాడు కదా? అతడు బాగా మాట్లాడగలడని నాకు తెలుసు.[a] అంతేకాదు, ఇదిగో, అతడు నిన్ను కలుసుకోవడానికి బయలుదేరి వస్తున్నాడు. నిన్ను చూసి అతడు తన హృదయంలో సంతోషిస్తాడు.”'
