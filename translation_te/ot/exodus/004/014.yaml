id: EXO.4.14
reference: Exodus 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: te
  text: 'అప్పుడు మోషే మీద యాహ్వే కోపం రగులుకుంది. ఆయన ఇలా అన్నాడు: “లేవీయుడైన నీ సహోదరుడు అహరోను ఉన్నాడు కదా? అతడు బాగా మాట్లాడగలడని నాకు తెలుసు.[a] అంతేకాదు, ఇదిగో, అతడు నిన్ను కలుసుకోవడానికి బయలుదేరి వస్తున్నాడు. నిన్ను చూసి అతడు తన హృదయంలో సంతోషిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు అనర్గళంగా మాట్లాడతాడని నాకు తెలుసు”; మరింత అక్షరార్థంగా, “అతడు మాట్లాడుతూ మాట్లాడతాడు.”
    reason: దַבֵּר יְדַבֵּר అనే హీబ్రూ బలప్రయోగం మాటల సామర్థ్యం, ప్రవాహం లేదా నిశ్చయాన్ని సూచించగల పదార్థపరమైన సందిగ్ధతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: కోపం మండడం లేదా రగులుకోవడం అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: הֲלֹא
  choice: ఉన్నాడు కదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే హీబ్రూ అలంకార ప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో వ్యక్తపరుస్తుంది.
- source_word: הַלֵּוִי
  choice: లేవీయుడైన
  rationale: ఇక్కడ అహరోను లేవి గోత్రానికి చెందినవాడని సూచిస్తుంది; యాజక పదవిని ముందుగానే దిగుమతి చేయదు.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: అతడు బాగా మాట్లాడగలడని నాకు తెలుసు
  rationale: అనంతక్రియతో కూడిన క్రియారూపం మాటల సామర్థ్యాన్ని బలపరుస్తుంది. సందర్భంలో మోషే అభ్యంతరానికి ప్రతిగా అహరోను మాట్లాడగల సామర్థ్యమే ప్రధాన భావం; మూలంలోని బలప్రయోగానికి ప్రత్యామ్నాయాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: וְגַם הִנֵּה
  choice: అంతేకాదు, ఇదిగో
  rationale: జోడింపు భావాన్నీ, తరువాతి విషయంపై దృష్టి పెట్టించే సూచననూ రెండింటినీ నిలుపుతుంది.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: నిన్ను కలుసుకోవడానికి బయలుదేరి వస్తున్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా సమీప చర్య భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְרָאֲךָ
  choice: నిన్ను చూసి
  rationale: తరువాతి సంతోషానికి సందర్భాన్ని ఏర్పరచే క్రమాన్ని సంక్షిప్తమైన సహజ తెలుగు రూపంలో తెలుపుతుంది.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: తన హృదయంలో సంతోషిస్తాడు
  rationale: సంతోషం అంతరంగపూర్వకమైనదని స్పష్టంగా చెప్పే హీబ్రూ పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: הַלֵּוִי యొక్క గుర్తింపు
  choice: లేవీయుడైన
  alternative: లేవి వంశస్థుడైన / యాజకుడైన
  rationale: ఈ కథన దశలో పదం గోత్ర సంబంధాన్ని సూచించగలదు. ‘యాజకుడు’ అని అనువదించడం పాఠంలో లేని పదవీ భావాన్ని ముందుగానే చేర్చుతుంది.
- issue: דַבֵּר יְדַבֵּר యొక్క బలం
  choice: బాగా మాట్లాడగలడు
  alternative: తప్పక మాట్లాడతాడు / అనర్గళంగా మాట్లాడతాడు
  rationale: సందర్భం అహరోను మాటల సామర్థ్యాన్ని మోషే సంకోచానికి ప్రతిగా చూపుతుంది. అయితే హీబ్రూ నిర్మాణం నిశ్చయాన్ని లేదా బలాన్ని కూడా సూచించగలదు కాబట్టి ఆ భావసాధ్యతను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఇదిగో,’ ‘హృదయంలో’ వంటి మూలపాఠ చిత్రాలను నిలిపి, అతిగా ప్రాచీనమైన పదప్రయోగాన్ని నివారించింది.
