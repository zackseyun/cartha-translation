source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: te
  text: ప్రజలు నమ్మారు. యెహోవా ఇశ్రాయేలు కుమారుల పట్ల[b] శ్రద్ధ చూపాడనీ[a], వారి బాధను[c] చూశాడనీ వారు విన్నప్పుడు, వారు వంగి ఆరాధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పట్టించుకున్నాడు,’ ‘పరామర్శించాడు,’ ‘వారివైపు దృష్టి సారించాడు.’ ఈ హీబ్రూ క్రియ గమనించడం, శ్రద్ధ వహించడం, సహాయార్థం జోక్యం చేసుకోవడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలు సంతానం,’ ‘ఇశ్రాయేలీయులు.’ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారి దుస్థితిని,’ ‘వారి శ్రమను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: నమ్మారు
  rationale: ఈ హిఫిల్ రూపం మోషే, అహరోనులు తెలియజేసిన సందేశాన్ని, చూపిన సూచక క్రియలను ప్రజలు విశ్వసించారని సూచిస్తుంది. హీబ్రూలో లేని కర్మను చేర్చకుండా ‘నమ్మారు’ అని అనువదించడం సహజంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: హీబ్రూలో సమూహాన్ని సూచించే ఏకవచన నామవాచకం; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: …అని వారు విన్నప్పుడు
  rationale: వారు విన్న విషయాన్ని כִּי పరిచయం చేస్తుంది; ఈ వినికిడికి తదుపరి నమస్కారంతో ఉన్న కాల-కారణ సంబంధాన్ని ‘విన్నప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פָקַד יְהוָה
  choice: యెహోవా … పరామర్శించాడని
  rationale: פקד ఇక్కడ గమనించడం, పట్టించుకోవడం, సహాయార్థం జోక్యం చేసుకోవడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘పరామర్శించాడు’ దేవుని శ్రద్ధతో కూడిన చర్యను సూచిస్తూ హీబ్రూ ప్రయోగంలోని విస్తృతిని కొంతవరకు నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని కుటుంబ సంబంధ రూపమైన ‘ఇశ్రాయేలు కుమారులు’ను నిలుపుతుంది; ఇది సందర్భంలో మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
- source_word: רָאָה אֶת עָנְיָם
  choice: వారి బాధను చూశాడు
  rationale: עֳנִי బాధ, దుస్థితి, అణచివేత వల్ల కలిగిన శ్రమను సూచించగలదు. ‘చూశాడు’ అనే స్పష్టమైన హీబ్రూ క్రియను అలాగే ఉంచి, సందర్భంలోని కనికరపూర్వక గమనింపును పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: וַיִּקְּדוּ
  choice: తలలు వంచి
  rationale: קדד శరీరాన్ని లేదా తలను వంచడాన్ని సూచిస్తుంది. తెలుగులో ‘తలలు వంచి’ ఆ భౌతిక చర్యను స్పష్టంగా తెలుపుతుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ఆరాధించారు
  rationale: ఈ క్రియ సాష్టాంగ నమస్కారం లేదా భక్తిపూర్వక ఆరాధనను సూచిస్తుంది. ముందు క్రియలో వంగే భౌతిక చర్య ఇప్పటికే ఉన్నందున, ఇక్కడ ‘ఆరాధించారు’ దాని భక్తిపరమైన ఉద్దేశాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే కుటుంబ సంబంధ పదబంధాన్ని నిలుపాలా
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది పితరుడైన ఇశ్రాయేలు సంతతిగా ఉన్న ప్రజాసమూహాన్ని సూచిస్తుందనే భావాన్ని కాపాడుతుంది.
- issue: פקד లోని దైవిక శ్రద్ధ మరియు జోక్యం మధ్య భావవిస్తృతి
  choice: పరామర్శించాడు
  alternative: పట్టించుకున్నాడు
  rationale: ఈ సందర్భంలో దేవుడు వారి పరిస్థితిని కేవలం గమనించడమే కాక వారికి సహాయంగా కార్యాచరణకు దిగుతున్నాడు. ‘పరామర్శించాడు’ ఈ రెండు పార్శ్వాలకు చోటిస్తుండగా, పాదసూచిక ఇతర సాధ్యార్థాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘పరామర్శించాడు’ అనే పదం కొంత బైబిలీయ గంభీరతను ఉంచినా నేటి పాఠకులకు అర్థమయ్యేలా ఉంది. రెండు వరుస హీబ్రూ క్రియలను ‘తలలు వంచి ఆరాధించారు’గా ఇచ్చి భౌతిక వంగడాన్నీ దాని ఆరాధనా ఉద్దేశాన్నీ వేరు చేసి నిలిపాం.
