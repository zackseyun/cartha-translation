translation:
  language: te
  text: వారు నిన్ను నమ్మక, మొదటి సూచకపు స్వరాన్ని ఆలకించకపోతే, తరువాతి సూచకపు స్వరాన్ని నమ్ముతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: — (తెలుగు షరతు వాక్య నిర్మాణంలో అంతర్లీనంగా వ్యక్తీకరించబడింది)
  rationale: హీబ్రూ భవిష్యత్ షరతు సూత్రాన్ని తెలుగులో విడిగా ‘అప్పుడు ఇలా జరుగుతుంది’ అని ఉంచడం కృత్రిమంగా ఉంటుంది; ‘...పోతే’ అనే నిర్మాణం దాని కార్యాన్ని సహజంగా మోస్తుంది.
- source_word: יַאֲמִינוּ לָךְ
  choice: నిన్ను నమ్మక
  rationale: అמן హిఫిల్ + ל ఇక్కడ మోషే చెప్పేదాన్ని విశ్వసించడం లేదా అతనిని నమ్మడం అనే భావం ఇస్తుంది; ‘నిన్ను నమ్మక’ సహజంగా, నేరుగా ఉంది.
- source_word: יִשְׁמְעוּ
  choice: ఆలకించక
  rationale: שׁמע ఇక్కడ కేవలం శబ్దం వినడంకంటే శ్రద్ధగా విని అంగీకరించడాన్ని సూచిస్తుంది; అయితే స్పష్టంగా ‘లోబడడం’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: לְקוֹל
  choice: స్వరాన్ని
  rationale: సూచకక్రియ సాక్ష్యమిచ్చే దానిగా ‘మాట్లాడుతుంది’ అనే హీబ్రూ రూపకాన్ని ‘స్వరం’ నిలుపుతుంది.
- source_word: הָאֹת
  choice: సూచకక్రియ
  rationale: אוֹת అనేది ‘సూచన/సూచకం’; ఈ సందర్భంలో దేవుడు చేయించిన అద్భుత కార్యం కావడంతో ‘సూచకక్రియ’ అర్థాన్ని స్పష్టంగా తెలియజేస్తూ అనవసర విస్తరణను నివారిస్తుంది.
- source_word: הָרִאשׁוֹן
  choice: మొదటి
  rationale: רִאשׁוֹן యొక్క సూటి క్రమార్థాన్ని నిలుపుతుంది.
- source_word: וְהֶאֱמִינוּ
  choice: నమ్ముతారు
  rationale: తెలుగు ‘...పోతే, ...నమ్ముతారు’ నిర్మాణమే ఫలిత వాక్యాన్ని స్పష్టంగా చూపుతుంది; అదనంగా ‘అప్పుడు’ అవసరం లేదు.
- source_word: הָאַחֲרוֹן
  choice: తరువాతి
  rationale: אַחֲרוֹן ఇక్కడ ముందున్నదానికి తరువాత వచ్చేదాన్ని సూచిస్తుంది. తదుపరి వచనంలో మరో సూచకక్రియకు అవకాశం ఉన్నందున ‘చివరి’ అని తుది భావం కలిగించకుండా ‘తరువాతి’ని ఎంచుకున్నాం.
