source:
  edition: WLC
  text: וַ/יִּ֖רֶף מִמֶּ֑/נּוּ אָ֚ז אָֽמְרָ֔ה חֲתַ֥ן דָּמִ֖ים לַ/מּוּלֹֽת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: te
  text: అప్పుడు అతడు అతణ్ణి విడిచిపెట్టాడు[a]. అప్పుడు ఆమె, “రక్తపు వరుడు[b]” అని అంది—సున్నతి క్రియల[c] కారణంగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో పేర్లు కాక సర్వనామాలే ఉన్నాయి: ‘అతడు అతనిని విడిచిపెట్టాడు’ లేదా ‘అతని నుండి వెనక్కి తగ్గాడు.’ సందర్భానుసారంగా యెహోవా మోషేపై తన చర్యను నిలిపివేశాడని అర్థం.'
    reason: referent_ambiguity
  - marker: b
    text: ‘రక్తపు వరుడు’ అనేది అర్థనిర్ణయం కష్టమైన హీబ్రూ నుడికారం; ఇది సున్నతి ఆచారంతో ముడిపడిన ఉద్ఘాటన కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ పదం బహువచనంలో ఉంది: ‘సున్నతులు’ లేదా ‘సున్నతి క్రియలు/ఆచారాలు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: ఆయన అతణ్ణి విడిచిపెట్టాడు
  rationale: רפה అనే క్రియ ఇక్కడ ప్రతికూల చర్యను నిలిపివేయడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘విడిచిపెట్టాడు’ సహజంగా ఉండి, ‘అతని నుండి’ అనే מן భావాన్ని కూడా సందర్భానుసారంగా అందిస్తుంది. కర్త, కర్మ ఎవరనే విషయాన్ని పాదసూచికలో తెలిపి, మూలంలోని సర్వనామ రూపాన్ని ప్రధాన వాక్యంలో నిలిపాం.
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందు జరిగిన సున్నతి చర్య తరువాతి కథన క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אָמְרָה
  choice: ఆమె ... అని అంది
  rationale: సాధారణ కథన క్రియ אמר యొక్క స్త్రీలింగ రూపం; సందర్భంలో ఆమె సిప్పోరా.
- source_word: חֲתַן דָּמִים
  choice: రక్తపు పెండ్లికుమారుడు
  rationale: అర్థనిర్ణయం కష్టమైన హీబ్రూ సమాసాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించకుండా, దాని సంక్షిప్తతను మరియు సాంస్కృతిక అస్పష్టతను నిలిపే సన్నిహిత అనువాదం.
- source_word: לַמּוּלֹת
  choice: సున్నతి క్రియల కారణంగా
  rationale: מול నుండి వచ్చిన అరుదైన బహువచన రూపాన్ని తెలుగులో బహువచనంగానే నిలిపి, ఈ మాట సున్నతి ఘటన లేదా ఆచారంతో సంబంధించిందని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన అతణ్ణి విడిచిపెట్టాడు’ అనే వాక్యంలోని సర్వనామాల సూచన
  choice: ప్రధాన పాఠ్యంలో సర్వనామాలను ఉంచి, సందర్భానుసారంగా కర్త యెహోవా, కర్మ మోషే అని పాదసూచికలో తెలియజేయడం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘యెహోవా మోషేను విడిచిపెట్టాడు’ అని పేర్లను చేర్చడం.
  rationale: 24వ వచనంలో దాడి చేసేవాడిగా యెహోవా పేర్కొనబడ్డాడు; ఈ వచనం ఆయన మోషేపై చర్యను నిలిపివేశాడని సహజంగా సూచిస్తుంది. అయితే హీబ్రూ పాఠ్యంలో పేర్లు కాక సర్వనామాలే ఉన్నందున వాటిని ప్రధాన అనువాదంలో నిలిపాం.
- issue: ‘రక్తపు పెండ్లికుమారుడు’ అనే మాట యొక్క అర్థం
  choice: మూలంలోని క్లిష్టమైన నుడికారాన్ని యథాతథ భావానికి దగ్గరగా ఉంచడం.
  alternative: అసహ్యాన్ని వ్యక్తం చేసే మాటగా, సున్నతి ఆచారపరమైన బిరుదుగా, లేదా మోషే/బాలునికి నేరుగా చేసిన సంబోధనగా వివరించి అనువదించడం.
  rationale: ఈ మాట యొక్క ఖచ్చితమైన సాంస్కృతిక, భావోద్వేగ, ఆచారపరమైన బలం అనిశ్చితం. ఏ ఒక్క వ్యాఖ్యానాన్నీ పాఠ్యంలోకి దిగుమతి చేయకుండా అస్పష్టతను కాపాడాం.
- issue: לַמּוּלֹת లోని బహువచనం
  choice: ‘సున్నతి క్రియల’ అని బహువచనాన్ని నిలిపి అనువదించడం.
  alternative: సందర్భంలోని ఒక్క ఘటనను దృష్టిలో ఉంచుకొని ‘సున్నతి కారణంగా’ అని ఏకవచనంగా అనువదించడం.
  rationale: మూల హీబ్రూలో అరుదైన బహువచనం ఉంది. దానిని నిలపడం వచనంలోని ఆచారపరమైన లేదా నుడికారపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పెండ్లికుమారుడు’ సాధారణ పాఠకులకు అర్థమయ్యే బైబిలీయ గౌరవభాషగా ఎంపికైంది. మూలంలోని క్లిష్ట నుడికారం, సర్వనామ సూచన, బహువచన రూపం పాదసూచికలతో పారదర్శకంగా నిలుపబడ్డాయి.
