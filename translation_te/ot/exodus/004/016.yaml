  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: te
  text: అతడు నీ తరఫున ప్రజలతో మాట్లాడతాడు. అతడు నీకు నోరుగా[a] ఉంటాడు; నీవు అతనికి దేవునివలె[b] ఉంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు నీ నోరుగా ఉంటాడు.’ హెబ్రీలో ‘నోరు’ అనేది ప్రతినిధిగా మాట్లాడేవానిని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు అతనికి దేవునిగా ఉంటావు.’ సందర్భంలో మోషే దేవుని మాటలను అహరోనుకు తెలియజేసే అధికారపూర్వక ప్రతినిధి పాత్రలో ఉంటాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל־הָעָם
  choice: అతడు నీ తరఫున ప్రజలతో మాట్లాడతాడు
  rationale: דבר అంటే ‘మాట్లాడు.’ ఈ సందర్భంలో לְךָ ప్రతినిధిత్వ భావాన్ని కలిగి ఉంది; అహరోను మోషే తరఫున ప్రజలతో మాట్లాడనున్నాడు.
- source_word: לְפֶה
  choice: నోరుగా
  rationale: פֶּה అక్షరార్థంగా ‘నోరు.’ అహరోను మోషేకు ప్రతినిధిగా మాట్లాడేవాడని తెలిపే రూపకాన్ని అనువాదంలో నిలిపింది.
- source_word: לֵאלֹהִים
  choice: దేవునిగా
  rationale: ఈ పదబంధం మోషే అహరోనుకు దైవిక సందేశాన్ని అందించే అధికారపూర్వక ప్రతినిధి పాత్రను సూచిస్తుంది. ‘దేవునిగా’ అనే రూపం హెబ్రీ వాక్యంలోని బలమైన భావాన్ని, దాని పాత్రాత్మక స్వరూపాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: לֵאלֹהִים అనే పదబంధం మోషే అక్షరార్థంగా దేవుడని సూచిస్తుందా, లేక దేవుడు ఇచ్చిన ప్రతినిధి పాత్రను సూచిస్తుందా
  choice: నీవు అతనికి దేవునిగా ఉంటావు
  alternative: నీవు అతనికి దేవుడివై ఉంటావు; నీవు అతనికి దేవునివలె ఉంటావు
  rationale: హెబ్రీలో ఉపమాన సూచక పదం ప్రత్యక్షంగా లేదు; అయినా לְ ఉపసర్గతో వచ్చిన విధేయ నామవాచకం పాత్ర లేదా సంబంధాన్ని తెలుపగలదు. ప్రధాన అనువాదం మూలంలోని బలమైన భాషను నిలుపుతూ, తెలుగు ‘-గా’ ద్వారా పాత్రాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; పాదటిప్పణి మరింత అక్షరార్థ రూపాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నోరుగా’ అనే మూల రూపకం అలాగే ఉంచబడింది; ‘దేవునిగా’ అనే పదబంధంలోని బలమైన ధార్మిక ఉద్వేగాన్ని తగ్గించకుండా, సందర్భంలోని ప్రతినిధి పాత్రను తెలుగు వ్యాకరణం ద్వారా వ్యక్తం చేసింది.
