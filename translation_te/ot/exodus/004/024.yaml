  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: te
  text: 'మార్గమధ్యంలో, రాత్రి బస చేసే చోట[b] ఇలా జరిగింది: యెహోవా అతనిని[a] ఎదుర్కొని, అతనిని చంపడానికి ప్రయత్నించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హీబ్రూ పాఠంలోని ‘అతనిని’ ఎవరిని సూచిస్తుందో స్పష్టంగా చెప్పబడలేదు; అది మోషేను సూచించవచ్చు, లేదా కొన్ని వ్యాఖ్యానాల ప్రకారం అతని కుమారుణ్ణి సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘రాత్రి మకాం వద్ద’; హీబ్రూ పదం రాత్రి బస చేసే స్థలాన్ని సూచిస్తుంది, తప్పనిసరిగా వ్యాపారపరమైన సత్రాన్ని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: హీబ్రూ కథనంలో కొత్త ఘట్టాన్ని పరిచయం చేసే వాక్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בַדֶּרֶךְ
  choice: ప్రయాణంలో
  rationale: మార్గమధ్యంలో జరుగుతున్న సంఘటనను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַמָּלוֹן
  choice: రాత్రి బసచేసే చోట
  rationale: మָלוֹן రాత్రి నిలిచి విశ్రాంతి తీసుకునే స్థలాన్ని సూచిస్తుంది; అది తప్పనిసరిగా వ్యాపారపరమైన సత్రం కాదు.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: అతణ్ణి ఎదుర్కొని
  rationale: פגע యొక్క కలుసుకోవడం/ఎదురుపడడం అనే భావంతో పాటు, తరువాతి ప్రాణహాని సందర్భంలోని ప్రతికూల తీవ్రతను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וַיְבַקֵּשׁ
  choice: చంపాలని చూశాడు
  rationale: בקש యొక్క ‘చేయాలని చూడడం/ప్రయత్నించడం’ అనే సందర్భానుకూల భావాన్ని సహజమైన తెలుగులో ఇస్తూ కథన ఉద్రిక్తతను నిలుపుతుంది.
- source_word: הֲמִיתוֹ
  choice: అతణ్ణి చంపాలని
  rationale: מות హిఫీల్ రూపంలోని మరణానికి గురిచేయడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ‘అతణ్ణి’ అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో ‘అతణ్ణి’ అనే అస్పష్టతను నిలుపడం
  alternative: మోషే లేదా అతని కుమారుడు అని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం సర్వనామానికి పూర్వపదాన్ని స్పష్టంగా పేర్కొనదు. అందువల్ల ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో స్థిరపరచకుండా మూలంలోని అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. మూలంలోని సర్వనామ అస్పష్టతను కాపాడుతూ, మָלוֹןను కాలవిరుద్ధమైన ‘హోటలు/సత్రం’గా నిర్దిష్టం చేయలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
