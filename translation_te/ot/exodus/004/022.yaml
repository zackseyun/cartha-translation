source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: te
  text: 'అప్పుడు నీవు ఫరోతో ఇలా చెప్పాలి: “యాహ్వే ఇలా అంటున్నాడు: ఇశ్రాయేలు నా తొలిచూలు కుమారుడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, హెబ్రీ పదక్రమాన్ని మరింత సన్నిహితంగా అనుసరిస్తే: “ఇశ్రాయేలు నా కుమారుడు, నా తొలిచూలు కుమారుడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: అప్పుడు నీవు ... చెప్పాలి
  rationale: సందర్భంలో సంయోజక వావ్ క్రమాన్ని సూచిస్తుంది; Qal perfect 2ms ఇక్కడ మోషేకు ఇచ్చిన ఆదేశంగా ఉంది. ఆధునిక తెలుగులో ‘అప్పుడు ... చెప్పాలి’ క్రమాన్నీ ఆదేశ స్వరాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరోతో
  rationale: మాట చెప్పబడే వ్యక్తిని తెలుగులో సహజంగా సూచించడానికి ‘తో’ విభక్తి వాడబడింది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దూతవాక్య సూత్రంలోని గంభీరతను నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష ప్రకటన రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘కుమారుడు’ అనే స్పష్టమైన పుత్రసంబంధ రూపకాన్ని నిలిపింది.
- source_word: בְכֹרִי
  choice: నా తొలిచూలు కుమారుడు
  rationale: జ్యేష్ఠత్వం, కుటుంబస్థానం, ప్రత్యేక హక్కు అనే భావాలకు అతిగా వ్యాఖ్యానం జోడించకుండా ‘firstborn’ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రామాణిక తెలుగు బైబిలు నామరూపాన్ని ఉపయోగించింది; ఇక్కడ అది ‘నా కుమారుడు, నా తొలిచూలు కుమారుడు’ అనే ద్వంద్వ విశేషణానికి నిర్దేశ్యంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి సన్నిహితం.
- issue: ఇశ్రాయేలుకు సంబంధించిన పుత్రత్వ రూపకం
  choice: ఇశ్రాయేలు నా కుమారుడు, నా తొలిచూలు కుమారుడు
  alternative: ఇశ్రాయేలు నా తొలిచూలు కుమారుడు
  rationale: రెండు నామపదాలనూ విడిగా ఉంచడం హెబ్రీ పదక్రమాన్నీ ‘నా కుమారుడు’ మరియు ‘నా తొలిచూలు’ అనే సమాంతర ఉద్ఘాటననూ కాపాడుతుంది; కలిపిన రూపం తెలుగులో మరింత సంక్షిప్తంగా ఉన్నా మూలంలోని విభజనను కొంత మసకబార్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దూతవాక్య సూత్రం, దైవనామం, పుత్రత్వ రూపకం, హెబ్రీలోని ద్వంద్వ ఉద్ఘాటన నిలుపబడ్డాయి.
