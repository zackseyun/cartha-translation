  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: te
  text: అప్పుడు మోషే తన భార్యను, తన కుమారులను తీసుకొని, వారిని గాడిదపై ఎక్కించి[a], ఐగుప్తు దేశానికి తిరిగి వెళ్లాడు. మోషే దేవుని దండాన్ని[b] తన చేతిలో తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిని గాడిదపై స్వారీ చేయించాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని కర్రను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అప్పుడు మోషే ... తీసుకొని
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది, ‘తీసుకొని’ לקח యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: אִשְׁתּוֹ
  choice: తన భార్యను
  rationale: మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న אשהకు సహజమైన తెలుగు రూపం; ఇక్కడ ‘సిప్పోరా’ అని పేరును చేర్చాల్సిన అవసరం లేదు.
- source_word: בָּנָיו
  choice: తన కుమారులను
  rationale: హీబ్రూ పదం సాధారణంగా ‘పిల్లలు’ అని కాక, ప్రత్యేకంగా పురుష బహువచనమైన ‘కుమారులు’ అని చెబుతుంది.
- source_word: וַיַּרְכִּבֵם
  choice: వారిని ... ఎక్కించి
  rationale: רכב యొక్క హిఫిల్ రూపం ‘ఎక్కించడం/స్వారీ చేయించడం’ అనే కారణార్థాన్ని ఇస్తుంది; ‘ఎక్కించి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הַחֲמֹר
  choice: గాడిద మీద
  rationale: నామవాచకానికి నిర్దిష్ట ఉపపదం ఉంది; తెలుగులో ఈ సందర్భంలో నిర్దిష్టతను ప్రత్యేక సూచిక లేకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లాడు
  rationale: שוב ఇక్కడ తిరిగి వెళ్లడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַרְצָה מִצְרָיִם
  choice: ఐగుప్తు దేశానికి
  rationale: దిశను సూచించే ప్రత్యయం, אֶרֶץ మరియు మిస్రయిమ్ పేరును ప్రతిబింబిస్తూ ‘దేశానికి’ అనే అంశాన్ని నిలుపుతుంది.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: దేవుని కఱ్ఱను
  rationale: מַטֶּהకు ‘కఱ్ఱ’ లేదా ‘దండం’ అనే అర్థాలు ఉండవచ్చు; ఈ కథనంలో మోషే చేతిలో ఉండే సూచక సాధనానికి ‘కఱ్ఱ’ సాధారణ పాఠకులకు సహజంగా ఉంది.
- source_word: בְּיָדוֹ
  choice: తన చేతిలో పట్టుకున్నాడు
  rationale: ‘తన చేతిలో’ అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, తెలుగులో సహజమైన క్రియతో భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים లో הָאֱלֹהִים అనువాదం
  choice: దేవుని
  alternative: దైవికమైన
  rationale: ఈ సందర్భంలో కఱ్ఱ దేవుడు ఇచ్చిన ఆజ్ఞతోను సూచక కార్యాలతోను సంబంధించింది; కాబట్టి వ్యక్తిగత సూచనను నిలుపుతున్న ‘దేవుని’ సూటిగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఐగుప్తు’ బైబిలు పాఠకులకు పరిచితమైన పేరుగా ఉంచబడింది; ‘కఱ్ఱ’ మరియు ‘దండం’ మధ్య పదార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో చూపబడింది.
