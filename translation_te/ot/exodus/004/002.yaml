  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: te
  text: యాహ్వే అతనితో, “నీ చేతిలో ఏముంది?” అన్నాడు. అతడు, “ఒక కర్ర[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక చేతికర్ర,” “ఒక దండం.” హెబ్రీ పదం מַטֶּה సందర్భాన్ని బట్టి కర్ర, చేతికర్ర, లేదా దండాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అని అడిగాడు ... అని జవాబిచ్చాడు
  rationale: రెండు చోట్లా మూల క్రియ אמר (‘అన్నాడు’) ఉన్నప్పటికీ, మొదటిది ప్రశ్నగా, రెండోది దానికి సమాధానంగా పనిచేస్తున్నాయి. సహజమైన తెలుగులో సంభాషణ పాత్రలను స్పష్టంగా వ్యక్తపరచడానికి ‘అడిగాడు ... జవాబిచ్చాడు’ ఎంచుకున్నాం; భావాన్ని మార్చలేదు.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: తెలుగులో మాట చెప్పబడిన వ్యక్తిని సహజంగా సూచించే రూపం; హెబ్రీ ‘అతనికి/అతనితో’ భావాన్ని నిలుపుతుంది.
- source_word: מַה־זֶּה / מִזֶּה
  choice: ఉన్నది ఏమిటి?
  rationale: చేతిలో కనిపిస్తున్న వస్తువు ఏమిటో గుర్తించమని అడిగే ప్రశ్న. ‘నీ చేతిలో ఇది ఏమిటి?’ కంటే ‘నీ చేతిలో ఉన్నది ఏమిటి?’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతిలో
  rationale: మోషే పట్టుకున్న భౌతిక వస్తువును సూచించే మూలంలోని సూటి, సహజ అర్థాన్ని నిలుపుతుంది.
- source_word: מַטֶּה
  choice: ఒక కర్ర
  rationale: מַטֶּה సందర్భానుసారం చేతికర్ర, దండం, లేదా కర్రను సూచించగలదు. ఇక్కడ మోషే చేతిలో పట్టుకున్న సాధారణ వస్తువుకు ‘కర్ర’ సహజమైన విస్తృత పదం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచాం. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను ప్రతిబింబించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. హెబ్రీ కథనంలోని ప్రశ్న–జవాబు క్రమాన్ని కాపాడుతూ, తెలుగులో అసహజమైన పదపునరుక్తిని నివారించాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా ఉంది.
