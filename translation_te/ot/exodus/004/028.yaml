source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: te
  text: మోషే తనను పంపిన యెహోవా మాటలన్నిటినీ[a], యెహోవా అతనికి ఆజ్ఞాపించిన సూచకాలన్నిటినీ అహరోనుకు తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా తనను ఏ మాటలతో పంపాడో ఆ మాటలన్నిటినీ.” హీబ్రూ సంబంధవాక్యాన్ని ‘మాటలు’ అనే పదంతో దగ్గరగా అనుసంధానించవచ్చు; ఏ పఠనంలోనైనా యెహోవా మోషేను పంపాడనే భావం ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: హిఫిల్ రూపం ‘తెలియజేయడం, చెప్పడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో మోషే అహరోనుకు దేవుని ఆదేశాలను వివరించడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: דִּבְרֵי יְהוָה
  choice: యెహోవా మాటలు
  rationale: דָּבָר అనే పదానికి ‘మాట, విషయం, సందేశం’ అనే అర్థాలున్నాయి. బహువచనాన్ని నిలుపుతూ ‘మాటలు’ అని అనువదించడం మూలానికి సన్నిహితంగా, తెలుగులో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: తనను పంపిన
  rationale: 'సంబంధవాక్యాన్ని ప్రధాన పఠనంలో యెహోవాతో అనుసంధానించాం: యెహోవా మోషేను పంపాడు. అయితే అది ‘మాటలతో’ దగ్గరగా అనుసంధానించబడే అవకాశం ఉన్నందున పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.'
- source_word: הָאֹתֹת
  choice: సూచక క్రియలు
  rationale: אוֹת అనేది ‘సూచన/సంకేతం’ అని అర్థం; ఈ సందర్భంలో చేయవలసిన అసాధారణ క్రియలను సూచిస్తుంది. ‘సూచక క్రియలు’ అనడం కార్యరూప భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ ‘అద్భుతాలు’ అని అతిగా నిర్ధారించదు.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: ఆయన తనకు ఆజ్ఞాపించిన
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తతను నిలుపుతూ, యెహోవా మోషేకు ఆ సూచక క్రియల విషయమై ఆజ్ఞ ఇచ్చాడనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘చేయమని’ అనే అంతర్నిహిత క్రియను ప్రధాన పాఠంలో అదనంగా చేర్చలేదు.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: אֲשֶׁר שְׁלָחוֹ సంబంధవాక్య అనుసంధానం
  choice: యెహోవా మోషేను పంపాడనే పఠనం
  alternative: యెహోవా మోషేను ఏ మాటలతో పంపాడో అనే పఠనం
  rationale: హీబ్రూ సంబంధసర్వనామం వ్యాకరణపరంగా ఒకటి కంటే ఎక్కువ అనుసంధానాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో సహజమైన వ్యక్తి-పూర్వపద పఠనాన్ని ఇచ్చి, నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘అహరోను’, ‘యెహోవా’ వంటి సాంప్రదాయ తెలుగు బైబిలు నామరూపాలను ఉంచాం; మూలంలోని సంబంధవాక్య సందిగ్ధతను పాదటిప్పణితో సంరక్షించాం.
