revisions:
- from: కాబట్టి ఇప్పుడు వెళ్లు. నేను నీ నోటికి తోడుగా ఉంటాను; నీవు ఏమి మాట్లాడాలో నీకు నేర్పిస్తాను.
  to: ఇప్పుడు వెళ్లు. నేను నీ నోటితో ఉంటాను; నీవు ఏమి మాట్లాడాలో నీకు నేర్పిస్తాను.
  rationale: The revision removes the added inferential “కాబట్టి” and replaces the awkward dative phrase with a direct, natural rendering of “with your mouth.” It retains the source's concrete imagery rather than reducing it to “I will help you speak,” while preserving the modern standard Telugu register.
  reviewer_model: gpt-5.6-terra
