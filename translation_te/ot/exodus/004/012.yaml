id: EXO.4.12
reference: Exodus 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה לֵ֑ךְ וְ/אָנֹכִי֙ אֶֽהְיֶ֣ה עִם פִּ֔י/ךָ וְ/הוֹרֵיתִ֖י/ךָ אֲשֶׁ֥ר תְּדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/012.yaml
  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: te
  text: ఇప్పుడు వెళ్లు. నేను నీ నోటితో ఉంటాను; నీవు ఏమి మాట్లాడాలో నీకు నేర్పిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఈ పదబంధం కాలసూచనతోపాటు మోషే అభ్యంతరానికి దేవుడు ఇస్తున్న ప్రతిస్పందనలో తదుపరి ఆజ్ఞను ప్రవేశపెడుతుంది. ‘కాబట్టి ఇప్పుడు’ ఆ సందర్భ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵךְ
  choice: వెళ్లు
  rationale: הלך ధాతువు Qal ఆజ్ఞార్థక రూపం. సూటియైన ‘వెళ్లు’ మూలంలోని ప్రత్యక్ష ఆజ్ఞను కాపాడుతుంది.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: నేను … ఉంటాను
  rationale: స్వతంత్ర సర్వనామమైన אָנֹכִי దేవుని వ్యక్తిగత సాన్నిధ్యాన్ని ముందుకు తెస్తుంది. తెలుగులో స్పష్టమైన ‘నేను’తో దాన్ని సహజంగా వ్యక్తం చేశాం; ‘నేనే’ అని పెంచి మూలంలో తప్పనిసరిగా లేని వ్యత్యాస భావాన్ని చేర్చలేదు.
- source_word: עִם־פִּיךָ
  choice: నీ నోటికి తోడుగా
  rationale: అక్షరార్థంగా ‘నీ నోటితో’ అనే మూర్తమైన రూపకాన్ని ‘నీ నోటికి తోడుగా’ అని తెలుగులో అర్థవంతంగా నిలిపాం. దీనిని కేవలం ‘నీవు మాట్లాడేందుకు సహాయం చేస్తాను’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: וְהוֹרֵיתִיךָ
  choice: నీకు నేర్పిస్తాను
  rationale: ירה ధాతువు Hiphil రూపానికి ఇక్కడ ‘బోధించు/నేర్పించు’ అనే అర్థం సరిపోతుంది. తరువాత వచ్చే మాటల విషయాన్ని దృష్టిలో ఉంచుకొని ‘నేర్పిస్తాను’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: నీవు ఏమి మాట్లాడాలో
  rationale: ఈ సంబంధ వాక్యం దేవుడు నేర్పించే విషయాన్ని సూచిస్తుంది. ‘ఏమి మాట్లాడాలో’ భవిష్యత్తులో పలకవలసిన మాటల భావాన్ని సహజంగా అందిస్తుంది; మూలంలోని דברకు అనుగుణంగా ‘మాట్లాడు’ను వాడాం.
theological_decisions:
- issue: పిలుపు సందర్భంలో దేవుని సాన్నిధ్య సూత్రం
  choice: నేను నీ నోటికి తోడుగా ఉంటాను
  alternative: నీవు మాట్లాడేందుకు నేను సహాయం చేస్తాను
  rationale: మూలపాఠం దేవుని సహాయాన్ని కేవలం సామర్థ్యంగా వివరిస్తూ చెప్పకుండా, మోషే ‘నోటితో’ దేవుడే ఉంటాడని మూర్తమైన భాషలో చెబుతుంది. ఎంచుకున్న అనువాదం దేవుని వ్యక్తిగత సాన్నిధ్యాన్నీ, మోషే మాటలకు ఆయన ఇచ్చే సామర్థ్యాన్నీ ఒకేసారి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా అనువదించబడింది. ‘నీ నోటికి తోడుగా’ అనే ప్రయోగం మూలంలోని శరీరసంబంధ రూపకాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. రెండు ప్రధాన వాక్యభాగాల మధ్య అర్ధవిరామం దేవుని సాన్నిధ్యాన్నీ ఆయన ఇచ్చే బోధననూ దగ్గరగా అనుసంధానిస్తుంది.
