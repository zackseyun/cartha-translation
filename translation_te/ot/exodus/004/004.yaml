source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה שְׁלַח֙ יָֽדְ/ךָ֔ וֶ/אֱחֹ֖ז בִּ/זְנָב֑/וֹ וַ/יִּשְׁלַ֤ח יָד/וֹ֙ וַ/יַּ֣חֲזֶק בּ֔/וֹ וַ/יְהִ֥י לְ/מַטֶּ֖ה בְּ/כַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: te
  text: అప్పుడు యాహ్వే మోషేతో, “నీ చెయ్యి చాపి, దాని తోకను పట్టుకో[a]” అన్నాడు. అతడు తన చెయ్యి చాపి దాన్ని పట్టుకున్నాడు; అది అతని చేతిలో కర్రగా[b] మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాని తోక పట్టుకో” లేదా “దాన్ని తోక దగ్గర పట్టుకో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “దండంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: שְׁלַח יָדְךָ
  choice: నీ చెయ్యి చాపి
  rationale: చేతిని ముందుకు చాపే భౌతిక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: దాని తోకను పట్టుకో
  rationale: ఆజ్ఞలోని పట్టుకునే స్పష్టమైన చర్యను సహజంగా వ్యక్తం చేస్తుంది; בְּ వల్ల సాధ్యమైన ‘తోక దగ్గర/తోక పట్టుకుని’ అనే భావం పాదటిప్పణిలో నిలుపబడింది.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: దాన్ని పట్టుకున్నాడు
  rationale: חזק ఇక్కడ దానిపై గట్టిగా పట్టు సాధించడాన్ని సూచిస్తుంది; సందర్భంలో ‘పట్టుకున్నాడు’ సహజంగా ఉండి ఆజ్ఞ-అమలు అనుసరణను నిలుపుతుంది.
- source_word: וַיְהִי לְמַטֶּה
  choice: కర్రగా మారింది
  rationale: రూపాంతర సందర్భంలో היה మారిన స్థితిని సూచిస్తుంది; מַטֶּהకు ‘కర్ర’ సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: בְּכַפּוֹ
  choice: అతని చేతిలో
  rationale: כַּף అక్షరార్థంగా అరచేతిని సూచించగలిగినా, ఈ సందర్భంలో ‘చేతిలో’ అనే తెలుగు ప్రయోగం సహజంగా అర్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించాం; ‘యెహోవా’ మరొక సంప్రదాయ రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడాం. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం. పాదటిప్పణి సూచికలను అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచాం.
