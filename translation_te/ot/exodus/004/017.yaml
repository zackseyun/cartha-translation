translation:
  language: te
  text: ఈ కర్రను నీ చేతిలో తీసుకో; దానితో నీవు ఆ సూచకాలను చేస్తావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సూచకాలు’కు బదులుగా ‘సూచనలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం కేవలం ‘ఆ సూచకాలు’ అని అంటుంది; వాటి అద్భుత స్వభావాన్ని ప్రత్యేక విశేషణంతో చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ఈ కర్రను
  rationale: וְ అనే అనుసంధానాన్ని తెలుగు ఆజ్ఞావాక్య ప్రవాహంలో ప్రత్యేకంగా అనువదించకుండా సహజంగా వ్యక్తం చేశాం; אֶת ప్రత్యక్ష కర్మను ‘ను’ విభక్తి సూచిస్తుంది.
- source_word: הַמַּטֶּה הַזֶּה
  choice: ఈ కర్రను
  rationale: מַטֶּה కు ‘కర్ర’, ‘దండం’ అనే భావాలు ఉన్నాయి. మోషే కాపరి నేపథ్యానికీ సాధారణ ఆధునిక తెలుగుకీ ‘కర్ర’ సహజంగా సరిపోతుంది; הַזֶּה నిర్దిష్టంగా ఇప్పటికే ప్రస్తావించిన కర్రను సూచిస్తుంది.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: నీ చేతిలో తీసుకో
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ ఆజ్ఞార్థకంగా పనిచేస్తుంది. בְּיָדֶךָ ను నేరుగా, సహజంగా ‘నీ చేతిలో’ అని ఇచ్చాం.
- source_word: אֲשֶׁר ... בּוֹ
  choice: దానితో
  rationale: సంబంధవాచక నిర్మాణం కర్రను సాధనంగా చూపుతుంది. తెలుగులో ‘దానితో’ అనేది ఈ సాధనార్థాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: నీవు ... చేస్తావు
  rationale: עָשָׂה యొక్క ప్రాథమిక ‘చేయు’ భావాన్ని నిలిపి, భవిష్యత్ సూచనను ‘చేస్తావు’తో వ్యక్తం చేశాం.
- source_word: הָאֹתֹת
  choice: ఆ సూచక క్రియలను
  rationale: אוֹת ఇక్కడ దేవుడు ఇంతకుముందు చూపించిన ధృవీకరణ సూచనలను సూచిస్తుంది. ‘సూచక క్రియలు’ అనేది అవి కేవలం సంకేతాలు మాత్రమే కాక కార్యరూపంలో జరిగే సూచనలు అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘అద్భుతాలు’ అని స్పష్టీకరించి మూలంలోని విస్తృతతను కుదించలేదు.
theological_decisions:
- issue: הָאֹתֹת లో అద్భుత స్వభావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా పేర్కొనాలా?
  choice: ‘ఆ సూచక క్రియలను’ అని అనువదించి అద్భుత స్వభావాన్ని సందర్భానికే వదిలాం.
  alternative: ‘ఆ అద్భుత సూచక క్రియలను’
  rationale: హీబ్రూ పాఠ్యంలో ‘అద్భుతమైన’ అనే విశేషణం లేదు. సందర్భంలో అవి అద్భుత కార్యాలే అయినా, మూలపాఠ్యపు సంక్షిప్తతను మరియు భావ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞా శైలిని వాడాం. ‘దండం’ కంటే సాధారణ పాఠకులకు సహజమైన ‘కర్ర’ను ఎంచుకున్నాం. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదటిప్పణికి సరిపోతుంది.
