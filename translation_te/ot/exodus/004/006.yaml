source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: te
  text: 'యాహ్వే అతనితో మరల ఇలా అన్నాడు: “దయచేసి నీ చెయ్యిని నీ వస్త్రపు మడతలో పెట్టు.” అతడు తన చెయ్యిని తన వస్త్రపు మడతలో పెట్టి, తన చెయ్యిని బయటికి తీశాడు. ఇదిగో, అతని చెయ్యి మంచులా తెల్లగా చర్మవ్యాధిగ్రస్తమైంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘చర్మవ్యాధిగ్రస్తమైంది’ అని అనువదించిన హీబ్రూ పదం צָרַעַת అనే స్థితిని సూచిస్తుంది. అది ఆధునిక కుష్ఠువ్యాధి (హాన్సెన్ వ్యాధి)తో సరిగ్గా సమానమైనదని చెప్పలేం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఇక్కడ ఇది ముందటి సూచనకు మరొక సూచనను జోడించడాన్ని సూచిస్తుంది; తెలుగులో ‘ఇంకా ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: הָבֵא נָא
  choice: దయచేసి ... పెట్టు
  rationale: క్రియ యొక్క సందర్భానుసార భావాన్ని సహజమైన తెలుగులో ‘పెట్టు’గా, נָא ఇచ్చే మృదువైన అభ్యర్థనా ఛాయను ‘దయచేసి’గా వ్యక్తం చేస్తుంది.
- source_word: חֵיק
  choice: వస్త్రపు మడత
  rationale: ఛాతీ దగ్గర వస్త్రంలో ఏర్పడే, చెయ్యి లేదా వస్తువు పెట్టగల మడతను సందర్భానికి స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘రొమ్ము’ అనడం వల్ల కలిగే శరీరాంగ అపార్థాన్ని నివారిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: సూచకమైన, ఆశ్చర్యాన్ని రేకెత్తించే హీబ్రూ ప్రయోగ బలాన్ని సహజమైన గంభీర తెలుగులో నిలుపుతుంది.
- source_word: מְצֹרַעַת
  choice: చర్మవ్యాధి పట్టింది
  rationale: బైబిలు צָרַעַת ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం కాదు; అందువల్ల నిర్దిష్ట ఆధునిక నిర్ధారణను మోపకుండా విస్తృతమైన చర్మవ్యాధి భావాన్ని ఇస్తుంది.
- source_word: כַּשָּׁלֶג
  choice: మంచులా తెల్లగా
  rationale: మూలంలో అక్షరార్థంగా ‘మంచులా’ ఉన్నా, తెలుగులో పోలిక సూచించే కనిపించే లక్షణం తెల్లదనమని స్పష్టపరచడం సహజం; వ్యాధి మంచువంటిదని అపార్థం కాకుండా చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన రూపంలో ఉంచుతుంది.
- issue: מְצֹרַעַת ను ఆధునిక కుష్ఠువ్యాధిగా గుర్తించాలా
  choice: చర్మవ్యాధి పట్టింది
  alternative: కుష్ఠువ్యాధి పట్టింది
  rationale: పాత నిబంధనలోని צָרַעַת అనేక రకాల ఉపరితల లక్షణాలకు వాడబడుతుంది; దాన్ని హాన్సెన్ వ్యాధితో నిశ్చయంగా సమానపరచకపోవడం మూలంలోని వైద్య అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. ‘వస్త్రపు మడత’ సాంస్కృతిక చర్యను స్పష్టపరుస్తుంది; ‘ఇదిగో’ మూలంలోని నాటకీయ సూచనను నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత పదబంధం తరువాత ప్రధాన పాఠంలో ఉంచబడింది.
