base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: te
  text: నా భీతిని నీ ముందుగా పంపుతాను[a]. నీవు ఎవరి మధ్యకు వెళ్తావో ఆ ప్రజలందరినీ కలవరపెడతాను[b]. నీ శత్రువులందరూ నీకు వీపు చూపేలా చేస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా భయాన్ని’ లేదా ‘నా భయోత్పాతాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గందరగోళంలో పడేస్తాను,’ ‘భయాందోళనకు గురిచేస్తాను,’ లేదా ‘తికమకపెడతాను.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ నుడికారం అక్షరార్థంగా, ‘నీ శత్రువులందరినీ నీకు వీపు/మెడగా ఇస్తాను.’ దీని భావం, వారు వెనుదిరిగి నీ ఎదుటినుండి పారిపోతారని.
    reason: idiom_explanation
lexical_decisions:
- source_word: אֵימָתִי
  choice: నా భయానకతను
  rationale: אֵימָה తీవ్రమైన భయం, భీతి లేదా భయోత్పాతాన్ని సూచిస్తుంది. స్వామ్యార్థాన్నీ దేవుడు పంపే భీతికర ప్రభావాన్నీ ‘నా భయానకతను’ నిలుపుతుంది.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: నీకు ముందుగా పంపుతాను
  rationale: לְפָנֶיךָ ఇక్కడ ఇశ్రాయేలీయుల కంటే ముందుగా పంపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నీకు ముందుగా’ సహజంగా ఈ దిశార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְהַמֹּתִי
  choice: కలవరపెడతాను
  rationale: המם హిఫీల్ రూపం గందరగోళం, భయాందోళన లేదా అల్లకల్లోలం కలిగించడాన్ని సూచిస్తుంది. ‘కలవరపెడతాను’ కారణార్థాన్ని నిలుపుతూ సైనిక ఓటమిని అవసరానికి మించి స్పష్టీకరించదు.
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: నీవు ఎవరి మధ్యకు వెళ్తావో ఆ ప్రజలందరినీ
  rationale: בָהֶם వారిలో లేదా వారి మధ్యకు ప్రవేశించడాన్ని సూచిస్తుంది. ‘ఎవరి మధ్యకు’ మూలంలోని భావాన్ని కాపాడుతుంది; ‘ఎవరిమీదికి’ అని అనువదించి విరోధార్థాన్ని చేర్చదు.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: నీ శత్రువులందరూ నీకు వీపు చూపేలా చేస్తాను
  rationale: ‘వీపు/మెడను ఇవ్వడం’ అనే హీబ్రూ నుడికారం శత్రువులు వెనుదిరిగి పారిపోవడాన్ని సూచిస్తుంది. ‘వీపు చూపేలా’ మూల చిత్రాన్ని తెలుగులో అర్థమయ్యేలా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ విజయానికీ శత్రువుల కలవరానికీ దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: ‘పంపుతాను,’ ‘కలవరపెడతాను,’ ‘చేస్తాను’ అనే ప్రత్యక్ష ప్రథమ పురుష క్రియలను నిలుపడం
  alternative: దేవుని కారణత్వాన్ని పరోక్షంగా లేదా మృదువుగా చూపడం
  rationale: హీబ్రూ వాక్యంలో దేవుడే స్పష్టంగా ఈ క్రియల కర్త. అందువల్ల ఆయన ప్రత్యక్ష కార్యసాధకత్వాన్ని తగ్గించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఏకవచన సంబోధనను మూలానికి అనుగుణంగా ఉంచాం. హీబ్రూ సైనిక నుడికారంలోని ‘వీపు’ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, భావాన్ని పాదటిప్పణిలో వివరించాం.
