translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూలోని ఏకవచన ద్వితీయ పురుష రూపాన్ని ‘నీవు/నీ’తో నిలిపాం. ముందరి వచనం నుండి భావానుసారంగా కొనసాగే ‘ఆచరించాలి’ అనే క్రియను తెలుగులో స్పష్టత కోసం రెండుచోట్ల పూరించాం; గీతల మధ్య భాగం ‘ప్రథమఫలాలు’ అనే వివరణాత్మక అనుబంధాన్ని చూపుతుంది.
