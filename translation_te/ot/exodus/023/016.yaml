id: EXO.23.16
reference: Exodus 23:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: te
  text: పొలంలో నీవు విత్తిన నీ కృషి ప్రథమఫలాల పంటకోత పండుగను[a] ఆచరించాలి; అలాగే సంవత్సరం ముగిసే సమయంలో[b], పొలం నుండి నీ కృషి ఫలాలను సమకూర్చుకునేటప్పుడు పంట సేకరణ పండుగను[c] ఆచరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חַג అనే హీబ్రూ పదాన్ని ‘ఉత్సవం’ అని కూడా అనువదించవచ్చు; ఈ వచనంలోని రెండు సందర్భాలకూ ఇది వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘సంవత్సరం బయటికి వెళ్లే సమయంలో.’
    reason: lexical_alternative
  - marker: c
    text: ‘పంట సేకరణ’ అనేది పొలం నుండి పంట దిగుబడిని సేకరించడాన్ని గుర్తుచేసే పండుగను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: పండుగ
  rationale: నియమితమైన ఆనందోత్సవ ఆచరణను సూచించే ఈ పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ‘పండుగ’ను ఎంచుకున్నాం.
- source_word: הַקָּצִיר
  choice: పంటకోత
  rationale: ఈ నామవాచకం కోత లేదా పంటకోతను సూచిస్తుంది; పండుగ పేరులో ‘పంటకోత’ వ్యవసాయ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּכּוּרֵי
  choice: ప్రథమఫలాలు
  rationale: మొదట లభించే దిగుబడిలో దేవునికి అర్పించే భాగం అనే వ్యవసాయ, ఆరాధనా భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: מַעֲשֶׂיךָ
  choice: నీ కృషి / నీ కృషి ఫలాలు
  rationale: అక్షరార్థంగా ‘నీ పనులు’; వ్యవసాయ సందర్భంలో మానవ కృషినీ దాని దిగుబడినీ సూచిస్తుంది. మొదటి చోట కృషితో సంబంధాన్ని నిలిపి, రెండవ చోట పొలం నుండి సమకూర్చేది కృషి ఫలాలేనని సహజ తెలుగులో స్పష్టం చేశాం.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: పొలంలో నీవు విత్తిన
  rationale: సంబంధ వాక్యాన్ని నేరుగా ఉంచి, ఏకవచన ద్వితీయ పురుష సంబోధనను కాపాడుతుంది.
- source_word: הָאָסִף
  choice: సమకూర్పు
  rationale: పొలం నుండి దిగుబడిని ఒకచోట చేర్చడాన్ని సూచించే పండుగ పేరుగా, మూలంలోని నామరూపాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: సంవత్సరం ముగిసే సమయంలో
  rationale: అక్షరార్థమైన ‘సంవత్సరం బయటికి వెళ్లే సమయంలో’ అనే హీబ్రూ నుడికారానికి సహజమైన కాలార్థ అనువాదం.
- source_word: בְּאָסְפְּךָ
  choice: నీవు సమకూర్చుకున్నప్పుడు
  rationale: ఉపసర్గతో కూడిన క్రియానామాన్ని సందర్భానుసారంగా కాలవాచక ఉపవాక్యంగా సహజ తెలుగులో ఇచ్చాం.
- source_word: מִן הַשָּׂדֶה
  choice: పొలం నుండి
  rationale: వస్తువులు వచ్చే స్థలాన్ని తెలిపే మూలభాషా పదబంధానికి నేరమైన, సహజమైన అనువాదం.
