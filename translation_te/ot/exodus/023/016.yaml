revisions:
- from: పంటకోత పండుగను[a]—పొలంలో నీవు విత్తిన నీ కృషి ప్రథమఫలాలతో—ఆచరించాలి. అలాగే సంవత్సరం ముగిసే సమయంలో[b], పొలం నుండి నీ కృషి ఫలాలను నీవు సమకూర్చుకున్నప్పుడు, సమకూర్పు పండుగను[c] ఆచరించాలి.
  to: పొలంలో నీవు విత్తిన నీ కృషి ప్రథమఫలాల పంటకోత పండుగను[a] ఆచరించాలి; అలాగే సంవత్సరం ముగిసే సమయంలో[b], పొలం నుండి నీ కృషి ఫలాలను సమకూర్చుకునేటప్పుడు పంట సేకరణ పండుగను[c] ఆచరించాలి.
  rationale: The revision removes the unwarranted instrumental sense attached to “ప్రథమఫలాలు,” retains the Hebrew agricultural-work imagery, and replaces the less idiomatic abstract festival name with a natural modern Telugu equivalent. Footnote c is updated to match its revised anchor.
