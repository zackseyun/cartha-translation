source:
  edition: WLC
  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: te
  text: అయితే నీవు అతని స్వరాన్ని శ్రద్ధగా విని, నేను చెప్పేదంతా చేస్తే[b][a], నేను నీ శత్రువులకు శత్రువుగా, నీ విరోధులకు విరోధిగా ఉంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు అతని స్వరాన్ని తప్పక వింటే.’ హీబ్రూలో ఒకే క్రియకు చెందిన అనంతరూపం, క్రియారూపంతో కలిసి రావడం వల్ల బలమైన నొక్కిచెప్పడం వ్యక్తమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలో ‘అతని స్వరం’ అనే మాట నుంచి ‘నేను చెప్పేది’ అనే ప్రథమ పురుష మాటకు మార్పు ఉంది. సందర్భంలో దూతకూ యెహోవాకూ ఉన్న సన్నిహిత సంబంధాన్ని ఈ మార్పు అలాగే నిలుపుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: అయితే … చేస్తే
  rationale: ముందున్న హెచ్చరికకు భిన్నంగా బలమైన షరతును ప్రవేశపెడుతుంది. ఆధునిక తెలుగులో ‘అయితే’తో కూడిన షరతు ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: జాగ్రత్తగా విని లోబడితే
  rationale: అనంతరూపం, సమాపక క్రియ కలయిక వినడాన్ని బలంగా నొక్కిచెబుతుంది; ‘స్వరాన్ని వినడం’ అనే సందర్భంలో విధేయత కూడా అంతర్భూతమై ఉంది. ఈ అనువాదం వినడాన్నీ దానికి అనుగుణంగా లోబడడాన్నీ నిలుపుతుంది.
- source_word: בְּקֹלוֹ
  choice: అతని స్వరాన్ని
  rationale: సందర్భంలోని దూతను సూచించే మూడవ పురుష ఏకవచనాన్ని, వ్యక్తిగత స్వరమనే హీబ్రూ రూపకల్పనను కాపాడుతుంది.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: నేను చెప్పేదంతా చేస్తే
  rationale: ‘అతని స్వరం’ నుంచి దేవుని ప్రథమ పురుష మాటకు జరిగే మార్పును స్పష్టంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: నేను నీ శత్రువులకు శత్రువుగా … ఉంటాను
  rationale: క్రియకూ ‘శత్రువులు’ అనే నామానికీ మధ్య ఉన్న పదసంబంధాన్ని కాపాడుతుంది; కేవలం ‘ఎదిరిస్తాను’ అని భావానువాదం చేయదు.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: నీ విరోధులకు విరోధిగా ఉంటాను
  rationale: హీబ్రూలోని రెండవ సమాంతర పదజంటను తెలుగులోనూ ఒకే మూలపదంతో వ్యక్తం చేసి, ముందున్న ‘శత్రువులు’ అనే పదం నుంచి స్వల్ప భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని స్వరం’ నుంచి ‘నేను చెప్పేది’కి మారే సూచన
  choice: మూడవ పురుషంలోని దూత స్వరానికీ దేవుని ప్రథమ పురుష మాటకీ మధ్య పాఠ్యంలో ఉన్న మార్పును అలాగే ఉంచడం
  alternative: రెండు భాగాలనూ దూతను మాత్రమే లేదా దేవుని ప్రత్యక్ష మాటను మాత్రమే సూచించేలా సమన్వయపరచడం
  rationale: సందర్భంలో దూతకూ యెహోవా మాటకూ ఉన్న సన్నిహిత సంబంధాన్ని వాక్యం పరిష్కరించకుండా నిలుపుతుంది; అనువాదం కూడా ఆ theological tension‌ను అలాగే కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే ఒడంబడిక సంబంధమైన గంభీరతను కాపాడే శైలి. ‘శత్రువులకు శత్రువుగా, విరోధులకు విరోధిగా’ అనే సమాంతర నిర్మాణం మూలపాఠంలోని పదక్రీడను నిలుపుతుంది.
