source:
  edition: WLC
  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: te
  text: అయితే ఏడవ సంవత్సరంలో దానిని సాగు చేయకుండా విడిచిపెట్టి, అలాగే ఉండనివ్వాలి[a]. అప్పుడు నీ ప్రజల్లోని పేదలు దానిలో పండినదాన్ని తింటారు; వారు మిగిల్చినదాన్ని పొలంలోని అడవి జంతువులు తింటాయి[b]. నీ ద్రాక్షతోట విషయంలోనూ, నీ ఒలీవ చెట్ల తోట విషయంలోనూ అలాగే చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని విడుదల చేసి వదిలివేయాలి.” హెబ్రీలోని రెండు క్రియలు ఏడవ సంవత్సరంలో సాధారణ సాగును ఆపి భూమిని సాగుచేయకుండా ఉంచడాన్ని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పొలంలోని జంతువు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: అయితే ఏడవ సంవత్సరంలో
  rationale: ముందటి ఆరు సంవత్సరాలతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఏడవ సంవత్సరాన్ని కాలసూచకంగా వ్యక్తపరుస్తుంది.
- source_word: תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ
  choice: దానిని సాగు చేయకుండా విడిచిపెట్టి, అలాగే ఉండనివ్వాలి
  rationale: రెండు హెబ్రీ క్రియలు సాధారణ సాగును నిలిపి భూమిని ఉపయోగించకుండా వదలడాన్ని బలంగా సూచిస్తాయి. శాశ్వతంగా పరిత్యజించాలనే భావం రాకుండా, వ్యవసాయ సందర్భాన్ని స్పష్టంగా తెలియజేసే రూపం ఎంచుకోబడింది.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: నీ ప్రజల్లోని పేదలు
  rationale: సమాజంలోని ఆర్థికంగా నిరుపేదలైనవారిని ఆధునిక, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וְיִתְרָם
  choice: వారు మిగిల్చినదాన్ని
  rationale: బహువచన ప్రత్యయం పేదలను సూచిస్తుంది; వారు తిన్న తరువాత మిగిలినదనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: పొలంలోని అడవి జంతువులు
  rationale: పదబంధంలోని ‘పొలం’ భావాన్నీ, పెంపుడు జంతువులు కాక అడవి జంతువులనే అర్థాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: לְכַרְמְךָ
  choice: నీ ద్రాక్షతోట విషయంలోనూ
  rationale: అదే ఏడవ-సంవత్సర నియమం ద్రాక్షతోటకు కూడా వర్తిస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְזֵיתֶךָ
  choice: నీ ఒలీవ చెట్ల తోట విషయంలోనూ
  rationale: ఏకవచన సమూహార్థక పదాన్ని ద్రాక్షతోటకు సమాంతరమైన సాగు ప్రదేశంగా స్పష్టంగా, ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఏడవ సంవత్సరంలో భూమిని ‘విడిచిపెట్టడం’ అనే ఆజ్ఞ స్వరూపం
  choice: సాగు చేయకుండా విడిచిపెట్టి, అలాగే ఉండనివ్వడం
  alternative: భూమిని పూర్తిగా పరిత్యజించడం
  rationale: మూలంలోని క్రియలు సాధారణ సాగును నిలిపివేయడాన్ని సూచిస్తాయి; యాజమాన్యాన్ని శాశ్వతంగా వదులుకోవాలని పాఠం చెప్పదు. అందువల్ల ఆ భేదాన్ని అనువాదంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి ఉపయోగించబడింది. సందర్భంలోని భూమిని సూచించేందుకు ‘దానిని’ వాడబడింది; ‘దానిలో పండినదాన్ని’ అనేది పేదలు తినే ఫలాన్ని సహజంగా స్పష్టం చేస్తుంది.
