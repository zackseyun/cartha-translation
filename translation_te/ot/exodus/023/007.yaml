source:
  edition: WLC
  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: te
  text: అబద్ధపు విషయానికి దూరంగా ఉండు[a]. నిర్దోషిని, నీతిమంతుణ్ణి చంపవద్దు; ఎందుకంటే దుష్టుణ్ణి నేను నిర్దోషిగా తీర్చను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అబద్ధ ఆరోపణకు దూరంగా ఉండు,’ లేదా ‘అబద్ధానికి దూరంగా ఉండు.’ హీబ్రూ పదానికి ‘మాట,’ ‘విషయం,’ ‘వ్యవహారం,’ లేదా ‘కేసు’ అనే విస్తృత అర్థాలు ఉన్నాయి; ఇక్కడ అది తప్పుడు సాక్ష్యాన్ని లేదా మోసపూరిత న్యాయవ్యవహారాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎందుకంటే దోషిని నేను నిర్దోషిగా విడుదల చేయను.’ హీబ్రూ క్రియ న్యాయస్థాన సంబంధమైనది; దానికి ‘నీతిమంతుడని ప్రకటించు,’ ‘నిర్దోషిగా తీర్చు,’ లేదా ‘నిర్దోషిగా విడుదల చేయు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: అబద్ధమైన వ్యవహారానికి
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘వ్యవహారం,’ ‘కేసు’ వంటి విస్తృత అర్థాలు ఉన్నాయి. న్యాయసంబంధ సందర్భంలో ‘వ్యవహారం’ ఆ విస్తృతిని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఉంటుంది.
- source_word: תִּרְחָק
  choice: దూరంగా ఉండు
  rationale: Qal అసంపూర్ణ క్రియ ఇక్కడ ఆజ్ఞార్థక బలంతో ఉంది; అబద్ధ వ్యవహారం నుంచి క్రియాశీలంగా వేరుగా ఉండాలనే భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: וְנָקִי
  choice: నిర్దోషిని
  rationale: נָקִי సాధారణంగా అపరాధం లేని లేదా నిర్దోషియైన వ్యక్తిని సూచిస్తుంది; న్యాయ సందర్భంలో ‘నిర్దోషి’ స్పష్టమైన పదం.
- source_word: וְצַדִּיק
  choice: నీతిమంతుణ్ణి
  rationale: צַדִּיק ‘నీతిమంతుడు,’ ‘న్యాయవంతుడు,’ లేదా ‘హక్కు తనవైపు ఉన్నవాడు’ అనే భావాలను కలిగి ఉంది. ‘నీతిమంతుడు’ צדק పదకుటుంబంతో భావసంబంధాన్ని నిలుపుతుంది.
- source_word: אַל תַּהֲרֹג
  choice: చంపవద్దు
  rationale: הרג అనేది సాధారణంగా ‘చంపు’ అనే క్రియ. ‘హత్య చేయవద్దు’ అని ఉద్దేశాన్ని మరీ నిర్దిష్టం చేయకుండా, న్యాయపరమైన మరణశిక్షను కూడా సందర్భంలో చేర్చగల విస్తృతిని ‘చంపవద్దు’ నిలుపుతుంది.
- source_word: לֹא אַצְדִּיק
  choice: నిర్దోషిగా తీర్చను
  rationale: צדק యొక్క Hiphil రూపం ఇక్కడ న్యాయస్థాన సంబంధంగా ‘నీతిమంతుడని ప్రకటించు,’ ‘నిర్దోషిగా తీర్చు,’ ‘విడుదల చేయు’ అనే అర్థం ఇస్తుంది. ‘నిర్దోషిగా తీర్చను’ ఆధునిక తెలుగులో ఆ న్యాయ ప్రకటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుణ్ణి
  rationale: רָשָׁע నైతికంగా దుష్టుడైన లేదా న్యాయపరంగా దోషియైన వ్యక్తిని సూచించగలదు. ‘దుష్టుడు’ ఈ విస్తృత నైతిక-న్యాయ భావాన్ని నిలుపుతుంది; ‘దోషి’ సందర్భోచిత ప్రత్యామ్నాయం.
theological_decisions:
- issue: దేవుని ప్రకటనలోని న్యాయస్థాన సంబంధ భావం
  choice: ఎందుకంటే దుష్టుణ్ణి నేను నిర్దోషిగా తీర్చను
  alternative: ఎందుకంటే దోషిని నేను నిర్దోషిగా విడుదల చేయను
  rationale: ఈ ఆజ్ఞకు ఆధారం దేవుని స్వంత న్యాయ స్వభావం. ‘నిర్దోషిగా తీర్చను’ అనేది אַצְדִּיק లోని న్యాయ ప్రకటన భావాన్ని నిలుపుతుంది; ‘దోషిని విడుదల చేయను’ సందర్భానికి బలమైన ప్రత్యామ్నాయం అయినా, మూలంలోని צדק పదకుటుంబ సంబంధాన్ని కొంత తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయ-నైతిక శైలి ఉపయోగించబడింది. ‘వ్యవహారం’ ద్వారా మూలంలోని విస్తృత అర్థం నిలుపబడింది; ‘నిర్దోషిగా తీర్చను’ ద్వారా దేవుని ప్రకటనలోని న్యాయస్థాన భావం స్పష్టమైంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
