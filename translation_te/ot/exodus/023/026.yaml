source:
  edition: WLC
  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: te
  text: నీ దేశంలో గర్భస్రావం కలిగే స్త్రీగానీ[a], సంతానం కనలేని స్త్రీగానీ ఉండదు. నీ రోజుల సంఖ్యను నేను నింపుతాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంతానాన్ని కోల్పోయే స్త్రీ.’ హీబ్రూ పదం పిల్లలను కోల్పోవడాన్ని విస్తృతంగా సూచించగలదు; అయితే ఇక్కడ ‘సంతానం కనలేని స్త్రీ’ అనే పదంతో జతగా ఉన్నందున గర్భస్రావం లేదా ప్రసవ సమయంలో సంతాననష్టం ప్రధాన భావంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ రోజుల సంఖ్యను నేను నింపుతాను’; అంటే, ‘నీ ఆయుష్కాలాన్ని దాని పూర్తి పరిమాణానికి తీసుకువస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: గర్భస్రావం అయ్యేది
  rationale: ఈ స్త్రీలింగ రూపం సంతానాన్ని కోల్పోవడాన్ని సూచించగలదు. అయితే עֲקָרָהతో జతగా, సంతానోత్పత్తి ఆశీర్వాద సందర్భంలో ఉన్నందున ఇక్కడ గర్భం నిలవకపోవడం లేదా ప్రసవ సమయంలో సంతాననష్టం ప్రధాన భావం. ‘స్త్రీ’ అని చేర్చి పరిధిని అనవసరంగా కుదించకుండా స్త్రీలింగ భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: עֲקָרָה
  choice: గొడ్రాలు
  rationale: సంతానం కనలేని స్త్రీని సూచించే సాధారణ, సంక్షిప్త తెలుగు పదం; మూలంలోని స్త్రీలింగ ఏకవచనానికి, సంతాన ఆశీర్వాద సందర్భానికి సరిపోతుంది.
- source_word: בְּאַרְצֶךָ
  choice: నీ దేశంలో
  rationale: ఇక్కడ אֶרֶץ ఇశ్రాయేలు నివసించబోయే భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నీ దేశంలో’ సహజంగా ఉండి, నిబంధన సందర్భాన్ని నిలుపుతుంది.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: నీ రోజుల సంఖ్యను
  rationale: మూలంలోని ‘నీ రోజుల సంఖ్య’ అనే కాలవ్యవధి రూపకాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ఇది వ్యక్తికి నిర్ణయించబడిన ఆయుష్కాలాన్ని సూచిస్తుంది.
- source_word: אֲמַלֵּא
  choice: సంపూర్ణం చేస్తాను
  rationale: מלא అంటే ‘నింపు, నిండుగా చేయు.’ ‘సంపూర్ణం చేస్తాను’ అనే ప్రయోగం రోజుల నిర్ణీత సంఖ్య పూర్తిగా నెరవేరుతుందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, సంపూర్ణత రూపకాన్ని నిలుపుతుంది.
- source_word: לֹא תִהְיֶה
  choice: ఉండదు
  rationale: హీబ్రూ అస్తిత్వార్థక వాక్య నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సంతానసాఫల్య వాగ్దానం యొక్క పరిధి
  choice: ఈ వాక్యం దేశంలో ఇశ్రాయేలుకు ఇచ్చిన నిబంధన ఆశీర్వాదాన్ని—గర్భస్రావం, సంతానలేమి లేకపోవడం మరియు సంపూర్ణ ఆయుష్కాలం—ప్రకటిస్తుంది; అది ఎలా నెరవేరుతుందో చెప్పదు.
  alternative: కాలం, నిబంధన సందర్భం ఏదైనా ప్రతి విశ్వాసికీ గర్భస్రావం, సంతానలేమి లేదా అకాలమరణం ఎన్నటికీ సంభవించవనే సార్వత్రిక వ్యక్తిగత హామీ.
  rationale: తక్షణ సందర్భం దేశంలో ఇశ్రాయేలుకు యెహోవా ఇచ్చిన నిబంధన వాగ్దానాలు. కాబట్టి అనువాదం మూలానికి దగ్గరగా ఉండి, వాక్యం స్పష్టంగా చెప్పని సార్వత్రిక సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గర్భస్రావం అయ్యేది’ మూలంలోని భాగధాతు భావాన్ని, ‘గొడ్రాలు’ సాంప్రదాయ బైబిలు పదసంపదలో ఇప్పటికీ అర్థమయ్యే సంక్షిప్తతను నిలుపుతాయి. రెండో వాక్యంలో హీబ్రూ ‘రోజుల సంఖ్య’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
