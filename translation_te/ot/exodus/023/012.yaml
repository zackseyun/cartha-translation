id: EXO.23.12
reference: Exodus 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: te
  text: ఆరు రోజులు నీ పనులు చేసుకోవాలి; అయితే ఏడవ రోజున పని మానాలి[a], నీ ఎద్దు, నీ గాడిద విశ్రాంతి పొందడానికి, నీ దాసి కుమారుడూ నీతో నివసించే పరదేశీయుడూ సేదదీరడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని క్రియకు ‘ఆపాలి, విరమించాలి’ అనే ప్రాథమిక భావం ఉంది; ‘విశ్రాంతి తీసుకోవాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: కాలవ్యవధిని సూచించే సహజమైన తెలుగు ప్రయోగం; ఆజ్ఞలోని ఆరు రోజుల వ్యవధిని యథాతథంగా ఉంచుతుంది.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: నీ పనులు చేసుకోవాలి
  rationale: న్యాయనియమ సందర్భంలోని ఆజ్ఞార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; מַעֲשֶׂיךָ సూచించే విస్తృతమైన పని లేదా కార్యాల భావాన్ని కేవలం శారీరక శ్రమకు పరిమితం చేయదు.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: అయితే ఏడవ రోజున
  rationale: וְ ఇక్కడ ఆరు పని దినాలకు ఏడవ రోజును వ్యతిరేకంగా నిలుపుతుంది; ‘అయితే’ ఆ భేదాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: תִּשְׁבֹּת
  choice: పని మానాలి
  rationale: שׁבת క్రియ యొక్క ప్రాథమిక భావం ‘ఆపడం, మానడం.’ సందర్భంలో ఏది మానాలో పని అని స్పష్టంగా చెప్పడం తెలుగులో సహజం; దీనిని వ్యక్తిగత విశ్రాంతి అనే భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హీబ్రూలో ఇది ఉద్దేశాన్ని పరిచయం చేస్తుంది. తెలుగులో ముందు ఉన్న ఆజ్ఞ వల్ల కలిగే ఉద్దేశిత ఫలితాన్ని ‘అప్పుడు’ సహజంగా అనుసంధానిస్తుంది; వాక్యంలోని మానవీయ ఉద్దేశం తరువాతి క్రియల ద్వారా స్పష్టంగా ఉంటుంది.
- source_word: יָנוּחַ
  choice: విశ్రాంతి పొందుతాయి
  rationale: נוח ఇక్కడ పనిజంతువులు శ్రమనుంచి విశ్రాంతి పొందడాన్ని సూచిస్తుంది.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: నీ ఎద్దు, నీ గాడిద
  rationale: వ్యవసాయ, రవాణా పనులకు ఉపయోగించే రెండు జంతువులను ఏకవచన రూపంలోనే స్పష్టంగా అనువదిస్తుంది.
- source_word: וְיִנָּפֵשׁ
  choice: సేదదీరుతారు
  rationale: נפשׁ నిఫ్అల్ రూపం ఊపిరి పీల్చుకొని తాజాగా కావడం లేదా శక్తి పుంజుకోవడం అనే భావాన్ని ఇస్తుంది; ‘సేదదీరుతారు’ ఆధునిక తెలుగులో ఆ పునరుత్తేజ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן אֲמָתְךָ
  choice: నీ దాసి కుమారుడు
  rationale: హీబ్రూ పదబంధంలోని బంధాన్ని నేరుగా నిలుపుతుంది; అతని ఖచ్చితమైన గృహస్థితి గురించి పాఠ్యంలో లేనిదాన్ని జోడించదు.
- source_word: הַגֵּר
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: גֵּר ఇశ్రాయేలు సమాజంలో నివసిస్తూ దాని సామాజిక, న్యాయ వ్యవస్థ పరిధిలో ఉన్న స్థానికేతర వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ మాత్రమే తాత్కాలిక ప్రయాణికుడనే అపార్థం కలిగించవచ్చు కాబట్టి నివాస భావాన్ని వాక్యంలో స్పష్టం చేసింది.
theological_decisions:
- issue: శబ్బాతు నియమంలో שׁבת క్రియ భావం
  choice: పని మానాలి
  alternative: విశ్రాంతి తీసుకోవాలి
  rationale: మూల క్రియలో ప్రధానంగా పని నిలిపివేయడం అనే భావం ఉంది. తరువాతి భాగం ఆ విరమణ వల్ల జంతువులు విశ్రాంతి పొందడం, ఆధారపడినవారు సేదదీరడం అనే ఫలితాన్ని వేరుగా వివరిస్తుంది.
- issue: גֵּר అనే సామాజిక-న్యాయ పదం
  choice: మీ మధ్య నివసించే పరదేశి
  alternative: అన్యుడు / పరదేశి
  rationale: ఈ నియమం ఇచ్చే విశ్రాంతి ఇంటివారికే కాక ఇశ్రాయేలు మధ్య నివసించే స్థానికేతర, సామాజికంగా బలహీనుడైన వ్యక్తికీ వర్తిస్తుందని పాఠ్యం చెబుతుంది. ఎంపిక చేసిన రూపం అతన్ని కేవలం అపరిచితుడు లేదా ప్రయాణికుడిగా చూపదు.
- issue: בֶּן אֲמָתְךָ యొక్క సంబంధం
  choice: నీ దాసి కుమారుడు
  alternative: నీ దాసికి పుట్టిన కుమారుడు
  rationale: మూలంలోని సంబంధాన్ని నేరుగా ఉంచి, అతను స్వతంత్రుడా దాసుడా వంటి పాఠ్యం స్పష్టం చేయని సామాజిక స్థితిని నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయోపదేశ శైలి వాడబడింది. ఏకవచన సంబోధనను ‘నీ’తో నిలిపి, ‘మీ మధ్య’ను సమూహమైన ఇశ్రాయేలు మధ్య నివాసాన్ని సహజంగా సూచించేందుకు వాడాం. వాక్యాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా రెండు భాగాలుగా విభజించాం; కారణ-ఉద్దేశ సంబంధం నిలిచేలా ‘అప్పుడు’తో అనుసంధానించాం.
