id: EXO.23.8
reference: Exodus 23:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: te
  text: నీవు లంచం తీసుకోకూడదు. ఎందుకంటే లంచం స్పష్టంగా చూడగలవారిని[a] గుడ్డివారిగా చేసి, నీతిమంతుల మాటలను[b] వక్రీకరిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వివేచనగలవారిని.’ హీబ్రూ పదం చూపు రూపకాన్ని నిలుపుతూనే సరైన నిర్ణయశక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీతిమంతుల మాటలు’ అనేది న్యాయసంబంధ సందర్భంలో ‘న్యాయమైన పక్షంలో ఉన్నవారి ప్రకటనలు’ లేదా ‘వారి వ్యాజ్యం’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: లంచం
  rationale: తీర్పును ప్రభావితం చేయడానికి ఇచ్చే అవినీతికరమైన చెల్లింపును సూచించే సహజమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: לֹא תִקָּח
  choice: నీవు తీసుకోకూడదు
  rationale: న్యాయసంబంధ ఆజ్ఞలోని నిషేధార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; לקח యొక్క ‘తీసుకొను’ భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే హీబ్రూ సంధానపదం యొక్క వివరణాత్మక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְעַוֵּר
  choice: గుడ్డివారిగా చేసి
  rationale: కారణార్థకమైన ‘గుడ్డివారిగా చేయు’ అనే భావాన్నీ, న్యాయవివేచన చెడిపోవడాన్ని సూచించే దృష్టి రూపకాన్నీ కాపాడుతుంది.
- source_word: פִּקְחִים
  choice: స్పష్టంగా చూడగలవారిని
  rationale: చూపు అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, సందర్భంలో సరైన వివేచనగలవారనే సూచనను కూడా అందిస్తుంది.
- source_word: וִיסַלֵּף
  choice: వక్రీకరిస్తుంది
  rationale: మాటలను లేదా న్యాయవాదాన్ని తారుమారు చేయడం అనే భావాన్ని గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דִּבְרֵי
  choice: మాటలను
  rationale: ‘మాటలు, ప్రకటనలు, విషయాలు’ అనే విస్తృత హీబ్రూ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది; న్యాయపరమైన సందర్భం సాక్ష్యం లేదా వాదన అనే భావాన్ని సూచించగలదు.
- source_word: צַדִּיקִים
  choice: నీతిమంతుల
  rationale: నైతికంగా నీతిగలవారు లేదా న్యాయవివాదంలో సరి అయిన పక్షంలో ఉన్నవారు అనే రెండు సాధ్యమైన భావాలనూ తెరిచి ఉంచుతుంది.
