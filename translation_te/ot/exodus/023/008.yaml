  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి వాడబడింది. రెండవ పురుష ఏకవచన నిషేధరూపం నిలుపబడింది. చూపు రూపకం ప్రధాన పాఠ్యంలో కాపాడబడి, దాని వివేచనార్థం పాదసూచికలో ఇవ్వబడింది.
