  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: te
  text: పేదవాడి వ్యాజ్యంలో అతనిపట్ల పక్షపాతం చూపకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని వ్యాజ్యంలో పేదవాడికి గౌరవం చూపకూడదు.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “గౌరవించు” అనే అర్థం ఉండవచ్చు; అయితే ఈ న్యాయసందర్భంలో అది అనుచితమైన అనుకూలత లేదా పక్షపాతం చూపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָל
  choice: పేదవాడు
  rationale: ఈ పదం ఆర్థికంగా లేదా సామాజికంగా అణకువ స్థితిలో ఉన్న వ్యక్తిని సూచిస్తుంది. హీబ్రూ ఏకవచనాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే ‘పేదవాడు’ను ఎంచుకున్నాం.
- source_word: תֶהְדַּר
  choice: పక్షపాతం చూపు
  rationale: క్రియకు అక్షరార్థంగా ‘గౌరవించు’ అనే భావం ఉండవచ్చు; అయితే న్యాయసంబంధ సందర్భంలో ఒకరి వైపు మొగ్గి అనుకూలంగా వ్యవహరించడాన్ని సూచిస్తుంది. అందువల్ల ‘పక్షపాతం చూపు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּרִיבוֹ
  choice: అతని వ్యాజ్యంలో
  rationale: רִיב న్యాయవివాదం, కేసు లేదా వ్యాజ్యాన్ని సూచించగలదు. చుట్టుపక్కల న్యాయనియమాల సందర్భంలో ‘వ్యాజ్యం’ సరిపోతుంది; ప్రత్యయం మూడవ పురుష ఏకవచనాన్ని ‘అతని’గా తెలిపాం.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: హీబ్రూ సంధాయకం ముందున్న నియమంతో ఈ వాక్యాన్ని కలుపుతుంది. తెలుగులో విడి వచనంగా సహజంగా ఉండేందుకు ‘మరియు’ను బలవంతంగా చేర్చకుండా అనుసంధాన భావాన్ని వాక్యక్రమంలోనే ఉంచాం.
- source_word: לֹא
  choice: చూపకూడదు
  rationale: అసంపూర్ణ క్రియతో కూడిన לֹא న్యాయనియమంలోని నిషేధాన్ని వ్యక్తం చేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘చూపకూడదు’ ఆ నిషేధాన్ని సహజంగా, గంభీరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పేదవాడిపట్ల కరుణ చూపడం మరియు న్యాయస్థానంలో పక్షపాతం చూపడం మధ్య తేడా
  choice: ఈ వచనం పేదవాడి వ్యాజ్యంలో అతని పక్షాన అన్యాయంగా మొగ్గుచూపడాన్ని నిషేధిస్తుంది.
  alternative: ఈ వచనం సాధారణంగా పేదవాడిని గౌరవించవద్దని ఆజ్ఞాపిస్తుంది.
  rationale: ‘అతని వ్యాజ్యంలో’ అనే పదబంధం మరియు సమీప న్యాయసందర్భం ఈ నిషేధాన్ని న్యాయనిర్ణయంలోని పక్షపాతానికి పరిమితం చేస్తాయి. పేదలపట్ల కరుణను నిరాకరించే విస్తృత భావాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ఏకవచన వ్యక్తి సూచనను నిలిపి, న్యాయసందర్భాన్ని స్పష్టపరచడానికి ‘వ్యాజ్యం’ను ఎంచుకున్నాం. ‘పక్షపాతం చూపు’ ద్వారా సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ‘గౌరవించు’ అనే అక్షరార్థ అవకాశాన్ని పాదటిప్పణిలో సంరక్షించాం.
