id: EXO.23.4
reference: Exodus 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: te
  text: నీ శత్రువుకు చెందిన ఎద్దుగానీ గాడిదగానీ దారితప్పి తిరుగుతూ నీకు ఎదురైతే,[a] దానిని తప్పకుండా అతనికి తిరిగి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ శత్రువుకు చెందిన ఎద్దుగానీ గాడిదగానీ దారితప్పి తిరుగుతూ నీకు ఎదురైనప్పుడు.”
    reason: כִּי అనే పదాన్ని ఈ న్యాయ సందర్భంలో షరతుగా ‘అయితే’ అనీ, కాలసూచకంగా ‘అప్పుడు’ అనీ గ్రహించవచ్చు; תֹּעֶהకు ‘దారితప్పి తిరుగుతూ’ అనే కొనసాగుతున్న భావం ఉంది.
lexical_decisions:
- source_word: כִּי
  choice: ఎదురైతే
  rationale: న్యాయవిధిలోని షరతును తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘అయితే’ భావాన్ని క్రియతో కలిపి ఇచ్చాం; సందర్భానుసారంగా ‘ఎదురైనప్పుడు’ అనే అర్థమూ సాధ్యమే.
- source_word: תִפְגַּע
  choice: నీకు ఎదురైతే
  rationale: పגע ఇక్కడ అనుకోకుండా ఎదురుపడడం లేదా కనబడడం అనే భావాన్ని ఇస్తుంది; ‘నీకు ఎదురైతే’ ఆ సందర్భికతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: వ్యవసాయ సందర్భంలోని గోవర్గపు జంతువును సూచించే సాధారణ, నిర్దిష్ట తెలుగు పదం.
- source_word: אֹיִבְךָ
  choice: నీ శత్రువుకు చెందిన
  rationale: మూలంలోని ‘నీ శత్రువు’ అనే పదునైన సంబంధాన్ని ‘పొరుగువాడు’ వంటి మృదువైన పదంతో మార్చకుండా యథాతథంగా ఉంచుతుంది.
- source_word: חֲמֹרוֹ
  choice: గాడిద
  rationale: חֲמוֹרకు ఆధునిక తెలుగులో స్పష్టమైన సాధారణ సమానార్థకం ‘గాడిద’; యజమాన్య భావం ముందున్న ‘నీ శత్రువుకు చెందిన’ అనే నిర్మాణంలో రెండు జంతువులకూ వర్తిస్తుంది.
- source_word: תֹּעֶה
  choice: దారితప్పి తిరుగుతూ
  rationale: తన సరైన దారి నుండి తొలగి సంచరిస్తున్న జంతువు అనే కృదంత భావాన్ని వ్యక్తం చేస్తుంది; పూర్తిగా పోయిందని అతివ్యాఖ్యానించదు.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: దానిని తప్పకుండా ... తిరిగి తీసుకెళ్లాలి
  rationale: అనంతక్రియతో కూడిన పరిమిత క్రియ కలిగించే బలమైన ఆజ్ఞను ‘తప్పకుండా’ ద్వారా, తిరిగి చేర్చే చర్యను ‘తిరిగి తీసుకెళ్లాలి’ ద్వారా తెలిపాం.
- source_word: לוֹ
  choice: అతని దగ్గరకు
  rationale: సర్వనామం శత్రువైన యజమానిని తిరిగి సూచిస్తుంది; ‘యజమాని దగ్గరకు’ అని వివరణాత్మకంగా మార్చకుండా పురుష సర్వనామ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: శత్రువు పట్ల నైతిక బాధ్యత
  choice: ‘నీ శత్రువు’ అనే స్పష్టమైన పదాన్ని ఉంచి, అతని దారితప్పిన జంతువును తిరిగి అప్పగించాలనే ఆజ్ఞగా అనువదించాం.
  alternative: ‘నీ పొరుగువాడు’ లేదా ‘నిన్ను ద్వేషించేవాడు’
  rationale: హీబ్రూ మూలం స్పష్టంగా ‘నీ శత్రువు’ అని చెబుతుంది. విరోధి పట్ల కూడా న్యాయం, ఆచరణాత్మక దయ చూపాలనే ఉద్వేగాన్ని మృదువుచేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ధర్మశాసన ఆజ్ఞకు తగిన గంభీరతతో రూపొందించాం. ‘తప్పకుండా’ మూలంలోని బలపరిచిన ఆజ్ఞను తెలియజేస్తుంది; ‘శత్రువు’ అనే నైతిక ఉద్వేగాన్ని యథాతథంగా ఉంచాం.
