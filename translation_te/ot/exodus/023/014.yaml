  naturalness: ‘పండుగను ఆచరించాలి’ is more idiomatic and grammatically complete than the unmarked object ‘పండుగ ఆచరించాలి.’ The revised wording retains a concise modern-standard Telugu legal register.
  terminology: ‘పండుగను ఆచరించాలి’ appropriately conveys חגג without importing a particular denominational interpretation. The footnote accurately preserves the literal lexical image and identifies the idiom as referring to the annual pilgrimage-festival occasions.
