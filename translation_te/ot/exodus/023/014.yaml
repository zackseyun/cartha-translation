    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: మూడుసార్లు
  rationale: అక్షరార్థంగా ‘మూడు పాదాలు’ అయిన ఈ హీబ్రూ నుడికారం, సంవత్సరంలోని మూడు యాత్రా-పండుగ సందర్భాలను సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో సహజమైన అర్థాన్ని ఇస్తూ, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תָּחֹג
  choice: పండుగ ఆచరించాలి
  rationale: חגג అనే క్రియ పండుగను జరపడం లేదా ఆచరించడం అనే ఆరాధనాపరమైన భావాన్ని కలిగి ఉంది. ‘పండుగ ఆచరించాలి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, ధర్మశాసన ఆజ్ఞ స్వరాన్ని నిలుపుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: ఈ పండుగ యెహోవా వైపు ఉద్దేశించబడిందని సూచించే హీబ్రూ సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: בַּשָּׁנָה
  choice: సంవత్సరంలో
  rationale: హీబ్రూ పదబంధమైన ‘ఆ సంవత్సరంలో/సంవత్సరంలో’ అనే రూపానికి సమీపంగా ఉంటూ, ‘మూడుసార్లు’తో తెలుగులో సహజంగా కలుస్తుంది.
