  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ధర్మశాసన శైలి. ‘జరుపుకోవాలి’ కంటే ‘ఆచరించాలి’ పండుగకు సంబంధించిన ఆరాధనాపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
