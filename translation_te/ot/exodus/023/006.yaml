id: EXO.23.6
reference: Exodus 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א תַטֶּ֛ה מִשְׁפַּ֥ט אֶבְיֹנְ/ךָ֖ בְּ/רִיבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/006.yaml
  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: te
  text: నీ పేదవాడి వ్యాజ్యంలో అతనికి దక్కవలసిన న్యాయాన్ని వక్రీకరించకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ పేదవాడి దావాలో అతనికి న్యాయాన్ని నిరాకరించకూడదు.”
    reason: ‘వక్రీకరించు’ అనే క్రియను సందర్భానుసారంగా ‘న్యాయాన్ని నిరాకరించు’ అని, רִיבను ‘దావా’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: לֹא
  choice: వక్రీకరించకూడదు
  rationale: న్యాయసంబంధమైన నిషేధాన్ని ఆధునిక తెలుగు శాసనశైలిలో సహజంగా తెలిపే నిషేధరూపం.
- source_word: תַטֶּה
  choice: వక్రీకరించు
  rationale: హిఫీల్ రూపంలోని ‘వంచు, పక్కకు మళ్లించు’ అనే న్యాయపరమైన భావాన్ని, తీర్పును అన్యాయంగా మార్చడంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִשְׁפַּט
  choice: అతనికి దక్కవలసిన న్యాయం
  rationale: ఇక్కడ భావం కేవలం న్యాయం అనే సూత్రం మాత్రమే కాక, ఆ పేదవానికి న్యాయవిచారణలో రావలసిన న్యాయమైన హక్కు లేదా తీర్పు; తెలుగులో దీన్ని సహజంగా స్పష్టం చేశాం.
- source_word: אֶבְיֹנְךָ
  choice: నీ పేదవాడు
  rationale: אֶבְיוֹן అంటే పేద లేదా అవసరంలో ఉన్న వ్యక్తి. రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’గా, మూలంలోని ఏకవచన వ్యక్తి సూచనను ‘పేదవాడు’గా నిలిపాం.
- source_word: בְּרִיבוֹ
  choice: అతని వ్యాజ్యంలో
  rationale: רִיב ఇక్కడ న్యాయపరమైన వివాదం లేదా దావాను సూచిస్తుంది. ‘వ్యాజ్యం’ న్యాయస్థాన సందర్భాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ ఆజ్ఞ పేదవానికి అనుకూలంగా పక్షపాతం చూపవద్దని చెబుతోందా, లేక అతనికి వ్యతిరేకంగా న్యాయాన్ని వక్రీకరించవద్దని చెబుతోందా?
  choice: పేదవానికి న్యాయవిచారణలో దక్కవలసిన న్యాయాన్ని వక్రీకరించవద్దనే నిషేధం.
  alternative: ‘పేదవానికి న్యాయాన్ని నిరాకరించవద్దు’ అని సాధారణంగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యంలో מִשְׁפַּט వక్రీకరించబడే కర్మగా ఉంది; אֶבְיֹנְךָ ఆ న్యాయం దక్కవలసిన పేదవాణ్ణి, בְּרִיבוֹ న్యాయవివాద సందర్భాన్ని సూచిస్తున్నాయి. అందువల్ల న్యాయస్థాన సంబంధమైన దృష్టిని అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయశైలిని పాటించాం. ‘వ్యాజ్యం’ న్యాయపరమైన సందర్భాన్ని కాపాడుతుంది; ‘అతనికి దక్కవలసిన’ అనే పదబంధం מִשְׁפַּט యొక్క వ్యక్తికి చెందవలసిన న్యాయం అనే భావాన్ని సహజంగా వెల్లడిస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా చేర్చబడింది.
