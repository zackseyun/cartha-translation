  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽא תִזְבַּ֥ח עַל חָמֵ֖ץ דַּם זִבְחִ֑/י וְ/לֹֽא יָלִ֥ין חֵֽלֶב חַגִּ֖/י עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: te
  text: నా బలి రక్తాన్ని పులిసిన దేనితోనూ అర్పించకూడదు[a]; నా పండుగకు చెందిన కొవ్వు ఉదయం వరకు మిగిలి ఉండకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పులిసిన పదార్థం మీద’ లేదా ‘పులిసిన పదార్థంతో.’ హెబ్రీలోని విభక్త్యర్థ పదం అక్షరార్థంగా ‘మీద’ అని ఉన్నా, ఈ బలి సందర్భంలో పులిసిన పదార్థంతో కలిపి లేదా దానితో అనుబంధించి అర్పించరాదనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కొవ్వు’ అంటే బలిలో అర్పించే కొవ్వు భాగాలు కావచ్చు.
    reason: clarification
lexical_decisions:
- source_word: תִזְבַּח
  choice: అర్పించకూడదు
  rationale: זבח అనే క్రియకు బలి అర్పించడం అనే ఆరాధనా సందర్భార్థం ఉంది. לֹא తో కూడిన రెండవ పురుష ఏకవచన న్యాయనిషేధాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే రూపం ఇది.
- source_word: עַל חָמֵץ
  choice: పులిసిన దేనితోనూ
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, ఇక్కడ బలిని పులిసిన పదార్థంతో అనుబంధించి అర్పించరాదనే భావం సహజం. ‘దేనితోనూ’ అనేది חָמֵץ యొక్క పదార్థసంబంధ విస్తృతిని తెలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: דַּם זִבְחִי
  choice: నా బలి రక్తాన్ని
  rationale: మూలంలోని నిర్మిత పదబంధాన్నీ మొదటి పురుష ఏకవచన ప్రత్యయాన్నీ నిలుపుతూ, రక్తమే క్రియకు ప్రత్యక్ష కర్మ అని స్పష్టంగా ఉంచుతుంది.
- source_word: יָלִין
  choice: మిగిలి ఉండకూడదు
  rationale: לין అంటే రాత్రంతా ఉండడం లేదా రాత్రి గడపడం. עַד בֹּקֶר ఇప్పటికే ‘ఉదయం వరకు’ అని కాలపరిమితిని తెలుపుతున్నందున తెలుగులో అనవసర పునరుక్తి లేకుండా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: మూలపదం బలి జంతువు కొవ్వును సూచిస్తుంది. ‘శ్రేష్ఠ భాగం’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారించి ప్రత్యక్ష పదార్థాన్ని నిలుపుతుంది.
- source_word: חַגִּי
  choice: నా పండుగకు చెందిన
  rationale: חַג అనేది పవిత్ర పండుగ లేదా యాత్రోత్సవం. మొదటి పురుష ప్రత్యయాన్ని నిలుపుతూ, తెలుగులో ‘నా పండుగ కొవ్వు’ అనే అసహజ లేదా సందిగ్ధ నిర్మాణాన్ని నివారించేందుకు సంబంధార్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాలపరిమితిని తెలిపే ఈ హెబ్రీ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: ‘నా బలి,’ ‘నా పండుగ’లోని మొదటి పురుష ప్రత్యయాల సూచన
  choice: దైవ వాక్యంలోని మొదటి పురుష స్వామ్యాన్ని ‘నా’ అని నిలుపడం
  alternative: ‘నాకు అర్పించే బలి,’ ‘యెహోవా పండుగ’
  rationale: హెబ్రీలో మొదటి పురుష ప్రత్యయాలు స్పష్టంగా ఉన్నాయి. వాటిని వివరణాత్మక పరామర్శలుగా మార్చకుండా దేవుని ప్రత్యక్ష వాక్యంలోని స్వామ్యభావాన్ని నిలుపుతుంది.
- issue: חַגִּי తో חֵלֶב యొక్క సంబంధం
  choice: ‘నా పండుగకు చెందిన కొవ్వు’
  alternative: ‘నా పండుగ బలి కొవ్వు’
  rationale: మూలం ‘బలి’ అనే పదాన్ని రెండవ భాగంలో మళ్లీ చెప్పదు. సందర్భం బలికొవ్వును సూచించినప్పటికీ, ఆ పదాన్ని ప్రధాన వచనంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, కొంత అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయవాక్య శైలి వాడబడింది. హెబ్రీ రెండవ పురుష ఏకవచనాన్ని తెలుగు నిషేధాత్మక విధిరూపం సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన వచనంలోని ప్రతి పాదసూచిక గుర్తుకు అనుగుణమైన పాదసూచిక ఇవ్వబడింది.
