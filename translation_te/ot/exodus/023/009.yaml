id: EXO.23.9
reference: Exodus 23:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: te
  text: పరదేశవాసిని[a] అణచివేయవద్దు; పరదేశవాసి మనసు మీకు తెలుసు[b], ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశవాసులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విదేశీయుణ్ణి,’ ‘వలసవాసిని,’ లేదా ‘పరదేశిని.’ హెబ్రీ గేర్ (גֵר) ఒక సమాజం మధ్య స్థానికుడు కాకుండా నివసించే వ్యక్తిని సూచిస్తుంది; అతడు తరచుగా సామాజికంగా బలహీన స్థితిలో ఉండేవాడు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పరదేశవాసి యొక్క నెఫెష్ (נֶפֶשׁ) మీకు తెలుసు.’ ఇది పరదేశవాసి అంతరంగ అనుభవాన్ని లేదా అతని జీవనస్థితిని స్వానుభవంతో తెలుసుకోవడాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: పరదేశిగా నివసించేవాడు
  rationale: ఈ పదం కేవలం ప్రయాణికుణ్ణి కాక, స్వదేశం కాని సమాజంలో నివసించే వ్యక్తిని—తరచుగా సామాజికంగా బలహీన స్థితిలో ఉన్నవాణ్ణి—సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ నివాసస్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִלְחָץ
  choice: అణచివేయకూడదు
  rationale: న్యాయసంబంధ సందర్భంలో ఈ క్రియ బలవంతపు ఒత్తిడి, దోపిడీ, అణచివేత అనే భావాన్ని కలిగి ఉంది; ‘అణచివేయు’ ఆ సామాజిక-నైతిక బలాన్ని అందిస్తుంది.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: మీకే తెలుసు
  rationale: స్పష్టంగా ఉన్న וְאַתֶּם ఇచ్చే ఉద్ఘాటనను ‘మీకే’ నిలుపుతుంది; పరిపూర్ణ క్రియ ఇశ్రాయేలీయుల అనుభవపూర్వక జ్ఞానాన్ని సూచిస్తుంది.
- source_word: נֶפֶשׁ
  choice: మనస్థితి
  rationale: ఈ ప్రయోగంలో נֶפֶשׁ విడిగా ఉన్న ‘ఆత్మ’ అనే తాత్త్విక భావం కంటే, పరదేశిగా జీవించే వ్యక్తి అంతరంగ అనుభవం లేదా జీవనస్థితిని సూచిస్తుంది. ‘మనస్థితి’ తెలుగు పాఠకునికి సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; అక్షరార్థం పాదసూచికలో ఉంచబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు ఆధారమైన కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: גֵרִים הֱיִיתֶם
  choice: మీరు పరదేశులుగా నివసించారు
  rationale: మొదటి גֵר తో పదసంబంధాన్ని నిలుపుతూ, ఐగుప్తులో వారి దీర్ఘకాల పరదేశ నివాసస్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: హీబ్రూ వాక్యంలోని ‘ఐగుప్తు దేశంలో’ అనే రూపాన్ని, దాని న్యాయశైలి గంభీరతను నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలో גֵר పదానికి అనువాదం
  choice: పరదేశిగా నివసించేవాడు / పరదేశులు
  alternative: విదేశీయుడు; పరాయి వ్యక్తి; వలసవాసి
  rationale: ఈ వాక్యం ఐగుప్తులో ఇశ్రాయేలీయుల స్వీయ పరదేశ నివాసానుభవాన్ని ఆధారంగా చేసుకొని బలహీన స్థితిలో ఉన్న నివాసిని అణచవద్దని చెబుతుంది. ఎంచుకున్న రూపం జాతి గుర్తింపుకే పరిమితం కాకుండా సామాజిక, నివాస సంబంధ భావాన్ని కాపాడుతుంది.
- issue: נֶפֶשׁ యొక్క భావం
  choice: మనస్థితి
  alternative: ప్రాణం; ఆత్మ; జీవనానుభవం
  rationale: ఇక్కడ ఉద్దేశం మానవ స్వరూపంలోని వేరు భాగంపై సిద్ధాంత ప్రకటన చేయడం కాదు; పరదేశిగా ఉన్నవాని అంతరంగ, అనుభవపూర్వక స్థితిని తెలుసుకోవడం. అందువల్ల శరీర–ఆత్మ ద్వైతాన్ని అనవసరంగా దిగుమతి చేయకుండా సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవాక్యానికి తగిన గంభీరతతో కూడిన సహజమైన శైలి. ‘పరదేశిగా నివసించేవాడు’ అనే వివరణాత్మక రూపం గేర్ పదంలోని నివాస, సామాజిక భావాలను నిలుపుతుంది. రెండో వాక్యంలో ‘మీకే’ ద్వారా మూలంలోని ఉద్ఘాటన వ్యక్తమైంది; ‘మనస్థితి’ ద్వారా నెఫెష్ యొక్క సందర్భోచిత అంతరంగ/అనుభవ భావం అందించబడింది.
