revisions:
- from: పరదేశిగా నివసించేవాణ్ణి[a] అణచివేయకూడదు. పరదేశిగా నివసించేవాని మనస్థితి మీకే తెలుసు[b]; ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశులుగా నివసించారు.
  to: పరదేశవాసిని[a] అణచివేయవద్దు; పరదేశవాసి మనసు మీకు తెలుసు[b], ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశవాసులుగా ఉన్నారు.
  rationale: సురక్షితమైన శైలీ-ఖచ్చితత్వ సవరణగా గֵרకు స్థిరమైన ‘పరదేశవాసి’ని ఉపయోగించాం; మూలంలో లేని ‘మాత్రమే’ భావాన్ని కలిగించే ‘మీకే’ను తొలగించాం; మరియు నֶפֶשׁ యొక్క సందర్భోచిత ప్రయోగార్థాన్ని సహజంగా ప్రతిబింబించేందుకు ‘మనసు’ను వాడాం. అర్థం, కారణసంబంధం, మరియు పాదసూచిక గుర్తులు యథాతథంగా కాపాడబడ్డాయి.
