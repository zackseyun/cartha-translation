base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: te
  text: ఒకే సంవత్సరంలో వారిని నీ ఎదుటనుండి వెళ్లగొట్టను[a]; లేకపోతే భూమి నిర్జనమైపోతుంది, అడవి జంతువులు నీకు ముప్పుగా విపరీతంగా పెరుగుతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘వారిని’ అనే కర్మ ప్రత్యయం రూపరీత్యా ఏకవచనంలో ఉంది; అది ఇక్కడ దేశ నివాసులను సమూహంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అడవి జంతువులు’ అనే మాటను ‘పొలప్రాంతపు అడవి జంతువులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: వారిని ... వెళ్లగొట్టను
  rationale: גרש అంటే వెళ్లగొట్టు లేదా తరిమివేయు. కర్మ ప్రత్యయం రూపరీత్యా ఏకవచనమైనా, సందర్భంలో అది ముందుగా ప్రస్తావించిన ప్రజలను సమూహార్థంగా సూచిస్తుంది; తెలుగులో ‘వారిని’ అనడం అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటనుండి
  rationale: హీబ్రూ నుడికారంలోని స్థలసంబంధ భావాన్ని దగ్గరగా నిలుపుతూ, సహజమైన తెలుగును ఇస్తుంది.
- source_word: בְּשָׁנָה אֶחָת
  choice: ఒకే సంవత్సరంలో
  rationale: ఒక్క సంవత్సరపు కాలపరిమితిలోనే అనే భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶּן
  choice: అలా చేస్తే ... కావచ్చు
  rationale: פן తెలియజేసే నివారించవలసిన ప్రతికూల పరిణామాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: దేశం నిర్జనమైపోయి
  rationale: שְׁמָמָה లోని జనరహితమైన, పాడుబడిన స్థితి భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְרַבָּה עָלֶיךָ
  choice: నీకు ముప్పుగా విపరీతంగా పెరిగిపోవచ్చు
  rationale: רבה యొక్క పెరుగుదల భావాన్నీ, עליך వల్ల సందర్భంలో వ్యక్తమయ్యే ప్రతికూల ప్రభావాన్నీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: అడవి జంతువులు
  rationale: ఈ పదబంధం పొలప్రాంతాల్లో సంచరించే వన్య ప్రాణులను సూచిస్తుంది; ‘అడవి జంతువులు’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: ఏకవచన కర్మ ప్రత్యయం యొక్క సమూహార్థం
  choice: వారిని
  alternative: అతణ్ణి
  rationale: హీబ్రూలో ప్రత్యయం ఏకవచనమైనా సందర్భం కనాను నివాసులను సమూహంగా సూచిస్తుంది. తెలుగులో ఏకవచనం వ్యక్తిగత పురుషుణ్ణి సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు; అందువల్ల ప్రధాన పాఠంలో సమూహార్థాన్ని ఇచ్చి, రూప సంబంధమైన విషయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. కారణ–పరిణామ సంబంధాన్ని సహజ తెలుగులో స్పష్టపరుస్తూ, హీబ్రూ పాఠంలోని సమూహార్థ ఏకవచనాన్ని పాదసూచికలో సంరక్షించాం.
