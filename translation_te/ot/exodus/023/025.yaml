  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వేను మీరు సేవించాలి. ఆయన మీ ఆహారాన్ని[a], మీ నీటిని ఆశీర్వదిస్తాడు; నేను మీ మధ్యనుండి వ్యాధిని తొలగిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మీ రొట్టెను’; ఇక్కడ అది ఆహారానికి లేదా అవసరమైన సమకూర్పుకు ప్రతినిధిగా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: మీరు సేవించాలి
  rationale: עבד దేవునికి చేసే ఆరాధనతో కూడిన నిబంధనాపరమైన సేవను సూచిస్తుంది. ‘సేవించాలి’ అనే పదం కేవలం ఆరాధనకే పరిమితం కాకుండా దాని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: ఇక్కడ אֱלֹהִים ఏకవచనార్థంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וּבֵרַךְ
  choice: ఆయన ... ఆశీర్వదిస్తాడు
  rationale: ఆజ్ఞను అనుసరించే వాగ్దాన ఫలితంగా ఈ రూపం భవిష్యదర్థాన్ని ఇస్తుంది. హీబ్రూలో అంతర్భావంగా ఉన్న కర్తను తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: לַחְמְךָ
  choice: మీ ఆహారాన్ని
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ ప్రాథమిక ఆహార సరఫరికి ప్రతినిధిగా వాడబడింది. ఆధునిక తెలుగులో ఉద్దేశిత విస్తృత భావాన్ని ‘ఆహారం’ సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מֵימֶיךָ
  choice: మీ నీటిని
  rationale: מַיִם రూపంలో బహువచనమైనప్పటికీ సమూహవాచకంగా నీటిని సూచిస్తుంది; తెలుగులో ఏకవచన రూపమే సహజం.
- source_word: וַהֲסִרֹתִי
  choice: నేను ... తొలగిస్తాను
  rationale: హిఫీల్ రూపం ‘తీసివేయడం, తొలగించడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది. మొదటి పురుష కర్త మార్పును యథాతథంగా నిలిపాం.
- source_word: מַחֲלָה
  choice: వ్యాధిని
  rationale: מַחֲלָה అనారోగ్యం లేదా వ్యాధిని సూచిస్తుంది. ‘వ్యాధి’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన, విస్తృత పదం.
- source_word: מִקִּרְבֶּךָ
  choice: మీ మధ్యనుండి
  rationale: ఈ పదబంధం వ్యక్తి శరీరంలోనుండి మాత్రమే కాక సమాజం మధ్యనుండి తొలగించడాన్ని సూచిస్తుంది; ‘మీ మధ్యనుండి’ ఆ సామూహిక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదును పెట్టకుండా నామాన్ని నిలిపి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణమైన ‘యాహ్వే’ కూడా సాధ్యమైన రూపం.
- issue: రెండవ పురుష వచన మార్పు
  choice: తెలుగులో గౌరవ/బహువచన ‘మీరు, మీ’ రూపాలతో సామూహిక సంబోధన
  alternative: మొదటి క్రియలో బహువచనం, తరువాతి స్వామ్యరూపాల్లో ఏకవచన భేదాన్ని కృత్రిమంగా చూపడం
  rationale: హీబ్రూ వాక్యం మొదట 2వ పురుష బహువచన క్రియను, తరువాత ఏకవచన స్వామ్యప్రత్యయాలను ఉపయోగించి ఇశ్రాయేలును సమష్టిగా సంబోధిస్తుంది. తెలుగులో ‘మీరు/మీ’ ఈ సామూహిక భావాన్ని సహజంగా మోస్తాయి.
- issue: దైవ కర్తలో మూడవ పురుషం నుండి మొదటి పురుషానికి మార్పు
  choice: ‘ఆయన ... ఆశీర్వదిస్తాడు; నేను ... తొలగిస్తాను’ అనే మార్పును నిలుపడం
  alternative: రెండు క్రియలకూ ఒకే పురుషాన్ని ఉపయోగించి సరిచేయడం
  rationale: మూలపాఠంలో וּבֵרַךְ అనే మూడవ పురుష రూపం తరువాత וַהֲסִרֹתִי అనే మొదటి పురుష రూపం వస్తుంది. ఈ ఉద్వేగభరిత వ్యాకరణ మార్పును సమతలీకరించకుండా అనువాదంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. నిబంధనాపరమైన ‘సేవ’ భావాన్ని, సామూహిక సంబోధనను, అలాగే ‘ఆయన’ నుండి ‘నేను’కు మూలంలో ఉన్న కర్త మార్పును నిలిపాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
