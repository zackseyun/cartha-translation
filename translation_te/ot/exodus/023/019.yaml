  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: te
  text: నీ నేలలోని ప్రథమఫలాల్లో మొదటివాటిని[a] నీ దేవుడైన యాహ్వే గృహానికి తీసుకురావాలి. మేకపిల్లను[b] దాని తల్లి పాలలో ఉడికించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ భూమి ప్రథమఫలాలను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘గెదీ’; సాధారణంగా చిన్న మేకను, అంటే మేకపిల్లను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ప్రథమ ఫలాల్లో మొదటివాటిని
  rationale: రֵאשִׁית మరియు בִּכּוּרֵי కలసి వ్యక్తపరచే ‘ప్రథమ ఫలాల్లో మొదటి భాగం’ అనే భావాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: אַדְמָתְךָ
  choice: నీ నేల
  rationale: సాగుచేసే నేల లేదా మట్టిని సూచించే వ్యవసాయ సంబంధమైన స్పష్టతను కాపాడుతుంది; విస్తృతమైన భూభాగం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: תָּבִיא
  choice: తీసుకురావాలి
  rationale: హిఫిల్ క్రియకు ఉన్న ‘తీసుకురా’ అనే అర్థాన్నీ, ధర్మశాసన ఆజ్ఞకు ఉన్న నిర్దేశక బలాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా గృహం
  rationale: בַּיִת‌ను ‘గృహం’గా అనువదించడం ద్వారా తరువాతి కాలపు ఆలయ నిర్మాణాన్ని ముందుగానే పాఠ్యంలోకి తేవకుండా ఆరాధనా స్థల భావాన్ని నిలుపుతుంది; יְהוָהను వ్యక్తిగత దైవనామమైన ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: לֹא תְבַשֵּׁל
  choice: ఉడికించకూడదు
  rationale: בשל యొక్క నిర్దిష్టమైన ఉడికించడం/వండడం అనే అర్థంలో, పాలలో చేసే చర్యకు ‘ఉడికించు’ అత్యంత సహజంగా సరిపోతుంది; నిషేధ బలాన్ని ‘కూడదు’ తెలియజేస్తుంది.
- source_word: גְּדִי
  choice: మేకపిల్ల
  rationale: ఈ పదానికి సాధారణంగా ఉన్న చిన్న మేక అనే అర్థాన్ని ఆధునిక తెలుగు పాఠకునికి నేరుగా, సందిగ్ధత లేకుండా అందిస్తుంది.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: దాని తల్లి పాలలో
  rationale: హీబ్రూ సంబంధాన్ని, ఏ జంతువు తల్లి పాలో అదే ఉద్దేశించబడిందనే చిత్రణను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: మేకపిల్లను దాని తల్లి పాలలో ఉడికించవద్దనే నిషేధానికి కారణం
  choice: పాఠ్యంలో ఉన్న నిర్దిష్ట నిషేధాన్ని మాత్రమే అనువదించడం
  alternative: కనానీయ ఆచారం, క్రూరత్వం లేదా ఆహార విభజనకు సంబంధించిన వివరణను అనువాదంలో చేర్చడం
  rationale: హీబ్రూ వాక్యం నిషేధానికి కారణం చెప్పదు. కాబట్టి దాని చారిత్రక లేదా ఆచార సంబంధమైన ఉద్దేశాన్ని అనువాదం స్వయంగా నిర్ణయించకుండా అసలు పాఠ్యంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ధర్మశాసన శైలి వాడబడింది. ‘గృహం’ అనే పదం గుడారం/పరిశుద్ధస్థలం నుంచి తరువాతి ఆలయం వరకు వర్తించే మూలపాఠపు విస్తృతిని కాపాడుతుంది. మొదటి వాక్యంలోని రֵאשִׁית־בִּכּוּרֵי పదబంధపు పునరుక్తిని ‘ప్రథమ ఫలాల్లో మొదటివాటిని’గా ఉద్దేశపూర్వకంగా నిలిపాం.
