  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: te
  text: నేను మీకు చెప్పినవాటన్నిటి విషయంలో జాగ్రత్తగా ఉండండి. ఇతర దేవుళ్ల పేరును ప్రస్తావించకండి[a]; అది మీ నోటి నుండి వినబడకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, “ఇతర దేవుళ్ల పేరును ఆహ్వానించకండి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అది నీ నోటి మీద వినబడకూడదు.” హీబ్రూలో ఇక్కడ “నీ” ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: నేను మీతో చెప్పిన ప్రతిదాని విషయంలో
  rationale: בְכֹל అనే విస్తృత పరిధిని ‘ప్రతిదాని విషయంలో’ సహజంగా తెలియజేస్తుంది; ముందుగా చెప్పిన ఆజ్ఞలన్నిటినీ సూచించే సంబంధవాక్యాన్ని కూడా నిలుపుతుంది.
- source_word: תִּשָּׁמֵרוּ
  choice: జాగ్రత్తగా ఉండండి
  rationale: שׁמר నిఫల్ రూపంలోని తనను తాను కాపాడుకుంటూ అప్రమత్తంగా ఉండాలనే ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשֵׁם אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్ల పేరును
  rationale: హీబ్రూ ఏకవచన నిర్మాణమైన ‘పేరు’ను నిలుపుతూ, ఇశ్రాయేలు దేవునికి భిన్నమైన దేవతలను ‘ఇతర దేవుళ్లు’ అని నేరుగా అనువదిస్తుంది.
- source_word: לֹא תַזְכִּירוּ
  choice: ప్రస్తావించకండి
  rationale: זכר హిఫిల్‌కు ఇక్కడ ఉన్న ‘పేరు పలకడం/ప్రస్తావించడం’ అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘పిలిచి ప్రార్థించకండి’ వంటి మరింత సంకుచితమైన ఆచారార్థాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: అది మీ నోట వినబడకూడదు
  rationale: నిషేధాత్మక భావాన్నీ, ‘నోట వినబడడం’ అనే మూలపాఠ్య చిత్రాన్నీ సహజమైన తెలుగులో నిలుపుతుంది. హీబ్రూలో చివరి సర్వనామం ఏకవచనంలో ఉన్నా, సమూహమైన ఇశ్రాయేలును ఉద్దేశించిన తెలుగులో గౌరవ/సామూహిక ‘మీ’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఇతర దేవుళ్ల పేరును పలకడంపై నిషేధం యొక్క పరిధి
  choice: వారి పేరును ‘ప్రస్తావించకండి’ అని విస్తృతంగా అనువదించడం
  alternative: వారి పేరుతో ‘మొరపెట్టకండి’ లేదా వారిని ‘ఆహ్వానించకండి’ అని ప్రత్యేకంగా అనువదించడం
  rationale: మూలంలోని זכר హిఫిల్ ‘ప్రస్తావించడం’తో పాటు సందర్భానుసారంగా ‘ఆహ్వానించడం’ అనే భావాన్నీ అనుమతిస్తుంది. ఈ వాక్యం కేవలం సాధారణ ఉచ్చారణనా, ఆరాధనా ఆహ్వానమా, లేక ఒడంబడిక సంబంధమైన అంగీకారమా అన్న పరిధిని పూర్తిగా నిర్ణయించదు; అందువల్ల ప్రధాన పాఠ్యం విస్తృత పదాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. మొదటి వాక్యంలోని బహువచన సంబోధనను సహజంగా కొనసాగించేందుకు చివర ‘మీ నోట’ అని ఇచ్చాం; హీబ్రూ ఏకవచన రూపాన్ని పాదసూచికలో వెల్లడించాం.
