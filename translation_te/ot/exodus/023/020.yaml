source:
  edition: WLC
  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: te
  text: ఇదిగో, దారిలో నిన్ను కాపాడటానికి, నేను సిద్ధపరచిన స్థలానికి నిన్ను తీసుకురావటానికి, నీ ముందుగా ఒక దేవదూతను[a] పంపుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దూతను.’ హీబ్రూ מַלְאָךְ అనే పదం మానవ దూతను లేదా దేవదూతను సూచించగలదు; ఇక్కడ సందర్భానికి ‘దేవదూత’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దైవిక వాక్యంలో శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయపు సూచనాత్మక, గంభీర బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: నేను ... పంపుతున్నాను
  rationale: స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను ‘నేను’ నిలుపుతుంది; కృదంత రూపంలోని సమీప లేదా సాగుతున్న చర్య భావాన్ని ‘పంపుతున్నాను’ వ్యక్తం చేస్తుంది.
- source_word: מַלְאָךְ
  choice: ఒక దేవదూతను
  rationale: ఈ పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే రెండు అర్థాలు ఉండవచ్చు. ఇక్కడ దేవుడు ఇశ్రాయేలుకు ముందుగా పంపే రక్షకుడు, మార్గదర్శి అనే సందర్భంలో ‘దేవదూత’ అత్యంత సంభావ్యమైన అర్థం; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: לְפָנֶיךָ
  choice: నీకు ముందుగా
  rationale: ప్రయాణంలో ముందుగా వెళ్లడం అనే సందర్భోచిత భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: దారిలో నిన్ను కాపాడటానికి
  rationale: שׁמר పదంలోని రక్షణ భావాన్ని, בַּדָּרֶךְ లోని ప్రయాణం లేదా మార్గం భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְלַהֲבִיאֲךָ
  choice: నిన్ను తీసుకురావటానికి
  rationale: בוא హిఫీల్ రూపంలోని ‘వచ్చేలా చేయడం, తీసుకురావడం’ అనే కారణార్థక భావాన్ని నిలుపుతుంది; ‘నడిపించడానికి’ అనడం మూలపద భావాన్ని మార్చవచ్చు.
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: నేను సిద్ధపరచిన స్థలానికి
  rationale: כון హిఫీల్ రూపానికి సందర్భానుసారంగా ‘సిద్ధపరచడం’ సరిపోతుంది; గమ్యస్థానాన్ని దేవుడు ముందుగానే సిద్ధం చేశాడనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో מַלְאָךְ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఒక దేవదూత’ అని అనువదించి, అతడు సృష్టించబడిన దేవదూతా లేక యెహోవా యొక్క ప్రత్యేక దైవిక ప్రత్యక్షతా అన్నది నిర్ధారించలేదు.
  alternative: ‘ఒక దూత’; లేదా ‘యెహోవా దూత’గా ప్రత్యేక దైవిక గుర్తింపును పేర్కొనడం.
  rationale: ఈ వచనం ఆ వ్యక్తిని కేవలం מַלְאָךְ అని మాత్రమే పేర్కొంటుంది. తరువాతి సందర్భం అతని స్థితి గురించి వేదాంతపరమైన ప్రశ్నలను లేవనెత్తినా, అనువాదం ఆ ఉద్రిక్తతను ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దైవిక వాక్యశైలి. ఏకవచన సంబోధనను మూలంలోని రెండవ పురుష ఏకవచన రూపాలకు అనుగుణంగా నిలిపాం; వాక్యక్రమాన్ని తెలుగు సహజ ప్రవాహానికి తగినట్లు అమర్చాం.
