source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל תָּ֤שֶׁת יָֽדְ/ךָ֙ עִם רָשָׁ֔ע לִ/הְיֹ֖ת עֵ֥ד חָמָֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: te
  text: అబద్ధపు వార్తను ప్రచారం చేయకూడదు.[a] దుర్మార్గునితో చేతులు కలిపి అన్యాయ సాక్షిగా ఉండకూడదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబద్ధపు వార్తను మోయకూడదు.” హీబ్రూ క్రియకు అక్షరార్థంగా ‘ఎత్తు, మోయు’ అనే భావం ఉంది; ఇక్కడ వార్తను ఇతరులకు చేరవేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థానికి దగ్గరగా, “దుర్మార్గునితో నీ చెయ్యి ఉంచి దౌర్జన్యపు సాక్షిగా ఉండకూడదు.” ‘దౌర్జన్యం’ అనే హీబ్రూ పదం హింసను, దురుద్దేశాన్ని లేదా అన్యాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: ప్రచారం చేయకూడదు
  rationale: נשא అనే క్రియకు మూలంగా ‘ఎత్తు/మోయు’ అనే అర్థమున్నా, שֵׁמַעతో కలిసి ఇక్కడ ఒక వార్తను మోసుకెళ్లడం లేదా వ్యాప్తి చేయడం అనే భావం వస్తుంది. ఆధునిక తెలుగులో ‘ప్రచారం చేయు’ ఈ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֵׁמַע שָׁוְא
  choice: అబద్ధపు వార్త
  rationale: שֵׁמַע అనేది విన్న సమాచారం, వార్త లేదా వదంతి; שָׁוְא అసత్యం, వ్యర్థం అనే భావాలను కలిగి ఉంది. న్యాయపరమైన సందర్భంలో ‘అబద్ధపు వార్త’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: చేతులు కలిపి
  rationale: అక్షరార్థంగా ‘నీ చెయ్యి ...తో ఉంచు.’ సహకరించడం లేదా పక్షం చేరడం అనే జాతీయాన్ని ‘చేతులు కలిపి’ అనే తెలుగు ప్రయోగం దాని దృశ్యరూపాన్ని నిలుపుతూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָשָׁע
  choice: దుర్మార్గుడు
  rationale: ఈ పదం నైతికంగా దుష్టుడైనవాడిని లేదా న్యాయపరంగా దోషిని సూచించగలదు. ఇక్కడ చెడు సాక్ష్యానికి సహకరించే వ్యక్తి సందర్భంలో ‘దుర్మార్గుడు’ తగిన విస్తృత భావాన్ని ఇస్తుంది.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: అన్యాయానికి దోహదం చేసే సాక్షిగా ఉండడం
  rationale: עֵד అంటే ‘సాక్షి’; חָמָסకు హింస, దౌర్జన్యం, అన్యాయం అనే భావాలున్నాయి. ‘హింసాత్మక సాక్షి’ తెలుగులో అస్పష్టంగా ఉండవచ్చు; న్యాయసందర్భంలో సాక్ష్యం న్యాయానికి హాని కలిగించే భావాన్ని ఈ ఎంపిక తెలియజేస్తుంది, అయితే మూలపదంలోని విస్తృతిని పాదటిప్పణి కాపాడుతుంది.
- source_word: לֹא / אַל
  choice: చేయకూడదు / ఉండకూడదు
  rationale: రెండూ నిషేధాన్ని వ్యక్తం చేస్తాయి. తెలుగు న్యాయబోధ శైలిలో ‘కూడదు’ సహజంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: חָמָס పదాన్ని న్యాయసాక్ష్య సందర్భంలో ఎలా వ్యక్తం చేయాలి
  choice: అన్యాయానికి దోహదం చేసే సాక్షి
  alternative: దౌర్జన్యపు సాక్షి / హింసాత్మక సాక్షి / దురుద్దేశపు సాక్షి
  rationale: חָמָסలోని హింస, దౌర్జన్యం, అన్యాయం అనే భావపరిధిని కేవలం ‘అబద్ధపు’గా కుదించలేదు. ప్రధాన వాక్యంలో సందర్భానుకూలమైన న్యాయహాని భావాన్ని ఇచ్చి, పాదటిప్పణిలో అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాలను ఉంచాం.
- issue: పుంలింగ ఏకవచన רָשָׁע రూపం
  choice: దుర్మార్గుడు
  alternative: దుర్మార్గ వ్యక్తి / దోషి
  rationale: హీబ్రూ పుంలింగ ఏకవచన రూపాన్ని తెలుగు సహజ పుంలింగ ఏకవచనంతో నిలిపాం; దీన్ని ఏదైనా ప్రత్యేక వర్గానికి పరిమితం చేసే సిద్ధాంతార్థం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గంభీరమైన న్యాయబోధ శైలి. మూలంలోని రెండు నిషేధాల నిర్మాణాన్ని నిలిపి, అసహజమైన అక్షరానువాదాన్ని పాదటిప్పణుల్లో ఇచ్చాం.
