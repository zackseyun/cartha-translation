  text: וְ/שָׁלַחְתִּ֥י אֶת הַ/צִּרְעָ֖ה לְ/פָנֶ֑י/ךָ וְ/גֵרְשָׁ֗ה אֶת הַ/חִוִּ֧י אֶת הַֽ/כְּנַעֲנִ֛י וְ/אֶת הַ/חִתִּ֖י מִ/לְּ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: te
  text: నేను నీకు ముందుగా కందిరీగను[a] పంపుతాను; అది హివ్వీయులను, కనానీయులను, హిత్తీయులను నీ ఎదుట నుండి తరిమివేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇశ్రాయేలీయులకన్నా ముందుగా పంపబడిన భయాందోళనను, లేదా దేవుడు కలిగించిన మరేదైనా ఒత్తిడి సాధనాన్ని సూచించే రూపకం కావచ్చు; అయితే హెబ్రీ పదానికి సాధారణ అర్థం ‘కందిరీగ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: నేను ... పంపుతాను
  rationale: సందర్భంలో సంయోజకంతో కూడిన Qal perfect మొదటి పురుష ఏకవచనం భవిష్య వాగ్దానాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం దైవ కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַצִּרְעָה
  choice: కందిరీగను
  rationale: ఈ పదం సాధారణంగా కందిరీగ వంటి కుట్టే పురుగును సూచిస్తుంది. హెబ్రీలోని నిర్దిష్ట ఏకవచనాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ఏకవచనంతో నిలిపి, రూపకాలంకార అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְפָנֶיךָ
  choice: నీకు ముందుగా
  rationale: అక్షరార్థంగా ‘నీ ముఖానికి ముందు’; ఇక్కడ ఇశ్రాయేలుకంటే ముందుగా వెళ్లి కార్యం చేయడాన్ని సూచిస్తున్నందున ఈ రూపం సహజంగా భావాన్ని అందిస్తుంది.
- source_word: וְגֵרְשָׁה
  choice: అది ... వెళ్లగొడుతుంది
  rationale: גרשׁ అంటే ‘వెళ్లగొట్టు, బహిష్కరించు.’ స్త్రీలింగ ఏకవచన క్రియ కందిరీగను తిరిగి సూచిస్తుంది; తెలుగులో ‘అది’ని స్పష్టత కోసం చేర్చాం.
- source_word: הַחִוִּי
  choice: హివ్వీయులను
  rationale: పేర్కొన్న జనసమూహానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ; సందర్భానుసారం సమూహ బహువచనం వాడాం.
- source_word: הַכְּנַעֲנִי
  choice: కనానీయులను
  rationale: పేర్కొన్న జనసమూహానికి సహజమైన తెలుగు రూపం; హెబ్రీ సమూహార్థక ఏకవచనాన్ని తెలుగులో బహువచనంగా వ్యక్తం చేశాం.
- source_word: הַחִתִּי
  choice: హిత్తీయులను
  rationale: పేర్కొన్న జనసమూహానికి తెలుగు లిప్యంతరీకరణ; సందర్భంలో సమూహాన్ని సూచించేందుకు బహువచనం వాడాం.
- source_word: מִלְּפָנֶיךָ
  choice: నీ ఎదుట నుండి
  rationale: ‘నీ ముఖం ఎదుట నుండి’ అనే స్థలసంబంధ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: הַצִּרְעָה అనే పదాన్ని అక్షరార్థంగా అనువదించాలా, రూపకాలంకారంగా వ్యాఖ్యానించాలా
  choice: ప్రధాన పాఠ్యంలో ‘కందిరీగ’ అని అక్షరార్థంగా అనువదించాం.
  alternative: ‘భయం,’ ‘భయాందోళన,’ లేదా ఇశ్రాయేలుకు ముందుగా పంపబడిన మరేదైనా దైవిక ఒత్తిడి సాధనం అనే రూపకాలంకార భావం.
  rationale: హెబ్రీ పదం సాధారణంగా కందిరీగ లేదా కుట్టే పురుగునే సూచిస్తుంది. పాఠ్యం రూపకాలంకార భావాన్ని నిర్బంధించనందున దానిని ప్రధాన అనువాదంలోకి తీసుకురాకుండా, నిజమైన వ్యాఖ్యాన అవకాశంగా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. జనసమూహాల హెబ్రీ ఏకవచన రూపాలను తెలుగులో సహజమైన బహువచన కర్మరూపాలతో అందించాం; మూలంలోని అక్షరార్థం మరియు వ్యాఖ్యాన అనిశ్చితి రెండింటినీ కాపాడాం.
