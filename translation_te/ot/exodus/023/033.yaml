source:
  edition: WLC
  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: te
  text: వారు నీ దేశంలో నివసించకూడదు; లేకపోతే వారు నిన్ను నాకు విరోధంగా పాపం చేయిస్తారు.[a] ఎందుకంటే నీవు వారి దేవుళ్లను సేవిస్తే,[b] అది నీకు ఉచ్చుగా అవుతుంది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నిన్ను నాకు విరోధంగా పాపం చేయిస్తారు,” లేదా “నిన్ను నాకు విరోధంగా పాపంలోకి నడిపిస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే నీవు వారి దేవుళ్లను సేవిస్తావు.” హీబ్రూ సంధానపదాన్ని వివరణాత్మకంగా గ్రహిస్తే, ఈ వాక్యభాగం కేవలం షరతుగా కాక సంభవించగల ఫలితంగా చదవవచ్చు.
    reason: alternative_reading
  - marker: c
    text: “ఉచ్చు” అని అనువదించిన హీబ్రూ పదం మోకೇಶ್; అది పట్టుకునే ఉచ్చు లేదా వలను సూచిస్తుంది. ఇక్కడ అది పతనానికి లేదా దేవునిపట్ల అవిశ్వాసానికి దారితీసేదానికి రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ בְּאַרְצְךָ
  choice: నీ దేశంలో నివసించకూడదు
  rationale: ישׁב ఇక్కడ ఒక ప్రాంతంలో కొనసాగుతూ నివసించడాన్ని సూచిస్తుంది. אֶרֶץ‌కు సందర్భానుసారంగా ‘దేశం’ సహజమైన ఆధునిక తెలుగు రూపం; ఇది భూభాగ సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: פֶּן
  choice: అలా ఉంటే ... చేయవచ్చు
  rationale: פֶּן అవాంఛిత పరిణామాన్ని నివారించేందుకు ఇచ్చే హెచ్చరికను పరిచయం చేస్తుంది. తెలుగు వాక్యంలో ‘అలా ఉంటే’ అనే నిర్మాణం ఆ నిరోధక హెచ్చరిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: వారు నీవు నాకు విరోధంగా పాపం చేసేలా చేయవచ్చు
  rationale: 'חטא హిఫీల్ రూపం కారణార్థకం: ‘పాపం చేసేలా చేయడం.’ לִי ఇక్కడ దేవునికి విరోధంగా జరిగే అపరాధాన్ని సూచిస్తుంది.'
- source_word: כִּי תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: ఎందుకంటే నీవు వారి దేవుళ్లను సేవిస్తే
  rationale: עבד దేవతలతో వాడినప్పుడు ఆరాధనతో కూడిన సేవను, విధేయతను సూచిస్తుంది. ‘సేవిస్తే’ మూలంలోని ఒడంబడిక విధేయత భావాన్ని ఉంచుతుంది; כִּי యొక్క వివరణాత్మక లేదా షరతు సంబంధాన్ని తెలుగు నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: అది నీకు ఉరిగా మారుతుంది
  rationale: מוֹקֵשׁ పట్టుకునే ఉచ్చు లేదా వల; రూపకాలంకారంగా పతనానికి దారితీసే ప్రమాదం. ‘ఉరి’ తెలుగులో చిక్కులో పడేసే సాధనం అనే రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: హెచ్చరించబడిన పాపం యొక్క స్వభావం
  choice: ఇతర దేవుళ్లను సేవించడం ద్వారా దేవునికి విరోధంగా పాపం చేయడమే ప్రధాన హెచ్చరికగా ఉంచబడింది.
  alternative: విదేశీయుల వల్ల కలిగే సాధారణ నైతిక లేదా సాంస్కృతిక చెడుగా విస్తరించి అర్థం చేయడం.
  rationale: తరువాతి వాక్యభాగం ‘వారి దేవుళ్లను సేవిస్తే’ అని పాపాన్ని స్పష్టంగా నిర్వచిస్తుంది. అందువల్ల వచనాన్ని జాతి వేరుపాటు గురించిన సాధారణ ప్రకటనగా మార్చలేదు.
- issue: כִּי వాక్యభాగపు సంబంధం
  choice: ‘ఎందుకంటే ... సేవిస్తే’ అని కారణం మరియు షరతు రెండింటినీ సహజంగా ప్రతిబింబించడం.
  alternative: ‘ఎందుకంటే నీవు వారి దేవుళ్లను సేవిస్తావు’ అని సంభావ్య ఫలితాన్ని నిశ్చయంగా చెప్పడం.
  rationale: హీబ్రూ כִּי వివరణాత్మకంగానూ, ఈ సందర్భంలో షరతు భావంతోనూ గ్రహించవచ్చు. ప్రధాన పాఠంలో సహజమైన షరతు పఠనాన్ని ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నివసించకూడదు,’ ‘పాపం,’ ‘సేవిస్తే,’ ‘ఉరి’ వంటి పరిచిత పదాలతో మూలంలోని ఆజ్ఞ, కారణార్థకత, విగ్రహారాధన హెచ్చరిక, ఉచ్చు రూపకాన్ని నిలిపాం.
