id: EXO.23.31
reference: Exodus 23:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: te
  text: నీ సరిహద్దును ఎర్ర సముద్రం[a] నుండి ఫిలిష్తీయుల సముద్రం వరకు, అరణ్యం నుండి ఆ నది[b] వరకు ఏర్పరుస్తాను. ఎందుకంటే ఆ దేశ నివాసులను మీ చేతికి అప్పగిస్తాను; నీవు వారిని నీ ఎదుటనుండి వెళ్లగొడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “రెల్లుల సముద్రం.”'
    reason: lexical_alternative
  - marker: b
    text: అంటే యూఫ్రటీసు నది.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: నిర్ణయిస్తాను
  rationale: దేవుని వాగ్దాన సందర్భంలో ఈ క్రియకు భవిష్యదర్థం ఉంది. భూభాగపు సరిహద్దును స్థాపించడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גְּבֻלְךָ
  choice: నీ సరిహద్దును
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, భౌగోళిక హద్దును స్పష్టంగా సూచిస్తుంది.
- source_word: מִיַּם סוּף
  choice: రెల్లుల సముద్రం నుంచి
  rationale: సూఫ్ అనే పదానికి ఉన్న ‘రెల్లు’ అనే మూలార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సంప్రదాయ ‘ఎర్ర సముద్రం’ పేరును పాదటీకలో ఇస్తుంది.
- source_word: יָם פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల సముద్రం
  rationale: హీబ్రూ జాతి-భౌగోళిక నిర్దేశాన్ని పారదర్శకంగా నిలుపుతుంది; దానిని నేరుగా మధ్యధరా సముద్రంగా మార్చదు.
- source_word: וּמִמִּדְבָּר
  choice: అరణ్యం మొదలుకొని
  rationale: מִדְבָּר సూచించే జనావాసం తక్కువైన ప్రదేశానికి ‘అరణ్యం’ సాధారణ బైబిలు సందర్భంలో సహజమైన తెలుగు పదం.
- source_word: הַנָּהָר
  choice: ఆ నది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది; అది యూఫ్రటీసు నదిని సూచిస్తుందని పాదటీక వివరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సరిహద్దు వాగ్దానానికి కారణం లేదా ఆధారాన్ని పరిచయం చేస్తుంది.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: మీ చేతికి అప్పగిస్తాను
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ అధికార-అధీనత నుడికారాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; బహువచన ప్రత్యయాన్ని ‘మీ’ ద్వారా నిలుపుతుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఆ దేశ నివాసులను
  rationale: దేశంలో నివసించేవారిని సూచించే కృదంత రూపానికి సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: నీవు వారిని ... వెళ్లగొడతావు
  rationale: גרשׁ యొక్క బలవంతంగా బయటకు పంపే భావాన్ని నేరుగా తెలియజేస్తూ, హీబ్రూలోని ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుటి నుంచి
  rationale: ‘నీ ముఖసన్నిధి నుంచి’ అనే హీబ్రూ నుడికారానికి అర్థవంతమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: יַם סוּף అనే భౌగోళిక పేరు
  choice: రెల్లుల సముద్రం
  alternative: ఎర్ర సముద్రం
  rationale: మూల హీబ్రూ పదబంధంలోని సాధ్యమైన పదార్థాన్ని ప్రధాన పాఠ్యంలో చూపి, విస్తృతంగా పరిచయమైన సంప్రదాయ పేరును పాదటీకలో ఉంచడం ద్వారా భౌగోళిక గుర్తింపును అతిగా నిర్ధారించకుండా ఉంటుంది.
- issue: ఏకవచన–బహువచన సంబోధన మార్పు
  choice: ‘నీ సరిహద్దు’ / ‘మీ చేతికి’ / ‘నీవు వెళ్లగొడతావు’
  alternative: అన్నిచోట్లా ఏకవచనం లేదా అన్నిచోట్లా బహువచనం చేయడం
  rationale: 'హీబ్రూ పాఠ్యంలో ఉన్న నిజమైన వ్యాకరణ మార్పును సవరించకుండా నిలుపుతుంది: సరిహద్దు మరియు వెళ్లగొట్టే క్రియ ఏకవచనంలో ఉండగా, ‘మీ చేతికి’ బహువచనంలో ఉంది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన కానీ గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూలోని ఏకవచన–బహువచన మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదటీక సూచికలు సంబంధిత పదాల వెంటనే ఉంచబడ్డాయి.
