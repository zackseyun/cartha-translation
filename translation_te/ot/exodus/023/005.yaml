  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲ/ךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔/וֹ וְ/חָדַלְתָּ֖ מֵ/עֲזֹ֣ב ל֑/וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: te
  text: నిన్ను ద్వేషించే వ్యక్తి గాడిద దాని బరువు కింద పడి ఉండడాన్ని నీవు చూస్తే, అతనికి సహాయం చేయకుండా[b] ఉండాలని అనుకున్నా, నీవు తప్పక అతనితో కలిసి[a] సహాయం చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానితో కలిసి సహాయం చేయాలి,” అంటే గాడిదకు దాని బరువు విషయంలో సహాయం చేయాలి. హీబ్రూ సర్వనామం యజమానిని గానీ జంతువును గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “సహాయం చేయు” అని అనువదించిన హీబ్రూ క్రియకు సాధారణంగా “విడిచిపెట్టు” లేదా “త్యజించు” అనే అర్థం ఉంటుంది; ఈ సందర్భంలో అది సహాయం చేయడం లేదా భారాన్ని దించడంలో తోడ్పడడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: నీవు … చూసి
  rationale: כִּי ఇక్కడ న్యాయపరమైన సందర్భాన్ని ప్రవేశపెడుతుంది; తెలుగులో సహజమైన షరతు-సందర్భ నిర్మాణంగా ‘చూసి’ అని ఇచ్చాం. ראה యొక్క ప్రత్యక్ష అర్థమైన ‘చూడడం’ నిలిచింది.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: నిన్ను ద్వేషించే వ్యక్తి గాడిద
  rationale: שֹׂנַאֲךָ అనేది ‘నిన్ను ద్వేషించేవాడు’ అనే క్రియాత్మక భావాన్ని కలిగిన కృదంతం; ‘నీ శత్రువు’ అని విస్తృత వర్గీకరణ చేయకుండా మూలంలోని వ్యక్తిగత భావాన్ని నిలిపాం.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: తన బరువు కింద పడి ఉండడం
  rationale: רבץ జంతువు నేలపై పడివుండడాన్ని సూచిస్తుంది. ‘కూలిపోయి’ అని కారణం లేదా తీవ్రతను అదనంగా చేర్చకుండా, బరువు కింద ఉన్న దృశ్యాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: అతనికి సహాయం చేయకుండా ఉండాలనుకున్నా
  rationale: חדל מן నిర్మాణం వెనకడుగు వేయడం లేదా మానుకోవడాన్ని సూచిస్తుంది. ఈ క్లిష్ట వాక్యసందర్భంలో సహాయం చేయకుండా ఉండే ఉద్దేశం/మొగ్గును సహజంగా వ్యక్తం చేశాం; עזב యొక్క సాధారణ అర్థం గురించి పాదటిప్పణిలో తెలిపాం.
- source_word: עָזֹב תַּעֲזֹב
  choice: తప్పకుండా … సహాయం చేయాలి
  rationale: అనంతక్రియతో కూడిన అసంపూర్ణ క్రియ ఆజ్ఞను బలపరుస్తుంది. అందువల్ల ‘తప్పకుండా’ ద్వారా నిశ్చిత బాధ్యతను వ్యక్తం చేశాం.
- source_word: עִמּוֹ
  choice: అతనితో కలిసి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం యజమానిని లేదా గాడిదను సూచించగలదు. ప్రధాన పాఠంలో యజమానితో కలిసి సహాయం చేయడం అనే పఠనాన్ని ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: עִמּוֹ అనే చివరి సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: అతనితో కలిసి—గాడిద యజమానితో
  alternative: దానితో—గాడిదకు దాని బరువు విషయంలో సహాయం చేయడం
  rationale: హీబ్రూ పుంలింగ ఏకవచన రూపం వ్యాకరణపరంగా యజమానినీ గాడిదనూ సూచించగలదు. శత్రుత్వం ఉన్నప్పటికీ ఆ వ్యక్తితో కలిసి సహాయం చేయాలనే సామాజిక-నైతిక అంశానికి ప్రధాన పాఠంలో స్థానం ఇచ్చి, నిజమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయ-ఆజ్ఞ శైలిని వాడాం. ‘గాడిద,’ ‘బరువు,’ ‘సహాయం’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం. మూలంలోని బలమైన ఆజ్ఞను ‘తప్పకుండా … చేయాలి’గా నిలిపాం; సర్వనామ సందిగ్ధతను పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
