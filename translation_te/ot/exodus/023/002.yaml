source:
  edition: WLC
  text: לֹֽא תִהְיֶ֥ה אַחֲרֵֽי רַבִּ֖ים לְ/רָעֹ֑ת וְ/לֹא תַעֲנֶ֣ה עַל רִ֗ב לִ/נְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְ/הַטֹּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: te
  text: చెడు చేయడానికి ఎక్కువమందిని అనుసరించకూడదు. న్యాయవివాదంలో న్యాయాన్ని వక్రీకరించేలా ఎక్కువమంది వైపు మొగ్గుతూ సాక్ష్యం చెప్పకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “న్యాయవివాదంలో ఎక్కువమంది వైపు మొగ్గి తీర్పును వంచేలా జవాబివ్వకూడదు.”'
    reason: ענה అనే పదానికి ‘జవాబివ్వు’ అనే సాధారణ అర్థాన్ని, అలాగే נטה అనే పదానికి ‘మొగ్గు/వంచు’ అనే అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని చూపించడానికి.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: ఎక్కువమంది వెంట నీవు వెళ్లకూడదు
  rationale: היה אַחֲרֵי అనే ప్రయోగం సందర్భంలో ‘వెంట వెళ్లడం/అనుసరించడం’ అనే భావాన్ని ఇస్తుంది. רַבִּים అంటే ‘అనేకులు’ లేదా ‘ఎక్కువమంది’; ‘ఎక్కువమంది’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, జనాభిప్రాయ ఒత్తిడిని కూడా సూచిస్తుంది.
- source_word: לְרָעֹת
  choice: చెడు చేయడానికి
  rationale: ל తో కూడిన రూపం ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది; רָעֹת యొక్క బలమైన నైతిక భావాన్ని ‘చెడు’ నిలుపుతుంది.
- source_word: תַעֲנֶה עַל רִיב
  choice: న్యాయవివాదంలో … సాక్ష్యం చెప్పకూడదు
  rationale: ענה సాధారణంగా ‘జవాబివ్వడం’ అయినప్పటికీ, רִיב అనే న్యాయసందర్భంలో సాక్షిగా వాంగ్మూలం ఇవ్వడాన్ని సూచించగలదు. ‘న్యాయవివాదం’ మరియు ‘సాక్ష్యం చెప్పడం’ న్యాయస్థాన సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తాయి.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: ఎక్కువమంది వైపు మొగ్గి
  rationale: נטה లోని ‘వంగడం/మొగ్గడం/పక్కకు తిరగడం’ అనే రూపకాన్ని ‘మొగ్గి’ నిలుపుతుంది; אַחֲרֵי רַבִּים పునరుక్తిని ‘ఎక్కువమంది’ ద్వారా ప్రధాన వాక్యంలో కొనసాగిస్తుంది.
- source_word: לְהַטֹּת
  choice: న్యాయాన్ని వక్రీకరించేలా
  rationale: נטה హిఫీల్ రూపం న్యాయసందర్భంలో తీర్పును లేదా న్యాయాన్ని వంచడం అనే భావాన్ని ఇస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, సందర్భం సూచించే ‘న్యాయాన్ని’ తెలుగులో చేర్చడం అర్థాన్ని సహజంగా చేస్తుంది.
theological_decisions:
- issue: చివరి పదబంధంలోని సూచిత న్యాయపరమైన కర్మ
  choice: ‘న్యాయాన్ని వక్రీకరించేలా’ అని స్పష్టీకరించడం
  alternative: ‘వక్రంగా తిప్పేలా’ లేదా ‘తీర్పును వంచేలా’
  rationale: హీబ్రూ చివరి క్రియ సంక్షిప్తంగా, కర్మను పేర్కొనకుండా ఉంది. సాక్ష్యం మరియు న్యాయవివాదం అనే తక్షణ సందర్భం వల్ల న్యాయం లేదా తీర్పును వక్రీకరించడం ఉద్దేశమని స్పష్టమవుతుంది; ‘న్యాయాన్ని’ చేర్చడం సిద్ధాంతపరమైన అదనాన్ని కాక సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- issue: רַבִּים పదం ‘అనేకులు’నా, ‘మెజారిటీ’నా
  choice: ఎక్కువమంది
  alternative: అనేకులు; మెజారిటీ; జనసమూహం
  rationale: ఈ పదం అనేకులను లేదా సంఖ్యాబలమున్న వర్గాన్ని సూచించగలదు. ‘ఎక్కువమంది’ ఆ పరిధిని నిలుపుతుంది; అధికారిక ఓటింగ్‌లోని ‘మెజారిటీ’ భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయ-నైతిక శైలి వాడబడింది. ‘ఎక్కువమంది’ అనే పదబంధాన్ని రెండుసార్లు ఉంచి హీబ్రూ పునరుక్తిని కాపాడాం; న్యాయసందర్భాన్ని స్పష్టంచేయడానికి ‘న్యాయవివాదం’, ‘సాక్ష్యం’, ‘న్యాయం’ వాడాం.
