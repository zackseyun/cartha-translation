source:
  edition: WLC
  text: לֹֽא תִכְרֹ֥ת לָ/הֶ֛ם וְ/לֵ/אלֹֽהֵי/הֶ֖ם בְּרִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: te
  text: వారితో గాని, వారి దేవుళ్లతో గాని నీవు నిబంధన చేసుకోకూడదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోయడం.”
    reason: lexical_alternative
  - marker: b
    text: మరింత రూపానుగుణంగా, “వారితోను, వారి దేవుళ్లతోను.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: చేసుకోకూడదు
  rationale: నిషేధార్థకమైన לֹאను ఆధునిక తెలుగు ఆజ్ఞా శైలిలో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִכְרֹת
  choice: చేసుకో
  rationale: כרת ברית అనేది అక్షరార్థంగా ‘నిబంధనను కోయడం’ అయినా, నిబంధన కుదుర్చుకోవడాన్ని సూచించే స్థిర హీబ్రూ నుడికారం. తెలుగులో ‘నిబంధన చేసుకో’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: לָהֶם
  choice: వారితో
  rationale: నిబంధన సంబంధ సందర్భంలో ל అనే ఉపసర్గ నిబంధనలోని ఎదుటి పక్షాన్ని సూచిస్తుంది; అందువల్ల ‘వారితో’ సరైన సహజ అనువాదం.
- source_word: וְלֵאלֹהֵיהֶם
  choice: వారి దేవుళ్లతో గాని
  rationale: బహువచన రూపాన్నీ అన్యదేవతల సందర్భాన్నీ ‘వారి దేవుళ్లు’ కాపాడుతుంది. నిషేధంలో రెండు వేర్వేరు పక్షాలను చేర్చకుండా చూపేందుకు తెలుగులో ‘గాని…గాని’ నిర్మాణం సహజం.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: రాజకీయ ఒప్పందానికే పరిమితం కాకుండా, సంబంధపూర్వకమైన మరియు మతపరమైన గంభీరతను కూడా నిలుపుకునే ఆధునిక, విస్తృతంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: כרת ברית అనే నిబంధన నుడికారాన్ని అనువదించడం
  choice: నిబంధన చేసుకోకూడదు
  alternative: నిబంధనను కోయకూడదు
  rationale: అక్షరానువాదం తెలుగులో అపార్థానికి దారితీయవచ్చు. సహజమైన నుడికారాన్ని వాడుతూ నిషేధంలోని న్యాయపరమైన, సంబంధపూర్వకమైన బలాన్ని నిలుపుకుంది.
- issue: ‘వారి దేవుళ్లు’ ముందు ఉన్న ו యొక్క భావబలం
  choice: వారితో గాని, వారి దేవుళ్లతో గాని
  alternative: వారితోను, వారి దేవుళ్లతోను
  rationale: హీబ్రూ ו సాధారణంగా ‘మరియు’ అని ఉన్నప్పటికీ, రెండు నిషేధిత పక్షాలను తెలుగులో స్పష్టంగా విడదీయడానికి ‘గాని…గాని’ సహజం. మరింత రూపానుగుణమైన పఠనాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని నిర్మాణాన్ని తెలియజేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, అయినా న్యాయపరమైన నిషేధ గంభీరతను నిలుపుకునే శైలి. ఏకవచన పురుష సంబోధనను ‘నీవు’తో స్పష్టంగా చూపించింది; అన్యదేవతల బహువచనాన్ని ‘దేవుళ్లు’గా నిలిపింది.
