id: EXO.23.23
reference: Exodus 23:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: te
  text: ఎందుకంటే నా దూత[a] నీ ముందుగా వెళ్తాడు; అమోరీయుల వద్దకు, హిత్తీయుల వద్దకు, పెరిజ్జీయుల వద్దకు, కనానీయుల వద్దకు, హివ్వీయుల వద్దకు, యెబూసీయుల వద్దకు నిన్ను తీసుకువస్తాడు; నేను వారిని నిర్మూలిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవదూత.” హీబ్రూ మַלְאָךְ అనే పదం మానవ దూతను లేదా పరలోక దూతను సూచించవచ్చు; ఇక్కడ సందర్భం దేవుని మార్గనిర్దేశంతో సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అతనిని/దానిని నిర్మూలిస్తాను” అనే ఏకవచన ప్రత్యయం ఉంది; అది ముందు పేర్కొన్న జనాలను ఒక సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞ లేదా వాగ్దానానికి కారణాన్ని వివరిస్తున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: יֵלֵךְ
  choice: వెళ్లి
  rationale: సందర్భంలో భవిష్యదర్థక దైవ వాగ్దానం; తరువాతి క్రియతో సహజంగా అనుసంధానించబడింది.
- source_word: מַלְאָכִי
  choice: నా దూత
  rationale: మַלְאָךְ అనే పదానికి దూత లేదా దేవదూత అనే రెండర్థాలూ ఉండవచ్చు. 'దూత' మూలపదంలోని నిజమైన సందిగ్ధతను కాపాడుతూ, దేవునిచేత పంపబడిన ప్రతినిధిని సూచిస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీకు ముందుగా
  rationale: ముందుండి నడిపించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וֶהֱבִיאֲךָ
  choice: నిన్ను తీసుకువస్తాడు
  rationale: בוא హిఫీల్ రూపంలోని 'రప్పించు/తీసుకురా' అనే కారణార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֶל הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: అమోరీయులు, హిత్తీయులు, పెరిజ్జీయులు, కనానీయులు, హివ్వీయులు, యెబూసీయులు నివసించే చోటికి
  rationale: హీబ్రూలోని ఏకవచన జాతివాచక రూపాలు ప్రజాసమూహాలను సూచిస్తాయి. తెలుగులో కేవలం వ్యక్తుల 'వద్దకు' తీసుకురావడం అన్న అపార్థాన్ని నివారించడానికి, గమ్యభావాన్ని స్పష్టంగా తెలిపే సహజ రూపం ఎంచుకోబడింది.
- source_word: וְהִכְחַדְתִּיו
  choice: నేను వారిని నిర్మూలిస్తాను
  rationale: כחד హిఫీల్ రూపం అదృశ్యమయ్యేలా చేయడం లేదా నిర్మూలించడం అనే బలమైన భావాన్ని ఇస్తుంది. ఏకవచన ప్రత్యయం జాబితాలోని జనాలను సమష్టిగా సూచిస్తున్నందున తెలుగులో సహజమైన బహువచనం వాడబడింది.
theological_decisions:
- issue: מַלְאָכִי యొక్క స్వరూపం
  choice: '''నా దూత'' అని అనువదించి, ఆ వ్యక్తి స్వరూపాన్ని మరింత నిర్దిష్టంగా గుర్తించలేదు.'
  alternative: '''నా దేవదూత''; యెహోవా ప్రత్యక్షత; అవతారానికి పూర్వపు కుమారుడు'
  rationale: ఈ వచనం ఆ వ్యక్తిని దేవుని దూతగా మాత్రమే పేర్కొంటుంది. 'దూత' అనేది మానవ లేదా పరలోక సందేశవాహకుడు అనే పదార్థ పరిధిని నిలుపుతుంది; తరువాతి క్రైస్తవ సిద్ధాంత గుర్తింపులను అనువాదంలోకి చేర్చదు.
- issue: וְהִכְחַדְתִּיו లోని కర్మ వచనం
  choice: జనసమూహాలను సూచిస్తూ 'వారిని' అనే బహువచన రూపం.
  alternative: రూపపరంగా 'అతనిని/దానిని'; శత్రుసమూహాన్ని ఏకవచన సమష్టిగా చూపడం
  rationale: హీబ్రూ ప్రత్యయం ఏకవచనమైనా, ముందు పేర్కొన్న అనేక జనాలను సమష్టిగా సూచిస్తుంది. తెలుగులో 'వారిని' భావాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. 'దూత' ద్వారా మూలంలోని lexical ambiguity కాపాడబడింది. జాతిపేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణలు వాడబడ్డాయి; [a], [b] గుర్తులు ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
