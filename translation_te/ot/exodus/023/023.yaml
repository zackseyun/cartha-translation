revisions:
- from: ఎందుకంటే నా దూత నీకు ముందుగా వెళ్లి, అమోరీయులు, హిత్తీయులు, పెరిజ్జీయులు, కనానీయులు, హివ్వీయులు, యెబూసీయులు నివసించే చోటికి నిన్ను తీసుకువస్తాడు[a]; నేను వారిని నిర్మూలిస్తాను[b].
  to: ఎందుకంటే నా దూత[a] నీ ముందుగా వెళ్తాడు; అమోరీయుల వద్దకు, హిత్తీయుల వద్దకు, పెరిజ్జీయుల వద్దకు, కనానీయుల వద్దకు, హివ్వీయుల వద్దకు, యెబూసీయుల వద్దకు నిన్ను తీసుకువస్తాడు; నేను వారిని నిర్మూలిస్తాను[b].
