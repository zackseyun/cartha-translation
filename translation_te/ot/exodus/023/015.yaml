id: EXO.23.15
reference: Exodus 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: te
  text: పులియని రొట్టెల పండుగను ఆచరించాలి. నేను నీకు ఆజ్ఞాపించినట్లుగా, ఆబీబు[a] నెలలో నిర్ణయించిన సమయంలో ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి; ఎందుకంటే ఆ నెలలోనే నీవు ఐగుప్తు నుండి బయలుదేరావు. ఎవరూ నా సన్నిధికి వట్టి చేతులతో రాకూడదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆబీబు’ అనే హీబ్రూ పదం ధాన్యపు లేత వెన్నులను లేదా పక్వానికి వస్తున్న ధాన్యాన్ని సూచిస్తుంది; ఇక్కడ అది ఒక నెలకు కాలసూచక పేరు.
    reason: lexical_information
  - marker: b
    text: అక్షరార్థంగా, ‘వారు వట్టి చేతులతో నా ముఖం ఎదుట కనిపించకూడదు.’ ఈ ఉపవాక్యంలో హీబ్రూ క్రియ రెండవ పురుష ఏకవచనం నుండి మూడవ పురుష బహువచనానికి మారుతుంది.
    reason: grammatical_shift
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: חַג అనేది ఆచరించే పండుగను సూచిస్తుంది; מַצּוֹת పులియబెట్టని రొట్టెలను సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: תִּשְׁמֹר
  choice: ఆచరించాలి
  rationale: ఆరాధనా, ధర్మశాస్త్ర సందర్భంలో שׁמר అంటే కేవలం కాపాడడం కాక పండుగను విధిగా పాటించడం; ‘ఆచరించాలి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: ఏడు రోజులపాటు పులియని రొట్టెలు తినాలి
  rationale: కాలవ్యవధినీ, ఆహారానికి సంబంధించిన ఆజ్ఞనూ నేరుగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: నేను నీకు ఆజ్ఞాపించినట్లుగా
  rationale: దైవిక ప్రథమ పురుష వాక్యాన్నీ, ఏకవచన సంబోధననూ యథాతథంగా ఉంచుతుంది.
- source_word: לְמוֹעֵד
  choice: నిర్ణయించిన సమయంలో
  rationale: מוֹעֵד ఇక్కడ పండుగకు నిర్దేశించబడిన స్థిర కాలాన్ని సూచిస్తుంది; ‘సమావేశం’ అనే ఇతర అర్థం ఈ సందర్భానికి సరిపోదు.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ఆబీబు నెల
  rationale: ఇది కాలసూచక నామంగా పనిచేస్తున్నందున దాని అర్థాన్ని ప్రధాన వాక్యంలో విప్పకుండా హీబ్రూ పేరును లిప్యంతరీకరించాం.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: ఎందుకంటే ఆ నెలలోనే నీవు ఐగుప్తు నుండి బయలుదేరావు
  rationale: בוֹ సమీపంలోని ‘నెల’ను సూచిస్తుందని తెలుగులో స్పష్టం చేశాం; יָצָאתָలోని ఏకవచన సంబోధనను నిలిపాం.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: ఎవరూ నా సన్నిధికి వట్టి చేతులతో రాకూడదు
  rationale: ‘నా ముఖం ఎదుట కనిపించడం’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో ‘నా సన్నిధికి రావడం’గా ఇచ్చాం. רֵיקָםను కానుక లేకుండా రావడాన్ని సూచించే ‘వట్టి చేతులతో’గా అనువదించాం.
theological_decisions:
- issue: פָנַיలోని దైవిక ‘నా ముఖం’ అనే నుడికారం
  choice: నా సన్నిధికి
  alternative: నా ముఖం ఎదుటికి
  rationale: దేవుని సమక్షంలో హాజరుకావడం ఇక్కడ ఉద్దేశం. ‘నా సన్నిధికి’ వ్యక్తిగత దైవిక సంబోధనను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- issue: చివరి ఉపవాక్యంలో వ్యాకరణ పురుష మార్పు
  choice: ఎవరూ ... రాకూడదు
  alternative: వారు ... రాకూడదు
  rationale: ముందటి ఆజ్ఞలు రెండవ పురుష ఏకవచనంలో ఉన్నా, చివరి క్రియ హీబ్రూలో మూడవ పురుష బహువచనంలో ఉంది. తెలుగు ప్రధాన వాక్యంలో సహజమైన అనిర్దిష్ట నిషేధాన్ని వాడి, మూలంలోని మార్పును పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరతతో రూపొందించాం. ‘పులియని రొట్టెలు,’ ‘ఆచరించాలి,’ ‘వట్టి చేతులతో’ వంటి సహజ పదబంధాలు వాడాం; మూలంలోని ఏకవచన సంబోధనను సాధ్యమైనంతవరకు నిలిపాం.
