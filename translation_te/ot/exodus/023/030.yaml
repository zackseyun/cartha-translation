source:
  edition: WLC
  text: מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖/נּוּ מִ/פָּנֶ֑י/ךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְ/נָחַלְתָּ֖ אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: te
  text: కొంచెం కొంచెంగా వారిని నీ ఎదుటనుండి వెళ్లగొడతాను[a]; నీవు సంఖ్యలో పెరిగి ఆ దేశాన్ని స్వాధీనం చేసుకునే వరకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘అతణ్ణి’; ఇది దేశనివాసులను లేదా జనాలను సమష్టిగా సూచిస్తున్నది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ దేశాన్ని స్వాస్థ్యంగా పొందే వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: కొంచెం కొంచెంగా
  rationale: పునరుక్తిని నిలుపుతూ, చర్య క్రమంగా జరుగుతుందనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲגָרְשֶׁנּוּ
  choice: వారిని ... వెళ్లగొడతాను
  rationale: גרשׁ అంటే ‘వెళ్లగొట్టు/తరిమివేయు.’ హీబ్రూలో కర్మప్రత్యయం ఏకవచనమైనా, సందర్భంలో దేశనివాసులను లేదా జనాలను సమష్టిగా సూచిస్తుంది; తెలుగులో సహజమైన సమష్టి అర్థం కోసం ‘వారిని’ వాడబడింది.
- source_word: מִפָּנֶיךָ
  choice: నీ ఎదుట నుండి
  rationale: ‘నీ ముఖం/సన్నిధి నుండి’ అనే మూల నుడికారాన్ని అర్థమయ్యే తెలుగు రూపంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: עַד אֲשֶׁר
  choice: '...సుకునేంతవరకు'
  rationale: క్రమంగా వెళ్లగొట్టే చర్య కొనసాగే పరిమితి లేదా లక్ష్యబిందువును సహజంగా సూచిస్తుంది.
- source_word: תִּפְרֶה
  choice: నీవు విస్తరించి
  rationale: פרה ఇక్కడ ఫలించడం ద్వారా సంఖ్యాపరంగా పెరగడం, విస్తరించడం అనే భావాన్ని ఇస్తుంది. ప్రజల జనాభా పెరుగుదల సందర్భంలో ‘విస్తరించి’ సహజంగా ఉంటుంది.
- source_word: וְנָחַלְתָּ
  choice: స్వాధీనం చేసుకునే
  rationale: נחל అంటే ‘వారసత్వంగా పొందు’ లేదా ‘స్వాస్థ్యంగా పొందు/స్వాధీనం చేసుకో.’ దేశాన్ని ఆక్రమించి నివసించే ఈ సందర్భంలో ‘స్వాధీనం చేసుకో’ స్పష్టంగా ఉంటుంది; వారసత్వ భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- source_word: אֶת־הָאָרֶץ
  choice: ఆ దేశాన్ని
  rationale: సందర్భంలోని వాగ్దాన దేశాన్ని నిర్దిష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: వెళ్లగొట్టబడే వారి విషయంలో సమష్టి ఏకవచన కర్మప్రత్యయం
  choice: సందర్భానుసారంగా ‘వారిని’ అని అనువదించి, హీబ్రూ ఏకవచనాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘అతణ్ణి’ అని వ్యాకరణ ఏకవచనాన్ని నేరుగా నిలుపడం.
  rationale: హీబ్రూ రూపం మూడవ పురుష ఏకవచనమైనప్పటికీ, ముందున్న దేశనివాసులు లేదా జనాలను సమష్టిగా సూచిస్తుంది. తెలుగులో ‘అతణ్ణి’ అంటే ఒక వ్యక్తినే సూచించినట్టు అపార్థం కలగవచ్చు; ‘వారిని’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది, పాదసూచిక మూలరూపాన్ని పారదర్శకంగా ఉంచుతుంది.
- issue: נחל క్రియలో స్వాధీనం మరియు వారసత్వ భావాలు
  choice: ప్రధాన పాఠ్యంలో ‘స్వాధీనం చేసుకో’ అని ఇచ్చాం.
  alternative: ‘దేశాన్ని స్వాస్థ్యంగా పొందు’ లేదా ‘వారసత్వంగా పొందు.’
  rationale: సందర్భంలో దేశాన్ని ఆక్రమించి నివసించగల స్థితి ప్రధానంగా ఉన్నా, నిఘంటు పరంగా వారసత్వంగా పొందే భావం కూడా నిజమైన ప్రత్యామ్నాయం; దాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన శైలిని వాడాం. హీబ్రూ పునరుక్తిని ‘కొంచెం కొంచెంగా’ అని నిలిపి, సమష్టి ఏకవచనం మరియు נחל యొక్క వారసత్వ ఛాయలను పాదసూచికల్లో వెల్లడించాం.
