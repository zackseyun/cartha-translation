  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: te
  text: సంవత్సరంలో మూడుసార్లు నీ పురుషులందరూ ప్రభువైన యాహ్వే[a] సన్నిధిలో హాజరుకావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘ప్రభువైన యాహ్వే.’ యెహోవా అనేది ఈ దైవనామానికి సంప్రదాయంగా వాడే మరో లిప్యంతరీకరణ.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: సంవత్సరంలో మూడుసార్లు
  rationale: హీబ్రూ పదక్రమం, వార్షిక చక్రంలో మూడు సందర్భాలు అనే భావం రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יֵרָאֶה
  choice: కనబడాలి
  rationale: ראה నిఫాల్ రూపాన్ని సాధ్యమైనంత ప్రత్యక్షంగా ప్రతిబింబిస్తూ, ఉన్నతాధికారి లేదా దేవుని సన్నిధికి హాజరవడం అనే సందర్భార్థాన్ని తెలుగులో తెలియజేస్తుంది; ‘తన్ను తాను సమర్పించుకోవాలి’ అనే అదనపు ప్రతిబింబార్థాన్ని చేర్చదు.
- source_word: כָּל זְכוּרְךָ
  choice: నీ పురుషులందరూ
  rationale: మూలంలోని ద్వితీయ పురుష ఏకవచన స్వామ్యాన్ని, పురుష లింగ నిర్దిష్టతను కాపాడుతుంది.
- source_word: אֶל פְּנֵי
  choice: సన్నిధిలో
  rationale: ‘ముఖం ఎదుటికి’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ఒకరి సమక్షంలో హాజరుకావడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָדֹן
  choice: ప్రభువైన
  rationale: ఆదోన్ అనే దైవ బిరుదును సహజంగా వ్యక్తపరుస్తూ, వెంటనే వచ్చే వ్యక్తిగత దైవనామంతో తెలుగు వాక్యనిర్మాణంలో సజావుగా కలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన దైవనామ రూపంగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: הָאָדֹן יְהוָה అనే బిరుదు-దైవనామ కలయిక
  choice: ప్రభువైన యెహోవా
  alternative: ప్రభువైన యాహ్వే; ప్రభువైన దేవుడు
  rationale: మొదటి పదాన్ని బిరుదుగాను, రెండవదాన్ని వ్యక్తిగత దైవనామంగాను వేరుచేసి నిలుపుతుంది. ‘దేవుడు’ అని మార్చడం మూలంలోని నామాన్ని మరుగుపరుస్తుంది; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూపం వాడబడింది. మూలంలోని ‘నీ’ అనే ఏకవచన సంబోధనను, పురుషులనే సూచించే నిర్దిష్టతను నిలిపాం.
