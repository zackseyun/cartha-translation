revisions:
- from: సంవత్సరంలో మూడుసార్లు నీ పురుషులందరూ ప్రభువైన యెహోవా[a] సన్నిధిలో కనబడాలి.
  to: సంవత్సరంలో మూడుసార్లు నీ పురుషులందరూ ప్రభువైన యాహ్వే[a] సన్నిధిలో హాజరుకావాలి.
  rationale: కనబడాలి స్థానంలో సన్నిధిలో హాజరుకావాలి వాడి, హీబ్రూ నుడికారమైన “దేవుని ఎదుట ప్రత్యక్షమగుట/హాజరగుట” అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఇచ్చాం. యెహోవా స్థానంలో యాహ్వే వాడి, మూలంలోని దైవనామాన్ని మరియు POB యొక్క నిర్దిష్ట నామ-లిప్యంతరీకరణ విధానాన్ని అనుసరించాం. పాదటిప్పణి ప్రత్యామ్నాయ లిప్యంతరీకరణను మాత్రమే సూచిస్తుంది; మూలార్థానికి మించి ఏ వ్యాఖ్యానమూ జోడించదు.
