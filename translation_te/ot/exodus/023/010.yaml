revisions:
- from: ఆరు సంవత్సరాలు నీ భూమిని విత్తి, దాని పంటను సమకూర్చుకోవాలి[a].
  to: ఆరు సంవత్సరాలపాటు నీ భూమిలో విత్తాలి, దాని దిగుబడిని సేకరించాలి[a].
  rationale: The revision restores two coordinated prescriptive verbs, uses a direct equivalent for gathering produce, and retains the source’s agricultural breadth. The alternative note is aligned with the revised main rendering and remains anchored to “దిగుబడిని.”
