translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యపు ఆజ్ఞాత్మక స్వరాన్ని ‘సమకూర్చుకోవాలి’ ద్వారా నిలిపి, సాధారణ పాఠకులకు సహజంగా వినిపించే సంక్షిప్త వాక్య నిర్మాణాన్ని ఉపయోగించాం.
