lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు
  rationale: ఆదిలోని సంధికారకాన్ని తెలుగులో కృత్రిమంగా ‘మరియు’ అని ఉంచకుండా, కాలవ్యవధిని తెలిపే సహజమైన రూపంగా అనువదించాం.
- source_word: תִּזְרַע
  choice: నీ భూమిని విత్తి
  rationale: న్యాయసంబంధ సందర్భంలోని ద్వితీయ పురుష ఏకవచన అసంపూర్ణ క్రియకు ఆజ్ఞాత్మక భావం ఉంది; తదుపరి క్రియతో సహజంగా అనుసంధానించేందుకు ‘విత్తి’ అని ఇచ్చాం.
- source_word: אַרְצֶךָ
  choice: నీ భూమిని
  rationale: ఇక్కడ אֶרֶץ సాధారణంగా భూమండలాన్ని కాక, సాగుచేసే వ్యక్తికి చెందిన వ్యవసాయ భూమిని సూచిస్తుంది.
- source_word: וְאָסַפְתָּ
  choice: సమకూర్చుకోవాలి
  rationale: אָסַף అంటే కూడబెట్టడం లేదా సమకూర్చుకోవడం. పంటను లోపలికి చేర్చుకునే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ఈ పదం తెలియజేస్తుంది.
- source_word: תְּבוּאָתָהּ
  choice: దాని పంటను
  rationale: תְּבוּאָה భూమి ఇచ్చే వ్యవసాయ ఉత్పత్తి లేదా దిగుబడిని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘పంట’ సహజంగా, విస్తృతార్థంతో ఉంటుంది; ‘దాని’ భూమిని తిరిగి సూచిస్తుంది.
