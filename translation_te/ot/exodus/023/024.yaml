source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֤ה לֵ/אלֹֽהֵי/הֶם֙ וְ/לֹ֣א תָֽעָבְדֵ֔/ם וְ/לֹ֥א תַעֲשֶׂ֖ה כְּ/מַֽעֲשֵׂי/הֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔/ם וְ/שַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: te
  text: నీవు వారి దేవతలకు సాగిలపడకూడదు, వాటిని సేవించకూడదు, వారు చేసే విధంగా చేయకూడదు. బదులుగా, వాటిని తప్పకుండా కూలదోసి, వారి స్తంభాలను[a] పూర్తిగా పగులగొట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి పవిత్ర స్తంభాలను,’ ‘వారి నిలువురాళ్లను.’ హీబ్రూ పదం ఆరాధనతో ముడిపడిన, నిలబెట్టిన రాతి స్మారకాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: సాగిలపడకూడదు
  rationale: ఈ క్రియ భక్తిపూర్వకంగా వంగి నమస్కరించే శారీరక చర్యను సూచిస్తుంది. ‘ఆరాధించు’ అని విస్తృతార్థంలో కలిపివేయకుండా మూలంలోని స్పష్టమైన చర్యను నిలుపుతుంది.
- source_word: לֵאלֹהֵיהֶם
  choice: వారి దేవతలకు
  rationale: ל ఉపసర్గతో కూడిన పదబంధం ఇక్కడ ‘వారి దేవతలకు’ అని సహజంగా వస్తుంది; ఇది ఇతర జనాల దేవతలను సూచిస్తుంది.
- source_word: תָעָבְדֵם
  choice: వాటిని సేవించకూడదు
  rationale: עבד మతపరమైన సేవను లేదా ఆరాధనా విధేయతను సూచించగలదు. ‘సేవించు’ మూలక్రియకు నేరుగా సరిపోతూ, ముందున్న సాగిలపడటంతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: వారు చేసే విధంగా చేయకూడదు
  rationale: ‘వారి క్రియల ప్రకారం చేయవద్దు’ అనే మూల నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, వారి ఆచరణను అనుకరించవద్దనే భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: బదులుగా
  rationale: ఇక్కడ כִּי ముందు నిషేధించిన చర్యలకు విరుద్ధంగా చేయవలసినదాన్ని బలంగా పరిచయం చేస్తుంది; అందువల్ల ‘బదులుగా’ సందర్భానుకూలం.
- source_word: הָרֵס תְּהָרְסֵם
  choice: వాటిని తప్పకుండా కూలదోసి
  rationale: ధాతువు యొక్క సంపూర్ణ క్రియారూపం మరియు పరిమిత క్రియ కలయిక ఆజ్ఞను తీవ్రం చేస్తుంది. ‘తప్పకుండా’ ఆ బలాన్ని వ్యక్తం చేస్తుంది; ‘వాటిని’ అనే సర్వనామం మూలంలోని సూచనార్థక అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: పూర్తిగా పగులగొట్టాలి
  rationale: పునరుక్త క్రియా నిర్మాణంలోని తీవ్రతను ‘పూర్తిగా’ తెలియజేస్తుంది; రాతి ఆరాధనా వస్తువుల ధ్వంసానికి ‘పగులగొట్టు’ సహజంగా సరిపోతుంది.
- source_word: מַצֵּבֹתֵיהֶם
  choice: వారి స్తంభాలను
  rationale: מַצֵּבָה సాధారణంగా ఆరాధనతో ముడిపడిన నిలువురాయి లేదా పవిత్ర స్తంభాన్ని సూచిస్తుంది. సంక్షిప్తమైన ప్రధాన పాఠంలో ‘స్తంభాలు’ ఉంచి, నిర్దిష్ట సాంస్కృతిక భావాన్ని పాదసూచికలో వివరిస్తున్నాం.
theological_decisions:
- issue: అన్య దేవతల పట్ల నిషేధించబడిన చర్యల స్వభావం
  choice: ‘సాగిలపడటం’ మరియు ‘సేవించడం’ అనే రెండు వేర్వేరు చర్యలను వేర్వేరుగానే అనువదించడం
  alternative: రెండు క్రియలనూ కలిపి ‘ఆరాధించవద్దు’ వంటి ఒకే ఆరాధనా పదంతో వ్యక్తం చేయడం
  rationale: హీబ్రూ రెండు భిన్న క్రియలను ఉపయోగిస్తుంది. బాహ్య గౌరవప్రదర్శనను, కొనసాగించే మతపరమైన సేవను రెండింటినీ నిషేధించే వాక్య బలాన్ని ఈ భేదం కాపాడుతుంది.
- issue: ధ్వంస ఆజ్ఞలోని ‘వాటిని’ అనే సర్వనామం దేనిని సూచిస్తుంది
  choice: మూలంలోని సర్వనామాన్ని నిలుపుతూ, వెంటనే వచ్చే స్తంభాల ప్రస్తావన ద్వారా ఆరాధనా వస్తువుల సందర్భాన్ని స్పష్టం చేయడం
  alternative: సర్వనామాన్ని నేరుగా ‘వారి విగ్రహాలను’ లేదా ‘వారి ఆరాధనా వస్తువులను’ అని విప్పి చెప్పడం; లేదా దేవతలనే అక్షరార్థంగా ధ్వంసం చేయాలని చూపడం
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ముందున్న దేవతలను సూచించగలిగినా, తరువాతి పాదం స్పష్టంగా భౌతిక ఆరాధనా స్తంభాల ధ్వంసాన్ని చెబుతుంది. ‘వాటిని’ మూలంలోని వాక్చాతుర్యపు ఉద్రేకం మరియు సూచనార్థక అస్పష్టతను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన ఆజ్ఞారూప శైలిని వాడాం. ఏకవచన సంబోధనగా ‘నీవు’ ఉంచాం. మూలంలోని రెండు తీవ్రతా నిర్మాణాలను ‘తప్పకుండా’ మరియు ‘పూర్తిగా’ ద్వారా సహజంగా ప్రతిబింబించాం; పాదసూచిక గుర్తు సంబంధిత ‘స్తంభాలను’ అనే పదం వద్ద ఉంచాం.
