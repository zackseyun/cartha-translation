source:
  edition: WLC
  text: הִשָּׁ֧מֶר מִ/פָּנָ֛י/ו וּ/שְׁמַ֥ע בְּ/קֹל֖/וֹ אַל תַּמֵּ֣ר בּ֑/וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְ/פִשְׁעֲ/כֶ֔ם כִּ֥י שְׁמִ֖/י בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: te
  text: అతని సన్నిధిలో జాగ్రత్తగా ఉండు; అతని స్వరాన్ని విను. అతనిపై తిరుగుబాటు చేయకు. ఎందుకంటే అతడు మీ అతిక్రమాన్ని క్షమించడు; నా నామం అతనిలో ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా నామం అతనిలో ఉంది,’ ‘నా నామం అతనిమీద ఉంది’; భావానువాదంగా, ‘అతడు నా నామాన్ని ధరించేవాడు.’ ఈ మాట దేవునిచే అప్పగించబడిన అధికారాన్ని సూచిస్తుంది; అయితే ఈ వచనం ఆ దూత యొక్క ఖచ్చితమైన స్వరూపాన్ని స్పష్టంగా నిర్వచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: అతని సన్నిధిలో జాగ్రత్తగా ఉండు
  rationale: హెచ్చరికతో కూడిన ఆజ్ఞార్థక భావాన్నీ, ‘అతని ముఖం ఎదుట/అతని సన్నిధిలో’ అనే సంబంధార్థాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: అతని మాట విను
  rationale: ‘అతని స్వరాన్ని విను’ అనే మూలరూపంలో సందర్భానుసారంగా ఉన్న ఆలకించి విధేయత చూపే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘లోబడు’ అని స్పష్టీకరించి మూలంలోని భావవ్యాప్తిని కుదించదు.
- source_word: אַל תַּמֵּר בּוֹ
  choice: అతనిపై తిరుగుబాటు చేయకు
  rationale: מרה సూచించే ఉద్దేశపూర్వక ధిక్కారం, తిరుగుబాటు అనే నిబంధనాత్మక గంభీరతను నిలుపుతుంది.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: అతడు మీ అతిక్రమాన్ని క్షమించడు
  rationale: పాపం లేదా అతిక్రమంతో వాడిన נשא ఇక్కడ ‘మోసివేయడం/క్షమించడం’ అనే నానుడి భావాన్ని ఇస్తుంది. ‘క్షమించడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండగా, פשע యొక్క సమూహార్థక ఏకవచనాన్ని ‘అతిక్రమాన్ని’ నిలుపుతుంది.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: నా నామం అతనిలో ఉంది
  rationale: ‘అతని అంతరంలో/అతనిలో’ అనే బలమైన కానీ సంక్షిప్తమైన మూలవాక్యాన్ని దగ్గరగా అనుసరిస్తుంది; దూతకు దేవుని నామంతో ఉన్న సంబంధం ఏ స్వరూపమైనదో అనువాదంలో ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: దూత స్వరూపం మరియు ‘నా నామం అతనిలో ఉంది’ అనే వాక్యం
  choice: దేవుని నామం అతనిలో ఉందనే మూలవాక్యాన్ని వ్యాఖ్యానాత్మక పరిష్కారం లేకుండా నిలుపడం
  alternative: ‘అతడు నా నామాన్ని ధరించేవాడు’ లేదా దేవుని సంపూర్ణ అధికారంతో వ్యవహరించే ప్రతినిధి అని స్పష్టీకరించడం
  rationale: ఈ వచనం దూతకు అప్పగించబడిన దైవిక అధికారాన్ని బలంగా సూచిస్తుంది; అయితే అతడు సృష్టించబడిన దూతనా, దేవుని ప్రత్యక్ష సన్నిధి రూపమా అనే విషయాన్ని ఇక్కడ స్పష్టంగా నిర్వచించదు. అందువల్ల ఆ ధార్మిక ఉద్వేగాన్ని అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ఆజ్ఞాశైలిని ఉపయోగించాం. హెబ్రీలో ఆజ్ఞలు ఏకవచనంలో ఉండగా, ‘మీ అతిక్రమం’ బహువచన సమూహాన్ని ఉద్దేశిస్తుంది; ఆ అసమానతను సాధ్యమైనంతవరకు నిలిపాం.
