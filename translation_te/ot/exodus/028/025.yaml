translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్గమకాండంలోని నిర్మాణ ఆదేశాలకు తగిన గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలోని వరుస క్రియలను సహజమైన తెలుగు ఆజ్ఞారూపంతో అందించాం; తాడు/గొలుసు అనే నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
