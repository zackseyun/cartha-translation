  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: te
  text: ఆ రెండు అల్లిన తాళ్ల రెండు చివరలను ఆ రెండు బంగారు అమరికలపై ఉంచాలి.[a] ఆ అమరికలను ఏఫోదు భుజపు భాగాల మీద, దాని ముందువైపున ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ రెండు అల్లిన గొలుసుల రెండు చివరలను.” హీబ్రూ పదం అల్లిన తాళ్లను లేదా గొలుసులవంటి అల్లిక పనిని సూచించగలదు; ఇక్కడి బంగారు పని సందర్భం గొలుసులవంటి నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: చివరలను
  rationale: ఈ పదం తాళ్లు లేదా గొలుసుల చివరి భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చివరలు’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: הָעֲבֹתֹת
  choice: అల్లిన తాళ్ల
  rationale: ఈ పదం మందమైన అల్లిన తాళ్లను లేదా గొలుసులవంటి అల్లిక పనిని సూచించగలదు. బంగారు పనికి సంబంధించిన సందర్భాన్ని దృష్టిలో ఉంచి ‘అల్లిన’ అని చేర్చినా, పదంలోని తాడు/గొలుసు సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: הַמִּשְׁבְּצֹת
  choice: బంగారు అమరికలకు
  rationale: ఇవి ఏఫోదుకు అమర్చిన బంగారు మౌంటింగులు లేదా సెట్టింగులు. ముందటి వచనాల సందర్భం వల్ల పదార్థమైన బంగారాన్ని స్పష్టంచేస్తూ, ఆకృతిని అతిగా నిర్దేశించకుండా ‘అమరికలు’ అని అనువదించాం.
- source_word: כִתְפֹת
  choice: భుజపు భాగాల
  rationale: అక్షరార్థంగా ‘భుజాలు’; అయితే వస్త్ర నిర్మాణ సందర్భంలో ఏఫోదు యొక్క భుజ భాగాలను సూచిస్తుంది.
- source_word: אֵפֹד
  choice: ఏఫోదు
  rationale: సరిగ్గా సమానార్థకమైన సాధారణ తెలుగు పదం లేని ప్రత్యేక యాజక వస్త్రం కావడంతో లిప్యంతరీకరణను వాడాం.
- source_word: אֶל מוּל פָּנָיו
  choice: దాని ముందువైపున
  rationale: ఏఫోదు ముందుకు కనిపించే వైపున అమర్చాలని సూచించే స్థలార్థక పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: נתן క్రియ పునరావృతమైంది. తెలుగు ఆజ్ఞారూప శైలిలో ‘తగిలించాలి’, ‘ఉంచాలి’ అనే సహజమైన క్రియావైవిధ్యంతో ప్రాథమిక చర్యను నిలిపాం.
