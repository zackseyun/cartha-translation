translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞారూప శైలిని ఉపయోగించాం. వరుసగా ఉన్న హీబ్రూ క్రియలను చిన్న, స్పష్టమైన వాక్యాలుగా ఉంచాం; వస్త్ర సాంకేతిక పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
