  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שִׁבַּצְתָּ֙ הַ/כְּתֹ֣נֶת שֵׁ֔שׁ וְ/עָשִׂ֖יתָ מִצְנֶ֣פֶת שֵׁ֑שׁ וְ/אַבְנֵ֥ט תַּעֲשֶׂ֖ה מַעֲשֵׂ֥ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: te
  text: సన్నని నారబట్టతో గళ్ల నమూనాతో అంగీని నేయాలి[a]. సన్నని నారబట్టతో తలపాగా చేయాలి. కళాత్మక కుట్టుపనితో నడికట్టును చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సన్నని నారబట్టతో గళ్ల నమూనా గల అంగీని చేయాలి.’ హీబ్రూ క్రియ నమూనా గల వస్త్రాన్ని తయారుచేయడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ
  choice: గళ్ల నమూనాలో ... నేయాలి
  rationale: שׁבץ అనే క్రియ ఇక్కడ వస్త్రాన్ని నమూనాతో తయారుచేయడాన్ని సూచిస్తుంది. ‘గళ్ల నమూనాలో నేయాలి’ అనేది వస్త్ర సంబంధమైన భావాన్నీ, ఫలితంగా కనిపించే నమూనాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַכְּתֹנֶת
  choice: అంగీని
  rationale: כְּתֹנֶת శరీరానికి దగ్గరగా ధరించే పొడవైన వస్త్రాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘అంగీ’ సంక్షిప్తమైన, గౌరవప్రదమైన సమానం.
- source_word: שֵׁשׁ
  choice: సన్నని నార
  rationale: గుడారపు, యాజక వస్త్రాల సందర్భంలో שֵׁשׁ నాణ్యమైన సన్నని నార వస్త్రాన్ని సూచిస్తుంది; ‘సన్నని నార’ దాని పదార్థాన్నీ నాణ్యతనూ తెలియజేస్తుంది.
- source_word: מִצְנֶפֶת
  choice: తలపాగా
  rationale: מִצְנֶפֶת తలకు చుట్టుకునే యాజక శిరోవస్త్రం. ‘తలపాగా’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా అర్థమయ్యే సహజ పదం.
- source_word: אַבְנֵט
  choice: నడికట్టు
  rationale: אַבְנֵט నడుము చుట్టూ కట్టుకునే అలంకార వస్త్రాన్ని సూచిస్తుంది. ‘నడికట్టు’ అనేది ‘బెల్టు’ కంటే వస్త్ర స్వభావాన్ని మెరుగ్గా తెలియజేస్తుంది.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: ఎంబ్రాయిడరీ పనిగా
  rationale: ఈ పదబంధం నైపుణ్యంతో చేసిన అలంకార కుట్టుపని లేదా రంగుల నమూనా పనిని సూచిస్తుంది. ‘ఎంబ్రాయిడరీ పని’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, చేతివృత్తి స్వభావాన్ని నిలుపుతుంది.
