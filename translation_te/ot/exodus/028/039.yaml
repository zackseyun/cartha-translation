  to: సన్నని నారబట్టతో గళ్ల నమూనాతో అంగీని నేయాలి[a]. సన్నని నారబట్టతో తలపాగా చేయాలి. కళాత్మక కుట్టుపనితో నడికట్టును చేయాలి.
