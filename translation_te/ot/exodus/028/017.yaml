translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞార్థక విధిని గౌరవప్రదమైన ‘పొదగాలి/అమర్చాలి/ఉండాలి’ రూపాలతో వ్యక్తం చేశాం. శిల్పసందర్భానికి సహజంగా ఉండే ‘పొదగాలి’ని ఎంచుకుని, రత్నాల గుర్తింపులోని అసలు భాషా అనిశ్చితిని పాదసూచికలో కాపాడాం.
