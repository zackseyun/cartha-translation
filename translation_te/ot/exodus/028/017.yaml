id: EXO.28.17
reference: Exodus 28:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: te
  text: దానిలో రత్నాలను పొదగాలి[a]; వాటిని నాలుగు వరుసలుగా అమర్చాలి. మొదటి వరుసలో కెంపు, పుష్యరాగం, మరకతం ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రత్నాల ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితం. ‘కెంపు’ ఎర్ర అగేట్ (కార్నేలియన్) కావచ్చు; ‘పుష్యరాగం’ క్రిసొలైట్ లేదా పెరిడాట్ కావచ్చు; ‘మరకతం’ బెరిల్ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: దానిలో రత్నాలను పొదగాలి
  rationale: מלא అనే క్రియకు అక్షరార్థంగా ‘నింపు’ అనే భావం ఉన్నా, రత్నాలను వక్షపతకంలో బిగించి అమర్చే శిల్పసందర్భంలో ‘పొదగాలి’ సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం. בּוֹ లోని అంతర్భావాన్ని ‘దానిలో’ నిలుపుతుంది.
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: నాలుగు వరుసలుగా రత్నాలను అమర్చాలి
  rationale: טוּר ఇక్కడ క్రమంగా అమర్చిన వరుసను సూచిస్తుంది; ఏకవచన אֶבֶן సందర్భంలో సమూహార్థకంగా ఉండటంతో తెలుగులో ‘రత్నాలను’ అని బహువచనంగా ఇవ్వడం సహజం.
- source_word: טוּר ... הָאֶחָד
  choice: మొదటి వరుసలో
  rationale: నాలుగు వరుసల్లో క్రమపరంగా మొదటిదాన్ని సూచించే హీబ్రూ ప్రయోగానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: אֹדֶם
  choice: కెంపు
  rationale: ఎర్రని రత్నాన్ని సూచించే సంప్రదాయ తెలుగు పేరు; ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: פִּטְדָה
  choice: పుష్యరాగం
  rationale: తెలుగు బైబిలు, రత్నపరిభాషలో ప్రాచుర్యం ఉన్న సంప్రదాయ సమానం; అసలు రత్నం ఏదో ఖచ్చితంగా తెలియనందున ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בָרֶקֶת
  choice: మరకతం
  rationale: మెరుపు లేదా ప్రకాశంతో సంబంధమున్న ఈ రత్నపదానికి సంప్రదాయంగా అర్థమయ్యే తెలుగు సమానం; ‘బెరిల్’ వంటి గుర్తింపులు కూడా సాధ్యమైనందున పాదసూచిక జోడించాం.
