  register: సంక్షిప్తమైన జాబితా శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన రత్ననామాలను వాడాం. ఖచ్చితంగా గుర్తించలేని ప్రాచీన రత్నాల విషయంలో ప్రధాన పాఠాన్ని భారంగా చేయకుండా పాదసూచికలో అనిశ్చితిని స్పష్టంగా తెలిపాం.
