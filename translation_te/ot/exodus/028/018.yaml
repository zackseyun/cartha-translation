translation:
  language: te
  text: 'మరియు రెండవ వరుసలో: ఫిరోజా[a], నీలమణి, వజ్రం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ పేర్కొన్న కొన్ని ప్రాచీన రత్నాలను నేడు ఖచ్చితంగా గుర్తించడం కష్టం. נֹפֶךְ ఎమరాల్డ్ లేదా కార్బంకిల్ కావచ్చు; סַפִּיר లాపిస్ లాజులి కావచ్చు; יָהֲלֹם జాసింత్ లేదా జాస్పర్ కావచ్చు.
