lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: వరుసలో
  rationale: ఈ సందర్భంలో טוּר రత్నాల వరుసను సూచిస్తుంది. మునుపటి వాక్యంతో ఉన్న అనుసంధానం తెలుగులో జాబితా నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: הַ/שֵּׁנִי
  choice: రెండవ
  rationale: ఇది ‘వరుస’ను విశేషించే క్రమసంఖ్య; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: נֹפֶךְ
  choice: మణిపచ్చ
  rationale: ఈ ప్రాచీన రత్నం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం. ప్రధాన పాఠంలో సుపరిచితమైన రత్ననామాన్ని ఉంచి, ఇతర సాధ్య గుర్తింపులను పాదసూచికలో ఇచ్చాం.
- source_word: סַפִּיר
  choice: నీలమణి
  rationale: సాంప్రదాయంగా ‘నీలమణి’ అని అనువదిస్తారు; అయితే ఇది ఆధునిక సఫైర్‌కు బదులు లాపిస్ లాజులిని సూచించి ఉండవచ్చు. ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וְ/יָהֲלֹם
  choice: వజ్రం
  rationale: ఇది సాధారణ సాంప్రదాయ అనువాదం; అసలు ప్రాచీన రత్నం ఏదో ఖచ్చితంగా తెలియనందున ఇతర ప్రతిపాదనలను పాదసూచికలో తెలిపాం.
