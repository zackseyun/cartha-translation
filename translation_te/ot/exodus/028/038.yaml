id: EXO.28.38
reference: Exodus 28:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: te
  text: అది అహరోను నుదుటిమీద ఉండాలి. ఇశ్రాయేలు కుమారులు[b] అర్పించే పరిశుద్ధ కానుకలన్నిటికి సంబంధించిన దోషాన్ని అహరోను భరించాలి[a]. అది ఎల్లప్పుడూ అతని నుదుటిమీద ఉండాలి; అప్పుడు యాహ్వే సన్నిధిలో వారికి అంగీకారం కలుగుతుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దోషాన్ని భరించాలి’ అనే హీబ్రూ నుడికారానికి ‘దోషబాధ్యతను మోయాలి’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే ప్రామాణిక ఒడంబడిక సంబంధ పదప్రయోగం.
    reason: cultural_note
  - marker: c
    text: మరొక విధంగా, ‘వారికి అనుగ్రహం కలగడానికి’ లేదా ‘వారు యాహ్వే సన్నిధిలో అంగీకరించబడేలా.’
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: నుదుటి / అతని నుదుటి
  rationale: ఈ పదం తల ముందుభాగమైన నుదుటిని సూచిస్తుంది; సందర్భంలోని ఉంచబడే స్థానాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָשָׂא ... עֲוֺן
  choice: దోషాన్ని భరించాలి
  rationale: యాజక సంబంధమైన ఈ హీబ్రూ నుడికారం దోషానికి సంబంధించిన బాధ్యతను మోయడాన్ని సూచించగలదు. దోషాన్ని తొలగించడం లేదా క్షమించడం అని అదనంగా నిర్ధారించకుండా మూలంలోని న్యాయపరమైన, ఆరాధనాపరమైన భావాన్ని నిలుపుతుంది.
- source_word: הַקֳּדָשִׁים
  choice: పరిశుద్ధ వస్తువులు
  rationale: ఆరాధనలో దేవునికి ప్రత్యేకంగా అర్పించబడిన కానుకలు లేదా వస్తువులను సూచించే విస్తృత వర్గాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: יַקְדִּישׁוּ
  choice: ప్రతిష్ఠించే
  rationale: దేవుని కోసం పరిశుద్ధంగా ప్రత్యేకించి అంకితం చేయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని రూపపరంగా పుంలింగమైన ఒడంబడిక సంబంధ పదబంధాన్ని నిలిపి, దాని సమూహార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: తమ పరిశుద్ధ కానుకలన్నిటిగా
  rationale: కష్టమైన హీబ్రూ నిర్మాణంలో ‘కానుకలు’ మరియు ‘పరిశుద్ధ వస్తువులు’ మధ్య ఉన్న సంబంధాన్ని పూర్తిగా కుదించకుండా, తెలుగులో అర్థమయ్యే విధంగా అందిస్తుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: నుదుటిమీద నిరంతరం ఉండాలనే ఆదేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְרָצוֹן לָהֶם
  choice: వారికి అంగీకారం కలుగుతుంది
  rationale: ప్రజలు తమ ప్రతిష్ఠిత కానుకలతో సంబంధంలో దేవుని సన్నిధిలో అంగీకారం పొందే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, అంగీకారం కేవలం ప్రజలకా లేక కానుకలకూ వర్తిస్తుందా అన్న సంబంధాన్ని అతిగా కుదించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
theological_decisions:
- issue: అహరోను ‘పరిశుద్ధ వస్తువుల దోషాన్ని’ భరించడం అనే మాట భావం
  choice: పరిశుద్ధ అర్పణలతో ముడిపడిన దోషబాధ్యతను అహరోను తన యాజక ప్రతినిధి పాత్రలో భరిస్తాడు.
  alternative: అహరోను ఆ దోషాన్ని నేరుగా తొలగిస్తాడు; లేదా ఇశ్రాయేలు పాపాల జ్ఞాపకాన్ని కేవలం సంకేతంగా మోస్తాడు.
  rationale: నָשָׂא עָוֺן అనే నుడికారం దోషం లేదా దాని బాధ్యతను మోయడాన్ని సూచించగలదు. పూర్తి ప్రాయశ్చిత్త సిద్ధాంతాన్ని వాక్యంలోకి చేర్చకుండా ‘దోషాన్ని భరించాలి’ అనే అనువాదం మూలంలోని ఉద్విగ్నతను నిలుపుతుంది.
- issue: ‘వారికి అంగీకారం’ అనే మాట దేనిని సూచిస్తుంది
  choice: ప్రజలు తమ ప్రతిష్ఠిత కానుకలతో సంబంధంలో యాహ్వే సన్నిధిలో అంగీకారం పొందుతారు.
  alternative: అంగీకారం కేవలం కానుకలకు మాత్రమే వర్తిస్తుంది.
  rationale: ‘వారికి’ అనే సర్వనామం సహజంగా ఆరాధకులను సూచిస్తుంది; అయితే సందర్భంలో వారి కానుకలు కూడా అంతర్భాగమే. అందువల్ల అనువాదం ఆ సంబంధాన్ని మరీ సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. యాజక, ఆరాధనా సందర్భానికి అవసరమైన ‘ప్రతిష్ఠించే,’ ‘పరిశుద్ధ వస్తువులు,’ ‘దోషాన్ని భరించాలి’ వంటి పదాలను నిలిపి, అతిగా సిద్ధాంతీకరించే వివరణను నివారించాం.
