revisions:
- from: అది అహరోను నుదుటిమీద ఉండాలి. ఇశ్రాయేలు కుమారులు[b] తమ పరిశుద్ధ కానుకలన్నిటిగా ప్రతిష్ఠించే పరిశుద్ధ వస్తువుల దోషాన్ని అహరోను భరించాలి[a]. అది ఎల్లప్పుడూ అతని నుదుటిమీద ఉండాలి; అప్పుడు యాహ్వే సన్నిధిలో వారికి అంగీకారం కలుగుతుంది[c].
  to: అది అహరోను నుదుటిమీద ఉండాలి. ఇశ్రాయేలు కుమారులు[b] అర్పించే పరిశుద్ధ కానుకలన్నిటికి సంబంధించిన దోషాన్ని అహరోను భరించాలి[a]. అది ఎల్లప్పుడూ అతని నుదుటిమీద ఉండాలి; అప్పుడు యాహ్వే సన్నిధిలో వారికి అంగీకారం కలుగుతుంది[c].
  rationale: ‘కానుకలన్నిటిగా’ అనే వ్యాకరణపరంగా అస్పష్టమైన పదబంధాన్ని తొలగించాం. సవరించిన వాక్యం అహరోను భరించేది ఇశ్రాయేలు అర్పించే పరిశుద్ధ కానుకలతో సంబంధమున్న దోషబాధ్యత అని తెలియజేస్తుంది. మూలంలోని యాజక-న్యాయపరమైన ఉద్విగ్నతను, ప్రజలకు కలిగే అంగీకారాన్ని, యాహ్వే దైవనామాన్ని యథాతథంగా నిలిపాము.
