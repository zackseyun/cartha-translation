  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: te
  text: 'వారి పేర్లలో ఆరింటిని ఆ ఒక రాయి మీద, మిగిలిన ఆరు పేర్లను రెండవ రాయి మీద, వారి జనన క్రమం ప్రకారం[a] చెక్కాలి.


    [a] లేదా, “వారి వంశపరంపర ప్రకారం.” ఇక్కడి హీబ్రూ పదబంధం వంశపరంపరను గానీ, దాని ఆధారంగా ఏర్పడే జనన క్రమాన్ని గానీ సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి వంశపరంపర ప్రకారం.” ఇక్కడి హీబ్రూ పదబంధం వంశపరంపరను గానీ, దాని ఆధారంగా ఏర్పడే జనన క్రమాన్ని గానీ సూచించవచ్చు.
    reason: כְּתוֹלְדֹתָם అనే పదబంధంలో ఉన్న వంశపరంపర/జనన క్రమం అర్థవైవిధ్యాన్ని నిలుపుటకు.
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: వారి పేర్లలో ఆరింటిని
  rationale: מן అనే విభక్తి ఇక్కడ మొత్తం పేర్లలో ఆరు అనే భాగార్థాన్ని తెలుపుతుంది; తెలుగులో ‘పేర్లలో ఆరింటిని’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: ఒక రాయి మీద
  rationale: הָאֶחָת అక్షరార్థంగా ‘ఆ ఒకటి’; తరువాతి ‘రెండవ రాయి’తో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: మిగిలిన ఆరు పేర్లను
  rationale: נוֹתָרִים అంటే మిగిలినవి. సందర్భంలో లెక్కించబడుతున్నవి పేర్లు కాబట్టి ‘మిగిలిన ఆరు పేర్లు’ అని స్పష్టపరచడం సహజమైన తెలుగు.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: రెండవ రాయి మీద
  rationale: הַשֵּׁנִית స్పష్టమైన క్రమసంఖ్య; ‘రెండవ’ దానిని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: כְּתוֹלְדֹתָם
  choice: వారు పుట్టిన క్రమం ప్రకారం
  rationale: תּוֹלְדוֹת వంశపరంపర లేదా జననాల క్రమాన్ని సూచించగలదు. ఇశ్రాయేలు కుమారుల పేర్ల అమరిక సందర్భంలో జనన క్రమం ప్రధాన భావం; అసలు పదంలోని వంశావళి ఛాయను పాదటిప్పణిలో నిలిపాం.
- source_word: '[implicit from Exodus 28:9] וּפִתַּחְתָּ'
  choice: చెక్కాలి
  rationale: ఈ వచనం హీబ్రూలో ముందటి వచనంలోని ‘చెక్కాలి’ అనే క్రియపై ఆధారపడిన కొనసాగింపు. విడిగా చదివినప్పటికీ తెలుగులో సంపూర్ణంగా, సహజంగా ఉండేందుకు ఆ సందర్భసిద్ధ క్రియను పునరుద్ధరించాం.
