  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆరాధనా గ్రంథానికి తగిన గౌరవప్రదమైన శైలి. మూలంలో ముందటి వచనం నుంచి కొనసాగే క్రియను తెలుగులో స్పష్టంగా పునరుద్ధరించాం.
