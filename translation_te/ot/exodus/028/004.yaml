  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: te
  text: 'వారు చేయవలసిన వస్త్రాలు ఇవి: వక్షపటం[a], ఏఫోదు[b], పై అంగీ, నమూనా అల్లికగల అంగీ[c], తలపాగా, నడికట్టు. అతడు నాకు యాజకునిగా సేవ చేయుటకై, నీ సహోదరుడైన అహరోనుకు మరియు అతని కుమారులకు పవిత్ర వస్త్రాలు[d] చేయాలి.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఛాతిపై ధరించే పటం’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం యాజకుని ఛాతిపై ధరించే ప్రత్యేక వస్తువును సూచిస్తుంది; ఇది యుద్ధ కవచం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఏఫోదు’ అనేది ఖచ్చితమైన తెలుగు సమానపదం లేని ప్రత్యేక యాజక వస్త్రానికి హెబ్రీ పేరు.
    reason: cultural_note
  - marker: c
    text: హెబ్రీ పదబంధం నమూనాతో అల్లిన అంగీని సూచిస్తుంది. ఆ నమూనా ప్రత్యేకంగా గళ్ల నమూనా అయి ఉండవచ్చు, కాని అది నిశ్చితం కాదు.
    reason: lexical_ambiguity
  - marker: d
    text: ‘ప్రతిష్ఠిత వస్త్రాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: e
    text: హెబ్రీలో ‘యాజకునిగా సేవ చేయుటకు’ అనే క్రియారూపం ఏకవచనంలో ఉంది; అది అహరోనును సూచిస్తుంది. సందర్భంలో అతని కుమారులకూ యాజక వస్త్రాలు ఉద్దేశించబడ్డాయి.
    reason: source_grammar
lexical_decisions:
- source_word: בְּגָדִים
  choice: వస్త్రాలు
  rationale: యాజక సంబంధమైన దుస్తులను సూచించే సహజమైన, గౌరవప్రదమైన సాధారణ తెలుగు పదం.
- source_word: יַעֲשׂוּ
  choice: చేయవలసిన / చేయాలి
  rationale: దైవ ఆదేశ సందర్భంలోని నిర్దేశక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֹשֶׁן
  choice: వక్షపటం
  rationale: ఇది యుద్ధ కవచం కంటే యాజకుడు ఛాతిపై ధరించే ప్రత్యేక వస్తువు; అందువల్ల ‘రొమ్ముకవచం’ అనే సైనిక భావాన్ని నివారిస్తుంది.
- source_word: אֵפוֹד
  choice: ఏఫోదు
  rationale: దీనికి తెలుగులో ఖచ్చితమైన సమానార్థక వస్త్రపదం లేనందున సాంకేతిక యాజక వస్త్రనామాన్ని లిప్యంతరీకరించాం.
- source_word: מְעִיל
  choice: పై అంగీ
  rationale: యాజక వస్త్రాలలో వెలుపల ధరించే పొడవైన అంగీ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: నమూనా అల్లికతో చేసిన చొక్కా
  rationale: תַּשְׁבֵּץ ప్రత్యేకంగా గళ్ల నమూనానే సూచిస్తుందో లేదో అనిశ్చితం; అల్లిన నమూనా గల వస్త్రమనే ప్రధాన భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: מִצְנֶפֶת
  choice: తలపాగా
  rationale: చుట్టి ధరించే యాజక శిరోవస్త్రానికి స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: אַבְנֵט
  choice: నడికట్టు
  rationale: నడుము చుట్టూ కట్టుకునే వస్త్రపు పట్టాను సూచిస్తుంది; సాధారణ బెల్టు అనే భావం కంటే సందర్భానికి తగినది.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: కֹדֶשׁలోని పరిశుద్ధత/ప్రత్యేక ప్రతిష్ఠ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: నీ సహోదరుడైన అహరోనుకు, అతని కుమారులకు
  rationale: మోషేతో అహరోను సంబంధాన్ని, అలాగే కుమారులనే పురుషలింగ సూచనను మూలానికి అనుగుణంగా నిలుపుతుంది.
- source_word: לְכַהֲנוֹ לִי
  choice: అతడు నాకు యాజకునిగా సేవ చేయడం కోసం
  rationale: యాజక సేవ అనే క్రియాత్మక ఉద్దేశాన్ని, మూలంలోని ఏకవచన ప్రత్యయాన్ని రెండింటినీ కాపాడుతుంది.
theological_decisions:
- issue: యాజక వస్త్రాల ప్రత్యేక పదజాలం
  choice: స్పష్టమైన తెలుగు సమానాలు ఉన్నచోట వాటిని వాడి, אֵפוֹדను ‘ఏఫోదు’గా లిప్యంతరీకరించడం
  alternative: అన్ని పదాలకు వివరణాత్మక తెలుగు పేర్లు పెట్టడం లేదా తరువాతి మతసంప్రదాయాల వస్త్రపదాలను వాడడం
  rationale: మోషే ధర్మశాస్త్రంలోని ప్రత్యేక ఆరాధనా సందర్భాన్ని నిలుపుతూ, తరువాతి సంఘ లేదా సంప్రదాయ వస్త్రవ్యవస్థలను పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంటుంది.
- issue: וּלְבָנָיוలో లింగ నిర్దిష్టత
  choice: అతని కుమారులకు
  alternative: అతని పిల్లలకు లేదా సంతానానికి
  rationale: ఇక్కడ హెబ్రీ పదం ప్రత్యేకంగా అహరోను కుమారులను, వారి యాజక సేవను సూచిస్తుంది.
- issue: לְכַהֲנוֹలో ఏకవచనం
  choice: అతడు నాకు యాజకునిగా సేవ చేయడం కోసం
  alternative: వారు నాకు యాజకులుగా సేవ చేయడం కోసం
  rationale: సందర్భంలో అహరోను కుమారులు కూడా ఉన్నప్పటికీ, మసొరా పాఠంలోని ప్రత్యయం ఏకవచనంలో ఉంది. దానిని బహువచనంగా మార్చి పాఠంలోని ఉద్రిక్తతను నిశ్శబ్దంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆదేశ శైలి వాడబడింది. అరుదైన యాజక సాంకేతిక పదమైన ‘ఏఫోదు’ మాత్రమే లిప్యంతరీకరించబడింది; మిగిలిన వస్త్రపదాలకు సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు రూపాలు ఎంచుకోబడ్డాయి.
