revisions:
- from: 'వారు చేయవలసిన వస్త్రాలు ఇవి: వక్షపటం[a], ఏఫోదు[b], పై అంగీ, నమూనా అల్లికతో చేసిన చొక్కా[c], తలపాగా, నడికట్టు. నీ సహోదరుడైన అహరోనుకు, అతని కుమారులకు పవిత్ర వస్త్రాలు[d] చేయాలి; అతడు నాకు యాజకునిగా సేవ చేయడం కోసం[e] వాటిని చేయాలి.'
  to: 'వారు చేయవలసిన వస్త్రాలు ఇవి: వక్షపటం[a], ఏఫోదు[b], పై అంగీ, నమూనా అల్లికగల అంగీ[c], తలపాగా, నడికట్టు. అతడు నాకు యాజకునిగా సేవ చేయుటకై, నీ సహోదరుడైన అహరోనుకు మరియు అతని కుమారులకు పవిత్ర వస్త్రాలు[d] చేయాలి.[e]'
  rationale: The revision improves the rendering of the patterned tunic and removes an unnatural repeated construction. It retains the source’s singular purpose clause explicitly, with a footnote explaining its relation to the accompanying plural ‘his sons,’ rather than harmonizing the grammar.
