  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: te
  text: నీవు రెండు బంగారు ఉంగరాలను చేసి, వాటిని వక్షపటపు రెండు చివరలపై, ఏఫోదు వైపున ఉన్న లోపలి అంచుపై అమర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏఫోదుకు ఎదురుగా లోపలివైపు ఉన్న దాని అంచుపై.”
    reason: స్థలసంబంధ పదబంధానికి సాధ్యమైన మరొక అనువాదం; హీబ్రూ పదబంధంలోని స్వల్ప దిశాత్మక అస్పష్టతను సూచిస్తుంది.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేసి
  rationale: ఆదేశాల వరుసలో సంధితో కూడిన Qal perfect ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; తరువాతి క్రియతో కలిపి తెలుగులో సహజమైన నిర్దేశ వాక్యంగా అనువదించబడింది.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: రెండు బంగారు ఉంగరాలను
  rationale: సంఖ్య, వస్తువు, పదార్థం అనే భావాలను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: వాటిని ... అమర్చాలి
  rationale: שׂים అంటే పెట్టడం, ఉంచడం లేదా అమర్చడం; వస్త్ర నిర్మాణ సందర్భంలో 'అమర్చాలి' స్థానం నిర్దేశించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: వక్షపటపు రెండు చివరల మీద
  rationale: קצה అంటే చివర లేదా అంచుభాగం. חֹשֶׁן అనే యాజక వస్త్ర భాగానికి 'వక్షపటం' సంక్షిప్తమైన, అర్థవంతమైన పదం.
- source_word: עַל שְׂפָתוֹ
  choice: దాని అంచు మీద
  rationale: שָׂפָה యొక్క మూలార్థం పెదవి; వస్త్రం లేదా వస్తువు విషయంలో అంచు/సరిహద్దు అని అర్థం. ఇక్కడ 'అంచు' సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: ఏఫోదుకు ఎదురుగా లోపలివైపు ఉన్న
  rationale: עֵבֶר వైపు లేదా ఎదురుగా ఉన్న దిశను, בָּיְתָה లోపలికి/లోపలివైపు అనే భావాన్ని సూచిస్తాయి. హీబ్రూ స్థల సంబంధాన్ని అతిగా నిర్దిష్టీకరించకుండా ఈ పదబంధం నిలుపుతుంది.
