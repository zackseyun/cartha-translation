source:
  edition: WLC
  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: te
  text: అహరోను సేవ చేయడానికి అది అతని మీద ఉండాలి. అతడు యహ్వే సన్నిధిలోనున్న పరిశుద్ధ స్థలంలోకి ప్రవేశించేటప్పుడూ, బయటికి వచ్చేటప్పుడూ దాని శబ్దం వినబడాలి; అప్పుడు అతడు చనిపోడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చనిపోకుండా ఉండేందుకు.” హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “మరియు అతడు చనిపోడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: ఆ వస్త్రం అతని మీద ఉండాలి
  rationale: ముందరి వచనాల్లో వర్ణించిన వస్త్రమే సూచిత కర్త. ఆజ్ఞాత్మక సందర్భంలోని రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఉండాలి’గా వ్యక్తం చేశాం.
- source_word: לְשָׁרֵת
  choice: యాజక సేవ చేస్తున్నప్పుడు
  rationale: ל ఉపసర్గతో ఉన్న క్రియానామం ఉద్దేశం లేదా సందర్భాన్ని సూచించగలదు. ఇక్కడ అహరోను చేసే పవిత్ర సేవను స్పష్టం చేయడానికి కాలార్థకంగా అనువదించాం; ‘యాజక’ అనేది సందర్భస్పష్టీకరణ.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: దాని శబ్దం వినిపించాలి
  rationale: ‘శబ్దం’కు చేరిన ఏకవచన ప్రత్యయం వ్యాకరణపరంగా ‘అతని/దాని’ అని ఉండగలిగినా, 33–34 వచనాల్లోని వస్త్రపు గంటలే సమీప సందర్భం. కర్మణి భావాన్ని ‘వినిపించాలి’ సహజంగా అందిస్తుంది.
- source_word: בְּבֹאוֹ ... וּבְצֵאתוֹ
  choice: ప్రవేశించేటప్పుడూ ... బయటికి వచ్చేటప్పుడూ
  rationale: రెండు సమాంతర క్రియానామ రూపాల కాలార్థాన్ని తెలుగులో సమాంతర నిర్మాణంతో నిలిపాం.
- source_word: אֶל הַקֹּדֶשׁ
  choice: పవిత్ర స్థలంలోకి
  rationale: గుడారంలోని పవిత్ర ప్రదేశాన్ని సూచించే నిర్దిష్ట పదబంధం. ‘లోకి’ గమనంతో కూడిన ప్రవేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలోని
  rationale: లిఖిత దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించి, לִפְנֵי యొక్క సన్నిధి భావాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంలో అందించాం.
- source_word: וְלֹא יָמוּת
  choice: అప్పుడు అతడు చనిపోడు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘మరియు అతడు చనిపోడు’. ఆచార నియమాన్ని పాటించడం వల్ల కలిగే ఫలితాన్ని ‘అప్పుడు’ తెలియజేస్తుంది; ఉద్దేశార్థక పఠనం గమనికలో ఉంచాం.
theological_decisions:
- issue: వినిపించే శబ్దం దేనిది?
  choice: వస్త్రానికి అమర్చిన గంటల శబ్దం
  alternative: అహరోను కదలిక లేదా అతని ఉనికికి సంబంధించిన శబ్దం
  rationale: ముందరి రెండు వచనాలు వస్త్రపు అంచున ఉన్న గంటలను వర్ణిస్తున్నందున ‘దాని శబ్దం’ వాటినే సూచించడం అత్యంత సహజం. అయినప్పటికీ ప్రత్యయపు వ్యాకరణ విస్తృతిని అనవసరంగా సిద్ధాంతీకరించలేదు.
- issue: וְלֹא יָמוּת యొక్క సంబంధం
  choice: 'నియమం పాటించిన ఫలితం: ‘అప్పుడు అతడు చనిపోడు’'
  alternative: 'ఉద్దేశం లేదా హెచ్చరిక: ‘అతడు చనిపోకుండా ఉండేందుకు’ / ‘లేకపోతే అతడు చనిపోతాడు’'
  rationale: మూలంలోని సాధారణ సంయోజక నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భం అనుమతించే ఉద్దేశార్థాన్ని గమనికలో ఇచ్చాం.
- issue: יהוה దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో నేరుగా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడాం. ‘యాజక సేవ’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘ఆ వస్త్రం’ ముందరి వచనంలోని అంగీని తిరిగి సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఒకే గమనిక గుర్తు [a] ఉంది, దానికి సరిపోలే గమనిక జతచేయబడింది.
