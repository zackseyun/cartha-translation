  source_fidelity: మూలంలోని לְשָׁרֵת ఉద్దేశార్థాన్ని ‘సేవ చేయడానికి’గా ఇవ్వడం కాలార్థకమైన ‘సేవ చేస్తున్నప్పుడు’ కంటే సన్నిహితమైనది. הַקֹּדֶשׁకు ‘పరిశుద్ధ స్థలం’ సరైన ఆచారసంబంధ పదప్రయోగం. చివరి ఉపవాక్యంలోని ఫలిత/నిరోధ భావాన్ని ప్రధాన పాఠ్యంలో మూలానికి దగ్గరగా ఉంచి, ప్రత్యామ్నాయ ఉద్దేశార్థాన్ని గమనికలో నిలిపాం.
