  to: అహరోను సేవ చేయడానికి అది అతని మీద ఉండాలి. అతడు యహ్వే సన్నిధిలోనున్న పరిశుద్ధ స్థలంలోకి ప్రవేశించేటప్పుడూ, బయటికి వచ్చేటప్పుడూ దాని శబ్దం వినబడాలి; అప్పుడు అతడు చనిపోడు.[a]
