id: EXO.28.36
reference: Exodus 28:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: te
  text: నీవు స్వచ్ఛమైన బంగారంతో ఒక పలకను చేయాలి. ముద్ర చెక్కిన రీతిలో దానిపై, “యాహ్వేకు పరిశుద్ధం”[a] అని చెక్కాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు పరిశుద్ధత.”
    reason: కֹדֶשׁ అనే పదాన్ని ఇక్కడ ‘పరిశుద్ధం’ అనే అంకిత భావంతోనో, ‘పరిశుద్ధత’ అనే నామవాచక భావంతోనో అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు … చేయాలి
  rationale: యాజక వస్త్రాల తయారీకి సంబంధించిన వరుస ఆదేశంలో ఉన్న క్రియ యొక్క నిర్దేశక బలాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צִּיץ
  choice: పలక
  rationale: ఇతర సందర్భాల్లో ఈ పదం పువ్వు లేదా వికాసాన్ని సూచించగలిగినా, ఇక్కడ ప్రధాన యాజకుని తలపాగాపై అమర్చే బంగారు వస్తువును సూచిస్తుంది; ‘పలక’ సందర్భానికి స్పష్టమైన పదం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: వస్తువు ఏ పదార్థంతో, ఏ నాణ్యతతో చేయాలో సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: దానిపై … చెక్కాలి
  rationale: లోహంపై అక్షరాలను చెక్కే పనిని ఈ సందర్భంలో సూటిగా తెలియజేస్తుంది.
- source_word: פִּתּוּחֵי חֹתָם
  choice: ముద్రపై చెక్కినట్లుగా
  rationale: ముద్ర లేదా ముద్రికపై ఉండే చెక్కడపు రీతిలో ఈ వాక్యాన్ని చెక్కాలనే భావాన్ని సహజంగా నిలుపుతుంది; మూలంలోని బహువచన రూపాన్ని తెలుగులో అసహజంగా ప్రతిబింబించదు.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యాహ్వేకు పవిత్రం
  rationale: శాసనంలా సంక్షిప్తంగా ఉన్న హెబ్రీ అంకిత సూత్రాన్ని సంక్షిప్తంగానే ఉంచుతుంది. קֹדֶשׁ యొక్క నామవాచక భావమైన ‘పరిశుద్ధత’ కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన చతురక్షరి నామం నేరుగా ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: קֹדֶשׁ לַיהוָה అనే శాసనంలోని కֹדֶשׁ భావం
  choice: యాహ్వేకు పవిత్రం
  alternative: యాహ్వేకు పరిశుద్ధత
  rationale: హెబ్రీ పదబంధం సంక్షిప్తమైనది; అది పవిత్రంగా ప్రత్యేకించబడినదనే అర్థాన్నీ, ‘పరిశుద్ధత’ అనే నామవాచక భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త అంకిత వాక్యాన్ని, పాదసూచికలో సాధ్యమైన నామవాచక ప్రత్యామ్నాయాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆదేశ శైలి వాడబడింది. శాసనంలోని సంక్షిప్తతను నిలుపుతూ, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
