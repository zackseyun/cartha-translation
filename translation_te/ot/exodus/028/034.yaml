translation:
  language: te
  text: బంగారు గంట, దానిమ్మ[a]; బంగారు గంట, దానిమ్మ—పైవస్త్రపు అంచు చుట్టూ అంతటా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దానిమ్మ’ అనేది గంటల మధ్య అమర్చిన దానిమ్మ ఆకారపు అలంకారాన్ని సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: గంట
  rationale: యాజక వస్త్రానికి అమర్చిన చిన్న గంటను సూచిస్తుంది; ఆధునిక తెలుగులో ‘గంట’ సహజమైన, స్పష్టమైన సమానం.
- source_word: זָהָב
  choice: బంగారు
  rationale: గంట తయారైన పదార్థాన్ని విశేషణ రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: רִמּוֹן
  choice: దానిమ్మ పండు
  rationale: మూలపదం సాధారణంగా దానిమ్మ పండును సూచిస్తుంది. ఇక్కడ దానిమ్మ ఆకారపు అలంకారం కావచ్చనే విషయాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా పాదసూచికలో తెలిపాం.
- source_word: עַל
  choice: చుట్టూ
  rationale: שׁוּלֵי మరియు סָבִיבతో కలిసి వస్త్రపు అంచును పరివేష్టించి ఉన్న అమరికను సూచిస్తుంది; తెలుగులో ‘అంచు చుట్టూ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שׁוּלֵי
  choice: అంచు
  rationale: వస్త్రపు దిగువ అంచును సూచిస్తుంది. ‘అంచు’ ఆధునిక పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: מְעִיל
  choice: వస్త్రం
  rationale: ఇది యాజకుని ప్రత్యేక పైవస్త్రాన్ని సూచిస్తుంది; ఈ వచనంలో ‘వస్త్రం’ సరళంగా, సందర్భోచితంగా ఉంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అంచు అంతటా పరివేష్టించి ఉన్న అమరికను తెలియజేస్తుంది; עַלతో కలిపి ‘అంచు చుట్టూ’గా అనువదించాం.
