lexical_decisions:
- source_word: וְהַטּוּר
  choice: మూడవ వరుసలో
  rationale: ఈ సందర్భంలో טוּר రత్నాల ‘వరుస’ను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండేందుకు సంబంధార్థక ‘లో’తో అనువదించబడింది; వచనం జాబితాను కొనసాగిస్తున్నందున హీబ్రూ וְ భావం విరామచిహ్నం, సందర్భం ద్వారా నిలుస్తుంది.
- source_word: הַשְּׁלִישִׁי
  choice: మూడవ
  rationale: వరుసల క్రమంలో మూడవదాన్ని సూచించే సాధారణ క్రమసంఖ్య.
- source_word: לֶשֶׁם
  choice: లెషెము
  rationale: ఈ ప్రాచీన రత్ననామానికి ఆధునిక ఖనిజశాస్త్రంలో ఖచ్చితమైన గుర్తింపు లేదు. ఒక నిర్దిష్ట రత్నంగా ఊహించి నిర్ణయించకుండా, మూలపదాన్ని తెలుగు లిప్యంతరీకరణలో ఉంచి అనిశ్చితిని కాపాడింది.
- source_word: שְׁבוֹ
  choice: అగేటు
  rationale: సాంప్రదాయకంగా ‘అగేట్’గా గుర్తించబడే అవకాశం ఉన్నందున, ఆధునిక తెలుగులో అర్థమయ్యే ‘అగేటు’ ఎంచుకోబడింది; ‘ఓనిక్స్’ అవకాశం పాదసూచికలో ఉంచబడింది.
- source_word: וְאַחְלָמָה
  choice: అమేతిస్ట్
  rationale: אַחְלָמָהను సాధారణంగా అమేతిస్ట్ రత్నంగా గుర్తిస్తారు. జాబితా రూపంలో తెలుగు విరామచిహ్నాలు చివరి సముచ్చయాన్ని సహజంగా వ్యక్తం చేస్తాయి.
