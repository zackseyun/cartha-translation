  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: te
  text: నీవు ఊరీమును తుమ్మీమును తీర్పు వక్షపటంలో ఉంచాలి[a]. అహరోను యెహోవా సన్నిధిలోకి వెళ్లినప్పుడు అవి అతని హృదయంపై ఉండాలి. అహరోను ఇశ్రాయేలు కుమారుల తీర్పును[b] తన హృదయంపై యెహోవా సన్నిధిలో ఎల్లప్పుడూ మోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఊరీము, తుమ్మీము యాజకుని తీర్పు లేదా నిర్ణయంతో సంబంధమున్న పవిత్ర వస్తువుల హీబ్రూ పేర్లు. వాటి ఖచ్చిత రూపం, అవి పనిచేసిన విధానం తెలియదు. వాటి పేర్లకు సాధ్యమైన వ్యుత్పత్తి అర్థాలు ‘వెలుగులు,’ ‘సంపూర్ణతలు.’ ‘తీర్పు వక్షపటం’ అనే మాటను ‘నిర్ణయ వక్షపటం’ లేదా ‘న్యాయ వక్షపటం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది హీబ్రూ మూలంలోని వ్యక్తీకరణ; ఇక్కడ అది ఇశ్రాయేలు నిబంధన ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: తీర్పు వక్షపటం
  rationale: חֹשֶׁן యాజకుడు ఛాతీపై ధరించే ప్రత్యేక పటాన్ని సూచిస్తుంది; מִשְׁפָּט పదంలోని తీర్పు/నిర్ణయం భావాన్ని నిలుపుతూ, వాక్యంలోని రెండవ ప్రయోగంతో పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ఊరీము, తుమ్మీము
  rationale: వాటి ఖచ్చిత రూపం, వినియోగం తెలియనందున వివాదాస్పద వ్యుత్పత్తి అర్థాలను అనువదించకుండా హీబ్రూ సాంకేతిక నామాలను లిప్యంతరీకరించాం.
- source_word: אֶל
  choice: లో
  rationale: נתןతో కలిసి వక్షపటం లోపల లేదా దానితో అనుసంధానమైన సంచి భాగంలో ఉంచడాన్ని సూచిస్తుంది.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: అవి అహరోను హృదయంపై ఉండాలి
  rationale: వక్షపటం ఛాతీపై ఉండే భౌతిక చిత్రాన్నీ, అహరోను ప్రాతినిధ్య బాధ్యతనూ నిలుపుతుంది.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలోకి అహరోను వెళ్లినప్పుడు
  rationale: దేవుని సన్నిధిలోకి, ప్రత్యేకంగా పరిశుద్ధస్థల సేవలో ప్రవేశించే సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וְנָשָׂא
  choice: మోస్తూ ... ఉండాలి
  rationale: భౌతికంగా ధరించడం, ప్రజల పక్షాన ప్రాతినిధ్య బాధ్యత వహించడం అనే రెండు భావసాధ్యతలనూ నిలుపుతుంది; תָּמִידతో కలిసి నిరంతర విధిని సహజంగా తెలుపుతుంది.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల తీర్పు
  rationale: మొదటి מִשְׁפָּטతో పదపునరుక్తిని కాపాడి, ‘నిర్ణయం’ లేదా ‘న్యాయం’ అనే ఒక్క అర్థానికే పరిమితం చేయదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని సాంప్రదాయ నిబంధన-సమాజ నామాన్ని యథాతథంగా ఉంచుతుంది; అది ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: యాజక సేవలో కొనసాగుతూ ఉండే నియమిత బాధ్యతను తెలుగులో సహజంగా తెలియజేస్తుంది; ప్రతి క్షణమూ ఒకే భౌతిక చర్య జరుగుతుందనే అతిశయార్థాన్ని బలవంతం చేయదు.
theological_decisions:
- issue: אוּרִים, תֻּמִּים పదాలను అర్థానువాదం చేయాలా లేక లిప్యంతరీకరించాలా
  choice: ఊరీము, తుమ్మీము అని లిప్యంతరీకరించడం
  alternative: ‘వెలుగులు, సంపూర్ణతలు’ అని అర్థానువాదం చేయడం
  rationale: ఈ వస్తువుల స్వరూపం, పని, పదవ్యుత్పత్తి ఖచ్చితంగా తెలియవు. లిప్యంతరీకరణ ఊహాత్మక అర్థాన్ని సిద్ధాంతంగా స్థిరపరచదు.
- issue: מִשְׁפָּט పదానికి ఈ వాక్యంలో ఉన్న అర్థపరిధి
  choice: రెండు చోట్లా ‘తీర్పు’
  alternative: ‘నిర్ణయం’ లేదా ‘న్యాయం’
  rationale: దైవసన్నిధిలో అధికారపూర్వక నిర్ణయం అనే భావం ఉండవచ్చు; అయితే ‘తీర్పు’ మూలంలోని పునరుక్తినీ విస్తృత అర్థపరిధినీ కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’
  rationale: ఇది వ్యాకరణపరంగా పుంలింగ రూపమూ, నిబంధన సమాజానికి సంప్రదాయ నామమూ. పాదసూచిక దాని సామూహిక సూచనను స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆజ్ఞారూపాన్ని సహజంగా ‘ఉంచాలి’ అని ఇచ్చాం. ‘వక్షపటం,’ ‘తీర్పు,’ ‘హృదయంపై మోయడం’ వంటి మూలచిత్రాలను నిలిపి, అనిశ్చిత సాంకేతిక పదాలను పాదసూచికలో వివరించాం.
