source:
  edition: WLC
  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: te
  text: ఏఫోదుమీద ఉన్న దాని నడికట్టు దాని పనితనంలాగే ఉండాలి; అది దానితోనే ఒకటిగా ఉండాలి[a]. దాన్ని బంగారం, నీలం, ఊదా, ఎర్రని రంగుల నూలు, సన్నని మెలిపెట్టిన నారతో చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని పనితనంలాగే ఉండి, దానినుండే తయారవ్వాలి.’ నడికట్టు ఏఫోదు పనితనంలాగే ఉండడమే కాక, దానితో సమగ్రంగా ఉండాలని హెబ్రీ వాక్యం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: ఏఫోదు నడికట్టు
  rationale: యాజక వస్త్రాల సందర్భంలో חֵשֶׁב అనేది ఏఫోదును బిగించే నేసిన పట్టీ లేదా నడికట్టును సూచిస్తుంది. ‘ఏఫోదు నడికట్టు’ సాధారణ తెలుగు పాఠకునికి దాని ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָלָיו
  choice: దానిమీద ఉన్న
  rationale: సమీప పూర్వపదమైన ఏఫోదునే సర్వనామం సూచించడం ఈ వస్త్ర వివరణలో అత్యంత సహజం. ‘అతనిమీద’ అనే సాధ్యార్థాన్ని సందర్భం బలపరచదు.
- source_word: כְּמַעֲשֵׂהוּ
  choice: దాని పనితనానికి తగినట్లుగా
  rationale: ఈ పదబంధం నడికట్టు ఏఫోదు తయారీ విధానానికే అనుగుణంగా ఉండాలని చెబుతుంది; దాని ప్రత్యేక భావాన్ని తరువాతి పదబంధంలో కలిపివేయకుండా నిలుపుతుంది.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: దానితోనే ఒకటిగా ఉండాలి
  rationale: అక్షరార్థంగా ‘దానినుండే అది ఉండాలి.’ సందర్భంలో నడికట్టు విడిగా జోడించిన భాగం కాకుండా ఏఫోదుతో సమగ్రంగా తయారవ్వాలనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: బంగారం, నీలి, ఊదా, ఎర్రని నూలు
  rationale: బంగారాన్ని పదార్థంగా, మిగిలిన రంగు పదాలను రంగులు అద్దిన వస్త్ర నూలుగా సందర్భానుసారం అందిస్తుంది. תוֹלַעַת שָׁנִי యొక్క వస్త్రార్థాన్ని ‘ఎర్రని నూలు’ స్పష్టం చేస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר పేనిన లేదా మెలిపెట్టిన దారాన్ని సూచిస్తాయి; ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘ఏఫోదు’ అనే స్థిరమైన యాజక వస్త్రపదం లిప్యంతరీకరించబడింది. హెబ్రీ వాక్యంలోని పదార్థాల జాబితాను సహజ తెలుగు కోసం ‘దాన్ని ... చేయాలి’ అనే రెండవ వాక్యంగా అమర్చినా, మూలంలోని భావమంతా నిలుపబడింది.
