reference: Exodus 28:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: te
  text: ఆ రాళ్లు ఇశ్రాయేలు కుమారుల పేర్ల ప్రకారం ఉండాలి[a]—వారి పేర్ల ప్రకారం పన్నెండు రాళ్లు. ఒక్కొక్క రాయిపై ఒక్కొక్కరి పేరు ముద్రిక చెక్కడంలా చెక్కబడి ఉండాలి[b]. అవి పన్నెండు గోత్రాల కోసం ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ఈ మాటలను ‘ఇశ్రాయేలు కుమారుల పేర్లను ధరించి ఉండాలి’ అని కూడా అర్థం చేసుకోవచ్చు; అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల పేర్లపై/పేర్ల ప్రకారం ఉండాలి.’
    reason: עַל అనే సంబంధసూచక పదానికి ఇక్కడ ఉన్న భావసూక్ష్మతను, ప్రత్యామ్నాయ పఠనాన్ని కాపాడటం.
  - marker: b
    text: అక్షరార్థంగా, ‘ముద్రిక చెక్కుదలలు’; అంటే ముద్ర లేదా ముద్రికపై అక్షరాలను చెక్కే విధంగా.
    reason: פִּתּוּחֵי חוֹתָם అనే సంక్షిప్త హీబ్రూ నామపదబంధంలోని రూపకాన్ని వివరించడం.
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: ఆ రాళ్లు
  rationale: సందర్భంలో ఇప్పటికే నిర్దేశించిన రాళ్లనే సూచిస్తున్నందున తెలుగు సహజత్వానికి అనుగుణంగా నిర్దిష్ట సూచనను ఉంచింది; వావ్ సంధిని వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పలకనవసరం లేదు.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పేర్ల ప్రకారం ఉండాలి
  rationale: תִּהְיֶיןָ యొక్క ‘ఉండాలి’ భావాన్ని, עַל యొక్క సంబంధార్థాన్ని ‘పేర్ల ప్రకారం’ అనే సహజమైన తెలుగులో నిలిపింది; ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా బంధాన్ని కాపాడింది.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: వారి పేర్ల ప్రకారం పన్నెండు రాళ్లు
  rationale: పేర్లు ఎన్ని ఉంటే రాళ్లు కూడా అన్ని—పన్నెండు—అనే అనురూపతను స్పష్టంగా, కాని అదనపు వ్యాఖ్యానం లేకుండా తెలిపింది.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: ముద్రపై చెక్కినట్లుగా చెక్కబడి
  rationale: ముద్ర లేదా ముద్రికపై చేసే చెక్కడాన్ని సూచించే నిర్మాణాన్ని సాధారణ పాఠకునికి అర్థమయ్యే ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ఒక్కొక్క రాయిపై ఒక్కొక్కరి పేరు
  rationale: אִישׁ యొక్క విభజనాత్మక ‘ఒక్కొక్కరు’ భావాన్ని, సందర్భంలో ప్రతి రాయికి ఒక పేరు ఉండే సంబంధాన్ని సహజంగా తెలిపింది.
- source_word: תִּהְיֶיןָ לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: అవి పన్నెండు గోత్రాల కోసం ఉండాలి
  rationale: לְ యొక్క విస్తృత ప్రయోజన/సంబంధ భావాన్ని ‘కోసం’తో నిలిపింది; మూలంలో నేరుగా లేని ‘ప్రాతినిధ్యం వహించాలి’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధనా పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని అలాగే నిలిపింది. ఈ సందర్భంలో అది పన్నెండు గోత్రాల పూర్వికులైన యాకోబు కుమారులను సూచిస్తుంది; దానిని లింగనిరపేక్ష పదంతో నిశ్శబ్దంగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలిని ఉపయోగించింది. ఆభరణ నిర్మాణ సూచనకు తగిన విధంగా ‘ఉండాలి’, ‘చెక్కబడి ఉండాలి’ అనే ఆదేశాత్మక రూపాలు ఉంచబడ్డాయి. మూలంలోని పునరుక్తి పూర్తిగా తొలగించకుండా, తెలుగులో అర్థస్పష్టత కోసం రెండోసారి ‘రాళ్లు’ అని పునరుద్ధరించింది.
