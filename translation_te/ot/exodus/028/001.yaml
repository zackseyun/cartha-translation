reference: Exodus 28:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: te
  text: '“నీవు నీ సహోదరుడైన అహరోనును, అతనితో కూడ అతని కుమారులను, ఇశ్రాయేలు కుమారులలోనుండి నీ దగ్గరకు తీసుకురా; వారు నాకు యాజకులుగా సేవ చేయడానికి: అహరోను, నాదాబు, అబీహూ, ఎలియాజరు, ఈతామారు—అహరోను కుమారులు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలు కుమారులలోనుండి’ అనే మాటను ‘ఇశ్రాయేలీయులలోనుండి’ అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులలోనుండి’ అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలకు వాడే సాంప్రదాయ సమూహనామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవు
  rationale: స్వతంత్ర సర్వనామం వల్ల మోషేపై ఉన్న ఉద్ఘాటనను తెలుగు వాక్యారంభంలోని ‘నీవు’ సహజంగా నిలుపుతుంది.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: నీ దగ్గరికి రప్పించు
  rationale: קרב యొక్క హిఫీల్ రూపంలోని ‘దగ్గరికి తీసుకురా/రప్పించు’ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, సంపూర్ణ అభిషేకం లేదా నియామకం అనే అదనపు అర్థాన్ని చేర్చదు.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడైన
  rationale: కుటుంబ సంబంధాన్ని మూలపాఠం ప్రకారం స్పష్టంగా ఉంచుతుంది; గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: בָּנָיו אִתּוֹ
  choice: అతనితోపాటు అతని కుమారులను
  rationale: אִתּוֹ సూచించే సహగమనాన్ని స్పష్టంగా నిలుపుతుంది; అహరోను, అతని కుమారులు కలిసి పిలువబడుతున్నారని తెలియజేస్తుంది.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులలోనుండి
  rationale: ఎంపిక ఇశ్రాయేలు ఒడంబడిక సమాజం మధ్యనుండి జరుగుతుందనే భావంతోపాటు, ‘ఇశ్రాయేలు కుమారులు’ అనే మూలపాఠ ఆకృతిని నిలుపుతుంది.
- source_word: לְכַהֲנוֹ לִי
  choice: వారు నాకు యాజకులుగా సేవ చేయాలి
  rationale: כהן క్రియలోని యాజక సేవ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, לִי లోని ‘నాకు’ అనే దిశను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులైన
  rationale: పేరుపెట్టబడిన నలుగురూ అహరోను కుమారులని తెలిపే వంశసంబంధ గుర్తింపును సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే సమూహపదం
  choice: ఇశ్రాయేలు కుమారులలోనుండి
  alternative: ఇశ్రాయేలీయులలోనుండి
  rationale: హీబ్రూ పాఠంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే ఒడంబడిక సమాజపు సాంప్రదాయ నామాన్ని ప్రధాన పాఠంలో నిలిపాం. అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సమూహపదమనే సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘యాజకులుగా సేవ చేయాలి’ అనే రూపం ఆరాధనా సేవ భావాన్ని స్పష్టంగా ఉంచుతుంది. పేర్లు సాధారణ తెలుగు బైబిల్ వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో తప్పనిసరిగా చేర్చబడింది.
