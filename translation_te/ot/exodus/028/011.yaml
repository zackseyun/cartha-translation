revisions:
- from: రాతిపై చెక్కే శిల్పి పనితనంతో, ముద్రపై చెక్కినట్లుగా, ఇశ్రాయేలు కుమారుల పేర్లను ఆ రెండు రాళ్లపై చెక్కాలి[a]. వాటిని బంగారు పొదిగింపులతో చుట్టి చేయాలి.
  to: రాతి చెక్కే శిల్పి పనితనంలా, ముద్రిక చెక్కువిధానంలో, ఇశ్రాయేలు కుమారుల[a] పేర్లతో ఆ రెండు రాళ్లను చెక్కాలి; వాటిని బంగారు పొదిగింపులలో అమర్చాలి.
  rationale: The revision retains the Hebrew comparison with a stone engraver and signet engraving, renders the mounting instruction clearly and naturally, and relocates the existing cultural-note anchor to its actual referent. No doctrinal interpretation has been added.
