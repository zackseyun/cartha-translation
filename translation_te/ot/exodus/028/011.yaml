id: EXO.28.11
reference: Exodus 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: te
  text: రాతి చెక్కే శిల్పి పనితనంలా, ముద్రిక చెక్కువిధానంలో, ఇశ్రాయేలు కుమారుల[a] పేర్లతో ఆ రెండు రాళ్లను చెక్కాలి; వాటిని బంగారు పొదిగింపులలో అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఇశ్రాయేలు కుమారులు” అంటే, ఇశ్రాయేలు పన్నెండు కుమారులు; వారి పేర్లతో ఇశ్రాయేలు పన్నెండు గోత్రాలు పిలువబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: రాతిపై చెక్కే శిల్పి పనితనంతో
  rationale: ఈ నిర్మాణం పని చేసే విధానాన్ని సూచిస్తుంది. సందర్భం పేర్లను రాళ్లపై చెక్కడమే కాబట్టి, సాధారణ రాతిపనివాడికన్నా చెక్కే శిల్పి అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: פִּתּוּחֵי חֹתָם
  choice: ముద్రపై చెక్కినట్లుగా
  rationale: ముద్ర లేదా ముద్రికపై చేసే సూక్ష్మ చెక్కడాన్ని సూచిస్తుంది; తెలుగు పాఠకులకు సహజంగా ఉండేందుకు విధానార్థకంగా అనువదించబడింది.
- source_word: תְּפַתַּח
  choice: చెక్కాలి
  rationale: పేర్లను రాళ్లలో కోసి చెక్కించడాన్ని తెలుగులో సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: ఆ రెండు రాళ్లు
  rationale: మూలంలోని సాధారణ 'రాళ్లు' అనే పదాన్ని నిలుపుతుంది; సందర్భం వల్ల అవి విలువైన రాళ్లని తెలుస్తుంది.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పేర్లను ఆ రెండు రాళ్లపై
  rationale: עַל ను చెక్కబడే ఉపరితలాన్ని సూచించే 'పై'గా తీసుకుంది. 'ఇశ్రాయేలు కుమారులు' అనే వంశపరమైన పురుషలింగ పదబంధాన్ని నిలిపింది.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: బంగారు పొదిగింపులతో చుట్టి
  rationale: రాళ్లు బంగారు అమరికలతో చుట్టబడి లేదా బిగించబడి ఉండే భావాన్ని తెలియజేస్తుంది; పురాతన నగల తయారీ పద్ధతిని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: వాటిని ... చేయాలి
  rationale: ఆదేశార్థక రూపాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక వంశపదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతతి / ఇశ్రాయేలీయులు
  rationale: ఈ సందర్భంలో రాళ్లపై చెక్కబడేవి ఇశ్రాయేలు పన్నెండు కుమారుల పేర్లు; అందువల్ల మూలంలోని పురుషలింగ వంశపరమైన సూచనను నిలపడం సందర్భానుకూలం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞార్థక శైలిని గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచింది. 'పొదిగింపులు' నగలలో రాళ్లను అమర్చే బంగారు చట్రాల భావాన్ని ఇస్తుంది.
