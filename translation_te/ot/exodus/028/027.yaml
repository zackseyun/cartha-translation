  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా గ్రహించగల శైలి. యాజక వస్త్రానికి సాంకేతిక నామమైన ‘ఏఫోదు’ నిలుపబడింది; వస్త్ర నిర్మాణానికి సంబంధించిన పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఇచ్చబడ్డాయి.
