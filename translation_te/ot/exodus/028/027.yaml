  edition: WLC
  text: וְ/עָשִׂיתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְ/נָתַתָּ֣ה אֹתָ֡/ם עַל שְׁתֵּי֩ כִתְפ֨וֹת הָ/אֵפ֤וֹד מִ/לְּ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: te
  text: నీవు రెండు బంగారు ఉంగరాలు చేసి, వాటిని ఏఫోదు భుజభాగాల రెండింటి దిగువన, దాని ముందువైపున, ఏఫోదు కలయిక చోటుకు[a] ఎదురుగా, ఏఫోదు నైపుణ్యంగా నేసిన బిగింపు పట్టీకి[b] పైన అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని కుట్టుసీమకు’ లేదా ‘దాని జోడింపు స్థానానికి.’ హీబ్రూ పదం ఏఫోదు కలిపి ఉంచబడే స్థలాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏఫోదు నేసిన పట్టీకి.’ హీబ్రూ పదం ఏఫోదుకు చెందిన ప్రత్యేకంగా చేసిన పట్టీ లేదా బిగింపు భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: యాజక వస్త్ర భాగాలను బిగించడానికి ఉపయోగించే లోహపు వలయాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: כִתְפוֹת
  choice: భుజపు భాగాలు
  rationale: ఇది శరీర భుజాలను కాకుండా ఏఫోదు వస్త్రంలోని భుజాలపై ఉండే నిర్మాణ భాగాలను సూచిస్తుంది.
- source_word: הָאֵפוֹד
  choice: ఏఫోదు
  rationale: ఈ ప్రత్యేక యాజక వస్త్రానికి సంక్షిప్తమైన సమానార్థక తెలుగు పదం లేనందున ధ్వన్యనువాదం నిలుపబడింది.
- source_word: מִלְּמַטָּה
  choice: కిందివైపున
  rationale: ఉంగరాలు భుజపు భాగాల దిగువ భాగంలో ఉండాలనే స్థానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמּוּל פָּנָיו
  choice: దాని ముందుభాగంలో
  rationale: నిర్జీవ వస్తువుకు సంబంధించిన ‘దాని ముఖం ఎదుట’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְעֻמַּת
  choice: ఎదురుగా
  rationale: రెండు భాగాల స్థానపరమైన అమరిక లేదా సరిపోలికను నిలుపుతుంది.
- source_word: מֶחְבַּרְתּוֹ
  choice: అది అతుక్కునే చోటు
  rationale: పదం కుట్టుసీమకే పరిమితం కాకుండా కలయిక లేదా జోడింపు స్థానాన్ని విస్తృతంగా సూచిస్తుంది; మూలంలోని అస్పష్టతను నిలుపుతుంది.
- source_word: מִמַּעַל
  choice: పైన
  rationale: తరువాత పేర్కొన్న నడికట్టుతో పోల్చినప్పుడు పై స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు
  rationale: ఏఫోదులో భాగమైన ప్రత్యేకంగా తయారుచేసిన బిగింపు పట్టీ లేదా నడికట్టు భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
