revisions:
- from: అహరోను కుమారుల కోసం అంగీలు చేయాలి; వారికి నడికట్లు చేయాలి; వారికి తలపాగాలు[a] చేయాలి. అవి ఘనతకూ శోభకూ ఉండాలి.
  to: అహరోను కుమారుల కోసం అంగీలు చేయాలి; వారికి నడికట్లు చేయాలి; వారికి తలపాగాలు[a] చేయాలి; ఇవన్నీ ఘనతకూ శోభకూ ఉండేలా చేయాలి.
  rationale: The revision preserves the Hebrew’s three directives and clarifies that “for glory and for beauty” concerns the complete set of garments, not merely the headgear. The footnote remains attached to the ambiguous headgear term and is adjusted to agree naturally with the plural referent.
