language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י אַהֲרֹן֙ תַּעֲשֶׂ֣ה כֻתֳּנֹ֔ת וְ/עָשִׂ֥יתָ לָ/הֶ֖ם אַבְנֵטִ֑ים וּ/מִגְבָּעוֹת֙ תַּעֲשֶׂ֣ה לָ/הֶ֔ם לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: te
  text: అహరోను కుమారుల కోసం అంగీలు చేయాలి; వారికి నడికట్లు చేయాలి; వారికి తలపాగాలు[a] చేయాలి; ఇవన్నీ ఘనతకూ శోభకూ ఉండేలా చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తలటోపీలు,’ ‘శిరోవస్త్రాలు.’ యాజకులు ధరించే ఈ తలవస్త్రాల ఖచ్చితమైన ఆకారం స్పష్టంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: అహరోను కుమారుల కోసం
  rationale: హీబ్రూ పదబంధంలోని ప్రత్యక్ష పుత్రసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; విస్తృతమైన ‘వారసులు’ అనే భావాన్ని చేర్చదు.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: చేయాలి
  rationale: ఆదేశాత్మక సందర్భంలోని క్రియారూపాల భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֻתֳּנֹת
  choice: అంగీలు
  rationale: శరీరంపై ధరించే ప్రాథమిక వస్త్రాలను సూచించే పదానికి స్పష్టమైన తెలుగు సమానం; ‘వస్త్రాలు’ కంటే నిర్దిష్టం.
- source_word: אַבְנֵטִים
  choice: నడికట్లు
  rationale: నడుము చుట్టూ కట్టుకునే వస్త్రపు కట్టును సూచిస్తుంది; ఆధునిక గట్టి బెల్టు అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: מִגְבָּעוֹת
  choice: తలపాగాలు
  rationale: యాజకులు ధరించే తలవస్త్రాన్ని సహజంగా సూచిస్తుంది; దాని ఖచ్చితమైన ఆకారం నిర్ధారితం కానందున ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: לְכָבוֹד
  choice: ఘనతకు
  rationale: כָּבוֹד లోని గౌరవం, వైభవం అనే భావాన్ని ఈ వస్త్రాల సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: וּלְתִפְאָרֶת
  choice: శోభకు
  rationale: అందం, అలంకార వైభవం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తూ ‘ఘనత’తో సహజమైన జంటగా నిలుస్తుంది.
theological_decisions:
- issue: యాజక వస్త్రాల ఉద్దేశాన్ని తెలిపే పదబంధం
  choice: ఘనతకూ శోభకూ
  alternative: మహిమకూ అందానికీ / గౌరవానికీ వైభవానికీ
  rationale: హీబ్రూ పదజంటలోని గౌరవప్రదమైన, సౌందర్యాత్మకమైన ఉద్దేశాలను నిలుపుతుంది; వచనంలో లేని తరువాతి కాలపు ప్రతీకాత్మక అర్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆదేశాత్మకమైన గంభీర స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వస్త్రపదాలను వాడింది. హీబ్రూ వాక్యంలోని పునరుక్తిని కొంతవరకు నిలిపి, చివరి ఉద్దేశ వాక్యాన్ని సహజమైన తెలుగులో ప్రత్యేక వాక్యంగా ఇచ్చింది.
