translation:
  language: te
  text: అది చతురస్రంగా, రెండింతలుగా[a] ఉండాలి. దాని పొడవు ఒక జాన, దాని వెడల్పు ఒక జాన ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మడిచి రెండుపొరలుగా చేసినది.’ హీబ్రూ పదం రొమ్ముపలకను రెండింతలుగా, బహుశా మడతపెట్టి, తయారుచేశారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: చతురస్రంగా
  rationale: నాలుగు సమాన భుజాలుగల ఆకారాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: తయారీకి సంబంధించిన నిర్దేశాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּפוּל
  choice: రెండింతలుగా
  rationale: వస్తువు రెట్టించిన లేదా మడిచి రెండుపొరలుగా చేసిన రూపంలో ఉండడాన్ని సూచిస్తుంది; మడిచిన విధానాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించకుండా మూలంలోని స్వల్ప సందిగ్ధతను నిలుపుతుంది.
- source_word: זֶרֶת
  choice: జాన
  rationale: చాచిన చేతి బొటనవేలు చివర నుండి చిటికెనవేలు చివర వరకు ఉండే బైబిలు కొలతకు తెలుగులో వాడే సంక్షిప్తమైన కొలమాన పదం.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: పురుష ఏకవచన ప్రత్యయం సూచించే వస్తువు యొక్క పొడవును నేరుగా తెలియజేస్తుంది.
- source_word: וְזֶרֶת
  choice: ఒక జాన
  rationale: రెండవ కొలతలోనూ అదే కొలమానాన్ని సహజమైన తెలుగు కొలత వాక్య నిర్మాణంలో పునరావృతం చేస్తుంది.
- source_word: רָחְבּוֹ
  choice: దాని వెడల్పు
  rationale: పొడవుకు భిన్నమైన అడ్డ కొలతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
