  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: te
  text: బంగారంతో అల్లిన ఆ రెండు గొలుసులను వక్షాభరణం చివర్లలో ఉన్న ఆ రెండు ఉంగరాలపై అమర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెనవేసిన గొలుసులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: అమర్చాలి
  rationale: నిర్దేశాల వరుసలో వావ్‌తో వచ్చిన ఈ క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. గొలుసులను ఉంగరాలకు జతచేసే సందర్భంలో ‘అమర్చాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: బంగారంతో అల్లిన ఆ రెండు గొలుసులను
  rationale: עֲבֹתֹת అనేది పేనిన లేదా అల్లిన గొలుసు పనిని సూచిస్తుంది; బంగారం వాటి పదార్థమని కూడా ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: ఆ రెండు ఉంగరాలకు
  rationale: עַל ఇక్కడ గొలుసులను ఉంగరాలపై ఉంచడం కంటే వాటికి బిగించడం లేదా జతచేయడం అనే సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘ఉంగరాలకు ... అమర్చాలి’ సహజమైన ప్రయోగం.
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: వక్షపతకం చివర్ల దగ్గర
  rationale: קְצֹוֹת అంటే చివర్లు లేదా అంచులు. אֶל యొక్క దిశా/స్థాన భావాన్ని ‘దగ్గర’ నిలుపుతుంది. חֹשֶׁן యాజక వస్త్రంలోని ఛాతీపై ధరించే ప్రత్యేక భాగం; కవచమనే అపార్థం రాకుండా ‘వక్షపతకం’ ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ నిర్దేశానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘వక్షపతకం’ అనే పదం యాజక వస్త్రంలోని ప్రత్యేక అలంకార భాగాన్ని సూచిస్తుంది; యుద్ధ కవచమనే భావాన్ని నివారిస్తుంది.
