- from: నీలి రంగు దారానికి[a] దానిని కట్టు; అది తలపాగాపై ఉండాలి. అది తలపాగా ముందువైపున[b] ఉండాలి.
  to: నీలి దారానికి[a] దానిని అమర్చు; అది తలపాగాపై ఉండాలి. అది తలపాగా ముందువైపున[b] ఉండాలి.
