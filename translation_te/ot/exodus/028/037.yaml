  edition: WLC
  text: וְ/שַׂמְתָּ֤ אֹת/וֹ֙ עַל פְּתִ֣יל תְּכֵ֔לֶת וְ/הָיָ֖ה עַל הַ/מִּצְנָ֑פֶת אֶל מ֥וּל פְּנֵֽי הַ/מִּצְנֶ֖פֶת יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: te
  text: నీలి దారానికి[a] దానిని అమర్చు; అది తలపాగాపై ఉండాలి. అది తలపాగా ముందువైపున[b] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీలి రంగు తాడు’ లేదా ‘నీలి రంగు తీగ.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం అక్షరార్థంగా తలపాగా ముందు భాగం వైపు లేదా దానికి ఎదురుగా ఉన్న స్థానాన్ని సూచిస్తుంది; అంటే, దాని ముందు భాగంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: దానిని కట్టు
  rationale: שׂים సాధారణంగా ‘పెట్టు/ఉంచు’ అని అర్థం. అయితే ఇక్కడ పలకను దారంతో తలపాగాకు అమర్చే సందర్భం కాబట్టి, తెలుగులో సహజంగా మరియు సందర్భానికి తగినట్లు ‘కట్టు’ అని అనువదించాం.
- source_word: פְּתִיל
  choice: దారం
  rationale: ఈ పదం బిగించడానికి ఉపయోగించే దారం, తాడు లేదా తీగను సూచిస్తుంది. వస్త్రసంబంధ సందర్భంలో ఆధునిక తెలుగులో ‘దారం’ సహజమైన ఎంపిక; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: תְּכֵלֶת
  choice: నీలి రంగు
  rationale: ఇది పరిశుద్ధ మందిరపు వస్త్రాలలో వాడిన విలువైన ప్రత్యేక నీలి వర్ణాన్ని సూచిస్తుంది. దాని ఖచ్చితమైన వర్ణఛాయ అనిశ్చితమైనందున సాధారణమైన ‘నీలి రంగు’ను ఎంచుకున్నాం.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: అది తలపాగాపై ఉండాలి
  rationale: מִצְנֶפֶת ప్రధాన యాజకుడు ధరించే చుట్టిన శిరోవస్త్రం. ‘తలపాగా’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: తలపాగా ముందువైపున
  rationale: హీబ్రూ పదబంధం తలపాగా ముఖానికి ఎదురుగా లేదా దాని ముందు భాగం వైపు ఉండే స్థానాన్ని సూచిస్తుంది. సహజ తెలుగులో ‘ముందువైపున’ ఆ స్థానాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థపు దిశాభావాన్ని పాదసూచికలో నమోదు చేశాం.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: చివరి క్రియ ముందే చెప్పిన స్థానాన్ని మళ్లీ నిర్దేశిస్తుంది. ‘ఉండాలి’ ఆ ఆదేశాత్మక భావాన్ని, హీబ్రూలోని పునరుక్తిని నిలుపుతుంది.
