translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆదేశాత్మక శైలిని మరియు మూలంలోని స్థానవివరణ పునరుక్తిని నిలుపుతూ రూపొందించాం. ‘తలపాగా’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; సాంకేతికమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
