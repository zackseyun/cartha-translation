  yaml_path: translation/ot/exodus/028/023.yaml
  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: te
  text: నీవు రొమ్ముపతకంపై రెండు బంగారు ఉంగరాలు చేయాలి; ఆ రెండు ఉంగరాలను రొమ్ముపతకపు రెండు చివరలపై ఉంచాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేసి
  rationale: ఆదేశాల వరుసలో సంయోజకాక్షరంతో వచ్చిన ఈ క్రియ ఆజ్ఞార్థక భావాన్ని కలిగి ఉంది; తరువాతి ‘అమర్చాలి’తో కలిపి తెలుగులో సహజమైన నిర్దేశ వాక్యంగా అనువదించబడింది.
- source_word: עַל הַחֹשֶׁן
  choice: వక్షపతకం మీద
  rationale: עַל ఇక్కడ వస్తువుకు ఉంగరాలను జతచేసే స్థానాన్ని సూచిస్తుంది. חֹשֶׁן యాజకుడు ఛాతీపై ధరించే ప్రత్యేక పతకం కాబట్టి ‘వక్షపతకం’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: రెండు బంగారు ఉంగరాలు
  rationale: זָהָב ఉంగరాలు ఏ పదార్థంతో చేయబడాలో తెలుపుతుంది; ‘బంగారు ఉంగరాలు’ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: וְנָתַתָּ
  choice: అమర్చాలి
  rationale: ఈ నిర్మాణ సూచనలో క్రియ సాధారణంగా ఉంచడం కంటే వస్తువుకు బిగించి పెట్టడాన్ని సూచిస్తుంది; ‘అమర్చాలి’ సందర్భానుకూలమైన ఆదేశార్థాన్ని ఇస్తుంది.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: వక్షపతకం రెండు చివరల మీద
  rationale: קָצֶה అంచు లేదా అంత్యభాగాన్ని సూచిస్తుంది. మూలంలోని ‘రెండు’ అనే స్పష్టతను నిలుపుతూ ‘రెండు చివరలు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన నిర్మాణ-ఆదేశ శైలి వాడబడింది. మూలంలోని ఏకవచన సంబోధనను ‘నీవు’తో నిలిపి, రెండు క్రియలను తెలుగులో సహజమైన సంయుక్త ఆదేశంగా మలిచాం.
