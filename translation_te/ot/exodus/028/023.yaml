review_pass:
  verdict: revise
  source_fidelity: The draft conveys both commanded actions, the two gold rings, and their placement at the breastpiece's two ends. However, joining the first action as చేసి with a later impersonal obligation weakens the Hebrew's two parallel directives.
  naturalness: ‘నీవు ... చేసి, ... అమర్చాలి’ mixes a second-person subject with an impersonal obligation and is not smooth modern standard Telugu. Two parallel ‘చేయాలి/ఉంచాలి’ clauses are clear procedural Telugu.
  terminology: ‘రొమ్ముపతకం’ is the clearer established Telugu rendering for the priestly breastpiece. ‘ఉంచాలి’ directly represents נתן (‘put/place’) without adding the potentially stronger sense of fastening implied by ‘అమర్చాలి’.
  issues:
  - severity: medium
    issue: Mixed directive construction
    rationale: The wording ‘నీవు ... చేసి, ... అమర్చాలి’ makes the first act dependent on a participial form while the second is impersonal. The Hebrew presents two coordinated instructional verbs.
  - severity: low
    issue: Placement verb is overly specific
    rationale: ‘అమర్చాలి’ can imply fitting or fastening, whereas the Hebrew simply says to put/place the rings.
  - severity: low
    issue: Breastpiece term could be more recognizable
    rationale: ‘రొమ్ముపతకం’ is more established and readily understood in Telugu biblical terminology than ‘వక్షపతకం’.
  revised_text: నీవు రొమ్ముపతకంపై రెండు బంగారు ఉంగరాలు చేయాలి; ఆ రెండు ఉంగరాలను రొమ్ముపతకపు రెండు చివరలపై ఉంచాలి.
  revised_footnotes: []
  revision_rationale: The revision retains the repeated reference to the breastpiece, both occurrences of ‘two,’ the gold material, and the spatial sense ‘on ... ends.’ It uses parallel modern Telugu instructions and a direct placement verb corresponding to the Hebrew.
