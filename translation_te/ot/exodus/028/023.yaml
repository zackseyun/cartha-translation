- from: నీవు వక్షపతకం మీద రెండు బంగారు ఉంగరాలు చేసి, ఆ రెండు ఉంగరాలను వక్షపతకం రెండు చివరల మీద అమర్చాలి.
  to: నీవు రొమ్ముపతకంపై రెండు బంగారు ఉంగరాలు చేయాలి; ఆ రెండు ఉంగరాలను రొమ్ముపతకపు రెండు చివరలపై ఉంచాలి.
