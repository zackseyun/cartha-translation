source:
  edition: WLC
  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: te
  text: అవి అహరోనుపై, అతని కుమారులపై ఉండాలి. వారు సమాగమ గుడారంలోకి ప్రవేశించేటప్పుడు గానీ, పరిశుద్ధస్థలంలో సేవ చేయడానికి బలిపీఠం దగ్గరకు వచ్చేటప్పుడు గానీ, దోషభారాన్ని మోసి[a] చనిపోకుండా ఉండేందుకు అవి వారిపై ఉండాలి. ఇది అతనికీ, అతని తరువాతి సంతానానికీ శాశ్వత నియమంగా[b] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దోషానికి బాధ్యులు కాకుండా.’ ‘దోషభారం మోయడం’ అనేది హీబ్రూలో న్యాయ-ఆరాధనా సంబంధమైన నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నిరంతర నియమంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: అవి వారికి మీద ఉండాలి
  rationale: ముందరి వచనంలోని వస్త్రాలను సూచించే బహువచనాన్ని నిలుపుతూ, న్యాయనియమంలోని ఆదేశ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: מוֹעֵד లోని సమావేశ భావాన్ని, యాజకసేవకు సంబంధించిన గుడారపు సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరికి వచ్చేటప్పుడు
  rationale: נגשׁ యొక్క పవిత్ర సేవార్థమైన సమీపింపును సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే విధంగా తెలియజేస్తుంది.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో సేవ చేయడానికి
  rationale: యాజక సంబంధమైన సేవను, קֹדֶשׁ లోని పరిశుద్ధత భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְלֹא יִשְׂאוּ עָוֺן וָמֵתוּ
  choice: అప్పుడు వారు దోషాన్ని మోసి చనిపోరు
  rationale: נשׂא עון అనే న్యాయ-ఆరాధనా జాతీయాన్ని అక్షరార్థానికి దగ్గరగా ఉంచి, వస్త్రధారణ వల్ల నివారించబడే పరిణామాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన కట్టడ
  rationale: దీర్ఘకాలం వర్తించే నిర్దేశిత నియమం అనే భావాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో అందిస్తుంది.
- source_word: זַרְעוֹ
  choice: అతని సంతానం
  rationale: హీబ్రూ ఏకవచన సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: నియమించిన వస్త్రాలు ధరించకుండా పవిత్ర సేవకు సమీపించడం వల్ల కలిగే శిక్ష
  choice: యాజకులు దోషాన్ని మోసి చనిపోయే వాస్తవ పరిణామాన్ని నేరుగా ఉంచడం
  alternative: వారు దోషానికి పాల్పడి చనిపోకుండా అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం పవిత్రతను అతిక్రమించడానికున్న న్యాయ-ఆరాధనా బాధ్యతను, మరణ పరిణామాన్ని కలిపి చెబుతుంది; అనువాదం ఆ తీవ్రతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘దోషాన్ని మోయడం’ అనే మూలభాషా నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. మూలంలోని అన్ని పాదసూచిక సూచికలను సంబంధిత పదబంధాల వెంట ఉంచాం.
