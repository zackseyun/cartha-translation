revisions:
- from: అహరోను, అతని కుమారులు సమావేశపు గుడారంలోకి ప్రవేశించేటప్పుడు గానీ, పరిశుద్ధ స్థలంలో సేవ చేయడానికి బలిపీఠం దగ్గరికి వచ్చేటప్పుడు గానీ, అవి వారికి మీద ఉండాలి. అప్పుడు వారు దోషాన్ని మోసి[a] చనిపోరు. ఇది అతనికి, అతని తరువాత అతని సంతానానికి శాశ్వతమైన కట్టడగా[b] ఉండాలి.
  to: అవి అహరోనుపై, అతని కుమారులపై ఉండాలి. వారు సమాగమ గుడారంలోకి ప్రవేశించేటప్పుడు గానీ, పరిశుద్ధస్థలంలో సేవ చేయడానికి బలిపీఠం దగ్గరకు వచ్చేటప్పుడు గానీ, దోషభారాన్ని మోసి[a] చనిపోకుండా ఉండేందుకు అవి వారిపై ఉండాలి. ఇది అతనికీ, అతని తరువాతి సంతానానికీ శాశ్వత నియమంగా[b] ఉండాలి.
  rationale: వస్త్రాల సూచనను మరియు ధరించాల్సిన సందర్భాన్ని స్పష్టంగా చేశాం; హీబ్రూ నిషేధ-పర్యవసాన భావాన్ని తెలుగులో ‘దోషభారాన్ని మోసి చనిపోకుండా ఉండేందుకు’ అని సహజంగా, తీవ్రత తగ్గకుండా వ్యక్తం చేశాం. స్థిరమైన ఆరాధనా పదజాలాన్ని వాడి, חֻקַּת עוֹלָם‌ను ‘శాశ్వత నియమం’గా సరిచేశాం. పాదసూచికలు సంబంధిత పదబంధాలకే జతచేయబడ్డాయి.
