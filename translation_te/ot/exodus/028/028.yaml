translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞారూప శైలి వాడబడింది. ‘ఏఫోదు’ సంప్రదాయ వస్త్రనామంగా లిప్యంతరీకరించబడింది. హీబ్రూలోని అరుదైన יִזַּח క్రియకు ఉన్న కదలిపోవడం/విడిపోవడం అనే భావ పరిధిని ప్రధాన పాఠం మరియు పాదటీపు కలిసి నిలుపుతున్నాయి.
