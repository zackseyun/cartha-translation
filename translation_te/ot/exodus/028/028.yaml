source:
  edition: WLC
  text: וְ/יִרְכְּס֣וּ אֶת הַ֠/חֹשֶׁן מ/טבעת/ו אֶל טַבְּעֹ֤ת הָ/אֵפֹד֙ בִּ/פְתִ֣יל תְּכֵ֔לֶת לִֽ/הְי֖וֹת עַל חֵ֣שֶׁב הָ/אֵפ֑וֹד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: te
  text: వక్షపటాన్ని[a] దాని ఉంగరాల ద్వారా ఏఫోదు ఉంగరాలకు నీలి నూలు తాడుతో[b] కట్టాలి; అది ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు మీద ఉండేలా చేయాలి. వక్షపటం ఏఫోదు మీదనుండి తొలగిపోకూడదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రొమ్ముపటం’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం ఏఫోదుకు అమర్చిన యాజకుని ఛాతీ వస్త్రభాగాన్ని సూచిస్తుంది; యుద్ధంలో ధరించే కవచాన్ని కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీలి తాడుతో.’ హీబ్రూ పదం పరిశుద్ధ గుడారం, యాజక వస్త్రాల తయారీలో ఉపయోగించిన నీలి రంగు పదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వక్షపటం ఏఫోదు మీద తన స్థానం తప్పకూడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: కట్టాలి
  rationale: ఈ క్రియ ఉంగరాలు, తాడు ఉపయోగించి రెండు భాగాలను కలిపి భద్రపరచడాన్ని సూచిస్తుంది. ‘కట్టాలి’ సహజమైన ఆధునిక తెలుగు; కట్టే నిర్దిష్ట పద్ధతిని అనవసరంగా నిర్ణయించదు.
- source_word: הַחֹשֶׁן
  choice: వక్షపటం
  rationale: ఇది యాజక వస్త్రంలో ఛాతీపై ధరించే ప్రత్యేక భాగం; యుద్ధ కవచం కాదు. ‘వక్షపటం’ గౌరవప్రదంగా, సంక్షిప్తంగా ఈ వస్త్రభాగాన్ని సూచిస్తుంది.
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: దాని ఉంగరాల నుంచి ఏఫోదు ఉంగరాలకు
  rationale: מִן…אֶל నిర్మాణంలోని అనుసంధాన దిశను—వక్షపటం ఉంగరాల నుంచి ఏఫోదు ఉంగరాలకు—స్పష్టంగా నిలుపుతుంది.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: నీలి నూలు తాడుతో
  rationale: פְּתִיל తాడు లేదా దారాన్ని, תְּכֵלֶת పరిశుద్ధ గుడారం మరియు యాజక వస్త్రాల్లో వాడిన నీలి రంగు పదార్థాన్ని సూచిస్తాయి. ‘నీలి నూలు తాడు’ వస్త్ర సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִהְיוֹת עַל
  choice: మీద ఉంటుంది
  rationale: హీబ్రూ వాక్యం ఉద్దేశం లేదా ఫలితంగా ఏర్పడే స్థానాన్ని సాదాసీదాగా చెబుతుంది. అదనంగా ‘ఆనుకొని ఉంటుంది’ వంటి భావాన్ని చేర్చకుండా స్థాన సంబంధాన్ని నిలుపుతుంది.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు
  rationale: ఈ సందర్భంలో חֵשֶׁב ఏఫోదుతో కూడిన నేసిన బిగింపు పట్టీ లేదా నడికట్టును సూచిస్తుంది. సమీప వస్త్ర వివరణకు అనుగుణంగా ‘నైపుణ్యంగా నేసిన నడికట్టు’ పాఠకునికి దాని పనిని స్పష్టం చేస్తుంది.
- source_word: וְלֹא יִזַּח
  choice: విడిపోకూడదు
  rationale: ఈ అరుదైన క్రియ ఏఫోదు మీదున్న స్థానంనుంచి వక్షపటం కదలిపోవడం లేదా తొలగిపోవడాన్ని సూచిస్తుంది. బిగింపు సందర్భంలో ‘విడిపోకూడదు’ సహజంగా ఉంటుంది; ‘స్థానం తప్పకూడదు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటీపులో నిలిపాం.
- source_word: מֵעַל הָאֵפֹד
  choice: ఏఫోదు నుంచి
  rationale: ఏఫోదు మీదున్న స్థానం నుంచి వేరుపడటాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
