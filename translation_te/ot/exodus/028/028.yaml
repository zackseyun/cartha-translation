- from: వక్షపటాన్ని[a] దాని ఉంగరాల నుంచి ఏఫోదు ఉంగరాలకు నీలి నూలు తాడుతో[b] కట్టాలి. అప్పుడు అది ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు మీద ఉంటుంది; వక్షపటం ఏఫోదు నుంచి విడిపోకూడదు[c].
  to: వక్షపటాన్ని[a] దాని ఉంగరాల ద్వారా ఏఫోదు ఉంగరాలకు నీలి నూలు తాడుతో[b] కట్టాలి; అది ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు మీద ఉండేలా చేయాలి. వక్షపటం ఏఫోదు మీదనుండి తొలగిపోకూడదు[c].
