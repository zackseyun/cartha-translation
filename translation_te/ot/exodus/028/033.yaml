source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: te
  text: దాని అంచున చుట్టూ నీలం, ఊదా, స్కార్లెట్ రంగుల నూలుతో దానిమ్మ పండ్లను[a] చేయాలి; దాని అంచున చుట్టూ వాటి మధ్యలో బంగారు గంటలను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిమ్మ పండు ఆకారపు అలంకారాలను.’ హెబ్రీలో అక్షరార్థంగా ‘దానిమ్మ పండ్లు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: ఆరాధనా వస్త్రం తయారీకి సంబంధించిన ఆజ్ఞ సందర్భంలో, సంయోజక వావ్‌తో వచ్చిన ఖల్ సంపూర్ణ క్రియ ఆదేశార్థాన్ని కలిగిస్తుంది. ఆధునిక తెలుగు నియమభాషలో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: שׁוּלָיו
  choice: దాని అంచు
  rationale: ఇది వస్త్రపు కింది అంచును సూచిస్తుంది. ‘అంచు’ సాధారణ ఆధునిక తెలుగులో సహజమైన పదం; ‘దాని’ అనేది ముందున్న అంగీని సూచిస్తుంది.
- source_word: רִמֹּנֵי
  choice: దానిమ్మ పండ్లను
  rationale: హెబ్రీ నామవాచకానికి అక్షరార్థం ‘దానిమ్మ పండ్లు.’ సందర్భంలో ఇవి దానిమ్మ ఆకారపు వస్త్ర అలంకారాలు కావచ్చు; అయినా మూలంలోని సరళ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: పరిశుద్ధ గుడారపు వస్త్రాలలో వాడే విలువైన నీలి రంగు పదార్థాన్ని సూచిస్తుంది. ‘నూలుతో’ అనే పదం రంగుల వరుస చివర ఉంచడం ద్వారా వస్త్రార్థం తెలుగులో స్పష్టమవుతుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: పరిశుద్ధ గుడారపు వస్త్ర వివరణల్లో వచ్చే ప్రామాణిక ఊదా రంగు పదార్థాన్ని సహజమైన ఆధునిక తెలుగు రంగు పదంతో అనువదించాం.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ పదబంధం గాఢ ఎరుపు లేదా స్కార్లెట్ రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ‘ఎర్రని నూలు’ అని ఇచ్చాం.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అంగీ అంచు మొత్తాన్ని పరివేష్టించే అమరికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది. మూలంలో రెండుసార్లు వచ్చిన పదానికి అనుగుణంగా తెలుగులోనూ రెండు వాక్యాల్లో ‘చుట్టూ’ నిలిపాం.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: బంగారు గంటలను
  rationale: అదనంగా అమర్చవలసిన అలంకార భాగాలను సూచిస్తుంది. ‘బంగారు గంటలు’ అనేది పదార్థాన్ని సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: בְּתוֹכָם
  choice: వాటి మధ్యలో
  rationale: గంటలు దానిమ్మ పండ్ల మధ్య లేదా వాటి నడుమ అమర్చబడాలని సూచిస్తుంది. ‘వాటి మధ్యలో’ మూలంలోని స్థల సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
