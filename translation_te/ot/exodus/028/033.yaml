translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా వస్త్ర తయారీకి సంబంధించిన ఆదేశ స్వరాన్ని నిలిపాం. పొడవైన హెబ్రీ వాక్యాన్ని పఠన సౌలభ్యం కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; రంగు పదార్థాలన్నిటికీ వర్తించేలా ‘నూలుతో’ను వరుస చివర ఉంచాం.
