- from: దాని అంచు చుట్టూ నీలం, ఊదా, ఎర్రని నూలుతో దానిమ్మ పండ్లను[a] చేయాలి. వాటి మధ్యలో చుట్టూ బంగారు గంటలను అమర్చాలి.
  to: దాని అంచున చుట్టూ నీలం, ఊదా, స్కార్లెట్ రంగుల నూలుతో దానిమ్మ పండ్లను[a] చేయాలి; దాని అంచున చుట్టూ వాటి మధ్యలో బంగారు గంటలను అమర్చాలి.
  rationale: The revision retains the Hebrew’s literal ‘pomegranates’ in the main text, maintains both references to the hem-wide arrangement, and expresses the bells’ placement among the pomegranates in idiomatic Telugu. It also renders the scarlet textile term more precisely, without imposing an interpretation of the ornaments.
