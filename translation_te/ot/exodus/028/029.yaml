  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: te
  text: అహరోను పరిశుద్ధ స్థలంలోకి ప్రవేశించినప్పుడు, ఇశ్రాయేలు కుమారుల పేర్లను న్యాయనిర్ణయ వక్షపటంలో[b] తన హృదయంపై యాహ్వే సన్నిధిలో ఎల్లప్పుడూ జ్ఞాపకార్థంగా[c] మోస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భరిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: “న్యాయనిర్ణయ వక్షపటం” అనే హెబ్రీ పేరు దేవుని ఎదుట తీర్పు లేదా నిర్ణయంతో సంబంధమున్న యాజక వక్షపటాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “స్మారకార్థంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: మోస్తాడు
  rationale: נשא అంటే ‘మోయడం/ధరించడం.’ యాజక వస్త్రాన్ని శరీరంపై ధరించి ప్రతినిధిత్వం వహించే భావాన్ని ‘మోస్తాడు’ సహజంగా నిలుపుతుంది.
- source_word: שְׁמוֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పేర్లను
  rationale: హెబ్రీ మూలంలోని వంశావళి వ్యక్తీకరణను, చెక్కబడిన పేర్లనే సూచిస్తున్న స్పష్టతను నిలుపుతుంది.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: న్యాయనిర్ణయ వక్షపటంలో
  rationale: חֹשֶׁן అనే యాజక వస్త్రభాగానికి ‘వక్షపటం’ సరిపోతుంది; מִשְׁפָּט లోని తీర్పు/నిర్ణయం అనే ఉద్దేశపూర్వక అస్పష్టతను ‘న్యాయనిర్ణయ’ నిలుపుతుంది.
- source_word: עַל לִבּוֹ
  choice: తన హృదయం మీద
  rationale: వస్త్రపు స్థానం మరియు ప్రతీకాత్మక హృదయచిత్రం రెండింటినీ నేరుగా నిలుపుతుంది.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలోకి ప్రవేశించినప్పుడు
  rationale: בְּ + infinitive కాలార్థాన్ని ‘ప్రవేశించినప్పుడు’ తెలియజేస్తుంది; הַקֹּדֶשׁ గుడారంలోని పవిత్ర ప్రదేశాన్ని సూచిస్తుంది.
- source_word: לְזִכָּרֹן
  choice: జ్ఞాపకార్థంగా
  rationale: దేవుని సన్నిధిలో జ్ఞాపకం/స్మారకంగా ఉండే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘ముందు/సన్నిధిలో’ అనే హెబ్రీ నుడికారాన్ని సహజంగా అందిస్తుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: ఆచార సంబంధమైన నిరంతర లేదా క్రమమైన కొనసాగింపును సులభంగా తెలియజేస్తుంది.
theological_decisions:
- issue: חֹשֶׁן הַמִּשְׁפָּט అనే యాజక వస్తువు పేరు
  choice: న్యాయనిర్ణయ వక్షపటం
  alternative: నిర్ణయ వక్షపటం; తీర్పు వక్షపటం
  rationale: ఈ పదబంధం దేవుని తీర్పు లేదా నిర్ణయంతో సంబంధమున్న ప్రత్యేక యాజక వస్తువును సూచిస్తుంది. ఒకే కార్యవివరణకు అర్థాన్ని కుదించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క వంశావళి రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ వంశావళి వ్యక్తీకరణను నిలుపుతూ, సందర్భంలో ఇశ్రాయేలు గోత్రాలకు ప్రతినిధులైన పేర్లను సూచిస్తుంది.
- issue: לְזִכָּרֹן לִפְנֵי יְהוָה వాక్యసంబంధం
  choice: అవి యెహోవా సన్నిధిలో ఎల్లప్పుడూ జ్ఞాపకార్థంగా ఉంటాయి
  alternative: యెహోవా సన్నిధిలో ఎల్లప్పుడూ జ్ఞాపకార్థంగా అతడు వాటిని మోస్తాడు
  rationale: జ్ఞాపకార్థం అనే భావం పేర్లు/వక్షపటం ద్వారా దేవుని సన్నిధిలో నిలిచేలా ప్రధాన పఠనాన్ని సహజంగా వ్యక్తం చేస్తుంది; అది మోయడాన్ని విశేషించే పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వక్షపటం’ వంటి ఆచారపరమైన పదానికి పాదసూచిక వివరణ ఇచ్చి, మూలంలోని తీర్పు/నిర్ణయం మరియు జ్ఞాపకార్థ వాక్యసంబంధ అస్పష్టతలను తొలగించలేదు.
