  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: te
  text: ఆ రెండు రాళ్లను ఏఫోదు భుజపు పట్టీల మీద ఇశ్రాయేలు కుమారుల కొరకు స్మారక రాళ్లుగా[a] అమర్చాలి. అహరోను వారి పేర్లను తన రెండు భుజాల మీద యాహ్వే[b] సమక్షంలో జ్ఞాపకార్థంగా మోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘జ్ఞాపకపు రాళ్లు.’ ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబ సంబంధ పదబంధం ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'హెబ్రీ: యెహ్వె (YHWH), దైవనామం; ఇక్కడ ‘యాహ్వే’గా అనువదించబడింది.'
    reason: divine_name_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: ఉంచాలి
  rationale: שׂים అంటే ఉంచడం లేదా అమర్చడం. యాజక వస్త్రంపై రాళ్లను అమర్చే సందర్భానికి ‘ఉంచాలి’ సహజంగా ఉండి, హెబ్రీ ఆదేశ భావాన్ని నిలుపుతుంది.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: ఆ రెండు రాళ్లను
  rationale: మూలంలో నిర్దిష్టమైన ‘రెండు రాళ్లు’ అని మాత్రమే ఉంది; వాటి రకం ముందరి సందర్భంలో చెప్పబడినందున ఇక్కడ అదనంగా చేర్చలేదు.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: ఏఫోదు భుజపు పట్టీల మీద
  rationale: כָּתֵף ప్రాథమికంగా ‘భుజం’; వస్త్ర సందర్భంలో ఏఫోదును భుజాలపై కలిపే భాగాలను సూచిస్తుంది. ‘భుజపు పట్టీలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אַבְנֵי זִכָּרֹן
  choice: జ్ఞాపకార్థ రాళ్లుగా
  rationale: ఈ నిర్మాణం ‘జ్ఞాపకపు రాళ్లు/జ్ఞాపకార్థ రాళ్లు’ అని అర్థం. ‘జ్ఞాపకార్థ రాళ్లు’ సంక్షిప్తంగా, సహజంగా వాటి స్మారక పాత్రను తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: בְּנֵי అనే కుటుంబ సంబంధ పదాన్ని ‘కుమారులు’గా నిలిపి, ఇశ్రాయేలు సంతతి అనే నిబంధనా భావాన్ని సంరక్షిస్తుంది.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: అహరోను వారి పేర్లను ... మోయాలి
  rationale: נשׂא అంటే ‘మోయడం/భరించడం.’ పేర్లు చెక్కిన రాళ్లను ప్రతినిధిగా మోసే యాజక సందర్భంలో ‘మోయాలి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ముందు/సన్నిధిలో.’ దేవుని సమక్షాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘సన్నిధిలో’ ఎంచుకున్నాం.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: తన రెండు భుజాల మీద
  rationale: ఇక్కడ ఏఫోదు భాగాలు కాక అహరోను స్వంత భుజాలే ఉద్దేశించబడ్డాయి; హెబ్రీలోని ‘రెండు’ అనే స్పష్టతను నిలిపాం.
- source_word: לְזִכָּרֹן
  choice: జ్ఞాపకార్థంగా
  rationale: ఈ పదబంధం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ఎవరి జ్ఞాపకమో మూలం స్పష్టంగా చెప్పనందున ‘జ్ఞాపకార్థంగా’ ఆ అనిశ్చితిని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హెబ్రీలో నిబంధనా దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే పేరురూపమైన ‘యెహోవా’ను వాడి, దానిని బిరుదుగా మార్చకుండా ఉంచాం; మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక కుటుంబ పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘కుమారులు’ అనే కుటుంబ, వంశ సంబంధ భాషను ప్రధాన పాఠ్యంలో నిలిపాం. సందర్భంలో అది ఇశ్రాయేలు ప్రజల సమష్టిని, గోత్రాలను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- issue: జ్ఞాపకం ఎవరిది అనే ప్రశ్న
  choice: జ్ఞాపకార్థంగా
  alternative: యెహోవా జ్ఞాపకం చేసుకునేలా
  rationale: לְזִכָּרֹן ఎవరు జ్ఞాపకం చేసుకుంటారో స్పష్టంగా నిర్దేశించదు. అందువల్ల దేవుని జ్ఞాపకమని గానీ, ప్రజల జ్ఞాపకమని గానీ పాఠ్యంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘ఏఫోదు’ అనే యాజక వస్త్ర సాంకేతిక పదాన్ని లిప్యంతరీకరించి, దాని భుజ భాగాలను ‘భుజపు పట్టీలు’గా స్పష్టం చేశాం. మూలంలోని ‘జ్ఞాపక’ పదపునరుక్తిని రెండు చోట్లా నిలిపాం.
