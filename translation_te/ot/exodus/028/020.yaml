revisions:
- from: నాలుగో వరుసలో తర్షీషు రాయి[a], గోమేధికం, యష్పే రాయి ఉండాలి. అవి బంగారు పొదుగులలో పొదగబడి ఉండాలి.
  to: 'నాలుగో వరుస: తర్షీషు, షోహము, యాష్ఫే రాళ్లు ఉండాలి; అవి బంగారు పొదుగులలో పొదగబడి ఉండాలి.'
  rationale: The revision consistently transliterates the three ancient gemstone names, avoiding an unsupported definite identification for שֹׁהַם while preserving the informative lexical-alternative footnote. It also improves the list syntax and retains the source’s constructional instruction that the stones be set in gold settings.
  reviewer_model: gpt-5.6-terra
