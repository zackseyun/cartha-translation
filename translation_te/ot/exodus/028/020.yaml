  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/טּוּר֙ הָ/רְבִיעִ֔י תַּרְשִׁ֥ישׁ וְ/שֹׁ֖הַם וְ/יָשְׁפֵ֑ה מְשֻׁבָּצִ֥ים זָהָ֛ב יִהְי֖וּ בְּ/מִלּוּאֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/020.yaml
  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: te
  text: 'నాలుగో వరుస: తర్షీషు, షోహము, యాష్ఫే రాళ్లు ఉండాలి; అవి బంగారు పొదుగులలో పొదగబడి ఉండాలి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: నాలుగో వరుసలో
  rationale: ఛాతీపటకంలోని రాళ్ల అమరికను సూచించే טוּר పదానికి సహజమైన ఆధునిక తెలుగు రూపం ‘వరుస’; సందర్భానుసారంగా జాబితాను తెలుగులో సులభంగా చదివేలా అధికరణ విభక్తితో ఇచ్చాం.
- source_word: תַּרְשִׁישׁ
  choice: తర్షీషు రాయి
  rationale: ఈ ప్రాచీన రత్నం ఏ ఖనిజమో ఖచ్చితంగా తెలియదు. ‘బెరిల్’ అని నిర్ణయించడం కంటే హీబ్రూ పేరును లిప్యంతరీకరించి, అది రాయి అని స్పష్టం చేయడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: וְשֹׁהַם
  choice: గోమేధికం
  rationale: שֹׁהַםకు సంప్రదాయంగా వాడే తెలుగు రత్ననామం; అయితే ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితమైనదని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וְיָשְׁפֵה
  choice: యష్పే రాయి
  rationale: మూలనామాన్ని ప్రతిబింబించే లిప్యంతరీకరణను ఎంచుకున్నాం; సాధారణంగా దీనిని జాస్పర్‌తో గుర్తించినా ఖచ్చితత్వాన్ని అతిశయంగా చూపలేదు.
- source_word: מְשֻׁבָּצִים
  choice: పొదగబడి
  rationale: రత్నాలను లోహపు అమరికల్లో బిగించి ఉంచే శిల్పక్రియను సూచించే సహజమైన తెలుగు పదం; హీబ్రూ నిష్క్రియ భావాన్ని నిలుపుతుంది.
- source_word: זָהָב
  choice: బంగారు
  rationale: పదార్థాన్ని నేరుగా, సహజమైన విశేషణ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: יִהְיוּ
  choice: ఉండాలి
  rationale: నిర్మాణానికి సంబంధించిన ఆదేశాత్మక నిర్దేశాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּמִלּוּאֹתָם
  choice: పొదుగులలో
  rationale: ఈ నగల పనితన సందర్భంలో రాళ్లను అమర్చే లోహపు settings లేదా mountings‌ను ‘పొదుగులు’ సహజంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. అనిశ్చితమైన ప్రాచీన రత్ననామాల విషయంలో ఆధునిక ఖనిజ గుర్తింపును నిర్దిష్టంగా రుద్దకుండా, అవసరమైన చోట లిప్యంతరీకరణతో పాటు పాదటిప్పణి ఇచ్చాం.
