source:
  edition: WLC
  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: te
  text: దానిలో తల దూర్చే రంధ్రం మధ్యలో ఉండాలి. ఆ రంధ్రం చుట్టూ నేతపనితో చేసిన అంచు ఉండాలి; ఆ అంచు కవచపు మెడ రంధ్రంలా[a] ఉండాలి, చిరగకుండా ఉండేందుకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యుద్ధకవచపు రంధ్రంలా,’ లేదా ‘ఛాతీకవచపు రంధ్రంలా.’ תַחְרָא అనే హీబ్రూ పదం అరుదైనది; ఇక్కడి పోలిక చిరగకుండా బలపరచిన మెడ రంధ్రంతో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: దాని తలదూర్చే రంధ్రం
  rationale: వస్త్ర సందర్భంలో פֶּה అనే ‘నోరు’ పదం రంధ్రాన్ని సూచిస్తుంది; רֹאשׁוֹతో కలిపి తల దూర్చే రంధ్రం అనే సహజమైన అర్థం వస్తుంది.
- source_word: בְּתוֹכוֹ
  choice: దాని మధ్యలో
  rationale: వస్త్రంలో రంధ్రం మధ్యభాగంలో ఉండాలనే స్థానార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: నేతపనితో చేసిన అంచు
  rationale: שָׂפָה ఇక్కడ రంధ్రం చుట్టూ ఉండే అంచును సూచిస్తుంది; מַעֲשֵׂה אֹרֵג దానిని నేతపనిగా వివరిస్తుంది.
- source_word: לְפִיו סָבִיב
  choice: ఆ రంధ్రం చుట్టూ
  rationale: పునరుక్తమైన פֶּה వస్త్రపు రంధ్రాన్నే సూచిస్తుంది; סָבִיב దాని చుట్టూ అన్న భావాన్ని ఇస్తుంది.
- source_word: כְּפִי תַחְרָא
  choice: కవచపు మెడ రంధ్రంలా[a]
  rationale: అరుదైన תַחְרָא ఒక కవచ వస్త్రాన్ని సూచించే అవకాశముంది. పోలిక చిరగకుండా బలపరచిన మెడ రంధ్రంతో ఉంది; పదంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: לֹא יִקָּרֵעַ
  choice: తద్వారా అది చిరిగిపోకుండా ఉంటుంది
  rationale: నిఫ్అల్ రూపంలోని నిష్క్రియ/ఫలితార్థాన్ని, ముందున్న నిర్మాణం ఉద్దేశించే చిరుగుదల నివారణగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వస్త్ర తయారీ సందర్భానికి తగిన స్పష్టమైన పదజాలం వాడబడింది. అరుదైన హీబ్రూ పదంలోని అనిశ్చితిని ప్రధాన పాఠంలో అతిగా వివరించకుండా పాదసూచికలో భద్రపరచాం.
