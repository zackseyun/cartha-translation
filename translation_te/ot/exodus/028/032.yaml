- from: దాని తలదూర్చే రంధ్రం దాని మధ్యలో ఉండాలి. ఆ రంధ్రం చుట్టూ నేతపనితో చేసిన అంచు ఉండాలి; అది కవచపు మెడ రంధ్రంలా[a] ఉండాలి, తద్వారా అది చిరిగిపోకుండా ఉంటుంది.
  to: దానిలో తల దూర్చే రంధ్రం మధ్యలో ఉండాలి. ఆ రంధ్రం చుట్టూ నేతపనితో చేసిన అంచు ఉండాలి; ఆ అంచు కవచపు మెడ రంధ్రంలా[a] ఉండాలి, చిరగకుండా ఉండేందుకు.
