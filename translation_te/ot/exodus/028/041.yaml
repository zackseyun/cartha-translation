source:
  edition: WLC
  text: וְ/הִלְבַּשְׁתָּ֤ אֹתָ/ם֙ אֶת אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/אֶת בָּנָ֖י/ו אִתּ֑/וֹ וּ/מָשַׁחְתָּ֨ אֹתָ֜/ם וּ/מִלֵּאתָ֧ אֶת יָדָ֛/ם וְ/קִדַּשְׁתָּ֥ אֹתָ֖/ם וְ/כִהֲנ֥וּ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: te
  text: నీ సోదరుడైన అహరోనుకూ, అతనితోపాటు అతని కుమారులకూ నీవు ఆ వస్త్రాలను తొడిగించాలి. వారికి అభిషేకం చేసి, వారిని యాజకులుగా నియమించి[a], పవిత్రపరచాలి. అప్పుడు వారు నాకు యాజకులుగా సేవ చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి చేతులను నింపి.” ఇది ఒకరిని యాజక సేవలో నియమించడం లేదా ప్రతిష్ఠించడం అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: ఆ వస్త్రాలను తొడిగించాలి
  rationale: לבשׁ హిఫీల్ రూపం వస్త్రాలు ధరింపజేయడాన్ని సూచిస్తుంది. ముందరి సందర్భంలో వివరించిన యాజక వస్త్రాలను స్పష్టంగా సూచించేందుకు సహజమైన తెలుగు ప్రయోగం వాడబడింది.
- source_word: אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: నీ సోదరుడైన అహరోనుకు, అతనితోపాటు అతని కుమారులకు
  rationale: హీబ్రూ వాక్యంలోని అహరోను మరియు అతనితో ఉన్న కుమారులు అనే సంబంధాన్ని సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: వారికి అభిషేకం చేసి
  rationale: משׁח యాజక ప్రతిష్ఠ సందర్భంలో నూనెతో అభిషేకించే ఆచారానికి సాంకేతిక పదం; ‘అభిషేకం’ దాని ఆచారపరమైన భావాన్ని నిలుపుతుంది.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: వారిని యాజకులుగా ప్రతిష్ఠించి
  rationale: అక్షరార్థంగా ‘వారి చేతులను నింపి’ అనే హీబ్రూ నుడికారం యాజక సేవలో అధికారికంగా నియమించడాన్ని సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు కార్యార్థక అనువాదం ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: పవిత్రపరచాలి
  rationale: קדשׁ ఇక్కడ పవిత్ర సేవ కోసం ప్రత్యేకంగా వేరుచేయడాన్ని సూచిస్తుంది; ‘పవిత్రపరచాలి’ ఈ భావాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: וְכִהֲנוּ לִי
  choice: వారు నాకు యాజకులుగా సేవ చేస్తారు
  rationale: כהן పియేల్ రూపం యాజకులుగా పనిచేయడం లేదా సేవ చేయడాన్ని సూచిస్తుంది; לִי లోని దేవునికి అర్పితమైన సేవ భావాన్ని ‘నాకు’ నిలుపుతుంది.
theological_decisions:
- issue: మִלֵּא אֶת־יָד అనే యాజక ప్రతిష్ఠ నుడికారాన్ని అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘వారిని యాజకులుగా ప్రతిష్ఠించి’
  alternative: ‘వారి చేతులను నింపి’
  rationale: ఈ మాటలు భౌతికంగా చేతులను నింపడం గురించి కాక, యాజక పదవిలో అధికారికంగా నిలపడం గురించి చెబుతాయి. ‘యాజకులుగా ప్రతిష్ఠించి’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇవ్వడం మూలభాష పారదర్శకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. యాజక ఆచారాలకు సంబంధించిన సాంకేతిక భావాలను నిలుపుతూ, తెలుగులో అపారదర్శకంగా ఉండే హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో కార్యార్థకంగా అనువదించాం.
