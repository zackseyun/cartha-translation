translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; దేవుని ఆదేశాన్ని ఏకవచన సంబోధనతో వ్యక్తపరిచే ‘నీవు ... చేయాలి’ నిర్మాణం వాడబడింది. నగల తయారీకి సంబంధించిన అరుదైన హీబ్రూ పదజాలాన్ని అతిగా సాంకేతికంగా కాకుండా, గౌరవప్రదంగా మరియు సాధారణ పాఠకుడికి అర్థమయ్యేలా అనువదించాం.
