  text: וּ/שְׁתֵּ֤י שַׁרְשְׁרֹת֙ זָהָ֣ב טָה֔וֹר מִגְבָּלֹ֛ת תַּעֲשֶׂ֥ה אֹתָ֖/ם מַעֲשֵׂ֣ה עֲבֹ֑ת וְ/נָתַתָּ֛ה אֶת שַׁרְשְׁרֹ֥ת הָ/עֲבֹתֹ֖ת עַל הַֽ/מִּשְׁבְּצֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/014.yaml
  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: te
  text: నీవు స్వచ్ఛమైన బంగారంతో రెండు గొలుసులను తాడులవలె మెలితిప్పిన పనిగా[a] చేయాలి; ఆ తాడులవలె మెలితిప్పిన గొలుసులను అమరికలపై[b] ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో తాడులవలె మెలితిప్పిన లేదా పేనిన పనిని సూచించే సంబంధమున్న రెండు పదప్రయోగాలు ఉన్నాయి. దీనిని ‘తాడు పనిగా’ లేదా ‘పేనిన పనిగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అమరికలు’ అనే పదాన్ని ‘చట్రాలు,’ ‘పొదిగింపు చట్రాలు,’ లేదా ‘బంగారు అమరికలు’ అని కూడా అనువదించవచ్చు. ఇవి యాజక వస్త్రానికి అమర్చిన బంగారు ఆధారాలను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో రెండు గొలుసులను
  rationale: సంఖ్య, వస్తువు, పదార్థం అన్నింటినీ స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన క్రమంలో అనువదించబడింది.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: తాడుల్లా మెలిపెట్టి చేసిన పనిగా
  rationale: ఈ అరుదైన పదప్రయోగం తాడు వంటి మెలితిప్పిన లేదా పేనిన నగిషీ పనిని సూచిస్తుంది. మూలంలోని పరస్పర సంబంధమున్న రెండు పదాల భావాన్ని సహజమైన తెలుగులో కలిపి వ్యక్తపరుస్తుంది.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: తాడులా మెలితిప్పిన ఆ గొలుసులను
  rationale: గొలుసుల తాడు వంటి నిర్మాణాన్ని మళ్లీ పేర్కొనే హీబ్రూ పునరుక్తిని నిలుపుతుంది.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: పొదిగే చట్రాలపై
  rationale: מִשְׁבְּצוֹת అనేది విలువైన రాళ్లను పట్టి ఉంచే బంగారు అమరికలు లేదా చట్రాలను సూచిస్తుంది; సందర్భంలో 'పొదిగే చట్రాలు' సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది.
- source_word: וְנָתַתָּ
  choice: అమర్చాలి
  rationale: '''ఉంచాలి'' అనే మౌలిక భావాన్ని వస్త్రాభరణాల సందర్భానికి తగిన సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; బిగించే నిర్దిష్ట విధానాన్ని అదనంగా ఊహించదు.'
