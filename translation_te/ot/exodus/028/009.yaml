id: EXO.28.9
reference: Exodus 28:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ֣קַחְתָּ֔ אֶת שְׁתֵּ֖י אַבְנֵי שֹׁ֑הַם וּ/פִתַּחְתָּ֣ עֲלֵי/הֶ֔ם שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: te
  text: నీవు రెండు గోమేధిక రాళ్లను[a] తీసుకొని, వాటిమీద ఇశ్రాయేలు కుమారుల పేర్లను చెక్కాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘షోహమ్’ ఒక విలువైన రాయిని సూచిస్తుంది. సంప్రదాయంగా దీనిని ‘గోమేధికం’ అని అనువదిస్తారు; అయితే అది ఏ రాయో ఖచ్చితంగా తెలియదు. ‘సార్డోనిక్స్’ లేదా ‘బెరిల్’ అని కూడా ప్రతిపాదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: నీవు ... తీసుకొని
  rationale: ఆదేశాల వరుసలో సంయోజక వావ్‌తో వచ్చిన ఈ క్రియ ఆజ్ఞార్థాన్ని కలిగి ఉంది. తెలుగులో తరువాతి ప్రధాన ఆజ్ఞతో కలిపి ‘తీసుకొని’ అనడం సహజంగా క్రమాన్ని నిలుపుతుంది.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: రెండు గోమేధిక రాళ్లను
  rationale: שֹׁהַם విలువైన రాయిని సూచిస్తుంది; దాని ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితం. సంప్రదాయంగా గుర్తింపుపొందిన ‘గోమేధికం’ను ప్రధాన పాఠ్యంలో ఉంచి, అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: וּפִתַּחְתָּ
  choice: చెక్కాలి
  rationale: రత్నాలపై పేర్లను కోసి లిఖించే సందర్భంలో ‘చెక్కాలి’ అనేది స్పష్టమైన, సహజమైన ఆధునిక తెలుగు పదం; ఇది ఆజ్ఞార్థాన్ని కూడా నిలుపుతుంది.
- source_word: עֲלֵיהֶם
  choice: వాటిమీద
  rationale: ఈ పదం రెండు రాళ్లను సూచించే సరళమైన స్థానసంబంధ పదబంధం; ‘వాటిమీద’ సహజమైన తెలుగు.
- source_word: שְׁמוֹת
  choice: పేర్లను
  rationale: చెక్కవలసిన నిర్దిష్ట పేర్లే సందర్భంలో స్పష్టంగా ఉన్నందున తెలుగు వ్యాకరణానికి అనుగుణంగా ‘పేర్లను’ వాడాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: ఇక్కడ ఈ పదబంధం సాధారణంగా ఇశ్రాయేలీయులందరిని కాకుండా, గోత్రాలకు మూలపురుషులైన ఇశ్రాయేలు కుమారులను సూచిస్తుంది; అందువల్ల ‘కుమారులు’ ఖచ్చితమైనది.
