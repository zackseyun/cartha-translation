translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని కార్య క్రమాన్ని సహజమైన తెలుగు సంయుక్త నిర్మాణంతో వ్యక్తం చేశాం; రాయి గుర్తింపులోని మూలభాషా అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
