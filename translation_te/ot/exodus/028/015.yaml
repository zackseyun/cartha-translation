id: EXO.28.15
reference: Exodus 28:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: te
  text: “న్యాయనిర్ణయపు వక్షపతకాన్ని[a] నైపుణ్యమైన కళాకారుని పనిగా చేయాలి. ఏఫోదు పనివలె దానిని చేయాలి. బంగారం, నీలి నూలు, ఊదా నూలు, స్కార్లెట్ రంగు నూలు, సన్నగా పేనిన నారతో దానిని చేయాలి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయనిర్ణయం కోసం వక్షపతకం,” లేదా “నిర్ణయపు వక్షపతకం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: వక్షపతకం
  rationale: ప్రధాన యాజకుడు ఛాతీపై ధరించే ప్రత్యేక అలంకార వస్తువును సూచిస్తుంది. ‘వక్షకవచం’ యుద్ధ కవచమనే అపార్థం కలిగించవచ్చు; ‘వక్షపతకం’ దాని ధరించే స్థానం, ప్రత్యేక స్వరూపం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయనిర్ణయపు
  rationale: న్యాయం, తీర్పు, నిర్ణయం అనే భావపరిధిని నిలుపుతూ, ఈ వచనం చెప్పని ఆచార విధానాన్ని నిర్దిష్టంగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంగల రూపకర్త పనిగా
  rationale: నమూనాను ఆలోచించి రూపొందించే నిపుణ శిల్పి పనిని సూచించే హీబ్రూ భావాన్ని, కేవలం నేయడానికే పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ఏఫోదును చేసినట్లే
  rationale: ఏఫోదుకు ఉపయోగించిన పనితనం లేదా తయారీ విధానంతో పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵפֹד
  choice: ఏఫోదు
  rationale: ప్రత్యేక యాజక వస్త్రానికి సమగ్ర తెలుగు సమానార్థకం లేనందున సాంకేతిక పదాన్ని లిప్యంతరీకరించాం.
- source_word: זָהָב
  choice: బంగారం
  rationale: నిర్మాణ సామగ్రిని సూచించే సాధారణ, స్పష్టమైన పదం.
- source_word: תְּכֵלֶת
  choice: నీలం నూలు
  rationale: గుడారపు వస్త్రాలలో వాడిన రంగు పదాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; జాబితా సందర్భం వల్ల ‘నూలు’ను సరఫరా చేశాం.
- source_word: אַרְגָּמָן
  choice: ఊదా నూలు
  rationale: విలువైన ఊదా రంగు వేసిన వస్త్ర నూలును సూచిస్తుంది; సమన్విత జాబితాలో సహజత కోసం ‘నూలు’ను సరఫరా చేశాం.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఎర్రని లేదా స్కార్లెట్ రంగు వేసిన దారాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆధునిక తెలుగు రూపం.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: నాణ్యమైన నారపోగులను పేని చేసిన వస్త్ర పదార్థమనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: దానిని చేయాలి ... దానిని చేయాలి
  rationale: హీబ్రూ ఆదేశ శైలిలోని క్రియ పునరుక్తిని తెలుగులోనూ నిలిపాం.
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט యొక్క కార్యార్థం
  choice: న్యాయనిర్ణయపు వక్షపతకం
  alternative: నిర్ణయం కోసం వక్షపతకం; తీర్పు వక్షపతకం
  rationale: ఈ పదబంధానికి యాజక సంబంధమైన న్యాయ లేదా దైవనిర్ణయ భావం ఉన్నా, ఈ వచనం దాని కార్యవిధానాన్ని వివరించదు. అందువల్ల సంబంధాన్ని అనువాదంలో నిలిపి, దానిని ఒక నిర్దిష్ట ప్రక్రియగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆదేశ శైలిని ఉపయోగించాం. యాజక వస్త్రానికి సంబంధించిన ‘ఏఫోదు’ అనే సాంకేతిక పదాన్ని నిలిపి, యుద్ధ కవచ భావాన్ని నివారించేందుకు ‘వక్షపతకం’ను ఎంచుకున్నాం. ప్రధాన వాక్యంలో ఉన్న [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
