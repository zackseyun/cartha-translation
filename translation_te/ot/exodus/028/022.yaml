  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: te
  text: వక్షపటంపై స్వచ్ఛమైన బంగారంతో తాడు అల్లికలా పేనిన గొలుసులను చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెలితిప్పిన గొలుసులను’ లేదా ‘తాడు ఆకారపు గొలుసులను’; హీబ్రూ పదాలు అల్లిన లేదా తాడులాంటి నమూనాలో చేసిన గొలుసులను వర్ణిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్దేశాల వరుసలో సంయోజకంతో వచ్చిన ఈ క్రియ ఆజ్ఞార్థక విధిని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַחֹשֶׁן
  choice: వక్షపటంపై
  rationale: עַל యొక్క ప్రాథమిక ‘మీద/పై’ భావాన్ని, గొలుసులు వక్షపటానికి అమర్చబడే సందర్భాన్ని ఇది సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שַׁרְשֹׁת
  choice: గొలుసులను
  rationale: ఆభరణ-నిర్మాణ సందర్భంలో ఈ బహువచన నామవాచకానికి ‘గొలుసులు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: తాడు అల్లికలా పేనిన
  rationale: ఈ అరుదైన నిర్మాణవివరణలోని కట్టిన, మెలితిప్పిన లేదా అల్లిన తాడు వంటి పనితనాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: పరిశుద్ధ గుడార నిర్మాణ నిర్దేశాల్లో పదార్థాన్ని సూచించే ఈ సాధారణ పదబంధానికి ఇది సూటిగా, సహజంగా ఉన్న అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వక్షపటం’ యాజక వస్త్రంలోని breastpiece‌ను సూచించే స్థిరమైన సందర్భోచిత పదంగా వాడబడింది; అరుదైన హీబ్రూ పనితన పదాల అనిశ్చితిని పాదసూచికలో నిలుపుకున్నాం.
