  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పదార్థాల జాబితాలో వస్త్ర సందర్భం స్పష్టమయ్యేలా రంగు పదాలకు ‘నూలు’ చేర్చాం; హీబ్రూ పదాల విస్తృత భావాన్ని పాదసూచనలో నిలిపాం.
