  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: te
  text: వారు బంగారాన్ని, నీలిరంగు నూలును[a], ఊదారంగు నూలును, కెంపు రంగు నూలును[b], సన్నని నారవస్త్రాన్ని తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీలిరంగు,’ ‘ఊదారంగు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదాలు కేవలం రంగులను మాత్రమే కాక, ఆ రంగులు అద్దిన వస్త్ర పదార్థాన్ని కూడా సూచించగలవు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘పురుగు యొక్క స్కార్లెట్’; ఇది పురుగు నుంచి లభించే రంగుతో అద్దిన కెంపు రంగు వస్త్ర పదార్థాన్ని సూచించే నానుడి. అందుకే ‘కెంపు రంగు నూలు’ అని అనువదించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: వారు
  rationale: ముందటి సందర్భంలో పేర్కొన్న నిపుణులనే స్వతంత్ర సర్వనామం స్పష్టంగా సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా అనవసరమైన అతిశయోక్తి లేకుండా ‘వారు’ అని అనువదించబడింది.
- source_word: יִקְחוּ
  choice: తీసుకోవాలి
  rationale: ఈ అసంపూర్ణ క్రియారూపం నిర్మాణ ఆదేశాల సందర్భంలో నిర్దేశార్థకంగా ఉంది. ‘తీసుకోవాలి’ ఆధునిక తెలుగులో ఆ ఆదేశ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַזָּהָב
  choice: బంగారాన్ని
  rationale: యాజక వస్త్రాల కోసం నిర్దేశించిన పదార్థాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో కర్మవిభక్తితో ‘బంగారాన్ని’ సహజంగా ఉంటుంది.
- source_word: הַתְּכֵלֶת
  choice: నీలిరంగు నూలును
  rationale: ఈ పదం కేవలం అమూర్తమైన రంగును కాక, నీలిరంగు అద్దిన వస్త్ర పదార్థాన్ని సూచించగలదు. వస్త్రాల తయారీ సందర్భంలో ‘నూలు’ అని స్పష్టం చేయడం అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הָאַרְגָּמָן
  choice: ఊదారంగు నూలును
  rationale: ఈ పదం ఊదారంగు అద్దిన వస్త్ర పదార్థాన్ని సూచిస్తుంది. సమాంతర జాబితాలో ‘నూలు’ అని వ్యక్తీకరించడం తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: ఎర్రని నూలును
  rationale: అక్షరార్థంగా ‘పురుగు యొక్క ఎరుపు’ అనే ఈ నానుడి పురుగు మూలమైన రంగుతో అద్దిన ఎర్రని వస్త్ర పదార్థం లేదా నూలును సూచిస్తుంది. వస్త్రాల సందర్భానికి ‘ఎర్రని నూలు’ సరిపోతుంది.
- source_word: הַשֵּׁשׁ
  choice: సన్నని నారబట్టను
  rationale: పరిశుద్ధ మందిర సంబంధ సందర్భాల్లో ఈ పదం నాణ్యమైన సన్నని నారవస్త్రాన్ని సూచిస్తుంది. ‘సన్నని నారబట్ట’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
