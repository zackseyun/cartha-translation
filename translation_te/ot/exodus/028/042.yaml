  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: te
  text: వారి కోసం నారతో చేసిన లోదుస్తులను తయారు చేయాలి, నగ్న శరీరాన్ని కప్పడానికి.[a] అవి నడుము నుండి తొడల వరకు ఉండాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోదుస్తులు’—లేదా ‘నారతో చేసిన తొడుగులు.’ హీబ్రూ పదం యాజక వస్త్రాల కింద ధరించే దిగువ శరీర వస్త్రాన్ని సూచిస్తుంది. ‘నగ్న శరీరాన్ని’ అనే భావం హీబ్రూలో అక్షరార్థంగా ‘నగ్నత్వపు మాంసాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: ‘నడుము నుండి’—హీబ్రూ పదానికి ‘కటి నుండి’ లేదా ‘నడుము చుట్టుప్రాంతం నుండి’ అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לָהֶם
  choice: వారికి ... చేయాలి
  rationale: ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగు ధర్మశాస్త్ర సూచనకు సహజమైన విధిరూపంతో వ్యక్తం చేస్తుంది; לָהֶם యొక్క ప్రయోజనార్థాన్ని ‘వారికి’గా నిలుపుతుంది.
- source_word: מִכְנְסֵי בָד
  choice: నారతో లోదుస్తులు
  rationale: מִכְנְסֵי అనేది పై యాజక వస్త్రాల కింద ధరించే దిగువ శరీర వస్త్రాన్ని సూచిస్తుంది; ‘లోదుస్తులు’ దాని పనిని స్పష్టంగా తెలుపుతుంది. בָד ఇక్కడ నార వస్త్రం.
- source_word: לְכַסּוֹת
  choice: కప్పడానికి
  rationale: ఉద్దేశాన్ని తెలిపే హీబ్రూ క్రియారూపాన్ని సహజమైన తెలుగు ప్రయోజనార్థక రూపంలో అందిస్తుంది.
- source_word: בְּשַׂר עֶרְוָה
  choice: వారి నగ్నత్వాన్ని
  rationale: అక్షరార్థంగా ‘నగ్నత్వపు మాంసం.’ తెలుగులో ‘నగ్నత్వాన్ని’ శరీరాన్ని కప్పవలసిన భావాన్ని గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִמָּתְנַיִם
  choice: నడుము నుండి
  rationale: מָתְנַיִם నడుము/కటి/నడుము చుట్టుప్రాంతాన్ని సూచించగలదు. వస్త్ర పరిమాణాన్ని తెలుపుతున్న సందర్భంలో ‘నడుము’ సహజమైన ఆధునిక తెలుగు.
- source_word: וְעַד יְרֵכַיִם
  choice: తొడల వరకు
  rationale: יָרֵךְ యొక్క సాధారణ శరీరార్థం ‘తొడ’; వస్త్రం చేరవలసిన దిగువ హద్దును తెలుపుతుంది.
- source_word: יִהְיוּ
  choice: ఉండాలి
  rationale: హీబ్రూలో సాధారణంగా ‘అవి ఉండాలి.’ కొలతల సందర్భంలోనూ ఆ సరళ రూపాన్ని తెలుగులో నిలుపుతుంది; ‘విస్తరించాలి’ వంటి భావవిస్తరణను నివారిస్తుంది.
