translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఏఫోదు’ అనే ప్రత్యేక యాజక వస్త్రపదాన్ని లిప్యంతరీకరించాం. పదార్థాల జాబితాను సహజ తెలుగు క్రమంలో ఉంచుతూ, మూలంలోని ‘బంగారం’ అనే అస్పష్టతను పాదసూచికలో నిలిపాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు రెండూ సంబంధిత పాదసూచికలకు సరిపోతాయి.
