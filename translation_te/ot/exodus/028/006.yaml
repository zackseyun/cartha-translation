source:
  edition: WLC
  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: te
  text: వారు ఏఫోదును బంగారంతో, నీలం మరియు ఊదా రంగుల నూలుతో, ఎర్రని నూలుతో, సన్నగా మెలిపెట్టిన నారతో నైపుణ్యవంతమైన కళాత్మక పనితనంతో చేయాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారు తీగతో’; హీబ్రూ పాఠంలో కేవలం ‘బంగారం’ అని ఉంది. అయితే ఈ వస్త్ర తయారీ సందర్భంలో అది వస్త్రంలో అల్లిన బంగారు తీగను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మాటను ‘రూపకర్త పని’ లేదా ‘నైపుణ్యవంతుడైన కళాకారుని పని’ అని కూడా అనువదించవచ్చు; అది కళాత్మకంగా నమూనా రూపొందించి చేసిన పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: వారు ... చేయాలి
  rationale: నిర్దేశాల వరుసలో ఈ క్రియ ఆజ్ఞాత్మక భావాన్ని కలిగి ఉంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఆ నిర్దేశాన్ని తెలియజేస్తుంది.
- source_word: הָאֵפֹד
  choice: ఏఫోదు
  rationale: ఇది యాజక వస్త్రానికి సంబంధించిన ప్రత్యేక ఆరాధనా పదం; దాని ఖచ్చిత రూపాన్ని ముందే నిర్ణయించకుండా లిప్యంతరీకరణ చేయడం సముచితం.
- source_word: זָהָב
  choice: బంగారం
  rationale: హీబ్రూ మూలంలో కేవలం ‘బంగారం’ అని ఉంది. వస్త్ర తయారీ సందర్భంలో అది బంగారు తీగను సూచించవచ్చు గాని, ‘తీగ’ మూలపాఠంలో స్పష్టంగా లేదు.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: పరిశుద్ధ మందిరపు వస్త్రాల సందర్భంలో వాడే సంప్రదాయ రంగు పదం; పదార్థాల జాబితిలో నూలు అనే భావం సందర్భం ద్వారా గ్రహించవచ్చు.
- source_word: וְאַרְגָּמָן
  choice: ఊదా
  rationale: ఈ రంగు లేదా రంగువేసిన పదార్థానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: תּוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ పదబంధం ఎర్ర రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; ‘నూలు’ తయారీ సందర్భాన్ని స్పష్టపరుస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר పేనిన లేదా మెలితిప్పిన స్వభావాన్ని సూచిస్తాయి.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంగల రూపకర్త పని
  rationale: ఈ పదబంధం ఆలోచించి రూపొందించిన కళాత్మక నైపుణ్య పనిని సూచిస్తుంది; దానిని కేవలం ఎంబ్రాయిడరీగా సంకుచితం చేయదు.
