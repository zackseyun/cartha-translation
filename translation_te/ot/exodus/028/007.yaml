  yaml_path: translation/ot/exodus/028/007.yaml
  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: te
  text: దానికి రెండు కలిపే భుజపు భాగాలు[a] ఉండాలి; అవి దాని రెండు చివరల వద్ద ఉండాలి, తద్వారా ఏఫోదు కలపబడాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండు భుజపు పట్టీలు.” హీబ్రూ పదం అక్షరార్థమైన భుజాలను కాకుండా, వస్త్రంలోని భుజాలకు సంబంధించిన భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరియు అది కలపబడాలి.” చివరి మాటలను మరింత అక్షరానుసారంగా ఇలా అనువదించవచ్చు; ఈ భుజపు భాగాల ద్వారా ఏఫోదు కలపబడుతుందనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: రెండు భుజపు పట్టీలు
  rationale: వస్త్ర సందర్భంలో כְתֵפֹת శరీరంలోని భుజాలను కాకుండా, భుజాల మీదుగా వెళ్లే ఏఫోదు భాగాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘భుజపు పట్టీలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: חֹבְרֹת
  choice: కలపబడి
  rationale: חבר ధాతువు ఈ భాగాలు వస్త్రపు చివరలతో అనుసంధానించబడిన స్థితిని తెలియజేస్తుంది. కృదంత భావాన్ని సహజమైన తెలుగు కర్మణి రూపంలో ఇచ్చాం.
- source_word: יִהְיֶה לּוֹ
  choice: దానికి ... ఉండాలి
  rationale: ל ఉపసర్గతో కూడిన హీబ్రూ అస్తిత్వ నిర్మాణం స్వాధీనతను సూచిస్తుంది. సందర్భంలోని ఏఫోదును ‘దానికి’ అనే సర్వనామంతో సూచించడం సహజం.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: దాని రెండు చివరలకు
  rationale: קָצֶה అంటే చివర లేదా అంచు. వస్త్ర నిర్మాణ సందర్భంలో ‘రెండు చివరలు’ సాధారణంగా, స్పష్టంగా అర్థమవుతుంది.
- source_word: וְחֻבָּר
  choice: అది ఒక్కటిగా కలిసేలా ఉండాలి
  rationale: חבר యొక్క కర్మణి రూపాన్ని నిలుపుతూ, ముందున్న భుజపు పట్టీల అనుసంధానం వల్ల ఏఫోదు కలిసే ఉద్దేశం లేదా ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
