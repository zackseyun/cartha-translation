source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: te
  text: నీవు జ్ఞానమూ నైపుణ్యమూ గల వారందరితో మాట్లాడాలి.[b] నేను వారిని జ్ఞానస్ఫూర్తితో నింపాను.[a] అహరోను నాకు యాజకునిగా సేవ చేయడానికి అతనిని ప్రతిష్ఠించుటకై వారు అతని వస్త్రాలను తయారుచేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానపు ఆత్మతో నింపాను.” హీబ్రూ పదబంధం దేవుడు ఇచ్చిన జ్ఞానప్రేరణను లేదా జ్ఞానసామర్థ్యాన్ని సూచించవచ్చు; ఇది పరిశుద్ధాత్మను స్పష్టంగా సూచిస్తుందని వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “హృదయంలో జ్ఞానం గల వారు” లేదా “జ్ఞానహృదయులు”; ఇది జ్ఞానం, నైపుణ్యం కలిగిన వారిని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: మాట్లాడాలి
  rationale: ఆదేశ సందర్భంలోని పియేల్ అసంపూర్ణ క్రియను ఆధునిక తెలుగులో సహజమైన విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: חַכְמֵי לֵב
  choice: హృదయవివేకం గల వారు
  rationale: ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, సందర్భంలో అవసరమైన వివేకం మరియు నైపుణ్యం రెండింటినీ సూచిస్తుంది.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: నేను వారికి జ్ఞానస్ఫూర్తిని అనుగ్రహించాను
  rationale: మూలంలోని దైవప్రదత్త జ్ఞానప్రేరణను సహజ తెలుగులో అందిస్తుంది; దీనిని పరిశుద్ధాత్మకు స్పష్టమైన సాంకేతిక సూచనగా నిర్ధారించదు. హీబ్రూ ఏకవచన ప్రత్యయాన్ని సమూహాన్ని సూచించే పంపిణీయ భావంగా తెలుగులో బహువచనంతో వ్యక్తం చేసింది.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: అహరోను వస్త్రాలు
  rationale: ‘యాజక వస్త్రాలు’ అని మూలంలో లేని విశేషణాన్ని చేర్చకుండా నిర్మాణ సంబంధాన్ని నేరుగా అందిస్తుంది.
- source_word: לְקַדְּשׁוֹ
  choice: అతనిని ప్రతిష్ఠించేలా
  rationale: యాజక సేవకు ప్రత్యేకంగా అంకితం చేయడాన్ని ‘ప్రతిష్ఠించు’ స్పష్టంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: לְכַהֲנוֹ לִי
  choice: నాకు యాజకునిగా సేవచేయడానికి
  rationale: כהן క్రియలోని యాజకునిగా పనిచేయడం అనే భావాన్ని, לִי లోని దేవునికి చేసే సేవను రెండింటినీ నిలుపుతుంది.
- source_word: וְעָשׂוּ
  choice: తయారుచేయాలి
  rationale: ఆదేశాల పరంపరలోని నిర్దేశక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רוּחַ חָכְמָה పరిశుద్ధాత్మకు ప్రత్యక్ష సూచనా?
  choice: జ్ఞానస్ఫూర్తి
  alternative: జ్ఞానమిచ్చే ఆత్మ / జ్ఞానాత్మ
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేదు; సందర్భం దైవం అనుగ్రహించిన వివేకం, నైపుణ్యానికి సంబంధించినది. అందువల్ల వ్యక్తిగత పరిశుద్ధాత్మను స్పష్టంగా నిర్ధారించకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
- issue: ప్రతిష్ఠించడం మరియు యాజకసేవ మధ్య సంబంధం
  choice: యాజకునిగా సేవచేయడానికి ప్రతిష్ఠించేలా
  alternative: అతనిని ప్రతిష్ఠించడానికి, అతడు నాకు యాజకునిగా సేవచేయడానికి
  rationale: వరుసగా ఉన్న ఉద్దేశార్థక క్రియారూపాల సన్నిహిత సంబంధాన్ని సహజ తెలుగులో చూపుతుంది; యాజకసేవ ప్రతిష్ఠాపన యొక్క లక్ష్యమని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ ‘హృదయం’ రూపకాన్ని ‘హృదయవివేకం’గా నిలిపి, అతిగా శబ్దానువాదం వల్ల కలిగే అసహజతను తగ్గించాం.
