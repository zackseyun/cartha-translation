  terminology: “పవిత్ర వస్త్రాలు” appropriately renders בִגְדֵי קֹדֶשׁ without importing later ecclesiastical terminology. “మహిమ” and “శోభ” retain the elevated, visible-dignity sense of כָּבוֹד and תִּפְאֶרֶת. “అహరోను” is a standard Telugu biblical form.
