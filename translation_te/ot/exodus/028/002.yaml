  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: te
  text: నీ సహోదరుడైన అహరోను కోసం, మహిమకూ శోభకూ పవిత్ర వస్త్రాలు తయారు చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఘనతకోసం, అందంకోసం” లేదా “మహిమకోసం, వైభవంకోసం.”
    reason: లְכָבוֹד మరియు וּלְתִפְאָרֶת పదాలకు సందర్భానుసారంగా ఘనత/మహిమ మరియు అందం/శోభ/వైభవం అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో వచ్చిన Qal perfect 2ms ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: ఈ construct పదబంధం పవిత్ర సేవ కోసం ప్రత్యేకపరచిన వస్త్రాలను సూచిస్తుంది; ‘పవిత్ర వస్త్రాలు’ అర్థాన్ని నేరుగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: నీ సహోదరుడైన అహరోనుకు
  rationale: అహరోనును మోషేతో ఉన్న కుటుంబ సంబంధం ద్వారా గుర్తించే మూలపాఠ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכָבוֹד
  choice: మహిమకోసం
  rationale: כבודలో మహిమ, ఘనత, గౌరవం అనే భావవ్యాప్తి ఉంది; సమాంతర పదంతో కలిసిన ఈ సందర్భంలో ‘మహిమ’ ఉన్నత భావాన్ని కాపాడుతుంది.
- source_word: וּלְתִפְאָרֶת
  choice: శోభకోసం
  rationale: תפארת అందం, వైభవం, అలంకారశోభను సూచించగలదు; వస్త్రాల దృశ్య సౌందర్యాన్ని ‘శోభ’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యాజక వస్త్రాల ఉద్దేశాన్ని తెలిపే పదబంధం
  choice: మహిమకోసం, శోభకోసం
  alternative: ఘనతకోసం, అందంకోసం; మహిమకోసం, వైభవంకోసం
  rationale: לְכָבוֹד וּלְתִפְאָרֶת అనే పదాలు విస్తృత భావాలను కలిగి ఉన్నాయి. ప్రధాన పాఠం యాజక సేవలోని గౌరవాన్నీ వస్త్రాల దృశ్య వైభవాన్నీ నిలుపుతూ, ‘మహిమ’ ఎవరిది అనే విషయాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక వస్త్రాల సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘వస్త్రాలు’ అనే పదం మతపరమైన తరువాతి సాంకేతిక పదజాలాన్ని దిగుమతి చేయకుండా మూలంలోని సాధారణ clothing పదాన్ని ప్రతిబింబిస్తుంది.
