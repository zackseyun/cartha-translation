source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: te
  text: 'వారు మోషేతో ఇలా అన్నారు: “ఐగుప్తులో సమాధులు లేవని అరణ్యంలో చనిపోవడానికి మమ్మల్ని తీసుకెళ్లావా? ఐగుప్తు నుండి మమ్మల్ని బయటకు తీసుకురావడం ద్వారా మాకు నీవు చేసిన ఈ పని ఏమిటి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: వారు మోషేతో ఇలా అన్నారు
  rationale: אמר అనే సాధారణ కథన క్రియను సహజమైన తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా అనువదించాం; אֶל సూచించే సంభాషణ దిశను ‘మోషేతో’ తెలియజేస్తుంది.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: ఐగుప్తులో సమాధులు లేవనా
  rationale: ఈ హెబ్రీ నిర్మాణం వ్యంగ్యంతో కూడిన అలంకారప్రశ్న. ‘లేవనా’ దాని నిందాపూర్వక వ్యంగ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְקַחְתָּנוּ
  choice: మమ్మల్ని తీసుకొచ్చావు
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకోవడం’ను నిలుపుతూ, వక్తలు ప్రస్తుతం ఉన్న అరణ్య స్థలానికి జరిగిన గమనాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: అరణ్యంలో చనిపోవడానికి
  rationale: מות ఉద్దేశం లేదా ఫలితాన్ని సూచించే క్రియారూపం; מִדְבָּר సాగుచేయని నిర్మానుష్య ప్రాంతాన్ని సూచించగలందున ‘అరణ్యం’ ఎంచుకున్నాం.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: మాకు నీవు చేసిన ఈ పని ఏమిటి?
  rationale: ‘ఎందుకు ఇలా చేశావు?’ అని భావాన్ని పరిష్కరించకుండా, మూలంలోని ఆశ్చర్యం మరియు నింద కలిగిన ‘ఇది ఏమిటి?’ నిర్మాణాన్ని నిలిపాం.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: ఐగుప్తులోనుండి మమ్మల్ని బయటకు తీసుకురావడం ద్వారా
  rationale: הוציא యొక్క causative ‘బయటకు తీసుకురావడం’ భావాన్ని, ముందు పేర్కొన్న పనిని వివరించే infinitive సంబంధాన్ని ‘ద్వారా’తో స్పష్టంగా వ్యక్తం చేశాం.
