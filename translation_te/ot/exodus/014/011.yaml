revisions:
- from: 'వారు మోషేతో ఇలా అన్నారు: “ఐగుప్తులో సమాధులు లేవనా, అరణ్యంలో చనిపోవడానికి మమ్మల్ని తీసుకొచ్చావు? ఐగుప్తులోనుండి మమ్మల్ని బయటకు తీసుకురావడం ద్వారా మాకు నీవు చేసిన ఈ పని ఏమిటి?”'
  to: 'వారు మోషేతో ఇలా అన్నారు: “ఐగుప్తులో సమాధులు లేవని అరణ్యంలో చనిపోవడానికి మమ్మల్ని తీసుకెళ్లావా? ఐగుప్తు నుండి మమ్మల్ని బయటకు తీసుకురావడం ద్వారా మాకు నీవు చేసిన ఈ పని ఏమిటి?”'
  rationale: The revision replaces ‘తీసుకొచ్చావు’ with ‘తీసుకెళ్లావా’ to reflect לקח (‘take’) and retain its contrast with the later causative ‘బయటకు తీసుకురావడం’ for הוֹצִיא. It also makes the sarcastic causal force of the first Hebrew question clear in fluent modern standard Telugu. No footnote is needed, since the resulting Telugu adequately conveys the source ambiguity and rhetorical force.
