translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రజల వ్యంగ్యం, భయం, మోషేపై నింద యథాతథంగా నిలుపబడ్డాయి. ‘ఐగుప్తు’, ‘మోషే’, ‘అరణ్యం’ అనే స్థిర బైబిలు పదరూపాలు ఉపయోగించబడ్డాయి.
