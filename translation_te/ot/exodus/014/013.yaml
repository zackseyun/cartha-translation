id: EXO.14.13
reference: Exodus 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ הִֽתְיַצְב֗וּ וּ/רְאוּ֙ אֶת יְשׁוּעַ֣ת יְהוָ֔ה אֲשֶׁר יַעֲשֶׂ֥ה לָ/כֶ֖ם הַ/יּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת מִצְרַ֨יִם֙ הַ/יּ֔וֹם לֹ֥א תֹסִ֛יפוּ לִ/רְאֹתָ֥/ם ע֖וֹד עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: te
  text: 'మోషే ప్రజలతో ఇలా అన్నాడు: “భయపడకండి. స్థిరంగా నిలబడి, ఈ రోజు యెహోవా మీ కోసం కలుగజేసే రక్షణను చూడండి. ఈ రోజు మీరు చూస్తున్న ఈజిప్టీయులను ఇక ఎన్నటికీ చూడరు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: హీబ్రూ నిషేధార్థక వాక్యాన్ని సహజమైన ఆధునిక తెలుగు బహువచన సంబోధనగా అనువదిస్తుంది.
- source_word: הִתְיַצְבוּ
  choice: స్థిరంగా నిలబడి
  rationale: ఈ రూపం కేవలం నిలబడటమే కాక, భయానికి లోనుకాక తమ స్థానంలో దృఢంగా ఉండాలనే భావాన్ని ఇస్తుంది.
- source_word: יְשׁוּעַת יְהוָה
  choice: యెహోవా ... కలుగజేసే రక్షణ
  rationale: יְשׁוּעָה ఇక్కడ దేవుడు ప్రమాదం నుంచి విడిపించే కార్యాన్ని సూచిస్తుంది; దైవనామాన్ని వ్యక్తినామమైన ‘యెహోవా’గా ఉంచింది.
- source_word: יַעֲשֶׂה לָכֶם
  choice: మీ కోసం కలుగజేసే
  rationale: దేవుడు వారి పక్షాన కార్యం చేసి రక్షణను సాధిస్తాడనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַד עוֹלָם
  choice: ఇక ఎన్నటికీ
  rationale: ఈ సందర్భంలో ఈజిప్టీయులను మళ్లీ ఎప్పుడూ చూడరనే సంపూర్ణ నిరాకరణను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో నిలుపుతుంది.
- issue: ‘రక్షణ’ యొక్క కార్యసాధకుడు
  choice: యెహోవా మీ కోసం కలుగజేసే రక్షణ
  alternative: యెహోవా రక్షణను చూడండి; ఆయన ఈ రోజు మీ కోసం దాన్ని చేస్తాడు
  rationale: రక్షణ దేవుని కార్యమేనని స్పష్టంగా ఉంచుతూ, మూలంలోని సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రజలతో నాయకుడు మాట్లాడే సందర్భానికి తగిన గౌరవబహువచనం, సరళమైనప్పటికీ గంభీరమైన శైలి. అవసరం లేని వివరణను చేర్చలేదు.
