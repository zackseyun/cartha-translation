    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపే వరుస భావాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది. דּבר ... לֵאמֹר అనే వాక్యనిర్మాణానికి ‘ఇలా చెప్పాడు’ సహజమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో సూచించాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడే క్రియతో కలిసిన אֶלను ఆధునిక తెలుగులో సహజంగా ‘మోషేతో’ అని వ్యక్తం చేయవచ్చు.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పాడు’ అని అందించాం.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. హీబ్రూ పేరుకు సంబంధించిన ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కానందున, తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠంలో ఉంచి ‘యాహ్వే’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి. మూలంలోని వరుస భావాన్ని ‘అప్పుడు’తో, దైవవాక్య పరిచయ సూత్రాన్ని ‘ఇలా చెప్పాడు’తో వ్యక్తం చేశాం. గౌరవప్రదతను నిలుపుతూ అతిగా ప్రాచీనమైన పదప్రయోగాలను నివారించాం.
