translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. ‘రథాధికారులు’ అనే మరింత నిర్దిష్ట అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా, హీబ్రూ సైనిక పదంలోని అనిశ్చితిని పాదసూచికలో నిలుపుకున్నాం.
