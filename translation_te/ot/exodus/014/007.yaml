  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֗ח שֵׁשׁ מֵא֥וֹת רֶ֨כֶב֙ בָּח֔וּר וְ/כֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְ/שָׁלִשִׁ֖ם עַל כֻּלּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/007.yaml
  text: And he took six hundred choice chariots[a], and all the chariots of Egypt, with officers over all of them.
translation:
  language: te
  text: అతడు ఆరువందల ఎంపికైన రథాలను, ఐగుప్తు రథాలన్నిటినీ, వాటన్నిటిమీద అధికారులతో కూడ తీసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటన్నిటిమీద రథాధికారులతో కూడ.” హీబ్రూ పదం రథాలతో సంబంధమున్న సైనిక అధికారులను, ఉన్నత సహాయకులను, లేదా సేనాధిపతులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అతడు ... తీసుకున్నాడు
  rationale: לקח క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు సహజ కథన శైలిలో ‘తీసుకున్నాడు’ ఆ వరుస చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת
  choice: ఆరువందల
  rationale: ఇది నేరుగా సంఖ్యను తెలిపే నిర్మాణం.
- source_word: רֶכֶב
  choice: రథాలను
  rationale: רכב సమూహార్థంగా రథదళాన్ని సూచించగలిగినా, ఇక్కడ స్పష్టమైన సంఖ్య ఉండటంతో లెక్కించదగిన ‘రథాలు’ సహజంగా ఉంది.
- source_word: בָּחוּר
  choice: ఎంపిక చేసిన
  rationale: בחר నుండి వచ్చిన ఈ విశేషణం ప్రత్యేకంగా ఎన్నుకున్న లేదా శ్రేష్ఠమైన వాటిని సూచిస్తుంది; ‘ఎంపిక చేసిన’ మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְכֹל רֶכֶב מִצְרַיִם
  choice: ఐగుప్తులోని మిగతా రథాలన్నిటినీ
  rationale: ముందు పేర్కొన్న ఆరువందల ఎంపిక చేసిన రథాలకు అదనంగా మొత్తం ఐగుప్తు రథదళాన్ని సూచించే భావాన్ని ‘మిగతా’ స్పష్టం చేస్తుంది; ఇది సందర్భం నుండి గ్రహించిన సంబంధం.
- source_word: וְשָׁלִשִׁם
  choice: అధికారులను
  rationale: שָׁלִישִׁים అనేది రథాలతో సంబంధమున్న ఉన్నత సైనిక సహాయకులు లేదా అధికారులను సూచించే సాంకేతిక సైనిక పదం. నిర్దిష్ట విధిని అతిగా నిర్ణయించకుండా ‘అధికారులు’ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: עַל כֻּלּוֹ
  choice: వాటన్నిటి మీద
  rationale: ఏకవచన ప్రత్యయం మొత్తం రథదళాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో పంపిణీ భావాన్ని సహజంగా తెలియజేయడానికి ‘వాటన్నిటి మీద’ వాడబడింది.
