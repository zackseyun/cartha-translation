base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: te
  text: మేము ఐగుప్తులో నీతో, ‘మమ్మల్ని మా మానాన వదిలేయి; మేము ఐగుప్తీయులకు సేవ చేయనివ్వు’ అని చెప్పిన మాట ఇదే కదా? అరణ్యంలో చనిపోవడం కంటే ఐగుప్తీయులకు సేవ చేయడమే మాకు మేలై ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַל מִמֶּנּוּ
  choice: మమ్మల్ని మా మానాన వదిలేయి
  rationale: ‘మా విషయంలో జోక్యం చేసుకోవడం మానుకో’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: మేము ఐగుప్తీయులకు సేవ చేస్తాం
  rationale: עבד అనే క్రియకు ఇక్కడ బానిసత్వంతో కూడిన ‘సేవ చేయడం’ భావం ఉంది; מִצְרַיִם దేశాన్ని లేదా దాని ప్రజలను సూచించగలిగినా, సందర్భానుసారం ప్రజలను సూచించే ‘ఐగుప్తీయులకు’ సహజంగా ఉంది.
- source_word: כִּי טוֹב לָנוּ ... מִמֻּתֵנוּ
  choice: '... కంటే ... మాకు మేలై ఉండేది'
  rationale: తాము ఎదుర్కొంటున్న ప్రమాదం నేపథ్యంలో గత ప్రత్యామ్నాయాన్ని వెనుదిరిగి అంచనా వేస్తున్న భావాన్ని తెలుగు సంభావ్య భూతకాల రూపం స్పష్టంగా అందిస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: నిర్జనమైన అడవి/ఎడారి ప్రదేశాన్ని సూచించే సంప్రదాయబద్ధమైన, విస్తృతంగా అర్థమయ్యే బైబిలు తెలుగు పదం.
theological_decisions:
- issue: ఇశ్రాయేలీయులు ఐగుప్తులోనే ఇదే మాట అన్నారనే వాదన
  choice: ప్రశ్నార్థక వాక్యంగానే నిలిపి, వారి వాదనను నేరుగా అనువదించడం
  alternative: ఇది గతంలో పలికిన ఖచ్చితమైన మాట అని వివరణాత్మకంగా బలపరచడం లేదా తిరస్కరించడం
  rationale: హీబ్రూ వాక్యం ప్రజల ఆరోపణను మాత్రమే నమోదు చేస్తుంది; దాని చారిత్రక ఖచ్చితత్వంపై ఈ వచనం స్వయంగా తీర్పు చెప్పదు.
- issue: ‘మేలు’ అనే పోలిక యొక్క కాలభావం
  choice: ‘మేలై ఉండేది’
  alternative: ‘మేలు’ లేదా ‘మంచిది’
  rationale: మరణభయం మధ్య వారు ఐగుప్తులో మిగిలి ఉంటే బాగుండేదని చెప్పే ప్రతికల్పనాత్మక భావాన్ని సందర్భం సూచిస్తుంది; ఇది వారి ఫిర్యాదును సమర్థించే అదనపు వ్యాఖ్య కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. సంభాషణలోని తీవ్రతను ‘ఇదే కదా?’ మరియు ‘మా మానాన వదిలేయి’ ద్వారా నిలిపాం. మూలంలో లేని వివరణను లేదా మతపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
