  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּט֩ מֹשֶׁ֨ה אֶת יָד֜/וֹ עַל הַ/יָּ֗ם וַ/יָּ֨שָׁב הַ/יָּ֜ם לִ/פְנ֥וֹת בֹּ֨קֶר֙ לְ/אֵ֣יתָנ֔/וֹ וּ/מִצְרַ֖יִם נָסִ֣ים לִ/קְרָאת֑/וֹ וַ/יְנַעֵ֧ר יְהוָ֛ה אֶת מִצְרַ֖יִם בְּ/ת֥וֹךְ הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: te
  text: అప్పుడు మోషే సముద్రం మీద తన చెయ్యి చాపాడు. తెల్లవారుతుండగా సముద్రం తన సహజ స్థితికి తిరిగి వచ్చింది[a]. ఐగుప్తీయులు దాని వైపు పారిపోతుండగా, యాహ్వే ఐగుప్తీయులను సముద్రం మధ్యలో కుదిపి పడేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన మామూలు బలానికి’ లేదా ‘తన మునుపటి స్థితికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం సముద్రం తన స్థిరమైన సహజ స్థితిని మళ్లీ పొందిందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు అక్షరార్థంగా ‘కుదిపివేయడం’ లేదా ‘దులిపివేయడం’ అనే భావం ఉంది. యాహ్వే ఐగుప్తీయులను సముద్రంలో పడవేసిన దృశ్యాన్ని ఇది సజీవంగా చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: చాపాడు
  rationale: נטה అనే క్రియ ‘చెయ్యి’తో వచ్చినప్పుడు చెయ్యి చాపడం లేదా ముందుకు చాచడం అనే సాధారణ భావాన్ని ఇస్తుంది.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది సముద్రానికి వాడే సాధారణ హీబ్రూ నామవాచకం; ఈ వచనంలోనే దీనిని ప్రత్యేక నామంగా చూపాల్సిన సూచన లేదు.
- source_word: וַיָּשָׁב הַיָּם
  choice: సముద్రం ... తిరిగి వచ్చింది
  rationale: שׁוב ఇక్కడ సముద్రం తన ముందటి స్థితికి చేరడాన్ని సూచిస్తుంది.
- source_word: לִפְנוֹת בֹּקֶר
  choice: తెల్లవారుతుండగా
  rationale: ఉదయం సమీపిస్తున్న సమయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְאֵיתָנוֹ
  choice: తన మామూలు స్థితికి
  rationale: אֵיתָן స్థిరత్వం, బలం, యథాస్థితి వంటి భావాలను కలిగి ఉంది. సందర్భంలో విడిపోయిన సముద్రం తన సహజమైన స్థితికి తిరిగి రావడం ప్రధాన భావం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: נָסִים לִקְרָאתוֹ
  choice: దాని వైపే పారిపోతుండగా
  rationale: నిరంతరంగా జరుగుతున్న పారిపోవడాన్ని participle సూచిస్తుంది; לִקְרָאתוֹ అక్షరార్థంగా ‘దానిని ఎదుర్కొనేందుకు/దాని వైపు’ అని ఉండే ఆశ్చర్యకరమైన దిశాభావాన్ని అనువాదం కాపాడుతుంది.
- source_word: וַיְנַעֵר
  choice: కుదిపి పడేశాడు
  rationale: נער యొక్క ‘కుదిపివేయడం, దులిపివేయడం’ అనే సజీవ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం ‘నాశనం చేశాడు’ అని భావాన్ని చదును చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּתוֹךְ הַיָּם
  choice: సముద్రం మధ్యలోకి
  rationale: תוך సముద్రపు అంతర్భాగం లేదా మధ్యను సూచిస్తుంది; క్రియలోని చలన భావానికి అనుగుణంగా ‘మధ్యలోకి’ అని ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం ఒక బిరుదును కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాన్ని ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దాని వైపే’ అనే మాట మూలంలోని ఉద్దేశపూర్వకంగా ఆశ్చర్యం కలిగించే దిశాభావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
