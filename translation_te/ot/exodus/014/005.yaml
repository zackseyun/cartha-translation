id: EXO.14.5
reference: Exodus 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: te
  text: ప్రజలు పారిపోయారని ఈజిప్టు రాజుకు తెలియజేయబడింది. అప్పుడు ఫరో, అతని సేవకుల హృదయం ప్రజలకు వ్యతిరేకంగా మారిపోయింది[a]. వారు, “మనం చేసిన ఈ పని ఏమిటి? ఇశ్రాయేలు మనకు సేవ చేయకుండా వెళ్లనిచ్చామే[b]!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజల విషయంలో ఫరో, అతని సేవకుల మనస్సు మారిపోయింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలును మన సేవనుండి విడుదల చేశామే” లేదా “మన దాసులుగా ఉండకుండా విడిచిపెట్టామే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: హొఫల్ క్రియారూపంలోని కర్తను పేర్కొనని నివేదన శైలిని తెలుగులో కర్మణి ప్రయోగంతో నిలుపుతుంది.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజుకు
  rationale: మూలంలోని సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: כִּי בָרַח הָעָם
  choice: ప్రజలు పారిపోయారని
  rationale: ברח అనే పదంలోని ‘పారిపోవడం’ భావాన్ని, ముందే జరిగిన చర్యగా కథన సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו אֶל הָעָם
  choice: ప్రజలపట్ల ఫరో, అతని సేవకుల హృదయం మారిపోయింది
  rationale: לְבַב లోని ‘హృదయం’ రూపకాన్ని, נהפך లోని అంతరంగ వైఖరి మార్పును నిలుపుతుంది; אֶל ను ‘ప్రజలపట్ల’ అని అనువదించడం ద్వారా దిశను ఉంచి, ‘వ్యతిరేకంగా’ అని సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో మరీ నిర్దిష్టం చేయదు.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: మనం చేసిన ఈ పని ఏమిటి
  rationale: ప్రశ్నార్థక పదంతోపాటు ఉన్న సూచకపదాన్ని కూడా నిలిపి, దిగ్భ్రాంతి మరియు పశ్చాత్తాప స్వరాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును వెళ్లనిచ్చామే
  rationale: ఈ సందర్భంలో שׁלח సూచించే విడుదల చేసి వెళ్లనివ్వడం అనే భావాన్ని సహజంగా అందిస్తుంది; ‘-ఆమే’ విచారం/ఆశ్చర్య స్వరాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעָבְדֵנוּ
  choice: మనకు సేవ చేయకుండా
  rationale: עבד యొక్క ప్రత్యక్ష ‘సేవ చేయడం’ భావాన్ని నిలుపుతూ, సేవ నిలిచిపోయిందనే מן ప్రయోగ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְבַב అనే మానవ అంతరంగాన్ని సూచించే పదం
  choice: హృదయం
  alternative: మనస్సు
  rationale: ఈ పదం ఆలోచన, సంకల్పం, వైఖరికి కేంద్రాన్ని సూచించినా, మూలంలోని శరీరరూపకాన్ని తొలగించకుండా ‘హృదయం’ అని ఉంచడం సాహిత్య, ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: אֶל הָעָם లో మారిన వైఖరి దిశ
  choice: ప్రజలపట్ల
  alternative: ప్రజలకు వ్యతిరేకంగా
  rationale: సందర్భంలో వైరం స్పష్టంగా ఉన్నప్పటికీ, אֶל స్వయంగా దిశను సూచిస్తుంది. ప్రధాన పాఠ్యం నిజమైన భాషాపరమైన విస్తృతిని నిలుపుతుంది; సందర్భం ప్రతికూలతను తెలియజేస్తుంది.
- issue: מֵעָבְדֵנוּ లో ఇశ్రాయేలు స్థితి
  choice: మనకు సేవ చేయకుండా
  alternative: మన దాసులుగా ఉండకుండా
  rationale: విస్తృత కథనం బానిసత్వాన్ని చూపుతున్నప్పటికీ, ఈ పదబంధం ప్రత్యక్షంగా సేవ చేయడాన్ని చెబుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో బలమైన వ్యాఖ్యాత్మక పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘హృదయం’ అనే మూలరూపకం నిలుపబడింది; ప్రశ్నలోని విచారం, దిగ్భ్రాంతిని సహజ తెలుగు ఉద్ఘాటనతో వ్యక్తం చేశారు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
