source:
  edition: WLC
  text: וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: te
  text: ఇశ్రాయేలు ప్రజలు పొడి నేలపై సముద్రం మధ్యలోకి ప్రవేశించారు; నీళ్లు వారికి కుడివైపునా ఎడమవైపునా గోడగా ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘ఇశ్రాయేలు కుమారులు.’ ఈ పదబంధం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వెళ్లారు
  rationale: ఈ కథన సందర్భంలో בוא ఒక ప్రదేశంలోకి కదలడాన్ని సూచిస్తుంది. తెలుగులో ‘వెళ్లారు’ సహజంగా ఉండి, తరువాతి ‘సముద్రం మధ్యలో’ అనే పదబంధంతో ప్రవేశ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ అయితే ఇక్కడ అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే స్థిర జాతినామం కాబట్టి, ఆధునిక తెలుగులో సహజమైన ‘ఇశ్రాయేలు ప్రజలు’ ఎంచుకున్నాం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּתוֹךְ הַיָּם
  choice: సముద్రం మధ్యలో
  rationale: בְּתוֹךְ లోని ‘మధ్యలో/నడుమ’ భావాన్ని నేరుగా నిలుపుతుంది; ‘సముద్రం గుండా’ అని మాత్రమే చెప్పి స్థలచిత్రాన్ని తగ్గించదు.
- source_word: בַּיַּבָּשָׁה
  choice: ఆరిన నేల మీదుగా
  rationale: יַבָּשָׁה నీటికి విరుద్ధమైన పొడి లేదా ఆరిన నేలను సూచిస్తుంది. సముద్రపు అడుగు ఆరినదనే సందర్భానుగుణ చిత్రాన్ని ‘ఆరిన నేల’ సహజంగా తెలియజేస్తుంది; ‘మీదుగా’ ప్రయాణాన్ని సూచిస్తుంది.
- source_word: וְהַמַּיִם
  choice: నీళ్లు
  rationale: హీబ్రూలో రూపం బహువచనమైనప్పటికీ, ఆధునిక తెలుగులో ‘నీళ్లు’ సహజమైన బహువచన/సమూహ రూపం మరియు దృశ్యంలోని సాహిత్య బలాన్ని నిలుపుతుంది.
- source_word: חֹמָה
  choice: గోడగా నిలిచాయి
  rationale: חֹמָה నేరుగా ‘గోడ’ అని అర్థం; హీబ్రూలో ఉపమాన సూచిక లేదు. అందువల్ల ‘గోడలా’ అని మృదువుచేయకుండా విధేయార్థకమైన ‘గోడగా’ వాడాం. తెలుగు వాక్యపూర్ణత కోసం ‘నిలిచాయి’ చేర్చాం.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: వారికి కుడివైపున, ఎడమవైపున
  rationale: రెండు వైపుల సమాంతర స్థానాన్ని స్పష్టంగా, సహజ తెలుగులో తెలియజేస్తూ హీబ్రూ సమతౌల్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: నీళ్లు ‘గోడ’గా ఉండటం రూపకమా లేక ఉపమానమా
  choice: గోడగా
  alternative: గోడలా
  rationale: మూల హీబ్రూ חֹמָה ముందు ‘వలె’ అనే ఉపమాన సూచిక లేదు. సంఘటన స్వరూపాన్ని అదనంగా నిర్వచించకుండా మూలంలోని బలమైన విధేయ రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే కఠిన అక్షరానువాదం బదులు ప్రధాన పాఠ్యంలో సమూహార్థాన్ని స్పష్టపరిచే ‘ఇశ్రాయేలు ప్రజలు’ వాడి, మూలరూపాన్ని పాదసూచికలో నిలిపాం. ‘గోడగా’ అనే బలమైన చిత్రాన్ని ఉద్దేశపూర్వకంగా కాపాడాం.
