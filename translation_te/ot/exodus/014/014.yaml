  source_fidelity: హీబ్రూ వచనంలోని యెహోవా/యాహ్వే దైవనామం, ‘మీ కొరకు యుద్ధం చేస్తాడు’ అనే భావం, మరియు תַּחֲרִישׁוּן క్రియలోని మౌనంగా ఉండవలసిన భావాన్ని ముసాయిదా ప్రధానంగా ప్రతిబింబిస్తుంది. అయితే ఆంగ్ల POB audit trail నిర్దేశించిన యాహ్వే రూపానికి బదులుగా ‘యెహోవా’ వాడబడింది. అలాగే ‘మీ పక్షంగా’ కంటే ‘మీ కొరకు’ ఇక్కడ లామెద్ యొక్క ప్రయోజనార్థక భావాన్ని మరింత సహజంగా, నేరుగా ఇస్తుంది.
