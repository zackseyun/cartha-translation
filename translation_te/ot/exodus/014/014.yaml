source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: te
  text: యాహ్వే మీ కొరకు యుద్ధం చేస్తాడు; మీరు మౌనంగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మౌనంగా ఉంటారు,” “మీరు నిశ్శబ్దంగా ఉండండి.”
    reason: תַּחֲרִישׁוּן అనే హీబ్రూ అసంపూర్ణ క్రియను సందర్భానుసారం విధ్యర్థకంగా అనువదించవచ్చు; భవిష్యత్ లేదా నిశ్చయార్థక భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: יִלָּחֵם
  choice: యుద్ధం చేస్తాడు
  rationale: לחם నిఫాల్ అసంపూర్ణ క్రియ ఇక్కడ ఇశ్రాయేలు తరఫున జరగబోయే యుద్ధ చర్యను సూచిస్తుంది; ‘యుద్ధం చేస్తాడు’ సైనిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לָכֶם
  choice: మీ పక్షంగా
  rationale: లామెద్ ఉపసర్గతో కూడిన ద్వితీయ పురుష బహువచన ప్రత్యయం, వారి మేలు కోసం లేదా వారి తరఫున జరిగే చర్యను సూచిస్తుంది; ‘మీ పక్షంగా’ ఆ ప్రతినిధి భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְאַתֶּם
  choice: మీరు
  rationale: స్వతంత్ర సర్వనామం యెహోవా చేసే చర్యకు ప్రజల వైఖరిని ఎదురెదురుగా ఉంచి నొక్కిచెబుతుంది; తెలుగులో కర్తను స్పష్టంగా ఉంచడం ద్వారా ఆ వ్యత్యాసం నిలుస్తుంది.
- source_word: תַּחֲרִישׁוּן
  choice: మౌనంగా ఉండాలి
  rationale: חרשׁ హిఫిల్ రూపం మౌనంగా ఉండడం లేదా నిశ్శబ్దంగా ఉండడాన్ని సూచిస్తుంది. సందర్భంలో ఇది ఆజ్ఞాత్మక ప్రోత్సాహంగా అర్థమవుతుంది; అయినా వ్యాకరణపరంగా భవిష్యత్/నిశ్చయార్థం సాధ్యమే కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం; ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: תַּחֲרִישׁוּן యొక్క విధి లేదా భవిష్యత్ భావం
  choice: మీరు మౌనంగా ఉండాలి
  alternative: మీరు మౌనంగా ఉంటారు
  rationale: మోషే ఇచ్చిన ప్రోత్సాహం సందర్భంలో విధ్యర్థక భావం బలంగా ఉంది. అయితే హీబ్రూ అసంపూర్ణ క్రియ భవిష్యత్ లేదా నిశ్చయార్థ పఠనాన్నీ అనుమతిస్తుంది; అందువల్ల దానిని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘మీ పక్షంగా’ దేవుడు ప్రజల తరఫున యుద్ధం చేసే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; పాదటిప్పణి హీబ్రూ క్రియలోని నిజమైన విధి/భవిష్యత్ సందిగ్ధతను నిలుపుతుంది.
