id: EXO.14.19
reference: Exodus 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు శిబిరానికి ముందు వెళ్తున్న దేవుని దూత[a] కదలి వారి వెనుకకు వెళ్లాడు. మేఘస్తంభం కూడా వారి ముందు నుంచి కదలి వారి వెనుక నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదూత.’ హీబ్రూ పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: అక్కడి నుంచి కదలి / కదలి
  rationale: נסע సాధారణంగా బయలుదేరడం లేదా శిబిరాన్ని ఎత్తివేయడం అనే భావాలను కలిగించగలదు; ఇక్కడ దూత, మేఘస్తంభం తమ స్థానాన్ని మార్చుకోవడమే సందర్భార్థం. అందువల్ల సహజమైన తెలుగు కోసం ‘కదలి’ అని అనువదించాం.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: దేవుని దూత
  rationale: מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ‘దేవుని దూత’ మూలంలోని సంబంధాన్ని నేరుగా నిలుపుతూ, ఆ వ్యక్తి స్వరూపాన్ని అవసరానికి మించి నిర్ధారించదు.
- source_word: הַהֹלֵךְ
  choice: వెళ్తున్న
  rationale: ఈ కృదంతం అప్పటివరకు కొనసాగుతున్న చర్యను సూచిస్తుంది. తెలుగులో ‘ముందు వెళ్తున్న’ ఆ కొనసాగుతున్న పూర్వస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శిబిరానికి ముందు
  rationale: לִפְנֵי ఇక్కడ స్థలసంబంధంగా ‘ముందు’ అని అర్థం; ‘ఇశ్రాయేలు శిబిరం’ అనే నిర్మాణం మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: వారి వెనుకకు వెళ్లాడు
  rationale: מֵאַחֲרֵי ఇక్కడ వెంబడించడం కాదు, వారి వెనుకనున్న స్థానానికి వెళ్లడాన్ని సూచిస్తుంది.
- source_word: עַמּוּד הֶעָנָן
  choice: మేఘస్తంభం
  rationale: ఈ సమాసం మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִפְּנֵיהֶם
  choice: వారి ముందు నుంచి
  rationale: ఈ పదబంధం వారి ముందున్న స్థానం నుంచి కదలడాన్ని సూచిస్తుంది; తెలుగులో ఇది స్పష్టమైన స్థలసంబంధ వ్యక్తీకరణ.
- source_word: וַיַּעֲמֹד
  choice: నిలిచింది
  rationale: עמד యొక్క సాధారణ అర్థం ‘నిలుచుట.’ ఇక్కడ మేఘస్తంభం కొత్త స్థానం వద్ద నిలిచినట్లు సూటిగా తెలియజేస్తుంది.
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים యొక్క గుర్తింపు, స్వరూపం
  choice: ‘దేవుని దూత’ అని అనువదించి, అతని స్వరూపాన్ని మరింత నిర్దిష్టంగా పేర్కొనలేదు.
  alternative: ‘దేవదూత’; లేదా దైవ ప్రత్యక్షతగా స్పష్టీకరించే వ్యాఖ్యానాత్మక అనువాదం.
  rationale: హీబ్రూ వాక్యం ఆ దూతను పేర్కొంటుంది గాని, అతడు సృష్టింపబడిన దేవదూతనా, దేవుని ప్రత్యక్షతనా, లేక మరేదైనా ప్రత్యేక దైవ ప్రత్యక్ష రూపమా అని ఇక్కడ నిర్ణయించదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ముందు—వెనుక’ అనే మూలంలోని స్థలసంబంధ సమాంతరతను కాపాడాం.
