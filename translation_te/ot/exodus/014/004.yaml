  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: te
  text: “నేను ఫరో హృదయాన్ని కఠినపరుస్తాను[a], అతడు వారి వెంటపడతాడు; ఫరోపై, అతని సైన్యమంతటిపై నేను మహిమ పొందుతాను[b]; ఐగుప్తీయులు నేను యహ్వేనని తెలుసుకుంటారు.” వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఫరో హృదయాన్ని దృఢపరుస్తాను.” హీబ్రూ క్రియకు ‘బలపరచు, దృఢపరచు’ అనే అర్థం రావచ్చు; నిర్గమకాండంలోని ఈ సందర్భంలో ఆ దృఢత్వం మొండితనంగా వ్యక్తమవుతోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఫరో ద్వారా, అతని సైన్యమంతటి ద్వారా నేను మహిమ పొందుతాను.” ఇక్కడి హీబ్రూ ప్రయోగం రాబోయే సంఘటనల ద్వారా ఫరోకు, అతని సైన్యానికి సంబంధించి యహ్వే ఘనత పొందడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: నేను ... కఠినపరుస్తాను
  rationale: హిఫీల్ రూపం యెహోవానే క్రియకు కర్తగా చూపుతుంది. మూలార్థం ‘బలపరచడం/దృఢపరచడం’ అయినా, ఈ కథా సందర్భంలో ఫరో మొండితనంలో స్థిరపడడాన్ని సూచిస్తున్నందున ‘కఠినపరుస్తాను’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: לֵב פַּרְעֹה
  choice: ఫరో హృదయాన్ని
  rationale: לֵב సంకల్పం, ఆలోచన, అంతరంగ నిర్ణయకేంద్రాన్ని సూచిస్తుంది. ‘హృదయం’ మూలంలోని బైబిలీయ రూపకాన్ని నిలుపుతుంది.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: అతడు వారి వెంటపడతాడు
  rationale: רדף + אחרי సైనిక సందర్భంలో వెంబడించడం లేదా వెంటపడడం అనే అర్థం ఇస్తుంది; ‘వారి వెంటపడతాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: ఫరోపై ... నేను మహిమ పొందుతాను
  rationale: כבד యొక్క నిఫాల్ రూపం ఇక్కడ యెహోవా ఫరోకు సంబంధించిన రాబోయే తీర్పు ద్వారా ఘనత పొందడాన్ని సూచిస్తుంది. తీర్పు సందర్భంలోని ప్రతికూల/విజయ సంబంధాన్ని ‘ఫరోపై’ నిలుపుతుంది; దానిని కేవలం సాధనార్థకంగా మాత్రమే పరిష్కరించదు.
- source_word: וּבְכָל חֵילוֹ
  choice: అతని సైన్యమంతటిపై
  rationale: חַיִל ఇక్కడ ఫరో సైనిక బలగాన్ని సూచిస్తుంది. ‘సైన్యమంతటిపై’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: ఐగుప్తీయులు తెలుసుకుంటారు
  rationale: బహువచన క్రియను అనుసరించి מִצְרַיִם‌ను దేశంలోని ప్రజలుగా వ్యక్తపరచడం తెలుగులో సహజం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: వారు అలాగే చేశారు
  rationale: ముందటి ఆజ్ఞకు విధేయతను తెలిపే సరళమైన కథన ముగింపు.
theological_decisions:
- issue: ఫరో హృదయాన్ని కఠినపరచడంలో దేవుని చర్య
  choice: నేను ఫరో హృదయాన్ని కఠినపరుస్తాను
  alternative: నేను ఫరో హృదయాన్ని దృఢపరుస్తాను; ఫరో హృదయం కఠినపడనిస్తాను
  rationale: మొదటి పురుష హిఫీల్ రూపం దేవుని ప్రత్యక్ష కర్తగా పేర్కొంటుంది. దానిని కేవలం అనుమతిగా మార్చడం మూలంలో లేని సిద్ధాంతపరమైన మృదూకరణ అవుతుంది. అయితే ‘దృఢపరుస్తాను’ అనే మూలార్థ ప్రత్యామ్నాయాన్ని పాదసూచనలో నిలిపింది.
- issue: తీర్పు సందర్భంలో כבד మరియు בְּ భావం
  choice: ఫరోపై, అతని సైన్యమంతటిపై నేను మహిమ పొందుతాను
  alternative: ఫరో ద్వారా, అతని సైన్యమంతటి ద్వారా నేను మహిమ పొందుతాను
  rationale: రాబోయే తీర్పులో ఫరో మరియు అతని సైన్యంపై యెహోవా విజయంతో ఆయన ఘనత ప్రత్యక్షమవుతుందనే భావాన్ని ప్రధాన పాఠ్యం చూపుతుంది. సాధనార్థకమైన ‘ద్వారా’ కూడా సాధ్యమైనందున దానిని పాదసూచనలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన కథన శైలి. మూలంలోని ప్రత్యక్ష దైవకారణాన్ని, తీర్పులో మహిమ పొందడంలోని భావోద్వేగ/దైవశాస్త్రీయ ఉద్రిక్తతను మృదూకరించలేదు. [a], [b] సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
