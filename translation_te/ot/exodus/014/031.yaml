id: EXO.14.31
reference: Exodus 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: te
  text: యాహ్వే ఐగుప్తుపై[a] చూపించిన గొప్ప హస్తాన్ని[b] ఇశ్రాయేలు చూశారు. అప్పుడు ప్రజలు యాహ్వేకు భయపడ్డారు; యాహ్వేను, ఆయన సేవకుడైన మోషేను నమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఐగుప్తులో’ లేదా ‘ఐగుప్తుకు’. హీబ్రూ విభక్తి సందర్భానుసారం ఈ అర్థాలను అనుమతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘గొప్ప చెయ్యి.’ ఇది గొప్ప శక్తిని సూచించే సాధారణ హీబ్రూ రూపకం; ‘బలమైన హస్తం’ లేదా ‘గొప్ప శక్తి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశారు
  rationale: ఇప్పుడే జరిగిన కార్యాన్ని ప్రత్యక్షంగా గ్రహించడాన్ని సూచించే సాధారణ కథన రూపం. ఇశ్రాయేలు సమూహవాచకంగా ఉన్నందున తెలుగులో బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూలోని సమూహవాచక నామాన్ని అలాగే ఉంచి, తరువాత వచ్చే ‘ప్రజలు’ అనే పదంతో ఉన్న కథన సమతౌల్యాన్ని కాపాడుతుంది.
- source_word: הַיָּד הַגְּדֹלָה
  choice: గొప్ప హస్తం
  rationale: అక్షరార్థమైన ‘గొప్ప చెయ్యి/హస్తం’ అనే రూపకాన్ని నిలుపుతుంది. ‘హస్తం’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఈ దైవిక శక్తి రూపకానికి సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: ఐగుప్తుపై యెహోవా ప్రదర్శించిన
  rationale: ‘చేయి’తో ‘చేశాడు’ అని యథాతథంగా అనువదించడం తెలుగులో అసహజం. ‘ప్రదర్శించిన’ అనే రూపం కార్యంలో వెల్లడైన హస్తబలాన్ని తెలియజేస్తుంది; בְּמִצְרַיִם యొక్క సందర్భానుసార ప్రతికూల దిశను ‘ఐగుప్తుపై’గా వ్యక్తం చేస్తుంది, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపంతో అందిస్తుంది.
- source_word: וַיִּירְאוּ
  choice: భయపడ్డారు
  rationale: ירא యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో ఉండగల విస్మయం, భక్తి అనే భావాలను అనువాదంలోనే పరిమితం చేయదు.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: యెహోవాను నమ్మారు
  rationale: אמן + בְ యొక్క నమ్మకం/విశ్వాసం భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: ఆయన సేవకుడైన మోషేను నమ్మారు
  rationale: మోషేపట్ల నమ్మకాన్ని తెలియజేస్తూనే, ‘ఆయన సేవకుడు’ అనే మాటతో మోషే యెహోవాకు లోబడిన అధికార ప్రతినిధి అనే వాక్య నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ప్రజలు యెహోవాకు భయపడడం యొక్క స్వభావం
  choice: ‘భయపడ్డారు’ అని విస్తృతార్థాన్ని నిలుపడం
  alternative: ‘భయభక్తులు కలిగారు’ లేదా ‘భక్తితో విస్మయపడ్డారు’
  rationale: సందర్భంలో భక్తి, విస్మయం ఉన్నప్పటికీ, హీబ్రూ పదంలోని నిజమైన భయ భావాన్ని తొలగించకుండా ఉంచుతుంది.
- issue: యెహోవాను మరియు మోషేను నమ్మడం
  choice: ఇద్దరినీ నమ్మినట్లు సమాంతర నిర్మాణాన్ని ఉంచి, మోషేను ‘ఆయన సేవకుడు’గా పేర్కొనడం
  alternative: మోషే మాటను మాత్రమే నమ్మారని స్పష్టీకరించడం
  rationale: హీబ్రూ ఒకే אמן + בְ నిర్మాణాన్ని యెహోవా, మోషే ఇద్దరితో ఉపయోగిస్తుంది. అయితే ‘ఆయన సేవకుడు’ మోషే స్థానం యెహోవాతో సమానం కాదని మూలపాఠమే తెలిపే విధంగా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైన వాక్య నిర్మాణం వాడబడింది. దైవిక ‘చేయి’ రూపకానికి గౌరవప్రదంగా, కథన శైలికి సరిపోయే ‘హస్తం’ను ఎంచుకున్నారు. ‘భయపడ్డారు’ మరియు ‘నమ్మారు’ అనే సూటి పదాలు మూలంలోని భావ విస్తృతిని పరిమితం చేయకుండా ఉంచుతాయి.
