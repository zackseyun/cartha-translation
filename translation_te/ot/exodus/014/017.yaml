id: EXO.14.17
reference: Exodus 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: te
  text: “ఇదిగో, నేనే ఐగుప్తీయుల హృదయాన్ని కఠినపరుస్తున్నాను; వారు వారి వెంబడి సముద్రంలోకి ప్రవేశిస్తారు, అప్పుడు ఫరో మీదా, అతని సైన్యం మొత్తంపైనా, అతని రథాల మీదా, అతని గుర్రపు సైనికుల మీదా నేను మహిమ పొందుతాను.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో, నేనే
  rationale: హిన్నేని అనే రూపంలోని దృష్టి ఆకర్షణను, ప్రథమ పురుషునిపై ఉన్న బలమైన ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מְחַזֵּק
  choice: కఠినపరుస్తున్నాను
  rationale: పీయేల్ వర్తమాన కృదంతం కొనసాగుతున్న లేదా సమీపంలో జరిగే దేవుని ప్రత్యక్ష చర్యను సూచిస్తుంది; నిర్గమకాండ సందర్భంలో ఇది వారి సంకల్పాన్ని కఠినపరచడం అనే భావాన్ని ఇస్తుంది.
- source_word: לֵב מִצְרַיִם
  choice: ఐగుప్తీయుల హృదయాన్ని
  rationale: హీబ్రూలో ‘హృదయం’ ఏకవచనంలో ఉండి ఐగుప్తీయులను సమూహంగా సూచిస్తుంది. తెలుగు ఏకవచనాన్ని సహజంగానే నిలుపగలదు.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: వారు వీరి వెనుక సముద్రంలోకి వస్తారు
  rationale: בוא అనే క్రియ ప్రస్తుత సందర్భంలో ఇశ్రాయేలీయుల వెనుక సముద్రంలోకి ప్రవేశించడాన్ని సూచిస్తుంది. ‘సముద్రంలోకి’ అనేది సందర్భం నుంచి స్పష్టమైన దిశను తెలుపుతుంది.
- source_word: וְאִכָּבְדָה
  choice: నేను మహిమ పొందుతాను
  rationale: כבד నిఫాల్ రూపం ఫరోపై తీర్పు ద్వారా యెహోవా ఘనత ప్రత్యక్షమవడాన్ని సూచిస్తుంది; ‘మహిమ పొందుతాను’ ఆధునిక తెలుగు బైబిల్ శైలిలో సహజంగా ఉంది.
- source_word: בְּפַרְעֹה
  choice: ఫరో మీద
  rationale: ఇక్కడ ב అనే ఉపసర్గ తీర్పులో దేవుడు తన మహిమను ప్రదర్శించే వ్యక్తి లేదా పరిధిని సూచిస్తుంది; ‘మీద’ విజయం, తీర్పు రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֵילוֹ
  choice: అతని సైన్యమంతటి
  rationale: సైనిక సందర్భంలో חיל అంటే సైనిక బలగం; ‘సైన్యం’ స్పష్టమైన ఆధునిక సమానార్థకం. ‘అంతటి’ כל భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: רִכְבּוֹ
  choice: అతని రథాలు
  rationale: ఏకవచన రూపం సమూహార్థకంగా రథదళాన్ని సూచిస్తుంది; తెలుగులో బహువచనమైన ‘రథాలు’ సహజం.
- source_word: פָרָשָׁיו
  choice: అతని గుర్రపు రౌతులు
  rationale: ఈ పదం సవారీ చేసే సైనికులను సూచిస్తుంది. ‘గుర్రపు రౌతులు’ రథాల పక్కన ఉన్న సైనిక చిత్రాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ఐగుప్తీయుల హృదయాన్ని కఠినపరచడంలో దేవుని చర్య
  choice: ‘నేనే ... కఠినపరుస్తున్నాను’ అని దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని స్పష్టంగా అనువదించడం
  alternative: ‘వారి హృదయం కఠినపడేందుకు అనుమతిస్తున్నాను’ లేదా ‘బలపరుస్తున్నాను’
  rationale: హీబ్రూ వాక్యం ఈ చర్యను దేవునికే ప్రత్యక్షంగా ఆపాదిస్తుంది. దైవ సార్వభౌమత్వం, మానవ బాధ్యత మధ్యనున్న ఉద్రిక్తతను అనువాదంలో తగ్గించకూడదు.
- issue: తీర్పు సందర్భంలో כבד పదం
  choice: ‘నేను మహిమ పొందుతాను’
  alternative: ‘నేను మహిమపరచబడతాను’
  rationale: రెండు అనువాదాలూ సాధ్యమే. ఎంచుకున్న రూపం ఫరోపై తీర్పు ద్వారా దేవుని మహిమ ప్రత్యక్షమై ఆయనకు ఘనత కలగడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని సమూహార్థక ఏకవచనం ‘హృదయాన్ని’గా నిలుపబడింది. ‘సముద్రంలోకి’ అనేది తక్షణ కథా సందర్భాన్ని స్పష్టం చేసే పరిమిత సందర్భపూరణ.
