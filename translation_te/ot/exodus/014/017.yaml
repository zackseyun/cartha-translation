revisions:
- from: “ఇదిగో, నేనే ఐగుప్తీయుల హృదయాన్ని కఠినపరుస్తున్నాను; వారు వీరి వెనుక సముద్రంలోకి వస్తారు. అప్పుడు ఫరో మీదా, అతని సైన్యమంతటి మీదా—అతని రథాల మీదా, అతని గుర్రపు రౌతుల మీదా—నేను మహిమ పొందుతాను.”
  to: “ఇదిగో, నేనే ఐగుప్తీయుల హృదయాన్ని కఠినపరుస్తున్నాను; వారు వారి వెంబడి సముద్రంలోకి ప్రవేశిస్తారు, అప్పుడు ఫరో మీదా, అతని సైన్యం మొత్తంపైనా, అతని రథాల మీదా, అతని గుర్రపు సైనికుల మీదా నేను మహిమ పొందుతాను.”
  rationale: సందర్భపూరణగా ఉన్న ‘సముద్రంలోకి’ను నిలుపుతూ, ఇశ్రాయేలీయుల వెంబడింపును స్పష్టంగా చేశాము. మూలంలోని దేవుని ప్రత్యక్ష చర్య, సమూహార్థక ఏకవచనమైన ‘హృదయం,’ అలాగే ఫరో, అతని సైన్యం, రథాలు, గుర్రపు సైనికులపై మహిమ పొందడం అనే వరుసను కాపాడాము. ఎటువంటి సిద్ధాంతపరమైన వివరణను జోడించలేదు.
