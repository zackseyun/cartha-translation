- from: ఈజిప్టీయులు వారిని వెంబడిస్తూ, ఫరో గుర్రాలన్నిటితో[a], అతని రథాలతో, అతని గుర్రపు రౌతులతో వారి వెనుకగా సముద్రం మధ్యలోకి ప్రవేశించారు.[b]
  to: ఈజిప్టీయులు వారిని వెంబడించి, ఫరో గుర్రాలన్నీ[a], అతని రథాలు, అతని గుర్రపు రౌతులు—అందరూ వారి వెనుకగా సముద్రం మధ్యలోకి ప్రవేశించారు.[b]
  rationale: The revision makes the horse, chariot, and horseman list an appositional specification of the Egyptian force, with “అందరూ” indicating that the whole listed force is included. It also renders pursuit and entry as successive actions, while retaining both supplied footnote anchors and their intended lexical alternatives.
