translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా, వెంబడింపు మరియు సముద్రంలోకి ప్రవేశం అనే వరుస చర్యలను సహజ తెలుగు వాక్యంగా మలచింది.
