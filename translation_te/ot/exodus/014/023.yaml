base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: te
  text: ఈజిప్టీయులు వారిని వెంబడించి, ఫరో గుర్రాలన్నీ[a], అతని రథాలు, అతని గుర్రపు రౌతులు—అందరూ వారి వెనుకగా సముద్రం మధ్యలోకి ప్రవేశించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “ఫరో గుర్రమంతా” అని సమూహార్థక ఏకవచనం ఉంది; తెలుగులో సహజంగా “ఫరో గుర్రాలన్నీ” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి వెనుకగా సముద్రం నడిమిలోకి వెళ్లారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: వెంబడిస్తూ
  rationale: רדף సైనిక సందర్భంలో వెంబడించడం అనే అర్థాన్ని ఇస్తుంది; తరువాతి ప్రవేశ క్రియతో సహజంగా అనుసంధానించేందుకు తెలుగు అసమాపక రూపం వాడబడింది.
- source_word: מִצְרַיִם
  choice: ఈజిప్టీయులు
  rationale: బహువచన క్రియ మరియు కథన సందర్భం దేశాన్ని కాక ఈజిప్టు ప్రజలను లేదా సైన్యాన్ని సూచిస్తున్నాయి.
- source_word: וַיָּבֹאוּ
  choice: ప్రవేశించారు
  rationale: בוא ఇక్కడ సముద్రంలోని మార్గంలోకి వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో 'ప్రవేశించారు' స్పష్టంగా, సహజంగా ఉంది.
- source_word: אַחֲרֵיהֶם
  choice: వారి వెనుకగా
  rationale: వెంబడిస్తూ అనుసరించి వెళ్లిన భావాన్ని నిలుపుతుంది; 'వారి తరువాత' కంటే ఈ సైనిక కదలికలో సహజంగా ఉంటుంది.
- source_word: כֹּל
  choice: అన్నిటితో
  rationale: తదనంతర సైనిక వనరుల సమగ్రతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סוּס פַּרְעֹה
  choice: ఫరో గుర్రాలన్నిటితో
  rationale: మూలంలోని ఏకవచన 'గుర్రం' సమూహార్థకంగా వాడబడింది; తెలుగులో బహువచనం సహజమైన భావానువాదం.
- source_word: רִכְבּוֹ
  choice: అతని రథాలతో
  rationale: רכב ఇక్కడ రథాలను లేదా రథదళాన్ని సూచించవచ్చు; జాబితాలోని స్పష్టమైన వస్తువులను నిలుపుతూ 'రథాలు' ఎంచుకోబడింది.
- source_word: וּפָרָשָׁיו
  choice: అతని గుర్రపు రౌతులతో
  rationale: פָרָשָׁיו గుర్రాలపై యుద్ధం చేసే రౌతులను సూచిస్తుంది; 'గుర్రపు రౌతులు' ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: సముద్రం మధ్యలోకి
  rationale: תּוֹךְ సముద్రంలోకి ప్రవేశించడమే కాక దాని అంతర్భాగంలోకి వెళ్లిన భావాన్ని బలపరుస్తుంది.
