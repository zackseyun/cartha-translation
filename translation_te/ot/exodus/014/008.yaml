source:
  edition: WLC
  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: te
  text: యెహోవా ఈజిప్టు రాజైన ఫరో హృదయాన్ని కఠినపరిచాడు[a], అతడు ఇశ్రాయేలు కుమారులను వెంబడించాడు, ఇశ్రాయేలు కుమారులు ఎత్తిన చేతితో బయలుదేరుతూ ఉండగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరో హృదయాన్ని దృఢపరిచాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “బలపరిచాడు/దృఢపరిచాడు” అనే భావం ఉంది; అయితే నిర్గమకాండంలో ఫరో హృదయానికి సంబంధించిన ఈ ప్రయోగం సాధారణంగా “కఠినపరిచాడు” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధైర్యంగా.” హీబ్రూ నుడికారం అక్షరార్థంగా “ఎత్తిన చేతితో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామ స్వరూపాన్ని నిలుపుతుంది.
- source_word: וַיְחַזֵּק
  choice: కఠినపరిచాడు
  rationale: חזק పదానికి అక్షరార్థంగా ‘బలపరచు/దృఢపరచు’ అనే భావం ఉన్నా, ఫరో హృదయానికి సంబంధించిన నిర్గమకాండంలోని పునరావృత ప్రయోగంలో అతని మొండి సంకల్పాన్ని కఠినం చేయడం అనే భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: לֵב
  choice: హృదయాన్ని
  rationale: ఇక్కడ ‘హృదయం’ సంకల్పం, అంతరంగ వైఖరికి కేంద్రం; మూల రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజైన ఫరో
  rationale: హీబ్రూ పదబంధంలోని బిరుదు-సంబంధాన్ని సహజమైన ఆధునిక తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: వెంబడించాడు
  rationale: శత్రుత్వంతో తరుముకుంటూ వెళ్లే సైనిక సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పదబంధాన్ని, దాని పునరుక్తితో సహా, దగ్గరగా నిలుపుతుంది.
- source_word: יֹצְאִים
  choice: బయలుదేరుతూ ఉన్నారు
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న చర్య భావాన్ని సందర్భానుసారంగా ప్రతిబింబిస్తుంది.
- source_word: בְּיָד רָמָה
  choice: ఎత్తిన చేతితో
  rationale: ‘ఎత్తబడిన/ఉన్నతమైన చేతితో’ అనే స్పష్టమైన మూల చిత్రాన్ని నిలుపుతూ, దాని ధైర్యపూరిత భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: ఫరో హృదయాన్ని కఠినపరచడంలో దేవుని ప్రత్యక్ష చర్య
  choice: యెహోవా ... ఫరో హృదయాన్ని కఠినపరిచాడు
  alternative: యెహోవా ... ఫరో హృదయాన్ని దృఢపరిచాడు
  rationale: హీబ్రూ వాక్యం చర్యను నేరుగా యెహోవాకే ఆపాదిస్తుంది. ఆ వేదాంత ఉద్రిక్తతను మృదువుచేయకుండా ప్రధాన పాఠ్యంలో నిలిపి, క్రియలోని ‘బలపరచు/దృఢపరచు’ అనే పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలపదబంధపు పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది; ‘ఎత్తిన చేతితో’ అనే స్పష్టమైన హీబ్రూ రూపకం వ్యాఖ్యానాత్మకంగా మార్చకుండా ఉంచబడింది.
