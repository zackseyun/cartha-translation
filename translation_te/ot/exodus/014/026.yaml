id: EXO.14.26
reference: Exodus 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీ చేతిని సముద్రం మీద చాపు; నీళ్లు ఐగుప్తీయుల మీదికి, వారి రథాల మీదికి, వారి గుర్రపు రౌతుల మీదికి తిరిగి వస్తాయి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియను సరళ భవిష్యత్తుగా, “నీళ్లు ఐగుప్తీయుల మీదికి తిరిగి వస్తాయి,” అని అనువదించవచ్చు; ఇక్కడ అది మోషే చర్య వల్ల కలగవలసిన ఫలితాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి సంఘటనకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: నీ చెయ్యిని ... చాపు
  rationale: ఆజ్ఞారూప క్రియ సూచించే చేతిని సముద్రం వైపు/మీదికి చాపే స్పష్టమైన శారీరక చర్యను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַל־הַיָּם
  choice: సముద్రం మీదికి
  rationale: עַל యొక్క స్థలసంబంధ భావాన్ని, ఈ సంకేతాత్మక చర్యకు సహజంగా సరిపోయే ‘మీదికి’తో అందించాం.
- source_word: וְיָשֻׁבוּ
  choice: అప్పుడు ... తిరిగి వస్తాయి
  rationale: ఆజ్ఞ తరువాతి ఉపసర్గ క్రియను సరళ భవిష్యత్తు/ఫలితంగా ఉంచి, హీబ్రూ నిర్మాణంలోని నిజమైన స్వల్ప సందిగ్ధతను ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించలేదు.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: హీబ్రూ బహువచన రూపానికి సందర్భానుకూలంగా, సాధారణ ఆధునిక తెలుగులో సహజమైన బహువచన పదాన్ని ఎంచుకున్నాం.
- source_word: עַל מִצְרַיִם
  choice: ఐగుప్తీయుల మీదికి
  rationale: నీళ్లు వారిని కప్పుతూ తిరిగి రావడమనే దృశ్యాన్ని నిలుపుతుంది; ‘వ్యతిరేకంగా’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: עַל רִכְבּוֹ
  choice: వారి రథాల మీదికి
  rationale: హీబ్రూలో ప్రత్యయం రూపరీత్యా ఏకవచనమైనా, ‘ఐగుప్తు/ఐగుప్తీయులు’ సమూహవాచక సూచన కనుక తెలుగులో సహజమైన బహువచన స్వామ్యాన్ని వాడాం.
- source_word: וְעַל פָּרָשָׁיו
  choice: వారి గుర్రపు రౌతుల మీదికి
  rationale: פָּרָשִׁיםను సైనిక సాంకేతిక పదంతో విస్తరించకుండా, గుర్రాలపై స్వారీ చేసే యోధులనే ప్రత్యక్ష భావంతో అందించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణాన్ని నిర్ధారితమైనదిగా చూపలేదు.
- issue: וְיָשֻׁבוּ యొక్క భావసంబంధం
  choice: అప్పుడు ... తిరిగి వస్తాయి
  alternative: నీళ్లు ... తిరిగి వచ్చేలా
  rationale: ఈ క్రియను సరళ భవిష్యత్తుగానూ, మోషే చర్యకు ఉద్దేశిత ఫలితంగానూ గ్రహించవచ్చు. ప్రధాన పాఠ్యంలో హీబ్రూ సమన్వయ నిర్మాణాన్ని నిలిపి, ప్రత్యామ్నాయ ఫలితార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘చెయ్యి,’ ‘నీళ్లు’ వంటి సాధారణ పదాలతో పాఠ్యాన్ని ప్రజలకు సులభంగా ఉంచుతూ, ‘రథాలు,’ ‘గుర్రపు రౌతులు’ ద్వారా చారిత్రక దృశ్యాన్ని స్పష్టంగా నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
