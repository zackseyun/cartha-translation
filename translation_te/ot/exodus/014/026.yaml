revisions:
- from: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “నీ చెయ్యిని సముద్రం మీదికి చాపు; అప్పుడు నీళ్లు ఐగుప్తీయుల మీదికి—వారి రథాల మీదికి, వారి గుర్రపు రౌతుల మీదికి—తిరిగి వస్తాయి.[a]”'
  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీ చేతిని సముద్రం మీద చాపు; నీళ్లు ఐగుప్తీయుల మీదికి, వారి రథాల మీదికి, వారి గుర్రపు రౌతుల మీదికి తిరిగి వస్తాయి.[a]”'
  rationale: The revision aligns the divine name with the English POB audit trail, more directly reflects the Hebrew spatial expression, and makes the footnote idiomatic Telugu while preserving the future/resultative ambiguity of וְיָשֻׁבוּ.
