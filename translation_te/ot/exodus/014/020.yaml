  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: te
  text: అది ఐగుప్తు శిబిరానికీ ఇశ్రాయేలు శిబిరానికీ మధ్యలోకి వచ్చింది.[a] అక్కడ మేఘమూ చీకటీ ఉన్నాయి; అయినా అది రాత్రిని వెలిగించింది. రాత్రంతా ఒక శిబిరం మరొక శిబిరం దగ్గరకు రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది ఐగుప్తు శిబిరానికీ ఇశ్రాయేలు శిబిరానికీ మధ్యలోకి వచ్చింది; మేఘమూ చీకటీ ఉన్నాయి, కాని అది రాత్రివేళ వెలుగిచ్చింది.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; చీకటి, వెలుగు రెండు శిబిరాలకు ఎలా సంబంధించినవో ప్రాచీన అనువాదాలూ ఇతర అనువాదాలూ భిన్నంగా అర్థం చేసుకున్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అది ... మధ్యకు వచ్చింది
  rationale: ఏకవచన క్రియ ముందటి సందర్భంలోని దేవుని దూతను లేదా మేఘస్తంభాన్ని సూచించవచ్చు. ‘అది’ అని అనువదించడం ద్వారా ఈ సూచనలోని సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతూ కదలికను సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: בֵּין ... וּבֵין
  choice: '...కి ...కి మధ్యకు'
  rationale: రెండు శిబిరాల మధ్యనున్న స్థలాన్ని సూచించే సాధారణ ప్రాదేశిక అర్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מַחֲנֵה מִצְרַיִם / מַחֲנֵה יִשְׂרָאֵל
  choice: ఐగుప్తు శిబిరం / ఇశ్రాయేలు శిబిరం
  rationale: హీబ్రూలోని ‘ఐగుప్తు శిబిరం’, ‘ఇశ్రాయేలు శిబిరం’ అనే నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, ప్రజలనూ వారి సైనిక శిబిరాలనూ సూచించే సందర్భోచిత పదాన్ని వాడాం.
- source_word: הֶעָנָן וְהַחֹשֶׁךְ
  choice: మేఘమూ చీకటీ
  rationale: రెండు నిర్దిష్ట నామవాచకాలనూ సమాంతరంగా ఉంచి, మూలంలోని సంక్షిప్తమైన పక్కపక్క అమరికను నిలిపాం.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: అది రాత్రిని వెలిగించింది
  rationale: אור క్రియలోని ‘వెలుగు ఇవ్వడం/వెలిగించడం’ భావాన్నీ, ‘రాత్రి’ ప్రత్యక్ష కర్మగా ఉన్న నిర్మాణాన్నీ స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: ఒక శిబిరం మరొక శిబిరం దగ్గరకు రాలేదు
  rationale: ‘ఇది దాని దగ్గరకు’ అనే హీబ్రూ పరస్పర ప్రయోగం ఇక్కడ రెండు శిబిరాలను సూచిస్తుంది; తెలుగులో సూచ్యాలను స్పష్టం చేయడం సహజంగా ఉంటుంది.
- source_word: כָּל־הַלָּיְלָה
  choice: రాత్రంతా
  rationale: కాలవ్యాప్తిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలోని ఏకవచన క్రియల కర్త
  choice: ‘అది’ అని అనువదించి కర్తను స్పష్టంగా పేరుపెట్టకుండా ఉంచడం
  alternative: ‘ఆయన’ అని దేవుని దూతను సూచించడం, లేదా ‘మేఘస్తంభం’ అని స్పష్టంగా చేర్చడం
  rationale: ముందటి సందర్భంలో దేవుని దూత, మేఘస్తంభం రెండూ ఉన్నాయి; హీబ్రూ ఏకవచన రూపం ఏ సూచ్యాన్ని ఉద్దేశించిందో పూర్తిగా నిర్ధారించదు. అందువల్ల వ్యాఖ్యానాత్మకంగా ఒకదానిని మాత్రమే నిర్ణయించలేదు.
- issue: చీకటి మరియు వెలుగు మధ్య సంబంధం
  choice: ‘అయినా అది రాత్రిని వెలిగించింది’ అని విరుద్ధ సంబంధాన్ని సూచించడం
  alternative: ‘మేఘమూ చీకటీ ఉన్నాయి; అది రాత్రికి వెలుగిచ్చింది’ లేదా రెండు శిబిరాలకు వేర్వేరు ప్రభావాలు కలిగాయని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం అత్యంత సంక్షిప్తంగా ఉంది; చీకటి మధ్య వెలుగు అనే విరుద్ధత కనిపించినా, అది రెండు శిబిరాలకు ఎలా పంచబడిందో వచనం స్పష్టంగా చెప్పదు. ప్రధాన పాఠంలో పరిమిత విరుద్ధ సూచనను ఉంచి, విస్తృత సందిగ్ధతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘శిబిరం’, ‘మేఘం’, ‘చీకటి’, ‘వెలిగించింది’ వంటి సామాన్యులకు అర్థమయ్యే పదాలను ఉపయోగించాం. మూలంలోని సంక్షిప్తతను కాపాడుతూ, అస్పష్టతను పాదటిప్పణితో గుర్తించాం.
