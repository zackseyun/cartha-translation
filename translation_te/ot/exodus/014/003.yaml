translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా పదబంధాన్ని నిలిపి, నְבֻכִים లోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో చూపించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
