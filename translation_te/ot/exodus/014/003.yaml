  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמַ֤ר פַּרְעֹה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּ/אָ֑רֶץ סָגַ֥ר עֲלֵי/הֶ֖ם הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: te
  text: ఎందుకంటే ఫరో ఇశ్రాయేలు కుమారుల గురించి, “వారు దేశంలో దిక్కుతోచక ఉన్నారు[a]; అరణ్యం వారిని ఇరికించింది[b]” అని చెబుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు దేశంలో అయోమయంలో ఉన్నారు”; లేదా “వారు దేశంలో చిక్కుకున్నారు.” హీబ్రూ పదం దిక్కుతోచకపోవడం, అయోమయం చెందడం లేదా చిక్కుబడడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అరణ్యం వారిని దిగ్బంధించింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: ఎందుకంటే ... అని అనుకుంటాడు
  rationale: సందర్భంలో ఇది యెహోవా ముందుగా తెలియజేస్తున్న ఫరో ప్రతిస్పందన; waw వివరణాత్మక సంబంధాన్ని సూచిస్తుంది. ఇక్కడ אָמַר అంతరంగ నిర్ణయాన్ని లేదా తలంపును కూడా సూచించగలదు కాబట్టి సహజమైన తెలుగులో ‘అనుకుంటాడు’ అని ఇచ్చాం.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: రాజబిరుదుకు తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల గురించి
  rationale: אמר తో వచ్చిన לְ మాటకు సంబంధించిన అంశాన్ని సూచిస్తుంది; ‘కుమారులు’ అనే హీబ్రూ రూపకల్పనను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: נְבֻכִים
  choice: దిక్కుతోచని స్థితిలో ఉన్నారు
  rationale: ఈ కృదంతం అయోమయం, దారి తెలియకపోవడం, చిక్కుకుపోవడం వంటి అర్థవ్యాప్తిని కలిగి ఉంది. మూలంలో స్పష్టంగా లేని ‘తిరుగుతున్నారు’ అనే కదలిక భావాన్ని చేర్చకుండా పరిస్థితిజన్య అయోమయాన్ని వ్యక్తం చేస్తుంది.
- source_word: הֵם
  choice: వారు ... ఉన్నారు
  rationale: హీబ్రూ విధేయ వాక్య నిర్మాణంలోని స్పష్టమైన సర్వనామాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בָּאָרֶץ
  choice: ఈ దేశంలో
  rationale: אֶרֶץ కు ‘దేశం/భూభాగం’ అనే సాధారణ అర్థం ఉంది. తెలుగు సందర్భంలో సూచిత ప్రాంతాన్ని సహజంగా తెలియజేయడానికి ‘ఈ దేశంలో’ అని ఇచ్చాం; ఖచ్చితమైన భౌగోళిక పరిధిని నిర్ణయించలేదు.
- source_word: סָגַר עֲלֵיהֶם
  choice: వారిని చుట్టుముట్టి బంధించింది
  rationale: ఈ ప్రయోగం వారిని బయటకు వెళ్లలేని విధంగా మూసివేయడం లేదా ఇరికించడం అనే చిత్రాన్ని ఇస్తుంది; తెలుగులో అర్థం స్పష్టంగా ఉండేలా రెండు సమీప భావాలను కలిపి ఇచ్చాం.
- source_word: הַמִּדְבָּר
  choice: అరణ్యం
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం లేని బీడు ప్రాంతాన్ని సూచిస్తుంది; ‘అరణ్యం’ స్థిరమైన, విస్తృతార్థక తెలుగు బైబిలు పదం.
