id: EXO.14.18
reference: Exodus 14:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָדְע֥וּ מִצְרַ֖יִם כִּי אֲנִ֣י יְהוָ֑ה בְּ/הִכָּבְדִ֣/י בְּ/פַרְעֹ֔ה בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: te
  text: నేను ఫరోపై, అతని రథాలపై, అతని గుర్రపు స్వారులపై మహిమ పొందినప్పుడు[a], నేనే యాహ్వే[b] అని ఐగుప్తీయులు తెలుసుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఫరోపై, అతని రథాలపై, అతని గుర్రపు స్వారులపై మహిమపరచబడినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే” అనేది హీబ్రూ దైవనామమైన YHWHకు ధ్వన్యంతరీకరణ; అనేక అనువాదాల్లో దీనిని “ప్రభువు” అని అందిస్తారు.
    reason: divine_name
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: తెలుసుకుంటారు
  rationale: సందర్భంలోని రాబోయే ఫలితాన్ని సూచించే సంయుక్త క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో భవిష్యత్ భావంతో వ్యక్తపరుస్తుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: ఇక్కడ తెలుసుకునే కర్త దేశం కాదు, ఐగుప్తు ప్రజలు; అందువల్ల ప్రజలను సూచించే రూపం ఎంచుకోబడింది.
- source_word: כִּי אֲנִי יְהוָה
  choice: నేనే యాహ్వే అని
  rationale: ఇది దైవ స్వీయ-గుర్తింపు సూత్రం. ‘నేనే’ అనే రూపం אֲנִי లోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా ప్రాచుర్యంలో ఉన్న ధ్వన్యంతరీకరణతో అందిస్తుంది.
- source_word: בְּהִכָּבְדִי
  choice: నేను మహిమ పొందినప్పుడు
  rationale: בְּ తో కూడిన నిఫాల్ క్రియానామం కాలార్థాన్ని, అలాగే దేవుడు మహిమపరచబడటం లేదా ఘనత పొందటం అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּפַרְעֹה
  choice: ఫరో ద్వారా
  rationale: ఫరోకు జరిగే తీర్పు దేవుని మహిమ వెల్లడయ్యే సాధనం లేదా పరిధి అనే భావాన్ని ‘ద్వారా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּרִכְבּוֹ
  choice: అతని రథాల ద్వారా
  rationale: רֶכֶב ఇక్కడ సమూహార్థంలో రథదళాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు ‘రథాలు’ స్పష్టంగా ఉంటుంది.
- source_word: וּבְפָרָשָׁיו
  choice: అతని గుర్రపు రౌతుల ద్వారా
  rationale: פָּרָשִׁים అనేది గుర్రాలపై యుద్ధం చేసే రౌతులను లేదా అశ్వదళాన్ని సూచిస్తుంది; ‘గుర్రపు రౌతులు’ స్పష్టమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామమే ఉంది. వ్యక్తిగత నామాన్ని నిలుపుటకు ‘యాహ్వే’ వాడబడింది; పాఠకుల అవగాహన కోసం పాదసూచిక జోడించబడింది.
- issue: בְּהִכָּבְדִי లోని నిఫాల్ భావం
  choice: నేను మహిమ పొందినప్పుడు
  alternative: నేను నా మహిమను కనబరచినప్పుడు
  rationale: నిఫాల్ రూపం వ్యాకరణపరంగా ‘మహిమ పొందడం/మహిమపరచబడడం’ అనే భావాన్ని ముందుకు తెస్తుంది. సందర్భం దేవుని మహిమ వెల్లడవడాన్ని కూడా సూచించినప్పటికీ, దాన్ని క్రియాశీల రూపంగా మాత్రమే మార్చకుండా ప్రధాన పాఠంలో మూలరూపపు ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూడు సార్లు వచ్చే בְּ నిర్మాణాన్ని ‘ద్వారా’ అనే పునరావృతితో నిలిపి, మూలంలోని సమాంతరతను కాపాడాం. ‘అశ్వదళం’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘గుర్రపు రౌతులు’ ఎంచుకోబడింది.
