id: EXO.14.10
reference: Exodus 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: te
  text: ఫరో సమీపిస్తుండగా, ఇశ్రాయేలు కుమారులు కన్నెత్తి చూశారు; ఇదిగో, ఐగుప్తీయులు వారి వెనుక కదులుతూ వస్తున్నారు. వారు చాలా భయపడ్డారు; ఇశ్రాయేలు కుమారులు యాహ్వేకు మొరపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְרִיב
  choice: సమీపిస్తుండగా
  rationale: హిఫిల్ రూపమైనప్పటికీ ఇక్కడ ఫరోను కర్తగా తీసుకొని అకర్మక భావంలో ‘దగ్గరకు వచ్చాడు/సమీపించాడు’ అని అర్థమవుతుంది. సందర్భంలోని కొనసాగుతున్న ఉద్విగ్నతను ‘సమీపిస్తుండగా’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: కన్నెత్తి చూశారు
  rationale: అక్షరార్థంగా ‘తమ కళ్లను ఎత్తారు’ అనే హెబ్రీయ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక వ్యక్తీకరణ.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన దృశ్యాన్ని, కథనంలోని నాటకీయ తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: మూలంలో ‘ఐగుప్తు’ అనే దేశనామమే ఉన్నా, ఇక్కడ అది వెంబడిస్తున్న ఐగుప్తు సైన్యాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో భూభాగమే కదిలివస్తున్నట్లు అపార్థం కాకుండా ‘ఐగుప్తీయులు’ అని ఇచ్చాం.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: తమ వెనుక కదిలివస్తున్నారు
  rationale: נסע యొక్క ప్రాథమిక కదలిక భావాన్ని కాపాడుతూ, సైనిక సందర్భానికి సరిపోయే సహజ తెలుగు. ‘వెంబడిస్తున్నారు’ అని ఫలితార్థాన్ని మరీ స్పష్టీకరించలేదు.
- source_word: וַיִּירְאוּ מְאֹד
  choice: చాలా భయపడి
  rationale: క్రియతో కూడిన తీవ్రతాసూచకాన్ని సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּצְעֲקוּ
  choice: మొరపెట్టారు
  rationale: భయం, ఆపద మధ్య దేవునివైపు చేసిన అత్యవసర కేకను ‘మొరపెట్టారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా ప్రాచుర్యంలో ఉన్న ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని వ్యాకరణపరంగా పుంలింగమైన సమష్టి జాతీయ నామాన్ని చదును చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; ‘ప్రభువు’ అనే బిరుదుతో దాన్ని మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణాన్ని ఖచ్చితమని ప్రకటించలేదు.
- issue: בְנֵי יִשְׂרָאֵל అనే సమష్టి పుంలింగ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని నిలిపి, దాని జాతీయ/సమష్టి ప్రయోగాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘కన్నెత్తి చూశారు’, ‘ఇదిగో’ ద్వారా మూలంలోని దృశ్యాత్మకతను నిలిపి, అసహజమైన పదేపదే అనువాదాన్ని నివారించాం.
