revisions:
- from: ఫరో సమీపిస్తుండగా, ఇశ్రాయేలు కుమారులు కన్నెత్తి చూశారు. ఇదిగో, ఐగుప్తీయులు తమ వెనుక కదిలివస్తున్నారు! అప్పుడు వారు చాలా భయపడి, ఇశ్రాయేలు కుమారులు యెహోవాకు మొరపెట్టారు.
  to: ఫరో సమీపిస్తుండగా, ఇశ్రాయేలు కుమారులు కన్నెత్తి చూశారు; ఇదిగో, ఐగుప్తీయులు వారి వెనుక కదులుతూ వస్తున్నారు. వారు చాలా భయపడ్డారు; ఇశ్రాయేలు కుమారులు యాహ్వేకు మొరపెట్టారు.
  rationale: The revision clarifies that the Egyptians were moving behind the Israelites, not behind themselves, and brings the rendering of the Tetragrammaton into conformity with the POB’s Yahweh policy. The rest retains the draft’s accurate, natural rendering of the Hebrew narrative.
