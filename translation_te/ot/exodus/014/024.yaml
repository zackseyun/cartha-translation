  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: te
  text: తెల్లవారుజాము కావలి సమయంలో, యాహ్వే అగ్ని-మేఘ స్తంభం ద్వారా[a] ఈజిప్టీయుల శిబిరం వైపు కిందికి చూసి, ఆ శిబిరాన్ని గందరగోళానికి గురిచేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అగ్ని-మేఘ స్తంభంలోనుండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆ శిబిరాన్ని భయాందోళనకు గురిచేశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: తెల్లవారుజాము కావలి సమయంలో
  rationale: אַשְׁמֹרֶת సూచించే రాత్రి చివరి కావలి కాలాన్ని ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా, దాని కాలనిర్దిష్టతను నిలుపుతూ అనువదించబడింది.
- source_word: וַיַּשְׁקֵף
  choice: కిందికి చూసి
  rationale: שׁקף క్రియలో ఉన్న పైస్థానం నుంచి కిందికి లేదా బయటికి చూసే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించబడింది.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: ఈజిప్టీయుల శిబిరం
  rationale: ఈ నిర్మాణం ఈజిప్టీయులకు చెందిన సైనిక శిబిరాన్ని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: అగ్ని, మేఘ స్తంభం ద్వారా
  rationale: בְ ఉపసర్గలోని సాధనార్థక భావాన్ని ప్రధాన పాఠ్యంలో చూపుతుంది; స్థానార్థకంగా ‘స్తంభంలోనుండి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וַיָּהָם
  choice: గందరగోళానికి గురిచేశాడు
  rationale: הום యొక్క కారణార్థక బలాన్ని, కలవరం లేదా గందరగోళం కలిగించడం అనే భావాన్ని నిలుపుతుంది; తరువాతి సంఘటనలను ముందుగానే ‘ఓడించాడు’ అని అతిశయంగా చెప్పదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘తెల్లవారుజాము కావలి’ ప్రాచీన రాత్రి-కావలి వ్యవస్థను అతిగా వివరణ చేయకుండా తెలియజేస్తుంది. మూలంలోని సాధనార్థక/స్థానార్థక సందిగ్ధతను పాదసూచికతో కాపాడబడింది.
