language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: te
  text: నీళ్లు తిరిగి వచ్చి, రథాలనూ గుర్రపు సైనికులనూ[a]—వారి వెంట సముద్రంలోకి ప్రవేశించిన ఫరో సైన్యమంతటినీ—కప్పివేశాయి; వారిలో ఒక్కడు కూడా మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుర్రపు దళం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: నీళ్లు తిరిగి వచ్చి
  rationale: విభజింపబడిన సముద్ర జలాలు మునుపటి స్థితికి తిరిగి రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְכַסּוּ
  choice: కప్పివేశాయి
  rationale: כסה అనే క్రియకు ఉన్న ప్రాథమికమైన ‘కప్పు’ భావాన్ని నిలుపుతూ, సందర్భంలోని సంపూర్ణ చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָרֶכֶב
  choice: రథాలు
  rationale: ఇక్కడ సమూహార్థకంగా ఉన్న రథబలాన్ని సాధారణ పాఠకులకు స్పష్టంగా, నేరుగా తెలియజేస్తుంది.
- source_word: הַפָּרָשִׁים
  choice: గుర్రపు సైనికులు
  rationale: గుర్రాలపై యుద్ధం చేసే వారిని ఆధునిక, సులభమైన తెలుగులో సూచిస్తుంది; సమూహార్థకమైన ‘గుర్రపు దళం’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: ఫరో సైన్యమంతటినీ
  rationale: לְכֹל లోని సంపూర్ణతను, חֵיל లోని సైనిక బలగం అనే భావాన్ని కాపాడుతుంది.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: వారి వెంట సముద్రంలోకి వచ్చిన
  rationale: వెంబడిస్తూ సముద్రంలో ప్రవేశించిన చర్యను తెలియజేస్తూ, మూలంలోని ‘వారి’ అనే సర్వనామాన్ని అనవసరంగా విశదీకరించకుండా నిలుపుతుంది.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: వారిలో ఒక్కడు కూడా మిగలలేదు
  rationale: పేర్కొన్న వెంబడింపు సైన్యంలో ఒక్కరు కూడా మిగలలేదనే హెబ్రీ నుడికారపు ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఫరో సైన్య నాశనం యొక్క పరిధి
  choice: సముద్రంలోకి వారి వెంట వచ్చిన ఫరో సైన్యమంతటిలో ఒక్కడు కూడా మిగలలేదని అనువదించబడింది.
  alternative: ఈ మాటను ఈజిప్టు సైనికులందరికీ, వారు సముద్రంలోకి ప్రవేశించారా లేదా అన్నదానితో సంబంధం లేకుండా, వర్తింపజేయడం.
  rationale: హెబ్రీ వాక్య నిర్మాణం సంపూర్ణ నాశనాన్ని ‘వారి వెంట సముద్రంలోకి వచ్చిన’ సైన్యానికే అనుసంధానిస్తుంది; అందువల్ల వాక్యంలోని ఉద్ఘాటనను నిలుపుతూ దాని పరిధిని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథన శైలి. ‘అశ్వికులు’ వంటి అరుదైన పదానికి బదులుగా ‘గుర్రపు సైనికులు’ వాడబడింది. మధ్య గీతలు ‘రథాలు, గుర్రపు సైనికులు’ అనేవారు ఫరో సైన్యంలోని వెంబడింపు బలగమని స్పష్టపరుస్తాయి.
