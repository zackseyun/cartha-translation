revisions:
- from: నీళ్లు తిరిగి వచ్చి, రథాలనూ గుర్రపు సైనికులనూ[a]—వారి వెంట సముద్రంలోకి వచ్చిన ఫరో సైన్యమంతటినీ—కప్పివేశాయి; వారిలో ఒక్కడు కూడా మిగలలేదు.
