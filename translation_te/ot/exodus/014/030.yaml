source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: te
  text: ఆ రోజున యహ్వే ఇశ్రాయేలును ఐగుప్తు చేతిలోనుండి[a] రక్షించాడు. సముద్ర తీరాన[b] చనిపోయిన ఐగుప్తీయులను ఇశ్రాయేలు చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఐగుప్తు చేతిలోనుండి’; అంటే ఐగుప్తు అధికారంనుండి లేదా ఆధీనంనుండి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘సముద్రపు ఒడ్డున.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: రక్షించాడు
  rationale: ישׁע ధాతువు హిఫిల్ రూపం ఇక్కడ ప్రమాదం మరియు అణచివేత నుంచి విడిపించి కాపాడడాన్ని సూచిస్తుంది. ‘రక్షించాడు’ సహజమైన ఆధునిక తెలుగు పదం; దేవుడే విమోచించిన కార్యాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలాన్ని సూచించే ఈ హీబ్రూ పదబంధానికి సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: מִיַּד מִצְרָיִם
  choice: ఐగుప్తు చేతిలోనుండి
  rationale: మూలంలోని ‘చేతిలోనుండి’ అనే అధికారాన్ని లేదా ఆధీనాన్ని సూచించే రూపకాన్ని నిలుపుకున్నాం; దాని భావాన్ని పాదసూచికలో వివరించాం.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులను
  rationale: రెండవ వాక్యంలో ఈ దేశనామం సమూహార్థకంగా ఆ దేశపు ప్రజలను, ముఖ్యంగా కనిపించిన మృతులను సూచిస్తుంది; అందువల్ల తెలుగులో వ్యక్తులను సూచించే బహువచనం అవసరం.
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: కథన సందర్భంలో ראהకు సూటిగా సరిపోయే సాధారణ తెలుగు క్రియ.
- source_word: מֵת
  choice: చనిపోయి ఉన్న
  rationale: హీబ్రూలోని ఏకవచన విశేషణం సమూహార్థక ‘ఐగుప్తు’తో వాడబడింది. తెలుగులో ఐగుప్తీయుల స్థితిని సహజంగా తెలియజేయడానికి ‘చనిపోయి ఉన్న’ అని ఇచ్చాం.
- source_word: עַל שְׂפַת הַיָּם
  choice: సముద్ర తీరాన
  rationale: అక్షరార్థంగా ‘సముద్రపు పెదవి/అంచు’ అనే హీబ్రూ నుడికారానికి ‘సముద్ర తీరాన’ సహజమైన ఆధునిక తెలుగు అనువాదం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: ‘ఐగుప్తు’ అనే ఏకవచన దేశనామం మృతులను సూచించడం
  choice: ఐగుప్తీయులను
  alternative: ఐగుప్తును
  rationale: ఇక్కడ కనిపించినవారు మృతులైన వ్యక్తులు. హీబ్రూలో దేశనామం ప్రజలను సమూహంగా సూచించినా, తెలుగులో ‘ఐగుప్తీయులను’ అనడం భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ఘటనకు అదనపు వ్యాఖ్యానం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలిని వాడాం. ‘ఇశ్రాయేలు’ను సమూహాన్ని సూచించే ఏకవచనంగా ఉంచి, దానికి అనుగుణంగా ‘చూశాడు’ అన్నాం. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
