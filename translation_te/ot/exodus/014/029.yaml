source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు కుమారులు సముద్రం మధ్యగా పొడి నేలపై నడిచారు.[a] నీళ్లు వారికి కుడివైపునా ఎడమవైపునా గోడగా ఉన్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు సముద్రం మధ్యగా పొడి నేలపై నడిచారు.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, “నీళ్లు వారికి గోడగా ఉన్నాయి”; కొందరు దీనిని “గోడవలె ఉన్నాయి” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు కుమారులు
  rationale: ו conjunction సందర్భంలో ఐగుప్తీయుల నాశనానికి విరుద్ధంగా ఇశ్రాయేలీయుల సురక్షిత ప్రయాణాన్ని చూపుతుంది; בני ישראל అనే కుటుంబ–జాతీయ అభివ్యక్తిని ‘ఇశ్రాయేలు కుమారులు’ అని నిలుపుకుంది.
- source_word: הָלְכוּ
  choice: నడిచారు
  rationale: הלך ఇక్కడ కాలినడకన ముందుకు సాగడాన్ని సూచిస్తుంది; ‘నడిచారు’ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַיַּבָּשָׁה
  choice: ఆరిన నేల మీదుగా
  rationale: יבשה అంటే నీరు లేని పొడి/ఆరిన నేల. సముద్రపు అడుగు ప్రయాణించదగిన ఆరిన నేలగా ఉన్నదనే భావాన్ని ఇది స్పష్టంగా అందిస్తుంది.
- source_word: בְּתוֹךְ הַיָּם
  choice: సముద్రం మధ్యలో
  rationale: בתוך యొక్క స్థలార్థమైన ‘మధ్యలో’ను నిలుపుతూ సహజమైన తెలుగు పదబంధాన్ని ఉపయోగించింది.
- source_word: וְהַמַּיִם
  choice: నీళ్లు
  rationale: מים యొక్క సమూహార్థాన్ని ఆధునిక తెలుగులో సహజమైన బహువచన రూపంతో వ్యక్తం చేసింది.
- source_word: לָהֶם חֹמָה
  choice: వారికి ... గోడగా ఉన్నాయి
  rationale: లామెద్ సూచించే సంబంధాన్ని ‘వారికి’ అని, חומה యొక్క నేరమైన అర్థాన్ని ‘గోడ’ అని అందించింది; మూలంలో ఉపమాన సూచకం లేదు.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: వారికి కుడివైపునా ఎడమవైపునా
  rationale: రెండు వైపుల సమాంతర నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నిలుపుకుంది.
theological_decisions:
- issue: בני ישראל అనే అభివ్యక్తి
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ–జాతీయ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుకుంది; సహజమైన జాతినామ రూపాన్ని పాదసూచికలో ఇచ్చింది.
- issue: חֹמָה ను నేరుగా లేదా ఉపమానంగా అనువదించడం
  choice: గోడగా
  alternative: గోడవలె
  rationale: హెబ్రీ పాఠ్యంలో స్పష్టమైన ఉపమాన సూచకం లేనందున బలమైన నేర రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన ఉపమాన అవగాహనను పాదసూచికలో పరిరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని సమాంతర దృశ్యాన్ని, ‘గోడ’ అనే బలమైన రూపాన్ని కాపాడుతూ తెలుగు వాక్యక్రమాన్ని సహజంగా అమర్చింది.
