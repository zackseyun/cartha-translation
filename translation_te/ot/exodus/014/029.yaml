- from: అయితే ఇశ్రాయేలు కుమారులు సముద్రం మధ్యలో ఆరిన నేల మీదుగా నడిచారు.[a] నీళ్లు వారికి కుడివైపునా ఎడమవైపునా గోడగా ఉన్నాయి.[b]
  to: అయితే ఇశ్రాయేలు కుమారులు సముద్రం మధ్యగా పొడి నేలపై నడిచారు.[a] నీళ్లు వారికి కుడివైపునా ఎడమవైపునా గోడగా ఉన్నాయి.[b]
  rationale: The revision replaces a potentially narrower expression for “dry ground” with “పొడి నేల” and improves the spatial phrasing. It preserves the Hebrew’s contrast, the literal “sons of Israel,” the direct assertion that the waters were a wall, and the bilateral right/left construction. Footnote anchors remain attached to the clauses they qualify.
