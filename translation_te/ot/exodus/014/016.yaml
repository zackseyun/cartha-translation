source:
  edition: WLC
  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: te
  text: కానీ నీవు నీ కర్రను పైకెత్తి, సముద్రం మీద నీ చెయ్యి చాపి, దాన్ని చీల్చు. అప్పుడు ఇశ్రాయేలు కుమారులు[a] సముద్రం మధ్యలో పొడి నేల మీదుగా వెళ్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు పిల్లలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: కానీ నీవు
  rationale: ముందటి సందర్భంలో ప్రజలు ముందుకు సాగాలని చెప్పబడగా, మోషే చేయవలసిన పని ప్రత్యేకంగా ఉద్ఘాటించబడుతోంది. అందువల్ల సంధానార్థక వావ్‌తో కూడిన స్వతంత్ర సర్వనామంలోని వ్యత్యాస ఉద్ఘాటనను ‘కానీ నీవు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: నీ కర్రను పైకెత్తి
  rationale: హిఫిల్ ఆజ్ఞారూపం కర్రను పైకి ఎత్తే భౌతిక చర్యను సూచిస్తుంది. מַטֶּהకు ఈ కథన సందర్భంలో ‘కర్ర’ సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: సముద్రం మీదికి నీ చెయ్యి చాపి
  rationale: נטה చేతిని చాపడాన్ని సూచిస్తుంది; עַל ఇక్కడ సముద్రానికి పైగా లేదా దాని వైపుగా జరిగే సంజ్ఞను సూచించగలదు. ‘మీదికి’ ఈ దిశాత్మక-స్థానిక భావాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: וּבְקָעֵהוּ
  choice: దాన్ని చీల్చు
  rationale: בקע యొక్క మూలార్థం చీల్చడం లేదా రెండుగా విడగొట్టడం. ‘చీల్చు’ ఆ చర్యను సజీవంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְיָבֹאוּ
  choice: అప్పుడు ... వెళ్లగలుగుతారు
  rationale: ఆజ్ఞల తరువాత వచ్చే ఈ రూపం తదనంతర ఫలితాన్ని తెలియజేస్తుంది. ‘అప్పుడు’ క్రమం/ఫలితాన్ని చూపుతుంది; ‘వెళ్లగలుగుతారు’ సముద్రం మధ్యగా దాటే వీలును సహజ తెలుగులో వ్యక్తం చేస్తుంది, దైవకార్యానికి మానవ సామర్థ్యార్థాన్ని అనవసరంగా ఆపాదించకుండా సందర్భఫలితాన్ని సూచిస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ మూలంలోని పురుష బహువచన నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: בְּתוֹךְ הַיָּם בַּיַּבָּשָׁה
  choice: సముద్రం మధ్యలో ఆరిన నేల మీదుగా
  rationale: בְּתוֹךְ సముద్రపు మధ్య/అంతర్భాగాన్ని సూచిస్తుంది; בַּיַּבָּשָׁה నీటికి విరుద్ధమైన ఆరిన నేలను సూచిస్తుంది. ‘మీదుగా’ దాటివెళ్లే సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל లోని లింగ-నిర్దిష్ట నిర్మాణాన్ని ఎలా అనువదించాలి
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: మూల హీబ్రూలో స్పష్టంగా ‘కుమారులు’ అనే పురుష బహువచన రూపం ఉంది. దానిని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో స్త్రీపురుషులందరినీ కలిగిన ఇశ్రాయేలు ప్రజాసమూహం ఉద్దేశించబడిందని పాదసూచిక వివరిస్తుంది.
- issue: וְיָבֹאוּ ను ఉద్దేశం లేదా ఫలితంగా వ్యక్తం చేయడం
  choice: అప్పుడు ... వెళ్లగలుగుతారు
  alternative: అలా ... వెళ్లడానికి; ... వెళ్తారు
  rationale: హీబ్రూ వాక్యక్రమం ఆజ్ఞకు అనుసరించే ఫలితాన్ని సూచించగలదు; ఉద్దేశం-ఫలితం మధ్య ఉన్న స్వల్ప అనిశ్చితిని కఠినంగా ఒకే విధంగా నిర్ణయించకుండా, తెలుగు వాక్యం సహజమైన సందర్భఫలితాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా శైలిని ఉపయోగించాం. మూలంలోని క్రమబద్ధమైన చర్యలు—కర్రను ఎత్తడం, చెయ్యి చాపడం, సముద్రాన్ని చీల్చడం, ప్రజలు ఆరిన నేలపై వెళ్లడం—స్పష్టంగా నిలుపబడ్డాయి.
