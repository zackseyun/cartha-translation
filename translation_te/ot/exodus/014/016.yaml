revisions:
- from: కానీ నీవు నీ కర్రను పైకెత్తి, సముద్రం మీదికి నీ చెయ్యి చాపి, దాన్ని చీల్చు. అప్పుడు ఇశ్రాయేలు కుమారులు[a] సముద్రం మధ్యలో ఆరిన నేల మీదుగా వెళ్లగలుగుతారు.
