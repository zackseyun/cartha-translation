id: EXO.14.15
reference: Exodus 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవెందుకు నాకు మొరపెడుతున్నావు? ఇశ్రాయేలు కుమారులకు[a] బయలుదేరమని[b] చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ముందుకు సాగమని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఈ భావాన్ని సహజమైన తెలుగు కథనశైలిలో ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: מַה תִּצְעַק אֵלָי
  choice: నీవెందుకు నాకు మొరపెడుతున్నావు?
  rationale: מַה + క్రియ ఇక్కడ కారణాన్ని ప్రశ్నించే, స్వల్ప గద్దింపు గల ప్రయోగం. צעק ఆపదలో లేదా సహాయం కోసం గట్టిగా మొరపెట్టుకోవడాన్ని సూచిస్తుంది.
- source_word: דַּבֵּר אֶל
  choice: వారికి చెప్పు
  rationale: అక్షరార్థంగా ‘వారితో మాట్లాడు’ అనవచ్చు; అయితే తరువాతి ఆజ్ఞను అందించాలనే భావాన్ని తెలుగులో ‘వారికి చెప్పు’ సహజంగా తెలియజేస్తుంది, ‘ఆజ్ఞాపించు’ అని మూలం కంటే బలపరచదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుష బహువచన నిర్మాణాన్ని, ఒడంబడిక సమూహానికి వాడిన సంప్రదాయ సంజ్ఞను ప్రధాన పాఠంలో నిలిపాం; సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְיִסָּעוּ
  choice: బయలుదేరాలని
  rationale: נסע ప్రయాణ సందర్భంలో స్థలాన్ని విడిచి ప్రయాణం మొదలుపెట్టడాన్ని సూచిస్తుంది. తెలుగు పరోక్ష ఆజ్ఞ నిర్మాణంలో ‘బయలుదేరాలని ... చెప్పు’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలిపేందుకు ‘యాహ్వే’ అని లిప్యంతరీకరించాం. ‘యెహోవా’ తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపమైనా, అది వేరొక సంప్రదాయ ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగరూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన పురుష బహువచన రూపాన్ని ప్రధాన పాఠంలో కాపాడాం; అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే అవకాశం ఉన్నందున సామూహిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ప్రశ్నలోని నేరుతనాన్ని, స్వల్ప గద్దింపు స్వరాన్ని నిలిపాం. పాదటిప్పణి గుర్తులను వాటికి సంబంధించిన పదబంధాల వెంట ఉంచాం.
