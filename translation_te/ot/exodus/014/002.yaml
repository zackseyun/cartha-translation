translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. స్థలనామాలు లిప్యంతరీకరించబడ్డాయి. ప్రధాన పాఠ్యంలో హీబ్రూ కుటుంబాభివ్యక్తిని నిలిపి, సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
