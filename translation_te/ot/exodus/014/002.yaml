source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: ‘మీరు వెనక్కి తిరిగి, మిగ్దోల్‌కూ సముద్రానికీ మధ్యలో ఉన్న పీ-హహీరోతు ఎదుట మకాం వేయండి. బయల్-సెఫోను[b] ఎదుట, దానికి ఎదురుగా[c], సముద్రం ఒడ్డున మకాం వేయండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పీ-హహీరోతు, మిగ్దోల్, బయల్-సెఫోను అనేవి స్థలనామాలు; అందువల్ల వాటి అర్థాలను అనువదించకుండా ధ్వన్యనుసారంగా రాశాం.
    reason: cultural_note
  - marker: c
    text: లేదా “దానికి అభిముఖంగా.” “దానికి” అనే సర్వనామం బహుశా బయల్-సెఫోనును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో ఇలా చెప్పు
  rationale: దేవుడు మోషేకు ఇచ్చిన ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; בְּנֵי יִשְׂרָאֵל అనే కుటుంబాధారిత హీబ్రూ అభివ్యక్తిని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: וְיָשֻׁבוּ
  choice: వారు వెనక్కి తిరిగి
  rationale: సందర్భంలో ప్రయాణ దిశను మార్చుకోవడమే ఉద్దేశం; జస్సివ్ ఆజ్ఞార్థాన్ని తరువాతి ‘మకాం వేయాలి’తో కలిపి సహజంగా అందిస్తుంది.
- source_word: וְיַחֲנוּ / תַחֲנוּ
  choice: మకాం వేయాలి / మీరు మకాం వేయాలి
  rationale: חנה యొక్క శిబిరం వేసి బసచేయడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగు ప్రయోగంతో అందిస్తుంది; రెండవ క్రియలోని ప్రత్యక్ష బహువచన సంబోధనను ‘మీరు’తో స్పష్టం చేస్తుంది.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: పీ-హహీరోతు ఎదుట
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించి, לִפְנֵי యొక్క ప్రాదేశిక భావాన్ని ‘ఎదుట’గా అందిస్తుంది.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: మిగ్దోల్‌కు సముద్రానికి మధ్యనున్న
  rationale: రెండు ప్రాదేశిక సరిహద్దుల మధ్యనున్న స్థానాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: బయల్-సెఫోను ఎదుట
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, పునరావృతమైన לִפְנֵיకి ఒకే విధమైన ప్రాదేశిక పదాన్ని వాడుతుంది.
- source_word: נִכְחוֹ
  choice: దానికి ఎదురుగా
  rationale: ‘దానికి ఎదురుగా/అభిముఖంగా’ అనే స్థానార్థాన్ని నిలుపుతుంది; పురుష ఏకవచన ప్రత్యయం అత్యంత సహజంగా బయల్-సెఫోను అనే ప్రదేశాన్ని సూచిస్తుందని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: עַל הַיָּם
  choice: సముద్రం ఒడ్డున
  rationale: ఈ సందర్భంలో עַל సముద్ర జలాల ‘మీద’ కాక, సముద్రానికి ఆనుకొని ఉన్న స్థలాన్ని సూచిస్తుంది; ‘ఒడ్డున’ తెలుగులో స్పష్టమైన సహజ సమానం.
