translation:
  language: te
  text: అప్పుడు అతడు తన రథానికి గుర్రాలను కట్టి[a], తన ప్రజలను తనతో తీసుకెళ్లాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన రథాన్ని సిద్ధం చేశాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “కట్టాడు” లేదా “బిగించాడు” అని అర్థం. రథ సందర్భంలో అది గుర్రాలను రథానికి కట్టి ప్రయాణానికి సిద్ధం చేయడాన్ని సూచిస్తుంది; “గుర్రాలు” అనే పదం హీబ్రూలో స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: “తన ప్రజలు” అనేది బహుశా ఫరోతో వెళ్లిన బలగాన్ని సూచిస్తుంది. హీబ్రూ పాఠంలో “తన ప్రజలు” అని ఉంది; “తన సైన్యం” అని స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: గుర్రాలను కట్టించాడు
  rationale: אסר అనే క్రియకు మూలార్థం ‘కట్టు/బిగించు.’ రథ సందర్భంలో ప్రయాణానికి రథపు గుర్రాలను కట్టడాన్ని సూచిస్తుంది. ఫరో స్వయంగా ఈ పని చేశాడని కాక, చేయించాడనే సహజ రాజసందర్భ భావాన్ని తెలుగు causative రూపం వ్యక్తం చేస్తుంది.
- source_word: רִכְבּוֹ
  choice: తన రథానికి
  rationale: ఏకవచన ప్రత్యయంతో ఉన్న רכב ఇక్కడ ఫరో సొంత రథాన్నే సహజంగా సూచిస్తుంది; మొత్తం రథదళం అని విస్తరించలేదు.
- source_word: עַמּוֹ
  choice: తన ప్రజలను
  rationale: עם యొక్క సాధారణ అర్థం ‘ప్రజలు.’ సందర్భంలో ఇది ఫరో వెంట వచ్చిన బలగాన్ని సూచించే అవకాశం ఉన్నా, మూలపాఠం స్పష్టంగా ‘సైన్యం’ అనదు; అందువల్ల అస్పష్టతను నిలిపాం.
- source_word: לָקַח עִמּוֹ
  choice: తనతో తీసుకెళ్లాడు
  rationale: ‘తనతో తీసుకున్నాడు/వెంట తీసుకెళ్లాడు’ అనే ప్రత్యక్ష భావాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
