  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: te
  text: అప్పుడు మోషే తన చెయ్యి సముద్రం మీద చాపాడు. యహ్వే బలమైన తూర్పుగాలి ద్వారా రాత్రంతా సముద్రాన్ని వెనక్కి తోలాడు. ఆయన సముద్రాన్ని పొడి నేలగా చేశాడు; నీళ్లు చీలిపోయాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీళ్లు విడిపోయాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ
  choice: తన చెయ్యి చాపాడు
  rationale: נטה అనే క్రియ ‘చెయ్యి’తో వచ్చినప్పుడు చెయ్యి చాపడం లేదా ముందుకు చాచడం అనే అర్థం ఇస్తుంది. ‘చెయ్యి చాపాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; ఏకవచనాన్ని కూడా నిలుపుతుంది.
- source_word: עַל־הַיָּם
  choice: సముద్రం మీద
  rationale: עַל ఇక్కడ ‘మీద/పైగా’ అనే భావాన్ని ఇస్తుంది. మోషే చేసిన సంజ్ఞను తెలుగులో సహజంగా తెలియజేయడానికి ‘సముద్రం మీద’ అని అనువదించబడింది.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת־הַיָּם
  choice: యహ్వే ... సముద్రాన్ని వెనక్కి తోలాడు
  rationale: הלך యొక్క హిఫీల్ రూపం కారణార్థకమైనది—సముద్రం కదిలేలా చేయడం. సందర్భంలో ‘వెనక్కి తోలాడు’ సముద్రం తొలగిపోయిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ పాఠంలోని దైవిక వ్యక్తినామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణగా ‘యహ్వే’ అని ఉంచబడింది.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: బలమైన తూర్పుగాలితో
  rationale: ‘తూర్పు’ అనే విశేషణం వల్ల רוּחַ ఇక్కడ ‘గాలి’ని సూచిస్తుంది; עַזָּה దాని బలాన్ని తెలియజేస్తుంది. בְּ సాధనార్థాన్ని తెలుగులో ‘తో’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָּל־הַלַּיְלָה
  choice: రాత్రంతా
  rationale: మొత్తం రాత్రి కొనసాగిన చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: సముద్రాన్ని పొడి నేలగా చేశాడు
  rationale: חָרָבָה నీరు లేని పొడి నేలను సూచిస్తుంది. హీబ్రూలో సముద్రమే క్రియకు కర్మగా ఉన్న బలమైన నిర్మాణాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: నీళ్లు చీలిపోయాయి
  rationale: בקע యొక్క నిఫాల్ రూపం నీళ్లు చీల్చబడ్డాయని లేదా చీలిపోయాయని సూచిస్తుంది. తెలుగు అకర్మక రూపం మూలంలోని క్రియాభావాన్ని స్పష్టంగా, సజీవంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవిక నామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం సాధారణ బిరుదును కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న దేవుని వ్యక్తినామాన్ని వాడుతోంది. అందువల్ల ఆ నామాన్ని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ చేయబడింది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారించలేనప్పటికీ ‘యహ్వే’ విస్తృతంగా అంగీకరించబడిన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘చెయ్యి’, ‘నీళ్లు’ వంటి ప్రస్తుత సాధారణ రూపాలతోపాటు సందర్భ గాంభీర్యాన్ని నిలిపే సరళమైన శైలి పాటించబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించారు.
