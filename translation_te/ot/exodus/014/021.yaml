  to: అప్పుడు మోషే తన చెయ్యి సముద్రం మీద చాపాడు. యహ్వే బలమైన తూర్పుగాలి ద్వారా రాత్రంతా సముద్రాన్ని వెనక్కి తోలాడు. ఆయన సముద్రాన్ని పొడి నేలగా చేశాడు; నీళ్లు చీలిపోయాయి[a].
