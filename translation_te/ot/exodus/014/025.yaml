source:
  edition: WLC
  text: וַ/יָּ֗סַר אֵ֚ת אֹפַ֣ן מַרְכְּבֹתָ֔י/ו וַֽ/יְנַהֲגֵ֖/הוּ בִּ/כְבֵדֻ֑ת וַ/יֹּ֣אמֶר מִצְרַ֗יִם אָנ֨וּסָה֙ מִ/פְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֣י יְהוָ֔ה נִלְחָ֥ם לָ/הֶ֖ם בְּ/מִצְרָֽיִםפ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: te
  text: ఆయన అతని రథాల చక్రాన్ని తీసివేసి, ఆ రథాలను కష్టంగా నడిపించాడు. అప్పుడు ఐగుప్తు, “ఇశ్రాయేలు ఎదుటనుండి నేను పారిపోతాను; ఎందుకంటే యెహోవా వారి కోసం ఐగుప్తుకు వ్యతిరేకంగా పోరాడుతున్నాడు” అని అన్నది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסַר
  choice: తొలగించి
  rationale: హిఫీల్ రూపానికి సహజమైన ‘తీసివేశాడు/తొలగించాడు’ అనే భావాన్ని నిలుపుతుంది; పాఠంలోని ఏకవచన కర్తను ‘ఆయన’గా ఉంచింది.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: అతని రథాల చక్రాలను
  rationale: మసొరెటిక్ పాఠంలోని ఏకవచన స్వామ్యప్రత్యయాన్ని యథాతథంగా ప్రతిబింబిస్తుంది; సమూహవాచకమైన ‘ఐగుప్తు’ను సూచించే అసాధారణ ఏకవచనాన్ని సరిచేయలేదు.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: వాటిని బహు కష్టంగా నడిచేలా చేశాడు
  rationale: ‘భారంగా/కష్టంగా నడిపించాడు’ అనే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ఏకవచన సర్వనామం సమూహంగా రథాలను సూచిస్తున్నట్టు అనువదించబడింది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: దేశం/సైన్యాన్ని వ్యక్తీకరించిన సమూహవాచకంగా ఉంచి, మూలంలోని ఏకవచన క్రియను నిలుపుతుంది.
- source_word: אָנ֨וּסָה
  choice: నేను పారిపోతాను
  rationale: మొదటి పురుష ఏకవచన కోహోర్టేటివ్ రూపాన్ని ప్రతిబింబిస్తుంది; తెలుగు సందర్భంలో సంకల్పం/తక్షణ నిర్ణయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: נִלְחָם לָהֶם בְּמִצְרָיִם
  choice: వారి పక్షంగా ఐగుప్తుతో యుద్ధం చేస్తున్నాడు
  rationale: לָהֶם లోని ప్రయోజన/పక్ష భావాన్నీ, בְּמִצְרָיִם లోని విరోధ భావాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క ప్రతినిధానం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: ఇది సాధారణ బిరుదు కాక ఒడంబడిక దైవనామం; అందువల్ల మూలంలోని ప్రత్యేక నామభేదాన్ని నిలుపుతుంది.
- issue: ఐగుప్తు మాటలో ఏకవచనం
  choice: ‘నేను పారిపోతాను’ అని దేశం/సైన్యాన్ని వ్యక్తీకరించడం
  alternative: ‘మనం పారిపోదాం’ అని భావానువాదం చేయడం
  rationale: మూలంలోని מִצְרַיִם ... אָנ֨וּסָה అనే వ్యాకరణ ఉద్వేగాన్ని, సమూహాన్ని ఏకవచన వ్యక్తిగా చూపే రూపాన్ని సరిచేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని అసాధారణ ఏకవచన సూచనలను ఉద్దేశపూర్వకంగా నిలిపింది.
