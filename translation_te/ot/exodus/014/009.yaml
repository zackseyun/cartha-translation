revisions:
- from: ఐగుప్తీయులు వారిని వెంబడించారు. సముద్రం దగ్గర పీ-హహీరోతు వద్ద, బయల్-సెఫోను ఎదుట[a] శిబిరం వేసి ఉన్న వారిని వారు చేరుకున్నారు. ఫరోకు చెందిన రథాలు, గుర్రాలు అన్నీ, అతని గుర్రపు రౌతులు, అతని సైన్యమంతా అక్కడికి వచ్చాయి.
  to: ఐగుప్తీయులు వారిని వెంబడించి, సముద్రం దగ్గర శిబిరం వేసి ఉన్న వారిని చేరుకున్నారు—అంటే ఫరోకు చెందిన గుర్రాలన్నీ, రథాలన్నీ, అతని గుర్రపు రౌతులు, అతని సైన్యమంతా—పీ-హహీరోతు వద్ద, బయల్-సెఫోను ఎదుట[a].
  rationale: The revision retains the draft’s modern standard Telugu vocabulary while restoring the Hebrew relationship between ‘the Egyptians’ and the detailed military-force expression. It also keeps the circumstantial sense of Israel being camped by the sea and preserves the disputed/elastic spatial nuance of לִפְנֵי in a meaningful footnote alternative.
