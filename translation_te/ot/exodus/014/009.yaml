source:
  edition: WLC
  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: te
  text: ఐగుప్తీయులు వారిని వెంబడించి, సముద్రం దగ్గర శిబిరం వేసి ఉన్న వారిని చేరుకున్నారు—అంటే ఫరోకు చెందిన గుర్రాలన్నీ, రథాలన్నీ, అతని గుర్రపు రౌతులు, అతని సైన్యమంతా—పీ-హహీరోతు వద్ద, బయల్-సెఫోను ఎదుట[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయల్-సెఫోను ముందు.” హీబ్రూ పదబంధం ఒక ప్రదేశానికి అభిముఖంగా ఉన్న స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: ఐగుప్తీయులు వారిని వెంబడించారు
  rationale: మִצְרַיִם ఇక్కడ దేశాన్ని కాక ఐగుప్తు ప్రజలను లేదా దళాలను సూచిస్తుంది; רדף సైనిక సందర్భంలో సహజంగా ‘వెంబడించారు’ అని అనువదించబడింది.
- source_word: וַיַּשִּׂיגוּ אֹתָם
  choice: వారిని వారు చేరుకున్నారు
  rationale: נשׂג ఇక్కడ వెంబడించి అందుకోవడం లేదా చేరుకోవడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘చేరుకున్నారు’ సహజంగా ఉండి సందర్భంలోని భావాన్ని నిలుపుతుంది.
- source_word: חֹנִים עַל־הַיָּם
  choice: సముద్రం దగ్గర ... శిబిరం వేసి ఉన్న
  rationale: వర్తమాన కృదంతం ఇశ్రాయేలీయులు అప్పటికి ఉన్న పరిస్థితిని తెలియజేస్తుంది; עַל ఇక్కడ స్థలసంబంధంగా ‘దగ్గర’ అనే అర్థంలో ఉంది.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: ఫరోకు చెందిన రథాలు, గుర్రాలు అన్నీ
  rationale: హీబ్రూ పదబంధం సంక్షిప్తమైన సమష్టి సైనిక వర్ణన. తెలుగులో రథాలు, వాటికి సంబంధించిన గుర్రాలు రెండూ స్పష్టంగా, సహజంగా వినిపించేలా విప్పి చెప్పబడింది.
- source_word: וּפָרָשָׁיו
  choice: అతని గుర్రపు రౌతులు
  rationale: פָּרָשִׁים గుర్రాలపై యుద్ధం చేసే దళాలను సూచిస్తుంది. ‘గుర్రపు రౌతులు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וְחֵילוֹ
  choice: అతని సైన్యమంతా
  rationale: חַיִל ఈ సందర్భంలో సైనిక బలగాన్ని సూచిస్తుంది; כָּל వల్ల వచ్చిన సమగ్రతను తెలుగులో ‘అంతా’తో సహజంగా వ్యక్తం చేశాం.
- source_word: עַל־פִּי הַחִירֹת
  choice: పీ-హహీరోతు వద్ద
  rationale: స్థలనామంతో వచ్చిన ఈ పదబంధానికి స్థలసంబంధమైన ‘వద్ద’ సహజమైన తెలుగు రూపం.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: బయల్-సెఫోను ఎదుట
  rationale: לִפְנֵי స్థలసంబంధంగా ‘ఎదుట,’ ‘ఎదురుగా’ అనే భావాలు ఇవ్వగలదు. ప్రధాన పాఠంలో సంక్షిప్తమైన ‘ఎదుట’ను ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని సుదీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; స్థలనామాలను పీ-హహీరోతు, బయల్-సెఫోను అని లిప్యంతరీకరించాం.
