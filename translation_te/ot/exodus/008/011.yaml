id: EXO.8.11
reference: Exodus 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: te
  text: అయితే, ఉపశమనం కలిగిందని[a] ఫరో చూసినప్పుడు, అతడు తన హృదయాన్ని కఠినపరచుకున్నాడు; యాహ్వే చెప్పినట్లుగానే వారి మాట వినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విరామం కలిగింది.” హీబ్రూ పదం ఊరట, ఉపశమనం, లేదా ఒత్తిడి నుండి కొంత వెసులుబాటు అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియకు ప్రాథమిక అర్థం ‘చూచుట’; ఇక్కడ పరిస్థితి మారిందని గ్రహించడాన్ని సూచించినా, తెలుగు భాషలో ‘చూసినప్పుడు’ సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: ఉపశమనం కలిగిందని
  rationale: הָרְוָחָה ఒత్తిడి తగ్గడం, ఊరట లేదా విరామం అనే భావాలను సూచిస్తుంది. కప్పల విపత్తు తొలగిన సందర్భంలో ‘ఉపశమనం’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: అతడు తన హృదయాన్ని కఠినపరచుకొని
  rationale: כבד యొక్క హిఫీల్ రూపం అక్షరార్థంగా ‘భారంగా చేయడం’; హృదయంతో కలిసిన ఈ నిర్గమకాండపు నుడికారం మొండితనాన్ని సూచిస్తుంది. క్రియాశీల కర్తగా ఫరోనే నిలిచేలా అనువదించబడింది.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: వారి మాట వినలేదు
  rationale: שׁמע אֶל అంటే ‘వినడం/పట్టించుకోవడం.’ ‘వారి మాట వినలేదు’ అనేది సహజ తెలుగు; ‘విధేయత చూపలేదు’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే భావాన్ని ఎక్కువగా నిర్దిష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా చెప్పినట్లుగానే
  rationale: ఈ వాక్యభాగం ముందుగా పలికిన దైవవాక్యం నెరవేరినట్లు సూచిస్తుంది. ‘చెప్పినట్లుగానే’ తెలుగు కథనంలో సహజంగా పూర్వ పలుకును తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడటంలో కర్తృత్వం
  choice: ఈ వచనంలో ఫరో తన హృదయాన్ని తానే కఠినపరచుకున్నాడని క్రియాశీలంగా అనువదించబడింది.
  alternative: అతని హృదయం కఠినపడిందని కర్మణి భావంలో చెప్పడం, లేదా ఇక్కడ దేవుని కర్తృత్వాన్ని సూచించడం.
  rationale: హీబ్రూ పాఠంలో ఫరో కర్తగా ఉండి, כבד క్రియ హిఫీల్ రూపంలో ఉంది. అందువల్ల ఈ వచనం బాధ్యతను ఫరోకే ఆపాదిస్తుంది; ఇతర వచనాల్లో దేవుడు ఫరో హృదయాన్ని కఠినపరచాడనే ఉద్రిక్తతను ఇక్కడ కలిపి పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘హృదయాన్ని కఠినపరచుకొని’ అనే బైబిలీయ నుడికారాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా అమర్చాం.
