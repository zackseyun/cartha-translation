  terminology: “ఉపశమనం” appropriately conveys הָרְוָחָה. “తన హృదయాన్ని కఠినపరచుకున్నాడు” preserves both the established Exodus idiom and Pharaoh’s agency. “యాహ్వే” aligns the Telugu divine-name rendering with the POB audit trail.
  issues:
