    issue: The Tetragrammaton is rendered “యెహోవా” rather than “యాహ్వే.”
    rationale: The supplied English POB decisions explicitly prescribe “Yahweh” for יהוה. In Telugu, “యాహ్వే” is the corresponding transliteration; “యెహోవా” represents a distinct traditional vocalization.
  - severity: low
