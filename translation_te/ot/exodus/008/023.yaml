reference: Exodus 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּ/מִּדְבָּ֑ר וְ/זָבַ֨חְנוּ֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/אֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: te
  text: మేము మూడు రోజుల ప్రయాణం చేసి అరణ్యంలోకి వెళ్లి, మా దేవుడైన యాహ్వేకు ఆయన మాకు చెప్పే ప్రకారం బలి అర్పిస్తాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మాకు చెప్పబోయే ప్రకారం.”
    reason: יֹאמַר అనే హీబ్రూ ఇంపర్‌ఫెక్ట్‌ను భవిష్యత్ భావంతో కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల ప్రయాణం
  rationale: కాలపరిమాణంతో వచ్చిన דֶּרֶךְ, అంత సమయం పట్టే ప్రయాణాన్ని లేదా దూరాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగు భాషలో ‘మూడు రోజుల ప్రయాణం’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: נֵלֵךְ
  choice: మేము ... వెళ్లి
  rationale: ఇది ఖల్ ఇంపర్‌ఫెక్ట్ ప్రథమ పురుష బహువచనం; సందర్భంలో భవిష్యత్తు ఉద్దేశాన్ని తెలుపుతుంది. తరువాతి సమాపక క్రియతో సహజ తెలుగు వాక్యంగా అనుసంధానించబడింది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోకి
  rationale: מִדְבָּר అనేది తప్పనిసరిగా ఇసుక ఎడారి కాకుండా జనావాసం లేని విశాల ప్రదేశాన్ని సూచిస్తుంది. వెళ్లే గమనాన్ని బట్టి ‘అరణ్యంలోకి’ అని అనువదించబడింది.
- source_word: וְזָבַחְנוּ
  choice: బలి అర్పిస్తాము
  rationale: זבח బలిగా వధించడం లేదా బలి అర్పించడం అనే ఆరాధనాపరమైన అర్థం కలిగి ఉంది. ‘బలి అర్పిస్తాము’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామమైన יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవుడైన
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న రూపాన్ని ‘మా దేవుడు’ అనే నిబంధనాత్మక గుర్తింపుగా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: అట్లే
  rationale: ఈ పదం పోలికతో పాటు అనుగుణతను సూచిస్తుంది; బలి దేవుని సూచన ప్రకారమే ఉంటుందని ‘అట్లే’ సహజంగా తెలియజేస్తుంది.
- source_word: יֹאמַר אֵלֵינוּ
  choice: ఆయన మాకు చెప్పినట్లు
  rationale: ఇంపర్‌ఫెక్ట్ రూపం సందర్భానుసారంగా వర్తమాన, భవిష్యత్ లేదా నిర్దేశాత్మక భావాన్ని ఇవ్వగలదు. ప్రధాన పాఠంలో సహజ తెలుగు కోసం ‘చెప్పినట్లు’ వాడి, కాలభేద అవకాశాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం ప్రత్యేక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: יֹאמַר యొక్క కాలసూచన
  choice: చెప్పినట్లు
  alternative: చెబుతున్నట్లు; చెప్పబోయే ప్రకారం
  rationale: హీబ్రూ ఇంపర్‌ఫెక్ట్ ఇక్కడ కాలపరంగా కొంత విస్తృతత కలిగి ఉంది. ప్రధాన పాఠం కార్యం దేవుని ఆదేశానికి అనుగుణంగా ఉంటుందనే భావాన్ని ముందుకు తెస్తుంది; భవిష్యత్ పఠనాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, అయితే ఆరాధనాపరమైన గౌరవాన్ని నిలిపే శైలి. ‘అరణ్యం,’ ‘బలి అర్పించడం’ వంటి విస్తృతంగా అర్థమయ్యే పదాలను ఉపయోగించాం. పాదసూచిక గుర్తు [a] సంబంధిత వాక్యభాగం తరువాత ప్రధాన పాఠంలో ఉంచబడింది.
