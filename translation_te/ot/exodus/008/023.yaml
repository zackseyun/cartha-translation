  to: మేము మూడు రోజుల ప్రయాణం చేసి అరణ్యంలోకి వెళ్లి, మా దేవుడైన యాహ్వేకు ఆయన మాకు చెప్పే ప్రకారం బలి అర్పిస్తాము.[a]
  rationale: సవరించిన పాఠం మూడు రోజుల ప్రయాణం, అరణ్యంలోకి వెళ్లడం, యాహ్వేకు బలి అర్పించడం, ఆయన నిర్దేశానికి అనుగుణంగా చేయడం అనే మూలవాక్యంలోని అన్ని భాగాలను నిలుపుతుంది. అసహజమైన క్రియాసంబంధాన్ని సరిచేసి, దైవనామ విధానాన్ని అనుసరించి, ఇంపర్‌ఫెక్ట్ కాలభావంలోని ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచింది.
