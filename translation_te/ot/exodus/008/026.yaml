base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: te
  text: అప్పుడు మోషే ఫరో దగ్గరనుండి బయటికి వెళ్లి, యాహ్వేను వేడుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేను ఆతురతతో ప్రార్థించాడు.” హీబ్రూ క్రియ ఆతురతతో వేడుకోవడం లేదా మనవి చేయడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא యొక్క Qal wayyiqtol రూపం భౌతికంగా బయటికి వెళ్లడాన్ని, అలాగే కథన క్రమాన్ని సూచిస్తుంది.
- source_word: מֵעִם פַּרְעֹה
  choice: ఫరో దగ్గరనుండి
  rationale: מֵעִם అనేది సహవాసం లేదా సన్నిధి నుండి వేరై వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֶּעְתַּר
  choice: మనవి చేశాడు
  rationale: עתר సాధారణ ప్రార్థనకన్నా వేడుకొనే, earnest supplication భావాన్ని కలిగిస్తుంది; ‘మనవి చేశాడు’ ఆ భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: אֶל
  choice: యెహోవాకు
  rationale: אֶל యొక్క దిశార్థాన్ని తెలుగు సంప్రదాన విభక్తి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల దైవనామాన్ని పేరుగానే నిలిపి, సాధారణ తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన కథన శైలి, గౌరవప్రదమైన దైవసంబంధ పదప్రయోగం. హీబ్రూ వాక్యంలోని క్రమం మరియు వేడుకోలు తీవ్రతను సహజమైన తెలుగులో నిలిపింది.
