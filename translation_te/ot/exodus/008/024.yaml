id: EXO.8.24
reference: Exodus 8:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: te
  text: అప్పుడు ఫరో, “మీరు అరణ్యంలో మీ దేవుడైన యాహ్వేకు బలి అర్పించడానికి నేను మిమ్మల్ని వెళ్లనిస్తాను. అయితే మీరు చాలా దూరం వెళ్లకూడదు. నా కోసం వేడుకోండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో ప్రామాణికంగా వాడే రూపం.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: నేను మిమ్మల్ని వెళ్లనిస్తాను
  rationale: ఈ సందర్భంలో שׁלח ఇశ్రాయేలీయులు బయలుదేరడానికి అనుమతించడం లేదా వారిని విడుదల చేయడం అనే భావాన్ని ఇస్తుంది. ‘వెళ్లనిస్తాను’ సంభాషణ సందర్భానికి సహజమైన తెలుగు.
- source_word: וּזְבַחְתֶּם
  choice: బలి అర్పించడానికి
  rationale: ముందున్న ‘వెళ్లనిస్తాను’ అనే క్రియకు ఇది ఉద్దేశాన్ని తెలియజేస్తుంది; అందువల్ల తెలుగు వాక్యంలో ప్రయోజనార్థక నిర్మాణం వాడబడింది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడైన
  rationale: సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలిపే రూపం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר సాగుచేయని, జనావాసం తక్కువైన ప్రదేశాన్ని సూచిస్తుంది; ‘అరణ్యం’ నిర్బంధంగా ఇసుక ఎడారినే సూచించకుండా సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: רַק
  choice: అయితే
  rationale: ఫరో విధిస్తున్న పరిమితిని ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: మీరు చాలా దూరం వెళ్లకూడదు
  rationale: క్రియావిశేషణాత్మక ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో వచ్చిన నిషేధంలోని బలాన్ని ‘చాలా దూరం’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: నా కోసం వేడుకోండి
  rationale: עתר హిఫిల్ రూపం హృదయపూర్వకంగా ప్రార్థించడం లేదా విన్నవించడం అనే భావాన్ని ఇస్తుంది; బַּעֲדִי ఫరో ప్రయోజనార్థం చేసే ప్రార్థనను సూచిస్తుంది. ‘వేడుకోండి’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని ప్రత్యేక నామమైన టెట్రాగ్రామటన్‌ను నేరుగా ఉపయోగిస్తుంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణగా రూపొందించబడింది. ఫరో మాటలోని అనుమతి, దానికి విధించిన పరిమితి, చివరి విన్నపం స్పష్టంగా వేరు చేయబడ్డాయి.
