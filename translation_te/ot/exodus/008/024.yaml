  source_fidelity: మూల హీబ్రూ వాక్యంలోని క్రమం, ఫరో అనుమతిలోని ఉద్దేశం, అరణ్యంలో బలి అర్పించే విషయం, ‘చాలా దూరం వెళ్లకూడదు’ అనే ఉద్ఘాటిత పరిమితి, తనకొరకు విన్నవించమనే చివరి అభ్యర్థన అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. אָנֹכִי యొక్క స్వల్ప ఉద్ఘాటన తెలుగులో తప్పనిసరిగా ప్రత్యేకంగా చూపనవసరం లేదు.
