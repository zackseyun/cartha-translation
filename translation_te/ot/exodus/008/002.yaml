id: EXO.8.2
reference: Exodus 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֤ט אַהֲרֹן֙ אֶת יָד֔/וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַ/תַּ֨עַל֙ הַ/צְּפַרְדֵּ֔עַ וַ/תְּכַ֖ס אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: te
  text: అప్పుడు అహరోను ఐగుప్తు జలాల మీద తన చెయ్యి చాపాడు. కప్పలు[a] పైకి వచ్చి ఐగుప్తు దేశాన్ని కప్పేశాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘కప్ప’ అనే పదం ఏకవచన రూపంలో ఉంది; అయితే ఇక్కడ అది కప్పల సమూహాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: చాపాడు
  rationale: נטה అనే క్రియ ఇక్కడ సూచక కార్యంగా చెయ్యిని చాపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చాపాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: హీబ్రూ పాఠంలో స్పష్టంగా ‘అతని చెయ్యి’ అని ఉంది; తెలుగులో కర్తతో సంబంధాన్ని సహజంగా చూపేందుకు ‘తన చెయ్యి’ వాడబడింది.
- source_word: עַל
  choice: మీద
  rationale: జలాలకు పైగా చెయ్యి చాపిన స్థల సంబంధాన్ని ‘మీద’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵימֵי מִצְרַיִם
  choice: ఐగుప్తు జలాలు
  rationale: మూలంలోని బహువచన నిర్మాణాన్ని నిలుపుతూ, ఐగుప్తులోని వివిధ జలవనరులను సమష్టిగా సూచిస్తుంది.
- source_word: וַתַּעַל
  choice: పైకి వచ్చాయి
  rationale: కప్పలు జలాల నుంచి భూమిమీదికి రావడాన్ని עלה సూచిస్తుంది; ‘పైకి వచ్చాయి’ ఆ కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: הַצְּפַרְדֵּעַ
  choice: కప్పలు
  rationale: హీబ్రూలో రూపం ఏకవచనమైనా ఇక్కడ సమూహార్థకంగా పనిచేస్తుంది; తెలుగులో సందర్భానుసారంగా బహువచనం సహజం.
- source_word: וַתְּכַס
  choice: కప్పేశాయి
  rationale: כסה యొక్క ‘కప్పు’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, దేశమంతా వ్యాపించిన కప్పల దృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం
  rationale: אֶרֶץ ఇక్కడ ఐగుప్తు భూభాగం లేదా దేశాన్ని సూచిస్తుంది; ‘ఐగుప్తు దేశం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
