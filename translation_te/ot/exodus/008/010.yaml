  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: te
  text: వారు వాటిని కుప్పలు కుప్పలుగా[a] పోగుచేశారు; దేశమంతా దుర్వాసన కొట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కుప్పలుగా,’ ‘కుప్ప మీద కుప్పగా’; నొక్కిచెప్పడానికి హీబ్రూలో ‘కుప్పలు’ అనే నామవాచకం పునరుక్తమైంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: పోగుచేశారు
  rationale: צבר అనే క్రియ వస్తువులను ఒకచోట చేర్చి కుప్పగా వేయడాన్ని సూచిస్తుంది. ‘పోగుచేశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమీకరణ చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹתָם
  choice: వాటిని
  rationale: ఈ ప్రత్యక్ష కర్మ సర్వనామం ముందరి సందర్భంలోని కప్పలను సూచిస్తుంది; తెలుగులో జంతువుల సమూహాన్ని తిరిగి సూచించడానికి ‘వాటిని’ సహజమైన రూపం.
- source_word: חֳמָרִם חֳמָרִם
  choice: కుప్పలు కుప్పలుగా
  rationale: హీబ్రూలో నామవాచక పునరుక్తి అనేక వేర్వేరు కుప్పలను, వాటి విస్తారతను బలంగా సూచిస్తుంది. తెలుగు పునరుక్తి ఆ రూపాన్నీ భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: וַתִּבְאַשׁ
  choice: దుర్వాసన కొట్టింది
  rationale: באש తీవ్రమైన చెడు వాసన వెలువడటాన్ని సూచిస్తుంది. ‘దుర్వాసన కొట్టింది’ సూటిగా, సజీవంగా, సాధారణ ఆధునిక తెలుగులో ఆ బలాన్ని అందిస్తుంది.
- source_word: הָאָרֶץ
  choice: దేశమంతా
  rationale: ఇక్కడ אֶרֶץ భూమి మొత్తాన్ని కాక ఐగుప్తు దేశం లేదా ప్రభావిత ప్రాంతాన్ని సూచిస్తుంది. క్రియ ఏకవచనంలో ఉన్నప్పటికీ, తెలుగులో వ్యాపించిన దుర్వాసన భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘దేశమంతా’ అనుకూలం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ పునరుక్తిని ప్రధాన పాఠ్యంలో తెలుగు పునరుక్తితో నిలిపి, దాని భావ ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
