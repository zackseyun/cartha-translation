source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: te
  text: యాహ్వే మోషే మాట ప్రకారం చేశాడు; ఫరో నుండి, అతని సేవకుల నుండి, అతని ప్రజల నుండి ఆ కీటకాల దండును[a] తొలగించాడు. ఒక్కటీ మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈగల దండు.” హీబ్రూ పదం עָרֹב గుంపులుగా వచ్చే కీటకాల తెగులును సూచిస్తుంది; అయితే ఆ పదం వాటి ఖచ్చితమైన జాతిని తెలియజేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియను ‘మోషే మాట ప్రకారం’ అనే సందర్భంలో నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: כִּדְבַר מֹשֶׁה
  choice: మోషే మాట ప్రకారం
  rationale: דבר యొక్క ‘మాట/చెప్పినది’ అనే భావాన్ని నిలుపుతూ సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగించాం.
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫీల్ రూపంలోని ‘తీసివేయడం, తొలగించడం’ అనే కారణార్థక భావాన్ని తెగులు సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֶעָרֹב
  choice: ఆ కీటకాల గుంపు
  rationale: עָרֹב సూచించే దండు/గుంపు భావాన్ని నిలుపుతూ, నిర్దిష్ట కీటకజాతిని ఊహించి చేర్చకుండా తెగులు సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ఫరో దగ్గరనుంచి, అతని సేవకుల దగ్గరనుంచి, అతని ప్రజల దగ్గరనుంచి
  rationale: మూలంలోని מן పూర్వప్రత్యయ పునరుక్తిని తెలుగులోనూ నిలిపి, ప్రతి వర్గం నుంచి తెగులు తొలగించబడిందనే నొక్కింపును కాపాడాం.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: ఒక్కటి కూడా మిగలలేదు
  rationale: אֶחָד లోని ఏకవచన నొక్కింపును సహజమైన, బలమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: עָרֹב యొక్క నిర్దిష్ట జీవజాతి
  choice: కీటకాల గుంపు
  alternative: ఈగల గుంపులు
  rationale: హీబ్రూ పదం దండుగా వచ్చిన తెగులును సూచిస్తుంది గాని కీటకజాతిని ఖచ్చితంగా నిర్ధారించదు; అందువల్ల ప్రధాన పాఠంలో అతిగా నిర్దిష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని పునరుక్తిని కొంతవరకు నిలిపి, עָרֹב విషయంలోని నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణిలో భద్రపరిచాం.
