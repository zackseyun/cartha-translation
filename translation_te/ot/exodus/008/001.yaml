id: EXO.8.1
reference: Exodus 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవు అహరోనుతో ఇలా చెప్పు: ‘నీ కర్రతో నీ చెయ్యి చాపి నదుల మీద, నైలు కాలువల[a] మీద, కొలనుల మీద కప్పలు ఐగుప్తు దేశం మీదికి పైకి వచ్చేలా చేయి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నైలు జలమార్గాలు”; ఈ హెబ్రీ పదం ఐగుప్తు సందర్భంలో తరచుగా నైలు నదికి సంబంధించిన నీటిమార్గాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో సహజమైన క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: אֱמֹר
  choice: ఇలా చెప్పు
  rationale: మోషేకు ఇచ్చిన ఆజ్ఞను, వెంట వచ్చే ప్రత్యక్ష ఉక్తిని సహజంగా పరిచయం చేస్తుంది.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: నీ కర్రతో నీ చెయ్యి చాపి
  rationale: נטה యొక్క ‘చాపు’ భావాన్ని, בְּ యొక్క సాధనార్థాన్ని, ‘చెయ్యి’ అనే స్పష్టమైన శరీరావయవాన్ని నిలుపుతుంది.
- source_word: הַנְּהָרֹת
  choice: నదులు
  rationale: సాధారణ జలప్రవాహాలను సూచించే పదంగా, తరువాతి రెండు జలపదాల నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: הַיְאֹרִים
  choice: నైలు కాలువలు
  rationale: ఐగుప్తు సందర్భంలో יְאֹרִים నైలు నదికి సంబంధించిన జలమార్గాలను సూచించగలదు; ‘కాలువలు’ అనే సాధారణ పదానికి ‘నైలు’ జోడించడం సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: הָאֲגַמִּים
  choice: కొలనులు
  rationale: నిల్వగా ఉన్న నీటి ప్రదేశాలను సూచిస్తూ నదులు, కాలువల నుంచి భేదాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהַעַל אֶת־הַצְפַרְדְּעִים
  choice: కప్పలు పైకి వచ్చేలా చేసి ... రప్పించు
  rationale: עלה హిఫీల్ రూపంలోని కారణార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కప్పలు జలాల నుంచి పైకి వచ్చి దేశం మీదికి చేరే గమనాన్ని నిలుపుతుంది.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం మీదికి
  rationale: עַל లోని విస్తరణ/గమ్య భావాన్ని నిలుపుతూ, ‘దేశమంతటా’ అనే వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపాం; ‘యాహ్వే’ మరొక సముచిత పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడాం. మూలంలోని మూడు రకాల జలప్రదేశాల జాబితాను విడివిడిగా నిలిపాం; ప్రత్యక్ష ఉక్తి నిర్మాణాన్ని స్పష్టంగా ఉంచాం.
