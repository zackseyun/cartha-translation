source:
  edition: WLC
  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: te
  text: అయితే ఫరో ఈసారి కూడా తన హృదయాన్ని కఠినపరచుకున్నాడు[a]; ప్రజలను వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన హృదయాన్ని బరువుగా చేశాడు.” ఈ నానుడి ఫరో మొండిగా, స్పందించనివాడిగా మారడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: కఠినపరచుకొని
  rationale: כבד అనే మూలానికి అక్షరార్థంగా ‘బరువుగా చేయడం’ అనే భావం ఉన్నా, ‘హృదయం’తో కలిసిన ఈ నానుడి మొండితనంతో స్పందించడాన్ని సూచిస్తుంది. కర్త ఫరోనే అని నిలుపుతూ, సహజమైన తెలుగులో ఆ ఉద్దేశపూర్వక ప్రతిఘటనను ‘తన హృదయాన్ని కఠినపరచుకొని’ తెలియజేస్తుంది.
- source_word: לִבּוֹ
  choice: తన హృదయాన్ని
  rationale: హీబ్రూ భావప్రపంచంలో ‘హృదయం’ సంకల్పం, వైఖరి, నిర్ణయాల కేంద్రం. ఫరోనే కర్త కావడం తెలుగులో స్పష్టంగా ఉండేందుకు ప్రతిబింబ సర్వనామం ‘తన’ వాడబడింది.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: ఈసారి కూడా
  rationale: גַּם చేర్పు లేదా పునరావృత భావాన్ని, בַּפַּעַם הַזֹּאת ప్రస్తుత సందర్భాన్ని సూచిస్తాయి. ‘ఈసారి కూడా’ సహజంగా రెండింటినీ నిలుపుతుంది.
- source_word: וְלֹא שִׁלַּח
  choice: వెళ్లనివ్వలేదు
  rationale: నిర్గమకాండ సందర్భంలో שׁלח ప్రజలకు వెళ్లేందుకు అనుమతించి విడుదల చేయడాన్ని సూచిస్తుంది. ‘వెళ్లనివ్వలేదు’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: ఏకవచన సమూహవాచకమైన ఈ నిర్దిష్ట పదం సందర్భంలో ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; ‘ప్రజలను’ సహజమైన తెలుగు సమానం.
- source_word: וַ
  choice: అయితే
  rationale: వావ్ కథనాన్ని ముందుకు నడిపించినప్పటికీ, ముందటి ఉపశమనం తరువాత ఫరో చూపిన విరుద్ధ స్పందనను తెలుగులో ‘అయితే’ స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడడంలో కర్తృత్వం
  choice: ఫరో తన హృదయాన్ని తానే కఠినపరచుకున్నాడు
  alternative: ఫరో హృదయం కఠినపడింది; లేదా దేవుడు ఫరో హృదయాన్ని కఠినపరిచాడు
  rationale: ఈ వచనంలోని క్రియకు ఫరో స్పష్టమైన కర్త. అందువల్ల అతని స్వీయ కర్తృత్వాన్ని అనువాదం నిలుపుతుంది; నిర్గమకాండలో ఇతర చోట్ల దేవుని కర్తృత్వం చెప్పబడే ఉద్రిక్తతను ఇది పరిష్కరించడానికి ప్రయత్నించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిని నిలుపుతూ రూపొందించబడింది. ‘హృదయం’ అనే మూల రూపకాన్ని ప్రధాన వచనంలో ఉంచి, ‘బరువుగా చేయడం’ అనే హీబ్రూ నానుడి అక్షరార్థాన్ని పాదటీకలో ఇచ్చాం.
