  to: 'మోషే ఇలా అన్నాడు: “ఇదిగో, నేను నీ దగ్గరనుంచి బయలుదేరి యాహ్వేను వేడుకుంటాను. రేపు ఆ గుంపు[a] ఫరోనుంచి, అతని సేవకులనుంచి, అతని ప్రజలనుంచి తొలగిపోతుంది. ఫరో మాత్రం ప్రజలను యాహ్వేకు బలి అర్పించడానికి వెళ్లనివ్వకుండా ఇకపై మోసం చేయకూడదు.”'
