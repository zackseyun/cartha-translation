source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “ఇదిగో, నేను నీ దగ్గరనుంచి బయలుదేరి యాహ్వేను వేడుకుంటాను. రేపు ఆ గుంపు[a] ఫరోనుంచి, అతని సేవకులనుంచి, అతని ప్రజలనుంచి తొలగిపోతుంది. ఫరో మాత్రం ప్రజలను యాహ్వేకు బలి అర్పించడానికి వెళ్లనివ్వకుండా ఇకపై మోసం చేయకూడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన עָרֹב ప్రత్యేకంగా ఈగల గుంపును లేదా ఇతర గుంపులుగా వచ్చే కీటకాలను లేదా జీవులను సూచించవచ్చు; ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: మోషే చెప్పబోయే మాటపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన ప్రామాణిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: నీ దగ్గరనుంచి బయలుదేరి
  rationale: יצא అనే బయలుదేరే కదలికను, מֵעִמָּךְ అనే ‘నీ దగ్గరనుంచి’ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: యాహ్వేను వేడుకుంటాను
  rationale: עתר ఇక్కడ సాధారణ ప్రార్థనకన్నా గాఢమైన విజ్ఞాపన లేదా మధ్యవర్తిత్వ వేడుకోలును సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: וְסָר
  choice: తొలగిపోతుంది
  rationale: గుంపు అక్కడినుంచి పక్కకు తొలగి వెళ్లిపోతుందనే అకర్మక భావాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- source_word: הֶעָרֹב
  choice: ఆ గుంపు
  rationale: జీవుల ఖచ్చితమైన జాతిని నిర్ణయించకుండా, గుంపుగా ముసిరివచ్చిన వాటిని సూచించే మూలపదంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: ఫరోనుంచి, అతని సేవకులనుంచి, అతని ప్రజలనుంచి
  rationale: ప్రతి వర్గానికి ముందు హీబ్రూలో పునరావృతమైన ‘నుంచి’ భావాన్ని నిలిపి, తొలగింపు పరిధిని స్పష్టం చేస్తుంది.
- source_word: מָחָר
  choice: రేపు
  rationale: సాధారణ కాలవాచక క్రియావిశేషణానికి నేరమైన తెలుగు సమానం.
- source_word: רַק
  choice: అయితే
  rationale: తర్వాత వచ్చే హెచ్చరికను ముందటి హామీతో సహజంగా అనుసంధానిస్తూ పరిమితి భావాన్ని తెలియజేస్తుంది.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: మళ్లీ మోసం చేయకూడదు
  rationale: יסף పునరావృతిని, התל మోసపూరితంగా ఆటపట్టించే ప్రవర్తనను సూచిస్తాయి; సందర్భంలో ఫరో మళ్లీ మాట తప్పకూడదనే హెచ్చరికను ఈ రూపం స్పష్టంగా అందిస్తుంది.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: వెళ్లనివ్వకుండా
  rationale: ప్రజలను విడుదల చేయకపోవడమే ఫరో మోసానికి రూపమని తెలిపే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לִזְבֹּחַ
  choice: బలి అర్పించడానికి
  rationale: זבח సాధారణ ఆరాధనను కాక బలి సంబంధమైన ఆరాధనను ప్రత్యేకంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘Yahweh’ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇస్తుంది.
- issue: עָרֹב అనే జీవుల ఖచ్చితమైన గుర్తింపు
  choice: ఆ గుంపు
  alternative: ఈగల గుంపు; మిశ్రమ జీవుల గుంపు
  rationale: ఈ హీబ్రూ పదం ఏ జీవులను సూచిస్తుందో ఖచ్చితంగా తెలియదు. అందువల్ల ‘ఈగలు’ అని నిర్దిష్టపరచకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- issue: התל యొక్క భావం
  choice: మోసం చేయడం
  alternative: ఎగతాళి చేయడం; ఆటలాడడం
  rationale: ఫరో ప్రజలను పంపుతానని చెప్పి మళ్లీ నిరాకరించే సందర్భంలో మోసపూరిత ప్రవర్తనే ప్రధాన భావం; అయినా ఈ పదంలో అవహేళనతో ఆటపట్టించే ఛాయ కూడా ఉందని ప్రత్యామ్నాయం గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘నీ దగ్గరనుంచి’ సంభాషణలో సహజత్వాన్ని కాపాడుతుంది. ఫరోను ఉద్దేశించి మాట్లాడుతున్నప్పటికీ చివరి హెచ్చరికలో మూలపాఠంలాగే అతని పేరును మూడవ పురుషంలో ఉంచాం.
