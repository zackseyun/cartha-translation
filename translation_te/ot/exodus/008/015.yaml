  source_fidelity: హీబ్రూ పాఠంలోని క్రమం, ప్రధాన పదబంధాలు, మరియు అస్పష్టత విశ్వసనీయంగా ప్రతిఫలించబడ్డాయి. הַחַרְטֻמִּיםను ‘మంత్రగాళ్లు’గా, אֶצְבַּע אֱלֹהִיםను ‘దేవుని వేలు’గా అనువదించడం సందర్భానుకూలం. וַיֶּחֱזַק לֵב פַּרְעֹהను ‘ఫరో హృదయం కఠినమైంది’గా ఇవ్వడం కర్తను నిర్దిష్టం చేయని మూలవాక్యాన్ని కాపాడుతుంది. ‘అతడు వారి మాట వినలేదు’ שָׁמַע אֲלֵהֶםకు సహజమైన, సందర్భానుసారమైన అనువాదం.
