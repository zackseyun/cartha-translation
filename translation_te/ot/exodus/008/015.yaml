  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: te
  text: అప్పుడు మంత్రగాళ్లు ఫరోతో, “ఇది దేవుని వేలు[a]” అన్నారు. అయితే ఫరో హృదయం కఠినమైంది[b]. యహ్వే[c] చెప్పినట్టే అతడు వారి మాట వినలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని వేలు’ అనేది దేవుని ప్రత్యక్ష శక్తి కార్యరూపంలో ఉందని సూచించే రూపకం.
    reason: cultural_note
  - marker: b
    text: ‘ఫరో హృదయం గట్టిపడింది’ లేదా ‘బలపడింది’ అని కూడా అనువదించవచ్చు. ఈ ఉపవాక్యంలో దాన్ని కఠినపరిచిన కర్తను హీబ్రూ పాఠం స్పష్టంగా పేర్కొనదు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: YHWH (יהוה); సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: మంత్రగాళ్లు
  rationale: ఇది ఫరో సేవలో ఆచారపరమైన మంత్రవిద్యలు నిర్వహించే నిపుణులను సూచిస్తుంది. ‘మంత్రగాళ్లు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, వారి అధికారిక పాత్రను మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: ఇది దేవుని వేలు
  rationale: హీబ్రూలో ఇది క్రియలేని వాక్యం. ‘దేవుని వేలు’ అనే రూపకాన్ని అలాగే ఉంచడం ద్వారా దేవుని ప్రత్యక్ష శక్తి కార్యరూపంలో ఉందనే భావం నిలుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: אֱלֹהִים ఇతర సందర్భాల్లో ‘దేవుడు,’ ‘ఒక దేవుడు,’ లేదా ‘దేవుళ్లు’ అనే అర్థాలు పొందగలిగినా, ఇక్కడ కథన సందర్భం ఏకవచన దైవసూచనను బలపరుస్తుంది; అందువల్ల ‘దేవుడు’ సహజమైన ఎంపిక.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: ఫరో హృదయం కఠినమైంది
  rationale: חזק ఇక్కడ హృదయం గట్టిపడడం లేదా మొండిగా మారడాన్ని సూచిస్తుంది. ‘కఠినమైంది’ అనే అకర్మక రూపం ఈ వాక్యంలో కఠినపరిచిన కర్తను స్పష్టంగా పేర్కొనని హీబ్రూ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: అతడు వారి మాట వినలేదు
  rationale: שׁמע אֶל అంటే వినడం లేదా ఆలకించడం. తెలుగులో ‘వారి మాట వినలేదు’ అనేది కేవలం శబ్దం వినలేదనే భావం కాకుండా, వారి మాటను అంగీకరించలేదు అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యహ్వే చెప్పినట్టే
  rationale: ఈ సూత్రవాక్యం ముందుగా దేవుడు ప్రకటించిన మాట నెరవేరిందని సూచిస్తుంది. ‘చెప్పినట్టే’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పూర్వ ప్రకటనతో సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: వ్యక్తిగత దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ‘యహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని నామాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడడంలో కర్తృత్వం
  choice: ఫరో హృదయం కఠినమైంది
  alternative: ఫరో తన హృదయాన్ని కఠినపరచుకున్నాడు / దేవుడు ఫరో హృదయాన్ని కఠినపరిచాడు
  rationale: ఈ ఉపవాక్యం కఠినపరిచిన కర్తను ప్రత్యక్షంగా చెప్పదు. అకర్మక రూపం ఫరో లేదా దేవుడు కర్త అని ఈ వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించకుండా, కథనంలోని దైవిక-మానవ కర్తృత్వ ఉద్రిక్తతను నిలుపుతుంది.
- issue: אֱלֹהִים యొక్క సూచన
  choice: దేవుడు
  alternative: ఒక దేవుడు / దేవుళ్లు
  rationale: పదానికి విస్తృత అర్థపరిధి ఉన్నప్పటికీ, మోషే ద్వారా జరుగుతున్న సూచకకార్యాలపై మంత్రగాళ్ల అంగీకారం మరియు నిర్గమకాండ సందర్భం ఇక్కడ ఏకవచన ‘దేవుడు’ అనే పఠనానికి మద్దతిస్తాయి.
- issue: יהוה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం బిరుదు కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న వ్యక్తిగత దైవనామాన్ని వాడుతుంది. అందువల్ల దానిని ‘యహ్వే’గా ఉంచడం మూలరూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దేవుని వేలు’ అనే మూల రూపకం తొలగించకుండా ఉంచబడింది; ఫరో హృదయం కఠినపడడంలో కర్తృత్వం అనవసరంగా నిర్ణయించబడలేదు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
