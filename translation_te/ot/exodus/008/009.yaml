  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ יְהוָ֖ה כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יָּמֻ֨תוּ֙ הַֽ/צְפַרְדְּעִ֔ים מִן הַ/בָּתִּ֥ים מִן הַ/חֲצֵרֹ֖ת וּ/מִן הַ/שָּׂדֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: te
  text: యెహోవా మోషే మాట ప్రకారం చేశాడు. ఇళ్లలో, ఆవరణల్లో, పొలాల్లో ఉన్న కప్పలు చనిపోయాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: כִּדְבַר מֹשֶׁה
  choice: మోషే మాట ప్రకారం
  rationale: ‘మోషే మాటకు అనుగుణంగా’ అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: ఇళ్లలో, ఆవరణల్లో, పొలాల్లో ఉన్న
  rationale: హీబ్రూలోని מִן పదబంధాలు కప్పలు చనిపోయిన ప్రదేశాలను సూచిస్తున్నాయి; తెలుగులో ‘నుండి చనిపోయాయి’ అనడం అసహజం కాబట్టి భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం; మూలంలోని రెండు వరుస క్రియాత్మక వాక్యాలను నిలిపింది.
