id: EXO.8.16
reference: Exodus 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఉదయాన్నే లేచి ఫరో ఎదుట నిలబడు. ఇదిగో, అతడు నీటి దగ్గరికి వెళ్తున్నాడు. నీవు అతనితో ఇలా చెప్పాలి: ‘యెహోవా ఇలా అంటున్నాడు: నా ప్రజలను వెళ్లనివ్వు; వారు నన్ను సేవించేందుకు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే లేచి
  rationale: హిబ్రూ పదబంధంలోని త్వరగా లేవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట నిలబడు
  rationale: התיצב లోని ఉద్దేశపూర్వకంగా వెళ్లి స్థానం తీసుకోవడం అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి విషయంపై దృష్టి నిలిపే హిబ్రూ సూచనార్థక పదాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- source_word: יוֹצֵא הַמַּיְמָה
  choice: నీళ్ల దగ్గరికి బయలుదేరుతున్నాడు
  rationale: దిశను సూచించే הַמַּיְמָה ను సహజంగా అందిస్తూ, అతడు అప్పుడే వెళ్తున్నాడనే వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: שַׁלַּח עַמִּי
  choice: నా ప్రజలు … వారిని వెళ్లనివ్వు
  rationale: హిబ్రూ ఆజ్ఞార్థక క్రియలోని విడుదల చేసి వెళ్లనివ్వడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగులో అంశాన్ని ముందుంచి, సర్వనామంతో సహజంగా కొనసాగిస్తుంది.
- source_word: וְיַעַבְדֻנִי
  choice: నన్ను సేవించడానికి
  rationale: עבד కు ఈ సందర్భంలో దేవునికి సేవ/ఆరాధన చేయడం అనే విస్తృత భావం ఉంది; ‘సేవించు’ ఆ భావ విస్తృతిని అనవసరంగా సంకుచితం చేయదు.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హిబ్రూ మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- issue: עבד ను కేవలం ఆరాధనగా పరిమితం చేయాలా
  choice: సేవించడానికి
  alternative: ఆరాధించడానికి
  rationale: మూలపదం సేవ మరియు ఆరాధన రెండింటినీ కలిగి ఉండగలదు. ‘సేవించడానికి’ దాని విస్తృతిని, కథనంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. మూలంలోని పునరుక్త సంభాషణ నిర్మాణం మరియు ఆజ్ఞాత్మక బలం నిలుపబడ్డాయి.
