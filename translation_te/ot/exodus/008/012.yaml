id: EXO.8.12
reference: Exodus 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “అహరోనుతో చెప్పు: ‘నీ కర్రను చాపి, నేల ధూళిని కొట్టు; అది ఐగుప్తు దేశమంతటా చిన్న పురుగులుగా[a] మారుతుంది.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పేలు,” “చిన్న కుట్టే ఈగలు.” హీబ్రూ పదం చిన్న, కుట్టే లేదా చికాకు కలిగించే పురుగులను సూచిస్తుంది; ఖచ్చితమైన కీటకజాతి తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֱמֹר
  choice: ఇలా చెప్పు
  rationale: మోషే అహరోనుకు అందించవలసిన ప్రత్యక్ష ఆజ్ఞను సహజ తెలుగులో పరిచయం చేస్తుంది.
- source_word: נְטֵה
  choice: చాపి
  rationale: చేతికర్రను ముందుకు చాపే చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַטְּךָ
  choice: నీ చేతికర్రను
  rationale: ‘దండం’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం; సందర్భంలోని staff భావాన్ని నిలుపుతుంది.
- source_word: וְהַךְ
  choice: కొట్టు
  rationale: נכה ఆజ్ఞారూపంలోని ‘strike’ భావాన్ని నేరుగా, అనవసర పురాతన శైలి లేకుండా తెలియజేస్తుంది.
- source_word: עֲפַר הָאָרֶץ
  choice: నేల ధూళిని
  rationale: ‘భూమి యొక్క ధూళి’ అనే అసహజ పదబంధాన్ని తప్పించి, మూలంలోని నేల/భూమి ధూళి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְהָיָה
  choice: అప్పుడు అది ... మారుతుంది
  rationale: సందర్భంలో ధూళి పురుగులుగా పరిణమించే ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְכִנִּם
  choice: చిన్న పురుగులుగా[a]
  rationale: כִּנִּים సూచించే ఖచ్చితమైన కీటకజాతి అనిశ్చితమైనందున ‘పేలు’ లేదా ‘చిన్న ఈగలు’ అని అతిగా నిర్దిష్టం చేయకుండా సాధారణ పదాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: సమగ్ర వ్యాప్తిని సహజమైన, సంక్షిప్త తెలుగు రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దేవుని నామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం దేవుని ప్రత్యేక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడాం. ప్రత్యక్ష వాక్యంలోని ఆజ్ఞల సరళతను నిలిపి, కీటకజాతి విషయంలో మూలపాఠంలోని అనిశ్చితిని పాదసూచికతో కాపాడాం.
