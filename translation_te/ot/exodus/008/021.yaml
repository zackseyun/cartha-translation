  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని బహువచన ఆజ్ఞను ‘మీరు… అర్పించండి’గా నిలిపి, సందర్భంలో ఉన్న ఈజిప్టులోనే అనే పరిమితిని ‘ఈ దేశంలోనే’గా వ్యక్తం చేసింది.
