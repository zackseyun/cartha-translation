revisions:
- from: అప్పుడు ఫరో మోషేను, అహరోనును పిలిపించి, “మీరు వెళ్లి ఈ దేశంలోనే మీ దేవునికి బలులు అర్పించండి[a]” అని చెప్పాడు.
  to: 'అప్పుడు ఫరో మోషేను, అహరోనును పిలిచి ఇలా అన్నాడు: “వెళ్లి ఆ దేశంలో మీ దేవునికి బలులు అర్పించండి[a].”'
  rationale: The revision removes added demonstrative and restrictive force from the main rendering of ‘in the land,’ while retaining the contextual sense of Egypt in a clearly marked alternative. It also renders Pharaoh’s direct calling action more precisely and naturally in Telugu.
