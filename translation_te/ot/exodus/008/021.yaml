base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: te
  text: 'అప్పుడు ఫరో మోషేను, అహరోనును పిలిచి ఇలా అన్నాడు: “వెళ్లి ఆ దేశంలో మీ దేవునికి బలులు అర్పించండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈజిప్టు దేశంలోనే మీ దేవునికి బలులు అర్పించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించి
  rationale: ఈ కథన సందర్భంలో קרא అనేది మోషే అహరోనులను తన దగ్గరకు రప్పించడాన్ని సూచిస్తుంది. ‘పిలిపించి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజుకు సంబంధించిన బిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న ప్రామాణిక రూపం.
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: మోషేను, అహరోనును
  rationale: క్రియకు సంబంధించిన వ్యక్తులను తెలుగులో సహజమైన కర్మ విభక్తితో వ్యక్తం చేసింది.
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ ‘చెప్పాడు’ అనే భావాన్ని ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు నిర్మాణంలో అందిస్తుంది.
- source_word: לְכוּ
  choice: మీరు వెళ్లి
  rationale: బహువచన ఆజ్ఞారూపాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానిస్తుంది.
- source_word: זִבְחוּ
  choice: బలులు అర్పించండి
  rationale: זבח ఇక్కడ బల్యారాధనను సూచిస్తుంది. ‘బలులు అర్పించండి’ అనేది కేవలం ‘బలి ఇవ్వండి’ కంటే సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֵאלֹהֵיכֶם
  choice: మీ దేవునికి
  rationale: లామెద్ బలి యొక్క గ్రహీతను లేదా దిశను సూచిస్తుంది; ‘మీ దేవునికి’ తెలుగు బల్యారాధన వాడుకకు సరిపోతుంది.
- source_word: בָּאָרֶץ
  choice: ఈ దేశంలోనే
  rationale: పదశః ‘దేశంలో’. సందర్భంలో ఫరో ఉద్దేశం ఈజిప్టు దేశం లోపలే బలి అర్పించాలనేది; ‘ఈ’ మరియు ‘నే’ ఆ సందర్భసిద్ధ పరిమితిని సహజంగా తెలియజేస్తాయి, అయితే దేశం పేరును మూలపాఠంలో లేనందున చేర్చలేదు.
