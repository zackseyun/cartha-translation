source:
  edition: WLC
  text: וְ/סָר֣וּ הַֽ/צְפַרְדְּעִ֗ים מִמְּ/ךָ֙ וּ/מִ/בָּ֣תֶּ֔י/ךָ וּ/מֵ/עֲבָדֶ֖י/ךָ וּ/מֵ/עַמֶּ֑/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: te
  text: కప్పలు నీ నుండి, నీ ఇళ్ల నుండి, నీ సేవకుల నుండి, నీ ప్రజల నుండి తొలగిపోతాయి; నైలు నదిలో మాత్రమే అవి మిగిలి ఉంటాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నదిలో.’ హీబ్రూ יְאֹר అనే పదానికి ‘నది’ అని అర్థం కావచ్చు; అయితే నిర్గమకాండలో అది సాధారణంగా నైలు నదినే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: తొలగిపోతాయి
  rationale: סוּר ఇక్కడ కప్పలు వెళ్లిపోవడం లేదా తొలగిపోవడం అనే భావాన్ని ఇస్తుంది. తెగులు ముగిసే సందర్భానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הַצְפַרְדְּעִים
  choice: కప్పలు
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి నేరమైన అనువాదం.
- source_word: מִמְּךָ
  choice: నీ దగ్గరనుండి
  rationale: ఫరో వ్యక్తి లేదా అతని సమక్షం నుండి కప్పలు తొలగిపోతాయని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּמִבָּתֶּיךָ
  choice: నీ ఇళ్లనుండి
  rationale: హీబ్రూ మూలంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: וּמֵעֲבָדֶיךָ
  choice: నీ సేవకుల దగ్గరనుండి
  rationale: עֶבֶד కు సేవకుడు, దాసుడు, అధికారి అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఫరో ఆధీనంలోని పరివారాన్ని విస్తృతంగా సూచించడానికి ‘సేవకులు’ తగినది; బానిసత్వ స్థితిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וּמֵעַמֶּךָ
  choice: నీ ప్రజల దగ్గరనుండి
  rationale: ఫరో పాలనలోని ప్రజలను సూచించే విస్తృతమైన, సహజమైన రూపం.
- source_word: רַק
  choice: మాత్రమే
  rationale: తరువాత చెప్పే మినహాయింపును స్పష్టంగా గుర్తించే పరిమితార్థక పదం.
- source_word: בַּיְאֹר
  choice: నైలు నదిలో
  rationale: יְאֹר సాధారణంగా ‘నది’ అని అర్థమివ్వగలిగినా, నిర్గమకాండ సందర్భంలో ప్రత్యేకంగా నైలు నదినే సూచిస్తుంది.
- source_word: תִּשָּׁאַרְנָה
  choice: అవి మిగిలి ఉంటాయి
  rationale: שׁאר నిఫాల్ రూపం మిగిలి ఉండడం లేదా మిగిలిపోవడం అనే భావాన్ని ఇస్తుంది; తెలుగు వాక్య నిర్మాణంలో స్పష్టత కోసం కర్తను వ్యక్తం చేసింది.
