translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వరుసగా వచ్చే ‘నుండి’ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, వ్యక్తులకు ‘దగ్గరనుండి,’ ప్రదేశాలకు ‘నుండి’ వాడి తెలుగు సహజత్వాన్ని కాపాడింది. మూలంలో లేని కాలసంధానాన్ని బలంగా చేర్చకుండా, సందర్భానుగుణంగా ‘అప్పుడు’ ఉపయోగించబడింది.
