  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: te
  text: నా ప్రజలకూ నీ ప్రజలకూ మధ్య నేను భేదం కలిగిస్తాను[a]. రేపు ఈ సూచక కార్యం జరుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విమోచనం’ లేదా ‘విడుదల’. హీబ్రూ పదం దేవుని విమోచన కార్యాన్ని సూచించగలదు; ఇక్కడ ఆ కార్యం ఇశ్రాయేలు ప్రజలకూ ఐగుప్తు ప్రజలకూ మధ్య ఆయన కలిగించే భేదంగా వ్యక్తమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: నేను ... కలిగిస్తాను
  rationale: שׂים అనే క్రియకు ప్రాథమికంగా ‘ఉంచు/పెట్టు’ అనే అర్థం ఉన్నా, פְדֻת అనే భావవాచక నామంతోను ‘మధ్య’ అనే నిర్మాణంతోను కలిసినప్పుడు తెలుగులో ‘భేదం కలిగిస్తాను’ అనడం సహజంగా ఉండి, దేవుడు ఆ భేదాన్ని ఏర్పరుస్తాడనే భావాన్ని కాపాడుతుంది.
- source_word: פְדֻת
  choice: భేదం
  rationale: ఈ పదం ‘విమోచనం/విడుదల’ అనే భావాన్ని మోయగలదు. అయితే ‘నా ప్రజలకూ నీ ప్రజలకూ మధ్య’ అనే తక్షణ వాక్యనిర్మాణంలో, దేవుడు ఇశ్రాయేలీయులను ఐగుప్తీయుల నుండి వేరుగా చూడబోతున్నాడనే సందర్భార్థాన్ని ‘భేదం’ స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: בֵּין ... וּבֵין
  choice: '...కూ ...కూ మధ్య'
  rationale: రెండు వర్గాల మధ్య వేరుచేయడాన్ని తెలిపే హీబ్రూ సహసంబంధ పూర్వప్రత్యయ నిర్మాణానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: దేవునికి చెందిన ప్రజలను, ఈ సందర్భంలో ఇశ్రాయేలీయులను, సూచించే సరళమైన స్వామ్య నిర్మాణం.
- source_word: עַמֶּךָ
  choice: నీ ప్రజలు
  rationale: ఫరోకు చెందిన ప్రజలను, అంటే ఐగుప్తీయులను, సూచించే సరళమైన స్వామ్య నిర్మాణం.
- source_word: לְמָחָר
  choice: రేపు
  rationale: కాలాన్ని తెలిపే పదానికి నేరమైన, సహజమైన తెలుగు సమానం; మూలంలోని ప్రాధాన్యాన్ని నిలుపుతూ వాక్యారంభంలో ఉంచబడింది.
- source_word: יִהְיֶה
  choice: జరుగుతుంది
  rationale: ‘ఈ సూచక కార్యం’ కర్తగా ఉన్నప్పుడు, హీబ్రూ ‘ఉంటుంది’ అనే రూపాన్ని తెలుగులో అక్షరానువాదం చేయడం కంటే ‘జరుగుతుంది’ సందర్భానుసారంగా సహజంగా ఉంది.
- source_word: הָאֹת הַזֶּה
  choice: ఈ సూచక కార్యం
  rationale: אוֹת అంటే ‘సూచకం/సూచన’. తెగుళ్ల సందర్భంలో అది దేవుడు చేయబోయే గుర్తింపదగిన కార్యాన్ని సూచిస్తుంది; ‘ఈ సూచక కార్యం’ అనేది అది జరిగే కార్యమని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: פְדֻת అనే పదాన్ని ‘విమోచనం’గా అనువదించాలా, లేక సందర్భానుసారంగా ప్రజల మధ్య ‘భేదం’గా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘భేదం’
  alternative: ‘విమోచనం’ లేదా ‘విడుదల’
  rationale: తెగులు ఇశ్రాయేలీయులపై కాక ఐగుప్తీయులపై పడేలా దేవుడు రెండు ప్రజావర్గాలను వేరుచేయడమే ఈ వాక్యపు తక్షణ భావం. అయినప్పటికీ, ఆ భేదం దేవుని రక్షణాత్మక చర్య ద్వారా కలుగుతుంది కాబట్టి పదంలోని విమోచన భావాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన పదార్థ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘భేదం కలిగిస్తాను’ సహజమైన తెలుగు ప్రయోగం; ‘సూచక కార్యం’ అనేది אוֹת యొక్క ‘సూచకం’ అనే భావాన్నీ, అది జరగబోయే దైవిక కార్యమనే సందర్భాన్నీ కలిపి వ్యక్తం చేస్తుంది.
