  text: וְ/שַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖/י וּ/בֵ֣ין עַמֶּ֑/ךָ לְ/מָחָ֥ר יִהְיֶ֖ה הָ/אֹ֥ת הַ/זֶּֽה׃
base_translation:
