id: EXO.8.14
reference: Exodus 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: te
  text: మాంత్రికులు కూడా తమ రహస్య విద్యలతో పేనులను[a] పుట్టించడానికి అలాగే ప్రయత్నించారు, కానీ వారు చేయలేకపోయారు; పేనులు మనుషుల మీదా పశువుల మీదా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చిన్న దోమలను.” ఇక్కడి హీబ్రూ పదం ఏ పురుగును సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: మాంత్రికులు
  rationale: ఈ పదం ఫరో ఆస్థానంలోని మంత్రవిద్యా నిపుణులను సూచిస్తుంది. ‘మాంత్రికులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారి పద్ధతులను అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: בְּלָטֵיהֶם
  choice: తమ రహస్య విద్యలతో
  rationale: ఈ పదం రహస్యమైన మంత్ర లేదా గూఢ పద్ధతులను సూచిస్తుంది. ఈ అనువాదం ఆ అంతర్లీన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְהוֹצִיא
  choice: పుట్టించడానికి
  rationale: మూల క్రియ అక్షరార్థంగా ‘బయటికి తెచ్చుట’ అనే భావం కలిగినా, ఇక్కడ తెగులులోని పురుగులను ఉత్పత్తి చేయడానికి చేసిన ప్రయత్నాన్ని సూచిస్తుంది; ‘పుట్టించడానికి’ తెలుగులో సహజంగా ఆ సందర్భార్థాన్ని అందిస్తుంది.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: పేనులు
  rationale: ఏ పురుగు ఉద్దేశించబడిందో ఖచ్చితంగా తెలియదు. తెలుగులో ‘పేనులు’ సుపరిచితమైన అనువాదం; ‘చిన్న దోమలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని అనిశ్చితిని కాపాడుతున్నాం.
- source_word: וְלֹא יָכֹלוּ
  choice: కానీ వారు చేయలేకపోయారు
  rationale: వారి ప్రయత్నం విఫలమైందనే అసమర్థతను సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּאָדָם
  choice: మనుషుల మీదా
  rationale: ఇక్కడ אָדָם ఒక పురుష వ్యక్తిని కాక మానవజాతిని సమష్టిగా సూచిస్తుంది. తెలుగులో ‘మనుషులు’ ఆ సమష్టి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבַבְּהֵמָה
  choice: జంతువుల మీదా
  rationale: בְּהֵמָה ఇక్కడ జంతువులను సమష్టిగా సూచిస్తుంది. ‘జంతువులు’ ఆధునిక తెలుగులో విస్తృతమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: אָדָם పదానికి సమష్టి అర్థం
  choice: మనుషులు
  alternative: మానవుడు
  rationale: ఏకవచన రూపంలో ఉన్నప్పటికీ, సందర్భంలో ఈ పదం పురుషులను మాత్రమే కాక మనుషులందరినీ సమష్టిగా సూచిస్తుంది. ‘మనుషులు’ లింగ పరిమితిని రుద్దకుండా మూల భావాన్ని సహజ తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అలాగే చేశారు’ అనే నిర్మాణం ముందరి చర్యతో ఉన్న సంబంధాన్ని నిలుపుతుంది; పురుగు గుర్తింపులోని నిజమైన అనిశ్చితి పాదసూచికలో భద్రపరచబడింది.
