revisions:
- from: మాంత్రికులు కూడా తమ రహస్య విద్యలతో పేనులను[a] పుట్టించడానికి అలాగే చేశారు; కానీ వారు చేయలేకపోయారు. పేనులు మనుషుల మీదా జంతువుల మీదా ఉన్నాయి.
  to: మాంత్రికులు కూడా తమ రహస్య విద్యలతో పేనులను[a] పుట్టించడానికి అలాగే ప్రయత్నించారు, కానీ వారు చేయలేకపోయారు; పేనులు మనుషుల మీదా పశువుల మీదా ఉన్నాయి.
  rationale: The revision retains the draft’s faithful handling of the uncertain insect name and of the magicians’ inability, while using more idiomatic Telugu for their unsuccessful attempt and a more source-specific equivalent for the collective term for beasts/livestock.
