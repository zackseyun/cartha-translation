source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: te
  text: వారు అలాగే చేశారు. అహరోను తన కర్రతో తన చేతిని చాచి నేల ధూళిని కొట్టాడు. అప్పుడు పిన్న దోమలు[a] మనుషుల మీదా[b] పశువుల మీదా వచ్చాయి. ఐగుప్తు దేశమంతటా నేల ధూళి అంతా పిన్న దోమలుగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పేనులు.” כִנִּים అనే హెబ్రీ పదం ఏ కీటకాన్ని ఖచ్చితంగా సూచిస్తుందో నిర్ధారించలేము.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనుషులు” అని అనువదించిన హెబ్రీ పదం మానవులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: వారు అలాగే చేశారు
  rationale: మునుపటి ఆజ్ఞను అమలు చేశారనే హెబ్రీ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיֵּט אַהֲרֹן אֶת־יָדוֹ בְמַטֵּהוּ
  choice: అహరోను తన కర్రను పట్టుకున్న చెయ్యి చాపి
  rationale: చేతిని చాపడం అనే క్రియను కాపాడుతూ, కర్ర అతని చేతిలో ఉందనే సహవాస/సాధన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּךְ אֶת־עֲפַר הָאָרֶץ
  choice: నేల ధూళిని కొట్టాడు
  rationale: נכה యొక్క బలమైన చర్యను ‘కొట్టాడు’ స్పష్టంగా తెలియజేస్తుంది; עֲפַר הָאָרֶץ లోని ధూళి చిత్రణను నిలుపుతుంది.
- source_word: הַכִּנָּם / כִנִּים
  choice: చిన్న దోమలు
  rationale: ఈ హెబ్రీ కీటకపదానికి ఖచ్చితమైన జీవశాస్త్రీయ గుర్తింపు అనిశ్చితం. ‘చిన్న దోమలు’ సాధారణ పాఠకులకు అర్థమయ్యే ఎంపిక; ‘పేనులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: మనుషుల మీదా పశువుల మీదా
  rationale: אָדָם ఇక్కడ సమష్టిగా మానవులను సూచిస్తుంది; בְּהֵמָה సందర్భంలో పశువులను సూచిస్తుంది. ఈ జంట ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: నేల ధూళి అంతా చిన్న దోమలుగా మారింది
  rationale: כָּל యొక్క సంపూర్ణతను, היה యొక్క ఫలితార్థాన్ని, ధూళి కీటకాలుగా మారిన చిత్రణను నిలుపుతుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: మొత్తం దేశవ్యాప్త పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָדָם పదం యొక్క సమష్టి భావం
  choice: మనుషులు
  alternative: మనిషి
  rationale: ఈ సందర్భంలో పదం ఒక పురుషుణ్ణి మాత్రమే కాక మానవులను సమష్టిగా సూచిస్తుంది. ‘మనుషులు’ మూల భావాన్ని లింగపరంగా తప్పుగా పరిమితం చేయకుండా స్పష్టంగా తెలియజేస్తుంది.
- issue: כִנִּים కీటకాల గుర్తింపు
  choice: చిన్న దోమలు
  alternative: పేనులు
  rationale: మూలపదం ఏ కీటకాన్ని సూచిస్తుందో ఖచ్చితంగా నిర్ధారించలేము. ప్రధాన పాఠ్యంలో ఒక సాధ్యమైన అర్థాన్ని ఇచ్చి, మరో ప్రాచీనమైన సాధ్యార్థాన్ని పాదసూచికలో ఉంచడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అయితే మూలంలోని పునరుక్తి, సంపూర్ణత, కీటకపదపు అనిశ్చితి నిలుపబడ్డాయి.
