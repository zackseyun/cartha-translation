review_pass:
  verdict: revise
  source_fidelity: The conditional warning, imminent sending, repeated targets, and the deliberately nonspecific sense of עָרֹב are conveyed accurately. The final Hebrew plural pronoun most naturally points to the Egyptians implied by “the houses of Egypt”; the draft’s neuter “అవి” instead suggests nonhuman entities, especially the swarm, and weakens this relation.
  naturalness: The verse is generally fluent modern standard Telugu. Changing the final pronoun to the human plural “వారు” makes the final clause clear and idiomatic while retaining the Hebrew’s compact formulation.
  terminology: “నా ప్రజలను వెళ్లనివ్వకపోతే,” “ఇదిగో,” and “ఆ గుంపు” appropriately retain the release idiom, solemn warning register, and lexical uncertainty of עָרֹב. “ఐగుప్తీయుల ఇళ్లు” is more natural Telugu than “ఐగుప్తు ఇళ్లు” and accurately expresses the sense of Egyptian households.
  issues:
  - severity: medium
    issue: The final relative clause uses neuter “అవి ఉన్న నేల.”
    rationale: Hebrew הֵם is masculine plural and, in context, most naturally refers to the Egyptians implicit in “houses of Egypt.” Telugu “అవి” is nonhuman and readily redirects the reference to the swarm. “వారు ఉన్న నేల” gives the contextual human reference without adding theological or interpretive material.
  revised_text: ఎందుకంటే నీవు నా ప్రజలను వెళ్లనివ్వకపోతే, ఇదిగో, నేను ఆ గుంపును[a] నీ మీదికి, నీ సేవకుల మీదికి, నీ ప్రజల మీదికి, నీ ఇళ్లలోకి పంపబోతున్నాను. ఐగుప్తీయుల ఇళ్లు ఆ గుంపుతో నిండిపోతాయి; వారు ఉన్న నేల[b] కూడా దానితో నిండిపోతుంది.
