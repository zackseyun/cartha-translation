  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన హెచ్చరిక స్వరాన్ని నిలిపాం. ‘ఇదిగో’ బైబిలు ప్రకటనశైలికి తగినదైనా సాధారణ పాఠకునికి అర్థమయ్యే పదం. ‘గుంపు’ అనే విస్తృత పదం మూలంలోని జీవజాతి అనిశ్చితిని కాపాడుతుంది; ‘అవి’ ద్వారా చివరి సంబంధవాక్యంలోని సూచనను అతిగా స్పష్టీకరించలేదు.
