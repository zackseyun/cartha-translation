  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: te
  text: ఎందుకంటే నీవు నా ప్రజలను వెళ్లనివ్వకపోతే, ఇదిగో, నేను ఆ గుంపును[a] నీ మీదికి, నీ సేవకుల మీదికి, నీ ప్రజల మీదికి, నీ ఇళ్లలోకి పంపబోతున్నాను. ఐగుప్తీయుల ఇళ్లు ఆ గుంపుతో నిండిపోతాయి; వారు ఉన్న నేల[b] కూడా దానితో నిండిపోతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈగల దండు.’ హీబ్రూ עָרֹב బహుశా గుంపుగా వచ్చే జీవులను సూచిస్తుంది; సంప్రదాయంగా దీనిని ఈగల దండుగా అర్థం చేసుకున్నారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమి.’ హీబ్రూ אֲדָמָה అనే పదానికి ‘నేల’ లేదా ‘భూమి/దేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ఎందుకంటే, ... పోతే
  rationale: ముందటి మాటకు కారణసంబంధాన్ని, అలాగే షరతుతో కూడిన హెచ్చరికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: నీవు నా ప్రజలను వెళ్లనివ్వకపోతే
  rationale: నిర్గమకాండ సందర్భంలో שׁלח బంధనంనుంచి విడుదల చేసి వెళ్లనివ్వడాన్ని సూచిస్తుంది; కేవలం ‘పంపడం’ అనే భావం కాదు.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: ఇదిగో, నేను ... పంపబోతున్నాను
  rationale: הִנְנִי యొక్క గంభీరమైన ప్రకటన భావాన్ని ‘ఇదిగో’ నిలుపుతుంది; వర్తమాన కృదంతం సూచించే సమీప, నిశ్చిత చర్యను ‘పంపబోతున్నాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֶעָרֹב
  choice: ఆ గుంపు
  rationale: జీవుల జాతిని ఖచ్చితంగా నిర్ణయించకుండా, మూలపదంలోని ‘గుంపు/దండు’ భావాన్ని నిలుపుతుంది. సంప్రదాయ ‘ఈగలు’ అనే అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: నీ మీదికి, నీ సేవకుల మీదికి, నీ ప్రజల మీదికి
  rationale: తెగులు ఎవరిని తాకుతుందో తెలిపే בְּ ఉపసర్గను, మూలంలోని పునరుక్తి మరియు పెరుగుతున్న ఉద్ఘాటనతో సహా వ్యక్తం చేస్తుంది.
- source_word: וּבְבָתֶּיךָ
  choice: నీ ఇళ్లలోకి
  rationale: పంపబడే గుంపు కదలికను, తరువాత ఇళ్లు నిండిపోవడాన్ని దృష్టిలో ఉంచుకొని సహజమైన గమ్యార్థంతో అనువదించబడింది.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם אֶת הֶעָרֹב
  choice: ఐగుప్తు ఇళ్లు ఆ గుంపుతో నిండిపోతాయి
  rationale: హీబ్రూ నిర్మాణాన్ని అనుసరిస్తూనే, ‘నిండిపోవు’ అనే సహజ తెలుగు ప్రయోగంతో ఫలితాన్ని స్పష్టంగా చెబుతుంది.
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: అవి ఉన్న నేల కూడా దానితో నిండిపోతుంది
  rationale: אֲדָמָה యొక్క భౌతిక ఉపరితల భావాన్ని ‘నేల’గా ఇస్తుంది. הֵם యొక్క బహువచన సూచనను ‘అవి’గా ఉంచి, స్పష్టంగా చెప్పని పూర్వపదాన్ని అనవసరంగా నిర్ణయించదు.
