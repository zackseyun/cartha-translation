source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: te
  text: యాహ్వే అలాగే చేశాడు.[a] భారీ గుంపు ఫరో ఇంటిలోకీ, అతని సేవకుల ఇళ్లలోకీ, ఐగుప్తు దేశమంతటికీ వచ్చింది. ఆ గుంపువల్ల దేశం పాడైపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గొప్ప గుంపు.’ హెబ్రీ పదం ఒక పెద్ద కీటకాల గుంపును సూచించవచ్చు; అది ఏ జాతిదో ఖచ్చితంగా తెలియదు. సంప్రదాయంగా దీనిని ఈగల గుంపుగా అర్థం చేసుకున్నారు.
    reason: עָרֹב అనే పదం సూచించే కీటకాల ఖచ్చితమైన జాతి అనిశ్చితంగా ఉండటం వల్ల.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: అలాగే చేశాడు
  rationale: ముందుగా ప్రకటించినదానినే యాహ్వే అమలు చేశాడనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָרֹב כָּבֵד
  choice: విపరీతమైన గుంపు
  rationale: עָרֹב సూచించే జీవుల ఖచ్చితమైన జాతి అనిశ్చితంగా ఉన్నందున ప్రధాన పాఠ్యంలో ‘ఈగలు’ లేదా ‘కీటకాలు’ అని నిర్దిష్టం చేయలేదు; כָּבֵד ఇక్కడ గుంపు తీవ్రతను, విస్తారాన్ని సూచిస్తుంది.
- source_word: בֵּיתָה פַרְעֹה
  choice: ఫరో ఇంటిలోకి
  rationale: దిశను సూచించే రూపాన్ని ‘ఇంటిలోకి’గా నిలుపుతూ, మూలంలోని ‘ఇల్లు’ను ‘రాజభవనం’గా విస్తరించలేదు.
- source_word: וּבֵית עֲבָדָיו
  choice: అతని సేవకుల ఇళ్లలోకి
  rationale: ఏకవచన నిర్మాణాన్ని సందర్భానుసారంగా పంపిణీ భావంలో సహజమైన తెలుగు బహువచనంతో అనువదించింది; עֲבָדִים విస్తృతార్థాన్ని ‘అధికారులు’గా కుదించకుండా ‘సేవకులు’గా ఉంచింది.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: సమగ్ర వ్యాప్తిని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: దేశం పాడైపోయింది
  rationale: నిఫాల్ రూపం సూచించే నాశనం లేదా పాడైపోవడాన్ని బలంగా తెలియజేస్తూనే, సంపూర్ణ వినాశనమని అతిశయింపదు.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: ఆ గుంపువల్ల
  rationale: ఈ సందర్భంలో కారణాన్ని సూచించే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని పునరుక్తిని భారంగా కాకుండా ఉంచి, עָרֹב యొక్క నిజమైన పదార్థ అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచికలో కాపాడింది.
