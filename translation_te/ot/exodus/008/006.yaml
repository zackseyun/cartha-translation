  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: te
  text: అతడు, “రేపు” అన్నాడు. అతడు, “నీ మాట ప్రకారమే జరుగుతుంది; యాహ్వే మా దేవునివంటి వాడు మరెవ్వరూ లేరని నీవు తెలుసుకోవడానికి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు అన్నాడు
  rationale: రెండు సందర్భాల్లోనూ אמר అనే కథన క్రియను సహజమైన తెలుగు సంభాషణా రూపంలో ఇచ్చాం. హీబ్రూలో రెండవ వక్త పేరు స్పష్టంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో ‘మోషే’ అని చేర్చి ఆ అస్పష్టతను తొలగించలేదు.
- source_word: לְמָחָר
  choice: రేపు
  rationale: ఫరో ఇచ్చిన సంక్షిప్త ప్రత్యక్ష సమాధానాన్ని యథాతథంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּדְבָרְךָ
  choice: నీ మాట ప్రకారమే
  rationale: ‘నీ మాట ప్రకారం’ అనే మూలభాషా భావాన్ని నిలుపుతూ, అంగీకారంలోని నిశ్చయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְמַעַן תֵּדַע
  choice: నీవు తెలుసుకోవడానికి
  rationale: לְמַעַן సూచించే ఉద్దేశాన్ని, దాని తరువాతి అసంపూర్ణ క్రియతో కలిపి ఉద్దేశార్థక ఉపవాక్యంగా అనువదించాం.
- source_word: אֵין כַּיהוָה
  choice: యెహోవావంటి వాడు మరెవ్వరూ లేరు
  rationale: అస్తిత్వ నిరాకరణతో కూడిన పోలికను వ్యక్తిగత దేవుని గురించి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవుడు
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నప్పటికీ, ఈ సందర్భంలో ఇశ్రాయేలు యొక్క ఏక దేవునినే సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: ఇక్కడ మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: యెహోవాతో పోలిక యొక్క పరిధి
  choice: యెహోవావంటి వాడు మరెవ్వరూ లేరు
  alternative: యెహోవా తప్ప మరొక దేవుడు లేడు
  rationale: హీబ్రూ వాక్యం పోలికను వ్యక్తం చేస్తుంది; అది నేరుగా ‘మరొక దేవుడు లేడు’ అని చెప్పదు. అందువల్ల మూలంలోని పోలికనూ దాని వేదాంతపరమైన ఉద్వేగాన్నీ అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలపాఠ్యంలో రెండవ ‘అతడు’ ఎవరో వ్యాకరణపరంగా పేరు పెట్టబడలేదు; సందర్భంలో మోషే అని స్పష్టమైనా, అనువాదంలో పేరును చేర్చలేదు. ‘నీ మాట ప్రకారమే జరుగుతుంది’లో హీబ్రూ వాక్యంలోని సహజంగా అర్థమయ్యే క్రియను తెలుగులో స్పష్టంచేశాం.
