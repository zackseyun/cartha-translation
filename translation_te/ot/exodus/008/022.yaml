id: EXO.8.22
reference: Exodus 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: te
  text: 'కానీ మోషే ఇలా అన్నాడు: “అలా చేయడం తగదు. ఎందుకంటే ఐగుప్తీయులకు అసహ్యమైనదాన్ని[a] మన దేవుడైన యహ్వేకు బలిగా అర్పిస్తాం. ఐగుప్తీయులకు అసహ్యమైనదాన్ని వారి కళ్ల ఎదుటే మనం బలిగా అర్పిస్తే, వారు మనలను రాళ్లతో కొట్టరా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఐగుప్తు యొక్క హేయమైనది.” ఈ మాట ఐగుప్తీయులు అసహ్యంగా భావించినదాన్ని సూచిస్తున్నట్లు సందర్భం తెలియజేస్తోంది.
    reason: హీబ్రూ సంబంధవాచక నిర్మాణంలో ఉన్న సందిగ్ధతను, సందర్భానుసారంగా ఎంచుకున్న అర్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: נָכוֹן
  choice: తగదు
  rationale: ఈ సందర్భంలో ఈ పదం సముచితమైనది, తగినది అనే భావాన్ని తెలియజేస్తుంది. నిరాకరణతో కలిపి ‘తగదు’ అనడం సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: לַעֲשׂוֹת כֵּן
  choice: అలా చేయడం
  rationale: ‘ఆ విధంగా చేయడం’ అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: ఐగుప్తీయులకు అసహ్యమైనది
  rationale: నిర్మాణం అక్షరార్థంగా ‘ఐగుప్తు యొక్క హేయమైనది’ అయినప్పటికీ, సందర్భంలో ఐగుప్తీయులు అసహ్యంగా భావించిన బలి అనే ఉద్దేశ్యార్థం వాక్య తర్కానికి సరిపోతుంది. మూలంలోని నిర్మాణాత్మక సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: נִזְבַּח
  choice: బలిగా అర్పించాల్సి ఉంటుంది / బలిగా అర్పిస్తే
  rationale: మొదటి చోట ఫరో ప్రతిపాదన ప్రకారం చేయబోయే కార్యాన్ని, రెండవ చోట ఊహాత్మక షరతును తెలుగు వాక్యప్రవాహానికి అనుగుణంగా వ్యక్తం చేశాం.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: హీబ్రూ ఒడంబడిక నామమైన יהוהను వ్యక్తినామంగా ప్రత్యక్షంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడైన
  rationale: మూలంలోని ‘మన దేవుడు’ అనే స్వామ్య సంబంధాన్ని యహ్వే అనే నామంతో సహజమైన తెలుగు నిర్మాణంలో కలిపాం.
- source_word: הֵן
  choice: అర్పిస్తే
  rationale: ఇక్కడ הֵן ఊహాత్మక పరిస్థితిని ప్రవేశపెడుతుంది; తెలుగులో షరతార్థక క్రియారూపం అదే పనిని సహజంగా నిర్వహిస్తుంది.
- source_word: לְעֵינֵיהֶם
  choice: వారి కళ్ల ఎదుటే
  rationale: మూలంలోని దృశ్యాత్మక నుడికారాన్ని, దాని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יִסְקְלֻנוּ
  choice: మనలను రాళ్లతో కొట్టరా?
  rationale: סק״ל క్రియలోని రాళ్లతో దాడి చేయడం లేదా రాళ్లతో కొట్టి చంపడం అనే నిర్దిష్ట భావాన్ని నిలుపుతూ, మూలంలోని అలంకారప్రశ్నను సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ఒడంబడిక నామంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: תּוֹעֲבַת מִצְרַיִם యొక్క సంబంధార్థం
  choice: ఐగుప్తీయులకు అసహ్యమైనది
  alternative: ఐగుప్తు యొక్క హేయమైనది
  rationale: ఇశ్రాయేలీయులు తమ కళ్ల ఎదుట బలి అర్పిస్తే ఐగుప్తీయులు రాళ్లతో కొడతారనే సందర్భం, ఐగుప్తీయులు అసహ్యంగా భావించేదనే లక్ష్యార్థాన్ని బలపరుస్తుంది. అయినా హీబ్రూ నిర్మాణంలోని విస్తృతమైన అక్షరార్థాన్ని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘వారి కళ్ల ఎదుటే’ అనే రూపంతో మూలంలోని దృశ్యాత్మక బలాన్ని, చివరి అలంకారప్రశ్నను నిలిపాం.
