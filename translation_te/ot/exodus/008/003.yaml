language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: te
  text: మాంత్రికులు కూడా తమ రహస్య మంత్రవిద్యలతో[a] అలాగే చేసి, ఐగుప్తు దేశం మీదికి కప్పలను రప్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ మంత్రతంత్రాలతో’; లేదా ‘తమ గూఢ మాంత్రిక కళలతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేసి
  rationale: עשה + כֵן అనే ప్రయోగం ముందుగా జరిగిన కార్యాన్ని అదే విధంగా చేయడాన్ని సూచిస్తుంది. ‘అలాగే చేసి’ ఈ పోలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַחֲרְטֻמִּים
  choice: మాంత్రికులు
  rationale: నిర్గమకాండ సందర్భంలో ఈ పదం ఫరో ఆస్థానంలో గూఢమైన లేదా మాంత్రిక పద్ధతులను ఆచరించే వారిని సూచిస్తుంది. ‘మాంత్రికులు’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: בְּלָטֵיהֶם
  choice: తమ రహస్య మంత్రవిద్యలతో
  rationale: ఈ పదం రహస్యమైన మాంత్రిక పద్ధతులను, వాటిని సాధనంగా ఉపయోగించడాన్ని సూచిస్తుంది. ఈ అనువాదం గూఢత్వాన్నీ సాధనార్థాన్నీ తెలిపి, నిర్దిష్ట ప్రక్రియను అనవసరంగా నిర్ణయించదు.
- source_word: וַיַּעֲלוּ
  choice: రప్పించారు
  rationale: 'עלה అనే క్రియ యొక్క హిఫీల్ రూపం కారణార్థకమైనది: వారు కప్పలు పైకి వచ్చేలా చేశారు. ‘రప్పించారు’ ఆ కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: కప్పలను
  rationale: నిర్దిష్ట బహువచన ప్రత్యక్ష కర్మను తెలుగులో సహజంగా ‘కప్పలను’ అని అనువదించాం.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం మీదికి
  rationale: עַל ఇక్కడ ఐగుప్తు దేశంపైకి లేదా దేశమంతటిమీదికి కప్పలు రావడాన్ని సూచిస్తుంది. ‘దేశం మీదికి’ కదలికను, వ్యాప్తిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మాంత్రికుల కార్య స్వభావం
  choice: మాంత్రికులు కూడా కప్పలను రప్పించారని వచనం చెప్పినట్లుగానే నేరుగా అనువదించడం.
  alternative: అది కేవలం కనిపించే అనుకరణ లేదా మోసం అన్నట్లుగా సందేహార్థకంగా అనువదించడం.
  rationale: హీబ్రూ కథనం ఈ కార్యాన్ని ఎలాంటి పరిమితి లేదా సందేహ సూచన లేకుండా నివేదిస్తుంది. అది నిజంగా ఎలా జరిగిందనే సహజవాద లేదా సిద్ధాంతపరమైన వివరణను అనువాదం చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గాంభీర్యం నిలిచేలా అనువదించబడింది. కారణార్థక క్రియను ‘రప్పించారు’తో నిలిపి, మాంత్రికుల కార్యాన్ని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా వివరించలేదు.
