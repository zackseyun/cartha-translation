id: EXO.8.18
reference: Exodus 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: te
  text: అయితే ఆ రోజున నా ప్రజలు నివసిస్తున్న గోషెను ప్రాంతాన్ని నేను వేరుగా చేస్తాను; అక్కడ కీటకాల దండు[a] ఉండదు. నీవు ఈ దేశం నడుమ నేనే యహ్వేనని తెలుసుకునేలా ఇలా చేస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దండు’ లేదా ‘ఈగల దండు.’ עָרֹב అనే హెబ్రీ పదం ఖచ్చితంగా ఏ జీవులను సూచిస్తుందో తెలియదు; అది విస్తృతంగా కీటకాల సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భూమి నడుమ.’ సందర్భంలో ఇది ఐగుప్తు దేశాన్ని సూచించే అవకాశం ఎక్కువైనా, హెబ్రీ పదానికి మరింత విస్తృతమైన అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: నేను ప్రత్యేకంగా ఉంచుతాను
  rationale: ఈ సందర్భంలో פלא క్రియ హిఫీల్ రూపం ఒక ప్రాంతాన్ని ఇతర ప్రాంతాల నుంచి వేరుగా చూడడం, దానికి భిన్నమైన పరిణామం కలిగించడం అనే భావాన్ని ఇస్తుంది. ‘ప్రత్యేకంగా ఉంచుతాను’ అనే పదబంధం ఆ రక్షణాత్మక భేదాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశం
  rationale: אֶרֶץ ఇక్కడ భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది. ‘గోషెను దేశం’ అనేది భౌగోళిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: నా ప్రజలు నివసిస్తున్న
  rationale: భూమికి సంబంధించి עֹמֵד עַל అనే ప్రయోగం అక్కడ ఉండడం లేదా నివసించడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది; అక్షరార్థమైన ‘నిలబడి ఉన్న’ అన్నది ఇక్కడ సహజం కాదు.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: అక్కడ ... ఉండదు
  rationale: 'ఈ అనంతక్రియా నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది: ఆ తెగులు గోషెనులో ఉండదు. తెలుగులో సంక్షిప్తమైన ఫలిత వాక్యంగా ఇచ్చాం.'
- source_word: עָרֹב
  choice: కీటకాల దండు
  rationale: ఈ పదం సూచించే జీవజాతి ఖచ్చితంగా తెలియదు; అది ఈగలు మాత్రమే కాక విస్తృతమైన కీటక సమూహాన్ని సూచించవచ్చు. ‘కీటకాల దండు’ మూలంలోని సామూహిక భావాన్ని సహజంగా అందిస్తూ అనవసరమైన నిర్దిష్టతను నివారిస్తుంది.
- source_word: לְמַעַן תֵּדַע
  choice: దీనివల్ల ... నీవు తెలుసుకుంటావు
  rationale: ఈ పదబంధం ఫరో తెలుసుకోవాలనే దైవిక ఉద్దేశాన్ని సూచిస్తుంది. ‘దీనివల్ల’ ముందు జరిగిన భేదపరచే కార్యానికీ ఆ జ్ఞానానికీ ఉన్న సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, Yahweh ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: దేశం మధ్యలో
  rationale: בְּקֶרֶב స్థలమధ్యాన్ని సూచిస్తుంది; הָאָרֶץ ఈ సందర్భంలో ఐగుప్తు దేశాన్ని సూచించే అవకాశం ఎక్కువ. అయినా ‘భూమి’ అనే విస్తృత పఠనానికి ఉన్న అవకాశాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, Yahweh రూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడాం.
- issue: בְּקֶרֶב הָאָרֶץ పరిధి
  choice: దేశం మధ్యలో
  alternative: భూమి మధ్యలో
  rationale: తెగుళ్ల కథన సందర్భంలో ఇది ఐగుప్తు దేశంలో యహ్వే సన్నిధి మరియు కార్యాన్ని సూచించే అవకాశం ఎక్కువ. అయితే హెబ్రీ పదం ‘భూమి’ అనే విస్తృత అర్థాన్నీ అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. మూలంలోని భేదపరచడం, అనిశ్చిత కీటక సమూహం, ‘దేశం/భూమి’ అనే అర్థ విస్తృతి నిలుపబడ్డాయి.
