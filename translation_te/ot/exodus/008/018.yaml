- from: అయితే ఆ రోజున, నా ప్రజలు నివసిస్తున్న గోషెను దేశాన్ని నేను ప్రత్యేకంగా ఉంచుతాను. అక్కడ కీటకాల దండు[a] ఉండదు. దీనివల్ల, దేశం మధ్యలో నేను యహ్వేనని నీవు తెలుసుకుంటావు[b].
