source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֔ה עַל דְּבַ֥ר הַֽ/צְפַרְדְּעִ֖ים אֲשֶׁר שָׂ֥ם לְ/פַרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను ఫరో దగ్గర నుంచి బయటికి వెళ్లారు. ఫరో మీదికి ఆయన రప్పించిన[a] కప్పల విషయమై మోషే యహ్వేకు మొరపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరోకు వ్యతిరేకంగా ఆయన ఉంచిన.’ హెబ్రీ క్రియ అక్షరార్థంగా ‘పెట్టడం’ లేదా ‘ఉంచడం’ అని అర్థమిస్తుంది; తెగులు సందర్భంలో ‘మీదికి రప్పించిన’ అనేది దాని భావాన్ని సహజంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయటికి వెళ్లారు
  rationale: יצא ఇక్కడ ఫరో సమక్షం నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది. సంయుక్త కర్తలైన మోషే, అహరోనులకు అనుగుణంగా తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: מֵעִם פַּרְעֹה
  choice: ఫరో దగ్గర నుంచి
  rationale: מֵעִם అనేది ఫరో సమక్షం లేదా సాంగత్యం నుంచి వెళ్లడాన్ని సూచిస్తుంది; ‘దగ్గర నుంచి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּצְעַק
  choice: మొరపెట్టాడు
  rationale: צעק దేవునికి చేసే తీవ్రమైన విజ్ఞాపనను సూచిస్తుంది. ‘మొరపెట్టాడు’ దాని తీవ్రతను, ప్రార్థనాత్మక సందర్భాన్ని రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עַל דְּבַר
  choice: విషయమై
  rationale: ఈ ప్రయోగం ‘గురించి/సంబంధించి’ అనే అర్థాన్ని ఇస్తుంది; ‘విషయమై’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు.
- source_word: הַצְפַרְדְּעִים
  choice: కప్పలు
  rationale: తెగులులోని జంతువులను సూచించే సాధారణ బహువచన నామవాచకం.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: ఫరో మీదికి ఆయన రప్పించిన
  rationale: שׂים యొక్క మూలభావం ‘పెట్టు/ఉంచు’; అయితే తెగులు సందర్భంలో ‘మీదికి రప్పించిన’ తెలుగులో సహజంగా దాని విధింపుభావాన్ని తెలియజేస్తుంది. ‘ఆయన’ అనే సర్వనామం మూలంలోని వ్యక్తిని పేరు పెట్టకుండా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: אֲשֶׁר שָׂם లోని అంతర్లీన కర్త
  choice: ఆయన
  alternative: యహ్వే
  rationale: సందర్భంలో కర్త యహ్వే అని బలంగా సూచించబడుతున్నప్పటికీ, హెబ్రీ పాఠం ఈ ఉపవాక్యంలో పేరును మళ్లీ స్పష్టంగా చెప్పదు. అందువల్ల సర్వనామంతో మూలంలోని స్వల్ప అంతర్లీనతను నిలిపాం.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘మొరపెట్టాడు’ అనే పదం ప్రార్థనలోని తీవ్రతను నిలుపుతుంది; వాక్యాన్ని తెలుగులో స్పష్టంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం.
