source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: te
  text: 'అప్పుడు ఫరో మోషేను అహరోనును పిలిపించి ఇలా అన్నాడు: “ఈ కప్పలను నన్ను, నా ప్రజలను విడిచి తొలగించమని యాహ్వేను వేడుకోండి[a]. అప్పుడు వారు యాహ్వేకు బలులు అర్పించడానికి నేను ప్రజలను వెళ్లనిస్తాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వేడుకోండి’ అని అనువదించిన హీబ్రూ క్రియలో అత్యవసరంగా ప్రాధేయపడడం లేదా మధ్యవర్తిత్వం చేయడం అనే భావం ఉంది; ఇది కేవలం సాధారణ ప్రార్థనను మాత్రమే సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను ప్రజలను వెళ్లనిస్తాను, వారు యాహ్వేకు బలులు అర్పిస్తారు.” హీబ్రూ పదబంధాన్ని సరళ సమన్వయంగా కూడా చదవవచ్చు; ఇక్కడ అది ప్రజలను వెళ్లనివ్వడంలోని ఉద్దేశం లేదా ఫలితాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: మోషేను, అహరోనును పిలిపించి
  rationale: קרא + לְ ఇక్కడ వారిని తన దగ్గరకు రప్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పిలిపించి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הַעְתִּירוּ אֶל יְהוָה
  choice: యెహోవాను వేడుకోండి
  rationale: עתר హిఫిల్ రూపం సాధారణ ప్రార్థనకన్నా మనవి చేయడం లేదా ప్రాధేయపడడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘వేడుకోండి’ సులభంగానూ భావసమృద్ధిగానూ ఉంది.
- source_word: וְיָסֵר הַצְפַרְדְּעִים מִמֶּנִּי וּמֵעַמִּי
  choice: ఆయన నన్నూ నా ప్రజలనూ ఈ కప్పల నుంచి విడిపిస్తే
  rationale: సందర్భంలో סור హిఫిల్ కప్పలను తొలగించి బాధితులకు ఉపశమనం కలిగించడాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘కప్పల నుంచి విడిపిస్తే’ అభ్యర్థనకు అనుసరించే ఫరో వాగ్దానాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: నేను ఈ ప్రజలను వెళ్లనిస్తాను
  rationale: కోహోర్టేటివ్ రూపం ఫరో ప్రకటించిన సంకల్పం లేదా వాగ్దానాన్ని సూచిస్తుంది. నిర్గమకాండంలోని పునరావృత ప్రయోగానికి ‘వెళ్లనిస్తాను’ సరిపోతుంది.
- source_word: וְיִזְבְּחוּ לַיהוָה
  choice: అప్పుడు వారు యెహోవాకు బలులు అర్పిస్తారు
  rationale: זבח అంటే బలి అర్పించడం. ముందు ఉన్న విడుదల వాగ్దానానికి దీన్ని ఉద్దేశించిన ఫలితంగా ‘అప్పుడు’ సహజంగా అనుసంధానిస్తుంది; సరళ సమన్వయ పఠనాన్ని పాదటిప్పణి సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’ను వాడి, ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు.
- issue: ఫరో చివరి మాటలోని సంబంధం
  choice: 'ఉద్దేశం/ఫలితం: ‘అప్పుడు వారు ... బలులు అర్పిస్తారు’'
  alternative: 'సరళ సమన్వయం: ‘వారు ... బలులు అర్పిస్తారు’'
  rationale: ఫరో ప్రజలను పంపుతాననే మాట తర్వాత వచ్చే అసంపూర్ణ క్రియను ఉద్దేశించిన ఫలితంగా గ్రహించవచ్చు. అయితే హీబ్రూలో సరళ సమన్వయ భావమూ సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: וְיָסֵר యొక్క వాక్య సంబంధం
  choice: 'షరతు/అభ్యర్థిత ఫలితం: ‘విడిపిస్తే’'
  alternative: 'విషయవాక్యం: ‘తొలగించమని ... వేడుకోండి’'
  rationale: ప్రార్థన అభ్యర్థన మరియు ఫరో వాగ్దానం మధ్య సహజ తెలుగు సంబంధాన్ని చూపుతుంది; దేవుడు కప్పలను తొలగించాలనే మూలార్థం మారదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పిలిపించి,’ ‘వేడుకోండి,’ ‘వెళ్లనిస్తాను,’ ‘బలులు అర్పిస్తారు’ వంటి సహజ ప్రయోగాలు వాడబడ్డాయి. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
