    rationale: హీబ్రూ הִתְפָּאֵר עָלַי అక్షరస్థాయిలో ‘నాపై ఘనత పొందు/తీసుకో’ అనే కష్టమైన ప్రయోగం. “సమయాన్ని నిర్ణయించే ఘనత నీదే” నుడికారపు రూపకాన్ని వివరణగా మార్చి, ప్రశ్నలోని సమయనిర్ణయ అంశాన్ని ముందుగానే పునరావృతం చేస్తుంది.
