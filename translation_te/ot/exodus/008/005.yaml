  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה לְ/פַרְעֹה֮ הִתְפָּאֵ֣ר עָלַ/י֒ לְ/מָתַ֣י אַעְתִּ֣יר לְ/ךָ֗ וְ/לַ/עֲבָדֶ֨י/ךָ֙ וּֽ/לְ/עַמְּ/ךָ֔ לְ/הַכְרִית֙ הַֽ/צֲפַרְדְּעִ֔ים מִמְּ/ךָ֖ וּ/מִ/בָּתֶּ֑י/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: te
  text: 'మోషే ఫరోతో ఇలా అన్నాడు: “నాపై ఈ ఘనతను తీసుకో[a]: నీ కోసం, నీ సేవకుల కోసం, నీ ప్రజల కోసం నేను ఎప్పుడు వేడుకోవాలో చెప్పు—నీ దగ్గర నుండి, నీ ఇళ్ల నుండి కప్పలను తొలగించడానికి. నైలు నదిలో మాత్రమే అవి మిగిలి ఉంటాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం క్లిష్టమైనది. అక్షరార్థానికి దగ్గరగా, “నాపై ఘనత పొందు” అని కూడా అనవచ్చు. సందర్భంలో, తాను ఎప్పుడు వేడుకోవాలో ఫరోనే సమయాన్ని నిర్ణయించమని మోషే చెబుతున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: సమయాన్ని నిర్ణయించే ఘనత నీదే
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ఘనత పొందడం లేదా తనను గొప్పచేసుకోవడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో ఫరోనే ప్రార్థన సమయాన్ని నిర్ణయించమని మోషే ఆహ్వానిస్తున్నాడు. తెలుగు ప్రధాన పాఠంలో సందర్భార్థాన్ని సహజంగా తెలిపి, నుడికారంలోని ఘనత భావాన్ని కూడా నిలిపాం.
- source_word: לְמָתַי אַעְתִּיר
  choice: నేను ఎప్పుడు వేడుకోవాలో చెప్పు
  rationale: לְמָתַי సమయాన్ని అడుగుతుంది; עתר హిఫీల్ రూపం దేవునికి మనవి చేయడం లేదా వేడుకోవడం సూచిస్తుంది. ఫరో సమయాన్ని చెప్పాలనే సందర్భసూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: నీ కోసం, నీ సేవకుల కోసం, నీ ప్రజల కోసం
  rationale: మూడుసార్లు వచ్చిన హీబ్రూ సంబంధబోధకాన్ని పునరావృతం చేసి, మోషే చేసే మనవి ఎవరెవరికి సంబంధించినదో స్పష్టంగా నిలిపాం.
- source_word: לְהַכְרִית הַצֲפַרְדְּעִים
  choice: కప్పలు లేకుండా పోయేలా
  rationale: כרת అక్షరార్థంగా ‘నరికివేయు/తొలగించు’; ఇక్కడ కప్పలు ఫరో దగ్గరనుండి, అతని ఇళ్లలోనుండి పూర్తిగా తొలగిపోవడాన్ని సూచిస్తుంది. జంతువులను నరకడం అనే అపార్థం రాకుండా సందర్భార్థాన్ని సహజంగా ఇచ్చాం.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: నీ దగ్గర, నీ ఇళ్లలో
  rationale: ఫరో వ్యక్తిగత పరిధినీ అతని ఇళ్లనూ వేరుగా పేర్కొనే మూలపాఠ నిర్మాణాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: רַק בַּיְאֹר תִּשָּׁאַרְנָה
  choice: నైలు నదిలో మాత్రమే అవి మిగిలి ఉంటాయి
  rationale: רַק మినహాయింపును బలపరుస్తుంది; יְאֹר ఇక్కడ ఈజిప్టు నైలు నదిని సూచిస్తుంది; שׁאר నిఫాల్ రూపం మిగిలి ఉండడాన్ని తెలుపుతుంది.
theological_decisions:
- issue: మోషే చేసే వేడుకోలు ఎవరికి ఉద్దేశించబడిందో మూలపాఠంలో ప్రత్యక్షంగా చెప్పకపోవడం
  choice: దేవుని పేరును ప్రధాన పాఠంలో చేర్చకుండా ‘నేను ... వేడుకోవాలో’ అని ఉంచడం
  alternative: ‘నేను దేవునికి ఎప్పుడు వేడుకోవాలో’
  rationale: సందర్భంలో మోషే దేవునికి మనవి చేస్తాడనేది స్పష్టమైనప్పటికీ, ఈ వాక్యంలో దేవుని పేరు ప్రత్యక్షంగా లేదు. మూలపాఠంలోని సంక్షిప్తతను, అంతర్లీనతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. క్లిష్టమైన హీబ్రూ నుడికారానికి సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, దాని అక్షరార్థపు ఘనత/గొప్పతనం భావాన్ని పాదటీపులో నిలిపాం.
