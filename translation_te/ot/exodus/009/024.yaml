source:
  edition: WLC
  text: וַ/יְהִ֣י בָרָ֔ד וְ/אֵ֕שׁ מִתְלַקַּ֖חַת בְּ/ת֣וֹךְ הַ/בָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁר לֹֽא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָ֖ז הָיְתָ֥ה לְ/גֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: te
  text: వడగండ్లు కురిశాయి[a]; వాటి మధ్యలో అగ్ని మెరుస్తోంది. అది అత్యంత తీవ్రమైనది—ఐగుప్తు ఒక జనంగా ఏర్పడినప్పటి నుండి ఆ దేశమంతటిలో అలాంటిది ఎన్నడూ సంభవించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వడగండ్లు పడ్డాయి; వాటి మధ్యలో అగ్ని అటూ ఇటూ దూసుకుపోతూ ఉంది.” హీబ్రూ మూలంలో అక్షరార్థంగా “అగ్ని” అని ఉంది; ఇది తుఫానులో వడగండ్ల మధ్య కనిపించిన మెరుపులాంటి ప్రకాశాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: వడగండ్లు కురిశాయి
  rationale: హీబ్రూ కథన నిర్మాణం వడగండ్ల ఉనికిని/సంభవాన్ని తెలియజేస్తుంది. తెలుగులో వాతావరణ సంఘటనకు ‘వడగండ్లు కురిశాయి’ సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְאֵשׁ
  choice: అగ్ని
  rationale: మూలపదం అక్షరార్థంగా ‘అగ్ని’; తుఫాను సందర్భంలో ఇది మెరుపులాంటి అగ్ని ప్రకాశాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో మూల చిత్రణను నిలిపాం.
- source_word: מִתְלַקַּחַת
  choice: మెరుస్తూ ఉంది
  rationale: ఈ హిత్పయేల్ కృదంతం వడగండ్ల మధ్య కదులుతూ లేదా మళ్లీ మళ్లీ ప్రకాశించే అగ్ని దృశ్యాన్ని సూచిస్తుంది. ‘మెరుస్తూ’ ఆధునిక తెలుగులో ఆ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: వడగండ్ల మధ్యలో
  rationale: בְּתוֹךְ మధ్యలో/అంతర్భాగంలో అనే భావాన్ని ఇస్తుంది; ఈ అనువాదం అగ్ని వడగండ్ల నడుమ కనిపించిన చిత్రాన్ని కాపాడుతుంది.
- source_word: כָּבֵד מְאֹד
  choice: అత్యంత తీవ్రమైనది
  rationale: כבד అక్షరార్థంగా ‘భారీ’; తుఫాను తీవ్రతను తెలిపే సందర్భంలో ‘అత్యంత తీవ్రమైనది’ సహజమైన భావానువాదం.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: అలాంటిది ఎన్నడూ సంభవించలేదు
  rationale: పోలికలేని తీవ్రతను తెలిపే సంబంధ వాక్యాన్ని సహజమైన తెలుగులో, దాని అతిశయ భావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటిలో
  rationale: మొత్తం ఐగుప్తు భూభాగాన్ని సూచించే ప్రాంతీయ వ్యక్తీకరణను సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: ఐగుప్తు దేశం ఒక జనంగా ఏర్పడినప్పటి నుండి
  rationale: స్త్రీలింగ క్రియకు సమీప పూర్వపదమైన ‘దేశం’ సూచ్యంగా ఉంది; לְגוֹי ఒక జనంగా/దేశజనంగా అవతరించిన చారిత్రక దశను సూచిస్తుంది. ‘ఒక జనంగా’ అనేది גוי యొక్క ప్రజాసమూహ భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అగ్ని’ అనే మూల చిత్రణను ప్రధాన పాఠంలో నిలిపి, మెరుపు అనే సందర్భార్థాన్ని పాదసూచికలో వివరించాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
