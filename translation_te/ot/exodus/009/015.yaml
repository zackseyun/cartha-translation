source:
  edition: WLC
  text: כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת יָדִ֔/י וָ/אַ֥ךְ אוֹתְ/ךָ֛ וְ/אֶֽת עַמְּ/ךָ֖ בַּ/דָּ֑בֶר וַ/תִּכָּחֵ֖ד מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: te
  text: ఎందుకంటే, ఈపాటికే నేను నా చేయి చాపి నిన్నూ నీ ప్రజలనూ మహమ్మారితో[a] కొట్టి ఉండేవాడిని; అప్పుడు నీవు భూమి నుండి నిర్మూలించబడేవాడివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, రూపానికి మరింత దగ్గరగా: “ఎందుకంటే, ఇప్పుడు నేను నా చేయి చాపి నిన్నూ నీ ప్రజలనూ మహమ్మారితో కొట్టాను; నీవు భూమి నుండి నిర్మూలించబడ్డావు.” హీబ్రూ క్రియారూపాలు వ్యాకరణపరంగా భూతకాలంలో ఉన్నాయి; అయితే సందర్భం వాటికి ప్రతివాస్తవిక భావం ఉందని బలంగా సూచిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: עַתָּה
  choice: ఈపాటికే
  rationale: సందర్భంలోని ప్రతివాస్తవిక భావంలో, అప్పటికే జరిగి ఉండగల ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: నేను నా చెయ్యి చాపి ... కొట్టగలిగేవాడిని
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా భూతకాలమైనా, 15–16 వచనాల సందర్భం జరగగలిగినా జరగని చర్యను సూచిస్తుంది; ‘చెయ్యి చాపడం’ అనే దైవిక చర్యకు సంబంధించిన మూలభాషా నుడికారాన్ని నిలుపుతుంది.
- source_word: וָאַךְ
  choice: కొట్టి
  rationale: נכה అనే క్రియకు తీర్పు లేదా తెగులు సందర్భంలో సహజమైన, బలమైన తెలుగు సమానం.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: నిన్నూ నీ ప్రజలనూ
  rationale: రెండు ప్రత్యక్ష కర్మలను సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: בַּדָּבֶר
  choice: మహమ్మారితో
  rationale: דֶּבֶר ఇక్కడ ప్రాణాంతక అంటువ్యాధి లేదా తెగులును సూచిస్తుంది; మొత్తం ఐగుప్తు తెగుళ్ల శ్రేణితో అయోమయం రాకుండా ‘మహమ్మారి’ అని ఇచ్చాం.
- source_word: וַתִּכָּחֵד
  choice: లేకుండా తుడిచిపెట్టబడేవాడివి
  rationale: כחד నిఫాల్ రూపంలోని నిర్మూలించబడడం లేదా కనుమరుగవడం అనే తీవ్ర భావాన్ని, ప్రతివాస్తవిక ఫలితంతో కలిపి తెలియజేస్తుంది.
- source_word: מִן־הָאָרֶץ
  choice: భూమిమీద లేకుండా
  rationale: אֶרֶץ‌కు ‘దేశం’ లేదా ‘భూమి’ అనే రెండు అర్థాలు సాధ్యమైనా, ఇక్కడ సంపూర్ణ నిర్మూలన భావం ఉన్నందున విస్తృతమైన ‘భూమి’ను ఎంచుకున్నాం.
theological_decisions:
- issue: క్రియారూపాల ప్రతివాస్తవిక భావం
  choice: ‘కొట్టగలిగేవాడిని ... తుడిచిపెట్టబడేవాడివి’ అని జరగగలిగినా జరగని చర్యగా అనువదించడం
  alternative: ‘ఇప్పుడు నేను నా చెయ్యి చాపి ... కొట్టాను; నీవు భూమిమీద నుంచి తుడిచిపెట్టబడ్డావు’ అని సరళ భూతకాలంగా అనువదించడం
  rationale: హీబ్రూ క్రియారూపాలు రూపరీత్యా భూతకాలమైనా, ఫరో ఇంకా సజీవంగా సంబోధించబడుతున్నాడు; తదుపరి వచనం దేవుడు అతన్ని నిలిపి ఉంచిన ఉద్దేశాన్ని వివరిస్తుంది. అందువల్ల సందర్భార్థం ప్రతివాస్తవికమైనది. రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని ఉపయోగించాం. ‘చెయ్యి చాపి’ అనే మూల నుడికారాన్ని నిలిపి, ప్రతివాస్తవికతను తెలుగు సామర్థ్యరూపం మరియు షరతు-ఫలిత నిర్మాణంతో స్పష్టం చేశాం.
