revisions:
- from: 'అప్పుడు యహ్వే మోషే, అహరోనులతో ఇలా అన్నాడు: “మీ పిడికిళ్ల నిండా[a] కొలిమి మసిని[b] తీసుకోండి. మోషే దాన్ని ఫరో కళ్లముందు ఆకాశం వైపు[c] విసరాలి.”'
  to: 'అప్పుడు యహ్వే మోషేతోను అహరోనుతోను ఇలా అన్నాడు: “మీ దోసిళ్లు నిండా[a] కొలిమి మసిని[b] తీసుకోండి. మోషే దానిని ఫరో కళ్లముందు ఆకాశం వైపు[c] విసరాలి.”'
  rationale: The revision replaces the misleading fist imagery with cupped-hand imagery, uses standard Telugu name and coordination forms, and corrects the sky/heaven footnote to a contextually appropriate lexical alternative. It retains the source’s shift from a plural command to Moses’ singular action and preserves all footnote anchors.
