reference: Exodus 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతోను అహరోనుతోను ఇలా అన్నాడు: “మీ దోసిళ్లు నిండా[a] కొలిమి మసిని[b] తీసుకోండి. మోషే దానిని ఫరో కళ్లముందు ఆకాశం వైపు[c] విసరాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ చేతులు నిండా”; అక్షరార్థంగా “మీ చేతుల నిండుదనం.”
    reason: lexical_alternative
  - marker: b
    text: “మసి”ని “సన్నని మసి” అని, లేదా మరింత సాధారణంగా “బూడిద” అని కూడా అనువదించవచ్చు; అయితే హీబ్రూ పదం కొలిమి నుంచి వచ్చే మసిని మరింత నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఆకాశాల వైపు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר అనే సాధారణ మాటల క్రియను సహజమైన తెలుగు సంభాషణా పరిచయంగా అనువదించాం.
- source_word: קְחוּ לָכֶם
  choice: తీసుకోండి
  rationale: బహువచన ఆజ్ఞను స్పష్టంగా ఉంచాం; לָכֶם లోని ప్రయోజనార్థక భావాన్ని తెలుగులో విడిగా ‘మీ కోసం’ అనడం అసహజంగా ఉండటంతో క్రియలోనే అంతర్లీనంగా ఉంచాం.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: మీ పిడికిళ్ల నిండా
  rationale: ‘మీ చేతుల/దోసిళ్ల నిండుదనం’ అనే పరిమాణ భావాన్ని సాధారణ పాఠకుడికి స్పష్టమైన, దృశ్యాత్మకమైన తెలుగులో వ్యక్తం చేస్తుంది; సంబోధితులు ఇద్దరని బహువచనం నిలుపుతుంది.
- source_word: פִּיחַ
  choice: మసి
  rationale: ఇది సాధారణ బూడిదకన్నా కొలిమి నుంచి వచ్చే సన్నని నల్లని అవశేషాన్ని సూచిస్తుంది; తెలుగులో ‘మసి’ ఆ భావానికి సహజమైన సమీప పదం.
- source_word: כִּבְשָׁן
  choice: కొలిమి
  rationale: ఈ పదం కొలిమి లేదా బట్టీని సూచించగలదు. సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘కొలిమి’ సహజంగా సరిపోతుంది.
- source_word: וּזְרָקוֹ
  choice: మోషే దాన్ని … విసరాలి
  rationale: మొదటి ఆజ్ఞ ఇద్దరికీ బహువచనంలో ఉన్నా, తరువాతి క్రియ ఏకవచనంలో మోషేనే కర్తగా చూపుతుంది. ఆ మార్పును స్పష్టంగా నిలిపాం.
- source_word: הַשָּׁמַיְמָה
  choice: ఆకాశం వైపు
  rationale: దిశను సూచించే ప్రత్యయం పైకి, ఆకాశం వైపు చేసే భౌతిక చర్యను తెలుపుతుంది; ‘పరలోకం వైపు’ అనే అనవసరమైన ధార్మిక అర్థాన్ని రానివ్వదు.
- source_word: לְעֵינֵי פַרְעֹה
  choice: ఫరో కళ్లముందు
  rationale: ‘ఫరో కళ్లకు’ అనే హీబ్రూ నుడికారంలోని ప్రత్యక్షంగా కనిపించే చర్య భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని ఇచ్చాం.
- issue: הַשָּׁמַיְמָה యొక్క భావం
  choice: ఆకాశం వైపు
  alternative: పరలోకం వైపు
  rationale: ఇక్కడ మసిని పైకి విసిరే భౌతిక చర్య ప్రధానమైనది. అయితే హీబ్రూ שׁמים పదానికి ‘ఆకాశం/ఆకాశాలు’ మరియు ‘పరలోకం’ అనే భావ పరిధి ఉండటంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. దైవ నామాన్ని ‘యహ్వే’గా నిలిపాం. ఇద్దరికీ ఇచ్చిన బహువచన ఆజ్ఞ నుంచి మోషేకు మాత్రమే ఇచ్చిన ఏకవచన ఆదేశానికి మూలపాఠంలో ఉన్న మార్పును స్పష్టంగా కాపాడాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట సరైన క్రమంలో ఉంచాం.
