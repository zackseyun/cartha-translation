  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: te
  text: ఆ కురుపుల వల్ల మాంత్రికులు మోషే ఎదుట నిలబడలేకపోయారు. ఎందుకంటే ఆ కురుపులు మాంత్రికుల మీదా, ఐగుప్తీయులందరి మీదా[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఐగుప్తు దేశమంతటిలో.” సందర్భాన్ని బట్టి ఇది దేశమంతటా ఉన్న ప్రజలను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: మాంత్రికులు
  rationale: నిర్గమకాండ సందర్భంలో ఈ పదం ఫరో ఆస్థానంలోని మంత్రతంత్ర సంబంధమైన నిపుణులను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘మాంత్రికులు’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: మోషే ఎదుట నిలబడలేకపోయారు
  rationale: మూలంలోని ‘మోషే ఎదుట నిలబడడం’ అనే రూపాన్ని సహజమైన తెలుగులో నిలుపుతూ, వారు బాధ కారణంగా ఆయన సమక్షంలో నిలవలేకపోయారనే భావాన్ని తెలియజేస్తుంది.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: ఆ కురుపుల వల్ల
  rationale: מִפְּנֵי ఇక్కడ కారణాన్ని సూచిస్తుంది. שְׁחִין ఏకవచన సమూహార్థకంగా చర్మంపై వచ్చిన కురుపుల వ్యాధిని సూచిస్తున్నందున తెలుగులో బహువచనం సహజం.
- source_word: הַשְּׁחִין
  choice: ఆ కురుపులు
  rationale: వాక్యంలో పునరావృతమైన వ్యాధి సూచనను ఒకే పదంతో నిలిపి, అనేక మందిపై ఏర్పడిన కురుపుల సమూహార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּחֲרְטֻמִּם
  choice: మాంత్రికుల మీదా
  rationale: శరీరంపై ఉన్న బాధను సూచించే సందర్భంలో ב అనే ఉపసర్గను ‘మీద’ అని అనువదించడం సహజం.
- source_word: וּבְכָל מִצְרָיִם
  choice: ఐగుప్తీయులందరి మీదా
  rationale: మూలంలో అక్షరార్థంగా ‘ఐగుప్తు దేశమంతటిలో’ అని ఉన్నా, ‘మాంత్రికుల మీద’ అనే సమాంతర నిర్మాణం మరియు కురుపులు ప్రజలను బాధించిన సందర్భం మానవ సూచనను అంతర్భావంగా కలిగి ఉన్నాయి. దానిని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
