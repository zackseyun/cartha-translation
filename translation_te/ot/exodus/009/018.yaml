source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: te
  text: ఇదిగో, రేపు దాదాపు ఇదే సమయానికి[a] నేను అత్యంత భారీ వడగండ్ల వానను కురిపిస్తాను. ఐగుప్తు స్థాపించబడిన రోజు నుండి[b] ఇప్పటివరకు, అలాంటి వడగండ్ల వాన ఎన్నడూ సంభవించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రేపు ఇదే సమయానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఐగుప్తు స్థాపించబడిన నాటి నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: గంభీరమైన దైవిక ప్రకటనను బలంగా పరిచయం చేసే సూచనాత్మక పదంగా హీబ్రూ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מַמְטִיר
  choice: నేను ... కురిపిస్తాను
  rationale: హిఫిల్ రూపంలోని ప్రత్యక్ష దైవిక కారణత్వాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּעֵת מָחָר
  choice: రేపు దాదాపు ఇదే సమయానికి
  rationale: כְּ లోని సుమారు/పోలిక భావాన్ని కాపాడుతూ, మరుసటి రోజు ఇదే సమయం చుట్టుపక్కల అని సూచిస్తుంది.
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: అతి భారీ వడగండ్ల వాన
  rationale: בָּרָד ను వడగండ్ల వానగా, כָּבֵד מְאֹד లోని తీవ్రతను అతి భారీగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: అలాంటిది ఎన్నడూ పడలేదు
  rationale: రాబోయే వడగండ్ల వానకు పూర్వసాటి లేదనే పోలికను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: ఐగుప్తు స్థాపించబడిన రోజు మొదలుకొని
  rationale: నిఫాల్‌లోని స్థాపించబడుట అనే కర్మణి భావాన్ని నిలుపుతూ, స్త్రీలింగ క్రియకు సూచిత విషయమైన ఐగుప్తును తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְעַד עָתָּה
  choice: ఇప్పటివరకు
  rationale: స్థాపననాటి నుండి ప్రస్తుత క్షణం వరకూ కొనసాగే కాలపరిమితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తెగులు సంభవించడంలో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: “నేను ... కురిపిస్తాను” అని ప్రత్యక్షంగా అనువదించడం
  alternative: “వడగండ్ల వాన పడుతుంది” అనే పరోక్ష రూపం
  rationale: మొదటి పురుష కర్తతో ఉన్న హిఫిల్ క్రియ రాబోయే వడగండ్ల వానను దేవుని ప్రత్యక్ష చర్యగా పేర్కొంటుంది; దాన్ని వ్యక్తిరహిత సంఘటనగా మృదువుపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రకటన శైలిని ఉపయోగించాం. “ఇదిగో” మూలంలోని దృష్టి ఆకర్షణను, “నేను ... కురిపిస్తాను” ప్రత్యక్ష దైవిక కార్యసాధకత్వాన్ని నిలుపుతాయి. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
