id: EXO.9.28
reference: Exodus 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: te
  text: “యెహోవాకు మనవి చేయండి. దేవుని ఉరుములు[a], వడగండ్లు ఇక చాలు. అప్పుడు నేను మిమ్మల్ని వెళ్లనిస్తాను; మీరు ఇక ఇక్కడ ఉండనక్కరలేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దేవుని స్వరాలు.” ఈ తుఫాను సందర్భంలో అవి ఉరుములను సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: మనవి చేయండి
  rationale: עתר హిఫీల్ ఆజ్ఞార్థక బహువచనం ఇక్కడ దేవునికి ప్రగాఢంగా ప్రార్థించడం లేదా వేడుకోవడం అనే భావాన్ని ఇస్తుంది. ‘మనవి చేయండి’ అనేది ఫరో మోషే, అహరోనులను తన తరఫున యెహోవాను వేడుకోమని అడుగుతున్న సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְרַב מִהְיֹת
  choice: ఇక చాలు
  rationale: ‘ఉండడం నుండి అధికం’ అనే హీబ్రూ ప్రయోగం పరిమాణం చాలిపోయిందని, అది ఆగాలని కోరే భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘ఇక చాలు’ ఆ విన్నపాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קֹלֹת אֱלֹהִים
  choice: దేవుని ఉరుములు
  rationale: קֹלֹת అక్షరార్థంగా ‘స్వరాలు/ధ్వనులు’; వడగండ్ల తుఫాను సందర్భంలో అవి ఉరుములను సూచిస్తాయి. אֱלֹהִיםతో ఉన్న సంబంధాన్ని ‘దేవుని’ అని ఉంచి దైవ మూలం లేదా సంబంధాన్ని నిలిపాం.
- source_word: וּבָרָד
  choice: వడగండ్లు
  rationale: בָּרָדకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘వడగండ్లు’.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: అప్పుడు నేను మిమ్మల్ని వెళ్లనిస్తాను
  rationale: నిర్గమకాండ సందర్భంలో שלח ప్రజలను విడుదల చేసి వెళ్లనివ్వడాన్ని సూచిస్తుంది. వావ్‌తో వచ్చే ఫలిత సంబంధాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: మీరు ఇక ఇక్కడ ఉండనక్కరలేదు
  rationale: ‘నిలిచి ఉండడానికి ఇక జోడించరు’ అనే హీబ్రూ ప్రయోగం ఇక కొనసాగి ఉండకపోవడాన్ని సూచిస్తుంది. ‘ఇక్కడ’ అనేది గమ్యభావాన్ని స్పష్టం చేస్తుంది; ‘ఉండనక్కరలేదు’ ఫరో వారిని ఇక ఆలస్యం చేయనని ఇచ్చిన హామీని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: קֹלֹת אֱלֹהִים అర్థం
  choice: దేవుని ఉరుములు
  alternative: దేవుని స్వరాలు
  rationale: అక్షరార్థమైన ‘దేవుని స్వరాలు’ అనే భావాన్ని పాదసూచికలో నిలిపి, వడగండ్ల తుఫాను సందర్భంలో ఉద్దేశిత వాతావరణ ధ్వనిని ప్రధాన పాఠ్యంలో ‘ఉరుములు’గా ఇచ్చాం. దీనితో దైవ సంబంధమూ నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. మూలంలో వక్తపేరు ఈ వాక్యంలో లేకపోయినా తెలుగు ఉల్లేఖన ముగింపుకు అవసరమైన ‘అన్నాడు’ను సందర్భానుసారంగా చేర్చాం. ‘ఇక చాలు’ ఫరో విన్నపంలోని ఆతురతను నిలుపుతుంది; పాదసూచిక అక్షరార్థాన్ని సంరక్షిస్తుంది.
