source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: te
  text: అయితే యాహ్వే ఇశ్రాయేలు పశుసంపదకు, ఐగుప్తు పశుసంపదకు మధ్య తేడా చూపిస్తాడు. ఇశ్రాయేలీయులకు[a] చెందిన వాటిలో ఒక్కటి కూడా చనిపోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: తేడా చూపిస్తాడు
  rationale: פלא యొక్క హిఫీల్ రూపం ఇక్కడ రెండు సమూహాల మధ్య స్పష్టమైన భేదాన్ని కలిగించడం లేదా వాటిని వేరుగా చూడడం అనే భావాన్ని ఇస్తుంది. ‘తేడా చూపిస్తాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కారక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: בֵּין ... וּבֵין
  choice: …కు, …కు మధ్య
  rationale: రెండు వర్గాల మధ్య వ్యత్యాసాన్ని సూచించే హీబ్రూ సహసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: מִקְנֵה
  choice: పశుసంపద
  rationale: ఈ పదం కేవలం ఆవులు లేదా ఎద్దులను కాక, పెంపుడు పశువుల సముదాయాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: מִצְרָיִם
  choice: ఐగుప్తు
  rationale: ‘ఐగుప్తు పశుసంపద’ అనే దేశసంబంధ నిర్మాణం మూలంలోని מִקְנֵה מִצְרָיִםను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יָמוּת מִכָּל ... דָּבָר
  choice: వాటిలో ఒక్కటి కూడా చనిపోదు
  rationale: నిషేధంతో కూడిన ఏకవచన דָּבָר ఇక్కడ ‘ఒక్కటి కూడా కాదు’ అనే బలమైన పంపిణీ భావాన్ని ఇస్తుంది; సందర్భం పశుసంపద కాబట్టి ‘వాటిలో’ దాని సూచ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులకు చెందిన
  rationale: לְ యొక్క స్వామ్య/సంబంధ భావాన్ని ‘చెందిన’ స్పష్టం చేస్తుంది; స్థిరమైన జాతీయ నానుడి ‘ఇశ్రాయేలు కుమారులు’ను సహజ తెలుగు జాతినామంతో అందించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని భేదాన్ని కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే జాతీయ నానుడి
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు; ఇశ్రాయేలు సంతతి
  rationale: ఈ సందర్భంలో ఈ పుంలింగ బహువచన నానుడి వ్యక్తిగత పురుషులను మాత్రమే కాక మొత్తం ఒడంబడిక ప్రజలను సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ ఆ సమూహార్థాన్ని సహజంగా తెలుపుతుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పశుసంపద’ ద్వారా సమూహార్థాన్ని, ‘ఒక్కటి కూడా’ ద్వారా మూలంలోని బలమైన నిషేధాన్ని నిలిపింది.
