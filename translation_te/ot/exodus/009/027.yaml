source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: te
  text: 'అప్పుడు ఫరో పంపి మోషేను, అహరోనును పిలిపించాడు. వారితో ఇలా అన్నాడు: “ఈసారి నేను పాపం చేశాను. యెహోవా న్యాయవంతుడు[a]; నేనూ నా ప్రజలూ దోషులం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా నీతిమంతుడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేనూ నా ప్రజలూ దుష్టులం / తప్పుచేసినవాళ్లం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపి
  rationale: మూలంలోని ‘పంపాడు’ అనే చర్యను స్పష్టంగా నిలుపుతూ, తెలుగులో ఎవరినో పంపిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקְרָא לְ
  choice: పిలిపించడానికి
  rationale: లְ తో కూడిన క్రియ ఇక్కడ మోషే అహరోనులను తన దగ్గరకు రప్పించడానికి పిలిపించడాన్ని సూచిస్తుంది.
- source_word: חָטָאתִי הַפָּעַם
  choice: ఈసారి నేను పాపం చేశాను
  rationale: ఫరో ఈ సందర్భంలో తన తప్పును ఒప్పుకుంటున్న భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הַצַּדִּיק
  choice: న్యాయవంతుడు
  rationale: ఈ న్యాయపరమైన విరుద్ధతలో దేవుడు నీతిమంతుడు, న్యాయమైన పక్షంలో ఉన్నవాడు అనే భావాన్ని నిలుపుతుంది.
- source_word: הָרְשָׁעִים
  choice: దోషులం
  rationale: ఫరో తననూ తన ప్రజలనూ నైతికంగా, న్యాయపరంగా తప్పుచేసినవారిగా ఒప్పుకుంటున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: הַצַּדִּיק మరియు הָרְשָׁעִים మధ్య నైతిక-న్యాయపరమైన వ్యత్యాసం
  choice: యెహోవాయే న్యాయవంతుడు; నేనూ నా ప్రజలూ దోషులం
  alternative: యెహోవా నీతిమంతుడు; నేనూ నా ప్రజలూ దుష్టులం
  rationale: సందర్భంలోని ‘ఆయన న్యాయమైన పక్షంలో ఉన్నాడు; మేము తప్పుచేశాం’ అనే ఒప్పుకోలును స్పష్టంగా ఉంచుతూ, పదాలకు ఉన్న విస్తృత నైతిక భావాన్ని పాదసూచనల్లో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘పంపి—పిలిపించాడు’ అనే రెండు చర్యల క్రమాన్ని నిలుపుతూ, తెలుగులో అస్పష్టత రాకుండా ‘మనుషులను’ సందర్భానుసారంగా చేర్చాం. ప్రధాన వాక్యంలో న్యాయపరమైన భావాన్ని, పాదసూచనల్లో ‘నీతిమంతుడు/దుష్టులు’ అనే మరింత పదక్షర ప్రత్యామ్నాయాలను నిలిపాం.
