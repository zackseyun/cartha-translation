  to: 'అప్పుడు ఫరో పంపి మోషేను, అహరోనును పిలిపించాడు. వారితో ఇలా అన్నాడు: “ఈసారి నేను పాపం చేశాను. యెహోవా న్యాయవంతుడు[a]; నేనూ నా ప్రజలూ దోషులం[b].”'
