source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: te
  text: అయితే యాహ్వే ఫరో హృదయాన్ని కఠినం చేశాడు; అతడు వారి మాట వినలేదు, యాహ్వే మోషేతో చెప్పినట్లే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరో హృదయాన్ని దృఢం చేశాడు,’ లేదా ‘ఫరో హృదయాన్ని బలపరిచాడు.’ హీబ్రూ క్రియకు మరింత అక్షరార్థంగా ‘బలంగా/దృఢంగా చేయడం’ అనే భావం ఉంది; ఈ సందర్భంలో అది ఫరో మొండిగా ప్రతిఘటించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: కఠినపరిచాడు
  rationale: חזק అనే క్రియ ప్రాథమికంగా బలపరచడం లేదా దృఢపరచడం అని అర్థమిస్తుంది. అయితే నిర్గమకాండలో ‘హృదయం’తో కలిసి వచ్చినప్పుడు మొండి ప్రతిఘటనను సూచిస్తుంది. ‘కఠినపరిచాడు’ ఈ సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, యాహ్వే ప్రత్యక్ష కర్తగా ఉన్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ లిప్యంతరీకరణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: לֵב פַּרְעֹה
  choice: ఫరో హృదయాన్ని
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విభక్తి నిర్మాణంలో ఇచ్చాం. ‘హృదయం’ ఇక్కడ సంకల్పం, వైఖరి కేంద్రాన్ని సూచించినా, మూలంలోని రూపకాన్ని విస్తరించకుండా నిలిపాం.
- source_word: שָׁמַע אֲלֵהֶם
  choice: వారి మాట వినలేదు
  rationale: שׁמע אֶל అంటే వినడం లేదా లక్ష్యపెట్టడం. ‘వారి మాట వినలేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘విధేయత చూపలేదు’ అని అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲלֵהֶם
  choice: వారి
  rationale: సందర్భంలో ఇది మోషే, అహరోనులను సూచించినా, మూలం సర్వనామాన్నే ఉపయోగిస్తుంది; అందువల్ల పేర్లను చేర్చలేదు.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל־מֹשֶׁה
  choice: యాహ్వే మోషేతో చెప్పినట్లే
  rationale: ముందుగా పలికిన యాహ్వే మాట నెరవేరిన అనుసరణ భావాన్ని ‘చెప్పినట్లే’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడటంలో దేవుని కార్యసాధకత్వం
  choice: యాహ్వే ఫరో హృదయాన్ని కఠినపరిచాడు
  alternative: యాహ్వే ఫరో హృదయాన్ని దృఢపరిచాడు / బలపరిచాడు
  rationale: హీబ్రూ వాక్యంలో యాహ్వే కర్తగా, ఫరో హృదయం ప్రత్యక్ష కర్మగా ఉన్నాయి. అందువల్ల దేవుడు కేవలం అనుమతించాడనే భావంగా మార్చకుండా ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలిపాం. అదే సమయంలో חזק యొక్క మరింత అక్షరార్థమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడాం. దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం. మూలంలోని సర్వనామాన్ని పేర్లతో విస్తరించలేదు; దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్నీ హృదయ రూపకాన్నీ యథాతథంగా కాపాడాం.
