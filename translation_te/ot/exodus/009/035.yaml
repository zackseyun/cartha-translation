  edition: WLC
  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: te
  text: ఫరో హృదయం కఠినమైంది[a], మరియు అతడు ఇశ్రాయేలు కుమారులను[b] వెళ్లనివ్వలేదు; యెహోవా మోషే ద్వారా[c] చెప్పినట్లుగానే జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఫరో హృదయం మొండిగా మారింది.’ హీబ్రూ క్రియకు ‘బలపడింది’ లేదా ‘దృఢమైంది’ అనే భావమూ ఉంది; ఈ సందర్భంలో అది మొండి ప్రతిఘటనను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: అంటే, ‘ఇశ్రాయేలీయులను’ లేదా సాంప్రదాయంగా ‘ఇశ్రాయేలు సంతానాన్ని’; హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులను.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘మోషే చేతి ద్వారా’; ఇది ‘మోషే ద్వారా’ అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: కఠినమైంది
  rationale: חזק అనే క్రియకు ‘బలపడింది/దృఢమైంది’ అనే ప్రాథమిక భావం ఉంది; ఇక్కడ ఫరో మొండితనంతో ప్రతిఘటించడాన్ని సూచిస్తున్నందున ‘కఠినమైంది’ సహజంగా ఆ భావాన్ని అందిస్తుంది. కర్త ఎవరో ఈ క్రియారూపం స్పష్టంగా చెప్పదు.
- source_word: לֵב פַּרְעֹה
  choice: ఫరో హృదయం
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్యసంబంధ రూపంలో ఉంచి, అంతరంగ సంకల్పం మరియు వైఖరిపై ఉన్న దృష్టిని నిలుపుతుంది.
- source_word: שִׁלַּח
  choice: వెళ్లనివ్వలేదు
  rationale: నిర్గమకాండ సందర్భంలో ఈ క్రియ ఇశ్రాయేలీయులు బయలుదేరేందుకు ఫరో అనుమతించడాన్ని సూచిస్తుంది; ‘వెళ్లనివ్వలేదు’ ఆధునిక తెలుగులో సహజమైన సందర్భోచిత ప్రయోగం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులను
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఇది సమూహంగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: చెప్పినట్లుగానే
  rationale: ఇంతకు ముందు పలికిన యెహోవా మాటకు సంఘటన సరిగ్గా అనుగుణంగా జరిగిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; ఇది సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని తెలిపే హీబ్రూ నుడికారం కాబట్టి సహజ తెలుగులో ‘మోషే ద్వారా’ అని అనువదించబడింది.
theological_decisions:
- issue: ఫరో హృదయం కఠినపడటంలో కర్తృత్వం
  choice: ఫరో హృదయం కఠినమైంది
  alternative: ఫరో తన హృదయాన్ని కఠినపరచుకున్నాడు / యెహోవా ఫరో హృదయాన్ని కఠినపరిచాడు
  rationale: ఈ వాక్యంలోని హీబ్రూ రూపం ఫరో హృదయం బలపడిందని లేదా కఠినమైందని చెబుతుంది; ఫరోనే దాన్ని కఠినపరచుకున్నాడని గానీ, యెహోవా నేరుగా అలా చేశాడని గానీ ఈ ఉపవాక్యం స్పష్టంగా పేర్కొనదు. అందువల్ల కథనంలోని కర్తృత్వ సంబంధమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘అలా’ ముందటి సంఘటనకు ఫలిత సంబంధాన్ని కలుపుతుంది. మూలంలోని చివరి ఉపవాక్యాన్ని సహజ తెలుగు క్రమంలో ముందుకు తెచ్చినా భావసంబంధం మారలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
