  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֔ה וְ/הִנֵּ֗ה לֹא מֵ֛ת מִ/מִּקְנֵ֥ה יִשְׂרָאֵ֖ל עַד אֶחָ֑ד וַ/יִּכְבַּד֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: te
  text: ఫరో పంపి విచారింపజేశాడు; ఇదిగో, ఇశ్రాయేలీయుల పశుసంపదలో ఒక్కటి కూడా చనిపోలేదు. అయినా ఫరో హృదయం మొండిబడింది[a]; అతడు ప్రజలను వెళ్లనివ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఫరో హృదయం భారమైంది”; ఇది అతడు మొండిగా, స్పందించకుండా ఉండడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపి విచారింపజేశాడు
  rationale: שׁלח యొక్క ప్రాథమిక అర్థం ‘పంపాడు.’ అయితే ఎవరిని, ఎందుకు పంపాడో హెబ్రీ పాఠ్యంలో విడిచిపెట్టబడింది; సందర్భం అతడు విషయం నిజమో కాదో తెలుసుకోవడానికి పంపాడని సూచిస్తుంది. తెలుగులో కేవలం ‘పంపాడు’ అనడం అసహజంగా ఉండటంతో, అంతర్భావిత కార్యాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే విచారణలో బయటపడిన ఆశ్చర్యకరమైన ఫలితంపై పాఠకుని దృష్టిని నిలిపే కథన సూచకం; ‘ఇదిగో’ దాని సజీవతను నిలుపుతుంది.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: ఇశ్రాయేలీయుల పశుసంపదలో ఒక్కటి కూడా చనిపోలేదు
  rationale: עַד אֶחָד ఇక్కడ ‘ఒక్కటి కూడా కాదు’ అనే బలమైన భావాన్ని ఇస్తుంది. מִקְנֶה విస్తృతమైన పశుసంపదను సూచిస్తుంది, కేవలం పశువులను మాత్రమే కాదు.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: ఫరో హృదయం మొండిగానే ఉండిపోయింది
  rationale: అక్షరార్థంగా ‘ఫరో హృదయం భారమైంది.’ సందర్భంలో ఇది స్పందించని మొండితనాన్ని సూచించే నుడికారం. క్రియకు బాహ్య కర్తను చేర్చకుండా, కొనసాగిన స్థితిని సహజ తెలుగులో తెలిపాం.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: అతడు ప్రజలను వెళ్లనివ్వలేదు
  rationale: ఈ నిర్గమకాండ సందర్భంలో שׁלח ప్రజలను విడుదల చేయడం లేదా వెళ్లనివ్వడం అనే నుడికారార్థాన్ని కలిగి ఉంది.
theological_decisions:
- issue: ఫరో హృదయపు మొండితనంలో కర్తృత్వం
  choice: ఫరో హృదయం మొండిగానే ఉండిపోయింది
  alternative: ఫరో తన హృదయాన్ని కఠినపరచుకున్నాడు / ఫరో హృదయం కఠినపరచబడింది
  rationale: హెబ్రీ వాక్యంలో ‘ఫరో హృదయం’ కర్తగా ఉండి భారమైన స్థితిని పొందినట్లు చెబుతుంది; దేవుడో ఫరోయో దానిని కఠినపరిచాడని ఈ వాక్యం స్పష్టంగా చెప్పదు. అందువల్ల మానవ లేదా దైవ కర్తృత్వాన్ని అనువాదంలో అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘పశుసంపద’ మూలపదం యొక్క విస్తృత పరిధిని నిలుపుతుంది. ‘మనుషులను పంపి విచారింపజేశాడు’ సందర్భంలో అంతర్భావితమైన విచారణను సహజ తెలుగులో స్పష్టం చేస్తుంది; హృదయం కఠినపడటానికి ఎవరు కారణమో మాత్రం నిర్ణయించదు.
