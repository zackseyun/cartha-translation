    issue: ‘మనుషులను’ is explicitly supplied in the opening clause.
    rationale: וַיִּשְׁלַח literally says ‘he sent’ and leaves the object unstated. The context supports an inquiry, but explicitly naming ‘men’ goes beyond the source unnecessarily.
  - severity: medium
    issue: ‘మొండిగానే ఉండిపోయింది’ overstates the verbal aspect.
    rationale: וַיִּכְבַּד describes Pharaoh’s heart becoming heavy/stubborn. ‘ఉండిపోయింది’ suggests continued persistence, while ‘మొండిబడింది’ retains the inceptive change and leaves agency unspecified.
