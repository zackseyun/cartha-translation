- from: ఫరో మనుషులను పంపి విచారింపజేశాడు; ఇదిగో, ఇశ్రాయేలీయుల పశుసంపదలో ఒక్కటి కూడా చనిపోలేదు. అయినా ఫరో హృదయం మొండిగానే ఉండిపోయింది[a]; అతడు ప్రజలను వెళ్లనివ్వలేదు.
  to: ఫరో పంపి విచారింపజేశాడు; ఇదిగో, ఇశ్రాయేలీయుల పశుసంపదలో ఒక్కటి కూడా చనిపోలేదు. అయినా ఫరో హృదయం మొండిబడింది[a]; అతడు ప్రజలను వెళ్లనివ్వలేదు.
  rationale: The revision removes the unnecessary explicit object ‘మనుషులను’ while retaining the contextually implied inquiry, and changes the heart clause to an inceptive Telugu idiom that reflects the Hebrew ‘became heavy’ without assigning divine or human agency or adding persistence beyond the verse.
