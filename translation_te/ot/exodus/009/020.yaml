  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: te
  text: ఫరో సేవకుల్లో యాహ్వే మాటకు భయపడినవాడు తన సేవకులను, తన పశువులను త్వరగా ఇళ్లలోకి చేర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన సేవకులను, తన పశువులను పారిపోయేలా చేశాడు”; అంటే, వారిని త్వరగా ఆశ్రయానికి చేర్చాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: భయపడినవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం నామవాచకంగా వాడబడి, ఫరో సేవకుల్లో ఆ మాటకు భయపడిన వ్యక్తిని లేదా అలాంటి ప్రతి వ్యక్తిని సూచిస్తుంది. తెలుగు ఏకవచన సాధారణ ప్రయోగం ఈ వర్గార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా మాట
  rationale: דָּבָר ఇక్కడ దేవుడు ప్రకటించిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘హెచ్చరిక’ అనడం సందర్భానుకూలమైనా, మూలంలోని విస్తృతమైన ‘మాట’ భావాన్ని కుదిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: ఫరో సేవకుల్లో
  rationale: מִן ఇక్కడ సమూహంలోని కొందరిని సూచించే విభాగార్థక ప్రయోగం; ‘సేవకుల్లో’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הֵנִיס
  choice: త్వరగా తరలించాడు
  rationale: נוּס హిఫిల్ రూపం అక్షరార్థంగా ‘పారిపోయేలా చేశాడు’ అని అర్థం. వడగండ్లకు ముందే మనుషులను, పశువులను ఆశ్రయంలోకి చేర్చిన సందర్భంలో ‘త్వరగా తరలించాడు’ చర్యలోని ఆత్రుతను సహజంగా తెలియజేస్తుంది; మూలంలోని బలమైన causative భావాన్ని పాదటిప్పణిలో చూపించాం.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: עֶבֶד దాసుడు లేదా సేవకుడు అనే రెండు భావాలు కలిగి ఉండవచ్చు. ఇక్కడ ఫరో అధికారి ఆధీనంలోని ఇంటివారిని సూచించే సందర్భంలో ‘సేవకులు’ సహజమైనది; యాజమాన్య సూచనను ‘తన’తో నిలిపాం.
- source_word: מִקְנֵהוּ
  choice: తన పశువులను
  rationale: מִקְנֶה పెంపుడు ఆస్తి జంతువులను సమగ్రంగా సూచిస్తుంది. ‘పశువులు’ ఆధునిక తెలుగులో విస్తృతమైన, సందర్భోచిత పదం.
- source_word: אֶל הַבָּתִּים
  choice: ఇళ్లలోకి
  rationale: אֶל కదలిక దిశను, బహువచన הַבָּתִּים ఆశ్రయ భవనాలను సూచిస్తాయి. ‘ఇళ్లలోకి’ గమ్యస్థానంలో ప్రవేశాన్ని, బహువచనాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా పేరుగా నిలిపాం; తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: ‘యెహోవా మాటకు భయపడడం’ అనే భావం
  choice: మూలంలోని భయపడడం అనే పదాన్ని యథాతథంగా నిలిపాం
  alternative: యెహోవా హెచ్చరికను గౌరవించినవాడు / నమ్మినవాడు
  rationale: ‘గౌరవించాడు’ లేదా ‘నమ్మాడు’ అనేవి సందర్భార్థాన్ని వివరించగలిగినా, יראలోని భయం, భక్తి, గంభీరంగా పరిగణించడం మధ్య ఉన్న భావవిస్తృతిని ముందుగానే ఒకే అర్థానికి కుదించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘ఫరో సేవకుల్లో’ అనే సంక్షిప్త రూపం partitive భావాన్ని స్పష్టంగా ఇస్తుంది. ‘త్వరగా తరలించాడు’ సందర్భాన్ని సహజంగా అందిస్తుండగా, హీబ్రూ causative క్రియ యొక్క అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
