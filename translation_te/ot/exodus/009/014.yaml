  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: te
  text: ఎందుకంటే, ఈసారి నేను నా సమస్త విపత్తులను నీ హృదయంపైకి[a], నీ సేవకులపైకి, నీ ప్రజలపైకి పంపుతున్నాను; భూమి అంతటిలో[b] నాకు సాటిగా ఎవరూ లేరని నీవు తెలుసుకునేలా చేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ హృదయానికి.’ హీబ్రూలోని ఈ వ్యక్తీకరణ విపత్తులు ఫరో అంతరంగాన్నీ, అతనినీ లక్ష్యంగా చేసుకున్నాయని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశమంతటిలో.’ హీబ్రూ పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు, ఫరోను ఎందుకు నిలిచి ఉండనిచ్చాడనే వివరణకు ఈ కారణసూచక పదం అనుసంధానం చేస్తుంది.
- source_word: בַּפַּעַם הַזֹּאת
  choice: ఈసారి
  rationale: ప్రస్తుత కార్యచక్రాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: שֹׁלֵחַ
  choice: పంపుతున్నాను
  rationale: హీబ్రూ కృదంతం సందర్భంలో సమీపిస్తున్న లేదా మొదలవుతున్న చర్యను సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל מַגֵּפֹתַי
  choice: నా తెగుళ్లన్నిటినీ
  rationale: מַגֵּפָה దెబ్బ లేదా తీర్పురూపమైన తెగులును సూచిస్తుంది; నిర్గమకాండ సందర్భంలో ‘తెగుళ్లు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶל לִבְּךָ
  choice: నీ హృదయానికి
  rationale: అక్షరార్థమైన ‘నీ హృదయానికి’ అనే రూపాన్ని నిలుపుతూ, ఫరో అంతరంగాన్నే లక్ష్యంగా చేసుకున్న తీర్పు అనే భావసందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: וּבַעֲבָדֶיךָ
  choice: నీ సేవకుల మీదికి
  rationale: ఇక్కడ עֶבֶד ఫరో ఆస్థాన సేవకులు లేదా అధికారులు అనే భావంలో ఉంది; ‘బానిసలు’ అని అనువదించడం సందర్భాన్ని తప్పుగా సూచిస్తుంది.
- source_word: וּבְעַמֶּךָ
  choice: నీ ప్రజల మీదికి
  rationale: ఫరో ఆధీనంలోని ఐగుప్తీయ ప్రజలను సూచిస్తుంది; సమాంతర నిర్మాణాన్ని తెలుగులో స్పష్టంగా ఉంచింది.
- source_word: בַּעֲבוּר תֵּדַע
  choice: నీవు తెలుసుకోవడానికే
  rationale: ఉద్దేశాన్ని తెలియజేసే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సాధారణ భవిష్యత్తుగా అతిశయింపదు.
- source_word: אֵין כָּמֹנִי
  choice: నాలాంటివాడు ఎవరూ లేరు
  rationale: సాటిలేనితనాన్ని తెలిపే హీబ్రూ నుడికారాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమి అంతటిలో
  rationale: אֶרֶץ ‘దేశం’ లేదా ‘భూమి’ అని అర్థమవగలిగినా, ఇక్కడ యెహోవా సాటిలేనితన ప్రకటన విశ్వవ్యాప్త పరిధిని సూచిస్తుంది.
theological_decisions:
- issue: దేవుని సాటిలేనితనం యొక్క పరిధి
  choice: భూమి అంతటిలో
  alternative: దేశమంతటిలో
  rationale: తెగుళ్ల కథనంలో ప్రకటన ఐగుప్తుకు మాత్రమే పరిమితం కాకుండా యెహోవా విశ్వవ్యాప్త సాటిలేనితనాన్ని నొక్కిచెబుతుంది; అయినా హీబ్రూ పదానికి ఉన్న స్థానిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ‘నీ హృదయానికి’ అనే మాట భావం
  choice: హృదయం అనే రూపకాన్ని యథాతథంగా నిలుపుట
  alternative: నీ మీదికే / నిన్నే లక్ష్యంగా
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘హృదయానికి’ అంటుంది. ఫరో హృదయ కాఠిన్యంతో ఉన్న కథన ఉద్రిక్తతను నిలుపుతూ, దానిని కేవలం ‘నీ మీదికి’ అని వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘హృదయం’ అనే మూల రూపకాన్ని, ‘భూమి/దేశం’ అనే నిజమైన అర్థసంభావ్యతను నిలిపి ఉంచింది. ప్రధాన వాక్యంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
