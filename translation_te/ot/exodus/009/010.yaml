  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ אֶת פִּ֣יחַ הַ/כִּבְשָׁ֗ן וַ/יַּֽעַמְדוּ֙ לִ/פְנֵ֣י פַרְעֹ֔ה וַ/יִּזְרֹ֥ק אֹת֛/וֹ מֹשֶׁ֖ה הַ/שָּׁמָ֑יְמָ/ה וַ/יְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: te
  text: అప్పుడు వారు కొలిమిలోని మసిని తీసుకొని ఫరో ఎదుట నిలబడ్డారు. మోషే దానిని ఆకాశం వైపు విసిరాడు. దానివల్ల మనుషులమీదా జంతువులమీదా పొక్కులతో కూడిన కురుపులు ఉబికి వచ్చాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మనిషిమీదా జంతువుమీదా’ అని సమష్టి ఏకవచన రూపాలు ఉన్నాయి; భావం మనుషులనూ జంతువులనూ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: మసి
  rationale: ఈ పదం సాధారణ బూడిదకన్నా కొలిమిలో ఏర్పడే సన్నని నల్లటి పొడిని సూచిస్తుంది; అందువల్ల ‘మసి’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: הַכִּבְשָׁן
  choice: కొలిమి
  rationale: ఇది అధిక వేడితో పనిచేసే kiln/furnace‌ను సూచిస్తుంది; సందర్భంలో ‘కొలిమి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: לִפְנֵי פַרְעֹה
  choice: ఫరో ఎదుట
  rationale: ఫరో సమక్షంలో నిలబడటాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: మోషే దానిని ... విసిరాడు
  rationale: ఏకవచన కర్మప్రత్యయం సమష్టి పదార్థంగా ఉన్న మసిని తిరిగి సూచిస్తుంది; క్రియను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: הַשָּׁמָיְמָה
  choice: ఆకాశం వైపు
  rationale: దిశార్థక రూపం పైకి, ఆకాశం వైపు జరిగిన కదలికను సూచిస్తుంది; అనవసరమైన ఆధ్యాత్మిక భావాన్ని చేర్చదు.
- source_word: שְׁחִין
  choice: కురుపులు
  rationale: వాచిన చర్మంపై వచ్చే boils/sores భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: אֲבַעְבֻּעֹת
  choice: పొక్కులతో కూడిన
  rationale: ఈ పదం బొబ్బలు లేదా పొక్కులను సూచిస్తుంది; שְׁחִין‌తో దాని సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: פֹּרֵחַ
  choice: వ్యాపించింది
  rationale: చర్మవ్యాధి ఉబికి బయటపడటం లేదా విస్తరించటం అనే క్రియాశీల భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: בָּאָדָם
  choice: మనుషులకు
  rationale: ఇక్కడ אָדָם పురుషులను మాత్రమే కాక మానవులను సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘మనుషులు’ ఆ సమష్టి భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וּבַבְּהֵמָה
  choice: జంతువులకు
  rationale: אָדָם‌తో వ్యతిరేక జంటగా జంతుజాతిని సమష్టిగా సూచిస్తుంది; ‘జంతువులు’ సహజమైన ఆధునిక సమానార్థకం.
theological_decisions:
- issue: אָדָם అనే సమష్టి ఏకవచనాన్ని ఎలా అనువదించాలి
  choice: మనుషులు
  alternative: మనిషి
  rationale: ఈ సందర్భంలో వ్యాధి పురుషులకు మాత్రమే కాక మానవులకు సాధారణంగా సోకిందని హీబ్రూ సమష్టి ప్రయోగం సూచిస్తుంది. ‘మనుషులు’ ఆ పరిధిని అపార్థం లేకుండా తెలియజేస్తుంది.
- issue: הַשָּׁמָיְמָה లోని שָׁמַיִם భావం
  choice: ఆకాశం వైపు
  alternative: పరలోకం వైపు
  rationale: ఇక్కడ ప్రధానంగా భౌతిక దిశ సూచించబడింది; ‘పరలోకం’ అనడం మూలంలో తప్పనిసరిగా లేని ధార్మిక భావాన్ని జోడించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను చిన్న, స్పష్టమైన వాక్యాలుగా ఇచ్చి, ‘పొక్కులతో కూడిన కురుపులు’ అనే వ్యాధి చిత్రణను నిలుపుకున్నాం.
