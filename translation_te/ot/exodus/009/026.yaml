lexical_decisions:
- source_word: רַק
  choice: మాత్రమే
  rationale: వాక్యంలోని పరిమితిని, మినహాయింపును స్పష్టంగా తెలియజేస్తుంది; తెలుగులో సహజంగా ఉండేందుకు సంబంధిత ప్రాంతపదబంధం తరువాత ఉంచబడింది.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: గోషెను దేశంలో
  rationale: పేరు గల ప్రాంతాన్ని సూచించే אֶרֶץ‌కు ‘దేశం’ సహజమైన సమానం; గోషెను స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר שָׁם
  choice: ఉన్న
  rationale: ఇశ్రాయేలు కుమారులు అక్కడ నివసించిన/ఉన్న ప్రాంతాన్ని సూచించే సంబంధవాచక స్థలప్రయోగాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని అక్షరార్థ కుటుంబవ్యక్తీకరణను నిలుపుతుంది; సామూహిక అర్థమైన ‘ఇశ్రాయేలీయులు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- source_word: לֹא הָיָה בָּרָד
  choice: వడగండ్లు పడలేదు
  rationale: వడగండ్లు అక్కడ లేకపోవడాన్ని ఆధునిక తెలుగులో సహజమైన వాతావరణ క్రియాప్రయోగంతో తెలియజేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל పదబంధం అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: హీబ్రూ మూలంలోని పురుషలింగ కుటుంబరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సహజ సామూహిక అర్థాలను పాదసూచికలో సూచించడం ద్వారా మూలరూపం మరియు సందర్భార్థం రెండూ కాపాడబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘వడగండ్లు పడలేదు’ అనేది అక్షరార్థ అస్తిత్వప్రయోగం కంటే తెలుగులో సహజంగా వినిపిస్తూ అదే భావాన్ని అందిస్తుంది.
