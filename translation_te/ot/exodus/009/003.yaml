id: EXO.9.3
reference: Exodus 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: te
  text: ఇదిగో, పొలంలో ఉన్న నీ పశుసంపదపై—గుర్రాలపై, గాడిదలపై, ఒంటెలపై, పశువులపై, గొర్రెలు మేకలపై—యాహ్వే చేయి అత్యంత తీవ్రమైన తెగులుగా పడబోతోంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంటువ్యాధి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: రాబోయే తీర్పు ప్రకటనపై తక్షణ శ్రద్ధను ఆకర్షించే హీబ్రూ సూచనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יַד יְהוָה
  choice: యాహ్వే చెయ్యి
  rationale: దేవుని శక్తి, తీర్పును సూచించే హీబ్రూ రూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది; ‘చెయ్యి పడబోతోంది’ తెలుగు వాడుకలో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: הוֹיָה
  choice: పడబోతోంది
  rationale: సందర్భంలోని సమీప భవిష్యత్తు తీర్పును వ్యక్తం చేస్తుంది; ‘చెయ్యి ... మీద ఉండబోతోంది’ కంటే తెలుగులో సహజంగా ఉండి, దాడి చేయబోయే దైవశక్తి భావాన్ని నిలుపుతుంది.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలో ఉన్న నీ పశుసంపద మీద
  rationale: מִקְנֶה అనే విస్తృత పదాన్ని కేవలం ఆవులకు పరిమితం చేయకుండా, బయట పొలంలో ఉన్న పెంపుడు జంతువుల సమూహంగా తెలియజేస్తుంది.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: గుర్రాల మీద, గాడిదల మీద, ఒంటెల మీద, పశువుల మీద, గొర్రెలు మేకల మీద
  rationale: జంతువుల వరుసను నిలుపుతుంది. בָּקָרను పెద్ద పశువులుగా ‘పశువులు’ అని, צֹאןను గొర్రెలు-మేకలను కలుపుకునే చిన్న పశువుల సమూహంగా స్పష్టంగా అనువదించింది.
- source_word: דֶּבֶר
  choice: అంటువ్యాధి
  rationale: పశువులను ప్రాణాంతకంగా ప్రభావితం చేసే వ్యాపించే వ్యాధిని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘తెగులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: כָּבֵד מְאֹד
  choice: అత్యంత తీవ్రమైన
  rationale: ‘చాలా భారమైన’ అనే అక్షరార్థం కంటే, వ్యాధి తీవ్రతను సహజమైన తెలుగులో సరిగ్గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ఉంచి, సాధారణంగా అంగీకరించబడిన ‘Yahweh’ ఉచ్చారణను తెలుగులో ప్రతిబింబిస్తుంది.
- issue: ‘యాహ్వే చెయ్యి’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: యాహ్వే శిక్ష / యాహ్వే శక్తి
  rationale: ఇది దైవశక్తి మరియు తీర్పు రెండింటినీ సూచించగల హీబ్రూ రూపకం. ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ దైవహస్త రూపకాన్ని నిలుపుతూ, జంతువుల జాబితాను సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చాం.
