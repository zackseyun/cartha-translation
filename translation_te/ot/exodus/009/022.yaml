id: EXO.9.22
reference: Exodus 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీ చేతిని ఆకాశం[a] వైపు చాపు; ఈజిప్టు దేశమంతటా మనుషుల[b] మీదా, పశువుల మీదా, ఈజిప్టు దేశంలోని పొలాల ప్రతి మొక్క మీదా వడగండ్లు కురిసేలా చేయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాలు.” హీబ్రూ పదానికి “ఆకాశం” లేదా “ఆకాశాలు” అనే అర్థాలు రావచ్చు; ఇక్కడ వడగండ్లు వచ్చే కనిపించే ఆకాశమే ఉద్దేశం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనుషులు” అనే పదం పశువులకు భిన్నంగా మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణ ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: נְטֵה אֶת יָדְךָ
  choice: నీ చెయ్యి చాపు
  rationale: ఆజ్ఞార్థక క్రియను, సాధారణ అర్థమైన ‘చెయ్యి’ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הַשָּׁמַיִם
  choice: ఆకాశం వైపు
  rationale: ఇక్కడ దిశను, వడగండ్లు వచ్చే కనిపించే ఆకాశాన్ని సూచిస్తుంది; ‘పరలోకం’ అనే అనవసర భావాన్ని చేర్చదు.
- source_word: וִיהִי בָרָד
  choice: అప్పుడు … వడగండ్లు కురుస్తాయి
  rationale: ముందున్న ఆజ్ఞ ఫలితంగా వడగండ్లు సంభవించడాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, హీబ్రూ రూపంలోని ఫలిత/సంభావన భావాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఈజిప్టు దేశమంతటా
  rationale: వడగండ్ల విస్తృతి దేశమంతటినీ ఆవరించేదని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאָדָם
  choice: మనుషులు
  rationale: ఇక్కడ ఏ ఒక్క పురుషుణ్ణి కాక, జంతువులకు భిన్నంగా మానవులను సామూహికంగా సూచిస్తుంది.
- source_word: הַבְּהֵמָה
  choice: పశువులు
  rationale: ఈ ఉపద్రవ సందర్భంలో ప్రధానంగా పెంపుడు జంతువులను సూచించే పదానికి సహజమైన తెలుగు సమానం.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: పొలాల్లో ఉన్న ప్రతి మొక్క
  rationale: עֵשֶׂב యొక్క గడ్డి, పచ్చిక, సాగు మొక్కలు వంటి విస్తృత భావాన్ని ‘మొక్క’ సహజంగా కలిగి ఉంటుంది; ‘పొలం’ అనే స్థలసూచనను కూడా నిలుపుతుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఈజిప్టు దేశంలోని
  rationale: మూలంలో చివర మళ్లీ వచ్చిన దేశసూచనను వదలకుండా, దాని పరిధి-ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా మూలరూపానికి సమీపమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: הָאָדָם యొక్క సామూహిక అర్థం
  choice: మనుషులు
  alternative: మనిషి
  rationale: ఏకవచన హీబ్రూ పదానికి ఇక్కడ ప్రతినిధి/సామూహిక భావం ఉంది; పశువులతో ఉన్న వ్యత్యాసాన్ని కాపాడుతూ తెలుగులో అపార్థం రాకుండా ‘మనుషులు’ అని ఇచ్చింది.
- issue: וִיהִי యొక్క ఆజ్ఞానంతర ఫలిత భావం
  choice: అప్పుడు … కురుస్తాయి
  alternative: వడగండ్లు కురవాలి / వడగండ్లు కురిసేలా
  rationale: ఈ రూపాన్ని స్వతంత్ర ఆజ్ఞగా మాత్రమే గట్టిగా నిర్ణయించకుండా, మోషే చర్యను అనుసరించే ఫలితంగా సహజంగా వ్యక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ఈజిప్టు దేశ ప్రస్తావన పునరుక్తిని నిలిపి, వాక్యాన్ని తెలుగులో సులభంగా చదవడానికి విరామచిహ్నాలతో క్రమబద్ధం చేసింది.
