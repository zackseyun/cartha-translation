  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఫరో దగ్గరికి వెళ్లి అతనితో ఇలా చెప్పు: ‘హెబ్రీయుల దేవుడైన యెహోవా ఇలా అంటున్నాడు: నన్ను సేవించడానికి నా ప్రజలను వెళ్లనివ్వు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వెళ్లి
  rationale: హీబ్రూ పదబద్ధంగా ‘ఫరో వద్దకు రా/లోపలికి వెళ్లు’ అనే భావం ఇస్తుంది; ఆధునిక తెలుగులో సందర్భానుగుణంగా సహజమైన ఆజ్ఞగా ‘ఫరో దగ్గరికి వెళ్లి’ అని ఇచ్చాం.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: అతనితో ఇలా చెప్పు
  rationale: ‘అతనితో మాట్లాడు’ అనే మూలార్థాన్ని, తరువాత వచ్చే ప్రత్యక్ష సందేశంతో సహజంగా అనుసంధానించేందుకు ఇలా అనువదించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను సాధారణ బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: హెబ్రీయుల దేవుడు
  rationale: సంబంధార్థక హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: నా ప్రజలను వెళ్లనివ్వు
  rationale: ఇక్కడి piel ఆజ్ఞారూపం నిర్బంధం నుంచి పంపివేయడం లేదా విడుదల చేసి వెళ్లనివ్వడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְיַעַבְדֻנִי
  choice: నన్ను సేవించడానికి
  rationale: עבד ఆరాధనతో కూడిన సేవను సూచించగలదు; ‘సేవించు’ అనే పదం మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా పేరు రూపంలో ఉంచడం మూలభేదాన్ని కాపాడుతుంది; ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: עבד ను ఆరాధనగా లేదా సేవగా ఇవ్వడం
  choice: సేవించడానికి
  alternative: ఆరాధించడానికి
  rationale: ఈ క్రియకు సేవ మరియు ఆరాధన రెండింటి పరిధి ఉండగలదు. ‘సేవించడానికి’ అనేది విస్తృతమైన మూలార్థాన్ని నిలుపుతూ, భావాన్ని ఒక్క ఆచారపరమైన అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు ప్రవక్తీయ ప్రకటన శైలిని నిలుపుతూ రూపొందించబడింది. ప్రత్యక్ష ఉల్లేఖనాల పొరలను స్పష్టంగా చూపించాం.
