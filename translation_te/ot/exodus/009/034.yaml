revisions:
- from: అయితే వర్షం, వడగండ్లు, ఉరుములు[a] ఆగిపోయాయని ఫరో చూసినప్పుడు, అతడు మళ్లీ పాపం చేశాడు. అతడూ అతని సేవకులూ తమ హృదయాలను కఠినపరచుకున్నారు.
  to: అయితే వర్షం, వడగండ్లు, ఉరుములు[a] ఆగిపోయాయని ఫరో చూసినప్పుడు, అతడు పాపం చేస్తూనే ఉన్నాడు; తన హృదయాన్ని కఠినపరచుకున్నాడు—అతడూ అతని సేవకులూ.
  rationale: The revision preserves the Hebrew singular “his heart” while retaining the closing “he and his servants” in a compact, source-shaped Telugu construction. It therefore does not decide whether the final phrase expands the hardening action to the servants or functions as emphatic apposition. It also renders the repeated/continuing sense of “he continued to sin.”
