source:
  edition: WLC
  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: te
  text: అయితే వర్షం, వడగండ్లు, ఉరుములు[a] ఆగిపోయాయని ఫరో చూసినప్పుడు, అతడు పాపం చేస్తూనే ఉన్నాడు; తన హృదయాన్ని కఠినపరచుకున్నాడు—అతడూ అతని సేవకులూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘శబ్దాలు’ లేదా ‘స్వరాలు’; ఈ తుఫాను సందర్భంలో ఉరుములను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియకు కథన సందర్భంలో సహజమైన అర్థం ‘చూచుట’; ఇక్కడ పరిస్థితిని గమనించి గ్రహించడం కూడా ఈ తెలుగు ప్రయోగంలో సహజంగా ఇమిడుతుంది.
- source_word: כִּי חָדַל
  choice: ఆగిపోయాయని
  rationale: כִּי ఇక్కడ ఫరో చూసిన విషయాన్ని పరిచయం చేస్తుంది; חָדַל అంటే ‘ఆగిపోవడం/నిలిచిపోవడం.’ తెలుగు వాక్యనిర్మాణంలో రెండింటినీ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמָּטָר וְהַבָּרָד
  choice: వర్షం, వడగండ్లు
  rationale: తుఫాను సందర్భానికి సరిపోయే ప్రామాణిక, సాధారణ తెలుగు పదాలు.
- source_word: הַקֹּלֹת
  choice: ఉరుములు
  rationale: పదశః ‘స్వరాలు/శబ్దాలు’; అయితే ఈ తుఫాను సందర్భంలో ఉరుముల శబ్దాన్ని సూచిస్తుంది. మూలంలోని రూపకల్పనను పాదసూచికలో తెలియజేశారు.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: మళ్లీ పాపం చేశాడు
  rationale: יסף + క్రియార్థక రూపం ఇక్కడ చర్యను మళ్లీ చేయడాన్ని సూచిస్తుంది. ‘పాపం చేయడం కొనసాగించాడు’ కూడా సాధ్యమే; తుఫాను ఆగిన తరువాత తిరిగి పాపం చేశాడనే కథన క్రమాన్ని ‘మళ్లీ’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: తమ హృదయాలను కఠినపరచుకున్నారు
  rationale: כבד పదశః ‘భారీ చేయడం’; ఫరో కథనంలోని స్థిర ప్రయోగంలో మొండితనం లేదా స్పందనలేమిని సూచిస్తుంది. చివరి ‘అతడూ అతని సేవకులూ’ అనే బహువచన కర్తను తెలుగులో సహజంగా అనుసంధానిస్తూ బహువచనంగా ఇచ్చాం.
- source_word: הוּא וַעֲבָדָיו
  choice: అతడూ అతని సేవకులూ
  rationale: עבדים అనే పదానికి సేవకులు, దాసులు, రాజోద్యోగులు అనే అర్థాలు ఉండవచ్చు. రాజసభ సందర్భంలో ‘సేవకులు’ తటస్థమైన, విస్తృతమైన ఎంపిక; הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడూ’ నిలుపుతుంది.
- source_word: וַ
  choice: అయితే
  rationale: ప్రారంభ waw కథనాన్ని ముందుకు నడిపిస్తూ, ముందు ఫరో వ్యక్తం చేసిన పశ్చాత్తాపానికి విరుద్ధమైన పరిణామాన్ని సూచిస్తుంది; ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: హృదయాన్ని కఠినపరచడంలో కర్తృత్వం మరియు పరిధి
  choice: ఈ వాక్యంలో ఫరోతోపాటు అతని సేవకులు కూడా తమ హృదయాలను కఠినపరచుకున్నారని చివరి పదబంధాన్ని క్రియకు అనుసంధానించాం.
  alternative: ‘అతడూ అతని సేవకులూ’ అనే పదబంధాన్ని ఫరో చర్యను వివరించే అనుబంధ ఉద్ఘాటనగా తీసుకొని, ఏకవచన ‘తన హృదయాన్ని కఠినపరచుకున్నాడు’ అని అనువదించడం.
  rationale: హీబ్రూ వాక్యంలో ‘అతడు తన హృదయాన్ని కఠినపరచాడు’ అనే ఏకవచన నిర్మాణం తరువాత ‘అతడూ అతని సేవకులూ’ వస్తుంది. భావపరంగా చివరి పదబంధం కఠినత్వంలో సేవకుల భాగస్వామ్యాన్ని విస్తరించగలదు. తెలుగు సహజత్వం కోసం బహువచనంగా ఇచ్చినా, దైవిక-మానవ కర్తృత్వంపై ఈ వాక్యానికి మించిన సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీర కథన శైలి. ‘వడగండ్లు,’ ‘ఉరుములు,’ ‘కఠినపరచుకున్నారు’ వంటి స్థిరమైన పదాలను ఉపయోగించాం. మూలంలోని భావసందిగ్ధతను పాదసూచిక మరియు నిర్ణయ గమనికలో నిలిపాం.
