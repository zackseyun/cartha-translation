id: EXO.9.33
reference: Exodus 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: te
  text: మోషే ఫరో దగ్గరనుండి పట్టణం బయటికి వెళ్లి యాహ్వే వైపు తన చేతులను చాచాడు. అప్పుడు ఉరుములు[a], వడగండ్లు ఆగిపోయాయి; వర్షం ఇక నేలమీద కురవలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థం ‘స్వరాలు’ లేదా ‘శబ్దాలు’; ఈ తుఫాను సందర్భంలో అది ఉరుములను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వర్షం నేలపైకి కుమ్మరించబడలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: మోషే ఫరో దగ్గరనుంచి బయలుదేరి పట్టణం వెలుపలికి వెళ్లాడు
  rationale: מֵעִם denotes departure from Pharaoh’s presence, while אֶת הָעִיר in this motion context indicates going outside the city. The Telugu wording makes both stages of movement clear without making Pharaoh himself the point of origin.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: తన చేతులు చాపాడు
  rationale: The Hebrew literally pictures spreading out the palms and denotes a posture of prayer. ‘చేతులు చాపాడు’ is natural Telugu and retains the bodily image.
- source_word: אֶל יְהוָה
  choice: యాహ్వే వైపు
  rationale: אֶל conveys direction toward YHWH. ‘వైపు’ preserves that spatial and prayer-related direction, and ‘యాహ్వే’ represents the divine name rather than replacing it with a title.
- source_word: הַקֹּלוֹת
  choice: ఉరుములు
  rationale: Although the noun literally means ‘voices/sounds,’ in this storm context it refers to thunder. The contextual Telugu equivalent is ‘ఉరుములు.’
- source_word: וְהַבָּרָד
  choice: వడగండ్లు
  rationale: This is the ordinary modern Telugu term for hailstones and fits the plague context.
- source_word: וַיַּחְדְּלוּ
  choice: ఆగిపోయాయి
  rationale: The verb means to cease or stop. This wording is current, clear Telugu and naturally agrees with thunder and hail.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: వర్షం ఇక నేలమీద కురవలేదు
  rationale: The Hebrew describes rain as no longer being poured earthward. Telugu normally speaks of rain ‘falling/raining’; ‘ఇక’ appropriately conveys the contextual cessation while the footnote preserves the more literal passive image.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: The source directly uses the Tetragrammaton. Transliteration as ‘యాహ్వే’ preserves the personal covenant name and follows the source evidence without replacing it with a title or importing the traditional form ‘యెహోవా.’
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ప్రార్థనా భంగిమకు సంబంధించిన భౌతిక దృశ్యాన్ని నిలుపుతూ, వాతావరణ సంబంధ పదాలను సాధారణ పాఠకులకు సహజంగా ఉండేలా అనువదించాం. మూలంలో ఉన్న క్రమాన్ని చిన్న వాక్యాల ద్వారా స్పష్టంగా చూపించాం.
