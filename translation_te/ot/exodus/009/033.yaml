- from: మోషే ఫరో దగ్గరనుంచి బయలుదేరి పట్టణం వెలుపలికి వెళ్లాడు. అతడు యాహ్వే వైపు తన చేతులు చాపాడు. అప్పుడు ఉరుములు[a], వడగండ్లు ఆగిపోయాయి; వర్షం ఇక నేలమీద కురవలేదు[b].
