  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: te
  text: 'యాహ్వే ఒక సమయాన్ని నిర్ణయించి ఇలా అన్నాడు: “రేపు యాహ్వే ఈ దేశంలో ఈ కార్యాన్ని చేస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: నిర్ణయించి
  rationale: שׂוּם ఇక్కడ ఒక సమయాన్ని స్థిరపరచడం లేదా నిర్ణయించడం అనే భావంలో ఉంది. ‘నిర్ణయించి’ ఆధునిక తెలుగులో సహజంగా ఉండి, క్రియ యొక్క ఉద్దేశపూర్వకతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: מוֹעֵד
  choice: ఒక సమయాన్ని
  rationale: מוֹעֵד అనేది నిర్ణయించబడిన లేదా నియమించబడిన సమయాన్ని సూచిస్తుంది. తరువాత వచ్చే ‘రేపు’ ఆ సమయాన్ని స్పష్టం చేస్తుంది కాబట్టి ప్రధాన పాఠ్యంలో సహజమైన ‘ఒక సమయాన్ని’ వాడి, మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: నేరుగా చెప్పబడిన మాటలను పరిచయం చేసే హీబ్రూ కథన నిర్మాణాన్ని సహజమైన తెలుగు వాక్యాంత నిర్మాణంగా మార్చాం.
- source_word: מָחָר
  choice: రేపు
  rationale: కాలాన్ని నేరుగా సూచించే ఈ అవ్యయానికి ‘రేపు’ సరళమైన, ఖచ్చితమైన సమానం.
- source_word: יַעֲשֶׂה
  choice: చేస్తాడు
  rationale: עשה యొక్క విస్తృతమైన, సరళమైన భావాన్ని అతిగా వ్యాఖ్యానించకుండా ‘చేస్తాడు’గా నిలిపాం.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ కార్యాన్ని
  rationale: דָּבָר ఇక్కడ ముందుగా ప్రకటించిన దైవిక చర్యను సూచిస్తుంది. తెలుగులో ‘ఈ విషయం’ కంటే ‘ఈ కార్యం’ సందర్భానికి సహజంగా సరిపోతుంది; అయినా చర్య స్వరూపాన్ని అదనంగా నిర్వచించదు.
- source_word: בָּאָרֶץ
  choice: ఈ దేశంలో
  rationale: ఆ సందర్భంలో సూచించబడుతున్నది ఐగుప్తు దేశమే అయినా, మూలపాఠ్యంలో ‘ఐగుప్తు’ అని చేర్చలేదు. నిర్దిష్టతను చూపేందుకు ‘ఈ దేశంలో’ అని ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ; హీబ్రూ ఉచ్చారణను సూచించే ‘యాహ్వే’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి అనుగుణంగా తీర్చిదిద్దాం; మూలంలోని సంక్షిప్తతను కాపాడాం.
