  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: te
  text: నా ప్రజలను వెళ్లనివ్వకుండా, నీవు ఇంకా నా ప్రజలపై నిన్ను నీవు హెచ్చించుకుంటున్నావా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రజలపై గర్వంగా ప్రవర్తిస్తున్నావా?” లేదా, “నా ప్రజలకు వ్యతిరేకంగా నిన్ను నీవు పైకెత్తుకుంటున్నావా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: నీవు ఇంకా ... చేస్తున్నావా?
  rationale: עוֹד కొనసాగుతున్న స్థితిని సూచిస్తుంది; సందర్భంలోని నేరుగా ఉద్దేశించిన గద్దింపు తెలుగులో సహజమైన అలంకారప్రశ్నగా వ్యక్తమవుతుంది.
- source_word: מִסְתּוֹלֵל
  choice: నిన్ను నీవు హెచ్చించుకుంటున్నావా
  rationale: סלל ధాతువు యొక్క Hitpolel రూపంలోని ఆత్మనిర్దేశక భావాన్నీ, అహంకారంతో తనను పైకి ఎత్తుకునే సూక్ష్మార్థాన్నీ కాపాడుతుంది.
- source_word: בְּעַמִּי
  choice: నా ప్రజలపై
  rationale: ఇక్కడ ב విరోధం లేదా ఆధిపత్య భావాన్ని సూచిస్తుంది; ‘పై’ అనే ప్రయోగం ఫరో ప్రజల మీద తనను తాను హెచ్చించుకోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבִלְתִּי
  choice: వెళ్లనివ్వకుండా
  rationale: ప్రతికూల infinitival clause ఫరో అహంకారపూరిత చర్య ఎలా వ్యక్తమవుతోందో తెలుపుతుంది; తెలుగులో ‘-కుండా’ సహజంగా ఆ సంబంధాన్ని అందిస్తుంది.
- source_word: שַׁלְּחָם
  choice: వారిని వెళ్లనివ్వడం
  rationale: నిర్గమకాండ తెగుళ్ల వృత్తాంతంలో שלח Piel ఇశ్రాయేలీయులను బానిసత్వం నుంచి విడుదల చేయడాన్ని సూచించే స్థిరమైన సందర్భార్థం కలిగి ఉంది.
theological_decisions:
- issue: ‘నా ప్రజలు’ అనే దైవిక హక్కు భాష
  choice: ‘నా ప్రజలు’ అని యథాతథంగా నిలుపుట
  alternative: ‘ప్రజలు’ లేదా ‘ఇశ్రాయేలు’
  rationale: మొదటి పురుష ప్రత్యయం యెహోవా ఇశ్రాయేలుపై ప్రకటించే నిబంధన సంబంధమైన హక్కును, ఫరో వారిని ఎదిరించడం ద్వారా దేవునినే ఎదిరిస్తున్నాడనే ఉద్రిక్తతను నిలుపుతుంది.
- issue: మִסְתּוֹלֵל‌లోని అహంకారపూరిత ఆత్మోన్నతి
  choice: ‘నిన్ను నీవు హెచ్చించుకుంటున్నావా’
  alternative: ‘వ్యతిరేకిస్తున్నావా’
  rationale: కేవలం వ్యతిరేకతగా చదవకుండా, మూలంలోని reflexive self-exaltation భావాన్ని నిలుపుతుంది; అయితే పదంలోని విరోధ/ఆధిపత్య ఛాయను పాదటిప్పణిలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష గద్దింపు. ‘హెచ్చించుకుంటున్నావా’ మూలంలోని ఆత్మోన్నతి భావాన్ని కాపాడుతుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
