  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: te
  text: అది ఐగుప్తు దేశమంతటా సన్నని ధూళిగా మారుతుంది. ఐగుప్తు దేశమంతటా అది మనుషుల మీద[a], జంతువుల మీద బొబ్బలు పుట్టే కురుపులుగా[b] మారుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ఇక్కడ మనుషులందరినీ సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొక్కులు పొంగే కురుపులుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: సన్నని ధూళిగా మారుతుంది
  rationale: היה ఇక్కడ స్థితి మార్పును సూచిస్తుంది; אָבָק సూక్ష్మమైన ధూళి లేదా పొడి అనే భావాన్ని ఇస్తుంది.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటిమీద
  rationale: עַל సూచించే ప్రాదేశిక వ్యాప్తిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַל הָאָדָם וְעַל הַבְּהֵמָה
  choice: మనుషులమీద, జంతువులమీద
  rationale: אָדָם ఇక్కడ మానవజాతిని సమష్టిగా సూచిస్తూ בְּהֵמָהతో వ్యత్యాసంగా ఉంది; ఆధునిక తెలుగులో ‘మనుషులు—జంతువులు’ అనే జత స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לִשְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: పొక్కులు పొంగే కురుపులుగా
  rationale: שְׁחִין అనే చర్మవ్యాధిని ‘కురుపులు’గా, פֹּרֵחַ సూచించే చెలరేగి బయటపడడాన్ని ‘పొంగే’గా, אֲבַעְבֻּעֹת అనే ఉబ్బిన పొక్కులను ‘పొక్కులు’గా వ్యక్తం చేసి మూడు భావాంశాలనూ నిలిపింది.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: బాధ దేశమంతటా వ్యాపించే పంపిణీ భావాన్ని ‘దేశమంతటా’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אָדָם అనే సమష్టి మానవ సూచనను అనువదించడం
  choice: మనుషులు
  alternative: మానవజాతి
  rationale: ఇక్కడ పదం ఒక పురుషుణ్ణి మాత్రమే కాక మనుషులందరినీ సమష్టిగా సూచిస్తుంది. ‘మనుషులు’ అనే రూపం జంతువులతో ఉన్న వ్యత్యాసాన్ని సహజంగా నిలుపుతూ మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండు ఫలిత-వాక్యాల నిర్మాణం, దేశవ్యాప్తి పునరుక్తి, అలాగే కురుపులు చెలరేగి పొక్కులు ఏర్పడే భావాంశాలు నిలుపబడ్డాయి.
