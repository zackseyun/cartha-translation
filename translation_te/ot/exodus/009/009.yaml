revisions:
- from: అది ఐగుప్తు దేశమంతటిమీద సన్నని ధూళిగా మారుతుంది. ఐగుప్తు దేశమంతటా అది మనుషులమీద[a], జంతువులమీద పొక్కులు పొంగే కురుపులుగా[b] మారుతుంది.
  to: అది ఐగుప్తు దేశమంతటా సన్నని ధూళిగా మారుతుంది. ఐగుప్తు దేశమంతటా అది మనుషుల మీద[a], జంతువుల మీద బొబ్బలు పుట్టే కురుపులుగా[b] మారుతుంది.
