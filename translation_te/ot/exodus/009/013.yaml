id: EXO.9.13
reference: Exodus 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఉదయాన్నే లేచి ఫరో ఎదుట నిలబడి, అతనితో ఇలా చెప్పు: ‘హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: వారు నన్ను సేవించేందుకు నా ప్రజలను వెళ్లనివ్వు.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఆరాధించడానికి.” హీబ్రూ క్రియ దేవునికి చేసే సేవను సూచిస్తుంది; అందులో ఆరాధన కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఆధునిక లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: ఉదయాన్నే లేచి
  rationale: హిఫీల్ ఆజ్ఞారూపంలోని ‘పొద్దున్నే లేచు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రెండు హీబ్రూ అంశాల కలయికలోని కాలబలాన్ని నిలుపుతుంది.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: ఎదుట నిలబడి
  rationale: తన స్థానాన్ని తీసుకొని ఒకరి సమక్షంలో నిలవడం అనే భావాన్ని సందర్భానుకూలంగా, అతిగా రాజాస్థాన భాషను జోడించకుండా తెలియజేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దూత ద్వారా ప్రకటించే సూత్రవాక్యపు అధికారబలాన్ని సహజమైన తెలుగు ప్రత్యక్ష ప్రకటనగా నిలుపుతుంది.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: హెబ్రీయుల దేవుడు
  rationale: హీబ్రూ సమాస సంబంధాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: నా ప్రజలు ... వారిని వెళ్లనివ్వు
  rationale: విడిచిపంపు అనే ఆజ్ఞను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తం చేస్తూ ‘నా ప్రజలు’ అనే నిబంధనాత్మక స్వామ్య సూచనను కాపాడుతుంది.
- source_word: וְיַעַבְדֻנִי
  choice: నన్ను సేవించడానికి
  rationale: సంధి-అసంపూర్ణ క్రియ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. עבד దేవునికి చేసే సేవను, అందులో ఆరాధనను కూడా, విస్తృతంగా సూచించగలదు; అందువల్ల ప్రధాన పాఠంలో ‘సేవించడానికి’ ఉంచబడింది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవ నామాన్నే ఉపయోగిస్తుంది. ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామాన్ని నిలుపుతూ, విస్తృతంగా అంగీకరించబడిన ‘యాహ్వే’ రూపాన్ని ఎంచుకుంది.
- issue: וְיַעַבְדֻנִי లోని עבד భావం
  choice: నన్ను సేవించడానికి
  alternative: నన్ను ఆరాధించడానికి
  rationale: ఈ క్రియ ఆరాధనతో కూడిన దేవసేవను సూచించగలిగినా, దాని భావం కేవలం ఆరాధనకే పరిమితం కాదు. మూలంలోని విస్తృతతను కాపాడేందుకు ‘సేవించడానికి’ ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘యాహ్వే’ అనే దైవ నామం లిప్యంతరీకరించబడింది. ప్రవచనాత్మక దూతసూత్రం అధికారబలాన్ని నిలుపుతూ ‘ఇలా అంటున్నాడు’గా ఇవ్వబడింది; עבד యొక్క భావవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక కలిసి కాపాడుతున్నాయి.
