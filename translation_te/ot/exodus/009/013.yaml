revisions:
- from: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఉదయాన్నే లేచి ఫరో ఎదుట నిలబడి అతనితో ఇలా చెప్పు: ‘హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: నా ప్రజలు నన్ను సేవించడానికి వారిని వెళ్లనివ్వు.[a]’”'
  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “ఉదయాన్నే లేచి ఫరో ఎదుట నిలబడి, అతనితో ఇలా చెప్పు: ‘హెబ్రీయుల దేవుడైన యాహ్వే ఇలా అంటున్నాడు: వారు నన్ను సేవించేందుకు నా ప్రజలను వెళ్లనివ్వు.[a]’”'
  rationale: The revision changes only word order in the final command to make the purpose relationship and object of “వెళ్లనివ్వు” unambiguous and idiomatic in Telugu. It retains the source’s imperative force, possessive “my people,” and the broad “serve me” sense.
