  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, వెంటనే పంపించి[a] నీ పశువులను, పొలంలో నీకు ఉన్నదంతటినీ సురక్షితమైన చోటికి చేర్పించు. పొలంలో కనిపించి ఇంటిలోకి చేర్చబడని ప్రతి మనిషి, ప్రతి జంతువు మీద వడగండ్లు కురుస్తాయి; వారు చనిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “త్వరగా చర్య తీసుకుని”; హీబ్రూ ఆజ్ఞల క్రమం వెంటనే పశువులను, పొలంలో ఉన్న వాటిని సురక్షితంగా చేర్చాలనే అత్యవసర భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ו అనే అనుసంధానాన్ని, עתה అనే తక్షణ కాలసూచనను కలిపి సహజమైన తెలుగులో చూపుతుంది.
- source_word: שְׁלַח הָעֵז
  choice: కబురు పంపి ... సురక్షితమైన చోటికి చేర్పించు
  rationale: ఆజ్ఞలోని అత్యవసర చర్యను సందర్భానుసారంగా వ్యక్తపరుస్తుంది; పశువులను ఆశ్రయానికి చేర్చాలనే ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: מִקְנְךָ
  choice: నీ పశువులను
  rationale: మִקְנֶה ఇక్కడ సొత్తుగా ఉన్న పెంపుడు పశుసంపదను సూచిస్తుంది.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: పొలంలో నీకు ఉన్నదంతటినీ
  rationale: బయట ఉన్న ఇతర ఆస్తులన్నిటినీ కలుపుకునే మూలభాషలోని విస్తృత ప్రయోగాన్ని నిలుపుతుంది.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: ప్రతి మనిషి, ప్రతి జంతువు
  rationale: אָדָם యొక్క సాధారణ మానవార్థాన్ని తెలుగులో సహజంగా అందిస్తూ, మనుషులు–జంతువులు అనే జతను నిలుపుతుంది.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: పొలంలో కనిపించి
  rationale: מצא నిఫాల్ రూపంలోని ‘కనిపించు/కనుగొనబడడం’ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: ఇంటిలోకి చేర్చబడని
  rationale: אָסף నిఫాల్‌లోని కర్మణి భావాన్ని, הַבַּיְתָה లోని ఇంటివైపు దిశను రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: వారి మీద వడగండ్లు కురుస్తాయి
  rationale: వడగండ్లు పై నుంచి వారిమీదికి దిగివచ్చే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וָמֵתוּ
  choice: వారు చనిపోతారు
  rationale: హెచ్చరికలోని నిశ్చితమైన భవిష్యత్ పరిణామాన్ని సూటిగా తెలుపుతుంది.
theological_decisions:
- issue: אָדָם అనే ఏకవచన సమష్టి పదం యొక్క సాధారణ మానవార్థం
  choice: ప్రతి మనిషి
  alternative: ప్రతి పురుషుడు
  rationale: సందర్భంలో హెచ్చరిక పొలంలో ఉన్న మానవులందరికీ వర్తిస్తుంది; ‘ప్రతి మనిషి’ మూలంలోని మానవార్థాన్ని నిలుపుతూ, కేవలం పురుషులకు పరిమితం చేసే అనవసర భావాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కర్మణి నిర్మాణాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
