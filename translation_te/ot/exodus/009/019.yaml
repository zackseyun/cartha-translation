review_pass:
  verdict: revise
  source_fidelity: The warning and the scope of those exposed in the field are conveyed accurately. However, “కబురు పంపి” explicitly introduces ‘word/message,’ which is not stated in the Hebrew. The paired urgent commands are better represented without adding that object. The urgency nuance belongs to the command following “send,” not specifically to “now.”
  naturalness: The Telugu is generally clear and modern. “సురక్షితమైన చోటికి చేర్పించు” is natural. Revising the opening to “వెంటనే పంపించి” retains the implied dispatching action while avoiding the added ‘message.’
  terminology: “పశువులు,” “జంతువు,” “వడగండ్లు,” and “ఇంటిలోకి చేర్చబడని” are suitable and consistent. “ప్రతి మనిషి” naturally conveys the generic human referent here and does not restrict the warning to males.
  issues:
  - severity: medium
    issue: “కబురు పంపి” adds ‘word/message’ as the object of the first imperative.
    rationale: שְׁלַח does not name a message. In context it implies sending agents or issuing the necessary dispatch, followed by securing the livestock and field possessions. Telugu can preserve this implication without making ‘message’ explicit.
  - severity: low
    issue: Footnote a is anchored to “ఇప్పుడు,” although its stated urgency concerns the command.
    rationale: The urgent/protective nuance is associated with הָעֵז in the imperative sequence, rather than with וְעַתָּה alone. The note should be anchored at the command and describe the alternative accurately.
  revised_text: కాబట్టి ఇప్పుడు, వెంటనే పంపించి[a] నీ పశువులను, పొలంలో నీకు ఉన్నదంతటినీ సురక్షితమైన చోటికి చేర్పించు. పొలంలో కనిపించి ఇంటిలోకి చేర్చబడని ప్రతి మనిషి, ప్రతి జంతువు మీద వడగండ్లు కురుస్తాయి; వారు చనిపోతారు.
