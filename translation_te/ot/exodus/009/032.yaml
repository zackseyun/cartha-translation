  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వ్యవసాయ పదజాలం వాడబడింది. హీబ్రూ వాక్యంలోని వ్యత్యాసాన్ని ‘కానీ’తో, కారణాన్ని ‘ఎందుకంటే’తో స్పష్టంగా వ్యక్తం చేశాం. ధాన్యజాతి గుర్తింపులోని నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
