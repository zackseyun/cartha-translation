  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: te
  text: కానీ గోధుమలు, స్పెల్ట్[a] దెబ్బతినలేదు; ఎందుకంటే అవి ఆలస్యంగా పక్వమవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్పెల్ట్’కు వాడిన హీబ్రూ పదం ఎమర్ వంటి సంబంధిత ధాన్యజాతిని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: కానీ గోధుమలు
  rationale: חִטָּה అంటే గోధుమలు. ముందటి వచనంలో నాశనమైన పంటలకు ఇక్కడ వ్యత్యాసం ఉన్నందున, సాధారణంగా ‘మరియు’ అనే అర్థమిచ్చే וְ ను సహజమైన తెలుగులో ‘కానీ’గా అనువదించాం.
- source_word: וְהַכֻּסֶּמֶת
  choice: స్పెల్ట్ ధాన్యం[a]
  rationale: כֻּסֶּמֶת ఒక ధాన్యజాతిని సూచిస్తుంది; దాని ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు అనిశ్చితం. అందువల్ల ‘స్పెల్ట్’ను ప్రధాన పాఠంలో ఉంచి, ఎమర్ వంటి దగ్గరి ధాన్యజాతి కావచ్చని పాదసూచికలో తెలిపాం.
- source_word: לֹא נֻכּוּ
  choice: దెబ్బతినలేదు
  rationale: נכה యొక్క నిఫాల్ రూపం వడగళ్ల దెబ్బకు గురికాకపోవడాన్ని సూచిస్తుంది. పంటల సందర్భంలో ‘దెబ్బతినలేదు’ సహజంగా ఉండి, కేవలం తాకబడలేదు అనే భావం కంటే నష్టం కలగలేదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: כִּי ఇక్కడ గోధుమలు, కుస్సెమెత్ ఎందుకు దెబ్బతినలేదో తెలిపే కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אֲפִילֹת הֵנָּה
  choice: అవి ఆలస్యంగా పక్వమయ్యే పంటలు
  rationale: అరుదైన אֲפִילֹת ఇక్కడ పంటలు ఇంకా వెనుకటి ఎదుగుదశలో ఉండి ఆలస్యంగా పక్వమవుతాయని సూచించే అవకాశం ఎక్కువ. ‘ఆలస్యంగా పక్వమయ్యే పంటలు’ వ్యవసాయ సందర్భంలోని కారణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పదానికి ప్రతిపాదితమైన ‘చీకటిగా/మరుగై’ అనే మూలభావాన్ని అనవసరంగా ప్రధాన పాఠంలోకి తేల్చదు.
