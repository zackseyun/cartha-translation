reference: Exodus 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: te
  text: 'అయితే, ఈ ఉద్దేశంతోనే నేను నిన్ను నిలిచి ఉండనిచ్చాను[a]: నా శక్తిని నీకు చూపించడానికి, భూమి అంతటా నా పేరు ప్రకటించబడడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిన్ను నిలబెట్టాను.” హీబ్రూ పదాన్ని ఫరోను నిలిచేలా చేయడం లేదా నిలిచి ఉండేలా ఉంచడం అని అర్థం చేసుకోవచ్చు. ఈ సందర్భంలో, అతన్ని వెంటనే నాశనం చేయకుండా ప్రాణాలతో ఉంచడం అనే భావమే సంభావ్యంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న బలమైన వ్యతిరేక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּעֲבוּר זֹאת
  choice: ఈ ఉద్దేశంతోనే
  rationale: ఇది కేవలం కారణాన్ని కాక, తరువాతి ప్రయోజన వాక్యాలు వివరించే దైవ ఉద్దేశాన్ని సూచిస్తుంది; ‘నే’ ఆ ఉద్దేశంపై ఉన్న ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: הֶעֱמַדְתִּיךָ
  choice: నేను నిన్ను నిలిచి ఉండనిచ్చాను
  rationale: עמד హిఫిల్ రూపం ఫరోను నిలిచి ఉండేలా చేయడం లేదా కొనసాగనివ్వడం అనే చిత్రాన్ని కలిగి ఉంది. ముందటి సందర్భంలో అతన్ని వెంటనే నాశనం చేయకుండా ఉంచడమే ప్రధాన భావం; ఈ అనువాదం ఆ చిత్రాన్ని, సందర్భార్థాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: నా శక్తిని నీకు చూపించడానికి
  rationale: హీబ్రూ ప్రయోజన నిర్మాణాన్ని తెలుగులో సహజమైన క్రియార్థక రూపంతో వ్యక్తం చేస్తుంది; ద్వితీయ పురుష ఏకవచన ప్రత్యయం ‘నీకు’గా స్పష్టమవుతుంది.
- source_word: כֹּחִי
  choice: నా శక్తి
  rationale: כח ఇక్కడ తెగుళ్ల సందర్భంలో దేవుని ప్రభావవంతమైన బలాన్ని సూచిస్తుంది; ‘శక్తి’ సాధారణంగా అర్థమయ్యే, గౌరవప్రదమైన పదం.
- source_word: וּלְמַעַן
  choice: … ప్రకటించబడడానికి
  rationale: మొదటి ప్రయోజనంతో సమన్వయంగా ఉన్న రెండవ దైవ ఉద్దేశాన్ని తెలుగులో సమాంతర ప్రయోజన నిర్మాణంతో తెలియజేస్తుంది.
- source_word: סַפֵּר
  choice: ప్రకటించబడడానికి
  rationale: Piel రూపం చెప్పడం, వివరించడం, ప్రకటించడం అనే భావాన్ని ఇస్తుంది. హీబ్రూలో కార్యనిర్వాహకుడు నిర్దిష్టంగా చెప్పబడనందున భావకర్మక రూపం ఆ తెరచిన భావాన్ని కాపాడుతుంది.
- source_word: שְׁמִי
  choice: నా పేరు
  rationale: హీబ్రూ రూపకాన్ని యథాతథంగా ఉంచుతుంది; సందర్భంలో ఇది దేవుని వెల్లడైన గుర్తింపు, కీర్తిని కూడా సూచించగలదు.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: כָּל తో కూడిన הָאָרֶץ ఇక్కడ విస్తృతమైన, సార్వత్రిక పరిధిని సూచిస్తుంది; ‘భూమి అంతటా’ సహజమైన తెలుగులో ప్రపంచవ్యాప్త ప్రకటన భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ఫరోకు సంబంధించి הֶעֱמַדְתִּיךָ అర్థం
  choice: దేవుడు ఫరోను అప్పుడే నాశనం చేయకుండా నిలిచి ఉండనిచ్చాడని ప్రధాన పాఠ్యంలో అనువదించబడింది.
  alternative: దేవుడు ఫరోను ఈ ఉద్దేశం కోసం పైకి లేపాడు లేదా రాజస్థానంలో నిలబెట్టాడు.
  rationale: ముందటి సందర్భంలో దేవుడు ఫరోను భూమిమీద నుండి నిర్మూలించగలిగినా అతడు ఇంకా నిలిచి ఉన్నాడనే వ్యత్యాసం ఉంది. అందువల్ల కొనసాగనివ్వడం లేదా ప్రాణాలతో ఉంచడం ప్రధాన సందర్భార్థం. అయితే హిఫిల్ రూపంలోని ‘నిలబెట్టడం/పైకి లేపడం’ సాధ్యతను పాదటిప్పణిలో ఉంచి, దైవ సార్వభౌమత్వంపై పాఠ్యంలో ఉన్న ఉద్రిక్తతను అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నిలిచి ఉండనిచ్చాను’ మూలంలోని నిలబడటం అనే చిత్రాన్ని, సందర్భంలోని సంరక్షణ/కొనసాగింపు భావాన్ని కాపాడుతుంది. ప్రధాన వాక్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
