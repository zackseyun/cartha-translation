  terminology: ‘శక్తి,’ ‘పేరు,’ ‘ప్రకటించబడడానికి’ వంటి పదప్రయోగాలు సందర్భానుకూలంగా ఉన్నాయి. పాదటిప్పణి ‘నిలబెట్టాను’ అనే చట్టబద్ధమైన ప్రత్యామ్నాయాన్ని సూచించి, ‘పైకి లేపాను’ అనే భావాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా రుద్దకుండా ఉంచుతుంది.
