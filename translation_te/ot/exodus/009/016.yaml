  source_fidelity: హీబ్రూ వాక్యంలోని బలమైన వ్యతిరేకత (וְאוּלָם), ఉద్దేశార్థక నిర్మాణాలు, ‘నిన్ను నిలిచి ఉండనిచ్చాను’ అనే הֶעֱמַדְתִּיךָ యొక్క సందర్భానుగుణమైన సంరక్షణ/కొనసాగింపు భావం, ‘నా శక్తిని నీకు చూపించడానికి,’ మరియు ప్రపంచవ్యాప్తంగా పేరు ప్రకటింపబడే ఉద్దేశం అన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి. ‘భూమి అంతటా’ ఇక్కడ הָאָרֶץ యొక్క సార్వత్రిక పరిధికి సరిపోతుంది.
