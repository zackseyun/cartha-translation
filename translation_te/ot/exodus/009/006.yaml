source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: te
  text: యాహ్వే మరుసటి రోజున ఈ కార్యాన్ని చేశాడు. ఐగుప్తు పశుసంపద అంతా చనిపోయింది; అయితే ఇశ్రాయేలు కుమారుల[a] పశుసంపదలో ఒక్కటి కూడా చనిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయుల.” హెబ్రీలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల.”
    reason: బְנֵי יִשְׂרָאֵל అనే హెబ్రీ పదబంధానికి అక్షరార్థ రూపాన్నీ, సహజమైన జాతినామ రూపాన్నీ చూపించడానికి.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ ఉచ్చారణకు సమీపమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: ఈ కార్యాన్ని చేశాడు
  rationale: עשה + דבר అనే సూటి హెబ్రీ ప్రయోగంలోని క్రియాత్మక భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలిపాం.
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజున
  rationale: ముందు చెప్పిన సమయానికి తరువాతి రోజును సూచించే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: ఐగుప్తు పశుసంపద అంతా
  rationale: מִקְנֶה కేవలం ఆవులను కాక పెంపుడు పశువుల సమూహాన్ని సూచిస్తుంది; כֹּל యొక్క సమగ్ర బలాన్ని ‘అంతా’ నిలుపుతుంది.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు కుమారుల పశుసంపదలో
  rationale: వ్యతిరేక భావాన్ని ‘అయితే’తో, מן ఉపసర్గ భావాన్ని ‘లో’ అనే సహజ తెలుగు నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: לֹא מֵת אֶחָד
  choice: ఒక్కటి కూడా చనిపోలేదు
  rationale: పశువులను సూచిస్తున్నందున ‘ఒక్కటి’ సహజం; ప్రతికూల వాక్యంలో אֶחָד ఇచ్చే గట్టి నొక్కును ‘కూడా’ నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవ వ్యక్తినామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: בְנֵי יִשְׂרָאֵל అనే సమూహపదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హెబ్రీ రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది సమూహార్థక జాతినామంగా కూడా అర్థమవుతుందని పాదసూచికలో తెలిపాం; పురుషులను మాత్రమే ఉద్దేశించిందని అదనపు భావం చేర్చలేదు.
- issue: כֹּל అనే సమగ్ర పదం
  choice: అంతా
  alternative: చాలావరకు / ఆ ప్రాంతంలోని పశుసంపద అంతా
  rationale: మూలంలోని సమగ్ర ప్రకటనను తరువాతి కథనంతో సమన్వయపరచడానికి పరిమితం చేయకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సూటిగా, గౌరవప్రదంగా రూపొందించాం. ‘పశుసంపద’ ద్వారా విస్తృతమైన מִקְנֶה భావాన్ని నిలిపాం. ప్రధాన పాఠంలో హెబ్రీ వాక్యంలోని సమగ్రతను, ఇశ్రాయేలు పశువులతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని కాపాడాం.
