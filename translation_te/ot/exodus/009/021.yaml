  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: te
  text: అయితే, యాహ్వే మాటను పట్టించుకోనివాడు తన సేవకులను, తన పశువులను పొలంలో విడిచిపెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “యాహ్వే మాటవైపు తన హృదయాన్ని ఉంచనివాడు”; అంటే, యాహ్వే మాటను గంభీరంగా తీసుకోనివాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: అయితే ... వాడు
  rationale: ముందటి వచనంలోని హెచ్చరికను గౌరవించినవారితో ఇక్కడ వ్యత్యాసం ఉంది; అనిర్దిష్ట సంబంధార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: పట్టించుకోనివాడు
  rationale: అక్షరార్థంగా ‘తన హృదయాన్ని దానివైపు ఉంచలేదు’; సందర్భంలో హెచ్చరికను లక్ష్యపెట్టకపోవడం లేదా గంభీరంగా తీసుకోకపోవడం అనే భావం.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా మాటను
  rationale: דָּבָר ఇక్కడ ప్రకటించిన హెచ్చరికను సూచిస్తుంది; ‘మాట’ ప్రామాణికమైనదీ సహజమైనదీ.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టాడు
  rationale: సేవకులనూ పశువులనూ రాబోయే వడగండ్లకు గురయ్యేలా పొలంలో వదిలిన నిర్దిష్ట చర్యను తెలియజేస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: עֶבֶד దాసుడు లేదా సేవకుడు అని అర్థమవుతుంది; ఇక్కడ వారి న్యాయస్థితికంటే యజమాని ఆధీనంలోని పనివారనే సందర్భార్థం ప్రధానమైనది.
- source_word: מִקְנֵהוּ
  choice: తన పశువులను
  rationale: పెంచే జంతువుల సమూహాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: בַּשָּׂדֶה
  choice: పొలంలోనే
  rationale: స్థలార్థాన్ని స్పష్టంగా తెలుపుతుంది; ‘నే’ వారు బయటే మిగిలిపోయారనే సందర్భోచిత భావాన్ని సహజంగా నొక్కిచెబుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచితమైన రూపంలో నిలుపుతుంది.
- issue: ‘హృదయాన్ని ఉంచడం’ అనే హీబ్రూ నుడికారం
  choice: పట్టించుకోనివాడు
  alternative: యెహోవా మాటవైపు తన హృదయాన్ని ఉంచనివాడు
  rationale: ప్రధాన పాఠంలో కార్యార్థాన్ని సహజంగా తెలుపుతూ, అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది; అలా నిర్లక్ష్యం మరియు గంభీరంగా తీసుకోకపోవడం రెండింటినీ సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. హీబ్రూ నుడికారపు అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
