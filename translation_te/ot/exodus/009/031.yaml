translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘వెన్ను వేయడం,’ ‘మొగ్గ దశ’ వంటి సహజ వ్యవసాయ పదప్రయోగాలు వాడబడ్డాయి. హీబ్రూలోని సమష్టి కర్తకు ఏకవచన స్త్రీలింగ క్రియ ఉన్నప్పటికీ, తెలుగులో సహజ సమన్వయం కోసం బహువచన క్రియ ఉపయోగించబడింది. ప్రధాన వాక్యంలో వడగండ్ల సందర్భం స్పష్టంచేయబడింది.
