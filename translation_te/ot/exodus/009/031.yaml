revisions:
- from: అవిసె, యవ పంటలు వడగండ్ల దెబ్బకు నాశనమయ్యాయి. ఎందుకంటే యవలు వెన్ను వేసి ఉన్నాయి[a], అవిసె మొగ్గ దశలో ఉంది[b].
  to: అవిసె, యవ పంటలు దెబ్బతిన్నాయి; ఎందుకంటే యవలు కంకి దశలో ఉన్నాయి[a], అవిసె మొగ్గ దశలో ఉంది[b].
  rationale: The revision removes contextual wording not expressed in this verse, renders the Hebrew passive more directly, and uses clear modern agricultural Telugu for the barley’s ear-forming stage. The alternatives for אָבִיב and גִּבְעֹל remain properly anchored to their respective clauses and preserve the source’s lexical range.
