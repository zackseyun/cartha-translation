  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: te
  text: అవిసె, యవ పంటలు దెబ్బతిన్నాయి; ఎందుకంటే యవలు కంకి దశలో ఉన్నాయి[a], అవిసె మొగ్గ దశలో ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యవలు పక్వానికి వస్తున్నాయి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అవిసె పూత దశలో ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: అవిసె
  rationale: ఈ పదం నారను ఇచ్చే అవిసె పంటను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో వ్యవసాయ సందర్భానికి సహజమైన సమానం.
- source_word: הַשְּׂעֹרָה
  choice: యవ పంటలు / యవలు
  rationale: ఈ పదం barley పంటను నేరుగా సూచిస్తుంది; ‘యవలు’ తెలుగులో స్థిరమైన పంటపేరు.
- source_word: נֻכָּתָה
  choice: వడగండ్ల దెబ్బకు నాశనమయ్యాయి
  rationale: నכה యొక్క కర్మణి భావాన్ని, సందర్భంలో వడగండ్లు పంటలను కొట్టి పాడుచేసిన ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన నష్టానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אָבִיב
  choice: వెన్ను వేసి ఉన్నాయి
  rationale: ధాన్యపు కంకి ఏర్పడి ఇంకా పక్వమవుతున్న దశను స్పష్టమైన తెలుగు వ్యవసాయ ప్రయోగంతో, హీబ్రూ పదంలోని దృశ్యరూపాన్ని కాపాడుతూ తెలుపుతుంది.
- source_word: גִּבְעֹל
  choice: మొగ్గ దశలో ఉంది
  rationale: అవిసె అభివృద్ధి చెందిన పెరుగుదల దశలో—మొగ్గ, పూత లేదా కాయ ఏర్పడే దశకు సమీపంగా—ఉందనే భావాన్ని అతినిర్దిష్టం చేయకుండా అందిస్తుంది.
