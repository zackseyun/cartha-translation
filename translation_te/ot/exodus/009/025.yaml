id: EXO.9.25
reference: Exodus 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: te
  text: వడగండ్లు ఐగుప్తు దేశమంతటా పొలంలో ఉన్న ప్రతిదానినీ—మనుషుల మొదలుకొని పశువుల వరకు—కొట్టాయి. పొలంలోని ప్రతి మొక్కనూ వడగండ్లు కొట్టాయి; పొలంలోని ప్రతి చెట్టునూ విరగ్గొట్టాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: కొట్టాయి
  rationale: נכה అనే క్రియలోని బలమైన ‘కొట్టు/దెబ్బతీయు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. వడగండ్లు బహువచనంగా ఉండటంతో క్రియను బహువచనంలో ఇచ్చాం; రెండుసార్లూ ఒకే అనువాదాన్ని వాడి మూలంలోని పునరుక్తిని కాపాడాం.
- source_word: הַבָּרָד
  choice: వడగండ్లు
  rationale: తెలుగులో ఈ వాతావరణ ఘటనకు సహజమైన సాధారణ పదం; మూలంలో పునరావృతమైన చోట అనువాదంలోనూ పునరావృతం చేశాం.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: בְּכָל లోని ప్రాంతమంతటా వ్యాపించిన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: పొలంలో ఉన్న ప్రతిదానినీ
  rationale: כָּל אֲשֶׁר యొక్క సమగ్రతను నిలుపుతూ వ్యవసాయ సందర్భంలోని שׂדה ను ‘పొలం’గా స్పష్టంగా అనువదిస్తుంది.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: మనుషుల మొదలుకొని పశువుల వరకు
  rationale: ఇది ప్రభావితమైన సజీవుల పూర్తి పరిధిని సూచించే జంట వ్యక్తీకరణ. אָדָם ను ఇక్కడ సమూహ మానవార్థంలో ‘మనుషులు’గా, בְּהֵמָה ను సందర్భానుకూలంగా ‘పశువులు’గా ఇచ్చాం.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: పొలంలోని ప్రతి మొక్క
  rationale: עֵשֶׂב కు గడ్డి, పచ్చిక, మొక్కజాతి అనే పరిధి ఉంది. ‘మొక్క’ ఆధునిక పాఠకునికి సహజంగా ఉండి, అర్థాన్ని అనవసరంగా కేవలం గడ్డికే పరిమితం చేయదు.
- source_word: עֵץ הַשָּׂדֶה
  choice: పొలంలోని ప్రతి చెట్టు
  rationale: మూలంలోని వ్యవసాయ ప్రదేశ సూచననూ, ‘ప్రతి’ అనే సమగ్ర భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁבֵּר
  choice: విరగ్గొట్టాయి
  rationale: שבר పియేల్ రూపంలోని బలమైన, విధ్వంసక క్రియను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘విరిచాయి’ కంటే దెబ్బ తీవ్రతను మెరుగ్గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מֵאָדָם וְעַד בְּהֵמָה లో אָדָם అనువాదం
  choice: మనుషుల మొదలుకొని పశువుల వరకు
  alternative: మనిషి మొదలుకొని జంతువు వరకు
  rationale: ఈ సందర్భంలో אָדָם ఒక పురుష వ్యక్తిని మాత్రమే కాక మానవులను సమూహంగా సూచిస్తుంది. తెలుగులో ‘మనుషులు’ ఆ సమగ్ర అర్థాన్ని సహజంగా అందిస్తుంది; ‘పశువులు’ వ్యవసాయ క్షేత్ర సందర్భంలో בְּהֵמָה కు తగినది. ఈ ఎంపిక ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘పొలం’ మరియు ‘వడగండ్లు కొట్టాయి’ అనే పునరుక్తులను ఉద్దేశపూర్వకంగా నిలిపాం. వివరణ అవసరమైన నిజమైన పాఠభేదం లేదా అస్పష్టత లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
