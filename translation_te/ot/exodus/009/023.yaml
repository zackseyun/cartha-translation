revisions:
- from: మోషే తన కర్రను ఆకాశం వైపు చాపాడు. అప్పుడు యెహోవా ఉరుములను, వడగండ్లను పంపాడు; అగ్ని నేలవైపు దూసుకెళ్లింది.[a] యెహోవా ఐగుప్తు దేశం మీద వడగండ్ల వర్షం కురిపించాడు.
  to: మోషే తన కర్రను ఆకాశం వైపు చాపాడు. అప్పుడు యాహ్వే ఉరుములను, వడగండ్లను పంపాడు; అగ్ని భూమివైపు వెళ్లింది.[a] యాహ్వే ఐగుప్తు దేశం మీద వడగండ్లను కురిపించాడు.
  rationale: The revision removes interpretive acceleration from the movement of the fire, keeps the Hebrew’s ‘fire’ imagery in the main text, and brings the Telugu rendering of the divine name into line with the POB audit trail. It also renders the final hail clause more directly while preserving its causative sense.
