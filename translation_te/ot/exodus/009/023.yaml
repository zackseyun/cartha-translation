id: EXO.9.23
reference: Exodus 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: te
  text: మోషే తన కర్రను ఆకాశం వైపు చాపాడు. అప్పుడు యాహ్వే ఉరుములను, వడగండ్లను పంపాడు; అగ్ని భూమివైపు వెళ్లింది.[a] యాహ్వే ఐగుప్తు దేశం మీద వడగండ్లను కురిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్ని భూమివైపు నడిచింది.” సందర్భంలో ఈ “అగ్ని” మెరుపును సూచిస్తుండవచ్చు.
    reason: వַתִּהֲלַךְ אֵשׁ אָרְצָה యొక్క మరింత పదశః కదలికచిత్రాన్ని చూపిస్తూ, ‘అగ్ని’కి సాధ్యమైన తుఫాను-సందర్భార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֵּט
  choice: చాపాడు
  rationale: נָטָה అనే క్రియ ఇక్కడ కర్రను ఒక దిశగా చాపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన రూపం.
- source_word: מַטֵּהוּ
  choice: తన కర్రను
  rationale: מַטֶּהకు ‘కర్ర/దండం’ అనే అర్థాలున్నాయి. మోషే చేతిలోని సాధనాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేయడానికి ‘కర్ర’ ఎంచుకున్నాం.
- source_word: עַל הַשָּׁמַיִם
  choice: ఆకాశం వైపు
  rationale: సందర్భంలో పైకి, ఆకాశం దిశగా కర్ర చాపడమే భావం; ‘వైపు’ దిశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: ఉరుములను, వడగండ్లను పంపాడు
  rationale: סערు సందర్భంలో קֹלֹת అంటే ఉరుముల శబ్దాలు. נָתַןను పదశః ‘ఇచ్చాడు’ అనడం కంటే ‘పంపాడు’ తెలుగులో భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: అగ్ని నేలవైపు దూసుకెళ్లింది
  rationale: హీబ్రూ పదచిత్రం ‘అగ్ని నేలవైపు వెళ్లింది/నడిచింది.’ మెరుపు వంటి వేగవంతమైన కదలికను ‘దూసుకెళ్లింది’ సహజంగా వ్యక్తం చేస్తూనే ‘అగ్ని’ అనే మూలపదాన్ని నిలుపుతుంది.
- source_word: וַיַּמְטֵר ... בָּרָד
  choice: వడగండ్ల వర్షం కురిపించాడు
  rationale: హిఫీల్ రూపం ‘వర్షింపజేశాడు’ అనే causative భావం కలిగి ఉంది; తెలుగులో ‘వడగండ్ల వర్షం కురిపించాడు’ సహజమైన ప్రయోగం.
- source_word: אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం
  rationale: మూలంలోని ‘ఐగుప్తు దేశం’ అనే భౌగోళిక విస్తృతి సూచనను నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సమర్థనీయ పునర్నిర్మిత ఉచ్చారణ.
- issue: אֵשׁ యొక్క తుఫాను సందర్భార్థం
  choice: అగ్ని
  alternative: మెరుపు
  rationale: సందర్భంలో ఇది మెరుపును సూచించే అవకాశం బలంగా ఉన్నా, హీబ్రూ నేరుగా ‘అగ్ని’ అంటుంది. మూలంలోని పదచిత్రాన్నీ స్వల్ప వ్యాఖ్యాన ఉద్రిక్తతనూ ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సూచనను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ తుఫాను చిత్రణను సహజమైన తెలుగు వాక్యనిర్మాణంతో నిలిపాం.
