id: EXO.9.29
reference: Exodus 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: te
  text: 'మోషే అతనితో ఇలా అన్నాడు: “నేను పట్టణం నుంచి బయటికి వెళ్లినప్పుడు యహ్వేకు నా చేతులు చాపుతాను; ఉరుములు[a] ఆగిపోతాయి, వడగండ్లు ఇక ఉండవు. నీవు భూమి యహ్వేకే చెందిందని[b] తెలుసుకునేలా ఇది జరుగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘ధ్వనులు’; ఈ తుఫాను సందర్భంలో అది ఉరుములను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశం యహ్వేకే చెందిందని.’
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: నేను పట్టణం నుంచి బయటికి వెళ్లగానే
  rationale: כְּ తో కూడిన infinitive construct ఇక్కడ మోషే పట్టణం నుంచి బయలుదేరే సమయాన్ని సూచిస్తుంది. ‘వెళ్లగానే’ దాని తక్షణ కాలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי אֶל־יְהוָה
  choice: యహ్వే వైపు నా చేతులు చాపుతాను
  rationale: פרשׂ + כף ప్రార్థనలో చేతులను విప్పి చాపే భంగిమను సూచిస్తుంది; אֶל దిశను ‘వైపు’గా స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: הַקֹּלוֹת
  choice: ఉరుములు
  rationale: పదశః ‘ధ్వనులు/స్వరాలు’ అయినప్పటికీ, వడగండ్ల తుఫాను సందర్భంలో ఇది ఉరుములను సూచిస్తుంది.
- source_word: יֶחְדָּלוּן
  choice: ఆగిపోతాయి
  rationale: חדל అంటే ఆగడం లేదా నిలిచిపోవడం. ఆధునిక సాధారణ తెలుగులో ‘ఆగిపోతాయి’ సహజంగా ఉంది.
- source_word: וְהַבָּרָד לֹא יִהְיֶה־עוֹד
  choice: వడగండ్లు ఇక ఉండవు
  rationale: వడగండ్ల వాన ఇక కొనసాగదనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן תֵּדַע
  choice: దీనివల్ల … నీవు తెలుసుకుంటావు
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. సందర్భంలో సూచించిన జ్ఞానఫలితాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపింది.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: భూమి యహ్వేకే చెందిందని
  rationale: స్వామ్యాన్ని సూచించే לְ ను ‘చెందింది’గా, הָאָרֶץ ను విస్తృత భావంలో ‘భూమి’గా అనువదించింది; కే అనే అవధారణ యహ్వే స్వామ్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యహ్వే’గా ఇచ్చింది.
- issue: הָאָרֶץ పదం యొక్క పరిధి
  choice: భూమి
  alternative: దేశం
  rationale: ఫరోతో జరుగుతున్న సంఘర్షణలో ఈ ప్రకటన యహ్వే యొక్క విస్తృత సార్వభౌమాధికారాన్ని సూచించగలదు. అయినా హీబ్రూ పదానికి ‘దేశం’ అనే స్థానిక అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని కారణ-ఫలిత సంబంధాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా మలిచింది; భూమి/దేశం అనే నిజమైన అర్థసందిగ్ధతను పాదసూచికలో ఉంచింది.
