- from: 'మోషే అతనితో ఇలా అన్నాడు: “నేను పట్టణం నుంచి బయటికి వెళ్లగానే, యహ్వే వైపు నా చేతులు చాపుతాను. అప్పుడు ఉరుములు[a] ఆగిపోతాయి; వడగండ్లు ఇక ఉండవు. దీనివల్ల భూమి యహ్వేకే చెందిందని[b] నీవు తెలుసుకుంటావు.”'
