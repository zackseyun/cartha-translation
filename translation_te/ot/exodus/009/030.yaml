  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֖ה וַ/עֲבָדֶ֑י/ךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּ/ן מִ/פְּנֵ֖י יְהוָ֥ה אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: te
  text: కాని నువ్వూ నీ సేవకులూ యాహ్వే దేవునికి ఇంకా భయపడరని నాకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీరు యాహ్వే దేవునికి భయపడకముందే.” హీబ్రూ పదం సందర్భానుసారం “ఇంకా కాదు” లేదా “ముందు” అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: కాని నువ్వూ
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి, ముందటి మాటకు భిన్నంగా ఫరోను ప్రత్యేకంగా ఉద్దేశించే వ్యతిరేక భావాన్ని చూపుతుంది.
- source_word: וַעֲבָדֶיךָ
  choice: నీ సేవకులూ
  rationale: ఫరో ఆస్థాన సందర్భంలో עֶבֶד అతని సేవకులు లేదా అధికారులు అనే భావం ఇస్తుంది; ‘సేవకులు’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: పూర్తిక్రియ ఇక్కడ మోషేకు ప్రస్తుతం ఉన్న స్థిరమైన అవగాహనను సూచిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: మోషేకు తెలిసిన విషయం ఏమిటో తెలిపే విషయార్థక సంధిగా పనిచేస్తుంది.
- source_word: טֶרֶם
  choice: ఇంకా ... కాదు
  rationale: తదనంతర అసంపూర్ణ క్రియతో కలిసి సందర్భంలో ‘ఇంకా కాదు’ అనే కాలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ముందు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: תִּירְאוּן
  choice: భయపడరు
  rationale: ירא భయం, విస్మయం, భక్తిపూర్వక గౌరవం మధ్య ఉన్న భావవిస్తృతిని కలిగి ఉంది; ‘భయపడడం’ ఆ ఉద్వేగాన్ని పూర్తిగా ఒకే దిశగా పరిమితం చేయదు.
- source_word: מִפְּנֵי
  choice: దేవునికి
  rationale: יראతో కూడిన ఈ సంబంధసూచక ప్రయోగాన్ని తెలుగులో సహజంగా కర్మసంబంధ దత్తి రూపంతో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ప్రత్యక్ష లిప్యంతరీకరణతో నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: దైవనామానికి అనుబంధంగా ఉన్న אֱלֹהִיםను ‘దేవుడు’గా అనువదించాం; వాక్యంలో విభక్తితో ‘దేవునికి’ అయింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: దేవుని పట్ల ירא యొక్క భావం
  choice: భయపడరు
  alternative: భక్తిగౌరవం చూపరు; భీతిచెందరు
  rationale: ఈ పదంలో భీతి, విస్మయం, గౌరవం కలిసి ఉండవచ్చు. ‘భయపడరు’ అనే రూపం దానిని కేవలం భయాందోళనగా గానీ కేవలం గౌరవంగా గానీ పరిష్కరించకుండా ఉంచుతుంది.
- issue: טֶרֶם యొక్క కాలార్థం
  choice: ఇంకా ... కాదు
  alternative: యెహోవా దేవునికి భయపడకముందే
  rationale: సందర్భంలో ఫరో, అతని సేవకులు ఇప్పటివరకు సరైన భయానికి రాలేదనే భావం సహజం; అయినా ‘ముందు’ అనే మరింత అక్షరార్థ సాధ్యతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, మోషే ఫరోను నేరుగా సంబోధిస్తున్నందున ‘నువ్వు/నీ’ రూపాలను ఉపయోగించాం. వాక్యం గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా నిర్మించాం; మూలంలోని భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
