base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: te
  text: అవి కింది భాగంలో జతగా ఉండాలి[a]; పైభాగంలో ఆ ఒక్క ఉంగరం వరకు అవి కలిసి సంపూర్ణంగా ఉండాలి[b][c]. ఆ రెండింటికీ అలాగే ఉండాలి; ఆ రెండు మూలల కొరకు అవి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కింద ఒకదానికొకటి సరిపడేలా ఉండాలి’; హీబ్రూ పదం రెండు పలకలు సరిపోలిన జతగా ఏర్పడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పూర్తిగా అమరి ఉండాలి.’ ఇక్కడి హీబ్రూ పదం నైతిక పరిపూర్ణతను కాక నిర్మాణపరమైన సంపూర్ణతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మొదటి ఉంగరం వరకు.’ హీబ్రూ పదబంధాన్ని ‘ఆ ఒక్క ఉంగరం’ అని లేదా ‘మొదటి ఉంగరం’ అని అర్థం చేసుకోవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: תֹאֲמִים
  choice: జతగా
  rationale: ఈ పదం రెండు పలకలు ఒకదానికొకటి సరిపడే జతగా ఉండడాన్ని సూచిస్తుంది. నిర్మాణ సందర్భంలో ‘జతగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִלְּמַטָּה
  choice: కింది భాగంలో
  rationale: పలకల దిగువ చివరను సూచించే స్థానార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְיַחְדָּו
  choice: కలిసి
  rationale: రెండు పలకలు సమిష్టిగా ఒక నిర్మాణ భాగంగా ఉండడాన్ని తెలియజేస్తుంది.
- source_word: תַמִּים
  choice: సంపూర్ణంగా
  rationale: ఇక్కడ నైతిక పరిపూర్ణత కాకుండా నిర్మాణపరమైన సంపూర్ణత లేదా పూర్తిగా అమరిన స్థితి ఉద్దేశించబడింది; ఖచ్చితమైన వడ్రంగి పద్ధతిని అదనంగా ఊహించకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: עַל רֹאשׁוֹ
  choice: పైభాగంలో
  rationale: ‘తల’ అనే మూలరూపం ఇక్కడ నిర్మాణపు పై చివరను సూచిస్తుంది; తెలుగులో ‘పైభాగం’ సహజమైన వాస్తు పదప్రయోగం.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: ఒకే ఉంగరం వరకు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ‘ఒకటి’ అనే సంఖ్యను దగ్గరగా అనుసరిస్తూ, జత పలకలను కలిపే ఒక ఉంగరాన్ని సూచిస్తుంది. ‘మొదటి ఉంగరం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: ఆ రెండింటికీ అలాగే ఉండాలి
  rationale: నిర్దేశించిన నిర్మాణ విధానం రెండు పలకలకూ వర్తిస్తుందని సరళంగా తెలియజేస్తుంది.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: రెండు మూలల కోసం
  rationale: מִקְצֹעֹת అనే పదంలోని ‘మూలలు/మూల కూర్పులు’ అనే అర్థాన్ని అనవసరమైన స్థలవివరణ జోడించకుండా నేరుగా అందిస్తుంది.
