translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. గుడార నిర్మాణానికి సంబంధించిన సాంకేతిక భాషను అతిగా నిర్దిష్టం చేయకుండా, మూలంలోని నిర్మాణపరమైన అస్పష్టతను పాదసూచికల్లో నిలిపాం.
