  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֣ה בְרִיחִ֗ם לְ/קַרְשֵׁי֙ צֶ֣לַע הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: te
  text: నివాసగుడారం యొక్క రెండవ పక్క పలకలకు ఐదు అడ్డకమ్మీలు[a]; నివాసగుడారం వెనుక భాగానికి, పడమటి వైపున ఉన్న పక్క పలకలకు ఐదు అడ్డకమ్మీలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివాసగుడారం యొక్క మరొక పక్క పలకలకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: అడ్డకమ్మీలు
  rationale: మందిర నిర్మాణ సందర్భంలో పలకలను కలిపి నిలిపే అడ్డంగా అమర్చిన కమ్మీలను సూచిస్తుంది; సాధారణ పాఠకునికి వాటి పని స్పష్టమయ్యే సహజమైన నిర్మాణ పదం.
- source_word: קַרְשֵׁי
  choice: పలకలు
  rationale: నివాస మందిర నిర్మాణంలో ఉపయోగించిన చెక్క నిర్మాణ భాగాలను సూచిస్తుంది; ‘చెక్క పలకలు’ అని మూలంలో లేని పదార్థాన్ని ప్రతి చోట చేర్చకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: צֶלַע
  choice: పక్క
  rationale: ఇక్కడ శరీరపు ప్రక్కెముకను కాక, నిర్మాణంలోని ఒక పార్శ్వాన్ని సూచిస్తుంది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: ‘మరొక’ అనే సందర్భోచిత భావం ఉన్నప్పటికీ, హీబ్రూ పదంలోని క్రమసూచక అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: ఈ నిర్మాణ సందర్భంలో ఇశ్రాయేలీయుల పవిత్ర గుడార నివాసాన్ని సూచించే స్థిర నామంగా వాడబడింది; ఆధునిక తెలుగు పాఠకునికి సంక్షిప్తంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: לַיַּרְכָתַיִם
  choice: వెనుక భాగంలో
  rationale: నిర్మాణపు చివరి లేదా వెనుక భాగాన్ని సూచిస్తుంది; సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: יָמָּה
  choice: పడమటి వైపున
  rationale: ‘సముద్రం వైపు’ అనే వ్యుత్పత్తి భావాన్ని కాక, ఇక్కడ ఉద్దేశించిన దిక్కును స్పష్టంగా తెలుపుతుంది.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: ఐదు ... ఐదు
  rationale: హీబ్రూ జాబితా నిర్మాణంలోని సమాంతర పునరుక్తిని తెలుగులో నిలుపుతుంది; వాక్యారంభ సంధికారకాన్ని ముందు వచనంతో కలిసే సందర్భం లేకుండా బలవంతంగా చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ సూచనలకు తగిన సరళమైనా గౌరవప్రదమైన శైలి. ‘రెండవ’ అనే మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారమైన ‘మరొక’ను పాదసూచికలో ఇచ్చాం. హీబ్రూలోని ‘వెనుక భాగానికి, పడమటి వైపున’ అనే రెండు అంశాలనూ ప్రధాన పాఠ్యంలోనే నిలిపాం.
