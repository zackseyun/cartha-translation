  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: te
  text: ఆ నిర్మాణ పలకలను[a] బంగారంతో పొదిగించాలి. అడ్డకడ్డీలు దూరే తొడుగులుగా వాటి ఉంగరాలను బంగారంతో చేయాలి. ఆ అడ్డకడ్డీలను కూడా బంగారంతో పొదిగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెక్క పలకలను.’ హీబ్రూ పదం మందిరపు గుడారంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: నిర్మాణ పలకలను
  rationale: కֶרֶשׁ ఇక్కడ మందిరపు గుడారాన్ని నిలబెట్టే నిర్మాణ భాగాలను సూచిస్తుంది. ‘పలకలు’ మూలపదానికి దగ్గరగా ఉండగా, ‘నిర్మాణ’ అనే విశేషణం వాటి పనిని స్పష్టం చేస్తుంది.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: బంగారంతో పొదిగించాలి
  rationale: పీయేల్ రూపంలోని צפה ఒక వస్తువు మీద లోహపు పొరను అమర్చడాన్ని సూచిస్తుంది. ‘పొదిగించాలి’ సాధారణంగా అర్థమయ్యేలా ఆ శిల్పకార్య భావాన్ని తెలియజేస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: ఇది పదార్థాన్ని సూచించే సూటి పదం. హీబ్రూలోని పునరుక్తిని అనుసరించి వాక్యంలో మూడుసార్లు నిలిపాం.
- source_word: טַבְּעֹתֵיהֶם
  choice: వాటి ఉంగరాలను
  rationale: טַבַּעַת ఇక్కడ నిర్మాణ పలకలకు అమర్చిన లోహపు ఉంగరాలను సూచిస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: చేసి
  rationale: עשה అనే సాధారణ క్రియకు సహజమైన తెలుగు రూపం; తరువాతి ప్రయోజన పదబంధంతో ప్రవాహంగా కలుస్తుంది.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: అడ్డకడ్డీలకు తొడుగులుగా
  rationale: అక్షరార్థంగా ‘కడ్డీలకు ఇళ్లు.’ ఇక్కడ కడ్డీలు దూరి నిలిచే ఆధారాలను సూచిస్తున్నందున ‘తొడుగులు’ వాటి గ్రాహక పనిని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַבְּרִיחִם
  choice: అడ్డకడ్డీలు
  rationale: בְּרִיחַ పలకలను కలిపి బిగించే అడ్డంగా అమర్చిన కడ్డీ. ‘అడ్డకడ్డీలు’ సందర్భంలోని పనిని స్పష్టంగా తెలియజేస్తుంది.
