  to: ఆ నిర్మాణ పలకలను[a] బంగారంతో పొదిగించాలి. అడ్డకడ్డీలు దూరే తొడుగులుగా వాటి ఉంగరాలను బంగారంతో చేయాలి. ఆ అడ్డకడ్డీలను కూడా బంగారంతో పొదిగించాలి.
