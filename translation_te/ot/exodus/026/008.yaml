  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: te
  text: ఒక్కో తెర పొడవు ముప్పై మూరలు, ఒక్కో తెర వెడల్పు నాలుగు మూరలు; పదకొండు తెరలన్నిటికీ ఒకే కొలత ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: רֹחַב (‘వెడల్పు’)కు జతగా ఉన్న సాధారణ పరిమాణ పదం; ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: יְרִיעָה
  choice: తెర
  rationale: మందిర గుడార సందర్భంలో పెద్ద వస్త్ర భాగాన్ని సూచిస్తుంది; ‘తెర’ సులభంగా అర్థమయ్యే, సందర్భోచితమైన పదం.
- source_word: הָאַחַת / הָאֶחָת
  choice: ఒక్కో
  rationale: అక్షరార్థంగా ‘ఒకటి’ అయినా, ఇక్కడ ప్రతి తెరకు విడివిడిగా వర్తించే కొలతను సూచించే పంపిణీ ప్రయోగం.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: ముప్పై మూరలు
  rationale: אַמָּה అనే ప్రాచీన కొలమానానికి తెలుగులో బైబిలు సందర్భంలో స్థిరపడిన ‘మూర’ను ఉంచి, ఆధునిక కొలమానంగా మార్చలేదు.
- source_word: רֹחַב
  choice: వెడల్పు
  rationale: ‘పొడవు’కు జతగా స్పష్టమైన ఆధునిక తెలుగు పరిమాణ పదం.
- source_word: אַרְבַּע בָּאַמָּה
  choice: నాలుగు మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని అలాగే ప్రతిబింబించే సహజ తెలుగు రూపం.
- source_word: מִדָּה אַחַת
  choice: ఒకే కొలత
  rationale: అక్షరార్థమైన ‘ఒక కొలత’ భావాన్ని, పదకొండు తెరల పరిమాణాలు సమానమనే ఉద్దేశంతో సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: పదకొండు తెరలన్నిటికీ
  rationale: לְ ఉపసర్గతో మొత్తం సమూహానికి ఒకే కొలత వర్తిస్తుందని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
