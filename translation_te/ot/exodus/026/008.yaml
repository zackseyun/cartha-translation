translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; నిర్మాణ కొలతల ఆజ్ఞకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని పంపిణీ భావాన్ని ‘ఒక్కో’తో, ఏకరూపతను ‘ఒకే కొలత’తో వ్యక్తపరిచాం.
