translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. రెండు సమాంతర భాగాలను సహజమైన తెలుగు వాక్య నిర్మాణంలో ఉంచుతూ, రంగు మరియు తెరల సమూహానికి సంబంధించిన మూలభాషా విస్తృతిని పాదసూచికల్లో నిలిపాం.
