  to: మొదటి కలిపిన విభాగం[b] చివరనున్న ఒక తెర అంచుపై నీలిరంగు[a] ఉచ్చులు చేయాలి; రెండవ కలిపిన విభాగంలోని అత్యంత బయటివైపున ఉన్న తెర అంచుపై కూడా అలాగే చేయాలి.
