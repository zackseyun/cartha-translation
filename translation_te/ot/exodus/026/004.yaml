source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ לֻֽלְאֹ֣ת תְּכֵ֗לֶת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָ/אֶחָ֔ת מִ/קָּצָ֖ה בַּ/חֹבָ֑רֶת וְ/כֵ֤ן תַּעֲשֶׂה֙ בִּ/שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/קִּ֣יצוֹנָ֔ה בַּ/מַּחְבֶּ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: te
  text: మొదటి కలిపిన విభాగం[b] చివరనున్న ఒక తెర అంచుపై నీలిరంగు[a] ఉచ్చులు చేయాలి; రెండవ కలిపిన విభాగంలోని అత్యంత బయటివైపున ఉన్న తెర అంచుపై కూడా అలాగే చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీలిరంగు’ అని అనువదించిన హీబ్రూ పదం నీలం లేదా నీలి-ఊదా ఛాయగల రంగు వేసిన పదార్థాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కలిపిన విభాగం’ అని అనువదించిన హీబ్రూ పదాలు అనేక తెరలను కలిపి చేసిన ఒక సమూహాన్ని సూచిస్తాయి; ‘కలయిక’ లేదా ‘కలిపిన సమూహం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: ఉచ్చులు
  rationale: తెరలను ఒకదానితో ఒకటి కలిపేందుకు అమర్చే వలయాకారపు బంధకాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉచ్చులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: תְּכֵלֶת
  choice: నీలిరంగు దారం
  rationale: ఇది గుడారపు వస్త్రాల్లో ఉపయోగించిన ప్రత్యేక నీలి లేదా నీలి-ఊదా రంగు వేసిన పదార్థాన్ని సూచిస్తుంది. ఉచ్చులు తయారుచేసే సందర్భంలో ‘దారం’ పదార్థ భావాన్ని సహజంగా తెలియజేస్తుంది; ఖచ్చితమైన రంగు ఛాయను పాదసూచికలో ఉంచాం.
- source_word: שְׂפַת
  choice: అంచు
  rationale: వస్త్ర సందర్భంలో తెర సరిహద్దును సూచించడానికి ఇది స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: יְרִיעָה
  choice: తెర
  rationale: నివాస గుడారాన్ని రూపొందించే వస్త్రపు భాగాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: הָאֶחָת ... הַקִּיצוֹנָה
  choice: చివరి తెర
  rationale: మొదటి వాక్యభాగంలోని ‘ఒక తెర, చివరన’ అనే నిర్మాణం మరియు సమాంతర భాగంలోని ‘అంచునున్న తెర’ కలిసి ప్రతి జత యొక్క కలిపే చివరలోని తెరను సూచిస్తున్నాయి; తెలుగులో ‘చివరి తెర’ సహజంగా ఆ స్థానాన్ని తెలియజేస్తుంది.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: జత
  rationale: కలిపి ఒక విభాగంగా చేసిన తెరల సమూహాన్ని సూచించే సంబంధిత పదాలు. ఇక్కడ రెండు సమూహాలు ఉన్నందున ‘మొదటి జత’, ‘రెండవ జత’ సంక్షిప్తంగా, అర్థవంతంగా ఉన్నాయి.
- source_word: וְכֵן
  choice: అలాగే
  rationale: రెండవ సమూహానికి అదే విధమైన ఆదేశం వర్తిస్తుందని సహజంగా తెలియజేస్తుంది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: రెండు కలిపిన తెరల సమూహాల్లో రెండవదాన్ని నేరుగా గుర్తిస్తుంది.
