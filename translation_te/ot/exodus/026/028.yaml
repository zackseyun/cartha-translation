  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: te
  text: చట్రాల మధ్యలో ఉన్న నడిమి అడ్డకర్ర ఒక చివర నుండి మరో చివర వరకు సాగి ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: అడ్డకర్ర
  rationale: గుడారపు నిలువు నిర్మాణ భాగాలను కలిపి బిగించే అడ్డంగా అమర్చిన కర్రను సూచించే సహజమైన తెలుగు నిర్మాణ పదం.
- source_word: הַתִּיכֹן
  choice: నడిమి
  rationale: ఇతర అడ్డకర్రల మధ్య స్థానాన్ని సూచిస్తుంది; ‘నడిమి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְּתוֹךְ
  choice: మధ్యలోని
  rationale: చట్రాల మధ్య లేదా వాటి అంతర్భాగంలో ఉన్న స్థానాన్ని తెలుపుతుంది; అడ్డకర్ర రంధ్రాల గుండా వెళ్తుందని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַקְּרָשִׁים
  choice: చట్రాలు
  rationale: ఇవి గుడారంలోని నిలువు నిర్మాణ భాగాలు. ‘చట్రాలు’ అనే పదం వాటిని కేవలం పలుచని పలకలుగా భావించే అవకాశాన్ని తగ్గిస్తుంది; ‘పలకలు’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַבְרִחַ
  choice: విస్తరించి ఉండాలి
  rationale: హిఫిల్ క్రియారూపం ఇక్కడ అడ్డకర్ర ఒక అంచు నుంచి మరో అంచు వరకు సాగి ఉండడాన్ని వర్ణిస్తుంది. ‘విస్తరించి ఉండాలి’ రంధ్రాల గుండా పోవడం అనే అదనపు యాంత్రిక భావాన్ని చేర్చదు.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: ఒక చివర నుండి మరో చివర వరకు
  rationale: మొత్తం పొడవునా సాగడాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన, స్పష్టమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్దేశాత్మక సందర్భానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. మూలంలోని నిర్మాణ సంబంధ స్థలార్థాన్ని కాపాడుతూ, అడ్డకర్ర తప్పనిసరిగా రంధ్రాల గుండా వెళ్తుందనే నిర్ధారణను అనువాదంలో చేర్చలేదు.
