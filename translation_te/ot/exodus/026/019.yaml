translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ సూచనకు తగిన గంభీరమైన కాని సులభగ్రాహ్యమైన శైలి వాడబడింది. ‘అడుగుదిమ్మలు,’ ‘నిలువు చట్రాలు,’ ‘కుదురులు’ అనే పదాలు భాగాల పరస్పర సంబంధాన్ని స్పష్టంగా చూపుతాయి. హీబ్రూ వాక్యంలోని రెండవ క్రియ భావాన్ని తెలుగులో స్పష్టత కోసం చివర పునరుక్తం చేశాం.
