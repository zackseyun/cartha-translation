source:
  edition: WLC
  text: וְ/אַרְבָּעִים֙ אַדְנֵי כֶ֔סֶף תַּעֲשֶׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַ/קָּ֑רֶשׁ שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת הַ/קֶּ֤רֶשׁ הָ/אֶחָד֙ לִ/שְׁתֵּ֣י יְדֹתָ֔י/ו וּ/שְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת הַ/קֶּ֥רֶשׁ הָ/אֶחָ֖ד לִ/שְׁתֵּ֥י יְדֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: te
  text: 'ఇరవై నిలువు చట్రాల[b] కింద నలభై వెండి అడుగుదిమ్మలు[a] చేయాలి: ఒక చట్రపు రెండు కుదురులకు రెండు అడుగుదిమ్మలు, మరొక చట్రపు రెండు కుదురులకు రెండు అడుగుదిమ్మలు చేయాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెండి అడుగుదిమ్మలు’ అనే చోట ‘వెండి గాడిదిమ్మలు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం గుడార నిర్మాణంలో కుదురును అమర్చుకునే ఆధార భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయకంగా ‘పలకలు’ అని అనువదిస్తారు. హీబ్రూ పదం గుడారంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: వెండి అడుగుదిమ్మలు
  rationale: గుడార నిర్మాణ సందర్భంలో אֶדֶן నిలువు నిర్మాణ భాగాన్ని మోసే, దాని కుదురును అమర్చుకునే ఆధార భాగాన్ని సూచిస్తుంది. ‘అడుగుదిమ్మలు’ దాని ఆధారక మరియు గాడివంటి పనితీరును సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: చేయాలి
  rationale: עשה ధాతువు యొక్క రెండవ పురుష ఏకవచన అసంపూర్ణ రూపం ఇక్కడ ఆదేశార్థక బలంతో ఉంది. తెలుగులో ‘చేయాలి’ సహజంగా ఆ నిర్దేశాన్ని వ్యక్తం చేస్తుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: నిలువు చట్రాలకు దిగువన ఉన్న స్థానాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: నిలువు చట్రం
  rationale: קֶרֶשׁ గుడారంలోని నిలువుగా నిలిపే నిర్మాణ భాగాన్ని సూచిస్తుంది. ‘నిలువు చట్రం’ దాని నిర్మాణపరమైన పాత్రను తెలియజేస్తుంది; దాన్ని కేవలం పలుచని పలకగా ఊహింపజేయదు.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: దాని రెండు కుదురులకు
  rationale: యథార్థంగా ‘దాని రెండు చేతులకు’ అనే రూపం ఉన్నా, ఇక్కడ יָדוֹת అనేది అడుగుదిమ్మల్లో అమరే ముందుకు పొడుచుకొచ్చిన కలప కుదురులకు వాస్తుశిల్ప సంబంధ పదం. ‘కుదురులు’ తెలుగు వడ్రంగి పనిలో తగిన పదం.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ఒక చట్రం ... మరొక చట్రం
  rationale: హీబ్రూలో ‘ఒకటి’ అనే పదం పంపిణీ భావంలో పునరావృతమవుతుంది. ‘ఒక... మరొక...’ ప్రతి చట్రానికి రెండు అడుగుదిమ్మలు ఉండే అమరికను సహజ తెలుగులో నిలుపుతుంది.
