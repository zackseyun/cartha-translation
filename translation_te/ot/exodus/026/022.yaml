  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: te
  text: నివాస గుడారం వెనుక భాగానికి, పడమటి వైపున, ఆరు పలకలు చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పలకలు’ బదులు ‘చట్రాలు’ అని కూడా అనువదించవచ్చు, ఈ నిర్మాణ భాగాలను ఘనమైన పలకలుగా కాకుండా తెరచిన చట్రాలుగా అర్థం చేసుకుంటే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: వెనుక వైపున
  rationale: ఈ నిర్మాణ సందర్భంలో ఈ పదం మందిరపు దూరపు లేదా వెనుక భాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెనుక వైపున’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు
  rationale: నిర్గమకాండంలోని ఈ పదం దేవుని సన్నిధి నివసించే కదిలించగల పరిశుద్ధ నిర్మాణాన్ని సూచిస్తుంది. సందర్భంలో ‘మందిరం’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: יָמָּה
  choice: అంటే పడమటి వైపున
  rationale: ఈ దిశాసూచక పదానికి అక్షరార్థం ‘సముద్రం వైపు’; ఇక్కడ అది పడమటిని సూచిస్తుంది. వెనుక వైపు ఏ దిశలో ఉందో స్పష్టం చేయడానికి ‘అంటే’ చేర్చబడింది.
- source_word: תַּעֲשֶׂה
  choice: చేయాలి
  rationale: ఆజ్ఞాత్మక భావమున్న ద్వితీయ పురుష ఏకవచన క్రియను ఆధునిక తెలుగు నిర్దేశాత్మక శైలిలో ‘చేయాలి’గా అందించాం.
- source_word: שִׁשָּׁה
  choice: ఆరు
  rationale: తదుపరి నామవాచకాన్ని విశేషించే సంఖ్యకు నేరమైన అనువాదం.
- source_word: קְרָשִׁים
  choice: పలకలు
  rationale: మందిరపు గోడలను ఏర్పరచే చెక్క నిర్మాణ భాగాలను సూచించే సాంప్రదాయిక, సులభగ్రాహ్య పదం; అవి ఘనమైన పలకలా లేక చట్రాలలా అన్న నిర్మాణాత్మక అనిశ్చితిని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్దేశాత్మక శైలి వాడబడింది. దిశను స్పష్టీకరించేందుకు ‘అంటే పడమటి వైపున’ అని ఇచ్చాం; קְרָשִׁים యొక్క నిర్మాణ సంబంధమైన సందిగ్ధతను పాదసూచికలో కాపాడాం.
