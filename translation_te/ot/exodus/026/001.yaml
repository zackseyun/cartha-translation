id: EXO.26.1
reference: Exodus 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: te
  text: నివాసగుడారాన్ని పది తెరలతో చేయాలి. వాటిని సన్నగా పేనిన నారతోను నీలం, ఊదా, స్కార్లెట్ రంగుల నూలుతోను చేయాలి; నైపుణ్యమైన కళాకారుడి పనిగా రూపొందించిన కెరూబుల నమూనాలతో వాటిని చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నైపుణ్యమైన కళాకారుడి పనిగా కెరూబులను వాటిలో చేయాలి.” హీబ్రూ పదబంధం వస్త్రంలో కళాత్మకంగా రూపొందించిన నైపుణ్య పనిని సూచిస్తుంది; దాని ఖచ్చితమైన సాంకేతిక పద్ధతి పేర్కొనబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు గుడారం
  rationale: మִשְׁכָּן దేవుడు నివసించే పవిత్ర గుడారాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి సాంకేతిక భావం స్పష్టంగా ఉండేలా ‘మందిరపు గుడారం’ ఎంచుకున్నాం.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: ఈ నిర్మాణ సందర్భంలో ఈ పదం పెద్ద వస్త్రపు తెరలను లేదా పలకలవంటి వస్త్ర భాగాలను సూచిస్తుంది; ‘తెరలు’ సహజమైన తెలుగు.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר పేనిన లేదా మెలితిప్పిన దారాన్ని సూచిస్తాయి; ఈ అనువాదం పదార్థాన్నీ తయారీ విధానాన్నీ తెలియజేస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: గుడార నిర్మాణంలో వాడే నీలి రంగు వేసిన నూలు లేదా వస్త్ర పదార్థాన్ని సూచించే సాంప్రదాయ రంగు పదం.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: ఊదా రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; ‘ఊదా’ ఆధునిక తెలుగులో స్పష్టమైన రంగు పదం.
- source_word: תֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ పదబంధం స్కార్లెట్ లేదా క్రిమ్సన్ రంగు వేసిన దారాన్ని సూచిస్తుంది. వస్త్ర సందర్భాన్ని స్పష్టం చేయడానికి ‘నూలు’ చేర్చాం.
- source_word: כְּרֻבִים
  choice: కెరూబులు
  rationale: బైబిలు ఆరాధనా సందర్భంలోని ప్రత్యేక పరలోక జీవుల పేరును లిప్యంతరీకరించడం ద్వారా ఇతర సాధారణ దేవదూత చిత్రాలతో కలిగే గందరగోళాన్ని నివారించాం.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యం గల రూపకర్త పని
  rationale: ఈ పదబంధం వస్త్రంలో యోచించి రూపొందించిన కళాత్మక నైపుణ్య పనిని సూచిస్తుంది; కేవలం సాధారణ చేతిపని అనే భావానికి పరిమితం చేయలేదు.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: చేయాలి
  rationale: హీబ్రూ ఆజ్ఞాత్మక సూచనను ఆధునిక తెలుగు నిర్మాణ నిర్దేశాలకు సహజమైన విధంగా అందిస్తుంది; ప్రారంభ వావ్ మునుపటి ఆదేశాల కొనసాగింపును సూచించినా తెలుగు వాక్యంలో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: אֹתָם
  choice: వాటిని / వాటిలో
  rationale: బహువచన సర్వనామం పది తెరలను తిరిగి సూచిస్తుంది; తెలుగులో సందర్భానుగుణంగా స్పష్టంగా వ్యక్తపరిచాం.
theological_decisions:
- issue: కెరూబుల ఆకృతులు వస్త్రంపై ఎలా చేయబడ్డాయనే విధానం
  choice: వాటిలో ... నేయాలి
  alternative: కెరూబులతో వాటిని నైపుణ్యం గల రూపకర్త పనిగా చేయాలి
  rationale: మַעֲשֵׂה חֹשֵׁב నమూనాను వస్త్రంలో కళాత్మకంగా రూపొందించిన పనిని సూచిస్తుంది. సందర్భంలో నేయడం సాధ్యమైన అర్థం అయినప్పటికీ ఖచ్చిత సాంకేతిక విధానం పూర్తిగా నిర్దిష్టం కాదు; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. వస్త్ర పదార్థాల జాబితిని సహజ తెలుగు వాక్య నిర్మాణంలో అమర్చాం; మూలంలోని కళాత్మక తయారీ విధానంపై ఉన్న స్వల్ప అనిశ్చితిని పాదసూచికలో నిలిపాం.
