    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: పార్శ్వానికి
  rationale: צֶלַע ఇక్కడ శరీరంలోని ‘ప్రక్కటెముక’ను కాక, మందిర నిర్మాణంలోని ఒక వైపు లేదా పక్కగోడను సూచిస్తుంది. లְ ఉపసర్గ తరువాతి నిర్మాణ ఆదేశాన్ని పరిచయం చేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు
  rationale: మִשְׁכָּן నిర్గమకాండంలోని పవిత్ర గుడార నివాసాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకులకు సహజంగా ఉండే ‘మందిరం’ను సందర్భానుసారంగా వాడాం.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: ముందటి వచనంలో పేర్కొన్న మొదటి పొడవైన పార్శ్వానికి అనుగుణమైన రెండవ పార్శ్వమని విశేషణం స్పష్టంగా తెలుపుతుంది.
- source_word: לִפְאַת צָפוֹן
  choice: అంటే ఉత్తరం వైపున
  rationale: ఈ పదబంధం నిర్మాణపు దిశను సూచిస్తుంది. ‘ఉత్తరం వైపున’ ఆధునిక తెలుగులో సహజమైన దిశాసూచన; ‘అంటే’ రెండవ పార్శ్వాన్ని మరింత స్పష్టంగా గుర్తిస్తుంది.
- source_word: עֶשְׂרִים
  choice: ఇరవై
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదించాం.
- source_word: קָרֶשׁ
  choice: చట్రాలు
  rationale: కֶרֶשׁ గుడార మందిరపు గోడను ఏర్పరచే నిలువు నిర్మాణ భాగాలను సూచిస్తుంది. వాటి నిర్మాణాత్మక పాత్రను ‘చట్రాలు’ తెలియజేస్తుంది; సంప్రదాయ ‘పలకలు’ కూడా సాధ్యమైన అర్థమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన గంభీరమైన కానీ సులభమైన శైలిని వాడాం. హీబ్రూ వాక్యం క్రియలేని సంక్షిప్త నిర్మాణం; తెలుగు సహజత్వం కోసం సందర్భం సూచించే ‘చేయాలి’ని చేర్చాం.
