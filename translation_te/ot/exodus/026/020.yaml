- from: మందిరపు రెండవ పార్శ్వానికి, అంటే ఉత్తరం వైపున, ఇరవై చట్రాలు[a] చేయాలి.
  to: గుడారపు రెండవ ప్రక్కకు, ఉత్తర దిక్కున, ఇరవై చట్రాలు చేయాలి.[a]
  rationale: The revision replaces the temple-like term మందిరం with గుడారం for the tabernacle, renders the northern orientation directly, and retains the contextually supplied construction verb for fluent Telugu. The footnote is aligned with the revised terminology and clarifies the structural sense without overstating the precise form of the Hebrew items.
