source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ לַ/מָּסָ֗ךְ חֲמִשָּׁה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֤ אֹתָ/ם֙ זָהָ֔ב וָוֵי/הֶ֖ם זָהָ֑ב וְ/יָצַקְתָּ֣ לָ/הֶ֔ם חֲמִשָּׁ֖ה אַדְנֵ֥י נְחֹֽשֶׁת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: te
  text: ఆ ద్వారపు తెర[a] కోసం తుమ్మచెక్కతో ఐదు స్తంభాలు చేయాలి. వాటిని బంగారంతో పొదగాలి; వాటి కొంకాలు బంగారంతో ఉండాలి. ఆ స్తంభాల కోసం కంచుతో ఐదు ఆధారాలను[b] పోసి తయారుచేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడ్డతెర.’ ఇక్కడి హీబ్రూ పదం అతి పరిశుద్ధ స్థలంలోని లోపలి తెరను కాకుండా ప్రవేశద్వారంలో వేలాడే తెరను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సాకెట్లు.’ ఇవి స్తంభాలను నిలబెట్టే ఆధార భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: ద్వారపు తెర
  rationale: ఈ సందర్భంలో ఇది అతి పరిశుద్ధ స్థలంలోని లోపలి తెరను కాకుండా ప్రత్యక్ష గుడారపు ప్రవేశద్వారంలో వేలాడే తెరను సూచిస్తుంది. ‘ద్వారపు తెర’ ఈ భేదాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: తుమ్మచెక్కతో ఐదు స్తంభాలు
  rationale: עַמּוּדִים నిర్మాణానికి ఆధారమైన స్తంభాలను సూచిస్తుంది; שִׁטִּיםకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘తుమ్మచెక్క’ను ఉపయోగించాం.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: వాటికి బంగారు రేకు పొదగాలి
  rationale: צפה ఇక్కడ లోహంతో పైపూత వేయడం లేదా రేకు పొదగడం అనే అర్థం ఇస్తుంది. ‘బంగారు రేకు పొదగాలి’ వస్తువులను ఘన బంగారంతో చేయడం కాదని స్పష్టం చేస్తుంది.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కాలు
  rationale: ప్రత్యక్ష గుడార నిర్మాణ సందర్భంలో וָוִים తెరను బిగించడానికి లేదా వేలాడదీయడానికి ఉపయోగించే కొక్కాలను సూచించే అవకాశం ఎక్కువ.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: కంచుతో ఐదు పీఠాలు
  rationale: אַדָן స్తంభాన్ని నిలబెట్టే ఆధార భాగాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ‘పీఠాలు’ను ప్రధాన పాఠంలో ఉంచి, నిర్మాణపరమైన ‘గూటాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన లోహ సందర్భంలో נְחֹשֶׁתను ‘ఇత్తడి’ కంటే ‘కంచు’గా అనువదించడం సముచితం.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: వాటి కోసం ... పోత పోయాలి
  rationale: יצק లోహ వస్తువులను అచ్చులో పోసి తయారుచేయడాన్ని సూచిస్తుంది; לָהֶם ఆ పీఠాలు స్తంభాల కోసం తయారుచేయబడతాయని తెలియజేస్తుంది.
