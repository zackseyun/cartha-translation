translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞారూప భావాన్ని సహజంగా వ్యక్తం చేసే ‘చేయాలి’ నిర్మాణాన్ని ఉపయోగించాం. గుడార నిర్మాణానికి సంబంధించిన సాంకేతిక పదాలను సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, అవసరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
