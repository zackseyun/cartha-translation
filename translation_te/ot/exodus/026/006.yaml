source:
  edition: WLC
  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: te
  text: నీవు యాభై బంగారు కొక్కేలు చేసి, ఆ కొక్కేలతో తెరలను ఒకదానికొకటి[a] కలపాలి. అప్పుడు నివాస గుడారం ఒక్కటిగా అవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థం, “ప్రతి తెర తన సహోదరికి”; తెరలను పరస్పరం సరిపడేలా ఒకదానితో ఒకటి జతచేయాలని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేసి
  rationale: నిర్మాణ ఆదేశాల వరుసలో సంయుక్త క్రియారూపం ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; తరువాతి ‘కలపాలి’తో కలిసి తెలుగులో సహజమైన ఆదేశ వాక్యంగా ఉంటుంది.
- source_word: קַרְסֵי זָהָב
  choice: బంగారు కొక్కేలు
  rationale: קֶרֶס తెరలను కలిపే చిన్న fastening భాగాన్ని సూచిస్తుంది. ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా, ఈ సందర్భంలో ‘కొక్కేలు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וְחִבַּרְתָּ
  choice: కలపాలి
  rationale: חבר యొక్క ప్రాథమిక భావం కలపడం లేదా జతచేయడం; నిర్మాణ ఆదేశానికి ‘కలపాలి’ సహజమైన ఆధునిక తెలుగు.
- source_word: הַיְרִיעֹת
  choice: తెరలను
  rationale: యెరీయోత్ ఇక్కడ మందిరాన్ని ఏర్పరచే నేసిన వస్త్ర భాగాలు; ‘తెరలు’ స్థిరమైనదీ సులభంగా అర్థమయ్యేదీ అయిన పదం.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ఒకదానితో ఒకటి
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ తన సహోదరితో’ అనే హీబ్రూ పరస్పర సంబంధ నుడికారం; నిర్జీవమైన తెరల విషయంలో తెలుగు సహజ సమానార్థకం ‘ఒకదానితో ఒకటి’.
- source_word: בַּקְּרָסִים
  choice: ఆ కొక్కేలతో
  rationale: בְּ ఇక్కడ సాధనార్థకం; ముందే పేర్కొన్న కొక్కేలను సూచిస్తూ ‘ఆ కొక్కేలతో’ స్పష్టంగా ఉంటుంది.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: అప్పుడు మందిరం ఒక్కటిగా ఉంటుంది
  rationale: తెరలను కలపడం వల్ల కలిగే ఫలితాన్ని తెలుపుతుంది. מִשְׁכָּןకు ఈ నిర్గమకాండపు పవిత్రస్థల సందర్భంలో ‘మందిరం’ పాఠకులకు సహజమైన సాంకేతిక పదం; אֶחָד యొక్క ఏకత్వ భావాన్ని ‘ఒక్కటిగా’ నిలుపుతుంది.
theological_decisions:
- issue: הַמִּשְׁכָּן పదానికి అనువాదం
  choice: మందిరం
  alternative: నివాసం / ప్రత్యక్షపు గుడారం
  rationale: మూలపదానికి ‘నివాసస్థలం’ అనే వ్యుత్పత్తి భావం ఉన్నా, ఇక్కడ అది ఇశ్రాయేలు ఆరాధనా నిర్మాణానికి సాంకేతిక నామం. ‘మందిరం’ ఆధునిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా ఉంటుంది; అయితే ఇది శాశ్వత రాతి ఆలయాన్ని సూచిస్తుందని తప్పుగా గ్రహించే స్వల్ప అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన నిర్మాణ ఆదేశ శైలి. హీబ్రూ నుడికారాన్ని అక్షరార్థంగా కాక సహజమైన పరస్పర ప్రయోగంగా ఇచ్చాం. ఈ వచనంలో పాఠక అవగాహనకు అవసరమైన పాదటిప్పణి లేదు.
