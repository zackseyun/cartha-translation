base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: te
  text: తెరకు వెలుపల బల్లను ఉంచాలి[అ]; గుడారపు దక్షిణ పక్కన, బల్లకు ఎదురుగా దీపస్తంభాన్ని ఉంచాలి[ఆ]; బల్లను ఉత్తర పక్కన ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “తెర వెలుపల.” హెబ్రీ పదం అంతర్గత విభజన తెరను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: ఆ
    text: హెబ్రీలో “మెనోరా”; అర్థాన్ని తెలియజేయడానికి “దీపస్తంభం” అని అనువదించబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂמְתָּ
  choice: ఉంచాలి
  rationale: שׂוּם అంటే సందర్భానుసారం ‘పెట్టు, ఉంచు, అమర్చు.’ వస్తువుల స్థానాన్ని నిర్దేశిస్తున్న ఈ ఆజ్ఞలో ‘ఉంచాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַשֻּׁלְחָן
  choice: బల్ల
  rationale: మూలపదం ఇక్కడ కేవలం ‘బల్ల’ అని మాత్రమే చెబుతుంది; సమక్షపు రొట్టెల బల్ల అనే పూర్తి గుర్తింపును ఈ వచనంలో మూలానికి మించి చేర్చలేదు.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: తెరకు వెలుపల
  rationale: פָּרֹכֶת మందిరంలోని అంతర్గత విభజన తెరను సూచిస్తుంది. ‘తెర’ ఆధునిక తెలుగులో సహజమైన పదం; מִחוּץ అనే స్థానార్థాన్ని ‘వెలుపల’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభం
  rationale: లిప్యంతరీకరణకు బదులుగా వస్తువు అర్థాన్ని తెలుగులో తెలియజేస్తుంది; ఇది దీపాలను నిలిపే ప్రత్యేక మందిర సామగ్రిని సూచిస్తుంది.
- source_word: נֹכַח
  choice: ఎదురుగా
  rationale: ఒక వస్తువుకు మరొకటి ఎదురుగా ఉన్న పరస్పర స్థానాన్ని ఈ పదం సూచిస్తుంది.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: మందిరపు దక్షిణం వైపున
  rationale: צֶלַע అంటే ‘పక్క/వైపు,’ תֵּימָנָה దక్షిణ దిశను సూచిస్తుంది. తెలుగులో ‘దక్షిణం వైపున’ సహజమైన స్థాననిర్దేశం.
- source_word: תִּתֵּן
  choice: ఉంచాలి
  rationale: נָתַן విస్తృతార్థంలో ‘ఇవ్వు, పెట్టు, ఉంచు’ అని అర్థమవుతుంది; సామగ్రి స్థానాన్ని నిర్దేశించే సందర్భంలో ‘ఉంచాలి’ సరిపోతుంది.
- source_word: עַל צֶלַע צָפוֹן
  choice: ఉత్తరం వైపున
  rationale: צֶלַע స్థానంలోని వైపును, צָפוֹן ఉత్తర దిశను సూచిస్తాయి; ఈ రూపం స్పష్టంగా, సహజంగా ఉంది.
