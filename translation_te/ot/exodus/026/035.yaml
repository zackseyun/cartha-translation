  terminology: ‘దీపస్తంభం’ is a suitable meaning-based rendering of מְנוֹרָה. ‘గుడారం’ appropriately identifies the מִשְׁכָּן without importing the later temple concept. The supplied footnote anchors are retained in Telugu form.
