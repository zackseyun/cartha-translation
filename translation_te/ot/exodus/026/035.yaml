translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూప శైలి వాడబడింది. మִשְׁכָּן‌కు ఈ సందర్భంలో ‘మందిరం’ వాడి, గుడారం లోపలి పవిత్ర నిర్మాణాన్ని సూచించాం. హెబ్రీ వాక్యంలోని మూడు స్థాననిర్దేశాలను అర్ధవిరామాలతో నిలిపి, మూలంలోని సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం.
