  text: חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת תַּעֲשֶׂה֮ בַּ/יְרִיעָ֣ה הָ/אֶחָת֒ וַ/חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת תַּעֲשֶׂה֙ בִּ/קְצֵ֣ה הַ/יְרִיעָ֔ה אֲשֶׁ֖ר בַּ/מַּחְבֶּ֣רֶת הַ/שֵּׁנִ֑ית מַקְבִּילֹת֙ הַ/לֻּ֣לָאֹ֔ת אִשָּׁ֖ה אֶל אֲחֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: te
  text: ఒక తెర అంచున యాభై కొలుకులు చేయాలి; రెండవ సముదాయంలోని తెర అంచున కూడా యాభై కొలుకులు చేయాలి. ఆ కొలుకులు ఒకదానికొకటి ఎదురెదురుగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కొలుకులు—ఒక స్త్రీ తన సహోదరి వైపు”; ఇది అవి తమ జతలతో సరిపడేలా ఎదురెదురుగా అమరాలని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: కొలుకులు
  rationale: గుడారపు తెరలను కలపడానికి చేసిన ఉంగరంలాంటి వస్త్రపు అమరికలను సూచిస్తుంది. తదుపరి వచనంలోని లోహపు కొక్కేలతో వీటిని వేరు చేస్తూ, తెలుగులో సహజమైన ‘కొలుకులు’ను ఎంచుకున్నాం.
- source_word: יְרִיעָה
  choice: తెర
  rationale: ఈ సందర్భంలో మందిర గుడారాన్ని కప్పే పెద్ద వస్త్ర భాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెర’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הָאֶחָת
  choice: ఒక
  rationale: హీబ్రూ పదం క్రమాన్ని స్పష్టంగా ‘మొదటి’ అని చెప్పకుండా, జతలోని ఒక తెరను సూచిస్తుంది. అందువల్ల ‘ఒక’ అని అనువదించాం.
- source_word: קְצֵה
  choice: అంచు
  rationale: తెర వెలుపలి సరిహద్దును సూచిస్తుంది; కుట్టి కలిపే సందర్భంలో ‘అంచు’ సరైన పదం.
- source_word: מַחְבֶּרֶת
  choice: సముదాయం
  rationale: ముందటి వచనాల్లో కలిపిన తెరల గుంపును సూచిస్తుంది. ఫలితంగా ఏర్పడిన సమూహాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘సముదాయం’ వాడాం.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: కలిపిన రెండు తెరల సముదాయాల్లో రెండవదాన్ని నేరుగా గుర్తిస్తుంది.
- source_word: מַקְבִּילֹת
  choice: ఎదురెదురుగా ఉండాలి
  rationale: రెండు అంచులపై ఉన్న కొలుకులు పరస్పరం సరిపడేలా ఎదురుగా అమరడాన్ని సూచించే స్థలార్థాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ఒకదానికొకటి
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ తన సహోదరి వైపు’ అనే హీబ్రూ నుడికారం సమాన వస్తువులు పరస్పరం సరిపడి ఉండడాన్ని సూచిస్తుంది. సహజ తెలుగులో ‘ఒకదానికొకటి’ ఆ భావాన్ని అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
