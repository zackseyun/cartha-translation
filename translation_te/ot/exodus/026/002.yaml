base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: te
  text: ప్రతి తెర పొడవు ఇరవై ఎనిమిది మూరలు[a] కాగా, దాని వెడల్పు నాలుగు మూరలు ఉండాలి; అన్ని తెరలకూ ఒకే కొలత ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూర అనేది ప్రాచీన పొడవు కొలమానం (క్యూబిట్). దాని ఖచ్చిత పొడవు మారవచ్చు; సాధారణ అంచనా ప్రకారం ఒక మూర సుమారు 45 సెంటీమీటర్లు. అందువల్ల ఇరవై ఎనిమిది మూరలు సుమారు 12.6 మీటర్లు, నాలుగు మూరలు సుమారు 1.8 మీటర్లు.
    reason: measurement_clarification
lexical_decisions:
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: కొలతలను తెలిపే సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం.
- source_word: הַיְרִיעָה
  choice: తెర
  rationale: మందిరపు వస్త్ర నిర్మాణ సందర్భంలో పెద్ద వస్త్రపు భాగాన్ని సూచించే సహజమైన పదం.
- source_word: הָאַחַת / הָאֶחָת
  choice: ఒక్కొక్క
  rationale: హెబ్రీ భాషలోని ‘ఒకటి’ అనే పంపిణీ ప్రయోగం ప్రతి తెరకు విడివిడిగా ఇదే కొలత వర్తిస్తుందని సూచిస్తుంది.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: ఇరవై ఎనిమిది
  rationale: సంఖ్యకు ప్రామాణిక తెలుగు రూపం.
- source_word: בָּאַמָּה
  choice: మూరలు
  rationale: אַמָּה అనే ప్రాచీన పొడవు ప్రమాణానికి తెలుగులో సంప్రదాయంగా వాడే సమానార్థక కొలమానం.
- source_word: וְרֹחַב
  choice: వెడల్పు
  rationale: పొడవుతో జతగా కొలతను తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אַרְבַּע
  choice: నాలుగు
  rationale: సంఖ్యకు నేరమైన తెలుగు రూపం.
- source_word: מִדָּה אַחַת
  choice: కొలత ఒక్కటే
  rationale: ‘ఒకే కొలత’ అనే మూలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכָל הַיְרִיעֹת
  choice: తెరలన్నిటికీ
  rationale: ఒకే ప్రమాణం మొత్తం తెరల సముదాయానికి వర్తిస్తుందని స్పష్టంగా తెలియజేస్తుంది.
