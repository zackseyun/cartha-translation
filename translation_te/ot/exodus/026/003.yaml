translation:
  language: te
  text: ఐదు తెరలను ఒకదానితో ఒకటి[a] కలపాలి; ఐదు తెరలను ఒకదానితో ఒకటి కలపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక స్త్రీ తన సోదరితో.’ స్త్రీలింగ నామవాచకాలతో సూచించిన వస్తువులు ఒకదానితో ఒకటి జతచేయబడడాన్ని తెలిపే హీబ్రూ నుడికారం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: మందిర నిర్మాణ సందర్భంలో ఈ పదం పెద్ద వస్త్రపు తెరలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెరలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: תִּהְיֶיןָ חֹבְרֹת
  choice: కలపాలి
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం ఇక్కడ నిర్మాణ ఆదేశాన్ని తెలియజేస్తుంది. ‘కలపాలి’ ఆ నిర్దేశక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ఒకదానితో ఒకటి
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ తన సహోదరితో’ అనే స్త్రీలింగ వస్తువులకు సంబంధించిన హీబ్రూ నుడికారం; తెలుగులో పరస్పర అనుసంధానాన్ని ‘ఒకదానితో ఒకటి’ సహజంగా తెలియజేస్తుంది.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: ఐదు ... మిగిలిన ఐదు
  rationale: పది తెరలను రెండు ఐదేసి సమూహాలుగా విభజిస్తున్న సందర్భాన్ని తెలుగులో స్పష్టంగా చూపడానికి రెండవ సమూహానికి ‘మిగిలిన’ వాడబడింది; ఇది సందర్భసిద్ధమైన స్పష్టీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మొదటి వాక్యభాగంతో రెండవ వాక్యభాగం గందరగోళం కాకుండా ‘మిగిలిన’ అనే సందర్భసిద్ధ స్పష్టీకరణ వాడబడింది.
