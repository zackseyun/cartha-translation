source:
  edition: WLC
  text: וְ/חִבַּרְתָּ֞ אֶת חֲמֵ֤שׁ הַ/יְרִיעֹת֙ לְ/בָ֔ד וְ/אֶת שֵׁ֥שׁ הַ/יְרִיעֹ֖ת לְ/בָ֑ד וְ/כָפַלְתָּ֙ אֶת הַ/יְרִיעָ֣ה הַ/שִּׁשִּׁ֔ית אֶל מ֖וּל פְּנֵ֥י הָ/אֹֽהֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: te
  text: నీవు ఐదు తెరలను ఒక సమూహంగా, ఆరు తెరలను మరో సమూహంగా కలపాలి. ఆరవ తెరను గుడారం ముందుభాగం ఎదుట[a] రెండుగా మడవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గుడారం ముందుభాగం వైపు.’
    reason: אֶל מוּל פְּנֵי అనే స్థానవాచక పదబంధాన్ని ‘ఎదుట’ లేదా దిశను నొక్కిచెప్పే విధంగా ‘వైపు’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: కలపాలి
  rationale: חָבַר అంటే కలపడం లేదా అనుసంధానించడం. ఇక్కడ తెరలను రెండు వేర్వేరు సమూహాలుగా కలిపే నిర్మాణాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: తెరలు / తెర
  rationale: ఈ పదం గుడార నిర్మాణంలో ఉపయోగించే వస్త్రపు కప్పులను సూచిస్తుంది. సాధారణ పాఠకులకు ‘తెరలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְבָד
  choice: ఒక సమూహంగా … మరో సమూహంగా
  rationale: ఇక్కడ לְבָד ఐదు తెరలు ఒక ప్రత్యేక సమూహంగా, ఆరు తెరలు మరో ప్రత్యేక సమూహంగా ఉండాలని సూచిస్తుంది. పదశః ‘విడిగా’ అనడం కంటే ఈ రూపం ఉద్దేశాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָפַלְתָּ
  choice: రెండుగా మడవాలి
  rationale: ఈ క్రియ రెట్టింపు చేయడం లేదా మడతపెట్టడం అనే భావాన్ని ఇస్తుంది. ‘రెండుగా మడవాలి’ అనేది ఆరవ తెరను రెట్టింపుగా మడిచే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַשִּׁשִּׁית
  choice: ఆరవ
  rationale: ‘తెర’ను విశేషించే క్రమసంఖ్యకు నేరమైన తెలుగు రూపం.
- source_word: אֶל מוּל פְּנֵי
  choice: ముందుభాగానికి ఎదురుగా
  rationale: ఈ సంయుక్త స్థానవాచక పదబంధం గుడారం ముఖభాగాన్ని ఎదుర్కొనే లేదా దాని వైపున ఉండే స్థానాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో దాని దిశాత్మక భావాన్ని నిలుపుకున్నాం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: హీబ్రూ పదం ఇక్కడ నేరుగా ‘గుడారం’ అని అర్థం. సందర్భం పవిత్ర గుడారాన్ని సూచించినప్పటికీ, మూలపదాన్ని అనవసరంగా విశదీకరించకుండా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞారూప సందర్భానికి తగిన గౌరవప్రదమైన ‘నీవు … కలపాలి/మడవాలి’ నిర్మాణం వాడబడింది. సాంకేతిక నిర్మాణ వివరాన్ని సాధారణ పాఠకులకు స్పష్టంగా చేయడానికి రెండు తెరల సముదాయాలను ‘ఒక సమూహంగా … మరో సమూహంగా’ అని వ్యక్తం చేశాం.
