    text: లేదా, “ఒక వైపున ఒక మూర, మరొక వైపున ఒక మూర.” హెబ్రీలో ప్రదర్శక పదాలతో “ఆ మూర” అనే మాట రెండుసార్లు వస్తుంది; ప్రతి వైపున మిగిలే కొలతను అది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నివాసగుడారం” హెబ్రీ మిష్కాన్‌ను అనువదిస్తుంది; ఇది గుడారపు కప్పు కిందనున్న పవిత్ర నివాస నిర్మాణాన్ని సూచిస్తుంది.
    reason: cultural_note
  revision_rationale: The revision replaces the temple-associated term “మందిరం” with “నివాసగుడారం,” preserving the source distinction between the tent curtains and the sacred dwelling structure. It also recasts the predicate so that the overhanging action and its purpose, “to cover it,” are clear and idiomatic in modern standard Telugu. Both supplied footnote anchors are retained and their notes are aligned with the revised terminology.
