source:
  edition: WLC
  text: וְ/הָ/אַמָּ֨ה מִ/זֶּ֜ה וְ/הָ/אַמָּ֤ה מִ/זֶּה֙ בָּ/עֹדֵ֔ף בְּ/אֹ֖רֶךְ יְרִיעֹ֣ת הָ/אֹ֑הֶל יִהְיֶ֨ה סָר֜וּחַ עַל צִדֵּ֧י הַ/מִּשְׁכָּ֛ן מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה לְ/כַסֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: te
  text: గుడారపు తెరల పొడవులో మిగిలిన భాగంలోని ఈ వైపు ఒక మూర, ఆ వైపు ఒక మూర[a], నివాసగుడారం పక్కల మీద ఈ వైపునా ఆ వైపునా దానిని కప్పడానికి వేలాడి ఉండాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వైపున ఒక మూర, మరొక వైపున ఒక మూర.” హెబ్రీలో ప్రదర్శక పదాలతో “ఆ మూర” అనే మాట రెండుసార్లు వస్తుంది; ప్రతి వైపున మిగిలే కొలతను అది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నివాసగుడారం” హెబ్రీ మిష్కాన్‌ను అనువదిస్తుంది; ఇది గుడారపు కప్పు కిందనున్న పవిత్ర నివాస నిర్మాణాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: ఒక మూర
  rationale: אַמָּה ప్రాచీన పొడవు కొలత. సందర్భంలో ప్రతి వైపున మిగిలే కొలతను సూచిస్తున్నందున సహజమైన తెలుగులో ‘ఒక మూర’ అని అనువదించాం.
- source_word: מִזֶּה ... מִזֶּה
  choice: ఈ వైపు ... ఆ వైపు
  rationale: ఎదురెదురు వైపులను సూచించే హెబ్రీ ప్రదర్శక పదబంధాన్ని సహజంగా, దాని పునరుక్తిని నిలుపుతూ అనువదించాం.
- source_word: בָּעֹדֵף
  choice: మిగిలిన దానిలో
  rationale: తెరల పొడవులో నిర్మాణపు కొలతకు మించి మిగిలిన భాగాన్ని సూచిస్తుంది.
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: నిర్మాణ సందర్భంలోని సాధారణ స్థలపరమైన అర్థాన్ని నేరుగా తెలిపే పదం.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: గుడారపు తెరలు
  rationale: יְרִיעֹת వస్త్రపు తెర పలకలను, הָאֹהֶל అవి గుడారానికి చెందినవని సూచిస్తాయి.
- source_word: יִהְיֶה סָרוּחַ
  choice: వేలాడుతూ ... కప్పాలి
  rationale: మిగిలిన వస్త్రం పక్కల మీదుగా కిందికి వేలాడే భౌతిక చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఏకవచన హెబ్రీ క్రియ మొత్తం మిగులు భాగాన్ని సూచిస్తుంది.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: మందిరపు ఇరువైపులా
  rationale: מִשְׁכָּן దేవుడు నివసించే పవిత్ర నిర్మాణాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘మందిరం’ సహజంగా ఉన్నప్పటికీ, ఇది తరువాతి శాశ్వత దేవాలయం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: לְכַסֹּתוֹ
  choice: దాన్ని కప్పాలి
  rationale: వేలాడే అదనపు వస్త్రపు ఉద్దేశాన్ని తెలిపే ప్రయోజనార్థక క్రియారూపం.
theological_decisions:
- issue: מִשְׁכָּן అనే పవిత్ర నిర్మాణ పదానికి అనువాదం
  choice: మందిరం
  alternative: నివాసస్థలం / ప్రత్యక్ష గుడారం
  rationale: సాధారణ పాఠకులకు సహజమైన పవిత్ర నిర్మాణ పదాన్ని ఎంచుకుని, ఇది గుడారపు కప్పు కిందనున్న తరలించగల దేవుని నివాస నిర్మాణమని పాదసూచికలో పరిమితం చేశాం; తరువాతి దేవాలయంతో సమానమని నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ సూచనకు తగిన గంభీరమైన కాని సులభమైన శైలిని వాడాం. హెబ్రీలోని ‘ఈ వైపు ... ఆ వైపు’ సమాంతరతను నిలిపి, తెలుగులో పునరుక్తి భారాన్ని తగ్గించేందుకు తరువాత ‘ఇరువైపులా’ అని సంక్షిప్తం చేశాం. అన్ని పాదసూచిక సూచికలు ప్రధాన వచనంలో ఉంచబడ్డాయి.
