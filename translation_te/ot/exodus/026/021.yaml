source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים אַדְנֵי/הֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָֽ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: te
  text: వాటి నలభై దిమ్మలు[a] వెండితో చేయాలి—ఒక నిలువు పలక[b] కింద రెండు దిమ్మలు, మరొక నిలువు పలక కింద రెండు దిమ్మలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుదురులు’; హీబ్రూ పదం గుడారపు నిలువు పలకలను అమర్చే వెండి ఆధారాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చట్రం’; సంప్రదాయంగా ‘పలక’ అని అనువదించే హీబ్రూ పదం గుడారంలోని ఒక్కొక్క నిటారు నిర్మాణ భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים אַדְנֵיהֶם
  choice: వాటి నలభై దిమ్మలు
  rationale: సంఖ్యను, సంబంధాన్ని నేరుగా నిలుపుతూ, ముందరి వాక్యానికి వావ్ కలిపే కొనసాగింపును తెలుగులో సహజమైన వాక్య నిర్మాణంలో వ్యక్తం చేసింది.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: దిమ్మలు
  rationale: గుడారపు నిలువు పలకలు అమర్చబడే వెండి ఆధారాలను సూచించే నిర్మాణపరమైన పదంగా ‘దిమ్మలు’ సహజంగా, సంక్షిప్తంగా ఉంటుంది; ‘కుదురులు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: כָּסֶף
  choice: వెండితో చేయాలి
  rationale: మూలంలోని పదార్థ సూచనను తెలుగులో సహజమైన నిర్మాణ ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: תַּחַת
  choice: కింద
  rationale: భౌతిక స్థానాన్ని తెలిపే నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: הַקֶּרֶשׁ
  choice: నిలువు పలక
  rationale: ఈ పదం గుడారంలోని నిటారుగా నిలిపే నిర్మాణ భాగాన్ని సూచిస్తుంది. ‘పలక’ మాత్రమే అనడం కంటే ‘నిలువు పలక’ దాని పనితీరును స్పష్టపరుస్తుంది; ‘చట్రం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ఒక ... మరొక
  rationale: హీబ్రూలో ఒకే నిర్దిష్ట పదబంధం పునరావృతమైనా, సందర్భంలో రెండు వేర్వేరు పలకల కింద ఉండే సమాన అమరికను పంపిణీ భావంతో సూచిస్తుంది. ‘ఒక ... మరొక’ తెలుగులో ఆ భావాన్ని అపార్థం లేకుండా సహజంగా తెలియజేస్తుంది.
