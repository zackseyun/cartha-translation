source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: te
  text: నీలం, ఊదా, కెంపు నూలుతోను సన్నని మెలితిప్పిన నారతోను గుడారపు ప్రవేశద్వారానికి ఒక తెరను[a] చేయాలి; అది ఎంబ్రాయిడరీ పనిగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్వారపు పరదా’ లేదా ‘ప్రవేశాన్ని కప్పే అడ్డతెర.’ ఈ అధ్యాయంలో చెప్పబడిన లోపలి అడ్డతెర నుండి దీనిని వేరుగా గుర్తించడానికి ఇక్కడ ‘తెర’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: తెర
  rationale: ప్రవేశాన్ని కప్పే లేదా విభజించే వేలాడే వస్త్రాన్ని సూచించే సహజమైన తెలుగు పదం. లోపలి అడ్డతెరతో ఉన్న భేదాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: לְפֶתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారానికి
  rationale: פֶתַח యొక్క ప్రవేశం/ద్వారం భావాన్ని, אֹהֶל యొక్క గుడారం అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: ప్రతిష్ఠాత్మకమైన నీలం లేదా ఊదా ఛాయగల నీలి రంగు పదార్థాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు 'నీలం' స్పష్టంగా ఉంటుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: ఊదా రంగు వేసిన వస్త్ర పదార్థానికి సాధారణమైన, సులభంగా అర్థమయ్యే అనువాదం.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ వస్త్రనిర్మాణ సందర్భంలో పదబంధం పురుగును అక్షరార్థంగా కాక, కాంతివంతమైన ఎర్ర రంగు వేసిన నూలును సూచిస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: మెలితిప్పిన సన్నని నార
  rationale: שֵׁשׁ సూచించే సన్నని నారను, מָשְׁזָר సూచించే మెలితిప్పిన దారపు తయారీని రెండింటినీ నిలుపుతుంది.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: నైపుణ్యంగల అల్లిక పని
  rationale: రంగులతో అలంకారంగా వస్త్రాన్ని రూపొందించే నిపుణుడి పనిని సూచిస్తుంది; తెలుగు వస్త్రకళ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్మాణ ఆదేశాల వరుసలో ఉన్న నిర్దేశక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన నిర్మాణ-ఆదేశ శైలి. వస్త్ర పదార్థాల జాబితాను సులభంగా చదవగల క్రమంలో ఉంచుతూ, మూలంలోని రంగులు, మెలితిప్పిన నార, నైపుణ్య వస్త్రపని అనే అంశాలను నిలిపింది.
