id: EXO.26.31
reference: Exodus 26:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: te
  text: “నీలం, ఊదా, ఎర్రని నూలుతోను, మెలికలు వేసిన సన్నని నారతోను ఒక అడ్డతెర చేయాలి. దానిని కళాత్మక నైపుణ్యంతో, కెరూబుల రూపాలతో చేయాలి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָרֹכֶת
  choice: అడ్డతెర
  rationale: ఇది పరిశుద్ధ స్థలాన్ని అతి పరిశుద్ధ స్థలం నుంచి వేరుచేసే లోపలి తెరను సూచిస్తుంది. సాధారణ ‘తెర’ కంటే ‘అడ్డతెర’ దాని విభజన కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: ప్రతిష్ఠాత్మకంగా రంగు వేసిన వస్త్రపు నీలి వర్ణాన్ని సూచిస్తుంది; జాబితా సందర్భంలో ‘నూలు’ అనే పదం మూడు రంగులకూ సమష్టిగా వర్తిస్తుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: గుడారపు వస్త్రాల వర్ణనలో కనిపించే విలాసవంతమైన ఊదా రంగుకు సహజమైన ఆధునిక తెలుగు పదం.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఇది కేవలం రంగు పేరుకాక ఎర్రని రంగు వేసిన పదార్థాన్ని సూచిస్తుంది. ‘ఎర్రని నూలు’ వస్త్రనిర్మాణ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ నాణ్యమైన సన్నని నారను, מָשְׁזָר పేనిన లేదా మెలిపెట్టిన నిర్మాణాన్ని సూచిస్తాయి; ఈ రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంగల కళాకారుని పనిగా
  rationale: ఈ పదబంధం సాధారణ తయారీని కాక కళాత్మక నైపుణ్యంతో చేసిన పనిని సూచిస్తుంది; ఒక నిర్దిష్ట ఆధునిక వృత్తి పద్ధతికి దాన్ని పరిమితం చేయదు.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: రూపొందించాలి
  rationale: హీబ్రూలో మూడవ పురుష ఏకవచన క్రియతో ఉన్న సూచనను తెలుగులో సహజమైన విధిగా వ్యక్తం చేస్తుంది; కళాకారుడే పని చేసే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: כְּרֻבִים
  choice: కెరూబులు
  rationale: ఈ పరలోక జీవులకు వాడుకలో ఉన్న బైబిలు పారిభాషిక రూపాన్ని నిలుపుతూ, అవి తెర రూపకల్పనలో భాగమని ‘దానిపై’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: గుడారపు అడ్డతెర మరియు కెరూబుల గురించి తరువాతి కాలపు ప్రతీకాత్మక అర్థాలను వాక్యంలో చేర్చాలా
  choice: నిర్మాణం, పదార్థాలు, కళాత్మక రూపకల్పనకు సంబంధించిన ప్రత్యక్ష ఆజ్ఞగానే అనువదించడం
  alternative: అడ్డతెరకు తరువాతి బైబిలు లేదా సిద్ధాంత సంబంధమైన ప్రతీకాత్మక భావాన్ని ప్రధాన వాక్యంలో ముందుకు తేవడం
  rationale: ఈ వచనం గుడార నిర్మాణానికి సంబంధించిన స్పష్టమైన ఆదేశాన్ని మాత్రమే ఇస్తుంది. తరువాతి వేదాంత సంబంధాలను అనువాదంలోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణ ఆదేశ శైలిని వాడాం. రంగులన్నిటికీ ‘నూలు’ సమష్టిగా వర్తించేలా వాక్యాన్ని కూర్చాం. ‘నైపుణ్యంగల కళాకారుడు’ అనే రూపం మַעֲשֵׂה חֹשֵׁב లోని కళాత్మక నైపుణ్యాన్ని నిలుపుతుంది; ‘నేతగాడు’ లేదా ‘ఎంబ్రాయిడరీ’ వంటి అతిగా నిర్దిష్టమైన పద్ధతిని నిర్ణయించదు.
