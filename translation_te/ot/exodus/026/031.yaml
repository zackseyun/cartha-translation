revisions:
- from: “నీలం, ఊదా, ఎర్రని నూలుతో, సన్నగా పేనిన నారతో ఒక అడ్డతెర[a] చేయాలి. నైపుణ్యంగల కళాకారుని పనిగా దానిపై కెరూబులను[b] రూపొందించాలి.”
  to: “నీలం, ఊదా, ఎర్రని నూలుతోను, మెలికలు వేసిన సన్నని నారతోను ఒక అడ్డతెర చేయాలి. దానిని కళాత్మక నైపుణ్యంతో, కెరూబుల రూపాలతో చేయాలి.”
  rationale: The revision retains every stated material and color, the fine twisted linen, the skilled artistic workmanship, and the cherubim. It avoids assigning a particular method of depiction or locating the figures merely on the veil’s surface. The sole footnote gives the legitimate lexical alternative and immediate architectural function of the divider without importing later theological interpretation.
