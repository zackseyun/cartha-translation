  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: te
  text: ఎనిమిది చట్రాలు[a] ఉండాలి; వాటికి వెండితో చేసిన పదహారు ఆధారాలు[b] ఉండాలి—ఒక్కో చట్రం కింద రెండు ఆధారాలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పలకలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దిమ్మలు” లేదా “సాకెట్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: చట్రాలు
  rationale: నివాస మందిర నిర్మాణ సందర్భంలో ఇవి నిలువుగా ఉండే నిర్మాణ భాగాలు. ‘చట్రాలు’ వాటి నిర్మాణాత్మక పనిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పలకలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: పీఠాలు
  rationale: చట్రాల కింద వాటికి ఆధారంగా ఉండే భాగాలను సూచిస్తుంది. ‘పీఠాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘దిమ్మలు’ నిర్మాణ సందర్భంలో సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఆధార భాగాలు ఏ పదార్థంతో చేయబడాలో నేరుగా తెలిపే పదం.
- source_word: שִׁשָּׁה עָשָׂר
  choice: పదహారు
  rationale: మూలంలోని సంఖ్యకు ప్రామాణిక తెలుగు రూపం.
- source_word: תַּחַת
  choice: కింద
  rationale: నిర్మాణ సూచనలో స్థాన సంబంధాన్ని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: ఒక్కో చట్రం
  rationale: హీబ్రూలో పునరుక్తమైన ‘ఒక చట్రం’ అనే పంపిణీ భావాన్ని తెలుగులో ‘ఒక్కో చట్రం’ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; ప్రతి చట్రం కింద రెండు పీఠాలు ఉండాలనే భావం సందర్భం మరియు మొత్తం సంఖ్యతో స్పష్టమవుతుంది.
- source_word: וְהָיוּ
  choice: అవి ... ఉండాలి
  rationale: మునుపటి నిర్మాణ వివరణను కొనసాగించే సంధాన భావాన్ని ‘అవి’ ద్వారా నిలుపుతూ, నిర్దేశాత్మక సందర్భానికి తగిన విధంగా ‘ఉండాలి’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ నిర్దేశానికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. మూలంలోని పదహారు పీఠాలు, ప్రతి చట్రానికి రెండు చొప్పున అనే పంపిణీ సంబంధం స్పష్టంగా ఉంచబడింది.
