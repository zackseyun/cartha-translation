  to: ఎనిమిది చట్రాలు[a] ఉండాలి; వాటికి వెండితో చేసిన పదహారు ఆధారాలు[b] ఉండాలి—ఒక్కో చట్రం కింద రెండు ఆధారాలు ఉండాలి.
