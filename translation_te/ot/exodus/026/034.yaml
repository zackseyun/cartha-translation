lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: నీవు … ఉంచాలి
  rationale: సూచనల వరుసలో సంయోజకంతో వచ్చిన Qal perfect ద్వితీయ పురుష ఏకవచన రూపం ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఉంచాలి’ ఆ నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసం పైన ఉంచే మూతను, ప్రాయశ్చిత్త ఆచారంతో దాని సంబంధాన్ని సూచిస్తుంది. ‘కరుణాపీఠం’ అనే సంప్రదాయ పదం వస్తువు మూత అనే భావాన్ని అస్పష్టం చేయగలదు కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל
  choice: మీద
  rationale: మందసం పైభాగంలో మూతను ఉంచడాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן הָעֵדֻת
  choice: సాక్ష్య మందసం
  rationale: హీబ్రూ పాఠంలో ‘నిబంధన మందసం’ కాక ‘సాక్ష్య మందసం’ అని ఉంది. పవిత్ర పెట్టెకు స్థిరపడిన ‘మందసం’ అనే పదాన్ని నిలిపి, మూలపాఠంలోని సంబంధాన్ని యథాతథంగా కాపాడాం.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలంలో
  rationale: ‘పరిశుద్ధతల పరిశుద్ధత’ అనే హీబ్రూ అత్యుత్తమతా నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: כַּפֹּרֶת అనే ఆరాధనా వస్తువు పేరును ఎలా అనువదించాలి
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం
  rationale: ప్రధాన పాఠంలో వస్తువు మూత అనే స్వరూపాన్నీ, ప్రాయశ్చిత్తంతో దాని సంబంధాన్నీ చూపించాం; ‘కరుణాపీఠం’ అనే సంప్రదాయ పదాన్ని ప్రత్యామ్నాయంగా ఇచ్చి, అదనపు సిద్ధాంతార్థాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
- issue: אֲרוֹן הָעֵדֻת లోని హీబ్రూ సంబంధాన్ని నిలుపుకోవాలా, సంప్రదాయంగా ‘నిబంధన మందసం’ అని మార్చాలా
  choice: సాక్ష్య మందసం
  alternative: నిబంధన మందసం
  rationale: మూలపాఠంలో స్పష్టంగా ‘సాక్ష్యం’ ఉన్నందున దానినే ప్రధాన పాఠంలో కాపాడాం; పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: కֹדֶשׁ הַקֳּדָשִׁים అనే అత్యుత్తమతా నుడికారాన్ని ఎలా వ్యక్తం చేయాలి
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధాతిపరిశుద్ధ స్థలం
  rationale: ఎటువంటి ప్రత్యేక మతశాఖ పదజాలాన్ని రుద్దకుండా, సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే రూపాన్ని ఎంచుకుని సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన ఆజ్ఞారూపాన్ని వాడాం. గుడార ఆరాధనకు సంబంధించిన గౌరవప్రదమైన పదజాలాన్ని నిలిపినా, సాధారణ పాఠకునికి వస్తువు మరియు స్థలం స్పష్టంగా అర్థమయ్యేలా ‘ప్రాయశ్చిత్త మూత’, ‘అతి పరిశుద్ధ స్థలం’ అనే రూపాలను ఎంచుకున్నాం.
