    text: ‘చట్రాలు’కు బదులుగా ‘పలకలు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం నివాస గుడారంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
