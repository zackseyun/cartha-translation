translation:
  language: te
  text: నివాస గుడారం యొక్క ఒక ప్రక్క చట్రాల కొరకు తుమ్మచెక్కతో ఐదు అడ్డకర్రలు చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
