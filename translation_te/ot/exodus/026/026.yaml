lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్మాణ ఆదేశాల వరుసలో సంయోజకంతో వచ్చిన Qal perfect ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְרִיחִם
  choice: అడ్డకర్రలు
  rationale: ఇవి చట్రాలను కలిపి నిలబెట్టే నిర్మాణ కర్రలు; ‘అడ్డకర్రలు’ సందర్భానుకూలంగా స్పష్టంగా ఉంది, మూలంలో లేని అదనపు సాంకేతిక నిర్దిష్టతను చేర్చదు.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטָּה సూచించే అకేషియా జాతి కలపకు తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: חֲמִשָּׁה
  choice: ఐదు
  rationale: అడ్డకర్రల సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: לְקַרְשֵׁי
  choice: చట్రాల కోసం
  rationale: కֶרֶשׁ ఇక్కడ మందసం యొక్క నిలువు నిర్మాణ భాగాలను సూచిస్తుంది; వాటి నిర్మాణ విధిని ఆధునిక పాఠకునికి ‘చట్రాలు’ స్పష్టంగా తెలియజేస్తుంది. ‘పలకలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: צֶלַע
  choice: వైపు
  rationale: ఈ నిర్మాణ సందర్భంలో పదం పార్శ్వాన్ని సూచిస్తుంది; ‘వైపు’ సహజమైన తెలుగు రూపం.
- source_word: הַמִּשְׁכָּן
  choice: మందసం
  rationale: దేవుని నివాస గుడార నిర్మాణానికి తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన, సంక్షిప్తమైన పదం.
- source_word: הָאֶחָד
  choice: ఒక
  rationale: జతలోని ఒక నిర్దిష్ట వైపును సూచిస్తుంది; తరువాతి వచనంలోని ఎదురువైపుతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
