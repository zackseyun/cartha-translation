  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: te
  text: ఆ తెరను బిగింపుల కింద అమర్చాలి. అక్కడ, తెర వెనుకకు సాక్ష్యపు మందసాన్ని[a] తీసుకురావాలి. ఆ తెర మీ కొరకు పరిశుద్ధ స్థలానికీ అతి పరిశుద్ధ స్థలానికీ[b] మధ్య వేరు చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “సాక్ష్యపు మందసం” అని ఉంది. సందర్భానుసారంగా దీనిని “నిబంధన మందసం” అని కూడా పిలుస్తారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పరిశుద్ధతల పరిశుద్ధత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: తెర
  rationale: అతి పరిశుద్ధ స్థలాన్ని కప్పి వేరుచేసే అంతర్గత వస్త్రపు విభాజకాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెర’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: קְרָסִים
  choice: కొక్కేలు
  rationale: గుడారపు వస్త్రాలను కలిపే అమరిక భాగాలను సూచిస్తుంది; ‘కొక్కేలు’ నిర్మాణ సందర్భానికి సరిపోతుంది, అయితే అవి ఆధునిక కొక్కేలతో పూర్తిగా సమానమని అతిగా నిర్దిష్టీకరించదు.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ఆ తెర లోపలికి
  rationale: తెరకు లోపలి వైపున ఉన్న ప్రదేశంలోకి మందసాన్ని తీసుకురావాలనే స్థలార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲרוֹן הָעֵדוּת
  choice: సాక్ష్యపు మందసం
  rationale: హీబ్రూ పాఠంలో ‘నిబంధన’ కాక ‘సాక్ష్యం’ ఉంది; అందువల్ల మూలపదాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: וְהִבְדִּילָה
  choice: విభజనగా ఉంటుంది
  rationale: హిఫీల్ రూపంలోని వేరుచేసే కార్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ద్వితీయ పురుష బహువచన దత్తార్థాన్ని నిలుపుతుంది.
- source_word: הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం
  rationale: బయటి పవిత్ర గదిని అంతర్గత అతి పరిశుద్ధ స్థలం నుండి సాంకేతికంగా వేరుచూపుతుంది.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలం
  rationale: ‘పరిశుద్ధతల పరిశుద్ధత’ అనే హీబ్రూ అత్యుత్తమార్థ నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: అంతర్గత పరిశుద్ధ స్థలానికి సంప్రదాయ పదప్రయోగం
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలాల్లోకెల్లా పరిశుద్ధమైన స్థలం
  rationale: హీబ్రూ అత్యుత్తమార్థాన్ని అర్థపరంగా నిలుపుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే రూపాన్ని ఎంచుకుంది.
- issue: మందసం పేరులో עֵדוּת పదం
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన మందసం
  rationale: ఈ వచనంలోని హీబ్రూ పదం ‘సాక్ష్యం’; సుపరిచితమైన సంప్రదాయ బిరుదుకు అనుగుణంగా దాన్ని ‘నిబంధన’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. నిర్దేశాత్మక భవిష్యదర్థాన్ని తెలుగులో సహజమైన ‘చేయాలి’ రూపంతో అందించింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట కాక వచనం చివర ఉంచబడ్డాయి; అయినప్పటికీ రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
