revisions:
- from: ఆ తెరను కొక్కేల కింద వేలాడదీయాలి. ఆ తెర లోపలికి సాక్ష్యపు మందసాన్ని తీసుకురావాలి. ఆ తెర మీ కోసం పరిశుద్ధ స్థలానికీ అతి పరిశుద్ధ స్థలానికీ మధ్య విభజనగా ఉంటుంది.[a][b]
  to: ఆ తెరను బిగింపుల కింద అమర్చాలి. అక్కడ, తెర వెనుకకు సాక్ష్యపు మందసాన్ని[a] తీసుకురావాలి. ఆ తెర మీ కొరకు పరిశుద్ధ స్థలానికీ అతి పరిశుద్ధ స్థలానికీ[b] మధ్య వేరు చేస్తుంది.
  rationale: The revision preserves the Hebrew’s imperative/future instructional force, the inner-side location of the ark, and the veil’s active separating function. It also aligns footnote anchors with the terms they explain, while retaining the source wording “testimony” rather than harmonizing it to “covenant.”
