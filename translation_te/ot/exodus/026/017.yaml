  yaml_path: translation/ot/exodus/026/017.yaml
  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: te
  text: ప్రతి పలకకు ఒకదానితో ఒకటి జతగా ఉండే రెండు బిగింపు కొసలు ఉండాలి.[a] నివాస గుడారపు పలకలన్నిటినీ ఈ విధంగానే చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఒక పలకకు రెండు చేతులు, జతచేయబడినవి—ఒక స్త్రీ తన సహోదరి వైపు.” ఇక్కడ “చేతులు” అనేది పలక నుంచి పొడుచుకొని ఉండే బిగింపు భాగాలను సూచిస్తుంది; “ఒక స్త్రీ తన సహోదరి వైపు” అనేది సమాన భాగాలు జతగా ఉండడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: బిగింపు కుదురులు
  rationale: అక్షరార్థంగా ‘చేతులు’; అయితే ఇక్కడ పలకలను పాదాల్లో బిగించడానికి వెలుపలికి పొడుచుకొని ఉండే కలప భాగాలను సూచిస్తుంది. సాధారణ పాఠకుడికి నిర్మాణార్థం స్పష్టమయ్యేలా ‘బిగింపు కుదురులు’ అని అనువదించాం.
- source_word: מְשֻׁלָּבֹת
  choice: జతచేయబడిన
  rationale: రెండు కుదురులు ఒకదానితో ఒకటి అనుసంధానంగా లేదా సరిపోలే విధంగా అమర్చబడినట్లు ఈ కర్మణి రూపం సూచిస్తుంది; అవి ఎలా కలుస్తాయో అవసరానికి మించి నిర్దిష్టం చేయలేదు.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ఒకదానితో ఒకటి
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ తన సహోదరి వైపు’ అనే హెబ్రీయ నుడికారం సమాన భాగాల పరస్పర సంబంధాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ‘ఒకదానితో ఒకటి’ అని ఇచ్చాం.
- source_word: קֶרֶשׁ
  choice: పలక
  rationale: నివాస గుడారపు నిలువు నిర్మాణ భాగాన్ని సూచించే పారదర్శకమైన, సహజమైన తెలుగు పదం.
- source_word: מִשְׁכָּן
  choice: నివాస గుడారం
  rationale: ఈ పదానికి మూలార్థం ‘నివాసం’; నిర్గమకాండ సందర్భంలో మోసుకెళ్లగల పవిత్ర గుడారాన్ని సూచిస్తుంది. మూలార్థాన్నీ సందర్భాన్నీ కలిపి ‘నివాస గుడారం’ అని ఇచ్చాం.
- source_word: כֵּן תַּעֲשֶׂה
  choice: ఈ విధంగానే చేయాలి
  rationale: అన్ని పలకలకు ఒకే నిర్మాణ నమూనాను అనుసరించాలనే ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁתֵּי
  choice: రెండు
  rationale: కుదురుల సంఖ్యను తెలిపే సూటి అనువాదం.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: ప్రతి పలకకు
  rationale: రూపపరంగా ‘ఒక పలకకు’ అయినా, తరువాతి వాక్యభాగం ప్రకారం ఇది ఒక్కొక్క పలకకూ వర్తించే విభజనార్థక ప్రయోగం.
