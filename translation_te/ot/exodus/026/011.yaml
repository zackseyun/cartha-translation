translation:
  language: te
  text: నీవు యాభై కంచు[a] కొలుకులు చేసి, ఆ కొలుకులను ఉచ్చుల్లోకి చొప్పించి, గుడారాన్ని కలపాలి. అప్పుడు అది ఒక్కటిగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగి.’ హీబ్రూ పదం נְחֹשֶׁת సందర్భాన్ని బట్టి రాగిని లేదా కంచును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: కంచు కొలుకులు
  rationale: קַרְסִים అనేది తెరలను ఒకదానితో ఒకటి బిగించే భాగాలను సూచిస్తుంది; అందువల్ల సాధారణ ‘కొంకీలు’ కంటే ‘కొలుకులు’ నిర్మాణ సందర్భానికి సరిపోతుంది. נְחֹשֶׁת ఇక్కడ కంచు లేదా రాగిని సూచించవచ్చు; గుడారపు లోహ పనుల సందర్భంలో ‘కంచు’ సహజమైన ఎంపిక.
- source_word: חֲמִשִּׁים
  choice: యాభై
  rationale: ‘కొలుకులు’ అనే నామవాచకాన్ని విశేషించే సాధారణ సంఖ్య.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: ఆ కొలుకులను ఉచ్చుల్లోకి చొప్పించి
  rationale: హిఫిల్ రూపంలోని בוא ఇక్కడ కొలుకులను ఉచ్చుల్లోకి ప్రవేశపెట్టడాన్ని సూచిస్తుంది. ‘చొప్పించి’ అనే పదం ఈ నిర్మాణ చర్యను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: గుడారాన్ని కలపాలి
  rationale: חבר అంటే కలపడం లేదా అనుసంధానించడం. הָאֹהֶל ఇక్కడ ఈ కప్పులతో ఏర్పడే గుడార నిర్మాణాన్ని సూచిస్తుంది.
- source_word: וְהָיָה אֶחָד
  choice: అప్పుడు అది ఒక్కటిగా ఉంటుంది
  rationale: వేర్వేరు భాగాలను కలిపిన ఫలితంగా గుడారం ఏకమైన నిర్మాణంగా ఉండటాన్ని ఈ వాక్యం తెలియజేస్తుంది; హీబ్రూ వాక్యంలోని ఫలిత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
