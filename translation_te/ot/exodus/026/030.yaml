  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקֵמֹתָ֖ אֶת הַ/מִּשְׁכָּ֑ן כְּ/מִ֨שְׁפָּט֔/וֹ אֲשֶׁ֥ר הָרְאֵ֖יתָ בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: te
  text: నీవు పర్వతం మీద చూసిన నిర్దేశిత విధానం ప్రకారం నివాస గుడారాన్ని నిలబెట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: నిలబెట్టాలి
  rationale: קום హిఫిల్ రూపం ‘నిలిచేలా చేయడం’ అనే భావాన్ని ఇస్తుంది; నిర్మాణ సందర్భంలో ‘నిలబెట్టాలి’ సహజంగానూ మూలానికి దగ్గరగానూ ఉంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: מִשְׁכָּן నిర్గమకాండలో దేవుని పవిత్ర నివాస గుడారాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ సులభంగా అర్థమవుతుంది; అయితే ఇది శాశ్వత కట్టడం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: כְּמִשְׁפָּטוֹ
  choice: దాని నియమిత విధానం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ తీర్పు కంటే నిర్ణయించబడిన అమరిక లేదా నిర్దేశిత పద్ధతిని సూచిస్తుంది. ‘నియమిత విధానం’ అనే పదబంధం ‘నమూనా’ అని మాత్రమే పరిమితం చేయకుండా ఆ భావవిస్తృతిని కాపాడుతుంది.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: నీవు ... చూసిన
  rationale: హీబ్రూ క్రియ వ్యాకరణపరంగా కర్తరి రూపంలో ‘నీవు చూశావు’ అని ఉంది. దైవికంగా చూపించబడిందనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో కర్మణి రూపంగా మార్చకుండా మూలంలోని వ్యక్తీకరణను నిలిపింది.
- source_word: בָּהָר
  choice: పర్వతం మీద
  rationale: స్థానార్థక ב ఇక్కడ మోషే పర్వతం మీద ఉన్నాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: మోషే చూసినది దైవికంగా చూపించబడిందా అనే వ్యక్తీకరణ
  choice: ‘నీవు ... చూసిన’ అనే మూలంలోని కర్తరి రూపాన్ని ఉంచడం
  alternative: ‘నీకు చూపించబడిన’
  rationale: సందర్భంలో దేవుడు చూపించాడనే భావం ఉన్నప్పటికీ, హీబ్రూ వాక్యం ప్రత్యక్షంగా ‘నీవు చూసిన’ అంటుంది. ఆ సూక్ష్మ తేడాను మౌనంగా పరిష్కరించకుండా కాపాడడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘చూసిన’ అనే కర్తరి రూపం, כמשפטו లోని ‘నియమిత విధానం’ భావం కాపాడబడ్డాయి.
