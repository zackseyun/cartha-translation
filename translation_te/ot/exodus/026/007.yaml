  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: te
  text: నివాసమందిరం మీద గుడారంగా కప్పడానికి మేక వెంట్రుకలతో పదకొండు తెరలను చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మేకల తెరలు.’ ఇక్కడ ‘మేకలు’ అనే పదం మేకల వెంట్రుకలతో చేసిన వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: కలిపే וְతో వచ్చిన ఈ క్రియ నిర్మాణ ఆదేశాల వరుసలో ఉంది. ఆధునిక తెలుగులో ‘చేయాలి’ ప్రత్యక్ష ఆదేశాన్ని సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: నివాసమందిర నిర్మాణ సందర్భంలో ఈ పదం పెద్ద వస్త్రపు తెరలను సూచిస్తుంది; ‘తెరలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి సాంకేతికతను అతిగా పెంచదు.
- source_word: עִזִּים
  choice: మేక వెంట్రుకలతో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మేకలు’ ఉన్నా, ఇక్కడ మేకల నుంచి పొందిన పదార్థం, అంటే మేక వెంట్రుకలతో చేసిన వస్త్రం ఉద్దేశించబడింది.
- source_word: לְאֹהֶל
  choice: గుడారంగా ఉండడానికి
  rationale: לְ ప్రయోజనం లేదా ఉపయోగాన్ని సూచిస్తుంది. ఈ తెరలు పైగుడారపు కప్పుగా ఉపయోగపడతాయని తెలుగు ప్రయోగం స్పష్టం చేస్తుంది.
- source_word: עַל הַמִּשְׁכָּן
  choice: నివాసమందిరం మీద
  rationale: עַל అంటే ‘మీద’; מִשְׁכָּן అక్షరార్థంగా ‘నివాసస్థలం’ అయినప్పటికీ నిర్గమకాండంలో పవిత్ర నిర్మాణానికి సాంకేతిక పదం. ‘నివాసమందిరం’ ఆ భావాన్ని తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: పదకొండు తెరలను
  rationale: సంఖ్యను మరియు పునరుక్త ‘తెరలు’ పదాన్ని సహజమైన తెలుగు కర్మ నిర్మాణంలో ఉంచుతుంది.
