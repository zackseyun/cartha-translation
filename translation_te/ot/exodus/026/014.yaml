  to: నీవు గుడారానికి ఎర్రగా రంగు వేసిన పొట్టేళ్ల చర్మాలతో ఒక కప్పు పొరను, దాని పైన తహష్[a] చర్మాలతో ఒక కప్పు పొరను చేయాలి.
  rationale: The revision makes the covering-layer sense explicit, moves the footnote marker to the uncertain term ‘తహష్,’ and corrects the footnote’s documented lexical alternative from sea cow to porpoise. It retains the source ambiguity and the contextual sense that the tahash-skin covering was above the preceding layer.
