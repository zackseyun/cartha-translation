  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణ ఆదేశ శైలి వాడబడింది. అనిశ్చితమైన תְּחָשִׁים పదం ‘తహష్’గా లిప్యంతరీకరించి పాదటిప్పణిలో వివరణ ఇచ్చాం.
