id: EXO.26.14
reference: Exodus 26:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: te
  text: నీవు గుడారానికి ఎర్రగా రంగు వేసిన పొట్టేళ్ల చర్మాలతో ఒక కప్పు పొరను, దాని పైన తహష్[a] చర్మాలతో ఒక కప్పు పొరను చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తహష్’ అనే హీబ్రూ పదానికి ఖచ్చితమైన అర్థం తెలియదు. అది ఒక నిర్దిష్ట జంతువును లేదా ఒక రకమైన మన్నికైన తోలును సూచించవచ్చు. ‘నాణ్యమైన తోలు,’ ‘పర్పాయిస్ చర్మాలు,’ లేదా ‘డుగాంగ్ చర్మాలు’ అనే అనువాదాలు కూడా ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేయాలి
  rationale: నిర్మాణ ఆదేశాల వరుసలో సంయోజక వావ్‌తో వచ్చిన ఖల్ సంపూర్ణ క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִכְסֶה לָאֹהֶל
  choice: గుడారం కోసం ... ఒక కప్పు
  rationale: מִכְסֶה రక్షణనిచ్చే కప్పు లేదా కప్పే పొరను సూచిస్తుంది; אֹהֶל అనే సాధారణ నామానికి ‘గుడారం’ మూలానికి నేరుగా సరిపోతుంది.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ఎర్రగా రంగు వేసిన పొట్టేళ్ల చర్మాలు
  rationale: ఈ పదబంధం పొట్టేళ్ల చర్మాలు ఎర్రగా చేయబడినవని సూచిస్తుంది; ‘రంగు వేసిన’ అనేది చర్మాల ప్రక్రియను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹרֹת תְּחָשִׁים
  choice: తహష్ చర్మాలు
  rationale: תְּחָשִׁים యొక్క ఖచ్చితమైన జంతు గుర్తింపు అనిశ్చితం. ఊహాత్మక గుర్తింపును ఎంచుకోకుండా మూలపదాన్ని లిప్యంతరీకరించడం ద్వారా ఆ అనిశ్చితిని నిలుపుకున్నాం.
- source_word: מִלְמָעְלָה
  choice: దాని పైన
  rationale: సందర్భంలో ఇది ముందుగా చెప్పిన కప్పుకు పైన ఉండే బయటి పొర స్థానాన్ని సూచిస్తుంది. ‘దాని పైన’ పొరల అమరికను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
