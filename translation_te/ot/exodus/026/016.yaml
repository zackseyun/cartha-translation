translation:
  language: te
  text: ఒక్కొక్క చట్రం[a] పొడవు పది మూరలు, వెడల్పు ఒకటిన్నర మూరలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా ‘చట్రం’కు బదులు ‘పలక’.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: చట్రం
  rationale: ప్రత్యక్ష గుడార నిర్మాణ సందర్భంలో ఇది నిలువుగా ఉపయోగించే నిర్మాణ భాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘చట్రం’ దాని నిర్మాణాత్మక పనిని సహజంగా తెలియజేస్తుంది; అయితే ‘పలక’ అనే సంప్రదాయ అర్థం కూడా సాధ్యమే.
- source_word: עֶשֶׂר אַמּוֹת
  choice: పది మూరలు
  rationale: పురాతన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా నిలుపుతుంది. אַמָּהకు తెలుగులో స్థిరపడిన బైబిలు కొలమాన పదం ‘మూర’.
- source_word: אֹרֶךְ
  choice: పొడవు
  rationale: నిర్మాణ కొలతను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: ఒకటిన్నర మూరలు
  rationale: ‘ఒక మూరన్నర’ అనే మరింత అక్షరార్థ రూపానికి బదులు, అదే ఖచ్చితమైన పరిమాణాన్ని ప్రస్తుత తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רֹחַב
  choice: వెడల్పు
  rationale: కొలతల సందర్భంలో స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ఒక్కొక్క చట్రం
  rationale: నిర్దిష్ట ఏకవచనం మరియు אֶחָד కలిపి ప్రతి విడి భాగపు కొలతను సూచిస్తున్నాయి; ‘ఒక్కొక్క’ ఆ పంపిణీ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణన. మూలంలోని కొలమానాన్ని మార్చకుండా ‘మూర’గా ఉంచి, ప్రతి నిర్మాణ భాగానికి ఒకే కొలత వర్తిస్తుందనే భావాన్ని ‘ఒక్కొక్క’తో స్పష్టం చేసింది. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
