translation:
  language: te
  text: గుడారం వెనుక భాగంలోని మూలల కోసం రెండు పలకలను చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారం మూల-భాగాల కోసం, వెనుకనున్న రెండు చివరల వద్ద.” ఇక్కడి హీబ్రూ పదాలు నిర్మాణానికి సంబంధించిన సాంకేతిక పదాలు; వాటి ఖచ్చితమైన భావం కొంత అనిశ్చితంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: రెండు
  rationale: సంయోజక అవ్యయంతో కూడిన ‘రెండు’ అనే నిర్మాణ రూపం తదుపరి నిర్మాణ అంశాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: קְרָשִׁים
  choice: పలకలను
  rationale: మందిరపు గోడలను ఏర్పరచే దృఢమైన చెక్క నిర్మాణ భాగాలను సూచిస్తుంది. ‘పలకలు’ సహజమైన, స్థిరపడిన తెలుగు పదం; ‘చట్రాలు’ అనడం మూలంలో లేని నిర్మాణ స్వరూపాన్ని ఎక్కువగా నిర్దిష్టం చేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: చేయాలి
  rationale: రెండవ పురుష ఏకవచన అసంపూర్ణ క్రియ ఇక్కడ ఆదేశార్థక భావాన్ని కలిగి ఉంది; ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִ/מְקֻצְעֹת
  choice: మూలల కోసం
  rationale: ఈ నామవాచకం మూలలను లేదా కోణాకార కలయిక స్థానాలను సూచిస్తుంది. సాంకేతిక అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘మూలల కోసం’ అని అనువదించడం స్పష్టంగా ఉంటుంది.
- source_word: הַ/מִּשְׁכָּן
  choice: మందిరపు
  rationale: నిర్గమకాండంలోని పవిత్ర గుడార నివాసాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘మందిరం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంటుంది; అయితే ఇది శాశ్వత కట్టడం కాక గుడార మందిరమనే సందర్భం విస్తృత భాగంలో స్పష్టమవుతుంది.
- source_word: בַּ/יַּרְכָתָיִם
  choice: వెనుకవైపు
  rationale: ద్వివచన రూపం వెనుకనున్న రెండు చివరలను లేదా పార్శ్వాలను సూచిస్తుంది. ముందే మూలలు ప్రస్తావించబడినందున ‘వెనుకవైపు’ స్థలాన్ని సహజంగా తెలియజేస్తూ అనవసర పునరుక్తిని నివారిస్తుంది.
