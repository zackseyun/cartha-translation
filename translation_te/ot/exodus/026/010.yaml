  text: וְ/עָשִׂ֜יתָ חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֣ל שְׂפַ֤ת הַ/יְרִיעָה֙ הָֽ/אֶחָ֔ת הַ/קִּיצֹנָ֖ה בַּ/חֹבָ֑רֶת וַ/חֲמִשִּׁ֣ים לֻֽלָאֹ֗ת עַ֚ל שְׂפַ֣ת הַ/יְרִיעָ֔ה הַ/חֹבֶ֖רֶת הַ/שֵּׁנִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: te
  text: కలిపిన సముదాయంలో[a] చివరనున్న ఆ ఒక తెర అంచున యాభై ఉచ్చులు చేయాలి; రెండవ కలిపిన సముదాయంలోని తెర అంచున కూడా యాభై ఉచ్చులు చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలుపు భాగంలో.” హెబ్రీ పదం తెరలను కలిపి ఏర్పడిన ఏకకాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: నిర్దేశాత్మక సందర్భంలోని ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֻלָאֹת
  choice: ఉచ్చులు
  rationale: తెరలను కలిపేందుకు ఉపయోగించే వస్త్రపు లూపులను సంక్షిప్తంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: שְׂפַת
  choice: అంచున
  rationale: అక్షరార్థంగా ‘పెదవి’; వస్త్ర నిర్మాణ సందర్భంలో ‘అంచు’ సహజమైన సమానార్థకం.
- source_word: הַיְרִיעָה
  choice: తెర
  rationale: మందిర గుడారపు పెద్ద వస్త్రపు భాగాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: הָאֶחָת הַקִּיצֹנָה
  choice: చివరి తెర
  rationale: సముదాయపు చివర ఉన్న ఒక తెరను హెబ్రీ వాక్యంలోని స్థానభావానికి అనుగుణంగా తెలుపుతుంది.
- source_word: בַּחֹבָרֶת
  choice: కలిపి కుట్టిన సముదాయంలోని
  rationale: కలిపిన తెరలతో ఏర్పడిన ఏకకాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కుట్టిన’ అనేది సమీప సందర్భంలోని తెరల అనుసంధాన విధానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַיְרִיעָה הַחֹבֶרֶת הַשֵּׁנִית
  choice: దానితో కలిసే రెండవ తెర
  rationale: రెండవ తెర యొక్క సంబంధాన్ని నిలుపుతూ తెలుగులో చదవడానికి సహజంగా ఉంటుంది.
