  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, నిర్మాణ సూచనలకు తగిన సంక్షిప్త శైలి. మూలంలోని రెండు సమాంతర ఆదేశాలను సెమీకోలన్‌తో స్పష్టంగా ఉంచాం.
