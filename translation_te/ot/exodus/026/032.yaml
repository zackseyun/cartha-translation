  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: te
  text: దానిని బంగారంతో పొదిగిన నాలుగు తుమ్మచెక్క స్తంభాల మీద వేలాడదీయాలి. వాటి కొక్కాలు బంగారంతో చేసినవి; ఆ స్తంభాలను నాలుగు వెండి దిమ్మల[a] మీద నిలబెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాలుగు వెండి సాకెట్లపై.”
    reason: అడన్ అనే పదం స్తంభాలను అమర్చే అడుగు ఆధారాలను, లేదా సాకెట్లను, సూచించవచ్చు.
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: దానిని ... వేలాడదీయాలి
  rationale: נתן సాధారణంగా ‘పెట్టు/ఉంచు’ అని అర్థమిచ్చినా, తెరను స్తంభాలపై అమర్చే ఈ సందర్భంలో ‘వేలాడదీయాలి’ సహజంగా, ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది. స్త్రీలింగ ఏకవచన సర్వనామం ముందటి వచనంలోని తెరను సూచిస్తుంది.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: నాలుగు ... స్తంభాల మీద
  rationale: עמוד నిలువుగా ఉండే ఆధారాన్ని సూచిస్తుంది; గుడార నిర్మాణ సందర్భంలో ‘స్తంభం’ ఖచ్చితమైన, సాధారణ తెలుగు పదం.
- source_word: שִׁטִּים
  choice: తుమ్మచెక్క
  rationale: ఇది అకేషియా జాతి కలపను సూచిస్తుంది. బైబిలు తెలుగు వాడుకలో పరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: מְצֻפִּים זָהָב
  choice: బంగారంతో పొదిగిన
  rationale: צפה రూపం పైపూతగా కప్పడం లేదా పొదగడం అనే భావాన్ని ఇస్తుంది; ‘బంగారంతో పొదిగిన’ నిర్మాణ సామగ్రి సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וָוֵיהֶם
  choice: వాటి కొక్కాలు
  rationale: וו ఇక్కడ తెరను వేలాడదీయడానికి స్తంభాలకు అమర్చిన కొక్కాలను సూచిస్తుంది; ‘కొక్కడాలు’ కంటే ‘కొక్కాలు’ ఆధునికంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: నాలుగు వెండి దిమ్మల మీద నిలవాలి
  rationale: אדן స్తంభాన్ని నిలబెట్టే అడుగు ఆధారాన్ని లేదా గాడిగల పీఠాన్ని సూచిస్తుంది. తెలుగులో ‘దిమ్మ’ సులభంగా అర్థమయ్యే నిర్మాణపరమైన పదం; ‘నిలవాలి’ అనేది హీబ్రూ సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ శైలిని వాడాం. వరుసగా వచ్చిన రెండు ‘మీద’ సంబంధాలను సహజ వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
