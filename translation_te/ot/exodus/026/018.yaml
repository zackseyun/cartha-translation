translation:
  language: te
  text: 'నీవు నివాస గుడారానికి చట్రాలు[a] చేయాలి: దక్షిణపు వైపున, దక్షిణ దిశగా ఇరవై చట్రాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పలకలు’; హెబ్రీ పదం నివాస గుడారంలోని నిర్మాణ భాగాలను సూచిస్తుంది. వాటిని చట్రాలుగానో పలకలుగానో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేయాలి
  rationale: సూచనాత్మక సందర్భంలో సంయోజకంతో వచ్చిన కాలరూపం ఆజ్ఞార్థక భావాన్ని వ్యక్తం చేస్తుంది. ‘చేయాలి’ ఆధునిక తెలుగులో ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַקְּרָשִׁים
  choice: చట్రాలు
  rationale: ఈ పదం నివాస గుడారంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది. వాటి నిర్మాణాత్మక పనిని ‘చట్రాలు’ స్పష్టంగా తెలియజేస్తుంది; ‘పలకలు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: לַמִּשְׁכָּן
  choice: నివాస గుడారం కోసం
  rationale: מִשְׁכָּן దేవుని నివాస స్థలంగా ఉన్న పవిత్ర గుడారాన్ని సూచిస్తుంది. ‘నివాస గుడారం’ మూలపద భావాన్ని కాపాడుతూ సందర్భానుకూలంగా ఉంటుంది.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: ఇరవై చట్రాలు
  rationale: హెబ్రీలో సంఖ్య తర్వాత నామవాచకం ఏకవచన రూపంలో ఉన్నా, తెలుగు సహజ ప్రయోగంలో బహువచనం అవసరం.
- source_word: לִפְאַת
  choice: వైపున
  rationale: నిర్మాణ స్థలవివరణలో פֵאָה సూచించే పక్క లేదా దిశ భావాన్ని ‘వైపున’ సహజంగా తెలియజేస్తుంది.
- source_word: נֶגְבָּה תֵימָנָה
  choice: దక్షిణం వైపున, దక్షిణ దిశగా
  rationale: వరుసగా ఉన్న రెండు దిశాసూచక పదాల సంపూర్ణతను కుదించకుండా, దక్షిణ భాగాన్నీ దాని దిశనూ తెలుగులో ప్రతిబింబిస్తుంది.
