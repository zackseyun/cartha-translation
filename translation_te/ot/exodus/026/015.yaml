    text: లేదా ‘పలకలను’; హీబ్రూ పదం నివాసమందిరంలోని చెక్క నిర్మాణ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: ఆదేశాల వరుసలో సంధితో కూడిన ఈ క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַקְּרָשִׁים
  choice: చట్రాలను
  rationale: ఇది నివాసమందిరంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది. ‘చట్రాలు’ వాటి నిర్మాణాత్మక పాత్రను తెలియజేస్తుంది; ‘పలకలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: לַמִּשְׁכָּן
  choice: నివాసమందిరం కోసం
  rationale: మִשְׁכָּן దేవుని నివాసస్థలమైన పవిత్ర నిర్మాణానికి వాడే సాంకేతిక పదం. ‘నివాసమందిరం’ అర్థాన్ని పారదర్శకంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: ఈ పదబంధం అకేషియా జాతి చెక్కను సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: עֹמְדִים
  choice: నిలువుగా ఉండే
  rationale: ఈ వర్తమాన కృదంతం నిర్మాణ భాగాల నిలువు స్థితిని వివరిస్తుంది; తెలుగులో విశేషణాత్మకంగా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద నిర్మాణ-ఆదేశ శైలి. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తుమ్మచెక్క చట్రాలకే సంబంధించినదని సందిగ్ధత లేకుండా అమర్చబడింది.
