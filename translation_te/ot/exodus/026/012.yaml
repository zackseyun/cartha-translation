  to: గుడారపు తెరల్లో మిగిలిన అదనపు భాగం[a]—మిగిలి ఉన్న ఆ తెరలో సగం—నివాస నిర్మాణం[b] వెనుక భాగం మీద వేలాడాలి.
  rationale: The revision replaces “మందిరం” with “నివాస నిర్మాణం” to avoid a temple-specific reading and to preserve the source’s tent-covering versus dwelling-structure distinction. It also makes the surplus sense explicit in the first phrase, retains the singular half-curtain reference, and relocates footnote b to the term it explains.
