  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סֶ֨רַח֙ הָ/עֹדֵ֔ף בִּ/ירִיעֹ֖ת הָ/אֹ֑הֶל חֲצִ֤י הַ/יְרִיעָה֙ הָ/עֹדֶ֔פֶת תִּסְרַ֕ח עַ֖ל אֲחֹרֵ֥י הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: te
  text: గుడారపు తెరల్లో మిగిలిన అదనపు భాగం[a]—మిగిలి ఉన్న ఆ తెరలో సగం—నివాస నిర్మాణం[b] వెనుక భాగం మీద వేలాడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారపు తెరలలో మిగులుగా ఉన్న భాగం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇక్కడ “గుడారం” అనేది దాని ఆచ్ఛాదన పొరను, “నివాస నిర్మాణం” అనేది నివాస నిర్మాణాన్ని సూచించే వేర్వేరు పదాలు.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: వేలాడే భాగం
  rationale: మిగులుగా ఉండడంతో పాటు బయటికి చొచ్చుకొని వేలాడే వస్త్రభాగాన్ని సూచించే ఈ నిర్మాణ సందర్భంలో సహజంగా అర్థమయ్యే రూపం.
- source_word: הָעֹדֵף
  choice: మిగిలి
  rationale: עודף అనే మూలపదంలోని మిగులు లేదా అధికంగా ఉండే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְרִיעֹת
  choice: తెరలు
  rationale: గుడార నిర్మాణంలో ఉపయోగించిన పెద్ద వస్త్ర ఆచ్ఛాదనలకు ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: తర్వాత వచ్చే מִשְׁכָּן అనే నివాస నిర్మాణ పదం నుండి వస్త్రపు గుడారపు పొరను వేరుగా చూపుతుంది.
- source_word: חֲצִי הַיְרִיעָה
  choice: ఆ అర్ధ తెర
  rationale: ఒక తెరలో సగభాగాన్ని సూచించే ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: הָעֹדֶפֶת
  choice: మిగిలిన
  rationale: తెరకు అన్వయించే స్త్రీలింగ కృదంతంలోని మిగులు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּסְרַח
  choice: వేలాడాలి
  rationale: అదనపు వస్త్రభాగం కిందికి లేదా వెనుకవైపు వేలాడే భౌతిక చిత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַל אֲחֹרֵי
  choice: వెనుక భాగం మీదుగా
  rationale: నిర్మాణం వెనుక వైపును కప్పుతూ వస్త్రం వేలాడే స్థాన సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: ఈ సందర్భంలో దేవుని నివాస నిర్మాణాన్ని సూచించే మִשְׁכָּןకు గుడారం అనే ముందటి పదంతో భేదం నిలిచే స్థిరమైన తెలుగు బైబిలు పదం.
theological_decisions:
- issue: אֹהֶל మరియు מִשְׁכָּן మధ్య భేదం
  choice: గుడారం / మందిరం
  alternative: రెండింటికీ గుడారం
  rationale: మూలపాఠం వస్త్రపు గుడారపు ఆచ్ఛాదనను నివాస నిర్మాణం నుండి పదప్రయోగంలో వేరు చేస్తుంది; ఆ భేదాన్ని అనువాదంలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వివరణ. మూలంలోని పునరుక్తి మరియు గుడారం–మందిరం పదభేదం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
