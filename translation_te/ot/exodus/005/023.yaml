source:
  edition: WLC
  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: te
  text: ఎందుకంటే, నేను నీ పేరుతో మాట్లాడడానికి ఫరో దగ్గరికి వచ్చినప్పటి నుండి అతడు ఈ ప్రజలకు కీడు చేశాడు; నీవైతే నీ ప్రజలను అసలు విడిపించనే లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఈ ప్రజల పరిస్థితిని మరింత దిగజార్చాడు; నీవు నీ ప్రజలను ఎంతమాత్రమూ విడిపించలేదు.” చివరి మాటల్లో హీబ్రూ ఒకే క్రియను రెండు రూపాల్లో ఉపయోగించి నిరాకరణను బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: ఎందుకంటే, ... వచ్చినప్పటి నుండి
  rationale: מֵאָז యొక్క కాలార్థమైన ‘అప్పటి నుండి’ను నిలుపుతూ, సందర్భంలో మోషే తన ముందటి ఫిర్యాదుకు కారణం చెబుతున్నందున וּను సహజమైన తెలుగు అనుసంధానంగా ‘ఎందుకంటే’ అని అనువదించాం.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: నేను ... ఫరో దగ్గరికి వచ్చిన
  rationale: בוא యొక్క సాధారణ ‘వచ్చు’ భావాన్ని, אֶל సూచించే దిశను నేరుగా తెలియజేస్తుంది.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: నీ పేరుతో మాట్లాడడానికి
  rationale: లక్ష్యాన్ని తెలిపే infinitive భావాన్ని ‘మాట్లాడడానికి’గా, దేవుని ప్రతినిధిత్వం మరియు అధికారాన్ని సూచించే בִּשְׁמֶךָను సహజమైన తెలుగు ‘నీ పేరుతో’గా నిలిపాం.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: అతడు ఈ ప్రజలకు కీడు చేశాడు
  rationale: רעע హిఫీల్ రూపంలోని హాని చేయడం/చెడు కలిగించడం అనే నైతిక మరియు ఫలితార్థాలను ‘కీడు చేశాడు’ సముచితంగా కలుపుతుంది. కర్త హీబ్రూలో వ్యక్తంగా లేకపోయినా సందర్భంలో ఫరో అని సహజంగా గ్రహించబడుతుంది.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: నీవైతే ... అసలు విడిపించనే లేదు
  rationale: infinitive absoluteతో finite verb కలయిక నిరాకరణను బలపరుస్తుంది; ‘అసలు ... నే లేదు’ ఆ తీవ్రతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. נצלకు ఇక్కడ బానిసత్వం నుండి విముక్తి భావంలో ‘విడిపించు’ సరిపోతుంది.
- source_word: אֶת־עַמֶּךָ
  choice: నీ ప్రజలను
  rationale: ప్రత్యక్ష కర్మతో కూడిన ‘నీ ప్రజలు’ అనే భావాన్ని సరళంగా, నేరుగా అందిస్తుంది.
theological_decisions:
- issue: మోషే దేవునితో చెప్పిన తీవ్ర నిరాకరణను ఎలా వ్యక్తం చేయాలి
  choice: నీవైతే నీ ప్రజలను అసలు విడిపించనే లేదు
  alternative: నీవు నీ ప్రజలను ఎంతమాత్రమూ రక్షించలేదు
  rationale: హీబ్రూ infinitive absolute + finite verb నిర్మాణం నిరాకరణను బలపరుస్తుంది. ఎంపిక చేసిన రూపం మోషే ఫిర్యాదులోని ధైర్యమైన తీవ్రతను తగ్గించకుండా, దేవుడు ఇకముందు చేయబోయే కార్యం గురించి అదనపు తీర్మానం చేయదు.
- issue: בִּשְׁמֶךָలోని ‘పేరు’ భావాన్ని నిలుపడం
  choice: నీ పేరుతో
  alternative: నీ అధికారంతో / నీ తరఫున
  rationale: ‘నీ పేరుతో’ ఆధునిక తెలుగులో అర్థవంతంగా ఉండి, దేవుని ప్రతినిధిగా మరియు ఆయన అధికారంతో మాట్లాడే భావాన్ని వివరణాత్మకంగా కుదించకుండా నిలుపుతుంది.
- issue: הֵרַעకు నైతిక కీడు మరియు పరిస్థితి మరింత చెడిపోవడం మధ్య ఉన్న భావ పరిధి
  choice: కీడు చేశాడు
  alternative: ఈ ప్రజల పరిస్థితిని మరింత దిగజార్చాడు
  rationale: మూలపదం హాని లేదా కీడు చేయడాన్ని సూచించగలదు. ‘కీడు చేశాడు’ నైతిక తీవ్రతను నిలుపుతుంది; పరిస్థితి మరింత చెడిందనే సందర్భోచిత భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ నేరుగా వినిపించే ఫిర్యాదు శైలిని వాడాం. ‘అసలు ... విడిపించనే లేదు’ అనే నిర్మాణం హీబ్రూ బలీకరణను సాధారణ పాఠకుడికి సహజంగా చేరుస్తుంది. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
