source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: te
  text: కాని అతడు, “మీరు సోమరులు, సోమరులు![a] అందుకే, ‘మేము వెళ్లి యాహ్వేకు బలి అర్పిద్దాం’ అని అంటున్నారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘సోమరులు, సోమరులు’ అని నొక్కిచెప్పడానికి పదం పునరుక్తమైంది; ‘బద్ధకస్తులు, చాలా బద్ధకస్తులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కాని అతడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని కొనసాగిస్తున్నప్పటికీ, ముందున్న ఇశ్రాయేలీయుల మొరపై ఫరో ఇచ్చిన విరుద్ధ స్పందనను సందర్భానుసారంగా ‘కాని’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: మీరు సోమరులు, సోమరులు!
  rationale: נִרְפִּים ఇక్కడ పని చేయకుండా తప్పించుకునేవారనే నిందార్థంలో ఉంది. మూలంలోని పదపునరుక్తిని అలాగే ఉంచి ఆరోపణ తీవ్రతను కాపాడింది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: వారి మాటలకు కారణం వారి సోమరితనమేనని ఫరో ఆరోపిస్తున్న కారణసంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֹמְרִים
  choice: అని అంటున్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం ఇక్కడ ప్రత్యక్ష సంభాషణలో కొనసాగుతున్న/ప్రస్తుత మాటను సూచిస్తుంది.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: మేము వెళ్లి ... బలి అర్పిద్దాం
  rationale: రెండు ప్రథమ పురుష బహువచన cohortative రూపాల ప్రతిపాదనాత్మక బలాన్ని ‘వెళ్లి ... అర్పిద్దాం’ సహజంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ బలి అందుకునే వ్యక్తిని సూచిస్తుంది; יהוה అనే దైవనామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగులో గుర్తించదగిన ‘యాహ్వే’ రూపంలో ఇచ్చింది.
- issue: ఫరో ఆరోపణ స్వరూపం
  choice: ఫరో మాటగానే నేరుగా నిలుపుట
  alternative: వారు నిజంగా సోమరులని కథకుడి తీర్పుగా వినిపించడం
  rationale: ఈ వాక్యం ఫరో పలికిన ఆరోపణ; అనువాదం దానిని సమర్థించకూడదు లేదా మృదువుచేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఫరో మాటలోని నిందాత్మక తీవ్రతను పదపునరుక్తితో నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే ‘బలి అర్పిద్దాం’ అనే ఆరాధనా పదబంధాన్ని వాడింది.
