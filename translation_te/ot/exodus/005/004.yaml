source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚/מָּה מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת הָ/עָ֖ם מִ/מַּֽעֲשָׂ֑י/ו לְכ֖וּ לְ/סִבְלֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: te
  text: 'కానీ ఐగుప్తు రాజు వారితో ఇలా అన్నాడు: “మోషే, అహరోనూ, ప్రజలను వారి పనుల నుండి ఎందుకు తప్పిస్తున్నారు?[a] మీ భారాల దగ్గరికి వెళ్లండి.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలను వారి పని నుండి ఎందుకు దూరం చేస్తున్నారు?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ వెట్టిచాకిరికి వెళ్లండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కానీ ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి వచనంలోని అభ్యర్థనకు రాజు తెలిపిన వ్యతిరేక స్పందనను సందర్భానుసారంగా ‘కానీ’ సహజంగా సూచిస్తుంది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: ప్రత్యక్ష ప్రశ్నార్థక భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: תַּפְרִיעוּ
  choice: మానుకునేలా ... చేస్తున్నారు
  rationale: פרע అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ ప్రజలను వారి పని నుంచి నిలిపివేయడం లేదా దూరం చేయడం అనే కారణార్థక భావాన్ని ఇస్తుంది; సానుకూలమైన ‘విడిపించడం’ అనే అర్థం కాదు.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సందర్భంలో వారు కూలీలైనా, మూలపాఠంలోని విస్తృతమైన ‘ప్రజలు’ అనే పదాన్నే నిలుపుతుంది.
- source_word: מִמַּעֲשָׂיו
  choice: తమ పనిని
  rationale: ‘ప్రజలు’ అనే సమూహవాచక ఏకవచనానికి హీబ్రూలో ఏకవచన ప్రత్యయం ఉంది; తెలుగులో సహజంగా సమూహాన్ని సూచించే ‘తమ’ వాడబడింది.
- source_word: לְכוּ
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞను ప్రత్యక్షంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְסִבְלֹתֵיכֶם
  choice: మీ వెట్టిచాకిరికి
  rationale: סבלות మోయవలసిన భారాలను, విస్తృతార్థంలో అణచివేసే బలవంతపు శ్రమ బాధ్యతలను సూచిస్తుంది. సందర్భంలో ‘వెట్టిచాకిరి’ ఆ భావాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘భారాలు’ అనే మరింత అక్షరార్థ రూపం ప్రత్యామ్నాయంగా గమనికలో ఉంచబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ఫరో యొక్క ఆరోపణాత్మక ప్రశ్న, కఠిన ఆజ్ఞ నిలుపబడ్డాయి. ‘ఐగుప్తు’ బైబిలు సందర్భంలో సుపరిచితమైన ప్రామాణిక నామరూపం; ‘వెట్టిచాకిరి’ అణచివేసే బలవంతపు శ్రమను స్పష్టంగా తెలియజేస్తుంది.
