id: EXO.5.15
reference: Exodus 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలీయుల పర్యవేక్షకులు ఫరో వద్దకు వెళ్లి, “నీ సేవకులమైన మాకు[a] ఇలా ఎందుకు చేస్తున్నావు?” అని మొరపెట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ సేవకులు” అనే మాటకు “నీ బానిసలు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-సంపుటిత క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది.
- source_word: שֹׁטְרֵי
  choice: పర్యవేక్షకులు
  rationale: ఈ సందర్భంలో ఐగుప్తీయుల అధికారానికి లోబడి ఇశ్రాయేలీయుల పనిని పర్యవేక్షించిన మధ్యస్థ శ్రామిక నిర్వాహకులను సూచిస్తుంది; ‘అధికారులు’ కంటే పాత్రను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ప్రజాసమూహాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం ‘ఇశ్రాయేలీయులు’.
- source_word: וַיִּצְעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: ఇది కేవలం మాట్లాడడం కాక, బాధతో కూడిన అత్యవసర విజ్ఞాపనను సూచిస్తుంది.
- source_word: אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరకు ... మొరపెట్టుకున్నారు
  rationale: దిశను సూచించే אֶל‌ను తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: అని
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ సాధారణ ప్రయోగానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: ఇలా ఎందుకు చేస్తున్నావు?
  rationale: ‘ఎందుకు ఇలా చేస్తున్నావు?’ అనే నిర్మాణం హెబ్రీయ పదబంధాన్ని సమీపంగా అనుసరిస్తూనే సహజమైన తెలుగుగా ఉంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకులమైన మాకు
  rationale: ఫరోను ఉద్దేశించి తమను తాము వినయపూర్వకంగా పేర్కొనే రాజసభా విజ్ఞాపన భాషను నిలుపుతుంది; עבד‌కు ‘బానిసలు’ అనే అర్థం కూడా సందర్భానుసారం సాధ్యం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ఫరోతో ప్రత్యక్ష సంభాషణలో హెబ్రీయ ఏకవచన సంబోధనకు అనుగుణంగా ‘నీ/చేస్తున్నావు’ ఉంచబడింది. ప్రధాన పాఠంలో ‘ఇశ్రాయేలీయులు’ సహజమైన ప్రజానామంగా వాడి, పరిపాలనా పాత్రను ‘పర్యవేక్షకులు’గా స్పష్టీకరించాం.
