  - severity: low
    issue: “ఫరో దగ్గరకు వచ్చి” is somewhat less idiomatic in this narrative context.
    rationale: “ఫరో వద్దకు వెళ్లి” naturally expresses that the officers went to Pharaoh in order to make their appeal, without altering the sense.
  revised_text: అప్పుడు ఇశ్రాయేలీయుల పర్యవేక్షకులు ఫరో వద్దకు వెళ్లి, “నీ సేవకులమైన మాకు[a] ఇలా ఎందుకు చేస్తున్నావు?” అని మొరపెట్టుకున్నారు.
