translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞా శైలిని వాడాం. సందర్భంలోని కఠినత్వాన్ని అతిశయోక్తి లేకుండా నిలిపాం; ‘అయినా’ అనే పదం గడ్డి ఇవ్వకపోయినా నిర్ణీత ఉత్పత్తిని అప్పగించాలనే వ్యతిరేకతను స్పష్టం చేస్తుంది.
