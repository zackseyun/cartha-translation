  - severity: low
    issue: ‘అయినా’ is slightly more concessive than the source’s contextual contrast.
    rationale: ‘కానీ’ gives a direct, natural contrast between lack of straw and the continuing quota requirement.
  revised_text: ఇక వెళ్లి పని చేయండి. మీకు గడ్డి ఇవ్వబడదు; కానీ ఇటుకల నిర్ణీత సంఖ్యను[a] మీరు అప్పగించాలి.
