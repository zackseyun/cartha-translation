source:
  edition: WLC
  text: וְ/עַתָּה֙ לְכ֣וּ עִבְד֔וּ וְ/תֶ֖בֶן לֹא יִנָּתֵ֣ן לָ/כֶ֑ם וְ/תֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/018.yaml
  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: te
  text: ఇక వెళ్లి పని చేయండి. మీకు గడ్డి ఇవ్వబడదు; కానీ ఇటుకల నిర్ణీత సంఖ్యను[a] మీరు అప్పగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇటుకల కోటాను.’ హీబ్రూ תֹכֶן అనే పదం పనివారినుంచి కోరిన స్థిరమైన లేదా కొలిచిన పరిమాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఫరో ముగింపుగా ఇస్తున్న ఆజ్ఞలోని సంధానాత్మకమైన, నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְכוּ
  choice: వెళ్లి
  rationale: הלך క్రియ యొక్క ఆజ్ఞార్థక రూపం. తరువాతి ఆజ్ఞతో సహజంగా కలిసే తెలుగు ప్రయోగం.
- source_word: עִבְדוּ
  choice: పని చేయండి
  rationale: ఈ సందర్భంలో ఇది ఆరాధనా సేవను కాక, బలవంతపు శ్రమను సూచిస్తుంది.
- source_word: וְתֶבֶן
  choice: గడ్డి
  rationale: ఇటుకల తయారీలో వాడే straw‌ను సాధారణ పాఠకులకు అర్థమయ్యే పదంతో సూచిస్తుంది; సందర్భంలోని వ్యతిరేక భావాన్ని వాక్య నిర్మాణం తెలియజేస్తుంది.
- source_word: יִנָּתֵן לָכֶם
  choice: మీకు ... ఇవ్వబడదు
  rationale: נתן యొక్క నిషేధార్థక కర్మణి రూపాన్ని సన్నిహితంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: תֹכֶן
  choice: నిర్ణీత సంఖ్య
  rationale: పనివారినుంచి కోరిన కొలిచిన లేదా స్థిరపరచిన పరిమాణాన్ని సూచిస్తుంది; ఇటుకల సందర్భంలో ‘సంఖ్య’ సహజంగా ఉంటుంది.
- source_word: לְבֵנִים
  choice: ఇటుకల
  rationale: תֹכֶןతో ఉన్న నిర్మాణ సంబంధాన్ని తెలుగులో షష్ఠీ రూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּתֵּנּוּ
  choice: మీరు అప్పగించాలి
  rationale: అక్షరార్థంగా ‘మీరు ఇవ్వాలి’; ఈ ఉత్పత్తి సందర్భంలో నిర్దేశించిన ఇటుకలను సమర్పించాల్సిన బాధ్యతను ‘అప్పగించాలి’ స్పష్టంగా తెలియజేస్తుంది.
