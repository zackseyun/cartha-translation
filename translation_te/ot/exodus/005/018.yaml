  terminology: ‘గడ్డి’ is an established, understandable Telugu rendering for the straw used in brickmaking. ‘నిర్ణీత సంఖ్య’ appropriately expresses the fixed required quantity in this brick-production context. The footnote preserves the lexical alternative and explanation.
