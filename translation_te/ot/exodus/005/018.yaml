  source_fidelity: 'The draft accurately renders the sequence of commands and the contrast: continued labor is commanded, straw will not be supplied, and the required brick quota must still be met. ‘అప్పగించాలి’ appropriately conveys the contextual force of Hebrew תִּתֵּנּוּ (‘you shall give/provide’).'
