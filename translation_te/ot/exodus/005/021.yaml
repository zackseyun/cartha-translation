language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: te
  text: అప్పుడు వారు వారితో, “యాహ్వే మిమ్మల్ని చూసి తీర్పు తీర్చుగాక! ఎందుకంటే మీరు ఫరో దృష్టిలోను అతని సేవకుల దృష్టిలోను మా వాసనను దుర్వాసనగా మార్చి, మమ్మల్ని చంపడానికి వారి చేతిలో కత్తి పెట్టారు” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: అప్పుడు వారు వాళ్లతో … అన్నారు
  rationale: వావ్-వరుస కథన ప్రవాహాన్ని సహజమైన తెలుగులో ‘అప్పుడు’తో తెలిపి, మూలంలోని సర్వనామాన్ని పేర్లతో విప్పకుండా ‘వాళ్లతో’గా ఉంచింది.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: యాహ్వే మిమ్మల్ని చూసి తీర్పు తీర్చుగాక
  rationale: రెండు అసంపూర్ణ క్రియల శాపార్థక/కోరికార్థక భావాన్ని ‘చూసి … తీర్చుగాక’గా నిలిపి, దేవుని వ్యక్తినామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: తరువాతి మాట ముందున్న తీర్పు పిలుపుకు కారణాన్ని తెలియజేస్తుంది.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: మా వాసనను కంపు కొట్టేలా చేసి
  rationale: ‘మా వాసనను దుర్వాసనగా చేశారు’ అనే స్పష్టమైన హీబ్రూ రూపకాన్ని తెలుగులో సజీవంగా, అర్థమయ్యేలా నిలిపింది.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: ఫరో దృష్టిలోను అతని సేవకుల దృష్టిలోను
  rationale: ‘కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం ‘దృష్టిలో’; పునరుక్తిని కూడా నిలిపింది.
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: మమ్మల్ని చంపడానికి వారి చేతిలో కత్తి పెట్టారు
  rationale: మూలంలోని ఏకవచన సమూహార్థక ‘కత్తి’ని, చంపడానికి సాధనం లేదా అవకాశం కల్పించారనే రూపకాన్ని నిలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తినామమైన చతురక్షర నామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా స్వీకృతమైన ‘యాహ్వే’ రూపంలో ఇచ్చింది.
- issue: יֵרֶא … וְיִשְׁפֹּט యొక్క భావం
  choice: శాపార్థక కోరికగా ‘చూసి తీర్పు తీర్చుగాక’
  alternative: భవిష్యదర్థంగా ‘చూసి తీర్పు తీరుస్తాడు’
  rationale: సందర్భంలో ఇది మోషే, అహరోనులపై దేవుని తీర్పును కోరే మాట; అయినా తీర్పు స్వరూపాన్ని మరింత నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన కథన శైలి. ‘కంపు కొట్టేలా’ అనే సజీవ రూపకం మూలంలోని శారీరక వాసనచిత్రాన్ని కాపాడుతుంది; పాదటిప్పణి దాని సామాజిక భావాన్ని వివరిస్తుంది.
