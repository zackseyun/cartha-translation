source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה הֵן רַבִּ֥ים עַתָּ֖ה עַ֣ם הָ/אָ֑רֶץ וְ/הִשְׁבַּתֶּ֥ם אֹתָ֖/ם מִ/סִּבְלֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: te
  text: 'ఫరో ఇలా అన్నాడు[a]: “ఇదిగో, ఇప్పుడు దేశంలోని ప్రజలు ఎంతో మంది ఉన్నారు; మీరు వారిని వారి భారమైన పనుల నుండి విరమింపజేస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు వారిచేత వారి పనులు మాన్పిస్తున్నారు,” లేదా “మీరు వారిని వారి భారాలనుండి విశ్రాంతి తీసుకునేలా చేస్తున్నారు.” హీబ్రూ క్రియకు ‘ఆపేలా చేయడం/మాన్పించడం’ అనే కారణార్థం ఉంది; శ్రమ సందర్భాన్ని ఎంత స్పష్టంగా తెలుపుతామనే దానిని బట్టి దీన్ని దగ్గరి భావాలతో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చూడండి
  rationale: ఫరో బలంగా దృష్టి ఆకర్షించే ఉద్ఘాటనను ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רַבִּים
  choice: అనేకులయ్యారు
  rationale: ప్రజల సంఖ్య ఎక్కువగా ఉందనే విధేయార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో పెరిగిన సంఖ్యపై ఫరో చేస్తున్న ఫిర్యాదును కూడా అందిస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశంలోని ప్రజలు
  rationale: హీబ్రూ పదబంధంలోని ‘దేశపు/దేశంలోని ప్రజలు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, ఇక్కడ ఐగుప్తులో ఉన్న శ్రామిక జనాన్ని మరీ నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ప్రస్తుత పరిస్థితిని సూచించే కాలావ్యయానికి సరళమైన సమానార్థకం.
- source_word: וְהִשְׁבַּתֶּם
  choice: మానుకునేలా చేస్తున్నారు
  rationale: שׁבת యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని—వారు పని ఆపేలా చేయడం—తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం సానుకూలమైన ‘విశ్రాంతి’ భావాన్ని బలవంతంగా చేర్చదు.
- source_word: מִסִּבְלֹתָם
  choice: తమ భారమైన పనులు
  rationale: సִבְלֹת అనే పదంలోని ‘భారాలు’ మరియు బలవంతపు శ్రమ అనే సందర్భార్థాలను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది; కేవలం మోసే భౌతిక భారాలుగా అపార్థం కాకుండా చేస్తుంది.
