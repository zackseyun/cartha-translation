  to: 'ఫరో ఇలా అన్నాడు[a]: “ఇదిగో, ఇప్పుడు దేశంలోని ప్రజలు ఎంతో మంది ఉన్నారు; మీరు వారిని వారి భారమైన పనుల నుండి విరమింపజేస్తున్నారు.”'
  rationale: The revision makes the quantitative clause and the causative labor-cessation clause more natural in modern standard Telugu, while retaining the Hebrew wording’s ambiguity between causing cessation from labor and causing rest from burdens. The footnote remains anchored at Pharaoh’s speech and supplies close alternatives without imposing an interpretation.
