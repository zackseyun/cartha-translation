translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఐగుప్తు’ అనే సుపరిచిత బైబిలు స్థలనామాన్ని ఉంచి, కַשׁ–תֶּבֶן పదజంటలోని సంభావ్య భేదాన్ని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా కాపాడాం.
