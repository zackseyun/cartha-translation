base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/012.yaml
  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: te
  text: అప్పుడు ప్రజలు పుల్లకు బదులుగా పొలంలో మిగిలిన ఎండిన కాడలను ఏరుకోవడానికి ఐగుప్తు దేశమంతటా చెదరిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, קַשׁ మరియు תֶּבֶן పదాల మధ్య తేడాను అంత స్పష్టంగా పరిగణించకపోతే, “పొలంలో మిగిలిన ఎండిన కాడల కోసం పుల్లను ఏరుకోవడానికి” అని అనువదించవచ్చు. ప్రధాన పాఠం సేకరించిన పంట అవశేషాలకు, సాధారణంగా ఇచ్చే పుల్లకు మధ్య ఉన్న సంభావ్య తేడాను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: చెదరిపోయారు
  rationale: పוץ క్రియ ఇక్కడ ఫరో విధానం వల్ల ప్రజలు విస్తారమైన ప్రాంతమంతటా విడిపోయి వెళ్లిన ఫలితాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘చెదరిపోయారు’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עַם అనే సమూహవాచకం సందర్భంలో ఇశ్రాయేలీయ కార్మికులను సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ సహజమైన, గౌరవప్రదమైన అనువాదం.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశమంతటా
  rationale: בְּכָל యొక్క విస్తృత, పంపిణీ భావాన్ని ‘దేశమంతటా’ సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְקֹשֵׁשׁ
  choice: పోగుచేసి
  rationale: קשש చెల్లాచెదురుగా ఉన్న చిన్న మొక్కల అవశేషాలను ఏరడం లేదా పోగుచేయడం సూచిస్తుంది. వాక్య నిర్మాణంలో ‘పోగుచేసి’ ఉద్దేశ్యంతో జరిగిన చర్యను సహజంగా కలుపుతుంది.
- source_word: קַשׁ
  choice: గడ్డి
  rationale: קַשׁ పొలంలో మిగిలిన ఎండు కాండాలు లేదా నాసిరకం మొక్కల అవశేషాలను సూచించవచ్చు. తֶּבֶן‌తో తేడాను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదంగా ‘గడ్డి’ ఎంచుకోబడింది.
- source_word: לַתֶּבֶן
  choice: పుల్లకు బదులుగా ఉపయోగించడానికి
  rationale: לְ ఇక్కడ ప్రయోజనం లేదా ప్రత్యామ్నాయ వినియోగాన్ని సూచిస్తుంది. సేకరించిన గడ్డి ఇటుకల తయారీలో సాధారణంగా ఇచ్చే పుల్ల స్థానంలో ఉపయోగించబడిందనే సందర్భార్థాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
