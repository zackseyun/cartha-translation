translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సంఘటనల కాలక్రమం మరియు మోషే అహరోనులు వేచి ఉన్న దృశ్యం స్పష్టంగా ఉండేలా అమర్చాం.
