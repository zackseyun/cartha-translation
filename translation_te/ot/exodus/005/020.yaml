source:
  edition: WLC
  text: וַֽ/יִּפְגְּעוּ֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן נִצָּבִ֖ים לִ/קְרָאתָ֑/ם בְּ/צֵאתָ֖/ם מֵ/אֵ֥ת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: te
  text: వారు ఫరో సమక్షం నుండి బయటికి వచ్చినప్పుడు, వారిని కలవడానికి నిలబడి ఉన్న మోషేను అహరోనును కలిశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషేను అహరోనును ఎదుర్కొన్నారు.” ఇక్కడి క్రియకు “ఎదురుపడ్డారు” అనే అర్థమూ ఉండవచ్చు; కొన్ని సందర్భాల్లో అది విరోధపూర్వకంగా ఎదుర్కోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: ఎదుర్కొన్నారు
  rationale: פגע అనే క్రియకు ‘కలిశారు/ఎదురుపడ్డారు’ అనే విస్తృత అర్థం ఉంది; తరువాతి వచనంలోని ఉద్రిక్త స్పందనను దృష్టిలో ఉంచుకొని, తెలుగులో సహజంగా ఉండే ‘ఎదుర్కొన్నారు’ను వాడాం. అయితే ఇది తప్పనిసరిగా విరోధపూర్వక ఎదుర్కొనడాన్ని సూచించదు; అందుకే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: మోషే అహరోనులను
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికలను తెలుగులో ప్రత్యేకంగా అనువదించకుండా, వ్యక్తుల పేర్లకు సహజమైన కర్మవిభక్తిని జోడించాం.
- source_word: נִצָּבִים
  choice: నిలబడి ఉన్న
  rationale: నצב కృదంతం నిలిచి ఉండడం లేదా ఒక స్థానంలో వేచి ఉండడం అనే కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘నిలబడి ఉన్న’ దానిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לִקְרָאתָם
  choice: వారిని కలవడానికి
  rationale: לקראת ఇక్కడ ఎవరికైనా ఎదురుగా వెళ్లడం లేదా వారిని కలిసేందుకు ఉండడం అనే భావాన్ని ఇస్తుంది. విరోధ భావాన్ని అనవసరంగా చేర్చకుండా ‘వారిని కలవడానికి’ అని అనువదించాం.
- source_word: בְּצֵאתָם
  choice: వారు ... బయటికి వచ్చినప్పుడు
  rationale: ב ఉపసర్గతో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ స్పష్టంగా ఉంటుంది.
- source_word: מֵאֵת פַּרְעֹה
  choice: ఫరో దగ్గరనుండి
  rationale: מֵאֵת ఒక వ్యక్తి సమక్షం లేదా సన్నిధి నుంచి దూరంగా రావడాన్ని సూచించగలదు. ‘ఫరో దగ్గరనుండి’ అనే రూపం ‘ఫరో వద్దనుండి’ అనే భావాన్ని సహజంగా నిలుపుతుంది.
