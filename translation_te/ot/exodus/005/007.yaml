source:
  edition: WLC
  text: לֹ֣א תֹאסִפ֞וּ/ן לָ/תֵ֨ת תֶּ֧בֶן לָ/עָ֛ם לִ/לְבֹּ֥ן הַ/לְּבֵנִ֖ים כִּ/תְמ֣וֹל שִׁלְשֹׁ֑ם הֵ֚ם יֵֽלְכ֔וּ וְ/קֹשְׁשׁ֥וּ לָ/הֶ֖ם תֶּֽבֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/007.yaml
  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: te
  text: ఇటుకలు చేయడానికి ప్రజలకు మునుపటిలా[a] ఇకపై ఎండుగడ్డి ఇవ్వకండి. వారే వెళ్లి తమ కోసం ఎండుగడ్డి ఏరుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నిన్నటిలా, మొన్నటిలా’; ఇది ‘మునుపటిలా’ లేదా ‘ఇంతకుముందులా’ అనే అర్థమిచ్చే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאסִפוּן
  choice: ఇకపై ... ఇవ్వకండి
  rationale: నిషేధంతో వచ్చిన יסף హిఫిల్ రూపం, ఇంతవరకు కొనసాగిన పనిని ఇక కొనసాగించవద్దనే భావాన్ని ఇస్తుంది.
- source_word: לָתֵת
  choice: ఇవ్వకండి
  rationale: נתן యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను సహజమైన తెలుగు ఆజ్ఞారూపంలో నిలుపుతుంది.
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: ఇటుకల తయారీలో కలిపే ఎండిన మొక్కల పదార్థాన్ని సాధారణ తెలుగు పాఠకులకు అర్థమయ్యేలా సూచిస్తుంది.
- source_word: לָעָם
  choice: ప్రజలకు
  rationale: עם అనే పదానికి నేరుగా సరిపోయే ‘ప్రజలు’ అనే అర్థాన్ని ఉంచి, పాఠ్యంలో లేని ‘కూలీలు’ వంటి సంకుచితీకరణను నివారిస్తుంది.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: ఇటుకలు చేయడానికి
  rationale: క్రియార్థక రూపం మరియు దాని కర్మ కలిసి తెలిపే ప్రయోజన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: మునుపటిలా
  rationale: అక్షరార్థంగా ‘నిన్న, మొన్నటిలా’ అనే హీబ్రూ నానుడి ఇక్కడ ‘ఇంతకుముందులా’ అనే భావాన్ని ఇస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הֵם יֵלְכוּ
  choice: వారే వెళ్లి ... ఏరుకోవాలి
  rationale: స్వతంత్ర సర్వనామం కలిగిన అసంపూర్ణ క్రియ సందర్భంలో ఆదేశ భావాన్ని కలిగి ఉంది; ‘వారే’ అనేది ఇతరులు అందించకుండా వారే వెళ్లాలనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: וְקֹשְׁשׁוּ
  choice: ఏరుకోవాలి
  rationale: קשש చెల్లాచెదురుగా ఉన్న పదార్థాన్ని ఏరి సమకూర్చుకోవడాన్ని సూచిస్తుంది; ‘ఏరుకోవాలి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: దాతీవ్ సర్వనామం వారు తమ అవసరానికే గడ్డిని సమకూర్చుకోవాలని సూచిస్తుంది.
