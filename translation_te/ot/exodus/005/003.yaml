  to: 'వారు ఇలా అన్నారు[a]: “హెబ్రీయుల దేవుడు మమ్మల్ని కలుసుకున్నాడు. దయచేసి, అరణ్యంలోకి మూడు రోజుల ప్రయాణం చేసి మా దేవుడైన యెహోవాకు బలి అర్పించడానికి మమ్మల్ని అనుమతించండి. లేకపోతే ఆయన తెగులుతోనో కత్తితోనో మమ్మల్ని దెబ్బతీయవచ్చు.”'
