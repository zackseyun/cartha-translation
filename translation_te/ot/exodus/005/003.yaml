reference: Exodus 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు[a]: “హెబ్రీయుల దేవుడు మమ్మల్ని కలుసుకున్నాడు. దయచేసి, అరణ్యంలోకి మూడు రోజుల ప్రయాణం చేసి మా దేవుడైన యెహోవాకు బలి అర్పించడానికి మమ్మల్ని అనుమతించండి. లేకపోతే ఆయన తెగులుతోనో కత్తితోనో మమ్మల్ని దెబ్బతీయవచ్చు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మమ్మల్ని పిలిచాడు.” హీబ్రూ పదబంధం దేవుడు మమ్మల్ని కలుసుకున్నాడని లేదా మమ్మల్ని పిలిచాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: హెబ్రీయుల దేవుడు
  rationale: మూలంలోని సామాజిక-జాతి సూచనను ‘ఇశ్రాయేలీయులు’గా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: נִקְרָא עָלֵינוּ
  choice: మమ్మల్ని కలుసుకున్నాడు
  rationale: కרא నిఫాల్ రూపం עַל‌తో ఇక్కడ దైవిక సమావేశం లేదా ప్రత్యక్షతను సూచించగలదు; ‘పిలిచాడు’ అనే భావం కూడా సాధ్యమని పాదసూచికలో నిలుపబడింది.
- source_word: נֵלֲכָה נָּא
  choice: దయచేసి … వెళ్లి … మమ్మల్ని అనుమతించండి
  rationale: కోహోర్టేటివ్ అభ్యర్థనను, נָאలోని వినయపూర్వక వేడుకోలును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: మూడు రోజుల ప్రయాణం
  rationale: ప్రయాణ కాలం లేదా దూరాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలోకి
  rationale: ఇది కేవలం ఇసుక ఎడారిని కాక జనావాసం తక్కువైన బీడు ప్రాంతాన్ని కూడా సూచించగలందున ‘అరణ్యం’ తగిన విస్తృత పదం.
- source_word: וְנִזְבְּחָה
  choice: బలి అర్పించడానికి
  rationale: ముందున్న ప్రయాణ అభ్యర్థనకు ఉద్దేశాన్ని తెలిపే కోహోర్టేటివ్ వరుసను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు వినియోగంలో గుర్తించదగిన వ్యక్తినామ రూపంగా అందిస్తుంది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: హెచ్చరిక లేదా నివారణ భావాన్ని ఆధునిక, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִפְגָּעֵנוּ
  choice: మమ్మల్ని దెబ్బతీయవచ్చు
  rationale: ఈ సందర్భంలో తెగులు లేదా కత్తి ద్వారా సంభవించే ప్రతికూల దైవిక చర్యను స్పష్టంగా తెలుపుతుంది; తెలుగులో అవసరమైన సంభావ్యతను ‘వచ్చు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: తెగులుతోనో కత్తితోనో
  rationale: రెండు తీర్పు సాధనాల సమాంతర నిర్మాణాన్ని నిలుపుతూ, సాధనార్థక בְּను తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: దేవుడు వారిని ‘కలుసుకున్నాడా’ లేక ‘పిలిచాడా’
  choice: కలుసుకున్నాడు
  alternative: పిలిచాడు
  rationale: נִקְרָא עָלֵינוּ నిర్మాణం ఈ సందర్భంలో దైవిక సమావేశం/ఎదురుపడటాన్ని సూచించగలదు; నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- issue: יִפְגָּעֵנוּలోని చర్య
  choice: దెబ్బతీయవచ్చు
  alternative: మా మీద పడవచ్చు
  rationale: తెగులు లేదా కత్తితో జరిగే హానికర చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం అసహజంగా లేదా అస్పష్టంగా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘దయచేసి’ అభ్యర్థన స్వరాన్ని, ‘లేకపోతే’ హెచ్చరిక భావాన్ని సహజంగా మోస్తాయి. ప్రధాన పాఠ్యంలో [a] గుర్తు ఉంచబడింది.
