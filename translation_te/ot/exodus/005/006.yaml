translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పని చేయించే అధికారులు’ బలవంతంగా శ్రమ రాబట్టే נגשׂים పాత్రను సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది; ‘పర్యవేక్షకులు’ שֹׁטְרָיו యొక్క పరిపాలనా పాత్రను అతిగా సంకుచితం చేయకుండా అందిస్తుంది.
