  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: te
  text: 'ఆ రోజే ఫరో ప్రజల నుండి పని రాబట్టే అధికారులకు, తన పర్యవేక్షకులకు[a] ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కింది స్థాయి అధికారులకు.” హీబ్రూ పదం కార్మిక వ్యవస్థలో పరిపాలనా బాధ్యతలు నిర్వహించిన అధికారులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియలోని అధికారపూర్వక ఆదేశ భావాన్ని సహజమైన తెలుగు కథన భూతకాలంలో వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజే
  rationale: కాలసూచనతో పాటు సందర్భంలో కనిపించే తక్షణత్వాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆ రోజున’ అనే మరింత అక్షరార్థ రూపం కూడా సాధ్యమే.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: ప్రజలపై ఉన్న పని చేయించే అధికారులు
  rationale: נגשׂים అనేది బలవంతంగా పని రాబట్టే వారిని సూచిస్తుంది; בעם వారికీ ప్రజలకీ ఉన్న సంబంధాన్ని తెలుపుతుంది. ఈ అనువాదం వారి పాత్రను స్పష్టంగా ఉంచుతూ అతిగా ప్రత్యేకీకరించదు.
- source_word: שֹׁטְרָיו
  choice: తన పర్యవేక్షకులు
  rationale: కార్మిక వ్యవస్థలోని కింది స్థాయి అధికారులను సూచించే విస్తృత పదం; ‘నాయకులు’ కంటే పరిపాలనా పాత్రను బాగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష మాటలకు పరిచయంగా ఉన్న హీబ్రూ సూత్రప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
