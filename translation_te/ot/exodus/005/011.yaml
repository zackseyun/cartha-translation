  variant: modern standard Telugu
source:
  edition: WLC
  text: אַתֶּ֗ם לְכ֨וּ קְח֤וּ לָ/כֶם֙ תֶּ֔בֶן מֵ/אֲשֶׁ֖ר תִּמְצָ֑אוּ כִּ֣י אֵ֥ין נִגְרָ֛ע מֵ/עֲבֹדַתְ/כֶ֖ם דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: te
  text: మీరే వెళ్లి, మీ కోసం ఎండుగడ్డిని ఎక్కడ దొరికితే అక్కడి నుంచి సమకూర్చుకోండి[a]. ఎందుకంటే మీ పనిలో ఏ మాత్రం తగ్గింపు ఉండదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “మీ కోసం ఎండుగడ్డిని, మీరు ఎక్కడ కనుగొంటారో అక్కడి నుంచి తీసుకోండి.”'
    reason: lexical_alternative
  - marker: b
    text: 'పదశః: “ఎందుకంటే మీ పనిలో ఏదీ తగ్గించబడడం లేదు.” సందర్భంలో, విధించిన పని పరిమాణంలో ఎలాంటి కోత ఉండదనే భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: మీరే
  rationale: స్వతంత్ర సర్వనామం ఆజ్ఞకు ముందు బలాన్ని ఇస్తుంది; ‘మీరే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְכוּ
  choice: వెళ్లి
  rationale: הלך క్రియ యొక్క బహువచన ఆజ్ఞార్థక రూపం; తరువాతి ఆజ్ఞతో సహజంగా కలపడానికి ‘వెళ్లి’ అని అనువదించబడింది.
- source_word: קְחוּ לָכֶם
  choice: మీకు ... తెచ్చుకోండి
  rationale: קחו యొక్క ‘తీసుకోండి/సంపాదించుకోండి’ భావాన్నీ, לכם లోని తమకోసం తామే సమకూర్చుకోవాలనే భావాన్నీ ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: ఇటుకల తయారీ సందర్భంలో ఇది ఎండిన గడ్డి లేదా ధాన్యపు కాండాలను సూచిస్తుంది; సామాన్య ఆధునిక తెలుగులో ‘గడ్డి’ స్పష్టంగా అర్థమవుతుంది.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: ఎక్కడ దొరికితే అక్కడి నుంచి
  rationale: దొరికే ఏ ప్రదేశం నుంచైనా సమకూర్చుకోవాలనే మూలపాఠంలోని విస్తృత భావాన్ని, מן ఉపసర్గలోని ‘నుంచి’ భావంతో సహా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందరి ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది. సందర్భంలో కఠినమైన వ్యత్యాస ఛాయ ఉన్నప్పటికీ, మూలంలోని ప్రాథమిక కారణార్థాన్ని నిలుపుతుంది.
- source_word: אֵין נִגְרָע
  choice: తగ్గించబడదు
  rationale: גרע నిఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, విధించిన పనిలో కోత ఉండదనే సందర్భార్థాన్ని తెలుపుతుంది.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: మీ పనిలో ఏమాత్రమూ
  rationale: ‘మీ పని నుండి ఒక్క విషయమూ తగ్గదు’ అనే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు నిరాకరణ ప్రయోగంగా అందిస్తుంది; సంపూర్ణంగా ఏ తగ్గింపూ లేదని తెలియజేస్తుంది.
