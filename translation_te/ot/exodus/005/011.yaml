translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అధికారపూర్వక ఆజ్ఞ యొక్క కఠినతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా రూపొందించబడింది. ‘మీరే’ ద్వారా ఉద్ఘాటనను, ‘ఎక్కడ దొరికితే అక్కడి నుంచి’ ద్వారా మూలంలోని స్వేచ్ఛా-స్థాన భావాన్ని, ‘తగ్గించబడదు’ ద్వారా కర్మణి నిర్మాణాన్ని నిలుపుకుంది.
