  terminology: “గడ్డి,” “ఇటుకలు,” and deferential “నీ సేవకులు” suit the context and modern standard Telugu. The note's “పాపం చేశారు” is a viable formal/literal alternative, while the main text correctly avoids making that constrained Hebrew wording the sole interpretation.
