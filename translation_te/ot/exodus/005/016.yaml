source:
  edition: WLC
  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: te
  text: “నీ సేవకులకు గడ్డి ఇవ్వడం లేదు. అయినా, ‘ఇటుకలు చేయండి!’ అని మాతో అంటున్నారు. ఇదిగో, నీ సేవకులు కొట్టబడుతున్నారు; అయితే తప్పు నీ సొంత ప్రజలదే.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నీ ప్రజలు పాపం చేశారు.” హీబ్రూ ఉపవాక్యం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం కావచ్చు; ఈ సందర్భంలో తప్పు ఫరో ప్రజలదేనని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: ఇటుకల తయారీలో మట్టితో కలిపే ఎండిన మొక్క పదార్థాన్ని సూచించే సహజమైన తెలుగు పదం; ఈ సందర్భంలో ‘గడ్డి’ స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: אֵין נִתָּן
  choice: ఇవ్వడం లేదు
  rationale: ప్రతికూల అస్తిత్వ ప్రయోగం మరియు కర్మణి భావం, అవసరమైన గడ్డి సరఫరా చేయబడటం లేదనే కొనసాగుతున్న పరిస్థితిని తెలియజేస్తాయి.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: నీ సేవకులకు / నీ సేవకులను
  rationale: ఫరోతో మాట్లాడుతున్న ఇశ్రాయేలీయ నాయకుల వినయపూర్వక రాజసభా సంబోధనను, అలాగే వారి అధీన స్థితిని ‘సేవకులు’ సహజంగా నిలుపుతుంది.
- source_word: לְבֵנִים
  choice: ఇటుకలు
  rationale: లెక్కపెట్టి తయారు చేయవలసిన వస్తువులను నేరుగా సూచించే సాధారణ తెలుగు బహువచనం.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: ‘ఇటుకలు చేయండి!’ అని మాతో అంటున్నారు
  rationale: హీబ్రూ ప్రత్యక్ష వాక్యంలోని ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, ముందు వచ్చిన ‘ఇటుకలు’ అనే కర్మను తెలుగులో స్పష్టంగా పునరుక్తి చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కనిపిస్తున్న అన్యాయంపై ఫరో దృష్టిని బలంగా మళ్లించే సూచనాత్మక భావాన్ని, గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מֻכִּים
  choice: కొడుతున్నారు
  rationale: కొనసాగుతున్న దౌర్జన్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; సందర్భం వల్ల కర్మణి భావం స్పష్టంగానే ఉంటుంది.
- source_word: וְחָטָאת עַמֶּךָ
  choice: అయితే తప్పు నీ సొంత ప్రజలదే
  rationale: సంక్షిప్తంగా, వ్యాకరణపరంగా కఠినంగా ఉన్న హీబ్రూ ఉపవాక్యాన్ని సందర్భానుసారంగా ఫరో ప్రజలపైనే నేరారోపణగా అందిస్తుంది; ‘సొంత’ అనే పదం వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ అనే సంక్షిప్త ఉపవాక్యం ఎవరి తప్పును సూచిస్తుంది?
  choice: తప్పు నీ సొంత ప్రజలదే
  alternative: నీ ప్రజలు పాపం చేశారు
  rationale: హీబ్రూ రూపాన్ని మరింత అక్షరార్థంగా ‘నీ ప్రజలు పాపం చేశారు’ అని ఇవ్వవచ్చు. అయితే ఫరో అధికారులే గడ్డి ఇవ్వకుండా ఇటుకల సంఖ్యను డిమాండ్ చేసి సేవకులను కొడుతున్నారనే వాదనలో, ‘తప్పు నీ సొంత ప్రజలదే’ అనే భావం సందర్భానికి సహజంగా సరిపోతుంది. పాఠ్యంలోని నిజమైన అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఫరోను ఉద్దేశించిన వినయపూర్వక సంబోధనను నిలుపుతూ సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వచనం ప్రత్యక్ష ఫిర్యాదులోని తీవ్రతను కాపాడుతుంది; కఠినమైన చివరి హీబ్రూ ఉపవాక్యానికి ప్రధాన సందర్భార్థాన్ని పాఠ్యంలో ఇచ్చి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
