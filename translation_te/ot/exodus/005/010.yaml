- from: 'అప్పుడు ప్రజలపై పని చేయించే అధికారులు, ప్రజలలోని పర్యవేక్షకులు[a] బయటికి వెళ్లి వారితో ఇలా అన్నారు: “ఫరో ఇలా చెబుతున్నాడు: ‘నేను మీకు గడ్డి ఇవ్వడం లేదు.’”'
  to: 'అప్పుడు ప్రజలపై పని చేయించే అధికారులు, ప్రజలలోని పర్యవేక్షకులు[a] బయటికి వెళ్లి ప్రజలతో ఇలా అన్నారు: “ఫరో ఇలా చెబుతున్నాడు: ‘నేను మీకు ఎండుగడ్డి ఇవ్వడం లేదు.’”'
