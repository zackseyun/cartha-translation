source:
  edition: WLC
  text: וַ/יֵּ֨צְא֜וּ נֹגְשֵׂ֤י הָ/עָם֙ וְ/שֹׁ֣טְרָ֔י/ו וַ/יֹּאמְר֥וּ אֶל הָ/עָ֖ם לֵ/אמֹ֑ר כֹּ֚ה אָמַ֣ר פַּרְעֹ֔ה אֵינֶ֛/נִּי נֹתֵ֥ן לָ/כֶ֖ם תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: te
  text: 'అప్పుడు ప్రజలపై పని చేయించే అధికారులు, ప్రజలలోని పర్యవేక్షకులు[a] బయటికి వెళ్లి ప్రజలతో ఇలా అన్నారు: “ఫరో ఇలా చెబుతున్నాడు: ‘నేను మీకు ఎండుగడ్డి ఇవ్వడం లేదు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రజలలోని పనిపెద్దలు.” హెబ్రీ పదం ప్రజలలో ఉన్న కింది స్థాయి అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: పని చేయించే అధికారులు
  rationale: ఈ సందర్భంలో బలవంతపు శ్రమను, పని పరిమాణాన్ని అమలు చేయించే అధికారులను సూచిస్తుంది. ‘పని చేయించే అధికారులు’ అనేది అణచివేతతో కూడిన పర్యవేక్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שֹׁטְרָיו
  choice: ప్రజలలోని పర్యవేక్షకులు
  rationale: ఏకవచన ప్రత్యయం ‘ప్రజలు’ అనే సమూహ నామాన్ని తిరిగి సూచిస్తుంది. వీరు ప్రజలలో నుంచే నియమించబడిన కింది స్థాయి నిర్వాహకులు లేదా పనిపెద్దలు; ప్రధాన పాఠంలోని పదబంధం ఆ పరిపాలనా భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: וַיֵּצְאוּ
  choice: బయటికి వెళ్లి
  rationale: ఫరో సమక్షం నుండి ప్రజల దగ్గరికి వెళ్లిన కథన గమనాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సమూహ నామానికి నేరమైన అనువాదం; సందర్భంలో ఇశ్రాయేలీయ శ్రామిక జనాన్ని సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ ప్రయోగాన్ని సహజమైన తెలుగు కథన రూపంలో అందిస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: అధికారిక సందేశ ప్రకటన సూత్రాన్ని నిలుపుతూ, ఫరో ప్రస్తుత ఆజ్ఞగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: אֵינֶנִּי נֹתֵן
  choice: నేను ... ఇవ్వడం లేదు
  rationale: హెబ్రీ నిషేధాత్మక భాగధాతు నిర్మాణంలోని ప్రస్తుత నిరాకరణను కాపాడుతుంది; దాన్ని కేవలం భవిష్యత్ కాలానికి పరిమితం చేయదు.
- source_word: תֶּבֶן
  choice: గడ్డి
  rationale: ఇటుకల తయారీలో ఉపయోగించే straw ను సూచించే సహజమైన తెలుగు పదం; సందర్భం దాని ప్రయోజనాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలి ఉపయోగించబడింది. ప్రధాన పాఠంలో విదేశీ లేదా పాత పరిపాలనా పదజాలాన్ని తగ్గించి, రెండు అధికార వర్గాల మధ్య తేడాను సందర్భానుసారంగా నిలుపుకున్నాం.
