  terminology: ‘ఫరో’ is standard. ‘ప్రజలపై పని చేయించే అధికారులు’ appropriately conveys taskmasters, while ‘ప్రజలలోని పర్యవేక్షకులు’ preserves the distinct, subordinate administrative group. The footnote supplies ‘పనిపెద్దలు’ as a suitable contextual alternative.
