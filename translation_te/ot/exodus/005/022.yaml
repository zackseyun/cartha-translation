id: EXO.5.22
reference: Exodus 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: te
  text: అప్పుడు మోషే యహ్వే వద్దకు తిరిగి వెళ్లి, “ప్రభువా, నీవు ఈ ప్రజలకు ఎందుకు హాని కలిగించావు? అసలు నన్నెందుకు పంపావు?[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా, “ఎందుకు ఇది—నన్ను పంపావు?” అనే విధంగా ఉంది; ఇది “అసలు నన్నెందుకు పంపావు?” అనే ఉద్ఘాటనతో కూడిన ప్రశ్న.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లి
  rationale: שׁוב అనే క్రియ ఇక్కడ ‘తిరిగి వెళ్లడం’ అనే సహజ అర్థాన్ని ఇస్తుంది. ఫరో స్పందన తర్వాత మోషే దేవుని దగ్గరికి తిరిగి వెళ్లిన సందర్భానికి ఇది సరిపోతుంది.
- source_word: אֶל יְהוָה
  choice: యహ్వే దగ్గరికి
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది; יְהוָה అనే దేవుని నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవుణ్ణి గౌరవపూర్వకంగా నేరుగా సంబోధించే రూపం. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: הֲרֵעֹתָה
  choice: హాని కలిగించావు
  rationale: רעע యొక్క హిఫీల్ రూపం కీడు లేదా హాని కలిగించడం అనే కారణార్థాన్ని వ్యక్తపరుస్తుంది. సందర్భంలోని విపత్తును స్పష్టపరుస్తూనే దేవుడు నైతిక దుష్టత్వం చేశాడనే భావాన్ని అనవసరంగా మోపదు.
- source_word: לָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: עָם ఇక్కడ ఇశ్రాయేలీయులను ఒక సమూహంగా సూచిస్తుంది; ‘ప్రజలు’ సహజమైన సమానార్థకం.
- source_word: לָמָּה זֶּה
  choice: అసలు నన్నెందుకు
  rationale: లౌకికంగా ‘ఎందుకు ఇది’ అనే నిర్మాణం ఉన్నా, సందర్భంలో ఇది ప్రశ్నకు ఉద్ఘాటన ఇస్తుంది. ‘అసలు నన్నెందుకు’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁלַחְתָּנִי
  choice: నన్ను పంపావు
  rationale: రెండవ పురుష ఏకవచన క్రియకు మొదటి పురుష ఏకవచన కర్మ ప్రత్యయం జతై, ‘నన్ను పంపావు’ అనే నేరమైన అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దేవుని నామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం ఉంది. దానిని ‘యహ్వే’గా ఉంచడం ఒడంబడిక నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: הֲרֵעֹתָה లోని కీడు భావం
  choice: హాని కలిగించావు
  alternative: కీడు చేశావు
  rationale: మోషే మాటలోని ధైర్యమైన అభ్యంతరాన్ని నిలుపుతూ, ఈ కారణార్థక క్రియను నైతిక దుష్టత్వంగా ముందే తీర్మానించకుండా విపత్తు లేదా హాని కలిగించడం అనే భావంతో అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మోషే దేవునితో చేసే గంభీరమైన ప్రశ్న స్వరాన్ని తగ్గించకుండా అనువదించబడింది. ‘ప్రభువా’ గౌరవపూర్వక సంబోధనగా, ‘అసలు’ హీబ్రూ ఉద్ఘాటనను సహజంగా వ్యక్తపరచడానికి వాడబడ్డాయి.
