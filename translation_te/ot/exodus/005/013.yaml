translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. బలవంతపు శ్రమ సందర్భాన్ని స్పష్టం చేయడానికి ‘పని చేయించే అధికారులు’ అని, కొనసాగుతున్న ఒత్తిడిని చూపడానికి ‘తొందరపెడుతూ’ అని అనువదించాం. హీబ్రూ నుడికారంలోని నిజమైన విస్తృతతను ప్రధాన పాఠం మరియు పాదటిప్పణి కలిసి కాపాడుతున్నాయి.
