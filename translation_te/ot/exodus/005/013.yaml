  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: te
  text: పని చేయించే అధికారులు వారిని తొందరపెడుతూ, “గడ్డి ఉన్నప్పటిలాగే, ప్రతిరోజూ ఆ రోజుకు నిర్ణయించిన పనిని[a] పూర్తి చేయండి” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిరోజూ ఆ రోజుకు నిర్ణయించిన పనిమొత్తాన్ని.” హీబ్రూ నుడికారం అక్షరార్థంగా “ఒక దినపు విషయం దాని దినంలో” అని ఉంది; ఇది ప్రతి రోజుకూ నిర్ణయించిన పనిమొత్తాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: పని చేయించే అధికారులు
  rationale: నిర్గమకాండంలోని బలవంతపు శ్రమ సందర్భంలో, ఈ పదం పని చేయించి నిర్ణీత ఉత్పత్తిని రాబట్టే అధికారులను సూచిస్తుంది. ఆధునిక తెలుగులో ఈ ఎంపిక వారి అధికారిక పాత్రను సహజంగా తెలియజేస్తుంది.
- source_word: אָצִים
  choice: తొందరపెడుతూ
  rationale: ఈ కృదంతం కొనసాగుతున్న ఒత్తిడిని సూచిస్తుంది. ‘తొందరపెడుతూ’ అనేది పనిని త్వరగా పూర్తి చేయాలనే నిరంతర బలవంతాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּלּוּ
  choice: పూర్తి చేయండి
  rationale: అప్పగించిన పనిని ముగించాలనే ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מַעֲשֵׂיכֶם
  choice: పనిని
  rationale: సందర్భంలో ఇది ఇశ్రాయేలీయులకు అప్పగించిన ఇటుకల తయారీ పనిని సూచిస్తుంది; ‘పని’ మూలపదపు విస్తృతతను నిలుపుతుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతిరోజూ ఆ రోజుకు నిర్ణయించిన పనిని
  rationale: ‘ఒక దినపు విషయం దాని దినంలో’ అనే హీబ్రూ నుడికారానికి సందర్భానుసారంగా రోజువారీగా పూర్తి చేయవలసిన నిర్ణీత పనిమొత్తం అనే భావం ఉంది. ప్రధాన పాఠంలో సహజత్వాన్ని కాపాడుతూ, ‘పని’ మరియు ‘పనిమొత్తం’ మధ్యనున్న భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: כַּאֲשֶׁר
  choice: ఉన్నప్పటిలాగే
  rationale: మునుపటి పరిస్థితితో పోలికను స్పష్టంగా సూచిస్తుంది.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: గడ్డి ఉన్నప్పుడు
  rationale: గడ్డి అందుబాటులో ఉన్న పూర్వ పరిస్థితిని సంక్షిప్తంగా తెలియజేస్తుంది; అది సరఫరా చేయబడిందనే భావాన్ని సందర్భానికే వదిలివేస్తుంది.
