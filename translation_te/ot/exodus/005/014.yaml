revisions:
- from: ఇశ్రాయేలీయులపై ఫరో వెట్టిచాకిరి పర్యవేక్షకులు నియమించిన ఇశ్రాయేలు పనినాయకులు కొట్టబడ్డారు. “మునుపటిలాగే[a] ఇటుకలు చేయడంలో మీకు నిర్ణయించిన లెక్కను నిన్నా, నేడూ ఎందుకు పూర్తి చేయలేదు?” అని వారిని అడిగారు.
  to: ఫరో వెట్టిచాకిరి పనుల పర్యవేక్షకులు ఇశ్రాయేలీయుల మీద నియమించిన ఇశ్రాయేలు పనినాయకులు కొట్టబడ్డారు. “మునుపటిలాగే[a] ఇటుకలు చేయడంలో మీకు నిర్ణయించిన మోతాదును నిన్నా నేడూ ఎందుకు పూర్తి చేయలేదు?” అని చెప్పి వారిని కొట్టారు.
  rationale: The revision retains the Hebrew passive report and the labor-administration roles while removing the unsupported explicit statement that the taskmasters ‘asked’ the foremen. It uses a more idiomatic Telugu expression for the required brick quota and slightly smooths the relative clause. The footnote anchor and its explanation remain appropriate.
  reviewer_model: gpt-5.6-terra
