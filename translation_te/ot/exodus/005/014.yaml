translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘పనినాయకులు’ మరియు ‘వెట్టిచాకిరి పర్యవేక్షకులు’ అనే వేర్వేరు పదాలతో ఇశ్రాయేలీయుల దిగువస్థాయి నాయకులకు, ఫరో అధికారులకు మధ్య ఉన్న భేదాన్ని నిలిపాం. హీబ్రూ కర్మణి రూపాన్ని ‘కొట్టబడ్డారు’గా కాపాడి, తరువాతి ఉక్తిని సహజ తెలుగులో ‘అని వారిని అడిగారు’గా అందించాం.
