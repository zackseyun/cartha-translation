source:
  edition: WLC
  text: וַ/יֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר שָׂ֣מוּ עֲלֵ/הֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵ/אמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חָקְ/כֶ֤ם לִ/לְבֹּן֙ כִּ/תְמ֣וֹל שִׁלְשֹׁ֔ם גַּם תְּמ֖וֹל גַּם הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: te
  text: ఫరో వెట్టిచాకిరి పనుల పర్యవేక్షకులు ఇశ్రాయేలీయుల మీద నియమించిన ఇశ్రాయేలు పనినాయకులు కొట్టబడ్డారు. “మునుపటిలాగే[a] ఇటుకలు చేయడంలో మీకు నిర్ణయించిన మోతాదును నిన్నా నేడూ ఎందుకు పూర్తి చేయలేదు?” అని చెప్పి వారిని కొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిన్న మొన్నటిలాగా”; ఇది “మునుపటిలాగే” అనే అర్థమిచ్చే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: కొట్టబడ్డారు
  rationale: נכה క్రియ యొక్క కర్మణి బహువచన రూపాన్ని సహజంగా వ్యక్తపరుస్తుంది; శిక్ష విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పనినాయకులు
  rationale: ఈ నిర్బంధ శ్రమ సందర్భంలో שֹׁטְרִים ఇశ్రాయేలీయులలోనుంచి కార్మికులపై నియమించబడిన దిగువస్థాయి నాయకులను సూచిస్తుంది; ‘పనినాయకులు’ వారి పాత్రను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֹגְשֵׂי פַרְעֹה
  choice: ఫరో వెట్టిచాకిరి పర్యవేక్షకులు
  rationale: נֹגְשִׂים బలవంతంగా పని చేయించే అధికారులను సూచిస్తుంది; ‘వెట్టిచాకిరి’ నిర్బంధ శ్రమ స్వభావాన్ని, ‘పర్యవేక్షకులు’ వారి అధికార పాత్రను తెలియజేస్తాయి.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם
  choice: ఇశ్రాయేలీయులపై ... నియమించిన
  rationale: సంబంధ వాక్య నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో ఉంచుతూ, పనినాయకులు ఇశ్రాయేలీయులపై నియమించబడ్డారని స్పష్టం చేస్తుంది.
- source_word: חָקְכֶם
  choice: మీకు నిర్ణయించిన లెక్కను
  rationale: חֹק ఇక్కడ నిర్దేశించిన పని పరిమాణాన్ని సూచిస్తుంది. ‘నిర్ణయించిన లెక్క’ ఆధునిక తెలుగులో సహజంగా ఉండి, కోటా భావాన్ని కాపాడుతుంది.
- source_word: לִלְבֹּן
  choice: ఇటుకలు చేయడంలో
  rationale: לבן అనే క్రియారూపం ఇటుకలు తయారు చేయడాన్ని సూచిస్తుంది; నామవాచకంగా మార్చకుండా క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: మునుపటిలాగే
  rationale: అక్షరార్థంగా గత దినాలను ప్రస్తావించే ఈ హీబ్రూ ప్రయోగం ‘ఇంతకుముందులాగే’ అనే భావాన్నిస్తుంది; సహజమైన తెలుగు సమానార్థక ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: నిన్నా, నేడూ
  rationale: גַּם...גַּם అనే జత నిర్మాణంలోని రెండు రోజుల ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
