review_pass:
  verdict: revise
  source_fidelity: The passive ‘కొట్టబడ్డారు’ accurately represents וַיֻּכּוּ, and the distinction between Pharaoh’s taskmasters and Israelite subordinate foremen is retained. However, the final ‘అని వారిని అడిగారు’ makes the taskmasters’ action explicit even though Hebrew uses an impersonal/passive construction (‘they were beaten, saying’). Telugu can preserve the source’s ambiguity with ‘అని చెప్పి వారిని కొట్టారు.’
  naturalness: The draft is generally understandable, but ‘ఇశ్రాయేలీయులపై ఫరో వెట్టిచాకిరి పర్యవేక్షకులు నియమించిన ఇశ్రాయేలు పనినాయకులు’ is syntactically heavy. Recasting the relative clause and using ‘వారి మీద’ provides a more natural, clear Telugu sentence. ‘నిర్ణయించిన లెక్క’ is less idiomatic for a labor quota than ‘నిర్ణయించిన మోతాదు.’
  terminology: ‘ఫరో’ and ‘ఇశ్రాయేలీయులు’ are appropriate. ‘వెట్టిచాకిరి పర్యవేక్షకులు’ conveys the coercive labor context, though ‘వెట్టిచాకిరి పనుల పర్యవేక్షకులు’ reads more fully. ‘పనినాయకులు’ adequately conveys the Israelite שֹׁטְרִים in context. ‘మునుపటిలాగే’ accurately represents the idiom, and the footnote correctly supplies its literal form.
  issues:
  - severity: medium
    issue: The translation adds an explicit subject/action, ‘అని వారిని అడిగారు,’ for the final quotation.
    rationale: The Hebrew attaches לֵאמֹר (‘saying’) to the beating but does not expressly say ‘they asked them.’ This wording also shifts emphasis from punishment to questioning. ‘అని చెప్పి వారిని కొట్టారు’ is natural Telugu and does not identify the speaker beyond the preceding taskmasters.
  - severity: low
    issue: ‘మీకు నిర్ణయించిన లెక్క’ is an awkward expression for the prescribed daily brick amount.
    rationale: חָקְכֶם denotes the assigned quota or fixed amount. ‘మీకు నిర్ణయించిన మోతాదు’ is idiomatic modern Telugu and retains the required-amount sense.
  revised_text: ఫరో వెట్టిచాకిరి పనుల పర్యవేక్షకులు ఇశ్రాయేలీయుల మీద నియమించిన ఇశ్రాయేలు పనినాయకులు కొట్టబడ్డారు. “మునుపటిలాగే[a] ఇటుకలు చేయడంలో మీకు నిర్ణయించిన మోతాదును నిన్నా నేడూ ఎందుకు పూర్తి చేయలేదు?” అని చెప్పి వారిని కొట్టారు.
