source:
  edition: WLC
  text: וְ/אֶת מַתְכֹּ֨נֶת הַ/לְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵי/הֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ כִּֽי נִרְפִּ֣ים הֵ֔ם עַל כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵ/אמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵ/אלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: te
  text: వారు నిన్నా మొన్నా తయారుచేసిన ఇటుకల నిర్ణీత సంఖ్యనే[a] వారిపై విధించండి; దానిలో ఏమాత్రం తగ్గించవద్దు. ఎందుకంటే వారు సోమరులు. అందుకే వారు, ‘మనం వెళ్లి మా దేవునికి బలి అర్పిద్దాం’ అంటూ కేకలు వేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, నుడికారంగా ‘మునుపటిలాగే’ లేదా ‘ఇంతకుముందు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: లెక్క
  rationale: ఇటుకల తయారీ సందర్భంలో ఇది కార్మికులు తప్పనిసరిగా పూర్తి చేయవలసిన నిర్ణీత పరిమాణాన్ని సూచిస్తుంది. ‘లెక్క’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి ‘తగ్గించవద్దు’ అనే ఆజ్ఞతో స్పష్టంగా సరిపోతుంది.
- source_word: הַלְּבֵנִים
  choice: ఇటుకలు
  rationale: సందర్భానికి అనుగుణమైన సూటి concrete noun.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: నిన్నా మొన్నా
  rationale: హీబ్రూ జంట కాలవ్యక్తీకరణను సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది; సందర్భంలో ‘ఇంతకుముందు/మునుపటిలాగే’ అనే విస్తృత భావమూ ఉండవచ్చని పాదసూచికలో తెలియజేయబడింది.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: వారిపై విధించండి
  rationale: కార్మికులపై నిర్ణీత ఉత్పత్తి బాధ్యతను మోపడం అనే పరిపాలనా, బలవంతపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: దానిలో ఏమాత్రం తగ్గించవద్దు
  rationale: నిర్ణీత లెక్కలో ఏ భాగాన్నీ తగ్గించకూడదనే సంపూర్ణ నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נִרְפִּים
  choice: సోమరులు
  rationale: ఫరో చేస్తున్న ఆరోపణను సాధారణ తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; ఇది వక్త అభిప్రాయం, కథకుని నిర్ధారణ కాదనే సందర్భం అలాగే నిలుస్తుంది.
- source_word: צֹעֲקִים
  choice: కేకలు వేస్తున్నారు
  rationale: తీవ్రంగా గొంతెత్తి కోరడం లేదా మొరపెట్టుకోవడం అనే participial భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: మేము వెళ్లి … బలి అర్పించనివ్వండి
  rationale: రెండు cohortative రూపాల విజ్ఞాపనాత్మక బలాన్ని తెలుగు ప్రత్యక్ష వాక్యంలో సహజంగా అందిస్తుంది.
- source_word: לֵאלֹהֵינוּ
  choice: మా దేవునికి
  rationale: బలి ఎవరికి అర్పించబడుతుందో తెలిపే సరళమైన సంబంధాన్ని నిలుపుతుంది.
