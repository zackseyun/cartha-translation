translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఫరో ఆజ్ఞలోని కఠినత్వాన్ని నిలుపుతూ, హీబ్రూ కాలవ్యక్తీకరణను ‘నిన్నా మొన్నా’గా సహజీకరించాం.
