  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: te
  text: ఆ పురుషులపై పని భారంగా ఉండనివ్వండి; వారు దానిలో కష్టపడాలి, అబద్ధపు మాటలను పట్టించుకోకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అసత్యపు మాటలను లక్ష్యపెట్టకూడదు,’ ‘మోసపూరితమైన మాటలవైపు చూడకూడదు.’ హీబ్రూ క్రియకు ‘దృష్టి పెట్టు,’ ‘లక్ష్యపెట్టు,’ ‘పట్టించుకో’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: భారం ఎక్కువగా ఉండనివ్వండి
  rationale: כבד యొక్క Qal రూపం ఇక్కడ పనిభారం వారిమీద భారంగా ఉండాలనే ఆజ్ఞను తెలియజేస్తుంది. సందర్భంలో శ్రమను మరింత కఠినం చేయడమే ఉద్దేశం; ఈ తెలుగు ప్రయోగం మూలంలోని ‘భారంగా ఉండు’ అనే రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָעֲבֹדָה
  choice: పని భారం
  rationale: עֲבֹדָה అంటే పని, శ్రమ లేదా సేవ. ఇటుకల తయారీకి సంబంధించిన బలవంతపు శ్రమ సందర్భంలో ‘పని భారం’ సహజంగా ఉండి, తరువాతి כבדతో ఉన్న భారార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הָאֲנָשִׁים
  choice: ఆ మనుష్యుల మీద
  rationale: עַל పనిభారం వారిమీద మోపబడిన చిత్రాన్ని నిలుపుతుంది. הָאֲנָשִׁיםను సందర్భంలోని పురుష కూలీలను సూచించే ‘ఆ మనుష్యులు’గా నిర్దిష్టంగా అనువదించాం.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: వారు దానిలో కష్టపడాలి
  rationale: עשה + ב ఇక్కడ ఆ పనిలో నిమగ్నమై పనిచేయడాన్ని సూచిస్తుంది. ‘దానిలో కష్టపడాలి’ బలవంతపు శ్రమ సందర్భాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, స్త్రీలింగ ప్రత్యయం בָהּ ముందున్న పనినే సూచిస్తుందని నిలుపుతుంది.
- source_word: וְאַל יִשְׁעוּ
  choice: పట్టించుకోకూడదు
  rationale: שעה అంటే దృష్టి పెట్టడం, లక్ష్యపెట్టడం, పట్టించుకోవడం. אַלతో కలసి ఇది ప్రతిషేధాన్ని తెలియజేస్తుంది; ‘పట్టించుకోకూడదు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: అబద్ధపు మాటలను
  rationale: דברי ఇక్కడ మాటలు లేదా ప్రకటనలు; שקר అసత్యం లేదా మోసాన్ని సూచిస్తుంది. ‘అబద్ధపు మాటలు’ ఫరో చేసిన తృణీకార వర్ణనను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ఫరో మోషే, అహరోనుల సందేశాన్ని వర్ణించిన తీరు
  choice: అబద్ధపు మాటలు
  alternative: వ్యర్థమైన మాటలు / మోసపూరితమైన మాటలు
  rationale: శ్లోకం ఈ మాటలు నిజంగా అబద్ధమని వ్యాఖ్యాత స్వరంతో నిర్ధారించడం కాదు; ఫరో వాటిని అలా కొట్టిపారేస్తున్నాడు. మూలంలోని שָׁקֶרను నేరుగా అనువదించి, ఆ ఉద్రిక్తతను సందర్భానికే వదిలాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పని భారం’ మరియు ‘కష్టపడాలి’ బలవంతపు శ్రమ సందర్భాన్ని సహజంగా తెలియజేస్తాయి. మూలంలోని పురుష సూచనను ‘ఆ మనుష్యులు’గా నిలిపాం.
