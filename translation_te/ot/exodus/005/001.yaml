    rationale: హీబ్రూలో ‘నా ప్రజలను పంపించు/విడిచిపెట్టు, వారు నాకు పండుగ ఆచరించునట్లు’ అనే విడుదల ఆజ్ఞకు అనుసంధానమైన ఉద్దేశం ఉంది. ‘చేయి’ పండుగను నిర్వహించమనే స్వతంత్ర ఆజ్ఞ భావాన్ని కలిగించవచ్చు.
