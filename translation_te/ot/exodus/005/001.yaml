  verdict: revise
  source_fidelity: మూలంలోని క్రమసూచక పదబంధం, ఫరో సమక్షానికి వెళ్లడం, దైవిక సందేశసూత్రం, దైవనామం, విడుదల ఆజ్ఞ, అరణ్యంలో పండుగ ఆచరించే ఉద్దేశం అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే “వారు ... పండుగ జరుపుకొనేలా చేయి” అనేది విడుదల చేయడం కంటే పండుగ ఏర్పాటుచేయమనే భావానికి కొద్దిగా జారవచ్చు. ఉద్దేశాన్ని ‘వెళ్లనివ్వు’ ఆజ్ఞకు నేరుగా అనుసంధానించడం మరింత నిష్కళంకం.
