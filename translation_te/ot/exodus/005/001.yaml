id: EXO.5.1
reference: Exodus 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: te
  text: 'ఆ తర్వాత మోషే, అహరోను ఫరో దగ్గరికి వెళ్లి ఇలా అన్నారు: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: ‘నా ప్రజలను వెళ్లనివ్వు, వారు అరణ్యంలో నాకు పండుగ ఆచరించడానికి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH అనే దైవ నామం ఉంది; దాని ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియదు. దీనిని ‘యెహోవా’ అని కూడా రాస్తారు.
    reason: దైవ నామపు లిప్యంతరీకరణలోని నిజమైన పాఠ్య, ఉచ్చారణ అనిశ్చితిని తెలియజేయడం.
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: తర్వాతి సంఘటనను పరిచయం చేసే కాలసూచక పదబంధం; వ్యవధిని అనవసరంగా నిర్దిష్టం చేయకుండా కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאוּ
  choice: దగ్గరికి వెళ్లి
  rationale: ఫరో సన్నిధికి ప్రవేశించి అతనిని కలిసిన భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; కేవలం ‘వచ్చారు’ అనడం తెలుగులో దృష్టికోణాన్ని అస్పష్టంగా చేయవచ్చు.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: ఫరో దగ్గరికి వెళ్లి ఇలా అన్నారు
  rationale: రాజును ఉద్దేశించి పలికిన సాధారణ కథన వాక్యసూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దైవిక సందేశవాహక సూత్రంలోని అధికార స్వరాన్ని నిలుపుతూ, అతిగా ప్రాచీనంగా వినిపించని ఆధునిక తెలుగు రూపం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: నా ప్రజలను వెళ్లనివ్వు
  rationale: ఫరో ఇశ్రాయేలీయులను విడుదల చేయాలనే ఆజ్ఞ బలాన్ని, తెలుగులో సహజమైన ఏకవచన ఆజ్ఞారూపంతో తెలియజేస్తుంది.
- source_word: וְיָחֹגּוּ לִי
  choice: వారు ... నాకు పండుగ జరుపుకొనేలా చేయి
  rationale: חגג అనే క్రియలోని నిర్దిష్టమైన పండుగ ఆచరణ భావాన్ని నిలుపుతుంది; ముందున్న ఆజ్ఞ యొక్క ఉద్దేశాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మిద్బార్ సూచించే జనావాసం తక్కువైన అడవి/వనాంతర ప్రాంతాన్ని ‘ఎడారి’ అని అతిగా సంకుచితం చేయకుండా తెలిపే సాధారణ బైబిలు తెలుగు పదం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, YHWHకు సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇలా అంటున్నాడు’ అధికారిక సందేశసూత్రాన్ని సహజంగా ఉంచుతుంది; ‘పండుగ జరుపుకొనేలా చేయి’ హీబ్రూ ఉద్దేశ నిర్మాణాన్ని స్పష్టంగా తెలుపుతుంది. వ్యక్తుల పేర్లు సాధారణ తెలుగు బైబిలు రూపాలైన ‘మోషే’, ‘అహరోను’, ‘ఫరో’గా ఇవ్వబడ్డాయి.
