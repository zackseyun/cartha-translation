  to: 'ఆ తర్వాత మోషే, అహరోను ఫరో దగ్గరికి వెళ్లి ఇలా అన్నారు: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: ‘నా ప్రజలను వెళ్లనివ్వు, వారు అరణ్యంలో నాకు పండుగ ఆచరించడానికి.’”'
  rationale: అహరోను పేరును సహజమైన ఏకవచన నామరూపంలో సవరించాను. అలాగే విడుదల ఆజ్ఞ తర్వాత వచ్చే ఉద్దేశాన్ని ‘వారు అరణ్యంలో నాకు పండుగ ఆచరించడానికి’ అని నేరుగా వ్యక్తపరిచాను. ఇది మూలంలోని וְיָחֹגּוּ לִי యొక్క ఉద్దేశ/ఫలిత సంబంధాన్ని నిలుపుతుంది; పండుగను సాధారణ ఆరాధనగా తగ్గించదు. పాదసూచిక bను పూర్తి పాదసూచిక సమితిలో ఉంచినప్పటికీ, సవరించిన పాఠ్యంలో దానికి ప్రత్యేక గుర్తు లేదు; ప్రచురణ అమరికలో ‘పండుగ ఆచరించడానికి[b]’ వద్ద b గుర్తును జోడించాలి.
