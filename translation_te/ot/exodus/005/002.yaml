id: EXO.5.2
reference: Exodus 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: te
  text: 'ఫరో ఇలా అన్నాడు: “యాహ్వే[a] ఎవరు, నేను ఆయన మాట విని ఇశ్రాయేలును వెళ్లనివ్వాలి? యాహ్వే నాకు తెలియదు; అంతేకాదు, ఇశ్రాయేలును నేను వెళ్లనివ్వను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు. ‘యెహోవా’ అనేది మరో ప్రాచుర్యంలో ఉన్న రూపం.
    reason: దైవనామానికి ఉన్న సంప్రదాయ అనువాదం, ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ రూపానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מִי
  choice: ఎవరు
  rationale: ఇది వ్యక్తి గుర్తింపును ప్రశ్నించే పదం; ఫరో యొక్క ధిక్కారపూరిత సవాలును సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: నేను ఆయన మాట విని
  rationale: שׁמע בְּקוֹל అనే ప్రయోగంలో వినడమే కాక విధేయత చూపడం అనే భావం ఉంది. తెలుగు ‘మాట విని’ రెండింటినీ సహజంగా మోస్తుంది.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును వెళ్లనివ్వడానికి
  rationale: నిర్గమకాండ సందర్భంలో שׁלח క్రియకు ‘వెళ్లనివ్వడం’ సహజమైన, సందర్భోచితమైన అర్థం.
- source_word: לֹא יָדַעְתִּי
  choice: ఎవరో నాకు తెలియదు
  rationale: పూర్తిక్రియ ఇక్కడ ఫరో ప్రస్తుత అజ్ఞానం లేదా గుర్తించని వైఖరిని సూచించగలదు; ఈ అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ముందటి ప్రకటనకు మరింత బలమైన నిరాకరణను జోడించే సంధాన భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לֹא אֲשַׁלֵּחַ
  choice: నేను వెళ్లనివ్వను
  rationale: అసంపూర్ణ క్రియ ఇక్కడ ఫరో యొక్క తక్షణ, దృఢమైన నిర్ణయాన్ని వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజాసమూహం లేదా జాతిని సూచించే పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించాం; ప్రత్యామ్నాయ సంప్రదాయ రూపాలను పాదసూచికలో తెలిపాం.
- issue: ఫరో చెప్పిన ‘తెలియదు’ అనే మాటలోని భావం
  choice: ఎవరో నాకు తెలియదు
  alternative: నేను యాహ్వేను అంగీకరించను
  rationale: יָדַע ఇక్కడ సాధారణంగా తెలియకపోవడాన్నీ, అధికారాన్ని గుర్తించకపోవడాన్నీ సూచించవచ్చు. అనువాదం ఒక భావానికే పరిమితం చేయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ఫరో యొక్క ధిక్కార స్వరం స్పష్టంగా ఉండేలా ప్రశ్నను నేరుగా ఉంచాం; ‘మాట విని’ అనే ప్రయోగం వినడం మరియు విధేయత చూపడం అనే రెండు భావాలనూ సహజంగా కలిగి ఉంది.
