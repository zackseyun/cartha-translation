- from: 'ఫరో ఇలా అన్నాడు: “నేను ఆయన మాట విని ఇశ్రాయేలును వెళ్లనివ్వడానికి యాహ్వే[a] ఎవరు? యాహ్వే ఎవరో నాకు తెలియదు. అంతేకాదు, ఇశ్రాయేలును నేను వెళ్లనివ్వను.”'
  to: 'ఫరో ఇలా అన్నాడు: “యాహ్వే[a] ఎవరు, నేను ఆయన మాట విని ఇశ్రాయేలును వెళ్లనివ్వాలి? యాహ్వే నాకు తెలియదు; అంతేకాదు, ఇశ్రాయేలును నేను వెళ్లనివ్వను.”'
  rationale: The revision preserves the Hebrew rhetorical structure (“Who is Yahweh, that I should obey his voice and let Israel go?”) in idiomatic Telugu and restores the direct, deliberately broad statement “Yahweh I do not know.” The footnote anchor remains correctly attached to the first occurrence of the divine name.
  reviewer_model: gpt-5.6-terra
