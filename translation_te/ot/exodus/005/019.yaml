id: EXO.5.19
reference: Exodus 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי יִשְׂרָאֵ֛ל אֹתָ֖/ם בְּ/רָ֣ע לֵ/אמֹ֑ר לֹא תִגְרְע֥וּ מִ/לִּבְנֵי/כֶ֖ם דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలీయుల పర్యవేక్షకులు తాము కష్టస్థితిలో ఉన్నామని గ్రహించారు, ఎందుకంటే వారితో ఇలా చెప్పబడింది: “మీ ఇటుకల సంఖ్యను, ప్రతి రోజుకు నిర్ణయించిన పరిమాణాన్ని, తగ్గించకూడదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: గ్రహించారు
  rationale: ראה అనే పదానికి ప్రాథమికంగా ‘చూశారు’ అనే అర్థం ఉన్నా, ఇక్కడ తమ పరిస్థితిని గుర్తించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘గ్రహించారు’ సహజంగా సందర్భార్థాన్ని అందిస్తుంది.
- source_word: שֹׁטְרֵי
  choice: పర్యవేక్షకులు
  rationale: ఈ సందర్భంలో ఐగుప్తీయుల అధికారానికి లోబడి ఇశ్రాయేలీయుల పనిని పర్యవేక్షించిన మధ్యస్థ అధికారులను సూచిస్తుంది; ‘పర్యవేక్షకులు’ వారి విధిని స్పష్టంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారుల’ అయినా, ఇది జాతిని సూచించే స్థిర ప్రయోగం; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజమైన సమగ్ర రూపం.
- source_word: אֹתָם בְּרָע
  choice: తాము చిక్కుల్లో ఉన్నామని
  rationale: అక్షరార్థ నిర్మాణం ‘వారిని చెడు స్థితిలో చూశారు’; ఇక్కడ నైతిక చెడు కాదు, ప్రతికూలమైన లేదా ప్రమాదకరమైన పరిస్థితి ఉద్దేశం. ప్రతిబింబార్థాన్ని తెలుగులో ‘తాము చిక్కుల్లో’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఎందుకంటే ... అని వారికి చెప్పబడింది
  rationale: తమ దుస్థితిని వారు గ్రహించడానికి కారణమైన ప్రకటనను ఇది పరిచయం చేస్తుంది. హీబ్రూ వాక్య సంబంధాన్ని తెలుగులో స్పష్టంగా చూపేందుకు కారణార్థక నిర్మాణం వాడాం.
- source_word: לֹא תִגְרְעוּ
  choice: తగ్గించకూడదు
  rationale: גרע అంటే తగ్గించడం లేదా తక్కువ చేయడం; నిషేధాజ్ఞ బలాన్ని సహజమైన ఆధునిక తెలుగులో ఈ రూపం తెలియజేస్తుంది.
- source_word: מִלִּבְנֵיכֶם
  choice: ఇటుకల సంఖ్యను
  rationale: లְבֵנִים అంటే ‘ఇటుకలు.’ తరువాతి దినసరి పరిమాణ ప్రయోగంతో కలిపి, తగ్గించరానిది ఇటుకల నిర్ణీత సంఖ్య అని స్పష్టంగా తెలిపాం.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: రోజుకు నిర్ణయించిన ... ఏ రోజుకారోజు
  rationale: అక్షరార్థంగా ‘ఒక దినపు విషయం దాని దినంలో’ అనే హీబ్రూ నుడికారం; ప్రతిరోజూ చెల్లించవలసిన నిర్ణీత పరిమాణాన్ని సూచిస్తుంది. మూలంలోని దినదిన పునరుక్తి భావాన్ని ‘ఏ రోజుకారోజు’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ నుడికారాన్ని పదక్షరంగా కాకుండా దాని దినసరి కోటా భావంతో అనువదిస్తూ, ‘ఏ రోజుకారోజు’ ద్వారా మూలంలోని పునరుక్తిని నిలిపాం.
