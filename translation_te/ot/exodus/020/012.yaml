  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּבֵּ֥ד אֶת אָבִ֖י/ךָ וְ/אֶת אִמֶּ֑/ךָ לְמַ֨עַן֙ יַאֲרִכ֣וּ/ן יָמֶ֔י/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: te
  text: నీ తండ్రిని, నీ తల్లిని గౌరవించు. తద్వారా నీ దేవుడైన యహ్వే నీకు ఇస్తున్న దేశంలో[b] నీ రోజులు దీర్ఘమవుతాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ రోజులు దీర్ఘమవుతాయి’ అనేది దీర్ఘకాలం జీవించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘నేలపై.’ హీబ్రూ ఉపసర్గకు అక్షరార్థంగా ‘మీద/పై’ అనే భావం ఉంది; సందర్భంలో దేవుడు ఇస్తున్న దేశాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: గౌరవించు
  rationale: పీయేల్ ఆజ్ఞారూపం తల్లిదండ్రులను ఘనతకు పాత్రులుగా పరిగణించి తగిన గౌరవం చూపాలని ఆదేశిస్తుంది. ‘గౌరవించు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆజ్ఞలోని నైతిక బలాన్ని నిలుపుతుంది.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: నీ తండ్రిని, నీ తల్లిని
  rationale: ఏకవచన ద్వితీయ పురుష సంబోధనను, తండ్రి–తల్లి జంటను నేరుగా మరియు సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לְמַעַן
  choice: అప్పుడు
  rationale: హీబ్రూ పదం ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగులో రెండు వాక్యాలను ‘అప్పుడు’తో కలపడం ఆజ్ఞకూ వాగ్దాన ఫలితానికీ ఉన్న సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: నీ రోజులు దీర్ఘమవుతాయి
  rationale: ‘నీ రోజులు’ అనే హీబ్రూ నుడికారాన్ని దాని బైబిలు ప్రతిధ్వనితో సహా నిలుపుతుంది; దాని భావం దీర్ఘాయుష్షు అని పాదసూచిక వివరిస్తుంది.
- source_word: עַל הָאֲדָמָה
  choice: దేశంలో
  rationale: దేవుడు ఇశ్రాయేలుకు ఇస్తున్న భూభాగమే సందర్భంలోని సూచన. తెలుగులో ‘దేశంలో’ సహజంగా ఉంది; עַל అనే విభక్తి యొక్క మరింత అక్షరార్థమైన ‘నేలపై’ పాదసూచికలో ఇవ్వబడింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సాధారణంగా ఉచ్చరించదగిన రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: ద్వితీయ పురుష ఏకవచన సంబంధాన్ని నిలుపుతూ, తెలుగులో ‘యహ్వే’తో సహజమైన విశేషణ నిర్మాణాన్ని ఇస్తుంది.
- source_word: נֹתֵן לָךְ
  choice: నీకు ఇస్తున్న
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా సమీప భవిష్యత్తు కార్యాన్ని నిలుపుతుంది; సీనాయి సందర్భంలో దేశం ఇంకా స్వాధీనంలోకి రానున్నదనే భావానికి సరిపోతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: הָאֲדָמָה యొక్క సందర్భార్థం
  choice: దేశం
  alternative: నేల / భూమి
  rationale: ‘నీకు ఇస్తున్న’ అనే మాటతో కలిసినప్పుడు ఇది సాధారణ మట్టిని లేదా మొత్తం భూమిని కాక, ఇశ్రాయేలుకు ఇవ్వబడుతున్న భూభాగాన్ని సూచిస్తుంది. అయితే హీబ్రూ పదంలోని నేల భావాన్ని పాదసూచిక గుర్తిస్తుంది.
- issue: దీర్ఘాయుష్షు వాగ్దానంలోని హీబ్రూ నుడికారం
  choice: నీ రోజులు దీర్ఘమవుతాయి
  alternative: నీవు దీర్ఘకాలం జీవిస్తావు
  rationale: మూలంలోని రూపక నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సాధారణ భావాన్ని పాదసూచికలో వివరిస్తుంది; వాగ్దానం స్వరూపాన్ని మరింతగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన ఆజ్ఞారూపం వాడబడింది. ఏకవచన ‘నీ’ సంబోధన మూలంలోని 2ms రూపాన్ని నిలుపుతుంది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో ఉంచి పాదసూచిక ద్వారా స్పష్టం చేశాము.
