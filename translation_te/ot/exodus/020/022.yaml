id: EXO.20.22
reference: Exodus 20:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నీవు ఇశ్రాయేలీయులకు[a] ఇలా చెప్పాలి: ‘నేను ఆకాశం నుండి[c] మీతో[b] మాట్లాడానని మీరే చూశారు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: “ఇశ్రాయేలు కుమారులకు”; ఇది ఇశ్రాయేలు ప్రజలను సామూహికంగా సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదశః “మీతో”; ఇది దేవుడు వారిని నేరుగా ఉద్దేశించి మాట్లాడిన సంగతిని నొక్కిచెబుతుంది. “మీకు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో పదరూపం “ఆకాశాల నుండి”; తెలుగు సాధారణ ప్రయోగంలో “ఆకాశం నుండి” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగులో దాని క్రమబద్ధ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, మూలంలోని వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: כֹּה תֹאמַר
  choice: ఇలా చెప్పాలి
  rationale: ఇది అధికారిక సందేశ సూత్రం; ‘ఇలా చెప్పాలి’ దాని ఆదేశాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులతో
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన సామూహిక ప్రయోగం; ‘ఇశ్రాయేలీయులు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది. పదశః రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: אַתֶּם
  choice: మీరే
  rationale: క్రియలో ఇప్పటికే వ్యక్తి సూచన ఉన్నప్పటికీ స్వతంత్ర సర్వనామం రావడం వల్ల ఉన్న ఉద్ఘాటనను ‘మీరే’ వెల్లడిస్తుంది.
- source_word: רְאִיתֶם
  choice: చూశారు
  rationale: వారు ప్రత్యక్ష సాక్షులైన గత సంఘటనను, ప్రస్తుత సందర్భంలో దాని సాక్ష్యబలాన్ని నిలుపుతూ సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי వారు చూసిన విషయవస్తువును పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణాత్మక ‘అని’ సహజ సమానం.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపం బహువచనమైనా, ఈ సందర్భంలో తెలుగు సాధారణ ప్రయోగం ఏకవచన ‘ఆకాశం’.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: మీతో మాట్లాడాను
  rationale: עִם పదం ‘తో’ అనే పరస్పర సమీపతను సూచిస్తుంది; తెలుగు ‘మీతో మాట్లాడాను’ సహజంగా ఉండి ప్రత్యక్ష సన్నిధి భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యెహ్వహ్ (יהוה) దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: వ్యాకరణ రూపం పుంలింగ బహువచనమైనా, సందర్భంలో ఇది ఒడంబడిక సమాజమంతటినీ సూచించే జాతివాచక ప్రయోగం. సహజ తెలుగు ప్రధాన పాఠంలో సామూహిక అర్థాన్ని ఇస్తూ, పదశః రూపాన్ని పాదటిప్పణిలో భద్రపరచింది.
- issue: דבר עם లోని ‘తో’ భావం
  choice: మీతో మాట్లాడాను
  alternative: మీకు చెప్పాను
  rationale: ‘మీతో’ అనే రూపం దేవుడు ప్రజలను నేరుగా ఉద్దేశించి మాట్లాడిన సన్నిధి భావాన్ని నిలుపుతుంది; దానిని పరస్పర సంభాషణగా అతిగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘మీరే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘మీతో’ ద్వారా ప్రత్యక్ష సంభాషణ భావాన్ని కాపాడింది.
