- source_word: לֵאמֹר
  choice: ':'
  rationale: హీబ్రూ ఉద్ధరణ-పరిచయ రూపాన్ని తెలుగులో అసహజమైన ‘ఇలా అంటూ’తో పునరావృతం చేయకుండా, తరువాతి ప్రత్యక్ష వాక్యాలను పరిచయం చేసే ద్విబిందువుతో సహజంగా వ్యక్తం చేస్తుంది.
