  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: te
  text: వాటిముందు సాష్టాంగపడకూడదు[a], వాటిని సేవించకూడదు[b]. ఎందుకంటే నేను నీ దేవుడైన యెహోవాను; నేను అసూయగల దేవుడను[c]. నన్ను ద్వేషించేవారి మూడవ, నాలుగవ తరాల వరకు తండ్రుల దోషాన్ని పిల్లలపైకి రప్పించేవాడను[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిముందు నేలవాలి నమస్కరించకూడదు.’ హెబ్రీ క్రియ గౌరవం లేదా ఆరాధనతో శరీరాన్ని వంచి నేలవాలడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటిని ఆరాధించకూడదు.’ ఇక్కడ ‘సేవించు’ అనే హెబ్రీ క్రియ విగ్రహాలకు చేసే ఆరాధనాపరమైన సేవను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘అసూయగల’ అనే పదం దేవునికి మాత్రమే చెందవలసిన ఆరాధనను ఇతరులకు ఇవ్వడాన్ని ఆయన సహించడని, ఆయనకున్న ప్రత్యేక ఒడంబడిక హక్కును సూచిస్తుంది. లేదా, ‘ఆసక్తిగల దేవుడు.’
    reason: lexical_alternative
  - marker: d
    text: 'అక్షరార్థానికి దగ్గరగా: ‘తండ్రుల దోషాన్ని పిల్లలపై, మూడవవారిపై మరియు నాలుగవవారిపై విచారించేవాడను.’ ఇది హెబ్రీ నుడికారం; దోషాన్ని పట్టించుకొని దానికి జవాబు కోరే దైవ చర్యను సూచిస్తుంది, కానీ దాని విధానాన్ని మరింత నిర్దిష్టంగా చెప్పదు. ద్వితీయోపదేశకాండము 24:16; యెహెజ్కేలు 18 చూడండి. లేదా, ‘నన్ను ద్వేషించేవారి మూడవ, నాలుగవ తరాలపై.’'
    reason: cross_reference
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: సాష్టాంగపడు
  rationale: ఈ క్రియ గౌరవం లేదా ఆరాధన సూచిస్తూ శరీరాన్ని వంచి నేలవాలడాన్ని తెలియజేస్తుంది. తరువాతి ‘సేవించు’ అనే క్రియతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: תָעָבְדֵם
  choice: వాటిని సేవించు
  rationale: עבד యొక్క ప్రాథమిక అర్థం ‘సేవించు’; విగ్రహాల సందర్భంలో ఆరాధనాపరమైన సేవను సూచించినా, మూలంలోని రెండు క్రియల భేదాన్ని ఈ పదం కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది.
- source_word: אֵל קַנָּא
  choice: రోషంగల దేవుడు
  rationale: కַנָּא ఇక్కడ ఒడంబడికలోని ప్రత్యేక హక్కును, ప్రత్యర్థి ఆరాధనను సహించని వైఖరిని సూచిస్తుంది. ‘రోషంగల’ అనే సహజ తెలుగు పదబంధం ఈ తీవ్రతను తెలియజేస్తుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: פֹּקֵד
  choice: తీసుకొస్తాను
  rationale: פּקד ఇక్కడ దేవుడు దోషాన్ని పట్టించుకొని దాని ప్రభావాన్ని తరువాతి తరాల మీదికి రప్పించే న్యాయచర్యను సూచిస్తుంది. ‘శిక్షిస్తాను’ అని అర్థాన్ని మరీ సంకుచితం చేయకుండా హెబ్రీయ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: עֲוֺן
  choice: దోషం
  rationale: עון లోని అపరాధం, దోషభారం, దాని పరిణామాలు అనే భావవ్యాప్తిని ‘దోషం’ కొంతవరకు తెరిచి ఉంచుతుంది.
- source_word: אָבֹת
  choice: తండ్రులు
  rationale: మూలంలోని పురుష బహువచనాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: בָּנִים
  choice: పిల్లలు
  rationale: ఈ తరాల సూత్రంలో בנים కుమారులకే పరిమితం కాకుండా సంతానాన్ని సూచించగలదు; ‘పిల్లలు’ సహజమైన సమగ్ర తెలుగు రూపం.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: మూడవ, నాలుగవ తరాల మీదికి
  rationale: హెబ్రీలో అధ్యాహారంగా ఉన్న ‘తరాలు’ అనే భావాన్ని స్పష్టపరుస్తూ, עַל పదం తెలిపే విస్తరణను నిలుపుతుంది.
- source_word: לְשֹׂנְאָי
  choice: నన్ను ద్వేషించేవారి విషయంలో
  rationale: తరతరాల హెచ్చరిక దేవుణ్ణి ద్వేషించేవారికి సంబంధించినదని తెలియజేస్తూ, ఈ పదబంధం దేనిని విశేషిస్తుందనే మూలంలోని కొంత అస్పష్టతను అతిగా పరిష్కరించదు.
theological_decisions:
- issue: దైవిక అసూయ/రోషాన్ని ఎలా అనువదించాలి
  choice: రోషంగల దేవుడు
  alternative: అసూయగల దేవుడు
  rationale: సందర్భం విగ్రహారాధనకు వ్యతిరేకమైన ఒడంబడిక విశిష్టత. ‘రోషం’ ప్రత్యర్థి ఆరాధనను సహించని దేవుని న్యాయమైన ప్రత్యేక హక్కును సూచిస్తుంది; సాధారణ మానవ అసూయగా అపార్థం కాకుండా పాదసూచిక వివరణ ఇస్తుంది.
- issue: తరతరాల న్యాయతీర్పును ఎలా వ్యక్తపరచాలి
  choice: తండ్రుల దోషాన్ని పిల్లల మీదికి—మూడవ, నాలుగవ తరాల మీదికి—తీసుకొస్తాను
  alternative: తండ్రుల పాపాల నిమిత్తం పిల్లలను మూడవ, నాలుగవ తరం వరకు శిక్షిస్తాను
  rationale: మూలంలోని ‘దోషాన్ని ... మీదికి పర్యవేక్షిస్తూ/తీసుకురావడం’ అనే నుడికారాన్ని నిలిపి, పిల్లలు స్వతంత్రంగా తండ్రుల పాపాలకు శిక్షించబడతారని వాక్యం కన్నా ఎక్కువగా నిర్ధారించకుండా దైవ న్యాయం గురించిన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నీ’తో నిలిపాం. హెబ్రీ క్రియలైన సాష్టాంగపడడం, సేవించడం మధ్య భేదాన్ని కాపాడాం. తరతరాల తీర్పు విషయంలో మూలంలోని నుడికారాన్ని సహజ తెలుగులో అందిస్తూ, దాని ధార్మిక ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
