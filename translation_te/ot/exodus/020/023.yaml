    reason: lexical_alternative
  revision_rationale: The revision removes the added ‘for yourselves’ nuance from the first clause while retaining it explicitly in the second clause, where the Hebrew has לָכֶם. It also preserves the repeated prohibition, the material descriptions, and the footnote anchor for the debated contextual force of אִתִּי.
