id: EXO.20.23
reference: Exodus 20:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: te
  text: మీరు నాతోపాటు[a] వెండి దేవుళ్లను చేయవద్దు; మీ కోసం బంగారు దేవుళ్లను చేయవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాతో’ లేదా ‘నా పక్కన.’ హీబ్రూలో అక్షరాలా ‘నాతో’; ‘నా పక్కన’ అనేది ప్రత్యర్థి దేవుళ్లను నిషేధించే భావాన్ని నొక్కిచెప్పే సాధారణ వ్యాఖ్యానాత్మక అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: చేసుకోవద్దు
  rationale: ఈ సందర్భంలో עשה ఆరాధన కోసం దేవతా ప్రతిమలను తయారుచేయడాన్ని సూచిస్తుంది. తెలుగులో ‘చేసుకోవద్దు’ నిషేధాన్ని సహజంగా వ్యక్తం చేస్తూ, రెండవ విభాగంలోని לָכֶם భావాన్ని కూడా స్పష్టంగా అందిస్తుంది.
- source_word: אִתִּי
  choice: నాతోపాటు
  rationale: అక్షరార్థమైన ‘నాతో’ అనే భావాన్ని నిలుపుతూ, ఇక్కడ యెహోవాతో కలిపి లేదా ఆయన పక్కన ఇతర దేవుళ్లను ఉంచే సంబంధాన్ని ‘నాతోపాటు’ సహజమైన తెలుగులో తెలియజేస్తుంది; ‘నాకు సమానంగా’ వంటి మరింత వ్యాఖ్యానాత్మక భావాన్ని చేర్చదు.
- source_word: אֱלֹהֵי כֶסֶף
  choice: వెండి దేవుళ్లను
  rationale: నిర్మాణ సమాసాన్ని తెలుగులో సహజంగా పదార్థాన్ని సూచించే ‘వెండి దేవుళ్లు’గా ఇచ్చింది; ఇది కేవలం అలంకార వస్తువులు కాక, వెండితో చేసిన ఆరాధ్య రూపాలనే సూచిస్తుంది.
- source_word: וֵאלֹהֵי זָהָב
  choice: బంగారు దేవుళ్లను
  rationale: మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడుతూ, బంగారంతో చేసిన దేవతా రూపాలను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: לָכֶם ప్రజలు తమ ఉపయోగం లేదా ఆరాధన కోసం వాటిని చేసుకోవడాన్ని సూచిస్తుంది. ‘మీ కోసం’ ఈ ప్రయోజనార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא ... לֹא
  choice: చేసుకోవద్దు ... చేసుకోవద్దు
  rationale: రెండుసార్లు వచ్చిన నిషేధాన్ని తెలుగులోనూ పునరావృతం చేసి, నిబంధనాత్మక ఆజ్ఞ యొక్క ప్రత్యక్షతను మరియు సమాంతరతను కాపాడింది.
theological_decisions:
- issue: אִתִּי అనే పదాన్ని ప్రత్యేక ఆరాధనను స్పష్టపరుస్తూ మరింత వ్యాఖ్యానాత్మకంగా అనువదించాలా?
  choice: నాతోపాటు
  alternative: నాతో; నా పక్కన
  rationale: హీబ్రూ పదానికి ప్రాథమిక భావం ‘నాతో.’ సందర్భం ప్రత్యర్థి దేవుళ్ల నిషేధాన్ని సూచించినా, ‘నాతోపాటు’ మూలంలోని సంబంధ భావాన్ని సహజంగా అందిస్తూ, ‘నాకు సమానంగా’ వంటి మూలంలో ప్రత్యక్షంగా లేని సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిషేధాత్మక శైలి. మూలంలోని రెండు సమాంతర నిషేధాలు నిలుపబడ్డాయి; బహువచన సంబోధనకు ‘మీరు/మీ’ వాడబడింది.
