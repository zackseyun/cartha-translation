base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: te
  text: నీవు నా కోసం మట్టితో ఒక బలిపీఠాన్ని చేయాలి. దానిమీద నీ దహనబలులను, నీ సమాధానబలులను, నీ గొర్రెలు మేకల మందలోనివాటినీ, నీ పశువుల మందలోనివాటినీ బలిగా అర్పించాలి. నేను నా నామాన్ని జ్ఞాపకం చేయించే ప్రతి స్థలంలో[a] నీ దగ్గరకు వచ్చి నిన్ను ఆశీర్వదిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా నామాన్ని ప్రకటించే ప్రతి స్థలంలో,” లేక “నేను నా నామాన్ని ప్రస్తావింపజేసే ప్రతి స్థలంలో.” హెబ్రీ క్రియ కారణార్థకంగా ఉంది; దేవుని నామాన్ని జ్ఞాపకం చేయించడం, ప్రకటించడం లేదా ప్రస్తావింపజేయడం అనే భావాలు ఇందులో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: మట్టితో ఒక బలిపీఠం
  rationale: అది నేల లేదా మట్టితో చేసిన బలిపీఠమని నిర్మాణార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה לִּי
  choice: నీవు నా కోసం ... చేయాలి
  rationale: న్యాయబోధ సందర్భంలోని ఆజ్ఞాత్మక భావాన్ని ‘చేయాలి’ సహజంగా అందిస్తుంది; ‘నా కోసం’ అంకితార్థాన్ని నిలుపుతుంది.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: దానిమీద ... బలిగా అర్పించాలి
  rationale: బలి సందర్భంలో זבח క్రియకు ‘బలిగా అర్పించు’ సహజమైన సమానార్థకం; עָלָיו సూచించిన బలిపీఠాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עֹלֹתֶיךָ
  choice: నీ దహనబలులు
  rationale: పూర్తిగా దహనం చేసే బలి అనే సాంకేతిక అర్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שְׁלָמֶיךָ
  choice: నీ సమాధానబలులు
  rationale: శాంతి, సంపూర్ణత, క్షేమం అనే విస్తృత భావసూచనను కలిగిన సంప్రదాయపరమైన తెలుగు పదం; కేవలం సహవాసార్థానికి పరిమితం చేయదు.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: నీ మందలోని పశువులు, నీ పశువుల గుంపులోని పశువులు
  rationale: צאן అంటే గొర్రెలు మాత్రమే కాక మేకలతో కూడిన చిన్న పశువుల మంద కావచ్చు; בקר పెద్ద పశువులను సూచిస్తుంది. జాతులను అనవసరంగా కుదించకుండా సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל הַמָּקוֹם
  choice: ప్రతి స్థలంలో
  rationale: హెబ్రీ వాక్యంలోని విభజనాత్మక విస్తృతిని సహజ తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: నేను నా నామం జ్ఞాపకం చేయబడేలా చేసే
  rationale: హిఫీల్ కారణార్థక రూపాన్ని, దేవుని కార్యసాధకత్వాన్ని నిలుపుతుంది; ప్రకటించడం, ప్రస్తావించడం, స్మారకంగా నిలపడం వంటి సాధ్యమైన సూక్ష్మార్థాలలో ఒక్కదానికే పరిమితం చేయదు.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: నీ దగ్గరకు వచ్చి నిన్ను ఆశీర్వదిస్తాను
  rationale: దైవిక సమీపం మరియు ఆశీర్వాదం అనే రెండు క్రియలను సహజమైన తెలుగు వాక్యప్రవాహంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי లో దేవుని చర్య యొక్క భావం
  choice: నేను నా నామం జ్ఞాపకం చేయబడేలా చేసే
  alternative: నేను నా నామాన్ని ప్రకటించే / ప్రస్తావించే / నమోదు చేసే
  rationale: కారణార్థక హెబ్రీ రూపాన్ని కాపాడుతూ, దేవుని నామం ఏ విధంగా జ్ఞాపకం చేయబడుతుందనే అంశాన్ని అనవసరంగా ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలుల సాంకేతిక పదాలకు స్థిరమైన రూపాలు వాడబడ్డాయి; మూలంలోని రెండవ పురుష ఏకవచనం ‘నీవు/నీ’గా నిలుపబడింది.
