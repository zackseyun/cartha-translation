id: EXO.20.2
reference: Exodus 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: te
  text: నేనే నీ దేవుడైన యాహ్వేను[a]; నిన్ను ఐగుప్తు దేశం నుండి, బానిసల గృహం[b] నుండి బయటకు తీసుకొచ్చినవాణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ఇక్కడ ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘బానిసల గృహం’; భావరీత్యా ‘బానిసత్వ గృహం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర ప్రథమ పురుష సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నేనే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రూపంలో బహువచనంగా ఉన్నా, ఇక్కడ ఏకవచన సూచనతో ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది; ఏకవచన స్వామ్య రూపం సహజం.
- source_word: אֲשֶׁר
  choice: …తీసుకొచ్చినవాణ్ణి
  rationale: హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో సహజమైన సంబంధార్థక క్రియారూపంతో వ్యక్తం చేశాం.
- source_word: הוֹצֵאתִיךָ
  choice: నిన్ను … బయటకు తీసుకొచ్చినవాణ్ణి
  rationale: יצא ధాతువు హిఫీల్ రూపం ‘బయటకు తీసుకురావడం’ అనే కారణార్థాన్ని ఇస్తుంది; నిర్గమన కార్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: מן సూచించే మూలస్థాన భావాన్నీ, ‘దేశం’ అనే భౌగోళిక నిర్మాణాన్నీ నిలుపుతుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల గృహం నుండి
  rationale: ‘దాసుల గృహం’ అనే హీబ్రూ మూర్తమైన బహువచన చిత్రణను నిలుపుతూ, బానిస బంధ స్థితిని సూచిస్తుంది; ‘బానిసత్వ గృహం’ అనే భావానువాదాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామమైన YHWHను నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: עֲבָדִים ద్వారా ఐగుప్తులోని బంధస్థితి
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ఐగుప్తులోని బలవంతపు శ్రమ, బంధం ప్రధానంగా ఉన్నందున సాధారణ సేవను సూచించే ‘సేవకులు’ సరిపోదు. ‘దాసులు’ గౌరవభరిత ఆధునిక వచనంలో ఆ బంధస్థితిని, మూలంలోని బహువచన రూపాన్ని రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘నేనే’ ద్వారా ఆరంభ ఉద్ఘాటనను, రెండు సార్లు వచ్చే ‘నుండి’ ద్వారా మూలంలోని సమాంతర నిర్మాణాన్ని నిలిపాం. దైవనామం మరియు ‘దాసుల గృహం’ వద్ద మాత్రమే అవసరమైన పాదటిప్పణులు ఉంచాం.
