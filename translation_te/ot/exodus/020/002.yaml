revisions:
- from: నేనే నీ దేవుడైన యాహ్వేను[a]; నిన్ను ఐగుప్తు దేశం నుండి, దాసుల గృహం[b] నుండి బయటకు తీసుకొచ్చినవాణ్ణి.
  to: నేనే నీ దేవుడైన యాహ్వేను[a]; నిన్ను ఐగుప్తు దేశం నుండి, బానిసల గృహం[b] నుండి బయటకు తీసుకొచ్చినవాణ్ణి.
  rationale: 'Only the rendering of עֲבָדִים is revised: దాసుల గృహం becomes బానిసల గృహం. This retains the source’s concrete plural expression and parallel syntax, while making the Egyptian bondage explicit in modern standard Telugu. Footnote anchors remain attached to the divine name and the phrase requiring the lexical alternative.'
  reviewer_model: gpt-5.6-terra
