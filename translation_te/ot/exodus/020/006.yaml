  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: te
  text: కాని నన్ను ప్రేమించి నా ఆజ్ఞలను పాటించేవారైన వేలమందికి స్థిరమైన ప్రేమను చూపిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెయ్యి తరాలకు.’ ద్వితీయోపదేశకాండము 5:10తో పోల్చండి; ఇక్కడి హెబ్రీ పాఠంలో ‘తరాలు’ అనే పదం లేక, అక్షరార్థంగా ‘వేలకు’ అని మాత్రమే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: కాని ... చూపిస్తాను
  rationale: ముందటి వచనంలోని శిక్షకు వ్యతిరేకమైన భావాన్ని సందర్భం సూచిస్తుంది. హెబ్రీ క్రియారూపం దేవుని నిరంతర కార్యాన్ని తెలిపినా, తెలుగు వాక్యంలో దైవ ప్రత్యక్ష వచనానికి సహజంగా ఉండే విధంగా వ్యక్త క్రియగా అనువదించబడింది.
- source_word: חֶסֶד
  choice: నిబంధన ప్రేమ
  rationale: חֶסֶד ప్రేమ, దయ, విశ్వసనీయత, నిబంధనపట్ల నిబద్ధత అనే భావాలను కలిపి సూచిస్తుంది. ‘నిబంధన ప్రేమ’ దాని సంబంధాత్మక, నిబద్ధమైన స్వభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַאֲלָפִים
  choice: వేలమందికి
  rationale: హెబ్రీ పాఠంలో అక్షరార్థంగా ‘వేలమందికి/వేలకొలదిమందికి’ మాత్రమే ఉంది; ‘తరాలు’ అనే పదం లేదు. వ్యక్తులను సూచించే తరువాతి పదబంధంతో తెలుగులో సహజంగా అనుసంధానించేందుకు ‘వేలమందికి’ ఎంచుకోబడింది.
- source_word: לְאֹהֲבַי
  choice: నన్ను ప్రేమిస్తూ
  rationale: హెబ్రీ భాగధాతువు కొనసాగుతున్న సంబంధ నిబద్ధతను సూచిస్తుంది. తరువాతి సమాంతర భాగంతో కలిపి ‘నన్ను ప్రేమిస్తూ ... పాటించేవారిలో’ అని సహజ తెలుగు నిర్మాణంలో ఇచ్చబడింది.
- source_word: וּלְשֹׁמְרֵי
  choice: పాటించేవారిలో
  rationale: ఆజ్ఞలను ఉద్దేశించినప్పుడు שׁמר అంటే కాపాడడం మాత్రమే కాక వాటిని ఆచరించడం లేదా పాటించడం. ‘పాటించేవారు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: מִצְוֺתָי
  choice: నా ఆజ్ఞలను
  rationale: దశాజ్ఞల న్యాయ-నిబంధన సందర్భాన్ని ‘ఆజ్ఞలు’ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: לַאֲלָפִים యొక్క పరిధి
  choice: వేలమందికి
  alternative: వెయ్యి తరాలవారికి
  rationale: ఈ వచనంలోని హెబ్రీ పాఠంలో ‘తరాలు’ అనే పదం ప్రత్యక్షంగా లేదు. అందువల్ల ప్రధాన పాఠం మూలంలోని అస్పష్టతను కాపాడుతుంది; ద్వితీయోపదేశకాండము 5:10తో పోల్చినప్పుడు సాధ్యమైన తరాల భావాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: నిబంధన ప్రేమ
  alternative: స్థిరమైన ప్రేమ / కృప
  rationale: ఈ పదం కేవలం భావోద్వేగ ప్రేమను లేదా క్షమను మాత్రమే కాక, దేవుని విశ్వసనీయమైన సంబంధ నిబద్ధతను కూడా సూచిస్తుంది. ఏకైక సిద్ధాంతపరమైన నిర్వచనానికి పరిమితం చేయకుండా ఆ లోతును నిలుపేందుకు ఈ పదబంధం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దశాజ్ఞల గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ‘నిబంధన ప్రేమ’ అనే పదబంధం కొంత ధార్మిక గంభీరత కలిగినా సందర్భానుకూలంగా మరియు అర్థవంతంగా ఉంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
