source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: te
  text: 'మోషే ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మిమ్మల్ని పరీక్షించడానికి, మీరు పాపం చేయకుండా ఉండేందుకు ఆయనపట్ల భయం[b] మీ ముందుండేలా దేవుడు వచ్చాడు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భయాందోళన చెందకండి.’ ఈ వచనంలో హీబ్రూ మొదట ‘భయపడకండి’ అని, తరువాత ‘ఆయనపట్ల భయం’ అని ఒకే మూలపదాన్ని ఉపయోగిస్తుంది. భయాందోళనకు, దేవునిపట్ల సముచితమైన భయానికి మధ్య ఉద్దేశపూర్వకమైన వ్యత్యాసం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయనపట్ల భక్తిపూర్వక భయం.’ హీబ్రూ నామవాచకం భయాన్నే కాక, భక్తితో కూడిన విస్మయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘మీ ముఖాల మీద.’ ఇది ఒక విషయం ఎల్లప్పుడూ వ్యక్తి ఎదుట ఉండడాన్ని లేదా మనసులో నిలిచి ఉండడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: భయపడకండి
  rationale: ירא అనే ఒకే మూలం వచనం చివరలోని יִרְאָתוֹతో మళ్లీ వస్తుంది. ‘భయపడకండి’ అని అనువదించడం, భయాందోళనకు మరియు దేవునిపట్ల నిలకడైన భయానికి మధ్య మూలపాఠంలోని ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: మిమ్మల్ని పరీక్షించడానికే
  rationale: לְבַעֲבוּר ఉద్దేశాన్ని, נסה పరీక్షించడం లేదా రుజువు చేయడాన్ని సూచిస్తాయి. ‘పరీక్షించడానికి’ అనేది చెడుకు ప్రలోభపెట్టడం అనే భావాన్ని చేర్చకుండా మూలార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘ఏ’ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: בָּא הָאֱלֹהִים
  choice: దేవుడు వచ్చాడు
  rationale: ఇక్కడ הָאֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది. సందర్భంలోని ప్రత్యక్ష సంఘటనకు తెలుగు సాధారణ భూతకాలం సహజంగా సరిపోతుంది.
- source_word: וּבַעֲבוּר תִּהְיֶה יִרְאָתוֹ
  choice: ఆయనపట్ల భయం … ఉండాలనే
  rationale: రెండవ לְבַעֲבוּר కూడా ఉద్దేశాన్ని సూచిస్తుంది. יִרְאָהకు భయం, భక్తిపూర్వక విస్మయం అనే భావపరిధి ఉంది; ‘భయం’ మొదటి క్రియతో పదసంబంధాన్ని, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: עַל־פְּנֵיכֶם
  choice: ఎల్లప్పుడూ మీ ముందుండేలా
  rationale: అక్షరార్థంగా ‘మీ ముఖాల మీద’ అనే ఈ నుడికారం, ఒక విషయం నిరంతరం వ్యక్తి ఎదుట లేదా అవగాహనలో ఉండడాన్ని సూచిస్తుంది. ఈ ఎంపిక నుడికారార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: మీరు పాపం చేయకుండా ఉండేలా
  rationale: ఈ నిర్మాణం ప్రతికూల ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. తెలుగు రూపం ఉద్దేశాన్ని సహజంగా, స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘భయపడకండి’ మరియు ‘ఆయనపట్ల భయం’ మధ్య కనిపించే ఉద్వేగం
  choice: ప్రధాన పాఠంలో రెండు చోట్లా ‘భయం’ అనే ఒకే తెలుగు మూలాన్ని నిలపడం
  alternative: మొదట ‘ఆందోళన చెందకండి,’ తరువాత ‘ఆయనపట్ల భక్తి’ అని అనువదించడం
  rationale: హీబ్రూ ఒకే భయ-మూలాన్ని ఉపయోగిస్తూ, నిషేధించబడిన భయాందోళనకు మరియు దేవునిపట్ల సముచితమైన భయానికి మధ్య వ్యత్యాసాన్ని సృష్టిస్తుంది. దాన్ని వివరణాత్మకంగా పరిష్కరించకుండా అనువాదంలో నిలపడం మూలపాఠంలోని వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
- issue: దేవుని ‘పరీక్ష’ స్వభావం
  choice: నైతికంగా చెడుకు ప్రలోభపెట్టడం అనే భావాన్ని చేర్చకుండా ‘పరీక్షించడానికి’ అని అనువదించడం
  alternative: రుజువు చేయడానికి; శోధించడానికి
  rationale: ఈ వచనంలో పరీక్ష ప్రజలు పాపం చేయకుండా ఉండాలనే ఉద్దేశంతో ముడిపడి ఉంది. ‘పరీక్షించడానికి’ మూలపాఠాన్ని మించిపోయే సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘భయపడకండి/భయం’ అనే పదసంబంధం ఉద్దేశపూర్వకంగా నిలుపబడింది. హీబ్రూ ఉద్దేశవాచక నిర్మాణాల పునరావృతిని తెలుగులో సహజంగా ఉండేందుకు రెండు వాక్యాలుగా అమర్చినా, దేవుడు రావడానికి చెప్పబడిన రెండు ఉద్దేశాలూ స్పష్టంగా ఉంచబడ్డాయి.
