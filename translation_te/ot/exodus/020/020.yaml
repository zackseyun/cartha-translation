revisions:
- from: 'మోషే ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మిమ్మల్ని పరీక్షించడానికే దేవుడు వచ్చాడు. మీరు పాపం చేయకుండా ఉండేలా, ఆయనపట్ల భయం[b] ఎల్లప్పుడూ మీ ముందుండాలనే[c] ఆయన వచ్చాడు.”'
  to: 'మోషే ప్రజలతో ఇలా అన్నాడు: “భయపడకండి.[a] మిమ్మల్ని పరీక్షించడానికి, మీరు పాపం చేయకుండా ఉండేందుకు ఆయనపట్ల భయం[b] మీ ముందుండేలా దేవుడు వచ్చాడు.[c]”'
  rationale: The revision places both purposive clauses under the single statement that God came, matching the Hebrew more closely. It removes the added adverb ‘ఎల్లప్పుడూ’ from the main text while retaining the idiomatic explanatory nuance in footnote c. Footnote anchors are placed directly after the words or clause they explain.
  reviewer_model: gpt-5.6-terra
