source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: te
  text: ఎందుకంటే ఆరు రోజుల్లో యాహ్వే ఆకాశాలను, భూమిని, సముద్రాన్ని, వాటిలో ఉన్న సమస్తాన్ని చేశాడు; ఏడవ రోజున ఆయన విశ్రమించాడు[a]. అందుచేత యాహ్వే సబ్బాతు దినాన్ని ఆశీర్వదించి, దాన్ని పవిత్రపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పని నుంచి విరమించాడు.’ ఈ హీబ్రూ క్రియ విశ్రాంతి పొందడం లేదా పని చేయడం ఆపడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సబ్బాతు ఆజ్ఞకు ఈ వాక్యం కారణాన్ని వివరిస్తోంది; ఆధునిక తెలుగులో ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజుల్లో
  rationale: సృష్టికార్యం జరిగిన కాలవ్యవధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: ‘చేయు/తయారుచేయు’ అనే విస్తృత అర్థమున్న హీబ్రూ క్రియకు, పేర్కొన్న సృష్టి సమస్తాన్ని ఉద్దేశించి ‘చేశాడు’ దగ్గరగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్ని, భూమిని
  rationale: సృష్టి సందర్భంలోని సమగ్ర జంటను ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הַיָּם
  choice: సముద్రాన్ని
  rationale: హీబ్రూలో ఉన్న ఏకవచనాన్ని నిలుపుతుంది.
- source_word: כָּל אֲשֶׁר בָּם
  choice: వాటిలో ఉన్న సమస్తాన్ని
  rationale: ఆకాశం, భూమి, సముద్రంలో ఉన్నదంతటినీ సమగ్రంగా సూచించే సంబంధ వాక్యాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: וַיָּנַח
  choice: విశ్రమించాడు
  rationale: పని అనంతరం విశ్రాంతి పొందడం లేదా ఆగిపోవడం అనే భావాన్ని సబ్బాతు సందర్భంలో సహజంగా తెలియజేస్తుంది; అలసటను తప్పనిసరిగా సూచించదు.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: విశ్రమించిన సమయాన్ని తెలుగులో సహజమైన కాలప్రయోగంతో తెలుపుతుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: సృష్టి క్రమం నుంచి సబ్బాతు దినపు ఆశీర్వాదం, పవిత్రీకరణకు వచ్చే నిర్ధారణను స్పష్టంగా కలుపుతుంది.
- source_word: יֹום הַשַּׁבָּת
  choice: సబ్బాతు దినాన్ని
  rationale: ప్రత్యేకంగా నియమించబడిన సబ్బాతు దినాన్ని గుర్తించే హీబ్రూ పదాన్ని లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: בֵּרַךְ ... וַיְקַדְּשֵׁהוּ
  choice: ఆశీర్వదించి, దాన్ని పవిత్రపరిచాడు
  rationale: దినంపై దేవుడు చేసిన రెండు వేర్వేరు కార్యాలను—ఆశీర్వదించడం, పవిత్రంగా ప్రత్యేకించడం—నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘యెహోవా’ అనే భిన్న సంప్రదాయ రూపానికి మళ్లకుండా ఉంచుతుంది.
- issue: ఏడవ రోజున దేవుని చర్య
  choice: విశ్రమించాడు
  alternative: పని నుంచి విరమించాడు
  rationale: נוּחַ విశ్రాంతి పొందడం/స్థిరపడడం అనే భావాన్ని ఇక్కడ మోస్తుంది. ‘విశ్రమించాడు’ సబ్బాతు నమూనాను సహజంగా తెలియజేస్తుంది; అది దేవుడు అలసిపోయాడని పాఠ్యంలో లేని భావాన్ని తప్పనిసరిగా చేర్చదు. ‘విరమించాడు’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచడం ద్వారా అర్థవ్యాప్తిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. జాబితా స్పష్టత కోసం కామాలు, కారణం-ఫలితం సంబంధం కోసం ‘ఎందుకంటే’ మరియు ‘అందుచేత’ వాడబడ్డాయి. పాదసూచిక గుర్తును సంబంధిత క్రియ ‘విశ్రమించాడు’ తర్వాత ఉంచాం.
