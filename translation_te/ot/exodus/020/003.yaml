  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: te
  text: నా ఎదుట నీకు వేరే దేవుళ్లు ఉండకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను తప్ప,” లేదా “నా సన్నిధిలో.” హీబ్రూలో అక్షరార్థంగా “నా ముఖం ఎదుట.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: ఉండకూడదు
  rationale: నిషేధాన్ని తెలిపే సాధారణ నిరాకరణ; తెలుగులో విధినిషేధ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיֶה לְךָ
  choice: నీకు ఉండకూడదు
  rationale: అక్షరార్థంగా ‘నీకు ఉండకూడదు/నీ కొరకు ఉండకూడదు’; సంబంధం లేదా స్వాధీనతను సూచించే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా నిలుపుతుంది. ఏకవచన సంబోధనను ‘నీకు’ కాపాడుతుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: వేరే దేవుళ్లు
  rationale: ఇక్కడ బహువచన నామవాచకంతో ఉన్న ‘ఇతర/వేరే’ అనే విశేషణం ప్రత్యర్థి దేవతలను సూచిస్తుంది; ‘వేరే దేవుళ్లు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עַל פָּנָי
  choice: నాకు ఎదురుగా
  rationale: ‘నా ముఖం ఎదుట’ అనే హీబ్రూ రూపకాన్ని సహజ తెలుగులో దగ్గరగా ప్రతిబింబిస్తుంది; ‘నన్ను తప్ప’ అనే ఏకార్థ వివరణతో మూలంలోని స్థలసంబంధ–ఒడంబడిక సంబంధ ఉద్రిక్తతను తొలగించదు.
theological_decisions:
- issue: עַל פָּנָי అనే పదబంధం యొక్క అర్థం
  choice: నాకు ఎదురుగా
  alternative: నన్ను తప్ప; నా సన్నిధిలో
  rationale: ఈ హీబ్రూ నుడికారం ‘నా ముఖం ఎదుట/నా సన్నిధిలో’ అనే భావాన్ని నేరుగా ఇవ్వగలదు; ఈ ఒడంబడిక సందర్భంలో అది ‘నన్ను తప్ప’ అనే సంపూర్ణ నిష్ఠ భావాన్ని కూడా సూచిస్తుంది. ప్రధాన పాఠంలో మూలరూపానికి దగ్గరైన పదబంధాన్ని ఉంచి, సాధ్యమైన భావాలను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఏకవచన సంబోధన వాడబడింది. మూలంలోని నిషేధ బలం, బహువచనం, మరియు עַל פָּנָי లోని నిజమైన అర్థవిస్తృతి నిలుపబడ్డాయి.
