source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: te
  text: 'వారు మోషేతో ఇలా అన్నారు: “నువ్వే మాతో మాట్లాడు; మేము వింటాం.[a] దేవుడు మాతో మాట్లాడకూడదు; లేకపోతే మేము చనిపోతాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము ఆలకిస్తాం.” హీబ్రూ క్రియ వినడం, శ్రద్ధగా ఆలకించడం, లేదా విని విధేయంగా స్పందించడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: వారు మోషేతో ... అన్నారు
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol‌ను సహజమైన తెలుగు భూతకాల వాక్యనిర్మాణంతో అనువదించింది; אֶל సందర్భానుసారంగా ‘మోషేతో’గా వచ్చింది.
- source_word: דַּבֵּר אַתָּה עִמָּנוּ
  choice: నువ్వే మాతో మాట్లాడు
  rationale: ఆజ్ఞతో పాటు ఉన్న స్పష్ట సర్వనామం אַתָּה మోషేనే మాట్లాడాలనే నొక్కిచెబుతుంది; ‘నువ్వే’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది. עִם యొక్క ‘తో’ భావాన్ని ‘మాతో’ కాపాడుతుంది.
- source_word: וְנִשְׁמָעָה
  choice: మేము వింటాం
  rationale: ఈ cohortative రూపం మోషే మాటకు ప్రజల సానుకూల ప్రతిస్పందనను సూచిస్తుంది. ‘వింటాం’ తెలుగులో వినడమనే ప్రత్యక్ష అర్థంతో పాటు శ్రద్ధగా ఆలకించడం లేదా విధేయంగా స్పందించడం అనే సందర్భార్థాన్నీ మోయగలదు.
- source_word: וְאַל־יְדַבֵּר עִמָּנוּ אֱלֹהִים
  choice: దేవుడు మాతో మాట్లాడనివ్వకు
  rationale: אַל + imperfect యొక్క నిషేధాత్మక/జస్సివ్ బలాన్ని ‘మాట్లాడనివ్వకు’ సహజంగా వ్యక్తం చేస్తుంది; אֱלֹהִים‌కు ఏకవచన క్రియ మరియు సీనాయి సందర్భం వల్ల ‘దేవుడు’ సరైనది.
- source_word: פֶּן־נָמוּת
  choice: లేకపోతే మేము చనిపోతాం
  rationale: פֶּן భయపడుతున్న పర్యవసానాన్ని పరిచయం చేస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘లేకపోతే’ సహజంగా, నేరుగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి వచనం మరియు సూచిత వ్యక్తి
  choice: ఏకవచనంగా ‘దేవుడు’
  alternative: ‘దేవుళ్లు’
  rationale: ఏకవచన క్రియారూపం మరియు సీనాయి సందర్భం ఇశ్రాయేలు దేవుణ్ణే సూచిస్తున్నాయి; ఇది వ్యాకరణ-సందర్భ ఆధారిత నిర్ణయం.
- issue: וְנִשְׁמָעָה లో వినడం మరియు విధేయత మధ్య భావ పరిధి
  choice: ప్రధాన పాఠంలో ‘మేము వింటాం’; విస్తృత భావాన్ని పాదసూచికలో ఉంచడం
  alternative: ‘మేము విధేయులమవుతాం’
  rationale: హీబ్రూ క్రియ వినడం, శ్రద్ధగా ఆలకించడం, స్పందనాత్మక విధేయత అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో ‘వింటాం’ మూల రూపానికి దగ్గరగా ఉండి ఆ ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘నువ్వే’ మోషేకు ఇచ్చిన ఉద్ఘాటనను నిలుపుతుంది; ‘లేకపోతే’ ప్రాచీనంగా వినిపించే పదబంధం లేకుండా פֶּן యొక్క గంభీర హెచ్చరికను స్పష్టంగా అందిస్తుంది.
