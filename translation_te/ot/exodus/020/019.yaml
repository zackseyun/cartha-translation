  to: 'వారు మోషేతో ఇలా అన్నారు: “నువ్వే మాతో మాట్లాడు; మేము వింటాం.[a] దేవుడు మాతో మాట్లాడకూడదు; లేకపోతే మేము చనిపోతాం.”'
