  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: te
  text: నీ పొరుగువాని ఇంటిపట్ల[a] కక్కుర్తిపడకూడదు; నీ పొరుగువాని భార్యపట్ల, అతని దాసునిపట్ల, అతని దాసిపట్ల, అతని ఎద్దుపట్ల, అతని గాడిదపట్ల, నీ పొరుగువానికి చెందిన దేనిపట్లనూ కక్కుర్తిపడకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పొరుగువాని ఇంటివారిపట్ల.’ హీబ్రూ పదానికి ‘ఇల్లు’ లేదా ‘ఇంటివారు/కుటుంబం’ అనే అర్థం ఉండవచ్చు. అయితే తరువాత భార్య, దాసదాసీలు, జంతువులు విడిగా పేర్కొనబడినందున ఇక్కడ ‘ఇల్లు’ సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: ఆశించకూడదు
  rationale: חמד ఇక్కడ మరొకరికి చెందినదాన్ని తనకు కావాలని తప్పుగా కోరుకోవడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఆశించకూడదు’ ఈ నైతిక నిషేధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּית רֵעֶךָ
  choice: నీ పొరుగువాని ఇంటిని
  rationale: בַּיִת అనే పదానికి ‘ఇల్లు’ లేదా ‘ఇంటివారు/కుటుంబం’ అనే అర్థాలు ఉండవచ్చు. అయితే భార్య, దాసదాసీలు, జంతువులు తరువాత విడిగా పేర్కొనబడినందున ఇక్కడ భౌతిక నివాసమైన ‘ఇల్లు’ ప్రధానార్థంగా సహజంగా సరిపోతుంది.
- source_word: רֵעֶךָ
  choice: నీ పొరుగువాని
  rationale: רֵעַ నిబంధన ధర్మశాస్త్ర సందర్భంలో సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది. ‘పొరుగువాడు’ సాధారణ తెలుగు పాఠకులకు సుపరిచితమై, వ్యక్తుల మధ్య నైతిక సంబంధాన్ని నిలుపుతుంది.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: నీ పొరుగువాని భార్యను
  rationale: ఈ సమాసం నేరుగా ‘నీ పొరుగువాని భార్య’ అని అర్థమిస్తుంది; సంబంధపరమైన, న్యాయపరమైన భావం స్పష్టంగా ఉంటుంది.
- source_word: עַבְדּוֹ
  choice: అతని దాసుణ్ణి
  rationale: עֶבֶד ఇక్కడ ఆస్తుల జాబితాలో బంధిత సామాజిక స్థితిని సూచిస్తుంది. ‘దాసుడు’ ఆ స్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా చూపుతూ తరువాతి స్త్రీలింగ పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: אֲמָתוֹ
  choice: అతని దాసిని
  rationale: אָמָה స్త్రీ దాసిని లేదా సేవకురాలిని సూచిస్తుంది. ఈ న్యాయపరమైన ఆస్తుల జాబితాలో ‘దాసి’ బంధిత స్థితినీ హీబ్రూ లింగభేదాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שׁוֹרוֹ
  choice: అతని ఎద్దును
  rationale: שׁוֹר సాధారణంగా ఎద్దు లేదా పశువర్గానికి చెందిన పనిజంతువును సూచిస్తుంది. ఏకవచన న్యాయపరమైన జాబితాలో ‘ఎద్దు’ సహజమైన సమానార్థకం.
- source_word: חֲמֹרוֹ
  choice: అతని గాడిదను
  rationale: חֲמוֹר కు ఆధునిక తెలుగులో స్పష్టమైన సాధారణ సమానార్థకం ‘గాడిద’.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: నీ పొరుగువానికి చెందిన దేనినైనా గాని
  rationale: ఈ పదబంధం సమగ్ర ముగింపు వాక్యభాగం. ‘చెందిన దేనినైనా’ అనే రూపం לְ యొక్క స్వామ్యభావాన్నీ כֹל యొక్క సమగ్రతనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא ... לֹא
  choice: ఆశించకూడదు ... ఆశించకూడదు
  rationale: హీబ్రూలోని పునరుక్త నిషేధాన్ని కుదించకుండా రెండుసార్లు ఉంచడం ద్వారా ఆజ్ఞ యొక్క నిర్మాణం, ఉద్ఘాటన నిలుస్తాయి.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని בֵּית ను ‘ఇల్లు’గా అనువదించాలా, ‘ఇంటివారు/కుటుంబం’గా విస్తరించాలా
  choice: ఇల్లు
  alternative: ఇంటివారు / కుటుంబం
  rationale: בַּיִת కు రెండు అర్థాలు సాధ్యమైనప్పటికీ, ఆ తరువాత భార్య, దాసదాసీలు, జంతువులు విడిగా జాబితా చేయబడతాయి. కాబట్టి ‘ఇల్లు’ అనడం అనవసర పునరుక్తిని నివారించి, నివాసం నుంచి ఇతర స్వాస్థ్యాల వైపు సాగే వాక్య నిర్మాణానికి సరిపోతుంది.
- issue: నిబంధన ధర్మశాస్త్రంలో దాసత్వ పదాల అనువాదం
  choice: దాసుడు / దాసి
  alternative: సేవకుడు / సేవకురాలు
  rationale: ఇది ఒక వ్యక్తికి చెందినవాటిని పేర్కొనే న్యాయపరమైన జాబితా కావడంతో బంధిత స్థితి ముందుకు వస్తుంది. అందువల్ల స్థితిని మృదువుచేసే ‘సేవకుడు/సేవకురాలు’ కంటే ‘దాసుడు/దాసి’ మూలపదాలకు దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞా శైలిని వాడాం. ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’తో నిలిపి, ‘గాని’ల పునరావృతితో హీబ్రూ జాబితా నిర్మాణాన్ని సహజంగా ప్రతిబింబించాం. మూలంలో నిజమైన పాఠాంతర సమస్య లేకపోవడం, ‘ఇల్లు/ఇంటివారు’ అర్థసాధ్యత సందర్భంతో తగినంతగా నిర్ణయించబడడం వల్ల ప్రధాన పాఠంలో పాదటిప్పణి గుర్తు చేర్చలేదు.
