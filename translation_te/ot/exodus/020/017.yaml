- from: నీ పొరుగువాని ఇంటిని ఆశించకూడదు; నీ పొరుగువాని భార్యను గాని, అతని దాసుణ్ణి గాని, అతని దాసిని గాని, అతని ఎద్దును గాని, అతని గాడిదను గాని, నీ పొరుగువానికి చెందిన దేనినైనా గాని ఆశించకూడదు.
