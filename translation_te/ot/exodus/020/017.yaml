review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the twofold prohibition, the sequence of possessions, the possessive relations, and the comprehensive final phrase. However, ఆశించకూడదు can denote ordinary hoping or desiring and does not adequately communicate the wrongful acquisitive sense of חמד in this prohibition.
  naturalness: The syntax and list are understandable modern standard Telugu. Using కక్కుర్తిపడకూడదు more naturally conveys the prohibited kind of desire; the revised phrasing also avoids attaching an accusative ending directly to this idiomatic verb.
  terminology: ఇల్లు, పొరుగువాడు, భార్య, దాసుడు/దాసి, ఎద్దు, and గాడిద are appropriate. దాసుడు/దాసి preserves the bonded-status distinction in the Hebrew. A lexical footnote is warranted for ఇంటి, since בַּיִת can also mean household.
  issues:
  - severity: medium
    issue: ఆశించకూడదు is too broad for חמד.
    rationale: ఆశించు may refer to a legitimate wish or expectation. In this legal command, חמד denotes coveting—wrongfully desiring what belongs to another. కక్కుర్తిపడకూడదు communicates that ethical force without adding a denominational interpretation.
  - severity: low
    issue: The lexical alternative for בֵּית is not represented in a footnote.
    rationale: Although ఇంటి is the best primary rendering in this context, the Hebrew can also refer to a household. The English audit trail records this relevant alternative, so a brief Telugu footnote should preserve it.
  revised_text: నీ పొరుగువాని ఇంటిపట్ల[a] కక్కుర్తిపడకూడదు; నీ పొరుగువాని భార్యపట్ల, అతని దాసునిపట్ల, అతని దాసిపట్ల, అతని ఎద్దుపట్ల, అతని గాడిదపట్ల, నీ పొరుగువానికి చెందిన దేనిపట్లనూ కక్కుర్తిపడకూడదు.
