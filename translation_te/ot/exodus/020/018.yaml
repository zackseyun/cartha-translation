  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: te
  text: ప్రజలందరూ ఉరుములను[a], అగ్ని మెరుపులను[b], బూర ధ్వనిని, పొగ కమ్ముతున్న పర్వతాన్ని చూస్తూ ఉన్నారు[c]. ప్రజలు వాటిని చూసి వణికి, దూరంగా నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ధ్వనులు’ లేదా ‘స్వరాలు’; ఈ సందర్భంలో అవి ఉరుములను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కాగడాలు’; ఈ సందర్భంలో ఈ పదం మెరుపులవంటి అగ్ని ప్రకాశాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠం, ధ్వనితో సహా ఈ సూచనలను ప్రజలు ‘చూస్తూ ఉన్నారు’ అని చెబుతుంది; దృశ్యంలోని ఇంద్రియాల మేళవింపును ఇక్కడ నిలుపుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: చూస్తూ ఉన్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం కొనసాగుతున్న దృశ్యానుభవాన్ని సూచిస్తుంది. దాని కర్మల్లో వినిపించే ధ్వనులు కూడా ఉన్నప్పటికీ, మూలంలోని ఇంద్రియాల కలయికను నిలుపుకోవడానికి ‘చూస్తూ ఉన్నారు’ అని అనువదించాం.
- source_word: הַקּוֹלֹת
  choice: ఉరుములను
  rationale: קוֹלֹת అక్షరార్థంగా ‘ధ్వనులు’ లేదా ‘స్వరాలు’. సీనాయి సందర్భంలో ఇది ఉరుములను సూచించే అవకాశం ఎక్కువ; అందువల్ల సహజమైన తెలుగు రూపంగా ‘ఉరుములు’ ఎంచుకున్నాం, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הַלַּפִּידִם
  choice: అగ్ని మెరుపులను
  rationale: ఈ పదానికి అక్షరార్థంగా ‘దివిటీలు/కాగడాలు’ అనే భావం ఉన్నా, ఈ దైవ ప్రత్యక్షత సందర్భంలో మెరుపులవంటి అగ్ని ప్రకాశాలను సూచిస్తుంది. ‘అగ్ని మెరుపులు’ దృశ్యాన్ని స్పష్టంగా ఉంచుతూ అతిగా నిర్దిష్టం చేయదు.
- source_word: קוֹל הַשֹּׁפָר
  choice: బూర ధ్వనిని
  rationale: שׁוֹפָר కొమ్ముతో చేసిన ఊదే వాద్యం. ఆధునిక ప్రామాణిక తెలుగులో చదవడానికి సహజంగా ఉండే ‘బూర’ను వాడి, హీబ్రూ నిర్మాణంలోని ‘ధ్వని’ని కూడా నిలిపాం.
- source_word: הָהָר עָשֵׁן
  choice: పొగ కమ్ముతున్న పర్వతాన్ని
  rationale: పర్వతం పొగతో ఉన్నదనే సజీవ దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּרְא הָעָם
  choice: ప్రజలు వాటిని చూసి
  rationale: ముందు పేర్కొన్న ప్రత్యక్ష సూచనలన్నిటినీ సమష్టిగా సూచించేందుకు తెలుగులో ‘వాటిని’ చేర్చాం; ఇది హీబ్రూ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיָּנֻעוּ
  choice: వణికి
  rationale: ఈ క్రియ భయంతో కంపించడం లేదా కదలడాన్ని సూచిస్తుంది. సందర్భంలో ‘వణికి’ ప్రజల భయప్రతిస్పందనను సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: దూరంగా నిలబడ్డారు
  rationale: భయంతో వారు వెనక్కి జరిగి దూరంలో నిలిచిన స్థితిని మూలానికి దగ్గరగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: సమకూడిన ప్రజల సమష్టిని నేరుగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ప్రజలు వినిపించే ధ్వనులను కూడా ‘చూశారు’ అని చెప్పే ఇంద్రియ భాష
  choice: ఉరుములతో సహా అన్ని సూచనలను ప్రజలు ‘చూస్తూ ఉన్నారు’ అనే హీబ్రూ చిత్రణను నిలుపుకున్నాం.
  alternative: ‘ఉరుములను వింటూ, మెరుపులను చూస్తూ ఉన్నారు’ లేదా ‘అన్నిటినీ గ్రహించారు’ అని ఇంద్రియాల ప్రకారం సవరించడం.
  rationale: మూలపాఠం దైవ ప్రత్యక్షత యొక్క తీవ్రమైన, ఇంద్రియాలను మేళవించే స్వభావాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. దాన్ని సహజీకరించి తొలగించకుండా అనువాదంలోనూ, పాదసూచికలోనూ స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘బూర’, ‘ఉరుములు’, ‘అగ్ని మెరుపులు’ వంటి ప్రాచుర్యమైన పదాలను వాడాం; మూలంలోని అసాధారణ ఇంద్రియ మేళవింపును ఉద్దేశపూర్వకంగా సరళీకరించలేదు.
