lexical_decisions:
- source_word: לֹא
  choice: చేయకూడదు
  rationale: హీబ్రూలో לֹא + అసంపూర్ణ క్రియారూపం నేరుగా నిషేధాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘చేయకూడదు’ అనే రూపం దశాజ్ఞల గంభీరమైన నియమశైలిని సహజంగా నిలుపుతుంది.
- source_word: תִּגְנֹב
  choice: దొంగతనం చేయ
  rationale: גנב క్రియకు ఇక్కడ సాధారణమైన అర్థం ‘దొంగతనం చేయడం’. కొన్ని సందర్భాల్లో ఇది వ్యక్తిని అపహరించడాన్ని సూచించగలిగినా, ఈ వచనంలో కర్మను పరిమితం చేసే సూచన లేదు; కాబట్టి విస్తృత నిషేధాన్ని ఉంచడం సముచితం.
theological_decisions:
- issue: దశాజ్ఞలోని నిషేధ రూపం
  choice: దొంగతనం చేయకూడదు.
  alternative: దొంగతనం చేయవద్దు.
  rationale: మూలంలోని לֹא + అసంపూర్ణ క్రియారూపం ఒడంబడిక ధర్మశాస్త్రంలోని నేర నిషేధం. ‘చేయకూడదు’ గంభీరమైన నియమబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘చేయవద్దు’ మరింత ప్రత్యక్ష ఆజ్ఞారూప ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన దశాజ్ఞ శైలి. సాధారణ దొంగతనం అనే విస్తృత అర్థాన్ని నిలిపి, ‘అపహరించవద్దు’ అని అనవసరంగా పరిమితం చేయలేదు.
