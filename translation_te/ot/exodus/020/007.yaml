revisions:
- from: నీ దేవుడైన యాహ్వే పేరును అసత్యంగా మోయకూడదు[a]. ఎందుకంటే తన పేరును అసత్యంగా మోసేవాణ్ణి యాహ్వే శిక్షించకుండా విడిచిపెట్టడు.
  to: నీ దేవుడైన యాహ్వే పేరును అసత్యంగా మోయకూడదు[a]. ఎందుకంటే ఆయన పేరును అసత్యంగా మోసే వ్యక్తిని యాహ్వే శిక్షించకుండా విడిచిపెట్టడు.
  rationale: The revision resolves the Telugu reflexive-pronoun ambiguity so that the second occurrence of ‘name’ clearly refers to Yahweh, as in the Hebrew. It also uses a more neutral modern-standard expression for the offending person and makes a minor idiomatic correction in the footnote. The repeated ‘మోయు’ wording and the broad semantic scope of לַשָּׁוְא remain intact.
