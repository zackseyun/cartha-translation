  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: te
  text: నీ దేవుడైన యాహ్వే పేరును అసత్యంగా మోయకూడదు[a]. ఎందుకంటే ఆయన పేరును అసత్యంగా మోసే వ్యక్తిని యాహ్వే శిక్షించకుండా విడిచిపెట్టడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సాంప్రదాయ అనువాదం: “నీ దేవుడైన యాహ్వే నామాన్ని వ్యర్థంగా ఉపయోగించకూడదు.” హీబ్రూ మాటలను అక్షరార్థంగా “పేరును వ్యర్థత/అసత్యం కోసం మోయడం” అని చెప్పవచ్చు. కాబట్టి ఇందులో అబద్ధ ప్రమాణాలు, అర్థరహితంగా దైవనామాన్ని పలకడం, లేదా దేవుని ప్రతినిధినని తప్పుగా చెప్పుకోవడం కూడా ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: మోయకూడదు / మోసేవాణ్ణి
  rationale: נשא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు, మోయు, భరించు’ అనే అర్థాలున్నాయి. ‘మోయు’ అని అనువదించడం వల్ల ఆజ్ఞలోనూ దాని కారణవాక్యంలోనూ ఉన్న ఒకే క్రియాపదపు పునరుక్తి నిలుస్తుంది; దైవనామాన్ని కేవలం పలకడానికే భావాన్ని పరిమితం చేయదు.
- source_word: שֵׁם / שְׁמוֹ
  choice: పేరు / తన పేరు
  rationale: ఇది యాహ్వే వెల్లడించిన వ్యక్తిత్వం, కీర్తి, నిబంధన సంబంధిత హక్కును సూచించే సాధారణమైన, సహజమైన అనువాదం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడైన
  rationale: రెండవ పురుష ఏకవచనంలోని ప్రత్యక్ష నిబంధన సంబోధనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַשָּׁוְא
  choice: అసత్యంగా
  rationale: שָׁוְאలోని అసత్యం, వ్యర్థత, శూన్యత, అనుచిత వినియోగం వంటి భావాల మధ్య ఈ సందర్భంలో ‘అసత్యంగా’ సహజంగా ఉంటుంది. అయితే మూలపదపు విస్తృత భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: יְנַקֶּה (נקה)
  choice: శిక్షించకుండా విడిచిపెట్టడు
  rationale: ఇక్కడ piel రూపం దోషం లేదా శిక్ష నుంచి విడిచిపెట్టడం అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר
  choice: మోసేవాణ్ణి
  rationale: ఈ సంబంధవాచక నిర్మాణం అలా చేసే ఏ వ్యక్తినైనా సూచిస్తుంది; తెలుగులో క్రియాజన్య నామరూపం సహజంగా ఉంది.
theological_decisions:
- issue: దైవనామాన్ని మోయడంపై ఉన్న నిషేధపు పరిధి
  choice: యాహ్వే పేరును అసత్యంగా మోయడంపై విస్తృత నిషేధం
  alternative: కేవలం అబద్ధ ప్రమాణాలు చేయడం; లేదా దైవనామాన్ని దూషణగా లేదా అలక్ష్యంగా పలకడం మాత్రమే
  rationale: נשא (‘మోయు’) + שֵׁם (‘పేరు’) + שָׁוְא (‘అసత్యం/వ్యర్థత’) కలయిక కేవలం మాటలలో దుర్వినియోగం కన్నా విస్తృతమైన భావాన్ని అనుమతిస్తుంది. ఇందులో అబద్ధ ప్రమాణం, ఖాళీగా దైవనామాన్ని ఆహ్వానించడం, దేవునికి ప్రతినిధినని తప్పుగా చెప్పుకోవడం ఉండవచ్చు.
- issue: יהוה దైవనామపు అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘మోయు’ అనే స్పష్టమైన రూపకాన్ని రెండు ఉపవాక్యాల్లోనూ నిలిపి, మూలంలోని పునరుక్తిని కాపాడాం. ‘అసత్యంగా’ ప్రధాన వాక్యంలో సహజతనిస్తుండగా, שָׁוְא యొక్క విస్తృత అర్థపరిధిని పాదసూచికలో సంరక్షించాం.
