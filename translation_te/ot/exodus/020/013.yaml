translation:
  language: te
  text: నీవు హత్య చేయకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత విస్తృతంగా, “నీవు చంపకూడదు.” అయితే ఇక్కడి హీబ్రూ క్రియ సాధారణంగా ప్రతి విధమైన ప్రాణహరణాన్ని కాకుండా చట్టవిరుద్ధమైన లేదా అన్యాయమైన ప్రాణహరణాన్ని, అంటే హత్యను, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: చేయకూడదు
  rationale: హీబ్రూ నిషేధార్థక అవ్యయం לֹא, అసంపూర్ణ క్రియారూపంతో కలిసి స్థిరమైన నైతిక నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘చేయకూడదు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תִּרְצָח
  choice: హత్య చేయు
  rationale: רצח అనే క్రియ సాధారణంగా చట్టవిరుద్ధంగా లేదా అన్యాయంగా ప్రాణం తీయడాన్ని సూచిస్తుంది. ‘హత్య చేయు’ దాని నిర్దిష్ట భావాన్ని నిలుపుతుంది; ‘చంపు’ అన్నది అన్ని రకాల ప్రాణహరణాన్ని సూచించేంత విస్తృతంగా ఉండవచ్చు.
theological_decisions:
- issue: దశాజ్ఞలలో ఈ నిషేధం యొక్క పరిధి
  choice: ‘చంపకూడదు’ కంటే ‘హత్య చేయకూడదు’ అని అనువదించడం
  alternative: నీవు చంపకూడదు.
  rationale: ఇది ప్రధానంగా పదార్థ సంబంధమైన నిర్ణయం. ఈ న్యాయ సందర్భంలో רצח అన్నది ప్రతి విధమైన ప్రాణహరణాన్ని కాకుండా హత్యను లేదా అన్యాయమైన ప్రాణహరణాన్ని సాధారణంగా సూచిస్తుంది. అందువల్ల మూలపాఠం చెప్పేదానికంటే విస్తృతమైన నిషేధాన్ని అనువాదం ద్వారా చేర్చకుండా ‘హత్య’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన ఆజ్ఞారూపం. ‘నీవు’ అనే ఏకవచన సంబోధన హీబ్రూ రెండవ పురుష ఏకవచనాన్ని ప్రతిబింబిస్తుంది. ప్రధాన పాఠంలోని ‘హత్య’ మూలక్రియ యొక్క నిర్దిష్ట భావాన్ని ఇస్తుంది; విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
