  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: te
  text: విశ్రాంతిదినాన్ని పవిత్రంగా ఉంచేందుకు[a] జ్ఞాపకం ఉంచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దానిని పవిత్రపరచడానికి,” లేదా “దానిని పవిత్రమైనదిగా ప్రత్యేకించడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: జ్ఞాపకం ఉంచుకో
  rationale: זכר అనే ధాతువు యొక్క కాల్ ఆజ్ఞార్థక ఏకవచన రూపం. ఇది కేవలం మనసుకు తెచ్చుకోవడమే కాక, ఒడంబడిక సంబంధమైన క్రియాశీల జ్ఞాపకాన్ని సూచిస్తుంది; తెలుగులో ‘జ్ఞాపకం ఉంచుకో’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[నిశ్చిత ప్రత్యక్ష కర్మ సూచకం; ప్రత్యేకంగా అనువదించలేదు]'
  rationale: హీబ్రూలో నిశ్చిత ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి వేరే పదం అవసరం లేదు.
- source_word: יוֹם הַשַּׁבָּת
  choice: విశ్రాంతిదినాన్ని
  rationale: నిర్దిష్టమైన షబ్బాతు దినాన్ని సూచిస్తుంది. ‘విశ్రాంతిదినం’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సాధారణ పాఠకులకు అర్థమయ్యే సమానార్థకం.
- source_word: לְקַדְּשׁוֹ
  choice: దానిని పవిత్రంగా ఆచరించడానికి
  rationale: קדשׁ ధాతువు నుండి వచ్చిన 3వ పురుష ఏకవచన ప్రత్యయంతో కూడిన infinitive construct; ఆ దినాన్ని పవిత్రమైనదిగా వేరుపరచి వ్యవహరించాలనే ఉద్దేశాన్ని వ్యక్తపరుస్తుంది. ‘పవిత్రంగా ఆచరించడానికి’ తెలుగులో సహజంగా ఉండి, కేవలం జ్ఞాపకంలో ఉంచడం కంటే ఆచరణాత్మక పవిత్రీకరణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విశ్రాంతిదినానికి సంబంధించిన ఆజ్ఞలో קדשׁ పదాన్ని ఎలా వ్యక్తపరచాలి
  choice: దానిని పవిత్రంగా ఆచరించడానికి
  alternative: దానిని పవిత్రపరచడానికి; దానిని పవిత్రమైనదిగా ప్రత్యేకించడానికి
  rationale: హీబ్రూ పదం ఆ దినాన్ని పవిత్రమైనదిగా చేయడం లేదా అలా పరిగణించి ప్రత్యేకంగా వ్యవహరించడం అనే అర్థ పరిధిని కలిగి ఉంది. ప్రధాన పాఠం సహజమైన తెలుగులో ఆచరణ భావాన్ని అందిస్తుంది; పాదసూచిక మూలంలోని ఇతర సాధ్యమైన నుడికారాలను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఏకవచన ఆజ్ఞారూపాన్ని వాడాం. మూలంలోని ఉద్దేశార్థక నిర్మాణాన్ని ‘-డానికి’తో నిలిపాం; [a] సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
