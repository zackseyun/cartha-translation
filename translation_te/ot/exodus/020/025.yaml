  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: te
  text: మరియు ఒకవేళ నీవు నాకు రాళ్లతో బలిపీఠం కడితే, దానిని చెక్కిన రాళ్లతో[a] కట్టకూడదు; ఎందుకంటే నీవు దానిమీద నీ కత్తిని[b] ఎత్తితే, దానిని అపవిత్రం చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెక్కి తీర్చిదిద్దిన రాళ్లతో.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీ కత్తి.’ ఈ సందర్భంలో ఇది రాళ్లను చెక్కడానికి ఉపయోగించే లోహపు పనిముట్టును సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: కట్టినప్పుడు
  rationale: ఈ సందర్భంలో אִם తప్పనిసరిగా అనిశ్చిత షరతును మాత్రమే సూచించదు; అనుమతించబడిన సందర్భాన్ని ‘ఎప్పుడు/చేసినప్పుడు’ అనే భావంతో పరిచయం చేయగలదు. సహజమైన తెలుగు న్యాయశైలిలో ‘కట్టినప్పుడు’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מִזְבַּח אֲבָנִים
  choice: రాళ్లతో బలిపీఠం
  rationale: హీబ్రూ నిర్మాణంలోని పదార్థసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: תַּעֲשֶׂה לִּי
  choice: నాకు ... కట్టినప్పుడు
  rationale: ‘నాకు’ అనే దత్త సంబంధాన్ని నిలుపుతూ, బలిపీఠం సందర్భంలో עשה ను తెలుగులో సహజంగా ‘కట్టు’ అని అందించింది.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: చెక్కిన రాళ్లతో దాన్ని కట్టకూడదు
  rationale: גזית అంటే పనిముట్టుతో చెక్కి తీర్చిదిద్దిన రాయి. ‘దాన్ని’ బలిపీఠాన్ని సూచిస్తుంది; ‘చెక్కిన రాళ్లతో’ దాని నిర్మాణ పదార్థాన్ని తెలుగులో స్పష్టంగా చెబుతుంది.
- source_word: חַרְבְּךָ
  choice: నీ కత్తిని
  rationale: పదానికి సాధారణ అర్థం ‘నీ కత్తి’. సందర్భంలో రాళ్లను చెక్కడానికి వాడే లోహపు పనిముట్టు కావచ్చని పాదటిప్పణిలో సూచిస్తూ, మూలపాఠంలోని స్పష్టమైన పదాన్ని ప్రధాన వచనంలో నిలిపింది.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: దానిమీద ... ఎత్తితే
  rationale: נוף హిఫీల్ రూపంలోని ‘పైకి ఎత్తడం/దానిపై ప్రయోగించడం’ అనే దృశ్యాన్ని పదబద్ధంగా నిలుపుతుంది; కేవలం ‘వాడితే’ అని భావాన్ని కుదించలేదు.
- source_word: וַתְּחַלְלֶהָ
  choice: దాన్ని అపవిత్రం చేస్తావు
  rationale: חלל యొక్క ఆరాధనా-పవిత్రత సంబంధిత భావాన్ని ‘అపవిత్రం చేయడం’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలిపీఠం అపవిత్రం కావడానికి గల స్వరూపం
  choice: కత్తిని రాళ్లపై ప్రయోగించడం బలిపీఠాన్ని ఆరాధనా పరంగా అపవిత్రం చేస్తుందని వచనం చెప్పిన మేరకే అనువదించడం
  alternative: ఇది హింసకు వ్యతిరేకమైన సంకేతమని లేదా అలంకార వైభవాన్ని నిరాకరించడమే ప్రధాన ఉద్దేశమని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని חלל పవిత్రతకు విరుద్ధమైన ‘అపవిత్రపరచడం’ అనే భావాన్ని స్పష్టంగా కలిగి ఉంది; అయితే ఆ నిషేధానికి వెనుక ఉన్న పూర్తి సంకేతార్థాన్ని వచనం వివరించదు. అందువల్ల అదనపు సిద్ధాంతాన్ని ప్రధాన వచనంలో చేర్చలేదు.
- issue: וְאִם యొక్క షరతు భావం
  choice: ‘కట్టినప్పుడు’ అని సందర్భోచిత షరతు/సందర్భంగా ఇవ్వడం
  alternative: ‘ఒకవేళ ... కడితే’ అని అనిశ్చిత షరతుగా ఇవ్వడం
  rationale: బలిపీఠం నిర్మాణాన్ని నిషేధించకుండా, రాతి బలిపీఠం కట్టే సందర్భంలో వర్తించే నియమాన్ని వాక్యం ఇస్తోంది. అయినప్పటికీ హీబ్రూ אִם యొక్క రూపాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆజ్ఞాశైలిని ఉపయోగించాం. ‘బలిపీఠం,’ ‘అపవిత్రం’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్యనిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాం. ప్రధాన వచనంలోని ప్రతి పాదటిప్పణి గుర్తు [a], [b] సంబంధిత పదబంధం వెంట ఉంచబడింది.
