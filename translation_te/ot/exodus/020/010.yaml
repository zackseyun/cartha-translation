id: EXO.20.10
reference: Exodus 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽ֣א תַעֲשֶׂ֨ה כָל מְלָאכָ֜ה אַתָּ֣ה וּ/בִנְ/ךָֽ֣ וּ/בִתֶּ֗/ךָ עַבְדְּ/ךָ֤ וַ/אֲמָֽתְ/ךָ֙ וּ/בְהֶמְתֶּ֔/ךָ וְ/גֵרְ/ךָ֖ אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: te
  text: కాని ఏడవ రోజు నీ దేవుడైన యెహోవాకు విశ్రాంతిదినం. ఆ రోజున నువ్వుగాని, నీ కుమారుడుగాని, నీ కుమార్తెగాని, నీ దాసుడుగాని, నీ దాసిగాని[b], నీ పశువులుగాని, నీ పట్టణాలలో నివసించే పరదేశిగాని[c] ఏ పనీ చేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హెబ్రీలో “నీ పురుష బానిసుడు ... నీ స్త్రీ బానిస” అని ఉంది. సంప్రదాయ అనువాదాల్లో “దాసుడు ... దాసి” లేదా “సేవకుడు ... సేవకురాలు” అని కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: “పరదేశి” అంటే ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసించే స్థానికేతరుడు. అక్షరార్థంగా హెబ్రీలో “నీ ద్వారాలలో ఉన్న” అని ఉంది; ఈ నుడికారం నీ పట్టణాలు లేదా స్థానిక అధికార పరిధిని సూచిస్తుంది.
    reason: cultural_clarification
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: కాని ఏడవ రోజు
  rationale: ו సాధారణంగా ‘మరియు’ అని అనువదించవచ్చు; అయితే ముందటి వచనంలోని ఆరు పని దినాలకు ఏడవ దినాన్ని వ్యతిరేకంగా చూపే సందర్భంలో ‘కాని’ సహజంగా ఉంది.
- source_word: שַׁבָּת
  choice: విశ్రాంతిదినం
  rationale: తెలుగులో స్థిరపడిన, సాధారణ పాఠకులకు అర్థమయ్యే పదం; ఇది కేవలం విశ్రాంతి చర్యను కాక ప్రత్యేకంగా నియమించబడిన దినాన్ని సూచిస్తుంది.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవాకు
  rationale: לְ సూచించే అంకితం లేదా సంబంధాన్ని ‘యెహోవాకు’ నిలుపుతుంది; יהוה అనే నిబంధన నామాన్ని ప్రత్యక్షంగా లిప్యంతరీకరించింది.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: ఏ పనీ చేయకూడదు
  rationale: న్యాయపరమైన నిషేధ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, כָל యొక్క సమగ్ర భావాన్ని ‘ఏ పనీ’ నిలుపుతుంది.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: నీ దాసుడు ... నీ దాసి
  rationale: ఇక్కడ జతగా వచ్చిన పదాలు గృహంలోని బానిసత్వ లేదా ఆధీన సేవా స్థితిని సూచిస్తాయి. ‘దాసుడు/దాసి’ సామాజిక వాస్తవాన్ని పూర్తిగా మరుగుపరచకుండా తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: וּבְהֶמְתֶּךָ
  choice: నీ పశువులు
  rationale: గృహానికి చెందిన పెంపుడు లేదా పని జంతువులను సమష్టిగా సూచించే సహజ తెలుగు పదం.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: నీ పట్టణ ద్వారాల లోపల నివసించే పరదేశి
  rationale: גֵּר స్వదేశీయుడు కాకపోయినా సమాజంలో నివసించే వ్యక్తిని సూచిస్తుంది. ‘నీ ద్వారాలలో’ అనే హెబ్రీయ నుడికారాన్ని దాని పట్టణ అధికార పరిధి భావంతో సహజంగా విప్పి చెప్పింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నిబంధన నామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలిపింది.
- issue: విశ్రాంతిదిన ఆజ్ఞ వర్తించే గృహ పరిధి
  choice: కుమారుడు, కుమార్తె, దాసుడు, దాసి, పశువులు, నివాస పరదేశి అందరినీ స్పష్టంగా చేర్చడం
  alternative: గృహ యజమానికి మాత్రమే ఆజ్ఞను పరిమితం చేసినట్లు సంక్షిప్తీకరించడం
  rationale: హెబ్రీ పాఠం ప్రతి వర్గాన్నీ పేరుపెట్టి ఆ నిషేధ పరిధిలో చేర్చుతుంది; అనువాదం ఆ విస్తృత నైతిక-సామాజిక పరిధిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్య నిర్మాణం. ఏకవచన ‘నువ్వు/నీ’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
