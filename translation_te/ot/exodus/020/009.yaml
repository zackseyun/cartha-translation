translation:
  language: te
  text: ఆరు రోజులు నీవు శ్రమించి, నీ పని అంతా చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆరు రోజులు నీవు పనిచేసి, నీ పని అంతా చేయాలి.’
    reason: עבדను సందర్భానుసారం ‘శ్రమించు’ లేదా ‘పనిచేయు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: మూలంలోని ఉపసర్గలేని కాలవ్యవధి పదబంధాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది; ‘ఆరు రోజులపాటు’ కూడా సాధ్యమే గాని, అది మూలంలో స్పష్టంగా లేని కాలవ్యాప్తి భావాన్ని మరింత వ్యక్తం చేస్తుంది.
- source_word: תַּעֲבֹד
  choice: నీవు శ్రమపడి
  rationale: עבד అనే క్రియకు ఇక్కడ ‘పనిచేయు, శ్రమించు’ అనే భావం ఉంది. తరువాత వచ్చే ‘పనులన్నీ చేయాలి’తో అనవసర పదపునరుక్తి రాకుండా, ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ ‘శ్రమపడి’ అని అనువదించాం.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: עשה అనే విస్తృతార్థక క్రియ, מְלָאכָהతో కలిసి ఇక్కడ ‘పని చేయు/నెరవేర్చు’ అని సహజంగా అర్థమిస్తుంది. రెండు సమన్విత క్రియల ఆదేశాత్మక బలాన్ని తెలుగులో ఒకే విధేయాంతమైన ‘చేయాలి’ సహజంగా మోస్తుంది.
- source_word: כָּל
  choice: అన్నీ
  rationale: כָּל యొక్క సమగ్ర భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְלַאכְתֶּךָ
  choice: నీ పనులు
  rationale: מְלָאכָה ఇక్కడ పని, వృత్తిసంబంధ కార్యం, లేదా చేయవలసిన పని అనే భావం కలిగి ఉంది. ‘నీ పనులు’ సాధారణ పాఠకులకు సహజంగా ఉండి, సబ్బాతు సందర్భంలోని విస్తృత కార్యభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సబ్బాతు ధర్మశాసనంలో అసంపూర్ణ క్రియల ఆదేశాత్మక బలం
  choice: ‘చేయాలి’ అనే విధ్యర్థక రూపంతో ఆదేశంగా అనువదించడం
  alternative: ‘చేయవచ్చు’ లేదా ‘చేస్తావు’
  rationale: దశాజ్ఞల నిబంధనాత్మక సందర్భంలో ఈ క్రియారూపాలు కేవలం అనుమతిని లేదా భవిష్యత్ అంచనాను కాక, ఆదేశాత్మక బోధను తెలియజేస్తాయి. ‘చేయాలి’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ధర్మశాసన శైలిని ఉంచాం. ‘నీవు’ ఏకవచన సంబోధనను కాపాడాం; ‘శ్రమపడి… చేయాలి’ అనే నిర్మాణం మూలంలోని రెండు సమన్విత క్రియలను సహజంగా అందిస్తుంది.
