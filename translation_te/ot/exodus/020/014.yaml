translation:
  language: te
  text: వ్యభిచారం చేయకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: చేయకూడదు
  rationale: హీబ్రూ నిషేధార్థకమైన לֹא, అసంపూర్ణ క్రియారూపంతో కలిసి స్థిరమైన ఆజ్ఞను వ్యక్తం చేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘చేయకూడదు’ ఆ నిషేధ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: תִּנְאָף
  choice: వ్యభిచారం చేయు
  rationale: కాల్ రూపంలోని נאף వివాహబంధాన్ని ఉల్లంఘించే లైంగిక అవిశ్వాసాన్ని, అంటే వ్యభిచారం చేయడాన్ని సూచిస్తుంది. ‘వ్యభిచారం చేయు’ న్యాయపరమైన ఈ సందర్భంలో స్పష్టమైన, స్థిరపడిన తెలుగు సమానార్థకం.
theological_decisions:
- issue: దశాజ్ఞల నిషేధ శైలిని తెలుగులో వ్యక్తపరచడం
  choice: వ్యభిచారం చేయకూడదు.
  alternative: వ్యభిచారం చేయవద్దు.
  rationale: లֹא తో కూడిన ద్వితీయ పురుష ఏకవచన అసంపూర్ణ క్రియ covenant-law శైలిలో నిరంతర నిషేధాన్ని తెలియజేస్తుంది. ‘చేయకూడదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సాధారణ సందర్భానుసార ఆజ్ఞకన్నా స్థిరమైన నైతిక నిషేధ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- issue: పుంలింగ ఏకవచన క్రియారూపపు పరిధి
  choice: తెలుగులో కర్తను వ్యక్తంగా చేర్చకుండా సాధారణ నిషేధంగా అనువదించడం
  alternative: ‘నీవు వ్యభిచారం చేయకూడదు’ అని పుంలింగ భేదం లేని ద్వితీయ పురుష ఏకవచనాన్ని వ్యక్తంగా ఉంచడం
  rationale: హీబ్రూలో రూపం పుంలింగ ఏకవచనమైనప్పటికీ, దశాజ్ఞలో అది నిబంధన సమాజంలోని వ్యక్తిని ప్రతినిధిగా సంబోధిస్తుంది. తెలుగులో కర్తలేని నిషేధ వాక్యం ఆ వ్యక్తిగత అన్వయాన్ని సహజంగా తెలియజేస్తూ, మూలంలో అవసరం లేని పురుషులకు మాత్రమే పరిమితమైన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన దశాజ్ఞ శైలి. ‘వ్యభిచారం’ సాధారణ పాఠకులకు అర్థమయ్యే, న్యాయ-నైతిక ఖచ్చితత్వం గల పదం.
