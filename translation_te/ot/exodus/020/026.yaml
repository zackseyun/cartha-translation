  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: te
  text: నీ నగ్నత్వం దానిమీద బయటపడకుండా ఉండేలా, నా బలిపీఠం మీదికి మెట్ల ద్వారా ఎక్కకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
