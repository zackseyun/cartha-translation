    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלֶה
  choice: ఎక్కకూడదు
  rationale: עלה ఇక్కడ పైకి ఎక్కడం అనే దిశార్థాన్ని తెలియజేస్తుంది; לֹאతో కలిసి ఉన్న నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְמַעֲלֹת
  choice: మెట్లమీదుగా
  rationale: מַעֲלוֹת అంటే మెట్లు; בְּ సాధనాన్ని లేదా మార్గాన్ని సూచిస్తున్నందున ‘మెట్లమీదుగా’ సహజంగా సరిపోతుంది.
- source_word: מִזְבְּחִי
  choice: నా బలిపీఠం
  rationale: מִזְבֵּחַకు ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయం కలిసిన సాధారణ, స్పష్టమైన అనువాదం.
- source_word: אֲשֶׁר לֹא
  choice: '...కుండా ఉండేలా'
  rationale: నిషేధానికి కారణమైన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో స్పష్టంగా తెలిపే నిర్మాణం; భావాన్ని ‘లేకపోతే’ అని అతిగా నిర్ణయించదు.
- source_word: תִּגָּלֶה
  choice: కనబడకుండా
  rationale: גלה నిఫాల్ రూపం ‘బయటపడడం/కనబడడం’ అనే భావాన్ని ఇస్తుంది; శరీర బహిర్గతత సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: עֶרְוָתְךָ
  choice: నీ నగ్నత్వం
  rationale: עֶרְוָהను సాధారణంగా ‘నగ్నత్వం’ అని అనువదించడం మూలంలోని మర్యాదా, శరీర బహిర్గతత భావాలను నిలుపుతుంది; నిర్దిష్ట శరీర భాగాలను అనవసరంగా చేర్చదు.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: పురుష ఏకవచన ప్రత్యయం ముందున్న బలిపీఠాన్ని సూచిస్తుంది; ‘దానిమీద’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: బలిపీఠానికి మెట్లమీదుగా ఎక్కరాదనే నిషేధానికి కారణం
  choice: పవిత్ర స్థల సందర్భంలో నగ్నత్వం కనబడకూడదనే మూలపాఠంలో స్పష్టంగా చెప్పిన కారణానికే అనువాదాన్ని పరిమితం చేశాం.
  alternative: ఇది దేవుని ఎదుట వినయానికి ప్రతీక అని లేదా ప్రత్యేక యాజక వస్త్రాల కారణంగా ఇచ్చిన ఆజ్ఞ అని వివరించడం.
  rationale: హీబ్రూ పాఠం నగ్నత్వం బలిపీఠం మీద కనబడకూడదనే కారణాన్ని మాత్రమే స్పష్టంగా చెబుతుంది; దానికి మించిన ప్రతీకాత్మక లేదా వస్త్రసంబంధ వివరణను ప్రధాన పాఠంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘బలిపీఠం’ స్థిరమైన బైబిలు పదంగా నిలుపబడింది; వాక్యక్రమం ఉద్దేశ్యాన్ని ముందుగా ఉంచి తెలుగులో సహజంగా రూపొందించబడింది.
