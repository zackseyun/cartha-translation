  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: te
  text: నీవు నీ కోసం చెక్కిన ప్రతిమనుగానీ, పైన ఆకాశాల్లో ఉన్న దాని, క్రింద భూమిపై ఉన్న దాని, భూమి కిందనున్న నీళ్లలో ఉన్న దాని—ఏ రూపాన్నీ చేసుకోకూడదు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చెక్కిన బొమ్మ.’ హీబ్రూ పదం చెక్కి తయారుచేసిన ప్రతిమను ప్రత్యేకంగా సూచిస్తుంది; ‘విగ్రహం’ అనే అనువాదం మరింత వ్యాఖ్యానాత్మకం.
    reason: lexical_alternative
  - marker: b
    text: ‘రూపం’ అనే పదానికి ‘పోలిక’ లేదా ‘ప్రతిరూపం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'ఈ వచనం సృష్టి లోకాలను ప్రాచీన స్థలచిత్రణలో వర్ణిస్తుంది: పైన ఆకాశాలు, క్రింద భూమి, భూమి కింద నీళ్లు.'
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֶׂה ... לְךָ
  choice: నీవు నీ కోసం ... చేసుకోకూడదు
  rationale: לֹאతో వచ్చిన రెండవ పురుష ఏకవచన అసంపూర్ణ క్రియ నేరమైన నిషేధాన్ని తెలియజేస్తుంది; לְךָలోని వ్యక్తిగత ప్రయోజన భావాన్ని ‘నీ కోసం’ నిలుపుతుంది.
- source_word: פֶסֶל
  choice: చెక్కిన ప్రతిమ
  rationale: ఈ పదం చెక్కి రూపొందించిన బొమ్మ లేదా ప్రతిమను సూచిస్తుంది. ‘విగ్రహం’ అని అనువదిస్తే ఆరాధనా ఉద్దేశాన్ని ముందుగానే చేర్చినట్లవుతుంది.
- source_word: וְכָל תְּמוּנָה
  choice: రూపాన్నైనా
  rationale: תְּמוּנָהకు రూపం, పోలిక, ప్రతిరూపం అనే అర్థవ్యాప్తి ఉంది. తెలుగు జాబితా నిర్మాణంలో ‘రూపాన్నైనా’ సహజంగా ఉండి నిషేధపు విస్తృతిని నిలుపుతుంది.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: పైన ఆకాశాల్లో ఉన్నదాని
  rationale: שָׁמַיִם యొక్క రూపాన్ని గౌరవిస్తూ ‘ఆకాశాల్లో’ అని, מִמַּעַל యొక్క నిలువు స్థలభావాన్ని ‘పైన’ అని అనువదించబడింది.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: కింద భూమిమీద ఉన్నదాని
  rationale: భూమితో తెలుగు వాడుకలో ‘మీద’ సహజం; ‘కింద’ పైనున్న ఆకాశాలకు వ్యతిరేకమైన స్థల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: భూమి కిందనున్న నీళ్లలో ఉన్నదాని
  rationale: మూలంలోని భూమి కింద ఉన్న జలాల ప్రాచీన స్థలచిత్రణను వివరణతో మార్చకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: రెండవ ఆజ్ఞలోని నిషేధపు పరిధి
  choice: చెక్కిన ప్రతిమను, సృష్టిలో ఉన్న వాటి రూపాలను చేయవద్దనే వచన పదజాలాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని సమస్త దృశ్యకళపై సంపూర్ణ నిషేధంగా విస్తరించడం, లేదా ‘ఆరాధించడానికి విగ్రహం’ అని ఈ వచనంలోనే పరిమితం చేయడం
  rationale: హీబ్రూ వచనం ప్రతిమను, రూపాన్ని పేర్కొంటుంది; ఆరాధనకు సంబంధించిన సందర్భం తరువాతి వచనంలో వస్తుంది. అందువల్ల ‘విగ్రహం’ లేదా ‘ఆరాధించడానికి’ అని చేర్చి భావాన్ని ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆజ్ఞా శైలిని ఉపయోగించాం. ‘చేసికొనకూడదు’ కంటే సాధారణ పాఠకులకు సహజమైన ‘చేసుకోకూడదు’ను ఎంచుకున్నాం. మూలంలోని వరుస జాబితాను తెలుగులో స్పష్టత కోసం ‘రూపాన్నైనా’ అనే పదాన్ని ప్రతి విభాగానికి భావపూర్వకంగా వర్తింపజేశాం; [a], [b], [c] సూచికలన్నీ ప్రధాన పాఠ్యంలో ఉన్నాయి.
