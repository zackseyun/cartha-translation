revisions:
- from: నీవు నీ కోసం చెక్కిన ప్రతిమను[a], లేదా పైన ఆకాశాల్లో ఉన్నదాని రూపాన్నైనా[b], కింద భూమిమీద ఉన్నదాని రూపాన్నైనా, భూమి కిందనున్న నీళ్లలో ఉన్నదాని రూపాన్నైనా చేసుకోకూడదు.[c]
  to: నీవు నీ కోసం చెక్కిన ప్రతిమనుగానీ, పైన ఆకాశాల్లో ఉన్న దాని, క్రింద భూమిపై ఉన్న దాని, భూమి కిందనున్న నీళ్లలో ఉన్న దాని—ఏ రూపాన్నీ చేసుకోకూడదు.[a][b][c]
  rationale: సవరణ మూలంలోని ‘చెక్కిన ప్రతిమ లేదా ఏ రూపమైనా’ అనే నిషేధ విస్తృతిని నిలుపుతూ, మూడు సృష్టి-స్థరాలను ఒకే ‘ఏ రూపాన్నీ’ అనే పదానికి అనుసంధానించింది. దీనివల్ల ఆరాధన, విగ్రహత్వం, లేదా సమస్త కళలపై నిషేధం వంటి అదనపు వ్యాఖ్యానం చేర్చబడదు. సూచికలను వచనం చివర ఉంచి, అవి వరుసగా చెక్కిన ప్రతిమ, రూపం, మరియు ప్రాచీన స్థలచిత్రణకు సంబంధించినవని కాపాడాం.
