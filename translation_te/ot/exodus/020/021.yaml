  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: te
  text: ప్రజలు దూరంగా నిలబడ్డారు; మోషే దేవుడు ఉన్న దట్టమైన చీకటి[a] దగ్గరికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీకటి మేఘం’ లేదా ‘మసక.’ హీబ్రూ పదం దేవుని ప్రత్యక్షతతో ముడిపడిన దట్టమైన చీకటిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డారు
  rationale: עמד ఇక్కడ ప్రజలు ఒక చోట నిలిచి ఉండడాన్ని తెలిపే సాధారణ గతకాల కథన రూపం. ఆధునిక తెలుగులో ‘నిలబడ్డారు’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న עם సీనాయి వద్ద ఇప్పటికే ప్రస్తావనలో ఉన్న సమూహాన్ని సూచిస్తుంది; మూలంలో లేని ‘ఇశ్రాయేలు’ అనే పదాన్ని చేర్చకుండా ‘ప్రజలు’ అని అనువదించాం.
- source_word: מֵרָחֹק
  choice: దూరంగా
  rationale: ఈ పదబంధం స్థలపరమైన ఎడాన్ని సూచిస్తుంది. ‘దూరంగా’ సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: נִגַּשׁ
  choice: దగ్గరికి వెళ్లాడు
  rationale: נגשׁ అంటే దగ్గరకు రావడం లేదా సమీపించడం. ‘దగ్గరికి వెళ్లాడు’ సందర్భానికి సహజమైన తెలుగు; ప్రజలు దూరంగా ఉండగా మోషే ముందుకు సమీపించిన వ్యత్యాసాన్నీ నిలుపుతుంది.
- source_word: הָעֲרָפֶל
  choice: గాఢాంధకారం
  rationale: עֲרָפֶל దట్టమైన చీకటి లేదా మసకను, ముఖ్యంగా దేవుని ప్రత్యక్షతతో ముడిపడిన అంధకారాన్ని సూచిస్తుంది. ‘గాఢాంధకారం’ ఆ దృశ్యాన్నీ గంభీరతనూ కాపాడుతుంది; ‘చీకటి మేఘం’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: దేవుడు ఉన్న
  rationale: ఈ సంబంధవాచక వాక్యభాగం దేవుని ఉనికి ఉన్న స్థలాన్ని గుర్తిస్తుంది. שָׁםను తెలుగులో విడిగా ‘అక్కడ’ అని పలకకుండానే ‘దేవుడు ఉన్న’ అన్న రూపంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది; అందువల్ల ‘దేవుడు’ సరైన ఎంపిక.
theological_decisions:
- issue: అంధకారంలో దేవుని ప్రత్యక్షతను వర్ణించడం
  choice: עֲרָפֶלను ‘గాఢాంధకారం’ అని స్పష్టమైన దృశ్యరూపంతో అనువదించడం
  alternative: చీకటి మేఘం; మసక చీకటి
  rationale: వచనం దేవుని పవిత్ర సన్నిధి అగోచరతతోను చేరరానితనంతోను ముడిపడిన ఉద్వేగాన్ని ఉంచుతుంది. దాన్ని కేవలం వాతావరణ సంబంధమైన మేఘంగా గానీ, వివరణాత్మకంగా ‘సన్నిధి’ అని విస్తరించి గానీ మార్చకుండా మూలంలోని భావ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మాత్రం’ మూలంలోని וּ యొక్క సాధారణ సంధిని సందర్భానుగుణ వ్యత్యాసంగా వ్యక్తపరుస్తుంది: ప్రజలు దూరంగా నిలిచారు, మోషే సమీపించాడు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.'
