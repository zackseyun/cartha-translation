revisions:
- from: కాబట్టి దేవుడు మంత్రసానులకు మేలు చేశాడు[a]. ప్రజలు విస్తరించి, ఎంతో బలవంతులయ్యారు.
  to: అప్పుడు దేవుడు మంత్రసానులకు మేలు చేశాడు[a]. ప్రజలు సంఖ్యలో పెరిగి, ఎంతో బలవంతులయ్యారు.
