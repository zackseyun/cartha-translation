source:
  edition: WLC
  text: וַ/יֵּ֥יטֶב אֱלֹהִ֖ים לַֽ/מְיַלְּדֹ֑ת וַ/יִּ֧רֶב הָ/עָ֛ם וַ/יַּֽעַצְמ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: te
  text: అప్పుడు దేవుడు మంత్రసానులకు మేలు చేశాడు[a]. ప్రజలు సంఖ్యలో పెరిగి, ఎంతో బలవంతులయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మంత్రసానుల పట్ల మంచిగా వ్యవహరించాడు’; ‘మంత్రసానులను ఆశీర్వదించాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: మేలు చేశాడు
  rationale: యటబ్ అనే క్రియ యొక్క హిఫీల్ రూపం, ל ఉపసర్గతో కలిసి, ఎవరికైనా మేలు చేయడం లేదా వారి పట్ల మంచిగా వ్యవహరించడం అనే ప్రయోజనార్థక భావాన్ని ఇస్తుంది. ‘మేలు చేశాడు’ సహజమైన తెలుగు; ‘ఆశీర్వదించాడు’ అని ప్రత్యేకంగా అర్థాన్ని విస్తరించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో ఇది ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; క్రియ కూడా ఏకవచనంలో ఉంది.
- source_word: לַמְיַלְּדֹת
  choice: మంత్రసానులకు
  rationale: ל ఉపసర్గ ఇక్కడ మేలు పొందినవారిని సూచిస్తుంది. ‘మంత్రసానులకు’ అనే చతుర్థీ విభక్తి తెలుగులో ఆ ప్రయోజనార్థక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּרֶב
  choice: విస్తరించి
  rationale: רבה ఇక్కడ ప్రజల సంఖ్య పెరగడాన్ని సూచిస్తుంది. ‘విస్తరించి’ జనాభా వృద్ధిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: మూలంలో ఉన్న ‘ప్రజలు’ అనే సాధారణ పదాన్నే ఉంచి, సందర్భం స్పష్టంగా ఉన్నందున ‘ఇశ్రాయేలు ప్రజలు’ అని విస్తరించలేదు.
- source_word: וַיַּעַצְמוּ
  choice: బలవంతులయ్యారు
  rationale: עצם ఇక్కడ బలంలో లేదా శక్తిలో ఎదగడాన్ని సూచిస్తుంది. ‘బలవంతులయ్యారు’ ఆ మార్పు భావాన్ని నిలుపుతుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: מְאֹד తీవ్రతను పెంచే పదం. ఆధునిక తెలుగులో ‘ఎంతో’ సహజంగా బలమైన తీవ్రతను తెలియజేస్తుంది.
theological_decisions:
- issue: మంత్రసానుల పట్ల దేవుని చర్యను ‘ఆశీర్వదించాడు’ అని అనువదించాలా, లేక మరింత తటస్థంగా ‘మేలు చేశాడు’ అని అనువదించాలా
  choice: మంత్రసానులకు మేలు చేశాడు
  alternative: మంత్రసానులను ఆశీర్వదించాడు; మంత్రసానుల పట్ల మంచిగా వ్యవహరించాడు
  rationale: హీబ్రూ יטב మేలు చేయడం లేదా మంచిగా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది; దేవుని అనుగ్రహం ఏ రూపంలో వ్యక్తమైందో ఈ క్రియ ఒక్కటే నిర్దిష్టంగా చెప్పదు. ‘మేలు చేశాడు’ మూలంలోని విస్తృత భావాన్ని కాపాడి, 21వ వచనంలోని నిర్దిష్ట ఫలితాన్ని ముందుగానే చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మంత్రసానులు’ అనేది ప్రసవానికి సహాయం చేసే స్త్రీలను సూచించే స్థిరమైన తెలుగు పదం. మూలంలోని వరుస చర్యలను సహజ తెలుగు వాక్యప్రవాహంలో అందించాం.
