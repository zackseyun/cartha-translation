id: EXO.1.11
reference: Exodus 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: te
  text: అందుచేత వారు ఇశ్రాయేలీయులను భారమైన పనులతో అణచివేయడానికి వారిపై బలవంతపు శ్రమను పర్యవేక్షించే అధికారులను నియమించారు.[a] ఇశ్రాయేలీయులు ఫరో కోసం పీతోము, రామెసేసు[c] అనే నిల్వ పట్టణాలను[b] నిర్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ఇక్కడ ‘అతనిపై,’ ‘అతన్ని,’ ‘అతడు నిర్మించాడు’ అనే ఏకవచన రూపాలు ఉన్నాయి; అవి ఇశ్రాయేలును ఒక సమష్టిగా సూచిస్తున్నాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘సరఫరా పట్టణాలను.’
    reason: lexical_alternative
  - marker: c
    text: ‘రామెసేసు’ అనే పేరును ‘రాఅమ్సేసు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ עָלָיו שָׂרֵי מִסִּים
  choice: వారిపై బలవంతపు శ్రమను పర్యవేక్షించే అధికారులను నియమించారు
  rationale: שָׂרֵי מִסִּים అనేది బలవంతపు శ్రమ లేదా వెట్టిచాకిరీని నిర్వహించే అధికారులను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు వారి అధికారం, పని రెండూ స్పష్టమయ్యేలా ఈ ప్రయోగం ఎంచుకోబడింది.
- source_word: לְמַעַן עַנֹּתוֹ בְּסִבְלֹתָם
  choice: భారమైన పనులతో అణచివేయడానికి
  rationale: ענה పియేల్ రూపం అణచివేయడం లేదా బాధించడం అనే తీవ్ర భావాన్ని ఇస్తుంది; סִבְלֹתָם భారాలు లేదా మోయవలసిన కఠిన శ్రమను సూచిస్తుంది. సహజమైన తెలుగులో రెండు భావాలనూ కలిపి చెప్పబడింది.
- source_word: וַיִּבֶן
  choice: ఇశ్రాయేలీయులు ... నిర్మించారు
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉన్నా, అది ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది. తెలుగులో అపార్థం రాకుండా సందర్భానుసారమైన బహువచనం వాడి, మూలంలోని రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: నిల్వ పట్టణాలు
  rationale: ఈ పదబంధం సరుకులు, ధాన్యం లేదా రాజ్య సరఫరాలను నిల్వచేసే కేంద్రాలైన పట్టణాలను సూచిస్తుంది; ‘నిల్వ పట్టణాలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: פִּתֹם וְאֶת רַעַמְסֵס
  choice: పీతోము, రామెసేసు
  rationale: స్థలనామాలను తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; רַעַמְסֵס కు దగ్గరైన ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ఇశ్రాయేలు అనే సమష్టిని సూచించే హీబ్రూ ఏకవచన రూపాలు
  choice: ప్రధాన వాక్యంలో సహజమైన తెలుగు బహువచనం ‘ఇశ్రాయేలీయులు/వారిని’
  alternative: ‘అతనిపై/అతన్ని/అతడు నిర్మించాడు’ అని వ్యాకరణ ఏకవచనాన్ని యథాతథంగా ఉంచడం
  rationale: హీబ్రూ עָלָיו, עַנֹּתוֹ, וַיִּבֶן రూపాలు ఇశ్రాయేలును ఒక సమష్టిగా ఏకవచనంలో చూపిస్తాయి. తెలుగులో పురుష ఏకవచనం ఒక వ్యక్తిని సూచించినట్లు అపార్థమయ్యే అవకాశం ఉన్నందున భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచి, మూలంలోని సమష్టి-ఏకవచనాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వెట్టిచాకిరీ’ కంటే విస్తృతంగా అర్థమయ్యే ‘బలవంతపు శ్రమ’ను వాడాం. మూలంలోని సమష్టి-ఏకవచనం తెలుగులో అసహజత లేదా వ్యక్తిగత సూచన కలిగించకుండా పాదసూచికలో వివరించబడింది.
