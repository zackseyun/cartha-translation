  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: te
  text: యాకోబుతో కలిసి ఐగుప్తుకు వచ్చిన ఇశ్రాయేలు కుమారుల పేర్లు ఇవి:[a] వారిలో ఒక్కొక్కరు తమ ఇంటివారితో వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు ఇవి ఇశ్రాయేలు కుమారుల పేర్లు.” హీబ్రూ పాఠం “మరియు” అనే సంధానపదంతో మొదలవుతుంది; ఇది నిర్గమకాండాన్ని ఆదికాండంలోని మునుపటి కథనంతో అనుసంధానిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ఇవి
  rationale: וְ అనే సంధానపదం ఆదికాండంలోని మునుపటి కథనంతో అనుబంధాన్ని సూచిస్తుంది. అయితే తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం అసహజంగా ఉండవచ్చు; అందువల్ల ప్రధాన పాఠంలో సహజమైన ‘ఇవి’ను ఉంచి, సంధానార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: שְׁמוֹת
  choice: పేర్లు
  rationale: మూలంలోని సాధారణ నామవాచకార్థాన్ని నేరుగా తెలియజేస్తుంది; హీబ్రూ గ్రంథనామంతో ఉన్న భావసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పేర్కొనబడినవారు యాకోబు కుమారులే కాబట్టి, లింగనిర్దిష్టమైన హీబ్రూ పదబంధాన్ని ఖచ్చితంగా అనుసరిస్తుంది.
- source_word: הַבָּאִים
  choice: వచ్చిన
  rationale: హీబ్రూ కృదంతం ఇక్కడ ఆ సమూహాన్ని గుర్తించే విశేషణార్థక భాగంగా పనిచేస్తుంది; తెలుగులో ‘వచ్చిన’ సహజమైన సమానార్థకం.
- source_word: מִצְרָיְמָ/ה
  choice: ఐగుప్తుకు
  rationale: దిశను సూచించే హీబ్రూ ప్రత్యయం ఐగుప్తు వైపు జరిగిన ప్రయాణాన్ని తెలియజేస్తుంది; తెలుగు చతుర్థీ విభక్తి ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֵת יַעֲקֹב
  choice: యాకోబుతో కలిసి
  rationale: ఇక్కడ אֵת కర్మసూచకం కాక, సహచర్యాన్ని సూచిస్తుంది. ‘తో కలిసి’ ఆ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: אִישׁ וּ/בֵית/וֹ
  choice: ఒక్కొక్కరు తమ ఇంటివారితో
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ప్రతి వ్యక్తిని సూచిస్తుంది; בַּיִת భవనాన్ని కాక కుటుంబ లేదా గృహసమూహాన్ని సూచిస్తున్నందున ‘ఇంటివారు’ సహజంగా సరిపోతుంది.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: చివరి క్రియ ముందున్న ‘వచ్చిన’ అనే భావాన్ని తిరిగి ఎత్తి పూర్తిచేస్తుంది. మూలంలోని ఈ పునరుక్తిని రెండు తెలుగు ఉపవాక్యాల ద్వారా స్పష్టంగా నిలిపాం.
