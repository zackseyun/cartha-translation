  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని చివరి ‘వచ్చారు’ అనే పునరుక్తిని తొలగించకుండా, తెలుగు పఠనసౌలభ్యం కోసం రెండవ వాక్యంగా ఇచ్చాం.
