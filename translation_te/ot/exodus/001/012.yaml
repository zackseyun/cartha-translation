  source_fidelity: ప్రధాన పాఠ్యంలో יִרְבֶּה (‘సంఖ్యలో పెరగడం’)ను ‘విస్తరించారు’గా ఇవ్వడం, తరువాతి יִפְרֹץ (‘వ్యాపించడం/విస్తరించడం’)తో కలిసిపోతుంది. అలాగే וַיָּקֻצוּ యొక్క ప్రత్యామ్నాయ భావాలను ప్రధాన పాఠ్యంలో ‘భయమూ అసహ్యమూ’ అని కలపడం మూలంలోని ఒకే క్రియకు లేని ద్వంద్వార్థ నిర్ధారణను విధిస్తుంది.
  naturalness: ‘వారు ... వారు’ అనే నిర్మాణంలో అణచివేసినవారికీ, పెరిగిన ఇశ్రాయేలీయులకీ ఒకే సర్వనామం రావడం కొంత అస్పష్టంగా ఉంది. సమష్టి సూచనను స్పష్టపరచి, ఆధునిక సహజమైన వాక్యనిర్మాణం ఉపయోగించబడింది.
  terminology: ‘ఇశ్రాయేలు కుమారులు’ అనేది בְּנֵי יִשְׂרָאֵלకు పారదర్శకమైన, అనుకూలమైన అనువాదం. ‘అణచివేశారు’ కూడా యుక్తమే. కוץ యొక్క ప్రత్యామ్నాయమైన ‘అసహ్యించుకున్నారు’ను అడుగుటిప్పణిలో ఉంచడం ద్వారా సందర్భానుగుణంగా ప్రధాన పాఠ్యంలో ‘భయపడ్డారు’ను ఉంచవచ్చు.
  issues:
