  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: te
  text: కానీ వారు ఇశ్రాయేలు ప్రజలను ఎంతగా అణచివేశారో, ఇశ్రాయేలు ప్రజలు అంతగా సంఖ్యలో పెరిగి, అంతగా వ్యాపించారు. అప్పుడు ఇశ్రాయేలు కుమారుల కారణంగా వారు భయపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియను “అసహ్యించుకున్నారు” లేదా “విరక్తి చెందారు” అని కూడా అనువదించవచ్చు; సందర్భంలో వారి భయభావమే ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: ఎంతగా ... అంతగా ... అంతగా
  rationale: ఈ హీబ్రూ నిర్మాణం అనుపాత సంబంధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎంతగా… అంతగా’ సహజంగా, స్పష్టంగా అదే భావాన్ని అందిస్తుంది.
- source_word: יְעַנּוּ
  choice: అణచివేశారు
  rationale: Piel రూపంలోని ענה ఇక్కడ కఠినంగా బాధించడం లేదా పీడించడం అనే అర్థం ఇస్తుంది. ‘అణచివేశారు’ ఐగుప్తీయుల పీడనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: ఇశ్రాయేలు ప్రజలను
  rationale: మూలంలో ఏకవచన సర్వనామం ఉన్నా అది ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది. తెలుగులో సూచిత సమూహాన్ని స్పష్టంగా చెప్పడం సహజం.
- source_word: יִרְבֶּה
  choice: విస్తరించారు
  rationale: רבה జనసంఖ్య పెరగడాన్ని సూచిస్తుంది. ‘విస్తరించారు’ సమష్టి ప్రజలు సంఖ్యాపరంగా పెరిగారనే భావాన్ని అందిస్తుంది.
- source_word: יִפְרֹץ
  choice: వ్యాపించారు
  rationale: פרץ ఇక్కడ వేగంగా విస్తరించడం, అన్ని వైపులకూ వ్యాపించడం అనే భావాన్ని ఇస్తుంది. ‘వ్యాపించారు’ దాని ఉద్ధృత విస్తరణను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיָּקֻצוּ
  choice: భయమూ అసహ్యమూ కలిగాయి
  rationale: קוץ అనే క్రియకు భయంతో వెనుకంజ వేయడం మరియు అసహ్యించుకోవడం అనే భావ ఛాయలు రెండూ ఉన్నాయి. ఒకదానికే పరిమితం చేయకుండా తెలుగు ప్రధాన పాఠ్యంలో రెండింటినీ నిలిపింది.
- source_word: מִפְּנֵי
  choice: ఇశ్రాయేలు కుమారులంటే
  rationale: ఈ సందర్భంలో ‘వారి కారణంగా/వారి సన్నిధిని తట్టుకోలేక’ అనే సంబంధాన్ని తెలుగులో సహజంగా తెలిపే నిర్మాణం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ జాతీయ సమూహపదబంధం యొక్క రూపాన్ని పారదర్శకంగా నిలుపుతుంది; ఆధునిక పాఠకుడికి అర్థమయ్యే సంప్రదాయబద్ధమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతీయ సమూహపదమని సందర్భం స్పష్టం చేస్తుంది.
- issue: וַיָּקֻצוּ లోని భావ ద్వంద్వం
  choice: భయమూ అసహ్యమూ కలిగాయి
  alternative: భయపడ్డారు / అసహ్యించుకున్నారు
  rationale: మూల క్రియ భయం, జుగుప్స లేదా అసహ్యం మధ్య భావ ఉద్రిక్తతను కలిగి ఉంది. ఒక అర్థాన్ని మాత్రమే ఎంచుకొని మిగిలినదాన్ని తొలగించకుండా రెండింటినీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ సమష్టి ఏకవచనాన్ని తెలుగులో సందర్భానుసారంగా బహువచనంగా ఇచ్చాం; చివరి క్రియలోని భయం–అసహ్యం భావసందిగ్ధతను ఉద్దేశపూర్వకంగా నిలిపాం.
