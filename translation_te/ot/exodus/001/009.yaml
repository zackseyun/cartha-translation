  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే జాతి-కుటుంబ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత సహజమైన తెలుగు రూపాన్ని పాదసూచికలో ఇచ్చాం.
