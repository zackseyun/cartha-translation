language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: te
  text: అతడు తన ప్రజలతో, “చూడండి, ఇశ్రాయేలు కుమారుల ప్రజలు[a] మనకంటే ఎక్కువ సంఖ్యలోను బలవంతులుగాను ఉన్నారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సహజంగా, “ఇశ్రాయేలు ప్రజలు.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల ప్రజలు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపం కథను ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండేలా ఉక్తిని అనుసరించి ‘అన్నాడు’ అని ఉంచాం.
- source_word: אֶל עַמּוֹ
  choice: తన ప్రజలతో
  rationale: עַם అనేది ఇక్కడ సమష్టిగా ఫరోకు చెందిన ప్రజలను సూచిస్తుంది; ‘తన ప్రజలతో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: దృష్టిని ఆకర్షించే הִנֵּה యొక్క బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘చూడండి’ తెలియజేస్తుంది.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ప్రజలు
  rationale: ‘ఇశ్రాయేలు కుమారుల ప్రజలు’ అనే హీబ్రూ సమాస నిర్మాణాన్నీ, కుటుంబ-జాతి సూచననూ ప్రధాన పాఠ్యంలో నిలుపుతుంది; సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: רַב
  choice: ఎక్కువ సంఖ్యలో
  rationale: מִמֶּנּוּ వల్ల కలిగే తులనాత్మక భావాన్ని బట్టి, జనసంఖ్యాపరమైన అధికతను ‘ఎక్కువ సంఖ్యలో’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָצוּם
  choice: బలంగా
  rationale: עָצוּם ఇక్కడ శక్తి లేదా బలాన్ని సూచిస్తుంది. ‘మనకంటే’ అనే తులనాత్మక పదబంధం ‘ఎక్కువ సంఖ్యలో’కూ ‘బలంగా’కూ వర్తిస్తుంది.
- source_word: מִמֶּנּוּ
  choice: మనకంటే
  rationale: מן + మొదటి పురుష బహువచన ప్రత్యయం తులనను సూచిస్తుంది; తెలుగులో ‘మనకంటే’ సహజంగా ఆ అర్థాన్ని అందిస్తుంది.
