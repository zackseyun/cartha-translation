id: EXO.1.5
reference: Exodus 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כָּל נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְ/יוֹסֵ֖ף הָיָ֥ה בְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: te
  text: యాకోబు సంతానంలోనివారందరూ మొత్తం డెబ్బై మంది[a]. యోసేపు అప్పటికే ఐగుప్తులో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “యాకోబు తొడనుండి బయలుదేరినవారు.” ఇది అతని సంతానాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది]'
  rationale: ఇది కథనాన్ని కొనసాగిస్తూ స్థితిని తెలిపే రూపం. తెలుగులో ‘అప్పుడు ఇలా జరిగింది’ అని పదేపదే అనువదించడం కృత్రిమంగా ఉంటుంది; ‘మొత్తం డెబ్బై మంది’ అనే సహజ వాక్య నిర్మాణమే దాని భావాన్ని అందిస్తుంది.
- source_word: כָּל
  choice: మొత్తం
  rationale: సమూహంలోని వారందరినీ కలిపిన సంపూర్ణ సంఖ్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נֶפֶשׁ ... נָפֶשׁ
  choice: వారు ... మంది
  rationale: ఈ సందర్భంలో נֶפֶשׁ అనేది ‘ప్రాణం’ లేదా ‘ఆత్మ’ అనే సాంకేతిక అర్థంలో కాక, వ్యక్తులను లెక్కించే పదంగా వాడబడింది. తెలుగులో వ్యక్తుల సంఖ్యకు ‘మంది’ సహజమైన లెక్కింపు రూపం.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: యాకోబుకు పుట్టినవారు
  rationale: హీబ్రూ శరీర సంబంధమైన నుడికారం యాకోబు ప్రత్యక్ష సంతానాన్ని సూచిస్తుంది. దాని ఉద్దేశాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తూ, మూలంలోని ప్రత్యక్ష చిత్రాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: שִׁבְעִים
  choice: డెబ్బై
  rationale: మూలంలోని సంఖ్యకు నేరమైన సమానార్థకం.
- source_word: וְיוֹסֵף
  choice: యోసేపు
  rationale: రెండవ వాక్యం ముందటి వాక్యానికి అనుసంధానమైన అదనపు సమాచారాన్ని ఇస్తుంది. తెలుగులో వాక్యాల క్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: הָיָה בְמִצְרָיִם
  choice: అప్పటికే ఐగుప్తులో ఉన్నాడు
  rationale: యాకోబు కుటుంబాన్ని లెక్కించిన సమయానికి యోసేపు ముందుగానే ఐగుప్తులో ఉన్నాడనే సందర్భోచిత కాలసూచనను ‘అప్పటికే’ స్పష్టంగా, అతిశయింపకుండా తెలియజేస్తుంది.
