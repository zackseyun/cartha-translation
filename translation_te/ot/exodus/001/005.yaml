translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఆత్మలు’ అనే అపార్థానికి దారితీయగల పదాన్ని నివారించి, వ్యక్తుల లెక్కింపుకు సహజమైన ‘మంది’ వాడబడింది. శరీర సంబంధమైన హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో భావానువాదంగా ఇచ్చి, దాని అక్షర రూపాన్ని [a] పాదసూచికలో ఉంచాం.
