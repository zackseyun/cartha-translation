revisions:
- from: యాకోబుకు పుట్టినవారు మొత్తం డెబ్బై మంది[a]. యోసేపు అప్పటికే ఐగుప్తులో ఉన్నాడు.
  to: యాకోబు సంతానంలోనివారందరూ మొత్తం డెబ్బై మంది[a]. యోసేపు అప్పటికే ఐగుప్తులో ఉన్నాడు.
