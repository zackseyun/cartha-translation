  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: te
  text: అప్పుడు ఐగుప్తు రాజు హెబ్రీ మంత్రసానులతో[a] అన్నాడు. వారిలో ఒకామె పేరు షిఫ్రా, మరొకామె పేరు పూవా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హెబ్రీ స్త్రీలకు ప్రసవసహాయం చేసే మంత్రసానులతో.’ హీబ్రూ పదబంధం మంత్రసానులు హెబ్రీయులని సూచించవచ్చు; లేదా వారు హెబ్రీ స్త్రీలకు ప్రసవసహాయం చేసేవారని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... మాట్లాడాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో ‘మాట్లాడాడు’ తరువాతి ప్రత్యక్ష ఆజ్ఞకు తగినది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు
  rationale: మూలంలోని సంయుక్త నామబంధాన్ని సహజంగా అనువదించింది; ఈ వచనంలో లేని ‘ఫరో’ అనే బిరుదును చేర్చలేదు.
- source_word: לַמְיַלְּדֹת
  choice: మంత్రసానులతో
  rationale: ప్రసవ సమయంలో సహాయం చేసే స్త్రీలను సూచించే పదానికి ‘మంత్రసానులు’ ప్రామాణికమైన, సంక్షిప్త తెలుగు సమానార్థకం.
- source_word: הָעִבְרִיֹּת
  choice: హెబ్రీయుల
  rationale: ఈ రూపాన్ని మంత్రసానుల జాతిని సూచించేదిగా గానీ, వారు సేవ చేసిన హెబ్రీ స్త్రీలను సూచించేదిగా గానీ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠంలో సహజమైన ఒక పఠనాన్ని ఉంచి, నిజమైన సందిగ్ధతను పాదసూచికలో తెలిపింది.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: వారిలో ఒకామె పేరు ... మరొకామె పేరు ...
  rationale: ‘ఒకరు ... రెండవవారు’ అనే విభజనాత్మక భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שִׁפְרָה
  choice: షిఫ్రా
  rationale: హెబ్రీ వ్యక్తినామానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: פּוּעָה
  choice: పూవా
  rationale: హెబ్రీ వ్యక్తినామంలోని దీర్ఘ ū మరియు మధ్య గొంతు ధ్వనిని తెలుగులో సహజంగా ప్రతిబింబించే లిప్యంతరీకరణ.
