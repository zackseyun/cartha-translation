translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఫరో’ను చేర్చకుండా మూలంలోని ‘ఐగుప్తు రాజు’ నిలుపబడింది. వాక్యాన్ని తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా విభజించినా, మూల భావక్రమం మారలేదు.
