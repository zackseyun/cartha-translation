source:
  edition: WLC
  text: וַ/יְצַ֣ו פַּרְעֹ֔ה לְ/כָל עַמּ֖/וֹ לֵ/אמֹ֑ר כָּל הַ/בֵּ֣ן הַ/יִּלּ֗וֹד הַ/יְאֹ֨רָ/ה֙ תַּשְׁלִיכֻ֔/הוּ וְ/כָל הַ/בַּ֖ת תְּחַיּֽוּ/ן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: te
  text: 'అప్పుడు ఫరో తన ప్రజలందరికీ ఇలా ఆజ్ఞాపించాడు: “పుట్టే ప్రతి మగబిడ్డను నైలు నదిలో[a] మీరు పడవేయాలి; కానీ ప్రతి ఆడబిడ్డను[b] బతకనివ్వాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం ‘నది.’ నిర్గమకాండలో ఈ పదం సాధారణంగా నైలు నదినే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘మరియు ప్రతి కుమార్తెను.’ ఇక్కడ ‘కానీ’ రెండు ఆదేశాల మధ్య వ్యత్యాసాన్ని చూపిస్తుంది. ‘మగబిడ్డ/ఆడబిడ్డ’ అనే పదాలు ఈ సందర్భంలో హీబ్రూ ‘కుమారుడు/కుమార్తె’ పదాల సాధారణ, లింగసూచక వాడుకను తెలియజేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה రాజాజ్ఞ సందర్భంలో స్పష్టమైన ఆదేశాన్ని జారీ చేయడాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ సహజమైన, గంభీరమైన తెలుగు రూపం.
- source_word: לְכָל עַמּוֹ
  choice: తన ప్రజలందరికీ
  rationale: עַם యొక్క ప్రత్యక్ష అర్థం ‘ప్రజలు’; ఇక్కడ ఫరో అధికారంలో ఉన్న ఐగుప్తీయులను విస్తృతంగా సూచిస్తుంది.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: పుట్టే ప్రతి కుమారుణ్ణి
  rationale: בֵּן‌ను ‘కుమారుడు’గా నిలుపుతూ, הַיִּלּוֹד అనే జననాన్ని సూచించే రూపాన్ని సహజ తెలుగులో ‘పుట్టే’ అని అనువదించింది.
- source_word: הַיְאֹרָה
  choice: నైలు నదిలో
  rationale: יְאֹר పదం నిర్గమకాండ సందర్భంలో ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది; ‘నైలు నది’ ఆధునిక పాఠకునికి సూచ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: תַּשְׁלִיכֻהוּ
  choice: పడవేయాలి
  rationale: ఈ రెండవ పురుష బహువచన ఆజ్ఞారూపం బలవంతమైన ఆదేశాన్ని తెలియజేస్తుంది; ‘పడవేయాలి’ తెలుగులో ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְכָל הַבַּת
  choice: కానీ ప్రతి కుమార్తెను
  rationale: וְ అక్షరార్థంగా ‘మరియు’; ఇక్కడ కుమారుల విషయంలో ఇచ్చిన ఆదేశానికి వ్యత్యాసాన్ని చూపుతున్నందున ‘కానీ’ సహజమైన సందర్భానువాదం.
- source_word: תְּחַיּוּן
  choice: బతకనివ్వాలి
  rationale: חיה యొక్క పియేల్ రూపం ఇక్కడ ‘బతికించు/బతకనివ్వు’ అనే భావం ఇస్తుంది; కుమారులను చంపాలనే ఆజ్ఞకు వ్యతిరేకంగా ‘బతకనివ్వాలి’ సరళంగా సరిపోతుంది.
