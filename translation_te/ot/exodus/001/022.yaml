translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాజ్ఞకు తగిన గంభీరతను ఉంచుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ ‘కుమారుడు/కుమార్తె’ పదజోడును నిలుపుకున్నాం; ఆజ్ఞ యొక్క క్రూరత్వాన్ని మృదువుపరచలేదు.
