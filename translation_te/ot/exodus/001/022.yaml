- from: 'అప్పుడు ఫరో తన ప్రజలందరికీ ఇలా ఆజ్ఞాపించాడు: “పుట్టే ప్రతి కుమారుణ్ణి నైలు నదిలో పడవేయాలి; కానీ ప్రతి కుమార్తెను బతకనివ్వాలి.”[a]'
  to: 'అప్పుడు ఫరో తన ప్రజలందరికీ ఇలా ఆజ్ఞాపించాడు: “పుట్టే ప్రతి మగబిడ్డను నైలు నదిలో[a] మీరు పడవేయాలి; కానీ ప్రతి ఆడబిడ్డను[b] బతకనివ్వాలి.”'
