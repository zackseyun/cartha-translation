id: EXO.1.18
reference: Exodus 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: te
  text: 'అప్పుడు ఐగుప్తు రాజు మంత్రసానులను పిలిపించి వారితో ఇలా అన్నాడు: “మీరు ఈ పని ఎందుకు చేశారు, పిల్లలను బ్రతకనిచ్చారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించి
  rationale: קרא + ל వ్యక్తులను తన ఎదుటికి రప్పించడాన్ని సూచిస్తుంది. ‘పిలిపించి’ అనే రూపం రాజు మంత్రసానులను పిలిపించిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజు
  rationale: హీబ్రూ సంయుక్త నామవాచక నిర్మాణాన్ని స్పష్టంగా, సంప్రదాయ తెలుగు బైబిలు పరిచయానికి అనుగుణంగా అందిస్తుంది.
- source_word: לַמְיַלְּדֹת
  choice: మంత్రసానులను
  rationale: ప్రసవ సమయంలో సహాయపడే స్త్రీలను సూచించే ఖచ్చితమైన, సాధారణ తెలుగు పదం.
- source_word: וַיֹּאמֶר לָהֶן
  choice: వారితో ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే אמר యొక్క సాధారణ అర్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే హీబ్రూ ప్రశ్నార్థక పదానికి సహజమైన తెలుగు సమానం.
- source_word: עֲשִׂיתֶן
  choice: మీరు ... చేశారు
  rationale: రెండవ పురుష బహువచనాన్ని ‘మీరు’ ద్వారా నిలుపుతుంది; హీబ్రూలోని స్త్రీలింగ సూచన తెలుగులో సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ పని
  rationale: דבר ఇక్కడ వారు చేసిన కార్యాన్ని సూచిస్తుంది. ‘ఈ పని’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆరోపణ స్వరాన్ని నిలుపుతుంది.
- source_word: וַתְּחַיֶּיןָ
  choice: బ్రతకనిచ్చారు
  rationale: ఈ సందర్భంలో క్రియ వారిని చంపకుండా జీవించనివ్వడం అనే భావాన్ని ఇస్తుంది. ‘బ్రతకనిచ్చారు’ ఆ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘బ్రతికించారు’ కూడా సాధ్యమైన అర్థం.
- source_word: הַיְלָדִים
  choice: పిల్లలను
  rationale: יְלָדִים అనే పదం స్వయంగా ‘పిల్లలు’ అని విస్తృతంగా అర్థమవుతుంది. సమీప సందర్భం మగ శిశువులను సూచించినా, మూలపదంలోని విస్తృతతను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఐగుప్తు’ మరియు ‘మంత్రసాని’ వంటి విస్తృతంగా గుర్తించదగిన బైబిలు పదజాలాన్ని ఉంచుతూ, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా తీర్చిదిద్దాం. ప్రధాన పాఠ్యంలో הַיְלָדִים యొక్క విస్తృత అర్థమైన ‘పిల్లలు’ నిలుపబడింది; సందర్భపరమైన ‘మగపిల్లలు’ పాదటిప్పణిలో సూచించబడింది.
