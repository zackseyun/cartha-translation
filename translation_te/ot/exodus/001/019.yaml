source:
  edition: WLC
  text: וַ/תֹּאמַ֤רְןָ הַֽ/מְיַלְּדֹת֙ אֶל פַּרְעֹ֔ה כִּ֣י לֹ֧א כַ/נָּשִׁ֛ים הַ/מִּצְרִיֹּ֖ת הָֽ/עִבְרִיֹּ֑ת כִּֽי חָי֣וֹת הֵ֔נָּה בְּ/טֶ֨רֶם תָּב֧וֹא אֲלֵ/הֶ֛ן הַ/מְיַלֶּ֖דֶת וְ/יָלָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: te
  text: 'మంత్రసానులు ఫరోతో ఇలా అన్నారు: “హీబ్రూ స్త్రీలు ఐగుప్తు స్త్రీలవంటివారు కారు; ఎందుకంటే వారు దృఢంగా ఉంటారు[a]. మంత్రసాని వారి వద్దకు రాకముందే వారు ప్రసవించి ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దృఢంగా” అనే హీబ్రూ పదానికి “చురుకుగా,” “బలంగా,” లేదా “సజీవంగా” అనే భావాలు కూడా ఉండవచ్చు. కొందరు దీనిని మరింత అక్షరార్థంగా “జంతువులవలె” అని అర్థం చేసుకుంటారు; అయితే ఈ సందర్భంలో ఆ భావం నిశ్చయం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ הַמְיַלְּדֹת אֶל־פַּרְעֹה
  choice: మంత్రసానులు ఫరోతో ... అని చెప్పారు
  rationale: హీబ్రూ కథనంలోని సాధారణ వాక్యప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: హీబ్రూ స్త్రీలు ఐగుప్తు స్త్రీలవంటివారు కారు
  rationale: మూలంలోని పోలికను, రెండు స్త్రీ సమూహాల మధ్య వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חָיוֹת הֵנָּה
  choice: వారు బలంగా, చురుకుగా ఉంటారు
  rationale: חָיוֹת ఇక్కడ ప్రసవంలో దృఢత్వం, వేగం లేదా సజీవత్వాన్ని సూచించవచ్చు. తెలుగు పాఠకునికి సహజంగా ఉండేలా ఈ భావ పరిధిని వ్యక్తం చేస్తూ, ‘జంతువులవంటివారు’ అనే అనిశ్చితమైన అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: మంత్రసాని వారి దగ్గరికి రాకముందే
  rationale: ఏ ప్రత్యేక మంత్రసానినీ కాక, సాధారణంగా ప్రసవానికి సహాయపడే మంత్రసానిని సూచించే ఏకవచనాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְיָלָדוּ
  choice: వారు ప్రసవిస్తారు
  rationale: మంత్రసాని చేరుకునేలోపే ప్రసవం పూర్తవుతుందనే పునరావృత పరిస్థితిని సహజ తెలుగు వర్తమాన కాలంతో తెలియజేస్తుంది.
theological_decisions:
- issue: మంత్రసానుల మాటల సత్యాసత్యాలపై కథనం ఇక్కడ తీర్పు ఇవ్వదు
  choice: వారి వివరణను ప్రత్యక్ష వాక్యంగా మాత్రమే అనువదించడం
  alternative: వారు అబద్ధం చెప్పారని లేదా పూర్తిగా నిజం చెప్పారని అనువాదంలో సూచించడం
  rationale: మూల వచనం వారి మాటలను నివేదిస్తుంది గాని, ఈ వాక్యంలో వాటి నైతిక లేదా వాస్తవ స్థితిని స్పష్టంగా నిర్ణయించదు; ఆ ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మంత్రసాని’ అనే సాధారణ తెలుగు పదాన్ని ఉపయోగించాం. ఫుట్‌నోట్ గుర్తు సంబంధిత వాక్యం చివర ఉంచబడింది.
