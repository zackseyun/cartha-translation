source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: te
  text: అయితే[b] ఇశ్రాయేలు కుమారులు ఫలించి, విస్తారంగా పెరిగి[a], సంఖ్యలో అధికమై, అత్యంత బలవంతులయ్యారు; మరియు దేశం వారితో నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గుంపులు గుంపులుగా విస్తరించి’; హీబ్రూ క్రియ విపరీతంగా గుంపులుగా పెరగడం అనే సజీవ చిత్రాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మరియు ఇశ్రాయేలు కుమారులు’; హీబ్రూ సంధానాన్ని సాధారణంగా ‘మరియు’ అని కూడా అనువదించవచ్చు. ‘అయితే’ ముందటి వచనంతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు కుమారులు
  rationale: בני ישראל అనే కుటుంబ-జాతీయ అభివ్యక్తిని యథాశక్తిగా నిలుపుతుంది. ముందటి వచనంలో యోసేపు తరంవారు మరణించారనే విషయానికి ఇక్కడ వ్యత్యాసం ఉన్నందున וּ ను ‘అయితే’గా అనువదించాం.
- source_word: פָּרוּ
  choice: ఫలించి
  rationale: פרה లోని ఫలవంతత భావాన్ని, ఆదికాండంలోని ఆశీర్వాద భాషతో ఉండగల ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: וַיִּשְׁרְצוּ
  choice: విస్తారంగా పెరిగి
  rationale: שׁרץ విపరీతంగా విస్తరించడం లేదా గుంపులుగా పెరగడం అనే సజీవ చిత్రాన్ని ఇస్తుంది. మనుషుల విషయంలో సహజమైన ఆధునిక తెలుగుకోసం ‘విస్తారంగా పెరిగి’ ఎంచుకున్నాం; మరింత చిత్రాత్మకమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּרְבּוּ
  choice: సంఖ్యలో అధికమై
  rationale: רבה సూచించే సంఖ్యాపరమైన విస్తరణను స్పష్టంగా తెలియజేస్తుంది; సమీపంలోని ఇతర వృద్ధి క్రియలతో తెలుగులో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: అత్యంత బలవంతులయ్యారు
  rationale: עצם యొక్క ప్రధానమైన బలం లేదా శక్తి భావాన్ని, రెండుసార్లు వచ్చిన מאד యొక్క తీవ్రమైన ఉద్ఘాటనతో కలిపి అందిస్తుంది. సందర్భంలో సంఖ్యాబలం కూడా అంతర్భూతం కావచ్చు, కానీ దానికే అర్థాన్ని పరిమితం చేయలేదు.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: ఆ దేశం వారితో నిండిపోయింది
  rationale: הארץ ను సందర్భానుసారం ‘దేశం’గా, מלא నిఫల్ రూపాన్ని ‘వారితో నిండిపోయింది’గా అనువదించాం. హీబ్రూలోని సాధారణ సంధానాన్ని ప్రధాన వాక్యంలో సహజంగా వరుస ఫలితంగా ఉంచాం.
theological_decisions:
- issue: సంతానోత్పత్తి భాషలో సృష్టి/ఆశీర్వాద ప్రతిధ్వని
  choice: ‘ఫలించి ... సంఖ్యలో అధికమై’ అనే క్రమం ద్వారా ప్రతిధ్వనిని నిలుపడం
  alternative: ఆదికాండపు ఆశీర్వాదాన్ని స్పష్టంగా పేర్కొనే వివరణాత్మక పదాలను చేర్చడం
  rationale: హీబ్రూ పదక్రమం పూర్వపు సృష్టి, ఆశీర్వాద భాషను గుర్తుచేయవచ్చు; అయితే మూలంలో లేని వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పదాల ద్వారానే ఆ ప్రతిధ్వనిని కాపాడాం.
- issue: וּ సంధానానికి వ్యత్యాసార్థమా, సాధారణ సంధానార్థమా
  choice: అయితే
  alternative: మరియు
  rationale: ముందటి వచనంలో ఒక తరం మరణించడం, ఇక్కడ ఇశ్రాయేలీయులు విస్తరించడం మధ్య కథన వ్యత్యాసాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది; సాధారణ ‘మరియు’ కూడా వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని కుటుంబ-జాతీయ రూపకాన్ని కాపాడుతుంది. ‘విస్తారంగా పెరిగి’ సహజ తెలుగు కోసం ఎంచుకోగా, שׁרץ యొక్క మరింత సజీవ రూపాన్ని పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
