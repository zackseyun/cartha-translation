id: EXO.1.17
reference: Exodus 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: te
  text: అయితే మంత్రసానులు దేవునికి భయపడి, ఐగుప్తు రాజు తమతో చెప్పినట్లు చేయలేదు; ఆ పిల్లలను బ్రతకనిచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ పిల్లలను బ్రతికించారు.”
    reason: וַתְּחַיֶּיןָ అనే కారణార్థక క్రియకు ‘బ్రతకనిచ్చారు,’ ‘బ్రతికించారు/ప్రాణాలతో ఉంచారు’ అనే సమీప ప్రత్యామ్నాయ అర్థాలు సాధ్యమైనందున.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: భయపడి
  rationale: ירא దేవుని పట్ల భయభక్తిని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో సహజమైన ‘దేవునికి భయపడడం’ అనే ప్రయోగం భయం, భక్తి అనే రెండు ఛాయలనూ నిలుపుతుంది.
- source_word: הַמְיַלְּדֹת
  choice: మంత్రసానులు
  rationale: ప్రసవానికి సహాయం చేసే స్త్రీలను సూచించే సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు పదం.
- source_word: אֶת הָאֱלֹהִים
  choice: దేవునికి
  rationale: తెలుగులో ‘భయపడు’ క్రియకు సహజంగా చతుర్థీ విభక్తి వస్తుంది. సందర్భంలో ఇది నిజమైన దేవుణ్ణే సూచిస్తుంది; హీబ్రూలోని నిర్దేశక ఉపపదాన్ని విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: וְלֹא עָשׂוּ
  choice: చేయలేదు
  rationale: హీబ్రూ עשׂה యొక్క సరళమైన నిరాకరణను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: తమతో చెప్పినట్లు
  rationale: దేవుడు కాదు, ఐగుప్తు రాజే మంత్రసానులతో చెప్పాడని తెలుగులో స్పష్టంగా ఉండేలా ‘తమతో’ వాడబడింది; ఆజ్ఞాపూర్వక సందర్భంలో דִּבֶּר భావాన్ని ‘చెప్పినట్లు’ సహజంగా అందిస్తుంది.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: ఐగుప్తు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణానికి సహజమైన తెలుగు సమానార్థకం; బైబిలు భౌగోళిక నామరూపమైన ‘ఐగుప్తు’ నిలుపబడింది.
- source_word: וַתְּחַיֶּיןָ
  choice: బ్రతకనిచ్చారు
  rationale: חיה పీయేల్ రూపంలోని ‘బ్రతికించడం/బ్రతకనివ్వడం’ అనే కారణార్థాన్ని, చంపాలనే రాజాజ్ఞకు వ్యతిరేకమైన చర్యగా సహజంగా తెలియజేస్తుంది.
- source_word: הַיְלָדִים
  choice: ఆ పిల్లలను
  rationale: ילדים అనే పదం స్వతహాగా ‘పిల్లలు’ అని విస్తృతార్థం కలిగినది; ముందరి సందర్భం వీరు మగశిశువులని స్పష్టం చేస్తుంది. ‘ఆ’ సందర్భంలో ఇప్పటికే ప్రస్తావించిన పిల్లలను సూచిస్తుంది.
theological_decisions:
- issue: אֱלֹהִים అనే పదాన్ని ‘దేవుడు’గా గుర్తించడం
  choice: దేవునికి
  alternative: ఆ దేవునికి
  rationale: కథన సందర్భంలో నిజమైన దేవుడే ఉద్దేశించబడ్డాడు. హీబ్రూ నిర్దేశక ఉపపదాన్ని ‘ఆ’ అని యాంత్రికంగా అనువదిస్తే తెలుగులో అనవసరమైన వ్యత్యాస భావం కలగవచ్చు.
- issue: ‘దేవునికి భయపడడం’లోని భావ ఛాయ
  choice: భయపడి
  alternative: భక్తితో గౌరవించి
  rationale: మూలంలోని ירא నిజమైన భయాన్నీ భక్తిపూర్వక గౌరవాన్నీ కలిగి ఉండగలదు. ‘భయపడి’ అనే సాంప్రదాయికమైనప్పటికీ ఆధునికంగా అర్థమయ్యే ప్రయోగం ఆ ఉద్దేశపూర్వక భావవిస్తృతిని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘మంత్రసానులు,’ ‘ఐగుప్తు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. మూలంలోని వ్యతిరేకతను ‘అయితే’ ద్వారా, చివరి చర్యను అర్ధవిరామంతో స్పష్టంగా చూపించాం.
