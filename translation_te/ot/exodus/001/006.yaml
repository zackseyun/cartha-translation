  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: తరువాత ... చనిపోయారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి గత సంఘటనకు తీసుకెళ్తుంది. సమాస కర్తలతో సహజమైన తెలుగులో బహువచన క్రియను వాక్యాంతంలో ఉంచి, ‘తరువాత’ ద్వారా క్రమాన్ని తెలిపాం.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: וְכָל אֶחָיו
  choice: అతని సోదరులందరూ
  rationale: אָחִים ఇక్కడ యోసేపు సహోదరులైన పురుషులను సూచిస్తుంది; כָּל యొక్క సమష్టి భావాన్ని ‘అందరూ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: ఆ తరంవారందరూ
  rationale: דּוֹר ఒకే కాలంలో జీవించిన ప్రజల తరాన్ని సూచిస్తుంది. ‘ఆ తరంవారు’ సహజమైన ఆధునిక తెలుగు; పునరుక్త כֹּל భావాన్ని ‘అందరూ’తో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని వరుస ‘మరియు’లను యాంత్రికంగా పునరావృతం చేయకుండా, తెలుగు సమాస కర్త నిర్మాణంలో భావం మరియు సమగ్రతను నిలిపాం.
