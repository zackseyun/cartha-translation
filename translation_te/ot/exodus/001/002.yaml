lexical_decisions:
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సులభంగా చదవగల సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హీబ్రూ పేరులోని ఆరంభ ‘షి’ ధ్వనిని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు సహజంగా చదవగల రూపాన్ని ఎంచుకున్నాం.
- source_word: לֵוִי
  choice: లేవి
  rationale: వ్యక్తి పేరును దాని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; తరువాతి గోత్ర లేదా యాజక సంబంధ భావాలను వచనంలో చేర్చలేదు.
- source_word: וִ/יהוּדָה
  choice: యూదా
  rationale: יהודה అనే వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యూదా’గా ఇచ్చాం. జాబితాలో చివరి అంశాన్ని సూచించే హీబ్రూ ו భావం తెలుగు విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తమవుతున్నందున ప్రత్యేకంగా ‘మరియు’ చేర్చలేదు.
