  yaml_path: translation/ot/exodus/001/013.yaml
  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: te
  text: ఈజిప్టీయులు ఇశ్రాయేలు కుమారులతో[a] నిర్దాక్షిణ్యంగా వెట్టిచాకిరి చేయించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే ‘ఇశ్రాయేలీయులతో’ లేదా ‘ఇశ్రాయేలు సంతతితో.’ ఇక్కడ ‘ఇశ్రాయేలు కుమారులు’ అనేది మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కఠినంగా’ లేదా ‘అత్యంత కఠినంగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం బలవంతపు శ్రమలోని తీవ్రమైన, అణచివేసే కాఠిన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: వెట్టిచాకిరి చేయించారు
  rationale: עבד యొక్క హిఫీల్ రూపం ‘సేవ/పని చేయేలా చేశారు’ అనే కారణార్థాన్ని ఇస్తుంది. ఈ సందర్భంలో అది బలవంతపు శ్రమను సూచిస్తున్నందున, ‘వెట్టిచాకిరి చేయించారు’ కారణార్థాన్నీ నిర్బంధ శ్రమ భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘బానిసలుగా చేసుకున్నారు’ అన్నది తక్షణ క్రియకన్నా విస్తృతమైన స్థితిని ఎక్కువగా వ్యాఖ్యానిస్తుంది.
- source_word: מִצְרַיִם
  choice: ఈజిప్టీయులు
  rationale: ఈ రూపం దేశాన్నీ ప్రజలనూ సూచించగలదు; ఇక్కడ క్రియకు కర్తగా ఉన్న ప్రజలను సూచిస్తున్నందున ‘ఈజిప్టీయులు’ సహజంగా సరిపోతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన సమూహపదాన్ని, దాని వంశీయ ప్రతిధ్వనిని నిలుపుతుంది. ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన ప్రయోగమని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: בְּפָרֶךְ
  choice: కఠినంగా
  rationale: פָרֶךְ బలవంతపు పనిలోని తీవ్రమైన, అణచివేసే కాఠిన్యాన్ని సూచిస్తుంది. ‘కఠినంగా’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి క్రియావిశేషణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; తీవ్రతను పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే నిబంధన-ప్రజల సమూహ designation ను అనువదించడం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని కుటుంబ/వంశ రూపకాన్ని నిలుపుతుంది; అయితే ఇది కేవలం పురుషులను లేదా చిన్నపిల్లలను కాక మొత్తం ప్రజాసమూహాన్ని సూచిస్తుందని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘వెట్టిచాకిరి చేయించారు’ బలవంతపు శ్రమ సందర్భాన్ని సహజంగా అందిస్తుంది; ‘ఇశ్రాయేలు కుమారులు’ మూలరూపాన్ని నిలుపుతూ దాని సమూహార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
