source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי יָֽרְא֥וּ הַֽ/מְיַלְּדֹ֖ת אֶת הָ/אֱלֹהִ֑ים וַ/יַּ֥עַשׂ לָ/הֶ֖ם בָּתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: te
  text: మంత్రసానులు దేవునికి భయపడ్డారు కాబట్టి, ఆయన వారికి కుటుంబాలను ఏర్పరచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఆయన వారికి ఇళ్లు చేశాడు.” ఇక్కడి హీబ్రూ మాట భౌతిక ఇళ్లను చేయడంకంటే కుటుంబాలను లేదా వంశాలను స్థాపించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: కాబట్టి
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ పదబంధం కారణాన్ని దాని ఫలితంతో కలుపుతుంది. తెలుగులో సహజంగా ఉండేందుకు కారణవాచక నిర్మాణంతో అనువదించబడింది.
- source_word: יָרְאוּ
  choice: భయపడ్డారు
  rationale: దేవునిపట్ల భయభక్తులను సూచించే హీబ్రూ భావాన్ని మృదువుగా మార్చకుండా, సుపరిచితమైన బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: הַמְיַלְּדֹת
  choice: మంత్రసానులు
  rationale: ముందు పరిచయమైన ప్రసవ సహాయకురాళ్లను సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: הָאֱלֹהִים
  choice: దేవునికి
  rationale: నిర్దిష్టమైన నిజ దేవునిని సూచించే సందర్భోచిత, సహజ తెలుగు రూపం; ירא క్రియకు అనుగుణంగా చతుర్థీ విభక్తి వాడబడింది.
- source_word: וַיַּעַשׂ
  choice: ఏర్పరచాడు
  rationale: עשה అనే క్రియకు ఉన్న ‘చేశాడు’ అనే ప్రాథమిక భావాన్ని, בָּתִּים ఇక్కడ కుటుంబాలు లేదా ఇంటివారిని స్థాపించడాన్ని సూచించే అవకాశంతో కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: హీబ్రూలో పుంలింగ బహువచన ప్రత్యయం ఉన్నప్పటికీ సందర్భంలో అది మంత్రసానులనే సూచిస్తుంది; తెలుగు రూపం లింగనిరపేక్షంగా సరిపోతుంది.
- source_word: בָּתִּים
  choice: కుటుంబాలను
  rationale: అక్షరార్థంగా ‘ఇళ్లు’ అయినా, సందర్భంలో కుటుంబాలను లేదా ఇంటివారిని కలుగజేయడం అనే భావం సంభావ్యంగా ఉంది. ప్రధాన పాఠంలో అర్థాన్ని సహజంగా తెలియజేస్తూ, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ‘వారికి కుటుంబాలను ఏర్పరచాడు’ అనే మాట యొక్క భావం
  choice: దేవుడు మంత్రసానులకు కుటుంబాలను అనుగ్రహించి స్థిరపరిచాడు.
  alternative: దేవుడు వారికి భౌతికమైన ఇళ్లను కట్టించాడు లేదా కలుగజేశాడు.
  rationale: עשה ... בתים అనే హీబ్రూ నిర్మాణం కుటుంబాలను లేదా ఇంటివారిని స్థాపించడాన్ని సూచించగలదు. అయినప్పటికీ ‘ఇళ్లు’ అనే అక్షరార్థం పూర్తిగా అసాధ్యం కాదు; అందువల్ల ఆ భాషాపరమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘దేవునికి భయపడ్డారు’ అనే బైబిలు నుడికారాన్ని నిలిపి, ‘బాత్తీమ్’ పదంలోని ఇళ్లు/కుటుంబాలు అనే అర్థసంభావ్యతను పాదసూచికలో పారదర్శకంగా తెలిపాం.
