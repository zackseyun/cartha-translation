source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “మీరు హెబ్రీ స్త్రీలకు ప్రసవంలో సహాయం చేస్తున్నప్పుడు, వారు ప్రసవ పీఠం[a] మీద ఉన్నప్పుడు గమనించి, పుట్టిన శిశువు కుమారుడైతే అతణ్ణి చంపాలి; కుమార్తె అయితే ఆమెను బతకనివ్వాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో పదశః, “రెండు రాళ్ల మీద”; ఇది బహుశా ప్రసవ పీఠాన్ని లేదా ప్రసవ ఆసనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: ప్రసవంలో సహాయం చేస్తూ
  rationale: పియేల్ రూపం ప్రసవం చేయించడంలో లేదా ప్రసవానికి సహాయం చేయడంలో మంత్రసానుల పాత్రను సూచిస్తుంది. ఆధునిక తెలుగులో ఈ ఎంపిక సహజంగా ఉండి ప్రసూతి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעִבְרִיּוֹת
  choice: హెబ్రీ స్త్రీలకు
  rationale: స్త్రీలింగ బహువచన రూపం ‘హెబ్రీ స్త్రీలు’ అని సూచిస్తుంది. తెలుగు క్రియాప్రయోగానికి అనుగుణంగా ‘స్త్రీలకు’ అని ఇచ్చాం.
- source_word: וּרְאִיתֶן
  choice: చూసినప్పుడు
  rationale: ఇది మంత్రసానులకు ఇచ్చిన వరుస ఆదేశంలో ‘చూడడం’ అనే సాధారణ భావాన్ని కలిగిస్తుంది; కాలసంబంధ సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘చూసినప్పుడు’ అని అనువదించాం.
- source_word: עַל הָאָבְנָיִם
  choice: ప్రసవ పీఠం మీద
  rationale: పదశః ‘రెండు రాళ్ల మీద’ అయినా, ప్రసవ సందర్భంలో ఇది ప్రసవానికి ఉపయోగించే పీఠం లేదా ఆసనాన్ని సూచించే జాతీయ ప్రయోగంగా అర్థమవుతుంది. పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אִם בֵּן הוּא
  choice: పుట్టినది కుమారుడైతే
  rationale: కొత్తగా పుట్టిన శిశువు మగవాడైతే అనే భావం. בן కు అనుగుణంగా ‘కుమారుడు’ వాడి, తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘పుట్టినది’ చేర్చాం.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: అతణ్ణి చంపాలి
  rationale: హిఫీల్ రూపం ‘చనిపోయేలా చేయండి/చంపండి’ అనే ప్రత్యక్ష ఆదేశం. ‘చంపాలి’ ఆధునిక తెలుగులో ఆ ఆదేశపు ఉద్దేశపూర్వకతను స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְאִם בַּת הִיא
  choice: కుమార్తె అయితే
  rationale: בן/בת అనే కుమారుడు–కుమార్తె జతను నిలుపుతూ వ్యత్యాసాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: וָחָיָה
  choice: ఆమెను బతకనివ్వాలి
  rationale: ఆడశిశువును సజీవంగా ఉండనివ్వడం లేదా విడిచిపెట్టడం అనే అనుమతిసూచక భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది; కేవలం ‘ఆమె బతుకుతుంది’ అన్నదానికంటే ఆదేశ స్వభావాన్ని బాగా తెలియజేస్తుంది.
