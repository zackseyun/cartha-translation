  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆదేశ శైలిని ఉపయోగించాం. హెబ్రీ మూలంలోని స్త్రీలింగ బహువచన సంబోధన తెలుగులో ప్రత్యేకంగా రూపంలో కనిపించకపోయినా, సందర్భంలో మంత్రసానులనే ఉద్దేశించడం స్పష్టంగా ఉంది.
