    text: లేదా, “క్రూరంగా.” హీబ్రూ పదం తీవ్రంగా అణిచివేసే, కనికరంలేని విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision removes the over-specific «వెట్టిచాకిరి», clarifies that the mortar and bricks belong to the sphere of hard labor, and recasts the resumptive final clause into natural Telugu while retaining its emphasis on every imposed task and its ruthless administration. The footnote remains correctly anchored to «నిర్దయగా» and preserves the lexical alternative.
