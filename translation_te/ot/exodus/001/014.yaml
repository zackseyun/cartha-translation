revisions:
- from: వారు కఠినమైన వెట్టిచాకిరితో—గార, ఇటుకల పనులతో, పొలాల్లోని అన్ని రకాల పనులతో—వారి జీవితాలను చేదుగా మార్చారు. వారు వారిచేత చేయించిన పనంతటినీ నిర్దయగా చేయించారు.[a]
  to: వారు గారతోను ఇటుకలతోను చేసే కఠిన శ్రమతోను, పొలాల్లోని అన్ని రకాల పనులతోను వారి జీవితాలను చేదుగా చేశారు; వారిచేత చేయించిన పనులన్నిటిలో వారు నిర్దయగా వ్యవహరించారు.[a]
  rationale: The revision removes the over-specific «వెట్టిచాకిరి», clarifies that the mortar and bricks belong to the sphere of hard labor, and recasts the resumptive final clause into natural Telugu while retaining its emphasis on every imposed task and its ruthless administration. The footnote remains correctly anchored to «నిర్దయగా» and preserves the lexical alternative.
