  text: וַ/יְמָרְר֨וּ אֶת חַיֵּי/הֶ֜ם בַּ/עֲבֹדָ֣ה קָשָׁ֗ה בְּ/חֹ֨מֶר֙ וּ/בִ/לְבֵנִ֔ים וּ/בְ/כָל עֲבֹדָ֖ה בַּ/שָּׂדֶ֑ה אֵ֚ת כָּל עֲבֹ֣דָתָ֔/ם אֲשֶׁר עָבְד֥וּ בָ/הֶ֖ם בְּ/פָֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: te
  text: వారు గారతోను ఇటుకలతోను చేసే కఠిన శ్రమతోను, పొలాల్లోని అన్ని రకాల పనులతోను వారి జీవితాలను చేదుగా చేశారు; వారిచేత చేయించిన పనులన్నిటిలో వారు నిర్దయగా వ్యవహరించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రూరంగా.” హీబ్రూ పదం తీవ్రంగా అణిచివేసే, కనికరంలేని విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: వారి జీవితాలను చేదుగా మార్చారు
  rationale: ‘చేదుగా చేయడం’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, వారి జీవనానుభవమంతా దుర్భరమైందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: కఠినమైన వెట్టిచాకిరితో
  rationale: עֲבֹדָה అనేది పని లేదా సేవను, קָשָׁה కఠినత్వాన్ని సూచిస్తాయి. బలవంతంగా చేయించిన అణచివేతతో కూడిన శ్రమ అనే సందర్భార్థాన్ని ‘వెట్టిచాకిరి’ స్పష్టంగా అందిస్తుంది.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: గార, ఇటుకల పనులతో
  rationale: నిర్మాణ సందర్భంలో חֹמֶר గార లేదా మట్టి పదార్థాన్ని, לְבֵנִים బహువచనంగా ఇటుకలను సూచిస్తుంది. తెలుగులో పని స్వరూపం స్పష్టంగా ఉండేందుకు ‘పనులతో’ చేర్చబడింది.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: పొలాల్లోని అన్ని రకాల పనులతో
  rationale: כָל యొక్క సమగ్రతను, పొలాల్లో చేయించిన విభిన్న శ్రమలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: వారు వారిచేత చేయించిన పనంతటినీ ... చేయించారు
  rationale: హీబ్రూ వాక్యంలోని పునరుక్తి, బలవంతపు పనిని సూచించే భావం రెండింటినీ సాధ్యమైనంతవరకు నిలుపుతుంది; ‘వారు’ ఐగుప్తీయులను, ‘వారిచేత’ ఇశ్రాయేలీయులను సందర్భానుసారంగా సూచిస్తాయి.
- source_word: בְּפָרֶךְ
  choice: నిర్దయగా
  rationale: ఈ పదం కఠోరమైన, అణిచివేసే, కనికరంలేని వ్యవహారాన్ని సూచిస్తుంది. ‘నిర్దయగా’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని తీవ్రతను అందిస్తుంది.
