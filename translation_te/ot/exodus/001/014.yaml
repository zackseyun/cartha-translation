translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మూలంలోని ‘జీవితాలను చేదుగా మార్చారు’ అనే రూపకం, ఇటుకల బహువచనం, చివరి భాగంలోని పునరుద్ఘాటన నిలుపబడ్డాయి.
