- source_word: דָּן
  choice: దాను
  rationale: యాకోబు కుమారుని వ్యక్తినామం; ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וְ/נַפְתָּלִי
  choice: నఫ్తాలి
  rationale: వ్యక్తినామం తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడింది. హీబ్రూ וְ జాబితాలోని అనుసంధానాన్ని సూచిస్తుంది; సహజ తెలుగు జాబితాలో దానిని ప్రత్యేకంగా ‘మరియు’ అని వ్యక్తపరచాల్సిన అవసరం లేదు.
- source_word: גָּד
  choice: గాదు
  rationale: యాకోబు కుమారుని వ్యక్తినామం; స్థిరపడిన తెలుగు బైబిలు రూపాన్ని అనుసరించింది.
- source_word: וְ/אָשֵׁר
  choice: ఆషేరు
  rationale: వ్యక్తినామం తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడింది. చివరి וְ ను సహజ తెలుగు జాబితా శైలిలో విరామచిహ్నంతో సూచించాం.
