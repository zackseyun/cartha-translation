translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి పాటించబడింది. ఫరో మాటల్లోని రాజకీయ లెక్కింపు భావాన్ని ‘యుక్తిగా’ ద్వారా నిలిపి, ఇశ్రాయేలును సూచించే హీబ్రూ సమష్టి ఏకవచనాన్ని సహజమైన తెలుగు బహువచనంగా అందించాం. చివరి హీబ్రూ దిశాసూచక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, దాని పదశః రూపాన్ని పాదటిప్పణిలో సంరక్షించాం.
