    issue: ‘యుక్తిగా’ understates the sense of calculated shrewdness.
    rationale: In modern Telugu, ‘యుక్తిగా’ commonly denotes acting appropriately, reasonably, or suitably. In this hostile political context, the Hebrew reflexive of חכם calls for wording that can convey clever, strategic calculation; ‘చాకచక్యంగా’ does so more clearly.
  - severity: low
    issue: 'Footnote b contains a duplicated expression: ‘లెక్కలు వేసి వేసే’.'
    rationale: Removing the repetition improves readability without altering the explanatory content.
