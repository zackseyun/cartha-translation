  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: te
  text: “రండి, వారు మరింత పెరిగిపోకుండా వారితో[a] చాకచక్యంగా[b] వ్యవహరిద్దాం. యుద్ధం జరిగితే, వారు కూడా మన శత్రువుల పక్షాన చేరి, మనకు వ్యతిరేకంగా పోరాడి, దేశం నుంచి వెళ్లిపోవచ్చు[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతనితో/అతనిపట్ల’ అని ఏకవచనంలో ఉంది; ఆ సర్వనామం ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తెలివిగా వ్యవహరిద్దాం.’ హీబ్రూ పదం తెలివిగా లేదా నేర్పుగా ప్రవర్తించడాన్ని సూచించగలదు; ఇక్కడి సందర్భంలో రాజకీయంగా లెక్కలు వేసే ఎత్తుగడ భావం ప్రధానంగా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదశః, ‘దేశం నుంచి పైకి వెళ్లిపోవచ్చు.’ అంటే, ‘దేశాన్ని విడిచి వెళ్లిపోవచ్చు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: రండి
  rationale: కలిసి వెంటనే చర్య తీసుకోవాలని ప్రేరేపించే హీబ్రూ ఉద్బోధనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נִתְחַכְּמָה
  choice: యుక్తిగా వ్యవహరిద్దాం
  rationale: ఈ సందర్భంలో ఇది నైతికంగా ప్రశంసనీయమైన జ్ఞానం కంటే, ఒక ముప్పును ఎదుర్కోవడానికి వేసే తెలివైన రాజకీయ ఎత్తుగడను సూచిస్తుంది. ‘యుక్తిగా’ ఆ వ్యూహాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לוֹ
  choice: వారిపట్ల
  rationale: హీబ్రూలో సర్వనామం ఏకవచనంలో ఉన్నా, అది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం సహజంగా ఉంటుంది.
- source_word: פֶּן יִרְבֶּה
  choice: వారు ఇంకా విస్తరించకుండా
  rationale: פֶּן భయపడుతున్న ఫలితాన్ని నివారించాలనే ఉద్దేశాన్ని తెలియజేస్తుంది. יִרְבֶּה జనసంఖ్య పెరగడాన్ని సూచిస్తుంది; సందర్భానికి అనుగుణంగా ‘ఇంకా విస్తరించకుండా’ అని అనువదించబడింది.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: యుద్ధం సంభవిస్తే
  rationale: యుద్ధం ఎదురయ్యే సాధ్యమైన పరిస్థితిని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: వారు కూడా మన శత్రువులతో చేరి
  rationale: ‘తన్ను కలుపుకోవడం’ అనే హీబ్రూ ప్రయోగానికి సందర్భోచిత భావం శత్రుపక్షంతో చేరడం. సమష్టిని సూచించే ఏకవచనానికి తెలుగులో బహువచనం వాడబడింది.
- source_word: וְנִלְחַם בָּנוּ
  choice: మనకు వ్యతిరేకంగా యుద్ధం చేసి
  rationale: בָּנוּలోని విరోధ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: దేశం నుంచి వెళ్లిపోవచ్చు
  rationale: హీబ్రూ పదశః ‘దేశం నుంచి పైకి వెళ్లడం’ అని ఉన్నా, ఇక్కడ దేశాన్ని విడిచి వెళ్లడమే సందర్భోచిత భావం. ‘వెళ్లిపోవచ్చు’ భయపడుతున్న సాధ్యమైన పరిణామాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దిశాసూచక మూలరూపం పాదటిప్పణిలో ఇవ్వబడింది.
