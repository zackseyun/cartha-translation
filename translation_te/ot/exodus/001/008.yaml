source:
  edition: WLC
  text: וַ/יָּ֥קָם מֶֽלֶךְ חָדָ֖שׁ עַל מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא יָדַ֖ע אֶת יוֹסֵֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: te
  text: ఈజిప్టుపై ఒక కొత్త రాజు అధికారంలోకి వచ్చాడు[a]. అతనికి యోసేపు తెలియదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరొక రాజు’; హీబ్రూ విశేషణానికి అక్షరార్థం ‘కొత్త.’ కొందరు దీన్ని వేరే రాజవంశం లేదా పాలనా వ్యవస్థ వచ్చిందనే భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యోసేపును గుర్తించలేదు/పరిగణనలోకి తీసుకోలేదు’; ఇక్కడ ‘తెలుసు’ అనేది కేవలం అతని గురించి సమాచారం లేకపోవడమే కాక, అతన్ని లేదా అతని ప్రాముఖ్యతను గుర్తించకపోవడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: అధికారంలోకి వచ్చాడు
  rationale: קום క్రియ రాజు ఉద్భవించి పాలన చేపట్టడాన్ని సూచించే సందర్భోచిత భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; కథన పురోగతిని ప్రత్యేకంగా ‘అప్పుడు/ఇప్పుడు’ అని చేర్చకుండా వాక్యక్రమమే తెలియజేస్తుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: హీబ్రూ నామవాచకానికి నేరుగా, నిర్దిష్టంగా సరిపడే సాధారణ తెలుగు పదం.
- source_word: חָדָשׁ
  choice: కొత్త
  rationale: పదానికి ప్రాథమిక అర్థం ‘కొత్త’; వేరే వంశానికి చెందినవాడని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: עַל מִצְרָיִם
  choice: ఈజిప్టు మీద
  rationale: עַל ఇక్కడ రాజ్యంపై అధికారాన్ని సూచిస్తుంది; ‘ఈజిప్టులో’ కంటే ‘ఈజిప్టు మీద’ మూలంలోని పరిపాలనా సంబంధాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: అతనికి ... తెలియదు
  rationale: ידע యొక్క సాధారణ ‘తెలుసు’ భావాన్ని నిలుపుతూ, సమాచారం లేకపోవడమా లేక గుర్తింపు/పరిగణన లేకపోవడమా అనే సందర్భసిద్ధ సందిగ్ధతను వ్యాఖ్యానంతో పరిష్కరించదు.
- source_word: יוֹסֵף
  choice: యోసేపు
  rationale: హీబ్రూ יוֹסֵף పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ; తెలుగులో స్థిరంగా, సులభంగా గుర్తించదగిన రూపం.
theological_decisions:
- issue: ‘కొత్త రాజు’ అనేది వంశపాలనా మార్పును సూచిస్తుందా, ‘యోసేపు తెలియదు’ అనేది ఉద్దేశపూర్వక నిరాకరణను సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘కొత్త రాజు’ మరియు ‘యోసేపు తెలియదు’ అనే సరళమైన పదప్రయోగాలను ఉంచడం.
  alternative: ‘వేరే వంశానికి చెందిన రాజు’ లేదా ‘యోసేపును గుర్తించని/పరిగణించని రాజు’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వచనం కొత్త రాజు అధికారంలోకి వచ్చాడనీ, అతనికి యోసేపు తెలియదనీ మాత్రమే చెబుతుంది. వంశ మార్పు లేదా ఉద్దేశపూర్వక నిర్లక్ష్యం సాధ్యమైన వ్యాఖ్యానాలైనా, వాటిని వచనం తప్పనిసరిగా నిర్ధారించదు; అందువల్ల అసలు భావంలోని ఉద్రిక్తతను, సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అధికారంలోకి వచ్చాడు’ పరిపాలనా సందర్భాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది. మూలంలో ప్రత్యేక కాలసూచక పదం లేనందున ‘అప్పుడు/ఇప్పుడు’ చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
