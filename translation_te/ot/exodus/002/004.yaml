translation:
  language: te
  text: అతని సోదరి అతనికి ఏమి చేయబడుతుందో తెలుసుకోవడానికి దూరంగా నిలబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి ఏమి జరుగుతుందో తెలుసుకోవడానికి.’ హీబ్రూలో మరింత అక్షరార్థంగా, ‘అతనికి ఏమి చేయబడుతుందో తెలుసుకోవడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: నిలబడింది
  rationale: יצב యొక్క హిత్పయేల్ రూపం ఒక చోట నిలిచి ఉండడాన్ని సూచిస్తుంది. ‘నిలబడింది’ సహజమైన ఆధునిక తెలుగు; సందర్భానికి మించిన భావాన్ని జోడించదు.
- source_word: אֲחֹתוֹ
  choice: అతని అక్క
  rationale: ఇది అక్షరార్థంగా ‘అతని సహోదరి.’ నిర్గమకాండం 2:7లో ఆమెకు మాట్లాడగలిగే పాత్ర ఉండటం వల్ల, తెలుగు కుటుంబ వాడుకలో ‘అక్క’ సహజంగా సరిపోతుంది.
- source_word: מֵרָחֹק
  choice: దూరంగా
  rationale: ఈ పదబంధం స్థలపరమైన దూరాన్ని సూచిస్తుంది. ‘దూరంగా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לְדֵעָה
  choice: తెలుసుకోవడానికి
  rationale: ידע ధాతువు యొక్క క్రియానామ రూపం ఉద్దేశాన్ని తెలియజేస్తుంది. సందర్భంలో ఇది ఏమి సంభవిస్తుందో గమనించి తెలుసుకోవడం అనే భావం ఇస్తుంది.
- source_word: מַה
  choice: ఏమి
  rationale: తాను తెలుసుకోవాలనుకున్న విషయాన్ని పరిచయం చేసే సాధారణ ప్రశ్నార్థక సర్వనామం.
- source_word: יֵּעָשֶׂה
  choice: జరుగుతుందో
  rationale: ఇది עשה యొక్క నిఫ్అల్ అసంపూర్ణ రూపం; మరింత అక్షరార్థంగా ‘చేయబడుతుందో’ అని అనువదించవచ్చు. అయితే ఈ సందర్భంలో ‘అతనికి ఏమి జరుగుతుందో’ అనేది సహజమైన తెలుగు మరియు శిశువు గతి ఏమవుతుందనే భావాన్ని అందిస్తుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: ל ఉపసర్గ ఇక్కడ శిశువుకు ఏమి జరుగుతుందనే భావాన్ని వ్యక్తం చేస్తుంది. ‘అతనికి’ సహజమైనదిగా ఉండి, అనుకూలమైనదా ప్రతికూలమైనదా అని ముందే నిర్ణయించదు.
