source:
  edition: WLC
  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: te
  text: ఆ బిడ్డ పెరిగిన తర్వాత, ఆమె అతణ్ణి ఫరో కుమార్తె వద్దకు తీసుకొచ్చింది. అతడు ఆమెకు కుమారుడయ్యాడు.[a] ఆమె అతనికి మోషే అని పేరు పెట్టింది; ఎందుకంటే ఆమె, “నేను అతణ్ణి నీటిలోనుండి బయటికి తీశాను” అని చెప్పింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఆమెకు ఒక కుమారుడయ్యాడు” లేదా “అతడు ఆమెకు కుమారునిలా అయ్యాడు.”
    reason: lexical_alternative
  - marker: b
    text: “మోషే” అనే పేరు, “నేను అతణ్ణి బయటికి తీశాను” అనే హీబ్రూ వ్యక్తీకరణతో శబ్దసామ్యం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: పెరిగిన తర్వాత
  rationale: גדל ఇక్కడ బిడ్డ వయస్సులో ఎదగడాన్ని సూచిస్తుంది. కథనంలోని కాలక్రమాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘పెరిగిన తర్వాత’ ఎంచుకున్నాం.
- source_word: הַיֶּלֶד
  choice: ఆ బిడ్డ
  rationale: יֶלֶד అంటే బిడ్డ లేదా బాలుడు; పూర్వ సందర్భంలోని శిశుదశను అనుసరించి విస్తృతమైన ‘బిడ్డ’ను ఉంచాం.
- source_word: וַתְּבִאֵהוּ
  choice: ఆమె అతణ్ణి ... తీసుకొచ్చింది
  rationale: בוא యొక్క హిఫీల్ రూపానికి ‘తీసుకురావడం’ ప్రాథమిక అర్థం. ముందు వచన సందర్భం ప్రకారం కర్త మోషే తల్లి.
- source_word: לְבַת פַּרְעֹה
  choice: ఫరో కుమార్తె దగ్గరికి
  rationale: హీబ్రూ సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన గమ్యార్థక ప్రయోగాన్ని వాడాం.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: అతడు ఆమెకు కుమారుడయ్యాడు
  rationale: ఈ హీబ్రూ నుడికారం నిజమైన కుమార సంబంధాన్ని తెలియజేస్తుంది; అయితే అధికారిక దత్తత విధానాన్ని వచనం వివరించదు.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: ఆమె అతనికి ... అని పేరు పెట్టి
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన తెలుగు రూపంలో అందించాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరించాం.
- source_word: כִּי
  choice: అని చెప్పింది
  rationale: כִּי పేరుకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష వాక్యం తరువాత ‘అని చెప్పింది’ సహజంగా ఆ వివరణాత్మక సంబంధాన్ని మోస్తుంది.
- source_word: מִן הַמַּיִם
  choice: నీళ్లలోనుంచి
  rationale: బహువచన రూపమైన מַיִםను తెలుగులో సహజ సమూహార్థకమైన ‘నీళ్లు’గా, מןను ‘లోనుంచి’గా అందించాం.
- source_word: מְשִׁיתִהוּ
  choice: నేను అతణ్ణి ... బయటికి తీశాను
  rationale: משה అనే క్రియలోని ‘బయటికి తీయడం’ అర్థాన్ని స్పష్టంగా ఉంచి, మోషే పేరుతో ఉన్న హీబ్రూ శబ్దసామ్యాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵןలో మోషేకు ఫరో కుమార్తెతో ఏర్పడిన సంబంధ స్వభావం
  choice: అతడు ఆమెకు కుమారుడయ్యాడు
  alternative: అతడు ఆమెకు కుమారునిలా అయ్యాడు
  rationale: హీబ్రూ వాక్యం కుమార హోదాను బలంగా వ్యక్తం చేస్తుంది; ‘కుమారునిలా’ అనడం దానిని అనవసరంగా బలహీనపరచవచ్చు. అదే సమయంలో ‘దత్తత తీసుకుంది’ అని అనువదిస్తే వచనంలో లేని న్యాయపరమైన ప్రక్రియను చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా దాని భావసంబంధాలను నిలిపాం. కుమార సంబంధంలోని సంభావ్య అస్పష్టతను ప్రధాన వచనంలో బలమైన సహజ పఠనంతో, పాదటిప్పణిలో ప్రత్యామ్నాయంతో భద్రపరిచాం.
