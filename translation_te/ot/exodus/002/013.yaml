  text: וַ/יֵּצֵא֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וְ/הִנֵּ֛ה שְׁנֵֽי אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַ/יֹּ֨אמֶר֙ לָֽ/רָשָׁ֔ע לָ֥/מָּה תַכֶּ֖ה רֵעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: te
  text: అతడు మరుసటి రోజు బయటికి వెళ్లాడు. ఇదిగో, ఇద్దరు హెబ్రీయులు పోట్లాడుకుంటున్నారు. అప్పుడు అతడు తప్పు చేస్తున్నవానితో[a], “నువ్వు నీ తోటివాణ్ణి[b] ఎందుకు కొడుతున్నావు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దోషితో” లేదా “దుష్టునితో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ సహచరుణ్ణి” లేదా “నీ పొరుగువాణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: అతడు బయటికి వెళ్లాడు
  rationale: יצא అనే క్రియను దాని సాధారణ కథనార్థంలో అనువదించాం. కర్త సందర్భం వల్ల మోషే అని స్పష్టమైనా, తెలుగు వాక్య సహజత్వం కోసం ‘అతడు’ అని ఉంచాం.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: మరుసటి రోజు
  rationale: అక్షరార్థంగా ‘రెండవ రోజు’; ఇక్కడ కథన క్రమంలో ‘మరుసటి రోజు’ అనే రూపం అదే కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే అకస్మాత్తుగా కనిపించిన దృశ్యాన్ని సజీవంగా ముందుకు తెస్తుంది. ‘ఇదిగో’ ఆ కథన బలాన్ని తొలగించకుండా నిలుపుతుంది.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: ఇద్దరు హెబ్రీయులు
  rationale: ‘ఇద్దరు’ అనే మానవసూచక సంఖ్యారూపం పురుషులను సూచిస్తుంది; ‘హెబ్రీయులు’ వారి జాతిగుర్తింపును స్పష్టంగా కాపాడుతుంది. తెలుగులో ‘ఇద్దరు హెబ్రీ పురుషులు’ అనడం అనవసరంగా భారంగా ఉంటుంది.
- source_word: נִצִּים
  choice: పోట్లాడుకుంటున్నారు
  rationale: ఈ నిఫాల్ కృదంతం పరస్పర ఘర్షణను సూచిస్తుంది; తరువాత ఒకడు మరొకడిని కొడుతున్న ప్రస్తావన ఉన్నందున ‘పోట్లాడుకుంటున్నారు’ సందర్భోచితంగా ఉంది.
- source_word: לָרָשָׁע
  choice: తప్పు చేస్తున్నవానితో
  rationale: רָשָׁע పదానికి ‘దుష్టుడు,’ ‘దోషి,’ ‘తప్పు చేసేవాడు’ అనే అర్థపరిధి ఉంది. ఇక్కడ ఒక నిర్దిష్ట గొడవలో తప్పుచేస్తున్న వ్యక్తిని మోషే సంబోధిస్తున్నాడు; అతని స్థిర స్వభావంపై తీర్పు చెప్పకుండా సందర్భానుగుణ నైతిక భావాన్ని ఈ ఎంపిక కాపాడుతుంది.
- source_word: לָמָּה תַכֶּה
  choice: ఎందుకు కొడుతున్నావు?
  rationale: ప్రశ్న వేసే సమయంలో చర్య కొనసాగుతున్నదని సందర్భం సూచిస్తుంది. ఆధునిక తెలుగులో వర్తమాన కొనసాగింపు రూపం సహజంగా ఉంది.
- source_word: רֵעֶךָ
  choice: నీ తోటివాణ్ణి
  rationale: רֵעַ కు తోటి వ్యక్తి, సహచరుడు, పొరుగువాడు అనే అర్థాలు రావచ్చు. ఇక్కడ ఒక హెబ్రీయుడు తన తోటి హెబ్రీయునితో ఘర్షణపడుతున్నందున ‘తోటివాడు’ విస్తృతమైన సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: לָרָשָׁע వ్యక్తి స్వభావాన్ని సూచిస్తుందా, ఈ వివాదంలో అతని తప్పును సూచిస్తుందా?
  choice: తప్పు చేస్తున్నవాడు
  alternative: దుష్టుడు / దోషి
  rationale: సందర్భం మోషే ఎదుట జరుగుతున్న దాడిపై దృష్టి పెడుతుంది. మూలపదంలోని నైతిక ప్రతికూలతను నిలుపుతూ, వ్యక్తి మొత్తం స్వభావాన్ని ఖరారు చేసేలా అనువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదం మూలంలోని దృశ్యాత్మక ఉద్ఘాటనను నిలుపుతుంది; మిగిలిన వాక్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సరళంగా ఉంది.
