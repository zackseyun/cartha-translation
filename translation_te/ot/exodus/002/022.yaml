- from: ఆమె ఒక కుమారుణ్ణి కనింది. అతడు అతనికి గేర్షోము[a] అని పేరు పెట్టాడు. ఎందుకంటే అతడు, “నేను పరాయి దేశంలో పరదేశిగా ఉన్నాను” అన్నాడు[b].
  to: ఆమె ఒక కుమారుణ్ణి కనింది. అతడు తన కుమారునికి గెర్షోము[a] అని పేరు పెట్టాడు. ఎందుకంటే అతడు, “నేను పరాయి దేశంలో పరదేశిగా ఉన్నాను” అన్నాడు[b].
  rationale: The revision corrects the conventional Telugu rendering of the personal name and removes an avoidable pronoun ambiguity. The wording of Moses’s statement and its alternative remain unchanged in sense, retaining the Hebrew perfect’s possible continuing or past-oriented force. Footnote anchors remain correctly attached to the name and to the explanatory statement.
