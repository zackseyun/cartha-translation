translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. హీబ్రూ పేరులోని పదచమత్కారాన్ని ప్రధాన వాక్యంలో కృత్రిమంగా పునఃసృష్టించకుండా పాదసూచికలో వివరించాం; הָיִיתִי లోని కాలార్థ అస్పష్టతను కూడా నిలిపాం.
