  edition: WLC
  text: וַ/תֵּ֣לֶד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ גֵּרְשֹׁ֑ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: te
  text: ఆమె ఒక కుమారుణ్ణి కనింది. అతడు తన కుమారునికి గెర్షోము[a] అని పేరు పెట్టాడు. ఎందుకంటే అతడు, “నేను పరాయి దేశంలో పరదేశిగా ఉన్నాను” అన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గెర్షోము” అనే పేరు హీబ్రూలో “అక్కడ పరదేశి” అనే మాటలా వినిపిస్తుంది; మోషే ఆ పేరు పెట్టడానికి చెప్పిన కారణంతో ఇది ముడిపడి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను పరాయి దేశంలో పరదేశిగా ఉండేవాణ్ణి.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: ఆమె ఒక కుమారుణ్ణి కనింది
  rationale: ילד అనే క్రియ ఇక్కడ ప్రసవించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కుమారుణ్ణి కనింది’ సహజంగా ఉండి, בֵּן లోని కుమారుడు అనే అర్థాన్ని నిలుపుతుంది.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: అతడు అతనికి ... అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని పదశః కాకుండా సహజమైన ఆధునిక తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చి, పేరుకు సంబంధించిన పదచమత్కారాన్ని పాదసూచికలో తెలిపాం.
- source_word: כִּי אָמַר
  choice: ఎందుకంటే అతడు ... అన్నాడు
  rationale: כִּי ఇక్కడ పేరుకు కారణాన్ని వివరిస్తుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֵּר
  choice: పరదేశిగా
  rationale: גֵּר అనేది తన స్వదేశం కాని చోట నివసించే వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, తాత్కాలిక ప్రయాణికుడు అనే భావానికే పరిమితం కాదు.
- source_word: הָיִיתִי
  choice: ఉన్నాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియ గతంలో మొదలై నామకరణ సమయం వరకు వర్తించే స్థితిని సూచించగలదు. ‘ఉన్నాను’ ఆ కొనసాగుతున్న అనుభవాన్ని సహజంగా వ్యక్తపరుస్తుంది; కేవలం గతకాల భావం కూడా సాధ్యమేనని పాదసూచికలో ఉంచాం.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: పరాయి దేశంలో
  rationale: נָכְרִיָּה లోని ‘తనది కాని/విదేశీయమైన’ భావాన్ని ‘పరాయి దేశం’ స్పష్టంగా, సహజంగా అందిస్తుంది.
