id: EXO.2.18
reference: Exodus 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּבֹ֕אנָה אֶל רְעוּאֵ֖ל אֲבִי/הֶ֑ן וַ/יֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: te
  text: వారు తమ తండ్రి రెయూయేలు దగ్గరికి వచ్చినప్పుడు, అతడు, “ఈ రోజు మీరు ఇంత త్వరగా ఎందుకు వచ్చారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: వారు ... వచ్చినప్పుడు
  rationale: בוא అనే క్రియ యొక్క మూడవ పురుష స్త్రీలింగ బహువచన కథనరూపం. కుమార్తెలను సూచిస్తూ, వాక్యంలోని తదుపరి మాటతో సహజమైన కాలసంబంధాన్ని తెలుగులో చూపుతుంది.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: వ్యక్తి వద్దకు చేరడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే దిశార్థక రూపం.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: హీబ్రూ పేరులోని ధ్వనులకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: אֲבִיהֶן
  choice: తమ తండ్రి
  rationale: హీబ్రూ పదం ప్రత్యక్షంగా ‘వారి తండ్రి’ అని అర్థమిస్తుంది; తెలుగు వాక్యంలోని కర్తతో సంబంధాన్ని సహజంగా చూపడానికి ‘తమ’ వాడబడింది.
- source_word: וַיֹּאמֶר
  choice: అతడు ... అని అడిగాడు
  rationale: אמר సాధారణంగా ‘అన్నాడు’ అయినా, ఇక్కడ ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తుంది; తెలుగులో ‘అని అడిగాడు’ సందర్భానుకూలంగా సహజం.
- source_word: מַדּוּעַ
  choice: ఎలా
  rationale: పదశః ‘ఎందుకు’; అయితే త్వరగా రావడానికి కారణాన్ని ఆశ్చర్యంతో ప్రశ్నించే తెలుగు ప్రయోగంలో ‘ఎలా’ సహజంగా అదే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: מִהַרְתֶּן
  choice: ఇంత త్వరగా
  rationale: מהר యొక్క పియేల్ సంపూర్ణరూపం వేగపడటం లేదా త్వరపడటాన్ని సూచిస్తుంది; అనుబంధమైన בֹּאతో కలిసి సహజ తెలుగులో ‘ఇంత త్వరగా ... వచ్చారు’గా వ్యక్తమవుతుంది.
- source_word: בֹּא
  choice: వచ్చారు
  rationale: ‘రావడం’ అనే క్రియార్థాన్ని కాపాడుతుంది. తండ్రి ఉన్న చోటుకు తిరిగి రావడం సందర్భం ద్వారా స్పష్టమవుతుంది కాబట్టి ‘తిరిగి’ని తప్పనిసరిగా చేర్చలేదు.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: నిర్దిష్ట ‘ఆ రోజు’ అనే రూపం ఇక్కడ కాలసూచకంగా ‘ఈ రోజు’ అనే అర్థంలో వాడబడింది.
