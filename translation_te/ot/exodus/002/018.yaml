translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ ‘త్వరపడి రావడం’ అనే నిర్మాణాన్ని అతిగా పదశః చేయకుండా ‘ఇంత త్వరగా ... వచ్చారు’గా ఇచ్చాం. ఈ చిన్న వాక్యంలో ప్రచురణకు అవసరమైన పాఠాంతర లేదా వేదాంత గమనిక లేదు.
