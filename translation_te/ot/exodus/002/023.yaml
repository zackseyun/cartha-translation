- from: ఆ సుదీర్ఘ కాలంలో ఈజిప్టు రాజు చనిపోయాడు.[a] ఇశ్రాయేలు కుమారులు వెట్టిచాకిరి వల్ల మూలుగుతూ మొరపెట్టుకున్నారు.[b][c] వెట్టిచాకిరి వల్ల వారు చేసిన సహాయపు మొర దేవుని దగ్గరికి చేరింది.
