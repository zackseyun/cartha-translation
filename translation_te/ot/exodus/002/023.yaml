  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: te
  text: ఆ సుదీర్ఘ కాలంలో[a] ఈజిప్టు రాజు చనిపోయాడు. ఇశ్రాయేలు కుమారులు[b] వెట్టిచాకిరి వల్ల[c] మూలిగారు, మొరపెట్టుకున్నారు. వెట్టిచాకిరి వల్ల సహాయం కోసం వారు చేసిన మొర దేవుని వద్దకు చేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ అనేక రోజులలో”; భావానువాదంగా, “చాలా కాలం గడిచిన తర్వాత.”
    reason: lexical_alternative
  - marker: b
    text: “ఇశ్రాయేలు కుమారులు” అనేది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “బలవంతపు పని వల్ల,” “దాస్యం వల్ల.” ఇక్కడి హీబ్రూ పదం అణచివేతతో కూడిన బలవంతపు శ్రమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: జరిగింది అనే భావాన్ని ప్రత్యేకంగా పదబద్ధం చేయకుండా తెలుగు కథన నిర్మాణంలో తెలిపింది
  rationale: హీబ్రూ కథనాన్ని ముందుకు నడిపే రూపం; తెలుగులో ‘జరిగిందేమంటే’ అని చేర్చడం భారంగా ఉంటుంది. కాలవాచక పదబంధంతో నేరుగా వాక్యాన్ని ప్రారంభించడం సహజం.
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: ఆ సుదీర్ఘ కాలంలో
  rationale: అక్షరార్థంలోని ‘ఆ అనేక దినాల్లో’ అనే భావాన్ని, ఖచ్చితమైన ఒక సమయబిందువుగా మార్చకుండా, సహజమైన ఆధునిక తెలుగులో దీర్ఘకాలంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజు చనిపోయాడు
  rationale: మూలంలోని సూటి కథన ప్రకటనను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: וַיֵּאָנְחוּ
  choice: మూలుగుతూ
  rationale: పీడవల్ల వెలువడే వినిపించే వేదనను సూచిస్తుంది; ‘నిట్టూర్చారు’ కంటే సందర్భంలోని తీవ్రతను మెరుగ్గా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదరూపాన్ని పారదర్శకంగా నిలుపుతూ, ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచించే సాంప్రదాయ జాతినామమని పాదసూచికలో వివరిస్తుంది.
- source_word: מִן הָעֲבֹדָה
  choice: వెట్టిచాకిరి వల్ల
  rationale: ఈ సందర్భంలో עֲבֹדָה సాధారణ పని కాదు; బలవంతంగా చేయించిన అణచివేత పని. ‘వెట్టిచాకిరి’ ఆ సామాజిక వాస్తవాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּזְעָקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: తీవ్ర వేదనలో చేసిన కేకను సహజమైన తెలుగులో తెలియజేస్తూ, మూలంలాగే ఎవరికి మొరపెట్టుకున్నారో ఈ ఉపవాక్యంలో ప్రత్యేకంగా చెప్పదు.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: వారు చేసిన సహాయపు మొర ... చేరింది
  rationale: שַׁוְעָה సహాయం కోరే మొర. తెలుగులో ‘పైకి వెళ్లింది’ అనే రూపకం అసహజంగా వినిపించే అవకాశం ఉన్నందున ‘దగ్గరికి చేరింది’ ద్వారా దిశా భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవుని దగ్గరికి
  rationale: మూలంలోని ‘దేవుని వైపు/దగ్గరికి’ అనే గమ్యార్థాన్ని ఎటువంటి విస్తరణ లేకుండా అందిస్తుంది.
- source_word: מִן הָעֲבֹדָה (second occurrence)
  choice: వెట్టిచాకిరి వల్ల
  rationale: మూలంలోని పునరుక్తిని అలాగే ఉంచి, వారి మూలుగుకూ మొరకూ కారణమైన అణచివేతను నొక్కిచెబుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు అణచివేత సందర్భంలో עֲבֹדָה అనువాదం
  choice: వెట్టిచాకిరి
  alternative: పని / శ్రమ / దాస్యం
  rationale: సందర్భం బలవంతపు, అణచివేత శ్రమను సూచిస్తుంది. ‘వెట్టిచాకిరి’ సాధారణ శ్రమగా మృదువుపరచకుండా బలవంతపు పనిని తెలుపుతుంది; ఇది సిద్ధాంత విస్తరణ కాదు, సందర్భానుగుణ పదనిర్ణయం.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలుపుతుంది; అదే సమయంలో అది సమష్టిగా ప్రజలందరినీ సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: మొర దేవుని దగ్గరికి వెళ్లిన రూపకం
  choice: దేవుని దగ్గరికి చేరింది
  alternative: దేవుని దగ్గరికి పైకి వెళ్లింది
  rationale: దైవ స్పందనను ఈ వచనంలో ముందుగానే ప్రకటించకుండా, మొర దేవుని వైపు చేరినదనే మూల భావాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. హీబ్రూ పునరుక్తిని నిలిపి, అసహజమైన హీబ్రూ వాక్యనిర్మాణాన్ని తెలుగుపై రుద్దలేదు. పాదసూచిక గుర్తులు అన్నీ ప్రధాన పాఠ్యంలో ఉన్నాయి.
