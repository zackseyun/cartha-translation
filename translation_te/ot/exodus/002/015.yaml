  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూలోని వరుస వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా ఉండేందుకు రెండు వాక్యాలుగా విభజించాం; అయితే చర్యల క్రమం, రెండు సార్లు వచ్చిన ישׁב క్రియలోని భావభేదం నిలుపబడ్డాయి.
