  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: te
  text: ఫరో ఈ విషయం విన్నప్పుడు[a], మోషేను చంపాలని చూశాడు. అయితే మోషే ఫరో నుండి పారిపోయి మిద్యాను దేశంలో నివసించాడు[b]. అతడు ఆ బావి దగ్గర కూర్చున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సంగతి విన్నప్పుడు’ లేదా ‘ఈ సంఘటన గురించి తెలుసుకున్నప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ఒకే క్రియ రెండుసార్లు వచ్చింది. మొదటిది మిద్యాను దేశంలో నివసించడాన్ని, రెండవది బావి దగ్గర కూర్చోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నప్పుడు
  rationale: שׁמע యొక్క ప్రాథమిక అర్థమైన ‘విను’ను సహజమైన తెలుగు సందర్భంలో నిలుపుతుంది; ఇక్కడ జరిగిన విషయం ఫరోకు తెలిసిందనే భావమూ సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דבר ఇక్కడ మోషే ఐగుప్తీయుణ్ణి చంపిన సంఘటనను సూచిస్తుంది. ‘ఈ విషయం’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని విస్తృత అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: చంపడానికి ప్రయత్నించాడు
  rationale: בקשׁ + క్రియావాచకం ఉద్దేశంతో చేయబోయే ప్రయత్నాన్ని సూచించగలదు. ‘ప్రయత్నించాడు’ సాధారణ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: ఎదుటి నుండి పారిపోయి
  rationale: מִפְּנֵי లోని ‘సన్నిధి/ఎదుటి నుండి’ అనే రూపకాన్ని సహజమైన తెలుగులో కొంతవరకు నిలుపుతుంది; భావం ఫరో నుండి తప్పించుకొని పారిపోవడం.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: మిద్యాను దేశంలో నివసించాడు
  rationale: మొదటి ישׁב ఇక్కడ కూర్చోవడాన్ని కాక, ఒక ప్రాంతంలో ఉండటం లేదా నివసించటాన్ని సూచిస్తుంది. ‘నివసించాడు’ శాశ్వత స్థిరనివాసాన్ని అనవసరంగా బలపరచకుండా సందర్భానుగుణంగా ఉంటుంది.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: ఒక బావి దగ్గర కూర్చున్నాడు
  rationale: రెండవ ישׁב దాని ప్రత్యక్ష అర్థమైన ‘కూర్చున్నాడు’ను కలిగి ఉంది. עַל ఇక్కడ స్థాన సంబంధంగా ‘దగ్గర’ అని సహజంగా అనువదించబడింది.
- source_word: הַבְּאֵר
  choice: ఒక బావి
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఈ కథనంలో బావి మొదటిసారి పరిచయమవుతున్నందున తెలుగులో ‘ఒక బావి’ సహజమైన కథన రూపం; నిర్దిష్టతను అక్షరార్థంగా చూపితే తెలుగులో ముందే తెలిసిన బావి అన్న అనవసర సూచన కలగవచ్చు.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: రాజబిరుదుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో విస్తృతంగా వాడే లిప్యంతరీకరణ.
- source_word: מִדְיָן
  choice: మిద్యాను
  rationale: స్థలనామానికి తెలుగులో సుపరిచితమైన బైబిలు లిప్యంతరీకరణ.
