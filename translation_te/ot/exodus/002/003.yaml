source:
  edition: WLC
  text: וְ/לֹא יָכְלָ֣ה עוֹד֮ הַצְּפִינ/וֹ֒ וַ/תִּֽקַּֽח ל/וֹ֙ תֵּ֣בַת גֹּ֔מֶא וַ/תַּחְמְרָ֥/ה בַ/חֵמָ֖ר וּ/בַ/זָּ֑פֶת וַ/תָּ֤שֶׂם בָּ/הּ֙ אֶת הַ/יֶּ֔לֶד וַ/תָּ֥שֶׂם בַּ/סּ֖וּף עַל שְׂפַ֥ת הַ/יְאֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: te
  text: కాని ఇక అతణ్ణి దాచలేకపోయినప్పుడు, ఆమె అతని కోసం జమ్ముతో చేసిన ఒక పెట్టెను[a] తీసుకొని, దానికి తారు, కీలము పూసింది. ఆ తరువాత బాలుణ్ణి అందులో ఉంచి, దానిని నైలు నది ఒడ్డున రెల్లుల మధ్య ఉంచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జమ్ముతో చేసిన ఒక ఓడ.’ ఇక్కడున్న హీబ్రూ పదం తేవా; ఆదికాండంలో నోవహు ఓడకు కూడా ఇదే పదం వాడబడింది. అందువల్ల నీటి మధ్యగా కలిగే రక్షణకు సంబంధించిన సాహిత్య ప్రతిధ్వని ఇక్కడ వినిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: అతణ్ణి దాచలేకపోయినప్పుడు
  rationale: హిఫీల్ రూపం ‘అతణ్ణి దాచడం’ అనే క్రియను సూచిస్తుంది; לֹא יָכְלָה עוֹדతో కలిపి ‘ఇక ... దాచలేకపోయినప్పుడు’ సహజమైన తెలుగు.
- source_word: תֵּבַת
  choice: పెట్టె
  rationale: תֵּבָה ఒక మూసిన పాత్ర లేదా పెట్టెను సూచిస్తుంది; ఇక్కడ చిన్న నీటివాహక పాత్ర. ‘పెట్టె’ మూలపద పరిధిని, నోవహు సందర్భంతో ఉన్న సాహిత్య ప్రతిధ్వనిని ‘బుట్ట’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: גֹּמֶא
  choice: జమ్ము
  rationale: ఈ పదం సాధారణ రెల్లును కాక పాపైరస్ మొక్కను సూచిస్తుంది. ఆధునిక తెలుగులో అర్థమయ్యే స్థానిక వృక్షపదంగా ‘జమ్ము’ ఎంచుకోబడింది.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: తారు ... పూసింది
  rationale: క్రియ పూయడం లేదా కప్పడం; חֵמָר బిటుమెన్/అస్ఫాల్ట్ పదార్థం. ‘తారు పూసింది’ సాధారణ పాఠకునికి సహజంగా జలనిరోధక చర్యను తెలియజేస్తుంది.
- source_word: וּבַזָּפֶת
  choice: కీలము
  rationale: זֶפֶת పిచ్ లేదా జిగురు జలనిరోధక పదార్థం. חֵמָרతో ఉన్న రెండు వేర్వేరు పదాలను కలిపివేయకుండా ‘కీలము’తో భేదం నిలుపబడింది.
- source_word: הַיֶּלֶד
  choice: బాలుణ్ణి
  rationale: יֶלֶד అంటే బాలుడు/పిల్లవాడు; సందర్భంలో పసిబిడ్డ అయినా మూలపదం వయస్సును అంత నిర్దిష్టంగా చెప్పదు. ‘బాలుడు’ లింగాన్ని కూడా నిలుపుతుంది.
- source_word: בַּסּוּף
  choice: రెల్లుల మధ్య
  rationale: סוּף నది అంచున పెరిగే రెల్లు లేదా జమ్ము వంటి వృక్షసమూహాన్ని సూచిస్తుంది; ‘మధ్య’ అనే రూపం వాటిలో ఉంచిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: నైలు నది ఒడ్డున
  rationale: నిర్గమకాండపు ఐగుప్తు సందర్భంలో יְאֹר నైలు నదిని సూచిస్తుంది; שְׂפַת అక్షరార్థంగా ‘అంచు/ఒడ్డు’.
- source_word: לֹא יָכְלָה עוֹד
  choice: ఇక ... లేకపోయినప్పుడు
  rationale: కొనసాగుతున్న చర్య సాధ్యంకాని పరిమితికి చేరిందనే భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לּוֹ
  choice: అతని కోసం
  rationale: హీబ్రూ దత్తివ సర్వనామాన్ని స్పష్టంగా నిలిపి, ఆ పెట్టె బాలుని కోసమే సిద్ధం చేయబడిందని తెలియజేస్తుంది.
theological_decisions:
- issue: תֵּבָה ద్వారా నోవహు ఓడతో సాహిత్య సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘పెట్టె’; పాదటీకలో ‘ఓడ’ అనే ప్రత్యామ్నాయం
  alternative: బుట్ట
  rationale: ‘పెట్టె’ తక్షణ సందర్భంలో పాత్ర స్వరూపాన్ని సహజంగా తెలియజేస్తూ, ఆదికాండంలో ఇదే అరుదైన హీబ్రూ పదం నోవహు ఓడకు వాడబడిన ప్రతిధ్వనిని పూర్తిగా చెరపదు; ‘ఓడ’ను ప్రధాన పాఠ్యంలో ఉంచితే శిశువుకు అనుచితంగా పెద్ద నౌక భావం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. అరుదైన సాంకేతిక పదాలను తగ్గించినా, హీబ్రూలోని రెండు జలనిరోధక పదార్థాల భేదం ‘తారు, కీలము’గా నిలుపబడింది. ప్రతి పాదటీక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
