  naturalness: ‘జమ్ముతో చేసిన పెట్టెను తీసుకొని’ మరియు ‘దానిని ... ఉంచింది’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉన్నాయి. ‘బాలుణ్ణి’కి బదులుగా ‘బిడ్డను’ సందర్భానుకూలంగా సహజమైనప్పటికీ, మూలంలోని సాధారణ ‘పిల్లవాడు/బాలుడు’ భావాన్ని నిలుపుటకు ‘బాలుణ్ణి’ ఉంచబడింది.
