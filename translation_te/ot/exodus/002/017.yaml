id: EXO.2.17
reference: Exodus 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/רֹעִ֖ים וַ/יְגָרְשׁ֑וּ/ם וַ/יָּ֤קָם מֹשֶׁה֙ וַ/יּ֣וֹשִׁעָ֔/ן וַ/יַּ֖שְׁקְ אֶת צֹאנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: te
  text: అప్పుడు కాపరులు వచ్చి వారిని తరిమివేశారు. అయితే మోషే లేచి వారిని కాపాడి[a], వారి మందకు నీళ్లు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని విడిపించి.”
    reason: ישע అనే హెబ్రీ క్రియ కాపాడడం లేదా విడిపించడం అనే రెండు సమీప భావాలను వ్యక్తం చేయగలదు; ఇక్కడ కాపరుల వేధింపునుంచి ఆ స్త్రీలను రక్షించడం ఉద్దేశం.
lexical_decisions:
- source_word: הָרֹעִים
  choice: కాపరులు
  rationale: רעה అనే ధాతువు నుంచి వచ్చిన ఈ రూపం మందలను మేపేవారిని సూచిస్తుంది. సందర్భానికి సహజమైన ఆధునిక తెలుగు పదం ‘కాపరులు’.
- source_word: וַיְגָרְשׁוּם
  choice: వారిని తరిమివేశారు
  rationale: גרש బలవంతంగా తరిమివేయడం లేదా వెళ్లగొట్టడం అనే భావాన్ని ఇస్తుంది. స్త్రీలను కాపరులు వేధించి అక్కడి నుంచి పంపివేసిన ప్రతికూల చర్యను ఈ ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום ఇక్కడ మోషే నిర్ణయాత్మకంగా స్పందించి చర్యకు దిగడాన్ని సూచిస్తుంది. ‘లేచి’ సహజంగా ఉండి మూలంలోని కథన క్రమాన్ని నిలుపుతుంది.
- source_word: וַיּוֹשִׁעָן
  choice: వారిని కాపాడి
  rationale: ישע హిఫీల్ రూపానికి కాపాడడం లేదా విడిపించడం అనే బలమైన అర్థం ఉంది. కేవలం ‘సహాయం చేశాడు’ అని బలహీనపరచకుండా, ఈ సందర్భంలోని రక్షణ చర్యను ‘కాపాడి’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּשְׁקְ
  choice: నీళ్లు పెట్టాడు
  rationale: שקה జంతువులకు నీరు తాగించడం లేదా నీరు పెట్టడం అని అర్థం. పశువుల సందర్భంలో ‘నీళ్లు పెట్టాడు’ సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: צֹאנָם
  choice: వారి మందకు
  rationale: צאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించే సమూహవాచకం. ‘మంద’ జాతిని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ సమూహ భావాన్ని నిలుపుతుంది.
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు ... వచ్చి
  rationale: ఈ వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను ముందుకు తీసుకెళ్తుంది. ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: וַיּוֹשִׁעָן లోని రక్షణ భావం
  choice: కాపాడి
  alternative: సహాయం చేసి
  rationale: హిఫీల్ రూపంలోని రక్షించడం లేదా విడిపించడం అనే బలమైన భావాన్ని నిలుపుతూ, ప్రాణాపాయం తప్పనిసరిగా ఉందని అదనంగా సూచించకుండా ‘కాపాడి’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వరుస హెబ్రీ కథన క్రియలను తెలుగులో సహజంగా కలిపినా, సంఘటనల క్రమం మరియు మోషే చేసిన నిర్ణయాత్మక రక్షణ చర్య నిలుపబడ్డాయి.
