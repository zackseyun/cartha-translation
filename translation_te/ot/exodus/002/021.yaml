source:
  edition: WLC
  text: וַ/יּ֥וֹאֶל מֹשֶׁ֖ה לָ/שֶׁ֣בֶת אֶת הָ/אִ֑ישׁ וַ/יִּתֵּ֛ן אֶת צִפֹּרָ֥ה בִתּ֖/וֹ לְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: te
  text: మోషే ఆ మనిషితో నివసించడానికి సమ్మతించాడు[a]. ఆ మనిషి తన కుమార్తె సిప్పోరాను మోషేకు ఇచ్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోషే ఆ మనిషితో నివసించడానికి ఇష్టపడ్డాడు.’ హీబ్రూ క్రియ ఇష్టపడడం, సమ్మతించడం లేదా సంతృప్తిగా ఉండడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ మనిషి సిప్పోరాను మోషేకు వివాహం చేసి ఇచ్చాడు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: సమ్మతించాడు
  rationale: ఈ రూపంలోని יאל ఇక్కడ ఇష్టపడడం లేదా అంగీకరించడం అనే భావాన్ని తెలియజేస్తుంది. ‘సమ్మతించాడు’ అనే పదం తరువాతి క్రియార్థక నిర్మాణంతో సహజంగా సరిపోతూ, మూలంలోని సమ్మతి భావాన్ని నిలుపుతుంది.
- source_word: לָשֶׁבֶת
  choice: నివసించడానికి
  rationale: ישב యొక్క ప్రాథమిక అర్థం ‘కూర్చోవడం’ అయినా, ఈ సందర్భంలో ఇది ఒకరి దగ్గర ఉండడం లేదా నివాసం ఏర్పరచుకోవడాన్ని సూచిస్తుంది. ‘నివసించడానికి’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషితో
  rationale: మూలంలో సాధారణ నామవాచకమైన ‘మనిషి’ ఉంది; సందర్భంలో ఇది మిద్యాను యాజకుణ్ణి సూచిస్తుంది. ఈ వచనంలో లేని వ్యక్తినామాన్ని చేర్చకుండా మూల వ్యక్తీకరణను నిలుపుతున్నాం. אֶת ఇక్కడ సహవాసాన్ని సూచిస్తున్నందున తెలుగులో ‘తో’ వాడాం.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן నేరుగా ‘ఇచ్చాడు’ అని అర్థం. సందర్భం వివాహాన్ని సూచించినా, ప్రధాన పాఠ్యంలో మూలంలోని సరళమైన క్రియనే ఉంచి, వివాహార్థాన్ని పాదసూచికలో స్పష్టం చేస్తున్నాం.
- source_word: צִפֹּרָה
  choice: సిప్పోరా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా అందించాం.
- source_word: בִתּוֹ
  choice: తన కుమార్తె
  rationale: ప్రత్యయం ఇచ్చిన వ్యక్తినే సూచిస్తుంది. తెలుగు వాక్యంలో కర్తకు తిరిగి సూచనగా ‘తన కుమార్తె’ సహజంగా ఉంటుంది.
- source_word: לְמֹשֶׁה
  choice: మోషేకు
  rationale: לְ స్వీకర్తను సూచిస్తుంది. వివాహ సంబంధం సందర్భంలో అంతర్లీనంగా ఉన్నా, మూలానికి దగ్గరగా ‘మోషేకు’ అని ఉంచాం.
