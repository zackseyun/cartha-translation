translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని రెండు సమన్విత ఉపవాక్యాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం. ‘ఆ మనిషి’ అనే పునరుక్తి సర్వనామ సందిగ్ధతను నివారిస్తుంది; మూలంలో లేని రగూయేలు/యిత్రో అనే పేరును చేర్చలేదు.
