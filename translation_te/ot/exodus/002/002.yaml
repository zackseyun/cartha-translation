id: EXO.2.2
reference: Exodus 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: te
  text: ఆ స్త్రీ గర్భవతియై ఒక కుమారుణ్ణి కన్నది. అతడు మంచివాడని[a] ఆమె చూసినప్పుడు, మూడు నెలలపాటు అతణ్ణి దాచిపెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందమైనవాడని’ లేదా ‘చూడముచ్చటైనవాడని.’ హీబ్రూలో ‘మంచి’ అని ఉంది; సందర్భంలో అది చూడటానికి ఇంపైన లేదా చక్కనైన అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: గర్భవతియై
  rationale: హీబ్రూ క్రియ గర్భం ధరించడాన్ని సూచిస్తుంది. ‘గర్భవతియై’ అనేది సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలపాఠంలో స్పష్టంగా ‘ఆ స్త్రీ’ అనే ఉంది; సందర్భం ఆధారంగా ‘అతని భార్య’ అని మార్చకుండా మూలంలోని పదప్రయోగాన్ని నిలిపింది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఒక కుమారుణ్ణి కన్నది
  rationale: ఇది ప్రసవాన్ని తెలిపే సాధారణ హీబ్రూ నుడికారం. ‘కుమారుణ్ణి కన్నది’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: అతడు మంచివాడని ఆమె చూసినప్పుడు
  rationale: వస్తువు మరియు כי ఉపవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, కథన ప్రవాహాన్ని ‘చూసినప్పుడు’తో తెలిపింది.
- source_word: טוֹב
  choice: మంచివాడు
  rationale: ఈ పదపు ప్రాథమిక అర్థమైన ‘మంచి’ని నిలిపి, ఆదికాండం 1లోని భాషతో ఉండవచ్చిన సాహిత్య ప్రతిధ్వనిని కాపాడుతుంది. రూపసౌందర్యాన్ని సూచించే అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַתִּצְפְּנֵהוּ
  choice: అతణ్ణి దాచిపెట్టింది
  rationale: צפן అంటే దాచడం లేదా మరుగుపరచడం. ‘దాచిపెట్టింది’ ఈ కథన సందర్భంలో సహజంగా, ఉద్దేశపూర్వక రహస్య పరిరక్షణను తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: మూడు నెలలపాటు
  rationale: יֶרַח నెలను, మూలంగా చాంద్రమాసాన్ని సూచించవచ్చు. సాధారణ కథన తెలుగులో ‘మూడు నెలలపాటు’ అర్థాన్ని ఖచ్చితంగా అందిస్తుంది.
theological_decisions:
- issue: శిశువును טוֹב అని వర్ణించడం
  choice: మంచివాడు
  alternative: అందమైనవాడు; చూడముచ్చటైనవాడు
  rationale: హీబ్రూ విశేషణపు సాధారణ అర్థం ‘మంచి.’ దీనిని ప్రధాన పాఠంలో ఉంచడం మూలంలోని విస్తృతార్థాన్ని, ఆదికాండపు భాషతో ఉండవచ్చిన సంబంధాన్ని కాపాడుతుంది. సౌందర్యార్థం సాధ్యమే గనుక దానిని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఆ స్త్రీ’ అని మూలంలోని నిర్దిష్ట పదప్రయోగాన్ని నిలిపింది. ప్రధాన పాఠంలో ‘మంచివాడు’ ఉంచి, సౌందర్యార్థాన్ని పాదసూచిక ద్వారా సంరక్షించింది.
