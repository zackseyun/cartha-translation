source:
  edition: WLC
  text: וּ/לְ/כֹהֵ֥ן מִדְיָ֖ן שֶׁ֣בַע בָּנ֑וֹת וַ/תָּבֹ֣אנָה וַ/תִּדְלֶ֗נָה וַ/תְּמַלֶּ֨אנָה֙ אֶת הָ֣/רְהָטִ֔ים לְ/הַשְׁק֖וֹת צֹ֥אן אֲבִי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: te
  text: మిద్యానుకు చెందిన యాజకునికి ఏడుగురు కుమార్తెలు ఉన్నారు.[a] వారు వచ్చి నీళ్లు తోడి,[b] తమ తండ్రి మందకు నీళ్లు పెట్టడానికి తొట్లను నింపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిద్యానులోని ఒక యాజకునికి.” హీబ్రూ పదబంధం ఒక నిర్దిష్ట యాజకుణ్ణి గానీ, మిద్యానుతో సంబంధమున్న యాజకులలో ఒకరిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నీళ్లు తోడి” అనే క్రియ బావి వంటి నీటి మూలం నుండి నీటిని పైకి తీసుకోవడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: మిద్యాను యాజకునికి
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య వాక్యంగా మార్చి, כֹהֵן‌ను ‘యాజకుడు’గా అనువదించాం. ఆరంభ וּ కథన సంబంధాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: שֶׁבַע בָּנוֹת
  choice: ఏడుగురు కుమార్తెలు ఉన్నారు
  rationale: ‘యాజకునికి ఏడుగురు కుమార్తెలు’ అనే తెలుగు నిర్మాణం హీబ్రూ స్వామ్యార్థక నామవాక్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתָּבֹאנָה
  choice: వారు వచ్చి
  rationale: స్త్రీల బహువచన కర్తను తెలుగులో స్పష్టంగా చూపుతూ, వరుస కథన క్రియలను సహజంగా అనుసంధానిస్తుంది.
- source_word: וַתִּדְלֶנָה
  choice: బావిలోనుండి నీళ్లు తోడి
  rationale: דלה అంటే బావి వంటి నీటి మూలం నుండి నీటిని పైకి తోడడం. మూలంలో కర్మ, నీటి మూలం సందర్భసిద్ధంగా ఉన్నందున తెలుగులో స్పష్టం చేశాం.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: తొట్లను నింపారు
  rationale: רְהָטִים పశువులకు నీళ్లు పెట్టే తొట్లు లేదా నీటి కాలువలను సూచించగలదు; ఈ సందర్భంలో ‘తొట్లు’ స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: לְהַשְׁקוֹת צֹאן אֲבִיהֶן
  choice: తమ తండ్రి మందకు నీళ్లు పెట్టడానికి
  rationale: שקה హిఫీల్ రూపం ‘తాగించు/నీళ్లు పెట్టు’ అనే కారణార్థాన్ని ఇస్తుంది. צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహం; ‘మంద’ దాని విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: మిద్యాను యాజకుని నిర్దిష్టత
  choice: మిద్యాను యాజకుడు
  alternative: మిద్యానులోని ఒక యాజకుడు
  rationale: హీబ్రూ לְכֹהֵן מִדְיָן సందర్భంలో ఒక నిర్దిష్ట యాజకుని పరిచయం చేయవచ్చు లేదా మిద్యానుతో సంబంధమున్న ఒక యాజకుని సూచించవచ్చు. ప్రధాన పాఠ్యంలో సంక్షిప్త సహజ రూపాన్ని ఉంచి, నిజమైన అనిశ్చితిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘యాజకుడు,’ ‘మంద,’ ‘తొట్లు’ వంటి సామాన్యులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం; మూలంలో లేని ‘ఇప్పుడు/అప్పుడు’ వంటి కాలసూచక discourse పదాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
