id: EXO.2.11
reference: Exodus 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: te
  text: 'ఆ రోజుల్లో ఇలా జరిగింది: మోషే పెద్దవాడైన తరువాత, తన సహోదరుల[a] దగ్గరికి వెళ్లి వారి భారాలను చూశాడు. ఒక ఐగుప్తీయుడు తన సహోదరుల్లో ఒకడైన హెబ్రీయుణ్ణి కొడుతున్నాడని అతడు చూశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బంధువులు,” “తన ప్రజలు.” ఈ వచనంలో “సహోదరులు,” “తన సహోదరుల్లో ఒకడు” అనే కుటుంబ సంబంధ పదాలు హెబ్రీయులతో మోషేకు ఉన్న ఐక్యతను వ్యక్తం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో ఇలా జరిగింది
  rationale: హీబ్రూ కథన సంధి సూత్రాన్ని పాతకాలపు తెలుగు ప్రయోగం లేకుండా సహజంగా నిలుపుతుంది.
- source_word: וַיִּגְדַּל
  choice: పెద్దవాడైన తరువాత
  rationale: ఇక్కడ క్రియ మోషే హోదాలో గొప్పవాడవడాన్ని కాక, వయస్సులో ఎదిగి ప్రౌఢుడవడాన్ని సూచిస్తుంది; తరువాత జరిగిన చర్యకు ముందు స్థితిని తెలుపుతుంది.
- source_word: אֶל אֶחָיו
  choice: తన సహోదరుల దగ్గరికి
  rationale: మూలంలోని కుటుంబ సంబంధ పదాన్ని నిలుపుతూ, హెబ్రీయులతో మోషేకు ఉన్న ఐక్యతను వ్యక్తం చేస్తుంది.
- source_word: בְּסִבְלֹתָם
  choice: వారి భారాలను
  rationale: బలవంతపు శ్రమలో వారు మోసిన భారాలు, అలాగే ఆ శ్రమ కలిగించిన కష్టం—రెండింటినీ సూచించగల మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: אִישׁ מִצְרִי
  choice: ఒక ఐగుప్తీయుడు
  rationale: తెలుగులో వ్యక్తిని సూచించే పుంలింగ రూపమే సహజంగా ‘మనిషి’ అనే భావాన్ని కలిగి ఉంటుంది; అదనంగా ‘మనిషి’ అని చేర్చడం అవసరం లేదు.
- source_word: מַכֶּה
  choice: కొడుతుండడం
  rationale: కొనసాగుతున్న శారీరక దాడిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దాడి తీవ్రతను మూలానికి మించి నిర్దిష్టం చేయదు.
- source_word: אִישׁ עִבְרִי
  choice: హెబ్రీయుణ్ణి
  rationale: తెలుగు విభక్తి రూపం ‘హెబ్రీయుడైన వ్యక్తి’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶחָיו
  choice: తన సహోదరుల్లో ఒకడైన
  rationale: ముందున్న ‘సహోదరులు’ అనే పదంతో మూలంలోని పదబంధ సంబంధాన్ని నిలుపుతూ, ఆ హెబ్రీయుడు మోషే సొంత ప్రజల్లో ఒకడని తెలియజేస్తుంది.
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו లోని బంధుత్వ భాష అనువాదం
  choice: సహోదరులు / సహోదరుల్లో ఒకడు
  alternative: బంధువులు / తన ప్రజలు
  rationale: మూలంలోని పుంలింగ కుటుంబ సంబంధ భాషను నిలుపుతుంది; ఇది హెబ్రీయులతో మోషే ఐక్యతను బలంగా వ్యక్తం చేస్తుంది. అయితే ఇక్కడ సహోదరులు అంటే ఒకే తల్లిదండ్రులకు పుట్టినవారు అని కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇలా జరిగింది’ హీబ్రూ కథన సూత్రాన్ని నిలుపుతుంది; ‘సహోదరులు’ మూలంలోని కుటుంబ భాషను కాపాడుతుంది; ‘భారాలు’ అనే పదం శారీరక బరువులు మరియు అణచివేతతో కూడిన కఠిన శ్రమ అనే భావ విస్తృతిని ఉద్దేశపూర్వకంగా తెరిచి ఉంచుతుంది.
