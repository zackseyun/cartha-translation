  to: అప్పుడు అతని సోదరి ఫరో కుమార్తెతో, “నేను వెళ్లి హెబ్రీ స్త్రీలలోనుండి ఒక పాలిచ్చే స్త్రీని నీ కోసం పిలిచి తీసుకురానా? ఆమె నీ కోసం ఈ బిడ్డకు పాలిస్తుంది” అని చెప్పింది.
