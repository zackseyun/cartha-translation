id: EXO.2.7
reference: Exodus 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: te
  text: అప్పుడు అతని సోదరి ఫరో కుమార్తెతో, “నేను వెళ్లి హెబ్రీ స్త్రీలలోనుండి ఒక పాలిచ్చే స్త్రీని నీ కోసం పిలిచి తీసుకురానా? ఆమె నీ కోసం ఈ బిడ్డకు పాలిస్తుంది” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అడిగింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో తెలుగులో ‘అడిగింది’ సహజంగా ఉంది.
- source_word: אֲחֹתוֹ
  choice: అతని అక్క
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం సందర్భంలో బిడ్డను సూచిస్తుంది. ‘అక్క’ అనేది ఆడ సహోదరి అని మాత్రమే కాక, ఈ సందర్భంలో ఆమె పెద్దదని సహజంగా తెలియజేస్తుంది.
- source_word: בַּת פַּרְעֹה
  choice: ఫరో కుమార్తె
  rationale: హెబ్రీ నిర్మాణ సంబంధాన్ని ఆధునిక తెలుగులో సహజమైన నామవాచక సమాసంతో అందించింది.
- source_word: הַאֵלֵךְ וְקָרָאתִי
  choice: పిలుచుకొని రానా?
  rationale: ప్రశ్నార్థక ప్రథమ పురుష క్రియ ఒక మర్యాదపూర్వక ప్రతిపాదనను వ్యక్తం చేస్తుంది. కేవలం ‘వెళ్లి పిలవనా?’ కంటే, వ్యక్తిని తీసుకురావడం సందర్భంలో అంతర్భూతమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: పాలిచ్చే ఒక స్త్రీ
  rationale: అక్షరార్థంగా పాలిచ్చగల స్త్రీని సూచిస్తుంది; ‘దాది’ వంటి అస్పష్టమైన లేదా వృత్తిపరమైన భావాన్ని రప్పించే పదాన్ని నివారించింది.
- source_word: מִן הָעִבְרִיֹּת
  choice: హెబ్రీ స్త్రీలలోనుండి
  rationale: מִן సూచించే సమూహంలోనుండి ఎంపిక అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְתֵינִק לָךְ אֶת הַיָּלֶד
  choice: నీ కోసం ఈ బిడ్డకు పాలిచ్చే
  rationale: హిఫిల్ రూపం ‘పాలు తాగేలా చేయడం,’ అంటే పాలివ్వడం అనే భావాన్ని ఇస్తుంది. לָךְ లోని ప్రయోజనార్థక భావాన్ని ‘నీ కోసం’గా నిలిపింది; సందర్భంలోని నిర్దిష్ట బిడ్డను తెలుగులో సహజంగా ‘ఈ బిడ్డ’గా పేర్కొంది.
