source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: te
  text: అయితే అతడు, “మా మీద అధికారిగా, న్యాయాధిపతిగా నిన్ను నియమించినవాడు ఎవరు? నీవు ఆ ఐగుప్తీయుణ్ణి చంపినట్లే నన్నూ చంపాలని అనుకుంటున్నావా?”[a] అన్నాడు. అప్పుడు మోషే భయపడి, “నిజంగా ఈ విషయం తెలిసిపోయింది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఆ ఐగుప్తీయుణ్ణి చంపినట్లే నన్నూ చంపుతానని అంటున్నావా?”
    reason: హీబ్రూలోని אַתָּה אֹמֵר అనే మాటకు ‘నీవు అంటున్నావు’ అనే అక్షరార్థ ఛాయ ఉంది; సందర్భంలో అది ఉద్దేశాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: నిన్ను నియమించినవాడు ఎవరు?
  rationale: שׂים ఇక్కడ అధికార స్థానంలో ఉంచడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘నియమించినవాడు’ సహజంగా ఆ సవాలును వ్యక్తం చేస్తుంది.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: అధికారిగా, న్యాయాధిపతిగా
  rationale: אִישׁ ఇక్కడ שַׂר וְשֹׁפֵט అనే పాత్రలను పరిచయం చేసే appositional వాడుకలో ఉంది; తెలుగులో విడిగా ‘మనిషిగా’ చేర్చడం అసహజమై అర్థాన్ని వక్రీకరించవచ్చు. שַׂר‌కు ‘అధికారి,’ שֹׁפֵט‌కు ‘న్యాయాధిపతి’ స్పష్టమైన సమానార్థకాలు.
- source_word: עָלֵינוּ
  choice: మా మీద
  rationale: עַל ఇక్కడ వక్తలపై అధికారాన్ని సూచిస్తుంది; ‘మా మీద’ సవాలు యొక్క ప్రతికూల ధోరణిని కూడా నిలుపుతుంది.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: నన్నూ చంపాలని అనుకుంటున్నావా?
  rationale: అక్షరార్థంగా ‘నన్ను చంపడానికి నీవు చెబుతున్నావా?’ అనే అసహజ నిర్మాణం ఉద్దేశం లేదా సంకల్పాన్ని ప్రశ్నించే హీబ్రూ ప్రయోగం. ‘చంపాలని అనుకుంటున్నావా?’ ఆధునిక తెలుగులో సహజం; ‘చంపుతానని అంటున్నావా?’ అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: నీవు ఆ ఐగుప్తీయుణ్ణి చంపినట్లే
  rationale: తులనాత్మక ఉపవాక్యాన్ని నేరుగా నిలుపుతూ, నిర్దిష్టంగా ముందే ప్రస్తావించబడిన ఐగుప్తీయుణ్ణి ‘ఆ’ ద్వారా సూచించాం.
- source_word: וַיִּירָא מֹשֶׁה
  choice: అప్పుడు మోషే భయపడి
  rationale: కథన క్రమాన్ని ‘అప్పుడు’తో చూపించి, భయానికి వెంటనే వచ్చిన అంతరంగ నిర్ధారణతో సహజంగా కలిపాం.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: నిజంగా ఈ విషయం తెలిసిపోయింది
  rationale: אָכֵן గ్రహింపుతో కూడిన నిర్ధారణను, נוֹדַע విషయం బయటపడిన స్థితిని సూచిస్తాయి. ‘తెలిసిపోయింది’ ఆ పరిణామ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: לְאִישׁ లోని పురుషలింగ పదాన్ని తెలుగులో విడిగా చూపాలా?
  choice: అధికారిగా, న్యాయాధిపతిగా
  alternative: ఒక మనిషిగా, అధికారిగా, న్యాయాధిపతిగా
  rationale: ఇక్కడ אִישׁ స్వతంత్రంగా లింగంపై బోధ చేయడం కంటే తరువాతి అధికార పాత్రలకు appositional పరిచయంగా పనిచేస్తుంది. ‘ఒక మనిషిగా’ అని విడిగా అనువదిస్తే తెలుగులో అసహజంగా ఉండి, అదనపు భావం కలుగుతుంది; మోషే పురుషుడనే సందర్భార్థం ఏ విధంగానూ నిషేధించబడదు.
- issue: אַתָּה אֹמֵר నిర్మాణం మాటను సూచిస్తుందా లేక ఉద్దేశాన్ని సూచిస్తుందా?
  choice: చంపాలని అనుకుంటున్నావా?
  alternative: ‘నిన్ను చంపుతాను’ అని అంటున్నావా?
  rationale: ఈ సందర్భంలో వక్త మోషే సంకల్పాన్ని సవాలు చేస్తున్నాడు. అయినా אֹמֵר యొక్క ‘చెప్పు’ భావం వల్ల ఏర్పడే నిజమైన అనిశ్చితిని పాదటిప్పణిలో నిలిపాం; ఏ సిద్ధాంతపరమైన నిర్ణయాన్నీ దీనిలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన రూపాలు వాడబడ్డాయి. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత ప్రశ్న తరువాత ఉంచబడింది.
