  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤פֶן כֹּה֙ וָ/כֹ֔ה וַ/יַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַ/יַּךְ֙ אֶת הַ/מִּצְרִ֔י וַֽ/יִּטְמְנֵ֖/הוּ בַּ/חֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: te
  text: అతడు అటూ ఇటూ చూసి, అక్కడ ఎవరూ లేరని చూసినప్పుడు, ఆ ఐగుప్తీయుణ్ణి కొట్టి, ఇసుకలో దాచిపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: అతడు అటూ ఇటూ చూసి
  rationale: פנה అనే క్రియకు ప్రాథమికంగా ‘తిరుగు’ అనే అర్థం ఉన్నా, כֹּה וָכֹה అనే జంట పదాలతో కలిసినప్పుడు చుట్టూ రెండు వైపులా చూడడాన్ని సూచిస్తుంది. ‘అటూ ఇటూ చూసి’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: అక్కడ ఎవరూ లేరని గ్రహించినప్పుడు
  rationale: אִישׁ అక్షరార్థంగా ‘మనిషి/పురుషుడు’; ఈ సందర్భంలో మాత్రం తన చర్యను చూసే వ్యక్తి ఎవరూ లేరనే సాధారణ భావం. ‘ఎవరూ లేరు’ తెలుగులో లింగభేదం లేకుండా సహజంగా అదే సందర్భార్థాన్ని ఇస్తుంది; וַיַּרְא ఇక్కడ కేవలం దృష్టితో చూడడం కాక పరిస్థితిని నిర్ధారించుకోవడాన్ని సూచించేందున ‘గ్రహించినప్పుడు’ ఎంచుకున్నాం.
- source_word: וַיַּךְ אֶת הַמִּצְרִי
  choice: ఆ ఐగుప్తీయుణ్ణి కొట్టి చంపి
  rationale: נכה ప్రాథమికంగా ‘కొట్టు’ అని అర్థం; తరువాత శరీరాన్ని దాచడం వల్ల ఈ దెబ్బ ప్రాణాంతకమైందని సందర్భం స్పష్టం చేస్తుంది. ‘కొట్టి చంపి’ క్రియ యొక్క ప్రత్యక్ష భావాన్నీ ఫలితాన్నీ సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: וַיִּטְמְנֵהוּ בַּחוֹל
  choice: ఇసుకలో దాచిపెట్టాడు
  rationale: טמן అంటే ‘దాచు/కప్పిపెట్టు’; חוֹל అంటే ‘ఇసుక’. ‘ఇసుకలో దాచిపెట్టాడు’ శవాన్ని ఇసుకతో కప్పి కనిపించకుండా చేసిన చర్యను, ‘పాతిపెట్టాడు’ అని అవసరానికి మించి నిర్దిష్టం చేయకుండా, తెలియజేస్తుంది.
