  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలో ‘స్త్రీ’ అని ఉన్న చోట ‘తల్లి’ అని వివరణాత్మకంగా మార్చలేదు. ‘పాలిచ్చి పెంచు’ అనే రూపం స్తన్యపానంతో కూడిన పోషణను సహజంగా వ్యక్తం చేస్తుంది.
