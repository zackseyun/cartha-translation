  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: te
  text: 'అప్పుడు ఫరో కుమార్తె ఆమెతో ఇలా అంది: “ఈ బిడ్డను తీసుకువెళ్లి, నా కోసం అతనికి పాలివ్వు; నేను నీకు నీ జీతం ఇస్తాను.” ఆ స్త్రీ ఆ బిడ్డను తీసుకొని అతనికి పాలిచ్చింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ఫరో కుమార్తె
  rationale: హీబ్రూ సమాస సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הֵילִיכִי
  choice: తీసుకువెళ్లి
  rationale: హిఫీల్ ఆజ్ఞారూపం ఈ సందర్భంలో బిడ్డను తనతో తీసుకువెళ్లమనే భావాన్ని ఇస్తుంది; కేవలం ‘తీసుకో’ కంటే గమనార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַיֶּלֶד הַזֶּה
  choice: ఈ బిడ్డను
  rationale: יֶלֶד ఇక్కడ చిన్న శిశువును సూచిస్తున్నప్పటికీ, ‘బిడ్డ’ సహజంగా ఉండి మూలపదంలోని సాధారణతను అతిగా నిర్దిష్టం చేయదు.
- source_word: וְהֵינִקִהוּ לִי
  choice: నా కోసం పాలిచ్చి పెంచు
  rationale: ינק యొక్క causative రూపం పాలిచ్చి పోషించడాన్ని సూచిస్తుంది. తెలుగులో ‘పాలిచ్చి పెంచు’ ఈ సందర్భంలోని తడి నర్సు సేవను సహజంగా తెలియజేస్తుంది; לִי ను ‘నా కోసం’గా నిలుపుతుంది.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: నేను నీకు జీతం ఇస్తాను
  rationale: שָׂכָר చేసిన సేవకు ఇచ్చే వేతనాన్ని సూచిస్తుంది; ఈ రూపం మూలానికి దగ్గరగా, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: పాఠ్యం ఇక్కడ ‘తల్లి’ అని కాక ‘స్త్రీ’ అని చెబుతుంది; సందర్భం ద్వారా తెలిసే గుర్తింపును అనువాదంలో చేర్చకుండా మూలంలోని పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: וַתְּנִיקֵהוּ
  choice: పాలిచ్చి పెంచింది
  rationale: ముందటి ఆజ్ఞలోని అదే క్రియతో భావసామ్యాన్ని నిలుపుతూ, శిశువుకు పాలిచ్చి పోషించిందనే అర్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
