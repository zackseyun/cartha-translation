translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘చేతిలోనుండి’ అనే మూల రూపకాన్ని నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. ‘అతడే’ ద్వారా హీబ్రూ דָּלֹה דָלָה లోని ఉద్ఘాటనను ప్రధాన వాక్యంలో వ్యక్తం చేశాం.
