id: EXO.2.19
reference: Exodus 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖/נוּ מִ/יַּ֣ד הָ/רֹעִ֑ים וְ/גַם דָּלֹ֤ה דָלָה֙ לָ֔/נוּ וַ/יַּ֖שְׁקְ אֶת הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: te
  text: వారు, “ఒక ఐగుప్తీయుడు కాపరుల చేతిలోనుండి[a] మమ్మల్ని కాపాడాడు. అంతేకాదు, మా కోసం నీళ్లు తోడి[b], మందకు నీళ్లు పెట్టాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాపరుల అధికారంనుండి’; హీబ్రూలో అక్షరార్థంగా, ‘కాపరుల చేతిలోనుండి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో క్రియ ఉద్ఘాటించబడింది; అక్షరార్థంగా, ‘తోడుతూ తోడాడు.’ ఇది నీళ్లు తోడిన చర్యను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: వారు ... అన్నారు
  rationale: אמר క్రియ యొక్క 3వ పురుష బహువచన స్త్రీలింగ రూపం కుమార్తెల సమాధానాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణాన్ని వాడాం.
- source_word: אִישׁ מִצְרִי
  choice: ఒక ఐగుప్తీయుడు
  rationale: אִישׁ מִצְרִי అంటే ‘ఐగుప్తీయ పురుషుడు’; తెలుగులో ‘ఒక ఐగుప్తీయుడు’ సహజంగా ఉండి వ్యక్తిని స్పష్టంగా సూచిస్తుంది.
- source_word: הִצִּילָנוּ
  choice: మమ్మల్ని కాపాడాడు
  rationale: נצל హిఫీల్ రూపం ప్రమాదం లేదా ఎదుటివారి అధికారంనుండి విడిపించడం/రక్షించడం అనే భావం ఇస్తుంది; సందర్భానికి ‘కాపాడాడు’ సహజంగా సరిపోతుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘చేతిలోనుండి’ అని ఉండి, అధికారం లేదా పట్టునుండి విడిపించడాన్ని సూచిస్తుంది. మూలంలోని రూపకాన్ని నిలిపాం.
- source_word: הָרֹעִים
  choice: కాపరులు
  rationale: רעה నుండి వచ్చిన ఈ పదం మందలను మేపే పురుషులను సూచిస్తుంది; ‘కాపరులు’ ప్రత్యక్షమైన ఆధునిక తెలుగు సమానం.
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: మొదటి సహాయానికి మించి అతడు మరొక పని కూడా చేశాడనే ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דָּלֹה דָלָה
  choice: అతడే ... నీళ్లు తోడి
  rationale: క్రియావిశేషక క్రియారూపం మరియు పరిమిత క్రియ కలయిక చర్యను ఉద్ఘాటిస్తుంది. ‘అతడే’ ద్వారా వ్యక్తిగతంగా అతడే చేసినట్లు ఉద్ఘాటించి, ‘నీళ్లు తోడి’ ద్వారా చర్యను సహజంగా తెలిపాం.
- source_word: לָנוּ
  choice: మా కోసం
  rationale: వారి ప్రయోజనం కోసం చేసిన చర్యను సూచించే దత్తార్థక సర్వనామాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיַּשְׁקְ
  choice: నీళ్లు పెట్టాడు
  rationale: שקה హిఫీల్ రూపం తాగించుట లేదా నీరు పెట్టుట అనే భావం ఇస్తుంది; పశువుల మంద సందర్భంలో ‘నీళ్లు పెట్టాడు’ సహజంగా ఉంటుంది.
- source_word: אֶת הַצֹּאן
  choice: మందకు
  rationale: צאן గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించే సమష్టి నామం. జాతిని అనవసరంగా నిర్దిష్టం చేయకుండా ‘మంద’ ఆ భావాన్ని నిలుపుతుంది.
