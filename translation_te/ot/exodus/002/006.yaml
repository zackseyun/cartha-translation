  source_fidelity: 'హీబ్రూ వచనంలోని చర్యల క్రమాన్ని అనువాదం నిష్కళంకంగా నిలుపుతుంది: ఆమె పెట్టెను తెరిచింది; పుంలింగ ప్రత్యయంతో సూచింపబడిన అతణ్ణి, అంటే బిడ్డను చూసింది; ఇదిగో అనే అవధాన నిపాతంతో ఏడుస్తున్న బాలుణ్ణి గమనించింది; అతనిపై కనికరం చూపి, అతడు హెబ్రీయుల పిల్లల్లో ఒకడని చెప్పింది. נַעַר యొక్క విస్తృత వయోసూచనను సందర్భానుగుణంగా ‘బాలుడు’గా ఇవ్వడం సముచితం.'
