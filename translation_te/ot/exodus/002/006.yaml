  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘అతణ్ణి—ఆ బిడ్డను’ అనే అనుబంధ నిర్మాణం మరియు ‘ఇదిగో’ అనే సజీవ అవధాన సూచన నిలుపబడ్డాయి.
