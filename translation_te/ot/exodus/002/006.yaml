  text: וַ/תִּפְתַּח֙ וַ/תִּרְאֵ֣/הוּ אֶת הַ/יֶּ֔לֶד וְ/הִנֵּה נַ֖עַר בֹּכֶ֑ה וַ/תַּחְמֹ֣ל עָלָ֔י/ו וַ/תֹּ֕אמֶר מִ/יַּלְדֵ֥י הָֽ/עִבְרִ֖ים זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: te
  text: ఆమె దాన్ని తెరిచి, అతణ్ణి—ఆ బిడ్డను—చూసింది.[a] ఇదిగో, ఆ బాలుడు ఏడుస్తున్నాడు.[b] ఆమె అతనిపై కనికరపడి[c], “ఇతడు హెబ్రీయుల పిల్లల్లో ఒకడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యంలో మొదట పుంలింగ ఏకవచన ప్రత్యయంతో ‘అతణ్ణి’ అని చెప్పి, వెంటనే ‘ఆ బిడ్డను’ అని అతణ్ణి స్పష్టంగా గుర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇదిగో’ అని అనువదించిన హీబ్రూ నిపాతం, ఆమె చూసిన దృశ్యంపై సజీవంగా దృష్టిని ఆకర్షిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆమె అతనిపై జాలిపడి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: ఆమె దాన్ని తెరిచి
  rationale: క్రియకు అర్థం ‘తెరిచింది.’ సందర్భంలో దాని కర్మ పెట్టె కావడంతో, సహజమైన తెలుగుకోసం ‘దాన్ని’ అని స్పష్టపరచబడింది.
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: అతణ్ణి—ఆ బిడ్డను—చూసింది
  rationale: క్రియలోని పుంలింగ ఏకవచన ప్రత్యయం ‘అతణ్ణి’ అని సూచిస్తుంది; వెంటనే వచ్చే ‘ఆ బిడ్డను’ అనే పదబంధం అతణ్ణి గుర్తిస్తుంది. తెలుగు అనువాదం ఈ అనుబంధ వివరణను నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే అనే అవధానార్థక నిపాతం ఆమె చూసిన దృశ్యాన్ని సజీవంగా, ఆశ్చర్యంతో పాఠకుని దృష్టికి తెస్తుంది.
- source_word: נַעַר
  choice: బాలుడు
  rationale: ఈ పదం వయస్సులో విస్తృత పరిధిని సూచించగలిగినా, ఇక్కడ శిశువైన మోషే మగబిడ్డ అని తెలియజేస్తుంది; ‘బాలుడు’ ఆ సూచనను అనవసరంగా కౌమార దశకు పరిమితం చేయదు.
- source_word: בֹּכֶה
  choice: ఏడుస్తున్నాడు
  rationale: కృదంత రూపం ఆమె చూసిన సమయంలో కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתַּחְמֹל עָלָיו
  choice: ఆమె అతనిపై కనికరపడి
  rationale: חמל עם על జాలి లేదా కనికరాన్ని వ్యక్తం చేస్తుంది. ‘కనికరపడి’ భావోద్వేగ స్పందనను నిలుపుతుంది; తరువాతి చర్యను ముందుగానే ‘కాపాడింది’గా చేర్చదు.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: హెబ్రీయుల పిల్లల్లో ఒకడు
  rationale: מן నిర్మాణం సమూహంలో ఒకడనే భాగార్థాన్ని ఇస్తుంది; ఈ తెలుగు రూపం ఆ జాతికి చెందిన పిల్లల్లో ఇతడు ఒకడని సహజంగా తెలియజేస్తుంది.
- source_word: זֶה
  choice: ఇతడు
  rationale: ఆమె ఎదుట ఉన్న మగబిడ్డను సూచించే నిర్దేశక సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
