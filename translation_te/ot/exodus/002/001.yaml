  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: te
  text: లేవి వంశానికి చెందిన ఒక మనిషి వెళ్లి, లేవి కుమార్తెను తన భార్యగా స్వీకరించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక లేవీయురాలిని.” హెబ్రీలో అక్షరార్థంగా “లేవి కుమార్తె” అని ఉంది; అంటే లేవి వంశానికి చెందిన ఒక స్త్రీ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך క్రియ యొక్క సాధారణ అర్థమైన ‘వెళ్లాడు’ను నిలుపుతూ, తదుపరి క్రియతో సహజమైన తెలుగు వాక్యక్రమంలో ‘వెళ్లి’ అని అనుసంధానించాం.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: కథలో మొదట పేరు చెప్పకుండా పరిచయం చేయబడిన పురుషుణ్ణి సూచిస్తుంది; ‘భర్త’ అనడం వివాహ సంబంధాన్ని ముందుగానే చేర్చుతుంది.
- source_word: מִבֵּית לֵוִי
  choice: లేవి వంశానికి చెందిన
  rationale: ‘లేవి ఇంటివాడు’ అనే యథార్థ నిర్మాణం తెలుగులో అసహజంగా లేదా ఒక గృహాన్ని సూచించినట్లు వినిపించవచ్చు. ఇక్కడ బֵּית్ వంశపరమైన సమూహాన్ని సూచిస్తున్నందున ‘వంశానికి చెందిన’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: וַיִּקַּח
  choice: తన భార్యగా స్వీకరించాడు
  rationale: לקח యొక్క మూలార్థం ‘తీసుకున్నాడు’; ఈ వివాహ సందర్భంలో తెలుగులో కేవలం అలా అనడం అసంపూర్ణంగా లేదా తప్పుదారి పట్టించేలా ఉంటుంది. అందువల్ల సందర్భార్థాన్ని స్పష్టంగా తెలిపాం.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; అనువదించలేదు]'
  rationale: ఇది హెబ్రీలో నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: בַּת לֵוִי
  choice: లేవి కుమార్తెను
  rationale: హెబ్రీలోని ‘లేవి కుమార్తె’ అనే వంశావళి ప్రయోగాన్ని నిలిపాం. ఇది లేవి యొక్క స్త్రీ సంతతివారిలో ఒకరిని సూచిస్తుంది; ‘ఒక లేవీయ స్త్రీని’ అనేది సహజమైన ప్రత్యామ్నాయం.
