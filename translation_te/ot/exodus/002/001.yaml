  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వెళ్లి’ అనే చర్యల క్రమాన్ని నిలిపి, వివాహ సందర్భంలోని ‘తీసుకున్నాడు’ అనే నుడికారాన్ని ‘తన భార్యగా స్వీకరించాడు’ అని స్పష్టం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
