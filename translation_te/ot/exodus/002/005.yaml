id: EXO.2.5
reference: Exodus 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: te
  text: అప్పుడు ఫరో కుమార్తె నైలు నది వద్ద స్నానం చేయడానికి దిగింది. ఆమెతో ఉన్న యువతులు నైలు నది ఒడ్డున నడుస్తూ ఉన్నారు. ఆమె రెల్లుల మధ్య ఉన్న బుట్టను[c] చూసి, తన దాసిని[b] పంపి దాన్ని తీసుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో ‘ఆమె దాసి.’ సంప్రదాయంగా కొందరు దీనిని ‘ఆమె చేయి’ అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ ‘బుట్ట’గా అనువదించిన హీబ్రూ పదమే ఆదికాండం 6–9లో నోవహు ‘ఓడ’కు వాడబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: దిగింది
  rationale: ירד అనే క్రియలోని కిందికి వెళ్లే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַּת פַּרְעֹה
  choice: ఫరో కుమార్తె
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: నైలు నదిలో స్నానం చేయడానికి
  rationale: רחץ ఇక్కడ స్నానం చేయడాన్ని సూచిస్తుంది; על సందర్భానుసారంగా నది వద్ద లేదా నదిలో అనే స్థానార్థాన్ని ఇస్తుంది. తెలుగులో చర్యను స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘నదిలో’ ఎంచుకోబడింది.
- source_word: וְנַעֲרֹתֶיהָ
  choice: ఆమె యువతులు
  rationale: נערות లోని స్త్రీలింగం, యౌవన భావం రెండింటినీ నిలుపుతూ పురాతన శైలిని నివారిస్తుంది.
- source_word: הֹלְכֹת עַל יַד הַיְאֹר
  choice: నైలు నది ఒడ్డున నడుస్తూ ఉన్నారు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నేపథ్య చర్యను, על יד అనే ‘పక్కన/వెంబడి’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַתֵּבָה
  choice: పెట్టె
  rationale: תבה ఒక మూసిన పాత్ర లేదా పెట్టెను సూచిస్తుంది; ఈ సందర్భంలో చిన్న శిశువును ఉంచిన వస్తువుకు ‘పెట్టె’ సహజం. నోవహు ఓడతో ఉన్న పదసంబంధాన్ని పాదటిప్పణిలో ఉంచబడింది.
- source_word: בְּתוֹךְ הַסּוּף
  choice: రెల్లుల మధ్య
  rationale: סוּף అంటే రెల్లు లేదా జమ్ము వంటి నీటి మొక్కలు; ‘రెల్లుల మధ్య’ మూలంలోని స్థానభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: తన దాసిని పంపి
  rationale: ప్రామాణిక స్వరచిహ్నాల ప్రకారం אֲמָתָהּ ‘ఆమె దాసి’; שלח తో కలిసి ఒకరిని పంపడం అనే సహజ వాక్యనిర్మాణం ఏర్పడుతుంది.
- source_word: וַתִּקָּחֶהָ
  choice: దాన్ని తెప్పించింది
  rationale: స్త్రీలింగ ప్రత్యయం పెట్టెను సూచిస్తుంది. పంపబడిన దాసి ద్వారా అది ఆమె వద్దకు చేరిన భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; అయితే మూలంలోని క్రియ అక్షరార్థంగా ‘దాన్ని తీసుకుంది’.
theological_decisions:
- issue: మోషే కథనంలో תבה పదానికి అనువాదం
  choice: పెట్టె
  alternative: ఓడ
  rationale: ఇదే హీబ్రూ పదం ఆదికాండం 6–9లో నోవహు ఓడకు వాడబడినా, ఇక్కడ చిన్న శిశువును ఉంచిన పాత్ర సందర్భానికి ‘పెట్టె’ తగినది. అంతర్గ్రంథ సంబంధాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా రుద్దకుండా పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: אֲמָתָהּ పఠనం
  choice: తన దాసిని
  alternative: తన చెయ్యిని
  rationale: మసొరెటిక్ స్వరచిహ్నాలు మరియు שלח క్రియతో ఉన్న వాక్యనిర్మాణం ‘దాసి’ అనే పఠనానికి మద్దతిస్తాయి. సంప్రదాయ ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. అందించిన ఆంగ్ల పాఠ్యంలో [a] గుర్తు దాని పాదటిప్పణి విషయంతో సరిపోలకపోవడంతో, మూల హీబ్రూకు సంబంధించిన ధృవీకరించగల [b], [c] పాదటిప్పణులనే చేర్చాం.
