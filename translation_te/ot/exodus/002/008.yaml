  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: te
  text: ఫరో కుమార్తె ఆమెతో, “వెళ్లు” అంది. ఆ యువతి వెళ్లి ఆ బిడ్డ తల్లిని పిలిచింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: ఫరో కుమార్తె
  rationale: హీబ్రూ నిర్మాణ పదబంధంలోని స్వామ్య సంబంధాన్ని సహజమైన, సంక్షిప్తమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: לֵכִי
  choice: వెళ్లు
  rationale: స్త్రీ ఏకవచనాన్ని ఉద్దేశించిన సంక్షిప్త ఆజ్ఞార్థక రూపం; హీబ్రూ మాటలోని క్లుప్తతను నిలుపుతుంది.
- source_word: הָעַלְמָה
  choice: ఆ యువతి
  rationale: עַלְמָה సాధారణంగా యౌవనస్థురాలిని సూచిస్తుంది. సందర్భంలోని మోషే అక్కను సూచిస్తూ, ప్రాచీన శైలికి పోకుండా మూలపద భావాన్ని కాపాడుతుంది.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: ఆ బిడ్డ తల్లిని పిలిచింది
  rationale: קרא ఇక్కడ పిలవడం లేదా రమ్మని పిలిపించడం అనే భావం ఇస్తుంది; నేరుగా ఉన్న హీబ్రూ కథన శైలికి ఈ తెలుగు సహజంగా సరిపోతుంది.
- source_word: הַיָּלֶד
  choice: ఆ బిడ్డ
  rationale: יֶלֶד అంటే పిల్లవాడు లేదా బిడ్డ; నైలు నదిలో ఉంచబడిన శిశువు సందర్భంలో ‘బిడ్డ’ సహజంగా ఉండి, లింగాన్ని అనవసరంగా మళ్లీ ప్రత్యేకించదు.
