  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు వరుస క్రియల క్లుప్తతను నిలుపుతూ, తెలుగులో సహజమైన కర్త–కర్మ–క్రియ క్రమాన్ని ఉపయోగించాం.
