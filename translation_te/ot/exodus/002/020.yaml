base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: te
  text: అతడు తన కుమార్తెలతో, “అయితే అతడు ఎక్కడ ఉన్నాడు? మీరు ఆ మనిషిని ఎందుకు వదిలివచ్చారు? భోజనానికి అతణ్ణి పిలవండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: అయితే అతడు ఎక్కడ ఉన్నాడు?
  rationale: సందర్భంలోని ఆశ్చర్యం మరియు తదుపరి ప్రశ్నకు దారితీసే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָמָּה זֶּה
  choice: ఎందుకు
  rationale: హీబ్రూ ప్రశ్నలోని గట్టిగా నిలదీసే భావం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో అదనపు అసహజ పదాలు లేకుండా నేరుగా ప్రశ్నించడం సహజం.
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: మీరు ఆ మనిషిని ఎందుకు అక్కడే వదిలివచ్చారు?
  rationale: స్త్రీల బహువచన క్రియను ‘మీరు’ ద్వారా, ప్రయాణ సందర్భంలోని విడిచివచ్చిన భావాన్ని ‘అక్కడే వదిలివచ్చారు’ ద్వారా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְיֹאכַל לָחֶם
  choice: భోజనం చేయడానికి
  rationale: ‘రొట్టె తిను’ అనే హీబ్రూ ప్రయోగం ఈ సందర్భంలో సాధారణంగా భోజనం చేయడం లేదా ఆతిథ్యం స్వీకరించడం అని అర్థం; తెలుగులో ‘భోజనం చేయడం’ సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ప్రశ్నల క్రమాన్ని, తండ్రి వ్యక్తం చేసిన ఆశ్చర్యం మరియు మందలింపు స్వరాన్ని నిలిపాం.
