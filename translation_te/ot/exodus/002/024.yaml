  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: te
  text: దేవుడు వారి మూలుగును[a] విన్నాడు; దేవుడు తన నిబంధనను అబ్రాహాముతో, ఇస్సాకుతో, యాకోబుతో జ్ఞాపకం చేసుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మూలుగును.’ హెబ్రీ నామవాచకం అణచివేతలో కలిగే మూలుగును లేదా బాధతో కూడిన మొరను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘జ్ఞాపకం చేసుకున్నాడు’ అనేది ఇక్కడ నిబంధనకు సంబంధించిన భాష. దేవుడు మరచిపోయాడని కాక, తన నిబంధనకు నమ్మకంగా స్పందించాడని ఇది సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: שׁמע ఇక్కడ కథనరూపంలో దేవుడు ఇశ్రాయేలీయుల బాధతో కూడిన మొరను వినడాన్ని సూచిస్తుంది. ‘ఆలకించాడు’ కంటే ‘విన్నాడు’ సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ ఏకవచన క్రియలతో ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: נַאֲקָתָם
  choice: వారి మూలుగును
  rationale: נַאֲקָה అణచివేతలోని బాధవల్ల వెలువడే మూలుగు లేదా వేదనతో కూడిన మొరను సూచిస్తుంది. ‘మూలుగు’ ఆ భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: וַיִּזְכֹּר
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: మూలంలోని ‘జ్ఞాపకం చేసుకోవడం’ అనే సాధారణ భావాన్ని నిలుపుతూ, దాని ఫలితమైన చర్యను ప్రధాన వాక్యంలో వివరణగా చేర్చదు.
- source_word: בְּרִיתוֹ
  choice: తన నిబంధనను
  rationale: בְּרִיתకు ప్రమాణబద్ధమైన సంబంధాన్ని సూచించే స్థిరమైన తెలుగు పదం ‘నిబంధన’; ప్రత్యయం అది దేవుని నిబంధన అని తెలియజేస్తుంది.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: అబ్రాహాముతో, ఇస్సాకుతో, యాకోబుతో చేసిన
  rationale: ‘నిబంధన’తో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘చేసిన’ను సరఫరా చేసి, హెబ్రీలో ప్రతి పితరుని ముందు ఉన్న పునరుక్తిని ‘తో’ పునరావృతం ద్వారా కొంతవరకు నిలిపింది.
theological_decisions:
- issue: ‘దేవుడు జ్ఞాపకం చేసుకున్నాడు’ అనే మానవరూపక భాష
  choice: ప్రధాన పాఠంలో ‘జ్ఞాపకం చేసుకున్నాడు’ అని నిలిపి ఉంచడం
  alternative: దేవుడు తన నిబంధన ప్రకారం కార్యం చేయడానికి పూనుకున్నాడు
  rationale: హెబ్రీ వచనం నిబంధన సందర్భంలోని సాధారణ మానవరూపక భాషను ఉపయోగిస్తుంది. దానిని ‘కార్యం చేశాడు’ అని విస్తరించడం అనువాదం కంటే వ్యాఖ్యానం అవుతుంది. ‘జ్ఞాపకం చేసుకున్నాడు’ అనేది దేవుడు ముందుగా మరచిపోయాడని తప్పనిసరిగా సూచించకుండా, ఆయన నిబంధన విశ్వసనీయతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మూలుగు,’ ‘నిబంధన,’ ‘జ్ఞాపకం చేసుకున్నాడు’ వంటి పదాలు మూలంలోని బాధ, నిబంధన భాష, మానవరూపక ఉద్వేగాన్ని నిలుపుతాయి. పితరుల ప్రతి పేరుతో ‘తో’ను పునరావృతం చేసి హెబ్రీ లయను కొంతవరకు ప్రతిబింబించింది.
