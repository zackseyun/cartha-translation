  to: దేవుడు వారి మూలుగును[a] విన్నాడు; దేవుడు తన నిబంధనను అబ్రాహాముతో, ఇస్సాకుతో, యాకోబుతో జ్ఞాపకం చేసుకున్నాడు.[b]
  rationale: The revision removes the unstated ‘made’ while preserving the explicit covenant relationship with each patriarch, the Hebrew repetition’s emphasis, and the source’s anthropomorphic ‘remembered.’ Footnote a is adjusted so that its stated alternative is a genuine lexical alternative to the main rendering.
