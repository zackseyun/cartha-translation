revisions:
- from: సమావేశపు గుడారాన్ని, సాక్ష్యపు మందసాన్ని, దానిమీద ఉన్న ప్రాయశ్చిత్తపు మూతను[a], గుడారంలోని సామగ్రినంతటినీ—
  to: సమాగమపు గుడారాన్ని, సాక్ష్యపు మందసాన్ని, దానిమీద ఉన్న ప్రాయశ్చిత్తపు మూతను[a], గుడారంలోని సామగ్రినంతటినీ—
  rationale: Only the established Telugu equivalent for ‘tent of meeting’ has been substituted. The remaining wording faithfully represents the Hebrew and is natural in modern standard Telugu; the footnote remains anchored to ‘ప్రాయశ్చిత్తపు మూతను.’
