  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣ת אֹ֣הֶל מוֹעֵ֗ד וְ/אֶת הָֽ/אָרֹן֙ לָֽ/עֵדֻ֔ת וְ/אֶת הַ/כַּפֹּ֖רֶת אֲשֶׁ֣ר עָלָ֑י/ו וְ/אֵ֖ת כָּל כְּלֵ֥י הָ/אֹֽהֶל׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: te
  text: సమాగమపు గుడారాన్ని, సాక్ష్యపు మందసాన్ని, దానిమీద ఉన్న ప్రాయశ్చిత్తపు మూతను[a], గుడారంలోని సామగ్రినంతటినీ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కరుణాసనాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: దేవుడు ఇశ్రాయేలీయులతో కలుసుకునే పవిత్ర గుడారాన్ని సూచించే హెబ్రీ పదబంధానికి సహజమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: הָאָרֹן לָעֵדֻת
  choice: సాక్ష్యపు మందసం
  rationale: לָעֵדֻת ఇక్కడ మందసానికి సాక్ష్యంతో ఉన్న సంబంధాన్ని సూచిస్తుంది. ‘సాక్ష్యపు మందసం’ సంక్షిప్తంగా, సహజంగా ఉండి సంప్రదాయ బైబిలు పదప్రయోగాన్నీ నిలుపుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత
  rationale: మందసం పైనున్న బంగారు మూతనే సూచిస్తూ, ఆ పదానికి సంబంధించిన ప్రాయశ్చిత్త భావాన్ని కూడా స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘కరుణాసనం’ అన్న రూపం వస్తువు మూత అనే విషయాన్ని అస్పష్టంగా చేయవచ్చు.
- source_word: אֲשֶׁר עָלָיו
  choice: దానిమీద ఉన్న
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందున్న మందసాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ఈ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: గుడారంలోని సామగ్రినంతటినీ
  rationale: כְּלֵי అనేది పాత్రలు, పనిముట్లు, ఇతర వస్తువులన్నిటినీ కలుపుకొనే విస్తృత పదం; ‘సామగ్రి’ ఆ విస్తృతిని సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పరిశుద్ధస్థల సందర్భంలో כַּפֹּרֶת అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాసనం
  rationale: ఈ పదం మందసపు మూతను సూచించడంతో పాటు ప్రాయశ్చిత్త ఆచారంతో దాని సంబంధాన్నీ కలిగి ఉంది. ‘ప్రాయశ్చిత్తపు మూత’ వస్తువు స్వరూపం, ఆధ్యాత్మిక సంబంధం రెండింటినీ తెలియజేస్తుంది; గుర్తింపు పొందిన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా పదంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పవిత్రస్థల సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. జాబితా కొనసాగుతున్నదని చూపేందుకు చివర దీర్ఘ విరామచిహ్నాన్ని నిలిపాం.
