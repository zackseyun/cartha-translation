id: EXO.31.16
reference: Exodus 31:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] విశ్రాంతిదినాన్ని పాటించాలి; తమ తరతరాలపాటు దానిని శాశ్వత నిబంధనగా[c] ఆచరించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు సంతతి.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘విశ్రాంతిదినాన్ని చేయుట’; అంటే దానిని ఆచరించుట లేదా పాటించుట.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నిత్య నిబంధన’ లేదా ‘నిరంతర నిబంధన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: ఆచరించాలి
  rationale: שׁמר అంటే కాపాడడం, పాటించడం, ఆచరించడం. సందర్భంలోని నిబంధనాత్మక ఆజ్ఞాబలాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆచరించాలి’ తెలియజేస్తుంది; וְ సందర్భానుసారంగా ‘కాబట్టి’గా వ్యక్తమైంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘ఇశ్రాయేలు కుమారులు.’ ఇది నిబంధన ప్రజలను సమష్టిగా సూచించినా, మూలంలోని పురుషలింగ కుటుంబపరమైన రూపాన్ని నిలుపుతుంది.
- source_word: הַשַּׁבָּת
  choice: విశ్రాంతిదినం
  rationale: שַׁבָּת‌కు ప్రామాణికమైన, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు పదం. ఇక్కడ ఇది కేవలం విశ్రాంతి భావాన్ని కాక, నియమిత నిబంధన సూచక దినాన్ని సూచిస్తుంది.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: విశ్రాంతిదినాన్ని పాటిస్తూ
  rationale: అక్షరార్థంగా ‘విశ్రాంతిదినాన్ని చేయడం’ అయినా, అది తెలుగులో సహజం కాదు. ‘పాటిస్తూ’ అనే రూపం హీబ్రూ నుడికార భావాన్ని ఇస్తూ, ముందు వచ్చిన ‘ఆచరించాలి’తో కఠినమైన పునరుక్తిని తగ్గిస్తుంది.
- source_word: לְדֹרֹתָם
  choice: తమ తరతరాలపాటు
  rationale: తరతరాలుగా కొనసాగే నిరంతరత్వాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּרִית עוֹלָם
  choice: శాశ్వతమైన నిబంధన
  rationale: בְּרִית అంటే ‘నిబంధన’; עוֹלָם ఇక్కడ దీర్ఘకాలికమైన, నిరంతరమైన కాలవ్యాప్తిని సూచిస్తుంది. ‘శాశ్వతమైన’ ఆ బలాన్ని నిలుపుతుంది; వాక్యాంత పదబంధపు విధేయ/సమానాధికార భావం తెలుగులో ‘నిబంధనగా ఉంచాలి’గా వ్యక్తమైంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే నిబంధన ప్రజల పేరును అనువదించడం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పురుషలింగ బహువచన కుటుంబపరమైన వ్యక్తీకరణను నిలిపి, అది నిబంధన ప్రజల సమూహాన్ని సూచించే భావాన్ని మార్చకుండా ఉంచింది.
- issue: בְּרִית עוֹלָם కాలవ్యాప్తిని అనువదించడం
  choice: శాశ్వతమైన నిబంధన
  alternative: నిత్య నిబంధన / నిరంతర నిబంధన
  rationale: వచనంలోని నిబంధనాత్మక, దీర్ఘకాలిక బలాన్ని నిలుపుతూ, ఈ వచనాన్ని మించిన అనంతర సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన లేఖన శైలి. హీబ్రూ పునరుక్తిని ‘ఆచరించాలి… పాటిస్తూ’గా కొంతవరకు నిలిపి, వాక్యాన్ని సహజంగా మలిచింది.
