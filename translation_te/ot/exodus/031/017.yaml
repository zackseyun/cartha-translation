  source_fidelity: హీబ్రూ వచనంలోని సంబంధ నిర్మాణం (“నాకూ … కుమారులకూ మధ్య”), శాశ్వత సూచన, ఆరు రోజుల సృష్టి, ఏడవ రోజున పని మానడం మరియు సేదతీరడం అనే వరుస భావాలు సమగ్రంగా నిలిచాయి. “పని మానుకొని” అనేది שָׁבַת యొక్క సందర్భోచితమైన ‘పని చేయడం నిలిపివేయడం’ అనే అర్థాన్ని సహజంగా అందిస్తోంది; “సేదతీరాడు” వַיִּנָּפַשׁ లోని మానవరూప భాషను తగ్గించదు.
