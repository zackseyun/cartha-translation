  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: te
  text: నాకూ ఇశ్రాయేలు కుమారులకూ[a] మధ్య అది ఎప్పటికీ ఒక సూచనగా ఉంటుంది. ఎందుకంటే యాహ్వే ఆరు రోజుల్లో ఆకాశాన్నీ భూమినీ చేశాడు; ఏడవ రోజున ఆయన పని మానుకొని[b] సేదతీరాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” “ఇశ్రాయేలు కుమారులు” అనేది హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “విశ్రమించి.” హీబ్రూ క్రియకు మరింత అక్షరార్థంగా “మానుకున్నాడు” లేదా “ఆపాడు” అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఊపిరి పీల్చుకున్నాడు” / “నూతనోత్సాహం పొందాడు.” హీబ్రూ ఇక్కడ సజీవమైన మానవరూప భాషను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: నాకూ ... మధ్య
  rationale: రెండు పక్షాల మధ్యనున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: אוֹת
  choice: సూచన
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే గుర్తు అనే భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే విధంగా అందిస్తుంది.
- source_word: לְעֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలిక, నిరంతర వ్యవధిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు ఆధారాన్ని లేదా కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజుల్లో
  rationale: సృష్టికార్యం జరిగిన కాలపరిమితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: ఆకాశం, భూమి అనే కర్మలతో దేవుని సృష్టికార్యాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా మూలంలోని వ్యక్తిగత నామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ఆకాశాన్నీ భూమినీ
  rationale: సమస్త సృష్టిని సూచించే హీబ్రూ జంటపదాన్ని తెలుగులో స్థిరమైన, సహజ రూపంలో అందిస్తుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: సాధారణ క్రమసూచక కాలవాక్యాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁבַת
  choice: పని మానుకొని
  rationale: క్రియ యొక్క ప్రాథమికమైన ‘చేయడం నిలిపివేయడం’ అనే భావాన్ని కాపాడుతుంది; అలసటవల్ల విశ్రాంతి అవసరమైందని అనవసరంగా సూచించదు.
- source_word: וַיִּנָּפַשׁ
  choice: సేదతీరాడు
  rationale: హీబ్రూలోని సజీవమైన మానవరూప వర్ణనను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: సబ్బాతు భాషలో దేవుని గురించి మానవరూప వర్ణన
  choice: పని మానుకొని సేదతీరాడు
  alternative: విశ్రమించాడు; పని మానుకొని ఊపిరి పీల్చుకున్నాడు
  rationale: మూలంలోని రెండు వేర్వేరు క్రియలను నిలుపుతూ, దేవునికి అలసట కలిగిందనే నిర్ణయాన్ని వచనంపై రుద్దకుండా దాని ఉద్దేశపూర్వక మానవరూప ఉద్రిక్తతను కాపాడుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని పురుషలింగ కుటుంబసంబంధ వ్యక్తీకరణను పారదర్శకంగా నిలుపుతుంది; పాదటిప్పణి దాని సమష్టి అర్థాన్ని వివరిస్తుంది.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపం, ‘పని మానుకొని సేదతీరాడు’ అనే రెండు దశల సబ్బాతు వర్ణన ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
