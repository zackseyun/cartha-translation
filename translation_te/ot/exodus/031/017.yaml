  terminology: యాహ్వే దైవనామానికి స్థిరమైన లిప్యంతరీకరణ. “ఇశ్రాయేలు కుమారులు” మూలంలోని కుటుంబసంబంధ పదబంధాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ సమష్టి అర్థానికి పాదటిప్పణి సరియైనది. “సూచన” లేదా ఒడంబడిక-చిహ్న భావానికి తగిన పదం. పాదటిప్పణి గుర్తులు a, b, c అన్నీ వచనంలో సరిగా అమర్చబడ్డాయి.
