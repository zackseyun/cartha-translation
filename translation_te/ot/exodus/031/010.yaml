translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది ముందటి వచనంలోని జాబితాను కొనసాగించే వాక్యఖండం కాబట్టి చివర కామా ఉంచబడింది.
