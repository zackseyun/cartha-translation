id: EXO.31.10
reference: Exodus 31:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֖ת בִּגְדֵ֣י הַ/שְּׂרָ֑ד וְ/אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/010.yaml
  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: te
  text: నైపుణ్యంతో నేసిన వస్త్రాలను[a], యాజకుడైన అహరోను కోసం పవిత్ర వస్త్రాలను, యాజకులుగా సేవ చేయడానికి అతని కుమారుల వస్త్రాలను,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవ కోసం ఉపయోగించే వస్త్రాలు,’ ‘పరిచర్య వస్త్రాలు,’ లేదా ‘నేసిన వస్త్రాలు.’ בִּגְדֵי הַשְּׂרָד అనే హీబ్రూ పదబంధం అర్థం కష్టమైనది; అది వస్త్రాల తయారీ నైపుణ్యాన్నిగానీ, గుడార సేవలో వాటి ఉపయోగాన్నిగానీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: నైపుణ్యంతో నేసిన వస్త్రాలు
  rationale: שְׂרָד అనే పదం అర్థం వివాదాస్పదం. యాజక సంబంధ సందర్భంలో ఇది ప్రత్యేక నైపుణ్యంతో తయారుచేసిన లేదా నేసిన వస్త్రాలను సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో ఈ సంభావ్య శిల్పార్థాన్ని సహజమైన తెలుగులో ఇచ్చి, ఇతర అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘పవిత్రతకు చెందిన వస్త్రాలు’ లేదా ‘పవిత్ర వస్త్రాలు’ అనే భావం ఉంది. ‘పవిత్ర వస్త్రాలు’ అనేది సూటిగా, గౌరవప్రదంగా ఉంది.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కోసం
  rationale: לְ ఇక్కడ నియామకం లేదా ఉద్దేశాన్ని సూచిస్తుంది; הַכֹּהֵן అహరోనుకు ఇచ్చిన బిరుదు. తెలుగు వాక్యనిర్మాణంలో ‘యాజకుడైన అహరోను కోసం’ సహజంగా ఉంటుంది.
- source_word: בִּגְדֵי בָנָיו
  choice: అతని కుమారుల వస్త్రాలు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం అహరోనును సూచిస్తుంది. మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְכַהֵן
  choice: యాజకులుగా సేవ చేయడానికి
  rationale: כהן క్రియ యాజక బాధ్యతను నిర్వర్తించడం లేదా యాజకునిగా సేవ చేయడం అనే భావాన్ని ఇస్తుంది. బహువచనంలోని కుమారులకు అనుగుణంగా ‘యాజకులుగా’ వాడాం.
- source_word: וְאֵת / וְאֶת
  choice: -ను / మరియు జాబితా నిర్మాణం
  rationale: אֵת ప్రత్యక్ష కర్మ సూచిక కావడంతో తెలుగులో కర్మ విభక్తి ద్వారా వ్యక్తమవుతుంది; וְ ముందటి వచనం నుంచి కొనసాగుతున్న జాబితా నిర్మాణంలో నిలుపబడింది.
