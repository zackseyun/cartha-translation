  terminology: ‘విశ్రాంతిదినం,’ ‘పవిత్రమైనది,’ ‘అపవిత్రపరిచే,’ మరియు ‘తన ప్రజల మధ్యనుండి వేరుచేయబడాలి’ సరైన పదప్రయోగాలు. ‘వేరుచేయబడాలి’ శిక్ష అమలు విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా כרת సూత్రాన్ని తగినంతగా ప్రతిబింబిస్తుంది.
