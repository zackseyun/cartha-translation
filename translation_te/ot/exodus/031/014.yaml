  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: te
  text: మీరు విశ్రాంతిదినాన్ని ఆచరించాలి; ఎందుకంటే అది మీకు పవిత్రమైనది. దాన్ని అపవిత్రపరిచే[a] వ్యక్తి తప్పక చంపబడాలి. ఎందుకంటే ఆ రోజున పని చేసే వ్యక్తి తన ప్రజల మధ్యనుండి వేరుచేయబడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని పవిత్రతను భంగపరిచే.’
    reason: חלל పదానికి అపవిత్రపరచడం లేదా పవిత్రతను భంగపరచడం అనే సమీప భావాలు ఉన్నాయి.
  - marker: b
    text: హీబ్రూలో ఇది ‘తన ప్రజల మధ్యనుండి వేరుచేయబడాలి’ అనే న్యాయసూత్రం; ఇక్కడ ఆ శిక్ష అమలయ్యే ఖచ్చితమైన విధానం చెప్పబడలేదు.
    reason: శిక్షాసూత్రంలోని నిజమైన అనిశ్చితిని పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: మీరు ... ఆచరించాలి
  rationale: שׁמר ఇక్కడ నిబంధనాత్మకంగా ఒక దినాన్ని పాటించడం లేదా ఆచరించడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆచరించాలి’ సహజంగా ఉండి ఆజ్ఞ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: הַשַּׁבָּת
  choice: విశ్రాంతిదినాన్ని
  rationale: שַׁבָּת సూచించే ప్రత్యేకమైన పవిత్ర దినాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేసే స్థిరమైన పదం.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: అది మీకు పవిత్రమైనది
  rationale: לָכֶם లోని ‘మీకు’ అనే సంబంధాన్ని విడిచిపెట్టకుండా, קֹדֶשׁ యొక్క పవిత్రమైనదిగా ప్రత్యేకపరచబడిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְחַלְלֶיהָ
  choice: దాన్ని అపవిత్రపరిచే వ్యక్తి
  rationale: חלל పియేల్ రూపం పవిత్రతను భంగపరచడం లేదా అపవిత్రం చేయడం అని అర్థం. హీబ్రూ కృదంతంలోని సాధారణ న్యాయసూత్ర భావాన్ని ‘వ్యక్తి’తో వ్యక్తం చేశాం.
- source_word: מוֹת יוּמָת
  choice: తప్పక మరణశిక్ష పొందాలి
  rationale: క్రియావిశేషక ధాతురూపం మరియు పరిమిత క్రియ కలయిక మరణదండన యొక్క నిశ్చయాన్ని బలపరుస్తుంది. ‘తప్పక’ ఆ ఉద్ఘాటనను, ‘మరణశిక్ష పొందాలి’ న్యాయపరమైన కర్మణి భావాన్ని నిలుపుతాయి.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: ఆ రోజున పని చేసే వ్యక్తి
  rationale: מְלָאכָה పని లేదా శ్రమను సూచిస్తుంది. בָהּ లోని దినసూచనను తెలుగులో స్పష్టత కోసం ‘ఆ రోజున’గా తెలిపాం; హీబ్రూలో ప్రత్యక్షంగా లేని ‘ఏ పని అయినా’ అనే విస్తరణను చేర్చలేదు.
- source_word: וְנִכְרְתָה
  choice: వేరుచేయబడాలి
  rationale: כרת నిఫాల్ న్యాయసూత్రంలో సమాజం మధ్యనుండి ‘తొలగించబడడం/వేరుచేయబడడం’ అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘నరికివేయబడాలి’ అనడం తప్పనిసరిగా శారీరక వధనే సూచించే ప్రమాదం ఉన్నందున, విధానాన్ని నిర్దిష్టం చేయని పదాన్ని ఎంచుకున్నాం.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ఆ ... వ్యక్తి
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ను కాక నేరానికి బాధ్యుడైన వ్యక్తిని సూచిస్తుంది; అందువల్ల ‘వ్యక్తి’ సందర్భోచితం.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: తన ప్రజల మధ్యనుండి
  rationale: మూలంలోని సమాజం మధ్యనుండి తొలగింపబడే భావాన్ని నిలుపుతుంది. ‘తన’ లింగనిరపేక్షంగా వ్యక్తిని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ అనే శిక్షాసూత్రం యొక్క విధానం
  choice: ‘తన ప్రజల మధ్యనుండి వేరుచేయబడాలి’ అని విధానాన్ని నిర్దిష్టం చేయకుండా ఉంచడం
  alternative: సమాజం నుంచి బహిష్కరించబడాలి; దేవుని తీర్పువల్ల నిర్మూలించబడాలి; మరణశిక్ష పొందాలి
  rationale: ఈ వాక్యంలో సూత్రం తీవ్రమైన శిక్షను సూచించినా, అది మానవ బహిష్కరణనా, మరణమా, లేక దేవుని తీర్పా అనేది క్రియ స్వయంగా స్పష్టంచేయదు. కాబట్టి మూలంలోని అనిశ్చితిని పరిష్కరించకుండా నిలుపుతున్నాం.
- issue: న్యాయపరమైన సందర్భంలో נֶפֶשׁ అర్థం
  choice: ‘వ్యక్తి’
  alternative: ‘ఆత్మ’ లేదా ‘ప్రాణం’
  rationale: ఇక్కడ పదం నేరం చేసిన సంపూర్ణ వ్యక్తిని సూచిస్తుంది; మానవునిలోని అమూర్త భాగం గురించి ప్రత్యేక సిద్ధాంతాన్ని వాక్యంలోకి చేర్చకూడదు.
- issue: מוֹת יוּמָת మరియు וְנִכְרְתָה మధ్య ఉన్న శిక్షాపరమైన ఉద్రిక్తత
  choice: రెండు వాక్యభాగాలనూ విడివిడిగా నిలిపి, రెండవదాన్ని మొదటిదానితో పూర్తిగా సమానార్థకంగా వ్యాఖ్యానించకపోవడం
  alternative: ‘వేరుచేయబడాలి’ అన్నదే మరణశిక్ష అని స్పష్టీకరించడం
  rationale: మూలం మొదట మరణశిక్షను ప్రత్యక్షంగా చెబుతూ, తరువాత సాంప్రదాయిక ‘ప్రజల మధ్యనుండి వేరుచేయబడడం’ సూత్రాన్ని వాడుతుంది. అనువాదం ఈ సంబంధాన్ని మూలం కంటే ఎక్కువగా నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన న్యాయశైలిని ఉపయోగించాం. పాతకాలపు క్రియాంతాలను నివారించాం. ‘విశ్రాంతిదినం’ సాధారణ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉండగా, మిగతా వాక్యం సాధారణ ఆధునిక పాఠకుడికి సులభంగా అర్థమయ్యేలా ఉంది.
