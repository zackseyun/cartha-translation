  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: te
  text: సీనాయి పర్వతం మీద ఆయన మోషేతో మాట్లాడడం ముగించినప్పుడు, దేవుడు సాక్ష్యపు రెండు పలకలను, అంటే దేవుని వేలితో[a] వ్రాయబడిన రాతి పలకలను, మోషేకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని వేలు ద్వారా.” హీబ్రూ వ్యక్తీకరణ ఈ లేఖనాన్ని దేవునికే నేరుగా ఆపాదిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి గత చర్యను సూచిస్తుంది; తెలుగులో సహజమైన క్రమాన్ని నిలుపుతూ ‘ఇచ్చాడు’ అని అనువదించాం.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: మాట్లాడడం ముగించినప్పుడు
  rationale: כלה ధాతువు యొక్క infinitive constructకు כְּ చేరి, మాట్లాడటం పూర్తయిన సమయాన్ని సూచిస్తుంది; ‘ముగించినప్పుడు’ ఈ కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִתּוֹ
  choice: మోషేతో
  rationale: సందర్భంలో సర్వనామం మోషేను సూచిస్తుంది. తెలుగులో అస్పష్టతను నివారించి సహజంగా ఉండేందుకు పేరును పునరుక్తి చేశాం.
- source_word: בְּהַר סִינַי
  choice: సీనాయి పర్వతం మీద
  rationale: పర్వతంపై జరిగిన స్థలాన్ని בְּ సూచిస్తుంది; ఆధునిక తెలుగులో ‘పర్వతం మీద’ సహజమైన రూపం.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: సాక్ష్యానికి సంబంధించిన రెండు పలకలు
  rationale: עֵדוּת యొక్క ప్రాథమిక భావమైన ‘సాక్ష్యం’ను నిలిపి, నిర్మాణ సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం; ‘నిబంధన పత్రం’ అని విస్తరించడం నివారించాం.
- source_word: לֻחֹת אֶבֶן
  choice: రాతి పలకలు
  rationale: ఈ construct పదబంధం పలకల పదార్థాన్ని తెలుపుతుంది; ‘రాతి పలకలు’ సంక్షిప్తమైన, సహజమైన తెలుగు.
- source_word: כְּתֻבִים
  choice: రాయబడిన
  rationale: כתב యొక్క passive participleను నేరుగా కర్మణి రూపంలో అనువదించాం; ‘చెక్కబడిన’ అనేది సాధ్యమైనా మూలపదం కంటే నిర్దిష్టమైన విధానాన్ని సూచించవచ్చు.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: దేవుని వేలితో
  rationale: సాధనార్థక בְּను ‘తో’ ద్వారా వ్యక్తం చేసి, దేవుని ప్రత్యక్ష కార్యాన్ని బలంగా చూపే మూర్తిమంతమైన మూలభాషా చిత్రణను నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి ఏకవచన భావంలో సూచిస్తుంది; ‘దేవుడు’ సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: దైవిక రచనలో మానవరూపక వ్యక్తీకరణ
  choice: దేవుని వేలితో
  alternative: దేవునిచేత నేరుగా / దేవుని శక్తితో
  rationale: హీబ్రూ పాఠం ఉపయోగించిన స్పష్టమైన మానవరూపక చిత్రణను వివరణాత్మకంగా మార్చకుండా నిలిపాం. ఇది పలకలపై లేఖనం దేవుని ప్రత్యక్ష కార్యమనే ఉద్ఘాటనను కాపాడుతుంది.
- issue: עֵדוּת యొక్క నిబంధనాత్మక భావం
  choice: సాక్ష్యం
  alternative: నిబంధన పత్రం
  rationale: పంచగ్రంథ సందర్భంలో ఈ పదానికి నిబంధనాత్మక ప్రాధాన్యం ఉన్నప్పటికీ, మూలంలోని విస్తృతమైన ‘సాక్ష్యం’ భావాన్ని సంకుచితం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని ప్రధాన క్రమాన్ని నిలుపుతూ, చివరి రెండు పదబంధాల appositionను తెలుగు పాఠకుడికి స్పష్టంగా చూపేందుకు దీర్ఘ విరామచిహ్నాలు వాడాం. మూలంలోని ‘దేవుని వేలితో’ అనే మానవరూపకాన్ని యథాతథంగా సంరక్షించాం.
