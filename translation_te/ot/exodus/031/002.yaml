source:
  edition: WLC
  text: רְאֵ֖ה קָרָ֣אתִֽי בְ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: te
  text: చూడు[a], యూదా గోత్రానికి చెందిన హూరు కుమారుడైన ఊరీ కుమారుడైన బెసలేలును నేను పేరుపేరున పిలిచాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదిగో, నేను బెసలేలును పేరుతో పిలిచాను.” హీబ్రూలోని “పేరుతో పిలవడం” అనే ప్రయోగం ఒక వ్యక్తిని నిర్దిష్టంగా ఎంపిక చేయడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: ראה క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం శ్రోత దృష్టిని తరువాతి ప్రకటనపై నిలిపేందుకు వాడబడింది. ‘చూడు’ హీబ్రూ ప్రత్యక్షతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קָרָאתִי בְשֵׁם
  choice: నేను పేరు పెట్టి పిలిచాను
  rationale: קרא בשם అనే ప్రయోగం ఒకరిని పేరుతో ప్రత్యేకంగా పిలవడం లేదా నిర్దిష్టంగా ఎంపిక చేయడం అనే భావాన్ని కలిగించగలదు. ‘పేరు పెట్టి పిలిచాను’ మూలంలోని ‘పిలిచాను’ భావాన్ని ఉంచుతూ వ్యక్తిగత నిర్దేశనను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּצַלְאֵל
  choice: బెసలేలు
  rationale: వ్యక్తి పేరును తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: హూరు కుమారుడైన ఊరీ కుమారుడు
  rationale: בן అనే వంశావళి పదాన్ని ‘కుమారుడు’గా నేరుగా అనువదించాం; హీబ్రూ క్రమం ప్రకారం బెసలేలు ఊరీ కుమారుడు, ఊరీ హూరు కుమారుడు అని స్పష్టంగా తెలిపాం.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: מַטֶּה ఇక్కడ ‘గోత్రం’ అని అర్థం; ל ఉపసర్గ గోత్ర సంబంధాన్ని సూచిస్తుంది. ‘గోత్రానికి చెందిన’ ఆధునిక తెలుగులో సహజంగా ఆ అనుబంధాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పేరు పెట్టి పిలిచాను’ అనే హీబ్రూ ప్రయోగంలో పిలుపు మరియు ప్రత్యేక నియామకం మధ్య భావ ఛాయ
  choice: ప్రధాన పాఠ్యంలో ‘పేరు పెట్టి పిలిచాను’ అని ఉంచడం
  alternative: ‘పేరు చెప్పి ప్రత్యేకంగా నియమించాను’ లేదా ‘పేరుతో పిలిచాను’
  rationale: సందర్భం బెసలేలు ప్రత్యేక ఎంపికను సూచించినా, קרא అనే క్రియలో లేని ‘నియమించాను’ భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు. అడుగుకுறிப்பு ప్రత్యామ్నాయ భావ ఛాయను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వంశావళి సంబంధం సందిగ్ధం కాకుండా సహజ తెలుగు క్రమంలో అమర్చాం; అయితే మూలంలోని పిలుపు/ప్రత్యేక ఎంపిక భావ ఉద్రిక్తతను ప్రధాన పాఠ్యం మరియు అడుగుకுறிப்பులో నిలిపాం.
