translation:
  language: te
  text: పొదగడానికి[a] రాళ్లను చెక్కే పనిలో, కలపను చెక్కే పనిలో, ఎలాంటి పనినైనా చేయడంలో[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమర్చడానికి రాళ్లపై నైపుణ్యపని చేయడంలో’ లేదా ‘పొదగడానికి రాళ్లపై చెక్కే పనిలో.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘రాళ్లు’ అనే మాట సాధారణ అర్థంలో ఉంది; పవిత్ర గుడారపు పనుల సందర్భంలో, ఇది విలువైన రత్నాలను కూడా సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת אֶבֶן
  choice: రాళ్లను చెక్కడంలో
  rationale: חרשׁת నైపుణ్యంతో చేసే పనిని సూచిస్తుంది; אבן సాధారణంగా ‘రాయి’. పదార్థానికి తగిన సహజమైన తెలుగు క్రియగా ‘చెక్కడం’ ఎంచుకోబడింది.
- source_word: לְמַלֹּאת
  choice: పొదగడానికి
  rationale: ఈ కళాకారుల సందర్భంలో రాళ్లను అమరికలో పొదగడాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘నింపడానికి’ కంటే ‘పొదగడానికి’ సందర్భోచితంగా, సహజంగా ఉంది.
- source_word: וּבַחֲרֹשֶׁת עֵץ
  choice: చెక్కను చెక్కడంలో
  rationale: עֵץ ఇక్కడ పనికి ఉపయోగించే పదార్థమైన చెక్కను సూచిస్తుంది; חרשׁתతో కలిసి చెక్కపై నైపుణ్యంగా చేసే చెక్కడపు పనిని తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת בְּכָל מְלָאכָה
  choice: అన్ని రకాల నైపుణ్యపు పనులు చేయడంలో
  rationale: מְלָאכָה పని లేదా వృత్తిపనిని సూచిస్తుంది. సందర్భం కళాకారుని నైపుణ్యాల గురించి కాబట్టి ‘నైపుణ్యపు పనులు’ భావాన్ని స్పష్టం చేస్తుంది; כָל యొక్క సమగ్రతను ‘అన్ని రకాల’ నిలుపుతుంది.
