  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఇది ముందటి వాక్యంపై ఆధారపడే పదబంధం కావడంతో క్రియానామ రూపాలు ఉపయోగించబడ్డాయి. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
