lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు తీసుకెళ్తుంది; ‘అప్పుడు’ ఆ క్రమభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. דבר ఇక్కడ మోషేను ఉద్దేశించి మాట్లాడడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే క్రియతో కూడిన אֶל సంబోధింపబడిన వ్యక్తిని సూచిస్తుంది; ‘మోషేతో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: ఈ రూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా చెప్పాడు:’ అనేది ఆ అనుసంధానాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది. తెలుగులో సుపరిచితమైన రూపంగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. తరువాతి ప్రత్యక్ష వాక్యానికి దారి చూపేందుకు చివర ద్విబిందువు వాడబడింది.
