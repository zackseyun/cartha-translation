  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: te
  text: ఆరు రోజులు పని చేయవచ్చు; అయితే ఏడవ రోజు యాహ్వేకు పవిత్రమైన, సంపూర్ణ విశ్రాంతి దినమైన సబ్బాతు. సబ్బాతు రోజున పని చేసే ప్రతివాడూ తప్పకుండా మరణశిక్ష పొందాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సబ్బాతు, సంపూర్ణ విశ్రాంతి.” హీబ్రూ పదబంధం పనిని పూర్తిగా నిలిపివేసే విశ్రాంతి భావాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: పని చేయవచ్చు
  rationale: నిఫాల్ అసంపూర్ణ క్రియ యొక్క కర్మణి భావాన్ని తెలుగు న్యాయనిర్దేశ సందర్భంలో సహజంగా తెలియజేస్తుంది; ఇది కేవలం భవిష్యత్తును కాక అనుమతించబడిన కార్యాన్ని సూచిస్తుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: అయితే ఏడవ రోజు
  rationale: ו సాధారణంగా ‘మరియు’ అయినా, ఆరు పని దినాలకు ఏడవ దినాన్ని వ్యతిరేకంగా నిలిపే సందర్భార్థాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి సబ్బాతు
  rationale: שַׁבָּתוֹן విశ్రాంతి లేదా పనిని పూర్తిగా నిలిపివేయడాన్ని బలపరుస్తుంది; ‘సబ్బాతు’ అనే పేరునూ దాని తీవ్రతనూ ఈ రూపం నిలుపుతుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యాహ్వేకు ప్రతిష్ఠితమైన
  rationale: קֹדֶשׁ పవిత్రమైన ప్రత్యేక స్థితిని, ל అంకితభావాన్ని సూచిస్తాయి. ఆధునిక తెలుగులో ‘ప్రతిష్ఠితమైన’ ఈ అంకిత పవిత్రతను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించబడింది.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: పని చేసే ప్రతివాడూ
  rationale: כָּל తో కూడిన కృదంత నిర్మాణంలోని సార్వత్రిక న్యాయవర్గాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: సబ్బాతు రోజున
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న יוֹם ‘రోజు’ను నిలుపుతూ సహజమైన తెలుగు పదబంధాన్ని ఇస్తుంది.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  rationale: క్రియావిశేషక క్రియానామం మరియు హోఫాల్ క్రియ కలయికలోని తీవ్రతనూ, ‘చంపబడాలి’ అనే కర్మణి న్యాయశిక్ష భావాన్నీ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం నిబంధన సంబంధ నామాన్ని నిలుపుతుంది.
- issue: שַׁבַּת שַׁבָּתוֹן పదబంధంలోని బలం
  choice: సంపూర్ణ విశ్రాంతి సబ్బాతు
  alternative: సబ్బాతు, గంభీరమైన విశ్రాంతి; విశ్రాంతి సబ్బాతు
  rationale: ఈ హీబ్రూ పదబంధం విరమణ లేదా విశ్రాంతి భావాన్ని తీవ్రం చేస్తుంది. తరువాతి సిద్ధాంత సూత్రీకరణలను చేర్చకుండా ఆ బలాన్ని నిలుపుతుంది.
- issue: מוֹת יוּמָת లోని శిక్ష స్వభావం
  choice: తప్పకుండా మరణశిక్ష పొందాలి
  alternative: నిశ్చయంగా చంపబడాలి; తప్పకుండా మరణించాలి
  rationale: హోఫాల్ రూపం సాధారణ మరణాన్ని కాక విధించబడే మరణశిక్షను సూచిస్తుంది; తెలుగులో న్యాయపరమైన భావాన్ని స్పష్టంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయనిర్దేశ శైలి. ‘సబ్బాతు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, అస్పష్టమైన పాతకాలపు పదజాలాన్ని నివారించాం.
