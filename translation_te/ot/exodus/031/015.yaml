  to: ఆరు రోజులు పని చేయవచ్చు; అయితే ఏడవ రోజు యాహ్వేకు పవిత్రమైన, సంపూర్ణ విశ్రాంతి దినమైన సబ్బాతు. సబ్బాతు రోజున పని చేసే ప్రతివాడూ తప్పకుండా మరణశిక్ష పొందాలి.[a]
