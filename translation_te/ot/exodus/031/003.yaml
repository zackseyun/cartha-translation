  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: te
  text: నేను అతణ్ణి దేవుని ఆత్మతో[a], జ్ఞానంతో, వివేకంతో, పరిజ్ఞానంతో, ప్రతి విధమైన పనినైపుణ్యంతో నింపాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దైవిక ఆత్మతో.’ ఈ హీబ్రూ పదబంధాన్ని మరింత సాధారణ భావంలో కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ దేవుడు తన ఆత్మ ద్వారా అతనికి సామర్థ్యం ఇచ్చాడనే అర్థం ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: నేను ... నింపాను
  rationale: מלא అనే క్రియకు ‘నింపు’ అని అర్థం. ఇక్కడ పూర్తయిన దైవిక అనుగ్రహాన్ని తెలుగులో సహజంగా ‘నింపాను’ అని వ్యక్తపరచవచ్చు.
- source_word: אֹתוֹ
  choice: అతణ్ణి
  rationale: సమీప సందర్భంలోని బెసలేలును సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మతో
  rationale: ఈ నిర్మాణం ‘దేవుని ఆత్మ’ లేదా మరింత సాధారణంగా ‘దైవిక ఆత్మ’ అనే భావాలను అనుమతిస్తుంది. పరిశుద్ధ మందిరపు పనికోసం దేవుడు స్వయంగా శక్తినిచ్చే సందర్భం కావడంతో ‘దేవుని ఆత్మ’ ప్రధాన పాఠ్యంగా తగినది.
- source_word: בְּחָכְמָה
  choice: జ్ఞానంతో
  rationale: ఇక్కడ ב అనుగ్రహించబడిన సామర్థ్యాన్ని సూచిస్తుంది; ‘జ్ఞానంతో’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: וּבִתְבוּנָה
  choice: వివేకంతో
  rationale: תבונה అవగాహన, అంతర్దృష్టి, వివేచన అనే భావాలను కలిగి ఉంది; జ్ఞానం మరియు పరిజ్ఞానం మధ్య ‘వివేకం’ భావభేదాన్ని కాపాడుతుంది.
- source_word: וּבְדַעַת
  choice: పరిజ్ఞానంతో
  rationale: דעת జ్ఞానం లేదా తెలిసికొనడాన్ని సూచిస్తుంది. חכמה నుండి పదభేదం స్పష్టంగా ఉండేందుకు ‘పరిజ్ఞానం’ ఎంచుకోబడింది.
- source_word: וּבְכָל מְלָאכָה
  choice: అన్ని రకాల నైపుణ్యంతో
  rationale: מלאכה పని, వృత్తి లేదా చేతిపని నైపుణ్యాన్ని సూచించగలదు. గుడార నిర్మాణ సందర్భంలో ‘అన్ని రకాల నైపుణ్యం’ కళాత్మక, వృత్తిపరమైన పనిసామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: רוּחַ אֱלֹהִים ను దేవుని స్వీయ ఆత్మగా అనువదించాలా, లేక సాధారణ దైవిక ఆత్మగా అనువదించాలా
  choice: దేవుని ఆత్మ
  alternative: దేవుని ఆత్మశక్తి; దైవిక ఆత్మ
  rationale: బెసలేలును పవిత్ర సేవ కోసం దేవుడు నేరుగా సమర్థుణ్ణి చేస్తున్న సందర్భం దేవుని స్వీయ ఆత్మను సూచించడాన్ని బలపరుస్తుంది. అయినా హీబ్రూ పదబంధంలోని విస్తృత సాధ్యతను పాదసూచికలో నిలిపాం; తరువాతి సిద్ధాంతపరమైన వివరాలను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. జ్ఞానం–వివేకం–పరిజ్ఞానం అనే మూడు సమీప భావాలను వేర్వేరు పదాలతో నిలిపి, מלאכה ను సందర్భానుగుణంగా ‘నైపుణ్యం’గా అనువదించాం.
