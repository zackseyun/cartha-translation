id: EXO.31.13
reference: Exodus 31:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: te
  text: 'నీవైతే ఇశ్రాయేలీయులతో[b] ఇలా చెప్పు: ‘మీరు నా సబ్బాతు విశ్రాంతి దినాలను తప్పక ఆచరించాలి[a]. ఎందుకంటే ఇది మీ తరతరాలపాటు నాకు మీకు మధ్య ఒక సూచనగా ఉంటుంది; తద్వారా మిమ్మల్ని పవిత్రపరచేది యహ్వేను నేనే అని మీరు తెలుసుకుంటారు[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా సబ్బాతు విశ్రాంతి దినాలను మాత్రమే ఆచరించాలి.” హీబ్రూ పదం బలమైన ఉద్ఘాటనను గానీ పరిమితిని గానీ సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థం “ఇశ్రాయేలు కుమారులు”; ఇక్కడ అది ఇశ్రాయేలు ప్రజలను సామూహికంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: “మిమ్మల్ని పరిశుద్ధులుగా చేసేది యహ్వేను నేనే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవైతే
  rationale: ముందున్న ఆదేశాల నుంచి మోషేకు ఇచ్చే ప్రత్యేక ఆదేశానికి మార్పును, ముందుంచబడిన సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో చూపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం నిబంధన సమాజాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన సామూహిక పదాన్ని వాడింది.
- source_word: אַךְ
  choice: తప్పక
  rationale: ఈ సందర్భంలో ఆ కణం బలమైన ఉద్ఘాటన లేదా పరిమితిని సూచించవచ్చు. ప్రధాన పాఠంలో ఆజ్ఞ యొక్క ఉద్ఘాటనను చూపుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
- source_word: שַׁבְּתֹתַי
  choice: నా విశ్రాంతి దినాలు
  rationale: హీబ్రూ బహువచనాన్ని నిలిపి, సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే విధంగా సబ్బాతు దినాలను తెలిపింది.
- source_word: תִּשְׁמֹרוּ
  choice: ఆచరించాలి
  rationale: שׁמר అనే పదానికి ఇక్కడ ‘కాపాడటం/పాటించడం’ అనే నిబంధనాత్మక భావం ఉంది; దినాచరణ సందర్భంలో ‘ఆచరించాలి’ సహజంగా ఉంటుంది.
- source_word: אוֹת
  choice: సూచన
  rationale: దేవునికీ ఇశ్రాయేలుకీ మధ్య నిబంధన సంబంధాన్ని గుర్తింపజేసే చిహ్నం అనే భావాన్ని ఇస్తుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: తరతరాలపాటు
  rationale: వరుస తరాలన్నిటిలో కొనసాగే కాలవ్యాప్తిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָדַעַת
  choice: మీరు తెలుసుకోవడానికి
  rationale: హీబ్రూ ఉద్దేశార్థక నిర్మాణాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: מְקַדִּשְׁכֶם
  choice: మిమ్మల్ని పవిత్రపరచేది
  rationale: పీయేల్ కృదంతంలోని కొనసాగుతున్న క్రియాత్మక భావాన్ని, దేవుడే ప్రజలను పవిత్రులుగా చేస్తున్నాడనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల బిరుదును పెట్టకుండా, మూలానికి దగ్గరైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపం పుంలింగ కుటుంబపదమైనప్పటికీ, సందర్భంలో అది మొత్తం ఇశ్రాయేలు నిబంధన సమాజాన్ని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో తెలిపి, ప్రధాన పాఠంలో సహజమైన సామూహిక రూపాన్ని ఎంచుకుంది.
- issue: אַךְ యొక్క ఉద్ఘాటన లేదా పరిమితి
  choice: తప్పక
  alternative: మాత్రమే; అయితేనేం
  rationale: సబ్బాతు ఆజ్ఞకు బలమైన ప్రాధాన్యం ఇవ్వడం ప్రధాన సందర్భార్థం. అయితే హీబ్రూ కణంలో పరిమితి లేదా వ్యతిరేక భావం కూడా ఉండగలదని పాదసూచికలో నిలిపింది.
- issue: מְקַדִּשְׁכֶם యొక్క భావం
  choice: మిమ్మల్ని పవిత్రపరచేది
  alternative: మిమ్మల్ని పరిశుద్ధులుగా చేసేది
  rationale: పవిత్ర స్థితికి వేరుచేయడం లేదా పవిత్రులుగా చేయడం అనే క్రియాత్మక భావాన్ని denominational వివరణ లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని ఉపయోగించింది. ‘నీవైతే’ ద్వారా సంభాషణ మలుపు, ‘తప్పక’ ద్వారా ఉద్ఘాటన, ‘తరతరాలపాటు’ ద్వారా నిరంతర నిబంధన భావం నిలిచాయి. మూలంలోని ‘అది’ అనే ఏకవచన సూచనను ఉంచి, అది విశ్రాంతిదిన ఆచరణను ఒక సమగ్ర నిబంధన సూచనగా పేర్కొనవచ్చనే స్వల్ప అస్పష్టతను పరిష్కరించకుండా నిలిపింది.
