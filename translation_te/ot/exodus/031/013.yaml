revisions:
- from: 'నీవైతే ఇశ్రాయేలీయులతో[b] ఇలా చెప్పు: ‘మీరు నా విశ్రాంతి దినాలను తప్పక ఆచరించాలి[a]. ఎందుకంటే, అది తరతరాలపాటు నాకు మీకు మధ్య ఒక సూచనగా ఉంటుంది. మిమ్మల్ని పవిత్రపరచేది యహ్వే అయిన నేనే[c] అని మీరు తెలుసుకోవడానికి అది సూచనగా ఉంటుంది.’'
  to: 'నీవైతే ఇశ్రాయేలీయులతో[b] ఇలా చెప్పు: ‘మీరు నా సబ్బాతు విశ్రాంతి దినాలను తప్పక ఆచరించాలి[a]. ఎందుకంటే ఇది మీ తరతరాలపాటు నాకు మీకు మధ్య ఒక సూచనగా ఉంటుంది; తద్వారా మిమ్మల్ని పవిత్రపరచేది యహ్వేను నేనే అని మీరు తెలుసుకుంటారు[c].’'
  rationale: హీబ్రూ వాక్యనిర్మాణాన్ని అనుసరించి, సూచన అనే భావాన్ని ఒక్కసారి మాత్రమే ఉంచి, దాని ఉద్దేశమైన ‘యహ్వే మిమ్మల్ని పవిత్రపరచువాడు అని తెలుసుకోవడం’ను తదుపరి ఉపవాక్యంగా పునరుద్ధరించాం. మూలంలోని ఉద్ఘాటన, బహువచన సబ్బాతులు, ఏకవచన సూచన, తరతరాల కాలవ్యాప్తి, యహ్వే అనే నామం అన్నీ నిలిపాం.
  reviewer_model: gpt-5.6-terra
