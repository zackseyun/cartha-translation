  to: “ఇదిగో[a], దాను గోత్రానికి చెందిన అహీసామాకు కుమారుడైన అహోలీయాబును అతనికి తోడుగా నేనే నియమించాను; వివేకం గల వారందరి హృదయాల్లో నేను జ్ఞానాన్ని ఉంచాను, వారు నేను నీకు ఆజ్ఞాపించినదంతా చేయడానికి[c].”
