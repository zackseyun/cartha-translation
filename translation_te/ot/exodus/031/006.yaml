id: EXO.31.6
reference: Exodus 31:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: te
  text: “ఇదిగో[a], దాను గోత్రానికి చెందిన అహీసామాకు కుమారుడైన అహోలీయాబును అతనికి తోడుగా నేనే నియమించాను; వివేకం గల వారందరి హృదయాల్లో నేను జ్ఞానాన్ని ఉంచాను, వారు నేను నీకు ఆజ్ఞాపించినదంతా చేయడానికి[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇదిగో’ అనే మాట ఇక్కడ తరువాత చెప్పబోయే విషయంపై ప్రత్యేక శ్రద్ధ పెట్టమని సూచిస్తుంది.
    reason: discourse_note
  - marker: c
    text: 'లేదా, మరింత పదానుసారంగా: ‘నేను నీకు ఆజ్ఞాపించినదంతా వారు చేస్తారు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: ఇదిగో … నేనే
  rationale: స్వతంత్ర ప్రథమపురుష సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’తో, הִנֵּה యొక్క శ్రద్ధ ఆకర్షించే భావాన్ని ‘ఇదిగో’తో నిలుపుతుంది; తెలుగు వాక్యక్రమం సహజంగా ఉండేలా రెండింటిని విడదీసింది.
- source_word: נָתַתִּי אִתּוֹ
  choice: అతనికి తోడుగా నేనే నియమించాను
  rationale: נָתַן యొక్క మూలార్థం ‘ఇవ్వడం/ఉంచడం’ అయినా, ఇక్కడ ఒక వ్యక్తిని బెసలేలుతో కలిసి సేవకు నియమించే సందర్భార్థం ఉంది. אִתּוֹ స్పష్టంగా ‘అతనికి తోడుగా’ అని నిలుపబడింది.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: అహీసామాకు కుమారుడు అహోలీయాబు
  rationale: వ్యక్తినామాలను తెలుగు ధ్వన్యనుకరణలో ఇచ్చి, בֶּן సంబంధాన్ని సహజమైన వంశపరిచయంగా అనువదించింది.
- source_word: לְמַטֵּה דָן
  choice: దాను గోత్రానికి చెందిన
  rationale: מַטֶּה ఇక్కడ గోత్ర అనుబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన సహజ రూపం.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: వివేకం గల వారందరి హృదయాల్లో
  rationale: חֲכַם־לֵב అనే హీబ్రూ నుడికారాన్ని పదేపదే అనువదించి అసహజత కలిగించకుండా ‘వివేకం గలవారు’గా తెలిపి, לֵב యొక్క మానవ అంతరంగ భావాన్ని ‘హృదయాల్లో’ ద్వారా నిలిపింది.
- source_word: נָתַתִּי חָכְמָה
  choice: నేను జ్ఞానాన్ని ఉంచాను
  rationale: దేవుడు వారి అంతరంగంలో జ్ఞానాన్ని ఉంచినట్లు ఉన్న రూపకాన్ని నిలుపుతుంది. ఈ సందర్భంలో జ్ఞానంలో చేతిపని నైపుణ్యం కూడా అంతర్భాగం.
- source_word: וְעָשׂוּ אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: నేను నీకు ఆజ్ఞాపించినదంతా వారు చేయడానికి
  rationale: ముందున్న జ్ఞానదానంతో ఈ క్రియకు ఉన్న ఉద్దేశ్య/ఫలిత సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సమన్వయ భవిష్యదర్థాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: חֲכַם־לֵב మరియు חָכְמָהలను కేవలం సాంకేతిక నైపుణ్యంగా అనువదించాలా?
  choice: వివేకం గలవారు / జ్ఞానం
  alternative: నైపుణ్యం గలవారు / నైపుణ్యం
  rationale: సందర్భం పరిశుద్ధ గుడారపు చేతిపనికి సంబంధించినదైనా, హీబ్రూ పాఠం ఆ నైపుణ్యాన్ని దేవుడు హృదయంలో ఉంచిన జ్ఞానంగా చూపుతుంది. అందువల్ల విస్తృతమైన దైవదత్త జ్ఞాన భావాన్ని నిలిపి, వృత్తి నైపుణ్యాన్ని పాదసూచికలో స్పష్టం చేసింది.
- issue: וְעָשׂוּ యొక్క సంబంధం ఉద్దేశ్యమా లేక సాధారణ సమన్వయ భవిష్యదర్థమా?
  choice: వారు చేయడానికి
  alternative: వారు చేస్తారు / వారు చేయాలి
  rationale: జ్ఞానం ఇవ్వడం తరువాత రావడం వల్ల ఉద్దేశ్య లేదా ఫలిత భావం సందర్భానుకూలం. అయితే హీబ్రూ וְ రూపం సాధారణ సమన్వయంగా కూడా గ్రహించవచ్చు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పాతకాలపు ‘చేసితిని’ వంటి రూపాలను నివారించి, మూలంలోని ఉద్ఘాటన, హృదయ రూపకం, దైవదత్త జ్ఞానం మరియు ఉద్దేశ్య/ఫలిత అస్పష్టతను నిలిపింది.
