  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨ת שֶׁ֧מֶן הַ/מִּשְׁחָ֛ה וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים לַ/קֹּ֑דֶשׁ כְּ/כֹ֥ל אֲשֶׁר צִוִּיתִ֖/ךָ יַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: te
  text: వారు అభిషేక తైలాన్నీ, పవిత్ర స్థలం కోసం సుగంధ ద్రవ్యాల ధూపాన్నీ[a] తయారు చేయాలి; నేను నీకు ఆజ్ఞాపించినదంతటి ప్రకారం వాటన్నిటినీ చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్ర వినియోగం కోసం సుగంధ ద్రవ్యాల ధూపం.”
    reason: לַקֹּדֶשׁ అనే పదబంధం సందర్భంలో పవిత్ర స్థలాన్ని సూచించవచ్చు; పవిత్ర వినియోగాన్ని సూచించడం కూడా సాధ్యం.
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: అభిషేకానికి ఉపయోగించే నూనెను సూచించే నిర్మాణాన్ని సహజమైన, ఆరాధనా సందర్భానికి తగిన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ద్రవ్యాలతో చేసిన ధూపం
  rationale: సుగంధ ద్రవ్యాల మిశ్రమంతో తయారయ్యే ధూపం అనే హెబ్రీ పదబంధంలోని నిర్మాణార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לַקֹּדֶשׁ
  choice: పవిత్ర స్థలం కోసం
  rationale: לַקֹּדֶשׁ లోని పవిత్ర స్థల/పరిశుద్ధ వినియోగ భావాన్ని సందర్భానుసారంగా చూపుతుంది; కేవలం సాధారణ 'పవిత్ర ఉపయోగం'గా పరిమితం చేయదు.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: నేను నీకు ఆజ్ఞాపించినదంతా
  rationale: כְּכֹל యొక్క సమగ్ర భావాన్ని, మోషేకు ఉన్న ప్రత్యక్ష ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: יַעֲשׂוּ
  choice: వారు చేయాలి
  rationale: ముందటి సందర్భంలోని పనివారిని సూచించే మూడవ పురుష బహువచనాన్ని, ఆజ్ఞాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לַקֹּדֶשׁ యొక్క స్థలార్థమా, పవిత్ర వినియోగార్థమా
  choice: పవిత్ర స్థలం కోసం
  alternative: పవిత్ర వినియోగం కోసం
  rationale: సందర్భం ప్రత్యక్ష గుడారపు ఆరాధనకు సంబంధించినది కాబట్టి స్థలార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాను; పవిత్ర వినియోగ భావం కూడా సాధ్యమని పాదటిప్పణిలో సూచించాను.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. జాబితా కొనసాగింపును సహజంగా ఉంచుతూ, చివరి వాక్యంలో హెబ్రీ ఆజ్ఞాత్మక ధోరణిని నిలిపాం.
