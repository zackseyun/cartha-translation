  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: te
  text: బల్లను, దాని ఉపకరణాలను, శుద్ధమైన[a] దీపస్తంభాన్ని[b], దాని ఉపకరణాలన్నిటిని, ధూప బలిపీఠాన్ని[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శుద్ధమైన’ అనేది ఆరాధనకు సంబంధించిన శుద్ధతను సూచించవచ్చు; ఈ గుడార సందర్భంలో, ఇతర వర్ణనల్లో దీపస్తంభం స్వచ్ఛమైన బంగారంతో చేయబడిందనే విషయాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘మెనోరా.’ హీబ్రూ పదం పరిశుద్ధ స్థలంలోని దీపస్తంభాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో దానిని లిప్యంతరీకరించకుండా అర్థానువాదం చేశాం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ధూపం వేసే బలిపీఠం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: బల్ల
  rationale: ఈ పదానికి నేరుగా ‘బల్ల’ అని అర్థం. సందర్భం ప్రత్యక్ష సన్నిధి రొట్టెల బల్లను గుర్తిస్తున్నా, ఈ వచనంలో లేని పూర్తి పేరును అనువాదంలో చేర్చలేదు.
- source_word: כֵּלָיו / כָּל כֵּלֶיהָ
  choice: దాని ఉపకరణాలు / దాని ఉపకరణాలన్నీ
  rationale: כְּלִי అనే విస్తృత పదం పాత్రలు, పనిముట్లు, అనుబంధ వస్తువులు అనే అర్థాలను కలిగి ఉంది. బల్లకూ దీపస్తంభానికీ సంబంధించిన సేవా వస్తువులను సహజంగా సూచించేందుకు ‘ఉపకరణాలు’ ఎంచుకోబడింది; כָּל యొక్క సంపూర్ణతను ‘అన్నీ’ వ్యక్తం చేస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభం
  rationale: ఇది పరిశుద్ధ స్థలంలోని దీపాలను మోసే నిలువును సూచించే సాధారణ నామవాచకం. లిప్యంతరీకరణ చేయకుండా దాని అర్థాన్ని తెలుగులో తెలిపాం.
- source_word: הַטְּהֹרָה
  choice: శుద్ధమైన
  rationale: טָהוֹרకు ‘శుభ్రమైన/శుద్ధమైన’ అనే అర్థాలున్నాయి. ఆరాధనా సందర్భంలోని శుద్ధతను, సంబంధిత వర్ణనల్లోని స్వచ్ఛమైన బంగారంతో ఉండే భావసంబంధాన్ని నిలుపుకోవడానికి ‘శుద్ధమైన’ అని అనువదించాం.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూప బలిపీఠం
  rationale: ఈ సమాసం ‘ధూపానికి సంబంధించిన బలిపీఠం’ అని అర్థమిస్తుంది. సంక్షిప్తంగా, సహజంగా ఉండే ‘ధూప బలిపీఠం’ మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: וְאֶת
  choice: జాబితాలో కామాలతో అనుసంధానం
  rationale: אֵת అనే ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక అనువాదం అవసరం లేదు. וְ సూచించే జాబితా అనుసంధానాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా కామాలతో కొనసాగించాం.
theological_decisions:
- issue: הַטְּהֹרָה సూచించే శుద్ధత స్వభావం
  choice: ‘శుద్ధమైన’ అనే విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘స్వచ్ఛమైన బంగారంతో చేసిన’ లేదా కేవలం ‘ఆచారపరంగా శుద్ధమైన’ అని స్పష్టీకరించడం
  rationale: మూల విశేషణం ఆచారపరమైన శుద్ధతను సూచించగలదు; గుడార సందర్భంలో దీపస్తంభం స్వచ్ఛమైన బంగారంతో చేయబడినదనే వర్ణనతోనూ ప్రతిధ్వనించవచ్చు. వచనం స్వయంగా ఒక్క భావానికే పరిమితం చేయనందున ప్రధాన పాఠ్యం ఆ సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే జాబితా శైలిని ఉపయోగించాం. ఇది ముందూ వెనుకా కొనసాగుతున్న వాక్యంలో ఒక భాగం కావడంతో చివర కామాను ఉంచాం. మూలంలోని ప్రతి అంశానికి తెలుగులో ‘-ను/-ని’ కర్మవిభక్తి ఇచ్చాం.
