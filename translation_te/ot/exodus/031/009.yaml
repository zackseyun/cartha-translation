  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: te
  text: దహనబలి అర్పించే బలిపీఠాన్ని, దాని ఉపకరణాలన్నిటినీ, గంగాళాన్ని, దాని పీఠాన్ని,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి అర్పించే బలిపీఠం
  rationale: నిర్మాణ సంబంధ పదబంధం దహనబలితో అనుబంధమైన బలిపీఠాన్ని సూచిస్తుంది. తెలుగులో ‘దహనబలి అర్పించే బలిపీఠం’ సహజంగా ఉండి దాని విధిని స్పష్టం చేస్తుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని ఉపకరణాలన్నీ
  rationale: כָּל మొత్తం సముదాయాన్ని, כֵּלִים బలిపీఠ సేవకు ఉపయోగించే సామగ్రిని సూచిస్తాయి; ‘ఉపకరణాలు’ ఆధునిక తెలుగులో విస్తృతమైన, సహజమైన పదం.
- source_word: הַכִּיּוֹר
  choice: గంగాళం
  rationale: మందిర ప్రాంగణంలో కడుక్కోవడానికి ఉంచిన పెద్ద పాత్రను సూచించేందుకు ‘గంగాళం’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: כַּנּוֹ
  choice: దాని పీఠం
  rationale: ఈ పదం గంగాళాన్ని మోసే ఆధార నిర్మాణాన్ని సూచిస్తుంది; ‘పీఠం’ ఆ ప్రత్యేక భాగాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶת
  choice: మరియు అనే భావాన్ని జాబితా క్రమంలో విభక్తి రూపాలతో వ్యక్తీకరించడం
  rationale: హీబ్రూ ప్రత్యక్ష కర్మ సూచికను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు; ‘-ను/-ని’ రూపాలు, జాబితా క్రమం సంబంధాన్ని సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన శైలితో అనువదించబడింది. ఇది ముందూ వెనుకా కొనసాగే జాబితాలోని భాగం కాబట్టి చివర కామా ఉంచబడింది.
