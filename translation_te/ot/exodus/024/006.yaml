source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ חֲצִ֣י הַ/דָּ֔ם וַ/יָּ֖שֶׂם בָּ/אַגָּנֹ֑ת וַ/חֲצִ֣י הַ/דָּ֔ם זָרַ֖ק עַל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: te
  text: మోషే రక్తంలో సగం తీసుకొని పాత్రల్లో ఉంచాడు; రక్తంలో మిగిలిన సగాన్ని బలిపీఠం మీద చిమ్మాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బలిపీఠంపై చల్లాడు’ లేదా ‘బలిపీఠంపై ప్రోక్షించాడు.’ బలి ఆచార సందర్భాల్లో ఈ హీబ్రూ క్రియను అనేక విధాలుగా అనువదించవచ్చు; ప్రధాన పాఠంలో రక్తాన్ని బలంగా వేయడం లేదా చిమ్మడం అనే భౌతిక చర్యను సూచించే పదాన్ని వాడాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు సహజమైన ఆధునిక తెలుగు సమానం; తరువాతి చర్యతో ప్రవాహంగా కలుస్తుంది.
- source_word: חֲצִי הַדָּם
  choice: రక్తంలో సగం
  rationale: హీబ్రూ భాగార్థక నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂים సూచించే సాధారణంగా పెట్టే లేదా ఉంచే చర్యకు సందర్భానుకూలమైన పదం.
- source_word: בָּאַגָּנֹת
  choice: పాత్రల్లో
  rationale: אַגָּנֹת ద్రవాన్ని పట్టే గిన్నెలు లేదా పళ్లాలను సూచిస్తుంది; ఖచ్చితమైన ఆకారం తెలియనందున ‘పాత్రలు’ విస్తృతమైన, సహజమైన ఎంపిక.
- source_word: זָרַק
  choice: చిమ్మాడు
  rationale: బలి ఆచార సందర్భంలో రక్తాన్ని బలిపీఠంపై బలంగా వేయడం లేదా చల్లడం అనే భావాన్ని ఇస్తుంది; సున్నితంగా ‘ప్రోక్షించడం’ అనే భావానికి పరిమితం చేయదు.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం మీదికి
  rationale: על తో కూడిన ఈ క్రియలో రక్తం బలిపీఠపు ఉపరితలంపై పడేలా చేసిన దిశాత్మక చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన హీబ్రూ వ్యక్తినామ రూపం.
theological_decisions:
- issue: బలిపీఠానికి రక్తాన్ని వర్తింపజేసిన ఆచార చర్య
  choice: ‘బలిపీఠం మీదికి చిమ్మాడు’ అని అనువదించడం
  alternative: ‘బలిపీఠం మీద చల్లాడు’ లేదా ‘బలిపీఠంపై ప్రోక్షించాడు’
  rationale: זָרַק అనే క్రియ బలి సందర్భంలో బలంతో రక్తాన్ని వేయడం లేదా చిమ్మడం అనే భావాన్ని అనుమతిస్తుంది. ‘చిమ్మాడు’ ఆ భౌతిక చర్యను తెలియజేస్తూనే, క్రియకు సాధ్యమైన ఇతర ఛాయలను పాదసూచికలో నిలుపుతుంది; ఎటువంటి సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పాత్రలు’ అనే పదం మూలపదం సూచించే గిన్నెలు/పళ్లాల ఖచ్చిత ఆకారాన్ని అనవసరంగా నిర్ణయించదు. క్రియల వరుసను తెలుగులో ప్రవాహంగా ఉండేందుకు ‘తీసుకొని… ఉంచాడు’గా నిర్మించాం.
