  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: te
  text: 'అప్పుడు మోషే వచ్చి ప్రజలకు యాహ్వే మాటలన్నిటినీ, తీర్పులన్నిటినీ[a] తెలియజేశాడు. ప్రజలందరూ ఒకే స్వరంతో ఇలా అన్నారు: “యాహ్వే పలికిన మాటలన్నిటినీ మేము చేస్తాము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయనియమాలన్నిటినీ.” హీబ్రూ మిష్పాటీమ్ నిబంధనకు సంబంధించిన న్యాయపరమైన తీర్పులు లేదా విధులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు మోషే వచ్చి
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; בוא యొక్క సాధారణ అర్థమైన ‘వచ్చు’ను నిలుపుతూ ‘అప్పుడు’ సహజ తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: וַיְסַפֵּר
  choice: ప్రజలకు వివరించాడు
  rationale: పియేల్ రూపంలోని ספר ఇక్కడ చెప్పడం లేదా వివరించి తెలియజేయడం అనే భావం ఇస్తుంది; ‘వివరించాడు’ మోషే ప్రజలకు సమగ్రంగా తెలియజేసిన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: యెహోవా చెప్పిన మాటలన్నిటినీ
  rationale: דברים యొక్క ‘మాటలు’ అనే అర్థాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో మూలం సూచించే యెహోవా పలికిన మాటలు అనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే దైవనామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయనియమాలు
  rationale: מִשְׁפָּטִים ఈ సందర్భంలో నిబంధనకు సంబంధించిన న్యాయపరమైన తీర్పులు లేదా శాసనాలను సూచిస్తుంది; ‘న్యాయనియమాలు’ ఆ న్యాయపరమైన మరియు నియమాత్మక రెండు కోణాలనూ సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיַּעַן
  choice: అన్నారు
  rationale: ענה అంటే ప్రతిస్పందించడం; తరువాత ప్రత్యక్ష వాక్యం ఉన్నందున తెలుగులో ‘అన్నారు’ సహజంగా ఆ సమాధానాన్ని వ్యక్తపరుస్తుంది.
- source_word: קוֹל אֶחָד
  choice: ఏకస్వరంతో
  rationale: ‘ఒకే స్వరంతో’ అనే హీబ్రూ నుడికారాన్ని ప్రజల ఐక్య ప్రతిస్పందనను సూచించే సహజ, గౌరవప్రదమైన తెలుగు పదంతో అందిస్తుంది.
- source_word: כָּל הַדְּבָרִים
  choice: మాటలన్నిటినీ
  rationale: మొదటి భాగంలోని ‘మాటలు’తో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: דִּבֶּר
  choice: చెప్పిన
  rationale: యెహోవా ఇంతకు ముందు పలికిన మాటలను సహజ తెలుగులో సూచిస్తూ, דבריםతో ఉన్న శబ్ద సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: נַעֲשֶׂה
  choice: మేము పాటిస్తాం
  rationale: עשה అక్షరార్థంగా ‘చేస్తాం’; అయితే ఆజ్ఞలు, న్యాయనియమాల సందర్భంలో ‘పాటిస్తాం’ తెలుగులో ఉద్దేశిత నిబంధనాత్మక కార్యాచరణను సహజంగా తెలియజేస్తుంది, కేవలం వినడాన్ని కాక అమలు చేయడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత నిబంధన నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
- issue: נַעֲשֶׂה యొక్క కార్యార్థం
  choice: మేము పాటిస్తాం
  alternative: మేము చేస్తాం
  rationale: మూల క్రియ యొక్క కార్యభావాన్ని నిలుపుతూ, నిబంధన మాటలు మరియు న్యాయనియమాలను అమలు చేస్తామని ప్రజలు చెప్పిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘చేస్తాం’ మరింత అక్షరార్థ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన బైబిల్ శైలిలో రూపొందించబడింది. మూలంలోని ‘మాటలు’ పునరుక్తిని నిలిపాం; ప్రజల ఐక్యతను ‘ఏకస్వరంతో’ ద్వారా వ్యక్తం చేశాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
