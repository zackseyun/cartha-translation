- from: అప్పుడు మోషే వచ్చి, యెహోవా చెప్పిన మాటలన్నిటినీ, న్యాయనియమాలన్నిటినీ[a] ప్రజలకు వివరించాడు. ప్రజలందరూ ఏకస్వరంతో, “యెహోవా చెప్పిన మాటలన్నిటినీ మేము పాటిస్తాం” అన్నారు.
