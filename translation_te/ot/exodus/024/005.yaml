source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: te
  text: అప్పుడు అతడు ఇశ్రాయేలు ప్రజలలోని యువకులను పంపాడు. వారు యాహ్వేకు దహనబలులు అర్పించి, ఎద్దులను సమాధాన బలులుగా[a] బలి అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహవాస బలులుగా’ లేదా ‘క్షేమ బలులుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అతడు పంపాడు
  rationale: శלח్ అనే క్రియను కథన సందర్భంలో సహజంగా, సూటిగా అనువదిస్తుంది; కర్త మోషే అని ముందరి సందర్భం తెలియజేస్తుంది.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలలోని యువకులను
  rationale: נַעַר లోని పురుష సూచనను ‘యువకులు’ నిలుపుతుంది; בְּנֵי יִשְׂרָאֵל అనే జాతీయ సమూహపదాన్ని ఆధునిక తెలుగులో సహజమైన ‘ఇశ్రాయేలు ప్రజలు’గా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: దహనబలులు అర్పించి
  rationale: עלה–עֹלָה సంయోగం బలిని పూర్తిగా దహనం చేసి అర్పించే ఆచారాన్ని సూచిస్తుంది; ‘దహనబలి’ ఆ బలి రకాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּזְבְּחוּ
  choice: బలి అర్పించారు
  rationale: ఆరాధనా సందర్భంలోని זבח కు సహజమైన తెలుగు సమానార్థకం; కేవలం వధించడం కాక బలిగా అర్పించడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: זְבָחִים שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: శְׁלָמִים అనే ప్రత్యేక బలి వర్గానికి తెలుగులో సుపరిచితమైన పదం; దాని విస్తృత శ్రేయస్సు లేదా సహవాస భావాలను పాదసూచికలో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచుతుంది.
- source_word: פָּרִים
  choice: కోడెదూడలను
  rationale: פָּרִים యువ మగ పశువులను సూచిస్తుంది; బలి జంతువులను తెలుగులో స్పష్టంగా, సహజంగా గుర్తిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; మూల ఉచ్చారణను సూచించే ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: בְּנֵי יִשְׂרָאֵל అనే వ్యక్తీకరణ
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ స్థిర జాతీయ పదబంధం ఇశ్రాయేలీయుల సమూహాన్ని సూచిస్తుంది. ‘యువకులు’ ఇప్పటికే పురుష సూచనను ఖచ్చితంగా నిలుపుతున్నందున, ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; అక్షరార్థ రూపం అనవసరంగా జీవసంబంధ కుమారులను సూచించవచ్చు.
- issue: זְבָחִים שְׁלָמִים యొక్క బలి సంబంధ భావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు / క్షేమ బలులు
  rationale: ఈ హీబ్రూ పదం శాంతి, సంపూర్ణత, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ప్రధాన పాఠంలో సంప్రదాయంగా గుర్తించదగిన పదాన్ని వాడి, ఇతర నిజమైన భావ ఛాయలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. బలి సంబంధ సాంకేతిక పదాలను స్పష్టంగా ఉంచుతూ, హీబ్రూ పదంలోని భావ విస్తృతిని పాదసూచికలో సంరక్షించాం.
