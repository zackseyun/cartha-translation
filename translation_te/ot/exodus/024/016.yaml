  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: te
  text: యెహోవా మహిమ సీనాయి కొండమీద నిలిచింది. మేఘం దానిని[a] ఆరు రోజులపాటు కప్పింది. ఏడవ రోజున ఆయన మేఘం మధ్యనుండి[b] మోషేను పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ ప్రత్యయం ‘సీనాయి కొండ’ను కాక ‘యెహోవా మహిమ’ను సూచిస్తుందని తీసుకుంటే, “మేఘం ఆ మహిమను కప్పింది.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “మేఘం లోపలినుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: నిలిచింది
  rationale: שׁכן ఇక్కడ ఒక స్థలంలో స్థిరంగా ఉనికిని ఏర్పరచుకోవడం లేదా దిగివచ్చి నిలవడం అనే భావాన్ని ఇస్తుంది. ‘నిలిచింది’ ఆధునిక తెలుగులో సహజంగా ఉండి, మహిమ కొండమీద స్థిరంగా ఉన్న దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: כְּבוֹד יְהוָה
  choice: యెహోవా మహిమ
  rationale: כָּבוֹד అనే పదంలోని ప్రత్యక్షమైన దివ్య వైభవం, ఘనత, సన్నిధి భావాలను ‘మహిమ’ సహజంగా మోస్తుంది; హెబ్రీ నిర్మాణం తెలుగులో సహజమైన సంబంధపదబంధంగా ఇవ్వబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన నామరూపమైన ‘యెహోవా’గా ఇచ్చాం.
- source_word: עַל הַר סִינַי
  choice: సీనాయి కొండమీద
  rationale: కొండపై ఉన్న స్థానాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיְכַסֵּהוּ
  choice: దానిని కప్పింది
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ఎవరిని లేదా దేనిని సూచిస్తుందో హెబ్రీలో కొంత సందిగ్ధత ఉంది. ‘దానిని’ అనేది కొండను ప్రధాన సూచ్యంగా అనుమతిస్తూ, మహిమను సూచించే అవకాశాన్ని కూడా పూర్తిగా మూసివేయదు.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: సీనాయి వృత్తాంతంలో ఇప్పటికే తెలిసిన దైవసన్నిధిని సూచించే మేఘం.
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులపాటు
  rationale: హెబ్రీ కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּקְרָא אֶל־מֹשֶׁה
  choice: మోషేను పిలిచాడు
  rationale: קרא אל యొక్క సందర్భోచిత భావం ‘పిలిచాడు’. తెలుగు వాక్యనిర్మాణంలో ‘మోషేను’ సహజమైన కర్మరూపం.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: నిర్దిష్ట క్రమసంఖ్యను సహజమైన తెలుగు కాలప్రయోగంగా అందిస్తుంది.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: మేఘం మధ్యనుండి
  rationale: מִתּוֹךְ లోని అంతర్భాగం లేదా మధ్య నుంచి వచ్చే భావాన్ని స్పష్టంగా, దృశ్యాత్మకంగా కాపాడుతుంది.
theological_decisions:
- issue: ‘పిలిచాడు’ అనే క్రియ యొక్క కర్త
  choice: ‘ఆయన’ యెహోవాను సూచిస్తుంది
  alternative: ‘యెహోవా మహిమ’ను వ్యక్తీకృత లేదా పరోక్ష కర్తగా గ్రహించడం
  rationale: సీనాయి ప్రత్యక్షత యొక్క కథన సందర్భంలో మోషేను పిలిచేవాడు యెహోవానే. అయితే హెబ్రీ ప్రవాహాన్ని అనుసరించి దైవనామాన్ని మళ్లీ చేర్చకుండా ‘ఆయన’ అని ఉంచాం.
- issue: וַיְכַסֵּהוּ లోని కర్మప్రత్యయం యొక్క సూచ్యం
  choice: ప్రధానంగా సీనాయి కొండ
  alternative: యెహోవా మహిమ
  rationale: కథన దృశ్యం మేఘం కొండను కప్పిందనే అర్థానికి అనుకూలంగా ఉంది. అయినా వ్యాకరణపరంగా ‘మహిమ’ కూడా సాధ్యమైన సూచ్యం కాబట్టి పాదటిప్పణిలో ఆ నిజమైన సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలిని వాడాం. ‘యెహోవా’, ‘మహిమ’, ‘మోషే’ వంటి సుపరిచిత బైబిలు పదరూపాలను ఉంచి, ప్రాచీనంగా వినిపించే వాక్యనిర్మాణాన్ని నివారించాం. పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
