id: EXO.24.17
reference: Exodus 24:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారుల[b] కళ్ల ఎదుట, పర్వత శిఖరంపై యాహ్వే మహిమ కనిపించిన తీరు దహించే అగ్నిలా[a] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భక్షించే అగ్నిలా.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనే పదబంధాన్ని ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: రూపం
  rationale: కంటికి కనిపించే బాహ్య ప్రత్యక్షతను సూచిస్తుంది; ప్రవచన దర్శనం అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: כְּבוֹד
  choice: మహిమ
  rationale: యెహోవా యొక్క దృశ్యమానమైన, ప్రకాశవంతమైన సన్నిధిని ఈ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: దహించే అగ్నిలా
  rationale: כְּ అనే ఉపసర్గలోని పోలికను, అగ్ని సందర్భంలో אכל క్రియకు ఉన్న కాల్చివేసే/భక్షించే తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּרֹאשׁ הָהָר
  choice: పర్వత శిఖరంపై
  rationale: పర్వతపు అత్యున్నత భాగంలో ఉన్న స్థానాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְעֵינֵי
  choice: కళ్లకు ... కనిపించింది
  rationale: హీబ్రూ పదబంధంలోని దృశ్య ప్రాధాన్యాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని పారదర్శకంగా నిలుపుతుంది; మరింత సామూహికమైన తెలుగు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకొని, ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక సమూహ designation
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే పుంలింగ రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సందర్భంలో మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో గుర్తించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతతో కూడిన సహజ వాక్యనిర్మాణం ఉపయోగించబడింది. హీబ్రూలోని దృశ్య భావాన్ని నిలుపడానికి ‘కళ్లకు ... కనిపించింది’ అని, పోలికను స్పష్టంగా ఉంచడానికి ‘అగ్నిలా’ అని అనువదించబడింది.
