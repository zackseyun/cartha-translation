  naturalness: ‘మహిమ యొక్క రూపం’ is understandable but somewhat stiff in modern Telugu. ‘మహిమ కనిపించిన తీరు’ naturally expresses מַרְאֵה (‘appearance’) without turning it into a prophetic vision or assigning a fixed physical form to the glory.
