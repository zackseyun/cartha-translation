  text: וַ/יָּבֹ֥א מֹשֶׁ֛ה בְּ/ת֥וֹךְ הֶ/עָנָ֖ן וַ/יַּ֣עַל אֶל הָ/הָ֑ר וַ/יְהִ֤י מֹשֶׁה֙ בָּ/הָ֔ר אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָֽיְלָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: te
  text: మోషే మేఘం మధ్యలోకి[a] ప్రవేశించి, పర్వతం మీదికి ఎక్కాడు. మోషే నలభై రోజులు, నలభై రాత్రులు పర్వతం మీద ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేఘం లోపలికి’ లేదా ‘మేఘం నడుమలోకి’ అని కూడా అనువదించవచ్చు. మోషే మేఘం సమీపానికి మాత్రమే కాక మేఘంలోకే ప్రవేశించాడని హీబ్రూ పదబంధం నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ప్రవేశించి
  rationale: ఈ సందర్భంలో בוא మోషే మేఘం లోపలికి కదలడాన్ని సూచిస్తుంది. ‘ప్రవేశించి’ అనేది దిశాభావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ
  choice: మధ్యలోకి
  rationale: תּוֹךְ మధ్యభాగం లేదా అంతర్భాగాన్ని సూచిస్తుంది. గమనాన్ని తెలిపే క్రియతో కలిసి ఉన్నందున ‘మధ్యలోకి’ అని అనువదించడం మోషే మేఘం సమీపానికి మాత్రమే కాక దాని లోపలికే వెళ్లాడనే భావాన్ని నిలుపుతుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న עָנָן‌కు నేరమైన అనువాదం. సందర్భంలో ఇది ముందే ప్రస్తావించబడిన దైవసన్నిధికి సంబంధించిన మేఘం; మూలంలో లేని ‘దట్టమైన’ వంటి విశేషణాన్ని చేర్చలేదు.
- source_word: וַיַּעַל אֶל הָהָר
  choice: పర్వతం మీదికి ఎక్కాడు
  rationale: עלה పైకి వెళ్లడాన్ని, אֶל గమ్యాన్ని సూచిస్తాయి. ‘పర్వతం మీదికి ఎక్కాడు’ అనేది ఆరోహణను, గమ్యాన్ని రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: మోషే పర్వతం మీద ఉన్నాడు
  rationale: היה ఇక్కడ ఒక కాలవ్యవధిలో మోషే ఉన్న స్థితి, స్థలాన్ని తెలియజేస్తుంది. ‘ఉన్నాడు’ మూలానికి నేరంగా ఉంటుంది; ‘నిలిచాడు’ లేదా ‘ఉండిపోయాడు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: నలభై రోజులు, నలభై రాత్రులు
  rationale: కాలవ్యవధిని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, కచ్చితంగా తెలియజేసే రూపం.
theological_decisions:
- issue: దైవసన్నిధితో ముడిపడిన మేఘ చిత్రణ
  choice: మేఘం
  alternative: దట్టమైన మేఘం
  rationale: హీబ్రూ పాఠంలో విశేషణం లేని సాధారణ నామవాచకం עָנָן మాత్రమే ఉంది. అందువల్ల దైవదర్శన సంబంధమైన చిత్రణను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘మధ్యలోకి’ మూలంలోని అంతర్భాగ భావాన్ని నిలుపుతుంది; ‘ఉన్నాడు’ మూలంలో లేని ‘ఉండిపోయాడు’ అనే అదనపు భావాన్ని నివారిస్తుంది.
