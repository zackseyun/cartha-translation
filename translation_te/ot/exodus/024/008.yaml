  rationale: The revision retains the source’s concrete verb for the blood action, uses a less interpretive rendering of the final prepositional phrase, and aligns the divine name with the project’s Yahweh policy. The covenant idiom is rendered in idiomatic Telugu without adding doctrinal explanation.
