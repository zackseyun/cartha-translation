- from: అప్పుడు మోషే ఆ రక్తాన్ని తీసుకొని ప్రజల మీద చల్లాడు[a]. తరువాత అతడు, “ఇదిగో, ఈ మాటలన్నిటి ఆధారంగా యెహోవా మీతో చేసిన నిబంధన రక్తం” అని చెప్పాడు.
