id: EXO.24.8
reference: Exodus 24:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: te
  text: అప్పుడు మోషే ఆ రక్తాన్ని తీసుకొని ప్రజలపై విసిరాడు[a]. అతడు, “ఇదిగో, యాహ్వే ఈ మాటలన్నిటి ప్రకారం మీతో చేసిన నిబంధన రక్తం” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలపై చల్లాడు” లేదా “చిమ్మాడు.” హీబ్రూ క్రియకు సాధారణంగా “విసరడం” అనే స్పష్టమైన భావం ఉంది; బలి ఆచార సందర్భంలో అది రక్తాన్ని ఆచారబద్ధంగా చల్లడాన్ని లేదా చిమ్మడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు సహజమైన తెలుగు సమానం; ముందు ప్రస్తావించిన బలి రక్తాన్ని మోషే తీసుకున్నాడని తెలియజేస్తుంది.
- source_word: הַדָּם
  choice: ఆ రక్తాన్ని
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది; సందర్భంలో ముందుగా చెప్పిన బలి రక్తాన్నే సూచిస్తున్నందున తెలుగులో ‘ఆ’ సహజంగా నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: וַיִּזְרֹק
  choice: చల్లాడు
  rationale: זרק ప్రాథమికంగా విసరడం లేదా చిమ్మడం అనే భావం కలిగినా, బలి ఆచారంలో రక్తాన్ని ప్రయోగించడాన్ని సూచిస్తుంది. ‘చల్లాడు’ తెలుగు పాఠకునికి ఆ కర్మకాండ చర్యను సహజంగా తెలియజేస్తుంది; మరింత మూర్తమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: עַל הָעָם
  choice: ప్రజల మీద
  rationale: עַל యొక్క స్థానసంబంధ భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రదర్శన లేదా ప్రకటనను సూచించే హీబ్రూ అవ్యయానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: דַם הַבְּרִית
  choice: నిబంధన రక్తం
  rationale: హీబ్రూ సమాసంలోని భావాన్ని సంక్షిప్తంగా కాపాడుతుంది; ‘నిబంధన యొక్క రక్తం’ కంటే తెలుగులో సహజంగా ఉండి, దాని ధార్మిక ప్రాముఖ్యతను నిలుపుతుంది.
- source_word: כָּרַת ... הַבְּרִית
  choice: చేసిన నిబంధన
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘నిబంధనను కోయడం.’ తెలుగులో ‘నిబంధన చేయడం’ స్థిరమైన, స్పష్టమైన ప్రయోగం; అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో పెట్టడం అపార్థానికి దారితీయవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంతో అందిస్తుంది.
- source_word: עִמָּכֶם
  choice: మీతో
  rationale: రెండవ పురుష బహువచన ప్రత్యయంతో ఉన్న పూర్వప్రత్యయానికి సరళమైన తెలుగు సమానం.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలన్నిటి ఆధారంగా
  rationale: ఇక్కడ עַל నిబంధనకు ముందు పలికిన మాటలతో ఉన్న ఆధారసంబంధాన్ని సూచిస్తుంది. ‘మాటలు’ דְּבָרִים యొక్క రూపాన్ని కాపాడగా, ‘ఆధారంగా’ సందర్భంలోని నిబంధనాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: כָּרַת ... בְּרִית అనే నిబంధన చేసే హీబ్రూ నుడికారాన్ని అనువదించడం
  choice: యెహోవా మీతో చేసిన నిబంధన
  alternative: యెహోవా మీతో కోసిన నిబంధన
  rationale: అక్షరార్థమైన ‘కోసిన నిబంధన’ బలి ద్వారా నిబంధన స్థిరపరచబడిన నేపథ్యాన్ని ప్రతిధ్వనింపజేయవచ్చు; అయితే అది తెలుగులో స్థిరమైన నుడికారం కాదు. ‘చేసిన నిబంధన’ అసలు ఉద్దేశాన్ని స్పష్టంగా అందిస్తుంది, బలి సందర్భాన్ని వాక్యంలోని రక్త ప్రస్తావనే నిలుపుతుంది.
- issue: יְהוָה దైవనామాన్ని అందించడం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది బిరుదు కాదు, వ్యక్తిగత దైవనామం. తెలుగులో సాధారణ పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
- issue: עַל כָּל הַדְּבָרִים הָאֵלֶּה యొక్క సంబంధాన్ని వ్యక్తం చేయడం
  choice: ఈ మాటలన్నిటి ఆధారంగా
  alternative: ఈ మాటలన్నిటిని గురించి
  rationale: ఈ పూర్వప్రత్యయం నిబంధన యొక్క విషయాన్ని గానీ, దాని నియమాధారాన్ని గానీ సూచించగలదు. తక్షణ సందర్భంలో ముందుగా చదివి అంగీకరించిన నిబంధన మాటలు ఆధారంగా ఉండటం ప్రధానంగా కనిపిస్తుంది; అయినా విషయార్థపు ప్రత్యామ్నాయం సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. కథన ప్రవాహం సహజంగా ఉండేందుకు ‘అప్పుడు,’ ‘తరువాత’ వాడబడ్డాయి. మూలంలోని నిబంధనాత్మక గంభీరత కోసం ‘ఇదిగో’ మరియు ‘నిబంధన రక్తం’ నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలోని [a] గుర్తు పాదసూచికతో సరిగ్గా సరిపోతుంది.
