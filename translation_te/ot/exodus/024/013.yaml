source:
  edition: WLC
  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: te
  text: అప్పుడు మోషే తన సహాయకుడైన[a] యెహోషువతో లేచాడు; మోషే దేవుని పర్వతానికి ఎక్కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సేవకుడైన.” హీబ్రూ పదం ఒకరికి తోడుండి సేవచేసే వ్యక్తిని సూచించగలదు; ఇక్కడ అది మోషేకు వ్యక్తిగతంగా సహాయం చేసే యెహోషువను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచాడు
  rationale: קום అనే క్రియ యొక్క కథన రూపం ఇక్కడ ‘లేచాడు’ అనే సహజ అర్థాన్ని ఇస్తుంది; బయలుదేరడాన్ని మాత్రమే సూచించేలా అతిగా వ్యాఖ్యానించదు.
- source_word: וִיהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో స్పష్టంగా పలకగల ప్రామాణిక రూపం.
- source_word: מְשָׁרְתוֹ
  choice: తన సహాయకుడు
  rationale: שׁרת వ్యక్తిగతంగా సేవచేస్తూ తోడుండే వ్యక్తిని సూచిస్తుంది. ‘సహాయకుడు’ యెహోషువ పాత్రను సహజ తెలుగులో తెలియజేస్తూ, బానిసత్వం లేదా మతపరమైన పదవి అనే అనవసర భావాలను నివారిస్తుంది.
- source_word: וַיַּעַל
  choice: మీదికి వెళ్లాడు
  rationale: עלה ఇక్కడ పర్వతాన్ని ఎక్కే పైదిశ కదలికను సూచిస్తుంది; ‘మీదికి వెళ్లాడు’ ఆధునిక తెలుగులో సహజంగా ఆ స్థలార్థాన్ని నిలుపుతుంది.
- source_word: הַר הָאֱלֹהִים
  choice: దేవుని పర్వతం
  rationale: హీబ్రూ పదబంధాన్ని నేరుగా, సహజంగా అందిస్తూ పర్వతానికి సంబంధించిన పవిత్ర ప్రాధాన్యాన్ని వివరణతో విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: מְשָׁרְתוֹలో మోషేకు యెహోషువకు మధ్య సంబంధం
  choice: యెహోషువను మోషే వ్యక్తిగత సహాయకుడిగా పేర్కొనడం
  alternative: సేవకుడు; పరిచారకుడు
  rationale: ఈ పదానికి సేవకు సంబంధించిన విస్తృత అర్థపరిధి ఉన్నా, స్వామ్య ప్రత్యయం మరియు కథన సందర్భం మోషేకు తోడుండి సహాయం చేసే పాత్రను సూచిస్తున్నాయి. ఇది బానిస లేదా ఆరాధనా సంబంధమైన అధికారపదవి అనే భావాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని రెండుసార్లు వచ్చే ‘మోషే’ను నిలిపి, క్రియల క్రమాన్ని స్పష్టంగా ఉంచాం. పాదసూచిక గుర్తును సంబంధిత పదబంధం వద్ద కాకుండా వాక్యాంతంలో ఉంచడం కంటే, ప్రధాన పాఠ్యంలో తప్పనిసరిగా కనిపించేలా చేర్చాం.
