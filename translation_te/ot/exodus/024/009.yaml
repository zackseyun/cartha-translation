  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలో లేని ‘కొండ’ను చేర్చకుండా దిశా భావాన్ని మాత్రమే వ్యక్తం చేశాం; జాబితాను తెలుగులో సహజంగా నిర్మించాం.
