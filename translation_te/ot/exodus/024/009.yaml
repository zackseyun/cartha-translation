  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: te
  text: అప్పుడు మోషే, అహరోను, నాదాబు, అబీహు, ఇశ్రాయేలు పెద్దలలో డెబ్బై మంది పైకి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లారు
  rationale: עלה అనే క్రియలోని పైకి కదలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. సందర్భంలో కొండ ఉద్దేశించబడినప్పటికీ, ఈ వచనంలో అది స్పష్టంగా లేకపోవడంతో ‘కొండపైకి’ అని చేర్చలేదు. హీబ్రూలో క్రియ ఏకవచనంగా ఉన్నా, వరుసగా పేర్కొన్న వారందరూ వెళ్లారనే భావాన్ని తెలుగులో సహజమైన బహువచన క్రియతో తెలిపాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וְאַהֲרֹן
  choice: అహరోను
  rationale: సంయోజకంతో కూడిన వ్యక్తినామం; జాబితా నిర్మాణాన్ని తెలుగులో విరామచిహ్నాలతో సహజంగా తెలిపాం.
- source_word: נָדָב
  choice: నాదాబు
  rationale: తెలుగు బైబిలు వాడుకలో పరిచితమైన వ్యక్తినామ రూపం.
- source_word: וַאֲבִיהוּא
  choice: అబీహు
  rationale: తెలుగు బైబిలు వాడుకలో పరిచితమైన వ్యక్తినామ రూపం.
- source_word: וְשִׁבְעִים
  choice: డెబ్బై మంది
  rationale: వ్యక్తులను లెక్కించే తెలుగు సహజ ప్రయోగానికి అనుగుణంగా ‘మంది’ చేర్చబడింది; సంఖ్య యథాతథంగా నిలిచింది.
- source_word: מִזִּקְנֵי
  choice: పెద్దలలో
  rationale: 'מן ఇక్కడ భాగార్థకంగా ఉంది: ఇశ్రాయేలు పెద్దల సమూహంలోనుంచి డెబ్బై మంది. ‘పెద్దలలో డెబ్బై మంది’ అనే రూపం ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.'
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: జనసమూహ నామానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం.
