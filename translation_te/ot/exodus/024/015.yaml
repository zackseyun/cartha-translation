  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: te
  text: అప్పుడు మోషే పర్వతం మీదికి ఎక్కాడు[a]; మేఘం పర్వతాన్ని కప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే పర్వతం వద్దకు వెళ్లాడు.” హీబ్రూ కథన సంధిని “మరియు” అని కూడా అనువదించవచ్చు; ఇక్కడి విభక్తిపదం “వద్దకు” అని, లేదా “ఎక్కాడు” అనే క్రియతో కలిపి “మీదికి” అనే భావంలో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: అప్పుడు ... ఎక్కి వెళ్లాడు
  rationale: עלה అంటే సాధారణంగా ‘పైకి వెళ్లడం/ఎక్కడం.’ కథనాన్ని ముందుకు నడిపించే וַ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఈ వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אֶל
  choice: మీదికి
  rationale: עלה మరియు ‘పర్వతం’తో కలిసి ఇది పర్వతం పైకి సాగే కదలికను సూచిస్తుంది; అయితే ‘దగ్గరికి’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: הָהָר
  choice: పర్వతం
  rationale: సీనాయి సందర్భంలో הַר కు సహజమైన, సంప్రదాయబద్ధమైన తెలుగు పదం.
- source_word: וַיְכַס
  choice: కప్పింది
  rationale: כסה యొక్క ప్రత్యక్ష అర్థమైన ‘కప్పడం’ను నిలుపుతుంది; ‘ఆవరించింది’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: మూలంలో నిర్దిష్టమైన మేఘాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ప్రత్యేక నిర్దేశక పదం లేకుండానే సందర్భం ఆ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది హీబ్రూ ప్రత్యక్ష కర్మ సూచకం; తెలుగులో ‘పర్వతాన్ని’ అనే విభక్తి రూపం ద్వారా దాని వాక్యపాత్ర వ్యక్తమవుతుంది.
theological_decisions:
- issue: మేఘం యొక్క స్వభావం
  choice: మూలంలోని సంయమనాన్ని పాటిస్తూ కేవలం ‘మేఘం’ అని అనువదించడం
  alternative: ‘దేవుని మహిమా మేఘం’ లేదా ‘యెహోవా మేఘం’
  rationale: విస్తృత సందర్భంలో ఈ మేఘం దైవసన్నిధితో ముడిపడి ఉన్నప్పటికీ, ఈ వచనం ‘మహిమ’ లేదా ‘యెహోవాది’ అని స్పష్టంగా చెప్పదు. కాబట్టి ఆ భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆరోహించాడు’ వంటి అతిగా గ్రాంథిక రూపానికి బదులు ‘ఎక్కి వెళ్లాడు’ వాడబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
