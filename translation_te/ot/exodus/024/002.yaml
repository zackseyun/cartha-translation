id: EXO.24.2
reference: Exodus 24:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: te
  text: మోషే ఒక్కడే యాహ్వే[a] దగ్గరకు రావాలి; వారు దగ్గరకు రాకూడదు; ప్రజలు అతనితో పాటు పైకి ఎక్కకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: יהוה (YHWH), దేవుని ప్రత్యేక నామం.'
    reason: మూలపాఠంలో నేరుగా ఉన్న దైవ నామాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: దగ్గరికి రావాలి
  rationale: נגשׁ అంటే ‘సమీపించు, దగ్గరికి రా.’ సందర్భంలోని ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘రావాలి’ తెలియజేస్తుంది.
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: మోషే ఒక్కడే
  rationale: לְבַדּוֹ సూచించే ప్రత్యేకతను—మోషే తప్ప మరెవరూ సమీపించకూడదనే భావాన్ని—స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל־יְהוָה
  choice: యెహోవా దగ్గరికి
  rationale: אֶל కదలికను లేదా సమీపాన్ని సూచిస్తుంది; దైవ నామమైన יהוהను తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: అయితే వారు దగ్గరికి రాకూడదు
  rationale: మొదటి భాగంలోని נגשׁతో పదసామ్యాన్ని నిలిపి, మోషేకు అనుమతించిన సమీపతను ఇతరులకు నిషేధించిన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: וְהָעָם
  choice: ప్రజలు
  rationale: హీబ్రూలో ఉన్న సాధారణ సమూహవాచకాన్నే అనువదించి, మూలంలో లేని ‘ఇశ్రాయేలు’ అనే వివరణను చేర్చలేదు.
- source_word: לֹא יַעֲלוּ עִמּוֹ
  choice: అతనితో కలిసి పైకి ఎక్కకూడదు
  rationale: עלה ఇక్కడ పర్వతం పైకి వెళ్లడాన్ని సూచిస్తుంది. ‘పైకి ఎక్కు’ భౌగోళిక కదలికను సహజంగా తెలియజేస్తుంది; עִמּוֹను ‘అతనితో కలిసి’గా స్పష్టం చేశాం.
theological_decisions:
- issue: దైవ నామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామమైన יהוה నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన ‘యెహోవా’గా ఇచ్చాం; ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆదేశ భావానికి ‘రావాలి/రాకూడదు/ఎక్కకూడదు’ రూపాలు వాడి, గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టతను కాపాడాం. ‘దగ్గరికి’ అనే పదాన్ని రెండుసార్లు ఉంచి హీబ్రూ మూలంలోని నגשׁ పునరుక్తిని నిలిపాం.
