source:
  edition: WLC
  text: וַ/יִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/תַ֣חַת רַגְלָ֗י/ו כְּ/מַעֲשֵׂה֙ לִבְנַ֣ת הַ/סַּפִּ֔יר וּ/כְ/עֶ֥צֶם הַ/שָּׁמַ֖יִם לָ/טֹֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: te
  text: వారు ఇశ్రాయేలు దేవుణ్ణి చూశారు. ఆయన పాదాల కింద నీలమణి[a] పలకలతో చేసిన నేలవంటిది[b] ఉంది; అది నిర్మలతలో ఆకాశమే అన్నంత స్వచ్ఛంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లాపిస్ లాజులి.’ ప్రాచీన లోకంలో סַפִּיר అనే పదం సూచించిన ఖనిజం ఏదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధానికి అక్షరార్థంగా, ‘నీలమణి ఇటుక/పలక నిర్మాణంవంటిది’; ఆయన పాదాల కింద నైపుణ్యంగా అమర్చిన ఇటుకలు లేదా పలకల వంటి ఉపరితలాన్ని ఈ చిత్రం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: వారు ... చూశారు
  rationale: ראה అనే క్రియ ఇక్కడ ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది. మూలంలోని స్పష్టమైన వాదనను తగ్గించకుండా సాధారణ ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుణ్ణి
  rationale: ప్రత్యక్ష కర్మగా ఉన్న నిర్దిష్ట సంధి పదబంధాన్ని సహజమైన తెలుగులో అనువదిస్తుంది.
- source_word: וְתַחַת רַגְלָיו
  choice: ఆయన పాదాల కింద ... ఉంది
  rationale: תחת కు ‘కింద’ అనే ప్రత్యక్ష అర్థం ఇచ్చి, హీబ్రూలో క్రియలేని వాక్యభాగానికి తెలుగులో సహజత కోసం ‘ఉంది’ చేర్చాం. శరీరరూప వర్ణనను అలాగే నిలిపాం.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: పలకలతో చేసిన నేలవంటిది
  rationale: మూలంలోని ‘పని/నిర్మాణం’ మరియు ఇటుక లేదా పలకల వంటి అమరిక అనే భావాలను దృశ్యానికి సరిపోయే సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַסַּפִּיר
  choice: నీలమణి
  rationale: సంప్రదాయంగా ‘సఫైర్’ అని గుర్తించే రత్నానికి సాధారణ తెలుగు పదాన్ని వాడాం; పురాతన ఖనిజపు ఖచ్చిత గుర్తింపు అనిశ్చితమని పాదసూచికలో తెలిపాం.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: ఆకాశమే అన్నట్టుగా
  rationale: עֶצֶם ఇక్కడ ‘ఎముక’ అనే అక్షరార్థంలో కాక, ఆకాశం దానంతట అదే అన్న బలాన్ని ఇస్తుంది. ‘ఆకాశమే’ ఆ ఉద్ఘాటనను తెలుగులో నిలుపుతుంది.
- source_word: לָטֹהַר
  choice: నిర్మలతలో
  rationale: టֹהַר లోని స్వచ్ఛత, స్పష్టత అనే దృశ్యభావాన్ని గంభీరమైన కానీ అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దేవుణ్ణి దర్శించినట్లు చెప్పే శరీరరూప దృశ్యభాష
  choice: ‘ఇశ్రాయేలు దేవుణ్ణి చూశారు’, ‘ఆయన పాదాల కింద’ అని నేరుగా నిలిపాం.
  alternative: ‘ఇశ్రాయేలు దేవుని ప్రత్యక్షతను చూశారు’ లేదా ‘దేవుడు నిలిచిన స్థలాన్ని చూశారు’ అని వివరణాత్మకంగా మార్చడం.
  rationale: హీబ్రూ వచనం దేవుణ్ణి చూశారని నేరుగా చెబుతూ ఆయన పాదాల కింద ఉన్నదాన్ని వర్ణిస్తుంది. ‘ప్రత్యక్షత మాత్రమే’ వంటి వివరణను చొప్పించకుండా మూలంలోని వేదాంత ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలతో గంభీరతను నిలిపాం. ‘చూశారు’ మరియు ‘పాదాలు’ అనే నేరమైన దృశ్యభాషను మృదూకరించలేదు. పాదసూచిక గుర్తులను అవి వివరించే ‘నీలమణి’ మరియు ‘పలకలతో చేసిన నేలవంటిది’ వద్ద ఉంచాం.
