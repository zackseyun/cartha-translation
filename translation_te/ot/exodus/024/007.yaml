  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: te
  text: అప్పుడు అతడు నిబంధన గ్రంథాన్ని తీసుకొని ప్రజలకు వినిపించేలా చదివాడు. వారు, “యెహోవా చెప్పినదంతా మేము చేస్తాం; వింటాం[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విధేయులమవుతాం.” హెబ్రీ క్రియకు “వినడం, శ్రద్ధగా ఆలకించడం” అనే అర్థాలతో పాటు, నిబంధన సందర్భాల్లో “విధేయత చూపడం” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అప్పుడు అతడు ... తీసుకొని
  rationale: వయ్యిక్టోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: סֵפֶר הַבְּרִית
  choice: నిబంధన గ్రంథం
  rationale: వ్రాతపూర్వక నిబంధన పత్రం అనే స్పష్టమైన భావాన్ని, గంభీరమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: ప్రజలకు వినిపించేలా చదివాడు
  rationale: వ్రాతపత్రాన్ని బహిరంగంగా ప్రజల వినికిడిలో చదివాడనే హెబ్రీయ ఇడియమ్‌ను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో సూచిస్తుంది.
- source_word: נַעֲשֶׂה
  choice: మేము చేస్తాం
  rationale: עשה అనే విస్తృతమైన, కార్యసూచక క్రియను వ్యాఖ్యానాత్మకంగా ‘లోబడతాం’ అని మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: וְנִשְׁמָע
  choice: వింటాం
  rationale: שׁמע యొక్క ప్రాథమిక వినికిడి భావాన్ని నిలుపుతూ, నిబంధన సందర్భంలోని విధేయత భావాన్ని పాదటిప్పణిలో సూచిస్తుంది.
theological_decisions:
- issue: నిబంధన ప్రతిస్పందన וְנִשְׁמָע యొక్క అర్థం
  choice: వింటాం
  alternative: విధేయులమవుతాం / లోబడతాం
  rationale: שׁמע అంటే ‘వినడం/శ్రద్ధగా ఆలకించడం’; నిబంధన సందర్భంలో అది ‘విధేయత చూపడం’ అనే విస్తృత భావాన్నీ కలిగి ఉంటుంది. వెంటనే ముందున్న బహిరంగ పఠన సందర్భం వల్ల వినికిడి భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, విధేయత భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే నిబంధన సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘వింటాం’ కొద్దిగా సంక్షిప్తమైన ప్రతిజ్ఞా శైలిని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
