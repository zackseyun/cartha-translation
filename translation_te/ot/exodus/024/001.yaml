- from: 'అప్పుడు ఆయన మోషేతో ఇలా అన్నాడు[a]: “నువ్వు, అహరోను, నాదాబు, అబీహు, ఇశ్రాయేలు పెద్దలలో డెబ్బైమంది యెహోవా దగ్గరికి ఎక్కి రండి; దూరం నుంచే సాష్టాంగపడండి.”'
  to: 'అప్పుడు ఆయన మోషేతో ఇలా అన్నాడు[a]: “నువ్వు అహరోను, నాదాబు, అబీహు, ఇశ్రాయేలు పెద్దలలో డెబ్బైమందితో కలిసి యెహోవా యొద్దకు ఎక్కి రా; మీరు దూరం నుండి వంగి నమస్కరించండి.”'
  rationale: The revision preserves the source's striking “to Yahweh” wording and its partitive expression for the seventy elders. It corrects the singular ascent imperative addressed to Moses while retaining the plural command for all those named to bow from a distance. The added “తో కలిసి” is an idiomatic Telugu connective needed to express the coordinated Hebrew list naturally; it does not add a distinct participant or alter the sense.
