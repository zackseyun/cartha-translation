source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: te
  text: 'అప్పుడు ఆయన మోషేతో ఇలా అన్నాడు[a]: “నువ్వు అహరోను, నాదాబు, అబీహు, ఇశ్రాయేలు పెద్దలలో డెబ్బైమందితో కలిసి యెహోవా యొద్దకు ఎక్కి రా; మీరు దూరం నుండి వంగి నమస్కరించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “యెహోవా యొద్దకు ఎక్కి రా” అని ఉంది. మాట్లాడుతున్నది యెహోవాయే అయినప్పటికీ పాఠ్యం ఈ ప్రయోగాన్నే ఉంచుతుంది; కొన్ని అనువాదాలు దీనిని “నా దగ్గరికి” లేదా “యెహోవా సన్నిధికి” అని సవరించి చెబుతాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: అప్పుడు ఆయన మోషేతో ఇలా అన్నాడు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘మోషేతో అన్నాడు’ అయినా, మునుపటి సందర్భంతో అనుసంధానమైన కొత్త వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేయడానికి ‘అప్పుడు’ వాడబడింది. క్రియలోని మూడవ పురుష ఏకవచన కర్తను సందర్భానుసారం ‘ఆయన’గా తెలిపాం.
- source_word: עֲלֵה
  choice: ఎక్కి రండి
  rationale: עלה ఆజ్ఞారూపం పైకి వెళ్లడం లేదా రావడం అనే భావాన్ని ఇస్తుంది. పర్వతంపై దైవసన్నిధికి సమీపించమనే సందర్భంలో ‘ఎక్కి రండి’ సహజంగా ఉంది; తరువాత పేర్కొన్న సమూహాన్నంతటినీ ఉద్దేశించిన భావాన్ని తెలుగులో బహువచన మర్యాదారూపం స్పష్టం చేస్తుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవా దగ్గరికి
  rationale: אֶל సమీపించే దిశను సూచిస్తుంది. దైవనామమైన יהוהను తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’గా లిప్యంతరీకరించాం. మాట్లాడుతున్నది యెహోవాయే అయినప్పటికీ మూలంలో ఉన్న మూడవ పురుష ప్రయోగాన్ని మార్చలేదు.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: నువ్వు, అహరోను, నాదాబు, అబీహు
  rationale: ప్రత్యేకంగా ఉన్న אַתָּה మోషేను జాబితాలో ముందుగా ఉద్ఘాటిస్తుంది. పేర్లను తెలుగులో సుపరిచితమైన రూపాల్లో ఇచ్చాం.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలలో డెబ్బైమంది
  rationale: מן నిర్మాణం మొత్తం పెద్దల సమూహంలోనుంచి ఎంపికైన డెబ్బైమందిని సూచించే భాగార్థక ప్రయోగం. ‘పెద్దలలో డెబ్బైమంది’ ఆ సూక్ష్మార్థాన్ని నిలుపుతుంది.
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: సాష్టాంగపడండి
  rationale: ఈ క్రియ భక్తిపూర్వకంగా వంగడం లేదా నేలపై సాగిలపడడం అనే శారీరక చర్యను సూచిస్తుంది. ‘సాష్టాంగపడండి’ దాని తీవ్రతను సహజంగా తెలియజేస్తూ, దానిని కేవలం సాధారణ ‘ఆరాధన’గా వ్యాఖ్యానించదు.
- source_word: מֵ/רָחֹק
  choice: దూరం నుంచే
  rationale: దైవసన్నిధికి వారు చేరగల పరిమితిని సూచించే స్థలదూరాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ‘నుంచే’ ఆ పరిమితిని సహజ తెలుగులో నొక్కిచెబుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక ఒడంబడిక నామమైన చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: యెహోవాయే మాట్లాడుతున్న సందర్భంలో ‘యెహోవా దగ్గరికి’ అనే మూడవ పురుష ప్రయోగం
  choice: మూలంలోని ‘యెహోవా దగ్గరికి’ అనే ప్రయోగాన్ని నిలుపడం
  alternative: నా దగ్గరికి; యెహోవా సన్నిధికి
  rationale: మూల హీబ్రూ స్పష్టంగా אֶל־יְהוָה అని చెబుతుంది. దాన్ని ‘నా దగ్గరికి’గా మార్చితే పాఠ్యంలో ఉన్న అసాధారణతను, దాని వ్యాఖ్యానాత్మక ఉద్రిక్తతను అనువాదమే పరిష్కరించినట్టవుతుంది; అందుకే ప్రధాన పాఠ్యంలో దానిని నిలిపి పాదసూచికలో వివరించాం.
- issue: וְהִשְׁתַּחֲוִיתֶם యొక్క భావం
  choice: సాష్టాంగపడండి
  alternative: ఆరాధించండి; వంగి నమస్కరించండి
  rationale: క్రియలో భక్తిపూర్వక శారీరకంగా వంగడం లేదా సాగిలపడడం ప్రధానంగా ఉంది. ‘ఆరాధించండి’ అని మాత్రమే ఇస్తే చర్యను ముందుగానే మతాచార భావానికి పరిమితం చేసే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పెద్దలు,’ ‘దూరం నుంచే’ వంటి సాధారణ పదాలతో పాఠ్యం సులభంగా ఉండేలా చూసి, ‘సాష్టాంగపడండి’ ద్వారా మూలంలోని భక్తిపూర్వక శారీరక చర్యను నిలిపాం. మోషేను ఉద్దేశించిన ఏకవచన ‘నువ్వు’తో జాబితాను ప్రారంభించి, సమూహ ఆజ్ఞను తెలుగులో సహజమైన బహువచన ‘ఎక్కి రండి/సాష్టాంగపడండి’ రూపాల్లో ఇచ్చాం.
