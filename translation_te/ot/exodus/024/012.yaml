id: EXO.24.12
reference: Exodus 24:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “కొండపైకి నా దగ్గరికి ఎక్కి రా; అక్కడే ఉండు. రాతి పలకలను, ధర్మశాస్త్రాన్ని, ఆజ్ఞను[a] నీకు ఇస్తాను; వారిని బోధించడానికి నేను వాటిని వ్రాశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ధర్మశాస్త్రం, ఆజ్ఞ” అనేవి రాతి పలకలతో పాటు ఇచ్చే నిబంధన బోధను సూచించవచ్చు; లేదా పలకలపై వ్రాయబడిన విషయాన్నే మరింత వివరించవచ్చు. ఇక్కడ “ధర్మశాస్త్రం”గా అనువదించిన హీబ్రూ పదానికి “బోధ” లేదా “ఉపదేశం” అనే అర్థం కూడా ఉంది.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: కొండ మీద నా దగ్గరికి ఎక్కి రా
  rationale: עלה ఆజ్ఞార్థక రూపం, אֵלַי (‘నా దగ్గరికి’), దిశాసూచక הָהָרָה భావాలను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: וֶהְיֵה שָׁם
  choice: అక్కడే ఉండు
  rationale: కేవలం అక్కడ ఉండడమే కాక అక్కడ కొనసాగి ఉండాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֻחֹת הָאֶבֶן
  choice: రాతి పలకలు
  rationale: మూలంలోని నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: וְהַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: సీనాయి నిబంధన సందర్భంలో గుర్తించదగిన తెలుగు పదం; תּוֹרָהకు ‘బోధ/ఉపదేశం’ అనే విస్తృత భావం కూడా ఉందని పాదసూచికలో తెలిపాం.
- source_word: וְהַמִּצְוָה
  choice: ఆజ్ఞ
  rationale: మూలంలోని ఏకవచనాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగు రూపాన్ని వాడాం.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: నేను రాశాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ సూచించే పూర్తయిన దైవిక రచనను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לְהוֹרֹתָם
  choice: ప్రజలకు బోధించడానికి
  rationale: ירה హిఫీల్ ధాతురూపంలోని ‘బోధించు/ఉపదేశించు’ అనే ప్రయోజనార్థాన్ని చూపుతుంది; బహువచన ప్రత్యయం సందర్భానుసారం ఇశ్రాయేలు ప్రజలను సూచిస్తుంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం, ఆజ్ఞ’కు రాతి పలకలతో ఉన్న సంబంధం
  choice: మూడు సమన్వయ పదబంధాలను జాబితా నిర్మాణంలో వేరుగా నిలిపాం.
  alternative: ‘ధర్మశాస్త్రం, ఆజ్ఞ’ అనేవి రాతి పలకలలో వ్రాయబడిన విషయాన్ని వివరిస్తున్న సమానాధికార పదాలుగా తీసుకోవచ్చు.
  rationale: హీబ్రూ సమన్వయ నిర్మాణం ఈ రెండింటిలో దేనినీ ఖచ్చితంగా తేల్చదు; అందువల్ల అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని సమన్వయ నిర్మాణాన్ని కాపాడుతూ, అస్పష్టతను పాదసూచికలో తెలిపాం.
