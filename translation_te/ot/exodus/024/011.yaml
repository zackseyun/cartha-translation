revisions:
- from: కాని ఇశ్రాయేలు కుమారులలోని ప్రముఖుల మీద ఆయన తన చెయ్యి చాపలేదు. వారు దేవుణ్ణి చూశారు[a]; వారు తిని తాగారు.
  to: కాని ఇశ్రాయేలీయుల ప్రముఖులపై ఆయన తన చెయ్యిని చాచలేదు. వారు దేవుణ్ణి చూశారు[a], తిని తాగారు.
  rationale: The revision improves modern Telugu idiom and grammar without altering the verse’s meaning. It maintains the explicit divine subject, the hand-against idiom, the direct assertion that the representatives saw God, and the simple sequential meal statement. The footnote is narrowed to a defensible lexical alternative.
  reviewer_model: gpt-5.6-terra
