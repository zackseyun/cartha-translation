id: EXO.24.11
reference: Exodus 24:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: te
  text: కాని ఇశ్రాయేలీయుల ప్రముఖులపై ఆయన తన చెయ్యిని చాచలేదు. వారు దేవుణ్ణి చూశారు[a], తిని తాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు దేవుణ్ణి దర్శించారు’; ఈ క్రియకు చూడడం లేదా దర్శించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: మీద
  rationale: שָׁלַח יָד అనే ప్రయోగంతో కలిసినప్పుడు ఇది హాని చేయడానికి వ్యతిరేకంగా చెయ్యి చాపడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘మీద ... చెయ్యి చాపలేదు’ ఆ భావాన్నీ రూపకాన్నీ సహజంగా నిలుపుతుంది.
- source_word: אֲצִילֵי
  choice: ప్రముఖులు
  rationale: సమాజంలోని విశిష్టమైన లేదా ప్రతినిధులైన వ్యక్తులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రముఖులు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ మూలంలోని కుటుంబసంబంధ వ్యక్తీకరణను స్పష్టంగా నిలుపుతుంది; ఇక్కడ ‘లోని’తో కలిపి సమూహానికి చెందిన ప్రముఖులను సూచిస్తుంది.
- source_word: שָׁלַח יָדוֹ
  choice: తన చెయ్యి చాపలేదు
  rationale: తీర్పు లేదా హాని చేయడాన్ని సూచించే మూలరూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘కొట్టలేదు’ అని మార్చకుండా నిలుపుతుంది.
- source_word: וַיֶּחֱזוּ
  choice: చూశారు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థాన్ని సరళమైన ఆధునిక తెలుగులో ఇస్తుంది; దీర్ఘంగా లేదా తదేకంగా చూడడం అనే సాధ్యమైన గాఢ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶת הָאֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఇది ఇశ్రాయేలు దేవుణ్ణి ప్రత్యక్ష కర్మగా సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి తగిన ద్వితీయా విభక్తి వాడబడింది.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: వారు తిని తాగారు
  rationale: రెండు వరుస క్రియలను సహజమైన తెలుగు సంయుక్త క్రియారూపంలో సూటిగా అందిస్తుంది.
theological_decisions:
- issue: ‘తన చెయ్యి చాపలేదు’ అనే క్రియకు కర్త
  choice: సందర్భానుసారం దేవుడే కర్త అని ‘ఆయన’తో స్పష్టం చేయడం
  alternative: కర్తను తెలుగులో కూడా సూచించకుండా ఉంచడం
  rationale: హీబ్రూలో కర్త క్రియారూపంలో అంతర్లీనంగా ఉన్నా, సమీప సందర్భంలో దేవుడే స్పష్టమైన కర్త. ‘ఆయన’ అని చెప్పడం కొత్త దైవశాస్త్ర వాదాన్ని చేర్చకుండా తెలుగు పాఠకునికి వాక్యాన్ని స్పష్టం చేస్తుంది.
- issue: దైవదర్శనాన్ని వ్యక్తీకరించడం
  choice: ‘వారు దేవుణ్ణి చూశారు’ అని నేరుగా అనువదించడం
  alternative: ‘వారు దేవుని ప్రత్యక్షతను చూశారు’ లేదా ‘వారు దేవుణ్ణి దర్శించారు’
  rationale: మూలపాఠం దేవుణ్ణి చూశారని నేరుగా చెబుతుంది. ఇతర వాక్యాలతో కనిపించే దైవశాస్త్ర ఉద్రిక్తతను తగ్గించేందుకు ‘ప్రత్యక్షత’ వంటి పదాన్ని చేర్చకుండా మూలంలోని వాదనను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చెయ్యి చాపలేదు’ అనే మూలరూపకం నిలుపబడింది; ‘దేవుణ్ణి చూశారు’ అనే దైవశాస్త్ర ఉద్రిక్తతను వ్యాఖ్యానంతో తగ్గించలేదు. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
