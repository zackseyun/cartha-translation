  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: te
  text: మోషే యాహ్వే మాటలన్నిటినీ రాశాడు. అతడు ఉదయాన్నే లేచి, కొండ పాదం వద్ద ఒక బలిపీఠాన్నీ, ఇశ్రాయేలు పన్నెండు గోత్రాలకు అనుగుణంగా పన్నెండు స్తంభాలనూ నిర్మించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పన్నెండు నిలువురాళ్లను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: రాసి ఉంచాడు
  rationale: כתב అంటే ‘రాయడం.’ ఇక్కడ పలికిన మాటలను లిఖితంగా నమోదు చేసిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: యెహోవా చెప్పిన మాటలన్నిటినీ
  rationale: דִּבְרֵי యొక్క ప్రాథమిక అర్థమైన ‘మాటలు’ను నిలుపుతూ, ఇవి యెహోవా పలికిన మాటలని తెలుగులో సహజంగా స్పష్టం చేస్తుంది; ‘ఆజ్ఞలు’ అని పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: שׁכם హిఫిల్ రూపం ‘పొద్దున్నే లేవడం’ అనే భావాన్ని ఇస్తుంది; בַּבֹּקֶרతో కలిపి కాల సూచనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని ... కట్టించాడు
  rationale: בנה + מזבחకు సహజమైన తెలుగు సమానార్థకం. వాక్యాంతంలోని రెండు నిర్మాణ వస్తువులకు ఒకే క్రియ వర్తించేలా తెలుగు వాక్య నిర్మాణం అమర్చబడింది.
- source_word: תַּחַת הָהָר
  choice: కొండ పాదం దగ్గర
  rationale: అక్షరార్థంగా ‘కొండ కింద’; ఈ స్థల సందర్భంలో కొండ అడుగు భాగం లేదా పాదం దగ్గర అనే భావమే సహజం.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: పన్నెండు రాతి స్తంభాలను
  rationale: מַצֵּבָה నిలబెట్టిన రాయి లేదా స్తంభాన్ని సూచిస్తుంది. ‘రాతి స్తంభాలు’ పదార్థాన్నీ నిలువుగా నిలబెట్టిన స్వభావాన్నీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పన్నెండు గోత్రాలకు ప్రతిగా
  rationale: לְ ఇక్కడ అనురూపత లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది; ప్రతి స్తంభం ఒక గోత్రానికి ప్రతిగా ఉన్న భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం. ‘యాహ్వే’ పండితుల పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉన్నప్పటికీ, ఆధునిక సాధారణ తెలుగు పాఠకులకు గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: స్తంభాల ప్రాతినిధ్య సంబంధం
  choice: గోత్రాలకు ప్రతిగా
  alternative: గోత్రాల కోసం
  rationale: לְ యొక్క సంబంధాన్ని కేవలం ప్రయోజనార్థకంగా కాకుండా పన్నెండు స్తంభాలు పన్నెండు గోత్రాలకు అనురూపంగా ఉన్నాయని తెలిపేలా అనువదించాం; అంతకుమించి ఆచారపరమైన అర్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
