id: EXO.24.14
reference: Exodus 24:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: te
  text: 'అతడు పెద్దలతో ఇలా అన్నాడు: “మేము మీ దగ్గరికి తిరిగి వచ్చేవరకు మీరు ఇక్కడే వేచి ఉండండి. ఇదిగో, అహరోను, హూరు మీతో ఉన్నారు. వివాదం ఉన్నవాడు[a] వారి దగ్గరికి వెళ్లాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయవ్యవహారం ఉన్నవాడు.”
    reason: בַעַל דְּבָרִים అనే నుడికారం వివాదంతో పాటు విచారణకు తేవలసిన న్యాయపరమైన వ్యవహారం లేదా దావాను కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఇక్కడ ఈ పదం కేవలం వృద్ధులను కాక, సమాజంలో గుర్తింపు పొందిన పెద్దలను సూచిస్తుంది.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: మేము ... వచ్చేవరకు మీరు ఇక్కడే వేచి ఉండండి
  rationale: ישׁב అక్షరార్థంగా ‘కూర్చోవడం/ఉండడం’ అని అర్థమిచ్చినా, ఈ ఆదేశ సందర్భంలో మోషే తిరిగి వచ్చేవరకు అక్కడే ఉండి వేచి చూడాలనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: మేము మీ దగ్గరికి తిరిగి వచ్చేవరకు
  rationale: שוב యొక్క ‘తిరిగి రావడం’ అనే భావాన్ని, బహువచన కర్తను స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే విషయంపై దృష్టి పెట్టించే హీబ్రూ సంభాషణ సూచకానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: עִמָּכֶם
  choice: మీతో ఉన్నారు
  rationale: సహవాసం లేదా సమక్షాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מִי בַעַל דְּבָרִים
  choice: వివాదం ఉన్నవాడు
  rationale: ఈ హీబ్రూ నుడికారం న్యాయపరమైన విషయం, దావా లేదా వివాదంలో ఉన్న వ్యక్తిని సూచిస్తుంది; ‘వివాదం’ దాని సందర్భోచిత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: వారి దగ్గరికి వెళ్లాలి
  rationale: అసంపూర్ణ క్రియకు ఇక్కడ ఉన్న ఆదేశాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, అహరోను మరియు హూరును ఆశ్రయించాలనే దిశను నిలుపుతుంది.
theological_decisions:
- issue: న్యాయ సూచనలో ఏకవచన సాధారణ కర్త
  choice: వివాదం ఉన్నవాడు ... వెళ్లాలి
  alternative: వివాదం ఉన్నవారు ... వెళ్లాలి
  rationale: హీబ్రూ מִי ... יִגַּשׁ ఏకవచన సాధారణ నిర్మాణాన్ని ఉపయోగిస్తుంది. తెలుగు ఎంపిక దానిని ఏకవచనంలో నిలుపుతూ, అవసరానికి మించి లింగాన్ని ముందుకు తేవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి-ఆకర్షణను నిలుపుతుంది; ‘వేచి ఉండండి’ సందర్భానుసార ఆదేశాన్ని సహజంగా వ్యక్తపరుస్తుంది.
