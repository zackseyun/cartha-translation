translation:
  language: te
  text: బల్లను మోయడానికి కర్రలను చొప్పించే ఆధారాలుగా[b] ఆ ఉంగరాలు చట్రానికి ఎదురుగా[a] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రం పక్కన,’ లేదా ‘చట్రానికి సరిపడే స్థానంలో.’ హీబ్రూ పదం ఖచ్చితమైన అమరికను నిర్దేశించకుండా సాపేక్ష స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘కర్రలకు ఇళ్లుగా’; అంటే కర్రలను చొప్పించి ఉంచే తొడుగులు లేదా ఆధారాలుగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: ఎదురుగా
  rationale: ఈ పదబంధం చట్రంతో ఉంగరాల సాపేక్ష స్థానాన్ని సూచిస్తుంది. ఖచ్చితమైన అమరికను అతిగా నిర్ధారించకుండా ప్రధాన స్థలార్థాన్ని ‘ఎదురుగా’ తెలియజేస్తుంది.
- source_word: הַמִּסְגֶּרֶת
  choice: చట్రం
  rationale: బల్ల చుట్టూ ఉన్న నిర్మాణ భాగాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: תִּהְיֶיןָ
  choice: ఉండాలి
  rationale: నిర్మాణానికి సంబంధించిన ఆదేశ సందర్భంలో హీబ్రూ భవిష్యత్/అస్తిత్వ క్రియను తెలుగులో విధ్యర్థకంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַטַּבָּעֹת
  choice: ఉంగరాలు
  rationale: మోతకర్రలను చొప్పించడానికి పరిశుద్ధ గుడారపు సామగ్రికి అమర్చిన లోహపు రింగులను సూచించే ప్రామాణిక పదం.
- source_word: לְבָתִּים
  choice: చొప్పించే ఆధారాలుగా
  rationale: అక్షరార్థంగా ‘ఇళ్లుగా’ ఉన్న రూపకం ఇక్కడ మోతకర్రలను ఉంచే తొడుగులు లేదా ఆధారాలను సూచిస్తుంది; క్రియాత్మక అర్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: לְבַדִּים
  choice: మోతకర్రలను
  rationale: పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది; ‘మోతకర్రలు’ వాటి విధిని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: לָשֵׂאת
  choice: మోయడానికి
  rationale: ప్రయోజనాన్ని తెలిపే infinitive; ఈ సందర్భంలో సహజమైన తెలుగు రూపం.
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: ఈ భాగంలో వర్ణించిన పవిత్ర గుడారపు బల్లకు సాధారణమైన, స్పష్టమైన తెలుగు పదం.
