  yaml_path: translation/ot/exodus/025/006.yaml
  text: oil for the light[a], spices for the anointing oil and for the incense of spices,
translation:
  language: te
  text: దీపం వెలిగించడానికి నూనె, అభిషేక తైలానికీ సుగంధ ధూపం[a]కూ కావలసిన సుగంధ ద్రవ్యాలు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సుగంధ ద్రవ్యాల ధూపం.”
    reason: హీబ్రూ పదబంధంలోని సమాస నిర్మాణాన్ని చూపించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: హీబ్రూ పదం సాధారణంగా ‘నూనె’ అని అర్థం. సందర్భంలో ఒలీవ నూనె ఉద్దేశించబడి ఉండవచ్చు, కానీ మూలపాఠం ఇక్కడ ‘ఒలీవ’ అని స్పష్టంగా చెప్పదు.
- source_word: לַמָּאֹר
  choice: దీపం వెలిగించడానికి
  rationale: మָאוֹר వెలుగు లేదా వెలిగించే సాధనాన్ని సూచిస్తుంది. గుడారంలోని దీపానికి కావలసిన నూనె అనే సందర్భార్థాన్ని ఈ సహజ తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: בְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: పవిత్ర తైలం, ధూపం తయారీలో ఉపయోగించే పరిమళభరిత పదార్థాలను సూచించే స్పష్టమైన, ప్రస్తుత తెలుగు పదబంధం.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం కోసం
  rationale: ప్రత్యేకంగా అభిషేకానికి ఉపయోగించే పవిత్ర తైలాన్ని సూచిస్తుంది; ‘తైలం’ ఈ స్థిరమైన ఆరాధనా సందర్భంలో సహజంగా ఉంది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపం
  rationale: సుగంధ పదార్థాలతో తయారుచేసే ధూపాన్ని సహజ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది; హీబ్రూ నిర్మాణంలోని మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా కొనసాగింపును సూచించేలా చివర కామాను నిలిపాం. సాధారణ ‘నూనె’ను వాడి మూలంలో లేని ‘ఒలీవ’ను చేర్చలేదు; పవిత్ర అభిషేక సందర్భంలో సహజమైన ‘అభిషేక తైలం’ను ఉపయోగించాం.
