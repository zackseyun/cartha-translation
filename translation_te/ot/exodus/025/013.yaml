translation:
  language: te
  text: అకేసియా చెక్కతో మోతకర్రలను చేసి, వాటిపై బంగారు పొర వేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేసి … పొదిగించాలి
  rationale: ఆదేశాల వరుసలో ఈ రూపం విధిని తెలియజేస్తుంది. తెలుగులో సంయుక్త ఆదేశంగా సహజంగా ఉండేందుకు మొదటి క్రియను అసమాపక రూపంలో, చివరి క్రియను ‘చేయాలి’ భావంతో ఇచ్చాం.
- source_word: בַדֵּי
  choice: మోతకర్రలను
  rationale: మందసాన్ని మోయడానికి ఉపయోగించే పొడవైన కర్రలను సూచిస్తుంది; ‘మోతకర్రలు’ వాటి ప్రయోజనాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: שִׁטָּה ఒక అకేసియా జాతి చెట్టును సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וְצִפִּיתָ
  choice: పొదిగించాలి
  rationale: చెక్క ఉపరితలాన్ని బంగారంతో కప్పే పనిని సూచిస్తుంది; తెలుగు శిల్పకళా సందర్భంలో ‘పొదిగించు’ సహజంగా ఉంటుంది.
- source_word: אֹתָם
  choice: వాటికి
  rationale: బహువచనంలోని మోతకర్రలనే తిరిగి సూచిస్తుంది. తెలుగులో ‘వాటికి … పొదిగించాలి’ అనే నిర్మాణం సహజంగా ఉంది.
- source_word: זָהָב
  choice: బంగారు రేకు
  rationale: మూలంలో ‘బంగారం’ మాత్రమే ఉన్నప్పటికీ, చెక్కపై బంగారాన్ని కప్పే శిల్పక్రియను సహజ తెలుగులో స్పష్టంగా చెప్పడానికి ‘బంగారు రేకు’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆదేశ శైలి. ‘మోతకర్రలు’ కార్యాన్ని స్పష్టం చేస్తుంది; వాక్యం గంభీరతను నిలుపుకుంటూనే పురాతనమైన పదప్రయోగాలను నివారిస్తుంది.
