translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన నిర్దేశ శైలిని ఉపయోగించాం. ‘మోయబడాలి’ అనే సహజత తక్కువైన కర్మణి రూపానికి బదులుగా ప్రధాన పాఠ్యంలో ‘మోయాలి’ అని ఇచ్చి, మూలంలోని కర్మణి నిర్మాణాన్ని పాదసూచికలో చూపించాం.
