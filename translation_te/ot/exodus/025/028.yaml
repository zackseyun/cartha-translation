source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֶת הַ/בַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וְ/צִפִּיתָ֥ אֹתָ֖/ם זָהָ֑ב וְ/נִשָּׂא בָ֖/ם אֶת הַ/שֻּׁלְחָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: te
  text: ఆ కర్రలను అకేసియా చెక్కతో చేయాలి; వాటిని బంగారంతో పొదగాలి; వాటితో[a] బల్లను మోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి ద్వారా బల్ల మోయబడాలి.” హీబ్రూలోని ఉపసర్గ ఈ కర్రలు బల్లను మోయడానికి ఉపయోగించే సాధనాలని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేసి … చేయాలి
  rationale: నిర్దేశాల సందర్భంలో సంయోజకంతో వచ్చిన Qal perfect ఆజ్ఞార్థాన్ని వ్యక్తం చేస్తుంది. తెలుగులో వరుస పనులను సహజంగా తెలియజేయడానికి మొదటి క్రియను ‘చేసి’ అని, ప్రధాన ఆజ్ఞను ‘చేయాలి’ రూపంలో ఇచ్చాం.
- source_word: הַבַּדִּים
  choice: మోసే కర్రలు
  rationale: ఇక్కడ בַּדִּים బల్లను మోయడానికి ఉపయోగించే పొడవైన కర్రలను సూచిస్తుంది. ‘మోసే కర్రలు’ ఆధునిక పాఠకులకు వాటి ఉపయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్క
  rationale: שִׁטָּה అకేసియా జాతి చెట్టును సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో పరిచితమైన, సహజమైన ‘తుమ్మచెక్క’ను ఎంచుకున్నాం.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: వాటిని బంగారంతో కప్పాలి
  rationale: చేతిపని సందర్భంలో צפה ఒక వస్తువు మీద మరో పదార్థాన్ని పైపూతగా కప్పడాన్ని సూచిస్తుంది. ‘బంగారంతో కప్పాలి’ మూలార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וְנִשָּׂא בָם
  choice: ఆ కర్రలతో … మోయాలి
  rationale: נשא ఇక్కడ నిఫల్ రూపంలో ‘మోయబడాలి/మోయాలి’ అనే భావాన్ని ఇస్తుంది; בָם సాధనాన్ని సూచిస్తుంది. తెలుగు నిర్దేశ శైలిలో ‘ఆ కర్రలతో బల్లను మోయాలి’ సహజంగా ఉండి అదే సాధనార్థాన్ని నిలుపుతుంది.
- source_word: הַשֻּׁלְחָן
  choice: బల్ల
  rationale: ఇది ముందటి వచనాల్లో వివరించిన నిర్దిష్ట బల్లను సూచిస్తుంది. మూలంలో లేని వివరణను చేర్చకుండా ‘బల్ల’ అని మాత్రమే అనువదించాం.
