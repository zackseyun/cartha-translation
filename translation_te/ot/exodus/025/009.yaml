base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: te
  text: నేను నీకు చూపిస్తున్నదంతటి ప్రకారం—గుడారపు నమూనా, దాని సమస్త సామగ్రి నమూనా ప్రకారం—మీరు అలాగే చేయాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నమూనా’ అనే మాటకు ‘ప్రణాళిక,’ ‘మాదిరి,’ లేదా ‘రూపకల్పన’ అని కూడా అనువదించవచ్చు (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: ‘మీరు అలాగే చేయాలి’ అనే హీబ్రూ క్రియ బహువచనంలో ఉంది; ఇది మోషేతోపాటు ఈ పనికి బాధ్యత వహించేవారినీ సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: చూపిస్తున్నదంతా... సరిగ్గా దాని ప్రకారమే
  rationale: ఈ నిర్మాణం చూపించబడిన సమస్తానికి సన్నిహితమైన, ఖచ్చితమైన అనుగుణతను సూచిస్తుంది. సహజమైన తెలుగులో ఆ బలాన్ని వాక్యాంతంలోని ‘సరిగ్గా దాని ప్రకారమే’ వ్యక్తం చేస్తుంది.
- source_word: מַרְאֶה
  choice: నేను నీకు చూపిస్తున్న
  rationale: వర్తమాన కృదంత రూపానికి కొనసాగుతున్న ప్రత్యక్ష చూపును సూచించే ‘చూపిస్తున్న’ సహజమైన సమానార్థకం.
- source_word: תַּבְנִית
  choice: నమూనా
  rationale: రూపం, ఆకృతి, నిర్మాణ నమూనా అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం మాటల ప్రణాళికగానో భౌతిక సూక్ష్మ నమూనాగానో అర్థాన్ని కుదించదు.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు గుడారం
  rationale: నివాసం అనే మూలభావంతో పాటు నిర్గమకాండలోని పవిత్ర గుడారాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా సూచిస్తుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతటి
  rationale: పాత్రలు, పరికరాలు, ఇతర పవిత్ర వస్తువులన్నిటినీ కలుపుకొనే כֵּלִים పదపు విస్తృతిని ‘సామగ్రి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְכֵן
  choice: దాని ప్రకారమే
  rationale: చూపించిన నమూనాకు అనుగుణంగా చేయాలనే విధానాత్మక ఫలితాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּעֲשׂוּ
  choice: మీరు చేయాలి
  rationale: హీబ్రూ రూపం రెండవ పురుష బహువచనం. ‘మీరు’ ద్వారా మోషేతోపాటు పనికి బాధ్యత వహించేవారినీ ఉద్దేశించిన బహువచనం నిలుస్తుంది.
theological_decisions:
- issue: תַּבְנִית పరలోకపు మూలరూపాన్ని స్పష్టంగా సూచించాలా?
  choice: నమూనా
  alternative: ప్రణాళిక / నమూనా రూపం / రూపకల్పన
  rationale: వచనం దేవుడు మోషేకు ఒక תַּבְנִית చూపిస్తున్నాడని చెబుతుంది; అది ఏ స్వరూపంలో ఉందో స్పష్టంగా నిర్వచించదు. ‘నమూనా’ బయల్పరచబడిన మూలరూపం కావచ్చనే అవకాశాన్ని ఉంచుతూ, హీబ్రూ కంటే మించిన తాత్త్విక నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మందిరపు గుడారం’ పవిత్ర గుడారపు సాంకేతిక భావాన్ని స్పష్టం చేస్తుంది. ఏకవచన ‘నీకు’ మరియు బహువచన ‘మీరు’ మధ్య హీబ్రూ మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది; పాదసూచికలు [a], [b] ప్రధాన పాఠ్యంలో ఉన్నాయి.
