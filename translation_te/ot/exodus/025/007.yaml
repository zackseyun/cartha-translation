  source_fidelity: 'మూల హీబ్రూలోని వస్తువుల క్రమం: (1) షోహమ్ రాళ్లు, (2) ఏఫోదు మరియు వక్షపటకానికి పొదగడానికి/అమర్చడానికి రాళ్లు. ముసాయిదాలో ‘ఏఫోదు కోసం, వక్షపటకం కోసం’ అనే పదాలు ముందుకు రావడం వల్ల అవి రెండు రకాల రాళ్లకూ వర్తిస్తున్నట్టుగా సందిగ్ధత ఏర్పడుతుంది. సవరించిన పాఠ్యం లామెడ్-ఉపసర్గల పరిధిని రెండవ రకమైన రాళ్లతో స్పష్టంగా కలుపుతుంది.'
