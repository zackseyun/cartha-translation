lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: గోమేధికపు రాళ్లు
  rationale: שֹׁהַם ఏ రత్నాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘గోమేధికము’ను ప్రధాన పాఠ్యంలో ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: אַבְנֵי מִלֻּאִים
  choice: పొదగడానికి రాళ్లు
  rationale: מִלֻּאִים ఇక్కడ ఆభరణంలో అమర్చే లేదా పొదిగే రాళ్లను సూచిస్తుంది. ‘పొదగడానికి రాళ్లు’ సహజమైన తెలుగులో వాటి ప్రయోజనాన్ని తెలియజేస్తుంది; తయారీ విధానాన్ని మితిమీరి నిర్దిష్టం చేయదు.
- source_word: לָאֵפֹד
  choice: ఏఫోదు కోసం
  rationale: אֵפוֹד యాజక వస్త్రానికి సాంకేతిక పేరు. దాని రూపం గురించి అనిశ్చితమైన వివరణ ఇవ్వకుండా లిప్యంతరీకరణను నిలిపాం.
- source_word: וְלַחֹשֶׁן
  choice: వక్షపటకం కోసం
  rationale: חֹשֶׁן యాజకుడు ఛాతిమీద ధరించే, రత్నాలు పొదిగిన వస్తువును సూచిస్తుంది. ‘వక్షపటకం’ దానిని కవచంగా తప్పుగా అర్థం చేసుకునే అవకాశాన్ని తగ్గిస్తూ గౌరవప్రదంగా, సంక్షిప్తంగా ఉంది.
