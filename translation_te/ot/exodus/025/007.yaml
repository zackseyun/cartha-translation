translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వస్తువుల జాబితాకు తగిన సంక్షిప్త నిర్మాణం వాడాం. మూలంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, సాంకేతిక పదమైన ‘ఏఫోదు’ను అలాగే ఉంచాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక సూచికకు అనుగుణమైన పాదసూచిక ఇచ్చాం.
