revisions:
- from: దాని నుండి బయలుదేరే ప్రతి రెండు కొమ్మల కింద ఒక మొగ్గ ఉండాలి—అలా దీపస్తంభం నుండి బయలుదేరే ఆరు కొమ్మలకు మూడు మొగ్గలు ఉండాలి.
  to: దాని నుండి బయలుదేరే రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి; దాని నుండి బయలుదేరే మరో రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి; దాని నుండి బయలుదేరే మరో రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి—దీపస్తంభం నుండి బయలుదేరే ఆరు కొమ్మల కోసం.
  rationale: The revision preserves the Hebrew's threefold parallel wording and its association of each rounded ornament with two branches, while using a term that better represents the ornamental 'knob' without imposing a more specific interpretation.
