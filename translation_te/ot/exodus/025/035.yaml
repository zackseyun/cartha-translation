  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: te
  text: దాని నుండి బయలుదేరే రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి; దాని నుండి బయలుదేరే మరో రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి; దాని నుండి బయలుదేరే మరో రెండు కొమ్మల కింద ఒక గుబ్బ ఉండాలి—దీపస్తంభం నుండి బయలుదేరే ఆరు కొమ్మల కోసం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: మొగ్గ
  rationale: మెనోరా అలంకరణలోని గుండ్రని మొక్క-ఆకార భాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, సందర్భానుకూలంగా ఉంటుంది.
- source_word: קָּנִים
  choice: కొమ్మలు
  rationale: దీపస్తంభం మధ్య కాండం నుండి పక్కలకు బయలుదేరే శాఖలను సూచించే సహజ తెలుగు పదం.
- source_word: מְנֹרָה
  choice: దీపస్తంభం
  rationale: ఏడు దీపాలు గల పవిత్ర దీపనిర్మాణాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ సూచన యొక్క పునరావృత భావాన్ని సంక్షిప్తంగా కానీ పూర్తిగా నిలుపుతూ అనువదించబడింది. 'దాని' అనే సర్వనామం దీపస్తంభాన్ని సూచిస్తుంది.
