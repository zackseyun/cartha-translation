id: EXO.25.14
reference: Exodus 25:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵֽבֵאתָ֤ אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֥את אֶת הָ/אָרֹ֖ן בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/014.yaml
  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: te
  text: మందసపు పక్కలపై ఉన్న ఉంగరాల్లో మోయే కర్రలను చొప్పించాలి; వాటితో మందసాన్ని మోయడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: దూర్చాలి
  rationale: בוא అనే క్రియకు మూలార్థం ‘తీసుకురావడం’ అయినా, ఇక్కడ కర్రలను ఉంగరాల్లో ఉంచే చర్యను సహజమైన తెలుగులో ‘దూర్చాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַ/בַּדִּים
  choice: మోతకర్రలను
  rationale: בדים అనేది పవిత్ర సామగ్రిని మోయడానికి ఉపయోగించే కర్రలను సూచిస్తుంది; ‘మోతకర్రలు’ వాటి ప్రయోజనాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: בַּ/טַּבָּעֹת
  choice: ఉంగరాల్లో
  rationale: ఈ సందర్భంలో ב ప్రదేశంతో పాటు లోపలికి చొప్పించే భావాన్ని సూచిస్తుంది; ‘దూర్చాలి’ అనే క్రియతో కలిసి ‘ఉంగరాల్లో’ సహజంగా ఉంటుంది.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: మందసం పక్కలనున్న
  rationale: צלעות ఇక్కడ మందసం యొక్క పక్క భాగాలను సూచిస్తుంది; ఉంగరాల స్థానాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ఈ నిర్మాణం వాడబడింది.
- source_word: הָ/אָרֹן
  choice: మందసం
  rationale: אָרוֹן ప్రాథమికంగా పెట్టె లేదా మందసాన్ని సూచిస్తుంది; ప్రత్యక్ష వస్తువును ఆధునిక తెలుగులో స్పష్టంగా తెలిపే గౌరవప్రదమైన పదంగా ‘మందసం’ ఎంచుకోబడింది.
- source_word: לָ/שֵׂאת
  choice: మోయాలి
  rationale: נשא ఇక్కడ భౌతికంగా మోయడాన్ని సూచిస్తుంది; ‘మోయాలి’ సహజమైన ఆధునిక తెలుగు.
- source_word: בָּ/הֶם
  choice: వాటితో
  rationale: సర్వనామం మోతకర్రలను సూచించి, అవే మందసాన్ని మోయడానికి సాధనమని తెలియజేస్తుంది; కరణార్థక భావాన్ని ‘వాటితో’ సరిగ్గా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆజ్ఞాత్మక భావాన్ని గౌరవప్రదంగా మరియు సంక్షిప్తంగా వ్యక్తం చేశాం. హీబ్రూ వాక్యంలోని రెండు కార్యాలు—కర్రలను ఉంగరాల్లో ఉంచడం, వాటితో మందసాన్ని మోయడం—స్పష్టంగా నిలుపబడ్డాయి.
