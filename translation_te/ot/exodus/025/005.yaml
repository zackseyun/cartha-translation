  yaml_path: translation/ot/exodus/025/005.yaml
  text: ram skins dyed red[a], fine leather skins, and acacia wood,
translation:
  language: te
  text: ఎరుపు రంగు వేసిన పొట్టేళ్ల చర్మాలు, తహషీమ్ చర్మాలు[a], అకేషియా చెక్క,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలోని תְּחָשִׁים (తహషీమ్) ఏ పదార్థాన్ని లేదా ఏ జంతువు చర్మాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. దుగోంగ్ చర్మాలు, పోర్పస్ చర్మాలు, లేదా ఒక రకమైన తోలు అనే అర్థాలు ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: చర్మాలు / తోలు
  rationale: עוֹר అనే పదం జంతు చర్మాలను పదార్థంగా సూచిస్తుంది. పొట్టేళ్ల విషయంలో ‘చర్మాలు’ స్పష్టంగా ఉండగా, తరువాతి అనిశ్చిత పదబంధంలో సహజమైన తెలుగు కోసం ‘తోలు’ వాడబడింది.
- source_word: אֵילִם
  choice: పొట్టేళ్లు
  rationale: אֵילִם అనేది మగ గొర్రెలను సూచిస్తుంది; ‘పొట్టేళ్ల చర్మాలు’ ఆధునిక తెలుగులో సహజమైన పదబంధం.
- source_word: מְאָדָּמִים
  choice: ఎరుపు రంగు వేసిన
  rationale: ఈ రూపం సహజంగా ఎర్రగా ఉన్న చర్మాలను కాకుండా, ఎరుపుగా చేయబడిన చర్మాలను సూచిస్తుంది. అందువల్ల రంగు ప్రక్రియను స్పష్టంగా తెలిపే అనువాదం ఎంచుకోబడింది.
- source_word: עֹרֹת תְּחָשִׁים
  choice: నాణ్యమైన తోలు
  rationale: תְּחָשִׁים యొక్క ఖచ్చితమైన జంతు లేదా పదార్థ సూచన తెలియదు. నిర్దిష్ట జంతువును ఊహించకుండా, గుడారపు కప్పుకు ఉపయోగించే మెరుగైన తోలు అనే భావాన్ని పాఠ్యంలో ఇచ్చి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మ చెక్క
  rationale: שִׁטִּים సాధారణంగా అకేషియా జాతి చెట్టుగా గుర్తించబడుతుంది. తెలుగు బైబిలు సందర్భంలో సుపరిచితమైన ‘తుమ్మ చెక్క’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పదజాలం వాడబడింది. మూలంలోని వస్తువుల జాబితా నిర్మాణం మరియు చివరి విరామ స్వరూపం నిలుపబడ్డాయి; అనిశ్చితమైన תְּחָשִׁים పదానికి అతిగా నిర్దిష్టమైన జంతు గుర్తింపును పాఠ్యంలో విధించలేదు.
