- from: ఎరుపు రంగు వేసిన పొట్టేళ్ల చర్మాలు, నాణ్యమైన తోలు[a], తుమ్మ చెక్క,
  to: ఎరుపు రంగు వేసిన పొట్టేళ్ల చర్మాలు, తహషీమ్ చర్మాలు[a], అకేషియా చెక్క,
