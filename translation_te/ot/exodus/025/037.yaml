source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ אֶת נֵרֹתֶ֖י/הָ שִׁבְעָ֑ה וְ/הֶֽעֱלָה֙ אֶת נֵ֣רֹתֶ֔י/הָ וְ/הֵאִ֖יר עַל עֵ֥בֶר פָּנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: te
  text: నీవు దాని ఏడు దీపాలను చేయాలి. అతడు దాని దీపాలను అమర్చాలి, అవి దాని ముందువైపు వెలుగు ఇవ్వాలి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దాని దీపాలను వెలిగించాలి.” హెబ్రీ క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లేలా చేయడం’ అనే భావం ఉంది; ఈ సందర్భంలో అది దీపాలను స్థానంలో అమర్చడాన్ని గానీ, వెలిగించడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతడు” అనేది హెబ్రీలో మూడవ పురుష ఏకవచనం. ఇది దీపస్తంభాన్ని చూసుకునే యాజకుణ్ణి సూచించే అవకాశం ఉంది; అయితే ఈ వచనంలో కర్తను పేరుతో చెప్పలేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు చేయాలి
  rationale: ఆదేశ సందర్భంలో ఉన్న రెండవ పురుష ఏకవచన రూపం మోషేకు ఇచ్చిన నిర్దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నీవు చేయాలి’ సహజంగా ఆదేశ బలాన్ని నిలుపుతుంది.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: దాని ఏడు దీపాలు
  rationale: נֵרֹתֶיהָ అంటే దీపస్తంభానికి చెందిన దీపాలు; שִׁבְעָה సంఖ్యను నేరుగా ‘ఏడు’గా అనువదించాం.
- source_word: וְהֶעֱלָה אֶת־נֵרֹתֶיהָ
  choice: అతడు వాటిని వెలిగించాలి
  rationale: עלה హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకి లేపు/ఎక్కించు’ అనే భావం ఉన్నా, దీపాల ఆరాధనా సందర్భంలో వాటిని వెలిగించడం లేదా అమర్చడం అనే భావం రావచ్చు. తరువాతి వెలుగు ప్రసరణ ఫలితంతో ‘వెలిగించాలి’ సందర్భోచితం; 3వ పురుష పుంలింగ ఏకవచనాన్ని ‘అతడు’గా నిలిపాం.
- source_word: וְהֵאִיר
  choice: వెలుగు ప్రసరించేలా
  rationale: אור హిఫీల్ ఇక్కడ దీపాలను వెలిగించడం వల్ల కలిగే ఉద్దేశం లేదా ఫలితాన్ని తెలుపుతుంది. తెలుగు వాక్య నిర్మాణంలో ‘వెలుగు ప్రసరించేలా’ సహజంగా ఉంది.
- source_word: עַל־עֵבֶר פָּנֶיהָ
  choice: దాని ముందువైపు
  rationale: עֵבֶר మరియు פָּנִים కలయిక దీపస్తంభపు ముఖం/ముందుభాగానికి సంబంధించి వెలుగు వెళ్లే దిశను సూచిస్తుంది; ‘దాని ముందువైపు’ ఆ దిశాభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: దీపాలను వెలిగించే వ్యక్తి ఎవరు?
  choice: మూలంలోని మూడవ పురుష ఏకవచనాన్ని ‘అతడు’గా ఉంచడం
  alternative: యాజకుడు అని స్పష్టంగా పేర్కొనడం లేదా అనిర్దిష్ట బహువచనం వాడడం
  rationale: ఈ వచనంలో కర్తకు పేరు లేదు. సందర్భంలో యాజకుడు ఉద్దేశింపబడి ఉండవచ్చు గాని, అనువాదంలో పేరును చేర్చకుండా మూలంలోని వ్యాకరణ అస్పష్టతను కాపాడాం.
- issue: וְהֶעֱלָה క్రియ యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘వెలిగించాలి’
  alternative: ‘అమర్చాలి’ లేదా ‘పైకి ఎక్కించాలి’
  rationale: దీపాల సందర్భంలో వెలిగించడం సహజ భావం; అయినా క్రియలో అమర్చడం/పైకి పెట్టడం అనే సంభావ్యత ఉన్నందున పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. దీపస్తంభానికి సంబంధించిన స్త్రీలింగ ఏకవచన సర్వనామాన్ని తెలుగులో సహజమైన ‘దాని’తో వ్యక్తం చేశాం. మూలంలోని మూడవ పురుష ఏకవచనాన్ని మార్చకుండా, క్రియార్థంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
