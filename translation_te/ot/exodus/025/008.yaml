source:
  edition: WLC
  text: וְ/עָ֥שׂוּ לִ֖/י מִקְדָּ֑שׁ וְ/שָׁכַנְתִּ֖י בְּ/תוֹכָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: te
  text: వారు నా కోసం ఒక పవిత్రస్థలాన్ని నిర్మించాలి; నేను వారి మధ్య నివసిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి మధ్యలో.” హెబ్రీ పాఠం దేవుడు కేవలం పవిత్రస్థలంలోనే కాక, ప్రజల మధ్య నివసిస్తాడని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: వారు నిర్మించాలి
  rationale: బోధనాత్మక సందర్భంలో ఈ రూపం మూడవ పురుష బహువచన ఆజ్ఞను సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిర్మించాలి’ ఆ నిర్దేశాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: ఇక్కడ לִי ఉద్దేశం లేదా ప్రయోజనాన్ని సూచిస్తుంది; పవిత్రస్థలం దేవుని కోసం నిర్మించబడాలి.
- source_word: מִקְדָּשׁ
  choice: పవిత్రస్థలం
  rationale: מִקְדָּשׁ అంటే దేవుని సన్నిధి కోసం ప్రత్యేకపరచబడిన పవిత్ర స్థలం. ‘పవిత్రస్థలం’ సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే సహజమైన పదం.
- source_word: וְשָׁכַנְתִּי
  choice: అప్పుడు నేను ... నివసిస్తాను
  rationale: שׁכן ఇక్కడ నివసించడం లేదా స్థిరంగా ఉండడాన్ని సూచిస్తుంది. సంధర్భంలో రెండవ వాక్యం మొదటి నిర్దేశానికి అనుసరించే ఫలితాన్ని వ్యక్తం చేయగలదు; ‘అప్పుడు’ హెబ్రీ సంధి యొక్క సహజ భావాన్ని తెలుగులో అందిస్తుంది, దానిని కఠినమైన ఉద్దేశార్థంగా మాత్రమే పరిమితం చేయదు.
- source_word: בְּתוֹכָם
  choice: వారి మధ్య
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘వారి మధ్యలో’ అని ఉంటుంది. బహువచన ప్రత్యయం దేవుడు కేవలం నిర్మాణంలో కాక ప్రజల మధ్య నివసిస్తాడనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు నివసించే స్థలానికి సూచన
  choice: వారి మధ్య
  alternative: దానిలో
  rationale: హెబ్రీలో ప్రత్యయం బహువచనంగా ‘వారు’ అనే ప్రజలను సూచిస్తుంది; ఏకవచనంగా పవిత్రస్థలాన్ని కాదు. అందువల్ల దేవుని సన్నిధి ఇశ్రాయేలు ప్రజల మధ్య ఉంటుందనే పాఠ్య భావం నిలుస్తుంది.
- issue: రెండు వాక్యభాగాల మధ్య సంబంధం
  choice: అప్పుడు నేను వారి మధ్య నివసిస్తాను
  alternative: నేను వారి మధ్య నివసించడానికి
  rationale: וְשָׁכַנְתִּי రూపం ‘నేను నివసిస్తాను’ అనే ఫలిత/భవిష్యత్ భావాన్ని నేరుగా అనుమతిస్తుంది. సందర్భంలో ఉద్దేశ భావం కూడా సాధ్యమే; అయితే దానిని మాత్రమే నిర్ణయించకుండా ‘అప్పుడు’ ద్వారా సహజమైన అనుసరణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పవిత్రస్థలం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడింది; బహువచనమైన ‘వారి మధ్య’ను ఉద్దేశపూర్వకంగా నిలిపాం.
