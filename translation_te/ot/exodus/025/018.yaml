id: EXO.25.18
reference: Exodus 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ שְׁנַ֥יִם כְּרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ תַּעֲשֶׂ֣ה אֹתָ֔/ם מִ/שְּׁנֵ֖י קְצ֥וֹת הַ/כַּפֹּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: te
  text: నీవు బంగారంతో రెండు కెరూబులను చేయాలి; కరుణాపీఠం[a] యొక్క రెండు చివరల నుండి వాటిని సుత్తితో కొట్టి మలచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాయశ్చిత్తపు మూత.” హీబ్రూ పదం మందసపు మూతను సూచిస్తుంది; ఈ ఆరాధనా సందర్భంలో సంప్రదాయంగా “కరుణాపీఠం” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు … చేయాలి
  rationale: నిర్దేశాత్మక సందర్భంలోని ఆజ్ఞార్థక భావాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: రెండు కెరూబులను
  rationale: సంఖ్యను యథాతథంగా ఉంచి, ప్రత్యేకమైన పరలోక జీవులను సూచించే సంప్రదాయ లిప్యంతరీకరణను వాడింది; సాధారణ దేవదూతలుగా అర్థాన్ని కుదించదు.
- source_word: זָהָב
  choice: బంగారంతో
  rationale: కెరూబులు తయారయ్యే పదార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో కొట్టి మలచాలి
  rationale: లోహాన్ని కొట్టి ఆకారమిచ్చే తయారీ విధానాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఒకే ముక్కగా’ అనే సందర్భసూచిత భావాన్ని మూలపదంలో ప్రత్యక్షంగా ఉన్నదానికంటే ఎక్కువగా చేర్చదు.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: వాటిని … మలచాలి
  rationale: మూలంలోని పునరుక్త తయారీ ఆజ్ఞను తెలుగులో సహజంగా నిలుపుతూ, తయారీ విధానంపై దృష్టి ఉంచుతుంది.
- source_word: מִשְּׁנֵי קְצֹוֹת
  choice: రెండు చివరల వద్ద
  rationale: కెరూబులు మూత చివరలతో కలిగిన స్థానసంబంధాన్ని తెలియజేస్తుంది; అవి చివరల నుంచే పైకి వచ్చినవా లేక వాటిమీద ఉంచబడినవా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: הַכַּפֹּרֶת
  choice: కరుణాపీఠం
  rationale: మందసపు బంగారు మూతను సూచించే స్థిరపడిన ఆరాధనా పదం; దాని కేవలం భౌతిక రూపాన్నే కాక ప్రత్యేక పవిత్ర విధినీ గుర్తింపజేస్తుంది.
theological_decisions:
- issue: నిబంధన మందసపు మూతను సూచించే הַכַּפֹּרֶת పదం అనువాదం
  choice: కరుణాపీఠం
  alternative: ప్రాయశ్చిత్తపు మూత; మూత
  rationale: ఇది మందసపు బంగారు మూత అయినప్పటికీ, ప్రాయశ్చిత్తం మరియు దేవుని సన్నిధితో ముడిపడిన దాని ప్రత్యేక ఆరాధనా గుర్తింపును ‘కరుణాపీఠం’ నిలుపుతుంది. మరింత పారదర్శకమైన పదార్థసంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి భావపరిధిని తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన నిర్దేశాత్మక శైలిని వాడాం. ‘కెరూబులు,’ ‘కరుణాపీఠం’ వంటి ప్రత్యేక ఆరాధనా పదాలను నిలిపి, తయారీ విధానాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే భాషలో తెలిపాం.
