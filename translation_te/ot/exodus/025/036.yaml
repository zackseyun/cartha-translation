translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పవిత్ర గ్రంథానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. వృక్షాకార రూపకల్పనను నిలుపడానికి ‘మొగ్గలు,’ ‘కొమ్మలు’ వాడబడ్డాయి; తయారీ విధానంలోని ఏకత్వం, సుత్తితో మలచడం రెండూ స్పష్టంగా ఉంచబడ్డాయి.
