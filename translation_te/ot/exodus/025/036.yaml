  yaml_path: translation/ot/exodus/025/036.yaml
  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: te
  text: వాటి మొగ్గలూ కొమ్మలూ దాని నుంచే ఉండాలి[a]. అదంతా స్వచ్ఛమైన బంగారంతో సుత్తితో మలిచిన ఒకే ముక్కగా ఉండాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానితో ఏకంగా ఉండాలి.’ మొగ్గలూ కొమ్మలూ విడిగా చేసి అతికించినవి కాకుండా దీపస్తంభం నుంచే సమగ్రంగా రూపొందించబడాలని భావం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సుత్తితో కొట్టి చేసిన పని.’ హెబ్రీ పదం దీపస్తంభం మొత్తాన్ని స్వచ్ఛమైన బంగారంతో సుత్తితో మలిచిన ఏకీకృతమైన ఒకే ముక్కగా చేయాలని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: వాటి మొగ్గలు
  rationale: దీపస్తంభపు వృక్షాకార అలంకరణ సందర్భంలో ఈ పదం గుండ్రని పుష్పాకార భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మొగ్గలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּקְנֹתָם
  choice: వాటి కొమ్మలు
  rationale: קנה అక్షరార్థంగా రెల్లు లేదా కాండాన్ని సూచించినా, ఇక్కడ దీపస్తంభం నుండి విస్తరించే భుజాలు ఉద్దేశించబడ్డాయి; వృక్ష రూపకల్పనకు ‘కొమ్మలు’ సరిపోతుంది.
- source_word: מִמֶּנָּה
  choice: దానిలో నుంచే ఏర్పడాలి
  rationale: ఈ భాగాలు విడిగా చేసి జోడించకుండా దీపస్తంభం నుంచే సమగ్రంగా రూపొందాలని తెలిపే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘దాని నుండి’ అనే అక్షరార్థ భావాన్ని కూడా నిలుపుతుంది.
- source_word: יִהְיוּ
  choice: ఏర్పడాలి / ఉండాలి
  rationale: గుడార నిర్మాణ నిర్దేశాలలోని ఆజ్ఞాత్మక భావాన్ని ఆధునిక తెలుగులో ‘-ాలి’ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֻּלָּהּ
  choice: అదంతా
  rationale: దీపస్తంభం మొత్తమూ సమగ్ర ఏకకంగా ఉండాలనే సంపూర్ణతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో కొట్టి చేసిన పని
  rationale: ఒక లోహపు ముక్కను సుత్తితో మలిచే తయారీ విధానాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַחַת
  choice: ఒకే
  rationale: మొత్తం నిర్మాణం ఏకీకృతమైన ఒక్క పనిగా ఉండాలనే భావాన్ని బలపరుస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: ఈ సాధారణ హెబ్రీ పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
