revisions:
- from: వాటి మొగ్గలూ వాటి కొమ్మలూ దానిలో నుంచే ఏర్పడాలి[a]. అదంతా స్వచ్ఛమైన బంగారంతో సుత్తితో కొట్టి చేసిన ఒకే పని[b]గా ఉండాలి.
  to: వాటి మొగ్గలూ కొమ్మలూ దాని నుంచే ఉండాలి[a]. అదంతా స్వచ్ఛమైన బంగారంతో సుత్తితో మలిచిన ఒకే ముక్కగా ఉండాలి[b].
  rationale: The revision renders the Hebrew preposition directly as “దాని నుంచే,” avoiding the misleading locative nuance of “దానిలో నుంచి.” It also replaces the unnatural “ఒకే పని” with “ఒకే ముక్క,” while retaining both the one-piece and hammered-work senses through the text and footnote.
