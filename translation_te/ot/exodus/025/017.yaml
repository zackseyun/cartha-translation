id: EXO.25.17
reference: Exodus 25:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: te
  text: నీవు స్వచ్ఛమైన బంగారంతో ప్రాయశ్చిత్త మూతను[a] చేయాలి. దాని పొడవు రెండున్నర మూరలు, వెడల్పు ఒకటిన్నర మూర ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణాపీఠం.” హెబ్రీ כַּפֹּרֶת అనే పదం మందసంపై ఉంచే బంగారు మూతను సూచిస్తుంది; అది ప్రాయశ్చిత్తాన్ని సూచించే כפר అనే మూలపదంతో సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేయాలి
  rationale: నిర్దేశాల సందర్భంలో సంయోజక వావ్‌తో వచ్చిన ఖాల్ పరిపూర్ణ క్రియ ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘చేయాలి’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כַפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసంపై ఉంచే ప్రత్యేకమైన బంగారు మూతను సూచిస్తుంది; כפר అనే ప్రాయశ్చిత్త సంబంధిత మూలంతో ఉన్న భావసంబంధాన్ని ‘ప్రాయశ్చిత్త’ నిలుపుతుంది. కేవలం ‘మూత’ అనడం ఆ ఆరాధనా భావాన్ని కోల్పోయే అవకాశం ఉంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: పదార్థాన్నీ దాని నాణ్యతనూ సహజమైన తెలుగు ప్రయోగంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: రెండున్నర మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా నిలిపి, తెలుగులో సహజమైన సంఖ్యా రూపాన్ని ఉపయోగిస్తుంది.
- source_word: אָרְכָּהּ
  choice: దాని పొడవు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న כַפֹּרֶתను సూచిస్తుంది; తెలుగులో ‘దాని పొడవు’ స్పష్టంగా ఉంటుంది.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూర
  rationale: హెబ్రీ కొలతను మార్చకుండా, తెలుగులో సహజమైన రూపంలో అందిస్తుంది.
- source_word: רָחְבָּהּ
  choice: వెడల్పు
  rationale: ప్రత్యయం సూచించే అదే వస్తువు యొక్క వెడల్పును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆరాధనా-ప్రాయశ్చిత్త భావభారం గల כַפֹּרֶת పదం అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం; మూత
  rationale: ఈ పదం మందసపు బంగారు మూతను పేరుపెట్టి, כפר అనే ప్రాయశ్చిత్త మూలంతో భావసంబంధం కలిగి ఉంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువు స్వరూపాన్నీ ఆరాధనా సంబంధాన్నీ తెలియజేస్తుంది; ‘కరుణాపీఠం’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన పదార్థ సంక్లిష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొలమానమైన ‘మూర’ను మార్చకుండా ఉంచాం; వాక్య నిర్మాణంలో నిర్దేశాత్మక భావాన్ని సహజంగా వ్యక్తం చేశాం.
