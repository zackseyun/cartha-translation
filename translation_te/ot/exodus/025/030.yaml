  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: te
  text: నీవు బల్లమీద సన్నిధి రొట్టెలను నా ఎదుట ఎల్లప్పుడూ ఉంచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “సన్నిధి రొట్టె”; సంప్రదాయ ఆంగ్ల అనువాదం: “షోబ్రెడ్” (దేవుని ఎదుట ఉంచే రొట్టె).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: ఉంచాలి
  rationale: נתן అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే విస్తృత అర్థం ఉంది. ఆరాధనా సామగ్రిని నియమిత స్థానంలో పెట్టే ఈ సందర్భంలో ‘ఉంచాలి’ సహజంగా ఉండి ఆజ్ఞార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: బల్లమీద
  rationale: నిర్దిష్టమైన మందిరపు బల్లపై రొట్టెలను ఉంచడాన్ని ఈ సరళమైన రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֶחֶם פָּנִים
  choice: సన్నిధి రొట్టెలను
  rationale: ఈ హెబ్రీ నిర్మాణానికి అక్షరార్థంగా ‘ముఖాల రొట్టె’ అని ఉన్నా, ఇక్కడ అది దేవుని సన్నిధిలో ఉంచే పవిత్ర రొట్టెను సూచిస్తుంది. ‘సన్నిధి రొట్టెలు’ మూలంలోని ఆరాధనా భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: לְ/פָנַ/י
  choice: నా ఎదుట
  rationale: అక్షరార్థంగా ‘నా ముఖం ఎదుట’ అనే భావం. దేవుని ప్రత్యక్ష వాక్కును, స్థానం సూచించే భావాన్ని ‘నా ఎదుట’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: యాజక సంబంధ సందర్భంలో תמיד నిరంతరంగా కొనసాగవలసిన లేదా క్రమంగా నిలిచి ఉండవలసిన ఆచారాన్ని సూచిస్తుంది. ‘ఎల్లప్పుడూ’ ఆ కొనసాగింపు బాధ్యతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆరాధనా పదబంధం לֶחֶם פָּנִים
  choice: సన్నిధి రొట్టెలు
  alternative: సముఖపు రొట్టెలు; దేవుని ఎదుట ఉంచే రొట్టెలు
  rationale: ‘సన్నిధి రొట్టెలు’ హెబ్రీ పదబంధంలోని దేవుని సన్నిధి భావాన్ని కాపాడుతుంది; తరువాతి ‘నా ఎదుట’ అనే వేరైన పదబంధాన్ని కలిపివేయదు. అలాగే సంప్రదాయ పరిభాషకు మాత్రమే పరిమితం కాకుండా సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సరళమైన ఆజ్ఞాశైలి. ‘రొట్టెలను’ అనే బహువచనం ఆరాధనా సందర్భంలోని అమర్చిన రొట్టెల సమూహాన్ని సహజ తెలుగులో సూచిస్తుంది; హెబ్రీలో לֶחֶם వ్యాకరణపరంగా ఏకవచన సమూహనామం.
