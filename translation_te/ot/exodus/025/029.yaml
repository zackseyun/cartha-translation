source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ קְּעָרֹתָ֜י/ו וְ/כַפֹּתָ֗י/ו וּ/קְשׂוֹתָי/ו֙ וּ/מְנַקִּיֹּתָ֔י/ו אֲשֶׁ֥ר יֻסַּ֖ךְ בָּ/הֵ֑ן זָהָ֥ב טָה֖וֹר תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: te
  text: దాని పళ్లెములను, గిన్నెలను, పానార్పణను పోయడానికి ఉపయోగించే కూజాలను, పాత్రలను[a] చేయాలి; వాటిని స్వచ్ఛమైన బంగారంతో చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కూజాలు,” “పాత్రలు” అని అనువదించిన హీబ్రూ పదాలు అరుదైనవి. ఇవి పానార్పణ సేవలో ఉపయోగించే పాత్రలు; వాటి ఖచ్చితమైన ఆకారాలు తెలియవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: దాని పళ్లెములను
  rationale: కְעָרָה సమతలమైన పాత్రను లేదా పళ్లెాన్ని సూచిస్తుంది; తరువాతి పాత్రపదం నుంచి తేడాను నిలుపుతూ బల్ల సందర్భానికి ‘పళ్లెములు’ సహజంగా సరిపోతుంది.
- source_word: כַפֹּתָיו
  choice: గిన్నెలను
  rationale: כַּף అరచేతి ఆకారంలోని చిన్న పాత్రను సూచించగలదు; ఆధునిక తెలుగులో ‘గిన్నెలు’ సహజమైన, విస్తృతార్థకమైన అనువాదం.
- source_word: קְשׂוֹתָיו
  choice: కూజాలను
  rationale: ఇది అరుదైన ఆరాధనా పాత్రపదం. ద్రవాన్ని ఉంచి పోయడానికి ఉపయోగించే పాత్ర భావాన్ని ‘కూజాలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְנַקִּיֹּתָיו
  choice: పాత్రలను
  rationale: ఈ అరుదైన పదం పానార్పణ సేవకు సంబంధించిన మరొక రకమైన పాత్రను సూచిస్తుంది; ఖచ్చితమైన ఆకారం అనిశ్చితంగా ఉన్నందున సాధారణమైన ‘పాత్రలు’ ఎంచుకున్నాం.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: పానార్పణను పోయడానికి ఉపయోగించే
  rationale: נסך అనే క్రియ ఆరాధనా సందర్భంలో పానార్పణను పోయడాన్ని సూచిస్తుంది. హీబ్రూ బహువచన స్త్రీలింగ సూచన ఈ రెండు ద్రవపాత్రలకు వర్తించగలదనే సహజ అస్పష్టతను తెలుగు నిర్మాణం నిలుపుతుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: గుడార నిర్మాణ ఆదేశాల్లోని పదార్థ నిర్దేశాన్ని ఆధునిక ప్రమాణ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: చేయాలి ... వాటిని ... చేయాలి
  rationale: రెండవ పురుష ఏకవచన ఆదేశ భావాన్ని తెలుగులో సహజంగా నిలుపుతూ, జాబితిని చుట్టుముట్టే పునరుక్త క్రియను కాపాడుతుంది.
theological_decisions:
- issue: נסך యొక్క ఆరాధనా భావం
  choice: పానార్పణను పోయడానికి
  alternative: వాటితో పోయడానికి
  rationale: సందర్భంలో נסך సాధారణంగా ద్రవాన్ని పోయడం మాత్రమే కాక పానార్పణను అర్పించడాన్ని సూచిస్తుంది; ‘పానార్పణ’ను స్పష్టీకరించడం సందర్భార్థాన్ని తెలియజేస్తుంది, కానీ ద్రవం ఏదో నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలి వాడబడింది. అరుదైన పాత్రపదాల విషయంలో అతిగా నిర్దిష్టమైన ఆకారాలను ఊహించకుండా, ప్రధాన పాఠ్యంలో సహజ పదాలు మరియు పాదటిప్పణిలో అస్పష్టత ఇవ్వబడ్డాయి.
