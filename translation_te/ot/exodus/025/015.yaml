  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా పవిత్ర గ్రంథానికి తగిన గౌరవప్రద శైలిలో అనువదించబడింది. మూలంలోని రెండు సమాంతర ఆజ్ఞలను సెమికోలన్‌తో నిలిపి, మందసం అనే ఏకవచన పూర్వపదాన్ని స్పష్టంగా కొనసాగించాం.
