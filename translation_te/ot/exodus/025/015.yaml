source:
  edition: WLC
  text: בְּ/טַבְּעֹת֙ הָ/אָרֹ֔ן יִהְי֖וּ הַ/בַּדִּ֑ים לֹ֥א יָסֻ֖רוּ מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/015.yaml
  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: te
  text: మందసపు ఉంగరాల్లో మోతకర్రలు ఉండాలి[a]; వాటిని దానినుండి తొలగించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందసపు ఉంగరాల్లో మోతకర్రలు ఉండాలి; అవి దానినుండి తొలగిపోకూడదు.”
    reason: ‘ఉండాలి’ మరియు ‘తొలగిపోకూడదు’ అనే మరింత రూపానుసారమైన అనువాదాన్ని చూపించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: ఉంగరాల్లో
  rationale: טַבַּעַת ఇక్కడ మందసానికి అమర్చిన ఉంగరాన్ని సూచిస్తుంది; בְ అనే పూర్వప్రత్యయం మోతకర్రలు వాటిలో ఉండడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: ఆరాధన గుడార సందర్భంలో אָרוֹן సాధారణ పెట్టెను కాక పవిత్ర మందసాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘మందసం’ సంక్షిప్తమైన, గౌరవప్రదమైన సందర్భోచిత పదం.
- source_word: יִהְיוּ
  choice: ఉండాలి
  rationale: היה ప్రాథమికంగా ‘ఉండు’ అని అర్థం; ఇక్కడి ఆజ్ఞాత్మక సందర్భంలో నిరంతర స్థానాన్ని సూచిస్తుంది. తరువాతి నిషేధం ఆ కొనసాగింపును స్పష్టం చేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోతకర్రలు
  rationale: בַּדִּים మందసాన్ని మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ వాటి ప్రయోజనాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא יָסֻרוּ
  choice: తీసివేయకూడదు
  rationale: סוּר అంటే తొలగిపోవడం లేదా తొలగించడం. వస్తువుల స్థానం గురించిన ఈ సందర్భంలో తెలుగు నిషేధార్థక కర్తరి-కర్మణి భావం కలిగిన ‘తీసివేయకూడదు’ సహజంగా ఉంటుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుంచి
  rationale: ఏకవచన ప్రత్యయానికి పూర్వపదం మందసం. ఉంగరాల్లో చొప్పించిన కర్రలను మందసం నుంచి తీయరాదనే స్థలసంబంధాన్ని ‘దానిలోనుంచి’ సహజంగా తెలియజేస్తుంది.
