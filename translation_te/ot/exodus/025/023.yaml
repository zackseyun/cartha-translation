translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన ఆజ్ఞా శైలిని ఉపయోగించాం. మూలంలోని కొలతల క్రమాన్ని నిలిపి, తెలుగు వాక్య సహజత్వం కోసం చివర ‘ఉండాలి’ చేర్చాం. ‘మూర’ను మూల సంస్కృతిక కొలమానంగా నిలిపాం.
