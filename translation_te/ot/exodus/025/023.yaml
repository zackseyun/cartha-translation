  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ שֻׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: te
  text: నీవు తుమ్మచెక్కతో ఒక బల్లను చేయాలి.[a] దాని పొడవు రెండు మూరలు, వెడల్పు ఒక మూర, ఎత్తు ఒకటిన్నర మూర ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మరియు నీవు చేయాలి.” హెబ్రీలోని ఈ సంధి ఈ ఆదేశాన్ని ముందున్న ఆదేశాలతో కలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: నీవు ... చేయాలి
  rationale: సూచనల వరుసలో సంయోగాక్షరంతో వచ్చిన ఖాల్ పరిపూర్ణ క్రియ ఆజ్ఞార్థక భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘చేయాలి’ ఆ నిర్దేశక బలాన్ని సహజంగా తెలియజేస్తుంది; వాక్యారంభంలోని וְ సంబంధాన్ని పాదసూచికలో పేర్కొన్నాం.
- source_word: שֻׁלְחָן
  choice: ఒక బల్లను
  rationale: ఇది ఆరాధనాస్థలంలోని సామగ్రిని సూచించే సాధారణ పదం. తెలుగులో మొదటిసారి పరిచయం చేస్తున్న వస్తువుకు ‘ఒక బల్ల’ సహజంగా ఉంటుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: నిర్మాణ పదబంధం ‘షిట్టీమ్ చెట్టు కలప’ను సూచిస్తుంది. బైబిలు అనువాద సంప్రదాయంలో పరిచితమైన ‘తుమ్మచెక్క’ను ఉపయోగించగా, ‘తో’ నిర్మాణ సామగ్రిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אַמָּתַיִם
  choice: రెండు మూరలు
  rationale: మూల సంస్కృతిలోని కొలమానాన్ని మార్చకుండా ఉంచేందుకు cubit‌కు తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘మూర’ను ఎంచుకున్నాం.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకాన్ని యథార్థంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְאַמָּה
  choice: ఒక మూర
  rationale: కొలతల జాబితాలో సంఖ్యను స్పష్టంగా చూపుతుంది.
- source_word: רָחְבּוֹ
  choice: వెడల్పు
  rationale: సందర్భానికి తగిన సాధారణ తెలుగు పదం; ముందున్న ‘దాని’ పొడవు, వెడల్పు, ఎత్తు అన్న మూడింటికీ వర్తిస్తుంది.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూర
  rationale: ‘ఒక మూర మరియు సగం’ అనే హెబ్రీ నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన కొలత పదబంధంగా అందిస్తుంది.
- source_word: קֹמָתוֹ
  choice: ఎత్తు
  rationale: సామగ్రి కొలత సందర్భంలో ‘ఎత్తు’ సహజమైన సమానార్థకం.
