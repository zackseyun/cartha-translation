translation:
  language: te
  text: 'అప్పుడు యాహ్వే[a] మోషేతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH; దీనిని ‘యాహ్వే’ లేదా ‘యెహోవా’ అని లిప్యంతరీకరిస్తారు.'
    reason: దైవనామపు ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. דּבר మరియు తరువాతి לֵאמֹר కలిపి ఉన్న మాటప్రారంభ సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా ‘ఇలా చెప్పాడు’గా అందించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
- source_word: אֶל
  choice: తో
  rationale: మాట్లాడబడిన వ్యక్తిని సూచించే אֶלను ‘మోషేతో చెప్పాడు’ అనే సహజ తెలుగు వాక్యనిర్మాణంలో ‘తో’గా అనువదించాం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన ఆధునిక రూపం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగం. తెలుగులో ‘మాట్లాడి ఇలా అన్నాడు’ అనే భారమైన పునరుక్తిని నివారిస్తూ, తరువాతి సందేశాన్ని సూచించడానికి ‘ఇలా’ వాడాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం బిరుదును కాకుండా దైవనామాన్నే ఉపయోగిస్తుంది. అందువల్ల ‘ప్రభువు’ అని ప్రత్యామ్నాయం చేయకుండా వ్యక్తిగత నామాన్ని లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిశ్చితం కానందున ‘యాహ్వే’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథనశైలి. హీబ్రూ మాటప్రారంభ సూత్రంలోని భావాన్ని నిలుపుతూ తెలుగులో అసహజమైన క్రియాపునరుక్తిని నివారించాం.
