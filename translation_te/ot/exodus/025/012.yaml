  edition: WLC
  text: וְ/יָצַ֣קְתָּ לּ֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב וְ/נָ֣תַתָּ֔ה עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּעֹ֔ת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: te
  text: నీవు దానికోసం నాలుగు బంగారు ఉంగరాలను పోతపోసి తయారుచేయాలి; వాటిని దాని నాలుగు పాదాలపై అమర్చాలి—దాని ఒక పక్కన రెండు ఉంగరాలు, దాని రెండవ పక్కన రెండు ఉంగరాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని నాలుగు మూలలపై.” ఇక్కడి హీబ్రూ పదానికి అర్థం నిర్ణయించడం కష్టం; అది కేవలం మూలలను కాక, మందసం దిగువనున్న పాదాలను లేదా ఆధార భాగాలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: పోత పోసి
  rationale: లోహపు అమరికలను తయారుచేసే సందర్భంలో יצק అంటే సాధారణంగా ద్రవాన్ని పోయడం కాక, లోహాన్ని అచ్చులో పోసి తయారుచేయడం. ‘పోత పోయడం’ ఆధునిక తెలుగులో ఈ ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: ఇది మందసాన్ని మోయడానికి ఉపయోగించే కడ్డీల కోసం అమర్చిన బంగారు వలయాకారపు ఉంగరాలను సూచిస్తుంది. ‘ఉంగరాలు’ సహజమైనదీ, తగినంత నిర్దిష్టమైనదీ.
- source_word: זָהָב
  choice: బంగారు
  rationale: వస్తువును తయారుచేసే పదార్థమైన బంగారాన్ని నేరుగా సూచిస్తుంది.
- source_word: וְנָתַתָּה
  choice: అమర్చాలి
  rationale: נתן విస్తృతార్థకమైన క్రియ. ఇక్కడ ఉంగరాలను మందసానికి జోడించే నిర్మాణ ఆదేశం కాబట్టి ‘అమర్చాలి’ సందర్భోచితంగా, సహజంగా ఉంది.
- source_word: פַּעֲמֹתָיו
  choice: దాని నాలుగు కాళ్లు
  rationale: ఈ అరుదైన ప్రయోగం మందసం దిగువనున్న కాళ్లు లేదా ఆధార భాగాలను సూచించే అవకాశమే ఎక్కువ. concrete imageryను నిలుపుతూ ‘కాళ్లు’ అని అనువదించాం; ‘మూలలు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: צַלְעוֹ
  choice: దాని పక్క
  rationale: నిర్మాణాలు లేదా వస్తువుల సందర్భంలో צלע అంటే ‘పక్క భాగం’. ఆధునిక తెలుగులో ‘పక్క’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ఒక పక్క ... రెండో పక్క
  rationale: హీబ్రూ పాఠంలోని మొదటి-రెండవ పక్కల క్రమాన్ని ‘ఒక పక్క ... రెండో పక్క’ అనే సహజమైన తెలుగుతో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. ఆజ్ఞార్థాన్ని ‘అమర్చాలి’ రూపంలో సహజంగా వ్యక్తం చేశాం; మూలపాఠంలోని పదసందిగ్ధతను పాదసూచికలో నిలిపాం.
