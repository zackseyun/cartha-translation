  yaml_path: translation/ot/exodus/025/004.yaml
  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goat hair[b],
translation:
  language: te
  text: నీలి నూలు, ఊదా నూలు, కిర్మిజి ఎరుపు నూలు[a], సన్నని నారబట్ట, మేక వెంట్రుకలు[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పురుగు కిర్మిజి’; పురుగుల నుంచి తయారుచేసిన కిర్మిజి ఎరుపు రంగు వేసిన నూలు లేదా వస్త్రపదార్థం అని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మేకలు’; ఈ సందర్భంలో మేకల నుంచి తీసిన వెంట్రుకలు ఉద్దేశించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכֵלֶת
  choice: నీలి నూలు
  rationale: ఈ పదం నీలి లేదా ఊదా-నీలి రంగు వేసిన విలువైన వస్త్రపదార్థాన్ని సూచిస్తుంది. ప్రత్యక్ష సందర్భం గుడారపు వస్త్రాల కోసం సమర్పించే పదార్థాల జాబితా కావడంతో ‘నూలు’ అని స్పష్టం చేయడం సహజంగా ఉంది.
- source_word: אַרְגָּמָן
  choice: ఊదా నూలు
  rationale: ఇది ఖరీదైన ఊదా రంగు వేసిన వస్త్రపదార్థాన్ని సూచిస్తుంది. జాబితాలోని సమాంతర నిర్మాణాన్ని నిలుపుతూ ‘ఊదా నూలు’ అని అనువదించబడింది.
- source_word: תוֹלַעַת שָׁנִי
  choice: కిరమిజి ఎరుపు నూలు[a]
  rationale: ఈ పదబంధం అక్షరార్థంగా పురుగు నుంచి లభించే రంగును ప్రస్తావించినా, వాడుకలో ఆ రంగు వేసిన కిరమిజి ఎరుపు వస్త్రపదార్థాన్ని సూచిస్తుంది. మూలంలోని నేపథ్యాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో సహజమైన పదప్రయోగం ఎంచుకోబడింది.
- source_word: שֵׁשׁ
  choice: సన్నని నారబట్ట
  rationale: మందిర గుడారానికి సంబంధించిన సందర్భాల్లో ఈ పదం మెత్తగా, నాజూకుగా తయారుచేసిన నారవస్త్రాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు పదార్థం స్పష్టమయ్యేలా ‘సన్నని నారబట్ట’ అని ఇవ్వబడింది.
- source_word: עִזִּים
  choice: మేక వెంట్రుకలు[b]
  rationale: మూలంలో అక్షరార్థంగా ‘మేకలు’ ఉన్నప్పటికీ, ఈ వస్తుసామగ్రి జాబితాలో నేయడానికి ఉపయోగించే మేక వెంట్రుకలే ఉద్దేశించబడ్డాయి. ఉద్దేశిత పదార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వస్తుసామగ్రి-జాబితా శైలి ఉపయోగించబడింది. హెబ్రీలో ప్రతి అంశానికి ఉన్న సంధానకారకాన్ని తెలుగులో సహజమైన కామా-జాబితాగా మలిచాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] గుర్తు ‘blue’ వద్ద ఉన్నప్పటికీ దాని పాదసూచిక విషయం תוֹלַעַת שָׁנִי కి సంబంధించినది; అందువల్ల మూలభాషా ఆధారంగా ఆ గుర్తు ‘కిరమిజి ఎరుపు నూలు’ వద్ద ఉంచబడింది.
