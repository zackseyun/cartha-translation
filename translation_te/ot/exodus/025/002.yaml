source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: ‘వారు నా కోసం ఒక అర్పణను[b] తీసుకురావాలి. ఎవరి హృదయం అతణ్ణి ప్రేరేపిస్తుందో[c], అలాంటి ప్రతి పురుషుని దగ్గర నుంచి మీరు నా అర్పణను స్వీకరించాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ ఒడంబడిక సంబంధమైన పేరు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘కానుక’ లేదా ‘విరాళం.’ హీబ్రూ పదం పవిత్రమైన ఉపయోగం కోసం ప్రత్యేకించి ఇచ్చేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఎవరి హృదయం అతణ్ణి కదిలిస్తుందో’ లేదా ‘ఎవరి హృదయం అతణ్ణి పురికొల్పుతుందో.’ ఈ హీబ్రూ నుడికారం లోపలి నుంచి కలిగే స్వచ్ఛంద సంసిద్ధతను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: ఇలా చెప్పు
  rationale: పీయేల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి మాటలను పరిచయం చేయడానికి ‘ఇలా’ తోడైంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన బహువచన పదబంధాన్ని నిలుపుతూ, ఇది ఇశ్రాయేలు ప్రజలకు వాడే ఒడంబడిక సంబంధమైన సాధారణ సంబోధన అని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: וְיִקְחוּ לִי
  choice: వారు నా కోసం ... తీసుకోవాలి
  rationale: ఆజ్ఞ తరువాత వచ్చే నిర్దేశక భావాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; לִי లోని ‘నా కోసం’ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: תְּרוּמָה
  choice: అర్పణ
  rationale: పవిత్రమైన ఉపయోగం కోసం ప్రత్యేకించి ఇచ్చే కానుక అనే భావాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి బలి సంబంధమైన మరింత సంకుచిత అర్థాన్ని దీనిలోకి తీసుకురాదు.
- source_word: מֵאֵת כָּל אִישׁ
  choice: ప్రతి పురుషుని దగ్గర నుంచి
  rationale: పంపిణీ భావాన్నీ, אִישׁ పదంలోని పుంలింగ ఏకవచన రూపాన్నీ కాపాడుతుంది.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: ఎవరి హృదయం అతణ్ణి ప్రేరేపిస్తుందో
  rationale: స్వచ్ఛందంగా ఇవ్వడానికి లోపలి నుంచి కలిగే ప్రేరణను తెలిపే హీబ్రూ నుడికారాన్ని, అదనపు క్రియావిశేషణం చేర్చకుండా నిలుపుతుంది.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: మీరు నా అర్పణను తీసుకోవాలి
  rationale: రెండవ పురుష బహువచన సంబోధనను స్పష్టంగా చూపి, ముందున్న לקח క్రియతో ఉన్న పదసంబంధాన్ని ‘తీసుకోవాలి’ ద్వారా కాపాడుతుంది; ‘నా అర్పణ’ దేవునికి చెందినదని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: గుడార నిర్మాణ సందర్భంలో תְּרוּמָה పదానికి అనువాదం
  choice: అర్పణ
  alternative: కానుక / విరాళం
  rationale: ఇది దేవుని కోసం, పవిత్ర వినియోగానికి ఇచ్చే వస్తువులను సూచిస్తుంది. ‘అర్పణ’ దేవుని వైపు దాని ఉద్దేశాన్ని కాపాడుతుంది; అయితే దీనిని బలిగా మాత్రమే పరిమితం చేయదు.
- issue: అర్పణ ఇవ్వడంలోని స్వచ్ఛందత
  choice: ఎవరి హృదయం అతణ్ణి ప్రేరేపిస్తుందో
  alternative: ఎవరి హృదయం అతణ్ణి ఇష్టపూర్వకంగా ప్రేరేపిస్తుందో
  rationale: మూలంలోని హృదయ నుడికారమే అంతర్గత స్వచ్ఛందతను సూచిస్తుంది. ‘ఇష్టపూర్వకంగా’ అని అదనంగా చేర్చి భావాన్ని అతిగా స్పష్టీకరించకుండా మూలంలోని సున్నితత్వాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రత్యక్ష ఆజ్ఞ, పుంలింగ మూలపదం, హృదయ నుడికారం, అలాగే ‘నా అర్పణ’ అనే దేవుని-కేంద్రిత భావం నిలుపబడ్డాయి.
