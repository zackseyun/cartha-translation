- from: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: ‘వారు నా కోసం ఒక అర్పణను[b] తీసుకోవాలి. ఎవరి హృదయం అతణ్ణి ప్రేరేపిస్తుందో[c], అలాంటి ప్రతి పురుషుని దగ్గర నుంచి మీరు నా అర్పణను తీసుకోవాలి.’”'
  to: '“ఇశ్రాయేలు కుమారులతో[a] ఇలా చెప్పు: ‘వారు నా కోసం ఒక అర్పణను[b] తీసుకురావాలి. ఎవరి హృదయం అతణ్ణి ప్రేరేపిస్తుందో[c], అలాంటి ప్రతి పురుషుని దగ్గర నుంచి మీరు నా అర్పణను స్వీకరించాలి.’”'
  rationale: The revision resolves a Telugu ambiguity in the first directive by rendering the contributors’ action as bringing the offering, and renders the administrators’ final action as receiving it. This preserves the source’s collection context, the voluntary character of the gifts, and the distinction between those who provide and those who receive the contribution. Footnote anchors and content remain complete and correctly attached.
