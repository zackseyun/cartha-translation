id: EXO.25.34
reference: Exodus 25:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בַ/מְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁקָּדִ֔ים כַּפְתֹּרֶ֖י/הָ וּ/פְרָחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/034.yaml
  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: te
  text: దీపస్తంభంపై బాదంపువ్వుల ఆకారంలో చేసిన[a] నాలుగు పాత్రలు, దాని మొగ్గలూ[b] పువ్వులూ ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బాదం ఆకారంలో చేసినవి’ లేదా ‘బాదంపువ్వులతో అలంకరించినవి.’ ఈ హీబ్రూ వర్ణన ఆకారాన్నో అలంకరణనో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని గుండ్రని ఉబ్బులు.’ ఈ హీబ్రూ పదం దీపస్తంభంపై ఉన్న గుండ్రని అలంకార భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: దీపస్తంభం మీద
  rationale: מְנֹרָה మొత్తం దీపస్తంభాన్ని సూచిస్తుంది; בַ־ను ఈ అలంకార భాగాలు దానిపై ఉండటాన్ని తెలుగులో సహజంగా తెలిపేలా ‘మీద’ అని అనువదించాం.
- source_word: אַרְבָּעָה
  choice: నాలుగు
  rationale: గిన్నె లేదా పాత్ర ఆకారంలోని అలంకార భాగాల సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: גְבִעִים
  choice: పాత్రలు
  rationale: ఈ పదం గిన్నె లేదా పానపాత్ర వంటి ఆకారాన్ని సూచిస్తుంది. దీపస్తంభపు అలంకార నిర్మాణంలో ‘పాత్రలు’ సహజంగా ఉండి, నిర్దిష్ట పరిమాణం లేదా ఉపయోగాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: מְשֻׁקָּדִים
  choice: బాదం పువ్వుల ఆకారంలో చేసిన
  rationale: బాదం చెట్టుకు సంబంధించిన ఈ రూపం ఆకారం లేదా అలంకరణను సూచించవచ్చు. ప్రధాన పాఠంలో పుష్ప రూపకల్పనను స్పష్టంగా తెలిపి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: כַּפְתֹּרֶיהָ
  choice: వాటి మొగ్గలు
  rationale: כפתר గుండ్రని అలంకార ఉబ్బును సూచిస్తుంది. దీపస్తంభపు వృక్ష-పుష్ప చిత్రణలో ‘మొగ్గలు’ సహజంగా సరిపోతుంది; ‘గుండ్రని ఉబ్బులు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: וּפְרָחֶיהָ
  choice: పువ్వులు
  rationale: פֶּרַח పువ్వు లేదా వికసించిన పుష్పాన్ని సూచిస్తుంది; ‘మొగ్గలు’తో సహజమైన జోడీగా ‘పువ్వులు’ ఎంచుకున్నాం.
