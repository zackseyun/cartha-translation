translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడాం. నిర్గమకాండంలోని నిర్మాణ ఆదేశాలకు తగిన విధంగా ‘ఉండాలి’ రూపాన్ని ఉంచాం; హీబ్రూలోని వృక్ష-పుష్ప రూపకాన్ని నిలిపాం.
