review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the spatial sense of נָתַתָּ אֶל as placing the testimony in the ark, retains the generic referent of הָעֵדֻת, and conveys the future relative clause, “which I will give you.” However, Telugu ఉంచాలి can leave the required second-person agent insufficiently explicit; the Hebrew verb is explicitly second masculine singular, addressed to Moses.
  naturalness: The wording is otherwise natural modern standard Telugu. Adding నీవు makes the direct divine instruction clear without making the style archaic or overly formal.
  terminology: మందసం is the suitable established term for the sacred ark in this context. సాక్ష్యం appropriately preserves the source term without prematurely identifying it as tablets. The footnote supplies the contextually specific alternative and remains properly anchored.
  issues:
  - severity: low
    issue: The addressee/agent of the command is not explicit in the Telugu main clause.
    rationale: The Hebrew וְנָתַתָּ is second-person singular (“you shall put”). Since Telugu ఉంచాలి may also be read impersonally (“it must be put”), explicit నీవు more reliably preserves the address to Moses.
  revised_text: నీవు నేను నీకు ఇచ్చే సాక్ష్యాన్ని మందసంలో ఉంచాలి[a].
