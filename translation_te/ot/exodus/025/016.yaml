source:
  edition: WLC
  text: וְ/נָתַתָּ֖ אֶל הָ/אָרֹ֑ן אֵ֚ת הָ/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: te
  text: నీవు నేను నీకు ఇచ్చే సాక్ష్యాన్ని మందసంలో ఉంచాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా, ‘సాక్ష్యపు పలకలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ఉంచాలి
  rationale: נתן అనే క్రియకు ‘ఇవ్వు,’ ‘పెట్టు,’ ‘ఉంచు’ అనే అర్థాలు ఉన్నాయి. మందసం అనే పాత్రను సూచించే పదంతో వచ్చినందున, ఇక్కడ ఏదైనా దానిలో పెట్టడమే భావం; ఆధునిక తెలుగులో ‘ఉంచాలి’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: אֶל
  choice: మందసంలో
  rationale: אֶל ప్రాథమికంగా ‘వైపు/కు’ అని అర్థమైనా, נתן క్రియతోను మందసం అనే పాత్రతోను కలిసి ఇక్కడ లోపల ఉంచడాన్ని సూచిస్తుంది. తెలుగులో స్థానార్థక ‘లో’ విభక్తి ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: నివాసమందిర సందర్భంలో אָרוֹן పవిత్రమైన ఒడంబడిక మందసాన్ని సూచిస్తుంది. ‘పెట్టె’ కంటే ‘మందసం’ దాని ఆరాధనా సందర్భాన్నీ సంప్రదాయ బైబిలు గుర్తింపునీ సముచితంగా నిలుపుతుంది.
- source_word: אֵת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; విడిగా అనువదించలేదు]'
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: הָעֵדֻת
  choice: సాక్ష్యం
  rationale: עֵדוּת కు ‘సాక్ష్యం’ లేదా ‘సాక్ష్యపత్రం’ అనే అర్థాలు ఉండవచ్చు. ఈ వాక్యంలో పలకలు అని స్పష్టంగా చెప్పనందున, మూలపదంలోని సాధారణతను కాపాడేందుకు ‘సాక్ష్యం’ ఎంచుకోబడింది.
- source_word: אֲשֶׁר
  choice: నేను నీకు ఇచ్చే
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణం తెలుగులో కృదంత సంబంధ నిర్మాణంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶתֵּן
  choice: ఇచ్చే
  rationale: Qal imperfect ప్రథమ పురుష ఏకవచనం సందర్భంలో భవిష్యత్ చర్యను సూచిస్తుంది. ప్రధాన క్రియలోని విధ్యర్థక భవిష్యత్ భావంతో కలిపి, తెలుగులో ‘నేను నీకు ఇచ్చే’ అనేది సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: దేవుడు మోషేకు సాక్ష్యాన్ని ఇవ్వడాన్ని సూచించే పరోక్ష కర్మను తెలుగులో సంప్రదానార్థక ‘నీకు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘సాక్ష్యం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘సాక్ష్యం’ అని సాధారణంగానే అనువదించడం.
  alternative: ‘సాక్ష్యపు పలకలు’ అని స్పష్టీకరించడం.
  rationale: విస్తృత సందర్భంలో ఇది రాతి పలకలను సూచించినా, ఈ వచనంలోని హీబ్రూ పాఠ్యం పలకలను ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని పదప్రయోగాన్ని నిలుపుతుంది; సందర్భానుసారమైన నిర్దిష్ట గుర్తింపును పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవుడు మోషేతో నేరుగా మాట్లాడుతున్నందున ఏకవచన ‘నీకు’ వాడబడింది. మూలంలోని ఆజ్ఞాత్మక భవిష్యత్ భావాన్ని తెలుగులో ‘ఉంచాలి’తో వ్యక్తం చేశాం; ‘సాక్ష్యం’ అనే పదం ఉద్దేశపూర్వకంగా అతిగా నిర్దిష్టీకరించబడలేదు.
