- from: నేను నీకు ఇచ్చే సాక్ష్యాన్ని మందసంలో ఉంచాలి[a].
  to: నీవు నేను నీకు ఇచ్చే సాక్ష్యాన్ని మందసంలో ఉంచాలి[a].
  rationale: The revision adds only the explicit second-person subject required to represent the Hebrew verbal person and direct address clearly. It retains “సాక్ష్యం” in the main text because the verse itself does not explicitly say “tablets,” while the footnote preserves that contextually supported, more specific rendering.
  reviewer_model: gpt-5.6-terra
