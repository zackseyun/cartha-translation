    text: లేదా ‘దాని వత్తులు సరిచేసే పనిముట్లు’; హీబ్రూ పదం దీపస్తంభానికి సంబంధించిన పట్టుకునే లేదా వత్తులు సరిచేసే పనిముట్టును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాని పళ్లాలు’; ఈ సందర్భంలో ‘దాని ధూపపాత్రలు’ అనే అర్థం కూడా సాధ్యమే, కాని దానికి అవకాశం తక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: దాని పట్టకార్లు
  rationale: ఈ పదం పట్టుకోవడానికి లేదా దీపపు వత్తులను సరిచేయడానికి ఉపయోగించే పనిముట్టును సూచిస్తుంది. సందర్భాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘పట్టకార్లు’ మూలపదపు విస్తృత అర్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: מַחְתֹּתֶיהָ
  choice: దాని నిప్పు పళ్లాలు
  rationale: ఈ పదం సాధారణంగా నిప్పు లేదా నిప్పుకణాలను ఉంచే లేదా తీసుకెళ్లే పళ్లాలను సూచిస్తుంది. ‘నిప్పు పళ్లాలు’ ఆరాధనా సామగ్రి సందర్భానికి సరిపోతూ, ‘ధూపార్తులు’ అనే మరీ నిర్దిష్టమైన భావాన్ని రుద్దదు.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: ఈ పదబంధం వస్తువులు తయారయ్యే పదార్థాన్ని నేరుగా తెలియజేస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וּ
  choice: మరియు భావాన్ని విరామచిహ్నంతో సమన్వయించడం
  rationale: హీబ్రూ సంధాయక ప్రత్యయం రెండు రకాల పనిముట్లను కలుపుతుంది. తెలుగులో జాబితా నిర్మాణంలో కామాతో ఈ సమన్వయం సహజంగా వ్యక్తమవుతుంది.
- source_word: -הָ
  choice: దాని
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం దీపస్తంభాన్ని సూచిస్తుంది. నిర్జీవ వస్తువుకు ఆధునిక తెలుగులో ‘దాని’ సరైన స్వామ్యరూపం.
