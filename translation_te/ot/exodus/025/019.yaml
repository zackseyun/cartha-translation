reference: Exodus 25:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/עֲשֵׂה כְּר֨וּב אֶחָ֤ד מִ/קָּצָה֙ מִ/זֶּ֔ה וּ/כְרוּב אֶחָ֥ד מִ/קָּצָ֖ה מִ/זֶּ֑ה מִן הַ/כַּפֹּ֛רֶת תַּעֲשׂ֥וּ אֶת הַ/כְּרֻבִ֖ים עַל שְׁנֵ֥י קְצוֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: te
  text: ఒక చివర ఒక కెరూబును, మరో చివర ఒక కెరూబును చేయాలి; ప్రాయశ్చిత్తపు మూత నుంచే దాని రెండు చివరలపై కెరూబులను చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అంటే, మరింత స్పష్టంగా: “ప్రాయశ్చిత్తపు మూత రెండు చివరల్లో కెరూబులను దానితో ఏకఖండంగా చేయాలి.” హెబ్రీలోని “నుండి” అనే పదం, కెరూబులను విడిగా చేసి తరువాత అతికించకుండా, మూతలో నుంచే వాటిని రూపుదిద్దాలని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: చేయాలి
  rationale: ఆజ్ఞాపూర్వక సూచనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: כְּרוּב ... וּכְרוּב / הַכְּרֻבִים
  choice: కెరూబు ... కెరూబు / కెరూబులు
  rationale: ప్రత్యేకమైన పరలోక జీవిని సూచించే హెబ్రీ సాంకేతిక పదాన్ని లిప్యంతరీకరించి, మొదట ఏకవచనాన్ని, తరువాత బహువచనాన్ని నిలుపుతుంది.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: ఒక చివర ... మరో చివర
  rationale: రెండు చివరల మధ్య సమాంతర వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; భౌతిక స్థానాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: מִן הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత నుంచే
  rationale: כַּפֹּרֶת మందసపు ప్రత్యేక మూతను, దాని ప్రాయశ్చిత్త సంబంధ కార్యాన్ని సూచిస్తుంది. מִן పదార్థ/మూల సంబంధాన్ని సూచిస్తున్నందున, కెరూబులు విడిగా తయారుచేసి అతికించేవి కాక మూత నుంచే రూపుదిద్దుకోవాలని ‘నుంచే’ స్పష్టం చేస్తుంది.
- source_word: תַּעֲשׂוּ
  choice: చేయాలి
  rationale: రెండవ పురుష బహువచన నిర్దేశక రూపాన్ని తెలుగులో సహజమైన విధి సూచనగా అందిస్తుంది; కర్త సందర్భంలో సమూహంగా ఉద్దేశించబడింది.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: దాని రెండు చివరలపై
  rationale: עַל యొక్క స్థానార్థాన్ని ‘పై’గా నిలుపుతూ, ఏకవచన ప్రత్యయం ప్రాయశ్చిత్తపు మూతను సూచిస్తుందని తెలుపుతుంది.
theological_decisions:
- issue: כַּפֹּרֶת యొక్క అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాసనం; మూత
  rationale: పదం మందసపు మూత అనే భౌతిక వస్తువును సూచిస్తూనే ప్రాయశ్చిత్త సంబంధాన్ని కలిగి ఉంది. ‘ప్రాయశ్చిత్తపు మూత’ ఈ రెండు పార్శ్వాలను నిలుపుతుంది; ‘కరుణాసనం’ రూపక/సంప్రదాయార్థాన్ని ముందుకు తెచ్చి భౌతిక మూత భావాన్ని తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆలయసంబంధ నిర్దేశానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘కెరూబు’ అనే సాంకేతిక లిప్యంతరీకరణను నిలిపి, ‘ప్రాయశ్చిత్తపు మూత’ ద్వారా వస్తువు మరియు దాని ధార్మిక కార్యం రెండింటినీ వ్యక్తపరిచింది.
