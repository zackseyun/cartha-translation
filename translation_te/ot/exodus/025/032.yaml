source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/032.yaml
  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: te
  text: 'దాని పక్కల నుంచి ఆరు కొమ్మలు వెలువడాలి: దీపస్తంభపు ఒక పక్క నుంచి మూడు కొమ్మలు, దీపస్తంభపు రెండవ పక్క నుంచి మూడు కొమ్మలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: కొమ్మలు
  rationale: దీపస్తంభం పక్కల నుంచి విస్తరించే భాగాలను సూచించే సందర్భానుకూలమైన, సహజమైన తెలుగు పదం; మూలంలోని వృక్షసాదృశ్యాన్ని కూడా నిలుపుతుంది.
- source_word: יֹצְאִים
  choice: వెలువడాలి
  rationale: కొమ్మలు దీపస్తంభం పక్కల నుంచి బయటకు విస్తరించే నిర్మాణాన్ని తెలియజేస్తూ, ఆదేశాత్మక సందర్భానికి సరిపోతుంది.
- source_word: מִצִּדֶּיהָ
  choice: దాని పక్కల నుంచి
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం దీపస్తంభాన్ని సూచిస్తుంది; బహువచనమైన ‘పక్కలు’ను నేరుగా నిలుపుతుంది.
- source_word: מְנֹרָה
  choice: దీపస్తంభం
  rationale: లిప్యంతరీకరణకు బదులుగా ఈ ఆరాధనా సామగ్రి యొక్క సాధారణ నామాన్ని స్పష్టమైన ఆధునిక తెలుగులో అనువదిస్తుంది.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: ఒక పక్క ... రెండవ పక్క
  rationale: మూలంలోని ‘ఒకటి—రెండవది’ అనే క్రమబద్ధమైన సమాంతరతను వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన నిర్మాణ వివరణ. మూలంలోని పునరుక్తిని స్పష్టత కోసం కొంతవరకు నిలిపి, ‘రెండవ పక్క’ అనే అక్షరార్థ సమాంతరతను కాపాడింది. అందించిన ఆంగ్ల పాదసూచిక మూల హీబ్రూ పాఠంలో నిజమైన పాఠాంతరాన్ని లేదా పదార్థ సందిగ్ధతను ప్రతిబింబించనందున చేర్చలేదు.
