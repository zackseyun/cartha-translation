  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: te
  text: దానికి స్వచ్ఛమైన బంగారంతో తాపడం చేయాలి; లోపల నుంచీ వెలుపల నుంచీ దానికి తాపడం చేయాలి. దాని చుట్టూ బంగారు అంచును చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బంగారు పట్టీ,’ ‘బంగారు అలంకారపు అంచు’; సంప్రదాయ అనువాదం ‘బంగారు కిరీటం.’ హీబ్రూ זֵר ఇక్కడ వస్తువు చుట్టూ ఉండే అలంకారపు అంచును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: పొదిగించాలి
  rationale: ఈ మందిర సామగ్రి నిర్మాణ సందర్భంలో צפה అనేది వస్తువుపై లోహపు పొరను అమర్చడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బంగారం పొదిగించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: ఈ పదబంధం శుద్ధి చేసిన, కల్తీలేని బంగారాన్ని సూచిస్తుంది; ‘స్వచ్ఛమైన బంగారం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: מִבַּיִת וּמִחוּץ
  choice: లోపలా బయటా
  rationale: పెట్టె అంతర్భాగం, వెలుపలి భాగం రెండింటినీ బంగారంతో పొదగాలని చెప్పే సమాంతర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: దాని చుట్టూ ... చేయాలి
  rationale: עַל ఇక్కడ ఆ వస్తువుపై అమర్చే అంచును సూచిస్తుంది; తరువాతి סָבִיבతో కలిపి తెలుగులో ‘దాని చుట్టూ’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: זֵר
  choice: అంచు
  rationale: ఇక్కడ זֵר అనేది వస్తువు చుట్టూ ఉండే అలంకారపు ఎత్తైన పట్టీ లేదా అంచు. ‘కిరీటం’ అనే సంప్రదాయ పదం తలపై ధరించే కిరీటం అనే అపార్థాన్ని కలిగించవచ్చు; ‘అంచు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: זֵר זָהָב
  choice: బంగారు అంచు
  rationale: అంచు ఏ పదార్థంతో చేయబడాలో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: వస్తువును అన్ని వైపులా ఆవరించే అమరికను సూచించే సహజమైన తెలుగు పదం.
