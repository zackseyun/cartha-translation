  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: te
  text: ఒక కొమ్మపై బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు, గుండీ మరియు పువ్వుతో; ఒక కొమ్మపై బాదంపువ్వుల ఆకారంలో మూడు గిన్నెలు, గుండీ మరియు పువ్వుతో ఉండాలి. దీపస్తంభం నుండి బయలుదేరే ఆరు కొమ్మలన్నిటికీ ఇదే విధంగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుండీ’ హెబ్రీ כַּפְתֹּרను అనువదిస్తుంది; ఇది గుండ్రని అలంకార ఉబ్బును సూచిస్తుంది. ‘అలంకార ఉబ్బు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: గిన్నెలు
  rationale: ఈ నామవాచకం గిన్నె లేదా పాత్రవంటి ఆకృతులను సూచిస్తుంది; దీపస్తంభపు అలంకార భాగాలకు ‘గిన్నెలు’ సహజమైన తెలుగు పదం.
- source_word: מְשֻׁקָּדִים
  choice: బాదంపువ్వుల ఆకారంలో
  rationale: שקד (‘బాదం’) నుండి వచ్చిన ఈ రూపం ఇక్కడ అలంకార నమూనాను వివరిస్తుంది. సందర్భంలోని మొగ్గ, పువ్వు పదాలతో కలిసి ఇది బాదంపుష్ప రూపాన్ని సూచిస్తుంది.
- source_word: קָּנֶה
  choice: కొమ్మ
  rationale: దీపస్తంభం నుండి విస్తరించే భాగాన్ని సూచిస్తుంది. పుష్పాల అలంకరణ సందర్భంలో ‘కొమ్మ’ సహజంగా ఉండి వృక్షరూప చిత్రణను నిలుపుతుంది.
- source_word: כַּפְתֹּר
  choice: మొగ్గ
  rationale: గుండ్రని అలంకార ఉబ్బును సూచించే పదం. దీపస్తంభపు వృక్షరూప నమూనాలో ‘మొగ్గ’ పువ్వుతో సహజంగా జతపడుతుంది; ‘గుండీ’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: פֶרַח / פָרַח
  choice: పువ్వు
  rationale: ఈ నామవాచకం పుష్పాన్ని సూచిస్తుంది; సరళమైన ఆధునిక తెలుగులో ‘పువ్వు’ స్పష్టంగా ఉంటుంది.
- source_word: כֵּן
  choice: ఇదే విధంగా
  rationale: ముందు చెప్పిన నమూనా ఆరు కొమ్మలన్నిటికీ వర్తిస్తుందని సంగ్రహంగా తెలియజేస్తుంది.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ఆరు కొమ్మలన్నిటికీ
  rationale: లְ ఇక్కడ ఆ నమూనా ఆరు కొమ్మలకు వర్తించడాన్ని సూచిస్తుంది; ‘అన్నిటికీ’ దాని విభజనాత్మక భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: దీపస్తంభం నుండి బయలుదేరే
  rationale: కొమ్మలు ప్రధాన దీపస్తంభం నుండి విస్తరించడాన్ని హెబ్రీ భాగవాచక రూపానికి దగ్గరగా, సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מְנֹרָה
  choice: దీపస్తంభం
  rationale: ఇది గుడారంలోని దీపాలను మోసే వస్తువుకు సాధారణ నామవాచకం; లిప్యంతరీకరణకన్నా అర్థానువాదం స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ ఆదేశానికి తగిన గంభీరమైన కానీ సులభమైన శైలి. హెబ్రీలో రెండుసార్లు ‘ఒక కొమ్మ’ అని ఉన్న పునరుక్తిని ‘ఒక కొమ్మ… మరొక కొమ్మ’గా సహజీకరించాం; ఆరు కొమ్మలన్నిటికీ అదే నమూనా వర్తిస్తుందనే ముగింపును స్పష్టంగా ఉంచాం.
