  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: te
  text: దానికి నాలుగు బంగారు ఉంగరాలు చేసి, దాని నాలుగు కాళ్ల[b] దగ్గర ఉన్న నాలుగు మూలలపై[a] ఆ ఉంగరాలను ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మూలలపై” అనే చోట “నాలుగు పక్కలపై” లేదా “నాలుగు అంచులపై” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి సందర్భానుసారం “కాళ్లు” లేదా “పాదాలు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: చేసి ... అమర్చాలి
  rationale: సూచనల పరంపరలో సంధితో కూడిన Qal perfect ఆజ్ఞార్థక భావాన్ని ఇస్తుంది. తెలుగులో వరుస కార్యాలను సహజంగా తెలియజేయడానికి మొదటి క్రియను అసమాపకంగా, ప్రధాన ఆజ్ఞను ‘అమర్చాలి’గా ఇచ్చాం.
- source_word: לּוֹ
  choice: దానికి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలోని బల్లను సూచిస్తుంది; తెలుగులో జడవస్తువుకు ‘దానికి’ సహజం.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: నాలుగు బంగారు ఉంగరాలు
  rationale: సంఖ్య, వస్తువు, పదార్థం అన్నీ స్పష్టంగా ఉండే సహజ ఆధునిక తెలుగు రూపం.
- source_word: וְנָתַתָּ
  choice: అమర్చాలి
  rationale: నָתַן ఇక్కడ నిర్మాణ సూచనలో ఉంచడం లేదా బిగించడం అనే భావాన్ని ఇస్తుంది; ఉంగరాలను బల్లకు జోడించే సందర్భంలో ‘అమర్చాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל
  choice: పై
  rationale: నిర్దేశించిన స్థానంపై ఉంగరాలను ఉంచడాన్ని సూచించే సాధారణ స్థానార్థక రూపం.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: నాలుగు మూలలు
  rationale: פֵּאָה అంచు, పక్క లేదా మూలను సూచించగలదు. ఈ సామగ్రి నిర్మాణ సందర్భంలో నాలుగు చివరి స్థానాలకు ‘మూలలు’ సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: దాని నాలుగు కాళ్ల దగ్గర ఉన్న
  rationale: רֶגֶל పాదం లేదా కాలు అనే అర్థాలు కలిగి ఉంది. బల్ల సందర్భంలో ‘కాళ్లు’ సహజం; לְ సంబంధం లేదా సమీప స్థానాన్ని సూచించగలందున ‘దగ్గర ఉన్న’ అని ఇచ్చాం.
