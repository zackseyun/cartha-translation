source:
  edition: WLC
  text: וּ/רְאֵ֖ה וַ/עֲשֵׂ֑ה בְּ/תַ֨בְנִיתָ֔/ם אֲשֶׁר אַתָּ֥ה מָרְאֶ֖ה בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: te
  text: కొండమీద నీకు చూపించబడుతున్న నమూనాకు అనుగుణంగా వాటిని తయారుచేయాలని జాగ్రత్తగా చూడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడు, కొండమీద నీకు చూపించబడిన వాటి నమూనా ప్రకారం వాటిని తయారుచేయి.”
    reason: మూలంలోని రెండు సమన్విత ఆజ్ఞలను మరింత నేరుగా ప్రతిబింబించే ప్రత్యామ్నాయం. “చూపించబడిన” అనేది מָרְאֶה అనే కృదంతాన్ని సందర్భానుసారంగా పూర్తయిన చర్యగా అర్థం చేసుకున్న రూపం.
lexical_decisions:
- source_word: וּרְאֵה
  choice: జాగ్రత్తగా చూడు
  rationale: ראה ఆజ్ఞారూపం ఇక్కడ కేవలం చూడడాన్ని కాక, తరువాతి ఆజ్ఞను శ్రద్ధగా పాటించాలనే హెచ్చరికను వ్యక్తం చేస్తుంది; ‘జాగ్రత్తగా చూడు’ ఆ భావాన్నీ ఆజ్ఞా బలాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַעֲשֵׂה
  choice: తయారుచేసేలా
  rationale: నిర్మించవలసిన వస్తువుల సందర్భంలో עשה కు ‘తయారుచేయు’ సహజమైన సమానార్థకం. ముందున్న హెచ్చరికతో దీనిని అనుసంధానించడానికి ‘తయారుచేసేలా’ అని ఇచ్చాం.
- source_word: בְּתַבְנִיתָם
  choice: వాటి నమూనా ప్రకారం
  rationale: תבנית అంటే నమూనా, ఆకృతి లేదా రూపం. బహువచన స్వామ్య ప్రత్యయం ముందుగా వివరించిన వస్తువులను సూచిస్తుంది; ‘వాటి నమూనా ప్రకారం’ మూలంలోని అనుగుణత భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר
  choice: చూపించబడిన
  rationale: సంబంధవాచక అవ్యయం నమూనాను విశేషించే ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; తెలుగులో అసమాపక విశేషణ నిర్మాణం సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: మూలంలో స్వతంత్ర సర్వనామం స్పష్టంగా ఉండి మోషేను ఉద్దేశిస్తుంది; తెలుగులో ‘నీవు’ దానిని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: מָרְאֶה
  choice: చూపించబడిన
  rationale: ఇది ראה ధాతువు హోఫాల్ రూపంగా, ‘చూపించబడుట’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఇప్పటికే కొండపై చూపించిన నమూనాను సూచిస్తున్నందున పూర్తయిన భావంతో ‘చూపించబడిన’ అని ఇచ్చాం; కాలసూక్ష్మతపై ఉన్న ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: בָּהָר
  choice: కొండమీద
  rationale: సీనాయి కొండపై మోషే ఉన్న స్థలాన్ని సూచించే ఈ సందర్భంలో בְּ కు ‘మీద’ సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: పరిశుద్ధ గుడారపు వస్తువులకు వెల్లడించబడిన నమూనా స్వభావం
  choice: నమూనా
  alternative: ఆకృతి; రూపం; ప్రణాళిక
  rationale: תבנית చూపించబడిన నమూనా లేదా రూపాన్ని సూచిస్తుంది; అది పరలోక మూలరూపమా లేక నిర్మాణ ప్రణాళికా అని అనువాదమే నిర్ణయించకుండా ‘నమూనా’ వచనంలోని ధార్మిక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘జాగ్రత్తగా చూడు’ అనే ప్రయోగం హీబ్రూ హెచ్చరికాత్మక ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది; ‘నమూనా’ పదం అనవసరమైన సిద్ధాంత నిర్ణయాన్ని నివారిస్తుంది.
