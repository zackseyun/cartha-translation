translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని కొలతల క్రమాన్ని నిలిపి, తెలుగులో స్పష్టత కోసం ‘ఉండాలి’ని చేర్చాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
