  text: וְ/עָשׂ֥וּ אֲר֖וֹן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: te
  text: వారు అకేషియా చెక్కతో[a] ఒక మందసాన్ని[b] చేయాలి. దాని పొడవు రెండున్నర మూరలు[c], వెడల్పు ఒకటిన్నర మూరలు, ఎత్తు ఒకటిన్నర మూరలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘షిట్టీమ్ చెక్క’; సాధారణంగా అకేషియా జాతికి చెందిన చెక్కగా గుర్తించబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పెట్టె’ లేదా ‘పేటిక’; హీబ్రూ పదం ఒక పెట్టెవంటి పాత్రను సూచిస్తుంది. ఇక్కడ పవిత్రమైన ఒడంబడిక మందసం సందర్భం కావడంతో ‘మందసం’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: c
    text: మూర అనేది మోచేతి నుంచి చేతివేళ్ల చివర వరకు ఉన్న దూరం ఆధారంగా ఏర్పడిన ప్రాచీన పొడవు కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: వారు ... చేయాలి
  rationale: నిర్దేశాత్మక సందర్భంలోని క్రియను ఆధునిక, సహజమైన తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది; ఆరంభ సంధికారకాన్ని తెలుగు ప్రవాహంలో విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: אֲרוֹן
  choice: మందసం
  rationale: ఈ పదం పెట్టెవంటి భద్రపాత్రను సూచిస్తుంది. పవిత్ర సందర్భానికి తగిన గౌరవప్రదమైన ‘మందసం’ మూలపదార్థాన్ని నిలుపుతుంది; ఒడంబడిక మందసం అనే స్థిర బైబిలు వాడుకతోనూ సరిపోతుంది.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్కతో
  rationale: షిట్టీమ్/అకేషియా జాతి కలపకు తెలుగులో పరిచితమైన సమానార్థకంగా ‘తుమ్మచెక్క’ను ఎంచుకున్నాం; నిర్మాణ పదార్థాన్ని ‘తో’ సహజంగా తెలియజేస్తుంది.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: రెండున్నర మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణానికి మార్చకుండా, తెలుగులో స్థిరపడిన ‘మూర’తో పరిమాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: మందసాన్ని సూచించే ఏకవచన ప్రత్యయార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְאַמָּה וָחֵצִי
  choice: ఒకటిన్నర మూరలు
  rationale: మూలంలోని ‘ఒక మూర మరియు సగం’ పరిమాణాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רָחְבּוֹ
  choice: వెడల్పు
  rationale: వస్తువు యొక్క అడ్డ కొలతను సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదంతో అందిస్తుంది.
- source_word: קֹמָתוֹ
  choice: ఎత్తు
  rationale: వస్తువు యొక్క నిలువు కొలతను సందర్భానుగుణంగా, సహజంగా తెలియజేస్తుంది.
