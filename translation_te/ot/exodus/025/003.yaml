translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఆదేశ భావం నిలుపబడింది; లోహపదంలోని నిజమైన నిఘంటు అనిశ్చితి పాదటిప్పణిలో భద్రపరచబడింది.
