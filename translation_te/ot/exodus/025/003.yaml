  edition: WLC
  text: וְ/זֹאת֙ הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר תִּקְח֖וּ מֵ/אִתָּ֑/ם זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: te
  text: 'మీరు వారి దగ్గర నుంచి తీసుకోవలసిన సమర్పణ ఇదే: బంగారం, వెండి, కంచు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగి’; హీబ్రూ పదం נְחֹשֶׁת సందర్భాన్ని బట్టి రాగిని లేదా కంచును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: ఇదే
  rationale: వావ్ సంధానం మరియు సూచక సర్వనామం తరువాత వచ్చే జాబితాను పరిచయం చేస్తున్నాయి. తెలుగు వాక్యప్రవాహంలో ‘ఇదే’ ఆ ప్రదర్శనాత్మక బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַ/תְּרוּמָה
  choice: సమర్పణ
  rationale: תְּרוּמָה పవిత్ర ప్రయోజనం కోసం ప్రత్యేకంగా ఇచ్చే వస్తుసహాయాన్ని సూచిస్తుంది. ‘సమర్పణ’ దాని అర్పణ భావాన్ని నిలుపుతూ, ఇక్కడ సేకరించే సామగ్రికి కూడా సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: మీరు వారి దగ్గర నుంచి తీసుకోవలసిన
  rationale: לקח క్రియ యొక్క ఆదేశార్థక భావాన్ని ‘తీసుకోవలసిన’ నిలుపుతుంది; מֵאִתָּם ను ‘వారి దగ్గర నుంచి’ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: ఈ పదానికి సాధారణమైన, సందర్భోచితమైన తెలుగు లోహనామం.
- source_word: וָ/כֶסֶף
  choice: వెండి
  rationale: జాబితాలోని లోహానికి సాధారణమైన తెలుగు పదం.
- source_word: וּ/נְחֹשֶׁת
  choice: కంచు
  rationale: నְחֹשֶׁת రాగిని లేదా రాగి మిశ్రమమైన కంచును సూచించగలదు. ప్రత్యక్ష గుడారపు సామగ్రి సందర్భంలో సంప్రదాయబద్ధంగా, సంభావ్యంగా ‘కంచు’ సరిపోతుంది; ‘రాగి’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
