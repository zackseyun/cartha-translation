source:
  edition: WLC
  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: te
  text: కెరూబులు తమ రెక్కలను పైకి చాచి, తమ రెక్కలతో ప్రాయశ్చిత్తపు మూతను[a] కప్పుతూ ఉండాలి. వాటి ముఖాలు ఒకదానికొకటి ఎదురుగా ఉండాలి; కెరూబుల ముఖాలు ప్రాయశ్చిత్తపు మూతవైపు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనిని “కరుణాపీఠం” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం మందసం మీదున్న బంగారు మూతను సూచిస్తుంది.
    reason: כַּפֹּרֶת పదానికి ఉన్న సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని, అది సూచించే భౌతిక వస్తువును స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וְהָיוּ
  choice: ఉండాలి
  rationale: నిర్మాణ నిర్దేశాల సందర్భంలో ఈ క్రియ ఆదేశాత్మక భావాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘ఉండాలి’ సహజంగా దానిని తెలియజేస్తుంది.
- source_word: הַכְּרֻבִים
  choice: కెరూబులు
  rationale: ఈ పరలోక జీవులకు వాడే హీబ్రూ పేరును తెలుగు బైబిలు పరిభాషకు తగిన విధంగా లిప్యంతరీకరించింది.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: తమ రెక్కలను పైవైపుకు చాచి
  rationale: రెక్కలు విస్తరించి పైకి తిరిగి ఉన్న భంగిమను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: వాటితో ... కప్పుతూ
  rationale: సכך అనే పదంలోని కప్పే లేదా ఆవరించే భావాన్ని, రెక్కలే సాధనమని సూచించే בְּ భావంతో కలిపి తెలియజేస్తుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత
  rationale: ఇది మందసానికి చెందిన బంగారు మూతను సూచిస్తుంది; దాని ఆరాధనాత్మక ప్రాయశ్చిత్త సంబంధాన్ని కూడా కాపాడుతుంది.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: వాటి ముఖాలు ఒకదానికొకటి ఎదురుగా
  rationale: ‘ఒకడు తన సహోదరునివైపు’ అనే హీబ్రూ పంపిణీ ప్రయోగంలోని పరస్పర దిశను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: కెరూబుల ముఖాలు ప్రాయశ్చిత్తపు మూతవైపు ఉండాలి
  rationale: ముఖాల దిశను స్పష్టంగా నిలుపుతూ హీబ్రూ వాక్యంలోని దృశ్యరూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: כַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాపీఠం; మూత
  rationale: ఈ పదం మందసం మీదున్న బంగారు మూతను సూచించడమే కాక ప్రాయశ్చిత్త ఆచారంతో దానికి ఉన్న సంబంధాన్ని కూడా సూచిస్తుంది. ‘ప్రాయశ్చిత్తపు మూత’ వస్తువు స్వరూపాన్నీ దాని ఆరాధనాత్మక ప్రాముఖ్యతనూ తెలియజేస్తుంది; ప్రత్యామ్నాయ సంప్రదాయ పదాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా భావపరమైన పరిధిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ఆదేశాత్మక నిర్మాణ సందర్భానికి ‘ఉండాలి’ వాడబడింది. ‘కెరూబులు’ అనే స్థిరమైన పవిత్రగ్రంథ పరిభాషను నిలుపుకుంది.
