  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/צִפִּיתָ֥ אֹת֖/וֹ זָהָ֣ב טָה֑וֹר וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/024.yaml
  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: te
  text: దానిపై స్వచ్ఛమైన బంగారాన్ని పొదగాలి; దానికి చుట్టూ బంగారు అలంకారపు అంచును చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బంగారు పట్టీ’ లేదా ‘బంగారు అంచు.’ హీబ్రూ పదం అలంకారంగా అమర్చిన చుట్టుపట్టును సూచించవచ్చు. సంప్రదాయంగా కొందరు దీనిని ‘కిరీటం’ అని అనువదించారు; అయితే ఇక్కడ అది బల్ల చుట్టూ ఉండే అలంకారపు అంచును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: రేకును పొదిగించాలి
  rationale: צפה అనే క్రియ ఇక్కడ చెక్క వస్తువుపై లోహపు పొరను అమర్చడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బంగారం రేకును పొదిగించాలి’ అనేది కేవలం కప్పడం కంటే ఈ శిల్పక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: దానికి
  rationale: ఈ సర్వనామం ముందరి వచనంలోని బల్లను సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో పొదిగించే ఉపరితలాన్ని ‘దానికి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: అధిక శుద్ధతగల బంగారాన్ని సూచించే ఈ పదబంధానికి ఇది సహజమైన, పారదర్శకమైన తెలుగు సమానం.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: עשה అనే సాధారణ ‘చేయు/తయారుచేయు’ క్రియను అదనపు శిల్పార్థం చేర్చకుండా ఆదేశ రూపంలో అందిస్తుంది.
- source_word: לּוֹ
  choice: దాని
  rationale: ఆ అంచు బల్ల కోసం, దానికే అనుసంధానంగా చేయబడుతుందని తెలుగు స్వామ్య నిర్మాణంలో సహజంగా తెలుపుతుంది.
- source_word: זֵר
  choice: అలంకారపు అంచు
  rationale: ఇక్కడ זֵר బల్ల చుట్టూ ఉండే అలంకార అంచు లేదా పట్టీని సూచిస్తుంది. ‘కిరీటం’ అనే పదం ఆధునిక పాఠకుణ్ణి తప్పుదోవ పట్టించవచ్చు; ‘అలంకారపు అంచు’ ఆకృతి, ప్రయోజనం రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: זָהָב
  choice: బంగారంతో
  rationale: పదార్థాన్ని నేరుగా సూచిస్తుంది; తెలుగు వాక్యంలో నిర్మాణ పదార్థాన్ని ‘తో’ విభక్తితో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అన్ని వైపులా ఆవరించి ఉండే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
