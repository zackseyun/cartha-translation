translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. శిల్పకళా సందర్భాన్ని స్పష్టపరచడానికి ‘బంగారం రేకు’ మరియు ‘అలంకారపు అంచు’ అనే పదబంధాలను ఎంచుకున్నాం. మూలంలోని వరుస ఆదేశాలను తెలుగు సహజత్వం కోసం ‘చేయాలి’ రూపంలో అందించాం.
