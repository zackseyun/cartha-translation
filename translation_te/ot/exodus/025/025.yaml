source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: te
  text: దానికి చుట్టూ ఒక అరచేతి వెడల్పుగల అంచును చేయాలి; ఆ అంచు చుట్టూ బంగారు అలంకారపు పట్టీని చేయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ అంచు చుట్టూ బంగారు కిరీటాన్ని చేయాలి’ అని కూడా అనువదించవచ్చు. హీబ్రూ זֵר అనే పదం అలంకారపు అంచును లేదా పట్టీని సూచించగలదు; ‘కిరీటం’ అనేది సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: అంచు
  rationale: బల్లకు అమర్చే నిర్మాణాత్మక చుట్టుపట్టును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అంచు’ సహజంగా ఉండి, మూలపదం కంటే అధిక నిర్మాణవివరాన్ని జోడించదు.
- source_word: טֹפַח
  choice: ఒక అరచేతి వెడల్పుగల
  rationale: ఈ పదం ‘అరచేతి వెడల్పు’ అనే కొలతను సూచిస్తుంది; అంచు పరిమాణాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి విశేషణ రూపంలో ఇచ్చాం.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: రెండు సందర్భాల్లోనూ పూర్తిగా చుట్టుముట్టే అమరికను సూచిస్తుంది; మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: זֵר
  choice: అలంకారపు పట్టీ
  rationale: గుడారపు సామగ్రి సందర్భంలో ఇది చుట్టూ ఉండే అలంకార అంచు లేదా మోల్డింగ్‌ను సూచిస్తుంది. ‘కిరీటం’ అనే సంప్రదాయ అర్థం ఆధునిక పాఠకునికి వేరే వస్తువును సూచించవచ్చు; దానిని పాదసూచికలో నిలిపాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: పట్టీ ఏ పదార్థంతో చేయబడాలో సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: దానికి / ఆ అంచు
  rationale: సర్వనామాలు సందర్భంలోని బల్లను, దాని అంచును సూచిస్తాయి. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘దానికి’, ‘ఆ అంచు’ అని ఇచ్చాం.
- source_word: וְעָשִׂיתָ
  choice: చేయాలి
  rationale: వరుసగా ఇచ్చిన ఆదేశ భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
