    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలు కుమారులకు.” హీబ్రూలోని ఉపసర్గను “కోసం” లేదా “కు” అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
