id: EXO.25.22
reference: Exodus 25:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נוֹעַדְתִּ֣י לְ/ךָ֮ שָׁם֒ וְ/דִבַּרְתִּ֨י אִתְּ/ךָ֜ מֵ/עַ֣ל הַ/כַּפֹּ֗רֶת מִ/בֵּין֙ שְׁנֵ֣י הַ/כְּרֻבִ֔ים אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת אֵ֣ת כָּל אֲשֶׁ֧ר אֲצַוֶּ֛ה אוֹתְ/ךָ֖ אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: te
  text: అక్కడ నేను నీతో కలుసుకుంటాను; సాక్ష్యపు మందసం మీద ఉన్న ఇద్దరు కెరూబుల మధ్యనుండి, ప్రాయశ్చిత్తపు మూత పైనుండి, ఇశ్రాయేలు కుమారుల కోసం నేను నీకు ఆజ్ఞాపించే వాటన్నిటి గురించి నీతో మాట్లాడుతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: అక్కడ నేను నీతో కలుసుకుంటాను
  rationale: יעד యొక్క నిఫాల్ రూపం ఇక్కడ నిర్ణీత స్థలంలో కలుసుకోవడాన్ని సూచిస్తుంది. ‘నీతో కలుసుకుంటాను’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: నీతో మాట్లాడుతాను
  rationale: דבר తో వచ్చిన אֵת ప్రత్యక్షమైన సంబంధపూర్వక సంభాషణను సూచిస్తుంది; అందువల్ల ‘నీతో’ అని అనువదించబడింది.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత పైనుండి
  rationale: כַּפֹּרֶת మందసం మీదున్న బంగారు మూతను సూచిస్తూ ప్రాయశ్చిత్త ఆచారంతో ప్రత్యేకంగా సంబంధించింది. ‘ప్రాయశ్చిత్తపు మూత’ వస్తువు మరియు దాని ఆరాధనాపరమైన ప్రాముఖ్యత రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: ఇద్దరు కెరూబుల మధ్యనుండి
  rationale: స్థానసంబంధమైన హీబ్రూ పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది; కెరూబులు అనే ప్రత్యేకమైన పరలోక జీవుల పేరును లిప్యంతరీకరించి నిలిపింది.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: సాక్ష్యపు మందసం మీద ఉన్న
  rationale: עַל ఇక్కడ కెరూబుల స్థానాన్ని సూచిస్తుంది. הָעֵדֻת ను వ్యాఖ్యానాత్మకంగా ‘నిబంధన పలకలు’ అని విస్తరించకుండా ‘సాక్ష్యం’గానే ఉంచింది.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אֹתְךָ
  choice: నేను నీకు ఆజ్ఞాపించే వాటన్నిటి గురించి
  rationale: כָּל యొక్క సమగ్రతను నిలుపుతూ, మాట్లాడే విషయాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘గురించి’ ఉపయోగించబడింది.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల కోసం
  rationale: మోషేకు ఇవ్వబడే ఆజ్ఞలు ఇశ్రాయేలు ప్రజల కోసం ఉద్దేశించబడ్డాయనే భావాన్ని వ్యక్తం చేస్తుంది. హీబ్రూలోని కుటుంబపరమైన జాతీయ ప్రయోగాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలిపింది.
theological_decisions:
- issue: הַכַּפֹּרֶת యొక్క అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాపీఠం; మూత
  rationale: ఇది మందసం మీదున్న నిర్దిష్టమైన బంగారు మూత. ‘ప్రాయశ్చిత్తపు మూత’ అనే రూపం వస్తువును స్పష్టంగా గుర్తించడంతో పాటు దాని ఆరాధనాపరమైన విధిని సూచిస్తుంది; ‘కరుణాపీఠం’ సంప్రదాయ ప్రత్యామ్నాయంగా పాదసూచికలో ఇవ్వబడింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క జాతీయ-కుటుంబ ప్రయోగం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ మూలంలోని కుటుంబపరమైన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుందనే విషయాన్ని అనువాదంలో సిద్ధాంతపరంగా సంకుచితం చేయలేదు.
- issue: אֶל యొక్క సంబంధ భావం
  choice: కోసం
  alternative: కు
  rationale: ఆజ్ఞలు ఇశ్రాయేలు కుమారులకు ఉద్దేశించబడ్డాయనే భావాన్ని ‘కోసం’ సహజంగా అందిస్తుంది. దిశను మరింత అక్షరార్థంగా చూపే ‘కు’ కూడా సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని మూడు తెలుగు వాక్యాలుగా విభజించినా, స్థల సూచనలు మరియు ఆజ్ఞల విషయసంబంధం యథాతథంగా నిలిపబడ్డాయి. ‘మందసం,’ ‘కెరూబులు,’ ‘ప్రాయశ్చిత్తం’ వంటి అవసరమైన బైబిలు పదజాలాన్ని మాత్రమే ఉంచి, పాతకాలపు క్రియారూపాలను నివారించాం.
