source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: te
  text: నీవు స్వచ్ఛమైన బంగారంతో ఒక దీపస్తంభాన్ని చేయాలి. ఆ దీపస్తంభాన్ని సుత్తితో కొట్టి మలిచినదిగా[a] చేయాలి. దాని పీఠం, కాండం, కప్పులు, మొగ్గలు[b], పువ్వులు దానితో ఒకే ముక్కగా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సుత్తితో కొట్టి చేసినదిగా’ అని కూడా అనువదించవచ్చు. దీపస్తంభాన్ని విడివిడి భాగాలను జోడించి కాకుండా, ఒకే బంగారు ముక్కను సుత్తితో కొట్టి మలిచి చేయాలని హీబ్రూ పదం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దాని బుడిపెలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పుష్ప రూపకల్పనలోని గుండ్రని ఉబ్బెత్తు అలంకారాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: దీపస్తంభం
  rationale: ఈ పదం దీపాలను మోసే నిర్మాణాన్ని సూచిస్తుంది; దీపాలనే కాదు. ‘దీపస్తంభం’ ఆధునిక తెలుగులో స్పష్టమైన సహజ సమానార్థకం.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: శుద్ధి చేయబడిన, మలినాలు లేని బంగారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִקְשָׁה
  choice: సుత్తితో మలిచిన పని
  rationale: బంగారాన్ని సుత్తితో కొట్టి ఒకే ఘన భాగం నుంచి ఆకారమిచ్చే లోహకళా విధానాన్ని సూచిస్తుంది.
- source_word: תֵּעָשֶׂה
  choice: చేయబడాలి
  rationale: ఆదేశ సందర్భంలోని ఈ కర్మణి రూపాన్ని తెలుగులో విధ్యర్థక కర్మణి ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: יְרֵכָהּ
  choice: దాని పీఠం
  rationale: అక్షరార్థంగా ‘తొడ/ప్రక్క’ అనే భావమున్నా, ఇక్కడ వస్తువు యొక్క దిగువ ఆధార భాగాన్ని సూచిస్తుంది; ‘పీఠం’ ఆ నిర్మాణార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְקָנָהּ
  choice: దాని కాండం
  rationale: ఇక్కడ దీపస్తంభపు మధ్య ప్రధాన నిలువు భాగాన్ని సూచిస్తుంది. తరువాత చెప్పే పక్క కొమ్మలతో గందరగోళం రాకుండా ‘కాండం’ అనుకూలం.
- source_word: גְּבִיעֶיהָ
  choice: దాని పాత్రలు
  rationale: దీపస్తంభంలోని గిన్నె లేదా కప్పు ఆకార అలంకార భాగాలను సూచిస్తుంది; ‘పాత్రలు’ విస్తృతమైనా సహజంగా అర్థమయ్యే పదం.
- source_word: כַּפְתֹּרֶיהָ
  choice: దాని మొగ్గలు
  rationale: గుండ్రని ఉబ్బెత్తు అలంకారాలను సూచించే పదం. దీపస్తంభపు పుష్ప రూపకల్పనలో ‘మొగ్గలు’ సహజంగా సరిపోతుంది; ‘బుడిపెలు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּפְרָחֶיהָ
  choice: దాని పువ్వులు
  rationale: స్పష్టమైన పుష్ప అలంకరణను సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: అన్నీ దానితోనే ఏకఖండంగా ఉండాలి
  rationale: ఈ భాగాలు విడిగా తయారుచేసి అతికించినవి కాక, దీపస్తంభం నుంచే ఒకే ముక్కగా రూపుదిద్దుకోవాలనే నిర్మాణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
