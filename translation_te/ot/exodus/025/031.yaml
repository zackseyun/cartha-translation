  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా భాషను సహజపరిచాయి: లోహకళా పదబంధంలోని భారాన్ని తగ్గించాయి, కప్పు-ఆకార భాగాలకు మరింత నిర్దిష్ట పదాన్ని ఉపయోగించాయి, మరియు పాదటిప్పణిలోని అనౌపచారిక ‘ముద్ద’ స్థానంలో ఖచ్చితమైన ‘ముక్క’ను ఉంచాయి. మూలంలోని ఒకే ముక్కగా నిర్మించాలనే భావం, అలాగే అలంకార భాగాల అర్థసందిగ్ధత, రెండూ నిలుపబడ్డాయి.'
