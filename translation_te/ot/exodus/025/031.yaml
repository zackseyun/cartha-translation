translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వస్తువును సూచించే స్త్రీలింగ హీబ్రూ సర్వనామాలను తెలుగులో సహజమైన ‘దాని’ రూపంతో ఇచ్చాం. సాంకేతిక లోహకళా భావాన్ని ప్రధాన వాక్యంలో స్పష్టంగా ఉంచి, నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో సంరక్షించాం.
