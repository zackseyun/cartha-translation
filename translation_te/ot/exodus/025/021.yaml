id: EXO.25.21
reference: Exodus 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֧ אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָ֑עְלָ/ה וְ/אֶל הָ֣/אָרֹ֔ן תִּתֵּן֙ אֶת הָ֣/עֵדֻ֔ת אֲשֶׁ֥ר אֶתֵּ֖ן אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: te
  text: నీవు ప్రాయశ్చిత్తపు మూతను[a] మందసం మీద ఉంచాలి; నేను నీకు ఇచ్చే సాక్ష్యాన్ని మందసంలో ఉంచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కరుణాసనం.’ హీబ్రూ పదం మందసం మూతను సూచిస్తుంది; దానికి బలి, ప్రాయశ్చిత్త భావాలతో సంబంధం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఈ పదం మందసం మూతను సూచించడమే కాక ప్రాయశ్చిత్త ఆచారంతోనూ సంబంధం కలిగి ఉంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువు స్వరూపాన్నీ దాని ఆరాధనా ప్రాముఖ్యతనూ స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִלְמָעְלָה
  choice: పైన
  rationale: ఇక్కడ ప్రాయశ్చిత్త మూతను మందసానికి సంబంధించి ఎక్కడ ఉంచాలో తెలిపే సహజమైన స్థానార్థం.
- source_word: עֵדֻת
  choice: సాక్ష్యం
  rationale: హీబ్రూ పదంలోని నిబంధన-సాక్ష్య భావాన్ని కాపాడుతూ, ఈ వచనంలో స్పష్టంగా లేని ‘పలకలు’ అనే వివరాన్ని చేర్చదు.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: ఉంచాలి / ఉంచాలి / ఇచ్చే
  rationale: మొదటి రెండు సందర్భాల్లో వస్తువులను నిర్దిష్ట స్థానంలో పెట్టడం ఉద్దేశం; దేవుడు సాక్ష్యాన్ని మోషేకు అందించడం చివరి సందర్భంలోని భావం.
- source_word: אֶל הָאָרֹן
  choice: మందసంలో
  rationale: אֶל సాధారణంగా ‘వైపు/కు’ అని అర్థమిచ్చినా, נתן మరియు సాక్ష్యం అనే కర్మతో కలిసి ఇక్కడ మందసం లోపల ఉంచడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో כַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాసనం
  rationale: హీబ్రూ పదం మందసం మూతను సూచిస్తూ ప్రాయశ్చిత్త ఆచారంతో సంబంధం కలిగి ఉంది. ‘ప్రాయశ్చిత్త మూత’ తెలుగులో వస్తువునూ దాని ఆచార సంబంధాన్నీ నేరుగా తెలియజేస్తుంది; ‘కరుణాసనం’ సంప్రదాయబద్ధమైనప్పటికీ అది సాధారణ పాఠకునికి నిజమైన మూత అనే భావాన్ని అంత స్పష్టంగా తెలియజేయకపోవచ్చు. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి భావపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘మందసం,’ ‘ప్రాయశ్చిత్తం,’ ‘సాక్ష్యం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, మూలంలో లేని ‘పలకలు’ వంటి వివరణను చేర్చలేదు.
