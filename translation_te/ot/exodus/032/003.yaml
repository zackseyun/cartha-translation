  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ తమ చెవుల్లో ఉన్న బంగారు పోగులను తీసి, అహరోను దగ్గరికి తీసుకొచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తీసి’ అనే మాటకు బదులుగా ‘ఊడదీసి’ లేదా ‘విప్పి తీసి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ బలంగా తొలగించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: తీసి
  rationale: హిత్పయేల్ రూపం తమ మీదున్న ఆభరణాలను తామే తొలగించుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తీసి’ సహజంగా ఉంది; క్రియలో బలవంతంగా విడదీయడం అనే ఛాయ కూడా ఉండవచ్చు.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: సమకూడిన సమాజం మొత్తాన్ని సమష్టిగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: נִזְמֵי הַזָּהָב
  choice: బంగారు పోగులను
  rationale: נֶזֶם అనేది చెవి లేదా ముక్కుకు ధరించే ఉంగరాకార ఆభరణాన్ని సూచించగలదు. ఇక్కడ ‘వారి చెవుల్లో’ అని స్పష్టంగా ఉన్నందున ‘పోగులు’ సందర్భానికి తగిన సహజమైన తెలుగు పదం.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: తమ చెవుల్లో ఉన్న
  rationale: ఆ ఆభరణాల స్థానాన్ని తెలిపే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా, మూలంలోని בְּ భావానికి దగ్గరగా అందిస్తుంది.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: అహరోను దగ్గరికి తీసుకొచ్చారు
  rationale: ‘తీసుకురావడం’ అనే క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; తీసుకొచ్చిన వస్తువు పోగులేనని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘అహరోను’ అనే సంప్రదాయ తెలుగు రూపాన్ని ఉంచి, ఆభరణానికి సందర్భానుగుణంగా ‘పోగులు’ వాడబడింది.
