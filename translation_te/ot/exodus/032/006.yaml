base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: te
  text: మరుసటి రోజు వారు తెల్లవారగానే లేచి, దహనబలులు అర్పించి, సమాధానబలులు తీసుకొచ్చారు. అప్పుడు ప్రజలు తినడానికి, తాగడానికి కూర్చున్నారు; తరువాత ఉల్లాసకేళి చేయడానికి లేచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆడుకోవడానికి లేచారు.” ఇక్కడి హీబ్రూ క్రియకు “ఆడుకోవడం,” “వేడుక చేసుకోవడం,” లేదా “ఉల్లాసకేళి చేయడం” అనే అర్థాలు రావచ్చు. ఈ సందర్భం అమాయకమైన ఆటకన్నా అదుపుతప్పిన ఉత్సవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: మరుసటి రోజు వారు పెందలకడనే లేచి
  rationale: שׁכם హిఫీల్ రూపం తెల్లవారుజామునే లేదా పెందలకడనే లేవడాన్ని సూచిస్తుంది; מִמָּחֳרָת ముందటి సంఘటనల తరువాతి రోజును సూచిస్తుంది.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: దహనబలులు అర్పించి
  rationale: బలుల సందర్భంలో עלה + עֹלָה పూర్తిగా దహనం చేసే బలులను అర్పించడాన్ని సూచిస్తుంది; ‘దహనబలులు’ స్థిరమైన, స్పష్టమైన బలిపదం.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: సమాధానబలులు తీసుకొచ్చారు
  rationale: נגשׁ ఇక్కడ బలులను దగ్గరకు తీసుకురావడం లేదా సమర్పించడం; שְׁלָמִים అనే బలి వర్గానికి ‘సమాధానబలులు’ అనే రూపం మూలపదంలోని శాంతి/సంపూర్ణత భావాన్ని, బలి వర్గ భేదాన్ని నిలుపుతుంది.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: ప్రజలు తినడానికి, తాగడానికి కూర్చున్నారు
  rationale: మూలంలోని కూర్చోవడం, తినడం, తాగడం అనే వరుసను సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: ఉల్లాసకేళిలో మునగడానికి లేచారు
  rationale: צחק ఆట, వినోదం, వేడుక లేదా అదుపుతప్పిన కేళి అనే విస్తృత అర్థాలను కలిగి ఉంది. విగ్రహారాధనా విందు సందర్భంలోని ప్రతికూల ఛాయను చూపుతూ, లైంగిక ప్రవర్తనను అనవసరంగా నిర్దిష్టం చేయకుండా ఈ ఎంపిక చేశాం.
theological_decisions:
- issue: బంగారు దూడ సందర్భంలో לְצַחֵק యొక్క భావం
  choice: ఉల్లాసకేళిలో మునగడానికి
  alternative: ఆడుకోవడానికి; వేడుక చేసుకోవడానికి
  rationale: ఈ క్రియ స్వతహాగా అమాయకమైన ఆటను కూడా సూచించగలదు. అయితే ఇక్కడ విగ్రహం ఎదుట బలులు, విందు, తరువాతి తీర్పు ఉన్నందున అదుపుతప్పిన విగ్రహారాధనా ఉల్లాసం అనే ప్రతికూల భావం సందర్భానుకూలం. అయినా వచనం స్పష్టంగా చెప్పని లైంగిక అర్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దహనబలులు,’ ‘సమాధానబలులు’ అనే బలిపదాలు వర్గభేదాన్ని నిలుపుతాయి. మూలంలోని వరుస చర్యలు స్పష్టంగా ఉండేలా వాక్యాన్ని రెండు భాగాలుగా అమర్చాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
