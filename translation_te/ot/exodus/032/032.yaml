  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: te
  text: అయితే ఇప్పుడు, నీవు వారి పాపాన్ని క్షమిస్తే[a]—కాని క్షమించకపోతే, దయచేసి నీవు వ్రాసిన నీ పుస్తకం నుండి నన్ను తుడిచివేయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్షమించు’ అని అనువదించిన హీబ్రూ నుడికారం అక్షరార్థంగా పాపాన్ని ‘ఎత్తడం’ లేదా ‘మోయడం’ అని చెబుతుంది; దీనిని ‘పాపాన్ని తొలగించడం’ లేదా ‘మన్నించడం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ పుస్తకం’ అనేది జీవించి ఉన్నవారి దైవిక నమోదును లేదా విస్తృతార్థంలో జీవగ్రంథాన్ని సూచించవచ్చు; హీబ్రూ పాఠం దీనిని మరింత స్పష్టంగా నిర్వచించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: మునుపటి విన్నపం నుంచి మోషే చేస్తున్న అత్యవసర విజ్ఞాపనకు మార్పును, సందర్భంలోని స్వల్ప వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: వారి పాపాన్ని క్షమిస్తే
  rationale: נשׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు/మోయు’ అనే భావం ఉన్నా, ‘పాపం’ కర్మగా వచ్చిన ఈ ప్రయోగం పాపాన్ని తొలగించడం లేదా క్షమించడం అనే నుడికారార్థాన్ని ఇస్తుంది. ‘క్షమిస్తే’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאִם אַיִן
  choice: కాని క్షమించకపోతే
  rationale: హీబ్రూలో ఇది సంక్షిప్తమైన ‘కాని లేకపోతే’ అనే షరతు. తెలుగులో దాని సూచిత క్రియను పునరుక్తి చేయడం వాక్యార్థాన్ని సహజంగా, స్పష్టంగా చేస్తుంది.
- source_word: מְחֵנִי נָא
  choice: దయచేసి ... నన్ను తుడిచివేయి
  rationale: מחה రాతలోని పేరు లేదా నమోదును తుడిచివేయడాన్ని సూచిస్తుంది; נא విజ్ఞాపన స్వరాన్ని తెలియజేస్తుంది. ఈ ఎంపిక పుస్తకపు రూపకాన్ని, మోషే విన్నప తీవ్రతను కాపాడుతుంది.
- source_word: מִסִּפְרְךָ אֲשֶׁר כָּתָבְתָּ
  choice: నీవు రాసిన నీ పుస్తకంలోనుంచి
  rationale: סֵפֶר అనే పదానికి పుస్తకం, చుట్ట, లిఖిత నమోదు అనే అర్థాలు ఉండవచ్చు. ‘పుస్తకం’ మూలంలోని అనిర్దిష్టతను కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘నీ పుస్తకం’ దేనిని సూచిస్తుంది?
  choice: నీ పుస్తకం
  alternative: జీవగ్రంథం; జీవించి ఉన్నవారి దైవిక నమోదు; నీ చుట్ట/నమోదు
  rationale: హీబ్రూ పాఠం ఆ పుస్తకాన్ని మరింత నిర్దిష్టంగా గుర్తించదు. అందువల్ల దానిని ‘జీవగ్రంథం’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించకుండా, మూలంలోని ధార్మిక అనిశ్చితిని కాపాడాం.
- issue: మొదటి షరతు తరువాత అసంపూర్ణంగా నిలిచే వాక్యం
  choice: ‘క్షమిస్తే—’ అని విరామచిహ్నంతో తెరిచి ఉంచడం
  alternative: ‘క్షమించు’ లేదా ‘అది మంచిదే’ వంటి ఊహించిన ఫలిత వాక్యాన్ని చేర్చడం
  rationale: మూలంలో ‘నీవు వారి పాపాన్ని క్షమిస్తే’ అన్న తరువాత ఫలిత వాక్యం చెప్పబడలేదు. డాష్ ద్వారా ఆ భావోద్వేగపూరిత అపూర్ణతను నిలుపుతూ, పాఠంలో లేని మాటలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. ‘గ్రంథము’ వంటి పాత రూపానికి బదులు ‘పుస్తకం’, ‘నుండి’కి సహజ సంక్షిప్త రూపమైన ‘నుంచి’ వాడబడ్డాయి. మూలంలోని భావోద్వేగ విరామాన్ని డాష్‌తో నిలిపాం.
