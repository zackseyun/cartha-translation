source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: te
  text: 'అహరోను వారితో ఇలా అన్నాడు: “మీ భార్యల, కుమారుల, కుమార్తెల చెవుల్లో ఉన్న బంగారు పోగులను తీసివేయండి[a], వాటిని నా దగ్గరికి తీసుకురండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారు పోగులను బలంగా ఊడదీయండి…” హీబ్రూ క్రియ ఆభరణాలను బలవంతంగా తొలగించడం లేదా విరిచివేయడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: అప్పుడు అహరోను వారితో ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని తెలియజేస్తుంది. אֲלֵהֶם అనే స్పష్టమైన సర్వనామాన్ని ‘వారితో’గా నిలిపాం.
- source_word: פָּרְקוּ
  choice: తీసి
  rationale: ఆభరణాలను శరీరం నుంచి తొలగించమనే సందర్భంలో ఇది సహజమైన తెలుగు. మూల క్రియలో బలంగా ఊడదీయడం లేదా విరిచివేయడం అనే ఛాయ ఉండవచ్చు కాబట్టి దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִזְמֵי הַזָּהָב
  choice: బంగారు పోగులను
  rationale: נֶזֶם అనేది సందర్భానుసారం ముక్కుపోగు లేదా చెవిపోగును సూచించగలదు. వెంటనే ‘చెవుల్లో’ అని ఉన్నందున ‘పోగులు’ సహజంగా, అవసరమైనంత సాధారణంగా ఉంటుంది; ‘బంగారు’ వాటి పదార్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: చెవుల్లో ఉన్న
  rationale: బెత్ ఉపసర్గ సూచించే స్థానాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נְשֵׁיכֶם בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: మీ భార్యల, కుమారుల, కుమార్తెల
  rationale: కుటుంబ సందర్భంలో נָשִׁים ను ‘భార్యలు’గా తీసుకోవడం సముచితం; కుమారులు, కుమార్తెలు అనే లింగ-నిర్దిష్ట సమాంతర పదాలను యథాతథంగా నిలిపాం.
- source_word: וְהָבִיאוּ אֵלָי
  choice: నా దగ్గరికి తీసుకురండి
  rationale: ఆజ్ఞార్థక రూపాన్నీ, ‘నా వద్దకు’ అనే దిశనూ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; కర్మను తెలుగులో సందర్భం ద్వారా గ్రహించవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అహరోను’ అనే తెలుగు బైబిలు సంప్రదాయ నామరూపాన్ని నిలిపాం; మూలంలోని సాధ్యమైన బలవంతపు తొలగింపు భావాన్ని ప్రధాన వాక్యంలో అతిగా నిర్ధారించకుండా పాదటిప్పణిలో సంరక్షించాం.
