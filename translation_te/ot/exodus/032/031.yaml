id: EXO.32.31
reference: Exodus 32:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: te
  text: అప్పుడు మోషే తిరిగి యెహోవా వద్దకు వెళ్లి, “దయచేసి, ఈ ప్రజలు ఘోరమైన పాపం చేశారు; తమ కోసం బంగారు దేవుళ్లను చేసుకున్నారు[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ కోసం ఒక బంగారు దేవుణ్ణి చేసుకున్నారు.” హెబ్రీ పాఠంలో అక్షరార్థంగా “బంగారు దేవుళ్లు” అని బహువచనం ఉంది; అయితే విస్తృత సందర్భంలో బంగారు దూడ ఒక్కటే ఉన్నందున కొందరు దీనిని ఏకవచన భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లి
  rationale: שׁוב అనే క్రియ ఇక్కడ మోషే ప్రజల దగ్గరనుంచి యెహోవా దగ్గరికి తిరిగి వెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తిరిగి వెళ్లి’ సహజంగా ఉంది.
- source_word: אֶל יְהוָה
  choice: యెహోవా దగ్గరికి
  rationale: אֶל దిశను సూచిస్తుంది. దేవుని నామమైన יהוהను దాచకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంతో ఇచ్చాం.
- source_word: אָנָּא
  choice: దయచేసి విను!
  rationale: ఈ కణం వేడుకోలు లేదా తీవ్రమైన మనవిని వ్యక్తం చేస్తుంది. ‘దయచేసి విను!’ మోషే విజ్ఞాపన స్వరాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: ఈ ప్రజలు ఘోరమైన పాపం చేశారు
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన ‘పాపం చేశారు—గొప్ప పాపం’ అనే బలమైన నిర్మాణాన్ని సహజ తెలుగులో ‘ఘోరమైన పాపం చేశారు’ అని వ్యక్తపరచాం.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: తమ కోసం ... చేసుకున్నారు
  rationale: לָהֶםలోని స్వప్రయోజన లేదా స్వసంబంధ భావాన్ని ‘తమ కోసం’ మరియు ‘చేసుకున్నారు’ సహజంగా నిలుపుతున్నాయి.
- source_word: אֱלֹהֵי זָהָב
  choice: బంగారు దేవుళ్లను
  rationale: మసొరేటిక్ పాఠంలో אֱלֹהֵי వ్యాకరణపరంగా బహువచన నిర్మాణం; కాబట్టి సందర్భంలోని ఒక్క దూడకు అనుగుణంగా మార్చకుండా బహువచనాన్ని ప్రధాన పాఠంలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక నామాన్ని ప్రత్యక్షంగా వాడుతుంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం నామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: אֱלֹהֵי זָהָב యొక్క సంఖ్య
  choice: బంగారు దేవుళ్లు
  alternative: బంగారు దేవుడు
  rationale: విస్తృత సందర్భం బంగారు దూడ అనే ఏకవచన వస్తువును సూచించినా, ఈ వచనంలోని హెబ్రీ రూపం బహువచనంలో ఉంది. ఆ ఉద్రిక్తతను తొలగించకుండా ప్రధాన పాఠంలో బహువచనాన్ని ఉంచి, ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. మూలంలోని విజ్ఞాపన స్వరం, పాప తీవ్రత, ‘బంగారు దేవుళ్లు’ అనే నిజమైన సంఖ్యా సందిగ్ధత నిలిపాం.
