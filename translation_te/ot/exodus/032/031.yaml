- from: అప్పుడు మోషే యెహోవా దగ్గరికి తిరిగి వెళ్లి, “దయచేసి విను! ఈ ప్రజలు ఘోరమైన పాపం చేశారు; తమ కోసం బంగారు దేవుళ్లను చేసుకున్నారు[a]” అని అన్నాడు.
  to: అప్పుడు మోషే తిరిగి యెహోవా వద్దకు వెళ్లి, “దయచేసి, ఈ ప్రజలు ఘోరమైన పాపం చేశారు; తమ కోసం బంగారు దేవుళ్లను చేసుకున్నారు[a]” అని అన్నాడు.
  rationale: The revision removes the unsupported ‘విను,’ retains the pleading force of אָנָּא with ‘దయచేసి,’ and changes ‘దగ్గరికి’ to the more register-appropriate ‘వద్దకు.’ It preserves all other source-sensitive elements, especially the plural ‘బంగారు దేవుళ్లు’ and its contextual alternative in the footnote.
