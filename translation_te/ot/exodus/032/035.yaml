  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: te
  text: అప్పుడు యాహ్వే ప్రజలను కొట్టాడు, ఎందుకంటే వారు అహరోను చేసిన ఆ దూడను చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు యాహ్వే ప్రజలను బాధించాడు, ఎందుకంటే వారు అహరోను చేసిన ఆ దూడను చేశారు.” హీబ్రూ క్రియను “కొట్టాడు” లేదా “బాధించాడు” అని అనువదించవచ్చు; ఈ వచనంలో తెగులు అని స్పష్టంగా చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: తెగులుతో కొట్టాడు
  rationale: נָגַף క్రియ కొట్టడం లేదా తీవ్రమైన బాధకు గురిచేయడం అనే అర్థాన్ని ఇస్తుంది; దైవిక తీర్పు సందర్భాల్లో తెగులు ద్వారా బాధించడం అనే భావం కూడా దీనికి ఉంటుంది. అయితే మూలపాఠంలో ‘తెగులు’ అనే ప్రత్యేక నామవాచకం లేదు కాబట్టి మరింత సాధారణ అనువాదాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను ఒక బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָעָם
  choice: ప్రజలు / వారిని
  rationale: ఇక్కడ עם సమూహంగా ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; సహజమైన తెలుగు వాక్యనిర్మాణం కోసం మొదట ‘ప్రజలు’, తరువాత కర్మరూపంలో ‘వారిని’ వాడాం.
- source_word: עַל אֲשֶׁר
  choice: చేసినదాని కారణంగా
  rationale: ఈ పదబంధంలోని కారణార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: ఆ దూడ విషయంలో ప్రజలు చేసినది
  rationale: עָשׂוּను కేవలం ‘తయారు చేశారు’ అని అనువదిస్తే, వెంటనే వచ్చే ‘అహరోను చేసిన’ అనే మాటతో అసహజమైన పునరుక్తి ఏర్పడుతుంది. ‘దూడ విషయంలో చేసినది’ అనే రూపం ప్రజల అపరాధకరమైన చర్యను తెలియజేస్తూ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הָעֵגֶל
  choice: ఆ దూడ
  rationale: עֵגֶל అంటే ‘దూడ’. ఈ వచనంలో ‘బంగారు’ అని లేకపోవడంతో సందర్భం నుంచి ఆ విశేషణాన్ని చేర్చలేదు.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: అహరోను చేసిన
  rationale: ఈ సంబంధవాక్యం దూడను అహరోను చేసిన దూడగా గుర్తిస్తుంది; సరళమైన భూతకాల రూపం తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: וַיִּגֹּף సూచించే దైవిక తీర్పు స్వభావం
  choice: తెగులుతో కొట్టాడు
  alternative: దెబ్బతీశాడు / బాధించాడు
  rationale: ఈ క్రియకు సాధారణంగా ‘కొట్టు’ అనే అర్థమూ, తీర్పు సందర్భంలో తెగులు వంటి బాధకు గురిచేయడం అనే అర్థమూ ఉన్నాయి. ప్రధాన పాఠం సందర్భోచిత భావాన్ని తెలియజేస్తుంది; అయితే మూలంలో సాధనం స్పష్టంగా పేర్కొనబడలేదనే అనిశ్చితిని పాదసూచిక కాపాడుతుంది.
- issue: ప్రజల చర్యకూ అహరోను చేసిన దూడకూ మధ్య సంబంధం
  choice: అహరోను చేసిన ఆ దూడ విషయంలో ప్రజలు చేసినది
  alternative: అహరోను చేసిన దూడను వారు తయారు చేశారు
  rationale: హీబ్రూ వాక్యం עשה క్రియను ప్రజలకూ అహరోనుకూ ఉపయోగిస్తుంది. ప్రజలు దూడ విషయంలో చేసిన అపరాధాన్ని విస్తృతంగా ఉంచడం ద్వారా వారి బాధ్యతను తెలిపి, తయారీ బాధ్యత అహరోనుదని చెప్పే సంబంధవాక్యంతో కృత్రిమ విరోధాన్ని సృష్టించకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని వాడాం. ‘తెగులుతో కొట్టాడు’ అనే పదబంధం బైబిలు తీర్పు సందర్భానికి తగినదిగా ఉన్నప్పటికీ, మూలక్రియలోని విస్తృత అర్థాన్ని పాదసూచిక ద్వారా వెల్లడించాం.
