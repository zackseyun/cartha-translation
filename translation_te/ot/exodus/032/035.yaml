revisions:
- from: అప్పుడు యాహ్వే, అహరోను చేసిన ఆ దూడ విషయంలో ప్రజలు చేసినదాని కారణంగా, వారిని తెగులుతో కొట్టాడు[a].
  to: అప్పుడు యాహ్వే ప్రజలను కొట్టాడు, ఎందుకంటే వారు అహరోను చేసిన ఆ దూడను చేశారు.[a]
  rationale: The revision removes the unstated plague instrument and renders the causal clause more directly. It retains the source text’s repeated ‘made/did’ language for the people and Aaron instead of smoothing the historical-textual tension by replacing it with a generalized reference to conduct involving the calf.
  reviewer_model: gpt-5.6-terra
