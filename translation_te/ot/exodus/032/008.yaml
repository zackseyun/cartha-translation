id: EXO.32.8
reference: Exodus 32:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: te
  text: నేను వారికి ఆజ్ఞాపించిన మార్గం నుండి వారు ఇంత త్వరగా తొలగిపోయారు. వారు తమ కోసం పోతపోసిన దూడ విగ్రహాన్ని చేసుకొని, దానికి సాష్టాంగపడి, దానికి బలులు అర్పించి, ‘ఇశ్రాయేలూ, ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన నీ దేవుళ్లు ఇవే’[a] అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలూ, ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన నీ దేవుడు ఇదే.” హీబ్రూ మూలంలో అక్షరార్థంగా “నీ దేవుళ్లు ఇవే” అని బహువచనం ఉంది; అయితే సందర్భంలో సూచించబడింది ఒకే దూడ.
    reason: ఒకే దూడను సూచించే సందర్భానికి ఎదురుగా హీబ్రూ బహువచన రూపం ఉండటంతో ప్రత్యామ్నాయ ఏకవచన పఠనాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: ఇంత త్వరగా తొలగిపోయారు
  rationale: మార్గం నుండి పక్కకు మళ్లడం అనే రూపకాన్ని నిలుపుతూ, అకస్మాత్తుగా జరిగిన అవిధేయతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: నేను వారికి ఆజ్ఞాపించిన మార్గం నుండి
  rationale: ‘మార్గం’ అనే నైతిక-ఒడంబడిక రూపకాన్ని నిలుపుతుంది; צִוִּיתִם లోని భావాన్ని తెలుగులో సహజంగా ‘వారికి ఆజ్ఞాపించిన’గా అందిస్తుంది.
- source_word: עָשׂוּ לָהֶם
  choice: వారు తమ కోసం ... చేసుకొని
  rationale: లָהֶם లోని స్వప్రయోజన లేదా ప్రతిఫలార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עֵגֶל מַסֵּכָה
  choice: పోతపోసిన దూడ విగ్రహం
  rationale: מַסֵּכָה లోహాన్ని పోతపోసి చేసిన ప్రతిమను సూచిస్తుంది; దూడ ఆకారంలోని విగ్రహమని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: దానికి సాష్టాంగపడి
  rationale: సాధారణంగా ‘ఆరాధించారు’ అని విస్తరించకుండా, మూలంలోని శరీరాన్ని వంచి ప్రణమిల్లే క్రియను నిలుపుతుంది.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: దానికి బలులు అర్పించి
  rationale: బలిపూజకు సంబంధించిన క్రియను స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: నీ దేవుళ్లు వీరే
  rationale: సందర్భంలో ఒకే దూడ ఉన్నప్పటికీ, హీబ్రూ పదబంధంలోని స్పష్టమైన బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన
  rationale: עלה హిఫిల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే హీబ్రూ ప్రయోగాన్ని, నిర్గమణ సూత్రవాక్యంతో దాని సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విగ్రహ ప్రకటనలో אֱלֹהֶיךָ సంఖ్య
  choice: ‘నీ దేవుళ్లు వీరే’ అనే బహువచనాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నీ దేవుడు ఇతడే’ అని ఏకవచనంగా సందర్భానుసారంగా చదవడం
  rationale: హీబ్రూ వ్యాకరణం స్పష్టంగా బహువచనంలో ఉంది; ఒకే దూడను సూచిస్తున్న సందర్భంతో ఏర్పడే ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపి, ఏకవచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: וַיִּשְׁתַּחֲווּ అనే ఆరాధనా క్రియ
  choice: ‘దానికి సాష్టాంగపడి’
  alternative: ‘దానిని ఆరాధించి’
  rationale: మూలపదం సూచించే శారీరక ప్రణామాన్ని నిలుపుతూ, ప్రణమిల్లడం—బలి అర్పించడం—ప్రకటించడం అనే వరుస చర్యలను ఒకే సాధారణ ఆరాధనా పదంలో కలిపివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘సాష్టాంగపడి’ ఆరాధనా సందర్భంలో సుపరిచితమైన పదం; ‘పోతపోసిన దూడ విగ్రహం’ తయారీ విధానాన్నీ ప్రతిమ స్వరూపాన్నీ స్పష్టం చేస్తుంది. సంబోధనకు ‘ఇశ్రాయేలూ’ వాడబడింది.
