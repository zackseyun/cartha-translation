  source_fidelity: దానిని చూసిన తరువాత అహరోను బలిపీఠం కట్టడం, దాని ఎదుట కట్టబడిన స్థలసూచన, మరుసటి దినానికి యాహ్వేకు పండుగను ప్రకటించడం—అన్నీ హీబ్రూ మూలపాఠానికి అనుగుణంగా ఉన్నాయి. అయితే పాదటిప్పణి ప్రత్యామ్నాయ పఠనాన్ని తప్పుగా “అహరోను తన ఎదుట” అని చెప్పింది; అది ‘అహరోను ఎదుట/అతని ఎదుట’ కావాలి. అలాగే దైవనామాన్ని ఆడిట్‌లోని ‘Yahweh’ నిర్ణయానికి అనుగుణంగా యాహ్వేగా ఇచ్చాం.
