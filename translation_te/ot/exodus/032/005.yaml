source:
  edition: WLC
  text: וַ/יַּ֣רְא אַהֲרֹ֔ן וַ/יִּ֥בֶן מִזְבֵּ֖חַ לְ/פָנָ֑י/ו וַ/יִּקְרָ֤א אַֽהֲרֹן֙ וַ/יֹּאמַ֔ר חַ֥ג לַ/יהוָ֖ה מָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: te
  text: అహరోను దానిని చూసి, దాని ఎదుట[a] ఒక బలిపీఠాన్ని కట్టాడు. తరువాత అహరోను ప్రకటిస్తూ, “రేపు యాహ్వేకు పండుగ ఉంటుంది,” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఎదుట.” హీబ్రూ సర్వనామం వ్యాకరణపరంగా అహరోనును సూచించవచ్చు, అయితే సందర్భంలో అది దూడను సూచించే అవకాశమే ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: అహరోను దానిని చూసి
  rationale: ראה అంటే ‘చూశాడు’. కర్మ హీబ్రూలో స్పష్టంగా లేకపోయినా, ముందరి వచనంలోని దూడను సందర్భం సూచిస్తున్నందున తెలుగులో సహజత కోసం ‘దానిని’ చేర్చబడింది.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని కట్టాడు
  rationale: בנה + מזבח పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం; ఆరాధనా సందర్భంలోని altar భావాన్ని ‘బలిపీఠం’ నిలుపుతుంది.
- source_word: לְפָנָיו
  choice: దాని ఎదుట
  rationale: పుంలింగ ఏకవచన ప్రత్యయం వ్యాకరణపరంగా అహరోనును లేదా దూడను సూచించగలదు; సమీప సందర్భం దూడను సూచించే అవకాశమే ఎక్కువ. విగ్రహానికి వ్యక్తిత్వాన్ని ఆపాదించకుండా ‘దాని ఎదుట’ అని అనువదించబడింది.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: అని ప్రకటించాడు
  rationale: క్రియల కలయిక బహిరంగ ప్రకటనను తెలియజేస్తుంది. తెలుగులో ‘పిలిచి చెప్పాడు’ అనే కఠిన పదానువాదం కంటే ‘అని ప్రకటించాడు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: חַג
  choice: పండుగ
  rationale: חַג ఆరాధనాసంబంధ పండుగను సూచిస్తుంది. ‘పండుగ’ ఆధునిక సాధారణ తెలుగులో సహజమైనది; ‘యాత్రాపండుగ’ అనడం సందర్భం కంటే ఎక్కువ నిర్దిష్టతను చేర్చుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: לְ అంకితం లేదా సంబంధాన్ని సూచిస్తుంది; ‘యెహోవాకు’ దానిని సహజంగా వ్యక్తపరుస్తుంది. יהוה అనే దైవనామం తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇవ్వబడింది.
- source_word: מָחָר
  choice: రేపు
  rationale: కాలసూచక అవ్యయానికి నేరమైన తెలుగు సమానం. హీబ్రూ నామవాచక వాక్య నిర్మాణాన్ని తెలుగులో ‘రేపు ... పండుగ’ అని సహజంగా నిలుపవచ్చు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదుతో భర్తీ చేయకుండా నామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలుపడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: לְפָנָיו లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది
  choice: బలిపీఠం దూడ ఎదుట కట్టబడింది
  alternative: బలిపీఠం అహరోను ఎదుట కట్టబడింది
  rationale: పుంలింగ ఏకవచన ప్రత్యయం రెండు విధాలుగా అర్థం కావచ్చు. అయితే కొత్తగా చేసిన దూడ గురించిన తక్షణ సందర్భం దూడనే సూచిస్తుందని బలంగా సూచిస్తుంది; వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని సంఘటనల క్రమం మరియు బహిరంగ ప్రకటన భావం నిలుపబడ్డాయి.
