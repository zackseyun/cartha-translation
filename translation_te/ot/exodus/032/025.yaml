  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: te
  text: మోషే ప్రజలు అదుపు తప్పారని చూశాడు—ఎందుకంటే అహరోను వారిని అదుపు తప్పనిచ్చాడు[a]; దాంతో వారు తమ విరోధుల మధ్య అపహాస్యానికి గురయ్యారు[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కట్టడి లేకుండా ఉండనిచ్చాడు.” ప్రజల స్థితికీ అహరోను చేసిన పనికీ హీబ్రూ ఒకే మూలపదాన్ని పునరావృతం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ విరోధుల ఎగతాళికి (లేదా అవహేళనకు) పాత్రులయ్యారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: మోషే ... చూశాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా ప్రధాన క్రియను చివర ఉంచాం.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ עָם శిబిరంలో కూడిన ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది.
- source_word: כִּי פָרֻעַ הוּא
  choice: ప్రజలు అదుపు తప్పారని
  rationale: פרע మూలంలోని ఈ రూపం కట్టడి తొలగి అస్తవ్యస్తంగా మారిన స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అదుపు తప్పారు’ ఈ సామాజిక, నైతిక అవ్యవస్థను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: ఎందుకంటే అహరోను వారిని అదుపు తప్పనిచ్చాడు
  rationale: హీబ్రూలో మునుపటి పదంతో ఒకే פרע మూలం పునరావృతమవుతుంది. తెలుగులోనూ ‘అదుపు తప్పు’ను పునరావృతం చేసి ఆ పదబంధ సంబంధాన్ని నిలిపాం; అహరోను బాధ్యతను తెలుపుతూ అతడు ఉద్దేశపూర్వకంగా అలా చేశాడని అతిగా చెప్పలేదు.
- source_word: לְשִׁמְצָה
  choice: అపహాస్యానికి గురయ్యారు
  rationale: שִׁמְצָה ఎగతాళి, నింద లేదా అవహేళనకు పాత్ర కావడాన్ని సూచిస్తుంది. లక్ష్యభాషలో సహజమైన పూర్తి భావవ్యక్తీకరణ కోసం ‘అపహాస్యానికి గురయ్యారు’ అని అనువదించాం.
- source_word: בְּקָמֵיהֶם
  choice: తమ విరోధుల మధ్య
  rationale: קום ధాతువు నుంచి వచ్చిన రూపం వారికి ఎదురు నిలిచేవారిని సూచిస్తుంది. ‘విరోధులు’ సంక్షిప్తంగా, స్పష్టంగా ఈ భావాన్ని అందిస్తుంది; సర్వనామ ప్రత్యయం ప్రజలను/ఇశ్రాయేలును సూచిస్తుంది.
theological_decisions:
- issue: פרע పదంలోని సామాజిక-నైతిక భావం
  choice: అదుపు తప్పారు / అదుపు తప్పనిచ్చాడు
  alternative: కట్టడి లేకుండా ఉన్నారు / విడిచిపెట్టాడు; నగ్నంగా లేదా బహిర్గతంగా ఉన్నారు
  rationale: ఈ సందర్భంలో ప్రధాన భావం అహరోను నాయకత్వంలో కట్టడి కోల్పోయి అస్తవ్యస్తంగా మారడం. ‘నగ్నంగా’ అనడం హీబ్రూ పదపు సాధ్యమైన విస్తృత భావాన్ని అనవసరంగా సంకుచితం చేసి, వచనం స్పష్టంగా చెప్పనిదాన్ని నిర్ధారిస్తుంది.
- issue: לְשִׁמְצָה యొక్క వాక్యసంబంధం
  choice: దాంతో వారు తమ విరోధుల మధ్య అపహాస్యానికి గురయ్యారు
  alternative: తమ విరోధుల మధ్య అపహాస్యం కోసం; తమకు ఎదురు నిలిచినవారి ఎగతాళికి
  rationale: లామెద్ ఇక్కడ ఫలితం లేదా పరిణామాన్ని సూచించగలదు. తెలుగు వాక్యంలో సహజంగా ఉండేలా ఫలితార్థాన్ని స్పష్టం చేశాం; ఎగతాళి, అవహేళన అనే అర్థవ్యాప్తిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అదుపు తప్పు’ అనే పునరావృతంతో హీబ్రూ పదక్రీడను సాధ్యమైనంతవరకు నిలిపాం. వచనం తరువాతి చర్యకు దారితీసే అసంపూర్ణ కథన మలుపుతో ముగియడం వల్ల చివర దీర్ఘ విరామచిహ్నాన్ని ఉంచాం.
