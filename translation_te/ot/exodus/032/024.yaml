id: EXO.32.24
reference: Exodus 32:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: te
  text: అప్పుడు నేను వారితో, “బంగారం ఉన్నవారు దాన్ని తీసివేయండి[a]” అని చెప్పాను. వారు దాన్ని నాకు ఇచ్చారు; నేను దాన్ని అగ్నిలో పడవేశాను; ఈ దూడ బయటికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారం ఎవరి దగ్గర ఉంది? దాన్ని తెంపి తీసివేయండి.” హీబ్రూలో అక్షరార్థంగా, “ఎవరి వద్ద బంగారం ఉంది? [దాన్ని] తెంపి/తీసివేయండి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ... చెప్పాను
  rationale: వావ్-వరుసలోని కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భ సంబంధాన్ని అతిగా నిర్వచించదు.
- source_word: לְמִי זָהָב
  choice: ఎవరి దగ్గర బంగారం ఉందో
  rationale: ‘ఎవరి వద్ద బంగారం ఉంది?’ అనే హీబ్రూ స్వామ్య ప్రయోగాన్ని తెలుగులో సహజమైన అనిర్దిష్ట సంబంధవాచక రూపంలో అందిస్తుంది.
- source_word: הִתְפָּרָקוּ
  choice: వారు దాన్ని తీసివేయాలి
  rationale: ప్రసంగసందర్భంలో ఒంటిమీద ఉన్న బంగారు ఆభరణాలను తీసివేయడాన్ని సూచిస్తుంది. మూలంలోని బహువచన ఆజ్ఞను ‘వారు’ ద్వారా నిలుపుతుంది.
- source_word: וַיִּתְּנוּ לִי
  choice: వారు దాన్ని నాకు ఇచ్చారు
  rationale: ముందు చెప్పిన బంగారాన్ని సూచించే అంతర్లీన కర్మను తెలుగులో ‘దాన్ని’గా స్పష్టపరుస్తుంది.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: నేను దాన్ని అగ్నిలో పడవేశాను
  rationale: שׁלך యొక్క విసరడం/పడవేయడం భావాన్ని, అగ్నిలోనికి జరిగిన గమనాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: ఈ దూడ బయటికి వచ్చింది
  rationale: ఆహరోను చెప్పిన తప్పించుకునే ధోరణిగల వివరణను వ్యాఖ్యానం జోడించకుండా నేరుగా నిలుపుతుంది; עֵגֶלను సందర్భానుగుణంగా ‘దూడ’గా అనువదిస్తుంది.
theological_decisions:
- issue: విగ్రహం ఎలా ఏర్పడిందనే విషయంలో ఆహరోను చెప్పిన తప్పించుకునే వివరణ
  choice: ‘ఈ దూడ బయటికి వచ్చింది’ అని వ్యాఖ్యానం లేకుండా నేరుగా అనువదించడం
  alternative: ‘అద్భుతంగా’, ‘అంటూ చెప్పాడు’, లేదా అతడు అబద్ధం చెప్పాడని ప్రధాన వచనంలోనే స్పష్టీకరించడం
  rationale: వచనం ఆహరోను మాటలను మాత్రమే నివేదిస్తుంది. అతని వాదనలోని వ్యంగ్యాన్ని, ఉద్రిక్తతను సందర్భమే బయటపెట్టేలా ఉంచి, అనువాదంలో తీర్పు జోడించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వచనశైలి. ‘అగ్ని’ అనే పదం బైబిలు గద్యానికి తగిన గంభీరతను నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన వచనంలో ఉంచబడింది.
