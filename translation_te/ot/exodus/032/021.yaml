source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: te
  text: మోషే అహరోనుతో, “ఈ ప్రజలు నీకు ఏమి చేశారని, నీవు వారిమీద గొప్ప పాపాన్ని తీసుకొచ్చావు?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు భూతకాల కథనంగా వ్యక్తపరుస్తుంది.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: ఈ ప్రజలు నీకు ఏమి చేశారు?
  rationale: מֶה అనే ప్రశ్నార్థక భావాన్నీ, עָשָׂה לְךָ లోని ‘నీకు చేశారు’ అనే భావాన్నీ, הַזֶּה లోని సూచనార్థాన్నీ నేరుగా నిలుపుతుంది.
- source_word: כִּי
  choice: —వేంటి?
  rationale: ఇక్కడ כִּי మొదటి ప్రశ్నకు అనుసంధానంగా, ప్రజలు ఏమి చేశారని అహరోను వారిమీదికి గొప్ప పాపాన్ని తెచ్చాడనే గద్దింపు భావాన్ని సూచిస్తుంది. తెలుగులో ఒకే ప్రశ్నగా బిగుసుకుపోయే కృత్రిమ నిర్మాణం కంటే అనుసంధానిత రెండో ప్రశ్న సహజంగా ఉంది.
- source_word: הֵבֵאתָ
  choice: తీసుకొచ్చావు
  rationale: בוא హిఫీల్ రూపానికి ‘తీసుకురావడం’ అనే సాధారణ కారణార్థాన్ని నిలుపుతూ, అహరోను చేసిన కార్యానికి బాధ్యతను స్పష్టంగా ఉంచుతుంది.
- source_word: עָלָיו
  choice: వారి మీదికి
  rationale: రూపపరంగా ఏకవచనమైన సర్వనామం, సమూహవాచక ఏకవచనమైన הָעָם ను సూచిస్తుంది; తెలుగులో భావానుసారమైన బహువచనం సహజం.
- source_word: חֲטָאָה גְדֹלָה
  choice: ఇంత గొప్ప పాపం
  rationale: ‘గొప్ప పాపం’ మూలార్థాన్ని నిలుపుతుంది; ‘ఇంత’ మోషే గద్దింపులోని తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అహరోను బాధ్యత స్వరూపం
  choice: అహరోను ప్రజల మీదికి గొప్ప పాపాన్ని తీసుకొచ్చాడని అనువదించడం
  alternative: అహరోను వారిని గొప్ప పాపంలోకి నడిపించాడు / వారిమీద గొప్ప అపరాధభారాన్ని మోపాడు
  rationale: హీబ్రూ వాక్యం అహరోనుకు నైతిక బాధ్యతను నేరుగా ఆపాదిస్తుంది. అయితే అతని చర్యను మూలంలో ఉన్నదానికంటే వివరణాత్మకంగా విస్తరించకుండా ‘తీసుకొచ్చావు’ అని ఉంచడం ఆ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే మోషే గద్దింపులోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ఈ ప్రజలు’ అనే పదబంధం మూలంలోని కొంత దూరం పెట్టే ధోరణిని కాపాడుతుంది.
