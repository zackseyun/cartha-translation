  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֧ע יְהוֹשֻׁ֛עַ אֶת ק֥וֹל הָ/עָ֖ם בְּ/רֵעֹ֑/ה וַ/יֹּ֨אמֶר֙ אֶל מֹשֶׁ֔ה ק֥וֹל מִלְחָמָ֖ה בַּֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: te
  text: యెహోషువ ప్రజలు కేకలు వేస్తుండగా[a] వారి శబ్దాన్ని విన్నాడు. అతడు మోషేతో, “శిబిరంలో యుద్ధ ధ్వని వినిపిస్తోంది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలు గోల చేస్తుండగా’ లేదా ‘ప్రజలు పెద్దగా అరుస్తుండగా.’ హీబ్రూ పదబంధం ప్రజల పెద్ద కేకను లేదా కోలాహలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: కథన క్రమంలో శׁמע అనే క్రియ ఇక్కడ చెవితో శబ్దాన్ని గ్రహించడాన్ని సూచిస్తుంది; అందువల్ల సహజమైన తెలుగు రూపం ‘విన్నాడు.’
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: קוֹל הָעָם
  choice: ప్రజల శబ్దం
  rationale: קוֹל అనేది స్వరం, శబ్దం లేదా ధ్వని అని అర్థమవుతుంది. ఇక్కడ స్పష్టమైన మాటలకన్నా జనసమూహం చేస్తున్న శబ్దాన్ని సూచిస్తున్నందున ‘ప్రజల శబ్దం’ సరిపోతుంది.
- source_word: בְּרֵעֹה
  choice: ప్రజలు కేకలు వేస్తుండగా
  rationale: ఈ పదబంధం పెద్దగా కేక వేయడం లేదా గోల చేయడం అనే భావాన్ని ఇస్తుంది. ఏకవచన ప్రత్యయం సమూహవాచకమైన עָםతో వ్యాకరణపరంగా సరిపోతుంది; తెలుగులో ఆ సమూహ భావాన్ని బహువచన క్రియతో సహజంగా వ్యక్తం చేశాం.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: అతడు మోషేతో … అన్నాడు
  rationale: సాధారణ హీబ్రూ కథన సంభాషణ సూత్రాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ఇచ్చాం.
- source_word: קוֹל מִלְחָמָה
  choice: యుద్ధ ధ్వని
  rationale: హీబ్రూ సమాస పదబంధం అక్షరార్థంగా ‘యుద్ధపు శబ్దం.’ సందర్భంలో యుద్ధం జరుగుతున్నట్లు అనిపించే ధ్వనిని ‘యుద్ధ ధ్వని’ సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: בַּמַּחֲנֶה
  choice: శిబిరంలో
  rationale: מַחֲנֶה ఇశ్రాయేలీయుల మకామును సూచిస్తుంది; ‘శిబిరంలో’ దానికి నేరమైన, సహజమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గౌరవభరితమైన శైలిలో అనువదించాం. హీబ్రూ నామవాచక వాక్యాన్ని తెలుగులో సహజంగా చేయడానికి ‘వినిపిస్తోంది’ చేర్చాం; ఇది కొత్త భావాన్ని చేర్చకుండా వినబడుతున్న యుద్ధ ధ్వని అనే సందర్భాన్ని వ్యక్తం చేస్తుంది.
