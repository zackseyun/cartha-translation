  terminology: ‘శిబిరం,’ ‘దూడ,’ ‘నాట్యాలు,’ ‘పలకలు,’ మరియు ‘కొండ పాదం’ సందర్భానికి, శైలికి సరిపోతున్నాయి. మూలంలో లేని సిద్ధాంతపరమైన లేదా వ్యాఖ్యానాత్మక విస్తరణ చేర్చబడలేదు. పాదసూచిక నాట్యాలకు సంబంధించిన ప్రత్యామ్నాయ తెలుగు నిర్మాణాన్ని సముచితంగా తెలియజేస్తుంది.
