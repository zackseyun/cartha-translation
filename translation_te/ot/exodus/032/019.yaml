  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כַּ/אֲשֶׁ֤ר קָרַב֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יַּ֥רְא אֶת הָ/עֵ֖גֶל וּ/מְחֹלֹ֑ת וַ/יִּֽחַר אַ֣ף מֹשֶׁ֗ה וַ/יַּשְׁלֵ֤ךְ מ/יד/ו אֶת הַ/לֻּחֹ֔ת וַ/יְשַׁבֵּ֥ר אֹתָ֖/ם תַּ֥חַת הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: te
  text: అతడు శిబిరానికి దగ్గరగా వచ్చి, ఆ దూడను, నాట్యాలను[a] చూసినప్పుడు మోషే కోపం మండింది. అతడు తన చేతుల్లోనుంచి ఆ పలకలను విసిరివేసి, కొండ పాదం దగ్గర వాటిని పగులగొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాట్యం చేయడాన్ని.’ హీబ్రూ పదం బహువచనంలో ఉంది; దాన్ని రూపపరంగా మరింత నేరుగా ‘నాట్యాలు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר קָרַב אֶל הַמַּחֲנֶה
  choice: అతడు శిబిరానికి దగ్గరగా వచ్చి ... చూసినప్పుడు
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో సహజమైన కాలవాక్యంగా ఇచ్చి, శిబిరానికి సమీపించడం మరియు చూడడం తరువాతి చర్యలకు నేపథ్యమని నిలుపుతుంది.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: ఆ దూడను ... చూసినప్పుడు
  rationale: רָאָה యొక్క సాధారణ అర్థమైన ‘చూడు’ను ఉంచింది; నిర్దిష్ట ఉపపదం సందర్భంలో ఇప్పటికే తెలిసిన ప్రత్యేక దూడ విగ్రహాన్ని సూచిస్తున్నందున ‘ఆ దూడ’ సహజంగా ఉంది.
- source_word: וּמְחֹלֹת
  choice: నాట్యాలను
  rationale: హీబ్రూ బహువచన రూపాన్ని వీలైనంత నేరుగా నిలుపుతుంది; ‘విందు వినోదం’ వంటి సందర్భార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: మోషే కోపం మండింది
  rationale: కోపం మండడం అనే హీబ్రూ చిత్రాత్మక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, బలంగా నిలుపుతుంది.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ אֶת הַלֻּחֹת
  choice: అతడు తన చేతుల్లోనుంచి ఆ పలకలను విసిరివేసి
  rationale: שׁלך యొక్క బలమైన విసరడం భావాన్ని వ్యక్తం చేస్తుంది. మూలంలో ‘చేతి’ ఏకవచనమైనా రెండు పలకలను మోస్తున్న సందర్భంలో తెలుగు సహజ ప్రయోగంగా ‘చేతుల్లోనుంచి’ వాడింది.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: వాటిని పగులగొట్టాడు
  rationale: שׁבר యొక్క ‘విరగగొట్టు/పగులగొట్టు’ భావాన్ని స్పష్టంగా తెలిపి, అతిశయోక్తి లేకుండా చర్య బలాన్ని నిలుపుతుంది.
- source_word: תַּחַת הָהָר
  choice: కొండ పాదం దగ్గర
  rationale: భౌగోళిక సందర్భంలో ‘కొండ కింద’ కంటే పర్వతపు దిగువ భాగాన్ని సూచించే సహజమైన తెలుగు సమానార్థకం.
