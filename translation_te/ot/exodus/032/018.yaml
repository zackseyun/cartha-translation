    rationale: “నాకు వినిపిస్తున్నది పాడుతున్న శబ్దం” is grammatically awkward in Telugu because “శబ్దం” cannot naturally be described as “పాడుతున్నది.” Recasting it as “పాటల శబ్దం” retains the meaning and improves naturalness.
