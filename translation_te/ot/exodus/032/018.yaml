  terminology: “విజయ కేకలు” and “ఓటమి కేకలు” preserve the military contrast clearly. “పాటల శబ్దం” is a suitably neutral contextual rendering of the final עַנּוֹת; the note preserves the broader possible sense of shouting or responsive vocalization.
