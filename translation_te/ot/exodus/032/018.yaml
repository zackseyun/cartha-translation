id: EXO.32.18
reference: Exodus 32:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇది విజయ కేకల శబ్దం కాదు, ఓటమి కేకల శబ్దమూ కాదు; నాకు పాటల శబ్దం వినిపిస్తోంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు కేకల శబ్దం వినిపిస్తోంది.” ఇక్కడ వాడిన హీబ్రూ పదరూపాలు ప్రతిస్పందనగా పలకడం, కేకలు వేయడం, లేదా పాడడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: קוֹל
  choice: శబ్దం
  rationale: మూడు సందర్భాల్లోనూ మాటలని ప్రత్యేకంగా సూచించకుండా, వినిపిస్తున్న ధ్వనిని తటస్థంగా తెలియజేస్తుంది.
- source_word: עֲנוֹת / עַנּוֹת
  choice: కేకలు / పాడుతున్న
  rationale: మొదటి రెండు ప్రయోగాల్లో యుద్ధ సందర్భానికి తగిన కేకలను సూచిస్తుంది; చివరి ప్రయోగం దూడ చుట్టూ జరిగిన ఉత్సవ సందర్భంలో ప్రతిస్పందనాత్మక గానాన్ని లేదా పాడటాన్ని సూచించవచ్చు. మూలంలోని పదప్రయోగ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: גְּבוּרָה
  choice: విజయం
  rationale: ప్రాథమికంగా బలం లేదా పరాక్రమం అనే భావమున్నా, חֲלוּשָׁהతో వ్యతిరేక జంటగా యుద్ధ విజయోత్సాహ కేకను సూచిస్తుంది.
- source_word: חֲלוּשָׁה
  choice: ఓటమి
  rationale: అక్షరార్థంగా బలహీనతకు సంబంధించిన పదమైనా, గెవూరాతో వ్యతిరేకంగా ఇక్కడ యుద్ధంలో ఓడిపోవడాన్ని సూచిస్తుంది.
- source_word: אֵין
  choice: కాదు
  rationale: పునరుక్త నిరాకరణ నిర్మాణాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: నాకు వినిపిస్తున్నది
  rationale: ప్రస్తుతం గ్రహిస్తున్న శబ్దాన్ని తెలుగు వాడుకలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘విజయ కేకలు/ఓటమి కేకలు’ అనే సమాంతర నిర్మాణం యుద్ధ సంబంధ వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది; చివరి పదబంధంలోని నిజమైన హీబ్రూ సందిగ్ధతను పాదసూచిక సంరక్షిస్తుంది.
