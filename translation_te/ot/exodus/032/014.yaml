source:
  edition: WLC
  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: te
  text: యెహోవా తన ప్రజలకు కలిగిస్తానని చెప్పిన విపత్తును కలిగించకుండా మానుకున్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన మనసు మార్చుకున్నాడు’ లేదా ‘చింతించాడు’; ఇక్కడ ముందుగా ప్రకటించిన చర్యను అమలు చేయకుండా మళ్లిన భావం ఉంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ పదానికి ‘కీడు/విపత్తు’ అనే అర్థాలు కూడా ఉన్నాయి. ఇక్కడ అది దేవునిలోని నైతిక చెడును కాక, ఆయన హెచ్చరించిన హాని లేదా విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: వెనక్కి తగ్గాడు
  rationale: నחם క్రియ యొక్క నిఫ్అల్ రూపం ఇక్కడ ముందుగా ప్రకటించిన చర్యను అమలు చేయకుండా మళ్లడాన్ని సూచిస్తుంది. ‘వెనక్కి తగ్గాడు’ అనే పదబంధం కథనంలోని నిజమైన మార్పును తెలియజేస్తూనే, దేవుడు పొరపడ్డాడని లేదా తెలియక నిర్ణయించాడని అనవసరంగా సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: עַל
  choice: విషయంలో
  rationale: נחם על నిర్మాణంలో ఈ విభక్తి వెనక్కి తగ్గడం దేనికి సంబంధించిందో సూచిస్తుంది; ‘విషయంలో’ సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: הָרָעָה
  choice: హాని
  rationale: ఈ తీర్పు సందర్భంలో רָעָה నైతిక దుష్టత్వాన్ని కాక, బెదిరింపుగా ప్రకటించిన కీడు లేదా విపత్తును సూచిస్తుంది. ‘హాని’ మూలంలోని విస్తృత భావాన్ని నిలుపుతూ దేవునిలో నైతిక చెడును సూచించే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: చేస్తానని చెప్పిన
  rationale: ఈ సంబంధవాక్యం యెహోవా ఇంతకు ముందు ప్రకటించిన చర్యను సూచిస్తుంది; తరువాతి క్రియతో కలిపి తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: לַעֲשׂוֹת
  choice: చేస్తానని
  rationale: ‘చేయడం’ అనే మూల క్రియను నేరుగా నిలుపుతూ, ముందున్న ‘చెప్పిన’తో సహజమైన తెలుగు వాక్యనిర్మాణంగా మార్చాం.
- source_word: לְעַמּוֹ
  choice: తన ప్రజలకు
  rationale: బెదిరింపుగా చెప్పబడిన చర్య వల్ల ప్రభావితమయ్యే వారిని ఈ విభక్తి సూచిస్తుంది; ‘తన ప్రజలకు’ నేరుగా, సహజంగా ఉంది.
theological_decisions:
- issue: נחם అనే మానవానుభూతి ఆధారిత భాషలో దేవుని చర్యను వర్ణించడం
  choice: ప్రధాన పాఠ్యంలో ‘వెనక్కి తగ్గాడు’ అని అనువదించడం
  alternative: ‘మనసు మార్చుకున్నాడు’ లేదా ‘చింతించాడు’
  rationale: మోషే మధ్యవర్తిత్వానికి ప్రతిస్పందనగా ముందుగా ప్రకటించిన చర్యలో నిజమైన మలుపును వాక్యం చూపిస్తుంది. ‘వెనక్కి తగ్గాడు’ కథన బలాన్ని నిలుపుతుంది; అదే సమయంలో దేవుని మార్పులేనితనం గురించిన సిద్ధాంత ప్రశ్నను అనువాదంలోనే పరిష్కరించదు. ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సంక్షిప్తతను, దేవుని ప్రకటిత చర్యలో వచ్చిన మలుపుకు సంబంధించిన దైవశాస్త్రీయ ఉద్రిక్తతను అలాగే నిలిపాం.
