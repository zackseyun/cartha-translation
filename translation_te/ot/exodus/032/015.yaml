id: EXO.32.15
reference: Exodus 32:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: te
  text: అప్పుడు మోషే వెనుదిరిగి కొండనుండి దిగివెళ్లాడు. సాక్ష్యపు రెండు పలకలు అతని చేతిలో ఉన్నాయి. ఆ పలకలు వాటి రెండు వైపులా వ్రాయబడి ఉన్నాయి; ఈ వైపునా ఆ వైపునా అవి వ్రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: వెనుదిరిగి
  rationale: פנה ఇక్కడ దిశ మార్చుకొని తిరగడాన్ని సూచిస్తుంది. ‘వెనుదిరిగి’ అనేది కథన క్రమంలో సహజంగా ఉండి, హెబ్రీయులో లేనంత విస్తరణ చేయదు.
- source_word: וַיֵּרֶד
  choice: దిగి వెళ్లాడు
  rationale: ירד అంటే ‘దిగు/కిందికి వెళ్లు.’ కథకుని దృష్టికోణాన్ని నిలుపుతూ ఆధునిక తెలుగులో ‘దిగి వెళ్లాడు’ సహజంగా ఉంది.
- source_word: הָהָר
  choice: కొండ
  rationale: הַר పర్వతం లేదా కొండను సూచించగలదు. సీనాయి సందర్భంలో తెలుగులో సహజమైన ‘కొండ’ను ఎంచుకున్నాం; ఇది స్థల ప్రాముఖ్యతను తగ్గించదు.
- source_word: שְׁנֵי לֻחֹת
  choice: రెండు పలకలు
  rationale: לֻחֹת అంటే పలకలు. ఈ వచనంలో ‘రాతి’ అని ప్రత్యక్షంగా లేనందున దానిని చేర్చలేదు.
- source_word: הָעֵדֻת
  choice: సాక్ష్యపు
  rationale: עֵדוּת యొక్క ప్రాథమిక భావమైన ‘సాక్ష్యం’ను, దాని నిబంధన సంబంధిత ప్రతిధ్వనిని అనవసరంగా సంకుచితం చేయకుండా నిలిపింది.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో
  rationale: హెబ్రీయు ఏకవచనాన్ని అలాగే నిలిపి, తెలుగులో సహజమైన రూపాన్ని వాడాం.
- source_word: לֻחֹת כְּתֻבִים
  choice: పలకల… రాత ఉంది
  rationale: כתב నిష్క్రియార్థాన్ని తెలుగులో సహజంగా ‘రాత ఉంది’ అని వ్యక్తం చేశాం; రాత చెక్కబడిందనే విషయాన్ని మూలం కంటే స్పష్టీకరించలేదు.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: ఆ పలకల రెండు వైపులా
  rationale: రెండు ఉపరితలాల మీద రాత ఉందనే అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఈ వైపునా, ఆ వైపునా
  rationale: హెబ్రీయు పంపిణీ భావాన్ని, సమతూకమైన పునరుక్తిని నిలిపే సహజ తెలుగు రూపం.
- source_word: הֵם כְּתֻבִים
  choice: రాత ఉంది
  rationale: పలకల మీద రాయబడి ఉందనే చివరి ఉద్ఘాటనను నిలిపింది; అయితే తెలుగులో అసహజమైన పదపునరుక్తిని నివారించింది.
theological_decisions:
- issue: ‘సాక్ష్యపు పలకలు’లో עֵדוּת అనువాదం
  choice: సాక్ష్యపు
  alternative: నిబంధన పలకలు / సాక్ష్యపత్రపు
  rationale: ‘సాక్ష్యం’ అనే మూలార్థాన్నీ, ఈ పదానికి ఉన్న నిబంధన సంబంధిత ధార్మిక ప్రతిధ్వనినీ నిలుపుతుంది; దానిని కేవలం ‘నిబంధన పత్రం’గా వ్యాఖ్యానించి సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను నిలుపుతూ చిన్న వాక్యాలుగా రూపొందించబడింది. మూలంలోని భావ పునరుక్తి ‘రెండు వైపులా—ఈ వైపునా, ఆ వైపునా’ రూపంలో నిలిపబడింది.
