source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה מִלְא֨וּ יֶדְ/כֶ֤ם הַ/יּוֹם֙ לַֽ/יהוָ֔ה כִּ֛י אִ֥ישׁ בִּ/בְנ֖/וֹ וּ/בְ/אָחִ֑י/ו וְ/לָ/תֵ֧ת עֲלֵי/כֶ֛ם הַ/יּ֖וֹם בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “ఈ రోజు యెహోవా కొరకు మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి; ఎందుకంటే ప్రతి ఒక్కరూ తన కుమారునికీ తన సహోదరునికీ ఎదిరిగా నిలిచారు; తద్వారా ఈ రోజు మీకు ఆశీర్వాదం దక్కునట్లు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి
  rationale: అక్షరార్థంగా ‘మీ చేతిని నింపుకోండి’; యాజక ప్రతిష్ఠాపనకు సంబంధించిన హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, దాని ఆచారపరమైన భావాన్ని నిలుపుతూ అనువదించాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను సాధారణ బిరుదుతో కలపకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో సూచించాం.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: మీలో ప్రతి ఒక్కరూ తన కుమారునికీ తన సహోదరునికీ విరోధంగా నిలిచారు
  rationale: మూలంలోని సంక్షిప్త నిర్మాణంలో క్రియ సూచ్యంగా ఉంది; సందర్భం ప్రకారం ‘విరోధంగా నిలిచారు’ అని స్పష్టం చేశాం.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: అందువల్ల ఆయన ఈ రోజు మీకు ఆశీర్వాదం అనుగ్రహిస్తాడు
  rationale: ఉద్దేశం/ఫలితాన్ని తెలిపే infinitive నిర్మాణాన్ని సహజ తెలుగు వాక్యంగా మార్చాం; దీవెననిచ్చేవాడు యెహోవా అని సందర్భసూచిత కర్తను ‘ఆయన’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘చేతిని నింపుకోవడం’ అనే ప్రతిష్ఠాపన నుడికారం
  choice: ప్రతిష్ఠించుకోండి
  alternative: మీ చేతులను నింపుకోండి
  rationale: అక్షరానువాదం తెలుగు పాఠకునికి ఉద్దేశించిన అర్థాన్ని తెలియజేయదు; ‘ప్రతిష్ఠించుకోండి’ లేవీయుల సేవార్పణ భావాన్ని అందిస్తుంది, అయితే ప్రత్యేకమైన తరువాతి మతపరమైన సిద్ధాంతాన్ని రుద్దదు.
- issue: చివరి ఉపవాక్యంలో ఆశీర్వాదం ఇచ్చే కర్త
  choice: ఆయన
  alternative: కర్తను పేర్కొనకుండా ‘మీ మీద ఆశీర్వాదం కలిగేలా’
  rationale: హీబ్రూలో కర్త ప్రత్యక్షంగా లేకపోయినా, సమీపంలోని యెహోవానే సందర్భానుసార కర్తగా సహజంగా గ్రహించబడతాడు. ‘ఆయన’ ఈ సంబంధాన్ని చూపుతుంది; ఆశీర్వాదం సంపాదించబడిందనే అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని అసంపూర్ణంగా సూచిత క్రియలను సందర్భానికి అనుగుణంగా సహజీకరించాం. దైవనామాన్ని ‘యెహోవా’గా ఉంచాం.
