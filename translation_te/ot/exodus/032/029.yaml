  to: 'మోషే ఇలా అన్నాడు: “ఈ రోజు యెహోవా కొరకు మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి; ఎందుకంటే ప్రతి ఒక్కరూ తన కుమారునికీ తన సహోదరునికీ ఎదిరిగా నిలిచారు; తద్వారా ఈ రోజు మీకు ఆశీర్వాదం దక్కునట్లు.”'
