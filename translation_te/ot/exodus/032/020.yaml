  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: te
  text: వారు చేసిన దూడను అతడు తీసుకొని, దానిని అగ్నిలో కాల్చి, సన్నగా అయ్యేంతవరకు నూరి, దానిని నీటి మీద చల్లి, ఇశ్రాయేలు ప్రజలకు[a] ఆ నీటిని తాగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులకు తాగించాడు.” “ఇశ్రాయేలు కుమారులు” అనేది ఇక్కడ ప్రజలందరినీ సమష్టిగా సూచించే సాధారణ పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: దూడను
  rationale: עֵגֶל చిన్న వయసున్న పశువును సూచిస్తుంది. బంగారు దూడ సందర్భంలో సుపరిచితమైన, సహజమైన తెలుగు పదం ‘దూడ’.
- source_word: אֲשֶׁר עָשׂוּ
  choice: వారు చేసిన
  rationale: ప్రజలు అప్పటికే తయారుచేసిన దూడను ఈ సంబంధవాచక వాక్యభాగం గుర్తిస్తుంది; తెలుగు కథన క్రమంలో ‘వారు చేసిన’ సహజంగా ఉంది.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: దానిని అగ్నిలో కాల్చి
  rationale: క్రియతో పాటు ఉన్న בָּאֵשׁను స్పష్టంగా, సహజంగా ‘అగ్నిలో’ అని అనువదించింది.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: మెత్తగా అయ్యేంతవరకు దంచి
  rationale: טחן దంచడం/రుబ్బడం అనే అర్థాన్నీ, דק సన్నగా లేదా మెత్తగా కావడాన్నీ తెలియజేస్తాయి. మూలంలో స్పష్టంగా లేని ‘పొడిగా’ అనే ఫలితాన్ని ఈ భాగంలో ముందుగానే అతిగా నిర్దిష్టం చేయలేదు.
- source_word: וַיִּזֶר
  choice: చల్లి
  rationale: దంచిన పదార్థాన్ని నీటిమీద వెదజల్లడాన్ని ఆధునిక తెలుగులో ‘చల్లి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: నీటి మీద
  rationale: ‘నీటి ముఖం/ఉపరితలం మీద’ అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా ‘నీటి మీద’ అందిస్తుంది.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలతో ఆ నీటిని తాగించాడు
  rationale: שׁקה హిఫీల్ రూపంలోని కారణార్థాన్ని ‘తాగించాడు’ నిలుపుతుంది. בְּנֵי יִשְׂרָאֵל ఇక్కడ సమాజమంతటినీ సూచించే స్థిర సమూహ నామం కావడంతో ‘ఇశ్రాయేలు ప్రజలు’ సహజమైన తెలుగు; ‘ఆ నీటిని’ అనేది తెలుగులో అవసరమైన స్పష్టీకరణ.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహార్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఈ సందర్భంలో అది ఒడంబడిక సమాజాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ ఆ సమూహార్థాన్ని సహజంగా తెలియజేస్తుంది; మూల రూపాన్ని పాదటిప్పణిలో భద్రపరిచింది.
- issue: తాగించిన ద్రవానికి కర్మను స్పష్టీకరించడం
  choice: ఆ నీటిని తాగించాడు
  alternative: వారిని తాగించాడు
  rationale: హీబ్రూ కారణార్థక క్రియలో తాగిన ద్రవం ప్రత్యక్షంగా చెప్పబడకపోయినా, ముందు పేర్కొన్న నీరే సందర్భానుసార కర్మ. తెలుగులో అసహజతను నివారించేందుకు దానిని స్పష్టంచేసింది; ఇది కొత్త ధార్మిక నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కథనశైలి. వరుస హీబ్రూ క్రియలను తెలుగు కృదంత శ్రేణితో కొనసాగించి, చివరి క్రియను సమాపకంగా ఉంచింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
