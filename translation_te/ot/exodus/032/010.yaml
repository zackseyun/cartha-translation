revisions:
- from: ఇప్పుడు నన్ను అలా ఉండనివ్వు[a]. అప్పుడు నా కోపం వారిమీద రగులుకొని, నేను వారిని నిర్మూలిస్తాను[b]. నిన్ను మాత్రం గొప్ప జనంగా చేస్తాను.
  to: ఇప్పుడు నన్ను వదిలేయి[a], తద్వారా నా కోపం వారిమీద రగిలి నేను వారిని నిర్మూలిస్తాను[b]. నిన్ను గొప్ప జనాంగంగా చేస్తాను.
  rationale: The revision removes unsupported wording, avoids adding exclusivizing emphasis, and uses ‘జనాంగం’ for the Hebrew גּוֹי. ‘తద్వారా’ preserves the contextual purpose/result relation after the imperative, while the finite future forms retain the force of the announced judgment in idiomatic Telugu. Both footnote anchors remain present and their alternatives are structurally clear.
