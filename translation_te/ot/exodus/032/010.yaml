id: EXO.32.10
reference: Exodus 32:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: te
  text: ఇప్పుడు నన్ను వదిలేయి[a], తద్వారా నా కోపం వారిమీద రగిలి నేను వారిని నిర్మూలిస్తాను[b]. నిన్ను గొప్ప జనాంగంగా చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను ఒంటరిగా వదిలేయి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా కోపం వారిమీద మండిపడి, నేను వారిని నాశనం చేస్తాను.’
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సంభాషణను ముందుకు తీసుకెళ్లి తక్షణ ఆజ్ఞను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הַנִּיחָה לִּי
  choice: నన్ను అలా ఉండనివ్వు
  rationale: హిఫీల్ ఆజ్ఞారూపంలోని ‘నన్ను విడిచిపెట్టు/అడ్డుకోకు’ అనే నుడికార భావాన్ని సహజంగా తెలియజేస్తుంది; మోషే మధ్యవర్తిత్వం గురించి వచనం చెప్పనిదాన్ని చేర్చదు.
- source_word: וְיִחַר אַפִּי
  choice: అప్పుడు నా కోపం ... రగులుకొని
  rationale: חרה אף అనే నుడికారంలోని మండే కోపపు రూపకాన్ని నిలుపుతుంది. ఆజ్ఞ తర్వాతి וְ ను సందర్భానుసారం ఫలితం లేదా ఉద్దేశాన్ని సూచించేదిగా ‘అప్పుడు’తో వ్యక్తం చేసింది.
- source_word: בָהֶם
  choice: వారిమీద
  rationale: కోపం ఎవరికి వ్యతిరేకంగా ఉందో తెలిపే హెబ్రీ పూర్వప్రత్యయ భావానికి సహజమైన తెలుగు సమానం.
- source_word: וַאֲכַלֵּם
  choice: నేను వారిని నిర్మూలిస్తాను
  rationale: כלה పియేల్‌లోని పూర్తిగా అంతం చేయడం లేదా నాశనం చేయడం అనే బలమైన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘దహించివేస్తాను’ అనే తెలుగు రూపం మూలంలో లేని అగ్ని సాధనాన్ని సూచించే ప్రమాదం ఉంది.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: నిన్ను మాత్రం ... చేస్తాను
  rationale: ఒక వ్యక్తి నుండి లేదా వ్యక్తిని ఒక జనంగా చేయడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘మాత్రం’ ఇశ్రాయేలును నిర్మూలించాలనే మాటకు మోషే గురించి ఇచ్చిన ప్రత్యామ్నాయ వాగ్దానంలోని వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְגוֹי גָּדוֹל
  choice: గొప్ప జనంగా
  rationale: גוי కి ‘జనం’ ఇక్కడ సహజమైన ప్రజాసమూహ భావాన్ని ఇస్తుంది; ‘గొప్ప’ పితరులకు చేసిన వాగ్దాన ప్రతిధ్వనిని అదనపు వివరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కోపానికి మానవానురూపమైన భాష
  choice: ‘నా కోపం ... రగులుకొని’ అనే మండే కోపపు రూపకాన్ని నిలిపింది.
  alternative: ‘నేను వారిమీద కోపపడతాను’ అని అమూర్తంగా చెప్పడం.
  rationale: హెబ్రీ మూలంలోని సజీవ రూపకం దైవ పరిశుద్ధత, తీర్పు సంబంధమైన ఉద్రిక్తతను మృదువుచేయకుండా నిలుపుతుంది.
- issue: మోషే మధ్యవర్తిత్వంతో ‘నన్ను అలా ఉండనివ్వు’ అనే ఆజ్ఞకు ఉన్న సంబంధం
  choice: దీనిని నిజమైన ప్రత్యక్ష ఆజ్ఞగానే అనువదించి, అది పరోక్షంగా ప్రార్థనకు ఆహ్వానమా కాదా అని ప్రధాన పాఠ్యంలో వివరించలేదు.
  alternative: ‘నీవు అడ్డుపడకపోతే’ వంటి రూపంతో మధ్యవర్తిత్వ వ్యాఖ్యానాన్ని అనువాదంలోనే చేర్చడం.
  rationale: వచనం ఆజ్ఞను, తీర్పును, మోషేకు చేసిన వాగ్దానాన్ని ప్రకటిస్తుంది; అది మధ్యవర్తిత్వానికి ఆహ్వానమనే నిర్ధారణ వ్యాఖ్యానానికి చెందుతుంది.
- issue: וְיִחַר ... וַאֲכַלֵּם లోని మోడల్ లేదా ఫలిత సంబంధం
  choice: తెలుగులో ‘అప్పుడు ... రగులుకొని, ... నిర్మూలిస్తాను’ అని సహజమైన ఫలిత క్రమంగా ఇచ్చింది.
  alternative: ‘నా కోపం రగులుకొనేలా, నేను వారిని నిర్మూలించేలా’ అని ఉద్దేశార్థక అవకాశ రూపాలను వరుసగా వాడడం.
  rationale: ఆజ్ఞ తర్వాత హెబ్రీ క్రియారూపాలు ఉద్దేశం లేదా ఫలిత ఛాయను అనుమతిస్తాయి. తెలుగు భవిష్యత్ రూపం బెదిరింపు యొక్క నిశ్చయ బలాన్ని సహజంగా ఇస్తుంది; పాదటిప్పణిలో ప్రత్యామ్నాయ నిర్మాణాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉగ్రకోపం’ను ప్రధాన పాఠ్యంలో కాక పాదటిప్పణిలో ఉంచి אַף యొక్క సాధారణ ‘కోపం’ భావాన్నీ, ప్రత్యామ్నాయ తీవ్రతనూ వేరు చేసింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
