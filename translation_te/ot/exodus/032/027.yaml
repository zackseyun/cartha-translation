    issue: ‘నడుముకు’ for עַל־יְרֵכוֹ
    rationale: నడుము means waist, but יָרֵךְ denotes thigh. Although the phrase is an arming idiom, the body-part reference should not be changed.
  - severity: medium
    issue: ‘యెహోవా’ for יהוה
    rationale: The supplied English POB policy explicitly renders the Tetragrammaton as ‘Yahweh.’ Telugu should correspond with ‘యాహ్వే,’ preserving the divine name rather than using the traditional Jehovah-form.
