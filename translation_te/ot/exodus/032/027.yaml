  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ప్రతి పురుషుడు తన కత్తిని తన తొడకు కట్టుకోవాలి. శిబిరంలో ఒక ద్వారం నుండి మరో ద్వారం వరకు అటూ ఇటూ వెళ్లండి; ప్రతి పురుషుడు తన సోదరుణ్ణి, ప్రతి పురుషుడు తన సహచరుణ్ణి, ప్రతి పురుషుడు తన దగ్గరివాణ్ణి[a] చంపాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘తనకు సమీపమైనవాణ్ణి’; దీనిని ‘తన సమీప బంధువును’ లేదా ‘తన సన్నిహితుణ్ణి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: అతడు వారితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది; కర్తను మూలంలాగే సందర్భాధారంగా ఉంచుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: దైవిక అధికార ప్రకటన సూత్రాన్ని సహజంగా, అయినా గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సమాసాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: మీలో ప్రతి పురుషుడు తన కత్తిని తన నడుముకు కట్టుకోవాలి
  rationale: ఆయుధాన్ని ధరించాలనే నుడికార భావాన్ని స్పష్టంగా తెలుపుతూ, אִישׁ యొక్క పురుష-వితరణ భావాన్ని నిలుపుతుంది.
- source_word: עִבְרוּ וָשׁוּבוּ מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: శిబిరమంతటా ఒక ద్వారం నుండి మరో ద్వారం వరకు అటూ ఇటూ వెళ్లి
  rationale: జత ఆజ్ఞలలోని ముందుకు-తిరిగి సంచరించే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, శిబిరమంతటా జరిగే కదలికను నిలుపుతుంది.
- source_word: וְהִרְגוּ
  choice: చంపాలి
  rationale: మరణానికి గురిచేయాలనే ఆజ్ఞను అలంకారరహితంగా, స్పష్టంగా అందిస్తుంది.
- source_word: אִישׁ אֶת אָחִיו
  choice: ప్రతి పురుషుడు తన సోదరుణ్ణి
  rationale: అసలు వాక్యంలోని వ్యక్తిగత బాధ్యతను మరియు బంధుత్వపు తీవ్రతను నిలుపుతుంది.
- source_word: רֵעֵהוּ
  choice: తన సహచరుణ్ణి
  rationale: స్నేహితుడు, సహవాసి, తోటి వ్యక్తి అనే అర్థ పరిధిని అతి సంకుచితం చేయకుండా అందిస్తుంది.
- source_word: קְרֹבוֹ
  choice: తన దగ్గరివాణ్ణి
  rationale: ‘సమీప వ్యక్తి’ అనే మూలార్థాన్ని నిలుపుతూ, బంధువు లేదా సన్నిహితుడు అనే సాధ్యమైన భావాలను ప్రధాన పాఠ్యంలో ఒకటిగా నిర్ధారించదు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామం ఉన్నందున దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: אִישׁ యొక్క పునరుక్త పురుష ఏకవచన వితరణ
  choice: ప్రతి పురుషుడు
  alternative: ప్రతి ఒక్కరూ
  rationale: సందర్భంలో లేవీయ పురుషులకు ఇచ్చిన ఆజ్ఞ కావడం వల్ల మూలంలోని లింగ సూచనను తటస్థీకరించలేదు; తెలుగులో అనవసరమైన భారాన్ని తగ్గించేందుకు ఆజ్ఞ ప్రారంభంలో స్పష్టంగా ఉంచి, హత్య ఆజ్ఞలో దాని వ్యక్తిగత బాధ్యతను మళ్లీ తెలిపింది.
- issue: קְרֹבוֹ యొక్క సంబంధ భావం
  choice: దగ్గరివాడు
  alternative: సమీప బంధువు; సన్నిహితుడు
  rationale: ఈ పదం బంధుత్వాన్నీ సామాజిక సన్నిహితత్వాన్నీ సూచించగలదు. ప్రధాన పాఠ్యం ఆ విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హింసాత్మక ఆజ్ఞ యొక్క కఠినత్వాన్ని మృదువుచేయలేదు. ‘ద్వారం’ అనే పదం శిబిర ప్రవేశద్వారాలను సూచించే మూల రూపకాన్ని నిలుపుతుంది.
