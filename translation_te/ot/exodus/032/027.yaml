  naturalness: The revised wording is modern standard Telugu, preserves the solemn command form, and avoids making ‘near one’ more specific than the Hebrew permits.
  terminology: ‘తొడకు’ accurately renders ‘thigh.’ ‘తన దగ్గరివాణ్ణి’ retains the broad sense of קְרֹבוֹ, while the footnote supplies ‘close relative’ and ‘close associate’ as viable alternatives. ‘యాహ్వే’ consistently represents יהוה.
