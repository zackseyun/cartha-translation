source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: te
  text: మరుసటి రోజు మోషే ప్రజలతో, “మీరు ఘోరమైన పాపం చేశారు.[a] ఇప్పుడు నేను యాహ్వే దగ్గరకు ఎక్కి వెళ్తాను; బహుశా మీ పాపానికి ప్రాయశ్చిత్తం చేయగలనేమో” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీరు గొప్ప పాపాన్ని పాపం చేశారు”; ఒకే మూలానికి చెందిన క్రియ, నామవాచకాల పునరుక్తి ఆ పాపపు తీవ్రతను నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: హీబ్రూ కథన సంధిని తెలుగులో కృత్రిమంగా ‘జరిగింది’ అని జోడించకుండా, ముందటి సంఘటనల తరువాతి రోజును సహజంగా సూచిస్తుంది.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: మోషే ప్రజలతో ... అన్నాడు
  rationale: אמר ... אל అనే సంబోధన నిర్మాణానికి సహజమైన ఆధునిక తెలుగు మాటల క్రమం.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: మీరు ఘోరమైన పాపం చేశారు
  rationale: ‘మీరు’ ద్వారా స్పష్ట సర్వనామపు ఉద్ఘాటనను ఉంచుతూ, ఒకే మూలానికి చెందిన క్రియ-నామ పునరుక్తి తెలిపే తీవ్రతను సహజ తెలుగులో ‘ఘోరమైన’తో వ్యక్తం చేస్తుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: నిందారోపణ నుంచి మోషే చేయబోయే కార్యానికి మార్పును సహజంగా సూచిస్తుంది.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: నేను యాహ్వే దగ్గరికి పైకి వెళ్తాను
  rationale: עלה లోని పర్వతం పైకి వెళ్లే దిశను ‘పైకి’తో నిలిపి, אל ను సహజ తెలుగులో ‘దగ్గరికి’గా వ్యక్తం చేసింది; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: אוּלַי אֲכַפְּרָה
  choice: బహుశా ... ప్రాయశ్చిత్తం చేయగలనేమో
  rationale: אוּלַי తెలిపే ఆశతో కూడిన అనిశ్చితిని ‘బహుశా’ మరియు ‘గలనేమో’ ద్వారా నిలుపుతుంది; כפר పియేల్ రూపానికి ఆరాధనా-మధ్యవర్తిత్వ సందర్భంలో ‘ప్రాయశ్చిత్తం చేయు’ సరిపోతుంది.
- source_word: בְּעַד חַטַּאתְכֶם
  choice: మీ పాపానికి
  rationale: ప్రజల పాపం విషయంలో, వారి పక్షంగా చేయబోయే ప్రాయశ్చిత్తాన్ని సంక్షిప్తమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా ఉంచుతుంది.
- issue: మోషే ప్రాయశ్చిత్తం చేయగలడా అనే వాక్యబలం
  choice: బహుశా ... ప్రాయశ్చిత్తం చేయగలనేమో
  alternative: నేను మీ పాపానికి ప్రాయశ్చిత్తం చేస్తాను / బహుశా ప్రాయశ్చిత్తం పొందగలనేమో
  rationale: మూలంలోని אוּלַי తెలిపే అనిశ్చితిని, అలాగే అֲכַפְּרָה యొక్క కర్తృప్రయోగాన్ని నిలుపుతుంది; ఫలితం ఖచ్చితమని గానీ, మోషే కేవలం ప్రాయశ్చిత్తాన్ని పొందుతాడని గానీ ముందే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఘోరమైన పాపం’ మూలంలోని తీవ్రతను సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది; మూలంలోని పునరుక్తిని పాదటీపులో నమోదు చేశాం. అనిశ్చితిని రెట్టింపు చేసినట్లు అనిపించినా, ‘బహుశా ... గలనేమో’ తెలుగు వాడుకలో ఆశతో కూడిన సందేహాన్ని సహజంగా తెలియజేస్తుంది.
