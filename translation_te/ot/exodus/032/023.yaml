id: EXO.32.23
reference: Exodus 32:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: te
  text: అప్పుడు వారు నాతో, ‘మాకు దారిచూపుతూ ముందుకు నడిచే దేవుళ్లను[a] మాకు చేయి. ఎందుకంటే ఐగుప్తు దేశం నుండి మమ్మల్ని పైకి తీసుకొచ్చిన ఈ మోషే అనే మనిషికి ఏమైందో మాకు తెలియదు’ అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మాకు దారిచూపుతూ ముందుకు నడిచే ఒక దేవుణ్ణి మాకు చేయి.’ ఈ వాక్యంలో ‘దేవుళ్లు’ అనే బహువచన నామవాచకంతో బహువచన క్రియ వాడబడింది. అయినా, చుట్టుపక్కల సందర్భంలోని దూడ విగ్రహాన్ని బట్టి కొందరు దీనిని ఏకవచన భావంతో అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: అప్పుడు వారు నాతో ... అన్నారు
  rationale: వయ్యిక్తోల్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో ‘అప్పుడు’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: עֲשֵׂה לָנוּ
  choice: మా కోసం చేయి
  rationale: ఆజ్ఞార్థక క్రియతో పాటు לָנוּ లోని ప్రయోజనార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుళ్లను
  rationale: ఈ నామవాచకం ఏకవచనంగా లేదా బహువచనంగా ఉండగలిగినా, దానితో వచ్చిన יֵלְכוּ అనే బహువచన క్రియ ఇక్కడ బహువచన భావానికే బలమైన ఆధారం.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: మాకు ముందుగా నడిచే
  rationale: ప్రజల ముందు వెళ్లి దారి చూపించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారి అభ్యర్థనకు కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: ఆ మనిషి మోషే
  rationale: మూలంలోని సూచనాత్మకమైన, కొంత దూరీకరణ ధ్వనిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి మమ్మల్ని పైకి తీసుకొచ్చిన
  rationale: హిఫీల్ క్రియలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమ సందర్భపు రూపకాన్ని, ‘దేశం’ అనే మూలపదాన్ని కూడా నిలుపుతుంది.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: అతనికి ఏమైందో మాకు తెలియదు
  rationale: ఒకరి గతి లేదా పరిస్థితి గురించి అడిగే హీబ్రూ నుడికారాన్ని సహజమైన సమకాలీన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఆహరోను నివేదికలో אֱלֹהִים ను ఏకవచనంగా అనువదించాలా, బహువచనంగా అనువదించాలా
  choice: 'బహువచనం: ‘దేవుళ్లు’'
  alternative: 'ఏకవచనం: ‘ఒక దేవుడు’'
  rationale: చుట్టుపక్కల కథనం ఒక దూడ విగ్రహంపై దృష్టి పెట్టినా, ఈ వాక్యంలో יֵלְכוּ బహువచన క్రియ స్పష్టంగా ఉంది. అందువల్ల వ్యాకరణాన్ని అనుసరించి బహువచనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఏకవచన సాధ్యతను పాదటిప్పణిలో చూపడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని బహువచన వ్యాకరణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భం సూచించే ఏకవచన సాధ్యతను పాదటిప్పణిలో ఇచ్చాం.
