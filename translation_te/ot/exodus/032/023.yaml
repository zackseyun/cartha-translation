revisions:
- from: అప్పుడు వారు నాతో, ‘మాకు ముందుగా నడిచే దేవుళ్లను[a] మా కోసం చేయి. ఎందుకంటే ఐగుప్తు దేశం నుండి మమ్మల్ని పైకి తీసుకొచ్చిన ఆ మనిషి మోషేకు ఏమైందో మాకు తెలియదు’ అన్నారు.
  to: అప్పుడు వారు నాతో, ‘మాకు దారిచూపుతూ ముందుకు నడిచే దేవుళ్లను[a] మాకు చేయి. ఎందుకంటే ఐగుప్తు దేశం నుండి మమ్మల్ని పైకి తీసుకొచ్చిన ఈ మోషే అనే మనిషికి ఏమైందో మాకు తెలియదు’ అన్నారు.
  rationale: The revision resolves the unnatural identification of Moses by rendering the Hebrew demonstrative phrase clearly as ‘ఈ మోషే అనే మనిషి.’ It also smooths the relative clause in modern standard Telugu while preserving the requested gods’ function of going before and leading the people. The plural main-text reading and the singular alternative footnote are retained.
