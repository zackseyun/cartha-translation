  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: te
  text: లేవి కుమారులు మోషే మాట ప్రకారం చేశారు. ఆ రోజున ప్రజలలో దాదాపు మూడు వేల మంది పురుషులు నేలకొరిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పడిపోయారు’; ఇది మరణించడం లేదా హతమవడం అనే అర్థంలో సాధారణంగా వాడే నుడికారం. ‘చంపబడ్డారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేశారు
  rationale: עשה అనే విస్తృతార్థక క్రియను సరళంగా ప్రతిబింబిస్తుంది; ‘మోషే మాట ప్రకారం’ అనే పదబంధంతో తెలుగులో సహజంగా సరిపోతుంది.
- source_word: בְנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: ‘లేవి కుమారులు’ అనే హీబ్రూ కుటుంబసంబంధ వ్యక్తీకరణను నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כִּדְבַר מֹשֶׁה
  choice: మోషే మాట ప్రకారం
  rationale: హీబ్రూ నిర్మాణాన్ని సమీపంగా అనుసరిస్తుంది; ఇక్కడ ‘మాట’ ఆజ్ఞ లేదా నిర్దేశాన్ని సూచించినా, మూలంలోని דָּבָר పదాన్ని కాపాడుతుంది.
- source_word: וַיִּפֹּל
  choice: నేలకొరిగారు
  rationale: మరణాన్ని సూచించే ‘పడిపోయారు’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన, గంభీరమైన మరణ నుడికారంతో వ్యక్తం చేస్తుంది; ‘చంపబడ్డారు’ అని మూలం కంటే స్పష్టీకరించదు.
- source_word: מִן הָעָם
  choice: ప్రజల్లో
  rationale: ప్రజల సమూహంలోనుండి కొందరు అనే מן యొక్క విభాగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచక హీబ్రూ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: దాదాపు మూడు వేల మంది
  rationale: సంఖ్యకు ముందున్న כְּ యొక్క సుమారు అనే భావాన్ని ‘దాదాపు’ తెలియజేస్తుంది; אִישׁ ఇక్కడ లెక్కించబడిన మనుషులను సూచిస్తుండగా తెలుగు సంఖ్యావాచక వాడుకలో ‘మంది’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలోని మరణ ప్రకటనను అనువదించడం
  choice: ప్రజల్లో దాదాపు మూడు వేల మంది నేలకొరిగారు
  alternative: ప్రజల్లో దాదాపు మూడు వేల మంది చంపబడ్డారు / మరణించారు
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘చంపబడ్డారు’ అనే క్రియను కాక ‘పడిపోయారు’ అనే మరణ నుడికారాన్ని వాడుతుంది. ‘నేలకొరిగారు’ ఆ గంభీరతను, నుడికార స్వభావాన్ని నిలుపుతూ హంతక కారణాన్ని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి. ‘లేవి కుమారులు’ మూలంలోని కుటుంబసంబంధ రూపాన్ని నిలుపుతుంది; ‘నేలకొరిగారు’ మరణాన్ని సూచించే మూల నుడికారాన్ని సహజంగా అందిస్తుంది. పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
