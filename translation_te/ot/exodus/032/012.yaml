  to: ఈజిప్టీయులు, ‘వారిని పర్వతాల్లో చంపి, భూమి ముఖం మీదనుండి వారిని పూర్తిగా నిర్మూలించడానికే ఆయన వారిని బయటకు తీసుకొచ్చాడు’ అని ఎందుకు చెప్పాలి?[a] నీ మండుతున్న కోపం నుండి తిరుగు; నీ ప్రజలకు చేయదలచిన కీడు విషయంలో మనసు మార్చుకో.[b]
  rationale: The revision restores the explicit Hebrew image of eliminating the people ‘from the face of the earth’ and improves the idiomatic expression of turning from anger. It retains the draft’s sound handling of the Egyptians’ attributed evil intent and the anthropopathic plea that God relent concerning the threatened harm.
