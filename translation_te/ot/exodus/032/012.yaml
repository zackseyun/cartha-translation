base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: te
  text: ఈజిప్టీయులు, ‘వారిని పర్వతాల్లో చంపి, భూమి ముఖం మీదనుండి వారిని పూర్తిగా నిర్మూలించడానికే ఆయన వారిని బయటకు తీసుకొచ్చాడు’ అని ఎందుకు చెప్పాలి?[a] నీ మండుతున్న కోపం నుండి తిరుగు; నీ ప్రజలకు చేయదలచిన కీడు విషయంలో మనసు మార్చుకో.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుష్ట ఉద్దేశంతోనే’ అనే చోట ‘కీడు చేయాలనే ఉద్దేశంతో’ అని కూడా అనువదించవచ్చు. ఈ మాటలు ఈజిప్టీయులు దేవునికి ఆపాదించబోయే ఉద్దేశాన్ని తెలియజేస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘మనసు మార్చుకో’ అనే హీబ్రూ మాటను ‘కీడు చేయకుండా మానుకో’ లేదా ‘విపత్తు గురించి పునరాలోచించు’ అని కూడా అనువదించవచ్చు. మోషే దేవునితో మానవ సంబంధ భాషలో విజ్ఞప్తి చేస్తున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: ఈజిప్టీయులు ... అని ఎందుకు చెప్పాలి?
  rationale: לָמָּהతో వచ్చిన అసంపూర్ణ క్రియ ఇక్కడ మోషే చేస్తున్న అలంకారిక విజ్ఞప్తిని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘ఎందుకు చెప్పాలి?’ దానిని నిలుపుతుంది.
- source_word: בְּרָעָה
  choice: దుష్ట ఉద్దేశంతోనే
  rationale: ఈజిప్టీయులు దేవునికి ఆపాదించబోయే హానికరమైన ఉద్దేశాన్ని ఈ పదబంధం సూచిస్తుంది; కేవలం దుష్పరిణామాన్ని కాదు.
- source_word: הוֹצִיאָם
  choice: వారిని బయటకు తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని יצא నిర్గమ సందర్భంలో ఇతరులను బయటకు తీసుకురావడాన్ని సూచిస్తుంది.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: వారిని పర్వతాల్లో చంపి
  rationale: హత్య చేయడం అనే ఉద్దేశాన్ని, అది జరిగే ప్రదేశాన్ని సూటిగా మరియు ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: భూమిమీద లేకుండా పూర్తిగా నాశనం చేయాలని
  rationale: כלה పియేల్ సంపూర్ణ వినాశనాన్ని సూచిస్తుంది; ‘భూమి ముఖం మీదనుండి’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో భావస్పష్టంగా అందిస్తుంది.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: నీ మండుతున్న కోపం నుండి వెనుదిరుగు
  rationale: కోపపు వేడి అనే మూల రూపకాన్ని ‘మండుతున్న కోపం’ నిలుపుతుంది; שׁוּבలోని దిశమార్పును ‘వెనుదిరుగు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: నీ ప్రజలకు చేయదలచిన కీడు గురించి మనసు మార్చుకో
  rationale: נחם నిఫాల్ ఇక్కడ ప్రకటించిన చర్యను అమలు చేయకుండా మళ్లాలనే విజ్ఞప్తి; הָרָעָה ప్రజలపై రానున్న హానిని సూచిస్తుంది. ‘చేయదలచిన’ సందర్భంలోని ఉద్దేశిత చర్యను తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: וְהִנָּחֵםలో దేవునికి ఆపాదించిన మానవానురూప భాష
  choice: మనసు మార్చుకో
  alternative: కీడు చేయకుండా మానుకో / పశ్చాత్తాపపడు
  rationale: ‘మనసు మార్చుకో’ మోషే విజ్ఞప్తిలోని నిజమైన సంబంధాత్మక ఒత్తిడిని, దేవుడు ప్రకటించిన చర్యనుండి మళ్లాలని కోరే భావాన్ని నిలుపుతుంది. ‘పశ్చాత్తాపపడు’ దేవుడు నైతిక తప్పు చేశాడనే అనవసర భావాన్ని కలిగించవచ్చు; ‘మానుకో’ మూలంలోని అంతర్గత పునర్విచారణ భావాన్ని బలహీనపరుస్తుంది.
- issue: దేవుని బెదిరింపబడిన చర్యకు సంబంధించిన הָרָעָה అర్థం
  choice: కీడు
  alternative: విపత్తు / అపాయం / నాశనం
  rationale: ఇక్కడ పదం ప్రజలకు కలిగే తీవ్రమైన హానిని సూచిస్తుంది. ‘కీడు’ మూలపదంలోని విస్తృత అర్థాన్ని నిలుపుతుంది; అయితే అది దేవునిలో నైతిక దుష్టత్వాన్ని సూచించకుండా, ‘నీ ప్రజలకు చేయదలచిన’ అనే సందర్భంతో చర్య ఫలితంగా అర్థమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని అలంకారిక ప్రశ్న, కోపపు వేడి అనే రూపకం, సంపూర్ణ వినాశన భావం, దేవుడు మనసు మార్చుకోవాలనే విజ్ఞప్తిలోని వేదాంత ఉద్రిక్తత నిలుపబడ్డాయి. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
