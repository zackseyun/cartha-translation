source:
  edition: WLC
  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: te
  text: అప్పుడు మోషే శిబిర ద్వారం దగ్గర నిలబడి, “యెహోవా పక్షాన ఉన్నవారు నా దగ్గరకు రండి[a]” అని అన్నాడు. లేవి కుమారులందరూ అతని దగ్గరకు సమకూడారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “యెహోవా పక్షాన ఎవరు? నా దగ్గరకు!” సందర్భం సూచించే “రండి” అనే మాటను అనువాదంలో స్పష్టం చేశారు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “లేవీయులందరూ.” అక్షరార్థంగా “లేవి కుమారులందరూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడి
  rationale: עמד అనే క్రియ ఇక్కడ మోషే ఒక స్థలంలో నిలబడడాన్ని సూటిగా తెలియజేస్తుంది; సందర్భంలో లేని అదనపు అధికారిక లేదా సైనిక భావాన్ని చేర్చదు.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: శిబిర ద్వారం దగ్గర
  rationale: שַׁעַר యొక్క స్పష్టమైన ‘ద్వారం’ అనే రూపకాన్ని నిలుపుతూ, בְּ సూచించే స్థానాన్ని సహజమైన ఆధునిక తెలుగులో ‘దగ్గర’గా వ్యక్తం చేస్తుంది.
- source_word: מִי לַיהוָה
  choice: యెహోవా పక్షాన ఉన్నవారు
  rationale: అక్షరార్థంగా ‘యెహోవాకు ఎవరు?’ అనే సంక్షిప్త ప్రశ్న ఇది. సందర్భంలో ఇది విధేయత లేదా పక్షనిబద్ధతను ప్రకటించమనే పిలుపు కాబట్టి ‘పక్షాన’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించడం ద్వారా దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది.
- source_word: אֵלַי
  choice: నా దగ్గరకు రండి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నా దగ్గరకు!’ అనే సంక్షిప్త పిలుపు ఉంది. సందర్భం సూచించే గమన క్రియను తెలుగులో ‘రండి’గా స్పష్టం చేయడం సహజమైన వాక్యాన్ని ఇస్తుంది; ఈ విస్తరణను పాదసూచిక తెలియజేస్తుంది.
- source_word: וַיֵּאָסְפוּ
  choice: సమకూడారు
  rationale: נאסף ఇక్కడ ఒక వ్యక్తి దగ్గరకు గుంపుగా చేరడాన్ని సూచిస్తుంది. ‘సమకూడారు’ తటస్థంగా ఆ భావాన్ని ఇస్తుంది; ‘దండుగా చేరారు’ వంటి సైనిక ఛాయను చేర్చదు.
- source_word: אֵלָיו
  choice: అతని దగ్గరకు
  rationale: אֶל గమ్యదిశను సూచిస్తుంది; కాబట్టి ‘అతని దగ్గరకు’ అనేది సూటిగా, సహజంగా ఉంది.
- source_word: כָּל בְּנֵי לֵוִי
  choice: లేవి కుమారులందరూ
  rationale: మూలంలోని ‘లేవి కుమారులు’ అనే వంశపరమైన, పుంలింగ రూపాన్ని కాపాడుతుంది; ‘లేవీయులందరూ’ అనే సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో దీర్ఘకాలంగా గుర్తించదగిన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు మరింత సమీపమైన ప్రత్యామ్నాయం. ప్రధాన పాఠ్యంలో బిరుదైన ‘ప్రభువు’ను వాడకుండా నామాన్ని నిలిపాం.
- issue: מִי לַיהוָה లోని విధేయత భావం
  choice: యెహోవా పక్షాన ఉన్నవారు
  alternative: యెహోవాకు చెందినవారు
  rationale: ఈ సందర్భంలో మోషే ప్రజలను బహిరంగంగా తనవైపు చేరమని పిలుస్తున్నాడు. ‘పక్షాన’ విధేయతను సూచిస్తుంది; ‘చెందినవారు’ స్వామిత్వం లేదా రక్షణస్థితి గురించి మూలం కంటే ఎక్కువగా నిర్ణయించే అవకాశముంది.
- issue: בְּנֵי לֵוִי అనే లింగ-వంశ పదబంధం
  choice: లేవి కుమారులందరూ
  alternative: లేవీయులందరూ
  rationale: మూలంలోని పుంలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, మరింత సంక్షిప్తమైన గోత్రనామ రూపాన్ని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ సంక్షిప్త పిలుపును కనిష్ఠంగా విప్పి చెప్పి పాదసూచికలో అక్షరరూపాన్ని ఇచ్చాం. ‘యెహోవా’ను వ్యక్తినామంగా, ‘లేవి కుమారులు’ అనే వంశపరమైన పుంలింగ పదబంధాన్ని యథాతథ భావంతో నిలిపాం.
