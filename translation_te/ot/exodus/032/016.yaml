translation:
  language: te
  text: ఆ పలకలు దేవుని పనియే[a]; ఆ వ్రాత దేవుని వ్రాతే, పలకలపై చెక్కబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని చేతిపని.’ హీబ్రూలో ‘పని’ మరియు ‘వ్రాత’ పదాలు పునరుక్తమై, పలకలకూ వాటిపైని వ్రాతకూ దేవునితో ఉన్న ప్రత్యక్ష సంబంధాన్ని ఉద్ఘాటిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: ఆ పలకలు
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన నిబంధన పలకలను సూచిస్తున్నందున నిర్దేశక భావంతో ‘ఆ పలకలు’ అని అనువదించాం. ఈ వచనంలో ‘రాతి’ అనే పదం స్పష్టంగా లేనందున చేర్చలేదు.
- source_word: מַעֲשֵׂה אֱלֹהִים הֵמָּה
  choice: దేవుని పనియే
  rationale: మూలంలోని నామవాచక నిర్మాణాన్ని, הֵמָּה ఇచ్చే ఉద్ఘాటనను నిలుపుతూ పలకలు దేవుని కృతియని తెలియజేస్తుంది.
- source_word: הַמִּכְתָּב מִכְתַּב אֱלֹהִים הוּא
  choice: లేఖనం దేవుని లేఖనమే
  rationale: మూలంలో ‘లేఖనం’ పదం పునరుక్తమై దేవుని సంబంధాన్ని ఉద్ఘాటిస్తుంది; తెలుగులోనూ అదే పునరుక్తిని సహజంగా నిలిపాం.
- source_word: חָרוּת
  choice: చెక్కబడిన
  rationale: రాతి పలకలపై అక్షరాలు కోసి వ్రాయబడిన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל הַלֻּחֹת
  choice: వాటిమీద
  rationale: స్థానార్థకమైన עַל‌ను సహజమైన తెలుగు సర్వనామంతో అనువదించాం; ఇది పలకలనే స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: וְ
  choice: అనువాదంలో ప్రత్యేక పదం లేదు
  rationale: ప్రారంభ וְ కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ లేదా ‘మరియు’ చేర్చకుండానే సందర్భ ప్రవాహం సహజంగా కొనసాగుతుంది.
theological_decisions:
- issue: పలకలు, లేఖనం—దైవ కార్యసంబంధం
  choice: పలకలను దేవుని పనిగా, లేఖనాన్ని దేవుని లేఖనంగా నామవాచక రూపాల్లోనే పేర్కొనడం
  alternative: ‘దేవుడు పలకలను చేశాడు; దేవుడే వాటిమీద వ్రాశాడు’ అని క్రియారూపంలో అనువదించడం
  rationale: హీబ్రూ వాక్యం క్రియారూపాలకంటే ‘దేవుని పని’, ‘దేవుని లేఖనం’ అనే నామవాచక నిర్మాణాలను ఉపయోగిస్తుంది. వాటిని నిలపడం ద్వారా దేవుని ప్రత్యక్ష సంబంధాన్ని ఉద్ఘాటిస్తూనే, మూలంలో లేని విధంగా కార్యవిధానాన్ని మరింత నిర్దిష్టం చేయడం నివారించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే మూలంలోని గంభీరత, నామవాచక పునరుక్తి, ఉద్ఘాటనలను నిలిపే శైలి. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
