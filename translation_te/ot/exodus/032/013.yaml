  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: te
  text: 'నీ సేవకులైన అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు[a]లను జ్ఞాపకం చేసుకో. నీవు నీపై నీవే ప్రమాణం చేసి వారితో ఇలా అన్నావు: ‘నేను మీ సంతానాన్ని ఆకాశంలోని నక్షత్రాలవలె విస్తరింపజేస్తాను. నేను చెప్పిన ఈ భూమి అంతటినీ మీ సంతానానికి ఇస్తాను; వారు దానిని శాశ్వతంగా వారసత్వంగా పొందుతారు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, తరువాత ‘ఇశ్రాయేలు’ అనే పేరు పొందిన పితరుడైన యాకోబు. హీబ్రూ పాఠంలో ఇక్కడ ‘ఇశ్రాయేలు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం చేసుకో
  rationale: దేవునికి ఉద్దేశించిన ఏకవచన ఆజ్ఞారూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; నిబంధన వాగ్దానాన్ని గుర్తుచేసే మోషే విజ్ఞాపనను అదనపు వివరణ లేకుండా వ్యక్తం చేస్తుంది.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు
  rationale: హీబ్రూ పాఠంలో ఉన్న పేర్లనే లిప్యంతరీకరించింది. ఇక్కడ יִשְׂרָאֵל ఉన్నందున ప్రధాన పాఠంలో ‘యాకోబు’ అని మార్చలేదు.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులైన
  rationale: עבד బానిస లేదా సేవకుడు అనే అర్థాలు ఇవ్వగలిగినా, ఇక్కడ పితరులు దేవునితో ఉన్న నిబంధన సంబంధంలోని సేవకులని సూచించడం వల్ల ‘సేవకులు’ సందర్భోచితం.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: నీవు నీపై నీవే ప్రమాణం చేసి
  rationale: בָּךְలోని స్వీయసూచక బలాన్ని స్పష్టంగా ఉంచి, దేవుడు తనపైనే ప్రమాణం చేశాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: వారితో ఇలా అన్నావు
  rationale: ప్రత్యక్ష ఉల్లేఖనానికి ముందు ‘అన్నావు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; ‘ఇలా’ తరువాత వచ్చే మాటలకు అనుసంధానం చేస్తుంది.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: నేను మీ సంతానాన్ని … విస్తరింపజేస్తాను
  rationale: רבה హిఫీల్ రూపంలోని పెంపొందించడం/విస్తరింపజేయడం అనే కారణార్థాన్ని నిలుపుతుంది. זרע యొక్క సమష్టి భావానికి ‘సంతానం’ సరిపోతుంది.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: ఆకాశ నక్షత్రాలవలె
  rationale: ఉపమానాన్ని, ఉన్నతమైన వాగ్దాన శైలిని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְכָל הָאָרֶץ הַזֹּאת אֲשֶׁר אָמַרְתִּי
  choice: నేను చెప్పిన ఈ దేశమంతటినీ
  rationale: సాపేక్ష వాక్యాన్ని తదుపరి ‘ఇస్తాను’లో కలిపి ‘ఇస్తానని చెప్పిన’గా మార్చకుండా, אָמַרְתִּיని ప్రత్యేకంగా ‘నేను చెప్పిన’ అని ఉంచుతుంది.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: మీ సంతానానికి ఇస్తాను
  rationale: అసంపూర్ణ క్రియారూపంలోని వాగ్దాన భవిష్యత్తును నేరుగా తెలియజేస్తూ, זרעకు ముందున్న ‘సంతానం’ పదాన్ని స్థిరంగా కొనసాగిస్తుంది.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: వారు దాన్ని శాశ్వతంగా స్వాస్థ్యంగా పొందుతారు
  rationale: נחלలోని వారసత్వంగా పొందడం అనే భావాన్ని ‘స్వాస్థ్యంగా పొందుతారు’ స్పష్టంగా వ్యక్తం చేస్తుంది. హీబ్రూలో అంతర్లీనంగా ఉన్న దేశాన్ని తెలుగులో ‘దాన్ని’గా సూచించింది; לְעֹלָםకు ‘శాశ్వతంగా’ సరిపోతుంది.
theological_decisions:
- issue: పితరుణ్ణి ‘ఇశ్రాయేలు’గా లేదా ‘యాకోబు’గా పేర్కొనడం
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు’
  alternative: యాకోబు
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘ఇశ్రాయేలు’ అని చదువుతుంది. ‘యాకోబు’గా మార్చడం అనువాదం కంటే వ్యాఖ్యానం అవుతుంది; నిబంధన సందర్భంలో అతనికి ఇవ్వబడిన పేరునూ మరుగుపరుస్తుంది.
- issue: בָּךְ అనే ప్రమాణ సూత్రం
  choice: నీపై నీవే ప్రమాణం చేసి
  alternative: నీ తోడని ప్రమాణం చేసి
  rationale: దేవుడు తననే ప్రమాణానికి హామీగా ఉంచాడనే స్వీయసూచక బలాన్ని ఎంపిక చేసిన రూపం స్పష్టంగా కాపాడుతుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రార్థనా-నిబంధన శైలిని ఉపయోగించాం. గౌరవ సూచక బహువచనం కాకుండా, హీబ్రూ ఏకవచన సంబోధనకు అనుగుణంగా దేవునికి ‘నీ/నీవు’ రూపాలు వాడాం. పితరుల సమూహాన్ని ఉద్దేశించిన ఉల్లేఖనంలో ‘మీ’ వాడాం.
