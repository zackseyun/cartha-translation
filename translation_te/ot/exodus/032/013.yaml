  to: 'నీ సేవకులైన అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు[a]లను జ్ఞాపకం చేసుకో. నీవు నీపై నీవే ప్రమాణం చేసి వారితో ఇలా అన్నావు: ‘నేను మీ సంతానాన్ని ఆకాశంలోని నక్షత్రాలవలె విస్తరింపజేస్తాను. నేను చెప్పిన ఈ భూమి అంతటినీ మీ సంతానానికి ఇస్తాను; వారు దానిని శాశ్వతంగా వారసత్వంగా పొందుతారు.’'
  rationale: 'The revision retains the Hebrew clause sequence: ‘all this land which I said’ followed by ‘I will give to your offspring,’ without recasting it as ‘the land that I said I would give.’ It also improves modern Telugu idiom for the land and inheritance language and corrects the footnote’s alternative-name framing.'
