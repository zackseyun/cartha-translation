id: EXO.32.9
reference: Exodus 32:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: te
  text: 'యాహ్వే మోషేతో ఇలా అన్నాడు: “నేను ఈ ప్రజలను చూశాను; ఇదిగో, వీరు గట్టి మెడగల ప్రజలు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొండి ప్రజలు.” హీబ్రూలో ఇది అక్షరార్థంగా “గట్టి మెడగల ప్రజలు” అనే రూపకం; ఇది మొండితనాన్ని లేదా ప్రతిఘటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఆధునిక ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది; ముందున్న సందర్భమే వరుస చర్యను తెలియజేస్తుంది.
- source_word: רָאִיתִי
  choice: గమనించాను
  rationale: ఇక్కడ క్రియ కేవలం కంటితో చూడడాన్ని కాక, ప్రజల స్వభావాన్ని పరిశీలించి గుర్తించిన భావాన్ని ఇస్తుంది; తరువాతి అంచనాతో దాని ప్రస్తుత ప్రాసంగికత నిలుస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలను
  rationale: עָם అనే సమూహవాచక ఏకవచనాన్ని ‘ప్రజలు’గా సహజంగా అందిస్తూ, demonstrative వల్ల కలిగే సూచనాత్మకమైన—కొంత దూరం ఉంచే—ధోరణిని కాపాడుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సంభాషణ సూచిక యొక్క వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: קְשֵׁה עֹרֶף
  choice: మెడ వంచని
  rationale: ‘గట్టి మెడగల’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతూ, మొండితనం మరియు లోబడకపోవడం అనే భావాలను వ్యక్తం చేస్తుంది.
- source_word: הוּא
  choice: వీరు
  rationale: హీబ్రూలో ‘ప్రజ’ సమూహవాచక ఏకవచనాన్ని సూచించినా, తెలుగులో వ్యక్తుల సమూహమైన ప్రజలను గౌరవబహువచన/బహువచన సర్వనామంతో సూచించడం సహజం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచుతుంది. ‘యాహ్వే’ అనేది ఆధునిక పండిత వాడుకలో సాధారణంగా అంగీకరించిన ఉచ్చారణకు తెలుగు లిప్యంతరీకరణ; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ పూర్తిగా నిర్ధారించబడలేదనే పరిమితిని ఇది తొలగించదు.
- issue: קְשֵׁה עֹרֶף రూపకాన్ని నిలుపుట
  choice: మెడ వంచని ప్రజలు
  alternative: మొండి ప్రజలు
  rationale: మూలంలోని శారీరక రూపకాన్ని నిలుపుతూ దాని నైతిక భావమైన మొండితనం, ప్రతిఘటన, లోబడకపోవడం అన్నింటినీ ఒకే నిర్దిష్ట సిద్ధాంతార్థానికి కుదించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘ఇదిగో’ అనే కొద్దిగా ఉన్నతమైన పదాన్ని మూలంలోని וְהִנֵּה యొక్క శ్రద్ధాకర్షక బలం కోసం ఉంచాం. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత రూపకం వెంటనే ఉంచబడింది.
