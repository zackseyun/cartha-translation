source:
  edition: WLC
  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: te
  text: మోషే పర్వతం నుండి దిగిరావడం చాలా ఆలస్యమవుతోందని ప్రజలు చూసినప్పుడు, వారు అహరోను చుట్టూ గుమికూడి అతనితో, “లేచి, మా ముందుగా నడిచే దేవుళ్లను[a] మాకు తయారుచేయి. ఎందుకంటే ఐగుప్తు దేశం నుంచి మమ్మల్ని పైకి తీసుకొచ్చిన ఈ మోషే అనే మనిషికి ఏమైందో మాకు తెలియదు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా ముందుగా నడిచే ఒక దేవుణ్ణి.” తరువాతి కథనం ఒకే దూడ విగ్రహంపై దృష్టిపెట్టడం వల్ల కొందరు אֱלֹהִים అనే పదాన్ని ఇక్కడ ఏకవచన భావంలో అర్థం చేసుకుంటారు. అయితే హీబ్రూలో ఆ పదరూపం, దాని వెంట వచ్చే క్రియ రెండూ బహువచనంలో ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: చాలా ఆలస్యం చేస్తున్నాడని
  rationale: మోషే దిగిరావడం ఎక్కువ సమయం తీసుకుంటోందనే ప్రజల అవగాహనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָרֶדֶת מִן־הָהָר
  choice: పర్వతం మీద నుంచి దిగివచ్చేందుకు
  rationale: దిశను, పర్వతం నుంచి దిగివచ్చే చర్యను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּקָּהֵל הָעָם עַל־אַהֲרֹן
  choice: వారు అహరోను చుట్టూ గుమికూడి
  rationale: అహరోనుపై ప్రజలు ఒత్తిడి తెచ్చేలా అతని చుట్టూ సమకూడిన దృశ్యాన్ని తెలిపుతుంది; ప్రత్యక్ష శత్రుత్వాన్ని అవసరానికి మించి చేర్చదు.
- source_word: קוּם
  choice: లేచి
  rationale: ఆజ్ఞలోని అకస్మాత్తుతనాన్ని, బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עֲשֵׂה־לָנוּ
  choice: మాకు తయారుచేయి
  rationale: అహరోను తమ కోసం వాటిని చేయాలనే దత్తార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: దేవుళ్లను ... నడిచే
  rationale: నామవాచకం రూపరీత్యా బహువచనం; దానితో ఉన్న హీబ్రూ క్రియ కూడా బహువచనం. అందువల్ల ప్రధాన పాఠ్యంలో బహువచనం నిలుపబడింది.
- source_word: הָאִישׁ
  choice: ఈ మోషే అనే మనిషి
  rationale: ‘ఈ మోషే, ఆ మనిషి’ అనే మూలంలోని నిరాదరణతో కూడిన సూచనను సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుంచి మమ్మల్ని పైకి తీసుకొచ్చిన
  rationale: హిఫీల్ క్రియలోని ‘పైకి తీసుకురావడం’ అనే నిర్గమ సందర్భపు భావాన్ని, ‘దేశం’ అనే పూర్తి వ్యక్తీకరణను నిలుపుతుంది.
- source_word: מֶה הָיָה לוֹ
  choice: అతనికి ఏమైందో
  rationale: మోషే గతి ఏమైందని అడిగే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: אֱלֹהִים ను ఇక్కడ ఏకవచనంగా లేదా బహువచనంగా అనువదించాలా
  choice: 'బహువచనం: ‘దేవుళ్లు’'
  alternative: 'ఏకవచనం: ‘ఒక దేవుడు’'
  rationale: 'తక్షణ వ్యాకరణం బహువచనాన్ని సమర్థిస్తుంది: אֱלֹהִים రూపరీత్యా బహువచనం; יֵלְכוּ అనే అనుసరించే క్రియ కూడా బహువచనం. తరువాతి కథనం ఒక దూడ విగ్రహంపై కేంద్రీకరించడం వల్ల ఏకవచన పఠనం సాధ్యమే; దాన్ని పాదసూచికలో భద్రపరచాం.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని బహువచన వ్యాకరణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భం సూచించగల ఏకవచన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
