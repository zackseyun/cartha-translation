source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఎవరైతే నాకు విరోధంగా పాపం చేశాడో, అతనిని నా గ్రంథం నుండి తుడిచివేస్తాను.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా గ్రంథం నుండి చెరిపివేస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: “నా గ్రంథం” అనేది దేవుని సంరక్షణలో ఉన్నవారి నమోదును సూచించవచ్చు; కొందరు దీన్ని మరింత నిర్దిష్టంగా “జీవగ్రంథం”గా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: אֶל מֹשֶׁה
  choice: మోషేతో
  rationale: ‘మోషేతో అన్నాడు’ అనేది אֶל‌తో కూడిన మాటల క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִי אֲשֶׁר
  choice: చేసినవాణ్ణే
  rationale: ఈ నిర్మాణం అనిర్దిష్ట సంబంధార్థాన్ని ఇస్తుంది. సందర్భంలో వ్యక్తిగత బాధ్యతను నొక్కిచెప్పే ‘చేసినవాణ్ణే’ దాని సాధారణీకరణ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: חָטָא לִי
  choice: నాకు విరోధంగా పాపం చేసిన
  rationale: חטא‌కు לִי జతకావడం పాపం దేవునికి వ్యతిరేకంగా చేయబడిందని సూచిస్తుంది; సంపూర్ణ క్రియను పూర్తైన అపరాధంగా అనువదించాం.
- source_word: אֶמְחֶנּוּ
  choice: వాణ్ణే ... తుడిచివేస్తాను
  rationale: מחה అనేది తుడిచివేయడం లేదా చెరిపివేయడం అనే భావాన్ని ఇస్తుంది. గ్రంథంలోని నమోదును తొలగించే రూపకాన్ని ‘తుడిచివేస్తాను’ నిలుపుతుంది; పురుష ఏకవచన ప్రత్యయ భావాన్ని ‘వాణ్ణే’ ప్రతిబింబిస్తుంది.
- source_word: מִסִּפְרִי
  choice: నా గ్రంథంలో నుంచి
  rationale: סֵפֶר‌ను ‘గ్రంథం’గా అనువదించి, מן‌ను తొలగింపునకు మూలస్థానాన్ని సూచించే ‘నుంచి’గా వ్యక్తపరచాం. దైవిక నమోదు అనే రూపకాన్ని మరింత నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: ‘నా గ్రంథం’ యొక్క స్వభావం
  choice: ‘నా గ్రంథం’ అనే రూపకాన్నే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘జీవగ్రంథం’, ‘జీవించి ఉన్నవారి నమోదు’ లేదా ‘నిబంధన ప్రజల పట్టిక’ అని నిర్దిష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యం కేవలం ‘నా గ్రంథం’ అని మాత్రమే చెబుతుంది. దాని ఖచ్చితమైన సూచనపై భిన్న అవగాహనలు ఉన్నందున, అనువాదం ఆ అస్పష్టతను, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, దైవవాక్య పఠనానికి తగిన గౌరవభరిత శైలిలోనూ రూపొందించాం. ‘గ్రంథం’ అనే రూపకాన్ని నిలిపి, వివరణాత్మక నిర్దిష్టీకరణను పాదసూచికకు పరిమితం చేశాం.
