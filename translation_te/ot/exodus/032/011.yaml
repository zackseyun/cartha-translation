revisions:
- from: కానీ మోషే తన దేవుడైన యెహోవాను వేడుకుంటూ[a], “యెహోవా, నీవు గొప్ప శక్తితో, బలమైన చేతితో ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన నీ ప్రజల మీద నీ కోపం ఎందుకు రగలాలి?” అని అన్నాడు.
  to: 'కానీ మోషే తన దేవుడైన యెహోవాను వేడుకొని[a] ఇలా అన్నాడు: “యెహోవా, నీవు గొప్ప శక్తితో, బలమైన చేతితో ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన నీ ప్రజలపై నీ కోపం ఎందుకు రగలాలి?”'
  rationale: The revision preserves every source element while making the two Hebrew narrative verbs sequential in Telugu. The footnote has been rewritten to explain the פנים idiom as an appeal for favor, rather than presenting an inaccurate or theologically misleading pseudo-literal paraphrase. The footnote marker remains attached to the idiomatic expression it explains.
