reference: Exodus 32:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: te
  text: 'కానీ మోషే తన దేవుడైన యెహోవాను వేడుకొని[a] ఇలా అన్నాడు: “యెహోవా, నీవు గొప్ప శక్తితో, బలమైన చేతితో ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన నీ ప్రజలపై నీ కోపం ఎందుకు రగలాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘యెహోవా ముఖాన్ని అనుగ్రహం కోసం ఆశ్రయించాడు’ అనే నుడికారం ఉంది; అంటే, ఆయన అనుగ్రహాన్ని కోరుతూ మనఃపూర్వకంగా వేడుకున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: యెహోవాను వేడుకుంటూ
  rationale: ఈ పీయేల్ ప్రయోగం అక్షరార్థంగా ‘ముఖాన్ని వెదకడం/ముఖాన్ని అనుకూలపరచుకోవడం’ అనే రూపంలో ఉన్నా, ఇక్కడ అనుగ్రహం కోరుతూ మనఃపూర్వకంగా వేడుకోవడం అనే నుడికారార్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘వేడుకుంటూ’ ఆ అత్యవసర విజ్ఞాపనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: ఏకవచన స్వామ్యప్రత్యయం మోషే దేవుణ్ణి సూచిస్తుంది; ‘తన దేవుడైన’ అనే రూపం సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: ప్రశ్నార్థక విజ్ఞాపనను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: నీ కోపం ఎందుకు రగలాలి
  rationale: హీబ్రూలోని వేడి/మండే కోపం రూపకాన్ని ‘రగలాలి’ నిలుపుతుంది; ప్రశ్నలోని విజ్ఞాపనాత్మక భావాన్ని కూడా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בְּעַמֶּךָ
  choice: నీ ప్రజల మీద
  rationale: కోపాన్ని సూచించే క్రియతో בְּ ప్రతికూల లక్ష్యాన్ని సూచిస్తుంది; తెలుగులో ‘మీద’ సహజమైన ప్రయోగం.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: నీవు ... బయటకు తీసుకొచ్చిన
  rationale: ప్రజలు దేవుని విమోచన కార్యానికి కర్మలని స్పష్టంగా ఉంచుతూ నిర్గమ కార్యాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: ‘దేశం’ అనే మూలపదాన్ని నిలుపుతూ తెలుగులో సంప్రదాయంగా గుర్తించదగిన భౌగోళిక నామరూపాన్ని వాడాం.
- source_word: בְּכֹחַ גָּדוֹל
  choice: గొప్ప శక్తితో
  rationale: కరణార్థక בְּ ను ‘తో’గా, גָּדוֹל ను ‘గొప్ప’గా నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: וּבְיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: నిర్గమ కథనంలోని స్థిరమైన రూపకాన్ని నిలుపుతుంది; חֲזָקָה కు ‘బలమైన’ సన్నిహితమైన అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవిక కోపానికి సంబంధించిన మానవరూపక భాష
  choice: ‘నీ కోపం ... రగలాలి’ అంటూ వేడి రూపకాన్ని నిలుపడం
  alternative: ‘నీవు ఎందుకు కోపపడాలి?’ అని రూపకాన్ని సద్దుమణచడం
  rationale: మూలంలోని חרה אף శరీరాధారిత కోపరూపకాన్ని అతిగా అక్షరార్థం చేయకుండా, దాని తీవ్రతను మరియు మోషే విజ్ఞాపనలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో పరిచయమైన నామరూపంలో ఉంచుతుంది.
- issue: మోషే విజ్ఞాపనలో దేవునితో ఉన్న సంబంధభాష
  choice: ‘నీ ప్రజలు’ అనే ఒడంబడిక సంబంధ సూచనను యథాతథంగా నిలుపడం
  alternative: ‘ఇశ్రాయేలీయులు’ అని సూచ్యార్థాన్ని స్పష్టీకరించడం
  rationale: మోషే వాదనలోని ప్రధాన theological tension దేవుడు వారిని ‘నీ ప్రజలు’గా గుర్తించాలనే విజ్ఞాపనలో ఉంది; ప్రత్యేక నామాన్ని చేరిస్తే ఆ వాక్చాతుర్యం మందగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కానీ’తో కథన వ్యత్యాసాన్ని, ‘గొప్ప శక్తితో, బలమైన చేతితో’ అనే సమాంతర నిర్మాణంతో మూలంలోని లయను నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
