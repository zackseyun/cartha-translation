revisions:
- from: అయితే ఇప్పుడు నీవు వెళ్లి, నేను నీతో చెప్పిన చోటుకు ప్రజలను నడిపించు. ఇదిగో, నా దూత నీకు ముందుగా వెళ్తాడు. అయితే నేను లెక్క అడిగే రోజున, వారి పాపాన్ని బట్టి వారిని లెక్క అడుగుతాను.
  to: అయితే ఇప్పుడు నీవు వెళ్లి, నేను నీతో చెప్పిన చోటుకు ప్రజలను నడిపించు. ఇదిగో, నా దూత నీకు ముందుగా వెళ్తాడు. అయితే నేను వారిని లెక్క అడిగే రోజున, వారి పాపం విషయమై వారిని లెక్క అడుగుతాను.
  rationale: The revision retains the draft’s handling of the messenger and its deliberate repetition of ‘లెక్క అడుగు’ for פקד. It supplies the contextually implicit object in the first occurrence and refines the final prepositional relation so that the people are called to account concerning their own sin, as in the source.
  reviewer_model: gpt-5.6-terra
