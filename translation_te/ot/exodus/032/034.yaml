id: EXO.32.34
reference: Exodus 32:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: te
  text: అయితే ఇప్పుడు నీవు వెళ్లి, నేను నీతో చెప్పిన చోటుకు ప్రజలను నడిపించు. ఇదిగో, నా దూత నీకు ముందుగా వెళ్తాడు. అయితే నేను వారిని లెక్క అడిగే రోజున, వారి పాపం విషయమై వారిని లెక్క అడుగుతాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: అయితే ఇప్పుడు
  rationale: సంభాషణలో మునుపటి విన్నపానికి ప్రతిస్పందనగా వచ్చే మార్పును, అలాగే ‘ఇప్పుడు’ అనే కాలసూచనను సహజంగా నిలుపుతుంది.
- source_word: נְחֵה
  choice: నడిపించు
  rationale: మార్గం చూపుతూ ప్రజలను గమ్యానికి తీసుకెళ్లడం అనే హిఫీల్ ఆజ్ఞార్థ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తదుపరి వాగ్దానంపై దృష్టి నిలిపే హీబ్రూ సూచనార్థక పదానికి సహజమైన తెలుగు సమానం.
- source_word: מַלְאָכִי
  choice: నా దూత
  rationale: מַלְאָךְ పదంలోని ‘దూత/సందేశవాహకుడు’ భావాన్ని నిలుపుతూ, ఈ సందర్భంలో అతని స్వరూపాన్ని మరింతగా నిర్వచించదు.
- source_word: פָּקַד
  choice: లెక్క అడుగు
  rationale: ఈ సందర్భంలో పాపాన్ని విచారించి బాధ్యత మోపడం అనే భావాన్ని అందిస్తుంది; కేవలం ‘శిక్షించు’ అని అనువదించి పదంలోని విస్తృత న్యాయపరిశీలన భావాన్ని ముందుగానే కుదించదు.
theological_decisions:
- issue: ‘నా దూత’ యొక్క గుర్తింపు
  choice: నా దూత
  alternative: నా దేవదూత
  rationale: మూలపాఠం దూత యొక్క స్వరూపాన్ని ఇక్కడ స్పష్టంగా నిర్ధారించదు; అందువల్ల ‘దూత’ అనే విస్తృత పదంతో ఆ అనిశ్చితిని కాపాడాం.
- issue: పָּקַד యొక్క న్యాయపరమైన భావం
  choice: నేను లెక్క అడిగే రోజున… వారిని లెక్క అడుగుతాను
  alternative: నేను శిక్షించే రోజున… వారిని శిక్షిస్తాను
  rationale: హీబ్రూలోని ఒకే మూలపదం పునరావృతాన్ని ప్రతిబింబిస్తూ, దేవుని న్యాయపరిశీలన మరియు దానికి అనుసరించే బాధ్యత రెండింటినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. హీబ్రూ వాక్యంలోని ఆజ్ఞ, వాగ్దానం, హెచ్చరిక అనే మూడు భాగాల క్రమాన్ని నిలిపాం; నిజమైన భావసందిగ్ధతను పాదటిప్పణి లేకుండానే ప్రధాన పాఠ్యంలో సంరక్షించాం.
