id: EXO.32.7
reference: Exodus 32:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “వెళ్లు, కిందికి దిగు; ఎందుకంటే ఐగుప్తు దేశం నుండి నువ్వు పైకి తీసుకొచ్చిన నీ ప్రజలు తమను తాము భ్రష్టుపరచుకున్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడుగా ప్రవర్తించారు.” హీబ్రూ క్రియను, ఫలితంగా వారు భ్రష్టులయ్యారనే భావం కంటే వారి చెడు ప్రవర్తనను నొక్కిచెప్పే విధంగా కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా ఆ కొనసాగింపును తెలియజేస్తుంది. ‘ఇలా అన్నాడు’ ప్రత్యక్ష సంభాషణను సహజంగా పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఉచ్చారణాధారిత రూపాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: לֶךְ רֵד
  choice: వెళ్లి కిందికి దిగు
  rationale: మూలంలో ‘వెళ్లు’ మరియు ‘దిగు’ అనే రెండు ఆజ్ఞారూపాలు ఉన్నాయి. తెలుగులో వాటి బలాన్ని నిలుపుతూ సహజమైన సంయుక్త ఆజ్ఞగా అనువదించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఈ పదం దిగిపోవాలనే ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שִׁחֵת
  choice: తమను తాము చెడగొట్టుకున్నారు
  rationale: ఈ సందర్భంలో విగ్రహారాధన వల్ల ప్రజలు తామే నైతికంగా చెడిపోయారనే ఫలితార్థాన్ని వ్యక్తం చేస్తుంది. క్రియను కేవలం ప్రవర్తనగా కూడా అర్థం చేసుకోవచ్చని పాదసూచికలో తెలిపాం.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: సమూహవాచకమైన עַם కు ‘ప్రజలు’ సహజమైన తెలుగు సమానం. ‘నీ’ అనే సంబోధన ఈ సందర్భంలోని వాక్చాతుర్యపూరిత ఒత్తిడిని నిలుపుతుంది.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: నువ్వు పైకి తీసుకొచ్చిన
  rationale: హిఫీల్ క్రియలోని ‘పైకి తీసుకురావడం’ అనే కారణార్థాన్ని, మోషేను ఉద్దేశించిన ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుంచి
  rationale: ‘దేశం’ అనే మూలపదాన్ని స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా మూలనామానికి దగ్గరైన ‘యాహ్వే’ రూపాన్ని వాడాం.
- issue: שִׁחֵת క్రియలోని భావం
  choice: తమను తాము చెడగొట్టుకున్నారు
  alternative: చెడుగా ప్రవర్తించారు
  rationale: ప్రజల దోషపూరిత చర్యతో పాటు దాని వల్ల కలిగిన స్వీయ నైతిక పతనాన్ని ప్రధాన పాఠం తెలియజేస్తుంది. అయితే క్రియను చెడు ప్రవర్తనపై దృష్టి పెట్టే విధంగా కూడా అనువదించవచ్చు; ఆ నిజమైన భావసాధ్యతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మోషేతో ప్రత్యక్ష సంభాషణ కావడంతో ‘నువ్వు/నీ’ అనే సహజ ఏకవచన రూపాలను ఉంచాం; మూలంలోని ఆజ్ఞల క్రమాన్ని ‘వెళ్లి కిందికి దిగు’గా సహజీకరించాం.
