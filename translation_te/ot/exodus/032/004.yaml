source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מִ/יָּדָ֗/ם וַ/יָּ֤צַר אֹת/וֹ֙ בַּ/חֶ֔רֶט וַֽ/יַּעֲשֵׂ֖/הוּ עֵ֣גֶל מַסֵּכָ֑ה וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: te
  text: అతడు వారి చేతులనుండి దానిని తీసుకొని, చెక్కుడు పనిముట్టుతో దానికి రూపమిచ్చి[a], పోతపోసిన దూడ విగ్రహంగా చేశాడు. అప్పుడు వారు[b], “ఇశ్రాయేలూ, ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన ఇవే నీ దేవుళ్లు!”[c] అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెక్కే పనిముట్టుతో,” “లేఖనితో,” లేదా “ఉలితో.” ఇక్కడి హీబ్రూ పదం సూచించే ఖచ్చితమైన పరికరం ఏమిటో వివాదాస్పదం.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన పాఠ సంప్రదాయాల్లో “వారు అన్నారు” బదులు “అతడు అన్నాడు” అని ఉంది.
    reason: textual_variant
  - marker: c
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా “ఇవే నీ దేవుళ్లు” అని బహువచనం ఉంది. ఒక్క దూడ విగ్రహాన్ని దృష్టిలో ఉంచుకొని సంప్రదాయ అనువాదాలు తరచుగా “ఇదే నీ దేవుడు” అని ఏకవచనంగా ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: వారి చేతుల్లోనుండి దానిని తీసుకొని
  rationale: לקח అంటే ‘తీసుకొను/స్వీకరించు.’ ముందటి వచనంలోని బంగారాన్ని సూచించేందుకు తెలుగులో అవసరమైన ‘దానిని’ చేర్చబడింది; ‘చేతుల్లోనుండి’ హీబ్రూ బహువచనాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: చెక్కే పరికరంతో దానికి రూపమిచ్చి
  rationale: יצר ఉద్దేశపూర్వకంగా రూపం కల్పించడాన్ని సూచిస్తుంది. חֶרֶט ఏ విధమైన పరికరమో వివాదాస్పదమైనందున, ప్రధాన పాఠంలో సహజమైన సాధారణ పదబంధం వాడి, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: పోతపోసిన దూడ విగ్రహంగా చేశాడు
  rationale: עֵגֶל అంటే ‘దూడ’; מַסֵּכָה లోహాన్ని పోతపోసి చేసిన ప్రతిమను సూచిస్తుంది. ‘విగ్రహం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘పోతపోసిన’ తయారీ విధానాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמְרוּ
  choice: వారు అన్నారు
  rationale: మసొరా పాఠంలోని క్రియ బహువచనంలో ఉంది. కొన్ని పాఠ సంప్రదాయాల ఏకవచనాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా పాదసూచికలో ఇచ్చాం.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: నీ దేవుళ్లు వీరే
  rationale: אֵלֶּה మరియు אֱלֹהֶיךָ రూపాలు బహువచనంలో ఉన్నాయి. ఒక్క దూడ విగ్రహం ఉన్నప్పటికీ మూలపాఠంలోని బహువచన ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: సంబోధన భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన
  rationale: עלה హిఫిల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, מֵאֶרֶץ מִצְרָיִם అనే పూర్తి పదబంధాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: విగ్రహ ప్రకటనలో బహువచనమా, ఏకవచనమా
  choice: “నీ దేవుళ్లు వీరే” అని బహువచనంగా అనువదించడం
  alternative: “నీ దేవుడు ఇతడే”
  rationale: మసొరా హీబ్రూ పాఠంలోని సూచన సర్వనామం, నామవాచక రూపం రెండూ బహువచనంలో ఉన్నాయి. ఒక్క దూడ విగ్రహంతో ఏర్పడే ఉద్రిక్తతను అనువాదం మౌనంగా తొలగించకూడదు.
- issue: విగ్రహ తయారీలో అహరోను పాత్ర
  choice: తీసుకోవడం, రూపమివ్వడం, చేయడం అన్నింటిలోనూ ఏకవచన కర్త యొక్క ప్రత్యక్ష పాత్రను నిలుపడం
  alternative: అతడు కేవలం బంగారాన్ని స్వీకరించాడని లేదా పనిని పర్యవేక్షించాడని మృదువుగా చెప్పడం
  rationale: హీబ్రూ క్రియలు ఈ చర్యలను నేరుగా ఏకవచన కర్తకే ఆపాదిస్తాయి; అతని బాధ్యతను తగ్గించే వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఇశ్రాయేలూ’ అనే సంబోధన, ‘ఐగుప్తు దేశం,’ ‘పైకి తీసుకొచ్చిన’ అనే పదబంధాలు మూలపాఠపు గంభీరతను నిలుపుతాయి. హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంతవరకు అనుసరిస్తూనే, తెలుగులో చర్యల సంబంధం స్పష్టంగా ఉండేలా అసమాపక క్రియలు వాడబడ్డాయి.
