  terminology: ఇశ్రాయేలు, ఐగుప్తు దేశం, దూడ, విగ్రహం వంటి పదాలు స్థిరమైన, తగిన బైబిలు-కథన రిజిస్టర్‌లో ఉన్నాయి. “చెక్కుడు పనిముట్టు” అనేది חֶרֶט‌కు అతిగా నిర్దిష్టత ఇవ్వకుండా ఉపయోగకరమైన ప్రధాన పాఠ పదబంధం; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాలి.
