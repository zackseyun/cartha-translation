id: EXO.32.22
reference: Exodus 32:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַהֲרֹ֔ן אַל יִ֥חַר אַ֖ף אֲדֹנִ֑/י אַתָּה֙ יָדַ֣עְתָּ אֶת הָ/עָ֔ם כִּ֥י בְ/רָ֖ע הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: te
  text: అప్పుడు అహరోను, “నా ప్రభువా, నీ కోపం రగలనివ్వకు. ఈ ప్రజలు చెడువైపు మొగ్గుచూపేవారని[a] నీకు తెలుసు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెడుకు ఒరిగినవారు,” లేదా “చెడుపైనే మనసు పెట్టినవారు.” హీబ్రూ ప్రయోగం ప్రజలను ఒక సమూహంగా చెడు లక్షణం కలవారిగా వర్ణిస్తుంది.
    reason: హీబ్రూలోని సామూహిక ఏకవచన, జాతీయ ప్రయోగం మరియు దాని నుడికార భావవ్యాప్తిని సూచించడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: అప్పుడు అహరోను ... అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని వావ్-కన్సెక్యూటివ్‌ను సహజమైన తెలుగు కథన శైలిలో ‘అప్పుడు’తో తెలియజేసి, పలికిన మాటల తర్వాత ‘అన్నాడు’ ఉంచాం.
- source_word: אַל יִחַר אַף
  choice: నీ కోపం రగులుకోనివ్వకు
  rationale: కోపం మండడం అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించాం.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: ఇది దేవునికి వాడిన బిరుదు కాదు; మోషేను గౌరవంగా సంబోధించిన మాట. ‘నా ప్రభువా’ ఆ వినయపూర్వక సంబోధనను నిలుపుతుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: హీబ్రూలోని ప్రత్యక్ష ద్వితీయ పురుష సంబోధనను సహజమైన ఆధునిక తెలుగులో తెలిపాం; అనవసరమైన అదనపు ఉద్ఘాటనను చేర్చలేదు.
- source_word: הָעָם
  choice: ఈ ప్రజలు
  rationale: సందర్భంలో సమక్షంగా ఉన్న ఇశ్రాయేలు ప్రజలను సూచిస్తున్నందున తెలుగు వాక్యంలో ‘ఈ ప్రజలు’ సహజంగా ఉంది.
- source_word: בְרָע הוּא
  choice: చెడువైపు మొగ్గుచూపేవారు
  rationale: అక్షరార్థంగా ‘అది/అతడు చెడులో ఉన్నాడు’ అనే సామూహిక, జాతీయ ప్రయోగం. ప్రజలను చెడు లక్షణం కలవారిగా వర్ణించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం; దాని భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: אֲדֹנִי అనే సంబోధన ఎవరిని సూచిస్తుంది?
  choice: నా ప్రభువా
  alternative: నా యజమానీ; అయ్యా
  rationale: ఇక్కడ అహరోను మోషేను సంబోధిస్తున్నాడు; ఇది దేవుని నామం లేదా దేవునికే ప్రత్యేకమైన బిరుదు కాదు. గౌరవాన్ని నిలుపుతూ దైవసూచనగా అపార్థం కాకుండా సందర్భమే అర్థాన్ని నిర్ణయిస్తుంది.
- issue: בְרָע הוּא ప్రజల నైతిక స్థితిని ఎంత నిర్దిష్టంగా వర్ణిస్తుంది?
  choice: చెడువైపు మొగ్గుచూపేవారు
  alternative: చెడుకు బానిసలైనవారు; చెడులో ఉన్నవారు
  rationale: మూలంలోని జాతీయ ప్రయోగం ప్రజలు చెడు చేత పూర్తిగా నిర్ణయించబడ్డారని తప్పనిసరిగా చెప్పదు. అందువల్ల నైతిక ప్రవృత్తిని తెలిపే అనువాదాన్ని ఎంచుకుని, మరింత బలమైన లేదా అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా ప్రభువా’లోని గౌరవభావాన్ని నిలిపి, కోపం ‘రగులుకోవడం’ అనే మూల రూపకాన్ని కాపాడాం.
