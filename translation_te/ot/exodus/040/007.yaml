source:
  edition: WLC
  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: te
  text: సమావేశపు గుడారానికి, బలిపీఠానికి మధ్యలో తొట్టిని[a] ఉంచాలి; దానిలో నీరు పోయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి సంప్రదాయ అనువాదం “లావెరు”; ఇది నీటిని ఉంచే తొట్టిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: ఉంచాలి
  rationale: נתן అనే క్రియకు ‘ఇవ్వు, పెట్టు, ఉంచు’ అనే విస్తృత అర్థాలున్నాయి. ఆరాధనా సామగ్రిని నిర్దిష్ట స్థలంలో అమర్చే ఈ సందర్భంలో ‘ఉంచాలి’ సహజంగాను మూలానికి దగ్గరగాను ఉంది.
- source_word: הַכִּיֹּר
  choice: కంచపు గంగాళం
  rationale: כִּיּוֹר గుడార సేవలో కడుక్కోవడానికి వాడే పెద్ద పాత్రను సూచిస్తుంది. నిర్గమకాండము 30:18, 38:8లో అది కంచుతో చేయబడినదని సందర్భం స్పష్టం చేస్తుంది; ‘గంగాళం’ ఆధునిక తెలుగు పాఠకునికి పెద్ద కడుగు పాత్ర భావాన్ని అందిస్తుంది.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: సమావేశపు గుడారానికి, బలిపీఠానికి మధ్య
  rationale: בֵּין...וּבֵין రెండు వస్తువుల మధ్యనున్న స్థలాన్ని సూచిస్తుంది. אֹהֶל מוֹעֵדకు ‘సమావేశపు గుడారం’ పారదర్శకమైన, సహజమైన తెలుగు రూపం.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: מִזְבֵּחַకు సాధారణ తెలుగు సమానార్థకం ‘బలిపీఠం.’ ఈ వచనంలో దాని రకం మరింత నిర్దిష్టంగా చెప్పబడలేదు.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: అక్కడ నీళ్లు పోయాలి
  rationale: హీబ్రూ పదక్రమానుసారం ‘అక్కడ నీళ్లు ఉంచాలి’ అని ఉన్నా, పాత్రలో నీరు నింపే సందర్భంలో ‘నీళ్లు పోయాలి’ సహజమైన తెలుగు. שָׁםను ‘అక్కడ’గా స్పష్టంగా నిలిపి, మూలంలో లేని ‘దానిలో’ అనే సర్వనామాన్ని చేర్చలేదు.
