  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞారూప శైలిని వాడాం. వాక్యంలోని రెండు ఆదేశాలకు ‘ఉంచాలి’, ‘పోయాలి’ అనే సమాంతర నిర్మాణం ఇచ్చాం.
