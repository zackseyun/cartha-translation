revisions:
- from: సమావేశపు గుడారానికి, బలిపీఠానికి మధ్య కంచపు గంగాళాన్ని[a] ఉంచాలి; అక్కడ నీళ్లు పోయాలి.
  to: సమావేశపు గుడారానికి, బలిపీఠానికి మధ్యలో తొట్టిని[a] ఉంచాలి; దానిలో నీరు పోయాలి.
