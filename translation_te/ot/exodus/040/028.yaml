  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: te
  text: అతడు నివాసమందిరపు ప్రవేశద్వారానికి తెరను అమర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివాసమందిరపు ప్రవేశద్వారం వద్ద తెరను ఉంచాడు.’
    reason: హెబ్రీయులోని క్రియకు ‘ఉంచాడు’ అనే సాధారణ అర్థం, అలాగే ప్రవేశద్వారంతో ఉన్న స్థానసంబంధాన్ని ప్రత్యామ్నాయంగా చూపించడానికి.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂוּם అంటే సాధారణంగా ‘ఉంచు, పెట్టు, అమర్చు.’ ఇక్కడ తెరను ప్రవేశద్వారం వద్ద ఉంచడాన్ని సహజంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: מָסַךְ
  choice: తెర
  rationale: నివాసమందిర సందర్భంలో מָסָךְ ప్రవేశద్వారానికి వేలాడదీసే అడ్డుతెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ సహజంగా ఉండి, లోపలి ‘విభజన తెర’కు వాడే ప్రత్యేక పదంతో అనవసరంగా కలపడాన్ని నివారిస్తుంది.
- source_word: הַפֶּתַח
  choice: ప్రవేశద్వారం
  rationale: פֶּתַח అంటే తెరువు, ద్వారం లేదా ప్రవేశస్థలం. ఈ నిర్మాణ సందర్భంలో ‘ప్రవేశద్వారం’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: לַמִּשְׁכָּן
  choice: నివాసమందిరపు
  rationale: מִשְׁכָּן దేవుడు తన ప్రజల మధ్య నివసించే పవిత్ర గుడారాన్ని సూచిస్తుంది. ‘నివాసమందిరం’ పదార్థాన్ని అందుబాటులో ఉంచుతూ తెలుగులో గౌరవప్రదంగా వినిపిస్తుంది; ל సంబంధాన్ని ఇక్కడ షష్ఠీ విభక్తితో సహజంగా వ్యక్తపరచవచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. వాక్యారంభంలోని וַ సంధిని ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా, తెలుగు కథన ప్రవాహానికి అనుగుణంగా వ్యక్తపరిచాం.
