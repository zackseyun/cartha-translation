  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְטֵ֥ר עָלָ֖י/ו קְטֹ֣רֶת סַמִּ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: te
  text: అతడు దానిమీద సుగంధ ద్రవ్యాలతో చేసిన ధూపాన్ని కాల్చాడు[a], యాహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుగంధ ధూపాన్ని’; హీబ్రూ పదబంధం సువాసనగల ద్రవ్యాలతో తయారైన ధూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: కాల్చాడు
  rationale: కטר హిఫిల్ రూపం బలిపీఠంపై అర్పణను పొగగా పైకి లేపేలా కాల్చడాన్ని సూచిస్తుంది; ధూపం అనే కర్మతో కలిసి ‘కాల్చాడు’ సహజంగా ఆ ఆరాధనాపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: పూర్వ సందర్భంలోని ధూపవేదికను సూచించే పుంలింగ ఏకవచన ప్రత్యయం; తెలుగులో ‘దానిమీద’ సహజమైన సూచన.
- source_word: קְטֹרֶת סַמִּים
  choice: సుగంధ ద్రవ్యాలతో చేసిన ధూపం
  rationale: ఈ పదబంధం సువాసనగల ద్రవ్యాల మిశ్రమంతో తయారైన ధూపాన్ని సూచిస్తుంది. కేవలం ‘సుగంధ ధూపం’ కంటే ఈ రూపం సַמִּים యొక్క ద్రవ్యాల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: దైవాజ్ఞకు సరిగ్గా అనుగుణంగా చర్య జరిగిందనే పోలికను ‘-నట్లే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞను సూచించే సంబంధక్రియారూపం; తెలుగు సందర్భంలో కాలక్రమం సహజంగానే స్పష్టమవుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిల్ వాడుకలో స్థిరపడిన దైవనామ రూపం; బిరుదుతో భర్తీ చేయకుండా మూలంలోని వ్యక్తినామాన్ని నిలుపుతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఆ వ్యక్తినామానికి తెలుగులో ప్రామాణికంగా స్థిరపడిన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక పండిత వాడుకలో ‘యాహ్వే’ ఉన్నప్పటికీ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూలోని ఒకే వాక్యాన్ని తెలుగులో సహజమైన స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చినా, అన్ని భావాంశాలు నిలుపబడ్డాయి.
