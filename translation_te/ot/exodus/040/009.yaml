source:
  edition: WLC
  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: te
  text: అప్పుడు నీవు అభిషేక తైలాన్ని[a] తీసుకొని నివాస గుడారానికీ దానిలో ఉన్న సమస్తానికీ అభిషేకం చేయాలి; దానిని, దాని సామగ్రి అంతటినీ పవిత్రపరచాలి; అప్పుడు అది పవిత్రమవుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అభిషేకపు నూనె.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘పవిత్రం’; ‘అతి పవిత్రం’ కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: తర్వాత నీవు ... తీసుకొని
  rationale: సూచనల వరుసలో సంయుక్త పూర్ణక్రియ ఆజ్ఞార్థక భావాన్ని కలిగి ఉంది. ‘తర్వాత’ క్రమాన్ని, ‘తీసుకొని’ తదుపరి చర్యతో సహజ తెలుగు అనుసంధానాన్ని తెలియజేస్తాయి.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఈ నిర్మాణ పదబంధం పవిత్ర సేవ కోసం ఉపయోగించే ప్రత్యేక అభిషేక నూనెను సూచిస్తుంది; ‘అభిషేక తైలం’ ఆధునిక గౌరవప్రదమైన తెలుగులో సహజంగా ఉంది.
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకం చేయాలి
  rationale: ఆరాధనా సందర్భంలో משׁח నూనె పూసి పవిత్ర సేవకు నియమించడాన్ని సూచిస్తుంది. ఈ ఎంపిక ఆజ్ఞార్థక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: అరణ్యంలోని యెహోవా నివాస గుడారాన్ని సూచించే పదం. ‘మందిరం’ సాధారణ పాఠకులకు సహజంగా ఉన్నప్పటికీ, స్థిర ఆలయమనే అర్థం రాకుండా సందర్భమే దాని గుడార స్వభావాన్ని నిర్దేశిస్తుంది.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: దానిలో ఉన్న సమస్తం
  rationale: మందిరంలో ఉన్నవన్నీ సమగ్రంగా చేర్చే మూలభాషా భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: మందిరాన్ని ... ప్రతిష్ఠించాలి
  rationale: Piel రూపంలోని קדשׁ ఇక్కడ పవిత్రమైనదిగా ప్రత్యేకించడం లేదా పవిత్ర సేవకు అంకితం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘ప్రతిష్ఠించాలి’ ఆ ఆరాధనా కార్యాన్ని సహజంగా తెలియజేస్తుంది; సర్వనామ సందిగ్ధత నివారణకు ‘మందిరాన్ని’ పునరుక్తం చేయబడింది.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతటినీ
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, ఇతర వస్తువులను కలుపుకునే విస్తృత పదం. ‘సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: וְהָיָה קֹדֶשׁ
  choice: అప్పుడు అది పవిత్రంగా ఉంటుంది
  rationale: ఫలిత స్థితిని తెలియజేస్తూ, మూలంలోని సాధారణ ‘పవిత్రం’ అనే స్థాయినే ఉంచుతుంది; ‘అతి పవిత్రం’ అనే తీవ్రతను చేర్చదు.
theological_decisions:
- issue: అభిషేకం, ప్రతిష్ఠ అనంతరం మందిరపు ఆరాధనా స్థితి
  choice: మందిరం పవిత్రంగా ఉంటుంది
  alternative: మందిరం అతి పవిత్రంగా ఉంటుంది
  rationale: హీబ్రూ పాఠంలో కేవలం קֹדֶשׁ (‘పవిత్రం’) ఉంది; קֹדֶשׁ קָדָשִׁים (‘అతి పవిత్రం’) లేదు. అందువల్ల సమీప వచనాలు లేదా సంప్రదాయం ఆధారంగా అధిక స్థాయిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా శైలి వాడబడింది. ఆరాధనా ప్రత్యేకతను నిలుపుతూ అతిగా సాంకేతికమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం. మూలంలోని ‘పవిత్రం’ అనే రూపాన్ని తీవ్రత పెంచకుండా అనువదించాం.
