translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ప్రత్యక్ష గుడారం’ అనే స్థిరమైన బైబిల్ పదబంధాన్ని నిలిపి, సామగ్రి స్థానం స్పష్టంగా ఉండేలా పదక్రమం అమర్చబడింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పదబంధం తరువాత కాక వాక్యాంతంలో ఉంది; అది మొత్తం స్థలవివరణను అనవసరంగా సూచించే ప్రమాదం ఉన్నప్పటికీ తెలుగు పఠన ప్రవాహం కోసం ఇలా ఉంచబడింది.
