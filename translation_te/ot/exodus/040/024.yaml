revisions:
- from: అతడు ప్రత్యక్ష గుడారంలో దీపస్తంభాన్ని బల్లకు ఎదురుగా, మందిరపు దక్షిణ వైపున ఉంచాడు.[a]
  to: అతడు ప్రత్యక్ష గుడారంలో దీపస్తంభాన్ని బల్లకు ఎదురుగా[a], నివాస గుడారం దక్షిణ వైపున ఉంచాడు.
