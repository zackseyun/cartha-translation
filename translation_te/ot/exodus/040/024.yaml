id: EXO.40.24
reference: Exodus 40:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם אֶת הַ/מְּנֹרָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד נֹ֖כַח הַ/שֻּׁלְחָ֑ן עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: te
  text: అతడు ప్రత్యక్ష గుడారంలో దీపస్తంభాన్ని బల్లకు ఎదురుగా[a], నివాస గుడారం దక్షిణ వైపున ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బల్లకు ఎదుటగా’ లేదా ‘బల్లకు ముఖంగా’ అని కూడా అనువదించవచ్చు. נֹכַח అనే హీబ్రూ పదం ఏదైనా వస్తువుకు ఎదురుగా లేదా దాని ముందున్న స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂים అనే క్రియ ఇక్కడ వరుస కథనంలోని పూర్తయిన గత చర్యను సూచిస్తుంది. సామగ్రిని నిర్దిష్ట స్థానంలో అమర్చడాన్ని ‘ఉంచాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభాన్ని
  rationale: מְנוֹרָה సాధారణ దీపాన్ని కాక, దీపాలను మోసే ఆరాధనా సామగ్రిని సూచిస్తుంది; అందువల్ల ‘దీపస్తంభం’ స్పష్టమైన తెలుగు అనువాదం.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵד దేవుడు తన ప్రజలను కలుసుకొనే పరిశుద్ధ గుడారానికి స్థిరమైన పేరు. నిర్గమకాండ సందర్భంలో ‘ప్రత్యక్ష గుడారం’ గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదబంధం.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: బల్లకు ఎదురుగా
  rationale: נֹכַח స్థలపరంగా ఎదురుగా, ఎదుట, లేదా ముఖాముఖిగా ఉండడాన్ని సూచించగలదు. ఇక్కడ సామగ్రి పరస్పర స్థానాన్ని ‘బల్లకు ఎదురుగా’ సహజంగా తెలియజేస్తుంది.
- source_word: הַשֻּׁלְחָן
  choice: బల్లకు
  rationale: హీబ్రూ పాఠం కేవలం ‘బల్ల’ అని మాత్రమే చెబుతుంది; సముఖపు రొట్టెల బల్ల అనే సందర్భానుగత వివరణను మూలపాఠంలోకి చేర్చలేదు.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: మందిరపు … వైపున
  rationale: יֶרֶךְ అక్షరార్థంగా పక్క లేదా పార్శ్వాన్ని సూచిస్తుంది. తరువాతి దిశా పదంతో కలిపి ఇది మందిరపు ఒక నిర్దిష్ట వైపున ఉన్న స్థానాన్ని తెలియజేస్తుంది.
- source_word: נֶגְבָּה
  choice: దక్షిణ
  rationale: దిశను సూచించే ఈ రూపం దక్షిణ వైపు లేదా దక్షిణ దిశను తెలుపుతుంది; ‘దక్షిణ వైపున’ ఆధునిక తెలుగులో సహజం.
- source_word: הַמִּשְׁכָּן
  choice: మందిరపు
  rationale: מִשְׁכָּן అక్షరార్థంగా నివాసస్థలంతో సంబంధమున్నప్పటికీ, ఇక్కడ నిర్గమకాండలోని పవిత్ర గుడార నిర్మాణాన్ని సూచిస్తుంది. సమీపంలో ‘ప్రత్యక్ష గుడారం’ ఇప్పటికే ఉన్నందున, పునరుక్తి భారాన్ని తగ్గిస్తూ ‘మందిరం’ ఆ నిర్మాణాన్ని గౌరవప్రదంగా సూచిస్తుంది.
