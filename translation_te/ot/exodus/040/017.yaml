  text: וַ/יְהִ֞י בַּ/חֹ֧דֶשׁ הָ/רִאשׁ֛וֹן בַּ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הוּקַ֖ם הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: te
  text: రెండవ సంవత్సరం మొదటి నెలలో, ఆ నెల మొదటి రోజున[a], నివాస గుడారం నిలబెట్టబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నెలలో ఒకటిన’ అని ఉంటుంది; దాని అర్థం నెల మొదటి రోజు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఏర్పాటు చేయబడింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: హీబ్రూ కథన క్రమాన్ని కొనసాగించే ఈ రూపాన్ని తెలుగులో ‘అప్పుడు జరిగింది’ అని ప్రత్యేకంగా అనువదిస్తే వాక్యం కృత్రిమంగా ఉంటుంది. సహజమైన తెలుగు కాలవాక్య నిర్మాణమే దాని కథన విధిని తెలియజేస్తుంది.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: కాలగణన సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; నిర్దిష్ట ఉపపదంతో కూడిన క్రమసంఖ్యను నేరుగా, సహజంగా అనువదించింది.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: రెండవ సంవత్సరం
  rationale: హీబ్రూ తేదీ సూత్రాన్ని తెలుగులో సహజంగా ‘రెండవ సంవత్సరం మొదటి నెలలో’ అని అమర్చింది.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: ఆ నెల మొదటి రోజున
  rationale: అక్షరార్థంగా ‘నెలలో ఒకటిన’ అనే హీబ్రూ తేదీ నుడికారం నెల మొదటి రోజును సూచిస్తుంది. ‘ఆ నెల’ అనడం తెలుగులో సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: הוּקַם
  choice: నిలబెట్టబడింది
  rationale: קום యొక్క హోఫాల్ రూపం క్రియను చేయించబడిన/నిష్క్రియ భావంలో చూపుతుంది. గుడారాన్ని అమర్చి నిలబెట్టడాన్ని ఈ పదం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: מִשְׁכָּן యొక్క ‘నివాస స్థలం’ భావాన్నీ, నిర్గమకాండంలో వర్ణించిన మోసుకెళ్లగల పవిత్ర గుడారపు స్వరూపాన్నీ ఈ పదబంధం నిలుపుతుంది.
theological_decisions:
- issue: מִשְׁכָּן అనే పవిత్ర స్థలానికి వాడే పదం
  choice: నివాస గుడారం
  alternative: ప్రత్యక్ష గుడారం; మందిరం
  rationale: ‘నివాస గుడారం’ మూలపదంలోని నివాస భావాన్ని, అది శాశ్వత కట్టడం కాక గుడారం అనే సందర్భాన్ని స్పష్టంగా ఉంచుతుంది. ‘ప్రత్యక్ష గుడారం’ వేరొక హీబ్రూ పదబంధంతో గందరగోళం కలిగించవచ్చు; ‘మందిరం’ శాశ్వత భవనాన్ని సూచించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. అక్షరార్థంగా కృత్రిమంగా వినిపించే హీబ్రూ కథనారంభాన్ని తెలుగులో సహజమైన కాలవాక్యంగా మలిచింది; తేదీ క్రమం, నిష్క్రియ క్రియ, గుడారపు స్వరూపం మాత్రం నిలుపబడ్డాయి.
