  source_fidelity: హీబ్రూ מִמֶּנּוּ అంటే ‘దానినుండి/దాని నుండి’ (గంగాళాన్ని సూచిస్తూ). ముసాయిదాలోని ‘దానిలోనుండి నీళ్లు తీసుకొని’ మూలంలో లేని ‘నీళ్లు తీసుకొని’ని చేర్చి, ‘నుండి’ అనే సంబంధాన్ని ‘లోనుండి’గా మార్చింది. మిగిలిన కర్తలు, అహరోను కుమారుల సూచన, చేతులు–కాళ్లు అన్న జత సరిగానే ఉన్నాయి.
  naturalness: ‘దానినుండి తమ చేతులనూ కాళ్లనూ కడుక్కొన్నారు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది. సందర్భంలోని గంగాళం నుండి నీటిని ఉపయోగించడం అర్థమవుతుంది; మూలంలో లేని చర్యను స్పష్టంగా చేర్చనవసరం లేదు.
  terminology: ‘మోషే,’ ‘అహరోను,’ ‘అతని కుమారులు’ అనే పేర్లు, సంబంధసూచన యాజక సందర్భానికి తగినవి. ‘చేతులనూ కాళ్లనూ’ మూలంలోని రెండు ప్రత్యక్ష కర్మలను స్పష్టంగా కాపాడుతుంది.
