  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దానిలోనుండి నీళ్లు తీసుకొని’ అనే రూపం హీబ్రూలోని వనరు భావాన్ని కాపాడుతూ తెలుగులో అసహజతను నివారిస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠంలో ఉంచబడింది.
