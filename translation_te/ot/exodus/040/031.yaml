  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: te
  text: మోషే, అహరోను, అతని కుమారులు దానినుండి తమ చేతులనూ కాళ్లనూ కడుక్కొన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక అనువాదం: ‘దానితో’; హీబ్రూలో అక్షరార్థంగా ‘దానినుండి’ అని ఉంది. ‘దాని’ అనేది గంగాళాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: కడుక్కొన్నారు
  rationale: רחץ అనే క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథన క్రమంలో జరిగిన గత కార్యాన్ని సూచిస్తుంది. తరువాతి వచనం అలవాటుగా జరిగే సందర్భాన్ని వివరిస్తుంది కాబట్టి ఇక్కడ సాధారణ భూతకాలం సహజం.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుండి నీళ్లు తీసుకొని
  rationale: מן ఉపసర్గతో కూడిన తృతీయ పురుష ఏకవచన ప్రత్యయం ముందున్న గంగాళాన్ని సూచిస్తూ అక్షరార్థంగా ‘దానిలోనుండి’ అని చెబుతుంది. తెలుగులో కడుక్కోవడం అనే క్రియతో సహజంగా అనుసంధానించేందుకు సందర్భం స్పష్టంచేసే ‘నీళ్లు తీసుకొని’ చేర్చబడింది; మూలంలోని నీటి వనరు అనే భావం నిలిచింది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: ఈ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: וְאַהֲרֹן
  choice: అహరోను
  rationale: సంయోజక భావాన్ని జాబితా నిర్మాణం ద్వారా సహజ తెలుగులో వ్యక్తం చేస్తూ, పేరుకు స్థిరపడిన తెలుగు రూపాన్ని వాడింది.
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: ప్రత్యయం ఏకవచన పురుషుడిని సూచిస్తుంది; యాజక సందర్భంలో בנים అహరోను కుమారులను సూచిస్తుంది. ‘అతని’ అనేది సమీప నామమైన అహరోనును సహజంగా సూచిస్తుంది.
- source_word: אֶת יְדֵיהֶם
  choice: తమ చేతులను
  rationale: బహువచన స్వామ్యార్థాన్ని తెలుగులో కర్తలనే తిరిగి సూచించే ‘తమ’ ద్వారా సహజంగా వ్యక్తం చేసింది.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: కాళ్లను
  rationale: హీబ్రూ పాఠంలోని చేతులు–కాళ్లు అనే జతను నిలిపింది; సంయోజక భావం తెలుగు జాబితాలో కామా ద్వారా సహజంగా వ్యక్తమైంది.
