  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: te
  text: అప్పుడు మోషే నివాసగుడారానికీ బలిపీఠానికీ చుట్టూ ప్రాంగణాన్ని ఏర్పాటు చేసి, ప్రాంగణ ద్వారానికి తెరను అమర్చాడు.[a] ఈ విధంగా మోషే ఆ పనిని ముగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తెర’కు మూలపదం (מָסַךְ) ప్రవేశద్వారాన్ని కప్పే వస్త్రాన్ని, అంటే వేలాడే అడ్డతెరను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నిలబెట్టి
  rationale: హిఫిల్ రూపం ఇక్కడ ప్రాంగణపు ఆవరణ నిర్మాణాన్ని నిలబెట్టడం లేదా ఏర్పాటు చేయడాన్ని సూచిస్తుంది; ‘నిలబెట్టి’ నిర్మాణ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: הֶחָצֵר
  choice: ప్రాంగణాన్ని
  rationale: మందిరం, బలిపీఠం చుట్టూ ఉన్న ఆవృత బయటి స్థలాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: ప్రాంగణం మందిరాన్నీ బలిపీఠాన్నీ ఆవరించి ఉందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַמִּשְׁכָּן
  choice: మందిరానికి
  rationale: నిర్గమకాండంలోని పవిత్ర గుడారాన్ని సూచించేందుకు తెలుగు బైబిలు వాడుకలో పరిచితమైన పదం; సాధారణ నివాసస్థలం అనే భావానికి పరిమితం కాదు.
- source_word: וְלַמִּזְבֵּחַ
  choice: బలిపీఠానికీ
  rationale: מִזְבֵּחַకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం; మందిరంతో కలిసి ప్రాంగణం ఆవరించిన రెండవ వస్తువుగా అనుసంధానించబడింది.
- source_word: וַיִּתֵּן
  choice: అమర్చాడు
  rationale: అక్షరార్థంగా ‘పెట్టాడు’ అయినా, నిర్మాణ సందర్భంలో ప్రవేశపు వస్త్రతెరను తగిన స్థానంలో ఏర్పాటు చేశాడనే భావాన్ని ‘అమర్చాడు’ సహజంగా అందిస్తుంది.
- source_word: מָסַךְ
  choice: తెరను
  rationale: ప్రవేశాన్ని కప్పే వస్త్రపు తెరను సూచిస్తుంది; లోపలి అడ్డతెరతో పదభేదం తెలుగులో తప్పనిసరిగా స్పష్టంగా నిలవకపోవడం వల్ల ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: שַׁעַר הֶחָצֵר
  choice: ప్రాంగణ ద్వారానికి
  rationale: ప్రాంగణపు ప్రవేశస్థానాన్ని సూచించే సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: וַיְכַל
  choice: ముగించాడు
  rationale: మొత్తం నిర్మాణ కార్యం పూర్తయిందనే కథన ముగింపు భావాన్ని తెలియజేస్తుంది.
- source_word: הַמְּלָאכָה
  choice: ఆ పనిని
  rationale: ఇప్పటివరకు వివరించిన నిర్మాణ కార్యమంతటినీ సమగ్రంగా సూచిస్తుంది.
