  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שֶׂם֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וַ/יִּתֵּ֥ן שָׁ֛מָּ/ה מַ֖יִם לְ/רָחְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/030.yaml
  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: te
  text: అతడు సమావేశపు గుడారానికీ బలిపీఠానికీ మధ్య కడిగే తొట్టిని ఉంచి,[a] కడగడానికి అందులో నీళ్లు పోశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం הַכִּיּוֹר సమావేశపు గుడార సేవలో కడగడానికి ఉపయోగించిన పెద్ద నీటి పాత్రను సూచిస్తుంది. కొన్ని అనువాదాలు దీనిని సంప్రదాయ పదంతో ‘గంగాళం’ అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచి
  rationale: שׂוּם అనే క్రియ ఇక్కడ ఒక వస్తువును నిర్దిష్ట స్థానంలో ఉంచడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉంచి’ సహజంగా ఉంది.
- source_word: הַכִּיֹּר
  choice: కడుగుకునే తొట్టిని
  rationale: כִּיּוֹר ప్రత్యక్ష గుడార సేవలో కడుగుకోవడానికి ఉపయోగించే పెద్ద నీటి పాత్రను సూచిస్తుంది. ‘తొట్టి’ స్పష్టమైన ఆధునిక పదం; దాని ఉపయోగాన్ని ‘కడుగుకునే’ తెలియజేస్తుంది.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: ప్రత్యక్ష గుడారానికి, బలిపీఠానికి మధ్య
  rationale: אֹהֶל מוֹעֵדను సంప్రదాయపరంగా, అర్థవంతంగా ‘ప్రత్యక్ష గుడారం’గా ఇచ్చాం. హెబ్రీలోని בֵּין...וּבֵין నిర్మాణాన్ని సహజ తెలుగు ‘...కి, ...కి మధ్య’గా వ్యక్తం చేశాం.
- source_word: וַיִּתֵּן
  choice: పోశాడు
  rationale: נָתַן ప్రాథమికంగా ‘పెట్టు/ఉంచు’ అయినా, నీటిని ఒక పాత్రలో పెట్టే సందర్భంలో ‘పోశాడు’ సహజ తెలుగు ప్రయోగం.
- source_word: שָׁמָּה
  choice: అక్కడ
  rationale: ఈ స్థానవాచక క్రియావిశేషణానికి నేరమైన సమానం ‘అక్కడ’; ‘దానిలో’ అని మార్చకుండా మూలంలోని స్థల సూచనను నిలిపాం.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: מַיִם సాధారణ నీటిని సూచిస్తుంది; ‘నీళ్లు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన బహువచన రూపం.
- source_word: לְרָחְצָה
  choice: కడుగుకోవడానికి
  rationale: רָחַץ యొక్క ఈ infinitive రూపం కడిగే ఉద్దేశాన్ని తెలుపుతుంది. ఎవరు లేదా ఏమి కడుగుకుంటారో మూలపాఠం ఈ వాక్యంలో స్పష్టంగా చెప్పనందున విషయాన్ని జోడించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రత్యక్ష గుడారం,’ ‘బలిపీఠం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అరుదైన ‘గంగాళం’కు బదులుగా స్పష్టమైన ‘కడుగుకునే తొట్టి’ని ఉపయోగించాం. మూలంలో కడుగుకునే వ్యక్తులు స్పష్టంగా చెప్పబడనందున వారిని పాఠ్యంలో చేర్చలేదు.
