    reason: lexical_alternative
  revision_rationale: The revision renders ‘tent of meeting’ transparently, removes the unwarranted reflexive implication in the washing purpose, and uses contextually natural Telugu for putting water into the basin. The footnote is aligned with the corrected term while retaining the lexical clarification.
