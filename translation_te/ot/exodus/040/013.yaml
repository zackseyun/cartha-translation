source:
  edition: WLC
  text: וְ/הִלְבַּשְׁתָּ֙ אֶֽת אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַ/קֹּ֑דֶשׁ וּ/מָשַׁחְתָּ֥ אֹת֛/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֖/וֹ וְ/כִהֵ֥ן לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: te
  text: అహరోనుకు పవిత్ర వస్త్రాలు తొడిగించు; అతనికి అభిషేకం చేసి అతనిని ప్రతిష్ఠించు. అప్పుడు అతడు నాకు యాజకునిగా సేవ చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నాకు యాజకునిగా పరిచర్య చేస్తాడు.” హీబ్రూ క్రియ యాజక పదవిలో పనిచేయడం లేదా సేవ చేయడం అనే అర్థాన్నిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: తొడిగించి
  rationale: 'לבשׁ హిఫీల్ రూపం ఇక్కడ కారణార్థకమైనది: మోషే అహరోనుకు వస్త్రాలు తొడిగించాలి. ఆధునిక తెలుగులో ‘తొడిగించి’ సహజంగా ఉండి యాజక ప్రతిష్ఠాపన సందర్భాన్నీ స్పష్టంగా తెలియజేస్తుంది.'
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: అక్షరార్థంగా ‘పవిత్రతకు చెందిన వస్త్రాలు.’ ‘పవిత్ర వస్త్రాలు’ సహజమైన తెలుగులో ఆరాధనాపరమైన ప్రత్యేకతను నిలుపుతుంది.
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకం చేసి
  rationale: యాజక నియామక సందర్భంలో משׁח సూచించే ఆచారపూర్వక అభిషేకానికి ఇది స్థిరమైన, స్పష్టమైన తెలుగు పదప్రయోగం.
- source_word: וְקִדַּשְׁתָּ
  choice: ప్రతిష్ఠించాలి
  rationale: קדשׁ పియేల్ ఇక్కడ పవిత్ర సేవ కోసం ప్రత్యేకంగా నియమించడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించాలి’ ఆచారపూర్వక ప్రత్యేక నియామక భావాన్ని తెలియజేస్తుంది; అభిషేకం అనే ముందరి చర్యతో కలిపివేయదు.
- source_word: וְכִהֵן
  choice: యాజకునిగా సేవ చేస్తాడు
  rationale: כהן అంటే యాజక పదవిలో పనిచేయడం లేదా సేవ చేయడం. ఈ ఎంపిక కేవలం ‘యాజకుడవుతాడు’ అనకుండా కార్యనిర్వహణ భావాన్ని కాపాడుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: లామెద్ ఇక్కడ యెహోవాకు అర్పించే సేవను సూచిస్తుంది. ‘నాకు’ వ్యక్తిగత దత్తివును నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యాజక ప్రతిష్ఠాపన చర్యల క్రమం
  choice: వస్త్రాలు తొడిగించడం, అభిషేకం చేయడం, ప్రతిష్ఠించడం అనే చర్యలను వేర్వేరుగా ఉంచడం
  alternative: ఈ చర్యలన్నిటినీ ‘యాజకునిగా నియమించాలి’ వంటి ఒకే పదబంధంలో కలపడం
  rationale: హీబ్రూ పాఠం వరుసగా ఉన్న ప్రత్యేక ఆచారపూర్వక చర్యలను పేర్కొంటుంది. వాటిని విడివిడిగా ఉంచడం వల్ల తరువాతి మతసంస్థల పదజాలాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా మూలంలోని ప్రత్యేకత నిలుస్తుంది.
- issue: וְכִהֵן לִי యొక్క వాక్యబలం
  choice: ‘అప్పుడు అతడు నాకు యాజకునిగా సేవ చేస్తాడు’ అని ఫలితాన్ని సూచించే సమన్వయ వాక్యంగా అనువదించడం
  alternative: ‘అతడు నాకు యాజకునిగా సేవ చేయడానికి’ అని స్పష్టమైన ఉద్దేశార్థక ఉపవాక్యంగా అనువదించడం
  rationale: హీబ్రూలో రెండవ పురుష క్రియల తరువాత మూడవ పురుష క్రియ వస్తుంది; ఇది ముందరి చర్యల ఫలితాన్ని సూచించగలదు, అయితే ‘అందుకోసం’ అనే స్పష్టమైన ఉద్దేశ సూచకం లేదు. ‘అప్పుడు’ సహజమైన తెలుగులో ఫలిత సంబంధాన్ని తెలియజేస్తూ ఉద్దేశార్థాన్ని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆచారపూర్వక చర్యల క్రమం నిలుపబడింది. ‘ప్రతిష్ఠించాలి’ సాధారణ పాఠకునికి అర్థమయ్యే విధంగా పవిత్ర సేవకు ప్రత్యేకంగా నియమించే భావాన్ని అందిస్తుంది. ప్రధాన పాఠ్యంలో [a] సూచిక సంబంధిత పదబంధం తరువాత ఉంచబడింది.
