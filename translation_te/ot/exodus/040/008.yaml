  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: te
  text: ప్రాంగణాన్ని చుట్టూ ఏర్పాటు చేయాలి; ప్రాంగణ ద్వారానికి తెరను అమర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘తెర’కు మరో అనువాదం ‘అడ్డతెర’ (హీబ్రూ: מָסָךְ); ఇది ప్రాంగణ ప్రవేశద్వారం వద్ద వేలాడదీయబడే తెరను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: ఏర్పాటు చేసి
  rationale: שׂים అనే క్రియకు ‘పెట్టు, ఉంచు, ఏర్పాటు చేయు’ అనే విస్తృత భావం ఉంది. ప్రత్యక్ష గుడార నిర్మాణ సందర్భంలో ప్రాంగణాన్ని చుట్టూ నిలబెట్టి అమర్చడాన్ని ‘ఏర్పాటు చేసి’ సహజంగా తెలియజేస్తుంది.
- source_word: הֶחָצֵר
  choice: ప్రాంగణాన్ని
  rationale: חָצֵר ఇక్కడ ప్రత్యక్ష గుడారం చుట్టూ ఉన్న ఆవరణను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రాంగణం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: ఈ క్రియావిశేషణం అన్ని వైపులా ఆవరించే అమరికను సూచిస్తుంది; ‘చుట్టూ’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְנָתַתָּ
  choice: అమర్చాలి
  rationale: נתן సాధారణంగా ‘ఇవ్వు, పెట్టు, ఉంచు’ అని అర్థమవుతుంది. ఇక్కడ ప్రవేశ తెరను దాని స్థానంలో బిగించి పెట్టడం ఉద్దేశం కాబట్టి ‘అమర్చాలి’ సందర్భోచితం.
- source_word: מָסַךְ
  choice: తెరను
  rationale: మָסָךְ ప్రత్యక్ష గుడార సంబంధ సందర్భాల్లో ప్రవేశద్వారం వద్ద వేలాడదీసే తెర లేదా అడ్డతెరను సూచిస్తుంది. ‘తెర’ వస్తువు స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: שַׁעַר
  choice: ద్వారానికి
  rationale: שַׁעַר ప్రాంగణంలోకి ప్రవేశించే ద్వారం లేదా ప్రవేశస్థానాన్ని సూచిస్తుంది. వస్త్రపు తెర ఉన్నప్పటికీ ‘ద్వారం’ మూలపదానికి ప్రత్యక్షమైన తెలుగు సమానం.
- source_word: הֶחָצֵר
  choice: ప్రాంగణ
  rationale: שַׁעַר הֶחָצֵר అనే నిర్మాణాన్ని ‘ప్రాంగణ ద్వారం’గా సహజమైన తెలుగు సంబంధ సమాసంతో అందిస్తుంది.
