revisions:
- from: యెహోవా[a] మోషేకు ఆజ్ఞాపించినట్టుగానే, ఆయన దీపాలను యెహోవా సన్నిధిలో వెలిగించాడు.
  to: యాహ్వే[a] మోషేకు ఆజ్ఞాపించినట్టుగానే, మోషే దీపాలను యాహ్వే సన్నిధిలో వెలిగించాడు.
