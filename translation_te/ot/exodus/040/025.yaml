  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: te
  text: యాహ్వే[a] మోషేకు ఆజ్ఞాపించినట్టుగానే, మోషే దీపాలను యాహ్వే సన్నిధిలో వెలిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘దీపాలను పైకి వెళ్లేలా చేశాడు.’ ఈ సందర్భంలో ఇది దీపాలను వెలిగించడం లేదా వాటిని అమర్చడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెలిగించాడు
  rationale: עלה అనే క్రియ హిఫీల్ రూపంలో అక్షరార్థంగా ‘పైకి లేపాడు/పైకి వెళ్లేలా చేశాడు’ అని అర్థమవుతుంది. అయితే దీపాల సందర్భంలో ఇది దీపాలను వెలిగించి వాటి జ్వాలలు పైకి లేచేలా చేయడాన్ని సూచించే ఆచార సంబంధమైన ప్రయోగం. నిర్గమకాండము 25:37; 30:8 మరియు సమీప సందర్భం (40:24–25) ప్రకారం ‘వెలిగించాడు’ సహజమైన తెలుగు; అయినా మూలంలోని భావవ్యాప్తిని పాదటిప్పణిలో ఉంచాం.
- source_word: הַנֵּרֹת
  choice: దీపాలను
  rationale: נֵרֹת అనేది అమూర్తమైన వెలుగును కాకుండా దీపస్తంభంపై ఉన్న నిర్దిష్ట దీపాలను సూచిస్తుంది. అందువల్ల ‘దీపాలు’ స్పష్టమైన, సందర్భోచితమైన అనువాదం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי అనేది ‘ఎదుట/సన్నిధిలో’ అనే స్థలసంబంధమైన, ఆరాధనా సంబంధమైన భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక గౌరవప్రదమైన తెలుగులో ‘సన్నిధిలో’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టుగానే
  rationale: ఈ సంధిపదం ముందుగా ఇచ్చిన ఆజ్ఞకు కార్యం సరిగ్గా అనుగుణంగా జరిగిందని తెలియజేస్తుంది. ‘ట్టుగానే’ ఆ ఖచ్చిత అనుసరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన హీబ్రూ క్రియ కథనంలోని ఈ చర్యకు ముందుగా ఇచ్చిన ఆజ్ఞను సూచిస్తుంది. తెలుగు సంబంధ కృదంత రూపం కాలక్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూలో మోషే ‘ఆజ్ఞాపించు’ క్రియకు ప్రత్యక్ష కర్మగా ఉన్నా, తెలుగులో ఆజ్ఞ అందుకున్న వ్యక్తిని ‘మోషేకు’ అని చతుర్థీ విభక్తితో చెప్పడం సహజం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ కూడా మూల ఉచ్చారణకు సమీపమైన సాధ్యమైన లిప్యంతరీకరణ.
- issue: וַיַּעַל సూచించే దీపాల కార్యం
  choice: వెలిగించాడు
  alternative: దీపాలను అమర్చాడు / పైకి లేపాడు
  rationale: దీపస్తంభాన్ని ముందరి వచనంలోనే ఉంచిన తరువాత దీపాలపై చేసిన కార్యం, అలాగే దీపాలకు సంబంధించిన ఇతర ఆజ్ఞల సందర్భం, వెలిగించడాన్ని బలంగా సూచిస్తుంది. అయినా క్రియ స్వతహాగా ‘వెలిగించు’ అనే ఏకార్థ పదం కాదు కాబట్టి ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడాం. వాక్యారంభంలోని కర్త మూలపాఠంలో స్పష్టంగా పేరుతో లేకపోయినా సందర్భానుసారం మోషే కాబట్టి ‘ఆయన’గా ఉంచాం. దైవనామానికి ‘యెహోవా’ అనే తెలుగు సంప్రదాయ లిప్యంతరీకరణను ఉపయోగించాం; వַיַּעַל‌లోని నిజమైన పదార్థ అనిశ్చితిని పాదటిప్పణిలో సంరక్షించాం.
