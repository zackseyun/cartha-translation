source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: te
  text: అప్పుడు మేఘం సమాగమ గుడారాన్ని కప్పివేసింది; యహ్వే[a] మహిమ నివాస గుడారాన్ని నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ יהוה (YHWH) అనే దైవనామం ఉంది; సంప్రదాయ అనువాదాల్లో దీనిని సాధారణంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: దైవనామం యొక్క మూలరూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְכַס
  choice: కప్పివేసింది
  rationale: כסה అనే క్రియకు సాధారణ అర్థం ‘కప్పడం.’ మేఘం గుడారాన్ని ఆవరించిన స్పష్టమైన దృశ్యాన్ని ‘కప్పివేసింది’ సహజంగా తెలియజేస్తుంది; וַ కథనాన్ని ముందుకు నడిపించడాన్ని ‘అప్పుడు’ సూచిస్తుంది.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ నామవాచకం నిర్గమకాండ కథనంలో ముందే ప్రస్తావించబడిన ప్రత్యేక మేఘాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో ‘మేఘం’ అనడమే నిర్దిష్టతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: ఈ సమాసపదబంధం నియమితంగా కలుసుకునే స్థలమైన గుడారాన్ని సూచిస్తుంది. ‘సమావేశ గుడారం’ దాని కార్యాన్ని పారదర్శకంగా తెలియజేస్తూ, తరువాతి מִשְׁכָּן పదం నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: כְבוֹד יְהוָה
  choice: యహ్వే మహిమ
  rationale: כָּבוֹד ఇక్కడ దేవుని ప్రత్యక్షమైన మహిమామయ సన్నిధిని సూచిస్తుంది. ‘యహ్వే మహిమ’ తెలుగు భాషలో సహజమైన స్వామ్య నిర్మాణం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ పాఠంలో బిరుదు కాకుండా దైవనామమైన יהוה నేరుగా ఉంది. దాన్ని ‘యహ్వే’గా లిప్యంతరీకరించడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: מָלֵא
  choice: నింపింది
  rationale: מלא ఇక్కడ యహ్వే మహిమ నివాస మందిరమంతటిని ఆక్రమించిందని తెలిపే సకర్మక క్రియ. ‘నింపింది’ స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: הַמִּשְׁכָּן
  choice: నివాస మందిరం
  rationale: מִשְׁכָּן మూలార్థమైన ‘నివాసం’ను, నిర్గమకాండలోని ప్రత్యేక పవిత్ర నిర్మాణాన్ని రెండింటినీ ‘నివాస మందిరం’ తెలియజేస్తుంది; ‘సమావేశ గుడారం’తో ఉన్న పదభేదాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా, ఇశ్రాయేలుకు వెల్లడైన నిబంధన నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని אֹהֶל מוֹעֵד మరియు מִשְׁכָּן అనే రెండు వేరు పదాలను వరుసగా ‘సమావేశ గుడారం,’ ‘నివాస మందిరం’గా భేదించారు. సెమీకోలన్ హీబ్రూ వాక్యంలోని సమాంతర చర్యలను స్పష్టంగా కలుపుతుంది.
