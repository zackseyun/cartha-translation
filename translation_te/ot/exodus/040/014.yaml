  edition: WLC
  text: וְ/אֶת בָּנָ֖י/ו תַּקְרִ֑יב וְ/הִלְבַּשְׁתָּ֥ אֹתָ֖/ם כֻּתֳּנֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/014.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: te
  text: అతని కుమారులను దగ్గరకు తీసుకువచ్చి[a], వారికి అంగీలు తొడిగించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని కుమారులను సమర్పించి,” లేదా “అతని కుమారులను ముందుకు తీసుకువచ్చి.” ఇక్కడి హిబ్రూ క్రియకు పవిత్ర సేవ కోసం ఒకరిని ఆచారపూర్వకంగా దగ్గరకు తీసుకురావడం అనే భావం తరచుగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנָיו
  choice: అతని కుమారులను
  rationale: בָּנָיו ఇక్కడ అహరోను యొక్క మగ సంతానాన్ని సూచిస్తుంది; యాజక సందర్భానికి ‘కుమారులు’ ఖచ్చితంగా సరిపోతుంది. וְ మరియు ప్రత్యక్ష కర్మ సూచికను తెలుగులో వాక్య అనుసంధానం, కర్మ విభక్తి ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: תַּקְרִיב
  choice: దగ్గరకు తీసుకువచ్చి
  rationale: קרב హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం’ లేదా ఆరాధనా సేవ కోసం ‘సమర్పించడం’ అనే భావం కలిగి ఉంటుంది. ప్రధాన పాఠం మూలంలోని స్థలార్థాన్ని నిలుపుతుంది; ఆచార సంబంధమైన భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: వారికి ... తొడిగించాలి
  rationale: హిబ్రూ క్రియలోని ‘ధరించేలా చేయడం’ అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తొడిగించాలి’ వ్యక్తం చేస్తుంది.
- source_word: כֻּתֳּנֹת
  choice: అంగీలు
  rationale: ఈ పదం శరీరంపై ధరించే పొడవైన అంతర్వస్త్రసదృశ దుస్తులను సూచిస్తుంది. ‘అంగీలు’ సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన పదం; మూలంలో లేని ‘నార’ అనే వివరాన్ని చేర్చదు.
theological_decisions:
- issue: קרב క్రియలోని యాజకసేవ/ఆచార సంబంధమైన భావం
  choice: దగ్గరకు తీసుకువచ్చి
  alternative: వారిని సమర్పించి; వారిని ముందుకు తీసుకువచ్చి
  rationale: ప్రధాన పాఠంలో హిబ్రూ క్రియ యొక్క ప్రాథమిక ‘దగ్గరకు తీసుకురా’ భావాన్ని ఉంచి, యాజక ప్రతిష్ఠాపన సందర్భంలో దానికి ఉండగల అధికారిక ఆచార భావాన్ని పాదసూచికలో నిలిపాం. దీనివల్ల భావాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అదే సమయంలో యాజక ప్రతిష్ఠాపన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. ఆజ్ఞారూపాన్ని తెలుగులో సహజమైన ‘చేయాలి’ రూపంతో వ్యక్తం చేశాం.
