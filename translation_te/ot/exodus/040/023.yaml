  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: te
  text: అతడు దానిమీద యెహోవా సన్నిధిలో రొట్టెలను క్రమంగా అమర్చాడు[a], యెహోవా మోషేకు ఆజ్ఞాపించినట్టుగానే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రొట్టెల అమరికను”; సంప్రదాయంగా, “సన్నిధి రొట్టెలను.”
    reason: עֵרֶךְ לֶחֶם అనే పదబంధానికి ఉన్న నిర్మాణాత్మక అర్థాన్ని, అలాగే సంప్రదాయ ఆరాధనాసంబంధ పేరును తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: అమర్చాడు
  rationale: ערך అనే క్రియకు ‘క్రమపరచడం, వరుసగా అమర్చడం’ అనే భావం ఉంది. ఆరాధనాసంబంధ సందర్భంలో రొట్టెలను బల్లమీద నిర్దేశిత క్రమంలో ఉంచడాన్ని ‘అమర్చాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: ఈ సర్వనామం ముందరి వచనంలోని బల్లను సూచిస్తుంది; ‘దానిమీద’ స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֵרֶךְ לֶחֶם
  choice: రొట్టెలను క్రమంగా
  rationale: ఈ పదబంధం అక్షరార్థంగా క్రమపరచబడిన రొట్టెల అమరికను సూచిస్తుంది. ‘రొట్టెలను క్రమంగా’ అనే ప్రయోగం ఆ అమరికను స్పష్టంగా తెలుపుతూ, మూలంలో లేని సాంకేతిక నామాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లִפְנֵי అనే ఆరాధనాసంబంధ ప్రయోగం ‘ఎదుట’ లేదా ‘సన్నిధిలో’ అని అర్థమవుతుంది. తెలుగులో ‘సన్నిధిలో’ సహజంగా ఉండి దేవుని ఎదుట ఉంచిన భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టుగానే అతడు చేశాడు
  rationale: ఈ వాక్యభాగం దైవాజ్ఞకు మోషే సరిగ్గా అనుగుణంగా నడుచుకున్నాడని సూచిస్తుంది. తెలుగులో కర్త, కార్యసంపూర్ణత స్పష్టంగా ఉండేందుకు ‘అతడు చేశాడు’ అని సహజంగా పూరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలిపి, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: עֵרֶךְ לֶחֶם యొక్క ఆరాధనాసంబంధ భావం
  choice: రొట్టెలను క్రమంగా
  alternative: రొట్టెల అమరిక; సన్నిధి రొట్టెలు
  rationale: ఈ వచనంలోని పదబంధం నిర్దిష్టంగా ‘సన్నిధి రొట్టెలు’ అనే సాంకేతిక పదబంధం לֶחֶם הַפָּנִים కాదు. అందువల్ల విస్తృత ఆచార నేపథ్యాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా, ఇక్కడి వివరణాత్మక భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘క్రమంగా ... అమర్చాడు’ ద్వారా మూలంలోని ఒకే ధాతువుతో సంబంధమున్న నామ-క్రియా బలాన్ని అతిగా కఠినంగా కాకుండా ప్రతిబింబించాం. [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
