source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: te
  text: ఎందుకంటే యాహ్వే మేఘం పగటివేళ నివాస గుడారం మీద ఉండేది; రాత్రివేళ దానిలో[a] అగ్ని ఉండేది. ఇశ్రాయేలు ఇంటివారందరూ చూస్తుండగా, వారి ప్రయాణాలన్నిటిలోనూ ఇది అలాగే ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిమీద.” ఇక్కడ “దాని” అనేది మేఘాన్ని గానీ నివాస గుడారాన్ని గానీ సూచించవచ్చు.
    reason: మూలంలోని בּוֹ అనే పదానికి ‘దానిలో/దానిమీద’ అనే స్థలసంబంధ అర్థాలు సాధ్యమే; దాని పూర్వపద సూచన కూడా పూర్తిగా నిశ్చితం కాదు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వృత్తాంతానికి వివరణాత్మక సారాంశాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో కారణసూచక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עֲנַן יְהוָה
  choice: యాహ్వే మేఘం
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ఆ మేఘానికి యాహ్వేతో ఉన్న ప్రత్యేక సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: మూలపదంలోని ‘నివాస స్థలం’ భావాన్నీ, అరణ్య ప్రయాణంలో దాని మోసుకెళ్లగల గుడార స్వరూపాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: לַיְלָה అనే ‘రాత్రివేళ’తో ఉన్న కాలసంబంధ సమాంతరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: రాత్రివేళ దానిలో అగ్ని ఉండేది
  rationale: పునరావృతంగా కొనసాగిన పరిస్థితిని తెలుగు భూతకాల అలవాటు రూపంతో వ్యక్తం చేస్తుంది; בּוֹలోని స్థలసంబంధ భావాన్ని ప్రధాన పాఠ్యంలో ‘దానిలో’గా ఉంచి, దాని సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
- source_word: לְעֵינֵי כָל בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారందరి కళ్లముందు
  rationale: ‘కళ్లముందు’ అనే హీబ్రూ దృశ్యరూపకాన్ని సహజంగా నిలుపుతూ, ‘ఇశ్రాయేలు ఇల్లు’ అనే సమష్టి భావాన్ని ‘ఇంటివారందరు’గా అర్థవంతంగా అందిస్తుంది.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: వారి ప్రయాణాలన్నిటిలోనూ
  rationale: ప్రజల అరణ్య ప్రయాణమంతటా, దాని వివిధ మజిలీలు లేదా దశల్లో ఈ పరిస్థితి కొనసాగిందనే విస్తృత భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా ఉంచాం.
- issue: రాత్రి అగ్ని ఎక్కడ ఉందనే సూచన
  choice: దానిలో
  alternative: దానిమీద
  rationale: בּוֹ అనే రూపం ‘దానిలో’ లేదా సందర్భానుసారంగా ‘దానిమీద’ అని అర్థమవవచ్చు; అంతేకాక అది మేఘాన్ని గానీ నివాస గుడారాన్ని గానీ సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యం ఒక సాధ్యమైన పఠనాన్ని ఇస్తూ, పాదసూచిక మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘నివాస గుడారం’ అనే పదబంధం స్థిర కట్టడం అనే అపోహను నివారించి, מִשְׁכָּן యొక్క నివాసస్థల భావాన్ని నిలుపుతుంది. వాక్యక్రమాన్ని తెలుగుకు సహజంగా మార్చినా, దర్శనీయత, పగలు–రాత్రి సమాంతరత, ప్రయాణమంతటా కొనసాగిన ఉనికి అన్న అంశాలన్నీ కాపాడబడ్డాయి.
