  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: te
  text: దహనబలి బలిపీఠాన్ని నివాస గుడారం, అంటే సమావేశ గుడారం, ప్రవేశద్వారం ఎదుట ఉంచాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: נתן అనే క్రియకు ‘పెట్టు/ఉంచు/నిలుపు’ అనే విస్తృత అర్థాలున్నాయి. గుడారపు సామగ్రిని నిర్దిష్ట స్థానంలో అమర్చే ఈ సందర్భంలో ‘ఉంచాలి’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి అర్పించే బలిపీఠం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచిస్తుంది. ‘దహనబలి అర్పించే బలిపీఠం’ అనే ప్రయోగం హెబ్రీ నిర్మాణంలోని సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఇక్కడ לִפְנֵי స్థలసంబంధంగా ‘ముందు/ఎదుట’ అని అర్థం. ‘ఎదుట’ సంక్షిప్తంగా, గౌరవప్రదమైన శైలిలో ఉంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: פֶּתַח ప్రవేశించే తెరువు లేదా ద్వారస్థానాన్ని సూచిస్తుంది. ‘ప్రవేశద్వారం’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: מִשְׁכַּן
  choice: మందిరం
  rationale: מִשְׁכָּן మూలంగా ‘నివాసస్థలం’ అని, నిర్గమకాండంలో పవిత్ర గుడార నిర్మాణాన్ని సూచించే సాంకేతిక పదంగా వాడబడింది. ‘మందిరం’ ఇక్కడ ఆ పవిత్ర నివాస నిర్మాణాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: ఈ స్థిరపదబంధం దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో గుర్తింపుపొందిన ‘ప్రత్యక్షపు గుడారం’ అనే పదబంధాన్ని నిలుపుకుంది.
theological_decisions:
- issue: מִשְׁכַּן אֹהֶל מוֹעֵד పదబంధంలోని సంబంధం
  choice: ప్రత్యక్షపు గుడారమైన మందిరం
  alternative: మందిరపు ప్రవేశద్వారం ఎదుట, అంటే ప్రత్యక్షపు గుడారం ఎదుట
  rationale: అసిండెటిక్ హెబ్రీ పదబంధంలో אֹהֶל מוֹעֵד అనేది מִשְׁכַּן‌కు వివరణాత్మక సమానార్థక నిర్దేశంగా చదవడం సహజం. ‘అయిన’ ద్వారా రెండు వేర్వేరు నిర్మాణాలుగా కాక ఒకే పవిత్ర గుడారానికి రెండు నిర్దేశాలుగా చూపబడింది.
translation_notes:
  register: ఆజ్ఞారూప హెబ్రీ వాక్యాన్ని తెలుగులో సహజమైన విధినిర్దేశక ‘ఉంచాలి’తో అందించాం. భాష ఆధునికం, స్పష్టం, గౌరవప్రదం; అనవసరమైన ప్రాచీన లేదా శాఖాపర పదజాలాన్ని నివారించాం.
