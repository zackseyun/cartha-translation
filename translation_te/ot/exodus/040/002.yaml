id: EXO.40.2
reference: Exodus 40:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/יוֹם הַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ תָּקִ֕ים אֶת מִשְׁכַּ֖ן אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: te
  text: మొదటి నెల మొదటి రోజున నీవు సమాగమ గుడారమైన నివాస గుడారాన్ని నిలబెట్టాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם
  choice: రోజున
  rationale: בְּ తో కూడిన יוֹם ఇక్కడ కాలాన్ని సూచిస్తుంది. తేదీని తెలుగులో సహజంగా తెలిపే రూపం ‘రోజున’.
- source_word: הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: మొదటి నెల
  rationale: ఈ పంచాంగ సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; הָרִאשׁוֹן దాని క్రమాన్ని ‘మొదటి’ అని సూచిస్తుంది.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: మొదటి రోజున
  rationale: అక్షరార్థంగా ‘నెలలో ఒకటవ రోజున’ అనే హెబ్రీ తేదీ సూత్రం; ఆధునిక తెలుగులో దాని సహజ భావం ‘మొదటి రోజున’.
- source_word: תָּקִים
  choice: నిలబెట్టాలి
  rationale: קום ధాతువు హిఫీల్ రూపంలో ‘నిలిచేలా చేయడం’, అంటే ఒక నిర్మాణాన్ని నెలకొల్పడం లేదా నిలబెట్టడం. ఆజ్ఞాత్మక భావాన్ని ‘నీవు … నిలబెట్టాలి’ సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁכַּן
  choice: నివాస గుడారం
  rationale: מִשְׁכָּן ప్రాథమికంగా ‘నివాస స్థలం’ అని అర్థమై, నిర్గమకాండంలో మోసుకువెళ్లగల పవిత్ర గుడార నిర్మాణాన్ని సూచిస్తుంది. ‘నివాస గుడారం’ మూలార్థాన్నీ సందర్భాన్నీ నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమాగమ గుడారం
  rationale: ఈ స్థిరమైన పవిత్రస్థల పదబంధం కలుసుకోవడానికి నిర్ణయించబడిన గుడారాన్ని సూచిస్తుంది. ‘సమాగమ గుడారం’ సంక్షిప్తంగా, గుర్తించదగిన విధంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: מִשְׁכַּן మరియు אֹהֶל מוֹעֵד మధ్య సంబంధం
  choice: 'రెండవ పదబంధాన్ని మొదటిదానికి వివరణగా తీసుకొని: ‘నివాస గుడారాన్ని, అంటే సమాగమ గుడారాన్ని’'
  alternative: 'మరింత బిగువైన సంబంధంగా: ‘సమాగమ గుడారపు నివాస మందిరాన్ని’'
  rationale: హెబ్రీలో ఈ రెండు పవిత్రస్థల పేర్లు స్పష్టమైన సంబంధ సూచక పదం లేకుండా పక్కపక్కనే ఉన్నాయి. సందర్భంలో అవి వేర్వేరు రెండు వస్తువులను కాక ఒకే పవిత్ర నిర్మాణాన్ని రెండు కోణాల్లో సూచిస్తున్నందున ప్రధాన పాఠ్యంలో వివరణాత్మక సంబంధాన్ని ఉంచి, బిగువైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన తేదీ నిర్మాణాన్ని, గౌరవప్రదమైన ఆజ్ఞాత్మక శైలిని వాడాం. అరుదైన లేదా పాతకాలపు పదజాలాన్ని నివారిస్తూ, పవిత్రస్థలానికి సంబంధించిన రెండు హెబ్రీ పేర్ల ప్రత్యేక భావాలను ‘నివాస గుడారం’ మరియు ‘సమాగమ గుడారం’గా నిలిపాం.
