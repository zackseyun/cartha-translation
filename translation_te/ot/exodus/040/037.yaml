translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పైకి లేవడం’ అనే పదబంధం మేఘం కదలికను స్పష్టంగా ఉంచుతుంది; ‘బయలుదేరేవారు కాదు’ సందర్భంలోని పునరావృత విధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
