  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: te
  text: అయితే మేఘం పైకి లేవకపోతే, అది పైకి లేచే రోజు వరకు వారు బయలుదేరేవారు కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: అయితే … కాకపోతే
  rationale: ముందటి వచనంలోని పరిస్థితికి భిన్నమైన షరతును ఇది పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘అయితే … కాకపోతే’ ఆ వ్యతిరేక-షరతు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֵעָלֶה
  choice: పైకి లేవడం
  rationale: עלה అనే క్రియ మేఘం మందిరం పైనుండి పైకి కదలడాన్ని సూచిస్తుంది. ‘పైకి లేవడం’ సహజంగా ఉండి, మూలంలో తప్పనిసరిగా లేని కర్మణి భావాన్ని చేర్చదు.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: సందర్భంలో ఇప్పటికే ప్రస్తావించబడిన దైవసన్నిధి మేఘాన్ని సూచించే నిర్దిష్ట నామవాచకానికి నేరమైన అనువాదం.
- source_word: יִסְעוּ
  choice: బయలుదేరేవారు
  rationale: נסע శిబిర ప్రయాణ సందర్భంలో ఒక స్థలం నుంచి ప్రయాణానికి బయలుదేరడాన్ని సూచిస్తుంది. సందర్భంలోని పునరావృత గత చర్యను తెలుగులో ‘బయలుదేరేవారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד יוֹם
  choice: రోజు వరకు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘రోజు’ అనే కాలపదాన్ని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: הֵעָלֹתוֹ
  choice: అది పైకి లేచే
  rationale: עלה క్రియకు చెందిన infinitive construct మరియు తృతీయ పురుష ఏకవచన ప్రత్యయం కలిసిన రూపం; అక్షరార్థంగా ‘దాని పైకి లేవడం.’ సహజమైన తెలుగులో మేఘాన్ని సూచించే పరిమిత క్రియావాక్యంగా అనువదించబడింది.
