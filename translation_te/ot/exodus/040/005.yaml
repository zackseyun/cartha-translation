id: EXO.40.5
reference: Exodus 40:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: te
  text: ధూపం కోసం ఉన్న బంగారు బలిపీఠాన్ని సాక్ష్యపు మందసం[a] ఎదుట ఉంచాలి; ప్రత్యక్షపు గుడారపు ప్రవేశద్వారానికి తెరను అమర్చాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా దీనిని ‘నిబంధన మందసం’ అని కూడా అంటారు; హీబ్రూ మూలంలో అక్షరార్థంగా ‘సాక్ష్యపు మందసం’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: ఉంచాలి
  rationale: נתן ఇక్కడ పవిత్ర సామగ్రిని నిర్దిష్ట స్థానంలో పెట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉంచాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠం
  rationale: హీబ్రూ పదబంధం బంగారంతో చేసిన బలిపీఠాన్ని సూచిస్తుంది; ‘బంగారు బలిపీఠం’ సహజమైన తెలుగు రూపం.
- source_word: לִקְטֹרֶת
  choice: ధూపం వేయడానికి ఉద్దేశించిన
  rationale: ל ఉపసర్గ ఇక్కడ ఉద్దేశం లేదా విధిని తెలుపుతుంది. ఈ అనువాదం దానిని స్పష్టంగా ఉంచి, ‘ధూప బలిపీఠం’ అనే సంప్రదాయ సంక్షిప్త రూపంలో ఆ భావం మరుగుపడకుండా చేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: లిఖితంలోని ప్రాదేశిక భావమైన ‘ముందు/ఎదుట’ను గౌరవప్రదమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲרוֹן הָעֵדֻת
  choice: సాక్ష్యపు మందసం
  rationale: עֵדֻת అంటే ఇక్కడ ‘సాక్ష్యం’; ‘నిబంధన మందసం’ అనే పరిచితమైన పేరును మూలంలో లేనిచోట చేర్చకుండా, అసలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: וְשַׂמְתָּ
  choice: అమర్చాలి
  rationale: שׂים ఇక్కడ తెరను తగిన స్థానంలో ఏర్పాటు చేయడాన్ని సూచిస్తుంది; ‘అమర్చాలి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מָסַךְ
  choice: తెర
  rationale: ప్రవేశం వద్ద వేలాడదీసే ఆవరణను సూచించే מָסַךְకు ‘తెర’ సాధారణ పాఠకులకు స్పష్టమైన, సందర్భోచితమైన పదం.
- source_word: הַפֶּתַח
  choice: ప్రవేశద్వారం
  rationale: פֶּתַח యొక్క ప్రవేశం లేదా ద్వారపు తెరువు అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַמִּשְׁכָּן
  choice: ప్రత్యక్ష గుడారపు
  rationale: מִשְׁכָּןకు తెలుగు బైబిలు పరిభాషలో స్థిరపడిన ‘ప్రత్యక్ష గుడారం’ను ఉపయోగిస్తూ, తెర ఏ ప్రవేశానికి సంబంధించినదో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మందసం పేరులో עֵדֻת అనువాదం
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన మందసం
  rationale: హీబ్రూ వచనంలో עֵדֻת (‘సాక్ష్యం’) ఉంది, בְּרִית (‘నిబంధన’) లేదు. కాబట్టి పరిచితమైన సంప్రదాయ పేరుకన్నా మూలంలోని నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. ఆరాధనా సామగ్రికి పరిచితమైన ‘బలిపీఠం’, ‘మందసం’, ‘ప్రత్యక్ష గుడారం’ వంటి పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
