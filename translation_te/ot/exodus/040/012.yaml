  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֤ אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֔י/ו אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: te
  text: తర్వాత అహరోనును, అతని కుమారులను సమాగమపు గుడారం ప్రవేశద్వారం దగ్గరికి తీసుకువచ్చి, వారిని నీటితో కడుగు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: దగ్గరికి తీసుకువచ్చి
  rationale: హిఫిల్ రూపంలోని ‘దగ్గరికి రప్పించడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఆచార సంబంధ సందర్భానికీ సరిపోతుంది.
- source_word: אַהֲרֹן
  choice: అహరోనును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి నామరూపాన్ని, వాక్యంలోని కర్మవిభక్తితో ఉపయోగించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులను
  rationale: హీబ్రూ పదం ఇక్కడ పురుష సంతానాన్ని సూచిస్తుంది; యాజక నియామక సందర్భంలో ‘కుమారులు’ ఖచ్చితమైనది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: గుడారంలోకి ప్రవేశించే స్థలాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే పవిత్ర గుడారాన్ని సూచించే పదబంధానికి తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన, గౌరవప్రదమైన రూపం.
- source_word: וְרָחַצְתָּ
  choice: కడుగు
  rationale: רחץ యొక్క సాధారణ ‘కడుగు’ భావాన్ని నిలుపుతుంది; స్నానం చేయించడం వంటి మరింత నిర్దిష్టమైన విధానాన్ని పాఠ్యంలోకి చేర్చదు.
- source_word: אֹתָם
  choice: వారిని
  rationale: అహరోను మరియు అతని కుమారులందరినీ కలిపి సూచిస్తుంది.
- source_word: בַּמָּיִם
  choice: నీళ్లతో
  rationale: ב ఉపసర్గకు ఇక్కడ సాధనార్థక భావం ఉంది; కడగడానికి ఉపయోగించే సాధనంగా నీటిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
