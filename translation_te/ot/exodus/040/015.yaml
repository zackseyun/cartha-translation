- from: వారి తండ్రిని నీవు అభిషేకించినట్లే వారినీ అభిషేకించాలి; అప్పుడు వారు నాకు యాజకులుగా సేవచేస్తారు. వారి అభిషేకం తరతరాలుగా వారికి శాశ్వత యాజకత్వంగా[a] ఉంటుంది.
  to: వారి తండ్రిని నీవు అభిషేకించినట్లే వారినీ అభిషేకించాలి; అప్పుడు వారు నాకు యాజకులుగా సేవ చేస్తారు. వారి అభిషేకం వారికి తరతరాలపాటు శాశ్వత యాజకత్వం కోసం[a] ఉంటుంది.
