source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: te
  text: వారి తండ్రిని నీవు అభిషేకించినట్లే వారినీ అభిషేకించాలి; అప్పుడు వారు నాకు యాజకులుగా సేవ చేస్తారు. వారి అభిషేకం వారికి తరతరాలపాటు శాశ్వత యాజకత్వం కోసం[a] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరంతర యాజకత్వం కోసం.” ఇక్కడి హెబ్రీ పదం నిబంధన సందర్భంలో తరతరాలుగా కొనసాగే స్థితిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: వారినీ అభిషేకించాలి
  rationale: నిర్దేశాల పరంపరలో సంయోజకంతో వచ్చిన సంపూర్ణ క్రియ ఆజ్ఞాత్మక భావాన్ని కలిగి ఉంది. ‘అభిషేకించాలి’ ఆధునిక తెలుగులో ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది; ‘వారినీ’ ముందున్న వారి తండ్రితో పోలికను స్పష్టం చేస్తుంది.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: వారి తండ్రిని నీవు అభిషేకించినట్లే
  rationale: כַּאֲשֶׁר తెలిపే సమాన పోలికను ‘అభిషేకించినట్లే’ నిలుపుతుంది. ‘వారి తండ్రి’ అనేది అహరోనును సూచించే ఏకవచన ప్రయోగం.
- source_word: וְכִהֲנוּ לִי
  choice: అప్పుడు వారు నాకు యాజకులుగా సేవచేస్తారు
  rationale: כהן క్రియ యాజకునిగా విధులు నిర్వర్తించడాన్ని సూచిస్తుంది. ‘యాజకులుగా సేవచేస్తారు’ ఆ కార్యభావాన్ని స్పష్టంగా ఉంచుతుంది; ‘నాకు’ సేవ యెహోవాకు చెందుతుందని నిలుపుతుంది. సంయోజక ఫలిత సంబంధాన్ని ‘అప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָשְׁחָתָם
  choice: వారి అభిషేకం
  rationale: ఇక్కడ నామవాచకం అభిషేక క్రియను లేదా దాని ద్వారా కలిగే ప్రతిష్ఠాపనను సూచిస్తుంది; అభిషేక తైలమని స్పష్టంగా చెప్పదు. అందువల్ల ‘వారి అభిషేకం’ మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: శాశ్వత యాజకత్వంగా
  rationale: כְּהֻנָּה అంటే ‘యాజకత్వం’; עוֹלָם దీర్ఘకాలికంగా, నిరంతరంగా కొనసాగే స్థితిని సూచిస్తుంది. ‘శాశ్వత’ బలమైన సహజ సమానార్థకం; సందర్భపరమైన వ్యవధిని పాదటిప్పణి వివరిస్తుంది.
- source_word: לְדֹרֹתָם
  choice: తరతరాలుగా
  rationale: అహరోను సంతానం యొక్క వరుస తరాలన్నిటిలో కొనసాగింపును సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యాజక నిబంధన భాషలో עוֹלָם సూచించే వ్యవధి
  choice: శాశ్వత యాజకత్వం
  alternative: నిరంతర యాజకత్వం
  rationale: עוֹלָם అనే పదం ఈ నిబంధన సందర్భంలో తరతరాలుగా నిలిచే కొనసాగింపును సూచించగలదు; అది తప్పనిసరిగా సందర్భానికి అతీతమైన తాత్త్విక అనంతత్వ ప్రకటన కాదు. ప్రధాన పాఠంలో బలమైన సహజ పదమైన ‘శాశ్వత’ను ఉంచి, సాధ్యమైన సందర్భపరమైన భావాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘అభిషేకం,’ ‘యాజకత్వం’ వంటి స్థిరమైన ఆరాధనా పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. పాదటిప్పణి గుర్తు సంబంధిత ‘శాశ్వత యాజకత్వంగా’ పదబంధం వద్ద ఉంచబడింది.
