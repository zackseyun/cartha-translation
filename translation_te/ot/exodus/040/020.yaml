source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: te
  text: తరువాత అతడు సాక్ష్యాన్ని తీసుకొని మందసంలో ఉంచాడు[a]. మోయడానికి ఉపయోగించే కర్రలను మందసానికి అమర్చాడు. ప్రాయశ్చిత్త మూతను[b] మందసం పైన ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సాక్ష్యపు పలకలను.’ హీబ్రూలో ‘సాక్ష్యం’ అనేది ఇక్కడ మందసంలో ఉంచిన దానికి వాడిన ప్రత్యేక పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కరుణాపీఠాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: సాక్ష్యం
  rationale: ఇది మందసంలో ఉంచిన నిబంధన సంబంధమైన సాక్ష్యానికి వాడే ప్రత్యేక పదం. సందర్భంలో రాతి పలకలను సూచించినా, మూలపాఠం వాటిని నేరుగా పేర్కొనదు; అందువల్ల ఆ ఉద్దేశపూర్వక సాధారణతను నిలిపాం.
- source_word: הָאָרֹן
  choice: మందసం
  rationale: אָרוֹן ప్రాథమికంగా పెట్టెను సూచిస్తుంది; ఇక్కడ అది పరిశుద్ధ మందసం. ఈ వచనంలో లేని ‘నిబంధన’ అనే విశేషణాన్ని చేర్చకుండా, తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘మందసం’ ఎంచుకున్నాం.
- source_word: הַבַּדִּים
  choice: మోయడానికి ఉపయోగించే కర్రలు
  rationale: ఇవి మందసాన్ని మోయడానికి అమర్చిన కర్రలు. కేవలం ‘కర్రలు’ కంటే వాటి ఉపయోగాన్ని స్పష్టంగా తెలిపే సహజమైన ఆధునిక రూపం ఇది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసం పైన ఉండే ప్రత్యేకమైన బంగారు మూత; ప్రాయశ్చిత్త ఆచారంతో దానికి ఉన్న సంబంధాన్ని కూడా ఈ పదబంధం తెలియజేస్తుంది. కేవలం ‘మూత’ అని అనడం దాని ఆరాధనా ప్రాముఖ్యతను తగ్గిస్తుంది.
- source_word: מִלְמָעְלָה
  choice: పైన
  rationale: ఈ సందర్భంలో మందసం పైభాగంలో మూతను ఉంచడాన్ని సూచిస్తుంది; ‘పైన’ సహజంగా, సంక్షిప్తంగా మూలార్థాన్ని అందిస్తుంది.
- source_word: וַיִּתֵּן ... אֶל
  choice: తీసుకొని ... లో ఉంచాడు
  rationale: భౌతిక వస్తువును మందసం లోపల పెట్టిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּשֶׂם ... עַל
  choice: '...కు అమర్చాడు'
  rationale: మోయు కర్రలను మందసంపై లేదా దాని పక్కన వాటి నియమిత స్థానంలో పెట్టడాన్ని ‘అమర్చాడు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘సాక్ష్యం’ దేనిని సూచిస్తుంది?
  choice: మందసంలో ఉంచిన నిబంధన సంబంధమైన సాక్ష్యానికి చెందిన ప్రత్యేక నామంగా అనువదించడం; అది రాతి పలకలను సూచించినా వాటిని ప్రధాన పాఠంలో నేరుగా పేర్కొనకపోవడం.
  alternative: ‘సాక్ష్యపు పలకలు’ లేదా ‘నిబంధన పలకలు’ అని స్పష్టీకరించడం.
  rationale: ఇక్కడ భౌతిక వస్తువును మందసంలో ఉంచుతున్నందున సూచితం నిర్దిష్టమైనదే; అయినా హీబ్రూ మూలం పలకలు అని కాక עֵדוּת అనే సాంకేతిక పదాన్నే వాడుతుంది. అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: כַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం; మూత
  rationale: ఈ పదం మందసం పైనున్న నిర్దిష్ట ఆరాధనా వస్తువును సూచిస్తుంది. ‘ప్రాయశ్చిత్త మూత’ దాని భౌతిక రూపాన్నీ ఆచార ప్రాముఖ్యతనూ కలిపి తెలియజేస్తుంది; ‘కరుణాపీఠం’ సాంప్రదాయ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. సాంప్రదాయికమైనప్పటికీ గుర్తించదగిన ‘మందసం’ అనే పదాన్ని ఉంచి, భారమైన పాత క్రియారూపాలను నివారించాం. మూడు వరుస హీబ్రూ చర్యలను చిన్న, స్పష్టమైన వాక్యాలుగా వ్యక్తం చేశాం.
