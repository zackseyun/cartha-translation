id: EXO.40.32
reference: Exodus 40:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: te
  text: వారు సమావేశ గుడారంలోకి ప్రవేశించినప్పుడల్లా, బలిపీఠం దగ్గరకు వచ్చినప్పుడల్లా, యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే కడుక్కొనేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: వారు … ప్రవేశించినప్పుడల్లా
  rationale: בְּ + క్రియానామ రూపం, బహువచన ప్రత్యయం కలిసి కాలసంబంధ పరిస్థితిని సూచిస్తున్నాయి. సందర్భంలోని పునరావృత ఆచరణను సహజమైన తెలుగులో తెలియజేయడానికి ‘ప్రవేశించినప్పుడల్లా’ ఎంచుకున్నాం.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే ఈ స్థిర పదబంధాన్ని స్పష్టంగా, వర్గపరమైన ప్రత్యేక పదజాలం లేకుండా అందిస్తుంది.
- source_word: וּבְקָרְבָתָם
  choice: దగ్గరికి వచ్చినప్పుడల్లా
  rationale: קרב అంటే ఇక్కడ బలిపీఠాన్ని సమీపించడం. పునరావృత కాలార్థాన్ని రెండో ‘అప్పుడల్లా’ నిలుపుతుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: గుడార ఆరాధనా సందర్భంలో definite altar‌ను సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: יִרְחָצוּ
  choice: కడుక్కొనేవారు
  rationale: ఈ అసంపూర్ణ క్రియారూపం గత కథనంలో అలవాటుగా జరిగే చర్యను వివరిస్తుంది. తెలుగు ‘-నేవారు’ రూపం ఆ పునరావృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; కడిగిన అవయవాలు ముందు వచనం ద్వారా అర్థమవుతాయి కాబట్టి ఇక్కడ చేర్చలేదు.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టుగానే
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు చర్య సరిగ్గా అనుగుణంగా జరిగిందనే భావాన్ని ‘ట్టుగానే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: కడుక్కోవడానికి ముందే ఇచ్చిన ఆజ్ఞను సహజమైన తెలుగు సంబంధక క్రియారూపంతో సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: צוהతో హీబ్రూలో ఆజ్ఞను పొందిన వ్యక్తి אֶת ద్వారా గుర్తించబడినా, తెలుగు వాడుకలో ‘మోషేకు ఆజ్ఞాపించాడు’ అనే చతుర్థీ నిర్మాణం సహజం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా, ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. రెండు కాలవాచక ఉపవాక్యాల్లో ‘అప్పుడల్లా’ ఉంచి పునరావృత యాజక ఆచరణను స్పష్టం చేశాం. చివరి వాక్యంలో ‘వారు చేశారు’ అనేది తెలుగులో పూర్తి, సహజ వాక్యంగా ఉండేందుకు చేర్చబడింది; అది ముందున్న కడుక్కోవడమే ఆజ్ఞకు అనుగుణమని సూచిస్తుంది.
