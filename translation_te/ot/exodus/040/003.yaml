source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: te
  text: అక్కడ సాక్ష్యపు మందసాన్ని[b] ఉంచాలి; తెరతో[a] ఆ మందసాన్ని మరుగుపరచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముసుగు.’ హీబ్రూ పదం గుడారంలోని మందసాన్ని వేరుచేసి మరుగుపరచే లోపలి తెరను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని సంప్రదాయ అనువాదాల్లో ‘నిబంధన మందసం’; అయితే ఇక్కడ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘సాక్ష్యపు మందసం’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ שָׁם
  choice: అక్కడ ... ఉంచాలి
  rationale: ఆదేశాల వరుసలో ఈ క్రియ మోషేకు ఇచ్చిన ఆజ్ఞను సూచిస్తుంది. ‘అక్కడ’ స్థలసూచనను అతిగా వివరించకుండా నిలుపుతుంది; ‘ఉంచాలి’ ఆధునిక తెలుగులో సహజమైన ఆదేశ రూపం.
- source_word: אֲרוֹן הָעֵדוּת
  choice: సాక్ష్యపు మందసం
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘సాక్ష్యపు మందసం.’ పరిచితమైన ‘నిబంధన మందసం’ అని సమన్వయపరచకుండా మూలంలోని עֵדוּת (‘సాక్ష్యం’)ను నిలిపాం.
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: ఆ మందసాన్ని ... మరుగుచేయాలి
  rationale: סכך ఇక్కడ తెరను మందసంపై కప్పడాన్ని కాక, దాని ముందు విభజనగా ఉంచి కనబడకుండా చేయడాన్ని సూచిస్తుంది. అందువల్ల ‘మరుగుచేయాలి’ ఆ స్థలపరమైన కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַפָּרֹכֶת
  choice: తెర
  rationale: פָּרֹכֶת ప్రత్యక్ష గుడారంలోని లోపలి విభజన తెరను సూచిస్తుంది. ‘తెర’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది; సంప్రదాయ ప్రత్యామ్నాయం ‘ముసుగు’ను పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: మందసం పేరు
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన మందసం
  rationale: ఇక్కడ మూల హీబ్రూ పాఠంలో ‘సాక్ష్యం’ అనే పదమే ఉంది. మరింత పరిచితమైన నిబంధన పదజాలంతో దానిని నిశ్శబ్దంగా సమన్వయపరచలేదు.
- issue: פָּרֹכֶת అనువాదం
  choice: తెర
  alternative: ముసుగు
  rationale: ‘తెర’ ఆధునిక పాఠకులకు సహజంగా ఉండి, ప్రత్యక్ష గుడారంలోని విభజన వస్తువును స్పష్టంగా తెలుపుతుంది. సంప్రదాయ ప్రతిధ్వని గల ‘ముసుగు’ను ప్రత్యామ్నాయంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలి. ‘మందసం’ బైబిలు సందర్భానికి తగిన స్థిర పదంగా ఉంచబడింది; మిగతా వాక్య నిర్మాణం సహజంగా సరళీకరించబడింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
