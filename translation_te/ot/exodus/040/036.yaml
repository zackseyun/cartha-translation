  text: וּ/בְ/הֵעָל֤וֹת הֶֽ/עָנָן֙ מֵ/עַ֣ל הַ/מִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/כֹ֖ל מַסְעֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: te
  text: నివాస గుడారం[a] మీదనుండి మేఘం పైకి ఎత్తబడినప్పుడల్లా, ఇశ్రాయేలు ప్రజలు తమ ప్రయాణాలన్నిటిలో బయలుదేరేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “నివాసస్థలం”; ఇక్కడ దేవుని సన్నిధితో సంబంధమైన సంచార పవిత్ర గుడారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הֵעָלֹת
  choice: పైకి లేచినప్పుడల్లా
  rationale: వావ్‌తో కూడిన בְּ + עלה క్రియాధాతు కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. సందర్భంలోని పునరావృత భావాన్ని ‘అప్పుడల్లా’ సహజంగా తెలియజేస్తుంది; మేఘం పైకి లేవడాన్ని కర్తరి రూపంలో చెప్పడం తెలుగులో సహజం.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: ముందటి సందర్భంలో స్థిరపడిన దేవుని సన్నిధికి సంబంధించిన నిర్దిష్ట మేఘాన్ని సూచిస్తుంది.
- source_word: מֵעַל
  choice: పైనుండి
  rationale: మందిరం పైన ఉన్న స్థానం నుంచి మేఘం కదలడాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: నిర్గమకాండంలోని మִשְׁכָּן అనగా దేవుని సంచార నివాసస్థలమైన పవిత్ర గుడారం. సాధారణ తెలుగు పాఠకునికి సహజమైన ‘మందిరం’ను ప్రధాన పాఠ్యంలో వాడి, దాని ప్రత్యేక భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: יִסְעוּ
  choice: బయలుదేరేవారు
  rationale: נסע ఇక్కడ ప్రయాణం కోసం శిబిరం విడిచి బయలుదేరడాన్ని సూచిస్తుంది. అసంపూర్ణ క్రియారూపంలోని అలవాటుగా పునరావృతమయ్యే భావాన్ని ‘బయలుదేరేవారు’ తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఈ సందర్భంలో స్త్రీపురుషులందరితో కూడిన ఇశ్రాయేలు సమాజాన్ని సూచించే సామూహిక నామం. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: తమ ప్రయాణాలన్నిటిలో
  rationale: వారి అరణ్య ప్రయాణంలోని అన్ని దశలకు వర్తించే సమగ్ర భావాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగా పురుష బహువచనమైనా, సందర్భంలో మొత్తం సమాజాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ లింగపరంగా అనవసరంగా పరిమితం చేయకుండా సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది; దీనిలో ప్రత్యేక సిద్ధాంతార్థం చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. పునరావృత కాలభావానికి ‘అప్పుడల్లా … బయలుదేరేవారు’ అనే జతను ఉపయోగించాం.
