translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞారూప శైలిని ఉపయోగించాం. గుడారపు సామగ్రి ఏర్పాటు అనే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూనే, וְהַעֲלֵיתָ లోని నిజమైన పదార్థ అస్పష్టతను పాదసూచికలో కాపాడాం.
