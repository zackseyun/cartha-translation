  source_fidelity: 'The draft accurately represents the sequence of the Hebrew instructions: bring in the table, arrange its prescribed arrangement, bring in the lampstand, and attend to its lamps. “లోపలికి” appropriately makes explicit the contextual destination implied by the setup of the tent. “దానిమీద ఉంచవలసిన వాటిని క్రమంగా అమర్చాలి” naturally conveys the cognate construction וְעָרַכְתָּ אֶת־עֶרְכּוֹ without importing the specific bread of the Presence. “దాని దీపాలను అమర్చాలి” is a defensible contextual rendering of וְהַעֲלֵיתָ, and the alternative lighting sense is retained in the note.'
