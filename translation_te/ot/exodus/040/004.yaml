  text: וְ/הֵבֵאתָ֙ אֶת הַ/שֻּׁלְחָ֔ן וְ/עָרַכְתָּ֖ אֶת עֶרְכּ֑/וֹ וְ/הֵבֵאתָ֙ אֶת הַ/מְּנֹרָ֔ה וְ/הַעֲלֵיתָ֖ אֶת נֵרֹתֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: te
  text: తర్వాత బల్లను లోపలికి తెచ్చి, దానిమీద ఉంచవలసిన వాటిని క్రమంగా అమర్చాలి. దీపస్తంభాన్ని లోపలికి తెచ్చి, దాని దీపాలను అమర్చాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని దీపాలను వెలిగించాలి.” ఇక్కడి హీబ్రూ క్రియకు అక్షరార్థంగా “పైకి వచ్చేలా చేయాలి” అని అర్థం; దీపజ్వాలలు పైకి లేచేలా చేయడం, అంటే దీపాలను వెలిగించడం అని కూడా ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: లోపలికి తెచ్చి
  rationale: בוא అనే క్రియ యొక్క హిఫీల్ రూపం ఇక్కడ గుడారపు ఏర్పాటులో సామగ్రిని లోపలికి తీసుకురావడాన్ని సూచిస్తుంది. కాబట్టి గమ్యాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: మూలపదం సాధారణంగా ‘బల్ల’ అనే అర్థమే ఇస్తుంది. ఈ వాక్యంలో లేని ‘సన్నిధి రొట్టెల బల్ల’ వంటి సందర్భ వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: దానిమీద ఉంచవలసిన వాటిని క్రమంగా అమర్చాలి
  rationale: ערך క్రియ మరియు దానికి సంబంధించిన నామవాచకం కలిసిన ఈ నిర్మాణం, బల్లకు నిర్దేశించిన వస్తువులను క్రమంలో పెట్టడాన్ని సూచిస్తుంది. పదేపదే అనువదిస్తే తెలుగులో అసహజంగా ఉండటంతో భావాన్ని స్పష్టంగా, సహజంగా అందించాం.
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభాన్ని
  rationale: మూలంలోని సాధారణ నామవాచకానికి అర్థానువాదం చేశాం; ‘మెనోరా’ అనే లిప్యంతరీకరణకన్నా ఆధునిక తెలుగు పాఠకులకు ‘దీపస్తంభం’ నేరుగా అర్థమవుతుంది.
- source_word: וְהַעֲלֵיתָ
  choice: అమర్చాలి
  rationale: עלה హిఫీల్ రూపం అక్షరార్థంగా ‘పైకి వచ్చేలా చేయడం’ అని ఉంటుంది. గుడారాన్ని ఏర్పాటు చేసే ఈ సందర్భంలో దీపాలను సిద్ధంగా అమర్చడం ప్రధాన పాఠ్యంగా తీసుకున్నాం; వాటిని వెలిగించడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: נֵרֹתֶיהָ
  choice: దాని దీపాలను
  rationale: נֵר అనేది దీపాన్ని లేదా దాని జ్వాలను సూచించగలదు. దీపస్తంభంలోని విడివిడిగా ఉన్న దీపాలను సూచించేందుకు ‘దీపాలు’ సహజమైన సమానార్థకం.
