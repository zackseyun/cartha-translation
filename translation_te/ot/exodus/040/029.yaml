id: EXO.40.29
reference: Exodus 40:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: te
  text: అతడు దహనబలి బలిపీఠాన్ని సమావేశ గుడారమైన నివాసమందిరం ప్రవేశద్వారం వద్ద ఉంచి, యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే దానిమీద దహనబలిని, ధాన్యార్పణను అర్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: బలిపీఠాన్ని దాని ప్రధాన బలి విధితో గుర్తించే హీబ్రూ సమాసాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂם
  choice: ఉంచి
  rationale: గుడారపు సామగ్రిని నిర్దిష్ట స్థానంలో అమర్చే సందర్భంలో సహజమైన ఆధునిక తెలుగు క్రియ.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం దగ్గర
  rationale: తలుపు పలకను కాకుండా ప్రవేశించే చోటును సూచించే మూలపద భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారపు నివాసమందిరం
  rationale: מִשְׁכָּןలోని ‘నివాసం’ భావాన్నీ, אֹהֶל מוֹעֵדలోని నియమిత సమావేశ గుడారం భావాన్నీ రెండింటినీ నిలుపుతూ హీబ్రూ నిర్మాణ సంబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַיַּעַל עָלָיו
  choice: దానిమీద … అర్పించాడు
  rationale: బలి సందర్భంలో עלהకు ఉన్న ‘అర్పించు’ అనే ప్రయోగార్థాన్ని, బలిపీఠమే అర్పణ స్థలమనే విషయాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే ఈ ప్రత్యేక బలి రకానికి స్థిరమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: యాజక బలి సందర్భంలో ధాన్యంతో చేసే అర్పణను సూచిస్తుంది; సాధారణ కానుక అనే విస్తృతార్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరిస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే
  rationale: ముందుగా ఇచ్చిన ఆజ్ఞకు మోషే చేసిన కార్యం సరిగ్గా అనుగుణంగా ఉందనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: מִנְחָה యొక్క బలి సంబంధ అర్థం
  choice: ధాన్యార్పణ
  alternative: కానుక / అర్పణ
  rationale: ఈ యాజక సందర్భంలో పదం నిర్దిష్టమైన ధాన్య అర్పణను సూచిస్తుంది; విస్తృతమైన ‘కానుక’ అనే అర్థం ఇక్కడ తగినంత నిర్దిష్టం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. సంప్రదాయ బైబిలు పదజాలంలో ఇప్పటికీ సులభంగా అర్థమయ్యే ‘దహనబలి’, ‘బలిపీఠం’ పదాలను ఉంచి, మరీ ప్రాచీన క్రియారూపాలను నివారించాం. మూలంలోని రెండు గుడార సంబంధ పదాలను కుదించకుండా ‘సమావేశ గుడారపు నివాసమందిరం’గా అందించాం.
