translation:
  language: te
  text: మోషే, యాహ్వే అతనికి ఆజ్ఞాపించినదంతటినీ చేశాడు; అలాగే చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు/తయారుచేయు’ అనే విస్తృత అర్థాలున్నాయి. ఇక్కడ ఆజ్ఞకు విధేయంగా వ్యవహరించడాన్ని సూచిస్తున్నందున ‘చేశాడు’ సహజంగా సరిపోతుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: כְּכֹל
  choice: ఆజ్ఞాపించినదంతా అలాగే
  rationale: כְּ + כֹל ఆజ్ఞలోని సమస్తానికి సంపూర్ణ అనుగుణతను తెలియజేస్తుంది. తెలుగులో ‘అంతా అలాగే’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר
  choice: -ినది
  rationale: సంబంధార్థక అవ్యయాన్ని తెలుగులో క్రియాజన్య విశేషణ రూపంతో సహజంగా వ్యక్తం చేశాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: దేవుడు ఇచ్చిన ఆదేశాన్ని సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం; సందర్భమే ఆజ్ఞ ముందుగా ఇవ్వబడిందని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఇచ్చాం.
- source_word: אֹתוֹ
  choice: తనకు
  rationale: ప్రత్యక్ష కర్మ సూచికతో కూడిన తృతీయ పురుష ఏకవచన ప్రత్యయం మోషేను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘తనకు ఆజ్ఞాపించిన’ సహజమైన ప్రయోగం.
- source_word: כֵּן
  choice: అలాగే
  rationale: ఆజ్ఞకూ మోషే చేసిన కార్యానికీ ఉన్న కచ్చితమైన అనుగుణతను సూచిస్తుంది.
- source_word: עָשָׂה
  choice: అతడు అలాగే చేశాడు
  rationale: హీబ్రూలోని పునరుక్తిని నిలుపుతూ మోషే విధేయతపై ఉన్న ఉద్ఘాటనను సంరక్షిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో ఉంచాం; మూలరూపం గురించి పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని עשה క్రియ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, ఆజ్ఞకు మోషే చూపిన సంపూర్ణ అనుగుణతను వ్యక్తం చేశాం.
