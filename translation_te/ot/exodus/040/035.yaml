source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: te
  text: మేఘం దానిపై నిలిచింది[a], యాహ్వే మహిమ నివాస గుడారాన్ని నింపింది కాబట్టి, మోషే సమావేశ గుడారంలోకి ప్రవేశించలేకపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిపై స్థిరపడింది,’ ‘దానిపై నివసించింది,’ లేదా ‘దానిపై విశ్రమించింది.’ హీబ్రూ క్రియకు స్థిరపడడం, నివసించడం, విశ్రమించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא יָכֹל מֹשֶׁה
  choice: మోషే ... ప్రవేశించలేకపోయాడు
  rationale: יָכֹל యొక్క సామర్థ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు హీబ్రూ క్రమాన్ని స్వల్పంగా మార్చి కారణాన్ని ముందుంచాం.
- source_word: לָ/בוֹא אֶל אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలోకి ప్రవేశించలేకపోయాడు
  rationale: ‘ప్రవేశించు’ అనేది నిర్మాణంలోకి వెళ్లడాన్ని సహజంగా తెలియజేస్తుంది; אֹהֶל מוֹעֵד ను దాని సాధారణ అర్థమైన ‘సమావేశ గుడారం’గా అనువదించాం.
- source_word: כִּי
  choice: గనుక
  rationale: మోషే ప్రవేశించలేకపోవడానికి తరువాతి రెండు వాక్యభాగాలు కారణమని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: שָׁכַן עָלָיו הֶעָנָן
  choice: మేఘం దాని మీద నిలిచివుంది[a]
  rationale: שָׁכַן లోని స్థిరపడటం, నివసించడం, విశ్రమించడం అనే అర్థపరిధిలో ఈ దృశ్యానికి ‘నిలిచివుంది’ సహజంగా సరిపోతుంది. ఇతర నిజమైన అర్థసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: וּ/כְבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: כְבוֹד యొక్క గంభీరమైన భావాన్ని ‘మహిమ’ నిలుపుతుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מָלֵא אֶת הַמִּשְׁכָּן
  choice: నివాస గుడారాన్ని నింపింది
  rationale: מִשְׁכָּן యొక్క నివాసమనే మూలభావాన్నీ, నిర్గమకాండంలోని మోసుకెళ్లగల పవిత్ర గుడారాన్ని సూచించే సందర్భాన్నీ ‘నివాస గుడారం’ అందిస్తుంది; מָלֵא ను సరళ భూతకాలంగా అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత నామమైన టెట్రాగ్రామటన్ నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా ఆమోదితమైన ధ్వన్యనుకరణతో ఇచ్చాం.
- issue: שָׁכַן లోని దైవనివాస భావసూచన
  choice: నిలిచివుంది
  alternative: నివసించింది; విశ్రమించింది
  rationale: తరువాతి దైవనివాస ధర్మశాస్త్ర భావాన్ని ప్రధాన పాఠ్యంలో ముందుగానే బలవంతంగా చేర్చకుండా, ఈ సందర్భంలోని మేఘం గుడారం మీద స్థిరంగా ఉండే దృశ్యాన్ని ముందుకు తెచ్చాం; క్రియలోని ఇతర అర్థాలను పాదసూచికలో నిలిపాం.
- issue: אֹהֶל מוֹעֵד మరియు מִשְׁכָּן మధ్య పదభేదం
  choice: సమావేశ గుడారం; నివాస గుడారం
  alternative: రెండింటికీ గుడారం లేదా మందిరం
  rationale: ఒకే వచనంలో ఉన్న రెండు వేర్వేరు హీబ్రూ పదబంధాల ప్రత్యేకతను తెలుగులోనూ కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. కారణసూచక నిర్మాణం తెలుగులో సులభంగా చదవబడేందుకు కారణ వాక్యభాగాలను ముందుంచింది. ‘సమావేశ గుడారం’ మరియు ‘నివాస గుడారం’ అనే పదాలు మూలంలోని వేర్వేరు నామాలను స్పష్టంగా ఉంచుతాయి.
