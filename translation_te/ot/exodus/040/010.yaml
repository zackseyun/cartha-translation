source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: te
  text: దహనబలి అర్పించే బలిపీఠాన్నీ, దానికి చెందిన ఉపకరణాలన్నిటినీ అభిషేకించాలి. బలిపీఠాన్ని పవిత్రపరచాలి; అప్పుడు బలిపీఠం అత్యంత పవిత్రమైనదిగా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “పవిత్రాల్లో పవిత్రమైనది”; ఇది “అత్యంత పవిత్రమైనది” అనే అత్యున్నత స్థాయిని తెలిపే వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకించాలి
  rationale: ఆరాధనా సందర్భంలో משׁח పవిత్ర సేవ కోసం నూనెతో అభిషేకించడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘అభిషేకించాలి’ సహజమైన, నిర్దిష్టమైన పదం.
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి అర్పించే బలిపీఠం
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో విప్పి చెప్పి, ఈ బలిపీఠం దహనబలికి సంబంధించినదని స్పష్టంగా ఉంచుతుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతా
  rationale: כֵּלִים ఇక్కడ బలిపీఠానికి సంబంధించిన వివిధ పాత్రలు, పనిముట్లను సమష్టిగా సూచిస్తుంది; ‘సామగ్రి’ ఆ విస్తృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְקִדַּשְׁתָּ
  choice: ప్రతిష్ఠించాలి
  rationale: קדשׁ ఇక్కడ పవిత్ర వినియోగం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది; ‘ప్రతిష్ఠించాలి’ ఆ ఆరాధనా చర్యను గౌరవప్రదమైన ఆధునిక భాషలో తెలియజేస్తుంది.
- source_word: וְהָיָה
  choice: అప్పుడు ... ఉంటుంది
  rationale: అభిషేకం, ప్రతిష్ఠ ఫలితంగా ఏర్పడే స్థితిని సూచించే క్రమాన్ని ‘అప్పుడు’ స్పష్టం చేస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పవిత్రమైనది
  rationale: హీబ్రూ పునరుక్త నిర్మాణం అత్యున్నత స్థాయి పవిత్రతను సూచిస్తుంది; స్థలవాచకమైన ‘అతిపరిశుద్ధ స్థలం’ అనే భావాన్ని దిగుమతి చేయకుండా ‘అత్యంత పవిత్రమైనది’ ఆ అధికతను కాపాడుతుంది.
theological_decisions:
- issue: కֹדֶשׁ קָדָשִׁים అనే ఆరాధనా పవిత్రత సూత్రాన్ని ఎలా అనువదించాలి
  choice: అత్యంత పవిత్రమైనది
  alternative: పవిత్రాల్లో పవిత్రమైనది
  rationale: ఈ పదబంధం ఇక్కడ అంతర్గర్భాలయాన్ని సూచించాల్సిన అవసరం లేకుండా అత్యున్నత పవిత్రతను తెలిపే విశేషోక్తి. ప్రధాన పాఠం సహజ తెలుగులో అర్థాన్ని ఇస్తూ, మూల రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. రెండవ పురుష ఏకవచన ఆజ్ఞాత్మక భావాన్ని తెలుగులో సహజమైన ‘చేయాలి’ నిర్మాణంతో అందించింది.
