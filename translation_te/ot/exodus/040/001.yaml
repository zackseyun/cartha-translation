lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-క్రమానుసంధానంతో కూడిన క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది; తరువాత ప్రత్యక్ష వాక్యం రానున్నందున ‘అన్నాడు’ సహజమైన మాటల పరిచయ రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట్లాడే వ్యక్తిని సూచించే אֶל‌ను ఆధునిక తెలుగులో సహజమైన ‘తో’ విభక్తితో వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఇది తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే స్థిరమైన హెబ్రీ ప్రయోగం. తెలుగులో ‘ఇలా అన్నాడు:’ దాని కార్యాన్ని సహజంగా తెలియజేస్తుంది; ‘చెప్పుతూ’ అనే కృత్రిమ పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఖచ్చితమైన ప్రాచీన ఉచ్చారణ అనిశ్చితమైనందున ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు పరిచయ రూపం మరియు ద్విబిందువును వాడాం.
