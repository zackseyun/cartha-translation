translation:
  language: te
  text: అతడు బల్లను సమావేశ గుడారంలో, నివాస గుడారం ఉత్తర భాగాన, తెరకు[a] వెలుపల ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరదాకు వెలుపల.” హెబ్రీ పదం פָּרֹכֶת అతి పరిశుద్ధ స్థలాన్ని వేరుచేసిన లోపలి విభజన తెరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఉంచాడు
  rationale: נתן అనే క్రియకు ‘ఇవ్వు/పెట్టు/ఉంచు’ అనే అర్థాలు ఉన్నాయి. సామగ్రిని నిర్దిష్ట స్థానంలో అమర్చే ఈ సందర్భంలో ‘ఉంచాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: మూలపాఠంలో నిర్దిష్టార్థక సూచనతో ‘బల్ల’ అని మాత్రమే ఉంది. ‘సన్నిధి రొట్టెల బల్ల’ వంటి సందర్భాధారిత వివరాలను ఈ వచనంలో చేర్చలేదు.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారంలో
  rationale: אֹהֶל מוֹעֵד అనే ఆరాధనా స్థల నామాన్ని అర్థవంతంగా, ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యేలా అందిస్తుంది.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: నివాసమందిరం ఉత్తర వైపున
  rationale: יֶרֶךְ ఇక్కడ ‘పక్క/వైపు’ అనే స్థలార్థాన్ని ఇస్తుంది; צָפֹנָה ఉత్తర దిశను సూచిస్తుంది. రెండింటినీ కలిపి తెలుగులో సహజమైన స్థలవివరణగా అనువదించాం.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: מִשְׁכָּן అంటే ప్రాథమికంగా ‘నివాసస్థలం.’ నిర్గమకాండంలోని ప్రత్యేక పవిత్ర నిర్మాణాన్ని సూచించేలా, ‘సమావేశ గుడారం’తో భేదం నిలిచేలా ‘నివాసమందిరం’ ఎంచుకున్నాం.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: తెరకు వెలుపల
  rationale: מִחוּץ స్థలపరంగా ‘వెలుపల’ అని సూచిస్తుంది. פָּרֹכֶת అతి పరిశుద్ధ స్థలాన్ని వేరుచేసే లోపలి విభజన తెర; ప్రధాన పాఠంలో సంక్షిప్తమైన, సహజమైన ‘తెర’ను వాడాం.
