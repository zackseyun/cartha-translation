source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אֶת הָ/אֹ֨הֶל֙ עַל הַ/מִּשְׁכָּ֔ן וַ/יָּ֜שֶׂם אֶת מִכְסֵ֥ה הָ/אֹ֛הֶל עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: te
  text: తర్వాత అతడు నివాసస్థలం మీద గుడారాన్ని పరచి, పై నుండి దానిమీద గుడారపు కప్పును వేశాడు—యహ్వే మోషేకు ఆజ్ఞాపించినట్టే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: పరచి
  rationale: פרשׂ అనే క్రియకు ఇక్కడ ఒక పొరను విప్పి నిర్మాణం మీద పరచడం అనే భావం ఉంది; ‘పరచి’ ఆ చర్యను సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: אֹהֶל యొక్క సాధారణ అర్థం ‘గుడారం.’ తరువాత వచ్చే מִכְסֶה అనే ‘కప్పు’తో ఉన్న పదభేదాన్ని ఇది నిలుపుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస మందిరం
  rationale: מִשְׁכָּן అంటే ‘నివాసం/నివాస స్థలం’; నిర్గమకాండంలోని పవిత్ర నిర్మాణాన్ని సూచించేందుకు ‘నివాస మందిరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది; ‘గుడారం’తో దీనిని కలిపివేయదు.
- source_word: וַיָּשֶׂם
  choice: వేశాడు
  rationale: שׂים అంటే ఉంచడం లేదా పెట్టడం. ఒక కప్పును నిర్మాణం మీద అమర్చే సందర్భంలో ‘వేశాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: מִכְסֵה הָאֹהֶל
  choice: గుడారపు కప్పు
  rationale: మూలంలోని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, గుడారం నుండి దాని బయటి కప్పును వేరుగా గుర్తిస్తుంది.
- source_word: עָלָיו מִלְמָעְלָה
  choice: దానిమీద పై నుంచి
  rationale: עָלָיו లోని ‘దానిమీద’ భావాన్నీ, מִלְמָעְלָה లోని ‘పై నుంచి’ భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యహ్వే మోషేకు ఆజ్ఞాపించినట్టే
  rationale: כַּאֲשֶׁר సూచించే ఖచ్చితమైన అనురూపతను ‘ఆజ్ఞాపించినట్టే’ తెలియజేస్తుంది; ఇది మోషే విధేయతను తెలిపే నిర్గమకాండపు పునరావృత సూత్రాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా יהוה అనే వ్యక్తిగత దైవనామం ఉంది. దానిని ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, పవిత్ర గ్రంథ పఠనానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గుడారం,’ ‘నివాస మందిరం,’ ‘కప్పు’ అనే మూడు నిర్మాణ సంబంధ పదాల మధ్య మూలభాషలోని భేదాన్ని స్పష్టంగా నిలిపాం.
