  text: You shall anoint the basin and its stand[b][a], and consecrate it.
translation:
  language: te
  text: గంగాళానికీ దాని పీటకూ అభిషేకం చేసి, దానిని పవిత్రపరచాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని ప్రతిష్ఠించాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకం చేసి
  rationale: משׁח ఆరాధనా సందర్భంలో నూనెతో అభిషేకించి పవిత్ర సేవకు నియమించడాన్ని సూచిస్తుంది. తెలుగు ఆరాధనా వాడుకలో ‘అభిషేకం చేయడం’ సహజమైన, స్పష్టమైన వ్యక్తీకరణ.
- source_word: הַכִּיֹּר
  choice: కంచు గంగాళం
  rationale: כִּיּוֹר ప్రత్యక్ష గుడార సేవలో కడుక్కోవడానికి ఉపయోగించిన పెద్ద పాత్ర. ఈ వస్తువు కంచుతో చేయబడిందని సమీప సందర్భం (నిర్గమకాండం 38:8) తెలుపుతుంది; ‘గంగాళం’ సాధారణ ‘గిన్నె’ కంటే పెద్ద కడుగు పాత్ర భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כַּנּוֹ
  choice: దాని పీట
  rationale: כֵּן ఇక్కడ గంగాళాన్ని మోసే ఆధార నిర్మాణాన్ని సూచిస్తుంది. ‘పీట’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘అడుగు భాగం’ కంటే వేరుగా అమర్చిన ఆధారాన్ని మెరుగ్గా సూచిస్తుంది.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: దానిని ప్రతిష్ఠించాలి
  rationale: Piel קדשׁ ఇక్కడ పవిత్ర సేవ కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించాలి’ ఆరాధనా వస్తువుకు సంబంధించిన ఈ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; నైతిక శుద్ధీకరణ అనే భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: ప్రత్యక్ష గుడార సందర్భంలో קדשׁ పదాన్ని అనువదించడం
  choice: ప్రతిష్ఠించాలి
  alternative: పవిత్రపరచాలి
  rationale: ఇక్కడ ఉద్దేశం వస్తువును నైతికంగా మార్చడం కాదు, దేవుని సేవ కోసం ప్రత్యేకపరచడం. ‘ప్రతిష్ఠించాలి’ ఆ ఆరాధనా భావాన్ని కాపాడుతుంది.
- issue: אֹתוֹ అనే ఏకవచన సర్వనామానికి పూర్వపదం
  choice: దానిని—గంగాళం, దాని పీట కలిసిన అమరికగా
  alternative: గంగాళాన్ని మాత్రమే
  rationale: హీబ్రూలో సర్వనామం ఏకవచనంలో ఉన్నప్పటికీ, ప్రధాన వస్తువైన గంగాళాన్ని దాని పీటతో కూడిన అమరికగా సూచించడం సందర్భానుకూలం. అనువాదం మూలంలోని ఏకవచనాన్ని ‘దానిని’గా అలాగే ఉంచి ఈ స్వల్ప అనిశ్చితిని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞా శైలి వాడబడింది. ‘కంచు గంగాళం’ సమీప సందర్భంలోని పదార్థ సమాచారాన్ని ఉపయోగించి వస్తువును స్పష్టంగా గుర్తిస్తుంది. మూలంలోని వరుస క్రియలను తెలుగులో సహజమైన ‘అభిషేకం చేసి … ప్రతిష్ఠించాలి’ నిర్మాణంగా ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
