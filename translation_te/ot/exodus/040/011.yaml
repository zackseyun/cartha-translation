revisions:
- from: కంచు గంగాళానికి, దాని పీటకు అభిషేకం చేసి, దానిని ప్రతిష్ఠించాలి.[a]
  to: గంగాళానికీ దాని పీటకూ అభిషేకం చేసి, దానిని పవిత్రపరచాలి.[a]
  rationale: The unsupported adjective “కంచు” has been removed to follow the Hebrew wording of this verse. The final ritual action is rendered as “పవిత్రపరచాలి,” with “ప్రతిష్ఠించాలి” preserved in an anchored footnote as a legitimate contextual alternative. The singular “దానిని” retains the source’s ambiguity concerning whether the principal basin alone or the basin-and-stand unit is in view.
