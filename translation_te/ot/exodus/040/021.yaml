source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: మోషే మందసాన్ని ప్రత్యక్ష గుడారంలోకి తీసుకువచ్చి, మరుగుచేసే తెరను అమర్చాడు[a]; ఆ తెరతో సాక్ష్యపు మందసాన్ని మరుగుచేశాడు[b]. యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడ్డుతెరను’. హెబ్రీ పదబంధం తెరను, అది అడ్డుగా నిలిచి మరుగుచేసే పనిని రెండింటినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాక్ష్యపు మందసాన్ని కప్పాడు’ లేదా ‘తెరతో వేరుచేశాడు’. హెబ్రీ క్రియ తెర ద్వారా కప్పడం, కనబడకుండా చేయడం లేదా వేరుచేయడం అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת־הָאָרֹן
  choice: మోషే మందసాన్ని ... తీసుకొచ్చాడు
  rationale: הביא అనే హిఫీల్ క్రియ ఇక్కడ లోపలికి తీసుకురావడాన్ని సూచిస్తుంది. హెబ్రీలో కర్త అంతర్లీనంగా ఉన్నా, సందర్భానుసారం మోషే అని తెలుగులో స్పష్టంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: הַמִּשְׁכָּן
  choice: ప్రత్యక్ష గుడారం
  rationale: నిర్గమకాండలో מִשְׁכָּן ఇశ్రాయేలీయుల మధ్య దేవుని సన్నిధిని సూచించే సంచార పరిశుద్ధ స్థలానికి వాడిన ప్రత్యేక పదం; తెలుగు బైబిలు వాడుకలో ‘ప్రత్యక్ష గుడారం’ సుపరిచితం.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: మరుగుచేసే తెర
  rationale: פָּרֹכֶת తెరను, הַמָּסָךְ దాని అడ్డుగా నిలిచి మరుగుచేసే పనిని సూచిస్తాయి. ‘మరుగుచేసే తెర’ ఈ రెండు భావాలను సహజమైన ఆధునిక తెలుగులో కలుపుతుంది.
- source_word: וַיָּשֶׂם
  choice: అమర్చాడు
  rationale: שׂים సాధారణంగా పెట్టడం లేదా ఉంచడం అని అర్థమైనా, ఇక్కడ పరిశుద్ధ గుడారంలోని తెరను దాని స్థానంలో ఏర్పాటు చేయడం ఉద్దేశం; అందువల్ల ‘అమర్చాడు’ సందర్భోచితం.
- source_word: וַיָּסֶךְ עַל
  choice: ఆ తెరతో ... మరుగుచేశాడు
  rationale: ఈ క్రియ తెర ద్వారా మందసాన్ని కనబడకుండా చేయడం లేదా దాని నుంచి వేరుచేయడం అనే భావాన్ని ఇస్తుంది. సాధనాన్ని తెలుపుతూ ‘ఆ తెరతో’ అనడం తెలుగులో సహజంగా ఉండి, ముందున్న הַמָּסָךְతో పదభావ సంబంధాన్నీ నిలుపుతుంది.
- source_word: אֲרוֹן הָעֵדוּת
  choice: సాక్ష్యపు మందసం
  rationale: עֵדוּת నిబంధన పలకలతో సంబంధమున్న ‘సాక్ష్యం’ అనే పదాన్ని నిలుపుతుంది; వివరణాత్మక విస్తరణ లేకుండా మూలంలోని ఆరాధనా పదబంధాన్ని ప్రతిబింబిస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే అతడు చేశాడు
  rationale: మూలంలోని విధేయత సూత్రాన్ని సహజమైన పూర్తి తెలుగు వాక్యంగా వ్యక్తం చేస్తుంది. ‘అతడు చేశాడు’ అనేది ముందున్న కార్యాలనే సమగ్రంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి సాధారణంగా అంగీకరించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్నే ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ మరొక సంప్రదాయ ఉచ్చారణ, ‘ప్రభువు’ బిరుదు.
- issue: אֲרוֹן הָעֵדוּתలో עֵדוּת భావం
  choice: సాక్ష్యపు మందసం
  alternative: నిబంధన పలకల మందసం
  rationale: ‘సాక్ష్యం’ మూలపదంలోని విస్తృతమైన ఆరాధనా, నిబంధనా భావాన్ని నిలుపుతుంది; ‘నిబంధన పలకలు’ అనేది సందర్భానికి సరైన వివరణ అయినా మూలంలో లేని స్పష్టీకరణను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. పొడవైన సమాసాలను తగ్గించి చర్యలను చిన్న వాక్యాలుగా విభజించాం. ‘ప్రత్యక్ష గుడారం’, ‘మందసం’, ‘సాక్ష్యం’ వంటి స్థిరపడిన బైబిలు పదజాలాన్ని నిలుపుతూ, అరుదైన లేదా అతిగా ప్రాచీన రూపాలను నివారించాం.
