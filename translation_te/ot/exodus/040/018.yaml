  text: וַ/יָּ֨קֶם מֹשֶׁ֜ה אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּתֵּן֙ אֶת אֲדָנָ֔י/ו וַ/יָּ֨שֶׂם֙ אֶת קְרָשָׁ֔י/ו וַ/יִּתֵּ֖ן אֶת בְּרִיחָ֑י/ו וַ/יָּ֖קֶם אֶת עַמּוּדָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: te
  text: అప్పుడు మోషే నివాస గుడారాన్ని[a] నిలబెట్టాడు; దాని పునాది దిమ్మలను[b] అమర్చి, దాని పలకలను[c] నిలిపి, దాని అడ్డకడ్డీలను అమర్చి, దాని స్తంభాలను నిలబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గుడార నివాసం.’ హీబ్రూ పదానికి అక్షరార్థం ‘నివాసస్థలం’; నిర్గమకాండంలో ఇది దేవుని పవిత్ర సంచార గుడారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పునాదులు’ లేదా ‘గాడులున్న దిమ్మలు.’ ఇవి పలకలను నిలబెట్టే అడుగుభాగపు ఆధారాలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘చెక్క చట్రాలు.’ హీబ్రూ పదం ‘పలకలు’ అని కూడా అర్థం ఇస్తుంది; ఇక్కడ అవి నిలువుగా అమర్చిన నిర్మాణ భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నిలబెట్టాడు
  rationale: హిఫీల్ రూపం ‘నిలిచేలా చేయడం/ఏర్పాటు చేయడం’ అనే భావాన్ని ఇస్తుంది. నిర్మాణ సందర్భంలో ‘నిలబెట్టాడు’ సహజంగా ఉండి, చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: מִשְׁכָּן అక్షరార్థంగా ‘నివాసస్థలం’; నిర్గమకాండంలో ఇది దేవుని పవిత్ర సంచార నివాసాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ సహజమైన, గౌరవప్రదమైన పదం; ఇది శాశ్వత రాతి ఆలయమనే అపార్థం కలిగించవచ్చని పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: אֲדָנָיו
  choice: దాని పునాదులు
  rationale: ఈ పదం పలకలను నిలబెట్టే అడుగుభాగపు ఆధారాలను లేదా గాడులుగల దిమ్మలను సూచిస్తుంది. ‘పునాదులు’ వాటి నిర్మాణ విధిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: קְרָשָׁיו
  choice: దాని పలకలు
  rationale: קֶרֶשׁ అనేది మందిరపు గోడలలో నిలువుగా అమర్చిన చెక్క పలకను సూచిస్తుంది. ‘పలకలు’ మూలపదానికి సన్నిహితంగా ఉండి తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: בְּרִיחָיו
  choice: దాని అడ్డకడ్డీలు
  rationale: בְּרִיחַ పలకలను కలిపి పట్టి ఉంచే అడ్డంగా అమర్చిన కడ్డీ. ‘అడ్డకడ్డీలు’ దాని రూపాన్ని, నిర్మాణ విధిని ‘కడ్డీలు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמּוּדָיו
  choice: దాని స్తంభాలు
  rationale: עַמּוּד నిలువుగా మోసే ఆధారాన్ని సూచిస్తుంది. పవిత్ర నిర్మాణ సందర్భంలో ‘స్తంభాలు’ ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: అమర్చి / నిలిపి / బిగించి
  rationale: నాతన్, సీమ్ రెండూ సందర్భానుసారంగా ‘పెట్టడం/ఉంచడం’ అని అర్థమిస్తాయి. ప్రతి నిర్మాణ భాగంతో సహజంగా వినిపించే తెలుగు క్రియలను వాడి, మూలంలోని వరుస చర్యలను కాపాడాం.
theological_decisions:
- issue: מִשְׁכָּן పదం దేవుని నివాసాన్ని సూచించే విధానం
  choice: మందిరం
  alternative: నివాస గుడారం
  rationale: ఇక్కడ పదం సాధారణ నివాసాన్ని కాక దేవుని పవిత్ర సంచారస్థలాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంప్రదాయ పదాన్ని ఉంచి, దాని అక్షరార్థం మరియు సంచార స్వభావాన్ని పాదటిప్పణిలో తెలిపాం; దేవుని సన్నిధి స్వరూపం గురించి అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ పదజాలాన్ని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస నిర్మాణ చర్యలను సంక్షిప్త క్రియాక్రమంగా నిలిపాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
