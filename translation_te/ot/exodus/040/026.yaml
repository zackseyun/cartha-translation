base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: te
  text: అతడు బంగారు బలిపీఠాన్ని సమాగమ గుడారంలో తెర ఎదుట ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరదా.’ ఇక్కడి హీబ్రూ పదం సమాగమ గుడారంలోని అంతర్గత విభజన తెరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂוּם క్రియ యొక్క వయ్యిక్తోల్ రూపం గతకాల వరుస చర్యను తెలియజేస్తుంది. గుడారపు సామగ్రిని నిర్దిష్ట స్థానంలో పెట్టడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉంచాడు’ సరిపోతుంది.
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠాన్ని
  rationale: అక్షరార్థంగా ‘బంగారపు బలిపీఠం.’ ఆధునిక ప్రామాణిక తెలుగులో ‘బంగారు బలిపీఠం’ సహజంగా ఉండి, అది బంగారంతో సంబంధమున్న బలిపీఠమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారంలో
  rationale: אֹהֶל מוֹעֵד దేవుడు తన ప్రజలను కలుసుకునే పరిశుద్ధ గుడారానికి స్థిరమైన పేరు. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘ప్రత్యక్ష గుడారం’ ఆ సమావేశ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఈ పూర్వప్రత్యయం తెరకు సంబంధించి బలిపీఠం ఉన్న స్థానాన్ని సూచిస్తుంది. ‘ఎదుట’ సంక్షిప్తంగా, సహజంగా ఆ ప్రాదేశిక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַפָּרֹכֶת
  choice: తెర
  rationale: פָּרֹכֶת ప్రత్యక్ష గుడారంలోని అంతర్గత విభజన తెరను సూచిస్తుంది. ‘తెర’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది; ‘ముసుగు’ అనే ప్రత్యామ్నాయం కూడా సాధ్యమే.
theological_decisions:
- issue: הַפָּרֹכֶת అనే ఆరాధనా స్థల పదానికి అనువాదం
  choice: తెర
  alternative: ముసుగు
  rationale: ఈ పదం గుడారంలోని అంతర్గత విభజనను సూచిస్తుంది. ‘తెర’ దాని సాధారణ భౌతిక అర్థాన్ని నేరుగా ఇస్తూ, తరువాతి లేఖనాల్లో దానికి కలిగే ఆధ్యాత్మిక ప్రాధాన్యాన్ని అనువాదంలో అతిగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. గుడార సంబంధిత పరిభాషలో సుపరిచితమైన ‘ప్రత్యక్ష గుడారం,’ ‘బలిపీఠం’ పదాలు నిలుపబడ్డాయి. మూలంలోని వరుస కథన భావానికి అనుగుణంగా ‘అతడు ... ఉంచాడు’ అని సరళంగా అనువదించబడింది.
