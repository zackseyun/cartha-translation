  source_fidelity: The draft accurately conveys the legal instruction, the required way of conduct, and the required deed. However, “గట్టిగా” adds an explicit intensity (“strongly”) not marked by the Hebrew Hiphil of זהר; “హెచ్చరించాలి” alone adequately conveys the warning/admonitory force.
