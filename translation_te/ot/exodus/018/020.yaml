  text: וְ/הִזְהַרְתָּ֣ה אֶתְ/הֶ֔ם אֶת הַ/חֻקִּ֖ים וְ/אֶת הַ/תּוֹרֹ֑ת וְ/הוֹדַעְתָּ֣ לָ/הֶ֗ם אֶת הַ/דֶּ֨רֶךְ֙ יֵ֣לְכוּ בָ֔/הּ וְ/אֶת הַֽ/מַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּ/ן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: te
  text: నీవు వారికి కట్టడాలనూ ధర్మశాస్త్రాలనూ[a] గురించి హెచ్చరించాలి; వారు నడవవలసిన మార్గాన్నీ[b], వారు చేయవలసిన కార్యాన్నీ వారికి తెలియజేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బోధనలనూ.’ హీబ్రూ తోరోత్ అనే పదం విస్తృతంగా ఉపదేశాలను సూచించగలదు; ఇక్కడి న్యాయ సందర్భం ‘ధర్మశాస్త్రాలు’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు దానిలో నడవవలసిన మార్గం.’ ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని నిలుపడానికి ‘నడవడం’ అనే మాటను ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: గట్టిగా హెచ్చరించాలి
  rationale: זהר హిఫీల్ రూపం హెచ్చరించడం, జాగ్రత్తగా బోధించడం అనే భావాలను ఇస్తుంది. న్యాయపరమైన ఈ సందర్భంలో బాధ్యతను గుర్తుచేసే గంభీర హెచ్చరిక భావాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַחֻקִּים
  choice: కట్టడాలు
  rationale: חֻקִּים స్థిరంగా నిర్దేశించిన శాసనాలు లేదా విధులను సూచిస్తుంది. ‘కట్టడాలు’ దాని ప్రత్యేక న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: הַתּוֹרֹת
  choice: ధర్మశాస్త్రాలు
  rationale: תּוֹרֹת అనేది బోధనలు లేదా ఆదేశాలను విస్తృతంగా సూచించగలదు; అయితే חֻקִּיםతో జతగా ఉన్న ఈ న్యాయ సందర్భంలో ‘ధర్మశాస్త్రాలు’ సముచితం. విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהוֹדַעְתָּ
  choice: తెలియజేయాలి
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలిసేలా చేయడం’ అనే కారణార్థక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַדֶּרֶךְ
  choice: మార్గం
  rationale: מַעֲשֶׂהతో సమాంతరంగా ఇది జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని కాపాడుతుంది.
- source_word: יֵלְכוּ בָהּ
  choice: వారు నడవవలసిన
  rationale: అక్షరార్థంగా ‘దానిలో వారు నడవవలసిన’ అని ఉంటుంది. తెలుగులో ‘నడవవలసిన మార్గం’ సహజంగా ఉండటంతో పాటు ప్రవర్తనకు సంబంధించిన బైబిలీయ రూపకాన్ని నిలుపుతుంది.
- source_word: הַמַּעֲשֶׂה
  choice: కార్యం
  rationale: מַעֲשֶׂה చేయబడే పని లేదా క్రియను సూచిస్తుంది. ఇక్కడ అవసరమైన ఆచరణను ‘కార్యం’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: వారు చేయవలసిన
  rationale: సందర్భంలోని విధ్యర్థక బలాన్ని తెలుగులో ‘చేయవలసిన’ సహజంగా వ్యక్తం చేస్తుంది; దీనిని కేవలం భవిష్యత్ చర్యగా చూపదు.
