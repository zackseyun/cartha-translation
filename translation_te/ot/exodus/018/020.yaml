translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘కట్టడాలు/ధర్మశాస్త్రాలు’ అనే భేదాన్ని, ‘మార్గంలో నడవడం’ అనే హీబ్రూ ప్రవర్తనా రూపకాన్ని నిలిపాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
