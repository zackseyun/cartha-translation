source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: te
  text: యాహ్వే ఇశ్రాయేలుకు చేసిన సమస్త మేలునుబట్టి, ఆయన ఇశ్రాయేలును ఐగుప్తు చేతిలోనుండి[b] విడిపించినందుకు యిత్రో సంతోషించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆనందించాడు.’ హీబ్రూ క్రియ సంతోషాన్ని లేదా ఆనందాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఐగుప్తు చేతిలోనుండి’ అనేది ఐగుప్తు అధికారంనుండి లేదా ఆధీనంనుండి విడిపించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: సంతోషించాడు
  rationale: ఈ క్రియ ఆనందించడం లేదా సంతోషించడం అనే భావాన్ని తెలుపుతుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘సంతోషించాడు’ సహజంగా ఉండి, దేవుని రక్షణ కార్యానికి యిత్రో చూపిన సానుకూల స్పందనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יִתְרוֹ
  choice: యిత్రో
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపాన్ని అనుసరించింది.
- source_word: עַל כָּל הַטּוֹבָה
  choice: చేసిన మేలంతటినిబట్టి
  rationale: עַל భావోద్వేగ క్రియతో కలసి ఆ భావోద్వేగానికి కారణాన్ని సూచిస్తుంది. הַטּוֹבָה ఏకవచన సమష్టి భావాన్ని ‘మేలంతటి’ నిలుపుతుంది.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: యిత్రో సంతోషించడానికి ముందే జరిగిన యెహోవా కార్యాన్ని తెలుగు సంబంధ క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: לְ ఇక్కడ ప్రయోజనార్థకంగా ఉంది; యెహోవా ఇశ్రాయేలు పక్షంగా చేసిన మేలును ‘ఇశ్రాయేలుకు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: ఆయన ఇశ్రాయేలును ... విడిపించాడు
  rationale: ఏకవచన ప్రత్యయం ఇశ్రాయేలును సమష్టి వ్యక్తిగా సూచిస్తుంది. తెలుగులో సందిగ్ధత రాకుండా ‘ఇశ్రాయేలును’ పునరుక్తి చేసి, נצל రక్షణ సందర్భంలోని భావాన్ని ‘విడిపించాడు’గా అందించింది.
- source_word: מִיַּד מִצְרָיִם
  choice: ఐగుప్తు చేతిలోనుండి
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, ఐగుప్తు ఆధీనశక్తి నుండి విముక్తి అనే భావం సందర్భంలో అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన నామరూపంగా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘యెహోవా,’ ‘యిత్రో,’ ‘ఇశ్రాయేలు,’ ‘ఐగుప్తు’ అనే స్థిరపడిన బైబిలు పేరురూపాలను నిలిపింది; మూలంలోని ‘చేతి’ రూపకాన్ని పాఠ్యంలో ఉంచి దాని భావాన్ని పాదటిప్పణిలో వివరించింది.
