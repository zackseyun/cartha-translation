  source_fidelity: సవరణ అవసరం. ముసాయిదాలో చివరి సంబంధవాక్యమైన “ఇశ్రాయేలును ... విడిపించిన” భావం స్వతంత్ర ప్రధానవాక్యంగా మారింది. దానిని యిత్రో సంతోషానికి కారణమైన యాహ్వే చేసిన మేలులో భాగంగా కలపాలి. అలాగే మూలంలోని యְהוָהకు ఆడిట్ ట్రెయిల్ నిర్దేశించిన ‘Yahweh’కు అనుగుణంగా ‘యాహ్వే’ వాడటం సముచితం.
