  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: te
  text: మోషే మామ అతడు ప్రజల కోసం చేస్తున్నదంతా చూసి, “ప్రజల కోసం నువ్వు చేస్తున్న ఈ పని ఏమిటి? నువ్వు ఒక్కడివే ఎందుకు కూర్చుంటున్నావు, ప్రజలందరూ ఉదయం నుంచి సాయంత్రం వరకు నీ ఎదుట[a] నిలబడి ఉండగా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ మీద” లేదా “నీపై”; ఇక్కడ మోషే సమక్షంలో, బహుశా తీర్పు కోసం, నిలబడడమని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: חֹתֵן వివాహ సంబంధంలోని మామను సూచిస్తుంది; సందర్భంలో ఇతడు మోషే భార్య తండ్రి యిత్రో. ‘మోషే మామ’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: וַיַּרְא
  choice: చూసి
  rationale: ראה అనే సాధారణ ‘చూచుట’ క్రియను కథన ప్రవాహానికి అనుగుణంగా ‘చూసి’ అని ఇచ్చాం; ‘గమనించి’ అనే అదనపు వ్యాఖ్యాన ఛాయను చేర్చలేదు.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: అతడు ... చేస్తున్నదంతా
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది; ‘చేస్తున్నదంతా’ ఆ భావాన్నీ సంపూర్ణతనూ నిలుపుతుంది.
- source_word: לָעָם
  choice: ప్రజల కోసం
  rationale: లామెద్ ఇక్కడ ప్రజల పక్షాన లేదా వారి ప్రయోజనం కోసం మోషే చేస్తున్న సేవను సూచిస్తుంది.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: ఈ పని ఏమిటి?
  rationale: דָּבָר కు ‘విషయం/సంగతి/పని’ అనే భావాలు ఉన్నాయి. ఇక్కడ యిత్రో మోషే చేపట్టిన విధానాన్ని ప్రశ్నిస్తున్నందున ‘ఈ పని’ సహజంగా ఉంటుంది.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: నువ్వొక్కడివే ఎందుకు కూర్చుంటున్నావు?
  rationale: ישב భౌతికంగా కూర్చోవడంతో పాటు తీర్పు చెప్పే అధికారిక సమావేశ భావాన్నీ కలిగి ఉండవచ్చు. తెలుగు వాక్యం ఆ రెండు అవకాశాలనూ మూసివేయదు.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: ప్రజలందరూ ... నీ ఎదుట ... నిలబడి ఉంటున్నారు
  rationale: נצב అంటే ‘నిలబడుట’; עַל అక్షరార్థంగా ‘మీద/పై’ అయినా, ఇక్కడ అధికారంలో ఉన్న మోషే సమక్షంలో హాజరై ఉండడాన్ని సూచిస్తుంది. ‘నీ ఎదుట’ సందర్భానికి స్పష్టమైన తెలుగు.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: ఉదయం నుంచి సాయంత్రం వరకు
  rationale: రోజంతా కొనసాగే వ్యవధిని తెలిపే సహజమైన తెలుగు కాలవ్యక్తీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. సంభాషణలో మామ తన అల్లుడితో మాట్లాడే సందర్భానికి తగిన ‘నువ్వు’ రూపాన్ని వాడాం. మూలంలోని పునరుక్తి—‘ప్రజల కోసం ... చేస్తున్న’—నిలుపబడింది; న్యాయసంబంధ సందర్భాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరించకుండా పాదసూచికలో సూచించాం.
