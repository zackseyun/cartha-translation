source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל מֹשֶׁ֔ה אֲנִ֛י חֹתֶנְ/ךָ֥ יִתְר֖וֹ בָּ֣א אֵלֶ֑י/ךָ וְ/אִ֨שְׁתְּ/ךָ֔ וּ/שְׁנֵ֥י בָנֶ֖י/הָ עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: te
  text: అతడు మోషేతో, “నేను, నీ మామ యిత్రో, నీ భార్యతోను, ఆమెతో ఉన్న ఆమె ఇద్దరు కుమారులతోను నీ దగ్గరకు వస్తున్నాను” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలంలో ‘ఆమె ఇద్దరు కుమారులు’ అని ఉంది. కొన్ని అనువాదాలు దీనిని ‘నీ ఇద్దరు కుమారులు’ అని సులభతరం చేస్తాయి; అయితే మసొరేటిక్ పాఠంలోని స్త్రీలింగ ఏకవచన ప్రత్యయం మోషే భార్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: అతడు మోషేతో ... అని చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం కోసం ‘అని చెప్పాడు’ను ఉల్లేఖనం చివర ఉంచాం.
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: నీ మామనైన నేను, యిత్రోను
  rationale: స్వతంత్ర సర్వనామమైన אֲנִי ఇచ్చే ఉద్ఘాటనను నిలిపి, חֹתֵן‌ను ఈ సందర్భంలో భార్య తండ్రి అనే స్పష్టమైన అర్థంలో ‘మామ’గా అనువదించాం.
- source_word: בָּא אֵלֶיךָ
  choice: నీ దగ్గరికి వస్తున్నాను
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న లేదా సమీపిస్తున్న రాకను సూచిస్తుంది; అందువల్ల భూతకాలంగా మార్చకుండా ‘వస్తున్నాను’ అని ఇచ్చాం.
- source_word: וְאִשְׁתְּךָ
  choice: నీ భార్య
  rationale: మోషే భార్యను సూచించే ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలిపాం.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: ఆమె ఇద్దరు కుమారులు
  rationale: బహువచన నామానికి ఉన్న తృతీయ పురుష స్త్రీలింగ ఏకవచన ప్రత్యయం స్పష్టంగా ‘ఆమె’ అని సూచిస్తుంది; దానిని ‘నీ’గా సవరించలేదు.
- source_word: עִמָּהּ
  choice: ఆమెతోపాటు
  rationale: కుమారులు ఆమెతో ఉన్నారని హెబ్రీ పాఠం ప్రత్యేకంగా చెబుతుంది; తెలుగులో సహజంగా ఉండేలా ‘ఆమెతోపాటు’గా నిలిపాం.
theological_decisions:
- issue: కుమారుల సంబంధాన్ని సూచించే సర్వనామం
  choice: ఆమె ఇద్దరు కుమారులు
  alternative: నీ ఇద్దరు కుమారులు
  rationale: మసొరేటిక్ పాఠంలోని בָנֶיהָ తృతీయ పురుష స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని కలిగి ఉంది. భావసామరస్యంకోసం దానిని ద్వితీయ పురుష రూపంగా మార్చకుండా మూలపాఠంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం వాడాం. ‘మామ’ సాధారణ పాఠకులకు స్పష్టమైన సంబంధపదం. ప్రత్యక్ష వాక్యంలో వ్యక్తుల రాకను తెలుగులో స్పష్టంగా తెలియజేయడానికి రెండో భాగంలో ‘కూడా వస్తున్నారు’ను పూరించాం; ఇది మూలంలోని సహచర్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంచబడింది.
