source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: te
  text: మోషే తన మామగారిని కలుసుకోవడానికి బయటికి వెళ్లి, ఆయనకు వంగి నమస్కరించి, ఆయనను ముద్దుపెట్టుకున్నాడు. ఆ తర్వాత వారిద్దరూ ఒకరి క్షేమం గురించి మరొకరు అడిగారు; తరువాత వారు గుడారంలోకి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: వచ్చిన బంధువును ఎదుర్కొని స్వాగతించడానికి బయటికి వెళ్లడాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֹתְנוֹ
  choice: తన మామను
  rationale: నిర్గమకాండము 18 సందర్భంలో חֹתֵן మోషే భార్య తండ్రియైన యిత్రోను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మామ’ సహజమైన బంధుత్వ పదం.
- source_word: וַיִּשְׁתַּחוּ
  choice: ఆయన ముందు వంగి నమస్కరించి
  rationale: శరీరాన్ని వంచి గౌరవం చూపే చర్యను తెలియజేస్తుంది; దీనిని ఆరాధనగా నిర్ణయించకుండా సందర్భానుగుణమైన మర్యాదను కాపాడుతుంది.
- source_word: וַיִּשַּׁק לוֹ
  choice: ఆయనను ముద్దుపెట్టుకున్నాడు
  rationale: స్వాగత సందర్భంలో ఆచారబద్ధమైన ముద్దును సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: వారిద్దరూ ఒకరి క్షేమాన్ని మరొకరు అడిగి తెలుసుకొని
  rationale: ‘శాంతి గురించి అడగడం’ అనే హీబ్రూ నుడికారాన్ని పరస్పర క్షేమవిచారణగా సహజంగా అందిస్తుంది; אִישׁ לְרֵעֵהוּ లోని పరస్పర భావాన్ని నిలుపుతుంది.
- source_word: הָאֹהֱלָה
  choice: గుడారంలోకి
  rationale: దిశాసూచక అంత్యప్రత్యయం గుడారం లోపలికి కదలికను సూచిస్తుంది. హీబ్రూ ‘మోషే గుడారం’ అని స్పష్టంగా చెప్పనందున స్వామ్యాన్ని చేర్చలేదు.
theological_decisions:
- issue: మోషే యిత్రో ముందు వంగడం యొక్క భావం
  choice: గౌరవంతో వంగి నమస్కరించడం
  alternative: ఆరాధించడం లేదా పూర్తిగా సాష్టాంగపడడం
  rationale: ఈ క్రియ ఇతర సందర్భాల్లో ఆరాధనను సూచించగలిగినా, ఇక్కడ మానవ బంధువును కలుసుకునే స్వాగత క్రమం సామాజిక గౌరవాన్ని సూచిస్తుంది. అందువల్ల ఆరాధన భావాన్ని బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యిత్రో పేరు ఈ వాక్యంలో లేకపోవడంతో చేర్చలేదు; ‘గుడారం’ ఎవరిదో మూలం స్పష్టీకరించనందున అలాగే ఉంచబడింది.
