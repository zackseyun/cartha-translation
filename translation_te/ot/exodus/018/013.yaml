  yaml_path: translation/ot/exodus/018/013.yaml
  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: te
  text: 'మరుసటి రోజు ఇలా జరిగింది: మోషే ప్రజలకు న్యాయం తీర్చడానికి కూర్చున్నాడు; ప్రజలు ఉదయం నుండి సాయంత్రం వరకు మోషే ఎదుట[a] నిలబడి ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మోషే చుట్టూ నిలబడి ఉన్నారు.’ హీబ్రూ ఉపసర్గానికి ఈ మరింత ప్రత్యక్షమైన స్థలార్థం కూడా సాధ్యమే; సందర్భంలో ప్రజలు తీర్పు కోసం మోషే సమక్షంలో వేచి ఉన్నారని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో కృత్రిమంగా ‘అలా జరిగింది’ అని పునరావృతం చేయకుండా, తదుపరి సంఘటన జరిగిన సమయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: మోషే ... కూర్చున్నాడు
  rationale: ישׁב అనే క్రియలోని ప్రత్యక్షమైన కూర్చునే భావాన్ని, న్యాయాధిపతి ఆసీనుడై తీర్పు చెప్పే సందర్భాన్ని నిలుపుతుంది.
- source_word: לִשְׁפֹּט אֶת־הָעָם
  choice: ప్రజలకు న్యాయం తీర్చడానికి
  rationale: שׁפט ఇక్కడ ప్రజల వివాదాలను విచారించి తీర్పు చెప్పడాన్ని సూచిస్తుంది. ‘న్యాయం తీర్చడం’ ఆధునిక తెలుగులో సహజంగా ఉండి న్యాయసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲמֹד הָעָם
  choice: ప్రజలు ... నిలబడి ఉన్నారు
  rationale: עמד యొక్క ‘నిలబడుట’ అనే దృశ్యాన్ని కాపాడుతూ, వారు చాలాసేపు వేచి ఉన్న స్థితిని తెలుగు క్రియారూపం తెలియజేస్తుంది.
- source_word: עַל מֹשֶׁה
  choice: మోషే ఎదుట
  rationale: עמד తో వచ్చిన עַל ఈ సందర్భంలో మోషే సమక్షంలో తీర్పు కోసం నిలబడటాన్ని సూచిస్తుంది. అయితే ‘చుట్టూ’ అనే మరింత ప్రత్యక్ష స్థలార్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: מִן־הַבֹּקֶר עַד־הָעָרֶב
  choice: ఉదయం నుండి సాయంత్రం వరకు
  rationale: రోజంతా కొనసాగిన కాలవ్యవధిని మూలానికి దగ్గరగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
