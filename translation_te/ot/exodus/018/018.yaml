source:
  edition: WLC
  text: נָבֹ֣ל תִּבֹּ֔ל גַּם אַתָּ֕ה גַּם הָ/עָ֥ם הַ/זֶּ֖ה אֲשֶׁ֣ר עִמָּ֑/ךְ כִּֽי כָבֵ֤ד מִמְּ/ךָ֙ הַ/דָּבָ֔ר לֹא תוּכַ֥ל עֲשֹׂ֖/הוּ לְ/בַדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: te
  text: నీవు తప్పకుండా అలసిపోయి క్షీణించిపోతావు[a]—నీవే కాదు, నీతో ఉన్న ఈ ప్రజలు కూడా. ఎందుకంటే ఈ పని నీకు మరీ భారమైనది; నీవు ఒంటరిగా దీన్ని చేయలేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు తప్పకుండా పూర్తిగా అలసిపోతావు.” హీబ్రూలో నొక్కి చెప్పడానికి ఒకే క్రియను పునరుక్తి చేశారు; అక్షరార్థంగా, “క్షీణిస్తూ, నీవు క్షీణిస్తావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: తప్పకుండా అలసిపోయి క్షీణించిపోతావు
  rationale: క్రియను ధాతురూపంతో పునరుక్తి చేసిన హీబ్రూ నిర్మాణం నిశ్చయాన్నీ తీవ్రతనూ వ్యక్తం చేస్తుంది. సందర్భంలో అధిక పనిభారం వల్ల కలిగే సంపూర్ణ అలసటను ఈ సహజమైన తెలుగు పదబంధం తెలియజేస్తుంది.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: నీవే కాదు, ... ఈ ప్రజలు కూడా
  rationale: రెండుసార్లు వచ్చిన גַּם మోషేను, ప్రజలను రెండింటినీ చేర్చుతుంది. ఆధునిక తెలుగులో ఈ జంట నిర్మాణం ఆ సమ్మిళిత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר עִמָּךְ
  choice: నీతో ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అనువదించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి హెచ్చరికకు కారణాన్ని పరిచయం చేసే సంధానపదంగా స్పష్టంగా ఉంది.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: ఈ పని నీకు మరీ భారమైనది
  rationale: כָבֵד అనే 'భారీ' రూపకాన్ని నిలుపుతూ, సందర్భంలోని న్యాయనిర్వహణ బాధ్యతను דָּבָר కోసం అతిగా నిర్దిష్టం చేయకుండా 'పని'గా తెలిపింది. מִמְּךָలోని సామర్థ్యానికి మించిన భావాన్ని 'మరీ' అందిస్తుంది.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: దీన్ని చేయలేవు
  rationale: అసమర్థతను, עשה యొక్క విస్తృతమైన 'చేయు' అర్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: לְבַדֶּךָ
  choice: ఒంటరిగా
  rationale: ఇతరుల సహాయం లేకుండా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
