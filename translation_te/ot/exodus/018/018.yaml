  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ రూపకమైన ‘భారం’ను నిలిపి, తీవ్ర అలసటను సాధారణ పాఠకులకు స్పష్టంగా తెలిపింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
