  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: te
  text: అప్పుడు మోషే మామ యిత్రో దేవునికి ఒక దహనబలినీ, బలులనూ తీసుకున్నాడు. దేవుని సన్నిధిలో మోషే మామతో కలిసి రొట్టె తినడానికి[a] అహరోను, ఇశ్రాయేలు పెద్దలందరూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రొట్టె తినడానికి.’ ఈ నుడికారం ‘కలిసి భోజనం చేయడానికి’ అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థం ‘తీసుకున్నాడు.’ బలుల సందర్భం అర్పణ భావాన్ని సూచిస్తున్నప్పటికీ, మూలంలో నేరుగా ‘అర్పించాడు’ అని లేదు; అందువల్ల ఆ భావాన్ని అనవసరంగా స్పష్టీకరించలేదు.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: ఈ కథన సందర్భంలో חֹתֵן మోషే భార్య తండ్రిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మామ’ సహజంగా, సంక్షిప్తంగా ఈ బంధాన్ని తెలియజేస్తుంది.
- source_word: עֹלָה
  choice: ఒక దహనబలి
  rationale: עֹלָה పూర్తిగా కాల్చి అర్పించే బలికి వాడే స్థిరమైన బలి పదం; ‘దహనబలి’ తెలుగులో స్పష్టమైన సంప్రదాయ సమానార్థకం.
- source_word: זְבָחִים
  choice: బలులు
  rationale: ఈ బహువచన పదం ప్రత్యేకమైన దహనబలికి భిన్నంగా విస్తృతమైన బలులను సూచిస్తుంది. ‘బలులు’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: לֵאלֹהִים
  choice: దేవుని కోసం
  rationale: ל ఉపసర్గ ఇక్కడ బలులు దేవునికి ఉద్దేశించబడ్డాయని సూచిస్తుంది. ‘దేవుని కోసం’ మూలంలోని ఉద్దేశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: అహరోను, ఇశ్రాయేలు పెద్దలందరూ వచ్చారు
  rationale: మూలంలో క్రియ ఏకవచన రూపంలో ముందున్నప్పటికీ, అహరోనుతో పాటు పెద్దలందరూ కలిపి కర్తలు. తెలుగులో సహజ వాక్యనిర్మాణం కోసం బహువచన క్రియ వాడబడింది.
- source_word: לֶאֱכָל לֶחֶם
  choice: రొట్టె తినడానికి[a]
  rationale: అక్షరార్థంగా ‘రొట్టె తినడానికి.’ ఇది భోజనం పంచుకోవడాన్ని సూచించే హీబ్రూ నుడికారం కావచ్చు; మూలంలోని దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: మోషే మామతో కలిసి
  rationale: మూలం యిత్రో పేరును మళ్లీ వాడకుండా బంధపదాన్ని పునరావృతం చేస్తుంది. అనువాదం కూడా ఆ కథన లక్షణాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో.’ ఈ ఆరాధనాత్మక సందర్భంలో ‘దేవుని సన్నిధిలో’ సహజమైన, గంభీరమైన తెలుగు.
theological_decisions:
- issue: బలుల సందర్భంలో భోజన పదబంధం యొక్క భావం
  choice: ఇది యిత్రో అర్పణల అనంతరం దేవుని సన్నిధిలో పంచుకున్న బలి సంబంధమైన సామూహిక భోజనాన్ని సూచిస్తుంది.
  alternative: వారు సాధారణ రొట్టె మాత్రమే కలిసి తిన్నారని ఈ పదబంధం చెప్పవచ్చు.
  rationale: బలుల ప్రస్తావన, అహరోను మరియు పెద్దల భాగస్వామ్యం, ‘దేవుని సన్నిధిలో’ అనే మాటలు కలిసి పవిత్ర భోజన సందర్భాన్ని బలంగా సూచిస్తాయి. అయినప్పటికీ ప్రధాన పాఠ్యం ‘రొట్టె తినడానికి’ అనే మూల పదబంధాన్ని ఉంచి దాని సహజమైన సందిగ్ధతను కాపాడుతుంది.
- issue: אֱלֹהִים పదానికి ఉద్దేశిత వ్యక్తి
  choice: దేవుడు
  alternative: దేవతలు
  rationale: ఇశ్రాయేలు దేవుని గురించిన ఈ కథన సందర్భంలో ఏకవచన వ్యక్తే ఉద్దేశించబడ్డాడు; అందువల్ల ‘దేవుడు’ సరైన పఠనం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి పాటించబడింది. బలి సంబంధ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, ‘రొట్టె తినడానికి’ అనే మూల నుడికారాన్ని పాదసూచికతో సంరక్షించాం.
