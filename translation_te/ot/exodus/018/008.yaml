id: EXO.18.8
reference: Exodus 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: te
  text: మోషే తన మామగారికి, ఇశ్రాయేలు నిమిత్తం[a] యాహ్వే ఫరోకు, ఐగుప్తుకు చేసినదంతా, దారిలో వారికి ఎదురైన కష్టమంతా[b], యాహ్వే వారిని ఎలా విడిపించాడో వివరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలు కారణంగా,’ ‘ఇశ్రాయేలును బట్టి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దారిలో వారికి సంభవించిన ఇబ్బందులన్నీ’ లేదా ‘ప్రయాణంలో వారికి కలిగిన బాధలన్నీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: వివరించాడు
  rationale: పియేల్ రూపంలోని ספר ఇక్కడ జరిగిన విషయాలను వివరంగా చెప్పడం లేదా వృత్తాంతంగా తెలియజేయడం అనే భావాన్ని ఇస్తుంది; ‘వివరించాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: חֹתְנוֹ
  choice: తన మామకు
  rationale: సందర్భంలో ఇది మోషే భార్య తండ్రి యిత్రోను సూచిస్తుంది. ఆధునిక తెలుగులో ‘మామ’ సహజమైన బంధుత్వ పదం.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: యాహ్వే ఫరోకు, ఐగుప్తుకు చేసినదంతా
  rationale: లామెద్ ఉపసర్గను నేరుగా ‘కు’తో నిలుపుతూ, ‘వ్యతిరేకంగా’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును బట్టి
  rationale: ఈ నుడికారం ఇశ్రాయేలు కారణంగా లేదా ఇశ్రాయేలు నిమిత్తం అనే భావ పరిధిని కలిగి ఉంది; ‘బట్టి’ ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: הַתְּלָאָה
  choice: కష్టమంతా
  rationale: ఈ ఏకవచన నామవాచకం సమష్టిగా కష్టం, శ్రమ, ఇబ్బంది అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘కష్టమంతా’ సహజమైన సమష్టి ప్రయోగం.
- source_word: מְצָאָתַם
  choice: వారికి ఎదురైన
  rationale: హీబ్రూలో కష్టం వారిని ‘కనుగొన్నది’ అనే సజీవ ప్రయోగం ఉంది; ‘ఎదురైన’ దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: ప్రయాణమధ్యంలో అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּצִּלֵם
  choice: వారిని ఎలా విడిపించాడో
  rationale: נצל ప్రమాదం లేదా ఆపద నుంచి రక్షించడం, విడిపించడం అనే భావాన్ని ఇస్తుంది; ‘విడిపించాడు’ నిర్గమ సందర్భానికి సరిపోతూ అనవసరమైన సిద్ధాంతార్థాన్ని రుద్దదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ రూపంలో నిలిపాం.
- issue: עַל אֹדוֹת יִשְׂרָאֵל లో కారణం మరియు ప్రయోజనం మధ్య భావసూక్ష్మత
  choice: ఇశ్రాయేలును బట్టి
  alternative: ఇశ్రాయేలు నిమిత్తం
  rationale: ఈ హీబ్రూ నుడికారం ‘ఇశ్రాయేలు కారణంగా’ మరియు ‘ఇశ్రాయేలు మేలుకోసం’ అనే రెండింటికీ దగ్గరగా ఉండగలదు. ప్రధాన పాఠ్యం ఏ ఒక్క భావాన్నీ అతిగా నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను ఎంచుకున్నాం. మూలంలోని కారణం/ప్రయోజనం భావసూక్ష్మతను పాదసూచికతో నిలిపాం.
