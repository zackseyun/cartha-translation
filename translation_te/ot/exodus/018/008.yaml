- from: మోషే తన మామకు, ఇశ్రాయేలును బట్టి[a] యాహ్వే ఫరోకు, ఐగుప్తుకు చేసినదంతా, దారిలో వారికి ఎదురైన కష్టమంతా[b], యాహ్వే వారిని ఎలా విడిపించాడో వివరించాడు.
  to: మోషే తన మామగారికి, ఇశ్రాయేలు నిమిత్తం[a] యాహ్వే ఫరోకు, ఐగుప్తుకు చేసినదంతా, దారిలో వారికి ఎదురైన కష్టమంతా[b], యాహ్వే వారిని ఎలా విడిపించాడో వివరించాడు.
  rationale: బంధుత్వసంబంధాన్ని ఆధునిక తెలుగులో అసందిగ్ధంగా చేయడానికి ‘మామకు’ను ‘మామగారికి’గా సవరించాం. ఇశ్రాయేలుతో సంబంధాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తపరచడానికి ‘ఇశ్రాయేలును బట్టి’ని ‘ఇశ్రాయేలు నిమిత్తం’గా మార్చి, కారణసూచక మరియు విస్తృత ప్రత్యామ్నాయాలను పాదసూచికలో భద్రపరిచాం. వాక్యార్థం, దైవనామం, మరియు పాదసూచిక గుర్తుల స్థానాలు నిలిపాం.
