    rationale: నువ్వు ఈ కార్యాన్ని చేసి can imply that Moses first performs the action and then God commands him. The Hebrew presents doing the matter and God’s command as coordinated conditions. నీవు ఈ కార్యాన్ని చేస్తే makes the conditional force clear.
  - severity: low
    issue: Register and referential nuance
    rationale: నువ్వు is more conversational than the stated respectful register. Also, అలా in దేవుడు నీకు అలా ఆజ్ఞాపిస్తే naturally links God’s command to the proposed procedure without adding theological interpretation.
