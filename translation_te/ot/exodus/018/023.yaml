source:
  edition: WLC
  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: te
  text: నీవు ఈ కార్యాన్ని[a] చేస్తే, దేవుడు నీకు అలా ఆజ్ఞాపిస్తే, నీవు నిలబడగలవు[b]; ఈ ప్రజలందరూ కూడా తమ తమ చోటికి[c] క్షేమంగా[d] చేరుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ విషయాన్ని’ లేదా ‘ఈ పథకాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: ‘నిలబడగలవు’ అంటే ఈ సందర్భంలో భారాన్ని తట్టుకొని బాధ్యతను కొనసాగించగలవు అని భావం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘అతని చోటికి’; సమూహంగా చెప్పబడిన ప్రజల్లో ప్రతి ఒక్కరూ తమ చోటికి చేరడమే భావం.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘శాంతిగా.’ హీబ్రూ పదం శాంతి, క్షేమం, సురక్షిత స్థితి అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ఈ కార్యాన్ని
  rationale: דָּבָר ఇక్కడ యిత్రో ఇప్పుడే ప్రతిపాదించిన కార్యవిధానాన్ని సూచిస్తుంది. ‘కార్యం’ అనేది సందర్భానికి సహజంగా ఉండి, మూలంలోని ‘విషయం/పని’ అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: దేవుడు నీకు ఆజ్ఞాపిస్తే
  rationale: 'ఈ వాక్యభాగాన్ని మొదటి షరతుతో కలిసిన అదనపు షరతుగా గ్రహించడం సందర్భానికి సరిపోతుంది: యిత్రో సలహాను మోషే అమలు చేయడం దేవుని ఆజ్ఞకు లోబడి ఉంటుంది.'
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: నువ్వు నిలబడగలవు
  rationale: עמד యొక్క ప్రాథమిక అర్థమైన ‘నిలబడు’ను నిలుపుతూ, భారాన్ని తట్టుకొని బాధ్యతలో కొనసాగగల సామర్థ్యాన్ని సందర్భం తెలియజేయనిస్తుంది.
- source_word: כָּל־הָעָם הַזֶּה
  choice: ఈ ప్రజలందరూ
  rationale: హీబ్రూలోని సమూహవాచక ఏకవచనాన్ని తెలుగులో సహజమైన బహువచన నిర్మాణంతో వ్యక్తం చేస్తుంది; ‘ఈ’ అనే సూచనను కాపాడుతుంది.
- source_word: עַל־מְקֹמוֹ
  choice: తమ తమ చోటికి
  rationale: అక్షరార్థంగా ‘అతని చోటికి’ అని ఉన్నా, సమూహవాచకమైన ‘ప్రజలు’తో ఇది విభజనాత్మక భావం కలిగి ఉంది—ప్రతి ఒక్కరూ తమకు తగిన చోటికి వెళ్లడం.
- source_word: יָבֹא בְשָׁלוֹם
  choice: క్షేమంగా చేరుకుంటారు
  rationale: בוא గమ్యస్థానానికి రావడం/చేరడం సూచిస్తుంది; שָׁלוֹם ఇక్కడ శాంతితో పాటు క్షేమం, సురక్షితమైన పరిణామం అనే భావాన్నీ కలిగి ఉంది.
theological_decisions:
- issue: యిత్రో సలహాకు దేవుని ఆజ్ఞతో ఉన్న సంబంధం
  choice: ‘దేవుడు నీకు ఆజ్ఞాపిస్తే’ అని అదనపు షరతుగా అనువదించడం
  alternative: ‘దేవుడు నీకు ఆజ్ఞాపిస్తాడు’ లేదా ‘దేవుడు నీకు ఆజ్ఞాపించుగాక’
  rationale: హీబ్రూ నిర్మాణం మొదటి ‘అయితే’ షరతు పరిధిలో దేవుని ఆజ్ఞను మరో అవసరమైన షరతుగా చదవడానికి అనుకూలంగా ఉంది. దీనివల్ల యిత్రో సలహా దేవుని అనుమతికి అతీతమైన స్వతంత్ర అధికారంగా కనిపించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మోషేను ఉద్దేశించిన ఏకవచన సంభాషణకు ‘నువ్వు/నీకు’ వాడబడింది. మూలంలోని ‘నిలబడు’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి దాని సందర్భార్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం; సమూహవాచకంలోని విభజనాత్మక భావాన్ని ‘తమ తమ’ ద్వారా సహజంగా తెలిపాం.
