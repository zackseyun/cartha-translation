source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לְ/חֹתְנ֑/וֹ כִּֽי יָבֹ֥א אֵלַ֛/י הָ/עָ֖ם לִ/דְרֹ֥שׁ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: te
  text: 'మోషే తన మామగారితో ఇలా అన్నాడు: “ఎందుకంటే ప్రజలు దేవుణ్ణి వెదకడానికి[a] నా దగ్గరకు వస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుణ్ణి సంప్రదించడానికి,” లేదా “దేవుని తీర్పును అడగడానికి.” ఈ హీబ్రూ పదబంధం మార్గదర్శకత్వం లేదా తీర్పు కోసం దేవుణ్ణి సంప్రదించడం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר అనే సాధారణ కథన క్రియను సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష సంభాషణ శైలిలో అందిస్తుంది.
- source_word: לְחֹתְנוֹ
  choice: తన మామతో
  rationale: ఈ సందర్భంలో חֹתֵן మోషే భార్య తండ్రి అయిన యిత్రోను సూచిస్తుంది; తెలుగులో ‘మామ’ సహజమైన బంధుత్వ పదం.
- source_word: כִּי
  choice: (తెలుగులో ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: ఇది యిత్రో ప్రశ్నకు కారణాన్ని తెలిపే జవాబు. తెలుగులో “ప్రజలు ... వస్తారు” అనే వాక్యమే సందర్భానుసారంగా కారణాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎందుకంటే’ అని మొదలుపెట్టడం ఒంటరి వచనంలో అసహజంగా ఉంటుంది.
- source_word: יָבֹא אֵלַי הָעָם
  choice: ప్రజలు ... నా దగ్గరికి వస్తారు
  rationale: בוא + אֶל మోషే వైపు రావడాన్ని సూచిస్తుంది; అసంపూర్ణ క్రియ ఇక్కడ అలవాటుగా జరిగే కార్యాన్ని తెలుపుతుంది కాబట్టి వర్తమాన కాలం వాడబడింది.
- source_word: לִדְרֹשׁ
  choice: విచారించడానికి
  rationale: דרשׁ అనే పదం ఇక్కడ దేవుని వద్ద మార్గదర్శకత్వం లేదా తీర్పు అడగడం అనే భావాన్ని కలిగి ఉంటుంది. ‘విచారించు’ ఆ సంప్రదింపుల భావాన్ని నిలుపుతూ, కేవలం సాధారణంగా వెదకడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: హీబ్రూలో ప్రత్యక్షంగా ‘దేవుడు’ అనే పదమే ఉంది; ‘దేవుని చిత్తం’ లేదా ‘దైవిక తీర్పు’ అని విస్తరించకుండా స్పష్టమైన దైవసూచనను నిలిపింది.
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים అనే పదబంధం
  choice: దేవుణ్ణి విచారించడానికి
  alternative: దేవుణ్ణి వెదకడానికి; దేవుని తీర్పు అడగడానికి
  rationale: వివాదాల సందర్భంలో ఈ హీబ్రూ పదబంధం దేవుని మార్గదర్శకత్వం లేదా తీర్పు కోసం సంప్రదించడాన్ని సూచించవచ్చు; అదే సమయంలో దాని విస్తృతమైన ‘దేవుణ్ణి వెదకడం’ భావాన్ని పూర్తిగా తొలగించకూడదు. ప్రధాన పాఠం సంప్రదింపుల భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉంచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మామ’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే బంధుత్వ పదం. పాదసూచిక గుర్తు సంబంధిత పదబంధం ముగింపులో ప్రధాన పాఠంలో ఉంచబడింది.
