source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: te
  text: 'యిత్రో ఇలా అన్నాడు: “మిమ్మల్ని ఐగుప్తీయుల చేతిలోనుండి, ఫరో చేతిలోనుండి విడిపించి, ఐగుప్తీయుల అధికారం కిందనుండి ప్రజలను విడిపించిన యాహ్వే స్తుతింపబడుగాక!”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాహ్వే ధన్యుడు” లేదా “యాహ్వే స్తుతింపబడినవాడు” అని కూడా అనువదించవచ్చు. హీబ్రూ దీవెన సూత్రం ప్రకటనగానూ, స్తోత్ర ఆకాంక్షగానూ అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో మొదట “ఐగుప్తు/ఐగుప్తీయుల చేతిలోనుండి,” తరువాత “ఐగుప్తు/ఐగుప్తీయుల చేయి కిందనుండి” అని ఉంది. ‘చేయి’ ఇక్కడ అధికారం లేదా అణచివేసే నియంత్రణకు రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; వావ్-క్రమబద్ధ రూపానికి అవసరానికి మించిన కాలార్థాన్ని జోడించదు.
- source_word: יִתְרוֹ
  choice: యిత్రో
  rationale: హీబ్రూ పేరైన Yitrō ఉచ్చారణను తెలుగు లిపిలో సన్నిహితంగా ప్రతిబింబిస్తుంది.
- source_word: בָּרוּךְ יְהוָה
  choice: యెహోవా స్తుతింపబడుగాక
  rationale: దీవెన/స్తుతి సూత్రంలోని స్తోత్రాత్మక బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הִצִּיל
  choice: విడిపించిన
  rationale: విరోధ శక్తి లేదా నియంత్రణ నుంచి తప్పించి విడుదల చేయడం అనే హిఫిల్ రూపార్థాన్ని నిర్గమ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: אֶתְכֶם
  choice: మిమ్మల్ని
  rationale: రెండవ పురుష బహువచన కర్మరూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: מִיַּד מִצְרַיִם
  choice: ఐగుప్తీయుల చేతిలోనుండి
  rationale: יַד అనే ‘చేయి’ రూపకాన్ని నిలుపుతూ, מִצְרַיִם ఇక్కడ సూచించే సామూహిక ప్రజార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פַּרְעֹה
  choice: ఫరో
  rationale: రాజబిరుదుకు ప్రామాణిక ఆధునిక తెలుగు రూపం.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: ఇశ్రాయేలు సమూహాన్ని సూచించే עם కు సహజమైన సమానార్థకం.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: ఐగుప్తీయుల అధికారం కిందనుండి
  rationale: ‘చేయి కింద’ అనే హీబ్రూ రూపకం సూచించే అణచివేసే ఆధిపత్యాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తించదగిన రూపం; ఉచ్చారణ పునర్నిర్మాణాన్ని సూచించే ‘యాహ్వే’ను పాదసూచికలో చూపించాం.
- issue: בָּרוּךְ అనే దీవెన సూత్రం
  choice: స్తుతింపబడుగాక
  alternative: స్తుతింపబడినవాడు / ధన్యుడు
  rationale: హీబ్రూ నిష్క్రియ కృదంతం ప్రకటనగానూ, స్తోత్ర ఆకాంక్షగానూ అర్థమయ్యే అవకాశాన్ని కలిగి ఉంది. ప్రధాన పాఠం సహజమైన తెలుగు స్తోత్ర సూత్రాన్ని వాడుతుంది; ఇతర సాధ్యమైన భావాలను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మొదటి ‘చేతిలోనుండి’ వద్ద మూల రూపకాన్ని నిలిపి, రెండవ మిత్తחת్ యాద్‌ను సహజత కోసం ‘అధికారం కిందనుండి’గా ఇచ్చి, పాదసూచికలో పూర్తి హీబ్రూ రూపకాన్ని నమోదు చేశాం.
