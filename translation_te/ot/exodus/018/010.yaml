- from: 'యిత్రో ఇలా అన్నాడు: “మిమ్మల్ని ఐగుప్తీయుల చేతిలోనుండి, ఫరో చేతిలోనుండి విడిపించిన యెహోవా స్తుతింపబడుగాక![a] ఐగుప్తీయుల అధికారం కిందనుండి ప్రజలను విడిపించినవాడు ఆయనే.”[b]'
  to: 'యిత్రో ఇలా అన్నాడు: “మిమ్మల్ని ఐగుప్తీయుల చేతిలోనుండి, ఫరో చేతిలోనుండి విడిపించి, ఐగుప్తీయుల అధికారం కిందనుండి ప్రజలను విడిపించిన యాహ్వే స్తుతింపబడుగాక!”[a][b]'
