id: EXO.18.4
reference: Exodus 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: te
  text: ఇతర కుమారుని పేరు ఎలీయెజెరు; ఎందుకంటే నా తండ్రి దేవుడు నాకు సహాయకుడై, ఫరో ఖడ్గం నుండి నన్ను రక్షించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: మరొక కుమారుని పేరు
  rationale: మునుపటి వచనంలో ఒక కుమారుని పేరు చెప్పిన తర్వాత הָאֶחָד సందర్భానుసారంగా ‘మరొకడు’ అని సూచిస్తుంది. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘కుమారుని’ చేర్చబడింది.
- source_word: אֱלִיעֶזֶר
  choice: ఎలీయెజెరు
  rationale: వ్యక్తిపేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది; పేరులోని ‘నా దేవుడు సహాయం’ అనే భావం తరువాతి వివరణతో ప్రతిధ్వనిస్తుంది.
- source_word: כִּי
  choice: అనే కారణంగా
  rationale: పేరు పెట్టడానికి కారణాన్ని పరిచయం చేసే హేతువాచక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי אָבִי
  choice: నా తండ్రి దేవుడు
  rationale: హీబ్రూ నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, ‘నా తండ్రి ఆరాధించిన దేవుడు’ అనే సంబంధాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: בְּעֶזְרִי
  choice: నాకు సహాయకుడై
  rationale: עֵזֶר అనే నామవాచకంలోని ‘సహాయం/సహాయకుడు’ భావాన్ని నిలుపుతూ, పేరుతో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: וַיַּצִּלֵנִי
  choice: నన్ను రక్షించాడు
  rationale: נצל యొక్క ప్రమాదం నుండి విడిపించడం లేదా కాపాడడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: ఫరో ఖడ్గం నుండి
  rationale: మూలంలోని రూపకాన్ని యథాతథంగా నిలుపుతుంది; ఇది ఫరో యొక్క ప్రాణాంతక బెదిరింపు లేదా అధికారాన్ని సూచించవచ్చు.
theological_decisions:
- issue: పేరు వివరణలో స్పష్టంగా లేని వక్త మరియు మాటల క్రియ
  choice: వివరణను ఉద్ధరణగా ఇచ్చి, తెలుగు వాక్యనిర్మాణం కోసం ‘అనే కారణంగా అతనికి ఆ పేరు పెట్టాడు’ అని చేర్చడం
  alternative: 'ఎటువంటి మాటల క్రియ లేకుండా: ‘మరొకని పేరు ఎలీయెజెరు; ఎందుకంటే నా తండ్రి దేవుడు నాకు సహాయకుడై...’'
  rationale: హీబ్రూలో ‘అతడు అన్నాడు’ లేదా ‘పేరు పెట్టాడు’ అనే క్రియ లేదు. అయితే ఇది పేరు పెట్టడానికి ఇచ్చిన వివరణ అని తెలుగులో స్పష్టంగా తెలియజేయడానికి స్వల్పంగా పూరించబడింది; మూలంలో లేని ‘అతడు అన్నాడు’ మాత్రం చేర్చలేదు. ఈ పూరణను పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఖడ్గం’ అనే బైబిలీయ రూపకాన్ని నిలిపి, ‘సహాయకుడై’ ద్వారా ఎలీయెజెరు పేరుతోనున్న భావసంబంధాన్ని కాపాడింది.
