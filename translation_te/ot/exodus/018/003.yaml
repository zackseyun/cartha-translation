source:
  edition: WLC
  text: וְ/אֵ֖ת שְׁנֵ֣י בָנֶ֑י/הָ אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אֶחָד֙ גֵּֽרְשֹׁ֔ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: te
  text: ఆమె ఇద్దరు కుమారులను[a] తీసుకొచ్చాడు. వారిలో ఒకరి పేరు గేర్షోము; ఎందుకంటే మోషే, “నేను పరాయి దేశంలో పరదేశిగా ఉన్నాను” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను పరాయి దేశంలో తాత్కాలిక నివాసిగా ఉన్నాను.” హీబ్రూ గేర్ అనే పదం తాత్కాలిక నివాసి, బయటి వ్యక్తి, లేదా విదేశీయుడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: ఆమె ఇద్దరు కుమారులను కూడా తీసుకొచ్చాడు
  rationale: ఈ వాక్యం ముందటి వచనంలోని క్రియకు కొనసాగింపుగా ఉంది; హీబ్రూ ప్రత్యక్ష కర్మ సూచికను విడిగా అనువదించకుండా, తెలుగులో భావపూర్ణ వాక్యంగా ఉండేందుకు ముందటి వచనం నుంచి ‘తీసుకొచ్చాడు’ను పూరించాం.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: వారిలో ఒకని పేరు
  rationale: ఇది ఇద్దరిలో ఒక కుమారుణ్ణి గుర్తిస్తుంది; ‘మొదటివాడు’ అని క్రమాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: כִּי אָמַר
  choice: ఎందుకంటే మోషే ... అని చెప్పాడు
  rationale: כִּי పేరు పెట్టడానికి కారణాన్ని పరిచయం చేస్తుంది. హీబ్రూలో అంతర్భూతంగా ఉన్న కర్తను సందర్భం ప్రకారం ‘మోషే’ అని స్పష్టం చేయడం తెలుగులో సహజంగా ఉంటుంది.
- source_word: גֵּר
  choice: పరదేశిగా
  rationale: గేర్ అనేది తనది కాని దేశంలో నివసించే బయటి వ్యక్తి లేదా తాత్కాలిక నివాసిని సూచిస్తుంది; ‘పరదేశి’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఈ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הָיִיתִי
  choice: ఉన్నాను
  rationale: హీబ్రూ కతల్ రూపం గతస్థితిని తెలియజేస్తుంది; ఉల్లేఖనంలోని సహజమైన తెలుగు ప్రయోగంలో ‘ఉన్నాను’ ఆ స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: పరాయి దేశంలో
  rationale: నָכְרִיָּה అంటే పరాయి లేదా విదేశీ; ‘పరాయి దేశం’ అనేది తన స్వదేశం కాని ప్రదేశమనే భావాన్ని సహజంగా అందిస్తుంది.
