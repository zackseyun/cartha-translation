  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వచన గౌరవాన్ని నిలుపుతూ రూపొందించాం. మూలంలోని గేర్/నָכְרִיָּה పదప్రయోగ సంబంధాన్ని ‘పరదేశి/పరాయి దేశం’తో సాధ్యమైనంతవరకు నిలిపాం.
