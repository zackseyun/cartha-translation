  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: te
  text: 'మోషే మామగారు అతనితో ఇలా అన్నారు: “నువ్వు చేస్తున్న పని[a] మంచిది కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానువాదంగా, “నువ్వు చేస్తున్న విషయం మంచిది కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన సంభాషణ పరిచయంగా ‘అన్నాడు’ సరిపోతుంది.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: ఈ నిర్మాణం మోషేకు వివాహ సంబంధమైన మామను సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘మోషే మామ’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: సర్వనామం మోషేను తిరిగి సూచిస్తుంది. మాట చెప్పే సందర్భంలో తెలుగు వాడుకకు ‘అతనితో’ సహజంగా ఉంటుంది.
- source_word: לֹא טוֹב
  choice: మంచిది కాదు
  rationale: טוֹב యొక్క సాధారణ మూల్యాంకన భావాన్ని నేరుగా నిలుపుతుంది; ‘సరైంది కాదు’ లేదా ‘మేలైనది కాదు’ అని ప్రత్యేకంగా అర్థాన్ని కుదించదు.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: నువ్వు చేస్తున్న పని
  rationale: దీనికి అక్షరార్థంగా ‘నువ్వు చేస్తున్న విషయం’ అని చెప్పవచ్చు; ‘పని’ అనేది సందర్భానుసారంగా సహజమైన తెలుగు, అలాగే కొనసాగుతున్న చర్యను ‘చేస్తున్న’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ వాడటం హీబ్రూ אַתָּהను ప్రతిబింబిస్తుంది; ఇది అవమానార్థకం కాదు. ఫుట్‌నోట్ గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
