  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: te
  text: వారు ఎల్లప్పుడూ ప్రజలకు న్యాయం తీర్చేవారు. ప్రతి క్లిష్టమైన వివాదాన్ని మోషే వద్దకు తీసుకువచ్చేవారు[a]; అయితే ప్రతి చిన్న వివాదానికీ వారే తీర్పు తీర్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి కఠినమైన కేసు ... ప్రతి స్వల్పమైన కేసు.” హీబ్రూ న్యాయ సందర్భంలో క్లిష్టమైన కేసులను స్వల్పమైన కేసులతో వ్యతిరేకంగా ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: న్యాయం తీర్చేవారు
  rationale: שׁפט అనే క్రియ ఇక్కడ నియమించబడిన న్యాయాధిపతులు క్రమంగా నిర్వర్తించిన పనిని సూచిస్తుంది. తెలుగు అలవాటు గతకాల రూపం ఆ నిరంతర విధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలకు
  rationale: עם ఇక్కడ ఇశ్రాయేలు సమాజమంతటినీ సూచిస్తుంది. שׁפט את־העם అనే భావాన్ని సహజ తెలుగులో ‘ప్రజలకు న్యాయం తీర్చడం’గా ఇచ్చాం.
- source_word: בְּכָל־עֵת
  choice: ఎల్లప్పుడూ
  rationale: ఈ పదబంధం ఒక్క సందర్భాన్ని కాక, న్యాయం కోసం వారు నిరంతరం అందుబాటులో ఉండడాన్ని సూచిస్తుంది.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: ప్రతి క్లిష్టమైన వివాదం
  rationale: న్యాయ సందర్భంలో דָּבָר అనేది తీర్పు కోరే విషయం లేదా వివాదాన్ని సూచిస్తుంది; קָשֶׁה దాని క్లిష్టతను తెలియజేస్తుంది. ఏకవచన నిర్దిష్ట రూపం ఇక్కడ వర్గార్థకంగా ఉన్నందున ‘ప్రతి’ అని అనువదించాం.
- source_word: יְבִיאוּן אֶל־מֹשֶׁה
  choice: మోషే దగ్గరికి తీసుకువచ్చేవారు
  rationale: ఈ రూపం పదేపదే జరిగే ఆచారబద్ధమైన చర్యను సూచిస్తుంది; తెలుగు అలవాటు గతకాల రూపం దానిని స్పష్టంగా అందిస్తుంది.
- source_word: כָל־הַדָּבָר הַקָּטֹן
  choice: ప్రతి చిన్న వివాదం
  rationale: קָטֹן ఇక్కడ కష్టమైన వివాదాలకు విరుద్ధంగా తక్కువ క్లిష్టతగల వివాదాలను సూచిస్తుంది. ‘చిన్న’ అనే పదం మూలంలోని నేరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: వారే తీర్పు తీర్చేవారు
  rationale: స్వతంత్ర సర్వనామమైన הֵם ఇచ్చే ఉద్ఘాటనను ‘వారే’ కాపాడుతుంది; చిన్న వివాదాలను మోషేకు పంపకుండా ఆ న్యాయాధిపతులే పరిష్కరించేవారని తెలియజేస్తుంది.
