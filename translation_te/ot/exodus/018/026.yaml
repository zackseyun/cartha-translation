translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. న్యాయ సందర్భాన్ని స్పష్టంచేయడానికి דָּבָר ను ‘వివాదం’గా ఇచ్చాం; ‘క్లిష్టమైన/చిన్న’ అనే వ్యత్యాసంతో మూలపాఠంలోని ఉద్రిక్తతను నిలిపాం. అన్ని క్రియల్లో పునరావృతమైన గత చర్య భావాన్ని ‘-ేవారు’ రూపంతో వ్యక్తం చేశాం.
