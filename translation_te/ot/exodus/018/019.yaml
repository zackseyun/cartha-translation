source:
  edition: WLC
  text: עַתָּ֞ה שְׁמַ֤ע בְּ/קֹלִ/י֙ אִיעָ֣צְ/ךָ֔ וִ/יהִ֥י אֱלֹהִ֖ים עִמָּ֑/ךְ הֱיֵ֧ה אַתָּ֣ה לָ/עָ֗ם מ֚וּל הָֽ/אֱלֹהִ֔ים וְ/הֵבֵאתָ֥ אַתָּ֛ה אֶת הַ/דְּבָרִ֖ים אֶל הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: te
  text: ఇప్పుడు నా మాట విను; నేను నీకు సలహా ఇస్తాను. దేవుడు నీతో ఉండుగాక.[a] నీవు ప్రజల పక్షాన దేవుని సన్నిధిలో ఉండు,[b] విషయాలను[c] దేవుని వద్దకు తీసుకురా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు నీతో ఉండును.’ హీబ్రూ క్రియారూపం ఆశీర్వాదం లేదా ఆకాంక్షను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు దేవుని సన్నిధిలో ప్రజలకు ప్రతినిధిగా ఉండు.’
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ ‘విషయాలు’ అంటే తీర్పు కోసం ప్రజలు తీసుకువచ్చే వ్యవహారాలు లేదా వివాదాలు.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యిత్రో తదుపరి ఉపదేశాన్ని ప్రారంభించే కాలసూచక, సంభాషణాత్మక పదంగా సహజంగా ఉంది.
- source_word: שְׁמַע בְּקֹלִי
  choice: నా మాట విను
  rationale: హీబ్రూ నుడికారంలోని ‘నా స్వరం విను’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘లోబడు’ అని అతిగా బలపరచదు.
- source_word: אִיעָצְךָ
  choice: నేను నీకు సలహా ఇస్తాను
  rationale: יעץ అనే క్రియలోని సలహా లేదా ఆలోచన చెప్పే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: దేవుడు నీతో ఉండుగాక
  rationale: హీబ్రూ జస్సివ్ రూపంలోని ఆశీర్వాదం లేదా ఆకాంక్ష భావాన్ని తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: הֱיֵה אַתָּה לָעָם
  choice: నీవు ప్రజల పక్షాన ... ఉండు
  rationale: అక్షరార్థమైన ‘ప్రజల కొరకు ఉండు’ అనే నిర్మాణాన్ని తెలుగులో అర్థవంతంగా చేస్తూ, మోషే ప్రతినిధి పాత్రను సూచిస్తుంది; దానిని అతిగా న్యాయపరమైన పదజాలంతో నిర్వచించదు.
- source_word: מוּל הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: ‘దేవుని ఎదుట’ అనే మూలభావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהֵבֵאתָ
  choice: తీసుకురా
  rationale: ఆజ్ఞాత్మక సందర్భంలో కొనసాగుతున్న నిర్దేశాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో అందిస్తుంది.
- source_word: הַדְּבָרִים
  choice: వారి విషయాలను
  rationale: דבר యొక్క విస్తృత అర్థాన్ని నిలుపుతూ, సందర్భంలో ప్రజలు తీర్పుకోసం తెచ్చే వ్యవహారాలు లేదా వివాదాలని సూచిస్తుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవుని దగ్గరకు
  rationale: మోషే ఆ విషయాలను దేవుని వద్దకు తీసుకెళ్లే చర్యను స్పష్టంగా, సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: కథన సందర్భంలో אֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: నిజమైన దేవుడు
  rationale: ఈ సందర్భంలో పదం ఇశ్రాయేలు దేవునినే ఏకవచన భావంలో సూచిస్తుంది; అదనపు వివరణ లేకుండా ‘దేవుడు’ అనడం సరైనది.
- issue: మోషే మధ్యవర్తిత్వ లేదా ప్రతినిధి పాత్రను ఎంతవరకు స్పష్టీకరించాలి
  choice: నీవు ప్రజల పక్షాన దేవుని సన్నిధిలో ఉండు
  alternative: నీవు దేవుని సన్నిధిలో ప్రజలకు ప్రతినిధిగా ఉండు
  rationale: ప్రధాన పాఠం మూలంలోని సాపేక్షంగా విస్తృత నిర్మాణాన్ని నిలుపుతుంది; ‘ప్రతినిధి’ అనేది సరైన సందర్భార్థమైనా, దానిని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచడం అసలు వాక్యంలోని విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నా మాట విను,’ ‘ఉండుగాక,’ ‘ప్రజల పక్షాన’ వంటి రూపాలు మూలంలోని నుడికారం, ఆశీర్వాద భావం, ప్రతినిధిత్వంలోని ఉద్దేశపూర్వక విస్తృతతను సమతుల్యంగా నిలుపుతాయి.
