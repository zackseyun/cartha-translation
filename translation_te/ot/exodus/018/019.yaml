  to: ఇప్పుడు నా మాట విను; నేను నీకు సలహా ఇస్తాను. దేవుడు నీతో ఉండుగాక.[a] నీవు ప్రజల పక్షాన దేవుని సన్నిధిలో ఉండు,[b] విషయాలను[c] దేవుని వద్దకు తీసుకురా.
  rationale: మూలంలో స్పష్టంగా లేని ‘వారి’ అనే స్వత్వ సూచనను తొలగించాం. ‘దేవుని దగ్గరకు’ను ‘దేవుని వద్దకు’గా మార్చడం ద్వారా దేవుని ఎదుట వ్యవహారాలను సమర్పించే భావం సహజంగా, అధికారికంగా వ్యక్తమవుతుంది. పాదటిప్పణి a హీబ్రూ జస్సివ్ యొక్క ఆశీర్వాద/ఆకాంక్ష భావాన్ని స్పష్టంగా తెలియజేసేలా సవరించబడింది.
