id: EXO.18.1
reference: Exodus 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: te
  text: మిద్యాను యాజకుడైన, మోషే మామయైన యిత్రో, దేవుడు మోషే కొరకు, తన ప్రజలైన ఇశ్రాయేలు[a] కొరకు చేసినదంతా—యెహోవా ఇశ్రాయేలును ఐగుప్తు నుండి బయటికి తీసుకువచ్చిన సంగతిని—విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన ప్రజలైన ఇశ్రాయేలు’ అనే పదబంధంలోని ‘తన’ను మోషేను సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు. హెబ్రీలోని సర్వనామ ప్రత్యయం వ్యాకరణపరంగా మోషేను కూడా సూచించవచ్చు; అయితే సందర్భంలో అది దేవుణ్ణి సూచించడమే ఎక్కువ సంభావ్యం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సందర్భమే ఆ క్రమాన్ని స్పష్టం చేస్తుంది కాబట్టి మూలంలో లేని ‘అప్పుడు/ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: כֹהֵן מִדְיָן
  choice: మిద్యాను యాజకుడు
  rationale: నిర్మాణ సంబంధ పదబంధం యిత్రో పదవిని, మిద్యానుతో అతని అనుబంధాన్ని గుర్తిస్తుంది.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: ఈ సందర్భంలో వివాహం ద్వారా ఏర్పడిన సంబంధం, ప్రత్యేకంగా భార్య తండ్రి, ఉద్దేశించబడింది; ఆధునిక తెలుగులో ‘మామ’ సహజమైన సమానం.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: దేవుడు ... చేసినదంతా
  rationale: כָּל אֲשֶׁר యొక్క సమగ్ర భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: మోషే కోసం ... ఇశ్రాయేలు కోసం
  rationale: לְ ఇక్కడ మేలు కలిగించే ఉద్దేశాన్ని సూచిస్తుంది; ‘కోసం’ ఆ ప్రయోజనార్థక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עַמּוֹ
  choice: తన ప్రజలైన
  rationale: తృతీయ పురుష ఏకవచన ప్రత్యయం సందర్భంలో దేవుణ్ణే అత్యంత సహజంగా సూచిస్తుంది. అయితే హెబ్రీ వ్యాకరణంలో మోషేను సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: כִּי
  choice: సంగతిని
  rationale: ఇది యిత్రో విన్న విషయానికి వివరణాత్మక విషయవస్తువును పరిచయం చేస్తుంది; తెలుగులో ‘సంగతిని’ సహజంగా ఆ సంబంధాన్ని తెలుపుతుంది.
- source_word: הוֹצִיא
  choice: బయటికి రప్పించిన
  rationale: יצא హిఫీల్ రూపం ‘బయటికి వెళ్లేలా చేయడం/బయటికి తీసుకురావడం’ అనే కారణార్థక భావాన్ని కలిగి ఉంది; ‘రప్పించిన’ దానిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి బయటికి
  rationale: హిఫీల్ క్రియతో కలిసి దేశం లోపలి నుంచి వెలుపలికి తీసుకురావడాన్ని స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: עַמּוֹ లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ‘తన ప్రజలైన ఇశ్రాయేలు’ అంటే దేవుని ప్రజలైన ఇశ్రాయేలు
  alternative: ‘తన ప్రజలైన ఇశ్రాయేలు’ అంటే మోషే ప్రజలైన ఇశ్రాయేలు
  rationale: ముందున్న אֱלֹהִים అత్యంత సహజమైన పూర్వపదం; తరువాత యెహోవానే ఇశ్రాయేలును బయటికి రప్పించినవాడిగా పేర్కొనడం దీనికి బలం ఇస్తుంది. అయినప్పటికీ వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యాజకుడు,’ ‘యెహోవా,’ ‘ఐగుప్తు’ వంటి బైబిలు సందర్భంలో స్థిరపడిన పదాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యేలా నిర్మించాం. పాదసూచిక గుర్తు [a] సంబంధిత అస్పష్ట వాక్యభాగం తరువాత ఉంచబడింది.
