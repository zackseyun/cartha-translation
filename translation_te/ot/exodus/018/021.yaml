id: EXO.18.21
reference: Exodus 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: te
  text: అయితే నీవు ప్రజలందరిలో నుంచి సమర్థులైన పురుషులను[a]—దేవునికి భయపడేవారిని, నిజాయితీగల పురుషులను[b], అక్రమ లాభాన్ని ద్వేషించేవారిని[c]—ఎంపిక చేసి, వారిని ప్రజలపై వెయ్యిమందికి, వందమందికి, యాభైమందికి, పదిమందికి అధికారులుగా నియమించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలశాలులైన పురుషులను,’ ‘శౌర్యవంతులైన పురుషులను.’ హెబ్రీ పదబంధం సందర్భానుసారంగా బలం, సామర్థ్యం లేదా శౌర్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘సత్యపు పురుషులను’; అంటే నిజాయితీగల, విశ్వసనీయులైన పురుషులను.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అన్యాయ లాభాన్ని ద్వేషించేవారిని’; ఈ పదబంధం అవినీతితో వచ్చే లాభాన్ని తిరస్కరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: ఎంపిక చేసి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘చూడు’ అనే భావం ఉన్నా, ఈ సందర్భంలో అర్హులను గుర్తించి ఎంపిక చేయడం ఉద్దేశం.
- source_word: מִכָּל הָעָם
  choice: ప్రజలందరిలో నుంచి
  rationale: సమస్త ప్రజల మధ్య నుంచి కొందరిని ఎంపిక చేయాలనే విభజనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַנְשֵׁי חַיִל
  choice: సమర్థులైన పురుషులు
  rationale: חַיִל బలం, సామర్థ్యం, శౌర్యం వంటి భావాలను ఇవ్వగలదు; న్యాయపరిపాలనా సందర్భంలో ‘సమర్థులు’ ప్రధాన భావాన్ని అందిస్తుంది, ‘పురుషులు’ మూలంలోని పుంలింగాన్ని నిలుపుతుంది.
- source_word: יִרְאֵי אֱלֹהִים
  choice: దేవునికి భయపడేవారు
  rationale: దేవునిపట్ల భక్తిపూర్వక భయాన్ని నేరుగా, సంప్రదాయబద్ధంగా వ్యక్తం చేస్తుంది.
- source_word: אַנְשֵׁי אֱמֶת
  choice: నమ్మదగినవారు
  rationale: అక్షరార్థమైన ‘సత్యపు పురుషులు’ తెలుగులో అసహజంగా ఉంటుంది; ఈ సందర్భంలో నిజాయితీ, విశ్వసనీయత అనే భావాలను ‘నమ్మదగినవారు’ సహజంగా తెలియజేస్తుంది.
- source_word: שֹׂנְאֵי בָצַע
  choice: అక్రమ లాభాన్ని ద్వేషించేవారు
  rationale: בָּצַע అన్యాయంగా లేదా అవినీతితో పొందే లాభాన్ని సూచిస్తుంది; ‘లంచం’ కంటే ఇది విస్తృతమైనది.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: వారిని ప్రజలపై ... నియమించాలి
  rationale: మూలంలోని రెండు సర్వనామాల సూచనను తెలుగులో స్పష్టంగా చేసి, ఎంపికైనవారిని ప్రజలపై అధికారులుగా ఉంచడాన్ని తెలియజేస్తుంది.
- source_word: שָׂרֵי
  choice: అధికారులు
  rationale: పరిపాలనా బాధ్యత గల నాయకులను సూచించే సహజమైన ఆధునిక తెలుగు పదం; అనవసరమైన సైనిక భావాన్ని రానివ్వదు.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: వెయ్యిమందికి, వందమందికి, యాభైమందికి, పదిమందికి
  rationale: వివిధ పరిమాణాల ప్రజా విభాగాలపై పర్యవేక్షణను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నాయకత్వ అర్హతలలో లింగ సూచన
  choice: సమర్థులైన పురుషులు
  alternative: సమర్థులైన వ్యక్తులు
  rationale: మూల హెబ్రీ పాఠంలో పుంలింగ బహువచన వ్యక్తీకరణ ఉంది. దానిని నిలుపడం పాఠ్యానికి నిష్ఠ; దీనివల్ల ఈ వాక్యానికి మించిన విస్తృత సిద్ధాంత నిర్ణయం చేయడం లేదు.
- issue: יִרְאֵי אֱלֹהִים లోని ‘భయం’
  choice: దేవునికి భయపడేవారు
  alternative: దేవుని పట్ల భక్తి గలవారు
  rationale: ‘భయం’ అనే మూల రూపకాన్ని తొలగించకుండా ఉంచుతుంది; సందర్భంలో అది భక్తిపూర్వక గౌరవం, నైతిక బాధ్యతను కూడా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఆజ్ఞాత్మక భవిష్యదర్థానికి ‘నియమించాలి’ వాడబడింది. మూలంలోని పుంలింగ సూచన నిలుపబడింది; అసహజమైన సర్వనామ పునరుక్తిని ‘ప్రజలపై’ అని స్పష్టం చేశాం.
