  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: te
  text: అప్పుడు మోషే తన మామగారిని సాగనంపాడు[a]; అతడు తన స్వదేశానికి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు మోషే తన మామగారిని పంపివేశాడు; అతడు తన దేశానికి వెళ్లాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: సాగనంపాడు
  rationale: పియేల్ రూపంలోని שׁלח, వ్యక్తిని కర్మగా తీసుకున్నప్పుడు, పంపివేయడం లేదా వెళ్లేందుకు వీడ్కోలు పలకడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో మర్యాదపూర్వకమైన వీడ్కోలును సహజ తెలుగులో ‘సాగనంపాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חֹתְנוֹ
  choice: తన మామను
  rationale: ఈ సందర్భంలో חֹתֵן మోషే భార్య తండ్రి అయిన యిత్రోను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మామ’ సహజమైన సంబంధపదం.
- source_word: וַיֵּלֶךְ לוֹ
  choice: అతడు ... వెళ్లిపోయాడు
  rationale: לוֹ ఇక్కడ విడిగా అనువదించవలసిన స్వార్థక దాతువు కాక, ప్రయాణాన్ని తెలిపే హీబ్రూ వాడుకలో భాగం. ‘వెళ్లిపోయాడు’ అతని బయలుదేరడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל אַרְצוֹ
  choice: తన స్వదేశానికి
  rationale: אֶרֶץ అంటే భూమి, ప్రాంతం, లేదా దేశం కావచ్చు. ఇక్కడ అతడు తనకు చెందిన ప్రాంతానికి తిరిగి వెళ్లాడనే భావాన్ని, ఆధునిక జాతీయరాష్ట్ర భావాన్ని బలవంతంగా రుద్దకుండా, ‘స్వదేశం’ సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘సాగనంపాడు’ వీడ్కోలు భావాన్ని కలిగిన శుభ్రమైన కథన పదం; ‘స్వదేశం’ను ఆధునిక రాజకీయ దేశం అనే కఠిన అర్థంలో కాక, అతని స్వంత ప్రాంతం అనే భావంలో వాడాం.
