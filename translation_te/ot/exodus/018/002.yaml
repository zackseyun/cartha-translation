- from: మోషే మామ యిత్రో, మోషే పంపివేసిన తరువాత అతని భార్య సిప్పోరాను తన వెంట తీసుకున్నాడు.[a]
  to: మోషే మామగారైన యిత్రో, మోషే భార్యయైన సిప్పోరాను ఆమెను పంపివేసిన తరువాత తీసుకున్నాడు.[a]
  rationale: The revision removes the added ‘with him’ nuance and preserves the Hebrew’s unstated agent in the main text. The footnote supplies both the literal sense and the contextually likely reading that Moses sent her away, without presenting that inference as explicit in the source.
