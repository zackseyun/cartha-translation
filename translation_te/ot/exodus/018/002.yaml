  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: te
  text: మోషే మామగారైన యిత్రో, మోషే భార్యయైన సిప్పోరాను ఆమెను పంపివేసిన తరువాత తీసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఆమె పంపివేత తరువాత” అని ఉంది; ఆమెను ఎవరు పంపారో స్పష్టంగా చెప్పబడలేదు. లేదా, “మోషే ఆమెను పంపివేసిన తరువాత.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తన వెంట తీసుకున్నాడు
  rationale: לָקַח సాధారణంగా ‘తీసుకొను’ అని అర్థం. ఈ సందర్భంలో యిత్రో సిప్పోరాను తనతో తీసుకొని బయలుదేరిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఆమెను తన సంరక్షణలోకి తీసుకున్నాడా లేక వెంట తీసుకొచ్చాడా అనే సూక్ష్మాంశాన్ని అతిగా నిర్ధారించదు.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ
  rationale: חֹתֵן వివాహబంధం ద్వారా ఏర్పడిన బంధువును, ఇక్కడ మోషే భార్య తండ్రిని, సూచిస్తుంది. ‘మోషే మామ’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: צִפֹּרָה
  choice: సిప్పోరా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరంగా వినిపించే రూపంలో లిప్యంతరీకరించాం.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: అతని భార్య
  rationale: అదే వాక్యంలో మోషే పేరు ఇప్పటికే రెండుసార్లు రావడం వల్ల, అర్థస్పష్టతను కోల్పోకుండా సహజమైన తెలుగు కోసం ‘అతని భార్య’ అని ఇచ్చాం.
- source_word: אַחַר
  choice: తరువాత
  rationale: ఇక్కడ ముందుగా జరిగిన పంపివేతకు తరువాతి చర్యను సూచించే కాలక్రమ భావం ఉంది.
- source_word: שִׁלּוּחֶיהָ
  choice: మోషే పంపివేసిన తరువాత
  rationale: ఈ నామరూపం అక్షరార్థంగా ‘ఆమె పంపివేత తరువాత’ అని ఉంటుంది; కర్తను స్పష్టంగా చెప్పదు. సందర్భం ప్రకారం మోషే కర్తగా ఉండే అవకాశమే ఎక్కువ కాబట్టి ప్రధాన పాఠ్యంలో అతన్ని కర్తగా ఇచ్చి, మూలంలోని అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ‘ఆమె పంపివేత తరువాత’ అనే మాటలో కర్త ఎవరు?
  choice: మోషే కర్తగా భావించి ‘మోషే పంపివేసిన తరువాత’ అని ప్రధాన పాఠ్యంలో ఇవ్వడం
  alternative: ‘ఆమె పంపబడిన తరువాత’ లేదా ‘ఆమె పంపివేత తరువాత’
  rationale: హీబ్రూ పాఠ్యం కర్తను పేర్కొనకుండా నామరూపాన్ని ఉపయోగిస్తుంది. సమీప సందర్భంలో మోషే సహజమైన అంతర్నిహిత కర్త; అయినా ఇది వ్యాకరణపరంగా స్పష్టంగా చెప్పబడలేదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా ఉంది. ‘మామ’ సందర్భంలో భార్య తండ్రిని సూచిస్తుంది. మూలంలోని కర్త అస్పష్టత పాదటిప్పణిలో నిలుపబడింది.
