id: EXO.18.25
reference: Exodus 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: te
  text: మోషే ఇశ్రాయేలీయులందరిలోనుంచి సమర్థులైన పురుషులను ఎంపిక చేసి, వారిని ప్రజలపై అధిపతులుగా నియమించాడు—వెయ్యిమందికి అధిపతులు, వందమందికి అధిపతులు, యాభైమందికి అధిపతులు, పదిమందికి అధిపతులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: ఎంపిక చేసి
  rationale: בחר అంటే ఎంచుకోవడం లేదా ఎంపిక చేయడం. వరుసగా జరిగిన కథన చర్యలను తెలుగులో సహజంగా కలపడానికి అసమాపక క్రియారూపం వాడబడింది.
- source_word: אַנְשֵׁי חַיִל
  choice: సమర్థులైన పురుషులు
  rationale: ఈ న్యాయపరిపాలనా సందర్భంలో חַיִל సైనిక పరాక్రమం కంటే సామర్థ్యం, యోగ్యత, నిరూపిత నైపుణ్యాన్ని సూచిస్తుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరిలోనుంచి
  rationale: ఎంపిక మొత్తం ఇశ్రాయేలు సమాజం నుంచి జరిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּתֵּן אֹתָם
  choice: వారిని ... నియమించాడు
  rationale: נתן అక్షరార్థంగా ‘ఉంచాడు/ఇచ్చాడు’ అయినా, ఇక్కడ అధికార బాధ్యతలో ఉంచడాన్ని సూచిస్తుంది; అందువల్ల ‘నియమించాడు’ సందర్భోచితం.
- source_word: רָאשִׁים עַל הָעָם
  choice: ప్రజలపై అధిపతులు
  rationale: רָאשִׁים అధికార స్థానంలో ఉన్నవారిని సూచించే ‘తలలు’ అనే రూపకం. తెలుగులో అక్షరార్థ రూపకం అసహజంగా ఉండేందున అధికార భావాన్ని స్పష్టంగా తెలిపే ‘అధిపతులు’ వాడబడింది; עַל లోని అధికార సంబంధాన్ని ‘ప్రజలపై’ నిలుపుతుంది.
- source_word: שָׂרֵי אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: వెయ్యిమందికి / వందమందికి / యాభైమందికి / పదిమందికి అధిపతులు
  rationale: שָׂרֵי అనేది ఆయా సంఖ్యల గుంపులపై నియమిత అధికారులను సూచిస్తుంది. సంఖ్యలను వ్యక్తుల గుంపులుగా స్పష్టపరచడం తెలుగులో సహజంగా ఉండి పరిపాలనా శ్రేణిని యథాతథంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘అధిపతులు’ అనే పదం רָאשִׁים మరియు שָׂרֵי రెండింటి అధికార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని సంఖ్యాక్రమం పూర్తిగా నిలుపబడింది.
