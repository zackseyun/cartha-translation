  to: ఇప్పుడు యాహ్వే దేవతలందరికంటే గొప్పవాడని నాకు తెలుసు. ఎందుకంటే, వారు వారిపై గర్వంగా ప్రవర్తించిన ఆ విషయంలో ఆయన వారికంటే ఉన్నతుడిగా నిలిచాడు.[a]
