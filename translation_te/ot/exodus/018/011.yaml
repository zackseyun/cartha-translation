id: EXO.18.11
reference: Exodus 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: te
  text: ఇప్పుడు యాహ్వే దేవతలందరికంటే గొప్పవాడని నాకు తెలుసు. ఎందుకంటే, వారు వారిపై గర్వంగా ప్రవర్తించిన ఆ విషయంలో ఆయన వారికంటే ఉన్నతుడిగా నిలిచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే వారు వారిపై గర్వంగా ప్రవర్తించిన ఆ విషయంలోనే.” చివరి ఉపవాక్యంలోని హీబ్రూ వాక్యనిర్మాణం కఠినమైనది. ఇది ప్రత్యేకంగా ఐగుప్తీయులు ఇశ్రాయేలీయులపై గర్వంగా ప్రవర్తించిన సంగతిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: ఇప్పుడు ... నాకు తెలిసింది
  rationale: యిత్రో ఇటీవలి సంఘటనల ద్వారా ఇప్పుడు పొందిన అవగాహనను సూచిస్తుంది; హీబ్రూ పరిపూర్ణ క్రియలోని ఫలితస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: యాహ్వే దేవతలందరికంటే గొప్పవాడు
  rationale: מִן తో కూడిన గుణవాచకం పోలికను సూచిస్తుంది. יהוה అనే వ్యక్తినామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהִים యొక్క సందర్భోచిత బహువచనాన్ని ‘దేవతలు’గా ఇచ్చాం.
- source_word: בַדָּבָר אֲשֶׁר זָדוּ
  choice: వారు ... అహంకారంతో ప్రవర్తించిన ఆ విషయంలోనే
  rationale: דָּבָר ఇక్కడ వ్యవహారం లేదా సంఘటనను సూచిస్తుంది; זָדוּ అహంకారపూరితమైన లేదా దురహంకారంతో కూడిన చర్యను సూచిస్తుంది. ‘ఆ విషయంలోనే’ అనే రూపం ప్రతీకార సమానత్వ భావాన్ని సంరక్షిస్తుంది.
- source_word: עֲלֵיהֶם
  choice: ఇశ్రాయేలీయులపై ... వారికంటే పైవాడని
  rationale: ఒకే పదబంధంతో కూడిన కఠినమైన సంక్షిప్త వాక్యంలో బాధితులు, అహంకారంగా ప్రవర్తించినవారు అనే రెండు సూచనలు సందర్భం ద్వారా గ్రహించబడుతున్నాయి. తెలుగులో స్పష్టత కోసం ‘ఇశ్రాయేలీయులపై’ అని సందర్భార్థాన్ని తెలిపి, యాహ్వే అణచివేతదారులకంటే పైవాడని ఫలితాన్ని వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. కాబట్టి దానిని వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: కఠినమైన చివరి ఉపవాక్య భావం
  choice: వారు ఇశ్రాయేలీయులపై అహంకారంతో ప్రవర్తించిన ఆ విషయంలోనే ఆయన వారికంటే పైవాడని చూపించాడు
  alternative: వారు వారిపై అహంకారంతో ప్రవర్తించిన ఆ విషయంలోనే
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి కర్త, సర్వనామ పూర్వపదాల విషయంలో సందిగ్ధత కలిగిస్తుంది. ప్రధాన పాఠం నిర్గమకాండ సందర్భానుసారం ఐగుప్తీయులు ఇశ్రాయేలీయులపై చేసిన అహంకారాన్ని, అదే రంగంలో యాహ్వే చూపిన ఆధిక్యాన్ని తెలియజేస్తుంది; పాదటిప్పణి మరింత పదశః పఠనాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని కఠినమైన చివరి ఉపవాక్యాన్ని ప్రధాన పాఠంలో సందర్భానుసారంగా చదవదగినదిగా చేసి, దాని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
