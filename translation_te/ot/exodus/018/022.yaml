review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the instructional force of וְשָׁפְטוּ, the comprehensive temporal expression, the great/small contrast, the emphatic ‘they’ in the minor cases, and the final imperative followed by the shared bearing of the implied burden. The supplied word ‘burden’ is contextually warranted and is appropriately footnoted.
  naturalness: The Telugu is generally clear and modern. Minor revisions make the legal/judicial wording and the placement of the lexical footnote more natural and more closely tied to the words it explains.
  terminology: ‘న్యాయం తీర్చాలి,’ ‘విషయం,’ and ‘భారం’ are suitable in this register. ‘నీ వద్దకు’ is slightly more standard than ‘నీ దగ్గరకు’ in this formal address, while ‘పెద్ద/చిన్న విషయం’ preserves the Hebrew contrast without prematurely restricting it to formal legal cases.
  issues:
  - severity: low
    issue: Footnote a is placed after the entire second sentence rather than at the ‘great/small matter’ wording it explains.
    rationale: The note specifically explains the Hebrew adjectives for the matters/cases. Anchoring it directly after ‘చిన్న విషయాన్ని’ makes its referent unambiguous.
  - severity: low
    issue: ‘నీ దగ్గరకు’ is somewhat more colloquial than needed in this formal instructional context.
    rationale: ‘నీ వద్దకు’ is idiomatic modern standard Telugu and retains the same meaning.
