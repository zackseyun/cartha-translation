  text: וְ/שָׁפְט֣וּ אֶת הָ/עָם֮ בְּ/כָל עֵת֒ וְ/הָיָ֞ה כָּל הַ/דָּבָ֤ר הַ/גָּדֹל֙ יָבִ֣יאוּ אֵלֶ֔י/ךָ וְ/כָל הַ/דָּבָ֥ר הַ/קָּטֹ֖ן יִשְׁפְּטוּ הֵ֑ם וְ/הָקֵל֙ מֵֽ/עָלֶ֔י/ךָ וְ/נָשְׂא֖וּ אִתָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: te
  text: వారు అన్ని సమయాల్లో ప్రజలకు న్యాయం తీర్చాలి. ప్రతి పెద్ద విషయాన్ని నీ దగ్గరకు తీసుకురావాలి; ప్రతి చిన్న విషయాన్ని మాత్రం వారే తీర్చాలి.[a] ఇలా నీ మీదున్న భారాన్ని తేలిక చేసుకో,[b] వారు దాన్ని నీతో కలిసి మోస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి పెద్ద వ్యాజ్యాన్ని … ప్రతి చిన్న వ్యాజ్యాన్ని.” హెబ్రీలో తీర్పుకోసం వచ్చే విషయాలకు “పెద్ద,” “చిన్న” అనే పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: “భారం” అనే పదం హెబ్రీలో ప్రత్యక్షంగా లేదు; ప్రజలకు న్యాయం తీర్చే బాధ్యత సందర్భంలో సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: వారు ... ప్రజలకు న్యాయం తీర్చాలి
  rationale: శפט్ ఇక్కడ ప్రజల వివాదాలను విచారించి తీర్పు చెప్పడాన్ని సూచిస్తుంది. యిత్రో ఇస్తున్న ఆదేశ స్వరాన్ని తెలుగులో ‘తీర్చాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל־עֵת
  choice: అన్ని సమయాల్లో
  rationale: మూలంలోని విస్తృత కాలార్థాన్ని నిలుపుతుంది; ‘అవసరమైనప్పుడల్లా’ అనే సందర్భానుగుణ భావాన్ని పాఠ్యంలోకి అదనంగా చేర్చదు.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: ప్రతి పెద్ద విషయం
  rationale: దావార్ ఇక్కడ విచారణకు వచ్చే విషయం లేదా వ్యాజ్యాన్ని సూచిస్తుంది. ‘పెద్ద విషయం’ హెబ్రీలోని ‘పెద్ద–చిన్న’ వ్యతిరేక జంటను నేరుగా కాపాడుతుంది.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: నీ దగ్గరకు తీసుకురావాలి
  rationale: ఆ విషయాన్ని మోషే తీర్పుకోసం అతని వద్దకు తీసుకురావాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: ప్రతి చిన్న విషయాన్ని మాత్రం వారే తీర్చాలి
  rationale: ‘వారే’ అనే రూపం הֵם ఇచ్చే విరుద్ధ ఉద్ఘాటనను నిలుపుతుంది; ‘మాత్రం’ పెద్ద విషయాలతో ఉన్న వ్యత్యాసాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: ఇలా నీ మీదున్న భారాన్ని తేలిక చేసుకో
  rationale: హిఫిల్ ఆజ్ఞారూపమైన ‘తేలిక చేయి’ అనే భావాన్ని కాపాడుతుంది. ‘భారం’ మూలంలో ప్రత్యక్షంగా లేకపోయినా ‘నీ మీదనుండి తేలిక చేయి’ అనే రూపకంలో సూచితమవుతుంది; అందుకే గమనిక జోడించబడింది.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: వారు దాన్ని నీతో కలిసి మోస్తారు
  rationale: נשא యొక్క ‘మోయు’ అనే రూపకాన్ని నిలుపుతూ, సూచిత కర్మను ‘దాన్ని’ అని పూర్వవాక్యంలోని భారంతో అనుసంధానిస్తుంది.
