  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. మోషేను ఉద్దేశించిన ఏకవచన సంబోధనకు ‘నీ’ వాడబడింది. హెబ్రీలోని ఆజ్ఞ స్వరం, ‘పెద్ద–చిన్న’ జంట, మోయడం అనే రూపకం నిలుపబడ్డాయి.
