  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: te
  text: మోషే తన మామగారి మాట విని, ఆయన చెప్పినదంతా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన మామగారి మాటకు లోబడ్డాడు.” హీబ్రూ నుడికారం శ్రద్ధగా విని విధేయత చూపడం అనే భావాన్ని కలిగి ఉండవచ్చు; తరువాతి వాక్యభాగం ఆ విధేయతను స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: మాట విని
  rationale: שׁמע לְקוֹל అనే హీబ్రూ ప్రయోగం కేవలం వినడమే కాక శ్రద్ధగా విని అనుసరించడాన్ని సూచించగలదు. తెలుగు ‘మాట విని’ ఈ భావాన్ని సహజంగా నిలుపుతుంది; తరువాతి వాక్యభాగం ఆ విధేయతను స్పష్టం చేస్తుంది.
- source_word: לְקוֹל
  choice: మాట
  rationale: קוֹל అక్షరార్థంగా ‘స్వరం’; అయితే ‘ఒకరి స్వరం వినడం’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజ సమానార్థక ప్రయోగం ‘ఒకరి మాట వినడం.’ ‘సలహా’ అని అనువదిస్తే మూలంలో లేని వివరణను జోడించినట్లవుతుంది.
- source_word: חֹתְנוֹ
  choice: తన మామగారి
  rationale: సందర్భంలో ఈ పదం మోషే భార్య తండ్రి యిత్రోను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మామగారు’ సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ క్రియకు ‘చేయు’ నేరమైన సమానార్థకం; తరువాతి కర్మవాచక భాగంతో సహజంగా సరిపోతుంది.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: ఆయన చెప్పినదంతా
  rationale: ఈ సంబంధ వాక్యభాగానికి ఇది నేరమైన, సహజమైన తెలుగు రూపం. ‘చెప్పి ఉన్నదంతా’ వంటి అదనపు కాలసూచన అవసరం లేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘స్వరాన్ని విన్నాడు’ అనే అసహజ అక్షరానువాదానికి బదులు తెలుగు నుడికారం ‘మాట విని’ వాడబడింది; మూలంలోని విధేయత భావం పాదటిప్పణిలో సంరక్షించబడింది.
