id: EXO.18.5
reference: Exodus 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: te
  text: అప్పుడు మోషే మామయైన యిత్రో, అతని కుమారులనూ భార్యనూ వెంటబెట్టుకొని, మోషే దేవుని పర్వతం వద్ద అరణ్యంలో మకాం వేసి ఉన్న చోటికి వచ్చాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని కుమారులు, భార్య’ అనే హీబ్రూ మాటలు సందర్భానుసారం మోషే కుమారులను, భార్యను సూచిస్తాయి. అయితే వ్యాకరణపరంగా అవి యిత్రో కుమారులను, భార్యను కూడా సూచించవచ్చు.
    reason: referential_ambiguity
  - marker: b
    text: ‘దేవుని పర్వతం’ అనేది సీనాయి/హోరేబుతో సంబంధమున్న ఒక బిరుదు.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִתְרוֹ
  choice: యిత్రో
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: חֹתֵן מֹשֶׁה
  choice: మోషే మామ అయిన
  rationale: ఈ సంబంధపదం ఇక్కడ మోషే భార్య తండ్రిని సూచిస్తుంది. ‘మామ’ సాధారణ ఆధునిక తెలుగులో సహజమైన బంధుత్వపదం.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: అతని కుమారులను, అతని భార్యను వెంటబెట్టుకొని
  rationale: సమేతంగా వచ్చిన వారిని తెలుగులో సహజంగా తెలిపేందుకు ‘వెంటబెట్టుకొని’ వాడాం. ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుందనే వ్యాకరణ సందిగ్ధతను ‘అతని’ నిలుపుతుంది; సందర్భం దానిని మోషేకు అన్వయిస్తుంది.
- source_word: אֶל מֹשֶׁה אֶל הַמִּדְבָּר
  choice: మోషే అరణ్యంలో ... ఉన్న చోటికి
  rationale: 'రెండు אֶל పదబంధాల గమ్యార్థాన్ని తెలుగులో ఒక సహజ స్థలవాక్యంగా అమర్చాం: యిత్రో మోషే ఉన్న అరణ్య ప్రదేశానికి వచ్చాడు.'
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: మోషే ... మకాం వేసి ఉన్న చోటికి
  rationale: సంబంధ వాక్యంలోని కర్తను తెలుగులో స్పష్టత కోసం ‘మోషే’గా పునరుక్తి చేశాం. חנה యొక్క శిబిరం వేయడం అనే అర్థాన్ని ‘మకాం వేసి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַר הָאֱלֹהִים
  choice: దేవుని పర్వతం
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని నేరుగా నిలిపి, ఈ వచనంలో లేని ‘సీనాయి’ లేదా ‘హోరేబు’ అనే పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: ‘అతని కుమారులు, అతని భార్య’లోని ప్రత్యయాలు ఎవరిని సూచిస్తాయి?
  choice: సందర్భానుసారం అవి మోషే కుమారులను, మోషే భార్యను సూచిస్తాయి; ప్రధాన పాఠ్యం మాత్రం హీబ్రూ సర్వనామ రూపాన్ని నిలుపుతుంది.
  alternative: అవి యిత్రో కుమారులను, యిత్రో భార్యను సూచిస్తాయి.
  rationale: నిర్గమకాండము 18:2లో యిత్రో మోషే భార్య సిప్పోరాను, ఆమె ఇద్దరు కుమారులను తన దగ్గర ఉంచుకున్నట్లు ఉంది. 18:5 ఆ సమాచారాన్ని సహజంగా కొనసాగిస్తుంది. అయినా హీబ్రూ ప్రత్యయాల రూపం మాత్రమే చూస్తే యిత్రోను సూచించే అవకాశం పూర్తిగా తొలగిపోదు; అందుకే పాదసూచికలో తెలియజేశాం.
- issue: ‘దేవుని పర్వతం’ గుర్తింపు
  choice: వివరణాత్మక బిరుదునే ప్రధాన పాఠ్యంలో ఉంచాం.
  alternative: ‘సీనాయి పర్వతం’ లేదా ‘హోరేబు’ అని పేరు పెట్టడం.
  rationale: ఈ వచనంలో ఉన్నది הַר הָאֱלֹהִים మాత్రమే. దానిని నేరుగా అనువదించడం మూలపాఠ్యాన్ని కాపాడి, లేని ప్రత్యేక నామాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించాం. ‘మకాం వేసి’ సహజమైన ప్రస్తుత వాడుక; ‘దేవుని పర్వతం’ మూలంలోని బిరుదును యథాతథంగా నిలుపుతుంది. సర్వనామ సూచనలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
