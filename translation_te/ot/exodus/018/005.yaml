revisions:
- from: అప్పుడు మోషే మామ అయిన యిత్రో, అతని కుమారులను, అతని భార్యను వెంటబెట్టుకొని[a], మోషే అరణ్యంలో దేవుని పర్వతం[b] దగ్గర మకాం వేసి ఉన్న చోటికి వచ్చాడు.
  to: అప్పుడు మోషే మామయైన యిత్రో, అతని కుమారులనూ భార్యనూ వెంటబెట్టుకొని, మోషే దేవుని పర్వతం వద్ద అరణ్యంలో మకాం వేసి ఉన్న చోటికి వచ్చాడు.[a][b]
  rationale: The revision makes the kinship expression idiomatic, improves the Telugu order of the encampment description, and retains the source text’s pronominal ambiguity through ‘అతని’ together with a more precise footnote. It does not identify the mountain by a name absent from the verse.
