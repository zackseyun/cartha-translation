source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: te
  text: వారికి ఏదైనా విషయం[a] ఉంటే, వారు నా దగ్గరకు వస్తారు; నేను ఒక మనిషికీ అతని పొరుగువానికీ మధ్య తీర్పు తీరుస్తాను[b], దేవుని విధులను, ఆయన బోధనలను[c] తెలియజేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి ఏదైనా వ్యాజ్యం ఉంటే.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “ఒక మనిషికీ అతని పొరుగువానికీ మధ్య”; ఇది ప్రతినిధి ఏకవచన వ్యక్తీకరణ.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఆయన ధర్మశాస్త్రాలను.” హీబ్రూ పదం చట్టపరమైన నియమాలతోపాటు బోధన లేదా నిర్దేశం అనే విస్తృత భావాన్నీ కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה לָהֶם דָּבָר
  choice: వారికి ఏదైనా వివాదం వచ్చినప్పుడు
  rationale: כִּי ఇక్కడ సందర్భాన్ని తెలిపే కాలార్థక పదం. న్యాయ సందర్భంలో דָּבָר ఒక విషయం లేదా వ్యాజ్యాన్ని సూచిస్తుంది; ‘వివాదం’ సాధారణ పాఠకులకు సందర్భాన్ని స్పష్టంగా తెలియజేస్తూనే దాని విస్తృతిని పూర్తిగా సంకుచితం చేయదు.
- source_word: בָּא אֵלַי
  choice: అది నా దగ్గరకు వస్తుంది
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉండి ముందున్న דָּבָר‌ను కర్తగా సూచిస్తుంది. అందువల్ల వివాదమే మోషే వద్దకు వస్తుందని మూల వాక్య నిర్మాణాన్ని నిలిపాం.
- source_word: וְשָׁפַטְתִּי
  choice: నేను ... తీర్పు తీర్చి
  rationale: שׁפט ఇక్కడ న్యాయపరంగా నిర్ణయించడం లేదా తీర్పు చెప్పడం అనే అర్థం ఇస్తుంది. ‘తీర్పు తీర్చడం’ సహజమైన ఆధునిక తెలుగు న్యాయవ్యవహార పదబంధం.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: ఒక మనిషికీ అతని పొరుగువానికీ మధ్య
  rationale: మూలంలోని పురుష ఏకవచన ప్రతినిధి వ్యక్తీకరణను కాపాడుతూ, רֵעַ యొక్క సామాజిక-న్యాయ భావానికి ‘పొరుగువాడు’ను ఎంచుకున్నాం.
- source_word: וְהוֹדַעְתִּי
  choice: వారికి తెలియజేస్తాను
  rationale: ידע యొక్క హిఫీల్ రూపంలోని ‘తెలిసేలా చేయడం’ అనే కారణార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘వారికి’ అనేది వివాద పక్షాలను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: దేవుని కట్టడలు
  rationale: חֹק స్థిరంగా విధించబడిన నియమం లేదా శాసనాన్ని సూచిస్తుంది. ‘కట్టడలు’ గౌరవప్రదమైన బైబిలు తెలుగు పదంగా దాని నిర్దేశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: תּוֹרֹתָיו
  choice: ఆయన ఉపదేశాలు
  rationale: תּוֹרָה కేవలం చట్టం మాత్రమే కాక బోధన, నిర్దేశం అనే విస్తృత భావాన్ని కలిగి ఉంది. బహువచనాన్ని నిలిపి, న్యాయ సందర్భాన్ని పక్కనున్న ‘కట్టడలు’ స్పష్టం చేయనివ్వడం ద్వారా మూల పదంలోని విస్తృతిని కాపాడాం.
theological_decisions:
- issue: אִישׁ ... רֵעֵהוּ లోని ప్రతినిధి పురుష ఏకవచనం
  choice: ఒక మనిషికీ అతని పొరుగువానికీ మధ్య
  alternative: ఒక వ్యక్తికీ మరొక వ్యక్తికీ మధ్య
  rationale: మూలంలోని వ్యాకరణ పురుష ఏకవచన రూపాన్ని చెరపకుండా ఉంచాం; అదే సమయంలో ఇది న్యాయపరమైన ప్రతినిధి వ్యక్తీకరణ అని పాదటిప్పణిలో తెలిపాం.
- issue: תּוֹרֹתָיו యొక్క న్యాయ మరియు బోధనాత్మక భావాలు
  choice: ఆయన ఉపదేశాలు
  alternative: ఆయన ధర్మశాస్త్రాలు
  rationale: తక్షణ సందర్భం న్యాయపరమైనదైనా, תּוֹרָה యొక్క మూల భావం ‘ఉపదేశం/నిర్దేశం’ వరకు విస్తరిస్తుంది. ‘కట్టడలు’తో సమాంతరంగా ‘ఉపదేశాలు’ వాడటం రెండు భావాలను అనవసరంగా ఒకటిగా కలపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని న్యాయ సందర్భం స్పష్టంగా ఉండేలా ‘వివాదం’, ‘తీర్పు తీర్చి’ అన్న పదాలను ఎంచుకున్నాం; תּוֹרָה యొక్క విస్తృత భావాన్ని ‘ఉపదేశాలు’తో నిలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
