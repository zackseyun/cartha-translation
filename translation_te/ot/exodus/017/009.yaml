reference: Exodus 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: te
  text: మోషే యెహోషువతో, “మన కోసం పురుషులను ఎంపిక చేసి, బయటికి వెళ్లి అమాలేకుపై యుద్ధం చేయి.[a] రేపు నేను దేవుని దండాన్ని నా చేతిలో పట్టుకొని కొండ శిఖరంపై[b] నిలబడతాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అమాలేకుతో పోరాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “కొండ తలపై”; దీని అర్థం “కొండ శిఖరంపై.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన తెలుగు వాక్య క్రమంలో తెలియజేస్తుంది; ప్రత్యేకమైన కాలక్రమ భావాన్ని అదనంగా చేర్చదు.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: మూల హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో పరిచితమైన లిప్యంతరీకరణ.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: మన కోసం పురుషులను ఎంపిక చేసి
  rationale: בְּחַר అనే ‘ఎంపిక చేయి’ భావాన్ని, לָנוּ అనే ‘మన కోసం’ భావాన్ని, אֲנָשִׁים అనే ‘పురుషులు’ అర్థాన్ని నిలుపుతుంది; ‘సైనికులు’ అని మూలంలో లేని ప్రత్యేకతను చేర్చదు.
- source_word: וְצֵא
  choice: బయటికి వెళ్లి
  rationale: יצא లోని ‘బయటికి వెళ్లు’ అనే దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: అమాలేకుతో యుద్ధం చేయి
  rationale: సైనిక సందర్భంలోని ‘పోరాడు/యుద్ధం చేయి’ భావాన్ని వ్యక్తపరుస్తూ, అమాలేకును ప్రత్యర్థిగా చూపుతుంది.
- source_word: מָחָר
  choice: రేపు
  rationale: కాల సూచనను తదుపరి వాక్యభాగం ఆరంభంలో సహజంగా ఉంచుతుంది.
- source_word: אָנֹכִי נִצָּב
  choice: నేను ... నిలబడతాను
  rationale: నిర్మాణం రూపరీత్యా participle అయినప్పటికీ, ‘రేపు’ అనే సందర్భం దానికి భవిష్యత్ భావాన్ని ఇస్తుంది.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: కొండ శిఖరంపై
  rationale: ‘కొండ తలపై’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: దేవుని దండాన్ని
  rationale: construct phrase ను స్పష్టంగా నిలుపుతూ, నిర్గమకాండలో ఈ వస్తువుకు వాడే గౌరవప్రదమైన సాధారణ పదాన్ని ఉపయోగిస్తుంది.
- source_word: בְּיָדִי
  choice: చేతిలో పట్టుకొని
  rationale: ‘నా చేతిలో’ అనే చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; మొదటి పురుష భావం ‘నేను’ ద్వారా ఇప్పటికే స్పష్టంగా ఉంది.
theological_decisions:
- issue: מַטֵּה הָאֱלֹהִים పదబంధంలో הָאֱלֹהִים అనువాదం
  choice: దేవుని దండం
  alternative: దేవునికి చెందిన దండం
  rationale: హీబ్రూ construct సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; మూలంలో లేని అదనపు యాజమాన్య లేదా సిద్ధాంత భావాన్ని చేర్చదు.
- issue: בַּעֲמָלֵק లో అమాలేకు సూచన
  choice: అమాలేకుతో
  alternative: అమాలేకీయులతో
  rationale: మూలంలోని ‘అమాలేకు’ అనే రూపాన్ని అలాగే ఉంచి, అది వ్యక్తినా ప్రజాసమూహమా అన్న metonymic విస్తరణను అనువాదంలో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఆజ్ఞల ఏకవచన రూపాలు నిలుపబడ్డాయి. మూలంలోని పురుషులను సూచించే పదాన్ని లింగతటస్థంగా మార్చలేదు; అలాగే అమాలేకు అనే సూచనను ‘అమాలేకీయులు’గా విస్తరించలేదు.
