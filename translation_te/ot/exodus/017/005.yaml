    rationale: పెద్దలలోనుండి ‘కొందరు’ అనే భాగార్థం మరియు యְאֹרకు ‘నది’ అనే ప్రత్యామ్నాయాన్ని పాఠకునికి పారదర్శకంగా అందించేందుకు గుర్తులు చేర్చబడ్డాయి.
