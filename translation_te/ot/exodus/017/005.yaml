id: EXO.17.5
reference: Exodus 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: te
  text: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల కంటే ముందుగా వెళ్లి, ఇశ్రాయేలు పెద్దలలో కొందరిని[a] నీతో తీసుకెళ్లు. నీవు నైలు నదిని[b] కొట్టిన నీ కర్రను నీ చేతిలో తీసుకొని వెళ్లు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “ఇశ్రాయేలు పెద్దలలోనుండి.” ఇది పెద్దలందరినీ కాక, వారిలో ఎంపికైన కొందరిని తీసుకెళ్లమనే అర్థాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నది.” నిర్గమకాండంలోని ఈ సందర్భంలో ఈ పదం సాధారణంగా నైలు నదినే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతూ తెలుగులో లిప్యంతరీకరించాం.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: ప్రజల ముందుగా సాగిపో
  rationale: עֲבֹר అనే ఆజ్ఞలోని ముందుకు వెళ్లే భావాన్నీ, לִפְנֵי הָעָם లోని ప్రజల ముందు అనే స్థల సంబంధాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలలో కొందరిని నీతో తీసుకెళ్లు
  rationale: מִן నిర్మాణం మొత్తం పెద్దల సమూహాన్ని కాక, వారిలో ఎంపికైన కొందరిని సూచించే భాగార్థాన్ని కలిగి ఉంది.
- source_word: וּמַטְּךָ
  choice: నీ కర్రను
  rationale: מַטֶּה కు ‘కర్ర’ లేదా ‘దండం’ అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో మోషే చేతిలో పట్టుకొని ఉపయోగించే వస్తువుకు ‘కర్ర’ సాధారణ ఆధునిక తెలుగు.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: నీవు నైలు నదిని కొట్టిన
  rationale: నిర్గమకాండంలోని ఈజిప్టు సందర్భంలో הַיְאֹר ప్రత్యేకంగా నైలు నదిని సూచిస్తుంది; בּוֹ లోని సాధనార్థం తెలుగులో ముందే పేర్కొన్న ‘నీ కర్రను’తో సహజంగా గ్రహించబడుతుంది.
- source_word: קַח בְּיָדְךָ
  choice: చేతిలో పట్టుకొని
  rationale: రెండవ קַח ఆజ్ఞను పదేపదే ‘తీసుకో’ అని అనకుండా, కర్రను చేతిలో తీసుకోవాలనే భావాన్ని సహజ తెలుగు క్రియారూపంతో నిలిపాం.
- source_word: וְהָלָכְתָּ
  choice: వెళ్లు
  rationale: ఇది ముందు వచ్చిన ఆజ్ఞల వరుసను కొనసాగించే సాధారణ ప్రయాణ ఆజ్ఞ; ‘వెళ్లు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: YHWH దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, మూలంలోని నామ స్వభావాన్ని నిలుపుతుంది; ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూలోని ఆజ్ఞల వరుసను నిలుపుతూ, తెలుగులో అసహజమైన పదపునరుక్తిని తగ్గించాం. ఈ ముసాయిదాలో పాదసూచిక అవసరం లేదు.
