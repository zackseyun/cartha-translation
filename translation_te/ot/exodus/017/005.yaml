revisions:
- from: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల ముందుగా సాగిపో. ఇశ్రాయేలు పెద్దలలో కొందరిని నీతో తీసుకెళ్లు. నీవు నైలు నదిని కొట్టిన నీ కర్రను చేతిలో పట్టుకొని వెళ్లు.”'
  to: 'అప్పుడు యహ్వే మోషేతో ఇలా అన్నాడు: “ప్రజల కంటే ముందుగా వెళ్లి, ఇశ్రాయేలు పెద్దలలో కొందరిని[a] నీతో తీసుకెళ్లు. నీవు నైలు నదిని[b] కొట్టిన నీ కర్రను నీ చేతిలో తీసుకొని వెళ్లు.”'
  rationale: సవరణ మూలంలోని స్థానిక ‘ప్రజల ముందు’ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది; కర్రను చేతిలో తీసుకోవడం మరియు వెళ్లడం అనే ఆజ్ఞల వరుసను నిలుపుతుంది; అలాగే ఆంగ్ల పరిశీలనా పథంలో ఉన్న పదసంబంధ ప్రత్యామ్నాయాలను తగిన పాదసూచికలతో అందిస్తుంది. అర్థంలో ఎటువంటి సిద్ధాంతపరమైన లేదా వ్యాఖ్యానాత్మక విస్తరణ చేయలేదు.
