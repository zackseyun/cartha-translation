id: EXO.17.3
reference: Exodus 17:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְמָ֨א שָׁ֤ם הָ/עָם֙ לַ/מַּ֔יִם וַ/יָּ֥לֶן הָ/עָ֖ם עַל מֹשֶׁ֑ה וַ/יֹּ֗אמֶר לָ֤/מָּה זֶּה֙ הֶעֱלִיתָ֣/נוּ מִ/מִּצְרַ֔יִם לְ/הָמִ֥ית אֹתִ֛/י וְ/אֶת בָּנַ֥/י וְ/אֶת מִקְנַ֖/י בַּ/צָּמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: te
  text: అక్కడ ప్రజలు నీళ్ల కోసం దాహపడ్డారు. వారు మోషేపై సణిగారు, “మమ్మల్ని ఐగుప్తు నుండి ఎందుకు తీసుకొచ్చావు? నన్నూ, నా పిల్లలనూ, నా పశువులనూ దాహంతో చంపడానికా?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... הָעָם לַמַּיִם
  choice: ప్రజలు నీళ్ల కోసం దాహంతో అలమటించారు
  rationale: ‘ప్రజలు నీళ్ల కోసం దప్పిగొన్నారు’ అనే మూల భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; పరిస్థితి తీవ్రతను అతిశయించకుండా తెలియజేస్తుంది.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: మోషేపై సణుగుతూ
  rationale: హీబ్రూ క్రియలో ఉన్న అసంతృప్తితో ఫిర్యాదు చేయడం అనే భావాన్ని ‘సణుగు’ సహజంగా అందిస్తుంది.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: మమ్మల్ని ... ఎందుకు తీసుకొచ్చావు?
  rationale: పదశః ‘ఇది ఎందుకు—మమ్మల్ని పైకి తీసుకొచ్చావు’ అనే నిర్మాణాన్ని తెలుగులో సహజమైన కారణప్రశ్నగా అందిస్తుంది; ఐగుప్తు నుండి బయలుదేరింపును ‘తీసుకొచ్చావు’ స్పష్టంగా సూచిస్తుంది.
- source_word: מִקְנַי
  choice: నా పశువులను
  rationale: సందర్భంలో వ్యక్తికి చెందిన పశుసంపదను సూచించే సాధారణ, విస్తృత తెలుగు పదం.
- source_word: בַּצָּמָא
  choice: దాహంతో
  rationale: మూలంలోని సాధన/కారణ భావాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: సమూహం మాట్లాడుతున్నప్పటికీ ఏకవచన ‘నన్ను’ వాడటం
  choice: నన్నూ, నా పిల్లలనూ, నా పశువులనూ
  alternative: మమ్మల్నీ, మా పిల్లలనూ, మా పశువులనూ
  rationale: మసొరేటిక్ పాఠంలో אֹתִי, בָּנַי, מִקְנַי అన్నీ ఏకవచన ప్రథమ పురుషంలో ఉన్నాయి. ప్రజలను ఒక సమూహ స్వరంగా చూపే ఈ అసాధారణ మార్పును సవరించకుండా నిలుపుతుంది.
- issue: ప్రశ్నలో ఉద్దేశారోపణ
  choice: దాహంతో చంపడానికా?
  alternative: దాహంతో చంపడానికి
  rationale: לְהָמִית ఉద్దేశాన్ని సూచిస్తుంది; ప్రజలు మోషేపై చేసిన ఆరోపణను ప్రశ్నారూపంలోనే ఉంచి, అది వాస్తవ దైవిక ఉద్దేశమని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచన గౌరవాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని సమూహ బహువచనం నుండి ప్రతినిధి ఏకవచనానికి మార్పు ఉద్దేశపూర్వకంగా సంరక్షించబడింది.
