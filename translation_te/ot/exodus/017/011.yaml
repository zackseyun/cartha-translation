source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖/וֹ וְ/גָבַ֣ר יִשְׂרָאֵ֑ל וְ/כַ/אֲשֶׁ֥ר יָנִ֛יחַ יָד֖/וֹ וְ/גָבַ֥ר עֲמָלֵֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: te
  text: మోషే తన చెయ్యి పైకెత్తినప్పుడల్లా[a] ఇశ్రాయేలు పైచేయి సాధించేది; అతడు తన చెయ్యి దించినప్పుడల్లా[b] అమాలేకు పైచేయి సాధించేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే తన చెయ్యి పైకెత్తినప్పుడు … తన చెయ్యి దించినప్పుడు.” హీబ్రూ నిర్మాణాన్ని ‘అప్పుడు’ అని మరింత రూపానుగుణంగా అనువదించవచ్చు; అయితే యుద్ధంలో ఇది పదేపదే జరిగినట్లు సందర్భం సూచిస్తున్నందున ‘అప్పుడల్లా’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘దించిన’ అని అనువదించిన క్రియకు ‘విశ్రాంతి కలిగించిన’ లేదా ‘కిందికి దించిన’ అనే అర్థాలు కూడా రావచ్చు. ‘పైకెత్తిన’ అనే మాటతో ఉన్న వ్యత్యాసం ఇక్కడ ‘దించిన’ అనే భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: పైకెత్తినప్పుడల్లా
  rationale: ఈ నిర్మాణం యుద్ధ సమయంలో పదేపదే ఏర్పడిన పరిస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడల్లా’ ఆ పునరావృత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָרִים
  choice: పైకెత్తిన
  rationale: רום హిఫీల్ రూపానికి ‘పైకెత్తు’ నేరమైన, సహజమైన సమానం; చెయ్యిని ఎంతసేపు అలాగే ఉంచాడో అదనంగా నిర్దేశించదు.
- source_word: יָדוֹ
  choice: తన చెయ్యి
  rationale: మూలంలోని יָד పదానికి ‘చెయ్యి’ నేరమైన సమానం. ‘చేయి’ కంటే ‘చెయ్యి’ సాధారణ ఆధునిక వాడుకకు అనుకూలం.
- source_word: וְגָבַר
  choice: పైచేయి సాధించేది
  rationale: גבר ఇక్కడ యుద్ధంలో బలంగా ఉండడం లేదా ఆధిక్యం పొందడం అనే భావం ఇస్తుంది. ‘పైచేయి సాధించేది’ తాత్కాలిక యుద్ధాధిక్యాన్ని తెలియజేస్తుంది; సంపూర్ణంగా ఓడించారనే అధిక భావాన్ని చేర్చదు.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజాసమూహాన్ని సూచించే పేరుకు ప్రామాణిక తెలుగు బైబిలు రూపం.
- source_word: יָנִיחַ
  choice: దించిన
  rationale: נוח హిఫీల్ రూపం ‘విశ్రాంతి కలిగించు/కింద పెట్టు’ అని కూడా అర్థమవుతుంది. పైకెత్తడానికి వ్యతిరేకంగా ఇక్కడ ‘దించు’ సహజమైన భావం.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: జాతి/ప్రజాసమూహం పేరుకు తెలుగులో స్థిరపడిన రూపం.
