  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. పునరావృత చర్యను ‘అప్పుడల్లా’తో, యుద్ధంలో మారుతూ వచ్చిన ఆధిక్యాన్ని ‘పైచేయి సాధించేది’తో వ్యక్తం చేశాం. రెండు పాదాల సమాంతర నిర్మాణాన్ని నిలుపుకున్నాం.
