reference: Exodus 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: te
  text: 'అప్పుడు మోషే యాహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “ఈ ప్రజల విషయంలో నేనేమి చేయాలి? ఇంకొంచెం అయితే[a] వాళ్లు నన్ను రాళ్లతో కొడతారు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఇంక కొంచెం, వాళ్లు నన్ను రాళ్లతో కొడతారు”; అంటే ముప్పు అతి సమీపంలో ఉందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: మొరపెట్టి
  rationale: צעק అనేది సాధారణంగా పిలవడం మాత్రమే కాక, ఆపదలో సహాయం కోరుతూ గట్టిగా వేడుకోవడాన్ని సూచిస్తుంది. ‘మొరపెట్టి’ మోషే ఆవేదనను, అత్యవసరతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం יְהוָהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే హెబ్రీ క్రియారూపాన్ని తెలుగు కథన ప్రవాహానికి సహజంగా వాక్యాంతంలోని ‘అన్నాడు’తో వ్యక్తం చేశాం.
- source_word: מָה אֶעֱשֶׂה
  choice: నేనేమి చేయాలి?
  rationale: మోషే తాను ఎలా వ్యవహరించాలో అత్యవసరంగా అడుగుతున్న భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: לָעָם הַזֶּה
  choice: ఈ ప్రజల విషయంలో
  rationale: עשהతో వచ్చిన ל సంబంధం లేదా వారిపట్ల ఎలా వ్యవహరించాలనే భావాన్ని సూచిస్తుంది. ‘ఈ ప్రజల విషయంలో’ అనేది తెలుగు వాడుకలో సహజంగా ఉండి, ‘వారికి’ లేదా ‘వారితో’ అనే ఒక్క అర్థాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: עֹוד מְעַט
  choice: ఇంక కొంచెమే ఆలస్యమైతే
  rationale: అక్షరార్థంగా ‘ఇంక కొంచెం’ అనే ఈ పదబంధం ముప్పు అతి సమీపంలో ఉందని సూచిస్తుంది. ఎటువంటి కాలవ్యవధిని నిర్దిష్టంగా చేర్చకుండా ఆ ఆసన్నతను తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: וּסְקָלֻנִי
  choice: వాళ్లు నన్ను రాళ్లతో కొడతారు
  rationale: סקל రాళ్లతో కొట్టడాన్ని, చాలాసార్లు రాళ్లతో కొట్టి చంపడాన్ని సూచిస్తుంది. మూలంలో ‘చంపడం’ అనే ఫలితం ప్రత్యేకంగా చెప్పబడనందున, ‘రాళ్లతో కొడతారు’ అని నేరుగా అనువదించి ఆ విస్తృతిని నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ఆధునికంగా సాధారణమైన ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించడం మూలపాఠాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- issue: రాళ్లతో కొట్టడం మరణశిక్షనేనా అనే ప్రశ్న
  choice: రాళ్లతో కొడతారు
  alternative: రాళ్లతో కొట్టి చంపుతారు
  rationale: סקל తరచుగా రాళ్లతో కొట్టి చంపడాన్ని సూచించినా, ఈ వాక్యంలో మోషేకు ఎదురైన ఆసన్న దాడి ప్రధానంగా చెప్పబడింది. ఫలితాన్ని స్పష్టంగా చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని వాడాం. ‘మొరపెట్టి’ అత్యవసర ప్రార్థనను తెలియజేస్తుంది; ‘ఈ ప్రజల విషయంలో’ మూలంలోని సంబంధార్థక విస్తృతిని కాపాడుతుంది. పాదసూచిక గుర్తును అది వివరించే עֹוד מְעַט పదబంధం దగ్గర ఉంచాం.
