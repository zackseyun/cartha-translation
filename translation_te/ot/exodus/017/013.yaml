  text: וַ/יַּחֲלֹ֧שׁ יְהוֹשֻׁ֛עַ אֶת עֲמָלֵ֥ק וְ/אֶת עַמּ֖/וֹ לְ/פִי חָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: te
  text: యెహోషువ అమాలేకును అతని ప్రజలనూ కత్తితో ఓడించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరానుసారంగా, “కత్తి ధారతో.” హీబ్రూలో అక్షరార్థం “కత్తి నోటితో”; ఇది ఆయుధపోరాటం ద్వారా ఓడించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: ఓడించాడు
  rationale: חלש అనే క్రియకు ‘బలహీనపరచడం’ లేదా ‘పైచేయి సాధించడం’ అనే భావాలు ఉండవచ్చు. యుద్ధ సందర్భంలో ‘ఓడించాడు’ అనేది సైనిక విజయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అయితే పూర్తిగా నిర్మూలించాడనే భావాన్ని జోడించదు.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: ఇది పూర్వికుని పేరుతో సూచించబడిన అమాలేకీయ దళాన్ని లేదా సమూహాన్ని సూచించగల నామం; హీబ్రూలోని ఏకవచన నామరూపాన్ని నిలిపాం.
- source_word: עַמּוֹ
  choice: అతని ప్రజలను
  rationale: עַם యొక్క సాధారణ అర్థం ‘ప్రజలు.’ యుద్ధ సందర్భంలో ఇది అమాలేకు ఆధీనంలోని యోధులను సూచించే అవకాశమున్నా, ‘అతని ప్రజలు’ మూలపాఠానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: לְפִי חָרֶב
  choice: కత్తితో
  rationale: అక్షరార్థంగా ‘కత్తి నోటితో’ అనే ఈ హీబ్రూ నుడికారం ఆయుధపోరాటం ద్వారా ఓటమిని సూచిస్తుంది. ‘కత్తితో’ అనేది దాని సహజమైన, స్పష్టమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడాం. మూలంలోని సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ, సంపూర్ణ నిర్మూలన వంటి అదనపు భావాన్ని చేర్చలేదు.
