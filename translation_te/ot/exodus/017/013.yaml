revisions:
- from: యెహోషువ అమాలేకును, అతని ప్రజలను కత్తితో ఓడించాడు.[a]
  to: యెహోషువ అమాలేకును అతని ప్రజలనూ కత్తితో ఓడించాడు.[a]
  rationale: The revision makes the two Hebrew direct objects clearly coordinated in idiomatic modern Telugu and improves the formal lexical alternative in the footnote. It does not alter the verse’s meaning or add an implication of total destruction.
  reviewer_model: gpt-5.6-terra
