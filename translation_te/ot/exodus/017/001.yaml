id: EXO.17.1
reference: Exodus 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: te
  text: తరువాత ఇశ్రాయేలీయుల సమాజమంతా సీను అరణ్యం నుండి ప్రయాణ దశలవారీగా[a], యాహ్వే ఆదేశం ప్రకారం[b] ప్రయాణించి, రెఫీదీములో మకాం వేసింది. అయితే ప్రజలు తాగడానికి నీళ్లు లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘వారి ప్రయాణ దశల ప్రకారం’ అని ఉంటుంది; అంటే వారు దశలవారీగా, ఒక్కో విడిది నుండి మరొక విడిదికి ప్రయాణించారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే నోటి ప్రకారం’; ఇది ఆయన ఆదేశం లేదా నిర్దేశం ప్రకారం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: ప్రయాణించి
  rationale: נסע అనే క్రియ శిబిరాన్ని ఎత్తి ముందుకు సాగడాన్ని సూచిస్తుంది. సందర్భంలో ‘ప్రయాణించి’ సహజంగా ఉండి కథన గమనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతా
  rationale: עֵדָה సమష్టిగా కూడిన సమాజాన్ని సూచిస్తుంది. బְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, సమాజంలోని వారందరినీ సూచించేలా ‘ఇశ్రాయేలు ప్రజలు’ అని అనువదించాం.
- source_word: מִמִּדְבַּר סִין
  choice: సీను అరణ్యం నుండి
  rationale: מִדְבָּרకు ‘అరణ్యం’ లేదా ‘ఎడారి ప్రాంతం’ అనే భావం ఉంది. సీను అనేది స్థలనామం; దాన్ని లిప్యంతరీకరించాం.
- source_word: לְמַסְעֵיהֶם
  choice: విడిది విడిదిగా
  rationale: מַסָּע ప్రయాణంలోని ఒక్కో దశను లేదా శిబిరం ఎత్తి ముందుకు సాగే విడతను సూచిస్తుంది. ‘విడిది విడిదిగా’ అనేది దశలవారీ ప్రయాణ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל פִּי יְהוָה
  choice: యాహ్వే ఆదేశం ప్రకారం
  rationale: עַל־פִּי అక్షరార్థంగా ‘నోటి ప్రకారం’ అయినా, ఇది అధికారపూర్వక ఆదేశం లేదా నిర్దేశం ప్రకారం అనే హీబ్రూ నుడికారం. అందువల్ల భావాన్ని స్పష్టంగా తెలిపే అనువాదం ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేసింది
  rationale: חנה ఇక్కడ ప్రయాణ మధ్యలో శిబిరం వేయడాన్ని సూచిస్తుంది. సమాజాన్ని ఏకవచన సమష్టిగా తీసుకుని ‘మకాం వేసింది’ అని సహజంగా అనువదించాం.
- source_word: בִּרְפִידִים
  choice: రెఫీదీములో
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: అయితే ప్రజలు తాగడానికి అక్కడ నీళ్లు లేవు
  rationale: వాక్యంలో కొత్త సమస్యను పరిచయం చేసే וְకు సందర్భానుసారంగా వ్యతిరేక భావం ఉంది; ‘అయితే’ దాన్ని సహజంగా తెలియజేస్తుంది. ‘అక్కడ’ అనేది తెలుగులో స్థితిని స్పష్టం చేసే స్వల్ప సందర్భపూరణ.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించిన ‘Yahweh’ రూపానికి తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ను ఉంచడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘సమాజమంతా’ సమష్టి భావాన్ని కాపాడుతుంది; ‘విడిది విడిదిగా’ ప్రయాణ దశలను సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. దైవనామాన్ని ‘యాహ్వే’గా నిలిపి ఉంచాం.
