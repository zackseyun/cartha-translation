translation:
  language: te
  text: అప్పుడు అమాలేక్ వచ్చి రెఫీదీమ్‌లో ఇశ్రాయేలుతో యుద్ధం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేశాడు” అని కూడా అనువదించవచ్చు. హీబ్రూ ఉపసర్గకు అక్షరార్థంగా “తో” అని అర్థం; యుద్ధ సందర్భంలో అది ప్రత్యర్థిత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది; ‘వచ్చి’ בוא అనే క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: עֲמָלֵק
  choice: అమాలేకు
  rationale: మూలంలోని ఏకవచన ప్రజానామాన్ని లిప్యంతరీకరించి ఉంచాం. సందర్భంలో ఇది అమాలేకీయ ప్రజలను సమష్టిగా సూచిస్తుంది; ‘అమాలేకీయులు’ అని విప్పి చెప్పకుండా మూలంలోని రూపాన్ని కాపాడుతుంది.
- source_word: וַיִּלָּחֶם
  choice: యుద్ధం చేశాడు
  rationale: לחם నిఫల్ రూపం ఇక్కడ పోరాడడం లేదా యుద్ధం చేయడం అనే అర్థం ఇస్తుంది. ‘యుద్ధం చేశాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సమష్టిగా వ్యక్తీకరించిన ‘అమాలేకు’కు సరిపోతుంది.
- source_word: עִם
  choice: తో
  rationale: עִם యొక్క ప్రత్యక్ష అర్థం ‘తో’. ‘ఇశ్రాయేలుతో యుద్ధం చేశాడు’ అనే తెలుగు ప్రయోగమే ప్రత్యర్థిత్వాన్ని సహజంగా తెలియజేస్తూ మూల పదబంధానికి దగ్గరగా ఉంటుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రజలను లేదా జనాన్ని సూచించే ప్రామాణిక నామరూపం; మూలంలోని సమష్టి ప్రజానామాన్ని నిలుపుతుంది.
- source_word: בִּרְפִידִם
  choice: రెఫీదీములో
  rationale: בְ ఇక్కడ సంఘటన జరిగిన స్థలాన్ని సూచిస్తుంది. స్థలనామంతో ‘లో’ ఉపయోగించడం సహజమైన తెలుగు స్థానార్థక నిర్మాణం.
