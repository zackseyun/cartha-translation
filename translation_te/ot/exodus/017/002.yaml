revisions:
- from: అప్పుడు ప్రజలు మోషేతో వాదిస్తూ, “మేము తాగడానికి మాకు నీళ్లు ఇవ్వండి” అన్నారు. మోషే వారితో, “మీరు నాతో ఎందుకు వాదిస్తున్నారు? యెహోవాను ఎందుకు పరీక్షిస్తున్నారు?[a]” అన్నాడు.
  to: అప్పుడు ప్రజలు మోషేతో వాదనకు దిగి, “మేము తాగేందుకు మాకు నీళ్లు ఇవ్వండి” అన్నారు. మోషే వారితో, “మీరు నాతో ఎందుకు వాదిస్తున్నారు? యాహ్వేను ఎందుకు పరీక్షిస్తున్నారు?[a]” అన్నాడు.
