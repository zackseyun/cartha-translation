source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: te
  text: అప్పుడు ప్రజలు మోషేతో వాదనకు దిగి, “మేము తాగేందుకు మాకు నీళ్లు ఇవ్వండి” అన్నారు. మోషే వారితో, “మీరు నాతో ఎందుకు వాదిస్తున్నారు? యాహ్వేను ఎందుకు పరీక్షిస్తున్నారు?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యాహ్వేను ఎందుకు పరీక్షకు పెడుతున్నారు?”'
    reason: נסה అనే క్రియను “పరీక్షించు” అని లేదా “పరీక్షకు పెట్టు” అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיָּרֶב
  choice: వాదిస్తూ
  rationale: ריב అనే క్రియ వివాదం లేదా కలహాన్ని సూచిస్తుంది. ‘వాదిస్తూ’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రజలు మోషేతో ప్రతికూలంగా తలపడిన భావాన్ని నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: మూలంలో నిర్దిష్ట ఉపపదంతో ‘ప్రజలు’ అని మాత్రమే ఉంది; ఈ వచనంలో స్పష్టంగా లేని ‘ఇశ్రాయేలు ప్రజలు’ అనే వివరాన్ని చేర్చలేదు.
- source_word: עִם מֹשֶׁה
  choice: మోషేతో
  rationale: עִם కు ప్రాథమిక అర్థం ‘తో’. ‘మోషేతో వాదిస్తూ’ అనే తెలుగు ప్రయోగమే వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: మాకు నీళ్లు ఇవ్వండి
  rationale: ఆజ్ఞార్థక క్రియను, పరోక్ష కర్మను నేరుగా మరియు సహజంగా అనువదిస్తుంది. సాధారణ తెలుగు వాడుకకు ‘నీళ్లు’ సరిపోతుంది.
- source_word: וְנִשְׁתֶּה
  choice: మేము తాగడానికి
  rationale: ఆజ్ఞ తరువాత వచ్చే cohortative ఇక్కడ ఉద్దేశాన్ని లేదా ఆశించిన ఫలితాన్ని సూచిస్తుంది; ‘తాగడానికి’ దానిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: మీరు నాతో ఎందుకు వాదిస్తున్నారు?
  rationale: మొదటి భాగంలోని ריב పదంతో ఉన్న శబ్దార్థ సంబంధాన్ని ‘వాదిస్తూ/వాదిస్తున్నారు’ అని పునరావృతం చేసి నిలిపింది; מַה ఇక్కడ మందలింపు ప్రశ్నగా ‘ఎందుకు’ అనే భావం ఇస్తుంది.
- source_word: מַה תְּנַסּוּן
  choice: ఎందుకు పరీక్షిస్తున్నారు?
  rationale: נסה పియేల్ రూపం ‘పరీక్షించు’ లేదా ‘పరీక్షకు గురిచేయు’ అని అర్థం. సంక్షిప్తమైన ‘పరీక్షిస్తున్నారు’ దేవుని ఉనికి లేదా సమకూర్పును సవాలు చేసే గంభీరతను తగ్గించదు.
- source_word: אֶת יְהוָה
  choice: యెహోవాను
  rationale: మూలంలోని దైవనామం יהוה ను సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: వచనంలో సాధారణ బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది. ‘యెహోవా’ దాన్ని వ్యక్తిగత నామంగా నిలుపుతుంది; ‘ప్రభువు’ అని మార్చడం మూలంలోని నామాన్ని మరుగుపరుస్తుంది. ‘యాహ్వే’ ఉచ్చారణ కూడా సాధ్యమే.
- issue: దేవుని పట్ల נסה క్రియకున్న బలం
  choice: యెహోవాను పరీక్షిస్తున్నారు
  alternative: యెహోవాను పరీక్షకు గురిచేస్తున్నారు
  rationale: ప్రజలు మోషేతో చేసిన వివాదాన్ని యెహోవాను పరీక్షించడంగా వచనం చూపించే ధార్మిక ఉద్రిక్తతను అలాగే ఉంచింది; దాన్ని కేవలం ఫిర్యాదుగా మృదుపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ప్రజల మాటలో బహువచన గౌరవ ఆజ్ఞారూపమైన ‘ఇవ్వండి’ వాడటం తెలుగులో సమూహం ఒక వ్యక్తిని సంబోధించే సహజ విధానం; అది మోషేపట్ల వారి ధోరణిని అనవసరంగా మర్యాదపూర్వకంగా మార్చదు. మూలంలోని రיב పదబంధ సంబంధాన్ని రెండు చోట్ల ‘వాదించు’తో నిలిపాం.
