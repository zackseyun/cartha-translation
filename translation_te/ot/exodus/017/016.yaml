id: EXO.17.16
reference: Exodus 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: te
  text: 'అతడు అన్నాడు[a]: “యాహ్ సింహాసనం మీద ఒక చెయ్యి ఉంది; తరతరాలపాటు అమాలేకుతో యాహ్వేకు యుద్ధం ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం క్లిష్టమైనది, సంక్షిప్తమైనది; అక్షరార్థంగా, “యాహ్ సింహాసనం మీద ఒక చెయ్యి.” దీనిని “యాహ్ సింహాసనానికి వ్యతిరేకంగా ఒక చెయ్యి” అని కూడా అర్థం చేసుకోవచ్చు. తక్కువ సంభావ్యతతో, כֵּס అనే పదాన్ని “పతాకం” అని తీసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; హీబ్రూలో కర్త పేరు మళ్లీ చెప్పబడనందున ‘అతడు’ అని ఉంచబడింది.
- source_word: כִּי
  choice: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే విరామచిహ్నంలో అంతర్భూతం
  rationale: ఇక్కడ כִּי తరువాతి క్లిష్టమైన, సంక్షిప్తమైన మాటను పరిచయం చేస్తుంది. ‘ఎందుకంటే’ అని చేరిస్తే వాక్య సంబంధాన్ని అనవసరంగా నిర్ణయించినట్లవుతుంది.
- source_word: יָד
  choice: ఒక చెయ్యి
  rationale: మూలంలో నిర్దిష్ట ఉపపదం లేదు; ఎవరి చెయ్యో తెలుపకుండా హీబ్రూ వాక్యంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: עַל
  choice: మీద
  rationale: ఈ విభక్తి యొక్క సాధారణ అర్థం ‘మీద/పై’. ‘వ్యతిరేకంగా’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా ప్రధాన పాఠంలో అతివ్యాఖ్యానం నివారించబడింది.
- source_word: כֵּס
  choice: సింహాసనం
  rationale: అసాధారణమైన ఈ రూపం సాధారణంగా כִּסֵּא (‘సింహాసనం’) యొక్క సంక్షిప్త లేదా లోపలేఖన రూపంగా అర్థం చేసుకోబడుతుంది. ‘పతాకం’ అనే భావం తక్కువ సంభావ్యమైనది.
- source_word: יָהּ
  choice: యాహ్
  rationale: ఇది దేవుని నామానికి చెందిన సంక్షిప్త రూపం; తరువాత వచ్చే పూర్తి יהוה రూపంతో తేడాను నిలుపుతుంది.
- source_word: מִלְחָמָה לַיהוָה
  choice: యెహోవాకు యుద్ధం ఉంటుంది
  rationale: క్రియలేని హీబ్రూ నామవాక్య నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, యుద్ధం యెహోవాకు సంబంధించినదనే భావాన్ని నిలుపుతుంది; ‘యుద్ధం చేస్తాడు’ కంటే ఇది తక్కువ వ్యాఖ్యాత్మకం.
- source_word: בַּעֲמָלֵק
  choice: అమాలేకుతో
  rationale: యుద్ధ సందర్భంలో ב శత్రుత్వ సంబంధాన్ని సూచించగలదు. ‘అమాలేకుతో యుద్ధం’ తెలుగులో సహజంగా విరోధ భావాన్ని తెలియజేస్తుంది.
- source_word: מִדֹּר דֹּר
  choice: తరతరాలపాటు
  rationale: వరుస తరాలన్నిటిలో కొనసాగడాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఒకే వచనంలో יָהּ మరియు יהוה అనే దైవనామాల అనువాదం
  choice: יָהּ ను ‘యాహ్’గా, יהוה ను ‘యెహోవా’గా వేర్వేరుగా చూపించడం
  alternative: రెండింటినీ ఒకే రూపంలో అనువదించడం
  rationale: మూలపాఠంలోని సంక్షిప్త దైవనామం మరియు సంపూర్ణ నామం మధ్య ఉన్న ఉద్దేశపూర్వక రూపభేదాన్ని ఇది కాపాడుతుంది.
- issue: כִּי יָד עַל כֵּס יָהּ అనే సంక్షిప్తమైన, క్లిష్టమైన వాక్యభాగం
  choice: ‘యాహ్ సింహాసనం మీద ఒక చెయ్యి ఉంది’ అని వ్యాఖ్యానాన్ని తగ్గించి అనువదించడం
  alternative: ‘యాహ్ సింహాసనానికి వ్యతిరేకంగా ఒక చెయ్యి ఉంది’ లేదా ‘యాహ్ పతాకం మీద ఒక చెయ్యి ఉంది’
  rationale: హీబ్రూ వాక్యం ఎవరి చెయ్యో, ‘మీద’ అనేది ప్రమాణాన్నా దాడినీ సూచిస్తుందో స్పష్టం చేయదు. ప్రధాన పాఠం ఈ నిజమైన అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్తతను పూర్తిగా సాఫీ చేయకుండా, పఠనయోగ్యత కోసం ‘ఉంది/ఉంటుంది’ అనే క్రియలను చేర్చాం. దైవనామాల రూపభేదాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
