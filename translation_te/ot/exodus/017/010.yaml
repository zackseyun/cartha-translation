translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వ్యక్తినామాలను నిలిపి, ‘అమాలేకు’ వ్యక్తినా లేక ప్రజల సమూహమా అన్న సంక్షిప్తతను పాదటిప్పణిలో సంరక్షించాం.
