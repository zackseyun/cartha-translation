source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יְהוֹשֻׁ֗עַ כַּ/אֲשֶׁ֤ר אָֽמַר ל/וֹ֙ מֹשֶׁ֔ה לְ/הִלָּחֵ֖ם בַּ/עֲמָלֵ֑ק וּ/מֹשֶׁה֙ אַהֲרֹ֣ן וְ/ח֔וּר עָל֖וּ רֹ֥אשׁ הַ/גִּבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: te
  text: యెహోషువ అమాలేకుతో యుద్ధం చేయమని మోషే తనతో చెప్పినట్లే చేశాడు.[a] మోషే, అహరోను, హూరు కొండ శిఖరంపైకి ఎక్కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అమాలేకు’; ఇది అమాలేకు సంతతివారిని, అంటే అమాలేకీయులను సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియ ఇక్కడ ఆదేశించినదాన్ని అమలు చేయడం అనే భావంలో ఉంది; ‘చేశాడు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: మోషే తనతో చెప్పినట్లే
  rationale: మునుపటి వచనంలో మోషే ఇచ్చిన ఆదేశానికి అనుగుణంగా యెహోషువ ప్రవర్తించాడనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి వెళ్లాడు
  rationale: נלחם అంటే పోరాడడం లేదా యుద్ధం చేయడం. తెలుగు వాక్యంలో ఉద్దేశాన్ని స్పష్టంగా కలపడానికి ‘వెళ్లాడు’ను భావసహజంగా చేర్చాం; యెహోషువ చేసిన కార్యం యుద్ధానికి వెళ్లడమేనని సందర్భం తెలియజేస్తుంది.
- source_word: בַּעֲמָלֵק
  choice: అమాలేకుతో
  rationale: לחם తో కూడిన ב ప్రత్యర్థితో యుద్ధం చేయడాన్ని సూచిస్తుంది. మూలంలోని ‘అమాలేకు’ అనే పేరును అలాగే ఉంచి, దానిని నేరుగా ‘అమాలేకీయులు’గా మార్చలేదు.
- source_word: עָלוּ
  choice: ఎక్కారు
  rationale: עלה ఇక్కడ ఎత్తైన ప్రదేశానికి వెళ్లడాన్ని సూచిస్తుంది; కొండ సందర్భంలో ‘ఎక్కారు’ ఆధునిక తెలుగులో సహజం.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: కొండ శిఖరానికి
  rationale: అక్షరార్థంగా ‘కొండ తల’; ఇది కొండ పైభాగం లేదా శిఖరాన్ని సూచించే హీబ్రూ నుడికారం.
- source_word: יְהוֹשֻׁעַ
  choice: యెహోషువ
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు బైబిలు రూపం.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో విస్తృతంగా తెలిసిన రూపం.
- source_word: חוּר
  choice: హూరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించిన రూపం.
