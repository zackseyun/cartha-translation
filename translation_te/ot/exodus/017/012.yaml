base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: te
  text: కాని మోషే చేతులు బరువెక్కాయి. కాబట్టి వారు ఒక రాయి తీసుకొని అతని కింద ఉంచారు; అతడు దానిమీద కూర్చున్నాడు. అహరోను, హూరు అతని చేతులను—ఒకరు ఒక వైపున, మరొకరు ఇంకొక వైపున—పట్టి నిలబెట్టారు. అలా సూర్యాస్తమయం వరకు అతని చేతులు స్థిరంగా ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దృఢంగా ఉన్నాయి.” ఇక్కడి హీబ్రూ పదానికి “స్థిరత్వం,” “దృఢత్వం,” “నమ్మకత్వం” అనే భావాలు ఉన్నాయి; ఈ సందర్భంలో అది మోషే చేతుల శారీరక స్థిరత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: మోషే చేతులు బరువెక్కాయి
  rationale: כְּבֵדִים అనే విశేషణం అక్షరార్థంగా ‘బరువైనవి’; సందర్భంలో అలసట వల్ల చేతులు బరువెక్కిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְחוּ
  choice: వారు ... తీసుకొని
  rationale: హీబ్రూ క్రియ మూడవ పురుష బహువచనంలో ఉండి, కర్తను ప్రత్యేకంగా పేర్కొనదు; అందువల్ల అస్పష్టతను అలాగే ఉంచాం.
- source_word: אֶבֶן
  choice: ఒక రాయి
  rationale: సాధారణ నామవాచకమైన אֶבֶן కు సందర్భోచితమైన సహజ తెలుగు సమానం.
- source_word: וַיֵּשֶׁב עָלֶיהָ
  choice: అతడు దానిమీద కూర్చున్నాడు
  rationale: రాయిని సూచించే స్త్రీలింగ సర్వనామంతో కూడిన వాక్యాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: תָּמְכוּ בְיָדָיו
  choice: అతని చేతులను ... ఆధారంగా పట్టుకున్నారు
  rationale: תמך శారీరకంగా నిలబెట్టడం లేదా ఆసరా ఇవ్వడాన్ని సూచిస్తుంది; ‘ఆధారంగా పట్టుకున్నారు’ దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: ఒకరు ఒక వైపున, మరొకరు ఇంకొక వైపున
  rationale: ఇద్దరూ మోషేకు చెరో వైపున ఉన్నారనే విభజనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: అతని చేతులు స్థిరంగా ఉన్నాయి
  rationale: אֱמוּנָה కు స్థిరత్వం, దృఢత్వం, నమ్మకత్వం అనే భావవ్యాప్తి ఉంది; శారీరక సహాయం ప్రధానమైన ఈ సందర్భంలో ‘స్థిరంగా’ సరిపోతుంది, కాగా విస్తృత భావాన్ని పాదసూచికలో గుర్తించాం.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: సూర్యాస్తమయం వరకు
  rationale: ‘సూర్యుడు అస్తమించే వరకు’ అనే కాలపరిమితిని సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే చేతులకు సంబంధించి אֱמוּנָה యొక్క అర్థం
  choice: శారీరక స్థిరత్వం
  alternative: దృఢంగా / నమ్మకంగా
  rationale: తక్షణ సందర్భం మోషే అలసటను, అహరోను హూరు ఇచ్చిన శారీరక ఆధారాన్ని వివరిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘స్థిరంగా’ ఎంచుకున్నాం; అయితే హీబ్రూ పదంలోని దృఢత్వం లేదా నమ్మకత్వం భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చేతులు’ అనే పునరావృత రూపకాన్ని నిలిపి, పేర్కొనని బహువచన కర్తను ‘వారు’గా అస్పష్టంగానే ఉంచాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
