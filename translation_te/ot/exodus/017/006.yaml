source:
  edition: WLC
  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: te
  text: ఇదిగో, నేను అక్కడ హోరేబులోని బండపై నీ ఎదుట నిలబడతాను[a]. నీవు ఆ బండను కొట్టు; దానినుండి నీళ్లు బయటికి వస్తాయి, ప్రజలు తాగుతారు. ఇశ్రాయేలు పెద్దల కళ్ల ఎదుట మోషే అలాగే చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదిగో, నేను అక్కడ హోరేబులోని బండపై నీ ఎదుట నిలబడి ఉన్నాను.” హీబ్రూ కృదంతాన్ని వర్తమానార్థంలో కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దేవుడు పలికే గంభీరమైన ప్రకటనవైపు శ్రద్ధను మళ్లించే హీబ్రూ సూచనాత్మక పదబంధానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: עֹמֵד
  choice: నిలబడతాను
  rationale: రూపరీత్యా ఇది వర్తమాన కృదంతం (‘నిలబడి ఉన్నాను/నిలబడుతున్నాను’); అయితే ఈ ఆదేశ సందర్భంలో త్వరలో జరగబోయే దైవిక చర్యను సూచించగలదు. ప్రధాన పాఠంలో భవిష్యదర్థాన్ని ఉంచి, వర్తమానార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לְפָנֶיךָ
  choice: నీ ఎదుట
  rationale: మోషేకు ఎదురుగా లేదా అతని సమక్షంలో ఉన్న స్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַצּוּר
  choice: ఆ బండ
  rationale: צוּר సూచించే పెద్ద రాయి లేదా శిలారాశికి ‘బండ’ సాధారణ తెలుగు సమానం; వచనంలోని పునరుక్తిని కూడా అలాగే ఉంచుతుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబులోని
  rationale: స్థలనామంతో సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తూ, బండ హోరేబులో ఉందనే సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִכִּיתָ
  choice: నీవు ... కొట్టు
  rationale: ఆదేశ సందర్భంలోని క్రియాబలాన్ని ‘కొట్టు’ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיָצְאוּ
  choice: బయటికి వస్తాయి
  rationale: ‘బయటికి రావడం’ అనే మూలక్రియార్థాన్ని నిలుపుతుంది; ‘ప్రవహిస్తాయి’ అనే అదనపు చిత్రణను చేర్చదు.
- source_word: מִמֶּנּוּ
  choice: దానిలోనుండి
  rationale: ప్రత్యయం బండను సూచిస్తుంది; తెలుగులో నిర్జీవ పూర్వపదానికి సరిపోయే రూపం.
- source_word: מַיִם
  choice: నీళ్లు
  rationale: సాధారణ ఆధునిక తెలుగులో సహజమైన సమానం; బహువచన క్రియతో హీబ్రూ రూపానికి అనుగుణంగా ఉంది.
- source_word: וְשָׁתָה הָעָם
  choice: ప్రజలు తాగుతారు
  rationale: బండను కొట్టడం, నీళ్లు రావడం, ప్రజలు తాగడం అనే ఫలితక్రమాన్ని అధిక వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: וַיַּעַשׂ כֵּן
  choice: అలాగే చేశాడు
  rationale: హీబ్రూ కథన సారాంశ సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: לְעֵינֵי
  choice: కళ్ల ఎదుట
  rationale: సంఘటన ఇశ్రాయేలు పెద్దలకు ప్రత్యక్ష సాక్ష్యంగా జరిగిందనే దృశ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక స్వప్రకటనలోని వర్తమాన కృదంతం కాలార్థం
  choice: ఇదిగో, నేను ... నిలబడతాను
  alternative: ఇదిగో, నేను ... నిలబడి ఉన్నాను
  rationale: హీబ్రూ కృదంతం వర్తమానంగా అనువదించవచ్చు; అయినా మోషే చేయబోయే చర్యకు ముందుగా దేవుడు అక్కడ ఉండబోతున్నాడనే సమీప భవిష్యదర్థం సందర్భానికి సహజంగా సరిపోతుంది. అసలులోని నిజమైన కాలసందిగ్ధతను పాదటిప్పణి కాపాడుతుంది.
- issue: ‘నీ ఎదుట’ మరియు ‘బండ మీద’ అనే పదబంధాల అన్వయం
  choice: దేవుడు హోరేబులోని బండ మీద మోషే ఎదుట నిలబడతాడు
  alternative: దేవుడు మోషే ఎదుట, హోరేబులోని బండ దగ్గర నిలబడతాడు
  rationale: హీబ్రూ వాక్యనిర్మాణం ‘అక్కడ, హోరేబులోని బండ మీద’ అనే పదబంధాన్ని దేవుని నిలబడటంతో సహజంగా అనుసంధానిస్తుంది. ఆశ్చర్యకరమైన ఈ చిత్రాన్ని సున్నితపరచకుండా, అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘ఇదిగో’ దైవిక ప్రకటన గంభీరతను, ‘బండ,’ ‘నీళ్లు,’ ‘కొట్టు’ సాధారణ పాఠకులకు సులభమైన పదజాలాన్ని అందిస్తాయి. ‘కళ్ల ఎదుట’ ప్రజాసాక్ష్య భావాన్ని నిలుపుతుంది.
