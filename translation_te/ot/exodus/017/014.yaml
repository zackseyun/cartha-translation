  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “దీనిని జ్ఞాపకార్థంగా గ్రంథంలో[a] రాయి; యెహోషువకు వినిపించు[b]. ఎందుకంటే ఆకాశం క్రింద నుండి అమాలేకు జ్ఞాపకాన్ని నేను తప్పకుండా చెరిపివేస్తాను[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక గ్రంథంలో’ లేదా ‘గ్రంథపు చుట్టలో’ అని కూడా అనువదించవచ్చు; హీబ్రూలో అక్షరార్థంగా ‘ఆ గ్రంథంలో’ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘యెహోషువ చెవుల్లో ఉంచు’; అంటే అతనికి వినిపించు లేదా అతని ఎదుట చదివి వినిపించు.
    reason: lexical_alternative
  - marker: c
    text: ‘నేను తప్పకుండా చెరిపివేస్తాను’ అనే హీబ్రూ ప్రయోగం బలమైన ఉద్ఘాటనను వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఆధునిక లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: כְּתֹב
  choice: రాయి
  rationale: כתב క్రియ యొక్క ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: זֹאת זִכָּרוֹן
  choice: దీనిని జ్ఞాపకార్థంగా
  rationale: ఈ సంఘటనను భవిష్యత్తులో గుర్తుంచుకునే ఉద్దేశంతో లిఖించాలనే భావాన్ని నిలుపుతుంది.
- source_word: בַּסֵּפֶר
  choice: గ్రంథంలో
  rationale: హీబ్రూ పదంలోని నిర్దిష్ట ఉపపదాన్ని ప్రతిబింబిస్తూ ‘గ్రంథంలో’ అని అనువదించబడింది; సందర్భానుసారం ‘ఒక గ్రంథంలో’ లేదా ‘గ్రంథపు చుట్టలో’ అని కూడా అర్థం చేసుకోవచ్చు.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: యెహోషువకు వినిపించు
  rationale: అక్షరార్థంగా ‘యెహోషువ చెవుల్లో ఉంచు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు భావానువాదం.
- source_word: מָחֹה אֶמְחֶה
  choice: నేను తప్పకుండా తుడిచివేస్తాను
  rationale: క్రియకు ముందు వచ్చిన infinitive absolute ఇచ్చే నిశ్చయాత్మక ఉద్ఘాటనను ‘తప్పకుండా’ నిలుపుతుంది.
- source_word: זֵכֶר עֲמָלֵק
  choice: అమాలేకు జ్ఞాపకాన్ని
  rationale: זֵכֶר యొక్క ‘జ్ఞాపకం/స్మరణ’ భావాన్ని నిలుపుతూ, ముందున్న זִכָּרוֹן (‘జ్ఞాపకార్థం’)తో ఉద్దేశపూర్వకమైన వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: ఆకాశం కింద
  rationale: సంపూర్ణ తొలగింపును సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠంలో יְהוָה అనే వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘జ్ఞాపకార్థంగా’ మరియు ‘జ్ఞాపకాన్ని’ అనే పదాల ద్వారా మూలంలోని זִכָּרוֹן/זֵכֶר పదసంబంధం, అలాగే ఇశ్రాయేలు ఈ సంఘటనను జ్ఞాపకంగా నిలపడం—అమాలేకు జ్ఞాపకం తుడిచివేయబడడం అనే వ్యత్యాసం సంరక్షించబడింది.
