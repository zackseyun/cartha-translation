source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: te
  text: అతడు ఆ స్థలానికి మస్సా, మెరీబా[a] అని పేరు పెట్టాడు; ఎందుకంటే ఇశ్రాయేలు కుమారుల[b] కలహం వల్లను, “యాహ్వే మన మధ్య ఉన్నాడా, లేడా?” అని ప్రశ్నిస్తూ వారు యాహ్వేను పరీక్షించినందువల్లను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మస్సా’ హెబ్రీలో ‘పరీక్షించడం’ అనే పదంతో, ‘మెరీబా’ ‘కలహం’ లేదా ‘వివాదం’ అనే పదంతో శబ్దసామ్యం కలిగి ఉన్నాయి.
    reason: స్థలనామాలకు ఈ వాక్యంలోని చర్యలతో ఉన్న హెబ్రీ పదప్రయోగ సంబంధాన్ని తెలియజేయడానికి.
  - marker: b
    text: ‘ఇశ్రాయేలు కుమారులు’ అనేది ఇక్కడ ఇశ్రాయేలు ప్రజలను సామూహికంగా సూచిస్తుంది; ‘ఇశ్రాయేలీయులు’ అని కూడా అనువదించవచ్చు.
    reason: హెబ్రీ నుడికారంలోని పదరూపాన్నీ దాని సామూహిక అర్థాన్నీ రెండింటినీ కాపాడడానికి.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: అతడు ఆ స్థలానికి ... అని పేరు పెట్టాడు
  rationale: קרא שׁם అనే హెబ్రీ నామకరణ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ అని వ్యక్తం చేస్తుంది; కర్తను మూలంలోని విధంగానే ‘అతడు’గా ఉంచుతుంది.
- source_word: מַסָּה וּמְרִיבָה
  choice: మస్సా, మెరీబా
  rationale: ఇవి స్థల నామాలు కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం; వాటి పదప్రయోగ సంబంధాన్ని పాదసూచికలో వివరించాం.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల కలహం కారణంగా
  rationale: עַל ఇక్కడ కారణాన్ని సూచిస్తుంది; רִיבకు సందర్భానుకూలంగా ‘కలహం’ ఎంచుకున్నాం. בְּנֵי יִשְׂרָאֵל యొక్క రూపాన్ని నిలుపుతూ దాని సామూహిక భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: వారు యాహ్వేను పరీక్షించిన కారణంగా
  rationale: పియేల్ రూపంలోని נסה ఇక్కడ దేవుని పరీక్షకు పెట్టడాన్ని సూచిస్తుంది. తెలుగులో నేరుగా, స్పష్టంగా ‘పరీక్షించిన’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: యాహ్వే మన మధ్య ఉన్నాడా, లేడా?
  rationale: בְּקֶרֶב యొక్క సమాజం మధ్యనున్న సన్నిధి భావాన్ని ‘మన మధ్య’ సహజంగా అందిస్తుంది; אִם אָיִןను తెలుగు ద్వంద్వ ప్రశ్న రూపమైన ‘ఉన్నాడా, లేడా?’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా గుర్తించదగిన ‘యాహ్వే’ రూపంలో ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ రూపాన్ని ప్రధాన పాఠంలో నిలిపాం; ఇది కేవలం పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచించే హెబ్రీ నుడికారమని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ప్రజలు యాహ్వేను పరీక్షించడం
  choice: పరీక్షించారు
  alternative: శోధించారు / పరీక్షకు పెట్టారు
  rationale: נסהకు ఉన్న ‘పరీక్షించు’ భావాన్ని నేరుగా ఉంచాం; ప్రజల ప్రశ్నలోని అవిశ్వాసం లేదా సవాలు పాఠకుడికి కనిపించేలా వదిలి, అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. మూలంలోని నామకరణ సూత్రాన్ని నిలిపేందుకు చివర ‘అతడు దానికి ఆ పేరు పెట్టాడు’ అని కారణ వాక్యాన్ని స్పష్టంగా ప్రధాన క్రియతో అనుసంధానించాం. స్థల నామాలు, దైవ నామం లిప్యంతరీకరించబడ్డాయి; హెబ్రీ పదచమత్కారం పాదసూచికలో ఉంచబడింది.
