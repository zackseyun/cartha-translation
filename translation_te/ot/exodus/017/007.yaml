- from: అతడు ఆ స్థలానికి మస్సా, మెరీబా[a] అని పేరు పెట్టాడు. ఇశ్రాయేలు కుమారుల[b] కలహం కారణంగా, అలాగే వారు “యాహ్వే మన మధ్య ఉన్నాడా, లేడా?” అని అంటూ యాహ్వేను పరీక్షించిన కారణంగా అతడు దానికి ఆ పేరు పెట్టాడు.
  to: అతడు ఆ స్థలానికి మస్సా, మెరీబా[a] అని పేరు పెట్టాడు; ఎందుకంటే ఇశ్రాయేలు కుమారుల[b] కలహం వల్లను, “యాహ్వే మన మధ్య ఉన్నాడా, లేడా?” అని ప్రశ్నిస్తూ వారు యాహ్వేను పరీక్షించినందువల్లను.
