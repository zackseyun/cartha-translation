id: EXO.17.15
reference: Exodus 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: te
  text: మోషే ఒక బలిపీఠాన్ని కట్టి, దానికి “యాహ్వే నా ధ్వజం”[a] అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “YHWH నా ధ్వజం” లేదా “యాహ్వే నా ధ్వజం.” ఈ బిరుదు యాహ్వే ఇశ్రాయేలు విజయానికి సమీకరణ ధ్వజం లేదా పతాకం అనే భావాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టి
  rationale: בנה అనే క్రియ ఇక్కడ కథన రూపంలో నిర్మించడాన్ని సూచిస్తుంది; బలిపీఠం సందర్భంలో ‘కట్టి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: ఇది బలి అర్పించే లేదా ఆరాధనకు సంబంధించిన పీఠాన్ని సూచించే సాధారణ హెబ్రీ పదం; ‘బలిపీఠం’ ప్రత్యక్షమైన స్థిర తెలుగు సమానం.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: దానికి … అని పేరు పెట్టాడు
  rationale: అక్షరార్థంగా ‘దాని పేరు పిలిచాడు’ అనే హెబ్రీ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ‘పేరు పెట్టాడు’ అని అందించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న YHWH అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలిపాం.
- source_word: נִסִּי
  choice: నా ధ్వజం
  rationale: נֵס అంటే ధ్వజం, పతాకం లేదా సమీకరణ సూచిక. నామవాచక వాక్యంలో అంతర్లీనంగా ఉన్న ‘అయి ఉన్నాడు’ భావాన్ని తెలుగు శీర్షికలో సహజంగా విడిచిపెట్టి, రూపకాన్ని ‘నా ధ్వజం’గా నిలిపాం.
theological_decisions:
- issue: స్మారక బలిపీఠపు పేరులో יְהוָה దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగులో స్థిరమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: יְהוָה נִסִּי అనే నామంలోని నామవాచక వాక్య సంబంధం
  choice: యెహోవా నా ధ్వజం
  alternative: యెహోవా నా ధ్వజంగా ఉన్నాడు
  rationale: హెబ్రీలో స్పష్టమైన అనుసంధాన క్రియ లేదు. సంక్షిప్త నామరూపాన్ని నిలిపి, ‘నా ధ్వజం’ అనే రూపకంలోని సమీకరణ, ఆశ్రయం, విజయ సూచనల మధ్య ఉన్న విస్తృత భావాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దానికి … అని పేరు పెట్టాడు’ అనే రూపం హెబ్రీ నామకరణ సూత్రాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; ‘ధ్వజం’ రూపక గంభీరతను కాపాడుతుంది.
