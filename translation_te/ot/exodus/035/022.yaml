id: EXO.35.22
reference: Exodus 35:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: te
  text: పురుషులు స్త్రీలతో కలిసి వచ్చారు[a]. హృదయపూర్వకంగా ఇవ్వడానికి సిద్ధంగా ఉన్నవారందరూ కొక్కాలు, చెవిపోగులు, ఉంగరాలు, ఆభరణాలు—అన్నిరకాల బంగారు వస్తువులు—తెచ్చారు[b]. యాహ్వేకు బంగారాన్ని ఊపే అర్పణగా సమర్పించిన ప్రతి పురుషుడూ సమర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘స్త్రీల మీద/తో పురుషులు’ అని ఉంటుంది. సందర్భంలో ఇది పురుషులు స్త్రీలతో కలిసి లేదా వారికి తోడుగా వచ్చారని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి కొన్ని ఆభరణ పదాల ఖచ్చితార్థం అనిశ్చితం. ‘కొక్కాలు’ అనేది బిగింపులు లేదా ఒక రకమైన ఉంగరాలు కావచ్చు; ‘చెవిపోగులు’ ముక్కుపుడకలు కూడా కావచ్చు; ‘ఆభరణాలు’ అనేది వేలాడే నగ లేదా చేతికి ధరించే నగ వంటి ప్రత్యేక వస్తువును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; తెలుగులో సహజమైన వాక్యప్రవాహంలో క్రియ సరిపోతుంది.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: పురుషులు స్త్రీలతో కలిసి
  rationale: עַל ఇక్కడ అక్షరార్థంలోని ‘మీద’ కాక, స్త్రీలతో కూడ లేదా వారికి తోడుగా పురుషులు రావడాన్ని సూచించే సందర్భోచిత ప్రయోగం. అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: כֹּל נְדִיב לֵב
  choice: హృదయపూర్వకంగా ఇవ్వడానికి సిద్ధంగా ఉన్నవారందరూ
  rationale: నిర్బంధం లేని ఇష్టపూర్వకమైన, ఉదారమైన అంతరంగ వైఖరిని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חָח
  choice: కొక్కాలు
  rationale: ఈ పదం కొక్కెం, బిగింపు వస్తువు లేదా ఒక రకమైన ఆభరణాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో తటస్థమైన ‘కొక్కాలు’ను ఎంచుకుని అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: נֶזֶם
  choice: చెవిపోగులు
  rationale: నֶזֶם చెవికి లేదా ముక్కుకు ధరించే ఉంగరాన్ని సూచించవచ్చు; ఆభరణాల జాబితాలో ‘చెవిపోగులు’ సహజమైన ఎంపిక.
- source_word: טַבַּעַת
  choice: ఉంగరాలు
  rationale: ముద్ర ఉంగరాలు కావచ్చునప్పటికీ మూలపదం సాధారణంగా ఉంగరాన్ని సూచిస్తుంది; అధిక నిర్దిష్టతను నివారించాం.
- source_word: כוּמָז
  choice: ఆభరణాలు
  rationale: అరుదైన ఈ పదం యొక్క ఖచ్చితార్థం తెలియదు; వేలాడే ఆభరణం, చేతి ఆభరణం వంటి ప్రతిపాదనలు ఉన్నందున విస్తృత పదాన్ని వాడాం.
- source_word: כָּל כְּלִי זָהָב
  choice: అన్నిరకాల బంగారు వస్తువులు
  rationale: כְּלִי అంటే వస్తువు, పాత్ర, పరికరం వంటి విస్తృత భావం. కేవలం నగలకు పరిమితం చేయకుండా సందర్భానికి సరిపోయే విస్తృత అనువాదం.
- source_word: וְכָל אִישׁ
  choice: ప్రతి పురుషుడూ
  rationale: మూలంలోని ఏకవచన పుంలింగ אישׁను స్పష్టంగా నిలిపింది.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: బంగారాన్ని ప్రతిష్ఠార్పణగా అర్పించిన
  rationale: הֵנִיף/תְּנוּפָה ఎత్తి లేదా ఊపి సమర్పించే ఆచారపరమైన అర్పణను సూచిస్తాయి. తెలుగులో అపార్థం కలిగించే అక్షరార్థ ‘ఊపాడు’ కన్నా ఆచారపరమైన సమర్పణ భావాన్ని తెలిపే ‘ప్రతిష్ఠార్పణ’ వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు సాధారణ బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’ను వాడాం; ‘ప్రభువు’గా మార్చకుండా మూలంలోని దైవనామ స్వభావాన్ని నిలిపాం.
- issue: וְכָל אִישׁ లో లింగ సూచన
  choice: ప్రతి పురుషుడూ
  alternative: ప్రతి ఒక్కరూ
  rationale: మూలంలో స్పష్టంగా ఉన్న పుంలింగ ఏకవచనాన్ని తటస్థీకరించకుండా అనువదించాం; ముందటి వాక్యంలో స్త్రీపురుషుల సంయుక్త భాగస్వామ్యం అలాగే ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆభరణ పదాల అనిశ్చితిని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా పాదసూచికల్లో నిలిపాం; ఆచారపరమైన תְּנוּפָה భావాన్ని ‘ప్రతిష్ఠార్పణ’తో తెలియజేశాం.
