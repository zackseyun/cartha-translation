  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: te
  text: యాహ్వే మోషే ద్వారా[b] చేయమని ఆజ్ఞాపించిన సమస్త పనికోసం తీసుకురావాలని ఎవరి హృదయం వారిని ప్రేరేపించిందో[a], అలాంటి ప్రతి పురుషుడూ స్త్రీయూ ఇశ్రాయేలు ప్రజలుగా[c] యాహ్వేకు స్వచ్ఛంద అర్పణను తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎవరి హృదయం వారిని పురికొల్పిందో’ లేదా ‘ఎవరి హృదయం వారిని ఇష్టపూర్వకులుగా చేసిందో’ అని కూడా అనువదించవచ్చు. హీబ్రూ నుడికారం అంతరంగంలోని స్వచ్ఛంద సంకల్పాన్ని లేదా ప్రేరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మోషే చేతి ద్వారా.’ ఇది ‘మోషే ద్వారా’ లేదా ‘మోషే మధ్యవర్తిత్వంతో’ అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ లేదా ‘ఇశ్రాయేలు సంతానం.’ ఇది ఇశ్రాయేలు ప్రజలను సూచించే స్థిర జాతినామం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: ప్రతి పురుషుడూ ప్రతి స్త్రీయూ
  rationale: మూలంలోని పంపిణీ భావాన్ని, పురుషులు-స్త్రీలు ఇద్దరినీ స్పష్టంగా పేర్కొనడాన్ని నిలుపుతుంది; ‘ప్రతి ఒక్కరూ’ అని సాధారణీకరించదు.
- source_word: נָדַב לִבָּם אֹתָם
  choice: ఎవరి హృదయం వారిని ప్రేరేపించిందో
  rationale: హృదయం సంకల్పానికి కేంద్రంగా ఉండి, లోపలి నుంచి స్వచ్ఛందంగా పురికొల్పినదనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהָבִיא
  choice: ఏదైనా తీసుకురావడానికి
  rationale: క్రియకు మూలంలో స్పష్టమైన కర్మ లేకపోయినా, సందర్భంలో పనికోసం సమర్పించాల్సిన వస్తువు ఉద్దేశించబడింది; ‘ఏదైనా’ అనేది ఆ అంతర్లీన కర్మను స్వల్పంగా స్పష్టం చేస్తుంది.
- source_word: לְכָל הַמְּלָאכָה
  choice: పనులన్నిటికీ
  rationale: ఇక్కడ מְלָאכָה గుడార నిర్మాణం మరియు దాని సామగ్రికి సంబంధించిన మొత్తం పనిని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో బహువచన రూపం సహజంగా ఆ సమగ్ర భావాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: యాహ్వే మోషే ద్వారా చేయమని ఆజ్ఞాపించిన
  rationale: בְּיַד מֹשֶׁה అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; ఇక్కడ మధ్యవర్తిత్వం లేదా సాధనత్వాన్ని సూచించే నుడికారం కాబట్టి ‘మోషే ద్వారా’ అని అనువదించబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు ... తీసుకొచ్చారు
  rationale: בְנֵי יִשְׂרָאֵל ఒక స్థిర జాతినామం; ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది. ముందున్న ప్రతి పురుషుడు, ప్రతి స్త్రీ అనే వర్ణనను సమాహారంగా తిరిగి సూచించేందుకు ‘అలా’ చేర్చబడింది.
- source_word: נְדָבָה
  choice: స్వచ్ఛంద అర్పణ
  rationale: బలవంతం వల్ల కాక స్వేచ్ఛగా ఇచ్చిన కానుక అనే పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘అర్పణ’ దేవునికి సమర్పించే సందర్భాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ కంటే హీబ్రూ నామానికి సాధారణంగా అంగీకరించిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘ప్రతి పురుషుడూ ప్రతి స్త్రీయూ’ అనే స్పష్టతను ఉంచుతూ, చివరి సమాహార కర్తను ‘ఇశ్రాయేలు ప్రజలు’గా సహజీకరించాం. దీర్ఘ హీబ్రూ వాక్య నిర్మాణాన్ని డాష్‌తో నిలిపి, పునరుక్త కర్త సంబంధాన్ని కనిపించేలా చేశాం.
