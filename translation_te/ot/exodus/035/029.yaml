revisions:
- from: యాహ్వే మోషే ద్వారా[b] చేయమని ఆజ్ఞాపించిన పనులన్నిటికీ ఏదైనా తీసుకురావడానికి ఎవరి హృదయం వారిని ప్రేరేపించిందో[a], అలాంటి ప్రతి పురుషుడూ ప్రతి స్త్రీయూ—అలా ఇశ్రాయేలు ప్రజలు[c] యాహ్వేకు స్వచ్ఛంద అర్పణ తీసుకొచ్చారు.
  to: యాహ్వే మోషే ద్వారా[b] చేయమని ఆజ్ఞాపించిన సమస్త పనికోసం తీసుకురావాలని ఎవరి హృదయం వారిని ప్రేరేపించిందో[a], అలాంటి ప్రతి పురుషుడూ స్త్రీయూ ఇశ్రాయేలు ప్రజలుగా[c] యాహ్వేకు స్వచ్ఛంద అర్పణను తీసుకొచ్చారు.
  rationale: The revision removes the non-source addition “అలా,” replaces the less coherent dash construction with a direct Telugu clause, and renders מְלָאכָה as the collective “సమస్త పని.” “ఇశ్రాయేలు ప్రజలుగా” expresses the Hebrew collective identification while keeping the preceding “every man and woman” as the sentence’s participants. All original lexical alternatives and their anchors are retained.
