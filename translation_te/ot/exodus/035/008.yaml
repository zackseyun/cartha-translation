  text: oil for the light[a], and spices for the anointing oil and for the fragrant incense,
translation:
  language: te
  text: వెలుగు కోసం నూనె, అభిషేక తైలానికి మరియు సుగంధ ధూపానికి[a] సుగంధ ద్రవ్యాలు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుగంధ ద్రవ్యాల ధూపం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: హీబ్రూ పదం సాధారణంగా నూనెను సూచిస్తుంది; ఈ సందర్భంలో ఒలీవ నూనె ఉద్దేశమై ఉండవచ్చుగానీ, మూలపాఠంలో లేని నిర్దిష్టతను చేర్చకుండా ‘నూనె’ అని అనువదించాం.
- source_word: לַמָּאוֹר
  choice: దీపాలకు
  rationale: ఈ పదబంధం వెలుగు కలిగించడానికి ఉపయోగించే నూనెను సూచిస్తుంది. గుడారపు సామగ్రి సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘దీపాలకు’ అని ఇచ్చాం.
- source_word: בְשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: పరిశుద్ధ సేవలో తయారీలకు ఉపయోగించే పరిమళభరిత పదార్థాలను సూచించే విస్తృతమైన, సహజమైన తెలుగు పదబంధం.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఇది ఆరాధనా సందర్భంలోని స్థిరమైన పదబంధం; గౌరవప్రదమైన, సుపరిచితమైన తెలుగు రూపంగా ‘అభిషేక తైలం’ ఎంచుకున్నాం.
- source_word: קְטֹרֶת
  choice: ధూపం
  rationale: గుడారపు సందర్భంలో కాల్చే సుగంధ పదార్థాన్ని సూచించే సాధారణమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: הַסַּמִּים
  choice: సుగంధ
  rationale: కְטֹרֶת הַסַּמִּים అనే నిర్మాణం అక్షరార్థంగా ‘సుగంధ ద్రవ్యాల ధూపం’ అని ఉండవచ్చు; ప్రధాన పాఠంలో సహజంగా ‘సుగంధ ధూపం’ అని ఇచ్చి, నిర్మాణంలోని ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపాం.
