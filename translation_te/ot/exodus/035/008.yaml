translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా వాక్య నిర్మాణాన్ని కాపాడుతూ సహజంగా రూపొందించాం. ఆరాధనా సందర్భానికి తగిన గౌరవప్రద పదాలైన ‘అభిషేక తైలం,’ ‘ధూపం’ వాడాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
