language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “చూడండి, యాహ్వే యూదా గోత్రానికి చెందిన హూరు కుమారుడైన ఊరీ కుమారుడు బెసలేలును పేరుతో పిలిచాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులతో,” లేక “ఇశ్రాయేలు సంతానంతో.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ ఆ క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ బహువచన బంధుత్వ పదమైన בְּנֵי యొక్క రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇది ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: רְאוּ
  choice: చూడండి
  rationale: తరువాత చెప్పబోయే విషయంపై శ్రోతల దృష్టిని నిలిపే బహువచన ఆజ్ఞార్థక రూపం.
- source_word: קָרָא ... בְּשֵׁם
  choice: పేరుపెట్టి పిలిచాడు
  rationale: ఒక వ్యక్తిని ప్రత్యేకంగా పేరుతో పిలవడం లేదా నియమించడం అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: בְּצַלְאֵל
  choice: బెసలేలు
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు ధ్వన్యంతరీకరణ.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: హూరు కుమారుడైన ఊరీ కుమారుడు
  rationale: హీబ్రూ వంశావళి నిర్మాణాన్ని నిలుపుతూ బెసలేలు ఊరీ కుమారుడని, ఊరీ హూరు కుమారుడని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְמַטֵּה יְהוּדָה
  choice: యూదా గోత్రానికి చెందిన
  rationale: బెసలేలు గోత్ర సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించాం.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక బంధుత్వ రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతానం
  rationale: హీబ్రూ పదబంధంలోని పురుషలింగ బహువచన బంధుత్వ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సమష్టి జాతివాచక అర్థాన్ని పాదటీకలో వివరించాం.
- issue: קרא בשם లోని పిలుపు లేదా నియామక భావం
  choice: పేరుపెట్టి పిలిచాడు
  alternative: పేరుతో నియమించాడు / ప్రత్యేకంగా ఎంచుకున్నాడు
  rationale: హీబ్రూ నుడికారంలోని వ్యక్తిగత పిలుపు, ఎంపిక లేదా నియామక భావాలను ఒకే నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయకుండా మూలరూపానికి సమీపంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘ఇలా అన్నాడు,’ ‘చూడండి’ వంటి రూపాలు సాధారణ పాఠకులకు సులభంగా ఉంటాయి; వంశావళి నిర్మాణం మరియు దైవనామం మూలపాఠ్యానికి దగ్గరగా నిలుపబడ్డాయి.
