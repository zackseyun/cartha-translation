  to: 'అప్పుడు మోషే ఇశ్రాయేలు కుమారులతో[a] ఇలా అన్నాడు: “చూడండి, యాహ్వే యూదా గోత్రానికి చెందిన హూరు కుమారుడైన ఊరీ కుమారుడు బెసలేలును పేరుతో పిలిచాడు.”'
  rationale: The call-by-name idiom is revised to ‘పేరుతో పిలిచాడు’ to avoid suggesting that Bezalel was being named. The genealogy is reordered around Bezalel for clearer, more natural Telugu while retaining every source element and its relationship.
