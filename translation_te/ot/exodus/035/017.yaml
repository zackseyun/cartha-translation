  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: te
  text: ప్రాంగణపు తెరలు[a], దాని స్తంభాలు, వాటి పీఠాలు[b], ప్రాంగణ ద్వారపు అడ్డతెర[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రాంగణపు వేలాడే వస్త్రాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటి దిమ్మలు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ప్రాంగణ ప్రవేశపు తెర.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: తెరలు
  rationale: ప్రాంగణాన్ని చుట్టుముట్టే వస్త్రపు పలకలను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండే పదం.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: గుడారాన్ని చుట్టిన ఆవరణ స్థలాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన నిర్మాణ సంబంధ పదం.
- source_word: עַמֻּדָיו
  choice: దాని స్తంభాలు
  rationale: ప్రాంగణపు తెరలకు ఆధారమైన నిలువు నిర్మాణాలను సూచిస్తుంది; పవిత్ర గుడార నిర్మాణ సందర్భంలో ‘స్తంభాలు’ సముచితం.
- source_word: אֲדָנֶיהָ
  choice: వాటి పీఠాలు
  rationale: స్తంభాలను నిలబెట్టే అడుగు ఆధారాలను సూచిస్తుంది. హీబ్రూలో స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రాంగణాన్ని వ్యాకరణపరంగా సూచించినా, భావపరంగా ఇవి స్తంభాల ఆధారాలు కాబట్టి తెలుగులో ‘వాటి’ సహజం.
- source_word: מָסַךְ
  choice: అడ్డతెర
  rationale: ప్రవేశాన్ని కప్పే ప్రత్యేక వస్త్రాన్ని సూచిస్తుంది. చుట్టూ ఉన్న సాధారణ తెరలతో భేదాన్ని నిలుపుతూ దాని పనిని స్పష్టపరుస్తుంది.
- source_word: שַׁעַר
  choice: ద్వారం
  rationale: ప్రాంగణంలోకి ప్రవేశించే చోటును సూచిస్తుంది; ‘ద్వారం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంటుంది.
