  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: te
  text: విశ్రాంతిదినాన మీ నివాసాల్లో ఎక్కడా నిప్పు రాజేయకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: రాజేయకూడదు
  rationale: בער అనే ధాతువు పియేల్ రూపంలో ఇక్కడ నిప్పును వెలిగించడం లేదా రగిలించడం అనే అర్థం ఇస్తుంది. ‘నిప్పు రాజేయడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం కాల్చడం అనే విస్తృత అర్థాన్ని నివారిస్తుంది.
- source_word: אֵשׁ
  choice: నిప్పు
  rationale: ఏకవచన నామవాచకం వెలిగించబడే అగ్నిని సూచిస్తుంది. ఈ సందర్భంలో ‘నిప్పు’ సాధారణ పాఠకులకు సహజమైన, స్పష్టమైన పదం.
- source_word: בְּכֹל
  choice: ఎక్కడా
  rationale: నిషేధ వాక్యంలో כֹּל పదానికి ఉన్న పంపిణీ భావాన్ని ‘ఎక్కడా ... కూడదు’ సహజమైన తెలుగులో తెలియజేస్తుంది; అది ప్రతి నివాసానికీ నిషేధం వర్తిస్తుందని స్పష్టం చేస్తుంది.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: మీ నివాసాల్లో
  rationale: מוֹשָׁב అనేది ఇల్లు మాత్రమే కాక నివసించే స్థలాన్ని విస్తృతంగా సూచించగలదు. ‘నివాసాలు’ ఆ పరిధినీ గంభీరమైన శైలినీ నిలుపుతుంది.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: విశ్రాంతిదినాన
  rationale: ఈ కాలసూచక పదబంధంలో ‘దినం’ స్పష్టంగా ఉంది. ‘విశ్రాంతిదినాన’ ఆధునిక తెలుగు బైబిలు సందర్భంలో సూటిగా, సహజంగా ఉంది.
theological_decisions:
- issue: విశ్రాంతిదినాన నిప్పుకు సంబంధించిన నిషేధపు పరిధి
  choice: ఆ రోజున నిప్పు రాజేయవద్దనే ప్రత్యక్ష ఆజ్ఞగా అనువదించడం
  alternative: నిప్పును కొనసాగించడం, ఉపయోగించడం లేదా వేడితో సంబంధమున్న అన్ని పనులకూ వర్తించేలా విస్తరించి చెప్పడం
  rationale: హీబ్రూ వాక్యం ఇశ్రాయేలీయుల నివాసాల్లో విశ్రాంతిదినాన నిప్పు రాజేయడాన్ని ప్రత్యేకంగా నిషేధిస్తుంది. తరువాతి వ్యాఖ్యాన సంప్రదాయాల ఆధారంగా దాని పరిధిని అనువాదంలో విస్తరించకుండా, వాక్యంలో ఉన్న ఆజ్ఞనే స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆజ్ఞకు తగిన గంభీరతను నిలుపుతుంది. ‘ఎక్కడా ... కూడదు’ రూపం హీబ్రూ నిషేధంలోని సమగ్ర పంపిణీ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
