  source_fidelity: హీబ్రూ పియేల్ క్రియ תְבַעֲרוּ యొక్క ‘నిప్పు రాజేయడం/వెలిగించడం’ అనే నిర్దిష్ట భావాన్ని సరిగ్గా ఇస్తుంది. ‘మీ నివాసాల్లో ఎక్కడా’ అనేది בְּכֹל מֹשְׁבֹתֵיכֶם యొక్క ప్రతి నివాసానికి వర్తించే పరిధిని సహజంగా వ్యక్తం చేస్తుంది. ‘విశ్రాంతిదినాన’ బְּיוֹם הַשַּׁבָּת కు స్థిరపడిన తెలుగు బైబిలు సమానార్థకం; నిషేధం కేవలం నిప్పు రాజేయడానికేనని స్పష్టంగా ఉంచుతుంది.
