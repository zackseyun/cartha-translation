  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని ‘హృదయంలో ఉంచాడు’ అనే రూపకం నిలుపబడింది; అయితే వాక్యంలోని ఏకవచన ‘హృదయం’ మొదట ప్రస్తావించిన వ్యక్తికి వ్యాకరణపరంగా సంబంధించినదనే మూలపాఠ్య ఉద్వేగం అలాగే ఉంది.
