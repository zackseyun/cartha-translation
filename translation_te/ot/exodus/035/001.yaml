source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: te
  text: 'మోషే ఇశ్రాయేలు కుమారుల సమాజమంతటినీ సమకూర్చి, వారితో ఇలా అన్నాడు: “యాహ్వే చేయమని ఆజ్ఞాపించిన విషయాలు ఇవే.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విషయాలు’ అని అనువదించిన హీబ్రూ పదానికి ‘మాటలు’ లేదా ‘కార్యాలు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: సమావేశపరచి
  rationale: קהל హిఫిల్ రూపం ప్రజలను ఒక సమాజంగా కూడగట్టడాన్ని సూచిస్తుంది; ‘సమావేశపరచి’ ఈ కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతటినీ
  rationale: עֵדָה ఇక్కడ ఇశ్రాయేలు ప్రజల సంఘటిత సమాజాన్ని సూచిస్తుంది; כָּל భావాన్ని ‘అంతటినీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ రూపాన్ని నిలుపుతూ, ఇది నిబంధన సంబంధమైన ప్రజానామమని అర్థమయ్యేలా అనువదించబడింది; సందర్భంలో మొత్తం సమాజమే ఉద్దేశించబడింది.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: విషయాలు ఇవే
  rationale: דְּבָרִים కు ‘మాటలు,’ ‘విషయాలు,’ ‘కార్యాలు’ అనే భావాలు ఉండవచ్చు. తరువాత వచ్చే ఆచరణాత్మక ఆజ్ఞలను దృష్టిలో ఉంచుకొని ‘విషయాలు’ సహజంగా ఉంది; మూలంలోని భావ విస్తృతిని పాదసూచిక తెలియజేస్తుంది.
- source_word: צִוָּה יְהוָה
  choice: యెహోవా ... ఆజ్ఞాపించిన
  rationale: హీబ్రూ సంపూర్ణ క్రియ గతంలో ఇచ్చిన, ఇంకా వర్తించే ఆజ్ఞను సూచిస్తుంది; తెలుగు సంబంధక్రియ నిర్మాణం దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: לַעֲשֹׂת אֹתָם
  choice: చేయమని
  rationale: చేయవలసిన విషయాలను ఆజ్ఞాపించాడనే ప్రయోజనార్థక భావాన్ని ‘చేయమని’ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృత పరిచయం ఉన్న ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం, అయితే ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగరూపం మరియు సమూహార్థం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలిపాం; అయితే ఈ నిబంధన సంబంధమైన పేరు పురుషులకు మాత్రమే పరిమితం కాకుండా మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుందని సందర్భం స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథనశైలి. వాక్య నిర్మాణాన్ని సహజంగా ఉంచుతూ హీబ్రూ సమూహార్థం, దైవనామం, דְּבָרִים పదంలోని భావ విస్తృతి కాపాడబడ్డాయి.
