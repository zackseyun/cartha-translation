translation:
  language: te
  text: షోహమ్ రాళ్లు[a], ఏఫోదు మరియు వక్షపతకం కోసం పొదిగే రాళ్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ షోహమ్ అనే రత్నం ఏదో ఖచ్చితంగా తెలియదు. సంప్రదాయంగా దీనిని ఒనిక్స్ అని అనువదిస్తారు; ఇది బెరిల్ జాతి రత్నం కావచ్చని కూడా భావిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: గోమేధికపు రాళ్లు
  rationale: שֹׁהַם అనే రత్ననామానికి ఖచ్చితమైన ఖనిజ గుర్తింపు అనిశ్చితమైనప్పటికీ, తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘గోమేధికము’ను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయ అవకాశాన్ని పాదసూచికలో తెలిపాం.
- source_word: אַבְנֵי מִלֻּאִים
  choice: పొదిగేందుకు రాళ్లు
  rationale: מִלֻּאִים ఇక్కడ యాజక వస్త్రాల్లో అమర్చే లేదా పొదిగే రాళ్లను సూచిస్తుంది. ‘పొదిగేందుకు రాళ్లు’ అనే ప్రయోజనార్థక పదబంధం సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לָאֵפֹד
  choice: ఏఫోదులో
  rationale: אֵפֹד యాజకుని ప్రత్యేక వస్త్రానికి సాంకేతిక నామం; వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం కంటే లిప్యంతరీకరణ ఆ ఆరాధనా సందర్భ విశిష్టతను కాపాడుతుంది. రాళ్లను దానిలో పొదిగే భావానికి ‘లో’ సహజం.
- source_word: וְלַחֹשֶׁן
  choice: వక్షపతకంలోను
  rationale: חֹשֶׁן యాజకుని ఛాతీపై ధరించే, రత్నాలు పొదిగిన పవిత్ర వస్తువును సూచిస్తుంది; యుద్ధకవచ భావాన్ని నివారిస్తూ ‘వక్షపతకం’ దాని అలంకార, ఆరాధనా స్వభావాన్ని తెలియజేస్తుంది.
