translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘ఏఫోదు’ అనే ఆరాధనా సాంకేతిక పదాన్ని నిలిపి, ‘వక్షపతకం’ మరియు ‘పొదిగేందుకు’ వంటి సులభంగా గ్రహించగల పదాలను ఉపయోగించాం.
