revisions:
- from: గోమేధికపు రాళ్లు[a], ఏఫోదులోను వక్షపతకంలోను పొదిగేందుకు రాళ్లు.
  to: షోహమ్ రాళ్లు[a], ఏఫోదు మరియు వక్షపతకం కోసం పొదిగే రాళ్లు.
  rationale: The revision preserves the disputed gemstone name by transliteration, corrects the purpose relation of the stones to the ephod and breastpiece, and retains clear modern Telugu with the technical term “ఏఫోదు.”
  reviewer_model: gpt-5.6-terra
