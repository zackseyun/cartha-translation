id: EXO.35.23
reference: Exodus 35:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל אִ֞ישׁ אֲשֶׁר נִמְצָ֣א אִתּ֗/וֹ תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ וְ/עִזִּ֑ים וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: te
  text: నీలి నూలు, ఊదారంగు నూలు, ఎర్రని నూలు, సన్నని నారబట్ట, మేక వెంట్రుకలు, ఎర్రరంగు వేసిన పొట్టేళ్ల చర్మాలు, తహషు చర్మాలు[a] ఎవరి దగ్గర ఉన్నాయో, వారందరూ వాటిని తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తహషు’ అనే హిబ్రూ పదం ఏ జంతువును లేదా ఏ రకమైన పదార్థాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు. దీనికి ‘మేలైన తోలు,’ ‘సముద్ర పంది చర్మాలు,’ లేదా ‘డుగాంగ్ చర్మాలు’ అనే అనువాదాలు ప్రతిపాదించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: వారందరూ
  rationale: אִישׁ ఇక్కడ כָלతో కలిసి పంపిణీయ భావంలో ఉంది. తెలుగు వాక్య నిర్మాణంలో ‘ఎవరి దగ్గర... వారందరూ’ అనేది మూలంలోని ప్రతి వ్యక్తిని సూచించే భావాన్ని సహజంగా తెలియజేస్తుంది; సందర్భానికి మించిపోయే లింగ నిర్ధారణను చేయదు.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: ఎవరి దగ్గర ... ఉన్నాయో
  rationale: నిఫాల్ రూపంలోని ‘అతనితో కనబడినవి’ అనే భావాన్ని ఆధునిక తెలుగులో సహజమైన స్వాధీనార్థక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలి నూలు
  rationale: పరిశుద్ధ గుడారపు వస్తుసామగ్రి సందర్భంలో నీలిరంగు వేసిన వస్త్ర నూలును సూచిస్తుంది.
- source_word: אַרְגָּמָן
  choice: ఊదారంగు నూలు
  rationale: ఊదారంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది; జాబితాలోని ఇతర నూలు పదాలతో ఏకరీతిని కాపాడుతుంది.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: కుంకుమ లేదా గాఢ ఎరుపు రంగు వేసిన నూలు పదార్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: שֵׁשׁ
  choice: సన్నని నారబట్ట
  rationale: యాజక, పరిశుద్ధ గుడారపు సందర్భాల్లో వాడే ఉన్నత నాణ్యతగల సన్నని నారవస్త్రాన్ని సూచిస్తుంది.
- source_word: עִזִּים
  choice: మేక వెంట్రుకలు
  rationale: అక్షరార్థంగా ‘మేకలు’ అయినా, ఈ వస్తుసామగ్రి జాబితాలో గుడారపు తెరల కోసం ఉపయోగించే మేక వెంట్రుకలే ఉద్దేశం; సజీవ మేకలను సూచిస్తున్నట్టు అపార్థం కాకుండా చేస్తుంది.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ఎర్రరంగు వేసిన పొట్టేళ్ల చర్మాలు
  rationale: ఎర్రగా రంగు పూయబడిన లేదా శుద్ధి చేయబడిన మగ గొర్రెల చర్మాలనే హిబ్రూ పదబంధం సూచిస్తుంది.
- source_word: עֹרֹת תְּחָשִׁים
  choice: తహషు చర్మాలు
  rationale: תְּחָשׁ సూచించే జంతువు లేదా తోలు రకం నిర్ధారణ కాలేదు. ఊహాత్మక గుర్తింపును ఎంచుకోకుండా లిప్యంతరీకరణ చేసి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: הֵבִיאוּ
  choice: వాటిని తీసుకొచ్చారు
  rationale: బహువచన క్రియను నిలుపుతూ, హిబ్రూలో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
