translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జాబితా నిర్మాణం వాడబడింది. మూలంలోని స్వాధీన భావం ‘ఎవరి దగ్గర... ఉన్నాయో’ అనే సంబంధ వాక్యంతో నిలుపబడింది. అనిశ్చితమైన תְּחָשׁ పదాన్ని ‘తహషు’గా లిప్యంతరీకరించి పాదసూచికలో వివరణ ఇచ్చాం.
