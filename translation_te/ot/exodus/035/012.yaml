translation:
  language: te
  text: మందసాన్ని, దాని మోతకర్రలను, ప్రాయశ్చిత్త మూతను[a], అడ్డుతెరయైన పరదాను,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కరుణాపీఠం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: మందసం
  rationale: గుడారపు సందర్భంలో ఇది పవిత్రమైన ఒడంబడిక పెట్టెను సూచిస్తుంది. ‘మందసం’ తెలుగు బైబిలు వాడుకలో స్థిరపడిన, గౌరవప్రదమైన పదం; ‘పెట్టె’ మరీ సాధారణమైనది.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలు
  rationale: పవిత్ర సామగ్రిని మోసేందుకు అమర్చిన కర్రలను స్పష్టంగా సూచిస్తుంది; ఆధునిక పాఠకుడికి అర్థమయ్యే సహజమైన రూపం.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్త మూత
  rationale: ఇది మందసంపై ఉన్న బంగారు మూతను సూచిస్తూ ప్రాయశ్చిత్త భావాన్ని కూడా కలిగి ఉంది. వస్తువు స్వరూపాన్నీ ఆరాధనాపరమైన ప్రాముఖ్యతనూ కలిపి తెలియజేసే రూపం; సంప్రదాయ ‘కరుణాపీఠం’ను పాదసూచికలో ఉంచాం.
- source_word: פָּרֹכֶת
  choice: పరదా
  rationale: గుడారం లోపలి భాగాలను వేరుచేసే వేలాడే తెరను సూచిస్తుంది. ‘పరదా’ దాని ప్రత్యేకమైన విభజన కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמָּסָךְ
  choice: అడ్డుతెరయైన
  rationale: ఈ పదం అడ్డుగా ఉండే తెర లేదా తెరచాటును సూచిస్తుంది. ‘అడ్డుతెరయైన పరదా’ అనే రూపం రెండు హెబ్రీ పదాల భావాన్ని నిలుపుతూ వాటి వివరణాత్మక సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת / וְאֶת
  choice: '[ప్రత్యక్ష కర్మ సూచికలు విడిగా అనువదించబడలేదు]'
  rationale: పునరావృతమయ్యే אֶת నిర్దిష్ట ప్రత్యక్ష కర్మలను గుర్తిస్తుంది; తెలుగులోని ద్వితీయావిభక్తి ప్రత్యయాలు, జాబితా నిర్మాణం వాటి వ్యాకరణ పాత్రను వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: గుడారం సందర్భంలో הַכַּפֹּרֶת పదానికి అనువాదం
  choice: ప్రాయశ్చిత్త మూత
  alternative: కరుణాపీఠం
  rationale: హెబ్రీ పదం మందసం మీదున్న మూతకు పేరు పెట్టడమే కాక ప్రాయశ్చిత్త సంబంధాన్నీ కలిగి ఉంది. ‘ప్రాయశ్చిత్త మూత’ వస్తువును మరియు ఆరాధనాపరమైన భావాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయబద్ధమైన ‘కరుణాపీఠం’ను ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చి పదంలోని భావసాంద్రతను ఏకపక్షంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బైబిలు శైలిని కొనసాగిస్తూ అనువదించబడింది. వచనం తరువాతి జాబితాలో భాగమైనందున మూలంలోని అసంపూర్ణ జాబితా లయను నిలుపుతూ చివర కామా ఉంచబడింది. పాదసూచిక గుర్తు దానికి సంబంధించిన הַכַּפֹּרֶת అనువాదం వెంటనే ఉంచబడింది.
