  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: te
  text: బల్లను, దాని మోసే కర్రలను, దాని ఉపకరణాలన్నిటిని, సన్నిధి రొట్టెలను,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: మూలపదం ఆరాధనలో ఉపయోగించే బల్లను మాత్రమే సూచిస్తుంది; దాని ప్రత్యేక ఉపయోగం తరువాత వచ్చే ‘సన్నిధి రొట్టెలు’ అనే మాట ద్వారా స్పష్టమవుతుంది.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలను
  rationale: గుడారపు సామగ్రి సందర్భంలో בַּדִּים పవిత్ర వస్తువులను మోయడానికి ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ ఆధునిక తెలుగులో వాటి ఉపయోగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతటినీ
  rationale: כְּלִי అనేది పాత్రలు, పరికరాలు, ఇతర ఉపకరణాలన్నిటినీ కలుపుకోగల విస్తృత పదం. బల్లకు సంబంధించిన మొత్తం వస్తుసముదాయాన్ని ‘సామగ్రి’ సహజంగా సూచిస్తుంది.
- source_word: לֶחֶם הַפָּנִים
  choice: సన్నిధి రొట్టెలను
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘ముఖము/సన్నిధి యొక్క రొట్టె.’ ‘సన్నిధి రొట్టెలు’ హీబ్రూ ఆరాధనా భావాన్ని సంక్షిప్తంగా కాపాడుతూ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: לֶחֶם הַפָּנִים లో ఎవరి సన్నిధి అన్నది
  choice: ‘సన్నిధి’ అని మాత్రమే ఉంచడం
  alternative: ‘యెహోవా సన్నిధిలో ఉంచే రొట్టెలు’
  rationale: హీబ్రూ వాక్యంలో దేవుని పేరు గానీ, ‘ఉంచే’ అనే క్రియ గానీ ప్రత్యక్షంగా లేవు. సందర్భం దైవసన్నిధిని సూచించినప్పటికీ, మూలంలోని సంక్షిప్తతను మరియు అంతర్నిహిత భావాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా నిర్మాణాన్ని, ప్రతి అంశంపై ఉన్న కర్మవిభక్తిని కాపాడుతూ సహజమైన పదక్రమం వాడబడింది. వచనం కొనసాగుతున్న జాబితాలో భాగమైనందున చివర కామా ఉంచబడింది.
