source:
  edition: WLC
  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: te
  text: పరిశుద్ధస్థలంలో సేవ చేయడానికి సూక్ష్మంగా నేసిన వస్త్రాలు[a], యాజకుడైన అహరోనుకు పరిశుద్ధ వస్త్రాలు, యాజకులుగా సేవ చేయడానికి అతని కుమారుల వస్త్రాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవా వస్త్రాలు’; ఇక్కడి హెబ్రీ పదం ప్రత్యేకంగా నేసిన సేవా వస్త్రాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: మెత్తగా నేసిన వస్త్రాలు
  rationale: הַשְּׂרָד అనే అరుదైన పదం ప్రత్యేకంగా తయారుచేసిన నేసిన వస్త్రాలను సూచించవచ్చు. తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘మెత్తగా నేసిన’ అని ఇచ్చి, ‘సేవా వస్త్రాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: పరిశుద్ధస్థల సంబంధమైన పరిచర్యను సూచిస్తున్నప్పటికీ, ఆధునిక తెలుగులో స్పష్టమైన ‘సేవ చేయడానికి’ అనే రూపం క్రియార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధస్థలంలో
  rationale: ఈ ప్రత్యక్ష గుడార సందర్భంలో קֹדֶשׁ అమూర్తమైన పరిశుద్ధతకన్నా పవిత్ర ప్రదేశాన్ని సూచిస్తుంది. ‘పరిశుద్ధస్థలం’ ఈ స్థలార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధ వస్త్రాలు
  rationale: ‘పరిశుద్ధతకు చెందిన వస్త్రాలు’ అనే నిర్మాణానికి సహజమైన, నేరమైన తెలుగు రూపం; యాజక వస్త్రాల పవిత్ర వినియోగాన్ని తెలుపుతుంది.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోనుకు
  rationale: అహరోనును అతని పదవితో గుర్తించే హెబ్రీ అన్వయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בִּגְדֵי בָנָיו
  choice: అతని కుమారుల వస్త్రాలు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: לְכַהֵן
  choice: యాజకులుగా సేవ చేయడానికి
  rationale: כהן పీయేల్ క్రియ యాజకునిగా విధులు నిర్వర్తించడాన్ని సూచిస్తుంది; ఈ అనువాదం పదవి మరియు క్రియాత్మక సేవ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד మరియు בִּגְדֵי הַקֹּדֶשׁ మధ్య సంబంధం
  choice: మొదటి పదబంధాన్ని పరిశుద్ధస్థల సేవకోసం ప్రత్యేకంగా నేసిన వస్త్రాలుగా, తరువాతివాటిని అహరోను మరియు అతని కుమారులకు సంబంధించిన పరిశుద్ధ వస్త్రాలుగా జాబితాలో వేరు చేసి చూపడం.
  alternative: రెండు పదబంధాలనూ ఒకే యాజక వస్త్రాలకు సమానార్థక లేదా వివరణాత్మక సూచనలుగా గ్రహించడం.
  rationale: పునరావృతమయ్యే אֶת కర్మసూచకం వేర్వేరు జాబితా అంశాలుగా చదవడానికి ఆధారం ఇస్తుంది. అయినప్పటికీ వాటి వినియోగంలో ఉండగల అతివ్యాప్తిని అనువాదం నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పరిచర్య చేయడానికి’ కంటే ‘సేవ చేయడానికి’ సహజంగా ఉంటుంది; ‘యాజకులుగా’ అనే రూపం చివరి క్రియలోని యాజక విధి భావాన్ని స్పష్టంగా ఉంచుతుంది.
