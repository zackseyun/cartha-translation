  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇశ్రాయేలు కుమారుల సమాజమంతటితో[a] ఇలా అన్నాడు: “యాహ్వే ఆజ్ఞాపించిన మాట ఇదే:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు కుమారుల సమూహమంతటితో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మాట ఇదే”; “విషయం ఇదే” లేదా సహజంగా “యాహ్వే ఆజ్ఞాపించింది ఇదే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమబద్ధతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲדַת
  choice: సమాజము
  rationale: ఇది ఇశ్రాయేలు ప్రజల సమష్టి సముదాయాన్ని సూచిస్తుంది; ‘సమాజము’ సమకూడిన సమూహం అనే భావాన్ని కాపాడుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని కాపాడుతూ, సంప్రదాయబద్ధంగా మరియు స్పష్టంగా అనువదిస్తుంది.
- source_word: זֶה הַדָּבָר
  choice: మాట ఇదే
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం’ అనే అర్థాలు ఉన్నాయి; ఇక్కడ దైవాజ్ఞను పరిచయం చేసే సూత్రంలో ‘మాట ఇదే’ మూలరూపాన్ని, ప్రకటన ధోరణిని కాపాడుతుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: పూర్తయిన దైవాజ్ఞను, దాని ప్రస్తుత ప్రాముఖ్యతతో సహా, తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు / ఉటంకరణ ద్వారా సూచితం
  rationale: మొదటి לֵאמֹר ‘ఇలా అన్నాడు’లో సహజంగా వ్యక్తమవుతుంది; చివరి לֵאמֹר తరువాత వచ్చే ఆజ్ఞావిషయాన్ని పరిచయం చేస్తుంది కాబట్టి తెలుగు ఉటంకరణ, ద్విబిందువు ద్వారా దాని కార్యం స్పష్టమవుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా నామాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: లింగసూచకమైన בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని సమతలీకరించకుండా నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు సమాజపు సమష్టి గుర్తింపును కూడా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ప్రకటన సూత్రాన్ని కాపాడుతూ, చివరి לֵאמֹר యొక్క పనిని అసహజమైన ‘చెప్పుచూ’ రూపంతో కాకుండా ద్విబిందువు మరియు ఉటంకరణ ద్వారా వ్యక్తపరిచాం.
