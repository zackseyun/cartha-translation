translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. హీబ్రూ హృదయ-ప్రేరణ నుడికారాన్ని సహజ తెలుగులో నిలిపి, చేతిపని సందర్భంలోని חָכְמָהను ‘నైపుణ్యం’గా వ్యక్తం చేసింది.
