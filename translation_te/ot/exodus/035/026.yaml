  yaml_path: translation/ot/exodus/035/026.yaml
  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: te
  text: తమ హృదయాలు వారిని నైపుణ్యంతో మేక వెంట్రుకలను వడకడానికి ప్రేరేపించిన స్త్రీలందరూ మేక వెంట్రుకలను[a] వడికారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మేకలను’; ఇక్కడ హీబ్రూ వడకడానికి ఉపయోగించిన మేక వెంట్రుకలను సంక్షిప్తంగా సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: స్త్రీలందరూ
  rationale: బహువచన నామవాచకంతో వచ్చిన כָּל సమష్టిగా ‘స్త్రీలందరూ’ అనే సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: పనిచేయడానికి హృదయం ప్రేరేపించిన
  rationale: ‘హృదయం వారిని ఎత్తింది’ అనే హీబ్రూ నుడికారం అంతరంగ ప్రేరణను, స్వచ్ఛంద సంసిద్ధతను సూచిస్తుంది. తెలుగులో సహజత కోసం ‘హృదయం ప్రేరేపించిన’ అని అనువదించి, వాక్యంలోని నైపుణ్యానికి దాని సంబంధం స్పష్టంగా ఉండేందుకు ‘పనిచేయడానికి’ చేర్చబడింది.
- source_word: בְּחָכְמָה
  choice: నైపుణ్యంతో
  rationale: ఈ చేతిపని సందర్భంలో חָכְמָה సిద్ధాంతపరమైన జ్ఞానం కంటే ఆచరణాత్మక పనినైపుణ్యాన్ని సూచిస్తుంది.
- source_word: טָווּ
  choice: వడికారు
  rationale: నారను లేదా వెంట్రుకలను దారంగా తిప్పే పనిని ఆధునిక ప్రామాణిక తెలుగులో ‘వడకడం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת הָעִזִּים
  choice: మేక వెంట్రుకలను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మేకలను’ ఉన్నప్పటికీ, వస్త్రనిర్మాణ సందర్భంలో ఇది వడికే మేక వెంట్రుకలను సూచించే అధ్యాహారం. అపార్థం రాకుండా సూచిత పదార్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
