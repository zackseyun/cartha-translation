  text: וְ/כָל הַ֨/נָּשִׁ֔ים אֲשֶׁ֨ר נָשָׂ֥א לִבָּ֛/ן אֹתָ֖/נָה בְּ/חָכְמָ֑ה טָו֖וּ אֶת הָ/עִזִּֽים־־׃
base_translation:
