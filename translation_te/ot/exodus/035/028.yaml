  to: సుగంధ ద్రవ్యాన్ని[a], వెలుగుకోసం నూనెను, అభిషేక తైలం కోసం, సుగంధ ద్రవ్యాల ధూపం[b] కోసం కూడా తెచ్చారు.
  rationale: The revision removes the unsupported ‘కావలసిన వాటిని,’ retains the verse’s list-like dependence on the preceding verse with ‘కూడా తెచ్చారు,’ and renders the final construct phrase with both its components visible. ‘వెలుగుకోసం’ follows the Hebrew’s functional expression without over-specifying a particular lamp.
