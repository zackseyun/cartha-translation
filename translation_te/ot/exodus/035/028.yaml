  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: te
  text: సుగంధ ద్రవ్యాన్ని[a], వెలుగుకోసం నూనెను, అభిషేక తైలం కోసం, సుగంధ ద్రవ్యాల ధూపం[b] కోసం కూడా తెచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిమళ పదార్థాన్ని’ లేదా ‘బాల్సమ్‌ను’.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సువాసనగల ధూపం’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: సుగంధ ద్రవ్యాలను
  rationale: בֹּשֶׂם అనేది పరిమళమున్న పదార్థం, సుగంధ ద్రవ్యం లేదా బాల్సమ్‌ను సూచించగలదు. గుడారపు సామగ్రి జాబితాలో సహజంగా, విస్తృతార్థాన్ని నిలుపుకునే ఆధునిక తెలుగు పదబంధంగా ‘సుగంధ ద్రవ్యాలు’ ఎంచుకోబడింది.
- source_word: הַשָּׁמֶן
  choice: నూనెను
  rationale: שֶׁמֶן సాధారణంగా నూనెను సూచిస్తుంది. మూలపాఠం ఈ చోట ఒలీవ నూనె అని ప్రత్యేకంగా చెప్పనందున కేవలం ‘నూనె’ అని అనువదించబడింది.
- source_word: לְמָאוֹר
  choice: దీపం కోసం
  rationale: מָאוֹר వెలుగు లేదా వెలుగునిచ్చే సాధనాన్ని సూచించగలదు. పవిత్ర గుడారపు సందర్భంలో నూనె యొక్క వెలిగించే ప్రయోజనాన్ని సహజంగా తెలియజేయడానికి ‘దీపం కోసం’ ఉపయోగించబడింది.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఇది పవిత్ర అభిషేకానికి ఉపయోగించే నూనెను సూచించే స్థిర పదబంధం. ఆరాధనా సందర్భానికి తగిన, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం ఇది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపం
  rationale: קְטֹרֶת ధూపాన్ని, סַמִּים సుగంధ పదార్థాలను సూచిస్తాయి. ‘సుగంధ ధూపం’ రెండు భావాలను సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: '...ను, ...ను, ... కోసం, ... కోసం'
  rationale: పునరుక్త సంధులు మునుపటి వచనంలోని సమర్పణల జాబితాను కొనసాగిస్తున్నాయి. తెలుగులో జాబితా సహజంగా ఉండేలా విభక్తులు, ‘కోసం’ అనే పదం పునరావృతమయ్యాయి; చివర ‘కూడా’తో కొనసాగింపు సూచించబడింది.
theological_decisions:
- issue: ఈ వచనంలో క్రియ లేకపోవడం
  choice: మునుపటి వచనంలోని ‘తెచ్చారు’ అనే క్రియను స్పష్టంగా పునరుద్ధరించడం
  alternative: వాక్యఖండంగా వస్తువుల జాబితాను మాత్రమే ఉంచడం
  rationale: హీబ్రూ వాక్యం 27వ వచనంలోని క్రియపై ఆధారపడే కొనసాగింపు. విడిగా చదివినా అర్థమయ్యే ఆధునిక తెలుగు వాక్యంగా చేయడానికి ‘తెచ్చారు’ చేర్చబడింది; ‘కూడా’ దాని కొనసాగింపు స్వభావాన్ని కాపాడుతుంది.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా పదజాలం ఉపయోగించబడింది. ‘నూనె’ మరియు ‘తైలం’ రెండూ ఉద్దేశపూర్వకంగా వాడబడ్డాయి: మొదటిది సాధారణ పదార్థానికి, రెండవది స్థిరమైన పవిత్ర అభిషేక పదబంధానికి.'
