translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. నిర్గమకాండంలోని ఆరాధనా వస్తువులకు పరిచితమైన ‘ఏఫోదు’ పదాన్ని నిలిపి, חֹשֶׁןకు కవచ భావన రానీయని ‘వక్షపతకం’ ఎంచుకున్నాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
