  yaml_path: translation/ot/exodus/035/027.yaml
  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: te
  text: నాయకులు గోమేధిక రాళ్లను[a], పొదిగే రాళ్లను ఏఫోదు కోసం, రొమ్ము పతకం కోసం తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘షోహమ్’ ఏ రత్నాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు; ‘గోమేధిక’ సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: నాయకులు
  rationale: נְשִׂיאִים ఇక్కడ సమాజపు ముఖ్యులను సూచిస్తుంది; రాజవంశ భావన కలిగించకుండా ఆధునిక తెలుగులో ‘నాయకులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: בוא యొక్క హిఫీల్ రూపం ఇక్కడ వస్తువులను తీసుకురావడం లేదా సమర్పించడం అనే అర్థంలో ఉంది; సందర్భానికి ‘తీసుకొచ్చారు’ సహజమైన అనువాదం.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: గోమేధిక రాళ్లు
  rationale: שֹׁהַם ఖచ్చితంగా ఏ రత్నమో అనిశ్చితం. సంప్రదాయ తెలుగు బైబిలు పదజాలంలో పరిచితమైన ‘గోమేధిక’ను ప్రధాన పాఠ్యంలో ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: పొదిగే రాళ్లు
  rationale: మూలపదం ఆభరణంలో అమర్చే లేదా పొదిగే రాళ్లను సూచిస్తుంది; పదశః ‘నింపే రాళ్లు’ కంటే ‘పొదిగే రాళ్లు’ వాటి విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָאֵפֹד
  choice: ఏఫోదు కోసం
  rationale: אֵפֹד ప్రధాన యాజకుని ప్రత్యేక వస్త్రానికి స్థిరపడిన లిప్యంతరీకరణ; ఖచ్చితమైన తెలుగు సమానపదం లేనందున ‘ఏఫోదు’ను నిలుపుకున్నాం.
- source_word: וְלַחֹשֶׁן
  choice: వక్షపతకం కోసం
  rationale: חֹשֶׁן ఏఫోదుకు అమర్చిన యాజకుని ఛాతీ అలంకారాన్ని సూచిస్తుంది. ‘వక్షపతకం’ కవచం అనే అపార్థాన్ని నివారిస్తూ వస్తువు స్వరూపాన్ని తెలియజేస్తుంది.
