    reason: lexical_alternative
  revision_rationale: The revision replaces the less natural “వక్షపతకం” with “రొమ్ము పతకం,” a clearer rendering of the priestly breastpiece, and restores the source-order association of the two groups of stones with the ephod and breastpiece. Meaning and the lexical-uncertainty footnote are preserved.
