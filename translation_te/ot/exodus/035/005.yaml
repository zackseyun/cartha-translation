id: EXO.35.5
reference: Exodus 35:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: te
  text: '“మీ దగ్గరనుండి యాహ్వేకు[a] ఒక అర్పణను తీసుకోండి. హృదయపూర్వకంగా ఇష్టపడే ప్రతి ఒక్కరూ యాహ్వేకు అర్పణగా దానిని తీసుకురావాలి: బంగారం, వెండి, కంచు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే’ అనేది హీబ్రూ దైవనామమైన יהוה (YHWH) యొక్క ధ్వన్యంతరీకరణ.
    reason: divine_name
  - marker: b
    text: లేదా ‘రాగి.’ ఇక్కడి హీబ్రూ పదం రాగిని లేదా రాగి మిశ్రమమైన కంచును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: మీ మధ్యనుంచి ... తీసుకోండి
  rationale: బహువచన ఆజ్ఞను, అలాగే సమాజం లోపలినుంచి స్వీకరించాలనే మూలభావాన్ని నిలుపుతుంది.
- source_word: תְּרוּמָה
  choice: అర్పణ
  rationale: పరిశుద్ధ కార్యం కోసం ప్రత్యేకంగా సమర్పించే వస్తు సహాయాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం; సాంకేతికమైన ‘ఎత్తి అర్పించే బలి’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: לַיהוָה / יְהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరిస్తుంది; ל ఉపసర్గ అర్పణ ఆయన కోసం లేదా ఆయనకు అంకితమైనదని తెలియజేస్తుంది.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: మనస్ఫూర్తిగా ఇవ్వడానికి సిద్ధంగా ఉన్న ప్రతి ఒక్కరూ
  rationale: స్వచ్ఛందమైన అంతరంగ వైఖరిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని లింగ పరిమితిని చేర్చదు.
- source_word: יְבִיאֶהָ אֵת תְּרוּמַת יְהוָה
  choice: దాన్ని—యాహ్వేకు అర్పణను—తీసుకురావాలి
  rationale: స్త్రీలింగ సర్వనామం తిరిగి ‘అర్పణ’ను సూచిస్తుందని చూపిస్తూ, తరువాతి పదబంధం అదే అర్పణను వివరిస్తున్న నిర్మాణాన్ని నిలుపుతుంది. ‘తీసుకురావాలి’ ఆశించిన చర్యను తెలుపుతుంది గాని స్వచ్ఛందతను రద్దు చేసే బలవంతాన్ని సూచించదు.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: బంగారం, వెండి, కంచు
  rationale: గుడార నిర్మాణ సామగ్రి జాబితాలో נְחֹשֶׁתకు ‘కంచు’ సంప్రదాయబద్ధమైన, సందర్భోచితమైన అనువాదం; ‘రాగి’ కూడా భాషాపరంగా సాధ్యమే కాబట్టి పాదటిప్పణిలో సూచించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని ప్రత్యేక నిబంధన నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ఆధునిక పండిత లోకంలో సాధారణమైన ఉచ్చారణకు దగ్గరగా ఉంచుతుంది.
- issue: అర్పణ స్వచ్ఛందమా లేక తప్పనిసరా
  choice: ఆజ్ఞ సమాజ నాయకత్వానికి; తీసుకురావడం సిద్ధహృదయుల చర్యగా వ్యక్తీకరించబడింది
  alternative: సమాజంలోని ప్రతి వ్యక్తి తప్పనిసరిగా తీసుకురావాలి
  rationale: כֹּל נְדִיב לִבּוֹ అర్పణదాతను స్వచ్ఛంద అంతరంగ సిద్ధతతో నిర్వచిస్తుంది. అందువల్ల ‘ప్రతి ఒక్కరూ’ అనేది ప్రతి సభ్యునికీ బలవంతపు ఆజ్ఞగా కాక, సిద్ధంగా ఉన్న వారందరినీ సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభమైన శైలి వాడబడింది. ‘మనస్ఫూర్తిగా ఇవ్వడానికి సిద్ధంగా’ అనే ప్రయోగం హీబ్రూ హృదయ-నుడికారంలోని స్వచ్ఛందతను సహజంగా అందిస్తుంది. డాష్‌లతో ఉన్న వివరణ మూలంలోని పునర్వ్యాఖ్యాన నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
