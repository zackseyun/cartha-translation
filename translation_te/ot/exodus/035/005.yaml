revisions:
- from: '“మీ మధ్యనుంచి యాహ్వేకు[a] ఒక అర్పణను తీసుకోండి. మనస్ఫూర్తిగా ఇవ్వడానికి సిద్ధంగా ఉన్న ప్రతి ఒక్కరూ దాన్ని—యాహ్వేకు అర్పణను—తీసుకురావాలి: బంగారం, వెండి, కంచు.[b]”'
  to: '“మీ దగ్గరనుండి యాహ్వేకు[a] ఒక అర్పణను తీసుకోండి. హృదయపూర్వకంగా ఇష్టపడే ప్రతి ఒక్కరూ యాహ్వేకు అర్పణగా దానిని తీసుకురావాలి: బంగారం, వెండి, కంచు.[b]”'
  rationale: The revision makes the voluntary, willing-hearted sense more precise in idiomatic modern Telugu and smooths the appositional phrase identifying the contribution as Yahweh’s offering. It retains the source sequence, the generic scope of “everyone,” the divine name, and the lexical ambiguity of the final metal.
  reviewer_model: gpt-5.6-terra
