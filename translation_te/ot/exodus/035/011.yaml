  text: אֶת הַ֨/מִּשְׁכָּ֔ן אֶֽת אָהֳל֖/וֹ וְ/אֶת מִכְסֵ֑/הוּ אֶת קְרָסָי/ו֙ וְ/אֶת קְרָשָׁ֔י/ו אֶת בְּרִיחָ֕/ו אֶת עַמֻּדָ֖י/ו וְ/אֶת אֲדָנָֽי/ו־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/011.yaml
  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
translation:
  language: te
  text: నివాస మందిరాన్ని, దాని గుడారాన్ని, దాని కప్పుదలను; దాని బిగింపులను, దాని పలకలను[a], దాని అడ్డకర్రలను, దాని స్తంభాలను, దాని ఆధారాలను[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రాలను’; కְרָשָׁיו అనే పదం ఘనమైన పలకలకన్నా చట్ర నిర్మాణాన్ని సూచిస్తుందని అర్థం చేసుకుంటే.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గుంటలుగల అడుగుదిమ్మెలను’; אֲדָנָיו అనే పదం నిర్మాణ భాగాలను అమర్చే గుంటలుగల ఆధారాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: నివాస మందిరం
  rationale: మִשְׁכָּן అనే పదం ఇశ్రాయేలు మధ్య యెహోవా నివసించే పవిత్ర నిర్మాణాన్ని సూచిస్తుంది. ‘నివాస మందిరం’ మూలపదంలోని నివాస భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: אָהֳלוֹ
  choice: దాని గుడారం
  rationale: אָהֶל అంటే గుడారం. ఏకవచన పుంలింగ ప్రత్యయం సందర్భంలో నివాస మందిర సముదాయానికే తిరిగి సూచిస్తుంది; తెలుగులో నిర్జీవ వస్తువుకు ‘దాని’ సహజం. నివాస మందిరం మరియు దాని గుడార భాగం మధ్యనున్న హెబ్రీ భేదాన్ని ఇది కాపాడుతుంది.
- source_word: מִכְסֵהוּ
  choice: దాని కప్పు
  rationale: מִכְסֶה రక్షణనిచ్చే కప్పును సూచిస్తుంది. మూలంలో పదార్థం పేర్కొనబడనందున ‘కప్పు’ దానిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: קְרָסָיו
  choice: దాని కొక్కెములు
  rationale: కֶרֶס తెరలను లేదా కప్పులను కలిపే చిన్న బిగింపు భాగాలను సూచిస్తుంది. ‘కొక్కెములు’ వాటి రూపం, కలిపే పనిని సాధారణ తెలుగులో తెలియజేస్తుంది; అత్యాధునిక సాంకేతిక పదాన్ని రుద్దదు.
- source_word: קְרָשָׁיו
  choice: దాని పలకలు
  rationale: కֶרֶשׁ నివాస మందిర నిర్మాణంలోని పలకలు లేదా దిమ్మెలను సూచిస్తుంది. ‘పలకలు’ నేరమైన అర్థం; అయితే అవి ఘన పలకలా లేక చట్రాలా అన్న నిర్మాణ సంబంధ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בְּרִיחָיו
  choice: దాని అడ్డకర్రలు
  rationale: בְּרִיחַ పలకలను కలిపి నిలబెట్టే సమాంతర కర్రలను సూచిస్తుంది. కేవలం ‘కర్రలు’ కంటే ‘అడ్డకర్రలు’ ఇక్కడి నిర్మాణ పనిని సహజంగా స్పష్టం చేస్తుంది.
- source_word: עַמֻּדָיו
  choice: దాని స్తంభాలు
  rationale: עַמּוּד నిలువుగా ఆధారమిచ్చే నిర్మాణ భాగం. ‘స్తంభాలు’ పవిత్ర నిర్మాణ సందర్భానికి తగిన, సాధారణంగా అర్థమయ్యే పదం.
- source_word: אֲדָנָיו
  choice: దాని పీఠాలు
  rationale: אֶדֶן స్తంభాలు లేదా పలకలు అమర్చబడే అడుగు భాగాన్ని సూచిస్తుంది. ‘పీఠాలు’ సహజమైన నిర్మాణ పదం; అవి భాగాలను చొప్పించే గుంటలుగల ఆధారాలనే భావాన్ని ‘దిమ్మెలు’ అని కూడా చెప్పవచ్చని పాదసూచికలో సూచించాం.
