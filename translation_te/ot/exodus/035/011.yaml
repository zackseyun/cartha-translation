translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ జాబితి లయను మరియు ప్రతి భాగానికి ఉన్న సంబంధాన్ని చూపే ‘దాని’ పునరుక్తిని నిలిపాం. వాక్యం తరువాతి సందర్భంతో కొనసాగే జాబితి భాగమైనందున చివర అర్ధవిరామం ఉంచాం. ‘నివాస మందిరం’ మూలంలోని నివాస భావాన్ని స్పష్టంగా ఉంచుతుంది; పదజాలం గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపిక చేయబడింది.
