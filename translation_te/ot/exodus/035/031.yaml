source:
  edition: WLC
  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: te
  text: ఆయన అతణ్ణి దేవుని ఆత్మతో[a], జ్ఞానంతో, అవగాహనతో, పరిజ్ఞానంతో, ప్రతి విధమైన పనితనంలో[b] నింపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దైవిక ఆత్మతో.’ హెబ్రీ పదబంధాన్ని మరింత సాధారణంగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ దేవుడు అనుగ్రహించే తన ఆత్మనే సూచించడం ఎక్కువ సంభావ్యం.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘అన్ని పనుల్లో,’ లేదా ‘ప్రతి విధమైన చేతిపనిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: నింపాడు
  rationale: పియేల్ వర్తమాన అసంపూర్ణ క్రియకు వావ్ అనుక్రమ రూపం గతకాల కథన క్రియగా ఉంది. కర్త మునుపటి వచనం నుంచి కొనసాగుతున్న దేవుడు; తెలుగులో సహజమైన వాక్యక్రమం కోసం కర్తను ‘ఆయన’గా స్పష్టంచేశాం.
- source_word: אֹתוֹ
  choice: అతణ్ణి
  rationale: ముందటి సందర్భంలోని బెసలేలను సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: గుడార నిర్మాణ సేవకు దేవుడు శక్తినిచ్చే ఈ సందర్భంలో, ఈ పదబంధం దేవుని స్వీయ ఆత్మను సూచించడం అత్యంత సహజం. హెబ్రీ పదబంధంలోని సాధ్యమైన విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּחָכְמָה
  choice: జ్ఞానంతో
  rationale: חָכְמָה ఇక్కడ దేవుడు అనుగ్రహించిన వివేకపూర్వక సామర్థ్యాన్ని సూచిస్తుంది; జాబితాలోని ב ఉపసర్గను ‘తో’గా వ్యక్తం చేశాం.
- source_word: בִּתְבוּנָה
  choice: వివేచనతో
  rationale: תְּבוּנָה అంటే అవగాహన, అంతర్దృష్టి లేదా వివేచన. ‘జ్ఞానం’ మరియు ‘పరిజ్ఞానం’ నుంచి భావభేదాన్ని స్పష్టంగా ఉంచడానికి ‘వివేచన’ ఎంచుకున్నాం.
- source_word: וּבְדַעַת
  choice: పరిజ్ఞానంతో
  rationale: דַּעַת యొక్క ప్రాథమిక భావం జ్ఞానం లేదా తెలిసికొనడం. చేతివృత్తి సందర్భం ఉన్నప్పటికీ దీనిని కేవలం సాంకేతిక నైపుణ్యంగా కుదించకుండా ‘పరిజ్ఞానం’గా ఉంచాం.
- source_word: וּבְכָל מְלָאכָה
  choice: అన్ని రకాల నైపుణ్యంతో
  rationale: מְלָאכָה పని, పనితనం లేదా చేతివృత్తిని సూచించగలదు. గుడార నిర్మాణ సందర్భంలో ప్రత్యేక పనిసామర్థ్యమే ఉద్దేశం; כָּל తో కూడిన ఏకవచన భావాన్ని సహజ తెలుగులో ‘అన్ని రకాల’గా తెలిపాం.
theological_decisions:
- issue: רוּחַ אֱלֹהִים అనే పదబంధం దేవుని స్వీయ ఆత్మను సూచిస్తుందా, లేక సాధారణంగా దైవిక ప్రేరణ లేదా దైవిక ఆత్మను సూచిస్తుందా?
  choice: దేవుని ఆత్మ
  alternative: దైవిక ఆత్మ; దేవుని నుంచి వచ్చిన ప్రేరణ
  rationale: పవిత్ర గుడార సేవ కోసం దేవుడు బెసలేలకు సామర్థ్యమిచ్చే తక్షణ సందర్భం దేవుని స్వీయ ఆత్మ అనే పఠనానికి బలం ఇస్తుంది. అయితే హెబ్రీలో పదబంధం వ్యాకరణపరంగా మరింత సాధారణంగా కూడా అర్థమయ్యే అవకాశాన్ని పాదటిప్పణి ద్వారా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘జ్ఞానం—వివేచన—పరిజ్ఞానం’ అనే త్రయంతో హెబ్రీ పదాల భావభేదాన్ని సాధ్యమైనంతవరకు నిలిపాం. దేవునికి సూచనగా ‘ఆయన’ వాడినా, మూలంలో లేని ప్రత్యేక మతపరమైన సర్వనామ సంప్రదాయాన్ని రుద్దలేదు.
