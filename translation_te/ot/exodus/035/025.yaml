source:
  edition: WLC
  text: וְ/כָל אִשָּׁ֥ה חַכְמַת לֵ֖ב בְּ/יָדֶ֣י/הָ טָו֑וּ וַ/יָּבִ֣יאוּ מַטְוֶ֗ה אֶֽת הַ/תְּכֵ֨לֶת֙ וְ/אֶת הָֽ/אַרְגָּמָ֔ן אֶת תּוֹלַ֥עַת הַ/שָּׁנִ֖י וְ/אֶת הַ/שֵּֽׁשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: te
  text: హృదయంలో జ్ఞానముగల ప్రతి స్త్రీ తన చేతులతో నూలు వడికింది[a]. వారు తాము వడికిన నీలిరంగు నూలును, ఊదారంగు నూలును, స్కార్లెట్ రంగు నూలును, సన్నని నారబట్టను తీసుకొచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘హృదయంలో జ్ఞానముగలది’; ఇది అంతరంగ జ్ఞానంతో కూడిన ఆచరణాత్మక నైపుణ్యాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారు తాము వడికిన వాటిని—నీలిరంగు నూలు, ఊదారంగు నూలు, స్కార్లెట్ రంగు నూలు, సన్నని నారబట్టను—తీసుకొచ్చారు.’ హీబ్రూ వాక్యం ‘వడికినది’ తర్వాత పదార్థాలను జాబితా చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: హృదయంలో జ్ఞానంగల
  rationale: హీబ్రూ నుడికారంలోని హృదయ భాషను నిలుపుతూ, అంతరంగ జ్ఞానంలో ఆధారపడిన ఆచరణాత్మక నైపుణ్యాన్ని సూచిస్తుంది.
- source_word: בְּיָדֶיהָ
  choice: తన చేతులతో
  rationale: కరణార్థక בְను సహజమైన తెలుగులో వ్యక్తం చేసి, చేతిపనిని స్పష్టం చేస్తుంది.
- source_word: טָוּוּ
  choice: నూలు వడికింది
  rationale: పీచును నూలుగా చేసే పనిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּבִיאוּ
  choice: వారు ... తీసుకొచ్చారు
  rationale: ‘ప్రతి స్త్రీ’ అనే విభాజక ఏకవచనం నుంచి స్త్రీలందరినీ సూచించే బహువచనానికి హీబ్రూలోని మార్పును నిలుపుతుంది.
- source_word: מַטְוֶה
  choice: తాము వడికిన
  rationale: వడికిన పదార్థం లేదా నూలు అనే భావాన్ని తరువాతి పదార్థాల జాబితితో సహజంగా కలుపుతుంది.
- source_word: תְּכֵלֶת
  choice: నీలి
  rationale: పవిత్ర గుడారపు వస్త్రాల సందర్భంలో విలువైన నీలిరంగు వేసిన నూలు లేదా పదార్థాన్ని సూచిస్తుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: పవిత్ర గుడారపు వస్త్రాల్లో వాడిన ఊదారంగు పదార్థానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: ఎర్రని నూలు
  rationale: చారిత్రకంగా పురుగు మూలమైన రంగుతో అద్దిన స్కార్లెట్ పదార్థాన్ని సూచించే హీబ్రూ వ్యక్తీకరణను వస్త్ర సందర్భానికి తగినట్లు స్పష్టం చేస్తుంది.
- source_word: שֵׁשׁ
  choice: సన్నని నారబట్ట
  rationale: పవిత్ర గుడారపు సందర్భంలో సాధారణ నారకంటే మెత్తని, నాణ్యమైన నారవస్త్రాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హృదయంలో జ్ఞానంగల’ అని మూల నుడికారాన్ని నిలిపి, పాదటిప్పణిలో దాని ఆచరణాత్మక నైపుణ్య భావాన్ని వివరించాం. ఏకవచనం నుంచి బహువచనానికి మూలంలోని మార్పును అలాగే ఉంచాం.
