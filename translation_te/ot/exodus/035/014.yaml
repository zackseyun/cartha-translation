  edition: WLC
  text: וְ/אֶת מְנֹרַ֧ת הַ/מָּא֛וֹר וְ/אֶת כֵּלֶ֖י/הָ וְ/אֶת נֵרֹתֶ֑י/הָ וְ/אֵ֖ת שֶׁ֥מֶן הַ/מָּאֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/014.yaml
  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: te
  text: మరియు వెలుగు కోసం దీపస్తంభాన్ని[a], మరియు దాని ఉపకరణాలను, మరియు దాని దీపాలను, మరియు వెలుగు కోసం నూనెను;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘వెలుగు యొక్క దీపస్తంభాన్ని,’ అలాగే ‘వెలుగు యొక్క నూనెను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: వెలుగు కోసం దీపస్తంభం
  rationale: מְנוֹרָה గుడారంలోని దీపాలను నిలిపే ప్రత్యేక దీపస్తంభాన్ని సూచిస్తుంది. הַמָּאוֹר తో ఉన్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘వెలుగు కోసం’ అని వ్యక్తం చేయడం ద్వారా మూలంలోని భావం, అలాగే తరువాత వచ్చే సమాంతర పదబంధం నిలుస్తాయి.
- source_word: כֵּלֶיהָ
  choice: దాని ఉపకరణాలు
  rationale: כְּלִי పాత్రలు, పనిముట్లు, సామగ్రి వంటి విస్తృత అర్థం గల పదం. ఇక్కడ ‘ఉపకరణాలు’ అతిగా నిర్దిష్టీకరించకుండా దీపస్తంభానికి సంబంధించిన వస్తువులన్నిటినీ సూచిస్తుంది.
- source_word: נֵרֹתֶיהָ
  choice: దాని దీపాలు
  rationale: נֵר ఇక్కడ దీపస్తంభంతో అనుసంధానమైన ఒక్కొక్క దీపాన్ని సూచిస్తుంది. ‘దీపాలు’ స్పష్టమైన, సాధారణ తెలుగు రూపం.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: వెలుగు కోసం నూనె
  rationale: ‘వెలుగు కోసం’ అనే రూపం שֶׁמֶן הַמָּאוֹר లోని సంబంధాన్ని సహజంగా తెలియజేస్తూ, מְנֹרַת הַמָּאוֹר తో ఉన్న పదపునరుక్తిని కూడా నిలుపుతుంది.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: మరియు ... మరియు ... మరియు ... మరియు
  rationale: సంయోజకంతో కూడిన ప్రత్యక్ష కర్మ సూచిక పునరావృతం జాబితా లయను నిర్మిస్తుంది. తెలుగులో ప్రతి అంశం ముందు ‘మరియు’ ఉంచడం ద్వారా ఆ మూల నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
