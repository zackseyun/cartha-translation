  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలితో అనువదించబడింది. ‘దీపస్తంభం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా ఎంచుకోబడింది; మూలంలోని వరుస ‘మరియు’ పదాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
