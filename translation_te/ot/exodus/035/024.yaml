id: EXO.35.24
reference: Exodus 35:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: te
  text: వెండి గానీ కంచు గానీ కానుకను అర్పించిన ప్రతి ఒక్కరూ యహ్వేకు కానుకను[a] తీసుకొచ్చారు. సేవా పనులన్నిటికోసం తుమ్మచెక్క ఎవరి దగ్గర ఉందో, వారందరూ దానిని తీసుకొచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే కానుకను.” హీబ్రూలో ఈ పదబంధం యహ్వేకు చెందిన కానుక అని కూడా అర్థమవవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తుమ్మచెక్క ఎవరి దగ్గర కనబడిందో.” ఇది వారి దగ్గర ఆ చెక్క అందుబాటులో ఉందని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: సమర్పించిన ప్రతి ఒక్కరూ
  rationale: רוּם క్రియకు చెందిన ఈ కృదంత రూపం תְּרוּמָהతో కలిసి ప్రతిష్ఠిత అర్పణను సమర్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా కృదంత భావాన్ని నిలిపాం.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: వెండినిగాని కంచునిగాని ప్రతిష్ఠిత అర్పణగా
  rationale: תְּרוּמָה అనేది పవిత్ర ఉపయోగం కోసం ప్రత్యేకంగా సమర్పించిన అర్పణ. నְחֹשֶׁתకు రాగి లేదా కంచు అనే అర్థాలు ఉండవచ్చు; గుడారపు సామగ్రి సందర్భంలో 'కంచు' సాధారణ ఎంపిక. וְ ను పంపిణీ భావంలో 'గాని...గాని'గా ఇచ్చాం.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: యహ్వేకు అర్పణను తీసుకొచ్చారు
  rationale: నిర్మాణ సంబంధం అర్పణ యహ్వేకు చెందినదని లేదా ఆయన కోసం ప్రత్యేకించబడిందని సూచించగలదు. తెలుగులో లక్ష్యార్థాన్ని సహజంగా తెలిపే 'యహ్వేకు అర్పణ'ను ఎంచుకున్నాం; స్వామ్యార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: ఎవరి దగ్గర ఉంటే, వారందరూ
  rationale: అక్షరార్థంగా 'ఎవరి వద్ద కనబడిందో' అనే హీబ్రూ నుడికారం possession లేదా అందుబాటులో ఉండడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన సమానార్థక నుడికారాన్ని వాడాం.
- source_word: עֲצֵי שִׁטִּים
  choice: తుమ్మచెక్క
  rationale: שִׁטִּיםను సాధారణంగా acaciaగా గుర్తిస్తారు. తెలుగులో ప్రజలకు అర్థమయ్యే స్థానిక వృక్షపదమైన 'తుమ్మ'ను ఎంచుకున్నాం.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: సేవకు సంబంధించిన ఏ పనికైనా ఉపయోగపడే
  rationale: מְלָאכָהలో పని లేదా నైపుణ్యకార్యం, עֲבֹדָהలో సేవ లేదా శ్రమ భావాలు ఉన్నాయి. రెండు భావాలనూ సహజ తెలుగులో నిలిపి, వచనంలో లేని 'గుడారం'ను చేర్చలేదు.
- source_word: הֵבִיאוּ
  choice: దాన్ని తీసుకొచ్చారు
  rationale: తుమ్మచెక్కను సమూహవాచక ద్రవ్యంగా సూచిస్తూ తెలుగు వాక్యం సంపూర్ణంగా ఉండేందుకు 'దాన్ని' చేర్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని 'ప్రభువు' అనే బిరుదుగా మార్చకుండా, సాధారణ పండిత పునర్నిర్మాణానికి అనుగుణంగా 'యహ్వే'గా ఇచ్చాం.
- issue: תְּרוּמַת יְהוָה నిర్మాణ సంబంధం
  choice: యహ్వేకు అర్పణ
  alternative: యహ్వే అర్పణ
  rationale: ఈ నిర్మాణం స్వామ్యం లేదా గమ్యార్థం రెండింటినీ అనుమతిస్తుంది. సందర్భంలో ఆయన కోసం ప్రత్యేకించిన అర్పణ అనే భావం సహజంగా ఉండటంతో లక్ష్యార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, స్వామ్యార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమాంతర సమూహాలను స్పష్టంగా ఉంచాం. 'ప్రతిష్ఠిత అర్పణ'తో תְּרוּמָה యొక్క పవిత్ర ప్రయోజన భావాన్ని తెలియజేశాం; అవసరమైన మూలభాషా ప్రత్యామ్నాయాలు మాత్రమే పాదసూచికల్లో ఇచ్చాం.
