revisions:
- from: వెండినిగాని కంచునిగాని ప్రతిష్ఠిత అర్పణగా సమర్పించిన ప్రతి ఒక్కరూ యహ్వేకు అర్పణను తీసుకొచ్చారు[a]. సేవకు సంబంధించిన ఏ పనికైనా ఉపయోగపడే తుమ్మచెక్క ఎవరి దగ్గర ఉంటే, వారందరూ దాన్ని తీసుకొచ్చారు[b].
  to: వెండి గానీ కంచు గానీ కానుకను అర్పించిన ప్రతి ఒక్కరూ యహ్వేకు కానుకను[a] తీసుకొచ్చారు. సేవా పనులన్నిటికోసం తుమ్మచెక్క ఎవరి దగ్గర ఉందో, వారందరూ దానిని తీసుకొచ్చారు[b].
  rationale: The revision removes an unnecessarily strong consecration nuance, improves modern Telugu flow, and more closely represents the stated purpose of the acacia wood. It preserves the source’s distributive sense for silver or bronze contributions and retains the ambiguity of תְּרוּמַת יְהוָה in a properly framed footnote.
