lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: అప్పుడు ... బయలుదేరింది
  rationale: יצא అనే క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సమూహవాచకమైన ‘సమాజం’తో సహజమైన తెలుగు ఏకవచన క్రియను వాడుతూ, బయలుదేరడమనే సరళ అర్థాన్ని నిలిపింది.
- source_word: כָּל
  choice: సమాజమంతా
  rationale: తదుపరి నిర్మాణాన్ని כָּל సంపూర్ణంగా సూచిస్తుంది; తెలుగులో ‘సమాజమంతా’ మొత్తం సమూహాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲדַת
  choice: సమాజం
  rationale: עֵדָה ఇశ్రాయేలు యొక్క సమష్టి సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి ఆ సామూహిక భావాన్ని కాపాడుతుంది; ‘సభ’ కూడా సాధ్యమే.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ నిర్మాణంలోని ‘కుమారులు’ అనే బంధుత్వ పదాన్ని సాధారణీకరించి ‘ఇశ్రాయేలీయులు’గా మార్చకుండా రూపసామ్యాన్ని నిలిపింది.
- source_word: מִלִּפְנֵי
  choice: సమక్షం నుండి
  rationale: అక్షరార్థంగా ‘ముందు నుండి’ అనే స్థలసంబంధ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం ‘సమక్షం నుండి’; ఇది మోషే సన్నిధి నుండి వెళ్లిపోయారనే భావాన్ని తెలియజేస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: మֹשֶׁה అనే వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
