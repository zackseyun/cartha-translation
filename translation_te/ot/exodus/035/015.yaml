id: EXO.35.15
reference: Exodus 35:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת מִזְבַּ֤ח הַ/קְּטֹ֨רֶת֙ וְ/אֶת בַּדָּ֔י/ו וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לְ/פֶ֥תַח הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: te
  text: ధూపవేదికను, దాని మోసే కర్రలను, అభిషేక తైలాన్ని, సుగంధ ధూపద్రవ్యాన్ని,[a] నివాస గుడారపు ప్రవేశద్వారానికి తెరను;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుగంధ ద్రవ్యాల ధూపం’ లేదా ‘సుగంధ ద్రవ్యాలతో చేసిన ధూపం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదిక
  rationale: హీబ్రూ నిర్మాణం ధూపంతో సంబంధమున్న వేదికను సూచిస్తుంది. ‘ధూపవేదిక’ సంక్షిప్తంగా, సహజంగా ఉండి ఆరాధనా సందర్భంలోని ప్రత్యేక వస్తువును స్పష్టంగా గుర్తిస్తుంది.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలు
  rationale: మందిర సామగ్రిని మోసేందుకు ఉపయోగించే కర్రలను సూచిస్తుంది. కేవలం ‘కర్రలు’ కంటే ‘మోతకర్రలు’ వాటి ప్రయోజనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఆరాధనా అభిషేకానికి ఉపయోగించే నూనె అనే ఆచారపరమైన భావాన్ని నిలుపుకునే స్థిరమైన తెలుగు పదబంధం.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ధూపద్రవ్యం
  rationale: הַסַּמִּים సుగంధ ద్రవ్యాలు లేదా పరిమళ పదార్థాలను సూచిస్తుంది. ఈ ఎంపిక ధూపపు పరిమళ స్వభావాన్నీ, అది సిద్ధపరచిన పదార్థమనే భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָסַךְ הַפֶּתַח
  choice: ప్రవేశద్వారానికి తెర
  rationale: ప్రవేశస్థలంలో వేలాడదీసే ఆవరణ తెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: మందిరపు ప్రవేశద్వారానికి
  rationale: לְ ఇక్కడ ముందున్న తెర ఏ ప్రవేశద్వారానికి ఉద్దేశించబడిందో తెలిపే సంబంధం లేదా ప్రయోజనాన్ని సూచిస్తుంది. తెలుగు విభక్తి నిర్మాణం పునరుక్తి లేకుండా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: మందిరం
  rationale: ఈ సందర్భంలో ఇశ్రాయేలీయుల సంచార పవిత్ర నివాసాన్ని సూచిస్తుంది. ‘మందిరం’ సామాన్య పాఠకులకు సహజమైనదైనా, స్థిర ఆలయంతో గందరగోళం సంభవించగలందున ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే జాబితా శైలి. ఈ వచనం ముందున్న ఆజ్ఞలోని వస్తువుల జాబితాను కొనసాగిస్తుంది కాబట్టి చివరలో అర్ధవిరామ చిహ్నం ఉంచబడింది. ‘మోతకర్రలు’ వస్తువు యొక్క వాహక ప్రయోజనాన్ని స్పష్టం చేస్తుంది; ‘తెర’ సాధారణ పాఠకునికి సహజమైన పదం.
