    text: లేదా, “వాటి త్రాళ్లను.”
    reason: మֵיתְרֵיהֶםకు ‘తాళ్లు’తో పాటు ‘త్రాళ్లు/తీగలు’ అనే సమీప పదప్రత్యామ్నాయం సాధ్యమని సూచిస్తుంది; ఆంగ్ల POBలో నమోదైన ‘cords’ ప్రత్యామ్నాయాన్ని ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: יִתְדֹת
  choice: మేకులు
  rationale: నేలలో దించి గుడారాన్ని, ప్రాంగణపు తెరలను బిగించడానికి ఉపయోగించే మేకులను సూచిస్తుంది. ‘మేకులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, జాబితా సందర్భంలో స్పష్టంగా అర్థమవుతుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: నిర్గమకాండంలోని పవిత్ర నివాస నిర్మాణాన్ని సూచించే מִשְׁכָּן పదానికి ‘నివాస గుడారం’ మూలార్థాన్నీ, అది గుడార నిర్మాణమనే భౌతిక స్వరూపాన్నీ స్పష్టంగా నిలుపుతుంది; ‘మందిరం’ అనడం తరువాతి కాలపు శాశ్వత ఆలయాన్ని సూచించే ప్రమాదం ఉంది.
- source_word: הֶחָצֵר
  choice: ప్రాంగణం
  rationale: నివాస గుడారం చుట్టూ తెరలతో ఆవరించిన బయటి స్థలాన్ని సూచిస్తుంది. ‘ప్రాంగణం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: מֵיתְרֵיהֶם
  choice: వాటి తాళ్లు
  rationale: నిర్మాణాన్ని మేకులకు బిగించే తాళ్లను సూచిస్తుంది. బహువచన ప్రత్యయాన్ని ‘వాటి’గా నిలిపి, అది ముందు పేర్కొన్న నిర్మాణ భాగాలకు సంబంధించినదని తెలియజేస్తుంది.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '... మేకులను, ... మేకులను, వాటి తాళ్లను'
  rationale: אֶתను విడిగా అనువదించకుండా, పునరావృత సంయోజిత కర్మలతో ఉన్న జాబితా నిర్మాణాన్ని తెలుగు విభక్తి మరియు విరామచిహ్నాల ద్వారా నిలిపింది.
