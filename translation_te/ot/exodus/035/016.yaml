  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֣ת מִזְבַּ֣ח הָ/עֹלָ֗ה וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: te
  text: దహనబలి బలిపీఠం, దానికి చెందిన కంచు జాలి[a], దాని మోతకర్రలు, దాని సామగ్రి అంతా, కడుగుకొనే తొట్టి, దాని పీట—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంచు జల్లెడ,’ ‘కంచు జాలకపు పని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: ఈ నిర్మాణ పదబంధం సంపూర్ణంగా దహించే బలికి సంబంధించిన నిర్దిష్ట బలిపీఠాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం దాని బలి సంబంధమైన కార్యాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: కంచు జాలి
  rationale: מִכְבָּר బలిపీఠానికి సంబంధించిన జాలకాకార లోహ నిర్మాణాన్ని సూచిస్తుంది. 'కంచు జాలి' ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; వస్తువు ఖచ్చిత రూపాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: אֲשֶׁר לוֹ
  choice: దానికి చెందిన
  rationale: ఈ సంబంధవాచక పదబంధం బలిపీఠంతో గల స్వామ్య లేదా అనుబంధ సంబంధాన్ని తెలియజేస్తుంది. అది బలిపీఠంపై ఉందని హెబ్రీ పాఠం కంటే ఎక్కువగా నిర్దిష్టపరచకుండా 'దానికి చెందిన' ఆ భావాన్ని కాపాడుతుంది.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలు
  rationale: ఈ కర్రలు పరిశుద్ధ గుడారపు సామగ్రిని మోయడానికి ఉపయోగించేవి. 'మోతకర్రలు' సాధారణ 'కర్రలు' కంటే వాటి కార్యాన్ని స్పష్టంగా తెలియజేస్తూ సహజమైన తెలుగులో ఉంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతా
  rationale: כֵּלִים ఇక్కడ బలిపీఠానికి సంబంధించిన పాత్రలు, పనిముట్లు మొదలైన వాటిని కలిపి సూచించే విస్తృత పదం. 'సామగ్రి అంతా' ఆ విస్తృతిని సహజంగా నిలుపుతుంది.
- source_word: הַכִּיֹּר
  choice: కడుగుకొనే తొట్టి
  rationale: ఇది ప్రాంగణంలో కడుక్కోవడానికి ఉంచిన పాత్ర. 'కడుగుకొనే తొట్టి' దాని కార్యాన్ని సాధారణ ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כַּנּוֹ
  choice: దాని పీట
  rationale: ఈ పదం తొట్టికి ఆధారంగా ఉండే పీట లేదా అడుగు భాగాన్ని సూచిస్తుంది. 'పీట' ప్రత్యేక వస్తువును సహజంగా సూచిస్తుంది; 'ఆధారం' కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఇది మునుపటి వచనాల నుంచి కొనసాగుతున్న జాబితా కావడంతో చివరలో దీర్ఘవిరామ చిహ్నం ఉంచబడింది. మూలపాఠంలోని స్వామ్య సూచకాలను వీలైనంత స్పష్టంగా నిలిపాం.
