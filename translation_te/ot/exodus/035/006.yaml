base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/006.yaml
  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: te
  text: నీలి[a], ఊదా, కెంపురంగు నూలు, సన్నని నారబట్ట, మేక వెంట్రుకలు;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీలి-ఊదా రంగు వేసిన నూలు/వస్త్ర పదార్థం’; ఈ రంగుపదం సూచించే ఖచ్చితమైన ఛాయ నిర్ధారించడం కష్టం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: నీలి
  rationale: ఈ పదం నీలి లేదా నీలి-ఊదా రంగు వేసిన వస్త్ర పదార్థాన్ని సూచిస్తుంది. జాబితా సందర్భంలో సంక్షిప్త రంగుపేరు సహజంగా ఉండి, నూలు/వస్త్ర పదార్థ భావం సందర్భం ద్వారా తెలుస్తుంది; రంగు ఛాయలోని స్వల్ప అనిశ్చితిని పాదటిప్పణి నిలుపుతుంది.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: ఊదా రంగు వేసిన వస్త్ర పదార్థాన్ని సూచించే పదం. జాబితాలో రంగుపేరే ఆ రంగు వేసిన నూలు లేదా వస్త్రానికి సంక్షిప్త సూచనగా సహజంగా పనిచేస్తుంది.
- source_word: תוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: అక్షరార్థ నిర్మాణం ఎర్రని రంగునిచ్చే పురుగుతో సంబంధమున్నప్పటికీ, గుడారపు వస్త్ర సామగ్రి సందర్భంలో ఎర్ర రంగు వేసిన నూలు ఉద్దేశించబడింది. ఆధునిక తెలుగులో ఇది స్పష్టమైన, సహజమైన రూపం.
- source_word: שֵׁשׁ
  choice: సన్నని నారబట్ట
  rationale: గుడారపు సందర్భాల్లో ఈ పదం సాధారణ నారకన్నా మెత్తగా, సన్నగా నేసిన ఉత్తమ నారబట్టను సూచిస్తుంది. ‘సన్నని నారబట్ట’ దాని పదార్థాన్నీ నాణ్యతనూ తెలియజేస్తుంది.
- source_word: עִזִּים
  choice: మేక వెంట్రుకలు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘మేకలు’ అనే బహువచనం ఉన్నా, ఈ నిర్మాణ సామగ్రి జాబితాలో మేక వెంట్రుకలతో నేసే పదార్థమే ఉద్దేశం. సజీవ మేకలు అని అపార్థం కాకుండా అంతర్భావాన్ని స్పష్టం చేశాం.
- source_word: וְ
  choice: మరియు/జాబితా విరామం
  rationale: మూలంలో ప్రతి అంశానికి సంధానక conjunction ఉంది. తెలుగులో ప్రతిసారీ ‘మరియు’ అనడం కృత్రిమంగా ఉండటంతో, సహజమైన జాబితా లయ కోసం విరామచిహ్నాలతో దాని సంధాన భావాన్ని వ్యక్తపరిచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడాం. ఇది ముందూ వెనుకా కొనసాగే సామగ్రి జాబితాలోని ఒక భాగం కాబట్టి చివర సెమికోలన్ ఉంచాం. మూలంలోని పునరావృత וְలను తెలుగులో సహజమైన కామా-జాబితాగా మలిచాం.
