  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: te
  text: పొదగడానికి రాళ్లను చెక్కే పనిలోను, చెక్కను చెక్కే పనిలోను, ప్రతి విధమైన నైపుణ్యపూర్వక పనిని[a] చేయడంలోను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రణాళిక ప్రకారం రూపొందించిన ప్రతి విధమైన పనిని” లేదా “ప్రతి విధమైన కళాత్మక పనిని.” హెబ్రీ పదం ఆలోచనతో, రూపకల్పనతో, నైపుణ్యంతో చేసే పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: చెక్కడంలో
  rationale: ఒకే హెబ్రీ నామవాచకం రాయి, చెక్క అనే రెండు పదార్థాలపై నైపుణ్యంతో చేసే పనిని సూచిస్తుంది. తెలుగులో రెండింటికీ ‘చెక్కడం’ సహజంగా సరిపోతూ మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: אֶבֶן
  choice: రాళ్లను
  rationale: హెబ్రీలో ఏకవచన రూపం ఉన్నా ఇది పదార్థాన్ని లేదా సాధారణ వర్గాన్ని సూచిస్తుంది; ఈ వృత్తి సందర్భంలో తెలుగు బహువచనం సహజం.
- source_word: לְמַלֹּאת
  choice: పొదగడానికి
  rationale: ఈ గుడారపు కళాకారుల సందర్భంలో రత్నాలను అమరికల్లో పొదగడాన్ని సూచిస్తుంది; సాధారణ అర్థమైన ‘నింపడం’ ఇక్కడ ఉద్దేశం కాదు.
- source_word: עֵץ
  choice: చెక్కను
  rationale: ఇక్కడ జీవించి ఉన్న చెట్టు కాక, పనికి ఉపయోగించే పదార్థం ఉద్దేశించబడింది.
- source_word: לַעֲשׂוֹת
  choice: చేయడంలో
  rationale: עשה అనే విస్తృత క్రియను తరువాతి ‘ప్రతి పని’తో సహజంగా కలిపే రూపం.
- source_word: בְּכָל מְלֶאכֶת
  choice: ప్రతి పనిని
  rationale: కళాకారుడు చేయగల మొత్తం రకాల పనులను పంపిణీయ భావంతో సూచిస్తుంది.
- source_word: מַחֲשָׁבֶת
  choice: నైపుణ్యంతో రూపొందించే
  rationale: ఈ పదంలో ఆలోచించి పథకం వేసి, రూపకల్పన చేసి, కళాత్మక నైపుణ్యంతో చేసే పని అనే భావాలు ఉన్నాయి. తెలుగు పదబంధం ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఈ పద్యం హెబ్రీలో ముందటి వాక్యాన్ని కొనసాగించే అసంపూర్ణ జాబితా భాగం.
  choice: తెలుగులో అర్థవంతమైన వాక్యంగా ఉండేందుకు ముందటి సందర్భంలోని ప్రధాన క్రియను కోష్ఠకాల్లో పూరించడం.
  alternative: ‘పొదగడానికి రాళ్లను చెక్కడంలో...’ అని వాక్యఖండంగానే ఉంచడం.
  rationale: ఒంటరి పద్యంగా చదివినప్పుడు సహజత, స్పష్టత అవసరం; కోష్ఠకాలు చేర్చిన మాటలు ఈ పద్యంలో ప్రత్యక్షంగా లేవని పారదర్శకంగా తెలియజేస్తాయి, భావాన్ని కొత్తగా నిర్ణయించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పొదగడం’ రత్నాల అమరిక సందర్భానికి తగిన వృత్తిపదం; ‘నైపుణ్యంతో రూపొందించే’ అనేది מַחֲשָׁבֶת లోని రూపకల్పన, కళాత్మకత, నైపుణ్యం అనే భావాలను అతిగా సంకుచితం చేయకుండా వ్యక్తపరుస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
