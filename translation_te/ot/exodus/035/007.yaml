  terminology: “పొట్టేళ్ల చర్మాలు” appropriately renders ram skins. Retaining “తహషు” in the text avoids deciding a disputed referent. The footnote gives principal alternatives without presenting any one as certain. “అకేషియా కలప” is preferable to a vernacular tree name here.
  issues:
