    issue: “తుమ్మచెట్టు కలప” is not a sufficiently stable equivalent for שִׂטִּים.
    rationale: The Hebrew is generally identified with acacia, while “తుమ్మచెట్టు” may evoke different regional or specific thorn trees in Telugu usage. Using “అకేషియా కలప” maintains source-level precision without overidentifying the exact species.
