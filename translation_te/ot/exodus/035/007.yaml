  yaml_path: translation/ot/exodus/035/007.yaml
  text: and rams’ skins dyed red[a], and hides of sea cows, and acacia wood.
translation:
  language: te
  text: ఎరుపు రంగు వేసిన పొట్టేళ్ల చర్మాలు, తహషు చర్మాలు[a], అకేషియా కలప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తహషు” అనే హీబ్రూ పదం ఏ జంతువును లేదా ఏ రకమైన చర్మాన్ని సూచిస్తుందో అనిశ్చితం. దీనిని “మేకచర్మం,” “సముద్ర ఆవు చర్మం,” “డుగాంగ్ చర్మం,” లేదా “శ్రేష్ఠమైన తోలు” అని కూడా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: ఎరుపు రంగు వేసిన పొట్టేళ్ల చర్మాలు
  rationale: עֹרֹת אֵילִם అంటే పొట్టేళ్ల చర్మాలు; מְאָדָּמִים వాటిని ఎరుపుగా చేసిన ఫలితస్థితిని సూచిస్తుంది. సందర్భానికి తగిన సహజమైన తెలుగులో ‘ఎరుపు రంగు వేసిన’ అని అనువదించాం.
- source_word: עֹרֹת תְּחָשִׁים
  choice: తహషు చర్మాలు
  rationale: תְּחָשִׁים ఏ జంతువును లేదా ఏ ప్రత్యేక చర్మాన్ని సూచిస్తుందో నిశ్చయంగా తెలియదు. ఊహాత్మకంగా ఒక జంతువును నిర్ణయించకుండా మూలపదాన్ని లిప్యంతరీకరించి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: עֲצֵי שִׂטִּים
  choice: తుమ్మచెట్టు కలప
  rationale: שִׁטִּים అకేషియా వర్గానికి చెందిన చెట్లను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే వృక్షనామంగా ‘తుమ్మచెట్టు’ను ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ పదజాలం ఉంచాం. హీబ్రూ జాబితాలోని సమాంతర నిర్మాణాన్ని సంక్షిప్తంగా నిలిపాం; תְּחָשִׁים విషయంలోని నిజమైన నిఘంటు అనిశ్చితిని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా కాపాడాం.
