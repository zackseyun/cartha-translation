  source_fidelity: The draft accurately represents the six-day/seventh-day contrast, the consecrated Sabbath, dedication to Yahweh, and the legal penalty. However, ‘తప్పక’ adds an explicit intensifier not present in יוּמָת; the Hebrew Hophal simply states that the offender is to be put to death.
