  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: te
  text: ఆరు రోజులు పని చేయవచ్చు. అయితే ఏడవ రోజు మీకు పవిత్రమైనది; అది యాహ్వేకు[b] సంపూర్ణ విశ్రాంతి సబ్బాతు[a]. ఆ రోజున పని చేసే ప్రతివాడూ మరణశిక్ష పొందాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గంభీర విశ్రాంతి సబ్బాతు.’ ‘సబ్బాతు, సబ్బాతు-విశ్రాంతి’ అనే హెబ్రీ పదబంధం పనిని పూర్తిగా మానడమనే భావాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘యాహ్వేకు’; సందర్భానుసారంగా ‘యాహ్వే కోసం’ లేదా ‘యాహ్వేకు చెందిన’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: పని చేయవచ్చు
  rationale: నిఫాల్ క్రియారూపంలోని వ్యక్తిరహిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇది నేరుగా ఒక నిర్దిష్ట కర్తను ఆజ్ఞాపించకుండా, ఆరు రోజులలో పని జరగవచ్చనే నియమార్థాన్ని నిలుపుతుంది.
- source_word: קֹדֶשׁ
  choice: పవిత్రమైనది
  rationale: ఏడవ రోజు దేవునికి ప్రత్యేకంగా ప్రతిష్ఠించబడినదనే విధేయ నామవాచక భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి సబ్బాతు
  rationale: ఒకే మూలానికి చెందిన పదాల పునరుక్తి విశ్రాంతి లేదా పనిని పూర్తిగా మానడాన్ని తీవ్రతరం చేస్తుంది. ‘సంపూర్ణ విశ్రాంతి’ ఆ బలాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: లְ ఉపసర్గలోని దిశ, అంకితం లేదా చెందినదనే విస్తృత భావాన్ని సంక్షిప్తంగా ఉంచుతుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: כָּל־הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: ఆ రోజున పని చేసే ప్రతివాడూ
  rationale: సాధారణ న్యాయనియమంలోని సార్వత్రిక వర్తింపును ‘ప్రతివాడూ’ తెలియజేస్తుంది; בּוֹ సూచించే సబ్బాతు దినాన్ని తెలుగులో సహజంగా ‘ఆ రోజున’ అని వ్యక్తం చేస్తుంది.
- source_word: יוּמָת
  choice: తప్పక మరణశిక్ష పొందాలి
  rationale: హొఫాల్ క్రియారూపంలోని ‘మరణానికి గురిచేయబడాలి’ అనే కారణార్థక కర్మణి భావాన్ని సహజమైన న్యాయపరమైన తెలుగులో ఇస్తుంది. ‘తప్పక’ శిక్షావాక్యపు దృఢత్వాన్ని తెలియజేస్తుంది; హెబ్రీలో ప్రత్యేక infinitive absolute లేదనే కారణంగా దీనిని అతిశయోక్తిగా విస్తరించలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ఒడంబడిక నామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: לַיהוָה లోని సంబంధం
  choice: యాహ్వేకు
  alternative: యాహ్వే కోసం / యాహ్వేకు చెందిన
  rationale: לְ ఉపసర్గ అంకితం, ఉద్దేశం లేదా చెందినదనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలోని సంక్షిప్త ‘యాహ్వేకు’ ఈ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘సబ్బాతు’ అనే స్థిర బైబిలు పదాన్ని ఉంచి, దాని తీవ్రతను ‘సంపూర్ణ విశ్రాంతి’తో స్పష్టం చేశాం. మూలంలోని రెండు ప్రధాన వాక్యభాగాల వ్యత్యాసాన్ని విరామచిహ్నాలతో సహజంగా చూపించాం.
