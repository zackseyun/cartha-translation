  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: te
  text: 'మీలో నైపుణ్యం గల ప్రతి వ్యక్తి[a][b] వచ్చి యాహ్వే ఆజ్ఞాపించినవన్నీ తయారు చేయాలి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “హృదయంలో జ్ఞానం గలవాడు.” ఇది ముఖ్యంగా చేతిపనిలో నేర్పు లేదా నైపుణ్యం గలవారిని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: మరో విధంగా, “మీలో నైపుణ్యం గలవారందరూ.” హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్నా, ఇక్కడ ఒక్కొక్కరినీ సూచించే పంపిణీ భావంతో వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: ప్రతి
  rationale: ఏకవచన నామవాచకంతో ఉన్న כָל ఇక్కడ సమూహంలోని ఒక్కొక్కరినీ సూచించే పంపిణీ భావాన్ని కలిగిస్తుంది. ముందున్న సందర్భంతో వాక్యాన్ని కలిపే וְ భావం తెలుగులో వాక్యప్రవాహం ద్వారానే సహజంగా వ్యక్తమవుతుంది.
- source_word: חֲכַם לֵב
  choice: నైపుణ్యంగల వ్యక్తి
  rationale: అక్షరార్థంగా ‘హృదయంలో జ్ఞానంగలవాడు’ అనే ఈ హీబ్రూ నుడికారం, ప్రత్యక్ష సందర్భంలో గుడారపు పనులు చేయగల ప్రాయోగిక నైపుణ్యాన్ని సూచిస్తుంది. ‘నైపుణ్యంగల వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בָּ/כֶם
  choice: మీలో
  rationale: בְּ ఉపసర్గతో రెండవ పురుష బహువచన ప్రత్యయం సమాజంలో ఉన్నవారిని సూచిస్తుంది; అందువల్ల ‘మీలో’ సంక్షిప్తమైన సహజ తెలుగు రూపం.
- source_word: יָבֹאוּ
  choice: వచ్చి
  rationale: ఈ పిలుపులో అపూర్ణ క్రియకు ఆదేశార్థక బలం ఉంది. తరువాతి క్రియతో కలిపి ‘వచ్చి ... చేయాలి’ అని ఇవ్వడం తెలుగులో సహజంగా ఆ నిర్దేశాన్ని నిలుపుతుంది.
- source_word: וְ/יַעֲשׂוּ
  choice: తయారుచేయాలి
  rationale: עָשָׂה సాధారణంగా ‘చేయు/తయారుచేయు’ అని అర్థమవుతుంది; పరిశుద్ధ గుడారాన్ని, దాని సామగ్రిని నిర్మించే సందర్భంలో ‘తయారుచేయాలి’ అనే స్పష్టమైన కర్మనిర్మాణ భావం తగినది.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ఆజ్ఞాపించినవన్నీ
  rationale: కర్మసూచక అవ్యయం, כָל, సంబంధవాచక పదం కలిసి ఆజ్ఞాపించబడిన సమస్తాన్ని సూచిస్తున్నాయి. తెలుగులో ‘-నవన్నీ’ ఆ సంపూర్ణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה יְהוָה
  choice: యాహ్వే ఆజ్ఞాపించిన
  rationale: పూర్తిక్రియ, చేయవలసిన పనికి ముందే ఇచ్చిన ఆజ్ఞను సూచిస్తుంది. יהוהను బిరుదుతో భర్తీ చేయకుండా దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: חֲכַם לֵב లో వ్యాకరణ లింగం మరియు పంపిణీ భావం
  choice: నైపుణ్యంగల ప్రతి వ్యక్తి
  alternative: నైపుణ్యంగల ప్రతి పురుషుడు / మీలో నైపుణ్యంగలవారందరూ
  rationale: హీబ్రూలో పదబంధం పుంలింగ ఏకవచన రూపంలో ఉన్నప్పటికీ, כָל తో కలిసి సమూహంలోని ఒక్కొక్క నైపుణ్యవంతునిపై పంపిణీ బలం కలిగిస్తుంది. ఈ రూపమే కేవలం పురుషులను ఉద్దేశిస్తోందని వచనం నిర్బంధంగా చెప్పదు; అందువల్ల లింగాన్ని అదనంగా నిర్ణయించకుండా ‘వ్యక్తి’ అని ఇచ్చి, రూప సంబంధ విషయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘నైపుణ్యంగల’ అనేది సందర్భంలోని చేతివృత్తి సామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది; ‘తయారుచేయాలి’ ఆదేశార్థక బలాన్నీ నిర్మాణ సందర్భాన్నీ నిలుపుతుంది. మూలంలోని కొలన్‌ను చివర ఉంచి తరువాత వచ్చే జాబితాతో సంబంధాన్ని కాపాడాం.
