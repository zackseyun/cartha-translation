revisions:
- from: ఆయన వారిని హృదయ జ్ఞానంతో[a] నింపాడు. దానివల్ల వారు శిల్పి[b], రూపకర్త, నీలం, ఊదా, ఎర్రని నూలుతోనూ సన్నని నారతోనూ కుట్టుపని చేసేవాడు, నేతపనివాడు చేసే అన్ని రకాల పనులను చేయగలరు. వారు అన్ని రకాల పనులు చేసేవారు, రూపకల్పనలను రూపొందించేవారు[c].
  to: ఆయన వారిని హృదయ జ్ఞానంతో[a] నింపాడు, తద్వారా వారు శిల్పి[b], రూపకర్త, నీలం, ఊదా, ఎర్రని నూలుతో, సన్నని నారతో అలంకార కుట్టుపని చేసేవాడు, నేతపనివాడు చేసే ప్రతి విధమైన పనిని చేయగలరు—అన్ని విధాల పనులు చేసేవారుగా, రూపకల్పనలను రూపొందించేవారుగా[c].
  rationale: The revision makes each craft worker a parallel member of the Hebrew list, explicitly marks the purpose of the divinely given wisdom, and retains the final paired participial description and its deliberate design-related repetition. Footnote anchors remain attached to their relevant terms.
