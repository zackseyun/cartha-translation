language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: te
  text: ఆయన వారిని హృదయ జ్ఞానంతో[a] నింపాడు, తద్వారా వారు శిల్పి[b], రూపకర్త, నీలం, ఊదా, ఎర్రని నూలుతో, సన్నని నారతో అలంకార కుట్టుపని చేసేవాడు, నేతపనివాడు చేసే ప్రతి విధమైన పనిని చేయగలరు—అన్ని విధాల పనులు చేసేవారుగా, రూపకల్పనలను రూపొందించేవారుగా[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హృదయ జ్ఞానం.” ఇది అంతరంగంలో పాతుకుపోయిన నైపుణ్యం, వివేచన, పనితనాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా “చెక్కే పనివాడు.” హెబ్రీ పదం సాధారణంగా నైపుణ్యంగల శిల్పిని సూచించగలదు; ఇక్కడ అది ప్రత్యక్షంగా చెక్కే ప్రత్యేక పనిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “రూపకల్పనలను రూపొందించేవారుగా” అన్న చోట హెబ్రీలో ఒకే మూలానికి చెందిన పదాలు పునరుక్తమై, కళాత్మక ప్రణాళికలను ఆలోచించి చేసే పనిని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: వారిని ... నింపాడు
  rationale: పియేల్ క్రియ యొక్క ‘నింపాడు’ అనే ప్రత్యక్ష భావాన్ని, మునుపటి సందర్భంలో దేవుడే కర్త అనే సూచనను నిలుపుతుంది.
- source_word: חָכְמַת לֵב
  choice: హృదయ జ్ఞానం
  rationale: నైపుణ్యం, వివేచన, అంతర్గత సామర్థ్యం కలిసిన హెబ్రీ నుడికారాన్ని యథాశక్తి నిలుపుతుంది; వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: כָּל מְלֶאכֶת
  choice: అన్ని రకాల పనులు
  rationale: నైపుణ్యంతో చేసే సమస్త విధాల పనులు అనే సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָרָשׁ
  choice: శిల్పి
  rationale: ఈ పదం సాధారణంగా నైపుణ్యంగల చేతిపనివాణ్ణి సూచించగలదు; సందర్భంలో చెక్కే లేదా చెక్కడం చేసే ప్రత్యేక పనివాడనే భావం కూడా సాధ్యం.
- source_word: חֹשֵׁב
  choice: రూపకర్త
  rationale: కళాత్మక నమూనాలను ఆలోచించి రూపొందించే వ్యక్తిని సూచించే వృత్తిపరమైన భావాన్ని అందిస్తుంది.
- source_word: רֹקֵם
  choice: కుట్టుపని చేసేవాడు
  rationale: వర్ణ నూలు, నారతో అలంకార కుట్టుపని చేసే వృత్తిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי וּבַשֵּׁשׁ
  choice: నీలం, ఊదా, ఎర్రని నూలుతోనూ సన్నని నారతోనూ
  rationale: వర్ణ పదార్థాల వస్త్రసంబంధ భావాన్ని స్పష్టం చేస్తూ, ששను గుడార సందర్భానికి తగిన ‘సన్నని నార’గా అందిస్తుంది.
- source_word: אֹרֵג
  choice: నేతపనివాడు
  rationale: నేయువాణ్ణి సూచించే క్రియాత్మక వృత్తి పదానికి సహజమైన తెలుగు సమానం.
- source_word: עֹשֵׂי כָּל מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: అన్ని రకాల పనులు చేసేవారు, రూపకల్పనలను రూపొందించేవారు
  rationale: రెండు కృదంతాల సమాంతర నిర్మాణాన్ని, చివరి cognate పదప్రయోగంలోని ఉద్దేశపూర్వక పునరుక్తిని తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
