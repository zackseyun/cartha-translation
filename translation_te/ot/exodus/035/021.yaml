source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: te
  text: ఎవరి హృదయం వారిని ప్రేరేపించిందో వారందరూ వచ్చారు; ఎవరి ఆత్మ వారిని స్వచ్ఛందంగా ప్రేరేపించిందో వారందరూ సమావేశపు గుడారపు పని కోసం, దానికి సంబంధించిన సమస్త సేవ కోసం, పవిత్ర వస్త్రాల కోసం యెహోవాకు[a] అర్పణను తీసుకొచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దైవనామం יהוה (YHWH) ఉంది; దీనిని ‘యాహ్వే’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: divine_name
  - marker: b
    text: ‘యెహోవాకు అర్పణ’ అని అనువదించిన మాటను ‘యెహోవా అర్పణ’ అని కూడా అనువదించవచ్చు. హీబ్రూ రూపం అర్పణ ఆయనకు అంకితమైనదని లేదా ఆయనకు చెందినదని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ כָּל אִישׁ
  choice: వారందరూ వచ్చారు
  rationale: בוא అనే సాధారణ క్రియకు ‘వచ్చారు’ సహజమైన కథన అనువాదం. כָּל אִישׁ ఇక్కడ ప్రతి దాతను సమాహారంగా సూచిస్తున్నందున లింగపరంగా పరిమితం చేయని ‘వారందరూ’ ఎంచుకున్నాం.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: తమ హృదయం ఎవరిని ప్రేరేపించిందో
  rationale: అక్షరార్థంగా ‘అతని హృదయం అతన్ని ఎత్తింది.’ తెలుగులో ఆ రూపకం అసహజంగా లేదా గర్వార్థంగా వినిపించవచ్చు; ‘ప్రేరేపించింది’ అంతరంగ ప్రేరణను స్పష్టంగా అందిస్తుంది.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: తమ ఆత్మ ఎవరిని స్వచ్ఛందంగా ముందుకు నడిపించిందో వారందరూ
  rationale: נדב యొక్క స్వచ్ఛంద సంసిద్ధతను ‘స్వచ్ఛందంగా,’ అంతరంగ చలనాన్ని ‘ముందుకు నడిపించింది’ తెలియజేస్తాయి. ‘ఆత్మ’ అని ఉంచడం మూలంలోని רוּחַ పదాన్ని సంరక్షిస్తుంది.
- source_word: הֵבִיאוּ אֶת תְּרוּמַת יְהוָה
  choice: యెహోవాకు అర్పణను తీసుకొచ్చారు
  rationale: תְּרוּמָה సమర్పణగా ప్రత్యేకించబడిన కానుక. యెహోవాతో ఉన్న సంబంధం స్వామ్యమా లేక ఆయనకు అంకితమా అన్న వ్యాకరణ అవకాశాల్లో, సందర్భానికి అనుగుణంగా ‘యెహోవాకు అర్పణ’ సహజంగా ఉంది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం నిర్మాణ పనికోసం
  rationale: מְלָאכָה విస్తృతంగా పని లేదా కార్యాన్ని సూచిస్తుంది; ఈ సందర్భంలో గుడారాన్ని మరియు దాని సామగ్రిని తయారుచేయడం ఉద్దేశం కాబట్టి ‘నిర్మాణ పని’ స్పష్టమైన సందర్భానుగుణ అనువాదం.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: దాని సేవ అంతటికోసం
  rationale: עֲבֹדָה ఇక్కడ గుడారానికి సంబంధించిన సేవా విధులను సూచించగలదు. ‘సేవ అంతటికోసం’ ఆ ఆరాధనా సందర్భాన్ని నిలుపుతుంది.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాల కోసం
  rationale: క్రమబద్ధంగా ప్రతిష్ఠించబడిన యాజక వస్త్రాలకు ‘పవిత్ర వస్త్రాలు’ స్పష్టమైన, గౌరవప్రదమైన అనువాదం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాక నాలుగు అక్షరాల దైవనామం ఉంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’ను వాడి, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
- issue: תְּרוּמַת יְהוָה లోని సంబంధం
  choice: యెహోవాకు అర్పణ
  alternative: యెహోవా అర్పణ
  rationale: హీబ్రూ సంయుక్త నిర్మాణం యెహోవాకు అంకితమైన అర్పణను లేదా ఆయనకు చెందిన అర్పణను సూచించగలదు. సందర్భంలో ప్రజలు ఆయన కొరకు వస్తువులు తెస్తున్నారు కాబట్టి ప్రధాన పాఠంలో లక్ష్యార్థాన్ని ఎంచుకుని, స్వామ్యార్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హృదయం మరియు ఆత్మ అనే సమాంతర అంతరంగ పదాలను నిలిపి, హీబ్రూ నుడికారాన్ని అసహజ అక్షరానువాదం చేయకుండా భావస్పష్టత ఇచ్చాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
