reference: Exodus 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: te
  text: దొంగ దొరకకపోతే, ఇంటి యజమాని తన పొరుగువాని ఆస్తిపై తాను చేయి వేయలేదా అని నిర్ధారించడానికి దేవుని దగ్గరకు[a] రావాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయాధిపతుల దగ్గరకు.’ హీబ్రూలో ‘దేవుని దగ్గరకు’ అని ఉంది; అయితే కొన్ని న్యాయసందర్భాల్లో ఈ పదం దైవాధికారంతో వ్యవహరించే న్యాయాధిపతులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: దొంగ దొరకకపోతే
  rationale: నిఫల్ రూపంలోని క్రియకు ఇక్కడ ‘దొరకడం/కనుగొనబడడం’ అనే న్యాయసందర్భార్థం ఉంది. ‘దొరకకపోతే’ అనేది దొంగ గుర్తించబడలేదా లేక పట్టుబడలేదా అన్న విషయాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: וְנִקְרַב
  choice: సమీపానికి రావాలి
  rationale: నిఫల్ రూపం ‘దగ్గరకు రావడం’ లేదా ‘దగ్గరకు తీసుకురాబడడం’ అనే రెండు ఛాయలను అనుమతిస్తుంది. సందర్భంలో సహజమైన తెలుగుకోసం ‘రావాలి’ అని ఇచ్చినా, మూలంలోని సమీపించే భావాన్ని నిలుపుకుంది.
- source_word: בַּעַל הַבַּיִת
  choice: ఇంటి యజమాని
  rationale: ఇల్లు తన అధీనంలో ఉన్న వ్యక్తిని సూచించే సహజమైన ఆధునిక తెలుగు న్యాయపదబంధం.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవుని సమీపానికి
  rationale: హీబ్రూ పదానికి ప్రత్యక్ష అర్థం ‘దేవుడు’. న్యాయసందర్భంలో ఇది దైవాధికారంతో వ్యవహరించే న్యాయాధిపతులను కూడా సూచించవచ్చు; ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: తాను చేయి వేయలేదో లేదో
  rationale: హీబ్రూ జాతీయాన్ని నిలుపుతూ, పరుల సొత్తును అక్రమంగా తీసుకోవడం లేదా వాడుకోవడం అనే విస్తృత భావాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది. ‘దొంగిలించలేదు’ అనడం భావాన్ని అతిగా కుదిస్తుంది.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: తన పొరుగువాని ఆస్తిమీద
  rationale: ఈ న్యాయసందర్భంలో మְלָאכָה పొరుగువానికి చెందిన, అప్పగించబడిన వస్తువులు లేదా ఆస్తిని సూచిస్తుంది. ‘ఆస్తి’ విస్తృతమైన సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఈ న్యాయసందర్భంలో אֱלֹהִים అర్థం
  choice: దేవుని సమీపానికి
  alternative: న్యాయాధిపతుల దగ్గరకు
  rationale: మూల హీబ్రూ ప్రత్యక్షంగా ‘దేవుని దగ్గరకు’ అని ఉంది. అయితే నిబంధన న్యాయసందర్భాల్లో అదే పదం దైవాధికారంతో తీర్పు చెప్పే న్యాయాధిపతులను సూచించగలదు. ఈ సందిగ్ధతను ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించాం. ‘చేయి వేయడం’ అనే మూలభాషా రూపకాన్ని సహజమైన తెలుగు జాతీయంగా నిలిపాం; దేవుడు/న్యాయాధిపతులు అనే నిజమైన అర్థసందిగ్ధతను పాదసూచికతో సంరక్షించాం.
