    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ఎవరినీ
  rationale: ఏకవచన నామవాచకాలతో కూడిన నిషేధంలో כָּל ప్రతి వ్యక్తినీ విడివిడిగా చేర్చే సమగ్ర భావాన్ని ఇస్తుంది. తెలుగులో ‘విధవరాలినిగానీ ... బిడ్డనుగానీ ... కూడదు’ అనే నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַלְמָנָה
  choice: విధవరాలు
  rationale: హీబ్రూ పదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: יָתוֹם
  choice: తండ్రిలేని బిడ్డ
  rationale: ప్రాచీన హీబ్రూ న్యాయ సందర్భంలో ఈ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయిన, రక్షణలేని బిడ్డను సూచించగలదు. ‘అనాథ’ కంటే ఈ ఎంపిక మూలపదంలోని సంభావ్య ప్రత్యేక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא
  choice: కూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תְעַנּוּן
  choice: బాధించకూడదు
  rationale: Piel రూపంలోని ענה ఇక్కడ కష్టం కలిగించడం, కఠినంగా ప్రవర్తించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘బాధించు’ ఆ విస్తృతతను నిలుపుతుంది; ‘అణచివేయు’ దానిని అధికార లేదా సామాజిక పీడనకే పరిమితం చేయవచ్చు.
