source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: te
  text: నీవు నా ప్రజలలో నీతో ఉన్న పేదవానికి డబ్బు అప్పుగా ఇస్తే[a], అతనితో బాకీ వసూలు చేసేవానిలా ఉండకూడదు; అతనిపై వడ్డీ వేయకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నా ప్రజలలో నీతో ఉన్న పేదవానికి డబ్బు అప్పుగా ఇచ్చినప్పుడు.” హెబ్రీ న్యాయసూత్ర భాషలో షరతును సూచించే రూపం ‘ఇస్తే’ లేదా ‘ఇచ్చినప్పుడు’ అనే భావాల్లో అర్థమవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ఇస్తే
  rationale: షరతును సూచించే హెబ్రీ న్యాయసూత్ర రూపాన్ని సహజమైన తెలుగు షరతురూపంతో నిలుపుతుంది; సందర్భంలో ‘ఇచ్చినప్పుడు’ అనే భావం కూడా సాధ్యమే.
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: మూలార్థం ‘వెండి’ అయినా, ఈ ఆర్థిక-న్యాయ సందర్భంలో చలామణి ధనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘డబ్బు’ స్పష్టంగా ఉంటుంది.
- source_word: תַּלְוֶה
  choice: అప్పుగా ఇస్తే
  rationale: హిఫీల్ రూపం ఇక్కడ ‘అప్పు ఇవ్వడం’ అని అర్థం; తెలుగులో ఈ ప్రయోగం సహజం.
- source_word: עַמִּי
  choice: నా ప్రజల్లో
  rationale: ‘నా ప్రజలు’ అనే దైవసంబంధ భావాన్ని నిలుపుతూ, తరువాతి ‘నీతో ఉన్న పేదవానికి’ అనే పదబంధంతో సహజంగా కలుపుతుంది.
- source_word: הֶעָנִי
  choice: పేదవానికి
  rationale: నిర్దిష్టమైన ఏకవచన పేద వ్యక్తిని సూచించే మూలరూపాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: עִמָּךְ
  choice: నీతో ఉన్న
  rationale: అక్షరార్థమైన ‘నీతో’ను నిలుపుతుంది; సమాజంలో అతనితో కలిసి ఉన్న వ్యక్తి అనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: כְּנֹשֶׁה
  choice: బాకీ వసూలు చేసేవానిలా
  rationale: కేవలం ‘రుణదాత’ కంటే, చెల్లింపుకోసం ఒత్తిడి చేసే నושה పదంలోని క్రియాశీల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: תְשִׂימוּן
  choice: వేయకూడదు
  rationale: నֶשֶׁךְతో కలిసినప్పుడు ‘వడ్డీ విధించడం/వేయడం’ అనే సహజ తెలుగు ఆర్థిక ప్రయోగం.
- source_word: נֶשֶׁךְ
  choice: వడ్డీ
  rationale: ఈ సందర్భంలో అప్పుపై తీసుకునే interestను సూచిస్తుంది; ‘అధిక వడ్డీ’ అని పరిమితం చేయదు.
theological_decisions:
- issue: אִם అనే షరతు పదానికి న్యాయసూత్ర సందర్భంలోని బలం
  choice: ఇస్తే
  alternative: ఇచ్చినప్పుడు
  rationale: మూలంలోని షరతురూపాన్ని కాపాడుతుంది. అయితే హెబ్రీ సందర్భాధార న్యాయభాషలో ఇది సంభవించే సందర్భాన్ని చెప్పే ‘ఎప్పుడు’ భావంలోనూ పనిచేయగలదని పాదటిప్పణి తెలియజేస్తుంది.
- issue: הֶעָנִיలోని లింగం మరియు వ్యక్తి సూచన
  choice: పేదవానికి
  alternative: పేద వ్యక్తికి
  rationale: హెబ్రీలోని పురుష ఏకవచన వ్యక్తి సూచనను తెలుగులో సహజమైన ఏకవచన రూపంతో నిలుపుతుంది; అవసరం లేని అదనపు పదాన్ని చేర్చదు.
- issue: כְּנֹשֶׁה నిషేధం యొక్క సామాజిక-నైతిక బలం
  choice: బాకీ వసూలు చేసేవానిలా ఉండకూడదు
  alternative: రుణదాతలా ఉండకూడదు
  rationale: మూలపదం అప్పు ఇచ్చిన వ్యక్తి అనే స్థితిని మాత్రమే కాక, బాకీ కోసం ఒత్తిడి చేసే పాత్రను సూచించగలదు. అందువల్ల పేదవాణ్ణి కఠినంగా పీడించకూడదనే భావం నిలుస్తుంది; తరువాతి వడ్డీ నిషేధంతో దానిని పూర్తిగా సమానంగా చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన న్యాయసూత్ర శైలి. ‘డబ్బు’, ‘అప్పుగా’, ‘బాకీ వసూలు’, ‘వడ్డీ’ వంటి ప్రస్తుత వాడుక పదాలు ఎంచుకున్నాం; మూలంలోని షరతు మరియు రుణవసూలు భావాల మధ్య ఉన్న సూక్ష్మతను కాపాడాం.
