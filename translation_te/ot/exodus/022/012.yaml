  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: te
  text: అయితే అది నిజంగానే క్రూరమృగాల చేత చీల్చబడితే[a], అతడు దానిని సాక్ష్యంగా తీసుకురావాలి; చీల్చబడిన దానికి అతడు పరిహారం చెల్లించనవసరం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది నిజంగానే చీల్చివేయబడితే, అతడు చీల్చబడిన జంతువును సాక్ష్యంగా తీసుకురావాలి; దానికి అతడు పరిహారం చెల్లించనవసరం లేదు.”
    reason: మూలంలోని טָרֹף יִטָּרֵף నిర్మాణం చీల్చివేయబడడాన్ని బలపరుస్తుంది. ‘క్రూరమృగాల చేత’ అనేది సందర్భానుసారమైన స్పష్టీకరణ; ఆ కర్త హీబ్రూ పాఠంలో ప్రత్యక్షంగా చెప్పబడలేదు.
lexical_decisions:
- source_word: אִם
  choice: అయితే ... అయితే
  rationale: ముందరి న్యాయనిబంధనతో వ్యత్యాసాన్ని చూపుతూ షరతును ప్రవేశపెడుతుంది; తెలుగులో ‘అయితే ... అయితే’ న్యాయపరమైన వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: טָרֹף יִטָּרֵף
  choice: క్రూరమృగాల చేత చీల్చబడితే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ చీల్చబడడం నిశ్చయంగా జరిగినదని బలపరుస్తుంది. సందర్భంలో జంతువు మరొక మృగం చేత చీల్చబడిన భావం సహజమైనది; అయితే మూలంలోని సంక్షిప్తత వల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְבִאֵהוּ
  choice: అతడు దానిని తీసుకురావాలి
  rationale: בוא హిఫీల్ రూపం ఇక్కడ తీసుకురావడం లేదా సమర్పించడం అని అర్థం; సర్వనామం చీల్చబడిన జంతువు లేదా దాని అవశేషాలను సూచిస్తుంది.
- source_word: עֵד
  choice: సాక్ష్యంగా
  rationale: పదశః ‘సాక్షి’; ఈ న్యాయసందర్భంలో చూపించబడే భౌతిక రుజువు యొక్క పాత్రను ‘సాక్ష్యంగా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַטְּרֵפָה
  choice: చీల్చబడిన దాని కోసం
  rationale: చీల్చబడిన జంతువు లేదా దాని అవశేషాలను సూచించే మూలంలోని సంక్షిప్త, కొంత అస్పష్టమైన రూపాన్ని నిలుపుతుంది.
- source_word: לֹא יְשַׁלֵּם
  choice: నష్టపరిహారం చెల్లించవలసిన అవసరం లేదు
  rationale: שלם పియేల్ న్యాయసందర్భంలో నష్టాన్ని భర్తీ చేయడం లేదా పరిహారం చెల్లించడం అని సూచిస్తుంది; తెలుగు న్యాయభాషలో ఈ ఎంపిక స్పష్టంగా, సహజంగా ఉంటుంది.
