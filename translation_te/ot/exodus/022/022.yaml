    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: బాధిస్తే
  rationale: אִם షరతును సూచిస్తుంది. తెలుగులో క్రియకు ‘-తే’ ప్రత్యయం జోడించడం ద్వారా సహజంగా, స్పష్టంగా ఆ షరతును వ్యక్తం చేశాం.
- source_word: עַנֵּה תְעַנֶּה
  choice: బాధిస్తే
  rationale: ענה ఇక్కడ బలహీనుణ్ణి బాధించడం లేదా దుర్వ్యవహారం చేయడం అనే భావంలో ఉంది. అదే క్రియ పునరుక్తి చర్యకు బలాన్ని ఇస్తుంది; తెలుగులో అసహజమైన పదపునరుక్తిని నివారించి, ఆ ఉద్ఘాటనను పాదటిప్పణిలో తెలియజేశాం.
- source_word: אֹתוֹ
  choice: అతణ్ణి
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనం. ముందటి వచనంలో పేర్కొన్న విధవరాలు లేదా తండ్రిలేని బిడ్డలలో ఏ ఒక్క వ్యక్తినైనా పంపిణీయంగా సూచిస్తుంది.
- source_word: כִּי אִם
  choice: అతడు … మొరపెట్టుకుంటే
  rationale: ఇక్కడ ఈ పదబంధం వ్యతిరేకార్థకమైన ‘కాని’ అని కాక, తదుపరి షరతును బలంగా పరిచయం చేస్తుంది. తెలుగులో రెండవ షరతుతో సహజంగా అందించాం.
- source_word: צָעֹק יִצְעַק
  choice: మొరపెట్టుకుంటే
  rationale: צעק అంటే ఆపదలో సహాయం కోసం మొరపెట్టుకోవడం. infinitive absolute మరియు finite verb కలయిక ఉద్ఘాటనను ఇస్తుంది; దానిని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: אֵלַי
  choice: నాకు
  rationale: మొర దేవుని వైపు ఉద్దేశించబడిందని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: నేను తప్పక వింటాను
  rationale: హీబ్రూ క్రియ పునరుక్తి దేవుడు వినడం నిశ్చయమని ఉద్ఘాటిస్తుంది. ‘తప్పక’ ఆ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: צַעֲקָתוֹ
  choice: అతని మొరను
  rationale: צעק అనే క్రియతో ఉన్న మూలపద సంబంధాన్ని ‘మొరపెట్టుకుంటే / మొరను’ ద్వారా తెలుగులోనూ సాధ్యమైనంతవరకు నిలిపాం.
theological_decisions:
- issue: బాధింపబడిన వ్యక్తిని సూచించే పుంలింగ ఏకవచన సర్వనామం
  choice: అతణ్ణి / అతడు / అతని
  alternative: వారిని / వారు / వారి
  rationale: మూల హీబ్రూలోని ప్రత్యయాలు పుంలింగ ఏకవచనంలో ఉన్నాయి. అయితే ముందటి వచనంలోని విధవరాలు లేదా తండ్రిలేని బిడ్డలలో ఏ వ్యక్తికైనా ఇది వర్తిస్తుంది; కాబట్టి రూపాన్ని నిలిపి, దాని పంపిణీయ భావాన్ని పాదటిప్పణిలో వివరించాం.
- issue: దేవుడు మొరను వినడం
  choice: నేను తప్పక వింటాను
  alternative: నేను వింటాను
  rationale: שָׁמֹעַ אֶשְׁמַע లోని ఉద్ఘాటన దేవుని ప్రతిస్పందన నిశ్చయాన్ని తెలియజేస్తుంది. దానిని బలహీనపరచకుండా ‘తప్పక’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన న్యాయవాక్య శైలి వాడాం. మూలంలోని వరుస షరతులను నిలిపి, తెలుగులో భారంగా వినిపించే క్రియాపునరుక్తులను ప్రధాన పాఠ్యంలో చేయకుండా వాటి ఉద్ఘాటనను ‘తప్పక’ మరియు పాదటిప్పణి ద్వారా తెలిపాం.
