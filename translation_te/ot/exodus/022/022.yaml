  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: te
  text: నీవు అతణ్ణి[a] నిజంగానే బాధిస్తే, అతడు నిజంగానే నాకు మొరపెట్టుకొంటే, అతని మొరను నేను తప్పక వింటాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతణ్ణి,’ ‘అతడు,’ ‘అతని’ అనే భావమిచ్చే సర్వనామాలు పుంలింగ ఏకవచనంలో ఉన్నాయి. ఇక్కడ అవి ముందటి వచనంలో పేర్కొన్న ఏ విధవరాలినైనా లేదా తండ్రిలేని ఏ బిడ్డనైనా వ్యక్తిగతంగా సూచిస్తాయి.
    reason: cultural_note
