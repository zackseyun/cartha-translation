  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: te
  text: ఒకడు తన పొరుగువానికి గాడిదనో, ఎద్దునో, గొర్రెనో[a], లేదా మరే పశువునో కాపాడమని అప్పగించి, అది చనిపోయినా, గాయపడినా[b], లేదా పట్టుకుపోబడినా, ఈ సంగతి ఎవరూ చూడకపోతే[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం గొర్రెను లేదా మేకను—అంటే మందలోని ఒక జంతువును—సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘విరిగిపోయినా.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, జరిగినదానికి ప్రత్యక్ష సాక్షి ఎవరూ లేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: అప్పగించినప్పుడు
  rationale: ఇది సందర్భాధారిత న్యాయనియమంలోని షరతును పరిచయం చేస్తుంది. తెలుగులో ‘ఒకవేళ’ కంటే ‘...అప్పుడు’ నిర్మాణం సహజమైన న్యాయశైలిని ఇస్తుంది; వాక్యంలోని అసలు షరతు ‘చూడకపోతే’తో ముగుస్తుంది.
- source_word: יִתֵּן
  choice: అప్పగించినప్పుడు
  rationale: נתן ప్రాథమికంగా ‘ఇవ్వడం’ అయినా, కాపాడే ఉద్దేశంతో మరొకరి సంరక్షణకు ఇవ్వడం ఇక్కడి న్యాయసందర్భం. అందువల్ల ‘అప్పగించు’ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ ఏకవచన పుంలింగ రూపాన్ని నిలుపుతూ, సాధారణ న్యాయ ఉదాహరణలోని వ్యక్తిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: אֶל רֵעֵהוּ
  choice: తన పొరుగువానికి
  rationale: רֵעַ సామాజికంగా సమీపంలోని తోటి వ్యక్తిని సూచిస్తుంది. ‘పొరుగువాడు’ ఈ న్యాయసందర్భంలో సుపరిచితమైన, అతిగా సన్నిహితత్వాన్ని సూచించని పదం.
- source_word: חֲמוֹר
  choice: గాడిద
  rationale: ఆధునిక తెలుగులో స్పష్టమైన సాధారణ సమానార్థకం.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: పశుసంపదకు సంబంధించిన న్యాయసందర్భంలో שׁוֹרకు సహజమైన తెలుగు సమానార్థకం.
- source_word: שֶׂה
  choice: గొర్రె
  rationale: సందర్భంలో ఒక మంద జంతువును ప్రత్యేక ఉదాహరణగా చూపేందుకు ‘గొర్రె’ సహజం. ఈ హీబ్రూ పదం మేకను కూడా సూచించగల విస్తృతార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְכָל בְּהֵמָה
  choice: మరే పెంపుడు జంతువునైనా
  rationale: בְּהֵמָה ఇక్కడ మనిషి ఆధీనంలోని జంతు ఆస్తిని సాధారణంగా సూచిస్తుంది. ‘పెంపుడు జంతువు’ అడవి జంతువు అనే అపార్థాన్ని నివారిస్తూ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: לִשְׁמֹר
  choice: కాపాడమని
  rationale: జంతువును మరొకరి సంరక్షణలో ఉంచిన ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּמֵת
  choice: అది చనిపోయినా
  rationale: న్యాయ ఉదాహరణలో సంభవించగల మొదటి పరిణామాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: נִשְׁבַּר
  choice: గాయపడినా
  rationale: నిఫల్ రూపం అక్షరార్థంగా ‘విరిగిపోవడం.’ జంతువు విషయంలో ‘గాయపడడం’ సహజమైన తెలుగు; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נִשְׁבָּה
  choice: అపహరించబడినా
  rationale: שׁבה నిఫల్ రూపం పట్టుకుపోవడం లేదా బలవంతంగా తీసుకుపోవడాన్ని సూచిస్తుంది. ‘అపహరించబడడం’ కేవలం సాధారణ దొంగతనానికే పరిమితం చేయకుండా ఆ విస్తృతిని నిలుపుతుంది.
- source_word: אֵין רֹאֶה
  choice: జరిగినదాన్ని ఎవరూ చూడకపోతే
  rationale: హీబ్రూలోని ‘చూసేవాడు లేడు’ అనే భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో ఇస్తుంది; ప్రత్యక్ష సాక్షి లేడనే న్యాయపరమైన ఉద్దేశాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
