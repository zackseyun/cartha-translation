id: EXO.22.27
reference: Exodus 22:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: te
  text: నీవు దేవుణ్ణి[a] దూషించకూడదు; నీ ప్రజల మధ్యనున్న పాలకుణ్ణి శపించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయాధిపతులను’; אֱלֹהִים అనే పదం కొన్ని సందర్భాల్లో మానవ అధికారులను సూచించగలదు. అయితే ఇక్కడి సమాంతర నిర్మాణానికి ‘దేవుడు’ అనే అర్థమే బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఈ న్యాయసందర్భంలోనూ, సమాంతరంగా మానవ పాలకుని ప్రస్తావించడంలోనూ ఏకవచన భావమైన ‘దేవుడు’ బాగా సరిపోతుంది. అయితే ఈ పదానికి కొన్ని సందర్భాల్లో ‘న్యాయాధిపతులు’ అనే అర్థం ఉండగలదు కాబట్టి దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: תְקַלֵּל
  choice: దూషించకూడదు
  rationale: קלל పియేల్ రూపం శపించడం, అవమానించడం, తృణీకరించడం వంటి భావాలను ఇవ్వగలదు. రెండో భాగంలోని ארר (‘శపించు’)తో ఉన్న పదభేదాన్ని నిలుపుతూ, అవమానకరమైన మాటలను సహజమైన తెలుగులో ‘దూషించు’ తెలియజేస్తుంది.
- source_word: נָשִׂיא
  choice: పాలకుణ్ణి
  rationale: నాయకత్వం లేదా అధికార స్థానంలో ఉన్న వ్యక్తిని సూచించే נָשִׂיאకు ఈ న్యాయసందర్భంలో ‘పాలకుడు’ సహజమైన, విస్తృతమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְעַמְּךָ
  choice: నీ ప్రజల మధ్యనున్న
  rationale: ב ఉపసర్గ ఇక్కడ సమాజంలోని పాలకుణ్ణి సూచిస్తుంది. ‘నీ ప్రజల మధ్యనున్న’ అనేది ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: תָאֹר
  choice: శపించకూడదు
  rationale: ארר శాపం పలకడాన్ని సూచించే సాధారణ హెబ్రీ క్రియ. దానికి ‘శపించు’ ప్రత్యక్షమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: אֱלֹהִים పదం ఎవరిని సూచిస్తుంది?
  choice: దేవుడు
  alternative: న్యాయాధిపతులు; దేవతలు
  rationale: తక్షణ న్యాయసందర్భం మరియు ‘నీ ప్రజల మధ్యనున్న పాలకుడు’ అనే సమాంతర వాక్యభాగం ఇక్కడ אֱלֹהִיםను ‘దేవుడు’గా అర్థం చేసుకోవడానికి అనుకూలంగా ఉన్నాయి. అయినా ‘న్యాయాధిపతులు’ అనే చారిత్రకంగా ప్రాముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపి అసలు పదంలోని అర్థసాధ్యతను సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలి వాడబడింది. రెండు హెబ్రీ క్రియల మధ్యనున్న భావభేదాన్ని ‘దూషించు’ మరియు ‘శపించు’తో నిలిపాం; ‘రాజు/యువరాజు’ వంటి సంకుచిత పదాలకు బదులు విస్తృత అధికారార్థకమైన ‘పాలకుడు’ ఎంచుకున్నాం.
