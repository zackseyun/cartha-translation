id: EXO.22.2
reference: Exodus 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: te
  text: అయితే దొంగపై సూర్యుడు ఉదయించి ఉంటే[a], అతన్ని చంపినవాడికి రక్తాపరాధం ఉంటుంది.[b] దొంగ తప్పకుండా నష్టపరిహారం చెల్లించాలి. చెల్లించడానికి అతనికి ఏమీ లేకపోతే[c], అతడు చేసిన దొంగతనానికి అతన్ని అమ్మాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః, “అతని మీద సూర్యుడు ఉదయించి ఉంటే.” భావం: సూర్యోదయం తరువాత లేదా పగటివేళ ఇది జరిగితే.'
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఈ పరిస్థితిలో దొంగను చంపిన వ్యక్తికి రక్తాపరాధం ఉంటుంది. హీబ్రూ వాక్యం సంక్షిప్తంగా, పదశః “అతనికి రక్తాపరాధం ఉంది” అని ఉంటుంది.
    reason: alternative_reading
  - marker: c
    text: దొంగకు నష్టపరిహారం చెల్లించే స్తోమత లేనప్పుడు, ఆ పరిహార బాధ్యత తీర్చడానికి అతన్ని సేవకత్వానికి అమ్మడం ఇక్కడ చెప్పబడిన న్యాయపరిహారం.
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: అయితే దొంగ మీద సూర్యుడు ఉదయించి ఉంటే
  rationale: మునుపటి వచనంలోని రాత్రివేళ పరిస్థితికి విరుద్ధమైన షరతును ‘అయితే’ స్పష్టం చేస్తుంది. ‘దొంగ మీద సూర్యుడు ఉదయించడం’ అనే హీబ్రూ రూపకల్పనను నిలిపి, עָלָיו సూచించే వ్యక్తిని సందర్భానుసారంగా ‘దొంగ’ అని స్పష్టం చేశాం.
- source_word: דָּמִים לוֹ
  choice: అతన్ని చంపినవాడు రక్తాపరాధి అవుతాడు
  rationale: న్యాయసంబంధ సందర్భంలో דָּמִים రక్తం చిందించినందుకు కలిగే దోషబాధ్యతను సూచిస్తుంది. హీబ్రూలోని సర్వనామ సూచనలో ఉండే అస్పష్టతను పాదటిప్పణిలో తెలియజేస్తూ, సందర్భానికి సరిపోయే సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగులో ఇచ్చాం.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: తప్పకుండా నష్టపరిహారం చెల్లించాలి
  rationale: క్రియాధాతురూపం మరియు అసంపూర్ణ క్రియ కలయిక బాధ్యతను బలపరుస్తుంది. దొంగతనానికి జరిగిన నష్టాన్ని భర్తీ చేయడమే సందర్భం కాబట్టి ‘నష్టపరిహారం చెల్లించాలి’ అని అనువదించాం.
- source_word: אִם אֵין לוֹ
  choice: చెల్లించడానికి అతని దగ్గర ఏమీ లేకపోతే
  rationale: తిరిగి చెల్లించేందుకు అవసరమైన ఆస్తి లేదా సాధనాలు లేని స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: అతని దొంగతనం నిమిత్తం అతన్ని అమ్మాలి
  rationale: హీబ్రూ నిష్క్రియ న్యాయనిర్దేశాన్ని నిలిపి, అమ్మకం అతని దొంగతనంతో ఏర్పడిన పరిహార బాధ్యతకు సంబంధించినదని స్పష్టం చేశాం.
theological_decisions:
- issue: పగటివేళ దొంగను చంపడంవల్ల కలిగే రక్తాపరాధం
  choice: సూర్యోదయం తరువాత దొంగను చంపిన వ్యక్తి రక్తాపరాధి అవుతాడని ప్రధాన పాఠ్యం తెలియజేస్తుంది.
  alternative: ఈ మాటలను కేవలం సమయభేదంగా కాక, ప్రమాదం స్పష్టంగా ఉందా లేదా అనే విస్తృత న్యాయసూత్రంగా అర్థం చేసుకోవచ్చు.
  rationale: మూలపాఠ్యం సూర్యుడు ఉదయించడాన్ని ప్రత్యక్షంగా ప్రస్తావిస్తుంది. అందువల్ల ఆ దృశ్యాన్ని నిలిపి, పాఠ్యంలో లేని విస్తృత నైతిక సూత్రాన్ని జోడించలేదు.
- issue: דָּמִים לוֹ లోని సర్వనామ సూచన
  choice: సందర్భానుసారంగా రక్తాపరాధం దొంగను చంపినవానికి చెందుతుందని అనువదించాం.
  alternative: పదశః ‘అతనికి రక్తాలు ఉన్నాయి’ లేదా ‘అతనిమీద రక్తాపరాధం ఉంది’ అని ఉంచవచ్చు; అయితే ‘అతను’ ఎవరనే విషయం తెలుగులో అస్పష్టంగా ఉంటుంది.
  rationale: మునుపటి వచనంలోని హంతకుడి న్యాయబాధ్యతతో ఉన్న వ్యత్యాసం ఈ సూచనను బలపరుస్తుంది. అయినప్పటికీ మూలంలోని సంక్షిప్తతను పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘రక్తాపరాధి,’ ‘నష్టపరిహారం’ వంటి పదాలు మూలంలోని న్యాయపరమైన తీవ్రతను నిలుపుతాయి. ప్రధాన పాఠ్యంలో దొంగ మరియు అతన్ని చంపినవాడి సూచనలను స్పష్టం చేశాం; మూలంలోని పదశః రూపం, సర్వనామ సంక్షిప్తత పాదటిప్పణుల్లో భద్రపరచబడ్డాయి.
