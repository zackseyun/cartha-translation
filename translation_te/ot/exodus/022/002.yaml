    rationale: బִּגְנֵבָתוֹ యొక్క ‘అతడు చేసిన దొంగతనానికి/కారణంగా’ అనే న్యాయసంబంధ భావాన్ని ‘అతడు చేసిన దొంగతనానికి’ మరింత సహజంగా తెలుపుతుంది.
