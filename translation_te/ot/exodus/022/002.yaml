revisions:
- from: అయితే దొంగ మీద సూర్యుడు ఉదయించి ఉంటే[a], అతన్ని చంపినవాడు రక్తాపరాధి అవుతాడు.[b] దొంగ తప్పకుండా నష్టపరిహారం చెల్లించాలి. చెల్లించడానికి అతని దగ్గర ఏమీ లేకపోతే[c], అతని దొంగతనం నిమిత్తం అతన్ని అమ్మాలి.
  to: అయితే దొంగపై సూర్యుడు ఉదయించి ఉంటే[a], అతన్ని చంపినవాడికి రక్తాపరాధం ఉంటుంది.[b] దొంగ తప్పకుండా నష్టపరిహారం చెల్లించాలి. చెల్లించడానికి అతనికి ఏమీ లేకపోతే[c], అతడు చేసిన దొంగతనానికి అతన్ని అమ్మాలి.
  rationale: సందర్భం నిర్ణయించే న్యాయార్థాన్ని మార్చకుండా, రక్తాపరాధానికి సంబంధించిన హీబ్రూ నుడికారాన్ని కొద్దిగా సమీపంగా చేశాం; అలాగే అమ్మకానికి కారణమైన దొంగతనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేశాం. మూలంలోని సంక్షిప్త సర్వనామ ప్రయోగం పాదటిప్పణిలో భద్రపరచబడింది.
