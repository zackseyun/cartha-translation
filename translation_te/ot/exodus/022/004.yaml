source:
  edition: WLC
  text: כִּ֤י יַבְעֶר אִישׁ֙ שָׂדֶ֣ה אוֹ כֶ֔רֶם וְ/שִׁלַּח֙ אֶת בעיר/ה וּ/בִעֵ֖ר בִּ/שְׂדֵ֣ה אַחֵ֑ר מֵיטַ֥ב שָׂדֵ֛/הוּ וּ/מֵיטַ֥ב כַּרְמ֖/וֹ יְשַׁלֵּֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: te
  text: ఒకడు తన పశువును పొలంలోనో ద్రాక్షతోటలోనో మేయనిచ్చి[a], దానిని వదిలివేయగా అది వేరొకరి పొలంలో మేస్తే[b], అతడు తన సొంత పొలంలోని శ్రేష్ఠమైన భాగం నుండి, తన సొంత ద్రాక్షతోటలోని శ్రేష్ఠమైన భాగం నుండి నష్టపరిహారం చెల్లించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకడు పొలాన్నో ద్రాక్షతోటనో కాల్చితే.’ హీబ్రూ క్రియ בער కొన్ని సందర్భాల్లో కాల్చడాన్ని సూచించగలదు. అయితే వెంటనే అతడు తన పశువును వదలిపెట్టడం ప్రస్తావించబడినందున, ఇక్కడ పశువుతో మేయించి తినిపించడం అనే భావమే బలంగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘వేరొక పొలంలో’; న్యాయసందర్భంలో అది వేరొకరికి చెందిన పొలమని తెలుగులో స్పష్టం చేయబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఒకడు ... మేస్తే
  rationale: న్యాయసూత్రంలోని షరతును తెలుగులో సహజమైన ‘-తే’ రూపంతో వ్యక్తం చేశాం.
- source_word: יַבְעֶר
  choice: తన పశువుతో మేపించి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, తరువాత పశువును వదలిపెట్టడం ప్రస్తావించబడినందున మేత మేయించి తినిపించడం అనే భావాన్ని ఎంచుకున్నాం.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: పొలాన్నో ద్రాక్షతోటనో
  rationale: వ్యవసాయ పదాలను ఏకవచనంలో ఉంచి, తెలుగు ప్రత్యామ్నాయ నిర్మాణాన్ని సహజంగా వాడాం.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: దానిని వదలిపెట్టి
  rationale: పశువును అదుపు లేకుండా విడిచిపెట్టే న్యాయసందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: בְּעִירֹה
  choice: తన పశువు
  rationale: ఏకవచన ప్రత్యయంతో ఉన్న సాధారణ పశువును ‘పశువు’ అని స్పష్టంగా అనువదించాం.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: అది వేరొకరి పొలంలో మేస్తే
  rationale: పునరావృతమైన בערను పశువు మేయడం అనే భావంలో తీసుకుని, నష్టం ఇతరుని పొలానికి జరిగినదని సందర్భానుసారంగా స్పష్టం చేశాం.
- source_word: אַחֵר
  choice: వేరొకరి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వేరొక’ ఉన్నా, ఆ పొలం మరొక వ్యక్తికి చెందినదనే న్యాయార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: తన సొంత పొలంలోని శ్రేష్ఠమైన భాగం నుండీ, తన సొంత ద్రాక్షతోటలోని శ్రేష్ఠమైన భాగం నుండీ
  rationale: מֵיטַבలోని అత్యుత్తమమైన లేదా మేలైన భాగం అనే భావాన్ని, పరిహారం అపరాధి ఆస్తి నుండే రావాలనే విషయాన్ని స్పష్టంగా నిలిపాం.
- source_word: יְשַׁלֵּם
  choice: నష్టపరిహారం చెల్లించాలి
  rationale: పీయేల్ రూపంలోని పరిహార చెల్లింపు అనే న్యాయబలాన్ని సాధారణ ఆధునిక తెలుగులో తెలిపింది.
