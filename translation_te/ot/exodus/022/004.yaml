translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘నష్టపరిహారం చెల్లించాలి’ ద్వారా ఆజ్ఞాత్మక న్యాయబలం నిలుపబడింది; בערలోని ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
