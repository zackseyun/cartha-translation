revisions:
- from: మీ మధ్య నివసించే పరదేశిని[a] అన్యాయంగా చూడకూడదు; అతణ్ణి అణచివేయకూడదు. ఎందుకంటే ఐగుప్తు దేశంలో మీరు కూడా పరదేశులుగా ఉన్నారు.
  to: పరదేశికి[a] అన్యాయం చేయకూడదు; అతణ్ణి అణచివేయకూడదు. ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశులుగా ఉన్నారు.
  rationale: The revision removes the unstated phrase “మీ మధ్య నివసించే” from the main text while retaining the resident-non-native nuance in the footnote. It also replaces a less natural idiom with “పరదేశికి అన్యాయం చేయకూడదు,” preserving the broad wrongful-treatment sense of the first Hebrew verb. The singular masculine legal formulation, the contrast with oppression, the causal force, and “the land of Egypt” are retained.
