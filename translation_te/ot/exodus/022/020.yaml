source:
  edition: WLC
  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: te
  text: పరదేశికి[a] అన్యాయం చేయకూడదు; అతణ్ణి అణచివేయకూడదు. ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశులుగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పరదేశి’ అంటే ఇక్కడ కేవలం దారిన పోయే అపరిచితుడు కాదు; ఇశ్రాయేలు ప్రజల మధ్య నివసించే స్థానికేతరుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: మీ మధ్య నివసించే పరదేశి / పరదేశులు
  rationale: గేర్ అనేది కేవలం దారిన పోయే అపరిచితుణ్ణి కాకుండా, ఇశ్రాయేలు ప్రజల మధ్య నివసించే స్థానికేతరుణ్ణి సూచిస్తుంది. మొదటి చోట వివరణాత్మకంగా చెప్పి, రెండవ చోట అదే కీలక పదాన్ని సహజంగా పునరావృతం చేశాం.
- source_word: תוֹנֶה
  choice: అన్యాయంగా చూడకూడదు
  rationale: హిఫీల్ రూపంలోని ינה విస్తృతంగా అన్యాయం చేయడం లేదా చెడుగా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది; దీనిని కేవలం ఆర్థిక దోపిడికే పరిమితం చేయకుండా ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: תִלְחָצֶנּוּ
  choice: అతణ్ణి అణచివేయకూడదు
  rationale: לחץ ఇక్కడ కఠిన ఒత్తిడి లేదా పీడనను సూచిస్తుంది. తెలుగు న్యాయసందర్భంలో ‘అణచివేయడం’ ఆ బరువును సహజంగా వ్యక్తం చేస్తుంది; ఏకవచన పుంలింగ ప్రత్యయం ‘అతణ్ణి’గా నిలుపబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే హేతుబోధక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: הֱיִיתֶם
  choice: మీరు ... ఉన్నారు
  rationale: ఐగుప్తులో ఇశ్రాయేలీయుల గత స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశంలో
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: ఏకవచన పుంలింగ సూచనను సాధారణ న్యాయవర్గంగా అనువదించడం
  choice: ‘పరదేశిని ... అతణ్ణి’ అనే ఏకవచన పుంలింగ రూపాలను నిలుపడం
  alternative: ‘పరదేశులను ... వారిని’ అని బహువచనంగా మార్చడం
  rationale: హీబ్రూ వాక్యం ఏకవచన גֵר మరియు మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయాన్ని సాధారణ న్యాయవర్గంగా ఉపయోగిస్తుంది. మూలరూపాన్ని మార్చకుండా తెలుగులో కూడా ఆ నిర్మాణాన్ని నిలిపాం.
- issue: గేర్ అనే సామాజిక స్థితి యొక్క పరిధి
  choice: స్థానికేతరుడై సమాజం మధ్య నివసించే వ్యక్తిగా అర్థాన్ని చూపడం
  alternative: ఏ అపరిచితుడినైనా లేదా తాత్కాలిక ప్రయాణికుడినైనా సూచించేలా ‘అన్యుడు’ అని మాత్రమే అనువదించడం
  rationale: ఈ పదం ఇశ్రాయేలు మధ్య నివసించే రక్షణావసరమున్న స్థానికేతరుణ్ణి సూచిస్తుంది. దాని సామాజిక-న్యాయ భావాన్ని పాదసూచికలో స్పష్టం చేశాం; అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలిని అనుసరించాం. ‘కూడదు’ అనే రూపం నిషేధాజ్ఞను సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని రెండు సమీపార్థక క్రియల మధ్య తేడాను ‘అన్యాయంగా చూడడం’ మరియు ‘అణచివేయడం’గా నిలిపాం.
