review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the two prohibitions, the singular masculine reference, the causal clause, and Israel''s former status in Egypt. However, “మీ మధ్య నివసించే” (“living among you”) is an interpretive expansion: the Hebrew text itself says only גֵר, without an explicit “among you” phrase. The resident status may be supplied in the footnote rather than inserted into the verse text.'
  naturalness: “పరదేశిని అన్యాయంగా చూడకూడదు” is understandable, but “పరదేశికి అన్యాయం చేయకూడదు” is more idiomatic modern Telugu for wrongful treatment. “అతణ్ణి అణచివేయకూడదు” is natural and suitably preserves the stronger second verb.
  terminology: “పరదేశి” is an acceptable rendering of גֵר when qualified by a footnote to prevent it from being understood merely as a traveler or unknown outsider. The revision retains the same term in singular and plural, preserving the Hebrew lexical repetition.
  issues:
  - severity: medium
    issue: The phrase “మీ మధ్య నివసించే” adds wording not explicitly present in the Hebrew verse.
    rationale: Although גֵר commonly denotes a non-native resident, the immediate Hebrew text does not state “among you.” This contextual element belongs in the lexical footnote, allowing the verse itself to remain appropriately concise.
  - severity: low
    issue: “అన్యాయంగా చూడకూడదు” is less idiomatic than “అన్యాయం చేయకూడదు.”
    rationale: The revised wording communicates wrongful treatment more directly in modern standard Telugu, without narrowing the broad sense of תוֹנֶה to a particular form of exploitation.
  revised_text: పరదేశికి[a] అన్యాయం చేయకూడదు; అతణ్ణి అణచివేయకూడదు. ఎందుకంటే ఐగుప్తు దేశంలో మీరు పరదేశులుగా ఉన్నారు.
