translation:
  language: te
  text: మంత్రవిద్య చేసే స్త్రీని బతకనివ్వకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మంత్రగత్తెను.’ హీబ్రూ నామవాచకం స్త్రీలింగ ఏకవచనంలో ఉండి, ప్రత్యేకంగా మంత్రవిద్య చేసే స్త్రీని సూచిస్తుంది.
