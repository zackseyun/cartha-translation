lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: మంత్రవిద్య చేసే స్త్రీ
  rationale: హీబ్రూ నామవాచకం స్త్రీలింగ ఏకవచనంలో ఉండి, మంత్రవిద్యను అభ్యసించే స్త్రీని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, మూలంలోని లింగ నిర్దిష్టతను నిలుపుతూ వివరణాత్మకంగా అనువదించబడింది.
- source_word: לֹא
  choice: కూడదు
  rationale: న్యాయపరమైన నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: תְחַיֶּה
  choice: బతకనివ్వ
  rationale: חיה ధాతువు పియేల్ రూపానికి ఇక్కడ ‘బతకనివ్వు/ప్రాణాలతో ఉంచు’ అనే కారక భావం ఉంది. మూలంలోని నేరుగా ఉన్న నిషేధాన్ని కాపాడుతూ, ‘చంపాలి’ అనే మరింత వ్యాఖ్యానాత్మక న్యాయసూత్రాన్ని చేర్చలేదు.
theological_decisions:
- issue: అపరాధి లింగాన్ని నిర్దిష్టంగా అనువదించడం
  choice: స్త్రీలింగ ఏకవచనాన్ని ‘మంత్రవిద్య చేసే స్త్రీ’గా నిలుపడం
  alternative: ‘మంత్రగాడు’ లేదా ‘మంత్రవిద్య చేసేవారు’ అని లింగతటస్థంగా అనువదించడం
  rationale: మూల హీబ్రూ రూపం స్పష్టంగా స్త్రీలింగ ఏకవచనం; దానిని సాధారణీకరించకుండా మూలంలోని గుర్తింపును నిలిపాం.
- issue: న్యాయ నిషేధపు బలం
  choice: ‘బతకనివ్వకూడదు’ అని అనువదించడం
  alternative: ‘ఆమెను చంపాలి’ అని మరింత స్పష్టమైన మరణశిక్ష సూత్రంగా అనువదించడం
  rationale: సందర్భంలో మరణశిక్ష భావం ఉన్నప్పటికీ, హీబ్రూ వాక్యం అక్షరార్థంగా ‘బతకనివ్వకూడదు/ప్రాణాలతో ఉంచకూడదు’ అని చెబుతుంది. కాబట్టి మూలంలో లేని అమలు విధానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. ‘మంత్రగత్తె’ అనే సంక్షిప్త ప్రత్యామ్నాయానికి ఉండగల జానపద లేదా అవమానార్థ ఛాయలను ప్రధాన పాఠ్యంలో నివారించి, దానిని పాదటిప్పణిలో ఇచ్చాం.
