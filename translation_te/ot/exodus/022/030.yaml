  naturalness: ‘మీరు నాకు పరిశుద్ధులైన మనుషులుగా ఉండాలి’ ఆధునిక ప్రామాణిక తెలుగులో అర్థవంతంగా, గౌరవభరితంగా ఉంది. ‘దానిని కుక్కకు విసిరేయాలి’ అనేది ఆజ్ఞా/న్యాయశైలిని నిలుపుతూ మూలంలోని ప్రత్యక్ష పారవేత చర్యను స్పష్టంగా చెబుతుంది.
