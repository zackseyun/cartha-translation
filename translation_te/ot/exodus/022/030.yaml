source:
  edition: WLC
  text: וְ/אַנְשֵׁי קֹ֖דֶשׁ תִּהְי֣וּ/ן לִ֑/י וּ/בָשָׂ֨ר בַּ/שָּׂדֶ֤ה טְרֵפָה֙ לֹ֣א תֹאכֵ֔לוּ לַ/כֶּ֖לֶב תַּשְׁלִכ֥וּ/ן אֹתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: te
  text: మీరు నాకు పరిశుద్ధులైన మనుషులుగా ఉండాలి.[a] పొలంలో చీల్చబడిన మాంసాన్ని[b] తినకూడదు; దానిని కుక్కకు విసిరేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పరిశుద్ధతకు చెందిన మనుషులు.’ ఈ పదబంధం వ్యాకరణపరంగా పుంలింగ బహువచనంలో ఉంది; సందర్భంలో ఇది నిబంధన సమాజాన్ని ప్రతినిధిగా సూచిస్తూ ‘పరిశుద్ధ ప్రజలు’ అనే భావంలోనూ పనిచేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ‘పొలంలో మృగాలు చీల్చివేసిన మాంసం.’ హీబ్రూ పాఠం కర్తను స్పష్టంగా పేర్కొనకుండా ‘చీల్చబడిన మాంసం’ అని మాత్రమే చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: పరిశుద్ధులైన మనుషులు
  rationale: ఈ నిర్మాణ పదబంధానికి అక్షరార్థంగా ‘పరిశుద్ధతకు చెందిన మనుషులు/పరిశుద్ధ మనుషులు’ అనే భావం ఉంది. ‘పరిశుద్ధులైన మనుషులు’ మూలంలోని వ్యక్తులను సూచించే నామవాచక రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది; ఇది సమస్త నిబంధన సమాజాన్ని ప్రతినిధిగా సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: תִּהְיוּן לִי
  choice: మీరు నాకు ... ఉండాలి
  rationale: היה క్రియతో לִי కలయిక దేవునితో సంబంధమైన స్థితిని, బాధ్యతను తెలియజేస్తుంది. ‘నాకు ... ఉండాలి’ ఆ సంబంధ బలాన్ని సహజమైన తెలుగు న్యాయశైలిలో వ్యక్తం చేస్తుంది.
- source_word: בָשָׂר
  choice: మాంసం
  rationale: తెలుగులో ఆహార నియమ సందర్భంలో ‘మాంసం’ సహజమైనదీ స్పష్టమైనదీ; ‘శరీరం’ లేదా ‘దేహం’ ఇక్కడ అనవసరమైన అస్పష్టత కలిగిస్తాయి.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: స్థలాన్ని సూచించే שָׂדֶה పదానికి ‘పొలంలో’ నేరమైన సమానార్థకం. సందర్భానుసారం ఇది బహిరంగ ప్రదేశం లేదా మైదానం అనే విస్తృత భావాన్నీ కలిగి ఉండవచ్చు.
- source_word: טְרֵפָה
  choice: చీల్చివేయబడిన
  rationale: ఈ పదం సాధారణంగా జంతువు చేత చీల్చబడిన ఎరను లేదా కళేబరాన్ని సూచిస్తుంది. అయితే చీల్చిన కర్త మూలపాఠంలో స్పష్టంగా చెప్పబడలేదు కాబట్టి, ప్రధాన పాఠంలో కర్తను చేర్చకుండా కర్మణి రూపం వాడబడింది.
- source_word: לֹא תֹאכֵלוּ
  choice: తినకూడదు
  rationale: ఇది నిషేధాజ్ఞ. ‘తినకూడదు’ ఆధునిక తెలుగు న్యాయ/ఆజ్ఞా శైలిలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַכֶּלֶב
  choice: కుక్కకు
  rationale: హీబ్రూ పదం ఏకవచనంలో ఉంది. తెలుగులోనూ ఏకవచనం జాతిని సాధారణంగా సూచించగలదు కాబట్టి మూలరూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: దాన్ని ... పారవేయాలి
  rationale: שלך అంటే విసరడం లేదా పారవేయడం. తినరాని మాంసాన్ని తొలగించే ఈ సందర్భంలో ‘పారవేయాలి’ ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: నిబంధన ధర్మశాస్త్రంలోని పరిశుద్ధత భాష
  choice: ‘మీరు నాకు పరిశుద్ధులైన మనుషులుగా ఉండాలి’ అని అనువదించడం
  alternative: ‘మీరు నాకు పరిశుద్ధ ప్రజలుగా ఉండాలి’ లేదా ‘మీరు నాకు ప్రతిష్ఠించబడినవారిగా ఉండాలి’
  rationale: ఈ ఆహార నిషేధాన్ని దేవునికి చెందిన పరిశుద్ధ స్థితితో వాక్యం అనుసంధానిస్తుంది. ‘పరిశుద్ధ’ అనే పదం קֹדֶשׁ లోని నైతిక, ఆరాధనాత్మక, సంబంధపరమైన విస్తృతిని నిలుపుతుంది; ‘ప్రతిష్ఠించబడిన’ అనేది దాని భావాన్ని అనవసరంగా కుదిస్తుంది. మూలంలోని אַנְשֵׁי అనే వ్యక్తి-సూచక రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది నిబంధన సమాజాన్ని ప్రతినిధిగా సూచించవచ్చనే అంశాన్ని పాదటిప్పణిలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, స్పష్టమైన ధర్మశాస్త్ర శైలి వాడబడింది. ‘ఉండాలి,’ ‘తినకూడదు,’ ‘పారవేయాలి’ రూపాలు పాతకాలపు క్రియారూపాలను నివారిస్తూ ఆజ్ఞా బలాన్ని నిలుపుతాయి. మూలంలోని పుంలింగ వ్యక్తి-సూచనను ‘మనుషులు’ ద్వారా చూపించి, సమాజమంతటినీ సూచించే సాధ్యతను పాదటిప్పణిలో సంరక్షించాం.
