  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יִתֵּן֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ כֶּ֤סֶף אֽוֹ כֵלִים֙ לִ/שְׁמֹ֔ר וְ/גֻנַּ֖ב מִ/בֵּ֣ית הָ/אִ֑ישׁ אִם יִמָּצֵ֥א הַ/גַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: te
  text: ఒక మనిషి తన పొరుగువానికి భద్రపరచమని డబ్బుగానీ వస్తువులుగానీ ఇస్తే, అవి ఆ మనిషి ఇంటి నుండి దొంగిలించబడితే, దొంగ దొరికితే అతడు రెండింతలు చెల్లించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “రెండింతలు తిరిగి చెల్లించాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఇచ్చినప్పుడు
  rationale: న్యాయవిధి సందర్భంలో ఇది ఒక పరిస్థితిని ప్రవేశపెడుతుంది. తెలుగులో ‘ఇచ్చినప్పుడు’ సహజమైన షరతార్థక ప్రయోగం.
- source_word: יִתֵּן אִישׁ
  choice: ఒక మనిషి ... ఇచ్చినప్పుడు
  rationale: మూలంలోని ఏకవచన పుంలింగ న్యాయశైలిని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אֶל רֵעֵהוּ
  choice: తన పొరుగువాని దగ్గర
  rationale: చట్టపరమైన ఈ సందర్భంలో רֵעַ సమాజంలోని తోటి వ్యక్తిని సూచిస్తుంది; ‘పొరుగువాడు’ విస్తృతంగా అర్థమయ్యే సంప్రదాయబద్ధమైన ఎంపిక.
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: పదశః ‘వెండి’ అయినా, ఇక్కడ ఆర్థిక లావాదేవీ సందర్భంలో డబ్బును సూచిస్తుంది.
- source_word: אוֹ כֵלִים
  choice: వస్తువులు
  rationale: כֵלִים అనేది పాత్రలు లేదా పనిముట్లకే పరిమితం కాని విస్తృత పదం; ‘వస్తువులు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: לִשְׁמֹר
  choice: భద్రపరచడానికి
  rationale: అప్పగించిన ఆస్తిని కాపాడి ఉంచే ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְגֻנַּב
  choice: దొంగిలించబడితే
  rationale: మూలంలోని కర్మణి రూపాన్ని, షరతుతో కూడిన న్యాయవిధి నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מִבֵּית הָאִישׁ
  choice: ఆ మనిషి ఇంట్లోనుంచి
  rationale: ఇది వస్తువులను భద్రపరచడానికి స్వీకరించిన మనిషి ఇంటిని సూచిస్తుంది; ‘ఆ మనిషి’ ఆ సూచనను స్పష్టం చేస్తుంది.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: దొంగ దొరికిన పక్షంలో
  rationale: מצא నిఫాల్ రూపంలోని పదశః ‘దొరకడం’ భావాన్ని కాపాడుతుంది; ‘పట్టుబడితే’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: అతడు రెండింతలు చెల్లించాలి
  rationale: రెట్టింపు పరిహారం చెల్లించాలనే న్యాయార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; సందర్భంలో కర్త దొంగ.
