revisions:
- from: ఒక మనిషి తన పొరుగువాని దగ్గర భద్రపరచడానికి డబ్బుగానీ వస్తువులుగానీ ఇచ్చినప్పుడు, అవి ఆ మనిషి ఇంట్లోనుంచి దొంగిలించబడితే, దొంగ దొరికిన పక్షంలో అతడు రెండింతలు చెల్లించాలి.[a]
  to: ఒక మనిషి తన పొరుగువానికి భద్రపరచమని డబ్బుగానీ వస్తువులుగానీ ఇస్తే, అవి ఆ మనిషి ఇంటి నుండి దొంగిలించబడితే, దొంగ దొరికితే అతడు రెండింతలు చెల్లించాలి.[a]
  rationale: The revision restores the conditional force of the Hebrew legal case and makes the purpose of the deposit idiomatic in Telugu. It retains the draft's accurate broad renderings for money and goods, the passive theft clause, and the contextual identification of the thief as the one who must make double repayment. The existing footnote remains compatible with the translated legal sense and its marker remains correctly anchored.
