translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయశైలి. ‘డబ్బు’, ‘వస్తువులు’ అనే విస్తృత పదాలు సందర్భార్థాన్ని అందిస్తాయి. ప్రధాన వాక్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
