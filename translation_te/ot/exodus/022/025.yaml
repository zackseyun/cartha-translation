id: EXO.22.25
reference: Exodus 22:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם חָבֹ֥ל תַּחְבֹּ֖ל שַׂלְמַ֣ת רֵעֶ֑/ךָ עַד בֹּ֥א הַ/שֶּׁ֖מֶשׁ תְּשִׁיבֶ֥/נּוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/025.yaml
  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: te
  text: నీ పొరుగువాని పైవస్త్రాన్ని[a] తాకట్టుగా తీసుకుంటే, సూర్యుడు అస్తమించేలోగా[b] దాన్ని అతనికి తిరిగి ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వస్త్రాన్ని,’ ‘బయటి వస్త్రాన్ని.’ హీబ్రూ పదం రాత్రివేళ చలి నుంచి రక్షణగా కప్పుకోగల బయటి వస్త్రాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సూర్యుడు వచ్చే వరకు’; అంటే సూర్యాస్తమయానికల్లా.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: తీసుకుంటే
  rationale: ఇది షరతుతో కూడిన న్యాయనియమాన్ని పరిచయం చేస్తుంది. తెలుగులో క్రియకు జోడించిన ‘-తే’ రూపం సహజంగా ‘ఒకవేళ’ అనే భావాన్ని తెలియజేస్తుంది.
- source_word: חָבֹל תַּחְבֹּל
  choice: తాకట్టుగా తీసుకుంటే
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ తాకట్టు తీసుకునే న్యాయచర్యను బలంగా వ్యక్తం చేస్తుంది. ఆ పదపునరుక్తిని తెలుగులో యథాతథంగా ఉంచడం అసహజం కాబట్టి, ‘తాకట్టుగా తీసుకోవడం’ అని స్పష్టంగా అనువదించబడింది.
- source_word: שַׂלְמַת
  choice: పైవస్త్రాన్ని
  rationale: ఈ పదం సాధారణ వస్త్రం కంటే, రాత్రివేళ కప్పుకోవడానికి కూడా ఉపయోగపడే బయటి వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ ఆధునిక తెలుగులో స్పష్టమైన, సందర్భోచితమైన పదం.
- source_word: רֵעֶךָ
  choice: నీ పొరుగువాని
  rationale: సామాజిక న్యాయ సందర్భంలో רֵעַ సమీప సమాజానికి చెందిన తోటి వ్యక్తిని సూచిస్తుంది. ‘పొరుగువాడు’ ఈ పరస్పర సంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: సూర్యుడు అస్తమించేలోగా
  rationale: అక్షరార్థంగా ‘సూర్యుడు వచ్చే వరకు’ అనే హీబ్రూ నుడికారం ఈ సందర్భంలో సూర్యాస్తమయాన్ని సూచిస్తుంది. విధించిన గడువును ‘అస్తమించేలోగా’ సహజంగా తెలియజేస్తుంది.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: దాన్ని అతనికి తిరిగి ఇవ్వాలి
  rationale: שׁוב హిఫిల్ రూపం ఒక వస్తువును తిరిగి చేర్చడం లేదా అప్పగించడం అనే భావం ఇస్తుంది. ‘తిరిగి ఇవ్వాలి’ న్యాయబద్ధమైన ఆదేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
