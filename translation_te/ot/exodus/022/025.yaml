translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయనియమ శైలి వాడబడింది. ‘తాకట్టు,’ ‘పైవస్త్రం’ పదాలు న్యాయచర్యను మరియు వస్త్ర స్వభావాన్ని స్పష్టంగా ఉంచుతాయి; మూలంలోని షరతు భావం, తిరిగి ఇవ్వవలసిన బాధ్యత రెండూ సంరక్షించబడ్డాయి.
