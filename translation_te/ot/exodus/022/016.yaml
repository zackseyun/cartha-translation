theological_decisions:
- issue: ‘ఆమెను అతనికి ఇవ్వడం’ అనే పదబంధంలోని వివాహార్థం
  choice: ప్రధాన వచనంలో అక్షరార్థానికి దగ్గరైన పదబంధాన్ని ఉంచి, వివాహార్థాన్ని పాదసూచికలో వివరించడం
  alternative: ‘ఆమెను అతనికి వివాహం చేసి ఇవ్వడానికి’ అని స్పష్టీకరించడం
  rationale: మూలంలోని సంక్షిప్త న్యాయపరమైన పదప్రయోగాన్ని, దాని సందర్భార్థాన్ని ఏకపక్షంగా ప్రధాన వచనంలో విస్తరించకుండా, రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని ఉపయోగించింది. ‘కన్యాశుల్కం’ సాంస్కృతికంగా ప్రత్యేకమైన వివాహ చెల్లింపును ‘కట్నం’తో కలపకుండా సూచిస్తుంది; ‘తూచి ఇవ్వాలి’ మూలంలోని చారిత్రక చెల్లింపు విధానాన్ని నిలుపుతుంది.
