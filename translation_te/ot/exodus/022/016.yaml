  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: te
  text: ఆమె తండ్రి ఆమెను అతనికి ఇవ్వడానికి[b] పూర్తిగా నిరాకరిస్తే, కన్యలకు నిర్ణయించిన కన్యాశుల్కం ప్రకారం అతడు వెండిని తూచి ఇవ్వాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతడు వెండిని తూచాలి.’ నాణేలతో కాక తూకం వేసిన లోహంతో చెల్లించే పద్ధతిని ఇది ప్రతిబింబిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ఆమెను అతనికి వివాహం చేసి ఇవ్వడానికి.’ ‘ఆమెను అతనికి ఇవ్వడం’ అనే హీబ్రూ పదప్రయోగం వివాహానికి తండ్రి సమ్మతిని సూచిస్తుంది.
    reason: lexical_alternative
