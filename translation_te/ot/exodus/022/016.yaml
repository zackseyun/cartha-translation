- source_word: לְתִתָּהּ לוֹ
  choice: ఆమెను అతనికి ఇవ్వడానికి
  rationale: ‘ఆమెను అతనికి ఇవ్వడం’ అనే హీబ్రూ పదప్రయోగాన్ని నిలుపుతూ, వివాహ సంబంధ అర్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఆర్థిక సందర్భంలో ‘డబ్బు’ అనే భావం ఉన్నప్పటికీ, మూలంలోని నిర్దిష్ట లోహార్థాన్ని నిలిపింది.
- source_word: יִשְׁקֹל
  choice: తూచి ఇవ్వాలి
  rationale: నాణేలకన్నా తూకం వేసిన వెండితో చెల్లించే ఆచారాన్ని సూచించే ‘తూచుట’ అనే మూలార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: כְּמֹהַר
  choice: కన్యాశుల్కానికి సమానంగా
  rationale: מֹהַר సూచించే, వధువు కుటుంబానికి ఇచ్చే వివాహ చెల్లింపును సంక్షిప్తంగా తెలియజేస్తుంది; כְ ఇచ్చే ప్రమాణం లేదా సమానత భావాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: הַבְּתוּלֹת
