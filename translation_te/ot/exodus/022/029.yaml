source:
  edition: WLC
  text: כֵּֽן תַּעֲשֶׂ֥ה לְ/שֹׁרְ/ךָ֖ לְ/צֹאנֶ֑/ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם אִמּ֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י תִּתְּנ/וֹ לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: te
  text: 'నీ ఎద్దుకూ, నీ గొర్రెలు-మేకల మందకూ అలాగే చేయాలి: అది ఏడు రోజులు దాని తల్లితో ఉండాలి[a]; ఎనిమిదవ రోజున దాన్ని నాకు ఇవ్వాలి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అది తన తల్లితో ఉండాలి.” సందర్భంలో ఇది ఏడు రోజులపాటు తల్లితో ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ ఆజ్ఞ మునుపటి సందర్భంలోని తొలిచూలు జంతువును అర్పించాలనే ఆజ్ఞకు కొనసాగింపు; ఈ వచనంలో హీబ్రూ పాఠం “తొలిచూలు” అనే మాటను మళ్లీ చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: మునుపటి వచనంలోని ఆజ్ఞతో ఈ నియమానికి ఉన్న సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּעֲשֶׂה
  choice: చేయాలి
  rationale: న్యాయవిధిలోని ఆజ్ఞాత్మక బలాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשֹׁרְךָ
  choice: నీ ఎద్దు విషయంలోనూ
  rationale: లְ ఉపసర్గ ఇక్కడ సంబంధం లేదా వర్తింపును సూచిస్తుంది; שׁוֹר పశువర్గానికి సంబంధించిన పదమైనా, ఈ సందర్భంలో సంప్రదాయబద్ధంగా మరియు సులభంగా అర్థమయ్యే ‘ఎద్దు’ సరిపోతుంది.
- source_word: לְצֹאנְךָ
  choice: నీ గొర్రెలు-మేకల మంద విషయంలోనూ
  rationale: צֹאן గొర్రెలు, మేకలు కలిగిన చిన్న పశువుల మందను సూచించే సమూహవాచకం; ‘గొర్రెలు-మేకల మంద’ దాని పరిధిని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: అది ఏడు రోజులు దాని తల్లితో ఉండాలి
  rationale: హీబ్రూ వాక్యంలోని అక్షరార్థమైన ‘తల్లితో ఉండాలి’ అనే భావాన్నీ, ఏడు రోజుల వ్యవధినీ నేరుగా కాపాడుతుంది; ‘ఉంచాలి’ అని మార్చి కర్తను స్పష్టీకరించదు.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: కాలసూచక పదబంధానికి సహజమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: תִּתְּנוֹ לִי
  choice: దాన్ని నాకు ఇవ్వాలి
  rationale: נתן యొక్క సాధారణ ‘ఇవ్వు’ అర్థాన్ని, దేవుని ప్రత్యక్ష వాక్యంలోని ‘నాకు’ అనే సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ఈ ఆజ్ఞలో ప్రథమ సంతాన జంతువు అనే సూచన
  choice: ప్రధాన వచనంలో ‘మొదటి సంతానం’ అని చేర్చకుండా, సందర్భ సంబంధాన్ని పాదసూచికలో తెలియజేయడం
  alternative: మునుపటి సందర్భం ఆధారంగా ‘దాని మొదటి సంతానాన్ని’ అని ప్రధాన వచనంలో స్పష్టంగా చేర్చడం
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం ‘మొదటి సంతానం’ అనే పదాన్ని మళ్లీ చెప్పదు; అది మునుపటి ఆజ్ఞ నుంచి అర్థమవుతుంది. అందువల్ల మూలపాఠాన్ని విస్తరించకుండా సందర్భాన్ని పాదసూచికలో ఉంచడం సముచితం.
- issue: తల్లితో ఉండే కాలం యొక్క భావం
  choice: ‘తల్లితో ఉండాలి’ అనే మూలపాఠానికి దగ్గరైన రూపం
  alternative: ‘తల్లి దగ్గరే ఉంచాలి’ లేదా ‘తల్లితోనే మిగిలి ఉండాలి’
  rationale: יִהְיֶה అక్షరార్థంగా ‘ఉండాలి’; సందర్భం కొనసాగింపును సూచించినా, మూలంలో లేని కారణార్థక లేదా బలవర్ధక భావాన్ని ప్రధాన వచనంలో చేర్చకుండా నిజమైన భావవ్యాప్తిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయవిధికి తగిన గంభీరతతో. ‘గొర్రెలు-మేకల మంద’ ద్వారా צֹאן యొక్క సమూహార్థాన్ని స్పష్టం చేశాం. పాదసూచిక గుర్తులు [a], [b] ప్రధాన వచనంలో రెండూ ఉన్నాయి.
