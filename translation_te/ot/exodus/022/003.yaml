  text: దొంగిలించబడినది అతని స్వాధీనంలో సజీవంగా నిశ్చయంగా దొరికితే—అది ఎద్దయినా, గాడిదయినా, గొర్రెయినా—అతడు రెట్టింపు పరిహారం చెల్లించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
