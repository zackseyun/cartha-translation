  source_fidelity: 'The Telugu accurately represents the Hebrew case law: a man entices a virgin not formally betrothed, has sexual intercourse with her, and is under an emphatic obligation to pay the marriage/bride-price so that she becomes his wife. “ప్రలోభపెట్టి” appropriately avoids introducing force; “నిశ్చితార్థం కాని కన్యను,” “ఆమెతో శయనిస్తే,” and “తప్పకుండా కన్యాశుల్కం చెల్లించాలి” preserve the relevant legal and lexical distinctions.'
