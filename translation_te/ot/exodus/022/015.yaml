id: EXO.22.15
reference: Exodus 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא אֹרָ֖שָׂה וְ/שָׁכַ֣ב עִמָּ֑/הּ מָהֹ֛ר יִמְהָרֶ֥/נָּה לּ֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: te
  text: ఒక పురుషుడు నిశ్చితార్థం కాని కన్యను ప్రలోభపెట్టి, ఆమెతో శయనిస్తే, ఆమె తనకు భార్య అయ్యేలా అతడు తప్పకుండా కన్యాశుల్కం చెల్లించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కన్యాశుల్కం’ అంటే వివాహ సంబంధంగా వరుడు లేదా అతని కుటుంబం వధువు కుటుంబానికి చెల్లించే మోహర్; ఇది వధువు వైపు నుంచి ఇచ్చే ‘కట్నం’ కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: ప్రలోభపెట్టి
  rationale: పִּעֵל రూపంలోని פתה ఇక్కడ లైంగిక సందర్భంలో ఒప్పించడం లేదా ఆకర్షించి లోబరచుకోవడం అనే భావాన్ని ఇస్తుంది. ‘ప్రలోభపెట్టి’ బలవంతాన్ని అనవసరంగా చేర్చకుండా ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక పురుషుడు
  rationale: హీబ్రూ పదం ఏకవచన పుంలింగంలో ఉండి, ఈ న్యాయ సందర్భంలో పురుషుణ్ణి సూచిస్తుంది.
- source_word: בְּתוּלָה
  choice: కన్యను
  rationale: ఈ వివాహ-న్యాయ సందర్భంలో בְּתוּלָה లైంగిక సంబంధం లేని కన్యను సూచిస్తుంది; ‘కన్య’ ఆ స్థితిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: నిశ్చితార్థం కాని
  rationale: ఈ నిష్క్రియ రూపం వివాహానికి అధికారికంగా నిశ్చయించబడని స్త్రీని సూచిస్తుంది. ‘నిశ్చితార్థం కాని’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וְשָׁכַב עִמָּהּ
  choice: ఆమెతో శయనిస్తే
  rationale: שכב עם లైంగిక సంబంధానికి వాడే హీబ్రూ నానుడి. ‘శయనిస్తే’ మూలంలోని రూపకాన్ని, గౌరవప్రదమైన శైలిని నిలుపుతుంది.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: తప్పకుండా కన్యాశుల్కం చెల్లించాలి
  rationale: ధాతురూపానికి ముందు వచ్చిన అదే ధాతువు యొక్క సంపూర్ణ క్రియానామం బాధ్యతను బలపరుస్తుంది. מהר ఇక్కడ వరుడు లేదా అతని కుటుంబం వివాహ సంబంధంగా చెల్లించే మోహర్‌ను సూచిస్తుంది; అందువల్ల ‘కన్యాశుల్కం’ ‘కట్నం’ కంటే ఖచ్చితమైనది.
- source_word: לּוֹ לְאִשָּׁה
  choice: ఆమె తనకు భార్య అయ్యేలా
  rationale: చెల్లింపు యొక్క ఉద్దేశం ఆమెను అతనికి భార్యగా చేయడమని ఈ పదబంధం తెలియజేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఈ రూపం సహజంగా ఉంటుంది.
theological_decisions:
- issue: פתה వర్ణించే లైంగిక చర్య స్వభావం
  choice: బలవంతపు అత్యాచారం అని కాక, ప్రలోభపెట్టి లైంగిక సంబంధానికి ఒప్పించడం
  alternative: అత్యాచారం లేదా బలవంతపు లైంగిక ఉల్లంఘన
  rationale: פתה యొక్క సాధారణ పִּעֵל అర్థం ప్రలోభపెట్టడం లేదా ఒప్పించడం. ఈ వచనంలో స్పష్టంగా లేని బలవంతాన్ని అనువాదంలో చేర్చకుండా, ఇతర బలవంతపు లైంగిక దాడి న్యాయాల నుంచి ఉన్న భేదాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయశైలిని వాడాం. ‘ప్రలోభపెట్టి’ బలవంతాన్ని చేర్చకుండా మూలంలోని భావాన్ని కాపాడుతుంది; ‘శయనిస్తే’ లైంగిక నానుడిని మర్యాదగా నిలుపుతుంది. అడుగుసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
