  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יִשְׁאַ֥ל אִ֛ישׁ מֵ/עִ֥ם רֵעֵ֖/הוּ וְ/נִשְׁבַּ֣ר אוֹ מֵ֑ת בְּעָלָ֥י/ו אֵין עִמּ֖/וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: te
  text: ఒకడు తన పొరుగువాని నుండి ఏదైనా అరువుగా తీసుకుని, అది దెబ్బతిన్నా[a] లేదా చనిపోయినా, దాని యజమాని దానితో లేకపోతే, అతడు తప్పకుండా నష్టపరిహారం చెల్లించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “విరిగిపోయినా.” హీబ్రూ పదం అరువుగా తీసుకున్న వస్తువు పాడవడాన్నిగానీ, జంతువు గాయపడడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “చెల్లించడం చెల్లించాలి”; అంటే, అతడు తప్పకుండా పరిహారం చెల్లించాలి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: తీసుకున్నప్పుడు
  rationale: న్యాయసూత్రంలోని షరతుతో కూడిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; ముందున్న నియమాలతో సంబంధాన్ని సందర్భమే చూపుతుంది.
- source_word: יִשְׁאַל
  choice: అరువు తీసుకున్నప్పుడు
  rationale: ఈ న్యాయ సందర్భంలో ‘అడుగు’ అనే సాధారణ అర్థం కాకుండా, మరొకరి వస్తువు లేదా జంతువును అరువుగా తీసుకోవడమే ఉద్దేశం.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: హీబ్రూ పురుష ఏకవచన న్యాయసూత్ర రూపాన్ని నిలుపుతూ, తెలుగులో సాధారణ వ్యక్తిని సూచించే సహజమైన ప్రయోగం.
- source_word: מֵעִם רֵעֵהוּ
  choice: తన పొరుగువాని దగ్గర
  rationale: רֵעַ ఇక్కడ తోటి సమాజసభ్యుడిని సూచిస్తుంది; ‘పొరుగువాడు’ నిబంధనాత్మక న్యాయ సందర్భానికి తగిన, పరిచితమైన పదం.
- source_word: וְנִשְׁבַּר
  choice: దెబ్బతిన్నా
  rationale: మూలార్థం ‘విరిగిపోవడం’; అయితే అరువు తీసుకున్నది వస్తువుగానీ జంతువుగానీ కావచ్చు. ‘దెబ్బతినడం’ రెండింటికీ వర్తిస్తూ మూలంలోని పరిధిని కాపాడుతుంది.
- source_word: אוֹ מֵת
  choice: చనిపోయినా
  rationale: మరణాన్ని నేరుగా తెలిపే క్రియారూపం; సమీప సందర్భం అరువు తీసుకున్న జంతువును దృష్టిలో ఉంచుతుంది.
- source_word: בְּעָלָיו
  choice: దాని యజమాని
  rationale: రూపరీత్యా బహువచన లక్షణం ఉన్నా, ఇక్కడ ఏకవచన యజమానిని సూచించే హీబ్రూ నుడికారంగా పనిచేస్తుంది.
- source_word: אֵין עִמּוֹ
  choice: దాని దగ్గర లేనప్పుడు
  rationale: సర్వనామ సూచనకు కొంత వ్యాకరణ అస్పష్టత ఉన్నా, న్యాయ సందర్భంలో యజమాని అరువు తీసుకున్న దాని దగ్గర లేకపోవడమే బాధ్యతను నిర్ణయించే పరిస్థితి.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: తప్పకుండా పూర్తి నష్టపరిహారం చెల్లించాలి
  rationale: క్రియానామం-క్రియా పునరుక్తి చెల్లింపు బాధ్యతను బలపరుస్తుంది. ఈ న్యాయ సందర్భంలో ‘నష్టపరిహారం’ పరిహార చెల్లింపు భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయశైలి. వస్తువు లేదా జంతువు అనే మూలంలోని అస్పష్టతను ‘ఏదైనా,’ ‘దెబ్బతిన్నా’ అనే పదాలతో సాధ్యమైనంతవరకు నిలిపి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
