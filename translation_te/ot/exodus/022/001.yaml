  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: te
  text: దొంగ కన్నం వేస్తూ కనిపించి, కొట్టబడి చనిపోతే, కొట్టినవానికి రక్తాపరాధం ఉండదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “దొంగ చోరప్రవేశంలో కనిపిస్తే.” ఇక్కడి హీబ్రూ పదం గోడకు కన్నం వేసి లేదా రహస్యంగా లోపలికి ప్రవేశించే చోరప్రవేశాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఈ సందర్భంలో దొంగను కొట్టిన వ్యక్తికి రక్తపాతానికి సంబంధించిన న్యాయపరమైన అపరాధం ఉండదు.
    reason: referent_clarification
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: కన్నం వేస్తుండగా
  rationale: ఈ నామవాచకం గోడకు కన్నం వేసి లేదా రహస్యంగా లోపలికి ప్రవేశించే చోరప్రవేశాన్ని సూచిస్తుంది. తెలుగు న్యాయసందర్భంలో ‘కన్నం వేయడం’ సహజంగా, సంక్షిప్తంగా ఆ దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: יִמָּצֵא
  choice: పట్టుబడి
  rationale: నిఫాల్ రూపం ‘కనిపించడం/పట్టుబడడం’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది. దొంగతనం జరుగుతున్న సందర్భంలో ‘పట్టుబడి’ సహజమైన ఆధునిక తెలుగు.
- source_word: הַגַּנָּב
  choice: దొంగ
  rationale: גנב అనే సాధారణ పదానికి నేరుగా సరిపోయే, అందరికీ అర్థమయ్యే పదం ‘దొంగ’.
- source_word: וְהֻכָּה
  choice: దెబ్బ తిని
  rationale: נכה యొక్క నిష్క్రియ రూపం కొట్టబడడాన్ని సూచిస్తుంది. ‘దెబ్బ తిని’ ఒకటి లేదా అనేక దెబ్బలు అన్నది నిర్ధారించకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וָמֵת
  choice: చనిపోతే
  rationale: దెబ్బకు అనుసరించి మరణించిన ఫలితాన్ని షరతు వాక్యంలో సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని ‘కొట్టబడి, చనిపోతే’ అనే క్రమాన్ని కాపాడుతుంది.
- source_word: אֵין לוֹ דָּמִים
  choice: అతని విషయంలో రక్తాపరాధం ఉండదు
  rationale: דמים ఇక్కడ కేవలం రక్తాన్ని కాక, రక్తపాతానికి సంబంధించిన న్యాయపరమైన బాధ్యతను సూచిస్తుంది. ‘రక్తాపరాధం’ ఆ నిబంధనాత్మక భావాన్ని నిలుపుతుంది; సర్వనామ సూచనలోని సాధ్యమైన అస్పష్టతను ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించదు.
theological_decisions:
- issue: చోరప్రవేశ సమయంలో జరిగిన మరణానికి సంబంధించిన న్యాయతీర్పు
  choice: ‘రక్తాపరాధం ఉండదు’ అని అనువదించి, ఈ ప్రత్యేక సందర్భంలో రక్తపాత బాధ్యత లేదనే న్యాయపరమైన తీర్పును తెలిపాం.
  alternative: ‘అతడు హత్యాపరాధి కాడు’ అని అనువదించడం.
  rationale: మూలంలోని דמים నిబంధనాత్మక రక్తాపరాధ భావాన్ని కలిగి ఉంది. ‘హత్య’ అనే ఆధునిక, మరింత సంకుచిత నేరవర్గాన్ని దిగుమతి చేయకుండా, ఈ సందర్భానికి మాత్రమే వర్తించే న్యాయ నిర్ణయాన్ని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవాక్యానికి తగిన గంభీరతతోనూ సామాన్య పాఠకునికి సులభంగా అర్థమయ్యే విధంగానూ రూపొందించబడింది. ‘కన్నం వేయడం’ సహజ తెలుగు ప్రయోగం; ‘రక్తాపరాధం’ మూలంలోని నిబంధనాత్మక-న్యాయ భావాన్ని సంరక్షిస్తుంది.
