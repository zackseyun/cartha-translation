  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే వ్యవసాయ పదజాలాన్ని ఉపయోగించాం. మూలంలోని మూడు నష్టవర్గాలు—ధాన్యపు కుప్ప, నిలిచివున్న పంట, పొలం—విడివిడిగా నిలుపబడ్డాయి.
