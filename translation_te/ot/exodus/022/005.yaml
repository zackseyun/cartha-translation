source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א אֵ֜שׁ וּ/מָצְאָ֤ה קֹצִים֙ וְ/נֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַ/קָּמָ֖ה א֣וֹ הַ/שָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַ/מַּבְעִ֖ר אֶת הַ/בְּעֵרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: te
  text: మంట చెలరేగి ముళ్ల పొదలకు అంటుకొని[a], ధాన్యపు కుప్పనైనా, నిలిచివున్న పంటనైనా, పొలాన్నైనా కాల్చివేస్తే, ఆ మంటను రగిలించినవాడు నష్టాన్ని తప్పక పూర్తిగా భర్తీ చేయాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ముళ్లను చేరి”; అక్షరార్థంగా “ముళ్లను కనుగొని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఒకే ధాతువుకు చెందిన రెండు క్రియారూపాలను కలిపి ఉపయోగించడం ద్వారా నష్టాన్ని భర్తీ చేయాల్సిన బాధ్యతను బలంగా నొక్కిచెప్పారు.
    reason: source_language_emphasis
lexical_decisions:
- source_word: כִּי
  choice: చెలరేగి…కాల్చివేస్తే
  rationale: ఇది ఒక షరతుతో కూడిన న్యాయ సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘-తే’ నిర్మాణం సహజంగా ‘ఒకవేళ/ఎప్పుడు’ అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: תֵצֵא אֵשׁ
  choice: మంట చెలరేగి
  rationale: అక్షరార్థంగా మంట ‘బయలుదేరడం’ అనే చిత్రం ఉన్నా, సందర్భంలో మంట మొదలై అదుపు తప్పి వ్యాపించడమే భావం. ‘చెలరేగి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וּמָצְאָה קֹצִים
  choice: ముళ్ల పొదలకు అంటుకొని
  rationale: అక్షరార్థం ‘ముళ్లను కనుగొని.’ అగ్ని ముళ్ల పొదలను చేరి వాటికి అంటుకోవడాన్ని ‘అంటుకొని’ సహజంగా తెలియజేస్తుంది; మూలంలోని చిత్రాన్ని పాదసూచికలో నిలిపాం.
- source_word: גָּדִישׁ
  choice: ధాన్యపు కుప్ప
  rationale: కోత కోసి ఒకచోట కుప్పగా లేదా దొంతరగా ఉంచిన ధాన్యాన్ని సూచిస్తుంది. ‘ధాన్యపు కుప్ప’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: הַקָּמָה
  choice: నిలిచివున్న పంట
  rationale: ఇంకా కోయకుండా పొలంలో నిలిచి ఉన్న పంటను సూచిస్తుంది; కోసి కుప్పగా ఉంచిన ధాన్యంతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: וְנֶאֱכַל
  choice: కాల్చివేస్తే
  rationale: అగ్ని ‘తినివేయడం/దహించడం’ అనే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజమైన అగ్ని సంబంధ క్రియతో వ్యక్తం చేస్తుంది.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: ఆ మంటను రగిలించినవాడు
  rationale: మంటకు కారణమైన వ్యక్తిని సూచిస్తుంది. ‘రగిలించినవాడు’ కారణక భావాన్ని నిలుపుతూ, ఉద్దేశపూర్వకతను అవసరానికి మించి నిర్ధారించదు.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: నష్టాన్ని తప్పక పూర్తిగా భర్తీ చేయాలి
  rationale: హీబ్రూలోని infinitive absolute మరియు finite verb కలయిక పరిహారం చెల్లించాల్సిన బాధ్యతను బలపరుస్తుంది. ‘తప్పక’ ఆ బలాన్ని, ‘పూర్తిగా భర్తీ చేయాలి’ నష్టపరిహార భావాన్ని తెలియజేస్తాయి.
