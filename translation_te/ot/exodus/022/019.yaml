id: EXO.22.19
reference: Exodus 22:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: te
  text: యహ్వేకు మాత్రమే తప్ప, ఇతర ఏ దేవునికైనా బలి అర్పించేవాడు నాశనానికి అంకితం చేయబడాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిషేధపు తీర్పుకు అప్పగించబడాలి,” లేదా “పూర్తిగా నాశనం చేయబడాలి.” హీబ్రూ క్రియ తిరుగులేని విధంగా నాశనానికి అంకితం చేయబడే భావాన్ని కలిగి ఉంది.
    reason: חרם అనే శిక్షాపదంలోని అంకితభావం, నిషేధం, సంపూర్ణ నాశనం అనే పరస్పర సంబంధిత భావాలను తెలియజేయడానికి.
lexical_decisions:
- source_word: זֹבֵחַ
  choice: బలి అర్పించేవాడు
  rationale: Qal కృదంతం ఇక్కడ వ్యక్తిని సూచించే నామవాచకంగా వాడబడింది. ‘బలి అర్పించు’ అనే పదబంధం వధతో కూడిన ఆరాధనా బలి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לָאֱלֹהִים
  choice: మరే దేవునికైనా
  rationale: אֱלֹהִים రూపరీత్యా బహువచనమైనా, ఈ నిషేధ సందర్భంలో యహ్వే కాకుండా ఏ దేవతనైనా సాధారణంగా సూచిస్తుంది. మినహాయింపు వాక్యంతో కలిపి ‘మరే దేవునికైనా’ అనడం దాని విభజనాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: יָחֳרָם
  choice: నాశనానికి అంకితం చేయబడాలి
  rationale: חרם యొక్క Hophil రూపం తిరుగులేని నిషేధానికి లోబరచి నాశనానికి అప్పగించడాన్ని సూచిస్తుంది. ఈ అనువాదం అంకితభావాన్నీ శిక్షాత్మక నాశనాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: בִּלְתִּי
  choice: తప్ప
  rationale: ఇక్కడ ఈ పదం మినహాయింపును ప్రవేశపెడుతుంది; ‘తప్ప’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: హీబ్రూ పాఠంలోని దేవుని ప్రత్యేక నామమైన יהוהను దాని వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతూ ‘యహ్వే’గా లిప్యంతరీకరించాం; לְ ఉపసర్గను ‘కు’తో తెలిపాం.
- source_word: לְבַדּוֹ
  choice: మాత్రమే
  rationale: ఈ పదం ప్రత్యేకతను, ఏకైక అర్హతను సూచిస్తుంది. ‘యహ్వేకు మాత్రమే’ బలి అర్పణ ఆయనకే పరిమితమని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనా బలికి విధించే חרם శిక్షను ఎలా అనువదించాలి
  choice: నాశనానికి అంకితం చేయబడాలి
  alternative: పూర్తిగా నాశనం చేయబడాలి; నిషేధానికి లోబరచబడాలి
  rationale: మూలపదం సాధారణ మరణశిక్షకన్నా విస్తృతంగా, ఒకరిని తిరుగులేని విధంగా నిషేధానికి లోబరచి నాశనానికి అప్పగించే ధార్మిక-న్యాయ భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలోని ఎంపిక ఆ ఉద్రిక్తతను సాంకేతిక పదజాలం లేకుండా కాపాడుతుంది.
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దేవుని ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత దైవనామంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన న్యాయశైలిని ఉపయోగించాం. ‘బలి అర్పించేవాడు’ వ్యక్తిని సూచించే పురుష ఏకవచన న్యాయసూత్ర రూపాన్ని నిలుపుతుంది; ‘మరే దేవునికైనా’ నిషేధం యొక్క సాధారణ పరిధిని స్పష్టం చేస్తుంది. పాదసూచిక గుర్తు సంబంధిత శిక్షాపదం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
