source:
  edition: WLC
  text: אִם בְּעָלָ֥י/ו עִמּ֖/וֹ לֹ֣א יְשַׁלֵּ֑ם אִם שָׂכִ֣יר ה֔וּא בָּ֖א בִּ/שְׂכָרֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: te
  text: దాని యజమాని దానితో ఉంటే, అతడు నష్టపరిహారం చెల్లించాల్సిన అవసరం లేదు. అది అద్దెకు తీసుకున్నదైతే, అది దాని అద్దెతోనే వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు కూలివాడైతే, అతడు తన కూలికోసం వచ్చాడు.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది. שָׂכִיר అనే పదాన్ని అద్దెకు తీసుకున్న జంతువు లేదా వస్తువుగా, లేక కూలివాడిగా అర్థం చేసుకోవచ్చు. అప్పుగా తీసుకున్న ఆస్తికి సంబంధించిన బాధ్యత ఈ సందర్భంలో చర్చించబడుతున్నందున ప్రధాన పాఠం మొదటి అర్థాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: దాని యజమాని
  rationale: న్యాయపరమైన ఈ సందర్భంలో בעל అనేది ఆ జంతువు లేదా వస్తువు యొక్క యజమానిని సూచిస్తుంది; తెలుగు స్వామ్యసంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עִמּוֹ
  choice: దానితో ఉంటే
  rationale: 3వ పురుష ఏకవచన ప్రత్యయం సందర్భంలోని అప్పుగా తీసుకున్న జంతువు లేదా వస్తువును సూచిస్తుంది; యజమాని దానితో ఉన్న పరిస్థితిని ఈ అనువాదం సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יְשַׁלֵּם
  choice: అతడు నష్టపరిహారం చెల్లించనక్కరలేదు
  rationale: న్యాయ సందర్భంలో piel రూపంలోని שלם నష్టానికి పరిహారం చెల్లించడాన్ని సూచిస్తుంది; కేవలం ‘చెల్లించడు’ కంటే ఇది భావాన్ని స్పష్టం చేస్తుంది.
- source_word: שָׂכִיר
  choice: అద్దెకు తీసుకున్నది
  rationale: ఈ పదం సాధారణంగా కూలివానిని కూడా సూచించగలదు; అయితే అప్పుగా లేదా అద్దెకు తీసుకున్న ఆస్తి గురించిన తక్షణ సందర్భంలో జంతువు/వస్తువును సూచించే సంక్షిప్త ప్రయోగంగా ప్రధాన పాఠం గ్రహిస్తుంది.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: దాని అద్దెలోనే అది వచ్చింది
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగాను కొంత అస్పష్టంగాను ఉంది. అద్దె ఏర్పాటులోనే సంబంధిత ప్రమాదం లేదా పరిహారం ఇమిడి ఉందనే భావాన్ని అతిగా వివరణ చేయకుండా ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: שָׂכִיר మరియు దాని తరువాతి ప్రత్యయాల సూచ్యము
  choice: అద్దెకు తీసుకున్న జంతువు లేదా వస్తువుగా ప్రధాన పాఠంలో తీసుకోవడం
  alternative: ‘అతడు కూలివాడైతే, అది అతని కూలికోసం వచ్చింది’ అని వ్యక్తిని సూచించే పఠనం
  rationale: అప్పుగా తీసుకున్న ఆస్తికి కలిగిన నష్టంపై బాధ్యతను చర్చిస్తున్న సమీప సందర్భం వస్తు-సూచనకు మద్దతిస్తుంది. అయినా హీబ్రూ పదరూపం వ్యక్తిని సూచించే పఠనాన్నీ అనుమతిస్తుంది కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన న్యాయశైలిని ఉపయోగించాం. ‘నష్టపరిహారం’ బాధ్యత భావాన్ని స్పష్టం చేస్తుంది; చివరి హీబ్రూ ఉపవాక్యంలోని సంక్షిప్తతను పూర్తిగా విప్పకుండా ‘దాని అద్దెలోనే అది వచ్చింది’ అని ఉంచాం.
