  revision_rationale: The revision removes the modern Telugu ambiguity of “కప్పు,” preserves the distinction between a sole covering and an outer garment, and makes the rhetorical sleeping question idiomatic while retaining its contextual reference to the pledged garment. The footnote anchor is moved to the translated divine attribute it explains.
