- from: ఎందుకంటే అదే అతనికున్న ఏకైక కప్పు; అతని చర్మాన్ని కప్పే వస్త్రం అదే. అతడు ఇంక దేనిలో పడుకుంటాడు? అతడు నాకు మొరపెడితే నేను వింటాను; ఎందుకంటే నేను కనికరంగలవాడిని.[a]
  to: ఎందుకంటే అదే అతనికున్న ఏకైక కప్పుకునే వస్త్రం; అతని చర్మాన్ని కప్పే పైవస్త్రం అదే. అతడు ఏది కప్పుకొని పడుకుంటాడు? అతడు నాకు మొరపెడితే నేను వింటాను; ఎందుకంటే నేను కనికరంగలవాడిని[a].
