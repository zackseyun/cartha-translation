  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: te
  text: ఎందుకంటే అదే అతనికున్న ఏకైక కప్పుకునే వస్త్రం; అతని చర్మాన్ని కప్పే పైవస్త్రం అదే. అతడు ఏది కప్పుకొని పడుకుంటాడు? అతడు నాకు మొరపెడితే నేను వింటాను; ఎందుకంటే నేను కనికరంగలవాడిని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృపగలవాడిని” లేక “దయగలవాడిని.”
    reason: חַנּוּןకు సాధ్యమైన సమీప పదార్థాలను చూపించడానికి.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּסוּתוֹ לְבַדָּהּ
  choice: అతనికున్న ఏకైక కప్పు
  rationale: כְּסוּת అనేది కప్పుకునే వస్త్రాన్ని, לְבַדָּהּ అది ఒక్కటే ఉందనే భావాన్ని సూచిస్తాయి.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: అతని చర్మాన్ని కప్పే వస్త్రం
  rationale: שִׂמְלָהను సాధారణమైన ‘వస్త్రం’గా, עוֹר యొక్క స్పష్టమైన శరీర చిత్రణను ‘చర్మం’గా నిలిపి, తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: అతడు ఇంక దేనిలో పడుకుంటాడు?
  rationale: ఇది రాత్రి కప్పుకోడానికి మరేదీ లేదని తెలిపే అలంకార ప్రశ్న; ‘పడుకుంటాడు’ שׁכבకు దగ్గరగా ఉంది, ‘ఇంక’ సందర్భంలో అంతర్లీనమైన కొరతను స్పష్టం చేస్తుంది.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: అతడు నాకు మొరపెడితే
  rationale: భవిష్యత్ షరతును తెలుగులో సహజంగా సంక్షిప్తం చేస్తూ, צעקలోని బాధతో సహాయం కోరే భావాన్ని ‘మొరపెట్టు’ నిలుపుతుంది.
- source_word: וְשָׁמַעְתִּי
  choice: నేను వింటాను
  rationale: שׁמע యొక్క సరళమైన అర్థాన్ని నిలుపుతుంది; సందర్భంలో దేవుడు మొరకు స్పందిస్తాడనే భావమూ సహజంగా వినిపిస్తుంది.
- source_word: חַנּוּן
  choice: కనికరంగలవాడిని
  rationale: బలహీనుని మొరకు అనుగ్రహంతో, జాలితో స్పందించే దేవుని స్వభావాన్ని ఆధునిక సాధారణ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవ స్వవర్ణన חַנּוּן యొక్క అనువాదం
  choice: కనికరంగలవాడిని
  alternative: కృపగలవాడిని; దయగలవాడిని
  rationale: ఈ న్యాయ సందర్భంలో పేదవాని మొరకు దేవుడు జాలితో స్పందిస్తాడనే నైతిక బలాన్ని ‘కనికరం’ స్పష్టంగా తెలియజేస్తుంది. ‘కృపగల’ మరియు ‘దయగల’ కూడా సాధ్యమైన పదార్థాలు; పాదసూచనలో వాటిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని స్పష్టమైన ‘చర్మం’ చిత్రణను నిలిపి, హీబ్రూ షరతు నిర్మాణాన్ని తెలుగులో సహజంగా మలిచాం. పాదసూచిక గుర్తు సంబంధిత חַנּוּן అనువాదం వెంట ఉంచబడింది.
