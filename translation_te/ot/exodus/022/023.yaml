  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: te
  text: అప్పుడు నా కోపం రగులుకుంటుంది; నేను మిమ్మల్ని ఖడ్గంతో చంపుతాను. మీ భార్యలు విధవరాళ్లవుతారు, మీ కుమారులు తండ్రిలేనివారు అవుతారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనాథలవుతారు’; హీబ్రూ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయినవారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: నా కోపం రగులుకుంటుంది
  rationale: חרה אף అనే హీబ్రూ నుడికారం కోపం మండడాన్ని సూచిస్తుంది. ‘రగులుకుంటుంది’ మూలంలోని అగ్ని రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: నేను మిమ్మల్ని ... చంపుతాను
  rationale: הרג సాధారణంగా ‘చంపు’ అనే అర్థమిచ్చే క్రియ. ‘సంహరిస్తాను’ కంటే ‘చంపుతాను’ నేరుగా, స్పష్టంగా ఉంది.
- source_word: בֶּחָרֶב
  choice: ఖడ్గంతో
  rationale: ב ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; חֶרֶב యుద్ధ ఖడ్గం. ‘ఖడ్గంతో’ హింసాత్మక తీర్పు అనే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: మీ భార్యలు విధవరాళ్లవుతారు
  rationale: ఈ కుటుంబ సందర్భంలో נָשִׁים అంటే ‘భార్యలు’; היה ఇక్కడ ఆ చర్య ఫలితంగా ఏర్పడే స్థితిని సూచిస్తుంది.
- source_word: וּבְנֵיכֶם
  choice: మీ కుమారులు
  rationale: בנים ఇక్కడ పురుషలింగ బహువచనం; మూలంలోని లింగ-నిర్దిష్ట పదాన్ని ‘పిల్లలు’ అని సాధారణీకరించకుండా నిలిపాం.
- source_word: יְתֹמִים
  choice: తండ్రిలేనివారు
  rationale: יָתוֹם తండ్రిని కోల్పోయి సామాజికంగా రక్షణలేని స్థితిలో ఉన్నవారిని ప్రత్యేకంగా సూచించగలదు. ‘అనాథలు’ కంటే ‘తండ్రిలేనివారు’ ఈ సందర్భంలోని కారణాన్ని మరింత ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని కోపానికి సంబంధించిన శరీరాంగ ఆధారిత హీబ్రూ నుడికారం
  choice: నా కోపం రగులుకుంటుంది
  alternative: నా ముక్కు మండుతుంది; నా ఉగ్రత రగులుతుంది
  rationale: אַף అక్షరార్థంగా ‘ముక్కు’ అయినా, חרה తో కలిసినప్పుడు కోపాన్ని సూచించే నుడికారం. అక్షరార్థ శరీరాంగాన్ని తెలుగులో పెట్టడం భావాన్ని అస్పష్టం చేస్తుంది; ఎంపిక చేసిన రూపం కోపాన్నీ, మండే రూపకాన్నీ రెండింటినీ కాపాడుతుంది.
- issue: בנים పదంలోని లింగ-నిర్దిష్టత
  choice: మీ కుమారులు
  alternative: మీ పిల్లలు
  rationale: మూలంలో ప్రత్యేకంగా ‘కుమారులు’ అని ఉంది. సందర్భం దాన్ని లింగ-తటస్థంగా చేయాలని నిర్బంధించనందున మూలంలోని నిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా, గంభీరంగా అనువదించబడింది. ‘రగులుకుంటుంది’ ద్వారా హీబ్రూ నుడికారంలోని అగ్ని రూపకం నిలిచింది; ‘ఖడ్గం’ న్యాయతీర్పు యొక్క కఠినతను తెలిపే మూల చిత్రాన్ని కాపాడుతుంది. సరఫరా చేసిన ఆంగ్ల పాఠ్యంలో ఫుట్‌నోట్ గుర్తులు వాటి విషయాలతో స్థానభ్రంశం చెందినట్లు కనిపించినందున, హీబ్రూ יְתֹמִים కు సంబంధించిన నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని మాత్రమే [a]గా సరైన స్థానంలో ఇచ్చాం.
