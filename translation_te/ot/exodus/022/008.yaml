source:
  edition: WLC
  text: עַֽל כָּל דְּבַר פֶּ֡שַׁע עַל שׁ֡וֹר עַל חֲ֠מוֹר עַל שֶׂ֨ה עַל שַׂלְמָ֜ה עַל כָּל אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי ה֣וּא זֶ֔ה עַ֚ד הָֽ/אֱלֹהִ֔ים יָבֹ֖א דְּבַר שְׁנֵי/הֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻ/ן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְ/רֵעֵֽ/הוּ־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: te
  text: ఎద్దు, గాడిద, గొర్రె[a], వస్త్రం లేదా పోయిన ఏ వస్తువుకు సంబంధించిన ఏ అపరాధ వ్యవహారమైనా, ఎవరైనా “ఇదే” అని చెబితే, ఆ ఇద్దరి వివాదం దేవుని[b] సన్నిధికి రావాలి. దేవుడు ఎవరిని దోషిగా తేలుస్తాడో అతడు తన పొరుగువానికి రెండింతలు చెల్లించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం చిన్న పశువును సూచించే విస్తృత పదం; అది గొర్రెను లేదా మేకను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “న్యాయాధిపతుల సన్నిధికి” / “న్యాయస్థానానికి”; ఇక్కడి హీబ్రూ పదం దేవుణ్ణి నేరుగా సూచించవచ్చు, లేదా న్యాయ సందర్భంలో దైవాధికారంతో వ్యవహరించే మానవ న్యాయాధిపతులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: అపరాధ వివాదం
  rationale: దָּבָר ఇక్కడ న్యాయపరమైన విషయం లేదా వివాదాన్ని, פֶּשַׁע అపరాధాన్ని సూచిస్తాయి. తెలుగు న్యాయ సందర్భంలో రెండింటి భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שׁוֹר
  choice: ఎద్దు
  rationale: గృహపశువుల ఆస్తిని సూచించే ఈ న్యాయ జాబితాలో సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: חֲמוֹר
  choice: గాడిద
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: שֶׂה
  choice: గొర్రె
  rationale: జాబితాలో సహజమైన ప్రతినిధి పదం; హీబ్రూ పదం గొర్రె లేదా మేక వంటి చిన్న పశువును సూచించగల విస్తృత పదమని పాదసూచికలో నిలిపాం.
- source_word: שַׂלְמָה
  choice: వస్త్రం
  rationale: ఒక ప్రత్యేక పైవస్త్రానికి పరిమితం చేయకుండా దుస్తును విస్తృతంగా సూచిస్తుంది.
- source_word: אֲבֵדָה
  choice: పోయిన ఏ వస్తువు
  rationale: పోయిన ఆస్తి అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: ఎవరైనా “ఇదే అది” అని చెబితే
  rationale: వివాదాస్పద వస్తువును గుర్తిస్తూ లేదా దానిపై హక్కు చెబుతూ పలికే మాటలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: దేవుడు / దేవుని
  rationale: పదం యొక్క ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, న్యాయాధిపతులు లేదా న్యాయస్థానం అనే సాధ్యమైన న్యాయసందర్భ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: ఆ ఇద్దరి వివాదం ... రావాలి
  rationale: ఇద్దరు పక్షాల న్యాయవ్యవహారం ముందుకు తీసుకురావాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַרְשִׁיעֻן
  choice: దోషిగా తేలుస్తాడో
  rationale: హిఫిల్ రూపంలోని న్యాయపరమైన ‘దోషిగా ప్రకటించు’ అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: రెండింతలు చెల్లించాలి
  rationale: రెట్టింపు పరిహారం చెల్లించాలనే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְרֵעֵהוּ
  choice: తన పొరుగువానికి
  rationale: רֵעַ యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; ఈ సందర్భంలో అది వివాదంలోని అవతలి వ్యక్తిని సూచిస్తుంది.
theological_decisions:
- issue: ఈ న్యాయ సందర్భంలో אֱלֹהִים అర్థం
  choice: దేవుడు
  alternative: న్యాయాధిపతులు / న్యాయస్థానం
  rationale: హీబ్రూ రూపం ప్రత్యక్షంగా ‘దేవుడు’ అని అర్థమివ్వగలదు; అదే సమయంలో ఈ నిబంధనల సందర్భంలో దైవాధికారంతో పనిచేసే న్యాయాధిపతులను కూడా సూచించవచ్చు. ప్రధాన పాఠ్యం ప్రత్యక్ష అర్థాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన న్యాయ శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో చదవదగిన క్రమంలో అమర్చినా, ఆస్తుల జాబితా, ‘ఇదే అది’ అనే గుర్తింపు వాక్యం, దేవుడు/న్యాయాధిపతులు అనే అస్పష్టత, రెట్టింపు చెల్లింపు అన్నీ నిలుపబడ్డాయి.
