  language: te
  text: అయితే, అది అతని వద్దనుండి నిజంగానే దొంగిలించబడితే[a], అతడు దాని యజమానికి పరిహారం చెల్లించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఒకే క్రియకు క్రియానామరూపం, సమాపక క్రియ కలసి ఉద్ఘాటనను వ్యక్తం చేస్తాయి. దీని భావం, “అది నిజంగానే అతని వద్దనుండి దొంగిలించబడితే” లేదా “అది అతని సంరక్షణలో ఉండగా నిజంగా దొంగిలించబడితే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే, … దొంగిలించబడితే
  rationale: న్యాయవిధుల వరుసలో ముందున్న పరిస్థితికి భిన్నమైన షరతును ఇది పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘అయితే’ ఆ సందర్భసంబంధ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גָּנֹב יִגָּנֵב
  choice: నిజంగానే దొంగిలించబడితే
  rationale: క్రియానామ ధాతురూపం, సమాపక క్రియ కలసి దొంగిలించబడడాన్ని బలంగా చెబుతున్నాయి. ‘నిజంగానే’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది; కర్మ ముందరి సందర్భం నుంచి ‘అది’గా వ్యక్తమైంది.
- source_word: מֵעִמּוֹ
  choice: అతని దగ్గరనుంచి
  rationale: అక్షరార్థంగా ‘అతనితో ఉన్న చోటునుంచి.’ ఈ న్యాయసందర్భంలో వస్తువు అతని సంరక్షణలో ఉండగా పోయిందనే భావం ఉంది. ‘అతని దగ్గరనుంచి’ మూలానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా ఉంది.
- source_word: יְשַׁלֵּם
  choice: పరిహారం చెల్లించాలి
  rationale: שלם పియేల్ రూపం ఈ న్యాయసందర్భంలో నష్టాన్ని పూడ్చడం లేదా ప్రతిఫలం చెల్లించడం అని సూచిస్తుంది. ‘పరిహారం చెల్లించాలి’ దాని చట్టపరమైన బలాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִבְעָלָיו
  choice: దాని యజమానికి
  rationale: בעל ఇక్కడ అప్పగించబడిన వస్తువు లేదా జంతువు యొక్క యజమానిని సూచిస్తుంది. ‘దాని యజమానికి’ తెలుగులో స్పష్టమైన, సహజమైన ఏకవచన రూపం.
