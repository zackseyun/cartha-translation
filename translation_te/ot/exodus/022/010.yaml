source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: te
  text: సొత్తును తన వద్ద ఉంచుకున్నవాడు తన పొరుగువాని సొత్తుపై చేయి వేయలేదని[b], వారిద్దరి మధ్య యెహ్వే పేరట ప్రమాణం జరగాలి[a]. ఆ సొత్తు యజమాని ఆ ప్రమాణాన్ని అంగీకరించాలి[c]; సొత్తును తన వద్ద ఉంచుకున్నవాడు నష్టపరిహారం చెల్లించనక్కరలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యెహ్వే యొక్క ప్రమాణం.’
    reason: lexical_alternative
  - marker: b
    text: ‘పొరుగువాని సొత్తుపై చేయి వేయడం’ అనేది ఇతరునికి చెందినదాన్ని అక్రమంగా తీసుకోవడం లేదా దానితో అక్రమంగా వ్యవహరించడం అనే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘యజమాని దాన్ని స్వీకరించాలి’; అంటే ఆ ప్రమాణాన్నే తగిన పరిష్కారంగా అంగీకరించాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: యెహ్వే పేరట ప్రమాణం
  rationale: ఇది యెహ్వే స్వయంగా చేసే ప్రమాణమని అపార్థం కాకుండా, దేవుని నామంతో బద్ధమైన న్యాయపరమైన ప్రమాణమనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని ‘యెహ్వే యొక్క ప్రమాణం’ అనే నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בֵּין שְׁנֵיהֶם
  choice: వారిద్దరి మధ్య
  rationale: న్యాయవివాదంలోని రెండు పక్షాలను హీబ్రూ స్పష్టంగా సూచిస్తుంది.
- source_word: אִם לֹא
  choice: తాను ... చేయి వేయలేదని
  rationale: ఇక్కడ ఇది సాధారణ షరతు కాక, ప్రమాణంలో చెప్పే విషయాన్ని పరిచయం చేసే సూత్రప్రయోగం.
- source_word: שָׁלַח יָדוֹ
  choice: చేయి వేయలేదని
  rationale: ఇతరుని సొత్తును స్వాధీనం చేసుకోవడం లేదా దానితో అక్రమంగా వ్యవహరించడం అనే హీబ్రూ నుడికారపు చిత్రాన్ని నిలుపుతుంది.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: తన పొరుగువాని సొత్తుపై
  rationale: ఈ న్యాయసందర్భంలో מְלָאכָה అమూర్తమైన ‘పని’ని కాక, అప్పగించబడిన వస్తువు లేదా ఆస్తిని సూచిస్తుంది; ‘సొత్తు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וְלָקַח בְּעָלָיו
  choice: ఆ సొత్తు యజమాని ఆ ప్రమాణాన్ని అంగీకరించాలి
  rationale: లָקַח అనే ‘తీసుకోవడం/స్వీకరించడం’ ఇక్కడ ప్రమాణాన్ని తగిన పరిష్కారంగా ఒప్పుకోవడాన్ని సూచిస్తుంది; మూలంలో కర్మ స్పష్టంగా చెప్పబడకపోయినా సందర్భం దానిని సూచిస్తుంది.
- source_word: יְשַׁלֵּם
  choice: నష్టపరిహారం చెల్లించనక్కరలేదు
  rationale: పీయేల్ రూపం ఈ నిబంధనల సందర్భంలో జరిగిన నష్టానికి పరిహారం చెల్లించడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణతో నిలిపాం.
- issue: ప్రమాణం దేవునిది గానా, దేవుని పేరట చేసేదా అన్న నిర్మాణాత్మక ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో ‘యెహ్వే పేరట ప్రమాణం’; అక్షరార్థ నిర్మాణం పాదటిప్పణిలో
  alternative: ‘యెహ్వే యొక్క ప్రమాణం’
  rationale: హీబ్రూ నిర్మాణాన్ని నమోదు చేస్తూనే, యెహ్వే ప్రమాణం చేస్తున్నాడనే అనవసరమైన అపార్థాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో న్యాయపరమైన గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యే పదాలను వాడాం. ‘చేయి వేయడం’ అనే మూల నుడికారాన్ని ఉంచి పాదటిప్పణిలో వివరించాం. ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు పాఠ్యంలోని సంబంధిత పదబంధాల దగ్గర ఉంచబడ్డాయి.
