  verdict: revise
  source_fidelity: The draft correctly identifies the sexual sense of שֹׁכֵב עִם and the certain judicial penalty expressed by מוֹת יוּמָת. However, “జంతువుతో శయనించే” can be understood merely as sleeping beside an animal in modern Telugu, so it does not adequately convey the source’s contextual sexual idiom.
  naturalness: “మరణశిక్షకు గురికావాలి” is understandable, but “మరణశిక్ష విధించాలి” is more idiomatic and direct in modern Telugu legal register. An explicit phrase for sexual relations avoids unintended ambiguity.
  terminology: “జంతువు” appropriately renders בְּהֵמָה broadly. “లైంగిక సంబంధం కలిగిన” is a clear, restrained modern equivalent in this legal context. The footnote should preserve the passive force of the Hebrew penalty formula.
  issues:
  - severity: medium
    issue: “జంతువుతో శయనించే” is ambiguous in modern Telugu.
    rationale: Although it attempts to retain the Hebrew euphemism, it may denote nonsexual sleeping with an animal. The legal context requires an unambiguous rendering of the sexual sense.
  - severity: low
    issue: The footnote’s “తప్పకుండా మరణించాలి” does not preserve the passive/judicial nuance of יומת.
    rationale: The Hebrew legal formula uses a passive verb (“shall be put to death”). A literal-oriented alternative should retain that nuance where Telugu permits.
  revised_text: జంతువుతో లైంగిక సంబంధం కలిగిన ప్రతి వ్యక్తికి తప్పకుండా మరణశిక్ష విధించాలి[a].
