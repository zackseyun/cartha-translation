  text: כָּל שֹׁכֵ֥ב עִם בְּהֵמָ֖ה מ֥וֹת יוּמָֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: te
  text: జంతువుతో లైంగిక సంబంధం కలిగిన ప్రతి వ్యక్తికి తప్పకుండా మరణశిక్ష విధించాలి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “తప్పకుండా చంపబడాలి.” హీబ్రూ న్యాయసంబంధ సూత్రం న్యాయపరమైన శిక్షగా మరణం నిశ్చయమని బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: శయనించే ప్రతి వ్యక్తి
  rationale: כָּל తో కూడిన కర్తరి వర్తమానార్థక రూపం సాధారణంగా ఎవరైనా అలాంటి పని చేసే వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘ప్రతి వ్యక్తి’ న్యాయవాక్యానికి సహజమైన, సమగ్ర భావాన్ని ఇస్తుంది.
- source_word: שֹׁכֵב עִם
  choice: తో శయనించే
  rationale: שׁכב + עִם ఇక్కడ లైంగిక సంబంధాన్ని సూచించే గంభీరమైన సభ్యోక్తి. ‘శయనించే’ మూలంలోని రూపకాన్ని నిలుపుతూ అస్పష్టత కలిగించకుండా సందర్భానుగుణ అర్థాన్ని అందిస్తుంది.
- source_word: בְּהֵמָה
  choice: జంతువు
  rationale: ఈ పదం జంతువు లేదా పశువును సూచించగలదు. ‘జంతువు’ ఆధునిక తెలుగులో విస్తృతమైన, స్పష్టమైన పదం; ‘పశువు’ అనే పరిమిత అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: מוֹת יוּמָת
  choice: తప్పకుండా మరణశిక్షకు గురికావాలి
  rationale: క్రియావిశేష బలప్రయోగంతో కూడిన నిష్క్రియ న్యాయసూత్రం మరణదండన యొక్క నిశ్చయతను తెలియజేస్తుంది. ఈ అనువాదం బలాన్ని, న్యాయపరమైన నిష్క్రియ భావాన్ని రెండింటినీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయపరమైన మరణదండన సూత్రాన్ని అనువదించడం
  choice: తప్పకుండా మరణశిక్షకు గురికావాలి
  alternative: తప్పకుండా మరణించాలి
  rationale: హీబ్రూ מוֹת יוּמָת అక్షరార్థంగా ‘నిశ్చయంగా మరణింపజేయబడాలి/మరణించాలి’ అనే బలమైన నిష్క్రియ నిర్మాణం. సందర్భం న్యాయశిక్షను సూచిస్తున్నందున ఎంపిక చేసిన రూపం దాన్ని స్పష్టం చేస్తుంది; పాదసూచిక మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన న్యాయశైలి వాడబడింది. ‘శయనించే’ అనే సభ్యోక్తి మూలభాష రూపాన్ని కాపాడుతుంది; ‘మరణశిక్షకు గురికావాలి’ నిష్క్రియ న్యాయభావాన్ని సహజంగా తెలియజేస్తుంది.
