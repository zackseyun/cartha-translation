  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: te
  text: నీ పంటలోని పూర్తి దిగుబడినీ, నొక్కి తీసిన నీ ద్రవ దిగుబడినీ[a] సమర్పించడం ఆలస్యం చేయకూడదు. నీ కుమారులలో తొలిపుట్టినవాణ్ణి నాకు ఇవ్వాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సమృద్ధమైన పంటనూ, నీ రసాన్నీ.’ హీబ్రూ పదాలు కోసిన పంట దిగుబడినీ, పిండినప్పుడు లేదా నొక్కినప్పుడు వెలువడే ద్రవ దిగుబడినీ సూచిస్తున్నట్లు కనిపిస్తున్నాయి. ఈ జంట ప్రత్యేకంగా ధాన్యం–ద్రాక్షారసాన్ని సూచించవచ్చు; లేదా మరింత సాధారణంగా ఘన, ద్రవ దిగుబడులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: నీ పంట దిగుబడి
  rationale: మూలపదానికి అక్షరార్థంగా ‘నీ నిండుదనం’ అనే భావం ఉన్నా, ఈ వ్యవసాయ సంబంధమైన ధర్మశాసన సందర్భంలో అది పంటనుండి లభించే పూర్తి దిగుబడిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘పంట దిగుబడి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְדִמְעֲךָ
  choice: నీ గానుగ నుండి కారే రసం
  rationale: ఈ పదం సాధారణంగా ‘కన్నీరు’ అని అర్థమివ్వగలిగినా, ఇక్కడ వ్యవసాయ సందర్భంలో పిండగా లేదా నొక్కగా వెలువడే ద్రవరూప ఫలసాయాన్ని సూచిస్తుంది. ‘రసం’ అని అనడం ద్రాక్షారసం లేదా నూనె అని అవసరానికి మించి నిర్దిష్టం చేయకుండా మూలంలోని ద్రవ భావాన్ని నిలుపుతుంది.
- source_word: לֹא תְאַחֵר
  choice: అర్పించడంలో ఆలస్యం చేయకూడదు
  rationale: אחר పియేల్ రూపం ఆలస్యం చేయడం లేదా వాయిదా వేయడం అనే అర్థమిస్తుంది. తెలుగులో కర్మలను మాత్రమే ఉంచి ‘ఆలస్యం చేయవద్దు’ అనడం అసహజంగా ఉండటంతో, సందర్భం సూచించే అర్పణ చర్యను స్పష్టపరిచాం.
- source_word: בְּכוֹר בָּנֶיךָ
  choice: నీ కుమారుల్లో తొలిపుట్టినవాడు
  rationale: בְּכוֹר మొదట పుట్టిన సంతానాన్ని, בָּנֶיךָ ప్రత్యేకంగా ‘నీ కుమారులు’ అని సూచిస్తాయి. అందువల్ల లింగాన్ని తటస్థీకరించకుండా సహజమైన ఆధునిక తెలుగు రూపాన్ని వాడాం.
- source_word: תִּתֶּן לִּי
  choice: నాకు ఇవ్వాలి
  rationale: ఇది నేరుగా విధించబడిన ధర్మశాసన ఆజ్ఞ. ‘ఇవ్వాలి’ దాని ఆజ్ఞాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నాకు’ గ్రహీతపై ఉన్న స్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: מְלֵאָה / דִמְעָה అనే వ్యవసాయ పదజంట యొక్క పరిధి
  choice: ఘనరూప పంట దిగుబడినీ, గానుగ నుండి వచ్చే ద్రవరూప ఫలసాయాన్నీ ఆలస్యం చేయకుండా అర్పించాలనే ఆజ్ఞగా అనువదించాం.
  alternative: ఇవి ప్రత్యేకంగా ధాన్యం మరియు ద్రాక్షారసం అని అనువదించవచ్చు; లేదా రెండింటినీ సాధారణంగా ప్రథమఫలాలు అని చెప్పవచ్చు.
  rationale: హీబ్రూ పదజంట పంట దిగుబడిని, నొక్కడం ద్వారా వచ్చే ద్రవ ఫలసాయాన్ని సూచించే అవకాశం ఎక్కువ. రెండవ పదాన్ని కేవలం ద్రాక్షారసం లేదా నూనెగా పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలిపాం.
- issue: בָּנֶיךָ యొక్క లింగ నిర్దిష్టత
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: హీబ్రూ పదం సాధారణంగా పిల్లలు అని కాకుండా ప్రత్యేకంగా కుమారులు అని ఉంది. కాబట్టి మూలంలోని లింగ నిర్దిష్టతను నిలిపాం.
- issue: మొదటి భాగంలో అర్పణ చర్య అంతర్నిహితంగా ఉండటం
  choice: తెలుగులో భావం సంపూర్ణంగా ఉండేందుకు ‘అర్పించడంలో’ అని స్పష్టపరిచాం.
  alternative: ‘నీ పంట దిగుబడినీ, నీ గానుగ రసాన్నీ ఆలస్యం చేయవద్దు’ అని అక్షరానుసారంగా ఉంచవచ్చు.
  rationale: మూలంలో అర్పించడం అనే క్రియ ప్రత్యక్షంగా లేకపోయినా, కానుకలను ఆలస్యం చేయకూడదనే ధర్మశాసన సందర్భం దానిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో అపార్థం రాకుండా చర్యను స్పష్టం చేశాం; ఇది కానుకల స్వభావాన్ని మరింత నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ధర్మశాసన శైలిని వాడాం. ‘గానుగ నుండి కారే రసం’ అనే రూపం ప్రాచీన వ్యవసాయ చిత్రాన్ని నిలుపుతూ ద్రాక్షారసం లేదా నూనె అనే అతినిర్దిష్టతను నివారిస్తుంది. దేవుని ప్రత్యక్ష వాక్యంలోని ‘నాకు’ అనే ప్రథమ పురుష రూపాన్ని యథాతథంగా ఉంచాం.
