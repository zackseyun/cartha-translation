  to: నీ పంటలోని పూర్తి దిగుబడినీ, నొక్కి తీసిన నీ ద్రవ దిగుబడినీ[a] సమర్పించడం ఆలస్యం చేయకూడదు. నీ కుమారులలో తొలిపుట్టినవాణ్ణి నాకు ఇవ్వాలి.
