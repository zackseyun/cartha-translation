  yaml_path: translation/ot/exodus/039/028.yaml
  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: te
  text: సన్నని నారతో చేసిన తలపాగా, సన్నని నారతో చేసిన శోభాయమానమైన టోపీలు, మరియు మెలిపెట్టిన సన్నని నారతో చేసిన లోదుస్తులు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నారతో చేసిన లోదుస్తులు—మెలిపెట్టిన సన్నని నారతో చేసినవి.’ హీబ్రూ పదక్రమంలో చివరి మాటలు ముఖ్యంగా లోదుస్తులకు సంబంధించినవిగా వినిపిస్తాయి; అయితే అవి యాజక వస్త్రాల్లో అంతటా వాడిన పదార్థపు వర్ణనను కూడా ప్రతిధ్వనింపజేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: తలపాగా
  rationale: ప్రధాన యాజకుడు ధరించే ప్రత్యేకమైన తలచుట్టును సూచిస్తుంది. ఆధునిక తెలుగులో ‘తలపాగా’ సహజంగానూ సందర్భానికి తగిన స్పష్టతతోనూ ఉంది.
- source_word: שֵׁשׁ
  choice: సన్నని నార
  rationale: ఇది సాధారణ నారను మాత్రమే కాక, నాణ్యమైన సన్నని నారను సూచిస్తుంది. గుడారపు వస్త్రాలు, యాజక వస్త్రాల సందర్భంలో పదార్థపు నాణ్యతను ఈ అనువాదం నిలుపుతుంది.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: అలంకారమైన టోపీలు
  rationale: ఈ నిర్మాణం టోపీలకు శోభ లేదా అలంకార స్వభావం ఉందని సూచిస్తుంది; రెండు వేర్వేరు వస్తువులని కాదు. ‘అలంకారమైన టోపీలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: מִכְנְסֵי הַבָּד
  choice: నారతో చేసిన లోదుస్తులు
  rationale: ఇది యాజకులు నడుము కింది భాగంలో ధరించే వస్త్రాలను సూచిస్తుంది. పాతకాలపు లేదా అస్పష్టమైన పదం బదులు ‘లోదుస్తులు’ సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక పదం.
- source_word: מָשְׁזָר
  choice: పేనిన
  rationale: నార దారాలను మెలిపెట్టి లేదా పేని తయారుచేసిన వస్త్ర నిర్మాణాన్ని సూచిస్తుంది. ‘పేనిన’ సంక్షిప్తంగా, సహజంగా ఆ నూలు తయారీ విధానాన్ని తెలియజేస్తుంది.
