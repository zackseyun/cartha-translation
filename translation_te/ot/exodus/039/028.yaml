  text: וְ/אֵת֙ הַ/מִּצְנֶ֣פֶת שֵׁ֔שׁ וְ/אֶת פַּאֲרֵ֥י הַ/מִּגְבָּעֹ֖ת שֵׁ֑שׁ וְ/אֶת מִכְנְסֵ֥י הַ/בָּ֖ד שֵׁ֥שׁ מָשְׁזָֽר־־׃
