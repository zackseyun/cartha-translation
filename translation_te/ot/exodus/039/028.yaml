translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే యాజక వస్త్రాల సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని జాబితా నిర్మాణం, పదార్థపు పునరుక్తి నిలుపబడ్డాయి.
