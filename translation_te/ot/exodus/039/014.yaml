  naturalness: ‘ముద్ర చెక్కినట్లు చెక్కబడింది’లో అదే క్రియ పునరావృతం కావడం సహజంగా లేదు. ‘ముద్రికపై చెక్కినట్లు చెక్కబడ్డవి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సజావుగా ఉంది. ‘ప్రతి రాయిమీద దానికి సంబంధించిన పేరు’ అనేది పాఠకునికి వెంటనే అర్థమవుతుంది.
