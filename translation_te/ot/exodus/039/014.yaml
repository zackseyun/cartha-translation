translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని పేర్లు–పన్నెండు రాళ్లు–పన్నెండు గోత్రాలు అనే నిర్మాణ సంబంధాన్ని కాపాడుతూ, హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా సహజంగా మలిచాం.
