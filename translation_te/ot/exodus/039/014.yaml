  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: te
  text: ఆ రాళ్లు ఇశ్రాయేలు కుమారుల పేర్లకు అనుగుణంగా ఉన్నాయి[a]. వారి పేర్ల ప్రకారం అవి పన్నెండు ఉన్నాయి; ముద్రికపై చెక్కినట్లు చెక్కబడ్డవి[b]. ప్రతి రాయిమీద దానికి సంబంధించిన పేరు ఉంది, పన్నెండు గోత్రాల కోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు కుమారుల పేర్లు వాటిపై ఉన్నాయి.’ ఇక్కడి హీబ్రూ ఉపసర్గ పేర్లతో ఉన్న సన్నిహిత సంబంధాన్ని లేదా సరిపోలికను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పేర్లు ముద్రికపై చెక్కినట్లుగా చెక్కబడ్డాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: ఆ రాళ్లు
  rationale: సందర్భంలో ఇవి వక్షపటకంలోని రాళ్లు. మూలపదం సాధారణంగా ‘రాళ్లు’ అని అర్థమిస్తుంది; ‘రత్నాలు’ అనేది సందర్భానుసార విస్తరణ కాబట్టి ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పేర్లకు అనుగుణంగా
  rationale: עַל ఇక్కడ స్థలార్థకమైన ‘మీద’ కంటే అనుబంధం లేదా సరిపోలికను సూచిస్తుంది. ‘పేర్లకు అనుగుణంగా’ అనే రూపం ఆ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ సంధిపదానికి దగ్గరగా ఉండే సంప్రదాయ ఒడంబడిక సంబంధిత సంబోధనను నిలిపింది; ‘ఇశ్రాయేలీయులు’ కంటే మూలరూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: అవి పన్నెండు
  rationale: సర్వనామంతో కూడిన సంఖ్యావాచక వాక్యాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל שְׁמֹתָם
  choice: వారి పేర్ల ప్రకారం
  rationale: ముందటి పేర్ల-రాళ్ల సరిపోలికను పునరుద్ఘాటించే హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: פִּתּוּחֵי חֹתָם
  choice: ముద్ర చెక్కినట్లు చెక్కబడింది
  rationale: ముద్ర లేదా ముద్రికపై అక్షరాలను చెక్కే విధానాన్ని సూచించే పదబంధాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా అందిస్తుంది.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ఒక్కొక్క రాయిపై ఒక్కొక్క పేరు
  rationale: אִישׁ ఇక్కడ వ్యక్తిని సూచించడం కంటే విభజనార్థకంగా ‘ఒక్కొక్కటి’ అనే భావాన్ని ఇస్తుంది. సమీప సందర్భంలోని రాళ్లను స్పష్టీకరించి సహజమైన తెలుగులో తెలిపింది.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: పన్నెండు గోత్రాల కోసం
  rationale: לְ సూచించే సంబంధం లేదా ప్రతినిధిత్వాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
