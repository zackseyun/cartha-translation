  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: te
  text: సాక్ష్యపు మందసం, దానిని మోయే కడ్డీలు, ప్రాయశ్చిత్తపు మూత[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కరుణాపీఠం.’ హీబ్రూ పదం మందసపు మూతను సూచిస్తుంది; దానికి ప్రాయశ్చిత్త సంబంధమైన భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: మందసం
  rationale: నిబంధన పలకలను ఉంచే పవిత్ర పెట్టెను సూచించే గౌరవప్రదమైన, స్థిరమైన తెలుగు పదం.
- source_word: הָעֵדֻת
  choice: సాక్ష్యపు
  rationale: עֵדוּת అనే పదానికి ప్రత్యక్షంగా ‘సాక్ష్యం’ అనే అర్థం ఉంది; ‘నిబంధన’ అని అనువదించడం ఇక్కడ వ్యాఖ్యానాత్మకమవుతుంది.
- source_word: בַּדָּיו
  choice: దాని మోయు కడ్డీలు
  rationale: మందసాన్ని మోసేందుకు ఉపయోగించే కడ్డీలని సందర్భం స్పష్టం చేస్తుంది; ఈ రూపం ఆధునిక పాఠకునికి సులభంగా అర్థమవుతుంది.
- source_word: הַכַּפֹּרֶת
  choice: ప్రాయశ్చిత్తపు మూత
  rationale: ఇది మందసపు బంగారు మూతను సూచించడంతోపాటు దాని ప్రాయశ్చిత్త సంబంధాన్ని కూడా నిలుపుతుంది; కేవలం ‘మూత’ అనడం ఆ భావసూచనను కోల్పోతుంది.
theological_decisions:
- issue: כַּפֹּרֶת అనే ఆరాధనా సామగ్రి పదానికి అనువాదం
  choice: ప్రాయశ్చిత్తపు మూత
  alternative: కరుణాపీఠం
  rationale: మూలపదం మందసంపై ఉన్న మూతనే సూచిస్తూ ప్రాయశ్చిత్త సంబంధాన్నీ కలిగి ఉంది. ‘ప్రాయశ్చిత్తపు మూత’ వస్తువు స్వరూపాన్నీ ధార్మిక భావసూచననూ స్పష్టంగా ఉంచుతుంది; ‘కరుణాపీఠం’ సంప్రదాయబద్ధమైనదైనా అది కూర్చునే పీఠమనే అపార్థానికి దారితీయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా నిర్మాణాన్ని నిలిపాం. ‘మందసం’ పవిత్ర ఆరాధనా వస్తువుకు తగిన గౌరవప్రద పదం; ‘మోయు కడ్డీలు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
