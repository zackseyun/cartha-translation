source:
  edition: WLC
  text: וַ/יָּ֣שֶׂם אֹתָ֗/ם עַ֚ל כִּתְפֹ֣ת הָ/אֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే, అతడు వాటిని ఏఫోదు భుజభాగాలపై ఇశ్రాయేలు కుమారుల[b] కొరకు జ్ఞాపకార్థపు రాళ్లుగా[a] అమర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్మారక రాళ్లుగా.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: అతడు వాటిని … అమర్చాడు
  rationale: שׂוּם అంటే ‘పెట్టు/ఉంచు/అమర్చు.’ వస్త్రంపై రత్నాలను బిగించే పనిని సూచించే ఈ సందర్భంలో ‘అమర్చాడు’ సహజంగానూ నిర్దిష్టంగానూ ఉంది. ‘వాటిని’ అనేది ముందటి వచనంలోని రెండు గోమేధికపు రాళ్లను సూచిస్తుంది.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: ఏఫోదు భుజభాగాల మీద
  rationale: כָּתֵף ప్రాథమికంగా ‘భుజం’; ఇక్కడ ఏఫోదు వస్త్ర నిర్మాణంలోని భుజపు భాగాలను సూచిస్తుంది. ‘భుజభాగాలు’ మూలార్థాన్నీ సందర్భంలోని నిర్దిష్టతనూ కాపాడుతుంది.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: జ్ఞాపకార్థపు రాళ్లుగా
  rationale: ఈ నిర్మిత పదబంధం అక్షరార్థంగా ‘జ్ఞాపకపు/జ్ఞాపకార్థపు రాళ్లు.’ ‘జ్ఞాపకార్థపు రాళ్లు’ వాటి స్మారక కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: హీబ్రూ స్థిర పదబంధంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది ఇశ్రాయేలు ప్రజలను సూచిస్తుందని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే
  rationale: כַּאֲשֶׁר కార్యం ఆజ్ఞకు సరిగ్గా అనుగుణంగా జరిగిందని సూచిస్తుంది. తెలుగులో ఈ ఉపవాక్యాన్ని ముందుంచడం సహజంగా ఉండి, హీబ్రూ భావసంబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగరూపం మరియు సమూహార్థం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగా పుంలింగ బహువచనం గల స్థిర ఒడంబడిక వ్యక్తీకరణ. దాని రూపాన్ని ప్రధాన పాఠంలో నిలిపి, విస్తృత ప్రజాసమూహార్థాన్ని పాదసూచికలో తెలియజేయడం మూలానికి పారదర్శకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఏఫోదు’ అనే ఆరాధనా వస్త్రానికి సంబంధించిన సాంకేతిక పదం నిలుపబడింది; ‘భుజభాగాలు’ వస్త్ర నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది. మూలంలోని కార్యం–ఆజ్ఞ అనుగుణతను సహజ తెలుగు వాక్యక్రమంలో వ్యక్తం చేశారు.
