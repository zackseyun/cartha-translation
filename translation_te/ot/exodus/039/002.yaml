translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘ఏఫోదు’ అనే ఆరాధనా సంబంధిత పారిభాషిక పదాన్ని నిలిపి, పదార్థాల జాబితాను మూలంలోని క్రమంలో ఉంచాం. ఈ వచనానికి అవసరమైన నిజమైన పాఠ్య లేదా భావసందిగ్ధత లేకపోవడంతో పాదటిప్పణులు జోడించలేదు.
