source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת הָ/אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: te
  text: అతడు బంగారం, నీలం, ఊదా, ఎర్రని నూలు, సన్నగా పేనిన నారతో ఏఫోదును చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపించే సాధారణ భూతకాల క్రియ; తెలుగులో సహజమైన కథన క్రమాన్ని ఇస్తుంది.
- source_word: הָאֵפֹד
  choice: ఏఫోదును
  rationale: ఇది యాజకునికి సంబంధించిన ప్రత్యేక వస్త్రం; వివరణాత్మకంగా మార్చకుండా స్థిరపడిన పారిభాషిక పదంగా లిప్యంతరీకరించబడింది.
- source_word: זָהָב
  choice: బంగారం
  rationale: ఈ వచనం వస్తుసామగ్రిని సూటిగా పేర్కొంటుంది; తరువాతి సందర్భం బంగారు రేకులను నూలుగా చేసినట్లు వివరించినా, ఇక్కడ లేని ‘నూలు’ను దీనికి ప్రత్యేకంగా జోడించలేదు.
- source_word: תְּכֵלֶת
  choice: నీలం
  rationale: పరిశుద్ధ మందిరపు వస్త్రాలలో వాడిన నీలి రంగు పదార్థాన్ని సూచిస్తుంది; సరళమైన ఆధునిక తెలుగు రంగుపేరు ఎంచుకోబడింది.
- source_word: וְאַרְגָּמָן
  choice: ఊదా
  rationale: వస్త్రాలకు సంబంధించిన ప్రామాణిక ఊదా రంగు/రంగు పదార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: ఎర్రని నూలు
  rationale: ఈ సంయుక్త పదబంధం ఎర్ర రంగు వేసిన పదార్థాన్ని సూచిస్తుంది; వస్త్ర తయారీ సందర్భంలో ‘నూలు’ దాని భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר పేనిన/మెలిపెట్టిన స్వభావాన్ని సూచిస్తాయి; రెండు అంశాలనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
