id: EXO.39.30
reference: Exodus 39:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: te
  text: వారు స్వచ్ఛమైన బంగారంతో పవిత్ర కిరీటమైన పలకను చేసి, దానిమీద ముద్రపై చెక్కిన అక్షరాలవలె, “యాహ్వేకు పవిత్రం”[a] అని వ్రాశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు పవిత్రత.”
    reason: కֹדֶשׁ అనే హీబ్రూ పదాన్ని భావవాచక నామంగా కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: צִיץ
  choice: బంగారు పలక
  rationale: యాజక వస్త్రాల సందర్భంలో ఇది తలపాగాకు అమర్చిన బంగారు పలకను సూచిస్తుంది. తెలుగులో వస్తువు స్పష్టంగా ఉండేందుకు పదార్థాన్ని కలిపి ‘బంగారు పలక’ అని ఇచ్చాం.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: పవిత్ర కిరీటం
  rationale: נֵזֶר ప్రతిష్ఠిత కిరీటం లేదా శిరోభూషణాన్ని సూచిస్తుంది. ‘పవిత్ర కిరీటమైన బంగారు పలక’ అనే సమానాధికరణ నిర్మాణం రెండు నామాలనూ నిలుపుతుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: బంగారం కల్తీలేనిదని తెలిపే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: దానిమీద ... అని చెక్కారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘రాశారు’; అయితే బంగారు పలక, ముద్ర చెక్కడం అనే వెంట వచ్చే సందర్భం కారణంగా తెలుగులో ‘చెక్కారు’ సహజంగా శాసన స్వభావాన్ని తెలియజేస్తుంది.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: ముద్ర చెక్కినట్టుగా
  rationale: శాసనం ముద్రపై చెక్కే అక్షరాలవలె రూపొందించబడిందనే విధానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קֹדֶשׁ לַיהוָה
  choice: యెహోవాకు పవిత్రం
  rationale: హీబ్రూ శాసనంలోని సంక్షిప్త అంకిత భావాన్ని నిలుపుతూ, ‘యెహోవా కోసం ప్రత్యేకపరచబడింది’ అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: קֹדֶשׁ לַיהוָה అనే శాసనం
  choice: యెహోవాకు పవిత్రం
  alternative: యెహోవాకు పవిత్రత
  rationale: קֹדֶשׁ భావవాచక నామంగా ‘పవిత్రత’ అనీ, అంకిత స్థితిని తెలిపేలా ‘పవిత్రం’ అనీ అర్థమవుతుంది. ప్రధాన పాఠంలో సహజమైన అంకిత భావాన్ని ఇచ్చి, నిజమైన భాషాపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యాజక వస్త్రాలు మరియు శాసనానికి తగిన గంభీరతతో రూపొందించబడింది. సమానాధికరణ నిర్మాణం సహజంగా ఉండేందుకు ‘పవిత్ర కిరీటమైన బంగారు పలక’ అని ఇచ్చాం.
