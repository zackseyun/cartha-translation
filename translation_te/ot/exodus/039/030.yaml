- from: వారు పవిత్ర కిరీటమైన బంగారు పలకను స్వచ్ఛమైన బంగారంతో చేసి, దానిమీద ముద్ర చెక్కినట్టుగా, “యెహోవాకు పవిత్రం”[a] అని చెక్కారు.
  to: వారు స్వచ్ఛమైన బంగారంతో పవిత్ర కిరీటమైన పలకను చేసి, దానిమీద ముద్రపై చెక్కిన అక్షరాలవలె, “యాహ్వేకు పవిత్రం”[a] అని వ్రాశారు.
