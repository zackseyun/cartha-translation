translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని పాటించాం. రత్నాల ప్రాచీన గుర్తింపులోని నిజమైన అనిశ్చితిని ప్రధాన పాఠాన్ని భారంగా చేయకుండా పాదసూచికలో నిలిపాం. ‘మణిపచ్చ,’ ‘నీలమణి,’ ‘వజ్రం’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన రత్ననామాలు.
