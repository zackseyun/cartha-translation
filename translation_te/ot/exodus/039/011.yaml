  edition: WLC
  text: וְ/הַ/טּ֖וּר הַ/שֵּׁנִ֑י נֹ֥פֶךְ סַפִּ֖יר וְ/יָהֲלֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/011.yaml
  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: te
  text: 'మరియు రెండవ వరుసలో: మణిపచ్చ[a], నీలమణి, వజ్రం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ పేర్కొన్న కొన్ని ప్రాచీన రత్నాలను ఖచ్చితంగా గుర్తించడం కష్టం. נֹפֶךְ అనే పదాన్ని ‘మరకతం’ లేదా ‘కెంపు’ అని కూడా అనువదించవచ్చు; יָהֲלֹם అనే పదాన్ని ‘హయసింత రత్నం’ లేదా ‘సూర్యకాంతం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: వరుసలో
  rationale: ఛాతీపతకంలోని రత్నాల అమరిక సందర్భంలో טוּר అనేది రత్నాల వరుసను సూచిస్తుంది. ముందున్న వాక్యంతో అనుసంధానించే וְ ను సహజమైన తెలుగు జాబితా నిర్మాణంలో విడిగా ‘మరియు’ అని పలకకుండా వ్యక్తం చేశాం.
- source_word: הַ/שֵּׁנִי
  choice: రెండవ
  rationale: ఇది ‘రెండవ’ అనే క్రమసంఖ్యావాచకం; ‘రెండవ వరుసలో’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: נֹפֶךְ
  choice: మణిపచ్చ
  rationale: ఈ ప్రాచీన రత్నం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం. నీలపచ్చ రత్నం, మరకతం, కెంపు వంటి ప్రతిపాదనల మధ్య, తెలుగు పాఠకులకు పరిచితమైన సంప్రదాయ రత్ననామంగా ‘మణిపచ్చ’ను ప్రధాన పాఠంలో ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: סַפִּיר
  choice: నీలమణి
  rationale: సాధారణంగా ‘sapphire’గా అనువదించే ఈ పదానికి సహజమైన, స్థిరపడిన తెలుగు రత్ననామం ‘నీలమణి’; ప్రాచీన ఖనిజం ఆధునిక సఫైర్‌తో పూర్తిగా సమానమా అన్నది నిర్ధారితం కాదు.
- source_word: וְ/יָהֲלֹם
  choice: వజ్రం
  rationale: יָהֲלֹם యొక్క ఖచ్చిత గుర్తింపు కూడా అనిశ్చితం. ‘వజ్రం’ సాధారణ సంప్రదాయ అనువాదం; ‘హయసింత రత్నం’ లేదా ‘సూర్యకాంతం’ వంటి ప్రత్యామ్నాయాలను పాదసూచికలో భద్రపరిచాం. సంధికారక וְ ను తెలుగు జాబితా విరామంతో సహజంగా వ్యక్తం చేశాం.
