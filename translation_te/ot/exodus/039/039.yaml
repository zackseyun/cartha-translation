source:
  edition: WLC
  text: אֵ֣ת מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת וְ/אֶת מִכְבַּ֤ר הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁר ל֔/וֹ אֶת בַּדָּ֖י/ו וְ/אֶת כָּל כֵּלָ֑י/ו אֶת הַ/כִּיֹּ֖ר וְ/אֶת כַּנּֽ/וֹ׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/039.yaml
  text: the bronze altar[a], and the bronze grating that was for it, its poles, and all its utensils; the basin and its stand[b];
translation:
  language: te
  text: కంచు బలిపీఠాన్ని, దానికి చెందిన కంచు జాలకాన్ని[a], దాని మోసే కర్రలను, దాని పనిముట్లన్నిటినీ, గంగాళాన్ని, దాని ఆధారాన్ని[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కంచు కడ్డీల అల్లికను”; లేదా, “కంచు వలను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని పీఠాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: מִזְבַּח అంటే బలిపీఠం. ఈ సందర్భంలో అది దహనబలి అర్పించే బలిపీఠమే అయినా, హీబ్రూ వాక్యంలో పూర్తి పేరు మళ్లీ లేదు; అందువల్ల సంక్షిప్త రూపాన్ని నిలిపాం. נְחֹשֶׁתకు రాగి లేదా కంచు అనే అర్థాలు సాధ్యమైనా, గుడారపు సామగ్రి సందర్భంలో ‘కంచు’ సహజమైన సంప్రదాయ పదం.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: కంచు జాలి
  rationale: מִכְבַּר బలిపీఠానికి సంబంధించిన జాలకపు నిర్మాణాన్ని సూచిస్తుంది. ‘జాలి’ ఆధునిక పాఠకులకు సులభంగా అర్థమవుతూ, మూలంలోని వస్తువు ఆకృతిని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲשֶׁר לוֹ
  choice: దానికి చెందిన
  rationale: ఈ సంబంధవాచక పదబంధం కంచు జాలి బలిపీఠానికి సంబంధించినదని తెలుపుతుంది. అది బలిపీఠం మీదా, లోపలా, కిందా ఉందని మూలం ఇక్కడ స్పష్టంగా చెప్పదు; కాబట్టి స్థానాన్ని నిర్దిష్టం చేయలేదు.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలు
  rationale: בַּדִּים గుడారపు వస్తువులను మోసేందుకు ఉపయోగించే కర్రలు. ‘మోతకర్రలు’ వాటి కార్యాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כָּל־כֵּלָיו
  choice: దాని సామగ్రినంతటినీ
  rationale: כֵּלִים అనేది పనిముట్లు, పాత్రలు, ఇతర ఉపకరణాలను కలుపుకొనే విస్తృత పదం. ‘సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: כִּיֹּר
  choice: గంగాళం
  rationale: כִּיֹּר కడుక్కోవడానికి ఉపయోగించే పెద్ద పాత్రను సూచిస్తుంది. ‘గంగాళం’ తెలుగు బైబిలు సందర్భంలో గుర్తించదగినదిగా ఉండి, సాధారణ ‘పాత్ర’ కంటే వస్తువును స్పష్టంగా సూచిస్తుంది.
- source_word: כַּנּוֹ
  choice: దాని పీఠం
  rationale: כֵּן ఇక్కడ గంగాళానికి ఆధారంగా ఉండే భాగాన్ని సూచిస్తుంది. ‘పీఠం’ ఆధారం లేదా నిలువు అమరిక అనే భావాన్ని సహజంగా అందిస్తుంది.
