translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా రూపంలోని హీబ్రూ వాక్యనిర్మాణాన్ని నిలుపుతూ సహజమైన పదక్రమం వాడబడింది. ఈ వచనం ముందున్న క్రియపై ఆధారపడే జాబితా భాగం కాబట్టి చివరలో అర్ధవిరామం ఉంచబడింది. ప్రతి వస్తువును సూచించే కర్మరూపం తెలుగు వాక్యసంబంధానికి అనుగుణంగా ఇచ్చాం.
