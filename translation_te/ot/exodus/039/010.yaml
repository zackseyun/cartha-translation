  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: te
  text: వారు దానిలో నాలుగు వరుసల రత్నాలను పొదిగారు. మొదటి వరుసలో కెంపు[a], పుష్యరాగం, మరకతం ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ రత్నాల ఖచ్చితమైన గుర్తింపు అనిశ్చితం. ‘కెంపు,’ ‘పుష్యరాగం,’ ‘మరకతం’ అనేవి సాధారణ సంప్రదాయ పేర్లు. వీటికి వరుసగా ‘కార్నేలియన్,’ ‘క్రిసొలైట్,’ అలాగే మరొక ప్రకాశవంతమైన ఆకుపచ్చ లేదా మెరుస్తున్న రాయి అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: పొదిగారు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘నింపారు’ అనే భావం ఉన్నా, రత్నాలను వక్షపతకంలో అమర్చే సందర్భంలో ‘పొదిగారు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: בּוֹ
  choice: దానిలో
  rationale: ఈ సర్వనామం ముందున్న వక్షపతకాన్ని సూచిస్తుంది; రత్నాలను దానిలో పొదిగినట్లు తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: నాలుగు వరుసల రత్నాలు
  rationale: אָבֶן ఇక్కడ సమష్టిగా రాళ్లను, ప్రత్యేకంగా విలువైన రత్నాలను సూచిస్తుంది; ఆభరణ సందర్భంలో ‘రత్నాలు’ స్పష్టంగా ఉంటుంది.
- source_word: טוּר
  choice: వరుస
  rationale: నాలుగు సమాంతర శ్రేణుల్లో మొదటిదాన్ని సూచించే సాధారణ, సహజమైన తెలుగు పదం.
- source_word: אֹדֶם
  choice: కెంపు
  rationale: ఖచ్చితమైన రత్న గుర్తింపు అనిశ్చితం. ఎర్రని విలువైన రత్నానికి సంప్రదాయ తెలుగు పేరు ‘కెంపు’; ఇతర అవకాశం ‘కార్నేలియన్’.
- source_word: פִּטְדָה
  choice: పుష్యరాగం
  rationale: ఖచ్చిత గుర్తింపు అనిశ్చితమైనప్పటికీ, టోపాజ్‌కు సంప్రదాయ తెలుగు రత్ననామం ‘పుష్యరాగం’.
- source_word: בָרֶקֶת
  choice: మరకతం
  rationale: ఈ పదం మెరుస్తున్న లేదా ప్రకాశించే రాయిని సూచించి ఉండవచ్చు; సంప్రదాయంగా ఎమరాల్డ్‌కు వాడే తెలుగు పేరు ‘మరకతం’.
- source_word: הַטּוּר הָאֶחָד
  choice: మొదటి వరుసలో
  rationale: నాలుగు వరుసల్లో మొదటిదాన్ని సందర్భం స్పష్టంగా సూచిస్తుంది; జాబితాను తెలుగులో సహజంగా పరిచయం చేయడానికి ఈ రూపం వాడబడింది.
