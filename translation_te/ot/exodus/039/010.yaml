translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సామగ్రి వివరణకు తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. రత్ననామాల సంప్రదాయ రూపాలను ప్రధాన పాఠ్యంలో ఉంచి, మూలంలోని నిఘంటు అనిశ్చితిని పాదసూచికలో కాపాడాం.
