- source_word: הַחֹשֶׁן
  choice: వక్షపటాన్ని
  rationale: యాజక వస్త్ర సందర్భంలోని ఛాతిమీద ధరించే ప్రత్యేక వస్తువుకు స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: זֶרֶת
  choice: ఒక జానెడు
  rationale: ప్రాచీన ‘span’ కొలతకు తెలుగులో ప్రాచుర్యమున్న శరీరాధారిత కొలమాన పదం; ఆధునిక ప్రమాణంలోకి మార్చకుండా మూలాన్ని నిలుపుతుంది.
- source_word: אָרְכּוֹ
