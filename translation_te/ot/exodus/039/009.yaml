- source_word: רָחְבּוֹ
  choice: దాని వెడల్పు
  rationale: ఆధునిక తెలుగులో సహజమైన కొలత పదం.
- source_word: כָּפוּל
  choice: రెండుమడతలుగా ఉన్నప్పుడు
  rationale: చివర పునరుక్తమైన పదాన్ని కొలతలు మడిచిన స్థితిలో వర్తిస్తాయని సహజ తెలుగులో తెలియజేసేలా ఉంచింది.
