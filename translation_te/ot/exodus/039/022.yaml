id: EXO.39.22
reference: Exodus 39:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מְעִ֥יל הָ/אֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: te
  text: అతడు ఏఫోదు పైవస్త్రాన్ని నేతవాని పనిగా, పూర్తిగా నీలిరంగులో చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం సన్నిధి గుడారంలోనూ యాజకుల వస్త్రాల్లోనూ ఉపయోగించిన విలువైన నీలిరంగు అద్దిన వస్త్ర పదార్థాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-అనుక్రమ నిర్మాణం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; తెలుగులో సహజమైన కథనశైలికి ‘చేశాడు’ సరిపోతుంది.
- source_word: מְעִיל הָאֵפֹד
  choice: ఏఫోదు అంగీని
  rationale: מְעִיל యాజక వస్త్రసందర్భంలో పొడవైన పైవస్త్రాన్ని సూచిస్తుంది; ‘అంగీ’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది. אֵפֹד ప్రత్యేక యాజక వస్త్రానికి సాంకేతిక పదం కాబట్టి లిప్యంతరీకరించబడింది.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: నేతపనిగా
  rationale: అక్షరార్థంగా ‘నేతవాని పని’; వస్త్రం నేయబడిన పనితనాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כְּלִיל
  choice: పూర్తిగా
  rationale: వస్త్రమంతటినీ గురించి చెప్పే సంపూర్ణత భావాన్ని కాపాడుతుంది.
- source_word: תְּכֵלֶת
  choice: నీలి వస్త్రంతో
  rationale: ఈ పదం కేవలం రంగును మాత్రమే కాక, ప్రత్యక్ష గుడారంలోనూ యాజక వస్త్రాల్లోనూ వాడిన విలువైన నీలిరంగు అద్దిన నూలు/వస్త్ర పదార్థాన్ని సూచిస్తుంది. సందర్భానికి సహజంగా ‘నీలి వస్త్రంతో’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. సాంకేతిక యాజక వస్త్రపదమైన ‘ఏఫోదు’ అలాగే ఉంచబడింది. ఆంగ్ల సంప్రదింపు పాఠంలోని పాదసూచిక గుర్తులు విషయంతో సరిపోలకపోవడంతో, మూల హీబ్రూ ఆధారంగా ఒక్క సాంస్కృతిక వివరణ పాదసూచికగా ఇవ్వబడింది; దాని [a] గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
