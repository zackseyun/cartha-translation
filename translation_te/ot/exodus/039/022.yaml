revisions:
- from: అతడు ఏఫోదు అంగీని నేతపనిగా, పూర్తిగా నీలి వస్త్రంతో చేశాడు.[a]
  to: అతడు ఏఫోదు పైవస్త్రాన్ని నేతవాని పనిగా, పూర్తిగా నీలిరంగులో చేశాడు.[a]
  rationale: The revision more explicitly represents the Hebrew ‘robe of the ephod’ and ‘work of a weaver,’ while rendering כְּלִיל תְּכֵלֶת as the robe being wholly blue. The note preserves the cultural-textile nuance of תְּכֵלֶת without requiring the main text to specify an uncertain precise fiber or dye composition.
