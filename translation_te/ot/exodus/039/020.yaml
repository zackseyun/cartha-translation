translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. స్థలసంబంధ పదబంధాల సంక్లిష్ట క్రమాన్ని డాష్‌ల మధ్య ఉంచి స్పష్టత కల్పించాం. మూలంలోని מֶחְבַּרְתּוֹ పదాన్ని ‘కుట్టు’గా పరిమితం చేయకుండా ‘కలిసే చోటు’గా అనువదించి దాని నిజమైన అనిశ్చితిని కాపాడాం.
