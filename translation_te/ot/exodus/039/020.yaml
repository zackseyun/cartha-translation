  text: וַֽ/יַּעֲשׂוּ֮ שְׁתֵּ֣י טַבְּעֹ֣ת זָהָב֒ וַֽ/יִּתְּנֻ֡/ם עַל שְׁתֵּי֩ כִתְפֹ֨ת הָ/אֵפֹ֤ד מִ/לְ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: te
  text: వారు రెండు బంగారు ఉంగరాలు చేసి, వాటిని ఏఫోదు రెండు భుజ భాగాలపై, దాని ముందుభాగంలో దిగువన, అది కలిసే చోటుకు ఎదురుగా, ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టుకు పైన అమర్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: లోహంతో చేసిన అనుసంధాన ఉంగరాలను సూచించే సాధారణ అర్థం; ఈ సందర్భంలో సహజమైనది, ఖచ్చితమైనది.
- source_word: כִתְפֹת
  choice: భుజపు భాగాలు
  rationale: శరీర భుజాలను కాకుండా ఏఫోదు వస్త్రంలోని భుజాలపై ఉండే భాగాలను సూచిస్తుంది.
- source_word: מִלְמַטָּה
  choice: కింద
  rationale: ఉంగరాల దిగువ స్థానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִמּוּל פָּנָיו
  choice: దాని ముందువైపున
  rationale: అక్షరార్థంగా ‘దాని ముఖానికి ఎదురుగా/ముందు’; వస్త్రం విషయంలో ‘ముందువైపు’ సహజమైన తెలుగు.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: అది కలిసే చోటుకు ఎదురుగా
  rationale: భాగాలు కలిసే లేదా అనుసంధానమయ్యే స్థానంతో ఉన్న అమరిక సంబంధాన్ని చూపుతుంది; ‘కుట్టు’ అని మరీ నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: חֵשֶׁב
  choice: నైపుణ్యంగా నేసిన నడికట్టు
  rationale: ఏఫోదులో భాగమైన, నేసిన బెల్టు వంటి బిగింపు పట్టీని సూచిస్తుంది; సందర్భంలోని నైపుణ్య వస్త్రపనిని కూడా వ్యక్తం చేస్తుంది.
- source_word: אֵפֹד
  choice: ఏఫోదు
  rationale: ప్రధాన యాజకుని ప్రత్యేక వస్త్రానికి సాంకేతిక పదం; సమానార్థకమైన సాధారణ తెలుగు వస్త్రపదం లేనందున లిప్యంతరీకరణ చేయబడింది.
- source_word: וַיִּתְּנֻם
  choice: అమర్చారు
  rationale: ఉంగరాలను నిర్దిష్ట స్థానంలో పెట్టి జోడించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
