  source_fidelity: మూల హీబ్రూలో ఛాతీపటం ఏఫోదు పనితనంలాగే, నమూనాలతో కూడిన నైపుణ్యమైన పనితనంతో చేయబడిందని, ఆపై దాని పదార్థాలను పేర్కొంటుంది. ముసాయిదా ఈ ప్రధాన భావాన్ని అందించినా, “నైపుణ్యంతో నమూనాలు అల్లిన పనిగా” అనే నిర్మాణం తెలుగులో అసహజంగా ఉంది; అలాగే “ఎర్రని” కంటే ‘కెంపు రంగు’ అనేది תּוֹלַעַת שָׁנִיకి మరింత నిర్దిష్టం.
