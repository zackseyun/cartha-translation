language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/חֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּ/מַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: te
  text: అతడు ఏఫోదు పనితనంలాగే, నమూనాలతో కూడిన నైపుణ్యమైన పనితనంతో ఛాతీపటాన్ని[a] తయారు చేశాడు[b]. దానిని బంగారంతో, నీలిరంగు, ఊదారంగు, కెంపు రంగు నూలుతో, మెలిపెట్టిన మెత్తని నారబట్టతో తయారు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా “ఛాతీకవచం.” అయితే ఇది లోహపు యుద్ధకవచం కాదు; ఏఫోదుతో అనుసంధానమైన యాజక వస్త్రభాగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నైపుణ్యంగల కళాకారుని పని.” హీబ్రూ పదబంధం నమూనాలతో కూడిన కళాత్మక పనితనాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... తయారు చేశాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల చర్యను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ప్రారంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించలేదు.
- source_word: הַחֹשֶׁן
  choice: ఛాతీపటం
  rationale: ఇది ఏఫోదుతో అనుసంధానమైన యాజకుని ఛాతీపై ధరించే ప్రత్యేక వస్తువు. ‘ఛాతీకవచం’ అంటే లోహపు యుద్ధకవచమనే తప్పుదారి పట్టించే భావం రావచ్చు; ‘ఛాతీపటం’ వస్త్ర సంబంధమైన స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంతో నమూనాలు అల్లిన పని
  rationale: ఈ పదబంధం సాధారణ తయారీని మాత్రమే కాక, యోచనతో రూపొందించిన నమూనాలుగల నైపుణ్యమైన నేతపనిని సూచిస్తుంది.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ఏఫోదును చేసిన విధంగానే
  rationale: ఛాతీపటం తయారీ విధానాన్ని, పనితనాన్ని ఏఫోదుతో పోల్చుతున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵפֹד
  choice: ఏఫోదు
  rationale: దీనికి సరిగ్గా సరిపోయే సాధారణ తెలుగు పదం లేని కారణంగా, యాజక వస్త్రానికి సంబంధించిన ప్రత్యేక పారిభాషిక పదాన్ని లిప్యంతరీకరించాం.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: బంగారం, నీలం, ఊదా, ఎర్రని నూలు
  rationale: మందిరపు వస్త్రాల సందర్భంలోని బంగారం, రంగు వేసిన నూలు పదార్థాల జాబితాను స్పష్టంగా అందిస్తుంది; ‘నూలు’ అనేది రంగులన్నిటికీ వర్తించేలా తెలుగులో సహజంగా ఉంచాం.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: మెలిపెట్టిన సన్నని నార
  rationale: שֵׁשׁ సన్నని నారను, מָשְׁזָר మెలిపెట్టి చేసిన దారాన్ని సూచిస్తాయి. ఈ రెండింటి వస్త్ర సంబంధమైన వివరాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘ఏఫోదు’ అనే ప్రత్యేక ఆరాధనా పదాన్ని లిప్యంతరీకరించగా, వస్త్ర తయారీకి సంబంధించిన పదాలను సహజమైన తెలుగు రూపాల్లో ఇచ్చాం.
