  terminology: ‘ఏఫోదు’ను పారిభాషిక లిప్యంతరీకరణగా, ‘ఛాతీపటం’ను armor-సూచనను నివారించే పదంగా ఉంచాం. ‘నమూనాలతో కూడిన నైపుణ్యమైన పనితనం’ מַעֲשֵׂה חֹשֵׁב యొక్క కళాత్మక/నమూనా-రూపకల్పన భావాన్ని, నేతపని మాత్రమే అని అనవసరంగా పరిమితం చేయకుండా నిలుపుతుంది.
