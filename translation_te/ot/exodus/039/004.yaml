translation:
  language: te
  text: వారు దానికి అనుసంధానమైన భుజపు భాగాలను[a] చేశారు; దాని రెండు చివరల వద్ద అది అనుసంధానించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భుజపు పట్టీలు.’ హీబ్రూ పదం ఏఫోదులో భుజాలపై ఉండి, దాని భాగాలను కలిపే భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: భుజపు భాగాలు
  rationale: ఈ బహువచన నామవాచకం అక్షరార్థంగా భుజాలకు సంబంధించినదైనా, ఏఫోదు సందర్భంలో భుజాలపై ఉండి దాని విభాగాలను కలిపే నిర్మిత భాగాలను సూచిస్తుంది.
- source_word: עָשׂוּ
  choice: వారు చేశారు
  rationale: עשה అనే సాధారణ క్రియ యొక్క Qal perfect 3cp రూపం; ఈ అధ్యాయంలోని తయారీ చర్యల వరుసకు సరిపోయే నేరమైన అనువాదం.
- source_word: לוֹ
  choice: దానికి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలో పుంలింగ నామవాచకమైన ఏఫోదును సూచిస్తుంది; తెలుగులో నిర్జీవ వస్తువుకు సహజంగా ‘దానికి’ వాడబడుతుంది.
- source_word: חֹבְרֹת
  choice: జతచేశారు
  rationale: חבר అంటే కలపడం లేదా జతచేయడం. భుజపు భాగాలు ఏఫోదుతో అనుసంధానించబడ్డాయని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: עַל
  choice: వద్ద
  rationale: ‘రెండు చివరలు’తో కలిసినప్పుడు స్థానాన్ని సూచించడానికి ‘వద్ద’ సహజమైన తెలుగు ప్రయోగం.
- source_word: שְׁנֵי קצוותו
  choice: దాని రెండు చివరలు
  rationale: ఏఫోదు యొక్క రెండు అంచు భాగాలను సూచించే స్పష్టమైన, సాధారణ తెలుగు పదబంధం.
- source_word: חֻבָּר
  choice: అది జతచేయబడింది
  rationale: חבר యొక్క Pual perfect 3ms నిష్క్రియ రూపాన్ని నిలుపుతూ, మూలంలోని అనుసంధాన పదపునరుక్తిని కూడా కాపాడుతుంది.
