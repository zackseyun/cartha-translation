source:
  edition: WLC
  text: וַ/יַּ֨רְא מֹשֶׁ֜ה אֶת כָּל הַ/מְּלָאכָ֗ה וְ/הִנֵּה֙ עָשׂ֣וּ אֹתָ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה כֵּ֣ן עָשׂ֑וּ וַ/יְבָ֥רֶךְ אֹתָ֖/ם מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: te
  text: మోషే ఆ పని అంతటినీ చూశాడు. ఇదిగో, యాహ్వే ఆజ్ఞాపించినట్లుగానే వారు దానిని చేశారు; అలాగే చేశారు. మోషే వారిని ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: చూశాడు
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక అర్థం ‘చూచుట’. పూర్తయిన పనిని మోషే పరిశీలించిన భావం సందర్భంలో స్పష్టమవుతుంది; ‘పరిశీలించాడు’ అని విస్తరించకుండా మూలంలోని సరళతను నిలుపుతుంది.
- source_word: כָּל הַמְּלָאכָה
  choice: ఆ పని అంతటినీ
  rationale: מְלָאכָה ఇక్కడ మందిరనివాస నిర్మాణానికి సంబంధించిన మొత్తం పనిని సూచిస్తుంది. ‘ఆ పని అంతటినీ’ సహజమైన ఆధునిక తెలుగు; సమగ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה శ్రద్ధను ఆకర్షించి, గమనించిన విషయానికి ఉద్ఘాటన ఇస్తుంది. ‘ఇదిగో’ దాని కథన విధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עָשׂוּ אֹתָהּ
  choice: వారు దాన్ని చేశారు
  rationale: עשה విస్తృతంగా ‘చేయు/తయారుచేయు’ అనే అర్థాలనిస్తుంది. ఇక్కడ సర్వనామం మొత్తం పనిని తిరిగి సూచిస్తుంది; ‘దాన్ని చేశారు’ మూలంలోని పదపునరుక్తిని కూడా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: యెహోవా ఆజ్ఞాపించినట్లుగానే
  rationale: כַּאֲשֶׁר ఖచ్చితమైన అనురూపతను సూచిస్తుంది. ‘ఆజ్ఞాపించినట్లుగానే’ వారు ఆ ఆజ్ఞకు పూర్తిగా అనుగుణంగా చేసిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: כֵּן עָשׂוּ
  choice: అవును, అలాగే చేశారు
  rationale: హీబ్రూలో עשה పునరుక్తి వారి ఖచ్చితమైన విధేయతను ఉద్ఘాటిస్తుంది. తెలుగులో ‘అవును’ అనే ధృవీకరణతో రెండో వాక్యభాగాన్ని నిలిపి, అసహజత లేకుండా ఆ ఉద్ఘాటనను కాపాడాం.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: మోషే వారిని ఆశీర్వదించాడు
  rationale: ברך పియేల్ రూపానికి నేరమైన, సహజమైన తెలుగు ‘ఆశీర్వదించాడు’. మూలంలో లేని వివరణను జోడించదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ అనేది పండితులలో సాధారణమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘చేశారు ... చేశారు’ అనే ఉద్దేశపూర్వక పునరుక్తిని సహజంగా నిలుపుతూ, వాక్యప్రవాహం కోసం రెండో భాగంలో ‘అవును’ చేర్చబడింది.
