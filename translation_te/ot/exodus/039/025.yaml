  text: וַ/יַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַ/יִּתְּנ֨וּ אֶת הַ/פַּֽעֲמֹנִ֜ים בְּ/ת֣וֹךְ הָ/רִמֹּנִ֗ים עַל שׁוּלֵ֤י הַ/מְּעִיל֙ סָבִ֔יב בְּ/ת֖וֹךְ הָ/רִמֹּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: te
  text: వారు స్వచ్ఛమైన బంగారంతో గంటలు చేసి, ఆ గంటలను దానిమ్మపండ్ల మధ్య[a], అంగీ కింది అంచు చుట్టూ, దానిమ్మపండ్ల మధ్య అమర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దానిమ్మపండ్ల నడుమ’ లేదా ‘దానిమ్మపండ్ల మధ్యలో.’ హీబ్రూ పదబంధానికి అక్షరార్థంగా ‘దానిమ్మపండ్ల మధ్యలో’ అని అర్థం; గంటలను దానిమ్మ ఆకారపు అలంకారాలకు సంబంధించి ఎక్కడ అమర్చారో ఇది వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు ... చేసి
  rationale: ఈ రూపం వరుసగా జరిగిన నిర్మాణ కార్యాన్ని తెలియజేస్తుంది; తెలుగులో సహజమైన కథన ప్రవాహం కోసం అసమాపక క్రియను వాడాం.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో గంటలు
  rationale: గంటల పదార్థాన్నీ బంగారం స్వచ్ఛతనూ స్పష్టంగా నిలుపుతుంది; మూలంలో లేని ‘చిన్న’ అనే భావాన్ని చేర్చలేదు.
- source_word: וַיִּתְּנוּ
  choice: అమర్చారు
  rationale: ఇక్కడ נתן అంటే అలంకారాలను నిర్ణీత స్థానంలో ఉంచడం; ‘అమర్చారు’ సందర్భానికి తగిన సహజ తెలుగు.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: దానిమ్మపండ్ల మధ్య
  rationale: పదబద్ధంగా ‘మధ్యలో’ అనే భావం ఉన్నా, అలంకారాల అమరికను తెలుగులో ‘మధ్య’ సహజంగా తెలియజేస్తుంది; ‘ఒక్కొక్కటి మధ్య’ అనే మరింత నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా విధించలేదు.
- source_word: הָרִמֹּנִים
  choice: దానిమ్మపండ్లు
  rationale: సందర్భంలో ఇవి దానిమ్మ ఆకారపు అలంకారాలు; అయినా మూలపాఠం నేరుగా ‘దానిమ్మపండ్లు’ అని చెప్పడం వల్ల అదే రూపక నామాన్ని నిలిపాం.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: అంగీ కింది అంచు
  rationale: שׁוּלֵי వస్త్రపు దిగువ అంచును సూచిస్తుంది; מְעִיל యాజక వస్త్రమైన అంగీని సూచిస్తుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అంగీ కింది అంచు అంతటా వలయాకారంగా ఉన్న అమరికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: దానిమ్మపండ్ల మధ్య
  rationale: అమరికను నొక్కిచెప్పే హీబ్రూ పునరుక్తిని తొలగించకుండా తెలుగులోనూ నిలిపాం.
