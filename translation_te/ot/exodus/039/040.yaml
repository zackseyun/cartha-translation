revisions:
- from: ప్రాంగణపు[a] చుట్టు తెరలను, దాని స్తంభాలను, పీఠాలను[b], ప్రాంగణ ముఖద్వారపు తెరను, దాని తాళ్లను[c], మేకులను, అలాగే సమావేశ గుడారం కోసం నివాస గుడారపు సేవకు ఉపయోగించే పరికరాలన్నిటిని;
  to: ప్రాంగణపు[a] చుట్టు తెరలను, దాని స్తంభాలను, వాటి అడుగు కుదుళ్లను[b], ప్రాంగణ ముఖద్వారపు తెరను, తాళ్లను[c], మేకులను, అలాగే సమావేశ గుడారమైన నివాస గుడారపు సేవకు అవసరమైన పరికరాలన్నిటిని;
