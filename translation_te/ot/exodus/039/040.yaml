base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: te
  text: ప్రాంగణపు[a] చుట్టు తెరలను, దాని స్తంభాలను, వాటి అడుగు కుదుళ్లను[b], ప్రాంగణ ముఖద్వారపు తెరను, తాళ్లను[c], మేకులను, అలాగే సమావేశ గుడారమైన నివాస గుడారపు సేవకు అవసరమైన పరికరాలన్నిటిని;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆవరణపు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆధారాలను.’ ఇవి స్తంభాలను అమర్చే అడుగు భాగాలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘త్రాళ్లను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: చుట్టు తెరలు
  rationale: ప్రాంగణాన్ని చుట్టి ఆవరణగా నిలిచే నేసిన వస్త్రాలను సూచిస్తుంది. ముఖద్వారంలోని ప్రత్యేక తెరతో భేదం స్పష్టంగా ఉండేందుకు ‘చుట్టు తెరలు’ అని అనువదించాం.
- source_word: חָצֵר
  choice: ప్రాంగణం
  rationale: నివాస గుడారం చుట్టూ ఉన్న మూసివేసిన పవిత్ర బయటి స్థలాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: עַמֻּדֶיהָ
  choice: దాని స్తంభాలు
  rationale: ప్రాంగణపు తెరలకు ఆధారంగా నిలిచే నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
- source_word: אֲדָנֶיהָ
  choice: పీఠాలు
  rationale: స్తంభాలు అమర్చబడే లోహపు అడుగు భాగాలను పాఠకులకు అర్థమయ్యేలా సూచించే పదం; సాంకేతికంగా ‘కుదుళ్లు’ అనే భావం కూడా ఉంది.
- source_word: הַמָּסָךְ
  choice: తెర
  rationale: ప్రాంగణపు చుట్టు తెరలకు భిన్నంగా, ముఖద్వారానికి అమర్చిన ప్రవేశ తెరను సందర్భం స్పష్టం చేస్తుంది.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: ప్రాంగణ ముఖద్వారపు
  rationale: ఇది ప్రాంగణ ప్రవేశానికి చెందిన తెర అని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֵיתָרָיו
  choice: దాని తాళ్లు
  rationale: నిర్మాణాన్ని బిగించి నిలిపే తాళ్లను సూచిస్తుంది; హీబ్రూ ఏకవచన పుంలింగ సర్వనామ సంబంధాన్ని తెలుగు ‘దాని’ సహజంగా ఉంచుతుంది.
- source_word: וִיתֵדֹתֶיהָ
  choice: మేకులు
  rationale: తాళ్లను బిగించడానికి నేలలో పాతే గుడారపు మేకులను సూచిస్తుంది.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: సేవకు ఉపయోగించే పరికరాలన్నీ
  rationale: כְּלֵי అనే విస్తృత పదానికి ‘పరికరాలు,’ עֲבֹדַת అనే సేవ/పని భావానికి ‘సేవకు ఉపయోగించే’ అని అనువదించడం జాబితా సందర్భంలో సహజంగా ఉంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాస గుడారం
  rationale: ‘నివాసం’ అనే మూలభావాన్ని, మోసుకెళ్లగల పవిత్ర గుడారపు స్వరూపాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לְאֹהֶל מוֹעֵד
  choice: సమావేశ గుడారం కోసం
  rationale: పవిత్ర నిర్మాణానికి వాడే స్థిరమైన హీబ్రూ బిరుదును పదార్థానికి దగ్గరగా, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: הַמִּשְׁכָּן మరియు אֹהֶל מוֹעֵד మధ్య సంబంధం
  choice: ‘సమావేశ గుడారం కోసం నివాస గుడారపు సేవకు’ అని రెండు పేర్లనూ వేర్వేరుగా నిలిపాం.
  alternative: రెండింటినీ ఒకే పేరుగా కలిపి ‘సమావేశపు నివాస గుడారం’ అని అనువదించడం.
  rationale: హీబ్రూ వాక్యంలో రెండు వేరు పదబంధాలు ఉన్నాయి; వాటి సంబంధాన్ని వివరణాత్మకంగా పూర్తిగా సమానీకరించకుండా మూలంలోని నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని వాడాం. ఇది మునుపటి వచనాల నుంచి కొనసాగుతున్న కర్మపదాల జాబితా కావడంతో చివర అర్ధవిరామాన్ని ఉంచాం. ‘చుట్టు తెరలు’ మరియు ‘ముఖద్వారపు తెర’ ద్వారా రెండు వేరు హీబ్రూ పదాల సందర్భభేదాన్ని తెలుగులో స్పష్టం చేశాం.
