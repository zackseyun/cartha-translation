base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/017.yaml
  text: And they put the two gold cords on the two rings at the ends of the breastpiece[a].
translation:
  language: te
  text: వారు ఆ రెండు బంగారు పేనిన తాళ్లను వక్షపటపు అంచులలో ఉన్న రెండు ఉంగరాలకు తగిలించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారు గొలుసులను.” హీబ్రూ పదం మెలిపెట్టిన తాళ్లను లేదా గొలుసులవంటి పేనిన పోగులను సూచించగలదు; ఇక్కడ అవి బంగారంతో చేయబడి వక్షపటానికి అమర్చబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారు ... తగిలించారు
  rationale: נתן ఇక్కడ ఒక వస్తువును మరొకదానిపై లేదా దానికి అమర్చడాన్ని సూచిస్తుంది. ఉంగరాలకు తాళ్లను కలిపే ఈ సందర్భంలో ‘తగిలించారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁתֵּי
  choice: ఆ రెండు
  rationale: హీబ్రూ రూపం నిర్దిష్టంగా రెండు వస్తువులను సూచిస్తుంది; ‘ఆ రెండు’ ముందుగా ప్రస్తావించిన వాటితో అనుసంధానాన్ని కూడా సహజంగా తెలియజేస్తుంది.
- source_word: הָעֲבֹתֹת
  choice: పేనిన తాళ్లు
  rationale: ఈ పదం మెలిపెట్టిన తాళ్లను లేదా గొలుసులవంటి పేనిన పోగులను సూచించగలదు. ‘పేనిన తాళ్లు’ దాని ప్రాథమిక రూపచిత్రాన్ని నిలుపుతుంది; ‘గొలుసులు’ అనే సాధ్యమైన అర్థాన్ని పాదటీకలో ఉంచాం.
- source_word: הַזָּהָב
  choice: బంగారు
  rationale: వస్తువుల పదార్థం బంగారం అని సహజమైన తెలుగు విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: రెండు ఉంగరాలకు
  rationale: עַל అనేది ఇక్కడ ఉంగరాలపై ఉంచడం లేదా వాటికి అమర్చడం అనే సంబంధాన్ని సూచిస్తుంది. ‘తగిలించారు’తో కలిపి ‘ఉంగరాలకు’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: קְצוֹת
  choice: అంచులు
  rationale: ఈ పదం చివరలను లేదా అంచులను సూచిస్తుంది. వక్షపటం వంటి వస్తువు విషయంలో ‘అంచులు’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: הַחֹשֶׁן
  choice: వక్షపటం
  rationale: యాజకుని ఛాతిపై ధరించే ప్రత్యేక వస్తువుకు ‘వక్షపటం’ సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు పదం; ఈ వచనంలో అదనపు వివరణ అవసరం లేదు.
