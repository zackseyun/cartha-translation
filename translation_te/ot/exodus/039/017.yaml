translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్గమకాండంలోని నిర్మాణ వర్ణనకు తగిన సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. సాంకేతిక వస్తువుకు ‘వక్షపటం’ను, הָעֲבֹתֹתలోని రూపచిత్రాన్ని నిలుపడానికి ‘పేనిన తాళ్లు’ను ఎంచుకున్నాం.
