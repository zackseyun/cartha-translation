source:
  edition: WLC
  text: וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֵ֕ת מָסַ֖ךְ פֶּ֥תַח הָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/038.yaml
  text: the gold altar[a], the anointing oil, the fragrant incense, and the screen for the entrance of the tent[c][b];
translation:
  language: te
  text: బంగారు బలిపీఠం, అభిషేక తైలం, సుగంధ ద్రవ్యాల ధూపం, గుడారపు ప్రవేశద్వారానికి తెర;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠం
  rationale: מִזְבַּח అంటే ‘బలిపీఠం’; הַזָּהָב అనే ‘బంగారం’ నామవాచకం ఇక్కడ విశేషణార్థంగా ఉంది. ‘బంగారు బలిపీఠం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: అభిషేక తైలం
  rationale: ఈ నిర్మిత పదబంధం అభిషేకానికి ఉపయోగించే నూనెను సూచిస్తుంది. ఆచార సంబంధ భావాన్ని నిలుపుతూ ‘అభిషేక తైలం’ గౌరవప్రదంగా, సంక్షిప్తంగా ఉంది.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: సుగంధ ద్రవ్యాల ధూపం
  rationale: קְטֹרֶת అంటే ‘ధూపం’; הַסַּמִּים సుగంధ ద్రవ్యాలు లేదా సువాసన పదార్థాలను సూచిస్తుంది. ‘సుగంధ ద్రవ్యాల ధూపం’ మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מָסַךְ
  choice: తెర
  rationale: గుడార సంబంధ సందర్భంలో ఇది ప్రవేశద్వారం వద్ద వేలాడదీసే తెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ సహజంగా అర్థమవుతుంది; ప్రత్యేక అంతర్గత ఆవరణ తెరకు వాడే పదంతో అనవసరంగా కలపదు.
- source_word: פֶּתַח הָאֹהֶל
  choice: గుడారపు ప్రవేశద్వారానికి
  rationale: פֶּתַח ప్రవేశం లేదా ద్వారం; הָאֹהֶל గుడారం. తెర యొక్క స్థానాన్ని/ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘గుడారపు ప్రవేశద్వారానికి’ అని అనువదించాం.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: కామాలతో కూడిన జాబితా
  rationale: పునరుక్త సంధి మరియు కర్మ సూచకం నాలుగు వస్తువుల జాబితాను ఏర్పరుస్తాయి. తెలుగులో ప్రతి అంశం ముందు ‘మరియు’ పునరావృతం చేయకుండా జాబితాగా ఇవ్వడం సహజం; అన్ని అంశాలు యథాతథంగా ఉన్నాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆరాధనా పదజాలం ఉపయోగించబడింది. ఈ వాక్యం ముందటి క్రియపై ఆధారపడిన జాబితా భాగం కావడంతో చివర అర్ధవిరామం ఉంచబడింది.
