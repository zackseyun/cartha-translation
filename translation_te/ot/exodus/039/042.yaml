    rationale: The supplied POB decision specifies ‘Yahweh.’ In Telugu this should be represented as ‘యాహ్వే,’ rather than ‘యెహోవా’ (Jehovah), which is an alternative traditional form.
  revised_text: యాహ్వే మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం, అలాగే ఇశ్రాయేలు ప్రజలు పని అంతటినీ చేశారు.[a]
