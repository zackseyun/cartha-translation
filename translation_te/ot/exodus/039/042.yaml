source:
  edition: WLC
  text: כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כָּל הָ/עֲבֹדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: te
  text: యాహ్వే మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం, అలాగే ఇశ్రాయేలు ప్రజలు పని అంతటినీ చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలను సామూహికంగా సూచించే హీబ్రూ పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా ఎలా అయితే ఉందో
  rationale: כְּ־తో కూడిన כֹּל మరియు సంబంధసూచకమైన אֲשֶׁר, తరువాతి כֵּן‌తో కలిసి ఆజ్ఞకూ కార్యానికీ ఉన్న సంపూర్ణ అనురూపతను తెలియజేస్తాయి. తెలుగు సహసంబంధ నిర్మాణం ‘ఎలా అయితే... అలాగే’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: ఈ క్రియ ‘ఆజ్ఞాపించు’ అనే అర్థం ఇస్తుంది. తెలుగు సంబంధకృదంతం ఆ ఆజ్ఞ పని పూర్తికాకముందే ఇవ్వబడిందనే క్రమాన్ని సందర్భంలో సహజంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֶת מֹשֶׁה
  choice: మోషేకు
  rationale: צוה క్రియతో אֶת ఆజ్ఞను స్వీకరించిన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘మోషేకు ఆజ్ఞాపించాడు’ అనే చతుర్థీ విభక్తి సహజమైన ప్రయోగం.
- source_word: כֵּן
  choice: అలాగే
  rationale: ప్రారంభంలోని כְּכֹל‌కు ప్రతిస్పందనగా, ఇశ్రాయేలీయుల కార్యం ఆజ్ఞకు సరిగ్గా అనుగుణంగా ఉందని సూచిస్తుంది.
- source_word: עָשׂוּ
  choice: చేశారు
  rationale: עשה ఇక్కడ ఆజ్ఞాపించబడిన కార్యమంతటినీ నెరవేర్చడాన్ని విస్తృతంగా సూచిస్తుంది; ‘చేశారు’ తయారీకి మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇది సందర్భంలో నిబంధన సమాజమైన ఇశ్రాయేలు ప్రజలందరినీ సూచించే స్థిర సామూహిక నామం. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో ఆ సామూహిక అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: పని అంతటినీ
  rationale: עֲבֹדָהకు పని, సేవ, శ్రమ అనే అర్థాలు ఉండవచ్చు. ప్రత్యక్ష సందర్భం ప్రత్యక్ష గుడార నిర్మాణానికి సంబంధించిన మొత్తం నియమిత పనిని సూచిస్తున్నందున ‘పని అంతటినీ’ సరిపోతుంది.
theological_decisions:
- issue: יְהוָה దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సామూహిక పరిధి
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా పుంలింగ బహువచనమైనా, ఇది ఇక్కడ ఇశ్రాయేలు నిబంధన సమాజానికి స్థిర సామూహిక designation. అక్షర రూపం వల్ల కేవలం పురుషులే పని చేశారనే అనవసర పరిమితి కలగకుండా ప్రధాన పాఠంలో సామూహిక అర్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన వాక్యశైలి. ‘ఎలా అయితే... అలాగే’ నిర్మాణం మూలంలోని כְּכֹל...כֵּן అనురూపతను నిలుపుతుంది. పాదసూచిక సూచిక [a] సంబంధిత పదబంధం తరువాత ఉంచబడింది.
