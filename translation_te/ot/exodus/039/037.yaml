translation:
  language: te
  text: శుద్ధమైన దీపస్తంభాన్ని, దాని దీపాలను—క్రమంగా అమర్చిన దీపాలను[a]—దాని ఉపకరణాలన్నిటినీ, వెలుగు కోసం నూనెను;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అమరికలో ఉన్న దీపాలు.’ נֵרֹת הַמַּעֲרָכָה అనే హీబ్రూ పదబంధం దీపాల క్రమబద్ధమైన అమరికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: దీపస్తంభం
  rationale: ఈ పదం ఒకే దీపాన్ని కాకుండా దీపాలను ఉంచే ఆలయ గుడారపు దీపస్తంభాన్ని సూచిస్తుంది; ‘దీపస్తంభం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַטְּהֹרָה
  choice: శుద్ధమైన
  rationale: ఆలయ గుడారపు సామగ్రి సందర్భంలో ఈ విశేషణం శుద్ధతను సూచిస్తుంది; మూలంలోని భావాన్ని మతశాఖాపరమైన వివరణ లేకుండా నిలుపుతుంది.
- source_word: נֵרֹתֶיהָ
  choice: దాని దీపాలు
  rationale: ఇక్కడ נֵר అనేది దీపస్తంభానికి చెందిన విడివిడిగా ఉన్న దీపాలను సూచిస్తుంది.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: క్రమపద్ధతిలో అమర్చే దీపాలు
  rationale: מַעֲרָכָהలోని క్రమబద్ధమైన అమరిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, అది పూర్తయిన అమరికనా లేక అమర్చడానికి ఉద్దేశించినవా అనే స్వల్ప సందిగ్ధతను ‘అమర్చే’ అనే రూపంతో కాపాడుతుంది.
- source_word: כָּל כֵּלֶיהָ
  choice: దాని ఉపకరణాలన్నీ
  rationale: כְּלִי పాత్రలు, పనిముట్లు లేదా ఇతర సామగ్రిని విస్తృతంగా సూచించగలదు; ‘ఉపకరణాలు’ అనవసరంగా నిర్దిష్టీకరించకుండా ఈ విస్తృతిని నిలుపుతుంది.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: వెలుగు కోసం నూనె
  rationale: దీపాలు వెలిగించడానికి ఉపయోగించే నూనె అనే నిర్మాణార్థాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
