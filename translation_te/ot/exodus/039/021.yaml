  to: వారు వక్షపతకాన్ని దాని ఉంగరాల ద్వారా ఏఫోదు ఉంగరాలకు నీలి దారంతో[a] బిగించారు; అది ఏఫోదుకు చెందిన నైపుణ్యంగా నేసిన నడికట్టు[b] మీద ఉండేలా, వక్షపతకం ఏఫోదు మీదనుండి విడిపోకుండా ఉండేలా చేశారు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే.
