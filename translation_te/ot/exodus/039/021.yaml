  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: వారు వక్షపతకాన్ని దాని ఉంగరాల ద్వారా ఏఫోదు ఉంగరాలకు నీలి దారంతో[a] బిగించారు; అది ఏఫోదుకు చెందిన నైపుణ్యంగా నేసిన నడికట్టు[b] మీద ఉండేలా, వక్షపతకం ఏఫోదు మీదనుండి విడిపోకుండా ఉండేలా చేశారు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీలవర్ణపు తాడుతో’ అని కూడా అనువదించవచ్చు; ఇక్కడి హీబ్రూ పదం కట్టడానికి ఉపయోగించే దారం లేదా సన్నని తాడును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏఫోదుకు జతచేసిన అలంకార నేసిన పట్టీ’; హీబ్రూ పదం ఏఫోదుతో కలిసివున్న నేసిన బిగింపు పట్టీని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: బిగించారు
  rationale: వస్త్రంలోని భాగాలను ఉంగరాలు, దారం ద్వారా ఒకదానికొకటి కదలకుండా కట్టివేయడాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘బిగించారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַחֹשֶׁן
  choice: వక్షపతకం
  rationale: ఇది యాజకుని ఛాతీపై ధరించే, రత్నాలు అమర్చిన అలంకార వస్తువు; కవచమని అపార్థం కలిగించకుండా ‘వక్షపతకం’ దాని స్వరూపాన్ని తెలియజేస్తుంది.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: వక్షపతకపు ఉంగరాలనుండి ఏఫోదు ఉంగరాలకు
  rationale: מִן ... אֶל అనే దిశాత్మక నిర్మాణాన్ని కాపాడుతూ, ఒక సమూహపు ఉంగరాలనుండి మరొక సమూహానికి దారం వెళ్లి వాటిని కలిపిందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: నీలి దారంతో
  rationale: פְתִיל అనేది కట్టడానికి ఉపయోగించే దారం లేదా సన్నని తాడు. תְּכֵלֶת ప్రత్యేక నీలవర్ణపు వస్త్రరంగును సూచిస్తుంది; ప్రధాన పాఠంలో సరళమైన ‘నీలి దారం’ ఉపయోగించబడింది.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ఏఫోదు నైపుణ్యంగా నేసిన నడికట్టు
  rationale: ఈ పదం ఏఫోదుతో కలిసివున్న అలంకార నేసిన బిగింపు పట్టీని సూచిస్తుంది. ‘నడికట్టు’ దాని ఉపయోగాన్ని, ‘నైపుణ్యంగా నేసిన’ దాని పనితనాన్ని తెలియజేస్తాయి; సాంకేతిక విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: וְלֹא יִזַּח
  choice: విడిపోకుండా
  rationale: నిఫల్ రూపం తన స్థానంనుండి తొలగిపోవడం లేదా వేరుపడడాన్ని సూచిస్తుంది. బిగింపు సందర్భంలో ‘విడిపోకుండా’ సహజమైన తెలుగు.
- source_word: מֵעַל הָאֵפֹד
  choice: ఏఫోదు మీదనుండి
  rationale: מֵעַל లోని ‘మీదనుండి’ అనే స్థలసంబంధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: వక్షపతకం ఏఫోదుతో ఉన్న స్థలసంబంధం
  choice: ఏఫోదు మీదనుండి వక్షపతకం విడిపోకుండా
  alternative: వక్షపతకం ఏఫోదు నుండి తొలగిపోకుండా
  rationale: מֵעַל లోని ‘మీద’ అనే భావాన్ని తొలగించకుండా, రెండు వస్త్రభాగాల సంబంధాన్ని మూలానికి దగ్గరగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. యాజక వస్త్రాలకు సంబంధించిన సాంకేతిక పదాలను పూర్తిగా సాధారణీకరించకుండా, ‘వక్షపతకం’, ‘ఏఫోదు’, ‘నడికట్టు’ వంటి స్పష్టమైన రూపాలను ఎంచుకున్నాం. హీబ్రూ వాక్యంలోని ఉద్దేశ్య సంబంధాన్ని తెలుగులో రెండు వాక్యాలుగా సహజంగా విభజించినా, చర్యల క్రమం మరియు చివరి విధేయత సూత్రం నిలుపబడ్డాయి.
