  - severity: medium
    issue: 'The main text has two making/doing clauses: ‘చేశారు’ and then ‘వారు చేశారు.’'
    rationale: The Hebrew is one coordinated clause, with the final phrase meaning ‘just as Yahweh commanded Moses.’ Supplying one finite verb for standalone Telugu is acceptable, but repeating it is not source-faithful.
