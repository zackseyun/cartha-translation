  - severity: low
    issue: ‘ప్రకాశవంతమైన ఎరుపు’ is broader and less stable than the conventional textile-color equivalent.
    rationale: ‘స్కార్లెట్’ preserves the conventional distinction intended by תוֹלַעַת שָׁנִי while the note can retain ‘క్రిమ్సన్’ as an alternative.
