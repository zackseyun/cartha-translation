  text: וְֽ/אֶת הָ/אַבְנֵ֞ט שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: te
  text: సన్నగా మెలిపెట్టిన నారతోను, నీలం, ఊదా, స్కార్లెట్ రంగు నూలుతోను[b] అలంకార కుట్టుపని చేసిన నడికట్టును[a] వారు తయారు చేశారు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నడుము పట్టా,’ ‘బెల్టు.’ ఇది యాజకుడు నడుము చుట్టూ కట్టుకునే వస్త్రబంధం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘స్కార్లెట్’ అనేది స్కార్లెట్ రంగుతో అద్దిన వస్త్రపదార్థాన్ని సూచిస్తుంది; ‘క్రిమ్సన్’ కూడా ఒక సాధ్యమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: నడికట్టు
  rationale: ఈ పదం యాజక వస్త్రాలతో ధరించే నడుము చుట్టూ కట్టుకునే వస్త్రబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నడికట్టు’ సహజంగా ఉండి, సాధారణ పట్టా కంటే వస్త్రపు కట్టును స్పష్టంగా సూచిస్తుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: שֵׁשׁ సన్నని, శ్రేష్ఠమైన నారను; מָשְׁזָר పేనిన లేదా మెలిపెట్టిన తయారీని సూచిస్తాయి. ఈ అనువాదం పదార్థాన్నీ పనితనాన్నీ నిలుపుతుంది.
- source_word: תְכֵלֶת
  choice: నీలం
  rationale: గుడారపు వస్త్రాలలో ఉపయోగించిన విలువైన నీలి రంగు వేసిన పదార్థాన్ని సూచిస్తుంది; నూలు అనే పదం శ్రేణి చివర చేర్చి అన్ని రంగులకూ వర్తింపజేశాం.
- source_word: אַרְגָּמָן
  choice: ఊదా
  rationale: గుడారపు వస్త్రాల సందర్భంలో రంగు వేసిన ఊదా పదార్థానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: תוֹלַעַת שָׁנִי
  choice: ప్రకాశవంతమైన ఎరుపు రంగు నూలు
  rationale: ఈ సంయుక్త పదం కీటక మూలపు రంగుతో అద్దిన స్కార్లెట్ లేదా క్రిమ్సన్ వర్ణపు పదార్థాన్ని సూచిస్తుంది. ‘ప్రకాశవంతమైన ఎరుపు’ సాధారణ పాఠకునికి రంగును సహజంగా తెలియజేస్తూ ఖచ్చితమైన ఛాయపై ఉన్న స్వల్ప అనిశ్చితిని అతిగా నిర్ణయించదు.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: కళాత్మక కుట్టుపనిగా
  rationale: ఈ పదబంధం రంగులతో అలంకార నమూనాలు చేసే నిపుణ వస్త్రకారుని పనిని సూచిస్తుంది. ‘కళాత్మక కుట్టుపని’ ఆధునిక తెలుగులో సహజంగా ఉండి, సాధారణ నేయడం నుంచి అలంకార పనిని వేరు చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టుగానే
  rationale: దేవుని ఆజ్ఞకు వారు యథాతథంగా లోబడినట్లు తెలిపే నిర్గమకాండంలోని పునరావృత సూత్రాన్ని ‘ఆజ్ఞాపించినట్టుగానే’ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే ఉంది. కాబట్టి దానిని వ్యక్తిగత నామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఇది నామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చదు.
- issue: మూలంలో సూచితమైన ప్రధాన క్రియ
  choice: ‘చేశారు’ అని సందర్భానుసారంగా స్పష్టం చేయడం
  alternative: మునుపటి వాక్యంపై ఆధారపడే అసంపూర్ణ జాబితా రూపాన్ని అలాగే ఉంచడం
  rationale: హీబ్రూలో ఈ వచనం మునుపటి క్రియకు అనుసంధానమైన జాబితా భాగం. స్వతంత్ర వచనంగా తెలుగులో చదవడానికి సహజంగా ఉండేలా కర్తను ‘వారు’గా, క్రియను ‘చేశారు’గా సందర్భం నుంచి పూరించాం; దీనివల్ల కొత్త theological భావం చేరదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, వచనం స్వతంత్రంగా సహజంగా చదవడానికి సందర్భంలో సూచితమైన ‘చేశారు’ అనే క్రియను పూరించాం. ‘ఎంబ్రాయిడరీ’ అనే ఆంగ్ల అరువు పదానికి బదులు ‘కళాత్మక కుట్టుపని’ వాడాం.
