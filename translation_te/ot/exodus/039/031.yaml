id: EXO.39.31
reference: Exodus 39:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ עָלָי/ו֙ פְּתִ֣יל תְּכֵ֔לֶת לָ/תֵ֥ת עַל הַ/מִּצְנֶ֖פֶת מִ/לְ/מָ֑עְלָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: te
  text: వారు దానికి నీలిరంగు దారాన్ని[a] కట్టి, దానిని పాగాపై పైవైపున ఉంచారు; యాహ్వే మోషేకు ఆజ్ఞాపించినట్లుగానే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీలి తాడు’ లేదా ‘నీలి-ఊదా దారం’ అని కూడా అనువదించవచ్చు. హీబ్రూ תְּכֵלֶת గుడారపు వస్త్రాల్లో ఉపయోగించిన ప్రత్యేక నీలిరంగు అద్దిన పదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: వారు దానికి ... కట్టి
  rationale: נתן అనే క్రియకు ప్రాథమికంగా ‘పెట్టు’ అనే అర్థం ఉన్నా, עַל నిర్మాణం మరియు సందర్భంలోని బంగారు పలకను పాగాకు బిగించే పని దృష్ట్యా ‘కట్టి’ సహజంగా క్రియాత్మక భావాన్ని తెలియజేస్తుంది. עָלָיו మునుపటి వచనంలోని పవిత్ర కిరీటపు పలకను సూచిస్తుంది.
- source_word: פְּתִיל
  choice: నూలు తాడు
  rationale: ఈ పదం పేనిన దారం లేదా తాడును సూచిస్తుంది. బిగించడానికి ఉపయోగించే వస్తువుగా ‘నూలు తాడు’ దాని వస్తుస్వరూపాన్నీ పనినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּכֵלֶת
  choice: నీలి
  rationale: ఇది మందిరపు వస్త్రాలలో ఉపయోగించిన ప్రత్యేక నీలి లేదా నీలి-ఊదా రంగు అద్దిన పదార్థాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సులభమైన ‘నీలి’ని ఉంచి, రంగు పరిధిని పాదసూచికలో తెలిపాం.
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: దానిని పాగా పైభాగంలో ఉంచారు
  rationale: לָתֵת ఉద్దేశార్థక క్రియారూపం; దాని ఉద్దేశం పలకను పాగాపై ఉంచడం. מִלְמָעְלָה పైభాగంలోని స్థానాన్ని సూచిస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ఉద్దేశాన్ని ఫలిత చర్యగా వ్యక్తం చేశాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యెహోవా మోషేకు ఆజ్ఞాపించినట్టే వారు చేశారు
  rationale: పని దేవుని ఆజ్ఞకు సరిగ్గా అనుగుణంగా జరిగిందనే పునరావృత నెరవేర్పు సూత్రాన్ని ‘ఆజ్ఞాపించినట్టే’ నిలుపుతుంది. తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ‘వారు చేశారు’ను స్పష్టంగా తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో సంప్రదాయంగా, సాధారణంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని వాడాం; ‘యాహ్వే’ సాధ్యమైన మరొక లిప్యంతరీకరణ.
- issue: క్రియ యొక్క అంతర్లీన కర్త మరియు నెరవేర్పు భావం
  choice: ‘వారు చేశారు’ అని స్పష్టం చేయడం
  alternative: ‘యెహోవా మోషేకు ఆజ్ఞాపించినట్టే’ అని మాత్రమే ముగించడం
  rationale: హీబ్రూ ప్రధాన క్రియలోని బహువచన కర్త ఈ పనివారినే సూచిస్తుంది. చివరి సూత్రంలో వారి కార్యం ఆజ్ఞకు అనుగుణమని తెలుగులో స్పష్టంగా, సహజంగా చెప్పడం మూలార్థాన్ని పరిష్కరించకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. యాజక వస్త్రంలోని הַמִּצְנֶפֶתకు సహజమైన ‘పాగా’, బిగించే పదార్థానికి ‘నూలు తాడు’ ఎంచుకున్నాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
