  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: te
  text: పరిశుద్ధ స్థలంలో సేవ చేయడానికి నేతపనితో చేసిన వస్త్రాలు[a], యాజకుడైన అహరోను కొరకు పరిశుద్ధ వస్త్రాలు, యాజకులుగా సేవ చేయడానికి అతని కుమారుల వస్త్రాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవా వస్త్రాలు.’ హీబ్రూ పదబంధం పరిశుద్ధ స్థలంలో సేవ కోసం ప్రత్యేకంగా తయారుచేసిన వస్త్రాలను సూచించే అవకాశముంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: వస్త్రాలు
  rationale: బֶּגֶד సాధారణంగా దుస్తులు లేదా వస్త్రాలను సూచిస్తుంది. యాజక సంబంధ సందర్భంలో ‘వస్త్రాలు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది; తరువాతి మతసంప్రదాయాల ప్రత్యేక పదజాలాన్ని రుద్దదు.
- source_word: הַשְּׂרָד
  choice: నేసి చేసిన
  rationale: ఈ గుడారపు సందర్భంలో שְׂרָד ప్రత్యేక నైపుణ్యంతో చేసిన వస్త్రపనిని సూచించే అవకాశముంది. ‘నేసి చేసిన’ అనేది దాని తయారీ/వస్త్రపని భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అయితే పదంలోని అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: שׁרת ఇక్కడ పరిశుద్ధ స్థలంలో జరిగే అధికారిక ఆరాధనా సేవను సూచిస్తుంది. ‘సేవ చేయడానికి’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: קֹדֶשׁ ఇక్కడ అమూర్తమైన పరిశుద్ధతకన్నా గుడారపు పవిత్ర పరిధిని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ మూలంలోని స్థలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: పరిశుద్ధ వస్త్రాలు
  rationale: ఈ పదబంధం యాజకత్వానికి ప్రత్యేకించిన వస్త్రాలకు స్థిరమైన పేరు. ‘పరిశుద్ధ వస్త్రాలు’ నిర్మాణాన్నీ అర్పితత్వ భావాన్నీ నిలుపుతుంది.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: యాజకుడైన అహరోను కోసం
  rationale: లబ్ధిదారుని, అతని పదవిని స్పష్టంగా తెలిపే సహజ తెలుగు నిర్మాణం.
- source_word: בִּגְדֵי בָנָיו
  choice: అతని కుమారుల వస్త్రాలు
  rationale: మూలంలోని సంబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְכַהֵן
  choice: యాజకులుగా సేవ చేయడానికి
  rationale: כֹּהֵן నుండి ఏర్పడిన ఈ క్రియ యాజకునిగా విధులు నిర్వర్తించడాన్ని సూచిస్తుంది. ‘యాజకులుగా సేవ చేయడానికి’ వృత్తి/పదవికి సంబంధించిన క్రియాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד మరియు בִּגְדֵי הַקֹּדֶשׁ మధ్య భేదం
  choice: మొదటి పదబంధాన్ని పరిశుద్ధ స్థల సేవకు ఉపయోగించే ప్రత్యేకంగా నేసి చేసిన వస్త్రాలుగా, తరువాతి పదబంధాన్ని అహరోను మరియు అతని కుమారులకు సంబంధించిన పరిశుద్ధ యాజక వస్త్రాలుగా వేరు చేసి అనువదించడం.
  alternative: రెండు పదబంధాలను దాదాపు సమానార్థకాలుగా తీసుకుని మొదటిదాన్ని ‘సేవా వస్త్రాలు’ అని అనువదించడం.
  rationale: హీబ్రూ పాఠం రెండు పదబంధాలను పునరుక్తితో విడిగా పేర్కొంటుంది. వాటి మధ్య ఏదో విధమైన భేదాన్ని నిలుపుతూ, పాఠం చెప్పినదానికంటే ఎక్కువ వివరాన్ని చేర్చకుండా ఈ రూపం అనువదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘పరిచర్య’ కంటే సాధారణ పాఠకులకు పారదర్శకమైన ‘సేవ’ను ఎంచుకున్నాం. మూలంలోని మూడు సమాంతర నామపదబంధాల జాబితా నిర్మాణాన్ని నిలిపాం; హీబ్రూ שְׂרָד యొక్క నిజమైన నిఘంటు అనిశ్చితిని [a] పాదసూచికలో తెలిపాం.
