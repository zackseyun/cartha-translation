translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. అరుదైన కవచ పదంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠంలో సాధారణ పదంతో, పాదసూచికలో ప్రత్యామ్నాయాలతో నిలిపి ఉంచాం.
