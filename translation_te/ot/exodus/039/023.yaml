  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פִֽי הַ/מְּעִ֥יל בְּ/תוֹכ֖/וֹ כְּ/פִ֣י תַחְרָ֑א שָׂפָ֥ה לְ/פִ֛י/ו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/023.yaml
  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: te
  text: ఆ అంగీ మధ్యలో ఒక తెరువు ఉంది; అది కవచపు తెరువులా ఉంది.[a] అది చిరిగిపోకుండా, దాని తెరువు చుట్టూ ఒక అంచు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యుద్ధకవచపు తెరువులా’ లేదా ‘గొలుసు కవచపు తెరువులా’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం תַחְרָא అరుదైనది; అది రక్షణ కోసం ధరించే ఒక కవచ వస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: అంగీ మెడ రంధ్రం
  rationale: వస్త్ర సందర్భంలో פֶּה అక్షరార్థమైన ‘నోరు’ను కాకుండా వస్త్రంలోని తొడుగు లేదా రంధ్రాన్ని సూచిస్తుంది. ఇక్కడ తల దూర్చే భాగం ఉద్దేశించబడినందున ‘మెడ రంధ్రం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמְּעִיל
  choice: అంగీ
  rationale: מְעִיל యాజకుడు ధరించే పొడవైన పైవస్త్రాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అంగీ’ సంక్షిప్తంగా, గౌరవప్రదంగా సరిపోతుంది.
- source_word: בְּתוֹכוֹ
  choice: దాని మధ్యలో
  rationale: రంధ్రం వస్త్రం మధ్యభాగంలో అమర్చబడిందనే స్థలార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: כְּפִי תַחְרָא
  choice: కవచపు మెడ రంధ్రంలా
  rationale: అరుదైన תַחְרָא రక్షణకరమైన కవచ వస్త్రాన్ని సూచిస్తుంది. దాని ఖచ్చిత రూపం అనిశ్చితమైనందున ‘గొలుసు కవచం’ వంటి అతినిర్దిష్ట పదానికి బదులు సాధారణమైన ‘కవచం’ ఎంచుకోబడింది.
- source_word: שָׂפָה לְפִיו סָבִיב
  choice: ఆ రంధ్రం చుట్టూ గట్టి అంచు
  rationale: שָׂפָה అక్షరార్థంగా ‘పెదవి/అంచు’; ఇక్కడ రంధ్రం చుట్టూ చిరగకుండా బలపరిచిన అంచును సూచిస్తుంది. ‘గట్టి’ అనేది దాని కార్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יִקָּרֵעַ
  choice: అది చిరిగిపోకుండా
  rationale: నిఫాల్ క్రియారూపం బలపరిచిన అంచు యొక్క ఉద్దేశిత ఫలితాన్ని తెలియజేస్తుంది; ఈ ప్రయోజనార్థాన్ని తెలుగు నిర్మాణం సహజంగా అందిస్తుంది.
