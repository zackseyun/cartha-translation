  to: అతని ఏఫోదుమీద ఉన్న కళాత్మకంగా నేసిన పట్టీ[a] దానితో ఏకమై ఉండి, అదే పనితనంతో బంగారం, నీలం, ఊదా, ఎర్రని నూలు, సన్నగా పేనిన నారతో చేయబడింది; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే.
