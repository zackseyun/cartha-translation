id: EXO.39.5
reference: Exodus 39:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/חֵ֨שֶׁב אֲפֻדָּת֜/וֹ אֲשֶׁ֣ר עָלָ֗י/ו מִמֶּ֣/נּוּ הוּא֮ כְּ/מַעֲשֵׂ/הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: te
  text: అతని ఏఫోదుమీద ఉన్న కళాత్మకంగా నేసిన పట్టీ[a] దానితో ఏకమై ఉండి, అదే పనితనంతో బంగారం, నీలం, ఊదా, ఎర్రని నూలు, సన్నగా పేనిన నారతో చేయబడింది; యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ఏఫోదు యొక్క అలంకారంగా నేసిన పట్టీ ... దానినుండే, అదే పనితనంతో.” హీబ్రూ పదబంధం ఈ పట్టీ ఏఫోదుతో అంతర్భాగంగా ఉండి, దాని పనితనానికే సరిపోయిందని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: నైపుణ్యంగా నేసిన నడికట్టు
  rationale: యాజక వస్త్రాల సందర్భంలో ఇది ఏఫోదుతో కూడిన అలంకారపూర్వకంగా నేసిన బిగింపు పట్టాను సూచిస్తుంది; ‘నడికట్టు’ సాధారణ తెలుగు పాఠకునికి దాని పనిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲפֻדָּתוֹ
  choice: అతని ఏఫోదుకు
  rationale: 3వ పురుష ఏకవచన పుంలింగ స్వామ్య ప్రత్యయాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘ఏఫోదు’ ప్రత్యేక యాజక వస్త్రనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר עָלָיו
  choice: దానిమీద ఉన్న
  rationale: ఏఫోదుపై నడికట్టు ఉన్నదనే స్థాన సంబంధాన్ని నేరుగా అనువదిస్తుంది; మూలంలో స్పష్టంగా లేని ‘అతికించబడిన’ అనే భావాన్ని చేర్చదు.
- source_word: מִמֶּנּוּ הוּא
  choice: దానితో ఒకే ముక్కగా ఉండి
  rationale: నడికట్టు వేరుగా కాక ఏఫోదులో అంతర్భాగంగా, నిర్మాణపరంగా కొనసాగిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמַעֲשֵׂהוּ
  choice: దానిలాగే ... చేయబడింది
  rationale: ఏఫోదు పనితనానికే సరిపోలే విధంగా నడికట్టు తయారైందనే భావాన్ని తెలియజేస్తుంది; పదబద్ధమైన ‘దాని పనివలె’ కంటే తెలుగులో సహజం.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: బంగారం, నీలం, ఊదా, ఎర్రని నూలు
  rationale: వస్తుసూచిలోని బంగారాన్ని, సంప్రదాయ వస్త్రరంగులను స్పష్టంగా అందిస్తుంది; చివర ‘నూలు’ని ఉపయోగించడం రంగు పదాల వస్త్రసంబంధ అర్థాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: సన్నగా పేనిన నార
  rationale: ఉన్నత నాణ్యతగల నార దారాన్ని మెలిపెట్టి/పేనిన నిర్మాణాన్ని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో చదవదగిన రూపం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞకు కచ్చితమైన విధేయతను తెలిపే సూత్రవాక్యాన్ని నిలుపుతూ, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ప్రతిబింబిస్తుంది.
- issue: కర్తను తెలుగులో స్పష్టీకరించడం
  choice: వారు చేశారు
  alternative: అది చేయబడింది / కర్తను తెలపకుండా ఉంచడం
  rationale: హీబ్రూ వాక్యంలో చివరి క్రియ ‘ఆయన ఆజ్ఞాపించాడు’ మాత్రమే; తయారీ క్రియ ముందుభాగంలోని నామవాక్యంలో అంతర్లీనంగా ఉంది. సందర్భంలోని పనివారిని సూచించే ‘వారు చేశారు’ తెలుగులో వాక్యాన్ని పూర్తి చేస్తుంది, అయితే ఇది సందర్భాధారిత సరఫరా.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన శైలి. ప్రత్యేక యాజక వస్త్రనామమైన ‘ఏఫోదు’ను లిప్యంతరీకరించి, దాని పట్టాకు సాధారణ పాఠకునికి అర్థమయ్యే ‘నడికట్టు’ వాడబడింది. అడుగుసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
