revisions:
- from: ఈ విధంగా సమావేశ గుడారమైన నివాస మందిరపు పని అంతా పూర్తయింది. యాహ్వే[a] మోషేకు ఆజ్ఞాపించినదంతా ఇశ్రాయేలీయులు[b] చేశారు; వారు అలాగే చేశారు.
  to: ఈ విధంగా నివాస గుడారం, అంటే సమావేశపు గుడారం, యొక్క పని అంతా పూర్తయింది. యాహ్వే[a] మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం ఇశ్రాయేలీయులు[b] చేశారు; వారు అలాగే చేశారు.
