  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: te
  text: ఈ విధంగా నివాస గుడారం, అంటే సమావేశపు గుడారం, యొక్క పని అంతా పూర్తయింది. యాహ్వే[a] మోషేకు ఆజ్ఞాపించినదంతటి ప్రకారం ఇశ్రాయేలీయులు[b] చేశారు; వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం יהוה (YHWH) ఉంది; దాని ప్రాచీన ఉచ్చారణ ఖచ్చితంగా తెలియదు. ఇక్కడ దాన్ని “యాహ్వే” అని లిప్యంతరీకరించాం.
    reason: textual-cultural_clarification
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: “ఇశ్రాయేలు కుమారులు”; ఈ పదబంధం ఇక్కడ ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: పూర్తయింది
  rationale: כלה ఇక్కడ నిర్మాణ కార్యం సంపూర్ణంగా ముగిసినదని సూచిస్తుంది. తెలుగులో సహజమైన అకర్మక రూపం పనిపైనే దృష్టిని నిలుపుతుంది.
- source_word: כָּל עֲבֹדַת
  choice: పని అంతా
  rationale: כָּל యొక్క సమగ్ర భావాన్ని నిలుపుతూ, עֲבֹדָהను ఈ నిర్మాణ సందర్భానికి తగినట్లు ‘పని’గా అనువదించింది.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారమైన నివాస మందిరం
  rationale: מִשְׁכָּן యొక్క ‘నివాస స్థలం’ భావాన్నీ, אֹהֶל מוֹעֵד అనే ప్రత్యేక నామంలోని ‘సమావేశ గుడారం’ భావాన్నీ సంబంధిత సమాసంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇది మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచించే జాతీయ సంజ్ఞ. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, సమగ్రంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినదంతా
  rationale: ఆజ్ఞలోని సమస్త విషయాలకు వారు అనుగుణంగా నడిచారనే సమగ్ర భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడే ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: כֵּן עָשׂוּ
  choice: వారు అలాగే చేశారు
  rationale: వచనాంతంలోని ఉద్దేశపూర్వక పునరుక్తిని తొలగించకుండా, వారి సంపూర్ణ విధేయతకు ఇచ్చిన ప్రాధాన్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవ నామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితమైనది కాదనే విషయాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక పదబంధం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా పురుష వంశపదాన్ని వాడినా, సందర్భంలో అది జాతి సమాజాన్ని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశిత విస్తృతిని స్పష్టంగా అందించేందుకు సహజమైన జాతీయ నామాన్ని ఎంచుకుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఈ విధంగా’ వచనంలోని ముగింపు-సారాంశ స్వభావాన్ని తెలియజేస్తుంది. చివరి ‘వారు అలాగే చేశారు’ అనే పునరుక్తి హీబ్రూ వాక్యంలోని విధేయత ప్రాధాన్యాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
