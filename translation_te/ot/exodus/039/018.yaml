  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽ/עֲבֹתֹ֔ת נָתְנ֖וּ עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצֹ֑ת וַֽ/יִּתְּנֻ֛/ם עַל כִּתְפֹ֥ת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: te
  text: రెండు అల్లిన గొలుసుల[a] రెండు చివరలను రెండు పొదుగులపై[b] ఉంచి, వాటిని ఏఫోదు భుజపు భాగాలపై, దాని ముందువైపున అమర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మెలితిప్పిన గొలుసుల.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అమరికలపై.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: చివరలను
  rationale: ఈ నామవాచకం వస్తువుల అంత్య భాగాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చివరలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָעֲבֹתֹת
  choice: అల్లిన గొలుసుల
  rationale: ఆభరణాల సందర్భంలో ఇది సాధారణ తాళ్లను కాకుండా మెలితిప్పి లేదా అల్లి చేసిన గొలుసు పనిని సూచిస్తుంది; ‘అల్లిన గొలుసులు’ దాని రూపాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: מִּשְׁבְּצֹת
  choice: పొదుగులపై
  rationale: ఇది రత్నాలు లేదా గొలుసు చివరలను అమర్చే బంగారు పొదుగులు/మౌంటింగులను సూచిస్తుంది; ‘పొదుగులు’ శిల్పకళా సందర్భానికి తగిన సంక్షిప్త తెలుగు పదం.
- source_word: וַיִּתְּנֻם
  choice: వాటిని ... అమర్చారు
  rationale: נתן అనే క్రియకు ఇక్కడ ఉంచడం లేదా అమర్చడం అనే భావం ఉంది. ‘బిగించారు’ అనడం మూలంలో లేని విధానాన్ని అదనంగా నిర్దేశిస్తుంది; ‘వాటిని’ అనే సర్వనామం మూలంలోని సూచనాస్పష్టతను నిలుపుతుంది.
- source_word: כִּתְפֹת
  choice: భుజపు భాగాల
  rationale: వస్త్ర నిర్మాణ సందర్భంలో ఇవి శరీర భుజాలు కాకుండా ఏఫోదుకు చెందిన భుజపు భాగాలు.
- source_word: אֶל מוּל פָּנָיו
  choice: ముందు వైపున
  rationale: ఈ స్థలవాచక పదబంధం ఏఫోదు ముందుకు కనిపించే వైపున చేసిన అమరికను సూచిస్తుంది; తెలుగు వాక్యంలో ఇది సహజంగా ఉంటుంది.
