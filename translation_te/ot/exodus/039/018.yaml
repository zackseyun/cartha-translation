translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గుడారపు ఆరాధనా వస్త్రానికి ప్రత్యేకమైన ‘ఏఫోదు’ అనే పదాన్ని లిప్యంతరీకరించి నిలిపాం. మూలంలోని ‘వాటిని’ అనే సర్వనామం ఏ సమీప అంశాన్ని సూచిస్తుందో పూర్తిగా స్పష్టం చేయకుండా ఉన్నందున, అనువాదంలోనూ దానిని వ్యాఖ్యానాత్మకంగా విప్పలేదు.
