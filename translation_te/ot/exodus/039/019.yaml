revisions:
- from: వారు రెండు బంగారు ఉంగరాలు చేసి, వాటిని వక్షపతకపు రెండు చివర్లలో—ఏఫోదు వైపు లోపల ఉన్న దాని అంచుపై—అమర్చారు.[a]
  to: వారు రెండు బంగారు ఉంగరాలు చేసి, వాటిని వక్షపతకపు రెండు చివర్లలో, ఏఫోదు వైపున ఉన్న దాని లోపలి అంచుపై అమర్చారు.[a]
  rationale: The revision removes the disruptive parenthetical dashes and clarifies that the rings were placed on the breastpiece’s inner edge on the side toward the ephod. The footnote retains the viable alternatives “opposite/facing the ephod,” preserving the ambiguity of the Hebrew spatial expression.
