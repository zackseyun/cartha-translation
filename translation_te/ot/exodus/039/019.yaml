source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַ/יָּשִׂ֕ימוּ עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: te
  text: వారు రెండు బంగారు ఉంగరాలు చేసి, వాటిని వక్షపతకపు రెండు చివర్లలో, ఏఫోదు వైపున ఉన్న దాని లోపలి అంచుపై అమర్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏఫోదుకు ఎదురుగా ఉన్న దాని లోపలి అంచుపై”; లేదా, “ఏఫోదుకు అభిముఖంగా ఉన్న దాని లోపలి అంచుపై.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: బంగారు ఉంగరాలు
  rationale: యాజక వస్త్రంలోని బిగింపు ఉంగరాలను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం; అవి బంగారంతో చేసినవని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֹשֶׁן
  choice: వక్షపతకం
  rationale: ఇది కవచాన్ని కాకుండా యాజకుని ఛాతీపై ధరించే అలంకారాత్మక వస్తువును సూచిస్తుంది; అందువల్ల ‘వక్షకవచం’ కంటే ‘వక్షపతకం’ తక్కువ తప్పుదారి పట్టిస్తుంది.
- source_word: שְׂפָתוֹ
  choice: దాని అంచు
  rationale: శబ్దార్థమైన ‘పెదవి’కి బదులుగా తయారుచేసిన వస్తువు సందర్భంలో అంచు లేదా సరిహద్దు అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שְׁנֵי קְצוֹת
  choice: రెండు చివర్లు
  rationale: ఆకారాన్ని ‘మూలలు’గా అతిగా నిర్దిష్టం చేయకుండా קָצֶה యొక్క చివరు/కొన భావాన్ని నిలుపుతుంది.
- source_word: וַיָּשִׂימוּ עַל
  choice: వాటిని ... పై అమర్చారు
  rationale: కేవలం ఉంచడం కంటే వస్త్ర నిర్మాణంలో ఉంగరాలను తగిన చోట బిగించి పెట్టిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּיְתָה
  choice: లోపల
  rationale: ‘ఇంటివైపు’ అనే మూల రూపం ఇక్కడ దిశార్థక క్రియావిశేషణంగా అంతర్భాగం వైపు లేదా లోపల అని సూచిస్తుంది.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: ఏఫోదు వైపు ... ఉన్న
  rationale: ఈ పదబంధం ఏఫోదుకు ఎదురుగా, దాని వైపు, లేదా దానిని ఆనుకొని ఉన్న పక్కను సూచించవచ్చు; ప్రధాన పాఠంలో సహజమైన దిశార్థాన్ని ఇచ్చి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
