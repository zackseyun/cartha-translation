translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణాన్ని ఉపయోగించాం. హీబ్రూ స్థలసంబంధ పదబంధంలోని అస్పష్టతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా, ప్రత్యామ్నాయ భావాలను పాదసూచికలో నిలిపాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
