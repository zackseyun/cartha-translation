translation:
  language: te
  text: ఇక నాలుగో వరుసలో బెరిల్[a], ఓనిక్స్, యాస్పర్ ఉన్నాయి; అవి బంగారు జవుల్లో, వాటివాటి అమరికల్లో పొదిగబడ్డాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రధాన యాజకుని ఛాతీపటకంలోని అనేక రత్నాలు ఖచ్చితంగా ఏవో నిర్ధారించడం కష్టం. ‘బెరిల్,’ ‘ఓనిక్స్,’ ‘యాస్పర్’ అనేవి సాధారణంగా వాడే సాంప్రదాయిక సమానాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాటివాటి అమరికలకు తగినట్లు బంగారు జవుల్లో పొదిగబడ్డాయి.” చివరి హీబ్రూ పదబంధం సాంకేతికమైనది; రాళ్లను వాటికి నిర్దేశించిన గూళ్లలో పొదిగిన విధానాన్ని అది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: ఇక నాలుగో వరుస
  rationale: ఛాతీపటకంలోని రత్నాల అమరికలో טוּר అంటే ‘వరుస’. וְ అనే అనుసంధానాన్ని తెలుగులో సహజంగా ‘ఇక’తో వ్యక్తం చేశాం.
- source_word: תַּרְשִׁישׁ
  choice: బెరిల్
  rationale: ఈ ప్రాచీన రత్నం ఖచ్చితంగా ఏదో అనిశ్చితం. సాధారణంగా అంగీకరించబడిన సమానార్థక రూపాలలో ‘బెరిల్’ ఒకటి; అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: שֹׁהַם
  choice: ఓనిక్స్
  rationale: యాజక సంబంధ సందర్భాల్లో సంప్రదాయంగా వాడే సంక్షిప్త సమానార్థకం; ఖనిజపు ఖచ్చిత గుర్తింపు అనిశ్చితమే.
- source_word: וְיָשְׁפֵה
  choice: యాస్పర్
  rationale: יָשְׁפֵהకు సాధారణంగా గుర్తించబడే ఆధునిక రత్ననామం ‘యాస్పర్’.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: బంగారు జవుల్లో అమర్చబడ్డాయి
  rationale: నిష్క్రియ రూపాన్ని నిలుపుతూ, రాళ్లు బంగారంతో చేసిన అలంకారపు అమరికల్లో బిగించబడ్డాయనే లోహశిల్ప భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמִלֻּאֹתָם
  choice: వాటి పొదుగుల్లో
  rationale: రాళ్లు తమకు నిర్దేశించిన గూళ్లలో లేదా అమరికల్లో పొదగబడ్డాయనే సాంకేతిక భావాన్ని సూచిస్తుంది; మూలంలోని కొంత అస్పష్టతను పాదసూచికలో నిలిపాం.
