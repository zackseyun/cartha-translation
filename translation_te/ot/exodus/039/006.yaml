id: EXO.39.6
reference: Exodus 39:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: te
  text: వారు ఒనిక్స్ రాళ్లను[a] బంగారు పొదుగులతో చుట్టి, ముద్రపై చెక్కినట్లుగా ఇశ్రాయేలు కుమారుల పేర్లను వాటిపై చెక్కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షోహాము రాళ్లు”; ఈ రత్నం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం. “ఒనిక్స్” సంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు ... చేశారు
  rationale: עשה అనే విస్తృతార్థక క్రియ ఇక్కడ చేతిపని సందర్భంలో వస్తువులను రూపొందించడాన్ని సూచిస్తుంది; తెలుగులో వాక్య నిర్మాణానికి అనుగుణంగా చివరి క్రియలో ఆ భావం వ్యక్తమైంది.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: గోమేధిక రాళ్లు
  rationale: שֹׁהַם రత్నం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితమైనప్పటికీ, గుడార సంబంధ సందర్భాల్లో సంప్రదాయంగా ‘ఒనిక్స్/గోమేధికం’ అని అనువదిస్తారు; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: బంగారు పొదుగుల్లో అమర్చి
  rationale: ఈ పదబంధం రాళ్లు బంగారంతో చేసిన అమరికలలో చుట్టబడి లేదా పొదగబడి ఉండడాన్ని సూచిస్తుంది. ‘పొదుగుల్లో అమర్చి’ సహజమైన తెలుగు నగల పనితన పదప్రయోగం; నిర్మాణ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: ముద్ర చెక్కినట్లు వాటిని చెక్కారు
  rationale: మూలంలోని ఒకే ధాతువు నుంచి వచ్చిన క్రియ-నామ పదబంధపు ఉద్ఘాటనను కొంతవరకు నిలిపి, ముద్రపై చేసే లోతైన చెక్కడాన్ని పోలిన విధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל שְׁמוֹת
  choice: పేర్ల ప్రకారం
  rationale: עַל ఇక్కడ సంబంధం లేదా అనురూపతను సూచిస్తుంది; చెక్కిన పేర్లు ఇశ్రాయేలు కుమారుల పేర్లకు అనుగుణంగా ఉన్నాయని ‘ప్రకారం’ తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని పురుష బహువచన నిబంధనాత్మక/గోత్ర సంబంధ ప్రయోగాన్ని నేరుగా నిలుపుతుంది; ‘ఇశ్రాయేలీయులు’ అని సాధారణీకరించదు.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక నిబంధనాత్మక సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతానం / ఇశ్రాయేలీయులు
  rationale: హీబ్రూ పదబంధం వ్యాకరణపరంగా పురుష బహువచనం, అలాగే గోత్రపితల పేర్లను సూచించే స్థిర ప్రయోగం. అందువల్ల మూలంలోని రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. నగల పనితనానికి సహజమైన ‘పొదుగులు’, ‘అమర్చి’, ‘చెక్కారు’ అనే పదాలను ఉపయోగించి, మూలంలోని రత్న గుర్తింపు అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
