    reason: lexical_alternative
  revision_rationale: “ఒనిక్స్” is retained as the conventional rendering but its uncertainty is explicitly preserved in the footnote. The revision replaces the misleading specific gemstone term “గోమేధికం” and makes the seal-style engraving of Israel’s sons’ names explicit in idiomatic modern standard Telugu. “బంగారు పొదుగులతో చుట్టి” reflects the stones being surrounded or mounted in gold settings.
