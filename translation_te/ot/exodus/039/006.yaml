revisions:
- from: వారు గోమేధిక రాళ్లను[a] బంగారు పొదుగుల్లో అమర్చి, ఇశ్రాయేలు కుమారుల పేర్ల ప్రకారం ముద్ర చెక్కినట్లు వాటిని చెక్కారు.
  to: వారు ఒనిక్స్ రాళ్లను[a] బంగారు పొదుగులతో చుట్టి, ముద్రపై చెక్కినట్లుగా ఇశ్రాయేలు కుమారుల పేర్లను వాటిపై చెక్కారు.
