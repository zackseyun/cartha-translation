  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: te
  text: వారు వక్షపతకంపై స్వచ్ఛమైన బంగారంతో తాడువలె పేనిన గొలుసులను[a] చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెలిపెట్టిన పనిగల గొలుసులను,’ లేదా ‘తాడువంటి పనిగల గొలుసులను.’ హీబ్రూ పదాలు పేనిన లేదా తాడువంటి నమూనాలో చేసిన గొలుసులను వర్ణిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు చేశారు
  rationale: עשה అనే సాధారణ క్రియను వరుస కథన రూపంలో సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: עַל הַחֹשֶׁן
  choice: వక్షపతకానికి
  rationale: עַל ఇక్కడ వక్షపతకంపై అమర్చడం లేదా దానికి జతచేయడం అనే సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘వక్షపతకానికి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: שַׁרְשְׁרֹת
  choice: గొలుసులను
  rationale: బహువచన నామవాచకానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: తాడులవలె పేనిన పనిగల
  rationale: అరుదైన גַּבְלֻת పదం మరియు తాడు/మందమైన పేనిన పోగులను సూచించే עֲבֹת కలిసి గొలుసుల తాడు-వంటి నిర్మాణాన్ని వర్ణిస్తున్నాయి; మూలంలోని కొంత అనిశ్చితిని పాదసూచికలో నిలుపుతూ సహజంగా అనువదించబడింది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారంతో
  rationale: వస్తువును చేసిన పదార్థాన్ని తెలుగులో సహజంగా తెలిపే రూపం.
