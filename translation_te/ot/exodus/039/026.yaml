  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: te
  text: ఒక గంట, ఒక దానిమ్మ, ఒక గంట, ఒక దానిమ్మ చొప్పున అంగీ అంచు చుట్టూ పరిచర్య చేయడానికి[a] అమర్చారు—యహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవ కోసం’ లేదా ‘సేవ చేయడానికి.’ హీబ్రూ క్రియానామక రూపం యాజక పరిచర్యలో ఈ అంగీ ఉపయోగించబడే ఉద్దేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: గంట
  rationale: ఈ నామవాచకం ‘గంట’ను సూచిస్తుంది. మునుపటి వచనాల్లో అది బంగారంతో చేసినదని ఉన్నప్పటికీ, ఈ వచనంలో ‘బంగారు’ అని స్పష్టంగా లేదు కాబట్టి ఇక్కడ చేర్చలేదు.
- source_word: רִמֹּן
  choice: దానిమ్మ
  rationale: ఈ పదానికి అక్షరార్థం ‘దానిమ్మ’. ఈ సందర్భంలో దానిమ్మ ఆకారపు అలంకారాన్ని సూచించినా, మూలపదంలోని స్పష్టమైన రూపకల్పనను అలాగే ఉంచాం.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: అంగీ అంచు చుట్టూ
  rationale: שׁוּלֵי అంగీ దిగువ అంచును, סָבִיב దాని చుట్టూ ఉన్న అమరికను సూచిస్తాయి. ఆధునిక తెలుగులో సహజంగా ఉండేలా ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: לְשָׁרֵת
  choice: పరిచర్య చేయడానికి
  rationale: హీబ్రూ క్రియానామక రూపం ఉద్దేశాన్ని తెలియజేస్తుంది. యాజక సంబంధమైన పవిత్ర సేవను సూచించడానికి ‘పరిచర్య చేయడానికి’ అనేది తగినది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితపరమైన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యహ్వే మోషేకు ఆజ్ఞాపించిన ప్రకారమే
  rationale: כַּאֲשֶׁר అనేది ముందుగా ఇచ్చిన ఆజ్ఞకు పని సరిగ్గా అనుగుణంగా జరిగిందనే భావాన్ని తెలియజేస్తుంది; ‘ప్రకారమే’ ఆ నొక్కిచెప్పడాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, ‘Jehovah’ రూపాన్ని కాకుండా ‘Yahweh’కు అనుగుణంగా ‘యహ్వే’ అని ఇచ్చాం.
- issue: לְשָׁרֵת సూచించే ఉద్దేశం
  choice: పరిచర్య చేయడానికి
  alternative: సేవ కోసం; సేవ చేయడానికి
  rationale: ఇది సాధారణ సేవను మాత్రమే కాక యాజకుడు పరిశుద్ధ స్థలంలో చేసే పరిచర్యను సూచిస్తుంది. అయినా వస్త్రానికే కార్యసామర్థ్యం ఆపాదించకుండా, మూలంలోని ఉద్దేశార్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యం ముందరి సందర్భాన్ని కొనసాగిస్తూ క్రియను స్పష్టంగా చెప్పదు; తెలుగులో సంపూర్ణత కోసం ‘అమర్చారు’, ‘వారు చేశారు’ అనే క్రియలను సందర్భానుసారంగా సరఫరా చేశాం. గంట–దానిమ్మల మారుమారుగా ఉన్న క్రమాన్ని ‘చొప్పున’తో స్పష్టం చేశాం. పాదసూచిక לְשָׁרֵתకు సంబంధించినది కాబట్టి దాని వెంటనే [a] గుర్తు ఉంచాం.
