  text: וּ/מִן הַ/תְּכֵ֤לֶת וְ/הָֽ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת הַ/שָּׁנִ֔י עָשׂ֥וּ בִגְדֵי שְׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ וַֽ/יַּעֲשׂ֞וּ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: te
  text: నీలి, ఊదా, ఎర్రని నూలుతో వారు పరిశుద్ధ స్థలంలో సేవ చేయడానికి నైపుణ్యంగా నేసిన వస్త్రాలను[a] తయారు చేశారు. యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే అహరోను కోసం పరిశుద్ధ వస్త్రాలను తయారు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవ కోసం వస్త్రాలు.” ఈ హెబ్రీ పదబంధం ప్రత్యేకమైనది; అది గుడారపు సేవలో ఆ వస్త్రాల విధిని లేదా అవి నైపుణ్యంగా తయారైన తీరును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: నీలం, ఊదా, ఎర్రని నూలుతో
  rationale: మందిర వస్త్రాల సందర్భంలో ఇవి రంగు వేసిన నూలు లేదా వస్త్ర పదార్థాలను సూచిస్తాయి. ఖచ్చితమైన ప్రాచీన వర్ణఛాయలను అతిగా నిర్ధారించకుండా, ఆధునిక తెలుగు పాఠకులకు సహజమైన రంగు పదాలు వాడబడ్డాయి.
- source_word: בִגְדֵי שְׂרָד
  choice: నైపుణ్యంగా నేసిన వస్త్రాలు
  rationale: ఈ ప్రత్యేక పదబంధం వస్త్రాల సున్నితమైన తయారీని లేదా మందిర సేవలో వాటి విధిని సూచించవచ్చు. ప్రధాన పాఠంలో నేసిన పనితనాన్ని చూపించి, సేవా విధిని సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాము.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: పరిశుద్ధ స్థలంలో జరిగే అధికారిక ఆరాధనా సేవను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: ఇక్కడ పదం అమూర్తమైన పరిశుద్ధతను కాకుండా గుడారపు పవిత్ర పరిధిని సూచిస్తుంది. నిర్దిష్ట అంతర్గది అని అతిగా కుదించకుండా ఈ రూపం మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్త్రాలు
  rationale: అహరోనుకు నియమించబడిన యాజక వస్త్రాలకు సంబంధించిన అధికారిక భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: לְאַהֲרֹן
  choice: అహరోను కోసం
  rationale: ఈ వస్త్రాలు అహరోను ఉపయోగం కోసం నిర్దేశించబడ్డాయని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: యాహ్వే మోషేకు ఆజ్ఞాపించినట్టుగానే
  rationale: ముందుగా ఇచ్చిన దైవ ఆదేశాలకు అనుగుణంగా పని పూర్తయిందనే కథన సారాంశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణలో ఇచ్చాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని రెండు వాక్యభాగాల పునరుక్తిని నిలిపి, వివాదాస్పదమైన בִגְדֵי שְׂרָד భావాన్ని పాదటిప్పణితో సంరక్షించాం.
