  yaml_path: translation/ot/exodus/039/024.yaml
  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: te
  text: వారు ఆ నిలువంగి దిగువ అంచులపై మెలిపెట్టిన నీలం, ఊదా, ఎర్రని నూలుతో దానిమ్మపండ్ల ఆకారపు అలంకారాలను[a] చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దానిమ్మపండ్లు.’ ఇక్కడ నూలుతో చేసిన దానిమ్మపండ్ల ఆకారపు అలంకారాలు ఉద్దేశించబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు ... చేశారు
  rationale: עשה అనే క్రియ యొక్క సాధారణ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: ఆ నిలువంగి అంచులపై
  rationale: שׁוּלֵי వస్త్రపు దిగువ అంచులను సూచిస్తుంది; מְעִיל యాజకుని పొడవైన పైవస్త్రం. ‘నిలువంగి’ ఈ సందర్భంలో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: רִמּוֹנֵי
  choice: దానిమ్మపండ్ల ఆకారపు అలంకారాలను
  rationale: హీబ్రూ అక్షరార్థంగా ‘దానిమ్మపండ్లు’ అంటుంది; అయితే వస్త్ర సందర్భంలో ఇవి దానిమ్మ ఆకారంలో చేసిన అలంకారాలని స్పష్టం చేయడం తెలుగులో అపార్థాన్ని నివారిస్తుంది. అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: నీలం, ఊదా, ఎర్రని నూలుతో
  rationale: ఇవి పరిశుద్ధ మందిరపు వస్త్రపనిలో వాడిన రంగుల పదార్థాలు. తెలుగు వాక్యానికి అవసరమైన ‘నూలు’ను స్పష్టత కోసం చేర్చాం.
- source_word: מָשְׁזָר
  choice: పేనిన
  rationale: ఈ పదం మెలిపెట్టి లేదా కలిపి చేసిన నూలుపనిని సూచిస్తుంది. ‘పేనిన’ తెలుగు వస్త్రపని సందర్భంలో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ పదక్రమం కంటే సహజమైన తెలుగు క్రమానికి ప్రాధాన్యమిస్తూ, వస్త్రపని భావాన్ని స్పష్టంగా ఉంచాం.
