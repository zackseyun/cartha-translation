    issue: The initial Hebrew conjunction is not represented in the main text.
    rationale: Although Telugu list style can sometimes leave such a conjunction implicit, the source and English audit explicitly mark this row as continuing the preceding list; “మరియు” preserves that relation in a stand-alone verse.
  - severity: low
    issue: The main-text transliteration “లేశెము” departs from the English audit’s selected rendering “jacinth.”
    rationale: The lexical uncertainty should be preserved, but the selected rendering can be used in the text while alternatives remain in the footnote.
