  yaml_path: translation/ot/exodus/039/012.yaml
  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: te
  text: 'మరియు మూడవ వరుసలో: జసింతు[a], అగేట్[b], మరియు అమెథిస్టు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రధాన యాజకుని రొమ్ముపతకంలోని అనేక ప్రాచీన రత్నాలను ఖచ్చితంగా గుర్తించడం సాధ్యం కాదు. ‘జసింతు’ను ‘అంబరు’ అని కూడా అనువదించవచ్చు; పాత ఆంగ్ల సంప్రదాయంలో దీనిని ‘లిగ్యూర్’ అని పిలిచేవారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఓనిక్స్’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הַשְּׁלִישִׁי
  choice: మూడవ వరుసలో
  rationale: טוּר ఇక్కడ రత్నాల అమరికలోని ‘వరుస’ను సూచిస్తుంది. తెలుగు జాబితా నిర్మాణంలో ‘వరుసలో’ సహజంగా ఉంటుంది; ఆరంభ וְ ముందటి వాక్యంతో జాబితా కొనసాగింపును సూచిస్తున్నందున ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
- source_word: לֶשֶׁם
  choice: లేశెము
  rationale: ఈ ప్రాచీన రత్నం ఏదో ఖచ్చితంగా తెలియదు. నిర్ధారణలేని ఆధునిక రత్ననామాన్ని ప్రధాన పాఠ్యంలో విధించకుండా, హెబ్రీ పేరును లిప్యంతరీకరించి సందిగ్ధతను నిలిపాం.
- source_word: שְׁבוֹ
  choice: అగేటు
  rationale: ఈ సందర్భంలో సంప్రదాయంగా అగేటుగా గుర్తిస్తారు; అయితే ఓనిక్స్ అనే గుర్తింపూ సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: וְאַחְלָמָה
  choice: అమెథిస్టు
  rationale: אַחְלָמָהను సాధారణంగా అమెథిస్టుగా గుర్తిస్తారు. జాబితా చివరి అంశమని తెలుగులో విరామచిహ్నం ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని ఉపయోగించాం. తెలియని రత్నానికి హెబ్రీ నామాన్ని లిప్యంతరీకరించి, సాధ్యమైన గుర్తింపులను పాదసూచికలో ఇచ్చాం; మిగతా రత్ననామాలకు ప్రస్తుత తెలుగులో సులభంగా గుర్తించగల రూపాలను వాడాం.
