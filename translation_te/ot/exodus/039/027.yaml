  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: te
  text: వారు అహరోనుకూ అతని కుమారులకూ సన్నని నారతో, నేతకారుని పనితనంతో అంగీలను తయారుచేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేతకారుని పని.” హీబ్రూ పదబంధం ఈ అంగీలు నేయడం ద్వారా తయారయ్యాయని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు ... చేశారు
  rationale: עשה అనే క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి కార్యాన్ని తెలియజేస్తుంది. వావ్ సంధిని తెలుగులో విడిగా ‘మరియు’ అని పెట్టకుండా సహజ కథన ప్రవాహంలో ఇమిడ్చాం.
- source_word: הַכָּתְנֹת
  choice: అంగీలను
  rationale: כֻּתֹּנֶת/כָּתְנֹת శరీరంపై ధరించే పొడవైన వస్త్రాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘అంగీ’ అనేది సాధారణ ‘వస్త్రం’ కంటే నిర్దిష్టమైనది.
- source_word: שֵׁשׁ
  choice: సన్నని నారతో
  rationale: ప్రత్యక్ష గుడారం, యాజక వస్త్రాల సందర్భంలో שֵׁשׁ నాణ్యమైన సన్నని నారను సూచిస్తుంది. ‘తో’ విభక్తి దాని పదార్థార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: నేతపనిగా
  rationale: ఈ సమాస పదబంధం నేత ద్వారా చేసిన పనిని నొక్కిచెబుతుంది. ‘నేతపనిగా’ అనే రూపం తయారీ విధానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: అహరోనుకు, అతని కుమారులకు
  rationale: రెండుసార్లు వచ్చిన לְ భావాన్ని రెండు దత్తివ విభక్తి రూపాలతో నిలిపి, అహరోనును అతని కుమారులనుంచి స్పష్టంగా వేరు చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పదార్థం, తయారీ విధానం రెండింటినీ స్పష్టంగా ఉంచాం; కథన వావ్‌ను తెలుగులో కృత్రిమంగా అనువదించలేదు.
