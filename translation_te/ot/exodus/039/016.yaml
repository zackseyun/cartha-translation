source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֗וּ שְׁתֵּי֙ מִשְׁבְּצֹ֣ת זָהָ֔ב וּ/שְׁתֵּ֖י טַבְּעֹ֣ת זָהָ֑ב וַֽ/יִּתְּנ֗וּ אֶת שְׁתֵּי֙ הַ/טַּבָּעֹ֔ת עַל שְׁנֵ֖י קְצ֥וֹת הַ/חֹֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/016.yaml
  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: te
  text: వారు రెండు బంగారు చట్రాలను, రెండు బంగారు ఉంగరాలను చేశారు; ఆ రెండు ఉంగరాలను వక్షపతకపు రెండు చివరలపై అమర్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: వారు ... చేశారు
  rationale: עשה అనే క్రియ యొక్క బహువచన రూపం వరుసగా జరిగిన తదుపరి పనిని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం కర్తను స్పష్టంగా ఉంచి అనువదించాం.
- source_word: מִשְׁבְּצֹת
  choice: చట్రాలు
  rationale: యాజక వస్త్రాల బంగారు పనిలో అమరికకు ఉపయోగించే settings లేదా mountings‌ను సూచించే పదం. తయారీ విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘చట్రాలు’ అనే స్పష్టమైన ఆధునిక పదాన్ని ఎంచుకున్నాం.
- source_word: זָהָב
  choice: బంగారు
  rationale: బంగారంతో చేసిన వస్తువులను తెలుగులో సహజంగా సూచించే విశేషణ రూపం; మూలంలో రెండుసార్లు ఉన్న పదాన్ని రెండు వస్తువులకూ నిలిపాం.
- source_word: טַבְּעֹת
  choice: ఉంగరాలు
  rationale: వస్తువులను కలిపేందుకు లేదా బిగించేందుకు ఉపయోగించే వలయాలను సూచించే సాధారణ పదం.
- source_word: וַיִּתְּנוּ
  choice: అమర్చారు
  rationale: ఈ నిర్మాణ సందర్భంలో נתן అంటే కేవలం ఇవ్వడం కాక ఒక స్థానంలో పెట్టడం లేదా బిగించడం; ‘అమర్చారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: '...కు'
  rationale: ఉంగరాలు వక్షపతకం చివర్లపై/వద్ద అమర్చబడిన సంబంధాన్ని తెలుగులో సహజంగా ‘చివర్లకు’ అని వ్యక్తపరిచాం.
- source_word: שְׁנֵי קְצֹוֹת
  choice: రెండు చివర్లు
  rationale: మూలంలోని నిర్దిష్ట స్థల సూచనను నేరుగా నిలుపుతుంది.
- source_word: הַחֹשֶׁן
  choice: వక్షపతకం
  rationale: ప్రధాన యాజకుని ఛాతీపై ధరించే ప్రత్యేక వస్తువును సూచించే సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
