translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు వరుస క్రియలను తెలుగులో రెండు చిన్న వాక్యాలుగా ఇచ్చి స్పష్టతను పెంచాం; సంఖ్యలు, పదార్థం, అమర్చిన స్థానం అన్నీ యథాతథంగా నిలిపాం.
