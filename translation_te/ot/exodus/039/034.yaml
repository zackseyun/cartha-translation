translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితాలోని పదబంధంగా సహజంగా చదివేలా అనువదించబడింది. గౌరవప్రదమైన గుడార సంబంధ పదజాలాన్ని ఉంచుతూ, అరుదైన సాంకేతిక పదాలకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే రూపాలు వాడబడ్డాయి. పాదసూచిక గుర్తు సంబంధిత అనిశ్చిత పదబంధం వెంటనే ఉంచబడింది.
