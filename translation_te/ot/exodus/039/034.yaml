  text: וְ/אֶת מִכְסֵ֞ה עוֹרֹ֤ת הָֽ/אֵילִם֙ הַ/מְאָדָּמִ֔ים וְ/אֶת מִכְסֵ֖ה עֹרֹ֣ת הַ/תְּחָשִׁ֑ים וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/034.yaml
  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: te
  text: ఎరుపు రంగు వేసిన పొట్టేళ్ల తోళ్లతో చేసిన కప్పు, నాణ్యమైన తోళ్లతో చేసిన కప్పు[a], తెరకు చెందిన అడ్డుతెర;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నాణ్యమైన తోళ్లు” అని అనువదించిన హీబ్రూ పదం תְּחָשִׁים (తహషీమ్) దేనిని సూచిస్తుందో ఖచ్చితంగా తెలియదు. ఇది ఒక ప్రత్యేక జంతువు తోళ్లను సూచించవచ్చు; సంప్రదాయంగా దీనిని పర్పాయిస్ లేదా డుగాంగ్ తోళ్లు అని, లేదా “తహష్ తోళ్లు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: కప్పు
  rationale: దేనినైనా కప్పే వస్తువును సూచించే నామవాచక రూపాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో నిలుపుతుంది.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: ఎరుపు రంగు వేసిన పొట్టేళ్ల తోళ్లు
  rationale: తోళ్లు, పొట్టేళ్లు, ఎరుపుగా చేయబడినవి అనే మూలపాఠంలోని భావాలన్నిటినీ స్పష్టంగా తెలియజేస్తుంది; సహజ రంగు అని కాకుండా రంగు వేసినవని సూచిస్తుంది.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: నాణ్యమైన తోళ్లు
  rationale: תְּחָשִׁים ఏ జంతువును సూచిస్తుందో అనిశ్చితం. నిర్దిష్ట జంతువును ఊహించకుండా, గుడారపు బయటి కప్పుకు ఉపయోగించిన సంస్కరించిన తోలు అనే సాధారణ భావాన్ని పఠనయోగ్యంగా అందిస్తుంది; అనిశ్చితిని పాదసూచికలో వెల్లడిస్తుంది.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: అడ్డుగా ఉండే తెర
  rationale: పరిశుద్ధ గుడారంలో విభజన కలిగించి లోపలి భాగాన్ని మరుగుచేసే తెర యొక్క కార్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రెండు తెలుగు నామవాచకాలను బలవంతంగా పేర్చకుండా మూలంలోని సంబంధాన్ని నిలుపుతుంది.
