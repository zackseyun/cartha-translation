base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: te
  text: వారు బంగారు పలకలను పలుచగా కొట్టి, వాటిని సన్నని తంతువులుగా కోశారు[a]. నిపుణుడైన కళాకారుని పనిగా వాటిని నీలి నూలులోను, ఊదా నూలులోను, ఎర్రని నూలులోను, సన్నని నారబట్టలోను కలిపి నేయడానికి ఇలా చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సన్నని తంతువులుగా’ అనే చోట ‘సన్నని చారలుగా’ అని కూడా అనువదించవచ్చు. పలుచగా కొట్టిన బంగారాన్ని వస్త్రంలో నేయడానికి తగిన సన్నని భాగాలుగా సిద్ధం చేశారనేది భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘నిపుణుడైన కళాకారుని పనిగా’ అనేది కళాత్మక నమూనాతో చేసిన నిపుణమైన పనిని సూచించే సాంకేతిక పదబంధం. ‘నిపుణుడైన పనివాని పనిగా’ లేదా ‘కళాత్మక నేతపనిగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: వారు బంగారు రేకులను సుత్తితో పలుచగా కొట్టి
  rationale: רקע లోహపు పనిలో కొట్టి పలుచగా చేయడాన్ని, פַּחֵי పలుచని లోహపు రేకులను సూచిస్తాయి. తెలుగు పాఠకుడికి ప్రక్రియ స్పష్టమయ్యేలా ‘సుత్తితో పలుచగా కొట్టి’ అని అనువదించాం.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: వాటిని పోగులుగా కోశారు
  rationale: బంగారు రేకులను నేతలో ఉపయోగించగల సన్నని తంతువులు లేదా చారలుగా కోయడమే సందర్భార్థం. ‘పోగులు’ నూలుతో కలిపి నేసే తంతువుల భావాన్ని సహజంగా తెలియజేస్తుంది; ఖచ్చిత ఆకృతి విషయంలోని స్వల్ప సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: కలిపి నేయడానికి
  rationale: పదశః ‘మధ్యలో చేయడానికి’ అనే నిర్మాణం ఇక్కడ బంగారు పోగులను రంగు నూలు, నారలో చేర్చి నేతపనిలో ఉపయోగించడాన్ని సూచిస్తుంది. సందర్భానికి సహజమైన తెలుగులో ఉద్దేశాన్ని వ్యక్తం చేశాం.
- source_word: הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: నీలం, ఊదా, ఎర్రని నూలు
  rationale: ఇవి గుడారపు వస్త్రాలలో వాడిన రంగు వేసిన పదార్థాలను సూచిస్తాయి. తెలుగు వాక్యంలో నేత సందర్భాన్ని స్పష్టం చేయడానికి ‘నూలు’ను సమష్టిగా చేర్చాం.
- source_word: הַשֵּׁשׁ
  choice: సన్నని నార
  rationale: שֵׁשׁ గుడారపు సందర్భంలో మెత్తని లేదా నాణ్యమైన నార వస్త్ర పదార్థాన్ని సూచిస్తుంది. ‘సన్నని నార’ మూలంలోని పదార్థం, నాణ్యత రెండింటినీ సంక్షిప్తంగా అందిస్తుంది.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: నైపుణ్యంగల రూపకర్త పని
  rationale: ఇది నైపుణ్యంతో రూపొందించిన కళాత్మక లేదా నమూనా నేతపనిని సూచించే సాంకేతిక పదబంధం. ‘రూపకర్త’ ఉద్దేశపూర్వక కళానైపుణ్యాన్ని నిలుపుతుంది; నిర్దిష్ట వృత్తిపాత్రను అతిగా నిర్ణయించదు.
