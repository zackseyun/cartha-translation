translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్పష్టత కోసం ‘అంటే’ ఉపయోగించబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
