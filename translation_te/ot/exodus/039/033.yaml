source:
  edition: WLC
  text: וַ/יָּבִ֤יאוּ אֶת הַ/מִּשְׁכָּן֙ אֶל מֹשֶׁ֔ה אֶת הָ/אֹ֖הֶל וְ/אֶת כָּל כֵּלָ֑י/ו קְרָסָ֣י/ו קְרָשָׁ֔י/ו בריח/ו וְ/עַמֻּדָ֥י/ו וַ/אֲדָנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: te
  text: 'అప్పుడు వారు నివాసమందిరాన్ని, అంటే గుడారాన్ని మరియు దాని సామగ్రి అంతటినీ, మోషే వద్దకు తీసుకొచ్చారు: దాని కొక్కేలు, పలకలు[a], అడ్డకర్రలు, స్తంభాలు, అడుగుదిమ్మలు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రాలు.’ హీబ్రూ పదం నివాసమందిరంలోని నిలువు నిర్మాణ భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాకెట్లు.’ హీబ్రూ పదం పలకలు లేదా స్తంభాలు అమర్చబడే అడుగు భాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: అప్పుడు వారు ... తీసుకొచ్చారు
  rationale: హిఫీల్ వయ్యిక్టోల్ కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని ఇస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: నివాసమందిరం
  rationale: నిర్గమకాండంలోని దేవుని పవిత్ర నివాస నిర్మాణాన్ని సూచించే పదం; ‘నివాసమందిరం’ అర్థాన్ని, ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל מֹשֶׁה
  choice: మోషే దగ్గరకు
  rationale: אֶל ఇక్కడ వ్యక్తివైపు గమనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: הָאֹהֶל
  choice: గుడారం
  rationale: మూలపదానికి సాధారణ అర్థం ‘గుడారం’; ఇది మొత్తం నివాసమందిరంలో గుడార భాగాన్ని ప్రత్యేకంగా పేర్కొంటుంది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రి అంతా
  rationale: כֵּלִים అనేది ఉపకరణాలు, వస్తువులు, నిర్మాణ భాగాలు అన్నింటినీ కలుపగల విస్తృత పదం; ‘సామగ్రి’ ఈ విస్తృతిని నిలుపుతుంది.
- source_word: קְרָסָיו
  choice: దాని కొక్కేలు
  rationale: తెరలను ఒకదానితో ఒకటి కలిపే fastening pieces‌ను సూచిస్తుంది; ‘కొక్కేలు’ సాధారణ పాఠకులకు స్పష్టమైన నిర్మాణ పదం.
- source_word: קְרָשָׁיו
  choice: దాని పలకలు
  rationale: నివాసమందిరంలోని నిలువు నిర్మాణ భాగాలను సూచించే పదం; ‘పలకలు’ సంప్రదాయమైనదీ, సులభంగా అర్థమయ్యేదీ. వాటి ఖచ్చిత నిర్మాణ స్వరూపం అనిశ్చితమైనందున పాదటిప్పణి ఇవ్వబడింది.
- source_word: בריחו
  choice: దాని అడ్డకర్రలు
  rationale: నిలువు పలకలను కలిపి బిగించే అడ్డంగా అమర్చిన కర్రలను సూచిస్తుంది; ‘అడ్డకర్రలు’ పనితీరును స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמֻּדָיו
  choice: దాని స్తంభాలు
  rationale: నిర్మాణంలోని నిలువు ఆధారాలను సూచిస్తుంది; ‘స్తంభాలు’ ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: אֲדָנָיו
  choice: దాని పీఠాలు
  rationale: పలకలు లేదా స్తంభాలు అమర్చబడే అడుగు భాగాలను సూచిస్తుంది; ‘పీఠాలు’ సహజంగా ఉండగా, మరింత సాంకేతిక అర్థం పాదటిప్పణిలో నిలుపబడింది.
