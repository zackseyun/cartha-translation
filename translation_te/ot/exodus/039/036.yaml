  text: బల్లను, దాని సామగ్రినంతటినీ, సన్నిధి రొట్టెలను—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: బల్లను
  rationale: שֻׁלְחָן సాధారణంగా ‘బల్ల’ను సూచిస్తుంది. సందర్భం ఇప్పటికే ప్రత్యక్ష గుడారపు సామగ్రిని గుర్తిస్తున్నందున, మూలంలో లేని వివరణను చేర్చకుండా సరళంగా అనువదించబడింది.
- source_word: כָּל כֵּלָיו
  choice: దాని సామగ్రినంతటినీ
  rationale: כְּלִי అనేది పాత్ర, పనిముట్టు లేదా సామగ్రి అనే విస్తృతార్థ పదం. బల్లకు సంబంధించిన అన్ని వస్తువులను సహజమైన ఆధునిక తెలుగులో సమగ్రంగా సూచించడానికి ‘సామగ్రి’ ఎంచుకోబడింది.
- source_word: לֶחֶם הַפָּנִים
  choice: సన్నిధి రొట్టెలను
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ముఖం/సన్నిధి యొక్క రొట్టె.’ దేవుని సమక్షంలో ఉంచే పవిత్ర రొట్టెల భావాన్ని సంక్షిప్తంగా, పారదర్శకంగా నిలుపుటకు ‘సన్నిధి రొట్టెలు’ ఎంచుకోబడింది.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: ప్రత్యేక పదాలతో అనువదించలేదు
  rationale: ఇవి జాబితాలోని కర్మపదాలను సమన్వయపరచే గుర్తులు. తెలుగులో వాటి పని విభక్తి ప్రత్యయాలు, కామాలు, చివరి సముచ్చయం ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఇది మునుపటి వచనంలోని క్రియకు కొనసాగింపైన జాబితా కావడంతో చివరలో దీర్ఘ విరామచిహ్నం ఉంచబడింది.
