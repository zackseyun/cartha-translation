base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: te
  text: మంచు పొర పైకిలేచిన తరువాత, ఇదిగో, అరణ్యపు నేలపై సన్నని, రేకులవంటి పదార్థం ఉంది—నేలమీది పాలమంచువలె సన్ననిది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సన్నని, రేణువులవంటి పదార్థం.’ ‘రేకులవంటి’ అని అనువదించిన అరుదైన హెబ్రీ పదం యొక్క కచ్చితమైన భావం అనిశ్చితం; అది ఆకృతిని గానీ ఉపరితల స్వభావాన్ని గానీ వర్ణించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: పైకి లేచిపోయినప్పుడు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లడం’ అనే భావం ఉంది. మంచు తొలగిపోయిన సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తూనే, ‘ఆవిరైపోయింది’ అని మూలంలో లేని ప్రక్రియను స్పష్టీకరించకుండా ఈ రూపం మూలచిత్రాన్ని నిలుపుతుంది.
- source_word: שִׁכְבַת הַטָּל
  choice: మంచు పొర
  rationale: שִׁכְבָה పరచుకొని ఉన్న పొరను సూచిస్తుంది; טַל ఇక్కడ నేలపై పడిన మంచు లేదా తేమ. ‘మంచు పొర’ ఆధునిక తెలుగులో సహజంగా ఉండి, పదబంధంలోని భౌతిక చిత్రాన్ని అందిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే అకస్మాత్తుగా కనిపించిన దానిపై దృష్టి నిలిపే ఉద్ఘాటక పదం. ‘ఇదిగో’ దాని జీవత్వాన్ని కాపాడుతుంది.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: అరణ్యపు నేలమీద
  rationale: పదశః ‘అరణ్యపు ముఖం/ఉపరితలం మీద.’ తెలుగులో ‘అరణ్యపు నేలమీద’ స్పష్టంగా, సహజంగా ఉంటుంది; מִדְבָּרను తప్పనిసరిగా ఇసుక ఎడారిగా సంకుచితం చేయదు.
- source_word: דַּק
  choice: సన్నని / సన్నగా
  rationale: ఈ విశేషణం పలుచదనం లేదా సూక్ష్మతను సూచిస్తుంది. హెబ్రీలోని పునరుక్తిని తెలుగులో రెండు చోట్ల ‘సన్నని/సన్నగా’ అని నిలిపాం.
- source_word: מְחֻסְפָּס
  choice: పొలుసులవంటి పదార్థం
  rationale: ఇది అత్యంత అరుదైన, అర్థసూక్ష్మత అనిశ్చితమైన పదం; ఆకృతి లేదా ఉపరితల స్వభావాన్ని వర్ణించవచ్చు. ‘పొలుసులవంటి’ సాధ్యమైన భావాన్ని ఇస్తుంది; హెబ్రీలో నామవాచకం అంతర్లీనంగా ఉన్నందున తెలుగులో ‘పదార్థం’ చేర్చబడింది.
- source_word: דַּק כַּכְּפֹר
  choice: హిమంలా సన్నగా
  rationale: כְּפֹר నేలమీద ఏర్పడే frost/hoarfrost‌ను సూచిస్తుంది. ‘హిమం’ పోలికను సహజంగా తెలియజేస్తుంది; דַּק పునరుక్తిని ‘సన్నగా’ నిలుపుతుంది.
- source_word: עַל הָאָרֶץ
  choice: నేలమీది
  rationale: ఈ భౌతిక సందర్భంలో אֶרֶץకు ‘నేల’ సహజమైన తెలుగు సమానార్థకం.
