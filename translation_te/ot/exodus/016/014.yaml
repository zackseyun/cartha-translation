translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఆకస్మిక దృష్ట్యాకర్షణను నిలుపుతుంది. అరుదైన מְחֻסְפָּס పదంలోని అనిశ్చితిని పాఠ్యంలో సాధ్యమైన అనువాదంతో, పాదసూచికలో ప్రత్యామ్నాయంతో స్పష్టంగా కాపాడాం.
