  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י יָצְא֥וּ מִן הָ/עָ֖ם לִ/לְקֹ֑ט וְ/לֹ֖א מָצָֽאוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: te
  text: ఏడవ రోజున ప్రజల్లో కొందరు ఏరుకోవడానికి బయలుదేరారు[a]; అయితే వారికి ఏమీ దొరకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ప్రజల్లోనుంచి’; అంటే ప్రజలందరూ కాక వారిలో కొందరు మాత్రమే బయలుదేరారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఏడవ రోజున … బయలుదేరారు
  rationale: హీబ్రూ కథన క్రమాన్ని సూచించే וַיְהִיని తెలుగులో విడిగా ‘జరిగింది’ అని అనువదిస్తే వాక్యం కృత్రిమంగా ఉంటుంది; సహజమైన కథన నిర్మాణంలో కాలసూచక పదబంధంతో కలిపి వ్యక్తపరచబడింది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: మూలంలో ఉన్న ‘ఏడవ రోజు’నే అనువదించి, లేని ‘వారంలో’ అనే మాటను చేర్చలేదు.
- source_word: יָצְאוּ
  choice: బయలుదేరారు
  rationale: శిబిరం లేదా నివాసస్థలం నుంచి వెళ్లడాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִן הָעָם
  choice: ప్రజల్లో కొందరు
  rationale: מן ఇక్కడ సమూహంలో ఒక భాగాన్ని సూచిస్తుంది; ప్రజలందరూ కాక వారిలో కొందరే వెళ్లారనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לִלְקֹט
  choice: ఏరుకోవడానికి
  rationale: לקט అంటే చెల్లాచెదురుగా ఉన్నదాన్ని ఏరడం లేదా సేకరించడం. ముందు సందర్భంలో మన్నా స్పష్టంగా ఉన్నందున దాని పేరును ఇక్కడ చేర్చలేదు.
- source_word: וְלֹא מָצָאוּ
  choice: అయితే వారికి ఏమీ దొరకలేదు
  rationale: అక్షరార్థంగా ‘వారు కనుగొనలేదు’; వారి ప్రయత్నం విఫలమైందనే వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది, ‘ఏమీ’ సందర్భంలో ఉద్దేశిత వస్తువు దొరకలేదని సూచిస్తుంది.
