  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: te
  text: '“యహ్వే ఆజ్ఞాపించిన మాట ఇదే: ‘ప్రతి పురుషుడు తాను తినే పరిమాణం ప్రకారం దానిలోనుంచి ఏరుకోవాలి. మీ వ్యక్తుల సంఖ్యను బట్టి, ఒక్కొక్కరికి[a] ఒక ఓమెరు చొప్పున తీసుకోవాలి. ప్రతి పురుషుడు తన గుడారంలో ఉన్నవారి కోసం తీసుకోవాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక్కొక్క తలకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: మాట
  rationale: ఆజ్ఞను పరిచయం చేసే זֶה הַדָּבָר אֲשֶׁר צִוָּה అనే సూత్రప్రాయ ప్రయోగంలో ‘మాట’ సహజంగా ఉండి, పలికిన ఆజ్ఞ అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యనువాదాన్ని తెలుగులో అందిస్తుంది.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: దానిలోనుంచి ఏరుకోవాలి
  rationale: לקט నేలపై ఉన్న ఆహారాన్ని ఏరడం లేదా సమకూర్చడం అనే భావాన్ని ఇస్తుంది; మన్నా సందర్భంలో ‘ఏరుకోవాలి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ప్రతి పురుషుడు తాను తినే పరిమాణం ప్రకారం
  rationale: אִישׁ యొక్క పుంలింగ ఏకవచన విభజనార్థాన్ని ‘ప్రతి పురుషుడు’ నిలుపుతుంది; לְפִי אָכְלוֹ అనే పరిమాణసూచక నుడికారాన్ని అతి స్వేచ్ఛగా మార్చకుండా అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: עֹמֶר
  choice: ఒక ఓమెరు
  rationale: ఇది నిర్దిష్టమైన ప్రాచీన పొడి కొలత; అనిశ్చితమైన ఆధునిక కొలతగా మార్చకుండా ధ్వన్యనువాదం చేయబడింది.
- source_word: לַגֻּלְגֹּלֶת
  choice: ఒక్కొక్కరికి
  rationale: అక్షరార్థంగా ‘ఒక్కొక్క తలకు’ అయినా, ఇక్కడ వ్యక్తుల లెక్కను సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన భావాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: మీలోని వ్యక్తుల సంఖ్యను బట్టి
  rationale: נֶפֶשׁ ఇక్కడ అభౌతిక ‘ఆత్మ’ను కాక లెక్కించబడే వ్యక్తిని సూచిస్తుంది; తెలుగు అనువాదం ఆ అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: తన గుడారంలో ఉన్నవారి కోసం
  rationale: ‘కుటుంబం’ అని విస్తరించి వ్యాఖ్యానించకుండా, మూలంలోని గుడారం అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: תִּקָּחוּ
  choice: తీసుకోవాలి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞాబలాన్ని తెలుగులో సహజమైన విధిరూపంతో వ్యక్తం చేస్తూ, వాక్యంలోని విభజనార్థక ‘ప్రతి పురుషుడు’తో సరిపోల్చింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Jehovah’ రూపాన్ని సూచించే ‘యెహోవా’కు బదులుగా ‘Yahweh’కు సమీపమైన తెలుగు ధ్వన్యనువాదాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను, సాధారణ పాఠకులకు స్పష్టతను సమతుల్యం చేశాం. మూలంలోని పుంలింగ విభజనార్థక אִישׁ ను ‘ప్రతి పురుషుడు’గా నిలిపి, గుడారం అనే స్పష్టమైన చిత్రాన్ని సంరక్షించాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
