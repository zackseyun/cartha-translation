translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇశ్రాయేలు ఇంటివారు’ ద్వారా మూలంలోని సమష్టి వ్యక్తీకరణను నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
