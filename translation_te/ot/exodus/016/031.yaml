  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: te
  text: ఇశ్రాయేలు ఇంటివారు దానికి మన్నా[a] అని పేరు పెట్టారు. అది తెల్లని ధనియాల గింజలా[b] ఉండేది; దాని రుచి తేనెతో చేసిన పలుచని రొట్టెలా[c] ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మన్’; తెలుగులో సంప్రదాయంగా ‘మన్నా’ అని పిలుస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధనియాల గింజలా, తెల్లగా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తేనె కలిపిన అప్పంలా”; ఇక్కడి హీబ్రూ పదం పలుచని రొట్టెను లేదా అప్పాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఇంటివారు ... పేరు పెట్టారు
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే హీబ్రూ సమష్టి వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, קרא యొక్క నామకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת־שְׁמוֹ מָן
  choice: దానికి మన్నా అని
  rationale: ‘దాని పేరు మన్’ అనే మూల నిర్మాణాన్ని సహజమైన తెలుగు నామకరణ వాక్యంగా అందిస్తుంది; సంప్రదాయంగా సుపరిచితమైన ‘మన్నా’ రూపాన్ని వాడింది.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: తెల్లని ధనియాల గింజలా
  rationale: זֶרַע ‘గింజ’, גַּד సాధారణంగా ‘ధనియాలు’, לָבָן ‘తెల్లని’; పోలికను సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: וְטַעְמוֹ
  choice: దాని రుచి
  rationale: טַעַם యొక్క ఆహారసంబంధ సాధారణ అర్థమైన ‘రుచి’ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: తేనెతో చేసిన పలుచని రొట్టెలా
  rationale: צַפִּיחִת సూచించే పలుచని కాల్చిన ఆహారాన్ని తెలుగులో అర్థమయ్యేలా ‘పలుచని రొట్టె’గా, בִּדְבָשׁను పదార్థసంబంధ భావంలో ‘తేనెతో చేసిన’గా అందిస్తుంది; నామవాచకపు ఖచ్చిత రూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో ఉంచింది.
