- from: '“ఇశ్రాయేలు కుమారుల సణుగులు నేను విన్నాను. వారితో ఇలా చెప్పు: ‘సంధ్యవేళలో మీరు మాంసం తింటారు; ఉదయాన రొట్టె తిని తృప్తి చెందుతారు. అప్పుడు నేనే మీ దేవుడైన యహ్వే అని మీరు తెలుసుకుంటారు.’”'
  to: '“ఇశ్రాయేలు కుమారుల సణుగులు నేను విన్నాను. వారితో ఇలా చెప్పు: ‘సంధ్యవేళలో మీరు మాంసం తింటారు; ఉదయాన రొట్టెతో తృప్తి చెందుతారు. అప్పుడు నేనే మీ దేవుడైన యహ్వే అని మీరు తెలుసుకుంటారు.’”'
  rationale: A single small revision replaces ‘రొట్టె తిని తృప్తి చెందుతారు’ with ‘రొట్టెతో తృప్తి చెందుతారు,’ maintaining natural modern Telugu while more precisely reflecting the Hebrew prepositional expression לָחֶם (‘with bread’). No footnote is necessary because ‘సంధ్యవేళలో’ conveys the idiom’s ordinary temporal sense without over-specifying its debated precise boundaries.
