id: EXO.16.12
reference: Exodus 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: te
  text: '“ఇశ్రాయేలు కుమారుల సణుగులు నేను విన్నాను. వారితో ఇలా చెప్పు: ‘సంధ్యవేళలో మీరు మాంసం తింటారు; ఉదయాన రొట్టెతో తృప్తి చెందుతారు. అప్పుడు నేనే మీ దేవుడైన యహ్వే అని మీరు తెలుసుకుంటారు.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: నేను విన్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను సహజమైన ఆధునిక తెలుగులో భూతకాలంగా అనువదించాం; దేవుడు వారి సణుగులకు ఇప్పుడు స్పందిస్తున్న సందర్భంలో దాని ప్రస్తుత ప్రాసంగికత స్పష్టంగానే ఉంది.
- source_word: תְּלוּנֹּת
  choice: సణుగులు
  rationale: ఎడారి సందర్భంలోని అసంతృప్తితో కూడిన పదేపదే ఫిర్యాదు చేయడాన్ని ‘సణుగులు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే పురుష బహువచన నిర్మాణాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే రూపాన్ని వాడాం.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: వారితో ఇలా చెప్పు
  rationale: హీబ్రూ వాక్యప్రవేశ నిర్మాణం యొక్క భావాన్ని సహజమైన తెలుగు సంభాషణా రూపంలో అందిస్తుంది.
- source_word: בֵּין הָעַרְבַּיִם
  choice: సంధ్యవేళలో
  rationale: అక్షరార్థంగా ‘రెండు సాయంకాలాల మధ్య’ అనే హీబ్రూ కాలసూచక నుడికారానికి సహజమైన తెలుగు అర్థం ‘సంధ్యవేళలో’.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: మీరు మాంసం తింటారు
  rationale: ఆహార సందర్భంలో בָשָׂר కు ‘మాంసం’ సహజమైన సమానం; అసంపూర్ణ క్రియ ఇక్కడ వాగ్దానాత్మక భవిష్యత్తును సూచిస్తుంది.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: రొట్టె తిని తృప్తి చెందుతారు
  rationale: క్రియ యొక్క ‘కడుపునిండడం/తృప్తి చెందడం’ భావాన్ని తెలుగులో సహజంగా ఉంచి, לָחֶם ను ‘రొట్టె’గా వ్యక్తం చేసింది.
- source_word: וִידַעְתֶּם
  choice: అప్పుడు ... మీరు తెలుసుకుంటారు
  rationale: వావ్‌తో కూడిన క్రియ ఇక్కడ ముందటి కార్యాల ఫలితంగా కలిగే గుర్తింపును సూచిస్తుంది; ‘అప్పుడు’ ఆ ఫలిత సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవిక నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపంలో బహువచనమైనప్పటికీ ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది; ఒడంబడిక సంబంధాన్ని ‘మీ దేవుడు’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా నిలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל లోని పురుష రూపాన్ని నిలుపుట
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: హీబ్రూ మూలంలోని ‘కుమారులు’ అనే స్పష్టమైన రూపాన్ని ప్రధాన పాఠంలో నిలిపాం; మరింత సాధారణీకరించిన రూపాన్ని ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన గ్రంథశైలిని కాపాడుతూ అనువదించబడింది. హీబ్రూ నుడికారమైన בֵּין הָעַרְבַּיִם ను అక్షరానువాదం కాకుండా సహజమైన ‘సంధ్యవేళలో’గా ఇచ్చాం. ప్రధాన పాఠంలో పాదటిప్పణులు లేనందున గుర్తులు అవసరం లేదు.
