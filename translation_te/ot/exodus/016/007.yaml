id: EXO.16.7
reference: Exodus 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: te
  text: ఉదయాన మీరు యాహ్వే మహిమను చూస్తారు; ఎందుకంటే యాహ్వేకు విరోధంగా మీరు చేసిన సణుగులను ఆయన విన్నాడు.[a] మరి మీరు మా మీద సణగడానికి మేమెంతటివాళ్లం?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు విరోధంగా మీరు చేసే సణుగులను ఆయన విన్నప్పుడు.” హెబ్రీ నిర్మాణానికి కారణార్థంతో పాటు కాలార్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: ఉదయాన
  rationale: సందర్భంలో కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగం; ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: וּרְאִיתֶם
  choice: మీరు ... చూస్తారు
  rationale: ఈ సందర్భంలో భవిష్యత్తులో జరిగేదాన్ని సూచించే హెబ్రీ రూపానికి సహజమైన తెలుగు భవిష్యత్ కాలం.
- source_word: כְּבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: దేవుని ప్రత్యక్ష వైభవం లేదా సన్నిధిని సూచించే כָּבוֹד భావాన్ని ‘మహిమ’ స్పష్టంగా, సంప్రదాయ భారంతో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּשָׁמְעוֹ
  choice: ఆయన విన్నాడు కాబట్టి
  rationale: בְּ + క్రియానామ నిర్మాణం ఇక్కడ కారణార్థకంగా చదవవచ్చు; మహిమను చూడటానికి కారణాన్ని తెలిపే సందర్భానికి ఇది సరిపోతుంది. కాలార్థక సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: మీరు చేసిన సణుగులు / సణగడానికి
  rationale: అసంతృప్తితో పదేపదే ఫిర్యాదు చేసే ప్రతికూల భావాన్ని ‘సణుగు’ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నామం, క్రియ మధ్య పదసంబంధాన్ని నిలిపింది.
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: యాహ్వేకు విరోధంగా / మా మీద
  rationale: ఫిర్యాదు ఎవరికి వ్యతిరేకంగా దిశాబద్ధమైందో చూపిస్తుంది; రెండో సందర్భంలో ‘మా మీద’ తెలుగు వాడుకలో సహజంగా అదే ప్రతికూల దిశను వ్యక్తం చేస్తుంది.
- source_word: וְנַחְנוּ מָה
  choice: మరి ... మేమెంతటివాళ్లం?
  rationale: మోషే, అహరోనుల అల్పత్వాన్ని నొక్కిచెప్పే అలంకారప్రశ్నను సహజమైన తెలుగులో నిలిపింది; וְ యొక్క అనుసంధానాన్ని ‘మరి’ అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నేరుగా సూచిస్తుంది.
- issue: בְּשָׁמְעוֹ యొక్క కారణార్థక లేదా కాలార్థక భావం
  choice: ఆయన విన్నాడు కాబట్టి
  alternative: ఆయన విన్నప్పుడు
  rationale: సందర్భంలో యాహ్వే మహిమ ప్రత్యక్షం కావడానికి ప్రజల సణుగులను ఆయన వినడం కారణంగా చెప్పబడుతుంది; అయినా హెబ్రీ నిర్మాణం కాలార్థాన్ని కూడా అనుమతిస్తుంది కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనా గౌరవప్రదమైన శైలి. ‘సణుగు’ ద్వారా మూలంలోని ప్రతికూల, తిరుగుబాటు ధోరణి నిలిపి, అలంకారప్రశ్నను తెలుగు పదక్రమంలో సహజంగా అమర్చాం.
