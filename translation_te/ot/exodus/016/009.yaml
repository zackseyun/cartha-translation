- from: 'అప్పుడు మోషే అహరోనుతో ఇలా అన్నాడు: “ఇశ్రాయేలీయుల సమాజమంతటితో[a], ‘యాహ్వే సన్నిధికి[b] దగ్గరగా రండి; ఎందుకంటే ఆయన మీ సణుగులను విన్నాడు’ అని చెప్పు.”'
  to: 'అప్పుడు మోషే అహరోనుతో ఇలా అన్నాడు: “ఇశ్రాయేలీయుల సమాజమంతటికీ[a] ఇలా చెప్పు: ‘యాహ్వే సన్నిధికి[b] చేరువగా రండి; ఎందుకంటే ఆయన మీ సణుగులను విన్నాడు.’”'
