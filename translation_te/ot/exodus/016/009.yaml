id: EXO.16.9
reference: Exodus 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: te
  text: 'అప్పుడు మోషే అహరోనుతో ఇలా అన్నాడు: “ఇశ్రాయేలీయుల సమాజమంతటికీ[a] ఇలా చెప్పు: ‘యాహ్వే సన్నిధికి[b] చేరువగా రండి; ఎందుకంటే ఆయన మీ సణుగులను విన్నాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “ఇశ్రాయేలు కుమారుల సమాజమంతా”; అంటే ఇశ్రాయేలు ప్రజలందరూ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యాహ్వే ఎదుటికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱמֹר
  choice: అని చెప్పు
  rationale: అహరోనుకు ఇచ్చిన ఏకవచన ఆజ్ఞను, తరువాత వచ్చే ప్రత్యక్ష వాక్యంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల సమాజమంతటితో
  rationale: עֵדָה లోని సమష్టి/సమాజ భావాన్ని ‘సమాజం’ నిలుపుతుంది; בְּנֵי יִשְׂרָאֵל అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం ‘ఇశ్రాయేలీయులు’. అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: קִרְבוּ
  choice: దగ్గరగా రండి
  rationale: బహువచన ఆజ్ఞారూపం దేవుని సన్నిధికి సమీపించమనే పిలుపును సూచిస్తుంది. ‘దగ్గరగా రండి’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగు.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధికి
  rationale: לִפְנֵי అంటే ‘ఎదుట/సన్నిధిలో’. గమ్యాన్ని సూచించే కִרְבוּతో కలిసి ‘సన్నిధికి’ సహజంగా ఉంటుంది; మరింత రూపనిష్ఠమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సమీపించమనే ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: హీబ్రూ ఖటల్ పూర్తయిన క్రియను సూచిస్తుంది. తెలుగు భూతకాల రూపం ఆ పూర్తయిన వినికిడిని సహజంగా వ్యక్తం చేస్తుంది; దాని ప్రస్తుత ప్రాసంగికత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: మీ సణుగులను
  rationale: ఈ పదంలో సాధారణ ఫిర్యాదుకంటే అసంతృప్తితో గొణిగే భావం ఉంది. ‘సణుగులు’ ఆ ప్రతికూల నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, యాహ్వే అని లిప్యంతరీకరించడం మూలంలోని నామస్వరూపాన్ని నిలుపుతుంది; ‘యెహోవా’ సంప్రదాయ రూపమైనప్పటికీ హీబ్రూ ఉచ్చారణకు తక్కువ సమీపం.
- issue: לִפְנֵי యొక్క స్థల/సన్నిధి భావం
  choice: సన్నిధికి
  alternative: ఎదుటికి
  rationale: ఇక్కడ ప్రజలు దేవుని సమక్షానికి సమీపించాలనే భావం ఉంది. ‘సన్నిధికి’ ఆ దైవసమక్ష భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఎదుటికి’ మరింత అక్షరార్థ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి వాడబడింది. ప్రత్యక్ష వాక్యంలోని ఆజ్ఞ బహువచనంగా ఉంచబడింది. ‘సమాజం,’ ‘సన్నిధి’ వంటి పదాలు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు పరిచితంగా ఉంటాయి.
