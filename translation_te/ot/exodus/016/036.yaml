  yaml_path: translation/ot/exodus/016/036.yaml
  text: An omer is a tenth of an ephah[a].
translation:
  language: te
  text: ఒక ఓమెరు ఏఫాలో పదోవంతు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఓమెరు, ఏఫా అనేవి ప్రాచీన హెబ్రీ పొడి కొలతలు. ఒక ఓమెరు ఏఫాలో పదోవంతు అని ఈ వచనం నిర్వచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: ఒక ఓమెరు
  rationale: ఇది ప్రాచీన హెబ్రీ పొడి కొలత. ఆధునిక కొలతతో సుమారుగా మార్చకుండా, పేరును లిప్యంతరీకరించడం మూలార్థాన్ని కాపాడుతుంది. నిర్వచన వాక్యంలో తెలుగు సహజత్వం కోసం ‘ఒక’ వాడబడింది.
- source_word: עֲשִׂרִית
  choice: పదోవంతు
  rationale: ఈ పదం పరిమాణంలోని పదవ భాగాన్ని సూచిస్తుంది; ‘పదోవంతు’ సహజమైన, కచ్చితమైన తెలుగు రూపం.
- source_word: הָאֵיפָה
  choice: ఏఫాలో
  rationale: ఇది మరో ప్రాచీన హెబ్రీ పొడి కొలత. పేరును లిప్యంతరీకరించి, భాగ-మొత్తం సంబంధాన్ని తెలుగులో ‘-లో’ విభక్తితో సహజంగా వ్యక్తం చేశాం.
- source_word: הוּא
  choice: నామవాచక వాక్య నిర్మాణంలో అంతర్భావితం
  rationale: హెబ్రీలో ఇది సంధానక పాత్ర పోషిస్తుంది. తెలుగులో వర్తమానకాల ‘ఉంది/అవుతుంది’ లేకుండానే ‘X Y’ అనే నిర్మాణం నిర్వచనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ వావ్ వివరణాత్మక అనుబంధాన్ని సూచిస్తుంది. విడిగా ‘మరియు/ఇక’ చేర్చడం తెలుగులో కృత్రిమంగా ఉండేందున సందర్భ సంబంధంలోనే దాని బలం నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వివరణాత్మక వాక్యంగా అనువదించాం. ప్రాచీన కొలతల పేర్లను స్థానిక ఆధునిక ప్రమాణాలకు మార్చకుండా లిప్యంతరీకరించాం; పాదసూచిక గుర్తు ప్రధాన వాక్యంలో ఉంచాం.
