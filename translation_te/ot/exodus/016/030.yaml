translation:
  language: te
  text: అప్పుడు ప్రజలు ఏడవ రోజున విశ్రమించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పని మానుకున్నారు’; హీబ్రూ క్రియ విశ్రాంతిదినం అనే పదంతో సంబంధమున్నది. ‘విశ్రాంతిదినాన్ని ఆచరించారు’ అనేది వ్యాఖ్యానాత్మక విస్తరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: విశ్రమించారు
  rationale: שׁבת అనే క్రియ యొక్క ఖల్ వయిక్తోల్ రూపం ‘మానుకొను/విశ్రమించు’ అనే ప్రాథమిక భావాన్ని ఇస్తుంది. ఈ సందర్భంలో ‘విశ్రమించారు’ సహజంగా ఉండి, ‘విశ్రాంతిదినాన్ని ఆచరించారు’ అనే వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עָם ఇక్కడ సమూహార్థంలో ప్రజలను సూచిస్తుంది; అరణ్య ప్రయాణ కథనంలో ‘ప్రజలు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בַּיּוֹם
  choice: రోజున
  rationale: నిర్దిష్టమైన రోజును సూచించే בְּ + יוֹם కలయికను తెలుగులో ‘రోజున’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: הַשְּׁבִיעִי
  choice: ఏడవ
  rationale: ఈ క్రమసంఖ్య ‘రోజు’ను విశేషిస్తుంది; అందువల్ల మొత్తం పదబంధం ‘ఏడవ రోజున’ అవుతుంది.
- source_word: וַ
  choice: కాబట్టి
  rationale: క్రియకు ముందున్న వావ్ కథనాన్ని ముందుకు నడిపిస్తూ, ఇక్కడ ముందటి ఆజ్ఞకు ఫలితాన్ని తెలియజేస్తుంది. ‘కాబట్టి’ ఆధునిక తెలుగులో ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అప్పుడు’ కూడా సాధ్యమే.
theological_decisions:
- issue: క్రియలో విశ్రాంతిదిన ఆచరణను స్పష్టంగా చేర్చాలా
  choice: ‘విశ్రమించారు’ అని అనువదించడం
  alternative: ‘విశ్రాంతిదినాన్ని ఆచరించారు’ లేదా ‘పనిచేయడం మానుకున్నారు’
  rationale: హీబ్రూ క్రియ ప్రజలు మానుకున్నారని లేదా విశ్రమించారని మాత్రమే నేరుగా చెబుతుంది. విశ్రాంతిదిన సంబంధం పరిసర సందర్భం నుంచీ ‘ఏడవ రోజు’ అన్న మాట నుంచీ స్పష్టమవుతుంది; కాబట్టి వ్యాఖ్యానాత్మక లేదా ఆచారపరమైన భావాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘విశ్రమించారు’ మూలంలోని మానుకోవడం/విశ్రాంతి తీసుకోవడం అనే భావాన్ని సందర్భానుగుణంగా అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపింది.
