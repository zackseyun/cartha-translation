id: EXO.16.18
reference: Exodus 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: te
  text: వారు దానిని ఓమెరు కొలమానంతో కొలిచినప్పుడు, ఎక్కువగా ఏరుకున్నవారికి మిగులు లేదు; తక్కువగా ఏరుకున్నవారికి కొరత లేదు. ప్రతి ఒక్కరూ తాము తినగలిగినంత ఏరుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: వారు దాన్ని ... కొలిచినప్పుడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ తరువాతి ఫలితానికి కాలసూచక నేపథ్యంగా సహజమైన తెలుగులో ‘కొలిచినప్పుడు’ అని ఇచ్చాం.
- source_word: בָעֹמֶר
  choice: ఓమెరు కొలతతో
  rationale: עֹמֶר ఒక పొడి పదార్థాల కొలమానం. దానిని ఆధునిక ప్రమాణంలోకి మార్చకుండా మూలంలోని నిర్దిష్ట కొలత పేరును నిలిపి, తెలుగు పాఠకునికి దాని విధిని స్పష్టం చేయడానికి ‘కొలతతో’ చేర్చాం.
- source_word: הֶעְדִּיף
  choice: మిగులు లేదు
  rationale: ఈ క్రియ అధికంగా ఉండడం లేదా మిగులు కలగడం అనే భావాన్ని ఇస్తుంది. కొలిచిన తరువాత అదనంగా ఏమీ మిగలలేదనే సందర్భార్థాన్ని సంక్షిప్తంగా తెలిపింది.
- source_word: הַמַּרְבֶּה
  choice: ఎక్కువగా ఏరుకున్నవారికి
  rationale: రూపపరంగా ‘ఎక్కువ చేసేవాడు’ అనే కృదంతమైనా, మన్నా ఏరుకునే సందర్భంలో అంతర్లీన క్రియను స్పష్టంగా చూపడానికి ‘ఏరుకున్న’ అని ఇచ్చాం.
- source_word: הֶחְסִיר
  choice: కొరత లేదు
  rationale: తక్కువ కావడం లేదా లోటుపడడం అనే భావాన్ని ‘కొరత లేదు’ సహజంగా తెలియజేస్తూ, ముందున్న ‘మిగులు లేదు’తో సమతూకమైన విరుద్ధ సమాంతరాన్ని ఉంచుతుంది.
- source_word: הַמַּמְעִיט
  choice: తక్కువగా ఏరుకున్నవారికి
  rationale: సందర్భంలో తక్కువ పరిమాణం ఏరుకున్న వ్యక్తిని సూచిస్తుంది; చివరి క్రియతో అనుసంధానం స్పష్టంగా ఉండేలా అంతర్లీన ‘ఏరుకోవడం’ను వ్యక్తపరిచాం.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఇక్కడ పురుష ఏకవచన రూపం సమూహంలోని ఒక్కొక్క వ్యక్తిని పంపిణీయంగా సూచిస్తుంది. ‘ప్రతి ఒక్కరూ’ ఆ భావాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: לְפִי אָכְלוֹ
  choice: తాము తినగలిగినంత
  rationale: అక్షరార్థంగా ‘అతని తినుట నోటి ప్రకారం’ అనే హీబ్రూ ప్రయోగం, ఆ వ్యక్తి భుజించగల లేదా అవసరమైన పరిమాణాన్ని సూచిస్తుంది. ‘తినగలిగినంత’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: לָקָטוּ
  choice: ఏరుకున్నారు
  rationale: మన్నా కథనంలో వస్తువులను నేలపై నుంచి సమకూర్చుకోవడాన్ని సూచించే సాధారణ క్రియ; ‘ఏరుకున్నారు’ ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ లోని పంపిణీయ పురుష ఏకవచనం
  choice: ‘ప్రతి ఒక్కరూ తాము తినగలిగినంత’ అని పంపిణీయంగా అనువదించడం
  alternative: ‘ప్రతి పురుషుడు తాను తినగలిగినంత’ లేదా ‘ప్రతి ఒక్కరు అతని తినుట ప్రకారం’
  rationale: హీబ్రూలో పురుష ఏకవచన రూపాలు ఉన్నప్పటికీ సందర్భం వయోజన పురుషులకు మాత్రమే పరిమితం కాదు; ఒక్కొక్క వ్యక్తిని పంపిణీయంగా సూచిస్తుంది. తెలుగు గౌరవ/ప్రతిబింబ బహువచన నిర్మాణం భావాన్ని సహజంగా, లింగపరమైన అదనపు పరిమితి లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని ‘ఎక్కువ—తక్కువ’, ‘మిగులు—కొరత’ సమాంతర నిర్మాణాన్ని నిలిపాం. ‘ఓమెరు’ అనే ప్రాచీన కొలమానాన్ని మార్పిడి చేయకుండా లిప్యంతరీకరించి, అది కొలత అని పాఠ్యంలోనే స్పష్టం చేశాం.
