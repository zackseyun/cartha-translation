translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘వారంలో’ వంటి మూలంలో లేని వివరణను చేర్చలేదు; రెండింతల పరిమాణంపై ఉన్న భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంచి, ‘రెండింతల భాగం’ అనే సాధ్యమైన పదప్రయోగాన్ని పాదసూచికలో ఇచ్చాం.
