  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֔י וְ/הֵכִ֖ינוּ אֵ֣ת אֲשֶׁר יָבִ֑יאוּ וְ/הָיָ֣ה מִשְׁנֶ֔ה עַ֥ל אֲשֶֽׁר יִלְקְט֖וּ י֥וֹם יֽוֹם־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: te
  text: ఆరవ రోజున, వారు తెచ్చేదానిని సిద్ధం చేసినప్పుడు, అది వారు రోజూ ఏరుకునేదానికంటే రెండింతలు అవుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ప్రతిరోజూ ఏరుకునేదానితో పోలిస్తే అది రెట్టింపు భాగం అవుతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉంటుంది
  rationale: వావ్‌తో కూడిన ఖతల్ రూపం ఈ ఆదేశ సందర్భంలో భవిష్యత్తులో సంభవించే పరిస్థితి లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగులో సహజమైన భవిష్యత్ రూపంతో వ్యక్తం చేశాం.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ఆరవ రోజున
  rationale: మూలంలోని కాలసూచక పదబంధాన్ని నేరుగా అనువదించాం; అక్కడ స్పష్టంగా లేని ‘వారంలో’ అనే మాటను చేర్చలేదు.
- source_word: וְהֵכִינוּ
  choice: సిద్ధం చేసుకున్నప్పుడు
  rationale: ఆరవ రోజున వారు చేసే చర్యను కాలసంబంధ ఉపవాక్యంగా సహజ తెలుగులో తెలిపింది.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: వారు తెచ్చినదాన్ని
  rationale: వారు ఏరి తీసుకొచ్చే పదార్థాన్ని సూచిస్తుంది; సందర్భానుసారంగా సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: וְהָיָה מִשְׁנֶה
  choice: రెండింతలు ఉంటుంది
  rationale: מִשְׁנֶה సూచించే రెట్టింపు పరిమాణాన్ని స్పష్టంగా, మూలంలోని విధేయ నిర్మాణానికి దగ్గరగా తెలిపింది.
- source_word: עַל אֲשֶׁר
  choice: ఏరుకునేదానికంటే
  rationale: ఇక్కడ עַל పోలిక లేదా పరిమాణ సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘కంటే’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִלְקְטוּ
  choice: ఏరుకునే
  rationale: మన్నాను నేలపై నుంచి సేకరించే సందర్భంలో ‘ఏరుకొను’ సహజమైన తెలుగు క్రియ.
- source_word: יוֹם יוֹם
  choice: రోజూ
  rationale: పునరుక్తి సూచించే ప్రతిరోజు జరిగే పంపిణీ భావాన్ని ప్రస్తుత తెలుగులో సహజంగా తెలిపింది.
