    text: లేదా, “వారు ప్రతిరోజూ ఏరుకునేదానితో పోలిస్తే అది రెట్టింపు భాగం అవుతుంది.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew future-oriented instructional sequence and comparative sense while removing an unintended reflexive nuance. The alternative footnote continues to represent the possible rendering of מִשְׁנֶה as “double portion.”
