  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֲלֵ/הֶ֑ם אִ֕ישׁ אַל יוֹתֵ֥ר מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/019.yaml
  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: te
  text: 'మోషే వారితో ఇలా చెప్పాడు: “ఎవరూ[a] దానిలో కొంతైనా ఉదయం వరకు మిగిల్చి ఉంచకూడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం אִישׁ (ఈష్, ‘మనిషి’) ఇక్కడ ఒక్కొక్క వ్యక్తిని ఉద్దేశించే పంపిణీ భావంలో ఉంది; ఈ నిషేధం అందరికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగు కథన శైలిలో ఉద్ధరణ అనంతరం ‘అని చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֲלֵהֶם
  choice: వారితో
  rationale: మూడవ పురుష బహువచన ప్రత్యయంతో కూడిన אֶל ను సహజ తెలుగులో ‘వారితో’గా వ్యక్తీకరించాం.
- source_word: אִישׁ
  choice: ఎవరూ
  rationale: ఇక్కడ אִישׁ పంపిణీ భావంలో ప్రతి వ్యక్తినీ సూచిస్తుంది; నిషేధ వాక్యంలో ‘ఎవరూ’ సహజంగా, సమగ్రంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אַל
  choice: కూడదు
  rationale: אַל నిషేధాత్మక జస్సివ్ భావాన్ని సూచిస్తుంది; తెలుగులో ‘కూడదు’ స్పష్టమైన, సహజమైన నిషేధ రూపం.
- source_word: יוֹתֵר
  choice: మిగిల్చి ఉంచు
  rationale: మన్నాను మరుసటి ఉదయం వరకు మిగిలేలా దాచిపెట్టడమే సందర్భార్థం; ‘మిగిల్చి ఉంచు’ ఉద్దేశపూర్వకంగా నిల్వచేయడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో కొంతైనా
  rationale: ఏకవచన ప్రత్యయం సందర్భంలోని మన్నాను సూచిస్తుంది; מן భాగార్థక ప్రయోగాన్ని ‘దానిలో కొంతైనా’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాల పరిమితిని నేరుగా, సహజంగా తెలిపే తెలుగు రూపం.
