- from: సాయంకాలానికి పూరేడు పిట్టలు వచ్చి శిబిరాన్ని కప్పేశాయి. ఉదయానికి శిబిరం చుట్టూ మంచు పొర ఉంది.[a]
  to: సాయంకాలంలో పూరేడు పిట్టలు వచ్చి శిబిరాన్ని కప్పాయి. ఉదయాన శిబిరం చుట్టూ మంచుబిందువుల పొర ఉండింది.[a]
  rationale: కాలసూచక పదబంధాలను మూలానికి మరింత సమీపంగా మార్చి, టల్‌కు ‘మంచుబిందువులు’ అని స్పష్టమైన అర్థాన్ని ఇచ్చాము. పక్షుల చర్యకు అతిశయమైన పూర్తి-భావాన్ని జోడించకుండా సాధారణ కథన క్రియను వాడాము; పాదటిప్పణి ప్రత్యామ్నాయంలో మూలంలో లేని ‘ఏర్పడింది’ భావాన్ని తొలగించాము.
