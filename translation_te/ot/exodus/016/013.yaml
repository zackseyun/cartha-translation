  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: te
  text: సాయంకాలంలో పూరేడు పిట్టలు వచ్చి శిబిరాన్ని కప్పాయి. ఉదయాన శిబిరం చుట్టూ మంచుబిందువుల పొర ఉండింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉదయాన శిబిరం చుట్టూ మంచుబిందువుల పొర ఉండేది.’ హీబ్రూ వాక్యనిర్మాణాన్ని స్థితిని తెలిపే వాక్యంగానూ, అక్కడ అటువంటి పొర ఉనికిలో ఉందని తెలిపే వాక్యంగానూ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: సాయంకాలానికి
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో కాలసూచక పదంతో వ్యక్తం చేస్తుంది; ‘సాయంకాలంలో ఇలా జరిగింది’ అనేది అనవసరంగా పదానువాదంగా ఉంటుంది.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: పూరేడు పిట్టలు వచ్చి
  rationale: עלה లోని రావడం/పైకి రావడం భావానికి ‘వచ్చి’ సహజమైన సందర్భానువాదం. שְׂלָו అనే పక్షికి తెలుగులో సుపరిచితమైన పేరు ‘పూరేడు పిట్ట’; హీబ్రూలో సమూహవాచక ఏకవచనం ఉన్నా తెలుగులో బహువచనం సహజం.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: శిబిరాన్ని కప్పేశాయి
  rationale: כסה యొక్క ‘కప్పు’ భావాన్ని నిలుపుతూ, పిట్టలు శిబిరమంతటా విస్తరించిన దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבַבֹּקֶר
  choice: ఉదయానికి
  rationale: తదుపరి కాలదశను తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: మంచు పొర ఉంది
  rationale: שִׁכְבַת అంటే పరచుకున్న పొర; הַטַּל ఇక్కడ నేలపై ఏర్పడే మంచును సూచిస్తుంది. ‘మంచు పొర’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: శిబిరం చుట్టూ
  rationale: శిబిరాన్ని ఆవరించిన స్థానాన్ని సంక్షిప్తంగా, ఖచ్చితంగా తెలియజేస్తుంది.
