translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. స్థలనామాలకు తెలుగు బైబిలు పాఠకులకు పరిచితమైన ఏలీము, సీను, సీనాయి, ఐగుప్తు రూపాలు వాడబడ్డాయి. మూలంలోని ప్రయాణ క్రమాన్ని స్పష్టంగా చూపేందుకు మొదటి క్రియను ప్రత్యేక వాక్యంగా ఇచ్చినా, భావసంబంధం యథాతథంగా నిలుపబడింది.
