  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: te
  text: వారు ఏలీము నుండి బయలుదేరారు. ఇశ్రాయేలు ప్రజల సమాజమంతా[a] ఐగుప్తు దేశం నుండి బయలుదేరిన తరువాత, రెండో నెల పదిహేనవ రోజున ఏలీముకూ సీనాయికీ మధ్యనున్న సీను అరణ్యానికి[b] చేరుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల సమాజమంతా.’ ఇది పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజలందరినీ సూచించే సాధారణ జాతీయ నామం.
    reason: lexical_alternative
  - marker: b
    text: ‘సీను’ ఇక్కడ ఒక స్థలనామం—సీను అరణ్యం. ఇది ‘సీనాయి’ అనే పేరుకు భిన్నమైనది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: వారు బయలుదేరారు
  rationale: అరణ్య ప్రయాణ సందర్భంలో נסע శిబిరాన్ని ఎత్తి తదుపరి ప్రదేశానికి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది. ‘బయలుదేరారు’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: מֵאֵילִם
  choice: ఏలీము నుండి
  rationale: אֵילִם ఒక స్థలనామం; తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וַיָּבֹאוּ
  choice: చేరుకుంది
  rationale: בוא సాధారణ గమన క్రియ. సమాజమంతా గమ్యస్థానానికి వచ్చిందనే కథన భావాన్ని తెలుగులో ‘చేరుకుంది’ సహజంగా తెలియజేస్తుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతా
  rationale: כָּל עֲדַת అంటే మొత్తం సమాజం. בְּנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ అది పురుషులను మాత్రమే కాక ఇశ్రాయేలు ప్రజలందరినీ సూచించే జాతీయ నామం; అందుకే స్పష్టమైన ఆధునిక తెలుగు రూపం ఎంచుకోబడింది.
- source_word: אֶל מִדְבַּר סִין
  choice: సీను అరణ్యానికి
  rationale: מִדְבַּר జనావాసం లేని అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. ‘అరణ్యం’ స్థిరమైన తెలుగు బైబిలు పదం; סִין స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: ఏలీముకు సీనాయికి మధ్య ఉన్న
  rationale: అరణ్యం ఉన్న భౌగోళిక స్థానాన్ని తెలిపే సంబంధవాక్యాన్ని నేరుగా, సహజమైన తెలుగు క్రమంలో ఇచ్చింది.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెల పదిహేనవ రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన తేదీ క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి బయలుదేరిన తరువాత
  rationale: లామెద్‌తో కూడిన infinitive construct తేదీని నిర్గమన సంఘటనకు అనుసంధానిస్తుంది. ‘బయలుదేరిన తరువాత’ ఆ కాలసంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
