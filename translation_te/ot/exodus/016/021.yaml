  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: te
  text: వారు ప్రతి ఉదయం దానిని ఏరుకున్నారు[a], ఒక్కొక్కరు తినగలిగినంత చొప్పున. సూర్యుడు వేడెక్కినప్పుడు అది కరిగిపోయేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో పునరుక్తిగా, ‘ఉదయంలో ఉదయంలో’ అని ఉంది; అంటే ప్రతి ఉదయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: పోగుచేసుకున్నారు
  rationale: לקט ఆహారాన్ని ఏరడం లేదా పోగుచేయడం అనే అర్థం ఇస్తుంది. సందర్భంలో ‘పోగుచేసుకున్నారు’ సహజంగా ఉండి సమూహంగా సేకరించే చర్యను తెలియజేస్తుంది.
- source_word: אֹתוֹ
  choice: దాన్ని
  rationale: ఈ కర్మ సర్వనామం ముందటి సందర్భంలోని మన్నాను సూచిస్తుంది; మూలంలో లేని నామాన్ని ఇక్కడ చేర్చకుండా సర్వనామాన్నే నిలుపుతుంది.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ఉదయం ఉదయాన్నే
  rationale: పునరుక్తి ప్రతి ఉదయమూ జరిగే చర్యను సూచిస్తుంది. ఈ రూపం హెబ్రీ పునరుక్తిని కనిపించేలా ఉంచుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: אִישׁ
  choice: ఎవరు … వారు
  rationale: ఏకవచన పుంలింగ రూపమైన אִישׁ ఇక్కడ పంపిణీ భావంలో ప్రతి వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘ఎవరు … వారు’ సహజంగా ఆ పంపిణీ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כְּפִי אָכְלוֹ
  choice: తినగలిగినంత
  rationale: అక్షరార్థంగా ‘అతని తినుట నోటి ప్రకారం’ అనే ఈ జాతీయం, ఒక్కొక్కరి ఆహార అవసరం లేదా తినే సామర్థ్యానికి తగిన పరిమాణాన్ని సూచిస్తుంది.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: ఎండ వేడెక్కినప్పుడు
  rationale: సూర్యుడు వేడెక్కడం అనే కాలసంబంధ కథన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְנָמָס
  choice: అది కరిగిపోయింది
  rationale: מסס ఇక్కడ వేడికి కరగడం లేదా ద్రవీభవించడం అనే అర్థం ఇస్తుంది; ‘కరిగిపోయింది’ సందర్భోచితమైన సాధారణ తెలుగు పదం.
