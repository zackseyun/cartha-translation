revisions:
- from: వారు ఉదయం ఉదయాన్నే[a] దాన్ని పోగుచేసుకున్నారు; ఎవరు తినగలిగినంత వారు తీసుకున్నారు. ఎండ వేడెక్కినప్పుడు అది కరిగిపోయింది.
  to: వారు ప్రతి ఉదయం దానిని ఏరుకున్నారు[a], ఒక్కొక్కరు తినగలిగినంత చొప్పున. సూర్యుడు వేడెక్కినప్పుడు అది కరిగిపోయేది.
  rationale: The revision keeps the morning-by-morning sense, restores the distributive phrase as a modifier of gathering rather than an added action, and explicitly retains the sun as the subject. The habitual Telugu form ‘కరిగిపోయేది’ suits the verse’s repeated daily pattern without adding meaning.
