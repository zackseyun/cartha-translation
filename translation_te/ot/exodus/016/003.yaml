  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: te
  text: 'ఇశ్రాయేలీయులు వారితో ఇలా అన్నారు: “మేము ఐగుప్తు దేశంలో మాంసపు కుండల దగ్గర కూర్చుని, తృప్తిగా రొట్టె తిన్నప్పుడు, యాహ్వే చేతిలో చనిపోయి ఉంటే ఎంత బాగుండేది! ఈ సమూహమంతటినీ ఆకలితో చంపడానికి మీరు మమ్మల్ని ఈ అరణ్యంలోకి తీసుకొచ్చారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ కుటుంబపరమైన రూపం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇక్కడ మొత్తం ఇశ్రాయేలు ప్రజలను సూచిస్తున్నందున సహజమైన ఆధునిక తెలుగు రూపం ఎంచుకోబడింది.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: చనిపోయి ఉంటే ఎంత బాగుండేది
  rationale: מִי יִתֵּן అనే హీబ్రూ నుడికారం ప్రశ్న కాదు, నెరవేరని తీవ్రమైన కోరికను వ్యక్తం చేస్తుంది; తెలుగు ప్రతికల్పిత కోరికగా సహజంగా అనువదించబడింది.
- source_word: בְיַד יְהוָה
  choice: యెహోవా చేతిలోనే
  rationale: ‘చేతిలో’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, వారి మరణం యెహోవా కార్యం వల్ల జరిగి ఉంటే మేలని ఫిర్యాదు యొక్క తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: మాంసం కుండల దగ్గర కూర్చుని
  rationale: వండిన మాంసమున్న పాత్రలను సూచించే స్పష్టమైన దృశ్యాన్ని, עַל యొక్క సందర్భోచిత సమీపార్థాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: కడుపు నిండా ఆహారం తిన్నప్పుడు
  rationale: לֶחֶם సందర్భానుసారంగా సాధారణ ఆహారాన్ని సూచించగలదు; לָשֹׂבַע యొక్క తృప్తిగా తినడం అనే భావాన్ని ‘కడుపు నిండా’ సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: ఈ అరణ్యంలోకి
  rationale: మానవ నివాసం తక్కువైన ఎడారి-అరణ్య ప్రాంతాన్ని సూచించే నిర్గమకాండ సందర్భానికి ‘అరణ్యం’ ప్రమాణ తెలుగు పదం.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: ఈ సమాజమంతటినీ
  rationale: קָהָל ఇక్కడ కూడిన ఇశ్రాయేలు జనసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ మతసంస్థార్థాన్ని అనవసరంగా పెంచకుండా సామూహిక భావాన్ని అందిస్తుంది.
- source_word: בָּרָעָב
  choice: ఆకలితో
  rationale: ఆహారలేమి కారణంగా మరణించడం అనే సాధన/కారణ భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని వాడి, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సమూహ సూచన
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ పదబంధం సందర్భంలో పురుషులను మాత్రమే కాక ప్రజాసమూహాన్ని సూచిస్తుంది. అందువల్ల మూలంలోని ప్రతినిధి సమూహార్థాన్ని సహజ తెలుగులో ఇచ్చి, అవసరం లేని లింగపరమైన పరిమితిని మోపలేదు.
- issue: ‘యెహోవా చేతిలో చనిపోవడం’ అనే ఫిర్యాదు
  choice: మూలంలోని ప్రత్యక్ష ఆపాదనను నిలుపడం
  alternative: యెహోవా అనుమతితో చనిపోవడం
  rationale: వక్తల మాటలు దేవుని కార్యసాధకత్వాన్ని బలంగా వ్యక్తం చేస్తున్నాయి. దానిని కేవలం అనుమతిగా వివరించడం మూలంలోని వేదాంత ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయినా ఫిర్యాదు యొక్క తీవ్రత మరియు మూలంలోని ‘చేతిలో’ రూపకం నిలుపబడ్డాయి. ఈ ముసాయిదాలో పాదటిప్పణులు లేవు; అందువల్ల ప్రధాన పాఠ్యంలో గుర్తులు అవసరం లేదు.
