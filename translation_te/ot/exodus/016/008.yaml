language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “యాహ్వే సాయంత్రం మీరు తినడానికి మాంసాన్ని, ఉదయం కడుపు నిండా తినడానికి రొట్టెను మీకు ఇస్తున్నప్పుడు, మీరు యాహ్వేకు వ్యతిరేకంగా చేస్తున్న మీ ఫిర్యాదులను ఆయన వింటున్నందువల్ల, మేము ఏమిటి? మీ ఫిర్యాదులు మాకు వ్యతిరేకంగా కాదు, యాహ్వేకే వ్యతిరేకంగా ఉన్నాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּתֵת
  choice: ఇచ్చేటప్పుడు
  rationale: ב + క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని సూచిస్తుంది. తెలుగు వాక్యంలో ‘ఇచ్చేటప్పుడు’ మూలంలోని ‘when/as giving’ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: בָּשָׂר
  choice: మాంసం
  rationale: ఆహార సందర్భంలో సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: సాధారణ అర్థమైన ‘bread’ అనే నిర్దిష్ట ఆహార రూపాన్ని నిలుపుతుంది; విస్తృతమైన ‘ఆహారం’ అని సాధారణీకరించదు.
- source_word: לִשְׂבֹּעַ
  choice: కడుపు నిండా
  rationale: שׂבע మూలంలోని తృప్తిగా తినడం, పూర్తిగా నిండడం అనే భావాన్ని సామాన్య ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּשְׁמֹעַ
  choice: వింటున్నాడు
  rationale: ఈ క్రియానామ నిర్మాణానికి సందర్భంలో కారణార్థ ఛాయ ఉంది. తెలుగు వాక్య క్రమం దానిని సహజంగా గ్రహించనిస్తుంది; యాహ్వే వారి సణుగులను ఆలకిస్తున్నాడనే ప్రత్యక్ష భావం నిలుస్తుంది.
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: సణుగుతున్న మీ సణుగులను
  rationale: నామవాచకం–సజాత క్రియ పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, పదేపదే వ్యక్తమవుతున్న అసంతృప్తి మరియు ఆరోపణ తీవ్రతను చూపిస్తుంది.
- source_word: וְנַחְנוּ מָה
  choice: అసలు మేమెంతటివాళ్లం?
  rationale: హీబ్రూలోని ‘మేమేమిటి?’ అనే భావం మోషే, అహరోనుల అల్పత్వాన్ని నొక్కిచెబుతుంది. ‘ఎంతటివాళ్లం’ ఆధునిక తెలుగులో అదే వాక్చాతుర్యాన్ని సహజంగా ఇస్తుంది.
- source_word: לֹא עָלֵינוּ ... כִּי עַל יְהוָה
  choice: మాకు విరోధంగా కాదు, యాహ్వేకే విరోధంగా
  rationale: עַל యొక్క ప్రతికూల దిశను ‘విరోధంగా’ స్పష్టంగా వ్యక్తం చేసి, చివరి విరుద్ధతలోని ఉద్ఘాటనను ‘యాహ్వేకే’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దేవుని వ్యక్తిగత ఒడంబడిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల బిరుదును పెట్టకుండా ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- issue: ఇశ్రాయేలీయుల సణుగులు ఎవరికి విరోధమైనవి
  choice: మోషే, అహరోనులకు కాక యాహ్వేకే విరోధమైనవి
  alternative: కేవలం నాయకులపై చేసిన ఫిర్యాదులు
  rationale: మూలపాఠంలోని స్పష్టమైన ‘మాకు విరోధంగా కాదు, యాహ్వేకు విరోధంగా’ అనే వ్యతిరేక నిర్మాణాన్ని ఎటువంటి సిద్ధాంతాత్మక విస్తరణ లేకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని అసంపూర్ణంగా అనిపించే ‘ఇచ్చేటప్పుడు—’ నిర్మాణాన్ని వివరణాత్మక పదాలు చేర్చి పరిష్కరించకుండా డాష్‌తో నిలిపింది. ‘సణుగుతున్న మీ సణుగులు’ కొద్దిగా అసాధారణంగా వినిపించినా, హీబ్రూ సజాత పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడి పాదటిప్పణిలో వివరించింది.
