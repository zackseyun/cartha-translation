  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: te
  text: అరణ్యంలో ఇశ్రాయేలు కుమారుల[a] సమాజమంతా మోషేకు, అహరోనుకు వ్యతిరేకంగా గొణిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయుల సమాజమంతా’; సంప్రదాయంగా ‘ఇశ్రాయేలు సంతానం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: సణిగింది
  rationale: ఈ సందర్భంలో לון అనే క్రియ నాయకులకు విరోధంగా అసంతృప్తితో గొణగడం లేదా ఫిర్యాదు చేయడాన్ని సూచిస్తుంది. ‘సణిగింది’ ఆధునిక తెలుగులో ఆ ప్రతికూల సామూహిక అసంతృప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל עֲדַת
  choice: సమాజమంతా
  rationale: כָּל సంపూర్ణతను నొక్కిచెబుతుంది; עֵדָה ఇశ్రాయేలు ప్రజల సమష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతా’ తెలుగు వాక్యంలో సహజంగా ఉండి రెండు భావాలనూ నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని ‘ఇశ్రాయేలు కుమారులు’ అని నేరుగా నిలుపుతూ, ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: עַל
  choice: విరోధంగా
  rationale: ఫిర్యాదు సందర్భంలో עַל వ్యక్తులను లక్ష్యంగా చేసుకున్న వ్యతిరేకతను సూచిస్తుంది; ‘విరోధంగా’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారి కాకుండా జనావాసం తక్కువైన అరణ్యప్రాంతాన్ని సూచించగలదు. ‘అరణ్యం’ నిర్గమకాండ సందర్భంలో సుపరిచితమైన, సముచితమైన పదం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే సమష్టి సంజ్ఞను అనువదించడం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతానం
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది నిబంధన ప్రజలను సమష్టిగా సూచించే విషయాన్ని మరుగుపరచకుండా సహజమైన ప్రత్యామ్నాయాలను పాదటిప్పణిలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ వాక్యంలోని సామూహికత, సంపూర్ణత, నాయకులకు వ్యతిరేకమైన ఫిర్యాదు భావం నిలుపబడ్డాయి.
