  to: 'మోషే అహరోనుతో ఇలా అన్నాడు: “ఒక భరిణెను[a] తీసుకొని, దానిలో ఓమెరు నిండా మన్నాను వేసి, మీ తరతరాల కోసం భద్రపరచబడేలా దానిని యాహ్వే సన్నిధిలో ఉంచు.”'
