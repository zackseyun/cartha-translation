id: EXO.16.33
reference: Exodus 16:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: te
  text: 'మోషే అహరోనుతో ఇలా అన్నాడు: “ఒక భరిణెను[a] తీసుకొని, దానిలో ఓమెరు నిండా మన్నాను వేసి, మీ తరతరాల కోసం భద్రపరచబడేలా దానిని యాహ్వే సన్నిధిలో ఉంచు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాత్రను.” ఇక్కడి హీబ్రూ పదం ఒక నిల్వ పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: భరిణె
  rationale: ఈ అరుదైన నామవాచకం మన్నాను నిల్వచేసే పాత్రను సూచిస్తుంది. ‘భరిణె’ వంటకోసం వాడే కుండ అనే భావాన్ని తప్పించి, నిల్వ పాత్ర అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מְלֹא הָעֹמֶר
  choice: ఓమెరు నిండా
  rationale: מְלֹא లోని ‘నిండిన పరిమాణం’ భావాన్నీ, עֹמֶר అనే ప్రాచీన కొలత పేరునీ రెండింటినీ నిలుపుతుంది.
- source_word: מָן
  choice: మన్నా
  rationale: సందర్భంలో పేరుపొందిన ఆహార పదార్థానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: וְתֶן שָׁמָּה
  choice: దానిలో ... వేసి
  rationale: అక్షరార్థంగా ‘అక్కడ ఉంచు’; సందర్భంలో ‘అక్కడ’ అనేది ఇప్పుడే ప్రస్తావించిన పాత్రను సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా, సహజంగా ఉండేందుకు ‘దానిలో’ అని వ్యక్తం చేయబడింది.
- source_word: וְהַנַּח אֹתוֹ
  choice: దానిని ... ఉంచు
  rationale: వస్తువును ఒక నిర్దిష్ట స్థలంలో పెట్టడం అనే ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అనే ‘ఎదుట/సన్నిధిలో’ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల కోసం భద్రపరచడానికి
  rationale: ఆ వస్తువు తరువాతి తరాల కోసం కాపాడి ఉంచబడాలనే ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ఆజ్ఞారూపాన్ని వాడుతూ, ప్రాచీన కొలత ‘ఓమెరు’ను అలాగే నిలిపాం. వాక్యానికి గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి ఇచ్చాం.
