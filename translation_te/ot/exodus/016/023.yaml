source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “ఇదే యాహ్వే చెప్పిన మాట: రేపు విశేష విశ్రాంతి దినం, యాహ్వేకు పవిత్రమైన సబ్బాతు.[a] కాల్చవలసినది కాల్చండి; ఉడికించవలసినది ఉడికించండి.[b] మిగిలినదంతా మీ కోసం ఉదయం వరకు భద్రపరచడానికి పక్కన పెట్టండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో అక్షరార్థంగా: “విశేష విశ్రాంతి, యాహ్వేకు పవిత్రమైన సబ్బాతు.”'
    reason: మూలంలోని రెండు సమాంతర నామపదబంధాల నిర్మాణాన్ని చూపడానికి.
  - marker: b
    text: 'హీబ్రూలో బలప్రయోగం కోసం క్రియలు పునరుక్తమయ్యాయి: “కాల్చవలసినది కాల్చండి; ఉడికించవలసినది ఉడికించండి.”'
    reason: మూలంలోని ఉద్ఘాటనాత్మక క్రియా పునరుక్తిని పాఠకుడు గుర్తించేందుకు.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో … అన్నాడు
  rationale: హీబ్రూ కథన శైలిలోని ప్రత్యక్ష ప్రసంగ పరిచయాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో ఉంచుతుంది.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: యాహ్వే చెప్పినది ఇదే
  rationale: ప్రస్తుత విషయాన్ని సూచించే הוּא אֲשֶׁר నిర్మాణాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: שַׁבָּתוֹן
  choice: సంపూర్ణ విశ్రాంతి దినం
  rationale: సాధారణ విశ్రాంతికన్నా ప్రత్యేకమైన, సంపూర్ణమైన పని విరమణ భావాన్ని తెలియజేస్తుంది; సందర్భానుసారంగా ‘దినం’ను పూరించింది.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: యాహ్వేకు పవిత్రమైన సబ్బాతు
  rationale: ఈ దినపు పవిత్రతనూ అది యాహ్వేకు ప్రత్యేకించబడినదనే భావాన్నీ నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: మీరు కాల్చవలసినది కాల్చండి
  rationale: ఒకే క్రియను పునరుక్తి చేసే హీబ్రూ బలప్రయోగాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: ఉడికించవలసినది ఉడికించండి
  rationale: בשל యొక్క ఇక్కడి ఆహార తయారీ భావాన్ని తెలియజేస్తూ మూలంలోని క్రియా పునరుక్తిని కాపాడుతుంది.
- source_word: וְאֵת כָּל הָעֹדֵף
  choice: మిగిలినదంతా
  rationale: తయారీ తరువాత మిగిలే మొత్తం భాగాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: మీ కోసం భద్రంగా పక్కన పెట్టండి
  rationale: ఉద్దేశపూర్వకంగా వేరుగా ఉంచడం, కాపాడి ఉంచడం, לָכֶם లోని ‘మీ కోసం’ భావం—మూడింటినీ కలిపి తెలియజేస్తుంది.
- source_word: עַד הַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: నిల్వ ఉంచవలసిన కాలపరిమితిని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు; ‘యాహ్వే’ మూలనామానికి సమీపమైన తెలుగు ధ్వన్యంతరీకరణ.
- issue: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה పదబంధాల సంబంధం
  choice: సంపూర్ణ విశ్రాంతి దినం—యాహ్వేకు పవిత్రమైన సబ్బాతు
  alternative: సంపూర్ణ విశ్రాంతి, యాహ్వేకు పవిత్రమైన సబ్బాతు
  rationale: రెండవ పదబంధం మొదటిదాన్ని మరింతగా నిర్వచించే సమాంతర సంబంధాన్ని డాష్ ద్వారా నిలిపింది; ‘దినం’ సందర్భం నుంచి సహజంగా పూరించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సబ్బాతు’ అనే స్థిర బైబిలు పదాన్ని నిలిపి, దాని అర్థాన్ని ‘సంపూర్ణ విశ్రాంతి దినం’ అనే సమాంతర పదబంధం ద్వారా సందర్భంలోనే స్పష్టం చేసింది.
