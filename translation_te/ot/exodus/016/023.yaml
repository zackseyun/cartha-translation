  to: 'అతడు వారితో ఇలా అన్నాడు: “ఇదే యాహ్వే చెప్పిన మాట: రేపు విశేష విశ్రాంతి దినం, యాహ్వేకు పవిత్రమైన సబ్బాతు.[a] కాల్చవలసినది కాల్చండి; ఉడికించవలసినది ఉడికించండి.[b] మిగిలినదంతా మీ కోసం ఉదయం వరకు భద్రపరచడానికి పక్కన పెట్టండి.”'
  rationale: The revision replaces the overly strong ‘సంపూర్ణ’ with ‘విశేష,’ preserving the marked sacred-rest sense of שַׁבָּתוֹן without narrowing or overstating it. It also makes the preservation purpose in לְמִשְׁמֶרֶת explicit and smooths the Telugu discourse structure. No doctrinal interpretation has been added.
