base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు దాన్ని చూసినప్పుడు, ఒకరితో ఒకరు[a], “ఇది ఏమిటి?”[b] అన్నారు. ఎందుకంటే అది ఏమిటో వారికి తెలియదు. అప్పుడు మోషే వారితో, “మీరు తినడానికి యాహ్వే మీకు ఇచ్చిన రొట్టె ఇది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక మనిషి తన సహోదరునితో.’ ఇది ‘ఒకరితో ఒకరు’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇది ఏమిటి?’ అనే భావమిచ్చే హీబ్రూ మాటకు ‘మన్నా’ అనే పేరుతో సాంప్రదాయంగా సంబంధం చూపబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ సమాస పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, తెలుగులో సహజంగా అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: אִישׁ אֶל אָחִיו
  choice: ఒకరితో ఒకరు
  rationale: అక్షరార్థంగా ‘ఒక మనిషి తన సహోదరునితో’ అని ఉన్న హీబ్రూ పరస్పర సంభాషణను సూచించే నుడికారం; ఆధునిక తెలుగులో ‘ఒకరితో ఒకరు’ సహజమైన సమానార్థకం.
- source_word: מָן הוּא
  choice: ఇది ఏమిటి?
  rationale: తరువాతి వివరణాత్మక వాక్యం ప్రకారం ఇది ప్రశ్నార్థక ప్రయోగం. తరువాత ఏర్పడిన ‘మన్నా’ అనే పేరును ముందుగానే ప్రధాన పాఠ్యంలో పెట్టకుండా కథనంలోని పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: అది ఏమిటో వారికి తెలియదు
  rationale: వారు ఆ పదార్థాన్ని గుర్తించలేకపోయారనే భావాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הוּא הַלֶּחֶם
  choice: రొట్టె ఇదే
  rationale: సర్వనామం మరియు నామవాచకం కలిసి ఆ పదార్థాన్ని ‘రొట్టె’గా గుర్తిస్తున్నాయి; ‘ఇదే’ ఆ గుర్తింపును తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: לְאָכְלָה
  choice: తినడానికి
  rationale: ఇవ్వబడిన రొట్టె యొక్క ఉద్దేశాన్ని తెలిపే హీబ్రూ రూపానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: מָן అనే పదాన్ని ఈ వాక్యంలో వ్యక్తినామంగా తీసుకోవాలా, ప్రశ్నార్థకంగా తీసుకోవాలా
  choice: ప్రశ్నార్థకంగా ‘ఇది ఏమిటి?’
  alternative: ప్రధాన పాఠ్యంలో ‘మన్నా’ అని పేరు పెట్టడం
  rationale: ‘అది ఏమిటో వారికి తెలియదు’ అనే వెంటనే వచ్చే వివరణ దీన్ని ప్రజల ప్రశ్నగా గ్రహించడానికి బలమైన సందర్భాధారాన్ని ఇస్తుంది. ‘మన్నా’తో ఉన్న సాంప్రదాయ నామసంబంధాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. మూలంలోని ప్రశ్న, దాని వివరణ, మోషే ఇచ్చిన గుర్తింపు అనే క్రమాన్ని నిలిపింది; నుడికారపు అక్షరార్థం మరియు ‘మన్నా’ పదసంబంధాన్ని పాదసూచికల్లో ఉంచింది.
