  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “దాన్ని ఈ రోజు తినండి. ఎందుకంటే ఈ రోజు యెహోవాకు విశ్రాంతి దినం. ఈ రోజు పొలంలో అది మీకు దొరకదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: దాన్ని తినండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ప్రత్యయం సూచించే ‘దాన్ని’ను నిలిపింది.
- source_word: שַׁבָּת
  choice: విశ్రాంతి దినం
  rationale: ఈ సందర్భంలో ఆ దినపు స్వభావాన్ని స్పష్టంగా తెలియజేస్తూ, హెబ్రీ పదంలోని విశ్రాంతి భావాన్ని అందిస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హెబ్రీ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో వ్యక్తం చేసింది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: మన్నా సేకరించడానికి ప్రజలు వెళ్లే బహిరంగ ప్రదేశాన్ని సందర్భానుగుణంగా, నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: ‘యెహోవాకు విశ్రాంతి దినం’ అనే సంబంధం
  choice: యెహోవాకు విశ్రాంతి దినం
  alternative: యెహోవా నియమించిన విశ్రాంతి దినం
  rationale: లַיהוָה అనే మూలపాఠంలోని సంక్షిప్త సంబంధాన్ని నిలిపి, ‘నియమించిన’ వంటి స్పష్టీకరణను పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, గంభీరతను నిలిపిన ప్రత్యక్ష వాక్య నిర్మాణం. మూలంలోని ‘ఈ రోజు’ అనే మూడుసార్ల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపింది.
