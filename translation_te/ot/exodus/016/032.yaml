source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: te
  text: 'మోషే ఇలా అన్నాడు: “యాహ్వే ఆజ్ఞాపించినది ఇదే: దానిలో ఒక ఓమెరు నిండా[a] మీ తరతరాల కొరకు భద్రపరచి ఉంచాలి; నేను మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినప్పుడు అరణ్యంలో మీకు తినిపించిన రొట్టెను వారు చూడడానికి ఇలా చేయాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒక ఓమెరు నిండా’ అంటే ఓమెరు అనే కొలతలో పూర్తిగా నిండే పరిమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: మోషే ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష వాక్య పరిచయంతో వ్యక్తపరుస్తుంది.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: యాహ్వే ఆజ్ఞాపించినది ఇదే
  rationale: דָּבָר ఇక్కడ నిర్దిష్ట ఆజ్ఞను సూచిస్తుంది; యెహోవా నామాన్ని ధ్వన్యనుసారంగా ‘యాహ్వే’గా ఉంచింది.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: దానిలో ఒక ఓమెరు నిండా
  rationale: మన్నాను సూచించే మִמֶּנּוּను ‘దానిలో’గా, ప్రాచీన కొలతను మార్చకుండా మְלֹא భావాన్ని ‘నిండా’గా తెలిపింది.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: మీ తరతరాల కోసం భద్రపరచాలి
  rationale: భవిష్యత్తు తరాల జ్ఞాపకార్థం దానిని కాపాడి ఉంచాలనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְמַעַן יִרְאוּ
  choice: వారు చూసేలా
  rationale: ఇది ఉద్దేశాన్ని తెలిపే ఉపవాక్యం; ‘వారు’ అనేది ముందు ప్రస్తావించిన భావి తరాలను సూచిస్తుంది.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: నేను ... మీకు తినిపించిన ఆహారాన్ని
  rationale: לֶחֶםకు ‘రొట్టె’ అనే మూలార్థం ఉన్నా, ఇక్కడ చూడవలసిన మన్నాను సూచిస్తున్నందున తెలుగులో సహజమైన ‘ఆహారం’ ఎంచుకుంది; హిఫిల్ రూపంలోని పోషణ భావాన్ని ‘తినిపించిన’ నిలుపుతుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: నిర్జన ప్రదేశం అనే విస్తృత బైబిలు భావాన్ని ‘ఎడారి’కన్నా ‘అరణ్యం’ బాగా అందిస్తుంది.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: నేను మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినప్పుడు
  rationale: בְּ + క్రియానామ రూపంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించిన ధ్వన్యనుసార రూపంలో నిలుపుతుంది.
- issue: הַלֶּחֶם అర్థం
  choice: ఆహారం
  alternative: రొట్టె
  rationale: మూలపదంలోని ‘రొట్టె/ఆహారం’ అర్థవ్యాప్తిలో, ఈ సందర్భంలో ప్రత్యక్షంగా చూపించబడేది మన్నానే కనుక ‘ఆహారం’ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది; నిర్దిష్టంగా ‘మన్నా’ అని చేర్చి మూలంలోని పదాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం వాడబడింది. ప్రాచీన కొలమానం ‘ఓమెరు’ను మార్పిడి చేయకుండా ఉంచి పాదటిప్పణిలో వివరించబడింది.
