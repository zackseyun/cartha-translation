revisions:
- from: 'మోషే ఇలా అన్నాడు: “యాహ్వే ఆజ్ఞాపించినది ఇదే: దానిలో ఒక ఓమెరు నిండా[a] మీ తరతరాల కోసం భద్రపరచాలి. నేను మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినప్పుడు అరణ్యంలో మీకు తినిపించిన ఆహారాన్ని వారు చూసేలా ఇది చేయాలి.”'
  to: 'మోషే ఇలా అన్నాడు: “యాహ్వే ఆజ్ఞాపించినది ఇదే: దానిలో ఒక ఓమెరు నిండా[a] మీ తరతరాల కొరకు భద్రపరచి ఉంచాలి; నేను మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చినప్పుడు అరణ్యంలో మీకు తినిపించిన రొట్టెను వారు చూడడానికి ఇలా చేయాలి.”'
  rationale: The revision restores the specific “bread” wording of the Hebrew, clarifies that the preserved omer enables later generations to see it, and refines the cultural footnote while retaining the ancient unit and the stated divine name.
