source:
  edition: WLC
  text: וַ/יַּנִּ֤יחוּ אֹת/וֹ֙ עַד הַ/בֹּ֔קֶר כַּ/אֲשֶׁ֖ר צִוָּ֣ה מֹשֶׁ֑ה וְ/לֹ֣א הִבְאִ֔ישׁ וְ/רִמָּ֖ה לֹא הָ֥יְתָה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: te
  text: మోషే ఆజ్ఞాపించినట్లే వారు దానిని ఉదయం వరకు ఉంచారు. అది దుర్వాసన కొట్టలేదు; దానిలో పురుగులు[a] కూడా లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈగ పురుగులు.” హీబ్రూ పదం కుళ్లుతున్న పదార్థంలో కనిపించే పురుగు వంటి జీవులను సాధారణంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: వారు దానిని ఉంచారు
  rationale: ఇక్కడ హిఫీల్ క్రియకు, మన్నాను రాత్రంతా అలాగే ఉంచారనే సందర్భోచిత అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఏకవచన సర్వనామ భావాన్ని ‘దానిని’గా నిలుపుతుంది.
- source_word: עַד הַבֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాలపరిమితిని తెలిపే హీబ్రూ పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: మోషే ఆజ్ఞాపించినట్లే
  rationale: వారి చర్య మోషే ఇచ్చిన ఆజ్ఞకు సరిగ్గా అనుగుణంగా జరిగిందనే పోలికను ‘-ట్లే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא הִבְאִישׁ
  choice: అది దుర్వాసన కొట్టలేదు
  rationale: క్రియలోని పాడై కంపు కొట్టడం అనే ప్రత్యక్ష భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְרִמָּה לֹא הָיְתָה בּוֹ
  choice: దానిలో పురుగులు కూడా లేవు
  rationale: హీబ్రూలోని అస్తిత్వ నిరాకరణను నేరుగా నిలుపుతుంది. ఏకవచన సమూహార్థ నామవాచకాన్ని తెలుగులో సహజంగా బహువచనంగా ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని రెండు నిరాకరణలూ విడివిడిగా నిలుపబడ్డాయి; ‘పురుగులు’ అనే విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
