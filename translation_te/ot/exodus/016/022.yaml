revisions:
- from: ఆరవ రోజున వారు రెండింతల ఆహారాన్ని[a]—ఒక్కొక్కరికి రెండు ఓమెర్లు చొప్పున—సేకరించారు. అప్పుడు సమాజంలోని నాయకులందరూ వచ్చి మోషేతో ఆ విషయం చెప్పారు.
  to: ఆరవ రోజున వారు రెండింతల రొట్టెను—ఒక్కొక్కరికి రెండు ఓమెర్లు[a] చొప్పున—సేకరించారు. అప్పుడు సమాజ నాయకులందరూ వచ్చి మోషేకు తెలియజేశారు.
  rationale: లֶחֶםకు ‘రొట్టె’ను ఉపయోగించి మూలపాఠంలోని పదప్రయోగాన్ని నిలుపుకున్నాం. మోషేకు నివేదించిన భావాన్ని స్పష్టంగా చేయడానికి ‘మోషేకు తెలియజేశారు’గా మార్చాం. ‘ఓమెర్లు’కు వెంటనే కొలమాన వివరణ సూచికను ఉంచాం.
