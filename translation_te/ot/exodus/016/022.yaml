source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: te
  text: ఆరవ రోజున వారు రెండింతల రొట్టెను—ఒక్కొక్కరికి రెండు ఓమెర్లు[a] చొప్పున—సేకరించారు. అప్పుడు సమాజ నాయకులందరూ వచ్చి మోషేకు తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఓమెరు ప్రాచీన ఇశ్రాయేలులో ఉపయోగించిన పొడి పదార్థాల కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: ఆరవ రోజున
  rationale: హీబ్రూ కథనారంభ సూత్రం וַיְהִיని తెలుగులో విడిగా ‘జరిగింది’ అని అనువదించడం అసహజంగా ఉంటుంది; కాలసూచక పదబంధంతో నేరుగా ప్రారంభించడం దాని కథన కార్యాన్ని సహజంగా అందిస్తుంది.
- source_word: לָקְטוּ
  choice: సేకరించారు
  rationale: మన్నాను ఏరుకొని కూడబెట్టడాన్ని సూచించే לקטకు ఆధునిక ప్రామాణిక తెలుగులో ‘సేకరించారు’ స్పష్టమైన, సహజమైన సమానం.
- source_word: לֶחֶם מִשְׁנֶה
  choice: రెండింతల ఆహారాన్ని
  rationale: לֶחֶםకు మౌలికంగా ‘రొట్టె’ అనే అర్థమున్నా, ఇక్కడ మన్నా అనే ఆహార సరఫరాను సూచిస్తుంది. ‘రెండింతల ఆహారం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ מִשְׁנֶה యొక్క పరిమాణ భావాన్ని నిలుపుతుంది.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: ఒక్కొక్కరికి రెండు ఓమెర్లు చొప్పున
  rationale: לָאֶחָדలోని పంపిణీ భావాన్ని ‘ఒక్కొక్కరికి ... చొప్పున’ స్పష్టంగా వ్యక్తపరుస్తుంది; ప్రాచీన కొలమానమైన עֹמֶרను లిప్యంతరీకరించాం.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: సమాజంలోని నాయకులందరూ
  rationale: נְשִׂיאִים గుర్తింపు పొందిన నాయకులను, עֵדָה ఇశ్రాయేలు సమాజాన్ని సూచిస్తాయి; ఈ పదబంధం ఆధునిక పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: వచ్చి మోషేతో ఆ విషయం చెప్పారు
  rationale: వారు ముందుగా వచ్చి, తరువాత మోషేకు తెలియజేశారనే క్రియాక్రమాన్ని నిలుపుతుంది. తెలుగులో ‘మోషేతో చెప్పారు’ సహజ ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ప్రాచీన కొలమానం ‘ఓమెరు’ను మూలపాఠానికి నిబద్ధంగా నిలుపుకున్నాం. పరిమాణ వివరణను డ్యాష్‌ల మధ్య ఉంచి, ‘రెండింతలు’ అనే భావాన్ని వెంటనే స్పష్టం చేశాం.
