translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని పునరుక్తిని అలాగే ఉంచి, మొదటి భాగంలోని ‘జనావాసమున్న దేశం’ మరియు రెండో భాగంలోని ‘కనాను దేశపు సరిహద్దు’ మధ్య ఉన్న భావసంబంధాన్ని వివరణాత్మకంగా కలిపివేయలేదు.
