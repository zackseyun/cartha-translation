id: EXO.16.35
reference: Exodus 16:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: te
  text: ఇశ్రాయేలీయులు[a] జనావాసమున్న దేశానికి[b] చేరేవరకు నలభై సంవత్సరాలు మన్నాను తిన్నారు; వారు కనాను దేశపు సరిహద్దుకు[c] చేరేవరకు మన్నాను తిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే స్థిరమైన హీబ్రూ నామం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘స్థిరనివాసమున్న దేశానికి.’ ఈ మాట అరణ్యానికి భిన్నంగా ప్రజలు నివసించే ప్రాంతాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘కనాను దేశపు అంచుకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉన్నా, ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన సామూహిక నామం. ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా ఉండి, పురుషులను మాత్రమే సూచిస్తున్నదనే అపార్థాన్ని నివారిస్తుంది.
- source_word: אָכְלוּ
  choice: తిన్నారు
  rationale: ఇది אכל ధాతువు యొక్క Qal perfect 3cp రూపం; గతకాల సారాంశ వాక్యంలో ‘తిన్నారు’ నేరుగా, సహజంగా భావాన్ని అందిస్తుంది.
- source_word: הַמָּן
  choice: మన్నాను
  rationale: మָן అనే ఆహార పదార్థానికి తెలుగులో స్థిరపడిన రూపం ‘మన్నా’; కర్మవిభక్తితో ‘మన్నాను’ అని అనువదించబడింది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలిపే సాధారణ సంఖ్యా ప్రయోగాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עַד בֹּאָם
  choice: చేరేవరకు
  rationale: ‘వారు వచ్చేవరకు’ అనే అక్షరార్థాన్ని గమ్యస్థాన సందర్భంలో ‘చేరేవరకు’ సహజంగా వ్యక్తం చేస్తుంది; ‘ప్రవేశించేవరకు’ అని అనువదిస్తే మూలంలో లేని అదనపు భావం చేరుతుంది.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: జనావాసమున్న దేశానికి
  rationale: נוֹשָׁבֶת అనేది నివసించబడిన లేదా స్థిరనివాసం ఏర్పడిన ప్రాంతాన్ని సూచిస్తుంది. ‘జనావాసమున్న’ అనే పదం అరణ్యానికి విరుద్ధమైన నివాసయోగ్య ప్రాంత భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: కనాను దేశపు సరిహద్దుకు
  rationale: קְצֵה అంటే అంచు, చివర లేదా సరిహద్దు. భౌగోళిక సందర్భంలో ‘సరిహద్దు’ సహజమైన తెలుగు ఎంపిక.
