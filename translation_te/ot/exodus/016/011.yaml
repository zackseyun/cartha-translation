lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: దבר అనే మాటకు ‘మాట్లాడాడు’ అనే అర్థం ఉన్నప్పటికీ, తరువాత వచ్చే לֵאמֹר సూత్రంతో కలిపి సహజమైన ఆధునిక తెలుగులో ‘ఇలా చెప్పాడు’ అని అనువదించడం ప్రసంగ పరిచయాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలిపే אֶל‌ను తెలుగులో సహజమైన సహచర్య విభక్తి ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ సూత్రాన్ని తెలుగులో సహజంగా ‘ఇలా’ అని వ్యక్తం చేశాం; ముగింపులో ద్విబిందువు అదే పనిని బలపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ సాధ్యమైనప్పటికీ, తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీయ ‘మాట్లాడి, చెప్పాడు’ అనే పునరుక్త నిర్మాణాన్ని పదేపదే అనుకరించకుండా, దాని ప్రసంగ-పరిచయ కార్యాన్ని ‘ఇలా చెప్పాడు:’గా వ్యక్తం చేశాం.
