  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నా ఆజ్ఞలనూ నా నియమాలనూ[a] పాటించడానికి మీరు ఎంతకాలంగా నిరాకరిస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ఉపదేశాలను.” హీబ్రూలో తోరోత్ (తోరా యొక్క బహువచనం) అనే పదం నియమాలతో పాటు అధికారపూర్వక ఉపదేశాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమానుసార భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: עַד אָנָה
  choice: ఇంకా ఎంతకాలం
  rationale: కొనసాగుతున్న అవిధేయత ఎంతకాలం సాగుతుందనే మందలింపు భావాన్ని ఈ హీబ్రూ నుడికారం వ్యక్తం చేస్తుంది.
- source_word: מֵאַנְתֶּם
  choice: మీరు ... నిరాకరిస్తారు
  rationale: బహువచన క్రియ ప్రజలను ఉద్దేశిస్తుంది; ప్రశ్నలోని కొనసాగుతున్న మొండితనాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ఇంకా ఎంతకాలం ... నిరాకరిస్తారు?’ అని ఇచ్చాం.
- source_word: לִשְׁמֹר
  choice: పాటించడానికి
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే వాటిని కాపాడటం అనే అక్షరార్థం కంటే ఆచరించడం లేదా పాటించడం; ‘పాటించు’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: దైవిక ఆదేశాల అధికారపూర్వక భావాన్ని ‘ఆజ్ఞలు’ సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: וְתוֹרֹתָי
  choice: నా ధర్మశాస్త్రాలను
  rationale: మొదటి పురుష బహువచన స్వామ్యరూపంలో ఉన్న תּוֹרָה పదానికి ఇక్కడ నియమబద్ధమైన బోధల భావం ఉంది. ‘ధర్మశాస్త్రాలు’ ఆ అధికారిక న్యాయ భావాన్ని నిలుపుతుంది; విస్తృతమైన ‘ఉపదేశాలు’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో సాధారణంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: תוֹרֹתָי పదంలోని న్యాయ మరియు ఉపదేశ భావాలు
  choice: నా ధర్మశాస్త్రాలను
  alternative: నా ఉపదేశాలను
  rationale: ‘నా ఆజ్ఞలు’తో సమాంతరంగా ఉండటం వల్ల ప్రధాన పాఠంలో నియమబద్ధమైన భావాన్ని నిలిపాం. అయితే תּוֹרָה కేవలం చట్టం మాత్రమే కాక అధికారపూర్వక ఉపదేశాన్నీ సూచించగలదు కాబట్టి ఆ నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దైవిక మందలింపుకు తగిన గంభీరతను ఉంచాం. మోషే ఏకవచన సంబోధితుడైనా, ‘నిరాకరిస్తారు’ అనే బహువచనం ఇశ్రాయేలు ప్రజలను సూచిస్తున్న మూలపాఠ రూపాన్ని కాపాడుతుంది.
