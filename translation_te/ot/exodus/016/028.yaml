revisions:
- from: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “నా ఆజ్ఞలను, నా ధర్మశాస్త్రాలను[a] పాటించడానికి మీరు ఇంకా ఎంతకాలం నిరాకరిస్తారు?”'
  to: 'అప్పుడు యాహ్వే మోషేతో ఇలా అన్నాడు: “నా ఆజ్ఞలనూ నా నియమాలనూ[a] పాటించడానికి మీరు ఎంతకాలంగా నిరాకరిస్తున్నారు?”'
  rationale: The revision aligns the divine name with the English POB audit trail, represents the Hebrew perfect as ongoing past-and-present refusal, and avoids over-specifying plural torot while retaining its broader instructional sense in the footnote. The plural ‘మీరు’ is retained because the Hebrew verb is plural, despite Yahweh addressing Moses as the narrative intermediary.
