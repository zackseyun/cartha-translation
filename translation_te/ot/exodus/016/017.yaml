  yaml_path: translation/ot/exodus/016/017.yaml
  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు అలాగే చేశారు; కొందరు ఎక్కువగా, కొందరు తక్కువగా ఏరుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా మరింత పదశః: “ఎక్కువగా ఏరుకున్నవారు, తక్కువగా ఏరుకున్నవారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: అలాగే చేశారు
  rationale: עשה తో כֵן కలిసిన ఈ ప్రయోగం ముందున్న ఆజ్ఞ ప్రకారం వారు చేసినట్లు సూచిస్తుంది; ఆధునిక తెలుగులో ‘అలాగే చేశారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబ సంబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: וַיִּלְקְטוּ
  choice: వారు ఏరుకున్నారు
  rationale: לקט ఆహార పదార్థాలను ఒక్కొక్కటిగా ఏరడం లేదా సమకూర్చుకోవడం అనే భావాన్ని ఇస్తుంది; మన్నా సందర్భంలో ‘ఏరుకున్నారు’ సహజమైన ఎంపిక.
- source_word: הַמַּרְבֶּה
  choice: ఒకరు ఎక్కువగా
  rationale: ఈ substantivized participle ఎక్కువ పరిమాణం ఏరుకున్న వ్యక్తిని సూచిస్తుంది; తరువాతి విరుద్ధ పదంతో జతగా తెలుగులో సహజంగా ఉండేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: הַמַּמְעִיט
  choice: మరొకరు తక్కువగా
  rationale: ఈ substantivized participle తక్కువ పరిమాణం ఏరుకున్న వ్యక్తిని సూచిస్తుంది; המרבה తో ఉన్న విరుద్ధతను స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే కుటుంబపరమైన వ్యక్తీకరణను నిలిపి, చివరి రెండు participles మధ్య పరిమాణ వ్యత్యాసాన్ని స్పష్టంగా వ్యక్తం చేసింది.
