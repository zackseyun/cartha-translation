revisions:
- from: చూడండి—యాహ్వే మీకు సబ్బాతును ఇచ్చాడు. అందుకే ఆరవ రోజున ఆయన మీకు రెండు రోజులకు సరిపడే రొట్టెను ఇస్తున్నాడు. ప్రతి మనిషి[a] తన చోటనే ఉండాలి; ఏడవ రోజున ఏ మనిషీ తన చోటు విడిచి బయటికి వెళ్లకూడదు.
  to: 'చూడండి: యాహ్వే మీకు సబ్బాతును ఇచ్చాడు; అందుచేత ఆయన ఆరవ రోజున మీకు రెండు రోజులకు సరిపడే రొట్టెను ఇస్తాడు. ప్రతి మనిషి[a] తన చోటనే ఉండాలి; ఏడవ రోజున ఏ మనిషీ తన చోటు విడిచి బయటికి వెళ్లకూడదు.'
  rationale: The revision preserves all lexical content and the representative masculine phrasing, while making the Hebrew ‘for ... therefore’ reasoning more transparent and using a customary present for the sixth-day provision.
