id: EXO.16.29
reference: Exodus 16:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: te
  text: 'చూడండి: యాహ్వే మీకు సబ్బాతును ఇచ్చాడు; అందుచేత ఆయన ఆరవ రోజున మీకు రెండు రోజులకు సరిపడే రొట్టెను ఇస్తాడు. ప్రతి మనిషి[a] తన చోటనే ఉండాలి; ఏడవ రోజున ఏ మనిషీ తన చోటు విడిచి బయటికి వెళ్లకూడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ప్రతి మనిషి’ అని ఉంది; ఈ పురుషలింగ రూపం సమాజంలోని ఒక్కొక్క వ్యక్తిని సూచించే పంపిణీ భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: చూడండి
  rationale: బహువచన ఆజ్ఞ యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది. ఈ సందర్భంలో ‘గమనించండి/గ్రహించండి’ అనే భావం కూడా సాధ్యమే; తరువాతి వివరణ ఆ భావాన్ని పాఠకుడు గ్రహించేందుకు వీలు కల్పిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు సమీపంగా తెలుగులో అందిస్తుంది.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: మీకు సబ్బాతును ఇచ్చాడు
  rationale: సబ్బాతు ఇశ్రాయేలుకు అనుగ్రహించబడినదనే పూర్తయిన క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ముందటి వాక్యానికి తరువాతి ఏర్పాటును పర్యవసానంగా కలుపుతుంది.
- source_word: נֹתֵן
  choice: ఇస్తున్నాడు
  rationale: హీబ్రూ వర్తమాన క్రియారూపంలోని ప్రస్తుత లేదా కొనసాగుతున్న అనుగ్రహ భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: לֶחֶם יוֹמָיִם
  choice: రెండు రోజులకు సరిపడే రొట్టె
  rationale: ‘రెండు రోజుల రొట్టె’ అనే మూలంలోని నిర్దిష్ట పదాన్ని నిలుపుతూ, పరిమాణార్థాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: ప్రతి మనిషి తన చోటనే ఉండాలి
  rationale: ישב ఇక్కడ కూర్చోవడం కంటే ఉండిపోవడాన్ని, תַּחְתָּיו తన స్థానంలోనే ఉండడాన్ని సూచిస్తాయి.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: ఏ మనిషీ తన చోటు విడిచి బయటికి వెళ్లకూడదు
  rationale: నిషేధ ఆజ్ఞను స్పష్టంగా వ్యక్తపరుస్తూ ‘మనిషి’ మరియు ‘చోటు’ అనే మూలపదాల పునరుక్తిని నిలుపుతుంది.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: మూలంలోని కాలసూచనను అదనపు వివరణ లేకుండా నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన రూపంలో నిలుపుతుంది.
- issue: אִישׁ లోని ప్రతినిధి పురుషలింగ ప్రయోగం
  choice: ప్రతి మనిషి / ఏ మనిషీ
  alternative: ప్రతి ఒక్కరూ / ఎవరూ
  rationale: హీబ్రూ పురుషలింగ ఏకవచన పదం సమాజంలోని ప్రతి వ్యక్తికి పంపిణీ భావంలో వర్తిస్తుంది. ప్రధాన పాఠం మూలరూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; పాదసూచిక దాని సమూహవ్యాప్త భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞాత్మక శైలి. ‘చూడండి’లోని ప్రత్యక్షంగా చూడడం/గమనించి గ్రహించడం అనే భావవ్యాప్తిని పరిష్కరించకుండా నిలుపడానికి దాని తరువాత దీర్ఘవిరామ చిహ్నం వాడబడింది. ‘సబ్బాతు’ను సంస్థ/దినానికి స్థిరమైన పేరుగా ఉంచి, ‘రొట్టె’ అనే మూలంలోని నిర్దిష్ట రూపకాన్ని సాధారణ ‘ఆహారం’గా విస్తరించలేదు.
