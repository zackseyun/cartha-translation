revisions:
- from: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఇదిగో, నేను మీ కోసం ఆకాశం నుంచి రొట్టెను కురిపించబోతున్నాను[a]. ప్రజలు బయటికి వెళ్లి, ప్రతిరోజూ ఆ రోజుకు కావలసినంత ఏరుకోవాలి[b]. వారు నా ఉపదేశం ప్రకారం నడుచుకుంటారో లేదో పరీక్షించడానికి నేను ఇలా చేస్తాను[c].”'
  to: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఇదిగో, నేను మీ కోసం ఆకాశం నుంచి రొట్టెను కురిపించబోతున్నాను[a]. ప్రజలు బయటికి వెళ్లి, ప్రతిరోజూ ఆ రోజుకు కావలసినంత ఏరుకోవాలి[b]. వారు నా ఉపదేశానుసారం[c] నడుచుకుంటారో లేదో నేను వారిని పరీక్షించడానికి ఇలా చేస్తున్నాను.”'
  rationale: పరీక్ష ఉద్దేశాన్ని మూల హీబ్రూ వాక్యనిర్మాణానికి మరింత దగ్గరగా చేశాం మరియు תּוֹרָהకు సంబంధించిన పాదసూచిక గుర్తును ‘ఉపదేశం’కు నేరుగా జతచేశాం. ఇతర పదార్థం, కాలభావం, మరియు దినసరి పరిమాణ భావం నిలుపబడ్డాయి.
