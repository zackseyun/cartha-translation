id: EXO.16.4
reference: Exodus 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: te
  text: 'అప్పుడు యెహోవా మోషేతో ఇలా అన్నాడు: “ఇదిగో, నేను మీ కోసం ఆకాశం నుంచి రొట్టెను కురిపించబోతున్నాను[a]. ప్రజలు బయటికి వెళ్లి, ప్రతిరోజూ ఆ రోజుకు కావలసినంత ఏరుకోవాలి[b]. వారు నా ఉపదేశానుసారం[c] నడుచుకుంటారో లేదో నేను వారిని పరీక్షించడానికి ఇలా చేస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కురిపిస్తున్నాను.” హీబ్రూ కృదంతం సమీప భవిష్యత్తును లేదా సజీవంగా ప్రకటించిన ప్రారంభ చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “ఒక రోజు విషయం దాని రోజున”; అంటే, ప్రతి రోజుకు అవసరమైన భాగాన్ని ఆ రోజే ఏరుకోవాలి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారు నా ధర్మశాస్త్రానుసారం నడుచుకుంటారో లేదో.” תּוֹרָה అనే హీబ్రూ పదానికి ‘ఉపదేశం,’ ‘బోధ,’ లేదా ‘ధర్మశాస్త్రం’ అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: దేవుని ప్రకటనపై దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַמְטִיר
  choice: కురిపించబోతున్నాను
  rationale: హిఫీల్ కృదంతంలోని సమీప భవిష్యత్తు భావాన్ని సహజంగా వ్యక్తం చేస్తూ, వర్షంలా కురిపించడం అనే హీబ్రూ చిత్రాన్ని నిలుపుతుంది.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: ఆకాశం నుంచి రొట్టెను
  rationale: לֶחֶם అనే స్పష్టమైన పదాన్ని విస్తృతార్థకమైన ‘ఆహారం’గా మార్చకుండా ‘రొట్టె’గా నిలుపుతుంది; מִן הַשָּׁמַיִםను సందర్భానికి సహజంగా ‘ఆకాశం నుంచి’ అని ఇస్తుంది.
- source_word: וְיָצָא הָעָם וְלָקְטוּ
  choice: ప్రజలు బయటికి వెళ్లి ... ఏరుకోవాలి
  rationale: ప్రజలు చేయవలసిన నియమిత చర్యను తెలుగులో సహజమైన ఆదేశార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతిరోజూ ఆ రోజుకు కావలసినంత
  rationale: అక్షరార్థమైన ‘ఒక రోజు విషయం దాని రోజున’ అనే హీబ్రూ నుడికారాన్ని, ప్రతి రోజుకి అవసరమైన పరిమాణాన్ని అదే రోజు సేకరించాలనే భావంతో స్పష్టంగా అందిస్తుంది.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: పరీక్షించడానికి నేను ఇలా చేస్తాను
  rationale: ఏకవచన ప్రత్యయం సమూహవాచకమైన ‘ప్రజలు’ను సూచిస్తున్నందున తెలుగులో బహువచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; దేవుడు పరీక్షించే ఉద్దేశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי אִם לֹא
  choice: వారు నా ఉపదేశం ప్రకారం నడుచుకుంటారో లేదో
  rationale: ‘నడుచుకోవడం’ అనే ప్రవర్తనా రూపకాన్ని నిలుపుతూ, ఈ సీనాయి పూర్వ సందర్భంలో תּוֹרָהకు ప్రాథమికమైన ‘ఉపదేశం’ భావాన్ని ఇస్తుంది; ‘లేదో’ పరోక్ష ప్రశ్నను సహజంగా పూర్తిచేస్తుంది.
theological_decisions:
- issue: సీనాయి ధర్మశాస్త్ర ప్రదానానికి ముందున్న సందర్భంలో תּוֹרָה అనువాదం
  choice: నా ఉపదేశం
  alternative: నా ధర్మశాస్త్రం
  rationale: ఇక్కడ దేవుడు మన్నా సేకరణకు ఇవ్వబోయే నిర్దేశాన్ని ప్రజలు పాటిస్తారా అని పరీక్షిస్తున్నాడు. అందువల్ల ‘ఉపదేశం’ తక్షణ సందర్భానికి సరిపోతుంది; అయితే ‘ధర్మశాస్త్రం’ అనే ఒడంబడిక సంబంధిత భావం కూడా సాధ్యమైనందున పాదసూచికలో ఉంచబడింది.
- issue: దేవుని పరీక్ష యొక్క స్వభావం
  choice: వారు నడుచుకుంటారో లేదో పరీక్షించడం
  alternative: వారిని శోధించడం లేదా పాపానికి ప్రేరేపించడం
  rationale: נסה ఇక్కడ విధేయత బయటపడేలా పరీక్షించడాన్ని సూచిస్తుంది; చెడుకు ప్రేరేపించడం అనే భావాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘రొట్టెను కురిపించడం’ అనే మూలపాఠ చిత్రణను నిలుపుతూ, దినసరి పరిమాణానికి సంబంధించిన హీబ్రూ నుడికారాన్ని సహజ తెలుగులో స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
