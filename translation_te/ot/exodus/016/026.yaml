source:
  edition: WLC
  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: te
  text: ఆరు రోజులు మీరు దాన్ని పోగుచేసుకోవాలి. అయితే[a] ఏడవ రోజు సబ్బాతు[b]; ఆ రోజున అది ఉండదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అయితే’కు బదులుగా ‘మరియు’ అని కూడా అనువదించవచ్చు; హీబ్రూ సంధిపదం సాధారణంగా ‘మరియు’ అనే అర్థమిస్తుంది, కాని ఇక్కడ సందర్భం వ్యత్యాసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: పదశః, ‘ఏడవ రోజు—సబ్బాతు.’
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఆ రోజున మన్నా కనిపించదు.
    reason: contextual_clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ఆరు రోజులు
  rationale: హీబ్రూ నిర్మాణం పదశః ‘రోజులలో ఆరు’ అనే భావం ఇచ్చినా, తెలుగులో సహజమైన కాలవ్యవధి వ్యక్తీకరణ ‘ఆరు రోజులు’.
- source_word: תִּלְקְטֻהוּ
  choice: మీరు దాన్ని పోగుచేసుకోవాలి
  rationale: לקט అంటే చెల్లాచెదురుగా ఉన్నదాన్ని ఏరడం లేదా పోగుచేయడం. ద్వితీయ పురుష బహువచన కర్తను ‘మీరు’తో, పురుష ఏకవచన కర్మప్రత్యయాన్ని ‘దాన్ని’తో వ్యక్తం చేశాం; సందర్భంలోని ఆదేశ భావాన్ని ‘చేసుకోవాలి’ నిలుపుతుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: అయితే ఏడవ రోజు
  rationale: ו సాధారణంగా ‘మరియు’ అని అనువదించవచ్చు; ఇక్కడ ఆరు రోజులకు ఏడవ రోజును వ్యతిరేకంగా ఉంచుతున్నందున ‘అయితే’ సందర్భానుకూలం. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: שַׁבָּת
  choice: సబ్బాతు
  rationale: మూలంలోని ప్రత్యేక నామవాచకాన్ని ‘విశ్రాంతి దినం’ అని వివరణాత్మకంగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘సబ్బాతు’గా ఉంచాం. అది ‘ఏడవ రోజు’కు సమానాధికరణంగా ఉంది.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: ఆ రోజున అది ఉండదు
  rationale: పదశః ‘దానిలో/దానిపై అది ఉండదు.’ בּוֹలోని సర్వనామం ఏడవ రోజును సూచిస్తున్నందున తెలుగులో సహజంగా ‘ఆ రోజున’ అన్నాం; ‘అది’ సందర్భంలో మన్నాను సూచిస్తుంది, కానీ మూలంలో లేని ‘మన్నా’ను ప్రధాన వాక్యంలో చేర్చలేదు.
theological_decisions:
- issue: సీనాయి నిబంధనకు ముందు שַׁבָּת పదం వినియోగం
  choice: సబ్బాతు
  alternative: విశ్రాంతి దినం / ఆ సబ్బాతు
  rationale: שַׁבָּתకు ఇక్కడ నిర్దిష్ట ఉపపదం లేదు; అది ‘ఏడవ రోజు’కు సమానాధికరణంగా నిలుస్తుంది. ‘సబ్బాతు’ అనే నామరూపం మూలంలోని సంక్షిప్తతను, ఈ దశలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది; ‘ఆ సబ్బాతు’ అని నిర్దిష్టతను అదనంగా చేర్చదు, ‘విశ్రాంతి దినం’ అని పూర్తిగా వివరణాత్మకంగా మార్చదు.
- issue: ఏడవ రోజున ఉండనిదాని గుర్తింపు
  choice: ప్రధాన వాక్యంలో ‘అది’; పాదటిప్పణిలో మన్నా అని వివరణ
  alternative: ఏడవ రోజున మన్నా ఉండదు
  rationale: మూల వాక్యంలో వస్తువు స్పష్టంగా పేరుపెట్టబడలేదు; సందర్భం దాన్ని మన్నాగా గుర్తిస్తుంది. అందువల్ల మూలంలోని సూచనాత్మక స్వరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అర్థస్పష్టతను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘పోగుచేసుకోవాలి’ ఆదేశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘సబ్బాతు’ అనే పరిచిత బైబిలు పదాన్ని ఉంచి, దాని సమానాధికరణ నిర్మాణాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
