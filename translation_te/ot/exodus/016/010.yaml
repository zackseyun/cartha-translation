  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: te
  text: అహరోను ఇశ్రాయేలు ప్రజల సమాజమంతటితో[a] మాట్లాడుతుండగా, వారు అరణ్యం వైపు తిరిగారు. ఇదిగో, మేఘంలో యాహ్వే మహిమ ప్రత్యక్షమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారుల సమాజమంతటితో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: మాట్లాడుతుండగా
  rationale: וַיְהִי కథనాన్ని ముందుకు నడిపే నిర్మాణం; כְּדַבֵּר సమకాలిక చర్యను సూచిస్తుంది. తెలుగులో ‘మాట్లాడుతుండగా’ రెండింటి కథన-కాల సంబంధాన్ని సహజంగా తెలియజేస్తుంది; వేరుగా ‘అప్పుడు జరిగింది’ అని చేర్చడం అసహజంగా ఉంటుంది.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల సమాజమంతటితో
  rationale: עֵדָה సమష్టిగా కూడిన సమాజాన్ని సూచిస్తుంది. בְּנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజానికి జాతినామక ప్రయోగం; ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది. అక్షరార్థం పాదటిప్పణిలో నిలుపబడింది.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: వారు అరణ్యం వైపు తిరిగారు
  rationale: פנה తో אֶל దిశవైపు తిరగడాన్ని సూచిస్తుంది. ‘అరణ్యం వైపు తిరిగారు’ మూలంలోని కదలికను సహజంగా కాపాడుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన దృశ్యంపై శ్రద్ధను ఆకర్షించే హీబ్రూ సూచక అవ్యయానికి ‘ఇదిగో’ సహజమైన, గంభీరమైన సమానం.
- source_word: כְּבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: כָּבוֹד ఇక్కడ ప్రత్యక్షమయ్యే దైవ మహిమను సూచిస్తుంది. యెహోవా/ప్రభువు అనే ప్రత్యామ్నాయాల బదులు יהוה అనే వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: נִרְאָה בֶּעָנָן
  choice: మేఘంలో ... ప్రత్యక్షమైంది
  rationale: נִרְאָה ఇక్కడ ‘కనిపించింది/ప్రత్యక్షమైంది’ అనే నిఫాల్ భావంలో ఉంది; ‘ప్రత్యక్షమైంది’ దైవ ప్రత్యక్షత సందర్భానికి సరిపోతుంది. ה అనే నిర్దిష్ట ఉపపదం వల్ల ‘ఒక మేఘంలో’ కాక ‘మేఘంలో’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సామూహిక భావం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ పదబంధం మొత్తం సమాజాన్ని సూచించే జాతినామక ప్రయోగం. ప్రధాన పాఠంలో సహజమైన సామూహిక భావాన్ని ఇచ్చి, మూలంలోని పుత్రసంబంధ రూపాన్ని పాదటిప్పణిలో తెలిపాం; తద్వారా మూలరూపమూ, సందర్భార్థమూ రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కథన శైలిని వాడాం. ‘ఇదిగో’ అనే పదంతో హీబ్రూ వాక్యంలోని ఆకస్మిక దృశ్యబలాన్ని నిలిపాం; అనవసరంగా పురాతన శైలిని అనుకరించలేదు.
