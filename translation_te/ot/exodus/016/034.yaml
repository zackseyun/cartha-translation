    text: లేదా, “నిబంధన సాక్ష్యం ఎదుట.” ఇక్కడ “సాక్ష్యం” అనే హీబ్రూ సాంకేతిక పదం నిబంధన పలకలను లేదా వాటితో సంబంధమున్న దానిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్లే
  rationale: ముందు ఇచ్చిన ఆజ్ఞకు అహరోను చేసినది సరిగ్గా అనుగుణంగా ఉందనే పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: దేవుని అధికారపూర్వక ఆదేశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో స్థిరపడిన ప్రత్యక్ష రూపంలో సూచిస్తుంది.
- source_word: אֶל מֹשֶׁה
  choice: మోషేకు
  rationale: హీబ్రూ పరోక్ష కర్మను సహజమైన తెలుగు విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: וַיַּנִּיחֵהוּ
  choice: దాన్ని ... పెట్టాడు
  rationale: అహరోను నిర్దేశిత స్థలంలో పాత్రను ఉంచిన చర్యను సరళంగా తెలియజేస్తుంది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఆరాధనా మందిర సందర్భంలోని స్థాన సంబంధాన్ని సంక్షిప్తంగా, సహజంగా చూపిస్తుంది.
- source_word: הָעֵדֻת
  choice: సాక్ష్యపు పలకలు
  rationale: పంచగ్రంథంలోని ప్రత్యక్ష గుడారపు సాంకేతిక సందర్భంలో ఈ పదం సాధారణంగా నిబంధన సాక్ష్యమైన పలకలను సూచిస్తుంది; అయితే విస్తృత అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: לְמִשְׁמָרֶת
  choice: భద్రంగా ఉంచడానికి
  rationale: దీర్ఘకాలం కాపాడి ఉంచే ఉద్దేశాన్ని అదనపు స్మారక భావాన్ని చేర్చకుండా సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ప్రత్యక్ష నామంగానే ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: הָעֵדֻת యొక్క సూచన
  choice: సాక్ష్యపు పలకలు
  alternative: సాక్ష్యం
  rationale: గుడారపు సాంకేతిక సందర్భంలో నిబంధన పలకలే ప్రధాన సూచనగా కనిపిస్తాయి; అయినా హీబ్రూ పదం వాటిని లేదా వాటితో సంబంధమున్న నిబంధన సాక్ష్యాన్ని సూచించగల విస్తృతిని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఆరాధనా గుడారానికి సంబంధించిన సాంకేతిక పదంలోని అర్థ విస్తృతిని పాదసూచికలో నిలిపాం.
