translation:
  language: te
  text: యెహోవా మోషేకు ఆజ్ఞాపించినట్లే, అహరోను దానిని సాక్ష్యం ఎదుట భద్రపరచడానికి ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
