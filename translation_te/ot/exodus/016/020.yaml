source:
  edition: WLC
  text: וְ/לֹא שָׁמְע֣וּ אֶל מֹשֶׁ֗ה וַ/יּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וַ/יָּ֥רֻם תּוֹלָעִ֖ים וַ/יִּבְאַ֑שׁ וַ/יִּקְצֹ֥ף עֲלֵ/הֶ֖ם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: te
  text: కాని వారు మోషే మాట వినలేదు[a]. కొందరు పురుషులు దానిలో కొంతను ఉదయం వరకు మిగిల్చారు. అప్పుడు దానిలో పురుగులు పుట్టి, అది దుర్వాసన కొట్టింది[b]. మోషే వారిమీద కోపపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోషే మాటకు చెవియొగ్గలేదు.” హీబ్రూ పదబంధం వినడానికి నిరాకరించడం ద్వారా అవిధేయత చూపిన భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దానిలో పురుగులు ఉద్భవించాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: మోషే మాట వినలేదు
  rationale: שׁמע אֶל అంటే ఒకరి మాట వినడం లేదా లక్ష్యపెట్టడం. సందర్భంలో అవిధేయత అంతర్లీనంగా ఉన్నా, ప్రధాన పాఠంలో నేరుగా ‘లోబడలేదు’ అని బలపరచకుండా మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
- source_word: וַיּוֹתִרוּ
  choice: మిగిల్చారు
  rationale: יתר హిఫీల్ రూపం ‘మిగిలేలా ఉంచడం’ లేదా ‘మిగిల్చడం’ అని సూచిస్తుంది. మన్నాలో కొంతను ఆజ్ఞకు విరుద్ధంగా ఉదయం వరకు ఉంచిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు పురుషులు
  rationale: మూలపదం స్పష్టంగా పుంలింగ బహువచనం; సందర్భంలో ఒక అనిర్దిష్ట ఉపసమూహాన్ని సూచిస్తున్నందున ‘కొందరు పురుషులు’ అని అనువదించబడింది.
- source_word: מִמֶּנּוּ
  choice: దానిలో కొంత
  rationale: ఇది మన్నాను వెనుకకు సూచిస్తుంది. తెలుగులో ‘దానిలో కొంత’ అనేది పరిమాణంలో కొంత భాగాన్ని మిగిల్చారనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాలపరిమితిని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: దానిలో పురుగులు పుట్టి
  rationale: ఇక్కడ రום క్రియ పురుగులు అందులో ఉద్భవించడాన్ని సూచిస్తుంది. ‘పురుగులు పుట్టి’ సహజమైన తెలుగు; ‘దానిలో’ చేర్చడం ద్వారా మూలంలోని సంబంధం స్పష్టమవుతుంది.
- source_word: וַיִּבְאַשׁ
  choice: అది దుర్వాసన కొట్టింది
  rationale: క్రియకు ‘కంపు కొట్టడం/దుర్వాసన రావడం’ అనే అర్థం ఉంది. ‘దుర్వాసన కొట్టింది’ స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: మోషే వారిమీద కోపపడ్డాడు
  rationale: קצף కోపాన్ని సూచిస్తుంది; עַל‌తో కలిసి కోపం ఎవరి మీదో తెలియజేస్తుంది. ‘వారిమీద కోపపడ్డాడు’ మూల నిర్మాణానికీ తెలుగు వాడుకకూ సరిపోతుంది.
