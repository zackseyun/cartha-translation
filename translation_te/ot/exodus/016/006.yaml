revisions:
- from: 'అప్పుడు మోషే, అహరోనులు ఇశ్రాయేలు ప్రజలందరితో[a] ఇలా అన్నారు: “ఈ సాయంకాలం, యెహోవాయే మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడని మీరు తెలుసుకుంటారు.”'
  to: 'అప్పుడు మోషే, అహరోను ఇశ్రాయేలు ప్రజలందరితో[a] ఇలా అన్నారు: “సాయంకాలంలో, యాహ్వే మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడని మీరు తెలుసుకుంటారు.”'
