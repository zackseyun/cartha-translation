id: EXO.16.6
reference: Exodus 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: te
  text: 'అప్పుడు మోషే, అహరోను ఇశ్రాయేలు ప్రజలందరితో[a] ఇలా అన్నారు: “సాయంకాలంలో, యాహ్వే మిమ్మల్ని ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాడని మీరు తెలుసుకుంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులందరితో”; సంప్రదాయంగా, “ఇశ్రాయేలు సంతానమంతటితో” అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ בְּנֵי יִשְׂרָאֵל యొక్క అక్షరార్థ రూపాన్ని చూపిస్తూ, ప్రధాన పాఠంలో ఆధునిక సామూహిక అర్థాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ వరుస భావాన్ని సహజంగా తెలియజేస్తుంది; మోషే, అహరోనులు అనే సంయుక్త కర్త కారణంగా గౌరవ/బహువచన క్రియ వాడబడింది.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: మోషే, అహరోనులు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలు; సంయుక్త కర్తకు సహజమైన తెలుగు నిర్మాణం.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరితో[a]
  rationale: బְּנֵי יִשְׂרָאֵל అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినప్పటికీ, ఇక్కడ మొత్తం ఇశ్రాయేలు సమాజాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా అర్థమవుతుంది; మూలరూపం పాదటిప్పణిలో నిలుపబడింది.
- source_word: עֶרֶב
  choice: ఈ సాయంకాలం
  rationale: నామవాచకం కాలవాచకంగా పనిచేస్తోంది. సందర్భంలో అదే రోజు సాయంకాలాన్ని సూచిస్తున్నందున ‘ఈ సాయంకాలం’ సహజమైన తెలుగు కాలవ్యక్తీకరణ.
- source_word: וִידַעְתֶּם
  choice: మీరు తెలుసుకుంటారు
  rationale: ముందు సంభవించబోయే గుర్తింపును సూటిగా తెలిపే భవిష్యత్ రూపం; అదనపు భావాన్ని చేర్చదు.
- source_word: כִּי
  choice: అని
  rationale: తెలుసుకోబోయే విషయవిషయక ఉపవాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా అందిస్తుంది.
- source_word: הוֹצִיא
  choice: బయటకు తీసుకొచ్చాడు
  rationale: יצא యొక్క హిఫీల్ రూపానికి ‘బయటకు తీసుకురావడం’ సరైన కారణార్థక భావం. నిర్గమన కార్యాన్ని గత సంఘటనగా తెలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ పదాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన విభక్తి నిర్మాణాన్ని వాడుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా అందించబడింది. ‘యెహోవా’ ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా గుర్తించబడే రూపం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: దైవ కార్యానికి ఇచ్చిన ఉద్ఘాటన
  choice: యెహోవాయే ... తీసుకొచ్చాడని
  alternative: యెహోవా ... తీసుకొచ్చాడని
  rationale: హీబ్రూలో ప్రత్యేక ఉద్ఘాటక కణం లేకపోయినా, సందర్భంలో ప్రజలు తెలుసుకునే విషయం యెహోవా చేసిన కార్యమే. తెలుగు ‘యే’ కర్తను స్పష్టంగా కేంద్రీకరిస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా వాక్యపు వ్యతిరేక/గుర్తింపు బలాన్ని సహజంగా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే శైలి. సంభాషణకు సహజమైన ‘ఇలా అన్నారు’ నిర్మాణం వాడబడింది; మూలంలోని జాతిపేరుకు సంబంధించిన అక్షరార్థం పాదటిప్పణిలో భద్రపరచబడింది.
