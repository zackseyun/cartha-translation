source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: te
  text: మోషే యోసేపు ఎముకలను తన వెంట తీసుకున్నాడు. ఎందుకంటే యోసేపు ఇశ్రాయేలు కుమారులచేత తప్పకుండా ప్రమాణం చేయించి, “దేవుడు మీ కోసం తప్పకుండా జోక్యం చేసుకుంటాడు[a]. అప్పుడు మీరు ఇక్కడి నుండి నా ఎముకలను మీతో పైకి తీసుకువెళ్లాలి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు మిమ్మల్ని తప్పకుండా సందర్శిస్తాడు.” ఈ హీబ్రూ ప్రయోగం దేవుడు తన ప్రజల పక్షాన నిర్ణయాత్మకంగా జోక్యం చేసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకెళ్లాడు
  rationale: לקח అనే సాధారణ కథన క్రియకు సందర్భానుగుణంగా సహజమైన తెలుగు రూపం; ప్రయాణంలో వెంట తీసుకెళ్లడాన్ని స్పష్టం చేస్తుంది.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: ఎముకలు / నా ఎముకలను
  rationale: ‘అవశేషాలు’ అని విస్తరించకుండా హీబ్రూ పదంలోని నిర్దిష్టమైన, స్పష్టమైన చిత్రణను నిలుపుతుంది.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: తనతో / మీతో
  rationale: సహచర్యాన్ని తెలిపే రెండు హీబ్రూ రూపాల పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: గట్టిగా ప్రమాణం చేయిస్తూ
  rationale: కారణార్థక రూపాన్నీ, infinitive absolute వల్ల కలిగిన ఉద్ఘాటననూ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: మూలంలోని కుటుంబ సంబంధ పదబంధాన్ని లింగసూచకంగా, అయినా సహజంగా నిలుపుతుంది.
- source_word: פָּקֹד יִפְקֹד
  choice: తప్పకుండా ... పట్టించుకుంటాడు
  rationale: క్రియ పునరుక్తి తెలిపే నిశ్చయాన్ని ‘తప్పకుండా’ ద్వారా, దేవుని శ్రద్ధతో కూడిన జోక్యాన్ని ‘పట్టించుకుంటాడు’ ద్వారా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: וְהַעֲלִיתֶם
  choice: అప్పుడు ... తీసుకెళ్లాలి
  rationale: ప్రమాణ సందర్భంలోని బాధ్యతార్థాన్ని ‘తీసుకెళ్లాలి’ తెలియజేస్తుంది; ‘పైకి’ అనే దిశార్థం తెలుగులో అసహజంగా ఉండేందున ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చలేదు.
- source_word: מִזֶּה
  choice: ఇక్కడి నుండి
  rationale: ప్రస్తుత స్థలమైన ఐగుప్తును సూచించే దైక్తిక భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם యొక్క అర్థం
  choice: దేవుడు తప్పకుండా మిమ్మల్ని పట్టించుకుంటాడు
  alternative: దేవుడు తప్పకుండా మిమ్మల్ని దర్శిస్తాడు
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం గమనించడమే కాక తన ప్రజల పక్షాన దేవుడు నిర్ణయాత్మకంగా జోక్యం చేసుకోవడాన్ని సూచించగలదు. ప్రధాన పాఠ్యం ఆధునిక పాఠకుడికి అర్థమయ్యేలా ఉంది; ‘దర్శిస్తాడు’ అనే సాంప్రదాయ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క సామూహిక సూచన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: హీబ్రూ మూలంలోని కుటుంబ సంబంధ రూపాన్ని నిలుపుతూ, అది ఇశ్రాయేలు సంతానాన్ని సామూహికంగా సూచిస్తుందనే ఉద్వేగాన్ని చెరపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘పట్టించుకుంటాడు’ సహజమైన నేటి వాడుక అయినప్పటికీ, దైవిక జోక్యం అనే విస్తృత భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
