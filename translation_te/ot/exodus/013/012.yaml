id: EXO.13.12
reference: Exodus 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַעֲבַרְתָּ֥ כָל פֶּֽטֶר רֶ֖חֶם לַֽ/יהֹוָ֑ה וְ/כָל פֶּ֣טֶר שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ הַ/זְּכָרִ֖ים לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: te
  text: గర్భాన్ని తొలిగా తెరిచే ప్రతి సంతానాన్ని యాహ్వేకు ప్రత్యేకించాలి[a]; నీకు చెందిన పశువులలో గర్భం నుంచి తొలిగా పుట్టిన మగవన్నీ యాహ్వేవి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘గర్భాన్ని తెరిచే ప్రతి ఒక్కదాన్ని.’ అంటే మొదట పుట్టిన సంతానం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదబంధం పెంపుడు పశువుల గర్భం నుంచి వెలువడే తొలి సంతానాన్ని సూచిస్తుంది; వాటిలో మగవి యాహ్వేకు చెందినవని చివరి పదాలు నిర్దేశిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: ప్రత్యేకించాలి
  rationale: עבר ధాతువు హిఫీల్ రూపంలో అక్షరార్థంగా ‘దాటింపజేయడం/అప్పగించడం’ అనే భావం ఉన్నా, ఈ ఆరాధనా-న్యాయ సందర్భంలో యాహ్వేకు సమర్పణార్థం వేరుచేయడాన్ని సూచిస్తుంది.
- source_word: פֶּטֶר רֶחֶם
  choice: గర్భాన్ని మొదట తెరచే ప్రతి సంతానం
  rationale: ‘గర్భాన్ని తెరచేది’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ, అది తొలి సంతానాన్ని సూచిస్తుందని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: మూలంలోని దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: పశువులలో గర్భం నుంచి మొదట పుట్టినది
  rationale: שֶׁגֶר జంతువుల గర్భసంతానాన్ని సూచిస్తుంది; פֶּטֶרతో కలిసి పశువులలో తొలి జననాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: నీకు చెందిన
  rationale: సంబోధితుని ఆధీనంలో లేదా సొత్తుగా ఉన్న పశువులను సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: הַזְּכָרִים
  choice: మగదంతా
  rationale: హీబ్రూ బహువచనం వర్గార్థకంగా, ముందుగా పేర్కొన్న తొలి పశుసంతానంలో మగవాటిని నిర్దేశిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేదే
  rationale: చివరి పదబంధం యాహ్వేకు చెందినదనే యాజమాన్య-ప్రతిష్ఠిత భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం ఒడంబడిక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని ‘యాహ్వే’గా ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: తొలి సంతానాన్ని యాహ్వేకు అప్పగించే క్రియ స్వరూపం
  choice: ప్రత్యేకించాలి
  alternative: దాటింపజేయాలి / సమర్పించాలి
  rationale: క్రియ యొక్క అక్షరార్థాన్ని యాంత్రికంగా అనువదించకుండా, ఈ ఆరాధనా సందర్భంలోని ప్రతిష్ఠిత సమర్పణ భావాన్ని తెలియజేస్తుంది; ఆ సమర్పణ ఎలా అమలవుతుందో ఈ వాక్యంలో లేనిది జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ-ఆరాధనా గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించాం. ‘గర్భాన్ని తెరచే’ అనే మూల నుడికారాన్ని కొంతవరకు నిలిపి, ‘సంతానం’తో దాని అర్థాన్ని స్పష్టం చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
