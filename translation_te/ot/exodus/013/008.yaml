reference: Exodus 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: te
  text: 'ఆ రోజున నీవు నీ కుమారునికి ఇలా చెప్పాలి: “దీని కారణంగానే నేను ఐగుప్తు నుండి బయలుదేరినప్పుడు యాహ్వే నా కోసం కార్యం చేశాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఐగుప్తు నుండి బయలుదేరినప్పుడు యాహ్వే నా కోసం ఇది చేశాడు.” హెబ్రీలో “ఇది” అనే పదాన్ని ఈ ఆచరణకు గల కారణంతోనైనా, యాహ్వే చేసిన కార్యానికి మరింత నేరుగా అనుసంధానించవచ్చు.
    reason: వాక్యనిర్మాణ సంబంధమైన నిజమైన ద్వంద్వార్థాన్ని నిలుపుట
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: నీవు ... చెప్పాలి
  rationale: נגד ధాతువు హిఫీల్ రూపం ‘తెలియజేయు, చెప్పు’ అనే అర్థాన్ని ఇస్తుంది. తల్లిదండ్రి కుమారునికి వివరించే ఆదేశంగా ‘చెప్పాలి’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְבִנְךָ
  choice: నీ కుమారునితో
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో ‘నీ కుమారునితో చెప్పాలి’ సహజంగా ఉంటుంది. హెబ్రీ ఏకవచన పుంలింగాన్ని ‘కుమారుడు’గా నిలిపాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: కాలసూచక పదబంధంలోని నిర్దిష్ట సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజంగా ‘ఇలా చెప్పాలి’ అని వ్యక్తం చేశాం.
- source_word: בַּעֲבוּר זֶה
  choice: దీని కారణంగానే
  rationale: בַּעֲבוּר యొక్క కారణార్థాన్ని, זֶה యొక్క సూచనార్థాన్ని నిలుపుతుంది; ‘-నే’ వాక్యంలోని ఉద్ఘాటనను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עָשָׂה יְהוָה לִי
  choice: యాహ్వే నా కోసం చేసినది
  rationale: עָשָׂה విస్తృతార్థకమైన ‘చేయు’ అనే క్రియ. హెబ్రీలో ప్రత్యక్ష కర్మ స్పష్టంగా లేకపోవడంతో ‘చేసినది’ దానిని అనవసరంగా నిర్దిష్టం చేయకుండా, לִי ని ‘నా కోసం’గా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: నేను ఐగుప్తు నుండి బయలుదేరి వచ్చినప్పుడు
  rationale: בְּ + క్రియానామ నిర్మాణంలోని కాలార్థాన్ని, మొదటి పురుష ఏకవచన దృక్కోణాన్ని నిలుపుతుంది. ‘బయలుదేరి వచ్చినప్పుడు’ నిర్గమన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: בֵּן అనే పుంలింగ బంధుత్వ పదం
  choice: నీ కుమారుడు
  alternative: నీ బిడ్డ
  rationale: మూల హెబ్రీ ఏకవచన పుంలింగాన్ని యథార్థంగా నిలిపాం; సందర్భం లింగతటస్థీకరణను కోరదు.
- issue: בַּעֲבוּר זֶה వాక్యనిర్మాణంలోని అనిశ్చితి
  choice: ‘దీని కారణంగానే’ను ఆచరణ/ఆచారానికి కారణంగా అనుసంధానించడం
  alternative: ‘యాహ్వే నా కోసం ఇది చేశాడు’ అని זֶהను యాహ్వే చేసిన కార్యానికి ప్రత్యక్ష కర్మగా అనుసంధానించడం
  rationale: హెబ్రీ పదక్రమం రెండు అనుసంధానాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠం కారణార్థాన్ని ముందుకు తెస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘యాహ్వే’ వ్యక్తిగత దైవనామంగా నిలుపబడింది; మూలంలోని మొదటి పురుష అనుభవాత్మక స్వరం మరియు కారణార్థక అస్పష్టత సంరక్షించబడ్డాయి.
