  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: te
  text: కాబట్టి దేవుడు ప్రజలను చుట్టుదారిన అరణ్యమార్గం గుండా రెల్లుల సముద్రం[a] వైపు నడిపించాడు. ఇశ్రాయేలు కుమారులు యుద్ధానికి సన్నద్ధులై[b] ఐగుప్తు దేశం నుండి పైకి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎర్ర సముద్రం.” హెబ్రీ పేరు అక్షరార్థంగా “రెల్లుల సముద్రం.”
    reason: alternative_reading
  - marker: b
    text: ఇక్కడి హెబ్రీ పదం అర్థం అనిశ్చితం; “ఆయుధాలు ధరించి,” “యుద్ధవ్యవస్థలో,” లేదా మరింత సాధారణంగా “క్రమబద్ధమైన వరుసల్లో” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: చుట్టుదారిలో నడిపించాడు
  rationale: హిఫిల్ రూపం దేవుడు ప్రజలను నేరుగా కాకుండా చుట్టుమార్గంలో తీసుకెళ్లాడనే భావాన్ని, ఆయన క్రియాశీల పాత్రతో సహా తెలియజేస్తుంది.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: అరణ్యమార్గంగా
  rationale: דֶּרֶךְ సూచించే మార్గం లేదా ప్రయాణపథం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יַם סוּף
  choice: రెల్లుసముద్రం
  rationale: సాంప్రదాయికమైన ‘ఎర్ర సముద్రం’ కంటే హెబ్రీ పదబంధపు ప్రత్యక్ష అర్థాన్ని అనుసరిస్తుంది.
- source_word: וַחֲמֻשִׁים
  choice: యుద్ధానికి సన్నద్ధులై
  rationale: ఈ అనిశ్చిత పదానికి యుద్ధసన్నద్ధత లేదా క్రమబద్ధమైన దళరూపం అనే సంభావ్య భావం ఉంది; ప్రధాన పాఠంలో సహజంగా వ్యక్తపరచి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: עָלוּ
  choice: బయలుదేరారు
  rationale: ఇక్కడ עלה ఐగుప్తు నుండి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; తెలుగు కథనంలో ‘పైకి వెళ్లారు’ కంటే ‘బయలుదేరారు’ సహజంగా ఉంటుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీలోని పుంలింగ బహువచన నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని విభక్తి సంబంధాన్ని, ‘దేశం’ అనే నామవాచకాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יַם סוּף అనువాదం
  choice: రెల్లుసముద్రం
  alternative: ఎర్ర సముద్రం
  rationale: మూలభాషకు ప్రాధాన్యమిస్తూ పదబంధపు ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, సుపరిచితమైన సంప్రదాయ నామాన్ని పాదసూచికలో ఇచ్చాం.
- issue: בְנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది.
- issue: וַחֲמֻשִׁים లోని అనిశ్చితి
  choice: యుద్ధానికి సన్నద్ధులై
  alternative: ఆయుధాలు ధరించి / యుద్ధవ్యవస్థలో / క్రమబద్ధమైన వరుసల్లో
  rationale: పదం వివాదాస్పదమైనందున ఒకే సైనిక అర్థాన్ని నిర్బంధంగా స్థిరపరచకుండా, ప్రధాన సంభావ్య భావాన్ని పాఠంలోను ఇతర అవకాశాలను పాదసూచికలోను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘చుట్టుదారిలో’ మూలంలోని పరోక్ష మార్గభావాన్ని స్పష్టంగా చేస్తుంది. రెండు పాదసూచిక గుర్తులూ సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
