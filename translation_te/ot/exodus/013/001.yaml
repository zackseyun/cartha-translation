  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం; ఉచ్చారణ పునర్నిర్మాణంలోని అనిశ్చితిని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష వాక్యం తరువాత వస్తుందని చూపేందుకు వాక్యాంతంలో ద్విబిందువు వాడబడింది.
