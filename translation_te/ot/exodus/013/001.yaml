lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సందర్భంలో ‘చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֶל־מֹשֶׁה
  choice: మోషేతో
  rationale: దేవుడు మోషేను ఉద్దేశించి మాట్లాడాడనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పాడు:'
  rationale: ఈ హీబ్రూ క్రియారూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా’తో పాటు ద్విబిందువు వాడటం ఆ సూత్రాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
