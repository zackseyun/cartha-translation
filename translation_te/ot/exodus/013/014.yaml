id: EXO.13.14
reference: Exodus 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: te
  text: 'రాబోయే కాలంలో నీ కుమారుడు, ‘ఇది ఏమిటి?’ అని నిన్ను అడిగినప్పుడు, నీవు అతనితో ఇలా చెప్పాలి: ‘యెహోవా చేతి బలంతో దాసుల గృహమైన ఐగుప్తు నుండి మనలను బయటకు తీసుకొచ్చాడు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: రాబోయే కాలంలో
  rationale: ఇక్కడ అక్షరార్థమైన ‘రేపు’ కంటే భవిష్యత్తులోని సమయాన్ని సూచిస్తుంది; కుమారుడు తరువాతి కాలంలో ప్రశ్నించే సందర్భానికి సహజమైన తెలుగు.
- source_word: בְּחֹזֶק יָד
  choice: తన బలమైన చేతితో
  rationale: ‘చేతి బలంతో’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, దేవుని శక్తివంతమైన కార్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా పేరుగా సూచిస్తుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: దాసుల గృహమైన
  rationale: ‘దాసుల గృహం’ అనే మూలభాషా రూపకాన్ని నిలుపుతుంది; ఐగుప్తును దాసత్వ స్థలంగా గుర్తిస్తుంది.
theological_decisions:
- issue: నిర్గమన కార్యంలో కర్త
  choice: యెహోవా తన బలమైన చేతితో ... మనలను బయటకు తీసుకొచ్చాడు
  alternative: మన పూర్వులను బయటకు తీసుకొచ్చాడు
  rationale: మూలంలోని మొదటి పురుష బహువచన ప్రత్యయం ‘మనలను’ తరతరాల సమాజాన్ని నిర్గమన సంఘటనలో భాగస్వాములుగా పలుకుతుంది; దానిని చారిత్రక పూర్వీకులకే పరిమితం చేయలేదు.
- issue: దైవనామ ప్రతిపాదన
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని יהוה అనే ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పారదర్శకంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ బోధనా సందర్భానికి సహజంగా ఉండేలా, అయితే ‘బలమైన చెయ్యి’ మరియు ‘దాసుల గృహం’ అనే మూల రూపకాలను గౌరవిస్తూ గంభీరమైన శైలిలో అనువదించబడింది.
