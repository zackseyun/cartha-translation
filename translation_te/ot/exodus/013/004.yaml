  text: Today you are going out[a], in the month of Abib.
translation:
  language: te
  text: ఈ రోజు మీరు ఆబీబు[a] నెలలో బయలుదేరుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆబీబు అనేది ఈ నెల పేరు; ఈ పదం వసంతకాలంలో ధాన్యం పక్వానికి వచ్చే దశతో సంబంధం కలిగి ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న ఈ నామవాచకం ఇక్కడ క్రియావిశేషణంగా పనిచేసి నిర్గమన సంఘటన జరుగుతున్న ప్రస్తుత దినాన్ని సూచిస్తుంది; ‘ఈ రోజు’ ఆధునిక తెలుగులో సహజంగా ఉండి సంబోధనలోని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: אַתֶּם
  choice: మీరు
  rationale: ఇది ఇశ్రాయేలీయులను ఉద్దేశించిన ద్వితీయ పురుష బహువచన సర్వనామం; గౌరవార్థ ఏకవచనంగా కూడా వినిపించగలిగినా, సందర్భం దీని బహువచనార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: יֹצְאִים
  choice: బయలుదేరుతున్నారు
  rationale: יצא ధాతువు యొక్క కాల్ బహువచన కృదంత రూపం సందర్భంలో కొనసాగుతున్న లేదా తక్షణమే జరుగబోయే బయలుదేరడాన్ని తెలియజేస్తుంది. ఈ రూపం ఆ క్రియాత్మక తక్షణత్వాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּחֹדֶשׁ
  choice: నెలలో
  rationale: ב ఉపసర్గతో కూడిన ‘నెల’ అనే పదం సంఘటన జరిగే కాలాన్ని సూచిస్తుంది; తెలుగులో ‘నెలలో’ సహజమైన సమానార్థక రూపం.
- source_word: הָאָבִיב
  choice: ఆబీబు
  rationale: దీనిని వివరణాత్మకంగా ‘వసంతకాలం’ లేదా ‘పక్వమవుతున్న వెన్నుల నెల’ అని మార్చకుండా, నెలకు సంబంధించిన సంప్రదాయ తెలుగు లిప్యంతరీకరణగా ఉంచాం; పదానికి సంబంధించిన వ్యవసాయ నేపథ్యాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణాన్ని వాడాం. మూలంలోని కృదంత క్రియాభావాన్ని ‘బయలుదేరుతున్నారు’తో నిలిపి, సాంస్కృతిక వివరణను ప్రధాన వాక్యంలో కలపకుండా పాదసూచికలో ఉంచాం.
