id: EXO.13.6
reference: Exodus 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: te
  text: ఏడు రోజులపాటు నీవు పులియని రొట్టెలు తినాలి; ఏడవ రోజున యెహోవాకు పండుగ ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులు
  rationale: ఈ నిర్మాణ పదబంధం కాలవ్యవధిని సూచిస్తుంది. తెలుగులో ‘ఏడు రోజులు’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: תֹּאכַל
  choice: మీరు ... తినాలి
  rationale: న్యాయ/ఆదేశ సందర్భంలోని Qal imperfect 2ms ఆదేశార్థాన్ని కలిగి ఉంది. సందర్భంలో ఏకవచనం సమూహాన్ని ఉద్దేశించి ఉండగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ‘మీరు ... తినాలి’ సహజంగా ఉంటుంది.
- source_word: מַצֹּת
  choice: పులియని రొట్టెలు
  rationale: పస్కా–పండుగ సందర్భంలో ఇది పులియబెట్టని రొట్టెలను సూచిస్తుంది; ఈ రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: వావ్ సాధారణ అనుసంధానాన్ని, తరువాతి పదబంధం కాలాన్ని సూచిస్తాయి. తెలుగు విరామచిహ్నం ద్వారా అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: חַג
  choice: పండుగ
  rationale: ఈ పదం ఆరాధనాత్మకమైన ఉత్సవం/పండుగను సూచిస్తుంది. ‘పండుగ’ ఆధునిక తెలుగులో సహజమైనది, విస్తృతంగా అర్థమయ్యేది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అంకితం లేదా సంబంధాన్ని సూచిస్తుంది. ‘యెహోవాకు’ పండుగ దేవునికి ఉద్దేశించబడిందనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: חַג అనే నామవాచక వాక్య భాగంలోని క్రియార్థం
  choice: పండుగ జరగాలి
  alternative: పండుగ
  rationale: హీబ్రూలో ప్రత్యక్ష క్రియ లేకుండా ‘ఏడవ రోజున యెహోవాకు పండుగ’ అని ఉంది. తెలుగులో వాక్యాన్ని సహజంగా చేయడానికి ‘జరగాలి’ చేర్చబడింది; ఇది ఆదేశ సందర్భాన్ని వ్యక్తం చేస్తుంది, అయితే ఎవరు నిర్వహించాలనే అంశాన్ని అదనంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఆదేశాత్మకమైన ధర్మశాస్త్ర స్వరాన్ని నిలుపుతూ గౌరవప్రదంగా రూపొందించబడింది. హీబ్రూ ఏకవచన సంబోధనకు తెలుగులో సహజమైన గౌరవ/సామూహిక ‘మీరు’ వాడబడింది.
