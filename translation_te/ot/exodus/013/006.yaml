revisions:
- from: ఏడు రోజులు మీరు పులియని రొట్టెలు తినాలి; ఏడవ రోజున యెహోవాకు పండుగ జరగాలి.
  to: ఏడు రోజులపాటు నీవు పులియని రొట్టెలు తినాలి; ఏడవ రోజున యెహోవాకు పండుగ ఉంటుంది.
  rationale: The revision restores the Hebrew singular addressee and uses a natural Telugu future/existential expression for the Hebrew nominal festival clause. It retains the directive force of the first clause, the sequence marked by waw through punctuation, and the divine name.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:16:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the duration, unleavened bread, and the festival directed to YHWH. However, the Hebrew verb is second-person masculine singular; replacing it with plural respectful ‘మీరు’ weakens that formal correspondence unnecessarily. The final Hebrew clause is verbless (‘a feast to YHWH’); ‘పండుగ ఉంటుంది’ conveys its calendrical/future sense without adding the stronger modal/eventive nuance of ‘జరగాలి.’
  naturalness: ‘ఏడు రోజులపాటు నీవు పులియని రొట్టెలు తినాలి’ is clear, idiomatic modern standard Telugu in an instructional register. ‘ఏడవ రోజున యెహోవాకు పండుగ ఉంటుంది’ is natural Telugu and retains the concise nominal character of the Hebrew.
  terminology: ‘పులియని రొట్టెలు’ suitably renders מַצּוֹת. ‘పండుగ’ is an appropriate modern equivalent for חַג. ‘యెహోవా’ preserves the divine name and is established Telugu biblical usage; no footnote is required here.
  issues:
  - severity: medium
    issue: Second-person number is changed from singular to plural.
    rationale: תֹּאכַל is 2ms. Telugu can naturally retain this with ‘నీవు’; the plural honorific is not demanded by the source or register.
  - severity: low
    issue: ‘పండుగ జరగాలి’ adds a modal/eventive formulation to a verbless Hebrew clause.
    rationale: The Hebrew states ‘on the seventh day, a feast to YHWH.’ ‘పండుగ ఉంటుంది’ more closely represents the clause while remaining idiomatic.
  revised_text: ఏడు రోజులపాటు నీవు పులియని రొట్టెలు తినాలి; ఏడవ రోజున యెహోవాకు పండుగ ఉంటుంది.
  revised_footnotes: []
  revision_rationale: The revision restores the Hebrew singular addressee and uses a natural Telugu future/existential expression for the Hebrew nominal festival clause. It retains the directive force of the first clause, the sequence marked by waw through punctuation, and the divine name.
