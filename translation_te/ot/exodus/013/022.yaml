  text: לֹֽא יָמִ֞ישׁ עַמּ֤וּד הֶֽ/עָנָן֙ יוֹמָ֔ם וְ/עַמּ֥וּד הָ/אֵ֖שׁ לָ֑יְלָה לִ/פְנֵ֖י הָ/עָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: te
  text: పగటివేళ మేఘస్తంభం, రాత్రివేళ అగ్నిస్తంభం ప్రజల ముందు నుండి తొలగిపోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజల ముందు నుండి దూరంగా వెళ్లలేదు.’ మార్గదర్శక స్తంభాలు నిరంతరం అక్కడే ఉన్నాయని హెబ్రీ క్రియ నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: తొలగిపోలేదు
  rationale: מוּשׁ ధాతువు ఒక స్థానం నుండి తొలగడం లేదా దూరంగా వెళ్లడం అనే భావాన్ని ఇస్తుంది. ప్రతికూల రూపం ఈ మార్గదర్శక స్తంభాలు నిరంతరం ప్రజల ముందు ఉన్నాయని తెలియజేస్తుంది.
- source_word: עַמּוּד
  choice: స్తంభం
  rationale: నిలువుగా కనిపించే దైవిక ప్రత్యక్షతను సూచించే సహజమైన, సంప్రదాయబద్ధమైన తెలుగు పదం.
- source_word: הֶעָנָן
  choice: మేఘం
  rationale: עָנָןకు నేరమైన సమానార్థకం; సమాసంలో ‘మేఘస్తంభం’ సహజంగా ఉంటుంది.
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: పగటి కాలాన్ని సూచించే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘రాత్రివేళ’తో సమాంతరతను నిలుపుతుంది.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: అగ్నిస్తంభం
  rationale: మేఘస్తంభంతో ఉన్న హెబ్రీ సమాంతర నిర్మాణాన్ని, అగ్ని అనే స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రి కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగం; ‘పగటివేళ’తో సమతూకంగా ఉంటుంది.
- source_word: לִפְנֵי
  choice: ముందు నుండి
  rationale: ప్రజలకు ముందున్న స్థానం నుండి దూరమవడం అనే ప్రాదేశిక సంబంధాన్ని יָמִישׁతో కలిసి స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచించే నిర్దిష్ట ఏకవచన సమూహనామానికి సహజమైన తెలుగు రూపం.
