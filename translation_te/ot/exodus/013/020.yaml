translation:
  language: te
  text: వారు సుక్కోతు నుండి బయలుదేరి, అరణ్యపు అంచున ఉన్న ఏతాము వద్ద మకాం వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరి
  rationale: נסע క్రియ ఇక్కడ మకాం ఎత్తి తదుపరి ప్రయాణం ప్రారంభించడాన్ని సూచిస్తుంది; ‘బయలుదేరి’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִסֻּכֹּת
  choice: సుక్కోతు నుండి
  rationale: מִן ఉపసర్గ మూలస్థానాన్ని సూచిస్తుంది; స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: וַיַּחֲנוּ
  choice: మకాం వేశారు
  rationale: חנה అంటే ఒక ప్రదేశంలో శిబిరం వేసి నిలవడం; ప్రయాణ వర్ణనలో ‘మకాం వేశారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְאֵתָם
  choice: ఏతాములో
  rationale: בְ ఉపసర్గ స్థానార్థకమైనది; ఇక్కడ వారు మకాం వేసిన ప్రదేశాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: בִּקְצֵה
  choice: అంచున
  rationale: קָצֶה ఒక ప్రాంతపు చివర, అంచు లేదా సరిహద్దును సూచిస్తుంది; ఈ భౌగోళిక సందర్భంలో ‘అంచున’ సరైన సమానార్థకం.
- source_word: הַמִּדְבָּר
  choice: అరణ్యపు
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారినే కాక జనావాసం తక్కువైన బంజరు లేదా అడవి ప్రాంతాన్ని కూడా సూచిస్తుంది; ‘అరణ్యం’ ఆ విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, ప్రయాణ వర్ణనకు తగిన గంభీరమైన సహజ శైలిని ఉపయోగించాం. హెబ్రీ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ఏతాము అరణ్యపు అంచున ఉందనే సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
