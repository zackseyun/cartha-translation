id: EXO.13.3
reference: Exodus 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: te
  text: 'అప్పుడు మోషే ప్రజలతో ఇలా అన్నాడు: “మీరు ఐగుప్తులోనుండి, బానిసల గృహంలోనుండి బయటకు వచ్చిన ఈ రోజును జ్ఞాపకం ఉంచుకోండి. ఎందుకంటే యాహ్వే తన బలమైన చేతితో మిమ్మల్ని అక్కడి నుండి బయటకు రప్పించాడు. పులిసినది ఏదీ తినకూడదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పులిసిన రొట్టె తినకూడదు.” హీబ్రూ పదం పులిసిన పదార్థాన్ని లేదా పులిసిన ఆహారాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: జ్ఞాపకం ఉంచుకోండి
  rationale: ఏకవచన ఆజ్ఞారూపం ప్రజలను సమూహంగా ఉద్దేశిస్తుంది. ఆధునిక తెలుగులో గౌరవ/బహువచన రూపం సహజంగా ఉండి, స్మారకంగా గుర్తుంచుకోవాలనే భావాన్ని నిలుపుతుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: నిర్దిష్ట నామవాచకంతో సూచనాత్మక పదం కలిసిన రూపాన్ని సహజంగా, ప్రత్యక్షంగా అందిస్తుంది.
- source_word: יְצָאתֶם
  choice: మీరు ... బయటకు వచ్చిన
  rationale: יצא యొక్క ప్రాథమిక నిష్క్రమణ భావాన్ని, ఐగుప్తు నుండి బయలుదేరిన సందర్భాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִבֵּית עֲבָדִים
  choice: బానిసల గృహంలోనుండి
  rationale: హీబ్రూ పదబంధంలోని సాక్షాత్ రూపకాన్ని, עֲבָדִים అనే బహువచన నామవాచకాన్ని నిలుపుతుంది; ఇది ఐగుప్తును బానిసత్వ స్థలంగా సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ రోజును జ్ఞాపకం ఉంచుకోవాలనే ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בְּחֹזֶק יָד
  choice: తన బలమైన చేతితో
  rationale: దేవుని శక్తిమంతమైన కార్యాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘బలం’ మరియు ‘చేయి’ రూపకాలను నిలుపుతుంది. తెలుగులో సంబంధాన్ని స్పష్టం చేయడానికి ‘తన’ చేర్చబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే దైవనామ రూపంతో అందిస్తుంది.
- source_word: הוֹצִיא
  choice: బయటకు రప్పించాడు
  rationale: 'יצא యొక్క హిఫీల్ కారణార్థక రూపాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది: దేవుడు వారిని బయటకు వచ్చేలా చేశాడు.'
- source_word: מִזֶּה
  choice: అక్కడి నుండి
  rationale: ముందు ప్రస్తావించిన ఐగుప్తు/బానిసల గృహాన్ని తిరిగి సూచించే అన్వయార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: పులిసినది ఏదీ తినకూడదు
  rationale: חָמֵץ యొక్క విస్తృతమైన ‘పులిసిన పదార్థం’ భావాన్ని కేవలం రొట్టెకే పరిమితం చేయదు; హీబ్రూ నిష్క్రియ నిషేధాన్ని తెలుగులో సహజమైన సాధారణ నిషేధంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఉచ్చారణపై చారిత్రక అనిశ్చితి ఉన్నప్పటికీ, ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: עֲבָדִים యొక్క అర్థం
  choice: బానిసలు
  alternative: సేవకులు
  rationale: ఈ నిర్గమ సందర్భం నిజమైన బానిసత్వాన్ని సూచిస్తుంది; ‘సేవకులు’ అని అనడం ఆ స్థితి తీవ్రతను తగ్గించవచ్చు.
- issue: חָמֵץ యొక్క పరిధి
  choice: పులిసినది ఏదీ
  alternative: పులిసిన రొట్టె
  rationale: మూలపదం పులిసిన పదార్థాన్ని విస్తృతంగా సూచించగలదు. అందువల్ల దానిని రొట్టెకు మాత్రమే పరిమితం చేయకుండా మూలంలోని పరిధిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రజలను సమూహంగా ఉద్దేశించిన ఆజ్ఞకు గౌరవ/బహువచన క్రియారూపం వాడబడింది. హీబ్రూ వాక్యంలోని కారణ సంబంధం, బలమైన చేయి అనే రూపకం, బానిసల గృహం అనే దృశ్యరూపం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
