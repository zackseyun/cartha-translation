review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the collective imperative, the exodus from Egypt and the idiomatic ‘house of slaves,’ the causal clause, the powerful-hand idiom, and the broad prohibition on leavened matter. ‘పులిసినది ఏదీ’ appropriately retains the scope of חָמֵץ rather than narrowing it to bread. The possessive ‘తన’ in ‘తన బలమైన చేతితో’ is a natural Telugu clarification whose referent is Yahweh.
  naturalness: The Telugu is clear, modern, and suitably elevated. ‘జ్ఞాపకం ఉంచుకోండి’ and ‘బయటకు రప్పించాడు’ are natural in this context. The sentence flow and the anchored footnote are sound.
  terminology: ‘బానిసల గృహం’ preserves the concrete Hebrew expression and does not soften enslavement. The divine name should be aligned with the project’s stated rendering of יהוה as Yahweh; in Telugu this is best represented here as ‘యాహ్వే,’ rather than the traditional ‘యెహోవా.’
  issues:
  - severity: medium
    issue: The divine name is rendered ‘యెహోవా.’
    rationale: The source has יהוה, and the English POB audit trail explicitly establishes the project rendering ‘Yahweh.’ ‘యెహోవా’ reflects a later traditional vocalization rather than that selected form. Rendering it ‘యాహ్వే’ preserves the specified personal name without substituting a title.
