- from: యెహోవా[a] పగటివేళ మేఘస్తంభంలో వారి ముందుగా సాగుతూ దారిలో వారిని నడిపించాడు; రాత్రివేళ అగ్నిస్తంభంలో వారికి వెలుగు ఇచ్చాడు. దాంతో వారు పగలూ రాత్రీ ప్రయాణించగలిగారు.
