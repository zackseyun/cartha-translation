id: EXO.13.21
reference: Exodus 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: te
  text: యాహ్వే[a] పగటివేళ మేఘస్తంభంలో వారి ముందు సాగుతూ వారిని దారిలో నడిపించేవాడు; రాత్రివేళ అగ్నిస్తంభంలో వారికి వెలుగు ఇస్తూ ఉండేవాడు, తద్వారా వారు పగలూ రాత్రీ ప్రయాణించగలిగేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (యెహోవా అనే రూపంలో కూడా లిప్యంతరీకరించబడుతుంది).'
    reason: దైవనామానికి పాదటిప్పణి-ఆధారాన్ని నిలుపుతూ, హీబ్రూ రూపాన్ని మరియు తెలుగు పాఠకులకు పరిచితమైన ప్రత్యామ్నాయ లిప్యంతరీకరణను తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: వారి ముందుగా సాగుతూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను, అలాగే לִפְנֵיהֶםలోని స్థలార్థాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: יוֹמָם ... וְלַיְלָה
  choice: పగటివేళ ... రాత్రివేళ
  rationale: హీబ్రూ కాలసూచక సమాంతర నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: בְּעַמּוּד עָנָן
  choice: మేఘస్తంభంలో
  rationale: בְּను ‘లో’గా అనువదించడం ద్వారా యెహోవా ఆ కనిపించే రూపంలో ముందుకు సాగుతున్న చిత్రాన్ని నిలిపాం.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: దారిలో వారిని నడిపించాడు
  rationale: נחה యొక్క నడిపించడం/మార్గనిర్దేశం చేయడం అనే భావాన్ని, הַדֶּרֶךְతో సహజంగా కలిపాం.
- source_word: בְּעַמּוּד אֵשׁ
  choice: అగ్నిస్తంభంలో
  rationale: ముందటి ‘మేఘస్తంభంలో’ అన్న నిర్మాణానికి సమాంతరంగా హీబ్రూ దృశ్యరూపాన్ని కాపాడుతుంది.
- source_word: לְהָאִיר לָהֶם
  choice: వారికి వెలుగు ఇచ్చాడు
  rationale: אור హిఫీల్ రూపంలోని ‘వెలుగు కలిగించడం/ఇవ్వడం’ అనే ప్రయోజనార్థాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: దాంతో వారు పగలూ రాత్రీ ప్రయాణించగలిగారు
  rationale: సందర్భంలో לָלֶכֶת ప్రయాణాన్ని సూచిస్తుంది; వెలుగు ఇవ్వడంలోని ప్రయోజనాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ఉంచాం. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠంలో ఇచ్చి, ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని వాడాం. మేఘస్తంభం–అగ్నిస్తంభం సమాంతరతను, కొనసాగుతున్న దైవిక నడిపింపును నిలిపాం.
