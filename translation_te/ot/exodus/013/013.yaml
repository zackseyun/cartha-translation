- from: గాడిదకు పుట్టిన ప్రతి తొలిచూలు పిల్లను ఒక గొర్రెపిల్లతో విమోచించాలి.[a] దాన్ని విమోచించకపోతే, దాని మెడ విరగ్గొట్టాలి. నీ కుమారులలో ప్రతి తొలిచూలు కుమారుణ్ణి విమోచించాలి.
