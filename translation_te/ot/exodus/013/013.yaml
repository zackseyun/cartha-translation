  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל פֶּ֤טֶר חֲמֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ וְ/כֹ֨ל בְּכ֥וֹר אָדָ֛ם בְּ/בָנֶ֖י/ךָ תִּפְדֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: te
  text: ప్రతి తొలిచూలు గాడిదపిల్లను ఒక గొర్రెపిల్లతో విమోచించాలి.[a] దాన్ని విమోచించకపోతే, దాని మెడ విరగ్గొట్టాలి. నీ కుమారులలోని ప్రతి తొలిచూలు సంతానాన్ని విమోచించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ שֶׂה అనే పదం గొర్రె లేదా మేక వంటి చిన్న పశువుల మందలోని ఒక జంతువును సూచించగల విస్తృత పదం; ఇక్కడ సందర్భానుసారంగా ‘గొర్రెపిల్ల’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: గాడిదకు పుట్టిన ప్రతి తొలిచూలు పిల్ల
  rationale: פֶּטֶר అక్షరార్థంగా గర్భాన్ని మొదట తెరిచేదాన్ని సూచిస్తుంది. ఈ ధర్మశాస్త్ర సందర్భంలో ‘తొలిచూలు పిల్ల’ సహజంగా ఉండి, మొదట పుట్టిన సంతానం అనే భావాన్ని నిలుపుతుంది.
- source_word: תִּפְדֶּה
  choice: విమోచించాలి
  rationale: פדה ప్రత్యామ్నాయ బలి లేదా వెల చెల్లింపు ద్వారా విడిపించడాన్ని సూచిస్తుంది. ‘విమోచించాలి’ న్యాయపరమైన, ఆరాధనాపరమైన భావాన్ని నిలుపుతుంది.
- source_word: בְשֶׂה
  choice: ఒక గొర్రెపిల్లతో
  rationale: שֶׂה చిన్న పశువుల మందలోని గొర్రె లేదా మేకను విస్తృతంగా సూచించగలదు. ప్రధాన పాఠ్యంలో సందర్భానుకూలమైన ‘గొర్రెపిల్ల’ను వాడి, మూలపదపు విస్తృతిని పాదసూచికలో తెలిపాం.
- source_word: וַעֲרַפְתּוֹ
  choice: దాని మెడ విరగ్గొట్టాలి
  rationale: ערף సాధారణంగా వధించడం కాకుండా మెడ వెనుక భాగాన్ని విరిచే చర్యను సూచిస్తుంది. ఈ ప్రత్యేకతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּכוֹר אָדָם
  choice: తొలిచూలు కుమారుడు
  rationale: אָדָם ఇక్కడ జంతువుకు భిన్నంగా మానవుణ్ణి సూచిస్తుంది; అయితే వెంటనే ఉన్న בְּבָנֶיךָ ‘నీ కుమారులలో’ అని స్పష్టపరుస్తుంది. అందువల్ల తెలుగులో పునరుక్తి లేకుండా సందర్భంలోని మగ తొలిసంతానాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּבָנֶיךָ
  choice: నీ కుమారులలో
  rationale: హీబ్రూ పదం లింగనిరపేక్షమైన ‘పిల్లలు’ కాకుండా స్పష్టంగా ‘కుమారులు’ అని చెబుతుంది; దానిని యథాతథంగా నిలిపాం.
theological_decisions:
- issue: אָדָם అనే పదంలోని మానవ వర్గార్థం మరియు בְּבָנֶיךָలోని పురుష లింగ నిర్దిష్టత
  choice: ‘నీ కుమారులలో ప్రతి తొలిచూలు కుమారుణ్ణి’
  alternative: ‘నీ పిల్లలలో ప్రతి తొలిచూలు మనిషిని’ లేదా ‘మనుష్యుని ప్రతి తొలిచూలును’
  rationale: אָדָם జంతువుతో మానవుణ్ణి వ్యత్యాసపరుస్తుంది; בְּבָנֶיךָ మాత్రం ‘నీ కుమారులు’ అని నిర్దిష్టంగా చెబుతుంది. అనువాదం ఈ రెండవ పదంలోని పురుష లింగ సూచనను నిలుపుతూ, తెలుగులో అసహజమైన వర్గపద పునరుక్తిని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ధర్మశాస్త్ర ఆజ్ఞకు తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. విధ్యర్థక భావానికి ‘విమోచించాలి’ రూపాన్ని ఎంచుకున్నాం; ‘తొలిచూలు’ బైబిల్ సందర్భంలో పరిచితమైనదిగా ఉండి మూలంలోని మొదట గర్భం తెరిచే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
