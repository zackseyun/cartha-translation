  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: te
  text: ఇది నీ చేతిమీద ఒక సూచనగా, నీ కళ్ల మధ్య జ్ఞాపకచిహ్నంగా[a] ఉండాలి. తద్వారా యెహోవా ధర్మశాస్త్రం[b] నీ నోట ఉండాలి; ఎందుకంటే యెహోవా బలమైన చేతితో[c] నిన్ను ఐగుప్తులోనుండి బయటకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ కళ్ల మధ్య’ అనే హీబ్రూ మాటను ‘నీ నుదుటిమీద’ అనే నుడికారార్థంలో కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠ్యంలో మూలంలోని ప్రత్యక్ష మాటనే ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెహోవా ఉపదేశం.’ హీబ్రూ తోరా అనే పదానికి సందర్భాన్ని బట్టి ‘ధర్మశాస్త్రం’ లేదా ‘ఉపదేశం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: సాంప్రదాయ అనువాదాల్లో ‘శక్తిమంతమైన చేతితో’ లేదా ‘మహా బలముగల చేతితో’ అని కూడా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: ఈ ఆదేశ సందర్భంలో సంయోజకంతో కూడిన సంపూర్ణ క్రియ భవిష్యత్ లేదా విధ్యర్థక భావాన్ని ఇస్తుంది. తెలుగు ఆదేశ శైలిలో ‘ఉండాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לְאוֹת
  choice: సూచనగా
  rationale: אוֹת అనేది సూచన, గుర్తు, చిహ్నం అనే విస్తృత అర్థాలను కలిగి ఉంది. ఇక్కడ అది కేవలం భౌతిక ముద్ర అని నిర్ణయించకుండా ‘సూచన’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: עַל יָדְךָ
  choice: నీ చేతిమీద
  rationale: יָד యొక్క ప్రత్యక్ష అర్థమైన ‘చేయి’ని నిలుపుతూ, తరువాతి ఆచారాన్ని ముందుగానే పాఠ్యంలోకి చేర్చకుండా ఉంచుతుంది.
- source_word: וּלְזִכָּרוֹן
  choice: జ్ఞాపకచిహ్నంగా
  rationale: זִכָּרוֹן జ్ఞాపకం కలిగించే స్మారక సూచనను తెలియజేస్తుంది. ‘జ్ఞాపకచిహ్నం’ తెలుగు పాఠకునికి స్పష్టంగా ఉండి, దాని స్మారక బరువును నిలుపుతుంది.
- source_word: בֵּין עֵינֶיךָ
  choice: నీ కళ్ల మధ్య
  rationale: హీబ్రూ పదబంధాన్ని ప్రత్యక్షంగా అనువదించడం ద్వారా అది నుదుటిని సూచించే నుడికారమా లేక ఉద్దేశపూర్వకమైన దృశ్యరూపకమా అనే వ్యాఖ్యాన స్వేచ్ఛ నిలుస్తుంది.
- source_word: לְמַעַן
  choice: తద్వారా
  rationale: ఈ పదం ఉద్దేశాన్ని పరిచయం చేస్తుంది. ‘తద్వారా’ ముందున్న జ్ఞాపకచిహ్నానికి తరువాతి ఉద్దేశంతో సహజమైన సంబంధాన్ని చూపుతుంది.
- source_word: תּוֹרַת יְהוָה
  choice: యెహోవా ధర్మశాస్త్రం
  rationale: תּוֹרָהకు ధర్మశాస్త్రం, ఉపదేశం అనే రెండూ సాధ్యమైన అర్థాలు. నిర్గమకాండంలోని నిబంధన సందర్భంలో ‘ధర్మశాస్త్రం’ ప్రధాన పాఠ్యానికి తగిన గంభీరతను ఇస్తుంది; విస్తృతమైన ‘ఉపదేశం’ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּפִיךָ
  choice: నీ నోట
  rationale: మూలంలోని ప్రత్యక్ష దృశ్యాన్ని నిలుపుతుంది; అది పలకడం, పఠించడం లేదా ఎల్లప్పుడూ చెప్పడానికి సిద్ధంగా ఉంచుకోవడం వంటి భావాలకు తెరచి ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉద్దేశానికి ఆధారమైన కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בְּיָד חֲזָקָה
  choice: బలమైన చేతితో
  rationale: חֲזָקָה యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, యెహోవా శక్తివంతమైన విమోచన కార్యాన్ని తెలిపే నిర్గమకాండ నుడికారాన్ని కాపాడుతుంది.
- source_word: הוֹצִאֲךָ
  choice: నిన్ను బయటకు తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ‘బయటకు తీసుకురావడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ఇది సహజమైన రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా అందించాం.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తులోనుండి
  rationale: మִצְרַיִםకు తెలుగులో స్థిరపడిన బైబిలు భౌగోళిక నామమైన ‘ఐగుప్తు’ను ఉపయోగించాం.
theological_decisions:
- issue: చేయి మరియు కళ్ల మధ్య అనే భాషను ప్రత్యక్షంగా ఉంచాలా, తరువాతి తఫిలీన్ ఆచారంగా వివరించాలా
  choice: ‘నీ చేతిమీద’ మరియు ‘నీ కళ్ల మధ్య’ అనే మూల దృశ్యాన్ని ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘నీ భుజానికి కట్టుకొని’ మరియు ‘నీ నుదుటిమీద’ అని తరువాతి ఆచారాన్ని స్పష్టంగా సూచించడం, లేదా పూర్తిగా అంతరంగ జ్ఞాపకంగా భావానువాదం చేయడం.
  rationale: హీబ్రూ పాఠ్యం స్పష్టమైన దృశ్యభాషను ఉపయోగిస్తుంది గాని తరువాతి ఆచార వస్తువులను పేరుపెట్టి చెప్పదు. ప్రత్యక్ష రూపం భౌతిక, ప్రతీకాత్మక వ్యాఖ్యానాల మధ్య ఉన్న తెరచుదనాన్ని కాపాడుతుంది.
- issue: תּוֹרָהను ఈ సందర్భంలో ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రం’ అని అనువదించడం.
  alternative: ‘ఉపదేశం’ లేదా ‘తోరా’ అని అనువదించడం.
  rationale: నిబంధనాత్మక సందర్భంలో ‘ధర్మశాస్త్రం’ సముచితమైన తెలుగు పదం. అయినా תּוֹרָה కేవలం చట్ట నియమాలకన్నా విస్తృతమైన బోధను సూచించగలదు కాబట్టి ఆ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: יְהוָה అనే దైవనామాన్ని బిరుదుగా మార్చాలా
  choice: వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా ఉంచడం.
  alternative: ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయడం.
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దాన్ని పేరుగానే అందించడం పాఠ్యంలోని వ్యక్తిగత, నిబంధన సంబంధాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆదేశ శైలిని ఉపయోగించాం. ‘నీ చేతిమీద,’ ‘నీ కళ్ల మధ్య,’ ‘నీ నోట’ అనే మూల దృశ్యాలను ఉద్దేశపూర్వకంగా ప్రత్యక్షంగా నిలిపాం. ఏకవచన సంబోధనను కాపాడాం; దైవనామాన్ని ‘యెహోవా’గా ఇచ్చాం.
