source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: te
  text: “ఇశ్రాయేలీయులలో, మనుష్యుల్లోనైనా పశువుల్లోనైనా, గర్భాన్ని మొదట తెరిచే ప్రతి తొలిచూలును నాకు ప్రతిష్ఠించు; అది నాది.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: ప్రతిష్ఠించు
  rationale: దేవునికి పవిత్రమైనదిగా ప్రత్యేకించాలనే ఆజ్ఞను తెలిపే హిఫిల్ ఆజ్ఞార్థక రూపం. ‘ప్రతిష్ఠించు’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి ఆరాధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: దేవునికి అంకితం చేయడాన్ని, ఆయనకు చెందడాన్ని לְ సూచిస్తుంది; ‘ప్రతిష్ఠించు’తో ‘నాకు’ సహజంగా సరిపోతుంది.
- source_word: כָל בְּכוֹר
  choice: ప్రతి తొలిచూలును
  rationale: בכור అంటే మొదట పుట్టినది. సందర్భంలో మగ తొలిచూలు ఉద్దేశించబడవచ్చు గాని ఈ వాక్యంలో ‘మగ’ అని స్పష్టంగా లేదు; అందువల్ల దానిని చేర్చలేదు.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: గర్భాన్ని మొదట తెరిచే
  rationale: అక్షరార్థంగా ‘ప్రతి గర్భాన్ని తెరిచేది’; ఇది తొలిచూలును మరింత స్పష్టంగా నిర్వచిస్తుంది. తెలుగులో సహజత కోసం ‘మొదట’ చేర్చినా భావం మూలపాఠంలోని తొలి ప్రసవాన్నే సూచిస్తుంది.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులలో
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులలో.’ ఇక్కడ సమాజమంతటిని సూచించే సహజ ఆధునిక తెలుగు రూపంగా ‘ఇశ్రాయేలీయులలో’ ఎంచుకున్నాం.
- source_word: בָּאָדָם
  choice: మనుష్యులకైనా
  rationale: אָדָם ఇక్కడ వ్యక్తిగత పురుషుణ్ణి కాక మానవజాతి వర్గాన్ని సమష్టిగా సూచిస్తూ పశువులతో వ్యత్యాసం చూపుతుంది. అందువల్ల ‘మనుష్యులు’ తెలుగు భావానికి ఖచ్చితంగా సరిపోతుంది.
- source_word: וּבַבְּהֵמָה
  choice: పశువులకైనా
  rationale: בְּהֵמָה జంతువు లేదా పశువును, ముఖ్యంగా ఇలాంటి ధర్మశాస్త్ర సందర్భంలో పెంపుడు పశువులను సూచించగలదు. ‘పశువులు’ సందర్భానుకూలమైన సహజ పదం.
- source_word: לִי הוּא
  choice: అది నాది
  rationale: ముగింపు వాక్యం దేవుని యాజమాన్యాన్ని గట్టిగా ప్రకటిస్తుంది; ‘అది నాది’ సంక్షిప్తంగా, సహజంగా ఆ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אָדָם అనే సమష్టివాచక పదం בְּהֵמָהతో చూపే వ్యత్యాసం
  choice: మనుష్యులకైనా
  alternative: మనిషికైనా
  rationale: హీబ్రూ ఏకవచన సమష్టివాచకం ఇక్కడ పురుషులను మాత్రమే కాక మానవ వర్గాన్ని జంతువుల వర్గంతో పోలుస్తుంది. తెలుగు ‘మనుష్యులు’ ఆ పరిధిని సహజంగా, సిద్ధాంతపరమైన అదనపు అర్థం లేకుండా తెలియజేస్తుంది.
- issue: తొలిచూలు మగదా అన్న ప్రశ్న
  choice: లింగాన్ని ప్రధాన పాఠ్యంలో పేర్కొనలేదు
  alternative: ప్రతి మగ తొలిచూలును
  rationale: తరువాతి నియమాలు మగ తొలిచూలుపై దృష్టి పెట్టినా, ఈ వాక్యంలోని בכורకు ‘మగ’ అనే విశేషణం లేదు. కాబట్టి సందర్భం ద్వారా సాధ్యమైన భావాన్ని పాఠ్యంలో స్పష్టీకరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ఆజ్ఞారూపం. ‘తొలిచూలు’ బైబిలు సందర్భంలో పరిచితమైనప్పటికీ ఇప్పటికీ అర్థమయ్యే పదం. హీబ్రూలోని మనుష్యులు–పశువులు అనే సమాంతర వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘కైనా…కైనా’ నిర్మాణం వాడబడింది.
