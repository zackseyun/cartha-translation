- from: “ఇశ్రాయేలీయులలో మనుష్యులకైనా పశువులకైనా గర్భాన్ని మొదట తెరిచే ప్రతి తొలిచూలును నాకు ప్రతిష్ఠించు; అది నాది.”
  to: “ఇశ్రాయేలీయులలో, మనుష్యుల్లోనైనా పశువుల్లోనైనా, గర్భాన్ని మొదట తెరిచే ప్రతి తొలిచూలును నాకు ప్రతిష్ఠించు; అది నాది.”
  rationale: The revision is limited to the paired human/animal phrase. It preserves the Hebrew parallelism and collective sense without adding gender or narrowing “beast” beyond the contextually appropriate Telugu “పశువులు.”
