source:
  edition: WLC
  text: מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַ/יָּמִ֑ים וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֜ חָמֵ֗ץ וְ/לֹֽא יֵרָאֶ֥ה לְ/ךָ֛ שְׂאֹ֖ר בְּ/כָל גְּבֻלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: te
  text: ఆ ఏడు రోజులూ పులియని రొట్టెలు తినాలి. పులిసినదేదీ[a] నీ దగ్గర కనిపించకూడదు[b]; పులిపిండి కూడా నీ ప్రాంతమంతటా కనిపించకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పులియబెట్టినదేదీ.’ ఇక్కడి హీబ్రూ పదం חָמֵץ పులిసిన లేదా పులియబెట్టిన పదార్థాన్ని సూచిస్తుంది; తరువాత వచ్చే שְׂאֹר మాత్రం పులియబెట్టడానికి ఉపయోగించే పులిపిండిని మరింత నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ వద్ద కనిపించకూడదు.’ అంటే ఆ ఏడు రోజుల్లో పులిసిన పదార్థం వ్యక్తి ఆధీనంలో లేదా పరిధిలో ఎక్కడా ఉండకూడదని ఈ మాట సూచిస్తుంది.
    reason: idiom_clarification
lexical_decisions:
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: పస్కా సందర్భంలో పులియబెట్టకుండా చేసిన రొట్టెలను సూచిస్తుంది. ఈ పదబంధం ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి ఆచార సంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: יֵאָכֵל
  choice: తినాలి
  rationale: నిఫల్ అసంపూర్ణ క్రియకు అక్షరార్థంగా కర్మణి భావం ఉన్నా, తెలుగు నియమవాక్యంలో ‘తినబడాలి’ కంటే ‘తినాలి’ సహజంగా ఉండి విధించబడిన కార్యాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: ఆ ఏడు రోజులూ
  rationale: కాలవ్యవధిని సూచించే ద్వితీయా విభక్తి మొత్తం ఏడు రోజుల కాలాన్ని ఉద్దేశిస్తుంది; ‘రోజులూ’ ఆ సంపూర్ణ వ్యాప్తిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָמֵץ
  choice: పులిసినదేదీ
  rationale: ఈ పదం పులియబెట్టే పదార్థానికే పరిమితం కాకుండా పులిసిన లేదా పులియబెట్టిన ఆహార పదార్థాన్ని విస్తృతంగా సూచించగలదు. తరువాతి שְׂאֹרతో ఉన్న భేదాన్ని ఈ అనువాదం కాపాడుతుంది.
- source_word: יֵרָאֶה לְךָ
  choice: నీ దగ్గర కనిపించకూడదు
  rationale: అక్షరార్థం ‘నీతో/నీ వద్ద కనిపించకూడదు.’ ఈ న్యాయ-ఆచార సందర్భంలో అది వ్యక్తి ఆధీనంలో లేదా పరిధిలో ఉండకూడదనే భావాన్ని ఇస్తుంది; ‘నీ దగ్గర’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׂאֹר
  choice: పులిపిండి
  rationale: ఇది పిండిని పులియబెట్టే మూల పదార్థాన్ని, ముఖ్యంగా నిల్వ ఉంచిన పులిసిన పిండిని సూచిస్తుంది. ‘పులిపిండి’ חָמֵץ అనే పులిసిన పదార్థం నుండి దీనిని వేరుచేస్తుంది.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: నీ ప్రాంతమంతటా
  rationale: వ్యక్తి లేదా సమాజానికి చెందిన సరిహద్దులలోని మొత్తం పరిధిని సూచిస్తుంది. ‘ప్రాంతమంతటా’ సమగ్ర వ్యాప్తిని సహజ ఆధునిక తెలుగులో అందిస్తుంది.
