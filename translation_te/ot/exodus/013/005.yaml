    text: లేదా ‘ఈ ఆచారాన్ని’ లేదా ‘ఈ ఆరాధన విధిని.’ హీబ్రూ పదం నిర్దేశిత ఆరాధనా కార్యాన్ని లేదా సేవను సూచించగలదు.
    reason: lexical_alternative
