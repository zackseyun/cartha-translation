revisions:
- from: యాహ్వే నిన్ను కనానీయులు, హిత్తీయులు, అమోరీయులు, హివ్వీయులు, యెబూసీయులు నివసించే దేశంలోకి తీసుకువచ్చినప్పుడు—అది నీకు ఇస్తానని ఆయన నీ పితరులకు ప్రమాణం చేసిన, పాలు తేనెలు ప్రవహించే దేశం—ఈ నెలలో నీవు ఈ ఆరాధనా సేవను[a] ఆచరించాలి.
