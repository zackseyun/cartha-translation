source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: te
  text: యాహ్వే నిన్ను కనానీయుల, హిత్తీయుల, అమోరీయుల, హివ్వీయుల, యెబూసీయుల దేశంలోకి తీసుకువచ్చినప్పుడు—అది నీకు ఇస్తానని ఆయన నీ పితరులకు ప్రమాణం చేసిన, పాలు తేనె ప్రవహించే దేశం—ఈ నెలలో నీవు ఈ ఆరాధనా సేవను[a] ఆచరించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ ఆచారాన్ని’ లేదా ‘ఈ ఆరాధన విధిని.’ హీబ్రూ పదం నిర్దేశిత ఆరాధనా కార్యాన్ని లేదా సేవను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: తీసుకువచ్చినప్పుడు
  rationale: ఈ నిర్మాణం భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘...నప్పుడు’ సహజంగా కాలార్థాన్ని తెలియజేస్తుంది.
- source_word: יְבִיאֲךָ
  choice: నిన్ను ... దేశంలోకి తీసుకువచ్చినప్పుడు
  rationale: בוא యొక్క హిఫీల్ రూపం ‘లోనికి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది; ‘దేశంలోకి’ గమనాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: కనానీయులు, హిత్తీయులు, అమోరీయులు, హివ్వీయులు, యెబూసీయులు నివసించే
  rationale: హీబ్రూలో ఏకవచన జాతినామాలు ఉన్నప్పటికీ, తెలుగులో ఈ ప్రజా సమూహాలను బహువచనంలో చెప్పడం సహజం. ‘నివసించే’ అనేది ‘వారి దేశం’ అనే సంబంధాన్ని స్పష్టపరుస్తుంది.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: అది నీకు ఇస్తానని ఆయన నీ పితరులకు ప్రమాణం చేసిన
  rationale: దేశానికి సంబంధించిన ఉపవాక్యంగా ఉంచి, ప్రమాణం మరియు దాని వాగ్దాన విషయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: పాలు తేనెలు ప్రవహించే దేశం
  rationale: సమృద్ధి, సారవంతతను సూచించే హీబ్రూ రూపకాన్ని తెలుగులో సుపరిచితమైన సమాన రూపంలో ఉంచుతుంది.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: ఈ ఆరాధనా సేవను ఆచరించాలి
  rationale: עבד మరియు עֲבֹדָהల పదబంధం ఆరాధన సందర్భంలోని నిర్దేశిత సేవను నిర్వహించడాన్ని సూచిస్తుంది. ‘ఆచరించాలి’ కార్యరూపాన్ని, ‘ఆరాధనా సేవ’ సేవాభావాన్ని తెలియజేస్తాయి.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: ఈ నెలలో
  rationale: కాలసూచక పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ‘యాహ్వే’గా ఇవ్వబడింది.
- issue: పస్కా/పులియని రొట్టెల సందర్భంలో עֲבֹדָה యొక్క ఆరాధనా భావం
  choice: ఈ ఆరాధనా సేవ
  alternative: ఈ ఆచారం / ఈ ఆరాధన విధి
  rationale: ఈ పదం సాధారణ పని మాత్రమే కాక నిర్దేశిత ఆరాధనా కార్యాన్ని సూచిస్తుంది. ‘ఆరాధనా సేవ’ ఆ భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చి పదంలోని విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ రెండవ పురుష ఏకవచనాన్ని ‘నిన్ను/నీకు/నీవు’గా నిలిపాం. పొడవైన వాక్యంలో దేశాన్ని వివరిస్తున్న భాగాన్ని డాష్‌ల మధ్య ఉంచి సంబంధాన్ని స్పష్టంచేశాం.
