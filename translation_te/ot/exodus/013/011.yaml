id: EXO.13.11
reference: Exodus 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: te
  text: యాహ్వే నిన్ను కనానీయుల దేశంలోకి తీసుకువచ్చి, నీకూ నీ పితరులకూ తాను చేసిన ప్రమాణం ప్రకారం ఆ దేశాన్ని నీకు ఇచ్చినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అప్పుడు
  rationale: ఈ నిర్మాణం భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో చివరనున్న ‘ఇచ్చినప్పుడు’తో కలిసి ‘అప్పుడు’ సహజంగా ఆ కాలసంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: יְבִיאֲךָ
  choice: నిన్ను ... తీసుకువచ్చి
  rationale: בוא అనే ధాతువు హిఫిల్ రూపంలో ‘వచ్చేలా చేయడం, తీసుకురావడం’ అని అర్థం. గమ్యాన్ని సూచించే ‘దేశంలోకి’తో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: కనానీయుల దేశంలోకి
  rationale: אֶל కదలిక గమ్యాన్ని సూచిస్తుంది; ‘దేశంలోకి’ దానిని స్పష్టంగా తెలియజేస్తుంది. הַכְּנַעֲנִי అనే ఏకవచన సామూహిక జాతినామాన్ని తెలుగులో సహజంగా ‘కనానీయుల’ అని అనువదించాం.
- source_word: כַּאֲשֶׁר
  choice: చేసిన ప్రకారం
  rationale: ముందుగా చేసిన ప్రమాణానికి అనుగుణంగా ఇప్పుడు జరిగేదాన్ని ఈ పదం కలుపుతుంది; ‘ప్రకారం’ పోలికతో పాటు నెరవేర్పు సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసిన
  rationale: నిఫల్ రూపంలోని שׁבעకు ‘ప్రమాణం చేయడం’ అనే సాధారణ అర్థం ఉంది. తెలుగు ఉపవాక్యంలో సంబంధకృదంత రూపం సహజంగా సరిపోతుంది.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: నీకూ నీ పితరులకూ
  rationale: రెండుసార్లు వచ్చిన לְ సంబంధాన్ని రెండు దత్తివాచక రూపాలతో నిలిపాం. ‘పితరులు’ మూలంలోని పితృసంబంధ పదాన్ని కాపాడుతూ, గౌరవప్రదమైన బైబిలు సందర్భానికి సరిపోతుంది.
- source_word: וּנְתָנָהּ לָךְ
  choice: దాన్ని నీకు ఇచ్చినప్పుడు
  rationale: స్త్రీలింగ ప్రత్యయం ముందున్న ‘దేశం’ను సూచిస్తుంది; అందువల్ల ‘దాన్ని’ వాడాం. మొత్తం నిర్మాణం భవిష్యత్ సందర్భాన్ని తెలిపినా, తెలుగులో కాలసూచక ఉపవాక్యంలో ‘ఇచ్చినప్పుడు’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాకుండా దైవనామమే ఉంది. కాబట్టి దాన్ని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా నిలిపాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది తరువాతి ఆజ్ఞతో కొనసాగే కాలసూచక ఉపవాక్యం కాబట్టి చివర కామాను ఉంచాం. అవసరం లేని పాదసూచికలు చేర్చలేదు.
