  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: te
  text: నీవు ఈ నియమాన్ని దానికి నిర్ణయించిన సమయంలో ఏటేటా[a] పాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “దినాలనుండి దినాలకు”; ఇక్కడ ఈ నుడికారాన్ని సాధారణంగా “ఏటేటా” అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: పాటించాలి
  rationale: శాసనపరమైన సందర్భంలో שׁמר అనేది ఆచరణలో విధేయత చూపుతూ నిరంతరం పాటించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పాటించాలి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַחֻקָּה הַזֹּאת
  choice: ఈ నియమాన్ని
  rationale: חֻקָּה స్థిరంగా విధించిన శాసనం లేదా నియమాన్ని సూచిస్తుంది. ‘ఈ నియమం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לְמוֹעֲדָהּ
  choice: దానికి నియమించిన సమయంలో
  rationale: מוֹעֵד నిర్ణయించబడిన సమయం లేదా సందర్భాన్ని సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం ఈ ఆచరణకు సంబంధించిన సమయాన్ని తెలియజేస్తుంది. ఈ రూపం ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: מִיָּמִים יָמִימָה
  choice: ఏటేటా
  rationale: అక్షరార్థంగా ‘దినాలనుండి దినాలకు’ అయిన ఈ హీబ్రూ నుడికారం, వార్షిక పండుగ సందర్భంలో ‘సంవత్సరం సంవత్సరం’ అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ‘ఏటేటా’ ఆ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; అక్షరరూపం పాదసూచికలో నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శాసన శైలి. వచనంలోని ఆజ్ఞార్థక భావాన్ని తెలుగులో విధ్యర్థక ‘పాటించాలి’తో వ్యక్తం చేశాం; వార్షిక సందర్భాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, హీబ్రూ అక్షరరూపాన్ని పాదసూచికలో భద్రపరిచాం.
