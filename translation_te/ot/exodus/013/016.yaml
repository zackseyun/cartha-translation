id: EXO.13.16
reference: Exodus 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה לְ/אוֹת֙ עַל יָ֣דְ/כָ֔ה וּ/לְ/טוֹטָפֹ֖ת בֵּ֣ין עֵינֶ֑י/ךָ כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִיאָ֥/נוּ יְהוָ֖ה מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: te
  text: ఇది నీ చేతిమీద ఒక సూచనగా, నీ కళ్ల మధ్య[b] నుదుటిపట్టీలుగా[a] ఉండాలి; ఎందుకంటే యాహ్వే బలమైన చేతితో మనలను ఐగుప్తు నుండి బయటకు తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టీలుగా’; సంప్రదాయంగా, ‘ఫిలాక్టరీలు.’ హీబ్రూ పదం అరుదైనది; జ్ఞాపకార్థంగా నుదుటిపై ధరించే దేనినో సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘నీ కళ్ల మధ్య’; ఈ ప్రయోగాన్ని తరచుగా ‘నీ నుదుటిమీద’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: ఈ ఆదేశ సందర్భంలో సంయుక్త సంపూర్ణ క్రియ భవిష్యత్తు/ఫలితార్థాన్ని సూచిస్తుంది; తెలుగులో ‘ఉండాలి’ కొనసాగవలసిన ప్రాముఖ్యతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאוֹת
  choice: ఒక సూచనగా
  rationale: אוֹת అనేది గుర్తు, సూచన లేదా జ్ఞాపక చిహ్నాన్ని సూచిస్తుంది; ‘సూచన’ విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది.
- source_word: עַל יָדְכָה
  choice: నీ చేతిమీద
  rationale: మూలంలో ‘చేయి’ ఉంది, ‘బాహువు’ కాదు; ప్రత్యక్ష దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: וּלְטוֹטָפֹת
  choice: నుదుటి పట్టీలుగా
  rationale: అరుదైన טוֹטָפֹת పదం నుదుటి ప్రాంతంలో ధరించే జ్ఞాపక వస్తువును సూచించే అవకాశం ఉంది. ‘ఫిలాక్టరీలు’ అనే తరువాతి సాంకేతిక పదాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా, సాధ్యమైన వస్తురూపాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּין עֵינֶיךָ
  choice: నీ కళ్ల మధ్య
  rationale: హీబ్రూ దృశ్యరూపాన్ని అక్షరార్థంగా నిలుపుతుంది; ‘నీ నుదుటిమీద’ అనే భావార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సూచనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בְּחֹזֶק יָד
  choice: బలమైన చేతితో
  rationale: దేవుని శక్తివంతమైన కార్యాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని సన్నిహితంగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: הוֹצִיאָנוּ
  choice: మనలను ... బయటకు తీసుకొచ్చాడు
  rationale: יצא హిఫీల్ రూపం ‘బయటకు తీసుకురావడం’ అనే కారణార్థాన్ని ఇస్తుంది; నిర్గమ సందర్భంలో ఇదే సహజమైన తెలుగు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన దేశనామంతో మూలంలోని ‘నుండి’ భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: చేతి/కళ్ల మధ్య అనే భాషను అక్షరార్థంగా ఉంచాలా, తరువాతి ఆచార వస్తువుగా నిర్దిష్టీకరించాలా
  choice: ‘నీ చేతిమీద’ మరియు ‘నీ కళ్ల మధ్య’ అనే దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అరుదైన వస్తుపదాన్ని ‘నుదుటి పట్టీలు’గా అనువదించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఫిలాక్టరీలు’ అని నిర్దిష్టీకరించడం లేదా మొత్తం వాక్యాన్ని కేవలం అలంకారిక జ్ఞాపకంగా మార్చడం
  rationale: హీబ్రూ పాఠ్యం తరువాతి ఆచారపదాన్ని స్పష్టంగా ఉపయోగించదు. అక్షరార్థం, సంకేతార్థం, లేదా రెండూ సాధ్యమనే వ్యాఖ్యాన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’తో, సమూహ స్మృతిని ‘మనలను’తో నిలిపాం. [a], [b] సూచికలు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
