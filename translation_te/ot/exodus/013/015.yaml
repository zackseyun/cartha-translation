reference: Exodus 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: te
  text: ఫరో మమ్మల్ని విడిచిపెట్టడానికి మొండిగా నిరాకరించినప్పుడు, యాహ్వే ఐగుప్తు దేశంలో మనుషుల తొలిసంతానం నుండి పశువుల తొలిసంతానం వరకు ప్రతి తొలిసంతానాన్ని చంపాడు. అందువల్ల గర్భాన్ని తొలిగా తెరిచిన ప్రతి మగ తొలిసంతానాన్ని నేను యాహ్వేకు బలిగా అర్పిస్తాను; కానీ నా ప్రతి తొలికుమారుణ్ణి విమోచిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: మొండిగా మమ్మల్ని వెళ్లనివ్వనప్పుడు
  rationale: హిఫిల్ రూపం ఈ సందర్భంలో ఫరో చూపిన మొండి ప్రతిఘటనను సూచిస్తుంది; తెలుగులో సహజంగా మొత్తం పదబంధం యొక్క భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- source_word: בְּכוֹר
  choice: తొలిచూలు
  rationale: మొదట పుట్టిన సంతానాన్ని సూచించే ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు పదం; వచనమంతటా ఒకే విధంగా వాడబడింది.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: మనుషుల తొలిచూలు మొదలుకొని పశువుల తొలిచూలు వరకు
  rationale: אָדָם ఇక్కడ మానవజాతిని సాధారణంగా సూచిస్తూ בְּהֵמָהతో వ్యత్యాసంలో ఉంది; ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: మొదటి సంతానం చంపబడిన సంఘటనకు బలి, విమోచన ఆచారాలకు మధ్య ఉన్న కారణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: זֹבֵחַ
  choice: బలిగా అర్పిస్తాను
  rationale: బలి కోసం వధించి అర్పించడాన్ని సూచించే క్రియ యొక్క ఆచార సంబంధ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: గర్భాన్ని తెరచే ప్రతి మగదానిని
  rationale: మొదట గర్భం నుంచి వెలువడే మగ సంతానాన్ని సూచించే హీబ్రూ న్యాయ-ఆచార నుడికారాన్ని సాధ్యమైనంత సమీపంగా నిలుపుతుంది.
- source_word: בָּנַי
  choice: నా కుమారులలో
  rationale: మూలంలోని లింగ-నిర్దిష్టమైన ‘నా కుమారులు’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: אֶפְדֶּה
  choice: విమోచిస్తాను
  rationale: ప్రత్యామ్నాయం లేదా మూల్యం ద్వారా విడిపించే ఆచార-న్యాయ భావాన్ని తెలిపే స్థిరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం ద్వారా దాని ప్రత్యేకతను నిలుపుతుంది.
- issue: אָדָם పదం בְּהֵמָהతో వ్యత్యాసంలో ఉండటం
  choice: మనుషులు
  alternative: మానవజాతి
  rationale: ఇక్కడ ఒక పురుషుణ్ని మాత్రమే కాకుండా మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషులు’ అనే రూపం లింగార్థాన్ని అనవసరంగా పరిమితం చేయకుండా జంతువులతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: మానవ తొలిచూలు మరియు జంతు తొలిచూలు పట్ల వేర్వేరు చర్యలు
  choice: జంతువును బలిగా అర్పించడం; కుమారుణ్ని విమోచించడం
  alternative: రెండింటినీ సాధారణంగా అంకితం చేయడం
  rationale: మూలం זֹבֵחַ మరియు אֶפְדֶּה అనే వేర్వేరు క్రియలను ఉద్దేశపూర్వకంగా వాడుతుంది; ఈ ఆచార సంబంధ ఉద్రిక్తతను సమతలీకరించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే న్యాయ-ఆచార సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలో ప్రత్యేక పాఠాంతర లేదా తప్పనిసరి వివరణ అవసరం లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
