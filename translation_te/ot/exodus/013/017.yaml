  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: te
  text: 'ఫరో ప్రజలను వెళ్లనిచ్చినప్పుడు, ఫిలిష్తీయుల దేశం గుండా వెళ్లే దారి దగ్గరగా ఉన్నప్పటికీ[a], దేవుడు వారిని ఆ దారిలో నడిపించలేదు. ఎందుకంటే దేవుడు ఇలా అన్నాడు: “ప్రజలు యుద్ధాన్ని చూసినప్పుడు మనసు మార్చుకొని[b] ఐగుప్తుకు తిరిగి వెళ్లిపోతారేమో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అది దగ్గరగా ఉంది.” హీబ్రూ సంధిపదాన్ని కారణార్థకంగానూ అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం సందర్భానికి సరిపోయే రాయితీభావాన్ని ఇస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పశ్చాత్తాపపడతారు” లేదా “తమ నిర్ణయాన్ని మార్చుకుంటారు.” ఇక్కడి హీబ్రూ క్రియ యుద్ధాన్ని ఎదుర్కొన్నప్పుడు కలిగే మనోమార్పును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: ఫరో ప్రజలను వెళ్లనిచ్చినప్పుడు
  rationale: בְּ + שׁלח infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; నిర్గమకాండ సందర్భంలో ‘విడిచిపెట్టడం/వెళ్లనివ్వడం’ సహజమైన అర్థం.
- source_word: נָחָם
  choice: నడిపించలేదు
  rationale: נחה అంటే నడిపించడం లేదా మార్గం చూపించడం; ప్రయాణమార్గ సందర్భంలో ‘నడిపించలేదు’ సహజంగా ఉంది.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశం గుండా వెళ్లే దారి
  rationale: హీబ్రూ భౌగోళిక నిర్మాణాన్ని నిలుపుతూ, ఆ దేశం గుండా సాగే మార్గమని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּי קָרוֹב הוּא
  choice: దారి దగ్గరదే అయినా
  rationale: כִּי ఇక్కడ కారణార్థకంగానూ రాయితీభావంగానూ అర్థమయ్యే అవకాశం ఉంది; సందర్భప్రవాహానికి రాయితీభావం సరిపోతుంది, ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: פֶּן
  choice: వెళ్లిపోవచ్చు
  rationale: פֶּן ప్రతికూలంగా సంభవించగల పరిణామంపై ఆందోళనను సూచిస్తుంది; తెలుగులో ఉద్ధరణ మొత్తాన్ని ‘వచ్చు’తో చెప్పడం సహజం.
- source_word: יִנָּחֵם
  choice: మనసు మార్చుకొని
  rationale: נחם నిఫల్ రూపం ఇక్కడ నైతిక పశ్చాత్తాపం కంటే పరిస్థితిని చూసి నిర్ణయం మార్చుకోవడాన్ని సూచిస్తుంది.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: యుద్ధాన్ని చూసినప్పుడు
  rationale: בְּ + infinitive construct కాల/పరిస్థితి భావాన్ని ఇస్తుంది; מִלְחָמָהకు ‘యుద్ధం’ విస్తృతమైన సరైన సమానం.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: ఐగుప్తుకు తిరిగి వెళ్లిపోవచ్చు
  rationale: שׁוב తిరిగి వెళ్లడాన్ని, దిశాసూచక రూపం ఐగుప్తు వైపు ప్రయాణాన్ని తెలియజేస్తుంది.
- source_word: וַיְהִי
  choice: …వెళ్లనిచ్చినప్పుడు
  rationale: కథన కొనసాగింపును తెలుగులో అదనపు ‘ఇప్పుడు’ లేకుండానే కాలసంబంధ ఉపవాక్యంతో సహజంగా వ్యక్తం చేయవచ్చు.
theological_decisions:
- issue: ఫిలిష్తీయుల మార్గాన్ని తప్పించడానికి దేవుడు తెలిపిన కారణం
  choice: ప్రజలు యుద్ధాన్ని చూసి నిర్ణయం మార్చుకొని ఐగుప్తుకు తిరిగే అవకాశాన్ని దేవుడు పరిగణించినట్లు వచనం చెబుతుంది.
  alternative: ఇది కేవలం కథకుడు దేవుని ఉద్దేశం గురించి చేసిన ఊహ అని చదవడం; లేదా దేవుడు పరిస్థితికి ప్రతిస్పందనగా ప్రణాళిక మార్చుకున్నాడని తేల్చడం.
  rationale: ‘దేవుడు అన్నాడు/అనుకున్నాడు’ అనే మూలపాఠ ప్రకటనలోని కారణాన్ని మాత్రమే అనువాదం తెలియజేస్తుంది; దైవజ్ఞానం లేదా దైవపరిపాలనపై అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథనశైలి. ‘ఫిలిష్తీయులు,’ ‘ఐగుప్తు’ అనే సుపరిచిత బైబిలు పేర్లు ఉపయోగించబడ్డాయి. మూలంలోని כִּי అస్పష్టతను పాదసూచికలో నిలిపాం.
