source:
  edition: WLC
  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: te
  text: అది ఈ నెల పద్నాలుగో రోజు వరకు మీ సంరక్షణలో ఉండాలి; ఇశ్రాయేలు సమాజమంతా దానిని సాయంకాలాల మధ్య[a] వధించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సాయంకాలాల మధ్య.” ఈ నానుడిని సాధారణంగా సూర్యాస్తమయం సమీపంలోని సంధ్యాసమయంగా అర్థం చేసుకుంటారు.
    reason: హీబ్రూ కాలనానుడి అక్షరార్థాన్ని, సాధారణంగా గ్రహించే భావాన్ని రెండింటినీ చూపుతూ దాని ఖచ్చిత సమయంపై ఉన్న అస్పష్టతను కాపాడటానికి.
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: అది మీ సంరక్షణలో ఉండాలి
  rationale: ‘మిష్మెరెత్’ అనే నామవాచకం కాపాడటం, బాధ్యతగా ఉంచుకోవటం అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేలా, జంతువు వారి సంరక్షణలో ఉండాలనే ఆదేశాన్ని వ్యక్తం చేసింది.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల పద్నాలుగో రోజు వరకు
  rationale: హీబ్రూ తేదీ వ్యక్తీకరణను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: దానిని వధించాలి
  rationale: ‘షాఖట్’ జంతువును ఉద్దేశపూర్వకంగా వధించడాన్ని, తరచుగా ఆచార సంబంధ సందర్భంలో, సూచిస్తుంది. ‘చంపాలి’ కంటే ‘వధించాలి’ ఈ ప్రత్యేకతను నిలుపుతుంది.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజపు సభ అంతా
  rationale: కహల్, ఏదా అనే రెండు సమూహవాచక పదాల బలాన్ని పూర్తిగా కలిపివేయకుండా ‘సమాజపు సభ’గా ఉంచి, ‘అంతా’ ద్వారా సమస్త సమూహ భాగస్వామ్యాన్ని తెలిపింది.
- source_word: בֵּין הָעַרְבָּיִם
  choice: సాయంకాలాల మధ్య
  rationale: హీబ్రూ పదబంధపు రూపాన్ని దగ్గరగా నిలుపుతూ, దాని ఖచ్చిత కాలవ్యాప్తిపై ఉన్న అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచింది.
theological_decisions:
- issue: వధించాలనే ఆజ్ఞలో కర్త సమూహమంతా కావడం
  choice: ఇశ్రాయేలు సమాజపు సభ అంతా దానిని వధించాలి
  alternative: ప్రతి కుటుంబం తన జంతువును వధించాలి
  rationale: హీబ్రూ వాక్యం ఇశ్రాయేలును సమష్టిగా కర్తగా పేర్కొంటుంది. చుట్టుపక్కల సందర్భంలో కార్యం కుటుంబాలవారీగా జరిగినా, ఇక్కడి సమష్టి భాషను వివరణాత్మకంగా మార్చకుండా నిలిపింది.
- issue: בֵּין הָעַרְבָּיִם సూచించే సమయం
  choice: సాయంకాలాల మధ్య
  alternative: సంధ్యవేళలో
  rationale: ఈ హీబ్రూ నానుడి సూర్యాస్తమయం చుట్టుపక్కల సమయాన్ని సూచించినప్పటికీ, దాని ఖచ్చిత అర్థం వివాదాస్పదం. అందువల్ల ప్రధాన పాఠ్యంలో రూపక అస్పష్టతను నిలిపి, సాధారణ అవగాహనను పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన ఆదేశ శైలి. హీబ్రూ సమష్టి భాషనూ కాలనానుడి అస్పష్టతనూ నిలిపింది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘సాయంకాలాల మధ్య’ పదబంధం వెంటనే ఉంచబడింది.
