review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the instructional sequence: eat with the waist girded, footwear on the feet, and a staff in hand; eat in haste; and identify the rite as belonging to/designated for Yahweh. The rendering of לַיהוָה as “యహ్వేకు” preserves one possible relation but produces an incomplete-sounding Telugu predicate in this clause.'
  naturalness: The circumstantial phrases are clear and suitably modern. However, “అది యహ్వేకు పస్కా” is not idiomatic modern standard Telugu. “అది యహ్వేకు చెందిన పస్కా” is natural and clearly expresses the source’s relation without importing doctrinal interpretation.
  terminology: “యహ్వే” appropriately represents יהוה, and “పస్కా” is an established Telugu biblical term for פֶּסַח. “చెప్పులు” and “కర్ర” are understandable modern terms in this travel context. The footnote correctly explains the concrete readiness idiom and remains anchored at the relevant phrase.
  issues:
  - severity: medium
    issue: The final identification clause, “అది యహ్వేకు పస్కా,” is syntactically and idiomatically awkward in Telugu.
    rationale: The Hebrew פֶּסַח הוּא לַיהוָה identifies the Passover in relation to Yahweh. Telugu normally needs an explicit relational expression here. “యహ్వేకు చెందిన” conveys this relation naturally and does not materially narrow the source text.
  revised_text: 'దానిని మీరు ఈ విధంగా తినాలి: మీ నడుములు బిగించుకొని[a], మీ పాదాలకు చెప్పులు వేసుకొని, మీ చేతిలో కర్ర పట్టుకొని ఉండాలి. దానిని మీరు త్వరత్వరగా తినాలి; అది యహ్వేకు చెందిన పస్కా.'
