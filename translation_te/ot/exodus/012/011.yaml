id: EXO.12.11
reference: Exodus 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: te
  text: 'దానిని మీరు ఈ విధంగా తినాలి: మీ నడుములు బిగించుకొని[a], మీ పాదాలకు చెప్పులు వేసుకొని, మీ చేతిలో కర్ర పట్టుకొని ఉండాలి. దానిని మీరు త్వరత్వరగా తినాలి; అది యహ్వేకు చెందిన పస్కా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీ నడుములు కట్టబడి ఉండగా.” పొడవైన వస్త్రాన్ని నడుము దగ్గర బిగించుకోవడం వెంటనే బయలుదేరడానికి లేదా చర్యకు సిద్ధంగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָכָה
  choice: ఈ విధంగా
  rationale: భోజనం ఎలా తినాలో తెలిపే హీబ్రూ విధివాచక వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: תֹּאכְלוּ
  choice: మీరు తినాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలోని క్రియకు స్పష్టమైన నిర్దేశక బలాన్ని ఇస్తుంది.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: మీ నడుములు బిగించుకొని
  rationale: ప్రయాణానికి లేదా తక్షణ చర్యకు సిద్ధంగా వస్త్రాన్ని నడుము దగ్గర బిగించుకునే దృశ్యాన్ని నిలుపుతుంది; అర్థాన్ని పూర్తిగా వివరణగా మార్చదు.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: మీ పాదాలకు చెప్పులు వేసుకొని
  rationale: ప్రాచీన సందర్భంలోని పాదరక్షలను సాధారణ ఆధునిక తెలుగు పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: మీ చేతిలో కర్ర పట్టుకొని
  rationale: ప్రయాణ సందర్భంలో מַקֵּל సూచించే చేతికర్ర లేదా ప్రయాణ కర్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּחִפָּזוֹן
  choice: త్వరత్వరగా
  rationale: అత్యవసరంగా బయలుదేరేందుకు సిద్ధంగా ఉండే తొందరను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: פֶּסַח
  choice: పస్కా
  rationale: ఈ సందర్భంలో ఆ ఆచారం లేదా బలిభోజనానికి పేరుగా ఉన్న స్థిరమైన తెలుగు బైబిలు పదాన్ని ఉపయోగిస్తుంది.
- source_word: הוּא לַיהוָה
  choice: అది యహ్వేకు పస్కా
  rationale: לַ ఉపసర్గలోని అర్పణ, సంబంధం లేదా నియామక భావాన్ని ‘యహ్వేకు’ అని నిలుపుతుంది; దానిని కేవలం స్వామ్యార్థంగా పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది; ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: פֶּסַח הוּא לַיהוָה లోని సంబంధం
  choice: అది యహ్వేకు పస్కా
  alternative: అది యహ్వే యొక్క పస్కా
  rationale: לַיהוָה అనే రూపం ‘యహ్వేకు’ లేదా ‘యహ్వే కోసం’ అనే దిశా/అర్పణ సంబంధాన్ని కలిగి ఉండగలదు. ప్రధాన పాఠం ఆ సంబంధాన్ని విస్తృతంగా ఉంచుతుంది; స్వామ్యార్థాన్ని మాత్రమే నిర్బంధించదు.
- issue: מָתְנֵיכֶם חֲגֻרִים అనే సిద్ధతా నుడికారం
  choice: మీ నడుములు బిగించుకొని
  alternative: బయలుదేరడానికి సిద్ధంగా ఉండి
  rationale: మూలంలోని శరీరాత్మక దృశ్యాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని ప్రయాణ సిద్ధతా భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆదేశ శైలి. ప్రాచీన ప్రయాణ దృశ్యాన్ని నిలుపుతూ అతిగా పురాతన పదజాలాన్ని నివారించింది. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని, ‘యహ్వే’ అనే దైవనామ రూపాన్ని ఉపయోగించింది.
