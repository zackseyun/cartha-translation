source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: te
  text: ఆ రోజునే యహ్వే ఇశ్రాయేలు కుమారులను[a] ఐగుప్తు దేశం నుండి వారి విభాగాల ప్రకారం[b] బయటకు తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు సంతానాన్ని,’ ‘ఇశ్రాయేలీయులను.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులను’; ఇది మొత్తం ప్రజలను సూచించే కుటుంబ-వంశ సంబంధమైన వ్యక్తీకరణ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి సైన్యాల ప్రకారం,’ ‘వారి సమూహాలవారీగా.’ హీబ్రూ పదం వారు క్రమబద్ధమైన విభాగాలుగా బయలుదేరడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఆ రోజునే
  rationale: ఈ సందర్భంలో וַיְהִי కథనాన్ని ముందుకు నడిపిస్తూ కాలసూచక వాక్యభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకుండా సహజమైన వాక్య నిర్మాణంలో దాని కథన కార్యాన్ని వ్యక్తం చేశాం.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ఆ రోజునే
  rationale: ఈ హీబ్రూ ప్రయోగం అదే నిర్దిష్టమైన రోజును నొక్కి చెబుతుంది. ‘ఆ రోజునే’ ఆధునిక తెలుగులో ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: הוֹצִיא
  choice: బయటకు తీసుకువచ్చాడు
  rationale: יצא ధాతువు హిఫీల్ రూపంలో కారణార్థకంగా ‘బయటకు తీసుకురావడం’ అనే భావం ఇస్తుంది. ఈ అనువాదం చర్య విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’ ఇది మొత్తం ప్రజాసమూహాన్ని సూచించే కుటుంబ-వంశ సంబంధమైన హీబ్రూ వ్యక్తీకరణ; ఆ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని אֶרֶץ (‘దేశం’) పదాన్ని నిలుపుతూ, బయలుదేరే కదలికను తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: עַל צִבְאֹתָם
  choice: వారి దళాలవారీగా
  rationale: צְבָאוֹת అనేది సైన్యాలు, దళాలు లేదా క్రమబద్ధమైన సమూహాలను సూచించగలదు. ఇక్కడ తప్పనిసరిగా యుద్ధ సైన్యాలు అని నిర్ణయించకుండా, సమూహాలుగా బయలుదేరిన భావాన్ని ‘దళాలవారీగా’ తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; ‘యెహోవా’ అనే సంప్రదాయ రూపానికి బదులు హీబ్రూ నామానికి సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను అనుసరించాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమష్టి సంబోధన
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు సంతానం; ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ-వంశ భాషను నిలుపుతూ, ఇది సమష్టిగా ఇశ్రాయేలు ప్రజలను సూచిస్తుందనే విషయాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: צִבְאֹתָם లోని సైనిక లేదా క్రమబద్ధ సమూహ భావం
  choice: వారి దళాలవారీగా
  alternative: వారి సైన్యాల ప్రకారం; వారి సమూహాలవారీగా
  rationale: పదంలోని క్రమబద్ధమైన విభాగాల భావాన్ని నిలిపి, వారంతా యుద్ధ సైనికులేనని పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని వాడాం. ‘ఆ రోజునే’ ద్వారా కాల ఉద్ఘాటనను సంక్షిప్తంగా నిలిపాం. ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపం కొంత సంప్రదాయ ధ్వని కలిగినా సాధారణ పాఠకుడికి అర్థమయ్యేలా పాదటిప్పణి ఇచ్చాం.
