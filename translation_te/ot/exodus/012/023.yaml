id: EXO.12.23
reference: Exodus 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: te
  text: యెహోవా ఐగుప్తును దెబ్బతీయడానికి దాని గుండా వెళ్తాడు. ఆయన ద్వారపు పైకమ్మి మీదా, రెండు నిలువు ద్వారకమ్మీల మీదా ఉన్న రక్తాన్ని చూసినప్పుడు, యెహోవా ఆ ప్రవేశద్వారాన్ని దాటి పోతాడు[a]. నాశనం చేసేవాడు[b] మీ ఇళ్లలోకి ప్రవేశించి దెబ్బతీయడానికి ఆయన అనుమతించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిచిపెడతాడు,’ ‘కాపాడతాడు.’ ఇక్కడి హీబ్రూ క్రియ పస్కాతో సంబంధమున్న కీలక పదం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యం ‘నాశనం చేసేవాడు’ ఎవరో నిర్దిష్టంగా చెప్పదు; కొందరు దీనిని తీర్పు అమలు చేసే దేవదూతగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: וְעָבַר
  choice: దాని మధ్యగా వెళ్తాడు
  rationale: עבר ఇక్కడ ఐగుప్తు మధ్యగా తీర్పు తీర్చడానికి కదలడాన్ని సూచిస్తుంది; తరువాత వచ్చే פסחతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: לִנְגֹּף
  choice: దెబ్బతీయడానికి
  rationale: נגף యొక్క తీవ్రమైన తీర్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మరణకర ఫలితాన్ని పాఠ్యంలో లేనంతగా విస్తరించదు.
- source_word: הַמַּשְׁקוֹף
  choice: ద్వారపు పైకమ్మి
  rationale: ద్వారచట్రంలోని పై అడ్డభాగాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే ఖచ్చితమైన పదబంధంతో సూచిస్తుంది.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: రెండు ద్వారబంధాలు
  rationale: ద్వారచట్రంలోని రెండు నిలువు పక్క భాగాలను సూచిస్తుంది.
- source_word: וּפָסַח
  choice: దాటివెళ్తాడు
  rationale: פסחకు పస్కా కథనంలో ఉన్న కీలక పదసంబంధాన్ని సాధ్యమైనంతగా నిలుపుతూ, 'కాపాడతాడు' లేదా 'విడిచిపెడతాడు' అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచదు.
- source_word: עַל הַפֶּתַח
  choice: ఆ ద్వారాన్ని
  rationale: פתח ఇక్కడ ఇంటి ప్రవేశద్వారాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: וְלֹא יִתֵּן
  choice: అనుమతించడు
  rationale: נתן + క్రియార్థక రూపం ఇక్కడ 'అనుమతించు' అనే ప్రయోగార్థాన్ని కలిగి ఉంది.
- source_word: הַמַּשְׁחִית
  choice: నాశనం చేసేవాడు
  rationale: హీబ్రూ పేర్కొన్న విధిని మాత్రమే వ్యక్తం చేస్తుంది; అతన్ని దేవదూతగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యెహోవాకు, 'నాశనం చేసేవాడికి' మధ్య సంబంధం
  choice: యెహోవాను, నాశనం చేసేవాడిని వాక్యంలో వేర్వేరుగా ఉంచి, యెహోవా అతని ప్రవేశాన్ని అడ్డుకుంటాడని అనువదించడం.
  alternative: నాశనం చేసేవాడిని యెహోవాకే మరో సూచనగా భావించడం లేదా 'నాశనకర దేవదూత' అని నిర్దిష్టం చేయడం.
  rationale: హీబ్రూ వాక్యం יְהוָה మరియు הַמַּשְׁחִיתలను వ్యాకరణపరంగా వేరు చేస్తుంది; అయితే నాశనం చేసేవాడి స్వరూపాన్ని వివరించదు. అందువల్ల ఆ ఉద్వేగాన్ని అలాగే ఉంచాం.
- issue: פסח యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో 'దాటివెళ్తాడు' అని ఉంచి, కాపాడటం/విడిచిపెట్టటం అనే సాధ్యమైన భావాలను పాదటిప్పణిలో ఇవ్వడం.
  alternative: '''కాపాడతాడు'' లేదా ''విడిచిపెడతాడు'' అని నేరుగా అనువదించడం.'
  rationale: ఈ క్రియ పస్కా కథనానికి కీలకమైనది. సందర్భం రక్షణాత్మక ఫలితాన్ని స్పష్టపరుస్తున్నప్పటికీ, మూలపదంలోని చలనచిత్రణను మరియు దాని అర్థపరిధిని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకుడికి సులభంగా అర్థమయ్యే శైలి. עבר మరియు פסח మధ్య మూలపాఠ్య పదభేదం నిలుపబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
