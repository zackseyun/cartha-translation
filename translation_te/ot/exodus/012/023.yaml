    rationale: שְׁתֵּי הַמְּזוּזוֹת రెండు నిలువు doorposts‌ను సూచిస్తుంది. ‘ద్వారబంధాలు’ మొత్తం చట్రాన్ని లేదా అనిర్దిష్ట భాగాలను సూచించవచ్చు.
