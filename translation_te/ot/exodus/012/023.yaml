revisions:
- from: యెహోవా ఐగుప్తును దెబ్బతీయడానికి దాని మధ్యగా వెళ్తాడు. ఆయన ద్వారపు పైకమ్మి మీద, రెండు ద్వారబంధాల మీద ఉన్న రక్తాన్ని చూసి, యెహోవా ఆ ద్వారాన్ని దాటివెళ్తాడు[a]. నాశనం చేసేవాడు[b] మీ ఇళ్లలోకి ప్రవేశించి దెబ్బతీయడానికి ఆయన అనుమతించడు.
  to: యెహోవా ఐగుప్తును దెబ్బతీయడానికి దాని గుండా వెళ్తాడు. ఆయన ద్వారపు పైకమ్మి మీదా, రెండు నిలువు ద్వారకమ్మీల మీదా ఉన్న రక్తాన్ని చూసినప్పుడు, యెహోవా ఆ ప్రవేశద్వారాన్ని దాటి పోతాడు[a]. నాశనం చేసేవాడు[b] మీ ఇళ్లలోకి ప్రవేశించి దెబ్బతీయడానికి ఆయన అనుమతించడు.
  rationale: ద్వార నిర్మాణానికి సంబంధించిన హీబ్రూ పదాలను మరింత ఖచ్చితంగా ప్రతిబింబించడానికి ‘రెండు నిలువు ద్వారకమ్మీలు’ అని సవరించాం. פסח క్రియలోని పస్కా-సంబంధిత పదప్రతిధ్వనిని, రక్షణార్థక సందర్భాన్ని, మరియు తెలుగులో దిశకు సంబంధించిన స్పష్టతను సమతుల్యం చేయడానికి ‘ఆ ప్రవేశద్వారాన్ని దాటి పోతాడు’ అని మార్చాం. పాదటిప్పణి గుర్తులు, వాటి విషయాలు, మరియు నాశనం చేసేవాడి గుర్తింపుపై మూలపాఠ్య అస్పష్టత యథాతథంగా ఉంచబడ్డాయి.
