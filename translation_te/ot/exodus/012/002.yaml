source:
  edition: WLC
  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: te
  text: ఈ నెల మీకు నెలల ఆరంభంగా ఉండాలి; ఇది మీకు సంవత్సరంలోని నెలలలో మొదటి నెలగా ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ అమావాస్య/కొత్త చంద్రుడు”; హీబ్రూ పదం కొత్త చంద్రుని చక్రంతో సంబంధముండవచ్చు. అయితే ఇక్కడ అది కాలపట్టికలోని నెలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల
  rationale: కాలపట్టికను స్థాపించే ఈ సందర్భంలో חֹדֶשׁ సాధారణంగా ‘నెల’ను సూచిస్తుంది. అది అమావాస్య చక్రంతో సంబంధమున్న పదమైనప్పటికీ, ఇక్కడ ‘ఈ నెల’ సహజమైనదీ సందర్భానుకూలమైనదీ.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఈ కాలగణన ఇశ్రాయేలీయులకు సంబంధించి స్థాపించబడుతున్నదని ఈ రూపం తెలియజేస్తుంది; తెలుగు ‘మీకు’ ఆ సంబంధార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: నెలల ఆరంభం
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా, కాలక్రమంలో ‘ఆరంభం’ లేదా ‘మొదటిది’ అనే భావం ఇస్తుంది. ‘నెలల ఆరంభం’ హీబ్రూ సమాస భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: רִאשׁוֹן
  choice: మొదటిది
  rationale: ఇది క్రమంలో మొదటి స్థానాన్ని స్పష్టంగా సూచిస్తుంది. ముందున్న ‘నెల’ను తెలుగు సందర్భం ద్వారా గ్రహించవచ్చు.
- source_word: הוּא
  choice: ఇది ... కావాలి
  rationale: సర్వనామం ‘ఈ నెల’ను తిరిగి సూచిస్తుంది. శాసనాత్మక సందర్భంలోని స్థాపన భావాన్ని తెలుగులో ‘కావాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: సంవత్సరపు నెలల్లో
  rationale: ఈ నెల సంవత్సరంలోని నెలల క్రమంలో మొదటిదని మూలంలోని సంబంధ పరిధిని ఈ పదబంధం స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: క్రియలేని హీబ్రూ వాక్యానికి శాసనాత్మక సందర్భంలో ఉన్న బలం
  choice: ‘ఉండాలి / కావాలి’ అనే విధినిర్దేశక బలంతో అనువదించడం
  alternative: ‘ఉంది / ఇది’ అనే సాధారణ వర్తమాన వర్ణనగా అనువదించడం
  rationale: హీబ్రూలో స్పష్టమైన క్రియ లేకపోయినా, చుట్టుపక్కల సందర్భం దేవుడు ఇశ్రాయేలు కాలపట్టికను స్థాపిస్తున్న ఆదేశం. ‘ఉండాలి / కావాలి’ అనేది అదనపు సిద్ధాంతాన్ని చేర్చకుండా ఆ స్థాపన భావాన్ని తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘సంవత్సరపు నెలల్లో’ అనే రూపం మూలంలోని పరిధి భావాన్ని స్పష్టంగా నిలుపుతుంది. అమావాస్య అనే ప్రత్యామ్నాయ అర్థం ఈ సందర్భంలో ప్రధాన పాఠానికి అవసరం లేదని భావించి పాదటిప్పణి చేర్చలేదు.
