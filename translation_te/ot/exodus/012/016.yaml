source:
  edition: WLC
  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: te
  text: మొదటి రోజున మీకు పవిత్ర సభ[a] ఉండాలి; ఏడవ రోజున కూడా పవిత్ర సభ ఉండాలి. ఆ రెండు రోజుల్లో ఏ పనీ చేయకూడదు. అయితే ప్రతి వ్యక్తి తినడానికి అవసరమైనది[b] మాత్రమే మీ కోసం సిద్ధం చేయవచ్చు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్ర సమావేశం’; హీబ్రూ పదబంధం పవిత్రమైన ఉద్దేశంతో పిలిపించిన సమావేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘ప్రతి నెఫెష్ తినేది.’ ఇక్కడ నెఫెష్ అంటే ‘వ్యక్తి’; ఆధునిక అర్థంలోని ‘ఆత్మ’ అని ప్రత్యేకంగా కాదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘అది మాత్రమే మీ కోసం చేయబడాలి.’ సందర్భంలో తినడానికి అవసరమైన ఆహారాన్ని సిద్ధం చేయడం మాత్రమే ఆ రోజుల్లో అనుమతించబడిందని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: పవిత్ర సభ
  rationale: ఈ పదబంధం పవిత్రమైన ఉద్దేశంతో పిలిపించిన సమాజాన్ని సూచిస్తుంది. ‘పవిత్ర సభ’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, పవిత్రతనూ సమూహంగా సమావేశమవడాన్నీ తెలియజేస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీకు ... ఉండాలి
  rationale: హీబ్రూ అస్తిత్వార్థాన్నీ, ఆ సభ ఇశ్రాయేలీయుల కోసం నియమించబడిందనే భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: ఆ రెండు రోజుల్లో ఏ పనీ చేయకూడదు
  rationale: כָּל తో కూడిన నిషేధాన్ని ‘ఏ పనీ’ స్పష్టంగా తెలియజేస్తుంది. హీబ్రూ నిష్క్రియారూపాన్ని తెలుగులో యథాతథంగా పెడితే కృత్రిమంగా ఉండటంతో, దాని నిషేధార్థాన్ని సహజమైన విధిరూపంలో అందించాం.
- source_word: אַךְ
  choice: అయితే ... మాత్రమే
  rationale: పని చేయకూడదనే సాధారణ నిషేధానికి తరువాత వచ్చే ఏకైక మినహాయింపును ఈ నిర్మాణం స్పష్టంగా చూపిస్తుంది.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: ప్రతి వ్యక్తి తినడానికి అవసరమైనది
  rationale: נֶפֶשׁ ఇక్కడ శరీరానికి భిన్నమైన ‘ఆత్మ’ను కాక వ్యక్తిని సూచిస్తుంది. సందర్భంలో తినడానికి అవసరమైన ఆహారాన్ని సిద్ధం చేయడమే మినహాయింపు; అందువల్ల ఈ తెలుగు వాక్యం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הוּא לְבַדּוֹ
  choice: అది మాత్రమే
  rationale: సర్వనామం, לְבַדּוֹ కలిసి మినహాయింపును గట్టిగా పరిమితం చేస్తున్నాయి; తెలుగులో ‘మాత్రమే’ ఆ ప్రత్యేకతను నిలుపుతుంది.
- source_word: יֵעָשֶׂה לָכֶם
  choice: మీ కోసం సిద్ధం చేయవచ్చు
  rationale: క్రియ అక్షరార్థంగా ‘మీ కోసం చేయబడవచ్చు’ అనే భావాన్ని ఇస్తుంది; ఈ సందర్భంలో దాని సూచిత కార్యం ఆహార సిద్ధీకరణ కాబట్టి ‘సిద్ధం చేయవచ్చు’ సహజంగా, స్పష్టంగా ఉంటుంది. לָכֶם లోని ప్రయోజనార్థాన్ని ‘మీ కోసం’ నిలుపుతుంది.
