source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: te
  text: ఈ రోజు మీకు జ్ఞాపకంగా ఉండాలి. మీరు దానిని యెహోవాకు పండుగగా ఆచరించాలి. మీ తరతరాలన్నిటిలో ఇది స్థిరమైన విధి; మీరు దానిని ఆచరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాశ్వతమైన విధి,” “తరతరాలకు నిలిచే విధి.” హీబ్రూ పదబంధం חֻקַּת עוֹלָם సాధారణంగా తరతరాలపాటు కొనసాగవలసిన స్థిరమైన నియమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: న్యాయపరమైన ఆదేశ సందర్భంలో ఈ రూపం భవిష్యత్తుతో కూడిన విధిని తెలియజేస్తుంది; తెలుగులో ‘ఉండాలి’ ఆ నిర్దేశక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם הַזֶּה
  choice: ఈ రోజు
  rationale: హీబ్రూ నిర్దేశక పదబంధానికి సరళమైన, సహజమైన సమానార్థకం.
- source_word: לָכֶם
  choice: మీకు
  rationale: ఇక్కడ సంబంధం లేదా ప్రయోజనాన్ని సూచించే לְ ఉపసర్గ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לְזִכָּרוֹן
  choice: ఒక జ్ఞాపకార్థ దినంగా
  rationale: זִכָּרוֹן జ్ఞాపకంగా నిలిపే ఆచరణను సూచిస్తుంది. తెలుగులో వాక్య ప్రవాహం స్పష్టంగా ఉండేందుకు ‘దినంగా’ చేర్చబడింది; ఇది మూలంలోని ‘ఈ రోజు’నే వివరిస్తుంది.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: మీరు దానిని ... పండుగగా ఆచరించాలి
  rationale: חגג మరియు חַג పదాల పండుగను జరుపుకోవడం/ఆచరించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని יהוה అనే ఒడంబడిక నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించి, לְ సంబంధాన్ని ‘-కు’తో తెలిపింది.
- source_word: לְדֹרֹתֵיכֶם
  choice: మీ తరతరాలన్నిటిలో
  rationale: వరుసగా వచ్చే అన్ని తరాలలో ఆచరణ కొనసాగాలనే హీబ్రూ నానుడి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֻקָּה స్థిరమైన విధి లేదా శాసనాన్ని, עוֹלָם దీర్ఘకాలికంగా కొనసాగడాన్ని సూచిస్తాయి. ప్రధాన పాఠంలో సంప్రదాయబద్ధమైన సహజ తెలుగు పదబంధాన్ని ఉంచి, కాలవ్యాప్తి సూక్ష్మతను పాదసూచికలో తెలిపింది.
- source_word: תְּחָגֻּהוּ
  choice: దానిని ... ఆచరించాలి
  rationale: ముందటి חגג ఆదేశాన్ని పునరుద్ఘాటించే ఈ క్రియను అదే ‘ఆచరించాలి’ రూపంతో అనుసంధానించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉన్నందున బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచబడింది. ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ ప్రత్యామ్నాయ పండిత లిప్యంతరీకరణ.
- issue: חֻקַּת עוֹלָם యొక్క కాలవ్యాప్తి
  choice: శాశ్వతమైన శాసనం
  alternative: నిరంతరం అమలులో ఉండే శాసనం
  rationale: ఈ పదబంధం ఇశ్రాయేలు తరతరాలలో కొనసాగవలసిన స్థిరమైన విధిని సూచిస్తుంది. ‘శాశ్వతమైన’ దాని బలాన్ని నిలుపుతుంది; అయితే అది తప్పనిసరిగా తాత్త్వికమైన అంతంలేని కాలాన్ని నిర్వచిస్తుందని నిర్ధారించకుండా పాదసూచికలో నుడికారార్థాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే న్యాయ-ఆచార శైలి ఉపయోగించబడింది. ‘ఆచరించాలి’ అనే పునరుక్తి మూలంలోని חגג క్రియ పునరావృతిని నిలుపుతుంది.
