    text: లేదా, “శాశ్వతమైన విధి,” “తరతరాలకు నిలిచే విధి.” హీబ్రూ పదబంధం חֻקַּת עוֹלָם సాధారణంగా తరతరాలపాటు కొనసాగవలసిన స్థిరమైన నియమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
