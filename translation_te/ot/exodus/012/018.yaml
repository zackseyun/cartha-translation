  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: te
  text: మొదటి నెలలో, ఆ నెల పద్నాలుగో రోజు సాయంకాలం[a] మొదలుకొని, ఆ నెల ఇరవై ఒకటో రోజు సాయంకాలం వరకు మీరు పులియని రొట్టెలు తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్లా ‘సాయంకాలంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: మొదటి నెలలో
  rationale: హీబ్రూ తేదీ నిర్మాణంలో తరువాత వచ్చే ‘నెల’ అనే పదం భావాన్ని పూర్తిచేస్తుంది; తెలుగులో స్పష్టతకోసం ‘నెలలో’ అని సహజంగా వ్యక్తం చేయబడింది.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: పద్నాలుగో రోజు
  rationale: కార్డినల్ సంఖ్యతో తేదీని సూచించే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు క్రమసంఖ్యా రూపం.
- source_word: לַחֹדֶשׁ
  choice: ఆ నెల
  rationale: తేదీ సందర్భంలో חֹדֶשׁ అంటే ‘నెల’; తెలుగులో తేదీ సంబంధాన్ని సహజంగా చూపడానికి ‘ఆ నెల’ అని అనువదించబడింది.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: సాయంకాలం
  rationale: ఈ పదబంధం ఆచరణ కాలపు ఆరంభ, ముగింపు హద్దులను సూచిస్తుంది. ‘సాయంకాలం’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ‘సంధ్యవేళ’ కంటే తక్కువ సాహిత్యాత్మకంగా ఉంటుంది.
- source_word: תֹּאכְלוּ
  choice: మీరు ... తినాలి
  rationale: నియమాత్మక సందర్భంలోని ఆదేశ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מַצֹּת
  choice: పులియని రొట్టెలు
  rationale: పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలను పారదర్శకంగా సూచించే సాధారణ తెలుగు రూపం.
- source_word: עַד
  choice: వరకు
  rationale: కాలవ్యవధి ముగింపు హద్దును నేరుగా సూచిస్తుంది.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: ఇరవై ఒకటో రోజు
  rationale: హీబ్రూ సంఖ్యా ప్రయోగాన్ని సహజమైన తెలుగు క్రమసంఖ్యా రూపంలో అందిస్తుంది.
