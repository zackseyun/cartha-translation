id: EXO.12.41
reference: Exodus 12:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: te
  text: నాలుగు వందల ముప్పై సంవత్సరాలు ముగిసినప్పుడు, సరిగ్గా అదే రోజున, యాహ్వే దళాలన్నీ[a] ఐగుప్తు దేశం నుండి బయలుదేరాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సైన్యాలన్నీ.” హెబ్రీ పదం క్రమబద్ధమైన దళాలను లేదా సైన్యాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: ముగిసినప్పుడు
  rationale: ఈ పదబంధం ఒక కాలవ్యవధి పూర్తయిన సమయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ముగిసినప్పుడు’ సహజంగా ఉండి ఆ కాలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: నాలుగు వందల ముప్పై సంవత్సరాలు
  rationale: హెబ్రీలోని సంఖ్యాక్రమాన్ని సహజ తెలుగు క్రమంలో చెప్పి, మొత్తం 430 సంవత్సరాల వ్యవధిని యథాతథంగా ఉంచింది.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: సరిగ్గా అదే రోజున
  rationale: ఈ హెబ్రీ నానుడి ఆ రోజు యొక్క ఖచ్చితత్వాన్ని, ప్రత్యేక ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: יָצְאוּ
  choice: బయలుదేరాయి
  rationale: יצא ఇక్కడ ఐగుప్తు దేశం నుండి బయటకు వెళ్లడాన్ని సూచిస్తుంది. ‘బయలుదేరాయి’ తెలుగు కథనంలో సహజంగా ఉండి నిర్గమన భావాన్ని నిలుపుతుంది.
- source_word: כָּל צִבְאוֹת
  choice: దళాలన్నీ
  rationale: צָבָא అనే పదానికి సైన్యం, దళం, క్రమబద్ధమైన సమూహం అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఇశ్రాయేలు ప్రజల క్రమబద్ధమైన సమూహాలను సూచించేందుకు ‘దళాలు’ సైనిక భావాన్ని అతిగా మోపకుండా మూలంలోని సామూహిక-వ్యవస్థీకృత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలోని אֶרֶץ (‘దేశం’)ను నిలుపుతూ భౌగోళిక-జాతీయ నిర్గమన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ నేరుగా ఉంది; అందువల్ల దైవనామాన్ని ‘యాహ్వే’గా నిలిపింది.
- issue: צִבְאוֹת יְהוָה యొక్క భావ ఛాయ
  choice: యాహ్వే దళాలన్నీ
  alternative: యాహ్వే సైన్యాలన్నీ
  rationale: ఇక్కడ పదం క్రమబద్ధమైన ప్రజాసమూహాలను సూచించగలదు. వారు ఈ వచనంలో యుద్ధం చేస్తున్న సైన్యమని నిర్బంధంగా చెప్పకుండా, మూలంలోని సైనిక-వ్యవస్థీకృత భావాన్ని ‘దళాలు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. మూలంలోని ఖచ్చిత కాల ఉద్ఘాటనను నిలిపి, צִבְאוֹת పదంలోని దళాలు/సైన్యాలు అనే భావ విస్తృతిని పాదటిప్పణిలో సంరక్షించింది.
