  to: నీతో పాటు ఒక పరదేశి నివసిస్తూ యెహోవాకు పస్కాను ఆచరించదలిస్తే, అతనికి చెందిన మగవారందరూ సున్నతి పొందాలి. అప్పుడు అతడు దానిని ఆచరించడానికి సమీపించవచ్చు; అతడు దేశంలో పుట్టినవానిలా ఉంటాడు. అయితే సున్నతి పొందని ఏ మగవాడూ పస్కాలో తినకూడదు.
