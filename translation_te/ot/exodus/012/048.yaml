id: EXO.12.48
reference: Exodus 12:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: te
  text: నీతో పాటు ఒక పరదేశి నివసిస్తూ యెహోవాకు పస్కాను ఆచరించదలిస్తే, అతనికి చెందిన మగవారందరూ సున్నతి పొందాలి. అప్పుడు అతడు దానిని ఆచరించడానికి సమీపించవచ్చు; అతడు దేశంలో పుట్టినవానిలా ఉంటాడు. అయితే సున్నతి పొందని ఏ మగవాడూ పస్కాలో తినకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు మధ్య స్థిరంగా నివసించే స్థానికేతరుణ్ని సూచిస్తుంది; కేవలం ప్రయాణికుడు లేదా అపరిచితుడు అనే భావం కాదు.
- source_word: יָגוּר אִתְּךָ
  choice: నీతో పాటు ... నివసిస్తూ
  rationale: גור క్రియలోని పరదేశిగా నివసించే దీర్ఘకాలిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָשָׂה פֶסַח
  choice: పస్కాను ఆచరించాలనుకుంటే
  rationale: అక్షరార్థంగా ‘పస్కాను చేయడం’; షరతుతో కూడిన సందర్భంలో తరువాతి అర్హత నియమానికి ముందున్న ఉద్దేశాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా ఉంచి, ל ఉపసర్గలోని అంకిత/దిశ భావాన్ని ‘కు’తో తెలియజేస్తుంది.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: అతనికి చెందిన మగవారందరూ సున్నతి పొందాలి
  rationale: అతని ఇంటివారు లేదా అతనికి చెందిన సమూహంలోని ప్రతి మగవానికి వర్తించే తప్పనిసరి నియమాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: అప్పుడు అతడు దానిని ఆచరించడానికి సమీపించవచ్చు
  rationale: కేవలం భౌతికంగా దగ్గరకు రావడం కాక, అర్హత పొందిన తరువాత ఆ ఆచారంలో పాల్గొనే అనుమతిని కూడా నిలుపుతుంది.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: దేశంలో పుట్టినవానిలా
  rationale: אֶזְרַחలోని ఆ దేశపు స్థానిక జన్ముడు/సమాజ సభ్యుడు అనే న్యాయసామాజిక పోలికను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: עָרֵל
  choice: సున్నతి పొందని ఏ మగవాడూ
  rationale: హీబ్రూ పదం పుంలింగ ఏకవచనంలో ఉండటాన్ని, వెంటనే ముందున్న ప్రతి మగవాని సున్నతి సందర్భాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: לֹא יֹאכַל בּוֹ
  choice: దానిలోనిది తినకూడదు
  rationale: పస్కా భోజనంలో భాగం తినడానికి అనుమతి లేదనే నిషేధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత దైవనామంగా ఉంచుతుంది; తెలుగులో విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: పరదేశి పస్కాలో పాల్గొనే అర్హత
  choice: అతనికి చెందిన మగవారందరూ సున్నతి పొందిన తరువాత అతడు పాల్గొనవచ్చు
  alternative: జాతి ఆధారంగా పూర్తిగా మినహాయించడం; ఒడంబడిక గుర్తును అవసరం లేదని చేయడం
  rationale: మూలపాఠం పరదేశిని చేర్చుతుంది, అయితే సున్నతి అనే షరతును నిలుపుతుంది; ఈ రెండింటి మధ్య ఉన్న వేదాంత ఉద్రిక్తతను తరువాతి సిద్ధాంతాలతో పరిష్కరించలేదు.
- issue: עָרֵל పరిధి
  choice: సున్నతి పొందని మగవాడు
  alternative: సున్నతి పొందని వ్యక్తి
  rationale: సున్నతి ఆజ్ఞ మగవారిని ఉద్దేశించిన తక్షణ సందర్భాన్ని, హీబ్రూ పుంలింగ రూపాన్ని అనుసరిస్తుంది; స్త్రీలపై అసంబద్ధమైన శారీరక నియమాన్ని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయవిధి స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పస్కా’, ‘సున్నతి’ వంటి స్థిరమైన బైబిలు పదాలను ఉపయోగించింది.
