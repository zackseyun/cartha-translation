id: EXO.12.12
reference: Exodus 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: te
  text: ఎందుకంటే ఈ రాత్రి నేను ఐగుప్తు దేశం గుండా వెళ్తాను[a]. ఐగుప్తు దేశంలోని ప్రతి తొలిసంతానాన్ని—మనిషి మొదలుకొని పశువు వరకు[b]—కొడతాను. ఐగుప్తు దేవుళ్లందరి మీద తీర్పులు అమలు చేస్తాను. నేనే యాహ్వేను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఐగుప్తు దేశం మధ్యగా వెళ్తాను.’ ఇక్కడి క్రియ దేశం గుండా వెళ్లడాన్ని సూచిస్తుంది; కాపాడే అర్థంలో ‘దాటివెళ్లడం’ కాదు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ మూలంలో అక్షరార్థంగా: ‘మనిషి నుండి పశువు వరకు.’'
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: YHWH (יהוה); దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని కూడా అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: నేను ... గుండా వెళ్తాను
  rationale: עבר అనే క్రియ בְאֶרֶץ‌తో కలిసి దేశం మధ్యగా ప్రయాణించడాన్ని సూచిస్తుంది; కాపాడే అర్థంలోని ‘దాటివెళ్తాను’ అనే భావాన్ని ఇక్కడ కలపదు.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం
  rationale: భౌగోళిక పరిధిని స్పష్టంగా ఉంచేందుకు אֶרֶץ‌ను ‘దేశం’గా నిలిపాం.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: ఈ రాత్రి
  rationale: సూచక పదంలోని ప్రత్యేక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהִכֵּיתִי
  choice: హతం చేస్తాను
  rationale: נכה ప్రాథమికంగా ‘కొట్టు/దెబ్బతీయు’ అయినా, ఈ సందర్భంలో తొలిసంతానం మరణించడమే ఉద్దేశం; ‘హతం చేస్తాను’ తెలుగులో సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: כָּל בְּכוֹר
  choice: ప్రతి తొలిసంతానాన్ని
  rationale: ఏకవచన సమూహార్థాన్ని ‘ప్రతి’తో చూపిస్తూ, హీబ్రూలో లేని పురుషలింగ సూచనను జోడించలేదు.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: మనిషి మొదలుకొని పశువు వరకు
  rationale: మానవుల నుంచి జంతువుల వరకు వ్యాపించే సంపూర్ణ పరిధిని హీబ్రూ ద్వంద్వ నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: ఐగుప్తు దేవుళ్లందరి మీద
  rationale: చర్య ఎవరికి వ్యతిరేకంగా ఉందో చూపిస్తూ, אֱלֹהִים‌ను ‘విగ్రహాలు’గా నిర్వీర్యం చేయకుండా ‘దేవుళ్లు’గానే అనువదిస్తుంది.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: తీర్పులు అమలు చేస్తాను
  rationale: ఈ పదబంధంలోని న్యాయపరమైన బలాన్ని, బహువచనాన్ని నిలుపుతూ ఆధునిక తెలుగులో గంభీరంగా ఉంటుంది.
- source_word: אֲנִי יְהוָה
  choice: నేనే యెహోవాను
  rationale: אֲנִיలోని ఉద్ఘాటనను ‘నేనే’తో చూపించి, దేవుని వ్యక్తిగత నామమైన יהוהను లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యం పొందిన రూపంలో నిలిపాం.
- issue: אֱלֹהֵי מִצְרַיִם యొక్క స్థితి
  choice: ఐగుప్తు దేవుళ్లు
  alternative: ఐగుప్తు విగ్రహాలు
  rationale: హీబ్రూ పాఠం నేరుగా ‘దేవుళ్లు’ అంటుంది. వారి అస్తిత్వ స్వభావంపై అదనపు నిర్ణయం చొప్పించకుండా, వారిమీద దేవుడు తీర్పు చేస్తాడనే వాక్యంలోని ఉద్రిక్తతను నిలిపాం.
- issue: וְהִכֵּיתִי యొక్క సందర్భార్థం
  choice: హతం చేస్తాను
  alternative: కొడతాను
  rationale: క్రియకు విస్తృతంగా ‘కొట్టు’ అనే అర్థం ఉన్నప్పటికీ, ఈ రాత్రి తొలిసంతానం మరణించడమే తక్షణ సందర్భం. అందువల్ల ఫలితాన్ని సహజమైన తెలుగులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘తొలిసంతానం’ లింగాన్ని అనవసరంగా నిర్దిష్టం చేయదు. ‘దేవుళ్లు’ అనే పదం మూలపాఠంలోని ధార్మిక ఉద్రిక్తతను తగ్గించదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
