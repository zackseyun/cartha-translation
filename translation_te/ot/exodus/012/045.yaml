  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: te
  text: నివసిస్తున్న పరదేశిగానీ, కూలివాడుగానీ దానిలోనుండి తినకూడదు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తాత్కాలిక నివాసి” లేదా “వలసవాసి.”'
    reason: lexical_alternative
  - marker: b
    text: అంటే పస్కా భోజనంలోనుండి; మరింత సంకుచితంగా చెప్పాలంటే పస్కా బలి పశువులోనుండి.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: స్థిరనివాసిగా ఉన్న పరదేశి
  rationale: ఈ పదం ఇశ్రాయేలీయుల మధ్య నివసిస్తున్నప్పటికీ సమాజంలో పూర్తిగా చేర్చబడని ఇశ్రాయేలీయేతర నివాసిని సూచిస్తుంది. ఈ అనువాదం నివాస స్థితినీ పరదేశితనాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׂכִיר
  choice: కూలికి పనిచేసేవాడు
  rationale: వేతనం లేదా కూలి కోసం పనిచేసే వ్యక్తిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: לֹא יֹאכַל
  choice: తినకూడదు
  rationale: న్యాయనియమ సందర్భంలోని నిషేధార్థక అసంపూర్ణ క్రియను తెలుగులో స్పష్టమైన విధినిషేధంగా వ్యక్తం చేస్తుంది.
- source_word: בּוֹ
  choice: దానిలోనుండి
  rationale: אכל తో వచ్చిన ב ఇక్కడ భాగార్థకంగా ఉంది—పస్కా భోజనం లేదా బలి పశువులోనుండి తినడాన్ని సూచిస్తుంది; సర్వనామం యొక్క సంక్షిప్తతను కూడా నిలుపుతుంది.
theological_decisions:
- issue: ‘దాని’ అనే సర్వనామం దేనిని సూచిస్తుంది?
  choice: సమీప సందర్భంలో ఏర్పాటుచేసిన పస్కా బలి పశువు లేదా పస్కా భోజనాన్ని సూచించే సంక్షిప్త సర్వనామంగానే ఉంచడం
  alternative: మరింత సంకుచితంగా ‘పస్కా గొర్రెపిల్ల’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ మూలంలో పూర్వపదం ఈ వాక్యంలో ప్రత్యక్షంగా లేదు; చుట్టుపక్కల పస్కా నియమాల నుంచే అర్థమవుతుంది. కాబట్టి మూలంలోని సంక్షిప్తతనూ దాని పరిధిలోని స్వల్ప అస్పష్టతనూ ప్రధాన పాఠ్యంలో నిలిపి, పాదసూచికలో వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన న్యాయనియమ శైలి. ‘తినకూడదు’ నిషేధాన్ని సహజంగా తెలియజేస్తుంది; ‘దానిలోనుండి’ మూలంలోని భాగార్థాన్నీ సందర్భాధారిత సర్వనామాన్నీ కాపాడుతుంది.
