source:
  edition: WLC
  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: te
  text: 'అప్పుడు మోషే ఇశ్రాయేలు పెద్దలందరినీ పిలిచి వారితో ఇలా అన్నాడు: “మీ కుటుంబాల కోసం మంద పశువులను వేరుచేసి తీసుకోండి[a]; పస్కా బలిపశువును వధించండి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వేరుచేసి” అని అనువదించిన హీబ్రూ క్రియకు అక్షరార్థంగా “లాగి బయటకు తీయండి” అనే భావం ఉంది; సందర్భానుసారం “ఎంచుకోండి” అనే అర్థమూ ఉండవచ్చు. హీబ్రూలో “వేరుచేయండి” మరియు “తీసుకోండి” అనే రెండు ఆజ్ఞలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “పస్కా.” ఇక్కడ అది పస్కా బలిని లేదా పస్కా కోసం వధించే పశువును సూచిస్తుంది; ఆ పశువు గొర్రెలలోనిది గానీ మేకలలోనిది గానీ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: ఈ సందర్భంలో పెద్దలను సూచనలు ఇవ్వడానికి పిలిపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ప్రజల గుర్తింపు పొందిన నాయకులు లేదా ప్రతినిధులను సూచించే స్థిరమైన, స్పష్టమైన ప్రయోగం.
- source_word: מִשְׁכוּ
  choice: బయటకు తోలి
  rationale: మూల క్రియలోని ‘లాగు/బయటకు తీసుకురా’ అనే స్పష్టమైన చలన భావాన్ని నిలుపుతూ, మంద పశువుల సందర్భంలో సహజంగా ఉంటుంది; ‘ఎంచుకోండి’ అనే భావవ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: וּקְחוּ
  choice: తీసుకోండి
  rationale: రెండవ ఆజ్ఞను మొదటి క్రియలో కలపకుండా ప్రత్యేకంగా నిలుపుతుంది.
- source_word: לָכֶם
  choice: మీ కోసం
  rationale: తమ తమ కుటుంబాల ఉపయోగార్థం పశువును తీసుకోవాలనే దత్తివాచక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: צֹאן
  choice: మంద పశువులు
  rationale: ఈ పదం గొర్రెలు, మేకలు రెండింటినీ కలుపుకోగల చిన్న పశువుల సమూహాన్ని సూచిస్తుంది; ‘గొర్రెపిల్లలు’ అని సంకుచితం చేయదు.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: మీ కుటుంబాలవారీగా
  rationale: కుటుంబ లేదా వంశ సమూహాల ప్రకారం పశువులను తీసుకోవాలనే పంపిణీ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשַׁחֲטוּ
  choice: వధించండి
  rationale: బలికి సంబంధించిన సందర్భంలో పశువును చంపడాన్ని గంభీరంగా, ఖచ్చితంగా తెలిపే సాధారణ తెలుగు పదం.
- source_word: הַפָּסַח
  choice: పస్కా బలిపశువు
  rationale: అక్షరార్థంగా ‘పస్కా’ అయినా, ఇక్కడ అది పస్కా కోసం వధించే పశువును సూచించే పర్యాయప్రయోగం; ‘బలిపశువు’ సూచితార్థాన్ని స్పష్టం చేస్తూ గొర్రెపిల్లకే పరిమితం చేయదు.
theological_decisions:
- issue: הַפָּסַח అనే పదం సూచించే విషయం
  choice: పస్కా బలిపశువు
  alternative: పస్కా; పస్కా బలి; పస్కా గొర్రెపిల్ల
  rationale: మూలంలో ‘పస్కా’ అనే పదమే ఉన్నప్పటికీ, ఆజ్ఞలో అది వధించబడే పశువును సూచిస్తుంది. నిర్గమకాండము 12:5 ప్రకారం అది గొర్రెలలోనిది లేదా మేకలలోనిది కావచ్చు కాబట్టి ‘గొర్రెపిల్ల’ అని సంకుచితం చేయకుండా సూచిత బలి భావాన్ని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘మంద పశువులు’ ద్వారా צֹאן యొక్క విస్తృత అర్థాన్ని, ‘పస్కా బలిపశువు’ ద్వారా הַפָּסַח యొక్క సందర్భానుగత సూచితార్థాన్ని నిలిపాం. మూలంలోని రెండు ఆజ్ఞాక్రియలను విడిగా ఉంచాం.
