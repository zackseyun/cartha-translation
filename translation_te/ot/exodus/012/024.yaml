id: EXO.12.24
reference: Exodus 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֖ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/חָק לְ/ךָ֥ וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: te
  text: మీరు ఈ విషయాన్ని మీకూ మీ కుమారులకూ శాశ్వతమైన శాసనంగా పాటించాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ సంగతి,’ లేదా ‘ఈ మాట.’ హీబ్రూ పదం ఒక విషయం, సంగతి లేదా పలికిన మాటను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీకు, మీ పిల్లలకు,’ లేదా ‘మీకు, మీ సంతతికి.’ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘మీ కుమారులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: పాటించాలి
  rationale: שׁמר అనే క్రియకు కాపాడటం, నిలుపుకోవటం, పాటించటం అనే భావాలు ఉన్నాయి. ధర్మశాసన సందర్భంలో ‘పాటించాలి’ అనేది ఆచరణాత్మక విధేయతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయాన్ని
  rationale: דָּבָר అనేది మాట, విషయం, సంగతి లేదా కార్యం అనే విస్తృత అర్థాలను కలిగి ఉంది. ఇక్కడ ముందుగా చెప్పిన పస్కా ఆచరణను సూచిస్తున్నందున ‘ఈ విషయం’ మూలంలోని విస్తృతిని అనవసరంగా కుదించదు.
- source_word: לְחָק
  choice: శాశ్వతమైన శాసనంగా
  rationale: חֹק అనేది నిర్ణయించబడిన నియమం లేదా శాసనాన్ని సూచిస్తుంది. ‘శాసనం’ దాని న్యాయపరమైన, నిబంధనాత్మక బలాన్ని కాపాడుతుంది; ‘శాశ్వతమైన’ అనేది వాక్యాంతంలోని עַד עוֹלָםతో భావసహజంగా అనుసంధానించబడింది.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: మీకూ మీ కుమారులకూ
  rationale: హీబ్రూ పాఠంలో అక్షరార్థంగా ‘నీకు, నీ కుమారులకు’ అని ఉంది. సమూహాన్ని ఉద్దేశించిన సందర్భానికి అనుగుణంగా తెలుగులో గౌరవ/బహువచన రూపమైన ‘మీకు’ వాడుతూ, ‘కుమారులు’ అనే మూలపదాన్ని నిలిపాం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతమైన
  rationale: עַד עוֹלָם నిరంతరమైన లేదా శాశ్వత కాలాన్ని సూచిస్తుంది. తెలుగులో ‘శాశ్వతమైన శాసనం’ అనే నిర్మాణం సహజంగా ఉండి, కొనసాగుతున్న బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘మీ కుమారులు’ అనే నిబంధన వారసత్వ భాష యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘మీ కుమారులు’ అని మూలరూపాన్ని నిలపడం
  alternative: ‘మీ పిల్లలు’ లేదా ‘మీ సంతతి’
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘కుమారులు’ అంటుంది. అది కుటుంబ లేదా తరతరాల వారసత్వాన్ని ప్రతినిధిగా సూచించే అవకాశం ఉన్నప్పటికీ, ఆ విస్తృత వ్యాఖ్యానాన్ని ప్రధాన అనువాదంలో మూలపదానికి బదులుగా పెట్టకుండా పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆజ్ఞార్థక బలాన్ని ‘పాటించాలి’ ద్వారా, నిబంధనాత్మక భావాన్ని ‘శాసనం’ ద్వారా నిలిపాం. మూలంలోని ద్వితీయ పురుష బహువచన సంబోధనకు అనుగుణంగా ‘మీరు/మీకు’ రూపాలు వాడాం.
