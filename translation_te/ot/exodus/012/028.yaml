  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు కుమారులు[a] వెళ్లి అలాగే చేశారు; యాహ్వే మోషేకు, అహరోనుకు ఆజ్ఞాపించినట్టే వారు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “ఇశ్రాయేలీయులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లి
  rationale: הלך క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలో ఆజ్ఞలను అమలు చేయడానికి వెళ్లారని సూచించినా, మూలక్రియకు మించి వివరించకుండా ‘వెళ్లి’ అని అనువదించాం.
- source_word: וַיַּעֲשׂוּ
  choice: అలాగే చేశారు
  rationale: עשה ఇక్కడ ముందుగా ఇచ్చిన పస్కా ఆదేశాల అమలును సూచిస్తుంది. ‘అలాగే చేశారు’ పూర్వసూచనను సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పురుషలింగ కుటుంబ సంబంధ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; మరింత సహజమైన సమూహనామాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כַּאֲשֶׁר
  choice: ఆజ్ఞాపించినట్టే
  rationale: ఆజ్ఞకూ ఆచరణకూ ఉన్న ఖచ్చితమైన అనుగుణతను ‘-ట్టే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: యెహోవా ఇచ్చిన ఆజ్ఞ ఇశ్రాయేలీయుల చర్యకు ముందున్నదని తెలుగు సంబంధ క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: మోషేకు, అహరోనుకు
  rationale: אֶת మోషేను, అహరోనును ఆజ్ఞ స్వీకరించిన ప్రత్యక్ష కర్మలుగా సూచిస్తుంది; తెలుగు ‘ఆజ్ఞాపించు’ క్రియతో సహజంగా చతుర్థీ విభక్తి వాడబడుతుంది.
- source_word: כֵּן עָשׂוּ
  choice: వారు చేశారు
  rationale: చివరి పునరుక్తి సంపూర్ణ విధేయతను నొక్కిచెబుతుంది. ముందున్న ‘ఆజ్ఞాపించినట్టే’తో కలిపి తెలుగు వాక్యంలో ‘వారు చేశారు’ సహజమైన ముగింపునిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: בְּנֵי יִשְׂרָאֵל వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుషలింగ కుటుంబ సంబంధ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన జాతి-సమూహ సూచనను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని అనుసరించాం. హీబ్రూ పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా విభక్తులను మార్చాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
