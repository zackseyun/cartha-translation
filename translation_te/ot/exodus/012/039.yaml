    issue: The causal relation is reversed in the middle sentences.
    rationale: 'The draft says, in effect, that because they were expelled and could not delay, therefore the dough did not leaven, but its sentence order and ‘అందువల్ల’ make the unleavened dough appear to be a consequence stated after the expulsion clause rather than preserving the Hebrew’s explicit rationale: they baked unleavened cakes because the dough had not leavened; it had not leavened because they had been driven out and could not delay.'
  revised_text: వారు ఐగుప్తు నుండి తెచ్చిన పిండితో పులియని రొట్టెలు కాల్చారు; ఆ పిండి పులియలేదు, ఎందుకంటే వారిని ఐగుప్తు నుండి వెళ్లగొట్టారు మరియు వారు ఆలస్యం చేయలేకపోయారు. అంతేకాక, వారు తమ కోసం ప్రయాణపు ఆహారం కూడా సిద్ధం చేసుకోలేదు.
