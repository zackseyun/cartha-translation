id: EXO.12.39
reference: Exodus 12:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: te
  text: వారు ఐగుప్తు నుండి తెచ్చిన పిండితో పులియని రొట్టెలు కాల్చారు; ఆ పిండి పులియలేదు, ఎందుకంటే వారిని ఐగుప్తు నుండి వెళ్లగొట్టారు మరియు వారు ఆలస్యం చేయలేకపోయారు. అంతేకాక, వారు తమ కోసం ప్రయాణపు ఆహారం కూడా సిద్ధం చేసుకోలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: కాల్చారు
  rationale: రొట్టెలను వేడితో సిద్ధం చేయడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు క్రియ.
- source_word: הַבָּצֵק
  choice: పిండి
  rationale: בצק అంటే కలిపి సిద్ధం చేసిన dough; సందర్భంలో ‘పిండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: ఐగుప్తు నుండి తెచ్చిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֻגֹת מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: עֻגֹת అనేది గుండ్రని రొట్టెలను/రొట్టె ముద్దలను, מַצּוֹת పులియని స్వభావాన్ని సూచిస్తాయి; ‘రొట్టెలు’ సాధారణ పాఠకులకు ‘కేకులు’ కంటే సరైన భావాన్ని ఇస్తుంది.
- source_word: כִּי לֹא חָמֵץ
  choice: అందువల్ల ఆ పిండి పులియలేదు
  rationale: חמץ అనే క్రియ పిండి పులిసిన స్థితికి చేరడాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో కారణక్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: వారు ఐగుప్తు నుండి వెళ్లగొట్టబడ్డారు కాబట్టి
  rationale: גורשׁ యొక్క బలవంతపు బహిష్కరణ భావాన్ని కర్మణి రూపంలో నిలుపుతుంది.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: ఆలస్యం చేయలేకపోయారు
  rationale: התמהמה యొక్క ఆలస్యం చేయడం లేదా తాత్సారం చేయడం అనే భావాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: צֵדָה
  choice: ప్రయాణపు ఆహారం
  rationale: צֵדָה ప్రయాణానికి సిద్ధం చేసుకునే ఆహార సామగ్రిని సూచిస్తుంది; ‘సరఫరాలు’ కంటే సందర్భానుకూలంగా స్పష్టంగా ఉంటుంది.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: వారు తమ స్వంత ఉపయోగం కోసం ఏర్పాటుచేసుకోలేదనే ప్రతిబింబార్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ మూలంలోని తొందరపాటు, బలవంతపు బయలుదేరడం, పిండి పులియకపోవడం మధ్య కారణ సంబంధం నిలుపబడింది.
