  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. హీబ్రూ సమష్టి ఏకవచనాన్ని తెలుగులో సహజమైన బహువచనంగా అందించాం; పాత్రల ఆకారానికి సంబంధించిన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
