  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: te
  text: అప్పుడు ప్రజలు తమ పిండి పులియకముందే మోసుకెళ్లారు; తమ పిండి కలిపే పాత్రలను పైవస్త్రాల్లో మూటకట్టి భుజాలపై మోసుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పిండి కలిపే పాత్రలు’ అనే హీబ్రూ పదం పిండి సిద్ధం చేయడానికి ఉపయోగించే గిన్నెలను లేదా తొట్టెలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: మోసుకెళ్లారు
  rationale: నిష్క్రమణ సందర్భంలో వస్తువులను ఎత్తుకొని తమతో తీసుకెళ్లడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోసుకెళ్లారు’ సహజంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇక్కడ ఇశ్రాయేలీయుల సమూహాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: בְּצֵקוֹ
  choice: తమ పిండి
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా ఏకవచనమైనా, సమష్టి కర్తను తెలుగులో సహజంగా బహువచన సంబంధంతో వ్యక్తం చేశాం.
- source_word: טֶרֶם יֶחְמָץ
  choice: పులియకముందే
  rationale: పిండి ఇంకా పులిసే ప్రక్రియకు లోనుకాలేదనే భావాన్ని సంక్షిప్తంగా, పస్కా సందర్భానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: מִשְׁאֲרֹתָם
  choice: పిండి కలిపే తమ పాత్రలు
  rationale: పిండి సిద్ధం చేయడానికి వాడే పాత్రలను సూచించే పదం; వాటి ఖచ్చిత ఆకారం నిర్ధారించకుండా ఉపయోగాన్ని స్పష్టంగా తెలిపే సహజమైన పదబంధం.
- source_word: צְרֻרֹת
  choice: మూటకట్టి
  rationale: ప్రయాణానికి అనువుగా వస్తువులను వస్త్రాల్లో చుట్టి కట్టిన దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשִׂמְלֹתָם
  choice: తమ పైవస్త్రాల్లో
  rationale: שִׂמְלָה సాధారణంగా బయటి వస్త్రాన్ని సూచిస్తుంది; ‘పైవస్త్రాలు’ మూలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: עַל שִׁכְמָם
  choice: భుజాల మీద
  rationale: సమష్టి కర్తలోని వ్యక్తులు మూటలను తమ భుజాలపై మోసిన భావాన్ని సహజమైన బహువచన తెలుగులో వ్యక్తం చేస్తుంది.
