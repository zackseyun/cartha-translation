- from: మీరు పులియని రొట్టెల ఆచారాన్ని[a] పాటించాలి; ఎందుకంటే సరిగ్గా ఈ రోజునే నేను మీ దళాలను[b] ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. మీరు తరతరాలుగా ఈ రోజును శాశ్వతమైన నియమంగా[c] పాటించాలి.
