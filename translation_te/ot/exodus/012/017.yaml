review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the repeated ritual imperative, the emphatic 'on this very day,' the bringing out from Egypt, Israel's organized 'hosts,' and ongoing generational observance. Rendering הַמַּצּוֹת as an observance is contextually defensible, and the footnote appropriately preserves the literal food-related wording.
  naturalness: The wording is generally clear modern standard Telugu. However, “సరిగ్గా ఈ రోజునే” is slightly redundant and less idiomatic for the Hebrew emphasis; “ఈ రోజునే” naturally conveys the emphatic force. “శాశ్వతమైన నియమం” can suggest an unqualified metaphysical eternity more strongly than the contextual covenantal idiom requires; “శాశ్వత నియమం” is smoother and retains the conventional enduring sense.
  terminology: “పాటించాలి” consistently renders the two occurrences of שׁמר well in this ritual context. “దళాలు” suitably conveys the ordered-company nuance of צבאות without forcing a claim that Israel is being called an army. The footnotes are accurate and their anchors are correctly placed.
  issues:
  - severity: low
    issue: Slightly redundant rendering of the emphatic day expression
    rationale: “సరిగ్గా ఈ రోజునే” combines two Telugu emphatic devices. “ఈ రోజునే” is natural and adequately reflects בְּעֶצֶם הַיּוֹם הַזֶּה.
  - severity: low
    issue: Potential overstatement in “శాశ్వతమైన నియమంగా”
    rationale: While defensible, the fuller adjectival form may be heard as an absolute philosophical claim. “శాశ్వత నియమంగా” is idiomatic Telugu and communicates the enduring statutory force of חֻקַּת עוֹלָם without expanding it.
  revised_text: మీరు పులియని రొట్టెల ఆచారాన్ని[a] పాటించాలి, ఎందుకంటే ఈ రోజునే నేను మీ దళాలను[b] ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. మీరు తరతరాలుగా ఈ రోజును శాశ్వత నియమంగా[c] పాటించాలి.
