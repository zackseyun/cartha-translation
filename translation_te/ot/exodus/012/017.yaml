source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: te
  text: మీరు పులియని రొట్టెల ఆచారాన్ని[a] పాటించాలి, ఎందుకంటే ఈ రోజునే నేను మీ దళాలను[b] ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చాను. మీరు తరతరాలుగా ఈ రోజును శాశ్వత నియమంగా[c] పాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పులియని రొట్టెలను.’ ఈ మాట రొట్టెలనే గానీ, వాటికి సంబంధించిన పండుగ ఆచరణను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీ సమూహాలను,’ ‘మీ విభాగాలను.’ హీబ్రూ పదం క్రమబద్ధంగా బయలుదేరిన ప్రజాసమూహాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఎల్లకాలం ఉండే నియమంగా,’ ‘నిరంతర నియమంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: పాటించాలి
  rationale: ఆచార సంబంధ సందర్భంలో שׁמר అంటే కాపాడడం మాత్రమే కాక ఆచరించడం లేదా పాటించడం. పద్యంలో రెండుసార్లు వచ్చిన క్రియకు ఒకే సహజ తెలుగు పదాన్ని వాడాం.
- source_word: הַמַּצּוֹת
  choice: పులియని రొట్టెల ఆచారాన్ని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పులియని రొట్టెలు/వస్తువులు’ అని ఉంది; సందర్భంలో అది రొట్టెలను లేదా వాటికి సంబంధించిన పండుగ ఆచరణను సూచించవచ్చు. ‘ఆచారం’ ఈ సందర్భార్థాన్ని తెలుపుతుంది; మూలంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: సరిగ్గా ఈ రోజునే
  rationale: עֶצֶם కలిగిన ఈ పదబంధం అదే నిర్దిష్ట దినాన్ని బలంగా నొక్కిచెబుతుంది.
- source_word: הוֹצֵאתִי
  choice: నేను ... బయటకు తీసుకొచ్చాను
  rationale: יצא హిఫీల్ రూపానికి ‘బయటకు తీసుకురావడం’ సహజమైన, క్రియాత్మకమైన తెలుగు సమానం.
- source_word: צִבְאוֹתֵיכֶם
  choice: మీ దళాలను
  rationale: צָבָא వ్యవస్థీకృత సమూహం, సైన్యం లేదా దళాన్ని సూచిస్తుంది. ఇక్కడ ఇశ్రాయేలీయులు క్రమబద్ధమైన సమూహాలుగా బయలుదేరిన భావాన్ని ‘దళాలు’ నిలుపుతుంది.
- source_word: לְדֹרֹתֵיכֶם
  choice: తరతరాలుగా
  rationale: తదనంతర తరాలన్నిటిలో కొనసాగవలసిన ఆచరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֻקַּת עוֹלָם
  choice: శాశ్వతమైన నియమంగా
  rationale: חֻקָּה నిర్దేశిత నియమాన్ని, עוֹלָם దీర్ఘకాలిక లేదా నిరంతర చెల్లుబాటును సూచిస్తాయి. ప్రత్యామ్నాయ భావ ఛాయను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: הַמַּצּוֹת ఆహారాన్నే సూచిస్తుందా, లేక పండుగ ఆచరణను సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో ‘పులియని రొట్టెల ఆచారం’ అని అనువదించడం
  alternative: ‘పులియని రొట్టెలు’ లేదా ‘పులియని రొట్టెల పండుగ’
  rationale: క్రియకు కర్మగా వచ్చిన సందర్భం పండుగ ఆచరణను సూచిస్తున్నప్పటికీ, మూలపదంలో ‘పండుగ’ అనే నామవాచకం లేదు. అందువల్ల ప్రధాన పాఠ్యం సందర్భార్థాన్ని సహజంగా అందించి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: חֻקַּת עוֹלָם యొక్క కాలవ్యాప్తి
  choice: ‘శాశ్వతమైన నియమంగా’
  alternative: ‘ఎల్లకాలం ఉండే నియమంగా’ లేదా ‘నిరంతర నియమంగా’
  rationale: ఒడంబడిక సంబంధ నిరంతర బాధ్యతను బలంగా వ్యక్తం చేస్తూనే, దాని తాత్త్విక పరిధిని అనువాదంలో అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని క్రియ పునరుక్తిని ‘పాటించాలి’ ద్వారా నిలిపి, పండుగ/రొట్టెల భావసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
