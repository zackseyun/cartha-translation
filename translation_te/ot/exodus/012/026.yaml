  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: te
  text: మీ కుమారులు మీతో, “ఈ సేవ మీకు ఏమిటి?[a]” అని చెప్పినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా భావాన్ని స్పష్టంగా చెబితే, “ఈ సేవకు మీ దృష్టిలో అర్థం ఏమిటి?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: అడిగినప్పుడు
  rationale: ఈ హెబ్రీ సూత్రప్రయోగం భవిష్యత్తులో సంభవించే సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు జరుగుతుంది’ అని విడిగా చెప్పడం కంటే కాలార్థక ‘-నప్పుడు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: మిమ్మల్ని ... అని అడిగినప్పుడు
  rationale: אמר యొక్క మౌలిక అర్థం ‘చెప్పు’; అయితే ఇక్కడ పలికేది ప్రత్యక్ష ప్రశ్న కాబట్టి ఆధునిక తెలుగులో ‘అడుగు’ సహజం. ‘మిమ్మల్ని’ బహువచన సంబోధనను నిలుపుతుంది.
- source_word: בְּנֵיכֶם
  choice: మీ కుమారులు
  rationale: హెబ్రీ పదం స్పష్టంగా పుంలింగ బహువచనం ‘కుమారులు’; దాన్ని లింగతటస్థమైన ‘పిల్లలు’గా విస్తరించలేదు.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ఈ సేవ
  rationale: עֲבֹדָה పని, సేవ, ఆచారసంబంధ సేవ అనే అర్థవిస్తృతిని కలిగి ఉంది. పస్కా సందర్భంలో ‘సేవ’ ఆచారం లేదా ఆరాధన అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: מָה ... לָכֶם
  choice: మీకు ఏమిటి?
  rationale: హెబ్రీ వాక్యనిర్మాణాన్ని సమీపంగా నిలుపుతూ, ఈ సేవకు సంబోధితులతో ఉన్న సంబంధం లేదా ప్రాముఖ్యత ఏమిటనే సహజ అస్పష్టతను పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ప్రశ్న సేవ యొక్క అర్థాన్నా, స్వభావాన్నా, లేక సంబోధితులకు దాని ప్రాముఖ్యతనైనా అడుగుతోందా
  choice: ‘ఈ సేవ మీకు ఏమిటి?’ అని మూలంలోని సంక్షిప్త, తెరచిన ప్రశ్నను నిలుపడం
  alternative: ‘ఈ సేవ మీకు ఏ అర్థాన్ని ఇస్తుంది?’
  rationale: ‘అర్థం’ను చేర్చడం సాధ్యమైన ఉద్దేశాన్ని స్పష్టంలాగ వివరించినా, హెబ్రీలోని భావపరమైన విస్తృతిని కుదిస్తుంది. అందువల్ల ప్రధాన పాఠంలో దాన్ని పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష ప్రశ్నను సులభంగా ఉంచి, ‘కుమారులు’ మరియు ‘సేవ’ ద్వారా మూలపదాల నిర్దిష్టత, అర్థవిస్తృతిని కాపాడాం.
