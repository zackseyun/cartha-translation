  text: 'యెహోవా ఐగుప్తు దేశంలో మోషేకు, అహరోనుకు ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను తెలుగులో సుపరిచితమైన నామరూపంతో ప్రతిబింబిస్తుంది; సాధారణ బిరుదుతో భర్తీ చేయదు.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలో
  rationale: స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా ఉంచుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ ఉద్ధరణ-పరిచయ సూత్రాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; తరువాతి ప్రత్యక్ష వాక్యానికి ద్విబిందువు అనుకూలం.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: మోషేతో, అహరోనుతో
  rationale: ఇద్దరూ వాక్యాన్ని స్వీకరించినవారనే సమాన సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపంలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే ప్రత్యక్ష వాక్యశైలి. మూలంలోని వాక్యారంభ וַ־ను ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా సహజ కథన క్రమంగా వ్యక్తపరిచింది.
