reference: Exodus 12:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: te
  text: ఐగుప్తీయులు ప్రజలను దేశం నుండి త్వరగా పంపివేయాలని వారిపై బలంగా ఒత్తిడి చేశారు[a]; ఎందుకంటే, “మనమంతా చనిపోతున్నాం!” అని వారు అన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని దేశం నుండి పంపివేయడానికి త్వరపడుతూ.” హీబ్రూలో వరుసగా ఉన్న రెండు క్రియానామ రూపాలు తీవ్రమైన తొందరను వ్యక్తం చేస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మనమంతా చనిపోయినవారమే!”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַתֶּחֱזַק ... עַל הָעָם
  choice: ప్రజలపై గట్టిగా ఒత్తిడి చేశారు
  rationale: חזק + עַל ఇక్కడ శారీరక బలాన్ని కాక, ఒకరిని బలంగా ఒత్తిడి చేయడం లేదా తొందరపెట్టడం అనే భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: מִצְרַיִם
  choice: ఐగుప్తీయులు
  rationale: స్థలనామమైన ‘ఐగుప్తు’ ఇక్కడ సమష్టిగా ఆ దేశ ప్రజలను సూచిస్తోంది; వ్యక్తుల సమూహం స్పష్టంగా ఉండేందుకు ‘ఐగుప్తీయులు’ అని అనువదించబడింది.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: వెంటనే పంపివేయాలని
  rationale: వరుసగా ఉన్న రెండు క్రియానామ రూపాలు పంపివేయడంలో ఉన్న తీవ్రమైన తొందరను వ్యక్తం చేస్తున్నాయి. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘వెంటనే పంపివేయాలని’ అని ఇచ్చాం.
- source_word: מִן הָאָרֶץ
  choice: దేశం నుండి
  rationale: మూలంలో అక్షరార్థంగా ‘ఆ దేశం నుండి’ ఉంది; సందర్భంలో అది ఐగుప్తు దేశాన్ని సూచిస్తుంది. సందర్భ స్పష్టతను కాపాడుతూ మూలరూపానికి దగ్గరగా ‘దేశం నుండి’ అని ఇచ్చాం.
- source_word: כֻּלָּנוּ מֵתִים
  choice: మనమంతా చనిపోయినవాళ్లమే
  rationale: מֵתִים అనే రూపం ‘చనిపోయినవారు’ అనే స్థితిని లేదా సందర్భానుసారంగా సమీపిస్తున్న మరణాన్ని సూచించగలదు. ఐగుప్తీయుల భయభ్రాంతితో కూడిన ‘మనం ఇక బతకము’ అనే నిశ్చయాన్ని ఈ ప్రయోగం బలంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: מֵתִים అనే పదంలో ‘చనిపోయినవారు’ మరియు ‘చనిపోతున్నవారు’ మధ్య భావసంభావ్యత
  choice: ప్రధాన పాఠ్యంలో “చనిపోయినవాళ్లమే”
  alternative: “చనిపోతున్నాం”
  rationale: మూలంలోని సంక్షిప్తమైన, తీవ్ర నిరాశాభావాన్ని ప్రధాన పాఠ్యం నేరుగా నిలుపుతుంది. అయితే సందర్భంలో అది కొనసాగుతున్న లేదా సమీపిస్తున్న మరణాన్ని కూడా సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యంలోని అత్యవసరత మరియు ఐగుప్తీయుల భయాన్ని నిలుపుతూ అనువదించబడింది. ‘ఒత్తిడి చేశారు’ గౌరవప్రదమైన కథనశైలికి సరిపోతూ మూలంలోని బలవంతపు తొందరను తెలియజేస్తుంది.
