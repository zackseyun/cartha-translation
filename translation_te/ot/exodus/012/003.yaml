- from: '“ఇశ్రాయేలు సమాజమంతటితో ఇలా చెప్పండి: ‘ఈ నెల పదో రోజున ప్రతి పురుషుడు తన పితృకుటుంబం ప్రకారం ఒక గొర్రెపిల్లను[a], ఒక్కో ఇంటివారి కోసం ఒక గొర్రెపిల్లను తీసుకోవాలి.’”'
  to: '“ఇశ్రాయేలు సమాజమంతటికీ ఇలా చెప్పండి: ‘ఈ నెల పదో రోజున ప్రతి పురుషుడు తన తండ్రి వంశపు కుటుంబానికి ఒక గొర్రెపిల్లను[a], ప్రతి ఇంటివారి కోసం ఒక గొర్రెపిల్లను తీసుకోవాలి.’”'
  rationale: The revision corrects the direction of address required by אֶל, clarifies the patrilineal household sense of לְבֵית אָבֹת, and retains the repeated ‘one flock animal per household’ structure. The footnote more fully preserves the lexical breadth of שֶׂה without displacing the contextually established main-text rendering.
