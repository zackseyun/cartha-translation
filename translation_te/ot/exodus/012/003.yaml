source:
  edition: WLC
  text: דַּבְּר֗וּ אֶֽל כָּל עֲדַ֤ת יִשְׂרָאֵל֙ לֵ/אמֹ֔ר בֶּ/עָשֹׂ֖ר לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/יִקְח֣וּ לָ/הֶ֗ם אִ֛ישׁ שֶׂ֥ה לְ/בֵית אָבֹ֖ת שֶׂ֥ה לַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: te
  text: '“ఇశ్రాయేలు సమాజమంతటికీ ఇలా చెప్పండి: ‘ఈ నెల పదో రోజున ప్రతి పురుషుడు తన తండ్రి వంశపు కుటుంబానికి ఒక గొర్రెపిల్లను[a], ప్రతి ఇంటివారి కోసం ఒక గొర్రెపిల్లను తీసుకోవాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం שֶׂה గొర్రెపిల్లను మాత్రమే కాదు, గొర్రె లేదా మేక మందకు చెందిన చిన్న జంతువును కూడా సూచించగలదు; ఇందులో మేకపిల్ల కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటితో ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞను గౌరవపూర్వకమైన ఆధునిక తెలుగు రూపంలో చూపుతూ, עֵדָה సూచించే సమష్టి ప్రజాసమూహ భావాన్ని ‘సమాజమంతటి’ ద్వారా నిలిపింది.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: ఈ నెల పదో రోజున
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఈ నెల పదో తేదీన’ అనే కాలసూచనను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: ప్రతి పురుషుడు ... తీసుకోవాలి
  rationale: אִישׁ యొక్క పంపిణీ భావాన్నీ, ఈ నియమసందర్భంలోని ఆదేశార్థాన్నీ నిలుపుతుంది; లింగసూచనను సాధారణీకరించకుండా మూలరూపాన్ని అనుసరిస్తుంది.
- source_word: שֶׂה
  choice: గొర్రెపిల్ల
  rationale: שֶׂה గొర్రె లేదా మేక మందలోని చిన్న జంతువును సూచించగలిగినా, పస్కా సందర్భంలో స్థిరపడిన, సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే ‘గొర్రెపిల్ల’ను ప్రధాన పాఠ్యంలో వాడి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: לְבֵית אָבֹת
  choice: తన పితృకుటుంబం ప్రకారం
  rationale: పితృవంశ ఆధారిత విస్తృత కుటుంబ విభాగాన్ని సూచించే హీబ్రూ సామాజిక నిర్మాణాన్ని ‘పితృకుటుంబం’ కాపాడుతుంది; לְ యొక్క సంబంధార్థాన్ని సందర్భానుసారంగా ‘ప్రకారం’గా వ్యక్తం చేసింది.
- source_word: שֶׂה לַבָּיִת
  choice: ఒక్కో ఇంటివారి కోసం ఒక గొర్రెపిల్ల
  rationale: בַּיִת ఇక్కడ భవనాన్ని కాక గృహసభ్యుల సమూహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
