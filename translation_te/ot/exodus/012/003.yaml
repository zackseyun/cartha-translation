translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను నిలుపుతూ సులభంగా చదవదగిన శైలి వాడబడింది. ‘పితృకుటుంబం’ మూలంలోని వంశాధారిత కుటుంబ నిర్మాణాన్ని కాపాడుతుంది; ‘ఇంటివారు’ భౌతిక గృహం కంటే గృహసమూహాన్ని స్పష్టం చేస్తుంది.
