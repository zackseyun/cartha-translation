  text: שֶׂ֥ה תָמִ֛ים זָכָ֥ר בֶּן שָׁנָ֖ה יִהְיֶ֣ה לָ/כֶ֑ם מִן הַ/כְּבָשִׂ֥ים וּ/מִן הָ/עִזִּ֖ים תִּקָּֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: te
  text: మీ గొర్రెపిల్ల[a] లోపంలేనిది, ఒక సంవత్సరం వయసున్న మగది అయి ఉండాలి; దానిని గొర్రెలనుండిగానీ మేకలనుండిగానీ తీసుకోవాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం שֶׂה మందలోని చిన్న పశువును విస్తృతంగా సూచించగలదు—అది గొర్రెపిల్లైనా మేకపిల్లైనా కావచ్చు. తరువాతి భాగం దానిని గొర్రెలనుండి లేదా మేకలనుండి తీసుకోవాలని స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: గొర్రెపిల్ల[a]
  rationale: שֶׂה అనేది గొర్రెపిల్లను లేదా మేకపిల్లను సూచించగల మందలోని చిన్న పశువుకు విస్తృత పదం. ప్రధాన వాక్యంలో సహజమైన ‘గొర్రెపిల్ల’ను వాడి, వెంటనే వచ్చే గొర్రెలు/మేకలు అనే ఎంపికను నిలిపి, విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: תָמִים
  choice: లోపంలేనిది
  rationale: బలి సందర్భంలో శారీరక లోపం లేదా కళంకం లేని పశువును సూచిస్తుంది; ‘లోపంలేనిది’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: זָכָר
  choice: మగది
  rationale: పశువు లింగాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: בֶּן שָׁנָה
  choice: ఏడాది వయసుగలది
  rationale: ‘ఒక సంవత్సరపు కుమారుడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం; పశువు వయస్సును తెలియజేస్తుంది.
- source_word: יִהְיֶה לָכֶם
  choice: మీరు తీసుకునే … ఉండాలి
  rationale: లָכֶםను విడిగా కృత్రిమంగా అనువదించకుండా, ఇశ్రాయేలీయులకు వర్తించే నిర్దేశాత్మక బలాన్ని ‘ఉండాలి’తో వ్యక్తం చేశాం.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: గొర్రెలలోనుండిగానీ మేకలలోనుండిగానీ
  rationale: అనుమతించబడిన రెండు ప్రత్యామ్నాయ మందలను సూచించే భావాన్ని తెలుగు ‘గానీ … గానీ’ నిర్మాణం సహజంగా నిలుపుతుంది.
- source_word: תִּקָּחוּ
  choice: తీసుకోవాలి
  rationale: రెండవ పురుష బహువచన నిర్దేశాన్ని ‘తీసుకోవాలి’ స్పష్టంగా వ్యక్తం చేస్తుంది; ‘దాన్ని’ అనే కర్మ ముందున్న ఏకవచన పశువునుంచి గ్రహించబడింది.
