translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన ఆజ్ఞారూప శైలి. హీబ్రూ వాక్యంలోని వంట విధానాల మధ్య వ్యత్యాసం మరియు సంపూర్ణ జంతువును భాగాలతో సహా కాల్చాలనే భావం స్పష్టంగా నిలుపబడ్డాయి.
