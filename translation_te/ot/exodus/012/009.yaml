  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: te
  text: దానిలోని దేనినీ పచ్చిగా గానీ, నీళ్లలో ఉడికించి గానీ తినకూడదు. దాని తలతో, కాళ్లతో, అంతర్భాగాలతో సహా దానిని నిప్పుమీద కాల్చి మాత్రమే తినాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “దాని తలను దాని కాళ్లతోను దాని అంతర్భాగాలతోను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: పచ్చిగా
  rationale: ఈ వంట సందర్భంలో అగ్నితో కాల్చని లేదా నీటిలో ఉడికించని మాంసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పచ్చిగా’ స్పష్టమైన సహజ సమానం.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: నీళ్లలో ఉడికించి
  rationale: బשל రూపాల పునరుక్తితో పాటు ‘నీళ్లలో’ అనే స్పష్టమైన పదబంధం ఉండటం ఉడకబెట్టడాన్ని నొక్కిచెబుతుంది; ఈ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם
  choice: మాత్రమే
  rationale: ముందు నిషేధించిన పద్ధతులకు విరుద్ధంగా అనుమతించబడిన ఏకైక పద్ధతిని సూచించే బలమైన మినహాయింపు భావాన్ని నిలుపుతుంది.
- source_word: צְלִי אֵשׁ
  choice: నిప్పుమీద కాల్చి
  rationale: అగ్ని ద్వారా కాల్చడాన్ని తెలుగులో సహజంగా, నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: దాని తలతో, కాళ్లతో, అంతర్భాగాలతో సహా
  rationale: జంతువును ఈ భాగాలతో కూడి కాల్చాలనే జాబితా భావాన్ని నిలుపుతుంది. ‘అంతర్భాగాలు’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆధునిక పదం.
- source_word: מִמֶּנּוּ
  choice: దానిలో దేనినీ
  rationale: హీబ్రూ భాగార్థక భావాన్ని నిషేధ వాక్యంలో సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
