revisions:
- from: వారు రక్తంలో కొంత తీసుకొని, దానిని తినే ఇళ్ల రెండు ద్వారబంధాల మీద, పై ద్వారబంధం మీద పూయాలి.[a]
  to: వారు రక్తంలోనుండి కొంత తీసుకొని, ఆ గొర్రెపిల్లను తినే ఇళ్ల రెండు ద్వారస్తంభాల మీదా, పై గడప మీదా పూయాలి.[a]
  rationale: The revision resolves the pronoun’s misleading possible reference to blood by naming the animal being eaten, as required by the immediate Passover context. It also uses distinct, natural Telugu terms for the vertical doorposts and the upper lintel while preserving the directive force and the English audit trail’s future alternative in the footnote.
  reviewer_model: gpt-5.6-terra
