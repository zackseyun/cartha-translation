base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: te
  text: వారు రక్తంలోనుండి కొంత తీసుకొని, ఆ గొర్రెపిల్లను తినే ఇళ్ల రెండు ద్వారస్తంభాల మీదా, పై గడప మీదా పూయాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ గొర్రెపిల్లను తినబోయే ఇళ్ల.” ఈ ఆదేశ సందర్భంలో హీబ్రూ అసంపూర్ణ క్రియారూపానికి భవిష్యత్ భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: వారు తీసుకొని
  rationale: ఆదేశాల క్రమంలో ఈ క్రియకు నిర్దేశాత్మక భావం ఉంది; తదుపరి ప్రధాన క్రియతో సహజమైన తెలుగులో అనుసంధానించబడింది.
- source_word: מִן הַדָּם
  choice: రక్తంలో కొంత
  rationale: מִן ఇక్కడ భాగార్థకంగా ఉంది; రక్తమంతా కాక దానిలో కొంత అని స్పష్టం చేస్తుంది.
- source_word: וְנָתְנוּ
  choice: పూయాలి
  rationale: נתן యొక్క మూల భావం ‘పెట్టడం’; రక్తాన్ని ద్వారబంధాలపై ఉంచే ఈ సందర్భంలో ‘పూయాలి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: రెండు ద్వారబంధాల మీద
  rationale: מְזוּזוֹת ద్వారానికి ఇరువైపులా ఉన్న నిలువు చట్ర భాగాలను సూచిస్తుంది; ‘ద్వారబంధాలు’ ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: పై ద్వారబంధం మీద
  rationale: מַשְׁקוֹף ద్వారం పైనున్న అడ్డ భాగాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి అర్థమయ్యేలా ‘పై ద్వారబంధం’ వాడబడింది.
- source_word: עַל הַבָּתִּים
  choice: ఇళ్ల ... ద్వారబంధాల మీద
  rationale: హీబ్రూ עַל הַבָּתִּים ఆ ద్వార భాగాలు ఏ ఇళ్లవో గుర్తిస్తుంది; తెలుగులో సంబంధాన్ని ఈ పదక్రమం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: దానిని తినే ఇళ్ల
  rationale: సంబంధవాచక వాక్యం ఇళ్లను విశేషిస్తుంది. అసంపూర్ణ క్రియారూపాన్ని విధానాత్మక సందర్భంలో సాధారణ వర్తమానంగా అనువదించి, భవిష్యత్ భావసాధ్యతను పాదసూచికలో ఉంచాం.
