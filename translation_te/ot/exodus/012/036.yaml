source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: te
  text: యెహోవా ఐగుప్తీయుల దృష్టిలో ప్రజలకు అనుకూలత కలిగించాడు; అందువల్ల ఐగుప్తీయులు ఇశ్రాయేలీయులు అడిగినవాటిని వారికి ఇచ్చారు[a]. ఆ విధంగా ఇశ్రాయేలీయులు ఐగుప్తును దోచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సాంప్రదాయికంగా, “ఐగుప్తీయులు వారికి అప్పుగా ఇచ్చారు.” ఇక్కడి హీబ్రూ క్రియను అప్పుగా ఇవ్వడం అనీ, అడిగినవాటిని ఇవ్వడం అనీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుగా కాకుండా పేరుగా పారదర్శకంగా ప్రతిబింబించే, తెలుగులో సుపరిచితమైన రూపం.
- source_word: נָתַן אֶת־חֵן
  choice: అనుగ్రహం కలిగించాడు
  rationale: అక్షరార్థంగా ‘అనుగ్రహం ఇచ్చాడు’; తెలుగులో ఒకరి దృష్టిలో అనుకూల వైఖరి ఏర్పడటాన్ని ‘అనుగ్రహం కలిగించాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: ఐగుప్తీయుల దృష్టిలో
  rationale: ‘ఐగుప్తు కళ్లలో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; ఇక్కడ מִצְרַיִם దేశ ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: וַיַּשְׁאִלוּם
  choice: వారు అడిగినవాటిని ఐగుప్తీయులు వారికి ఇచ్చారు
  rationale: שאל హిఫిల్ రూపం ఈ సందర్భంలో అభ్యర్థించినవి అందించడాన్ని సూచించగలదు. సర్వనామాల అస్పష్టతను తెలుగులో నివారిస్తూ, తిరిగి చెల్లించాల్సిన సాధారణ అప్పు అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: వారు ఐగుప్తును దోచుకున్నారు
  rationale: נצל పియేల్ ఇక్కడ సంపదను తీసివేసి కొల్లగొట్టడం అనే బలమైన ఫలితాన్ని సూచిస్తుంది; ‘దోచుకున్నారు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: וַיַּשְׁאִלוּםను ‘అప్పుగా ఇచ్చారు’గా అనువదించాలా, లేక అడిగినవి ఇచ్చారనే అర్థంలో అనువదించాలా
  choice: వారు అడిగినవాటిని ఐగుప్తీయులు వారికి ఇచ్చారు
  alternative: ఐగుప్తీయులు వారికి అప్పుగా ఇచ్చారు
  rationale: సందర్భం ప్రకారం యెహోవా కలిగించిన అనుకూలత వల్ల ఐగుప్తీయులు ఇశ్రాయేలీయుల అభ్యర్థనలను నెరవేర్చారు; సాధారణ రుణ లావాదేవీ లేదా తిరిగి చెల్లింపు భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించడం అవసరం లేదు. అయితే ‘అప్పుగా ఇచ్చారు’ అనేది పురాతనమైన, పదసాధ్యమైన అవగాహన కాబట్టి పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘దృష్టిలో’ హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది; ‘దోచుకున్నారు’ మూలంలోని బలాన్ని నిలుపుతుంది.
