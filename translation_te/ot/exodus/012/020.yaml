  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: te
  text: పులిసినదేదీ మీరు తినకూడదు; మీరు నివసించే ప్రతి చోట పులియని రొట్టెలు తినాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: పులిసినదేదీ
  rationale: నిషేధ వాక్యంలో כָּל తో కూడిన מַחְמֶצֶת, పులియబెట్టిన ఏ పదార్థాన్నైనా సమగ్రంగా సూచిస్తుంది. ‘పులిసినదేదీ’ అని అనడం దీన్ని కేవలం రొట్టెకు పరిమితం చేయదు.
- source_word: לֹא תֹאכֵלוּ
  choice: మీరు తినకూడదు
  rationale: לֹא తో వచ్చిన అసంపూర్ణ క్రియ ఇక్కడ న్యాయపరమైన నిషేధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ‘తినకూడదు’ సహజంగాను స్పష్టంగాను ఉంది.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: మీరు నివసించే ప్రతి చోట
  rationale: מוֹשְׁבֹתֵיכֶם అనేది నివాసస్థలాలు లేదా స్థిరనివాసాలను సూచిస్తుంది. ఈ రూపం ఆజ్ఞ వారు నివసించే ప్రతి ప్రదేశంలో వర్తిస్తుందని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: תֹּאכְלוּ
  choice: తినాలి
  rationale: ఇక్కడి అసంపూర్ణ క్రియ సానుకూల ఆజ్ఞగా పనిచేస్తుంది. ‘తినాలి’ ఆధునిక తెలుగులో ఆజ్ఞార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: ఈ బహువచన నామవాచకం పులియబెట్టకుండా చేసిన రొట్టెలను సూచిస్తుంది; ‘పులియని రొట్టెలు’ పారదర్శకమైన, సాధారణ పాఠకులకు అర్థమయ్యే అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ఆజ్ఞాత్మక గంభీరతను నిలుపుకున్న రూపం. మొదటి భాగంలోని విస్తృత నిషేధాన్ని ‘పులిసినదేదీ’గా ఉంచి, దాన్ని కేవలం రొట్టెకు పరిమితం చేయలేదు; రెండో భాగంలో מַצּוֹת యొక్క బహువచన భావాన్ని ‘పులియని రొట్టెలే’గా వ్యక్తం చేశాం.
