review_pass:
  verdict: revise
  source_fidelity: 'The first clause correctly preserves the comprehensive prohibition in כָּל מַחְמֶצֶת: “పులిసినదేదీ” is broad and does not limit the object to bread. “మీరు నివసించే ప్రతి చోట” accurately conveys the distributive scope of בְּכֹל מוֹשְׁבֹתֵיכֶם. The second clause correctly identifies מַצּוֹת as unleavened bread.'
  naturalness: The draft is clear, modern standard Telugu, and suitably directive. However, the emphatic suffix in “రొట్టెలే” naturally adds an explicit restrictive emphasis (“unleavened bread only”) that is not stated in the positive Hebrew clause itself.
  terminology: “పులిసినది” and “పులియని రొట్టెలు” are clear, consistent renderings for leavened things and matzot. No theological terminology issue is present.
  issues:
  - severity: low
    issue: Unwarranted emphatic particle in “పులియని రొట్టెలే.”
    rationale: The Hebrew says simply “you shall eat unleavened breads” (תֹּאכְלוּ מַצּוֹת). Although the preceding prohibition makes the contrast clear, Telugu “-ఏ” adds a marked ‘only’ emphasis. Removing it more closely preserves the source wording and parallel command structure.
  revised_text: పులిసినదేదీ మీరు తినకూడదు; మీరు నివసించే ప్రతి చోట పులియని రొట్టెలు తినాలి.
  revised_footnotes: []
