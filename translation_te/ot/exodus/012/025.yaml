reference: Exodus 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: te
  text: యాహ్వే చెప్పినట్లే[a], ఆయన మీకు ఇచ్చే దేశంలోకి మీరు వచ్చినప్పుడు, ఈ ఆచారాన్ని[b] పాటించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగ్దానం చేసినట్లే.” హెబ్రీలో అక్షరార్థంగా “ఆయన చెప్పినట్లే”; సందర్భంలో ఇది ముందుగా ఇచ్చిన వాగ్దానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ సేవను” లేదా “ఈ ఆచార సేవను.” ఇక్కడి హెబ్రీ పదం పస్కాకు సంబంధించిన నిర్దేశిత ఆచారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: మీరు … వచ్చినప్పుడు
  rationale: భవిష్యత్తులో సంభవించే పరిస్థితిని పరిచయం చేసే హెబ్రీయ కాలసూచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תָבֹאוּ אֶל־הָאָרֶץ
  choice: దేశంలోకి మీరు వచ్చినప్పుడు
  rationale: בוא యొక్క ‘రావడం/ప్రవేశించడం’ భావాన్ని, אֶל సూచించే దిశను సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: యాహ్వే … మీకు ఇచ్చే దేశం
  rationale: ఈ సందర్భంలో נתן అసంపూర్ణ క్రియారూపానికి ఉన్న భవిష్యత్ భావాన్ని నిలుపుతుంది; దేవుని నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: మీకు ఇస్తానని చెప్పినట్టే
  rationale: דבר యొక్క ప్రాథమిక ‘చెప్పాడు’ భావాన్ని నిలుపుతూ, ముందున్న ‘ఇస్తాడు’ అనే వాక్యంతో దాని వాగ్దాన సందర్భాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וּשְׁמַרְתֶּם
  choice: పాటించాలి
  rationale: ఆచార సంబంధమైన విషయంతో שׁמרకు వచ్చే ‘జాగ్రత్తగా ఆచరించడం/పాటించడం’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ఈ ఆరాధనా విధి
  rationale: עֲבֹדָה యొక్క ‘సేవ’ భావాన్నీ, ఈ సందర్భంలోని పస్కా ఆచార స్వభావాన్నీ కలిపి తెలియజేస్తుంది; సాధారణ పాఠకులకు ‘సేవ’ మాత్రమే అన్నదానికంటే స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దేవుని నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- issue: כַּאֲשֶׁר דִּבֵּרలో వాగ్దాన భావం
  choice: మీకు ఇస్తానని చెప్పినట్టే
  alternative: వాగ్దానం చేసినట్టే
  rationale: సందర్భంలోని వాగ్దాన బలాన్ని తెలియజేస్తూనే, דבר అనే క్రియ యొక్క ప్రత్యక్ష ‘చెప్పడం’ భావాన్ని పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని భవిష్యత్ పరిస్థితి, దేవుని నామం, వాగ్దాన సందర్భం, పస్కా ఆచార బాధ్యత అన్నీ నిలుపబడ్డాయి.
