id: EXO.12.10
reference: Exodus 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: te
  text: దానిలోనిది ఏదీ ఉదయం వరకు మిగలనివ్వకూడదు; ఉదయం వరకు మిగిలినదాన్ని అగ్నిలో కాల్చివేయాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: మిగలనివ్వకూడదు
  rationale: יתר ధాతువు హిఫిల్ రూపం ఇక్కడ ‘మిగిలి ఉండనివ్వడం/మిగుల్చడం’ అనే అర్థాన్ని ఇస్తుంది. నిషేధ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִמֶּנּוּ
  choice: దానిలో ఏదీ
  rationale: מן + సర్వనామ ప్రత్యయం సందర్భంలో ‘దానిలోనిది’ అనే భాగార్థాన్ని సూచిస్తుంది; నిషేధంతో కలిపి తెలుగులో ‘దానిలో ఏదీ’ అని స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాలపరిమితిని నేరుగా తెలియజేసే సహజమైన తెలుగు పదబంధం.
- source_word: הַנֹּתָר
  choice: మిగిలినదాన్ని
  rationale: יתר ధాతువు నిఫాల్ కృదంతం ‘మిగిలి ఉన్నది’ అని సూచిస్తుంది; వస్తువు ఏదైనా మిగిలితే దానిని ఉద్దేశించే రూపం.
- source_word: בָּאֵשׁ
  choice: అగ్నితో
  rationale: בְ ఇక్కడ సాధనార్థకంగా గ్రహించవచ్చు; ‘అగ్నితో’ మూలంలోని వ్యక్తీకరణను గౌరవిస్తూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: תִּשְׂרֹפוּ
  choice: కాల్చివేయాలి
  rationale: న్యాయ/ఆచార ఆదేశ సందర్భంలోని అసంపూర్ణ క్రియకు విధ్యర్థక బలం ఉంది. ‘కాల్చివేయాలి’ ఆ తప్పనిసరి ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పస్కా మాంసంలో మిగిలినదాని గురించిన ఆజ్ఞ స్వభావం
  choice: మొదట నేర నిషేధం, తరువాత తప్పనిసరి నిర్మూలన ఆదేశం
  alternative: చట్టబద్ధ బలం లేని కేవలం ఆచరణాత్మక సూచన
  rationale: హీబ్రూ వాక్యం మిగలనివ్వకూడదనే నిషేధాన్నీ, మిగిలితే కాల్చివేయాలనే ఆదేశాన్నీ వరుసగా ఇస్తుంది. మూలంలో లేని ప్రతీకాత్మక అర్థాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆజ్ఞాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. బహువచన సంబోధనను తెలుగులో వ్యక్తిగత సర్వనామం చేర్చకుండా విధ్యర్థక క్రియలతో సహజంగా తెలిపింది.
