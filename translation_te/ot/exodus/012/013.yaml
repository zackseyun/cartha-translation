revisions:
- from: మీరు ఉన్న ఇళ్ల మీదున్న రక్తం మీకు ఒక సూచనగా ఉంటుంది. నేను ఆ రక్తాన్ని చూసినప్పుడు మిమ్మల్ని దాటిపోతాను[a]. నేను ఐగుప్తు దేశాన్ని దెబ్బతీసేటప్పుడు, నాశనం చేయడానికి ఏ తెగులూ మీ మధ్య ఉండదు[b].
  to: మీరు ఉన్న ఇళ్లపై ఉన్న రక్తం మీకు ఒక సూచనగా ఉంటుంది. నేను ఆ రక్తాన్ని చూసినప్పుడు మిమ్మల్ని దాటిపోతాను[a]. నేను ఐగుప్తు దేశాన్ని దెబ్బతీసేటప్పుడు, మిమ్మల్ని నాశనం చేయడానికి మీకు ఏ తెగులూ కలగదు[b].
  rationale: The revision improves Telugu syntax and idiom while retaining the source’s key ambiguities. The main text continues to render פסח as ‘దాటిపోతాను’ and keeps לְמַשְׁחִית in a non-personified destructive sense. Footnote b preserves the alternative substantive ‘destroyer’ reading. Footnote anchors remain immediately attached to the expressions they elucidate.
