review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the blood as a sign, the temporal force of ‘when I see,’ the Passover-related verb without forcing a doctrinal nuance, and the temporal clause concerning Egypt. The final plague clause is broadly defensible, but ‘మీ మధ్య ఉండదు’ is less direct for בָכֶם here, and the Telugu wording can state the destructive-force sense more naturally without introducing a personal destroyer in the main text.
  naturalness: ‘మీరు ఉన్న ఇళ్ల మీదున్న రక్తం’ is understandable but somewhat compressed. ‘మీరు ఉన్న ఇళ్లపై ఉన్న రక్తం’ is clearer. ‘మిమ్మల్ని నాశనం చేయడానికి ఏ తెగులూ మీ మధ్య ఉండదు’ is grammatical but less idiomatic than a formulation with ‘మీకు ... కలగదు.’
  terminology: ‘సూచన,’ ‘రక్తం,’ ‘తెగులు,’ and ‘ఐగుప్తు దేశం’ are suitable modern-standard Telugu terms. ‘మిమ్మల్ని దాటిపోతాను’ appropriately retains the lexical Passover connection. The alternative substantive reading should be phrased idiomatically in the footnote as an alternative, while remaining explicitly marked as such.
  issues:
  - severity: low
    issue: Opening relative phrase is unnecessarily compressed.
    rationale: ‘మీరు ఉన్న ఇళ్ల మీదున్న రక్తం’ can momentarily sound like a compound modifier. ‘మీరు ఉన్న ఇళ్లపై ఉన్న రక్తం’ clearly preserves the Hebrew relation of the blood to the houses.
  - severity: medium
    issue: The plague clause is awkward and slightly underrepresents the direct reference to those addressed.
    rationale: For וְלֹא יִהְיֶה בָכֶם נֶגֶף לְמַשְׁחִית, ‘మిమ్మల్ని నాశనం చేయడానికి మీకు ఏ తెగులూ కలగదు’ is natural Telugu, retains the verbal/destructive reading selected by the audit trail, and does not posit a distinct personal agent.
  - severity: low
    issue: Footnote b’s phrase ‘నాశనం చేసేవాని కోసం’ is overly literal and unnatural in Telugu.
    rationale: A footnote may express the substantive alternative more naturally as a plague caused by/associated with ‘the destroyer,’ while stating that this results from taking the term substantivally.
