reference: Exodus 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָה֩ הַ/דָּ֨ם לָ/כֶ֜ם לְ/אֹ֗ת עַ֤ל הַ/בָּתִּים֙ אֲשֶׁ֣ר אַתֶּ֣ם שָׁ֔ם וְ/רָאִ֨יתִי֙ אֶת הַ/דָּ֔ם וּ/פָסַחְתִּ֖י עֲלֵ/כֶ֑ם וְ/לֹֽא יִֽהְיֶ֨ה בָ/כֶ֥ם נֶ֨גֶף֙ לְ/מַשְׁחִ֔ית בְּ/הַכֹּתִ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: te
  text: మీరు ఉన్న ఇళ్లపై ఉన్న రక్తం మీకు ఒక సూచనగా ఉంటుంది. నేను ఆ రక్తాన్ని చూసినప్పుడు మిమ్మల్ని దాటిపోతాను[a]. నేను ఐగుప్తు దేశాన్ని దెబ్బతీసేటప్పుడు, మిమ్మల్ని నాశనం చేయడానికి మీకు ఏ తెగులూ కలగదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని విడిచిపెడతాను” లేదా “మిమ్మల్ని కాపాడుతాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నాశనం చేసేవాని వల్ల మీకు ఏ తెగులూ కలగదు”; ఇక్కడ “నాశనం చేసేవాడు” అని నామవాచకంగా తీసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: రక్తం మీకు ఒక సూచనగా ఉంటుంది
  rationale: భవిష్యత్ ఫలిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, אוֹת అనే పదంలోని ‘గుర్తు/సూచన’ భావాన్ని నిలుపుతుంది.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: మీరు ఉన్న ఇళ్ల మీదున్న
  rationale: రక్తం ఇశ్రాయేలీయులు ఉన్న ఇళ్ల మీద ఉందనే స్థానిక సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: నేను ఆ రక్తాన్ని చూసినప్పుడు
  rationale: హీబ్రూ సమన్వయ వాక్యం సందర్భంలో కాలసంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘చూసినప్పుడు’ సంఘటనల క్రమాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: మిమ్మల్ని దాటిపోతాను
  rationale: פסח క్రియకు సంబంధించిన ప్రాథమిక దాటిపోవు భావాన్నీ పస్కా సంఘటనతో దాని పదసంబంధాన్నీ కాపాడుతుంది; ‘కాపాడుతాను’ లేదా ‘విడిచిపెడతాను’ అనే ఫలితార్థాలను ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף לְמַשְׁחִית
  choice: నాశనం చేయడానికి ఏ తెగులూ మీ మధ్య ఉండదు
  rationale: נֶגֶף ను ‘తెగులు’గా, בָכֶם ను ‘మీ మధ్య’గా అందిస్తుంది. לְמַשְׁחִית ను ఉద్దేశం/ఫలితాన్ని తెలిపే క్రియాత్మక పదబంధంగా ఉంచి, వ్యక్తిగత ‘నాశనం చేసేవాడు’ అనే భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా ప్రవేశపెట్టదు.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: నేను ఐగుప్తు దేశాన్ని దెబ్బతీసేటప్పుడు
  rationale: కాలసూచక infinitive భావాన్ని సహజమైన తెలుగు ఉపవాక్యంగా అందిస్తూ, దేవుడే చర్య చేసే కర్త అని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: וּפָסַחְתִּי עֲלֵכֶם అనే పదబంధంలోని భావం
  choice: మిమ్మల్ని దాటిపోతాను
  alternative: మిమ్మల్ని విడిచిపెడతాను; మిమ్మల్ని కాపాడుతాను
  rationale: ప్రధాన పాఠ్యం పస్కాతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది; విడిచిపెట్టడం లేదా కాపాడడం అనే సందర్భానుగుణ ఫలితార్థాలను పాదసూచనలో ఉంచి అసలు పదంలోని చర్చనీయమైన సూక్ష్మతను కాపాడుతుంది.
- issue: לְמַשְׁחִית అనేది నాశన ఫలితాన్నా లేక వ్యక్తిగత నాశనం చేసేవాన్నా సూచిస్తుంది
  choice: నాశనం చేయడానికి
  alternative: నాశనం చేసేవాని కోసం
  rationale: హీబ్రూ రూపం ఉద్దేశం/ఫలితార్థంగానూ, నామవాచకార్థంగానూ అర్థం కావచ్చు. ప్రధాన పాఠ్యంలో క్రియాత్మక భావాన్ని ఉంచడం ద్వారా వాక్యం స్పష్టంగా చెప్పని వ్యక్తిగత కార్యనిర్వాహకుణ్ణి ప్రవేశపెట్టకుండా, ప్రత్యామ్నాయాన్ని పాదసూచనలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సూచన’, ‘దాటిపోతాను’, ‘తెగులు’, ‘దెబ్బతీసేటప్పుడు’ వంటి పదాలు మూలార్థానికి దగ్గరగా ఉండి సహజమైన తెలుగు వాక్యప్రవాహాన్ని ఇస్తాయి. ప్రతి పాదసూచన గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
