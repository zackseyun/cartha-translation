source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులందరూ[b] యాహ్వే[a] మోషేకు, అహరోనుకు ఆజ్ఞాపించిన ప్రకారమే చేశారు; వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: YHWH (יהוה). దీనిని “యెహోవా” అని కూడా లిప్యంతరీకరిస్తారు; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
  - marker: b
    text: “ఇశ్రాయేలు కుమారులు” అనేది ఇశ్రాయేలీయులను, అంటే ఇశ్రాయేలు సంతతిని సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేశారు
  rationale: ఆజ్ఞను పాటించిన సందర్భంలో עשה అనే క్రియకు ‘చేశారు’ సహజమైన అర్థం; వాక్యాంతంలోని అదే క్రియ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: తదుపరి సమూహమంతటినీ సూచించే సమగ్రతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరూ
  rationale: హీబ్రూ కుటుంబ-జాతి సంబంధమైన ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇది సమూహపదంగా ఇశ్రాయేలీయులను సూచిస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: ప్రకారమే
  rationale: ఆజ్ఞకు సరిగ్గా అనుగుణంగా చేసిన భావాన్ని తెలుగులో సహజంగా, బలంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించిన
  rationale: హీబ్రూ పరిపూర్ణ క్రియను తెలుగు సంబంధక క్రియారూపం సహజంగా వ్యక్తం చేస్తూ, ఆజ్ఞ క్రియకంటే ముందుగా ఇవ్వబడిందని సందర్భమే తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన יהוהను తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన వ్యక్తినామ రూపంలో ప్రతిలిపి చేస్తుంది; దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: మోషేకు, అహరోనుకు
  rationale: నేర కర్మ సూచకాల ప్రకారం మోషే, అహరోనులే ఆజ్ఞను స్వీకరించినవారు. ‘ద్వారా’ అని అనువదించి వారిని కేవలం మధ్యవర్తులుగా మార్చదు.
- source_word: כֵּן עָשׂוּ
  choice: వారు అలాగే చేశారు
  rationale: ఆజ్ఞకూ వారి కార్యానికీ ఉన్న పూర్తి అనుగుణతను నొక్కిచెప్పే హీబ్రూ ముగింపు పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: నిబంధన నామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుతుంది; ‘యాహ్వే’ మరో సాధ్యమైన లిప్యంతరీకరణ.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ కుటుంబ-జాతి రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; అయితే సందర్భంలో ఇది ఇశ్రాయేలు ప్రజల సమూహపదమని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: మోషే, అహరోనుల వాక్యసంబంధం
  choice: మోషేకు, అహరోనుకు ఆజ్ఞాపించిన
  alternative: మోషే, అహరోనుల ద్వారా ఆజ్ఞాపించిన
  rationale: హీబ్రూ את సూచకాల ప్రకారం వారు ‘ఆజ్ఞాపించబడిన’ వ్యక్తులు. ‘ద్వారా’ అనే మధ్యవర్తిత్వ భావాన్ని మూలంలో లేని విభక్తితో చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. మూలంలోని ‘చేశారు … చేశారు’ అనే ఉద్దేశపూర్వక పునరుక్తి నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
