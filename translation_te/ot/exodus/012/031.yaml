id: EXO.12.31
reference: Exodus 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: te
  text: 'అప్పుడు అతడు రాత్రివేళ[a] మోషేను, అహరోనును పిలిపించి ఇలా అన్నాడు: “లేవండి! మీరూ, ఇశ్రాయేలీయులూ[b] నా ప్రజల మధ్యనుంచి వెళ్లిపోండి. వెళ్లి, మీరు చెప్పిన ప్రకారం యాహ్వేను సేవించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘రాత్రిలో.’'
    reason: కాలాన్ని సూచించే לַיְלָה పదానికి సమానార్థక సహజ రూపం.
  - marker: b
    text: 'హెబ్రీలో అక్షరార్థంగా: ‘ఇశ్రాయేలు కుమారులు.’'
    reason: మూలంలోని కుటుంబాధారిత జాతీయ నామప్రయోగాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిపించి
  rationale: ఈ సందర్భంలో ఫరో మోషేను, అహరోనును తన దగ్గరకు అత్యవసరంగా రప్పించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పిలిపించి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לַיְלָה
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే హెబ్రీ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: קוּמוּ צְּאוּ
  choice: లేవండి! ... వెళ్లిపోండి
  rationale: వరుస ఆజ్ఞల అత్యవసరతను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘వెళ్లిపోండి’ సందర్భంలోని బయటకు పంపివేతను తెలియజేస్తుంది.
- source_word: מִתּוֹךְ עַמִּי
  choice: నా ప్రజల మధ్యనుంచి
  rationale: ‘నా ప్రజల నడుమనుంచి’ అనే స్థలార్థాన్ని వ్యాఖ్యానాత్మకంగా ‘ఐగుప్తు నుంచి’ అని మార్చకుండా నిలుపుతుంది.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: మీరూ, ఇశ్రాయేలీయులూ
  rationale: గַּם...גַּם ద్వారా వ్యక్తమైన రెండు వర్గాల సమ్మిళిత ఉద్ఘాటనను సహజ తెలుగులో నిలుపుతుంది; ‘ఇశ్రాయేలు కుమారులు’ అనే మూలభాషా రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: עִבְדוּ
  choice: సేవించండి
  rationale: దేవునికి చేసే సేవ, ఆరాధన అనే రెండింటినీ కలిగి ఉండగల עבד పద విస్తృతిని ‘ఆరాధించండి’ అని సంకుచితం చేయకుండా కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: כְּדַבֶּרְכֶם
  choice: మీరు చెప్పిన ప్రకారం
  rationale: మోషే, అహరోనులు ముందుగా కోరినదానికి అనుగుణంగా ఫరో అనుమతిస్తున్న భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: עבד పదంలోని సేవ–ఆరాధన భావవ్యాప్తి
  choice: సేవించండి
  alternative: ఆరాధించండి
  rationale: ఇక్కడ ఆరాధన భావం ఉన్నప్పటికీ, హెబ్రీ పదం సేవ అనే విస్తృత భావాన్నీ కలిగి ఉంది; ‘సేవించండి’ ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ఆజ్ఞల అత్యవసరత కోసం చిన్న వాక్యాలు, ఆశ్చర్యార్థకం వాడబడ్డాయి; మూలంలోని అస్పష్టతలు అనవసరంగా సిద్ధాంతీకరించబడలేదు.
