source:
  edition: WLC
  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు మోషే మాట ప్రకారం చేశారు. వారు ఐగుప్తీయుల నుండి వెండి వస్తువులు, బంగారు వస్తువులు, దుస్తులు అడిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోరారు.” కొన్ని పాత అనువాదాల్లో “అప్పుగా తీసుకున్నారు” అని ఉంది; అయితే ఇక్కడి హీబ్రూ క్రియకు సాధారణంగా “అడిగారు” లేదా “కోరారు” అనే అర్థం ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధమైన సమష్టి వ్యక్తీకరణను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: మోషే మాట ప్రకారం చేశారు
  rationale: עשה యొక్క సాధారణ క్రియార్థాన్నీ, דבר అనే నామవాచకాన్నీ అతిగా వివరణ చేయకుండా ప్రతిబింబిస్తుంది.
- source_word: וַיִּשְׁאֲלוּ מִמִּצְרַיִם
  choice: ఐగుప్తీయుల దగ్గర ... అడిగారు
  rationale: שאל యొక్క ప్రాథమిక అర్థం ‘అడుగు/కోరు’; సందర్భంలో מִצְרַיִם దేశాన్ని కాక ప్రజలను సూచిస్తుంది.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: వెండి వస్తువులు, బంగారు వస్తువులు
  rationale: כְּלִי అనే విస్తృత పదాన్ని పాత్రలు లేదా ఆభరణాలు అని అనవసరంగా పరిమితం చేయకుండా అందిస్తుంది.
- source_word: וּשְׂמָלֹת
  choice: బట్టలు
  rationale: సాధారణ ఆధునిక తెలుగులో దుస్తులు/వస్త్రాలు అనే విస్తృత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమణ దోపిడి సందర్భంలో וַיִּשְׁאֲלוּ పదానికి నైతికంగా భారితమైన అర్థం ఇవ్వడం
  choice: అడిగారు
  alternative: అప్పుగా తీసుకున్నారు; దోచుకున్నారు; కోరారు
  rationale: ఈ క్రియ స్వతహాగా ‘అడిగారు/కోరారు’ అని అర్థం. ‘అప్పుగా తీసుకున్నారు’ లేదా ‘దోచుకున్నారు’ అనడం హీబ్రూ క్రియలో స్పష్టంగా లేని ఉద్దేశాన్ని లేదా తీర్పును చేర్చుతుంది; దోచుకున్నారనే ఫలితాన్ని పరిసర కథనం వేరుగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. ‘ఇశ్రాయేలు కుమారులు’ మూలంలోని సమష్టి-కుటుంబ ప్రయోగాన్ని నిలుపుతుంది; ‘వస్తువులు’ כְּלִי యొక్క అర్థవిస్తృతిని కాపాడుతుంది.
