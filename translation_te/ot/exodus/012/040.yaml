source:
  edition: WLC
  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] ఐగుప్తులో నివసించిన కాలం నాలుగు వందల ముప్పై సంవత్సరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన పాఠసాక్ష్యాల్లో, “ఇశ్రాయేలు కుమారులు, వారి పితరులు ఐగుప్తులోను కనానులోను నివసించిన కాలం నాలుగు వందల ముప్పై సంవత్సరాలు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: నివసించిన కాలం
  rationale: ఈ సందర్భంలో ఈ నామవాచకం నివాసస్థలాన్ని మాత్రమే కాక నివాసకాలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నివసించిన కాలం’ సహజంగా ఉండి, 430 సంవత్సరాల వ్యవధితో దాని సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, సంప్రదాయ ఒడంబడిక సంబంధిత వ్యక్తీకరణను పారదర్శకంగా అందిస్తుంది.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: నివసించిన
  rationale: ישׁב ఇక్కడ ‘నివసించుట’ అనే అర్థంలో ఉంది. తెలుగు ఉపవాక్య నిర్మాణంలో ఇది సహజంగా ‘కాలం’తో కలుస్తుంది.
- source_word: בְּמִצְרָיִם
  choice: ఐగుప్తులో
  rationale: స్థలార్థక בְּ ఉపసర్గతో కూడిన ‘ఐగుప్తు’కు నేరమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: నాలుగు వందల ముప్పై సంవత్సరాలు
  rationale: హీబ్రూలోని సంఖ్యాక్రమాన్ని సహజ తెలుగు సంఖ్యాక్రమంలో అందిస్తూ, పేర్కొన్న వ్యవధిని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: 430 సంవత్సరాలు ఐగుప్తులోని నివాసానికే వర్తిస్తాయా, లేక కనానుతో కూడిన విస్తృత పితృపురుషుల నివాసకాలానికా?
  choice: ప్రధాన పాఠం అందించిన మసొరెటిక్ పాఠాన్ని అనుసరించి, ఇశ్రాయేలు కుమారుల ఐగుప్తు నివాసకాలాన్ని 430 సంవత్సరాలుగా పేర్కొంటుంది.
  alternative: కొన్ని ప్రాచీన పాఠసాక్ష్యాలు ‘ఐగుప్తులోను కనానులోను’ అని చదివి, ఈ కాలాన్ని విస్తృత నివాసకాలంగా చూపుతాయి.
  rationale: మూలంగా ఇచ్చిన WLC మసొరెటిక్ పాఠంలో ‘ఐగుప్తులో’ మాత్రమే ఉంది. కాలక్రమంపై ప్రభావం చూపే ప్రాచీన భిన్నపాఠాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో సంరక్షించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని నామవాచక భావాన్ని సహజంగా తెలియజేయడానికి ‘నివసించిన కాలం’ వాడబడింది; మూలంలో లేని సంధానపదం చేర్చబడలేదు.
