  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מֵ/רַעְמְסֵ֖ס סֻכֹּ֑תָ/ה כְּ/שֵׁשׁ מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַ/גְּבָרִ֖ים לְ/בַ֥ד מִ/טָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] రామెసేసు నుండి సుక్కోతుకు బయలుదేరారు[b]. పిల్లలు కాకుండా, కాలినడకన వెళ్లిన పురుషులు సుమారు ఆరు లక్షల మంది[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బయలుదేరారు’ అని అనువదించిన హీబ్రూ క్రియ శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: ‘కాలినడకన వెళ్లిన పురుషులు సుమారు ఆరు లక్షల మంది’ అనే మాట పురుషుల సంఖ్యను తెలుపుతుంది; పిల్లలు ఈ లెక్కలో చేర్చబడలేదు.
    reason: cultural_note
  - marker: d
    text: ‘పిల్లలు’ అని అనువదించిన హీబ్రూ పదం చిన్నపిల్లలను లేదా చిన్న వయసు ఆధారితులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: బయలుదేరారు
  rationale: נסע శిబిరాన్ని విడిచి ప్రయాణం ప్రారంభించడాన్ని సూచించగలదు; సందర్భంలో ‘బయలుదేరారు’ సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ కుటుంబసంబంధ రూపమైన ‘ఇశ్రాయేలు కుమారులు’ అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సహజమైన ‘ఇశ్రాయేలీయులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: מֵרַעְמְסֵס
  choice: రామెసేసు నుండి
  rationale: מן అనే విభక్తి ‘నుండి’ అనే మూలస్థానాన్ని సూచిస్తుంది; రామెసేసు పేరుకు సాధారణ తెలుగు లిప్యంతరీకరణను వాడింది.
- source_word: סֻכֹּתָה
  choice: సుక్కోతుకు
  rationale: స్థలనామానికి జతైన దిశాసూచక ה గమ్యస్థానం వైపు కదలికను తెలియజేస్తుంది; తెలుగులో ‘-కు’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: సుమారు ఆరు లక్షల మంది
  rationale: సంఖ్యకు ముందున్న כ అంచనా భావాన్ని ఇస్తుంది; ‘సుమారు’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רַגְלִי
  choice: కాలినడకన వెళ్లిన
  rationale: רגל మూలం ఇక్కడ పాదచారులుగా ప్రయాణించినవారిని సూచిస్తుంది; తెలుగు వాక్యంలో ‘కాలినడకన వెళ్లిన’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: הַגְּבָרִים
  choice: పురుషులు
  rationale: גברים ప్రత్యేకంగా మగవారిని సూచిస్తుంది; ‘పురుషులు’ లింగసూచనను ఖచ్చితంగా కాపాడుతుంది.
- source_word: לְבַד מִטָּף
  choice: పిల్లలు కాకుండా
  rationale: טף చిన్నపిల్లలను లేదా చిన్న వయసు ఆధారితులను సూచిస్తుంది; ‘పిల్లలు కాకుండా’ వారు ఈ సంఖ్యలో లెక్కించబడలేదని సహజంగా తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని కుటుంబసంబంధ పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది. సంఖ్య అంచనా స్వభావం, కాలినడక ప్రయాణం, పిల్లలు లెక్కకు వెలుపల ఉండటం స్పష్టంగా ఉంచబడ్డాయి.
