  source_fidelity: The translation accurately renders the movement from Rameses to Succoth, preserves the approximate number (כְּ), identifies the counted group as men traveling on foot, and makes clear that children/little ones are excluded from that count. The Hebrew familial expression בני ישראל is retained in the main text.
