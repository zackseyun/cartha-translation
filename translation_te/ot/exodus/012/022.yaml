source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: te
  text: మీరు హిస్సోపు కట్టను తీసుకొని, పాత్రలో[a] ఉన్న రక్తంలో దాన్ని ముంచాలి. ఆ పాత్రలో ఉన్న రక్తంలో కొంత తీసుకొని, దానిని ద్వారపు పై అడ్డకర్రకూ ద్వారపు రెండు పక్క స్తంభాలకూ తాకించాలి. మీలో ఎవ్వరూ ఉదయం వరకు తమ ఇంటి ద్వారం నుండి బయటకు వెళ్లకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గడప.’ హీబ్రూ పదం סַף (సఫ్)కు ‘పాత్ర’ లేదా ‘గడప’ అనే అర్థాలు రావచ్చు. ఇక్కడ రక్తం దానిలో ఉందని, హిస్సోపు కట్టను దానిలో ముంచుతున్నారని చెప్పడం వల్ల ‘పాత్ర’ను ప్రధాన పాఠంలో ఎంచుకున్నాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: హిస్సోపు కొమ్మల కట్ట
  rationale: אֲגֻדָּה కట్టిన గుత్తి లేదా కట్టను సూచిస్తుంది. మొక్కను గుర్తించడానికి సంప్రదాయ పేరైన ‘హిస్సోపు’ను ఉంచి, ఆచారంలో వాడిన వస్తువు స్పష్టమయ్యేలా ‘కొమ్మల కట్ట’ అని అనువదించాం.
- source_word: בַּדָּם
  choice: రక్తంలో
  rationale: טבל అనే ‘ముంచు’ క్రియతో ב, ఏ ద్రవంలో ముంచారో సూచిస్తుంది. ‘రక్తంలో’ సహజంగాను మూలానికి దగ్గరగాను ఉంది.
- source_word: הַסַּף
  choice: పాత్ర
  rationale: రక్తం దానిలో ఉందని, హిస్సోపు కట్టను దానిలో ముంచుతున్నారని సందర్భం చెబుతోంది కాబట్టి ఇక్కడ రక్తాన్ని ఉంచిన పాత్ర అనే అర్థం బలంగా ఉంది. ‘గడప’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהִגַּעְתֶּם
  choice: తాకించాలి
  rationale: נגע హిఫీల్ రూపం ఇక్కడ రక్తాన్ని ద్వార భాగాలకు తగిలించడాన్ని సూచిస్తుంది. ‘తాకించాలి’ ఆ స్పర్శ చర్యను అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: הַמַּשְׁקוֹף
  choice: ద్వారం పై గడప
  rationale: ద్వారం పైన అడ్డంగా ఉండే భాగాన్ని సూచించే నిర్మాణ పదం. సాధారణ పాఠకుడికి స్పష్టంగా ఉండేందుకు ‘ద్వారం పై గడప’ అని ఇచ్చాం.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: రెండు నిలువు గడపలు
  rationale: ద్వారానికి ఇరువైపులా ఉండే నిలువు స్తంభాలను సూచిస్తుంది. ‘రెండు నిలువు గడపలు’ పై గడపతో తేడాను స్పష్టంగా చూపుతుంది.
- source_word: מִן הַדָּם
  choice: రక్తంలో కొంత తీసి
  rationale: מִן ఇక్కడ పాత్రలోని రక్తంలో కొంత భాగాన్ని ఉపయోగించడాన్ని సూచిస్తుంది. తెలుగులో చర్య సహజంగా అర్థమయ్యేలా ‘కొంత తీసి’ అని వ్యక్తం చేశాం.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: మీలో ఎవ్వరూ ... బయటకు వెళ్లకూడదు
  rationale: బహువచన నిషేధం తరువాత ఉన్న אִישׁ పంపిణీ భావాన్ని కలిగిస్తుంది. ‘మీలో ఎవ్వరూ’ ప్రతి వ్యక్తికీ వర్తించే నిషేధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: తమ ఇంటి ద్వారం నుండి
  rationale: פֶּתַח ప్రవేశద్వారాన్ని సూచిస్తుంది. ‘తమ ఇంటి’ పంపిణీ భావాన్ని తెలుగులో సహజంగా ఉంచి, ఇది పురుషులకు మాత్రమే పరిమితమైన ఆజ్ఞ అన్న అపార్థాన్ని నివారిస్తుంది.
- source_word: עַד בֹּקֶר
  choice: ఉదయం వరకు
  rationale: కాల పరిమితిని నేరుగా, సహజంగా తెలియజేసే అనువాదం.
theological_decisions:
- issue: אִישׁ ... בֵּיתוֹ అనే పుంలింగ ఏకవచన పంపిణీ ప్రయోగం
  choice: మీలో ఎవ్వరూ ... తమ ఇంటి ద్వారం నుండి
  alternative: మీలో ఏ పురుషుడూ తన ఇంటి ద్వారం నుండి
  rationale: హీబ్రూ పుంలింగ ఏకవచనం ఇక్కడ ఒక్కొక్కరికి వర్తించే ప్రతినిధి/పంపిణీ ప్రయోగం; ఆజ్ఞ పురుషులకు మాత్రమే పరిమితమని చెప్పడం కాదు. తెలుగు ‘ఎవ్వరూ ... తమ ఇంటి’ అసలు వ్యాప్తిని సహజంగా కాపాడుతుంది.
- issue: ఈ వచనంలో הַסַּף అర్థం
  choice: పాత్ర
  alternative: గడప
  rationale: రక్తం దానిలో ఉండటం, హిస్సోపు కట్టను అందులో ముంచడం అనే తక్షణ సందర్భం పాత్ర అర్థాన్ని బలపరుస్తుంది. అయినా ‘గడప’ నిజమైన పదార్థ ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ద్వార నిర్మాణ భాగాలు స్పష్టంగా వేరుపడేందుకు ‘పై గడప’, ‘నిలువు గడపలు’ అన్న పదబంధాలను ఎంచుకున్నాం; ఆచార చర్యను అతిగా వ్యాఖ్యానించకుండా ఉంచాం.
