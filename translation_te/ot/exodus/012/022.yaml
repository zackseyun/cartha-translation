review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the sequence of actions, the blood in the saph, the upper doorway member, the two side members, and the prohibition until morning. The container sense of הַסַּף is appropriately retained with a footnote for the viable alternative.
  naturalness: The wording is generally clear modern Telugu, but “హిస్సోపు కొమ్మల కట్ట” unnecessarily specifies branches, and “రెండు నిలువు గడపలు” is less idiomatic and may blur the distinction between threshold/lintel and the vertical side posts. “ద్వారపు రెండు పక్క స్తంభాలు” is clearer.
  terminology: “హిస్సోపు” is an appropriate conventional rendering. “పాత్ర” is a safe contextual rendering of סַף. “ద్వారపు పై అడ్డకర్ర” and “ద్వారపు రెండు పక్క స్తంభాలు” accurately distinguish the lintel and doorposts in natural Telugu. The footnote alternative should be “గడప,” not “గడపలో,” since the lexical alternative concerns the referent of סַף.
  issues:
  - severity: low
    issue: “హిస్సోపు కొమ్మల కట్ట” adds ‘branches.’
    rationale: אֲגֻדַּת אֵזוֹב means a bunch/bundle of hyssop; it does not specifically state branches. “హిస్సోపు కట్ట” preserves the source’s breadth.
  - severity: medium
    issue: “రెండు నిలువు గడపలు” is architecturally and idiomatically unclear.
    rationale: מְזוּזוֹת denotes the two vertical doorposts. “ద్వారపు రెండు పక్క స్తంభాలు” clearly identifies them and distinguishes them from the upper horizontal member.
  - severity: low
    issue: The footnote says “గడపలో” rather than the lexical alternative “గడప.”
    rationale: The alternative meaning of הַסַּף is ‘threshold/doorstep,’ not the locative phrase ‘in the threshold.’
  revised_text: మీరు హిస్సోపు కట్టను తీసుకొని, పాత్రలో[a] ఉన్న రక్తంలో దాన్ని ముంచాలి. ఆ పాత్రలో ఉన్న రక్తంలో కొంత తీసుకొని, దానిని ద్వారపు పై అడ్డకర్రకూ ద్వారపు రెండు పక్క స్తంభాలకూ తాకించాలి. మీలో ఎవ్వరూ ఉదయం వరకు తమ ఇంటి ద్వారం నుండి బయటకు వెళ్లకూడదు.
