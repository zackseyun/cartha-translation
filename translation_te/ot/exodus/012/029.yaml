source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: te
  text: అర్ధరాత్రి యాహ్వే ఐగుప్తు దేశంలోని ప్రతి తొలిసంతానాన్ని హతమార్చాడు—సింహాసనంపై కూర్చున్న ఫరో తొలిసంతానం మొదలుకొని, చెరసాల గోతిలో ఉన్న బందీ తొలిసంతానం[a] వరకు; పశువుల ప్రతి తొలిపిల్లను కూడా హతమార్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెరసాల గోతిలో ఉన్న ఖైదీ తొలిసంతానం.”
    reason: שְּׁבִי అనే పదానికి సందర్భానుసారం ‘బందీ’ లేదా ‘ఖైదీ’ అనే అర్థం ఉండవచ్చు.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: అర్ధరాత్రి
  rationale: కథన క్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, ‘రాత్రి మధ్యలో’ అనే హీబ్రూ కాలసూచనను సాధారణమైన ‘అర్ధరాత్రి’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: నכה అనే క్రియకు ‘కొట్టు’ అనే ప్రాథమిక భావం ఉన్నా, ఈ సందర్భంలో దాని ఫలితం మరణం. ‘హతమార్చాడు’ ఆ ప్రాణాంతక భావాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָל בְּכוֹר
  choice: ప్రతి తొలిసంతానం
  rationale: כָל యొక్క విభాజక బలాన్ని ‘ప్రతి’ తెలియజేస్తుంది; בכורను మానవుల విషయంలో సహజమైన ‘తొలిసంతానం’గా అనువదించింది.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశంలోని
  rationale: స్థలసూచకమైన హీబ్రూ పదబంధాన్ని దాని భౌగోళిక రూపంతో నిలుపుతుంది.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: ఫరో తొలిసంతానం మొదలుకొని ... బందీ తొలిసంతానం వరకు
  rationale: מִן ... עַד ద్వారా సూచించిన సామాజిక పరిధిని తెలుగులో సహజమైన ‘మొదలుకొని ... వరకు’ నిర్మాణంతో నిలుపుతుంది.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: సింహాసనంపై కూర్చున్న ఫరో
  rationale: వర్తమాన కృదంతం ఫరో రాజస్థితిని వివరిస్తుంది; తెలుగు సంబంధ కృదంత నిర్మాణం దాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּכוֹר הַשְּׁבִי
  choice: బందీ తొలిసంతానం
  rationale: שְּׁבִי చెరపట్టబడిన వ్యక్తిని సూచిస్తుంది. ‘బందీ’ అనే పదం ‘ఖైదీ’ కంటే మూలంలోని చెర భావాన్ని విస్తృతంగా నిలుపుతుంది.
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: చెరసాల గోతిలో ఉన్న
  rationale: בּוֹר యొక్క ‘గోతి’ అనే దృశ్యరూపాన్నీ, నిర్బంధ స్థలమనే సందర్భార్థాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: పశువుల ప్రతి తొలిచూలును కూడా
  rationale: בְּהֵמָהను పెంపుడు పశువుల సమూహంగా, వాటి בכורను తెలుగులో జంతువులకు సహజమైన ‘తొలిచూలు’గా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది; ‘యాహ్వే’ ఆధునిక పాండిత్యపరమైన ఉచ్చారణను ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి ఉపయోగించబడింది. ‘మొదలుకొని ... వరకు’ అనే నిర్మాణం అత్యున్నత రాజస్థాయి నుంచి అత్యల్ప నిర్బంధ స్థాయి వరకూ వ్యాపించిన తీర్పును స్పష్టంగా ఉంచుతుంది. చివరి క్రియను పునరుక్తం చేయడం తెలుగులో వాక్యార్థాన్ని స్పష్టంగా చేస్తుంది.
