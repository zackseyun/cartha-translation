  terminology: ‘యాహ్వే’, ‘ఫరో’, ‘బందీ’, ‘చెరసాల గోతి’ అనేవి సందర్భానుకూలంగా ఉన్నాయి. ‘తొలిసంతానం’ మానవులకు తటస్థంగా సరిపోతుంది; పశువులకు ‘తొలిపిల్ల’ మరింత నిర్దిష్టమైన పదం. ప్రత్యామ్నాయ పఠనాన్ని సూచించే పాదసూచిక మూలంలోని שְּׁבִי పదానికి అనుకూలంగా ఉంది.
