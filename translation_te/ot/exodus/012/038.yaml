source:
  edition: WLC
  text: וְ/גַם עֵ֥רֶב רַ֖ב עָלָ֣ה אִתָּ֑/ם וְ/צֹ֣אן וּ/בָקָ֔ר מִקְנֶ֖ה כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: te
  text: వారితోపాటు ఒక పెద్ద మిశ్రమ జనసమూహం కూడా బయలుదేరింది; అలాగే మందలు, పశువుల గుంపులు—ఎంతో విస్తారమైన పశుసంపద—కూడా బయలుదేరాయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక గొప్ప మిశ్రమ సమూహం’ లేదా ‘మిశ్రమ జనసమూహం.’ హీబ్రూ పదబంధం ఇశ్రాయేలీయులతో పాటు వచ్చిన భిన్న స్వభావాల ప్రజల సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: కూడా
  rationale: ముందటి కథనానికి మరొక సమాచారాన్ని చేర్చే సంయోజక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֵרֶב רַב
  choice: భిన్న ప్రజలతో కూడిన ఒక గొప్ప సమూహం
  rationale: ఈ పదబంధం ఇశ్రాయేలీయులతో వచ్చిన వైవిధ్యభరితమైన పెద్ద సమూహాన్ని సూచిస్తుంది; వారి జాతి లేదా సామాజిక స్వరూపాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: עָלָה
  choice: బయలుదేరింది
  rationale: నిర్గమ ప్రయాణ సందర్భంలో కదలికను సహజంగా తెలుపుతుంది. అక్షరార్థమైన ‘పైకి వెళ్లింది’ తెలుగు పాఠకునికి ఇక్కడ అసహజంగా లేదా భౌగోళికంగా అతినిర్దిష్టంగా అనిపించవచ్చు.
- source_word: אִתָּם
  choice: వారితోపాటు
  rationale: మూడవ పురుష బహువచన సహచర్య భావాన్ని నేరుగా తెలుపుతుంది; సందర్భంలో ‘వారు’ ఇశ్రాయేలీయులను సూచిస్తుంది.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: మందలు, పశువుల గుంపులు
  rationale: צֹאן సూచించే గొర్రెలు-మేకల వంటి చిన్న పశువుల మందలను, בָקָר సూచించే పెద్ద పశువుల గుంపులను సాధారణ తెలుగు మాటల్లో వేరు చేస్తుంది.
- source_word: מִקְנֶה
  choice: పశుసంపద
  rationale: మనుషులు పెంచుకునే జంతువుల సమిష్టి ఆస్తిని సూచించే విస్తృత అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּבֵד מְאֹד
  choice: అతి విస్తారమైన
  rationale: అక్షరార్థంగా ‘చాలా భారమైన’ అయినప్పటికీ, పశుసంపదతో వాడినప్పుడు అత్యధిక పరిమాణం లేదా సమృద్ధిని సూచిస్తుంది.
