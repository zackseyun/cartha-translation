translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వచన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. עֵרֶב רַב లోని వైవిధ్యం మరియు పరిమాణం రెండూ ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సంక్షిప్త ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
