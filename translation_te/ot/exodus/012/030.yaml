- from: ఆ రాత్రి ఫరో లేచాడు; అతడూ, అతని సేవకులందరూ, ఐగుప్తీయులందరూ లేచారు. ఐగుప్తులో గొప్ప రోదన పుట్టింది; ఎందుకంటే చనిపోయిన వ్యక్తి లేని ఇల్లు ఒక్కటి కూడా లేదు.
  to: ఆ రాత్రి ఫరో, అతని సేవకులందరూ, ఐగుప్తీయులందరూ లేచారు; ఐగుప్తులో[b] గొప్ప రోదన పుట్టింది, ఎందుకంటే చనిపోయినవాడు లేని ఇల్లు ఒక్కటీ లేదు[a].
