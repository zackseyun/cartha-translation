source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: te
  text: ఆ రాత్రి ఫరో, అతని సేవకులందరూ, ఐగుప్తీయులందరూ లేచారు; ఐగుప్తులో[b] గొప్ప రోదన పుట్టింది, ఎందుకంటే చనిపోయినవాడు లేని ఇల్లు ఒక్కటీ లేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “చనిపోయిన వ్యక్తి లేని ఇల్లు లేదు.”'
    reason: lexical_alternative
  - marker: b
    text: ‘ఐగుప్తీయులందరూ’ అనే ప్రయోగంలో దేశనామం ఐగుప్తు ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచాడు
  rationale: קום అనే క్రియ యొక్క సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַיְלָה הוּא
  choice: ఆ రాత్రి
  rationale: హీబ్రూ కాలసూచక ప్రయోగాన్ని తెలుగులో సహజంగా, సందర్భానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సందర్భంలో ఫరోకు సేవచేసే వారిని సూచిస్తుంది; బానిసత్వాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: וְכָל מִצְרַיִם
  choice: ఐగుప్తీయులందరూ
  rationale: స్థల నామం ప్రజలను సమష్టిగా సూచించే హీబ్రూ ప్రయోగాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: צְעָקָה גְדֹלָה
  choice: గొప్ప రోదన
  rationale: తీవ్రమైన దుఃఖపు కేకను సూచించే צְעָקָה భావాన్ని గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: చనిపోయిన వ్యక్తి లేని ఇల్లు ఒక్కటి కూడా లేదు
  rationale: రెండుసార్లు వచ్చిన אֵין ద్వారా ఏర్పడిన సంపూర్ణ నిరాకరణను నిలుపుతూ, בית ను ‘ఇల్లు’గానే ఉంచుతుంది.
- source_word: מֵת
  choice: చనిపోయిన వ్యక్తి
  rationale: విశేషణాత్మక కృదంతం ఇక్కడ నామవాచకంగా పనిచేస్తున్నందున, అనిశ్చిత వ్యక్తిని స్పష్టంగా సూచిస్తుంది.
