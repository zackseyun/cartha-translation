- from: వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకురావడానికి అది యెహోవాకు జాగరణ[a] రాత్రి. అదే రాత్రి ఇశ్రాయేలు సంతానమంతటికీ తరతరాలుగా యెహోవాకు జాగరణ రాత్రి.
