id: EXO.12.42
reference: Exodus 12:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: te
  text: వారిని ఐగుప్తు దేశం నుండి బయటకు తీసుకురావడానికి, అది యాహ్వేకు జాగరణ రాత్రి. అదే రాత్రి ఇశ్రాయేలు సంతానమంతటికీ వారి తరతరాల వరకు యాహ్వేకు జాగరణ రాత్రి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: జాగరణ రాత్రి
  rationale: לֵיל అనే నిర్మాణ రూపంతో వచ్చిన שִׁמֻּרִים, కాపుకాయడం/జాగరూకతతో ఉండడం అనే భావాన్ని ఇస్తుంది. ‘జాగరణ రాత్రి’ అనేది కాపుకాయడం, పవిత్రంగా ఆచరించడం అనే రెండు సంభావ్య ఛాయలనూ పూర్తిగా విడిచిపెట్టకుండా తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గలోని సంబంధం, అంకితం, ప్రయోజనం వంటి భావాలను ఒకే విధంగా నిర్ణయించకుండా ‘యెహోవాకు’ అని ఉంచడం మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: לְהוֹצִיאָם
  choice: వారిని ... బయటకు తీసుకురావడానికి
  rationale: ל తో కూడిన క్రియానామం వ్యక్తం చేసే ఉద్దేశం/ఫలితం భావాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: మూలంలో స్పష్టంగా ఉన్న אֶרֶץ, ‘దేశం,’ అనే పదాన్ని తొలగించకుండా నిలుపుతుంది.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: అదే రాత్రి
  rationale: సర్వనామం, నిర్దేశక పదం కలిగించే నొక్కిచెప్పే గుర్తింపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతానమంతటికీ
  rationale: בְּנֵי יִשְׂרָאֵל లోని కుటుంబ-నిబంధన సంబంధమైన అభివ్యక్తిని ‘ఇశ్రాయేలీయులందరికీ’ అని సరళీకరించకుండా కాపాడుతుంది.
- source_word: לְדֹרֹתָם
  choice: తరతరాలుగా
  rationale: తరువాతి తరాలన్నిటిలో కొనసాగడాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామమే ఉంది; అందువల్ల దైవనామాన్ని ప్రత్యక్షంగా నిలిపాం.
- issue: שִׁמֻּרִים పదంలోని కాపుకాయడం–ఆచరణ భావసంధి
  choice: జాగరణ
  alternative: కాపుకాయడం / ఆచరణ
  rationale: ఈ సందర్భంలో దేవుడు కాపుకాసిన రాత్రి అనే భావమూ, ఇశ్రాయేలు తరతరాలు ఆచరించాల్సిన రాత్రి అనే భావమూ వినిపించవచ్చు. ప్రధాన పాఠంలో ఒకదానిని మాత్రమే ఖరారు చేయకుండా ‘జాగరణ’ అని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, שִׁמֻּרִים మరియు לַיהוָה కలయికలోని నిజమైన భావసందిగ్ధతను ప్రధాన పాఠంలో అతిగా వివరణాత్మకంగా పరిష్కరించలేదు.
