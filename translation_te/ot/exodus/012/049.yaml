review_pass:
  verdict: revise
  source_fidelity: 'The main rendering accurately conveys the Hebrew legal assertion: one and the same Torah/norm is for both the native member of the community (אֶזְרָח) and the non-native resident dwelling among them (גֵּר ... הַגָּר בְּתוֹכְכֶם). ‘ఒకే నియమం’ preserves the force of אַחַת, and ‘ఉండాలి’ suitably expresses the prescriptive force in this legal context.'
  naturalness: The main Telugu text is clear, modern-standard, and appropriately formal. The footnote’s ‘నివాసముండే’ is less idiomatic than the main text’s ‘నివసించే’; the alternative should use natural contemporary Telugu as well.
  terminology: ‘నియమం’ is suitable here for תּוֹרָה in its immediate legal context. ‘దేశస్థుడు’ and ‘పరదేశి’ maintain the distinction without importing modern citizenship categories, while ‘మీ మధ్య నివసించే’ adequately specifies that the גֵּר is a resident. In the lexical alternative, ‘బోధ’ is a more natural Telugu equivalent for the broader instructional sense of תּוֹרָה than ‘ఉపదేశం’ in this sentence.
  issues:
  - severity: low
    issue: Footnote alternative uses less natural wording and an overly sermonic lexical alternative.
    rationale: ‘నివాసముండే’ is awkward in modern standard Telugu, and ‘ఉపదేశం’ can suggest exhortation rather than the broad ‘instruction’ sense intended as a lexical alternative for תּוֹרָה. Replacing these with ‘నివసించే’ and ‘బోధ’ improves idiom without changing the alternative’s purpose.
  revised_text: దేశస్థునికీ మీ మధ్య నివసించే పరదేశికీ ఒకే నియమం ఉండాలి.[a]
