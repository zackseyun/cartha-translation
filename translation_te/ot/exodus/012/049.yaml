  variant: modern standard Telugu
source:
  edition: WLC
  text: תּוֹרָ֣ה אַחַ֔ת יִהְיֶ֖ה לָֽ/אֶזְרָ֑ח וְ/לַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: te
  text: దేశస్థునికీ మీ మధ్య నివసించే పరదేశికీ ఒకే నియమం ఉండాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశస్థునికీ మీ మధ్య నివసించే పరదేశికీ ఒకే బోధ ఉండాలి.”
    reason: תּוֹרָה అనే పదానికి ‘నియమం’తో పాటు విస్తృతమైన ‘బోధ’ లేదా ‘సూచన’ అనే అర్థం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: תּוֹרָה
  choice: నియమం
  rationale: పస్కా ఆచరణకు సంబంధించిన ఈ న్యాయ సందర్భంలో ఇది బోధను సాధారణంగా సూచించకుండా, అందరికీ వర్తించే బద్ధమైన నియమాన్ని సూచిస్తుంది. ‘నియమం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది; ‘ఉపదేశం’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אַחַת
  choice: ఒకే
  rationale: ఇక్కడ సంఖ్యను మాత్రమే కాక రెండు వర్గాలకూ ఒకటే ప్రమాణం వర్తిస్తుందనే ఏకత్వాన్ని నొక్కిచెబుతుంది. అందువల్ల ‘ఒకే’ సహజమైన తెలుగు రూపం.
- source_word: יִהְיֶה
  choice: ఉండాలి
  rationale: హీబ్రూ క్రియ అక్షరార్థంగా ‘ఉంటుంది/ఉండును’ అయినా, ఈ న్యాయ ప్రకటనలో విధిని తెలిపే భావాన్ని ఆధునిక తెలుగులో ‘ఉండాలి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶזְרָח
  choice: దేశస్థుడు
  rationale: సమాజానికి చెందిన స్థానిక సభ్యుణ్ణి సూచిస్తుంది. ‘పౌరుడు’ తరువాతి రాజకీయ-న్యాయ వర్గీకరణలను దిగుమతి చేసే అవకాశం ఉండగా, ‘దేశస్థుడు’ మూల భావాన్ని కాపాడుతుంది.
- source_word: גֵּר
  choice: పరదేశి
  rationale: ఇశ్రాయేలు సమాజంలో నివసించే, స్థానికుడు కాని వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ సాధారణ పాఠకులకు అర్థమయ్యే పదం; వెంట వచ్చే ‘నివసించే’ అనే విశేషణం అతడు కేవలం ప్రయాణికుడు కాదని స్పష్టం చేస్తుంది.
- source_word: הַגָּר
  choice: నివసించే
  rationale: ఈ వర్తమాన కృదంతం పరదేశి సమాజం మధ్య స్థిరంగా ఉంటున్నాడనే భావాన్ని తెలియజేస్తుంది. తెలుగులో మూలపద పునరుక్తిని బలవంతంగా అనుకరించకుండా అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּתוֹכְכֶם
  choice: మీ మధ్య
  rationale: సమాజం నడుమ నివసించడాన్ని ఆధునిక, సహజ తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయ ప్రకటనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ అనువదించబడింది. రెండు వర్గాలకూ ఒకటే ప్రమాణం అనే మూల వాక్యపు సమాంతర భావం ‘దేశస్థునికీ… పరదేశికీ ఒకే నియమం’ అనే నిర్మాణంలో నిలుపబడింది.
