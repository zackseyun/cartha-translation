language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: te
  text: ఇశ్రాయేలు సమాజమంతా దానిని ఆచరించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు సమాజమంతా దానిని చేయాలి.”
    reason: יַעֲשׂוּ అనే క్రియకు ‘చేయాలి’ అనేది మరింత అక్షరార్థమైన ప్రత్యామ్నాయం; ‘ఆచరించాలి’ అనేది పస్కా సందర్భంలోని భావాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: כָּל עֲדַת
  choice: సమాజమంతా
  rationale: כָּל అనే సంపూర్ణతను, עֲדָה అనే సమష్టి సమాజ భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తపరుస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఉంచింది.
- source_word: יַעֲשׂוּ
  choice: ఆచరించాలి
  rationale: עָשָׂה యొక్క ప్రాథమిక అర్థం ‘చేయు’; అయితే ఇక్కడ పస్కా విధిని నిర్వహించడాన్ని సూచిస్తున్నందున ‘ఆచరించాలి’ సందర్భానుసారంగా సహజంగా ఉంటుంది. ‘చేయాలి’ అనే మరింత రూపసమీప ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: ముందటి సందర్భంలోని పస్కా ఆచరణను సూచించే పుంలింగ ఏకవచన కర్మ సర్వనామాన్ని, దాని నిర్దిష్ట సూచ్యాన్ని అతిగా వివరించకుండా అనువదిస్తుంది.
theological_decisions:
- issue: పస్కా ఆజ్ఞలో సమష్టి కర్త
  choice: ‘ఇశ్రాయేలు సమాజమంతా’ అని సమాజాన్ని సమష్టిగా సంబోధించడం
  alternative: ప్రతి ఇశ్రాయేలీయుడు వ్యక్తిగతంగా దానిని ఆచరించాలి
  rationale: ఏకవచన సమష్టి నామవాచకం జాతీయ సమాజమంతటినీ ఒక సమూహంగా సూచిస్తుంది; మూలపాఠం చెప్పినదానికంటే ఎక్కువగా వ్యక్తిగతీకరించకుండా సామూహిక భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ప్రధాన పాఠంలో సందర్భానుకూలమైన ‘ఆచరించాలి’ వాడి, హీబ్రూ క్రియ యొక్క విస్తృతమైన అక్షరార్థాన్ని పాదసూచికలో నిలిపింది.
