review_pass:
  verdict: revise
  source_fidelity: The draft conveys the prescribed eating, the meat, fire-roasting, unleavened bread, and bitter herbs. However, ‘నిప్పుమీద కాల్చుకొని’ is a converb that can suggest that the eaters first roast it for themselves, whereas צְלִי־אֵשׁ describes the meat as fire-roasted. The Hebrew demonstrative more directly supports ‘ఈ రాత్రి’ in this instruction than ‘ఆ రాత్రి.’
  naturalness: The revised sentence is natural modern standard Telugu and keeps the ritual-instruction register without unnecessary repetition.
  terminology: ‘పులియని రొట్టెలు’ appropriately renders matzot, and ‘చేదు కూరలు’ is a suitably non-sectarian, contextually clear rendering of merorim. ‘నిప్పుపై కాల్చిన’ explicitly preserves the fire-roasting requirement.
  issues:
  - severity: medium
    issue: ‘కాల్చుకొని’ changes the syntactic relationship of fire-roasting to the meat.
    rationale: The Hebrew phrase צְלִי אֵשׁ is a nominal description of the meat (‘fire-roasted’), not an instruction expressed as a prior self-benefiting action by the eaters.
  - severity: low
    issue: ‘ఆ రాత్రి’ weakens the immediate force of הַזֶּה (‘this’).
    rationale: Although English idiom may use ‘that night,’ modern Telugu can naturally retain the source demonstrative as ‘ఈ రాత్రి.’
  revised_text: ఈ రాత్రి వారు నిప్పుపై కాల్చిన ఆ మాంసాన్ని[a] పులియని రొట్టెలతోను చేదు కూరలతోను తినాలి.
  revised_footnotes:
