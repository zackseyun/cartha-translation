  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָכְל֥וּ אֶת הַ/בָּשָׂ֖ר בַּ/לַּ֣יְלָה הַ/זֶּ֑ה צְלִי אֵ֣שׁ וּ/מַצּ֔וֹת עַל מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/008.yaml
  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: te
  text: ఈ రాత్రి వారు నిప్పుపై కాల్చిన ఆ మాంసాన్ని[a] పులియని రొట్టెలతోను చేదు కూరలతోను తినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిప్పుతో కాల్చినది” లేదా “నిప్పుపై కాల్చినది.” ఇది ఇతర విధంగా వండకుండా నిప్పుతో కాల్చాలని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: వారు ... తినాలి
  rationale: ఆచార సంబంధమైన ఆదేశ సందర్భంలో ఈ క్రియకు విధి లేదా నిర్దేశ భావం ఉంది; ఆధునిక తెలుగులో ‘తినాలి’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: הַבָּשָׂר
  choice: ఆ మాంసాన్ని
  rationale: ఆహార సందర్భంలో בָּשָׂר కు సహజమైన ఆధునిక తెలుగు సమానార్థకం ‘మాంసం’; నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ సూచిస్తుంది.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: ఆ రాత్రి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఈ రాత్రిలో/ఈ రాత్రి’; సందర్భంలో పేర్కొన్న నిర్దిష్ట రాత్రిని ఆధునిక తెలుగులో ‘ఆ రాత్రి’ సహజంగా సూచిస్తుంది.
- source_word: צְלִי אֵשׁ
  choice: నిప్పుమీద కాల్చుకొని
  rationale: నిప్పుతో కాల్చే వంటవిధానాన్ని స్పష్టంగా ఉంచుతుంది; తరువాతి వచనంలోని ఉడకబెట్టడంతో ఉన్న వ్యత్యాసాన్నీ కాపాడుతుంది.
- source_word: וּמַצּוֹת
  choice: పులియని రొట్టెలతో
  rationale: מַצּוֹת అంటే పులియబెట్టని రొట్టెలు; తెలుగు పాఠకులకు స్పష్టంగా ఉండే సాధారణ రూపం ఇది.
- source_word: עַל מְרֹרִים
  choice: చేదు కూరలతో
  rationale: ఈ భోజన సందర్భంలో עַל సహభోజనాన్ని సూచిస్తుంది; מְרֹרִים చేదుగా ఉండే తినదగిన ఆకుకూరలు లేదా మూలికలను సూచిస్తుంది. ‘చేదు కూరలు’ సహజమైన, అతిగా నిర్దిష్టం కాని అనువాదం.
- source_word: יֹאכְלֻהוּ
  choice: తినాలి
  rationale: చివరి క్రియకు ఉన్న ఏకవచన పుంలింగ కర్మప్రత్యయం మాంసాన్ని/దానిని తిరిగి సూచిస్తుంది. తెలుగులో అదే కర్మను వాక్యారంభంలో ఉంచి చివర ‘తినాలి’ అనడం సహజం; అనవసర పునరుక్తి లేకుండానే సూచన నిలుస్తుంది.
