- from: ఆ రాత్రి వారు ఆ మాంసాన్ని నిప్పుమీద కాల్చుకొని[a], పులియని రొట్టెలతో, చేదు కూరలతో తినాలి.
  to: ఈ రాత్రి వారు నిప్పుపై కాల్చిన ఆ మాంసాన్ని[a] పులియని రొట్టెలతోను చేదు కూరలతోను తినాలి.
