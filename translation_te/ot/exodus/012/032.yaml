  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: te
  text: మీరు చెప్పినట్టే మీ గొర్రెలనూ మేకలనూ, మీ పెద్ద పశువులనూ తీసుకొని వెళ్లండి. నన్ను కూడా ఆశీర్వదించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను సైతం ఆశీర్వదించండి.’ ఇశ్రాయేలీయులు వెళ్లిపోతున్నప్పుడు ఫరో తాను కూడా ఆశీర్వాదం కోరుతున్నాడనే నొక్కు ఈ మాటల్లో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: మీ గొర్రెలనూ మేకలనూ, మీ పశువులనూ
  rationale: రెండుసార్లు వచ్చిన גַּם రెండు పశువర్గాలనూ సమన్వయంతో నొక్కి చెబుతుంది. צֹאן చిన్న పశువులను, ముఖ్యంగా గొర్రెలు-మేకలను సూచిస్తుంది; בָּקָר పెద్ద పశువులను, ముఖ్యంగా ఆవులు-ఎద్దులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ఈ రూపం ఎంచుకున్నాం.
- source_word: קְחוּ
  choice: తీసుకొని
  rationale: לקח క్రియ యొక్క బహువచన ఆజ్ఞారూపం. ఇక్కడ పశువులను తమతో తీసుకొని వెళ్లేందుకు ఫరో అనుమతిస్తున్న సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: మీరు చెప్పినట్టే
  rationale: మోషే అహరోనులు ముందుగా చేసిన అభ్యర్థనకు అనుగుణంగా ఫరో ఒప్పుకుంటున్న భావాన్ని, పోలికను యథాతథంగా ఉంచుతుంది.
- source_word: וָלֵכוּ
  choice: వెళ్లండి
  rationale: הלך ఇక్కడ బయలుదేరి వెళ్లమనే బహువచన ఆజ్ఞ. తెలుగులో నేరుగా, సహజంగా ఉంది.
- source_word: וּבֵרַכְתֶּם
  choice: ఆశీర్వదించండి
  rationale: ברך పియేల్ రూపానికి ప్రాథమిక అర్థం ‘ఆశీర్వదించు’. ఆశీర్వాదం ఏ విధంగా ఇవ్వబడాలనే విషయాన్ని అదనంగా వ్యాఖ్యానించకుండా మూలంలోని సరళతను నిలుపుతుంది.
- source_word: גַּם אֹתִי
  choice: నన్ను కూడా
  rationale: ఫరో తననూ ఆశీర్వాదం పొందేవారిలో చేర్చమని అడుగుతున్న భావాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది; ‘నన్నైనా’ అనే నొక్కి చెప్పే భావానికి అవకాశం కూడా ఉంది.
theological_decisions:
- issue: ఫరో కోరిన ఆశీర్వాద స్వభావం
  choice: ‘నన్ను కూడా ఆశీర్వదించండి’ అని సూటిగా అనువదించడం
  alternative: ఇశ్రాయేలు దేవుని అనుగ్రహం కోసం మధ్యవర్తిత్వ ప్రార్థన చేయమని కోరడం, లేదా వీడ్కోలు శుభాకాంక్ష కోరడం
  rationale: ברך అనే క్రియ ఆశీర్వదించడాన్ని స్పష్టంగా సూచించినా, ఫరో ఆశించిన ఆశీర్వాదం దేవుని అనుగ్రహం కోసం మధ్యవర్తిత్వమా లేక సాధారణ వీడ్కోలు ఆశీర్వాదమా అనేది వచనం నిర్దిష్టంగా చెప్పదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవ బహువచన ఆజ్ఞారూపాలను ఉపయోగించాం. צֹאן యొక్క విస్తృత భావాన్ని స్పష్టపరచడానికి ‘గొర్రెలనూ మేకలనూ’ అని, בָּקָר కోసం సహజమైన సమూహపదమైన ‘పశువులు’ అని వాడాం. పాదసూచిక గుర్తు [a] ప్రధాన వాక్యంలో చేర్చబడింది.
