id: EXO.12.43
reference: Exodus 12:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: te
  text: 'యెహోవా మోషేతోను అహరోనుతోను ఇలా అన్నాడు: “పస్కా పండుగకు నియమం ఇదే: ఏ పరదేశీ పస్కా పండుగలోనిది తినకూడదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పరదేశితనపు కుమారుడు.” ఇది పరదేశిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: సాధారణ కథన శైలిలోని ‘అన్నాడు’ సహజమైన తెలుగు రూపం; ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ చేర్చాం.
- source_word: חֻקַּת
  choice: నియమం
  rationale: నిర్దేశించబడిన స్థిరమైన ఆచార నియమం అనే న్యాయపరమైన భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַפָּסַח
  choice: పస్కా పండుగ
  rationale: పదం పస్కా ఆచరణను, సందర్భంలో దాని బలిభోజనాన్ని సూచించగలదు; ‘పస్కా పండుగ’ తెలుగులో సహజంగా ఉండి విస్తృత సూచనను నిలుపుతుంది.
- source_word: כָּל בֶּן נֵכָר לֹא יֹאכַל
  choice: పరదేశి ఎవడూ ... తినకూడదు
  rationale: హీబ్రూ ‘ప్రతి పరదేశి తినడు’ అనే నిర్మాణాన్ని తెలుగులో సహజమైన సంపూర్ణ నిషేధంగా వ్యక్తం చేశాం.
- source_word: בֶּן נֵכָר
  choice: పరదేశి
  rationale: అక్షరార్థంగా ‘పరదేశితనపు కుమారుడు’ అనే హీబ్రూ నుడికారం విదేశీయుణ్ణి సూచిస్తుంది; ‘పరదేశి’ గంభీరంగా, స్పష్టంగా ఉంది.
- source_word: בּוֹ
  choice: దానిలోనిది
  rationale: పస్కాకు సంబంధించిన బలిభోజనంలో భాగం తినడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో తెలిపింది.
theological_decisions:
- issue: పస్కా భోజనం నుండి మినహాయించబడిన వ్యక్తి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘పరదేశి’ అని మాత్రమే అనువదించాం.
  alternative: ‘నిబంధన సమాజానికి వెలుపల ఉన్న పరదేశి’ లేదా ‘సున్నతి పొందని పరదేశి’
  rationale: ఈ వచనంలోని పదబంధం స్వయంగా పరదేశిని మాత్రమే పేర్కొంటుంది. తరువాతి సందర్భం నిబంధన సంబంధమైన హద్దులను వివరిస్తున్నా, వాటిని ఈ వాక్యంలో ముందుగానే చేర్చకుండా మూలంలోని పరిధినీ ఉద్రిక్తతనీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనంలో సహజత్వం, దేవుని ఆజ్ఞలో గంభీరమైన న్యాయశైలి నిలిపాం. ప్రతి పాదసూచిక గుర్తును ప్రధాన పాఠ్యంలో ఉంచాం.
