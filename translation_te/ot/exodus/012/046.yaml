  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: te
  text: దానిని ఒకే ఇంట్లో తినాలి; ఆ ఇంట్లోనుంచి మాంసంలో కొంచెమైనా బయటికి తీసుకుపోకూడదు[a]; దాని ఎముకల్లో ఒక్కదానినీ విరవకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకే కుటుంబంలో.’ హీబ్రూ పదం భౌతికమైన ఇంటినీ, అక్కడ కూడిన కుటుంబాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: ఒకే ఇంట్లో
  rationale: בַּיִת అనే పదం భౌతికమైన ఇల్లు లేదా ఇంటివారిని సూచించగలదు. అయితే మాంసాన్ని ఇంటి బయటికి తీసుకుపోకూడదనే వెంటనే వచ్చే నిషేధం ఇక్కడ భౌతిక స్థలార్థాన్ని బలపరుస్తుంది; ‘ఒకే’ అనేది אֶחָד యొక్క ఏకత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יֵאָכֵל
  choice: తినాలి
  rationale: ఇది אכל యొక్క నిఫాల్ అసంపూర్ణ రూపం; పస్కా బలి విషయమైన నియమాన్ని సూచిస్తుంది. తెలుగులో ‘తినాలి’ సహజమైన నియమార్థాన్ని ఇస్తుంది; కృత్రిమమైన కర్మణి నిర్మాణాన్ని తప్పించినా ఎవరు తినాలనే విషయాన్ని అదనంగా నిర్దేశించదు.
- source_word: לֹא תוֹצִיא
  choice: తీసుకుపోకూడదు
  rationale: יצא హిఫీల్ రూపానికి ‘బయటికి తీసుకెళ్లు’ అనే అర్థం. חוּצָהతో కలిపి గమ్యదిశను స్పష్టంగా చూపేందుకు ‘బయటికి తీసుకుపోకూడదు’ అని అనువదించాం.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: ఆ ఇంట్లోనుంచి ... బయటికి
  rationale: మూలంలోని ‘ఇంటినుంచి’ అనే ఆరంభబిందువునూ חוּצָה సూచించే బయటివైపు గమనాన్నీ రెండింటినీ తెలుగులో నిలుపుతుంది.
- source_word: מִן הַבָּשָׂר
  choice: మాంసంలో కొంచెమైనా
  rationale: ఆహార సందర్భంలో בָּשָׂרకు సహజమైన తెలుగు సమానార్థకం ‘మాంసం’. מִן యొక్క భాగార్థాన్ని ‘కొంచెమైనా’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: దానిలోని ఒక్క ఎముకనైనా విరవకూడదు
  rationale: ఏకవచన עֶצֶם ఇక్కడ పంపిణీ భావంతో ఏ ఎముకనూ విరవకూడదని సూచిస్తుంది. ‘ఒక్క ఎముకనైనా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘దానిలోని’ అనే రూపం בוֹను పస్కా బలిపశువుకు అన్వయిస్తూ, వచనంలో లేని ‘గొర్రెపిల్ల’ అనే నిర్దిష్ట నామాన్ని చేర్చదు.
theological_decisions:
- issue: చివరి సర్వనామం בוֹ యొక్క సూచ్యం
  choice: పస్కా బలిపశువు మొత్తాన్ని సూచించే ‘దానిలోని’
  alternative: ప్రత్యేకంగా పస్కా గొర్రెపిల్లను సూచించవచ్చు
  rationale: హీబ్రూ సర్వనామం పుంలింగ ఏకవచనంలో ఉండి చర్చలోని పస్కా బలిని తిరిగి సూచిస్తుంది. ‘దానిలోని’ తక్షణ సూచ్యాన్ని నిలుపుతూ, ఈ వచనంలో ప్రత్యక్షంగా లేని ‘గొర్రెపిల్ల’ అనే పదాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నియమశైలిని ఉపయోగించాం. హీబ్రూ కర్మణి రూపాన్ని తెలుగులో సహజమైన విధ్యర్థక ‘తినాలి’తో వ్యక్తపరిచాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంచబడింది.
