id: EXO.12.27
reference: Exodus 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: te
  text: 'మీరు ఇలా చెప్పాలి: ‘ఇది యాహ్వేకు అర్పించే పస్కా బలి; ఆయన ఐగుప్తును దెబ్బతీసినప్పుడు, ఐగుప్తులోని ఇశ్రాయేలు కుమారుల ఇళ్లను దాటిపోయి[a] మన ఇళ్లను కాపాడాడు.’ అప్పుడు ప్రజలు వంగి ఆరాధించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దాటిపోయి” అని అనువదించిన హీబ్రూ క్రియ, “పస్కా” అనే పదంతో ఒకే మూలానికి చెందినది; సందర్భంలో అది కాపాడటం లేదా విడిచిపెట్టడం అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: పస్కా బలి
  rationale: నామవాచక సంబంధాన్ని, బలికి సంబంధించిన ఆరాధనా భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు అర్పించే
  rationale: ל ఉపసర్గంలోని సమర్పణ/అంకిత భావాన్ని బలి సందర్భంలో స్పష్టంగా తెలియజేస్తుంది; దైవనామాన్ని యాహ్వే అని ఉంచుతుంది.
- source_word: פָּסַח
  choice: దాటిపోయి
  rationale: פֶּסַח అనే నామంతో ఉన్న మూలపద సంబంధాన్ని నిలుపుతుంది; కాపాడటం అనే సందర్భార్థాన్ని పాదసూచికలో సూచించాం.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ఇళ్లను
  rationale: హీబ్రూ కుటుంబ/నిబంధనాత్మక పదబంధాన్ని పారదర్శకంగా, దాని పుంలింగ రూపంతో సహా నిలుపుతుంది.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: ఐగుప్తీయులను దెబ్బతీసినప్పుడు
  rationale: కాలసూచక నిర్మాణాన్ని ‘దెబ్బతీసినప్పుడు’గా అందిస్తుంది; אֶת־מִצְרַיִם ఇక్కడ దేశాన్ని దాని ప్రజలుగా సూచించే సహజ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הִצִּיל
  choice: కాపాడాడు
  rationale: విడిపించడం, రక్షించడం అనే נצל భావాన్ని ఈ గృహాల సంరక్షణ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: తలవంచి ఆరాధించారు
  rationale: మొదటి క్రియలోని శరీర భంగిమను, రెండవ క్రియలోని భక్తిపూర్వక ఆరాధనను పునరుక్తి లేకుండా వేరు చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- issue: בְנֵי יִשְׂרָאֵל అనే నిబంధనాత్మక కుటుంబ పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలోని పుంలింగ బహువచన కుటుంబ రూపకాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలు సహజమైనవైనా మూల నిర్మాణాన్ని కొంత సమతలీకరిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, అర్పణ భావాన్ని క్రియాత్మకంగా స్పష్టం చేశాం.
