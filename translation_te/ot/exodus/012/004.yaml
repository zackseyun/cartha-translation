translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని ఇంటివారి సంఖ్య, పొరుగింటితో పంచుకోవడం, ప్రతి వ్యక్తి తినగల పరిమాణాన్ని బట్టి లెక్కించడం అనే అంశాలు నిలిపాం.
