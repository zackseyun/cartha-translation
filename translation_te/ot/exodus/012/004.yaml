  text: וְ/אִם יִמְעַ֣ט הַ/בַּיִת֮ מִ/הְיֹ֣ת מִ/שֶּׂה֒ וְ/לָקַ֣ח ה֗וּא וּ/שְׁכֵנ֛/וֹ הַ/קָּרֹ֥ב אֶל בֵּית֖/וֹ בְּ/מִכְסַ֣ת נְפָשֹׁ֑ת אִ֚ישׁ לְ/פִ֣י אָכְל֔/וֹ תָּכֹ֖סּוּ עַל הַ/שֶּֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: te
  text: ఒక గొర్రెపిల్లకు[a] ఒక ఇంటివారు సరిపోకపోతే, అతడూ తన ఇంటికి దగ్గరగా ఉన్న పొరుగువాడూ వ్యక్తుల సంఖ్యను బట్టి ఒకదాన్ని తీసుకోవాలి. ఒక్కొక్కరు ఎంత తినగలరో బట్టి, ఆ గొర్రెపిల్లకు కావలసిన వారి సంఖ్యను మీరు లెక్కించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొర్రెపిల్ల’ అని అనువదించిన హీబ్రూ పదం గొర్రెలలోనిదైనా మేకలలోనిదైనా ఒక చిన్న పశువును సూచించగలదు; 5వ వచనం చూడండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: ఒక గొర్రెపిల్లను తీసుకోవడానికి ఒక ఇంటివారి సంఖ్య చాలకపోతే
  rationale: הַבַּיִת ఇక్కడ భవనాన్ని కాక ఇంటివారిని సూచిస్తుంది; יִמְעַט ... מִהְיֹת అనేది ఆ జంతువును భుజించేందుకు వారి సంఖ్య చాలకపోవడాన్ని తెలియజేస్తుంది.
- source_word: שֶׂה
  choice: గొర్రెపిల్ల
  rationale: ఈ పదం గొర్రెలలోనిదైనా మేకలలోనిదైనా చిన్న పశువును సూచించగలదు. సందర్భంలో సహజంగా ఉండేందుకు ‘గొర్రెపిల్ల’ వాడి, విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: అతడు తన ఇంటికి దగ్గరగా ఉన్న పొరుగువానితో కలిసి ... ఒకదాన్ని తీసుకోవాలి
  rationale: హీబ్రూ వాక్యం సమీప పొరుగింటివారితో కలిసి ఒకే జంతువును తీసుకోవాలని చెబుతుంది; సందర్భం ద్వారా తెలిసే కర్మను ‘ఒకదాన్ని’ అని స్పష్టం చేశాం.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: వ్యక్తుల సంఖ్యను బట్టి
  rationale: נְפָשֹׁת ఇక్కడ శరీరరహిత ‘ఆత్మలు’ కాదు, భోజనంలో పాల్గొనే వ్యక్తులు; מִכְסָה లెక్క లేదా నిర్ణీత సంఖ్యను సూచిస్తుంది.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ఒక్కొక్కరు ఎంత తినగలరో దాన్ని బట్టి
  rationale: אִישׁ పంపిణీ భావంలో ‘ఒక్కొక్కరు’; לְפִי אָכְלוֹ ప్రతి వ్యక్తి తినే పరిమాణం లేదా సామర్థ్యాన్ని సూచించే జాతీయ ప్రయోగం.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: ఆ గొర్రెపిల్ల కోసం మీరు వ్యక్తులను లెక్కించాలి
  rationale: అరుదైన క్రియ ఇక్కడ లెక్కించడం లేదా నిర్ధారించడం అనే భావాన్ని ఇస్తుంది; ఎవరు ఆ జంతువును పంచుకోవాలో వారి తినే పరిమాణాన్ని బట్టి లెక్కించడమే సందర్భార్థం.
