revisions:
- from: ఒక గొర్రెపిల్లను తీసుకోవడానికి ఒక ఇంటివారి సంఖ్య చాలకపోతే, అతడు తన ఇంటికి దగ్గరగా ఉన్న పొరుగువానితో కలిసి, వ్యక్తుల సంఖ్యను బట్టి ఒకదాన్ని తీసుకోవాలి. ఒక్కొక్కరు ఎంత తినగలరో దాన్ని బట్టి, ఆ గొర్రెపిల్ల కోసం మీరు వ్యక్తులను లెక్కించాలి.[a]
  to: ఒక గొర్రెపిల్లకు[a] ఒక ఇంటివారు సరిపోకపోతే, అతడూ తన ఇంటికి దగ్గరగా ఉన్న పొరుగువాడూ వ్యక్తుల సంఖ్యను బట్టి ఒకదాన్ని తీసుకోవాలి. ఒక్కొక్కరు ఎంత తినగలరో బట్టి, ఆ గొర్రెపిల్లకు కావలసిన వారి సంఖ్యను మీరు లెక్కించాలి.
  rationale: 'The revision improves idiomatic Telugu while preserving the source sequence and sense: a household too small for one animal joins its nearest neighbor, according to the number of persons; the number is reckoned in proportion to each person’s eating capacity. The note preserves the lexical breadth of שֶׂה without introducing an interpretive claim.'
  reviewer_model: gpt-5.6-terra
