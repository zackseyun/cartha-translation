  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: te
  text: ఏడు రోజులపాటు మీరు పులియని రొట్టెలు తినాలి. అయితే మొదటి రోజునే మీ ఇళ్లలో నుంచి పులియబెట్టే పదార్థాన్ని తొలగించాలి[a]. ఎందుకంటే మొదటి రోజు మొదలుకొని ఏడవ రోజు వరకు పులిసినది ఏదైనా తినే ప్రతి వ్యక్తి ఇశ్రాయేలులోనుంచి కొట్టివేయబడతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థం ‘పులియబెట్టే పదార్థం నిలిచిపోయేలా చేయాలి.’ దీన్ని ‘తీసివేయాలి’ లేదా ‘నాశనం చేయాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కొట్టివేయబడతాడు’ అనేది హీబ్రూ న్యాయపరమైన పదప్రయోగం. ఇది సమాజం నుంచి బహిష్కరణను, మరణాన్ని లేదా దేవుని తీర్పును సూచించవచ్చు; అది ఏ విధంగా జరుగుతుందో ఈ వాక్యం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: పులియని రొట్టెలు
  rationale: ఈ నామవాచకం పులియబెట్టే పదార్థం లేకుండా చేసిన రొట్టెలను సూచిస్తుంది. ఆచార సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: సాధారణ ఆజ్ఞ నుంచి మొదటి రోజుకు సంబంధించిన ప్రత్యేక ఆజ్ఞకు మార్పును సహజంగా సూచిస్తుంది.
- source_word: תַּשְׁבִּיתוּ
  choice: తొలగించాలి
  rationale: שׁבת ధాతువు హిఫీల్ రూపంలో ‘లేకుండా చేయడం/నిలిచిపోయేలా చేయడం’ అనే భావాన్ని ఇస్తుంది. ఇళ్లలో నుంచి పులియబెట్టే పదార్థాన్ని తీసివేయాలనే ఆచరణాత్మక ఉద్దేశాన్ని ‘తొలగించాలి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְּׂאֹר
  choice: పులియబెట్టే పదార్థం
  rationale: పిండిని పులియబెట్టే పులిసిన ముద్ద లేదా ఇతర పులియబెట్టే కారకాన్ని సూచిస్తుంది. కేవలం ఆధునిక వాణిజ్య ఈస్ట్‌కే భావాన్ని పరిమితం చేయదు.
- source_word: חָמֵץ
  choice: పులిసినది ఏదైనా
  rationale: ఈ పదం రొట్టెకు మాత్రమే పరిమితం కాకుండా పులిసిన ఆహారాన్ని విస్తృతంగా సూచించగలదు.
- source_word: וְנִכְרְתָה
  choice: కొట్టివేయబడతాడు
  rationale: ఒడంబడిక, న్యాయ సందర్భాల్లోని ‘తెగగొట్టబడడం/కొట్టివేయబడడం’ అనే బలమైన పదప్రయోగాన్ని నిలుపుతుంది; శిక్ష అమలు విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ప్రతి వ్యక్తి
  rationale: న్యాయ సూత్రంలో נֶפֶשׁ ఒక వ్యక్తిని సూచిస్తుంది. ‘ప్రతి వ్యక్తి’ అనేది ముందున్న כָּל‌తో కలిసి సహజమైన తెలుగు రూపం.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలులోనుంచి
  rationale: ఇశ్రాయేలు సమాజంతో ఉన్న సంబంధం నుంచి తొలగించబడే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: మొదటి రోజు మొదలుకొని ఏడవ రోజు వరకు
  rationale: నిషేధం వర్తించే మొత్తం కాలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూ వాక్యంలోని కాలపరమైన అనుబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: וְנִכְרְתָה అనే శిక్షాసూత్రం యొక్క ఖచ్చితమైన భావం
  choice: ‘ఇశ్రాయేలులోనుంచి కొట్టివేయబడతాడు’ అనే న్యాయపరమైన పదప్రయోగాన్ని నిలుపడం
  alternative: సమాజం నుంచి బహిష్కరించబడతాడు; మరణశిక్ష పొందుతాడు; దేవుని తీర్పువల్ల తొలగించబడతాడు
  rationale: ఈ వాక్యం శిక్ష యొక్క ఖచ్చితమైన విధానాన్ని పేర్కొనదు. అందువల్ల బహిష్కరణ, మరణం లేదా దైవిక తీర్పు అనే వివాదాస్పద అవకాశాల్లో ఒక్కదానినే అనువాదంలో నిర్ణయించకుండా మూలంలోని న్యాయ-వేదాంత ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఆచార సంబంధ పదాలకు స్పష్టమైన తెలుగు రూపాలు ఎంచుకొని, హీబ్రూ న్యాయపరమైన అస్పష్టతను పాదటిప్పణితో నిలిపాం.
