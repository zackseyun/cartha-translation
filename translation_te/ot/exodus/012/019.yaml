id: EXO.12.19
reference: Exodus 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: te
  text: ఏడు రోజులపాటు మీ ఇళ్లలో పులియబెట్టే పదార్థం ఉండకూడదు. ఎందుకంటే పులిసిన ఏదైనా తినే ప్రతి వ్యక్తి ఇశ్రాయేలు సమాజం[c] నుండి తొలగించబడాలి[a]—అతడు నివాస పరదేశియైనా[b], దేశంలో పుట్టినవాడైనా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆ ప్రాణం నరికివేయబడాలి.” ఇక్కడ హెబ్రీ పదం వ్యక్తిని సూచిస్తుంది; “తొలగించబడాలి” అనే నుడికారం సందర్భానుసారం బహిష్కరణను, మరణాన్ని, లేదా దేవుని తీర్పును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నివాస పరదేశి” అనే మాటకు “పరదేశ నివాసి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “సమాజం” అనే మాటకు “సభ” లేదా “సముదాయం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని సూచించే హెబ్రీ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂאֹר
  choice: పులిసే పదార్థం
  rationale: ఇది పులిసిన ఆహారాన్ని కాక, ఆహారాన్ని పులియబెట్టే పదార్థాన్ని సూచిస్తుంది; ‘పులిసే పదార్థం’ ఆ భేదాన్ని తెలుగులో నిలుపుతుంది.
- source_word: לֹא יִמָּצֵא
  choice: కనిపించకూడదు
  rationale: నిఫల్ రూపంలోని నిషేధార్థాన్ని, ఇళ్లలో అది ఉండకూడదనే ఫలిత స్థితితో సహజంగా తెలియజేస్తుంది.
- source_word: בְּבָתֵּיכֶם
  choice: మీ ఇళ్లలో
  rationale: హెబ్రీ బహువచనాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: כָּל אֹכֵל
  choice: తినే వ్యక్తి
  rationale: כָּלతో కూడిన కృదంత నిర్మాణానికి ఉన్న సార్వత్రిక భావం సందర్భంలోని ‘ఏ వ్యక్తియైనా’ అనే అర్థంలో వ్యక్తమవుతుంది.
- source_word: מַחְמֶצֶת
  choice: పులిసినది ఏదైనా
  rationale: రొట్టెకు మాత్రమే పరిమితం చేయకుండా, పులిసిన ఆహార పదార్థాల విస్తృత వర్గాన్ని సూచిస్తుంది.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ఆ వ్యక్తి తొలగించబడాలి
  rationale: נֶפֶשׁను ఇక్కడ ‘వ్యక్తి’గా గ్రహించి, כרת అనే నిబంధనాత్మక శిక్షా నుడికారాన్ని దాని ఖచ్చిత విధానాన్ని నిర్ణయించకుండా నిలుపుతుంది.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజం నుండి
  rationale: עֵדָה యొక్క సమావేశం/సముదాయం అనే సామూహిక భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּגֵּר
  choice: మీ మధ్య నివసించే పరదేశి
  rationale: ఇశ్రాయేలీయుల మధ్య స్థిరంగా నివసించే, స్థానికుడు కాని వ్యక్తిని సూచించే גֵּר భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: దేశంలో పుట్టినవాడు
  rationale: גֵּרకు వ్యతిరేకంగా స్థానిక జన్మగల వ్యక్తిని సూచిస్తుంది; ఆధునిక పౌరసత్వ భావనను దిగుమతి చేయదు.
theological_decisions:
- issue: ‘తొలగించబడాలి’ అనే నిబంధనాత్మక శిక్ష యొక్క ఖచ్చిత భావం
  choice: ‘ఇశ్రాయేలు సమాజం నుండి తొలగించబడాలి’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘చంపబడాలి’ లేదా ‘సమాజం నుండి బహిష్కరించబడాలి’ అని నిర్దిష్టీకరించడం
  rationale: హెబ్రీ כרת నుడికారం సందర్భానుసారం మరణం, బహిష్కరణ లేదా దేవుని తీర్పును సూచించవచ్చు. వచనం తేల్చని విధానాన్ని అనువాదం తేల్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిధి గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే భాష వాడబడింది. పరదేశి మరియు స్థానికుని మధ్య హెబ్రీ వ్యత్యాసం స్పష్టంగా ఉంచబడింది; శిక్ష యొక్క విధానం ఉద్దేశపూర్వకంగా నిర్దిష్టీకరించబడలేదు.
