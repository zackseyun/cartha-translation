review_pass:
  verdict: revise
  source_fidelity: The draft conveys the temporal prohibition, the distinction between leavening agent and leavened food, the comprehensive scope of the offender, and the contrast between resident foreigner and native-born. However, 'కనిపించకూడదు' can mean merely 'must not be visible,' whereas the Hebrew prohibits leaven from being found/present. The phrase 'మీ మధ్య' adds a relational detail not expressed in this verse. The sanction idiom is appropriately left unresolved, but its note anchor should directly follow the sanction.
  naturalness: The revised wording uses idiomatic modern standard Telugu and follows the Hebrew legal sequence more clearly. 'పులియబెట్టే పదార్థం' distinguishes the leavening agent from 'పులిసిన ఏదైనా,' the leavened item.
  terminology: '''ఇశ్రాయేలు సమాజం'' is an appropriate rendering of עֲדַת יִשְׂרָאֵל. ''నివాస పరదేశి'' faithfully expresses גֵּר without importing modern citizenship categories. ''తొలగించబడాలి'' retains the covenant-sanction idiom without deciding whether it denotes exclusion, death, or divine judgment.'
  issues:
  - severity: medium
    issue: The prohibition is rendered as 'కనిపించకూడదు.'
    rationale: This may imply that leaven must not be seen rather than that it must not be present/found in the houses. 'ఉండకూడదు' more naturally conveys the required state.
  - severity: low
    issue: The rendering adds 'మీ మధ్య' to the description of the ger.
    rationale: Although compatible with the broader sense of גֵּר, this verse itself simply contrasts the resident foreigner with the native-born. The addition is unnecessary.
  - severity: low
    issue: Footnote markers are all placed at the sentence end rather than at their respective referents.
    rationale: Placing each marker immediately after the relevant expression makes the lexical alternatives and the ambiguous sanction clear to readers.
  revised_text: ఏడు రోజులపాటు మీ ఇళ్లలో పులియబెట్టే పదార్థం ఉండకూడదు. ఎందుకంటే పులిసిన ఏదైనా తినే ప్రతి వ్యక్తి ఇశ్రాయేలు సమాజం[c] నుండి తొలగించబడాలి[a]—అతడు నివాస పరదేశియైనా[b], దేశంలో పుట్టినవాడైనా.
