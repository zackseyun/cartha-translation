id: EXO.12.44
reference: Exodus 12:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: te
  text: కానీ, ఒక మనిషికి చెందిన, వెండితో కొనబడిన ప్రతి బానిసకు నీవు సున్నతి చేసిన తర్వాత, అతడు దానిలోనుండి తినవచ్చు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל
  choice: కానీ ... ప్రతి
  rationale: ముందటి వచనంలోని పరదేశి గురించిన నిషేధానికి దీనిని అనుసంధానిస్తూ, తదుపరి నియమంలోని వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶבֶד
  choice: దాసుడు
  rationale: డబ్బుతో కొనబడిన వ్యక్తి అని సందర్భం స్పష్టంగా చెబుతున్నందున, సేవకుడు అనే మృదువైన పదం కంటే బానిసత్వ స్థితిని సూచించే గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం ఎంచుకోబడింది.
- source_word: אִישׁ
  choice: ప్రతి మనిషి
  rationale: యజమానిని సూచించే హెబ్రీ ఏకవచన పుంలింగ రూపాన్ని నిలుపుతుంది; ఇంటి యజమాని అని విస్తరించి వ్యాఖ్యానించదు.
- source_word: מִקְנַת כָּסֶף
  choice: వెండితో కొనబడిన
  rationale: హెబ్రీలోని వెండి అనే రూపకల్పనను నిలుపుతూ, కొనుగోలు చేయబడిన వ్యక్తి అనే న్యాయసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: నీవు సున్నతి చేసిన తరువాత
  rationale: రెండవ పురుష ఏకవచన సంబోధనను కాపాడి, భోజనంలో పాల్గొనడానికి సున్నతి ముందస్తు షరతని న్యాయవాక్య క్రమానుసారం తెలియజేస్తుంది.
- source_word: אָז
  choice: తరువాత
  rationale: సున్నతి అనంతరం కలిగే పరిణామాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ప్రత్యేకంగా ‘అప్పుడు’ చేర్చితే వచ్చే అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: יֹאכַל בּוֹ
  choice: అతడు దానిలోనిది తినవచ్చు
  rationale: అనుమతిని సూచించే అసంపూర్ణ క్రియ భావాన్ని ‘తినవచ్చు’గా, పస్కా భోజనంలో భాగాన్ని తినడాన్ని בּוֹ ప్రకారం ‘దానిలోనిది’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిబంధనాత్మక న్యాయసందర్భంలో עֶבֶד పదం
  choice: దాసుడు
  alternative: సేవకుడు / బానిస
  rationale: కొనుగోలు చేసిన వ్యక్తి అనే వివరణ యాజమాన్యానికి లోబడిన స్థితిని ప్రధానంగా చేస్తుంది. ‘సేవకుడు’ ఆ వాస్తవాన్ని మృదుపరచవచ్చు; ‘దాసుడు’ ఆధునిక ప్రామాణిక తెలుగులో గంభీరంగా ఉండి మూలంలోని సామాజిక వాస్తవాన్ని తెలియజేస్తుంది.
- issue: אִישׁ లోని పుంలింగ ఏకవచనం
  choice: మనిషి
  alternative: వ్యక్తి / ఇంటి యజమాని
  rationale: మూలంలోని పుంలింగ ఏకవచన న్యాయవిషయాన్ని నిలుపుతుంది. ‘వ్యక్తి’ లింగభేదాన్ని సమతలపరుస్తుంది; ‘ఇంటి యజమాని’ మూలానికి మించిన వ్యాఖ్యానం.
- issue: יֹאכַל యొక్క విధి భావం
  choice: తినవచ్చు
  alternative: తింటాడు / తినాలి
  rationale: ఇక్కడ సున్నతి తర్వాత పస్కాలో పాల్గొనే అనుమతి ఉద్దేశించబడింది; భవిష్యదర్థం లేదా ఆజ్ఞార్థాన్ని బలవంతంగా మోపకుండా మూలంలోని సందర్భసిద్ధమైన విధి భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయశైలి. మూలంలోని బానిసత్వ వాస్తవాన్ని మృదుపరచకుండా ‘దాసుడు’ వాడబడింది. అవసరం లేని పాదటిప్పణులు చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదటిప్పణి గుర్తులు లేవు.
