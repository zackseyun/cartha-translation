source:
  edition: WLC
  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: te
  text: జాగ్రత్తగా ఉండు; దుష్టత్వం వైపు తిరగకు[a]. ఎందుకంటే బాధకంటే దానినే నీవు ఎంచుకున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుష్టత్వం’ అని అనువదించిన హీబ్రూ పదం אָוֶן కు ‘చెడు,’ ‘అకృత్యం,’ ‘అపకారం,’ లేదా కొన్ని సందర్భాల్లో ‘కష్టం’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థానికి దగ్గరగా: ‘ఎందుకంటే బాధకంటే దీనినే నీవు ఎంచుకున్నావు.’ భావం: తాను అనుభవిస్తున్న బాధకంటే తప్పు చేయడాన్ని యోబు ఎంచుకోకూడదని ఏలీహూ హెచ్చరిస్తున్నాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: జాగ్రత్తగా ఉండు
  rationale: నిఫాల్ ఆజ్ఞారూపం హెచ్చరిక లేదా అప్రమత్తతకు పిలుపుగా పనిచేస్తుంది. ఆధునిక తెలుగులో ఇది సహజంగా ఉండి ఆజ్ఞాబలాన్ని నిలుపుతుంది.
- source_word: אַל תֵּפֶן
  choice: వైపు తిరగకు
  rationale: אַל తో కూడిన Qal రూపం నిషేధాన్ని తెలియజేస్తుంది; ‘వైపు తిరగకు’ దిశమార్పు అనే రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶל אָוֶן
  choice: దుష్టత్వం వైపు
  rationale: אָוֶן పదానికి దుష్టత్వం, చెడు, అపకారం లేదా కష్టం అనే అర్థాలు ఉండవచ్చు. ఇక్కడ నైతిక హెచ్చరిక సందర్భంలో ‘దుష్టత్వం’ ప్రధాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని సహజ తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: עַל זֶה
  choice: దానినే
  rationale: ముందు ప్రస్తావించిన దుష్టత్వాన్ని సూచించే భావాన్ని తెలుగులో సహజమైన సర్వనామంతో వ్యక్తం చేస్తుంది; ‘నే’ ఎంపికలోని ప్రాధాన్యాన్ని చూపుతుంది.
- source_word: בָּחַרְתָּ
  choice: నీవు ఎంచుకున్నావు
  rationale: రెండవ పురుష ఏకవచన పరిపూర్ణ క్రియను పూర్తయిన, ప్రస్తుతం ప్రాసంగికమైన ఎంపికగా వ్యక్తం చేస్తుంది.
- source_word: מֵעֹנִי
  choice: బాధను భరించడం కంటే
  rationale: עֹנִי ఇక్కడ యోబు అనుభవిస్తున్న బాధ లేదా దుఃఖాన్ని సూచిస్తుంది. מִן పోలికను తెలియజేస్తుంది. తెలుగులో పోలిక ఉద్దేశం స్పష్టంగా ఉండేందుకు ‘భరించడం’ సందర్భానుసారంగా పూరించబడింది.
theological_decisions:
- issue: యోబు దుష్టత్వాన్ని బాధకంటే ఎంచుకున్నాడనే ఏలీహూ ఆరోపణ
  choice: వాక్యాన్ని ఏలీహూ చేసిన నేర ప్రత్యక్ష ఆరోపణగానే ఉంచడం
  alternative: ‘దుష్టత్వాన్ని ఎంచుకోకుండా జాగ్రత్తపడు’ అనే భవిష్యత్ ప్రమాద హెచ్చరికగా మృదువుగా చేయడం
  rationale: హీబ్రూ בָּחַרְתָּ పరిపూర్ణ రూపం ‘నీవు ఎంచుకున్నావు’ అని చెబుతుంది. యోబు నిజంగా దుష్టుడని అనువాదమే తీర్పు చెప్పకుండా, వక్త అయిన ఏలీహూ మాటలోని ఉద్రిక్తతను అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దుష్టత్వం’ నైతిక భావాన్ని ఇస్తుంది; ‘వైపు తిరగకు’ మూలంలోని దిశాత్మక రూపకాన్ని కాపాడుతుంది. రెండో వాక్యంలో ‘భరించడం’ సహజ తెలుగు కోసం సందర్భానుసారంగా చేర్చబడింది; అక్షరార్థ నిర్మాణం పాదటిప్పణిలో ఇవ్వబడింది.
