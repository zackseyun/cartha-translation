  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: te
  text: ఎందుకంటే, నిజంగా నా మాటలు అబద్ధాలు కావు; జ్ఞానంలో సంపూర్ణుడైనవాడు నీతో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానంలో సంపూర్ణుడైనవాడు” అనేది ఏలీహును కాక దేవుణ్ణి సూచిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఈ ప్రకటనను వివరణాత్మకంగా అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָמְנָם
  choice: నిజంగా
  rationale: ఏలీహు తన మాటల సత్యత్వాన్ని నొక్కిచెప్పే ధృవీకరణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֹא שֶׁקֶר
  choice: అబద్ధం కావు
  rationale: ‘నా మాటలు’ అనే బహువచన కర్తతో సహజంగా సరిపోతూ, అసత్యం లేదా మోసం కాదనే మూలభావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מִלָּי
  choice: నా మాటలు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామానికి నేరమైన, సహజమైన అనువాదం.
- source_word: תְּמִים
  choice: సంపూర్ణుడైనవాడు
  rationale: సంపూర్ణత, సమగ్రత అనే మూలార్థాన్ని నిలుపుతూ, ఏలీహు వాక్యంలోని ఉద్దేశపూర్వకమైన ధైర్యోక్తిని తగ్గించదు.
- source_word: דֵּעוֹת
  choice: జ్ఞానంలో
  rationale: హీబ్రూ బహువచన భావనను తెలుగులో సహజమైన సమష్టి నామంగా అందిస్తూ, תְּמִיםతో ఉన్న సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עִמָּךְ
  choice: నీతో ఉన్నాడు
  rationale: యోబును నేరుగా సంబోధించే రెండవ పురుష ఏకవచన భావాన్ని, ‘తో’ అనే సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘జ్ఞానంలో సంపూర్ణుడైనవాడు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ప్రధాన పాఠ్యంలో ఏలీహు తనను తానే సూచిస్తున్నట్లు సందర్భానుగుణంగా చదవగల రూపం
  alternative: ఈ మాట దేవుణ్ణి సూచించవచ్చు
  rationale: ‘నా మాటలు’ అని తన వాక్కును సమర్థించుకుంటున్న తక్షణ సందర్భం ఏలీహు స్వీయసూచనకు అనుకూలంగా ఉంది. అయితే హీబ్రూ వ్యాకరణం సూచిత వ్యక్తిని పేరుతో నిర్ధారించదు; అందువల్ల ప్రధాన పాఠ్యం ఆ అనిశ్చితిని మూసివేయకుండా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని ధృవీకరణ, ధైర్యోక్తి, సూచిత వ్యక్తికి సంబంధించిన నిజమైన అనిశ్చితి నిలుపబడ్డాయి.
