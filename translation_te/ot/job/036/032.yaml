source:
  edition: WLC
  text: עַל כַּפַּ֥יִם כִּסָּה א֑וֹר וַ/יְצַ֖ו עָלֶ֣י/הָ בְ/מַפְגִּֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/032.yaml
  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: te
  text: 'ఆయన తన అరచేతులను మెరుపుతో[a] కప్పి,

    దానిని లక్ష్యాన్ని తాకమని ఆజ్ఞాపిస్తాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘వెలుగు’; చుట్టుపక్కల ఉన్న తుఫాను వర్ణనలో ఇది బహుశా ‘మెరుపు’ను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి పదబంధం హీబ్రూలో క్లిష్టంగా ఉంది. ‘అది తాకిన వ్యక్తికి వ్యతిరేకంగా’ లేదా ‘మధ్యవర్తికి వ్యతిరేకంగా’ అనే అనువాదాలు కూడా సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: అరచేతులను
  rationale: ద్వివచన రూపమైన כַּפַּיִם ప్రత్యేకంగా రెండు అరచేతులను సూచిస్తుంది; తుఫాను కవిత్వంలోని శరీరరూపకాన్ని ఇది స్పష్టంగా నిలుపుతుంది.
- source_word: כִּסָּה
  choice: కప్పి
  rationale: כסה యొక్క ప్రాథమిక అర్థం ‘కప్పుట, మరుగుచేయుట’; ఇక్కడ ‘కప్పి’ దృశ్యరూపకాన్ని సహజంగా అందిస్తుంది.
- source_word: אוֹר
  choice: మెరుపుతో
  rationale: אוֹר సాధారణంగా ‘వెలుగు’; అయితే చుట్టుపక్కల తుఫాను సందర్భంలో అది మెరుపును సూచించే అవకాశం బలంగా ఉంది.
- source_word: וַיְצַו
  choice: ఆజ్ఞాపిస్తాడు
  rationale: צוה అంటే ‘ఆజ్ఞాపించుట’; మెరుపుపై దేవుని వ్యక్తిగత అధికారాన్ని వర్తమాన కవితా వర్ణనలో నిలుపుతుంది.
- source_word: עָלֶיהָ
  choice: అది ... అని
  rationale: స్త్రీలింగ ప్రత్యయం దేనిని సూచిస్తుందో స్పష్టంగా లేదు; సందర్భానుసారంగా మెరుపును సూచించే తటస్థ సర్వనామంతో సహజ తెలుగు వాక్యనిర్మాణం వాడబడింది.
- source_word: בְמַפְגִּיעַ
  choice: గురిని తాకాలని
  rationale: פגע మూలం ‘తాకుట, ఎదురుపడుట, దాడిచేయుట’తో పాటు ‘విన్నవించుట’ అనే భావాన్నీ ఇవ్వగలదు. తుఫాను సందర్భంలో మెరుపును లక్ష్యానికి నడిపించడం అనే భావం సందర్భోచితం, అయినా క్లిష్టతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: בְמַפְגִּיעַ అనే క్లిష్ట పదబంధంలో ‘విన్నవించేవాడు’ అనే సాధ్యమైన అర్థం
  choice: తుఫాను సందర్భానికి అనుగుణంగా ‘గురిని తాకాలని’
  alternative: ‘అది తాకే దానికి వ్యతిరేకంగా’ లేదా ‘విన్నవించేవానికి వ్యతిరేకంగా’
  rationale: మధ్యవర్తిత్వానికి సంబంధించిన ప్రత్యేకమైన వేదాంత భావాన్ని పాఠ్యంలోకి బలవంతంగా తేవకుండా, సందర్భంలోని మెరుపు దృశ్యాన్ని అనుసరించాం; నిజమైన భాషా అనిశ్చితిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడబడింది. ‘అరచేతులు’ మూలంలోని ద్వివచన శరీరరూపకాన్ని నిలుపుతుంది; పాఠ్యంలోని రెండు పాదసూచిక గుర్తులు [a], [b] సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
