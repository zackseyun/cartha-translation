source:
  edition: WLC
  text: כִּ֭י יְגָרַ֣ע נִטְפֵי מָ֑יִם יָזֹ֖קּוּ מָטָ֣ר לְ/אֵדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: te
  text: ఎందుకంటే ఆయన నీటి బిందువులను పైకి లాగుతాడు; ఆయన ఆవిరి నుండి అవి వర్షంగా కురుస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఆవిరి నుండి అవి వర్షాన్ని ధారగా పోస్తాయి.” రెండో పాదంలోని హీబ్రూ వాక్యం కఠినమైనది; “ఆవిరి” అనే పదాన్ని “పొగమంచు” అని కూడా అనువదించవచ్చు.
    reason: יָזֹקּוּ మరియు לְאֵדוֹ పదబంధాల అర్థం, సంబంధం అనిశ్చితంగా ఉండటం వల్ల ప్రధాన ప్రత్యామ్నాయాన్ని చూపించడం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో దేవుని గొప్పతనాన్ని వివరించే కారణార్థక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְגָרַע
  choice: పైకి లాగుతాడు
  rationale: మూల క్రియకు సాధారణంగా ‘తగ్గించు/తీసివేయు’ అనే అర్థాలున్నా, ఇక్కడ నీటి బిందువులను పైకి తీసుకునే వాతావరణ ప్రక్రియ సందర్భార్థం. ఈ ఎంపిక దానిని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: נִטְפֵי מָיִם
  choice: నీటి బిందువులను
  rationale: నిర్మాణ పదబంధంలోని ‘నీటి బిందువులు’ అనే ప్రత్యక్ష భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָזֹקּוּ
  choice: వర్షంగా కురుస్తాయి
  rationale: זקק ఇక్కడ వడకట్టడం, చిందించడం లేదా ధారగా పోయడం వంటి కఠినమైన కవితాత్మక ప్రయోగం. వర్షం ఏర్పడి కిందికి రావడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: מָטָר
  choice: వర్షంగా
  rationale: మూల నామవాచకమైన ‘వర్షం’ను తెలుగులో వాక్య నిర్మాణానికి తగిన విధంగా క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: לְאֵדוֹ
  choice: ఆయన ఆవిరి నుండి
  rationale: אֵד కు ‘ఆవిరి/పొగమంచు’ భావం ఉంది; కష్టమైన לְ ఉపసర్గను ఇక్కడ మూలార్థ సంబంధంగా ‘నుండి’ అని తీసుకుంది. 3వ పురుష ఏకవచన ప్రత్యయాన్ని దేవునిని సూచించే ‘ఆయన’గా నిలిపింది.
theological_decisions:
- issue: לְאֵדוֹ లోని 3వ పురుష పుంలింగ ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: దేవునిని సూచించే ‘ఆయన ఆవిరి’
  alternative: ‘దాని ఆవిరి’ అనే నిర్జీవార్థం; లేదా పాఠ/స్వర సవరణలతో ‘వాటి ఆవిరి’
  rationale: సమీప సందర్భంలో దేవుడే సృష్టి క్రియలకు కర్త. అందువల్ల మూలంలోని ఏకవచన ప్రత్యయాన్ని మార్చకుండా దేవునికి అన్వయించడం సందర్భానుకూలం; అయితే వాతావరణ ప్రక్రియపై మూలంలో ఉన్న కవితాత్మక అస్పష్టతను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కవితాత్మక గౌరవభావాన్ని నిలుపుతూ రూపొందించబడింది. ‘పైకి లాగుతాడు’ నీటి చక్ర భావాన్ని స్పష్టం చేస్తుంది; కఠినమైన రెండో పాదానికి ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
