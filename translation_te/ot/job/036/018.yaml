source:
  edition: WLC
  text: כִּֽי חֵ֭מָה פֶּן יְסִֽיתְ/ךָ֣ בְ/סָ֑פֶק וְ/רָב כֹּ֝֗פֶר אַל יַטֶּֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: te
  text: కోపం విషయంలో జాగ్రత్తపడు; అది నిన్ను అపహాస్యం వైపు ప్రేరేపించకుండునట్లు చూడు[a]. గొప్ప పరిహార మూల్యం[b] నిన్ను దారి మళ్లించనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చేతులు చరచడానికి’ లేదా ‘ఎగతాళిగా చప్పట్లు కొట్టడానికి.’ ఇక్కడి హీబ్రూ పదం అరుదైనది, దాని అర్థం అనిశ్చితం; అది ధిక్కార సూచనగా చేతులు చరచడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పరిహార మూల్యం’ అనే పదానికి ‘విమోచన మూల్యం,’ ‘ప్రాయశ్చిత్త మూల్యం,’ లేదా కొన్ని సందర్భాల్లో ‘లంచం’ అనే అర్థాలు కూడా ఉండవచ్చు. ఈ పదబంధాన్ని ‘పరిహార మూల్యం ఎంత గొప్పదైనా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: తెలుగు హెచ్చరిక నిర్మాణంలో అంతర్లీన కారణార్థం
  rationale: ఈ పదానికి ‘ఎందుకంటే/ఏలయనగా’ అనే కారణార్థం ఉంది. అయితే ఇక్కడ దాని తరువాత స్వతంత్ర కారణ వాక్యం రాకుండా నేరుగా హెచ్చరిక రావడంతో, తెలుగులో అసహజమైన వాక్యఖండాన్ని నివారించేందుకు కారణసంబంధాన్ని ‘ప్రేరేపించకుండా జాగ్రత్తపడు’ అనే నిర్మాణంలో అంతర్లీనంగా వ్యక్తం చేశాం.
- source_word: חֵמָה
  choice: కోపం
  rationale: ఇది తీవ్రమైన కోపం లేదా ఉగ్రతను సూచిస్తుంది. అది దేవుని కోపమా, యోబు కోపమా, లేక సాధారణంగా కోపమా అని మూలపాఠం స్పష్టం చేయదు; అందువల్ల విస్తృతార్థమున్న ‘కోపం’ వాడాం.
- source_word: פֶּן יְסִיתְךָ
  choice: నిన్ను … ప్రేరేపించకుండా జాగ్రత్తపడు
  rationale: פֶּן హెచ్చరికను, סות హిఫీల్ రూపం ప్రేరేపించడం లేదా తప్పుదారి పట్టించడాన్ని సూచిస్తాయి. ఈ కలయికను సహజమైన ఆధునిక తెలుగులో హెచ్చరికగా ఇచ్చాం.
- source_word: בְסָפֶק
  choice: అపహాస్యం వైపు
  rationale: ఈ అరుదైన పదం అర్థం వివాదాస్పదం. సందర్భంలో ఎగతాళి లేదా ధిక్కార చర్య అనే భావాన్ని ప్రధాన పాఠంలో ఎంచుకుని, మరింత అక్షరార్థమైన ‘చప్పట్లు కొట్టడం/చేతులు చరచడం’ అనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: רָב כֹּפֶר
  choice: గొప్ప విమోచన మూల్యం
  rationale: רָב పరిమాణం లేదా గొప్పతనాన్ని, כֹּפֶר పరిహారంగా చెల్లించే విమోచన మూల్యాన్ని సూచించగలవు. ‘గొప్ప విమోచన మూల్యం’ పదబంధ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: אַל יַטֶּךָּ
  choice: నిన్ను దారి మళ్లించనివ్వకు
  rationale: נטה హిఫీల్ రూపంలోని ‘వంగించడం, పక్కకు తిప్పడం’ అనే రూపకాన్ని ‘దారి మళ్లించడం’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘కోపం’ ఎవరిది?
  choice: కేవలం ‘కోపం’ అని అనిర్దిష్టంగా ఉంచడం
  alternative: ‘దేవుని కోపం’ లేదా ‘నీ కోపం’ అని స్పష్టం చేయడం
  rationale: హీబ్రూ పాఠం కోపానికి సంబంధించిన వ్యక్తిని పేర్కొనదు. సందర్భం ఒకటి కంటే ఎక్కువ అర్థాలకు వీలు కల్పిస్తున్నందున అనిశ్చితిని పరిష్కరించకుండా నిలిపాం.
- issue: כֹּפֶר యొక్క భావం
  choice: విమోచన మూల్యం
  alternative: లంచం లేదా ప్రాయశ్చిత్త మూల్యం
  rationale: ఈ పదానికి పరిహారం, విమోచన మూల్యం, కొన్ని సందర్భాల్లో లంచం అనే అర్థాలు ఉన్నాయి. ప్రధాన పాఠంలో తక్కువగా వ్యాఖ్యానాత్మకమైన విస్తృత భావాన్ని తీసుకుని ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే హెచ్చరిక శైలి. మూలంలోని ‘కోపం’ అనిర్దిష్టతను, בְסָפֶק మరియు כֹּפֶר పదాల అర్థసందిగ్ధతను నిలిపాం.
