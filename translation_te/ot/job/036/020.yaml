  yaml_path: translation/ot/job/036/020.yaml
  text: Do not long for the night[a], when peoples are taken away from their place.
translation:
  language: te
  text: ప్రజలు తమ స్థానాల నుండి తొలగించబడే రాత్రిని కోరుకోకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ప్రజలు వారి కిందనుండి పైకి వెళ్లడానికి రాత్రిని కోరుకోకు.” హీబ్రూ పాఠం క్లిష్టంగా ఉంది; ‘ప్రజలు తమ స్థానాల నుండి తొలగించబడే’ అనేది సందర్భం ఆధారంగా సాధారణంగా గ్రహించే భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: ఆశించకు అనే నిషేధ రూపంలో
  rationale: אַל + అసంపూర్ణ క్రియ నిషేధ ఆజ్ఞను సూచిస్తుంది; తెలుగులో ఏకవచన ప్రత్యక్ష నిషేధ రూపం సహజంగా ఉంది.
- source_word: תִּשְׁאַף
  choice: ఆశించకు
  rationale: שׁאף ఇక్కడ బలంగా కోరుకోవడం లేదా తహతహలాడడం అనే భావాన్ని ఇస్తుంది. ‘ఆశించకు’ సాధారణ ఆధునిక తెలుగులో ఆ నిషిద్ధ కోరికను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַלָּיְלָה
  choice: రాత్రిని
  rationale: నిర్దిష్ట నామవాచకానికి సూటియైన అనువాదం; క్రియకు కర్మగా తెలుగులో ద్వితీయా విభక్తి వాడబడింది.
- source_word: לַעֲלוֹת
  choice: తొలగించబడే
  rationale: עלה యొక్క ఈ రూపం ఇక్కడ క్లిష్టమైనది. సందర్భానుసారంగా జనులు ఎత్తివేయబడడం లేదా తొలగించబడడం అనే సాధారణ అవగాహనను ప్రధాన పాఠంలో సహజంగా అందిస్తుంది; అక్షరార్థ అనిశ్చితిని పాదటిప్పణిలో ఉంచింది.
- source_word: עַמִּים
  choice: జనులు
  rationale: బహువచనంలోని సామూహిక లేదా జాతుల భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּחְתָּם
  choice: తమ స్థలంలోనుండి
  rationale: పదశః ‘వారి కిందనుండి/వారి కింద’ అయినా, ఈ క్లిష్ట సందర్భంలో తమ స్థానం నుండి తొలగింపబడడం అనే సంభావ్య భావాన్ని తెలుగులో స్పష్టంగా ఇస్తుంది.
