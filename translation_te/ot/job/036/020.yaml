  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని క్లిష్టతను ప్రధాన పాఠంలో సందర్భోచిత భావంతో అందించి, అక్షరార్థ ప్రత్యామ్నాయాన్ని [a] పాదటిప్పణిలో సంరక్షించాం.
