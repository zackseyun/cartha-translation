source:
  edition: WLC
  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: te
  text: ఇదిగో, దేవుడు శక్తిమంతుడు; మరియు ఆయన తృణీకరించడు[a]. ఆయన హృదయబలంలో శక్తిమంతుడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరస్కరించడు’ లేదా ‘తోసిపుచ్చడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పాఠ్యంలో ఈ క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘హృదయ బలం.’ ఇది మనోబలం, అవగాహన లేదా దృఢసంకల్పాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: బలమైన ప్రకటనను పరిచయం చేసే కావ్య సంభాషణ సూచకాన్ని, దాని గంభీర స్వరాన్ని నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇది దేవునికి వాడిన సాధారణ కావ్యపదం; ప్రత్యేక బిరుదుగా విస్తరించాల్సిన అవసరం లేదు.
- source_word: כַּבִּיר
  choice: శక్తిమంతుడు
  rationale: గొప్పతనం, శక్తి అనే భావాలను తెలియజేస్తుంది; వచనంలోని రెండు ప్రయోగాల్లోనూ ఒకే పదాన్ని ఉంచి కావ్య పునరుక్తిని కాపాడుతుంది.
- source_word: וְלֹא יִמְאָס
  choice: అయినా ఆయన తృణీకరించడు
  rationale: מָאַס అంటే తృణీకరించడం, తిరస్కరించడం, తోసిపుచ్చడం. మూలంలో కర్మ స్పష్టంగా లేదు; అందువల్ల తెలుగులోనూ ‘ఎవరినీ’ వంటి కర్మను ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలిపాం.
- source_word: כֹּחַ לֵב
  choice: హృదయబలం
  rationale: మూలంలోని ‘హృదయ బలం’ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది. ‘హృదయం’ మనస్సు, అవగాహన లేదా దృఢసంకల్పాన్ని సూచించవచ్చు కాబట్టి భావాన్ని ఒక్క అర్థానికి పరిమితం చేయలేదు.
theological_decisions:
- issue: ‘తృణీకరించడు’ అనే క్రియకు చెప్పని కర్మ
  choice: కర్మను చేర్చకుండా ‘ఆయన తృణీకరించడు’ అని అనువదించడం
  alternative: ‘ఆయన ఎవరినీ తృణీకరించడు’ లేదా ‘ఆయన తిరస్కరించడు’
  rationale: హీబ్రూ పాఠ్యం కర్మను పేర్కొనదు. ‘ఎవరినీ’ అని చేర్చడం భావాన్ని స్పష్టపరిచినా, మూలంలోని నిజమైన వ్యాకరణ అస్పష్టతను తొలగిస్తుంది; అందుకే దానిని పాదసూచికలో వివరించాం.
- issue: ‘హృదయబలం’ యొక్క భావం
  choice: మూల రూపకాన్ని ‘హృదయబలం’గా నిలుపడం
  alternative: ‘అవగాహనలో బలవంతుడు’ లేదా ‘దృఢసంకల్పం గలవాడు’
  rationale: לֵב అనే పదం అంతరంగం, మనస్సు, అవగాహన లేదా సంకల్పాన్ని సూచించగలదు. ఒకే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కావ్యోచిత గాంభీర్యం నిలిచే శైలిని వాడాం. ‘ఇదిగో’ అనే సంభాషణ సూచకం, ‘శక్తిమంతుడు’ అనే పునరుక్తి మూలంలోని ఉద్ఘాటనను కాపాడుతాయి. చెప్పని కర్మ కారణంగా వచ్చే స్వల్ప అసంపూర్ణతను ఉద్దేశపూర్వకంగా నిలిపి పాదసూచికతో వివరించాం.
