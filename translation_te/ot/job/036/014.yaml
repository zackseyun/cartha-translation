  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: te
  text: వారు యౌవనంలో చనిపోతారు; ఆరాధనా-సంబంధమైన పురుష వేశ్యల[a] మధ్య వారి జీవితం ముగుస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతిష్ఠించబడినవారి మధ్య.” ఇక్కడి హీబ్రూ పదం ఆరాధనా ఆచారాలతో సంబంధమున్న పురుష వేశ్యలను సూచించే అవకాశం ఎక్కువ.
    reason: కְדֵשִׁים పదంలోని అక్షరార్థ ప్రత్యామ్నాయాన్ని, దాని సంభావ్య చారిత్రక ప్రయోగాన్ని రెండింటినీ సంరక్షించడానికి.
lexical_decisions:
- source_word: תָּמֹת
  choice: చనిపోతారు
  rationale: מות అనే క్రియకు ఇక్కడ ‘చనిపోవడం’ అనే సాధారణ అర్థమే తగినది. హీబ్రూలో ‘వారి ప్రాణం’ వ్యాకరణపరమైన కర్తగా ఉన్నా, తెలుగులో వ్యక్తులనే కర్తగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: בַּנֹּעַר
  choice: యౌవనంలోనే
  rationale: נֹעַר యౌవనాన్ని లేదా జీవితపు తొలిదశను సూచిస్తుంది. ‘నే’ అకాల మరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַפְשָׁם
  choice: వారు
  rationale: נֶפֶשׁ ఇక్కడ ‘ప్రాణం/జీవితం/వ్యక్తి’ అనే భావంలో ఉంది. ‘వారి ప్రాణం చనిపోతుంది’ అనే పదానువాదం తెలుగులో అసహజంగా, తప్పుదారి పట్టించేదిగా ఉండవచ్చు కాబట్టి వ్యక్తులనే కర్తగా వ్యక్తపరిచాం.
- source_word: וְחַיָּתָם
  choice: వారి జీవితం ముగుస్తుంది
  rationale: ఈ నామరూపం వారి జీవితం లేదా జీవితకాలాన్ని సూచిస్తుంది. రెండో పాదంలో క్రియ అధ్యాహారంగా ఉన్నందున, ముందటి పాదంతో సమాంతరతను తెలుగులో సహజంగా చూపడానికి ‘ముగుస్తుంది’ చేర్చబడింది.
- source_word: בַּקְּדֵשִׁים
  choice: అన్యమత ఆరాధనలోని పురుష వేశ్యల మధ్య
  rationale: קְדֵשִׁים సాధారణంగా పవిత్రులని కాక, నిషిద్ధ ఆరాధనా లైంగిక ఆచారంతో సంబంధమున్న పురుషులను సూచించే అవకాశం ఎక్కువ. ‘అన్యమత ఆరాధనలోని పురుష వేశ్యలు’ చారిత్రక సందర్భాన్ని, పురుష లింగ సూచనను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: קְדֵשִׁים అనే పదం యొక్క అర్థం
  choice: అన్యమత ఆరాధనలోని పురుష వేశ్యలు
  alternative: ప్రతిష్ఠితులు
  rationale: హీబ్రూ బైబిలులో קָדֵשׁ పదప్రయోగం అనేక చోట్ల నిషిద్ధ ఆరాధనా లైంగిక సేవతో సంబంధమున్న పురుషులను సూచిస్తుంది. అయినా పదానికి అక్షరార్థంగా ‘ప్రతిష్ఠితులు’ అనే అవకాశం ఉన్నందున దానిని పాదటిప్పణిలో నిలిపాం; తరువాతి కాలపు సిద్ధాంతపరమైన వర్గీకరణలను మూలంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘వారు … చనిపోతారు’ అనే నిర్మాణం హీబ్రూ ‘వారి ప్రాణం చనిపోతుంది’ అనే నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది; రెండో పాదంలోని అధ్యాహార క్రియను ‘ముగుస్తుంది’గా స్పష్టం చేసింది.
