id: JOB.36.11
reference: Job 36:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִֽם יִשְׁמְע֗וּ וְֽ/יַ֫עֲבֹ֥דוּ יְכַלּ֣וּ יְמֵי/הֶ֣ם בַּ/טּ֑וֹב וּ֝/שְׁנֵי/הֶ֗ם בַּ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: te
  text: వారు ఆలకించి సేవచేస్తే[a], తమ దినాలను మేలులోను తమ సంవత్సరాలను సుఖాలలోను గడుపుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విని విధేయులై సేవచేస్తే’; సందర్భంలో ‘ఆలకించడం’ అనే హీబ్రూ క్రియ విధేయంగా వినే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ దినాలను మేలులోను తమ సంవత్సరాలను సుఖాలలోను పూర్తిచేస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేస్తే
  rationale: హీబ్రూ షరతును తెలుగులో సహజమైన ‘-తే’ రూపంతో వ్యక్తం చేశాం.
- source_word: יִשְׁמְעוּ
  choice: ఆలకించి
  rationale: שׁמעలో వినడం, శ్రద్ధగా ఆలకించడం, విధేయంగా స్పందించడం అనే భావవ్యాప్తి ఉంది; ‘ఆలకించి’ ప్రాథమిక అర్థాన్ని నిలుపుతూ స్పందన భావానికీ చోటిస్తుంది.
- source_word: וְיַעֲבֹדוּ
  choice: సేవచేస్తే
  rationale: עבדకు ఇక్కడ విస్తృతమైన ‘సేవచేయడం’ సరిపోతుంది; దానిని కేవలం ఆరాధనగా లేదా శ్రమగా కుదించదు.
- source_word: יְכַלּוּ
  choice: గడుపుతారు
  rationale: దినాలు, సంవత్సరాలతో వచ్చిన כלה పియేల్ రూపం జీవితకాలాన్ని పూర్తిగా గడపడం అనే నుడికార భావాన్ని ఇస్తుంది; తెలుగులో ‘గడుపుతారు’ సహజంగా ఉంది.
- source_word: יְמֵיהֶם
  choice: తమ దినాలను
  rationale: మూలంలోని స్వాధీన ప్రత్యయాన్ని, కావ్య సమాంతరతను నిలిపే ప్రత్యక్ష రూపం.
- source_word: בַּטּוֹב
  choice: మేలులోను
  rationale: טוב ఇక్కడ నామవాచకంగా అనుకూలమైన, శ్రేయస్కరమైన స్థితిని సూచిస్తుంది; ‘మేలు’ దానిని కేవలం ధనసంపదకు పరిమితం చేయదు.
- source_word: וּשְׁנֵיהֶם
  choice: తమ సంవత్సరాలను
  rationale: ‘తమ దినాలు’తో ఉన్న కావ్య సమాంతరతను నిలిపింది.
- source_word: בַּנְּעִימִים
  choice: సుఖాలలోను
  rationale: נְעִימִים యొక్క బహువచన రూపం సుఖకరమైన అనుభవాలు లేదా ఆనందకర పరిస్థితులను సూచించగలదు; ‘సుఖాలలో’ బహువచనాన్ని, కవితాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విధేయత ఎల్లప్పుడూ భౌతిక ఐశ్వర్యాన్నే కలిగిస్తుందనే నిరపేక్ష వాగ్దానంగా ఈ వాక్యాన్ని చదవాలా?
  choice: ఏలీహూ మాటల సందర్భంలో ఉన్న షరతుగల వాక్యంగానే అనువదించాం; ‘మేలు’ను విస్తృతంగా ఉంచాం.
  alternative: దీనిని విధేయతకు తప్పనిసరిగా భౌతిక ఐశ్వర్యం లభిస్తుందనే సార్వత్రిక సిద్ధాంతంగా చేయడం, లేదా పూర్తిగా ఆధ్యాత్మిక ఆశీర్వాదంగా మార్చడం.
  rationale: హీబ్రూ అనుకూల జీవన పరిస్థితులను సూటిగా పేర్కొంటుంది; అయితే వక్త చెప్పిన మాటను అనువాదమే సార్వత్రిక సిద్ధాంతంగా విస్తరించకూడదు, అలాగే దాని సాధారణ జీవనార్థాన్ని ఆధ్యాత్మికీకరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘ఆలకించి’ కవితాత్మక గౌరవాన్ని నిలుపుతుంది; ‘గడుపుతారు’ హీబ్రూ కాలవ్యవధి నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
