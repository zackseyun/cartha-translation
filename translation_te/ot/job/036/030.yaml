  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: te
  text: 'ఇదిగో, ఆయన దానిమీద తన వెలుగును[a][b] పరచి,

    సముద్రపు వేర్లను[c] కప్పుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దానిమీద”కు బదులు “అతనిమీద” అని కూడా అనువదించవచ్చు. హీబ్రూ సర్వనామం పుంలింగ ఏకవచనంలో ఉంది; అది ఎవరిని లేదా దేనిని సూచిస్తుందో ఈ వాక్యంలో స్పష్టంగా లేదు. సందర్భంలో అది మేఘాన్ని లేదా తుఫాను సమూహాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “తన వెలుగును”కు బదులు “తన మెరుపును” లేదా “తన ప్రకాశాన్ని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “సముద్రపు వేర్లను”; ఇది సముద్రపు అట్టడుగు భాగాలను లేదా పునాదులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: తరువాతి దృశ్యంపై దృష్టి నిలిపే కవితాత్మక సూచన పదం; ఆధునిక తెలుగులో గంభీరతను నిలుపుతుంది.
- source_word: פָּרַשׂ
  choice: పరచి
  rationale: విస్తరింపజేయడం లేదా చాపడం అనే మూలభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלָיו
  choice: దానిమీద
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనం; దాని నిర్దిష్ట పూర్వపదం స్పష్టంగా లేదు. సందర్భంలోని మేఘం లేదా తుఫాను సమూహాన్ని సూచించే అవకాశం ఉన్నందున తెలుగులో నిర్జీవ సూచనను వాడి, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: אוֹרוֹ
  choice: తన వెలుగును
  rationale: אוֹר యొక్క విస్తృతమైన ‘వెలుగు’ భావాన్ని నిలుపుతుంది; తుఫాను సందర్భంలో ‘మెరుపు’ అనే భావసంభావ్యతను పాదసూచికలో సూచించాం.
- source_word: וְשָׁרְשֵׁי הַיָּם
  choice: సముద్రపు మూలాలను
  rationale: ‘సముద్రపు వేర్లు’ అనే అక్షరార్థ రూపకం తెలుగులో అసహజంగా లేదా మొక్కల వేర్లుగా అపార్థమయ్యే అవకాశం ఉంది. ‘మూలాలు’ రూపకంలోని పునాది/అట్టడుగు భావాన్ని నిలుపుతూ కవితాత్మకంగా ఉంటుంది.
- source_word: כִּסָּה
  choice: కప్పుతాడు
  rationale: ‘కప్పు’ అనే ప్రత్యక్ష భావాన్ని తీసుకుని, కవితలోని వర్ణనాత్మక వర్తమాన క్రమాన్ని అనుసరించాం.
