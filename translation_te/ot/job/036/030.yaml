translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని వాడాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దృశ్యరూపాన్ని మరియు అస్పష్టతను నిలిపేలా వాక్యాన్ని అమర్చాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
