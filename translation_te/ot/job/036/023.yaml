  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: te
  text: 'ఆయన నడవవలసిన మార్గాన్ని ఎవరు నిర్దేశించారు?[a]


    లేదా, “నీవు అన్యాయం చేశావు” అని ఎవరు అన్నారు?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు ఆయన మార్గాన్ని ఎవరు నియమించారు?” హెబ్రీ క్రియకు నియమించడం, నిర్దేశించడం, బాధ్యతగా విధించడం, లేదా పర్యవేక్షించడం వంటి భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు తప్పు చేశావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామానికి సహజమైన తెలుగు సమానం.
- source_word: פָקַד
  choice: నిర్ణయించారు
  rationale: ఈ సందర్భంలో దేవుని మార్గాన్ని మరొకరు నియమించడం, నిర్దేశించడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘నిర్ణయించారు’ సహజంగా ఉండి, మూలపదంలోని నియమించే భావాన్ని నిలుపుతుంది; ‘అప్పగించారు’ అనే భావం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
- source_word: עָלָיו
  choice: ఆయనకు
  rationale: פקד అనే క్రియతో కలిసి, ఆయన కోసం లేదా ఆయనపై మార్గాన్ని నిర్దేశించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דַּרְכּוֹ
  choice: ఆయన మార్గాన్ని
  rationale: ‘మార్గం’ అనే పదం అక్షరార్థంతో పాటు ప్రవర్తన లేదా కార్యగమనాన్ని సూచించే రూపకార్థాన్నీ నిలుపుతుంది.
- source_word: וּמִי
  choice: లేదా ... ఎవరు
  rationale: రెండవ అలంకారిక ప్రశ్నను మొదటిదానికి ప్రత్యామ్నాయంగా జోడించే సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: אָמַר
  choice: అన్నారు
  rationale: 'సంపూర్ణ క్రియను గతకాల అలంకారిక ప్రశ్నగా సహజంగా అందిస్తుంది: ఎవరైనా ఎప్పుడైనా ఇలా ఆరోపించారా అనే భావం సందర్భంలో స్పష్టంగా ఉంటుంది.'
- source_word: פָּעַלְתָּ
  choice: నీవు ... చేశావు
  rationale: עַוְלָהతో కలిసి ఉండే ఆరోపణలో ‘చేశావు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: మూలపదం అన్యాయం, తప్పు, అధర్మం అనే భావాలను కలిగి ఉంది. ఈ సందర్భంలో ‘అన్యాయం’ దేవునిపై చేయబడే నైతిక ఆరోపణను స్పష్టంగా వ్యక్తం చేస్తుంది; విస్తృతమైన ‘తప్పు’ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: పుంలింగ ప్రత్యయాలు, ఏకవచన ద్వితీయ పురుష క్రియ ఎవరిని సూచిస్తున్నాయి?
  choice: 'సందర్భానుసారం అవి దేవుణ్ణి సూచిస్తాయి: ఆయన మార్గాన్ని ఎవరూ ఆయనకు నిర్ణయించలేదు; ఆయన అన్యాయం చేశాడని ఎవరూ న్యాయంగా ఆరోపించలేరు.'
  alternative: ఒక శక్తిమంతుడైన పాలకుడు లేదా మనిషి గురించిన సాధారణ వ్యాఖ్యగా చదవడం.
  rationale: యోబు 36:22–23 సందర్భంలో ఎలీహూ దేవుని గొప్పతనాన్ని, న్యాయాన్ని కీర్తిస్తున్నాడు. అయినా మూలంలోని సర్వనామ స్థానంలో వివరణాత్మకంగా ‘దేవుడు’ అని చేర్చకుండా ‘ఆయన/నీవు’ అనే రూపాలను ఉంచి, వాక్యంలోని ప్రత్యక్ష సంబోధనను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దేవునికి సంబంధించిన తృతీయ పురుష రూపాల్లో గౌరవార్థక ‘ఆయన’ వాడబడింది; ప్రత్యక్ష ఉల్లేఖనంలో మూలంలోని ఏకవచన ‘నీవు’ నిలుపబడింది. రెండు అలంకారిక ప్రశ్నల సమాంతర నిర్మాణం కాపాడబడింది.
