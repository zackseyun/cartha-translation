  source_fidelity: హీబ్రూ షరతు-వ్యతిరేక నిర్మాణం (וְאִם), שׁמע యొక్క విస్తృతమైన ‘విను/ఆలకించు’ భావం, בְּשֶׁלַח యొక్క ఖడ్గ-సాధనార్థం, అలాగే మరణాన్ని సూచించే రెండు సమాంతర క్రియలను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ‘జ్ఞానం లేకుండా’ అనేది כִּבְלִי דָעַת యొక్క స్థితి భావాన్ని కాపాడుతుంది; కారణార్థక ప్రత్యామ్నాయాన్ని పాదసూచికలో సరిగా ఇస్తుంది.
