id: JOB.36.12
reference: Job 36:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: te
  text: అయితే వారు వినకపోతే, ఖడ్గం చేత నశించిపోతారు; జ్ఞానం లేకుండా మరణిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జ్ఞానం కొరవడడం వల్ల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: అయితే ...పోతే
  rationale: ముందటి వచనానికి భిన్నమైన షరతును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יִשְׁמְעוּ
  choice: వారు వినకపోతే
  rationale: שׁמע అనే పదంలో వినడం, శ్రద్ధగా ఆలకించడం, తదనుగుణంగా నడుచుకోవడం అనే భావపరిధి ఉంది. ‘వినకపోతే’ ఆ విస్తృతిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: בְּשֶׁלַח
  choice: ఖడ్గం చేత
  rationale: שׁלח ఇక్కడ నాశనకరమైన ఆయుధాన్ని సూచిస్తుంది; సందర్భంలో ‘ఖడ్గం’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: יַעֲבֹרוּ
  choice: నశించిపోతారు
  rationale: עבר యొక్క అక్షరార్థం ‘దాటిపోవడం’; తీర్పు సందర్భంలో అది గతించిపోవడం లేదా నశించడం అనే మరణార్థక ప్రయోగం. తెలుగులో ‘నశించిపోతారు’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וְיִגְוְעוּ
  choice: మరణిస్తారు
  rationale: גוע ప్రాణం విడవడం లేదా చనిపోవడాన్ని సూచిస్తుంది. ‘మరణిస్తారు’ గంభీరంగా, స్పష్టంగా ఉండి సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతుంది.
- source_word: כִּבְלִי דָעַת
  choice: జ్ఞానం లేకుండా
  rationale: ఈ పదబంధం జ్ఞానం లేని స్థితిని నేరుగా సూచించగలదు; జ్ఞానలోపమే మరణానికి కారణమనే భావం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: שׁמע కేవలం వినడాన్నా, లేక విధేయ స్పందననూ సూచిస్తుందా?
  choice: వినకపోతే
  alternative: విధేయత చూపకపోతే
  rationale: ‘వినడం’ అనే ఎంపిక మూలపదంలోని వినడం-పాటించడం భావపరిధిని నిలుపుతూ, వాక్యం చెప్పినదానికంటే సంకుచితమైన వ్యాఖ్యానాన్ని రుద్దదు.
- issue: כִּבְלִי דָעַת కారణాన్ని సూచిస్తుందా, లేక స్థితిని సూచిస్తుందా?
  choice: జ్ఞానం లేకుండా
  alternative: జ్ఞానం కొరవడడం వల్ల
  rationale: హీబ్రూ నిర్మాణం ‘జ్ఞానం లేకుండా’ అనే స్థితి భావానికి నేరుగా అనుకూలిస్తుంది. కారణార్థం కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన జ్ఞానసాహిత్య శైలిని అనుసరించాం. ‘వినకపోతే’ మరియు ‘జ్ఞానం లేకుండా’ అనే పదబంధాలు మూలంలోని భావవిస్తృతినీ సందిగ్ధతనూ నిలుపుతాయి.
