- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר క్రియను సందర్భానుకూలంగా ‘అన్నాడు’ అని అనువదించాం; తరువాత వచ్చే ప్రసంగాన్ని పరిచయం చేయడానికి తెలుగులో సహజంగా ఉండే ‘ఇలా’ను చేర్చాం.
