  text: וַ/יִּ֣גֶל אָ֭זְנָ/ם לַ/מּוּסָ֑ר וַ֝/יֹּ֗אמֶר כִּֽי יְשֻׁב֥וּ/ן מֵ/אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/010.yaml
  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: te
  text: ఆయన శిక్షణకు వారి చెవిని తెరుస్తాడు[a]; దుష్టత్వం నుండి వారు తిరిగిరావాలని చెబుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దిద్దుబాటు కోసం వారి చెవిని విప్పుతాడు,’ లేదా ‘ఉపదేశం వినేలా వారి చెవులు తెరుస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘దుష్టత్వం’ అనే మాటను ‘దోషం,’ ‘కీడు’ అని, కొన్ని సందర్భాల్లో ‘కష్టం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֶל
  choice: తెరుస్తాడు
  rationale: גלה అనే క్రియ ఇక్కడ ‘చెవి’తో కలిసి, వినడానికి గ్రహణశక్తిని కలిగించేలా ‘చెవి తెరవడం’ అనే రూపకార్థాన్ని ఇస్తుంది.
- source_word: אָזְנָם
  choice: వారి చెవి
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నందున సమూహార్థక ఏకవచనాన్ని నిలిపి, మూలంలోని రూపకాన్ని ప్రతిబింబిస్తుంది.
- source_word: לַמּוּסָר
  choice: శిక్షణకు
  rationale: מוּסָר బోధన, దిద్దుబాటు, క్రమశిక్షణ అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. సందర్భంలో బాధ ద్వారా దిద్దే బోధన ఉన్నందున ‘శిక్షణ’ బోధనాత్మక, దిద్దుబాటు కోణాలను సహజంగా కలుపుతుంది.
- source_word: וַיֹּאמֶר
  choice: చెబుతాడు
  rationale: אמר యొక్క సరళమైన అర్థాన్ని ఇస్తూ, కావ్య సందర్భంలోని వర్తమాన వర్ణనను కొనసాగిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי చెప్పబడిన మాటలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ సహజమైన సమానార్థకం.
- source_word: יְשֻׁבוּן
  choice: వారు తిరిగిరావాలని
  rationale: שוב అంటే తిరగడం లేదా తిరిగిరావడం. ఈ పరోక్ష వాక్యంలో ఆజ్ఞాత్మక లేదా ప్రబోధాత్మక భావాన్ని ‘తిరిగిరావాలని’ తెలియజేస్తుంది.
- source_word: מֵאָוֶן
  choice: దుష్టత్వం నుండి
  rationale: אָוֶן కు దుష్టత్వం, దోషం, కీడు లేదా కష్టం అనే అర్థాలు ఉండవచ్చు. తప్పు ప్రవర్తనను విడిచిపెట్టమనే ఈ నైతిక సందర్భంలో ‘దుష్టత్వం’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ఎలీహూ మాటల్లో מוּסָר స్వభావం
  choice: దిద్దుబాటును కలిగించే శిక్షణ
  alternative: కేవలం బోధన; లేదా మరింత శిక్షాత్మక భావంతో శిక్షణ
  rationale: సమీప సందర్భంలో బాధను దేవుడు మనుష్యులకు బోధించి, తప్పు నుండి వెనక్కి పిలిచే సాధనంగా వర్ణిస్తాడు. ‘శిక్షణ’ అనే పదం బాధ గురించిన నిర్దిష్ట సిద్ధాంతాన్ని చొప్పించకుండా బోధన, దిద్దుబాటు మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక గద్యం. హీబ్రూ ఏకవచన రూపకమైన ‘వారి చెవి’ని నిలిపి, అవసరమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
