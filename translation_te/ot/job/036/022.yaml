  text: Behold[a], God is exalted in his power[b]; who is a teacher like him?
translation:
  language: te
  text: ఇదిగో, దేవుడు తన శక్తిలో మహోన్నతుడు[a]; ఆయనవంటి బోధకుడు ఎవరు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన శక్తిచేత మహోన్నతుడు’ లేదా ‘తన బలం ద్వారా ఉన్నతంగా కార్యం చేస్తాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బోధకునిగా ఆయనకు సాటి ఎవరు?’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయాన్ని, కవితాత్మక గాంభీర్యాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇది దేవుణ్ణి సూచించే సాధారణ దైవబిరుదు; సందర్భానికి సహజమైన తెలుగు రూపం ‘దేవుడు’.
- source_word: יַשְׂגִּיב
  choice: ఉన్నతుడు
  rationale: హిఫిల్ రూపం ఎత్తుగా, మహోన్నతంగా లేదా అందనంత బలంగా ఉండే భావాన్ని ఇస్తుంది. ‘ఉన్నతుడు’ సందర్భంలోని దేవుని సాటిలేని గొప్పతనాన్ని తెలిపి, క్రియలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: בְּכֹחוֹ
  choice: తన శక్తిలో
  rationale: בְּ ఉపసర్గకు ఇక్కడ పరిధి/విధానం లేదా సాధనం అనే భావాలు సాధ్యమైనందున, ‘తన శక్తిలో’ మూలంలోని సంక్షిప్తతను, అనిశ్చితిని కాపాడుతుంది.
- source_word: מִי כָמֹהוּ
  choice: ఆయనవంటి ... ఎవరు?
  rationale: పోలికతో కూడిన అలంకారిక ప్రశ్నను నేరుగా, సహజంగా వ్యక్తపరుస్తూ దేవుని సాటిలేనితనాన్ని నిలుపుతుంది.
- source_word: מוֹרֶה
  choice: బోధకుడు
  rationale: బోధించే వ్యక్తిని సూచించే పదానికి ‘బోధకుడు’ సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: దేవుని ఉన్నతత్వానికి శక్తితో ఉన్న సంబంధం
  choice: దేవుడు తన శక్తిలో ఉన్నతుడని చెప్పడం
  alternative: దేవుడు తన శక్తిచేత ఉన్నతంగా కార్యం చేస్తాడు; దేవుడు తన బలంతో భద్రపరుస్తాడు
  rationale: క్రియకు ఉన్నతంగా ఉండడం లేదా బలంతో ప్రభావం చూపడం వంటి ఛాయలు ఉండవచ్చు. కవితా సందర్భంలో దేవుని మహోన్నతత్వం, సాటిలేని బోధకత్వం ప్రధానంగా కనిపిస్తాయి; అందువల్ల అంతకుమించిన సిద్ధాంత నిర్ధారణను అనువాదం చేర్చదు.
- issue: מוֹרֶהతో పోలిక నిర్మాణం
  choice: ఆయనవంటి బోధకుడు ఎవరు?
  alternative: బోధకునిగా ఆయనకు సాటి ఎవరు?
  rationale: రెండు రూపాలూ హీబ్రూ పోలికను సాధ్యంగా ప్రతిబింబిస్తాయి. ప్రధాన పాఠం నేరుగా, సహజంగా ఉండగా ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచడం నిజమైన వాక్యనిర్మాణ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ యోబు కవిత్వానికి తగిన గౌరవప్రదమైన, ఉన్నతమైన శైలిని వాడాం. ‘ఇదిగో’ శ్రద్ధాకర్షక కవితా స్వరాన్ని నిలుపుతుంది; ‘ఆయన’ గౌరవసూచకంగా ఉంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఇవ్వబడింది.
