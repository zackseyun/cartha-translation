  edition: WLC
  text: יְחַלֵּ֣ץ עָנִ֣י בְ/עָנְי֑/וֹ וְ/יִ֖גֶל בַּ/לַּ֣חַץ אָזְנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/015.yaml
  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: te
  text: ఆయన బాధితుణ్ణి అతని బాధలో విడిపిస్తాడు[a]; అణచివేతలో వారి చెవులను తెరుస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాధితుణ్ణి అతని బాధ ద్వారా విడిపిస్తాడు.” హీబ్రూ పదాలు పేదరికం, బాధ, లేదా అణచివేత అనే భావాలను సూచించగలవు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి చెవులను తెరుస్తాడు.” ఇది వినేలా చేయడం లేదా ఉపదేశాన్ని స్వీకరించేలా చేయడం అనే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: విడిపిస్తాడు
  rationale: పీయేల్ రూపంలోని క్రియ ప్రమాదం లేదా కష్టం నుంచి బయటకు తీయడం, రక్షించడం అనే క్రియాశీల భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘విడిపిస్తాడు’ సహజంగా ఉంది.
- source_word: עָנִי
  choice: బాధితుణ్ణి
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం ఆర్థిక పేదరికాన్ని కాక బాధకు లేదా అణచివేతకు గురైన వ్యక్తిని సూచిస్తుంది; సమాంతర పదాలు కూడా ఈ భావాన్నే బలపరుస్తాయి.
- source_word: בְעָנְיוֹ
  choice: అతని బాధ ద్వారానే
  rationale: בְּ ఉపసర్గను సాధనార్థకంగా తీసుకొని, బాధనే విడిపింపుకు సాధనంగా వాక్యం చూపుతున్న ఉద్రిక్త భావాన్ని నిలిపింది. ఏకవచన ప్రత్యయం కూడా అలాగే ఉంచబడింది.
- source_word: וְיִגֶל
  choice: తెరుస్తాడు
  rationale: అక్షరార్థంగా ‘బయలుపరుస్తాడు/తెర తొలగిస్తాడు’; ‘చెవి’తో కలిసి వినేలా చేయడం లేదా ఉపదేశాన్ని స్వీకరింపజేయడం అనే హీబ్రూ నుడికారాన్ని సూచిస్తుంది.
- source_word: בַּלַּחַץ
  choice: అణచివేత ద్వారా
  rationale: לַחַץ ఒత్తిడి, కష్టస్థితి, అణచివేతలను సూచించగలదు. సమాంతర నిర్మాణాన్ని బట్టి సాధనార్థక భావం నిలుపబడింది.
- source_word: אָזְנָם
  choice: వారి చెవులను
  rationale: మసొరా పాఠంలోని మూడవ పురుష బహువచన ప్రత్యయాన్ని అనుసరించి బహువచనం ఉంచబడింది; ముందున్న ఏకవచన ‘బాధితుడు’ను సమూహప్రాతినిధ్య ఏకవచనంగా అర్థం చేసుకోవచ్చు.
theological_decisions:
- issue: బాధను దేవుని విడిపింపు మరియు బోధకు సాధనంగా చూపే భావం
  choice: ‘బాధ ద్వారానే’, ‘అణచివేత ద్వారా’ అని సాధనార్థక భావాన్ని నిలిపాం.
  alternative: ‘బాధలో’, ‘అణచివేతలో’ అని కేవలం పరిస్థితిని సూచించడం.
  rationale: రెండు సమాంతర בְּ పదబంధాలు సాధనార్థక భావాన్ని సహజంగా సూచిస్తాయి. అయినా బాధ స్వతహాగా మంచిదని గానీ, ప్రతి బాధ నేరుగా శిక్షేనని గానీ అనువాదం అదనంగా చెప్పదు; ఎలీహూ మాటలోని ధార్మిక ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. మూలంలోని ఏకవచన ‘బాధితుడు/అతని’ మరియు బహువచన ‘వారి చెవులు’ మధ్య మార్పును సరిచేయకుండా నిలిపాం.
