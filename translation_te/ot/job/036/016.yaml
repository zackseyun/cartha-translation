source:
  edition: WLC
  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: te
  text: నిజానికి, ఆయన నిన్ను బాధ అనే ఇరుకు స్థలపు నోటి నుండి, కింద ఏ నిర్బంధమూ లేని విశాల స్థలానికి ఆకర్షించి తీసుకువచ్చాడు[a]; నీ బల్లపై పరచబడినది సమృద్ధితో నిండివుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాధ దవడలలోనుండి” లేదా “ఇరుకు స్థలపు నోటి నుండి.” హీబ్రూ పదం బాధను, ఇరుకుదనాన్ని రెండింటినీ సూచించవచ్చు; అది తరువాతి “విశాల స్థలం”తో వ్యత్యాసం చూపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “కొవ్వుతో నిండివుంది”; అంటే సమృద్ధితో లేదా పుష్టికరమైన ఆహారంతో నిండివుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: నిజానికి
  rationale: ఈ పదబంధంలోని అదనపు ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֲסִיתְךָ
  choice: ఆయన నిన్ను ... ఆకర్షించాడు
  rationale: సూత్/సీత్ ధాతువులోని ప్రేరేపించడం లేదా ఆకర్షించి వెలుపలికి తీసుకురావడం అనే భావాన్ని సందర్భానుకూలంగా అందిస్తుంది; కర్తను పేరుతో స్పష్టీకరించకుండా హీబ్రూలోని తృతీయ పురుష రూపాన్ని నిలుపుతుంది.
- source_word: מִפִּי צָר
  choice: ఇరుకైన బాధ నోటిలోనుండి
  rationale: צַר లోని బాధ మరియు ఇరుకు అనే రెండు భావాలనూ, פֶּה లోని ‘నోరు’ రూపకాన్నీ నిలుపుతూ తరువాతి ‘విశాల స్థలం’తో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: רַחַב
  choice: విశాల స్థలంలోకి
  rationale: బంధనం నుంచి విశాలతకు వచ్చే కవితాత్మక స్థలరూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: కింద ఏ నిర్బంధమూ లేని
  rationale: מוּצָק ఇక్కడ క్లిష్టమైన పదం; సందర్భంలో అది ఇరుకు లేదా ఆంక్షకు వ్యతిరేకమైన నిర్బంధరాహిత్యాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: నీ బల్లపై ఉంచబడినది
  rationale: అరుదైన נַחַת పదాన్ని బల్లపై పెట్టబడిన ఆహారం లేదా విందుగా అతిగా వివరణ చేయకుండా, దాని సాధ్యమైన క్రియాత్మక భావంతో అనువదిస్తుంది.
- source_word: מָלֵא דָשֶׁן
  choice: కొవ్వైన సమృద్ధితో నిండివుంది
  rationale: דָּשֶׁן యొక్క అక్షరార్థమైన ‘కొవ్వు/పుష్టి’ రూపకాన్ని, సమృద్ధి లేదా శ్రేష్ఠమైన ఆహారం అనే సందర్భార్థంతో కలిపి నిలుపుతుంది.
theological_decisions:
- issue: הֲסִיתְךָ క్రియకు సూచిత దైవిక కర్త
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అని ఉంచడం
  alternative: ‘దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: సందర్భం కర్తను దేవునిగా సూచించినా, హీబ్రూ వాక్యంలో నామవాచకంగా ‘దేవుడు’ లేదు; అందుచేత సందర్భమే గుర్తించేటట్లు సర్వనామాన్ని నిలిపాం.
- issue: బాధ నుంచి విశాలతకు సంబంధించిన రూపకాలు
  choice: ‘ఇరుకైన బాధ నోరు,’ ‘విశాల స్థలం’ అనే స్థలరూపకాలను నిలుపడం
  alternative: ‘బాధ నుంచి స్వేచ్ఛలోకి తీసుకువచ్చాడు’ అని భావానువాదం చేయడం
  rationale: వాక్యపు కవితాత్మక ఉద్వేగం ఇరుకు మరియు విశాలత మధ్య వ్యత్యాసంపై ఆధారపడింది; దాన్ని సిద్ధాంతాత్మకంగా సరళీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక రూపకాలను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే గంభీరమైన శైలి. క్లిష్టమైన హీబ్రూ పదబంధాల అనిశ్చితిని పాదటిప్పణుల్లో సూచించాం.
