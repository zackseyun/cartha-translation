revisions:
- from: నిజానికి, ఆయన నిన్ను ఇరుకైన బాధ నోటిలోనుండి, కింద ఏ నిర్బంధమూ లేని విశాల స్థలంలోకి ఆకర్షించాడు[a]; నీ బల్లపై ఉంచబడినది కొవ్వైన సమృద్ధితో నిండివుంది[b].
  to: నిజానికి, ఆయన నిన్ను బాధ అనే ఇరుకు స్థలపు నోటి నుండి, కింద ఏ నిర్బంధమూ లేని విశాల స్థలానికి ఆకర్షించి తీసుకువచ్చాడు[a]; నీ బల్లపై పరచబడినది సమృద్ధితో నిండివుంది[b].
  rationale: The revision improves modern Telugu idiom while preserving the Hebrew poetic contrast of distressing constriction and unconstrained breadth. It also makes the final abundance image natural without suppressing the literal ‘fatness’ in the footnote. No doctrinal specification has been added.
