  text: Bear with me a little, and I will show you, for there are still words for God.
translation:
  language: te
  text: ఇంకొంచెం నాతో ఓపిక పట్టు; నేను నీకు చూపిస్తాను. ఎందుకంటే దేవుని కోసం ఇంకా మాటలు ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: ఇంకొంచెం నాతో ఓపిక పట్టు
  rationale: ‘కొద్దిసేపు నాకోసం వేచి ఉండు/నన్ను సహించు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַאֲחַוֶּךָּ
  choice: నేను నీకు తెలియజేస్తాను
  rationale: హిఫీల్ రూపంలోని ‘చూపిస్తాను, వివరిస్తాను, తెలియజేస్తాను’ అనే భావపరిధిని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: לֶאֱלוֹהַּ מִלִּים
  choice: దేవుని కోసం ... మాటలు
  rationale: లְ సంబంధాన్ని ‘దేవుని పక్షంగా’ అని మరీ స్పష్టీకరించకుండా, మూలంలోని సంక్షిప్తతను మరియు ‘for God’ అనే సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఎలీహూ చెప్పబోయే మాటలకు దేవునితో ఉన్న సంబంధం
  choice: దేవుని కోసం ఇంకా మాటలు ఉన్నాయి
  alternative: దేవుని పక్షంగా నేను చెప్పవలసిన మాటలు ఇంకా ఉన్నాయి
  rationale: ప్రత్యామ్నాయం ఎలీహూ దేవుని తరఫున వాదిస్తున్నాడనే భావాన్ని స్పష్టంగా చేర్చుతుంది; మూలంలోని לֶאֱלוֹהַּ మాత్రం అంత నిర్దిష్టంగా లేదు. అందువల్ల సంబంధంలోని అస్పష్టతను సాధ్యమైనంతవరకు నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఎలీహూ యోబుతో ఏకవచనంలో నేరుగా మాట్లాడుతున్న స్వరాన్ని నిలిపి, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే భాషను వాడాం.
