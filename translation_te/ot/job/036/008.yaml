source:
  edition: WLC
  text: וְ/אִם אֲסוּרִ֥ים בַּ/זִּקִּ֑ים יִ֝לָּכְד֗וּ/ן בְּ/חַבְלֵי עֹֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/008.yaml
  text: And if they are bound in chains[a], caught in cords of affliction[b],
translation:
  language: te
  text: వారు సంకెళ్లతో బంధించబడి, బాధ తాళ్లలో చిక్కుకొని ఉంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: వారు … చిక్కుకుంటే
  rationale: వావ్ సంధాన భావాన్ని సందర్భ ప్రవాహంలో సహజంగా ఉంచుతూ, אִם యొక్క షరతు భావాన్ని తెలుగులో వాక్యాంత ‘-తే’ రూపంతో వ్యక్తం చేసింది.
- source_word: אֲסוּרִים
  choice: బంధించబడి
  rationale: אסר ధాతువు యొక్క కర్మణి భావాన్ని కాపాడుతుంది; ‘ఖైదీలు’ అని నామవాచకంగా మార్చదు.
- source_word: בַּזִּקִּים
  choice: సంకెళ్లలో
  rationale: శారీరక నిర్బంధ సాధనాల స్పష్టమైన చిత్రాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִלָּכְדוּן
  choice: చిక్కుకుంటే
  rationale: לכד నిఫాల్ రూపంలోని పట్టుబడటం/చిక్కుకోవడం అనే భావాన్ని, షరతు వాక్య నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: בְּחַבְלֵי
  choice: తాళ్లలో
  rationale: חבל లోని తాడు/బంధం అనే మూర్తమైన రూపకాన్ని నిలుపుతూ, సంకెళ్ల చిత్రంతో సమాంతరతను కాపాడుతుంది.
- source_word: עֹנִי
  choice: శ్రమ
  rationale: ఇక్కడ ఆర్థిక పేదరికానికి మాత్రమే పరిమితం చేయకుండా బాధ, కష్టం, దుఃఖం అనే విస్తృత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: నిర్బంధ చిత్రణ స్వభావం
  choice: సంకెళ్లు, తాళ్లు అనే మూర్తమైన చిత్రణను నిలిపి, అది బాధకు లేదా దేవుని శిక్షణకు రూపకంగా కూడా పనిచేయగల అవకాశాన్ని తెరిచి ఉంచడం.
  alternative: దీనిని పూర్తిగా అక్షరార్థ ఖైదుగా లేదా పూర్తిగా రూపకాలంకార కష్టంగా మాత్రమే అనువదించడం.
  rationale: హీబ్రూ పదాలు మూర్తమైన నిర్బంధాన్ని చిత్రిస్తాయి; అయితే సందర్భం బాధపడేవారితో దేవుని వ్యవహారాన్ని సూచిస్తుంది. అనువాదం ఏ ఒక్క అర్థాన్నీ బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. హీబ్రూ షరతు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున తెలుగులో ‘-తే’తో ముగించి కామాను ఉంచాం. ‘శ్రమ అనే తాళ్లు’ అనే నిర్మాణం బాధను తాళ్లుగా చిత్రించే మూల రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
