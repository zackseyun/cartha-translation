  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: te
  text: ఎందుకంటే వాటి ద్వారా ఆయన ప్రజలకు తీర్పు తీరుస్తాడు; సమృద్ధిగా ఆహారం ఇస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: వాటి ద్వారా
  rationale: ఈ బహువచన సర్వనామం ముందటి సందర్భంలో చెప్పిన ప్రకృతి సాధనాలను సూచిస్తుంది; అసలు వచనంలోని సూచనాత్మక అస్పష్టతను అలాగే ఉంచుతుంది.
- source_word: יָדִין עַמִּים
  choice: ప్రజలకు తీర్పుతీరుస్తాడు
  rationale: דין న్యాయనిర్ణయం లేదా తీర్పు చేయడాన్ని సూచిస్తుంది; עמים బహువచనాన్ని ‘ప్రజలు’గా సహజంగా వ్యక్తం చేశాం.
- source_word: יִתֶּן אֹכֶל לְמַכְבִּיר
  choice: సమృద్ధిగా ఆహారం ఇస్తాడు
  rationale: למכביר పరిమాణ సమృద్ధిని తెలియజేస్తుంది; తెలుగు వాక్యప్రయోగంలో సహజమైన ‘సమృద్ధిగా’ దీనిని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ఒకే సాధనాల ద్వారా తీర్పు మరియు పోషణ
  choice: రెండు క్రియలనూ సమాంతరంగా ఉంచడం
  alternative: ప్రకృతి సాధనాలను వర్షంగా స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం ‘వాటి ద్వారా’ అని మాత్రమే చెబుతూ, దేవుని తీర్పు మరియు ఆహారదానాన్ని ఒకే సందర్భంలో ఉంచుతుంది; దానిని వ్యాఖ్యానాత్మకంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన కవితా వాక్యనిర్మాణం. మూలంలోని బహువచన సూచనను వివరించకుండా నిలిపి ఉంచాం.
