source:
  edition: WLC
  text: וְ/דִין רָשָׁ֥ע מָלֵ֑אתָ דִּ֖ין וּ/מִשְׁפָּ֣ט יִתְמֹֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/017.yaml
  text: But you are full of the judgment of the wicked[b][a]; judgment and justice seize you.
translation:
  language: te
  text: అయితే నీవు దుష్టుని తీర్పుతో నిండిపోయావు[a]; తీర్పు, న్యాయం నిన్ను పట్టుకుంటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది. ఇది దుష్టునికి విధించబడే తీర్పును, దుష్టునితో ముడిపడిన తీర్పును, లేదా దుష్టుని తీర్పులో పాలుపంచుకోవడాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘తీర్పు, న్యాయం నిన్ను ఆధరిస్తాయి’ లేదా ‘నిలబెడతాయి.’ హీబ్రూ క్రియకు ఆధరించు, నిలబెట్టు, లేదా పట్టుకో అనే భావాలు రావచ్చు; మూలంలో ‘నిన్ను’ అనే కర్మ స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין
  choice: అయితే … తీర్పుతో
  rationale: וְ అనే సంధిని సందర్భానుసారంగా వ్యతిరేక భావంలో ‘అయితే’ అని అనువదించాం. దాని వెంటనున్న דִין‌ను మొదటి వాక్యభాగంలోని నామవాచకంగా ఉంచి, తెలుగులో సహజంగా ‘తీర్పుతో’ అని ఇచ్చాం.
- source_word: רָשָׁע
  choice: దుష్టుని
  rationale: ఏకవచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. ‘దుష్టుని’ అనేది దాని ఏకవచన రూపాన్నీ సాధారణ లక్షణాన్నీ నిలుపుతుంది.
- source_word: מָלֵאתָ
  choice: నిండిపోయావు
  rationale: రెండవ పురుష ఏకవచన సంపూర్ణ క్రియను యోబును నేరుగా ఉద్దేశించే రూపంలో ఇచ్చాం; ఫలితంగా ఏర్పడిన ప్రస్తుత స్థితినీ ఇది సహజంగా తెలియజేస్తుంది.
- source_word: דִּין וּמִשְׁפָּט
  choice: తీర్పు, న్యాయం
  rationale: సంబంధితమైనా వేర్వేరు న్యాయపర పదాలైన דִּין, מִשְׁפָּט మధ్య భేదాన్ని ‘తీర్పు, న్యాయం’గా నిలిపాం.
- source_word: יִתְמֹכוּ
  choice: పట్టుకున్నాయి
  rationale: תמך అనే క్రియకు ఆదరించడం, నిలబెట్టడం, పట్టుకోవడం అనే భావాలు ఉన్నాయి. ప్రతికూల సందర్భంలో ‘పట్టుకున్నాయి’ సహజంగా ఉండి, తీర్పు మరియు న్యాయం కర్తలుగా ఉన్న బహువచన రూపాన్ని ప్రతిబింబిస్తుంది; అయితే హీబ్రూలో లేని కర్మను తెలుగులో భావస్పష్టత కోసం ‘నిన్ను’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘దుష్టుని తీర్పు’ అనే పదబంధపు సంబంధం
  choice: ‘దుష్టుని తీర్పుతో’ అనే సంక్షిప్త సంబంధవాచక నిర్మాణాన్ని నిలిపాం.
  alternative: ‘దుష్టునికి విధించబడే తీర్పుతో’ లేదా ‘దుష్టుడు చేసే తీర్పుతో’.
  rationale: హీబ్రూ పదబంధం దుష్టునికి కలిగే తీర్పునా, దుష్టునితో ముడిపడిన తీర్పునా అనే విషయాన్ని పూర్తిగా నిర్ధారించదు. ప్రధాన పాఠంలో ఆ సందిగ్ధతను నిలిపి, పాదసూచికలో వివరించాం.
- issue: יִתְמֹכוּ యొక్క సహాయక లేదా శిక్షాత్మక భావం
  choice: ‘నిన్ను పట్టుకున్నాయి’.
  alternative: ‘నిన్ను నిలబెడతాయి/ఆదరిస్తాయి’ లేదా కర్మను చెప్పకుండా ‘గట్టిగా నిలిచాయి’.
  rationale: సందర్భం ప్రతికూల భావాన్ని సూచించినందున ‘పట్టుకున్నాయి’ను ఎంచుకున్నాం. అయినా మూలక్రియలోని సహాయక భావసాధ్యతను పాదసూచికలో నిలిపాం; హీబ్రూ వాక్యంలో ప్రత్యక్ష కర్మ లేదన్న విషయాన్నీ తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే న్యాయపర పదజాలాన్ని వాడాం. హీబ్రూ కవిత్వంలోని సంక్షిప్తతను అర్ధవిరామంతో నిలిపి, అసలులోని రెండు ప్రధాన సందిగ్ధతలను పాదసూచికల్లో సంరక్షించాం.
