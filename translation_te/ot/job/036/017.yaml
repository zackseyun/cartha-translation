- from: అయితే నీవు దుష్టుని తీర్పుతో నిండిపోయావు[a]; తీర్పు, న్యాయం నిన్ను పట్టుకున్నాయి[b].
  to: అయితే నీవు దుష్టుని తీర్పుతో నిండిపోయావు[a]; తీర్పు, న్యాయం నిన్ను పట్టుకుంటాయి[b].
  rationale: The revision changes only the aspect of the final verb from completed ‘పట్టుకున్నాయి’ to nonperfective ‘పట్టుకుంటాయి,’ which more closely reflects the Hebrew imperfect. It also corrects the supportive-sense term in footnote b and makes footnote a genuinely explain the preserved ambiguity of the Hebrew construct relationship.
