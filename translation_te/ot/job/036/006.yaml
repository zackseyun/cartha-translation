  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: te
  text: దుష్టుణ్ణి ఆయన సజీవంగా ఉంచడు[a]; బాధితులకు[b] న్యాయం ప్రసాదిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుష్టుణ్ణి బతకనివ్వడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పేదలకు’; హీబ్రూ పదం దీనులు, అణచివేయబడినవారు లేదా ఆర్థికంగా పేదవారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: సజీవంగా ఉంచడు
  rationale: חיה యొక్క పీయేల్ రూపం ఇక్కడ పునరుత్థానం కలిగించడం అనే భావాన్ని కాకుండా, ప్రాణంతో కాపాడటం లేదా జీవించేటట్లు ఉంచటం అనే కొనసాగుతున్న సంరక్షణ భావాన్ని సూచిస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుణ్ణి
  rationale: హీబ్రూలో ఏకవచనంగా ఉన్నా ఇది ఒక వర్గాన్ని సూచించే సాధారణ ఏకవచనం; తెలుగు ఏకవచన రూపం ఆ ప్రతినిధి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: מִשְׁפַּט
  choice: న్యాయం
  rationale: ఇక్కడ ఇది కేవలం తీర్పు చెప్పే చర్యను కాకుండా, బాధితులకు దక్కవలసిన న్యాయమైన ఫలితాన్ని లేదా హక్కును సూచిస్తుంది.
- source_word: עֲנִיִּים
  choice: బాధితులకు
  rationale: ఈ పదం పేదరికంతో పాటు అణచివేత, శ్రమ, దీనస్థితి వంటి విస్తృత భావాలను కలిగి ఉండగలదు; ‘బాధితులు’ ఆ విస్తృతిని అధికంగా కుదించకుండా తెలుపుతుంది.
- source_word: יִתֵּן
  choice: ప్రసాదిస్తాడు
  rationale: נתן యొక్క ప్రాథమిక భావం ‘ఇవ్వడం’; ‘న్యాయం ప్రసాదిస్తాడు’ అనేది తెలుగు కవితాత్మక సందర్భంలో సహజమైన, గౌరవప్రదమైన ప్రయోగం.
- source_word: וּ
  choice: ;
  rationale: హీబ్రూ సంధి సాధారణంగా ‘మరియు’ అయినా ఇక్కడ రెండు చర్యల మధ్య వ్యత్యాసం ఉంది. తెలుగులో అర్ధవిరామం ఆ వ్యత్యాసాన్ని సహజంగా వ్యక్తపరుస్తుంది; అవసరంలేని స్పష్టీకరణను జోడించదు.
theological_decisions:
- issue: יְחַיֶּה అనే పదం పునరుత్థానం లేదా ప్రత్యేకమైన దైవిక జీవప్రదానం అనే భావాన్ని సూచిస్తుందా?
  choice: కాలికంగా ప్రాణంతో కాపాడటం అనే భావంలో ‘సజీవంగా ఉంచడు’ అని అనువదించబడింది.
  alternative: ‘జీవం ఇవ్వడు’ లేదా ‘బతికించడు’
  rationale: 'తక్షణ కవితా సమాంతరత దేవుని న్యాయపాలనను వివరిస్తుంది: ఆయన దుష్టుణ్ణి నిలబెట్టడు, బాధితులకు న్యాయం ఇస్తాడు. పునరుత్థాన భావాన్ని చేర్చడానికి ఈ వాక్యంలో ఆధారం లేదు.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి ఉపయోగించబడింది. ‘ఆయన’ సందర్భంలోని దేవుణ్ణి సూచిస్తుంది. హీబ్రూ వాక్యంలోని వ్యత్యాసాన్ని తెలుగులో అర్ధవిరామంతో సున్నితంగా నిలిపి, భావాన్ని అతిగా వ్యాఖ్యానించలేదు.
