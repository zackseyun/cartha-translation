  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: te
  text: 'మనుషులందరూ[b] దానిని[a] చూశారు;

    మానవుడు దూరం నుండి చూస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను.’ హీబ్రూ సర్వనామం పుంలింగ ఏకవచనంలో ఉంది; అది వ్యక్తిగతంగా దేవుణ్ణి సూచించవచ్చు. అయితే సందర్భం దేవుని కార్యాన్ని సూచించడానికే ఎక్కువ అనుకూలంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘మనుషులందరూ,’ ‘మానవుడు’ అనే పదాలు పురుషులకు మాత్రమే కాక సాధారణంగా మానవులందరికీ వర్తిస్తాయి; అవి వరుసగా హీబ్రూ אָדָם, אֱנוֹשׁ పదాలను ప్రతిబింబిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: మనుషులందరూ
  rationale: כָּל‌తో కూడిన אָדָם ఇక్కడ ఏ ఒక్క పురుషుణ్ణో కాక సమస్త మానవాళిని సమూహార్థంలో సూచిస్తుంది. ‘మనుషులందరూ’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంది.
- source_word: חָזוּ
  choice: చూశారు
  rationale: חזה చూడడం లేదా దర్శించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో అవసరం లేని అదనపు వ్యాఖ్యాన ఛాయను చేర్చకుండా ‘చూశారు’ మూలంలోని పూర్తయిన క్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בּוֹ
  choice: దానిని
  rationale: పుంలింగ ఏకవచన ప్రత్యయం వ్యాకరణపరంగా ‘ఆయనను’ అని కూడా అర్థం కావచ్చు. అయితే ముందున్న సందర్భంలోని దేవుని కార్యాన్ని సూచించడం ఎక్కువ సంభావ్యమైనందున ప్రధాన పాఠంలో ‘దానిని’ ఎంచుకున్నాం; వ్యక్తిగత సూచనను పాదటిప్పణిలో నిలిపాం.
- source_word: אֱנוֹשׁ
  choice: మానవుడు
  rationale: אֱנוֹשׁ సాధారణంగా నశ్వర మానవుణ్ణి సూచించగలదు. ఇక్కడ కవితా సమాంతర నిర్మాణంలో మానవజాతికి ప్రతినిధిగా ఏకవచన ‘మానవుడు’ సరిపోతుంది.
- source_word: יַבִּיט
  choice: చూస్తాడు
  rationale: נבט హిఫీల్ రూపం దృష్టి పెట్టి చూడడాన్ని సూచిస్తుంది. సరళమైన ‘చూస్తాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలపాఠం స్పష్టంగా చెప్పని కర్మను చేర్చదు.
- source_word: מֵרָחוֹק
  choice: దూరం నుండి
  rationale: מִן + רָחוֹק దూరస్థానంనుండి చూడడాన్ని సూచిస్తుంది. ‘దూరం నుండి’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: בּוֹ అనే పుంలింగ ఏకవచన సర్వనామం దేవుణ్ణి సూచిస్తుందా, ఆయన కార్యాన్ని సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘దానిని’, అంటే సందర్భంలోని దేవుని కార్యాన్ని సూచించేదిగా అనువదించడం
  alternative: ‘ఆయనను’ అని అనువదించి దేవుణ్ణి వ్యక్తిగతంగా సూచించేదిగా గ్రహించడం
  rationale: మునుపటి వచనంలోని ‘ఆయన కార్యం’ సమీప సందర్భంలో సహజమైన పూర్వపదం. అయినా హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనంలో ఉన్నందున వ్యక్తిగత సూచన వ్యాకరణపరంగా సాధ్యమే; అందుకే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కవితా శైలిని పాటించాం. రెండవ పాదంలో హీబ్రూ స్పష్టంగా చెప్పని కర్మను పునరుక్తి చేయకుండా, ‘దూరం నుండి చూస్తాడు’ అని ఉంచి మూలంలోని సంక్షిప్తతను కాపాడాం.
