  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: te
  text: నా జ్ఞానాన్ని దూరం నుండి తీసుకువస్తాను;[a] నా సృష్టికర్తకు నీతిని ఆపాదిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా జ్ఞానాన్ని సుదూరం నుండి తీసుకువస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా సృష్టికర్తకు న్యాయాన్ని ఆపాదిస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: తీసుకొచ్చి
  rationale: נשׂא అనే క్రియకు ప్రాథమికంగా ‘ఎత్తు, మోయు’ అనే అర్థాలున్నాయి. ‘నా జ్ఞానం’ మరియు ‘దూరం నుండి’ అనే పదబంధంతో కలిసినప్పుడు, దూరమైన మూలం నుండి జ్ఞానాన్ని తీసుకురావడం అనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: דֵעִי
  choice: నా జ్ఞానాన్ని
  rationale: דעת నుండి వచ్చిన ఈ రూపం ‘జ్ఞానం’ లేదా ‘అవగాహన’ను సూచిస్తుంది. ‘నా జ్ఞానం’ మూలపాఠానికి నేరుగా సరిపోతూ ఎలీహూ చెప్పే భావాన్ని నిలుపుతుంది.
- source_word: לְמֵרָחוֹק
  choice: దూరం నుండి
  rationale: ఈ పదబంధం సందర్భంలో జ్ఞానం తీసుకురాబడే దూరమైన మూలాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘దూరం నుండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וּלְפֹעֲלִי
  choice: నన్ను సృష్టించినవాడు
  rationale: פֹעֵל అంటే ‘చేసేవాడు/రూపొందించేవాడు’; ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ‘నన్ను చేసినవాడు’ అని అర్థం. దేవుణ్ణి సూచించే సందర్భంలో ‘నన్ను సృష్టించినవాడు’ సాధారణ ఆధునిక తెలుగులో సహజం.
- source_word: אֶתֵּן
  choice: ప్రకటిస్తాను
  rationale: נתן అక్షరార్థంగా ‘ఇస్తాను’. ఇక్కడ צדקను సృష్టికర్తకు ఇవ్వడం అంటే ఆయనకు నీతిని ఆపాదించడం లేదా ఆయన నీతిమంతుడని ప్రకటించడం. తెలుగులో ‘నీతిమంతుడని ప్రకటిస్తాను’ ఈ సంబంధార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צֶדֶק
  choice: నీతిమంతుడని
  rationale: צדק ‘నీతి, న్యాయం, సరిగ్గా ఉండడం’ అనే భావాలను కలిగి ఉంది. ఇక్కడ దేవుని స్వభావం, కార్యాల సరైనతను ఆయనకు ఆపాదిస్తున్నందున ‘నీతిమంతుడని’ సహజమైన ప్రధాన పఠనం; ‘న్యాయవంతుడని’ కూడా సాధ్యమే.
theological_decisions:
- issue: దేవునికి సంబంధించి צֶדֶק పదం యొక్క అనువాదం
  choice: నీతిమంతుడని
  alternative: న్యాయవంతుడని
  rationale: హీబ్రూ పదం నైతిక నీతినీ న్యాయాన్నీ సూచించగలదు. సందర్భంలో ఎలీహూ తన సృష్టికర్త యొక్క సర్వాంగ సరైనతను ప్రకటిస్తున్నాడు. అందువల్ల విస్తృత భావమున్న ‘నీతిమంతుడని’ ప్రధాన పాఠంలో ఉంచి, న్యాయపరమైన సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని కవితాత్మక ‘దూరం నుండి జ్ఞానాన్ని తీసుకురావడం’ అనే రూపకాన్ని నిలిపి, צדקలోని నీతి/న్యాయం అర్థవిస్తృతిని పాదసూచిక ద్వారా సంరక్షించాం.
