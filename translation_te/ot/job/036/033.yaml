  yaml_path: translation/ot/job/036/033.yaml
  text: Its thunder declares concerning him[a]; the cattle also[b], concerning what is rising.
translation:
  language: te
  text: అతని గురించి దాని ఉరుము తెలియజేస్తుంది[a]; పైకి లేస్తున్నదాని గురించి పశువులు కూడా తెలియజేస్తాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం క్లిష్టంగా ఉంది. ‘దాని ఉరుము’ స్థానంలో అక్షరార్థంగా ‘అతని స్నేహితుడు’ అని కూడా చదవవచ్చు; అయితే ఈ పాదం తుఫాను శబ్దాన్ని సూచిస్తుందని చాలామంది భావిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పైకి లేస్తున్న తుఫాను గురించి పశువులు కూడా [తెలియజేస్తాయి].’ చివరి మాట సమీపిస్తున్న తుఫానును సూచించే అవకాశం ఉంది; అయితే హీబ్రూలో ఉన్నది కేవలం ‘పైకి లేస్తున్నది’ అనే మాటే.
    reason: alternative_reading
lexical_decisions:
- source_word: יַגִּיד
  choice: ప్రకటిస్తుంది
  rationale: נגד ధాతువు హిఫీల్ రూపంలో ‘తెలియజేయడం, ప్రకటించడం’ అనే భావం ఇస్తుంది. కావ్యోచిత గంభీరతను నిలుపుతూ, ఉరుము సంకేతమిచ్చే భావానికి ‘ప్రకటిస్తుంది’ సరిపోతుంది.
- source_word: עָלָיו
  choice: ఆయన గురించి
  rationale: עַל అనే విభక్త్యర్థకం ఇక్కడ ‘గురించి’ లేదా ‘వ్యతిరేకంగా’ అని అర్థమివ్వగలదు. సూచించబడిన వ్యక్తి ఎవరో నిర్ణయించకుండా తటస్థమైన ‘ఆయన గురించి’ వాడబడింది.
- source_word: רֵעוֹ
  choice: ఆయన ఉరుము
  rationale: ఈ రూపం క్లిష్టమైనది. అక్షరార్థంగా ‘ఆయన స్నేహితుడు’ అని చదవవచ్చు; అయితే తుఫాను సందర్భంలో శబ్దం లేదా ఉరుమును సూచిస్తుందని చాలామంది గ్రహిస్తారు. ప్రధాన పాఠ్యంలో సందర్భానికి సహజమైన ‘ఉరుము’ ఉంచి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִקְנֶה
  choice: పశువులు
  rationale: ఈ నామవాచకం సాధారణంగా పశువులు లేదా పశుసంపదను సూచిస్తుంది. సమీపిస్తున్న వాతావరణ మార్పును జంతువులు గ్రహించే సందర్భానికి ‘పశువులు’ సహజంగా సరిపోతుంది.
- source_word: אַף
  choice: కూడా
  rationale: ముందటి ప్రకటనకు మరొక సాక్ష్యాన్ని జోడించే విస్తరణార్థాన్ని ‘కూడా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל
  choice: గురించి
  rationale: మూలంలోని సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా తటస్థమైన ‘గురించి’ వాడబడింది.
- source_word: עוֹלֶה
  choice: పైకి లేస్తున్న దాని
  rationale: עלה ధాతువు వర్తమాన కృదంతం ‘పైకి వెళ్తున్నది, లేస్తున్నది’ అని అర్థం. దాని కర్త లేదా వస్తువు స్పష్టంగా చెప్పబడలేదు కాబట్టి ‘తుఫాను’ అని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని అనిర్దిష్టతను నిలిపాం.
