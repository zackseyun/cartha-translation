translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్యశైలిని పాటించాం. మొదటి పాదంలోని పునరుక్తి మూలంలోని రెండు పురుష ఏకవచన ప్రత్యయాలను కాపాడుతుంది. రెండో పాదంలో మూలంలో లేని క్రియను తెలుగు వాక్యసంపూర్ణత కోసం ముందటి పాదం నుంచి అధ్యాహారంగా పునరుక్తం చేశాం; దీనిని పాదసూచికలో సూచించాం.
