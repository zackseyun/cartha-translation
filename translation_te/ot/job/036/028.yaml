  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: te
  text: వాటిని మేఘాలు జాలువార్చుతాయి; అవి మనుషుల మీద సమృద్ధిగా చినుకులుగా కురుస్తాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వాటిని
  rationale: మునుపటి వాక్యంలోని నీటి బిందువులను సూచించే సంబంధార్థాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: יִזְּלוּ
  choice: కురిపిస్తాయి
  rationale: נזל అనే క్రియలోని కిందికి ప్రవహించే భావాన్ని వర్ష సందర్భంలో సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: שְׁחָקִים
  choice: మేఘాలు
  rationale: ఈ వాతావరణ కవితా సందర్భంలో ఆకాశంలోని వర్షమేఘాలను సూచిస్తుంది.
- source_word: יִרְעֲפוּ
  choice: వర్షిస్తాయి
  rationale: చినుకులుగా లేదా జల్లుగా కిందికి పడే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; మొదటి క్రియతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: עֲלֵי
  choice: మీద
  rationale: పై నుంచి కిందనున్నవారిపై పడే దిశను సహజంగా తెలుపుతుంది.
- source_word: אָדָם
  choice: మనుషుల
  rationale: ఇక్కడ ఏకవచన రూపం మానవాళిని సమష్టిగా సూచిస్తుంది; తెలుగులో ‘మనుషుల’ అనేది ఆ సాధారణ, సమష్టి భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: רָב
  choice: సమృద్ధిగా
  rationale: వర్షం విస్తారంగా కురిసే పరిమాణాన్ని క్రియావిశేషణంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָדָם అనే సాధారణ ఏకవచన పదం అనువాదం
  choice: మనుషుల
  alternative: మానవాళి మీద / మనిషి మీద
  rationale: హీబ్రూ పదం ఇక్కడ ఒక పురుష వ్యక్తిని కాక, మానవజాతిని సమష్టిగా సూచిస్తుంది. ‘మనుషుల మీద’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమగ్ర భావాన్ని కాపాడుతుంది; ‘మనిషి మీద’ మూలంలోని ఏకవచన రూపానికి దగ్గరైనా తెలుగులో ఒక వ్యక్తినే సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యోబు గ్రంథంలోని వాతావరణ కవిత్వానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర క్రియలను ‘కురిపిస్తాయి / వర్షిస్తాయి’గా నిలిపాం.
