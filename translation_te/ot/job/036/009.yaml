translation:
  language: te
  text: అప్పుడు ఆయన వారి క్రియల్నీ అతిక్రమాల్నీ వారికి తెలియజేస్తాడు—వారు అహంకారంగా ప్రవర్తిస్తున్నారని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు తమను తాము బలవంతులుగా చూపించుకుంటున్నారని.” సందర్భంలో ఇది తమను తాము హెచ్చించుకోవడం లేదా అహంకరించడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: అప్పుడు ఆయన ... తెలియజేస్తాడు
  rationale: נגד హిఫీల్ రూపం ‘తెలియజేయడం, ప్రకటించడం’ అనే అర్థాన్నిస్తుంది. చుట్టుపక్కల వాక్యాల క్రమంలో వావ్‌ను సహజంగా ‘అప్పుడు’ అని అనువదించాం.
- source_word: לָהֶם
  choice: వారికి
  rationale: ప్రకటనను అందుకునే పరోక్ష కర్మను సూటిగా సూచిస్తుంది.
- source_word: פָּעֳלָם
  choice: వారి క్రియలను
  rationale: ఇక్కడ పదం నైతికంగా పరిశీలించబడే వారి పనులు లేదా చర్యలను సూచిస్తుంది. ‘క్రియలు’ సంక్షిప్తంగా, గంభీరంగా ఉంటుంది.
- source_word: וּפִשְׁעֵיהֶם
  choice: వారి అతిక్రమాలను
  rationale: פשע అధికారానికి వ్యతిరేకమైన తిరుగుబాటు లేదా హద్దుమీరిన అపరాధం అనే గంభీర భావాన్ని కలిగి ఉంది. ‘అతిక్రమాలు’ ఆ నైతిక తీవ్రతను నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: తెలియజేయబడుతున్న విషయాన్ని పరిచయం చేసే content marker‌గా తీసుకున్నాం; కారణార్థకమైన ‘ఎందుకంటే’ కూడా వ్యాకరణపరంగా సాధ్యమే కానీ ఈ నిర్మాణంలో తక్కువ సంభావ్యం.
- source_word: יִתְגַּבָּרוּ
  choice: వారు అహంకారంతో ప్రవర్తించారు
  rationale: גבר హిత్పయేల్ రూపానికి అక్షరార్థంగా ‘తమను తాము బలపరచుకున్నారు’ అనే భావం ఉన్నా, అతిక్రమాల సందర్భంలో అది స్వీయోన్నతి లేదా అహంకారపూరిత ప్రవర్తనను సూచిస్తుంది.
theological_decisions:
- issue: יִתְגַּבָּרוּ పదంలోని నైతిక భావం
  choice: అహంకారంతో ప్రవర్తించారు
  alternative: బలవంతులయ్యారు; తమను తాము హెచ్చించుకున్నారు
  rationale: ‘అతిక్రమాలు’ అనే సమాంతర పదంతో కలిపి చూస్తే, ఇక్కడ బలం స్వతహాగా తప్పని చెప్పడం కాదు; అహంకారపూరిత స్వీయోన్నతిని గద్దించడం ప్రధాన భావం. అయినా మూలంలోని ‘బలపడటం’ అనే రూపకాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘క్రియలు,’ ‘అతిక్రమాలు’ అనే పదాలు నైతిక గంభీరతను నిలుపుతాయి; అస్పష్టమైన హీబ్రూ రూపానికి ప్రధాన పాఠ్యంలో సందర్భోచిత భావానువాదం ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
