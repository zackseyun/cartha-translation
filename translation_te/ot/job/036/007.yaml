  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: te
  text: ఆయన నీతిమంతుని మీదనుండి తన కళ్లను తొలగించడు; రాజులతోపాటు వారిని సింహాసనంపై శాశ్వతంగా కూర్చోబెడతాడు[a], వారు ఉన్నతులవుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “రాజులను సింహాసనంపై ఆయన శాశ్వతంగా కూర్చోబెడతాడు.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; కొందరు ఈ భాగాన్ని నీతిమంతులు రాజులతో కూర్చోవడం గురించి కాకుండా నేరుగా రాజుల గురించే చెబుతున్నదిగా గ్రహిస్తారు.'
    reason: alternative_reading
  - marker: b
    text: 'లేదా: “ఆయన వారిని ఉన్నతపరుస్తాడు.” చివరి క్రియలో దేవుడే సూచిత కర్తగా ఉన్నాడని కూడా గ్రహించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: తొలగించడు
  rationale: גרע అంటే తగ్గించడం, తీసివేయడం లేదా తొలగించడం. ‘తన కన్నులను’ అనే కర్మతో కలిసి, దేవుడు నీతిమంతునిపై దృష్టి నిలిపివేయడు అనే భావాన్ని ‘తొలగించడు’ సహజంగా, మూలంలోని రూపకాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: מִצַּדִּיק
  choice: నీతిమంతుని మీద నుంచి
  rationale: ఏకవచన విశేషణం ఇక్కడ సాధారణంగా లేదా సమూహార్థంలో వాడబడింది. తెలుగు వాక్యంలో ఏకవచన రూపాన్ని ఉంచి, తరువాతి బహువచన సర్వనామం దాని సమూహార్థాన్ని తెలియజేస్తుంది.
- source_word: עֵינָיו
  choice: తన కన్నులను
  rationale: మూలంలోని మానవరూప వర్ణనను నేరుగా నిలుపుతుంది; ‘శ్రద్ధ’ లేదా ‘సంరక్షణ’ అని భావానువాదం చేసి రూపకాన్ని తొలగించలేదు.
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: రాజులతోపాటు సింహాసనంపై
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉంది. ప్రధాన పఠనంలో నీతిమంతులు రాజులతోపాటు రాజమర్యాద పొందుతున్నారని భావించబడింది; అదనపు క్రియను మూలంలోకి చేర్చలేదు.
- source_word: וַיֹּשִׁיבֵם
  choice: వారిని కూర్చోబెడతాడు
  rationale: ישׁב యొక్క హిఫీల్ రూపం ‘కూర్చోబెట్టు’ అనే కారణార్థాన్ని ఇస్తుంది. ‘సింహాసనం ఎక్కిస్తాడు’ అనేది సందర్భానికి సరిపోయినా, మూలం కంటే ఎక్కువ నిర్దిష్టంగా ఉంటుంది.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలికమైన, అంతంలేని వ్యవధిని తెలిపే נצח భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּגְבָּהוּ
  choice: వారు ఉన్నతులవుతారు
  rationale: చివరి సంక్షిప్త క్రియ నీతిమంతులు ఉన్నత స్థితికి చేరడాన్ని తెలియజేస్తుంది. ఈ రూపం ఫలితార్థాన్ని సహజంగా చూపిస్తూ, దేవుడే ప్రత్యక్ష కర్త అని ప్రధాన వాక్యంలో బలవంతంగా నిర్ణయించదు.
theological_decisions:
- issue: దేవుని నిరంతర శ్రద్ధకు మానవరూప వర్ణన
  choice: ‘తన కన్నులను’ అనే స్పష్టమైన రూపకాన్ని నిలుపడం
  alternative: ‘తన శ్రద్ధను’ లేదా ‘తన సంరక్షణను’ అని భావాన్ని మాత్రమే చెప్పడం
  rationale: హీబ్రూ పాఠం దేవుని ఎడతెగని దృష్టిని కన్నుల రూపకంతో తెలియజేస్తుంది. దానిని అమూర్త పదంగా మార్చకుండా మూలచిత్రాన్ని నిలుపాం.
- issue: రాజసంబంధ వాక్యంలో ‘వారిని’ అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: అది సమూహార్థంలో ఉన్న ‘నీతిమంతుని’ సూచిస్తుందని ప్రధాన పాఠంలో గ్రహించడం
  alternative: అది రాజులను సూచిస్తుంది; దేవుడు రాజులను సింహాసనంపై శాశ్వతంగా కూర్చోబెడతాడు
  rationale: ముందున్న సమూహార్థక ఏకవచనం తరువాతి బహువచన సర్వనామానికి సహజ పూర్వపదంగా ఉండగలదు. అయితే హీబ్రూ నిర్మాణం సంక్షిప్తమైనందున ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: చివరి క్రియలో కర్త మరియు వాచ్యం
  choice: ‘వారు ఉన్నతులవుతారు’ అనే ఫలితార్థ పఠనం
  alternative: ‘ఆయన వారిని ఉన్నతపరుస్తాడు’ అని దేవుణ్ణి ప్రత్యక్ష కర్తగా గ్రహించడం
  rationale: సంక్షిప్త హీబ్రూ రూపం ఉన్నత స్థితిని స్పష్టంగా చెబుతుంది, కానీ తెలుగులో కర్తను మరీ నిర్దిష్టంగా నిర్ణయించకుండా ఫలితాన్ని తెలిపే పఠనం మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘తన కన్నులను’ అనే మూల రూపకం అలాగే ఉంచబడింది; హీబ్రూ వాక్య నిర్మాణంలోని నిజమైన సందిగ్ధతలను పాదటిప్పణుల్లో వెల్లడించాం.
