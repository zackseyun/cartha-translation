  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זְ֭כֹר כִּֽי תַשְׂגִּ֣יא פָעֳל֑/וֹ אֲשֶׁ֖ר שֹׁרְר֣וּ אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: te
  text: ఆయన కార్యాన్ని ఘనపరచాలని గుర్తుంచుకో; దాని గురించి మనుషులు గానం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిని మనుషులు చూశారు,” లేదా “దానిని మనుషులు ధ్యానించి పరిశీలించారు.” ఇక్కడి హీబ్రూ క్రియ שֹׁרְרוּ అర్థం నిర్ధారించడం కష్టం; కొందరు దీనిని గానం చేయడం కంటే చూడడం అనే అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం ఉంచుకో
  rationale: పుంలింగ ఏకవచన ఆజ్ఞార్థక రూపం. ఆధునిక ప్రామాణిక తెలుగులో నేరమైన, సహజమైన ప్రబోధంగా ఉంది.
- source_word: כִּי
  choice: —అని (వాక్య నిర్మాణంలో ‘ఘనపరచాలని’)
  rationale: కారణాన్ని కాక, జ్ఞాపకం ఉంచుకోవలసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ భావం ‘-ాలని’ రూపంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: תַשְׂגִּיא
  choice: ఘనపరచాలని
  rationale: హిఫిల్ రూపం ‘గొప్పగా చేయు, మహిమపరచు, ఘనపరచు’ అనే భావాన్ని ఇస్తుంది. దేవుని కార్యాన్ని కొనియాడే సందర్భంలో ‘ఘనపరచు’ సహజంగా ఉండి, ప్రబోధాత్మక శక్తిని నిలుపుతుంది.
- source_word: פָעֳלוֹ
  choice: ఆయన కార్యాన్ని
  rationale: ‘కార్యం/క్రియ’ అనే విస్తృత భావాన్ని నిలుపుతుంది. సందర్భం ద్వారా సర్వనామం దేవునిని సూచించినా, మూలంలోని సర్వనామ నిర్మాణం అలాగే ఉంచబడింది.
- source_word: אֲשֶׁר
  choice: దానిని గురించి
  rationale: ముందున్న ‘ఆయన కార్యం’తో సంబంధవాక్యాన్ని కలుపుతుంది. ‘గానం చేశారు’తో తెలుగులో ‘దానిని గురించి’ సహజమైన అన్వయాన్ని ఇస్తుంది.
- source_word: שֹׁרְרוּ
  choice: గానం చేశారు
  rationale: సాంప్రదాయికంగా ఈ కఠిన రూపాన్ని ‘పాడారు/గానం చేశారు’ అని అర్థం చేసుకుంటారు. ‘చూశారు’ లేదా ‘ధ్యానించి పరిశీలించారు’ అనే సాధ్యమైన అర్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: אֲנָשִׁים
  choice: మనుషులు
  rationale: మూలంలోని పుంలింగ బహువచన మానవ పదాన్ని తెలుగులో సాధారణ మానవ సమూహాన్ని సూచించే సహజ పదంతో అనువదిస్తుంది; ‘ప్రజలు’ అని మరీ సామూహికంగా మార్చదు.
theological_decisions:
- issue: ‘ఆయన కార్యం’లోని తృతీయ పురుష ఏకవచన సర్వనామ సూచన
  choice: సందర్భానుసారం దేవుని కార్యం; పాఠ్యంలో ‘ఆయన’ అని నిలుపుట
  alternative: ‘దేవుని కార్యం’ అని పేరును స్పష్టంగా చేర్చుట
  rationale: ఎలీహు సందర్భంలో దేవుని కార్యాల గురించే మాట్లాడుతున్నాడు. అయితే హీబ్రూ పాఠ్యం పేరుకు బదులు సర్వనామాన్ని వాడుతుంది కాబట్టి అనువాదం దానిని స్పష్టీకరించి మార్చకుండా నిలుపుతుంది.
- issue: אֲנָשִׁים యొక్క లింగసూచక రూపం
  choice: మనుషులు
  alternative: పురుషులు
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగ బహువచనం అయినప్పటికీ ఇక్కడ మానవులను ప్రతినిధిగా సూచిస్తుంది. తెలుగులో ‘పురుషులు’ అనడం మగవారికే పరిమితమైన భావాన్ని అనవసరంగా కలిగిస్తుంది; ‘మనుషులు’ మూల భావవ్యాప్తిని సహజంగా అందిస్తుంది.
- issue: שֹׁרְרוּ అనే కఠిన క్రియ యొక్క అర్థం
  choice: గానం చేశారు
  alternative: చూశారు / ధ్యానించి పరిశీలించారు
  rationale: కావ్యసందర్భం మరియు సాంప్రదాయిక పఠనం గానార్థానికి మద్దతిస్తాయి. అయినా రూపానికి సంబంధించిన నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కావ్య-ప్రబోధ శైలి. ‘ఘనపరచు’ దైవకార్యాన్ని కొనియాడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠ్యంలో క్రియకు సాంప్రదాయిక గానార్థం ఎంచుకొని, మూలంలోని నిజమైన అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
