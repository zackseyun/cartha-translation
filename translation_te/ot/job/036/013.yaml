source:
  edition: WLC
  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: te
  text: కాని హృదయంలో భక్తిహీనులైనవారు[b] కోపాన్ని కూడబెట్టుకుంటారు; ఆయన వారిని బంధించినప్పుడు[a] వారు సహాయం కోసం మొరపెట్టరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన వారిని బంధిస్తాడు కాబట్టి.” హీబ్రూ సంధిపదాన్ని కాలార్థకంగా కాక కారణార్థకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “హృదయంలో భక్తిహీనులైనవారు” అనే మాటను “హృదయంలో కపటులైనవారు” లేదా “అంతరంగంలో దైవభయం లేనివారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: హృదయంలో భక్తిహీనులైనవారు
  rationale: חנף అనే పదం భక్తిహీనత, దైవభయరాహిత్యం లేదా కపటత్వాన్ని సూచించగలదు. యోబు గ్రంథంలోని సందర్భంలో కేవలం సామాజిక కపటత్వం కంటే అంతరంగ భక్తిహీనత ప్రధానంగా కనిపిస్తుంది; לֵב అంతరంగ స్వభావాన్ని సూచిస్తుంది.
- source_word: יָשִׂימוּ אָף
  choice: కోపాన్ని దాచిపెట్టుకుంటారు
  rationale: అక్షరార్థంగా ‘కోపాన్ని ఉంచుతారు’ అనే హీబ్రూ ప్రయోగం తెలుగులో సహజంగా ఉండదు. ‘దాచిపెట్టుకుంటారు’ అనేది కోపాన్ని అంతరంగంలో నిలుపుకోవడం లేదా పోగుచేసుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יְשַׁוְּעוּ
  choice: వారు సహాయం కోసం మొరపెట్టరు
  rationale: שׁוע పియేల్ రూపం కష్టంలో సహాయం కోసం మొరపెట్టడాన్ని సూచిస్తుంది. ఈ అనువాదం ఆ భావాన్ని స్పష్టంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో כִּי కాలార్థకంగా, వారు బంధించబడే సమయంలో మొరపెట్టరనే భావాన్ని ఇవ్వగలదు. కారణార్థకమైన ‘ఎందుకంటే/ఆయన బంధించడం వల్ల’ అనే పఠనం కూడా సాధ్యమే; దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲסָרָם
  choice: ఆయన వారిని బంధించినప్పుడు
  rationale: אָסַר అంటే బంధించడం, కట్టివేయడం లేదా నిర్బంధించడం. ఏకవచన కర్తను మూలంలోని విధంగానే ‘ఆయన’గా ఉంచి, సందర్భానుసారంగా దేవునిని సూచించేలా చేశాం; దేవుడు అని స్పష్టీకరించి మూలంలోని సర్వనామాన్ని మార్చలేదు.
theological_decisions:
- issue: ‘ఆయన వారిని బంధించినప్పుడు’ అనే వాక్యంలో ఏకవచన కర్త ఎవరనేది
  choice: మూలంలోని ఏకవచన సర్వనామ భావాన్ని ‘ఆయన’గా నిలిపి ఉంచడం; సందర్భంలో అది దేవునిని సూచిస్తుంది.
  alternative: ‘దేవుడు వారిని బంధించినప్పుడు’ అని స్పష్టంగా అనువదించడం.
  rationale: హీబ్రూలో దేవుని పేరు ప్రత్యక్షంగా లేదు; మూడవ పురుష ఏకవచన క్రియ మాత్రమే ఉంది. సందర్భం దేవునిని సూచించినా, మూలంలోని సూచనాత్మకతను నిలుపుకోవడం సముచితం.
- issue: כִּי యొక్క కాలార్థక లేదా కారణార్థక సంబంధం
  choice: ప్రధాన పాఠ్యంలో కాలార్థకంగా ‘బంధించినప్పుడు’ అని అనువదించడం.
  alternative: ‘ఆయన వారిని బంధిస్తాడు కాబట్టి/బంధించడం వల్ల’ అనే కారణార్థక పఠనం.
  rationale: విపత్తు లేదా నియంత్రణ సమయంలో వారు సహాయం కోసం మొరపెట్టరనే భావం సందర్భ ప్రవాహానికి సరిపోతుంది. అయితే హీబ్రూ సంధికి కారణార్థం కూడా సాధ్యమైనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘భక్తిహీనులు,’ ‘మొరపెట్టరు,’ ‘బంధించినప్పుడు’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుతూ అతిగా ప్రాచీనంగా లేకుండా ఉన్నాయి. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
