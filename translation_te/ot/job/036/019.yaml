  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. అలంకార ప్రశ్నను రెండు పాదాలుగా ఉంచి, మూలంలోని సందిగ్ధతను పాదటీపుల్లో స్పష్టంగా భద్రపరిచాం.
