base_translation:
  language: en
  yaml_path: translation/ot/job/036/019.yaml
  text: Will your cry avail when distress comes[b][a], or all the exertions of your strength?
translation:
  language: te
  text: 'నీ మొర ఆపదలో నీకు ప్రయోజనం కలిగిస్తుందా?[a][b]

    లేదా నీ బలప్రయత్నాలన్నీ నీకు సహాయపడతాయా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఈ క్లిష్టమైన హీబ్రూ వాక్యానికి మరో వ్యాఖ్యానం ప్రకారం: “నీవు ఆపదలో లేకుండా ఉండేందుకు నీ సంపద గాని, నీ బలప్రయత్నాలన్నీ గాని ఉపయోగపడతాయా?”'
    reason: alternative_reading
  - marker: b
    text: ఈ వచనంలోని హీబ్రూ పాఠం క్లిష్టమైనది; ముఖ్యంగా ఇక్కడ “నీ మొర,” “ఆపదలో కాదు” అని సంప్రదాయంగా అనువదించబడే పదబంధాలు స్పష్టంగా లేవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: ప్రయోజనం కలిగిస్తుందా?
  rationale: ערך అనే క్రియకు ప్రాథమికంగా ‘అమర్చు, క్రమపరచు’ అనే అర్థాలున్నా, ఈ క్లిష్టమైన కవితా సందర్భంలో ‘ఉపయోగపడు/చాలును’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: שׁוּעֲךָ
  choice: నీ మొర
  rationale: మసొరా స్వరచిహ్నాలతో ఉన్న రూపం שׁוע, ‘సహాయం కోసం మొర’ అనే భావానికి మద్దతిస్తుంది. ‘సంపద’ అనే ప్రత్యామ్నాయ వ్యాఖ్యానాన్ని పాదటీపులో ఉంచాం.
- source_word: לֹא בְצָר
  choice: ఆపదలో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ప్రతికూలార్థకమైన לֹא (‘కాదు/లేదు’)తో ఉంది; అయితే ఈ సంక్షిప్త కవితా వాక్యం అత్యంత క్లిష్టమైనది. ప్రధాన పాఠంలో సందర్భార్థాన్ని సహజమైన తెలుగులో ఇచ్చి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటీపులో భద్రపరిచాం.
- source_word: וְכֹל
  choice: లేదా ... అన్నీ
  rationale: וְ సాధారణంగా ‘మరియు’; ఇక్కడ మొదటి సాధనానికి తోడు మరో సాధనమూ ఫలించదనే అలంకార ప్రశ్నలో తెలుగులో ‘లేదా’ సహజంగా ఉంటుంది.
- source_word: מַאֲמַצֵּי כֹחַ
  choice: నీ బలప్రయత్నాలన్నీ
  rationale: מַאֲמַצֵּיలోని ప్రయత్నం/శ్రమ భావాన్నీ, כֹחַలోని బలం భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది. ప్రత్యక్ష సంబోధన, సమాంతర నిర్మాణం ఆధారంగా ‘నీ’ చేర్చబడింది.
