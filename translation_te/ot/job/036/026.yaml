id: JOB.36.26
reference: Job 36:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: te
  text: ఇదిగో, దేవుడు గొప్పవాడు; మనం ఆయనను ఎరుగము[a]. ఆయన సంవత్సరాల సంఖ్య పరిశోధనకు అందనిది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మనం ఎరుగము.” సందర్భం ప్రకారం “ఆయనను” అనే కర్మ అంతర్భావితంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన సంవత్సరాల సంఖ్యను శోధించి తెలుసుకోవడం సాధ్యం కాదు”; అక్షరార్థంగా, “ఆయన సంవత్సరాల సంఖ్యకు పరిశోధన లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై దృష్టి నిలిపే ఉద్ఘాటనను, జ్ఞానసాహిత్యానికి తగిన కావ్యగంభీరతను నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇది దేవునికి వాడిన సాధారణ కావ్యపదం; లిప్యంతరీకరించవలసిన వ్యక్తినామం కాదు.
- source_word: שַׂגִּיא
  choice: గొప్పవాడు
  rationale: మహత్వం, ఔన్నత్యం అనే విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘శక్తిమంతుడు’ వంటి మరింత నిర్దిష్ట భావాన్ని చేర్చదు.
- source_word: וְלֹא נֵדָע
  choice: మనం ఆయనను ఎరుగము
  rationale: హీబ్రూలో కర్మ పేర్కొనబడకపోయినా, ముందున్న ‘దేవుడు’ సందర్భానుసారంగా అంతర్భావిత కర్మ. తెలుగులో సహజత కోసం ‘ఆయనను’ చేర్చి, ‘ఎరుగము’ ద్వారా తెలుసుకోవడం/గ్రహించడం మధ్యనున్న భావవిస్తృతిని నిలిపాం.
- source_word: מִסְפַּר שָׁנָיו
  choice: ఆయన సంవత్సరాల సంఖ్య
  rationale: దేవుని కాలవ్యాప్తిని ‘సంవత్సరాలు’గా చెప్పే మూలంలోని కావ్యాత్మక, మానవరూపక ప్రయోగాన్ని వ్యాఖ్యానాత్మకంగా ‘నిత్యత్వం’ అని మార్చకుండా నిలుపుతుంది.
- source_word: וְלֹא חֵקֶר
  choice: పరిశోధనకు అందనిది
  rationale: అక్షరార్థంగా ‘పరిశోధన/శోధన లేదు’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, కేవలం సంఖ్యాపరంగా ‘లెక్కలేనిది’ అని భావాన్ని కుదించదు.
theological_decisions:
- issue: וְלֹא נֵדָע లో అంతర్భావిత కర్మ
  choice: ‘మనం ఆయనను ఎరుగము’ అని ‘ఆయనను’ చేర్చడం
  alternative: కర్మను చేర్చకుండా ‘మనం ఎరుగము’ అని అనువదించడం
  rationale: మూలంలో కర్మ లేకపోయినా తక్షణ సందర్భం దేవునినే సూచిస్తుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు కర్మను చేర్చాం; అయితే ‘పూర్తిగా’ వంటి వ్యాఖ్యానాత్మక పరిమితిని చేర్చలేదు.
- issue: దేవుని ‘సంవత్సరాలు’ అనే ప్రయోగం
  choice: ‘ఆయన సంవత్సరాలు’ అనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘ఆయన నిత్యత్వం’ లేదా ‘ఆయన ఆయుష్షు’ అని వ్యాఖ్యానించడం
  rationale: మూలం దేవుని సంవత్సరాల సంఖ్య గురించి కావ్యాత్మకంగా మాట్లాడుతుంది. ‘నిత్యత్వం’ అని వ్యవస్థీకృత వేదాంత పదాన్ని చేర్చకుండా మూలంలోని రూపకాన్ని, ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానకావ్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘ఎరుగము’ స్వల్పంగా సాహిత్యరంగు కలిగినా సాధారణ పాఠకులకు అర్థమయ్యే పదం; ‘పరిశోధనకు అందనిది’ మూలంలోని חֵקֶר భావాన్ని స్పష్టంగా నిలుపుతుంది.
