  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: te
  text: నువ్వు ఇవన్నీ ఎంతకాలం పలుకుతావు? నీ నోటి మాటలు పెనుగాలేనా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד אָן
  choice: ఎంతకాలం
  rationale: ఈ ప్రశ్నార్థక ప్రయోగం ‘ఎప్పటివరకు’ అనే కాలపరిమితిని అడుగుతూ, బిల్దదు అసహనంతో చేసిన మందలింపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְּמַלֶּל
  choice: మాట్లాడుతూ ఉంటావు
  rationale: ఈ క్రియలో కొనసాగుతున్న పలుకుబడి భావం సందర్భానుసారంగా ఉంది. ‘మాట్లాడుతూ ఉంటావు’ ఆ కొనసాగింపును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֵלֶּה
  choice: ఇవన్నీ
  rationale: బహువచన సూచనను నిలుపుతూ, యోబు ఇంతకుముందు చెప్పిన విషయాలన్నిటినీ సూచిస్తుంది; రెండో పాదంలోని ‘మాటలు’ అనే పదాన్ని అనవసరంగా ముందే పునరావృతం చేయదు.
- source_word: וְרוּחַ כַּבִּיר
  choice: పెనుగాలిలా ... వీస్తాయి
  rationale: רוּחַ యొక్క ‘గాలి’ రూపకాన్ని, כַּבִּיר తెలిపే బలాన్ని ‘పెనుగాలి’ సహజంగా అందిస్తుంది. తెలుగు వాక్యప్రవాహం కోసం ‘వీస్తాయి’ ఉపయోగించబడింది; ఇది బలంగా దూసుకొచ్చే, కానీ పట్టుకోలేని మాటల చిత్రాన్ని నిలుపుతుంది.
- source_word: אִמְרֵי פִיךָ
  choice: నీ నోటి మాటలు
  rationale: హీబ్రూ సమాసంలోని స్పష్టమైన శరీరాత్మక చిత్రణను, కవితాత్మక సమాంతరతను నిలుపుతుంది; తెలుగులోనూ గంభీరంగా, అర్థమయ్యేలా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బిల్దదు పలికిన నేరమైన, అసహనభరిత మందలింపును చూపేందుకు ఏకవచన ‘నువ్వు’ వాడబడింది. కవితాత్మక గాలి రూపకం నిలుపబడింది; అతిగా మతపరమైన లేదా ప్రాచీన పదజాలం నివారించబడింది.
