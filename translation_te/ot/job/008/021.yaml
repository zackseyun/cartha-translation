id: JOB.8.21
reference: Job 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: te
  text: ఆయన ఇంకా నీ నోటిని నవ్వుతో[a], నీ పెదవులను కేకలతో నింపుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నీ నోటిని నవ్వుతో, నీ పెదవులను ఆనంద కేకలతో నింపే వరకు.”
    reason: עַד అనే పదానికి ‘వరకు’ అనే కాలార్థం సాధ్యమై ఉండటం, అలాగే תְרוּעָה సందర్భంలో ఆనంద కేకలను సూచించగలగడం వల్ల ఈ ప్రత్యామ్నాయ అనువాదం ఇవ్వబడింది.
lexical_decisions:
- source_word: עַד
  choice: ఇంకా
  rationale: ఈ సందర్భంలో బిల్దదు దేవుడు భవిష్యత్తులో యోబుకు మళ్లీ సంతోషం కలిగిస్తాడని చెబుతున్నాడు. కాబట్టి అసంపూర్ణంగా వినిపించే కాలార్థక ‘వరకు’ కంటే ‘ఇంకా’ సహజంగా వాగ్దాన భావాన్ని తెలియజేస్తుంది; ‘వరకు’ అనే సాధ్యమైన పఠనం పాదసూచికలో ఉంచబడింది.
- source_word: יְמַלֵּה
  choice: నింపుతాడు
  rationale: מלא ధాతువు పీయేల్ అసంపూర్ణ రూపం; ముందరి వచనంలోని దేవుడే అంతర్లీన కర్త. సందర్భంలోని భవిష్యత్ వాగ్దాన భావాన్ని ఈ రూపం తెలియజేస్తుంది.
- source_word: שְׂחוֹק
  choice: నవ్వు
  rationale: మూలపదం ప్రధానంగా నవ్వును సూచిస్తుంది. పునరుద్ధరణ సందర్భంలో ప్రతికూలమైన ఎగతాళి భావాన్ని చేర్చకుండా ప్రత్యక్ష చిత్రాన్ని నిలుపుతుంది.
- source_word: פִּיךָ
  choice: నీ నోరు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి ప్రత్యక్ష అనువాదం; నోరు నింపబడే కవితాత్మక చిత్రాన్ని నిలుపుతుంది.
- source_word: וּשְׂפָתֶיךָ
  choice: నీ పెదవులు
  rationale: ‘నీ నోరు’తో ఉన్న సమాంతర కవితా నిర్మాణాన్నీ శరీర సంబంధ చిత్రాన్నీ నిలుపుతుంది.
- source_word: תְרוּעָה
  choice: కేకలు
  rationale: ఈ పదం బిగ్గరగా చేసే అరుపు లేదా కేకను, తరచుగా ఆనందం లేదా విజయోత్సాహపు ధ్వనిని సూచించగలదు. ‘కేకలు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతూ ఆరాధనా లేదా సైనిక సందర్భాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: క్రియకు అంతర్లీన కర్త
  choice: ‘ఆయన’ అని స్పష్టంగా అనువదించి, ముందరి వచనంలోని దేవుణ్ణి కర్తగా సూచించడం
  alternative: ‘నీ నోరు నవ్వుతో నింపబడుతుంది’ వంటి కర్తలేని ప్రయోగం
  rationale: 8:20లో దేవుడు కార్యం చేసే కర్తగా పేర్కొనబడ్డాడు; 8:21 అదే ఆలోచనను సహజంగా కొనసాగిస్తుంది. ‘ఆయన’ అనడం పునరుద్ధరణ దేవుని కార్యమనే వాక్యభావాన్ని నిలుపుతుంది.
- issue: תְרוּעָהలోని ఆనంద భావం
  choice: ప్రధాన పాఠ్యంలో ‘కేకలు’ అని విస్తృతంగా ఉంచడం
  alternative: ‘ఆనంద కేకలు’ లేదా ‘ఉల్లాసధ్వనులు’
  rationale: సందర్భం ఆనందాన్ని బలంగా సూచించినప్పటికీ, మూలపదం స్వయంగా ఆనందాన్ని తప్పనిసరిగా నిర్దిష్టం చేయదు. అందువల్ల సందర్భానుగుణ భావాన్ని పాఠకుడు గ్రహించేలా చేసి, ప్రధాన పాఠ్యంలో దాన్ని అధికంగా వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలి ఉపయోగించబడింది. ‘నోరు—పెదవులు’ అనే సమాంతర శరీర చిత్రణను, ‘నింపడం’ అనే రూపకాన్ని నిలుపుకున్నాం. ఏకవచన సంబోధనకు ‘నీ’ వాడబడింది.
