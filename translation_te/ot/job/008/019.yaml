  text: הֶן ה֭וּא מְשׂ֣וֹשׂ דַּרְכּ֑/וֹ וּ֝/מֵ/עָפָ֗ר אַחֵ֥ר יִצְמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/019.yaml
  text: Behold[a], this is the joy of his way[b], and out of the dust others will sprout.
translation:
  language: te
  text: ఇదిగో[a], ఇదే అతని మార్గంలోని ఆనందం; ధూళిలోనుండి ఇతరులు మొలుస్తారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడే తన మార్గంలోని ఆనందం.” హీబ్రూ సర్వనామాన్ని వ్యక్తిని సూచించేదిగా చదవవచ్చు; అయితే సందర్భం ఒక వ్యక్తి గురించి నేరుగా చెప్పడం కంటే, ఆ మొక్క గతిని సారాంశంగా చెప్పడానికే ఎక్కువ మద్దతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ధూళిలోనుండి మరొకటి మొలుస్తుంది.” హీబ్రూ אַחֵר ఏకవచనంగా ఉండవచ్చు; అయితే దానితో ఉన్న క్రియ బహువచనంలో ఉన్నందున “ఇతరులు మొలుస్తారు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని బలంగా ఆకర్షించే ఉద్ఘాటన అవ్యయంగా, కవితా సందర్భంలోని సజీవతను నిలుపుతుంది.
- source_word: הוּא
  choice: ఇదే
  rationale: రూపపరంగా పుంలింగ ఏకవచన సర్వనామమైనా, ముందుగా వర్ణించిన మొక్క గతిని సూచించే నిర్దేశక భావం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: מְשׂוֹשׂ
  choice: ఆనందం
  rationale: ఈ నామవాచకంలోని ‘సంతోషం/ఉల్లాసం’ భావాన్ని సహజమైన ఆధునిక తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: דַּרְכּוֹ
  choice: అతని మార్గంలోని
  rationale: ‘మార్గం’ అనే పదం అక్షరార్థాన్నీ జీవనగతి అనే రూపకార్థాన్నీ నిలుపుతుంది; సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘లోని’ వాడబడింది.
- source_word: וּמֵעָפָר
  choice: ధూళిలోనుండి
  rationale: మూలం లేదా ఉద్భవస్థానాన్ని సూచించే מן ఉపసర్గ భావాన్ని, עָפָר యొక్క సాహిత్యపరమైన ‘ధూళి’ చిత్రంతో కలిపి నిలుపుతుంది.
- source_word: אַחֵר
  choice: ఇతరులు
  rationale: పదం రూపపరంగా ఏకవచనమైనప్పటికీ, దానితో ఉన్న బహువచన క్రియ కారణంగా తెలుగులో బహువచనం సహజంగా సరిపోతుంది; ఏకవచన అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: יִצְמָחוּ
  choice: మొలుస్తారు
  rationale: צמח యొక్క వృక్షసంబంధ ‘మొలకెత్తు’ భావాన్ని సంక్షిప్తంగా, రూపకాన్ని చెడగొట్టకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: הוּא యొక్క సూచన వ్యక్తికా లేక ముందటి పరిస్థితికా
  choice: ‘ఇదే’ అని, ముందుగా చెప్పిన మొక్క గతిని సూచించే సారాంశ వాక్యంగా అనువదించడం
  alternative: ‘అతడే తన మార్గంలోని ఆనందం’ అని వ్యక్తిని నేరుగా సూచించడం
  rationale: హీబ్రూ సర్వనామం వ్యక్తిగత పఠనాన్ని అనుమతించినా, మొక్క రూపకానికి సంబంధించిన సమీప సందర్భం నిర్దేశక సారాంశ పఠనానికి ఎక్కువ మద్దతిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదమైన కవితా ధోరణితో అనువదించబడింది. ‘ఇదిగో,’ ‘మార్గం,’ ‘ధూళి,’ ‘మొలుస్తారు’ అనే పదాలు మూలంలోని ఉద్ఘాటనను, మార్గ రూపకాన్ని, వృక్ష చిత్రాన్ని నిలుపుతున్నాయి. మూలంలోని వ్యాకరణ అస్పష్టతలను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికల్లో చూపించాం.
