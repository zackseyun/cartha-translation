  yaml_path: translation/ot/job/008/001.yaml
  text: Then Bildad the Shuhite answered and said:[a][b]
translation:
  language: te
  text: అప్పుడు షూహీయుడైన బిల్దదు జవాబిచ్చి ఇలా అన్నాడు:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతిస్పందించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘షూహీయుడు’ అంటే షూహకు సంబంధించిన ప్రజావర్గం లేదా ప్రాంతానికి చెందిన వ్యక్తి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ ఈ సంభాషణాత్మక కథన సూత్రంలో ‘జవాబిచ్చాడు/ప్రతిస్పందించాడు’ అనే అర్థాన్నిస్తుంది. ‘జవాబిచ్చాడు’ యోబు గ్రంథంలోని మాటల పరంపరకు సహజంగా సరిపోతుంది.
- source_word: בִּלְדַּד
  choice: బిల్దదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణ బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַשּׁוּחִי
  choice: షూహీయుడైన
  rationale: ఈ జాతి/ప్రాంత సూచక పదం బిల్దదును షూహకు సంబంధించిన వంశం లేదా ప్రాంతానికి చెందినవాడిగా గుర్తిస్తుంది.
- source_word: וַיֹאמַר
  choice: ఇలా
  rationale: హీబ్రూలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్విక్రియా సూత్రాన్ని పదేపదే అనువదిస్తే ఆధునిక తెలుగులో భారంగా ఉంటుంది. ‘ఇలా జవాబిచ్చాడు’ మాటలు వెంటనే రానున్నాయని సహజంగా తెలియజేస్తూ రెండు క్రియల కార్యాన్ని నిలుపుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: మొదటి వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆధునిక తెలుగులో ఆ క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. హీబ్రూ సూత్రవాక్యంలోని భావాన్ని నిలుపుతూ, తెలుగులో అసహజమైన ‘జవాబిచ్చి చెప్పాడు’ అనే పునరుక్తిని నివారించాం.
