translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జ్ఞానసాహిత్య శైలి. హీబ్రూ అలంకారప్రశ్నను తెలుగులో స్పష్టంగా వినిపించేందుకు రెండు సమన్విత ప్రశ్నారూపాలుగా వ్యక్తం చేశాం; హృదయం నుండి మాటలు బయలుదేరే మూలరూపకాన్ని నిలిపాం.
