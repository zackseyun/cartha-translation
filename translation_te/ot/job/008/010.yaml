  yaml_path: translation/ot/job/008/010.yaml
  text: Will they not teach you and tell you[a], and bring forth words from their heart?
translation:
  language: te
  text: వారు నీకు బోధించి, చెప్పి, తమ హృదయం నుండి మాటలను వెలువరించరా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘హృదయం’ అంటే ఇక్కడ ‘మనస్సు’ లేదా ‘అంతరంగం’ అని కూడా అర్థం కావచ్చు; హీబ్రూలో ‘హృదయం’ భావోద్వేగాలకు మాత్రమే కాక ఆలోచనకు కూడా కేంద్రంగా సూచించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: చెప్పరా? ... వెలువరించరా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్న భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలిపింది.
- source_word: הֵם
  choice: వారు
  rationale: ముందటి వచనంలో ప్రస్తావించిన పూర్వతరాలవారిని సూచించే సహజమైన సర్వనామం.
- source_word: יוֹרוּךָ
  choice: నీకు బోధించి
  rationale: ירה అనే ధాతువు హిఫీల్ రూపంలో ఇక్కడ ‘బోధించు/ఉపదేశించు’ అనే భావమిస్తుంది; జ్ఞానసాహిత్య సందర్భానికి ‘బోధించి’ సరిపోతుంది.
- source_word: יֹאמְרוּ לָךְ
  choice: నీతో చెప్పరా
  rationale: అక్షరార్థమైన ‘నీతో/నీకు చెప్పు’ భావాన్ని సహజమైన తెలుగులో నిలిపింది; ముందున్న ‘బోధించి’ అనే క్రియతో భేదాన్నీ కాపాడింది.
- source_word: וּמִלִּבָּם
  choice: తమ హృదయంలోనుండి
  rationale: లֵב సూచించే హృదయం, ఆలోచనాకేంద్రం, అంతరంగం అనే విస్తృత భావాన్ని మానవశరీర రూపకంతో సహా కాపాడింది.
- source_word: יוֹצִיאוּ
  choice: వెలువరించరా
  rationale: హిఫీల్ రూపంలోని ‘బయటికి తీసుకురావు’ అనే రూపకాన్ని మాటలు అంతరంగం నుండి వెలువడుతున్నట్లుగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִלִּים
  choice: మాటలు
  rationale: సందర్భానికి తగిన సరళమైన తెలుగు సమానార్థకం.
