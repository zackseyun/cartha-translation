revisions:
- from: వారు నీకు బోధించి, నీతో చెప్పరా? తమ హృదయంలోనుండి మాటలు వెలువరించరా?[a]
  to: వారు నీకు బోధించి, చెప్పి, తమ హృదయం నుండి మాటలను వెలువరించరా?[a]
  rationale: The revision retains every lexical element and the positive-answer-expected rhetorical force while restoring the Hebrew’s single coordinated question. It also uses idiomatic Telugu dative coordination and marks ‘మాటలను’ as the object of ‘వెలువరించరా.’
