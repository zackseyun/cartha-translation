  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జ్ఞానసాహిత్య శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాలను నిలిపాం. ‘సాలీడు ఇల్లు’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో యథాతథంగా ఉంచి, ‘వల’ అనే వివరణను పాదటిప్పణికే పరిమితం చేశాం.
