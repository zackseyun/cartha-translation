translation:
  language: te
  text: 'అతని నమ్మకం తెగిపోతుంది[a][b];

    అతను నమ్మినది సాలీడు ఇల్లు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని నిరీక్షణ తెగిపోతుంది’; ఇక్కడి హీబ్రూ నామవాచకం నమ్మకం, నిరీక్షణ లేదా భద్రతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తెగిపోతుంది’ అని అనువదించిన హీబ్రూ క్రియ అరుదైనది; దాని అర్థంపై భిన్నాభిప్రాయాలున్నాయి. ‘వేరుచేయబడుతుంది’ లేదా—ఈ సందర్భంలో అంతగా సంభావ్యం కాకపోయినా—‘అసహ్యించబడుతుంది’ అనే అర్థాలు కూడా సాధ్యం.
    reason: lexical_alternative
  - marker: c
    text: అంటే, అతను నమ్మినది సాలీడు ఇల్లు లేదా వల అంత బలహీనమైనది.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: అతని
  rationale: సాపేక్ష కణం ముందరి వచనంలో చెప్పబడిన దేవుణ్ణి మరచిపోయే వ్యక్తిని సూచిస్తుంది; తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా అనుసంధానించడానికి ‘అతని’ వాడబడింది.
- source_word: יָקוֹט
  choice: తెగిపోతుంది
  rationale: అరుదైన, వివాదాస్పదమైన క్రియకు సందర్భంలో నమ్మకం నిలవక తెగిపోవడం అనే భావం సరిపోతుంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: כִּסְלוֹ
  choice: అతని నమ్మకం
  rationale: ఇక్కడ సమాంతర పాదంలోని מִבְטַחוֹతో కలిసి విశ్వాసం, ధీమా లేదా నిరీక్షణ అనే అర్థక్షేత్రాన్ని సూచిస్తుంది; ‘నమ్మకం’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: וּבֵית
  choice: ఇల్లే
  rationale: నిర్మాణ సమాసంలోని ‘ఇల్లు’ అనే ప్రత్యక్ష రూపకాన్ని నిలిపి, ‘ఏ’ ద్వారా అది అతని ఆశ్రయంగా గుర్తించబడుతున్న భావాన్ని తెలుగులో వ్యక్తం చేశాం.
- source_word: עַכָּבִישׁ
  choice: సాలీడు
  rationale: ఈ జంతువుకు ప్రామాణికమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: מִבְטַחוֹ
  choice: అతని ఆశ్రయం
  rationale: ఈ నామవాచకం నమ్మకం మాత్రమే కాక, నమ్మకం ఉంచిన ఆధారం లేదా భద్రతను కూడా సూచించగలదు. ‘ఆశ్రయం’ సాలీడు ఇంటితో చేసే రూపకాత్మక గుర్తింపును సహజంగా వ్యక్తం చేస్తుంది.
