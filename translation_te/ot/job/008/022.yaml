id: JOB.8.22
reference: Job 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שֹׂנְאֶ֥י/ךָ יִלְבְּשׁוּ בֹ֑שֶׁת וְ/אֹ֖הֶל רְשָׁעִ֣ים אֵינֶֽ/נּוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/008/022.yaml
  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: te
  text: నిన్ను ద్వేషించేవారు అవమానాన్ని వస్త్రంలా ధరించుకుంటారు; దుష్టుల గుడారం ఇక ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “దుష్టుల గుడారం లేదు.”'
    reason: హీబ్రూ אֵינֶנּוּ రూపరీత్యా వర్తమాన అస్తిత్వ నిరాకరణ; సందర్భం మాత్రం భవిష్యత్ ఫలితార్థాన్ని సమర్థిస్తుంది.
lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: నిన్ను ద్వేషించేవారు
  rationale: కర్తృవాచక బహువచన కృదంతానికి ద్వితీయ పురుష ఏకవచన ప్రత్యయం ఉంది; ఈ రూపం వ్యక్తిగతమైన ‘నిన్ను’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִלְבְּשׁוּ
  choice: వస్త్రంలా ధరించుకుంటారు
  rationale: לבשׁ యొక్క ప్రాథమిక భావం ‘ధరించడం.’ ‘అవమానం’ అనే అమూర్త నామంతో ఉన్న వస్త్రరూపకాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి ‘వస్త్రంలా’ చేర్చబడింది.
- source_word: בֹשֶׁת
  choice: అవమానం
  rationale: ఇది వ్యక్తిగత సిగ్గుతో పాటు బహిరంగ పరాభవాన్ని కూడా సూచించగలదు; సందర్భంలో ప్రత్యర్థులకు కలిగే పరాభవాన్ని ‘అవమానం’ సహజంగా తెలియజేస్తుంది.
- source_word: וְאֹהֶל
  choice: గుడారం
  rationale: אֹהֶל యొక్క ప్రత్యక్షమైన ‘గుడారం’ అనే చిత్రాన్ని నిలుపుతుంది; ఇది నివాసాన్ని లేదా కుటుంబాన్ని సూచించే రూపకాలంకార భావాన్నీ అనుమతిస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడింది; ‘దుష్టులు’ వర్గసూచక భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ప్రామాణిక తెలుగులో ఇస్తుంది.
- source_word: אֵינֶנּוּ
  choice: ఇక ఉండదు
  rationale: రూపరీత్యా ఇది ‘అది లేదు’ అనే అస్తిత్వ నిరాకరణ. ముందున్న భవిష్యత్ క్రియ మరియు సందర్భంలోని ఫలితభావం వల్ల తెలుగులో ‘ఇక ఉండదు’ సహజంగా ఉంటుంది; ‘ఇక’ అంతిమత్వాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యపు కాలార్థం
  choice: 'భవిష్యత్/ఫలితార్థం: ‘దుష్టుల గుడారం ఇక ఉండదు’'
  alternative: 'వర్తమాన అస్తిత్వ నిరాకరణ: ‘దుష్టుల గుడారం లేదు’'
  rationale: హీబ్రూ రూపం స్వతహాగా వర్తమాన అస్తిత్వ నిరాకరణ అయినప్పటికీ, 20–22 వచనాల ప్రవాహం రాబోయే ఫలితాలను వివరిస్తుంది. అందువల్ల భవిష్యత్ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రూపరీత్యా సాధ్యమైన ప్రత్యక్ష అర్థాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన శైలి. హీబ్రూ వస్త్రరూపకాన్ని స్పష్టంగా నిలుపుతూ, గుడారం అనే సాక్షాత్ చిత్రాన్ని పరిరక్షించాం.
