  source_fidelity: హీబ్రూ שֹׂנְאֶיךָ ను వ్యక్తిగత కర్మతో కూడిన “నిన్ను ద్వేషించేవారు”గా, יִלְבְּשׁוּ בֹשֶׁת ను వస్త్రరూపకంతో కూడిన “అవమానాన్ని వస్త్రంలా ధరించుకుంటారు”గా సరిగ్గా ప్రతిబింబించారు. “దుష్టుల గుడారం” אֹהֶל רְשָׁעִים యొక్క సాక్షాత్ చిత్రాన్ని నిలుపుతుంది. אֵינֶנּוּ రూపతః వర్తమాన అస్తిత్వ నిరాకరణ అయినా, సందర్భానుసార ఫలితభావంతో “ఇక ఉండదు” అనడం సమంజసం; ప్రత్యక్ష ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
