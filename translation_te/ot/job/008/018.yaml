source:
  edition: WLC
  text: אִם יְבַלְּעֶ֥/נּוּ מִ/מְּקוֹמ֑/וֹ וְ/כִ֥חֶשׁ בּ֝֗/וֹ לֹ֣א רְאִיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: te
  text: అతడు తన స్థలం నుండి మింగివేయబడితే[a], ఆ స్థలం అతణ్ణి నిరాకరిస్తూ[b], “నేను నిన్ను చూడలేదు” అంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది దాని స్థలం నుండి మింగివేయబడితే.” ఇక్కడి హీబ్రూ ప్రత్యయం మొక్క రూపకాన్ని సూచించవచ్చు; అదే సమయంలో ఈ రూపకం దుష్టుణ్ణి వ్యక్తిగా కూడా చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆ స్థలం అతణ్ణి తనవాడు కాదంటుంది” / “అతనితో మోసంగా వ్యవహరిస్తుంది.” హీబ్రూ క్రియ నిరాకరించడం, తనవాడు కాదనడం, లేదా మోసంగా వ్యవహరించడం అనే భావాలు ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: తొలగించబడితే
  rationale: אִם యొక్క షరతు భావాన్ని తెలుగు ‘-తే’ రూపం సహజంగా నిలుపుతుంది.
- source_word: יְבַלְּעֶנּוּ
  choice: అతడు ... తొలగించబడితే
  rationale: పియేల్ రూపం అక్షరార్థంగా ‘అతణ్ణి మింగివేస్తే’ అనే భావం ఇవ్వగలదు; అయితే మొక్క/దుష్టుని రూపకంలో తన స్థానం నుండి పూర్తిగా నిర్మూలించబడడాన్ని సహజ తెలుగులో ‘తొలగించబడితే’ తెలియజేస్తుంది, ‘నాశనం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: מִמְּקוֹמוֹ
  choice: తన స్థలం నుండి
  rationale: పుంలింగ ఏకవచన ప్రత్యయం వ్యక్తిని సూచించే పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; మొక్క రూపకాన్ని బట్టి ‘దాని స్థలం’ కూడా సాధ్యం.
- source_word: וְכִחֶשׁ בּוֹ
  choice: ఆ స్థలం అతణ్ణి ఎరుగనని చెబుతూ
  rationale: כחש లోని నిరాకరించడం/సంబంధం లేదనడం అనే భావాన్ని, మాట్లాడుతున్న స్థలపు వ్యక్తీకరణతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא רְאִיתִיךָ
  choice: నేను నిన్ను చూడనే లేదు
  rationale: మూలంలోని ప్రత్యక్ష ‘చూడటం’ రూపకాన్ని కాపాడుతూ, సంపూర్ణ నిరాకరణను ‘చూడనే లేదు’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మొక్క రూపకం మరియు దుష్టుని వ్యక్తీకరణ మధ్య సూచన
  choice: ప్రధాన పాఠ్యంలో ‘అతడు/తన’ను ఉంచి, ‘దాని’ అనే మొక్క-ఆధారిత పఠనాన్ని పాదసూచికలో ఇవ్వడం
  alternative: అంతటా ‘అది/దాని’ అని అనువదించడం
  rationale: హీబ్రూ పుంలింగ రూపాలు వ్యక్తి మరియు మొక్క రూపకం రెండింటికీ వీలు కల్పిస్తాయి; ప్రధాన పాఠ్యం వ్యక్తీకరణను నిలుపుతూనే పాదసూచిక నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక వ్యక్తీకరణను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఆ స్థలం’ను స్పష్టంగా పునరుక్తి చేయడం వల్ల హీబ్రూలోని వ్యక్తీకృత కర్త తెలుగులో సందిగ్ధం కాకుండా ఉంటుంది.
