source:
  edition: WLC
  text: וְ/הָיָ֣ה רֵאשִׁיתְ/ךָ֣ מִצְעָ֑ר וְ֝/אַחֲרִיתְ/ךָ֗ יִשְׂגֶּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/007.yaml
  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: te
  text: 'నీ ఆరంభం చిన్నదైనా,

    నీ అంతిమ స్థితి ఎంతో గొప్పదవుతుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఆరంభం చిన్నదిగా ఉండేది, కానీ నీ భవిష్య స్థితి ఎంతో గొప్పదవుతుంది.”
    reason: וְהָיָהను సందర్భానుసారంగా ‘అయినప్పటికీ’ భావంలో అనువదించవచ్చు; సాధారణ సముచ్చయ భావం కూడా సాధ్యమే. אַחֲרִיתְךָను ‘భవిష్య స్థితి’గా, יִשְׂגֶּהను ‘గొప్పదవుతుంది’గా కూడా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉన్నా
  rationale: వావ్ సంధి మరియు హాయా క్రియారూపాన్ని సందర్భంలోని రెండు పాదాల వ్యత్యాసం దృష్ట్యా concessive భావంతో సహజమైన తెలుగులో ‘ఉన్నా’గా ఇచ్చాం; సాధారణ ‘మరియు ఉండేది’ భావం కూడా సాధ్యమేనని పాదటిప్పణిలో నిలిపాం.
- source_word: רֵאשִׁיתְךָ
  choice: నీ ఆరంభం
  rationale: ‘మొదలు, తొలి స్థితి’ అనే మూలార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִצְעָר
  choice: స్వల్పంగా
  rationale: చిన్నదనం లేదా అల్పతను తెలిపే పదం; తరువాతి విస్తారమైన వృద్ధితో ఉన్న కవితాత్మక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: אַחֲרִיתְךָ
  choice: నీ అంతిమ స్థితి
  rationale: ఈ పదంలోని ‘చివర, తుదిఫలితం, భవిష్య స్థితి’ అనే అర్థపరిధిని ‘అంతిమ స్థితి’ కాపాడుతుంది; కేవలం ‘భవిష్యత్తు’ అనడం తుదిఫలిత భావాన్ని కొంత తగ్గిస్తుంది.
- source_word: יִשְׂגֶּה
  choice: వృద్ధి చెందుతుంది
  rationale: గొప్పదవడం, పెరగడం అనే క్రియాభావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: తీవ్రతను సూచించే అవ్యయాన్ని ‘వృద్ధి చెందుతుంది’తో సహజంగా జతచేసే ఆధునిక తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి. హీబ్రూ ద్విపాద నిర్మాణం మరియు చిన్న ఆరంభం—గొప్ప తుదిస్థితి అనే వ్యత్యాసం నిలిపాం.
