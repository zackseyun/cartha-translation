    text: లేదా “తన పచ్చదనంలో” లేదా “మొగ్గగా.” హీబ్రూ పదం మొక్క యొక్క తాజా పెరుగుదలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తుంచబడకుండానే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: అది ఇంకా ... ఉన్నప్పుడే
  rationale: మొక్క కొనసాగుతున్న స్థితిని సూచించే ఈ రూపాన్ని తెలుగులో సహజమైన కాలసంబంధ వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: בְאִבּוֹ
  choice: లేత మొలకగా
  rationale: ఈ పదం తాజా, పచ్చని మొక్క పెరుగుదలను సూచిస్తుంది; ‘లేత మొలక’ స్పష్టమైన వృక్షచిత్రాన్ని నిలుపుతుంది.
- source_word: לֹא יִקָּטֵף
  choice: కోయబడకముందే
  rationale: קטף యొక్క నిఫాల్ రూపం కోయబడడం లేదా తుంచబడడం అనే కర్మణి భావాన్ని ఇస్తుంది; సందర్భంలో ‘కోయబడకముందే’ సహజంగా ఉంటుంది.
- source_word: וְלִפְנֵי
  choice: ముందుగా
  rationale: ఇది ఇతర గడ్డితో కాలపరమైన పోలికను సూచిస్తుంది.
- source_word: כָל חָצִיר
  choice: మిగతా గడ్డికంటే
  rationale: సందర్భంలోని పోలికను తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మొక్కను సాధారణ గడ్డితో పోలుస్తోంది.
- source_word: יִיבָשׁ
  choice: ఎండిపోతుంది
  rationale: నీటిపై ఆధారపడిన మొక్క ఎండిపోవడాన్ని నేరుగా తెలిపే సహజ తెలుగు పదప్రయోగం.
