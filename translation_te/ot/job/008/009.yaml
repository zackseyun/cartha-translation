source:
  edition: WLC
  text: כִּֽי תְמ֣וֹל אֲ֭נַחְנוּ וְ/לֹ֣א נֵדָ֑ע כִּ֤י צֵ֖ל יָמֵ֣י/נוּ עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/009.yaml
  text: For we are only of yesterday and do not know[a], for our days on the earth are a shadow.
translation:
  language: te
  text: ఎందుకంటే మనం నిన్నటివారమే, మనకు తెలియదు; భూమిమీద మన రోజులు నీడవంటివి కాబట్టి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని పరిచయం చేసే హీబ్రూ సంధానార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: మనం నిన్నటివారమే
  rationale: మానవులు ఇటీవలి కాలానికి చెందినవారనే హీబ్రూ రూపకాన్ని దగ్గరగా ఉంచుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా అందిస్తుంది.
- source_word: וְלֹא נֵדָע
  choice: మనకు తెలియదు
  rationale: నిరాకరణతో ఉన్న ‘తెలుసుకొను’ క్రియను అతిశయింపకుండా నేరుగా అనువదిస్తుంది.
- source_word: כִּי
  choice: '[తెలుగులో ప్రత్యేకంగా పునరుక్తం చేయలేదు]'
  rationale: రెండో כִּי మొదటి వాక్యంలోని అజ్ఞానానికి ఆధారాన్ని సూచిస్తుంది; తెలుగులో అర్ధవిరామంతో కారణ సంబంధం సహజంగా వ్యక్తమవుతుంది. ‘ఎందుకంటే’ని మళ్లీ చేరిస్తే వాక్యం కృత్రిమంగా వినిపిస్తుంది.
- source_word: צֵל
  choice: నీడవంటివి
  rationale: అశాశ్వతతను సూచించే నీడ రూపకాన్ని నిలుపుతుంది; ఉపమాన సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָמֵינוּ
  choice: మన రోజులు
  rationale: మొదటి పురుష బహువచన స్వామ్యార్థంతో కూడిన మూలపదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: עֲלֵי אָרֶץ
  choice: భూమిమీద
  rationale: మానవ జీవితపు భౌమిక పరిధిని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
