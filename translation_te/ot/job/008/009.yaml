review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys human recentness, limited knowledge, and the image of life on earth as a shadow. However, the second Hebrew כִּי introduces the stated ground for the preceding claim; the semicolon alone does not adequately preserve that causal connection in Telugu.
  naturalness: ‘మనం నిన్నటివారమే’ is an intelligible poetic rendering in modern standard Telugu. Adding a final causal connector produces a clearer and still natural Telugu sentence without artificially repeating ‘ఎందుకంటే.’
  terminology: ‘నీడవంటివి’ suitably retains the Hebrew shadow image, and ‘భూమిమీద’ is natural. No theological terminology is involved.
  issues:
  - severity: medium
    issue: The causal force of the second כִּי is omitted.
    rationale: 'The Hebrew concludes by giving the reason for human ignorance: human days on earth are like a shadow. Telugu should mark this relationship explicitly; a bare semicolon merely juxtaposes the clauses.'
  revised_text: ఎందుకంటే మనం నిన్నటివారమే, మనకు తెలియదు; భూమిమీద మన రోజులు నీడవంటివి కాబట్టి.
