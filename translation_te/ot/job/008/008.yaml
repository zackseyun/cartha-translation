source:
  edition: WLC
  text: כִּֽי שְׁאַל נָ֭א לְ/דֹ֣ר רִישׁ֑וֹן וְ֝/כוֹנֵ֗ן לְ/חֵ֣קֶר אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/008.yaml
  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: te
  text: ఎందుకంటే, పూర్వతరాన్ని అడుగు; వారి పితరులు పరిశోధించి కనుగొన్న విషయాలను[a][b] పరిశీలించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి పితరుల పరిశోధనను.” హీబ్రూ పదం పరిశోధించే ప్రక్రియను గానీ, దాని ద్వారా కనుగొన్న ఫలితాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పితరులు” అనే మాటను విస్తృతార్థంలో “పూర్వీకులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బిల్దదు ముందటి మాటకు ఆధారాన్ని పరిచయం చేసే కారణసూచక అనుసంధానంగా ఉంది.
- source_word: שְׁאַל נָא
  choice: దయచేసి ... అడుగు
  rationale: ఆజ్ఞార్థక క్రియతో ఉన్న נָא కాలసూచనకన్నా వినయపూర్వక విజ్ఞప్తిని వ్యక్తం చేస్తుంది.
- source_word: לְדֹר רִישׁוֹן
  choice: పూర్వతరాన్ని
  rationale: ఇక్కడ רִאשׁוֹן ఆదికాలపు మొట్టమొదటి తరాన్ని తప్పనిసరిగా సూచించదు; ముందటి తరాన్ని సూచిస్తుంది.
- source_word: וְכוֹנֵן
  choice: శ్రద్ధగా పరిశీలించు
  rationale: כון యొక్క ఈ రూపం మనస్సును ఒక విషయంపై నిలిపి, దానివైపు శ్రద్ధ మళ్లించడాన్ని సూచిస్తుంది; తెలుగులో సహజంగా ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְחֵקֶר
  choice: పరిశోధన ఫలాలను
  rationale: חֵקֶר పరిశోధించే ప్రక్రియనూ, దాని ద్వారా కనుగొన్న విషయాలనూ సూచించగలదు; సందర్భంలో సంక్రమించిన పూర్వజ్ఞానాన్ని ఉద్దేశించిన ఫలితార్థం ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది.
- source_word: אֲבוֹתָם
  choice: వారి పితరుల
  rationale: సర్వనామ ప్రత్యయం పూర్వతరాన్ని తిరిగి సూచిస్తుంది; 'పితరులు' హీబ్రూ వంశపారంపర్య పదప్రయోగాన్ని నిలుపుతుంది.
