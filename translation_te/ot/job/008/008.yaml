translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని పూర్వతర జ్ఞానానికి చేసే విజ్ఞప్తిని నిలుపుతూ, חֵקֶר లోని ప్రక్రియ/ఫలితం అనే ద్వంద్వార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
