source:
  edition: WLC
  text: הֲ/יִֽגְאֶה גֹּ֭מֶא בְּ/לֹ֣א בִצָּ֑ה יִשְׂגֶּה אָ֥חוּ בְלִי מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/011.yaml
  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: te
  text: చిత్తడి నేల లేకుండా పాపిరస్ మొక్క పెరుగుతుందా? నీళ్లు లేకుండా రెల్లు ఏపుగా పెరుగుతుందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపిరస్ మొక్క’కు ‘జమ్ము,’ ‘రెల్లు’కు ‘చిత్తడి గడ్డి’; హీబ్రూ సమాంతర పాదాల్లో చిత్తడి ప్రాంతాల్లో పెరిగే రెండు మొక్కల పేర్లు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִֽגְאֶה
  choice: పెరుగుతుందా?
  rationale: ప్రశ్నార్థక הֲ అలంకారప్రాయమైన ప్రశ్నను సూచిస్తుంది; మొక్కల సందర్భంలో גאה ఎదగడం లేదా పెరగడం అనే భావాన్నిస్తుంది.
- source_word: גֹּמֶא
  choice: పపైరస్ మొక్క
  rationale: చిత్తడి ప్రాంతాల్లో పెరిగే పపైరస్ జాతి మొక్కను సూచించే సాధ్యమైన నిర్దిష్ట అర్థాన్ని ఎంచుకున్నాం; సాధారణ పాఠకునికి ఇది మొక్క అని స్పష్టమయ్యేలా ‘మొక్క’ చేర్చాం.
- source_word: בְּ/לֹא בִצָּה
  choice: చిత్తడి నేల లేకుండా
  rationale: בלא లేమిని, ביצה చిత్తడి లేదా బురద నేలను సూచిస్తాయి; తెలుగు సహజత్వంతో పాటు మొక్క పెరిగే ప్రదేశ భావాన్ని నిలుపుతుంది.
- source_word: יִשְׂגֶּה
  choice: ఏపుగా పెరుగుతుందా?
  rationale: שׂגה ఇక్కడ సమృద్ధిగా లేదా బలంగా ఎదగడాన్ని సూచిస్తుంది; ‘ఏపుగా పెరుగు’ మొక్కల వృద్ధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָחוּ
  choice: రెల్లు
  rationale: నీటి ప్రదేశాల్లో పెరిగే గడ్డి లేదా రెల్లు జాతి వృక్షానికి ఈ పదం వాడబడింది; ఖచ్చితమైన వృక్షజాతి అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: בְלִי מָיִם
  choice: నీళ్లు లేకుండా
  rationale: నీటి లేమిని నేరుగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. రెండు సమాంతర అలంకారప్రాయ ప్రశ్నలను, అలాగే వృక్షనామాల విషయంలో ఉన్న నిజమైన అనిశ్చితిని నిలిపాం.
