source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: te
  text: 'దేవుణ్ణి మరచిపోయే వారందరి దారులూ అలాగే ఉంటాయి;

    భక్తిహీనుని[a] ఆశ నశించిపోతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కపటభక్తుని.” హీబ్రూ పదం భక్తిలేని, దేవునిపట్ల గౌరవం లేని వ్యక్తిని సూచించగలదు; ఇక్కడ “భక్తిహీనుడు” సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందటి ఉపమానాల నుంచి వచ్చే పోలికను, నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָרְחוֹת
  choice: దారులు
  rationale: జీవిత గమనాన్ని సూచించే మూలపాఠంలోని బహువచన రూపకాన్ని నిలుపుతుంది.
- source_word: שֹׁכְחֵי אֵל
  choice: దేవుణ్ణి మరచిపోయే వారు
  rationale: హీబ్రూ కృదంత నిర్మాణాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంగా అందిస్తుంది; אֵל ఇక్కడ సాధారణ దైవబిరుదు కాబట్టి ‘దేవుడు’ అని అనువదించబడింది.
- source_word: תִקְוַת
  choice: ఆశ
  rationale: ఎదురుచూపు లేదా ఆశ అనే భావాల్లో, ఈ జ్ఞానసాహిత్య సందర్భానికి ‘ఆశ’ సహజంగా సరిపోతుంది.
- source_word: חָנֵף
  choice: భక్తిహీనుడు
  rationale: ఈ పదం కేవలం కపటత్వాన్ని కాక దేవునిపట్ల భక్తి, గౌరవం లేని వ్యక్తిని సూచించగలదు; అందువల్ల విస్తృతమైన నైతిక-మతపరమైన భావాన్ని నిలుపుతుంది.
- source_word: תֹּאבֵד
  choice: నశించిపోతుంది
  rationale: אבד ధాతువులోని నాశనం కావడం, లేకుండాపోవడం అనే బలమైన భావాన్ని సందర్భోచితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్యంలోని తీర్పు సందర్భంలో חָנֵף పదానికి అనువాదం
  choice: భక్తిహీనుడు
  alternative: కపటభక్తుడు
  rationale: యోబు గ్రంథంలో ఈ పదం తరచుగా కేవలం నటన లేదా ద్వంద్వ వైఖరి కంటే విస్తృతంగా భక్తిలేని, దేవునిపట్ల గౌరవం లేని వ్యక్తిని సూచిస్తుంది. ‘భక్తిహీనుడు’ ఆ నైతిక-ఆధ్యాత్మిక విస్తృతిని కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం మూలపదంలోని భావసాధ్యతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన జ్ఞానసాహిత్య శైలిని పాటించాం. మొదటి పాదంలోని సంక్షిప్త హీబ్రూ పోలికను అదనపు వ్యాఖ్యానం లేకుండా నిలిపి, రెండవ పాదంలో తీర్పు భావాన్ని స్పష్టంగా ఉంచాం.
