  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: te
  text: ఇదిగో[a], దేవుడు నిర్దోషిని తిరస్కరించడు; దుర్మార్గులకు అండగా ఉండడు.[b]
  philosophy: optimal-equivalence
  footnotes:
