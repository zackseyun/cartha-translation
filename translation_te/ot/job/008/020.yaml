    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘దుర్మార్గుల చేతిని పట్టుకోడు’ లేదా ‘వారి చేతిని బలపరచడు.’ అంటే, వారికి మద్దతు ఇవ్వడు అనే భావం.
