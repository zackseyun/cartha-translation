lexical_decisions:
- source_word: הֶן
  choice: ఇదిగో
  rationale: బలంగా దృష్టిని ఆకర్షిస్తూ నిశ్చయమైన ప్రకటనను ప్రవేశపెట్టే కవితాత్మక పదంగా మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל దేవునికి వాడిన సాధారణ కవితాత్మక నామం; మూలంలో ‘సర్వశక్తిమంతుడు’ అనే అదనపు భావం లేదు.
- source_word: יִמְאַס
  choice: తిరస్కరించడు
  rationale: మాసు అనే క్రియలోని నిరాకరించడం లేదా తోసివేయడం అనే భావాన్ని, భావోద్వేగపూరితమైన ‘అసహ్యించుకోవడం’గా తీవ్రతరం చేయకుండా తెలియజేస్తుంది.
- source_word: תָּם
  choice: నిర్దోషిని
  rationale: సంపూర్ణత, యథార్థత, నిందారాహిత్యం గల వ్యక్తిని సూచించే substantival adjective; తెలుగులో ఏకవచన వ్యక్తిని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יַחֲזִיק בְּיַד
  choice: చెయ్యిని పట్టుకోడు
  rationale: ‘చెయ్యిని పట్టుకోవడం’ అనే మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతూ, ఆదరించడం లేదా సహాయం చేయడం అనే అంతర్భావానికీ అవకాశం ఇస్తుంది.
- source_word: מְרֵעִים
  choice: దుష్కార్యాలు చేసేవారు
  rationale: רעע నుండి వచ్చిన క్రియాత్మక రూపంలోని ‘చెడును చేసేవారు’ అనే సజీవ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְלֹא יַחֲזִיק בְּיַד מְרֵעִים అనే పదబంధ భావం
  choice: దుష్కార్యాలు చేసేవారి చెయ్యిని పట్టుకోడు
  alternative: దుష్కార్యాలు చేసేవారికి అండగా ఉండడు / వారి చేతిని బలపరచడు
  rationale: ప్రధాన పాఠం ‘చెయ్యిని పట్టుకోవడం’ అనే హీబ్రూ రూపకాన్ని కాపాడుతుంది; పాదటిప్పణి దాని సాధ్యమైన సహాయం లేదా మద్దతు అనే భావాన్ని తెలియజేస్తుంది. తద్వారా అసలు పదబంధంలోని అర్థవిస్తృతిని ఒక్క వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక ధోరణిని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘చెయ్యిని పట్టుకోవడం’ అనే స్పష్టమైన మూలరూపకం ప్రధాన పాఠంలో ఉంచి, దాని సహాయం/మద్దతు భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
