source:
  edition: WLC
  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: te
  text: దేవుడు న్యాయాన్ని వక్రీకరిస్తాడా? లేదా సర్వశక్తిమంతుడు నీతిని వక్రీకరిస్తాడా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֵל
  choice: దేవుడు ... వక్రీకరిస్తాడా?
  rationale: ప్రశ్నార్థక הַ ను తెలుగులో వాక్యాంత ప్రశ్నారూపంతో సహజంగా వ్యక్తం చేశాం; אֵל ఇక్కడ దైవ బిరుదుగా కాక సాధారణంగా ‘దేవుడు’ అనే అర్థంలో ఉంది.
- source_word: יְעַוֵּת
  choice: వక్రీకరిస్తాడా
  rationale: עוה పీయేల్ రూపం న్యాయపరమైన సందర్భంలో వంకర చేయడం, చెడగొట్టడం అనే బలమైన భావాన్ని ఇస్తుంది; ‘వక్రీకరించు’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయాన్ని
  rationale: ఇక్కడ పదం న్యాయమైన తీర్పు లేదా న్యాయ ప్రమాణాన్ని సూచిస్తుంది; ‘న్యాయం’ సహజంగా ఉండి న్యాయస్థాన సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: וְאִם
  choice: లేక
  rationale: అక్షరార్థంగా ‘మరియు అయితే’ అయినా, సమాంతర అలంకారప్రశ్నలో రెండో ప్రశ్నను ప్రత్యామ్నాయంగా ప్రవేశపెడుతుంది; తెలుగులో ‘లేక’ సహజమైన సమానార్థక అనుసంధానం.
- source_word: שַׁדַּי
  choice: సర్వశక్తుడు
  rationale: שַׁדַּי ఇక్కడ దేవుని బిరుదు; లిప్యంతరీకరణకు బదులుగా దాని సాంప్రదాయిక తెలుగు అర్థరూపమైన ‘సర్వశక్తుడు’ను వాడాం.
- source_word: צֶדֶק
  choice: నీతిని
  rationale: ఈ పదం నీతి, న్యాయం, సరిగ్గా ఉన్నది అనే భావాలను కలిగి ఉంది. సమాంతర భాగంలోని מִשְׁפָּט ‘న్యాయం’తో పదభేదాన్ని కాపాడటానికి ‘నీతి’ని ఎంచుకున్నాం.
theological_decisions:
- issue: אֵל మరియు שַׁדַּי అనే జత దైవపదాల అనువాదం
  choice: దేవుడు ... సర్వశక్తుడు
  alternative: ఏల్ ... షద్దయి
  rationale: ఈ సందర్భంలో రెండూ లిప్యంతరీకరించాల్సిన వ్యక్తినామాలకన్నా దేవునిని సూచించే పదం/బిరుదులుగా పనిచేస్తాయి; అర్థానువాదం సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది.
- issue: מִשְׁפָּט మరియు צֶדֶק మధ్య భేదాన్ని నిలుపుట
  choice: న్యాయం ... నీతి
  alternative: న్యాయం ... న్యాయం; తీర్పు ... న్యాయం
  rationale: హీబ్రూ కవిత్వంలో ఇవి దగ్గరి సంబంధమున్నా వేర్వేరు న్యాయ-నైతిక పదాలు. ‘న్యాయం ... నీతి’ వాటి పరస్పర సంబంధాన్నీ పదభేదాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కవితాత్మక సమాంతర నిర్మాణం, గౌరవప్రదమైన సాధారణ పదజాలం. మూలంలోని రెండు అలంకారప్రశ్నలు మరియు ‘న్యాయం/నీతి’ పదభేదం నిలుపబడ్డాయి.
