source:
  edition: WLC
  text: אִם זַ֥ךְ וְ/יָשָׁ֗ר אָ֥תָּה כִּי עַ֭תָּה יָעִ֣יר עָלֶ֑י/ךָ וְ֝/שִׁלַּ֗ם נְוַ֣ת צִדְקֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: te
  text: నీవు నిర్మలుడవై నిష్కపటుడవైతే, ఆయన నిశ్చయంగా ఇప్పుడే నీ కొరకు మేల్కొని[a], నీ నీతిగల నివాసాన్ని పునరుద్ధరిస్తాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కొరకు మేల్కొని,” “నీ పక్షాన కార్యానికి పూనుకొని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సంపూర్ణం చేస్తాడు,” “ప్రతిఫలమిస్తాడు”; హీబ్రూ క్రియకు పునరుద్ధరించడం లేదా సంపూర్ణం చేయడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నీ నీతి యొక్క నివాసాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: బిల్దదు ప్రతిపాదిస్తున్న షరతును సహజమైన తెలుగు షరతు రూపంలో తెలియజేస్తుంది.
- source_word: זַךְ
  choice: పవిత్రుడవై
  rationale: జ్ఞానసాహిత్య సందర్భంలోని నైతిక శుద్ధతను సూచిస్తుంది; న్యాయపరమైన నిర్దోషిత్వాన్ని అతిగా ప్రకటించదు.
- source_word: יָשָׁר
  choice: యథార్థంగా
  rationale: నైతిక సూటితనం, నిజాయితీ అనే భావాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כִּי עַתָּה
  choice: ఇప్పుడే
  rationale: అపోదోసిస్‌లోని ఉద్ఘాటనను, తక్షణత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది; כִּי ఇక్కడ కారణార్థకం కాక ఉద్ఘాటనాత్మకం.
- source_word: יָעִיר עָלֶיךָ
  choice: నీ పక్షంగా మేలుకొని
  rationale: עור హిఫీల్ రూపంలోని మేలుకొను/కదలికలోకి రావు అనే రూపకాన్ని, עָלֶיךָ లోని అనుకూల ప్రయోజన భావాన్ని నిలుపుతుంది.
- source_word: וְשִׁלַּם
  choice: పునరుద్ధరిస్తాడు
  rationale: పీయేల్ שׁלםకు సంపూర్ణం చేయడం, ప్రతిఫలమివ్వడం, పునరుద్ధరించడం అనే భావాలు ఉన్నాయి; నివాసం కర్మగా ఉన్నందున పునరుద్ధరణ సందర్భానికి చక్కగా సరిపోతుంది.
- source_word: נְוַת
  choice: నివాసాన్ని
  rationale: ఇల్లు, నివాసస్థలం, కుటుంబ ఆవాసం అన్న విస్తృత భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: צִדְקֶךָ
  choice: నీ నీతిగల
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన విశేషణ రూపంలో అందిస్తూనే, మూలంలోని ‘నీ నీతి’ భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: తరువాతి క్రియలలో అంతర్లీనంగా ఉన్న కర్త
  choice: ‘ఆయన’ అని ఉంచి, సందర్భానుసారంగా దేవుణ్ణి సూచించనివ్వడం
  alternative: ‘దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: హీబ్రూలో కర్తకు ప్రత్యేక నామవాచకం లేదు. సందర్భంలో దేవుడే ఉద్దేశితుడైనా, మూలంలో లేని పేరును చేర్చకుండా సర్వనామాన్ని వాడటం సముచితం.
- issue: బిల్దదు వాదన యొక్క బలం
  choice: అతని షరతుతో కూడిన దృఢ వాదనగానే అనువదించడం
  alternative: వక్త అభిప్రాయానికి దూరం చూపేలా వాక్యాన్ని మృదువుగా వ్యాఖ్యానించడం
  rationale: ఈ మాటలను అనువాదం సమర్థించకూడదు లేదా ముందుగానే సరిదిద్దకూడదు; బిల్దదు చెప్పిన ప్రతిఫల న్యాయ వాదనను ఉన్నట్టుగా ప్రతిబింబించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మేలుకొని’ అనే రూపకాన్ని మూలానికి దగ్గరగా ఉంచి పాదటిప్పణిలో ప్రత్యామ్నాయాలను ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
