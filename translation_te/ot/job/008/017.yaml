    text: లేదా, “అతడు రాతి ఇంటిని చూస్తాడు,” లేదా “అతడు రాళ్ల ఇంటిలోకి చూస్తాడు.” హీబ్రూ పదబంధం అక్షరార్థంగా “రాళ్ల ఇల్లు”; అది రాళ్లతో కట్టిన నిర్మాణాన్నిగానీ, రాళ్లతో నిండిన ప్రదేశాన్నిగానీ సూచించవచ్చు.
