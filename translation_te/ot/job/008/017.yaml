lexical_decisions:
- source_word: עַל גַּל
  choice: రాళ్ల కుప్పపై
  rationale: עַל స్థాన సంబంధాన్ని సూచిస్తుంది; గַּל సందర్భంలో రాళ్ల కుప్పను సూచించే అవకాశం ఉంది. ఈ రూపం వేర్లు రాళ్లపై వ్యాపించి అల్లుకుపోయే దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁרָשָׁיו
  choice: అతని వేర్లు
  rationale: మొక్కతో పోల్చబడిన వ్యక్తిని సూచించే బహువచన స్వామ్యరూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְסֻבָּכוּ
  choice: అల్లుకుపోతాయి
  rationale: వేర్లు ఒకదానితో ఒకటి చిక్కుకొని పెరిగే భావాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּית אֲבָנִים
  choice: రాళ్ల ఇంటిని
  rationale: అక్షరార్థమైన ‘రాళ్ల ఇల్లు’ అనే నిర్మాణాన్ని నిలిపి, అది రాతి కట్టడమా లేక రాళ్లతో నిండిన ప్రదేశమా అనే మూలంలోని అస్పష్టతను సంరక్షిస్తుంది.
- source_word: יֶחֱזֶה
  choice: అతడు చూస్తాడు
  rationale: ఈ క్రియ యొక్క సాధారణ దృశ్యార్థాన్ని నేరుగా అందిస్తుంది; ఏకవచన కర్తతో ఉన్న వ్యక్తీకరణను కూడా నిలుపుతుంది.
