translation:
  language: te
  text: అతని వేర్లు రాళ్ల కుప్పపై అల్లుకొని ఉన్నాయి; అతడు రాళ్ల ఇంటిని[a] చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
