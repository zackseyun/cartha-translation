  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָטֹ֣ב ה֭וּא לִ/פְנֵי שָׁ֑מֶשׁ וְ/עַ֥ל גַּ֝נָּת֗/וֹ יֹֽנַקְתּ֥/וֹ תֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/016.yaml
  text: He is full of moisture before the sun[b][a], and his shoots spread out over his garden.
translation:
  language: te
  text: అతడు సూర్యుని ఎదుట తేమతో నిండి ఉంటాడు[b]; అతని లేత చిగురు[a] అతని తోట మీద విస్తరిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని లేత చిగుళ్లు.’ లేత పెరుగుదలను సూచించే హీబ్రూ నామవాచకం ఏకవచనంలో ఉన్నా, దాన్ని సమూహార్థంలో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సూర్యుని ఎదుట’ అంటే ‘సూర్యుని సమక్షంలో’ లేదా ‘సూర్యకాంతిలో’ కావచ్చు; తప్పనిసరిగా ‘సూర్యోదయానికి ముందు’ అని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָטֹב
  choice: తేమతో నిండి ఉంటాడు
  rationale: ఈ విశేషణం తడిగా లేదా సమృద్ధిగా నీరు అందిన స్థితిని సూచిస్తుంది. మొక్కకు సంబంధించిన స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, కేవలం ‘పచ్చగా’ లేదా ‘ఏపుగా’ అని విస్తరించి చెప్పకుండా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: הוּא
  choice: అతడు
  rationale: హీబ్రూలోని పుంలింగ ఏకవచన సర్వనామాన్ని నిలిపి, బిల్దదు ఉపయోగించిన వ్యక్తీకరణతో కూడిన మొక్క ఉపమానాన్ని కొనసాగించాం.
- source_word: לִפְנֵי שָׁמֶשׁ
  choice: సూర్యుని ఎదుట
  rationale: అక్షరార్థంగా ‘సూర్యుని ముందు/ఎదుట.’ ఇది సూర్యోదయానికి ముందు అనే కాలార్థం కంటే సూర్యుని కాంతికి ఎదురుగా లేదా దాని కింద ఉండడాన్ని సూచించవచ్చు. కవితాత్మక అస్పష్టతను నిలిపే సహజమైన తెలుగు రూపం ఇది.
- source_word: וְעַל
  choice: మీద
  rationale: עַל యొక్క స్థలార్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- source_word: גַּנָּתוֹ
  choice: అతని తోట
  rationale: మూలంలోని ‘తోట’ అనే నామవాచకాన్నీ, మూడవ పురుష పుంలింగ ఏకవచన స్వామ్య ప్రత్యయాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: יֹנַקְתּוֹ
  choice: అతని లేత చిగురు
  rationale: ఈ పదం లేతగా మొలిచే చిగురు లేదా కొమ్మను సూచిస్తుంది. మూలంలో వ్యాకరణపరంగా ఏకవచనం ఉన్నందున ప్రధాన పాఠంలో ఏకవచనాన్ని నిలిపాం; సమూహార్థం సాధ్యమని పాదటిప్పణిలో తెలిపాం.
- source_word: תֵצֵא
  choice: విస్తరిస్తుంది
  rationale: క్రియకు అక్షరార్థంగా ‘బయలుదేరుతుంది/వెలువడుతుంది’ అనే భావం ఉంది. తోట మీదకు పెరిగే లేత చిగురు సందర్భంలో బయటికి వ్యాపించే కదలికను సహజంగా తెలిపేందుకు ‘విస్తరిస్తుంది’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. మొక్కను పుంలింగ వ్యక్తిగా చూపే మూలభాషా వ్యక్తీకరణను ‘అతడు/అతని’ ద్వారా నిలిపాం. పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచాం.
