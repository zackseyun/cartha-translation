  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: te
  text: 'నీ కుమారులు ఆయనకు విరోధంగా పాపం చేసి ఉంటే,

    వారి అతిక్రమణ వశానికి వారిని అప్పగించాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి అతిక్రమణ చేతికి వారిని అప్పగించాడు.” హీబ్రూ నుడికారం అక్షరార్థంగా “వారి అతిక్రమణ చేతికి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చేసి ఉంటే
  rationale: ఈ హీబ్రూ అవ్యయం షరతును సూచిస్తుంది. బిల్దదు మాటను నిర్ధారిత ఆరోపణగా మార్చకుండా, దాని సహజమైన షరతు భావాన్ని నిలుపుతుంది.
- source_word: בָּנֶיךָ
  choice: నీ కుమారులు
  rationale: హీబ్రూ పదం పుంలింగ బహువచనంలో ప్రత్యేకంగా ‘కుమారులు’ అని ఉంది; అందువల్ల సాధారణమైన ‘పిల్లలు’ కంటే ఇదే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: חָטְאוּ
  choice: పాపం చేసి
  rationale: חטא అనే క్రియ పాపం చేయడాన్ని సూచిస్తుంది; షరతు నిర్మాణంలో ‘చేసి ఉంటే’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לוֹ
  choice: ఆయనకు విరోధంగా
  rationale: חטאతో వచ్చిన ל బాధిత పక్షాన్ని సూచించగలదు. సందర్భంలో సర్వనామం దేవుణ్ణి సూచించినా, మూలంలోని సర్వనామ రూపాన్ని నిలుపుతూ ‘దేవునికి’ అని స్పష్టీకరించలేదు.
- source_word: וַיְשַׁלְּחֵם
  choice: వారిని అప్పగించాడు
  rationale: שלח ప్రాథమికంగా ‘పంపు’ అని అర్థమైనా, తరువాతి ‘చేతికి’ అనే ప్రయోగంతో కలిసి ఒక శక్తికి లేదా పరిణామానికి అప్పగించడాన్ని సూచిస్తుంది.
- source_word: בְּיַד
  choice: చేతికి
  rationale: అధికారం లేదా వశాన్ని సూచించే హీబ్రూ నుడికారంలోని ‘చేయి’ రూపకాన్ని తెలుగులోనూ నిలిపింది.
- source_word: פִּשְׁעָם
  choice: వారి అపరాధం
  rationale: פֶּשַׁע ఉద్దేశపూర్వక అతిక్రమణ లేదా తిరుగుబాటు ఛాయను కలిగి ఉంటుంది. ‘అపరాధం’ మొదటి భాగంలోని ‘పాపం’తో పదభేదాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఆయనకు విరోధంగా’లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: సందర్భంలో దేవుణ్ణి సూచిస్తుంది; అయితే అనువాదంలో ‘ఆయన’ అనే సర్వనామాన్నే ఉంచడం.
  alternative: ‘దేవునికి విరోధంగా’ అని స్పష్టంగా చెప్పడం.
  rationale: బిల్దదు దేవుని న్యాయం గురించి మాట్లాడుతున్నందున దేవుడే సహజమైన సూచిత వ్యక్తి. అయినా హీబ్రూ వచనం పేరును ఉపయోగించకుండా సర్వనామాన్ని ఉంచుతుంది; అనువాదం ఆ రూపాన్ని, స్వల్పమైన వాక్యస్థాయి అస్పష్టతను కాపాడుతుంది.
- issue: పరిణామ వాక్యంలో దైవ చర్యకు, వారి స్వంత అపరాధానికి ఉన్న సంబంధం
  choice: ‘వారి అపరాధం చేతికి వారిని అప్పగించాడు’ అని రెండు అంశాలనూ నిలుపడం.
  alternative: ‘వారి అపరాధం కారణంగా వారిని శిక్షించాడు’ లేదా ‘వారి అపరాధపు అధికారానికి వారిని అప్పగించాడు’ అని వివరణాత్మకంగా మార్చడం.
  rationale: హీబ్రూ నుడికారం అప్పగించే చర్యతో పాటు వారి అపరాధం యొక్క అధికారం లేదా పరిణామం అనే భావాన్నీ కలిపి ఉంచుతుంది. కారణం లేదా శిక్ష స్వరూపాన్ని మరింత నిర్దిష్టంగా చెప్పకుండా ఆ వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చేతికి అప్పగించాడు’ అనే సెమిటిక్ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, పాదసూచికలో దాని భావాన్ని వివరించాం.
