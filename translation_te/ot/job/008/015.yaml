  text: יִשָּׁעֵ֣ן עַל בֵּ֭ית/וֹ וְ/לֹ֣א יַעֲמֹ֑ד יַחֲזִ֥יק בּ֝֗/וֹ וְ/לֹ֣א יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: te
  text: అతడు తన ఇంటికి ఆనుకుంటాడు[a], కానీ అది నిలబడదు; దాన్ని గట్టిగా పట్టుకుంటాడు[b], కానీ అది నిలిచి ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు తన ఇంటిమీద ఆధారపడతాడు.’ హీబ్రూ క్రియ ఏదో ఒకదానికి శారీరకంగా ఆనుకోవడాన్నీ, దానిపై ఆధారపడడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిలబడదు,’ ‘నిలిచి ఉండదు’ అనే పునరావృతమైన దృశ్యం హీబ్రూ కవితా సమాంతరతను నిలుపుతుంది; అతడు ఆధారపడేది నిలకడలేనిదని భావం.
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: ఆనుకుంటాడు
  rationale: שׁען నిఫాల్ రూపం ఏదో ఒకదానిపై శారీరకంగా ఆనుకోవడం లేదా దానిపై ఆధారపడడం అనే రెండు భావాలనూ కలిగి ఉంది. ‘ఆనుకుంటాడు’ అనే పదం స్పష్టమైన దృశ్యాన్ని నిలుపుతూ, ఆధారపడే అంతర్భావాన్నీ తెలియజేస్తుంది.
- source_word: עַל
  choice: పై
  rationale: ఆధారం లేదా స్పర్శను సూచించే సాధారణ విభక్త్యర్థం; ‘ఆనుకుంటాడు’తో ‘ఇంటిపై’ సహజమైన తెలుగు ప్రయోగం.
- source_word: בֵּיתוֹ
  choice: తన ఇల్లు
  rationale: בַּיִת యొక్క సాధారణ అర్థం ‘ఇల్లు.’ సందర్భంలో ఇది అతడు ఆధారపడే దానికి రూపకంగా ఉండవచ్చు; అయినా మూలంలోని దృశ్యాన్ని వ్యాఖ్యానించి మార్చకుండా ఉంచాం.
- source_word: וְלֹא יַעֲמֹד
  choice: కానీ అది నిలబడదు
  rationale: עמד అంటే ‘నిలబడడం, నిలిచి ఉండడం.’ వ్యతిరేక ఫలితాన్ని తెలుగులో సహజంగా చూపడానికి וְ ను ‘కానీ’గా అనువదించాం; సామెతసదృశ వర్ణనకు వర్తమాన రూపం సరిపోతుంది.
- source_word: יַחֲזִיק
  choice: గట్టిగా పట్టుకుంటాడు
  rationale: חזק హిఫిల్ రూపం పట్టుకోవడం లేదా గట్టిగా పట్టుకొని ఉండడం అనే సజీవమైన శారీరక చర్యను సూచిస్తుంది. కేవలం మానసిక ఆధారపడటంగా వ్యాఖ్యానించకుండా ఆ దృశ్యాన్ని నిలిపాం.
- source_word: בּוֹ
  choice: దాన్ని
  rationale: חזק తో వచ్చిన בְּ పట్టుకోబడే వస్తువును సూచిస్తుంది; తెలుగులో ‘దాన్ని గట్టిగా పట్టుకుంటాడు’ సహజమైన నిర్మాణం.
- source_word: וְלֹא יָקוּם
  choice: కానీ అది నిలిచి ఉండదు
  rationale: קום సాధారణంగా ‘లేవడం’ లేదా ‘నిలబడడం’ అని అర్థమిచ్చినా, ఇక్కడ עמד కు సమాంతరంగా నిలకడ లేకపోవడాన్ని సూచిస్తుంది. మొదటి అర్ధపాదంతో సమాంతరతను కాపాడుతూ స్వల్ప భేదం కోసం ‘నిలిచి ఉండదు’ అన్నాం.
