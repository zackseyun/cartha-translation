translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్య నిర్మాణం వాడాం. ‘ఆనుకుంటాడు,’ ‘గట్టిగా పట్టుకుంటాడు’ అనే స్పష్టమైన భౌతిక దృశ్యాలను ఉంచి, వాటిలోని ఆధారపడే రూపకార్థాన్ని పాదటిప్పణిలో తెలిపాం. రెండు అర్ధపాదాల్లోని ‘నిలబడదు/నిలిచి ఉండదు’ సమాంతరతను ఉద్దేశపూర్వకంగా కాపాడాం.
