  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: te
  text: ఆయన పెదవుల ఆజ్ఞ నుండి నేను తొలగిపోలేదు; నా కేటాయించిన భాగం కంటే ఆయన నోటి మాటలను మిన్నగా భద్రపరచుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కష్టమైన ఈ హీబ్రూ పదబంధానికి సంప్రదాయ వ్యాఖ్యానాన్ని అనుసరిస్తే: “నాకు అవసరమైన ఆహారం కంటే ఆయన నోటి మాటలను మిన్నగా భద్రపరచుకున్నాను.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: ఆజ్ఞ
  rationale: ఏకవచన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׂפָתָיו
  choice: ఆయన పెదవుల
  rationale: మూలంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని, తరువాత వచ్చే ‘ఆయన నోటి’ అనే కవితా సమాంతరతను కాపాడుతుంది.
- source_word: לֹא אָמִישׁ
  choice: నేను తొలగిపోలేదు
  rationale: మూల క్రియలోని విడిచిపోవడం లేదా పక్కకు మళ్లడం అనే భావాన్ని సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵחֻקִּי
  choice: నాకు కేటాయించిన భాగం కంటే
  rationale: కష్టమైన హీబ్రూ రూపంలోని ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, సందర్భంలో సాధ్యమైన తులనాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అది ఆహారమేనని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: צָפַנְתִּי
  choice: మిన్నగా దాచుకున్నాను
  rationale: క్రియలోని దాచడం/నిల్వచేయడం అనే ప్రాథమిక భావాన్ని ఉంచి, తులనాత్మక సందర్భంలో వాటిని విలువైనవిగా కాపాడుకున్న భావాన్నీ తెలియజేస్తుంది.
- source_word: אִמְרֵי
  choice: మాటలను
  rationale: బహువచన నిర్మాణానికి సరళమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: פִיו
  choice: ఆయన నోటి
  rationale: ‘ఆయన పెదవుల’ అనే మొదటి పదబంధంతో ఉన్న కవితా సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ‘ఆయన పెదవులు,’ ‘ఆయన నోరు’ అనే తృతీయ పురుష ఏకవచన ప్రత్యయాల సూచన
  choice: అవి దేవుణ్ణి సూచిస్తాయి.
  alternative: సాధారణంగా పేర్కొనబడని మరొక వక్తను సూచించవచ్చు.
  rationale: యోబు 23 సందర్భంలో యోబు దేవుని సమక్షంలో తన నమ్మకత్వాన్ని, దేవుని మాటల పట్ల తన వైఖరిని వివరిస్తున్నాడు; అందువల్ల దేవుడే సూచితుడు కావడం అత్యంత సహజం.
- issue: מֵחֻקִּי అనే కష్టమైన పదబంధం
  choice: ‘నాకు కేటాయించిన భాగం కంటే’ అనే తులనాత్మక భావం
  alternative: ‘నా నియమం నుండి’ లేదా సంప్రదాయ వ్యాఖ్యానం ప్రకారం ‘నాకు అవసరమైన ఆహారం కంటే’
  rationale: ప్రాప్త హీబ్రూ రూపం క్లిష్టమైనది. ప్రధాన పాఠ్యం ప్రథమ పురుష ప్రత్యయాన్ని, కేటాయించబడిన భాగం అనే విస్తృత భావాన్ని నిలుపుతుంది; ప్రసిద్ధ ఆహార వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఉంచి అసలులోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. ‘పెదవులు/నోరు’ అనే మూలంలోని సమాంతర రూపకాలు నిలుపబడ్డాయి; క్లిష్టమైన చివరి పదబంధం అతిగా వివరణాత్మకంగా చేయకుండా అనిశ్చితితోనే అనువదించబడింది.
