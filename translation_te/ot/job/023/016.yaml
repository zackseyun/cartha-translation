  terminology: ‘దేవుడు’ and ‘సర్వశక్తిమంతుడు’ appropriately translate the paired divine designations without treating the title שַׁדַּי as a personal name. ‘హృదయం’ preserves the Hebrew image, while the footnote responsibly explains the literal ‘softened’ sense.
