  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: te
  text: కాని దేవుడు నా హృదయాన్ని బలహీనపరిచాడు[a]; సర్వశక్తిమంతుడు నన్ను భయభ్రాంతుడిని చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హృదయాన్ని మెత్తబరచాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘మెత్తగా లేదా మృదువుగా చేయడం’ అని అర్థం; ఇక్కడ యోబు ధైర్యం కరిగిపోయిందనే భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: కాని దేవుడు
  rationale: וְ అనే సంధి సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ముందటి వాక్యంతో ఉన్న భావసంబంధంలో వ్యతిరేక లేదా మలుపు సూచించే ‘కాని’ సహజంగా సరిపోతుంది; אֵל ను ‘దేవుడు’గా అనువదించాం.
- source_word: הֵרַךְ
  choice: బలహీనపరిచాడు
  rationale: రכך మూలక్రియ అక్షరార్థంగా ‘మెత్తబరచడం’ను సూచిస్తుంది. ‘హృదయం’తో కలిసినప్పుడు ధైర్యం లేదా అంతరంగ బలం కరిగిపోవడాన్ని సూచిస్తున్నందున ‘బలహీనపరిచాడు’ అని ఇచ్చాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִבִּי
  choice: నా హృదయాన్ని
  rationale: לֵב అంతరంగం, సంకల్పం, ధైర్యం వంటి భావాలను కలిగి ఉంటుంది. మూలంలోని ప్రతీకను నిలుపుతూ ఆధునిక తెలుగులో సహజమైన ‘హృదయం’ను వాడాం.
- source_word: וְשַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: שַׁדַּי ఇక్కడ దేవుని బిరుదు. దాని భావాన్ని తెలుగులో స్పష్టంగా అందించే ప్రామాణిక రూపం ‘సర్వశక్తిమంతుడు’.
- source_word: הִבְהִילָנִי
  choice: నన్ను భయభ్రాంతుణ్ణి చేశాడు
  rationale: בהל యొక్క హిఫీల్ రూపం తీవ్రమైన భయం, కలవరం కలిగించడాన్ని సూచిస్తుంది. ఆ తీవ్రతను ‘భయభ్రాంతుణ్ణి చేశాడు’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: אֵל మరియు שַׁדַּי అనే దైవిక సంబోధనల అనువాదం
  choice: దేవుడు ... సర్వశక్తిమంతుడు
  alternative: దేవుడు ... షద్దాయి
  rationale: ఈ రెండు పదాలు సమాంతరంగా దేవుని సూచిస్తున్నాయి. שַׁדַּיని ఇక్కడ పేరుగా లిప్యంతరీకరించకుండా, బిరుదు భావాన్ని తెలిపే ‘సర్వశక్తిమంతుడు’గా అనువదించడం మూలంలోని అర్థబలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని వాడాం. మూలంలోని ‘హృదయం’ అనే ప్రతీకను నిలిపి, క్రియ యొక్క సందర్భార్థాన్ని ప్రధాన పాఠంలో స్పష్టం చేశాం.
