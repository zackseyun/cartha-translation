id: JOB.23.14
reference: Job 23:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: te
  text: ఎందుకంటే, నా కోసం నిర్ణయించబడినదాన్ని ఆయన నెరవేరుస్తాడు[a]; అలాంటి అనేక విషయాలు ఆయన వద్ద ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా శాసనాన్ని,” “నా నియమాన్ని,” లేక “నాకు నియమించబడిన భాగాన్ని.” హీబ్రూ పదం యోబు కోసం నిర్దేశించబడిన లేదా స్థిరపరచబడిన దానిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יַשְׁלִים
  choice: నెరవేరుస్తాడు
  rationale: హిఫిల్ రూపం ఏదైనా దాని పూర్తిస్థితికి తీసుకెళ్లడం లేదా నెరవేర్చడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ దేవుడు నిర్ణయించినదాన్ని కార్యరూపంలో పూర్తిచేస్తాడనే భావానికి ఇది సహజంగా సరిపోతుంది.
- source_word: חֻקִּי
  choice: నా కోసం నిర్ణయించబడినదాన్ని
  rationale: חֹק అనే పదానికి శాసనం, నిర్ణయం, నియమించబడిన భాగం వంటి అర్థాలు ఉండవచ్చు. సందర్భంలో యోబుకు దేవుడు నిర్ణయించిన దానిని సూచిస్తున్నందున, న్యాయపరమైన అర్థాన్ని అతిగా రుద్దకుండా ఈ రూపం మూలంలోని భావాన్ని అందిస్తుంది.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: ఇలాంటివి ఇంకా అనేకం
  rationale: అదే రకానికి చెందిన అనేక విషయాలను సూచించే హీబ్రూ వ్యక్తీకరణను సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: עִמּוֹ
  choice: ఆయన దగ్గర ఉన్నాయి
  rationale: అక్షరార్థంలోని ‘ఆయనతో ఉన్నాయి’ అనే భావాన్ని సహజమైన తెలుగులో ఉంచుతూ, అవి దేవుని ఆలోచనలోనా, అధికారంలోనా, ఆధీనంలోనా అన్నది ప్రత్యేకంగా నిర్ణయించదు.
theological_decisions:
- issue: חֻקִּי అనే పదాన్ని న్యాయపరమైన ‘నా శాసనం/నియమం’గా అనువదించాలా, లేక యోబుకు దేవుడు నిర్ణయించిన దానిగా అనువదించాలా
  choice: నా కోసం నిర్ణయించబడినదాన్ని
  alternative: నా శాసనాన్ని; నా నియమాన్ని; నాకు నియమించబడిన భాగాన్ని
  rationale: సమీప సందర్భం యోబు చేసిన శాసనం గురించి కాకుండా, దేవుడు అతని కోసం నిర్ణయించిన మార్గం లేదా పరిస్థితి గురించి మాట్లాడుతుంది. ఈ ఎంపిక దేవుని నిర్ణయాధికారాన్ని తెలియజేస్తూనే, హీబ్రూ పదంలోని శాసనం లేదా నియమిత భాగం అనే సాధ్యమైన ఛాయలను పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. దేవుని సూచించే సర్వనామానికి గౌరవార్థక ఏకవచన రూపం వాడాం; మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడేందుకు చివరి భాగాన్ని అతిగా వివరించలేదు.
