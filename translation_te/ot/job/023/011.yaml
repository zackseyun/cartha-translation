  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: te
  text: ఆయన అడుగుజాడలో నా పాదం గట్టిగా నిలిచింది[a]; ఆయన మార్గాన్ని నేను పాటించాను; దాని నుండి తప్పుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పాదం ఆయన అడుగును గట్టిగా పట్టుకుంది”; హీబ్రూ దృశ్యం దేవుని అడుగుజాడలకు అత్యంత దగ్గరగా అంటిపెట్టుకొని అనుసరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: ఆయన అడుగుజాడను
  rationale: אֲשׁוּר అంటే అడుగు లేదా అడుగుజాడ. ఏకవచన రూపాన్ని నిలుపుతూ, దేవుని అడుగుజాడకు అతి దగ్గరగా అంటిపెట్టుకొని నడిచే దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָחֲזָה
  choice: గట్టిగా పట్టుకుంది
  rationale: אחז యొక్క ప్రాథమిక భావం ‘పట్టుకోవడం’. ఇక్కడ కర్త ‘నా పాదం’ కావడంతో, దృఢంగా అనుసరించడాన్ని సూచించే concrete imageryని ఈ ఎంపిక నిలుపుతుంది.
- source_word: רַגְלִי
  choice: నా పాదం
  rationale: హీబ్రూలో ఏకవచనం ఉంది. ‘నా పాదం’ అని అనువదించడం మూలంలోని స్పష్టమైన దృశ్యరూపాన్ని కాపాడుతుంది.
- source_word: דַּרְכּוֹ
  choice: ఆయన మార్గాన్ని
  rationale: דֶּרֶךְ అంటే మార్గం లేదా జీవన విధానం. ‘ఆయన మార్గం’ భౌతిక మార్గ రూపకాన్నీ, నైతిక నడవడిక భావాన్నీ నిలుపుతుంది.
- source_word: שָׁמַרְתִּי
  choice: నేను పాటించాను
  rationale: שׁמרకు కాపాడడం, గమనించడం, పాటించడం అనే భావాలు ఉన్నాయి. ‘మార్గం’తో తెలుగులో ‘పాటించాను’ సహజంగా ఉండి, జాగ్రత్తగల విధేయతను తెలియజేస్తుంది.
- source_word: וְלֹא אָט
  choice: పక్కకు తొలగిపోలేదు
  rationale: చివరి క్రియ మార్గం నుంచి వాలిపోవడం లేదా పక్కకు తిరగడం అనే భావాన్ని ఇస్తుంది. ‘పక్కకు తొలగిపోలేదు’ మార్గ రూపకాన్ని సహజంగా కొనసాగిస్తుంది.
theological_decisions:
- issue: ‘ఆయన అడుగుజాడ’, ‘ఆయన మార్గం’లోని తృతీయ పురుష ఏకవచన ప్రత్యయాల సూచిత వ్యక్తి
  choice: దేవునిని సూచించే ‘ఆయన’
  alternative: స్పష్టంగా పేర్కొనని నీతిమార్గం లేదా వ్యక్తి
  rationale: యోబు 23:10-12 సందర్భంలో యోబు దేవుని గురించి, ఆయన ఎదుట తన యథార్థత గురించి మాట్లాడుతున్నాడు. అయినప్పటికీ వచనంలో ‘దేవుడు’ అనే నామాన్ని చేర్చకుండా మూలంలోని ప్రత్యయ రూపాన్నే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఏకవచన ‘పాదం/అడుగుజాడ’ దృశ్యాన్ని నిలిపి, రెండవ పాదంలో నైతిక విధేయతను ‘మార్గాన్ని పాటించాను’ అని స్పష్టంగా వ్యక్తం చేశాం.
