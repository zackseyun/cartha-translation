  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/ה֣וּא בְ֭/אֶחָד וּ/מִ֣י יְשִׁיבֶ֑/נּוּ וְ/נַפְשׁ֖/וֹ אִוְּתָ֣ה וַ/יָּֽעַשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: te
  text: అయితే ఆయన ఒకే తలంపుతో ఉన్నాడు[a]; ఆయనను వెనక్కి తిప్పగలవాడెవడు? ఆయన మనసు దేనిని కోరుతుందో[b], దానినే ఆయన చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన ఒకటిగా ఉన్నాడు.” ఈ హెబ్రీ పదబంధం ఆయన ఒకే తలంపుతో ఉండడాన్ని లేదా తన సంకల్పంలో మారకపోవడాన్ని సూచిస్తుండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “ఆయన ప్రాణం దేనిని కోరుతుందో.” హెబ్రీలో “ప్రాణం” అనే మాట ఒకరి స్వంత కోరికను లేదా సంకల్పాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అయితే ఆయన
  rationale: ముందటి సందర్భంతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, హెబ్రీలోని స్వతంత్ర సర్వనామాన్ని నిలుపుతుంది.
- source_word: בְאֶחָד
  choice: ఒకే తలంపుతో ఉన్నాడు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘ఒకటిలో/ఒకటిగా’ ఉన్నప్పటికీ, సందర్భంలో మారని ఏక సంకల్పాన్ని సూచిస్తుంది. ‘ఒకే తలంపుతో’ అనే రూపం ఉద్దేశాన్ని స్పష్టం చేస్తూనే, ‘మార్పులేనివాడు’ వంటి విస్తృత తాత్త్విక నిర్వచనాన్ని చేర్చదు.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: ఆయనను వెనక్కి తిప్పగలవాడెవడు?
  rationale: שׁוב హిఫిల్ రూపం ఇక్కడ ఒకరిని వెనక్కి తిప్పడం లేదా ఆయన నిర్ణయించిన మార్గాన్ని మార్చించడం అనే భావాన్ని ఇస్తుంది; మూలంలోని చిత్రాన్ని తెలుగు అనువాదం నిలుపుతుంది.
- source_word: וְנַפְשׁוֹ
  choice: ఆయన మనసు
  rationale: נֶפֶשׁ అక్షరార్థంగా ‘ప్రాణం/ఆత్మ/స్వయం’ అయినా, ఒక వ్యక్తి స్వీయ కోరిక లేదా సంకల్పాన్ని సూచించే ఈ ప్రయోగానికి ‘మనసు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: אִוְּתָה
  choice: కోరుతుందో
  rationale: ఈ క్రియ కోరిక లేదా సంకల్పాన్ని సూచిస్తుంది. ‘కోరడం’ భావాన్ని అతిశయింపకుండా సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּעַשׂ
  choice: దానినే ఆయన చేస్తాడు
  rationale: עשה అనే సాధారణ ‘చేయు’ క్రియను నిలుపుతూ, కోరిక మరియు కార్యం మధ్య హెబ్రీ వాక్యంలోని ప్రత్యక్ష సంబంధాన్ని ‘దానినే’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దేవుని స్థిరమైన సంకల్పాన్ని తెలిపే בְאֶחָד పదబంధం
  choice: ఆయన ఒకే తలంపుతో ఉన్నాడు
  alternative: ఆయన ఒకటిగా ఉన్నాడు; ఆయన మార్పులేనివాడై ఉన్నాడు
  rationale: ‘ఒకటిగా ఉన్నాడు’ మూలానికి దగ్గరగా ఉన్నా తెలుగులో భావం అస్పష్టంగా ఉండి దేవుని ఏకత్వానికి సంబంధించిన వేరే వాదనగా అర్థమయ్యే అవకాశం ఉంది. ‘మార్పులేనివాడు’ విస్తృతమైన తాత్త్విక భావాన్ని మోపవచ్చు. సందర్భానికి అనుగుణంగా ‘ఒకే తలంపుతో’ ఆయన స్థిరమైన సంకల్పాన్ని తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: దేవునికి ‘ప్రాణం/ఆత్మ’ ఉందని చెప్పే మానవరూప భాష
  choice: ఆయన మనసు దేనిని కోరుతుందో
  alternative: ఆయన ప్రాణం దేనిని కోరుతుందో; ఆయన దేనిని కోరుతాడో
  rationale: ‘మనసు’ తెలుగు పాఠకులకు స్వీయ కోరికను సహజంగా తెలియజేస్తూ, మూలంలోని వ్యక్తిగత సంకల్ప భావాన్ని నిలుపుతుంది. ‘ఆయన కోరేది’ మాత్రమే అని అనువదిస్తే נַפְשׁוֹ అనే మూల వ్యక్తీకరణ పూర్తిగా కనుమరుగవుతుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఒకే తలంపు’ ద్వారా సందర్భంలోని స్థిర సంకల్పం వ్యక్తమవుతుంది; మూలంలోని అక్షరార్థపు అస్పష్టత పాదసూచికలో భద్రపరచబడింది.
