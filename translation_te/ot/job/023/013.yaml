  terminology: “ఆయన మనసు” is an appropriate idiomatic contextual rendering of נַפְשׁוֹ, and footnote b responsibly records the literal “ప్రాణం” and its idiomatic volitional sense. The wording for God's fixed purpose avoids imposing a broader metaphysical formulation such as “unchangeable.”
