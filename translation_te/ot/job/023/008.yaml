source:
  edition: WLC
  text: הֵ֤ן קֶ֣דֶם אֶהֱלֹ֣ךְ וְ/אֵינֶ֑/נּוּ וְ֝/אָח֗וֹר וְֽ/לֹא אָבִ֥ין לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: te
  text: ఇదిగో, నేను తూర్పువైపు వెళ్తాను, కానీ ఆయన అక్కడ లేడు; పడమటివైపు వెళ్తాను, కానీ ఆయనను గుర్తించలేను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ముందుకు వెళ్తాను, కానీ ఆయన అక్కడ లేడు; వెనుకకు వెళ్తాను, కానీ ఆయనను గుర్తించలేను.” హీబ్రూ దిశాసూచక పదాలు తూర్పు/పడమర అని గానీ, ముందు/వెనుక అని గానీ అర్థమవవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: యోబు మాటపై దృష్టి నిలిపే ఉద్ఘాటనను గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קֶדֶם
  choice: తూర్పుకు
  rationale: אָחוֹרతో ఏర్పడిన దిశాత్మక జంటలో భౌగోళిక అర్థం సహజంగా ఉంది; అయితే ‘ముందుకు’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶהֱלֹךְ
  choice: నేను ... వెళ్తే
  rationale: הלך యొక్క గమనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలో వెదకడానికి వెళ్లడం సూచితమైనా దాన్ని అదనంగా చేర్చలేదు.
- source_word: וְאֵינֶנּוּ
  choice: ఆయన అక్కడ లేడు
  rationale: సందర్భానుసారం సర్వనామం దేవుణ్ణి సూచిస్తుంది. దిశలో వెతికిన భావానికి తెలుగులో ‘అక్కడ’ సహజమైన పూరణ.
- source_word: אָחוֹר
  choice: పడమటికి
  rationale: קֶדֶםకు వ్యతిరేక దిశగా కవితా సమాంతరాన్ని స్పష్టంగా చూపుతుంది; ‘వెనుకకు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
- source_word: לֹא אָבִין לוֹ
  choice: ఆయన నాకు కనిపించడు
  rationale: בין ఇక్కడ దేవుని ఉనికిని గుర్తించలేకపోవడం లేదా గ్రహించలేకపోవడాన్ని సూచిస్తుంది. ‘కనిపించడు’ వెదకడం అనే సందర్భంలో సహజంగా ఉన్నా, ‘గ్రహించలేను’ అనే భావసంభావ్యతను పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన సర్వనామాల సూచ్యుడు
  choice: సందర్భంలోని దేవుణ్ణి సూచిస్తూ ‘ఆయన’ అని అనువదించడం
  alternative: సూచ్యుణ్ణి స్పష్టంగా గుర్తించకుండా సర్వనామ రూపమే ఉంచడం
  rationale: చుట్టుపక్కల వచనాల్లో యోబు దేవుణ్ణి వెదుకుతున్నందున ‘ఆయన’ అనేది సందర్భబద్ధం; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కవితాత్మక వాక్య నిర్మాణం. హీబ్రూలోని దిశాసంబంధ ద్వంద్వార్థాన్ని ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
