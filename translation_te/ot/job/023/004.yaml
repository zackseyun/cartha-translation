translation:
  language: te
  text: ఆయన ఎదుట నా వాదనను క్రమంగా సమర్పించేవాడిని[a]; నా నోటిని వాదనలతో నింపేవాడిని[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఎదుట నా న్యాయకేసును క్రమంగా సమర్పించేవాడిని.” ఇక్కడ “వాదన” అని అనువదించిన హీబ్రూ పదానికి న్యాయపరమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “వాదనలు” అనే పదాన్ని “నిరూపణలు,” “గద్దింపులు,” లేదా “వివాదాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: క్రమంగా ఉంచుతాను
  rationale: ערך అనే క్రియలో ఉన్న ‘అమర్చడం, క్రమపరచడం, సమర్పించడం’ అనే భావాన్ని న్యాయసందర్భానికి తగిన సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: ఆయన ఎదుట
  rationale: అక్షరార్థంగా ‘ఆయన సన్నిధిలో/ముఖం ఎదుట’; ఇది వ్యక్తిగతమైన మరియు న్యాయపరమైన సందర్భం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: מִשְׁפָּט
  choice: నా వ్యాజ్యాన్ని
  rationale: ఈ సందర్భంలో משפט సాధారణ ‘తీర్పు’ కంటే న్యాయస్థానంలో సమర్పించే కేసు లేదా వ్యాజ్యాన్ని సూచిస్తుంది. హెబ్రీలో స్వామ్యసూచకం స్పష్టంగా లేకపోయినా, యోబు తాను సమర్పించబోయే విషయాన్ని మాట్లాడుతున్నందున ‘నా’ సందర్భానుగుణంగా చేర్చబడింది.
- source_word: וּפִי
  choice: నా నోటిని
  rationale: హెబ్రీ రూపకాన్ని నేరుగా నిలుపుతుంది; ‘నింపుతాను’ అనే తరువాతి క్రియతో తెలుగులోనూ స్పష్టంగా అర్థమవుతుంది.
- source_word: אֲמַלֵּא
  choice: నింపుతాను
  rationale: మొదటి క్రియతో కలిసి యోబు ఊహాత్మకంగా కోరుతున్న చర్యను కొనసాగిస్తుంది; నోరు నింపడం అనే మూలభాషా చిత్రాన్ని కాపాడుతుంది.
- source_word: תוֹכָחוֹת
  choice: వాదనలతో
  rationale: תוכחות అనే పదానికి గద్దింపులు, నిరూపణలు, ప్రతివాదాలు వంటి భావాలు ఉండవచ్చు. ఇక్కడి న్యాయస్థాన రూపకంలో ‘వాదనలు’ యోబు తన కారణాలను దేవుని ఎదుట వినిపించాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని ఎదుట యోబు ఉపయోగించే న్యాయస్థాన రూపకం
  choice: ‘వ్యాజ్యం’, ‘వాదనలు’ అనే న్యాయపరమైన భాషతో యోబు ధైర్యాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నా సంగతి చెప్పుకుంటాను’ లేదా ‘నా ఫిర్యాదులు వినిపిస్తాను’ అని సాధారణీకరించడం
  rationale: ערך, משפט, תוכחות అనే పదాల సమాహారం క్రమబద్ధమైన న్యాయవాదనను సూచిస్తుంది. అందువల్ల యోబు దేవుని ఎదుట తన వ్యాజ్యాన్ని ఉంచాలనే ఉద్విగ్నమైన ధైర్యాన్ని తగ్గించకుండా, అదే సమయంలో అతడు దేవుణ్ణి గద్దిస్తున్నాడని అనవసరంగా నిర్ణయించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయపరమైన పదజాలం. మూలంలోని సమాంతర నిర్మాణం మరియు ‘నోరు నింపడం’ అనే రూపకం నిలుపబడ్డాయి.
