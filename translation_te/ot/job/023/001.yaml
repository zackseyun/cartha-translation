lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: ענה అనే క్రియ సంభాషణ సందర్భంలోని ఈ కథన సూత్రంలో ‘జవాబిచ్చాడు’ లేదా ‘ప్రతిస్పందించాడు’ అనే అర్థం ఇస్తుంది. ‘జవాబిచ్చాడు’ మూలంలోని సంభాషణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִיּוֹב
  choice: యోబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన ప్రామాణిక రూపమైన ‘యోబు’గా ఇచ్చాం.
- source_word: וַיֹּאמַר
  choice: ఇలా
  rationale: అక్షరార్థంగా ‘అన్నాడు’; అయితే ‘జవాబిచ్చాడు, అన్నాడు’ అనే హీబ్రూ సూత్రాన్ని తెలుగులో యథాతథంగా ఇస్తే పునరుక్తిగా వినిపిస్తుంది. తరువాత వచ్చే ప్రత్యక్ష మాటలను సూచించే ‘ఇలా’ ద్వారా אמַר యొక్క వాక్యప్రవేశ కార్యాన్ని సహజంగా నిలిపాం.
- source_word: וַ...וַ...
  choice: అప్పుడు ... ఇలా ...
  rationale: మొదటి వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’ అని ఇచ్చాం. రెండవ వావ్‌తో కూడిన మాటల పరిచయాన్ని తెలుగులో సహజమైన ఏకీకృత నిర్మాణంగా అందించాం.
