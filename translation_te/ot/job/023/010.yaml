source:
  edition: WLC
  text: כִּֽי יָ֭דַע דֶּ֣רֶךְ עִמָּדִ֑/י בְּ֝חָנַ֗/נִי כַּ/זָּהָ֥ב אֵצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/010.yaml
  text: But he knows the way with me[a]; when he has tested me[b], I will come out like gold.
translation:
  language: te
  text: కాని నా మార్గం ఆయనకు తెలుసు[a]; ఆయన నన్ను పరీక్షించినప్పుడు[b], నేను బంగారంలా బయటికి వస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు నాతో ఉన్న మార్గం తెలుసు.” హీబ్రూలో అక్షరార్థంగా, “నాతో ఉన్న మార్గం”; దీనిని “నా మార్గం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన నన్ను పరీక్షిస్తే,” లేదా “ఆయన నన్ను పరీక్షించిన తరువాత.” హీబ్రూ నిర్మాణం ఒకటి కంటే ఎక్కువ కాలసంబంధ భావాలను అనుమతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: ముందటి వచనాల్లో యోబు దేవుణ్ణి కనుగొనలేకపోవడానికీ, దేవుడు తన మార్గాన్ని ఎరిగి ఉండడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יָדַע
  choice: తెలుసు
  rationale: దేవునికి యోబు విషయమై ఉన్న ప్రస్తుత, సంపూర్ణ అవగాహనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: నాతోనున్న మార్గం
  rationale: అక్షరార్థమైన ‘నాతో ఉన్న మార్గం’ అనే అసాధారణమైన హీబ్రూ నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతూ, ‘నా మార్గం’ అనే భావాన్నీ పూర్తిగా నిరాకరించదు.
- source_word: בְּחָנַנִי
  choice: ఆయన నన్ను పరీక్షించినప్పుడు
  rationale: బంగారం అనే తరువాతి ఉపమానానికి సరిపోయేలా בחן లోని పరీక్షించడం/పరిశీలించడం అనే భావాన్ని ఇస్తుంది; కాలసంబంధ నిర్మాణంలోని కొంత అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
- source_word: כַּזָּהָב
  choice: బంగారంలా
  rationale: כ ఉపసర్గలోని పోలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵצֵא
  choice: నేను బయటికి వస్తాను
  rationale: పరీక్ష లేదా శుద్ధీకరణ ప్రక్రియనుంచి వెలువడే ఫలితాన్ని సూచిస్తూ יצא యొక్క ప్రాథమిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుని పరీక్షకూ యోబు నిర్దోషిత్వం వెల్లడికావడానికీ మధ్య సంబంధం
  choice: దేవుడు యోబు మార్గాన్ని ఎరిగి ఉన్నాడనీ, పరీక్ష ఫలితం బంగారంలా బయటికి రావడమనీ మాత్రమే అనువదించబడింది.
  alternative: దీనిని ప్రధానంగా న్యాయపరమైన నిర్దోష నిరూపణగా లేదా ప్రధానంగా నైతిక శుద్ధీకరణగా స్పష్టీకరించడం.
  rationale: బంగారం, పరీక్ష అనే రూపకం నిర్దోషిత్వం వెల్లడికావడాన్నీ శుద్ధీకరణనూ సూచించగలదు. హీబ్రూ వాక్యం తేల్చని ఈ ధార్మిక ఉద్రిక్తతను అనువాదం కూడా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నాతోనున్న మార్గం’ కొద్దిగా అసాధారణంగా ఉన్నప్పటికీ మూలంలోని నిజమైన అస్పష్టతను నిలుపుతుంది; పాదసూచిక సాధారణ ప్రత్యామ్నాయాన్ని ఇస్తుంది.
