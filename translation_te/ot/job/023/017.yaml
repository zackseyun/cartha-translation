  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: te
  text: ఎందుకంటే, చీకటి కారణంగా నేను మౌనపరచబడలేదు[a]; నా ముఖాన్ని గాఢాంధకారం కప్పినందువల్ల కూడా కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే, చీకటి కారణంగా నేను నిర్మూలం కాలేదు; నా ముఖాన్ని గాఢాంధకారం కప్పినందువల్ల కూడా కాదు.” ఈ వచనంలోని హీబ్రూ క్లిష్టంగా ఉంది. ముఖ్యంగా “నేను మౌనపరచబడలేదు/నిర్మూలం కాలేదు” అనే పదబంధం, అలాగే రెండవ భాగం “గాఢాంధకారం నా ముఖాన్ని కప్పింది” అని అర్థమా లేక “నా ఎదుట గాఢాంధకారాన్ని కప్పాడు” అని అర్థమా అనేది అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: נִצְמַתִּי
  choice: నేను మౌనమైపోలేదు
  rationale: צמת ధాతువు నిఫాల్ రూపం ‘మౌనపరచబడటం,’ ‘తొలగించబడటం,’ లేదా ‘అంతమొందించబడటం’ అనే భావాలను ఇవ్వగలదు. యోబు ఇంకా తన వేదనను పలుకుతున్న సందర్భంలో ‘మౌనమైపోలేదు’ అనేది అనుకూలమైన భావం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: చీకటి కారణంగా
  rationale: ఇక్కడ מִפְּנֵי స్థలార్థం కంటే కారణార్థాన్ని సూచించడం సహజం; חֹשֶׁךְ‌కు నేరుగా ‘చీకటి’ అని అనువదించాం.
- source_word: וּמִפָּנַי
  choice: నా ముఖాన్ని
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న פָּנִים‌ను వ్యక్తిగత నామవాచకంగా తీసుకుంటే ‘నా ముఖం’ అనే అర్థం వస్తుంది. ‘నా ఎదుట’ అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో కాపాడాం.
- source_word: כִּסָּה
  choice: కప్పినందువల్ల
  rationale: כסה యొక్క సాధారణ అర్థం ‘కప్పడం’; సమాంతర వాక్యభాగంలో కారణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ఈ రూపాన్ని వాడాం.
- source_word: אֹפֶל
  choice: గాఢాంధకారం
  rationale: אֹפֶל సాధారణ חֹשֶׁךְ కంటే దట్టమైన లేదా గాఢమైన చీకటిని సూచిస్తుంది; రెండు హీబ్రూ పదాల భేదాన్ని తెలుగులో నిలుపుతుంది.
